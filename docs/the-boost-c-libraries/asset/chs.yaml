  \ 必须返回这两条路径之一。\n\n## 容器\n\n到目前为止本中的所有示例都使用了 `boost::adjacency_list` 来定义图。本节介绍了 Boost.Graph\
  \ 提供的另外两个图容器：`boost::adjacency_matrix` 和 `boost::compressed_sparse_row_graph`。\n\
  \n\n\n\n在 Boost 1.56.0 中，`boost/graph/adjacency_matrix.hpp` 缺少一个包含文件。要使用 Boost 1.56.0\
  \ 编译 示例 31.15，“使用 `boost::adjacency_matrix` 的图”，请在包含 `boost/graph/adjacency_matrix.hpp`\
  \ 之前包含 `boost/functional/hash.hpp`。\n\n### 示例 31.15. 使用 `boost::adjacency_matrix`\
  \ 的图\n\n```cpp\n#include <boost/graph/adjacency_matrix.hpp>\n#include <array>\n\
  #include <utility>\n\nint main()\n{\n  enum { topLeft, topRight, bottomRight, bottomLeft\
  \ };\n\n  std::array<std::pair<int, int>, 4> edges{{\n    std::make_pair(topLeft,\
  \ topRight),\n    std::make_pair(topRight, bottomRight),\n    std::make_pair(bottomRight,\
  \ bottomLeft),\n    std::make_pair(bottomLeft, topLeft)\n  }};\n\n  typedef boost::adjacency_matrix<boost::undirectedS>\
  \ graph;\n  graph g{edges.begin(), edges.end(), 4};\n}\n```\n\n`boost::adjacency_matrix`\
  \ 的用法类似于 `boost::adjacency_list`（请参阅 示例 31.15，“使用 `boost::adjacency_matrix` 的图”\
  \ ）。然而，用于传递选择器的两个模板参数在 `boost::adjacency_matrix` 中并不存在。使用 `boost::adjacency_matrix`\
  \ 时不需要使用如 `boost::vecS` 和 `boost::setS` 等选择器。`boost::adjacency_matrix` 将图存储在 `matrix`\
  \ 中，其内部结构是硬编码的。你可以将 `matrix` 视为二维表格：该表格是一个正方形，其行数和列数等于图中点的数量。通过标记对应 `line` 两个端点的行和列相交的单元格，创建一个\
  \ `line`。\n\n`boost::adjacency_matrix` 的内部结构使其能够快速地添加和删除 `lines`。然而，它的内存消耗更高。经验法是，当\
  \ `lines` 的数量相对于点较少时，使用 `boost::adjacency_list`。`lines` 越多，使用 `boost::adjacency_matrix`\
  \ 就越有意义。\n\n### 示例 31.16. 使用 `boost::compressed_sparse_row_graph` 的图\n\n```cpp\n\
  #include <boost/graph/compressed_sparse_row_graph.hpp>\n#include <array>\n#include\
  \ <utility>\n\nint main()\n{\n  enum { topLeft, topRight, bottomRight, bottomLeft\
  \ };\n\n  std::array<std::pair<int, int>, 4> edges{{\n    std::make_pair(topLeft,\
  \ topRight),\n    std::make_pair(topRight, bottomRight),\n    std::make_pair(bottomRight,\
  \ bottomLeft),\n    std::make_pair(bottomLeft, topLeft)\n  }};\n\n  typedef boost::compressed_sparse_row_graph<boost::bidirectionalS>\
  \ graph;\n  graph g{boost::edges_are_unsorted_multi_pass, edges.begin(),\n    edges.end(),\
  \ 4};\n}\n```\n\n`boost::compressed_sparse_row_graph` 的用法与 `boost::adjacency_list`\
  \ 和 `boost::adjacency_matrix` 相同（请参阅 示例 31.16，“使用 `boost::compressed_sparse_row_graph`\
  \ 的图” ）。最重要的区别是图无法通过 `boost::compressed_sparse_row_graph` 进行更改。一旦创建创建，就不能添加或删除点和\
  \ `lines`。因此，`boost::compressed_sparse_row_graph` 仅在使用不可变图时才有意义。\n\n`boost::compressed_sparse_row_graph`\
  \ 只支持有向的 `lines`。你不能使用模板参数 `boost::undirectedS` 实例化 `boost::compressed_sparse_row_graph`。\n\
  \n`boost::compressed_sparse_row_graph` 主要优势是内存消耗低。如果你有一个巨大的图并且需要保持低内存消耗，`boost::compressed_sparse_row_graph`\
  \ 特别有用。\n\n# 第六部分. 通信\n\n以下库有助于与其他程序进行通信。\n\n* `Boost.Asio` 用于通过网络通信。Boost.Asio\
  \ 不仅支持网络操作。Asio 代表异步输入/输出。你可以使用此库来异步处理数据，例如，当你的程序与设备（如网卡）通信时，这些设备可以与你程序中执行的代码并发处理任务。\n\
  * `Boost.Interprocess` 用于通过共享内存进行通信。\n\n# 32. Boost.Asio\n\n本章介绍 [Boost.Asio](http://www.boost.org/libs/asio)\
  \ 库。Asio 代表异步输入/输出。该库使得异步处理数据成为可能。异步意味着当操作启动时，发起的程序不需要等待操作结束。相反，Boost.Asio 在操作结束时会通知程序。其优势是可以并发执行其他操作。\n\
  \n`Boost.Thread` 是另一个允许并发执行操作的库。`Boost.Thread` 与 `Boost.Asio` 的区别在于，`Boost.Thread`\
  \ 访问程序内部资源，而 `Boost.Asio` 访问外部资源。例如，如果你开发一个需要耗时的函数，可以在线程中调用它并让其在核心上执行。对于程序而言，线程核心是内部资源。如果你想访问外部资源，可以使用\
  \ `Boost.Asio`。\n\n网络连接是外部资源的示例。如果必须发送或接收数据，会让网卡执行操作。对于发送操作，网卡获取一个要发送数据的缓冲区；对于接收操作，网卡获取一个应该填充接收数据的缓冲区。由于网卡是程序的外部资源，它可以独立执行操作。Asio\
  \ 允许你更有效地利用可用设备。\n\n在网络上发送和接收数据在 Boost.Asio 中实现为异步操作。可以将异步操作理解为立即返回但不带结果的函数。结果稍后提供。在第一步中，启动异步操作；在第二步中，会通知程序。这种分离使得不需要阻塞函数。\n\
  \n## I/O 服务与 I/O 对象\n\n基于 Boost.Asio 的异步数据处理基于 I/O 服务和 I/O 对象。I/O 服务抽象了操作系统接口。I/O\
  \ 对象发起异步操作。这两个概念有助于清晰分离任务：I/O 服务面向操作系统 API，而 I/O 对象面向开发者需要完成的任务。\n\n作为 Boost.Asio\
  \ 的用户，你通常不会直接与 I/O 服务连接。I/O 服务由 I/O 对象管理。I/O 对象像一个注册表，列出了 I/O 服务。每个 I/O 对象知道自己的\
  \ I/O 服务，并通过 I/O 对象获取对 I/O 服务的访问。\n\nBoost.Asio 定义了 `boost::asio::io_service`，这是\
  \ I/O 服务对象的单一类。每个 Boost.Asio 程序都使用 `boost::asio::io_service` 对象。也可以也可以全局变量。\n\n\
  虽然 I/O 服务对象只有一个类，但 I/O 对象有多个类。因为 I/O 对象面向面向的，所以实例化的类取决于任务。例如，如果要在 TCP/IP 连接上发送或接收数据，可以使用类型为\
  \ `boost::asio::ip::tcp::socket` 的 I/O 对象。\n\n\n\n\n`boost::asio::steady_timer`\
  \ 就像一个闹钟。当闹钟响起时，你的程序不需要等待一个阻塞函数返回，而是会收到通知。因为 `boost::asio::steady_timer` 只是在等待一段时间时间到期，看起来似乎没有访问任何外部资源。然而，在这种情况下，外部资源是操作系统在时间段到期时通知程序的能力。这使得程序从仅为了调用阻塞函数而创建新线程中解放出来。由于\
  \ `boost::asio::steady_timer` 是一个非常简单的 I/O 对象，它将被用于介绍 Boost.Asio。\n\n### 注意\n\n\
  由于 Boost.Asio 中的一个错误，无法使用 Clang 编译以下某些示例。该错误已在 [ticket 8835](https://svn.boost.org/trac/boost/ticket/8835)\
  \ 中报告。作为变解决方法，如果你将 `std::chrono` 中的类型替换为 `boost::chrono` 中相应的类型，就可以用 Clang 编译这些示例。\n\
  \n示例 32.1, “使用 `boost::asio::steady_timer`” 创建了一个 I/O 服务对象 `ioservice`，并用它初始化 I/O\
  \ 对象 `timer`。与 `boost::asio::steady_timer` 一样，所有的 I/O 对象都期望将 I/O 服务对象作为构造函数的第一个参数。由于\
  \ `timer` 代表一个闹钟，可以向 `boost::asio::steady_timer` 的构造函数传递第二个参数，定义闹钟应该响特定时间或时间段。在\
  \ 示例 32.1, “使用 `boost::asio::steady_timer`” 中，闹钟被设置为在 3 秒后响。时间从定义 `timer` 时开始。\n\
  \n#### 示例 32.1. 使用 `boost::asio::steady_timer`\n\n```cpp\n#include <boost/asio/io_service.hpp>\n\
  #include <boost/asio/steady_timer.hpp>\n#include <chrono>\n#include <iostream>\n\
  \nusing namespace boost::asio;\n\nint main()\n{\n  io_service ioservice;\n\n  steady_timer\
  \ timer{ioservice, std::chrono::seconds{3}};\n  timer.async_wait([](const boost::system::error_code\
  \ &ec)\n    { std::cout << \"3 sec\\n\"; });\n\n  ioservice.run();\n}\n```\n\nBoost.Asio\
  \ 并不是调用一个在闹钟响起时返回的阻塞函数，而是允许你启动一个异步操作。要做到这一点，调用成员函数 `async_wait()`，它期望处理器（handler）作为唯一的参数。处理器是在异步操作结束时调用的函数或函数对象。在\
  \ 示例 32.1, “使用 `boost::asio::steady_timer`” 中，传递了一个 lambda 函数作为处理器。\n\n`async_wait()`\
  \ 会立即返回。它并不是等待三秒直到闹钟响起，而是在三秒后调用 lambda 函数。当 `async_wait()` 返回时，程序可以执行其他事情。\n\n像\
  \ `async_wait()` 这样的成员函数是非阻塞调用的。I/O 对象通常还提供阻塞成员函数作为替代。例如，你可以调用 `boost::asio::steady_timer`\
  \ 上的阻塞成员函数 `wait()`。因为这个成员函数是阻塞的，所以不需要传递处理器。`wait()` 在特定时间或时间段后返回。\n\n在 示例 32.1,\
  \ “使用 `boost::asio::steady_timer`” 中，`main()` 中的最后一条语句是对 I/O 服务对象的 `run()` 调用。这个调用是必要的，因为必须让特定特定的函数接管控制权。记住它是\n\
  \n\n\n\n如果在类型为 `boost::asio::io_service`的对象上调用成员函数 `run()`，关联的处理器将在同一线程内被调用。通过使用多个线程，程序可以多次调用\
  \ `run()`。一旦异步操作完成，I/O 服务对象将在这些线程之一中执行处理器。如果第二个操作在第一个操作完成后不久又完成，I/O 服务对象可以在不同的线程中执行处理器。现在，不仅进程之外的操作可以并发执行，进程内部的处理器也可以并发执行。\n\
  \n### 示例 32.3. I/O 服务对象使用两个线程并发执行处理器\n\n```\n#include <boost/asio/io_service.hpp>\n\
  #include <boost/asio/steady_timer.hpp>\n#include <chrono>\n#include <thread>\n#include\
  \ <iostream>\n\nusing namespace boost::asio;\n\nint main()\n{\n  io_service ioservice;\n\
  \n  steady_timer timer1{ioservice, std::chrono::seconds{3}};\n  timer1.async_wait([](const\
  \ boost::system::error_code &ec)\n    { std::cout << \"3 sec\\n\"; });\n\n  steady_timer\
  \ timer2{ioservice, std::chrono::seconds{3}};\n  timer2.async_wait([](const boost::system::error_code\
  \ &ec)\n    { std::cout << \"3 sec\\n\"; });\n\n  std::thread thread1{[&ioservice](){\
  \ ioservice.run(); }};\n  std::thread thread2{[&ioservice](){ ioservice.run(); }};\n\
  \  thread1.join();\n  thread2.join();\n}\n```\n\n上一个示例已转换为多线程程序，参见示例 32.3，“I/O 服务对象使用两个线程并发执行处理器”。通过\
  \ `std::thread`，在 `main()` 中创建了两个线程。每个线程中都对唯一的 I/O 服务对象调用了 `run()`。这使得 I/O 服务对象在异步操作完成后可以使用两个线程来执行处理器。\n\
  \n在示例 32.3，“I/O 服务对象使用两个线程并发执行处理器”中，两个闹钟都会在三秒后响铃。因为有两个线程可用，两个 lambda 函数可以并发执行。如果第二个闹钟在第一个闹钟的处理器执行时响起，则处理器可以在第二个线程中执行。如果第一个闹钟的处理器已经返回，则执行第二个处理器。\n\
  \n当然，使用线程并不总是有意义的。示例 32.3，“I/O 服务对象使用两个线程并发执行处理器”可能不会按顺序将消息写入标准输出流。相反，它们可能会混杂。两个在两个线程中并发运行的处理器共享全局资源\
  \ `std::cout`。为了避免中断，对 `std::cout` 的访问需要同步处理。如果处理器不能并发执行，线程的优势就会消失。\n\n### 示例 32.4.\
  \ 两个 I/O 服务对象各使用一个线程并发执行处理器\n\n```cpp\n#include <boost/asio/io_service.hpp>\n#include\
  \ <boost/asio/steady_timer.hpp>\n#include <chrono>\n#include <thread>\n#include\
  \ <iostream>\n\nusing namespace boost::asio;\n\nint main()\n{\n  io_service ioservice1;\n\
  \  io_service ioservice2;\n\n  steady_timer timer1{ioservice1, std::chrono::seconds{3}};\n\
  \  timer1.async_wait([](const boost::system::error_code &ec)\n    { std::cout <<\
  \ \"3 sec\\n\"; });\n\n  steady_timer timer2{ioservice2, std::chrono::seconds{3}};\n\
  \  timer2.async_wait([](const boost::system::error_code &ec)\n    { std::cout <<\
  \ \"3 sec\\n\"; });\n\n  std::thread thread1{[&ioservice1](){ ioservice1.run();\
  \ }};\n  std::thread thread2{[&ioservice2](){ ioservice2.run(); }};\n  thread1.join();\n\
  \  thread2.join();\n}\n```\n\n在单个 I/O 服务对象上反复调用 `run()` 是使基于 Boost.Asio 的程序更具扩展性的推荐方法。然而，与其为一个\
  \ I/O 服务对象提供多个线程，你也可以创建多个 I/O 服务对象。\n\n在示例 32.4，“两个 I/O 服务对象各使用一个线程并发执行处理器”中，两个类型为\
  \ `boost::asio::steady_timer` 的闹钟旁边分别使用了两个 I/O 服务对象。程序基于两个线程，每个线程绑定到一个服务对象。`timer1`\
  \ 和 `timer2` 没有绑定到同一个 I/O 服务上。\n\n在示例 32.4，“两个 I/O 服务对象各使用一个线程并发执行处理器”中，其工作方式与之前相同。对于何时使用多个\
  \ I/O 服务对象合适，无法给出通用的建议。在 Windows 上，`boost::asio::io_service` 通常基于 IOCP；在 Linux 上，它代表特定的接口。\n\
  \n## 网络编程\n\n尽管 Boost.Asio 可以异步处理任何类型的数据，但它主要用于网络编程。这是因为在 Boost.Asio 添加额外的 I/O 对象之前，就已经支持网络函数了。网络函数是异步操作的完美用例，因为通过网络传输数据可能需要很长时间，这意味着确认和错误返回可能没有发送或接收函数那么快。\n\
  \nBoost.Asio 提供了许多 I/O 对象来开发网络程序。示例 32.5，“使用 `boost::asio::tcp::socket` 的网络客户端`\
  \ 使用 `boost::asio::tcp::socket` 类与另一台计算机建立连接。该示例向 Web 服务器发送 HTTP 请求以下载首页。\n\n\n\n\
  在 `main()` 中，实例化了 `boost::asio::ip::tcp::resolver::query` 来创建一个对象 `q`。`q` 代表对名称解析器的查询，这是一个类型为\
  \ `boost::asio::ip::tcp::resolver` 的 I/O 对象。通过将 `q` 传递给 `async_resolve()`，启动了一个用于解析名称的异步操作。示例\
  \ 32.5，“一个使用 `boost::asio::ip::tcp::socket` 的网络客户端` 解析了名称 `theboostcpplibraries.com`。在异步操作启动后，在\
  \ I/O 服务对象上调用了 `run()`，将控制权交给操作系统。\n\n### 示例 32.5. 使用 `boost::asio::ip::tcp::socket`\
  \ 的网络客户端\n\n```\n#include <boost/asio/io_service.hpp>\n#include <boost/asio/write.hpp>\n\
  #include <boost/asio/buffer.hpp>\n#include <boost/asio/ip/tcp.hpp>\n#include <array>\n\
  #include <string>\n#include <iostream>\n\nusing namespace boost::asio;\nusing namespace\
  \ boost::asio::ip;\n\nio_service ioservice;\ntcp::resolver resolv{ioservice};\n\
  tcp::socket tcp_socket{ioservice};\nstd::array<char, 4096> bytes;\n\nvoid read_handler(const\
  \ boost::system::error_code &ec,\n  std::size_t bytes_transferred)\n{\n  if (!ec)\n\
  \  {\n    std::cout.write(bytes.data(), bytes_transferred);\n    tcp_socket.async_read_some(buffer(bytes),\
  \ read_handler);\n  }\n}\n\nvoid connect_handler(const boost::system::error_code\
  \ &ec)\n{\n  if (!ec)\n  {\n    std::string r =\n      \"GET / HTTP/1.1\\r\\nHost:\
  \ theboostcpplibraries.com\\r\\n\\r\\n\";\n    write(tcp_socket, buffer(r));\n \
  \   tcp_socket.async_read_some(buffer(bytes), read_handler);\n  }\n}\n\nvoid resolve_handler(const\
  \ boost::system::error_code &ec,\n  tcp::resolver::iterator it)\n{\n  if (!ec)\n\
  \    tcp_socket.async_connect(*it, connect_handler);\n}\n\nint main()\n{\n  tcp::resolver::query\
  \ q{\"theboostcpplibraries.com\", \"80\"};\n  resolv.async_resolve(q, resolve_handler);\n\
  \  ioservice.run();\n}\n```\n\n当名称解析完成后，会调用 `resolve_handler()`。该处理程序首先检查名称解析是否成功。在这种情况下，`ec`\
  \ 为 0。只有此时，才会访问 socket 以建立连接。要连接的服务器地址由第二个参数提供，其类型为 `boost::asio::ip::tcp::resolver::iterator`。该参数是名称解析的结果。\n\
  \n对 `async_connect()` 的调用之后是调用了处理程序 `connect_handler()`。同样，首先检查 `ec` 以确定是否可以建立连接。如果是，则在\
  \ socket 上调用 `async_read_some()`。通过此调用，开始读取数据。接收到的数据存储在数组 `bytes` 中，并作为第一个参数传递给\
  \ `async_read_some()`。\n\n当接收到一个或多个字节并复制到 `bytes` 时，会调用 `read_handler()`。类型为 `std::size_t`\
  \ 的参数 `bytes_transferred` 包含了接收到的字节数。按照惯例，处理程序应首先检查 `ec` 异步操作是否成功完成。只有在这种情况下，数据才会写入标准输出。\n\
  \n请注意，`read_handler()` 在数据写入 `std::cout` 之后再次调用了 `async_read_some()`。这是因为你无法确定整个首页是否已经在单次异步操作中下载并复制到\
  \ `bytes` 中。重复调用 `async_read_some()` 后重复调用 `read_handler()` 直到连接关闭，而连接关闭发生在 Web\
  \ 服务器发送了整个首页之后。此时，`read_handler()` 在 `ec` 中报告错误。此时，不再有进一步的数据写入 `std::cout`，且不再在\
  \ socket 上调用 `async_read()`。由于没有待挂的异步操作，程序退出。\n\n示例 32.6，“一个使用 `boost::asio::ip::tcp::acceptor`\
  \ 的时间服务器`是一个时间服务器。你可以使用 telnet 客户端连接以获取当前时间。之后时间服务器关闭。\n\n时间服务器使用 I/O 对象 `boost::asio::ip::tcp::acceptor`\
  \ 来接受来自另一个程序的传入连接。你必须初始化该对象，使其知道在哪个端口上使用什么协议。在示例中，使用了类型为 `boost::asio::ip::tcp::endpoint`\
  \ 的变量 `tcp_endpoint` 来告诉 `tcp_acceptor` 接受端口 2014 上的互联网协议 4 版本的传入连接。\n\n在 acceptor\
  \ 初始化后，调用了 `listen()`。调用 `listen()` 是为了让 acceptor 开始工作。\n\n\n\n\n```cpp\n#include\
  \ <boost/asio/io_service.hpp>\n#include <boost/asio/spawn.hpp>\n#include <boost/asio/write.hpp>\n\
  #include <boost/asio/buffer.hpp>\n#include <boost/asio/ip/tcp.hpp>\n#include <list>\n\
  #include <string>\n#include <ctime>\n\nusing namespace boost::asio;\nusing namespace\
  \ boost::asio::ip;\n\nio_service ioservice;\ntcp::endpoint tcp_endpoint{tcp::v4(),\
  \ 2014};\ntcp::acceptor tcp_acceptor{ioservice, tcp_endpoint};\nstd::list<tcp::socket>\
  \ tcp_sockets;\n\nvoid do_write(tcp::socket &tcp_socket, yield_context yield)\n\
  {\n  std::time_t now = std::time(nullptr);\n  std::string data = std::ctime(&now);\n\
  \  async_write(tcp_socket, buffer(data), yield);\n  tcp_socket.shutdown(tcp::socket::shutdown_send);\n\
  }\n\nvoid do_accept(yield_context yield)\n{\n  for (int i = 0; i < 2; ++i)\n  {\n\
  \    tcp_sockets.emplace_back(ioservice);\n    tcp_acceptor.async_accept(tcp_sockets.back(),\
  \ yield);\n    spawn(ioservice, [](yield_context yield)\n      { do_write(tcp_sockets.back(),\
  \ yield); });\n  }\n}\n\nint main()\n{\n  tcp_acceptor.listen();\n  spawn(ioservice,\
  \ do_accept);\n  ioservice.run();\n}\n```\n\n协程允许你创建一种与实际程序逻辑镜像的结构。异步操作不会拆分函数，因为没有处理器（handlers）来定义异步操作完成时应该发生什么。程序不再需要处理器之间相互调用，而是可以使用顺序结构。\n\
  \n在 Boost.Asio 中使用协程调用的函数是 `boost::asio::spawn()`。传递的第一个参数必须是一个 I/O 服务对象。第二个参数是要作为协程的函数。该函数必须接受一个类型为\
  \ `boost::asio::yield_context` 的对象作为唯一参数。它不能有返回值。示例 32.7, “使用 Boost.Asio 的协程` 使用\
  \ `do_accept()` 和 `do_write()` 作为协程。如果函数签名不同（如 `do_write()` 的情况所示），你必须使用像 `std::bind`\
  \ 或 lambda 表达式这样的适配器。\n\n你可以不传递处理器，而是向异步函数传递一个类型为 `boost::asio::yield_context` 的对象。`do_accept()`\
  \ 将参数 `yield` 传递给 `async_accept()`。在 `do_write()` 中，`yield` 被传递给 `async_write()`。这些函数调用仍然启动了异步操作，但在操作完成时不会调用处理器。相反，启动异步操作的上下文将被恢复。当这些异步操作完成时，程序将从上次停止的地方继续执行。\n\
  \n`do_accept()` 包含一个 `for` 循环。每次调用该函数时，都会向 `async_accept()` 传递一个新的套接字。一旦客户端建立连接，就会通过\
  \ `boost::asio::spawn()` 作为协程调用 `do_write()`，向客户端发送当前时间。\n\n`for` 循环使得我们很容易看出程序在退出前可以服务两个客户端。由于示例是基于协程的，异步操作的重复执行可以在\
  \ `for` 循环中实现。这提高了程序的可读性，因为你不需要追踪对处理器的潜在调用，以确定最后一个异步操作何时完成。如果时间服务器需要支持两个两个客户端，只需调整\
  \ `for` 循环即可。\n\n## 特定于平台的 I/O 对象\n\n到为止，本章中的所有示例都是平台无关的。如 `boost::asio::steady_timer`\
  \ 和 `boost::asio::ip::tcp::socket` 等 I/O 对象在所有平台上都受支持。然而，Boost.Asio 也提供了特定于平台的 I/O\
  \ 对象，因为某些异步操作仅在某些平台上可用，例如 Windows 或 Linux。示例 32.8, “使用 boost::asio::windows::object_handle`\
  \ 使用 `boost::asio::windows::object_handle`，这是仅在 Windows 上可用的 I/O 对象。`RegisterWaitForObject()`\
  \ 函数允许你启动异步操作。所有由 `RegisterWaitForObject()` 接受的句柄都可以配合 `boost::asio::windows::object_handle`\
  \ 使用。通过 `wait()`，可以异步等待句柄的变化。\n\n```cpp\n#include <boost/asio/io_service.hpp>\n\
  #include <boost/asio/windows/object_handle.hpp>\n#include <boost/system/error_code.hpp>\n\
  #include <iostream>\n#include <Windows.h>\n\nusing namespace boost::asio;\nusing\
  \ namespace boost::system;\n\nint main()\n{\n  io_service ioservice;\n\n  HANDLE\
  \ file_handle = CreateFile(\".\", FILE_DIRECTORY,\n    FILE_SHARE_READ | FILE_SHARE_WRITE\
  \ | FILE_SHARE_DELETE, NULL,\n    OPEN_EXISTING, FILE_BACKUP_SEMANTICS | FILE_FLAG_OVERAPPED,\
  \ NULL);\n\n  char buffer[1024];\n  DWORD transferred;\n  OVERLAPPED overlapped;\n\
  \  ZeroMemory(&overlapped, sizeof(overlapped));\n  overlapped.hEvent = CreateEvent(NULL,\
  \ FALSE, NULL);\n  ReadDirectoryChangesW(file_handle, buffer, sizeof(buffer), FALSE,\n\
  \    FILE_NOTIFY_CHANGE_FILE_NAME, &transferred, &overlapped, NULL);\n\n  windows::object_handle\
  \ obj_handle{ioservice, overlapped.hEvent};\n  obj_handle.async_wait(&buffer, &overlapped\
  \ {\n    if (!ec)\n    {\n      DWORD transferred;\n      GetOverlappedResult(overlapped.hEvent,\
  \ &overlapped, &transferred, FALSE);\n      auto notification = reinterpret_cast<FILE_NOTIFY_INFORMATION*>(buffer);\n\
  \      std::wcout << notification->Action << '\\n';\n      std::streamsize size\
  \ = notification->FileNameLength / sizeof(wchar_t);\n      std::wcout.write(notification->FileName,\
  \ size);\n    }\n  });\n\n  ioservice.run();\n}\n```\n\n示例 32.8, “使用 boost::asio::windows::object_handle`\
  \ 使用 Windows 函数 `CreateEvent()` 创建句柄初始化 `boost::asio::windows::object_handle` 对象。该句柄是\
  \ `OVERLAPPED` 结构的一部分，其地址被传递给 `ReadDirectoryChangesW()`。Windows 使用 `OVERLAPPED`\
  \ 结构来启动异步操作。为了通过 Boost.Asio 报告异步操作的完成，在调用 `ReadDirectoryChangesW()` 之前会将事件处理器存储在\
  \ `OVERLAPPED` 结构中。该事件处理器随后传递给 `obj_handle`。当在 `obj_handle` 上调用 `async_wait()` 时，当检测到目录变化时，处理器就会执行。\n\
  \n\n\n\n\n`boost::asio::windows::overlapped_ptr` 是一个没有启动异步操作成员成员的 I/O 对象。异步操作是通过将指向内部\
  \ `OVERLAPPED` 变量的指针传递给 Windows 函数来启动的。除了 I/O 服务对象外，`boost::asio::windows::overlapped_ptr`\
  \ 的构造函数还期望一个在异步操作完成后被调用的处理器（handler）。\n\n示例 32.9，“使用 `boost::asio::windows::overlapped_ptr`”](#part0057.html_ex.asio_09\
  \ \"Example 32.9. Using boost::asio::windows::overlapped_ptr\") 使用 `boost::asio::use_service()`\
  \ 来获取 I/O 服务对象 `ioservice` 中服务的引用。`boost::asio::use_service()` 是一个函数模板。你想要获取的 I/O\
  \ 服务类型必须作为模板参数传递。在示例中，传递了 `boost::asio::detail::io_service_impl`。这种类型的 I/O 服务最接近操作系统。在\
  \ Windows 上，`boost::asio::detail::io_service_impl` 使用 IOCP，而在 Linux 上它使用 `epoll()`。`boost::asio::detail::io_service_impl`\
  \ 是一个类型定义，在 Windows 上被设置为 `boost::asio::detail::win_iocp_io_service`，在 Linux 上被设置为\
  \ `boost::asio::detail::task_io_service`。\n\n`boost::asio::detail::win_iocp_io_service`\
  \ 提供成员函数 `register_handle()` 将句柄链接到 IOCP 句柄。`register_handle()` 调用 Windows 函数 `CreateIoCompletionPort()`。该调用对于示例的正确运行是必要的。`CreateFileA()`\
  \ 返回的句柄只有在链接到 IOCP 句柄后才能通过 `overlapped` 传递给 `ReadDirectoryChangesW()`。\n\n示例 32.9，“使用\
  \ `boost::asio::windows::overlapped_ptr`”](#part0057.html_ex.asio_09 \"Example 32.9.\
  \ Using boost::asio::windows::overlapped_ptr\")检查 `ReadDirectoryChangesW()` 是否失败。如果\
  \ `ReadDirectoryChangesW()` 失败，则在 `overlapped` 上调用 `complete()` 来完成 Boost.Asio 的异步操作。传递给\
  \ `complete()` 的参数会被转发给处理器。\n\n如果 `ReadDirectoryChangesW()` 成功，则调用 `release()`。此时，异步操作处于挂起状态，只有在通过\
  \ Windows 函数 `ReadDirectoryChangesW()` 启动的操作完成后，才会完成。\n\n### 示例 32.9. 使用 `boost::asio::windows::overlapped_ptr`\n\
  \n```cpp\n#include <boost/asio/io_service.hpp>\n#include <boost/asio/windows/overlapped_ptr.hpp>\n\
  #include <boost/system/error_code.hpp>\n#include <iostream>\n#include <Windows.h>\n\
  \nusing namespace boost::asio;\nusing namespace boost::system;\n\nint main()\n{\n\
  \  io_service ioservice;\n\n  HANDLE file_handle = CreateFileA(\".\", FILE_LIST_DIRECTORY,\n\
  \    FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE, NULL,\n    OPEN_EXISTING,\
  \ FILE_FLAG_BACKUP_SEMANTICS | FILE_FLAG_OVERAPPED, NULL);\n\n  error_code ec;\n\
  \  auto &io_service_impl = use_service<detail::io_service_impl>(ioservice);\n  io_service_impl.register_handle(file_handle,\
  \ ec);\n\n  char buffer[1024];\n  auto handler = &buffer {\n    if (!ec)\n    {\n\
  \      auto notification =\n        reinterpret_cast<FILE_NOTIFY_INFORMATION*>(buffer);\n\
  \      std::wcout << notification->Action << '\\n';\n      std::streamsize size\
  \ = notification->FileNameLength / sizeof(wchar_t);\n      std::wcout.write(notification->FileName,\
  \ size);\n    }\n  };\n  windows::overlapped_ptr overlapped{ioservice, handler};\n\
  \  DWORD transferred;\n  BOOL ok = ReadDirectoryChangesW(file_handle, buffer, sizeof(buffer),\n\
  \    FALSE, FILE_NOTIFY_CHANGE_FILE_NAME, &transferred, overlapped.get(),\n    NULL);\n\
  \  int last_error = GetLastError();\n  if (!ok && last_error != ERROR_IO_PENDING)\n\
  \  {\n    error_code ec{last_error, error::get_system_category()};\n    overlapped.complete(ec,\
  \ 0);\n  }\n  else\n  {\n    overlapped.release();\n  }\n\n  ioservice.run();\n\
  }\n```\n\n### 示例 32.10. 使用 `boost::asio::posix::stream_descriptor`\n\n```cpp\n#include\
  \ <boost/asio/io_service.hpp>\n#include <boost/asio/posix/stream_descriptor.hpp>\n\
  #include <boost/asio/write.hpp>\n#include <boost/system/error_code.hpp>\n#include\
  \ <iostream>\n#include <unistd.h>\n\nusing namespace boost::asio;\n\nint main()\n\
  {\n  io_service ioservice;\n\n  posix::stream_descriptor stream{ioservice, STDOUT_FILENO};\n\
  \  auto handler = [](const boost::system::error_code&, std::size_t) {\n    std::cout\
  \ << \"Hello!\\n\";\n  };\n  async_write(stream, boost::buffer(\"Hello!\"), handler);\n\
  \n  ioservice.run();\n}\n```\n\n示例 32.10，“使用 `boost::asio::posix::stream_descriptor`](](#part0057.html_ex.asio_10\
  \ \"Example 32.10. Using boost::asio::posix::stream_descriptor\") 为 POSIX 平台引入了一个\
  \ I/O 对象。`boost::asio::posix::stream_descriptor` 可以用文件描述符初始化。`boost::asio::posix::stream_descriptor`\
  \ 使用文件描述符进行初始化。\n\n# 33 Boost.Interprocess\n\n进程间通信描述了运行在同一台计算机上的进程之间交换数据的机制。它不包括网络。虽然不同操作系统之间的进程间通信概念相似，但接口可能会有很大差异。本章介绍了该库](http://www.boost.org/libs/interprocess)，该库涵盖了\
  \ Boost.asio。\n\n## 共享内存\n\n共享内存通常是最快的进程间通信形式。它提供了一个进程间共享的内存区域。一个进程可以向该区域写入数据，另一个进程可以读取它。\n\
  \n在 Boost.Interprocess 中，使用 `boost::interprocess::shared_memory_object` 类来表示共享内存。使用该类需要包含头文件\
  \ `boost/interprocess/shared_memory_object.hpp`。\n\n### 示例 33.1. 创建共享内存\n\n```cpp\n\
  #include <boost/interprocess/shared_memory_object.hpp>\n#include <iostream>\n\n\
  using namespace boost::interprocess;\n\nint main()\n{\n  shared_memory_object shdmem{open_or_create,\
  \ \"Boost\", read_write};\n  shdmem.truncate(1024);\n  std::cout << shdmem.get_name()\
  \ << '\\n';\n  offset_t size;\n  if (shdmem.get_size(size))\n    std::cout << size\
  \ << '\\n';\n}\n```\n\n`boost::interprocess::shared_memory_object` 的构造函数期望三个参数。第一个参数指定是创建共享内存还是仅打开。示例\
  \ 33.1，“创建共享内存”](#part0058.split_001.html_ex.interprocess_01 \"Example 33.1. Creating\
  \ shared memory\") 处理了这两种情况。`boost::interprocess::open_or_create` 如果共享内存已存在则打开它，如果不存在则创建它。\n\
  \n打开现有的共享内存假设它已经被创建过。为了唯一标识共享内存，分配了一个名称。该名称是由传递给 `boost::interprocess::shared_memory_object`\
  \ 构造函数的第二个参数指定的。\n\n第三个参数决定了进程如何访问共享内存。在示例 33.1，“创建共享内存”](#part0058.split_001.html_ex.interprocess_01\
  \ \"Example 33.1. Creating shared memory\") 中，`boost::interprocess::read_write`\
  \ 表示具有读写权限。\n\n\n\n\n\n在创建类型为 `boost::interprocess::shared_memory_object` 的对象后，操作系统中将一个对应的共享内存块。该内存区域的大小初始为\
  \ 0。要使用该区域，调用 `truncate()` 并传入以字节为单位的共享内存大小。在示例 33.1, “创建共享内存” 中，共享内存为 1,024 字节提供了空间。只有当共享内存以\
  \ `boost::interprocess::read_write` 模式打开时，才能调用 `truncate()`。否则，将抛出类型为 `boost::interprocess::interprocess_exception`\
  \ 的异常。可以多次调用 `truncate()` 来调整共享内存的大小。\n\n在创建共享内存后，可以使用 `get_name()` 和 `get_size()`\
  \ 等成员函数来查询共享内存的名称和大小。\n\n由于共享内存用于在不同进程之间交换数据，每个进程都需要将共享内存映射到自己的地址空间中。`boost::interprocess::mapped_region`\
  \ 类用于此操作。可能让你惊讶的是，访问共享内存需要两个类（`boost::interprocess::shared_memory_object` 和 `boost::interprocess::mapped_region`）。这样做是为了让\
  \ `boost::interprocess::mapped_region` 类也能用于将其他对象映射到进程的地址空间。\n\n### 示例 33.2. 将共享内存映射到进程的地址空间\n\
  \n```\n#include <boost/interprocess/shared_memory_object.hpp>\n#include <boost/interprocess/mapped_region.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ shared_memory_object shdmem{open_or_create, \"Boost\", read_write};\n  shdmem.truncate(1024);\n\
  \  mapped_region region{shdmem, read_write};\n  std::cout << std::hex << region.get_address()\
  \ << '\\n';\n  std::cout << std::dec << region.get_size() << '\\n';\n  mapped_region\
  \ region2{shdmem, read_only};\n  std::cout << std::hex << region2.get_address()\
  \ << '\\n';\n  std::cout << std::dec << region2.get_size() << '\\n';\n}\n```\n\n\
  要使用 `boost::interprocess::mapped_region` 类，请包含头文件 `boost/interprocess/mapped_region.hpp`。必须将类型为\
  \ `boost::interprocess::shared_memory_object` 的对象作为第一个参数传递给 `boost::interprocess::mapped_region`\
  \ 的构造函数。第二个参数决定了对内存区域的访问是只读还是读写。\n\n示例 33.2, “将共享内存映射到进程的地址空间” 创建了两个类型为 `boost::interprocess::mapped_region`\
  \ 的对象。名为 Boost 的共享内存被两次映射到进程的地址空间。使用成员函数 `get_address()` 和 `get_size()` 将映射内存区域的地址和大小写入标准输出。在两种情况下，`get_size()`\
  \ 都返回 1024，但每个对象的 `get_address()` 返回值是不同的。\n\n### 注意\n\n示例 33.2, “将共享内存映射到进程的地址空间”\
  \ 以及随后的某些示例会导致 Visual C++ 2013 和 Boost 1.55.0 出现编译错误。该错误在 [ticket 9332.](https://svn.boost.org/trac/boost/ticket/9332)\
  \ 中描述。此错误在 Boost 1.56.0 中已修复。\n\n### 示例 33.3. 在共享内存中写入和读取数字\n\n```\n#include <boost/interprocess/shared_memory_object.hpp>\n\
  #include <boost/interprocess/mapped_region.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::interprocess;\n\nint main()\n{\n  shared_memory_object shdmem{open_or_create,\
  \ \"Boost\", read_write};\n  shdmem.truncate(1024);\n  mapped_region region{shdmem,\
  \ read_write};\n  int *i1 = static_cast<int*>(region.get_address());\n  *i1 = 99;\n\
  \  mapped_region region2{shdmem, read_only};\n  int *i2 = static_cast<int*>(region2.get_address());\n\
  \  std::cout << *i2 << '\\n';\n}\n```\n\n示例 33.3, “在共享内存中写入和读取数字” 使用映射的内存区域写入和读取数字。`region`\
  \ 将 99 写入共享内存。`region2` 读取共享内存中的相同位置。\n\n### 示例 33.4. 删除共享内存\n\n```cpp\n#include\
  \ <boost/interprocess/shared_memory_object.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::interprocess;\n\nint main()\n{\n  bool removed = shared_memory_object::remove(\"\
  Boost\");\n  std::cout << std::boolalpha << removed << '\\n';\n}\n```\n\n要删除共享内存，`boost::interprocess::shared_memory_object`\
  \ 提供了静态成员函数 `remove()`，它接受要删除的共享内存名称作为参数（参见示例 33.4, “删除共享内存”)）。\n\n### 示例 33.5.\
  \ 使用 Windows 特有的共享内存\n\n```cpp\n#include <boost/interprocess/windows_shared_memory.hpp>\n\
  #include <boost/interprocess/mapped_region.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::interprocess;\n\nint main()\n{\n  windows_shared_memory shdmem{open_or_create,\
  \ \"Boost\", read_write, 1024};\n  mapped_region region{shdmem, read_write};\n \
  \ int *i1 = static_cast<int*>(region.get_address());\n  *i1 = 99;\n  mapped_region\
  \ region2{shdmem, read_only};\n  int *i2 = static_cast<int*>(region2.get_address());\n\
  \  std::cout << *i2 << '\\n';\n}\n```\n\n`boost::interprocess::windows_shared_memory`\
  \ 没有提供 `truncate()` 成员函数。相反，需要将共享内存的大小作为第四个参数传递给构造函数。\n\n尽管 `boost::interprocess::windows_shared_memory`\
  \ 类不可移植的且只能在 Windows 上使用，但当需要与使用这种特殊共享内存的现有 Windows 程序交换数据时，它是非常有用的。\n\n\n\n\n上一节引入了\
  \ `boost::interprocess::shared_memory_object` 类，它可以用于创建和管理共享内存。在实践中，该类很少被使用，因为它要求程序从共享内存中直接读写单个字节。C++\
  \ 风格倾向于创建类对象，并隐藏数据在内存中存储的位置和方式的细节。\n\nBoost.Interprocess 提供了 `boost::interprocess::managed_shared_memory`\
  \ 类（该类定义在 `boost/interprocess/managed_shared_memory.hpp` 中），用于支持托管共享内存。该类允许你实例化内存位于共享内存中的对象，使得这些对象对任何访问相同共享内存的程序自动可用。\n\
  \n### 示例 33.6. 使用托管共享内存\n\n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ shared_memory_object::remove(\"Boost\");\n  managed_shared_memory managed_shm{open_or_create,\
  \ \"Boost\", 1024};\n  int *i = managed_shm.construct<int>(\"Integer\")(99);\n \
  \ std::cout << *i << '\\n';\n  std::pair<int*, std::size_t> p = managed_shm.find<int>(\"\
  Integer\");\n  if (p.first)\n    std::cout << *p.first << '\\n';\n}\n```\n\n示例 33.6,\
  \ “使用托管共享内存” 打开了大小为 1024 字节、名为 `Boost` 的共享内存。如果共享内存不存在，它将被自动创建。\n\n在普通共享内存中，直接访问单个字节来读写数据。托管共享内存使用如\
  \ `construct()` 等成员函数，它期望一个类型作为模板参数（在 示例 33.6, “使用托管共享内存” 中为 `int`）。该成员函数期望一个名称来表示在托管内存中创建的对象。示例\
  \ 33.6, “使用托管共享内存” 使用了名称 `Integer`。\n\n由于 `construct()` 返回一个代理对象，因此可以将参数传递给它以初始化创建的对象。该语法看起来类似于调用构造函数。这确保了对象可以在托管内存中被创建并初始化。\n\
  \n要访问托管内存中的特定对象，可以使用成员函数 `find()`。通过将对象的名称传递给 `find()`，`find()` 将返回对象的指针，或者在未找到给定名称的对象时返回\
  \ 0。如 示例 33.6, “使用托管共享内存” 所示，`find()` 返回一个类型为 `std::pair` 对象。对象的指针作为成员变量 `first`\
  \ 提供。示例 33.7, “在共享内存中创建数组” 显示了在 `second` 中接收到的内容。\n\n### 示例 33.7. 在共享内存中创建数组\n\n\
  ```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n#include <iostream>\n\
  \nusing namespace boost::interprocess;\n\nint main()\n{\n  shared_memory_object::remove(\"\
  Boost\");\n  managed_shared_memory managed_shm{open_or_create, \"Boost\", 1024};\n\
  \  int *i = managed_shm.construct<int>(\"Integer\")10;\n  std::cout << *i << '\\\
  n';\n  std::pair<int*, std::size_t> p = managed_shm.find<int>(\"Integer\");\n  if\
  \ (p.first)\n  {\n    std::cout << *p.first << '\\n';\n    std::cout << p.second\
  \ << '\\n';\n  }\n}\n```\n\n在 示例 33.7, \"在共享内存中创建数组” 中，通过在调用 `construct()` 之后提供方括号括起来的值\
  \ `10`，创建了一个包含十个 `int` 类型元素的数组。该相同的 `10` 通过成员变量 `second` 写入标准输出。得益于此成员变量，你可以判断由\
  \ `find()` 返回的对象是单个对象还是数组。对于前者，`second` 被设置为 1；而对于后者，`second` 被设置为数组中元素的数量。\n\n\
  请注意，数组中的所有十个元素都用值 99 进行初始化。如果你想用不同的值初始化元素，请传递一个迭代器。如果托管内存中已经存在具有给定名称的对象，则 `construct()`\
  \ 将失败。在这种情况下，`construct()` 返回 0 且不发生初始化。若要使用已存在的对象，请使用成员函数 `find_or_construct()`，它会返回指向现有对象的指针或创建一个新对象。\n\
  \n还有其他情况会导致 `construct()` 失败。示例 33.8, \"异常类型为 `boost::interprocess::bad_alloc` 的异常`\
  \ 尝试创建一个包含 4096 个元素的 `int` 数组。然而，托管内存只有 1024 字节。这导致抛出了 `boost::interprocess::bad_alloc`\
  \ 异常。一旦在托管内存中创建了对象，可以使用成员函数 `destroy()` 删除它们。\n\n### 示例 33.8. 异常类型为 `boost::interprocess::bad_alloc`\
  \ 的异常\n\n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n#include\
  \ <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n  try\n \
  \ {\n    shared_memory_object::remove(\"Boost\");\n    managed_shared_memory managed_shm{open_or_create,\
  \ \"Boost\", 1024};\n    int *i = managed_shm.construct<int>(\"Integer\")4096;\n\
  \  }\n  catch (boost::interprocess::bad_alloc &ex)\n  {\n    std::cerr << ex.what()\
  \ << '\\n';\n  }\n}\n```\n\n在 示例 33.9, “在共享内存中移除对象” 中，将删除对象的名称作为唯一参数传递给 `destroy()`。可以检查类型为\
  \ `bool` 的返回值来验证对象是否成功找到并删除。因为如果找到对象会被删除，因此返回 `false` 表示未找到给定名称的对象。\n\n成员函数 `destroy_ptr()`\
  \ 可用于传递托管内存中对象的指针。它也可以用于删除数组。\n\n### 示例 33.9. 在共享内存中移除对象\n\n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ shared_memory_object::remove(\"Boost\");\n  managed_shared_memory managed_shm{open_or_create,\
  \ \"Boost\", 1024};\n  int *i = managed_shm.find_or_construct<int>(\"Integer\")(99);\n\
  \  std::cout << *i << '\\n';\n  managed_shm.destroy<int>(\"Integer\");\n  std::pair<int*,\
  \ std::size_t> p = managed_shm.find<int>(\"Integer\");\n  std::cout << p.first <<\
  \ '\\n';\n}\n```\n\n\n\n\n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n\
  #include <boost/interprocess/allocators/allocator.hpp>\n#include <boost/interprocess/containers/string.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ shared_memory_object::remove(\"Boost\");\n  managed_shared_memory managed_shm{open_or_create,\
  \ \"Boost\", 1024};\n  typedef allocator<char,\n    managed_shared_memory::segment_manager>\
  \ CharAllocator;\n  typedef basic_string<char, std::char_traits<char>, CharAllocator>\
  \ string;\n  string *s = managed_shm.find_or_construct<string>(\"String\")(\"Hello!\"\
  ,\n    managed_shm.get_segment_manager());\n  s->insert(5, \", world\");\n  std::cout\
  \ << *s << '\\n';\n}\n```\n\n为了创建一个在与其所在的同一托管共享内存内存中分配内存的字符串，必须定义相应的类型。新的字符串类型必须使用由\
  \ Boost.Interprocess 提供的分配器，而不是标准库提供的默认分配器。\n\n为此，Boost.Interprocess 提供了 `boost::interprocess::allocator`\
  \ 类，它定义在 `boost/interprocess/allocators/allocator.hpp` 中。通过该类，可以创建一个内部使用托管共享内存的段管理器（segment\
  \ manager）的分配器。段管理器负责管理托管共享内存块内的内存。使用新创建的分配器，可以定义相应的字符串类型。如上所示，使用 `boost::interprocess::basic_string`\
  \ 代替 `std::basic_string`。新类型——在示例 33.10, “将字符串放入共享内存”）中被称为 `string`——基于 `boost::interprocess::basic_string`，并通过其分配器访问段管理器。为了让通过调用\
  \ `find_or_construct()` 创建的特定 `string` 实例知道它应该访问哪个段管理器，请将相应段管理器的指针作为第二个参数传递给构造函数。\n\
  \nBoost.Interprocess 提供了标准库中许多其他容器的实现。例如，`boost::interprocess::vector` 和 `boost::interprocess::map`\
  \ 分别定义在 `boost/interprocess/containers/vector.hpp` 和 `boost/interprocess/containers/map.hpp`\
  \ 中。\n\n请注意，来自 Boost.Container 的容器支持 Boost.Interprocess 并可以放入共享内存。它们可以替代 `boost::interprocess`\
  \ 中的容器。Boost.Container 引入自第 20 章，*Boost.Container]。当不同的进程访问同一个托管共享内存时，创建、查找和销毁对象等操作会自动同步。如果两个程序尝试在托管共享内存中创建不同名称的对象，访问将相应地进行序列化。要一次性执行多个操作而不被来自不同进程的操作中断，请使用成员函数\
  \ `atomic_func()`（参见示例 33.11, “托管共享内存上的原子访问`）。\n\n## 示例 33.11. 托管共享内存上的原子访问\n\n\
  ```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n#include <functional>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nvoid construct_objects(managed_shared_memory\
  \ &managed_shm)\n{\n  managed_shm.construct<int>(\"Integer\")(99);\n  managed_shm.construct<float>(\"\
  Float\")(14);\n}\n\nint main()\n{\n  shared_memory_object::remove(\"Boost\");\n\
  \  managed_shared_memory managed_shm{open_or_create, \"Boost\", 1024};\n  auto atomic_construct\
  \ = std::bind(construct_objects, std::ref(managed_shm));\n  managed_shm.atomic_func(atomic_construct);\n\
  \  std::cout << *managed_shm.find<int>(\"Integer\").first << '\\n';\n  std::cout\
  \ << *managed_shm.find<float>(\"Float\").first << '\\n';\n}\n```\n\n`atomic_func()`\
  \ 期望的唯一参数是一个无参数且无返回值的函数。传递的函数调用的方式将确保对托管共享内存的排他访问。然而，只有当所有访问托管共享内存的其他进程也使用 `atomic_func()`\
  \ 时，才能确保排他访问。如果另一个进程拥有托管共享内存内某个对象的指针，它可以使用该指针访问并修改该对象。\n\nBoost.Interprocess 也可以用于同步对象访问。由于\
  \ Boost.Interprocess 并不知道在特定时间谁可以访问单个对象，因此需要显式地处理同步。本节将介绍为同步提供的类。\n\n## 同步\n\nBoost.Interprocess\
  \ 允许多个进程使用共享内存。因为共享内存根据定义在进程之间是共享的，所以 Boost.Interprocess 需要支持某种同步机制。\n\n考虑到同步时，会联想到\
  \ C++11 标准库或 Boost.Thread 中的类。但这些类只能用于同步同一进程内的线程；它们不支持不同进程之间的同步。然而，由于两种情况下的挑战是相同的，同步的概念也是相同的。\n\
  \n虽然互斥和条件变量等同步对象在多线程应用程序中位于相同的地址空间，因此对所有线程可见，但共享内存的挑战在于独立进程需要共享这些对象。例如，如果一个进程创建一个互斥锁，它需要某种方式被另一个进程访问。\n\
  \nBoost.Interprocess 提供了两种同步对象：匿名对象直接存储在共享内存中，使得对所有进程自动可用；命名对象由操作系统管理，不存储在共享内存中，可以通过名称引用。\n\
  \n### 示例 33.12. 使用 `boost::interprocess::named_mutex` 命名互斥锁\n\n```cpp\n#include\
  \ <boost/interprocess/managed_shared_memory.hpp>\n#include <boost/interprocess/sync/named_mutex.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ managed_shared_memory managed_shm{open_or_create, \"shm\", 1024};\n  int *i =\
  \ managed_shm.find_or_construct<int>(\"Integer\")();\n  named_mutex named_mtx{open_or_create,\
  \ \"mtx\"};\n  named_mtx.lock();\n  ++(*i);\n  std::cout << *i << '\\n';\n  named_mtx.unlock();\n\
  }\n```\n\n示例 33.12, “使用 `boost::interprocess::named_mutex` 命名互斥锁` 使用 `boost::interprocess::named_mutex`\
  \ 类创建并使用命名互斥锁，该类定义在 `boost/interprocess/sync/named_mutex.hpp` 中。\n\n`boost::interprocess::named_mutex`\
  \ 的构造函数期望一个参数来指定是创建还是打开互斥锁，以及互斥锁的名称。任何知道名称的进程都可以打开同一个互斥锁。为了访问共享内存中的数据，程序需要通过调用成员函数\
  \ `lock()` 获取互斥锁的所有权。由于互斥锁只能被一个进程拥有，另一个进程可能需要等待直到 `unlock()`()`。一旦进程获得了互斥锁的所有权，它就对互斥锁保护的资源具有排他访问权限。在示例\
  \ 33.12, “使用 `boost::interprocess::named_mutex` 命名互斥锁`中，资源是一个类型为 `int` 的变量，会被递增并输出到标准输出流。\n\
  \n如果多次启动示例程序，每个实例打印的值都将比上一个值增加 1。得益于互斥锁，不同进程之间对共享内存以及变量本身的访问是同步的。\n\n\n\n\n\nExample\
  \ 33.13, “Using an anonymous mutex with `interprocess_mutex`` 使用类型为 `boost::interprocess::interprocess_mutex`\
  \ 的匿名互斥量，该类型定义在 `boost/interprocess/sync/interprocess_mutex.hpp` 中。为了让所有进程都能访问该互斥量，将其存储在共享内存中。\n\
  \n### Example 33.13. Using an anonymous mutex with `interprocess_mutex`\n\n```cpp\n\
  #include <boost/interprocess/managed_shared_memory.hpp>\n#include <boost/interprocess/sync/interprocess_mutex.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ managed_shared_memory managed_shm{open_or_create, \"shm\", 1024};\n  int *i =\
  \ managed_shm.find_or_construct<int>(\"Integer\")();\n  interprocess_mutex *mtx\
  \ =\n    managed_shm.find_or_construct<interprocess_mutex>(\"mtx\")();\n  mtx->lock();\n\
  \  ++(*i);\n  std::cout << *i << '\\n';\n  mtx->unlock();\n}\n```\n\nExample 33.13,\
  \ “Using an anonymous mutex with `interprocess_mutex`` 的行为与上一个完全相同。唯一的区别是互斥量，它现在直接存储在共享内存中。这可以通过\
  \ `boost::interprocess::managed_shared_memory` 类的成员函数 `construct()` 或 `find_or_construct()`\
  \ 实现。\n\n除了 `lock()` 之外，`boost::interprocess::named_mutex` 和 `boost::interprocess::interprocess_mutex`\
  \ 都提供了成员函数 `try_lock()` 和 `timed_lock()`。它们的行为与标准库和 Boost.Thread 中的对应完全一致。如果需要递归互斥量，Boost.Interprocess\
  \ 提供了两个类：`boost::interprocess::named_recursive_mutex` 和 `boost::interprocess::interprocess_recursive_mutex`。\n\
  \n互斥量保证了对共享资源的独占访问，而条件变量则控制谁在何时拥有独占访问权限。通常，Boost.Interprocess 提供的条件变量工作方式与 C++11\
  \ 标准库和 Boost.Thread 提供的类似。它们具有类似的接口，使得这些库的用户在 Boost.Interprocess 中使用这些变量时感到非常熟悉。\n\
  \n### Example 33.14. Using a named condition with `boost::interprocess::named_condition`\n\
  \n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n#include <boost/interprocess/sync/named_mutex.hpp>\n\
  #include <boost/interprocess/sync/named_condition.hpp>\n#include <boost/interprocess/sync/scoped_lock.hpp>\n\
  #include <iostream>\n\nusing namespace boost::interprocess;\n\nint main()\n{\n \
  \ managed_shared_memory managed_shm{open_or_create, \"shm\", 1024};\n  int *i =\
  \ managed_shm.find_or_construct<int>(\"Integer\")(0);\n  named_mutex named_mtx{open_or_create,\
  \ \"mtx\"};\n  named_condition named_cnd{open_or_create, \"cnd\"};\n  scoped_lock<named_mutex>\
  \ lock{named_mtx};\n  while (*i < 10)\n  {\n    if (*i % 2 == 0)\n    {\n      ++(*i);\n\
  \      named_cnd.notify_all();\n      named_cnd.wait(lock);\n    }\n    else\n \
  \   {\n      std::cout << *i << std::endl;\n      ++(*i);\n      named_cnd.notify_all();\n\
  \      named_cnd.wait(lock);\n    }\n  }\n  named_cnd.notify_all();\n  shared_memory_object::remove(\"\
  shm\");\n  named_mutex::remove(\"mtx\");\n  named_condition::remove(\"cnd\");\n\
  }\n```\n\nExample 33.14, “Using a named condition with `boost::interprocess::named_condition`\
  \ 使用类型为 `boost::interprocess::named_condition` 的条件变量，该类型定义在 `boost/interprocess/sync/named_condition.hpp`\
  \ 中。由于它是命名变量，因此不需要存储在共享内存中。\n\n应用程序使用 `while` 循环来增加 `int` 类型的变量，该变量存储在共享内存中。虽然变量在每次循环迭代中都会递增，但它每隔一次迭代才会写入标准输出流——即只写入奇数。\n\
  \n每当变量递增 1 时，就会调用条件变量 `named_cnd` 的成员函数 `wait()`。一个锁——在 Example 33.14, “Using a\
  \ named condition with `boost::interprocess::named_condition`——被传递给这个成员函数。这是基于在析构函数内部获取互斥量所有权的\
  \ RAII 模式。\n\n正如存在两种类型的互斥量（必须存储在共享内存中的匿名类型和命名类型）一样，条件变量也有两种。Example 33.15, “Using\
  \ an anonymous condition with `interprocess_condition` 是使用匿名条件变量对上一个示例的重写。\n\n###\
  \ Example 33.15. Using an anonymous condition with `interprocess_condition`\n\n\n\
  \n\n\n```cpp\n#include <boost/interprocess/managed_shared_memory.hpp>\n#include\
  \ <boost/interprocess/sync/interprocess_mutex.hpp>\n#include <boost/interprocess/sync/interprocess_condition.hpp>\n\
  #include <boost/interprocess/sync/scoped_lock.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::interprocess;\n\nint main()\n{\n  managed_shared_memory managed_shm{open_or_create,\
  \ \"shm\", 1024};\n  int *i = managed_shm.find_or_construct<int>(\"Integer\")(0);\n\
  \  interprocess_mutex *mtx =\n    managed_shm.find_or_construct<interprocess_mutex>(\"\
  mtx\")();\n  interprocess_condition *cnd =\n    managed_shm.find_or_construct<interprocess_condition>(\"\
  cnd\")();\n  scoped_lock<interprocess_mutex> lock{*mtx};\n  while (*i < 10)\n  {\n\
  \    if (*i % 2 == 0)\n    {\n      ++(*i);\n      cnd->notify_all();\n      cnd->wait(lock);\n\
  \    }\n    else\n    {\n      std::cout << *i << std::endl;\n      ++(*i);\n  \
  \    cnd->notify_all();\n      cnd->wait(lock);\n    }\n  }\n  cnd->notify_all();\n\
  \  shared_memory_object::remove(\"shm\");\n}\n```\n\n示例 33.15, “使用 `interprocess_condition`\
  \ 使用匿名条件`](# 的工作方式与上一个完全相同，并且也需要启动两次将 `int` 变量增加十次。\n\n除了互斥锁和条件变量外，Boost.Interprocess\
  \ 还支持信号量和文件锁。信号量与条件变量类似，区别在于它们不区分两种状态；相反，它们基于计数器。文件锁的行为类似于互斥锁，但它们被用于硬盘上的文件，而不是内存中的对象。\n\
  \n正如 C++11 标准库和 Boost.Thread 区分不同类型的互斥锁和锁一样，Boost.Interprocess 提供了多种互斥锁和锁。例如，互斥锁可以是独占的也可以是非独占的。如果多个进程需要同时读取数据，这将非常有帮助，因为只有在写入数据时才需要独占互斥锁。提供了不同的锁类来将\
  \ RAII 模式应用于单个互斥锁上。\n\n除非使用匿名同步对象，否则名称应该是独唯一的。尽管互斥锁和条件变量是基于不同类的对象，但这对于 Boost.Interprocess\
  \ 封装的依赖于操作系统的接口可能并不一定成立。在 Windows 上，互斥锁和条件变量使用相同的操作系统函数。如果两个对象（每个类型一个）使用相同的名称，程序在\
  \ Windows 上的行为将不正确。\n\n# 第七部分。流与文件\n\n以下库有助于处理流和文件的操作。\n\n- `Boost.IOStreams` 提供了远超标准库所提供的流。Boost.IOStreams\
  \ 允许你访问更多的流，以便从许多不同的源和汇点读写数据。此外，过滤器（filters）能够实现各种操作，例如在读取或写入时对数据进行压缩/解压缩。\n- `Boost.Filesystem`\
  \ 提供了对文件系统的访问。通过 Boost.Filesystem，你可以例如复制文件或遍历目录中的文件。\n\n# 34. Boost.IOStreams\n\
  \n本章介绍了 [Boost.IOStreams.](http://www.boost.org/libs/iostreams) 库。Boost.IOStreams\
  \ 将标准库中著名的流拆分为更小的组件。该库定义了两概念：`device`（设备），描述数据源和汇点；以及 `stream`（流），描述基于标准库接口的格式化输入/输出接口。由\
  \ Boost.IOStreams 定义的流不会自动连接到数据源或汇点。\n\nBoost.IOStreams 提供了这两个概念的众多实现。例如，存在设备 `boost::iostreams::mapped_file`，它可以将文件部分或完全加载到内存中。流\
  \ `boost::iostreams::stream` 可以连接到像 `boost::iostreams::mapped_file` 的设备，使用熟悉的流操作符\
  \ `operator<<` 和 `operator>>` 来读写数据。\n\n除了 `boost::iostreams::stream` 之外，Boost.IOStreams\
  \ 还提供了流 `boost::iostreams::filtering_stream`，允许你添加数据过滤器。例如，你可以使用 `boost::iostreams::gzip_compressor`\
  \ 写入 GZIP 格式压缩的数据。\n\nBoost.IOStreams 还可以用于连接到特定平台的对象。该库提供了连接到 Windows 句柄或文件描述符的设备。通过这种方式，底层\
  \ API 的对象可以在平台无关的 C++ 代码中使用。\n\nBoost.IOStreams 提供的类和函数定义在 `boost::iostreams` 命名空间中。没有主头文件。由于\
  \ Boost.IOStreams 包含非头文件内容，因此必须经过预编译。这可能很重要，因为取决于 Boost.IOStreams 预编译的方式，某些功能可能会缺失。\n\
  \n## 设备 (Devices)\n\n设备是提供对通常进程之外的对象（例如文件）的读写访问的类。然而，你也可以将内部对象（如数组）作为设备。\n\n设备只是具有成员函数\
  \ `read()` 或 `write()` 的类。设备可以连接到流，以便你可以读取和写入数据，而不是使用 `read()` 和 `write()` 函数。\n\
  \n示例 34.1. 使用 `boost::iostreams::array_sink` 使用数组\n\n```cpp\n#include <boost/iostreams/device/array.hpp>\n\
  #include <boost/iostreams/stream.hpp>\n#include <iostream>\n\nusing namespace boost::iostreams;\n\
  \nint main()\n{\n  char buffer[16];\n  array_sink sink{buffer};\n  stream<array_sink>\
  \ os{sink};\n  os << \"Boost\" << std::flush;\n}\n```\n\n示例 34.1, “使用 `boost::iostreams::array_sink`\
  \ 使用数组作为设备`](# 使用 `boost::iostreams::array_sink` 向数组写入数据。数组作为 `boost::iostreams::stream`\
  \ 构造函数的参数。设备类型作为模板参数。示例使用 `operator<<` 将“Boost”写入流。流将数据传递给设备。由于设备连接到数组，“Boost”存储在数组中。由于数组的内容被写入标准输出，当你运行示例时，`Boost`\
  \ 将显示。\n\n示例 34.2. 使用 `boost::iostreams::array_source` 使用数组作为设备\n\n```cpp\n#include\
  \ <boost/iostreams/device/array.hpp>\n#include <boost/iostreams/stream.hpp>\n#include\
  \ <string>\n#include <iostream>\n\nusing namespace boost::iostreams;\n\nint main()\n\
  {\n  char buffer[16];\n  array_sink sink{buffer};\n  stream<array_sink> os{sink};\n\
  \  os << \"Boost\" << std::endl;\n\n  array_source source{buffer};\n  stream<array_source>\
  \ is{source};\n  std::string s;\n  is >> s;\n  std::cout << s << '\\n';\n}\n```\n\
  \n示例 34.2, “使用 `boost::iostreams::array_source` 使用数组作为设备`](# 基于上一个示例。使用 `boost::iostreams::array_sink`\
  \ 写入数组的字符串通过 `boost::iostreams::array_source` 读取。\n\n`boost::iostreams::array_source`\
  \ 的用法类似于 `boost::iostreams::array_sink`。虽然 `boost::iostreams::array_sink` 只支持写入操作，但\
  \ `boost::iostreams::array_source` 只支持读取。`boost::iostreams::array` 同时支持读写操作。\n\n\
  请注意，boost::iostreams::array_source` 和 `boost::iostreams::array_sink` 接收数组的引用。在设备仍使用期间，数组不能被销毁。\n\
  \n\n\n\n\n# 示例 34.3，“使用 `boost::iostreams::back_insert_device` 将 vector 作为设备`](#part0062_split_001.html_ex.iostreams_03\
  \ \"Example 34.3. Using a vector as a device with boost::iostreams::back_insert_device\"\
  ) 使用类型为 `boost::iostreams::back_insert_device` 的设备，而不是 `boost::iostreams::array_sink`。该设备可以将数据写入到任何提供成员函数\
  \ `insert()` 的容器中。设备通过调用此成员函数将数据转发到容器。\n\n该示例使用 `boost::iostreams::back_insert_device`\
  \ 向 `vector` 写入“Boost”。之后，从 `boost::iostreams::array_source` 读取“Boost”。vector 的起始地址和大小被作为参数传递给\
  \ `boost::iostreams::array_source` 的构造函数。\n\n示例 34.3，“使用 `boost::iostreams::back_insert_device`\
  \ 将 vector 作为设备` 显示了 `Boost`。\n\n## 示例 34.3. 使用 `boost::iostreams::back_insert_device`\
  \ 将 vector 作为设备\n\n```cpp\n#include <boost/iostreams/device/array.hpp>\n#include\
  \ <boost/iostreams/device/back_inserter.hpp>\n#include <boost/iostreams/stream.hpp>\n\
  #include <vector>\n#include <string>\n#include <iostream>\n\nusing namespace boost::iostreams;\n\
  \nint main()\n{\n  std::vector<char> v;\n  back_insert_device<std::vector<char>>\
  \ sink{v};\n  stream<back_insert_device<std::vector<char>>> os{sink};\n  os << \"\
  Boost\" << std::endl;\n\n  array_source source{v.data(), v.size()};\n  stream<array_source>\
  \ is{source};\n  std::string s;\n  is >> s;\n  std::cout << s << '\\n';\n}\n```\n\
  \n# 示例 34.4，“使用 `boost::iostreams::file_source` 将文件作为设备`](#part0062_split_001.html_ex.iostreams_04\
  \ \"Example 34.4. Using a file as a device with boost::iostreams::file_source\"\
  ) 使用设备 `boost::iostreams::file_source` 读取文件。虽然之前引入的设备不提供成员函数，但 `boost::iostreams::file_source`\
  \ 提供了 `is_open()` 来测试文件是否成功打开。它还提供了成员函数 `close()` 来显式关闭文件。你不需要调用 `close()`，因为 `boost::iostreams::file_source`\
  \ 的析构函数会自动关闭文件。\n\n## 示例 34.4. 使用 `boost::iostreams::file_source` 将文件作为设备\n\n```cpp\n\
  #include <boost/iostreams/device/file.hpp>\n#include <boost/iostreams/stream.hpp>\n\
  #include <iostream>\n\nusing namespace boost::iostreams;\n\nint main()\n{\n  file_source\
  \ f{\"main.cpp\"};\n  if (f.is_open())\n  {\n    stream<file_source> is{f};\n  \
  \  std::cout << is.rdbuf() << '\\n';\n    f.close();\n  }\n}\n```\n\n除了 `boost::iostreams::file_source`，Boost.IOStreams\
  \ 还提供了设备 `boost::iostreams::mapped_file_source`，用于将文件部分或完全加载到内存中。`boost::iostreams::mapped_file_source`\
  \ 定义了一个成员函数 `data()` 来接收相应内存区域的指针。这样，就可以对文件进行随机访问，而不需要顺序读取文件。\n\n对于文件的写访问，Boost.IOStreams\
  \ 提供了设备 `boost::iostreams::file_sink` 和 `boost::iostreams::mapped_file_sink`。\n\n\
  ## 示例 34.5. 使用 `file_descriptor_source` 和 `file_descriptor_sink`\n\n```cpp\n#include\
  \ <boost/iostreams/device/file_descriptor.hpp>\n#include <boost/iostreams/stream.hpp>\n\
  #include <iostream>\n#include <Windows.h>\n\nusing namespace boost::iostreams;\n\
  \nint main()\n{\n  HANDLE handles[2];\n  if (CreatePipe(&handles[0], &handles[1],\
  \ nullptr, 0))\n  {\n    file_descriptor_source src{handles[0], close_handle};\n\
  \    stream<file_descriptor_source> is{src};\n\n    file_descriptor_sink snk{handles[1],\
  \ close_handle};\n    stream<file_descriptor_sink> os{snk};\n\n    os << \"Boost\"\
  \ << std::endl;\n    std::string s;\n    std::getline(is, s);\n    std::cout <<\
  \ s;\n  }\n}\n```\n\n# 示例 34.5，“使用 `file_descriptor_source` 和 `file_descriptor_sink`](#part0062_split_001.html_ex.iostreams_05\
  \ \"Example 34.5. Using file_descriptor_source and file_descriptor_sink\")\n\n`boost::iostreams::file_source`\
  \ 和 `boost::iostreams::file_sink` 使用 `CreatePipe()` 函数创建一个管道。管道的读写端存储在 `handles`\
  \ 中。`boost::iostreams::file_source` 和 `boost::iostreams::file_sink` 期望两个参数。第一个参数是\
  \ Windows 句柄（或者在 POSIX 系统上运行时是文件描述符）。第二个参数必须是 `boost::iostreams::close_handle` 或\
  \ `boost::iostreams::never_close`。该参数指定析构函数是否关闭 Windows 句柄。boost::iostreams::file_source`\
  \ 和 `boost::iostreams::file_sink` 将“Boost”通过管道发送到标准输出。\n\n## 过滤器\n\n除了设备，Boost.IOStreams\
  \ 还提供了过滤器，它们在设备之前对读取或写入的数据进行过滤。以下示例使用了 `boost::iostreams::filtering_istream` 和 `boost::iostreams::filtering_ostream`。它们取代了不支持过滤器的\
  \ `boost::iostreams::stream`。\n\n### 示例 34.6. 使用 `boost::iostreams::regex_filter`\n\
  \n```cpp\n#include <boost/iostreams/device/array.hpp>\n#include <boost/iostreams/filtering_stream.hpp>\n\
  #include <boost/iostreams/filter/regex.hpp>\n#include <boost/regex.hpp>\n#include\
  \ <iostream>\n\nusing namespace boost::iostreams;\n\nint main()\n{\n  char buffer[16];\n\
  \  array_sink sink{buffer};\n  filtering_ostream os;\n  os.push(regex_filter{boost::regex{\"\
  Bo+st\"}, \"C++\"});\n  os.push(sink);\n  os << \"Boost\" << std::flush;\n  os.pop();\n\
  \  std::cout.write(buffer, 3);\n}\n```\n\n# 示例 34.6，“使用 `boost::iostreams::regex_filter`](#part0063.html_ex.iostreams_06\
  \ \"Example 34.6. Using boost::iostreams::regex_filter\") 使用设备 `boost::iostreams::array_sink`\
  \ 向数组写入数据。数据通过类型为 `boost::iostreams::regex_filter` 的过滤器发送，该过滤器会替换字符。过滤器期望一个正则表达式和一个格式字符串。正则表达式描述要替换的内容。格式字符串指定了字符应替换为什么。该示例将“Boost”替换为“C++”。过滤器将匹配“Boost”中一个或多个连续的字母“o”，但不匹配零个。过滤器和设备通过\
  \ `boost::iostreams::filtering_ostream` 流连接。该类提供了一个成员函数 `push()`，将过滤器和设备传递给该函数。\n\
  \n过滤器必须在设备之前传递；顺序非常重要。一旦传递了设备，流就完整了，你不能再次调用 `push()`。\n\n\n\n\n`boost::iostreams::regex_filter`\
  \ 过滤器无法逐字符地处理数据，因为正则表达式需要查看字符组。这就是为什么 `boost::iostreams::regex_filter` 只有在写入操作完成且所有数据可用后才开始过滤。这发生在通过成员函数\
  \ `pop()` 将设备从流中移除时。示例 34.6, “使用 `boost::iostreams::regex_filter`” 在向流写入“Boost”后调用了\
  \ `pop()`。如果没有调用 `pop()`，`boost::iostreams::regex_filter` 将不会处理任何数据，也不会将数据转发到设备。\n\
  \n请注意，你不能使用未连接到设备的流。但是，如果在调用 `pop()` 之后通过 `push()` 添加设备，就可以完成一个流。\n\n示例 34.6, “使用\
  \ `boost::iostreams::regex_filter`” 显示了 `C++`。\n\n## 示例 34.7. 在 `boost::iostreams::filtering_ostream`\
  \ 中访问过滤器\n\n```cpp\n#include <boost/iostreams/device/array.hpp>\n#include <boost/iostreams/filtering_stream.hpp>\n\
  #include <boost/iostreams/filter/counter.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::iostreams;\n\nint main()\n{\n  char buffer[16];\n  array_sink sink{buffer};\n\
  \  filtering_ostream os;\n  os.push(counter{});\n  os.push(sink);\n  os << \"Boost\"\
  \ << std::flush;\n  os.pop();\n  counter *c = os.component<counter>(0);\n  std::cout\
  \ << c->characters() << '\\n';\n  std::cout << c->lines() << '\\n';\n}\n```\n\n\
  示例 34.7, “在 `boost::iostreams::filtering_ostream` 中访问过滤器” 使用了过滤器 `boost::iostreams::counter`，它可以计算字符和行。该类提供了成员函数\
  \ `characters()` 和 `lines()`。\n\n`boost::iostreams::filtering_stream` 提供了成员函数 `component()`\
  \ 来访问过滤器。必须将相应过滤器的索引作为参数传递。由于 `component()` 是模板，过滤器的类型必须作为模板参数传递。`component()` 返回指向过滤器的指针。如果作为模板参数传递了错误的过滤器类型，它将返回\
  \ 0。\n\n示例 34.7, “在 `boost::iostreams::filtering_ostream` 中访问过滤器” 向流写入了五个字符。它没有写入换行符（“\\\
  n”）。因此，示例显示了 `5` 和 `0`。\n\n## 示例 34.8. 使用 ZLIB 压缩写入和读取数据\n\n```cpp\n#include <boost/iostreams/device/array.hpp>\n\
  #include <boost/iostreams/device/back_inserter.hpp>\n#include <boost/iostreams/filtering_stream.hpp>\n\
  #include <boost/iostreams/filter/zlib.hpp>\n#include <vector>\n#include <string>\n\
  #include <iostream>\n\nusing namespace boost::iostreams;\n\nint main()\n{\n  std::vector<char>\
  \ v;\n  back_insert_device<std::vector<char>> snk{v};\n  filtering_ostream os;\n\
  \  os.push(zlib_compressor{});\n  os.push(snk);\n  os << \"Boost\" << std::flush;\n\
  \  os.pop();\n\n  array_source src{v.data(), v.size()};\n  filtering_istream is;\n\
  \  is.push(zlib_decompressor{});\n  is.push(src);\n  std::string s;\n  is >> s;\n\
  \  std::cout << s << '\\n';\n}\n```\n\n示例 34.8, “使用 ZLIB 压缩写入和读取数据” 使用了过滤器 `boost::iostreams::counter`。\n\
  \n\n\n成员函数 `generic_string()` 和 `generic_wstring()` 均以通用格式返回路径。这些是可移植路径；字符串根据 POSIX\
  \ 标准的规则进行规范化。因此，通用路径与在 Linux 上使用的路径相同。例如，斜杠被用作目录的分符。如果在 Windows 上运行 示例 35.3, “从\
  \ `boost::filesystem::path` 获取字符串形式路径”，`generic_string()` 和 `generic_wstring()`\
  \ 都会向标准输出流写入 `C:/Windows/System`。\n\n### 示例 35.3. 从 `boost::filesystem::path` 获取字符串形式路径\n\
  \n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\Windows\\\\System\"};\n\n\
  #ifdef BOOST_WINDOWS_API\n  std::wcout << p.native() << '\\n';\n#else\n  std::cout\
  \ << p.native() << '\\n';\n#endif\n\n  std::cout << p.string() << '\\n';\n  std::wcout\
  \ << p.wstring() << '\\n';\n\n  std::cout << p.generic_string() << '\\n';\n  std::wcout\
  \ << p.generic_wstring() << '\\n';\n}\n```\n\n返回原生路径的成员函数的返回值取决于程序运行的操作系统。返回通用路径的成员函数的返回值则独立于操作系统。通用路径能够独立于操作系统唯一地标识文件和目录，因此编写平台无关的代码变得简单。\n\
  \n由于 `boost::filesystem::path` 可以用不同的字符串类型初始化，因此提供了多个成员函数以不同的字符串类型检索路径。`string()`\
  \ 和 `generic_string()` 返回 `std::string` 类型的字符串，而 `wstring()` 和 `generic_wstring()`\
  \ 返回 `std::wstring` 类型的字符串。\n\n`native()` 的返回类型取决于程序编译的目标操作系统。在 Windows 上，返回类型为\
  \ `std::wstring` 的字符串。在 Linux 上，它返回类型为 `std::string` 的字符串。\n\n`boost::filesystem::path`\
  \ 的构造函数支持通用路径和依赖于平台的路径。在 示例 35.3, “从 `boost::filesystem::path` 获取字符串形式路径” 中，路径“C:\\\
  Windows\\System”是 Windows 特有的，不可移植的。请注意，因为反斜杠在 C++ 中是转义字符，所以它本身必须被转义。该路径只有在 Windows\
  \ 上运行时才能被 Boost.Filesystem 正确识别。在 Linux 等符合 POSIX 标准的操作系统上运行时，此示例调的所有成员函数将返回 `C:\\\
  Windows\\System`。由于反斜杠不是 Linux 的通用格式或原生格式分隔符，Boost.Filesystem 不会将该字符识别为文件和目录的分符。\n\
  \n宏 `BOOST_WINDOWS_API` 来自 Boost.System，如果示例在 Windows 上编译会被定义。POSIX 操作系统的相应宏是 `BOOST_POSIX_API`。\n\
  \n### 示例 35.4. 使用可移植路径初始化 `boost::filesystem::path`\n\n```cpp\n#include <boost/filesystem.hpp>\n\
  #include <iostream>\n\nusing namespace boost::filesystem;\n\nint main()\n{\n  path\
  \ p{\"/\"};\n  std::cout << p.string() << '\\n';\n  std::cout << p.generic_string()\
  \ << '\\n';\n}\n```\n\n示例 35.4, “使用可移植路径初始化 `boost::filesystem::path`` 使用可移植路径来初始化\
  \ `boost::filesystem::path`。\n\n由于 `generic_string()` 返回的是可移植路径，其值为斜杠（“/”），与初始化\
  \ `boost::filesystem::path` 时使用的相同。然而，成员函数 `string()` 根据根据平台返回不同的值。在 Windows 和 Linux\
  \ 上，它都返回 \"/”。输出相同是因为 Windows 接受斜杠作为目录分隔符，尽管它更倾向于使用反斜杠。\n\n### 示例 35.5. 访问路径的组件\n\
  \n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\Windows\\\\System\"};\n\
  \  std::cout << p.root_name() << '\\n';\n  std::cout << p.root_directory() << '\\\
  n';\n  std::cout << p.root_path() << '\\n';\n  std::cout << p.relative_path() <<\
  \ '\\n';\n  std::cout << p.parent_path() << '\\n';\n  std::cout << p.filename()\
  \ << '\\n';\n}\n```\n\n`boost::filesystem::path` 提供了多个成员函数来访问路径的某些组件。如果 示例 35.5,\
  \ “访问路径的组件” 在 Windows 上执行，`root_name()` 返回 `C:`，`root_directory()` 返回 `\\`，`root_path()`\
  \ 返回 `C:\\`，`relative_path()` 返回 `Windows\\System`，`parent_path()` 返回 `Windows`，而\
  \ `filename()` 返回 `System`。\n\n`boost::filesystem::path` 以依赖于平台的格式存储路径。要检索可移植格式的路径，需要调用\
  \ `generic_string()` 等成员函数。\n\n如果 示例 35.5, “访问路径的组件” 在 Linux 上执行，大多数成员函数将返回空字符串，因为没有根目录或目录。\n\
  \nBoost.Filesystem 提供了额外的成员函数来验证路径是否包含子字符串。这些是：`has_root_name()`、`has_root_directory()`、`has_root_path()`、`has_relative_path()`、`has_parent_path()`\
  \ 和 `has_filename()`。每个成员函数返回一个 `bool` 值。\n\n还有两个成员函数可以将文件名拆分为组件。只有在 `has_filename()`\
  \ 返回 `true` 时才调用它们。否则，它们将返回空字符串，因为没有文件名。\n\n### 示例 35.6. 获取文件名和后缀名\n\n```cpp\n#include\
  \ <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace boost::filesystem;\n\
  \nint main()\n{\n  path p{\"photo.jpg\"};\n  std::cout << p.stem() << '\\n';\n \
  \ std::cout << p.extension() << '\\n';\n}\n```\n\n示例 35.6, “获取文件名和后缀名` 为 `stem()`\
  \ 返回 `photo`，为 `extension()` 返回 `.jpg`。\n\n与其通过成员函数访问路径的组件，你还可以遍历组件。\n\n### 示例 35.7.\
  \ 遍历路径的组件\n\n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\Windows\\\\System\"\
  };\n  for (const path &pp : p)\n    std::cout << pp << '\\n';\n}\n```\n\n如果在 Windows\
  \ 上执行，示例 35.7, “遍历路径的组件” 将依次输出 `C:`、`/`、`Windows` 和 `System`。在 Linux 上，输出将为 `C:\\\
  Windows\\System`。\n\n虽然之前的示例介绍了访问路径不同组件的各种成员函数，但 示例 35.8, “使用 `operator/=` 拼接路径`\
  \ 使用成员函数来修改路径。\n\n### 示例 35.8. 使用 `operator/=` 拼接路径\n\n\n\n\n```cpp\n#include <boost/filesystem.hpp>\n\
  #include <iostream>\n\nusing namespace boost::filesystem;\n\nint main()\n{\n  path\
  \ p{\"C:\\\\\"};\n  p /= \"Windows\\\\System\";\n  std::cout << p.string() << '\\\
  n';\n}\n```\n\n使用 `operator/=`，示例 35.8, “使用 `operator/=` 拼接路径” 将一个路径追加到另一个路径之后。在\
  \ Windows 上，程序输出 `C:\\Windows\\System`。在 Linux 上，输出为 `C:\\/Windows\\System`，因为斜杠被用作文件和目录的分隔符。斜杠也是\
  \ `operator/=` 被重载的原因；毕竟，斜杠是运算符的一部分。\n\n除了 `operator/=` 之外，Boost.Filesystem 还提供了成员函数\
  \ `remove_filename()`、`replace_extension()`、`make_absolute()` 和 `make_preferred()`\
  \ 来修改路径。最后提到的那个成员函数是专门为 Windows 设计的。\n\n示例 35.9 使用 `make_preferred()` 的偏好表示法\n\n\
  ```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:/Windows/System\"};\n  std::cout\
  \ << p.make_preferred() << '\\n';\n}\n```\n\n尽管反斜杠默认用文件和目录的分隔符，但 Windows 仍然接受斜杠。因此，“C:/Windows/System”是一个合法的原生路径。通过\
  \ `make_preferred()`，此类路径可以转换为 Windows 上的偏好表示法。示例 35.9, “使用 `make_preferred()` 的偏好表示法”)\
  \ 显示为 `\"C:\\Windows\\System\"`。\n\n成员函数 `make_preferred()` 对 Linux 等符合 POSIX 标准的操作没有影响。\n\
  \n请注意，`make_preferred()` 不仅返回转换后的路径，还会修改它所调用的对象。调用后，`p` 包含 “C:\\Windows\\System”。\n\
  \n## 文件和目录\n\n`boost::filesystem::path` 提供的成员函数简单地处理字符串。它们访问路径的各个组件，将路径相互追加等。\n\n\
  为了对硬盘上的物理文件和目录进行操作，还提供了若干独立函数。它们期望一个或多个 `boost::filesystem::path` 类型的参数，并在内部调用操作系统函数。\n\
  \n在引入各种函数之前，了解在发生错误时会什么是非常重要的。所有函数都会调用可能失败的操作系统函数。因此，Boost.Filesystem 提供了两种变体，它们在发生错误时的行为不同：\n\
  \n*   第一种变体抛出类型为 `boost::filesystem::filesystem_error` 的异常。该类派自 `boost::system::system_error`，因此符合\
  \ Boost.System 框架。\n\n*   第二种变体期望一个类型为 `boost::system::error_code` 对象作为额外参数。该对象通过引用传递，并在函数调用后进行检查。如果发生失败，该对象将存储相应的错误代码。\n\
  \n`boost::system::system_error` 和 `boost::system::error_code` 在 第 55 章，Boost.System\
  \ 中介绍。除了继承自 `boost::system::system_error` 的接口外，`boost::filesystem::filesystem_error`\
  \ 还提供了两个名为 `path1()` 和 `path2()` 的成员函数，它们都返回类型为 `boost::filesystem::path` 的对象。由于存在期望两个\
  \ `boost::filesystem::path` 类型参数的函数，这两个成员函数为发生错误时获取相应路径提供了一种方法。\n\n示例 35.10, “使用\
  \ `boost::filesystem::status()`”) 引入了 `boost::filesystem::status()`，它可以查询文件或目录的状态。该函数返回一个类型为\
  \ `boost::filesystem::file_status` 的对象，可以将其传递给额外的辅助函数进行评估。例如，如果查询的是目录状态，`boost::filesystem::is_directory()`\
  \ 将返回 `true`。除了 `boost::filesystem::is_directory()` 之外，还有其他函数，包括 `boost::filesystem::is_regular_file()`、`boost::filesystem::is_symlink()`\
  \ 和 `boost::filesystem::exists()`，它们都返回类型为 `bool` 的值。\n\n示例 35.10 使用 `boost::filesystem::status()`\n\
  \n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\\"};\n  try\n  {\n    file_status\
  \ s = status(p);\n    std::cout << std::boolalpha << is_directory(s) << '\\n';\n\
  \  }\n  catch (filesystem_error &e)\n  {\n    std::cerr << e.what() << '\\n';\n\
  \  }\n}\n```\n\n函数 `boost::filesystem::symlink_status()` 查询链接的状态。通过 `boost::filesystem::status()`\
  \ 查询文件状态。在 Windows 上，符号链接由文件识别。\n\n示例 35.11 使用 `boost::filesystem::status()`\n\n\
  ```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\ini\"};\n  boost::system::error_code\
  \ ec;\n  boost::uintmax_t filesize = file_size(p, ec);\n  if (!ec)\n    std::cout\
  \ << filesize << '\\n';\n  else\n    std::cout << ec << '\\n';\n}\n```\n\n一组函数使得查询属性成为可能。`boost::filesystem::file_size()`\
  \ 返回文件的大小。返回值类型为 `boost::uintmax_t`，即 `unsigned long long`。\n\n示例 35.11, “使用 `boost::filesystem::file_size()`”)\
  \ 使用 `boost::system::error_code` 对象，需要进行评估以判断 `boost::filesystem::file_size()` 是否成功。\n\
  \n示例 35.12 使用 `boost::filesystem::last_write_time()`\n\n```cpp\n#include <boost/filesystem.hpp>\n\
  #include <iostream>\n#include <ctime>\n\nusing boost::filesystem;\n\nint main()\n\
  {\n  path p{\"C:\\\\Windows\"};\n  try\n  {\n    std::time_t t = last_write_time(p);\n\
  \    std::cout << std::ctime(&t) << '\\n';\n  }\n  catch (filesystem_error &e)\n\
  \  {\n    std::cerr << e.what() << '\\n';\n  }\n}\n```\n\n要确定文件最后修改的时间，可以使用 `boost::filesystem::last_write_time()`（参考\
  \ 示例 35.12, “使用 `boost::filesystem::last_write_time()`”)）。\n\n示例 35.13 使用 `boost::filesystem::space()`\n\
  \n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\\"};\n  try\n  {\n    space_info\
  \ s = space(p);\n    std::cout << s.capacity << '\\n';\n    std::cout << s.free\
  \ << '\\n';\n    std::cout << s.available << '\\n';\n  }\n  catch (filesystem_error\
  \ &e)\n  {\n    std::cerr << e.what() << '\\n';\n  }\n}\n```\n\n`boost::filesystem::space()`\
  \ 获取总磁盘空间和剩余空间（参考 示例 35.13, “使用 `boost::filesystem::space()`”))）。它返回一个类型为 `boost::filesystem::space_info`\
  \ 的对象，该对象提供了三个公共成员变量：`capacity`、`free` 和 `available`，类型均为 `boost::uintmax_t`。磁盘空间单位为字节。\n\
  \n\n\n\n\n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::filesystem;\n\nint main()\n{\n  path p{\"C:\\\\Test\"};\n  try\n\
  \  {\n    if (create_directory(p))\n    {\n      rename(p, \"C:\\\\Test2\");\n \
  \     boost::filesystem::remove(\"C:\\\\Test2\");\n    }\n  }\n  catch (filesystem_error\
  \ &e)\n  {\n    std::cerr << e.what() << '\\n';\n  }\n}\n```\n\n示例 35.14, “创建、重命名和删除目录”\
  \ 应该是不言自明的。仔细观察，可以发现，传递给函数的并不总是 `boost::filesystem::path` 类型的对象，而是一个简单的字符串。这是可能的因为\
  \ `boost::filesystem::path` 了一个了一个非显式的构造函数，它可以将字符串转换为 `boost::filesystem::path`\
  \ 的对象。这使得使用 Boost.Filesystem 变得简单，因为不需要显式创建路径。\n\n### 注意\n\n在 示例 35.14, “创建、重命名和删除目录”\
  \ 中，使用命名空间显式调用了 `boost::filesystem::remove()`。否则，Visual C++ 2013 会将该函数与头文件 `stdio.h`\
  \ 中的 `remove()` 混淆。\n\n其他函数如用于创建符号链接的 `create_symlink()` 以及用于复制文件和目录的 `copy_file()`\
  \ 和 `copy_directory()`。\n\n### 示例 35.15. 使用 `boost::filesystem::absolute()`\n\n\
  ```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  try\n  {\n    std::cout << absolute(\"\
  photo.jpg\") << '\\n';\n  }\n  catch (filesystem_error &e)\n  {\n    std::cerr <<\
  \ e.what() << '\\n';\n  }\n}\n```\n\n示例 35.15, “使用 `boost::filesystem::absolute()`”\"\
  ) 展示了一个根据文件名或路径部分创建绝对路径的函数。显示的路径取决于程序启动时所在的目录。例如，如果程序在 `C:\\` 下启动，输出将是 `\"C:\\photo.jpg\"\
  `。\n\n若要获取相对于另一个目录的绝对路径，可以向 `boost::filesystem::absolute()` 传递第二个参数。\n\n### 示例 35.16.\
  \ 创建相对于另一个目录的绝对路径\n\n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\
  \nusing namespace boost::filesystem;\n\nint main()\n{\n  try\n  {\n    std::cout\
  \ << absolute(\"photo.jpg\", \"D:\\\\\") << '\\n';\n  }\n  catch (filesystem_error\
  \ &e)\n  {\n    std::cerr << e.what() << '\\n';\n  }\n}\n```\n\n示例 35.16, “创建相对于另一个目录的绝对路径”\
  \ 显示了 `\"D:\\photo.jpg\"`。\n\n本节的最后一个示例，示例 35.17, “使用 `boost::filesystem::current_path()`”\"\
  )  引入了一个实用的辅助函数来获取当前工作目录。\n\n### 示例 35.17. 使用 `boost::filesystem::current_path()`\n\
  \n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::filesystem;\n\nint main()\n{\n  try\n  {\n    std::cout << current_path()\
  \ << '\\n';\n    current_path(\"C:\\\\\");\n    std::cout << current_path() << '\\\
  n';\n  }\n  catch (filesystem_error &e)\n  {\n    std::cerr << e.what() << '\\n';\n\
  \  }\n}\n```\n\n示例 35.17, “使用 `boost::filesystem::current_path()`”\") 多次调用了 `boost::filesystem::current_path()`。如果不带参数调用该函数，则返回当前工作目录。如果传递了\
  \ `boost::filesystem::path` 类型的对象，则设置当前工作目录。\n\n## 目录迭代器\n\nBoost.Filesystem 提供了迭代器\
  \ `boost::filesystem::directory_iterator` 来遍历目录中的文件（参见 示例 35.18, “遍历目录中的文件”）。\n\n\
  ### 示例 35.18. 遍历目录中的文件\n\n```cpp\n#include <boost/filesystem.hpp>\n#include <iostream>\n\
  \nusing namespace boost::filesystem;\n\nint main()\n{\n  path p = current_path();\n\
  \  directory_iterator it(p);\n  for (; it != directory_iterator(); ++it)\n  {\n\
  \    std::cout << *it << '\\n';\n  }\n}\n```\n\n`directory_iterator` 使用路径初始化。为了获取目录的起始位置，可以使用默认构造函数实例化\
  \ `directory_iterator`。在迭代期间可以创建或删除项。为了确保所有项可见，若要递归遍历子目录，Boost.Filesystem 提供了 `boost::filesystem::recursive_directory_iterator`。\n\
  \n## 文件流\n\n标准 `fstream` 中定义了各种文件流。它们接受 `path` 类型。如果你想打开文件，请包含 `filesystem.hpp`。\n\
  \n### 示例 35.19. 使用 `boost::filesystem::ofstream`\n\n```cpp\n#include <boost/filesystem.hpp>\n\
  #include <iostream>\n\nusing namespace boost::filesystem;\n\nint main()\n{\n  path\
  \ p{\"test.txt\"};\n  ofstream ofs{p};\n  ofs << \"Hello, world!\\n\";\n}\n```\n\
  \n示例 35.19, “使用 `boost::filesystem::ofstream`” 通过 `boost::filesystem::ofstream`\
  \ 类打开文件。`boost::filesystem::path` 类型的对象可以传递给 `boost::filesystem::ofstream` 的构造函数。成员函数\
  \ `open()` 也接受 `path`。\n\n## 时间\n\n以下库处理时间值：\n\n- Boost.DateTime 定义了时间点和周期（针对当天和日历），以及处理它们的函数。例如，可以对日期进行迭代。\n\
  - Boost.Chrono 和 Boost.Timer 提供了测量时间的计时。Boost.Timer 提供的计时用于测量执行时间，仅在优化代码时使用。\n\n\
  # 36. Boost.DateTime\n\n[Boost.DateTime](http://www.boost.org/libs/date_time) 库可以处理日期和时间数据。此外，Boost.DateTime\
  \ 提供了时区的扩展，并支持日期和时间的格式化输入输出。如果你正在寻找获取当前时间或测量时间的函数，请参见第 37 章 *Boost.Chrono*](#part0073.html_25JP22-4acad2cb18c04a1fb9fdf6a8cc19f92\
  \ \"37. Boost.Chrono\").\n\n## 日期\n\nBoost.DateTime 只支持基于格里祖历的日历日期，这通常不是问题，因为这是最广泛使用的历。如果你与某人约定在\
  \ 2014 年 5 月 12 日见面，不需要说明该日期是基于格里祖历的。\n\n格里祖历是由教格利利三世引入的。Boost.DateTime 支持 1400\
  \ 年到 9999 年的日历日期，这意味着它的支持追溯到 1582 年以前。因此，只要将日期转换为格里祖历，你就可以使用 Boost.DateTime 处理 1400\
  \ 年之后的任何日历日期。为了处理更早的日期，必须扩展 Boost.DateTime。\n\n头文件 `boost/date_time/gregorian/gregorian.hpp`\
  \ 包含了所有处理日历日期的类和函数的定义。这些函数和类可以在 `boost::gregorian` 命名空间中找到。要创建日期，请使用 `boost::gregorian::date`\
  \ 类。\n\n\n\n\n\n`boost::gregorian::date` 提供了几个构造函数来创建日期。最基础的构造函数接受年、月、日作为参数。如果给出无效值，将抛出类型为\
  \ `boost::gregorian::bad_day_of_month`、`boost::gregorian::bad_year` 或 `boost::gregorian::bad_month`\
  \ 的异常。所有类都派生自 `std::out_of_range`。\n\n### 示例 36.1. 使用 `boost::gregorian::date` 创建日期\n\
  \n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\
  \nint main()\n{\n  boost::gregorian::date d{2014, 1, 31};\n  std::cout << d.year()\
  \ << '\\n';\n  std::cout << d.month() << '\\n';\n  std::cout << d.day() << '\\n';\n\
  \  std::cout << d.day_of_week() << '\\n';\n  std::cout << d.end_of_month() << '\\\
  n';\n}\n```\n\n如 示例 36.1, “使用 `boost::gregorian::date` 创建日期` 所示，有许多可用的成员函数。某些成员函数（如\
  \ `year()`、`month()` 和 `day()`）返回日期的相应部分，而另一些函数（如 `day_of_week()` 和 `end_of_month()`）则计算值。\n\
  \n`boost::gregorian::date` 的构造函数期望年、月、日的数值值来设置日期。然而，示例程序的输出中月份显示为 `Jan`，星期显示为 `Fri`。`month()`\
  \ 和 `day_of_week()` 的返回值不是普通的数值，而是类型为 `boost::gregorian::date::month_type` 和 `boost::gregorian::date::day_of_week_type`\
  \ 的值。Boost.DateTime 对格式化的输入输出提供了全面的支持，因此可以调整输出，例如将 `Jan` 调整为 `1`。\n\n`boost::gregorian::date`\
  \ 的默认构造函数会创建一个无效日期。也可以通过向构造函数传递 `boost::date_time::not_a_date_time` 作为唯一参数来显式创建一个无效日期。\n\
  \n除了直接调用构造函数外，还可以通过其他类的自由函数和成员函数创建 `boost::gregorian::date` 类型的对象。\n\n### 示例 36.2.\
  \ 从时钟或字符串获取日期\n\n示例 36.2, “从时钟或字符串获取日期` 使用 `boost::gregorian::day_clock` 类，它返回当前日期。成员函数\
  \ `universal_day()` 返回 UTC 日期，该日期独立于时区和夏令时。UTC 是世界标准时间的国际缩写。`boost::gregorian::day_clock`\
  \ 还提供了一个名为 `local_day()` 的成员函数，它考虑了本地设置。要要在本地时区内获取当前日期，请使用 `local_day()`。\n\n`boost::gregorian`\
  \ 命名空间包含一些自由函数，可以将存储为字符串的日期转换为 `boost::gregorian::date` 类型的对象。示例 36.2, “从时钟或字符串获取日期`\
  \ 使用函数 `boost::gregorian::date_from_iso_string()` 将 ISO 8601 格式的日期转换。其他函数包括：`boost::gregorian::from_simple_string()`\
  \ 和 `boost::gregorian::from_us_string()`。\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d = day_clock::universal_day();\n  std::cout << d.year() << '\\n';\n  std::cout\
  \ << d.month() << '\\n';\n  std::cout << d.day() << '\\n';\n\n  d = date_from_iso_string(\"\
  20140131\");\n  std::cout << d.year() << '\\n';\n  std::cout << d.month() << '\\\
  n';\n  std::cout << d.day() << '\\n';\n}\n```\n\n虽然 `boost::gregorian::date` 标记了一个特定的时间，但\
  \ `boost::gregorian::date_duration` 表示一个时长。\n\n### 示例 36.3. 使用 `boost::gregorian::date_duration`\n\
  \n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\
  \nusing namespace boost::gregorian;\n\nint main()\n{\n  date d1{2014, 1, 31};\n\
  \  date d2{2014, 2, 28};\n  date_duration dd = d2 - d1;\n  std::cout << dd.days()\
  \ << '\\n';\n}\n```\n\n由于 `boost::gregorian::date` 重载了 `-` 运算符，可以减去时间点（参见 示例 36.3,\
  \ “使用 `boost::gregorian::date_duration``）。`boost::gregorian::date_duration` 提供的最重要的成员函数是\
  \ `days()`。\n\n### 示例 36.4. 特殊时长\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date_duration\
  \ dd{4};\n  std::cout << dd.days() << '\\n';\n  weeks ws{4};\n  std::cout << ws.days()\
  \ << '\\n';\n  months ms{4};\n  std::cout << ms.days() << '\\n';\n  years ys{4};\n\
  \  std::cout << ys.days() << '\\n';\n}\n```\n\n`boost::gregorian::date_duration`\
  \ 也可以通过向构造函数传递天数来创建。要创建涉及 `weeks`、`months` 或 `years` 的时长，请使用 示例 36.4, “特殊时长`。无论是\
  \ `boost::gregorian::date` 还是 `boost::gregorian::date_duration` 允许你确定天数，因为月份和年份的长度不同。尽管，使用这些类仍然意义，参见\
  \ 示例 36.5, “处理特殊时长`。\n\n### 示例 36.5. 处理特殊时长\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d{2014, 1, 31};\n  months ms{1};\n  date d2 = d + ms;\n  std::cout << d2 << '\\\
  n';\n  date d3 = d2 - ms;\n  std::cout << d3 << '\\n';\n}\n```\n\n示例 36.5, “处理特殊时长`\
  \ 向给定的 2014 年 1 月 31 日日期增加一个月，导致 `d2` 为 2014 年 2 月 28 日。在下一步中，减去一个月，`d3` 再次变为 2014\
  \ 年 1 月 31 日。如所示，时间点和时长都可以使用。然而，某些细节需要考虑。例如，从一个月的最后一天开始，`boost::gregorian::months`\
  \ 总是到达另一个月份的最后一天，这可能会导致意外。\n\n### 示例 36.6. 处理特殊时长时的意外\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d{2014, 1, 30};\n  months ms{1};\n  date d2 = d + ms;\n  std::cout << d2 << '\\\
  n';\n  date d3 = d2 - ms;\n  std::cout << d3 << '\\n';\n}\n```\n\n示例 36.6, “处理特殊时长时的意外`\
  \ 与上一个相同，只是 `d` 初始化为 2014 年 1 月 30 日。尽管这不是 1 月的最后一天，向前移动一个月会导致 `d2` 变为 2014 年 2\
  \ 月 28 日，因为没有 2 月 30 日。然而，再次向后移动一个月会导致 `d3` 变为 2014 年 1 月 31 日。由于 2014 年 2 月 28\
  \ 日是 2 月的最后一天，向后移动返回到了 1 月的最后一天。\n\n\n\n\n要更改此行为，请取消定义宏 `BOOST_DATE_TIME_OPTIONAL_GREGORIAN_TYPES`。在此宏被取消定义后，`boost::gregorian::weeks`、`boost::gregorian::months`\
  \ 和 `boost::gregorian::years` 类将不再可用。唯一可用的类将是 `boost::gregorian::date_duration`，它简单地按指定的天数向前或后跳转，而不会对月份的第一天和最后一天进行特殊考虑。\n\
  \n### 示例 36.7 使用 `boost::gregorian::date_period`\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d1{2014, 1, 1};\n  date d2{2014, 2, 28};\n  date_period dp{d1, d2};\n  date_duration\
  \ dd = dp.length();\n  std::cout << dd.days() << '\\n';\n}\n```\n\n虽然 `boost::gregorian::date_duration`\
  \ 仅适用于持续时间，但 `boost::gregorian::date_period` 支持两个日期之间的范围。\n\n`boost::gregorian::date_period`\
  \ 的构造函数可以接受两种输入。你可以传递两个类型为 `boost::gregorian::date` 的参数，一个作为起始日期，一个作为结束日期。或者你可以指定起始日期和一个类型为\
  \ `boost::gregorian::date_duration` 的持续时间。请注意，结束日期的前一天实际上是该周期的最后一天。这对于理解示例 36.8\
  \ “测试周期是否包含日期”的输出非常重要。\n\n### 示例 36.8 测试周期是否包含日期\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d1{2014, 1, 1};\n  date d2{2014, 2, 28};\n  date_period dp{d1, d2};\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << dp.contains(d1) << '\\n';\n  std::cout << dp.contains(d2) << '\\\
  n';\n}\n```\n\n示例 36.8 “测试周期是否包含日期”通过调用 `contains()` 来检查特定日期是否在周期内。注意，尽管 `d2` 定义了周期的结束，但它并不被视为周期的一部分。因此，成员函数\
  \ `contains()` 在调用 `d1` 时返回 `true`，在调用 `d2` 时返回 `false`。\n\n`boost::gregorian::date_period`\
  \ 提供了额外的成员函数用于操作，例如移动周期或计算两个重叠周期的交集。\n\nBoost.DateTime 还提供了迭代器和其他实用的自由函数，如示例 36.9\
  \ “遍历日期”所示。\n\n使用迭代器 `boost::gregorian::day_iterator` 从特定日期向前或向后跳转一天。使用 `boost::gregorian::week_iterator`、`boost::gregorian::month_iterator`\
  \ 和 `boost::gregorian::year_iterator` 分别按周、月或年跳转。\n\n示例 36.9 “遍历日期”还使用了函数 `boost::date_time::next_weekday()`，它根据给定的日期返回下一个工作日的日期。示例\
  \ 36.9 “遍历日期”显示了 `2014-May-16`，这是 2014 年 5 月 13 日之后的第一个周五。\n\n### 示例 36.9 遍历日期\n\
  \n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\
  \nusing namespace boost;\n\nint main()\n{\n  gregorian::date d{2014, 5, 12};\n \
  \ gregorian::day_iterator it{d};\n  std::cout << *++it << '\\n';\n  std::cout <<\
  \ date_time::next_weekday(*it,\n    gregorian::greg_weekday(date_time::Friday))\
  \ << '\\n';\n}\n```\n\n## 与位置无关的时间\n\n`boost::posix_time::ptime` 类定义了一个与位置无关的时间。它使用了类型\
  \ `boost::gregorian::date`，但也存储了时间。要使用 `boost::posix_time::ptime`，请包含头文件 `boost/date_time/posix_time/posix_time.hpp`。\n\
  \n### 示例 36.10 使用 `boost::posix_time::ptime`\n\n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n\
  #include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::posix_time;\nusing namespace boost::gregorian;\n\nint main()\n\
  {\n  ptime pt{2014, 5, 12}, time_duration{12, 0, 0};\n  date d = pt.date();\n  std::cout\
  \ << d << '\\n';\n  time_duration td = pt.time_day();\n  std::cout << td << '\\\
  n';\n}\n```\n\n要初始化 `boost::posix_time::ptime` 对象，传递一个类型为 `boost::gregorian::date`\
  \ 的日期和一个类型为 `boost::posix_time::time_duration` 的持续时间。示例 36.10 “使用 `boost::posix_time::ptime`”\
  \ 指定了 5 月 12 日 12 点。要查询日期和时间，使用成员函数 `date()` 和 `time_day()`。`boost::gregorian::date`\
  \ 的构造函数创建了一个无效的日期，`boost::posix_time::time_duration` 也是。`boost::posix_time::ptime`\
  \ 提供了创建日期的自由函数。\n\n### 示例 36.11 使用时钟创建时间点\n\n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n\
  #include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::posix_time;\n\nint main()\n{\n  ptime pt = second_clock::universal_time();\n\
  \  std::cout << pt.date() << '\\n';\n  std::cout << pt.time_day() << '\\n';\n\n\
  \  pt = from_iso_string(\"20140512T120000\");\n  std::cout << pt.date() << '\\n';\n\
  \  std::cout << pt.time_day() << '\\n';\n}\n```\n\n`boost::posix_time::second_clock`\
  \ 返回当前时间。成员函数 `universal_time()` 返回 UTC 时间（参见示例 36.11 “使用时钟创建时间点”）。`local_time()`\
  \ 返回本地时间。如果你需要更高的分辨率`boost::posix_time::microsec_clock` 返回包含微秒的时间。\n\n自由函数 `boost::posix_time::from_iso_string()`\
  \ 将使用 ISO 8601 标准格式的字符串转换为 `boost::posix_time::ptime` 对象。\n\n### 示例 36.12 使用 `boost::posix_time::time_duration`\n\
  \n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n#include <iostream>\n\
  \nusing namespace boost::posix_time;\n\nint main()\n{\n  time_duration td{16, 30,\
  \ 0};\n  std::cout << td.hours() << '\\n';\n  std::cout << td.minutes() << '\\n';\n\
  \  std::cout << td.seconds() << '\\n';\n  std::cout << td.total_seconds() << '\\\
  n';\n}\n```\n\nBoost.DateTime 还提供了 `boost::posix_time::time_duration` 类，它指定了一个持续时间。这个类之前被提到过，因为\
  \ `boost::posix_time::ptime` 的构造函数的第二个参数期望一个类型为 `boost::posix_time::time_duration`\
  \ 的对象。你也可以独立使用 `boost::posix_time::time_duration`。\n\n`hours()`、`minutes()` 和 `seconds()`\
  \ 返回持续时间的各个部分，而 `total_seconds()`（返回总秒数）等成员函数提供了额外信息（参见示例 36.12 “使用 `boost::posix_time::time_duration`”）。传递\
  \ `boost::posix_time::time_duration` 的值没有上限限制（例如 24 小时）。\n\n### 示例 36.13 处理时间点\n\
  \n\n\n\n\n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n#include\
  \ <iostream>\n\nusing namespace boost::posix_time;\nusing namespace boost::gregorian;\n\
  \nint main()\n{\n  ptime pt1{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  ptime\
  \ pt2{date{2014, 5, 12}, time_duration{18, 30, 0}};\n  time_duration td = pt2 -\
  \ pt1;\n  std::cout << td.hours() << '\\n';\n  std::cout << td.minutes() << '\\\
  n';\n  std::cout << td.seconds() << '\\n';\n}\n```\n\n与日历日期一样，时间点和持续时间也可以进行计算。如果两个类型为\
  \ `boost::posix_time::ptime` 的时间相互相减，如示例 36.13, “处理时间点”所示，结果是一个 `boost::posix_time::time_duration`\
  \ 类型的对象，指定了两个时间之间的持续时间。\n\n### 示例 36.14. 处理持续时间\n\n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n\
  #include <iostream>\n\nusing namespace boost::posix_time;\nusing namespace boost::gregorian;\n\
  \nint main()\n{\n  ptime pt1{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  time_duration\
  \ td{6, 30, 0};\n  ptime pt2 = pt1 + td;\n  std::cout << pt2.time_of_day() << '\\\
  n';\n}\n```\n\n如示例 36.14, “处理持续时间”所示，可以将持续时间加到时间上，得到一个新的时间点。此示例向标准输出流写入 `18:30:00`。\n\
  \nBoost.DateTime 对日历日期和时间使用了相同的概念。就像存在用于时间和持续时间的类一样，也存在表示时间段（periods）的类。对于日历日期，是\
  \ `boost::gregorian::date_period`；对于时间，是 `boost::posix_time::time_period`。这两个类的构造函数都期望两个参数：`boost::gregorian::date_period`\
  \ 期望两个日历日期作为参数，而 `boost::posix_time::time_period` 期望两个时间点。\n\n### 示例 36.15. 使用 `boost::posix_time::time_period`\n\
  \n```cpp\n#include <boost/date_time/posix_time/posix_time.hpp>\n#include <iostream>\n\
  \nusing namespace boost::posix_time;\nusing namespace boost::gregorian;\n\nint main()\n\
  {\n  ptime pt1{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  ptime pt2{date{2014,\
  \ 5, 12}, time_duration{18, 30, 0}};\n  time_period tp{pt1, pt2};\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << tp.contains(pt1) << '\\n';\n  std::cout << tp.contains(pt2) << '\\\
  n';\n}\n```\n\n一般而言，`boost::posix_time::time_period` 的工作方式类似于 `boost::gregorian::date_period`。它提供了一个成员函数\
  \ `contains()`，对于时间段内的每个时间点都返回 `true`。由于传递给 `boost::posix_time::time_period` 构造函数的结束时间不属于时间段的一部分，因此在示例\
  \ 36.15, “使用 `boost::posix_time::time_period`” 中第二次调用 `contains()` 返回 `false`。\n\
  \n`boost::posix_time::time_period` 还提供了额外的成员函数，如 `intersection()` 和 `merge()`，它们分别计算两个重叠时间段的交集并合并两个交叉的时间段。\n\
  \n最后，迭代器 `boost::posix_time::time_iterator` 用于遍历时间点。\n\n示例 36.16, “遍历时间点 使用迭代器 `it`\
  \ 从时间 `pt` 向前跳转 6.5 小时。因为迭代器增加了两次，输出为 `2014-May-12 18:30:00` 和 `2014-May-13 01:00:00`。\n\
  \n### 示例 36.16. 遍历时间点\n\n```cpp\n#include <boost/date_time/local_time/local_time.hpp>\n\
  #include <iostream>\n\nusing namespace boost::posix_time;\nusing namespace boost::gregorian;\n\
  \nint main()\n{\n  ptime pt1{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  ptime\
  \ pt2{date{2014, 5, 12}, time_duration{18, 30, 0}};\n  time_period tp{pt1, pt2};\n\
  \  std::cout.setf(std::ios::boolalpha);\n  std::cout << tp.contains(pt1) << '\\\
  n';\n  std::cout << tp.contains(pt2) << '\\n';\n}\n```\n\n## 依赖位置的时间\n\n与上一节介绍的与位置无关的时间不同，依赖位置的时间考虑了时区。Boost.DateTime\
  \ 提供了 `boost::local_time::local_date_time`，它定义在 `boost/time/local_time.hpp` 中。\n\
  \n### 示例 36.17. 使用 `boost::local_time::local_time`](#part0071.html_ex.datetime_17\
  \ \"Example 36.17. Using boost::local_time::local_time\")\n\n作为时区 Europe。\n\n```cpp\n\
  #include <boost/date_time/local_time/local_time.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::local_time;\nusing namespace boost::posix_time;\nusing namespace\
  \ boost::gregorian;\n\nint main()\n{\n  time_zone_ptr tz{new posix_time_zone{\"\
  CET+1\"}};\n  ptime pt{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  local_date_time\
  \ dt{pt, tz};\n  std::cout << dt.local_time() << '\\n';\n  std::cout << dt << '\\\
  n';\n  std::cout << dt.zone_name() << '\\n';\n}\n```\n\n`boost::local_time::local_date_time`\
  \ 的构造函数期望第一个参数为 `boost::posix_time::ptime` 类型，第二个参数为 `boost::local_time::time_zone_ptr`\
  \ 类型。\n\nBoost.DateTime 提供了 `boost::local_time::local_date_time`，它定义在 `boost/date_time/local_time.hpp`\
  \ 中。当 `boost::local_time::local_date_time` 对象被写入标准输出流或调用成员函数 `local_time()` 时，会使用小时偏移量来计算本地时间。由于\
  \ CET 比 UTC 早一小时，偏移量表示为 +1。Boost.DateTime 无法解释时区缩写，因此必须提供小时偏移量；如果没有偏移量，请使用值 +0。\n\
  \n示例 36.17, “使用 `boost::local_time::local_time``\n\n程序向标准输出流写入了字符串 `2014-May-12\
  \ 12:00:00`、`2014-May-12 13:00:00 CET`、`2014-May-12 13:00:00` 和 `CET`。用于初始化 `boost::posix_time::ptime`\
  \ 和 `boost::local_time::local_date_time` 对象的值始终与时区相关。\n\n### 示例 36.18. 依赖位置的时间点和不同的时区\n\
  \n```cpp\n#include <boost/date_time/local_time/local_time.hpp>\n#include <iostream>\n\
  \nusing namespace boost::local_time;\nusing namespace boost::posix_time;\nusing\
  \ namespace boost::gregorian;\n\nint main()\n{\n  time_zone_ptr tz{new posix_time_zone{\"\
  CET+1\"}};\n\n  ptime pt{date{2014, 5, 12}, time_duration{12, 0, 0}};\n  local_date_time\
  \ dt{pt, tz};\n  std::cout << dt.local_time() << '\\n';\n\n  time_zone_ptr tz2{new\
  \ posix_time_zone{\"EET+2\"}};\n  std::cout << dt.local_time_in(tz2).local_time()\
  \ << '\\n';\n}\n```\n\n\n\n\n使用 `local_time()` 时，会遵循时区的偏移。为了计算 CET（欧洲中部标准时间）时间，需要在存储在\
  \ `dt` 中的 UTC 时间 12 PM 基础上加一小时，因为 CET 比 UTC 早一小时。这就是为什么在 示例 36.18, “依赖位置的时间点和不同的时区”\
  \ 中，`local_time()` 向标准输出写入了 `2014-May-12 13:00:00`。\n\n相比之下，成员函数 `local_time_in()`\
  \ 将存储在 `dt` 中的时间解释为作为参数传递的时区中的时间。这意味着 UTC 12 PM 等于 EET 2 PM（EET 代表东欧时间，它比 UTC 早两小时）。\n\
  \n最后，Boost.DateTime 提供了 `boost::local_time::local_time_period` 类用于处理依赖位置的周期。\n\n\
  ### 示例 36.19. 使用 `boost::local_time::local_time_period`\n\n```cpp\n#include <boost/date_time/local_time/local_time.hpp>\n\
  #include <iostream>\n\nusing namespace boost::local_time;\nusing namespace boost::posix_time;\n\
  using namespace boost::gregorian;\n\nint main()\n{\n  time_zone_ptr tz{new posix_time_zone{\"\
  CET+0\"}};\n\n  ptime pt1{date{2014, 12, 5}, time_duration{12, 0, 0}};\n  local_date_time\
  \ dt1{pt1, tz};\n\n  ptime pt2{date{2014, 12, 5}, time_duration{18, 0, 0}};\n  local_date_time\
  \ dt2{pt2, tz};\n\n  local_time_period tp{dt1, dt2};\n\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << tp.contains(dt1) << '\\n';\n  std::cout << tp.contains(dt2) << '\\\
  n';\n}\n```\n\n示例 36.19, “Using `boost::local_time::local_time_period`” 中的 `boost::local_time::local_time_period`\
  \ 构造函数期望两个类型为 `boost::local_time::local_date_time` 的参数。与其他提供的用于周期的类型一样，代表结束时间的第二个参数并不属于该周期的一部分。通过\
  \ `contains()`、`intersection()`、`merge()` 等成员函数的帮助，你可以基于 `boost::local_time::local_time_period`\
  \ 对周期进行处理。\n\n## 格式化的输入和输出\n\n本章在此为止描述的示例程序以 `2014-May-12` 的格式写入结果。Boost.DateTime\
  \ 允许用不同的格式显示结果。可以使用 `boost::date_time::date_facet` 和 `boost::date_time::time_facet`\
  \ 对日历日期和时间进行格式化。\n\nBoost.DateTime 使用标准库中的区域（locales）概念。要格式化日历日期，必须创建一个类型为 `boost::date_time::date_facet`\
  \ 的对象并将其安装到区域中。描述新格式的字符串传递给 `boost::date_time::date_facet` 的构造函数。示例 36.20, “用户自定义的日期格式”\
  \ 传递了 “%A, %d %B %Y”，这指定了星期后面跟着全称月份日期：`Monday, 12 May 2014`。\n\n### 示例 36.20. 用户自定义的日期格式\n\
  \n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n#include <iostream>\n\
  #include <locale>\n\nusing namespace boost::gregorian;\n\nint main()\n{\n  date\
  \ d{2014, 5, 12};\n  date_facet *df = new date_facet{\"%A, %d %B %Y\"};\n  std::cout.imbue(std::locale{std::cout.getloc(),\
  \ df});\n  std::cout << d << '\\n';\n}\n```\n\nBoost.DateTime 提供了许多格式标志，每个标志由一个百分号后跟一个字符组成。Boost.DateTime\
  \ 的文档包含了[所有支持标志的完整概述](http://www.boost.org/doc/html/date_time/date_time_io.html#date_time.format_flags)。\n\
  \n如果程序被德国或德语国家的人使用，那么使用德语而非英语来显示星期和月份会更好。\n\n通过将包含所需名称的向量（vectors）传递给类 `boost::date_time::date_facet`\
  \ 类的成员函数 `long_month_names()` 和 `long_weekday_names()`，可以更改星期和月份名称。示例 36.21, “更改星期和月份名称”\
  \ 现在写入了 `Montag, 12 May 2014`（注：原文为德语，此处意指德语格式）。在标准输出中写入 `Montag, 12 Mai 2014`。\n\
  \n### 注意\n\n为了在标准输出中写入 `Montag, 12 Mai 2014`，请将示例 36.21 替换为“de_DE”，并确保安装了德语区域。\n\
  \n### 示例 36.21. 更改星期和月份名称\n\n```cpp\n#include <boost/date_time/gregorian/gregorian.hpp>\n\
  #include <iostream>\n#include <locale>\n#include <vector>\n#include <string>\n\n\
  using namespace boost::gregorian;\n\nint main()\n{\n  date d{2014, 5, 12};\n  date_facet\
  \ *df = new date_facet{\"%A, %d %B %Y\"};\n  std::cout.imbue(std::locale{std::cout.getloc(),\
  \ df});\n  std::cout << d << '\\n';\n}\n```\n\n# 37. Boost.Chrono\n\n[Boost.Chrono](http://www.boost.org/doc/libs/chrono/)\
  \ 提供了多种时钟。例如，你可以获取当前时间或测量通过的时间。Boost.Chrono 的部分被添加到 C++11。如果你的开发环境支持 C++11，你可以使用某些时钟。\n\
  \n通过头文件 `boost/chrono.hpp` 可以访问 Boost.Chrono 时钟。唯一的扩展是自定义格式化，它需要头文件 `boost/chrono_io.hpp`。\n\
  \n示例 37.1, “Boost.Chrono 的所有时钟” 介绍了 Boost.Chrono 提供的所有时钟。所有时钟都有一个返回时间点的成员函数 `now()`。所有时间点都相对于一个通用时间点。这个参考点被称为\
  \ epoch。常用的 epoch 是 1970 年 1 月 1 日。示例 37.1, “Boost.Chrono 的所有时钟” 为显示的每个时间点写入了 epoch。\n\
  \n### 示例 37.1. Boost.Chrono 的所有时钟\n\n```cpp\n#include <boost/chrono.hpp>\n#include\
  \ <iostream>\n\nusing namespace boost::chrono;\n\nint main()\n{\n  std::cout <<\
  \ system_clock::now() << '\\n';\n#ifdef BOOST_CHRONO_HAS_CLOCK_STEADY\n  std::cout\
  \ << steady_clock::now() << '\\n';\n#endif\n  std::cout << high_resolution_clock::now()\
  \ << '\\n';\n\n#ifdef BOOST_CHRONO_HAS_PROCESS_CLOCKS\n  std::cout << process_real_cpu_clock::now()\
  \ << '\\n';\n  std::cout << process_user_cpu_clock::now() << '\\n';\n  std::cout\
  \ << process_system_cpu_clock::now() << '\\n';\n  std::cout << process_cpu_clock::now()\
  \ << '\\n';\n#endif\n\n#ifdef BOOST_CHRONO_HAS_THREAD_CLOCK\n  std::cout << thread_clock::now()\
  \ << '\\n';\n#endif\n}\n```\n\n\n\n\n*   `boost::chrono::system_clock` 返回系统时间。这通常是你电脑桌面上显示的时间。如果你更改了电脑时间，`boost::chrono::system_clock`\
  \ 将返回新时间。示例 37.1, “来自 Boost.Chrono 的所有时” 向标准输出写入如下所示字符串：`13919594042183544 [1/10000000]seconds\
  \ since Jan 1, 1970`。\n\n    `boost::chrono::system_clock` 的起始时间（epoch）并没有标准。这些示例中使用的\
  \ 1970 年 1 月 1 日起始时间取决于实现。但是，如果你特别想获取自 1970 年 1 月 1 日 以来的时间，请调用 `to_time_t()`。`to_time_t()`\
  \ 是一个静态成员函数，它以 `std::time_t` 类型返回自 1970 年 1 月 1 日以来的秒数作为当前系统时间。\n\n*   `boost::chrono::steady_clock`\
  \ 是一种在稍后访问时总是返回更晚时间的时钟。即使电脑上的时间被调回，`boost::chrono::steady_clock` 也会返回更晚的时间。这种时间被称为单调时间（monotonic\
  \ time）。示例 37.1, “来自 Boost.Chrono 的所有时” 显示自系统启动以来的纳秒数。消息如下：`10594369282958 nanoseconds\
  \ since boot`。`boost::chrono::steady_clock` 测量自上次启动以来的经过时间。然而，从上次启动开始测量是一个实现细节。参考点可能会随着不同的实现而改变。\n\
  \n    `boost::chrono::steady_clock` 并不是所有平台都支持。只有在定义了宏 `BOOST_CHRONO_HAS_CLOCK_STEADY`\
  \ 时，该时钟可用。\n\n*   `boost::chrono::high_resolution_clock` 是 `boost::chrono::system_clock`\
  \ 或 `boost::chrono::steady_clock` 的类型定义，取决于哪个时钟测量时间更精确。因此，其输出与 `boost::chrono::high_resolution_clock`\
  \ 所基于的时钟的输出相同。\n\n*   `boost::chrono::process_real_cpu_clock` 返回进程运行运行的 CPU 时间。该时钟测量自程序开始以来的时间。示例\
  \ 37.1, “来自 Boost.Chrono 的所有时” 向标准输出写入如下所示字符串：`1000000 nanoseconds since process\
  \ start-up`。\n\n    你也可以使用 `ctime` 中的 `std::clock()` 获取此时间。事实上，`boost::chrono::process_real_cpu_clock`\
  \ 的当前实现是基于 `std::clock()` 的。\n\n    只有在定义了宏 `BOOST_CHRONO_HAS_PROCESS_CLOCKS` 时，才能使用\
  \ `boost::chrono::process_real_cpu_clock` 时钟和其他测量 CPU 时间的时钟。\n\n*   `boost::chrono::process_user_cpu_clock`\
  \ 返回进程在用户空间花费的 CPU 时间。用户空间指的是独立于操作系统函数运行的代码。在程序调用的操作系统函数中执行代码所需的时间不计入用户空间时间。\n\n\
  \    `boost::chrono::process_user_cpu_clock` 仅返回在用户空间运行花费的时间。如果程序暂停一段时间（例如通过 Windows\
  \ 的 `Sleep()` 函数），在 `Sleep()` 中花费的时间不会被 `boost::chrono::process_user_cpu_clock`\
  \ 测量。\n\n    示例 37.1, “来自 Boost.Chrono 的所有时” 向标准输出写入如下所示字符串：`15600100 nanoseconds\
  \ since process start-up`。\n\n*   `boost::chrono::process_system_cpu_clock` 与 `boost::chrono::process_user_cpu_clock`\
  \ 。然而，此时钟测量在内核空间花费的时间。`boost::chrono::process_system_cpu_clock` 返回进程执行操作系统函数花费的\
  \ CPU 时间。\n\n    示例 37.1, “来自 Boost.Chrono 的所有时” 向标准输出写入如下所示字符串：`0 nanoseconds since\
  \ process start-up`。由于此示例没有直接调用操作系统函数，且 Boost.Chrono 只使用了少数操作系统函数，`boost::chrono::process_system_cpu_clock`\
  \ 可能返回 0。\n\n*   `boost::chrono::process_cpu_clock` 返回一个元组，包含由 `boost::chrono::process_real_cpu_clock`、`boost::chrono::process_user_cpu_clock`\
  \ 和 `boost::chrono::process_system_cpu_clock` 返回的 CPU 时间。示例 37.1, “来自 Boost.Chrono\
