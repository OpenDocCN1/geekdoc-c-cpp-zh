  \ 提供了对后端的同步访问，这使得你即使后端不是线程安全的，也可以在多线程应用程序中使用该后端。\n\n`boost::log::sinks::asynchronous_sink`\
  \ 和 `boost::log::sinks::synchronous_sink` 这两个前端的区别在于，后者不是基于线程的。日志记录是在同一个线程中传递给后端的。\n\
  \n\n\n\n示例 62.8, “多个日志器、前端和后端” 使用了前端 `boost::log::sinks::synchronous_sink` 配合后端\
  \ `boost::log::sinks::text_multifile_backend`。该后端将日志条目写入一个或多个文件。文件名是根据通过 `set_file_name_composer()`\
  \ 传递给后端的规则创建的。如果你像示例那样使用独立函数 `boost::log::sinks::file::as_file_name_composer()`，则该规则可以作为一个\
  \ lambda 函数创建，其使用的构建块与格式化函数相同。然而，这些属性（attributes）并不会用于创建写入到后端的字符串。相反，该字符串将是日志条目要写入的文件名。\n\
  \n示例 62.8, “多个日志器、前端和后端” 使用了 `channel` 和 `severity` 关键字，它们是通过宏 `BOOST_LOG_ATTRIBUTE_KEYWORD`\
  \ 定义的。它们引用属性 `Channel` 和 `Severity`。在关键字上调用成员函数 `or_default()` 以在属性未设置时传递一个默认值。如果写入了一个日志条目且\
  \ `Channel` 和 `Severity` 未设置，该条目将被写入文件 `None-0.log`。如果写入日志级别为 1 的条目，它将存储在文件 `None-1.log`\
  \ 中。如果日志级别为 1 且通道名为 `Main`，则日志条目保存在文件 `Main-1.log` 中。\n\n属性 `Channel` 由日志器 `boost::log::sources::channel_logger`\
  \ 定义。构造函数期望一个通道名称。该名称不能直接作为字符串传递。相反，它必须作为命名参数传递。这就是为什么示例使用了 `keywords::channel =\
  \ \"Main\"`，即使 `boost::log::sources::channel_logger` 不接受任何其他参数。\n\n### 示例 62.8.\
  \ 多个日志器、前端和后端\n\n```\n#include <boost/log/common.hpp>\n#include <boost/log/sinks.hpp>\n\
  #include <boost/log/sources/severity_logger.hpp>\n#include <boost/log/sources/channel_logger.hpp>\n\
  #include <boost/log/expressions.hpp>\n#include <boost/log/attributes.hpp>\n#include\
  \ <boost/log/utility/string_literal.hpp>\n#include <boost/utility/empty_deleter.hpp>\n\
  #include <boost/shared_ptr.hpp>\n#include <iostream>\n#include <string>\n\nusing\
  \ namespace boost::log;\n\nBOOST_LOG_ATTRIBUTE_KEYWORD(severity, \"Severity\", int)\n\
  BOOST_LOG_ATTRIBUTE_KEYWORD(channel, \"Channel\", std::string)\n\nint main()\n{\n\
  \  typedef sinks::asynchronous_sink<sinks::text_ostream_backend>\n    ostream_sink;\n\
  \  boost::shared_ptr<ostream_sink> ostream =\n    boost::make_shared<ostream_sink>();\n\
  \  boost::shared_ptr<std::ostream> clog{&std::clog,\n    boost::empty_deleter{}};\n\
  \  ostream->locked_backend()->add_stream(clog);\n  core::get()->add_sink(ostream);\n\
  \n  typedef sinks::synchronous_sink<sinks::text_multifile_backend>\n    multifile_sink;\n\
  \  boost::shared_ptr<multifile_sink> multifile =\n    boost::make_shared<multifile_sink>();\n\
  \  multifile->locked_backend()->set_file_name_composer(\n    sinks::file::as_file_name_composer(expressions::stream\
  \ <<\n    channel.or_default<std::string>(\"None\") << \"-\" <<\n    severity.or_default(0)\
  \ << \".log\"));\n  core::get()->add_sink(multifile);\n\n  sources::severity_logger<int>\
  \ severity_lg;\n  sources::channel_logger<> channel_lg{keywords::channel = \"Main\"\
  };\n\n  BOOST_LOG_SEV(severity_lg, 1) << \"severity message\";\n  BOOST_LOG(channel_lg)\
  \ << \"channel message\";\n  ostream->flush();\n}\n```\n\n请注意，命名参数 `boost::log::keywords::channel`\
  \ 与你通过宏 `BOOST_LOG_ATTRIBUTE_KEYWORD` 创建的关键字没有任何关系。\n\n`boost::log::keywords::channel`\
