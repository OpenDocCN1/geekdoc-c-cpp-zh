  #include <boost/shared_ptr.hpp>\n#include <iostream>\n#include <exception>\n\nusing\
  \ namespace boost::log;\n\nBOOST_LOG_INLINE_LOGGER_DEFAULT(lg, sources::wlogger_mt)\n\
  \nint main()\n{\n  typedef sinks::synchronous_sink<sinks::text_ostream_backend>\n\
  \    text_sink;\n  boost::shared_ptr<text_sink> ostream =\n    boost::make_shared<text_sink>();\n\
  \  boost::shared_ptr<std::ostream> clog{&std::clog,\n    boost::empty_deleter{}};\n\
  \  ostream->locked_backend()->add_stream(clog);\n\n  core::get()->add_sink(ostream);\n\
  \n  BOOST_LOG(lg::get()) << L\"note\";\n}\n```\n\n本章的所有示例都使用本地日志器。如果你想定义全局日志器，请使用\
  \ `BOOST_LOG_INLINE_LOGGER_DEFAULT`，如示例 62.10, “定义全局日志器的宏” 所示。第一个参数是日志器名称，第二个参数是类型。你不需要通过名称访问日志器。相反，调用\
  \ `get()`，它会返回一个单例指针。\n\n\n\n\nBoost.Log 还提供了许多值得关注的函数。例如，你可以通过一个带有字符串类型键/值对的容器来配置日志框架。这样，你就不需要实例化类并调用成员函数了。例如，可以将键\
  \ `Destination` 设置为 `Console`，这将自动让日志框架使用后端 `boost::log::sinks::text_ostream_backend`。可以通过额外的键/值对对后端进行配置。由于该容器也可以被序列化到\
  \ INI 文件中，因此完全可能将配置存储在文本文件中，并使用该文件初始化日志框架。\n\n# 63. Boost.ProgramOptions\n\n[Boost.ProgramOptions](http://www.boost.org/libs/program_options)\
  \ 是一个可以方便解析命令行选项的库，例如用于控制台应用程序的命令行选项。如果你开发的是具有图形用户界面的应用程序，那么命令行选项通常是不重要的。\n\n要使用\
  \ Boost.ProgramOptions 解析命令行选项，需要以下三个步骤：\n\n1.  定义命令行选项。你为它们命名并指定哪些选项可以设置值。如果命令行选项被解析为键/值对，你还需要设置该值的类型——例如，它是字符串还是数字。\n\
  2.  使用解析器评估命令行。你通过 `main()` 函数的两个参数获取命令行，这两个参数通常被称为 `argc` 和 `argv`。\n3.  存储解析器评估后的命令行选项。Boost.ProgramOptions\
  \ 提供了一个派生自 `std::map` 的类，将命令行选项以名/值对的形式保存。之后，你可以检查哪些选项被存储了，以及它们的值是什么。\n\n示例 63.1，“使用\
  \ Boost.ProgramOptions 的基本方法” 演示了使用 Boost.ProgramOptions 解析命令行选项的基本方法。\n\n示例 63.1.\
  \ 使用 Boost.ProgramOptions 的基本方法\n\n```\n#include <boost/program_options.hpp>\n#include\
  \ <iostream>\n\nusing namespace boost::program_options;\n\nvoid on_age(int age)\n\
  {\n  std::cout << \"On age: \" << age << '\\n';\n}\n\nint main(int argc, const char\
  \ *argv[])\n{\n  try\n  {\n    options_description desc{\"Options\"};\n    desc.add_options()\n\
  \      (\"help,h\", \"Help screen\")\n      (\"pi\", value<float>()->default_value(3.14f),\
  \ \"Pi\")\n      (\"age\", value<int>()->notifier(on_age), \"Age\");\n\n    variables_map\
  \ vm;\n    store(parse_command_line(argc, argv, desc), vm);\n    notify(vm);\n\n\
  \    if (vm.count(\"help\"))\n      std::cout << desc << '\\n';\n    else if (vm.count(\"\
  age\"))\n      std::cout << \"Age: \" << vm[\"age\"].as<int>() << '\\n';\n    else\
  \ if (vm.count(\"pi\"))\n      std::cout << \"Pi: \" << vm[\"pi\"].as<float>() <<\
  \ '\\n';\n  }\n  catch (const error &ex)\n  {\n    std::cerr << ex.what() << '\\\
  n';\n  }\n}\n```\n\n要使用 Boost.ProgramOptions，请包含头文件 `boost/program_options.hpp`。你可以在\
  \ `boost::program_options` 命名空间下访问该库的所有类和函数。\n\n使用类 `boost::program_options::options_description`\
  \ 来描述命令行选项。这种类型的对象可以写入如 `std::cout` 等流中，以显示可用命令行选项的概述。传递给构造函数的字符串提供了概述的名称，它作为命令行选项的标题。\n\
  \n`boost::program_options::options_description` 定义了一个成员函数 `add()`，它期望一个类型为 `boost::program_options::option_description`\
  \ 的参数。你调用此函数来描述每个命令行选项。与其为每个命令行选项都调用此函数，示例 63.1，“使用 Boost.ProgramOptions 的基本方法”\
  \ 调用了成员函数 `add_options()`，这使得该任务变得更加简单。\n\n`add_options()` 返回一个代表 `boost::program_options::options_description`\
  \ 类型对象的代理对象。代理对象的类型并不重要。更有意思的是，代理对象简化了许多命令行选项。它使用了重载的 `operator()`，你可以通过调用它来传递定义命令行选项所需的数据。该运算符返回同一个代理对象的引用，允许你多次调用\
  \ `operator()`。示例 63.1，“使用 Boost.ProgramOptions 的基本方法” 借助代理对象定义了三个命令行选项。第一个命令行选项是\
  \ `--help`。该选项的描述被设置为“Help screen”。该选项是一个开关（switch），而不是名/值对。你可以在命令行上设置 `--help`\
  \ 或省略它。无法为 `--help` 设置值。\n\n请注意传递给 `operator()` 的第一个字符串是“help,h”。你可以为命令行选项指定短名称。命令行选项的短名称必须由一个字母组成，并位于逗号后面。现在帮助信息可以通过\
  \ `--help` 或 `-h` 显示。除了 `--help`，还定义两个命令行选项：`--pi` 和 `--age`。这些不是开关，而是名/值对。`--pi`\
  \ 和 `--age` 期望被设置值。\n\n将类型为 `boost::program_options::value_semantic` 的对象的作为 `operator()`\
  \ 的第二个参数，以定义选项为名/值对。你不需要直接访问 `boost::program_options::value_semantic`。你可以使用辅助函数\
  \ `boost::program_options::value()`，它创建一个 `boost::program_options::value_semantic`\
  \ 对象。`boost::program_options::value()` 返回该对象的地址，你可以通过 `operator()` 将其传递。\n\n`boost::program_options::value()`\
  \ 是一个模板函数，接受命令行选项值的类型作为模板参数。因此，命令行选项 `--age` 期望整数，`--pi` 期望浮点数。\n\n`boost::program_options::value()`\
  \ 返回的对象提供实用的成员函数。例如，你可以调用 `default_value()` 提供默认值。示例 63.1，“使用 Boost.ProgramOptions\
  \ 的基本方法” 如果命令行上没有使用该选项，则将其设置为 3.14。\n\n`notifier()` 将一个函数与命令行选项的值关联。然后，该函数将使用命令行选项的值被调用。示例\
  \ 63.1，“使用 Boost.ProgramOptions 的基本方法” 函数 `on_age()` 被关联到 `--age`。如果命令行选项 `--age`\
  \ 用于设置年龄，则年龄将传递给 `on_age()`，后者将其输出到标准输出。\n\n使用 `on_age()` 等函数处理值是可选的。你不需要使用 `notifier()`，因为可以通过其他方式访问值。\n\
  \n在定义所有命令行选项后，使用解析器。示例 63.1，“使用 Boost.ProgramOptions 的基本方法” 调用辅助函数 `boost::program_options::parse_command_line()`\
  \ 来解析命令行。该函数获取 `argc` 和 `argv`（定义命令行）以及 `desc`（包含选项描述）。`boost::program_options::parse_command_line()`\
  \ 返回类型为 `boost::program_options::parsed_options` 的解析选项对象。你通常不直接访问该对象。相反，你将其传递给 `boost::program_options::store()`，从而将解析选项存储在容器中。\n\
  \n\n\n\n# 示例 63.1，“Boost.ProgramOptions 的基本方法”将 `vm` 作为第二个参数传递给 `boost::program_options::store()`。`vm`\
  \ 是一个类型为 `boost::program_options::variables_map`的对象。该类派自 `std::map<std::string,\
  \ boost::program_options::variable_value>`，因此提供了与 `std::map` 相同的成员函数。例如，你可以调用 `count()`\
  \ 来检查某个命令行选项是否已使用并存储在容器中。\n\n在示例 63.1，“Boost.ProgramOptions 的基本方法”中，在访问 `vm` 并调用\
  \ `count()` 之前，调用了 `boost::program_options::notify()`。此函数会触发通过 `notifier()` 与某个值绑定的函数，例如\
  \ `on_age()`。如果没有调用 `boost::program_options::notify()`，`on_age()` 将不会被调用。\n\n`vm`\
  \ 允许你检查某个命令行选项是否存在，同时也允许你访问该命令行选项设置的值。该值的类型是 `boost::program_options::variable_value`，这是一个内部使用\
  \ `boost::any` 的类。你可以从成员函数 `value()` 获取类型为 `boost::any` 的对象。\n\n在示例 63.1，“Boost.ProgramOptions\
  \ 的基本方法”调用的是 `as()` 而不是 `value()`。此成员函数将命令行选项的值转换为作为模板参数传递的类型。`as()` 使用 `boost::any_cast()`\
  \ 进行转换。\n\n确保传递给 `as()` 的类型与命令行选项的类型匹配。例如，示例 63.1，“Boost.ProgramOptions 的基本方法”期望命令行选项\
  \ `--age` 被设置为 `int` 类型，因此 `int` 必须作为模板参数传递给 `as()`。\n\n你可以通过多种方式启动示例 63.1。这是一个示例：\n\
  \n```\ntest\n```\n\n在这种情况下，显示 `Pi: 14`。由于命令行上没有设置 `--pi`，将显示默认值。\n\n此示例使用 `--pi`\
  \ 设置了一个值：\n\n```\ntest --pi 1415\n```\n\n程序现在显示 `Pi: 1415`。\n\n此示例还传递了 age：\n\n\
  ```\ntest --pi 1415 --age 29\n```\n\n输出现在是 `On age: 29` 和 `Age: 29`。当调用 `boost::program_options::notify()`\
  \ 时，写入第一行；这触发了 `on_age()` 的执行。如果未设置 `--age`，程序使用 `else` 语句对 `--pi` 没有输出。\n\n此示例显示帮助信息：\n\
  \n```\ntest -h\n```\n\n你获得了所有命令行选项的完整概述：\n\n```\nOptions:\n  -h Help screen\n  --pi\
  \ Pi\n  --age Age\n```\n\n如所示，由于定义了命令行选项的短名称，帮助可以通过两种方式显示。对于 `--pi`，显示默认值。命令行选项及其描述会自动格式化。你只需要像示例\
  \ 63.1 那样将 `boost::program_options::options_description` 对象写入标准输出即可。\n\n现在，这样启动示例：\n\
  \n```\ntest --age\n```\n\n输出如下：\n\n```\nthe required argument for option '--age'\
  \ is missing.\n```\n\n由于没有设置 `--age`，`boost::program_options::parse_line()` 中的解析器抛出了\
  \ `boost::program_options::error` 异常。该异常被捕获，错误信息被写入标准输出。`boost::program_options::error`\
  \ 派自 `std::logic_error`。Boost.ProgramOptions 定义了更多派自 `boost::program_options::error`\
  \ 的异常。其中之一是 `boost::program_options::invalid_syntax`，如果你为 `--age` 提供值，在示例 63.1 中就会抛出该异常。\n\
  \n示例 63.2，“Boost.ProgramOptions 的特殊配置”介绍了 Boost.ProgramOptions 可用的更多配置。\n\n## 示例\
  \ 63.2. Boost.ProgramOptions 的特殊配置\n\n```cpp\n#include <boost/program_options.hpp>\n\
  #include <string>\n#include <vector>\n#include <algorithm>\n#include <iterator>\n\
  #include <iostream>\n\nusing namespace boost::program_options;\n\nvoid to_cout(const\
  \ std::vector<std::string> &v)\n{\n  std::copy(v.begin(), v.end(), std::ostream_iterator<std::string>{\n\
  \    std::cout, \"\\n\"});\n}\n\nint main(int argc, const char *argv[])\n{\n  try\n\
  \  {\n    int age;\n\n    options_description desc{\"Options\"};\n    desc.add_options()\n\
  \      (\"help,h\", \"Help screen\")\n      (\"pi\", value<float>()->implicit_value(3.14f),\
  \ \"Pi\")\n      (\"age\", value<int>(&age), \"Age\")\n      (\"phone\", value<std::vector<std::string>>()->multitoken()->\n\
  \        zero_tokens()->composing(), \"Phone\")\n      (\"unreg\", \"Unrecognized\
  \ options\");\n\n    command_line_parser parser{argc, argv};\n    parser.options(desc).allow_unregistered().style(\n\
  \      command_line_style::default_style |\n      command_line_style::allow_slash_for_short);\n\
  \    parsed_options parsed_options = parser.run();\n\n    variables_map vm;\n  \
  \  store(parsed_options, vm);\n    notify(vm);\n\n    if (vm.count(\"help\"))\n\
  \      std::cout << desc << '\\n';\n    else if (vm.count(\"age\"))\n      std::cout\
  \ << \"Age: \" << age << '\\n';\n    else if (vm.count(\"phone\"))\n      to_cout(vm[\"\
  phone\"].as<std::vector<std::string>>());\n    else if (vm.count(\"unreg\"))\n \
  \     to_cout(collect_unrecognized(parsed_options.options,\n        exclude_positional));\n\
  \    else if (vm.count(\"pi\"))\n      std::cout << \"Pi: \" << vm[\"pi\"].as<float>()\
  \ << '\\n';\n  }\n  catch (const error &ex)\n  {\n    std::cerr << ex.what() <<\
  \ '\\n';\n  }\n}\n```\n\n示例 63.2，“Boost.ProgramOptions 的特殊配置”解析命令行选项的方式与之前的示例。。然而存在一些显著区别。例如，在定义\
  \ `--pi` 命令行选项时，调用的是 `implicit_value()` 而不是 `default_value()`。这意味着 pi 默认设置为 3.14。必须在命令行上设置\
  \ `--pi`，pi 才是可用的。但是，如果你使用了 `implicit_value()`，则不需要为 `--pi` 命令行选项提供值。传递 `--pi` 而不设置值即可。\n\
  \n\n\n\n\nExample 63.2, “Special configuration settings with Boost.ProgramOptions”\
  \ 支持一个新的命令行选项 `--phone`，用于向程序传递电话号码。事实上，你可以在命令行上传递多个电话号码。例如，以下命令行使用电话号码 123 和 456\
  \ 启动程序：\n\n```\ntest --phone 123 456\n```\n\nExample 63.2, “Special configuration\
  \ settings with Boost.ProgramOptions” 之所以支持多个电话号码，是因为在 fact 该命令行选项的值上调用了 `multitoken()`。此外，由于调用了\
  \ `zero_tokens()`，`--phone` 也可以在不传递电话号码的情况下使用。\n\n你也可以通过重复使用 `--phone` 选项来传递多个电话号码，如下方的命令行所示：\n\
  \n```\ntest --phone 123 --phone 456\n```\n\n在这种情况下，两个电话号码 123 和 456 被解析。对 `composing()`\
  \ 的调用使得多次使用命令行选项成为可能——值会被组合在一起。\n\n`--phone` 参数的值类型为 `std::vector<std::string>`。你需要使用一个容器来存储多个电话号码。\n\
  \nExample 63.2, “Special configuration settings with Boost.ProgramOptions” 定义了另一个命令行选项\
  \ `--unreg`。这是一个无法设置数值的开关（switch）。它在示例的后部分被用于决定是否显示未在 `desc` 中定义的命令行选项。\n\n虽然 Example\
  \ 63.1, “Basic approach with Boost.ProgramOptions” 调用函数 `boost::program_options::parse_command_line()`\
  \ 来解析命令行选项，但 Example 63.2, “Special configuration settings with Boost.ProgramOptions”\
  \ 使用类型为 `boost::program_options::command_line_parser` 的解析器。`argc` 和 `argv` 被传递给构造函数。\n\
  \n`boost::program_options::command_line_parser` 提供了几个成员函数。你必须调用 `options()` 将命令行选项的定义传递给解析器。\n\
  \n与其他成员函数一样，`options()` 返回对同一个解析器的引用。这样，就可以方便地链式调用成员函数。Example 63.2, “Special configuration\
  \ settings with Boost.ProgramOptions” 在 `options()` 之后调用 `allow_unregistered()`，以告诉解析器在检测到未知命令行选项时不抛出异常。最后，调用\
  \ `style()` 告诉解析器可以使用斜杠配合短名称。因此，`--help` 选项的短名称可以是 `-h` 也可以是 `/h`。\n\n请注意，`boost::program_options::parse_command_line()`\
  \ 支持第四个参数，该参数会被转发给 `style()`。如果你想使用类似 `boost::program_options::command_line_style::allow_slash_for_short`\
  \ 的选项，你仍然可以使用 `boost::program_options::parse_command_line()` 函数。\n\n配置完成后，在解析器上调用\
  \ `run()`。该成员函数返回一个类型为 `boost::program_options::parsed_options` 的对象的解析后的命令行选项，你可以将其传递给\
  \ `boost::program_options::store()` 将选项存储在 `vm` 中。\n\n在代码的后续，Example 63.2, “Special\
  \ configuration settings with Boost.ProgramOptions” 再次访问 `vm` 以评估命令行选项。只有调用 `boost::program_options::collect_unrecognized()`\
  \ 是新的。该函数为命令行选项 `--unreg` 调用。该函数期望一个类型为 `boost::program_options::parsed_options`\
  \ 的对象（由 `run()` 返回）。它将所有未知的命令行选项返回到一个 `std::vector<std::string>`。例如，如果你用 `test --unreg\
  \ --abc` 启动程序，`--abc` 将写入标准输出。\n\n当将 `boost::program_options::exclude_positional`\
  \ 作为第二个参数传递给 `boost::program_options::collect_unrecognized()` 时，位置选项会被忽略。对于 Example\
  \ 63.2, “Special configuration settings with Boost.ProgramOptions”，这并不重要，因为没有定义位置选项。然而，`boost::program_options::collect_unrecognized()`\
  \ 需要此参数。\n\nExample 63.3, “Positional options with Boost.ProgramOptions” 展示了位置选项。\n\
  \n### Example 63.3. Positional options with Boost.ProgramOptions\n\n```cpp\n#include\
  \ <boost/program_options.hpp>\n#include <string>\n#include <vector>\n#include <algorithm>\n\
  #include <iostream>\n\nusing namespace boost::program_options;\n\nvoid to_cout(const\
  \ std::vector<std::string> &v)\n{\n  std::copy(v.begin(), v.end(),\n    std::ostream_iterator<std::string>{std::cout,\
  \ \"\\n\"});\n}\n\nint main(int argc, const char *argv[])\n{\n  try\n  {\n    options_description\
  \ desc{\"Options\"};\n    desc.add_options()\n      (\"help,h\", \"Help screen\"\
  )\n      (\"phone\", value<std::vector<std::string>>()->\n        multitoken()->zero_tokens()->composing(),\
  \ \"Phone\");\n\n    positional_options_description pos_desc;\n    pos_desc.add(\"\
  phone\", -1);\n\n    command_line_parser parser{argc, argv};\n    parser.options(desc).positional(pos_desc).allow_unregistered();\n\
  \    parsed_options parsed_options = parser.run();\n\n    variables_map vm;\n  \
  \  store(parsed_options, vm);\n    notify(vm);\n\n    if (vm.count(\"help\"))\n\
  \      std::cout << desc << '\\n';\n    else if (vm.count(\"phone\"))\n      to_cout(vm[\"\
  phone\"].as<std::vector<std::string>>());\n  }\n  catch (const error &ex)\n  {\n\
  \    std::cerr << ex.what() << '\\n';\n  }\n}\n```\n\n\n\n\n\n对类型为 `boost::program_options::positional_options_description`\
  \ 的对象调用 `add()`，可以使用位置数字将命令行上的值分配给命令行选项。当使用命令行 `test 123 456` 调用 示例 63.3, “使用 Boost.ProgramOptions\
  \ 的位置参数” 时，123 的位置号为 0， 456 的位置号为 1。示例 63.3, “使用 Boost.ProgramOptions 的位置参数” 会向\
  \ `add()` 传递 -1，这会将所有值 —— 123 和 456 —— 都分配给 `--phone`。如果你将 示例 63.3, “使用 Boost.ProgramOptions\
  \ 的位置参数” 修改为向 `add()` 传递值 0，则只有 123 会识别为电话号码。如果向 `add()` 传递 1，则只有 456 会被识别。\n\n\
  `pos_desc` 通过 `positional()` 传递给解析器。解析器以此知道哪些命令行选项是位置参数。\n\n请注意，你必须确保已经定义了位置参数。例如，在\
  \ 示例 63.3, “使用 Boost.ProgramOptions 的位置参数” 中，“phone” 只能被传递给 `add()`，因为 `desc` 中已经存在\
  \ `--phone` 的定义。\n\n在所有之前的示例中，Boost.ProgramOptions 都被用于解析命令行选项。然而，该库也支持从文件加载配置选项。如果需要重复设置相同的命令行选项，这将非常有用。\n\
  \n示例 63.4, “从配置文件加载选项” 使用两个类型为 `boost::program_options::options_description` 的对象。`generalOptions`\
  \ 定义了必须在命令行设置的选项。`fileOptions` 定义了可以从配置文件加载的选项。\n\n并不是强制要求使用两个不同类型的 `boost::program_options::options_description`\
  \ 对象来定义选项。如果命令行和文件使用的选项集相同，则可以使用其中一个。在 示例 63.4, “从配置文件加载选项” 中，分离选项是有意义的，因为你不希望允许在配置文件中设置\
  \ `--help`。如果允许这样做且用户在配置文件中放入了该选项，程序每次运行时都会显示帮助屏幕。\n\n示例 63.4, “从配置文件加载选项” 从配置文件加载\
  \ `--age`。你可以将配置文件的名称作为命令行选项传递。在这个示例中，由于原因，`--config` 在 `generalOptions` 中定义。\n\n\
  在用 `boost::program_options::parse_command_line()` 解析命令行选项并将其存储在 `vm` 后，示例检查 `--config`\
  \ 是否被设置。如果是，则用 `std::ifstream` 打开配置文件。将 `std::ifstream` 对象连同描述选项的 `fileOptions`\
  \ 一起传递给函数 `boost::program_options::parse_config_file()`。`boost::program_options::parse_config_file()`\
  \ 的作用与 `boost::program_options::parse_command_line()` 相同，并在类型为 `boost::program_options::parsed_options`\
  \ 的对象中返回解析后的选项。将其传递传递 `boost::program_options::store()` 以将解析后的选项存储在 `vm` 中。\n\n\
  示例 63.4. 从配置文件加载选项\n\n```\n#include <boost/program_options.hpp>\n#include <string>\n\
  #include <fstream>\n#include <iostream>\n\nusing namespace boost::program_options;\n\
  \nint main(int argc, const char *argv[])\n{\n  try\n  {\n    options_description\
  \ generalOptions{\"General\"};\n    generalOptions.add_options()\n      (\"help,h\"\
  , \"Help screen\")\n      (\"config\", value<std::string>(), \"Config file\");\n\
  \n    options_description fileOptions{\"File\"};\n    fileOptions.add_options()\n\
  \      (\"age\", value<int>(), \"Age\");\n\n    variables_map vm;\n    store(parse_command_line(argc,\
  \ argv, generalOptions), vm);\n    if (vm.count(\"config\"))\n    {\n      std::ifstream\
  \ ifs{vm[\"config\"].as<std::string>().c_str()};\n      if (ifs)\n        store(parse_config_file(ifs,\
  \ fileOptions), vm);\n    }\n    notify(vm);\n\n    if (vm.count(\"help\"))\n  \
  \    std::cout << generalOptions << '\\n';\n    else if (vm.count(\"age\"))\n  \
  \    std::cout << \"Your age is \" << vm[\"age\"].as<int>() << '\\n';\n  }\n  catch\
  \ (const error &ex)\n  {\n    std::cerr << ex.what() << '\\n';\n  }\n}\n```\n\n\
  # 64. Boost.Serialization\n\n该库 [Boost.Serialization](http://www.boost.org/libs/serialization)\
  \ 使得 C++ 程序中的对象转换为可以保存和加载的字节序列成为可能。提供了不同的数据格式来定义生成字节序列的规则。Boost.Serialization 支持的所有格式都仅供此库使用。例如，为\
  \ Boost.Serialization 开发的 XML 格式不应用于与未使用 Boost 的程序进行数据交换。\n\nBoost.Serialization\
  \ 的核心概念是存档（archive）。存档是表示序列化后 C++ 对象的字节序列。可以将对象添加到存档中进行序列化，稍后从存档中加载。为了恢复之前保存的 C++\
  \ 对象，假定类型是相同的。\n\n该库提供了存档类，例如 `boost::archive::text_oarchive`，它定义在 `boost/archive/text_oarchive.hpp`\
  \ 中。该类使得将对象序列化为文本流成为可能。在 Boost 1.56.0 中，示例 64.1, “使用 `boost::archive::text_oarchive`\
  \ 向标准输出流写入 `22 serialization::archive 11 1`。\n\nBoost.ProgramOptions 还定义了函数 `boost::program_options::parse_environment()`，可以从环境加载选项。`environment_iterator`\
  \ 类允许你遍历环境变量。\n\n### 注意\n\n正如 Boost 库 1.55.0 版本的[发布说明](http://www.boost.org/users/history/version_1_55_0.html)所示，缺少包含会导致\
  \ Visual C++ 2013 出现编译错误。该错误在 Boost 1.56.0 中已修复。\n\n示例 64.1. 使用 `boost::archive::text_oarchive`\n\
  \n```\n#include <boost/archive/text_oarchive.hpp>\n#include <iostream>\n\nusing\
  \ namespace boost::archive;\n\nint main()\n{\n  text_oarchive oa{std::cout};\n \
  \ int i = 1;\n  oa << i;\n}\n```\n\n\n\n\n\n由此所示，类型为 `boost::archive::text_oarchive`\
  \ 的对象 `oa` 可以像流一样使用，通过 `operator<<` 来序列化变量。然而，不应将归档视为存储任意数据的普通流。要恢复数据，你必须按照存储的方式来访问它，并使用相同的数据类型和相同的顺序。示例\
  \ 64.2, “使用 `boost::archive::text_iarchive`” 序列化并恢复了一个 `int` 类型的变量。\n\n### 示例 64.2.\
  \ 使用 `boost::archive::text_iarchive`\n\n```cpp\n#include <boost/archive/text_oarchive.hpp>\n\
  #include <boost/archive/text_iarchive.hpp>\n#include <iostream>\n#include <fstream>\n\
  \nusing namespace boost::archive;\n\nvoid save()\n{\n  std::ofstream file{\"archive.txt\"\
  };\n  text_oarchive oa{file};\n  int i = 1;\n  oa << i;\n}\n\nvoid load()\n{\n \
  \ std::ifstream file{\"archive.txt\"};\n  text_iarchive ia{file};\n  int i = 0;\n\
  \  ia >> i;\n  std::cout << i << '\\n';\n}\n\nint main()\n{\n  save();\n  load();\n\
  }\n```\n\n`boost::archive::text_oarchive` 类将数据作为文本流序列化，而 `boost::archive::text_iarchive`\
  \ 类则从这样的文本流中恢复数据。要使用这些类，请包含头文件 `boost/archive/text_iarchive.hpp` 和 `boost/archive/text_oarchive.hpp`。\n\
  \n归档的构造函数期望一个输入或输出流作为参数。该流用于序列化或恢复数据。虽然示例 64.2, “使用 `boost::archive::text_iarchive`”\
  \ 的是文件，但也可以使用其他流，例如 stringstream。\n\n### 示例 64.3. 使用 stringstream 序列化\n\n```cpp\n\
  #include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <iostream>\n#include <sstream>\n\nusing namespace boost::archive;\n\nstd::stringstream\
  \ ss;\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  int i = 1;\n  oa << i;\n}\n\n\
  void load()\n{\n  text_iarchive ia{ss};\n  int i = 0;\n  ia >> i;\n  std::cout <<\
  \ i << '\\n';\n}\n\nint main()\n{\n  save();\n  load();\n}\n```\n\n示例 64.3, “使用\
  \ stringstream 序列化” 使用 stringstream 序列化数据并向标准输出写入了 `1`。\n\n到为止，只有基本类型被序列化了。示例 64.4,\
  \ “使用成员函数序列化用户定义类型” 显示了如何序列化用户定义类型的对象。为了序列化用户定义类型的对象，你必须定义成员函数 `serialize()`。该函数在对象序列化到字节流或从字节流恢复时被调用。由于\
  \ `serialize()` 同时用于序列化和恢复，Boost.Serialization 除了 `operator<<` 和 `operator>>` 之外，还支持\
  \ `operator&`。使用 `operator&` 则无需在 `serialize()` 内部区分序列化和恢复。\n\n### 示例 64.4. 使用成员函数序列化用户定义类型\n\
  \n```cpp\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <iostream>\n#include <sstream>\n\nusing namespace boost::archive;\n\nstd::stringstream\
  \ ss;\n\nclass animal\n{\npublic:\n  animal() = default;\n  animal(int legs) : legs_{legs}\
  \ {}\n  int legs() const { return legs_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  void serialize(Archive &ar, const unsigned int\
  \ version) { ar & legs_; }\n\n  int legs_;\n};\n\nvoid save()\n{\n  text_oarchive\
  \ oa{ss};\n  animal a{4};\n  oa << a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n\
  \  animal a;\n  ia >> a;\n  std::cout << a.legs() << '\\n';\n}\n\nint main()\n{\n\
  \  save();\n  load();\n}\n```\n\n每当对象被序列化或恢复时，`serialize()` 自动调用。它不应该被显式调用，因此应该声明为私有。如果声明为私有，则必须将\
  \ `boost::serialization::access` 类声明为它的友元。\n\n### 示例 64.5. 使用全局函数序列化\n\n```cpp\n\
  #include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <iostream>\n#include <sstream>\n\nusing namespace boost::archive;\n\nstd::stringstream\
  \ ss;\n\nstruct animal\n{\n  int legs_;\n\n  animal() = default;\n  animal(int legs)\
  \ : legs_{legs} {}\n  int legs() const { return legs_; }\n};\n\ntemplate <typename\
  \ Archive>\nvoid serialize(Archive &ar, animal &a, const unsigned int version)\n\
  {\n  ar & legs_;\n}\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4};\n\
  \  oa << a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n  ia >>\
  \ a;\n  std::cout << a.legs() << '\\n';\n}\n\nint main()\n{\n  save();\n  load();\n\
  }\n```\n\n可能某些情况不允许修改示例 64.5, “使用全局函数序列化” 现有类，该函数期望一个对象的引用作为第二个参数。\n\n将 `serialize()`\
  \ 实现为全局函数需要类的成员变量可以从外部访问。示例 64.5, “使用全局函数序列化” `legs_` 不再是 `animal` 的私有成员。\n\nBoost.Serialization\
  \ 为标准库中的许多类提供了 `serialize()` 函数。为了序列化基于标准类的对象，需要包含额外的头文件。\n\n### 示例 64.6. 序列化字符串\n\
  \n```cpp\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <boost/serialization/string.hpp>\n#include <iostream>\n#include <sstream>\n\
  #include <string>\n#include <utility>\n\nusing namespace boost::archive;\n\nstd::stringstream\
  \ ss;\n\nclass animal\n{\npublic:\n  animal() = default;\n  animal(int legs, std::string\
  \ name) :\n    legs_{legs}, name_{std::move(name)} {}\n  int legs() const { return\
  \ legs_; }\n  const std::string &name() const { return name_; }\n\nprivate:\n  friend\
  \ class boost::serialization::access;\n\n  template <typename Archive>\n  friend\
  \ void serialize(Archive &ar, animal &a, const unsigned int version);\n\n  int legs_;\n\
  \  std::string name_;\n};\n\ntemplate <typename Archive>\nvoid serialize(Archive\
  \ &ar, animal &a, const unsigned int version)\n{\n  ar & a.legs_;\n  ar & a.name_;\n\
  }\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4, \"cat\"};\n  oa << a;\n\
  }\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n  ia >> a;\n  std::cout\
  \ << a.legs() << '\\n';\n  std::cout << a.name() << '\\n';\n}\n\nint main()\n{\n\
  \  save();\n  load();\n}\n```\n\n示例 64.6, “序列化字符串” 通过增加一个类型为 `std::string` 的成员变量\
  \ `name_` 扩展了 `animal` 类。为了序列化该成员变量，必须包含 `boost/serialization/string.hpp` 头以提供相应的全局\
  \ `serialize()` 函数。\n\n\n\n\n如前所述，`Boost.Serialization` 为标准库中的许多类定义了 `serialize()`\
  \ 函数。这些函数定义在头文件中，其文件名与标准库中对应的头文件同名。因此，要序列化 `std::string` 类型的对象，请包含头文件 `boost/serialization/string.hpp`；要序列化\
  \ `std::vector` 类型的对象，请包含头文件 `boost/serialization/vector.hpp`。包含哪个头文件是显而易见的。\n\n\
  `serialize()` 函数目前为止被忽略的一个参数是 `version`。该参数有助于使存档具有向后兼容性。示例 64.7, “版本数的向后兼容性” 可以加载由示例\
  \ 64.5, “使用独立函数进行序列化” 创建的存档。示例 64.5, “使用独立函数进行序列化” 中 `animal` 类的版本不包含名称。示例 64.7,\
  \ “版本数的向后兼容性” 在加载存档时会检查版本号，并且仅当版本大于 0 时才访问名称。这允许它处理一个在没有名称的情况下创建的旧版本存档。\n\n宏 `BOOST_CLASS_VERSION`\
  \ 为一个类分配一个版本号。示例 64.7, “版本数的向后兼容性” 中 `animal` 类的版本号为 1。如果没有使用 `BOOST_CLASS_VERSION`，则版本号默认为\
  \ 0。\n\n### 示例 64.7. 版本数的向后兼容性\n\n```\n#include <boost/archive/text_oarchive.hpp>\n\
  #include <boost/archive/text_iarchive.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <iostream>\n#include <sstream>\n#include <string>\n#include <utility>\n\
  \nusing namespace boost::archive;\n\nstd::stringstream ss;\n\nclass animal\n{\n\
  public:\n  animal() = default;\n  animal(int legs, std::string name) :\n    legs_{legs},\
  \ name_{std::move(name)} {}\n  int legs() const { return legs_; }\n  const std::string\
  \ &name() const { return name_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  friend void serialize(Archive &ar, animal &a,\
  \ const unsigned int version);\n\n  int legs_;\n  std::string name_;\n};\n\ntemplate\
  \ <typename Archive>\nvoid serialize(Archive &ar, animal &a, const unsigned int\
  \ version)\n{\n  ar & a.legs_;\n  if (version > 0)\n    ar & a.name_;\n}\n\nBOOST_CLASS_VERSION(animal,\
  \ 1)\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4, \"cat\"};\n  oa <<\
  \ a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n  ia >> a;\n  std::cout\
  \ << a.legs() << '\\n';\n  std::cout << a.name() << '\\n';\n}\n\nint main()\n{\n\
  \  save();\n  load();\n}\n```\n\n版本号存储在存档中，并是存档的一部分。虽然通过 `BOOST_CLASS_VERSION` 宏为特定类指定的版本号在序列化期间会被使用，但在恢复时，`serialize()`\
  \ 的 `version` 参数会被设置为存档中存储的值。如果 `animal` 的新版本访问一个包含用旧版本序列化的对象的存档，那么成员变量 `name_`\
  \ 将不会被恢复，因为旧版本没有该成员变量。\n\n## 指针和引用\n\nBoost.Serialization 还可以序列化指针和引用。由于指针存储的是对象的地址，因此序列化地址没有太大意义。在序列化指针和引用时，被引用的对象会被序列化。\n\
  \n示例 64.8, “序列化指针” 使用 `new` 创建一个 `animal` 类型的新对象，并将其赋值给指针 `a`。然后序列化的是指针——而不是 `*a`。Boost.Serialization\
  \ 会自动序列化 `a` 引用的对象，而不是对象的地址。\n\n如果恢复了存档，`a` 不一定包含相同的地址。相反会创建一个新对象并将其地址赋值给 `a`。Boost.Serialization\
  \ 只保证该对象与序列化的对象相同，而不保证其地址相同。\n\n由于智能指针与动态分配内存内存使用，Boost.Serialization 也为它们提供了支持。\n\
  \n### 示例 64.8. 序列化指针\n\n```\n#include <boost/archive/text_oarchive.hpp>\n#include\
  \ <boost/archive/text_iarchive.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <iostream>\n#include <sstream>\n#include <string>\n#include <utility>\n\
  \nusing namespace boost::archive;\n\nstd::stringstream ss;\n\nclass animal\n{\n\
  public:\n  animal() = default;\n  animal(int legs, std::string name) :\n    legs_{legs},\
  \ name_{std::move(name)} {}\n  int legs() const { return legs_; }\n  const std::string\
  \ &name() const { return name_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  friend void serialize(Archive &ar, animal &a,\
  \ const unsigned int version);\n\n  int legs_;\n  std::string name_;\n};\n\ntemplate\
  \ <typename Archive>\nvoid serialize(Archive &ar, animal &a, const unsigned int\
  \ version)\n{\n  ar & a.legs_;\n  if (version > 0)\n    ar & a.name_;\n}\n\nBOOST_CLASS_VERSION(animal,\
  \ 1)\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4, \"cat\"};\n  oa <<\
  \ a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n  ia >> a;\n  std::cout\
  \ << a.legs() << '\\n';\n  std::cout << a.name() << '\\n';\n}\n\nint main()\n{\n\
  \  save();\n  load();\n}\n```\n\n### 6 .......\n\n```\n#include <boost/archive/text_oarchive.hpp>\n\
  #include <boost/archive/text_iarchive.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <iostream>\n#include <sstream>\n#include <string>\n#include <utility>\n\
  \nusing namespace boost::archive;\n\nstd::stringstream ss;\n\nclass animal\n{\n\
  public:\n  animal() = default;\n  animal(int legs, std::string name) :\n    legs_{legs},\
  \ name_{std::move(name)} {}\n  int legs() const { return legs_; }\n  const std::string\
  \ &name() const { return name_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  friend void serialize(Archive &ar, animal &a,\
  \ const unsigned int version);\n\n  int legs_;\n  std::string name_;\n};\n\ntemplate\
  \ <typename Archive>\nvoid serialize(Archive &ar, animal &a, const unsigned int\
  \ version)\n{\n  ar & a.legs_;\n  if (version > 0)\n    ar & a.name_;\n}\n\nBOOST_CLASS_VERSION(animal,\
  \ 1)\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4, \"cat\"};\n  oa <<\
  \ a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n  ia >> a;\n  std::cout\
  \ << a.legs() << '\\n';\n  std::cout << a.name() << '\\n';\n}\n\nint main()\n{\n\
  \  save();\n  load();\n}\n```\n\n示例 64.9, “序列化指针” 使用智能指针 `boost::scoped_ptr` 来管理动态分配的\
  \ `animal` 类型对象。包含头文件 `boost/serialization/scoped_ptr.hpp` 以序列化此类指针。要序列化 `boost::shared_ptr`\
  \ 类型的智能指针，使用头文件 `boost/serialization/shared_ptr.hpp`。\n\n### 示例 64.10. 序列化引用\n\n\
  ```\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <iostream>\n#include <sstream>\n\nusing namespace boost::archive;\n\nstd::stringstream\
  \ ss;\n\nclass animal\n{\npublic:\n  animal() = default;\n  animal(int legs, std::string\
  \ name) :\n    legs_{legs}, name_{std::move(name)} {}\n  int legs() const { return\
  \ legs_; }\n  const std::string &name() const { return name_; }\n\nprivate:\n  friend\
  \ class boost::serialization::access;\n\n  template <typename Archive>\n  void serialize(Archive\
  \ &ar, const unsigned int version) { ar & legs_; }\n\n  int legs_;\n  std::string\
  \ name_;\n};\n\nvoid save()\n{\n  text_oarchive oa{ss};\n  animal a{4};\n  animal\
  \ &r = a;\n  oa << r;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal a;\n\
  \  animal &r = a;\n  ia >> r;\n  std::cout << r.legs() << '\\n';\n}\n\nint main()\n\
  {\n  save();\n  load();\n}\n```\n\n请注意，Boost.Serialization 尚未针对 C++11 更新。C++11 标准库中的智能指针（如\
  \ `std::shared_ptr` 和 `std::unique_ptr`）目前不受 Boost.Serialization 支持。\n\n\n\n\n\n\
  Boost.Serialization 也可以毫无问题地序列化引用（参见 示例 64.10，“序列化引用”）。与指针一样，被引用的对象会被序列化。\n\n##\
  \ 类层次结构对象的序列化\n\n根据类层次结构序列化对象时，派生类必须在成员函数 `serialize()` 访问函数 `boost::serialization::base_object()`。该函数确保基类的继承成员变量被正确地序列化。\n\
  \n示例 64.11，“正确地序列化派生类” 使用了一个名为 `bird` 的类，该类派生自 `animal`。`animal` 和 `bird` 都定义了一个私有成员函数\
  \ `serialize()`，使得可以基于任何一个类序列化对象。由于 `bird` 派生自 `animal`，`serialize()` 必须确保继承自 `animal`\
  \ 的成员变量也被序列化。\n\n通过在派生类的成员函数 `serialize()` 内部访问基类并调用 `boost::serialization::base_object()`\
  \ 来序列化继承的成员变量。你必须使用此函数，例如 `static_cast`，因为只有 `boost::serialization::base_object()`\
  \ 能确保正确的序列化。\n\n示例 64.11. 正确地序列化派生类\n\n```cpp\n#include <boost/archive/text_oarchive.hpp>\n\
  #include <boost/archive/text_iarchive.hpp>\n#include <iostream>\n#include <sstream>\n\
  \nusing namespace boost::archive;\nstd::stringstream ss;\n\nclass animal\n{\npublic:\n\
  \  animal() = default;\n  animal(int legs) : legs_{legs} {}\n  int legs() const\
  \ { return legs_; }\n\nprivate:\n  friend class boost::serialization::access;\n\n\
  \  template <typename Archive>\n  void serialize(Archive &ar, const unsigned int\
  \ version) { ar & legs_; }\n\n  int legs_;\n};\n\nclass bird : public animal\n{\n\
  public:\n  bird() = default;\n  bird(int legs, bool can_fly) :\n    animal{legs},\
  \ can_fly_{can_fly} {}\n  bool can_fly() const { return can_fly_; }\n\nprivate:\n\
  \  friend class boost::serialization::access;\n\n  template <typename Archive>\n\
  \  void serialize(Archive &ar, const unsigned int version)\n  {\n    ar & boost::serialization::base_object<animal>(*this);\n\
  \    ar & can_fly_;\n  }\n\n  bool can_fly_;\n};\n\nvoid save()\n{\n  text_oarchive\
  \ oa{ss};\n  bird penguin{2, false};\n  oa << penguin;\n}\n\nvoid load()\n{\n  text_iarchive\
  \ ia{ss};\n  bird penguin;\n  ia >> penguin;\n  std::cout << penguin.legs() << '\\\
  n';\n  std::cout << std::boolalpha << penguin.can_fly() << '\\n';\n}\n\nint main()\n\
  {\n  save();\n  load();\n}\n```\n\n动态创建对象的地址可以赋值给相应基类类型的指针。示例 64.12，“使用 `BOOST_CLASS_EXPORT`\
  \ 静态注册派生类” 显示了 Boost.Serialization 也能正确地序列化它们。\n\n示例 64.12. 使用 `BOOST_CLASS_EXPORT`\
  \ 静态注册派生类\n\n```cpp\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <boost/serialization/export.hpp>\n#include <iostream>\n#include <sstream>\n\
  \nusing namespace boost::archive;\n\nstd::stringstream ss;\n\nclass animal\n{\n\
  public:\n  animal() = default;\n  animal(int legs) : legs_{legs} {}\n  virtual int\
  \ legs() const { return legs_; }\n  virtual ~animal() = default;\n\nprivate:\n \
  \ friend class boost::serialization::access;\n\n  template <typename Archive>\n\
  \  void serialize(Archive &ar, const unsigned int version) { ar & legs_; }\n\n \
  \ int legs_;\n};\n\nclass bird : public animal\n{\npublic:\n  bird() = default;\n\
  \  bird(int legs, bool can_fly) :\n    animal{legs}, can_fly_{can_fly} {}\n  bool\
  \ can_fly() const { return can_fly_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  void serialize(Archive &ar, const unsigned int\
  \ version)\n  {\n    ar & boost::serialization::base_object<animal>(*this);\n  \
  \  ar & can_fly_;\n  }\n\n  bool can_fly_;\n};\n\nBOOST_CLASS_EXPORT(bird)\n\nvoid\
  \ save()\n{\n  text_oarchive oa{ss};\n  animal *a = new bird{2, false};\n  oa <<\
  \ a;\n  delete a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  animal *a;\n\
  \  ia >> a;\n  std::cout << a->legs() << '\\n';\n  delete a;\n}\n\nint main()\n\
  {\n  save();\n  load();\n}\n```\n\n`BOOST_CLASS_EXPORT` 的优势在于它注册了后续可能不会被使用的类型。\n\
  \n（注：原文后部分存在大量重复的描述文本，已根据翻译要求进行整合并保持逻辑一致）\n\n示例 64.13. 使用 `register_type()` 动态注册派生类\n\
  \n```cpp\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <boost/serialization/export.hpp>\n#include <iostream>\n#include <sstream>\n\
  \nusing namespace boost::archive;\n\nstd::stringstream ss;\n\nclass animal\n{\n\
  public:\n  animal() = default;\n  animal(int legs) : legs_{legs} {}\n  virtual int\
  \ legs() const { return legs_; }\n  virtual ~animal() = default;\n\nprivate:\n \
  \ friend class boost::serialization::access;\n\n  template <typename Archive>\n\
  \  void serialize(Archive &ar, const unsigned int version) { ar & legs_; }\n\n \
  \ int legs_;\n};\n\nclass bird : public animal\n{\npublic:\n  bird() = default;\n\
  \  bird(int legs, bool can_fly) :\n    animal{legs}, can_fly_{can_fly} {}\n  bool\
  \ can_fly() const { return can_fly_; }\n\nprivate:\n  friend class boost::serialization::access;\n\
  \n  template <typename Archive>\n  void serialize(Archive &ar, const unsigned int\
  \ version)\n  {\n    ar & boost::serialization::base_object<animal>(*this);\n  \
  \  ar & can_fly_;\n  }\n\n  bool can_fly_;\n};\n\nvoid save()\n{\n  text_oarchive\
  \ oa{ss};\n  oa.register_type<bird>();\n  animal *a = new bird{2, false};\n  oa\
  \ << a;\n  delete a;\n}\n\nvoid load()\n{\n  text_iarchive ia{ss};\n  ia.register_type<bird>();\n\
  \  animal *a;\n  ia >> a;\n  std::cout << a->legs() << '\\n';\n  delete a;\n}\n\n\
  int main()\n{\n  save();\n  load();\n}\n```\n\n## 用于优化的包装函数\n\n本节引入了包装函数来优化序列化过程。这些函数标记对象，允许\
  \ Boost.Serialization 应用某些优化技术。\n\n示例 64.14. 不使用包装函数序列化数组\n\n\n\n\n```cpp\n#include\
  \ <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <boost/array.hpp>\n#include <iostream>\n#include <sstream>\n\nusing namespace\
  \ boost::archive;\n\nstd::stringstream ss;\n\nvoid save()\n{\n  text_oarchive oa{ss};\n\
  \  boost::array<int, 3> a{{0, 1, 2}};\n  oa << a;\n}\n\nvoid load()\n{\n  text_iarchive\
  \ ia{ss};\n  boost::array<int, 3> a;\n  ia >> a;\n  std::cout << a[0] << \", \"\
  \ << a[1] << \", \" << a[2] << '\\n';\n}\n\nint main()\n{\n  save();\n  load();\n\
  }\n```\n\n示例 64.14, “不使用包装函数序列化数组” 在未使用任何包装函数的情况下使用了 Boost.Serialization。该示例创建并向字符串写入了值\
  \ `22 serialization::archive 11 0 0 3 0 1 2`。使用包装函数 `boost::serialization::make_array()`，写入的值可以缩短为以下字符串：`22\
  \ serialization::archive 11 0 1 2`。\n\n示例 64.15. 使用包装函数 `make_array()` 序列化数组\n\n\
  ```cpp\n#include <boost/archive/text_oarchive.hpp>\n#include <boost/archive/text_iarchive.hpp>\n\
  #include <boost/serialization/array.hpp>\n#include <array>\n#include <iostream>\n\
  #include <sstream>\n\nusing namespace boost::archive;\n\nstd::stringstream ss;\n\
  \nvoid save()\n{\n  text_oarchive oa{ss};\n  std::array<int, 3> a{{0, 1, 2}};\n\
  \  oa << boost::serialization::make_array(a.data(), a.size());\n}\n\nvoid load()\n\
  {\n  text_iarchive ia{ss};\n  std::array<int, 3> a;\n  ia >> boost::serialization::make_array(a.data(),\
  \ a.size());\n  std::cout << a[0] << \", \" << a[1] << \", \" << a[2] << '\\n';\n\
  }\n\nint main()\n{\n  save();\n  load();\n}\n```\n\n`boost::serialization::make_array()`\
  \ 期望数组的地址和长度。然而，由于长度是预知的，因此长度不需要作为数组的一部分进行序列化。\n\n当 `std::array` 或 `std::vector`\
  \ 等类包含可以直接被序列化的数组时，可以使用 `boost::serialization::make_array()`。通常也会被序列化的其他成员变量会被跳过（请参见\
  \ 示例 64.15, “使用包装函数 `make_array()` 序列化数组”)]）。\n\nBoost.Serialization 还提供了包装器 `boost::serialization::make_binary_object()`。与\
  \ `boost::serialization::make_array()` 类似，该函数期望一个地址和一个长度。`boost::serialization::make_binary_object()`\
  \ 专门用于没有底层结构的二进制数据，而 `boost::serialization::make_array()` 用于数组。\n\n# 65. Boost.Uuid\n\
  \n[Boost.Uuid](http://www.boost.org/libs/uuid) 为 UUID 提供生成器。UUID 是全局唯一标识符，不依赖于中央协调实例。例如，没有任何数据库存储所有生成的\
  \ UUID 以便检查新的 UUID 是否已使用。\n\nUUID 用于必须唯一标识组件的分布式系统。例如，微软使用 UUID 来标识 COM 世界中的接口。对于为\
  \ COM 开发的新接口，可以很容易地分配唯一标识符。\n\nUUID 是 128 位数。存在多种生成 UUID 的方法。例如，可以使用计算机的网络地址来生成\
  \ UUID。Boost.Uuid 提供的生成器基于随机数生成器，以避免生成可以追溯到生成它的计算机的 UUID。\n\nBoost.Uuid 的所有类和函数定义在\
  \ `boost::uuids` 命名空间中。没有一个主头文件可以访问它们的所有内容。\n\n示例 65.1, “使用 `boost::uuids::random_generator`\
  \ 生成随机 UUID” 生成了一个随机 UUID。它使用了类 `boost::uuids::random_generator`，该类定义在 `boost/uuid/uuid_generators.hpp`\
  \ 中。此头文件提供了对 Boost.Uuid 的所有生成器的访问。\n\n`boost::uuids::random_generator` 的用法类似于 C++11\
  \ 标准库或 Boost.Random 中的生成器。该类重载了 `operator()` 来生成随机 UUID。\n\nUUID 的类型是 `boost::uuids::uuid`。`boost::uuids::uuid`\
  \ 是一个 POD —— 纯数据。没有生成器无法创建 `boost::uuids::uuid` 类型的对象。但它是一个紧凑类型，正好分配了 128 位。该类定义在\
  \ `boost/uuid/uuid.hpp` 中。\n\n`boost::uuids::uuid` 类型的对象可以写入标准输出流。然而，你必须包含 `boost/uuid/uuid_io.hpp`。此头文件提供了重载运算符，用于将\
  \ `boost::uuids::uuid` 类型的对象写入输出流。\n\n示例 65.1. 使用 `boost::uuids::random_generator`\
  \ 生成随机 UUID\n\n```cpp\n#include <boost/uuid/uuid.hpp>\n#include <boost/uuid/uuid_generators.hpp>\n\
  #include <boost/uuid/uuid_io.hpp>\n#include <iostream>\n\nusing namespace boost::uuids;\n\
  \nint main()\n{\n  random_generator gen;\n  uuid id = gen();\n  std::cout << id\
  \ << '\\n';\n}\n```\n\n\n\n\n在使用 `string_generator` 时，请注意 UUID 的拼写。你可以传递不带连字符的 UUID，但如果你使用连字符，它们必须位于正确的位置。大小（大写或小写）是被忽略的。\n\
  \n## 示例 65.4. 转换为字符串\n\n```cpp\n#include <boost/uuid/uuid.hpp>\n#include <boost/uuid/uuid_generators.hpp>\n\
  #include <boost/uuid/uuid_io.hpp>\n#include <boost/lexical_cast.hpp>\n#include <string>\n\
  #include <iostream>\n\nusing namespace boost::uuids;\n\nint main()\n{\n  random_generator\
  \ gen;\n  uuid id = gen();\n\n  std::string s = to_string(id);\n  std::cout << s\
  \ << '\\n';\n\n  std::cout << boost::lexical_cast<std::string>(id) << '\\n';\n}\n\
  ```\n\nBoost.Uuid 提供了 `boost::uuids::to_string()` 和 `boost::uuids::to_wstring()`\
  \ 函数将 UUID 转换为字符串（参见 示例 65.4，“转换为字符串”）。也可以使用 `boost::lexical_cast()` 进行转换。\n\n#\
  \ 第 XVI 部分. 设计模式\n\n以下库用于设计模式。\n\n* Boost.Flyweight 帮助处理程序中使用了大量相同对象且需要减少内存占用的情况。\n\
  * Boost.Signals2 使得使用观察者模式变得简单。该库被称为 Boost.Signals2 是因为其实现了信号/槽（signal/slot）概念。\n\
  * Boost.MetaStateMachine 使得将状态机从 UML 转换为 C++ 成为可能。\n\n# 66. Boost.Flyweight\n\n\
  [Boost.Flyweight](http://www.boost.org/libs/flyweight) 是易于使用同名设计模式的库。当许多对象共享数据时，Flyweight\
  \ 帮助节省内存。通过这种设计模式，不再在对象中多次存储相同的数据，而是将共享数据只保留在一个地方，所有对象都引用该数据。虽然你可以用指针等等实现这种设计模式，但使用\
  \ Boost.Flyweight 会更简单。\n\n## 示例 66.1. 不使用 Boost.Flyweight 的十万个相同字符串\n\n```cpp\n\
  #include <string>\n#include <vector>\n\nstruct person\n{\n  int id_;\n  std::string\
  \ city_;\n};\n\nint main()\n{\n  std::vector<person> persons;\n  for (int i = 0;\
  \ i < 100000; ++i)\n    persons.push_back({i, \"Berlin\"});\n}\n```\n\n示例 66.1，“不使用\
  \ Boost.Flyweight 的十万个相同字符串” 创建了十万个类型为 `person` 的对象。`person` 定义了两个成员变量：`id_` 识别人员，`city_`\
  \ 存储人们居住的城市。在这个示例中，所有人都住在柏林。这就是为什么在所有十万个对象中，`city_` 都设置为“Berlin”。因此，该示例使用了十万个设置了相同值的字符串。使用\
  \ Boost.Flyweight，可以使用一个字符串——而不是成千上万个——并减少内存消耗。\n\n## 示例 66.2. 使用 Boost.Flyweight\
  \ 用一个字符串代替十万个字符串\n\n```cpp\n#include <boost/flyweight.hpp>\n#include <string>\n\
  #include <vector>\n#include <utility>\n\nusing namespace boost::flyweights;\n\n\
  struct person\n{\n  int id_;\n  flyweight<std::string> city_;\n  person(int id,\
  \ std::string city) : id_{id}, city_{std::move(city)} {}\n};\n\nint main()\n{\n\
  \  std::vector<person> persons;\n  for (int i = 0; i < 100000; ++i)\n    persons.push_back({i,\
  \ \"Berlin\"});\n}\n```\n\n要使用 Boost.Flyweight，请包含 `boost/flyweight.hpp`，如 示例 66.2，“使用\
  \ Boost.Flyweight 用一个字符串代替十万个字符串” 所示。Boost.Flyweight 提供了额外的头文件，只有在你需要更改详细的库设置时才需要包含它们。\n\
  \n## 示例 66.3. 多次使用 `boost::flyweights::flyweight`\n\n```cpp\n#include <boost/flyweight.hpp>\n\
  #include <string>\n#include <vector>\n#include <utility>\n\nusing namespace boost::flyweights;\n\
  \nstruct person\n{\n  int id_;\n  flyweight<std::string> city_;\n  flyweight<std::string>\
  \ country_;\n  person(int id, std::string city, std::string country)\n    : id_{id},\
  \ city_{std::move(city)}, country_{std::move(country)} {}\n};\n\nint main()\n{\n\
  \  std::vector<person> persons;\n  for (int i = 0; i < 100000; ++i)\n    persons.push_back({i,\
  \ \"Berlin\"});\n}\n```\n\n所有的 `boost::flyweights::flyweight` 都在 `boost::flyweights`\
  \ 中。示例 66.2，“用一个字符串代替十万个字符串” 使用 `std::string` 而不是 `flyweight`。这是该库最重要的部分。成员变量 `city_`\
  \ 使用 `flyweight<std::string>`，Boost.Flyweight 用此减少了程序的内存需求。示例 66.3，“多次使用 `boost::flyweights::flyweight`\
  \ 为 `person` 类增加了第二个成员变量 `country_`。在这个示例中，所有人都住在柏林。这就是为什么在所有十万个对象中，`city_` 都设置为“Berlin”。因此，该示例使用了十万个设置了相同值的字符串。使用\
  \ Boost.Flyweight，可以使用一个字符串——而不是成千上万个——并减少内存消耗。Boost.Flyweight 使用内部容器存储对象。默认情况下，由于\
  \ `city_` 和 `country_` 都是字符串，因此使用一个容器。如果必须存储不同的城市，最好将城市存储在一个容器中，将国家存储在另一个中。\n\n\
  ## 示例 66.4. 使用标签多次使用 `boost::flyweights::flyweight`\n\n```cpp\n#include <boost/flyweight.hpp>\n\
  #include <string>\n#include <vector>\n#include <utility>\n\nusing namespace boost::flyweights;\n\
  \nstruct city {};\nstruct country {};\n\nstruct person\n{\n  int id_;\n  flyweight<std::string,\
  \ tag<city>> city_;\n  flyweight<std::string, tag<country>> country_;\n  person(int\
  \ id, std::string city, std::string country)\n    : id_{id}, city_{std::move(city)},\
  \ country_{std::move(country)} {}\n};\n\nint main()\n{\n  std::vector<person> persons;\n\
  \  for (int i = 0; i < 100000; ++i)\n    persons.push_back({i, \"Berlin\", \"Germany\"\
  });\n}\n```\n\n示例 66.4，“使用标签多次使用 `boost::flyweights::flyweight` 向 `boost::flyweights::flyweight`\
  \ 传递了第二个模板参数。这是一个标签（tag）。标签是用于区分 `city_` 和 `country_` 所基础类型的任意类型。示例定义了两个空结构 `city`\
  \ 和 `country` 用作标签。然而，该示例也可以使用 `int`、`bool` 或任何类型。\n\n标签使得 `city_` 和 `country_`\
  \ 使用不同的类型。现在 Boost.Flyweight 使用两个哈希容器——一个存储城市，另一个存储国家。\n\n## 示例 66.5. `boost::flyweights::flyweight`\
  \ 的模板参数\n\n\n\n\n\n```cpp\n#include <boost/flyweight.hpp>\n#include <boost/flyweight/set_factory.hpp>\n\
  #include <boost/flyweight/no_locking.hpp>\n#include <boost/flyweight/no_tracking.hpp>\n\
  #include <string>\n#include <vector>\n#include <utility>\n\nusing namespace boost::flyweights;\n\
  \nstruct person\n{\n  int id_;\n  flyweight<std::string, set_factory<>, no_locking,\
  \ no_tracking> city_;\n  person(int id, std::string city) : id_{id}, city_{std::move(city)}\
  \ {}\n};\n\nint main()\n{\n  std::vector<person> persons;\n  for (int i = 0; i <\
  \ 100000; ++i)\n    persons.push_back({i, \"Berlin\"});\n}\n```\n\n除了标签之外的模板参数可以传递给\
  \ `boost::flyweights::flyweight`。[示例 66.5，“`boost::flyweights::flyweight` 的模板参数”]\
  \ 传递了 `boost::flyweights::set_factory`、`boost::flyweights::no_locking` 和 `boost::flyweights::no_tracking`。包含了额外的头文件以使用这些类。\n\
  \n`boost::flyweights::set_factory` 告诉 Boost.Flyweight 使用排序容器（如 `std::set`）而不是哈希容器。通过\
  \ `boost::flyweights::no_locking`，禁用了通常默认启用的多线程支持。`boost::flyweights::no_tracking`\
  \ 告诉 Boost.Flyweight 不要跟踪存储在内部容器的对象。默认情况下，当对象不再使用时，Boost.Flyweight 会检测到这一点并将其从容器中移除。当设置了\
  \ `boost::flyweights::no_tracking` 时，检测机制被禁用。这提高了性能。然而，容器将只能增长而永远不会收缩。\n\nBoost.Flyweight\
  \ 支持额外的设置。如果你对调优的细节感兴趣，请查阅官方文档。\n\n# 67. Boost.Signals2\n\n[Boost.Signals2](http://www.boost.org/libs/signals2)\
  \ 实现了信号/槽（signal/slot）概念。一个或多个函数（称为槽）与一个可以发射信号的对象关联。每当信号发射时，关联的函数就会被调用。\n\n信号/槽概念在某些情况下非常有用，例如开发带有图形用户界面的应用程序。按钮可以被建模，以便在用户点击它们时发射信号。它们可以支持与许多函数的链接以处理用户输入。通过这种方式，可以灵活地处理事件。\n\
  \n`std::function` 也可以用于事件处理。`std::function` 和 `Boost.Signals2` 之间的一个关键区别是，`Boost.Signals2`\
  \ 可以关联多个事件处理器到单个事件。因此，`Boost.Signals2` 更适合支持事件驱动开发，每当需要处理事件时，它应该是首选。\n\n`Boost.Signals2`\
  \ 取替了 `Boost.Signals` 库，后者已被弃用且未在书中讨论。\n\n## 信号\n\nBoost.Signals2 提供了 `boost::signals2::signal`\
  \ 类，用于创建信号。该类定义在 `boost/signals2/signal.hpp` 中。或者，你可以使用头文件 `boost/signals2.hpp`，这是一个定义了\
  \ `Boost.Signals2` 中可用所有类和函数的头文件。\n\n`Boost.Signals2` 定义了 `boost::signals2::signal`\
  \ 和其他类，以及 `boost::signals2` 命名空间下的所有函数。\n\n### 示例 67.1. 使用 `boost::signals2::signal`\
  \ 的“Hello, world!”\n\n```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\
  \nusing namespace boost::signals2;\n\nint main()\n{\n  signal<void()> s;\n  s.connect([]{\
  \ std::cout << \"Hello, world!\\n\"; });\n  s();\n}\n```\n\n`boost::signals2::signal`\
  \ 是一个类模板，它期望将作为事件处理器的函数签名作为模板参数。在示例 67.1，“使用 `boost::signals2::signal` 的‘Hello,\
  \ world!’”]，只有签名为 `void()` 的函数才能与信号 `s` 关联。\n\nLambda 函数通过 `connect()` 与信号 `s` 关联。因为\
  \ Lambda 函数符合要求的签名 `void()`，所以关联成功建立。每当信号 `s` 被触发时，该 Lambda 函数就会被调用。\n\n通过像调用普通函数一样调用\
  \ `s` 来触发信号。该函数的签名与作为模板参数传递的签名匹配。括号是空的，因为 `void()` 不期望任何参数。调用 `s` 会导致触发，进而执行之前通过\
  \ `connect()` 关联的 Lambda 函数。\n\n示例 67.1，“使用 `boost::signals2::signal` 的‘Hello, world!’”\
  \ 也可以用 `std::function` 实现，如示例 67.2，“使用 `std::function` 的‘Hello, world!’` 所示。\n\n\
  ```cpp\n#include <functional>\n#include <iostream>\n\nint main()\n{\n  std::function<void()>\
  \ f = []{ std::cout << \"Hello, world!\\n\"; };\n  f();\n}\n```\n\n`Boost.Signals2`\
  \ 提供了更多功能。例如，它可以通过多次调用 `connect()` 为特定信号关联多个函数。每当信号触发时，函数按照它们与 `connect()` 关联的顺序执行。\n\
  \n可以通过 `connect()` 的重载版本显式定义顺序，该版本期望一个 `int` 类型的值作为额外参数（示例 67.4，“显式的事件处理器”）。\n\n\
  ```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\nusing namespace boost::signals2;\n\
  \nint main()\n{\n  signal<void()> s;\n  s.connect(1, []{ std::cout << \", world!\\\
  n\"; });\n  s.connect(0, []{ std::cout << \"Hello\"; });\n  s();\n}\n```\n\n要从信号中释放关联的函数，请调用\
  \ `disconnect()`。示例 67.5，“从 `boost::signals2::signal` 释放事件处理器” 仅打印 `Hello`，因为在信号触发之前已经释放了与\
  \ `world()` 的关联。\n\n```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\
  \nusing namespace boost::signals2;\n\nvoid hello() { std::cout << \"Hello\"; }\n\
  void world() { std::cout << \", world!\\n\"; }\n\nint main()\n{\n  signal<void()>\
  \ s;\n  s.connect(hello);\n  s.connect(world);\n  s.disconnect(world);\n  s();\n\
  }\n```\n\n\n\n\n\n除了 `connect()` 和 `disconnect()` 之外，`boost::signals2::signal` 还提供了更多成员函数（参见示例\
  \ 67.6, “`boost::signals2::signal` 的其他成员函数”）。`num_slots()` 返回关联函数的数量。如果没有关联任何函数，`num_slots()`\
  \ 返回 0。`empty()` 告诉事件处理器是否连接。而 `disconnect_all_slots()` 的作用正如其名：释放所有现有的关联。\n\n###\
  \ 示例 67.6. `boost::signals2::signal` 的其他成员函数\n\n```cpp\n#include <boost/signals2.hpp>\n\
  #include <iostream>\n\nusing namespace boost::signals2;\n\nint main()\n{\n  signal<void()>\
  \ s;\n  s.connect([]{ std::cout << \"Hello\"; });\n  s.connect([]{ std::cout <<\
  \ \", world!\"; });\n  std::cout << s.num_slots() << '\\n';\n  if (!s.empty())\n\
  \    s();\n  s.disconnect_all_slots();\n}\n```\n\n在示例 67.7, “处理事件处理器的返回值” 中，有两个\
  \ lambda 函数关联到信号 `s` 上。第一个 lambda 函数返回 1，第二个返回 2。\n\n示例 67.7, “处理事件处理器的返回值” 向标准输出写入了\
  \ `2`。这两个返回值都被 `s` 正确接收了，但除了最后一个之外，所有其他返回值都被忽略了。默认情况下，只有所有关联函数的最后一个返回值会被返回。\n\n\
  ### 示例 67.7. 处理事件处理器的返回值\n\n```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\
  \nusing namespace boost::signals2;\n\nint main()\n{\n  signal<int()> s;\n  s.connect([]{\
  \ return 1; });\n  s.connect([]{ return 2; });\n  std::cout << *s() << '\\n';\n\
  }\n```\n\n请注意，`s()` 并不直接返回最后一个调用的函数的结果。它返回一个 `boost::optional` 类型的对象，当解引用时返回数字 2。触发一个未关联任何函数的信号不会产生任何返回值。因此，在这种情况下，`boost::optional`\
  \ 允许 Boost.Signals2 返回一个空对象。`boost::optional` 在第 21 章，*Boost.Optional* 中引入。\n\n\
  可以自定义信号以便相应地处理各个返回值。要做到，必须将组合器（combiner）作为第二个模板参数传递给 `boost::signals2::signal`。\n\
  \n组合器是一个重载了 `operator()` 的类。该运算符会被带两个迭代器调用，这两个迭代器用于访问与特定信号关联的函数。当迭代器被解引用时，函数会被调用，它们的返回值将在组合器中可用。然后可以使用标准库中的常用算法（如\
  \ `std::min_element()`）来计算并返回最小值（参见示例 67.8, “使用自定义组合器寻找最小返回值”）。\n\n`boost::signals2::signal`\
  \ 使用 `boost::signals2::optional_last_value` 作为默认组合器。该组合器返回 `boost::optional` 类型的对象。用户可以定义一个返回值为任何类型的组合器。例如，示例\
  \ 67.8, “使用自定义组合器寻找最小返回值” 中的组合器 `min_element` 返回了作为模板参数传递给 `min_element` 的类型。\n\n\
  无法直接将 `std::min_element()` 等算法作为模板参数传递给 `boost::signals2::signal`。`boost::signals2::signal`\
  \ 要求组合器定义一个名为 `result_type` 的类型，该类型表示 `operator()` 返回的值的类型。由于标准算法没有定义此类型，编译器将报告错误。\n\
  \n### 示例 67.8. 使用自定义组合器寻找最小返回值\n\n```cpp\n#include <boost/signals2.hpp>\n#include\
  \ <vector>\n#include <algorithm>\n#include <iostream>\n\nusing namespace boost::signals2;\n\
  \ntemplate <typename T>\nstruct min_element\n{\n  typedef T result_type;\n\n  template\
  \ <typename InputIterator>\n  T operator()(InputIterator first, InputIterator last)\
  \ const\n  {\n    std::vector<T> v(first, last);\n    return *std::min_element(v.begin(),\
  \ v.end());\n  }\n};\n\n// 注意：示例代码在提示中被截断了；\n// 逻辑遵循文本描述。\n```\n\n\n\n\n## 示例 67.11，“使用\
  \ `shared_connection_block` 阻塞连接”](#part0122.html_ex.signals2_11 \"Example 67.11.\
  \ Blocking connections with shared_connection_block\") 执行了两次 lambda 函数。信号 `s` 被触发了三次，但\
  \ lambda 函数在第二次时没有被调用，因为创建了一个类型为 `boost::signals2::shared_connection_block` 的对象来阻塞调用。一旦该对象超出作用范围，阻塞就会自动移除。也可以通过调用\
  \ `unblock()` 显式移除阻塞。由于它在最后一次触发之前被调用，因此 lambda 函数被再次执行。\n\n### 示例 67.12. 多次阻塞连接\n\
  \n```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::signals2;\n\nint main()\n{\n  signal<void()> s;\n  connection c = s.connect([]{\
  \ std::cout << \"Hello, world!\\n\"; });\n  shared_connection_block b1{c, false};\n\
  \  {\n    shared_connection_block b2{c};\n    std::cout << std::boolalpha << b1.blocking()\
  \ << '\\n';\n    s();\n  }\n  s();\n}\n```\n\n除了 `unblock()` 之外，`boost::signals2::shared_connection_block`\
  \ 还提供了成员函数 `block()` 和 `blocking()`。前者用于在调用 `unblock()` 后阻塞连接，而后者则允许检查连接当前是否处于阻塞状态。\n\
  \n请注意，`boost::signals2::shared_connection_block` 带有“shared”（共享）一词是有原因：多个类型为 `boost::signals2::shared_connection_block`\
  \ 的对象可以使用同一个连接进行初始化。\n\n### 示例 67.12，“多次阻塞连接”](#part0122.html_ex.signals2_12 \"\
  Example 67.12. Blocking a connection multiple times\") 访问了两次 `s`，但 lambda 函数仅在第二次时被调用。程序仅向标准输出流写入了一次\
  \ `Hello, world!`。\n\n因为将 `false` 作为第二个参数传递给构造函数，第一个类型为 `boost::signals2::shared_connection_block`\
  \ 的对象没有阻塞信号 `s` 的连接。因此，在对象 `b1` 上调用 `blocking()` 返回 `false`。\n\n尽管如此，当第一次访问 `s`\
  \ 时，lambda 函数并没有执行，因为该访问发生在第二个类型为 `boost::signals2::shared_connection_block` 的对象实例化之后。通过不向构造函数传递第二个参数，连接被该对象阻塞了。当第二次访问\
  \ `s` 时，lambda 函数被执行了，因为一旦 `b2` 超出作用范围，阻塞就被自动移除了。\n\n### 示例 67.13. 成员函数作为事件处理器\n\
  \n```cpp\n#include <boost/signals2.hpp>\n#include <memory>\n#include <functional>\n\
  #include <iostream>\n\nusing namespace boost::signals2;\n\nstruct world\n{\n  void\
  \ hello() const\n  {\n    std::cout << \"Hello, world!\\n\";\n  }\n};\n\nint main()\n\
  {\n  signal<void()> s;\n  {\n    std::unique_ptr<world> w(new world());\n    s.connect(std::bind(&world::hello,\
  \ w.get()));\n  }\n  std::cout << s.num_slots() << '\\n';\n  s();\n}\n```\n\n一旦关联信号的成员函数的对象被销毁，Boost.Signals2\
  \ 可以释放连接。\n\n### 示例 67.13，“成员函数作为事件处理器”](#part0122.html_ex.signals2_13 \"Example\
  \ 67.13. Member functions as event handlers\") 借助 `std::bind()` 将对象的成员函数与信号关联。该对象在信号触发之前就被销毁了，这是一个问题，因为传递给\
  \ `std::bind()` 的只是一个地址，而不是类型为 `world` 的对象。当调用 `s()` 时，所引用的对象已不存在了。\n\n可以修改程序，使得连接在对象销毁后自动释放。示例\
  \ 67.14，“自动释放关联成员函数” 就实现了这一点。\n\n### 示例 67.14. 自动释放关联成员函数\n\n```cpp\n#include <boost/signals2.hpp>\n\
  #include <boost/shared_ptr.hpp>\n#include <iostream>\n\nusing namespace boost::signals2;\n\
  \nstruct world\n{\n  void hello() const\n  {\n    std::cout << \"Hello, world!\\\
  n\";\n  }\n};\n\nint main()\n{\n  signal<void()> s;\n  {\n    boost::shared_ptr<world>\
  \ w(new world());\n    s.connect(signal<void()>::slot_type(&world::hello, w.get()).track(w));\n\
  \  }\n  std::cout << s.num_slots() << '\\n';\n  s();\n}\n```\n\n现在 `num_slots()`\
  \ 返回 `0`。示例 67.14，“自动释放关联成员函数” 不会在信号触发时尝试在一个已不存在的对象上调用成员函数。改变是将类型 `world` 的对象绑定到类型为\
  \ `boost::shared_ptr` 的智能指针，并将其传递给 `track()`。该成员函数是在传递给 `connect()` 的槽上调用的，用于请求跟踪对象。\n\
  \n### 示例 67.15. 在事件处理器中创建新连接\n\n```cpp\n#include <boost/signals2.hpp>\n#include\
  \ <iostream>\n\nboost::signals2::signal<void()> s;\n\nvoid connect()\n{\n  s.connect([]{\
  \ std::cout << \"Hello, world!\\n\"; });\n}\n\nint main()\n{\n  s.connect(connect);\n\
  \  s();\n}\n```\n\n示例 67.15，“在事件处理器中创建新连接” 在 `connect()` 函数内部访问 `s` 以将 lambda 函数与信号关联。由于\
  \ `connect()` 是信号触发时被调用的，问题是 lambda 函数是否也会被调用。\n\n程序没有输出任何内容，这意味着 lambda 函数从未被调用。虽然\
  \ Boost.Signals2 支持在信号触发时关联函数，但新的关联只会在信号再次触发时才使用。\n\n### 示例 67.16. 在事件处理器中释放连接\n\
  \n```cpp\n#include <boost/signals2.hpp>\n#include <iostream>\n\nboost::signals2::signal<void()>\
  \ s;\n\nvoid hello()\n{\n  std::cout << \"Hello, world!\\n\";\n}\n\nvoid disconnect()\n\
  {\n  s.disconnect(hello);\n}\n\nint main()\n{\n  s.connect(disconnect);\n  s.connect(hello);\n\
  \  s();\n}\n```\n\n\n\n\n\n示例 67.16, “在事件处理器中释放连接” 并没有创建一个新的关联，而是释放了一个现有的关联。与示例\
  \ 67.15, “在事件处理器中创建新连接”一样，此示例没有向标准输出流写入任何内容。\n\n这种行为可以非常简单地解释。想象一下，每当信号触发时，都会创建一个槽（slots）的临时副本。新创建的关联不会被添加到临时副本中，因此只能在下一次信号触发时才被调用。另一方面，释放的关联仍然是临时副本的一部分，但组合器（combiner）会在引用时进行检查，以避免对已经销毁的对象调用成员函数。\n\
  \n## 多线程\n\n`Boost.Signals2` 提供的几乎所有类都是线程安全的，可以在多线程应用程序中使用。例如，类型为 `boost::signals2::signal`\
  \ 和 `boost::signals2::connection` 的对象可以从不同的线程访问。\n\n相反，`boost::signals2::shared_connection_block`\
  \ 不是线程安全的。这一限制并不重要，因为可以在不同的线程中创建多个类型为 `boost::signals2::shared_connection_block`\
  \ 的对象，并可以使用同一个连接对象。\n\n示例 67.17. `boost::signals2::signal` 是线程安全的\n\n```\n#include\
  \ <boost/signals2.hpp>\n#include <thread>\n#include <mutex>\n#include <iostream>\n\
  \nboost::signals2::signal<void(int)> s;\nstd::mutex m;\n\nvoid loop()\n{\n  for\
  \ (int i = 0; i < 100; ++i)\n    s(i);\n}\n\nint main()\n{\n  s.connect([](int i){\n\
  \    std::lock_guard<std::mutex> lock{m};\n    std::cout << i << '\\n';\n  });\n\
  \  std::thread t1{loop};\n  std::thread t2{loop};\n  t1.join();\n  t2.join();\n\
  }\n```\n\n示例 67.17, “`boost::signals2::signal` 是线程安全的” 创建了两个执行 `loop()` 函数的线程，该函数访问\
  \ `s` 百次以调用关联的 lambda 函数。Boost.Signals2 显式支持从不同线程并发访问类型为 `boost::signals2::signal`\
  \ 的对象。\n\n示例 67.17, “`boost::signals2::signal` 是线程安全的” 显示了从 0 到 99 的数字。由于 `i` 在两个线程中递增并在\
  \ lambda 函数中写入标准输出流，数字不仅会显示两次，还会发生重叠。然而，由于 `boost::signals2::signal` 可以从不同的线程访问，程序不会崩溃。\n\
  \n然而，示例 67.17, “`boost::signals2::signal` 是线程安全的” 仍然需要同步。因为两个线程访问 `s`，关联的 lambda\
  \ 函数在两个线程中并行运行。为了避免两个线程在写入标准输出时相互中断，使用一个互斥锁（mutex）来同步对 `std::cout` 的访问。\n\n对于单线程应用程序，可以在\
  \ Boost.Signals2 中禁用多线程支持。\n\n示例 67.18. `boost::signals2::signal` 无线程安全\n\n```cpp\n\
  #include <boost/signals2.hpp>\n#include <iostream>\n\nusing namespace boost::signals2;\n\
  \nsignal<void()> s;\n\nint main()\n{\n  typedef keywords::mutex_type<dummy_mutex>\
  \ dummy_mutex;\n  signal_type<void(), dummy_mutex>::type s;\n  s.connect([]{ std::cout\
  \ << \"Hello, world!\\n\"; });\n  s();\n}\n```\n\n在 `boost::signals2::signal` 支持的许多模板参数中，最后一个定义了用于同步的互斥锁类型。幸运的是，Boost.Signals2\
  \ 提供了一种比传递完整参数列表更简单的方法来禁用同步。\n\n`boost::signals2::keywords` 命名空间包含了许多类，使得通过名称传递模板参数成为。`boost::signals2::keywords::mutex_type`\
  \ 可将互斥锁类型作为第二个模板参数传递给 `boost::signals2::signal_type`。请注意在这种情况下必须使用 `boost::signals2::signal_type`\
  \ 而不是 `boost::signals2::signal`。用于定义信号 `s` 的等于 `boost::signals2::signal` 的类型可以通过\
  \ `boost::signals2::signal_type::type` 获取。\n\nBoost.Signals2 提供了一个名为 `boost::signals2::dummy_mutex`\
  \ 的空互斥锁实现。如果使用该类定义信号，它将不再支持多线程（参见示例 67.18, “`boost::signals2::signal` 无线程安全”）。\n\
  \n\n\n\n\n示例 68.1, “带有 eUML 的简单状态机” 使用 eUML 前端来描述灯的状态机。`Boost.MetaStateMachine`\
  \ 并没有一个主头文件。因此，必须逐个包含所需的头文件。`boost/msm/front/euml/euml.hpp` 和 `boost/msm/front/euml/state_grammar.hpp`\
  \ 提供了对 eUML 宏的访问支持。`boost/msm/back/state_machine.hpp` 则用于将前端的状态机链接到后端的状态机。虽然前端提供了定义状态机的各种可能性，但状态机的实际实现是在后端找到的。由于\
  \ `Boost.MetaStateMachine` 只包含一个后端，因此你不需要选择实现方式。\n\n所有来自 `Boost.MetaStateMachine`\
  \ 的定义都位于 `boost::msm` 命名空间中。遗憾的是，许多 eUML 宏并没有显式地引用该命名空间中的类。它们使用了 `msm` 命名空间或者完全没有使用命名空间。这就是为什么\
  \ 示例 68.1, “带有 eUML 的简单状态机” 为 `boost::msm` 命名空间创建了一个别名，并通过 `using` 指令使 `boost::msm::front::euml`\
  \ 中的定义可用。否则，eUML 宏将导致编译错误。\n\n要使用灯的状态机，首先定义关闭（off）和开启（on）的状态。状态通过 `BOOST_MSM_EUML_STATE`\
  \ 宏定义，该宏期望状态名称作为第二个参数。第一个参数描述该状态。你稍后会看到这些描述看起来是什么样的。在 示例 68.1, “带有 eUML 的简单状态机”\
  \ 中定义的两个状态称为 `Off` 和 `On`。\n\n为了在状态之间切换，需要事件（events）。事件通过 `BOOST_MSM_EUML_EVENT`\
  \ 宏定义，该宏期望事件名称作为其唯一参数。示例 68.1, “带有 eUML 的简单状态机” 定义了一个名为 `press` 的事件，它代表按下灯开关的动作。由于同一个事件可以切换灯的开启和关闭，因此只定义了一个事件。\n\
  \n当定义了所需的状态和事件后，使用 `BOOST_MSM_EUML_TRANSITION_TABLE` 宏来创建一个转换表（transition table）。该表定义了状态之间的有效转换，以及哪些事件触发了哪些状态转换。\n\
  \n`BOOST_MSM_EUML_TRANSITION_TABLE` 期望两个参数。第一个参数定义转换表，第二个参数是转换表的名称。第一个参数的语法设计旨在便于识别状态和事件之间的关系。例如，`Off\
  \ + press == On` 意味着处于 `Off` 状态的机器通过 `press` 事件切换到 `On` 状态。转换表直观且自解释其懂的语法是 eUML\
  \ 前端的优势之一。\n\n在创建转换表后，使用 `BOOST_MSM_EUML_DECLARE_STATE_MACHINE` 宏定义状态机。第二个参数再次变得简单：它设置了状态机的名称。示例\
  \ 68.1, “带有 eUML 的简单状态机” 中的状态机命名为 `light_state_machine`。\n\n`BOOST_MSM_EUML_DECLARE_STATE_MACHINE`\
  \ 的第一个参数是一个 `tuple`。第一个值是转换表的名称。第二个值是一个使用 `init_` 的表达式，它是 `Boost.MetaStateMachine`\
  \ 提供的一个属性。你将学习更多关于属性的知识。表达式 `init_ << Off` 用于将状态机的初始状态设置为 `Off`。\n\n通过 `BOOST_MSM_EUML_DECLARE_STATE_MACHINE`\
  \ 定义的状态机 `light_state_machine` 是一个 `class`。你使用这个类从后端实例化一个状态机。在 示例 68.1, “带有 eUML\
  \ 的简单状态机” 中，这是通过将 `light_state_machine` 作为参数传递给类 `boost::msm::back::state_machine`\
  \ 实现的。这了一个名为 `light` 的状态机。\n\n状态机提供成员函数 `process_event()` 来处理事件。如果你将一个事件传递给 `process_event()`，状态机将根据其转换表改变状态。为了方便查看\
  \ 示例 68.1, “带有 eUML 的简单状态机” 中当多次调用 `process_event()` 时发生了什么，使用了 `current_state()`。\n\
  \n### 示例 68.2. 带有状态、事件和动作的状态机\n\n```cpp\n#include <boost/msm/front/euml/euml.hpp>\n\
  #include <boost/msm/front/euml/state_grammar.hpp>\n#include <boost/msm/back/state_machine.hpp>\n\
  #include <iostream>\n\nnamespace msm = boost::msm;\nusing namespace msm::front::euml;\n\
  \nBOOST_MSM_EUML_STATE(Off, {})\nBOOST_MSM_EUML_STATE(On, {})\n\nBOOST_MSM_EUML_EVENT(press)\n\
  \nBOOST_MSM_EUML_ACTION(switch_light)\n{\n  template <class Event, class Fsm>\n\
  \  void operator()(const Event&, Fsm&, msm::front::euml::state_machine_event_type<Fsm,\
  \ Off>&)\n  {\n    std::cout << \"Switching on\\n\";\n  }\n\n  template <class Event,\
  \ class Fsm>\n  void operator()(const Event&, Fsm&, msm::front::euml::state_machine_event_type<Fsm,\
  \ On>&)\n  {\n    std::cout << \"Switching off\\n\";\n  }\n};\n\nBOOST_MSM_EUML_TRANSITION_TABLE((\n\
  \  Off + press / switch_light == On,\n  On + press / switch_light == Off\n), light_transition_table)\n\
  \nBOOST_MSM_EUML_DECLARE_STATE_MACHINE(\n(light_transition_table, init_ << Off),\n\
  light_state_machine)\n\nint main()\n{\n  msm::back::state_machine<light_state_machine>\
  \ light;\n  light.process_event(press());\n  light.process_event(press());\n}\n\
  ```\n\n示例 68.2, “带有状态、事件和动作的状态机” 为灯的状态机扩展了动作。动作通过事件触发状态转换来执行。由于动作是可选的，可以定义不带动作的状态机。\n\
  \n（注：上述代码块为根据逻辑补全的完整示例，原文中代码部分为描述性）\n\n当 `process_event()` 被多次调用时，使用 `current_state()`\
  \ 可以更容易地看到发生了什么。它会输出 0, 1, 0。\n\n\n\n\n\n动作 `switch_light` 通过 `BOOST_MSM_EUML_ACTION`\
  \ 定义，在按下灯开关时执行。转移表已据此进行了相应的修改。第一个转换现在变为 `Off + press / switch_light == On`。你在事件之后通过斜杠\
  \ `/` 传递动作。此转换意味着，如果当前状态为 `Off` 且发生了事件 `press`，则会调用 `switch_light` 的运算符 `operator()`。在执行动作后，新状态变为\
  \ `On`。\n\n示例 68.2, “带有状态、事件和动作的状态机” 向标准输出输了 `Switching on`，然后是 `Switching off`。\n\
  \n示例 68.3, “带有状态、事件、守卫和动作的状态机” 在转移表使用了守卫（guard）。第一个转换的定义为 `Off + press [!is_broken]\
  \ / switch_light == On`。在括号中传递 `is_broken` 意味着在调用动作 `switch_light` 之前，状态机会会检查转换是否可以发生。这被称为守卫。守卫必须返回一个\
  \ `bool` 类型的结果。\n\n像 `is_broken` 这样的守卫是以与动作相同的方式通过 `BOOST_MSM_EUML_ACTION` 定义的。因此，运算符\
  \ `operator()` 必须对相同的四个参数进行重载。`operator()` 必须有一个 `bool` 类型的返回值才能作为守卫使用。\n\n请注意，你可以在括号内的守卫上使用\
  \ `operator!` 等逻辑运算符。\n\n如果你运行该示例，你会发现标准输出中没有任何写入内容。动作 `switch_light` 没有被执行——灯保持关**状态。守卫\
  \ `is_broken` 返回了 `true`。但是，由于使用了运算符 `operator!`，括号中的表达式求值为 `false`。\n\n你可以使用守卫来检查状态转换是否可以发生。示例\
  \ 68.3, “带有状态、事件、守卫和动作的状态机” 使用 `is_broken` 来检查灯是否坏了。虽然从关到开的转换是可能的，且转移表描述了灯，但在本示例中，灯无法开启。尽管调用了两次\
  \ `process_event()`，`light` 的状态仍然是 `Off`。\n\n### 示例 68.3. 带有状态、事件、守卫和动作的状态机\n\n\
  ```cpp\n#include <boost/msm/front/euml.hpp>\n#include <boost/msm/front/state_grammar.hpp>\n\
  #include <boost/msm/back/state_machine.hpp>\n#include <iostream>\n\nnamespace msm\
  \ = boost::msm;\nusing namespace boost::msm::front::euml;\n\nBOOST_MSM_EUML_STATE((),\
  \ Off)\nOST_MSM_EUML_STATE((), On)\n\nBOOST_MSM_EUML_EVENT(press)\n\nBOOST_MSM_EUML_ACTION(is_broken)\n\
  {\n  template <class Event, class Fsm, class Source, class Target>\n  bool operator()(const\
  \ Event &ev, Fsm &fsm, Source &src, Target &trg) const\n  {\n    return true;\n\
  \  }\n};\n\nBOOST_MSM_EUML_ACTION(switch_light)\n{\n  template <class Event, class\
  \ Fsm, class Source, class Target>\n  void operator()(const Event &ev, Fsm &fsm,\
  \ Source &src, Target &trg) const\n  {\n    std::cout << \"Switching\\n\";\n  }\n\
  };\n\nBOOST_MSM_EUML_TRANSITION_TABLE((\n  Off + press [!is_broken] / switch_light\
  \ == On,\n  On + press / switch_light == Off\n), light_transition_table)\n\nBOOST_MSM_EUML_DECLARE_STATE_MACHINE(\n\
  (light_transition_table, init_ << Off),\nlight_state_machine)\n\nint main()\n{\n\
  \  msm::back::state_machine<light_state_machine> light;\n  light.process_event(press);\n\
  \  light.process_event(press);\n}\n```\n\n### 示例 68.4. 带有状态、事件、进入动作和退出动作的状态机\n\n\
  ```cpp\n#include <boost/msm/front/euml.hpp>\n#include <boost/msm/front/state_grammar.hpp>\n\
  #include <boost/msm/back/state_machine.hpp>\n#include <iostream>\n\nnamespace msm\
  \ = boost::msm;\nusing namespace boost::msm::front::euml;\n\nBOOST_MSM_EUML_ACTION(state_entry)\n\
  {\n  template <class Event, class Fsm, class State>\n  void operator()(const Event\
  \ &ev, Fsm &fsm, State &state) const\n  {\n    std::cout << \"Entering\\n\";\n \
  \ }\n};\n\nBOOST_MSM_EUML_ACTION(state_exit)\n{\n  template <class Event, class\
  \ Fsm, class State>\n  void operator()(const Event &ev, Fsm &fsm, State &state)\
  \ const\n  {\n    std::cout << \"Exiting\\n\";\n  }\n};\n\nBOOST_MSM_EUML_STATE((state_entry,\
  \ state_exit), Off)\nBOOST_MSM_EUML_STATE((state_entry, state_exit), On)\n\nBOOST_MSM_EUML_EVENT(press)\n\
  \nBOOST_MSM_EUML_TRANSITION_TABLE((\n  Off + press == On,\n  On + press == Off\n\
  ), light_transition_table)\n\nBOOST_MSM_EUML_DECLARE_STATE_MACHINE(\n(light_transition_table,\
  \ init_ << Off),\nlight_state_machine)\n\nint main()\n{\n  msm::back::state_machine<light_state_machine>\
  \ light;\n  light.process_event(press);\n  light.process_event(press);\n}\n```\n\
  \n\n\n\n在定义属性后，必须将其附加到对象上。此示例将属性 `switched_on` 附加到状态机上。这是通过元组中的第五个值实现的，该值作为第一个参数传递给\
  \ `BOOST_MSM_EUML_DECLARE_STATE_MACHINE`。通过 `attributes_`（一个来自 Boost.MetaStateMachine\
  \ 的关键字），可以使用创建一个 lambda 表达式函数。要将属性 `switched_on` 附加到状态机，可以像写入流一样使用 `operator<<`\
  \ 将 `switched_on` 写入 `attributes_`。\n\n元组中的第三和第四个值均设置为 `no_action`。属性作为元组的第五个值传递。第三和第四个值可以用于定义状态机的进入（entry）和退出（exit）动作。如果没有定义这些动作，请使用\
  \ `no_action`。\n\n属性附加到状态机后，可以使用 `get_attribute()` 访问它。在 示例 68.5, “状态机中的属性” 中，在该成员函数在进入动作\
  \ `state_entry` 中调用以增加属性的值。由于 `state_entry` 仅链接到状态 `On`，因此只有在灯打开时 `switched_on`\
  \ 才会递增。\n\n`switched_on` 也可以通过守卫 `is_broken` 进行访问，该守卫检查属性值是否大于 1。如果是，守卫返回 `true`。由于属性使用默认构造函数初始化，且\
  \ `switched_on` 被设置为 0，当灯被打开两次后，`is_broken` 将返回 `true`。\n\n### 示例 68.5. 状态机中的属性\n\
  \n```\n#include <boost/msm/front/euml/euml.hpp>\n#include <boost/msm/front/euml/state_grammar.hpp>\n\
  #include <boost/msm/back/state_machine.hpp>\n#include <iostream>\n\nnamespace msm\
  \ = boost::msm;\nusing namespace boost::msm::front::euml;\n\nBOOST_MSM_EUML_DECLARE_ATTRIBUTE(int,\
  \ switched_on)\n\nBOOST_MSM_EUML_ACTION(state_entry)\n{\n  template <class Event,\
  \ class Fsm, class State>\n  void operator()(const Event &ev, Fsm &fsm, State &state)\
  \ const\n  {\n    std::cout << \"Switched on\\n\";\n    ++fsm.get_attribute(switched_on);\n\
  \  }\n};\nBOOST_MSM_EUML_ACTION(is_broken)\n{\n  template <class Event, class Fsm,\
  \ class Source, class Target>\n  bool operator()(const Event &ev, Fsm &fsm, Source\
  \ &src, Target &trg) const\n  {\n    return fsm.get_attribute(switched_on) > 1;\n\
  \  }\n};\n\nBOOST_MSM_EUML_STATE((), Off)\nBOOST_MSM_EUML_STATE((state_entry), On)\n\
  BOOST_MSM_EUML_EVENT(press)\n\nBOOST_MSM_EUML_TRANSITION_TABLE((\n  Off + press\
  \ [!is_broken] == On,\n  On + press == Off\n), light_transition_table)\n\nBOOST_MSM_EUML_DECLARE_STATE_MACHINE(\n\
  (light_transition_table, init_ << Off, no_action, no_action,\nattributes_ << switched_on),\
  \ light_state_machine)\n\nint main()\n{\n  msm::back::state_machine<light_state_machine>\
  \ light;\n  light.process_event(press);\n  light.process_event(press);\n  light.process_event(press);\n\
  \  light.process_event(press);\n  light.process_event(press);\n}\n```\n\n在 示例 68.5,\
  \ “状态机中的属性” 中，事件 `press` 发生了五次。灯被开关了两次，然后再次打开。在前两次灯打开时，会显示 `Switched on`。然而，在第三次灯打开时没有输出。这是因为在灯打开两次后，`is_broken`\
  \ 返回了 `true`，因此没有从 `Off` 到 `On` 的状态转换。这意味着状态 `On` 的进入动作没有执行，且示例没有写入标准输出。\n\n示例 68.6,\
  \ “在转换表上访问属性” 与 示例 68.5, “状态机中的属性” 做了相同的事情：在灯被打开两次后，灯坏了且无法再次打开。虽然上一个示例在动作中访问了属性\
  \ `switched_on`，但此示例在转换表中使用了属性。\n\nBoost.MetaStateMachine 提供了函数 `fsm_()` 来访问状态机中的属性。这样就可以定义一个守卫来检查\
  \ `switched_on` 是否小于 2。请注意，守卫中的小于比较是通过 `Int_<2>()` 完成的。数字 2 必须作为模板参数传递给 `Int_` 以创建一个实例。`BOOST_MSM_EUML_FUNCTION`\
  \ 宏用于创建一个动作。第一个参数是 `BOOST_MSM_EUML_FUNCTION` 所需的函数类型。第二个参数是动作的名称。第三和第四五个参数是返回值和参数。\n\
  \n### 其他库\n\n*   Boost.Utility 收集了所有不适合放在 Boost 库其他地方的内容。\n\n*   Boost.Assign 提供了辅助函数，可以更轻松地执行向容器中添加多个值的操作，而无需反复调用\
  \ `push_back()`。\n\n\n\n\n*   `Boost.Swap` 提供了 `std::swap()` 的变体，并针对 Boost 库进行了优化。\n\
  *   `Boost.Operators` 允许根据其他运算符轻松地定义运算符。\n\n# 69. Boost.Utility\n\n[Boost.Utility](http://www.boost.org/libs/utility)\
  \ 库是各种杂用类和函数的集合，这些类和函数太小，不足以作为独立的库来维护。虽然这些工具类体较小且可以快速学习，但它们之间完全没有关联。与其他章节中的示例不同，这里的代码示例并不是相互构建的，因为它们是独立的工具。\n\
  \n虽然大多数工具定义在 `boost/utility.hpp` 中，但某些工具有自己的头文件。以下示例包含了为介绍的工具引入相应的头文件。\n\n示例 69.1,\
  \ “使用 `boost::checked_delete()`”\") 将函数 `boost::checked_delete()` 作为参数传递给成员函数 `pop_back_and_dispose()`，该成员函数由\
  \ Boost.Intrusive 中的 `boost::intrusive::list` 类提供。`boost::intrusive::list` 和 `pop_back_and_dispose()`\
  \ 在 第 18 章，*Boost.Intrusive* 中引入，而 `boost::checked_delete()` 由 Boost.Utility 提供并定义在\
  \ `boost/checked_delete.hpp` 中。\n\n`boost::checked_delete()` 唯一的参数是指向将由 `delete`\
  \ 删除的对象的指针。由于 `pop_back_and_dispose()` 期望一个接收指针以破坏对应对象的函数，因此传递 `boost::checked_delete()`\
  \ 是合理的——这样你就不需要定义一个类似的函数了。\n\n与 `delete` 不同，`boost::checked_delete()` 确保被销毁的对象的类型是完整的。`delete`\
  \ 会接受指向不完整类型对象的指针。虽然这涉及 C++ 标准中一个通常可以忽略的细节，但你应该注意 `boost::checked_delete()` 与调用\
  \ `delete` 并不完全相同，因为它对参数有更高的要求。\n\n示例 69.1. 使用 `boost::checked_delete()`\n\n```cpp\n\
  #include <boost/checked_delete.hpp>\n#include <boost/intrusive/list.hpp>\n#include\
  \ <string>\n#include <utility>\n#include <iostream>\n\nstruct animal : public boost::intrusive::list_base_hook<>\n\
  {\n  std::string name_;\n  int legs_;\n\n  animal(std::string name, int legs) :\
  \ name_{std::move(name)},\n    legs_{legs} {}\n};\n\nint main()\n{\n  animal *a\
  \ = new animal{\"cat\", 4};\n\n  typedef boost::intrusive::list<animal> animal_list;\n\
  \  animal_list al;\n\n  al.push_back(*a);\n\n  al.pop_back_and_dispose(boost::checked_delete<animal>);\n\
  \  std::cout << al.size() << '\\n';\n}\n```\n\nBoost.Utility 还提供了 `boost::checked_array_delete()`，它可以用于销毁数组。它调用\
  \ `delete[]` 而不是 `delete`。\n\n此外，还有两个类 `boost::checked_deleter` 和 `boost::checked_array_deleter`，用于创建行为类似于\
  \ `boost::checked_delete()` 和 `boost::checked_array_delete()` 的函数对象。\n\n示例 69.2.\
  \ 使用 `BOOST_CURRENT_FUNCTION`\n\n```cpp\n#include <boost/current_function.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  const char *funcname = BOOST_CURRENT_FUNCTION;\n\
  \  std::cout << funcname << '\\n';\n}\n```\n\n示例 69.2, “使用 `BOOST_CURRENT_FUNCTION`”\
  \ 使用定义在 `boost/current_function.hpp` 中的宏 `BOOST_CURRENT_FUNCTION` 来以字符串形式返回周围函数的名称。\n\
  \n`BOOST_CURRENT_FUNCTION` 提供了一种平台无关的方法来获取函数名。从 C++11 开始，你可以使用标准宏 `__func__` 同样的事情。在\
  \ C++11 之前，Visual C++ 和 GCC 等编译器支持作为扩展的宏 `__FUNCTION__`。`BOOST_CURRENT_FUNCTION`\
  \ 使用编译器支持的任何宏。\n\n如果使用 Visual C++ 2013 编译，示例 69.2, “使用 `BOOST_CURRENT_FUNCTION`”](#part0126.html_ex.utility_02\
  \ \"Example 69.2. Using BOOST_CURRENT_FUNCTION\") 显示 `int __cdecl main(void)`。\n\
  \n示例 69.3. 使用 `boost::prior()` 和 `boost::next()`\n\n```cpp\n#include <boost/next_prior.hpp>\n\
  #include <array>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n \
  \ std::array<char, 4> a;\n  // ... 为了简洁省略了逻辑\n}\n```\n\nBoost.Utility 提供了两个函数 `boost::prior()`\
  \ 和 `boost::next()`，它们返回一个新的迭代器。在 示例 69.3, “使用 `boost::prior()` 和 `boost::next()``\
  \ and boost::next()\") 中，`it` 指向 `b`。\n\n与 `std::advance()` 不同，这两个函数接受第二个参数，表示向前向后移动的步数。步数始终为正，即使对于\
  \ `boost::prior()` 也是如此。\n\n这两个函数在 C++11 中加入了标准库，称为 `std::prev()` 和 `std::next()`。它们定义在头文件\
  \ `boost/next_prior.hpp` 中。\n\n示例 69.4. 使用 `boost::noncopyable`\n\n```cpp\n#include\
  \ <boost/noncopyable.hpp>\n#include <string>\n#include <utility>\n#include <iostream>\n\
  \nstruct animal : boost::noncopyable\n{\n  std::string name;\n  int legs;\n\n  animal(std::string\
  \ n, int l) : name{std::move(n)},\n    legs{l} {}\n};\n\nvoid print(const animal\
  \ &a)\n{\n  std::cout << a.name << '\\n';\n  std::cout << a.legs << '\\n';\n}\n\n\
  int main()\n{\n  animal a{\"cat\", 4};\n  print(a);\n}\n```\n\nBoost.Utility 提供了类\
  \ `boost::noncopyable`，定义在 `boost/noncopyable.hpp` 中。该类使得无法拷贝（以及移动）对象。通过将拷贝构造函数和赋值运算符定义为私有成员函数来实现相同的效果，或者从\
  \ C++11 开始通过 `delete` 移除拷贝构造函数和赋值运算符。然而，继承 `boost::noncopyable` 显式声明了类应该是不可拷贝的。\n\
  \n###\n\n某些开发者倾向于使用 `boost::noncopyable`，而另一些人倾向于用 `delete` 显式移除函数。你可以在 [Stack Overflow](http://stackoverflow.com/questions/7823990/what-are-the-advantages-of-boostnoncopyable)\
  \ 等地方找到这两种方法的理由。\n\n示例 69.4, “使用 `boost::noncopyable()`](#part0126.html_ex.utility_04\
  \ \"Example 69.4. Using boost::noncopyable\") 可以编译并运行。但是如果将 `print()` 函数的签名修改为按值获取\
  \ `animal` 类型对象而不是引用，则结果代码将无法编译。\n\n示例 69.5. 使用 `boost::addressof()`\n\n```cpp\n\
  #include <boost/utility/addressof.hpp>\n#include <string>\n#include <iostream>\n\
  \nstruct animal\n{\n  std::string name;\n  int legs;\n\n  int operator&() const\
  \ { return legs; }\n};\n\nint main()\n{\n  animal a{\"cat\", 4};\n  std::cout <<\
  \ &a << '\\n';\n  std::cout << boost::addressof(a) << '\\n';\n}\n```\n\n\n\n\n为了获取特定对象的地址，即使\
  \ `operator&` 已经被重载，Boost.Utility 也提供了 `boost::addressof()` 函数，该函数定义在 `boost/utility/addressof.hpp`\
  \ 中（参见示例 69.5, “使用 `boost::addressof()`”)）。在 C++11 中，该函数成为标准库的一部分，并在头文件 `memory`\
  \ 中作为 `std::addressof()`可用。\n\n## 示例 69.6. 使用 `BOOST_BINARY`\n\n```cpp\n#include\
  \ <boost/utility/binary.hpp>\n#include <iostream>\n\nint main()\n{\n  int i = BOOST_BINARY(1001\
  \ 0001);\n  std::cout << i << '\\n';\n\n  short s = BOOST_BINARY(1000 0000 0000\
  \ 0000);\n  std::cout << s << '\\n';\n}\n```\n\n宏 `BOOST_BINARY` 允许你以二进制形式创建数字。标准\
  \ C++ 只支持十六进制和八进制形式，使用前缀 `0x` 和 `0`。C++11 引入了用户自定义字面量，允许你定义自定义后缀，但在 C++11 中仍然没有标准方法以二进制形式使用数字。\n\
  \n示例 69.6, “使用 `BOOST_BINARY`” 显示了 `145` 和 `-32768`。存储在 `s` 中的位序列表示一个负数，因为 16 位类型\
  \ `short` 使用第 16 位——即 `short` 中的最高有效位——作为符号位。\n\n`BOOST_BINARY` 仅仅提供了另一种编写数字的选项。因为在\
  \ C++ 中，数字的默认类型是 `int`，所以 `BOOST_BINARY` 也使用了 `int`。要定义 `long` 类型的数字，请使用宏 `BOOST_BINARY_L`，它会生成等同于带有字母\
  \ L 后的数字。\n\nBoost.Utility 包含了额外的宏，如 `BOOST_BINARY_U`，它可以初始化一个没有符号位的变量。所有这些宏都定义在头文件\
  \ `boost/utility/binary.hpp` 中。\n\n## 示例 69.7. 使用 `boost::string_ref`\n\n```cpp\n\
  #include <boost/utility/string_ref.hpp>\n#include <iostream>\n\nboost::string_ref\
  \ start_at_boost(boost::string_ref s)\n{\n  auto idx = s.find(\"Boost\");\n  return\
  \ (idx != boost::string_ref::npos) ? s.substr(idx) : \"\";\n}\n\nint main()\n{\n\
  \  boost::string_ref s = \"The Boost C++ Libraries\";\n  std::cout << start_at_boost(s)\
  \ << '\\n';\n}\n```\n\n示例 69.7, “使用 `boost::string_ref`” 引入了 `boost::string_ref`\
  \ 类，它是对字符串的仅只读引用。在某种程度上，该引用可以与 `const std::string&` 比较。然而，`const std::string&` 需要\
  \ `std::string` 类型的对象。`boost::string_ref` 可以在没有 `std::string` 的情况下使用。`boost::string_ref`\
  \ 的优势在于，它与 `std::string` 不同，不需要分配内存。示例 69.7, “使用 `boost::string_ref`” 在字符串中查找单词“Boost”。如果找到，则显示以该单词开头的字符串。如果没有找到“Boost”，则显示空字符串。`main()`\
  \ 中字符串 `s` 的类型不是 `std::string`，而是 `boost::string_ref`。因此，没有使用 `new` 分配内存，也没有创建拷贝。`s`\
  \ 直接指向字面量“The Boost C++ Libraries”。\n\n`start_at_boost()` 返回值的类型是 `boost::string_ref`\
  \ 而不是 `std::string`。该函数没有返回新字符串，而是返回一个引用。该引用是对参数的子字符串或空字符串。`start_at_boost()` 要求只要在使用\
  \ `boost::string_ref` 类型的情况下，原始字符串保持有效。如果这一点可以保证（如示例 69.7, “使用 `boost::string_ref`”\
  \ 所示），就可以避免内存分配。\n\n还有其他可用工具，但它们超出了本书的范围，因为它们主要供 Boost 开发者或模板元编程使用。Boost.Utility\
  \ 的文档提供了这些工具的全面概述，如果你感兴趣，可以作为一个起点。\n\n# 70. Boost.Assign\n\n[Boost.Assign](http://www.boost.org/libs/assign)\
  \ 提供了初始化容器或向容器添加元素的辅助函数。如果容器需要存储许多元素，这些函数特别有用。得益于 Boost.Assign 提供的函数，你不需要反复调用 `push_back()`\
  \ 等成员函数向容器逐个插入元素。\n\n如果你使用的开发环境支持 C++11，可以从初始化列表中受益。你可以向构造函数传递任意数量的值来初始化容器。得益于初始化列表，在\
  \ C++11 中你不需要依赖 Boost.Assign。然而，Boost.Assign 提供了向现有容器添加多个值的辅助函数。这些辅助函数在 C++11 开发环境中非常有用。\n\
  \n示例 70.1, “初始化容器” 引入了一些可以初始化容器的函数。要使用 Boost.Assign 定义的函数，请包含头文件 `boost/assign.hpp`。\n\
  \nBoost.Assign 提供了三个初始化容器的函数。最重要的以及你通常使用的是 `boost::assign::list_of()`。你使用 `boost::assign::map_of()`\
  \ 和 `boost::assign::tuple_of()` 来用 `map` 初始化容器。你不必使用 `boost::assign::map_of()` 或\
  \ `boost::assign::tuple_of()`。然而，如果你使用 `map` 或元组，你必须向 `boost::assign::list_of()`\
  \ 传递一个模板参数，告诉函数如何存储元素。这个模板参数对于 `boost::assign::map_of()` 和 `boost::assign::tuple_of()`\
  \ 是不是需要的。\n\n## 示例 70.1. 初始化容器\n\n```cpp\n#include <boost/assign.hpp>\n#include\
  \ <boost/tuple/tuple.hpp>\n#include <vector>\n#include <stack>\n#include <map>\n\
  #include <string>\n#include <utility>\n\nusing namespace boost::assign;\n\nint main()\n\
  {\n  std::vector<int> v = list_of(1)(2)(3);\n\n  std::stack<int> s = list_of(1)(2)(3).to_adapter();\n\
  \n  std::vector<std::pair<std::string, int>> v2 =\n    list_of<std::pair<std::string,\
  \ int>>(\"a\", 1)(\"b\", 2)(\"c\", 3);\n\n  std::map<std::string, int> m =\n   \
  \ map_of(\"a\", 1)(\"b\", 2)(\"c\", 3);\n\n  std::vector<boost::tuple<std::string,\
  \ int, double>> v3 =\n    tuple_of(\"a\", 1, 9.9)(\"b\", 2, 8.8)(\"c\", 3, 7.7);\n\
  }\n```\n\n所有三个函数都返回一个代理对象。该对象重载了运算符 `operator()`。你可以多次调用该运算符将值保存到容器中。尽管你访问的是另一个对象而不是容器，但容器通过这个代理发生了变化。\n\
  \n如果你想初始化像 `std::stack` 这样的适配器，请在代理上调用成员函数 `to_adapter()`。代理随后调用所有适配器提供的 `push()`\
  \ 成员函数。\n\n`boost::assign::tuple_of()` 仅支持 `boost::tuple` 元组。你不能使用该函数用标准库的元组初始化容器。\n\
  \n示例 70.2, “向容器添加值” 说明了如何向现有容器添加值。\n\n\n\n\n\n```cpp\n#include <boost/assign.hpp>\n\
  #include <vector>\n#include <deque>\n#include <set>\n#include <queue>\n\nint main()\n\
  {\n  std::vector<int> v;\n  boost::assign::push_back(v)(1)(2)(3);\n\n  std::deque<int>\
  \ d;\n  boost::assign::push_front(d)(1)(2)(3);\n\n  std::set<int> s;\n  boost::assign::insert(s)(1)(2)(3);\n\
  \n  std::queue<int> q;\n  boost::assign::push(q)(1)(2)(3);\n}\n```\n\n这四个个函数 `boost::assign::push_back()`、`boost::assign::push_front()`、`boost::assign::insert()`\
  \ 和 `boost::assign::push()` 以这种方式被调用，是因为返回的代理对象会调用容器上同名的成员函数。示例 70.2, “向容器添加值” 通过三次调用\
  \ `push_back()` 将三个数字 1、2 和 3 添加到向量 `v` 中。\n\nBoost.Assign 提供了额外的辅助函数，供你向容器中添加值，包括\
  \ `boost::assign::add_edge()`，你可以用它来获取 Boost.Graph 中图的代理。\n\n# 71. Boost.Swap\n\n\
  如果你使用了许多 Boost 库并且并且使用 `std::swap()` 来交换数据，可以考虑使用 `boost::swap()` 作为替代方案。`boost::swap()`\
  \ 由 [Boost.Swap](http://www.boost.org/libs/core/swap.html) 提供，并在 `boost/swap.hpp`\
  \ 中定义。\n\n示例 71.1. 使用 `boost::swap()`\n\n```cpp\n#include <boost/swap.hpp>\n#include\
  \ <boost/array.hpp>\n#include <iostream>\n\nint main()\n{\n  char c1 = 'a';\n  char\
  \ c2 = 'b';\n\n  boost::swap(c1, c2);\n\n  std::cout << c1 << c2 << '\\n';\n\n \
  \ std::array<int, 1> a1{{1}};\n  std::array<int, 1> a2{{2}};\n\n  boost::swap(a1,\
  \ a2);\n\n  std::cout << a1[0] << a2[0] << '\\n';\n}\n```\n\n`boost::swap()` 的作用与\
  \ `std::swap()` 无异。然而，由于许多 Boost 库提供了定义在 `boost` 命名空间中的数据交换特化，`boost::swap()` 可以利用这些特性。在\
  \ 示例 71.1, “使用 `boost::swap()`”，`boost::swap()` 通过 `std::swap()` 来交换两个 `char` 变量的值，并使用来自\
  \ Boost.Array 的优化函数 `boost::swap()` 来交换数组中的数据。\n\n示例 71.1, “使用 `boost::swap()`”\
  \ 向标准输出流写入了 `ba` 和 `21`。\n\n# 72. Boost.Operators\n\n[Boost.Operators](http://www.boost.org/libs/utility/operators.htm)\
  \ 提供了许多类来自动重载运算符。在 示例 72.1, “带有 `boost::less_than_comparable` 的大于运算符” 中，即使没有声明，大于运算符也会被自动添加，因为大于运算符可以使用已经定义的小于运算符来实现。\n\
  \n示例 72.1. 使用 `boost::less_than_comparable` 的大于运算符\n\n```cpp\n#include <boost/operators.hpp>\n\
  #include <string>\n#include <utility>\n#include <iostream>\n\nstruct animal : public\
  \ boost::less_than_comparable<animal>\n{\n  std::string name;\n  int legs;\n\n \
  \ animal(std::string n, int l) : name{std::move(n)}, legs{l} {}\n\n  bool operator<(const\
  \ animal &a) const { return legs < a.legs; }\n};\n\nint main()\n{\n  animal a1{\"\
  cat\", 4};\n  animal a2{\"spider\", 8};\n\n  std::cout << std::boolalpha << (a2\
  \ > a1) << '\\n';\n}\n```\n\n要自动添加运算符，请从 `boost/operators.hpp` 中 Boost.Operators\
  \ 定义的类派生。如果一个类派生自 `boost::less_than_comparable`，那么 `operator>`、`operator<=` 和 `operator>=`\
  \ 将被自动定义。\n\n由于许多运算符可以用其他运算符表示，因此自动重载是可能的。例如，`boost::less_than_comparable` 将大于运算符实现为小于运算符的反向；如果一个对象不小于另一个对象，那么假设它们不相等。\n\
  \n如果两个对象可能相等，请使用 `boost::partially_ordered` 作为基类。通过定义 `operator==`，`boost::partially_ordered`\
  \ 可以判断小于意味着大于还是等于。除了 `boost::less_than_comparable` 和 `boost::partially_ordered`\
  \ 之外，还提供了允许重载通常由迭代器、指针或数组提供的运算符的类。由于自动重载只有在定义了其他运算符后才是可能的，具体的运算符取决于情况。请查阅文档获取更多信息。\n\
