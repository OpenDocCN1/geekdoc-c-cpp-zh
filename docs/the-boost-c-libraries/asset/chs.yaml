  在 示例 49.1 中，`boost::enable_if` 表达式中的两个条件都使用了 `std::is_same` 类。该类定义在 C++11 标准库中，允许你比较两个类型。由于这种比较的结果非真即假，因此使用\
  \ `std::is_same` 来定义条件就足够了。\n\n示例 49.1. 通过返回值使用 `boost::enable_if` 来重载函数\n\n```cpp\n\
  #include <boost/utility/enable_if.hpp>\n#include <type_traits>\n#include <string>\n\
  #include <iostream>\n\ntemplate <typename T>\ntypename boost::enable_if<std::is_same<T,\
  \ int>, T>::type create()\n{\n  return 1;\n}\n\ntemplate <typename T>\ntypename\
  \ boost::enable_if<std::is_same<T, std::string>, T>::type create()\n{\n  return\
  \ \"Boost\";\n}\n\nint main()\n{\n  std::cout << create<std::string>() << '\\n';\n\
  }\n```\n\n如果条件为真，相应的 `create()` 函数应该返回一个与模板参数传递给 `create()` 的类型相同的对象。这就是为什么 `T`\
  \ 被第二个参数传递给 `boost::enable_if`。如果条件为真，整个 `boost::enable_if` 表达式将被替换为 `T`。在 示例 49.1\
  \ 中，编译器看到的不是一个返回 `int` 的函数，要么一个返回 `std::string` 的函数。如果用 `int` 或 `std::string`以外的任何类型调用\
  \ `create()`，编译器将报告错误。\n\n示例 49.1 显示了 `Boost`。\n\n示例 49.2, “使用 `boost::enable_if`\
  \ 为一组类型特化函数” 使用 `boost::enable_if` 为一组类型特化函数。该函数名为 `print()`，并接收一个参数。它可以被重载，尽管重载要求你使用具体类型。为了对\
  \ `short`、`int` 或 `long` 等一组类型执行相同的操作，你可以使用 `boost::enable_if` 定义适当的条件。示例 49.2,\
  \ “使用 `boost::enable_if` 为一组类型特化函数” 使用 `std::is_integral` 来实现这一点。第二个 `print()` 函数通过\
  \ `std::is_floating_point` 针对所有浮点数进行了重载。\n\n### 示例 49.2. 使用 `boost::enable_if` 为一组类型特化函数\n\
  \n```cpp\n#include <boost/utility/enable_if.hpp>\n#include <type_traits>\n#include\
  \ <iostream>\n\ntemplate <typename T>\nvoid print(typename boost::enable_if<std::is_integral<T>,\
  \ T>::type i)\n{\n  std::cout << \"Integral: \" << i << '\\n';\n}\n\ntemplate <typename\
  \ T>\nvoid print(typename boost::enable_if<std::is_floating_point<T>, T>::type f)\n\
  {\n  std::cout << \"Floating point: \" << f << '\\n';\n}\n\nint main()\n{\n  print<short>(1);\n\
  \  print<long>(2);\n  print<double>(3.14);\n}\n```\n\n# 50. Boost.Fusion\n\n标准库提供了许多容器，它们有一个共同点：它们是同质的。也就是说，来自标准库的容器只能存储一种类型的元素。`std::vector<int>`\
  \ 类型的向量只能存储 `int` 值，而 `std::vector<std::string>` 类型的向量只能存储字符串。\n\n[Boost.Fusion](http://www.boost.org/doc/libs/release/)\
  \ 使得创建异构容器成为可能。例如，Boost.Fusion 提供了处理异构容器的算法。严格来说，自 C++11 以来，标准库已经提供了更多功能。然而，Boost.Fusion\
  \ 提供的函数超出了标准库的范围。\n\n`boost::fusion::for_each()` 被设计为像 `std::for_each()` 一样工作。`std::for_each()`\
  \ 只能迭代同质容器，而 `boost::fusion::for_each()` 可以处理异构容器。你将容器而不是迭代器传递给 `boost::fusion::for_each()`。如果你不想迭代容器中的所有元素，可以使用视图（view）。\n\
  \n\n\n\n\n```cpp\n#include <boost/fusion/tuple.hpp>\n#include <boost/fusion/view.hpp>\n\
  #include <boost/fusion/algorithm.hpp>\n#include <boost/type_traits.hpp>\n#include\
  \ <boost/mpl/arg.hpp>\n#include <string>\n#include <iostream>\n\nusing namespace\
  \ boost::fusion;\n\nstruct print\n{\n  template <typename T>\n  void operator()(const\
  \ T &t) const\n  {\n    std::cout << std::boolalpha << t << '\\n';\n  }\n};\n\n\
  int main()\n{\n  typedef tuple<int, std::string, bool, double> tuple_type;\n  tuple_type\
  \ t{10, \"Boost\", true, 3.14};\n  filter_view<tuple_type, boost::is_integral<boost::mpl::arg<1>>>\
  \ v{t};\n  for_each(v, print{});\n}\n```\n\nBoost.Fusion 提供了视图（views），它们的作用类似于容器但并不存储数据。通过视图，可以不同的方式访问容器中的数据。视图类似于\
  \ Boost.Range 中的适配器。然而，Boost.Range 的适配器只能应用于一个容器，而 Boost.Fusion 的视图可以跨越多个容器的数据。\n\
  \n示例 50.3 “使用 `boost::fusion::filter_view` 过滤 Fusion 容器” 使用 `boost::fusion::filter_view`\
  \ 类来过滤元组 `t`。该过滤器引导 `boost::fusion::for_each()` 仅写入整型类型的元素。\n\n`boost::fusion::filter_view`\
  \ 期望第一个模板参数是待过滤容器的类型。第二个模板参数必须是一个用于过滤元素的谓词（predicate）。该谓词必须根据元素的类型对元素进行过滤。\n\n该库之所以被称为\
  \ Boost.Fusion，因为它结合了两个世界：C++ 程序在运行时处理值，在编译时处理类型。对于开发者来说，运行的值通常更重要。标准库中的大多数工具都在运行时处理值。为了在编译时处理类型，则使用了模板元编程（template\
  \ meta programming）。值的处理取决于运行时的其他值，而类型的处理取决于编译时的其他类型。Boost.Fusion 允许你根据类型处理值。\n\n\
  传递给 `boost::fusion::filter_view` 的第二个模板参数是一个谓词，它将应用于元组中的每个类型。谓词期望一个类型作为参数，如果该类型应该是视图的一部分，则返回\
  \ `true`。如果返回 `false`，则该类型被过滤掉。\n\n示例 50.3 “使用 `boost::fusion::filter_view` 过滤 Fusion\
  \ 容器”使用了 Boost.TypeTraits 中的 `boost::is_integral` 类。`boost::is_integral` 是一个检查类型是否为整数类型的模板。由于模板参数必须传递给\
  \ `boost::fusion::filter_view`，使用了来自 Boost.MPL 的占位符 `boost::mpl::arg<1>` 来创建一个 lambda\
  \ 函数。`boost::mpl::arg<1>` 类似于 Boost.Phoenix 中的 `boost::phoenix::place_holders::arg1`。在示例\
  \ 50.3 “使用 `boost::fusion::filter_view` 过滤 Fusion 容器”中，视图 `v` 将仅包含元组中的 `int` 和 `bool`\
  \ 元素，因此示例将向标准输出写入 `10` 和 `true`。\n\n### 示例 50.4. 使用迭代器访问 Fusion 容器中的元素\n\n```cpp\n\
  #include <boost/fusion/tuple.hpp>\n#include <boost/fusion/iterator.hpp>\n#include\
  \ <boost/mpl/int.hpp>\n#include <string>\n#include <iostream>\n\nusing namespace\
  \ boost::fusion;\n\nint main()\n{\n  typedef tuple<int, std::string, bool, double>\
  \ tuple_type;\n  tuple_type t{10, \"Boost\", true, 3.14};\n  auto it = begin(t);\n\
  \  std::cout << *it << '\\n';\n  auto it2 = advance<boost::mpl::int_<2>>(it);\n\
  \  std::cout << std::boolalpha << *it2 << '\\n';\n}\n```\n\n在看到 `boost::fusion::tuple`\
  \ 和 `boost::fusion::for_each()` 之后，在示例 50.4 “使用迭代器访问 Fusion 容器中的元素”中发现迭代器并不应该感到意外。Boost.Fusion\
  \ 提供了几个独立函数，例如 `boost::fusion::begin()` 和 `boost::fusion::advance()`，它们的工作方式与标准库中同名的函数相同。\n\
  \n迭代器需要递增的步数作为模板参数传递给 `boost::fusion::advance()`。示例再次使用了 Boost.MPL 中的 `boost::mpl::int_`。\n\
  \n`boost::fusion::advance()` 返回一个与传入的类型不同的迭代器。在示例 50.4 “使用迭代器访问 Fusion 容器中的元素”中使用\
  \ `boost::fusion::advance()` 处理到第一个迭代器 `it`。程序向标准输出写入了 `10` 和 `true`。\n\n除了示例中引入的函数，Boost.Fusion\
  \ 还提供了其他与迭代器协作的函数。这些包括 `boost::fusion::end()`、`boost::fusion::distance()`、`boost::fusion::next()`\
  \ 和 `boost::fusion::prior()`。\n\n到为止，我们只看到一个容器 `boost::fusion::tuple`。示例 50.5 “带有\
  \ `boost::fusion::vector` 的异构向量”引入了另一个容器 `boost::fusion::vector`。\n\n`boost::fusion::vector`\
  \ 是一个向量：元素通过索引访问。相反，它是使用独立函数 `boost::fusion::at()` 实现的。索引被封装在 `boost::mpl::int_`\
  \ 中并作为模板参数传递。\n\n### 示例 50.5. 带有 `boost::fusion::vector` 的异构向量 \n\n```cpp\n#include\
  \ <boost/fusion/container.hpp>\n#include <boost/fusion/sequence.hpp>\n#include <boost/mpl/int.hpp>\n\
  #include <string>\n#include <iostream>\n\nusing namespace boost::fusion;\n\nint\
  \ main()\n{\n  typedef vector<int, std::string, bool, double> vector_type;\n  vector_type\
  \ v{10, \"Boost\", true, 3.14};\n  std::cout << at<boost::mpl::int_<0>>(v) << '\\\
  n';\n\n  auto v2 = push_back(v, 'X');\n  std::cout << size(v) << '\\n';\n  std::cout\
  \ << size(v2) << '\\n';\n  std::cout << back(v2) << '\\n';\n}\n```\n\n此示例向向量添加了一个\
  \ `char` 类型的新元素。这是通过独立函数 `boost::fusion::push_back()` 完成的。传递给 `boost::fusion::push_back()`\
  \ 的两个参数是要元素的向量以及要添加的值。\n\n`boost::fusion::push_back()` 返回一个新的向量。向量 `v` 没有被改变。新向量是原始向量添加元素后的副本。\n\
  \n此示例使用 `boost::fusion::size()` 获取向量 `v` 和 `v2` 的元素数量，并将两个值写入标准输出。程序显示 `4` 和 `5`。然后它调用\
  \ `boost::fusion::back()` 获取并将 `v2` 的最后一个元素写入标准输出，在这种情况下，该值为 `X`。\n\n\n\n\n\nBoost.Fusion\
  \ 提供了额外的异构容器，包括：`boost::fusion::deque`、`boost::fusion::list` 和 `boost::fusion::set`。示例\
  \ 50.6, “使用 `boost::fusion::map` 的异构 map` 引入了 `boost::fusion::map`，这是一种用于存储键值对的容器。\n\
  \n示例 50.6, “使用 `boost::fusion::map` 的异构 map` 使用 `boost::fusion::map()` 创建了一个异构的\
  \ map。该 map 的类型为 `boost::fusion::map`，由于使用了 `auto` 关键字，示例中并没有显式写出该类型。\n\n### 示例\
  \ 50.6. 使用 `boost::fusion::map` 的异构 map\n\n```cpp\n#include <boost/fusion/container.hpp>\n\
  #include <boost/fusion/sequence.hpp>\n#include <boost/fusion/algorithm.hpp>\n#include\
  \ <string>\n#include <iostream>\n\nusing namespace boost::fusion;\n\nint main()\n\
  {\n  auto m = make_map<int, std::string, bool, double>(\"Boost\", 10, 3.14, true);\n\
  \  if (has_key<std::string>(m))\n    std::cout << at_key<std::string>(m) << '\\\
  n';\n  auto m2 = erase_key<std::string>(m);\n  auto m3 = push_back(m2, make_pair<float>('X'));\n\
  \  std::cout << std::boolalpha << has_key<std::string>(m3) << '\\n';\n}\n```\n\n\
  类型为 `boost::fusion::map` 的 map 像 `std::map` 一样存储键值对。然而，Fusion map 中的键是类型。一个键值对由一个类型和一个映射到该类型的值组成。值的类型可以与键的类型不同。在\
  \ 示例 50.6, “使用 `boost::fusion::map` 的异构 map` 中，字符串“Boost”被映射到键 `int`。\n\n在创建 map\
  \ 之后，调用 `boost::fusion::has_key()` 来检查是否存在键 `std::string` 类型。然后，调用 `boost::fusion::at_key()`\
  \ 获取映射到该键的值。由于数字 10 被映射到 `std::string`，因此它被写入标准输出。\n\n随后使用 `boost::fusion::erase_key()`\
  \ 删除了该键值对。这不会改变 map `m`。`boost::fusion::erase_key()` 返回一个缺少了被删除键值对的新 map。\n\n调用\
  \ `boost::fusion::push_back()` 向 map 添加了一个新的键值对。该键为 `float`，值为“X”。调用 `boost::fusion::make_pair()`\
  \ 来创建这个新的键值对。此函数类似于 `std::make_pair()`。\n\n最后，再次调用 `boost::fusion::has_key()` 检查\
  \ map 是否包含键 `std::string`。由于它已被删除，因此返回 `false`。\n\n请注意，在调用 `boost::fusion::at_key()`\
  \ 之前，你不需要调用 `boost::fusion::has_key()` 来检查键是否存在。如果传递给 `boost::fusion::at_key()`\
  \ 的键在 map 中不存在，会导致编译错误。\n\nBoost.Fusion 提供了几个宏，让你可以使用结构作为 Fusion 容器。这是可能的，因为结构可以作为异构容器。示例\
  \ 50.7, “结构的 Fusion 适配器` 得益于宏 `BOOST_FUSION_ADAPT_STRUCT` 定义了一个可以作为 Fusion 容器使用的结构。这使得结构能够配合\
  \ `boost::fusion::at()` 或 `boost::fusion::back()` 等函数使用。\n\n### 示例 50.7. 结构的 Fusion\
  \ 适配器\n\n```cpp\n#include <boost/fusion/adapted.hpp>\n#include <boost/fusion/sequence.hpp>\n\
  #include <boost/mpl/int.hpp>\n#include <iostream>\n\nstruct strct\n{\n  int i;\n\
  \  double d;\n};\n\nBOOST_FUSION_ADAPT_STRUCT(strct,\n  (int, i)\n  (double, d)\n\
  )\n\nusing namespace boost::fusion;\n\nint main()\n{\n  strct s = {10, 3.14};\n\
  \  std::cout << at<boost::mpl::int_<0>>(s) << '\\n';\n  std::cout << back(s) <<\
  \ '\\n';\n}\n```\n\nBoost.Fusion 支持如 `std::pair` 和 `boost::tuple` 等结构，而无需使用宏。你只需要包含头文件\
  \ `boost/fusion/adapted.hpp`（参见 示例 50.8, “对 `std::pair` 的 Fusion 支持`）。\n\n\n\n\n\
  `cooperative()` 向标准输出输出了 `Hello`。随后，函数像调用函数一样访问了 `sink`。这是因为 `push_type` 重载了 `operator()`。当\
  \ `main()` 中的 `source` 代表协程 `cooperative()` 时，`cooperative()` 中的 `sink` 则代表函数 `main()`。调用\
  \ `sink` 会使 `cooperative()` 返回，`main()` 从 `cooperative()` 被调用的地方继续执行，并向标准输出输出一个逗号。\n\
  \n然后，`main()` 像调用函数一样调用了 `source`。同样，这是通过重载的 `operator()` 实现的。这一次，`cooperative()`\
  \ 从上次停止的地方继续，向标准输出输出了 `world`。由于 `cooperative()` 中没有其他代码，协程结束。它返回到 `main()`，后者向标准输出输出一个感叹号。\n\
  \n结果是示例 51.1, “使用协程” 显示了 `Hello, world!`。\n\n你可以将协程理解为协作线程。在某种程度上，函数 `main()` 和\
  \ `cooperative()` 并发运行。代码在 `main()` 和 `cooperative()` 之间切换执行。每个函数内部的指令是顺序执行的。得益于协程，函数在执行另一个函数之前不需要返回。\n\
  \n### 示例 51.2. 从协程返回值\n\n```cpp\n#include <boost/coroutine/all.hpp>\n#include <functional>\n\
  #include <iostream>\n\nusing boost::coroutines::coroutine;\n\nvoid cooperative(coroutine<int>::push_type\
  \ &sink, int i)\n{\n  int j = i;\n  sink(++j);\n  sink(++j);\n  std::cout << \"\
  end\\n\";\n}\n\nint main()\n{\n  using std::placeholders::_1;\n  coroutine<int>::pull_type\
  \ source{std::bind(cooperative, _1, 0)};\n  std::cout << source.get() << '\\n';\n\
  \  source();\n  std::cout << source.get() << '\\n';\n  source();\n}\n```\n\n示例 51.2,\
  \ “从协程返回值” 与之前的示例类似。这一次，模板 `boost::coroutines::coroutine` 使用 `int` 实例化。这使得从协程向调用者返回\
  \ `int` 成为可能。\n\n`int` 值的传递方向取决于 `pull_type` 和 `push_type` 使用的位置。示例在 `main()` 中使用\
  \ `pull_type` 实例化。`cooperative()` 访问 `push_type` 类型的对象。`push_type` 发送值，而 `pull_type`\
  \ 接收值；因此，数据传输的方向被设定了。\n\n`cooperative()` 调用带有 `int` 类型参数的 `sink`。该参数是必要的，因为协程是用数据类型\
  \ `int` 实例化的。传递给 `sink` 的值是在 `main()` 中通过 `pull_type` 提供的成员函数 `get()` 接收到的。示例 51.2,\
  \ “从协程返回值” 也说明了带有多个参数的函数如何作为协程使用。`cooperative()` 有一个额外的 `int` 类型参数，它不能直接传递给 `pull_type`\
  \ 的构造函数。示例使用 `std::bind()` 将函数与 `pull_type` 链接。\n\n示例向标准输出输出了 `1` 和 `2`，然后是 `end`。\n\
  \n### 示例 51.3. 向协程传递两个值\n\n```cpp\n#include <boost/coroutine/all.hpp>\n#include\
  \ <tuple>\n#include <string>\n#include <iostream>\n\nusing boost::coroutines::coroutine;\n\
  \nvoid cooperative(coroutine<std::tuple<int, std::string>>::pull_type &source)\n\
  {\n  auto args = source.get();\n  std::cout << std::get<0>(args) << \" \" << std::get<1>(args)\
  \ << '\\n';\n  source();\n  args = source.get();\n  std::cout << std::get<0>(args)\
  \ << \" \" << std::get<1>(args) << '\\n';\n}\n\nint main()\n{\n  coroutine<std::tuple<int,\
  \ std::string>>::push_type sink{cooperative};\n  sink(std::make_tuple(0, \"aaa\"\
  ));\n  sink(std::make_tuple(1, \"bbb\"));\n  std::cout << \"end\\n\";\n}\n```\n\n\
  示例 51.3, “向协程传递两个值” 使用了 `main()` 中的 `push_type` 和 `cooperative()` 中的 `pull_type`，这意味着数据从调用者传输到协程。\n\
  \n此示例说明了如何传递多个值。Boost.Coroutine 不支持多个值。但是，通过使用 `std::tuple`，我们可以传递多个值。示例 51.3, “向协程传递两个值”\
  \ 使用了 `main()` 中的 `push_type` 和 `cooperative()` 中的 `pull_type`，这意味着数据从调用者传输到协程。\n\
  \n\n\n\n[Boost.Parameter](http://www.boost.org/libs/parameter) 使得以键值对的形式传递参数成为可能。该库除了支持函数参数外，还支持模板参数。如果你正在使用长参数列表，且参数的顺序和意义难以记忆，那么\
  \ Boost.Parameter 特别有用。键值对允许你以任何顺序传递参数。由于每个值都带有一个键传递的，因此各种值的含义也更加清晰。\n\n示例 53.1,\
  \ “作为键值对的函数参数” 定义了一个函数 `complicated()`，该函数期望五个参数。这些参数可以以任何顺序传递。Boost.Parameter 提供了宏\
  \ `BOOST_PARAMETER_FUNCTION` 来定义这样的函数。\n\n在使用 `BOOST_PARAMETER_FUNCTION` 之前，必须先定义键值对的参数。这是通过宏\
  \ `BOOST_PARAMETER_NAME` 完成的，该宏只需传入一个参数名称。示例中使用了五次 `BOOST_PARAMETER_NAME` 来定义参数名称\
  \ `a`、`b`、`c`、`d` 和 `e`。\n\n请注意，参数名称自动定义在命名空间 `tag` 中。这可以避免与程序中同名的定义发生冲突。\n\n在定义参数名称后，使用\
  \ `BOOST_PARAMETER_FUNCTION` 来定义函数 `complicated()`。传递给 `BOOST_PARAMETER_FUNCTION`\
  \ 的第一个参数是返回值类型。在示例中是 `void`。请注意，类型必须封装在括号中——第一个参数是 `(void)`。\n\n第二个参数是正在定义的函数名称。第三个参数是包含参数名称的命名空间。在第四个参数中，通过访问参数名称来进行进一步指定。\n\
  \n### 示例 53.1. 作为键值对的函数参数\n\n```\n#include <boost/parameter.hpp>\n#include <string>\n\
  #include <iostream>\n#include <ios>\n\nBOOST_PARAMETER_NAME(a)\nBOOST_PARAMETER_NAME(b)\n\
  BOOST_PARAMETER_NAME(c)\nBOOST_PARAMETER_NAME(d)\nBOOST_PARAMETER_NAME(e)\n\nBOOST_PARAMETER_FUNCTION(\n\
  \  (void),\n  complicated,\n  tag,\n  (required\n    (a, (int))\n    (b, (char))\n\
  \    (c, (double))\n    (d, (std::string))\n    (e, *)\n  )\n)\n{\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << a << '\\n';\n  std::cout << b << '\\n';\n  std::cout << c << '\\\
  n';\n  std::cout << d << '\\n';\n  std::cout << e << '\\n';\n}\n\nint main()\n{\n\
  \  complicated(_c = 3.14, _a = 1, _d = \"Boost\", _b = 'B', _e = true);\n}\n```\n\
  \n在 示例 53.1, “作为键值对的函数参数” 中，第四个参数以 `required` 开始，这是一个关键字，使得随后的参数是强制性的。`required`\
  \ 后面跟着一个或多个由参数名称和类型组成的对。将类型封装在括号中是非常重要的。\n\n参数 `a`、`b`、`c` 和 `d` 使用了不同的类型。例如，`a`\
  \ 可用于向 `complicated()` 传递一个 `int` 值。`e` 没有给出类型。相反，使用了星号，这表示所传递的值可以是任何类型。`e` 是一个模板参数。\n\
  \n在将各种参数传递给 `BOOST_PARAMETER_FUNCTION` 之后，将定义函数体。这与常例一样在一对大括号之间完成。可以在函数体中访问参数。它们可以像变量一样使用，使用在\
  \ `BOOST_PARAMETER_FUNCTION` 中分配的类型。示例 53.1, “作为键值对的函数参数” 将参数写入标准输出。\n\n在 `main()`\
  \ 中调用了 `complicated()`。参数以任意顺序传递给 `complicated()`。参数名称以下划线开头。Boost.Parameter 使用下划线来避免与其他变量发生名称冲突。\n\
  \n### 注意\n\n在 C++ 中要键键值对的形式传递函数参数，你也可以使用[命名参数用法，](http://www.parashift.com/c++-faq/named-parameter-idiom.html)，它不需要像\
  \ Boost.Parameter 这样的库。\n\n### 示例 53.2. 可选函数参数\n\n```cpp\n#include <boost/parameter.hpp>\n\
  #include <string>\n#include <iostream>\n#include <ios>\n\nBOOST_PARAMETER_NAME(a)\n\
  BOOST_PARAMETER_NAME(b)\nBOOST_PARAMETER_NAME(c)\nBOOST_PARAMETER_NAME(d)\nBOOST_PARAMETER_NAME(e)\n\
  \nBOOST_PARAMETER_FUNCTION(\n  (void),\n  complicated,\n  tag,\n  (required\n  \
  \  (a, (int))\n    (b, (char))\n    (c, (double))\n    (d, (std::string))\n    (e,\
  \ *)\n  )\n)\n{\n  std::cout.setf(std::ios::boolalpha);\n  std::cout << a << '\\\
  n';\n  std::cout << b << '\\n';\n  std::cout << c << '\\n';\n  std::cout << d <<\
  \ '\\n';\n  std::cout << e << '\\n';\n}\n\nint main()\n{\n  complicated(_c = 3.14,\
  \ _a = 1, _d = \"Boost\", _b = 'B', _e = true);\n}\n```\n\n`BOOST_PARAMETER_FUNCTION`\
  \ 也支持可选参数。在 示例 53.2, “可选函数参数” 中，参数 `c`、`d` 和 `e` 是可选的。它们在 `BOOST_PARAMETER_FUNCTION`\
  \ 中使用 `optional` 关键字定义。\n\n可选参数的定义与强制参数一样：参数名称后面跟着类型。和常一样，类型被封装在括号中。在调用 `complicated()`\
  \ 时，只传递了 `a` 和 `b`。这些是参数。\n\nBoost.Parameter 除了 `BOOST_PARAMETER_FUNCTION` 之外还提供了宏。例如，你可以使用\
  \ `BOOST_PARAMETER_MEMBER_FUNCTION` 来定义成员函数，使用 `BOOST_PARAMETER_CONST_MEMBER_FUNCTION`\
  \ 来定义常量成员函数。\n\n你可以使用 Boost.Parameter 定义尝试自动为参数赋值的函数。在这种情况下，你不需要传递键值对——仅传递值就足够了。如果所有值的类型都不同，Boost.Parameter\
  \ 可以检测哪个值属于哪个参数。这可能需要你对模板编程有更深入了解。\n\n### 示例 53.3. 作为键值对的模板参数\n\n示例 53.3, “作为键值对的模板参数”\
  \ 使用 Boost.Parameter 以键值对的形式传递模板参数。与函数一样，可以以任何顺序传递模板参数。\n\n该示例定义了一个类 `complicated`，它期望三个模板参数。由于参数顺序并不重要，因此被称为\
  \ `A`、`B` 和 `C`。`A`、`B` 和 `C` 并不是访问类模板时使用的参数名称。与函数一样，参数名称是使用宏定义的。对于模板参数，使用了 `BOOST_PARAMETER_TEMPLATE_KEYWORD`。示例定义了三个参数名称\
  \ `integral_type`、`floating_point_type` 和 `any_type`。\n\n`boost::parameter::parameters`\
  \ 是描述参数的元组。强制参数用 `boost::parameter::required` 标记。\n\n\n\n\n\n`boost::parameter::required`\
  \ 需要两个参数。第一个是使用 `BOOST_PARAMETER_TEMPLATE_KEYWORD` 定义的参数名称。第二个是标识参数可能被设置的类型。例如，`integral_type`\
  \ 可以被设置为整数类型。该要求通过 `std::is_integral<_>` 表达。`std::is_integral<_>` 是一个基于 Boost.MPL\
  \ 的 lambda 函数。`boost::mpl::placeholders::_` 是该库提供的一个占位符。如果将 `integral_type` 设置的类型传递给\
  \ `std::is_integral` 而不是 `boost::mpl::placeholders::_`，并且结果为真，则使用该有效类型。其他参数 `floating_point_type`\
  \ 和 `any_type` 的要求定义也类似。\n\n### 示例 53.3. 作为键值对的模板参数\n\n```cpp\n#include <boost/parameter.hpp>\n\
  #include <boost/mpl/placeholders.hpp>\n#include <type_traits>\n#include <typeinfo>\n\
  #include <iostream>\n\nBOOST_PARAMETER_TEMPLATE_KEYWORD(integral_type)\nBOOST_PARAMETER_TEMPLATE_KEYWORD(floating_point_type)\n\
  BOOST_PARAMETER_TEMPLATE_KEYWORD(any_type)\n\nusing namespace boost::parameter;\n\
  using boost::mpl::placeholders::_;\n\ntypedef parameters<\n  required<tag::integral_type,\
  \ std::is_integral<_>>,\n  required<tag::floating_point_type, std::is_floating_point<_>>,\n\
  \  required<tag::any_type, std::is_object<_>>\n> complicated_signature;\n\ntemplate\
  \ <class A, class B, class C>\nclass complicated\n{\npublic:\n  typedef typename\
  \ complicated_signature::bind<A, B, C>::type args;\n  typedef typename value_type<args,\
  \ tag::integral_type>::type integral_type;\n  typedef typename value_type<args,\
  \ tag::floating_point_type>::type\n    floating_point_type;\n  typedef typename\
  \ value_type<args, tag::any_type>::type any_type;\n};\n\nint main()\n{\n  typedef\
  \ complicated<floating_point_type<double>, integral_type<int>,\n    any_type<bool>>\
  \ c;\n  std::cout << typeid(c::integral_type).name() << '\\n';\n  std::cout << typeid(c::floating_point_type).name()\
  \ << '\\n';\n  std::cout << typeid(c::any_type).name() << '\\n';\n}\n```\n\n在创建并定义签名为\
  \ `complicated_signature` 后，它被类 `complicated` 使用。首先，该签名通过 `complicated_signature::bind`\
  \ 句绑定到模板参数 `A`、`B` 和 `C`。新类型 `args` 代表了所传递的模板参数与模板参数必须满足的要求之间的连接。接下来，访问 `args` 以获取参数值。这是通过\
  \ `boost::parameter::value_type` 实现的。`boost::parameter::value_type` 期望接收 `args`\
  \ 和一个参数。该参数决定了创建的类型。在示例 53.3 中，`complicated` 类中的类型定义 `integral_type` 被用于获取传递给 `complicated`\
  \ 的参数 `integral_type` 的类型。\n\n`main()` 访问 `complicated` 以实例化该类。参数 `integral_type`\
  \ 被设置为 `int`，`floating_point_type` 设置为 `double`，`any_type` 设置为 `bool`。传递参数的顺序并不重要。然后通过\
  \ `typeid` 访问类型定义 `integral_type`、`floating_point_type` 和 `any_type` 以获取它们的底层类型。使用\
  \ Visual C++ 2013 编译，示例向标准输出输出 `int`、`double` 和 `bool`。\n\n### 示例 53.4. 可选模板参数\n\
  \n```cpp\n#include <boost/parameter.hpp>\n#include <boost/mpl/placeholders.hpp>\n\
  #include <type_traits>\n#include <typeinfo>\n#include <iostream>\n\nBOOST_PARAMETER_TEMPLATE_KEYWORD(integral_type)\n\
  BOOST_PARAMETER_TEMPLATE_KEYWORD(floating_point_type)\nBOOST_PARAMETER_TEMPLATE_KEYWORD(any_type)\n\
  \nusing namespace boost::parameter;\nusing boost::mpl::placeholders::_;\n\ntypedef\
  \ parameters<\n  required<tag::integral_type, std::is_integral<_>>,\n  optional<tag::floating_point_type,\
  \ std::is_floating_point<_>>,\n  optional<tag::any_type, std::is_object<_>>\n> complicated_signature;\n\
  \ntemplate <class A, class B = void_, class C = void_>\nclass complicated\n{\npublic:\n\
  \  typedef typename complicated_signature::bind<A, B, C>::type args;\n  typedef\
  \ typename value_type<args, tag::integral_type>::type integral_type;\n  typedef\
  \ typename value_type<args, tag::floating_point_type, float>::type\n    floating_point_type;\n\
  \  typedef typename value_type<args, tag::any_type, bool>::type any_type;\n};\n\n\
  int main()\n{\n  typedef complicated<floating_point_type<double>, integral_type<int>,\n\
  \    any_type<bool>> c;\n  // 可选参数的实现细节\n}\n```\n\n### Boost.Conversion\n\nBoost.Conversion\
  \ 在头文件 `boost/cast.hpp` 中定义了转换运算符 `polymorphic_cast` 和 `polymorphic_downcast`。它们设计用于更精确地处理类型转换——通常使用\
  \ `dynamic_cast` 完成。\n\n#### 示例 54.1. 使用 `dynamic_cast` 进行向下转换和交叉转换\n\n```cpp\n\
  #include <iostream>\n\nstruct base1 { virtual ~base1() = default; };\nstruct base2\
  \ { virtual ~base2() = default; };\nstruct derived : public base1, public base2\
  \ {};\n\nvoid downcast(base1 *b1) {\n  derived *d = dynamic_cast<derived*>(b1);\n\
  }\n\nvoid crosscast(base1 *b1) {\n  base2 *b2 = dynamic_cast<base2*>(b1);\n}\n\n\
  int main() {\n  derived *d = new derived;\n  downcast(d);\n\n  base1 *b1 = new derived;\n\
  \  crosscast(b1);\n}\n```\n\n#### 示例 54.2. 使用 `polymorphic_downcast` 和 `polymorphic_cast`\
  \ 进行向下转换和交叉转换\n\n```cpp\n#include <boost/cast.hpp>\n#include <iostream>\n\nstruct\
  \ base1 { virtual ~base1() = default; };\nstruct base2 { virtual ~base2() = default;\
  \ };\nstruct derived : public base1, public base2 {};\n\nvoid downcast(base1 *b1)\
  \ {\n  derived *d = boost::polymorphic_downcast<derived*>(b1);\n}\n\nvoid crosscast(base1\
  \ *b1) {\n  base2 *b2 = boost::polymorphic_cast<base2*>(b1);\n}\n\nint main() {\n\
  \  derived *d = new derived;\n  downcast(d);\n\n  base1 *b1 = new derived;\n  crosscast(b1);\n\
  }\n```\n[/content] (注：由于您提供的原始文本末尾似乎有截断，我根据上下文补全了翻译逻辑)\n\n---\n**修正说明：** 发现您提供的原始文本在示例\
