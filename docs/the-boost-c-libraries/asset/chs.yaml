  \ 的结果是 `true_type` 或 `false_type`。`type` 允许你将函数的结果作为类型传递给另一个函数。\n\n*(注：原文后续部分存在大量重复，译文已去重处理)*\n\
  \n\n\n\n\n`Boost.EnableIf` 提供了 `boost::enable_if` 类，它是一个期望两个参数的模板。第一个参数是条件。第二个参数当条件为真时，`boost::enable_if`\
  \ 表达式的类型。其技巧在于，如果条件为假，该类型就不存在，在这种情况下 `boost::enable_if` 表达式是无效的 C++ 代码。然而，在处理模板时，编译器不会对无效代码报错。相反，它会忽略该模板并寻找另一个可能匹配的模板。这个概念被称为\
  \ `SFINAE`，全称为“替换失败不是错误”（Substitution Failure Is Not An Error）。\n\n在 示例 49.1, “通过返回值使用\
  \ `boost::enable_if` 来重载函数” 中，`boost::enable_if` 表达式中的两个条件都使用了 `std::is_same` 类。该类定义在\
  \ C++11 标准库中，允许你比较两个类型。由于这种比较的结果非真即假，因此使用 `std::is_same` 来定义条件就足够了。\n\n### 示例 49.1.\
  \ 通过返回值使用 `boost::enable_if` 来重载函数\n\n```cpp\n#include <boost/utility/enable_if.hpp>\n\
  #include <type_traits>\n#include <string>\n#include <iostream>\n\ntemplate <typename\
  \ T>\ntypename boost::enable_if<std::is_same<T, int>, T>::type create()\n{\n  return\
  \ 1;\n}\n\ntemplate <typename T>\ntypename boost::enable_if<std::is_same<T, std::string>,\
  \ T>::type create()\n{\n  return \"Boost\";\n}\n\nint main()\n{\n  std::cout <<\
  \ create<std::string>() << '\\n';\n}\n```\n\n如果条件为真，相应的 `create()` 函数应该返回一个与模板参数传递给\
  \ `create()` 的类型相同的对象。这就是为什么 `T` 被第二个参数传递给 `boost::enable_if`。如果条件为真，整个 `boost::enable_if`\
  \ 表达式将被替换为 `T`。在 示例 49.1, “通过返回值使用 `boost::enable_if` 来重载函数” 中，编译器看到的不是一个返回 `int`\
  \ 的函数，要么一个返回 `std::string` 的函数。如果用 `int` 或 `std::string`以外的任何类型调用 `create()`，编译器将报告错误。\n\
  \n示例 49.1, “通过返回值使用 `boost::enable_if` 来重载函数” 显示了 `Boost`。\n\n示例 49.2, “使用 `boost::enable_if`\
  \ 为一组类型特化函数” 使用 `boost::enable_if` 为一组类型特化函数。该函数名为 `print()`，并接收一个参数。它可以被重载，尽管重载要求你使用具体类型。为了对\
  \ `short`、`int` 或 `long` 等一组类型执行相同的操作，你可以使用 `boost::enable_if` 定义适当的条件。示例 49.2,\
  \ “使用 `boost::enable_if` 为一组类型特化函数” 使用 `std::is_integral` 来实现这一点。第二个 `print()` 函数通过\
  \ `std::is_floating_point` 针对所有浮点数进行了重载。\n\n### 示例 49.2. 使用 `boost::enable_if` 为一组类型特化函数\n\
  \n```cpp\n#include <boost/utility/enable_if.hpp>\n#include <type_traits>\n#include\
  \ <iostream>\n\ntemplate <typename T>\nvoid print(typename boost::enable_if<std::is_integral<T>,\
  \ T>::type i)\n{\n  std::cout << \"Integral: \" << i << '\\n';\n}\n\ntemplate <typename\
  \ T>\nvoid print(typename boost::enable_if<std::is_floating_point<T>, T>::type f)\n\
  {\n  std::cout << \"Floating point: \" << f << '\\n';\n}\n\nint main()\n{\n  print<short>(1);\n\
  \  print<long>(2);\n  print<double>(3.14);\n}\n```\n\n# 50. Boost.Fusion\n\n标准库提供了许多容器，它们有一个共同点：它们是同质的。也就是说，来自标准库的容器只能存储一种类型的元素。`std::vector<int>`\
