  # 示例 37.3. 使用 `boost::chrono::time_point_cast()` 时间点\n\n```cpp\n#include <boost/chrono.hpp>\n\
  #include <iostream>\n\nusing namespace boost::chrono;\n\nint main()\n{\n  process_real_cpu_clock::time_point\
  \ p = process_real_cpu_clock::now();\n  std::cout << p << '\\n';\n  std::cout <<\
  \ time_point_cast<minutes>(p) << '\\n';\n}\n```\n\n`boost::chrono::time_point_cast()`\
  \ 函数的使用方式类似于强制转换符。示例 37.3, “使用 `boost::chrono::time_point_cast()` 时间点”\") 使用 `boost::chrono::time_point_cast()`\
  \ 将一个基于纳秒的时间点转换为分钟的时间点。在这种情况下，你必须使用 `boost::chrono::time_point_cast()`，因为时间点在可能丢失精度的情况下，无法用精度较低的单位（分钟）来表示。从低精度单位转换为高精度单位时，你不需要\
  \ `boost::chrono::time_point_cast()`。\n\nBoost.Chrono 还为持续时长提供了强制转换符。\n\n## 示例 37.4.\
  \ 使用 `boost::chrono::duration_cast()` 转换时长\n\n```cpp\n#include <boost/chrono.hpp>\n\
  #include <iostream>\n\nusing namespace boost::chrono;\n\nint main()\n{\n  minutes\
  \ m{1};\n  seconds s{35};\n\n  std::cout << m + s << '\\n';\n  std::cout << duration_cast<minutes>(m\
  \ + s) << '\\n';\n}\n```\n\n示例 37.4, “使用 `boost::chrono::duration_cast()` 转换时长”\"\
  ) 使用 `boost::chrono::duration_cast()` 函数将持续时长从秒转换为分钟。此示例向标准输出写入 `1 minute`。\n\n\
  ## 示例 37.5. 持续时舍入\n\n```cpp\n#include <boost/chrono.hpp>\n#include <iostream>\n\n\
  using namespace boost::chrono;\n\nint main()\n{\n  std::cout << floor<minutes>(minutes{1}\
  \ + seconds{45}) << '\\n';\n  std::cout << round<minutes>(minutes{1} + seconds{15})\
  \ << '\\n';\n  std::cout << ceil<minutes>(minutes{1} + seconds{15}) << '\\n';\n\
  }\n```\n\nBoost.Chrono 还提供了在转换时对持续时长进行舍入的函数。`boost::chrono::round()` 向上或向下舍入，`boost::chrono::floor()`\
  \ 向下取整，而 `boost::chrono::ceil()` 向上取整。`boost::chrono::floor()` 使用 `boost::chrono::duration_cast()`\
  \ ——这两个函数之间没有区别。\n\n示例 37.5, “持续时长舍入” 向标准输出写入 `1 minute`、`1 minute` 和 `2 minutes`。\n\
  \n## 示例 37.6. 用户定义输出的流操符\n\n```cpp\n#define BOOST_CHRONO_VERSION 2\n#include <boost/chrono.hpp>\n\
  #include <boost/chrono/chrono_io.hpp>\n#include <iostream>\n\nusing namespace boost::chrono;\n\
  \nint main()\n{\n  std::cout << symbol_format << minutes{10} << '\\n';\n\n  std::cout\
  \ << time_fmt(boost::chrono::timezone::local, \"%H:%M:%S\") <<\n    system_clock::now()\
  \ << '\\n';\n}\n```\n\nBoost.Chrono 提供了各种流操符来格式化时间点和持续时长的输出。例如，使用操符 `boost::chrono::symbol_format()`，时间单位将以符号而非名称写入。因此示例\
  \ 37.6, “用户定义输出的流操符” 显示 `10 min`。\n\n操符 `boost::chrono::time_fmt()` 可用于设置时区和格式字符串。时区必须设置为\
  \ `boost::chrono::timezone::local` 或 `boost::chrono::timezone::utc`。格式字符串可以使用标志来引用时间点的各种组件。例如，示例\
  \ 37.6, “用户定义输出的流操符” 向标准输出写入一个如下的字符串：`15:46:44`。\n\n除了流操符外，Boost.Chrono 还为许多不同的定制提供了面幅（facets）。例如，有一个面幅能够以另一种语言输出时间点。\n\
  \n### 注意\n\n自 Boost 1.52.0 以来，输入/输出函数有两个版本。从 Boost 1.55.0 开始，默认使用较新版本。如果你使用早于 1.55.0\
  \ 的版本，必须定义 `BOOST_CHRONO_VERSION` 并将其设置为 `2`，以便示例 37.6, “用户定义输出的流操符”正常工作。\n\n###\
  \ Boost.Timer\n\n[Boost.Timer](http://www.boost.org/libs/timer) 提供了测量性能的计时器。初看起来它似乎与\
  \ `boost::chrono` 竞争。然而，虽然 `boost::chrono` 用于测量任意周期，但你应该使用 `Boost.Timer` 来测量代码。\n\
  \n从 1.48 版本开始，有两个版本的 Boost.Timer。第一个版本只有一个头文件：`boost/timer/timer.hpp`。\n\nBoost.Timer\
  \ 提供的计时器通过 `boost::timer::cpu_timer` 和 `boost::timer::auto_timer` 类实现。`boost::timer::auto_timer`\
  \ 派自 `boost::timer::cpu_timer` 并在析构函数中自动停止计时。\n\n在实例化 `boost::timer::cpu_timer`\
  \ 时开始测量。你可以在任何时候调用成员函数 `format()` 获取已时间。示例 38.1, “使用 `boost::timer::cpu_timer()`\
  \ 测量时间”\") 以以下格式显示输出：`0.099170s wall, 0.093601s user + 0.000000s system = 0.093601s\
  \ CPU (94.4%)`。\n\n### 示例 38.1. 使用 `boost::timer::cpu_timer` 测量时间\n\n```cpp\n#include\
  \ <boost/timer/timer.hpp>\n#include <iostream>\n#include <cmath>\n\nusing namespace\
  \ boost::timer;\n\nint main()\n{\n  cpu_timer timer;\n\n  for (int i = 0; i < 1000000;\
  \ ++i)\n    std::pow(1.234, i);\n  std::cout << timer.format() << '\\n';\n}\n```\n\
  \nBoost.Timer 测量墙上时间（wall time）和 CPU 时间。墙上时间是根据挂钟流逝的时间。你可以用秒表测量这段时间。CPU 时间表示程序执行代码所花费的时间。在当今的多任务系统中，处理器并不总是对程序可用。程序可能还需要停止并等待用户输入。在这些情况下，墙上时间继续移动，但\
  \ CPU 时间不会。\n\n## 示例 38.2. 停止和恢复计时器\n\n\n\n\n\n```cpp\n#include <boost/timer/timer.hpp>\n\
  #include <iostream>\n#include <cmath>\n\nusing namespace boost::timer;\n\nint main()\n\
  {\n  cpu_timer timer;\n\n  for (int i = 0; i < 1000000; ++i)\n    std::pow(1.234,\
  \ i);\n  std::cout << timer.format() << '\\n';\n\n  timer.stop();\n\n  for (int\
  \ i = 0; i < 1000000; ++i)\n    std::pow(1.234, i);\n  std::cout << timer.format()\
  \ << '\\n';\n\n  timer.resume();\n\n  for (int i = 0; i < 1000000; ++i)\n    std::pow(1.234,\
  \ i);\n  std::cout << timer.format() << '\\n';\n}\n```\n\n`boost::timer::cpu_timer`\
  \ 提供了成员函数 `stop()` 和 `resume()`，用于停止和恢复计时器。在 示例 38.2, “停止和恢复计时器”）中，计时器在第二个 `for`\
  \ 循环运行之前被停止，并在之后恢复。因此，第二个 `for` 循环没有被测量。这类似于一个停止后在一段时间后再次恢复的秒表。在 示例 38.2, “停止和恢复计时器”）中，第二次调用\
  \ `format()` 返回的时间与不存在第二个 `for` 循环时的结果是一样的。\n\n`boost::timer::cpu_timer` 还提供了一个成员函数\
  \ `start()`。如果你调用 `start()` 而不是 `resume()`，计时器将从零重新启动。`boost::timer::cpu_timer`\
  \ 的构造函数会调用 `start()`，这也就是为什么计时器在实例化 `boost::timer::cpu_timer` 时会立即启动。\n\n## 示例 38.3.\
  \ 获取元组形式的墙钟时间和 CPU 时间\n\n```cpp\n#include <boost/timer/timer.hpp>\n#include <iostream>\n\
  #include <cmath>\n\nusing namespace boost::timer;\n\nint main()\n{\n  cpu_timer\
  \ timer;\n\n  for (int i = 0; i < 1000000; ++i)\n    std::pow(1.234, i);\n\n  cpu_times\
  \ times = timer.elapsed();\n  std::cout << times.wall << '\\n';\n  std::cout <<\
  \ times.user << '\\n';\n  std::cout << times.system << '\\n';\n}\n```\n\n虽然 `format()`\
  \ 以字符串的形式返回测量的墙钟时间和 CPU 时间，但也可以以元组的形式接收这些时间（参见 示例 38.3, “获取元组形式的墙钟时间和 CPU 时间”）。`boost::timer::cpu_timer`\
  \ 提供了成员函数 `elapsed()` 来来实现。`elapsed()` 返回一个类型为 `boost::timer::times` 的元组。该元组有三个成员变量：`wall`、`user`\
  \ 和 `system`。这些成员变量包含纳秒单位的墙时间和 CPU 时间。它们的类型是 `boost::int_least64_t`。\n\n`boost::timer::times`\
  \ 提供了成员函数 `clear()` 来将 `wall`、`user` 和 `system` 设置为 0。\n\n## 示例 38.4. 使用 `boost::timer::auto_cpu_timer`\
  \ 自动测量时间\n\n```cpp\n#include <boost/timer/timer.hpp>\n#include <cmath>\n\nusing\
  \ namespace boost::timer;\n\nint main()\n{\n  auto_cpu_timer timer;\n\n  for (int\
  \ i = 0; i < 1000000; ++i)\n    std::pow(1.234, i);\n}\n```\n\n你可以使用 `boost::timer::auto_cpu_timer`\
  \ 测量代码块的墙时间和 CPU 时间。由于该类的析构函数会停止计时并将时间写入标准输出流，因此 示例 38.4, “使用 `boost::timer::auto_cpu_timer`\
  \ 自动测量时间”）的操作与 示例 38.1, “使用 `boost::timer::cpu_timer` 测量时间”）相同。\n\n`boost::timer::auto_cpu_timer`\
  \ 提供了几个构造函数。例如，你可以传递一个用于显示时间的输出流。默认情况下，输出流是 `std::cout`。\n\n你可以为 `boost::timer::auto_cpu_timer`\
  \ 和 `boost::timer::cpu_timer` 指定报告时间的格式。Boost.Timer 提供了类似于 Boost.Format 或 `std::printf()`\
  \ 所支持的格式标志。文档包含了这些格式标志的概述。\n\n# 第 IX 部分。函数式编程\n\n在函数式编程模型中，函数是对象，与其他对象一样，它们可以作为参数传递给函数或存储在容器中。有许多\
  \ Boost 库支持函数式编程模型。\n\n* `Boost.Phoenix` 是用于创建对象的强大库。\n- `Boost.Function` 为任何可调用目标提供了通用接口。\n\
  - `Boost.Bind` 允许将参数绑定到函数。\n- `Boost.Lambda` 提供定义匿名函数的方法。\n- `Boost.Ref` 允许通过引用向对象传递参数。\n\
  - `Boost.Callable` 是检查类型是否可用的工具。\n\n# 39. Boost.Phoenix\n\n[Boost.Phoenix](https://www.boost.org/doc/libs/release/)\
  \ 是一个创建对象的库。在函数式编程中，函数是可以到处传递的对象。Boost.Phoenix 提供了各种表达式来创建这些对象。每个表达式都可以通过 `operator()`\
  \ 调用。\n\nBoost.Phoenix 中常用的表达式有：\n\n- `_1`, `_2` 等：代表函数的第一个、第二个参数的占位符。\n- `_a`：代表传递给函数的任意占位符。\n\
  - `_val`：返回传递值的占位符。\n- `bind`：创建一个将参数绑定到函数的函数。\n- `lambda`：从 lambda 表达式创建函数。\n-\
  \ `ref`：创建一个通过引用传递参数的函数。\n- `const`：创建一个通过常量传递参数的函数。\n\n### 如何使用 Boost.Phoenix 表达式示例\n\
  \n```cpp\n#include <boost/phoenix/phi.hpp>\n#include <iostream>\n#include <functional>\n\
  \nusing namespace boost::phoenix;\n\nint add(int a, int b) {\n  return a + b;\n\
  }\n\nint main() {\n  // 使用占位符和运算符\n  auto func = _1 + _2; \n  std::cout << func(5,\
  \ 3) << std::endl; // 输出: 8\n\n  // 使用 bind\n  auto bound_func = bind(add, _1, _2);\n\
  \  std::cout << bound_func(10, 20) << std::endl; // 输出: 30\n\n  // 使用 lambda\n \
  \ auto lambda_func = []((int x) { return x * 2; });\n  std::cout << lambda_func(5)\
  \ << std::endl; // 输出: 10\n\n  // 使用 ref\n  int x = 10;\n  auto ref_func = bind(add,\
  \ ref(x), _1);\n  std::cout << ref_func(5) << std::endl; // 输出: 15\n}\n```\n\n\n\
  \n\n`arg1` 是调用 Phoenix 函数时传递的数值的占位符。由于这里只使用了 `arg1`，因此创建了一个一元函数。Boost.Phoenix 提供了额外的占位符，例如\
  \ `boost::phoenix::placeholders::arg2` 和 `boost::phoenix::placeholders::arg3`。Phoenix\
  \ 函数期望的参数数量始终与编号最大的占位符一致。\n\n示例 39.1, “作为全局函数、lambda 函数和 Phoenix 函数的谓词` 向标准输出输出了三次\
  \ `3`。\n\n示例 39.2, “Phoenix 函数对比 lambda 函数` 强调了 Phoenix 和 lambda 函数之间的关键区别。除了不需要带有参数列表的函数头外，Phoenix\
  \ 函数的参数没有类型。lambda 函数 `lambda` 期望一个 `int` 类型的参数，而 Phoenix 函数 `phoenix` 将接受取模运算符可以处理的任何类型。\n\
  \n将 Phoenix 函数视为函数模板。就像函数模板一样，Phoenix 函数可以接受任何类型。这使得在 示例 39.2, “Phoenix 函数对比 lambda\
  \ 函数` 中可以使用 `phoenix` 作为容器 `v` 和 `v2` 的谓词，尽管它们存储的是不同类型的数字。如果你尝试在 `v2` 上使用谓词 `lambda`，你将得到编译器错误。\n\
  \n示例 39.2. Phoenix 函数对比 lambda 函数\n\n```\n#include <boost/phoenix/phoenix.hpp>\n\
  #include <vector>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n\
  \  std::vector<int> v{1, 2, 3, 4, 5};\n\n  auto lambda = [](int i){ return i % 2\
  \ == 1; };\n  std::cout << std::count_if(v.begin(), v.end(), lambda) << '\\n';\n\
  \n  std::vector<long> v2;\n  v2.insert(v2.begin(), v.begin(), v.end());\n\n  using\
  \ namespace boost::phoenix::placeholders;\n  auto phoenix = arg1 % 2 == 1;\n  std::cout\
  \ << std::count_if(v.begin(), v.end(), phoenix) << '\\n';\n  std::cout << std::count_if(v2.begin(),\
  \ v2.end(), phoenix) << '\\n';\n}\n```\n\n示例 39.3, “作为延迟 C++ 代码的 Phoenix 函数` 使用\
  \ Phoenix 函数作为 `std::count_if()` 的谓词，用于统计大于 2 的奇数。Phoenix 函数访问了 `arg1` 次：一次用于测试占位符是否大于\
  \ 2，另一次测试它是否为奇数。这些条件通过 `&&` 连接。\n\n示例 39.3. 作为延迟 C++ 代码的 Phoenix 函数\n\n```cpp\n\
  #include <boost/phoenix/phoenix.hpp>\n#include <vector>\n#include <algorithm>\n\
  #include <iostream>\n\nint main()\n{\n  std::vector<int> v{1, 2, 3, 4, 5};\n\n \
  \ using namespace boost::phoenix::placeholders;\n  auto phoenix = arg1 > 2 && arg1\
  \ % 2 == 1;\n  std::cout << std::count_if(v.begin(), v.end(), phoenix) << '\\n';\n\
  }\n```\n\n你可以将 Phoenix 函数视为不会立即执行的 C++ 代码。示例 39.3, “作为延迟 C++ 代码的 Phoenix 函数` 中的\
  \ Phoenix 函数看起来像是一个使用了多个逻辑和算术运算符的条件。然而，该条件并没有立即执行。它只有在从 `std::count_if()` 内部被访问时才会执行。`std::count_if()`\
  \ 中的访问是一个普通的函数调用。\n\n示例 39.3, “作为延迟 C++ 代码的 Phoenix 函数` 向标准输出输出了 `2`。\n\n示例 39.4.\
  \ 显式 Phoenix 类型\n\n```cpp\n#include <boost/phoenix/phoenix.hpp>\n#include <vector>\n\
  #include <algorithm>\n#include <iostream>\n\nint main()\n{\n  std::vector<int> v{1,\
  \ 2, 3, 4, 5};\n\n  using namespace boost::phoenix;\n  using namespace boost::phoenix::placeholders;\n\
  \  auto phoenix = arg1 > val(2) && arg1 % val(2) == val(1);\n  std::cout << std::count_if(v.begin(),\
  \ v.end(), phoenix) << '\\n';\n}\n```\n\n示例 39.4, “显式 Phoenix 类型` 使用 `boost::phoenix::placeholders::arg1`\
  \ 和 `boost::phoenix::val()` 创建了一个函数。Phoenix 函数访问了 `arg1` 二次：一次用于测试占位符是否大于 2，另一次测试它是否为奇数。这些条件通过\
  \ `&&` 连接。\n\n示例 39.5, “显式 Phoenix 类型` 展示了如何使用 `boost::phoenix::val()` 来指定参数类型。\n\
  \n示例 39.6, “创建自己的函数` 演示了如何定义自定义函数对象并将其 `boost::phoenix::function` 使用。\n\n```cpp\n\
  #include <boost/phoenix/phoenix.hpp>\n#include <vector>\n#include <algorithm>\n\
  #include <iostream>\n\nstruct is_odd_impl\n{\n    typedef bool result_type;\n\n\
  \    template <typename T>\n    bool operator()(T t) const { return t % 2 == 1;\
  \ }\n};\n\nboost::phoenix::function<is_odd_impl> is_odd;\n\nint main()\n{\n  std::vector<int>\
  \ v{1, 2, 3, 4, 5};\n\n  using namespace boost::phoenix::placeholders;\n  std::cout\
  \ << std::count_if(v.begin(), v.end(), is_odd(arg1)) << '\\n';\n}\n```\n\n\n\n\n\
  你使用宏 `BOOST_PHOENIX_ADAPT_FUNCTION` 将一个独立函数转换为 Phoenix 函数。向该宏传递返回值的类型、要定义的 Phoenix\
  \ 函数名称、独立函数的名称以及参数的个数。\n\n### 示例 39.7. 将独立函数转换为 Phoenix 函数\n\n```cpp\n#include <boost/phoenix/phoenix.hpp>\n\
  #include <vector>\n#include <algorithm>\n#include <iostream>\n\nbool is_odd_function(int\
  \ i) { return i % 2 == 1; }\n\nBOOST_PHOENIX_ADAPT_FUNCTION(bool, is_odd, is_odd_function,\
  \ 1)\n\nint main()\n{\n  std::vector<int> v{1, 2, 3, 4, 5};\n\n  using namespace\
  \ boost::phoenix::placeholders;\n  std::cout << std::count_if(v.begin(), v.end(),\
  \ is_odd(arg1)) << '\\n';\n}\n```\n\n要将独立函数作为 Phoenix 函数使用，你也可以像 示例 39.8, “使用 `boost::phoenix::bind()`\
  \ 的 Phoenix 函数`\") 那样使用 `boost::phoenix::bind()`。其工作方式与 `std::bind()` 类似。独立函数的名称作为第一个参数传递。所有后续参数都会转发给该独立函数。\n\
  \n### 示例 39.8. 使用 `boost::phoenix::bind()` 的 Phoenix 函数\n\n```cpp\n#include <boost/phoenix/phoenix.hpp>\n\
  #include <vector>\n#include <algorithm>\n#include <iostream>\n\nbool is_odd(int\
  \ i) { return i % 2 == 1; }\n\nint main()\n{\n  std::vector<int> v{1, 2, 3, 4, 5};\n\
  \n  using namespace boost::phoenix;\n  using namespace boost::phoenix::placeholders;\n\
  \  std::cout << std::count_if(v.begin(), v.end(), bind(is_odd, arg1)) << '\\n';\n\
  }\n```\n\n### 提示\n避免使用 `boost::phoenix::bind()`。创建你自己的 Phoenix 函数。这会让代码更具可读性。特别是在处理复杂表达式时，处理\
  \ `boost::phoenix::bind()` 的额外细节将没有任何帮助。\n\n### 示例 39.9. 任意复杂的 Phoenix 函数\n\n```cpp\n\
  #include <boost/phoenix/phoenix.hpp>\n#include <vector>\n#include <algorithm>\n\
  #include <iostream>\n\nint main()\n{\n  std::vector<int> v{1, 2, 3, 4, 5};\n\n \
  \ using namespace boost::phoenix;\n  using namespace boost::phoenix::placeholders;\n\
  \  int count = 0;\n  std::for_each(v.begin(), v.end(), if_(arg1 > 2 && arg1 % 2\
  \ == 1)\n    [\n      ++ref(count)\n    ]);\n  std::cout << count << '\\n';\n}\n\
  ```\n\nBoost.Phoenix 提供了一些用于模拟 C++ 关键字的函数对象。例如，你可以使用函数 `boost::phoenix::if_()`（参见示例\
  \ 39.9, “任意复杂的 Phoenix 函数`）来创建一个像 `if` 一样测试条件的函数对象。如果条件为真，则将执行通过 `operator[]` 传递给函数对象的代码。当然，那些代码也必须基于函数对象。这样，你就可以创建复杂的\
  \ Phoenix 函数。\n\n示例 39.9, “任意复杂的 Phoenix 函数` 为每个大于 2 的奇数增加 `count` 的值。为了在 `count`\
  \ 上使用自增运算符，使用 `boost::phoenix::ref()` 将 `count` 封装在函数对象中。与 `boost::phoenix::val()`\
  \ 不同，没有值被拷贝到函数对象中。`boost::phoenix::ref()` 返回的函数对象存储了一个引用——在此处是对 `count` 的引用。\n\n\
  ### 提示\n不要使用 Boost.Phoenix 创建复杂函数。使用 C++11 的 lambda 函数会更好。虽然 Boost.Phoenix 的语法接近\
  \ C++，但使用像 `if_` 关键字或方括号之间的代码块并不一定能提高可读性。\n\n# 40. Boost.Function\n\n[Boost.Function](http://www.boost.org/libs/function)\
  \ 提供名为 `boost::function` 的类来封装函数指针。它定义在 `boost/function.hpp` 中。\n\n如果你在支持 C++11\
  \ 的开发环境中工作，你可以访问头文件 `functional` 中的 `std::function` 类。在这种情况下，你可以忽略 Boost.Function，因为\
  \ `boost::function` 和 `std::function` 是等价的。\n\n### 示例 40.1. 使用 `boost::function`\n\
  \n```cpp\n#include <boost/function.hpp>\n#include <iostream>\n#include <cstdlib>\n\
  #include <cstring>\n\nint main()\n{\n  boost::function<int(const char*)> f = atoi;\n\
  \  std::cout << f(\"42\") << '\\n';\n  f = nullptr;\n  if (f.empty())\n  {\n   \
  \ std::cout << \"Function is empty\\n\";\n  }\n}\n```\n\n\n\n```cpp\n#include <vector>\n\
  #include <algorithm>\n#include <iostream>\n\nvoid print(int i)\n{\n  std::cout <<\
  \ i << '\\n';\n}\n\nint main()\n{\n  std::vector<int> v{1, 3, 2};\n  std::for_each(v.begin(),\
  \ v.end(), print);\n}\n```\n\n`std::for_each()` 的第三个参数是一个接受单个参数的函数或函数对象。在示例 41.1，“使用兼容函数的\
  \ `std::for_each()`” with a compatible function\") 中，`std::for_each()` 将容器 `v` 中的数字作为单个参数一个接一个传递给\
  \ `print()`。\n\n如果你需要传递一个签名不符合算法要求的函数，情况就会变得更加复杂。例如，如果你想让 `print()` 接受一个输出流作为额外参数，那么你不能再原样地在\
  \ `std::for_each()` 中它了。\n\n就像 示例 41.1，“使用兼容函数的 `std::for_each()`” with a compatible\
  \ function\") 一样，示例 41.2，“使用 `std::bind1st()` 的 `std::for_each()`” with std::bind1st())]\
  \ 将 `v` 中的所有数字写入标准输出。然而，这次输出流是作为参数传递给 `print()` 的。为了实现这一点，函数 `print()` 被定义为派自 `std::binary_function`\
  \ 的函数对象。\n\n### 示例 41.2. 使用 `std::bind1st()` 的 `std::for_each()`\n\n```cpp\n#include\
  \ <vector>\n#include <algorithm>\n#include <functional>\n#include <iostream>\n\n\
  class print : public std::binary_function<std::ostream*, int, void>\n{\npublic:\n\
  \  void operator()(std::ostream *os, int i) const\n  {\n    *os << i << '\\n';\n\
  \  }\n};\n\nint main()\n{\n  std::vector<int> v{1, 3, 2};\n  std::for_each(v.begin(),\
  \ v.end(), std::bind1st(print{}, &std::cout));\n}\n```\n\n使用 Boost.Bind，你不需要将 `print()`\
  \ 从函数转换为函数对象。相反，你使用的是定义在 `boost/bind.hpp` 中的函数模板 `boost::bind()`。\n\n示例 41.3，“使用\
  \ `boost::bind()` 的 `std::for_each()`” with boost::bind()\") 使用 `print()` 作为函数，而不是作为函数对象。由于\
  \ `print()` 期望两个参数，因此该函数无法直接传递给 `std::for_each()`。相反，将 `boost::bind()` 传递给 `std::for_each()`，并将\
  \ `print()` 作为第一个参数传递给 `boost::bind()`。\n\n由于 `print()` 期望两个参数，那么这两个参数也必须传递给 `boost::bind()`。它们是指向\
  \ `std::cout` 的指针和 `_1`。\n\n`_1` 是一个占位符。Boost.Bind 定义了从 `_1` 到 `_9` 的占位符。这些占位符告诉\
  \ `boost::bind()` 返回一个函数对象，其期望的参数数量等于最大的占位符数量。如果如示例 41.3，“使用 `boost::bind()` 的 `std::for_each()`”\
  \ with boost::bind()) 所示，只使用了占位符 `_1`，`boost::bind()` 返回一个元函数对象——一个接受单个参数的函数对象。在这种情况下这是必要的，因为\
  \ `std::for_each()` 只传递了一个参数。\n\n### 示例 41.3. 使用 `boost::bind()` 的 `std::for_each()`\n\
  \n```cpp\n#include <boost/bind.hpp>\n#include <vector>\n#include <algorithm>\n#include\
  \ <iostream>\n\nvoid print(std::ostream *os, int i)\n{\n  *os << i << '\\n';\n}\n\
  \nint main()\n{\n  std::vector<int> v{1, 3, 2};\n  std::for_each(v.begin(), v.end(),\
  \ boost::bind(print, &std::cout, _1));\n}\n```\n\n`std::for_each()` 调用一个一元函数对象。传递给函数对象的值——来自容器\
  \ `v` 的数字——占据了占位符 `_1` 的位置。`boost::bind()` 获取该数字和指向 `std::cout` 的指针并将它们转发给 `print()`。\n\
  \n请注意，`boost::bind()` 与 `std::bind1st()` 和 `std::bind2nd()` 一样，按值传递参数。为了防止调用程序尝试拷贝\
  \ `std::cout`，`print()` 期望一个指向 `std::cout` 的指针。\n\n示例 41.1，“使用兼容函数的 `std::for_each()`”\
  \ with a compatible function\")\n\n示例 41.2，“使用 `std::bind1st()` 的 `std::for_each()`”\
  \ with std::bind1st()\")\n\n\n\n在 C++11 之前，你需要使用诸如 [Boost.Lambda](http://www.boost.org/libs/lambda)\
  \ 的库来利用 lambda 函数。自 C++11 起，该库可以被视为过时，因为 lambda 函数现在已经是编程语言的一部分。如果你在一个不支持 C++11\
  \ 的开发环境中工作，在转向 `Boost.Lambda` 之前，你应该考虑 `Boost.Phoenix`。`Boost.Phoenix` 是一个较新的库，如果你需要在没有\
  \ C++11 的情况下使用 lambda 函数，它可能是更好的选择。\n\nlambda 函数的目的是让代码更加紧凑且易于理解（参见 示例 43.1, “使用\
  \ lambda 函数的 `std::for_each()`” with a lambda function\")）。\n\n## 示例 43.1. 使用 lambda\
  \ 函数的 `std::for_each()`\n\n```\n#include <boost/lambda/lambda.hpp>\n#include <vector>\n\
  #include <algorithm>\n#include <iostream>\n\nint main()\n{\n  std::vector<int> v{1,\
  \ 3, 2};\n  std::for_each(v.begin(), v.end(),\n    std::cout << boost::lambda::_1\
  \ << \"\\n\");\n}\n```\n\n`Boost.Lambda` 提供了几个辅助工具来创建匿名函数。代码写在它应该执行的地方，不需要封装在函数中，也不需要显式调用函数。在\
  \ 示例 43.1, “使用 lambda 函数的 `std::for_each()`” with a lambda function\") 中，`std::cout\
  \ << boost::lambda::_1 << \"\\n\"` 是一个期望一个参数的 lambda 函数，它将参数以及换行符写入标准输出。\n\n`boost::lambda::_1`\
  \ 是一个占位符，创建一个期望一个参数的 lambda 函数。占位符中的数字决定了预期参数的数量，因此 `boost::lambda::_2` 期望两个参数，而\
  \ `boost::lambda::_3` 期望三个参数。`Boost.Lambda` 只提供了这三个占位符。示例 43.1, “使用 lambda 函数的 `std::for_each()`”\
  \ with a lambda function\") 中的 lambda 函数使用 `boost::lambda::_1`，因为 `std::for_each()`\
  \ 期望一个元函数。\n\n包含 `boost/lambda/lambda.hpp` 以使用占位符。\n\n请注意，示例 43.1, “使用 lambda 函数的\
  \ `std::for_each()`” with a lambda function\") 中使用了 `\\n` 而不是 `std::endl` 来输出换行。如果你使用\
  \ `std::endl`，示例将无法编译，因为 lambda 函数 `std::cout << boost::lambda::_1` 的类型与一元函数模板 `std::endl()`\
  \ 期望的类型不同。因此，你不能使用 `std::endl`。\n\n## 示例 43.2. 使用 `boost::lambda::if_then()` 的 lambda\
  \ 函数\n\n```\n#include <boost/lambda/lambda.hpp>\n#include <boost/lambda/if.hpp>\n\
  #include <vector>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n\
  \  std::vector<int> v{1, 3, 2};\n  std::for_each(v.begin(), v.end(),\n    boost::lambda::if_then(boost::lambda::_1\
  \ > 1,\n    std::cout << boost::lambda::_1 << \"\\n\"));\n}\n```\n\n头文件 `boost/lambda/if.hpp`\
  \ 定义了你可以用于在 lambda 函数中创建 `if` 控制结构的结构。最简单的结构是函数模板 `boost::lambda::if_then()`，它期望两个参数：第一个参数是条件。如果条件为真，则执行第二个参数。两个参数都可以是\
  \ lambda 函数，如 示例 43.2, “使用 `boost::lambda::if_then()` 的 lambda 函数”\") 所示。\n\n除了\
  \ `boost::lambda::if_then()` 之外，`Boost.Lambda` 还提供了函数模板 `boost::lambda::if_then_else()`\
  \ 和 `boost::lambda::if_then_else_return()`，它们都期望三个参数。此外还提供了用于在 lambda 函数中使用 `for`\
  \ 循环、转换运算符以及抛出异常的函数模板。`Boost.Lambda` 定义的许多函数模板使得定义在任何方面都不低于普通 C++ 函数的 lambda 函数成为可能。\n\
  \n# 第 X 部分. 并行编程\n\n以下库支持并行编程模型。\n\n*   `Boost.Thread` 允许你创建和管理自己的线程。\n*   `Boost.Atomic`\
  \ 允许你从多个线程通过原子操作访问整数类型的变量。\n*   `Boost.Lockfree` 提供了线程安全的容器。\n*   `Boost.MPI` 源于超级计算机领域。通过\
  \ `Boost.MPI`，你的程序会被启动多次并在多个进程中执行。你专注于编写应该并发执行的实际任务，而 `Boost.MPI` 负责协调。\n\n### Boost.Thread\n\
  \n[Boost.Thread](https://www.boost.org/libs/thread) 是允许你使用线程的库。标准库自 C11 起就支持线程。\n\
  \n## 创建和管理线程\n\n该库中最重要的类是 `boost::thread`，它定义在 `boost/thread.hpp` 中。示例 44.1, “使用\
  \ `boost::thread()` 是一个创建线程的简单示例。\n\n新线程应该执行的函数名称被传递给 `boost::thread` 的构造函数。一旦创建，该函数就会在自己的线程中开始执行。此时，它会与\
  \ `main()` 函数并发执行。\n\n为了防止程序终止，在新创建的线程上调用了 `join()`。`join()` 会阻塞当前线程，直到调用 `join()`\
  \ 的线程结束为止。这导致 `main()` 等待直到线程返回。\n\n### 示例 44.1. 使用 `boost::thread`\n\n```\n#include\
  \ <boost/thread.hpp>\n#include <boost/chrono.hpp>\n#include <iostream>\n\nvoid wait(int\
  \ seconds)\n{\n  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n\
  }\n\nvoid thread()\n{\n  for (int i = 0; i < 5; ++i)\n  {\n    wait(1);\n    std::cout\
  \ << i << '\\n';\n  }\n}\n\nint main()\n{\n  boost::thread t{thread};\n  t.join();\n\
  }\n```\n\n可以使用变量（此示例中的 `t`）访问特定线程以等待其终止。然而，即使 `t` 离开作用域并被销毁，线程仍继续执行。线程最初总是绑定到 `boost::thread`\
  \ 类型的变量上的，但一旦创建，线程不再依赖于该变量。有一个名为 `detach()` 的成员函数，允许 `boost::thread` 类型的变量与其对应的线程分离。在调用\
  \ `detach()` 之后无法调用 `join()` 等成员函数，因为分离的变量不再代表有效的线程。\n\n\n\n\n任何在函数内部可以执行的操作也可以在线程内部执行。归结底，线程与函数没有区别，只是它是与另一个函数并发执行的。在示例\
  \ 44.1，“使用 `boost::thread`” 中，通过循环向标准输出流写入了五个数字。为了减慢输出速度，循环的每次迭代都会调用 `wait()` 函数暂停一秒。`wait()`\
  \ 使用了 `sleep_for()` 函数，该函数由 Boost.Thread 提供并存在 `boost::this_thread` 命名空间中。\n\n`sleep_for()`\
  \ 期望唯一的参数是一个时间段，表示当前线程应该暂停多久。通过传递一个类型为 `boost::chrono::seconds` 的对象可以设置这段时间。`boost::chrono::seconds`\
  \ 来自于 Boost.Chrono，该库在第 37 章，*Boost.Chrono* 中引入。\n\n`sleep_for()` 只接受来自 Boost.Chrono\
  \ 的类型。尽管 Boost.Chrono 自 C++11 起已标准库的一部分，但 `std::chrono` 中的类型不能与 Boost.Thread 使用。这样做会导致编译器错误。\n\
  \n如果你不想在 `main()` 结束时调用 `join()`，可以使用 `boost::scoped_thread` 类。`boost::scoped_thread`\
  \ 的构造函数期望一个类型为 `boost::thread` 的对象。在 `boost::scoped_thread` 的析构函数中，操作可以访问该对象。默认情况下，`boost::scoped_thread`\
  \ 使用一个对线程调用 `join()` 的操作。因此，示例 44.2，“使用 `boost::scoped_thread` 等待线程” 的工作类似于示例 44.1，“使用\
  \ `boost::thread`”。\n\n### Example 44.2. Waiting for a thread with `boost::scoped_thread`\n\
  \n```cpp\n#include <boost/thread.hpp>\n#include <boost/thread/scoped_thread.hpp>\n\
  #include <boost/chrono.hpp>\n#include <iostream>\n\nvoid wait(int seconds)\n{\n\
  \  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n}\n\nvoid thread()\n\
  {\n  for (int i = 0; i < 5; ++i)\n  {\n    wait(1);\n    std::cout << i << '\\n';\n\
  \  }\n}\n\nint main()\n{\n  boost::scoped_thread<> t{boost::thread{thread}};\n}\n\
  ```\n\n你可以将用户自定义的操作作为模板参数。该操作必须是一个带有 `operator()` 的类，且该操作符接受一个类型为 `boost::thread`\
  \ 的对象。`boost::scoped_thread` 保证该操作符会在析构函数中被调用。\n\n你只能在 Boost.Thread 中找到 `boost::scoped_thread`\
  \ 类。标准库中没有对应的项。确保为 `boost::scoped_thread` 包含了头文件 `boost/thread/scoped_thread.hpp`。\n\
  \n示例 44.3，“带有 `boost::this_thread::sleep_for()` 的中断点”\") 引入了中断点，这使得中断线程成为可能。中断点仅由\
  \ Boost.Thread 支持，标准库并不支持。\n\n在线程对象上调用 `interrupt()` 会中断相应的线程。在这种背景下，中断意味着在线程中抛出一个类型为\
  \ `boost::thread_interrupted` 的异常。然而，这只会在线程到达中断点时才会发生。\n\n### Example 44.3. An interruption\
  \ point with `boost::this_thread::sleep_for()`\n\n```cpp\n#include <boost/thread.hpp>\n\
  #include <boost/chrono.hpp>\n#include <iostream>\n\nvoid wait(int seconds)\n{\n\
  \  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n}\n\nvoid thread()\n\
  {\n  try\n  {\n    for (int i = 0; i < 5; ++i)\n    {\n      wait(1);\n      std::cout\
  \ << i << '\\n';\n    }\n  }\n  catch (boost::thread_interrupted&) {}\n}\n\nint\
  \ main()\n{\n  boost::thread t{thread};\n  wait(3);\n  t.interrupt();\n  t.join();\n\
  }\n```\n\n如果给定的线程不包含中断点，简单调用 `interrupt()` 将没有任何影响。每当线程到达中断点时，它都会检查 `interrupt()`\
  \ 是否已被调用。如果已被调用，则会抛出一个类型为 `boost::thread_interrupted` 的异常。\n\nBoost.Thread 定义了诸如\
  \ `sleep_for()` 等中断点。示例 44.3，“带有 `boost::this_thread::sleep_for()` 的中断点`\") 中断点使得中断线程成为可能。中断点仅由\
  \ Boost.Thread 支持，标准库并不支持。\n\n\n\n\n```cpp\n#include <boost/thread.hpp>\n#include\
  \ <iostream>\n\nint main()\n{\n  std::cout << boost::this_thread::get_id() << '\\\
  n';\n  std::cout << boost::thread::hardware_concurrency() << '\\n';\n}\n```\n\n\
  在 `boost::this_thread` 命名空间中，定义了一些适用于当前线程的非成员函数。其中一个函数是 `sleep_for()`，我们之前见过它。另一个函数是\
  \ `get_id()`，它返回一个数字来唯一地标识当前线程（参见 示例 44.6, “检测线程 ID 和可用处理器数量”）。`get_id()` 也作为 `boost::thread`\
  \ 类的成员函数提供提供。\n\n静态成员函数 `boost::thread::hardware_concurrency()` 根据底层的 CPU 或 CPU\
  \ 核心数，返回可以同时物理执行的线程数。在双核处理器上调用此函数将返回值 2。该函数提供了一种简单的方法来识别应该使用的理论最大线程数。\n\nBoost.Thread\
  \ 还提供了 `boost::thread_group` 类来管理线程组。该类提供的一个函数是成员函数 `join_all()`，它会等待组中的所有线程终止。\n\
  \n## 线程同步\n\n虽然使用多个线程可以提高应用程序的性能，但它通常也会增加复杂性。如果几个函数同时执行，必须对共享资源的访问进行同步。一旦应用程序达到一定规模，这就会涉及大量的编程工作。本节介绍了\
  \ Boost.Thread 提供的用于同步线程的类。\n\n### 示例 44.7. 使用 `boost::mutex` 进行互斥访问\n\n```cpp\n\
  #include <boost/thread.hpp>\n#include <boost/chrono.hpp>\n#include <iostream>\n\n\
  void wait(int seconds)\n{\n  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n\
  }\n\nboost::mutex mutex;\n\nvoid thread()\n{\n  using boost::this_thread::get_id;\n\
  \  for (int i = 0; i < 5; ++i)\n  {\n    wait(1);\n    mutex.lock();\n    std::cout\
  \ << \"Thread \" << get_id() << \": \" << i << std::endl;\n    mutex.unlock();\n\
  \  }\n}\n\nint main()\n{\n  boost::thread t1{thread};\n  boost::thread t2{thread};\n\
  \  t1.join();\n  t2.join();\n}\n```\n\n多线程程序使用互斥锁（mutex）进行同步。Boost.Thread 提供了不同的互斥锁类，其中\
  \ `boost::mutex` 是简单的。互斥锁的基本原理是在特定线程拥有互斥锁时防止其他线程获取所有权。一旦释放，另一个线程就可以获取所有权。这导致线程等待，直到拥有互斥锁的线程完成处理并释放对互斥锁的所有权。\n\
  \n示例 44.7, “使用 `boost::mutex` 进行互斥访问 使用了类型为 `boost::mutex` 的全局互斥锁 `mutex`。`thread()`\
  \ 函数通过调用 `lock()` 获取该对象的所有权。这发生在函数向标准输出流写入消息之前。一旦写入消息，就会通过调用 `unlock()` 释放所有权。\n\
  \n`main()` 创建两个线程，它们都在执行 `thread()` 函数。每个线程在 `for` 循环的每次迭代中计数到五，并向标准输出流写入消息。由于 `std::cout`\
  \ 是线程共享的全局对象，必须对访问进行同步。否则，消息可能会混乱。同步保证了在任何时刻，只有一个线程可以访问 `std::cout`。互斥锁保证了在范围内只有一个线程进入临界区。\n\
  \n### 示例 44.8. `boost::lock_guard` 保证释放\n\n```cpp\n#include <boost/thread.hpp>\n\
  #include <boost/chrono.hpp>\n#include <iostream>\n\nvoid wait(int seconds)\n{\n\
  \  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n}\n\nboost::mutex\
  \ mutex;\n\nvoid thread()\n{\n  using boost::this_thread::get_id;\n  for (int i\
  \ = 0; i < 5; ++i)\n  {\n    wait(1);\n    boost::lock_guard<boost::mutex> lock(mutex);\n\
  \    std::cout << \"Thread \" << get_id() << \": \" << i << std::endl;\n  }\n}\n\
  \nint main()\n{\n  boost::thread t1{thread};\n  boost::thread t2{thread};\n  t1.join();\n\
  \  t2.join();\n}\n```\n\n获取和释放互斥锁是一种典型的模式，Boost.Thread 支持不同的类型。例如，与其手动调用 `lock()`\
  \ 和 `unlock()`，可以使用 `boost::lock_guard`。`boost::lock_guard` 在构造函数中获取互斥锁，并在析构函数中自动释放。示例\
  \ 44.8, “`boost::lock_guard` 保证释放 这样做确保了资源在不再需要时被释放。`boost::lock_guard` 是 RAII 模式的一个示例，即使发生异常也能确保锁释放。\n\
  \n除了 `boost::mutex`，Boost.Thread 还提供了额外的类来支持同步。其中非常有用的类之一是 `boost::unique_lock`。示例\
  \ 44.9, “灵活的 `boost::unique_lock` 使用了 `thread()` 函数的变体。`thread1()` 将 `mutex` 传递给\
  \ `unique_lock` 的构造函数，这使得 `unique_lock` 尝试获取互斥锁。在这种情况下，`unique_lock` 的行为与 `lock_guard`\
  \ 不同。`unique_lock` 的构造函数调用 `lock()`。\n\n然而，`unique_lock` 的析构函数在 `thread1()` 中并不释放互斥锁。在\
  \ `thread1()` 中调用了 `release()`，将锁解耦。默认情况下，`unique_lock` 的析构函数会释放互斥锁，就像 `lock_guard`\
  \ 一样——但如果已经解耦则不会。这就是为什么在 `thread1()` 中显式调用了 `unlock()`。\n\n`thread2()` 将 `mutex`\
  \ 和 `boost::try_to_lock` 传递给 `unique_lock` 的构造函数。这使得 `unique_lock` 的构造函数不调用 `lock()`\
  \ 而是调用 `try_lock()`。因此，构造函数只尝试锁定互斥锁。如果互斥锁被另一个线程占用，尝试将失败。\n\n`owns_lock()` 允许检测 `unique_lock`\
  \ 是否成功锁定了互斥锁。如果 `owns_lock()` 返回 `true`，`thread2()` 可以立即访问 `std::cout`。如果 `owns_lock()`\
  \ 返回 `false`，则会调用 `try_lock_for()`。该成员函数也尝试锁定互斥锁，但它会在指定的时间内等待。在 示例 44.9, “灵活的 `boost::unique_lock`\
  \ 中，锁尝试获取一秒的互斥锁。如果 `try_lock_for()` 返回 `true`，则可以访问 `std::cout`。否则，`thread2()` 将放弃并跳过一个数字。\n\
  \n\n\n\n\n请注意，在示例 44.9, “万能锁 `boost::unique_lock` 中，`mutex` 的类型是 `boost::timed_mutex`，而不是\
  \ `boost::mutex`。示例使用了 `boost::timed_mutex` 是因为该互斥锁是唯一提供成员函数 `try_lock_for()` 的类型。当在锁上调用\
  \ `try_lock_for()` 时，就会调用该成员函数。`boost::mutex` 只提供了成员函数 `lock()` 和 `try_lock()`。\n\
  \n`boost::unique_lock` 是一个互斥锁。互斥锁始终是 `mutex` 的唯一所有者。只有在互斥锁释放它之后，另一个锁才能获得 `mutex`\
  \ 的控制权。Boost.Thread 还通过 `boost::shared_lock` 类支持共享锁，该类配合 `shared_mutex` 使用。\n\n\
  ### 示例 44.9. 万能锁 `boost::unique_lock`\n\n```cpp\n#include <boost/thread.hpp>\n#include\
  \ <boost/chrono.hpp>\n#include <iostream>\n\nvoid wait(int seconds)\n{\n  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n\
  }\n\nboost::timed_mutex mutex;\n\nvoid thread1()\n{\n  using boost::this_thread::get_id;\n\
  \  for (int i = 0; i < 5; ++i)\n  {\n    wait(1);\n    boost::unique_lock<boost::timed_mutex>\
  \ lock{mutex};\n    std::cout << \"Thread \" << get_id() << \": \" << i << std::endl;\n\
  \    boost::timed_mutex *m = lock.release();\n    m->unlock();\n  }\n}\n\nvoid thread2()\n\
  {\n  using boost::this_thread::get_id;\n  for (int i = 0; i < 5; ++i)\n  {\n   \
  \ wait(1);\n    boost::unique_lock<boost::timed_mutex> lock{mutex,\n      boost::try_to_lock};\n\
  \    if (lock.owns_lock() || lock.try_lock_for(boost::chrono::seconds{1}))\n   \
  \ {\n      std::cout << \"Thread \" << get_id() << \": \" << i << std::endl;\n \
  \   }\n  }\n}\n\nint main()\n{\n  boost::thread t1{thread1};\n  boost::thread t2{thread2};\n\
  \  t1.join();\n  t2.join();\n}\n```\n\n### 示例 44.10. 使用 `boost::shared_lock` 的共享锁\n\
  \n```cpp\n#include <boost/thread.hpp>\n#include <boost/chrono.hpp>\n#include <iostream>\n\
  #include <vector>\n#include <cstdlib>\n#include <ctime>\n\nvoid wait(int seconds)\n\
  {\n  boost::this_thread::sleep_for(boost::chrono::seconds{seconds});\n}\n\nboost::shared_mutex\
  \ mutex;\nstd::vector<int> random_numbers;\n\nvoid fill()\n{\n  std::srand(static_cast<unsigned\
  \ int>(std::time(0)));\n  for (int i = 0; i < 3; ++i)\n  {\n    boost::unique_lock<boost::shared_mutex>\
  \ lock{mutex};\n    random_numbers.push_back(std::rand());\n    lock.unlock();\n\
  \    wait(1);\n  }\n}\n\nvoid print()\n{\n  for (int i = 0; i < 3; ++i)\n  {\n \
  \   wait(1);\n    boost::shared_lock<boost::shared_mutex> lock{mutex};\n    std::cout\
  \ << random_numbers.back() << '\\n';\n  }\n}\n\nint sum = 0;\n\nvoid count()\n{\n\
  \  for (int i = 0; i < 3; ++i)\n  {\n    wait(1);\n    boost::shared_lock<boost::shared_mutex>\
  \ lock{mutex};\n    sum += random_numbers.back();\n  }\n}\n\nint main()\n{\n  boost::thread\
  \ t1{fill}, t2{print}, t3{count};\n  t1.join();\n  t2.join();\n  t3.join();\n  std::cout\
  \ << \"Sum: \" << sum << '\\n';\n}\n```\n\n如果线程只需要对特定资源进行只读访问，可以使用类型为 `boost::shared_lock`\
  \ 的非互斥锁。修改资源的线程需要写访问权限，因此需要互斥锁。由于具有只读访问权限的线程不受其他同时读取同一资源的线程的影响，因此它们可以使用非互斥锁并共享一个\
  \ `mutex`。\n\n在示例 44.10, \"使用 `boost::shared_lock` 的共享锁 中，`print()` 和 `count()`\
  \ 都只读取变量 `random_numbers`。`print()` 函数将 `random_numbers` 中的最后一个值写入标准输出流，而 `count()`\
  \ 函数将其加到变量 `sum` 中。由于这两个函数都没有修改 `random_numbers`，因此它们都可以使用类型为 `boost::shared_lock`\
  \ 的非互斥锁同时访问它。\n\n\n\n\n\n示例 44.11, “使用 `boost::condition_variable_any` 的条件变量” 如果锁不是\
  \ `for` 循环中的局部变量，而是在外部作用范围内实例化的，同样有效。事实上，这样做更有意义，因为锁不需要在每次迭代中销毁并重建。由于互斥量通过 `wait()`\
  \ 释放，因此不需要在迭代结束时销毁锁。\n\n## 线程本地存储\n\n线程本地存储 (`TLS`) 是一个只能被一个线程访问的专用存储区域。`TLS` 变量可以被视为仅对特定线程可见而非整个程序可见的全局变量。\n\
  \n**示例 44.12. 使用静态变量同步多个线程**\n\n```cpp\n#include <boost/thread.hpp>\n#include <iostream>\n\
  \nboost::mutex mutex;\n\nvoid init()\n{\n  static bool done = false;\n  boost::lock_guard<boost::mutex>\
  \ lock{mutex};\n  if (!done)\n  {\n    done = true;\n    std::cout << \"done\" <<\
  \ '\\n';\n  }\n}\n\nvoid thread()\n{\n  init();\n  init();\n}\n\nint main()\n{\n\
  \  boost::thread t[3];\n\n  for (int i = 0; i < 3; ++i)\n    t[i] = boost::thread{thread};\n\
  \n  for (int i = 0; i < 3; ++i)\n    t[i].join();\n}\n```\n\n示例 44.12, “使用静态变量同步多个线程”\
  \ 在三个线程中执行函数 `thread()`。`thread()` 调用了另一个函数 `init()` 两次，而 `init()` 检查布尔变量 `done`\
  \ 是否为 `false`。如果是，则将该变量设置为 `true` 并将 `done` 写入标准输出。\n\n`done` 是一个所有线程共享的静态变量。如果第一个线程将\
  \ `done` 设置为 `true`，则第二个和第三个线程将不会将 `done` 写入标准输出。任何线程中的第二次调用 `init()` 也也不会将 `done`\
  \ 写入标准输出。该示例将打印一次 `done`。\n\n像 `done` 这样的静态变量可以用于在进程中一次性初始化。为了每个线程进行一次性初始化，可以使用\
  \ `TLS`。\n\n**示例 44.13. 使用 TLS 同步多个线程**\n\n```cpp\n#include <boost/thread.hpp>\n\
  #include <iostream>\n\nboost::mutex mutex;\n\nvoid init()\n{\n  static boost::thread_specific_ptr<bool>\
  \ tls;\n  if (!tls.get())\n  {\n    tls.reset(new bool{true});\n    boost::lock_guard<boost::mutex>\
  \ lock{mutex};\n    std::cout << \"done\" << '\\n';\n  }\n}\n\nvoid thread()\n{\n\
  \  init();\n  init();\n}\n\nint main()\n{\n  boost::thread t[3];\n\n  for (int i\
  \ = 0; i < 3; ++i)\n    t[i] = boost::thread{thread};\n\n  for (int i = 0; i < 3;\
  \ ++i)\n    t[i].join();\n}\n```\n\n在 示例 44.13, “使用 TLS 同步多个线程” 中，静态变量 `done` 被替换为\
  \ TLS 变量 `tls`，该变量基于类模板 `boost::thread_specific_ptr` —— 并使用 `bool` 类型实例化。原则上讲，`tls`\
  \ 的工作方式与 `done` 类似：它作为一个指示某些操作是否已经完成的条件。然而，关键区别在于，`tls` 存储的值仅对相应的线程可见并可用。\n\n一旦创建了\
  \ `boost::thread_specific_ptr` 变量，就可以对其进行设置。该变量期望一个 `bool` 类型变量的地址而不是变量本身。使用成员函数\
  \ `reset()`，可以将地址存储在 `tls` 中。在 示例 44.13, “使用 TLS 同步多个线程” 中，动态分配了一个 `bool` 类型变量，并将\
  \ `new` 返回的地址存储在 `tls` 中。为了避免每次调用 `init()` 时都设置 `tls`，使用了成员函数 `get()` 来检查是否已经存储了地址。\n\
  \n由于 `boost::thread_specific_ptr` 存储的是一个地址，因此该类的行为像一个指针。例如，它提供了成员函数 `operator*`\
  \ 和 `operator->`，它们的工作方式正如你预期指针的工作方式一样。\n\n示例 44.13, “使用 TLS 同步多个线程” 向标准输出打印了三次\
  \ `done`。每个线程在第一次调用 `init()` 时都会打印 `done`。由于使用了 TLS 变量，每个线程都使用自己的变量 `tls`。\n\n##\
  \ 未来 (Futures) 与承诺 (Promises)\n\nFuture 和 Promise 是从一个线程传递数据到另一个线程的工具。可以使用全局变量来实现，但\
  \ Future 和 Promise 不需要它们。\n\n**示例 44.14. 使用 `future` 和 `promise`**\n\n```cpp\n#define\
  \ BOOST_THREAD_PROVIDES_FUTURE\n#include <boost/thread.hpp>\n#include <boost/thread/future.hpp>\n\
  #include <functional>\n#include <iostream>\n\nvoid accumulate(boost::promise<int>\
  \ &p)\n{\n  int sum = 0;\n  for (int i = 0; i < 5; ++i)\n    sum += i;\n  p.set_value(sum);\n\
  }\n\nint main()\n{\n  boost::promise<int> p;\n  boost::future<int> f = p.get_future();\n\
  \  boost::thread t{std::ref(p)};\n  std::cout << f.get() << '\\n';\n}\n```\n\n示例\
  \ 44.14, “使用 `future` 和 `promise`` 显示了 `10`。\n\n`accumulate()` 经过调整以在线程中执行。它必须接受一个\
  \ `boost::promise` 类型的参数并将结果存储其中。future `f` 和 promise `p` 是关联的。当在 future 上调用 `get()`\
  \ 时，将返回通过 `set_value()` 存储在 promise 中的值。\n\n**示例 44.15. 使用 `boost::packaged_task`**\
  \ 了 `boost::packaged_task`，该类可以将从任何函数的值转发到未来，只要该函数通过 `return` 返回结果即可。\n\n\n\n\n\n\
  ```cpp\n#define BOOST_THREAD_PROVIDES_FUTURE\n#include <boost/thread.hpp>\n#include\
  \ <boost/thread/future.hpp>\n#include <utility>\n#include <iostream>\n\nint accumulate()\n\
  {\n  int sum = 0;\n  for (int i = 0; i < 5; ++i)\n    sum += i;\n  return sum;\n\
  }\n\nint main()\n{\n  boost::packaged_task<int> task{accumulate};\n  boost::future<int>\
  \ f = task.get_future();\n  boost::thread t{std::move(task)};\n  std::cout << f.get()\
  \ << '\\n';\n}\n```\n\n示例 44.15, “使用 `boost::packaged_task`” 与上一个示例，但这次没有使用 `boost::promise`。相反，这个示例使用了\
  \ `boost::packaged_task` 类，它和 `boost::promise` 一样，提供了一个返回 future 的成员函数 `get_future()`。\n\
  \n`boost::packaged_task` 的构造函数期望将一个将在线程中执行的函数作为参数，但 `boost::packaged_task` 本身不会启动线程。必须将类型为\
  \ `boost::packaged_task` 的对象传递给 `boost::thread` 的构造函数才能在新线程中执行该函数。\n\n`boost::packaged_task`\
  \ 的优势在于可以将函数的返回值存储在 future 中。你不需要对函数进行适配来将其值存储在 future 中。`boost::packaged_task`\
  \ 可以看作是一个适配器，可以将任何函数的返回值存储在 future 中。\n\n虽然该示例去掉了 `boost::promise`，但下面的示例也没有使用 `boost::packaged_task`\
  \ 和 `boost::thread`。\n\n### 示例 44.16. 使用 `boost::async()`\n\n```cpp\n#define BOOST_THREAD_PROVIDES_FUTURE\n\
  #include <boost/thread.hpp>\n#include <boost/thread/future.hpp>\n#include <iostream>\n\
  \nint accumulate()\n{\n  int sum = 0;\n  for (int i = 0; i < 5; ++i)\n    sum +=\
  \ i;\n  return sum;\n}\n\nint main()\n{\n  boost::future<int> f = boost::async(accumulate);\n\
  \  std::cout << f.get() << '\\n';\n}\n```\n\n在 示例 44.16, “使用 `boost::async()`”\"\
  ) 中，`accumulate()` 被传递给函数 `boost::async()`。该函数统一了 `boost::packaged_task` 和 `boost::thread`。它在新线程中启动\
  \ `accumulate()` 并返回一个 future。\n\n可以向 `boost::async()` 传递启动策略（launch policy）。这个额外参数决定了\
  \ `boost::async()`是在新线程还是当前线程中执行函数。如果你传递 `boost::launch::async`，`boost::async()`\
  \ 将启动新线程；这是默认行为。如果你传递 `boost::launch::deferred`，函数将在调用 `get()` 时在当前线程中执行。\n\n尽管\
  \ Boost 1.56.0 允许向 `boost::async()` 传递 `boost::launch::async` 或 `boost::launch::deferred`，但在当前线程中执行函数的功能尚未实现。如果你传递\
  \ `boost::launch::deferred`，程序将终止。\n\n# 45. Boost.Atomic\n\n[Boost.Atomic](http://www.boost.org/libs/atomic)\
  \ 提供了 `boost::atomic` 类，可用于创建原子变量。它们被称为原子变量是因为所有访问都是原子的。在多线程程序中，Boost.Atomic 用于当一个线程对变量的访问不应被另一个访问相同变量的线程时。如果没有\
  \ `boost::atomic`，从多个线程访问共享变量需要使用锁进行同步。\n\n`boost::atomic` 取决于目标平台是否支持原子变量访问。否则，`boost::atomic`\
  \ 使用锁。该库允许你检测目标平台是否支持原子变量访问。\n\n如果你的开发环境支持 C++11，不需要 Boost.Atomic。C++11 标准库提供了一个头文件\
  \ `atomic`，定义了与 Boost.Atomic 相同的功能。例如，你会发现一个名为 `std::atomic` 的类。\n\nBoost.Atomic\
  \ 支持与标准库大体相同的功能。虽然 Boost.Atomic 中的某些函数被重载了，但它们在标准库中可能有不同的名称。标准库还提供了一些函数，例如 `std::atomic_init()`\
  \ 和 `std::kill_dependency()`，这些在 Boost.Atomic 中是缺失的。\n\n## 示例 45.1. 使用 `boost::atomic`\n\
  \n```cpp\n#include <boost/atomic.hpp>\n#include <thread>\n#include <iostream>\n\n\
  boost::atomic<int> a{0};\n\nvoid thread()\n{\n  ++a;\n}\n\nint main()\n{\n  std::thread\
  \ t1{thread};\n  std::thread t2{thread};\n  t1.join();\n  t2.join();\n  std::cout\
  \ << a << '\\n';\n}\n```\n\n示例 45.1, “使用 `boost::atomic`” 使用两个线程递增 `int` 变量 `a`。示例没有使用锁而是使用了\
  \ `boost::atomic` 进行原子访问。示例向标准输出写入 `2`。`boost::atomic` 之有效是因为某些处理器支持变量的原子访问。如果在不支持将\
  \ `int` 作为原子操作的平台上运行此示例，`boost::atomic` 将使用锁。\n\n## 示例 45.2. `boost::atomic` 有锁或无锁\n\
  \n```cpp\n#include <boost/atomic.hpp>\n#include <iostream>\n\nint main()\n{\n  std::cout.setf(std::ios::boolalpha);\n\
  \n  boost::atomic<short> s;\n  std::cout << s.is_lock_free() << '\\n';\n\n  boost::atomic<int>\
  \ i;\n  std::cout << i.is_lock_free() << '\\n';\n\n  boost::atomic<long> l;\n  std::cout\
  \ << l.is_lock_free() << '\\n';\n}\n```\n\n示例 45.2, “boost::atomic 有锁或无锁” 仅使用了整数类型。你不应对\
  \ `std::string` 或 `std::vector` 等类使用 `boost::atomic`。Boost.Atomic 提供了 `BOOST_ATOMIC_INT_LOCK_FREE`\
  \ 和 `BOOST_ATOMIC_LONG_LOCK_FREE` 宏，用于编译时检查哪些数据类型支持无锁访问。\n\n## 示例 45.3. 使用 `boost::memory_order_seq_cst`\
  \ 的 `boost::atomic`\n\n```cpp\n#include <boost/atomic.hpp>\n#include <thread>\n\
  #include <iostream>\n\nboost::atomic<int> a{0};\n\nvoid thread()\n{\n  a.fetch_add(1,\
  \ boost::memory_order_seq_cst);\n}\n\nint main()\n{\n  std::thread t1{thread};\n\
  \  std::thread t2{thread};\n  t1.join();\n  t2.join();\n  std::cout << a << '\\\
  n';\n}\n```\n\n示例 45.3, “使用 `boost::memory_order_seq_cst` 的 `boost::atomic`” 递增了\
  \ `a` 两次——这次不是通过 `operator++` 而是通过调用 `fetch_add()`。\n\n### 注意\n\n指定内存序（memory order）可以优化性能，但增加了复杂性并使编写正确代码变得更加困难。因此，在实践中，你应该有一个真正充分的理由才使用内存序。\n\
  \n\n\n\n\n示例 45.3, “带有 `boost::memory_order_seq_cst` 的 `boost::atomic`] 使用内存顺序 `boost::memory_order_seq_cst`\
  \ 将 `a` 增 1。该内存顺序代表顺序一致性（sequential consistency）。这是限制性最强的内存顺序。所有在 `fetch_add()`\
  \ 调用之前出现的内存访问必须在该成员函数执行之前发生。所有在 `fetch_add()` 调用之后出现的内存访问都必须在该成员函数执行之后发生。编译器和处理器可能会重排\
  \ `fetch_add()` 调用前后的内存访问，但它们不能将内存访问从 `fetch_add()` 调用之前移动到之后，或者反之亦然。`boost::memory_order_seq_cst`\
  \ 是两个方向内存访问的严格边界。\n\n`boost::memory_order_seq_cst` 是限制性最强的内存顺序。当未设置内存顺序时，默认使用它。因此，在\
  \ 示例 45.1, “使用 `boost::atomic`] 中，当使用 `operator++` 增加 `a` 时将使用 `boost::memory_order_seq_cst`。\n\
  \n`boost::memory_order_seq_cst` 并不总是必要的。例如，在 示例 45.3, “带有 `boost::memory_order_seq_cst`\
  \ 的 `boost::atomic`] 中，不需要同步其他变量的内存访问，因为 `a` 是线程使用的唯一变量。`a` 在 `main()` 中被写入标准输出，但在两个线程终止之后。对\
  \ `join()` 的调用保证了 `a` 只在两个线程完成后才被读取。\n\n### 示例 45.4. 带有 `memory_order_relaxed` 的\
  \ `boost::atomic`\n\n```\n#include <boost/atomic.hpp>\n#include <thread>\n#include\
  \ <iostream>\n\nboost::atomic<int> a{0};\n\nvoid thread()\n{\n  a.fetch_add(1, boost::memory_order_relaxed);\n\
  }\n\nint main()\n{\n  std::thread t1{thread};\n  std::thread t2{thread};\n  t1.join();\n\
  \  t2.join();\n  std::cout << a << '\\n';\n}\n```\n\n示例 45.4, “带有 `memory_order_relaxed`\
  \ 的 `boost::atomic`] 将内存顺序设置为 `boost::memory_order_relaxed`。这是限制性最弱的内存顺序：它允许内存访问的任意重排。此示例在此顺序下有效，是因为线程没有访问\
  \ `a` 之外的任何变量。因此，不需要特定的顺序。\n\n### 示例 45.5. 带有 `memory_order_release` 和 `memory_order_acquire`\
  \ 的 `boost::atomic`\n\n```cpp\n#include <boost/atomic.hpp>\n#include <thread>\n\
  #include <iostream>\n\nboost::atomic<int> a{0};\nint b = 0;\n\nvoid thread1()\n\
  {\n  b = 1;\n  a.store(1, boost::memory_order_release);\n}\n\nvoid thread2()\n{\n\
  \  while (a.load(boost::memory_order_acquire) != 1)\n    ;\n  std::cout << b <<\
  \ '\\n';\n}\n\nint main()\n{\n  std::thread t1{thread1};\n  std::thread t2{thread2};\n\
  \  t1.join();\n  t2.join();\n}\n```\n\n示例 45.5, “带有 `memory_order_release` 和 `memory_order_acquire`\
  \ 的 `boost::atomic`] 引入了内存顺序 `boost::memory_order_release` 和 `boost::memory_order_acquire`。\n\
  \n在代码中出现在 `boost::memory_order_release` 语句之前的内存访问将在 `boost::memory_order_release`\
  \ 语句之前执行。编译器和处理器不能将内存访问从 `boost::memory_order_release` 之前移动到之后。然而，它们可以将内存访问从 `boost::memory_order_release`\
  \ 之后移动到之前。\n\n`boost::memory_order_acquire` 的工作类似于 `boost::memory_order_release`，但它指的是\
  \ `boost::memory_order_acquire` 之后的内存访问。编译器和处理器不能将内存访问从 `boost::memory_order_acquire`\
  \ 语句之后移动到之前。然而，它们可以将内存访问从之前移动到 `boost::memory_order_acquire` 之后。\n\n示例 45.5, “带有\
  \ `memory_order_release` 和 `memory_order_acquire` 的 `boost::atomic`] 在第一个线程中使用 `boost::memory_order_release`\
  \ 来确保 `b` 在被设置为 1 之前已经设置。\n\n\n\n\n队列的大小传递给构造函数。由于 `boost::lockfree::spsc_queue`\
  \ 是用循环缓冲区实现的，因此示例 46.1, “使用 `boost::lockfree::spsc_queue`” 中的队列容量为 100 个元素。如果因为队列满而无法添加值，`push()`\
  \ 将返回 `false`。示例没有检查 `push()` 的返回值，因为队列中恰好添加了 100 个数字。因此，100 个元素是足够的。\n\n示例 46.2,\
  \ “带有 `boost::lockfree::capacity` 的 `boost::lockfree::spsc_queue`” 工作方式与之前的示例相同，但这次循环缓冲区的大小是在编译时设置的。这是通过模板\
  \ `boost::lockfree::capacity` 实现的，它期望将容量作为模板参数。`q` 使用默认构造函数实例化——容量无法在运行时设置。\n\n\
  函数 `consume()` 已更改为使用 `consume_one()` 而不是 `pop()` 来读取数字。一个 lambda 函数作为参数传递给 `consume_one()`。`consume_one()`\
  \  `pop()` 一样读取一个数字，但该数字不会通过引用返回给调用者，而是作为 lambda 函数的唯一参数传递。\n\n当线程终止时，`main()` 调用成员函数\
  \ `consume_all()` 而不是 `consume()`。`consume_all()` 的工作方式类似于 `consume_one()`，但它能确保在调用后队列为空。只要队列中还有元素，`consume_all()`\
  \ 就会调用 lambda 函数。\n\n### 示例 46.2. 带有 `boost::lockfree::capacity` 的 `boost::lockfree::spsc_queue`\n\
  \n```cpp\n#include <boost/lockfree/spsc_queue.hpp>\n#include <boost/lockfree/policies.hpp>\n\
  #include <thread>\n#include <iostream>\n\nusing namespace boost::lockfree;\n\nspsc_queue<int,\
  \ capacity<100>> q;\nint sum = 0;\n\nvoid produce()\n{\n  for (int i = 1; i <= 100;\
  \ ++i)\n    q.push(i);\n}\n\nvoid consume()\n{\n  while (q.consume_one([](int i){\
  \ sum += i; }))\n    ;\n}\n\nint main()\n{\n  std::thread t1{produce};\n  std::thread\
  \ t2{consume};\n  t1.join();\n  t2.join();\n  q.consume_all([](int i){ sum += i;\
  \ });\n  std::cout << sum << '\\n';\n}\n```\n\n再次，示例 46.2, “带有 `boost::lockfree::capacity`\
  \ 的 `boost::lockfree::spsc_queue`” 向标准输出写入了 `5050`。\n\n示例 46.3, “变变容器大小的 `boost::lockfree::queue`”\
  \ 在两个线程中执行 `consume()`。因为有多个线程从队列中读取数据，因此不能使用 `boost::lockfree::spsc_queue` 类。此示例改用了\
  \ `boost::lockfree::queue`。\n\n得益于 `std::atomic`，对变量 `sum` 的访问现在也是线程安全的。\n\n队列的大小设置为\
  \ 100——这是传递给构造函数的参数。然而，这只是初始大小。默认情况下，`boost::lockfree::queue` 不是用循环缓冲区实现的。如果向队列添加的项超过了设置的容量，它会自动增加。如果初始大小不足，`boost::lockfree::queue`\
  \ 会动态分配额外的内存。\n\n### 示例 46.3. 变变容器大小的 `boost::lockfree::queue`\n\n```cpp\n#include\
  \ <boost/lockfree/queue.hpp>\n#include <thread>\n#include <atomic>\n#include <iostream>\n\
  \nboost::lockfree::queue<int> q{100};\nstd::atomic<int> sum{0};\n\nvoid produce()\n\
  {\n  for (int i = 1; i <= 10000; ++i)\n    q.push(i);\n}\n\nvoid consume()\n{\n\
  \  int i;\n  while (q.pop(i))\n    sum += i;\n}\n\nint main()\n{\n  std::thread\
  \ t1{produce};\n  std::thread t2{consume};\n  std::thread t3{consume};\n  t1.join();\n\
  \  t2.join();\n  t3.join();\n  consume();\n  std::cout << sum << '\\n';\n}\n```\n\
  \n这意味着 `boost::lockfree::queue` 并不一定是无锁的。\n\n\n\n\n如果你想使用 MPI，则需要该标准的实现版本。虽然 MPI\
  \ 定义了许多函数，但操作系统通常不会默认就支持这些函数。例如，Windows 桌面版本并未附带 `MPI` 支持。\n\n最重要的 `MPI` 实现有 [MPICH](http://www.mpich.org/)\
  \ 和 [Open MPI.](http://www.open-mpi.org/)。`MPICH` 是最早的 MPI 实现之一，自 20 世纪 90 年代中期一直存在。`MPICH`\
  \ 是一个成熟且可移植的实现，一直在活跃维护和更新。`Open MPI` 的第一个版本发布于 2005 年。由于 `Open MPI` 是一个协作项目，包含了许多负责早期\
  \ MPI 实现的开发者，因此 `Open MPI` 被视为未来的标准。然而，这并不意味着可以忽略 `MPICH`。有几个基于 `MPICH` 的 MPI 实现。例如，微软提供了一个名为\
  \ `Microsoft HPC Pack` 的 MPI 实现，它是基于 `MPICH` 的。\n\n`MPICH` 为各种操作系统（如 Windows、Linux\
  \ 和 OS X）提供了安装文件。如果你需要一个 MPI 实现且不想从源代码编译，那么 `MPICH` 安装文件是开始使用 MPI 的快速路径。\n\n`MPICH`\
  \ 安装文件包含了开发 MPI 程序所需的头文件和库。此外，它们还包含一个 MPI 运行环境。由于 MPI 程序在多个处理器上并发执行任务，因此它们在多个进程中运行。一个\
  \ MPI 程序会被启动多次，而不仅仅一次。同一个 MPI 程序的多个实例运行在多个处理器上，并通过 MPI 标准定义的函数进行通信。\n\n你不能通过双击来启动\
  \ MPI 程序。你需要使用一个辅助程序，通常称为 `mpiexec`。你将你的 MPI 程序传递给 `mpiexec`，由它在 MPI 运行环境中启动你的程序。命令行选项决定了启动多少进程以及它们如何通信——例如，通过套接或共享内存。由于\
  \ MPI 运行环境会处理这些细节，因此你可以专注于并行编程。\n\n如果你决定使用来自 `MPICH` 的安装文件，请注意 `MPICH` 只提供 64 位版本。你必须使用\
  \ 64 位编译器来使用 `MPICH` 开发 MPI 程序，并构建 64 位的 `Boost.MPI`。\n\n## 简单数据交换\n\nBoost.MPI\
  \ 是 MPI 标准的 C++ 接口。该库使用命名空间 `boost::mpi`。只需包含头文件 `boost/mpi.hpp` 即可访问所有类和函数。\n\n\
  示例 47.1. MPI 环境和通信器\n\n```cpp\n#include <boost/mpi.hpp>\n#include <iostream>\n\n\
  int main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n\
  \  boost::mpi::communicator world;\n  std::cout << world.rank() << \", \" << world.size()\
  \ << '\\n';\n}\n```\n\n示例 47.1, “MPI 环境和通信器” 是一个简单的 MPI 程序。它使用了你将在接后的所有示例中找到的两个类。`boost::mpi::environment`\
  \ 初始化 MPI。构造函数调用了 MPI 标准中的 `MPI_Init()` 函数。析构函数调用 `MPI_Finalize()`。`boost::mpi::communicator`\
  \ 用于创建通信器。通信器是 MPI 的核心概念之一，支持进程之间的数据交换。\n\n`boost::mpi::environment` 是一个非常简单的类，只提供了几个成员函数。你可以调用\
  \ `initialized()` 来检查 MPI 是否已成功初始化。该成员函数返回一个 `bool` 类型的值。`processor_name()` 返回当前进程的名称（`std::string`）。而\
  \ `abort()` 会停止整个 MPI 程序，而不只是当前进程。你向 `abort()` 传递一个 `int` 值。该值将作为 MPI 程序的返回值传递给\
  \ MPI 运行环境。对于大多数 MPI 程序，你不需要这些成员函数。你通常在程序开始实例化 `boost::mpi::environment`，之后不再使用该对象——正如\
  \ 示例 47.1, “MPI 环境和通信器” 以及本章后续示例所示。\n\n`boost::mpi::communicator` 更有趣。这个类是一个通信器，连接了属于\
  \ MPI 程序的进程。每个进程都有一个秩（rank），这是一个整数——所有进程都是被枚举的。进程可以通过调用通信器上的 `rank()` 来发现自己的秩。如果进程想知道有多少个进程，它调用\
  \ `size()`。\n\n要运行 示例 47.1, “MPI 环境和通信器”，你必须使用你所使用的 MPI 实现提供的辅助程序。对于 MPICH，该辅助程序称为\
  \ `mpiexec`。你可以使用以下命令通过该程序运行 示例 47.1, “MPI 环境和通信器”：\n\n```bash\nmpiexec -n 4 sample.exe\n\
  ```\n\n`mpiexec` 期望一个 MPI 程序的名称和一个告诉它要启动多少进程的选项。选项 `-n 4` 告诉 `mpiexec` 启动 4 个进程。由于\
  \ MPI 运行环境处理了这些细节，你可以专注于并行编程。\n\n如果你决定使用来自 `MPICH` 的安装文件，请注意 `MPICH` 只提供 64 位版本。你必须使用\
  \ 64 位编译器来使用 `MPICH` 开发 MPI 程序，并构建 64 位的 `Boost.MPI`。\n\n[content]\n示例 47.2. 用于发送和接收的阻塞函数\n\
  \n```cpp\n#include <boost/mpi.hpp>\n#include <iostream>\n\nint main(int argc, char\
  \ *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator\
  \ world;\n  if (world.rank() == 0)\n{\n    int i;\n    world.recv(1, 16, i);\n \
  \   std::cout << i << '\\n';\n  }\n  else if (world.rank() == 1)\n  {\n    world.send(0,\
  \ 16, 99);\n  }\n}\n```\n\n`boost::mpi::communicator` 提供了两个简单的成员函数 `send()` 和 `recv()`，用于在进程之间交换数据。它们是阻塞函数，只有在数据发送或接收后才会返回。这对于\
  \ `recv()` 尤为重要。如果调用 `recv()` 时没有另一个进程发送数据，该调用将阻塞，进程会在调用处停滞。\n\n在 示例 47.2, “用于发送和接收的阻塞函数`\
  \ 中，秩为 0 的进程通过 `recv()` 接收数据。秩为 1 的进程通过 `send()` 发送数据。如果你启动程序时进程超过两个，其他进程将在不执行任何操作的情况下退出。\n\
  \n你向 `send()` 传递三个参数：第一个参数是要发送目标进程的秩；第二个参数是标识数据的标签（tag）；第三个参数是数据。\n\n标签始终整数。在示例\
  \ 47.2 中，标签是 `16`。标签使得识别 `send()` 调用变得可能。你会看到标签也被用于 `recv()`。\n\n\n\n传递给 `send()`\
  \ 的第三个参数是 99。这个数字从 rank 为 1 的进程发送到 rank 为 0 的进程。Boost. 支持 支持原始类型。像 99 这样的 `int`\
  \ 值可以直接被发送。\n\n`recv()` 期望类似的参数。第一个参数是应该从哪个进程接收数据的进程 rank。第二个参数是将 `recv()` 调用与 `send()`\
  \ 调用关联的标签（tag）。第三个参数是用于存储接收到的数据的变量。\n\n如果你使用至少两个进程运行 示例 47.2, “用于发送和接收数据的阻塞函数”，则会显示\
  \ `99`。\n\n### 示例 47.3. 从任何进程接收数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include\
  \ <iostream>\n\nint main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc,\
  \ argv};\n  boost::mpi::communicator world;\n  if (world.rank() == 0)\n  {\n   \
  \ int i;\n    world.recv(boost::mpi::any_source, 16, i);\n    std::cout << i <<\
  \ '\\n';\n  }\n  else\n  {\n    world.send(0, 16, world.rank());\n  }\n}\n```\n\n\
  示例 47.3, “从任何进程接收数据” 基于 示例 47.2, “用于发送和接收数据的阻塞函数”。该示例不是发送数字 99，而是发送调用 `send()` 的进程的\
  \ rank。这可以是任何 rank 大于 0 的进程。\n\nrank 为 0 的进程的 `recv()` 调用也发生了变化。第一个参数是 `boost::mpi::any_source`。这意味着\
  \ `recv()` 调用将接受来自任何发送标签为 16 数据的进程的数据。\n\n如果你使用两个进程启动 示例 47.3, “从任何进程接收数据”，则会显示\
  \ `1`。毕竟，只有一个进程可以调用 `send()` —— 即 rank 为 1 的进程。如果你用两个以上的进程启动程序，则无法确定将显示哪个数字。在这种情况下，多个进程将调用\
  \ `send()` 并尝试发送它们的 rank。哪个进程先调用，因此显示哪个 rank，是随机的。\n\n`recv()` 的返回类型类型为 `boost::mpi::status`。该类提供了一个成员函数\
  \ `source()`，它返回接收数据的进程的 rank。示例 47.4, “使用 `boost::mpi::status` 检测发送者” 它会告诉你数字 99\
  \ 是从哪个进程接收到的。\n\n### 示例 47.4. 使用 `boost::mpi::status` 检测发送者\n\n```cpp\n#include\
  \ <boost/mpi.hpp>\n#include <iostream>\n\nint main(int argc, char *argv[])\n{\n\
  \  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator world;\n\
  \  if (world.rank() == 0)\n  {\n    int i;\n    boost::mpi::status s = world.recv(boost::mpi::any_source,\
  \ 16, i);\n    std::cout << s.source() << \": \" << i << '\\n';\n  }\n  else\n \
  \ {\n    world.send(0, 16, 99);\n  }\n}\n```\n\n到目前为止，所有示例都使用 `send()` 和 `recv()`\
  \ 来传输 `int` 值。在 示例 47.5, “使用 `send()` 和 `recv()` 传输数组” and recv()\") 中，传输的是字符串。\n\
  \n`send()` 和 `recv()` 也可以传输数组而不仅仅是单个值。示例 47.5, “使用 `send()` 和 `recv()` 传输数组” and\
  \ recv()\") 传输了一个 `char` 数组中的字符串。由于 `send()` 和 `recv()` 支持如 `char` 等原始类型，因此 `char`\
  \ 数组可以无问题地传输。\n\n### 示例 47.5. 使用 `send()` 和 `recv()` 传输数组\n\n```cpp\n#include <boost/mpi.hpp>\n\
  #include <iostream>\n\nint main(int argc, char *argv[])\n{\n  boost::mpi::environment\
  \ env{argc, argv};\n  boost::mpi::communicator world;\n  if (world.rank() == 0)\n\
  \  {\n    char buffer[14];\n    world.recv(boost::mpi::any_source, 16, buffer, 13);\n\
  \    buffer[13] = '\\0';\n    std::cout << buffer << '\\n';\n  }\n  else\n  {\n\
  \    const char *c = \"Hello, world!\";\n    world.send(0, 16, c);\n  }\n}\n```\n\
  \n`send()` 接收字符串作为第三个参数，并将字符串的大小作为第四个参数。`recv()` 的第三个参数是用于存储接收数据的指针。第四个参数告诉 `recv()`\
  \ 应该接收多少个 `char`。示例 47.5, “使用 `send()` 和 `recv()` 传输数组” and recv()\") 向标准输出写入了 `Hello,\
  \ world!`\n\n### 示例 47.6. 使用 `send()` 和 `recv()` 传输字符串\n\n```cpp\n#include <boost/mpi.hpp>\n\
  #include <boost/serialization.hpp>\n#include <string>\n#include <iostream>\n\nint\
  \ main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n\
  \  boost::mpi::communicator world;\n  if (world.rank() == 0)\n  {\n    std::string\
  \ s;\n    world.recv(boost::mpi::any_source, 16, s);\n    std::cout << s << '\\\
  n';\n  }\n  else\n  {\n    std::string s = \"Hello, world!\";\n    world.send(0,\
  \ 16, s);\n  }\n}\n```\n\n尽管 Boost.MPI 只支持原始类型，但这并不意味着无法传输非原始类型。Boost.MPI 与 Boost.Serialization\
  \ 协作。示例 47.6, “使用 `send()` 和 `recv()` 传输字符串” and recv()\") 这次传输的不是 `char` 数组而是 `std::string`。Boost.Serialization\
  \ 提供了头文件 `boost/serialization.hpp`，包含它即可使 `std::string` 可序列化。\n\n## 异步数据交换\n\n除了阻塞函数\
  \ `send()` 和 `recv()`，Boost.MPI 还通过成员函数 `isend()` 和 `irecv()` 支持异步数据交换。名称以 `i` 开头，表示这些函数会立即返回。\n\
  \n### 示例 47.7. 使用 `irecv()` 异步接收数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include\
  \ <boost/serialization.hpp>\n#include <string>\n#include <iostream>\n\nint main(int\
  \ argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator\
  \ world;\n  if (world.rank() == 0)\n  {\n    std::string s;\n    boost::mpi::request\
  \ r = world.irecv(boost::mpi::any_source, 16, s);\n    if (r.test())\n      std::cout\
  \ << s << '\\n';\n    else\n      r.cancel();\n  }\n  else\n  {\n    std::string\
  \ s = \"Hello, world!\";\n    world.send(0, 16, s);\n  }\n}\n```\n\n示例 47.7, “使用\
  \ `irecv()` 异步接收数据”\") 使用阻塞函数 `send()` 发送字符串“Hello, world!”。然而，数据使用异步函数 `irecv()`\
  \ 接收。该成员函数期望与 `recv()` 相同的参数。区别在于当 `irecv()` 返回时，无法保证数据已经接收到 `s` 中。\n\n`irecv()`\
  \ 返回一个类型为 `boost::mpi::request` 的对象。你可以调用 `test()` 来检查是否已接收。该成员函数返回一个 `bool` 值。你可以根据需要频繁调用\
  \ `test()`。由于 `irecv()` 是异步成员函数，可能第一次调用返回 `false` 而第二次返回 `true`。这意味着异步操作在两次调用之间完成了。\n\
  \n\n\n\n示例 47.7, “使用 `irecv()` 异步接收数据”]) 仅调用了一次 `test()`。如果已在 `s` 中接收到数据，则该变量将被写入标准输出流。如果没有接收到数据，则通过\
  \ `cancel()` 取消该异步操作。\n\n如果你多次运行 示例 47.7, “使用 `irecv()` 异步接收数据”])，有时会显示 `Hello,\
  \ world!`，有时则没有输出。结果取决于在调用 `test()` 之前是否接收到了数据。\n\n你可以多次对 `boost::mpi::request`\
  \ 调用 `test()`，以检测异步操作何时完成。然而，你也可以像 示例 47.8, “使用 `wait_all()` 等待多个异步操作”\") 那样调用阻塞函数\
  \ `boost::mpi::wait_all()`。`boost::mpi::wait_all()` 是一个阻塞函数，但它的优势是它可以等待多个异步操作完成。`boost::mpi::wait_all()`\
  \ 在它所等待的所有异步操作都完成后后返回。\n\n### 示例 47.8. 使用 `wait_all()` 等待多个异步操作\n\n```cpp\n#include\
  \ <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n#include <string>\n\
  #include <iostream>\n\nint main(int argc, char *argv[])\n{\n  boost::mpi::environment\
  \ env{argc, argv};\n  boost::mpi::communicator world;\n  if (world.rank() == 0)\n\
  \  {\n    boost::mpi::request requests[2];\n    std::string s[2];\n    requests[0]\
  \ = world.irecv(1, 16, s[0]);\n    requests[1] = world.irecv(2, 16, s[1]);\n   \
  \ boost::mpi::wait_all(requests, requests + 2);\n    std::cout << s[0] << \"; \"\
  \ << s[1] << '\\n';\n  }\n  else if (world.rank() == 1)\n  {\n    std::string s\
  \ = \"Hello, world!\";\n    world.send(0, 16, s);\n  }\n  else if (world.rank()\
  \ == 2)\n  {\n    std::string s = \"Hello, moon!\";\n    world.send(0, 16, s);\n\
  \  }\n}\n```\n\n在 示例 47.8, “使用 `wait_all()` 等待多个异步操作”\") 中，rank 1 的进程发送了“Hello,\
  \ world!”，rank 2 的进程发送了“Hello, moon!”。由于接收数据的顺序并不重要，rank 0 调用了 `irecv()`。由于程序只有在所有异步操作完成且所有数据都接收后才会产生输出，因此类型为\
  \ `boost::mpi::request` 的返回值被传递给 `boost::mpi::wait_all()`。因为 `boost::mpi::wait_all()`\
  \ 期望两个迭代器，所以类型为 `boost::mpi::request` 的对象被存储在数组中。起始和结束迭代器被传递给 `boost::mpi::wait_all()`。\n\
  \nBoost.MPI 提供了额外的函数供你等待异步操作的完成。`boost::mpi::wait_any()` 在恰好有一个异步操作完成时返回，而 `boost::mpi::wait_some()`\
  \ 在至少有一个异步操作完成时返回。这两个函数都返回一个 `std::pair`，用于指示哪个操作或哪些操作已完成。\n\n`boost::mpi::test_all()`、`boost::mpi::test_any()`\
  \ 和 `boost::mpi::test_some()` 通过单次调用测试多个异步操作的状态。这些函数是非阻塞的，会立即返回。\n\n## 集合数据交换\n\n\
  到目前为止引入的函数共享一种一对一的关系：即一个进程发送，另一个进程接收。连接通过标签（tag）建立。本节介绍了在多个进程中以相同参数调用但执行不同操作的函数。对于一个进程，该函数可能是发送数据；而对于另一个进程，它可能是接收数据。这些函数被称为集合操作。\n\
  \n### 示例 47.9. 使用 `gather()` 从多个进程接收数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include\
  \ <boost/serialization/string.hpp>\n#include <vector>\n#include <string>\n#include\
  \ <iterator>\n#include <algorithm>\n#include <iostream>\n\nint main(int argc, char\
  \ *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator\
  \ world;\n  if (world.rank() == 0)\n  {\n    std::vector<std::string> v;\n    boost::mpi::gather<std::string>(world,\
  \ \"\", v, 0);\n    std::ostream_iterator<std::string> out{std::cout, \"\\n\"};\n\
  \    std::copy(v.begin(), v.end(), out);\n  }\n  else if (world.rank() == 1)\n \
  \ {\n    boost::mpi::gather(world, std::string(\"Hello, world!\"), v, 0);\n  }\n\
  \  else if (world.rank() == 2)\n  {\n    boost::mpi::gather(world, std::string(\"\
  Hello, moon!\"), v, 0);\n  }\n}\n```\n\n在 示例 47.9, “使用 `gather()` 从多个进程接收数据”\")\
  \ 中，在多个进程中调用了 `boost::mpi::gather()` 函数。该函数是发送还是接收取决于 rank。rank 为 1 和 2 的进程使用 `boost::mpi::gather()`\
  \ 发送数据——即字符串“Hello, world!”和“Hello, moon!”——取决于进程的 rank。由于 `boost::mpi::gather()`\
  \ 不是成员函数，通信器 `world` 也必须传递。\n\nrank 为 0 的进程调用 `boost::mpi::gather()` 进行接收。由于数据需要存储在某处，因此传递了类型为\
  \ `std::vector<std::string>` 的对象。请注意 `boost::mpi::gather()` 不支持其他容器。\n\nrank 为 0\
  \ 的进程必须向 `boost::mpi::gather()` 传递 `world`、一个要的字符串以及 0。这就是为什么 rank 为 1 和 2 的进程传递相同的参数。如果你用三个进程启动\
  \ 示例 47.9, “使用 `gather()` 从多个进程接收数据”\")，将显示 `Hello, world!` 和 `Hello, moon!`。如果你仔细观察输出，你会发现首先写入了一个空行。第一行是\
  \ rank 0 传递 `boost::mpi::gather()` 的空字符串。`v` 中有三个字符串，分别从 rank 0、1、2 进程接收。vector\
  \ 中元素的索引对应进程的 rank。如果你多次运行该示例，你将总是得到第一个元素为空字符串，第二个元素为“Hello, world!”，第三个元素为“Hello,\
  \ moon!”。\n\n请注意，不能用超过三个进程运行 示例 47.9, “使用 `gather()` 从多个进程接收数据”\")。如果你用 `-n 4` 启动\
  \ mpieec，将没有数据输出。程序将挂起并必须通过 `CTRL+C` 终止。\n\n集合操作必须在所有进程中执行。如果你的程序调用了如 `boost::mpi::gather()`\
  \ 的函数，你必须确保该函数在所有进程中调用。否则将违反 MPI 标准。因为像 `boost::mpi::gather()` 这样的函数必须由所有进程调用，所以通常调用方式没有区别，如\
  \ 示例 47.9, “使用 `gather()` 从多个进程接收数据”\") 所示。将之前的示例与 示例 47.10, “使用 `gather()` 收集所有进程的数据”\"\
  ) 进行对比，它们执行的是相同的功能。\n\n### 示例 47.10. 使用 `gather()` 收集所有进程的数据\n\n\n\n\n\n```cpp\n\
  #include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n#include <vector>\n\
  #include <string>\n#include <iterator>\n#include <algorithm>\n#include <iostream>\n\
  \nint main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n\
  \  boost::mpi::communicator world;\n  std::string s;\n  if (world.rank() == 1)\n\
  \    s = \"Hello, world!\";\n  else if (world.rank() == 2)\n    s = \"Hello, moon!\"\
  ;\n  std::vector<std::string> v;\n  boost::mpi::gather(world, s, v, 0);\n  std::ostream_iterator<std::string>\
  \ out{std::cout, \"\\n\"};\n  std::copy(v.begin(), v.end(), out);\n}\n```\n\n你在所有进程中调用集合操作的函数。通常，这些函数的定义能够一眼看出需要执行哪种操作，即使所有进程传递了相同的参数。\n\
  \n### 示例 47.10, “使用 `gather()` 从所有进程收集数据”\") 使用了 `boost::mpi::gather()`，该函数会收集数据。数据被收集在作为\
  \ `boost::mpi::gather()` 最后一个参数传递的 rank 对应的进程中。该进程收集从所有其他进程接收的数据。用于存储数据的 `vector`\
  \ 仅供收集数据的进程专门使用。\n\n`boost::mpi::gather()` 从所有进程收集数据。这包含了收集数据的进程本身。在示例 47.10, “使用\
  \ `gather()` 从所有进程收集数据”\")中，即 rank 为 `0` 的进程。该进程向它自己的 `s` 发送了一个空字符串。该空字符串被存储在 `v`\
  \ 中。正如你在接下来的示例中看到的，集合操作始终包含所有进程。\n\n你可以使用任意数量的进程运行示例 47.10, “使用 `gather()` 从所有进程收集数据”\"\
  )，因为每个进程都调用了 `boost::mpi::gather()`。如果你用三个进程运行该示例，结果将与之前的示例相似。\n\n### 示例 47.11.\
  \ 使用 `scatter()` 在所有进程间分发数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <vector>\n#include <string>\n#include <iostream>\n\nint main(int argc,\
  \ char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator\
  \ world;\n  std::vector<std::string> v{\"Hello, world!\", \"Hello, moon!\",\n  \
  \  \"Hello, sun!\"};\n  std::string s;\n  boost::mpi::scatter(world, v, s, 0);\n\
  \  std::cout << world.rank() << \": \" << s << '\\n';\n}\n```\n\n示例 47.11, “使用 `scatter()`\
  \ 在所有进程间分发数据” across all processes\") 引入了函数 `boost::mpi::scatter()`。它的作用与 `boost::mpi::gather()`\
  \ 相反。`boost::mpi::gather()` 将多个进程的数据收集到一个进程中，而 `boost::mpi::scatter()` 则将数据从一个进程分发到多个进程。\n\
  \n示例 47.11, “使用 `scatter()` 在所有进程间分发数据” across all processes\") 将 rank 为 `0` 的进程中\
  \ `v` 的数据分发到所有进程（包括其自身）。rank 为 `0` 的进程在 `s` 中接收字符串“Hello, world!”，rank 为 `1` 的进程在\
  \ `s` 中接收“Hello, moon!”，rank 为 `2` 的进程在 `s` 中接收“Hello, sun!”。\n\n### 示例 47.12. 使用\
  \ `broadcast()` 向所有进程发送数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <string>\n#include <iostream>\n\nint main(int argc, char *argv[])\n{\n\
  \  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator world;\n\
  \  std::string s;\n  if (world.rank() == 0)\n    s = \"Hello, world!\";\n  boost::mpi::broadcast(world,\
  \ s, 0);\n  std::cout << s << '\\n';\n}\n```\n\n`boost::mpi::broadcast()` 将数据从一个一个进程发送到所有进程。该函数与\
  \ `boost::mpi::scatter()` 的区别在于向所有进程发送相同的数据。在示例 47.12, “使用 `broadcast()` 向所有进程发送数据”\"\
  )中，所有进程都在 `s` 中接收到字符串“Hello, world!”。\n\n### 示例 47.13. 使用 `reduce()` 收集并分析数据\n\n\
  ```cpp\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n#include\
  \ <string>\n#include <iostream>\n\nstd::string min(const std::string &lhs, const\
  \ std::string &rhs)\n{\n  return lhs.size() < rhs.size() ? lhs : rhs;\n}\n\nint\
  \ main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n\
  \  boost::mpi::communicator world;\n  std::string s;\n  if (world.rank() == 0)\n\
  \    s = \"Hello, world!\";\n  else if (world.rank() == 1)\n    s = \"Hello, moon!\"\
  ;\n  else if (world.rank() == 2)\n    s = \"Hello, sun!\";\n  std::string result;\n\
  \  boost::mpi::reduce(world, s, result, 0);\n  if (world.rank() == 0)\n    std::cout\
  \ << result << '\\n';\n}\n```\n\n`boost::mpi::reduce()` 从多个进程收集数据，类似于 `boost::mpi::gather()`。然而，数据并没有存储在\
  \ `vector` 中。如果你运行示例 47.13, “使用 `reduce()` 收集并分析数据”\")三个进程，rank 为 `0` 的进程会在 `result`\
  \ 中接收到字符串“Hello, sun!”。它们使用作为 `boost::mpi::reduce()` 第四个参数的 `min` 函数进行分析。如果你运行示例\
  \ 47.13, “使用 `reduce()` 收集并分析数据”\")超过三个进程，则会显示空字符串，因为……\n\n### 示例 47.14. 使用 `all_reduce()`\
  \ 收集并分析数据\n\n```cpp\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <string>\n#include <iostream>\n\nstd::string min(const std::string &lhs,\
  \ const std::string &rhs)\n{\n  return lhs.size() < rhs.size() ? lhs : rhs;\n}\n\
  \nint main(int argc, char *argv[])\n{\n  boost::mpi::environment env{argc, argv};\n\
  \  boost::mpi::communicator world;\n  std::string s;\n  if (world.rank() == 0)\n\
  \    s = \"Hello, world!\";\n  else if (world.rank() == 1)\n    s = \"Hello, moon!\"\
  ;\n  else if (world.rank() == 2)\n    s = \"Hello, sun!\";\n  std::string result;\n\
  \  boost::mpi::all_reduce(world, s, result, min);\n  std::cout << world.rank() <<\
  \ \": \" << result << '\\n';\n}\n```\n\n示例 47.14, “使用 `all_reduce()` 收集并分析数据”\"\
  ) 使用了函数 `boost::mpi::all_reduce()`，它收集并分析数据的方式类似于 `boost::mpi::reduce()`。这两个函数的区别在于，`boost::mpi::all_reduce()`\
  \ 将分析结果发送给所有进程，而 `boost::mpi::reduce()` 仅让结果对作为最后一个参数传递的 rank 进程可用。因此，没有向 `boost::mpi::all_reduce()`\
  \ 传递 rank。如果你用三个进程运行该示例，每个进程都会向标准输出流写入 `Hello, sun!`。\n\n\n\n\n\n本章中的所有示例仅使用一个通信器，该通信器连接了所有进程。然而，创建多个通信器来连接进程的子集。这对于不需要由所有进程执行的集合操作特别有用。\n\
  \n### 示例 47.15. 使用多个通信器\n\n```\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <string>\n#include <iostream>\n\nint main(int argc, char *argv[])\n{\n\
  \  boost::mpi::environment env{argc, argv};\n  boost::mpi::communicator world;\n\
  \  boost::mpi::communicator local = world.split(world.rank() < 2 ? 99 : 100);\n\
  \  std::string s;\n  if (world.rank() == 0)\n    s = \"Hello, world!\";\n  boost::mpi::broadcast(local,\
  \ s, 0);\n  std::cout << world.rank() << \": \" << s << '\\n';\n}\n```\n\n示例 47.15\
  \ “使用多个通信器”使用了 `boost::mpi::broadcast()` 函数。该函数将秩为 0 的进程的字符串“Hello, world!”发送到所有连接到通信器\
  \ `local` 的进程。秩为 0 的进程也必须连接到该通信器。\n\n通信器 `local`是通过调用 `split()` 创建的。`split()` 是在全局通信器\
  \ `world` 上调用的成员函数。`split()` 期望一个整数将进程连接在一起。所有向 `split()` 传递相同整数的进程都会连接到同一个通信器。传递给\
  \ `split()` 的整数值并不重要。重要的是，所有进程应该通过传递相同的值由某个特定的通信器连接起来。\n\n在示例 47.15 “使用多个通信器”中，秩为\
  \ 0 和 1 的两个进程向 `split()` 传递了 99。如果启动程序时进程数超过两个，额外的进程将传递 100。这意味着前两个进程拥有一个 `local`\
  \ 通信器，而所有其他进程拥有另一个。每个进程都连接到由 `split()` 返回的通信器。其他进程是否也连接到同一个通信器上，取决于其他进程是否向 `split()`\
  \ 传递了相同的整数。\n\n请注意，秩（rank）始终是相对于通信器的。最低秩始终是 0。在示例 47.15 “使用多个通信器”中，相对于全局通信器秩为 0\
  \ 的进程，相对于其本地通信器的秩也为 0。相对于全局通信器秩为 2 的进程，相对于其本地通信器的秩为 0。\n\n如果你用两个或多个进程启动示例 47.15\
  \ “使用多个通信器”，`Hello, world!` 将显示两次——分别由相对于全局通信器秩为 0 和 1 的进程显示一次。由于 `s` 仅在全局秩为 0 的进程中被设为“Hello,\
  \ world!”，因此该字符串只通过通信器发送给那些连接到相同通信器的进程。这仅仅是全局秩为 1 的进程，即是另一个向 `split()` 传递了 99 的进程。\n\
  \n### 示例 47.16. 使用 group 分组进程\n\n```\n#include <boost/mpi.hpp>\n#include <boost/serialization/string.hpp>\n\
  #include <boost/range/irange.hpp>\n#include <boost/optional.hpp>\n#include <string>\n\
  #include <iostream>\n\nint main(int argc, char *argv[])\n{\n  boost::mpi::environment\
  \ env{argc, argv};\n  boost::mpi::communicator world;\n  boost::mpi::group local\
  \ = world.group();\n  boost::integer_range<int> r = boost::irange(0, 1);\n  boost::mpi::group\
  \ subgroup = local.exclude(r.begin(), r.end());\n  boost::mpi::communicator others{world,\
  \ subgroup};\n  std::string s;\n  boost::optional<int> rank = subgroup.rank();\n\
  \  if (rank)\n  {\n    if (rank == 0)\n      s = \"Hello, world!\";\n    boost::mpi::broadcast(others,\
  \ s, 0);\n  }\n  std::cout << world.rank() << \": \" << s << '\\n';\n}\n```\n\n\
  MPI 支持进程分组。这是通过 `boost::mpi::group` 类辅助完成的。如果你在通信器上调用成员函数 `group()`，所有连接到该通信器的进程将以\
  \ `boost::mpi::group` 类型对象的形式返回。你不能使用此对象进行通信。它只能用于形成一个新的进程组，然后从该组中创建一个通信器。\n\n`boost::mpi::group`\
  \ 提供了如 `include()` 和 `exclude()` 类的成员函数。你传递迭代器来包含或排除进程。`include()` 和 `exclude()`\
  \ 返回一个 `boost::mpi::group` 类型的新组。\n\n示例 47.16 “使用 group 分组进程”向 `exclude()` 传递了两个迭代器，它们指向一个\
  \ `boost::integer_range` 类型的对象。该对象表示一个整数范围。它是通过函数 `boost::irange()` 创建的，该函数期望一个下界和一个上限。上限是一个不属于该范围的整数。在这个示例中，这意味着\
  \ `r` 只包含整数 0。\n\n对 `exclude()` 的调用导致创建了 `subgroup`，它包含了秩为 0 的进程以外的所有进程。该组随后被用于创建一个新的通信器\
  \ `others`。这是通过将全局通信器 `world` 和 `subgroup` 传递给 `boost::mpi::communicator` 的构造函数来实现。\n\
  \n请注意，`others` 在秩为 0 的进程中是一个空的通信器。秩为 0 的进程没有连接到该通信器，但变量 `others` 在该进程中存在。你必须小心在该进程中使用\
  \ `others`。示例 47.16 “使用 group 分组进程”通过在 `subgroup` 上调用 `rank()` 避免了这种情况。该成员函数不在组内的进程中返回一个空的\
  \ `boost::optional` 对象。其他进程接收相对于组的秩。如果 `rank()` 返回一个秩且不是空的 `boost::optional` 对象，则调用\
  \ `boost::mpi::broadcast()`。\n\n# XI. 泛型编程\n\n以下库支持泛型编程。使用这些库不需要了解模板元编程。\n\n*  \
  \ `Boost.TypeTraits` 提供了检查类型属性的功能。\n*   `Boost.EnableIf` 可以与 `Boost.TypeTraits`\
  \ 一起使用，例如根据返回类型重载函数。\n*   `Boost.Fusion` 使得创建异构容器成为可能——元素具有不同类型的容器。\n\n# 48. Boost.TypeTraits\n\
  \n类型具有泛型编程可以利用的属性。`Boost.TypeTraits` 库提供了确定和更改这些属性所需的工具。\n\n\n\n\n\n```cpp\n#include\
  \ <boost/type_traits.hpp>\n#include <iostream>\n\nusing namespace boost;\n\nint\
  \ main()\n{\n  std::cout.setf(std::ios::boolalpha);\n  std::cout << is_integral<int>::value\
  \ << '\\n';\n  std::cout << is_floating_point<int>::value << '\\n';\n  std::cout\
  \ << is_arithmetic<int>::value << '\\n';\n  std::cout << is_reference<int>::value\
  \ << '\\n';\n}\n```\n\n示例 48.1, “确定类型类别” 调用了多个函数来确定类型类别。`boost::is_integral` 检查一个类型是否为整型——即是否可以存储整数。`boost::is_floating_point`\
  \ 检查一个类型是否存储浮点数。`boost::is_arithmetic` 检查一个类型是否支持算术运算符。而 `boost::is_reference` 可用于确定一个类型是否为引用。\n\
  \nboost::is_integral` 和 `boost::is_floating_point` 是互斥的。一个类型要么存储整数，要么存储浮点数。然而，`boost::is_arithmetic`\
  \ 和 `boost::is_reference` 可以适用于多个类别。例如，整数类型和浮点类型都支持算术运算。\n\n来自 Boost.TypeTraits\
  \ 的所有函数都通过 `value` 提供结果，该结果为 `true` 或 `false`。[示例 48.1, “确定类型类别” 对 `is_integral<int>`\
  \ 和 `is_arithmetic<int>` 输出 `true`，而对 `is_floating_point<int>` 和 `is_reference<int>`\
  \ 输出 `false`。由于所有这些函数都是模板，因此在运行时不进行任何处理。该示例在运行时的行为就像在代码中直接使用了 `true` 和 `false` 值一样。\n\
  \n在示例 48.1, “确定类型类别”中，各种函数的结果是 `bool` 类型的值，可以直接写入标准输出。如果结果需要由函数模板处理，则应将其作为类型转发，而不是作为\
  \ `bool` 值。\n\n## 示例 48.2. `boost::true_type` 和 `boost::false_type`\n\n```cpp\n\
  #include <boost/type_traits.hpp>\n#include <iostream>\n\nusing namespace boost;\n\
  \nint main()\n{\n  std::cout.setf(std::ios::boolalpha);\n  std::cout << is_same<is_integral<int>::type,\
  \ true_type>::value << '\\n';\n  std::cout << is_same<is_floating_point<int>::type,\
  \ false_type>::value <<\n    '\\n';\n  std::cout << is_same<is_arithmetic<int>::type,\
  \ true_type>::value << '\\n';\n  std::cout << is_same<is_reference<int>::type, false_type>::value\
  \ << '\\n';\n}\n```\n\n除了 `value` 之外，Boost.TypeTraits 的函数还通过 `type` 提供结果。虽然 `value`\
  \ 是 `bool` 值，但 `type` 是一个类型。就像 `value` 只能被设置为 `true` 或 `false` 一样，`type` 只能设置为两种类型之一：`boost::true_type`\
  \ 或 `boost::false_type`。`type` 允许你将函数的结果作为类型传递给另一个函数。\n\n示例 48.2, “`boost::true_type`\
  \ 和 `boost::false_type` 使用 Boost.TypeTraits 的另一个函数 `is_same`。`is_same` 接收两个类型并检查它们是否相同。通过\
  \ `is_integral`、`is_floating_point`、`is_arithmetic` 和 `is_reference` 传递给 `is_same`\
  \ 的结果是 `true_type` 或 `false_type`。`type` 允许你将函数的结果作为类型传递给另一个函数。由于 `value` 只能设置为\
  \ `true` 或 `false`，`type` 只能设置为两种类型之一：`boost::true_type` 或 `boost::false_type`。`type`\
  \ 允许你将函数的结果作为类型传递给另一个函数。\n\n示例 48.2, “`boost::true_type` 和 `boost::false_type` 使用\
  \ Boost.TypeTraits 的另一个函数 `is_same`。`is_same` 接收两个类型并检查它们是否相同。通过 `is_integral`、`is_floating_point`、`is_arithmetic`\
  \ 和 `is_reference` 传递给 `is_same` 的结果是 `true_type` 或 `false_type`。`type` 允许你将函数的结果作为类型传递给另一个函数。抱歉，上述翻译逻辑出现了重复，为您重新翻译如下：\n\
  \n```cpp\n#include <boost/type_traits.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost;\n\nint main()\n{\n  std::cout.setf(std::ios::boolalpha);\n  std::cout <<\
  \ is_same<is_integral<int>::type, true_type>::value << '\\n';\n  std::cout << is_same<is_floating_point<int>::type,\
  \ false_type>::value <<\n    '\\n';\n  std::cout << is_same<is_arithmetic<int>::type,\
  \ true_type>::value << '\\n';\n  std::cout << is_same<is_reference<int>::type, false_type>::value\
  \ << '\\n';\n}\n```\n\n除了 `value` 之外，Boost.TypeTraits 的函数还通过 `type` 提供结果。虽然 `value`\
  \ 是一个 `bool` 值，但 `type` 是一个类型。就像 `value` 只能被设置为 `true` 或 `false` 一样，`type` 只能设置为两种类型之一：`boost::true_type`\
  \ 或 `boost::false_type`。`type` 允许你将函数的结果作为类型传递给另一个函数。\n\n示例 48.2, “`boost::true_type`\
  \ 和 `boost::false_type` 使用 Boost.TypeTraits 的另一个函数 `is_same`。`is_same` 接收两个类型并检查它们是否相同。通过\
  \ `is_integral`、`is_floating_point`、`is_arithmetic` 和 `is_reference` 传递给 `is_same`\
