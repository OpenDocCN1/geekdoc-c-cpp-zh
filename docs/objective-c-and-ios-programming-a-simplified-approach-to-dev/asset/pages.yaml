  md: '# Playing Video


    So far, we''ve learned how to add images and audio to an app. Now we''ll work
    with the eye-catching part of any multimedia app—video. An instance of the MPMPlayerControl
    class is used to handle movie playback, either from a file or a network stream.
    The video is displayed in a view that is owned by the instance of the MPMPlayerController,
    which facilitates the programmatic control of movie playback. The various methods
    of the MPMPlayerControl class make it easy to programmatically incorporate basic
    functionality of movie playing, such as starting, stopping, and pausing. Before
    we can incorporate video into an app, we must first copy the video file into the
    Supporting Files folder. By simply changing the contentURL of the MPMPlayerControl
    class, you can play a different movie using the same player object. Note, however,
    playing simultaneous videos is not possible. Video formats supported by MediaPlayer
    framework includes .mp4, .3gp, .mov, and .mpv.


    # Adding Video to an App


    The following steps summarize the process of adding video to an app:


    +   1. Add the MediaPlayer framework to the project.

    2. Import the MediaPlayer framework into the @interface file.

    3. Add the video file to the Supporting Files folder.

    4. Create the path to the video file and inform the compiler of the type of video
    file.

    5. Set the file''s URL to the video file.

    6. Create an instance of the MPMPlayerController class.

    7. Select the playback mode to either full screen or embedded in a view.

    8. Set the delegate.

    9. Program the Play/Stop button using the play and stop methods of the MPMPlayerController
    class.


    # Creating an App that Plays Video


    Now we will create a simple application that will play videos. To complete this
    app, you need the snuggles-Clip.mov video file included with the data files for
