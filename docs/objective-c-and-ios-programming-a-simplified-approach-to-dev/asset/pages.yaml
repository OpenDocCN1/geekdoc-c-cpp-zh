  md: '# CHAPTER 13 Creating Multimedia Apps with Images and Sound


    In the previous chapters we have learned how to display data views, in the form
    of lists using tables, in tabbed applications and in picker views. Although we
    used icons for a tab in a tabbed application, we have mostly dealt with textual
    data and have not done much with images, sounds, or videos. In this chapter we
    will learn to add images, sound and video to an application.


    **Note:** To complete the examples and exercises in this chapter, you need to
    download the data files provided for this chapter. Go to the CengageBrain.com
    home page, and search for this book''s ISBN (found on the back cover). This will
    take you to the product page for this book, where you will be able to download
    the data files.


    # Adding Images to an App


    Images are a form of data and play a very important role in conveying information
    in everyday life. They play a critical role in the communication of information.
    Adding images to an app is accomplished by dragging an image view from the Object
    Library onto the view.


    Let''s create an app that displays images of a cat. To complete this app, you
    will need the Cat1.jpg and Cat2.jpg image files included with the data files for
    this chapter.


    +   1. Create a new Xcode project.


    +   2. In the Choose template for your new project dialog, select Application
    under “iOS,” select Single View Application, and then click the Next button.


    +   3. In the Project options dialog, type Mr. Snuggles as the Product name, enter
    appropriate items in the Organization Name and Company identifier boxes, make
    sure iPhone is selected in the Devices box, select the Use Storyboards check box,
    and the Use Automatic Reference Counting box.


    +   4. Click the Next button, and then save the project in the location of your
    choice.


    +   5. In the navigator area, on the left, click MainStoryboard.story. This opens
    the Interface Builder, which displays the project''s single view controller.


    +   6. In the Object Library search for image view. As you start typing “image
    view” in the search box of the Object Library, you will see the image view show
    up in the Object Library as seen in Figure 13-1.'
