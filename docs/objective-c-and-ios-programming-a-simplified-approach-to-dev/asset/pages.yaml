  md: '# CHAPTER 9 Understanding Creating User Interfaces


    In Chapter 8, we learned how to create apps using the single view template, which
    provides a single view controller and the viewController.xib file. In this chapter,
    we learn how to create an app with multiple view controllers, using storyboards.
    We will create basic apps using interface elements, learn how to use storyboards
    , explore how to pass data between views.


    # UIKit Framework


    The UIKit framework, illustrated in Figure 9-1, is the most important framework
    in the design and building of an interactive interface. It consists of a set of
    classes that begin with the prefix "UI." These classes manage the application
    object, event handling, windows, views, and all the controls that help create
    an interactive touch screen user interface. These classes, in turn, help create
    and manage views, view controllers, and user interface elements.


    Taken as a whole, these classes allow the developer to create an interactive,
    touch-sensitive app. The most commonly used classes are UIApplication, UIWindow,
    UIView, UIViewController, UIEvent, UITouch, UIResponder, UIButton, UILabel, and
    UITextField.


    | UIColor | UIApplication | UILabel | UIButton |

    | --- | --- | --- | --- |

    |'' | UIView | | UIPicker |

    | UIResponder | UIControl | UIDDatePicker |

    | | ViewController | | UIPageController |

    | UIImage | | UISegmentedControl |

    | UITouch | | UITextField |

    | UIEvent | | UISlider |


    Figure 9-1 UIKit Framework

    © 2015 Cengage Learning.


    # Storyboards


    Storyboarding is a feature that allows the developer to work with all the views
    in the Xcode pane, or Interface Builder canvas, at one time. You drag and drop
    view controllers into the Xcode editor pane, and connect them via controls as
    buttons, labels, and text fields.


    Storyboards make it easy to understand the transitions, segues, between views,
    giving you a broad overview of the app. A scene is a screen of content, which
    can be a view. As you will see later in this chapter, you can create a segue between
    views by control-dragging a control from one view onto another.


    When you have a large number of views displayed at one time, the Xcode window
    can get crowded. To avoid this problem, it is useful to use a large monitor when
    working with storyboards. Note that you can also use the icon seen in Figure 9-2,
    which is located at the bottom-right corner of the editor pane in Xcode, to zoom
    in and out of a storyboard. The figures in this book show the screen at varying
    zoom levels, depending on what is emphasized in the figure.'
  merge: -1
