  md: '# Working in the iOS Environment


    This book is designed to teach Objective-C and iOS programming. So far we have
    learned the fundamentals of Object-C language, which is the language of iOS programming.
    Now we will shift our focus to iOS programming. To understand iOS programming,
    we need to learn about Cocoa Touch, is a significant part of iOS and uses Objective-C
    as its language of communication. We will start by examining the platform, exploring
    the basics of iOS programming and its elements and inspecting the architecture
    of iOS. We will learn about controls, IBOutlet and IBAction connections while
    creating a simple app.


    # iOS Platform and Architecture


    iOS is the operating system for Apple''s mobile devices, such as the iPhone, iPad,
    and iPod. It is a mean of communication between the hardware and the software
    on the apple mobile devices, connecting the hardware to the higher-level services
    provided by the devices.


    The iOS architecture is divided into four layers of varying functionality and
    complexity. The lower layers provide services with the most basic functionalities,
    while the highest layer provides more complex services, incorporating object-oriented
    features, encapsulation, and abstraction of services. The layers are composed
    of frameworks, some of which access the hardware, forming the infrastructure for
    mobile apps.


    # Frameworks


    Frameworks form the infrastructure for each of these layers. A framework is a
    set of libraries and services, similar to Java libraries that assist in the development
    of apps. These frameworks contain methods that can be implemented by the developers.
    Some of the types of rigidalities provided by the frameworks are data, user interface,
    location, graphics, motion, image, and media. Two of the most important frameworks
    are the Foundation framework, and the UIKit framework.


    As discussed in Chapter 6, the Foundation framework provides development tools,
    such as NSString, NSDictionaries, and NSData. All of these objects inherit from
    the NSObject class. The UIKit framework provides tools for developing user interfaces.
    It is one of the most used frameworks in the entire family of frameworks provided
    by Apple. Any task that has to do with the user interface is handled by the UIKit
    framework. Likewise, any data input by the user or displayed on the screen is
    handled by the UIKit framework.


    # Role of Cocoa Touch and iOS layers


    The four layers of iOS are Cocoa Touch, Media, Core Services, and Core OS. Each
    of these layers is supported by a set of frameworks, such as the UIKit, Foundation,
    Game Kit, iAD Kit, and the iMap Kit. Figure 8-1 illustrates the architectural
    layers of iOS.'
  merge: -1
