  md: '# CHAPTER 2 Launching and Getting Started


    iOS is a mobile operating system developed by Apple for use on the iPhone, iPad,
    and iPod. To develop iOS apps, you need the following:


    +   - An Intel-based Mac running OS X Snow Leopard or later.


    +   - A user ID as a registered Apple developer or as member of the iOS developer
    program. You will learn more about these two developer options later in this chapter.


    +   - The ability to program in Objective-C, which is the programming language
    used to create iOS applications.


    +   - iOS SDK (Software Development Kit), the software development environment
    designed by Apple for iOS, which includes the following:


    +   The integrated development environment Xcode, in which you can write, test
    and develop Objective-C code.


    +   iOS Simulator, which allows you to test an app as if it were running on an
    iPhone or iPad.


    +   Cocoa Touch, which is the programming framework of Objective-C and therefore
    iOS. A programming framework is the underlying platform for a programming language,
    providing, among other things, libraries, tools, and more.


    This chapter introduces you to iOS, explains the two developer programs, and provides
    a tour of Xcode, the integrated development environment you will use to write
    Objective-C. The chapter walks you through the steps of writing, saving, and running
    a simple Objective-C program in Xcode. You will use the skills you learn in this
    chapter to write more complicated Objective-C code in Chapters 2 through 7. Starting
    in Chapter 8, you will use your new familiarity with Objective-C to learn to develop
    apps that can run on Apple''s mobile devices.


    Note that you do not need an iPhone, iPad, iPod, or other mobile device to learn
    iOS programming. Instead, you will use the iOS Simulator, built into Xcode, to
    mimic a mobile device running your apps.


    # Introduction to iOS


    The iOS mobile operating system, which was initially called the iPhone Operating
    System (iOS), is developed and distributed by Apple. It is used by developers
    around the world to create mobile applications, or apps, which are then made available
    to users via Apple''s App Store. The App Store is built into OS X Mountain Lion,
    Apple''s most recent system. According to Apple, the App Store is the world''s
    largest entertainment store with more than 800,000 apps. These apps have been
    tested for malware by Apple before they are made available for sale in the App
    Store. The possibilities for apps are limitless, providing infinite opportunities
    for development.


    The iOS platform has a very powerful foundation derived from OS X, the operating
    system originally designed for the Mac, sharing technologies such as the kernel,
    networking and programming frameworks. Like OS X, iOS is written in Objective-C.
    Cocoa Touch,'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Registering as a Developer


    the programming framework of OS X and iOS, includes interactive Multi-Touch

    ologies that allow a developer to create applications that respond to the user
    touching a

    device''s. Like OS X and iOS, Cocoa Touch is implemented in Objective-C. For this

    reason, it is essential to learn Objective-C. Objective-C is the language for
    programming in

    the environment.


    Objective-C is an object-oriented programming language that runs at fast speeds
    while

    deploying dynamic runtime. Objective-C is an offshoot of the procedural programming

    language C. In essence, if you add-object programming to C, you get Objective-C.

    Another important aspect of Objective-C is that, unlike other programming languages,

    methods in Objective-C are sent rather than called or invoked.


    Most of C programming language syntax applies to Objective-C as well. Hence the

    programming language concept of headers translates into the concept of @Interface

    and @implementation files. The @Interface file holds the instance variable, properties,
    and

    method declarations, whereas the @implementation file holds the method implementations.

    All properties are also synthesized in this file. The @Interface file has a suffix
    of .h and

    t@implementation file has a suffix of .m.


    # Registering as a Developer


    Apple provides a tremendous amount of support for iOS apps, with

    documentation on programming and other help for programmers. In order to gain
    access

    these supports, you need to register with Apple. When registering, you have two
    options:

    registered Apple developer and iOS developer. To complete the exercises in this
    book, you

    need to register as one or the other.


    # Registering as an Apple Developer


    Registering as an Apple developer is the simplest option. You simply register
    with Apple,

    without having to pay any fee. You are required to have an Apple ID (just as you

    to purchase music or apps in the iTunes Store). Registering as an Apple developer

    gives you access to developer resources such as online documentation and tutorials,
    and also

    allows you to download Xcode for free. However, iOS simulator is not fully for

    Apple developers. Features such as the camera and video recording cannot be tested
    in iOS

