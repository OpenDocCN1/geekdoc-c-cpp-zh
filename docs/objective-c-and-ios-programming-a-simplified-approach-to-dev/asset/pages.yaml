    7. Now we will implement the GoToTableView IBAction method in the ViewController.m
    file. In order to do this, we have to create an instance of the table view controller,
    associate a transition style with it, and finally present the table view controller.
    This requires the following code:


    ```

    (IBAction)GoToTableView:(id)sender {

    // create an instance of the table view controller

    UITableView *tvc = [[UITableView

    alloc] init];


    // assign a transition style

    tvc.modalTransitionStyle = UIModalTransitionStyleCrossDissolve;


    // present the table view controller

    [self presentViewController:tvc animated:YES

    completion:nil];

    \}

    ```


    8. Now that we have a means of going from the view controller to the table view
    controller, we need to create a transition from the table view controller back
