  md: '# Creating a Master-Detail Application Example


    Table view cells have four optional styles:


    +   - UITableViewCellCellStyleBasic, the default style, includes a title.

    - UITableViewCellCellStyleSubtitle has a title, subtitle, and an optional left-aligned
    image.

    - UITableViewCellCellStyleRightDetail has a left-aligned title, a right-aligned
    subtitle, and does not permit images.

    - UITableViewCellCellStyleLeftDetail has a right-aligned title with indent, a
    left-aligned subtitle, and does not allow images.


    Xcode provides a template that helps the developer create a detail view. This
    template, called the Master-Detail Application template, provides an initial UIViewController
    class, as well as a storyboard for scenes and segues in the user interface. The
    Master-Detail Application template is an ideal starting point for creating and
    navigating through a hierarchy of table views.


