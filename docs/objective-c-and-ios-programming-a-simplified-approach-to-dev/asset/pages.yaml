  md: '# Summary


    +   A tab bar view is another allows for specialized view in iOS programming that
    displays tabs in a radio-style and for multiple view transitions from each individual
    tab.


    +   If you are creating an app without using storyboards, the tab bar controller
    is created in the didFinishLaunchingWithOptions method of the appDelegate.file.


    +   Some of the most important methods in the implementation of the dubbed applications
    in apps with .xib files are the viewDidLaunch method of the appDelegate.m file
    and the initWithName method of the individual view controllers.


    +   When using storyboards, you drag and drop the tab bar view controller from
    the Object Library into the editor pane. You drag and drop the individual tab
    bar items onto each view, and set a specific value for each tab.


    +   A picker view is a spinning wheel that resembles a slot machine. The user
    can spin the wheel and select a specific value. A picker restricts the user to
    specific possibilities, thereby preventing the user input from making erroneous
    data entries.


    +   The data for the picker view is usually stored in an array. The picker view
    is similar to a two-dimensional array. Each column is a component and has an index
    value. Each row in a component also has an index, which is equivalent to the index
    value of its corresponding array.


    +   The tasks performed by the picker require a data source and delegate. The
    delegate in the picker view helps create and manage the components, while the
    data source provides and manages the data of the picker view.


    +   Two of the required methods in the implementation of the data source are the
    numberOfComponentsInPicker numberOfRowsInComponent methods. The first informs
    the compiler of the number of wheels in the picker view. The second informs the
    compiler of the number of elements/rows in the components, which is equal to the
    number of items in the component.


    +   The titleForRow method is the required method for the implementation of the
    delegate. The titleForRow method provides the contents of each row of a given
    component of the picker view.'
