  md: "# Types of Loops\n\nA programmer needs to execute lines of code repeatedly.\
    \ The mechanism of looping makes this possible. Objective-C allows for three main\
    \ types of loops: the for loop, the while, and the do-while loop. These loops\
    \ can be classified as counter-controlled or condition-controlled. If the number\
    \ of iterations is known, the counter-controlled loop is used, and if there is\
    \ no knowledge of the number of iterations, then the condition-controlled loop\
    \ is implemented.\n\nHow do you know if you need to include a loop in your program?\
    \ A loop is usually necessary if a group of statements is to be executed repeatedly\
    \ until a specific condition is met. It is helpful to start by examining an example\
    \ that does not include a loop. We then discuss how the example could be made\
    \ more efficient through the introduction of a loop. Example 4-1 calculates the\
    \ average score for a student in a semester.\n\n# Example 4-1\n\n```\n# import\
    \ <Foundation/Foundation.h>\nint main(int argc, const char * argv[]) {\n{\n  \
    \  double subjectOne = 90;\n    double subjectTwo = 70;\n    double subjectThree\
    \ = 65;\n    double avg = (subjectOne + subjectTwo + subjectThree)/3;\n    NSLog(\"\
    The average score for the student is: %f\", avg);\n    return 0;\n}\n```\n\nOutput\
    \ for Example 4-1\n2017-03-19 20:52:48.298 ch4.1[9351:303] The average score for\
    \ the student is: 75\n\nExample 4-1, the average score for the three courses you\
    \ know is calculated by dividing the sum of the three scores by 3. This approach\
    \ is fine if you know for certain that you will only need to average three scores\
    \ in the future. However, as you see in Example 4-2, the introduction of a for\
    \ loop makes it possible to average more or fewer scores. Note that if there is\
    \ only one statement in the for loop, then there is no need for the braces to\
    \ be repeated.\n\n# Example 4-2\n\n```\n# import <Foundation/Foundation.h>\nint\
    \ main(int argc, const char * argv[]) {\n{\n    double sum = 0;\n    int numOfScores\
    \ = 0;\n```"
