    # Summary


    +   - Data persistence is the ability to save data in an app so that the data
    is available the next time the app is launched.


    +   - The type and size of data usually dictates the type of mechanism utilized
    to achieve data persistence.


    +   - The most commonly used data persistence mechanisms are:


    +   - NSUserDefaults


    +   - Property lists (or plists)


    +   - Archiving


    +   - SQLite'
