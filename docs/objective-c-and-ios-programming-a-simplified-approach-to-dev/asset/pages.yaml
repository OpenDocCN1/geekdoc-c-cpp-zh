  md: 'Functions are a fundamental programming concept. They facilitate code modulation
    by grouping lines of code that are specific to a task. These chunks of code provide
    a means of dividing and conquering the code. Some of the benefits of functions
    are that they add modularity and provide code separation based on a task. The
    isolation of code into chunks also helps with debugging, making it easier to track
    and fix syntax errors as well as semantic/logic errors.


    # An Introduction to Functions


    A function consists of a declaration and a body. The declaration consists of three
    parts: (1) the return type, which defines the type of data the function will return;
    (2) the function name, which is unique to each function; and (3) the parameters
    list in parentheses—that is, the data types are passed to the function. The body
    of the function takes the data from the parentheses, does what it needs to do,
    and returns data of the type defined as the return type in the declaration. An
    example of a function is the main function, where the program execution starts.
    When you run a program, the compiler looks for the main function to start execution;
    if the main function is missing then nothing is executed.


    The syntax of a function is as shown here:


    # SYNTAX


    ```

    <return_data_type> <function_name> (<arg1_data_type> <arg1>, <arg2_data_type>
    <arg2>, ...);

    ```


    The following list explains the parts of a function:


    +   * <return_data_type> specifies the type of data the function will return.
    If there is no value being returned, this is specified as void. By default, a
    function is assumed to return an int.

    * <function_name> specifies the function''s unique name, which is used to call
    the function. The name of each function should be unique. By default, a function
    is global and can be called from within the main function or any other function.

    * <arg1_data_type> specifies the data type of the argument that is passed to the
    function should have a data type. These data types can be basic or derived.

    * <arg1> specifies the name of the variable that is being passed to the function.
    Note that unlimited number of variables can be passed to a function.'
