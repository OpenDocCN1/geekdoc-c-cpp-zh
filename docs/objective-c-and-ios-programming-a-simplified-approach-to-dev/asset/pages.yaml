    time the user selects a pain level. In this chapter we will use SQLite to incorporate
    some data persistence features.


    Modify the first view so the user can enter the pain journal items, such as the
    pain level, and the date and time of entry. The first view should also have the
    ability to display the pain items entered in the journal. When the user selects
    the Pain Level tab, the second view should display a picker view where the user
    can select a pain level. When the user selects the History tab, the second view
    should display all the pain levels entered so far in a table view format. Save
    the data in a SQLite database.'
