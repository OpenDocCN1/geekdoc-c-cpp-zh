  md: '# Features of the Book


    Chapter 13 explores the process of adding images, sound, and video to apps. To
    complete the examples and exercises in this chapter, students need to download
    the necessary data files from the CengageBrain home page.


    Chapter 14 discusses various means of creating apps that can store and retrieve
    data.


    Appendix A explains how to use the debugger.


    # Features of the Book


    Each chapter in Objective-C and iOS Programming: A Simplified includes the following
    features:


    +   - Objectives—This bulleted list of major topics covered in the chapter serves
    as a useful study aid.


    +   - Step-by-Step Instructions—Numbered steps walk you through the process of
    creating apps. These steps include full-color code examples and specific instructions
    explaining exactly how to interact with the Xcodes interface.


    +   - Screenshots—Plentiful screenshots allow you to check your work as you follow
    the chapter''s numbered steps.


    +   - Conceptual figures and tables—Diagrams clarify programming concepts and
    tables give you at-a-glance summary of useful information.


    +   - Key terms—Important terms are formatted in bold.


    +   - Hands-On Lab—This detailed, step-by-step lab walks you through the process
    of creating an app that incorporates all the major concepts covered in the chapter
    examples. The chapter examples, the Hands-On Lab includes plentiful screenshots
    to help you check your work.


    +   - Summary—This end-of-chapter list recaps the programming concepts and techniques
    covered in the chapter so that you have a way to check your understanding of the
    main points.


    +   - Exercises—Multiple-choice and true/false questions encourage you to review
    key concepts covered in the chapter.


    +   - Programming Exercises—These programming problems require the student to
    use the techniques and concepts explained in the chapter to create a variety of
    apps. Students are encouraged to work through the problems and have instructors
    check their work against the solution files.


    +   - Business Case Study—This continuing exercise, which builds on work done
    in preceding chapters, focuses on building and expanding on a useful business-related
    app in Chapters 1 through 7, and a medical-related app in Chapters 8 through 14.'
