  md: '# NSUserDefaults Class


    An object of the NSUserDefaults class is created in the viewDidLoad method as
    follows:

    // Create an instance of the NSUserDefaults

    NSUserDefaults *ud = [NSUserDefaults standardUserDefaults];


    +   Methods commonly used to set the values of the key-value pair include the
    following:

    - setBool:forkey:

    - setFloat:forkey:

    - setInteger:forkey:

    - setObject:forkey:

    - setDouble:forkey:


    As the values of the data variables change, a built-in synchronize method is automatically
    invoked to update data defaults frequently. The developer may choose to manually
    synchronize the defaults as well to ensure the updated values are saved.


    # Writing Data to a NSUserDefaults Object


    The following steps summarize the process of writing data to a NSUserDefaults
    object.


    +   1. Instantiate an NSUserDefaults object.

    2. Use one of the set methods of the NSUserDefaults class to populate the key
    value pairs of the NSUserDefaults object.

    3. Synchronize the NSUserDefaults instance to update the data.

    4. To retain data, read the saved data in the viewDidLoad method.


    # Creating a NSUserDefaults Example App


    Now-let create an example app in which string is saved using the NSUserDefaults
    class.


    +   1. Create a project named NSUserDefaultsExample using the Single View Application
    template. Make sure you use the Storyboards and the Use Automatic Reference Counting
    boxes.

