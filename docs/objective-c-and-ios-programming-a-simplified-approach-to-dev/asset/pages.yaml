    # Summary


    +   - Looping provides an efficient means of executing a set of instructions repeatedly.

    - There are two main types of loops: counter-controlled and condition-controlled.

    - The for loop is a type of counter-controlled loop, in which the number of iterations
    is fixed.

    - The while and the do-while are condition-controlled loops.

    - The while loop tests for a condition and terminates when the condition is satisfied.

    - The do-while loop is a variation of the while loop in which the set of instructions
    is executed at least once before the condition is tested.

    - Nesting of for loops facilitates complex problem solving.

    - The break statement is used to exit a loop.

    - The continue statement enables the termination of an iteration in the middle
    of the execution and moving on to the next iteration.


