  md: '# Preface


    This book provides a basic foundation in the exciting field of iOS app development.
    With the advent of smartphones, applications have shifted to the mobile platform,
    promising ease and practicality, and a huge potential for further growth. So it
    makes sense for programmers to develop expertise in this to increase their marketability.
    As the popularity of Apple devices continues to grow, professionals trained in
    iOS programming will be especially employable.


    # Approach


    To learn how to create iOS apps, you first need to learn how to program in Objective-C,
    the language underlying iOS. Most books on the market are specific either Objective-C
    programming or iOS programming, making it difficult to teach app development in
    the course of one semester. This single book covers the necessary topics in both
    Objective-C and iOS programming, so students can get to right creating iOS apps.


    Numerous books on Objective-C and iOS programming are available, but none take
    the simplistic approach offered by this book, which includes abundant screenshots,
    examples, review questions, Programming Exercises, Hands-On Labs, and Business
    Case Studies, along complete solutions.


    To use this book successfully, no prior knowledge of iOS development is required.
    However, it would be helpful to have knowledge of at least one object-oriented
    programming language. New programmers should also be able to use this book, assuming
    an instructor is available to offer help when necessary.


    Because this is an introductory book, it does not touch on higher level techniques
    that would be affected by the latest version of iOS in use. Thus, the screenshots
    and code samples in this book were created using iOS 6, they are compatible with
    iOS 7, and should remain compatible with subsequent versions of iOS.


    # What This Book Is


    This book introduces the concepts required to create simple apps that can run
    on Apple devices, providing step-by-step guidance, with plentiful screenshots
    to allow you to check your work. Chapters 1-7 cover the relevant topics in Objective-C,
    walking you through the steps required to write simple Objective-C programs. Chapters
    8-14 introduce you to full-blown iOS programming, stepping you through the process
    of designing and programming an app interface. Throughout this book, you will
    write code and create app interfaces using Xcode, Apple’s integrated development
    environment for iOS.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# What This Book Is Not


    This is not a resource book. It is not designed for advanced iOS developers and
    hence does not cover advanced topics in iOS. After you''ve mastered the basics
    explained in this book, you can find more detailed information about iOS programming
    online.


    # Organization and Coverage


    Chapters 1 through 7 explain how to write simple programs in Objective-C. In Chapters
    8 through 14, use your new familiarity with Objective-C to develop iOS apps that
    can run on Apple devices.


    Chapter 1 introduces iOS, explains Apple''s two developer programs, and provides
    a guided tour of Xcode, the integrated development environment you will use to
    write Objective-C code. The chapter walks you through the steps of writing, saving,
    and running a simple Objective-C program in Xcode.


    Chapter 2 covers variables and constants, data types, and arithmetic expressions.


    Chapter 3 introduces decision and conditional statements, which are statements
    that decide which part of a program will execute at any given time.


    Chapter 4 explores looping and repetition mechanisms such as the for, while, and
    do statements. It also explains how to nest one loop statement inside another.


    Chapter 5 covers the fundamental programming concept of functions, which makes
    it possible to make a program modular, separating code based on tasks.


    Chapter 6 focuses on the Foundation Framework, which is unique to Objective-C.
    It discusses the utility classes that Apple has provided in an attempt to create
    consistency in all the domains of the language.


    Chapter 7 explores object-oriented programming concepts, such as classes and objects,
    encapsulation, inheritance, methods, and interface.


    Chapter 8 explores the iOS platform, exploring the basics of iOS programming and
    the architecture of iOS. This chapter introduces controls, Outlets and IBActions,
    while explaining how to create a simple app interface.


    Chapter 9 focuses on using storyboards and creating apps that allow the user to
    pass data between multiple view controllers.


    Chapter 10 deals with transitions without using storyboards, and passing data
    from view 1 to view 2 with and without delegates.


    Chapter 11 teaches how to display data in the form of lists using table views,
    and without storyboards.


    Chapter 12 introduces tab bar controllers and picker view controllers, with and
    without storyboards.'
