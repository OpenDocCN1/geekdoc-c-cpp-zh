    # Passing Data Between Views


    So far we have learned to transition from one view to another. Now we will learn
    to pass data between the views. In this example, we will create a storyboard project
    with two view controllers that passes data from the first view controller to the
    second view controller. This app will allow the user to enter two numbers and
    then touch Sum to display a new view that displays the sum in a label.


    +   1. Create a Single View Application project. Make sure to select the Use Storyboards
    and the Automatic Reference Counting check boxes. Name this project PassingDataBetweenViews.


