  md: "# Return Type\n\nThe return type is the type of data the function will return\
    \ when executed. This data type can be a basic data type, such as int, char, double,\
    \ float, or a derived data type such as pointers, structures, and enums. The called\
    \ function should have a similar data type variable to hold the value the function\
    \ will return. If the function does not return a value, then it is defined as\
    \ void, as in Example 5-2.\n\nLooking back to Example 5-4, the function that adds\
    \ two numbers (line 18) returns an int data type. The main function includes an\
    \ int variable called result that stands ready to accept the add function's return\
    \ value. Functions can only return one value of the return data type.\n\n# Passing\
    \ Parameters\n\nTo perform the task for which it was created, a function may require\
    \ data. The data can be passed to the function in parentheses (after the function\
    \ name). You can pass as many parameters to a function as you wish. These parameters\
    \ can be of any basic or derived data type. The parameters in the function definition\
    \ are called formal parameters; when the function is called, the actual parameters\
    \ are passed to it. In Example 5-3, two integers, n1 and n2, are the parameters\
    \ passed to the function. In Example 5-5, the main function prompts the user for\
    \ three numbers (line 7). The function is then invoked on line 9. Execution jumps\
    \ to the average function (line 15) which calculates the average of the three\
    \ numbers; execution is calculated and stored in the variable avg. Execution continues\
    \ to the next line (line 10), which displays the result returned to the main function.\
    \ The return type in this case is a double. The parameters passed to the average\
    \ function are of type double as well. Note that the parameters passed to the\
    \ average function in line 15 are the formal parameters; the parameters passed\
    \ to the average function in line 9 are the actual parameters.\n\n# Example 5-5\n\
    \n```\n#import <Foundation/Foundation.h>\ndouble average(double n1, double n2,\
    \ double n3)\nint main (int argc, const char *argv[])\n{\n    @autoreleasepool\
