    | == | equal to |

    | != | not equal to |


    Table 3-1 Relational Operators


    # Assignment and Test for Equality Operator


    Before we discuss conditional statements, we need to understand the difference
    between the assignment operator (=), which was introduced in Chapter 2, and the
    test for equality operator (=) assigns a value to a variable and has no return
    value. For example, a = 6; means a is equal to 6. Likewise, label = ''C''; the
    string label is equal to the character C.


    The test for equality operator (==) is used to test for equality in a condition,
    and is used in if-else statements. It has a Boolean return type—that is, it returns
    true or false. For example, a = 6; checks to see if a is equal to 6. Likewise,
    label == ''C''; means the variable label is equal to the character C.


    # if Statement


    An if statement tests for a condition and allows the selection of a block of code
    based on the condition tested. The if statement facilitates control of execution
    of code offering more than one choice of flow of execution. For example, if(score>90)
    { grade = ''A''}; checks to see if score is greater than 90 and, if it, assigns
    an ''A'' to the variable grade. The assignment of ''A'' is only executed if the
    grade is greater than 90, offering a means of controlling the flow of execution.


    # if-else Statement


    An if-else statement is used to execute one chunk of code if a certain condition
    is true and another chunk of code if the condition is not true.


    Since the if-else statement is a functionality that comes to Objective-C via the
    C language, true is equivalent to 1, while false is a 0, just as in the C language.'
