    \n# Picker View\n\nA picker view is a spinning wheel that resembles a slot machine.\
    \ The user can spin the wheel and select a specific value. A picker restricts\
    \ the user to specific possibilities, thereby preventing the user input from making\
    \ erroneous data entries. The picker view class is used to create an instance\
    \ of the picker view. The selection of a value on the picker is an event. You\
    \ can program this event to perform specific tasks, such as transitioning to another\
    \ view, performing a calculation, or displaying data.\n\nA picker view can have\
    \ multiple wheels, with each wheel is referred to as a component. Each component\
    \ can have multiple rows. Each component of the wheel is stored in an array, with\
    \ the rows in a component corresponding to the rows of the array. In general,\
    \ a picker view is"
  merge: -1
  pgno: 391
- img_proc: true
  md: '# Picker View


    similar to a two-dimensional array. Each column is a component and has an index
    value. Each row in a component also has an index, which is equivalent to the index
    value of its corresponding array. The tasks performed by the picker require a
    data source and delegate.


    # Using a Delegate and a Data Source with a Picker View


    The delegate in the picker view helps create and manage the components, while
    the data source provides and manages the data. In order for a picker view to utilize
    the delegate and the data source, it has to adopt the protocols for the delegate
    and the data source, and also implement the required methods.


    Two of the required methods in the implementation of the data source are:


    +   * numberOfComponentsInPickerView

    * numberOfRowsInComponent


    The numberOfComponentsInPickerView method informs the compiler of the number of
    wheels in the picker view; while the numberOfRowsInComponent method informs the
    compiler of the number of elements/rows in the components. (This is also equal
    to the number of items in the component.)


    The required method for the implementation of the delegate is the titleForRow
    method. This method provides the contents of each row of a given component of
    the picker view. You must explicitly implement the delegate and the data source
    in the @interface directive for the view controller picker view resides. When
    a particular row is selected in a given component, the didSet method is implemented
    to perform tasks that are triggered by the selection of a row. The data for the
    picker view is usually stored in an array. The initialization of these arrays
    is in the viewDidLoad method for the view controller where the picker view resides.


    The following steps summarize the process of implementing a picker view:


    +   1. Select the view controller in which you would like to add the picker view.

    2. Drag the picker view object from the Object Library to the selected view controller.

    3. Connect the picker view to an IBOutlet in the view controller.

    4. Explicitly adopt the delegate and the protocol in the @interface directive
    of the view controller.

    5. As we are using an array to populate the components of the picker view, create
    the array''s properties in the @interface file and synthesize them in the @implementation
    file.

    6. Initialize the arrays in the viewDidLoad method.

    7. Code the numberOfComponentsInPickerView method to inform the compiler of the
    number of components in the wheel.

    8. Code the numberOfRowsInComponent method to inform the compiler of the number
    of rows in the wheel.

    9. Code the titleForRow method to populate the wheel.'
