  md: '# Playing Audio


    AVAudioPlayer class. That means we need to add the AVFoundation framework and
    then

    Import the AVFoundation/AVFoundation.h.


    The audio formats supported by the AVFoundation framework include IMA4, AAC, and

    MP3. The AVFoundation framework''s AVAudioPlayer class provides a simple Objective-C\audio
    player interface for playing sounds of any duration from files or memory buffers.
    This

    class also provides the capability to play multiple sounds. Before an audio player
    can play

    audio, you must assign a sound file to the audio player, prepare the audio player
    and

    designate an audio player delegate for handling interruptions. Configuring the
    audio player

    entails creating a string object that holds the path to the sound file, and creating
    and

    initializing a URL to the sound file using the path object.


    # Adding Audio to an App


    The following steps summarize the process of using the AVAudioPlayer class to
    play audio

    in an app:


    +   1. Add the AVFoundation framework to the project.

    2. Import the AVFoundation framework into the @interface file.

    3. Add the audio file to the Supporting Files folder.

    4. Create an instance of the AVAudioPlayer class.

    5. If you want the app to be able to handle interruptions, declare a delegate
    by

    implementing the following methods:


    +   - audioPlayerDidFinishPlaying: Returns a message that indicates

    if the playback completed successfully or not.


    +   - audioPlayerDecodeErrorDidOccur: Displays a message indicating the type of

    error that has occurred.

    - audioPlayerBeginInterruption: Handles interruptions such as phone calls.

    - audioPlayerEndInterruption: Continues playback after the interruption is over.


    +   6. Program a button to play or stop the audio using the play and stop methods
    of the

    AVAudioPlayer class.


    +   7. Set the volume property of the AVAudioPlayer class to control the volume.


    # Creating an App that Plays Audio


    Now let''s put these steps into creating an app that can play audio. To complete

    this app, you will need the violin.mp3 audio file included with the data files
    for this chapter.


    +   1. Create a new Xcode project.


    +   2. In the Choose template for your new project dialog, select Application
    under "iOS",

    select Single View Application, and then click the Next button.'
