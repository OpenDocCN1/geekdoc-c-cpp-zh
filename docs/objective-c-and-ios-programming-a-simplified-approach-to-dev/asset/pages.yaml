  md: "# SYNTAX\n\n```\nfor (counter initialization; counter test; counter\nincrement/decrement)\n\
    {\n    // this line will be executed based on the counter\n++}\n```\n\nThe initializations\
    \ for this type of loop are done in the loop declaration. For instance, consider\
    \ Example 4-3, which calculates the average score for 10 courses. The counter\
    \ is initialized to 0 and then tested for termination condition. In this case,\
    \ the counter is tested to see if it is less than 10. If i<10, then i is incremented\
    \ by one and the statements within the braces are executed as in Example 4-3.\n\
    \n# Example 4-3\n\n```\n#import <Foundation/Foundation.h>\nint main(int argc,\
    \ const char * argv[])\n{\n    double sum = 0;\n    int counter = 0;\n    double\
    \ score = 0;\n    for (int i = 0; i < 10; i++) {\n        NSLog(\"@@Please enter\
    \ a score:\");\n        scanf(\"%%f\", &score);\n        sum+=score;\n       \
    \ counter++;\n    }\n    double avg = sum/counter;\n    NSLog(\"@@The average\
    \ score is %.2f\", avg);\n    return 0;\n```\n\nOutput for Example 4-3\n\n2017-03-19\
