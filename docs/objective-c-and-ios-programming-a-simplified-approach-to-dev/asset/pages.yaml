    # HANDS-ON LAB


    In this Hands-On Lab, we will create an application that calculates the area and
    perimeter of a rectangle. The type of operation requested by the user (computation
    of the area or computation of the perimeter) will be passed from view controller
    1 to view controller 2. The area or perimeter is then calculated. After that,
    the result is sent back to view controller 1 using a delegate and protocol. This
    way we will be implementing both mechanisms of data transfer.


    # CREATE THE PROJECT


    +   1. Create a new Xcode project that is a Single Application, without storyboards,
    and with ARC and .xib files.

    2. Add a second view controller and its .h and .m files by adding a new Objective-C
    file with a subclass of UIViewController and name it SecondViewController.'
