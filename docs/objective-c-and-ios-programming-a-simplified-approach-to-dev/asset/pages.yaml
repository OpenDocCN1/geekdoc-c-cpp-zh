    # Programming Exercises


    To complete these Programming Exercises, you can use the media files included
    with the data files provided for this chapter, or you can download some media
    files of your choice from copyright-free sites on the web, or you can create your
    own media files using an iPhone, iPad, or other device. If you do use your own
    files, remember that you will be sharing your app with your instructor, and possibly
    with your classmates. Take care not to include files that reveal private information
    or that are inappropriate in any way.


    +   1. Create an app with a table view. Each row of the table view should contain
    the name of an animal and the image of that animal.


    +   2. Create an app with a list view of audio or video file icons. The user should
    be able to click an icon to play the corresponding audio or video file.


    +   3. Create an app that contains at least six clickable images in a grid. Clicking
    an image should play a sound.


    +   4. Create an arithmetic app. The app randomly generate two numbers and an
    operator, and then prompt the user for the answer. If the answer is correct, the
    app should display an image of a happy face and play a sound. Otherwise, it should
    display a sad face and play a different sound.


    +   5. Create an app that contains a list view with nine images. Clicking an image
    should display a larger view of the image.


    +   6. Create an app with a picker view that contains a list of seven different
    world regions. Clicking a region''s name should display a map of that region.
