  md: '# Passing Data Between View Controllers, Delegates, and Protocols


    In Chapter 9 we explored storyboarding. Storyboards allow us to display all view
    controllers in a single space, making it easy to pass the transitions and flow
    of logic. Storyboards are a tool of convenience, but they can make the flow of
    logic to be more complicated than it is, especially if you are not able to work
    on a large monitor. In this chapter, we learn to work with transitions without
    using storyboards. We will also learn how to pass data from view 1 to view 2 using
    a variable to store the data to be passed. Next, you will learn to pass data from
    view 2 to view 1 using delegates. Finally, you will learn how to dismiss the keyboard
    so it doesn''t interfere with the view.


    282


    # Role of View Controllers


    View controllers play a very important role in iOS applications by managing views.
    They provide a means of transitioning from one view to another and pass data from
    one view to another. When a touch event occurs in a view, a message is sent to
    the view controller of the view. Although the view is where the touch occurred,
    the view controller is expected to know how to handle the touch.


    A view controller can perform multiple actions. For instance it may present another
    view, go back to the previous view, perform some calculation, display an image,
    play a sound, or transfer data to another object.


    Multiple view controllers collaborate to create an efficient user interface. Although
    storyboards make it easy to understand these collaborations, it is essential to
    understand how the .xib files work. One of our first tasks is to learn how to
    transition from one view to another.


    # Presenting and Dismissing View Controllers


    When you transition from one view to another, the first view controller is said
    to present the second view controller. In simple words, presenting a view controller
    means making a view controller visible to the user.


    When a view controller is no longer needed, you can close it, or dismiss it. When
    a view controller is dismissed, the previous view becomes visible. The view controller
    that presented a view controller is usually the one to dismiss the same view.
    The code to dismiss a view controller is as follows:


    ```

    [UIViewController dismissModalViewControllerAnimated:YES];

    -(void)dismissModalViewControllerAnimated:(BOOL)animated

    ```


    When the dismissModalViewControllerAnimated method is called on the presented
    (second) view, the message is sent to the presenter (first) view controller to
    dismiss the presented view controller.


    # Creating Transitions Without Storyboards


    No matter how you create an app with multiple view controllers, each view controller
    has its own set of @interface (.h) and @implementation (.m) files. But whether
    or not you use storyboards to create the app determines whether the view controller
    also has a .xib file or'
