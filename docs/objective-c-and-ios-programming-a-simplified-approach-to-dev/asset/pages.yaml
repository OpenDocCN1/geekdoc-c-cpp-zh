    # Variable Scope


    Working with variables and functions, you need to keep in mind the scope, or visibility
    range of a variable. The scope of a local variable is within the set of curly
    braces in which it was declared. Global variables are declared outside of all
    the functions in the program, right after the import declarations. The scope of
    the global variables is limited to the entire program, meaning all the functions
    inside of this program can access this variable: Local variables, on the other
    hand, are seen only inside the function they are declared in and are invisible
    to the rest of the program. The parameters of a function are local to the function,
    with values of the actual parameters passed to the function. The parameters of
    the function live as long as the function is being executed. Once the function
    execution terminates the parameters turn invisible and cease to exist. The scope
    of the variables declared within a function is limited to the function itself.'
