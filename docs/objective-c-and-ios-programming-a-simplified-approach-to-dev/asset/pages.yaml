  md: '# Tab Bar View and Picker View Controls


    In the previous chapter we learned about table views and how data can be displayed
    in the form of a list that the user can edit. Table views are efficient for displaying
    large lists of data, because they allow the user to display additional information
    for each item. However, in some cases, you have a list that is too short to justify
    the use of a table view, or it may not be necessary to include the ability to
    display additional details about the items in your list. In addition, there may
    be situations where you would like to limit data entry to certain options to avoid
    data-entry errors. In such situations as these, tab bars can be helpful. In this
    chapter we will implement tab bar controllers and with storyboards, and add additional
    tabs to a tab bar controller. We will also learn how to implement the picker view
    controller and investigate the role of a delegate and a data source in a picker
    view.


    # Tab Bar View


    A tab bar is a specialized view that displays tabs in a radio style (that is,
    with tabs in the lower part of the screen next to each other) and allows for multiple
    view transitions from each individual tab. Each tab has its own distinct mode
    of operation. A tab bar view can have multiple tabs that possess control properties
    and can be used as buttons to transition to other views. Each individual tab leads
    to a view with varying functionalities.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_375_0.png)


    Figure 12-1 Tab bar application

    Copyright © 2014 Apple®. All Rights Reserved.'
