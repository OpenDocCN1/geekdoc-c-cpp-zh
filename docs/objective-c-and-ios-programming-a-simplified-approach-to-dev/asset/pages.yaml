  md: '# Summary


    The iOS architecture can be divided into four layers: Cocoa Touch, Media, Core
    Services, and Core OS.


    Cocoa Touch plays a very significant role in iOS by providing some of the complex
    capabilities in app programming as gesture recognition, animation, multitasking,
    and more.


    The Media layer provides the animation, graphics, video, audio, core graphics,
    core image, core text, core video, image GLKit, Quartz core frameworks, and more.


    The Core Services layer supports services that are utilized by the operating system,
    as location information, motion, event, and foundation services.


    Core OS layer supports low-level features such as security, Bluetooth technology,
    for extrenal accessories, networking, memory allocation, threading, and more.


    When an iOS app starts, a UIApplication object is created, and this UIApplication
    creates a UIWindow object and launches a UIView in the UIWindow object.


    The main function invokes the UIApplicationMain object, which loads the user interface
    and the event loop by creating the UIApplicationDelegate object, which manages
    the events.


    UIKit, Foundation, and the graphics frameworks are automatically loaded by Xcode
    since these are the most commonly used frameworks.


    Instruments is a development tool that the iOS SDK requires to test the performance
    of the app.


    iOS is used for testing apps, so that the developer does not have to test the
    app on the actual device.


    The Interface Builder is a visual development tool that can be used to create
    the view the user interacts with.


    A view controller is a visual interface that you can create using the Interface
    Builder in Xcode. A view controller mainly consists of interface elements, also
    known as controls, such as labels, text boxes, and buttons


    A label control object is an instance of the UILabel class. A label is a read-only
    interface object, meaning only the developer has access to the contents of this
    element. The user can see it but cannot edit it.


    A button control object is an instance of the UIButton class. A button is capable
    of intercepting touches; it sends the action method to the target.


    A text field control object is an instance of the UITextField class. This type
    of control can be edited by the user and has an associated action method that
    is triggered when the user presses Enter after entering text. This action method
    can be programmed to perform numerous tasks.'
  merge: -1
  pgno: 248
