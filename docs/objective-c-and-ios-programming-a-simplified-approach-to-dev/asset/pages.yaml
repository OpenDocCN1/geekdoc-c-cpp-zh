    | security, external accessory, system, core Bluetooth and accelerate | | Core
    OS Security, technology, support for external accessories, etc. |


    ![](img/bbd17465099c5722b6c62f0b71a906a7_220_0.png)


    203


    **Figure 8-1** iOS Architecture and frameworks


    © 2015 Cengage Learning


    Cocoa Touch plays a very significant role in iOS by providing some of the complex
    capabilities required for app programming, such as gesture recognition, animation,
    and multitasking. It forms the topmost layer in the iOS architecture and enforces
    encapsulation and abstraction by separating hardware complexities from program
    development. Cocoa Touch is built on the Model View Controller (MVC) design pattern,
    which separates the design logic and data from the actual interface design. By,
    turn, enhances platform independence. As you learned in Chapter 1, the language
    of Cocoa Touch is Objective-C, with development done in iOS SDK, which also incorporates
    the Interface Builder.


    The second layer in the iOS architecture, the Media layer, provides animation,
    graphics, video, and audio features.


    The third layer is the Core Services layer, which supports services such as location
    information, motion, and event, as well as foundation services, such as the creation
    of NSString objects, NSNumber objects, NSArrays objects, and NDictionaries objects.
    The frameworks that support this layer include Core Location, Foundation, Event
    Kit, and Core Media.


    The fourth layer, the Core OS layer, supports low level features such as security,
    Bluetooth technology, support for external accessories, networking, and memory
    allocation.


    Knowledge of the basic iOS layers, their functionality, and the frameworks that
    support those layers is essential to developing iOS apps.'
  merge: -1
