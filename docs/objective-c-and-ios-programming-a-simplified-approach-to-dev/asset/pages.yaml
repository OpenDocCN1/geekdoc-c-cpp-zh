  md: '# # Objective-C and iOS Programming

    A SIMPLIFIED APPROACH TO DEVELOPING APPS

    FOR THE APPLEPHONE & IPAD


    This timely and innovative text meets the need for a concise, one-semester book
    that provides a thorough introduction to iOS and Objective-C programming and their
    practical application in developing iPhone apps. The unique nature of the text
    highlights and clarifies challenging concepts by providing abundant examples,
    end-of-chapter summaries, programming problems of varying complexity, and a full
    hands-on project/lab together with its. The solution facilitates not only iOS
    and Objective-C programming but also actual app development in one semester by
    focusing only on the topics required to develop basic apps.


    # FEATURES OF THE TEXT:


    +   - Provides a comprehensive introduction to iPhone app development through
    dual coverage of Objective-C and iOS programming.

    - Streamlines and simplifies topics through numerous examples and focused, concise
    chapters that cover only the topics required to develop basic apps.

    - Integrates business topics into the world of app development through dynamic
    case studies in each chapter.

    - Includes hands-on labs in each chapter with step-by-step instructions.

    - Designed for students with knowledge of at least one object-oriented programming
    language; no prior knowledge of iOS development is required.


    # ABOUT THE AUTHOR:


    Arsha Khan is an Associate Professor at the College of St. Scholastica in Duluth,
    MN. She has earned a B.E. in Computer Engineering, an M.S. in Computer Science,
    and a Ph.D. in Information Technology. Her current research interests include
    quality of healthcare, leading-edge teaching techniques, healthcare mobile app
    development, and innovative healthcare technology development. Her passions are
    teaching, research, and inspiring students to pursue research interests in graduate
    school.


    # RELATED TITLES:


    +   Android Boot Camp for Developers Using Java: A Guide to Creating Your First
    Android Apps, Second Edition

    Corinne Hoisington


    Java Programming, Seventh Edition

