    # Modulus Operator


    The modulus operator returns the remainder after division. Of all the basic operators,
    the modulus operator can be the trickiest, so it''s helpful to study some of it.
    In Example 2-14, int b is assigned a value of 7. The modulus of b and 2, b %2,
    returns 1, because when is divided by 2, the quotient is 3 and the remainder is
    1.


    In line 2, x = 10. Therefore,


    ```

    x % 2 = 10 % 5

    ```


    returns 0, because when 10 is divided by 5, the quotient is 2 and the remainder
    is 0.


    In line 3, y = 1. Therefore,


    ```

    y % 2 = 1 % 2

    ```


    returns 1, because 1 is divided by 2, the quotient is 0 and the remainder is 1.


    In line 4, z = 6. Therefore,


    ```

    6 % 7

    ```


    returns 6, because 6 is divided by 7, the quotient is 0 and the remainder is 6.


    In line 5, a = 105. Therefore,


    ```

    105 % 2

    ```


    returns 5, because 105 is divided by 10, the quotient is 10 and the remainder
    is 5.'
