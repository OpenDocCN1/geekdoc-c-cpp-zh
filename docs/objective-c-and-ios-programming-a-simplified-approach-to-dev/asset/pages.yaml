  md: "# Second Tier of Inheritance: Inheriting from a Class\n\nContinuing with our\
    \ conceptual example, in the second tier of class, or subclass we find the iPhone\
    \ class, which inherits from the iDevice. This child class, inherits all the instance\
    \ variables of the iDevice, as well as all the methods. The child class can have\
    \ its own set of instance variables in addition to length, width, and name, which\
    \ belong to the Device class. Each of the instance variables of the iPhone has\
    \ its own set of getter and setter methods, which are created using properties.\
    \ These properties are then synthesized using the @synthesize directive so that\
    \ the compiler can autogenerate the setter and getter methods. The iPhone instance\
    \ variable is shown in Example 7-10, along with its property. The @interface directive\
    \ defines the iPhone as a subclass of iDevice in line 2. The iDevice has to be\
    \ imported into the iPhone interface file (line 1) so the compiler is informed\
    \ of the parent class -iDevice and hence can implement all the inheritance features.\
    \ The property for the instance variable of the iPhone class is created in line\
    \ 6.\n\n# Example 7-10\n\n```\n#import \"Device.h\"\n@interface iPhone : iDevice\n\
    {\n    NSString * feature;\n}\n@property NSString * feature;\n```\n\nIn Example\
    \ 7-11, the iPhone class is instantiated using the initializer. The init method\
    \ first checks to see if the parent class (iDevice) is initialized (line 6) and\
    \ then proceeds to initialize the instance variables that are local to the iPhone\
    \ class (line 9).\n\n# Example 7-11\n\n```\n-(id) initWithPhone:(double) newLength\n\
    \                :(double) newWidth\n                :(NSString *)newName\n  \
    \              :(NSString *)newFeature;\n{\n    if(self == [super\n        initDevice:newLength\
    \ :newWidth:newName])\n    {\n        [self setFeature:newFeature];\n    }\n \
    \   return self;\n}\n```"
