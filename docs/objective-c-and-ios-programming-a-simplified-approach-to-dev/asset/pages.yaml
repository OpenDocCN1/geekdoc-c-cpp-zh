  md: 'It would be nice if you could always predict what your programs had to do,
    because then you could write programs that simply ran through their code, line
    by line, with no variation. Writing such a program would be a relatively simple
    task. However, in the real world, your programs will often have to respond to
    varying conditions, branching off in different directions depending on user input
    and calculations involving data.


    In this chapter, you will learn to write **decision statements**, which are statements
    that decide which part of a program will execute at any time. You might use a
    decision statement to calculate a grade or decide if a person is underweight based
    on the body mass index.


    When working with decision statements, you''ll often use a **counter**, which
    is a variable that keeps track of, or counts, occurrences of a particular event.
    Counters are especially useful when you are learning about decision-making statements
    because they allow you to monitor a program''s changing behavior based on user
    input. For example, you might create a program that increases, increments, a counter
    by the user enters an even number, but if the user enters an odd number, the program
    displays a message indicating that the number was not even. The algorithm for
    this example would be:


    ```

    Prompt the user for a number

    If the user entered an even number

    increment the counter

    else inform the user that the numbers entered not even

    ```


    To translate this algorithm into an Objective-C program, you need to use an *if-else*
    statement. As you''ll see in this chapter, the *if-else*, ternary operator, and
    switch statements are mainly made using Objective-C to perform decision making.
    All of these require use of relational operators, which we''ll discuss next.


    # Relational Operators


    At the heart of any decision-making statement is the need to compare variables.
    For example, you might need to determine if a is greater than b, or if c is equal
    to d. The process of comparing variables is sometimes referred to as testing the
    relationship between variables. The operators that allow you to compare variables
    are known as **relational operators** or **comparison operators**. In this book,
    we will refer to them as relational operators. You can use relational operators
    to compare an integer with an integer, a floating point number with a floating
    point number, a single character with another single character, or a string with
    multiple characters. In each case, the result is Boolean—that is, either true
    or false.


    The relational operators in Objective-C are listed in Table 3-1.'
