  md: '# Archiving


    Archiving is another mechanism for achieving data persistence in which data is
    stored in a file system. The NSCoding and NSCopying protocols make archiving possible.


    The NSCoding protocol requires a method for encoding data into an archive and
    another for decoding an archive. Implementation of NSCoding protocol requires
    the creation of an instance of the NSCoder class, and utilizes the key-value pair
    concept. The NSCopying protocol helps with encoded objects and is implemented
    by instantiating the NSCopying object.


    The following steps summarize the process of archiving data:


    +   1. Create an instance of a NSMutableData class to hold the encoded data.

    2. Create an NSKeyedArchiver object to save the data from the NSMutableData object.

    3. Use the key-value pair to archive the data.

    4. Write the archived data to the file system.

    5. The NSKeyedUnArchiver object is used to unarchive the data.

    6. Retrieve the archived data.


    # Creating an Archiving Example App


    Let us look at a simple example in which we use archiving to save an NSString
    object.


    +   1. Create a project named Archive using the Single View Application template.
    Make sure you select the Use Storyboards and the Use Automatic Reference Counting
    check boxes.

    2. Create the user interface shown in Figure 14-11 by dragging a label, text field,
    and a round rect button from the Object Library onto the view controller. The
    user will type a name in the text box and then click the button to save the name
    to a file as a string. The label will then display the name.

    3. Delete the default text in the label, and change the button title to Save.'
