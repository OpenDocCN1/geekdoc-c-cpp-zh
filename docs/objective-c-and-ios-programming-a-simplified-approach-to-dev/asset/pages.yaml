    # NSDictionary


    NSDictionary supports a data set that includes key-value pairs, meaning every
    key will have a corresponding value. A key-value pair is like having two parallel
    arrays attached to each other, with the corresponding indices aligned, meaning
    the index for a specific key will have a value at the same index. If a key has
    index 3, then its corresponding value will be at index 3. The keys are unique
    and are not repeated, whereas the values themselves are not required to be unique.
    Figure 6-4 illustrates the key-value pair correspondence concept. Just like arrays
    and strings, dictionaries can be immutable or mutable. The immutable dictionaries
    cannot be edited, whereas the mutable dictionaries can be edited. By default,
    NSDictionary is immutable. Its mutable version, NSMutableDictionary, is a subclass
    of NSDictionary.'
