  md: '# CHAPTER 13 Data Persistence


    The apps we created so far are incapable of retaining data after the app stops
    running. In other words, the apps lacked data persistence. Each time one of our
    apps started, it launched with the same data. Any edits to the data (for example,
    a list of songs added to a music app) were available only when the app was running
    and were not available the next time it started. The data did not persist because
    it was not stored. In this chapter we look at the various means of storing data
    in an app.


    # Data Persistence Mechanisms


    Data persistence is the ability to save data in an app so the data does not revert
    to its initial values each time the app launches. There are many ways of saving
    data so that it persists, and most apps use some means of data persistence. The
    type and size of data persistence dictates the appropriate mechanism for an app.
    Some commonly used data persistence mechanisms are listed in Table 14-1.


    | Mechanism | Size | Type of data |

    | --- | --- | --- |

    | UserDefaults class | small | basic |

    | Property List (list) | small | basic |

    | Archiving file | medium | basic and complex |

    | SQLite3 database | large | complex |


    Table 14-1 Data persistence mechanisms


    In this chapter, we will learn how to implement the mechanisms listed in Table
    14-1.


    # UserDefaults Class


    Occasionally a user may want to set and save her own default settings for an app.
    This can be accomplished using the NSUserDefaults class, which inherits from the
    NSObject class. The NSUserDefaults class offers a programmatic interface to an
    app''s preferences. When a user customizes an app, the preferences are stored
    in the UserDefaults object. This very simple means of achieving data persistence
    can be used to store small, basic data such as integers, floats, and Booleans,
    in addition to NSDate, NSData, NSString, NSNumber, NSArray, and NSDictionary objects.
    The data returned by the UserDefaults object is immutable if it was mutable before
    it was stored in the UserDefaults object.


    An example of UserDefaults occurs when an app offers the user a choice of fonts,
    in which case the fonts would be saved in the UserDefaults database as parameters.
    Parameters stored in this database are often referred to as defaults; the app
    customizes itself based on these at each launch.


    The UserDefaults class is useful for storing a single data element. It is relatively
    easy to use, because it involves very little code. For that reason, it is often
    misused by developers to store more information than user preferences. The process
    of using the UserDefaults class to store data is also referred to as key-value
    pair storage, because the data is stored in pairs consisting of a key and its
    corresponding value.'
  merge: -1
