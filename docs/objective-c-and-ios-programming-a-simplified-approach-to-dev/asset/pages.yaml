    the Tabbed application template creates an application with two tabs.


    +   Click on the MainStoryboard.storyboard to display the interface that was generated
    by the tabbed application template. You see a tab bar controller and two controllers,
    one for each tab. We need a third tab, so we''ll have to add it.


    # CREATE A THIRD TAB


    +   Add a new view controller to the project.


    +   Now we need to add a set of Objective-C class files. In the Xcode menu, select
    File > New > File and then, in the Choose template dialog, select Cocoa Touch
    on the left and Objective-C class on the right.


    +   Click Next, and in the Choose options for your new file dialog, select a subclass
    of UIViewController and make sure the With for user interface check box is unchecked,
    and we are using storyboards. Name this set of files ViewController


