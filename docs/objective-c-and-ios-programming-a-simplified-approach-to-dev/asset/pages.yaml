  md: '# Summary


    +   - Encapsulation is the process of combining data elements, as well as a set
    of functions that are operational on these data elements, to create a robust,
    secure object.


    +   - Object-oriented programming is a programming concept that looks at programming
    in terms of objects that are instances of a class. It is based on the concept
    of encapsulation.


    +   - There are two types of methods in a class: class methods and instance methods.
    A class method does not need the class to be instantiated. The instance method
    needs an instance of the class to be executed. Instance methods are preceded by
    a minus (-) sign. Class methods are preceded by a plus (+).


    +   - In Objective-C, headers and the implementation of the members of the class
    are typically defined in separate files. In simpler programs, it is possible to
    combine them into one file, but for larger programs, separate files are preferred.


    +   - The interface file holds the declaration of the instance variables and the
    method declarations. An @interface file has a .h extension. The @implementation
    file, which holds the implementation of the methods declared in the @interface
    file, has a .m extension.


    +   - Functions that are part of a class or object are called methods. In Objective-C,
    methods are not invoked. Instead, the message of the method is sent to the object.


    +   - Properties are a means of populating the instance variables of the class.
    The @property directive is used to identify the properties.


    +   - The @synthesize directive is used to have the compiler autogenerate the
    getter and setter methods of the properties.


    +   - Initializers in Objective-C are similar to constructors in Java. They help
    create instances of the class.


    +   - Description methods are very similar to toString methods in Java. They provide
    a means of printing what the developer chooses to from the set of instance variables
    of the object, in the form of a string.


    +   - Inheritance facilitates the creation of subclasses that can inherit the
    attributes of the parent and have their own set of data members.


    +   - Only single inheritance is allowed in Objective-C. In single inheritance,
    an object can inherit from one parent, but not from two parents.'
