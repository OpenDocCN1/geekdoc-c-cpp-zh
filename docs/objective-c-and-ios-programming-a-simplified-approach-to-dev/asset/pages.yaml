  md: '# Xcode Debugger


    We''re ready to try debugging a program. First, we need to set up the debugger.


    +   1. Select Xcode ► Behaviors ► Edit Behaviors, as shown in Figure A-3.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_512_0.png)


    Figure A-3 Setting up the debugger


    +   2. Next, we need to tell the debugger to show the contents of the variables
    during program execution. In the Behaviors dialog, locate the Running on the left.
    Under "Running," select Starts and then select the check box next to "Show debugger
    with." Also, select Variables & Console View, as shown in Figure A-4.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_512_1.png)


    Figure A-4 Setting up the debugger to display the contents of variables


    +   3. Do the same for Pauses and Generates output as well, which are listed just
    below "Starts."'
