  md: '# Creating a Tab App Using Storyboards


    When designing storyboards, you can create a tapped app by dragging and dropping
    the tab bar view controller from the object library. The tab bar controller is
    added to the first view. Any additional tabs are added by creating a relationship
    segue of type view controller. This is unlike in earlier examples, where we created
    manual segues of type push, modal, or custom, because in this case we are creating
    a relationship with a view controller. Any view controller relationship created
    this way will create a tab app on the tab bar. You then have to drag and drop
    the individual tab items onto each view, and then set the tab''s title and image.
    The title and the image appear on each individual tab. If you fail to assign a
    title and an image to each tab, Xcode will give you the default name "item," and
    the tab will not have an image.


    The following list summarizes the steps involved in creating a tapped app using
    storyboards.


    +   1. Create a tab app using the Tapped Application template. Make sure to select
    the Use Storyboards check box.

    2. The templates create a tab bar controller with two view controllers. It sets
    tab titles to "first" and "second" and the images to default images of a circle
    and square.

    3. To add an additional tab, add a new view controller by dragging a view controller
    from the object library onto the storyboard.

    4. Connect the new view controller to the tab bar controller by Control-dragging
    the tab bar controller to the newly added view controller, creating a relationship
    segue of the type view controller. By default, the interface builder names the
    tab "item" and does not give it an image.

    5. Select the newly added view controller. Then, in the Identity Inspector, change
    the default title to something more descriptive, and add an image. The image must
    be saved as a .png file.

    6. Create the class file to go with the view by adding an Objective-C class.

    7. Connect the class to the view controller by selecting the view, and in the
    Identity Inspector for the class, select the name of the class file.

    8. Program the individual views as per the requirements of the application.


    # Starting a Tab App Example


    Now let''s actually create a tab app using storyboards.


    +   1. Create a new project in Xcode. In the Choose template for your new project
    dialog, select the Tabbed Application template as shown earlier in Figure 12-2.

    2. Click Next, and in the Choose options for your new project dialog, enter the
    name TabWithStoryboard for the product name. Also, make sure to select the Use
    Storyboards and Use Automatic Reference Counting check boxes.'
