  md: '# Xcode Debugger


    A debugger is a tool that helps you monitor a program while it is running by stepping
    through the program one step at a time. Using the Xcode debugger, you can step
    through the program and examine the contents of variables at certain points in
    the program called break points. To use the Xcode debugger, you insert one or
    more breakpoints (as described in the steps later in this appendix) and then activate
    the debugger.


    Activating the debugger displays the debug area, shown in Figure A-1, which contains
    two components: the **debug bar**, which contains the debugger controls, and the
    **content pane**, where the information about selected items is displayed. You
    can step through the code in a program line by line using the buttons on the debug
    bar shown in Figure A-2. When code execution reaches a break point, you have the
    option of clicking the Step Over button, the Step Into button, or the Step Out
    button on the debug bar:


    +   * Step Over: Executes one step. However, if the step invokes a function, then
    the function is executed all at once, as one step.

    * Step Into: Executes one step. However, if the step invokes a function, then
    the function is also executed a step at a time.

    * Step Out: Finishes the execution of the current function and goes to the main
    program or, if the execution is in the main program, the execution of the main
    function is completed in one step.'
