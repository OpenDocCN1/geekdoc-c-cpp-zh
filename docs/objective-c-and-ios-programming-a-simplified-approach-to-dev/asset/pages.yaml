  md: '# Ternary operator


    Objective-C offers another type of decision-making tool, called the conditional
    operator or the ternary operator, which means it has three operands. The syntax
    for the ternary operator is as follows:


    # ### SYNTAX


    ```

    condition ? expression1 : expression2

    ```


    Objective-C allows you to evaluate a condition, and based on the condition, choose
    the action you would like to perform. The compiler evaluates the condition. If
    the condition is true, the compiler executes expression1. Otherwise, it will execute
    expression2.


    For example, suppose that at a high school, students are allowed to take college-level
    classes only if their GPA is above 3.75. In Example 3-8 implement this using the
    ternary operator. Here ''a'' means the high school student is allowed to take
    college-level courses, while ''n'' means the student is not allowed to take college-level
    courses. In the ternary expression in line 9, the GPA is tested to see if it is
    above 3.75. If it is, then the switch value is ''a'' and the case statement matching
    will print a message indicating the student is allowed to take college-level courses
    as in line 10, while if the GPA is below 3.75 the switch will be a ''n'' and the
    matching case in the switch below 3-8 will print that the student is not allowed
    to take college-level courses as in line 13. The output for Example 3-8 shows
    the output of the program run with a user input of GPA = 3.8. In this case, the
    student is allowed to take college-level courses because the GPA is above 3.75.


    Note the switch can handle complex expressions for its switch expression as evident
    in Example 3-8


    # Example 3-8


    ```

    1 #import <Foundation/Foundation.h>

    2 int main(int argc, const char * argv[])

    3 {

    4     @autoreleasepool

    5     {

    6         double GPA;

    7         NSLog("Enter your GPA:");

    8         scanf("%lf", &GPA);

    9         switch (GPA>3.75 ? ''a'' : ''n'') {

    10        case ''a'':

    11            NSLog("You are allowed to take college level-level courses.");

    12            break;

    13        case ''n'':

    14            NSLog("You are not allowed to take college-level courses.");

    15            break;

    ```'
