  md: '# Exercises


    +   - The NSUserDefaults class offers a programmatic interface to an app''s user
    preferences. When a user customizes an app, the user preferences are stored in
    the NSUserDefaults object. The steps involved in implementing the NSUserDefaults
    mechanism are: instantiate the NSUserDefaults object, populate this object with
    the data you want to save, synchronize it, and then use the viewDidLoad method
    to retrieve the saved data.


    +   - Property lists, also called lists, are files used to store data that is
    organized as key-value pairs. They are typically used to store small amounts of
    data.


    +   - The steps involved in implementing property lists: create a file path to
    the list, store data in the list, create an array to hold the data, and then read
    the saved data into the array.


    +   - Archiving is a mechanism by which data is stored in a file system. In archiving,
    data must conform to the NSCoding and NSSCopying protocols.


    +   - The steps required to archive data: create an instance of an NSMutableData
    array to hold the encoded data, create an NSKeyedArchiver method to save the data
    from the NSMutableData array, implement the key-value pair to archive the data,
    save the archived data to the file system, and then use the NSKeyedUnarchiver
    method to unarchive the data and decode the object.


    +   - SQLite is a software library that can be used to implement a relational
    database in iOS app. To access data stored in a SQLite database, we write SQLite
    statements, known as queries. SQLite commands are based on the Structured Query
    language (or SQL).


    +   - The steps required to implement a SQLite database: add the sqlite3 library
    to the project, find the file path to the SQLite database, open the database,
    create a table with the necessary fields, create a method to save the data, and
    then create a method to retrieve the data.


