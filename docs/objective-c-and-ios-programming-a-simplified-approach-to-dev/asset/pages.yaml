  md: '# Creating Transitions Without Storyboards


    Storyboard file. As you learned in Chapter 9, when you use storyboards to create
    an app with multiple view controllers, the interface is stored in the Storyboard
    file. When you create an app with multiple view controllers without using storyboards,
    the interface is stored in multiple .xib files. Multiple views need transitioning
    from one view to another.


    The steps involved in creating transitions from one view controller to another
    are described in the following general steps. You''ll learn more about the specifics
    of this process as you begin creating an app with multiple view controllers.


    +   1. Create two view controllers (each with its set of .h, .m, and .xib files).


    +   2. Import the second view controller into the first view controller, as an
    instance of it can be created and presented.


    +   3. In this first view controller, add a button the user can click to display
    the second view.


    +   4. Program this button to perform the following tasks:


    +   a. Create an instance of the second view controller


    +   b. Set the transition style for the second view controller


    +   c. Present the second view controller


    +   5. Add a Done button on the second view controller.


    +   6. Program the Done button to dismiss the second view controller, thereby
    displaying the first view controller.


    Now let''s learn more about the specifics as we create an app with multiple view
    controllers using storyboards.


    +   1. Create a new Xcode project.


    +   2. In the Choose template for your new project dialog, select Application
    "iOS," select Single View Application, and then click Next.


    +   3. Type TransitionWithoutStoryboardExample as the Product Name, enter appropriate
    items in the Organization Name and Company Identifier boxes, make sure iPhone
    is selected in the Devices box, deselect the Storyboards check box, and select
    the Automatic Reference Counting counter.


    +   4. Click the Next button, and save the project in the location of your choice.


    +   5. Add the second view controller by adding a new file of type Objective-C,
    named ViewController2. To add a new file, select File New -> Select Cocoa Touch
    on the left and Objective-C class on the right. Click Next and in the Choose options
    for your new file dialog, select a subclass of ViewController and make sure the
    With XIB for user interface check box is selected as shown in Figure 10-1. Click
    Next, then Create.'
