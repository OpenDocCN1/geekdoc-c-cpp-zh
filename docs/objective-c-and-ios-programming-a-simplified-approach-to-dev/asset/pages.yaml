  md: '# Table Views


    +   - A detail view is created when a user clicks on the descriptor for any cell
    to examine the details of that cell. There are three main types of descriptors:
    disclosure, detail, and checkmark. Descriptors are also called accessories.


    +   - The cells in a table view have four optional styles: UITableViewCellCellStyleDefault
    is the default style with a title and an optional image. UITableViewCellCellStyleSubtitle
    has a title, subtitle, and an optional left-aligned image. UITableViewCellCellStyleValue1
    has a left-aligned title and a right-aligned subtitle and does not permit images.
    UITableViewCellCellValue2 has a left-aligned subtitle, a right-aligned title with
    indent, and does not allow images.


    +   - The Master-Detail Application template simplifies the process of creating
    a hierarchy of table views, making it easier to navigate through a hierarchy of
    views. It provides an initial UITableView class and the storyboard for scenes
    and views in the user interface.


    +   - When you use a UITableView, the delegate and the data source are automatically
    implemented.


