    # Inheritance


    Inheritance is an important feature of object-oriented programming that defines
    an “is-a” relationship between two classes. Classes in Objective-C ultimately
    inherit from the NSObject class. In other words, every Objective-C class is a
    NSObject.


    Inheritance in programming is very similar to inheritance in real life. For example,
    a child may inherit facial features and mannerisms from parents. Similarly, a
    class can inherit attributes and operations from a parent class. The inheriting
    class is called the child. The class from which it inherits is called the parent.


    The child inherits the attributes and the operations of the parent class, but
    it can also have a set of attributes and operations of its own. Inheritance in
    Objective-C allows for inheritance only from a single parent, meaning an object
    cannot have two parents. Figure 7-9 emphasizes this point. However, a parent can
    inherit from another parent. In other words, as seen Figure 7-10, a child can
    inherit from another child.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_193_0.png)


    Figure 7-9 Inheritance from two parents is not allowed'
