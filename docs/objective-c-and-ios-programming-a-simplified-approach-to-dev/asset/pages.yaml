    In this chapter''s Hands-On Lab, we will be using a label, a text field, and a
    button. In order to understand these controls it is essential to understand the
    Controls class from which they are generated.


    # UIControl Class


    The UIControl class provides the control objects that offer interactivity to the
    user. The UIControl class sets and gets the attributes of the controls, dispatches
    the action messages to a target, draws the controls, and tracks the touches on
    a control. Figure 8-14 shows three commonly used controls.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_233_0.png)


    Figure-8-14 Three commonly used control objects


    # ILabel Class


    A label control, like the one you added to the Hello Universe app, is an instance
    of the UILabel class. This type of control is traditionally used to provide information
    to the user. A label is a read-only interface, meaning only the developer has
    access to its contents; the user can see it but cannot edit it. Hence the label
    is designed to ignore any touch events—indeed, if you wanted a label to respond
    to an event, then you would have to change its setting to enable events.'
  merge: -1
