  md: "Developers can use Instruments to make sure their apps do not exceed these\
    \ limitations. Instruments is also useful in detecting memory leaks, in which\
    \ memory allocations and releases are performed incorrectly.\n\n# # Development\
    \ Support\n\nApple provides a large number of supporting documents and examples\
    \ that you will find useful as you develop apps. This documentation support can\
    \ be found at: https://developer.apple.com/support/ios/\n\n# # iOS App Life Cycle\n\
    \nWhen an iOS app starts, a UIApplication object is created. This UIApplication\
    \ object creates a UIWindow object and launches a UIView object within it. UIApplication\
    \ then gets the UIApplication running, which in turn manages the life cycle of\
    \ the app by handling events such as startup, phone calls and various notifications\
    \ and alerts. The UIApplication is part of the UIKit framework, which provides\
    \ the objects required for the user interface.\n\nIf the preceding paragraph is\
    \ hard to grasp completely, don't worry. The app life cycle will become easier\
    \ to understand as you create more apps. For now, the most important concept you\
    \ need to understand is that there are two main components that are involved in\
    \ the execution of an app. The first is the set of objects provided by the UIKit\
    \ framework. The second is the code written by the developer to manage these objects.\
    \ In the following code, when the user touches the app icon, the main method executes.\
    \ That is, the UIApplicationMain loads the user interface and starts the event\
    \ loop by creating the AppDelegate that manages the events. The AppDelegate and\
    \ the view controller are created by the UIApplicationMain.\n\n```\n#import <UIKit/UIKit.h>\n\
    #import \"AppDelegate.h\"\nint main(int argc, char *argv[])\n{\n    @autoreleasepool\
    \ {\n        return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate\
    \ class]));\n    }\n}\n```\n\nWhen the app starts, the UIKit, Foundation and CoreGraphics\
    \ frameworks are automatically loaded by Xcode. This occurs because they are the\
    \ most commonly used frameworks, and anything that is done in the Interface Builder\
    \ would require these minimum frameworks. Figure 8-4 shows the list of currently\
    \ active frameworks in Xcode."
