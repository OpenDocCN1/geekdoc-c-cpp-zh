  md: "# Type struct\n\nThe struct type is a combination of several data types that\
    \ creates a new custom data type. It provides a means to group various data types.\
    \ A remnant of the original ANCI C language, before object oriented programming\
    \ was introduced, the struct is a static version of a class. In Example 2-8, int,\
    \ float, and char types are combined to create the ball struct. In essence, the\
    \ various data types are the properties of ball.\n\n# Example 2-8\n\n```\n#import\
    \ <Foundation/Foundation.h>\nint main(int argc, const char * argv[]) {\n    @autoreleasepool\
