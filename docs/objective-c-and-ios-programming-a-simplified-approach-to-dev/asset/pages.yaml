  md: '# View Controller Communication


    Communication between view controllers—that is, passing data between view controllers—is
    essential to a fully functioning app. In Chapter 9, you learned how to use storyboards
    and segues to pass data between view controllers. As you will learn in this section,
    data flow between view controllers in non-storyboard applications requires a different
    approach.


    In order to understand communications between view controllers, you need to understand
    the three main phases in a view controller''s life cycle:


    +   1. Instantiation—In this phase, the view controller is created. It is initiated
    by another object, usually in order to pass data or to display information.


    +   2. Lifetime—This is the longest phase of a view controller''s life cycle.
    During this phase the view controller may perform tasks such as sending notifications,
    displaying information, passing data, or delegating tasks to other objects.


    +   3. Destruction—In this phase, the view controller informs its creator that
    its task is completed, at which point the creating object dismisses the view controller.


    Passing data is one of the most critical tasks a view controller can perform.
    With delegates data can flow in two directions: from the originating view controller
    to a new view controller and from the new view controller back to the originating
    view controller. You already have experience with the first option, in which data
    flows from the first view controller to the second controller. The steps required
    for this type of data flow are as follows:


    +   1. Declare a variable in the second view controller.


    +   2. Create an instance of the second view controller in the first view controller.


    +   3. Use the variable from the second view controller as a member of the instance
    of the second view controller to push the data to the second view controller.


    The preceding steps can be written in greater detail as follows:


    +   1. A variable is created in view 2:


    ```

    NSString *data;

    ```


    +   2. The second view is instantiated:


    ```

    //instantiate

    ViewController1 *vcl = [[ViewController1 alloc]

    [init];

    ```


    +   3. Data is passed as a member of the instance created:


    ```

    //push data to View 1

    vcl.data = txt0.text;

    ```


    +   4. In view 2, the contents of the data member are displayed in a label using
    the ViewWillAppear method:'
