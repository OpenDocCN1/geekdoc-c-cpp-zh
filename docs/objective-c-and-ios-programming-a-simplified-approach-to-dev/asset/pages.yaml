  md: '# Dismissing Keyboard


    Now it''s time to think about how fine-tune an app to make it easier for the user
    to interact with. In particular, let''s consider the keyboard, which, depending
    on the design of your app''s interface, can obscure some controls. To avoid this
    problem, you need a way to hide or dismiss, the keyboard. There are many ways
    to do this, but we will focus on the following two ways to dismiss the keyboard:


    +   - The user touches the Return key after entering text in a text field.

    - The user touches any open space on the screen, other than on the keyboard.


    # Dismiss Keyboard from Within a Text Field


    Let''s first look at how to program the text field on view 2 so the user can dismiss
    the keyboard by touching the Return key.


