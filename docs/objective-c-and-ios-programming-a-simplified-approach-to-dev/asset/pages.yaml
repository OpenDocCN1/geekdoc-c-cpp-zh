    Figure 14-3 "Test" next to the text box demonstrates data persistence


    A second way of achieving data persistence is by using property lists.


    # # Property Lists


    **Property lists**, which are also called *plists*, are files that hold configuration
    information for an app. Within a plist, information is organized as key-value
    pairs. Plists are usually used to store basic data types such as *float*, *int*,
    *double*, strings, dates, and Boolean values, as well as objects. (Note that some
    data types, such as UIColor and NSFont, cannot be stored in lists.)


    Plists convert data into binary, XML, or ASCII formats in order to store them.
    Each of these formats has advantages over the other. For instance, binary data
    is the most compact of the three, while the XML is the most portable, widely used
    and editable format. If storage size is an issue then the binary format is recommended.


    The NSUserDefaults class uses plists to organize, structure, store, and access
    data. Property lists are typically used to retain small amounts of data—that is,
    less than a few hundred kilobytes. Large amounts of data cannot be handled by
    property lists.


    The following steps summarize the process of using plists to achieve data persistence.


    +   1. Manually create a plist.

    2. Create a file path to the plist.

    3. Create a mutable array/dictionary to hold the data elements.'
