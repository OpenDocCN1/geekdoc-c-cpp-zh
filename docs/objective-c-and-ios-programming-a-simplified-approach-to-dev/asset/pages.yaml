  md: '# Data Types and Arithmetic Expressions


    # Variables and Constants


    Programming is mainly data manipulation. This data can take many forms, including
    numbers, individual alphabetic characters, strings of alphabetic characters, and
    numbers with specific decimal precision. The purpose of the program you are creating
    drives the type of data the program will manipulate and store. To store data,
    program requires placeholders which can be either variables or constants. A variable
    placeholder holds data that changes as the program runs, whereas a constant placeholder
    holds data that have a fixed value. A variable has a data type and a name for
    identification.


    Objective-C supports several types of data. As you should already know from your
    study of programming, data types help the compiler allocate memory for storage.
    For instance, one data type may use 1 byte, whereas another data type may use
    2 bytes to store the same data. The data type also helps the programmer identify
    the possible tasks that can be performed on the data without generating errors.
    For example, numbers can be added, but strings are concatenated. (Concatenation
    is the process of combining strings to form a single string.) If you attempt to
    add two numbers with decimal places and then store it in a data placeholder that
    does not hold decimal places, the compiler will generate an error, indicating
    a loss of precision.


    # NSLog and Scanf


    Before we go on to discuss the various Objective-C data types, we''ll pause to
    introduce the function that helps us print to the console and take user input.
    We''ll then use this function in the examples that illustrate the various Objective-C
    data types.


    NSLog is identified by Apple as an error log mechanism used to output data to
    the console. An optional output mechanism is the printf() function, but the printf()
    function is a C-based function, whereas NSLog is not only an Objective-C foundation
    function but also provides an extended set of functionality such as the option
    to format data using format specifiers. Format specifiers are tokens with the
    symbol % followed by a character that specifies a data type. For example, the
    data type int has d, i, or x as format specifiers.


    NSLog takes one or more parameters in the form of a string with format specifiers.
    (Strings will be covered in Chapter 6.) The string with the format specifier starts
    with the @ symbol. Table 2-1 lists the format specifiers for commonly used data
    types. The % symbol is a placeholder for the actual value of the variable.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# NSLog and Scanf


    | Data type | Format specifier |

    |---|---|

    | int | %d, %i, %x (for hexadecimal) |

    | char | %c |

    | float | %f |

    | double | %f |

    | newline | \n |

    | literally print symbol % | %% |

    | pointer | %p |


    **Table 2-1** Data statements and corresponding format specifiers


    In Example 2-1, the NSLog statement prints Hello All! This is Chapter 2. The format
    specifier for the variable chapter specifies its location and the format in which
    it should be printed. The \n in the NSLog statement is the newline character,
    which causes a new line to be inserted.


    Note that the numbered examples include line numbers, to make it easier to discuss
    the code.


    # Example 2-1


    ```

    1 #import <Foundation/Foundation.h>

    2

    3 int main(int argc, const char * argv[])

    4 {

    5   @autoreleasepool

    6   {

    7     int chapter = 2;

    8     NSLog("\nHello All!, This is Chapter %d", chapter);

    9   }

    10 return 0;

    ```


    Output for Example 2-1

    2017-07-29 23:10:27.812Example2.1[99816:403]\Hello All!, This is Chapter 2


    The scanf function uses the format specifiers to map arguments to its corresponding
    format specifier in the string. Each argument typed input. Example 2-2, the first
    NSLog statement prompts the user for a number. The next statement is a scanf statement
    whose first argument is a format specifier that indicates the type of argument
    the user can enter. The next argument is the name of the variable in which the
    user number will be stored. The variable name in the argument should always have
    an & symbol.'
