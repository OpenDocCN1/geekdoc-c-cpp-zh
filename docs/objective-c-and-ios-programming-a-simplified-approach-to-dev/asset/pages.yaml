  md: '# # iOS Software Development Kit (SDK)


    As you learned in Chapter 1, iOS SDK (Software Development Kit) is the software
    development environment designed by Apple for iOS. You also learned some of its
    components in Chapter 1. A more complete list of components includes the following:


    +   - The integrated development environment named Xcode, in which you can write,
    test and develop Objective-C code


    +   - LLVM compiler, which is the built-in compiler in the iOS SDK


    +   - Interface Builder, which provides the tools necessary to build interactive
    interfaces for the apps


    +   - iOS Simulator, which allows you to test an app as if it were running on
    an iPhone or iPad


    +   - Instruments, an analysis tool that helps the developer analyze an app''s
    performance


    +   - A supporting developer tool set, with documentation developers can use to
    learn more about the iOS SDK


    Each of these tools is well integrated into Xcode, offering seamless transitions
    from code development to debugging to interface building to testing the code on
    the simulator and analyzing the performance of the app. These items are explained
    in the following sections.


    # ## LLVM compiler


    The LLVM compiler offers developers tools used to compile and debug code. The
    compiler also makes suggestions, detects errors, and corrects some errors as the
    developer types code. When you position the mouse pointer over a variable, it
    shows the variable''s contents as the app is running.


    # ## Interface Builder


    The Interface Builder is a visual development tool that can be used to create
    the view controller user interacts with. The view controller does not have direct
    access to the data elements; instead, it communicates with the view controller,
    which, in turn, has access to the data/model, sending messages from the user interface
    to the model and vice versa. The model is where all data associated with the app
    resides and the view controller is where the code resides. When a button is pressed
    in the user interface, or view controller, a message is sent to the view controller.
    The view controller accesses the model and returns the message to the view controller
    in the form of data or images, or any other functionality the user requested by
    pressing the button. Figure 8-2 shows the Interface Builder.'
  merge: -1
