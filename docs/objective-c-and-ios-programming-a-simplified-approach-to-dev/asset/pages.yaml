  md: 'As evident in Figure 6-1, Ansi C and C++ have some overlapping concepts. C
    and C++ are also subsets of Objective-C.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_147_0.png)


    Figure 6-1 Concepts overlap in Ansi C, C++, and Objective-C

    © 2015 Cengage Learning


    So far in this book we have focused on programming concepts that Objective-C shares
    with the Ansi C language. Now we will focus on concepts that are unique to Objective-C.
    In particular, we will explore the framework, or infrastructure, on which the
    Objective-C programming language is built. That is, we will study the utility
    classes that Apple has provided in it in an attempt to create consistency in all
    the domains of the language. These utility classes are helper classes that are
    useful tools for programmers.


    Objective-C is a superset of the Ansi C language, which is a procedural language.
    As discussed in Chapter 2, the Ansi C language contains a derived data type called
    a structure that holds a collection of data. An object is an extension of a structure
    that it contains data as well as functions, called methods, which operate on this
    data. Invoking these methods in Objective-C is different than in other object-oriented
    methods.


    # Message Invocation


    In Objective-C, an object''s method cannot be invoked by calling it. Instead,
    an object must pass a message to its method to invoke it. For example, a calculator
    object might have methods for adding, subtracting, multiplying, and dividing.
    The calculator method can invoke these methods by sending them messages.


    The syntax for passing a message to a method is:


    ```

    SYNTAX

    [Object/receiver method/message]

    ```'
