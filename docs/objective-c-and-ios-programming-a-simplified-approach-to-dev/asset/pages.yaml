  md: '# Programming Exercises


    +   1. Create a simple birthday-tracker app. This app should have two screens.
    On the first screen, the user enters a name and a birth date using a picker view.
    Once the user selects a date, another screen appears containing a list of all
    the names and birthdays entered so far. This screen should have a means of navigating
    back to the first screen. The user should not be able to submit an entry without
    a name.


    +   2. Create a date-calculator app that includes a picker with four components.
    The user should be able to use the picker to select a date, and then click a Choose
    button to display the number of days until that date arrives (for example, 3 days)
    or the number of days since the date has passed (for example, -4 days). The interface
    for this app is shown in Figure 12-26.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_412_0.png)


    Figure 12-26 Interface for date-calculator app. The app should contain three screens.
    On one screen, the user should be able to enter the name of a song, and then use
    a picker view to enter a rating for the song on a scale of 1–5. On the second
    screen, the user should be able to view all entries listed numerically, in descending
    order by rating, with the most highly rated songs at the top. On the third screen,
    the user should be able to view all entries listed in the order in which they
    were entered, with the most recent entry first. Use tabs to create the application,
    and do not use a storyboard.


    +   3. Modify the app created for Programming Exercise 3 so that the tab for each
    screen is an image. Also, add another tab that displays a list of all the entries
    with their respective ratings, in alphabetical order.'
