    # Playing Audio


    The frameworks primarily responsible for handling audio are:


    +   * Media Player framework: Used to play songs, audio podcasts, and audio books

    * AVFoundation framework (AVAudioPlayer): Helps utilize the Objective-C interface
    to play and record audio

    * Audio Toolbox framework: Facilitates handling complex tasks such as synchronization,
    format conversion, and parsing

    * Audio Unit framework: Facilitates audio processing plug-ins

    * OpenAI framework: Facilitates audio play back in games


    So far we have mainly dealt with UIKit framework, which comes automatically loaded
    in an app when a project is created in Xcode. If you use any additional framework,
    you first need to add it to the project and import the corresponding framework
    explicitly. In this chapter, we will work with the AVFoundation framework and
    learn to play sounds and music using the'
  merge: -1
