  md: '# Business Case Study


    2. Create a number display app that includes the following:


    +   - Two text fields in which the user can enter numbers


    +   - Four buttons containing the text Addition, Subtraction, Multiplication,
    and Division


    +   - One label that will display the result of the calculations. The user should
    be able to enter numbers in the text fields.


    When the user clicks any button, the result should be displayed in the label.
    For example, if the user enters 5 and 6 in the text fields and then clicks the
    Addition button, the label should display 11. In case of calculation errors (for
    example, if the user fails to enter one of the numbers), the label should display
    the word ERROR. Modify the background and add colors to the calculator to make
    it more colorful and personalized.


    3. Create a Fibonacci number generator app. A Fibonacci sequence starts with a
    0 and 1, with each subsequent number the sum of the previous two numbers. The
    app should contain at least one text field, a label and a button. The user should
    input the amount of Fibonacci numbers that he or she wants to. For instance, if
    the user enters 3 in the text field and clicks the button, the label should display
    the first three Fibonacci numbers, as: 0, 1, 1.


    4. Create a quote-of-the-day app. This app should contain at least one label and
    one button. Each time the button is clicked, a new quote should appear in the
    label. One way of doing this would be to create an NSArray that contains 10 quotes.
    Ensure that the same quote cannot appear consecutively. For instance, if a user
    clicks on the button and gets the quote, "An eye for an eye makes the whole world
    blind," the next time the user clicks the button, he or she should not get the
    quote.


    5. Create an area and perimeter calculator for a rectangle. The app should include
    two text fields: one for length and one for width. It should also contain two
    buttons: one to calculate the area and another to calculate the perimeter.


    6. Create a program that lets the user choose among various ice creams. When a
    choice is made, the choice should appear in a label.


    7. Create an app for elementary school students that allows a student to display
    either the formula for a square or the formula for the perimeter of a square.
    The formulas should appear in a label.


    # Business Case Study


    In this Business Case Study, you will begin creating a pain management tool that
    allows the user to record pain levels at various times during the day. You will
    continue working on this app in subsequent chapters. The completed app will contain
    multiple view controllers, so that the user can display a summary of pain levels
    in a separate view controller. By the end of Chapter 14, you will have a functional
    app.


    To get started on the pain management app, create a single view app. Modify the
    background to show a gray color. A label that holds the title "Pain Tracker"'
