    # Summary


    +   • The main purpose of programming is to manipulate data.

    • NSLog is identified by Apple as an error log mechanism to output data to the
    console.

    NSLog takes one or more parameters in the form of a string with format specifiers
    such as

    i, d, x for int; c for char; f for float; p for pointer; etc.

    • The scanf function uses the format specifiers in the same manner as NSLog and
    reads

    user-typed input. Each input argument maps to its corresponding format specifier.

    • Data types come in two: basic and derived.

    • Some examples of basic data types are int, char, double, and float.

    • Derived types are a combination of the basic data types. Examples of the

    derived types are struct, typedef enum, and pointers.

    • A preprocessor # statement declares a constant value that does not

    change throughout the program and can be given a unique name.

    • An arithmetic expression is a combination of operands and operators. There are
    two

    kinds of operators: basic and compound. The basic operators are +, *, /, and %.

    Thecompound operators are a combination of the basic operators. Examples of compound

    operators include: +=, -=, *=, /=, and %=n• The modulus operator finds the remainder
    after the division of the two operands in the

    expression.'
