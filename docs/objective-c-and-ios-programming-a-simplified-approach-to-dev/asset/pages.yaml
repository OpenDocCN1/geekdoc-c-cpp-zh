    # Views, View Controllers, IBOutlet and IBAction Connections


    Before we begin creating an app, we need to take a moment to clarify some important
    terminology. A view controller, like the one shown in Figure 8-5, is the part
    of an app that displays data and translates input from the user (such as a word
    entered into a text field) into an action (such as entering that word into a database).
    In Xcode, the visual representation of the view controller is the rectangular
    image of the device''s background (for instance, an iPhone''s background or an
    iPad''s background) that contains labels, buttons, text fields, and other controls.
    The term view refers to what you see in the view controller. A view can include
    labels, text fields, buttons, and lists of information, just to name a few possibilities.
    A view is also sometimes referred to as a scene, especially in a storyboard.


    The views and controls on a view controller create interactivity between the user
    and the program. That is, they connect the view controller to the Objective-C
    logic.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'Figure 8-5 Control objects in a view controller


    The interface objects are connected to the app’s logic via connections. A connection
    is code that programmatically connects a control to the logic that allows it to
    perform a specific task. There are two main types of connections: IBOutlet connections
    and IBAction connections. Figure 8-6 illustrates this relationship.


    Figure 8-6 Connection between the interface elements and program logic


    © 2015 Cengage Learning


    An Outlet connection is a control’s instance variable. An IBAction connection
    is a control’s instance method, which is triggered by the occurrence of an event,
    such as the pressing of a button. IBOutlet and IBAction connections are made in
    the @interface of the view controller. The implementation of the IBAction connection
    is done in the view controller’s @implementation file.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Creating and Using IOutlet and IBAction Connections


    You can create IOutlet and IBAction connections in the Interface Builder by a
    Control-drag operation—that is, you click a control in the view controller to
    select it, press and hold the Control key and the left mouse button simultaneously,
    then use the mouse to drag the control from the view controller onto the interface
    file. This is sometimes known as a Control-drag operation.


    Some controls, such as buttons, are event-based, which means they can trigger
    an event that creates an IBAction connection. Controls that are not event-driven,
    such as labels and text fields, create an IOutlet connection instead. After the
    IOutlet or IBAction connection is created in this way, code in your application
    can access the controls via the IOutlet or the IBAction connection. For example,
    if you Control-drag a label in a view controller, the code in your app connects
    to this label in the following way:


    ```

    IOutlet UILabel *newLabel;

    ```


    A Control-drag operation generates the @property directive for each of the IOutlet
    connections. It also generates the @synthesize directive, which instructs the
    compiler to generate the getter and setter methods for the control.


    The Control-drag operation also generates the header for the action method or
    the variable in the @interface of the class and the implementation of the variable
    or in the @implementation of the view controller. You then need to write the code
    for the task you want the program to perform when a particular event, such as
    the pressing of a button, occurs. The declaration of the IBAction connection looks
    like this:


    +   - (IBAction)myButton:(id)sender


    Notice the (-) sign before IBAction, which is necessary because IBAction is an
    instance method of the interface.


    # iOS App Creation Process


    To create an app, you create a new project in Xcode, the Interface Builder, drag
    interface objects, or controls, such as labels, or text fields, onto the interface,
    or view controller, and then change the attributes, or properties of the controls.
    For example, you might make a text field by changing its color attribute to red.
    Next, you program the controls to make them do what you want. Finally, you run
    the app to test it.


    In the following steps, we create a simple app with a single view application.
    The interface will eventually contain only one control: a label that displays
    the text "Hello Universe".


    +   1. Open Xcode, and click Create a new project. If Xcode is already open, then
    from the Xcode File menu, choose New New Project.


    +   2. In the left pane of Choose the template for your new project dialog, under
    "iOS", click Application.'
