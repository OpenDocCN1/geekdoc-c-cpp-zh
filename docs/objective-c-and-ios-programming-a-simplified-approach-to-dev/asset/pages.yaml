  md: '# SQLite


    SQLite is a software library that can be used to implement a relational database
    in an iOS app. The iOS SDK supports SQLite through the C programming language.
    To access data stored in a SQLite database, we write statements, known as queries.
    SQLite commands are based on the Structured Query language (or SQL). Some commonly
    used SQL commands that work with SQLite are:


    +   - sqlite3_open(): Opens a database using the path to the documents directory
    and the name of the database as a parameter.

    - sqlite3_close(): Closes an open database.

    - sqlite3_prepare_v2(): Prepares a SQL statement for execution.

    - sqlite3_step(): Executes a SQL statement and steps through the database to retrieve
    elements.

    - sqlite3_exec(): Executes a SQL command.


    The following step: summarize the process of creating a SQLite database in an
    iOS app:


    +   1. Add the sqlite3 library to the project.

    2. Find a path to the documents directory and attach the name of the database
    to the path.

    3. Open the database using the sqlite3_open method.

    4. Create a SQL command that opens the database and creates a table.

    5. Create a method that updates the database by inserting items in the database
    table.

    6. Create a method that reads data from the database by first preparing the Select-sql
    command and stepping through each row of the table and storing the items from
    the table in a string.


    # Creating a SQLite Example


    We create a simple app that stores an NSString in a database and retrieves it.


    +   1. Create a project named SQLiteExample_SingleView using the Single View Application
    template. Make sure you select the Use Storyboards check box and Use Automatic
    Reference Counting check box.

    2. Before we can implement sqlite3, we need to add its library to the project.
    To add the sqlite3 library, click SQLiteExample_SingleView at the top of the navigator
    area.

    3. Click the Build Phases tab to display the information shown in Figure 14-14.'
