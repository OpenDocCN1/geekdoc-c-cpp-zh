  md: '+   The UIKit framework is automatically added to the project. Any other frameworks
    required to play audio or video must be manually added to the project and then
    imported into the files.


    +   Audio formats supported by the AVFoundation framework include IMA4, AAC, and
    MP3.


    +   Interceptions, such as phone calls during audio playback or recording, are
    handled by the delegate methods of the AVAudioPlayer and the AVAudiorecorder classes.


    +   The AVAudioPlayer class provides a simple Objective-C interface for playing
    audio of any duration from memory or buffers and supports multiple file playback.


    +   To configure the audio player, you must assign an audio file to the audio
    player, prepare the audio player by acquiring the required hardware resources,
    and, finally, assign an audio player delegate for handling interruptions.


    +   The configuration of the AVAudioPlayer involves creating a string object that
    holds the path to the sound file, and creating and initializing a URL to the sound
    file using the path object.


    +   The framework that supports the video play back is MediaPlayer.


    +   The MPMoviePlayerController class handles movie playback from a file or a
    network stream.


    +   The play, pause, and stop methods associated with the MPMediaController class
    support playing, pausing, and stopping movies.


