    # # Adding an Image to a Tab


    Next we will add an image to the tab. In our example, we will use a default file
    provided by Apple in the project''s Supporting Files folder. However, you need
    to know how to use your own .png files as images. To do that, you first need to
    add the image to the project folder, in the form of a .png file, and assign it
    to the third tab. The following steps summarize the process of adding your own
    .png file as an image. We won''t actually performing these steps now, but you
    should be familiar with them so you can use your own .png files in the future.


