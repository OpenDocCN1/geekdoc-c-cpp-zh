  md: "```\n(void)viewWillWillAppear:(BOOL)animated\n{\n  lbl1.text = data;\n}\n```\n\
    \nGetting data to flow from the second view controller to the first view controller\
    \ is more complicated. The preceding steps are not an efficient option. Instead,\
    \ you need to use delegates to pass data from the second view controller to the\
    \ first view controller.\n\n# Delegates and Protocols\n\nA delegate is an object\
    \ that acts on behalf of another object. The objects in this case are the view\
    \ controllers. The delegate-based design pattern is used to enhance the efficiency\
    \ of an application. In this design pattern, an object plays the role of a delegate\
    \ acting by or coordinating with another object. The object that is not the delegate\
    \ is called the delegating object. The delegating object has to keep track of\
    \ the delegate and call upon it when needed by sending a message. When the delegate\
    \ receives a message from a delegating object, it responds by either presenting\
    \ another view controller, displaying data, or by passing data to the delegating\
    \ object. Figure 10-8 illustrates the relationship between a delegating object\
    \ and its delegate.\n\n![](img/bbd17465099c5722b6c62f0b71a906a7_308_0.png)\n\n\
    Figure 10-8 Delegates and protocols\nCredit: © 2015 Cengage Learning.\n\nDelegates\
    \ work in conjunction with protocols. A protocol is a method that provides a means\
    \ for programmatically interfacing a delegating object. There are two main types\
    \ of protocols: formal and informal.\n\nFormal protocols are used when an object\
    \ decides to use a delegate to communicate. A formal protocol is created by a\
    \ protocol declaration in the delegating object. The protocol declaration is then\
    \ followed by a set of methods associated with the protocol.\n\nInformal protocols\
    \ are usually implemented by a set of objects. We will be working with formal\
    \ and informal protocols.\n\nBefore it can use a delegate to communicate, a view\
    \ controller must create a protocol . The protocol must contain the method (or\
    \ methods) that perform the necessary tasks."
