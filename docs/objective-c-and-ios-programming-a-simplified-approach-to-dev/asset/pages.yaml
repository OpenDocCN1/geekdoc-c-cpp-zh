  md: '# Tab Bar View


    you can see in Figure 12-1, a tab bar controller has in the bottom row of the
    screen. The user can touch a tab to go to a specific task. The maximum number
    of tabs a phone can display at is five. If you create an app with more than five
    tabs, the fifth tab displays the word "More." The user can touch it to display
    additional tabs. The advantage of using a tab bar controller is that no matter
    what screen the user is on, the option to switch is available at the bottom of
    the screen. The user does not have to step backward through the app to go to a
    different view.


    The tab bar controller manages the view hierarchies of the app''s content view
    controllers; the content view controllers then manage their distinct view hierarchies.
    In other words, the tab bar controller is a glorified navigator with the ability
    to track a new path from any point within the view hierarchy.


    The most common way of implementing the tab bar controller is installing it in
    the main window as the root controller. The root controller is the initial controller,
    where the tab bar will first appear. This is the approach we will take in this
    chapter.


    The Tabbed Application template, as seen in Figure 12-2, creates a tab bar with
    two tabs by default template, as seen in Figure 12-2, creates a tab bar with two
    tabs by default. We can add additional tabs to the tab bar. A tabbed application
    can be created with or without a storyboard. Note that you can also choose to
    not use the Tabbed Application template; in that case, you''ll need to drag and
    drop the tab bar control onto the app''s first view.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_376_0.png)


    Figure 12-2 Tabbed Application template'
