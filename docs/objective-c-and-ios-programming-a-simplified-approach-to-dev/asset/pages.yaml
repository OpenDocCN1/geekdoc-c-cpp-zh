  md: '# CHAPTER 8 Object-Oriented Programming


    Thus far we have learned some procedural concepts in Objective-C programming.
    Now it''s time to examine some object-oriented programming concepts, such as encapsulation,
    instantiation, objects, and methods. In a procedural language, the programmer
    thinks in terms of problems, then proceeds to solve the problem by writing code
    that solves the step-by-step. By contrast, in object-oriented programming, we
    first think in terms of the objects required to perform specific tasks and then
    create mechanisms for implementing these objects using the appropriate data types
    and functions.


    # Encapsulation, Objects, Instances, and Methods


    Object-oriented programming is built on the concept of encapsulation, as well
    as a set of functions that are operational on these data elements, to create a
    robust, secure object. Encapsulation allows the programmer to limit access to
    the data within a class in a manner that provides the most feasible data security
    and protection. Objects are an extension of the concept of structures. Structures
    combine a set of data elements in one unit. Objects not only combine data elements
    but also the operations/functions performed on these elements.


    An object is an instance of a class. A class creates a description of the data
    and the operations on this data for the object. A class is similar to a blueprint
    of a building, whereas the building is the object. Another analogy is that of
    a template or prototype that can create multiple instances called objects. Creating
    an instance or an object from a class is like taking a snapshot of the class in
    the time continuum.


    To think of another way, an object is something that can be visualized, such as
    a Yorkshire puppy, whereas if you say a Yorkshire puppy is a type of dog, the
    class is the dog and the instance of the Dog class (that is, the object derived
    from the Dog class) is a particular Yorkshire puppy. A class consists of data
    members and a set of operations/functions. The operations/functions are constructors
    and methods. A function, when created in a class, is called a method.


    Constructors are special types of methods that facilitate the creations of objects.
    See the UML diagram in Figure 7-1. The left-hand part of the figure depicts a
    generic UML diagram for a class. It consists of a name, some data attributes,
    constructors to create objects/instances of the class, and methods that operate
    on the data attributes. The right-hand part of the figure is an example UML diagram
    of a Dog class. The data members, or attributes, of the Dog class are breed, height,
    color, and age, while the operations on these variables (barking, wagging tail,
    whining) would either access or manipulate these variables.'
