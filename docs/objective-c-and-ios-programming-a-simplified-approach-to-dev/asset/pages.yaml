  md: '# Initializers/Constructors


    In an object-oriented programming language, initializers are similar to constructors
    in that they are used to instantiate (that is, to create) objects. The creation
    of an object is a two-step process:


    +   1. Allocate memory for the object.


    +   2. Initialize the instance variables of the object.


    The syntax for object creation is shown in Figure 7-7.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_187_0.png)


    Figure 7-7 Format for object creation

    © 2015 Cengage Learning


    The allocation message is sent to the class. As a result, memory for the object
    is allocated. Next, the initialization message is sent to the object to initialize
    the object''s instance variables.


    # Default init


    Objective-C classes ultimately inherit from the NSObject and hence have common
    methods that can be used by all objects. One such method is the init method. The
    default init initializes the instance variables of a class to nil or zero, depending
    on the variables'' data type. When we created the yorkie dog object, we used the
    default init method, as shown here:


    ```

    // create a yorkie dog of the dog class

    Dog *yorkie = [[Dog alloc] init];

    ```


    In the yorkie object, the default init method initializes all the instance variables
    (breed, height, color, and weight) to nil or zero, depending on the data type.
    Suppose print the breed of the Yorkie dog in the main function using the getBreed
    method, as follows:


    ```

    // print the breed of the Yorkie

    NSLog("%s", [yorkie getBreed]);

    ```


    The output of this code would be null, as shown here, because the init method
    initialized the instance breed to null:


