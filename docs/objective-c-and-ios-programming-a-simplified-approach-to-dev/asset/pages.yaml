  md: 'The advantage of implementing a delegate is that it hides, encapsulates, the
    details of the code, enabling its use in other parts of the app. The steps for
    implementing a delegate, its accompanying protocol, and how they fit in the view
    controller life cycle are as follows:


    +   1. **Declare the delegate**—Here the view controller declares itself as the
    delegate for the view controller being created.


    +   2. **Instance the view controller**—In this step, the second view controller
    is created.


    +   3. **Lifetime of the view controller**—In this step, the view controller is
    able to respond to an event. When a button is touched, the view controller sends
    a message to the delegate to perform the tasks defined in the protocol.


    +   4. **Destruction**—When the delegating view is done with its tasks, it sends
    a message to the delegate, at which point the delegate dismisses it.


    Figure 10-9 illustrates these steps.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_309_0.png)


    **Figure 10-9** Delegates and protocol implementation-


