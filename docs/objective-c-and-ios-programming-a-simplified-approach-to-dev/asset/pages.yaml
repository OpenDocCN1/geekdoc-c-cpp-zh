    So far we have created an app that displays data in the format of a table. At
    this point, touching any of the cells does not give us any further information.
    Now we will look at how to display details for individual cells in a table.


    # Creating a Detail View


    The cells that provide details usually have a descriptor, such as an arrow, indicating
    that more details on the cell are available. A detail view, with more information
    about a cell''s contents, is created when a user touches a descriptor. The three
    main types of descriptors, or, as they are also called, accessories, are shown
    in Figure 11-9.


    | Descriptor shape | Name | Explanation |

    |---|---|---|

    | > | disclosure indicator | A class of the UITableViewCellAccessoryDisclosureIndicator
    opens another table view |

    | > | detail disclosure | A class of the UITableViewCellCellAccessoryDetailDisclosureButton
    may not lead to another table view |

    | ✓ | checkmark indicator | A class of the UITableViewCellAccesoryCheckmark allows
    the user to select a cell |


    Figure 11-9 Types of descriptors (or accessories)'
