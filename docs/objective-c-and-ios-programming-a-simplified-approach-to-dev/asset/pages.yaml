  md: 'So far we have implemented view controllers and added controls such as labels,
    text fields, and buttons. We have been able to display data in labels and text
    fields. In this chapter we will learn to display data in the form of lists using
    table views. We will first create a simple view using .xib files. Next, we will
    create table views using storyboards. We will populate table views with data from
    NSArrays and learn to add, delete, and edit table view data.


    # UITableView


    A table view, which is a commonly used type of view in iOS programming, looks
    like a list. A table view is an instance of the UITableView class and a subclass
    of the UIScrollView. It allows vertical scrolling through a list of items in the
    table. Each item in a table view is in a placeholder called a UITableViewCell.
    Due to space restrictions on mobile devices, the UITableView has a single column
    with multiple rows to represent a list of items. Each row can hold text or images
    and an optional accessory icon, shown in Figure 11-1, that the user can touch
    to display a more detailed view of the particular cell.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_335_0.png)


    Figure 11-1 Table view


    Copyright © 2014 Apple®. All Rights Reserved'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# UITableView View


    Tables are commonly used to allow the user to navigate through hierarchical data.
    The topmost level in the hierarchy consists of categories, with the next level
    down containing level subcategories, and the next level down containing subcategories
    of the subcategories, and so on, drilling down through the main categories. Navigation
    bars come in handy in drilling down through the levels of the hierarchy.


    There are two styles of table views: plain (UITableViewStylePlain) and grouped
    (UITableViewGrouped). The plain table shown in Figure 11-1 has one section, whereas
    the grouped style shown in Figure 11-2 has multiple rows grouped into sections.
    Grouping provides a means of separating items of similar type. It also makes it
    possible to display a clean and neat data entry area for the users, with a title
    for each section.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_336_0.png)


    Figure 11-2 Grouped table view


    You can change a table view from plain to grouped by changing the Style setting
    in the Attributes Inspector, as seen in Figure 11-3. Tables consist of sections
    and rows. There can be zero or more sections in a table. Each section has a set
    of rows/cells with optional headers and footers. The sections and rows have index
    numbers that help identify a section in a table or a row in a section. Any row
    in a section can be traced by a row index inside of a section by the following
    method:indexPathForRowRow:Section.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Table Views


    | Table View | |

    |---||

    | Style | Grouped |

    | Separator | Single Line Etched |

    | | Default |

    | Selection | Single Selection |

    | Editing | No Selection During Editing |

    | Show Selection on Touch |


    Figure 11-3 Table view attributes with Grouped selected


    A row in a table view is a cell. A cell is an instance of the UITableViewCellCell.
    When creating cells, you can choose from two types of table prototypes: static
    and dynamic. If you know ahead of time the number of cells you want your table
    to contain, you can use the static cell format, which is the most commonly used.
    In a dynamic prototype format, one cell is used as a template for generating other
    cells. This starting cell has a specific layout that the other cells follow. The
    main difference between the static and dynamic prototypes is that dynamic prototype
    cells use the data source at runtime. This is necessary, because the data itself
    determines the number of necessary cells.


    # Delegate and Data Source


    Implementing a table view requires a view controller, a data source and a delegate
    that manages the table. The view controller manages the selection of cells by
    the user. The data source follows a standard protocol to manage the data that
    is displayed in the cells. By using the standard, built-in protocols in the UITableView
    class, we eliminate the need to write the protocol and delegate for the table;
    instead the UITableView controller automatically adopts the delegate and data
    source protocols. In order to adopt the built in delegate and data source protocols,
    we need to include the following @interface directive:


    ```

    @interface TableViewController : UIViewController

    <UITableViewDelegate, UITableViewDataSource>

    ```'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Creating an App with a Table View


    This directive allows us to use the built-in delegate and data source methods.


    When a user taps a cell, the delegate sends a message that the index of the row
    was tapped. The delegate uses this information to find the correct data in the
    data source.


    The data source follows the protocol called UITableViewDataSource. It has two
    important methods that have to be implemented so that it can follow the protocol.
    These are:


    +   - numberOfRowsInSection: Informs the table view of the number of rows in a
    section.


    +   - numberOfSectionsInUITableView: Informs the table view of the number of sections
    in a table view.


    Additional methods are optional and support editing the table view. An example
    of an additional method is the following:


    +   - tableView:cellForRowAtIndexPath: Refers to the cell to be displayed in the
    table view.


    The delegate and the data source are the same object. In our case, the UITableViewViewController
    class is playing the role of both the data source and the delegate. The delegate
    follows the UITableViewDelegate protocol and all of its methods are optional.


    # Creating an App with a Table View


    The following is the sequence of steps involved in the creation of a table view:


    +   1. Create and initialize the UITableView instance.


    +   2. Set the data source and the delegate, and then send the reload message.


    +   3. Adopt the delegate and the data source.


    +   4. Send the numberOfSectionsUITableView message to the data source, informing
    the table view of the number of sections.


    +   5. For each of the sections, the number of rows is known by the message sent
    to the table view by the numberOfRowsInSection method.


    +   6. The method cellForRowAtIndexPath provides information on each individual
    cell of the table view and returns the UITableView object for each row.


    Now let''s get some practice creating a table view. The UITableViewViewController
    class will set the delegate and data source protocols automatically. In this example,
    we will create a project from the Single View Application template and add a table
    view controller to the project. That means we will be using a UIViewController
    as well as a UITableViewViewController object.'
