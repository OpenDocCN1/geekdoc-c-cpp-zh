  md: '# Summary


    +   - When a touch event occurs in a view, a message is sent to the view controller
    of the view.

    Although the view is where the touch occurred, the View Controller is expected
    to know how to handle the touch.


    +   - Presenting a view occurs when a view is shown in an application.


    +   - The method used to present the view is presentViewController:vc2 animated
    completion:Nil.


    +   - Each view has an @interface, @implementation and a .xib file.


    +   - Applications created using storyboards do not have .xib files for the user
    interface; instead they have one storyboard for the user interface.


    +   - In an application that does not use storyboards, each .xib file holds the
    interface for an individual view, which is part of the entire user interface.


    +   - In an application that uses a storyboard, there are no individual .xib files;
    instead, the one storyboard contains the app''s entire user interface.


    +   - The life cycle of a view controller has three phases: instantiation, lifetime,
    and destruction.


    +   - A view is created by another view by first instantiating it and then presenting.


    +   - To pass data between views the data is passed as a member of the instance
    created.


    +   - Delegates and protocols are used to manage and enhance efficiency of applications.
    There are two objects involved in this mechanism. One object is the delegate,
    and the other object is called the delegating object


    +   - When using a delegate to communicate, the view controller will create a
    protocol so the delegate can implement it in communication.


    +   - When a button is pressed or touched and a task is to be performed, the view
    controller will send a message to the delegate and the delegate will perform the
    tasks defined in the protocol.


    +   - One way of dismissing the keyboard is setting the IBAction property of a
    view and resigning the first responder in the view method.


    +   - Another way of dismissing the keyboard is tapping anywhere other than the
    keyboard. To make this possible, set the view as a control and program the control
    to resign the first responder by the method that is triggered by the event of
    touching the control.'
  merge: -1
