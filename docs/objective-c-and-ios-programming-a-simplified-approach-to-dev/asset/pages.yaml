    # Counter-Controlled for Loop


    The for loop is controlled by a count that counts the number of times the loop
    is executed, meaning the loop is executed a fixed number of times. The for loop
    is also referred to as a counter-controlled loop, because its design is to control
    the number of iterations in the loop, meaning the counter is equal to the number
    of iterations required. In Example 4-2, the number of repetitions was 5.'
