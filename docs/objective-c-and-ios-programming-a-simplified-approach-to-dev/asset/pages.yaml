    Figure 7-2 Method declaration

    © 2015 Cengage Learning


    In Objective-C, if a method has multiple parameters, then a long meaningful name
    can be given to the method and the name can be split into meaningful sections
    followed by a colon and then a parameter. A colon precedes each parameter. The
    method is split into smaller sections, with meaningful names used to represent
    the parameters. This naming technique makes it easier for a developer to make
    sense of a declaration.


    Let''s look at an example of a method:

    -(double) calculateBodyMass:(double) massWeight(double):weight


    In this example, the name of the method is calculateBodyMass. This name is split
    meaningfully into two sections. Each section is followed by a colon and then the
    parameter. The first section, calculateBodyMass, corresponds to the parameter
    called mass. The second section, Weight, corresponds to the parameter called weight.


    # Calling/Invoking Methods — Messaging


    Calling, or invoking, methods in a class in Objective-C is done using the messaging
    system. In the traditional dot notation methodology that is used to invoke methods
    in a class, the name of the method follows the object name, with a dot in between,
    as seen in the following codenyorkie.bark();


    By contrast, an Objective-C message uses the following format:

    [yorkie bark];


    The called is the receiver and bark is called the sender. In other words, the
    object is the receiver and the message is the sender. Methods send and receive
    messages to and from the object, hence providing a means of communication with
    the object.

    [receiver sender];


    Passing a parameter to the method you would look as follows:

    [yorkie bark:mimi];'
