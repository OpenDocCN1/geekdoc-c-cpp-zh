    # Buffer Overflow with scanf When Reading a char


    When a program reads a char, the char is stored in a buffer that is big enough
    to store one char. Occasionally there is a chance of buffer overflow—meaning the
    buffer can only take one char and the buffer already contains something from the
    previous time the code ran. If there was a character left from the previous time
    the code was run, then there is no space in the buffer to hold any more data,
    which in turn may premature termination of the program. For example, suppose your
    program reads

    scanf("%s", &operation);


    In this line, % will read one char at a time, but if there is something else in
    the buffer from the previous running of the code, then input will not be accepted.
    One way of avoiding this is using %s instead of %c. As you''ll learn in later
    chapters, %s is for strings.


