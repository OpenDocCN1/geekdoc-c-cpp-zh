    # # Creating a Tab Bar Without Storyboards


    So far, we''ve focused on adding a tab bar to an app while using storyboards.
    Now let''s focus on adding a tab bar while while using the .sib file instead.
    In this situation, the AppDelegate.m file plays a critical role in the workings
    of the tab bar. The AppDelegate.m file is the file where the tab controller is
    created and initialized.

    `didFinishLaunchingWithOptions` method of the AppDelegate.m file is where all
    the view controllers are instantiated and assigned to the tab bar.


    Some of the most important methods in the implementation of a tabbed app are:


    +   - viewDidLaunch in the AppDelegate.m file

    - initWithWithName of the individual view controllers


    The following steps summarize the process of adding a tab bar controller to an
    app without storyboards:


    +   1 Create a new project using the Tabbed Application template.

    2 Add a new file of type Objective-C.

    3 Open the .sib file and drag a button from the Object Library onto the view controller.

    4 Import the newly added view controller to the AppDelegate.m file.'
