    # Derived Data Types


    Various combinations of the basic data types can be used to create more complex
    data types, which are called derived data types. The following sections introduce
    some commonly derived data types.


    # Type pointer


    The pointer type is a data type that points to the location where data is stored.
    In other words, it holds the memory location of the data type it is pointing to.
    In Objective-C code, a pointer is always preceded by an asterisk character and
    a space. The * symbol in Objective-C creates a pointer and also dereferences it,
    meaning it extracts the value the pointer is pointing to.


    In the following example, an int variable value is declared and assigned a value
    of 5.

    int value = 5;


    An integer pointer variable ptrValue is then created, as follows:

    int *ptrValue;


    Next, the pointer variable ptrValue is pointed to the address of the variable
    value in this line of code, the & symbol before the variable value gives its address
    location:

    ptrValue = &value;


    We then use the NSLog statement to print the pointer value. Notice in Example
    2-7 that the *ptrValue is used as the argument in the NSLog. The * symbol dereferences
    the pointer, making it easy to print the pointer is pointing to.


    Figure 2-1 illustrates the concept of a pointer variable.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_38_0.png)


    Figure 2-1 Pointer to the address of an int variable


