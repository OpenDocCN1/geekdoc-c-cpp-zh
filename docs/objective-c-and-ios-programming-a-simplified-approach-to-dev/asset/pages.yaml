  md: "# NSString\n\nNot all Objective-C programming is done in the Foundation framework.\
    \ So when you choose to implement the Foundation framework functionality, you\
    \ must include the statement #import <Foundation/Foundation.h>\n\nIn Objective-C,\
    \ memory management—that is, the process of creating and releasing memory for\
    \ objects-is crucial. One important memory management mechanism is Autoreleasepool.\n\
    \n# Autoreleasepool\n\nWhen a data element is created, memory has to be allocated\
    \ to store this data element. When data is no longer needed, it is discarded,\
    \ and any associations with the memory allocated to it also have to be discarded.\
    \ Similarly, each time an object is created, memory is reserved for it, and when\
    \ the object is no longer needed, the associated memory is discarded. In Objective-C,\
    \ automatic reference counting (ARC) allows the compiler to use @autoreleasepool\
    \ to control reservation and release of memory for any object. This frees the\
    \ developer from the burden of manual memory management. It works on the block\
    \ of code placed in the braces following the statement @autoreleasepool, as shown\
    \ in Example 6-1, lines 4 through 7. When @autoreleasepool is used, the compiler\
    \ records the state of the block of statements following the @autoreleasepool\
    \ statement ends, the memory is cleared, all the objects are destroyed, and the\
    \ memory returns to the state it was in before @autoreleasepool (line 3).\n\n\
    # Example 6-1\n\n```\n1 int main(int argc, char *argv[])\n2 {\n3 @autoreleasepool\n\
    4 {\n5 ...\n6 }\n7 \n8 \n9 return 0;\n10 }\n```\n\nAutoreleasepool implementation\
    \ is required for the use of the classes in the Foundation framework. Some of\
    \ the commonly used basic classes in the Foundation framework NSString, NSMutableString,\
    \ NSArray, NSMutableArray, NSDate, NSDictionary, and NSMutableDictionary.\n\n\
    # NSString\n\nA string is an array of Unicode characters. The Unicode characters\
    \ are a larger set of characters than the traditional alphabet set. A string object\
    \ is enclosed in double quotation marks and preceded by the @ symbol as seen below:\n\
    @\"This is my string object\""
