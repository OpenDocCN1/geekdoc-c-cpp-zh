  md: '# UIButton Class


    A button control object is an instance of the UIButton class. The button is capable
    of intercepting touches; when it does so, it sends the action method to the target.
    The UIButton class inherits from the UIControl class and thus has access to the
    methods that send the action messages to the target.


    # UITextField Class


    A text field control object (sometimes called a text box) is an instance of the
    UITextField class. This type of control can be edited by the user and has an associated
    action method that is triggered when the user presses Enter after entering text.
    This action method can be programmed to perform a numerous tasks, such as searching
    for text, displaying additional text in a label or other control, and so on.


