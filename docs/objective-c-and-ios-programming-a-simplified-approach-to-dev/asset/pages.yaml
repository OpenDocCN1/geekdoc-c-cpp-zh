    # Instance and Class Methods


    A function in a class is called a **method**. There are two main types of methods
    in an Objective-C class: class methods and instance methods. Methods that can
    only be invoked after the instantiation of the class are called **instance methods**.
    The methods that can be executed irrespective of the instantiation of the class
    are called **class methods**. The instance methods are identified by a minus (-)
    sign before the method name, whereas class methods are identified by a plus (+)
    sign, as seen in the following code:


    ```

    1 -(void) bark; //------Instance method

    2 +(void) DogBark:(NSString*) dogName; //------class method

    ```


    Line 1 is an instance method called bark with no parameters. Line 2 is a class
    method called DogBark with dogName as a parameter.


    **Note:** Instance variables are also called data members or attributes. Instance
    methods are also called method members of a class or an object.


    # Method Declaration


    In Java, a declaration would look like follows:


    ```

    (returnType) methodNamePart1namePart2(datatype parameter1, datatype parameter2
    ...)

    ```


    In Objective-C, methods are declared using the format shown in Figure 7-2.'
