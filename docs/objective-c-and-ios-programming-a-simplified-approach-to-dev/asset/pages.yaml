    to the video file, which is then passed as a parameter to the MPMoviePlayerController
    object, as seen in the following code:


    ```

    //instantiate the movie player object with the path to the movie player as a parameter

    moviePlayer = [[MPMoviePlayerController alloc] initWithContentURL:[NSURL fileURL:videoPath]];

