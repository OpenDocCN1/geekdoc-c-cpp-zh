    \ init method. The syntax of an init method is is as follows:\n\n# SYNTAX\n\n\
    ```\n-(id) init\n{\n    if (self == [super init])\n    {\n        //do the following\n\
    \    }\n    return self;\n}\n```\n\nThe super init is always called to ensure\
    \ the instance variables of the parent class are initialized, where super init\
    \ is the init method of the parent class. The term “parent class” is explained\
