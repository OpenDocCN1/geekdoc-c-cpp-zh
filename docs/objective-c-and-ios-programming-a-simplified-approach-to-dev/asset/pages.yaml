    # Coding for View 1


    +   4. Write the code for view 1 required to pass data.


    +   a. Declare the protocol. In the .h file below the #import and above the @interface,
    create the protocol. The protocol consists of a declaration, body, and end.


    +   i. The protocol declaration starts with the @protocol followed by a unique
    name of the protocol and the <NSObject>.


