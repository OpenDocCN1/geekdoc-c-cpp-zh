  md: "# Condition-Controlled Loop\n\nThe condition-controlled loop works in two ways:\n\
    \n+   1. It is executed only if a condition changes.\n2. It stops execution upon\
    \ the satisfaction of a condition.\n\nThe while loop and the do-while loop can\
    \ be classified as condition-controlled as well as counter-controlled loops, meaning\
    \ the while loop and the do-while loop can each be implemented as a counter-controlled\
    \ loop with a specific number of iterations or as a condition-controlled loop,\
    \ where these loops be executed based on a condition. The main difference between\
    \ the while and the do-while loop is that the while loop is a pretest loop, meaning\
    \ the condition is tested before the execution of the statements in the while\
    \ loop. By contrast, the do-while is a posttest loop, meaning the do-while statements\
    \ are executed at least once before the condition is tested.\n\n# while Loop\n\
    \nA for loop is used when the number of iterations is finite and known. If you\
    \ are unaware of the number of iterations required, you should use the while loop\
    \ instead. The syntax for the while loop is:\n\n```\nSYNTAX\nInitialization of\
    \ a condition\nwhile (condition)\n{\n  // statements to be executed\n  //condition\
    \ changes facilitating the termination of the while\n}\n```\n\nThere are four\
    \ main types of while loops:\n\n+   1. Flag-controlled—The loops continues until\
    \ a Boolean variable changes its value.\n2. Counter-controlled—The loop continues\
    \ until a counter variable attains a certain value, similar to the for loop.\n\
    3. Sentinel-controlled—The loop continues until the user enters a predefined sentinel\
    \ value to terminate the loop.\n4. End-of-file-controlled—The loop continues until\
    \ the end of the file is reached.\n\nIf you are asked to calculate the average\
    \ score of all the courses for a student without knowing how many courses a student\
    \ has taken, you can use a flag-controlled while loop. One approach to this problem\
    \ is test to see if the end of the courses has been reached."
