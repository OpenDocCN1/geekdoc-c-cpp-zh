    **Note:** When we talk about a child class inheriting from a parent class, we
    sometimes say that a child class is derived from the parent class.


    # First Tier of Inheritance: Inheritance from NSObject


    In this chapter we have so far looked at single level inheritance, in which all
    classes ultimately inherit from the NSObject.


    Now we will drop one step lower in the hierarchy to examine how inheritance works
    with classes. We will learn about inheritance and apply it one level at a time.


    As an example, we will discuss an imaginary class called device, which holds features
    that are common to the iPhone and to iPadDevices such as the iPad. Note that this
    is just a conceptual example designed to illustrate characteristics of inheritance,
    and does not have any relation to real objects and classes in Objective-C.


    In our example, device inherits from the NSObject, and the iPhone and iPad inherit
    the device. The iPadMini inherits from the iPad as seen in Figure 7-11.'
