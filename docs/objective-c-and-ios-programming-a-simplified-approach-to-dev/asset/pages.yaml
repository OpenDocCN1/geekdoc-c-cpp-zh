    # Introduction to the Foundation Framework


    Now that you understand how objects communicate using messages, we will proceed
    with the Foundation framework, which in turn provides support to utility classes
    such as Objective-C and iOS programming. Figure 6-3 illustrates the role of methods
    in a framework. A set of methods makes up a class. A set of classes makes up a
    framework.


    ![](img/bbd17465099c5722b6c62f0b71a906a7_149_0.png)


    **Figure 6-3** Constituents of a framework

    © 2015 Cengage Learning


    The Foundation framework, built on the premise of utility, support, consistency,
    independence of the operating system, and portability, forms the infrastructure
    of the Objective-C language. It is a library of classes and methods that provide
    language consistency and basic functionality for strings, numbers, arrays, dictionaries,
    dates, file systems, location and net services. The Foundation framework includes
    a root object class called NSObject, which in turn provides support to some basic
    utility classes such as NSString, NSMutableString, NSArray, NSMutableArray, NSDictionary,
    NSMutableDictionary, NSDate, NSError, NSNetService, NSNotification, and NSData.
    The Object class consists of subclasses that contain methods, which can be called
    upon to implement strings, arrays, date and time, URLs, net services, and notifications.
    It''s left to the developers'' discretion as how to utilize these classes and
    methods to develop programs.'
