  md: '# # Arrays


    An array is used to store multiple values together. Imagine you want to store
    the names of 5 cars, one way would be create10 different variables to store the
    values. The variables could be ‘car1’, ‘car2’, ‘car3’, ‘car4’‘car5’. Now if you
    have to print all the names, you’d have to type the print statement 5 times for
    each car. Now imagine if instead of 5 cars, you are dealing with 100 cars. It
    will be really tedious.


    An array helps us solve this problem. An array in Python is called a List. Below
    is the syntax for declaring an array:


    ```

    ```python

    carNames = [ ‘Toyota’ , ‘Ford’ , ‘BMW’ , ‘Ferrari’ , ‘Porsche’]

    ```

    ```


    The square brackets tells Python that the variable is a list and is expected to
    store multiple values. Each value in a list is called an element, i.e. ‘Toyota’
    is an element, ‘BMW’ is an element and so on. Each element in a list has an index,
    the first element in the list has an index 0. Note that it’s not 1, it starts
    from 0. The last element in our case has an index 4.


    Suppose we want to access the element at index x, we use the following syntax


    ```

    ```python

    carNames[x]

    ```

    ```'
