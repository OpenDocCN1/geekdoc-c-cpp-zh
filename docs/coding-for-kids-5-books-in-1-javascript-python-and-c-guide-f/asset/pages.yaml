  md: "# Conditional Statement\n\n# What is the conditional statement?\n\nIt is a\
    \ statement that checks if a certain condition is true. It can be as simple as\
    \ checking if a number is less than 10 to something as checking medical samples\
    \ from patients for certain medical conditions.\nIn Javascript, the conditional\
    \ statement is done using IF ELSE statements. So, it basically checks that if\
    \ something is true, then perform an action. If it’s not true, then do something\
    \ else. As an example,\n\n```\nIF (George==”Hungry”)\n{\n    Document.write(“Give\
    \ George a Snack);\n}\nELSE\n{\n    Document.write(“No snack for George”);\n}\n\
    ```\n\nIn the above example, the code checks if George is hungry and performs\
    \ one of two actions. If George is hungry then it prints ‘Give George a snack’.\
    \ If not, then print ‘No snack for George’.\nThis is a simple example of a conditional\
    \ in JavaScript using IF ELSE statement."
