    hidden inside them. These include items like washing machines, dryers, refrigerators,
    car, vehicles, air conditioners and elevators, which have some sort of computer
    chip inside them. How do we tell computers how to work? It is through programming!
    A programming language is a language that a machine can understand and run to
    perform various tasks. It is how we communicate with machines to make them understand
    what we want to accomplish. A program is a logical sequential statement that perform
    a task. A program can be in any programming language we want. It can even be in
    1s and 0s which is only thing that a computer understands. Everything in a computer
    is in 1s and 0s. A high level programming language uses English like language
    so we can program computers easily. Ultimately, any program in any language is
    converted into 1s and 0s so that a machine can understand.'
