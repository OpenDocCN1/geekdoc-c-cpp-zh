- pgno: 419
  md: '# Introduction


    Do you want your child to code? I am sure this feels like an impossible endeavor,
    doesn’t it? It is as hard as learning a new language, and this is definitely a
    daunting experience for a child. It is harder to convince your child to learn
    to code as well. Every parent has been there. You know how difficult it is to
    start a new journey. It is quite overwhelming and scary. So, how do you think
    your child may feel about it? He is going to have a million questions, such as:


    +   - Can I learn how to code?

    +   - Will I ever reach a stage in life where coding is easy?

    +   - When can I use this skill?

    +   - Is it something that will help me in school? If not, why am I even doing
    it?


    These statements stop most of us, so it is going to stop your child, too. The
    entire process of learning is too tedious. You first need to have a plan in mind,
    then find the right courses so you learn, make sure you are good enough and then
    create an app or tool. Having said that, you should first decide what it is you
    want to learn. You also need to know everything there is to know about the new
    subject, so you know what the dividend will be. There is no easy way to go about
    this, and it is a quite challenging task.


    A new task may seem impossible when you start off, and it will definitely be hard
    for you to meet your goals if you do not take the necessary steps. If it is this
    hard for you, how hard do you think it will be for your child? You need to ensure
    that you and your child jump in with two feet. If both of you do not commit to
    learning, it will only lead to frustration. It will also lessen'
  merge: -1
  img_proc: true
- pgno: 420
  md: 'the chance of your child following through with the course and succeeding.

    It is best to let your child start with something small, take his time to learn

    and achieve measurable and realistic goals.


    If this is what you want to do, you have come to the right place. You will

    find all the information your child needs to learn more about coding and get

    involved in it. There are different gamified and fun exercises that will keep

    your mind engaged. It is quite difficult to engage a young brain and

    motivate your child to learn something new and complex. However, the

    information and exercises make coding easy to understand. So, before you

    coax your child into learning how to code, make sure to do the following:


    +   - Explain to your child why it is important for him to learn to code

    +   - Outline the benefits of coding

    +   - Define some key terms

    +   - Look at different examples

    +   - Choose a programming language and begin!


    Coding, in simple terms, is a language used to communicate with computers

    and machines. You can also use this language to build and run apps,

    websites and more.


    # How to Make your Child Code?


    This question has numerous answers but let us focus on how it helps your

    child move forward. This does not mean your child must make giant leaps.

    If you read the section above, you know it only means your child needs to

    start off small. The only thing you must focus on is to ensure your child

    progresses with every move he makes with respect to coding. This gives

    rise to the question – why should my kid learn to code?


    The idea that kids should lean to code was planted years ago, and at the

    time, you may have believed it was hype. The concept was new, and every

    educational institute wanted to include coding classes for kids. The idea'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 2024年高企认定申报全攻略


    什么是高新技术企业？


    高新技术企业是指在《国家重点支持的高新技术领域》内，持续进行研究开发与技术成果转化，形成企业核心自主知识产权，并以此为基础开展经营活动，在中国境内（不包括港、澳、台地区）注册的居民企业。


    # 认定条件


    +   1. 企业申请认定时须注册成立一年以上；

    +   2. 企业通过自主研发、受让、受赠、并购等方式，获得对其主要产品（服务）在技术上发挥核心支持作用的知识产权的所有权；

    +   3. 对企业主要产品（服务）发挥核心支持作用的技术属于《国家重点支持的高新技术领域》规定的范围；

    +   4. 企业从事研发和相关技术创新活动的科技人员占企业当年职工总数的比例不低于10%；

    +   5. 企业近三个会计年度（实际经营期不满三年的按实际经营时间计算，下同）的研究开发费用总额占同期销售收入总额的比例符合如下要求：

    +      - 最近一年销售收入小于5,000万元（含）的企业，比例不低于5%；

    +      - 最近一年销售收入在5,000万元至2亿元（含）的企业，比例不低于4%；

    +      - 最近一年销售收入在2亿元以上的企业，比例不低于3%。

    +      其中，企业在中国境内发生的研究开发费用总额占全部研究开发费用总额的比例不低于60%；

    +   6. 近一年高新技术产品（服务）收入占企业同期总收入的比例不低于60%；

    +   7. 企业创新能力评价应达到相应要求；

    +   8. 企业申请认定前一年内未发生重大安全、重大质量事故或严重环境违法行为。


    高企认定评分标准：


    | 指标 | 分值 |

    | --- | --- |

    | 知识产权 | 30 |

    | 科技成果转化能力 | 30 |

    | 研究开发组织管理水平 | 20 |

    | 企业成长性 | 20 |


    > > 提示：知识产权相关评价指标包括技术的先进程度、对主要产品（服务）在技术上发挥核心支持作用、数量、获得方式以及企业制定标准等情况。'
  merge: -1
