    toUpper() – This changes the entire string to upper case. In the above example,
    str.toUpper() becomes “HI PETER”.

    toLower() – This changes the entire string to lower case. In the above example,
    str.toLower() becomes “hi peter”.


    # Example 1 – Playing with Your Name; Reverse name game


    In the example below, we enter our name through a form. There are two buttons,
    one prints the length of your name; and the second reverses your name. The first
    button runs a function called **strlen()**, **strlen()** gets your name via the
    form and finds the length using the **.length** function. The second button executes
    a function called **namereverse()**. namereverse() gets your name via the form
    again and finds the length. Then it runs a FOR loop which starts from the last
    character and keeps subtracting 1 till it reaches the first character. It prints
    out the character at each loop iteration. This prints out letters from the last
    character to the first, thus reversing the name. Below is the code and output.'
  merge: -1
  img_proc: true
