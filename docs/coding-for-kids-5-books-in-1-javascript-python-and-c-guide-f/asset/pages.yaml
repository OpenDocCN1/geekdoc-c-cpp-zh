  md: "# Example 4 Bouncing ball\n\nIn this program we create a ball that keep bouncing\
    \ off borders.\n\nWhat does it mean for a ball to bounce off border?\n\nEarlier\
    \ we kept moving the ball by incrementing/decrementing its x and y position by\
    \ a unit step.\n\nIn moving the ball right, we incremented x by 1, while we decremented\
    \ x by 1 to move it to left. So, to bounce the ball of a given border we need\
    \ to detect which border it is hitting and increment or decrement the right coordinate\
    \ x or y.\n\nIn bounce function,\n\n```\n    stepx = -1 * stepx    , flip x direction\
    \ if right or left borders touched\n    stepy = -1 * stepy    , flip y direction\
    \ if top or bottom borders\n    touched\n```\n\nThese lines keep flipping the\
    \ corresponding coordinate whenever a border is touched."
  merge: -1
  img_proc: true
