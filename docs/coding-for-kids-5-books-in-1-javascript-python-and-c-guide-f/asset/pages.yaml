    \ the while loop and the program ends.\n\n# Example 2\n\nBelow is a function that\
    \ takes in a number (n) and adds all integer numbers from 1,2 …. N.\n\n```\n```python\n\
    def add_numbers(n):\n    n = int(n)\n    total = 0\n    counter = 1\n    while\
    \ counter <= n:\n        total = total + counter\n        counter = counter +\
    \ 1\n    return total\n\nn = input(\"Please enter value of n: \")\nprint(\"Total\
    \ sum is\",add_numbers(n))\n```\n```\n\nCounter is the current number being added,\
    \ starting from 1. Total is the summation of the numbers so far. We increment\
    \ counter by 1 every iteration to change the number being added, so counter goes\
    \ 1,2,3… n. When the counter reaches n + 1 the while loop will break, and we return\
    \ the total at the end."
