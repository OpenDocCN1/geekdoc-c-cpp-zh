  md: "# # IF LOOP EXAMPLE 2\n\nLet’s take another example. How about if you are looking\
    \ to figure out which gym to sign up for. You want to sign up for gyms that are\
    \ within 5 miles and cost less than $60 per month. So, you have two IF loops that\
    \ check for each condition. The loops are within each other. This is called a\
    \ Nested Loop. Let’s have a look below.\n\n```\n```html\n<html>\n<head><title>Gym\
    \ Test</title></head>\n<body>\nEnter Name of Gym:<input name=\"g1\" type=\"text\"\
    \ id=\"gname\" size=\"20\"><br>\nEnter Gym Distance from home:<input name=\"g2\"\
    \ type=\"number\" id=\"dist\" size=\"20\"><br>\nEnter Monthly Membership Costs:<input\
    \ name=\"g3\" type=\"number\" id=\"memc\" size=\"20\"><br><br>\n\n<button onclick=\"\
    checkgym()\">Check Gym</button>\n\n<script>\nfunction checkgym()\n{\nvar name\
    \ = document.getElementById(\"gname\").value;\nvar gymdistance = parseInt(document.getElementById(\"\
    dist\").value);\nvar memberprice = parseInt(document.getElementById(\"memc\").value);\n\
    \n//Check condition\nif (gymdistance<5)\n{\n    if(memberprice<60)\n    {\n  \
    \  document.write(name+\" is a possible gym\");\n    }\n    else\n    {\n    document.write(name+\"\
    \ does not work for me\");\n    }\n}\nelse\n{\n    document.write(name+\" does\
    \ not work for me\");\n}\n}\n</script>\n\n</body>\n</html>\n```\n```\n\nIn the\
    \ above a html form allows the user to enter a gym name with id=”gname”, a gymdistance\
    \ with id=”dist” and a gym price with id=”memc”. The JavaScript variables name,\
    \ gymdistance and memberprice store the values of the user inputs. One IF statement\
