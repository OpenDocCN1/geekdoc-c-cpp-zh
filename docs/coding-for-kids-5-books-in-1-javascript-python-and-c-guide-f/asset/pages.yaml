    # if elif else conditional\n\nWhat if want to have multiple branches instead of\
    \ only two? if elif else conditional is also called chained conditionals. In chained\
    \ conditional only one branch is executed. elif stand for else if. We can have\
    \ any number of elif statements as the program logic needs.\n\nFirst, if expression\
    \ is evaluated, if it evaluates to false, then program proceed to evaluating expression2\
    \ belonging to first elif, the program keeps evaluating each expression until\
    \ it evaluates to True and execute the corresponding statement/block. If all statements\
    \ evaluate to False then it executes else block.\n\n```\n```python\nIf expression:\n\
    \    statement1\nelif expression2:\n    statement2\nelif expression2:\n    statement3\n\
    else:\n```\n```"
