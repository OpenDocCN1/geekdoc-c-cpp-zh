    | `!=` | Not equal | Returns True if numbers are not equal else False. | `5 !=
    9` | True |

    | `>` | Greater than | Returns True if n1 > n2 else False | `10 > 1` | True |

    | `>=` | Greater than or equal | Returns True if n1 >= n2 else False | `10 >=
    10` | True |

    | `<` | Less than | Returns True if n1 < n2 else False | `5 < 10` | False |

    | `<=` | Less than or equal | Returns True if n1 <= n2 else False | `1 <= 2` |
    False |


