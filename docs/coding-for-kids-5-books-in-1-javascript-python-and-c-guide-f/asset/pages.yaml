  md: "# Conditional Statement\n\nWe usually want to do something only when a certain\
    \ condition is true. For example, if it is sunny outside then we go out and play,\
    \ else we stay at home.\n\nThe statement, it is sunny outside, can only either\
    \ be true or false.\n\nIn programming we have a data type that can only store\
    \ the value true or false, this data type is known as a **boolean**. In C++ we\
    \ usually shorten it to **bool**.\n\nIn addition, we sometimes want to run lines\
    \ of code only when a certain condition is true, and we achieve this using if\
    \ statement. Let’s do an example, which will make it easier to understand\n\n\
    # Example Code\n\n![](img/443990a0ec620659ce8be783c0758bc6_60_0.png)\n\n```\n\
    ```cpp\n#include<iostream>\nusing namespace std;\n\nint main(){\n    bool sunny\
    \ = true;\n\n    if(sunny){\n        cout << \"You can go outside to play\" <<\
    \ endl;\n    }else{\n        cout << \"Don't go outside to play\" << endl;\n \
    \   }\n\n    return 0;\n}\n```\n```"
