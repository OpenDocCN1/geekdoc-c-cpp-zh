- pgno: 262
  md: '# # Introduction to CSS


    # ## What is CSS?


    CSS is an acronym for Cascading Style Sheets. It allows the user to set and modify
    the style of your html website. ‘Style’ is a term used for font type, font color,
    background color, shading etc. CSS elements can be accessed through html and JavaScript.


    # ## Create CSS file and link to html file


    There are 5 steps to create a CSS file and link it to a html document.


    +   1. To create a css file, open a black html document and save as ‘CSS’ file
    type. In this case, we’re going to name it ‘samplestyle’.


    ![](img/443990a0ec620659ce8be783c0758bc6_262_0.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '2. Go to the relevant html and include the line below in the header file.


    You can do so with the line below.


    ```

