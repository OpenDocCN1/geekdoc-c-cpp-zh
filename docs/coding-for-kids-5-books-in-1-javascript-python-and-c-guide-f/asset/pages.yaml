  md: "# html forms\n\nRemember those forms you see online where you enter your name\
    \ and age and date of birth? Those are html forms.\n\nToday, we’re going to learn\
    \ how to make those.\n\nBefore we start making forms, we need to learn about a\
    \ few basic form elements:\n\n**Button `<button>`** - It is an element that allows\
    \ the user to perform an action when clicked.\n\n**Textbox `<input>`** - This\
    \ element allows the user to type text into a box on the browser screen. It’s\
    \ used to collect small text items like name, city etc.\n\n**Textarea `<textarea>`**\
    \ - This allows the user to input larger quantities of text. It is bigger in size\
    \ than the textbox. It’s used for larger text items like address, comments etc.\n\
    \n**Option Select `<select>`** - This element allows the user to select between\
    \ several available options. It’s basically a drop-down box.\n\n**Date Input `<input\
    \ type=\"date\">`** - This elements allows the user to choose a date from a calendar\
    \ drop down.\n\nNow, let’s go through each of these examples through a sample\
    \ form below.\n\n# Sample Form\n\n```\n```html\n<html>\n<head><title>Sample Form</title></head>\n\
    <body>\n<form id=\"form1\">\nEnter First Name:<input name=\"firstname\" type=\"\
    text\" id=\"firstname\" size=\"20\"><br>\nEnter Last Name:<input name=\"lname\"\
    \ type=\"text\" id=\"lname\" size=\"20\"><br><br>\nEnter Address:<textarea name=\"\
    TextBox\" cols=\"40\" rows=\"5\" id=\"txtbox\"></textarea><br><br>\nEnter Country:\
    \ <select id=\"country\" name=\"country\">\n               <option value=\"USA\"\
    >USA</option>\n               <option value=\"Mexico\">Mexico</option>\n     \
    \          <option value=\"Canada\">Canada</option>\n               <option value=\"\
    Australia\">Australia</option>\n               </select>\nDate of Birth: <input\
    \ type=\"date\" id=\"start\" name=\"trip-start\"\nvalue=\"2020-07-02\"\nmin=\"\
    1918-01-01\" max=\"2020-06-31\"><br>\n<button onclick=\"\">Submit</button>\n</form>\n\
    </body>\n</html>\n```\n```\n\nNow, let’s go through each part of the code."
