  md: '# # Creating a Canvas


    # ## What is a Canvas?


    A canvas is a html element allows that allows the user to draw graphics, shapes,
    images and run animations using JavaScript. It is a rectangular area on the html
    page, the size of which we can define.


    # ## Canvas Example


    The size of a canvas is defined in the unit of pixels. A pixel is the smallest
    unit of illumination on a computer screen. The most used computer size is 1366
    pixels width by 768 pixels height.


    Below is the sample canvas, which has a width of 500 pixels and height of 500
    pixels. It has a visible border of 2 pixels around the canvas.


    ```

