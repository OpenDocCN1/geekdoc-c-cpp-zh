    | += | Addition assignment | j += 2 | j = j + 2 |

    | -= | Subtraction assignment | j -= 2 | j = j - 2 |

    | *= | Multiplication assignment | j *= 2 | j = j * 2 |

    | /= | Division assignment | j /= 2 | j = j / 2 |

    | %= | Modulus assignment | j %= 2 | j = j % 2 |

