  md: "# What is html?\n\nhtml stands for Hyper Text Markup Language.\nIt is the programming\
    \ language that we use to interact with the internet through web pages. The basic\
    \ structure of all web pages is defined by html.\nIt is simple enough for beginner\
    \ programmers to grasp quickly.\nMost html programming is done by items called\
    \ tags. These tags start with <> \nAnd end with </>. For example, a common tag\
    \ is the paragraph tag which begins with <p> and ends with </p>.\n\n# Common html\
    \ Tags\n\n**<html>** - This tag is used at the start of every webpage to denote\
    \ the start of html code\n\n**<head>** - This piece of html code is executed before\
    \ the rest of the program\n\n**<title>** - This tag is used set the title the\
    \ web page. It writes the text on to the top ribbon of the webpage.\n\n**<body>**\
    \ - This is the information on the body of the web page.\n\n**<h1>** - Used to\
    \ denote a heading tag. This is the largest size heading tag.\n\n**<h2>,<h3>,<h4>,<h5>,<h6>**\
    \ - Used to denote subheadings of decreasing size.\n\n**<p>** - Used to denote\
    \ paragraphs of text\n\n**<img>** - This shows an image on the web page. This\
    \ image either links to an external web page or to an internal file.\n\n**<strong>**\
    \ - Added to make text bold"
  merge: -1
  img_proc: true
