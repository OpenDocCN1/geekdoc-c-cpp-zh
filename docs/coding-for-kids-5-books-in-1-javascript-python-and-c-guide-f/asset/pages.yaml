- pgno: 291
  md: "# # Loops\n\nLoops in coding are a sequence of instructions that are repeated\
    \ a certain\nnumber of times.\n\nThink of a loop like an escalator. The steps\
    \ run in a direction again and\nagain till someone pushes the stop button.\n\n\
    There are 3 types of loops based on the conditions of execution. They are:\n\n\
    +   a. **IF Loops:** IF loops contain a sequence of instructions that are\n+ \
    \     executed if a certain condition is met. If the conditions are not met,\n\
    +      the loop is not executed.\n+   \n+   b. **FOR Loops:** FOR loops contain\
    \ a sequence of instructions that are\n+      executed for a certain number of\
    \ times. For example, a FOR loop\n+      from 1 to 10 executes the code inside\
    \ the loop 10 times.\n+   \n+   c. **WHILE Loops:** WHILE loops is a sequence\
    \ of instructions that are\n+      executed till a certain condition is met.\n\
    \nNow, let’s look at the elevator example through each of these loops.\n\nLet’s\
    \ say we want the elevator to run only when there are more than 1000\npeople in\
    \ the building. Then we use an IF loop that checks the number of\npeople in the\
    \ building and then runs the elevator function if that is the case.\nThe IF Loop\
    \ Example:\n\n```\nif(people>1000)\n{\nRunelevator();\n}\n```\n\nNow, if we want\
    \ to do a 1000 run test on the elevator to see if it can hold a\ncertain weight;\
    \ we use a FOR loop. The FOR loop below starts at 0 and\nends at 999, thus running\
    \ the elevator a 1000 times.\n\n```\nfor (i=0;i<1000;i++)\n```"
  merge: -1
  img_proc: true
- pgno: 292
  md: "```\n```javascript\n{\n  Runelevator();\n}\n```\n```\n\nFinally, if we want\
    \ to keep running the elevator till 6 PM, we use a WHILE loop.\n\n```\n```javascript\n\
    While (checktime!=18:00)\n{\n  Runelevator();\n}\n```\n```\n\nThese are simple\
    \ examples of the 3 loops to explain the concepts of loops.\nThis concept is very\
    \ important in coding.\nNow, let’s do some examples in JavaScript."
