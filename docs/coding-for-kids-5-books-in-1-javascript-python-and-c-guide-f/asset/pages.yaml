  md: "# Nested Conditional Statements\n\nThese are basically conditional statements\
    \ within conditional statements.\nThese are also called nested loops.\nLet’s say\
    \ that you want to check if two conditions are true in Javascript,\nbefore you\
    \ take an action; then you put two if loops within each other.\nLet’s take the\
    \ example from the previous chapter. We want to check if\nGeorge is hungry and\
    \ has money to give him a snack.\nnot true, then do something else. As an example,\n\
    \n```\n```javascript\nIF (George==”Hungry”)\n{\n    IF (George==”Has Money”)\n\
    \    {\n        Document.write(“Buy George a Snack);\n    }\n    ELSE\n    {\n\
    \        Document.write(‘Make George a Snack’);\n    }\n}\nELSE\n{\n    Document.write(‘No\
    \ snack for George’);\n}\n```\n```\n\nIn the above example, the code checks if\
    \ George is hungry first. If George\nis hungry then it performs a 2nd check. It\
    \ checks if George has money. If\nGeorge has money, it prints ‘Buy George a snack’.\
    \ If he’s hungry but\ndoesn’t have money, then print ‘Make George a snack’).\n\
    If he’s not hungry, then print ‘No snack for George’).\nThis is a simple example\
    \ of a nested IF ELSE statement in JavaScript.\n\n# NESTED IF ELSE LOOP EXAMPLE"
