  md: 'An array is a collection of values of the same data type.


    Each value in the collection has an index associated with it that can be used
    to retrieve the value.


    Indices in C++ start from 0 not 1, this is known as ***zero based indexing.***
    It is like starting to count from 0 and not 1.


    # ## Exercise


    How many items do I have, if I gave them labels from 0 to 4?


    **Answer: 5**


    # ## Declaring an array


    When declaring an array, we begin by specifying the data type of the values that
    the array will hold followed by the variable name of the array then by the number
    of elements it will hold in square brackets.


    For example:


    ```

    ```

    int size[4];

    size = {1,2,3,4};

    ```

    ```


    # ## Explanation


    Above we have declared an array with the variable name *size* which holds 4 values
    of the data type integer


    ```

    ```

    int size[4];

    ```

    ```'
