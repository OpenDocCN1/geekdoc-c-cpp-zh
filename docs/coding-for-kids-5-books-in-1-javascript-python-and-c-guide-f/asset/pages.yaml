- pgno: 636
  md: "Pygame deal with user inputs mainly using pygame.event module. pygame.event\
    \ listens and register all events that comes from a keyboard or mouse. Every time\
    \ event happen an event object is created to record it.\n\nIn fact, we have been\
    \ using pygame.event several times in our programs.\n\nIn this snippet, in game\
    \ loop we continuously check for any new events pygame.event.\n\n`pygame.event.get()`\
    \ returns a list of events that occurred since the last `pygame.event.get()` call.\n\
    \nWhen the quit button is pressed pygame.event registers this event as event with\
    \ a type pygame.QUIT.\n\nSo we loop through all events and check if any of the\
    \ events type is pygame.QUIT if so we set loop variable to false to quit the loop\
    \ in next iteration.\n\n```\n```python\n# ? : game infinite loop\nloop = True\n\
    while loop:\n    # if quit button press quit\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            loop = False\n```\n```\n\n\
    To read more about pygame events refer to this link:\n[http://man.hubwiz.com/docset/PyGame.docset/Contents/Resources/Documents/ref/event.html](http://man.hubwiz.com/docset/PyGame.docset/Contents/Resources/Documents/ref/event.html)\n\
    \nThis table show some of common pygame.event constant and their attributes."
