    # Growing Radial Circle


    A radial circle is very similar to a circle. A radial circle controls the color
    of the circle, the background and can also add an extra color to the border between
    the circle and the background. In the below example, we create a radial circle
    of color red with a blue background. And there is a yellow border to the red ball,
    which acts like an annulus.


    In the below example, **createRadialGradient()** is used to create the circle.
    This is how it works.


    **createRadialGradient(a,b,c,d,e,f)** creates an inner circle with **center (a,b)**
    with radius **c**. The second circle creates a circle with **center (d,e)** with
    radius **f**. If we want an annular circle then we should have them at same center
    i.e. **(a,b) = (d,e)**.


    In the below example, we have an inner circle and outer circle at the center of
    the canvas **(250,250)**. The radius of the outer circle is always **20** pixels
    more than the inner circle.


    The inner circle color is set to red using **addColorStop(0,“red”)** and the background
    is set to blue using **addColorStop(1,“blue”)**. Finally, the outer circle color
    is set to yellow using **addColorStop(0.5,“yellow”)**.'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'The radial circle keeps growing by 5 pixels every 50 ms (0.5 seconds). If the
    size of the circle exceeds the canvas, it is set back to 10 pixels.


    ```

    ```html

    <html>

    <head><title>Growing Circle</title>

    </head>

    <body>

    <canvas id="mCanvas" width="500" height="500" style="border:2px solid"></canvas><br>

    <button class="btn" onclick="growingcircle()">Circle</button>

    <script>

    function growingcircle()

    {

    var c = document.getElementById("mCanvas");

    var c2x = c.getContext("2d");

    setInterval(frame, 50);

    size=10;

    function frame()

    {

    //circle

    if (size>350)

    {

    size=10;

    }

    c2x.beginPath();

    var grd = c2x.createRadialGradient(250, 250, size, 250, 250, size+20);

    grd.addColorStop(0, "red");

    grd.addColorStop(0.5, "yellow");

    grd.addColorStop(1, "blue");


    // Fill with gradient

    c2x.fillStyle = grd;

    c2x.fillRect(0, 0, 500, 500);

    c2x.stroke();

    c2x.fill();

    size+=5;

    }

    }

    </script>

    </body>

    </html>

    ```

