- pgno: 250
  md: '# What is JavaScript?


    JavaScript is a high-level programming language that is used to make web pages
    more interactive and dynamic. It is text-based and user-friendly. While html is
    used to create a web page structure and css is for web page style, JavaScript
    is used to make the web page more interactive with the user. It allows different
    html elements to interact with each other, performs calculations, animations etc.
    In other words, it makes web page programming fun.


    # Using JavaScript with html


    There are two ways to use JavaScript in a html web page. The first way is to just
    add the code within script tags in html. This is shown in the blue portion of
    the code below.


    ```

    ```html

    <html>

    <head><title>Test file 1</title>

    </head>

    <body>

    <script>

    //Enter JavaScript code here

    </script>

    </body>

    </html>

    ```

    ```


    The 2nd way is to create an external JavaScript file that contains the code and
    save it as a .js file. Then you can link the file to the html content. For example,
    let’s say you create a file called ‘test.js’. You can link it using the blue portion
    of the code below:


    ```

    ```html

    <html>

    <head><title>Test file 2</title>

    </head>

    <body>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: '```

    ```html

    <script src=" test.js"></script>

    </body>

    </html>

    ```

    ```


    # JavaScript Elements


    With that basic knowledge, let’s have a look at some basic JavaScript elements.


    # functions


    A function in JavaScript is a set of lines of code that performs a certain task.


    It is defined in JavaScript within the script tags as:


    ```

    ```javascript

    function afunc()

    {

    //Enter function code here

    }

    ```

    ```


    The name of the function is afunc and the code within the curly brackets is executed
    each time afunc is called on. It is useful to have functions when we want to perform
    the same task several times in the same program. We can just call on the function
    instead of writing the same lines of code several times.


    # Variables


    A variable in JavaScript is a placeholder that takes on a certain value. The value
    can be changed throughout the program and can be used in other parts of the code.
    Let’s take an example:


    ```

    ```javascript

    var x=5;

    ```

    ```


    x is the variable defined. It starts with a value of 5.


    Later on, in the program, it can be changed to a different value, as in:


    ```

    ```javascript

    x=10;

    ```

    ```


    Now, x has a value of 10. And, if we do:


    ```

    ```javascript

    x=x-1;

    ```

    ```


    Then x becomes 9. What we just showed is an integer variable. We can also have
    string variables used to store text values, as in:


    ```

    ```javascript

    var b="abcd"

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'b is a variable that holds the value abcd.

    And finally, we can have Boolean variables that holds only true/false

    values. For example:


    ```

    var c = true;

    var d = (7>5);

    var e = (7<6);

    ```


    Variables c,d and e are all Boolean variables. Variable c is assigned to true.

    Variable d is true (because 7 is greater than 5). Variable e is false (because
    7

    is not less than 6).'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# document.write()


    document.write() is used to print elements on the web page. Anything that is within
    the brackets is printed on the web page. For example:


    ```

    document.write(“Example print”);

    ```


    The above line prints the words “Example print” on the screen.


    We can also print variables on the screen. For example,


    ```

    var a=7;

    ```


    ```

    document.write(a)

    ```


    Above line prints 7 on the screen.


    And, we can combine different elements also using “+” operator. For example:


    ```

    var a=7;

    ```


    ```

    document.write(“The number printed is “+a);

    ```


    The above line prints “The number printed is 7”.


    # alert()


    Alert puts a pop-up on the screen with a particular message. For example,


    ```

    alert(“Hello”)

    ```


    The above message has a pop-up message that says “Hello”


    ![](img/443990a0ec620659ce8be783c0758bc6_253_0.png)


    # prompt()


    prompt has the same popup but what a textbox that allows user input. The user
    input can be stored in a variable. For example:


    ```

    var name = prompt(“What is your name”);

    ```


    It shows a pop-up. Once the user enters his name and says ok, it stores the value
    in the variable name.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '![](img/443990a0ec620659ce8be783c0758bc6_254_0.png)


    # **document.getElementById().value**


    Document.getElementById().value is used to get html elements into JavaScript variables.
    So, we need to use the id of the html element and put it in between brackets.
    Let’s look at an example.


    Let’s look at below html element:


    ```

    `Enter number: <input name=”x” type=”number” id=”test” size=”20”><br>`

    ```


    JavaScript code:


    ```

    `var testv=document.getElementById("test").value;`

    ```


    The html element is a form textbox that extracts a number from the user. In Javascript,
    the number that the user assigns is set to the variable testv.


    # How to add Comments


    Comments are items that you add to the code to document or explain the code. Comments
    cannot be executed and do not effect the program. Comments in JavaScript are added
    using two double backslash in front of the comment (“//”)'
  merge: -1
  img_proc: true
