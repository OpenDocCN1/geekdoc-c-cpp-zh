  md: '# Conditional Statement


    Conditional Statements are also known as control statements. They help decide
    the flow of the program. Sometimes we want a specific block of code to execute
    only if a certain condition is met. Ex: We take the weather as an input from the
    user and print “Don’t forget your umbrella” if it’s rainy or prints “Have a nice
    day” if it is not.


    ```

    ```python

    weather = input(“Input the weather? “)

    if weather == “rainy”:

    print(“Don’t forget your umbrella”)

    else:

    print(“Have a nice day”)

    ```

    ```


    If the user inputs “rainy”, print(“Don’t forget your umbrella” gets executed and
    python skips the code inside the else block. If the user inputs something other
    than “rainy”, Python skips the code inside the if block and executes the code
    in the else block. The general syntax is:


    ```

    ```python

    if *condition is True*:

    …… execute this code block ……..

    else:

    …….. execute this code block ……..

    ```

    ```'
