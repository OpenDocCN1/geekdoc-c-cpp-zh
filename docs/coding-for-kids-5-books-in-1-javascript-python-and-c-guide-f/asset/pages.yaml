  md: "# Example 4 – Guess World Capitals\n\nIn this example we use both list and\
    \ dictionary. A dictionary capital_dict is used to make country:capital key pairs.\
    \ Then we get the dictionary keys using keys() method and store them in countries\
    \ list. This is essential so we can use random.choice() function which takes a\
    \ list and return a value from list randomly. Then inside an infinite while loop,\
    \ user is asked for a capital using input function and the answer is compared\
    \ to actual capitals.\n\n```\n```python\n# World capital game\nimport random\n\
    \n# World capitals dictionary\ncapital_dict={\n    'spain':'madrid',\n    'france':'paris',\n\
    \    'germany':'berlin',\n    'norway':'oslo',\n    'india':'new delhi',\n   \
    \ 'egypt':'cairo'\n}\n\n# get countries and convert it to list so we can use random\
    \ function\ncountries = list(capital_dict.keys())\nprint (\"Let's learn World\
    \ Capitals. Enter quit to quit the game.\")\n\nwhile True:\n    # pick a random\
    \ country\n    country = random.choice(countries)\n    capital = capital_dict[country]\n\
    \n    guess = input(f'What is the capital of {country}.')\n    # if user type\
    \ quit, quit\n    if guess.lower() == \"quit\":\n        break\n    elif guess.lower()\
    \ == capital:\n        print(f'Correct !')\n        break\n    else:\n       \
    \ print(f'Incorrect. The capital of {country} is {capital}.')\n```\n```"
