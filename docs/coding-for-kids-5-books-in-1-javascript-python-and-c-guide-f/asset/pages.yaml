  md: '# Loops


    Loops in coding are a sequence of instructions that are repeated a certain number
    of times.

    Think of a loop like repeating operation that keeps repeating until a condition
    is met.

    There are mainly 2 types of loops based on the conditions of execution. They are:


    +   a. **FOR Loops:** FOR loops contain a sequence of instructions that are executed
    for a certain number of times. For example, a FOR loop from 1 to 10 executes the
    code inside the loop 10 times.

    +   b. **WHILE Loops:** WHILE loops is a sequence of instructions that are executed
    till a certain condition is met.


    Now, if we want to do a 1000 executions of execute function; we use a FOR loop.
    The FOR loop below starts at 0 and ends at 999, thus running execute function
    1000 times.


    ```

    ```python

    for i in range(1000):

    ```

    ```'
