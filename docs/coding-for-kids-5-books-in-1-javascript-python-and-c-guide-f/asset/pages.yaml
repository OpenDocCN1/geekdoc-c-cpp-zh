    num_dict[''four''] = 4

    num_dict now is {''one'':1, ''two'':2, ''three'':3, ''four'':4}

    ```


    dict.clear – clears the dictionary.


    ```

    num_dict = {''one'':1, ''two'':2, ''three'':3}

    num_dict.clear()

    num_dict now is {}

    ```


    dict.get(key) – retrieve a dictionary value by a key and returns None if no such
    key exists.


    ```

    num_dict = {''one'':1, ''two'':2, ''three'':3}

    num_dict.get(‘one’) returns 1

    ```'
