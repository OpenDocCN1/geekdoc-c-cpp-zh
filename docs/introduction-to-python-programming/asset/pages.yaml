  md: '# 4.2 Commonly Used Modules


    Modules in Python are reusable libraries of code having .py extension, which implements
    a group of methods and statements. Python comes with many built-in modules as
    part of the standard library.


    To use a module in your program, import the module using `import` statement. All
    the import statements are placed at the beginning of the program.

    The syntax for import statement is,


    | Keyword | import module_name |


    For example, you can import the `math` module as


    +   1 >>>import math


    The `math` module is part of the Python standard library which provides access
    to various mathematical functions and is always available to the programmer ①.

    The syntax for using a function defined in module is,


    ```

    `module_name.function_name()`

    ```


    The module name and function name are separated by a dot.


    Here we list some of the functions supported by `math` module.


    +   1. >>> import math

    2. >>> print(math.ceil(5.4))

    6

    3. >>> print(math.sqrt(4))

    2.0

    4. >>> print(math.pi)

    3.141592653589793

    5. >>> print(math.cos(1))

    0.5403023058681398

    6. >>> math.factorial(6)

    720

    7. >>> math.pow(2, 3)

    8.0


    Import the math module at the beginning ①. The `math.ceil(x)` function returns
    the ceiling of x, the smallest integer greater or equal to the number ②, `math.sqrt(x)`,
    returns the square root of x ③, `math.pi` is the mathematical constant π=3.141592...,
    to available precision ④, `math.cos(x)` returns the cosine of x radians ⑤, `math.factorial(x)`
    returns factorial ➏, `math.pow(x, y)` returns x raised to the power ⑦.'
