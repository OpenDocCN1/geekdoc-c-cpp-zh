  md: '# Introduction to Python Programming


    +   3. A colon is required at the end of the function header. The first line of
    the function definition which includes the name of the function is called the
    function header.

    4. Block of statements that define the body of the function start at the next
    line of the function header and they must have the same indentation level.


    The `def` keyword introduces a function definition. The term parameter or formal
    parameter is often used to refer to the variables as found in the function definition.


    ![](img/1a4c4d9415149052170c8f902baa9036_120_0.png)


    The first statement among the block of statements within the function definition
    can optionally be a documentation string or docstring. There are tools that use
    docstrings to produce online documents or printed documentation automatically.
    For example, Triple quotes are used to represent


    ```

    """This is single line docstring """

    OR

    """This is

    multiline

    docstring """"

    ```


    A function does not execute it. Defining a function simply names the function
    and specifies what to do when the function is called. Calling the function actually
    performs the specified actions with the indicated parameters. The syntax for function
    call or calling function is:


    ```

    function_name(argument_1,argument_2,...,argument_n)

    ```


    Arguments are the actual value that is passed into the calling function. There
    must be one to one correspondence between the formal parameters in the function
    definition and the actual arguments of the calling function. When a function is
    called, the formal parameters are temporarily “bound” to the arguments and their
    initial values are assigned through the calling function.


    A function should be defined before it is called and the block of statements in
    the function definition are executed only after calling the function. Normally,
    statements in the Python program are executed one after the other, in the order
    in which they are written. Function definitions do not alter the flow of execution
    of the program. When you call a function, the control flows from the calling to
    the function definition. Once the block of statements in the function definition
    is executed, the control returns back to the calling function and proceeds with
    the next statement. Python interpreter keeps track of the flow of control between
    different statements in the program.


    ![](img/1a4c4d9415149052170c8f902baa9036_120_1.png)


    When the control returns to the calling function from the function definition
    the formal parameters and other variables in the function definition no longer
    contain any values.'
