  md: '# Preface


    This book presents an intuitive approach to the concepts of Python Programming
    for students. It is appropriate for courses generally known as “Introduction to
    Python Programming.” We have tried to write a book that assists students in discovering
    the power of Python programming. We have taken into account the reality that students
    taking “Introduction to Python Programming” course are likely to come from a variety
    of disciplines. In addition to Computer Science majors, there tend to be students
    from other majors like engineering streams, physics, chemistry, biology, environmental
    science, geography, economics, psychology and business.


    This book differs from traditional texts not only in its philosophy but also in
    its overall focus, level of activities, development of topics, and attention to
    programming details. The emphasis is on understanding Python programming concepts.
    Reading a programming book is different from reading a newspaper or a novel. Don''t
    be discouraged if you have to read a page more than once in order to understand
    it. We recommend that you keep this book for reference purposes after you finishing
    through the course. Because you will likely forget some of the specific details
    of Python language, the book will serve as a useful reminder. Students will appreciate
    the many programming examples within the text. Programs are carefully selected
    to bring the theoretical concepts to fruition. Our goal is to get the reader to
    productivity as quickly as possible without sacrificing the overall flow quality.


    In fact, if you are a novice programmer, with some dedication and hard work you
    should be able to learn Python Programming as your first programming language.
    As we introduce each new feature of the language, we will provide a complete program
    as an example to illustrate the feature. Just as a picture is worth a thousand
    words, so is a properly chosen programming example. We present the material in
    a way to encourage student thinking and we show students how to generalize concepts
    once they are introduced, which can be used to solve real-world problems. Programming
    questions that accompany the end of each chapter are based on worked examples
    which help students gain solid knowledge of the basics and assess their own level
    of understanding before moving on. Students are highly encouraged to solve these
    programs to gain a solid hold on Python programming language.


    This book takes you step by step process of learning the Python language. Each
    line of the code is marked with numbers and is explained in detail. This book
    calls names of variables, strings, lists, dictionaries, tuples, methods and classes
    consist of several natural words and in the explanation part they are written
    in italics to indicate the readers that they are part of programming code and
    to distinguish them from normal words. This programming style of using readable
    names makes the reading of code lot easy and prevents programming errors. Learning
    outcome component is mentioned at the beginning of each chapter that calls the
    attention of the readers to important items in the chapter. A summary of important
    concepts appears at the end of each chapter.


    We hope that students using the book will come away with an appreciation of the
    beauty, power, and tremendous utility of Python programming language and that
    they will have fun along the way.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Organization of Chapters


    Here''s a brief rundown of what you will find in each chapter:


    In Chapter 1, the advantages of using Python programming language is discussed
    and the scope of Python''s reach, and all the different areas of application develop-ment
    in which Python plays a part is identified. This chapter also covers the down-loading
    and installation of Anaconda distribution and PyCharm IDE. You will be guided
    towards setting up your Python development environment. You will understand the
    meaning of Open Source Software and its various licenses.


    In Chapter 2, you will learn the basic building blocks of Python programming lang-gage
    like arithmetic operators, data types, operator precedence and associ-ativity
    and construct expressions using operators. This chapter teaches you the syntax
    of Python language which you need to know before writing Python programs.


    In Chapter 3, Python statements such as if, if...else, if...elif...else are taught
    which are used to transfer the control from one program to another. Loops to run
    one or more statements are executed repeatedly. Controlling the flow of execu-
    is carried out through the break and continue statements. To take advantage of
    the iterative capabilities in a computer, you need to know how to include and
    conditional logic within your program. How to deal with the errors in the input
    is also part of this chapter.


    In Chapter 4, you will determine how to create functions, pass values to and return
    values from the function. In this chapter, commonly used modules and built-in
    functions are identified. This chapter also includes discussion on different func-tions
    like keyword arguments and variable number of arguments. You''ll learn how to
    use functions to make your code more efficient and flexible.


    In Chapter 5, some of the more commonly occurring string tasks, such as cat-ening
    strings, trimming of white spaces, splitting string as well as finding sub-strings
    within strings is covered. Various string methods to manipulate strings are detailed.
    Indexing slicing and joining of strings are illustrated with figures. Formatting
    the string using f-strings is also outlined.


    In Chapter 6, one of the main pillars of Python programming language and the built-in
    data type, List, acts as a container to hold items of differ-ent types. Creating,
    slicing and indexing of lists is elaborated with high-grade examples. Using list
    methods in manipulating Python programs is demonstrated.


    In Chapter 7, another built-in data type in Python programming language, Dictionary,
    is covered in depth. Accessing and modifying the key:value pairs of Dictionaries
    is demonstrated.


    In Chapter 8, role of tuples in returning multiple values from functions and storing
    heterogeneous elements of fixed sized is discussed. Mathematical operations like
    union and intersection are demonstrated using sets. Different methods supported
    by tuples and sets are identified.


    In Chapter 9, you will deal with file-based input and output functions, including
    how to load files, perform basic operations, and save the results back to disk.'
  merge: -1
