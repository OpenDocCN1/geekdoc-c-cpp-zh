    # Functional


    In functional programming languages, functions are treated as first-class objects.
    In other words, you can pass a function as an argument to another function, or
    a function may return another function. Examples of functional programming languages
    are F#, LISP, Scheme, and Haskell.


    # Object-Oriented


    The Object-oriented paradigm has gained enormous popularity in the recent decade.
    Object-oriented is the term used to describe a programming approach based on objects
    and classes. The object-oriented paradigm allows us to organize software as a
    collection of objects that consist of both data and behavior. This lets you have
    nice things like encapsulation, inheritance, and polymorphism. These properties
    are very important when programs become larger and larger. The object-oriented
    paradigm provides key benefits of reusable code and extensibility. Examples of
    object-oriented languages are Python, C++, Java and C#.


    It is important to note that many languages, such as Python and C++, support multiple
    paradigms. It is also true that even when a language is said to support a particular
    paradigm, it may not support all paradigm''s features. Not to mention that there
    is a lot of disagreement as to which features are required for a particular paradigm.


    # 1.3 Software Development


    The process of software development goes through a series of stages in stepwise
    development known as the Software Development Life Cycle (SDLC). It is a systematic
    approach to develop software (FIGURE 1.1). It creates a structure for the developer
    to design, create and deliver high-quality software according to the requirements
    of the customer. It also provides a methodology for improving the quality of the
    desired product.


    ![](img/1a4c4d9415149052170c8f902baa9036_25_0.png)


    FIGURE 1.1


    Different stages of Software Development Life Cycle.'
