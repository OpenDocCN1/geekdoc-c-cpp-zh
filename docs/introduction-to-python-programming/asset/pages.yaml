    word boundary followed by one or more alphanumeric characters, that is, a-z, A-Z,
    0-9 and _ followed by a word boundary. The name given to this group is <word>
    specified within angle brackets ①. Pass the string from which you want to extract
    the pattern as an argument to the search() method ②. By passing the group name
    ''word'' as an argument to the group() method, you can extract the matched substring
    ③. This named group can still be used to retrieve information by the passed integer
    numbers instead of group name ④.


