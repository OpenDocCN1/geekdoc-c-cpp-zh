    Please enter a number: 4\nTheumber you have entered is 4\n\nFirst, the *try* block\
    \ (the statement between the *try* and *except* keywords) is executed ②–⑤ inside\
    \ the *while* loop ①. If no exception occurs, the *except* block is skipped and\
    \ execution of the *try* statement is finished. The rest of the statements in\
    \ the *try* block is skipped. Then if its type matches the exception named after\
    \ the *except* keyword, the *except* block is executed ⑥–⑦, and then execution\
    \ continues after the *try* statement. When a variable receives an inappropriate\
