  md: '# 3


    # Control Flow Statements


    AIM

    Understand if, if...else and if...elif...else statements and use of control flow
    statements that provide a means for looping over a section of code multiple times
    within the program.


    LEARNING OUTCOMES

    At the end of this chapter, you are expected to


    +   * Use if, if...else and if...elif...else statements to transfer the control
    from one part of the program to another.

    * Write while and for to run one or more statements repeatedly.

    * Control the flow of execution using break and continue statements.

    * Improve the reliability of code by incorporating exception handling mechanisms
    through try-except blocks.


    Python supports a set of control flow statements that you can integrate into your
    program. The statements inside your Python program are generally executed sequentially
    from top to bottom, in the order that they appear. Apart from sequential control
    flow statements you enable decision making and looping control flow statements
    to break up the flow of execution enabling your program to conditionally execute
    particular blocks of code. The term control flow details the the program takes.

    The control flow statements (FIGURE 3.1) in Python Programming Language are


    +   1. Sequential Control Flow Statements: This refers to the line by line execution,
    in which the statements are executed sequentially, in the same order in which
    they appear in the program.


    +   2. Decision Control Flow Statements: Depending on whether a condition is True
    or False, the decision structure may skip the execution of an entire block of
    statements or even execute one block of statements instead of other (if, if...else
    and if...elif...else).


    +   3. Loop Control Flow Statements: This is a control structure that allows the
    execution of a block of statements multiple times until a loop termination condition
    is met (for loop and while loop). Loop Control Flow Statements are also called
    Repetition statements or Iteration statements.'
