- img_proc: true
  md: '# Strings


    The f-strings formatting is driven by the desire to have a simpler way to format
    strings in Python. The existing ways of formatting are either error-prone, inflexible,
    or cumbersome. The %-formatting is limited to the types it supports. Only int,
    str and doubles can be formatted. All other types are either supported or converted
    to one of these types before formatting. In addition, there''s a well-known trap
    when a single value is passed. For example,


    +   1. >>> almanac = ''nostradamus''

    2. >>> ''seer: %s'' almanac

    ''seer: nostradamus''


    ①-② works when single value is passed. But if the variable almanac were ever to
    be a tuple, the code would fail. For example,


    +   1. >>> almanac = (''nostradamus'', 1567)

    2. >>> ''seer: %s'' almanac

    Traceback (most recent call):

    File "<stdin>", line 1, in <module>

    TypeError: not all arguments converted during string formatting


    ①-② Passing Multiple values not supported in %-formatting.


    The str.format() was added to address some of these problems with %-formatting.
    In particular, it uses standard function syntax and therefore supports multiple
    parameters. However, str.format is not without its issues. Chief among them is
    its verbosity. For example, in the following code the test value is repeated.


    +   1. >>> value = 4 * 20

    2. >>> The value is {value}.format(value=value)

    ''The value is 80.''


    ①-② Too much verbosity


    Even in its simplest form, there is a bit of boilerplate, and the value that''s
    inserted into the placeholder is sometimes far removed from where the placeholder
    is situated.


    +   1. >>> The value is {}:.format(value)

    ''The value is 80.''


    ① Statement is not informative.


    With an f-string, this becomes,


    +   1. >>> fValue is {value}

    ''The value is 80.''


    ① The f-strings provide a concise, readable way to include the value of Python
    expressions inside strings.'
