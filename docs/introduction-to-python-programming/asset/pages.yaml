  md: '# 232 Introduction to Python Programming


    beginning, or prefix of the path looks like. In the Windows Operating System,
    the maximum length for a path is 260 characters and in the Linux Operating System
    the maximum path length is of 4096 characters.


    The fundamental rules enable applications to create and process valid names for
    files and directories in both Windows and Linux operating systems unless explicitly
    specified:


    +   - Use a period to separate the base file name from the extension in the file.

    - In Windows use backslash (\) and in Linux use forward slash (/) to separate
    the components of a path. The backslash (or forward slash) separates one directory
    name from another directory name in a path and it also divides the file name from
    the path leading to it. Backslash (\) and forward slash (/) are reserved characters
    and you cannot use them in the name for the actual file or directory.

    - Do not assume case sensitivity. File and Directory names in Windows are case
    sensitive while in Linux is case sensitive. For example, the directory names ORANGE,
    Orange, and orange are the same in Windows but are different in Linux Operating
    System.

    - In Windows, volume designations (drive letters) are case-insensitive. For example,
    "D:" and "d:" refer to the same drive.

    - The reserved characters that should not be used in naming files and directories
    are < (less than), > (greater than); : (colon), " (double quote), / (forward slash),
    \ (backslash), | (vertical bar or pipe), ? (question mark) and * (asterisk).

    - In Windows operating system reserved words like CON, PRN, AUX, NUL, COM1, COM2,
    COM3, COM4, COM5, COM6, COM7, COM8, COM9, LPT1, LPT2, LPT3, LPT4, LPT5, LPT6,
    LPT7, LPT8, and LPT9 should not be used as file names and directories.


    # 9.1.2 Fully Qualified Path and Relative Path


    A file path can be a fully qualified path name or relative path. A path to a fully
    qualified path name is also called an Alias if it points to the file location,
    which always contains the root and the complete directory list. The current directory
    is the directory in which a user is working at a given time. Every user is always
    working within a directory.


    Note that the current directory may not be the root directory depending on what
    it was set to during the most recent "change directory" operation on that disk.
    The root directory, sometimes just called root or the "highest" directory in the
    hierarchy. You can also think of it in general as the start or beginning of a
    particular directory structure. The root directory contains all other directories
    in the drive and can also contain files. For example, the root directory of the
    main partition on your Windows system will be C:\ and the root directory on your
    Linux system will be / (forward slash).


    Examples of a fully qualified path are given below.


    +   - "C:\lang.txt" refers to a file name "lang.txt" under root directory C:\

    - "C:\fauna.txt" refers to a file name "bison.txt" should be in a subdirectory
    fauna under root directory C:\'
