    # 4.3 Function Definition and Calling the Function


    You can create your functions and use them as and where it is needed. User-defined
    functions are reusable code blocks created by users to perform some specific task
    in the program.

    The syntax for function definition is:


    ![](img/1a4c4d9415149052170c8f902baa9036_119_0.png)


    In Python, a function definition consists of the def keyword, followed by


    +   1. The name of the function. The function’s name has adhere to the same naming
    rules: use letters, numbers, or an underscore, but the name cannot start with
    a number. Also, you cannot use a keyword as a function name.

    2. A list of parameters to the function are enclosed in parentheses and separated
    by commas. Some functions do not have any parameters at all while others may have
    one or more parameters.'
