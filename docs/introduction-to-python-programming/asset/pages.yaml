  md: '# 230 Introduction to Python Programming


    All the data on your hard drive consists of files and directories. The fundamental
    difference between the two is that files store data, while directories store files
    and other directories. The folders, often referred to as directories, are used
    to organize files on your computer. The directories themselves take up virtually
    no space on the hard drive. Files, on the other hand, can range from a few bytes
    to several gigabytes. Directories are used to organize files on your computer.


    [Adapted with kind permission from https://www.lifewire.com/what-is-a-file-extension-2625879]


    # 9.1 Types of Files


    Python supports two types of files - text files and binary files. These two file
    types look the same on the surface but they encode data differently. While both
    binary and text files contain data stored as a series of bits (binary values of
    0 and 1), the bits in text files represent characters, while the bits in binary
    files represent custom data.


    Binary files typically contain a sequence of bytes or ordered groups of eight
    bits. When creating a custom file format for a programmer, a developer arranges
    these bytes into a format that stores the necessary information for the application.
    Binary formats may include multiple types of data in the same file, such as image,
    video, and audio data. This data can be interpreted by supported formats but will
    show up as garbled text in a text editor. Below is an example of a JPG file opened
    in an image viewer and a text editor (FIGURE 9.1).


    ![](img/1a4c4d9415149052170c8f902baa9036_250_0.png)


    **FIGURE 9.1**nImage and its binary contents.


    As you can see, the image viewer recognizes the binary data and displays the picture.
    When the image is opened in a text editor, the binary data is converted to unrecognizable
    text. However, you may notice that some of the text is readable. This is because
    the JPG format includes small sections for text data. The text editor, while not
    designed to read this file format, still displays this text when it is opened.
    Many other binary file type include sections of readable text as well. Therefore,
    it may be possible to find out some information about an unknown binary file by
    opening it in a text editor. Binary files often contain headers, which are bytes
    of data at the beginning of a file that identifies the file''s contents. Headers
    often include the file type and other'
