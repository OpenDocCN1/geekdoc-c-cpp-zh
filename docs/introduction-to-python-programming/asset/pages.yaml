    # 4.6 Default Parameters


    In some situations, it might be useful to set a default value to the parameters
    of the function definition. This is where default parameters can help. Each default
    parameter has a default value as part of its function definition. Any calling
    function must provide arguments for all required parameters in the function definition
    but can omit arguments for default parameters. If no argument is sent for that
    parameter, the default value is used. Usually, the default parameters are defined
    at the end of the parameter list, after any required parameters and non-default
    parameters cannot follow default parameters. The default value is evaluated only
    once.'
