    Tuples are compared by position. The first item of the first tuple is compared
    to the first item of the second tuple; if they are not equal then this will be
    the result of the comparison, else the second item of the first tuple is compared
    to the second item of the second tuple; if they are not equal then this will be
    the result of the comparison, else the third item is considered, and so on ①–④.


