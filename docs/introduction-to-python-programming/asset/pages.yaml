    # 12.5 Altair


    Altair is a declarative statistical visualization library for Python and it is
    based on Vega-Lite. What is Vega-Lite? Vega-Lite is a high-level grammar of interactive
    graphics. It provides a JSON syntax for rapidly generating visualizations to support
    data analysis. The Vega-Lite compiler automatically produces visualization components
    including axes, legends, and scales. Alta''s API is simple, friendly and consistent
    and built on top of the powerful Vega-Lite visualization grammar. With Altair,
    you can spend more time understanding your data and its meaning.


    The key idea of Altair is that you are declaring links between DataFrame columns
    and visual encoding channels, such as the x-axis, y-axis, color, etc. The rest
    of the plot details are handled automatically. This elegant simplicity produces
