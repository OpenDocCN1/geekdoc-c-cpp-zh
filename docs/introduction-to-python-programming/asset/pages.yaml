  md: '# 11


    # Object-Oriented Programming


    AIM

    Understand Object-oriented programming paradigm in controlling the access of data
    and reducing the duplication of code by employing code reusability techniques.


    # LEARNING OUTCOMES


    At the end of the chapter, you are expected to


    +   * Understand and Create Objects.

    * Recognize data attributes and methods for given objects.

    * Use the dot notation to access data attributes and methods of an object.

    * Demonstrate the implementation of instance variables, methods, and constructors.

    * Understand Encapsulation, Polymorphism and Inheritance.


    The basic idea of Object-oriented programming (OOP) is that we use objects to
    model real-world things that we want to represent inside our programs and provide
    a simple way to access their functionality that would otherwise be hard or impossible
    to utilize. Large programs are challenging to write. Once a program reaches a
    certain size, Object-oriented programs are actually easier to program than Non-Object-oriented
    ones. The programs are not disposable, an Object-oriented program is much easier
    to modify and maintain over time. Object-oriented programming results in code
    reuse, cleaner code, better architecture, abstraction layers, and fewer programming
    bugs. Python provides full support for Object-oriented programming, including
    encapsulation, inheritance, and polymorphism.


    # 11.1 Classes and Objects


    In a 1994 Rolling Stone interview, Steve Jobs (CEO of Apple) explains Object-oriented
    programming. His explanation still helps us understand what OOP is in simple terms.'
