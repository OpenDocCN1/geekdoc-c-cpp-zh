  md: 'The keys in the encoding object are encoding channels. Altair supports the
    following group of encoding channels:


    +   - X → x-axis value

    - Y → y-axis value

    - Color → color of the mark

    - Row and Column → Row and Column are special encoding channels that facet single
    plots into small multiples plots within a grid of facet plots.


    The details of any mapping depend on the type of the data. Altair is able to automatically
    determine the type of data using built-in heuristics. Altair supports four primitive
    data types (TABLE 12.5).


    # TABLE 12.5

    Primitive Data Types Supported by Altair


    | Data Type | Code | Description |

    |---|---|---|

    | Quantitative | Q | Numerical Quantity (Real-Valued) |

    | Nominal | N | Name/Unordered Categorical |

    | Ordinal | O | Ordered Categorical |

    | Temporal | T | Date/Time |


    You can set the data type of a DataFrame column explicitly using a one-letter
    code attached to the DataFrame column name with (). If types are not specified
    for DataFrame input, Altair defaults to quantitative for any numeric data, temporal
    for date/time data and nominal for string data, but be aware that these defaults
    are no always the correct choice!


    Data Aggregation

    The process of gathering and expressing information in a summary form is called
    Data aggregation. The X and Y encodings in Altair accept different aggregate functions.
    Some of the commonly used aggregate functions in Altair are shown in TABLE 12.6.


    # TABLE 12.6

    Aggregate Functions Built into Altair


    | Aggregate Function | Description |

    |---|---|

    | count() | The total count of data values in a group |

    | max() | The maximum data value |

    | min() | The minimum data value |

    | median() | The median data value |

    | mean() | The mean (or average) data value |

    | sum() | The sum of all the data values |


    Saving Alta Charts

    The fundamental chart representation output by Altair is a JSON string format.
    You can save the JSON data produced by Chart object to a JSON file using the Chart.save()
    method and by passing a filename with a .json extension as an argument. For example,'
