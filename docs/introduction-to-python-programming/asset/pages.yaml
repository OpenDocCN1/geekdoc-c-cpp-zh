  md: '# Introduction to Python Programming


    290


    Jeff Goodell: Would you explain, in simple terms, exactly what object-oriented
    software is?


    Steve Jobs: Objects are like people. They are living, breathing things that have
    knowledge inside them about how to do things and have memory inside them they
    can remember things. And than interacting with them at a very low level, you interact
    with them at a very high level of abstraction, like we''re doing right here. Here''s
    an example: If I''m your laundry object, you can give me your dirty clothes and
    send me a message that says,"Can you get my clothes laundered, please?" to know
    where the best place in San Francisco is. And I speak English, and I have dollars
    in my pockets. So, I go out and hail a taxi and tell the driver to take me to
    this place in San Francisco. I get your clothes laundered, I jump back in the
    cab, I get back here. You get your clean clothes and say, "Here are your clothes."
    You have no idea how I did that. You have no knowledge of the laundry place. Maybe
    you even hail a taxi. You cannot pay for one, you do not have dollars in your
    pocket. Yet I know how to do all of that. And you didn''t have to. All complexity
    was hidden inside of me, and we were able to interact at a very high level of
    abstraction. That''s what objects are. They encapsulate complexity, and the interfaces
    to that complexity are high.


    [Source: https://www.rollingstone.com/culture/news/steve-jobs-in-1994-the-rolling-stone-interview-201101117]


    Let''s look at another example. In the real world, you''ll often find many individual
    objects of all the same kind. There may be thousands of cars in existence, all
    of the same make and model. Each of these cars were built from the same set of
    blueprints and, therefore, contains the same components. In object-oriented terms,
    we say that each of these cars are objects of the class known as Car.


    A class is a blueprint from which individual objects are created. An object is
    a bundle of related state (variables) and behavior (methods). Objects contain
    variables, which represents the state of information about the thing you are trying
    to model, and the methods represent the behavior or functionality that you want
    it to have (FIGURE 11.1).


    ![](img/1a4c4d9415149052170c8f902baa9036_310_0.png)


    FIGURE 11.1

    Generic Object Diagram.'
