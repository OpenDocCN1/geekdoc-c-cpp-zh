    # 8.3 Indexing and Slicing in Tuples


    Each item in a tuple can be called individually through indexing. The expression
    inside the bracket is the index. Square brackets [ ] are used to access individual
    items, with the first item at index 0, the second item at index 1 and so on. The
    index provided within the square brackets indicates the value being accessed.


    The syntax for accessing an item in a tuple is,


    ```

    tuple_name[index]

    ```


    where index always be an integer and indicates the item to be selected.


    For the tuple holy_places, the index breakdown is shown below.


    | ''jerusalem'' | ''kashishwanathan'' | ''harmandirsahib'' | ''bethlehem'' | ''mahabodhi''
    |

    | 0 | 1 | 2 | 3 | 4 |


