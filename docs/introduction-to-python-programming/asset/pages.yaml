  md: "# Functions\n\nBefore executing the code in the source program, the Python\
    \ interpreter automatically defines few special variables. If the Python interpreter\
    \ is running the source program as a stand-alone main program, it sets the special\
    \ built-in __name__ variable to have a string value \"main__\". After setting\
    \ these special variables, the Python interpreter reads the program to execute\
    \ the code found in it. All of the code that is indentation level 0 gets executed.\
    \ Block of statements in the function definition is not executed until the function\
    \ is called.\n\n```\nif __name__ == \"__main__\":\n    statement(s)\n```\n\nThe\
    \ special variable, __name__ with \"main__\", is the entry point to your program.\
    \ Python interpreter reads if the statement and sees that __name__ does equal\
    \ to \"main__\", it will execute the block of statements\n\n# Program 4.1: Program\
    \ to Demonstrate a Function with and without Arguments\n\n+   1. def function_definition_with_no_argument():\n\
    2. print(\"This is a function with NO Argument\")\n3. def function_definition_with_one_argument(message):\n\
    4. print(\"This is a function with [message]\")\n5. def main():\n6. function_definition_with_no_argument()\n\
    7. function_definition_with_one_argument(\"One Argument\")\n8. if __name__ ==\
