    # 11.8.3 Multiple Inheritances


    Python also supports a form of multiple inheritances. A derived class definition
    with multiple base classes looks like this:


    ```

    class DerivedClassName(Base_1, Base_2, Base_3):

    <statement-1>


    <statement-N>

    ```


    Derived class DerivedClassName is inherited from multiple base classes, Base_1,
    Base_2, Base_3. For most purposes, in the simplest cases, you can think of the
    search for attributes inherited from a parent class as depth-first, left-to-right,
    not searching twice in the same class where there is an overlap in the hierarchy.
    Thus, if an attribute is not found in DerivedClassName, it is searched for Base_1,
    then (recursively) in the base classes of Base_1, and if it was not found, it
    would be searched for Base_2, and so on. Even though multiple inheritances are
    available in Python programming language, it is not highly encouraged to use as
    it is hard and error prone.


    You can call the base class method directly using Base name itself without using
    the super() function. The syntax is,


    ```

    BaseClassName.methodname(self, arguments)

    ```


    Notice the difference between super() function and the base class name in calling
    the method name.


    Use subclass() function to check inheritance. The syntax is,


    ```

    issubclass(DerivedClassName, BaseClassName)

    ```


    This function returns Boolean if DerivedClassName is a derived class of base class
    BaseClassName. The DerivedClassName is considered a subclass of itself. BaseClassName
    may be a tuple of classes, in which case every entry in BaseClassName will be
    checked. In any other case, a TypeError is raised.


