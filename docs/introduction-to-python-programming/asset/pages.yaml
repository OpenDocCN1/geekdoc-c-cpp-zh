    # 9.7 Python os and os.path Modules


    Python os provides a portable way of using system dependent functionality. For
    accessing the filesystems, use the os module. If you want to manipulate paths,
    use the os.path module. os.path works in a strange way. It looks like it should
    be a package with a submodule path, but in reality, os is a normal module that
    does magic with sys.modules to inject os.path. Here is what happens. When Python
    starts up, it loads a bunch of modules into sys.modules. They are not bound to
    any names in your script, unless you access the already-created modules you import.
    The sys.modules is a dictionary of modules. When you import a module, if it already
    been imported somewhere, it gets the instance stored in sys.modules. The os is
    among the modules that are loaded when Python starts up. It injects its attribute
    to an os-specific path sys.modules[''os.path''] = path so that you are able to
    do "import os.path" as though it was a submodule. Think of os.path as a module
    that you want to use rather than a thing in os. Therefore, even though it is not
    really a submodule of a package called os, import sort of like it is one, and
    always import os.path.


    Various methods of the os module are shown in TABLE 9.4.'
