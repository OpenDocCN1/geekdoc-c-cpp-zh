  md: '# Preface


    The difference between a text file and a binary file is covered. Functions needed
    for manipulation of CSV files programmatically are also addressed. This chapter
    shows the modules required for navigating and accessing file systems using the
    Python programming language.


    In Chapter 10, regular expression concepts are introduced. You explore the use
