    The while loop starts with the while keyword and ends with a Colon. With a while
    statement, the first thing that happens is that the Boolean expression is evaluated
    before the statements in the while loop is executed. If the Boolean expression
    evaluates to False, then the statements in the while loop are never executed.
    If the Boolean expression evaluates to True, then the while loop is executed.
