    ③.


    Compound assignment operators support shorthand notation for avoiding the repetition
    of the left-side variable on the right side. Compound assignment operators combine
    assignment operator with another operator with = being placed at the end of the
    original operator. For example, the statement


    ```

    >>> x = x + 1

    ```


    can be written in a compactly form as shown below.


    ```

    >>> x = 1

    ```


