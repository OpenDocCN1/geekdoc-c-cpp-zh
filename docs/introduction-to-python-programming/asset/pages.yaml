    • An optional header may appear as the first line of the file with the same format
    as normal record lines. This header will contain names that give a meaningful
    representation of the fields in the file and should contain the same number of
    fields as the rest of the file. A record can be divided into fields. Each record
    consists of several fields and the fields of all the records form columns. For
    example,

    ```

    field_name,field_name,field_name CRLF

    ppp,qqq,rrr CRLF

    xxx,yyy,zzz CRLF

    ```

    • Commas are used to separate the fields in each record. Each line should contain
    the same number of fields throughout the file. Spaces are considered to be part
    of a field and should not be ignored. A comma must not follow the last record
    in the file. For example,

    ```

    ppp,qqq,rrr

    ```

    • Double quotes may or not be used to enclose each field; however, some programs,
    such as Microsoft Excel, do not use quotes at all. If fields are not enclosed
    with double quotes, then the double quotes may not appear in the fields. For example,

    ```

    ""ppp","qqq","rrr" CRLF

    xxx,yyy,zzz

    ```

    • If the fields are enclosed within double quotes, then a double quote appearing
    inside a field must be escaped by preceding it with another double quote. For
    example,

    ```

    """ppp","qqq","rrr"

    ```


    When working with CSV files in Python, there is a built-in module called CSV.
    The csv module implements classes to say, "write this data in the format preferred
    by Excel," or "read data from this file, which was generated by Excel," without
    knowing the precise details of the CSV format used by Excel. Programmers can also
    describe the CSV formats used by other applications or define their own special-purpose
    CSV formats. The *csv* module''s reader and writer objects read and write write
    sequences.


    To read from a CSV file use the csv.reader() method. The syntax is,


    ```

    csv.reader(csvfile)

    ```


    where csv is the module name and csvfile is the file object. This method returns
    a csv reader object, which will iterate over the lines in the given csvfile. If
    *csvfile* is a file object, it should be opened with newline=''''.


    To write to a CSV file, use the csv.writer() method. The syntax is,


    ```

    csv.writer(csvfile)

    ```


    where csv is the module name and csvfile is the file object. This method returns
    a csv writer object responsible for converting the user''s data into comma separated
    strings on the given file-like object.'
