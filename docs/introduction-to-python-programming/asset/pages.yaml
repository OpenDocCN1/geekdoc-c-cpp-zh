  md: '# 7


    # Dictionaries


    AIM

    Understand the role of dictionaries in Python in storing key:value pairs of different
    data types allowing you to organize your data in controlled ways.


    # LEARNING OUTCOMES


    At the end of the chapter, you are expected to


    +   - Create and manipulate key:value pairs in dictionaries.

    - Use methods associated with dictionaries.

    - Use for loop to access key:value pairs in dictionaries.


    Another useful data type built into Python is the Dictionary. In the real world,
    you have seen your Contacts list in your phone. It is practically impossible to
    memorize the mobile number of everyone you come across. In the Contacts list,
    you store the name of the person as well as his number. This allows you to identify
    the mobile number based on a person''s name. You can think of a person''s name
    as the key that retrieves his mobile number, which is the value associated with
    the key. Dictionaries are sometimes found in other languages as “associative memories”
    or “associative arrays.”


    # 7.1 Creating Dictionary


    A dictionary is a collection of an unordered set of key:value pairs, with the
    requirement that the keys are unique within a dictionary. Dictionaries are constructed
    using curly braces {}, wherein you include a list of key:value pairs separated
    by commas. Also, there is a colon (:) separating each of key and value pairs,
    the words to the left of the colon operator are the keys and the words to the
    right of the colon operator are the values. Unlike lists, which are indexed by
    a range of numbers, dictionaries are indexed by keys. Here a key along with its
    associated value is called a key:value pair. Dictionary keys are case sensitive.'
  merge: -1
  pgno: 195
