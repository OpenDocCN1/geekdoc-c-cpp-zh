    # A7 Evaluating Expressions


    Finally, you can evaluate any expression at any time. For example, if you want
    to see the value of the variable, click the button, and then in the dialog box
    that opens, click *Evaluate* (FIGURE A14):


    ![](img/1a4c4d9415149052170c8f902baa9036_442_1.png)


    FIGURE A14

    Evaluate window to see the value of a variable.


    PyCharm gives you the possibility to evaluate any expression. For example (FIGURE
    A15):


    ![](img/1a4c4d9415149052170c8f902baa9036_442_2.png)


    FIGURE A15

    Evaluate window to evaluate any expression.'
