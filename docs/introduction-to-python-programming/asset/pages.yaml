    # 12.2.1 Using JSON Object Notation


    JSON (JavaScript Object Notation) is a lightweight text-based data-interchange
    format, which was popularized by Douglas Crockford. It is simple for humans to
    read and write and enough for machines to parse and generate. It is based on a
    subset of the JavaScript Programming Language, Standard ECMA-262 3rd Edition –
    December 1999. JSON is a text format that is completely language independent but
    uses conventions that are familiar to programmers of various languages, including
    C, C++, C#, Java, JavaScript, Perl, Python, and many others and all of these programming
    languages feature the ability to read (parse) and generate JSON.


    The built-in data in JSON are strings, numbers, booleans (i.e., true and false),
    null, objects, and arrays. JSON is built on two structures:


    +   - A collection of string: value properties. In many languages, this is realized
    as an object, record, struct, dictionary, hash table, keyed list, or associative
    array.

    - An ordered list of values. In most languages, this is realized as an array,
    vector, list, or sequence.


    The two mentioned structures are universal data structures. Virtually modern programming
    languages support them in one form or other. It makes sense that a data format
    that is interchangeable with programming languages is also based on these structures
    (FIGURE 12.2).


    ![](img/1a4c4d9415149052170c8f902baa9036_367_0.png)


    FIGURE 12.2

    JSON Structures.


    A JSON object can have one or more properties, each of which is a string: value
    pair. An object begins with a left brace ({) and ends with a right brace (}).
    Each string is followed by a colon (:), and the string: value pairs are separated
    by a comma (,). Conventionally, a space is used after the colon. The purpose of
    this space is to make your code easy for people to read.'
