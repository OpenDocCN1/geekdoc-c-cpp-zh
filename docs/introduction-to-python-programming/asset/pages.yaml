  md: '# Introduction to Python Programming


    use-case for class-private members (namely to avoid clashes of names with names
    defined by subclasses), there is support for such a mechanism, e.g., __ mangling.
    In Python, an identifier prefixed with a double underscore (e.g., __spam) and
    with no trailing underscores should be treated as private (whether it is a method
    or an instance variable). Any identifier of the form __spam is textually replaced
    with _classname__spam, whereclassname is the current class name with a leading
    underscore(s) stripped. This mangling is done without regard to the syntactic
    position of the identifier, as it occurs within the definition of a class. Name
    mangling is helpful for letting subclasses override methods without breaking internal
    class methods. Name mangling is intended to give classes an easy way to define
    "private" instance variables and methods, without having to worry about variables
    defined by derived classes. Note that the mangling are designed mostly to avoid
    accidents; it is still possible to access or modify a variable that is considered
    private.


