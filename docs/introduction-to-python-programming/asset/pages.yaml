    # 1.5.7 Hypertext Transfer Protocol (HTTP) Library


    The Requests HTTP library is popularly referred to as the library written for
    humans. Python has a standard HTTP library called urllib.request to carry out
    most of the HTTP operations. The Application Programming Interfaces (APIs) of
    urllib.request are not easy to use and verbose. To overcome these problems Requests
    was created as a standalone library. Common HTTP verbs like POST, GET, PUT and
    DELETE which correspond to create, read, update and delete operations are fully
    supported. Also, Requests provides features like thread-safety, support for International
    Domains, Cookie Persistence and Connection Timeout. Requests is available under
    Apache license 2.0.


    # 1.5.8 Database Connectors/NoSQL Connectors


    Database connectors are drivers that allows us to query the database from the
    programming language itself. MySQL and PostgreSQL are the popular open databases.
    MySQL-Python-Connection for Oracle is the most popular Python connector available
    for MySQL and psycopg2 is the Python connector widely used for PostgreSQL.


    Object Relation Modeling (ORM) is a powerful tool of querying the database to
    achieve persistence that data can live beyond the application process. There is
    a mismatch between the Object-oriented language models and the Relational databases
    leading to several problems like granularity, inheritance, identity, associations
    and navigations. ORM helps in mapping the data from Object-oriented languages
    to the Relational databases and follows the business layer logic. SQLAlchemy is
    a highly recommended ORM toolkit for applications to be deployed at the enterprise
    level. Python connectors are also available for NoSQL databases like MongoDB and
    Cassandra.


