    01

    >>> print(s1)

    2

    >>> s2 = f.read(3)

    >>> print(s2)

    234

    >>> f.tell()

    5

    ```


    Carriage return moves to the beginning of the current line without advancing downward.
    The name comes from a printer''s carriage, as monitors were rare when the name
    was coined. This is commonly escaped as "\r" and abbreviated as CR.

    Linefeed means to advance downward to the next line; however, it has been repurposed
    and renamed as "newline". This is commonly escaped as "\n" and abbreviated as
    LF or NL. CRLF (but not CRLNL) is used for the pair "\r\n"

    The common difference (and probably the only worth worrying about) is ending with
    CRLF in Windows and NL in Linux. tell() can return illegal values when reading
    files with Linux-style line-ends. The tell() method returns an integer giving
    the file''s current position in the file. Use binary mode (''rb'') to circumvent
    this problem. Statement ⋈, the read() returns the first two characters of the
    text. The tell() method says that the file handler is currently at the 2nd position
    ➁. From statement, ⓔ, the read() returns the next three characters of the text.
