    # 11.4 The Constructor Method


    Python uses a special method called a constructor method. Python allows you to
    define only one constructor per class. Also known as the __init__() method, it
    will be the first method definition of a class and its syntax,


    ```

    def __init__(self, parameter_1, parameter_2, ..., parameter_n):\    statement(s)

    ```


    The __init__() method defines and initializes the instance variables. It is invoked
    as soon as an object of a class is instantiated. The __init__() method for a newly
    created object is automatically executed with all of its parameters. The __init__()
    method is indeed a special method as other methods do not receive this treatment.
    The parameters for __init__() method are initialized with the arguments that you
    had passed during instantiation of the class object. Class methods that begin
    with a double underscore (_) are called special methods as they have special meaning.
    The number of arguments during the instantiation of the class object should be
    equivalent to the number of parameters in __init__() method (excluding the self
    parameter).'
