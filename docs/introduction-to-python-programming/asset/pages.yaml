  md: '# 10.3 Named Groups in Python Regular Expressions


    Regular expressions use groups to capture strings of interest. As the regular
    expression becomes complex, it gets difficult to keep track of the number of groups
    in the regular expression. In order to overcome this problem Python provides named
    groups. Instead of referring to the groups by numbers, you can reference them
    by a name. The syntax for a named group is


    ```

    (?P<name>RE)

    ```


    where the first character is ?, followed by letter P (uppercase letter) that stands
    for Python Specific extension, name is the name of the group written within angle
    brackets, and RE is the regular expression. Named groups behave exactly like capturing
    groups, and additionally associate a name with a group. The match object methods
    deal with capturing groups all accept either integers that refer to group number
    or strings that contain the desired group''s name.


    +   1. >>> import re

    2. >>> pattern = re.compile(''(?P<word>\b\w+\)'')

    3. >>> match_object = pattern.search(''laugh out loud'')

    4. >>> match_object.group(''word'')


    ```

