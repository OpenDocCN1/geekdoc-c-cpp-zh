    of class definition looks like this:


    ![](img/1a4c4d9415149052170c8f902baa9036_311_0.png)


    Classes are defined by using the class keyword, followed by the className and
    a colon. Class definitions must be executed before they have any effect. In practice,
    the statements inside a class definition will usually be function definitions,
    but if other statements are allowed (We''ll discuss this later). Because these
    functions are indented under a class, they are called methods. Methods are a special
    kind of function that is defined within a class.


