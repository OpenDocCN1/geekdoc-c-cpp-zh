    2. XML tags are case sensitive


    When you create XML documents, the tag <Google> is different from the tag <google>

    Incorrect:


    <Google>An Alphabet Company. </google>

    Correct:


    <google>An Alphabet Company. </google>


    3. All elements must be properly nested.


    Improper nesting of tags makes no sense to XML. <country> and <state> are sibling
    elements.

    Incorrect:


    <country><state>Alaska is the biggest state in USA </country></state>

    Correct:

    <country><state>Alaska is the biggest state in USA </state></country>


    4. All XML documents must have a root element.


    All XML documents must contain a single tag pair to define a root element. All
    other elements must be within this root element. Family metaphors, such as a parent,
    child and sibling, are used to describe relationships between elements relative
    to each other. All elements can have sub-elements (child elements). Sub-elements
    must be correctly nested within their parent element. For example,


    ```

    <root>

    <child>

    <subchild>...</subchild>

    </child>

    </root>

    ```


    5. Attribute values must always be quoted.


    Omitting quotation marks around attribute value is illegal. The attribute value
    must always be quoted.

    Incorrect:


    ```

    <thor=Asgard> God of Thunder </thor>

    Correct:

    <thor="Asgard"> God of Thunder </thor>

    ```


    6. Writing Comments in XML


