  md: 'Object-Oriented Programming 293


    # 11.3 Creating Objects in Python


    Object refers to a particular instance of a class where the object contains variables
    and methods defined in the class. Class objects support two kinds of operations:
    attribute references and instantiation. The term attribute refers to any name
    (variables or methods) following a dot. is a syntactic construct. The act of creating
    an object from a class is called instantiation. The names in a class are referenced
    by objects and are called attribute references. There are two kinds of attribute
    references, data attributes and method attributes. Variables defined within the
    methods are called instance variables and are used to store data values. New instance
    variables are associated with each of the objects that are created for a class.
    These instance variables are also called data attributes. Method attributes are
    methods inside a class and are referenced by objects of a class. Attribute references
    use the dot notation syntax as supported in Python.


    The syntax to access data attribute is:


    ```

    object_name.data.attribute_name

    ```


    The syntax to assign value to data attribute is:


    ```

    object_name.date_attribute_name = value

    ```


    where value can be of integer, float, string types, or another object itself.

    The syntax to call method attribute is,


    ```

    object_name.method_attribute_name()

    ```


    Valid attributes are all the names that were inside the class when the objects
    for the class was created. The connection between the attributes with the object
    is indicated by a dot (".") written between them with object_name on left and
    attribute_name on right. For example, in the expression z.real = 10, real is an
    data attribute of the z and is assigned a value of 10. In the expression cow.domesticated(),
    domesticated() is a method attribute of the cow object.

    The syntax for Class instantiation is:


    Optional


    ```

    object_name = ClassName(argument_1, argument_2, ..., argument_n)

    ```


    Class instantiation uses function notation, where in parentheses () as if it were
    a, nokia = Mobile(). The above expression creates a new object for the class ClassName
    and assigns this to the variable object_name. You can specify any number of arguments
    during instantiation of the class object. An object nokia Ⓡ for the class Mobile
    is created. The nokia object calls the methods receive_message() Ⓡ and send_message()
    ⑪ using the dot operator. Calling nokia.receive_message() ⑪ and nokia.send_message()
    ⑪ means that these methods are to be used with a nokia instance of the class Mobile.'
