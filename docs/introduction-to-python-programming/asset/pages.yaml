    The syntax for DictReader is,


    ```

    class csv.DictReader(fieldnames=None, restkey=None)

    ```


    This creates an object that operates like a regular but maps the information in
    each row to an OrderedDict (prior to Python 3.6) or regular dictionary (in Python
    3.6 and above versions), whose keys are given by the optional fieldnames argument.
    An OrderedDict is a dictionary that remembers the keys were first inserted. The
    optional fieldnames argument is a sequence. If fieldnames are omitted, the values
    in the first row of file will be filed. If a row has more fields than the fieldnames,
    the remaining data is put in a list stored with the fieldname by restkey keyword
    argument (which by default None). If a non-blank row has fewer fields than fieldnames,
    the missing values are filled with None.

    The syntax for DictWriter is,


    ```

    class csv.DictWriter(fieldnames, extrasaction=''raise'')

    ```


    This creates an object that operates like a regular but maps dictionaries to output
    rows. The fieldnames parameter is a sequence of characters that identifies the
    order in which values in the dictionary passed to the writerow() method are written
    to file. If the dictionary passed to the writerows() method contains a key not
    found in fieldnames, then the extrasaction argument indicates what action to take.
    If it is set to ''raise'', the default value, a ValueError is raised. If set to
    ''ignore'', extra values in the dictionary are ignored. Unlike the DictReader
    class, the fieldnames argument of the DictWriter class is not optional.


