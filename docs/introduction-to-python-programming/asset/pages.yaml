    # A6 Watching


    PyCharm allows you to watch a variable. Just click on the toolbar of the Variables
    tab, and type the name of the variable you want to watch. Note that code completion
    is available (FIGURE A11):


    ![](img/1a4c4d9415149052170c8f902baa9036_441_0.png)


    FIGURE A11


    Watch program variables.


    At first, you see an error – it means that the variable is not yet defined (FIGURE
    A12):


    ![](img/1a4c4d9415149052170c8f902baa9036_441_1.png)


    FIGURE A12


    Program variable under watch not yet defined.


    However, when the program execution continues to the scope that defines the variable,
    the watch gets the following view (FIGURE A13):'
