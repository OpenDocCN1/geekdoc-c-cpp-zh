  md: '# Introduction to Data Science


    visualizations with a minimal amount of code. Building on this declarative plotting
    idea, a surprising range of simple to sophisticated plots and visualizations can
    be created using a relatively simple grammar.

    Install Altair using pip command as shown below:


    ```

    1. C:\>pip install library

    ```


    Installs altair library ①.


    Follow the steps mentioned below to generate an Altair chart.


    +   * Create an Altir Chart Object with a pandas DataFrame.

    * Choose a suitable mark relevant to your Dataset.

    * Encode the X and Y values with appropriate columns in the DataFrame.

    * Save the data Chart object as a file with a .json extension.

    * Navigate to https://vega.github.io/editor/ an online Vega-Lite editor and paste
    the contents of the JSON file in the left pane of the editor. You can see a Chart
    generated in the right pane of the editor.


    Specifying Data in Altir

    Data in Altair is built around the pandas DataFrame. In Altair, every dataset
    should be provided as a DataFrame. This makes the encoding quite simple, as Altair
    uses the data information provided by pandas to determine the data types required
    in the encoding automatically.


    Chart

    The fundamental object in Altair is the Chart. It takes the DataFrame as a single
    argument. A Chart is an object that knows how to emit a JSON dictionary representing
    the data and visualization encodings, which is visually rendered by the online
    Vega-Lite editor using the Vega-Lite JavaScript library.


    Chart

    Now you have data that is not yet defined on how it should be visualized. You
    need to decide what sort of mark you would like to represent the data. Basic graphical
    marks in Vega-Lite are basic shapes whose properties (such as size, opacity, color)
    can be used to encode data from pandas DataFrame columns. For example, you can
    choose a bar mark to plot your data as bar chart. Some of the commonly used mark_*
    methods supported in Altair are mark_line() -> a Line plot, mark_bar() -> a Bar
    plot, mark_area() -> a filled Area plot, mark_rect() -> a filled rectangle for
    Heat maps, mark_point() -> a Scatterplot and rects.


    The next step is to add visual encodings (or encodings for short) to the chart.
    Encoding can be created with the encode method of the Chart object. The encoding
    object is a key-value mapping between encoding channels (such as X, Y) and DataFrame
    columns.'
