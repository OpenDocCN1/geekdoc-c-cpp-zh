  md: '# Tuples and Sets


    If an item within a tuple is mutable, then you can change it. Consider the presence
    of a list as an item in a tuple, then any changes to the list get reflected on
    the overall items in the tuple. For example,


    +   1. >>> german_cars = [''porsche'', ''audi'', ''bmw'']

    2. >>> european_cars = [''ferrari'', ''volvo'', ''renault'', ''german_cars'']

    3. >>> european_cars

    (''ferrari'', ''renault'', ''poche'', ''audi'', ''bmw''])

    4. >>> european_cars[3].append(''mercedes'')

    5. >>> german_cars

    [''porsche'', ''audi'', ''bmw'', ''mercedes'']

    6. >>> european_cars

    (''ferrari'', ''renault'', ''porsche'', ''audi'', ''bmw'', ''mercedes''])


    The tuple "containing" a list seems to change when the underlying list changes.
    The key insight is that tuples have no way of knowing whether the items inside
    them are mutable. The only thing that makes an item mutable is by a method that
    alters its data. In general, there is no way to detect this. In fact, the tuple
    did not change. It could not change because it does not have mutating methods.
    When the list changes, the tuple does not get notified of the change. The list
    does not know whether it is referred to by a variable, a tuple, or another list
    ①-②. The tuple itself is not mutable as it has no methods that can be used for
    changing its contents. Likewise, the string is immutable because strings do not
    have any mutating methods.


    # 8.6 Relation between Tuples and Dictionaries


    Tuples can be used as key:value pairs to build dictionaries.

    For example,


    +   1. >>> fish_weight_kg = (((''white_shark'', 520), (''beluga'', 1571), (''greenland_shark'',
