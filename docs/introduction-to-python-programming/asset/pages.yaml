  md: "# Introduction to Data Science\n\nRight Merge → In the merge operation, preference\
    \ is given to the key columns of right_df DataFrame. All the rows in key columns\
    \ of the right_df DataFrame are retained in the result-ing DataFrame. If any of\
    \ the data elements in the right_df DataFrame columns are present in the left_df\
    \ DataFrame columns, those rows are also retained. However, for the data elements\
    \ of the left_df DataFrame columns, which are not as same as the data elements\
    \ of right_df DataFrame columns, NaN is assigned (FIGURE 12.4b).\n\nInner Merge\
    \ → In the merge operation, if the data elements are found in the key columns\
    \ of both left_df and right_df DataFrames, then those rows are retained in the\
    \ resulting DataFrame. This is the default behavior of merge() function (FIGURE\
    \ 12.4c).\n\nOuter Merge → In the outer merge operation, all rows from left_df\
