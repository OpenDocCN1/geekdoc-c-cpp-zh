  md: '# Appendix-A: Debugging Python Code


    | AIM |

    | To understand the process of debugging Python program using the inbuilt debugger
    of PyCharm IDE. |


    Debugging in computer programming is a multistep process that involves identifying
    a problem, isolating the source of the problem, and then correcting the problem.
    Software which assists in this process is known as a debugger. Using a debugger,
    a software developer can step through a program''s code and analyze its variable
    values, searching for errors. Debugging helps in preventing incorrect operation
    of a software and operate according to a set of specifications.


    Debugging Python programs is easy: a bug or bad input will never cause a segmentation
    fault. Instead, when the interpreter discovers an error, it raises an exception.
    When the program does not catch the exception, the interpreter prints a stack
    trace. The debugger in PyCharm allows inspection of local and global variables,
    evaluation of arbitrary expressions, setting breakpoints, stepping through the
    code a line at a time, and so on. PyCharm debugger assists a software developer
    in becoming more productive.


    # A1 A Python Program to Debug


    Consider the Python program to solve quadratic equation ax² + bx + c = 0 (FIGURE
