    # 5.2.1 String Comparison


    You can use (>, <, <=, !=) to compare two strings resulting in either Boolean
    or False value. Python compares strings using ASCII value of the characters. For
    example:


    +   - >>> "january" == "jane"

    False

    - >>> "january" != "jane"

    True

    - >>> "january" < "jane"

    False

    - >>> "january" > "jane"

    True

    - >>> "january" <= "jane"

    False

    - >>> "january" >= "jane"

    True

    - >>> "filled" != ""

    True


    Strings can be compared using various comparison operators ①-⑦. String equality
    is compared using == = string_1 as "january" and string_2 as "jane". The first
    two characters of string_1 and string_2 (j and j) are compared. As they are equal,
    the second two characters (n and n) are compared. Since the third characters are
    equal, the fourth character from both ''u'' has greater ASCII value than ''e'',
    string_1 is greater than string_2. You can compare a string against an empty string.


    # 5.2.2 Built-In Functions Used on Strings


    There are many built-in functions for which a string can be passed as an argument
    (TABLE 5.1).


    # TABLE 5.1


    | Built-In Functions | Description |

    |---|---|n| len() | The len() function calculates the number of characters in
    a string. The white space characters are also counted. |

    | max() | The max() function returns a character having highest ASCII value. |

    | min() | The min() function returns character having lowest ASCII value. |'
