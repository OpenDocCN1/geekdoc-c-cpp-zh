    # 10.1.1 Using r Prefix for Regular Expressions


    Consider the regular expression, r''^$''. This regular expression matches an empty
    line. The ''^'' indicates the start of a line, and the ''$'' indicates the end
    of a line. Having nothing between the special characters ''^'' and ''$'', matches
    an empty line.

    The ''r'' prefix tells Python that the expression is a raw string and are handy
    in regular expressions. In a raw string, escape sequences are not parsed. For
    example, ''\n'' is a newline character. But, r''[\w]'' would be two characters:
    a backslash and an ''w''. Using an expression like r results in easy to read expressions.


    # 10.1.2 Using Parentheses in Regular Expressions


    Special Character → (...)

    Description → Matches whatever regular expression pattern is inside the parentheses
    and causes that the matched substring to be remembered. Remember, the substring
    can be recalled for other use. Parts of a regular expression bounded by parentheses
    are called groups, and they contain the matched substring. The parentheses are
    also called capturing parentheses or capturing group. Parentheses indicate the
    start ''('' and end '')'' of a group. Based on the number of parentheses used
    in a regular expression, the number of groups are created. If your regular expression
    contains a single pair of parentheses (one capturing group), you only get one
    group in your match. If there are two pairs of parentheses, there will be two
    groups in your match and so on. If you use a repetition operator (+ or *), the
    group gets ''overwritten'' each time the group is repeated, meaning only the last
    is captured after a match. Groups are numbered from 0, for example, group(0) ...
    up to group(99). To match literals ''('' or '')'', use (\ or \) and enclose them
    inside a class like [, ]].


    Parenthesis not only group substrings but they create backreferences as well.

    A backreference in a regular expression identifies a previously matched and remembered
    group and allows you to specify its contents i.e., backreference matches a substring
    already found in a group. You simply add a backslash character and the number
    of the group to match again. For example, to find the content matched by the first
    group in a regular expression, you would include, "\1" in your regular expression
    pattern.


    Example → The pattern (\d+)\d* illustrates additional escaped and special characters
    and indicates that part of the pattern should be remembered. It matches precisely
    the characters ''Chapter'' followed by a space, followed by one or'
