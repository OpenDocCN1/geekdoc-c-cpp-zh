    # 12.4.2 Pandas DataFrame


    DataFrame is a two-dimensional, labeled data structure with columns of potentially
    differ-ent types. You can think of it as a spreadsheet or database table, or a
    dict of Series objects. It is generally the most commonly used pandas object.
    DataFrame accepts many different kinds of input like Dict of one-dimensional ndarrays,
    lists, dicts, or Series, two-dimensional ndarrays, record ndarray, a dictionary
    of Series, or another DataFrame.


    ```

    df = pd.DataFrame(data=None, index=None, columns=None)

    ```


    Here, df is the DataFrame and data can be NumPy ndarray, dict, or DataFrame. Along
    with the data, you can optionally pass an index (row labels) and columns (column
    labels) attribute-s as arguments. If you pass an index and/or columns, you are
    guaranteeing the index and/or columns of the resulting DataFrame. Both index and
    columns will default to range(n) where n is the length of data, if they are not
    provided. When the data is a dictionary and columns are not specified, then the
    DataFrame column labels will be dictionary keys.


