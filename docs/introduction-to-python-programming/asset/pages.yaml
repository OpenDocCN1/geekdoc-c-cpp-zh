    word. Note that a word is defined as a sequence of word characters. The \b character
    matches the empty string, but only at the beginning or end of a word.

    Example → The pattern \bm matches the character ''m'' in the string "moon".

    The pattern \oo\b does not match the substring ''oo'' in the string "moon", because
    the substring ''oo'' is followed by \b which is a word character.

    The pattern \oon\b matches the substring ''oon'' in the string "moon", because
    ''oon'' is the end of the string, thus not followed by a word character.

    The pattern \bfoo matches the substring ''foo'', ''foo.'', ''(foo), ''foo bar
    baz'' but not ''foobar'' or ''foo03''.

    The pattern \wb\b will never match anything because \b character can never be
