    | def if return |

    | del import try |

    | elif in is with |

    | else is with |

    | except lambda yield |

    | False True None |


    # 2.3 Statements and Expressions


    A statement is an instruction that the Python interpreter can execute. Python
    program consists of a sequence of statements. Statements are everything that can
    make up a line (or several lines) of Python code. For example, z = 1 is an assignment
    statement.


    Expression is an arrangement of values and operators which are evaluated to make
    a new value. Expressions are statements as well. A value is the representation
    of some entity like a letter or a number that can be manipulated by a program.
    A single value >>> 20 or a single variable >>> z or a combination of variable,
    operator and value >>> z + 20 are all examples of expressions. An expression,
    used in interactive mode is evaluated by the interpreter and result is displayed
    instantly. For example,


    ```

    >>> 8 + 2

    10

    ```


    But the same expression when used in Python program does not show any output altogether.
    You need to explicitly print the result.'
