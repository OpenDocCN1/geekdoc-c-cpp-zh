  md: '# 8

    Tuples and Sets


    AIM

    Understand the role of tuples in Python when storing a finite sequence of homogeneous
    or heterogeneous data of fixed sizes and performing manipulations using various
    methods.


    LEARNING OUTCOMES

    At the end of the chapter, you are expected to


    +   * Create and manipulate items in tuples.

    * Use for to access individual items in tuples.

    * Understand the relation between dictionaries and tuples.

    * Understand the relation between lists and tuples.

    * Apply mathematical operations like union and intersection using sets.


    In mathematics, a tuple is a finite ordered list (sequence) of elements. A tuple
    is defined as a data structure that comprises an ordered, finite sequence of immutable,
    heterogeneous elements that are of fixed sizes. Often, you may want to return
    more than one value from a function. Tuples solve this problem. They can also
    be used to pass multiple values through one function parameter.


    # 8.1 Creating Tuples


    A tuple is a ordered list of values of possibly different types which is used
    to bundle related values together without having to create a specific type to
    hold them. Tuples are immutable. Once a tuple is created, you cannot change its
    values. A tuple is defined by putting a comma-separated list of values inside
    parentheses ( ). Each value inside a tuple is called an item. The syntax for creating
    tuples is,


    ![](img/1a4c4d9415149052170c8f902baa9036_221_0.png)'
  merge: -1
