  md: '# 9


    # Files


    | AIM |

    | Understand how to interact with files with the help of built-in Python functions
    and perform operations such as read, write, and manipulate files. |


    LEARNING OUTCOMES

    After completing this chapter, you should be able to


    +   - Select text files and binary files to read and write data.

    - Demonstrate the use of built-in functions to navigate the file system.

    - Make use of os module to operate on underlying Operating System tasks.


    In everyday life, the term "file" is something of a catchall. It is used for things
    that are not only written, but also used to describe things that don''t have any
    words in them at all, like pictures. A file is the common storage unit in a computer,
    and all programs and data are "written" into a file and "read" from a file. A
    extension, sometimes called a file suffix or filename extension, is the character
    or group of characters after the period that makes up an entire file. The file
    extension helps your computer''s operating system, like Windows, determine which
    program will be associated with the file. For example, the file assignments.docx
    ends in docx, a file extension that is associated with Microsoft Word for writing.
    When you open this file, Windows sees that the file ending in docx and knows it
    should be opened with the Microsoft Word program.


    File extensions also indicate the file type, or file format, of the file but not
    always. Any file''s extensions can be renamed, but will not convert the file to
    another format or change anything about the other file than this portion of it.
    File extensions and file formats are often spoken interchangeably. However, the
    file extension is just characters that are after the period, while the file format
    represents the way in which the data in the file is organized and what sort of
    it is. For example, in the file name pop.csv indicates that this is a CSV file.
    You could easily rename the file to pop.mp3, but that would not mean that you
    could play the file on a smartphone. The file itself is still rows of text (a
    CSV file), not a compressed musical recording (an MP3 file). Some file extensions
    are classified as executable, meaning that when clicked, they do not just open
    for viewing or playing, but actually do something all by themselves, like install
    a program, start a process, or run a script.'
