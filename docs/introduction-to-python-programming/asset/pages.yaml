  md: '# Parts of Python Programming Language


    Consider the expression,


    ```

    >>> 4 + 6

    ```


    where 4 and 6 are operands + is the operator. Python language supports a wide
    range of operators. They are


    +   1. Arithmetic Operators

    2. Assignment Operators

    3. Comparison Operators

    4. Logical Operators

    5. Bitwise Operators


    # 2.5.1 Arithmetic Operators


    Arithmetic operators are used to execute arithmetic operations such as addition,
    subtraction, multiplication etc. The following TABLE 2.2 shows all the arithmetic
    operators.


    # TABLE 2.2


    List of Arithmetic Operators


    | Operator | Operator Name | Description | Example |

    | --- | --- | --- | --- |

    | + | Addition operator | Adds two operands, producing their sum. | p + q = 5
    |

    | | Subtraction operator | Subtracts the two operands, producing their difference.
    | p - q = -1 |

    | * | Multiplication operator | Produces the product of the operands. | p * q
    = 6 |

    / | Division operator | Produces the quotient of operands where the left operand
    is the dividend and the right operand is the divisor. | q / p = 1.5 |

    | % | Modulus operator | Divides left operand by right hand operand and returns
    a remainder. | q % p = 1 |

    | ** | Exponent operator | Performs exponential (power) calculation on operands.
    | p** q = 8 |

    | // | Division operator | Returns the integral part of the quotient. | 9 // 2
    = 4 and 9.0 // 2.0 = 4.0 |


    > Note: The value of p is 2 and q is 3.


    For example,


    +   1. >>> 10+35

    45

    2. >>> -10+35

    25

    3. >>> 4*2

    8

    4. >>> 4**2

    16'
