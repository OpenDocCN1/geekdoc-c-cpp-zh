  md: "# 10\nRegular Expression Operations\n\nAIM\nComprehend the rules to construct\
    \ regular expressions, and apply them to text to\nsearch for patterns and make\
    \ changes.\n\nLEARNING OUTCOMES\nAfter completing this chapter, you should be\
    \ able to\n\n+   - Create regular expressions that match text patterns.\n- Apply\
    \ regular expressions to text using methods from re module.\n- Illustrate the\
    \ use of metacharacters in building regular expressions.\n- Discover commonly\
    \ used operations involving regular expressions.\n- Understand how to use regular\
    \ expressions for text searching or string\nreplacement.\n\nRegular expressions,\
    \ also called REs, or regex, or regex patterns, provide a power-\ful way to search\
    \ and manipulate strings. Regular expressions are essentially a tiny,\nhhighly\
    \ specialized programming language embedded inside Python and made avail-\nable\
    \ through the re module. Regular expressions use a sequence of characters and\
    \ sym-\nfine a pattern of text. Such a pattern is used to locate a chunk of text\
    \ in a string\nby matching up the pattern against the characters in the string.\
    \ Regular expressions are\nuseful for finding phone numbers, email addresses,\
    \ dates, and any other data that has\nc consistent format.\n\n# 10.1 Using Special\
    \ Characters\n\nA regular pattern is composed of simple characters, such as abc,\
    \ or a combi-\nation of simple and special characters, such as abc*. Simple patterns\
    \ are constructed of\ncharacters for which you want to find a match text. For\
    \ example, the pattern abc matches\ncharacter combinations in strings only when\
    \ the characters \"abc\" occur together and\nexactly in that order. Such a match\
    \ would succeed in the strings: \"Hi, do you know your\nab's?\" \"The latest airplane\
    \ designs evolved from slabcraft.\" In both cases, the\nmatch is with substring\
    \ \"abc\". There is no match in the string \"Grab cab\" because,\nwhile it contains\
    \ the substring \"ab c\", it does not contain the exact substring \"abc\"."
