  md: 'Some characters are metacharacters, also called as special characters, and
    don''t match

    themelves. Instead, they signal that some out-of-the-ordinary thing should be
    matched,

    or they affect other portions of the regular expressions by repeating them or
    changing their

    meaning. When the search for a match requires something more than a direct match,
    such

    as finding one or more b''s or finding space, the pattern includes special characters.

    For example, the pattern *abc* matches any character combination in which a single
    "a" is

    followed by zero or more b''s (* means 0 or more occurrences of the preceding
    item) and

    t immediately followed by "c". In the string "cbabbbcdebc", the pattern matches
    the

    substring "abbcb".


    Below you will find a complete list and description of the special characters
    that can be

    using regular expressions.


    Special Character → [xyz]


    Description → Square brackets are used to indicate a set of characters. The square

    brackets [] are used for specifying a character class, also called a "character
    set,\nwhich is a set of characters that you want to match. Place the pattern any
    you

    want to match between square brackets. This pattern matches any of the

    characters in the brackets, including escape sequences. Special characters

    the dot (.) and asterisk (*) are not special a character set, so they do not

    be escaped. The character can be listed individually, or a range of characters

    can be indicated by giving two characters and separating them by a hyphen (-).

    Example → The pattern [abc] will match any one of the characters, b, or c; this
    is

    as as [a-c], which uses a range to express the same set of characters. The pattern

    [akm$] will match any of the characters ''a'', ''k'', ''m'', or ''$''. The character
    ''$'' is usually

    special character, but inside a character class it is stripped of its special
    nature.

    t pattern [-d], which performs the same match as [abcd], matches the ''b'' in

    "brisket" and the ''c'' in "city".


    Special Character → (a period)


    Description → Matches any single character except newline ''\n''.


    Example → The pattern .n matches the substrings ''an'' and ''on'' in the string
    "nay, an

    is on the tree", but not ''nay''.


    Special Character → ^


    Description → Matches the start of the string, and in multiline mode, also matches

    immediately after character.

    The pattern "^A" does not match the character ''A'' in the string "an A" but does

    match the character ''A'' in the string "An E". You can match the characters not
    listed

    within the class by complementing the character set. That is, if the first

    of the character set is "^", all that are not in the character set will be

    matched. The character ''^'' has no special meaning if it''s not the first in
    the

    character set. You can specify a range of characters by using a hyphen. Everything

    that works in the normal character set also works here. For example, the pattern

    [^abc] is the same as [^a-c] pattern. They initially match the character ''r''
    in the string

    "brisket" and the character ''h'' in the string "chop".'
