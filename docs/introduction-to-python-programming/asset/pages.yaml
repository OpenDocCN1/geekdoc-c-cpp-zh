  md: 'Backslashes may not appear inside the expression portions of f-strings, so
    you cannot use them. Backslash escapes may appear inside the string portions of
    an f-string. For example, to escape quotes in f-strings:


    ```

    >>> f[''\quoted string\'']

    File "<stdin>", line 1

    SyntaxError: f-string expression part cannot include a backslash

    ```


    Backslashes are not supported within the curly braces when f-strings are used.
    You can use a different type of quote inside the expression:


    ```

    >>> f[''"quoted string'']

    ''quoted string''

    ```


    Use different types of quotes within and outside the curly braces.


    # 5.6.1 Format Specifiers


    Format specifiers may also contain evaluated expressions. The syntax for f-string
    formatting operation is:


    ```

    `f_string_statement[variable_name :{width}.[precision]]`

    ```


    The f character should be prefixed during f-formatting. The string_statement is
    a string consisting of a sequence of characters. Within curly braces, you specify
    the variable_name whose value will be displayed. Specifying width and precision
    values are optional. If they are specified, both width and precision should be
    included within curly braces. Also, using variable_name along with either width
    or precision values should be separated by a colon. You can pad or create space
    around variable_name element through width. By default, strings are left-justified
    and numbers are right-justified. Precision refers to the total number of digits
    that will be displayed in a number. This includes the decimal point and all the
    digits, i.e., before and after the decimal point. For example:


    ```

    >>> width = 10

    >>> precision = 5

    >>> value = 12.34567

    >>> result = f''{value:{width}.{precision}}''

    ''result: 12.3457''

    >>> result = f''{value:[width]}''

    ''result: 12.34567''

    >>> result = f''{value:.[precision]}''

    ''result: 12''

    ```


    Different ways of string formatting in f-strings.'
