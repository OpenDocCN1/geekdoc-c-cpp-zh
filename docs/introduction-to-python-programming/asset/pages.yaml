    # 12.2.4 JSON versus XML


    Since both JSON and XML are widely used as data interchange formats, we will try
    to draw a comparison between them.


    +   - XML is more expressive than JSON. However, XML suffers from the frequent
    use of tags, whereas JSON is much more compact.

    - Both JSON and XML can be used with most of the programming languages. But the
    way the programming languages handle these two format is different. When you are
    working with XML, its data format does not directly translate to a programming
    language data structure, forcing you to work with two systems whose data structures
    are. The objects and arrays used in JSON are inherently compatible with most of
    the programming languages’ data structures, which eases the use of JSON format
    in a programming language.

    - XML has XSLT (Extensible Stylesheet Language Transformations) specification,
    which may be used to apply a style to an XML document. JSON does not have any
    such thing.


    # 12.3 NumPy with Python


    NumPy is the fundamental package for scientific computing with Python. It stands
    for “Numerical Python.” It supports:


    +   - N-dimensional array object

    - Broadcasting functions

    - Tools for integrating C/C++ and Fortran code

    - Useful linear algebra, Fourier transform, and random number capabilities


    Beyond its obvious scientific uses, NumPy can also be used as a multi-dimensional
    container to store generic data. Arbitrary data types can also be defined. This
    allows NumPy to seamlessly and speedily integrate with a wide variety of databases.

    NumPy’s main object is the homogeneous multidimensional array. An array is a table
    of elements (usually numbers), all of the same type, indexed by a tuple of positive
    integers and represented by a single value. NumPy’s array is called `ndarray`.
    It is also known by the alias `array`.


    In NumPy arrays, the individual data items are called elements. All elements of
    an array should be of the same type. Arrays can be made up of any number of dimensions.
    In NumPy, dimensions are called axes. Each dimension of an array has a length
    which is the total number of elements contained in that dimension. The size of
    NumPy arrays is fixed; once created it cannot be changed.

    For example, FIGURE 12.3 shows the axes (or dimensions) and lengths of two example
    arrays; 12.3(a) is a one-dimensional array and 12.3(b) is a two-dimensional array.
    A one-dimensional array has one axis indicated by Axis-0. That axis has five elements
    in it, so we say it has a length of five. A two-dimensional array is made up of
    rows and columns.'
