  md: '# 11.8.4 Method Resolution Order (MRO)


    Method Resolution Order, or "MRO" in short, denotes the way programming language
    resolves a method found in multiple base classes. For a single inheritance, the
    MRO does not come into play but for multiple inheritance MRO matters a lot. When
    a derived class inherits from multiple classes, Python programming language needs
    to resolve the methods that are found in multiple base classes as well as the
    derived class, which is invoked by an object. MRO uses the C3 linearization algorithm
    to determine the order of the methods to be invoked in multiple inheritance while
    guaranteeing monotonicity. MRO applies a set of rules to resolve the method order
    by constructing linearization.


    Python provides method() to get information about Method Resolution Order. The
    syntax to find MRO is,


    ```

    class_name.mro()

    ```


    where *class_name* is the name of the class.

    Here, we provide the "behind the scene" of building an MRO in multiple inheritance.
    The C3 linearization of a derived class is the sum of the derived class, plus
    a *merge* of linearization of its base classes and a list of base classes itself.
    The derived class and all the base classes from which the class is derived are
    represented as list items.

    The C3 linearization of a derived class can be represented as below.


    | First Part | Second Part |

    | --- | --- |

    | L(Derived_Class) = [Derived_Class] + merge((Base_Class_1), (Base_Class_2), ...,
    (Base_Class_n), Base_Classes_1, Base_Class_2, ..., Base_Class_n) | |

    | Subpart One | Subpart Two |


    The letter L stands for linearization of a class. The above representation consists
    of two parts, where the first part is the Derived class represented as a list
    item. The second part consists of *merge*, whose results are added as items to
    the list of the first part. Again, inside *merge*, it consists of two subparts.
    Subpart One is the representation of linearization of all the base classes from
    which *Derived_Class* was derived, and Subpart Two is a list of all the base classes
    from which *Derived_Class* was derived. The ordering of base classes from the
    nearest base class to the furthest base class with the derived class preceding
    the base class is called local precedence of classes. The list of base classes
    as the last argument in the *merge* part preserves the local precedence order
    of the base classes. An MRO is monotonic when the following is True: If Base_Class_1
    precedes Base_Class_2 in the linearization of Derived_Class, Base_Class_1 precedes
    Base_Class_2 in the linearization of any derived classes of *Derived_Class* itself.
    The construction of linearization for MRO should respect local precedence order
    and monotonicity.

    The linearization result for a class is replaced by a list sequence. The presence
    of a class in the first position in multiple list sequences at the same time is
    called *Head* or *good Head*, but it should not appear in any other if it is in
    the first position in one of the other list sequences, or if a class is not in
    a different position, other than the first position itself in all of the other
    list sequences, or then it is called a *Tail*.'
