  md: '# Introduction to Python Programming


    Its design philosophy emphasizes code readability, and its syntax allows programmers
    to express concepts in fewer lines of code that would not be possible in languages
    such as C++ or Java. The language provides constructs intended to enable clear
    programs on both a small and large scale. Python is a multi-paradigm programming
    language having full support for Object-oriented programming and Structured programming
    and there are a number of language features which support Functional programming.


    The first version of Python (i.e., Python 1.0) was introduced in 1991. Since its
    inception and introduction of Version 1.1, the evolution of Python has reached
    up to Version 3.x (till 2018). Python 2.0 was released on 16 October 2000 and
    had many major new features, including a cycle-detecting garbage collector and
    support for Unicode. With this, the development process became more transparent
    and community-backed. Python 3.0 (initially called Python 3.0 or py3k) was released
    on 3 December 2008 after a long testing period. It is a major revision of the
    language that is not completely backward-compatible with previous versions.

    The language’s core philosophy is summarized in the document Zen of Python, which
    includes principles such as,


    +   * Beautiful is better than ugly.

    * Explicit is better than implicit.

    * Simple is better than complex.

    * Complex is better than complicated.

    * Flat is better than nested.

    * Sparse is better than dense.

    * Readability counts.

    * Special cases are not special enough to break the rules.

    * Although practicality beats purity.

    * Errors should never pass silently.

    * Unless explicitly silenced.

    * In the face of ambiguity, refuse the temptation to guess.

    * There should be one—and preferably only one—obvious way to do it.

    * Although that may not be obvious at first you’re Dutch.

    * Now is better than never.

    * Although never is better than *right* now.

    * If the implementation is hard to explain, it is a bad idea.

    * If the implementation is easy to explain, it may be a good idea.

    * Namespaces are one honking great idea—let’s do more of those!


