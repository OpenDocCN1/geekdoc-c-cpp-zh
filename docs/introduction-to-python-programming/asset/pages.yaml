    # 8.2 Basic Tuple Operations


    Like in lists, you can use the + operator to concatenate tuples together and the
    * operator to repeat a sequence of tuple items.


    For example,


    +   1. >>> tuple_1 = (2, 0, 1, 4)

    2. >>> tuple_2 = (2, 0, 1, 9)

    3. >>> tuple_1 + tuple_2

    (2, 0, 1, 4, 2, 0, 1, 9)

    4. >>> tuple_1 * 3

    (2, 0, 1, 4, 2, 0, 1, 4, 2, 0, 1, 4)

    5. >>> tuple_1 == tuple_2

    False


    Two tuples, tuple_1 and tuple_2, consisting of integer type are created ①-②. The
    tuple_1 and tuple_2 are added to form a new tuple. The new tuple has all items
    of both the added tuples. You can use the multiplication operator * on. The items
    in the tuples are repeated the number of times you specify, and in ④ the tuple_1_items
    are repeated three times. In ⑤, the items in tuples are compared using == to operator,
    and the result is Boolean False since the items in the tuples are different.


    You can check for the presence of an item in a tuple using in and not in membership
    operators. It returns a Boolean True or False. For example,


    +   1. >>> tuple_items = (1, 9, 8, 8)

    2. >>> 1 in tuple_items

    True

    3. >>> 25 in tuple_items

    False


    the in operator returns Boolean True if an item is present in the tuple ②, or
    returns False Boolean value ⓷.'
