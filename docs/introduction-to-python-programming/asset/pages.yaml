  md: '# Regular Expression Operations


    +   - Before the first character of the word and if the first character is not
    a word character.

    - After the last character of the word and if the last character is not a word
    character.

    - Between two-word characters

    - Between two non-word characters


    The beginning and end of a string are considered non-word characters. The "\B"
    special character matches an empty string, only when it is not at the beginning
    or end of the word.


    Example → \B.. matches the substring ''oo'' in "noonday", and the pattern y\B.
    matches the substring ''ye'' in the string "possibly yesterday".


    Special Character → \

    Description → Matches according to the rules: a backslash that precedes a non-special
    character indicates that the next character is special and is not to be interpreted
    literally. A backslash that precedes a special character indicates that the next
    character is special and should not be interpreted literally.


    Example → The pattern ''b'' without a preceding ''\'' generally matches lowercase
    ''b'' wherever they occur. A ''\b'' by itself does not match any character; it
    forms the word boundary character.


    The pattern a* relies on the special character "*" to match 0 or more a''s. By
    contrast, the pattern a\ removes the specialness of the "*" to enable strings
    like ''a*''.


    Special Character → {m,n}

    Description → Where m and n are positive integers and m <= n. Matches at least
    m and at most n occurrences of the preceding expression. If n is omitted, i.e.
    [m], then it matches at least m occurrences of the preceding expression. Here
    m must be a positive integer.


    Example → The pattern a[1,3] matches nothing in the string "cndy", but matches
    character ''a'' in the string "candy". The pattern a[1,2] matches the first two
    a''s in the string "candy", and the first three a''s in the string "aaaandy".
    Notice that when matching "aaaandy", the match is "aaa", even though the original
    string had more a''s in it. The pattern a[2], will match substrings "aa", "aaa",
    "aaaa", "aaaaa", but not ''a''.


    Special Character → [m]

    Description → Matches exactly m occurrences of the preceding expression. Here
