  md: 'The syntax for try...except...finally is,


    ![](img/1a4c4d9415149052170c8f902baa9036_106_0.png)


    A try block consisting of one or more statements is used by Python programmers
    to partition code that might be affected by an exception. The associated except
    blocks are used to handle any resulting exceptions in the try block. That is,
    you want the try block to succeed, and if it does not succeed, you want the control
    to pass to the catch block. If any statement within the try block throws an exception,
    control immediately shifts to the catch block. If no exception is thrown in the
    try block, the catch block is skipped.


    There can be one or more except blocks. Multiple except blocks with different
    exception names can be chained together. The except blocks are evaluated from
    top to bottom in your code, but only one except block that specifies the exact
    name of the thrown exception is executed. If no except block specifies a matching
    exception then an block that does not have an exception name is selected, if one
    is present in the code. Instead of having multiple except blocks with multiple
    exception names for different exceptions, you can combine multiple exception names
    together separated by a comma (also called parent tuples) in a single except block.
    The syntax for combining multiple exception names in an except block is:


    ```

    except (Exception_Name_1, Exception_Name_2, Exception_Name_3):

    ```


    statement(s)


    where Exception_Name_1, Exception_Name_2 and Exception_Name_3 are different exception
    names.


    > You shall learn more about tuples in Chapter 8.'
