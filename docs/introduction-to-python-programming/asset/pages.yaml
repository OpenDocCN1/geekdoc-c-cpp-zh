  md: '# Tuples and Sets


    # 8.7.1 Tuple Packing and Unpacking


    The statement t = 12345, 54321, ''hello!'' is an example of tuple packing.


    ```

    >>> t = 12345, 54321, ''hello!''

    >>> t

    (12345, 54321, ''hello!'')

    ```


    The values 12345, 54321 and ''hello!'' are packed together into a tuple ①②.

    The reverse operation of tuple packing is also possible. For example,


    +   1. >>> x, y, z = t

    2. >>> x

    12345

    3. >>> y

    54321

    4. >>> z

    ''hello''


    This operation is called tuple unpacking and works for any sequence on the right-hand
    side. Tuple unpacking requires that there are as many variables on the left side
    of the equals sign as are items in the tuple ④. Note that multiple assignments
    are really just a combination of tuple packing and unpacking.


