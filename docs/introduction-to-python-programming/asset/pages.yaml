    # 5.6 Formatting Strings


    Python supports multiple methods to format text strings. These include %-formatting
    and str.format(). Each of these methods has their advantages, but in addition,
    disadvantages that make them cumbersome to use in practice. A new string formatting
    mechanism referred to as "f-strings" is becoming popular among Python community,
    taken from the leading character to denote such strings, and stands for "formatted
    strings". The f-strings provide a way to embed expressions inside strings literals,
    using a minimal syntax. A string literal is what we see in the source code of
    a Python program, including the quotation marks. It should be noted that an f-string
    is really an expression evaluated at run time and not a constant value. In Python
    source code, an f-string is a literal, prefixed with ''f'', which contains expressions
    within curly braces ''{'' and ''}\''.'
