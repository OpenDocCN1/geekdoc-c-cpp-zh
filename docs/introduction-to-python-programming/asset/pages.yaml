  md: '# Introduction


    # 1.2.2 Assembly Language


    Machine language is extremely difficult for humans to read because it consists
    merely of patterns of bits (i.e., 0s and 1s). Thus, programmers who want to work
    at the machine level instead usually use assembly language, which is a human-readable
    notation for the machine language. Assembly language replaces the instructions
    represented by patterns of 0s and 1s with alphanumeric symbols also as mnemonics
    in order to make it easier to remember and work with them including reducing the
    chances of making errors. For example, the code to perform addition and subtraction
    is


    ```

    ADD 3, 5, result

    SUB 1, 2, result

    ```


    Because of alphanumeric symbols, assembly language is also known as Symbolic Programming
    Language. The use of mnemonics is an advantage over machine language. Since the
    computer cannot understand assembly language, it uses another program called assembler.
    Assembler is a program that is used to convert the alphanumeric symbols written
    in assembly language to machine language and this machine language can be directly
    executed on the computer.

    Some of the disadvantages of Assembly language are


    +   * There are no symbolic names for memory locations.

    * It is difficult to read.

    * Assembly language is machine-dependent making it difficult for portability.


    # 1.2.3 High-Level Language


    High-level language is more like human language and less like machine language.
    High-level languages are written in a form that is close to our human language,
    enabling programmers to focus on the problem being solved. High-level languages
    are platform independent which means that the programs written in a high-level
    language can be executed on different types of machines. A program written in
    source program or source code is any collection of human-readable computer instructions.
    However, for a computer to understand and execute a source program written in
    high-level language, it must be translated into machine language. This translation
    is done using either compiler or interpreter.


    Advantages


    +   * Easier to modify, faster to write code and debug as it uses English like
    statements.

    * Portable code, as it is designed to run on multiple machines.


    A compiler is a system software program that transforms high-level source code
    written by a software developer in a high-level programming language into a low-level
    machine language. The process of converting high-level programming language into
    machine language is known as compilation. Compilers translate source code all
    at once and the computer executes the machine language that the compiler produced.
    The generated machine language can be later executed many times against different
    data each time. Programming languages like C, C++, C# and Java compilers. Compilers
    can be'
