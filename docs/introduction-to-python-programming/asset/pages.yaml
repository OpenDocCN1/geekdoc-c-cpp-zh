    When the Python interpreter reads the path, the characters \f and \b in the path
    will be treated as escape sequences and not as part of directory or name. Python
    represents backslashes in strings as \\ because it is an escape character—\n represents
    a new line, \t represents tab, \v represents ASCII Feed, and \b represents ASCII
    Backspace. Because of this, there is a way to tell Python you really two characters
    of \f and \b rather than Formfeed and Backspace, and you do not by escaping the
    backslash itself with another. In ⑥, to overcome the problem of the characters
    \n being treated as an escape sequence in the path, you have to include another
    backslash. You can also prefix the absolute path with the r character. ℇ. If so,
    there is no need to specify double backslashes in the path to overcome the escape
    sequence problem. The r means that the absolute path is to be treated as a raw
