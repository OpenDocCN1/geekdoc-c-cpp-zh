    # 10.2 Regular Expression Methods


    Now that we have looked at some simple regular expressions, how we actually use
    them in Python? In Python, methods to use and apply regular expressions can be
    accessed by importing the re module. The re module provides an interface to the
    Python regular expression engine.


    # 10.2.1 Compiling Regular Expressions Using compile() Method of re


    Regular expressions can be compiled into a pattern object, which has methods for
    various operations such as searching for pattern matches, finding all patterns
    or performing string substitutions. When you have to use the same regular expression
    again and on different strings, it is an excellent idea to construct a regular
    expression as a Python object. This can be accomplished through the use of the
    re.compile() method.


    ```

    re.compile(pattern, flags)

    ```


    where pattern is the regular expression and the optional flags argument is used
    to enable special features and syntax variations. For example, specifying the
    flags re.A enables ASCII-only matching, re.M enables case-insensitive matching;
    expressions like [A-Z] will also match lowercase. When re.M is enabled, the meaning
    of ''^'' and ''$'' changes. The special ''^ ''^ matches at the beginning of the
    string and at the beginning of each line (immediately following each newline);
    and the special character ''$'' matches at the end of the string and at the end
    of each line (immediately preceding each newline). By default, the special character
    ''^'' matches only at the end of the string and immediately before the newline
    (if any) at the end of the string.


    The compile() method returns a regular expression as a Python object, which can
    be used for matching patterns by using its match(), search(), sub(), findall()
    and other methods (TABLE 10.1).'
