    Introduction to Python Programming


    The objects returned by dict.keys(), dict.values(), and dict.items() are view
    objects. They provide a dynamic view of the dictionary''s entries, thus when the
    dictionary changes, the view reflects these changes.


    For example,


    ```

    >>> box_office_billion = {''avatar'':2009, ''titanic'':1997, ''starwars'':2015,
    ''harry-potter'':2011, ''avengers'':2012}

    >>> box_office_billion_fromkeys=box_office_billion.fromkeys(box_office_billion)

    >>> box_office_billion.keys()

    {''avatar'': None, ''titanic'': None, ''starwars'': None, ''harrypotter'': None,
    ''avengers'': None}

    >>> box_office_billion_fromkeys = box_office_billion.fromkeys(box_office_billion,
    "billion_dollar")

    >>> box_office_billion_fromkeys

    {''avatar'': ''billion_dollar'', ''titanic'': ''billion_dollar'', ''starwars'':
    ''billion_dollar'', ''harry-potter'': ''billion_dollar'', ''avengers'': ''billion_dollar''}

    >>> print(box_office_billion.get("frozen"))

    None

    >>> box_office_billion.get("frozen",2013)

    2013

    >>> box_office_billion.keys()

    dict_keys([''avatar'', ''titanic'', ''starwars'', ''harrypotter'', ''avengers''])

    >>> box_office_billion.values()

    [2009, 1997, 2015, 2011, 2012]

    >>> box_office_billion.items()

    dict_items([(''avatar'', 2009), (''titanic'', 1997), (''starwars'', 2015), (''harrypotter'',
    2011), (''avengers'', 2012)])

    >>> box_office_billion.update({"frozen":2013})

