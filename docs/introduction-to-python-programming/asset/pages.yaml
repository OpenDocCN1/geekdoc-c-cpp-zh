    # 11.8 Inheritance


    Inheritance enables new classes to receive or inherit variables and methods of
    existing classes. Inheritance is a way to express a relationship between classes.
    If you want to build a new class, which is already similar to one that already
    exists, instead of creating a new class from scratch you can reference the existing
    class and indicate what is different by overiding some of its behavior or adding
    some new functionality. A class that is used as the basis for inheritance is called
    a subclass or derived class. The class that inherits a base class is parent class
    and child class are also acceptable terms to use respectively. A derived class
    inherits variables and methods from its own. Inheritance easily enables reusing
    of code.


    BaseClass, on the left, has one variable and one method. DerivedClass, on the
    right, is derived from BaseClass and contains an additional variable and an additional
    method (FIGURE 11.7).


    If you can describe the relationship between derived classes and base class using
    the phrase is-a, then that relationship is inheritance. For example, a lemon is-a
    citrus fruit, which is-a fruit. A shepherd is-a dog, which is-an animal. A guitar
    is-a steel-stringed instrument, which is-a musical instrument. If the is-a relationship
    does not exist between a derived class and base class, you should not use inheritance.


    | BaseClass | DerivedClass |

    | :--- | :--- |

    | variable_1 | variable_2 |

    | method_10 | method_20 |

