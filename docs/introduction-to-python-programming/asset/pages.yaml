    # 5.4.2 Joining Strings Using join() Method


    Strings can be joined with the join() string. The join() method provides a flexible
    way to concatenate strings. The syntax of join() method is,


    ```

    string_name.join(sequence)

    ```


    Here sequence can be string or list. If the sequence is a string, then join()
    function inserts string_name between each character of the string sequence and
    returns the concatenated string. If the sequence is a list, then join() function
    inserts string_name between each item of list sequence and returns the concatenated
    string. It should be noted that all the items in the list should be of string
    type.


    +   1. >>> date_of_birth = ["17", "09", "1950"]

    2. >>> ''''.join(date_of_birth)

    ''17:09:1950''

    3. >>> social_app = ["instagram", "is", "an", "photo", "sharing", "application"]

    4. >>> ''''.join(social_app)

    ''instagramis a photo sharing application''

    5. >>> numbers = [''123"]

    6. >>> characters = "amy"

    7. >>> password = numbers.join(characters)

    8. >>> password

    ''a123m123y''


    All the items in the list date_of_birth variable is of string type ①. In ② the
    string "" is inserted between each list item and the concatenated string is displayed.
    In the social_app list variable, all the list items are of string type ③. In ④,
    the join() method ensures a blank space is inserted between each item and the
    concatenated string is displayed. The variables numbers ⑤ and characters ⑥ are
    of string type. The value of "123" is placed between each character of "amy" string
    resulting in ''a123m123y''. The string value of "123" is inserted between an a
    and m between m and y is assigned to password string variable.


