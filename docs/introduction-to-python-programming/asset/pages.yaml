    # 1.5.2 Scientific Tools


    Scientific tools are essential for simulating and analyzing complex systems. The
    Python ecosystem consists of these core scientific packages, namely SciPy, NumPy,
    Jupyter, Spumpy and Matplotlib. Most of these are available under Berkeley Software
    Distribution (BSD) license and can be used without any restrictions. SciPy library
    is used for numerical integration and optimization. NumPy provides N-dimensional
    arrays which can be used to perform linear algebra, Fourier transform and other
    mathematical operations. Jupyter has revolutionized the way programming is done
    in Python. Jupyter provides an interactive web-based interface which can be invoked
    from a browser. Jupyter is used to write Python programs and create embeddable
    plots to visualize data. SymPy library is used to generate symbolic mathematics.
    Matplotlib is the oldest and most popular library for Python. With these tools,
    we have better chances of solving scientific problems and create working prototypes
    more quickly than any other competing tools.


    # 1.5.3 Machine Learning


    Machine Learning is an effective and adaptive tool to learn from experience and
    by a dataset. Many machine-learning algorithms and techniques have been developed
    that allow computers to learn. Machine Learning has its origin in Computer Science
    and Statistics. ScikitLearn is a well-known Machine Learning built on top of other
    Python scientific tools like NumPy, SciPy and Matplotlib. This allows Scikit-Learn
    to be easily extended to implement new models. Scikit-Learn supports various models
    for Classification, Regression, Clustering, Model Selection, Dimensionality Reduction
    and Preprocessing. Some of the advantages of Scikit-Learn are integration of parallelization,
    consistent APIs, good documentation and it is available under BSD license as well
    as commercial license with full support.


    # 1.5.4 Natural Language Processing


    Natural language processing is used to read and understand the text. Natural Language
    Toolkit (NLTK) is the popular library used for natural language processing in
    Python. NLTK has numerous algorithms to understand the text. NLTK has huge corpora
    of datasets and lexical resources like journals, chat logs, reviews and many.
    NLTK is available under Apache License V2.0.


    # 1.5.5 Data Analysis


    Pandas library changed the landscape of data analysis in Python altogether and
    is available under BSD license. Pandas is built on two important data structures,
    Series and DataFrame. It can hold any type of data like integers, floats, strings,
    objects and others. Each of the data in series is labeled after the index. DataFrame
    is a tabular data structure with labeled rows and columns similar Excel spreadsheet.
    In the real world, data is never in order and pandas can be used to fill missing
    data, reshaping of datasets, indexing, merging, and joining of datasets. Pandas
    can be used to read Com-Separated Values (CSV) files, Microsoft Excel, Structured
    Query Language (SQL) database and Hierarchical Data Format (HDF5) formats.'
