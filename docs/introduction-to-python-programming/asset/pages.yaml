  md: '# 2.4 Variables


    Variable is a named placeholder to hold any type of data which the program can
    use to assign and modify during course of execution. In Python, there is no need
    to declare a variable explicitly by specifying whether the variable is an integer
    or a float or any other type. To define a new variable in Python, we simply assign
    a value to a name. If a need for variable arises you need to think of a variable
    name based on the rules mentioned in the following subsection and use it in the
    program.


    # 2.4.1 Legal Variable Names


    Follow the below-mentioned rules for creating legal variable names in Python.


    +   * Variable names can consist of any number of letters, underscores and digits.

    * Variable should not start with a number.

    * Python Keywords are not allowed as variable names.

    * Variable names are case-sensitive. For example, computer and Computer are different
    variables.


    Also, follow these guidelines while naming a variable, as having a consistent
    naming convention helps in avoiding confusion and can reduce programming errors.


    +   * Python variables use lowercase letters with words separated by underscores
    as necessary to improve readability like this whats_up_are_you. Although this
    is not strictly enforced, it is considered a best practice to adhere to this.

    * Avoid naming a variable where the first character is an underscore. While this
    is legal in Python, it can limit the interoperability of your code with applications
    built by using other programming languages.

    * Ensure variable names are descriptive and clear enough. This allows other programmers
    to have an idea about what the variable is representing.


    # 2.4.2 Assigning Values to Variables


    The general format for assigning values to variables is as follows:


    ```

    variable_name = expression

    ```


    The equal sign (=) also known as simple assignment operator is used to assign
    values to variables. In the general format, the operand to the left of the = operator
    is the name of the variable and the operand to the right of the = is the expression
    which can be a value or any code snippet that results in a value. That value is
    stored in the variable on the execution of the assignment statement. Assignment
    operator should not be confused with the = used in algebra to denote equality.
    For example, enter the code shown below in interactive mode and observe the results.


    +   1. >>> number =100

    2. >>> miles =1000.0'
