  md: '# Introduction to Python Programming


    The protocol, such as a class consisting of the __enter__() and __exit__() methods,
    is known as the ''context management protocol,'' and the object that implements
    protocol is known as the ''context manager.'' The evaluation of the with statement
    in an object called a ''context manager'' supports the ''context management protocol.''
    The __enter__() method is executed when the control enters the code block inside
    the with statement context. It returns an object that can be used within the context.
    When the leaves the with block context, then the __exit__() method is called to
    clean up any resources used. Thus, the resources are allocated and deallocated
    when the program requires.


