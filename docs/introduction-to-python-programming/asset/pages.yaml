    3. >>> fish_weight_kg_dict

    (''white_shark'': 520, ''beluga'': 1571, ''greenland_shark'': 1400)


    The tuples can be converted to dictionaries by passing the tuple name to the dict()
    function. This is achieved by nesting tuples within tuples, wherein each nested
    tuple has two items in ①-②. The first item becomes the key and second item as
    its value when the tuple gets converted to a dictionary ③.


    The method items() in a dictionary returns a list of tuples where each tuple corresponds
    to a key:value pair of the dictionary. For example,


