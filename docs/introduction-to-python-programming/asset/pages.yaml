    # 4.4 The return Statement and void Function


    Most of the times you may want the function to perform its specified task to calculate
    a value and return the value to the calling function so that it can be stored
    in a variable and used later. This can be achieved using the optional return statement
    in the function definition. The syntax for return statement is:


    ```

    Keyword return [expression_list]

    ```


    If an expression list is present, it is evaluated, else None is substituted. The
    return statement leaves the current function definition with the expression_list
    (or None) as a return value. The return statement terminates the execution of
    the function definition in which it appears and returns control to the calling
    function. It can also return an optional value to its calling function.


    In Python, it is possible to define functions without a return statement. Functions
    this are called void functions, and they return None.


    > Functions without a return statement do return a value, albeit rather boring
    one. This value is called None (it is a built-in name) which stands for "nothing".
    Writing the value None is normally suppressed by the interpreter if it would be
    the only value written.


    If you want to return a value using return statement from the function definition,
    then you have to assign the result of the function to a variable. A function can
    return only a single value, but that value can be a list or tuple.


    > You shall learn more about lists and tuples in Chapters 6 and 8 respectively.'
