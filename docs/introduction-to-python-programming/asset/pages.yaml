    Comparison operators like <, <=, >, == and != are used to compare tuples. For
    example,


    +   1. >>> tuple_1 = (9, 8, 7)

    2. >>> tuple_2 = (9, 1, 1)

    3. >>> tuple_1 > tuple_2

