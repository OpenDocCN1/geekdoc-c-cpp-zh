    \ C3 linearization MRO for a class,\nStep 1: The linearization result for a base\
    \ class which derives from object class will be represented as a list with the\
    \ base class itself as the first item and object class as the second item.\n\n\
    Step 2: Inside merge part, replace L(Base_Class_1), L(Base_Class_2), ..., L(Base_Class_n)\
    \ with their respective linearization results.\nStep 3: Inside merge part, check\
    \ if the class in the first position in the first list is found as a Head or a\
    \ Tail in all the other list sequences.\n\nStep 4: If the class in the first position\
    \ in the first list is a Head, remove it from all the list sequences and add it\
    \ to the end of the list in the first part of linearization.\nStep 5: If the class\
    \ in the first position in the first list is a Tail, skip the first list and move\
    \ to the next list sequence.\nStep 6: If the class in the first position in the\
    \ next list is a Head, remove it from all the list sequences it is present and\
    \ add it to the end of the list in the first part of linearization. If the class\
    \ in the first position in the next list is a Tail, move on to the next list sequence\
    \ and again check whether the class present in the first position is Head or Tail.\
    \ If it is Head, grab it or else move on to the next list sequence and so on.\n\
    \nRepeat steps 3 to 6 until all the classes are removed from all the list sequences\
