    # 6.3.1 Modifying Items in Lists


    Lists are mutable in the list items can be modified after you have created a list.
    You can modify a list by replacing the old item with a new item in the place and
    without assigning the list to a completely new variable. For example,


    +   1. >>> fauna = [''pronhorn'', ''alligator'', ''bison'']

    2. >>> fauna[0] = ''groundhog''

    3. >>> fauna

    [''groundhog'', ''alligator'', ''bison'']

    4. >>> fauna[2] = ''skunk''

    5. >>> fauna

    [''groundhog'', ''alligator'', ''skunk'']

    6. >>> fauna[-1] = ''beaver''

    7. >>> fauna

    [''Groundhog'', ''alligator'', ''beaver'']


    You can change the string item at index 0 from ''pronhorn'' to ''groundhog'' as
    shown in ②. When you display fauna, the list items will be different ③. The item
    at index 2 is changed from ''bison'' to ''skunk'' ➮. You can also change the value
    of an item by using a negative index -1 ④ which corresponds to the positive index
    number of 2. Now "skunk" is replaced with "beaver" ⑟.


    When you assign an existing list variable to a new variable, an assignment (=)
    on lists does not make a new copy. Instead, assignment makes both the variable
    names point to the same list in memory. For example,


