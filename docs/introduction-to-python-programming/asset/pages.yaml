  md: "# Strings 125\n\nWith string slicing, you can access a sequence of characters\
    \ by specifying a range of index numbers separated by a comma. String slicing\
    \ returns a sequence of characters beginning at start and extending up to not\
    \ including end. The start end indexing values have to be integers. String slicing\
    \ can be done using either positive or negative indexing:\n\n```\nhealthy_drink\n\
    g r c e n t e a\n0 1 2 3 4 5 6 7 8 <-- Index\n```\n\n+   1. >>> healthy_drink\
    \ = 'green tea'\n2. >>> healthy_drink[0:3]\n   'gre'\n3. >>> healthy_drink[5]\n\
    \   'green'\n4. >>> healthy_drink[6]\n   'tea'\n5. >>> healthy_drink[:]\n   'green\
    \ tea'\n6. >>> healthy_drink[6:4]\n   ''\n7. >>> healthy_drink[6:20]\n   'tea'\n\
    \nA substring is created when slicing the strings, which is basically a string\
    \ that already exists within another string. A substring is any sequence of characters\
    \ that is contained in a string. The string \"green tea\" is assigned to healthy_drink\
    \ variable ① and a sequence of characters or a substring is extracted from the\
    \ (0th Index) ②. In string slicing, start index value (including) is where slicing\
    \ starts and (2nd Index) ② end index value (excluding) is where the slicing ends.\
    \ If the start index is omitted, the slicing starts from the first index number\
    \ (0th Index) up to the end index (excluding) in the string. ③ starting from 0th\
    \ index to 4th is indexed. If the end index is omitted, slicing starts from the\
    \ start index and goes up to the end of the string index. Sublicing from 6th index\
    \ to the end of the string is displayed ④. If both the start and end values are\
    \ omitted then the entire string is displayed ⑤. If the start index is equal to\
    \ or higher than the end index then it returns an empty string ⑥. If the end index\
    \ number is beyond the end of string, it stops at the end of the string ⑦. Slicing\
    \ can also be done using the negative integer numbers.\n\n```\nhealthy_drink\n\
    g r e e n t e a\n-9 -8 -7 -6 -5 -4 -3 -2 -1 <-- Index\n```\n\nThe negative index\
