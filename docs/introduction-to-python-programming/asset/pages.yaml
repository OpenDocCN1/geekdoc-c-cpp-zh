  md: '# 6


    # Lists


    | AIM |

    | Understand the role of lists in Python in storing multiple items of different
    types and perform manipulations using various methods. |


    LEARNING OUTCOMES

    At the end of the chapter, you are expected to


    +   - Create and manipulate items in lists.

    - Comprehend Indexing and slicing in lists.

    - Use methods associated with lists.

    - Using lists as arguments in functions.

    - Use for loop to access individual items in lists.


    Most of the times a variable can hold a single value. However, in many cases,
    you need to assign more than that. Consider a Forest scenario where animals belonging
    to different types of families live. Some of them like Lion, Tiger, Cheetah are
    Carnivorous and others like Monkeys, Elephants and Buffalos are Herbivorous. If
    you want to define this computationally, then you have to create multiple variables
    to represent each animal belonging to a particular animal family which may not
    make sense. Instead, you can combine all the animals belonging to the particular
    animal family under one variable and then use this variable for further manipulation.


    You can think of the list as a container that holds a number of items. Each element
    or value that is inside a list is called an item. All the items in a list are
    assigned to a single variable. Lists avoid having a separate variable to store
    each item which is less efficient and more error prone when you have to perform
    some operations on these items. Lists can be simple or nested lists with varying
    types of values. Lists are one of the most flexible data storage formats in Python
    because they can have values added, removed, and changed.


    # 6.1 Creating Lists


    Lists are constructed using square brackets [ ] wherein you can include a list
    of items separated by commas.'
