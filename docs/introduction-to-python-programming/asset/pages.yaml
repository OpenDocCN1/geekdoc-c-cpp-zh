    indentation and the first indented statement marks the end. You don''t need to
    use the == operator explicitly to check if a variable''s value evaluates to True
    as the variable name can itself be used as a condition. For example:


    +   1. >>> 20 > 10:

    2. ... print(f"20 is greater than 10")'
