  md: 'programs and a set of instructions are all terms often used to describe software.
    The software can be categorized into three categories,


    System software includes device drivers, operating systems (OSs), compilers, disk
    matters, text editors and utilities helping the computer to operate more efficiently.
    System software serves as a base for application software. It is also responsible
    for managing hardware components.


    Programming software is a set of tools to aid developers in writing programs.
    The various tools available are compilers, debuggers, interpreters and text editors.
    Application software is introduced to perform tasks. Examples of application software
    include office suites, gaming applications, database systems and educational software.
    Application software can be a single program or a collection of small programs.
    This type of software is what consumers most typically think of “Software”.


    There are myriad of areas where programs are used like supermarkets, banks, insurance
    industries, process control, hospitals, offices, government institutions, education,
    research, telecommunication, transport industry, police, defense, multimedia applications,
    entertainment systems, library services and many more.


    # 1.2 Programming Languages


    Computers cannot write programs on their own as they don’t understand human needs
    unless we communicate with the computer through programming languages. A programming
    language is a computer language engineered to communicate instructions to a machine.
    Programs are created through programming languages to control the behavior and
    output of a machine through accurate algorithms, similar to the human communication
    process.


    # 1.2.1 Machine Language


    Machine language, also called machine code, is a low-level computer language that
    is designed to be directly understandable by a computer and it is the language
    into which all programs must be converted before they can run. It is entirely
    composed of binary, 0s and 1s. In machine language, all instructions, memory locations,
    numbers and characters are represented in 0s and 1s. For a typical piece of machine
    language might look like, 0000001000000000.


    The main advantage of machine language is that it can run and execute very fast
    as the code will be directly executed by a computer and the programs efficiently
    utilize memory. Some of the disadvantages of machine language are,


    +   * Machine language is almost impossible for humans to use because it consists
    of numbers.

    * Machine language programs are hard to maintain and debug.

    * Machine language has no mathematical functions available.

    * Memory locations are manipulated directly, requiring the programmer to keep
    track of every memory location.'
