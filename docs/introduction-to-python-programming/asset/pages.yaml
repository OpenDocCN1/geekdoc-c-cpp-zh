    are read-only views and cannot be edited directly. If you want to convert dict_keys,
    dict_values, and dict_items data returned from keys(), values(), and items() methods
    to a true list then pass list, as returned values. Whenever there is a modification
    to the dictionary, it is reflected in the views of these data types. For example,


    +   1. >>> list(box_office_billion.keys())

    [''avatar'', ''titanic'', ''starwars'', ''harrypotter'', ''avengers'']

    2. >>> list(box_office_billion.values())

    [2009, 2015, 2011, 2012]

    3. >>> list(box_office_billion.items())

    (''avatar'', 2009), (''titanic'', 2017), (''starwars'', 2015), (''harrypotter'',
    2011), (''avengers'', 2012)]


    The dict_keys, dict_values, and dict_items returned from keys(), values(), and
    items() are converted to true list using the list() function ①⇃.


    # 7.4.1 Populating Dictionaries with key:value Pairs


    One of the common ways of populating dictionaries is to start with an empty dictionary
    {}, then use the update() method to assign a value to the key using assignment
    operator. If the key does not exist, then the key:value pairs will be created
    automatically and added to the dictionary.


    For example,


    +   1. >>> countries = {}

    2. >>> countries.update("Asia":"India"})

    3. >>> countries.update("Europe":"Germany"})

    4. >>> countries.update("Africa":"Sudan"})

    5. >>> countries

    [''Asia'': ''India'', ''Europe'': ''Germany'', ''Africa'': ''Sudan'']


