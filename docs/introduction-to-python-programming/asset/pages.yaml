  md: '# TABLE 4.1


    A Few Built-in Functions in Python


    | Function Name | Syntax | Explanation |

    | --- | --- | --- |

    | abs() | abs(x)

    where x is an integer or floating-point number. | The abs() function returns the
    absolute value of a number. |

    | min() | min(arg_1, arg_2, ..., arg_n) | The min() function returns the smallest
    of two or more arguments. |

    | max() | max(arg_1, arg_2, ..., arg_n)

    where arg_1, arg_2, ..., arg_n are the arguments. | The max() function returns
    the largest of two or more arguments. |

    | divmod() | divmod(a, b)

    where a and b are numbers representing numerator and denominator. | The divmod()
    function takes two numbers as arguments and return a pair of numbers consisting
    of their quotient and remainder. example, if a and b are integers, the result
    is the same as (a / b, % b). if either a or b is a floating-point number, then
    the result is (q, % b), where q is the quotient of the quotient. |

    | pow() | pow(x, y)

    where x and y are numbers. | The pow(x, y) function returns x to the power y which
    is equivalent to using the power operator: x**. |

    | len() | len(s)

    where s may be a string, byte, list, tuple, dictionary or set. | The len() function
    returns the length or the number of items in an object. |


    For example,


