    # 7.4 Dictionary Methods


    Dictionary allows you to store data in key:value format without depending on indexing.
    You can get a list of all the methods associated with dict (TABLE 7.2) by passing
    the dict to dir().


    ```

    1 >>> dir(dict)

    __class__'',''__contains__'',''__delattr__'',''__delitem__'',''__dir__'',''__doc__'',''__eq__'',''__format__'',''__ge__'',''__getattr__'',''__getitem__'',''__gt__'',''__hash__'',''__init__'',''__init_subclass__'',''__iter__'',''__le__'',''__len__'',''__lt__'',''__ne__'',''__new__'',''__reduce__'',''__reduce_ex__'',''__repr__'',''__setattr__'',''__setitem__'',''__sizeof__'',''__str__'',''__subclasshook__'',''__clear__'',''__copy__'',''__fromkeys'',''__get__'',''__items__'',''__keys__'',''pop__'',''popitem__'',''__setdefault__'',''update__'',''__values'']

    ```


    Various methods associated with dict are displayed ⓵.


    # TABLE 7.2

    Various Dictionary Methods


    | Dictionary Methods | Syntax | Description |

    |---|---|---|n| clear() | dictionary_name.clear() | The clear() method removes
    all key:value pairs from the dictionary. |

    | fromkeys() | dictionary_name.fromkeys(sequence, value) | The fromkeys() method
    creates a new dictionary from the sequence of elements with a value provided by
    the user. |

    | get() | dictionary_name.get(key, default) | The get() method returns the value
    associated with the specified key in the dictionary. If key is not present then
    it returns the default value. If default is not given, it raises a KeyError. |

    | items() | dictionary_name.items() | The items() method returns a new view of
    dictionary''s keys and value pairs as tuples. |

    | keys() | dictionary_name.keys() | The keys() method returns a new view of all
    the keys in the dictionary. |

    | pop() | dictionary_name.pop(key, default) | The pop() method removes the key
    from the dictionary and returns its value. If the key is not present, then it
    returns the default value. If not, it results in KeyError. |

    | popitem() | dictionary_name.popitem() | The popitem() method removes and returns
    an arbitrary (key, value) pair from the dictionary. If the dictionary is empty,
    then calling popitem() results in KeyError. |

    | setdefault() | dictionary_name.setdefault(key, default) | The setdefault() method
    returns a value for the key in the dictionary. If key is not present, then insert
    the key into the dictionary with a default value and returns the default. If key
    is present, this method never raises a KeyError. |

    | update() | dictionary_name.update(other) | The update() method updates the dictionary
    with the key:value pairs from other dictionary and returns None. |

    | values() | dictionary_name.values() | The values() method returns a new view
    of all the values in the dictionary. |


    Note: Replace the word "dictionary_name" mentioned in the syntax with your actual
    dictionary name in your code.'
