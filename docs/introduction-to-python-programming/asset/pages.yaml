    # 12.2.3 Using XML with Python


    Extensible Markup Language (XML) document is a simple and flexible text format
    that is used to exchange wide variety of data on the Web and elsewhere. An XML
    document is a universal format for data on the Web. XML allows developers to easily
    describe and deliver rich, structured data from any application in a standard,
    consistent way. XML documents have an xml extension.


    Why Use XML?

    Developers use XML format for following reasons:


    +   - Reuse – Contents are separated from Presentation, which enables rapid creation
    of documents and content reuse.

    - Portability – XML is an international, platform-independent standard based on
    ASCII text, so developers can safely store their documents in XML without being
    tied to any vendor.

    - Interchange – XML is a core data standard that enables XML-aware applications
    to interoperate and share data seamlessly.

    - Self-describing – XML is a human-readable format that users can easily view
    and understand.


    Elements form the backbone of XML documents, creating structures which you can
    manipulate with programs. Elements identify sections of content and are built
    using tags that identify the name, start, and end of element. All elements must
    have names. Elements are case-sensitive and must start with a letter or underscore.
    An element name can contain letters, digits, hyphens, underscores, and periods.
    An element generally includes the start and end tags, and everything in between.

    Elements provide a way of indicating which element each section of content belongs
    to in XML and is done by means of tags. Tags establish boundaries around the tag
    consists of the element name between the left-angle bracket (<) and the right-angle
    bracket (>). A tag is used to identify where a element starts, and where the element
    ends. For an called element_name, the start tag will normally look like <element_name>.
    The corresponding tag for this element is </element_name>. There are no predefined
    tags in XML language. The tags in an XML document are not part of any XML standard.
    These are thought about by the developer who handles the XML document.

    Elements can also contain attributes, which have a name and a value and are used
    to provide additional information about your content. An element''s attributes
    are written inside the start tag for that element and take the form attribute_name="attribute_value".
    Attribute values in XML must be enclosed in either single or double quotes. Double
    quotes are traditional.

    You must follow these syntax rules when you create an XML document:


    +   1. All XML elements must have a closing tag.

    It is illegal to omit the closing tag when you are creating XML syntax. XML elements
    must have a closing tag.


    ```

    Incorrect:

    <movie>Maze Runner.


    Correct:

    <movie>Maze Runner.</movie>

    ```'
