  md: '# Regular Expression Operations 269


    Special Character → $\$

    Description → Matches the end of the string or just before the newline at the
    end of the string.

    Example → The pattern t$ does not match the character ''t'' in the string ''eater''
    but does it in the string ''eat''.


    Special Character → *

    Description → Matches the preceding expression 0 or more times.

    Example → The pattern bo* matches the substring ''boooo'' in the string ''A ghost
    booooed'' and matches the character ''b'' in the string ''A bird warbled'' but
    nothing in the string ''A goat grounded''.


    Special Character → +

    Description → Matches the preceding expression 1 or more times.

    Example → The pattern a+ matches the character ''a'' in the string ''candy'' and
    all the ''a''s in ''aaaaaaa'', but nothing in ''cndy''.


    Special Character → ?

    Description → Matches the preceding expression 0 or 1 time.

    Example → The pattern e? matches the substring ''el'' in the string ''angel''
    and matches the substring ''le'' in the string ''angle'' and also the character
    ''l'' in the string ''oslo''. If used immediately after any of the special characters
    *, +, or (|), the special character non-greedy (matching as many characters as
    possible), as opposed to the default, which is greedy. For example, applying the
    pattern \d+ to the string ''123abc'' matches the substring ''123''. But applying
    the pattern \d? to that same string matches only the character ''1''.


    Special Character → \d

    Description → Matches any decimal digit [0-9]

    Example → The pattern \d or [0-9] matches the character ''2'' in the string ''B2
    is the suite number.


    Special Character → \D

    Description → Matches any non-digit character. Equivalent to [^0-9].

    Example → The pattern \D or [^0-9] matches the character ''B'' in the string ''B2
    is the suite number.


    Special Character → \w

    Description → Matches a "word" character and it can be a letter or digit or underscore.
    It is equivalent to [a-zA-Z0-9_]. Note that "word" is the mnemonic for this, it
    only matches a single word character, not a whole word.'
