    Introduction to Python Programming


    # TABLE 9.4


    Various Methods of os Module


    | Methods | Syntax | Description |

    | --- | --- | --- |

    | chdir() | os.chdir(path) | This method changes the current working directory
    to *path*. |

    | getcwd() | os.getcwd(path) | This method returns a string representing the current
    directory. |

    | mkdir() | os.mkdir(path) | This method creates the directory named *path*. If
    the directory already exists, *FileExistsError* is raised. |

    | remove() | os.remove(path) | This method removes (the) path. If the path is
    a directory, OSError is raised. In Windows, attempting to remove a file that is
    in use causes an exception to be raised; in Linux, the directory entry is removed
    but the storage allocated to it is not available until the file is no longer in
    use. |

    | rmdir() | os.rmdir(path) | This method removes a directory if it is empty; otherwise,
    OSError is raised. |

    | walk() | os.walk(top, topdown=True) | This method generates the names in a directory
    tree by walking the tree either top-down or bottom-up. For each directory rooted
    at top (including itself), it yields a 3-tuple (dirpath, dirnames, filenames).
    The *dirpath* is a string, the path to the directory. The *dirnames* is a list
    of the names of the subdirectories in directory (excluding ''.'' and ''..'').
    The *filenames* is a list of the names of the non-directory files in directory.
    Note that the list contains no path components. To get a full path (which begins
    with top) to a file or directory, use *os.path.join(dirpath, name).* |

    | rename() | os.rename(old_name, new_name) | This method is used to rename the
    file from *old_name* to *new_name*. |

    | listdir() | os.listdir(path=''.'') | This method returns a list containing the
    names of the entries in the given path. The list is in arbitrary order and does
    not include the special entries ''.'' and ''..'' even if they are present in the
    directory.


    *Note:* The path argument can be passed as either strings or bytes.


    Various methods of the *os.path* module are shown in TABLE 9.5.


