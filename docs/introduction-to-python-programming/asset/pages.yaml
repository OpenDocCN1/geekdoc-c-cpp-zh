    # 11.7 Encapsulation


    All the programs in this chapter employ the concept of Encapsulation. Encapsulation
    is one of the fundamental concepts in object-oriented programming (OOP). Encapsulation
    is the process of combining variables that store data and methods that work on
    those variables into a single unit class. In Encapsulation, the variables are
    not accessed directly; it is accessed through the methods present in the class.
    Encapsulation ensures that the object''s internal representation (its state and
    behavior) are hidden from the rest of the application. Thus, encapsulation makes
    the concept of data hiding possible. In order to understand the concept of data
    hiding, imagine if some programmer is able to access the data in a variable from
    outside (unencapsulated) code then there would be a very high danger of them writing
    their own (not correct) data. This would, at the very least, lead to code duplication
    (i.e., useless efforts) and to inconsistencies if the implementations are stored
    in a variable everybody MUST use the methods that are provided, so that they are
    for everybody.


    An application using a class does not know its internal workings or how it is
    implemented. The program simply creates an object and it to invoke the methods
    of that class. Abstraction is a process where you show only "relevant" variables
    that are used to access data and "hide" implementation details of the user. Consider
    your mobile phone (FIGURE 11.6); you just need to know which buttons are to be
    pressed to send a message or make a call. What happens when you press a button,
    how your messages are sent, and how your calls are connected are all abstracted
    away from the user.'
