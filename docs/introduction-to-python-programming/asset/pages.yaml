    # 12.3.3 NumPy Arrays Creation with Initial Placeholder Content


    Often, the elements of an array are initially unknown, but its size is known.
    NumPy offers several functions to create arrays with initial placeholder content
    (TABLE 12.3). These minimize the necessity of growing arrays, an expensive operation.


    # TABLE 12.3

    NumPy Arrays Creation Functions


    | Function Name | Description |

    | --- | --- |

    | np.zeros() | Creates an array of zeros |

