    A set is a collection of unique items. Duplicate items are removed from the basket
    ① Even though we have provided "orange" and "apple" items twice, the set will
    contain only one item of "orange" and "apple." You can test for the presence of
    an item in a set using in and not in membership operators ③–④. Unique items in
    set a and b are displayed ⑤–⑥. Letters in set a, but not in set b, are printed
    ⑼. Letters presented in set a, set b, or both are printed ⑮. Letters present in
    set a or set b, but not both, are printed ⑱. Total number of items in the set
    basket is found using the len() function ⑲. The sorted() function returns a new
    sorted list from items in the set ⑨


    > Sets are mutable. Indexing is not possible in sets, since set items are unordered.
    You cannot access or change an item of the set using indexing or slicing.


