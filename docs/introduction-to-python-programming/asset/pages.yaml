  md: '# Program 6.8: Find Mean, Variance and Standard Deviation of List Numbers


    ```

    1. import math

    2. def statistics(list_items):

    3. mean = sum(list_items)/len(list_items)

    4. print(f"Mean is [mean]")

    5. variance = 0

    6. for item in list_items:

    7. variance += (item-mean)**2

    8. variance /= len(list_items)

    9. print(f"Variance is [variance]")

    10. standard_deviation = math.sqrt(variance)

    11. print(f"Standard Deviation is [standard_deviation]")

    ```


    ```

    12. def main():

    13. statistics([1, 2, 3, 4])

    14. if __name__ == "__main__":

    15. main()

    ```


    OUTPUT

    Mean is 2.5

    Variance is 1.25

    Standard Deviation is 1.11803398749895


    Mean is calculated as the sum of all items in the list / total number of items
    in the list ③. Variance is defined as the average of the differences from the
    mean. Steps to find the variance is to first calculate the mean ③-④, then traverse
    through each element in the list and subtract it with mean and square the result
    which is also called the squared difference. Finally, find the mean of those squared
    differences ⑥-⑧ to get the variance ⑨. Standard deviation is the square root of
    variance ⟟⑪.


