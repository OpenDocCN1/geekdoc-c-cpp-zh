  md: "# 396\n\n# Introduction to Python Programming\n\nconcatenated are retained\
    \ as it is in the concatenated dataFrame ⑦. If you want to associate specific\
    \ keys with each of the pieces of the chopped up DataFrame, then you can do this\
    \ by using the `keys` argument ⑧. You can extract chunk of DataFrame by passing\
    \ the key associated with an index to `.loc[] method ⑨. A useful shortcut to the\
    \ concat function is the `append()` instance methods on Series and DataFrame �.\n\
    \nA `merge()` function combines columns from multiple DataFrames and returns a\
    \ new DataFrame object. These columns must be found in all the DataFrames that\
    \ are to be merged. The syntax for merge() function is:\n\n```\ndf_obj = pd.merge(left_df,\
    \ right_df, how='inner', on=None)\n```\n\nwhere `left_df` is a DataFrame object,\
    \ `right_df` is another DataFrame object, `on` is the names of column labels that\
    \ you want to merge. For a `how` argument, you can assign any of the values 'left',\
    \ 'right', 'outer', or 'inner'. The default value is 'inner'. The merge() function\
    \ returns a DataFrame object.\nA merge() function is a means for combining columns\
    \ from a `left_df` DataFrame and `right_df` DataFrame using data elements that\
    \ are common to each other. The how argument in the merge() function specifies\
    \ how to determine which keys are to be included in the resulting DataFrame. The\
    \ data elements of keys may not be found in both the left_df and right_df DataFrame\
    \ objects while carrying out the merge operation; if not then NaN will be assigned\
    \ in the merged DataFrame.\nThe pandas merge() method specifies four types of\
    \ merge operations: 'left', 'right', 'outer' and 'inner'. Let's understand each\
    \ of these merge operations in detail.\nLeft Merge $\rightarrow$ In the merge\
    \ operation, preference is given to the key columns of left_df DataFrame. If any\
    \ of the data elements in the left_df DataFrame key columns are not present in\
    \ the right_df DataFrame key columns, then those rows are also retained. But for\
    \ the rows of the data elements of the right_df DataFrame key columns, which are\
    \ not as same as that of the data elements of left_df DataFrame key columns, NaN\
    \ is assigned (FIGURE 12.4a).\n\n![](img/1a4c4d9415149052170c8f902baa9036_416_0.png)\n\
    \nFIGURE 12.4\nPictorial representation of various types of merge operation. (a)\
    \ Left merge; (b) Right merge; (c) Inner merge and (d) Outer merge."
