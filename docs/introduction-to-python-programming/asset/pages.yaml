- img_proc: true
  md: 'The purpose of the SDLC process is to provide help in producing a product that
    is cost effective and of high quality. Different stages of the Software Development
    Life Cycle are,


    Planning of Project. At this stage, the total number of resources required to
    implement this project is determined by estimating the cost and size of the software
    project.


    Analysis and Requirement Gathering. At this stage, the maximum amount of information
    is collected from the client about the kind of software product he desires. Different
    questions are posed to the client like: Who is going to use the product? What
    kind of data is given as input to the product? What kind of data is expected as
    output from the product? Questionnaires enable the development team to gather
    overall specification of the product in good detail. The software development
    team analyzes all these requirements of the client, keeping in mind the design
    constraints, coding standards and its validity. The aim of analysis and requirements
    gathering stage is to understand the requirements of the client by all the members
    of the software development team and see how these requirements can be implemented.


    Design. At this stage, the software development team analyzes whether the software
    can be implemented with all the features specified by the client. Also, the development
    team has to convince the client about the financial and technological viability.
    The software development team has to select the programming language and the platform
    to implement the software that is best suited to satisfy the requirements of the
    client. Software design helps the development team to define and understand the
    overall architecture required for the software product and the approach is captured
    in a design document.


    Development. At this stage, the development team starts building the software
    according to the design document. The development team translates the design into
    set of programs that adhere to coding standards of their organization. Coding
    is done by dividing the specification mentioned in the design document into different
    modules to produce a working and reliable product. This is the longest phase of
    SDLC.


    Testing. At this stage, the software product is tested against the requirements
    specified by the client. The testing team is mainly responsible for checking the
    system to weed out bugs and to verify that the software product is working as
    expected. Any bugs that are found in the process or any shortcomings in the features
    of the software product is conveyed to the development team to rectify. This is
    the last stage of overall software development before handing over the product
    to the client.


    Deployment. At this stage, the product is released to the client after testing
    the product thoroughly. The client needs to be trained in using the software and
    documents should be provided instructions on how to operate the software in a
    user-friendly language.


    Maintenance. The process of taking care of the developed and deployed software
    product is known as Maintenance. When the customer starts using the deployed product,
    unforeseen problems may come up and these need to be solved. Also, new requirements
    may come up at the client''s workplace and the software needs to be updated and
    upgraded to accommodate these changes.'
