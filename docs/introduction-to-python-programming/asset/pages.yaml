  md: "# 8.8 Using zip() Function\n\nThe zip() function makes a sequence that aggregates\
    \ elements from each of the iterables (be zero or more). The syntax for zip()\
    \ function is\n\n```\nzip(*iterables)\n```\n\nAn iterable can be a list, string,\
    \ or dictionary. It returns a sequence of tuples, where the i-th tuple contains\
    \ the i-th element from each of the iterables. The aggregation of elements stops\
    \ when the shortest iterable is exhausted. For example, if you pass two iterables\
    \ with containing two items and containing five items, then the zip() function\
    \ returns a sequence of tuples. With a single iterable argument, it returns an\
    \ iterator of one tuple. With no arguments, it returns an empty iterator.\n\n\
    ```\n>>> x = [1, 2]\n>>> y = [4, 5, 6]\n>>> zipped = zip(x, y)\n>>> list(zipped)\n\
    [(1, 4), (2, 5), (3, 6)]\n```\n\nHere zip() function is used to zip two iterables\
    \ of list type ①-④.\nnThe entries are paired with the\nzip() function. For example,\n\
    \nTo loop over two or more sequences at the same time, the entries are paired\
    \ with the\n\n```\n>>> questions = ('name', 'quest', 'favorite color')\n>>> answers\
    \ = ('lancelot', 'the holy grail', 'blue')\n>>> for q, a in zip(questions, answers):\n\
    \    print(f'What is your {q}? It is {a}.')\n```\n\n# OUTPUT\n\nWhat is your name?\
    \ It is lancelot.\nWhat is your quest? It is the holy grail.\nWhat is your favorite\
    \ color? It is blue.\n\nSince zip() function returns a tuple, you can use a for\
    \ loop with multiple iterating variables to print tuple items ①-③.\n\n# 8.9 Sets\n\
    \nPython also includes a data type for sets. A set is an unordered collection\
    \ with no duplicate entries. Primary uses of sets include membership testing and\
    \ eliminating duplicate entries. Sets also support mathematical operations, such\
    \ as union, intersection, difference, and symmetric difference.\n\nCurly braces\
    \ { } or the set() function can be used to create sets with, comma-separated list\
    \ of items inside curly brackets []. Note: to create an empty set you have to\
    \ use set() and not {} as the latter creates an empty dictionary."
