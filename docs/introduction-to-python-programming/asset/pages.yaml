  md: '# Introduction to Python Programming


    The syntax for creating a dictionary is,


    ```

    dictionary_name = {key_1:value_1, key_2:value_2, key_3:value_3, .........,key_n:value_n}

    ```


    For example,


    +   1. >>> fish = {''g'': ''goldfish'', ''s'': ''shark'', ''n'': ''needfish'',
    ''b'':''barramundi'', ''m'': ''mackerel''}

    2. >>> fish


    ```

    {g'': ''goldfish'', ''s'': ''shark'', ''n'': ''needfish'', ''b'': ''barramundi'',
    ''m'': ''mackerel''}

    ```


    Placing a comma-separated list of key:value pairs within the curly braces adds
    initial key: value pairs to the dictionary. This is also the way dictionaries
    can be either a string or are written on output 2. The keys in the dictionary
    fish are ''g'', ''s'', ''n'', ''b'', and ''m'' and the values associated with
    these keys are ''goldfish'', ''shark'', ''needfish'', ''barramundi'', and ''macker''
    (FIGURE 7.1). Each of the keys and values here is of string type. A value in the
    dictionary can be of any type including string, number, list, or dictionary itself.


    ![](img/1a4c4d9415149052170c8f902baa9036_196_0.png)


    FIGURE 7.1

    Demonstration of key:value Pairs.


    Dictionary keys are immutable type and can be a string or a number. Since lists
    can be modified in place using index assignments, slice assignments, or methods
    like append() and extend(), you cannot use lists as keys. Duplicate keys are not
    allowed in the dictionary.


    ![](img/1a4c4d9415149052170c8f902baa9036_196_1.png)'
