  md: "Out of these, the split step is the most straightforward. In fact, in many\
    \ situations,\nmay wish to split the data set into groups and do something with\
    \ those groups.\n\n2. In the apply step, we might wish to do one of the following:\n\
    \nAggregation: compute a summary statistic (or statistics) for each group. For\
    \ example,\n\n```\nCompute group sums or means.\n```\n\n```\nCompute group sizes/counts.\n\
    ```\n\nTransformation: perform some group-specific computations and return a like-\n\
    indexed object. For example,\n\nStandardize data (zscore) within a group.\n\n\
    Filling NAs within groups with a value derived from each group.\n\nFiltration:\
    \ discard some groups, according to a group-wise computation that evalu-\nTrue\
    \ or False. For example,\n\nDiscard data that belong to groups with only a few\
    \ members.\n\nFilter data based on the group sum or mean.\n\n+   3. Some combination\
    \ of the above: GroupBy will examine the results of the apply step\nand return\
    \ a sensibly combined result if it does not fit into either of the above\n categories.\n\
    \nFor example,\n\n```\n>>> import pandas as pd\n>>> cars_data = {'Company':['General\
