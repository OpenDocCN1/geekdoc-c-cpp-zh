    Even though each of these methods in the classes have the same name, their implementation
    details are different. Polymorphic behavior allows you to specify common methods
    in a base class and implement them differently in other derived classes. In this
    program, we defined two classes, Beetle ⑊ and Car ⑋, inherited from vehicle class,
    and provided their own implementation of vehicle_model() on top of vehicle_model()
    method found in Vehicle class ①. Notice that all the classes have vehicle_model()
    method but they are implemented differently. The method vehicle_model() is polymorphic,
    as these methods have the same name but belong to different classes and are executed
    depending on the object. The behavior of the method belonging to different classes
    is based on the type of object.


