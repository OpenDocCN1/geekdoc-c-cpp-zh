    # 11.8.2 Using super() Function and Overriding Base Class Methods


    In a single inheritance, the built-in super() function can be used to refer to
    base classes without naming them explicitly, if you need to access the data attributes
    from the base class in addition to the data attributes being specified in the
    derived class __init__() method, then you must explicitly call the base class
    __init__() method using super() yourself, since that will not happen automatically.
    However, if you do not need any data attributes from the base class, then no need
    to use super() function to invoke base class __init__().


    The syntax for using super() in derived class __init__() method definition looks
    like this:


    ```

    super().__init__(base_class_parameter)

    ```


    Its usage is shown below.


    ```

    class DerivedClassName(BaseClassName):

    def __init__(self, derived_class_parameter, base_class_parameter)

    super().__init__(base_class_parameter)

    self.derived_class_instance = derived_class_parameter

    ```


    The derived class __init__() method contains its own parameters along with the
    parameters specified in the __init__() method of using super(). No need to specify
    self when invoking base class __init__() method. base_class_parameters specified
    in __init__() method of the derived class to any data attributes is the same taken
    care of in the __init__() method of base class.


