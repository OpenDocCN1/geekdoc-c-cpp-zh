  md: "# Dictionaries 177\n\nIn dictionaries, the keys and their associated values\
    \ can be of different types.\nFor example,\n\n+   1. >>> mixed_dict = {\"portable\"\
    :\"laptop\", 9:11, 7:\"julius\"\n2. >>> mixed_dict\n   {'portable': 'laptop',\
    \ 9: 11, 7: 'julius'}\n3. >>> type(mixed_dict)\n   <class 'dict'>\n\nIn the dictionary,\
    \ mixed_dict, keys and their associated values are all of different types. For\
    \ numbers as dictionaries, it will not start from zero and it can be of any number.\
    \ You can determine the type of mixed_dict by passing the variable name as an\
    \ argument to type() function. In Python, the dictionary type is called dict.\n\
    \nYou can create an empty dictionary by specifying a pair of curly braces and\
    \ without any key:value pairs. The syntax is,\n\n```\ndictionary_name = {}\n```\n\
    \nFor example,\n\n+   1. >>> empty_dictionary = {}\n2. >>> empty_dictionary\n\
    \   {}\n3. >>> type(empty_dictionary)\n   <class 'dict'>\n\nAn empty dictionary\
    \ can be created as shown in ⊕ and empty_dictionary is of dict type ③. In dictionaries,\
    \ the order of key:value pairs does not matter. For example,\n\n+   1. >>> pizza\
    \ = {\"pepperoni\":3, \"calzone\":5, \"margherita\":4}\n2. >>> fav_pizza = {\"\
    margherita\":4, \"pepperoni\":3, \"calzone\":5}\n3. >>> pizza == fav_pizza\n \
    \  True\n\nThe dictionaries pizza and fav_pizza have the same key:value pairs\
    \ but in a different order ①-②. If you compare these two dictionaries it returns\
    \ Boolean True value ③. This indicates that the ordering of key:value pairs does\
    \ not matter in dictionaries. Slicing in dictionaries is not allowed since they\
    \ are not ordered like lists.\n\n![](img/1a4c4d9415149052170c8f902baa9036_197_0.png)\n\
    \nPrior to Python 3.6 version, the execution of dictionary statements resulted\
    \ in an unordered output of key:value pairs. However, starting from Python 3.6\
    \ version, the output of dictionary statements is ordered key:value pairs. Here,\
    \ ordered means \"insertion ordered\", i.e., dictionaries remember the order in\
    \ which the key:value pairs were inserted."
