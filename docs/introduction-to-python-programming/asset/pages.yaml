    \ method is primarily label based, but may also be used with a Boolean array.\n\
    The .iloc[] method will raise KeyError when the items are not found. Inputs accepted\
    \ by\n.loc[] will be a single label, e.g. 5 or 'a' (note that 5 is interpreted\
    \ as an index of the index/\nrow; this is not an integer position [row index])\
    \ (note that when using Python slices, both the start and the\nlice object with\
    \ labels ['a', 'b', 'c'], a slice\\stop are included, when present in the index[])\
    \ and Boolean array.\n\nThe .iloc[] method is integer position based (from 0 to\
    \ length-1 of the axis),\nmay also be used with a Boolean array. The .iloc[] method\
    \ will raise an IndexError if a\nrequested indexer is out-of-bounds, except in\
    \ the case of slice indexes, which allow out-\nbounding indexing (this conforms\
    \ with Python/NumPy slice semantics). Allowed inputs for\n.iloc[] method is an\
