    For example,


    +   1. >>> internet = (''cern'', ''timberslee'', ''www'', 1980)

    2. >>> internet

    (''cern'', ''timberslee'', ''www'', 1980)

    3. >>> type(internet)

    <class ''tuple''>

    4. >>> f1 = (''ferr'', ''redbull'', ''mercedes'', ''williams'', ''renault'')

    5. >>> f1

    (''ferr'', ''redbull'', ''mercedes'', ''williams'', ''renault'')

    6. >>> type(f1)

    <class ''tuple''>


    In ① the tuple internet is assigned with a sequence of numbers and string types.
    The contents of the tuple are displayed by executing the tuple name internet ②
    The contents and order of items in the tuple are the same as they were when the
    tuple was created. In Python, the tuple is called tuple ③. On output, tuples are
    always enclosed in parentheses, so that they are interpreted correctly. Tuples
    can be constructed with or without surrounding parentheses, although often parentheses
    are used anyway. It is actually the comma that forms a tuple making the comma
    significant and not the parentheses ④ⅼ.


    You can create an empty tuple without any values. The syntax is,


    ```

    tuple_name = ()

    ```


    For example,


    +   1. >>> empty_tuple = ()

    2. >>> empty_tuple

    ()

    3. >>> type(empty_tuple)

    <class ''tuple''>


    An empty tuple can be created as shown in ⅟ and empty_tuple is of type tuple ③.


    > You can store any item of type string, number, object, another variable, and
    even another tuple itself. You can have a mix of different types in tuples, and
    they need not be homogeneous.


    ![](img/1a4c4d9415149052170c8f902baa9036_222_0.png)


    For example,


    +   1. >>> air_force = (''f15'', ''f22a'', ''f35a'')

    2. >>> fighter_jets = (1988, 2005, 2016, air_force)

    3. >>> fighter_jets

    (1988, 2005, 2016, ''f15'', ''f22a'', ''f35a''))

    4. >>> type(fighter_jets)

    <class ''tuple''>'
