  md: '# 5


    # Strings


    | AIM |

    Use indexing and built-in string methods to manipulate and process the string
    values.


    LEARNING OUTCOMES

    At the end of the chapter, you are expected to


    * Access individual characters in a string and apply basic string operations.

    * Search and retrieve a substring from a string.

    * Use string methods to manipulate strings. |


    String usage abounds in just about all types of applications. A string consists
    of a sequence of characters, which includes letters, numbers, punctuation marks
    and spaces. To represent strings, you can use a single quote, double quotes or
    triple quotes.


    # 5.1 Creating and Storing Strings


    Strings are another basic data type available in Python. They consist of one or
    more characters surrounded by matching quotation marks. For example,


    +   1. >>> single_quote = ''This is a single message''

    2. >>> double_quote = "Hey it is my book"

    3. >>> single_char_string = "A"

    4. >>> empty_string = ""

    5. >>> empty_string = ""

    6. >>> string_within_double_quote = "Opportunities don''t happen. You can create
    them."

    7. >>> double_within_single_quote = "Why did she call the man ''smart''?"

    8. >>> same_quotes = T\ve an idea

    9. >>> triple_quote_string = """This


    ... is

    ... triple

    ... quote""'
