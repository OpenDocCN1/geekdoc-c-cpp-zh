    - MIT licenses software can be given away for free or you can sell it. There is
    no restriction on how you intend to distribute the software.

    - The only requirement is that the software should be accompanied by the MIT license
    agreement.


    The MIT license is the least protective out there. It basically says that anyone
    can do whatever they want with the MIT licensed software, as long as it is accompanied
    by MIT license.


    # Creative Commons


    Creative Commons is a global nonprofit organization that enables sharing and reuse
    of creativity and knowledge. Creative Licenses provide an easy way to manage the
    copyright terms that attach automatically to all creative material. Creative Commons
    licenses allow the creative material to be shared and reused. Creative Commons
    licenses may be applied to any type of work, including educational resources,
    media, photographs, databases, government and public-sector information, and many
    other types of material. The only categories of works for which Creative Commons
    does not recommend its licenses are computer software and hardware. The latest
    version of the Creative Commons licenses is version 4.0. A Creative Commons license
    has four basic parts, which can be endorsed individually or in combination. You
    will find a brief description of each part below.


    > Attribution. Creative Commons requires that others who use your work in any
    way may give you the credit you request, but not in a way that suggests you endorse
    them or use it. If they want to use your work without giving you credit or for
    endorsement purposes, they must get your permission first. Beyond, the work can
    be modified, distributed, copied and otherwise used.


    > Share Alike. You let others copy, distribute, display, perform, and modify your
    work, as long as you distribute any modified work on the same terms.


    > Non-Commercial. You let others copy, distribute, display, perform and modify
    and use your work for any purpose other than commercially unless they get your
    permission first.


    > No Derivative. You let others copy, distribute, display, perform and only original
    copies of your work. If they want to modify your work, they must get your permission
    first.'
