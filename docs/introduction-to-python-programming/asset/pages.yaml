  md: 'Files 231


    descriptive information. If a file has an invalid header information, a software
    program may not open the file or report that the file is corrupted.


    Text files are more restrictive than binary files since they can only contain
    textual data. However, unlike binary files, they are less likely to become corrupted.
    While a small error in a binary file may make it unreadable, a small error in
    a text file may simply show up once the file has been opened. A typical plain
    text file contains several lines of text that are followed by an End-of-Line (EOF)
    character. An End-of-File(EOF) marker is placed after the final character, which
    signals the end of the file. Files include a character encoding scheme that determines
    how the characters are interpreted and which characters can be displayed. Since
    text files use a simple, standard format, many programs are capable of reading
    and editing text files. Common text editors include Microsoft Notepad and WordPad,
    which are bundled with Windows, Apple TextEdit, which is included with Mac OS
    X.


    We can usually tell if a file is binary or text by its extension. This is because
    the extension reflects the file format, and it is ultimately the format that dictates
    whether the file data is binary or text.


    Common extensions for binary file:


    +   - Images: jpg, png, gif, bmp, tiff, psd...

    - Videos: mp4, mkv, avi, mov, mpg, vob...

    - Audio: mp3, aac, wav, flac, ogg, mka, wma...

    - Documents: pdf, doc, xls, ppt, docx, odt...

    - Archive: zip, rar, tz, tar, iso...

    - Database: mdb, accde, frm, sqlite...

    - Executable: exe, dll, so, class...


    Common extensions for text file formats:


    +   - Web standards: html, xml, csv, json...

    - Source code: c, cpp, h, cs, py, java, rb, pl, php, sh...

    - Documents: txt, ter, markdown, asciid, rtf, ps...

    - Configuration: ini, cfg, rc, reg...

    - Tabular data: csv,tsv...


    [Adapted with kind permission from https://fileinfo.com/help/binary_vs_text_files]


    # 9.1.1 File Paths


    All operating systems follow the same general naming conventions for an individual
    file: a base name and an optional extension, separated by a period. Note that
    a directory is simply a file with a special attribute designating it as a directory,
    but otherwise must follow the same naming rules as a regular file. To make use
    of files, you have to provide a file path, which is basically a root so that the
    user or the program knows where the file is located. The path to a specified file
    consists of one or more components, separated by a special character (a backslash
    for Windows and forward slash for Linux), with each component uniquely being a
    directory name or file name, and possibly a volume name or drive name in Windows
    or root in Linux. If a component of a path is a file, it must be the last component.
    It is often critical to the system''s interpretation of a path what we'
