  md: '# # 4

    Functions


    ### AIM

    Learn to define and invoke functions and comprehend the use of arguments and parameters
    to pass information to a function as well as return information from a function.


    ### LEARNING OUTCOMES

    At the end of this chapter, you are expected to


    +   - Understand the purpose of functions in Python.

    - Define and invoke functions.

    - Receive the returned data from functions.

    - Understand the use of modules and built-in functions in Python.

    - Determine the scope of variables.

    - Recognize different forms of function arguments.


    Functions are one of the fundamental building blocks in Python programming language.
    Functions are used when you have a block of statements that needs to be executed
    multiple times within the program. Rather than writing the block of statements
    repeatedly to perform the action, you can use a function to perform that action.
    This block of statements are grouped together and is given a name which can be
    used to invoke it from other parts of the program. You write a function once but
    can execute it any number of times you like. Functions also reduce the size of
    the program by eliminating rudimentary code. Functions can be either Built-in
    Functions or User-defined functions.


    # ### 4.1 Built-In Functions


    The Python interpreter has a number of functions that are built into it and are
    always available. You have already looked at some of the built-in functions like
    `input()`, `print()`, `range()` and others in previous chapters. Let''s discuss
    few more built-in functions (TABLE 4.1).'
