    # 2.1 Identifiers


    An identifier is a name given to a variable, function, class or module. Identifiers
    may be one or more characters in the following format:


    +   - Identifiers can be a combination of letters in lowercase (a to z) or uppercase
    (A to Z) or digits (0 to 9) or an underscore (_). Names like myCountry, other_1
    and good_morning, all are valid examples. A Python identifier can begin with an
    alphabet (A–Z and a–z and _).

    - An identifier cannot start with a digit but is allowed everywhere else. Iplus
    is invalid, plusI is perfectly fine.'
