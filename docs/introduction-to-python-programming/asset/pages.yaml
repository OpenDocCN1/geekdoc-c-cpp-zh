    # 9.2 Creating and Reading Text Data


    In all the programs you have executed until now, any output produced during the
    execution of the program is lost when the program ends. Data has not persisted
    past the end of execution. Just as programs live on files, you can write and read
    data files in Python that persist after your program has finished running. Python
    provides built-in functions for opening a file, reading from a file, writing to
    a file, and closing a file.


    # 9.2.1 Creating and Opening Text Files


    Files are not very useful unless you access the information they contain. All
    files must be opened first before they can be read from or written to using the
    Python’s built-in `open()` function. When a file is opened using `open()` function,
    it returns a file object called a file handler that provides methods for accessing
    the file.


    The syntax of `open()` function is given below.


    ```

    file_handler = open(filename, mode)

    ```


