    # 12.4 Pandas


    pandas is a Python library that provides fast, flexible, and expressive data structures
    designed to make working with “relational” or “labeled” data both easy and intuitive.
    It aims to be the fundamental high-level building block for doing practical, real
    world data analysis in Python.


    The primary data structures of pandas, Series (one-dimensional) and DataFrame
    (two-dimensional), handle the vast majority of typical-use cases in finance, statistics,
    social science, and many areas of engineering. pandas is built on top of NumPy
    and is intended to integrate within a scientific computing environment with many
    other third-party libraries.


    pandas is well suited for inserting and deleting columns from DataFrame, for easy
    handling of missing data (represented as NaN), aligning data to a set of labels,
    converting data in other Python and NumPy data structures into DataFrame objects,
    intelligent-based slicing, indexing, and subsetting of large data sets, merging
    and joining of data sets, and flexible reshaping. Additionally, it has robust
    input/output tools for loading data from CSV files, Excel files, databases, and
    other formats. You have to import a pandas library to make use of various functions
    and data structures defined in pandas.


