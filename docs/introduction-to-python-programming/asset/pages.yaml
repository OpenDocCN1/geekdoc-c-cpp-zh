  md: '# Introduction


    # 1.4 History of Python Programming Language


    The history of the Python programming language dates back to the late 1980s. Python
    was conceived in the late 1970s and its implementation was started in December
    1989 by Guido van Rossum (FIGURE 1.2) at CWI in the Netherlands as a successor
    to the ABC programming language capable of exception handling and interfacing
    with the Amoeba operating system. Van Rossum is Python''s principal author, and
    his continuing central role in deciding the direction of Python is reflected in
    the title given to him by the Python community. “Benevolent Dictator For Life”
    (BDFL), which means he continues to oversee Python development and retains the
    final say in disputes or arguments arising within the community.


    ![](img/1a4c4d9415149052170c8f902baa9036_27_0.png)


    FIGURE 1.2

    Gido van Rossum—Creator and BDFL of Python Programming Language. (Image courtesy
    of Wikipedia.org)


    Often people assume that the name Python was written after a snake. Even the logo
    of Python programming language (FIGURE 1.3) depicts the picture of two snakes,
    blue and yellow. But, the story behind the naming is somewhat different.


    ![](img/1a4c4d9415149052170c8f902baa9036_27_1.png)


    FIGURE 1.3

    Python logo. (Image courtesy of Python.org)


    Back in the 1970s, there was a popular BBC comedy TV show “Monty’s Flying Circus”
    and Van Rossum happened to be a big fan of that. At the time he began implementing
    Python, Guido van Rossum was also reading the published scripts from “Monty’s
    Flying Circus.” It occurred to him that he needed a name that was short, unique,
    and slightly mysterious, so he decided to call the language “Python.”'
