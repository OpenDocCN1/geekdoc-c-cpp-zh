    \ methods.\n\n# 6.1.2 Harris and Stephens detector\n\nThe Harris and Stephens\
    \ corner detector [16] and its derivatives are among the most used methods. This\
    \ detector is invariant to scaling, rotations, noise and illumination variations\
    \ [35]. The principle is based on the analysis of a local weighted sum of quadratic\
    \ differences measuring local changes of the signal with pixel neighborhoods shifted\
