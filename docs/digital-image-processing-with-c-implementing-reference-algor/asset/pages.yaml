  md: '# 7.2.5 Super-pixels partitioning


    The SLIC (Simple Linear Iterative Clustering) method, proposed by R. Achanta et
    al. [1], defines an algorithm for partitioning color images into super-pixels.
    Super-pixels are clusters of neighboring pixels forming compact blocks of various
    shapes, interlocking with each other, while adapting to the local geometry of
    the image structures.


    # DESCRIPTION OF THE METHOD


    The core of the SLIC method is based on a k-means classification of all the pixels
    of the image (Algorithm 4, Section 7.2.3), with the consideration of an objective
    function that depends on both color difference between the pixels to be classified
    and the colors of the centroids, their respective spatial distance. More authors
    propose to compute the distance D(x1, x2) between two points x1 and x2 by:


    $D(x_1,x_2) = \sqrt{d_c^2 + \left(\frac{d_i}{S}\right)^2}m^2 \quad d_c = \sqrt{(L_1-L_2)^2
    + (a_1-a_2)^2 + (b_1-b_2)^2}$


    and $s = \sqrt{(x_1-x_2)^2 + (y_1-y_2)^2}$.


    The measure $d_s$ corresponds to the spatial distance between the two measured
    points, and $d_c$ to the color distance, where the color of each point is expressed
    in the CIE L*a*b* color space. The two constants $S,m \in \mathbb{R}$ are user-defined
    parameters, which indicate the approximate size of the super-pixels and the regularity
    of their shape, respectively.


    Code 7.11 Implementation of the objective function D for SLIC.


    ```

    float D(float x1, float y1, float L1, float a1, float b1,

    float x2, float y2, float L2, float a2, float b2,

    float S, float m) {

    return std::sqrt(cimg::sq(L1 - L2) + \

    cimg::sq(a1 - a2) + \

    cimg::sq(b1 - b2) + \

    m*m/(S*S)*(cimg::sq(x1 - x2) + \

    cimg::sq(y1 - y2)));

    }

    ```


