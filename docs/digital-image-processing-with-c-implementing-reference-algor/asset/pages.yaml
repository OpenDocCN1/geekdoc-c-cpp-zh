    #  6.3.2 Tamura coefficients


    Tamura et al. [40] elaborated six indices, based on results of psychological experiments,
    allowing to characterize textures in images. Among these six indices, three are
    commonly used, the other three (regularity, line likeness and roughness) are correlated
    to the first three, which we present below.


    # CONTRAST


    The contrast measures the distribution of gray levels in the image. It is equal
    to the ratio between the standard deviation and a power n (parameter, whose values
    are around 0.25) of the kurtosis of the empirical distribution (histogram), see
    Chapter 3 of the gray levels (Code 6.8).


    > Tamura''s contrast.


