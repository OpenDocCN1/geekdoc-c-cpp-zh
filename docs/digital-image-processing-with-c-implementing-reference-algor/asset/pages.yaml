    # EPIPOLAR CONSTRAINT


    The epipolar constraint characterizes the fact that the corresponding $\mathbf{m}_2$
    of a point $\mathbf{m}_1$ lies on a line $\ell_{m_1}$ in $l_2$. Indeed, $\mathbf{m}_2$
    necessarily belongs to the plane defined by $\mathbf{C}_1$ and $\mathbf{C}_2$.
    The line $\ell_{m_1}$ is called the epipolar line of the point $\mathbf{m}_1$
    in $l_2$. This constraint is symmetrical. The epipolar lines of an image all intersect
    at a point e called epipole, which corresponds to the projection of the center
    of projection of the other image. Thus $e_1 = \mathbf{P}_1\mathbf{C}_2$ and $e_2
    = \mathbf{P}_2\mathbf{C}_1$.


    # FUNDAMENTAL MATRIX


    This constraint can be expressed in an algebraic form, through the fundamental
    matrix, verifying the epipolar relation:


    $\mathbf{m}_2^T\mathbf{F}\mathbf{m}_1 = 0$


    Then $\ell_{m_1} = \mathbf{F}\mathbf{m}_1$, and symmetrically $\ell_{m_2} = \mathbf{F}^T\mathbf{m}_2$.
    This rank 2 matrix ($\mathbf{F}_{e_1} = 0$) characterizes all the geometry between
    two images, excluding intrinsic parameters'
