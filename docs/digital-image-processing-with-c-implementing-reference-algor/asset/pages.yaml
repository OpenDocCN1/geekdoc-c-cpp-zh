    \ minimize the cost of false errors (Bayesian thresholding, Ney-Pearson for example).\
    \ If not, we look for the threshold(s) in the case of several regions or classes\
    \ from an analysis of the histogram:\n\n+   - Direct thresholding: thresholds\
    \ are automatically derived from statistical calculations on the gray levels histogram\
    \ (modes, zero crossings, maximum entropy, variance maximum, conservation of moments,\
    \ etc.) and a priori constraints on the number of classes;\n- Adaptive thresholding,\
    \ which uses the previous computation techniques, with a focus on the local study\
    \ of the criteria, i.e., on sub-regions (managing the size of the regions, overlaps);\n\
    - Hysteresis thresholding, where four threshold values are interactively or automatically\
    \ defined, determining three classes of pixels: rejected pixels ($s_1-s_2$), accepted\
    \ pixels (range $s_3-s_4$), and candidate pixels (range $s_2-s_3$). A convexity\
    \ test of the sets ($s_2-s_3$) and ($s_3-s_4$) allows to validate or invalidate\
    \ the candidate pixels ($s_3-s_4$) is used as a marker for the reconstruction\
    \ of ($s_2-s_3$). It is also possible to control the extension of the reconstruction\
    \ of ($s_2-s_3$) by geodesic reconstruction.\n\n# OTSU ALGORITHM\n\nOtsu Algorithm\
    \ [30] supposes that image $I$ of size $nx \times ny$ is composed of only two\
    \ classes, whose gray level distribution is unknown. The objective is to find\
    \ a threshold $s$ such that the distributions of the two classes are separated\
    \ at best, i.e.,\n\n+   1. their means are farthest apart;\n2. the distributions\
    \ are as compact as possible (minimal variances).\n\nLet $M$ be the maximum gray\
    \ level in $I$. Given $s$, the image is partitioned into two classes $R_0$ and\
    \ $R_1$ of cardinalities:\n\n```\n$n_0(s) = \\sum_{g=0}^{s} h(g) \\quad n_1(s)\
    \ = \\sum_{g=s+1}^{M-1} h(g)$\n```\n\nwhere $h$ is the histogram of $I$. Means\
    \ and variances of both classes are then:\n\n```\n$$\\mu_0(s) = \\frac{1}{n_0(s)}\
    \ \\sum_{g=0}^{s} gh(g) \\quad \\ \\mu_1(s) = \\frac{1}{n_1(s)} \\sum_{g=s+1}^{M-1}\
    \ gh(g)$\n```"
