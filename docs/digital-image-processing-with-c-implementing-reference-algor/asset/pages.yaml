    # 10.3 Creating complex 3D objects


    Let''s go into more detail on how the data of vertices, primitives, materials
    and opacities are interpreted in practice, when displaying 3D mesh objects with
    the ClImg library.


    # 10.3.1 Details on vertex structuring


    Each vertex $n$ (for $n \in[1,N]$) of a object is a point with coordinates $(x_n,y_n,z_n)$.
    The set of vertices composing a 3D object is stored as an image ClImg<float> of
    size $N \times 3$, which is the horizontal concatenation of all vectors $(x_n,y_n,z_n)^T$.
    This representation allows us to have an easily manipulated matrix of vertex coordinates.
    In particular, we can apply a rotation to the points of a 3D object in the following
    way :


    ```

    points = ClImg<>:: rotation_matrix(ax, ay, az, angle) * points;

    ```


    where $(a_x,a_y,a_z)$ are the coordinates of the desired rotation axis.'
