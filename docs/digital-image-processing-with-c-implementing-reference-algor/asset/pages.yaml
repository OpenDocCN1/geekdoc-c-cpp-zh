  md: '# 11. And So Many Other Things...


    The field of digital image processing is so large that it is actually impossible
    to embrace all its aspects exhaustively in a single book. In this last chapter,
    we therefore propose some other possible applications, more original or more rarely
    discussed, and which point out once again the flexibility and genericity of the
    Clmg library to deal with various problems. Thus, we will illustrate here how
    to efficiently compress an image, how to reconstruct an object from its tomographic
    projections, how to recover the 3D geometry of a scene from a pair of stereographic
    images, or how to develop an original user interface allowing to warp images (e.g.,
    portraits) from the webcam. Afterwards, we trust you to invent or discover other
    aspects of image processing that have not been covered in this book!


    # 1.1 Compression by transform (JPEG)


    # 11.1.1 Introduction - Compression by transform


    Two main approaches exist for compressing data:


    +   - Lossless compression or coding which minimizes the size of the data by reducing
    the redundancy of its code. During the decompression phase, decoding, the data
    is found exactly as it was at the beginning;

    - Lossy compression which suppresses information in the signal considered irrelevant
    for the subsequent use of the data. Generally, this type of compression is used
    to compress sound, image and video data. When decompressing the data, we obtain
    a signal different from the original one, but with a difference that is hopefully
    imperceptible for a given use case (listening to the music, viewing the image,
    etc.).


    Lossy methods are often based on compression by transform. The idea is to apply
    a mathematical transform to the original signal, then quantize the coefficients
    of the resulting representation in the transformed space.


    Several arguments justify this approach:


    +   - The transform, which is mathematically equivalent to a change in the encoding'
