    # IMPLEMENTATION OF THE DERICHE FILTER FAMILY


    The Deriche contour filter not only corresponds to the exact solution of the optimization
    problem of the Canny criterion, it also has the remarkable property (shared also
    by its smoothing and derivative filter) to be implemented recursively with few
    operations, independently of the filter width.


    Differences between finite and infinite impulse response filters


    +   * FIR filters are filters whose finite size allows to implement their numerical
    convolution with a relation between the output, $I_o[i]$, and the input, denoted
    $I_i[i]$, which is written as follows:


    ```

    $$$I_o[i] = \sum_{k=-L}^{L} H[k] \times I_i[i-k].$$

    ```


    $H[i]$ is the numerical impulse response of the filter. It is impossible to use
    this expression if the impulse response of the filter is infinite.

    If a system is BIBO (Bounded-Input / Bounded-Output) stable, then for any input,
    the output of the system is also stable. On discrete signals, a system is BIBO
    stable if and only if $\sum_{n=-\infty}^{\infty} |h(n)| = ||h||_1 < \infty$. It
    is easy to show that if $L < \infty$, FIR filters are unconditionally stable,
    no matter what coefficients are used.'
