    # 3.2 Histogram operations


    An important class of point operations is related to the histogram of the image
    or part of the image.


    # 3.2.1 Definition


    The probability distributions of the gray levels can be estimated by measurements
    over the histogram of the image. For example, the first order distribution


    $P(I(x,y)) = k$$


    can be evaluated using a set of D images large, representative of a given image
    class. The estimated distribution is then


    $h(k,x,y) = \frac{Num(k)}{D}$$


    where $Num(k)$ is the number of images for which $I(x,y) = k$. Using the ergodicity
    hypothesis, the measure on D images can be replaced by a spatial measure: the
    first order probability distribution can then be estimated by


    $H(k) = \frac{Num(k)}{|I|}$


    where $|I|$ is the total number of pixels and $Num(k)$ is the number of times
    in $I$ $I(x,y) = k$, for all $(x,y)$.'
