    # Definition 3.2.1


    ```

    $H : [[0,N-1]] \rightarrow \mathbb{N}

    k\mapsto H(k) \= \frac{Num(k)}{|I|}$

    ```


    is the histogram of image $I$.


    In the case of color images, the histogram generally refers either to the intensity
    (luminance) of the pixels or to the histograms of the different color channels.


    # 3.2.2 Histogram specification


    The histogram of a typical image $I$ that has been linearly quantized has a large
    number of pixels with a lower gray level than the average gray level of $I$. The
    details in the darkest regions become hardly perceptible. One to improve these
    images is to perform a histogram specification operation, which transforms the
    histogram so that it approaches a given distribution. This can be for example
    a uniform distribution, and in this case the operation is called “histogram equalization”.


    Histogram specification can be thought of as a monotonic transformation $J_j =
    T(I_i)$ such that the probability distribution $P(J_j = k_j)$ follows a given
    constraint for a given probability $P(I_i = l_i)$, where $l_i$ and $k_j$ are the
    reconstructed values of the $i^{th}$ and $j^{th}$ gray levels. Since both sum
    up to ,


    ```

    $\sum_{i=1}^{N_i} P(I_i = l_i) = 1$ and $\sum_{j=1}^{N_j} P(J_j = k_j) = 1$

    ```


    Furthermore, if $T$ is monotonic, the probability that the pixels of $I$ have
    a gray level less than or equal to $l_i$ must be equal to the probability that
    the pixels of the output image have a gray level less than equal to $k_j$, with
    $k_j = T(I_i)$. Then:


    ```

    $\sum_{p=1}^{j} P(J_p = k_p) = \sum_{q=1}^{i} P(I_q = l_q)$

    ```


    The second term is nothing but the cumulative distribution of $I$ and thus can
    be replaced by the cumulative histogram: $\sum_{p=1}^{j} P(J_p = k_p) = \sum_{q=1}^{i}
    H_I(q)$.


    Since $J_j$ must be a function of $I_i$, this equation has to be inverted. The
    analytical inversion is sometimes impossible, and $T$ can then be estimated by
    numerical methods. approach the solution, it is usual to express the discrete
    probability distributions'
