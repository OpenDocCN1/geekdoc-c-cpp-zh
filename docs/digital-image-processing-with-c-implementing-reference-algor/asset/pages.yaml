    Clmg has many methods for applying mathematical processing to pixel values, and
    the usual arithmetic operators are redefined to allow writing such expressions.
    Here, calls to the Clmg<float>::get_sq() method return images where each pixel
    value has been squared. These two images are then summed via the Clmg method Clmg<float>::operator+()
    which returns a new image of the same size. Finally, Clmg<float>::sqrt() replaces
    each value of this summed image by its square root.'
