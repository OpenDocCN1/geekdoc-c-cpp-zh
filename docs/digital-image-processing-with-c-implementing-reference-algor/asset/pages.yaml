    imq), cosh(), sinh(), tanh(), acosh(), asinh(), atanh() |

    | Hyperbolic | atanh |

    | Min-Max | min(T& value), max(T& value), minabs(T& value), maxabs(T& value) |

    | Various | abs(), sign() |


    Table 3.1 – Mathematical functions available as methods of CImg<T>. For each method
    f (), there is an equivalent version get_f ().


    ![](img/6b7de6c7ce31f7bb2927e7184da0492f_60_0.png)


    Finally, it can sometimes be useful to transform an image using another image
    J. ClImg provides methods for performing point operations between two images:
    addition (overloaded operators + -), multiplication (mul (CImg<T>& imq)), division
    (div (CImg<T>& img)), or even elevation to power (pow (CImg<T>& imq)), where each
    pixel in I raised to the power of the gray level of the corresponding pixel in
    J. For example, writing


    ```

    CImg<C> C = A.get_pow(B);

    ```


    on A and B in Figure 3.4 produces image C.


    # 3.1.2 Bitwise transformations


    Classicwise transformation operators (AND, OR, XOR) are also overloaded. They
    can be applied on images with binary values {0,1} to produce logical combinations,
    as illustrated in Fig. 3.5, produced by Code 3.2.'
