  md: '# Preamble


    ### WHAT IMAGE PROCESSING?

    Image processing is a discipline where different scientific fields meet: signal
    processing, applied mathematics and computer science. As a result, the definition
    of what image processing varies according to the background of the person speaking
    about it. Signal processing is a broader discipline that consists of extracting
    information from a measurement or an observation that is generally perturbed by
    noise, distorted and where the information we are looking for is not directly
    accessible. The word signal, coming from electrical engineering, is a generic
    term that represents an observable quantity that is a measurement over time (one
    dimension = time), an image (two dimensions = distances), a video sequence (three
    dimensions = distances), a volume (three dimensions = distances), a temporal volume
    (four dimensions = three distances + time), ... The objective of signal processing,
    and by the way of image processing, is to develop methods that allow efficiently
    search for this information by a denoising, reconstruction or estimation process
    for example. The design of these processing methods calls upon many fields of
    mathematics (stochastic processes, statistics, probability, linear algebra, ...)
    and applied mathematics (information theory, optimization, numerical analysis,
    ...).


    The practical realization of these methods depends on the nature of the image.
    In the vast majority of cases, they are digital, i.e., sampled and quantified
    signals. One carries *digital image processing* which processes data-processing
    algorithms on numerical machines (computers or dedicated circuits).


    ### WHAT IS AN IMAGE?

    An image is a *d* dimensional signal. In order to process it, we associate this
    signal with the notion of abstract signal. In this book we will only consider
    deterministic signals to which we associate a function. In the context of random
    or stochastic signals, we can use for example random processes.


    To present an image processing method, we can switch between a continuous representation
    of the image for the theory and its numerical representation for its computer
    realization (Eq. 1 and Fig. 1).'
  merge: -1
