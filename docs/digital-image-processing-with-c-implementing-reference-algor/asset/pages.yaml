  md: "# 8.2 Sparse estimation\n\n# REPRESENTATION CHANGES\n\nThe previous technique\
    \ estimates a translation between two images, but it is also possible to use it\
    \ for other transformations. Using variable substitution, we can convert from\
    \ example a rotation or a similarity to a translation:\n\n+   - Rotation: we consider\
    \ that the image $I_2$ is a rotation of angle $\theta_0$ of the image $I_1$. By\
    \ changing the variable from a cartesian space to a polar space, we get the following\
    \ relation: $I_2(\rho, \theta) = I_1(\rho, \theta - \theta_0)$. With this new\
    \ representation, estimating a rotation is equivalent to estimating a translation\
    \ vector $(0, \theta_0)$ in the polar space;\n- Similarity: we consider that $I_2$\
    \ is a scaling of factor $(s_x, s_y)$ of the image $I_1$. By changing the from\
