  md: '# 5.2 Recursive filtering


    As seen before, the detection of contours in an image requires a sign derivation
    that can be implemented by a discrete convolution (Subsection 5.1.3, Equation
    5.1). By this approach, this detection can be formalized as a filtering problem
    in the spatial domain. This numerical calculation is however not very efficient
    in the presence of noise, and several works therefore add a smoothing filter to
    the derivative calculations, allowing the signal to be regularized. The work of
    Prewett and Sobel (Fig. 5.8), for example, to use either an averaging or a Gaussian
    low-pass filter for this task.


    The coupling of a smoothing filter to the estimation of the derivation is classical.
    A typical example of this approach can be found in [5] which developed an optimal
    finite impulse response (FIR) filter for edge detection, by maximizing different
    geometrical criteria. It leads to a complex solution, which is in practice approximated
    by a first derivative of a Gaussian. This operator, also known as Canny filter,
    is implemented via a discrete convolution operation, which requires a number of
    operations proportional to the standard deviation of the Gaussian filter, in order
    to avoid the effects of filter truncations. In Deriche''s work [10], the author
    takes Canny''s criteria and succeeds in developing a simpler analytical solution,
    in the form of an infinite impulse response (IIR) filter, which moreover has low
    algorithmic complexity via a recursive implementation with a constant number of
    operations whatever of the filter to be applied.


    # 5.2.1 Optimal edge detection


    In Canny''s approach, we consider a continuous contour model (of the Heaviside
    distribution), noted $I(x)$, perturbed by an additive noise independent of the
    signal (Fig. 5.13). The objective of Canny''s work is to find an optimal filter
    to detect this type of contours whose impulse response is noted $h_{opt}(x)$.


    Canny''s approach is based on three criteria that have to be:


    +   1. Good detection: a strong response of the detector even with weak contours
    is equivalent to finding the best signal to noise ratio at the output of the filter
    $h_{opt}(x)$. This criterion is formalized by the maximization of:


    ```

    $$\Sigma = \frac{\int_{-\infty}^{+\infty} h_{opt}(x) dx}{\int_{-\infty}^{+\infty}
    h_{opt}^2(x) dx}$

    ```


    +   2. Good location: the maximum of the detector response must be at a position
    closest to the actual position of the contour. Canny results in the maximization'
