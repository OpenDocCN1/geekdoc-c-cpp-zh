    - For a uniform noise, $c_k = \chi_{(k=1)}$ $(\frac{1}{2}$ if $k=1$ or $k=N$,
    otherwise.


    Moreover, if $c_k = \chi_{(k=N)}$ it is a dilation. We thus find the two basic
    operations of mathematical morphology (cf. [chapter 4](chapter 4)), from which
    we can perform non-linear filtering.


