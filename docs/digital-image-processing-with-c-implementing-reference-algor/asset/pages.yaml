  md: '# Preface


    Rachid Deriche is a senior research director at The Inria center at Université
    Côte d''Azur in France where he leads the Athena research project team. His research
    aims to explore the Central Nervous System (CNS) through mathematical and computational
    models of medical imaging, with a focus on the recovery of the human brain’s structural
    and functional connectivities. He was awarded the EADS Grand Prize (Computer Science)
    by the French Academy of Sciences in 2013, a prestigious ERC Grant for his project
    in Computational Brain Connectivity Mapping in 2016, Doctorate Honoris Causa by
    Sherbrooke University in 2014 and 3IA Université Côte d''Azur in 2019. He has
    published over 100 journal articles and over 300 conference papers. His extensive
    scientific career includes three research areas: i) computational image processing,
    ii) 3D computer vision, and iii) computational neuroimaging.


    ![](img/6b7de6c7ce31f7bb2927e7184da0492f_11_0.png)


    It is with great pleasure that I accepted to preface this book, which is the successful
    outcome of several years of research and experience by a trio of authors who are
    experts in digital image processing, combining both its theoretical aspects and
    its software implementations.


    I know David Tschumperlé since I had as a trainee in my project-team at Inria
    Sophia Antipolis-Mériterranée, in March 1999, as part of his Master’s degree,
    from the University of Nice Sophia Antipolis in which I was teaching a module
    about image processing based on variational approaches, PDE-based and Level Sets
    techniques (PDE: Partial Differential Equation).


    The internship was about the study and development of diffusion PDE methods for
    multi-valued images (more particular color images), i.e., images with potentially
    more than three components per pixel. I selected him among several applicants
    of the promotion, because he was also a general engineer in computer science,
    and his double background perfectly met the need for the trainee who could program
    with ease in C/C++ while mastering the theoretical aspects and those related to
    an efficient software implementation of the developed algorithms. PDE-based methods
    often'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'require several hundreds or thousands of complex iterations to be applied to
    images, as you will discover in this book, and the need to optimize the machine''s
    processor resources is therefore all the more pressing.


    After promising results, David continued his work in a PhD thesis, under his supervision.
    And very quickly, it became obvious that we needed to develop a reference C/C++
    library to process images with more than three channels or volume images with
    any values (matrices, tensors, ...) to develop our research work.


    Through the implemented algorithms, tests, successes and failures, David gradually
    built his own personal C++ library of reusable features, in order to complete
    his thesis work. The originality of David''s research work, the need to optimize
    and develop software that survives his PhD period and is “reusable” by the members
    of the team constitute in my opinion the basis of the Climg library''s genesis.


    At the end of David''s thesis, the use of Climg had already secured the new PhD
    students and permanent members of the team. At the end of 2003, we decided, in
    agreement with Inria''s development department, to distribute Climg more widely
    as free software, naturally using the new free license CeCILL, which had been
    created jointly by Inria, CEA and CNRS.


    More than 20 years after its first lines of code, Climg is now image processing
    library used by thousands of people around the world, at the heart of dozens of
    free projects, and just as importantly, continuously and actively maintained.


    At the origin of this remarkable success, is first of all, the nature and the
    quality of the methodological work carried throughout the doctoral program, as
    well as the implementation guided by the development of processing algorithms
    that must work on images of types and modalities from the field of computer vision
    (cameras, video, velocity fields) as well as in the satellite or medical fields,
    in particular neuroimaging, with magnetic resonance diffusion imaging and its
    well-known model called the diffusion tensor.


    This aspect of data genericity was quite a central element in the design and success
    of the library. With a focus on simplicity of design and use, and a constant and
    coherent development of the library API, the authors have clearly succeeded in
    coupling ease of use with the genericity of the processing that allows it. The
    free distribution of the library has allowed the academic world, as well as the
    research and industrial world, to discover the prototyping and implementation
    of efficient image processing algorithms in a gentle and enjoyable way.'
  merge: -1
