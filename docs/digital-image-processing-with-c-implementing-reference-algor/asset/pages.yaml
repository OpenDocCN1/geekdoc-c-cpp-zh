    xy\");\n\n// Iteration loop.\nfloat denom = 1 + 4*alpha;\nfor (unsigned int iter\
    \ = 0; iter<nb_iters; ++iter) {\n    CImg<> Vavg = V.convolve(avg_kernel);\n \
    \   CImg_forXY(V,x,y)\n    x = X + V(x,y,0);\n    y = Y + V(x,y);\n    deltaI\
    \ = nseq(x,y,0) - nseq_atXY(X,Y,1);\n    V(x,y,0) = (V(x,y,0) + deltaI*grad[0].linear_atXY(X,Y,0,0)\
    \ + \n        4*alpha*Vavg(x,y,0))/denom;\n    V(x,y,1) = (V(x,y,1) + deltaI*grad[1].linear_atXY(X,Y,0,0)\
    \ + \n        4*alpha*Vavg(x,y,1))/denom;\n}\n```\n\n# MULTI-SCALE RESOLUTION\
    \ SCHEME\n\nIn practice, the determination of the velocity field using this kind\
    \ of method does not allow to obtain a correct estimation in the case of large\
    \ displacements. Indeed, the expressions to be iterated are based only on the\
    \ first derivatives of the image, giving by nature a very local information of\
    \ the intensity variations (and thus of motion). It is classic to use a multi-scale\
    \ resolution scheme to get rid of this problem:\n\n+   1. We define a number N\
    \ > 0 of scales.\n2. The displacement field v is estimated for images with spatial\
    \ resolution 2⁻N W × 2⁻H, where W and H are the width and height of the images.\n\
    3. We multiply the estimated vectors by 2 and double the spatial resolution of\
    \ v (using bi-linear interpolation, for instance).\n4. If N > 0, we decrement\
    \ N, and return to step (2) by considering the v estimated in the previous step\
    \ as the initial displacement estimate.\n\nThe multi-scale resolution scheme can\
    \ be implemented as proposed in Code 8.3."
