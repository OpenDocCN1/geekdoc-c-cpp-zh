  md: '# 9. Multispectral Approaches


    A multispectral image is an image that captures data in specific wavelength ranges
    across the electromagnetic spectrum. When acquiring such an image, wavelengths
    are separated by filters, or detected via the use of instruments sensitive to
    particular wavelengths, including light from frequencies beyond the visible light
    range (infrared, ultraviolet). By extension, the term multispectral is also used
    for acquisitions of objects made by use particular techniques (diffusion MRI channel
    for example), and can lead to images having multiple channels.


    Multispectral imaging allows the extraction of additional information that the
    human eye cannot necessarily capture. It permits the exploitation of redundancies
    and complementarities between the acquisition channels, and in addition to the
    extraction of relevant information, the analysis of these images can lead to a
    reduced and synthetic representation of the information contained in the whole
    set of channels. Numerous applications are concerned ranging from satellite imagery
    to astronomy, including military applications, medicine or art.


    Generally speaking, multispectral imaging refers to data with a low (two to ten)
    number of acquisition channels. Hyperspectral imaging is dedicated to studies
    where the number of channels is higher (sometimes several hundreds). Color images
    (three or four channels) are of course part multispectral images.


    Climg library can handle multispectral images through the fourth dimension (spectral
    dimension, named spectrum) of objects type CImg<T>. A 2D multispectral image with
    p channels will then be defined as a CImg<(w, h, l, p). Various Climg methods
    allow to recover the number of channels (CImg<T>::spectrum()), to assign or retrieve
    images with channels (CImg<T>::get_shared_channel()()), etc. There is no hard
    limit on the number of possible channels, except the memory.


    # 9.1 Dimension reduction


    A multispectral image is thus a 3D array (or 4D for volume images), of size $w
    \times h \times p$, where $(w,h)$ is the size of an image and $p$ is the number
    of acquisition channels.'
  merge: -1
