    # ## GAUSSIAN FILTER


    In the isotropic case, the Gaussian filter as for impulse response:


    ```

    $H(x,y) = \frac{e^{-\frac{x^2+y^2}{2\sigma_z^2}}}$

    ```


    The frequency response is also a Gaussian filter (Fig. 5.28), with the standard
    deviation proportional to the inverse of the spatial standard deviation:


    ```

    $$\widehat{H}(f_x, f_y) = e^{-2\pi^2\sigma_z^2(f_x^2+f_y^2)} = e^{-\frac{f_x^2+f_y^2}{2\pi\sigma_f^2}}$
    where $\sigma_f = \frac{1}{2\pi\sigma_z}}$

    ```


    This is the optimal filter for removing additive Gaussian noise. Code 5.12 implements
    Gaussian filtering in the frequency domain. The frequency response of this filter
    is illustrated in Fig. 5.28.'
