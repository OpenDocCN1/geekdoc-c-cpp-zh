  md: "IIR filters, which can be exactly recursively implemented, have a lower computational\
    \ cost than the previous ones, but it is necessary to pay attention to their stability.\
    \ The relation between the output, denoted $I_o[i]$, and the input, $I_i[i]$,\
    \ is written as follows:\n\n```\n$I_o[i] = \\sum_{k=0}^{N} b_k \times I_i[i-k]\
    \ - \\sum_{k=1}^{M} a_k \times I_o[i-k] \\quad (5.6)$\n```\n\nwhere the coefficients\
    \ $a_i$ and $b_i$ are calculated from the impulse response of the filter $H[i]$.\
    \ This type of filter uses a recursive scheme and requires $(N+M+1)$ operations,\
    \ which is smaller and independent of the size of the filter. It should also be\
    \ noted that a convolution with the Deriche filter or its derivatives and its\
    \ smoothing filter can be implemented exactly in the form of Equation 5.6. This\
    \ remarkable property is not shared by all IIR filters (the Gaussian filter, like\
    \ the Canny filter cannot). A recursive implementation by filters of order 2 to\
    \ 4 approximating in a least squares sense the convolution with the Gaussian and\
    \ its derivatives has been developed by Deriche [11] and by other authors [41,\
    \ 43].\n\nThe convolution of a one-dimensional signal $I_l$ composed of $K$ samples\
    \ with the optimal Deriche contour detection filter is implemented in an exact\
