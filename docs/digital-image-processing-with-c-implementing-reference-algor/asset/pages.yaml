    # Non-linear filtering


    One of the main drawbacks of averaging filter smoothing methods is that the smoothing
    also applies to edge boundaries and high-frequency details, which introduces “blurring”
    into the image. If the objective of the processing is only noise reduction, one
    would like to preserve the natural contours in the image as much as possible.


    Section 5.4 will introduce a technique based on partial differential equations
    to address this problem. Here we are interested in simpler methods, which can
    never be less effective depending on the type of degradation (noise) encountered
    in the image.


    Median filtering answers this problem for impulse noise. This filter also has
    the good property of leaving unchanged the monotonic transitions between neighboring
    regions of different intensities (Fig. 5.5). The principle is simple: replace
    the value of $I(x,y)$ by the median of the gray levels in a neighborhood of $(x,y)$.
    If the computation is trivial, the method has some drawbacks. For noises with
    a low concentration distribution (Gaussian, uniform), its performance is poor
    compared to the optimal linear filter. In addition, it can still affect the geometry
    of the image regions: areas with an acute angle (corners of structures) tend to
    be rounded. Thus, geometric information is lost on angular points.


    An immediate generalization of the median filter principle is the order filter.
    It consists in increasing an way the gray levels of the pixels contained in the
    neighborhood of $(x,y)$, to obtain a vector $\mathbf{a}$, and to retain for $I(x,y)$
    a function of the $j^{th}$ value $a_j$ after sorting a $j^{th}$ order statistics.
    From these values, L-filtering of the image is defined, which consists in applying
    a linear combination of the order'
