    # 5.4.2 Physical basis of diffusion


    This method is based on the physical principles of diffusion between fluids: the
    diffusion equation is similar to that of local concentrations of a fluid that
    equilibrate under the condition of conservation of matter. The transfer to reach
    the equilibrium of concentrations is expressed with the first Fick’s empirical
    law:


    ```

    j = -D∇U

    ```


    where


    +   * D is the diffusion tensor, a symmetric and positive definite matrix;

    * U(x,t) is the concentration of matter in x at time, U : ℝᵈ × [0; +∞] → ℝ;

    * ∇U is the spatial gradient of the concentration of matter;

    * j is the diffusion flux.


    Note that, in a simplified version of this equation, D can be replaced by a scalar
    d, named diffusivity. This is equivalent to choose a diffusion tensor equal to
    either'
