    \nFigure 8.9 – Post-occlusion tracking recovery by Kalman filtering.\n\n```\n\
    /*/\nvoid Kalman(CIMgList>& I, CIMg<int>& pos, CIMg<int>& size) {\n  CIMg<\n \
    \   prevState(1,4),\n    currState(1,4);\n  CIMg<int>\n    prevPos(pos),\n   \
    \ currPos(1,2),\n    estimPos(1,2);\n  prevState(0,0) = pos(0);\n  prevState(0,1)\
    \ = pos(1);\n  prevState(0,2) = 0;\n  prevState(0,3) = 0;\n  CIMg<> T = I[0].get_crop(pos(0)\
    \ - size(0), pos(1) - size(1),\n    pos(0) + size(0), pos(1) + size(1));\n  //\
    \ Matrix D, constant speed model and Delta t = 1.\n  CIMg<> D = CIMg::identity_matrix(4);\n\
    \  D(2,0) = D(3,1) = 1;\n  // Matrix M.\n  CIMg<> M = M(4,2,1,1,0);\n  M(0,0)\
    \ = M(1,1) = 1;\n  CIMg<> Mt = M.get_transpose();\n  // Covariance of the model.\n\
    \  CIMg<> SigmaD = CIMg::identity_matrix(4)*5;\n  SigmaD(2,2) = SigmaD(3,3) =\
    \ 1;\n  // Covariance of the measure.\n```"
