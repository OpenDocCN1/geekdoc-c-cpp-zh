  md: '# 10. 3D Visualisation


    The ClImg library has basic capabilities for visualizing and rendering 3D mesh
    objects, which can help the developer represent complex image data. In this chapter,
    we propose a quick tour of these possibilities, first describing the general principles
    governing the creation of 3D mesh objects, and then detailing the way these objects
    are internally represented in the library. Several examples are proposed to illustrate
    different practical use cases.


    # 10.1 Structuring of 3D mesh objects


    A 3D mesh object is completely defined with ClImg by the union of four distinct
    structures:


    +   A set of 3D points, defining the N vertices of the object. The 3D coordinates
    of these points are stored in a ClImg<T> image of size $N \times 3$, where T is
    most often float (the coordinates of 3D vertices being generally decimal numbers).


    +   A set of P primitives, composing the object. Each primitive can be a: quadrangle,
    triangle, segment, point, sphere (perfect sphere) or sprite (small image). Segments,
    triangles and quadrangles can be textured. This is stored as a ClImg<T> of P images,
    each representing a single primitive of the object. The type T is usually unsigned
    int, because each of these images contains the set of indices of the 3D vertices
    composing the primitive.


    +   A set of P materials, defining either the color or the texture of each primitive.
    This set is stored as a list of ClImgList<T> images, each representing the material
    of a single primitive. The type T is usually unsigned char, because 3D objects
    are drawn or visualized most often in 8-bit per component ClImg<unsigned char>
    images.


    +   A set of P opacities, defining the transparency level of each primitive in
    the object. This set is stored as an image ClImg<T> of size $1 \times P$, or as
    a list of'
