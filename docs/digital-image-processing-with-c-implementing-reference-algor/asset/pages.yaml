  md: '# Preface


    For teachers, researchers, students or engineers, this book will provide you with
    an introduction to the vast field of image processing, as well as an introduction
    to the ClImg library for the development of state-of-the-art algorithms.


    This book is expected to spark new passions for image processing, e.g., for beginners
    or more experienced C++ developers who are interested in getting started in this
    discipline. This book will also shed new light on the field of image processing
    for users and readers interested in recent advances in artificial intelligence,
    deep learning, and neural networks. You will learn, for example, that it is not
    necessary to have a neural network with 500 million weights, not a million training
    images, to extract the edges of an image, to segment it, to detect geometric features
    as segments and circles, or objects located in it, to estimate displacement vectors
    in video sequences, etc. And even better, you will be able to study the implementations
    of corresponding algorithms, disseminated and explained throughout this book,
    made with the ClImg library, while testing them on your own data.


    Exploring an exciting branch of science like image processing, in a reproducible
    way, with a free library as ClImg, is a valuable gift that the authors are offering
    us. I personally dreamed about it. They made it happen ! I would like to thank
    them because with this book, digital image processing is not only given a new
    life but opens new perspectives for a bright future.


    Rachid Deriche

    Sophia Antipolis, June 22, 2022.'
