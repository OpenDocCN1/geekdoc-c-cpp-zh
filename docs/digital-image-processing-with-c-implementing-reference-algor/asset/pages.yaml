    # 7.2 Region-based approaches


    # 7.2.1 Introduction


    In region-based approaches, pixels with homogeneous features are assigned to the
    same region or generally to the same class. In the example of Fig. 7.3, the original
    image (Fig. 7.3a) is composed of two textures. By using the gradient norm as a
    feature for a pixel (Fig. 7.3b) we obtain information that is impossible to use
    to segment the image correctly (i.e., to separate the two textures). Conversely,
    by using the local variance of the image, segmentation becomes possible (Fig.
    7.3c).


    ![](img/6b7de6c7ce31f7bb2927e7184da0492f_179_0.png)


    Figure 7.3 – Region-based approach (synthetic case). (a) original image, (b) using
    gradient, (c) using local variance.


    The feature is a concept (most often a vector $x_i \in \mathbb{R}^d$) that we
    attach to each pixel $i$ of the image. The computation of features consists in
    characterizing the pixel relative to its intensity (Chapter 3), its gradient (Section
    5.1), attributes of geometric type (Section 6.1), texture (Section 6.3) or any
    other value depending on the location. In the vector, several types of features
    can coexist.


