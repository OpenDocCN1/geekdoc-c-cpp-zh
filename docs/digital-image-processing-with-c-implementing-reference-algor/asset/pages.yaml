  md: '# 6. Feature Extraction


    Features play a central role in image processing. These numerical values, derived
    from direct calculations on the image, allow:


    +   - to represent each pixel by a vector $x_i \in \mathbb{R}^d$, each of the
    components reflecting a feature relevant to the problem at hand;

    - to detect points of interest in the image, for further processing (registration,
    matching, ...).


    We illustrate the first aspect in Sections 7.2 and 6.3. We focus on the second
    aspect in the two other sections of this chapter, and we more particularly search
    for particular geometric objects (points, shapes) in the image. First, we detail
    a method dedicated to the detection of points of interest and more particularly
    corners. Then we focus on a method for the detection of parametric shapes in images,
    allowing to locate example lines, circles or ellipses.


    # 6.1 Points of interest


    Points of interest, especially corners, represent key information for many applications
    such as object tracking, stereo image matching, geometric feature measurement
    or camera calibration.


    # 6.1.1 Introduction


    A corner in an image can be seen as a point for which there are two dominant and
    different contour directions in a local neighborhood. Even if this definition
    seems simple, and even if our visual system is good at detecting these features,
    automatic corner detection is not an easy task for a computer. A good detector
    must meet many criteria, including low false detection, robust detection to illumination
    changes, noise, partial occlusions, accurate precision constraint, and an implementation
    allowing real time detection.


    Numerous corner detection methods have been proposed in the literature and most
    of them are based on the following principle: while a contour is classically defined
    by'
