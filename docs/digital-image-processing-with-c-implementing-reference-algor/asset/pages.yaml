  md: '# Digital Image Processing with C++


    Digital Image Processing with C++: Implementing Reference Algorithms with the
    Clmg Library presents the theory of digital image processing and implementations
    of algorithms using a dedicated library. Processing a digital image means transforming
    its content (denoising, stylizing, etc.) or extracting information to solve a
    given problem (object recognition, measurement, motion estimation, etc.) This
    book presents the mathematical theories underlying digital image processing as
    well as their practical implementation of algorithms implemented in the C++ language
    using the free and easy-to-use Clmg library.


    Chapters cover the field of digital image processing in a broad way and propose
    practical and functional implementations of each method theoretically described.
    The main topics covered include filtering in spatial and frequency domains, mathematical
    morphology, feature extraction and applications to segmentation, motion estimation,
    multispectral image processing and 3D visualization.


    Students or developers wishing to discover or specialize in this discipline and
    teachers researchers hoping to quickly prototype new algorithms or develop courses
    will all find in this book material to discover image processing or deepen their
    knowledge in this field.


    David Tschumperlé is a permanent CNRS research scientist heading the IMAGE team
    at the GREYC Laboratory in Caen, France. He is particularly interested in partial
    differential equations and variational methods for processing multi-valued images
    in a local or non-local way. He has authored more than 40 papers in journals and
    conferences and is the project leader of Clmg and G''MIC, two open-source software/libraries.


    Christophe Tilmant is associate professor in computer science at Clermont-Auverne
    University. His research activities include image processing and artificial intelligence,
    where he has authored more than 30 papers. His teaching includes deep learning,
    image processing and network security. He participates or leads several French
    research programs.


    Vincent Barra is a full professor in computer science at Clermont-Auverne University
    and associate director of the LIMOS Lab. He teaches artificial intelligence and
    image processing in engineering schools and master’s programs. His research activities
    focus on n-dimensional data analysis with methodological and application aspects
    in various fields. He has authored more than 90 papers in journals or conferences
    and participates or leads several French and European research programs.'
