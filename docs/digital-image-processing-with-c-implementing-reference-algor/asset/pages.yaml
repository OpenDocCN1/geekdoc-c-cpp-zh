  md: '# 7.2 Region-based approaches


    When all the regions of an image verify $\mathscr{P}$, we say that the partition
    is verified. Of course, there is a very large number of partitions which verify
    this property (for example, it is enough to subdivide any region of a partition
    which verifies $\mathscr{P}$ to obtain a new valid partition), and we do not know
    how to find all these partitions, nor how to theoretically choose among the partitions
    verifying $\mathscr{P}$ the one which solves the segmentation problem.


    Empirical criteria are often used, such as the evaluation of the cardinal of the
    partition (to be minimized), the size of the smallest region (to be maximized),
    an inter-region distance... In the absence of a defined strategy, there are some
    general methods for region transformation.


    +   Region growing: starting from seeds, we successively apply to the predicates
    more severe than $\mathscr{P}$. Thus, we start to associate with the seeds only
    the pixels which are in good agreement with the predicate. We reduce this severity
    progressively, and we get closer and closer to $\mathscr{P}$. The ClImg method
    ClImg<T>::draw_fill() implements this approach.


    +   Region splitting: in a region splitting approach, we consider the whole image
    as a region $R$, to which we apply several divisions $\delta$ producing $R_\delta^S$
    regions. We test on the $R_\delta^S$ and retain the best subdivision, i.e., the
    one that leads to regions verifying all $\mathscr{P}$, or the one that gives the
    most regions verifying $\mathscr{P}$, or, if none of the $R_\delta^S$ verify $\mathscr{P}$,
    the one which will provide the best value to a criterion failed criterion (mean
    of variance tested in predicates). The strategies of division $\delta$ are numerous
    and include divisions by image triangulation or quadtree decomposition. Chapter
    2 shows how to implement such an algorithm.


    +   Region merging: merging techniques are bottom-up methods during which all
    pixels are verified. For each pixel neighborhood, $\mathscr{P}$ is tested, and
    if so the corresponding pixels are grouped in a region. After the image has been
    merged, the groups of neighborhoods are given the same test, and are joined together
    if $\mathscr{P}$ is verified. The process is iterated until stability is reached
    (i.e., when no region merges with another). The tests of union of regions are
    in general statistical tests. We often assume that they are Gaussian noise with
    constant mean and in this case the usual statistical tests are the $\chi^2$, the
    Wilcoxon test, the Student or Fisher-Necdor test.


    +   Split-and-merge approaches: in order to benefit from the advantages of the
    region splitting and merging approaches, both techniques can be combined into
    a split-and-merge algorithm which, in a first phase, over-segments the image according
    to a very strict predicate and then clusters adjacent regions according to a smoother
    predicate.'
