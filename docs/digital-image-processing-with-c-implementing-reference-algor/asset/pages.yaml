    # ASSIGNMENT OF THE CENTROIDS TO THE IMAGE PIXELS


    Once the centroids are initialized, it is possible to assign each pixel of the
    image a label i attaching to the centroid ci. We take advantage of the fact that
    the centroids are scattered in the image, but not to test the attachment of each
    pixel to all the existing centroids, but only to those present in a neighborhood
    of this pixel (size 2Sx). This greatly reduces the number of evaluations of the
    objective function to test these pixels. However, it happens that some pixels
    are outside these neighborhoods, and they are labeled in a second step in a more
    conventional way, by testing them against all centroids (code 7.13).


