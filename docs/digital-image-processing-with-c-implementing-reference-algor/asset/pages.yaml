    \na) Input image $224 \times 171$ b) Selection of 1187 samples c) RBF interpolation\n\
    \nFigure 11.15 – Example of reconstruction of a 2D image from a set of sparse\
    \ samples, using RBF interpolation.\n\nWhen the function $f : \\mathbb{R}^n \r\
    ightarrow \\mathbb{R}^p$ is vector-valued (e.g., color images), we can estimate\
    \ the $K \times p$ required weights $w_k^p$ at once, by solving the linear system\
    \ $\\mathbf{F} = \\mathbf{MW}$, where $\\mathbf{F}$ and $\\mathbf{W}$ have columns\
    \ rather than a single one, one column for each vector component of the function\
