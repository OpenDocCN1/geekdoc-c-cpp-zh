    \ these images to 0, then applying a\bitwise OR between the output and the image\
    \ of the text to produce an image, visually\ndistinguishable from the original\
    \ one, which contains the hidden text (Fig. 3.6c). To\ndecode the message, a bitwise\
    \ AND is applied with the value 1 to recover the message\n(Fig. 3.6d). Code 3.3\
