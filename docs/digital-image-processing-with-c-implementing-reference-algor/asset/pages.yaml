  md: "# Chapter 8. Motion Estimation\n\n```\nCImg<> SigmaM = CImg<>::identity_matrix(2)*50;\n\
    \n// A priori estimation of the error.\nCImg<> PkPrevious(4,4,1,1,0);\n\n// A\
    \ posteriori estimation of the error.\nCImg<> PkCurrent(4,4);\nfor (int i = 1;\
    \ i<I.size(); ++i) {\n    // Prediction.\n    currState = D+prevState;\n    PkCurrent\
    \ = SigmaD + D*PkPrevious*D.get_transpose();\n\n    // Correction.\n    CImg<>\
    \ Kt = PkCurrent*((M*PkCurrent+Mt+SigmaM).get_invert())\n    currState = currState\
    \ + Kt*(estimPos - M*currState);\n    CImg<> I = (int)identity_matrix(PkCurrent.width());\n\
    \    PkCurrent = (I - Kt)*PkCurrent;\n\n    // Update of the position.\ncurrPos(0)\
    \ = (int)currState(0)\ncurrPos(1) = (int)currState(1)\nprevPos(0) = (int)currState(0)\n\
    prevPos(1) = (int)currState(1)\nprevState = currState;\nPkPrevious = PkCurrent;\n\
    }\n```\n\nIn general, the Kalman filter quantifies the uncertainty in the state\
    \ estimate. This information allows the point detector to automatically size the\
    \ region of interest for the primitive in the next image. This region is centered\
    \ on the best estimated position and its width is proportional to the uncertainty.\
    \ In a properly designed filter, the value of this uncertainty decreases rapidly\
    \ with time and the region shrinks accordingly.\n\n+   Two problems arise for\
    \ the actual implementation of this algorithm:\n- missing data: filtering relies\
    \ on prior knowledge of s_0 and Σ_{d,0,m,0}.\n- the data association problem:\
    \ in the presence of several primitives of interest (points, curves) and several\
    \ measurements, which should be associated with which primitive?\n\nTo manage\
    \ occlusions, it is possible to modify the algorithm, by varying Σ_{m,i} according\
    \ to the maximum correlation found: if the latter is low, then the diagonal terms\
    \ can be set to very large values."
