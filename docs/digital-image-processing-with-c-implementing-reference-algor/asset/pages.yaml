    In order not to modify the intensity of the homogeneous areas, coefficients are
    chosen to satisfy $\sum_{k=1}^{N} c_k = 1$. In the case the image is homogeneous
    without transition and if the noise can be locally modeled by a white noise of
    density $f$ and distribution function $F$, it is possible to optimize the choice
    of $c_k$ in the sense of a quadratic error criterion. It can be shown that the
    power noise at the output of an optimal L-filter is always less or at equal to
    that of the best linear filter (mean filter). The values of the optimal coefficients
    depend on the shape of $f$:


    +   - For a Gaussian noise of variance $\sigma^2, \forall k \ c_k = \frac{1}{N}$
