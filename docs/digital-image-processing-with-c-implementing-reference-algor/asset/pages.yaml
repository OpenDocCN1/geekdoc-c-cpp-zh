  md: '# Data driven energies


    The information from the image can be derived from data extracted along the $\gamma$
    contour (curvilinear integral) or within $R_{\gamma}$ (surface integral). The
    associated energies are called “boundary” energy or “region” energy, respectively.


    For the boundary term, the function $f$ usually defined in the curvilinear integral
    is the stopping function. It depends on a derivative operator, for which the norm
    of the gradient, which has a maximum response on the amplitude jumps in the image;
    it decreases when the operator increases and theoretically tends toward zero when
    it tends to infinity. In practice, the following form is commonly used:


    ```

    $f(\mathbf{m}) = \frac{1}{1+\|\nabla(\mathbf{m})\|^p}$

    ```


    $\hat{I}$ is a regularized version of $I$ (for example, a Gaussian smoothing version
    of the image) and the power $p$ is generally chosen to be 1 or 2. The corresponding
    model is called geodesic active contour [6].


    # 7.1.2 Implicit representation of a contour


    The mathematical representations of a contour can be divided into three classes:


    +   - explicit representation (polygonal approximation ...)

    - parametric representation (Fourier descriptors, B-splines ...)

    - implicit representation (level set).


    The *level set* method is an analytical framework for the geometric evolution
    of objects. Instead of using a classical Lagrangian representation through a scalar
    function $\psi$ defined on a fixed grid, the *level set* method describes them
    through a scalar function. The evolution equation, formalized as a partial differential
    equation, is constrained by a velocity field imposed in the normal direction of
    the contour. This field is constructed in such a way as attract the model to the
    objects to be extracted in the image under geometric regularization constraints.
    The normal and curvature of the contour at each point are easily defined from
    the geometric differential properties of this representation.


    One of the main advantages of the implicit contour description is that inherently
    handles topological changes during convergence. For example, if a segmentation
    process is initialized by multiple seeds, collisions and merges of related components
    are automatically managed without modification of the algorithm, which is not
    the case for example with active contours with explicit representation. The counterpart
    of this flexibility is an additional cost in computation time, which requires
    in practice the use of optimized algorithms [37].'
