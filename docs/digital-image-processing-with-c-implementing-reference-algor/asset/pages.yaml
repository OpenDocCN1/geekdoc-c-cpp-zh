    # 3.2.3 Local histogram specification


    The previous method assigns an ideal gray level to all pixels with the same gray
    level in the input image $I$. The regions in the transformed image then have sharp
    boundaries, which may not follow the original boundaries in $I$. To overcome this
    problem, it is possible to compute the histogram only in a neighborhood of a pixel,
    and to apply the specification to this central pixel only. This simple modification
    leads to the definition of spatial image processing techniques, which will be
    illustrated in Section 5.1 in the case of spatial filtering.


