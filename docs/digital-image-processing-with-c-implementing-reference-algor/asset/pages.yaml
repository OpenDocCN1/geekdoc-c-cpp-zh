    # 4.2 Gray-level images


    Now $A = I$ is a gray-level image and $B$ is a gray-level structuring element
    (a function).


    > Definition 4.2.1 The dilation of $A$ by $B$ is defined by


    ```

    $(A \oplus B)(s,t) = \max_{(s-x),(t-y)\in D_I,(x,y)\in D_B} \{I(s-x,t-y) + B(x,y)\}

    ```


    where $D_I$ (resp. $D_B$) is the image (resp. the structuring element) domain.
    Serra [36] proposed to illustrate this definition on 1D functions (Fig. 4.7, where
    $I=f$), for which the previous formula is rewritten


    ```

    $(A \oplus B)(s,t) = \max_{(s-x)\in D_I,x\in D_B} \{I(s-x) + B(x)\}

    ```


    One can define well the gray-level erosion of an image by a gray-level structuring
    element


    > Definition 4.2.2 The erosion of $A$ by $B$ is defined by


    ```

    $(A \ominus B)(s,t) = \min_{(s+x),(t+y)\in D_I,(x,y)\in D_B} \{I(s+x,t+y) - B(x,y)\}

    ```


    and the corresponding 1D dilation is proposed in Fig. 4.8.'
