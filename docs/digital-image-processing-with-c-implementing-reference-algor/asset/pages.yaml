    # 6.3 Texture features


    Texture is a feature implicitly used by the human perception to recognize and
    characterize surfaces. A texture refers mostly to the repetition of one or more
    patterns at different relative spatial positions, the repetition involving variations
    in scale, orientation or geometric and optical properties. A texture can be described
    in three ways:


    +   - a visual aspect, which describes its "geometry" (smooth, rough, coarse,
    fine, ...);

    - a constitutive aspect, which describes if/how the texture is generated by simple
    patterns (primitives or texels);

    - an informational aspect, which quantifies the statistical characteristics of
    the texture.'
