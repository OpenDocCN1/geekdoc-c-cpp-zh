  md: '# 1. Introduction


    WHOM IS THIS BOOK FOR?


    With this book, we would like to offer you an enchanting, yet pragmatic walk through
    the wonderful world of image processing:


    +   - Enchanting, because image processing is a vast and captivating universe,
    resting on diversified but solid theoretical bases, which are used as well as
    to model and propose efficient algorithms to solve problems. The number of amusing
    and/or practical applications that can be imagined and implemented in image processing
    is potentially infinite.

    - Pragmatic, because we do not want to make a simple overview of the different
    formalisms. We will try to make each of the techniques discussed tangible, by
    systematically “translating” the theoretical points presented in the form of functional
    and usable C++ programs.


    This intertwining of theory and implementation is the essence of this book, and
    its content is therefore intended for a variety of readers:


    +   - C++ Programmers, beginners or experts, amateurs of applied mathematics,
    wishing to study the discipline of image processing, to eventually develop concrete
    applications in this field.

    - Mathematicians, or image processing makers, wishing to confront the practical
    problem of software implementation of the various methods of the domain in C++,
    a language universally recognized as being generic, powerful and fast at execution.

    - Teachers or students in computer science and applied mathematics, who will find
    in this book the basic building blocks to develop or perform their practical work.

    - Developers or experienced researchers, for whom the ClImg library described
    in this book will be an ideal companion for rapid and efficient prototyping of
    new innovative image processing algorithms.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'It is important to underline that we will only use simple concepts of the C++
    language and that the proposed programs will therefore be readable enough to be
    easily transcribed into other languages if necessary. The ClImg library, which
    we rely on, has been developed for several years by researchers in computer science
    and image processing (from CNRS - French National Centre for Scientific Research,
    INRIA - French National Institute for Research in Digital Science and Technology,
    and the University), mainly allow rapid prototyping of new algorithms. It is also
    used as a development tool in the practical work of several courses given at the
    bachelor’s, master’s or engineering school level. It is therefore perfectly adapted
    to the pedagogical approach that we wish to develop in this book.


    The book is structured to allow, on the one hand, a quick appropriation of the
    concepts of the ClImg library (which motivates the first part of the book), and
    on the other hand, its practical use in many fields of image processing, through
    various workshops (constituting the second part of the book). The set of examples
    proposed, ranging from the simplest application to more advanced algorithms, helps
    developing a just know-how in theory, algorithmic and implementation in the field
    of image processing. Note that all the source codes published in this book are
    also available in digital format, https://github.com/ClImg-Image-Processing-Book.


