  md: '# Chapter 8. Motion Estimation


    # ANALYSIS IN THE FOURIER SPACE


    Using the properties of the Fourier space (Section 5.3.2), this relation can be
    written as:


    ```

    $$\hat{F}_2(f_x, f_y) = \hat{F}_1(f_x, f_y) \times e^{-j2\pi(f_xt_s+f_yt_s)}$$

    ```


    The Fourier transforms of both images have the same modulus but above all have
    a phase difference directly related to the translation. This change in phase allows
    us to estimate the translation, hence the name of the method.


    The use of the cross-power spectrum isolates this phase difference. It is calculated
    from the two images $I_1$ and $I_2$:


    ```

    $R(f_x, f_y) = \frac{\hat{F}_1(f_x, f_y)\overline{\hat{F}_2(f_x, f_y)}}{\||\hat{F}_1(f_x,
    f_y)\|\\||\hat{F}_2(f_x, f_y)\|}}$

    ```


    We have then


    ```

    $$R(f_x, f_y) = \frac{\hat{F}_1(f_x, f_y)\overline{\hat{F}_2(f_x, f_y)}}{\|||\hat{F}_1(f_x,
    f_y)\|\\||\hat{F}_2(f_x, f_y)\|\\|} = \frac{\hat{F}_1(f_x, f_y)\overline{\hat{F}_1(f_x,
    f_y)} \times e^{-j2\pi(f_xt_s+f_yt_s)}}{\|||\hat{F}_1(f_x, f_y)\|\\|\|\hat{F}_2(f_x,
    f_y)\|\\|}^2} = e^{-j2\pi(f_xt_s+f_yt_s)}$$

    ```


    Here, the cross-power spectrum has a very interesting form since it is a pure
    monochromatic wave in Fourier space. Then, the inverse Fourier transform will
    be a Dirac distribution localized to the value of the corresponding shift. The
    inverse Fourier transform of the cross-power spectrum is called the phase correlation,
    denoted by $r$ \hat{r}(f_x, f_y) = R(f_x, f_y)$. Thus, we obtain:


    ```

    $$r(x, y) = \delta(x+t_s, y+t_s)$$$

    ```


    Finally, to estimate the translation between two images, it is sufficient to search
    for the maximum of their phase correlation. Algorithm 5 summarizes this method.


    Code 8.8 implements the calculation of the phase correlation for the translation
    between two images.


