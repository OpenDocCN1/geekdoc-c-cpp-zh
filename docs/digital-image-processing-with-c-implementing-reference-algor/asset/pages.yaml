  md: '# Introduction


    At first sight, this conception may seem surprising: in C/C++, the libraries that
    one encounters are generally organized in the form of one or more header files
    (most often, one header file per structure or class defined by the library), completed
    by a binary file (.a or .so files in Linux, .lib or .dll files under Windows),
    which contains the library''s functions in compiled form.


    Our experience with CImg has shown that the first question raised by new users
    of the library is: “Why is everything in one file?”. Here we answer this frequent
    question, by listing the technical choices justifying this kind of structuring,
    and by pointing out the advantages (and disadvantages) of it. The general answer
    takes into account several different aspects of the C++ language, and requires
    consideration of the following points:


    +   1. Why doesn''t CImg propose a pre-compilation of its functions as .a, .so
    or .dll file(s)?


    Because the library is generic. The CImg<T> image and CImgList<T> structures exposed
    by the library have a template parameter T, which corresponds to the type of pixels
    considered for these images. However, the types T that will be used by the CImg
    classes are a priori unknown.


    Of course, the most commonly used T are in practice the basic C++ types for representing
    numbers, like: bool (Boolean), unsigned char (unsigned 8-bit integer), unsigned
    short (unsigned 16-bit integer), short (signed 16-bit integer), unsigned int (unsigned
    32-bit integer), int (signed 32-bit integer), float (float value, 32-bit), double
    (float value, 64-bit), etc. However, it is not uncommon to see source codes that
    use images of other types, such as CImg<void*>, CImg<unsigned long long> or CImg<std::complex>.


    One might think that pre-compiling of the two classes CImg<T> and CImglist<T>
    for these or so many common types T would be a good idea. It is to overlook the
    fact that many of these methods use as arguments whose types are themselves CImg<t>
    images or CImgList<t> image lists, with another template parameter t potentially
    different from T.


    For instance, the method


    ```

    CImg<T>::warp(CImg<t>, unsigned int, unsigned int, unsigned int)

    ```


    applies an arbitrary deformation field to an image CImg<T>. It is common to use
    this method to deform an image of type CImg<unsigned char> (classic color image,
    with 8 bits/channel), passing as argument a deformation field of type CImg<float>,'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'which contains deformation vectors with floating-point precision (sub-pixel).


    One can easily see that the multiplicity of possible combinations of types for
    the arguments of the library''s methods makes it unwise to precompile these functions
    in the form of binary files. The size of the generated file(s) would simply be
    huge, and the functions actually used by the programmer in practice would only
