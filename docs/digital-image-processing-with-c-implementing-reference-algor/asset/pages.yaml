    # 11.2.3 Algebraic tomographic reconstruction


    Analytical tomographic reconstruction techniques model the problem in continuous
    form as opposed to algebraic techniques which approach the problem directly in
    numerical form.


    # GEOMETRIC MODELING - MATRIX FORMULATION


    The modeling of the problem can be written directly in matrix form:


    ```

    $$\mathbf{p} = \mathbf{Af where} \begin{cases} \mathbf{p} &=& \begin{pmatrix}
    p_1, & \dots, & p_M \end{pmatrix}^T \ \mathbf{f} &=& \begin{pmatrix} f_1, & \dots,
    & f_N \end{pmatrix}^T \ \ \mathbf{A} &=& \begin{pmatrix} a_{11}, & \dots, & a_{1N}
    \ & & \ a_{M1}, & \dots, & a_{MN} \end{pmatrix} \end{cases} (11.1)$

    ```


    In Equation 11.1, the values of the $N$ pixels of the image to be reconstructed
    are stored in the vector $\mathbf{f}$. They are linked to the $M$ measurements
    which are stored in the vector $\mathbf{p}$ through the projection matrix $\mathbf{A}$.


    The projection matrix allows to model the acquisition system: the coefficient
    $a_{i,j}$ gives the contribution of the pixel $j$ in the measurement $i$. This
    modeling is illustrated in Fig. 11.7. The major interest of this modeling concerns
    the beams where we can take into account the geometry (non-parallel geometries),
    the physical phenomena (attenuation, scattering, ...) and the response of the
    acquisition system.'
