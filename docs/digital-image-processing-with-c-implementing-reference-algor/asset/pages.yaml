  md: "# 5.1.5 Adaptive window filters\n\nIn the case of adaptive window filters,\
    \ we search around each pixel for the most suitable window for filtering, either\
    \ by selecting a family of windows the most suitable one (e.g., Nagao, Kawahara),\
    \ or by growing a window and controlling its growth (e.g., Wu).\n\nNagao filter\n\
    \nWe work on a neighborhood of fixed size (usually $5 \times 5$) surrounding the\
    \ central pixel. We then define in this neighborhood 9 possible windows, all 9\
    \ pixel sizes, identified by an index $k$ (Fig. 5.10). On each window we measure\
    \ the mean $\\mu_k$ and the variance $\\sigma_k$, and we replace the gray level\
    \ of the central pixel by the mean $\\mu_k$ whose index minimizes the variance\
    \ (Code 5.4).\n\nKawahara filter\n\nIt is a variant of the Nagao filter, where\
    \ only the definition of the neighborhoods changes (Fig. 5.11), Code 5.5 realizes\
    \ this filter, and Fig. 5.12 proposes a comparison of these two filters on a noisy\
    \ image.\n\nWu filter\n\nThis filter uses a homogeneity predicate on a region\
    \ (often a measure of variance). It starts from a window of size $3 \times 3$,\
    \ and extends it into a window of size $(2k+1) \times (2k+1)$ until the predicate\
    \ is not verified anymore. In this case, the cause of heterogeneity is searched:\
    \ if it is present only on one side of the window, the filter extends the window\
    \ rectangularly by forbidding this side; if two adjacent sides are heterogeneous,\
    \ the extension is done according to a triangle. When the window can no longer\
    \ grow, the gray level of the central pixel is replaced by the average of the\
    \ gray levels of the final window."
