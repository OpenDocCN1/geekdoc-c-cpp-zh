  md: "In the literature, many works try to describe textures by their frequency and/\
    \ spatial aspects (e.g., Gabor filters or wavelets) or statistical aspects (Markov\
    \ field models). We propose here to describe simple methods that compute, for\
    \ each pixel of an image, quantities allowing to characterize the underlying texture.\
    \ These quantities are used to segment textures (by a region segmentation method\
    \ using these quantities as features, see Section 7.2), or computed on the whole\
    \ image to allow Content Based Image Retrieval (CBIR).\n\nTexture measures elementary\
    \ pattern, and these methods are therefore based on indices computed in spatial\
    \ neighborhoods of each pixel.\n\n# 6.3.1 Texture spectrum\n\nThe approach proposed\
    \ by [17] is a feature extraction method and texture classification. Each pixel\
    \ x of $I$ is compared to its neighbors $x_i$ in a mask of a given size (and usually\
    \ odd, here of size $3\\times3$ pixels), using a threshold $\tau$. For $i\\in[1,8]$,\
    \ the quantity $E_i$ is defined:\n\n$E_i = \\begin{cases} 0 & \\text{if } I(x_i)\
    \ < I(x) - \\tau \\ 1 & \\text{if } |I(x) - I(x_i)| < \\tau \\ 2 & \\text{otherwise}\
    \ \\end{cases}$\n\nThe vector $(E_1 \\dots E_8)^T$ gives a texture unit. Each\
    \ $E_i$ can take 3 values, so there are $3^8=6561$ possible texture units. We\
    \ choose to identify a given unit by its representation in base 3: $N(x)=\\sum_{i=1}^8\
    \ E_3^{i-1}$, and we assign this value to the central pixel (Code 6.7). The distribution\
    \ $S$ of $N(x)$ is called the texture spectrum of $I$. The parameter $\tau$ allows\
    \ to encode the notion of homogeneity in an area, in a different way than the\
    \ equality $I(x)=I(x_i)$ (Fig. 6.9).\n\n```\nCode 6.7 Texture unit and spectrum.\n\
    unsigned char valE(float vall1, float val2, float tau)\n{\n    return vall1<val2\
    \ - tau ? 0 : cimg:abs(vall - val2)<tau ? 1 : 2;\n}\n\nimg<> TextureUnit(Cimg<&\
    \ imgIn)\n{\n    Cimg<unsigned char> E(8);\n    Cimg<> N(imgIn);\n    Cimg_3x3(I,float);\n\
    \    float tau = 5;\ncimg_for3x3(imgIn,x,y,0,0,I,float)\n}\n```"
