    \ the only one, and for example, Perona and Malik proposed $g_2(x) = e^{-(\\lambda\
    \ x)^2}$. The parameter $\\lambda$ allows to define the level of contrast (through\
    \ the norm of the gradient of the image) which reduces the diffusion phenomenon.\
