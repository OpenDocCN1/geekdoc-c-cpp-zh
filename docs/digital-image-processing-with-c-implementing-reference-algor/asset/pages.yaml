    # 11.3 Stereov


    Stereision is a set of image analysis techniques aiming at retrieving information
    about the 3D structure and depth information of the real world from two (or more)
    images acquired from different points of view (parallax). Far from being exhaustive,
    we address two classical problems: the search for matching points between two
    images and the estimation of the depth of objects.


    # 11.3.1 Epipolar geometry


    Epipolar geometry (Fig. 11.10) models the geometric relationships of different
    images of the same scene, taken from different observation points. It allows to
    describe the dependencies between the pixels in correspondence, i.e., those formed
    by a single point of the 3D scene observed on each of images.

    Let $I_1$ and $I_2$ be two images from two perspective cameras $C_1$ and $C_2$
    observing the same scene. Let $P_1$ and $P_2$ be the projection matrices corresponding
    to these two images. A point $m \in \mathbb{R}^3$ of the 3D scene is projected
    in $m_1 = P_1m$ on $I_1$ and $m_2 = P_2m$ on $I_2$, where $m_1$ and $m_2$ are
    expressed in homogeneous coordinates. In the following, we are interested in the
    links between $m_1$ and $m_2$. These links are characterized by the epipolar geometry
    which follows from the epipolar constraint.'
