  md: "# 4.1 Binary images\n\nLet $A, B \\subset \\mathbb{Z}^2$ be two subsets, elements\
    \ are denoted $\\mathbf{a} = (a_1, a_2)^\top$ and $\\mathbf{b} = (b_1, b_2)^\t\
    op$:\n\n+   * the translation of $A$ by $x = (x, y)^\top$, denoted $(A)_x$ is\
    \ $(A)_x = \\{\\mathbf{c} = a+x, \\mathbf{a} \\in A\\}$\n* the reflection of $B$,\
    \ denoted $B'$ is $B' = \\{-\\mathbf{b}, \\mathbf{b} \\in B\\}$\n* the complement\
    \ of $A$, denoted $A^C = \\{\\mathbf{x}, \\mathbf{x} \notin A\\}$\n* the difference\
    \ of $A$ and $B$ is $A \\setminus B = A \\cap B^C = \\{\\mathbf{x}, \\mathbf{x}\
    \ \\in A, \\mathbf{x} \notin B\\}$\n\nIn this section, $A$ is a binary image and\
    \ $B$ a binary shape operator.\n\n# 4.1.1 Dilation and erosion\n\n> **Definition\
    \ 4.1.1** The dilation of $A$ by $B$, denoted $A \\oplus B$ is set defined by\n\
    \n$$A \\oplus B = \\{\\mathbf{x}, (B')_x \\cap A \neq \\emptyset\\}$\n\n> **Definition\
    \ 4.1.2** The erosion of $A$ by $B$, denoted $A \\ominus B$ is set defined by\n\
    \n$$A \\ominus B = \\{\\mathbf{x}, (B)_\\mathbf{x} \\subseteq A\\}$\n\n$B$ is\
    \ the shape operator, also known as the *structuring element* in mathematical\
    \ morphology.\nTo be clear, for a binary object $A$ and a binary symmetric structuring\
    \ element $B$, the simple operations of mathematical morphology consist in going\
    \ through the image and considering $B$ as a binary mask: if, centered in $x$,\
    \ $B$ intersects $A$, the value of the dilation of $A$ by $B$ in $\\mathbf{x}$\
    \ is 1, or 0 otherwise. Similarly if $B$ is not fully enclosed in $A$, the value\
    \ of the erosion of $A$ by $B$ in $\\mathbf{x}$ is 0, and 1 otherwise (Fig. 4.1).\
    \ Thus, erosion shrinks $A$, and dilation extends it, according to $B$.\n\nWhen\
    \ $B$ is not symmetric, the reflection of the structuring element must be taken\
    \ into account (Fig. 4.2).\n\nIt is easy to show that erosion is the dual transformation\
    \ of dilation versus complement: $A \\ominus B = (A^C \\oplus B^C)^C$. Thus, it\
    \ is equivalent to erode an object or to dilate its complement.\n\nThe implementation\
    \ in $CImg$ uses the dedicated methods $CImg<T>::erode()$ and $CImg<T>::dilate()\
    \ (code 4.1).\n\n```\nCode 4.1 - Erosion and dilation.\n```\n\n```\nCImg<unsigned\
    \ char> img(\"yin.png\");\n// Structuring element. Here a 3*3 square.\n```"
