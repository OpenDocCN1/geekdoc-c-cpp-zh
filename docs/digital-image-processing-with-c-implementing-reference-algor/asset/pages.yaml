    # 11.4 Interactive deformation using RBF


    # 11.4.1 Goal of the application


    The goal of this last section is to develop an interactive “deforming mirror”
    application, allowing the user to visualize and modify, in real time, images coming
    from his webcam. The idea is to allow the addition and displacement of keypoints
    that model the desired local deformation, as illustrated in Figure 11.14.


    ![](img/6b7de6c7ce31f7bb2927e7184da0492f_289_0.png)


    Figure 11.14 – Goal: Develop an interactive deforming mirror application, getting
    images from the webcam.


    To implement this application, three main components are required:


    +   1. The ability to access the image stream from the webcam. With CImg, this
    is made easy by using the CImgCV::load_camera() method, which nearly uses functions
    of the OpenCV library to access the image stream. When compiling the program,
    all you need to do is enable the cimg_use_opencv macro, and link the executable
    with the OpenCV libraries to make use of this functionality.


    +   2. The implementation of a function to generate a dense displacement field
    - of the size of the image - from a list of user-defined keypoints. The theoretical
    description and implementation of such a function are described in Sections 11.4.2
    and 11.4.3.'
