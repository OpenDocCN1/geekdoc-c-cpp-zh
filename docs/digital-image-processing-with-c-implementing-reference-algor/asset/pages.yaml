    the development of a simple C++ source code example (about 100 lines), to implement
    a basic image processing application. This example has been chosen to maximize
    the use of the different classes and concepts of the library, without actually
    requiring advanced knowledge in image processing. At the end of this tutorial,
    you will have sufficient experience with Clmg to start building your own applications:
    you will quickly realize that Clmg is easy to use, not based on complex C++ concepts,
    and therefore perfectly suited to discover, learn and teach image processing,
    as well as to build prototypes or more elaborate applications in this field.


    Let us first explain the purpose of the application, the details of its C++ implementation.


    # 2.1 Objective: subdivide an image into blocks


    A 2D digital image is represented as a 2D array of pixels, usually in grayscale
    or color. If we want to analyze the global geometry of an image (e.g., to detect
    its contours or compress its data), it can be interesting to subdivide the image
    into several regions of interest, each having its own characteristics (flat area,
    contours, etc.). The image decomposition into blocks is one of the simplest ways
    to achieve this subdivision: we try to split the image into several square (or
    rectangular) areas of different sizes, such that the large rectangles contain
    few locally complex structures (rather flat area), while the small blocks focus
    on the contours and textures of the various elements present in the image.


    Our goal here is to implement such a decomposition in blocks of a color image,
    but also to propose an interactive visualization of this decomposition. The visualization
    will let the user explore each extracted block, by visualizing its content in
    the original image, as well as its internal variations (Fig. 2.1b).'
