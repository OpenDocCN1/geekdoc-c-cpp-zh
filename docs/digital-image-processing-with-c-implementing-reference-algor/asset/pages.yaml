    # CENTROID INITIALIZATION


    Unlike the classical k-means algorithm, the position of the centroids $c_i$ is
    not chosen randomly by the SLIC method, but initialized in multiple steps:


    +   1. Centroids $ci$ are first set at the center of the rectangles that correspond
    to the subdivision of the image, as a grid of $S \times S \times S$.

    2. The position of each $c_i$ is then shifted towards the point having minimal
    gradient, in the neighborhood of size $S \times S$.

    3. The Lab color of point is finally assigned to the centroid $c_i$. Each centroid
    is then defined by five value features $c_i=(x, y, L, a, b)$.


    In the proposed implementation, the set of $N$ centroids is stored in an image
