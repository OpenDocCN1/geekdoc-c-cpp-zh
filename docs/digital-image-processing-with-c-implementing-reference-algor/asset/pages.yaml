    +   The transform allows to concentrate the energy of the signal only on a few\
    \ coefficients, obtaining a sparse representation, which implies less data to\
    \ be recorded, by suppressing the coefficients of low values in the transformed\
    \ representation;\n\n+   The transform reduces the correlation of the data, and\
    \ thus decreases the source entropy. Shannon's information theory [38] links the\
    \ source's entropy to the capacity of coding, and therefore of the compression.\n\
