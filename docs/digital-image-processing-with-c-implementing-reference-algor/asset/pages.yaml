    /*

    ramer-Bruckner filter.

    imgIn : Input image

    n : size of the square structuring element

    */

    CImg<> KramerBruckner (CImg<> imgIn, int n)

    {

    CImg<>

    imgOut(imgIn), // Copy of the input image

    mask = CImg<>(n,n).fill(1); // Structuring element

    imgErode = imgIn.get_erode(mask); // Erosion

    imgDilate = imgIn.get_dilate(mask); // Dilation

    ncimg_forXY(imgOut,x,y)

    {

    float M = 0.5f(imgErode(x,y) + imgDilate(x,y));

    imgOut(x,y) = (imgIn(x,y) < M ? imgErode(x,y) : imgDilate(x,y));

    }


    return imgOut;


    ```


    # 4.3.2 Alternating sequential filters


    Alternating sequential filters are widely used, e.g., to progressively filter
    out noise (narrow peaks) and negative noise from sequences of morphological openings
    and closing operations of increasing size. In the digital canvas, such filter
    applied to a function I is expressed as:


    ```

    $\dots((((I \circ B_1) \bullet B_1) \circ B_2) \bullet B_2) \dots \circ B_n) \bullet
    B_n$

    ```'
