    # 7.2.4 Transformation of regions


    Transformation methods are based on the notion of predicate. A predicate $\mathcal{P}$
    is a logical proposition whose value depends on its argument. Here, the predicates
    concern the regions $R_i$ of the image to be segmented, and the basic predicate
    in this case is $\mathcal{P}$: “the region $R_i$ is homogeneous”. To evaluate
    $\mathcal{P}$, several arguments are possible, among which:


    +   - the contrast of $R_i$: ($\mathcal{P}$ is true) $\Leftrightarrow \left(\frac{\max_{R_i}I(x,y)
    - \min_{R_i}I(x,y)}{2}\right) < \varepsilon$)$

    - the variance of $R_i$: ($\mathcal{P}$ is true) $\Leftrightarrow \left(\frac{1}{Card(R_i)}
    \sum (I(x,y) - I)^2\right) < \varepsilon$)$

    - the limited differences: ($\mathcal{P}$ is true) $\Leftrightarrow (\forall(x_1,y_1),
    (x_2,y_2))$ neighbors, $|I(x_1,y_1) - I(x_2,y_2)| < \varepsilon$)$'
