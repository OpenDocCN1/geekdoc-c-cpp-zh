  md: '# 9.2 Color imaging


    # REPRESENTATION USING TRIANGULAR HSI COORDINATES


    HSI representation (Hue, Saturation, Intensity) is derived from the transformation

    of RGB values:


    ```

    $H = \arccos\left(\frac{0.5(R-G) + (R-B)}{\sqrt{(R-G)^2 + (R-B)(G-B)}}\right),
    S = 1-3\frac{\min(R,G,B)}{R+G+B}, I = \frac{R+G+B}{3}$

    ```


    And CImg<T> and CImg<T>::HSIRGB (and their get_*\versions) allow to compute these
    components. This representation is based on the

    psychology of visual perception, which is used mainly in the field of computer

    graphics.


    # HEXAGONAL CONE REPRESENTATION HSV


    Similar to HSI, the HSV (Hue, Saturation, Value) model is built upon RGB values:

    of $M=\max(R,G,B)$ and $m=\min(R,G,B)$, then


    ```

    $S = 1-\frac{m}{M''}, \ V = M \text{ and } H = \begin{cases} \frac{(60G-B+360)}{M-m}
    \pmod{360} & \text{if } M=R \ \frac{B-R}{M-m} +120 & \text{if } M=G \ \frac{60R-G}{M-m}
    +240 & \text{if } M=B \end{cases}$

    ```


    Methods CImg<T>::RGBtoHSV() and CImg<T>::HSVtoRGB() (and their

    _* versions) give access to the conversion of color images in the HSV color space.


    # HSL REPRESENTATION


    Like HSI and HSV, HSL (Hue, Saturation, Lightness) representation is built from

    of RGB values: if $M=\max(R,G,B)$ and $m=\min(R,G,B)$, then


    ```

    $L = \frac{M+m}{2}, S = \begin{cases} \frac{2L}{M+m} & \text{if } L<0.5 \ \frac{M-m}{2-2L}
    & \text{otherwise} \end{cases}, H = \begin{cases} \frac{(60G-B+360)}{M-m} \pmod{360}
    & \text{if } M=R \ \frac{B-R}{M-m} +120 & \text{if } M=G \ \frac{60R-G}{M-m} +240
    & \text{if } M=B \end{cases}$

    ```


    Methods CImg<T>::RGBtoHSL() and CImg<T>::HSLtoRGB() (and their get_*

    versions) handle images in HSL color space.'
