  md: "# 3. Point Processing Transformations\n\nIn this chapter, we are interested\
    \ in grayscale images. A $d$-dimensional image is considered as a function $I\
    \ : \\Omega \\subset N^d \rightarrow [[0, N-1]]$, where $N$ is the number of gray\
    \ levels that pixel values can take.\n\nThe simplest way to process an image is\
    \ to apply a pointwise operation\n\n$J(x,y) = T[(x,y)]$,\n\nwhere $T$ acts directly\
    \ on the image $I$, or on the histogram of $I$. Gonzalez and Woods [15] propose\
    \ many examples of *ad hoc* transformations. In the following, we give an overview\
    \ of some of them.\n\n# 3.1 Image operations\n\n# 3.1.1 Mathematical transformations\n\
    \nA natural idea is to define a mathematical transformation $T$ on $I$. Any “classical”\
    \ mathematical function can be applied, regarding its definition domain. The CImg<T>\
    \ class has many pre-defined methods allowing to apply pointwise functions on\
    \ an image (Table 3.1).\n\nFigures 3.1 and 3.2 show some outputs provided by Code\
    \ 3.1.\n\n> Code 1 — Some mathematical transformations applied to an image.\n\n\
    ```\nCImg<> imgIn(\"butterfly.bmp\");\nImgList<> mathOps(imgIn,\n    imgIn.get_exp()/50,\n\
    \    10*imgIn.get_sqrt(),\n    (1 + imgIn.get_abs()).log(),\n    imgIn.get_pow(3));\n\
    nmathOps.display();\n```\n\nIt is also possible to apply image transformations\
    \ directly from a mathematical expression. The image of Figure 3.3 is for example\
    \ produced by\n\nimg.fill(\"(x+y)%255\", true);"
