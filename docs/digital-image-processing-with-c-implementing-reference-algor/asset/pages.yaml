    # RESULTS OF THE DERICHE FILTERS


    Several interesting and fast processes can be performed using the Deriche filter.

    Smoothing of an image (order 0 filter)


    Due to its recursive implementation, the Deriche smoothing filter has a constant
    computational complexity regardless of the width of the filter specified by the
    parameter α. Using the separability property of the filter, we can smooth a 2D
    image I by filtering along the X axis, then by transposing the image (equivalent
    to a 90° rotation), reapplying the filter and transposing the image again (Code
    5.7).


    > Code 5.7 – Smoothing of a 2D image by the Deriche filter.


    ```

    CImg = imgIn("test.bmp"); // Loading the image

    dereriche(imgIn,alpha,0); // X filtering

    imgIn.transpose();

    dereriche(imgIn,alpha,0); // Y filtering <==

    imgIn.transpose(); // X filtering of transposed image

    ```


    Figure 5.15 presents the result of the smoothing filter for several values of
    α. The larger this scale parameter, the less the image is smoothed.'
