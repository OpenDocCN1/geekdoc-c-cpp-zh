  md: "It can be interesting for the analysis:\n\n+   - to transform the data to match\
    \ the algorithms that will be used;\n- to reduce the time complexity of these\
    \ algorithms;\n- to reduce the spatial complexity of the problem;\n- to disentangle\
    \ variables and look for dependencies;\n- to introduce a priori or important properties\
    \ for the algorithms (normalized data, sparse features... ...);\n- to allow a\
    \ more intuitive and/or graphical interpretation in a reduced way, in the image\
    \ of $w \times h \times k, k p$ (generally $k=2$ or 3), or to visualize the information\
    \ directly on the screen.\n\nTwo approaches are then classically used: select\
    \ from the initial features (the $p$ values measured in the channels) those judged\
    \ to be the most relevant and eliminate the others (this is called variable selection);\
    \ or construct, from these quantitative values, new features by linear or non-linear\
    \ transformations (this is called feature extraction).\n\nIn this context, dimension\
    \ reduction methods are often applied [25]. We propose in the following simple\
    \ example of linear dimension reduction in multi-spectral imaging, and its implementation\
    \ in $ClImg$.\n\n# ### 9.1.1 Principal component analysis\n\nFactorial methods\
    \ aim at processing and visualizing multi-dimensional data. The simultaneous consideration\
    \ of all the variables is a difficult problem, sometimes made easier because the\
    \ information provided by the variables is redundant. The factorial methods then\
    \ aim at exploiting this redundancy to try to replace the initial variables by\
    \ a reduced number of new variables, preserving the initial information at best.\n\
    \nFor quantitative data, *Principal Component Analysis* (PCA) [19] is one of the\
    \ most widely used methods. It considers that the new variables are linear combinations\
    \ and uncorrelated variables of the initial ones.\n\nIn the following, the data\
    \ will arrays $\\mathcal{M}_{np}(\\mathbb{R})$ of quantitative variables, a row\
    \ pixel of the image, and the columns describing the measured parameters (the\
    \ channels) on this pixel.\n\n# #### PRINCIPLE\n\nPCA often works on centered\
    \ and/or standardized variables. Let $\\mathbf{g} \\in \\mathbb{R}^p$ note the\
    \ vector of arithmetic means of each channel:\n\n```\n$$\\mathbf{g} = \\mathbf{X}^T\\\
    mathbf{D}1$$\n```"
  merge: -1
