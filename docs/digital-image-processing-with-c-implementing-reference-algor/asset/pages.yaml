    # 5.4 Diffusion filtering


    # 5.4.1 Introduction


    In Sections 5.1 and 5.3 we studied linear filters, i.e., linear and translation
    invariant systems. We have seen that the relation between the output and the input
    is written using a convolution product where the impulse response is introduced.
    Geometrically, this can be seen as a process of diffusion of the amount of gray
    levels of the pixel in its neighborhood. The calculation of the numerical convolution
    realizes this process. However, linear filtering acts in a homogeneous way on
    the image, i.e., the processing is applied in an identical way to all the pixels
    (property of invariance by translation), leading to possible defaults in the resulting
    image. For example, the Gaussian filter is widely used to reduce noise, but it
    alters and delocalizes the contours. But this filter can also be seen as a diffusion
    process, where the gray level of the image diffuses homogeneously and isotropically.
    By “isotropic” we mean that the diffusion takes place in all spatial directions
    without preferential orientation.


    The idea of diffusion filtering consists in applying a physical diffusion process
    of pixel values to an image. Several approaches exist. They are based on the'
