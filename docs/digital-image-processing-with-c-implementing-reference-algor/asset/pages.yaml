  md: "# 8.1 Optical flow: dense motion estimation\n\nCode 8.3 – Multi-scale resolution\
    \ scheme for the variational methods.\n\n```\nCImg<> V;\nfor (int N = nb_scales;\
    \ 1; N>=0; --N)\n{\n  float factor = (float)std::pow(2, (double)N);\n  int\n \
    \ s_width = std::max(1, (int)(seq.width()/factor));\n  s_height = std::max(1,\
    \ (int)(seq.height()/factor));\n  CImg<> scale_seq = seq.get_resize(s_width,s_height,-100,100,2);\n\
    \  blur(N,0,true,false);\n  if (V *= 2).resize(s_width,s_height,1,-100,3);\n \
    \ else V.assign(s_width,s_height,1,2,0);\n  DirectMotion(V, scale_seq,nb_iters<<N,alpha);\n\
    }\n```\n\nThe smaller the scale, the more iterations are performed, as this is\
    \ less consuming (fewer pixels to process). We also apply a Gaussian filter on\
    \ the input images for each scale, with a standard deviation that is as high as\
    \ the scale is. This multi-scale resolution scheme is particularly efficient for\
    \ minimizing the direct problem. And moreover, it allows estimating motion with\
    \ large displacement vectors.\n\n# ESTIMATION RESULTS\n\nFigure 8.2 shows an application\
