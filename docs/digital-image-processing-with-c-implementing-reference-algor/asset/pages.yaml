  md: '# 10.3 Creating complex 3D objects


    # 10.3.3 Details on material structuring


    Each material ($p \in [[1, P]]$) of a 3D mesh object is stored as a CIMgList<unsigned
    char> $img_p$ image, in an image CIMgList<unsigned char>.


    +   - When the primitive is colored, $img_p$ is an image having three values that
    encode the color components $(R, G, B)$ of the primitive.

    - When the primitive is textured, $img_p$ is directly the image of the considered
    texture. When several primitives share the same texture, it is strongly recommended
    to associate the texture to the first primitive, then use shared memory images
    associated to the initial texture, to define the materials of the other primitives,
    so that multiple copies of the same texture in memory is avoided. It is easy to
    insert shared copies of an image into an image list, by using the method CIMgList<T>::insert(),
    with the argument is_shared = true.


    ```

    CIMgList<T>& insert (CIMg<T>&, unsigned int pos=0U, bool is_shared=false);

    ```


    +   - When the primitive is a sprite, $img_p$ is the sprite to draw. If we are
    looking for a sprite with transparent pixels, we must associate a corresponding
    image of opacity, with same dimensions, to the list of primitive opacities.


    # 10.3.4 Details on opacity structuring


    Each opacity $p$ ($p \in [[1, P]]$) follows a similar pattern, using a list of
    images CIMgList<T> to store them. In this case, the opacity of a primitive will
    typically be represented by a $I \times I$ image whose single value indicates
    the transparency level of the primitive. A value of 0 indicates that the primitive
    is completely transparent, a in the special case where the primitive is a sprite,
    the corresponding opacity will be specified as a transparency image, with pixel
    values between 0 and 1. This case happens rarely, and if the object contains no
    sprite, then it allows to define the set of opacities as a CIMg<float> image of
    size $I \times P$, containing the opacity values of each primitive $p$.


    The knowledge of these few rules define the set of possible properties of 3D vector
    objects with CIMg allows to build complex objects in a procedural way: by iteratively
    adding in CIMgList<T> new vertices, associated 3D primitives and colored or textured
    materials, we can easily elaborate 3D visualizations. This is what we illustrated
    in the next section, with an application to cardiac image segmentation.'
