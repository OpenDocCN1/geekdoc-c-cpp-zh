  md: '# 2. Getting Started with the Clmg Library


    As mentioned Chapter 1, Clmg is structured with a minimum of classes to represent
    the relevant and manipulable objects of the library. In practice, the possibilities
    offered by the library are expressed by the great diversity of methods available
    in its classes (in those of the principal class Clmg<T>, representing the main
