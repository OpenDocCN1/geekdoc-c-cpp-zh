  md: '# 2.3 Computing the variations


    is encoded as an unsigned char() indeed a non-integer (floating-point) value that
    could potentially be greater than 255, and CImg therefore adapts the type of the
    pixels of the returned image to avoid possible arithmetic overflows or truncations
    of floating-point values into integers.


    +   2. This norm image is spatially smoothed, by the CIMg<float> method, which
    implements an efficient recursive filter for this task. Smoothing the image with
    a standard deviation σ ≈ 1 makes the subsequent calculation of variations more
    robust and accurate. So why is this method not called CIMg<float>::get_blur()?
    Simply because, unlike the previous CIMg<float>::get_norm() method, CIMg<float>::blur()
    directly modifies the pixels of the instance image, instead of returning it as
    a new image. In practice, the vast majority of CImg methods are available in two
    versions, get and non-get. Note that it could be possible to use CIMg<float>::get_blur()
    here, but it would be less appropriate: the considered image instance (which was
    the one returned by CIMg<unsigned char> is a temporary image in our pipeline,
    which we can afford to smooth "on the fly". Using the CIMg<float>::get_blur()
    version would imply the creation of a new image, with the memory allocation that
    goes along. Dealing with large arrays of numbers and not allocating more than
    necessary is a good practice. Here, the CIMg<float>::blur() method does not return
    a new image, but a reference to the instance that has just been blurred, which
    allows to continue writing our pipeline by adding other methods afterwards.


    +   3. The CIMg<float>::normalize() method concludes our sequence of operators.
    It allows to linearly normalize the pixel values of the resulting image in the
    range [0.255] (keeping of course floating-point values). This way, we can control
    the order of magnitude of the different values of variations expected in the lum
    image, depending on the type of geometry that will be found. Here again, the non-get
    version of the method is called, acting in place for reasons of memory efficiency.


    Thus, with a single line of code, we have defined a processing pipeline that returns
    an image of type CIMg<> (i.e., CIMg<float>), providing information about the luminosity
    of the colors in the original image (Fig. 2.3). The CImg architecture makes it
    very easy to write this kind of pipelines, which are often found in source codes
    based on this library.'
