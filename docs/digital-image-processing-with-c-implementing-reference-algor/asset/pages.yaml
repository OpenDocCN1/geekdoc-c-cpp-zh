    # MATCHING


    A possible use of the epipolar line is the matching of points detected on images
    $I_1$ and $I_2$.


    Let''s suppose that we have $n_i$ points of interest detected on the image $I_i$,
    $1 \le i \le 2$ by a dedicated algorithm (Harris and Stephens detector type, see
    Section 6.1). Among these points we assume to know at least eight correspondences,
    that the fundamental matrix $F$ can be estimated. The question that arises is
    the following: for a point of interest $P_i^1$ detected on $I_1$, is it possible
    to find its corresponding point on $I_2$, if it indeed exists?


    A simple solution to this matching problem is to look for the point on the epipolar
    line associated with $P_i^1$ with maximum correlation. For this purpose, we define
    around $P_i^1$ a window of size $t$, and we look for the window of the same size,
    centered at a point on the epipolar line, having a maximum correlation. This technique,
    similar to motion estimation by correlation, is very simple to implement and robust
    to errors in the estimation of $F$. It assumes a conservation of luminance, and
    no geometrical deformation of the two images.


    Other methods, not discussed here, such as the RANSAC algorithm, the phase shift
    approach or methods based on dynamic programming.


    > Epipolar lines have no reason to be parallel. But this makes it easier to find
    the corresponding image and to estimate the depth. If we rectify the images, i.e.,
    have parallel epipars, we know how to compute the images corresponding to the
    scene with parallel image planes. For this, we can generate an image of the scene
    by rotation around the optical center without knowing the scene. It is a question
    of projecting the images on a plane parallel to the baseline (the line passing
    through $C_1$ and $C_2$) in order to have rectified views.


    # 11.3.2 Depth estimation


    Once the $m_1 - m_2$ matching is done, it is possible to retrieve the depth information
    using the disparity $d$ of the two points. We assume in the following, for simplicity,
    that the images are rectified, so the epipolar lines are parallel. The depth information
    of a point $m$ can be calculated by a simple geometrical consideration (Fig. 11.12).


    If $b$ is the distance between the two cameras and $f$ the focal length (assumed
    equal) of the two sensors, the depth $z$ of the point $m$ in the scene can be
    estimated by


    ```

    $z = \frac{x}{f} = \frac{x-b}{x_2} = \frac{y}{y_2}$ \thus $z = \frac{bf}{d}$ with
    $d = x-b$

    ```


    The matching can be done by epipolar matching, as we have seen it. It is also
    possible to generate dense disparity maps, by computing the disparity of each
    pixel using its'
