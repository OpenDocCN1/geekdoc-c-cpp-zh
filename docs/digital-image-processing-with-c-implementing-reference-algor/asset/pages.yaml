    Luminance $L^*$ represents the clarity of the color, components $a^*$ and $b^*$
    represent respectively the opposition of green/red color and the opposition of
    blue/yellow color (the chromatics of the color). Calculating brightness by a root
    was rooted by psychovisual experiments on the appreciation of distances between
    monochromatic stimuli. The threshold value $(\frac{\delta}{2})$ is chosen in order
    to suppress the too abrupt variations of $x^{1/3}$ around 0. This cube root is
    interesting in the search for the approximation of how human eye see, even if
    it has shown since, that the Euclidean norm in this space is not a totally reliable
    measure to discriminate colors from a perceptual point of view.


