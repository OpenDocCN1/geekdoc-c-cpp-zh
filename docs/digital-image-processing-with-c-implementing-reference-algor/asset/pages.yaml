  md: "# 268 Chapter 11. And So Many Other Things...\n\n| Algorithm 8: 8-point algorithm.\
    \ |\n| :--- |\n\n**Input:** $n \\ge 8$ pairs of matching points between $I_1$\
    \ and $I_2$\n**Output:** **F**\n**Build A**\nCompute a Singular Value Decomposition\
    \ of $A$: $\\mathbf{A} = \\mathbf{U}\\Sigma\\mathbf{V}^\\top$\nElements of $\\\
    mathbf{F}$ =elements of $\\mathbf{V}$ corresponding to the smallest singular value\n\
    \n```\nn : Number of points\n*/\nCIMg> FundamentalMatrix(CIMgList<>& m, int n)\
    \ {\n  CIMg> F = f(3,3);\n  A(9,n);\n  // Matrix A.\n  for (int i = 0; i<n; ++i)\
    \ {\n    A(0,i) = m(i,1,0)*m(i,0,0);\n    A(1,i) = m(i,1,0)*m(i,0,1);\n    A(2,i)\
    \ = m(i,1,0);\n    A(3,i) = m(i,1,1)*m(i,0,0);\n    A(4,i) = m(i,1,1)*m(i,0,1);\n\
    \    A(5,i) = m(i,1,1);\n    A(6,i) = m(i,0,0);\n    A(7,i) = m(i,0,1);\n    A(8,i)\
    \ = 1;\n  }\n\n  // SVD.\n  CIMg> U, S, V;\n  A.SVD(U,S,V);\n\n  // F = last column\
    \ of V.\n  CIMg> f = V.get_column(8);\n  F(0,0) = f(0); F(1,0) = f(1); F(2,0)\
    \ = f(2);\n  F(0,1) = f(3); F(1,1) = f(4); F(2,1) = f(5);\n  F(0,2) = f(6); F(1,2)\
    \ = f(7); F(2,2) = f(8);\n\n  return F;\n```\n\n**F** is generally not a rank\
    \ 2 matrix (it would be of rank 2 if there were no measurement, model or computational\
    \ error). To impose the rank, we go again through the singular value decomposition.\
    \ Let **F** be the matrix previously computed. We look for the matrix $\\hat{\\\
    mathbf{F}}$ of rank 2 closest to **F** by computing $\\hat{\\mathbf{F}} = \\mathbf{U}\\\
    Sigma$ up to the smallest singular value to be null, and by reconstructing $\\\
    hat{\\mathbf{F}} = \\mathbf{U}\\Sigma'\\mathbf{V}^\\top$ where $\\Sigma'$ differs\
    \ from $\\Sigma$ by the last null column."
