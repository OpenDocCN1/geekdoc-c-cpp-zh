    # 5.2.2 Deriche filter


    In the work of Deriche [10], the author takes Canny''s criteria and succeeds in

    developing a simpler analytical solution in the form of an infinite impulse response

    (IIR) filter, whose recursive implementation ensures a constant number of operations

    whatever the width of the filter. By relaxing the choice of a FIR filter, the
    boundary

    conditions are chosen differently ($h(0)=0, h''(+\infty)=0$ and $h''(0)=s$ and

    we obtain the following coefficient values: $c_0=c_1=c_2=c_4=0$. Based on

    Equation 5.2, the optimal edge detection filter becomes:


    ```

    $h_{opt}(x) = cxe^{-\alpha x} \sin \omega x$.

    ```


    This operator has a Canny criterion $\Sigma$ improved by 25% ($\Sigma=\sqrt{3}$).
    The limit

    $\omega \to 0$ presents the best compromise to respect the three performance criteria

    (Equation 5.4). This operator corresponds to the exact solution of the optimization

    problem of the Canny criterion. This optimal edge detection operator is known
    in the

    literature as *Deriche filter*.


    ```

    $h_{opt}(x) = h_{deriche}(x) = -cxe^{-\alpha x}$ with $c = \frac{(1-e^{-\alpha
    x})^2}{\\alpha}$ \quad (5.4)

    ```


    where $c$ is a normalization coefficient of the filter. In the literature, it
    is common to

    find different values of $c$, depending on the type of normalization desired.
    Figure 5.14

    illustrates the Canny (Equation 5.3) and the Deriche (Equation 5.4) filters.


    This filter allows us to use a contour detector based on a first order derivative

    mal filter $f_{deriche}(x)$. This smoothing filter, noted $f_{deriche}(x)$, is
    given by integrating the opti-

    mal filter $f_{deriche}(x)$. We can also deduce a second order derivative filter
    by the optimal.


    ```

    $f_{deriche}(x) = k(\alpha|x|+1) e^{-\alpha|x|}$ with $k = \frac{(1-e^{-\alpha
    x})^2}{1+2\alpha e^{-\alpha x}-e^{-2\alpha x}}$ \quad (5.5)

    ```'
