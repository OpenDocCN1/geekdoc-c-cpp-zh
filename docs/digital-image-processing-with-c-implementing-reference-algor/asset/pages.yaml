    # 5.3 Frequency filtering


    We are now interested in the frequency content of an image and the definition
    of a linear filtering in the frequency domain rather the spatial domain.


    # 5.3.1 Introduction


    Linear filters are defined as linear time-invariant systems. It can be shown that
    the relation between the input signal, denoted $I_i(x,y)$, and the output signal,
    denoted $I_o(x,y)$, of such a filter is written as a convolution product. The
    quantity characterizing the filter, denoted $H(x,y)$, is called the impulse response.
    This convolution approach has been described in Section 5.1.


    This processing can also be seen in the frequency domain by using the Fourier
    transform of images (Fig. 5.18). The Fourier transform of the output image, denoted
    $I_o(f_x, f_y)$, is equal to the multiplication between the Fourier transform
    of the input image, denoted $I_i(f_x, f_y)$, and the frequency response, denoted
    $H(f_x, f_y)$, defined as the Fourier transform of the impulse response $H(x,
    y)$.


