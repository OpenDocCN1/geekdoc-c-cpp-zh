    where $\delta$ is the Kronecker delta (neutral element of the discrete convolution)
    defined by:


    ```

    \delta[i, j] = \begin{cases} 1 & \text{if } i = j \ 0 & \text{if } i \neq j \end{cases}

    ```


    This is equivalent to applying to $I$ the mask $W'' = \delta - W$, which then
    has the following properties:


    +   * the central value is $1 - w_{0,0}$;

    * $-1 \leq w''_{ij} \leq 0$, for all, $(i, j) \neq (0,0)$;

    * $\sum_{i=1}^N w''_{ij} = 0$.


    Sharpening is related to the discrete version of the Laplacian (4- or 8-connectivity
    approximation of partial derivatives by finite differences), which leads naturally
    to the notion of derivative filtering.


    First order derivative filtering


    Average filtering, modeled by the filter (a) in Fig. 5.2 tends to blur the image.
    This averaging is the approximation of an integration, and we expect that differentiation
    will have the opposite effect, a strengthening of the image contours. The simplest
    differentiation operator to implement in image processing is the gradient. As
    a reminder, the gradient of a function $f : \mathbb{R} \times \mathbb{R} \rightarrow
    \mathbb{R}$ is the function:


    ```

    \mathbf{V} : \mathbb{R} \times \mathbb{R} \rightarrow \mathbb{R}^2$

    $(x,y) \mapsto \left(\frac{\partial f}{\partial x}(x,y), \frac{\partial f}{\partial
    y}(x,y)\right)$

    ```


    Since the image is discrete, the partial derivatives $\frac{\partial I}{\partial
    x}$ and $\frac{\partial I}{\partial y}$ must be approximated by left, right or
    centered finite differences, and for example (Fig. 5.6):


    ```

    \frac{\partial I}{\partial x}(x,y) \approx I(x,y) - I(x+1,y) \quad \text{et} \quad
    \frac{\partial I}{\partial y}(x,y) \approx I(x,y) - I(x,y+1)

    ```


    The CImgList<T> class provides the method


    ```

    CImgList<> get_gradient(const char *axes=0, int scheme=0)

    ```


    to compute the gradient of an image. Parameter axes specifies the set of axis
    along which the partial derivatives are to be computed (e.g., "xy", and scheme
    specifies'
