  md: '# 11.1 Compression by transform (JPEG)


    +   1. Color transformation: JPEG works on the luminance/chrominance color space
    YCbCr (see Section 9.2);


    +   2. Chrominance sub-sampling: To take advantage of the low sensitivity of the
    human eye to chrominance, we downsample the chrominance signal. The idea is to
    reduce the size of the chrominance blocks (decimation) without altering the size
    of the luminance blocks (Y) (different positions are offered: 4:4:4, 4:2:0, 4:2:2,
    ...);


    +   3. Split into blocks: The JPEG format splits the image into $8 \times 8$ square
    blocks;


    +   4. DCT: The DCT (Discrete Cosine Transform) is a variant of the Fourier transform
    for a real-valued signal (rather than complex-valued). Each block is converted
    into a map of frequencies and amplitudes rather than light intensities and coefficients.
    A frequency in a block reflects the size and speed of change in a cosine base,
    while the amplitude value corresponds to the deviation with each color change.
    The DCT is invertible, lossless;


    +   5. Quantization: Quantization is the step in the JPEG compression algorithm
    where most of the information is lost (and therefore visual quality) occurs. It
    is also the step that compresses the signal by dividing the matrix resulting from
    the DCT with another matrix, namely the quantization matrix, which contains $8
    \times 8$ coefficients specifically defined by the standard. The goal is to attenuate
    the very high frequencies in each block, i.e., to which the human eye is less
    sensitive. These high frequencies initially have low amplitudes, which are further
    attenuated by quantization (corresponding coefficients may even reduce to 0);


    +   6. RLE and Huffman coding: The coding of the DC (i.e., DCT value in zero =
    average value) and AC coefficients (other coefficients) are different. The AC
    coefficients are scanned and encoded in zigzag, then compressed by a RLE algorithm
    (Run Length Encoding) and finally by an entropic coding (Huffman or arithmetic
    coding). These first two steps make it possible to reduce the entropy of the source
    and make encoding efficient.


    # 11.1.3 Discrete cosine transform and quantization


    The discrete cosine transform, denoted $J$, of a digital image $I$ of size $N
    \times N$ pixels is defined for all $(u, v) \in [0, N-1]^2$:


    ```

