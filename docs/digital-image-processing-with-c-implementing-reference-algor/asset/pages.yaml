  md: '# 7.1 Edge-based approaches


    whose topology can even vary during the convergence (by separation or fusion of

    curves).


    From a chronological point of view, the original active contour model was pro-

    posed by Kass et al. [22] and consists of an intrinsically closed deformable model

    evolves to the boundaries of the desired region. The deformation is based on a

    Lagrangian formulation of energy minimization, expressed as the sum of an image

    data related term and a regularization term. This method does not allow for simple

    topological changes, and the value of the energy depends strongly on the parametriz-

    tion of the curve.


    Caselles et al. [7] introduced a geometric model of active contours formulated
    by

    partial differential equations of curve evolution. Each point of the curve moves
    in

    direction of its normal vector at a speed proportional to the curvature. This
    approach

    is an alternative to energy minimization which can be seen as a search for the
    solution

    of a Hamilton-Jacobi equation, and thus so solved efficiently using the Osher
    and

    Sethian level set method [29]. The use of this implicit representation explains
    the

    success of this approach.


    Caselles et al. [6] subsequently proposed an equivalent energy minimization

    problem, based on the search for a numerical geodesic path in a Riemann space.
    This

    problem, which can also be solved numerically by level set, allows in theory to
    solve

    the initialization problem of active contours. Theoretical results have shown
    the

    existence, uniqueness and stability of the solution.


    Many other models deriving from geometric and geodesic approaches have been

    proposed. Rather than presenting a catalog of the different variants described
    in

    the literature, the following paragraph unifies them in a single energy minimization

    formalism. The link between energy decay and velocity field generating a displacement

    is also presented, in order to have both an energetic and a geometrical approach.

    The use of implicit representation has a main disadvantage a higher computation

    t. In this section, we will not discuss the fastest algorithms for solving the
    implicit

    active contour methods, which exist but are more complex to implement.


    # GENERAL PRINCIPLE


    Let us denote $\gamma(\mathbf{p})$ a closed curve defined on $\Omega \subset \mathbb{N}^2$
    and parameterized by a vector

    p. The inner region bounded by this contour is denoted $R_y$. The active contours
    method

    inwo two dimensions is based on a deformable model considering that the curve
    $\gamma(\mathbf{p})$ is

    dynamic, i.e., $\gamma(\mathbf{p}) = \gamma(\mathbf{p},t)$. The model must evolve
    toward the boundaries of the'
