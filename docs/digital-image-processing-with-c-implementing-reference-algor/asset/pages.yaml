  md: '# 8. Motion Estimation


    Motion estimation is an important topic in image processing, especially in computer
    vision. Being able to estimate the motion between two images of a sequence opens
    a field of applications in object tracking, image registration, 3D reconstruction,
    or even video compression.


    Motion analysis can be categorized into three different classes of methods:


    +   - 3D-3D approaches, which involve computing 3D motion from a set of 3D correspondences.
    Generally, 3D data are difficult to obtain;

    - 2D-3D approaches, which estimate the 3D motion from correspondences between
    a 3D model and 2D projections;

    - 2D-2D approaches, which do not use a 3D model and assume correspondences between
    2D projections, from which the 3D motion can be reconstructed.


    One of the critical points of motion estimation is the search for correspondences
    in the frames of a sequence. This includes the correspondences between points
    (calculated for example by a point detector, cf. Section 6.1), lines or curves
    (cf. Section 6.2), or even regions (cf. Section 7.2). It is then a question of
    estimating first a sparse displacement field. On the other hand, these correspondences
    can also be considered pixelwise, in a dense approach of motion estimation.


    # 8.1 Optical flow: dense motion estimation


    In a sequence of 2D images, motion is perceptible through changes in the spatial
    distribution of pixel luminances. The motion perceived in this way is called “apparent”
    because it does not necessarily correspond to the projection, in the image plane,
    of the motion taking place in the 3D space (Fig. 8.1). Thus, for example, the
    apparent velocities of points located on a uniformly rotating sphere are zero,
    and different from the projections of the true velocities of these points. The
    field of apparent velocities is called the optical flow. We will use the terms
    optical flow and velocity field interchangeably to designate the field of apparent
    velocities.'
  merge: -1
  pgno: 199
- img_proc: true
  md: "# 184 Chapter 8. Motion Estimation\n\n![](img/6b7de6c7ce31f7bb2927e7184da0492f_200_0.png)\n\
    \nFigure 8.1 – Example of calculus of the optical flow. The points located on\
    \ the rotating tray have zero velocity although they rotate in 3D.\n\nThe estimation\
    \ of apparent motion in a sequence of images is necessarily based on an assumption\
    \ of conservation of certain photometric properties of the imaged objects. The\
    \ only basic property that can be attributed to a point in the image is its intensity\
    \ (or its color). Many authors have shown that motion estimation that uses only\
    \ the luminance conservation as a constraint is an underdetermined problem:\n\n\
    $$I(\\mathbf{m},t) = I(\\mathbf{m}-\\mathbf{v}t,0)$\n\n$I(\\mathbf{m},t)$ is the\
    \ grayscale at the point $\\mathbf{m} = (x,y)^\top$ at time $t > 0$, and $\\mathbf{v}(\\\
    mathbf{m},t) = (u(\\mathbf{m},t), \\mathbf{v}(\\mathbf{m},t))^\top$ is the velocity\
    \ vector. Under the assumptions of small displacements and spatiotemporal differentiability\
    \ of luminance, the luminance conservation is generally expressed by the first-order\
    \ constraint of the motion equation [18]:\n\n$$I_x \\cdot u + I_y \\cdot v + I_t\
    \ = \nabla I^\top \\mathbf{v} + I_t = 0$$\n\nWhere $I_x, I_y,$ represent the horizontal/vertical\
    \ components of the spatial gradient of the luminance $I$ and the temporal gradient\
    \ of the luminance. This equation allows to uniquely determine the projection\
    \ of the velocity vector into the direction of the luminance gradient. This projection\
    \ being locally orthogonal to the photometric boundaries, we name it normal component\
    \ of the velocity vector. To find the second, tangential component, it is necessary\
    \ to regularize the estimation, i.e., to reduce the space of solutions by introducing\
    \ an additional constraint.\n\n# 8.1.1 Variational methods\n\nVariational methods\
    \ for motion estimation aim at determining the field of displacement vectors $\\\
    mathbf{v} = (u\\ v)^\top$ through a functional minimization\n\n```\n$$E(\\mathbf{v})\
    \ = \\int_D F(u, v, u_x, v_x, u_y, v_y, I, I_x, I_y, I_t) d\\mathbf{m} \\quad\
    \ (8.1)$$\n```"
  merge: -1
  pgno: 200
