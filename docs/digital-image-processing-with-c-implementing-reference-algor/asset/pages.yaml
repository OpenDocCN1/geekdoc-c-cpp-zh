    # # Interactive visualization


    The last part of this tutorial illustrates the use of the third most important
    class of CImg, named CImgDisplay. An instance of this class represents a visualization
    window, to display images or lists of images, and to interact with the user via
    event management: detection of key press or release, mouse buttons, retrieval
    of the location of the mouse cursor, etc. Here we are going to use some of the
    methods of CImgDisplay to build an interactive display of our block decomposition
    res.


    Let us say by declaring an instance of CImgDisplay, named disp: `CImgDisplay disp(res,
    "CImg Block Decomposition Tutorial", 0);`


    The constructor takes as argument the image to be displayed, the desired title
