    with the specification of a drawing pattern (0xCCCCCCCC), in order to draw a dotted
    segment. This dotted pattern consists of an unassigned integer 32 bits, whose
    bits (worth 0 or 1) define the binary pattern of the plot. Thus, a pattern of
    0xFFFFFFFF (all bits set to 1) corresponds to a solid line. A pattern of 0xAAAAAAA
    is a line with even pixel lit. 0xCCCCCC is a line alternating two lit pixels followed
    by two unlit pixels. This pattern argument is present in many Clmg drawing methods.


