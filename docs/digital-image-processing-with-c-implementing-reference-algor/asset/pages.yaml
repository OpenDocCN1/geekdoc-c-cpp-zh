    # 5.1.4 Adaptive filters


    These are inspired by averaging filters, but each term in the sum is weighted
    by a coefficient that decreases with the similarity between the pixel considered
    and the pixel of the center of the window. Among these, the $\sigma$ filter (Code
    5.3) uses as weighting coefficient the inverse of the norm of the gradient, so
    that the points different from the processed one not contribute much to the smoothing.
    Another example is the Fairfield toboggan, which digs the histogram of the image
    by assigning to each pixel the gray level of the nearest minimum gradient point
    in a neighborhood. All points on the path connecting that pixel to the minimum
    gradient point are assigned this value and marked for further processing. The
    process is iterated until all points are marked.'
