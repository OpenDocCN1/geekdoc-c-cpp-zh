    # 11.4.2 The RBF interpolation


    RBFs (Radial Basis Functions) are real functions used, among other things, to
    solve multi-dimensional interpolation problems from sparse data: using the values
    of a function $f: R^n \rightarrow R$ are known at $K$ points $x_k$, we try to
    estimate an interpolated value of $f(x)$, for any $x \in R^n$.


    The principle of RBF interpolation is based on the assumption that $f$ can be
    written:


    ```

    $$\forall x \in R^n, \quad f(x) = \sum_{l=1}^{K} w_l \phi(||x-x_l||) \quad (11.2)$

    ```


    where $\phi: R \rightarrow R$ is a pre-defined radial function, which will be
    evaluated for all the $L2$ distances between each point for which we want to estimate
    $f(x)$ and the known points $x_k$ of $f$. Classically, we choose $\phi(r) = r^2
    \log(r)$ for an interpolation known as Thin Plate Spline.


    Equation 11.2 reveals weights determined as follows:


    +   1. by writing the set of the $K$ Equations 11.2 for all the points $x_k$ whose
    value $f(x_k)$ is known, i.e., $f(x_k) = \sum_{l=1}^{K} w_l \phi(||x-x_l||)$;\n2.
    by formulating this set of equations with $K$ unknowns as a linear system $F =
    MW$,


    ```

    $$\F = \begin{pmatrix} f(x_1) \ \vdots \ f(x_K) \end{pmatrix}, \quad M = \begin{pmatrix}
    \phi(||X_1-X_1||) \ \vdots \ \phi(||X_k-X_k||) \ \vdots \ \phi(||X_1-X_K||) \end{pmatrix}
    \quad \begin{pmatrix} \phi(||X_K-X_1||) \ \vdots \ \phi(||X_k-X_k||) \ \vdots
    \ \phi(||X_K-X_K||) \end{pmatrix}$

    ```


    ```

    $$\W = \begin{pmatrix} w_1 \ \vdots \ w_K \end{pmatrix},$ the vector of weights
    that we are looking for;

    ```


    +   3. by solving this linear system: $W = M^{-1}F$.


    The weights $w_i$ being estimated, the function $f$ can then be evaluated at any
    point $x \in R^n$ of the space, with Equation 11.2.'
