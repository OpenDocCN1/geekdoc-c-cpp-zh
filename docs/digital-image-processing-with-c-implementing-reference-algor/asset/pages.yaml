  md: '# 7.1 Edge-based approaches


    Integral surface energy


    A regional energy can be expressed as a double integral over a subdomain of $\Omega$
    of a function $g$ of the image characteristics:


    ```

    $E_\gamma = \iint_{R_\gamma} g(\mathbf{m}, R_\gamma) d\mathbf{m}$

    ```


    In the literature, the special case of independence with respect to the region
    considered, i.e., $g(\mathbf{m}, R_\gamma) = g(\mathbf{m})$, is widely used:


    ```

    $F_\gamma = g(\mathbf{m})\mathbf{n}$

    ```


    # ENERGY FORMULATION IN IMAGE PROCESSING


    A wide variety of energy terms can be implemented from the curvilinear or surface
    integral function formulation. They can be classified into two categories: internal
    energy terms, favoring coherence and regularization of the contour, and data attachment
    energy terms, allowing the contour to be attracted to the structures of interest.


    Regularization energies


    +   * When $g(\mathbf{m}) = 1$, the energy is equivalent to the Euclidean length
    of the curve $\gamma$. This case is widely used for its regularization properties
    and leads to the field:


    $F_\gamma = \kappa\mathbf{n}$


    This term tends to make $\gamma$ more regular, by attenuating the discontinuities
    of the curve.

    * When $g(\mathbf{m}) = \mu$, the energy is proportional to the domain surface.
    This energy corresponds to a widely used velocity corresponding to a surface force
    homogeneous to a pressure called balloon force [8], which constrains the model
    to a global contraction or dilation motion. In this case:


    $F_\gamma = \mu\mathbf{n}$


    Each point on the contour experiences a constant force in the normal direction
    of the contour, which is equivalent to applying a homothetic motion to the shape.
    This energy is commonly used to push the curve toward the valleys of potential.'
