    # 6.1.3 Shi and Tomasi algorithm


    An eigenvalue analysis can also be performed for each point x. Shi and Tomasi
    [39] proposed to classify a point x as a point of interest if min(\lambda1(x),
    \lambda2(x)) > \lambda, where \lambda is a pre-defined threshold. For 2D matrices,
    an analytic method to determine the eigenvalues, without solving $x^2-Tr(M)x+det(M)=0$,
    nor calling the function


    ```

    ClImg< eigen(ClImg<>& val, ClImg<>& vec)

    ```


    is to use:


    ```

    (\lambda1(x) + \lambda2(x))^2 - (\lambda1(x) - \lambda2(x))^2 = 4\lambda1(x)\lambda2(x)

    ```


    and then(\lambda1(x) - \lambda2(x))^2 = (\lambda1(x) + \lambda2(x))^2 - 4\lambda1(x)\lambda2(x)
    or


    ```

    (\lambda1(x) - \lambda2(x)) = \sqrt{Tr^2(M(x)) - 4det(M(x))}

    ```


    Knowing the sum and the difference of the eigenvalues, we can then determine the
    latter for all the pixels of the image:


    ```

    ClImg<

    diff = (trace.get_sq() - 4*det).sqrt (),

    lambda1 = (trace + diff) / 2,

    lambda2 = (trace - diff) / 2,

    R = lambda1.min(lambda2);

    ```'
