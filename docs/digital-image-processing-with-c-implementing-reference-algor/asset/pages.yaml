    As soon as the number of parameters of the shape to be detected increases, it
    is therefore necessary to turn to alternatives to the initial Hough algorithm.
    The generalized Hough transform [20] allows for example to detect any 2D shape.
    In this method, the shape of the desired contour is first encoded point by point
    in a table, and the associated parameter space is related to the position, scale
    and orientation of the shape. The method thus requires only four parameters, one
    less in the case of the ellipse, than the classical Hough transform.


