    Similarly, the dilation of the 3D coordinates along each of the axes x, y and
    z, with scale factors 0.2, 1.2 and 2.3, respectively, can be done with:


    ```

    points = CIMg<::diagonal(0.2,1.2,2.3) *points;

    ```


    # 10.3.2 Details on primitive structuring


    Each primitive p (for p ∈ [1,P]) of a 3D mesh is a CIMg<unsigned int> img_p image
    with size 1 × S, in an image CIMgList<unsigned int>. The S explicitly defines
    the type of the primitive:


    +   - When S = 1: the primitive is a colored point (or sprite). The image img_p
    = (i1) contains a single value which is the index it ∈ [0,N-1] of the associated
    vertices. In order to display a sprite, the associated material must be an (rather
    than a simple color vector).

    - When S = 2: the primitive is a colored segment. The image img_p = (i1,i2) contains
    the two indices of the starting and ending vertices.

    - When S = 3: the primitive is a colored triangle. The image img_p = (i1,i2,i3)
    contains the three indices of the triangle vertices.

    - When S = 4: the primitive is a colored quadrangle. The image img_p = (i1,i2,i3,i4)
    contains the four indices of the quadrangle vertices.

    - When S = 5: the primitive is a colored sphere. The image img_p = (i1,i2,0,0,0)
    contains two indices of vertices that define the diameter of the sphere.

    - When S = 6: the primitive is a textured segment. The image img_p = (i1,i2,Tx1,Ty1,Tx2,Ty2)
    contains the two indices of the segment vertices, followed by the coordinates
    of the corresponding texture (the texture being given as the material associated
    to this primitive).

    - When S = 9: the primitive is a textured triangle. The image img_p = (i1,i2,i3,Tx1,Ty1,Tx2,Ty2,Tx3,Ty3)
    contains the three indices of the triangle vertices, followed by the coordinates
    of the corresponding texture (the texture being given as the material associated
    to this primitive).

    - When S = 12: the primitive is a textured quadrangle. The image img_p = (i1,i2,i3,i4,Tx1,Ty1,Tx2,Ty2,Tx3,Ty3,Tx4,Ty4)
    contains the four indices of the quadrangle vertices, followed by the coordinates
    of the corresponding texture (the texture being given as the material associated
    to this primitive).


    The set of these primitives, associated with the set of vertices, entirely define
    the 3D structure of the mesh object.'
