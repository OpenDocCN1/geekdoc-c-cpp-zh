    # 5.3.2 The Fourier transform


    # THE CONTINUOUS FOURIER TRANSFORM


    The Fourier transform projects an image into a frequency space characterized by
    spatial frequencies $f_x$ and $f_y$. It allows to analyze image properties in
    this new space.


    **Definition 5.3.1** The Fourier transform of a continuous image $I(x,y)$, assumed
    to have infinite support is given by


    ```

    $TF: \mathbb{R} \times \mathbb{R} \mapsto \mathbb{C}$

    $$\hat{I}(f_x, f_y) = \iint I(x,y)e^{-j(2\pi f_xx+2\pi f_y)}dxdy$$

    ```


    This is a bidirectional complex transform in the frequency domain and can be represented:


    +   - either by its modulus (spectrum) and its argument (phase);

    - or by its real and imaginary parts.


    From this, the original can be recovered:


    ```

    $I(x,y) = \iint \hat{I}(f_x, f_y)e^{j(2\pi f_xx+2\pi f_y)}df_xdf_y$

    ```


    Figure 5.20 shows the modulus of the Fourier transform of a two-dimensional rectangular
    function. One can easily recognize the sign. It is also possible to identify the
    orientation of the shape. Indeed, in the second set of figures, this same function
    is rotated by $45^{\circ}$ and this change in spatial variations is reflected
    in the frequency content in terms of orientation.


    In Fig.5.21, we notice the presence of energy in particular directions; this phenomenon
    is characteristic of the presence of oblique lines or contours, whose frequency
    decomposition is wide spectrum ($f$ large in the direction perpendicular to the
    line).


    Working in the frequency domain has many applications in image processing: filtering,
    texture analysis (Section 6.3), image registration (Section 8.2.2), compression
    (Section 11.1).'
