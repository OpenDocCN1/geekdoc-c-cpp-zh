  md: '# Chapter 5. Filtering


    $D = d \I_d \(I_d \text{ is the identity matrix), or } D = d \frac{\nabla U \nabla
    U^T}{\|\nabla U\|^2}$


    The property of matter transport under the conservation condition is expressed
    with the continuity equation:


    ```

    $$\frac{\partial U}{\partial t} = -div(\mathbf{j})..$

    ```


    Combining these two equations lead to the diffusion equation (second Fick''s empirical
    law):


    ```

    $$\frac{\partial U}{\partial t} = \div(\mathbf{D}.\nabla U)$ (5.12)

    ```


    This equation is encountered in many fields. For example, it is the heat equation
    (or Fourier''s law) when considering the study of heat transfer in homogeneous
    or inhomogeneous medium.


    In processing, we can imagine that the concentration $U(x,y)$ at a point is given
    by the gray level $I(x,y)$ of the image at this point, and the initial conditions
    of the evolution of the diffusion equation, by the input image that we want to
    filter. In this case, the diffusion tensor (or diffusivity) defines how the diffusion
    should be and not necessarily constant. In practice, there is an advantage in
    choosing this tensor as a function of the local characteristics of the image.
    Two cases can be considered (Fig. 5.33):


    +   * the linear isotropic diffusion filter, using a constant diffusivity;

    * the non-linear anisotropic diffusion filter using a diffusion tensor or a diffusivity
    adapted to the local characteristics of the image.


    # 5.4.3 Linear diffusion filter


    In the case of homogeneous diffusion, Equation (5.12) is written in 2D:


    ```

    $$\frac{\partial U}{\partial t}(x,y,t) = \sqrt{\nabla^2}I(x,y,t)$ (5.13)

    ```


    where $I(x,y,t) = 0$ corresponds to the input image (initial condition) and the
    output image, solution of the equation, corresponds to the image after diffusion
    for a time $t=t_0 > 0$. The analytical solution of Equation 5.13 is:


    ```

    $I(x,y,t=t_0) = H_{\sqrt{2}\sigma}}*I(x,y)$

    ```


    where $H_{\sigma}$ is the impulse response which is a Gaussian function of standard
    deviation $\sigma$. It is thus a Gaussian filtering of the image.


    In this case, it is not necessary to use Equation 5.12, since one can directly
    carry out a Gaussian filtering by using the `CImg<T>::get_blur()` method:'
