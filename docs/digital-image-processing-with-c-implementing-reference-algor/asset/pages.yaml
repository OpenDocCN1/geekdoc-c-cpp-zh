    # 6.3.4 Application


    Section 7.2 will focus on the creation of local features for the segmentation
    of an image into regions. We propose here the use of these texture features for
    image search in large databases. To be more precise, we propose to search in an
    image database the “closest” image to a given image. Many methods exist, and we
    implement in the following method based on [2]. The idea is simple and is specified
    in Algorithm 3: the image I is cut into patches (i.e., small rectangular thumbnails
    of the same size), on which the LBP are computed, from which we then draw the
    distributions of I. The set of distributions (histograms) is then concatenated
    to form a global feature of I.


    The interest of representing the image by the concatenated histogram is that it
    offers three levels of representation:


    +   * at the pixel level, the LBP coefficients carries this information;

    * at the regional level, by the representation of the histograms of the patches;

    * at the global level, by concatenation.


    The algorithm depends on a metric between histograms, and we choose in the following
    simplest one, the l1 norm of the difference:


    ```

    d(h1,h2) = \sum_{k=1}^{nbins} |h_i(k) - h_j(k)|

    ```


    Code 6.15 implements the first part of the algorithm (and uses Code 6.14).'
