  md: 'object to be segmented $R_i$. The problem is therefore to find the vector **p**
    which verifies

    R_{\gamma} = R_i$. In order to constrain the progression of the model, an energy
    $E$ is associated

    to it. It is composed of the sum of a data attachment term and a regularization
    term. The system minimizes $E$ by converting it into kinetic energy until a stopping
    criterion

    is verified. This energy problem can be formulated by a force balance, corresponding

    to a numerical gradient descent problem:


    ```

    $$\begin{cases} \frac{\partial \gamma(\mathbf{p},t)}{\partial t} = \mathbf{F}
    \text{ with} & \gamma_0(\mathbf{p}) \ \mathbf{F} = \frac{\delta E}{\delta \gamma}
    \end{cases}$

    ```


    In this model, three degrees of freedom are left to the user:


    +   - the representation of the curve ($\mathbf{p}$), which can be explicit, parametric
    or implicit;

    - the definition of the energy function ($E$ or $F$ by calculation), which is
    based on

    geometrical constraints and/or data extracted from the image (gradient, texture
    parameters, temporal information . .);

    - the initialization of the method ($\gamma(\mathbf{p},t=0)$) which influences
    the solution found

    because of the possible non-convexity of the energy function.


    In most cases, the energy attached to the model can be described as a combination
    of

    integral, curvilinear and/or surface functions. The partial differential equation
    for the

    evolution of the $\gamma$ contour can be deduced mathematically by calculus of
    variations.


    # ENERGY FORMULATION


    Curvilinear integral energy


    This contour energy can be expressed as a simple integral along the contour of
    a

    function $f$ depending on the characteristics of the image (boundaries for example):


    ```

    $E_b = \int_{\gamma(\mathbf{p})} f(\mathbf{m}) d\mathbf{a}(\mathbf{m})$

    ```


    In [6] have shown that this form of energy leads to the velocity field:


    ```

    $$\mathbf{F}_b = [\nabla \cdot (f(\mathbf{m})\mathbf{n})]\mathbf{n} = [f(\mathbf{m})\boldsymbol{\kappa}
    - \nabla f(\mathbf{m}) \cdot \mathbf{n}]\mathbf{n} \quad (7.1)$

    ```


    where **n** is the unit normal vector, $\boldsymbol{\kappa}$ the Euclidean curvature
    and $\nabla$ the gradient

    operator.'
