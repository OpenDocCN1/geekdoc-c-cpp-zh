  md: '# Introduction


    In this section, we illustrate various aspects of the ClImg library for image
    processing, through several workshops.


    In the classic workflow of digital image processing, several steps are generally
    used:


    +   * The *pre-processing* step (i.e., how to improve the image to reach the goal
    of the processing): it can be a matter of denoising, improving the contrast, transforming
    the initial image into another image, easier to process ...

    * The *processing* step as such: the objective may be to find objects in the image,
    to follow objects in a temporal sequence, to classify pixels in different homogeneous
    groups, to reconstruct a 3D scene, to extract compressed information from an image
    composed of many channels ...

    * The *quantization* step, which uses the previous step to provide quantitative
    results to measure the processing (e.g., what is the surface of the isolated object?
    What is the average speed of the moving object? What is the depth of the object
    in the image?...)


    Without pretending to be exhaustive, we propose a few workshops, organized in
    chapters, allowing us to approach classical methods among the wide range of classical
    algorithms in the field image processing. Each workshop is organized in a short
    but necessary introduction to its theoretical aspects, followed by the implementation
    in ClImg of useful algorithms. The source codes presented below allow to make
    an immediate parallel with the equations described in the theoretical part. The
    results of the algorithms are illustrated with many figures.'
  merge: -1
