  md: "# 8.1 Optical flow: dense motion estimation\n\n# DIRECT METHOD\n\nA variant\
    \ of the Horn and Schunk algorithm consists of solving the direct problem, rather\
    \ than the linearized problem, i.e., minimizing the functional:\n\n```\n$$\\int_D\
    \ (I_{(x+u,y+v)} - I_{(x,y,t+dt)})^2 + \\alpha(|\\nabla u||^2 + ||\\nabla v||^2)d\\\
    mathbf{m}$\n```\n\nwhich is actually a particular case of the functional (8.1)\
    \ with:\n\n```\n$F(u, v, u_x, v_x, u_y, v_y, I_x, I_y, I_t, I_r) = (I_{(x+u,y+v)}\
    \ - I_{(x,y,t+dt)})^2 + \\alpha(u_x^2 + u_y^2 + v_x^2 + v_y^2)$\n```\n\nThe associated\
    \ Euler-Lagrange equations define the gradient descent which minimizes this:\n\
    \n```\n$$\\begin{cases} \\frac{\\partial u}{\\delta l} = I_{(x+u,y+v)}\\delta\
    \ I + \\alpha\\nabla^2 u \\ \\frac{\\partial v}{\\delta l} = I_{(x+u,y+v)}\\delta\
    \ I + \\alpha\\nabla^2 v \\end{cases}$\n```\n\nwith $\\delta I = I_{(x+u,y+v)}\
    \ - I_{(x,y,t+dt)}$.\n\nThe discretization of this gradient descent by a semi-implicit\
    \ scheme leads to the following iterative scheme:\n\n```\n$$\\begin{cases} u^{k+1}\
    \ = \\frac{u^k + I_{(x+u,y+v)}\\delta I + 4\\alpha u^k}{1+4\\alpha} \\ v^{k+1}\
    \ = \\frac{v^k + I_{(x+u,y+v)}\\delta I + 4\\alpha v^k}{1+4\\alpha} \\end{cases}$\n\
    ```\n\n**Code 8.2** shows the implementation of this variant.\n\n> Code 8.2 —\
    \ Direct method for estimating the displacement field.\n\n```\n/*\nDirect method\n\
    \nV : Displacement field\nseq : Sequence of two images, stacked along z\nnh_iters\
    \ : Number of iterations for the numerical scheme\nalpha : Regularization weight\
    \ for the displacement field\n*/\nvoid DirectMotion(CImg<> s, CImg<> seq,\n  unsigned\
    \ int nb_iters, float alpha)\n{\n  // Normalize the input sequence\n  // (improve\
    \ convergence of the numerical scheme)\n  CImg<> nseq = seq.get_normalize(0,1);\n\
    }\n```"
