  md: '# Chapter 9. Multispectral Approaches


    # CMY and CMYK SPACES


    CMY (Cyan, Magenta, Yellow) is the space dedicated to the printing of digital
    color images on paper. It results from a subtractive synthesis of the colors and
    is represented by the inverse of the RGB space: the origin (0,0,0) color is white,
    and it cyan, magenta and yellow as axes. Assuming that an RGB color has components
    coded in the interval [0,1], then:


    ```

    C = 1 - R, M = 1 - G and Y = 1 - B

    ```


    For material needs (namely the printers), this space was extended by adding a
    fourth component, K (for Key black), which, on the one hand, comes to fill the
    difficulty for a printer to restore correct gray levels by mixing cyan, magenta
    and yellow inks (which are in practice imperfect), and on the other hand, it is
    possible to minimize the quantity of ink necessary to print gray levels (colors
    frequently met in printing). For this reason, printers have a black ink cartridge,
    in addition to the cyan, magenta and yellow ink cartridges. The CMYK components
    are calculated as follows:


    ```

    K = min(C,M,Y), C'' = C-K / 1-K, M'' = C-K / M-K and Y'' = C-K / Y-K

    ```


    Methods CIMg<T>::RGBtoCMYK(), CIMg<T>::CMYKtoRGB(), CIMg<T>::RGBtoCMYK(), CIMg<T>::CMYKtoRGB(),
    CIMg<T>::CMYKtoCMYK(), CIMg<T>::CMYKtoCMYK) and the get_* versions allow to handle
    these CMYCK.


    Figure 9.3 and 9.4 illustrate the values of the various color channels obtained
    in these colorimetric spaces, for the kingfisher image, originally coded by RGB
    values (first row of the first figure). All channels have been normalized for
    visualization.


    # 9.2.2 Median filtering in color imaging


    If the concept of median value is clearly defined in R, generalizing this notion
    in R^d is much easier, there is no order relation in this space. However, it is
    possible to specify an equivalent formulation that will allow to define a median
    filtering algorithm for multi-spectral images.


    Let X = (x_1 ... x_n) be a set of n real values. The median of X can be defined
    as the value xm ∈ X such that:


    ```

    (∀j ∈ [[1,n]]) ∑ |x_m - x_i| ≤ ∑ |x_j - x_i|

    ```'
