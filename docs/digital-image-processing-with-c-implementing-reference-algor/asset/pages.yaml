    \ in two dimensions.\n\n```\n/*\n2D diffusion filtering (Perona and Malik method).\n\
    \nimgIn : Input image\nnbiter : Maximum diffusion time\ndt : Time step in the\
    \ discretization scheme\nlambda : Diffusivity parameter to be set in relation\n\
    \    to the gradient norm to be \"kept\"\n*/\nCIMg<> PeronaMalik2D(CIMg<>& imgIn,\
    \ int nbiter, float dt, float lambda)\n{\nCIMg<> imgOut = imgIn;\nfor (int iter\
    \ = 0; iter<nbiter; ++iter) {\n    // Computation of spatial derivatives by finite\
    \ differences.\n    CIMList<>\n    NW = imgOut.get_gradient(\"xy\",-1);\n    SE\
    \ = imgOut.get_gradient(\"xy\",+1);\n\n    cimg_forXY(imgOut,x,y) {\n        float\n\
    \        cn = 1/(1 + cimg:sq(lambda*NW(1,x,y)))));\n        cs = 1/(1 + cimg:sq(lambda*SE(1,x,y)));\n\
    \        ce = 1/(1 + cimg:sq(lambda*SE(0,x,y)));\n        cw = 1/(1 + cimg:sq(lambda*NW(0,x,y)));\n\
    \n        imgOut(x,y) += dt*(-cn*NW(1,x,y) + cs*SE(1,x,y) +\n            ce*SE(0,x,y)\
    \ - cw*NW(0,x,y));\n    }\nreturn imgOut;\n}\n```\n\n# RESULTS\n\nFigure 5.36\
