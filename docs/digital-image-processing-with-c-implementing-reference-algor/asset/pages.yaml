    # Second order derivative filtering


    By analyzing the intensity profiles of the images, contours can be seen as ramps
    between two areas having locally almost constant values. The first derivative
    on the ramp is constant, and depending on the “length” of that ramp, the contours
    will be more or less thick. The study of the second derivative, and more particularly
    of its zeros, makes it possible to detect edges, and in a sense to specify their
    orientation. Among all the second order derivative operators, the Laplacian is
    the most widely used. It is an isotropic operator, rotation invariant (the Laplacian
    of a rotated image is the rotated Laplacian of the original image) and can easily
    be approximated in a discrete way.


    Formally the Laplacian, $

    abla^2: \mathbb{R} \times \mathbb{R} \to \mathbb{R}$ is defined by


    ```

    $\nabla^2: (x,y) \mapsto \frac{\partial^2 f}{\partial x^2}(x,y) + \frac{\partial^2
    f}{\partial y^2}(x,y)$

    ```


    Approximating the second order derivatives using finite differences, for an image
    $I$:


    ```

    $\frac{\partial^2 I}{\partial x^2}(x,y) \approx I(x+1,y) - 2I(x,y) + I(x-1,y)\n$\frac{\partial^2
    I}{\partial y^2}(x,y) \approx I(x,y+1) - 2I(x,y) + I(x,y-1)$

    ```'
