    # 8.2.3 Kalman filtering


    The Kalman filter [21] is an infinite impulse response filter that estimates the
    states of a dynamic system from a series of incomplete or noisy measurements.
    It has many applications in various domains. Here we are interested in its application
    to the tracking of objects in image sequences.


    Let $(h_0, I_1 \dots I_R)$ be an image sequence acquired at different times $t_0
    = 0 \dots t_T = T$, by assuming that the temporal discretization step $\Delta
    t = t_{i+1} - t_i$ is small enough to consider that the motion is linear from
    one image to another.


    Let $\mathbf{m}_i = (x_i, y_i)^T$ be a point of interest detected in the $i^{th}$
    frame, moving with a speed of $\mathbf{v}_i = (u_i, v_i)^T$ (e.g., estimated by
    the optical flow). In the image plane, one can describe the motion of a point
    by a state vector $\mathbf{s}_i = (x_i\ y_i\ u_i\ v_i)^T$. We will denote by $\mathbf{z}_i$
    the measure of the position of the point of interest in the image.


    The goal of the Kalman filter is to compute $\mathbf{s}_i$, knowing $\mathbf{s}_{i-1}$
    and $\mathbf{z}_i$. Under the assumption of a Gaussian noise, the prediction of
    the current state $\mathbf{s}_i \sim \mathcal{N}(\mathbf{D}_i\mathbf{s}_{i-1};
    \Sigma_{d,i})$ where $\mathbf{D}_i$ is a dynamical model of its evolution state.
    Similarly, we suppose that the measure $\mathbf{z}_i \sim \mathcal{N}(\mathbf{M}_i\mathbf{s}_i;
    \Sigma_{m,i})$, where $\mathbf{M}_i$ is a precision model of the measures.


    $\mathbf{s}_0$ and $\Sigma_{d,0}, \Sigma_{m,0}$ are assumed to be known. We denote
    by $\Sigma_i$ the a priori estimation of the error.'
  merge: -1
  pgno: 221
- img_proc: true
  md: "# Chapter 8. Motion Estimation\n\nThe Kalman filter works in two steps:\n\n\
    +   1. A prediction step:\n\n$$\\mathbf{s}_i = \\mathbf{D}_i\\mathbf{s}_{i-1}$$\n\
    $$\\Sigma_i = \\Sigma_{d,i} + \\mathbf{D}_i\\Sigma_{i-1}\\mathbf{D}_i^\top$$\n\
    \n+   2. A correction step:\n\n$$\\mathbf{K}_i = \\Sigma_i\\mathbf{M}_i^\top(\\\
    mathbf{M}_i\\Sigma_i\\mathbf{M}_i^\top + \\Sigma_{m,i})^{-1}$$\n$$\\mathbf{s}_i\
    \ = \\mathbf{s}_i + \\mathbf{K}_i(\\mathbf{z}_i - \\mathbf{M}_i\\mathbf{s}_i)$$\n\
    $$\\Sigma_i = (I - \\mathbf{K}_i\\mathbf{M}_i)\\Sigma_i$$\n\nThe prediction step\
    \ derives an estimate of the state at time $i$ from time $i-1$, as well as the\
    \ error covariance matrix based on the error covariance of the system at the previous\
    \ time. The correction step corrects the estimate provided by the prediction step.\n\
    \nTypically, we choose $\\mathbf{D}_i = \\mathbf{D}$ and $\\mathbf{M}_i = \\mathbf{M}$.\
    \ In prediction, the uncertainty increases with time, and error models can be\
    \ used to specify when one should rely more on the measurements made in the image\
    \ or the calculations made. The gain $\\mathbf{K}_i$ specifies how strongly the\
    \ current state $\\mathbf{s}_i$ tends towards the measurements $\\mathbf{z}_i$\
    \ with time, and also how much the accuracy of the estimate $\\mathbf{s}_i$ will\
    \ be reduced with time.\n\nIn the case we are interested in (the state is defined\
    \ by the positions and the speed of the tracked object), we have in particular\n\
    \n$$\\mathbf{M} = \begin{pmatrix} 1 & 0 & 0 & 0 \\ 0 & 1 & 0 & 0 \\end{pmatrix}\
    \ \\text{ and } \\mathbf{D} = \begin{pmatrix} 1 & 0 & \\Delta r & 0 \\ 0 & 1 &\
    \ 0 & \\Delta r \\ 0 & 0 & 0 & 1 \\ 0 & 0 & 0 & 1 \\end{pmatrix}$$\n\nCode 8.10\
    \ proposes the implementation of linear Kalman filtering. Figure 8.9 illustrates\
    \ the fact that the Kalman filtering manages to recover the object to be tracked,\
    \ even after an occlusion (see Figure 8.6 for comparison). The image on the right,\
    \ much further in the sequence, illustrates the fact that the cyclist was found\
    \ after occlusion by the trees.\n\n```\nCode 8.10 — Kalman filter.\n```\n\n```\n\
    /*nLinear Kalman filter.\nI : List of images\npos : Initial position of the tracked\
    \ object\nsize : Size of the window surrounding the object\n```"
