  md: '# 8.1 Optical flow: dense motion estimation


    where $F$ is a real positive function, with value 0 when the optical flow constraints
    here. $*$ (respectively $*_y$) indicates the partial derivative of $*$ along the
    axis x (resp. y). The minimization is performed by iterative schemes which are
    defined from the Euler-Lagrange equations related to the functional $E(\mathbf{v})$:


    ```

    $\frac{\partial F}{\partial u} - \frac{\partial}{\partial x}\frac{\partial F}{\partial
    u_x} - \frac{\partial}{\partial y}\frac{\partial F}{\partial u_y} = 0 \quad and
    \frac{\partial F}{\partial v} - \frac{\partial}{\partial x}\frac{\partial F}{\partial
    v_x} - \frac{\partial}{\partial y}\frac{\partial F}{\partial v_y} = 0$

    ```


    # HORN AND SCHUNCK METHOD


    Horn and Schuck [18] combine the luminance conservation equation with a global
    regularization to estimate the velocity field $v$, minimizing:


    ```

    $$\int_D (\nabla I^T \mathbf{v} + \alpha(||\nabla u||^2 + ||\nabla v||^2)) d\mathbf{m}$

    ```


    defined on the domain $D$, where the constant $\alpha$ allows to influence of
    the regularization term. It is thus a special case of the functional (8.1),


    ```

    $F(u, v, u_x, v_x, u_y, v_y, I_x, I_y, I_t) = (u I_x + v I_y + I_t)^2 + \alpha(u_x^2
    + u_y^2 + v_x^2 + v_y^2)$

    ```


    Note that Lucas and Kanade [24] propose a similar minimization, in a discretized
    and localized way, which will be discussed in Section 8.1.2.


    The associated Euler-Lagrange equations are:


    ```

    $$\begin{cases} (u_x + vl_y + I_t)I_x + \alpha\nabla^2 u = 0 \ (u_x + vu_y + I_t)I_y
    + \alpha\nabla^2 v = 0 \end{cases}$

    ```


    Horn and Schuck propose to rewrite these equations with a discrete approximation
    of the Laplacians $\nabla^2 u = 4(\bar{u}-\tilde{u})$ and $\nabla^2 v = 4(\bar{v}-\tilde{v})$
    with $\tilde{u}$ and $\bar{v}$ spatially averaged versions of $u$ and $v$. This
    leads to a linear system of two equations with unknowns $u$ and $v$, at each point
    of the field:


    ```

    $$\begin{cases} u(\tilde{I}_x + 4\alpha) + \tilde{v}I_y + (I_t - 4\alpha\tilde{u})
    = 0 \ v(\tilde{I}_y + 4\alpha) + \tilde{u}I_x + (I_t - 4\alpha\tilde{v}) = 0 \end{cases}$

    ```


    Solving this linear system gives the following expressions for $u$ and $v$:


    ```

    $u = \tilde{u} - \frac{I_x\tilde{u} + I_y\tilde{v} + I_t}{I_x^2 + I_y^2 + 4\alpha}
    \quad v = \bar{v} - \frac{I_x\tilde{u} + I_y\tilde{v} + I_t}{I_x^2 + I_y^2 + 4\alpha}$

    ```'
