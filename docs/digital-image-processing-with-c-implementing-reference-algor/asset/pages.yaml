  md: "# 11.4 Interactive deformation using RBF\n\nThe RBF interpolation works the\
    \ same for any dimension $n$ of the definition space $f$ in that it interpolates\
    \ the known values in a continuous way, and these values do not have to be located\
    \ on a regular grid in $\\mathbb{R}^n$. From an algorithmic point of view, the\
    \ method relies mainly on the inversion of a $K \times K$ symmetric matrix, for\
    \ which there exists an algorithm in $O(K^3)$. This means that the computation\
    \ time increases quickly with the number of known samples $K$.\n\nFigure 11.15\
    \ shows the application of the RBF interpolation for the reconstruction of any\
    \ gray-level image, of size $222 \times 171$, from a small selection of 1187 sample\
    \ values (representing 3% of the total image data).\n\n![](img/6b7de6c7ce31f7bb2927e7184da0492f_291_0.png)\n\
