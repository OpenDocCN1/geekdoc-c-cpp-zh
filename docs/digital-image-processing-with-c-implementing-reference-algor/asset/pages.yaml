  md: '# # 5. Filtering


    # ## 5.1 Spatial filtering


    # ### 5.1.1 Introduction


    The term "spatial" refers to the set of pixels of the image. Any spatial processing
    can be expressed as


    ```

    $J(x,y) = T[I(x,y)],$

    ```


    where $I$ is the original image, $J$ the processed one and $T$ an operator acting
    on $I$, defined on a neighborhood of $(x,y)$. If this neighborhood is of size
    1, $T$ acts pixel by pixel, and we related this filtering to point analysis (Chapter
    3).


    We consider in a following neighborhood of size strictly greater than 1, centered
    in $(x,y)$. We are then interested in spatial filtering (as opposed to frequency
    filtering, which we will discuss in the next section), and we detail here linear
    and non-linear filters.


    Linear filters are based on the linearity assumption of the acquisition system.
    Lowpass filters attenuate or eliminate the high spatial frequencies in the image,
    leaving the low frequencies intact. On the contrary, high-pass filters leave the
    high frequencies intact. Finally, band-pass filters attenuate or eliminate a given
    frequency band.


    Whatever the type of linear spatial filtering, the approach is identical. It consists
    of defining around a pixel $(x,y)$ a mask $W$ of odd size $M \times N$, centered
    in $(x,y)$. $W$ is described by a matrix of coefficients $w_{i,j}$ where $i \in
    [-\frac{M-1}{2}, \frac{M-1}{2}]$ and $j \in [-\frac{N-1}{2}, \frac{N-1}{2}]$.
    The filtering process then consists simply in scanning the image using $W$ and
    in the assignment to the pixel $(x,y)$ of the gray level resulting from the linear
    combination of the neighboring pixels weighted by the coefficients of the filter
    (Equation 5.1):


    ```

    $J(x,y) = \sum_{i=-\frac{M-1}{2}}^{\frac{M-1}{2}} \sum_{j=-\frac{N-1}{2}}^{\frac{N-1}{2}}
    w_{i,j}I(x+i,y+j) \quad (5.1)$

    ```


    This refers to discrete convolution and we note $J = W * I$. Very often $M = N$.'
