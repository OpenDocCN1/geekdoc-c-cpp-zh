- img_proc: true
  md: "# 9.1 Dimension reduction\n\n**D** is a diagonal matrix, each $d_{ii}$ giving\
    \ the importance of the individual $i$ in the data (most often **D = $\\frac{1}{n}$I**,\
    \ which we will assume in the sequel), and **I** is the vector of $\\mathbb{R}^n$\
    \ whose components are all equal to 1. The matrix $Y = X - \\mathbf{1}g^T$ is\
    \ the centered array associated to **X**.\n\nIf $D_{1/\\alpha}$ is the diagonal\
    \ matrix of the inverse of the standard deviations of the variables, then $Z =\
    \ YD_{1/\\alpha}$ is the matrix of standardized centered data and\n\n# **R = Z^TZ$**\n\
    \nUsing CIMg<> and assuming that the p multispectral image is contained in a CIMg<>\
    \ of size $(w, h, l, p)$, then the matrix **R** is computed by:\n\n```\nCIMg<>\
    \ mean(p, l), var(p, l);\ncimg_forC(imgIn, c)\n{\n    mean(c) = imgIn.get_channel(c).mean();\n\
    \    var(c) = 1./std::sqrt(imgIn.get_channel(c).variance());\n}\n\n// Data matrix.\n\
    CIMg<> X(p,imgIn.width()*imgIn.height());\ncimg_forXY(imgIn,x,y,c)\nX(c,x + y*imgIn.width(0))\
    \ = imgIn(x,y,0,c);\n\n// Centered/standardized data.\nCIMg<> ones(1,imgIn.width()*imgIn.height());\n\
    var.diagonal() Z = (X - ones)*var;\n\n// Correlation matrix (up to p).\nCIMg<>\
    \ R = Z.get_transpose()*Z;\n```\n\nPCA aims obtaining an approximate representation\
    \ of the cloud of $n$ individuals (pixels) in a $k$ low-dimensional subspace $\\\
    mathcal{F}_k$. This is done by a projection mechanism. The choice of the projection\
    \ space is driven by the following criterion, which aims at distorting the distances\
    \ in projection as little as possible: the subspace of dimension $k$ is such that\
    \ the average of the squares of the distances between projections is the largest.\
    \ By defining the inertia of a point cloud as the weighted average of the squares\
    \ of the distances to the center of gravity, the criterion aims at maximizing\
    \ the inertia of the cloud projected on $\\mathcal{F}_k$."
  merge: -1
  pgno: 227
- img_proc: true
  md: '# 212 Chapter 9. Multispectral Approaches


    Let $u \in \mathbb{R}^p$. The projection of the standardized centered individuals
    on the line generated by $u$ is $\mathbf{P}_u = \mathbf{Z}u$. The empirical variance
    (inertia) in the line is therefore


    ```

    $\mathbf{P}_u^T\mathbf{P}_u = \mathbf{u}^T\mathbf{Z}^T\mathbf{Z}$

    ```


    The matrix $\mathbf{Z}^T\mathbf{Z}$ being symmetric $\mathbf{Z}^T\mathbf{Z} =
    \mathbf{Q}^F\Lambda\mathbf{Q}^F$, and


    ```

    $\mathbf{P}_u^T\mathbf{P}_u = \mathbf{u}^T\mathbf{Q}^T\Lambda\mathbf{Q}u = \mathbf{v}^T\Lambda\mathbf{v}$
    where $\mathbf{v} = \mathbf{Q}u$

    ```


    Seeking to maximize the inertia on the line $\mathscr{F}_1$, the vector $\mathbf{u}_1$
    to choose is the eigenvector of $\mathbf{Z}^T\mathbf{Z}$ associated to the largest
    eigenvalue $\lambda_1$. For this vector, $\mathbf{v}^T\Lambda\mathbf{v} = \lambda_1$
    is the inertia of the line generated by $\mathbf{u}_1$. If this variance is not
    enough (we do not explain enough of the initial variation of X), then we start
    the procedure again in the space orthogonal to $\mathbf{u}_1$. We obtain a second
    line, generated by $\mathbf{u}_2$, and we iterate possibly in the orthogonal of
    $(\mathbf{u}_1,\mathbf{u}_2)$ until a sufficient amount of variance is obtained.
    This finally aims to search for $\mathscr{F}_k$, the eigenspace of $\mathbf{Z}^T\mathbf{Z}$,
    generated by the first $k$ eigenvectors, defining the principal axes (or principal
    components - PC). The inertia explained by this is $\sum_{i=1}^k \lambda_i$.


    Using $CIMg<T>::get\_symmetric\_eigen()$, the projection is implemented as follows:


    ```

    CIMgList< > eig = R.symmetric_eigen();

    &val = eig[0];

    CIMg>

    &vec = eig[1];

    ```


    ```

    CIMg<> Xpca = X*vec;

    ```


    # INTERPRETATION


    The primary goal of PCA is to reduce the dimension to allow an efficient visualization
    of the data, while preserving the information (here represented by the inertia).
    Therefore, we need tools to answer the question: what dimension for $\mathscr{F}_i$?
    There is no theoretical answer, the main thing being to have a sufficiently expressive
    representation to allow a correct interpretation of the variation of the data.
    Commonly used include:


    +   * the total percentage of explained variance, expressed on the first $k$ axes
    by $\frac{\sum_{i=1}^k \lambda_i}{\sum_{j=1}^p \lambda_j}$

    A threshold (e.g., 90%) of the total explained inertia gives a corresponding value
    of $k$. However, the percentage of inertia must take into account the number of
    initial variables;'
  merge: -1
