    \ keypoints(p,1)*(img.height()-1)/100;\n        r = hypot(4*x - xp, 4*y - yp);\n\
    \        phi_r = phi(r);\n        u += W(0,p)*phi_r;\n        v += W(1,p)*phi_r;\n\
    \    }\nwarp(x,y,0) = 4*x - u;\nwarp(x,y,1) = 4*y - v;\n}\nwarp.resize(img.width(),img.height(),1,2,3);\n\
