    # 4.3.4 Skeletonization


    Skeletonization (or thinning) is a classical technique in mathematical morphology
    whose objective is to reduce binary objects to a structure of single pixel thick
    without breaking the topology and connectivity of the objects. This process is
    achieved by the iterative application of conditional erosions in a local neighborhood
    of each point, if a sufficient “thickness” remains in order not to modify the
    connectivity of the objects. This implies a local decision process which can make
    this skeletonization costly. Many skeletonization algorithms exist in the literature
    and we presented in the following to implement Zhang and Suen''s algorithm [44].


    Let $I$ be a binary image containing a white object on a dark background. For
    each pixel in $I$, a $3\times3$ neighborhood $N$ is analyzed, following Fig. 4.12.


    | N3 | N2 | N1 |

    |---|---|---|

    | N4 | (x,y) | N0 |

    | N5 | N6 | N7 |


    Figure 4.12 – Neighborhood of N pixel $(x,y)$. Neighbors are labeled from $N_0$
    to $N_7$.


    Two functions are then defined:


    +   1. $B(N)$, giving the number of pixels of the binary object in $N$: $B(N)
    = \sum_{i=0}^7 N_i$

    2. $C(N)$, called connectivity number, expressing how many binary components are
    connected to the central pixel $(x,y)$. It is therefore the number of $1\to0$
    transitions in $N$, and $C(N) = \sum_{i=0}^7 N_i(N_i - N_{(i+1)})$


    From $B$ and $N$, one deduces two predicates:


    ```

    $\mathcal{R}_1(N) = \{(2 \le B(N) \le 6) \text{ AND } (C(N) = 1) \text{ AND }
    (N_0N_0N_2 = 0) \text{ AND } (N_4N_4N_0 = 0)\}$$\n$\mathcal{R}_2(N) = \{(2 \le
    B(N) \le 6) \text{ AND } (C(N) = 1) \text{ AND } (N_0N_2N_4 = 0) \text{ AND }
    (N_2N_4N_6 = 0)\}$

    ```'
