  md: '# 4. Mathematical Morphology


    Mathematical morphology [36] is a formalism initially designed to explore the
    geometrical structure of objects in an image. The development of techniques based
    on these tools then allowed the application domains to be widened, for example
    for contrast enhancement or filtering. Seen from the “pattern recognition” point
    of view, image processing aims to extract geometric information (location, perimeter,
    area, orientation, ...) from a given image, allowing objects to be discriminated
    in a scene.


    In the context of mathematical morphology and in order to extract a particular
    geometrical structure, the key point is the design of a shape operator which possesses
    a certain number of expected properties (for example, invariance to translation)
    and allowing to discriminate a particular object. Several problems arise, notably
    the fact that the objects are opaque, and therefore the shape information is not
    additive. In fact, the objects in a scene are mainly combined in two forms:


    +   * by union of sets (overlapping objects): $X = X_1 \cup X_2$

    * by intersection of sets (occlusion): $X = X_2 \setminus X_1 = X_1^c \cap X_2$


    The shape operator $\Psi$ to be designed must then be distributed over the set
    of unions and intersections (equivalent to linearity), that is:


    +   * $\Psi_\delta(X_1 \cup X_2) = \Psi_\delta(X_1)\Psi_\delta(X_2)$

    * $\Psi_\epsilon(X_2 \setminus X_1) = \Psi_\epsilon(X_1)\cap\Psi_\epsilon(X_2)$


    The first operation will be called morphological dilation and the second morphological
    erosion. These two operations are the basis of mathematical morphology, from which
    more complex morphological operators can be designed.


    In the following, we specify the notions of erosion, dilation and various other
    operations in the context of binary images, and then we extend the discussion
    to the more general case of grayscale images.'
