    # 5.3.3 Frequency filtering


    > PRINCIPLE


    Smoothing by reducing the high frequency content or enhancing contours by increasing
    the high frequency components with respect to the low frequencies from concepts
    directly related to the Fourier transform. In fact, the idea of linear filtering
    is more intuitive in the frequency domain. In practice, spatial masks (see Section
    5.1) are much more used than the Fourier transform because of their simplicity
    of implementation and their speed. But the understanding of the phenomena in the
    frequency domain is essential to solve problems that are difficult to grasp with
    purely spatial techniques. Linear filtering can thus be calculated, either in
    the spatial domain by a discrete convolution in the digital images (Equation 5.1),
    or by a complex multiplication in the frequency domain. The principle of frequency
    filtering is simple: take the Fourier transform of the image to be filtered, multiply
    the spectrum obtained by the frequency response of the filter, then take the inverse
    Fourier transform to produce the filtered image (Algorithm 2).


    > IDEAL LOW-PASS FILTER


    The ideal low-pass filter is described by the frequency response:


    ```

    $$\widehat{H}_l(f_x, f_y) = \begin{cases} 1 & \text{if } \rho(f_x, f_y) \leq f_c
    \ 0 & \text{if } \rho(f_x, f_y) > f_c \end{cases}$

    ```'
