    # PERONA AND MALIK''S ALGORITHM


    The introduction of non-linear diffusion equations in the field of image processing
    dates back to a 1990 paper by Perona and Malik [32]. The weakness of the heat
    equation is that the diffusion is identical at any point of the image (this equation
    initially models the diffusion of heat in an isotropic medium). In particular,
    as we saw in the previous paragraph, the image is smoothed both in the homogeneous
    areas and along the contours.


    The idea of Perona and Malik is to smooth the image in the homogeneous areas,
    and not to make the image evolve along the contours, or even to enhance them,
    as we saw more precisely. The corresponding equation is written:


    ```

    $$\frac{\partial I}{\partial t}(x,y)=div(g(|\nabla I||(x,y))\nabla I(x,y)$

    ```


    where g is a decreasing function, with $g(0) = 1$ and $\lim_{x\to\\infty}g(x)=0$.
    The equation is therefore close to the heat equation at the points where $|\nabla
    I||$ is close to 0. As an example, we consider the following function, originally
    proposed in [32].


    ```

    $g_1(s)=\frac{1}{1+(\lambda s)^2}$ (5.14)

    ```


    This metric imposes a lower diffusion for higher gradient values (in norm). So
    the contours are preserved. The parameter $\lambda$ allows to set a more or less
    important diffusion compared to the value of the norm of the gradient. Indeed,
    a high $\lambda$ value will preserve contours with gradients which are lower in
    norm.


    # DISCRETIZATION SCHEME


    The explicit discretization scheme of Perona-Malik''s method for all points $[i,
    j]$ and at time $t+\Delta t$ is:


    ```

    $I_{i,j}^{t+\Delta t}=I_{i,j}^t+\Delta t(c_{E_{i,j}}^2\nabla E_{i,j}+c_{W_{i,j}}^2\nabla
    W_{i,j}+c_{N_{i,j}}^2\nabla N_{i,j}+c_{S_{i,j}}^2\nabla S_{i,j})$

    ```


    where $N, S, E$ and $W$ represent the north, south, east and west spatial directions,
    symbol $\nabla$ denotes the spatial gradient in the direction indicated by the
    subscript, and coefficients $c$ are defined by:'
