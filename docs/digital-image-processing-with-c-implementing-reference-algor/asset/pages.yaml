    \ = (x,y)$, this sum is computed for a shift $\\mathbf{\\delta} = (\\delta x,\
    \ \\delta y)^\top$ by\n\n```\n$S(\\mathbf{x}) = \\sum_{(x_i,y_i) \\in W} G_x(x_i,y_i)\
    \ (I(x_i,y_i) - I(x_i+\\delta x, y_i+\\delta y))^2$\n```\n\nWhere W is a window\
