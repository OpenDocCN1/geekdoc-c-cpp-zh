  md: '# 7. Segmentation


    Segmentation consists of identifying and defining objects in the image: it is
    no longer a collection of pixels, but a set of disjointed regions forming a scene.
    Ideally, regions have a meaning (object, structure, signal, ... or background)
    apart from their own characteristics (gray levels, signal, shape).


    Segmentation algorithms can be divided into two groups:


    +   * region-based segmentation: pixels with common characteristics (called attributes
    or features), derived from the intensity of the pixels or from characteristics
    calculated on these intensities, the grouping criterion is evaluated in absolute
    (amplitudes) or in relative terms; decision rules (thresholds or metrics on the
    feature space) are then used to define which pixels belong to the same region,
    whether it is connected or not;

    * edge-based segmentation: boundaries are set up [6] at positions that locally
    maximize the variation of a criterion: a contour is a closed curve or surface
    (in the case of 3D images) 1 pixel thick, which is generally closed.


    These are two dual conceptions: a region has a closed contour, and a closed contour
    defines an inner and an outer region.


    # 7.1 Edge-based approaches


    There are several ways to perform an image segmentation by an “edge” approach.
    We introduce here a popular method called active contours.


    # 7.1.1 Introduction to implicit active contours


    Active contours are a method of image analysis allows the extraction of primitives
