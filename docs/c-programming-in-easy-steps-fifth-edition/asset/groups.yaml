- md: "\nexecuted successfully.\n\nThe C++ compiler also supports multiple-line C-style\
    \ comments between `/*` and `*/` – these should only ever be used in C++ programming\
    \ to “comment-out” sections of code when debugging.\n\nNotice how the program\
    \ code is formatted using spacing and indentation (collectively known as whitespace)\
    \ to improve readability. All whitespace is ignored by the C++ compiler.\n\n#\
    \ Compiling & running programs\n\nThe C++ source code files for the examples in\
    \ this book are stored in a directory created expressly for that purpose. The\
    \ directory is named “MyPrograms” – its absolute address on a Windows system is\
    \ C:\\MyPrograms and on Linux is ~/home/user/MyPrograms. You can recreate this\
    \ directory to store programs awaiting compilation:\n\n- Move the \"hello.cpp\"\
    \ program source code file, created here, to the \"MyPrograms\" directory on your\
    \ system\n- At a command prompt, use the \"cd\" command to navigate to the \"\
    MyPrograms\" directory\n- Enter a command to attempt to compile the program `c++\
    \ hello.cpp`\n\nYou can see the compiler version number with the command `c++\
    \ --version` and display all its options with `c++ --help`.\n\nWhen the attempt\
    \ succeeds, the compiler creates an executable file alongside the original source\
    \ code file. By default, the executable file is named a.exe on Windows systems\
    \ and a.out on Linux. Compiling a different source code file in the same directory\
    \ would now overwrite the first executable file without warning. This is obviously\
    \ undesirable, so a custom name for the executable file should be specified when\
    \ compiling programs, using the compiler’s -o in the compile command.\n\nThe command\
    \ `c++` is an alias for the GNU C++ Compiler – the command g++ can also be used.\n\
    \n- Enter a command to compile the program, creating an executable file named\
    \ “hello.exe\" alongside the source file: `c++ hello.cpp -o hello.exe`\n\nTo run\
    \ the executable program file in Windows, simply enter the file name at the prompt\
    \ in the “MyPrograms” directory – optionally, the file extension may be omitted.\
    \ In Linux, the full file name must be used, preceded by a ./ dot-slash – as Linux\
    \ does not look in the current directory unless it is explicitly directed to do\
    \ so:\n\n```\nCommand Prompt\nMicrosoft Windows [Version 10.0.14393]\n(c) 2016\
    \ Microsoft Corporation. All rights reserved.\nC:\\MyPrograms>c++ hello.cpp -o\
    \ hello.exe\nC:\\MyPrograms>hello\nHello World!\nC:\\MyPrograms>\n```\n\n```\n\
    Terminal\nuser> cd /home/user/MyPrograms\nuser> c++ hello.cpp -o hello.exe\nuser>\
    \ ./hello\nHello World!\nuser>\n```\n\nAll command line examples in this book\
    \ have been compiled and tested with the latest GNU C++ Compiler available at\
    \ the time of writing – they may not replicate exactly with other compilers.\n\
    \n# Creating variables\n\n“variable” is like a container in a C++ program in which\
    \ a data value can be stored inside the computer’s memory. The stored value can\
    \ be referenced using the variable’s name.\n\nThe programmer can choose any name\
    \ for a variable, providing it adheres to C++ naming conventions – a chosen name\
    \ may only contain letters, digits, and the underscore, but cannot begin with\
    \ a digit. C++ keywords, listed on the inside of this book must be avoided. It’s\
    \ good practice to choose meaningful names to make the code comprehensible.\n\n\
    To create a new variable in a program it must be “declared”, specifying the type\
    \ of data it contains and its chosen name. A variable declaration has this syntax:\n\
    \n```\ndata-type variable-name;\n```\n\nNames are case-sensitive in C++ – so variables\
    \ VAR, Var, and var are treated as individual variables. Traditionally C++ variable\
    \ names are lowercase and seldom begin with an underscore. Multiple variables\
    \ of the same data type can be created in a single declaration as a comma-separated\
    \ list with this syntax:\n\n```\ndata-type variable-name1, variable-name2, variable-name3;\n\
    ```\n\nThe five basic C++ data types are listed in the table below, together with\
    \ a brief description and example:\n\n| Data Type | Description | Example |\n\
    | :--- | :--- | :--- |\n| char | A single byte, capable of holding one character\
    \ | 'A' |\n| int | An integer number | 100 |\n| float | A floating-point number,\
    \ correct to six decimal places | 0.123456 |\n| double | A floating-point number,\
    \ correct to 10 decimal places | 0.123456789 |\n| bool | A Boolean value of true\
    \ or false, numerically zero is false and any-zero is true | 0 or 1 |\n\nCharacter\
    \ values of the char type must always be enclosed between single quotes – not\
    \ double quotes. Variable declarations must appear before executable statements\
    \ – so they will be available within statements.\n\nWhen a value is assigned to\
    \ a variable it is said to have been “initialized”. Optionally, a variable may\
    \ be initialized in its declaration. The value stored in any initialized variable\
    \ can be displayed on standard output by the cout function, which was used here\
    \ to display the “Hello World!” greeting.\n\n1 Add a new program by specifying\
