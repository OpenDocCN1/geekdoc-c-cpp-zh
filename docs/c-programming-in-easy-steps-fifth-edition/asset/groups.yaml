  - "[PAGE 92]\n\n# Looping while\n\nAn alternative to the for loop, introduced above,\
    \ uses the while keyword, followed by an expression to be evaluated. When the\
    \ expression is true, statements contained within braces following the test expression\
    \ will be executed. The expression will be evaluated again, and the while loop\
    \ will continue until the expression is found to be false.\n\nThe loop's statement\
    \ block must contain code that will affect the tested expression in order to change\
    \ the evaluation result to false, otherwise an infinite loop is created that will\
    \ lock the system! When the test expression is found to be false upon its first\
    \ evaluation, the while loop's statement block will never be executed.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_92_0.png)\n\
    \nIf you accidentally start running an infinite loop, press the Ctrl + C keys\
    \ to terminate the process.\n\nA variation of the while loop places the do keyword\
    \ before the loop's statement block and a while test after it, with this syntax:\n\
    \n```\ndo { statements-to-be-executed } while (test-expression) ;\n```\n\nIn a\
    \ while-loop, the statement block will always be executed at least once – because\
    \ the expression is not evaluated until after the first iteration of the loop.\n\
    \nA break statement can be included in any kind of loop to immediately terminate\
    \ the loop when a test condition is met. The break ensures no further iterations\
    \ of the loop will be executed.\n\nSimilarly, a continue statement can be included\
    \ in any kind of loop to immediately terminate that iteration of the loop when\
    \ a test condition is met. The continue statement allows the loop to proceed to\
    \ the next iteration.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_92_1.png)\n\n\
    +   1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use\n#include <vector> // Include vector support.\n#include\
    \ <iostream>\n namespace std;"
