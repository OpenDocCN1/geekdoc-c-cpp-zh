    # Summary


    +   - The C++ `<fstream>` library provides functions for working with files as
    ifstream input of output stream objects.


    +   - Upon completion, a stream''s `close()` function should be called.


    +   - File modes can be used to control the behavior of a stream.


    +   - An input stream''s `get()` function reads one character at a time.


    +   - The `getline()` function can be used to read a line at a time from an input
    stream.


    +   - Optionally, the `getline()` function can have a third argument specifying
    a delimiter character at which to stop reading.


    +   - Insertion operators can be used with the `cin` and `cout` functions to modify
    their behavior.


    +   - The `cout.width(n)` function sets the width of the output stream.


    +   - The `cout.fill(c)` function specifies a character to occupy any empty portion
    of the output.


    +   - The `cout.precision(n)` function determines how many decimal places to display
    when the output is a floating point number.


    +   - A badly performing program may contain syntax errors, logic errors, or exception
    errors.


    +   - A `try` block can be used to enclose statements that, under certain conditions,
    may cause an exception error.


    +   - A `catch` block can be used to handle exception errors produced in its associated
    `try` block.


    +   - Exception errors that occur in a `try` block are automatically thrown to
    the associated `catch` block, or can be manually thrown using the `throw()` function.


    +   - The C++ `<stdexcept>` library defines a number of exception classes that
    categorize common exceptions, and the `<typeinfo>` library provides exception
    type information.'
- md: "\n## 6\n## Pointing to data\n\nThis chapter demonstrates how to produce efficient\
    \ C++ programs, utilizing pointers and references.\n\n- Understanding data storage\n\
    - Getting values with pointers\n- Doing pointer arithmetic\n- Passing pointers\
    \ to functions\n- Making arrays of pointers\n- Referencing data\n- Passing references\
    \ to functions\n- Comparing pointers & references\n- Summary\n\n## Understanding\
    \ data storage\n\nIn order to understand C++ pointers it is helpful to understand\
    \ how data is stored on your computer. Envision the computer's memory as a very\
    \ long row of sequentially numbered slots, which each can contain one byte of\
    \ data. When a variable is declared in a program, the machine reserves a number\
    \ of slots at which to store data assigned to that variable. The number of slots\
    \ it reserves depends on the variable's data type. When the program uses the variable\
    \ name to retrieve stored data, it actually retrieves the number of the variable's\
    \ first slot.\n\nComparison can be drawn to a long row of sequentially-numbered\
    \ houses that can each accommodate a different family. Any family can be explicitly\
    \ referenced by addressing the house number.\n\nThe slot (house) numbers in memory\
    \ are expressed in hexadecimal format and can be revealed by the & reference operator.\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_183_0.png)\n\n- Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n```cpp\n#include <string>\n#include <iostream>\nusing namespace std;\n\
    ```\n\n- Add a main function containing a final return statement and declaring\
    \ three initialized variables\n```cpp\nint main() {\n  int num = 100;\n  double\
    \ sum = 0.0123456789;\n  string text = \"C++ Fun\";\n  // Add more statements\
    \ here.\n  return 0;\n}\n```\n\n- In the main function, insert statements to output\
    \ the memory address of the first slot of each variable\n```cpp\ncout << \"Integer\
    \ variable starts at: \" << &num << endl;\ncout << \"Double variable starts at:\
    \ \" << &sum << endl;\ncout << \"String variable starts at: \" << &text << endl;\n\
    ```\n\n- Save, compile, and run the program to see the three memory addresses\n\
    \n## Command Prompt\n\n```\nC:\\MyPrograms>c++ address.cpp -o address.exe\nC:\\\
    MyPrograms>-address\nInteger variable starts at: 0x61ff18\nDouble variable starts\
    \ at: 0x61ff10\nString variable starts at: 0x61fef8\nC:\\MyPrograms>_\n```\n\n\
    Once memory space has been reserved by a variable declaration, a value of the\
    \ appropriate data type can be stored using the = assignment operator. For example,\
    \ num = 100 takes the value on its right (100) and puts it in the memory referenced\
    \ by the named variable on its left (num).\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_184_0.png)\n\
    \nThe location addresses are dynamically allocated – so will vary from those in\
    \ this screenshot.\n\nThe operand to the left of the = assignment operator is\
    \ called \"L-value\" and the operand to its right is called \"R-value\". Consider\
    \ the \"L\" in L-value to mean \"Location\" and consider the \"R\" in R-value\
    \ to mean \"Read\".\n\nOne important rule in C++ programming insists that an R-value\
    \ cannot appear on the left of the = operator, but an L-value may appear on either\
    \ side. Code that places an R-value to the left of an = assignment operator will\
