    \ <iostream>\n#include <sstream>\nusing namespace std;\n```\n\n- Add a main function\
    \ containing one string variable declaration and a final return statement\n```cpp\n\
    int main() {\n  string name;\n  // Add more statements here.\n  return 0;\n}\n\
    ```\n\n- In the main function, insert statements assigning the user name input\
    \ to a string variable, outputting its value\n```cpp\ncout << \"Please enter your\
    \ full name: \";\ncin >> name;\ncout << \"Welcome \" << name << endl;\n```\n\n\
    - Next, insert a string variable requesting the user name again, but this time\
    \ assigning the input to cin << getline() function before outputting its value\n\
    ```cpp\ncout << \"Please re-enter your full name: \";\ngetline(cin, name);\ncout\
    \ << \"Thanks, \" << name << endl;\n```\n\n- Save, compile, and run the program\
    \ and re-enter your full name when requested\n\nThis unsatisfactory shows that\
    \ cin reads up to the first space, leaving the second name in the input buffer,\
    \ which is then read by getline() and subsequently output. The problem persists\
