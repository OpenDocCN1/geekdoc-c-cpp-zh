  - "[PAGE 254]\n\n# Calling a virtual method\n\nA base class pointer that is bound\
    \ to a specific derived class can be used to call derived class methods that have\
    \ been inherited from the base class. Methods that are unique to the derived class\
    \ must, however, be called via an instance object.\n\nA base class pointer that\
    \ is bound to a specific derived class can also be used to explicitly call a method\
    \ in the base class using the :: scope resolution operator.\n\nMost useful, an\
    \ inherited method in a derived class can override that in the base class when\
    \ the base method has been declared as a “virtual” method. This is just a regular\
    \ declaration in the base class preceded by the virtual keyword. The declaration\
    \ of a virtual method indicates that the class will be used as a base class from\
    \ which another class will be derived, which may contain a method to override\
    \ the virtual base method.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_254_0.png)\n\
    \nvirtual.cpp\n\n+   1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n#include <iostream>\nusing namespace\
    \ std;\n\n+   2. Declare a base class named “Parent”, containing a regular method\
    \ declaration and a\nclass Parent\n```cpp\n{\n    void Common() const\n    { cout\
    \ << \"I am part of this family, \" }\n    virtual void Identify() const\n   \
    \ { cout << \"I am the parent\" << endl; }\n};\n```\n\n+   3. Declare a derived\
    \ class named “Child\", containing a method to override the base method\nclass\
    \ Child : public Parent\n```cpp\n{\n    void identify() const\n    { cout << \"\
    I am the child\" << endl; }\\};\n```"
