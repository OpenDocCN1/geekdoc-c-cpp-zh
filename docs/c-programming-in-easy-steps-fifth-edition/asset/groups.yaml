    \ = \" << (a /= b);\ncout << endl << \"Modulus and assign:\";\ncout << \"a %=\
    \ b (8 % 4) = \" << (a %= b);\n```\n\n6. 保存、编译并运行程序查看输出。\n\n与 `=` 赋值运算符不同，`==`\
    \ 等于运算符比较操作数并在此描述。\n\n# 比较值\n\nC++ 编程中常用的比较两个数值的运算符列在表所示：\n\n| 运算符 | 比较测试: |\n\
    | --- | --- |\n| == | 等于 |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于\
