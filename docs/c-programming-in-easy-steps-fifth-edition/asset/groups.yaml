    \ width, float height)\n{\n    return (width * height);\n}\nfloat computeArea(char\
    \ letter, float width, float height)\n{\n    return ((width / 2) * height);\n\
    }\n\n+   6. 在 main 函数中，插入语句声明两个变量，并将其中一个初始化为用户输入\nfloat num, area;\ncout << \"\
    输入尺寸（英寸）： \";\ncin >> num;\n\n调用第一个函数并输出其返回值\narea = computeArea(num);\ncout <<\
