    \nLaser Sailboat (Boat)\n\n尝试添加一个派自 `Boat` 类的 `Powerboat` 类（用于包含引擎信息），以及一个派自 `Powerboat`\
    \ 类的 `Cruiser` 类——用于为变量赋值并定义虚方法。\n\n# 隔离类结构\n\n\n\n书中每个示例程序的源代码通常包含在单个 `.cpp`\
    \ 文件中以节省空间，但实际上，OOP 程序通常包含在三个独立的文件中：\n\n- 头文件 `.h` 文件 – 仅包含类声明。\n- 实现文件 `.cpp`\
    \ 文件 – 包含类定义，用于实现头文件中声明的方法，该文件通过 `#include` 指令引用。\n- 客户端 `.cpp` 文件 – 包含一个 `main`\
    \ 方法，用于使用头文件中声明的类成员，该文件也通过 `#include` 指令引用。\n\n客户端文件有时被称为“驱动”（driver）文件。\n\n例如，一个求法计算器程序可能由三个文件组成：`ops.h`（声明操作类的头文件）、`ops.cpp`（定义操作方法的实现文件）和\
    \ `sum.cpp`（调用各种操作的客户端文件）。\n\n编译 `sum.cpp` 时，编译器会将包含的头文件和实现文件合并到程序。它首先将头文件和实现文件转换为二进制对象文件（`ops.o`），然后将头文件和客户端文件转换为第二个二进制对象文件（`sum.o`）。最后，链接器（Linker）将两个对象文件合并成单个可执行文件（`sum.exe`）。\n\
    \n使用 `#include` 指令引用头文件的方式与使用 `#include` 指令引用标准 C++ 库的方式类似。\n\n将类结构隔离在独立的“模块”文件中具有提高可移植性的优点，并且通过清晰地识别每个文件的目的使代码维护变得更容易。\n\
    \n要让编译器将所有源代码文件合并成单个可执行文件，只需要在编译器命令中显式指定 `.cpp` 文件——`#include` 指令确保头文件也会被识别。\n\
    \n例如，在 `ops.cpp` 和 `sum.cpp` 中都使用 `#include \"ops.h\"` 语句，编译下方示例的命令在编译器命令中没有指定\
    \ `ops.h` 头文件，而只是 `c++ ops.cpp sum.cpp -o sum.exe`。\n\n## 计算器\n\n此示例将允许用户输入一个简单的算术表达式并输出计算结果。在首次启动时将提供说明，并允许用户输入后续表达式——或通过零字符。\n\
    \n### ops.h\n\n1. 通过声明一个名为“Calculator”的类来开始头文件\n```cpp\nclass Calculator\n{\n\
    ```\n\n2. 在类声明中，插入公共（public）方法声明\n```cpp\npublic:\n    Calculator(); // (构造函数)\n\
    \    void launch(); // 显示说明。\n    void readInput(); // 获取输入。\n    void writeOutput();\
    \ // 显示结果。\n    bool run(); // 获取当前状态。\n```\n\n3. 在类声明中，插入私有（private）变量\n```cpp\n\
    private:\n    double num1, num2;\n    char oper;\n```\n\n4. 将头文件保存为“ops.h”。\n\n\
    5. 在实现文件中，定义头文件中声明的方法。\n\n### 使用隔离的类\n\n### ops.cpp\n\n使用 #include 指令开始实现文件，在此处包含头文件\n\
    ```cpp\n#include \"ops.h\"\n#include <iostream>\nusing namespace std;\n\nCalculator::Calculator()\n\
    {\n    status = true;\n}\n\nvoid Calculator::launch()\n{\n    cout << \"*** SUM\
    \ CALCULATOR ***\" << endl;\n    cout << \"Enter a number, an operator (+,-*,/),\
    \ and another number.\" << endl;\n    cout << \"Hit Return to calculate. Enter\
    \ zero to exit.\";\n}\n\nvoid Calculator::readInput()\n{\n    cout << \"> \";\n\
    \    cin >> num1;\n    if (num1 == 0)\n        status = false;\n    else {\n \
    \       cin >> oper;\n        cin >> num2;\n    }\n}\n\nvoid Calculator::writeOutput()\n\
    {\n    if (status) {\n        switch (oper) {\n            case '+': cout << num1\
    \ + num2 << endl; break;\n            case '-': cout << num1 - num2 << endl; break;\n\
    \            case '*': cout << num1 * num2 << endl; break;\n            case '/':\
    \ \n                if (num2 != 0)\n                    cout << num1 / num2 <<\
    \ endl;\n                else\n                    cout << \"Cannot divide by\
    \ zero\" << endl;\n                break;\n        }\n    }\n}\n\nbool Calculator::run()\n\
    {\n    return status;\n}\n```\n\n### sum.cpp\n\n使用 #include 指令开始客户端文件，在此处包含头文件\n\
    ```cpp\n#include \"ops.h\"\n\nint main() {\n    Calculator* pCalc = new Calculator;\n\
    \    pCalc->launch();\n    while (pCalc->run()) {\n        pCalc->readInput();\n\
    \        pCalc->writeOutput();\n    }\n    delete pCalc;\n    return 0;\n}\n```\n\
    \n由于空间限制，此程序几乎没有尝试验证输入——它假设用户会输入有效的表达式，例如 8 * 3。\n\n将客户端文件保存为“sum.cpp”，与 `ops.h`\
    \ 和 `ops.cpp` 放在一起，然后使用命令编译程序：\nc++ ops.cpp sum.cpp -o sum\n\n运行程序并输入简单的表达式以查看结果，然后输入零并按回车键退出程序。\n\
    \n"
