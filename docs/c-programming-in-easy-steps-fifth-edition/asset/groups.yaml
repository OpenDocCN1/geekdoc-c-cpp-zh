  - "[PAGE 84]\n\n# Switching branches\n\nThe if and else keywords, introduced above,\
    \ allow programs to branch in a particular direction according to the result of\
    \ a test condition, and can be used to repeatedly test a variable to match a value.\
    \ For example, testing an integer:\n\n```\nif (num == 1) { cout << \"Monday\"\
    ; }\nelse\nif (num == 2) { cout << \"Tuesday\"; }\nelse\nif (num == 3) { cout\
    \ << \"Wednesday\"; }\nelse\nif (num == 4) { cout << \"Thursday\"; }\nelse\nif\
    \ (num == 5) { cout << \"Friday\"; }\n```\n\nThe program will branch in the direction\
    \ of the match.\n\nConditional branching with long if-else statements can often\
    \ be more efficiently performed using a switch statement indent, especially when\
    \ the test expression evaluates one variable.\n\nThe switch statement works in\
    \ an unusual way. It takes a given variable value, then seeks a matching value\
    \ among a number of case statements. Statements associated with the case statement\
    \ value no match will be executed.\n\nWhen no match is found, no case statements\
    \ will be executed, but you may add a default statement after the final case statement\
    \ to specify statements to be executed when no match is found.\n\nIt is important\
    \ to follow each case statement with the break keyword, to stop the program proceeding\
    \ through the switch block after all statements associated with the matched case\
    \ value have been executed – unless that is precisely what you require. For example,\
    \ one statement for each of three values like this:\n\n```\nswitch(variable-name)\n\
    {\n  case value1; case value2; case value3;\n    statements-to-be-executed; break;\n\
    \  case value4; case value5; case value6;\n    statements-to-be-executed; break;\n\
    }\n```\n\nUsually, each case statement will have its own set of statements to\
    \ execute and be terminated by a break, as in the program below.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_84_0.png)"
- md: "\nMissing break keywords are not syntax errors – ensure that all intended breaks\
    \ are present after case statements.\n\n## switch.cpp\n\n-   Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n#include <iostream>\nusing namespace std;\n\n-   Add a main function containing\
    \ a final return statement\nint main() {\n  // Program code goes here.\n  return\
    \ 0;\n}\n\n-   In the main function, insert a statement to declare and initialize\
    \ an integer variable with a value to be matched\nint num = 3;\n\n-   Next, insert\
    \ a switch statement to seek a case\nswitch (num) {\n  case 1: cout << num <<\
    \ \": Monday \"; break;\n  case 2: cout << num << \": Tuesday \"; break;\n  case\
    \ 3: cout << num << \": Wednesday \"; break;\n  case 4: cout << num << \": Thursday\
    \ \"; break;\n  case 5: cout << num << \": Friday \"; break;\n}\n\n-   In the\
    \ switch statement, insert a default statement after the final case statement\n\
    default: cout << num << \": Weekend day \";\n\n-   Save, compile, and run the\
    \ program to execute\n\n-   Now, edit the integer variable declaration to change\
    \ its value, then save, compile and run the program once more\nint num = 6;\n\n\
    Notice that a **default** statement does not need to be followed by a **break**\
    \ keyword because a **default** statement always appears last in a **switch**\
    \ statement.\n\n## Looping for\n\nA loop is a piece of code in a program that\
    \ automatically repeats. One complete execution of all statements contained within\
    \ the loop block is known as an “iteration” or “pass”.\n\nThe number of iterations\
    \ made by a loop is controlled by a conditional test made within the loop. While\
    \ the tested expression remains true, the loop will continue – until the tested\
    \ expression becomes false, at which time the loop ends.\n\nThe three types of\
    \ loop structures in C++ programming are for loops, while loops, and do while\
    \ loops. Perhaps the most commonly used loop is the for loop, which has this syntax:\n\
    \n```\nfor ( initializer;test-expression ; incrementer) { statements }\n```\n\n\
    The initializer sets the starting value for a counter of the number of iterations\
    \ made by the loop. An integer variable is used for this purpose and is traditionally\
    \ named “i”.\n\nUpon each iteration of the loop, the test expression is evaluated,\
    \ and that iteration will only continue while this expression is true. When the\
    \ tested expression becomes false, the loop ends immediately without executing\
    \ the statements again. On each iteration the counter is incremented then the\
    \ statements executed.\n\nLoops may be nested within other loops – so that the\
    \ inner loop will fully execute its iterations on each iteration of the outer\
    \ loop.\n\nforloop.cpp\n\n-   1. Start a new program by specifying the C++ library\
    \ classes to include, and a namespace prefix to use\n#include <iostream>\nusing\
    \ namespace std;\n\n-   2. Add a main function containing a final return statement\n\
    int main()\n{\n  // Program code goes here.\n  return 0;\n\n}In the main function,\
    \ insert a statement to declare an integer variable to be used as a loop iteration\
    \ counter\nint i;\n\nNext, insert a for loop to output the counter value on each\
    \ of three iterations\nfor (i = 1; i < 4; i++)\n{\ncout << \"Loop iteration: \"\
    \ << i << endl;\n}\n\nSave, compile, and run the program to see the output\n\n\
    Now, edit the variable declaration to add a second counter\nint i, j;\n// Integer\
    \ variable \"j\" added.\n\nInside the for loop block, add an inner loop to output\
    \ its counter value on each iteration\nfor (j = 1; j < 4; j++)\ncout << \"Inner\
    \ loop iteration: \" << j << endl;\n\nSave, compile, and run the program to see\
    \ the inner loop fully execute on each iteration of the outer loop\n\nAlternatively,\
    \ a for loop counter can count down counter value on each by decrementing the\
    \ iteration using i-- instead of the i++ incrementer.\n\nOn the third iteration\
    \ of these loops, the incrementer increases the counter value to four – so when\
    \ it is next evaluated, the test returns false and the loop ends.\n\n## Looping\
    \ while\n\nAn alternative to the for loop, introduced above, uses the while keyword,\
    \ followed by an expression to be evaluated. When the expression is true, statements\
    \ contained within braces will be executed. The expression will be evaluated again,\
    \ and the while loop will continue until the expression is found to false.\n\n\
    The loop's statement block must contain code that will affect the tested expression\
    \ in order to change evaluation to false, otherwise an infinite loop is created\
    \ that will lock the system! When the expression is found to false upon its first\
    \ evaluation, the while loop's statement block will never be executed.\n\nIf you\
    \ accidentally start running an infinite loop, press the Ctrl + C keys to terminate\
    \ the process.\n\nA variation of the while loop places the do keyword before the\
    \ loop's statement and a while test after it, with this syntax:\n\n```\ndo { statements-to-executed\
    \ } while (test-expression);\n```\n\nIn a while-loop, the statement block will\
    \ always be executed at least once because the expression is not evaluated until\
    \ after the first iteration. A break statement can be included in any kind of\
    \ loop to immediately terminate the loop when a test condition is met. The break\
    \ ensures no further iterations of the loop will be executed.\n\nSimilarly, a\
    \ continue statement can be included in any kind of loop to terminate that iteration\
    \ when a test condition is met. The continue statement allows the loop to proceed\
    \ to the next iteration.\n\n-   1. Start a new program by specifying the C++ library\
    \ classes to include, and a namespace prefix to use\n#include <vector> // Include\
    \ vector.\n#include <iostream>\nusing namespace std;\n\n-   Add a main function\
    \ containing a final return statement\nint main()\n{\n    // Program code goes\
    \ here.\n    return 0;\n}\n\nIn the main function, insert statements to declare\
    \ an integer vector and an integer loop counter\nvector<int> vec(10);\nint i =\
    \ 0;\n\nNext, insert a while loop to assign a counter value to an element of the\
    \ vector on each iteration\n```\nwhile (i < vec.size()) {\n    i++; // Increment\
    \ the counter.\n    vec[i-1] = i; // Assign count to element.\n    cout << vec.at(i-1);\n\
    }\n```\n\nSave and run the program to see the output\n\nEdit the loop to add a\
    \ continue statement immediately after the incrementer to make the loop skip its\
    \ third iteration\n```\nif (i == 3) { cout << \"|\"; continue; }\n```\n\nAfter\
    \ the continue statement, now add a break statement, to make the loop quit on\
    \ its eighth iteration\n```\nif (i == 8) { cout << endl << \"Done\"; break; }\n\
    ```\n\nSave, compile, and run the program once more to see the loop now omits\
    \ the others.\n\nThe vector library must be included with a preprocessor directive\
    \ in this example.\n\nThe position of **break** and **continue** statements is\
    \ important – they must appear after the incrementer, to avoid creating an infinite\
    \ loop, but before other statements that affect the program to avoid executing\
    \ those statements.\n\n## Functions\n\nFunctions enclose a section of code that\
    \ provides specific functionality to the program. When a function is called from\
    \ the main program, its statements are executed and, optionally, a value can be\
    \ returned to the main program upon completion. There are three main benefits\
    \ to using functions:\n\n-   Functions make program code easier to understand\
    \ and maintain.\n-   Tried and tested functions can be re-used by other programs.\n\
    -   Several programmers can divide the workload in large projects by working on\
    \ different functions of the program.\n\n## Functions\n\nEach function is declared\
    \ early in the program code as a “prototype”, comprising a data type for the value\
    \ it will return and the function name followed by parentheses, which may optionally\
    \ contain a list of “argument” data types of passed values it may use. The syntax\
    \ of a function prototype declaration looks like this:\n\n```\nreturn-data-type\
    \ function-name ( arguments-data-type-list );\n```\n\nStrictly speaking, the arguments\
    \ in a function prototype are known as its “formal parameters”.\n\nFor example,\
    \ a function named “computeArea” that returns a float value and is passed float\
    \ arguments is declared as:\n\n```\nfloat computeArea(float, float);\n```\n\n\
    ## Defining functions\n\nThe function definition appears later in the program\
    \ code and comprises a repeat of the prototype, plus the actual function body.\
    \ The function body is the statements to be executed whenever the function is\
    \ called, contained within a pair of braces.\n"
  mdcn: "\n缺失 `break` 关键字并不是语法错误——请确保在所有 `case` 语句之后都存在预期的断开。\n\n## switch.cpp\n\n\
    -   通过指定要包含的 C++ 库类和要使用的命名空间前缀开始新程序\n#include <iostream>\nusing namespace std;\n\
    \n-   添加一个包含最终返回语句的 main 函数\nint main() {\n  // 程序代码写在此处。\n  return 0;\n}\n\n\
    -   在 main 函数中，插入一条语句来声明并初始化一个整数变量，并赋予待匹配的值\nint num = 3;\n\n-   接下来，插入一个 `switch`\
    \ 语句来查找 `case`\nswitch (num) {\n  case 1: cout << num << \": Monday \"; break;\n\
    \  case 2: cout << num << \": Tuesday \"; break;\n  case 3: cout << num << \"\
    : Wednesday \"; break;\n  case 4: cout << num << \": Thursday \"; break;\n  case\
    \ 5: cout << num << \": Friday \"; break;\n}\n\n-   在 `switch` 语句中，在最后一个 `case`\
    \ 语句之后插入一个 `default` 语句\ndefault: cout << num << \": Weekend day \";\n\n-   保存、编译并运行程序以执行\n\
    \n-   现在，编辑整数变量声明以更改其值，然后再次保存、编译并运行程序\nint num = 6;\n\n注意，**default** 语句后面不需要跟随\
    \ **break** 关键字，因为 **default** 语句始终出现在 **switch** 语句的最后。\n\n## 循环 (Looping for)\n\
    \n循环是程序中一段自动重复的代码。对循环块内包含的所有语句的完整执行称为一次“迭代”或“传次”。\n\n循环执行的迭代次数由循环内部的条件测试控制。只要测试表达式保持为真，循环就会继续——直到测试表达式变为为假，此时循环结束。\n\
    \nC++ 编程中的三种循环结构类型是 `for` 循环、`while` 循环和 `do while` 循环。可能最常用的循环是 `for` 循环，其语法如下：\n\
    \n```\nfor ( initializer;test-expression ; incrementer) { statements }\n```\n\n\
    初始化器为循环迭代次数的计数器设置起始值。为此目的使用一个整数变量，传统上命名为“i”。\n\n在循环的每次迭代中，都会评估测试表达式，只有当该表达式为真时，迭代才会继续。当测试表达式变为假时，循环立即结束，不再再次执行语句。在每次迭代中，计数器递增，然后执行语句。\n\
    \n循环可以嵌套在其他循环之中——使得内层循环在外层循环的每次迭代中完全执行其迭代。\n\nforloop.cpp\n\n-   1. 通过指定要包含的 C++\
    \ 库类和要使用的命名空间前缀开始新程序\n#include <iostream>\nusing namespace std;\n\n-   2. 添加一个包含最终返回语句的\
    \ main 函数\nint main()\n{\n  // 程序代码写在此处。\n  return 0;\n\n}在 main 函数中，插入一条语句来声明一个作为循环迭代计数器的整数变量\n\
    int i;\n\n接下来，插入一个 `for` 循环以便在三次迭代的每次中输出计数器值\nfor (i = 1; i < 4; i++)\n{\ncout\
    \ << \"Loop iteration: \" << i << endl;\n}\n\n保存、编译并运行程序查看输出\n\n现在，编辑变量声明以添加第二个计数器\n\
    int i, j;\n// 添加了整数变量 \"j\"。\n\n在 `for` 循环块内部添加一个内层循环，在每次迭代中输出其计数器值\nfor (j =\
    \ 1; j < 4; j++)\ncout << \"Inner loop iteration: \" << j << endl;\n\n保存、编译并运行程序查看内层循环在外层循环的每次迭代中完全执行\n\
    \n另一种，`for` 循环计数器可以使用 `i--` 代替 `i++` 递增器在每次迭代中递减计数器值。\n\n在这些循环的第三次迭代中，递增器将计数器值增加四——所以当下次评估时，测试返回为假，循环结束。\n\
    \n## while 循环 (Looping while)\n\n上述 `for` 循环的替代方案使用 `while` 关键字，后面紧跟一个待评估的表达式。当表达式为真时，大括号内的语句将被执行。表达式将再次被评估，`while`\
    \ 循环将持续直到发现表达式为假。\n\n循环的语句块必须包含能够影响测试表达式的代码，以便将评估变为假，否则将创建死循环并导致系统锁定！如果表达式在第一次评估时即为假，则\
    \ `while` 循环的语句块永远不会执行。\n\n如果你不小心开始死循环，请按 Ctrl + C 键终止进程。\n\n`while` 循环的一种变体是将\
    \ `do` 关键字放在循环语句之前，并在之后放置 `while` 测试，语法如下：\n\n```\ndo { statements-to-executed\
    \ } while (test-expression);\n```\n\n在 `while` 循环中，语句块将至少执行一次，因为表达式在第一次迭代之后才会进行评估。任何类型的循环中都可以包含\
    \ `break` 语句，在满足测试条件时立即终止循环。`break` 确保不再执行循环的后续迭代。\n\n同样，`continue` 语句可以包含在任何类型的循环中，在满足测试条件时终止该迭代。`continue`\
    \ 语句允许循环进入下一次迭代。\n\n-   1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀开始新程序\n#include <vector>\
    \ // 包含 vector\n#include <iostream>\nusing namespace std;\n\n-   添加一个包含最终返回语句的\
    \ main 函数\nint main()\n{\n    // 程序代码写在此处。\n    return 0;\n\n}\n\n在 main 函数中，插入语句声明一个作为循环迭代计数器的整数\
    \ vector\nvector<int> vec(10);\nint i = 0;\n\n接下来，插入一个 `while` 循环在每次迭代中将值赋值给 vector\
    \ 的元素\n```\nwhile (i < vec.size()) {\n    i++; // 递增器\n    vec[i-1] = i; // 赋值给元素\n\
    \    cout << vec.at(i-1);\n}\n```\n\n保存并运行程序查看输出\n\n编辑循环，在递增器后立即添加 `continue`\
    \ 语句，使循环跳过第三次迭代\n```\nif (i == 3) { cout << \"|\"; continue; }\n```\n\n在 `continue`\
    \ 语句之后，现在添加 `break` 语句，使循环在第八次迭代时退出\n```\nif (i == 8) { cout << endl << \"Done\"\
    ; break; }\n```\n\n再次保存、编译并运行程序。\n\n示例中必须通过预处理器包含 vector 库。\n\n**break** 和 **continue**\
    \ 的位置很重要——它们必须出现在递增器之后，以免创建死循环，但要在影响程序的语句之前。\n\n## 函数 (Functions)\n\n函数封装了程序中提供特定功能的代码。当从主程序调用函数时，其语句将被执行，并在完成后可选地返回一个值。使用函数有三个主要优点：\n\
    \n-   函数使得程序代码更容易于理解和维护。\n-   经过测试的函数可以被其他程序重复。\n-   在大型项目中，多个程序员可以通过编写不同的函数来分工协作。\n\
    \n## 函数 (Functions)\n\n每个函数在程序代码早期被声明为“原型”，它包含返回值的数据类型和函数名，后面跟着括号，括号内可选包含可能使用的传入值的“参数”数据类型列表。函数原型定义的语法如下：\n\
    \n```\nreturn-data-type function-name ( arguments-data-type-list );\n```\n\n严格来说，函数原型中的参数被称为“形式参数”。\n\
    \n例如，一个名为“computeArea”的返回 float 值并接受 float 参数的函数声明为：\n\n```\nfloat computeArea(float,\
    \ float);\n```\n\n## 定义函数 (Defining functions)\n\n函数定义出现在程序代码的后部分，它包含了原型的重复以及实际的函数体。函数体是每当调用函数时都要执行的语句，包含在一对括号内。\n"
