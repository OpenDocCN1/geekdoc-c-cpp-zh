  - "[PAGE 305]\n\n# Using macro functions\n\nThe #define directive can be used to\
    \ create macro functions that will be substituted in the source code before compilation.\n\
    \nA preprocessor function declaration comprises a macro name, immediately followed\
    \ by parentheses containing the function's arguments – it is important not to\
    \ leave any space between the name and the parentheses. The declaration is then\
    \ followed by the function within another set of parentheses. For example, a preprocessor\
    \ macro function to half an argument looks like this:\n\n```\n#define HALF(n)\
    \ (n / 2)\n```\n\nCare should be taken when using macro functions, because unlike\
    \ regular C++ functions, they do not perform any kind of type checking – so it's\
    \ easy to create a macro that causes errors. For this reason, inline functions\
    \ are usually preferable to macro functions, but because macros directly substitute\
    \ their code, they avoid the overhead of a function call – so the program runs\
    \ faster. The resulting difference can be seen in the first temporary file created\
    \ during the compilation process:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_305_0.png)\n\
    \nmacro.cpp\n\n+   1 Start a new program by defining two macro functions to manipulate\
    \ a single argument\n#define SQUARE(n) (n*n)\n#define CUBE(n) (n*n)\n\n+   2 After\
    \ the macro function definitions, specify the library classes to include, and\
    \ a namespace prefix to use\n#include <iostream>\nusing namespace std;\n\n+  \
    \ 3 Next, declare two inline functions to manipulate a single argument – just\
    \ like the macro functions defined above\ninline int square (int n) { return (n*n);\
    \ }\ninline int cube (int n) { return (n*n); };\n\n+   4 Add a main function containing\
    \ a final return statement\nint main()\n{\n  // Program code goes here.\n  return\
    \ 0;\n}\n\n+   5 At the start of the main function block, declare and initialize\
    \ an integer variable"
