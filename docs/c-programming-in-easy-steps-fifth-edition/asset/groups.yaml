    - Summary\n\n# Starting a Universal project\n\nWindows 10 introduced the Universal\
    \ Windows Platform (UWP) that enables you to create a single application that\
    \ will run on any modern Windows-based device – phone, tablet, or PC.\n\nThe interface\
    \ layout of a UWP application uses the eXtensible Application Markup Language\
    \ (XAML) to specify components.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_319_0.png)\n\
    \nThe example in this chapter is for Visual Studio 2015 on Windows 10 – it won’t\
    \ work with earlier versions.\n\nIn order to develop apps for the UWP, you should\
    \ be running the latest version of Windows 10, and your Visual Studio IDE must\
    \ include the Universal Windows App Development Tools:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_319_1.png)\n\
    \n- Open Control Panel, Programs and Features, then right-click on the Visual\
