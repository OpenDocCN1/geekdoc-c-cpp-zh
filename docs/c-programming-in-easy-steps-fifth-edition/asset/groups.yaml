- md: "\nReturn to the MainPage.xaml file, then in XAML view, see that attributes\
    \ have been automatically added to the <Button> elements to call the event-handler\
    \ code\n\n```xml\n<StackPanel x:Name=\"Buttons\" Orientation=\"Horizontal\">\n\
    \  <Button x:Name=\"BtnPick\" Content=\"Get My Lucky Numbers\" Margin=\"15\" IsEnabled=\"\
    True\" Click=\"BtnPick_Click\"/>\n  <Button x:Name=\"BtnReset\" Content=\"Reset\"\
    \ IsEnabled=\"False\" Click=\"BtnReset_Click\"/>\n</StackPanel>\n```\n\nNotice\
    \ that the first for loop contains only one statement to be executed on each iteration,\
    \ so braces are not required.\n\n# Testing the program\n\nHaving added functionality\
    \ with C++ code above, you are now ready to test the program for two devices:\n\
    \n- 1. On the Visual Studio standard toolbar, select Debug for x64 architecture\
    \ and Local Machine options, then click the Start to run the app for a PC device\n\
    \n- 2. Wait while the application gets built and loaded, then click the buttons\
    \ to try out its functionality\n\n- You must have your PC set to Developer Mode\
    \ in Settings, Update & Security, For developers.\n\nThe app looks good on PC\
    \ devices – numbers are being randomized and the button states are changing as\
    \ required.\n\n- 3. Now, on the Visual Studio standard toolbar, select Debug,\
    \ Stop Debugging to exit the running program\n\n- You can safely ignore the DEBUG\
    \ numbers that appear in the black boxes, but if you prefer not to see them, select\
    \ Project, ProjectName Properties, Build then you uncheck the Define DEBUG constant\
    \ option.\n\n- 4 On the Visual Studio standard toolbar, select Debug for x86 architecture\
    \ and small Mobile Emulator options, then click the Start button to run the app\
    \ for a mobile device\n\nWait while the emulator starts up – this takes a while\n\
    \nWhen the application gets built and loaded, you see the controls are not visible\
    \ – so you can’t try out their functionality!\n\nWhat’s going on here? Click one\
    \ of the emulator’s **Rotate** buttons to flip it over to Landscape orientation\
    \ and look for clues\n\nAh-ha! Some of the controls are now visible, but this\
    \ is unsatisfactory – adjustments will be needed to the interface layout so the\
    \ app looks good on mobile devices\n\nAgain, on the Visual Studio standard toolbar,\
    \ select **Debug**, **Stop Debugging** to exit the running program\n\n| | |\n\
    |---|---|---|\n| Windows | | |\n| Graphics | | |\n| Continue | F5 |\n| Break All\
    \ | Ctrl+Alt+Break |\n| Stop Debugging | Shift+F5 |\n\nTest on the emulator with\
    \ lowest memory and smallest screen and it should be fine running on those emulators\
    \ with better features.\n\nDo not click the X button on the emulator window to\
    \ stop the running program, as that will also close the emulator.\n\n# Adjusting\
    \ the interface\n\nThe app test for mobile devices above failed to satisfactorily\
    \ present the controls, as the interface is too wide for small screen devices.\
    \ Happily, the interface can be made to adapt to different screen sizes so it\
    \ can also look good on mobile devices. The adaptation relies upon recognizing\
    \ the screen size and changing the orientation of a <StackPanel> element in XAML\
    \ for narrow screen devices:\n\n- Open MainPage.xml, then in XAML view add these\
    \ elements immediately below the opening <Grid> element and before the component\
    \ <VisualStateManager.StateGroups> (Elements to be inserted here Steps 2-3):\n\
    \n```xml\n<VisualStateManager.StateGroups>\n  <VisualStateGroup>\n    <State x:Name=\"\
    wideState\">\n      <VisualState.Triggers>\n        <AdaptiveTrigger Target=\"\
    Grid.Width\" Value=\"641\" />\n      </VisualState.Triggers>\n    </State>\n \
    \   <State x:Name=\"narrowState\">\n      <VisualState.Triggers>\n        <AdaptiveTrigger\
    \ Target=\"StackPanel.Orientation\" Value=\"Vertical\" />\n      </VisualState.Triggers>\n\
    \    </State>\n  </VisualStateGroup>\n</VisualStateManager.StateGroups>\n```\n\
    \n- Next, insert elements to recognize wide screens\n- Next, insert elements to\
    \ recognize narrow screens and change the orientation of the outer <StackPanel>\n\
    \nThe beginning of MainPage.xml file should now look similar to the below:\n\n\
    XAML code recognizes the same tags used in HTML code. Remember that the outer\
    \ <StackPanel> in this app contains an <Image> and a nested <StackPanel> displayed\
    \ horizontally, side-by-side. If displayed vertically, they should appear one\
    \ over the other.\n\n```xml\n<Grid Background=\"{ThemeResource PageBackgroundBrush}\"\
    >\n  <VisualStateManager.StateGroups>\n    <VisualStateGroup>\n      <State x:Name=\"\
    WideState\">\n        <VisualState.Setters>\n          <Setter Target=\"Grid.Width\"\
    \ Value=\"641\" />\n        </VisualState.Setters>\n      </State>\n      <State\
    \ x:Name=\"NarrowState\">\n        <VisualState.Setters>\n          <Setter Target=\"\
    StackPanel.Orientation\" Value=\"Vertical\" />\n        </VisualState.Setters>\n\
    \      </State>\n    </VisualStateGroup>\n  </VisualStateManager.StateGroups>\n\
    ```\n\nSelect **x64** and **Local Machine** to run the app for a PC device once\
    \ more – it still looks and functions well.\n\nNow select **x86** and **Mobile\
    \ Emulator** to run the app for a mobile device – it also looks and functions\
    \ well.\n\nYou can have Visual Studio nicely format the XAML code by pressing\
    \ **Ctrl + K, Ctrl + D.**\n\nAlthough an app may work well on an emulator, it\
    \ is recommended you always test on actual devices before deployment.\n\n# Deploying\
    \ the application\n\nHaving tested the app in a Mobile Emulator above, it can\
    \ now be tested on a real device before deployment:\n\n- On a Windows 10 device\
    \ select Developer mode from the Settings, Update & Security, For developers menu\n\
    \n- Next, connect the device to your PC via a USB socket\n\n- On the Visual Studio\
    \ toolbar, select Debug for ARM architecture and Device options, then click the\
    \ Start button to run the app on the connected device\n\n- Wait while the application\
    \ gets built and loaded, then tap the buttons to try out their functionality\n\
    \nYou can choose the Remote Machine option to test via a network connection.\n\
    \nThe app looks good, numbers are being randomized, and the button states are\
    \ changing as required – the app can be deployed.\n\n- Remove the Debug version\
    \ of the app from the device\n\nIn Solution Explorer, add logo images to the Assets\
    \ folder, then double-click on Package.appmanifest and add them to Visual Assets.\
    \ Add three logo images to the Assets folder of the required sizes, then click\
    \ these buttons to select them to be the app tiles. You can also add tile images,\
    \ a Splash Screen image, or select the Application tab and change the app’s Display\
    \ name – for example maybe to “Lucky Numbers”.\n\nOn the Visual Studio toolbar,\
    \ select Release for ARM architecture and Device options, then click Build, Deploy\
    \ Solution to build and install the Release version.\n\nYou can use your C++ programming\
    \ skills to build apps for Android and iOS with the Visual Studio 2015 add-in,\
    \ “Visual C++ for Cross-Platform Mobile Development”. Discover more at msdn.microsoft.com/en-us/library/ldn70591.aspx.\n"
  mdcn: "\n回到 MainPage.xaml 文件，然后在 XAML 视图中，可以看到 <Button> 元素已自动添加了属性以调用事件处理程序代码\n\n\
    ```xml\n<StackPanel x:Name=\"Buttons\" Orientation=\"Horizontal\">\n  <Button\
    \ x:Name=\"BtnPick\" Content=\"Get My Lucky Numbers\" Margin=\"15\" IsEnabled=\"\
    True\" Click=\"BtnPick_Click\"/>\n  <Button x:Name=\"BtnReset\" Content=\"Reset\"\
    \ IsEnabled=\"False\" Click=\"BtnReset_Click\"/>\n</StackPanel>\n```\n\n注意，第一个\
    \ `for` 循环每次迭代只包含一条执行语句，因此不需要括号。\n\n# 测试程序\n\n在通过上述 C++ 代码添加了功能后，你现在准备好为两个设备测试程序了：\n\
    \n- 1. 在 Visual Studio 标准工具栏上，选择 x64 架构的 Debug 和 Local Machine（本地机）选项，然后点击 Start（开始）在\
    \ PC 设备上运行应用。\n\n- 2. 等待应用程序生成并加载，然后点击按钮尝试其功能。\n\n- 你必须在“设置 > 更新和安全 > 开发者人员”中将\
    \ PC 设置为“开发者模式”。\n\n该应用在 PC 设备上看起来良好——数字正在随机化，按钮状态正在根据需要更改。\n\n- 3. 现在，在 Visual\
    \ Studio 标准工具栏上，选择 Debug，Stop Debugging（停止调试）以退出运行中的程序。\n\n- 你可以安全地忽略黑框中出现的 DEBUG\
    \ 数字，如果你不想看到它们，可以选择 Project（项目）、ProjectName Properties（项目名称属性）、Build（生成），然后取消勾选\
    \ Define DEBUG（定义 DEBUG 常量）选项。\n\n- 4 在 Visual Studio 标准工具栏上，选择 x86 架构的 Debug\
    \ 和 small Mobile Emulator（小型移动模拟器）选项，然后点击 Start 按钮在移动设备上运行应用。\n\n等待模拟器启动——这需要一些时间。\n\
    \n当应用程序生成并加载后，你会发现控件不可见——所以你无法尝试它们的功能！\n\n这里发生了什么？点击模拟器上的任意一个 **Rotate**（旋转）按钮将其翻转到横屏（Landscape）模式并寻找线索。\n\
    \n啊！有些控件现在是可见的，但这并不如人意——需要调整界面布局，以便应用在移动设备上看起来良好。\n\n再次，在 Visual Studio 标准工具栏上，选择\
    \ **Debug**，**Stop Debugging** 以退出运行中的程序。\n\n| | |\n|---|---|\n| Windows | | |\n\
    | Graphics | | |\n| Continue | F5 |\n| Break All | Ctrl+Alt+Break |\n| Stop Debugging\
    \ | Shift+F5 |\n\n在内存最低、屏幕最小的模拟器上进行测试，它在具有更好功能的模拟器上运行应该是没有问题的。\n\n不要点击模拟器窗口上的\
    \ X 按钮来停止运行的程序，因为这将关闭模拟器。\n\n# 调整界面\n\n上述移动设备应用测试未能满意地展示控件，因为界面对于小屏幕设备来说太宽了。幸运的是，界面可以适应不同的屏幕大小，使其在移动设备上也能良好显示。这种适应依赖于识别屏幕大小，并为窄屏设备更改\
    \ XAML 中 <StackPanel> 元素的方向：\n\n- 打开 MainPage.xml，然后在 XAML 视图中，在起始 <Grid> 元素下方、组件\
    \ <VisualStateManager.StateGroups> 之前添加这些元素（在此处插入元素的第 2-3 步）：\n\n```xml\n<VisualStateManager.StateGroups>\n\
    \  <VisualStateGroup>\n    <State x:Name=\"wideState\">\n      <VisualState.Triggers>\n\
    \        <AdaptiveTrigger Target=\"Grid.Width\" Value=\"641\" />\n      </VisualState.Triggers>\n\
    \    </State>\n    <State x:Name=\"narrowState\">\n      <VisualState.Triggers>\n\
    \        <AdaptiveTrigger Target=\"StackPanel.Orientation\" Value=\"Vertical\"\
    \ />\n      </VisualState.Triggers>\n    </State>\n  </VisualStateGroup>\n</VisualStateManager.StateGroups>\n\
    ```\n\n- 接下来，插入识别宽屏的元素\n- 接下来，插入识别窄屏的元素并更改外部 <StackPanel> 的方向\n\nMainPage.xml文件的开头现在应该如下所示：\n\
    \nXAML 代码识别与 HTML 代码中相同的标签。请记住，此应用中的外部 <StackPanel> 包含一个 <Image> 和一个水平并排显示的嵌套\
    \ <StackPanel>。如果垂直显示，它们将一个一个堆叠在另一个上方。\n\n```xml\n<Grid Background=\"{ThemeResource\
    \ PageBackgroundBrush}\">\n  <VisualStateManager.StateGroups>\n    <VisualStateGroup>\n\
    \      <State x:Name=\"WideState\">\n        <VisualState.Setters>\n         \
    \ <Setter Target=\"Grid.Width\" Value=\"641\" />\n        </VisualState.Setters>\n\
    \      </State>\n      <State x:Name=\"NarrowState\">\n        <VisualState.Setters>\n\
    \          <Setter Target=\"StackPanel.Orientation\" Value=\"Vertical\" />\n \
    \       </VisualState.Setters>\n      </State>\n    </VisualStateGroup>\n  </VisualStateManager.StateGroups>\n\
    ```\n\n再次选择 **x64** 和 **Local Machine** 在 PC 设备上运行应用——它仍然看起来良好且功能正常。\n\n现在选择 **x86**\
    \ 和 **Mobile Emulator** 在移动设备上运行应用——它看起来和功能也良好。\n\n你可以通过 **Ctrl + K, Ctrl + D**\
    \ 让 Visual Studio 漂亮地格式化 XAML 代码。\n\n尽管应用在模拟器上运行良好，但建议在部署之前始终在实际设备上进行测试。\n\n#\
    \ 部署应用\n\n在上述移动模拟器中测试应用后，现在可以在部署前在真实设备上进行测试：\n\n- 在 Windows 10 设备上，从“设置 > 更新和安全\
    \ > 开发者人员”菜单中选择开发者模式\n\n- 接下来，通过 USB 接口连接设备到 PC\n\n- 在 Visual Studio 工具栏上，选择 ARM\
    \ 架构的 Debug 和 Device 选项，然后点击 Start 按钮在连接的设备上运行应用\n\n- 等待应用程序生成并加载，然后点击按钮尝试其功能\n\
    \n你可以选择 Remote Machine（远程机）选项通过网络连接进行测试。\n\n应用看起来良好，数字正在随机化，按钮状态正在根据需要更改——应用可以部署了。\n\
    \n- 从设备上移除调试版本的应用\n\n在解决方案管理器中，将图像添加到 Assets 文件夹，然后双击 Package.appmanifest 将它们添加到\
    \ Visual Assets。在 Assets 文件夹中添加所需尺寸的三个图像，然后点击这些按钮选择它们作为应用磁贴。你还可以添加磁贴图像、启动屏幕图像，或者选择\
    \ Application 选项卡更改应用的显示名称——例如可以改为“Lucky Numbers”。\n\n在 Visual Studio 工具栏上，选择\
    \ ARM 架构的 Release 和 Device 选项，然后点击 Build, Deploy Solution（生成并部署解决方案）来生成并安装 Release\
    \ 版本。\n"
