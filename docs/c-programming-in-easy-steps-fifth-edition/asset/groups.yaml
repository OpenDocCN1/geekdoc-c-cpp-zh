    - 3. Now, extract the archive contents to any convenient location on your computer


    I sincerely hope you enjoy discovering the powerful, expressive possibilities
    of C++ Programming and have as much fun with it as I did in writing this book.


    # 1


    ## Getting started


    Welcome to the exciting world of C++ programming. This chapter demonstrates how
    to create a simple C++ program and how to store data within a program.


    - Introducing C++

    - Installing a compiler

    - Writing your first program

    - Compiling & running programs

    - Creating variables

    - Employing variable arrays

    - Employing vector arrays

    - Declaring constants

    - Summary


    ## Introducing C++


    C++ is an extension of the C programming language that was first implemented on
    the UNIX operating system by Dennis Ritchie back in 1972. C is a flexible programming
    language that remains popular today, and is used on a large number of platforms
    for everything from microcontrollers to the most advanced scientific systems.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_10_0.png)


    A powerful language (pronounced “see plus plus”), developed by Bjarne Stroustrup
    between 1983-1985 while working at AT&T Bell Labs. He added features to the original
    language to produce what he called classes++.


    The C++ language was so named as it succeeded an earlier programming language
    named “B”. The ++ operator denotes that C++ is an extension of C.


    C++, like C, is not platform-dependent, so programs can be created on any operating
    system. Most illustrations in this book depict output on Windows because it is
    the most widely used. Examples can also be created on platforms such as Linux.


    ## Why learn C++?


    The C++ language is favored by many professional programmers because it allows
    them to create fast, compact programs. Using a modern C++ Development Environment
    (IDE), such as Microsoft’s Visual Studio Community Edition, the programmer can
    quickly create applications. But to use these tools to greatest effect, the programmer
    must first learn a bit about the C++ language.


    This book is an introduction to programming with C++, giving examples of code
    and its output to demonstrate the basics of the language.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_11_0.png)


    Microsoft''s free Visual Studio Community Edition IDE is used in this book to
    demonstrate programming.


    ## Should I learn C?


    Opinion is divided on the question of whether it is an advantage to be familiar
    with C programming before moving on C++. It would seem logical to learn the original
    language first in order to understand the larger language more readily. However,
    C++ is not simply a larger version of C, as the approach to object-oriented programming
    with C++ is markedly different from the procedural nature of C. It is, therefore,
    better to learn C++ without previous knowledge of C to avoid confusion.


    This book makes no assumption that the reader has previous knowledge of any programming
    language, so it is suitable for the beginner to program C++, whether they know
    C or not.


    If you feel that you would benefit from learning to program in C before moving
    on to C++, we recommend you try the examples in C Programming in easy steps before
    reading this book.


    ## Standardization of C++


    As the C++ programming language gained in popularity, it was adopted by many programmers
    around the world as their programming language of choice. Some of these programmers
    began to add their extensions to the language, so it became necessary to agree
    upon a precise version of C++ that could be commonly shared by all programmers.


    A standard version of C++ was defined by a joint committee of the American National
    Standards Institute (ANSI) and the International Organization for Standardization
    (ISO). This version is sometimes known as ANSI C++, and is portable to any platform
    and to any development environment.

