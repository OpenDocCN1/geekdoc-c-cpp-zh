    本章演示了如何在文件中读写数据，并说明了如何在 C++ 程序中避免错误。


    -   写入文件

    -   追加到文件

    -   读取字符与行

    -   使用 getline 格式化

    -   处理输入输出

    -   预测问题

    -   识别异常

    -   总结


    ## 写入文件


    从程序读写文件提供了在计算机硬盘上维护数据的有用方法。数据的格式可以指定为人类可读的文本格式或机器可读的二进制格式。


    标准 C++ <fstream> 提供了处理文件的函数，通过在程序开头添加 #include <fstream> 可用。


    对于每个要打开的文件，必须先创建一个流对象。可以是 "ofstream"（输出文件流）对象，用于向文件写入数据，或者是 "ifstream"（输入文件流）对象，用于从文件读取数据。`ofstream`
    对象就像向标准输出写入的 `cout` 函数，而 `ifstream` 对象就像从标准输入读取的 `cin` 函数。


