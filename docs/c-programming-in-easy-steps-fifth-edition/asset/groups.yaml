- md: "\nIn the PI declaration, the * character is the C++ multiplication operator,\
    \ and the backslash character in \\\" escapes the quote mark from recognition\
    \ – so the string does not get terminated prematurely.\n\n# Summary\n\n- C++ is\
    \ an object-oriented programming language that is an extension of the procedural\
    \ programming language.\n- The GNU C++ Compiler is available for Windows and Linux.\n\
    - Preprocessor directives are used to make functions within the standard C++ libraries\
    \ available to a program.\n- Each C++ program must contain one main method as\
    \ the entry point to the program.\n- Statements define the actions that the program\
    \ will execute.\n- It is recommended that program code should be widely commented\
    \ to make its purpose clear.\n- The cpp command calls the compiler, and its -o\
    \ option allows the command to specify the name of the generated executable.\n\
    - A variable declaration specifies a data type and a chosen name by which the\
    \ value can be referenced.\n- The cout function, which is part of the C++ iostream\
    \ library, writes content to the standard output console.\n- An array is a fixed\
    \ size variable that stores multiple items of data in elements, which are numbered\
    \ starting at zero.\n- The special \\0 character can be assigned to the final\
    \ element of a char array to allow it to be treated as a single text string.\n\
    - A vector variable stores multiple items of data in elements, and can be dynamically\
    \ resized.\n- The value stored in an array or vector element can be referenced\
    \ using variable’s name and its index number.\n- Variable values that are never\
    \ changed by the program should be stored in a constant.\n- A constant list can\
    \ be automatically numbered by the enum keyword and given a type name by the typedef\
    \ keyword.\n\n# 2 Performing operations\n\nThis chapter introduces the C++ operators\
    \ and demonstrates the operations they can perform.\n\n- Doing arithmetic\n- Assigning\
    \ values\n- Comparing values\n- Assessing logic\n- Examining conditions\n- Establishing\
    \ size\n- Setting precedence\n- Casting data types\n- Summary\n\n# Doing arithmetic\n\
    \nThe arithmetical operators commonly used in C++ programs are listed in the table\
    \ below, together with the operation they perform:\n\n| Operator | Operation |\n\
    |---|---|\n| + | Addition |\n| - | Subtraction |\n| * | Multiplication |\n| /\
    \ | Division |\n| % | Modulus |\n| ++ | Increment |\n| -- | Decrement |\n\nThe\
    \ operators for addition, subtraction, multiplication, and division act as you\
    \ would expect. Care must be taken, however, to bracket expressions where more\
    \ than one operator is used to clarify the expressions – operations where innermost\
    \ parentheses are performed:\n\n```\na=b*c-d%e/f; // This is unclear.\na=(b*c)-((d%e)/f);\
    \ // This is clearer.\n```\n\nThe % modulus operator will divide the first number\
    \ by the second number and return the remainder of the operation. This is useful\
    \ to determine if a number has an odd or even value.\n\nValues used with operators\
    \ to form expressions are called \"operands\" – in the expression 2 + 3 the numerical\
    \ values 2 and 3 are the operands.\n\nThe ++ increment operator and -- decrement\
    \ operator alters the given number by one and return the resulting value. These\
    \ are most commonly used to count iterations in a loop. Counting up, the ++ operator\
    \ increases the value by one, while counting down, the -- operator decreases the\
    \ value by one.\n\nThe increment and decrement operators can be placed before\
    \ or after a value to different effect. If placed before the operand (prefix),\
    \ its value is immediately changed; if placed after the operand (postfix), its\
    \ value is noted first, then the value is changed.\n\n# arithmetic.cpp\n\nStart\
    \ a new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\nAdd\
    \ a main function containing a final return statement\n```cpp\nint main() {\n\
    \  // Program code goes here.\n  return 0;\n}\n```\n\nIn the main function, insert\
    \ a statement to declare and initialize two integer variables\n```cpp\nint a =\
    \ 8, b = 4;\n```\n\nNext, insert statements to output the result of each basic\
    \ arithmetic operation\n```cpp\ncout << \"Addition result: \" << (a + b) << endl;\n\
    cout << \"Subtraction result: \" << (a - b) << endl;\ncout << \"Multiplication\
    \ result: \" << (a * b) << endl;\ncout << \"Division result: \" << (a / b) <<\
    \ endl;\ncout << \"Modulus result: \" << (a % b) << endl;\n```\n\nNow, insert\
    \ statements to output the result of both postfix and prefix increment operations\n\
    ```cpp\ncout << \"Postfix increment: \" << a++ << endl;\ncout << \"Postfix result:\
    \ \" << a << endl;\ncout << \"Prefix increment: \" << ++b << endl;\ncout << \"\
    Prefix result: \" << b << endl;\n```\n\nSave, compile, and run the program to\
    \ see the output\n\nRemember that a prefix operator changes the value immediately\
    \ – a postfix operator changes the value.\n\n# Assigning values\n\nThe operators\
    \ that are used in C++ programming to assign values are listed in the table below.\
    \ All except the simple = operator are shorthand form of a longer expression so\
    \ each is given for clarity:\n\n| Operator | Example: | Equivalent: |\n|---|---|---|\n\
    | = | a = b | a = b |\n| += | a += b | a = (a + b) |\n| -= | a -= b | a = (a -\
    \ b) |\n| *= | a *= b | a = (a * b) |\n| /= | a /= b | a = (a / b) |\n| %= | a\
    \ %= b | a = (a % b) |\n\nIn the example above, the variable \"a\" is assigned\
    \ the value that contained in variable \"b\" – so that becomes the new value in\
    \ a.\n\nThe += operator is useful to add a value onto an existing value. In the\
    \ table, the += operator first adds the value contained in a to the value contained\
    \ in b. It assigns the result to variable a.\n\nIt is important to regard the\
    \ = operator to mean \"assign\" rather than \"equals\" to avoid confusion with\
    \ the == operator. All the other operators work in the same way by making the\
