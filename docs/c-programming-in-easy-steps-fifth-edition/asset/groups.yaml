    \ default precision of six decimal places for floating point numbers can be changed\
    \ by specifying an integer to their precision() function. Statements using insertion\
    \ operators to modify a stream should be made before those using the << or >>\
    \ operators.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_164_0.png)\n\nInsertion\
    \ operators modify just one stream object – subsequent stream objects are defaults,\
    \ unless they got modified first by insertion operators.\n\nThe <iostream> library\
    \ provides the “manipulators” listed in the table below, which modify a stream\
    \ using the << or >> operators.\n\n| Manipulator | Display |\n| --- | --- |\n\
    | noboolalpha* | Boolean values as 1 or 0 |\n| boolalpha | Boolean values as “true”\
    \ or “false” |\n| dec* | Integers as base 10 (decimal) |\n| hex | Integers as\
    \ base 16 (hexadecimal) |\n| oct | Integers as base 8 (octal) |\n| right* | Text\
    \ right-justified in the output width |\n| left | Text left-justified in the output\
