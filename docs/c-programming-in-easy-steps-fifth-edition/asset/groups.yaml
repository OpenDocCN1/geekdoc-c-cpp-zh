    ![](img/7b77dfe98ba5541875fec43413b9f6e4_11_0.png)


    Microsoft''s free Visual Studio Community Edition IDE is used in this book to
    demonstrate visual programming.


    # ## Should I learn C?


    Opinion is divided on the question of whether it is an advantage to be familiar
    with C programming before moving on to C++. It would seem logical to learn the
    original language first in order to understand the larger extended language more
    readily. However, C++ is not simply a larger version of C, as the approach to
    object-oriented programming with C++ is markedly different from the procedural
    nature of C. It is, therefore, better to learn C++ without previous knowledge
    of C to avoid confusion.


    This book makes no assumption that the reader has previous knowledge of any programming
    language, so it is suitable for the beginner to programming in C++, whether they
    know C or not.


    If you feel that you would benefit from learning to program in C, before moving
    on to C++, we recommend you try the examples in C Programming in easy steps before
    reading this book.


    # ## Standardization of C++


    As the C++ programming language gained in popularity, it was adopted by many programmers
    around the world as their programming language of choice. Some of these programmers
    began to add their extensions to the language, so it became necessary to agree
    upon a precise version of C++ that could be commonly shared internationally by
    all programmers.


    A standard version of C++ was defined by a joint committee of the American National
    Standards Institute (ANSI) and the Industry Organization for Standardization (ISO).
    This version is sometimes known as ANSI C++, and is portable to any platform and
    to any development environment.


    The examples given in this book confirm to ANSI C++. Example programs run in a
    console window, such as the Command Prompt on Windows systems or a shell window
    on Linux systems, to demonstrate the mechanics of the C++ language itself. An
    example in the final chapter illustrates how code generated automatically by a
    visual development tool on the Windows platform can, once you''re familiar with
    the C++ language, be edited to create a graphical, windowed application.'
