  mdcn: "\n## 6\n## 指向数据\n\n本章演示了如何利用指针和引用来编写高效的 C++ 程序。\n\n- 理解数据存储\n- 使用指针获取值\n\
    - 进行指针运算\n- 将指针传递给函数\n- 创建指针数组\n- 引用数据\n- 将引用传递给函数\n- 比较指针与引用\n- 总结\n\n## 理解数据存储\n\
    \n为了理解 C++ 指针，了解数据如何在你的计算机上存储将很有帮助。将计算机内存想象成一排非常长的顺序编号的槽位，每个槽位可以包含一个字节的数据。当程序中声明一个变量时，机器会预留若干槽位来存储分配给该变量的数据。预留位数的数量取决于变量的数据类型。当程序使用变量名来检索存储的数据时，它实际上检索的是该变量第一个槽位的编号。\n\
    \n这可以类比为一排按顺序编号的房子，每栋房子可以容纳一个不同的家庭。可以通过房号显式地引用任何家庭。\n\n内存中的槽位（房子）编号以十六进制格式表示，并可以通过\
    \ & 引用操作显示。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_183_0.png)\n\n- 通过指定要包含的\
    \ C++ 库类和使用的命名空间前缀开始一个新程序\n```cpp\n#include <string>\n#include <iostream>\nusing\
    \ namespace std;\n```\n\n- 添加一个包含最终 return 语句并声明三个初始化变量的 main 函数\n```cpp\nint\
    \ main() {\n  int num = 100;\n  double sum = 0.0123456789;\n  string text = \"\
    C++ Fun\";\n  // 在此处添加更多语句。\n  return 0;\n}\n```\n\n- 在 main 函数中，插入语句输出每个变量第一个槽位的内存地址\n\
    ```cpp\ncout << \"Integer variable starts at: \" << &num << endl;\ncout << \"\
    Double variable starts at: \" << &sum << endl;\ncout << \"String variable starts\
    \ at: \" << &text << endl;\n```\n\n- 保存、编译并运行程序以查看这三个内存地址\n\n## 命令行提示符\n\n```\n\
    C:\\MyPrograms>c++ address.cpp -o address.exe\nC:\\MyPrograms>-address\nInteger\
    \ variable starts at: 0x61ff18\nDouble variable starts at: 0x61ff10\nString variable\
    \ starts at: 0x61fef8\nC:\\MyPrograms>_\n```\n\n一旦通过变量声明预留了内存空间，就可以使用 = 赋值运算符存储相应数据类型的值。例如，num\
    \ = 100 获取其右侧的值（100）并将其放入左侧命名变量（num）所引用的内存中。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_184_0.png)\n\
    \n位置地址是动态分配的——因此会与此截图中的地址不同。\n\n赋值 赋值运算符左侧的操作数称为“左值”（L-value），右侧的操作数称为“右值”（R-value）。将\
    \ L-value 中的“L”理解为“位置”（Location），将 R-value 中的“R”理解为“读取”（Read）。\n\nC++ 编程中的一个重要规则规定，右值不能出现在\
    \ = 运算符的左侧，但左值可以出现在任何侧。将右值放在 = 赋值运算符左侧的代码将无法编译：\n\n- 5 在 return 语句正之前，插入将右值错误地放在赋值运算符左侧的语句\n\
    \n```cpp\n200 = num ;\n5.5 = sum ;\n\"Bad assignments\" = text ;\n```\n\n- 6 保存并尝试重新编译程序，以查看由右值放置不当当引起的错误\n\
    \n## 命令行提示符\n\n```\nC:\\MyPrograms>c++ address.cpp -o address.exe\naddress.cpp:1\
    \ In function 'int main'\naddress.cpp:7:\nerror: lvalue used as left operand of\
    \ assignment\naddress.cpp:12:\nerror: lvalue used as left operand of assignment\n\
    address.cpp:17:\nerror: assignment of read-only location \"Bad assignments\"\n\
    address.cpp:22:\nerror: incompatible types in assignment of \"std::string\"\n\
    C:\\MyPrograms>_\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_185_0.png)\n\
    \n左值是容器，而右值是数据。\n\n## 使用指针获取值\n\n指针是高效 C++ 编程的有用部分——它们只是存储其他变量内存地址的变量。\n\n指针的声明与其他与其他相同，但数据类型后面带有一个“*”字符。这在声明中表示该变量将是一个指针。记住，指针的数据类型必须与它指向的变量类型匹配。\n\
    \n通过使用 & 引用运算符将另一个变量的内存地址赋值给指针变量。赋值可以在声明语句中进行，也可以在声明后的单独语句中进行。仅通过名称引用指针变量只会显示它包含的内存地址。\n\
    \n在指针变量初始化后（无论是在声明中还是通过随后的赋值），它就“指向”它包含的变量。通过在指针前加上 * 解引用运算符来引用指针变量：\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_187_0.png)\n\
    \n- 通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n- 添加一个包含最终 return 语句并声明三个初始化变量\n```cpp\nint main() {\n  int num\
    \ = 100;\n  double sum = 0.0123456789;\n  string text = \"C++ Fun\";\n  // 在此处添加更多语句。\n\
    \  return 0;\n}\n```\n\n- 在 main 函数中，插入语句输出每个变量第一个槽位的内存地址\n```cpp\ncout << \"\
    Integer variable starts at: \" << &num << endl;\ncout << \"Double variable starts\
    \ at: \" << &sum << endl;\ncout << \"String variable starts at: \" << &text <<\
    \ endl;\n```\n\n- 保存、编译并运行程序以查看这三个内存地址\n\n（注：由于 OCR 文本存在重复和交叉，此处已根据逻辑进行了合并和清理）。\n"
