  - "[PAGE 309]\n\n# Building strings\n\nThe preprocessor # operator is known as the\
    \ “stringizing” operator, as it converts a series of characters passed as a macro\
    \ argument into a string – adding double quotes to enclose the string.\n\nAll\
    \ whitespace before or after the series of characters passed as a macro argument\
    \ to the stringizing operator is ignored, and multiple spaces between characters\
    \ is reduced to just one space.\n\nThe stringizing operator is useful to pass\
    \ string values to a preprocessor #define directive without needing to surround\
    \ each string with double quotes.\n\nA macro definition can combine two terms\
    \ into a single term using the ## merging operator. Where the combined term is\
    \ a variable name, its value is not expanded by the macro – it simply allows the\
    \ variable name to be substituted by the macro.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_309_0.png)\n\
    \n+   1. Start a new program by defining a macro to create a string from a series\
    \ of characters passed as its argument, to substitute in an output statement\n\
    #define LINEOUT(str) cout << #str << endl\n2. Define a second macro to combine\
    \ two terms passed as its arguments into a variable name, to substitute in an\
    \ output statement\n#define GLUEOUT(...)\n3. After the macro definitions, specify\
    \ the library classes to include, and a namespace prefix to use\n#include <string>\n\
    #include <iostream>\nusing namespace std;\n4. Add a main function containing a\
    \ final return statement\nint main()\n{\n    // Program code goes here.\n    return\
    \ 0;\n}\n5. At the start of the main function block, declare and initialize a\
    \ string variable, then append a further string\nstring longline = \"They carried\
    \ a net \";nlongline += \"and their hearts were set\";"
