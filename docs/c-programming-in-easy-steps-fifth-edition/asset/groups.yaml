    \n```\nsizeof(var); // 或者你可以使用 sizeof var;\n```\n\n`sizeof` 运算符将返回一个整数，表示存储命名变量内数据所分配的字节数。\n\
    \n简单数据类型（如 `char` 和 `bool`）只需要一个字节内存来存储一条数据。较长的数值根据其可能的范围（由数据类型和限定符决定）需要更多内存。\n\
