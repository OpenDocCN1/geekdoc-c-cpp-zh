    \ variable named “str” is the destination:\n\n```\ngetline(cin, str);\n```\n\n\
    The getline() function reads from an input “stream” until it encounters a newline\
    \ character at the end of the line – created when you hit Return.\n\nCare must\
    \ be taken when mixing cin and getline() functions, as the getline() function\
    \ will automatically read anything left on the input buffer – giving the impression\
    \ that the program is skipping an instruction. The cin.ignore() function can be\
    \ used to overcome this problem by ignoring content left in the input buffer.\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_119_0.png)\n\ninput.cpp\n\n- 1. Start\
