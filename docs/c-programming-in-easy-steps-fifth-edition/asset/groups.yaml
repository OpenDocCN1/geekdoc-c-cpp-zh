    \ ASCII 码。相反，`!=` 不等于运算符如果两个操作数不等，则返回真 (1)，使用与 `==` 等于运算符相同的规则，否则返回假 (0)。相等和不等于运算符用于测试两个变量的状态以执行程序中的条件分支。\n\
    \nA-Z 大写字符的 ASCII 值为 65-90，a-z 小写字符的 ASCII 值为 97-122。\n\n“大于”运算符比较两个操作数，如果第一个的值大于第二个，则返回真\
