    # Doing pointer arithmetic


    Once a pointer variable has been initialized with a memory address, it can be
    assigned another address, or changed using pointer arithmetic.


    The ++ increment operator or the -- decrement operator will move the pointer along
    to the next or previous address for that data type – the larger data type, the
    bigger jump.


    Even larger jumps can be achieved using the += and -= operators.


    Pointer arithmetic is especially useful with arrays, because the elements in an
    array occupy consecutive memory addresses. Assigning the name of an array to a
    pointer automatically assigns the address of the first element. Incrementing the
    pointer by one moves the pointer along to the next element.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_190_0.png)


    +   Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

