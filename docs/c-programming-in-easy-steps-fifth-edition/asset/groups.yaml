  - "[PAGE 289]\n\n# Defining substitutes\n\nJust as the preprocessor substitutes\
    \ library code for #include directives, other preprocessor directives can be used\
    \ to substitute text or numeric values before assembly and compilation.\n\nThe\
    \ #define directive specifies a macro, comprising an identifier name and a string\
    \ or numeric value, to be substituted by the preprocessor for each occurrence\
    \ of that macro in the source code.\n\nLike #include preprocessor directives,\
    \ #define directives can appear at the start of the source code. As with constant\
    \ variable names, the macro name traditionally uses uppercase, and defined string\
    \ values should be enclosed within double quotes. For numeric substitutions in\
    \ expressions the macro name should be enclosed in parentheses to ensure correct\
    \ precedence.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_289_0.png)\n\n+   Start\
    \ a new program by declaring three define directives\n#define BOOK \"C++ Programming\
    \ in easy steps\"\n#define NUM 200\n#define RULE \"################################################**\"\
    \n\n+   Specify the library classes to include, and the namespace\n#include <iostream>\n\
    using namespace std;\n\n+   Add a main function containing a final return statement\
    \ and three statements to output substituted values\nint main()\n{\n    cout <<\
    \ RULE << endl << BOOK << endl << RULE;\n    cout << endl << \"NUM is: \" << NUM\
    \ << endl;\n    cout << \"Double NUM: \" << ((NUM) * 2) << endl;\n    return 0;\n\
    }\n\n+   Save, compile, and run the program to see the output"
