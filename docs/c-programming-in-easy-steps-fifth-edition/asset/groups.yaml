- md: "\nThe value passed to the char argument is never used – that argument is included\
    \ merely to differentiate that overloaded function.\n\n# Optimizing functions\n\
    \nFunctions can call themselves recursively, to repeatedly execute the statements\
    \ contained in their function body – like a loop. As loops, a recursive function\
    \ must contain an incrementer and a conditional test to call itself again, or\
    \ stop repeating when a condition is met. The syntax of a recursive function looks\
    \ like this:\n\n```\nreturn-data-type function-name ( argument-list )\n{\n   \
    \ statements-to-be-executed;\n    incrementer;\n    conditional-test-to-recall-or-exit;\n\
    }\n```\n\nThe incrementer will change the value of a passed argument – so subsequent\
    \ calls will pass the adjusted value back to the function.\n\n- 1. Start a new\
    \ program by specifying the C++ library classes to include, and a namespace prefix\
    \ to use\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n- 2. Below\
    \ the preprocess instructions, declare two function prototypes that will be both\
    \ recursive functions\n```cpp\nint computeFactorials ( int, int );\nint factorial\
    \ ( int );\n```\n\n- 3. Below the prototype declarations, add a main function\
    \ containing a return statement\n```cpp\nint main()\n{\n    // Program code goes\
    \ here.\n    return 0;\n}\n```\n\n- 4. After the main function, add the definition\
    \ for the first function prototype – a recursive function\n```cpp\nint computeFactorials(int\
    \ num, int max)\n{\n    cout << \"Factorial of \" << num << \":\";\n    cout <<\
    \ factorial( num ) << endl; // Statements.\n    num++; // Incrementer.\n    if\
    \ ( num > max ) return 0; // Exit...\n    else computeFactorials(num, max); //\
    \ or call again.\n}\n```\n\nA recursive function generally uses more system resources\
    \ than a loop – but it can make for more readable code.\n\n- 5. Define a recursive\
    \ function for the prototype\n\n```cpp\nint factorial(int n)\n{\n    int result;\n\
    \    if (n == 1) result = 1; // Exit or...\n    else result = (factorial(n - 1)*n);\
    \ // Decrement...\n    // and call again.\n    return result;\n}\n```\n\n- 6.\
    \ At the start of the main function, insert a call to the recursive function computeFactorials(1,8);\n\
    \n- 7. Save, compile, and run the program to see the output\n\nIf you accidentally\
    \ run an infinite recursive function, press the Ctrl + C keys to terminate the\
    \ process.\n\nThe output lists factorial values (factorial 3 is 3x2x1=6, etc.),\
    \ but the program can be improved by optimizing the factorial() This function\
    \ does not need a variable if written with the ternary operator. It contains just\
    \ one statement, so its definition can replace the prototype declaration as an\
    \ “inline” declaration. This means that the program need not keep checking between\
    \ the declaration and definition, and so improves efficiency.\n\nInline declarations\
    \ may only contain one or two statements, as the compiler recreates them at each\
    \ calling point – longer inline declarations would, therefore, produce a more\
    \ unwieldy program.\n\n- Delete the **factorial() function definition, then replace\
    \ its prototype declaration with this inline declaration\n`inline int factorial(int\
    \ n)`\n`{ return (n == 1) ? 1 : (factorial(n - 1) * n); }`\n\n- Save, compile,\
    \ and run the program again to see the same output, produced more efficiently\n\
    \n# Summary\n\n- * An if statement evaluates a given test expression for a Boolean\
    \ value of true or false.\n- * Statements contained in braces after an if statement\
    \ will only be executed when the evaluation is found to be true.\n- * The if and\
    \ else keywords are used to perform conditional branching according to the result\
    \ of a tested expression.\n- * A switch statement is an alternative form of conditional\
    \ branching that matches a case statement to a given value.\n- * The for loop\
    \ has parameters declaring an initializer, a test expression, and an incrementor\
    \ or decrementer.\n- * A while loop and do-while loop must always have an incrementor\
    \ or decrementer within their loop body.\n- * Any type of loop can be immediately\
    \ terminated by including a break statement within the loop body.\n- * A single\
    \ iteration of any type of loop can be skipped by including a continue statement\
    \ within the loop body.\n- * Functions are used to organize code into reusable\
    \ blocks.\n- * Recursion allows a function to call itself.\n- * Inline functions\
    \ can improve performance by reducing function call overhead.\n\n# Handling strings\n\
    \n- Creating strings\n- Getting string\n- Solving strings\n- Copying strings\n\
    - Swapping strings\n- Finding strings\n- Replacing strings\n\nUnlike char, int,\
    \ double, bool types, there is no native string type in C++, but the <string>\
    \ library provides one. To make this available, the <string> header must be included\
    \ at the start.\n\nA C++ string is much easier to work with than char arrays as\
    \ it automatically resizes to accommodate the length of any string. At a lower\
    \ level, text is still stored as a character array, but the string variable lets\
    \ you ignore those details.\n\nIt is important to remember that when numeric values\
    \ are assigned to a string variable, they are no longer a numeric type, so arithmetic\
    \ cannot be performed on them. For example, attempting to add \"7\" and \"6\"\
    \ with the + operator produces the concatenated string \"76\", not the numerical\
    \ value 13. In this case, the + operator recognizes the context is not arithmetic,\
    \ so adopts the guise of \"concatenation operator\" to unite strings. The += operator\
    \ app a string to another string and is useful to build long strings.\n\nSeveral\
    \ string values are built into a single string in the example described below.\n\
    \n```cpp\n#include <string>\n// Include string support.\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    string text = \"9\";\n    string term\
    \ = \"9\";\n    string info = \"Toys\";\n    string color;\n    // Add more statements\
    \ here.\n    char hue[4] = { 'R', 'e', 'd', '\\0' };\n    color = hue;\n    info\
    \ = \"Balloons\";\n    text += (term + color + info);\n    cout << endl << text\
    \ << endl;\n    return 0;\n}\n```\n"
  mdcn: "\n传递给 `char` 参数的值从未被使用 – 包含该参数仅是为了区分该重载函数。\n\n# 优化函数\n\n函数可以递归地调用自己，以反复执行函数体内包含的语句——就像循环一样。循环循环，递归函数必须包含一个递增器和一个条件测试，以便再次调用自身，或者在满足条件时停止重复。递归函数的语法看起来如下：\n\
    \n```\nreturn-data-type function-name ( argument-list )\n{\n    statements-to-be-executed;\n\
    \    incrementer;\n    conditional-test-to-recall-or-exit;\n}\n```\n\n递增器会改变所传参数的值——因此后续调用将把调整后的值传回函数。\n\
    \n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n- 2. 在预处理指令下方，声明两个递归函数的函数原型\n```cpp\nint computeFactorials ( int,\
    \ int );\nint factorial ( int );\n```\n\n- 3. 在原型声明下方，添加一个包含返回语句的 main 函数\n```cpp\n\
    int main()\n{\n    // 程序代码在此处。\n    return 0;\n}\n```\n\n- 4. 在 main 函数之后，为第一个函数原型添加定义——这是一个递归函数\n\
    ```cpp\nint computeFactorials(int num, int max)\n{\n    cout << \"Factorial of\
    \ \" << num << \":\";\n    cout << factorial( num ) << endl; // 语句。\n    num++;\
    \ // 递增器。\n    if ( num > max ) return 0; // 退出...\n    else computeFactorials(num,\
    \ max); // 或再次调用。\n}\n```\n\n递归函数通常比循环消耗更多的系统资源——但它可以使代码更具可读性。\n\n- 5. 为原型定义递归函数\n\
    \n```cpp\nint factorial(int n)\n{\n    int result;\n    if (n == 1) result = 1;\
    \ // 退出或...\n    else result = (factorial(n - 1)*n); // 递减...\n    // 并再次调用。\n\
    \    return result;\n}\n```\n\n- 6. 在 main 函数开始处，插入对递归函数 computeFactorials(1,8);\
    \ 的调用\n\n- 7. 保存、编译并运行程序以查看输出\n\n如果你意外运行了无限递归函数，请按 Ctrl + C 键终止进程。\n\n输出列出了阶乘值（阶乘3是\
    \ 3x2x1=6 等），但可以通过优化 factorial() 函数来改进程序。如果使用三元运算符编写，它不需要变量。它只包含一条语句，因此其定义可以替换原型声明。这意味着程序不需要在声明和定义之间进行检查，从而提高了效率。\n\
    \n内联声明可能只包含一两个语句，因为编译器会在每个调用点重新创建它们——因此，较长的内联声明会导致程序变得更加臃肿。\n\n- 删除 **factorial()\
    \ 函数定义**，然后将其原型声明替换为此内联声明\n`inline int factorial(int n)`\n`{ return (n == 1) ?\
    \ 1 : (factorial(n - 1) * n); }`\n\n- 保存、编译并再次运行程序以查看相同的输出，但生成效率更高\n\n# 总结\n\n\
    - * if 语句对给定的测试表达式进行布尔值的真（true）或假（false）评估。\n- * if 语句后大括号内的语句仅在评估结果为真时才会执行。\n\
    - * if 和 else 关键字用于根据被测试表达式的结果执行条件分支。\n- * switch 语句是条件分支的另一种形式，它将 case 语句与给定值进行匹配。\n\
    - * for 循环具有声明初始化器、测试表达式以及递增器或递减器的参数。\n- * while 循环和 do-while 循环在循环体内必须有一个递增器或递减器。\n\
    - * 任何类型的循环都可以通过在体内包含 break 语句来立即终止。\n- * 通过在体内包含 continue 语句可以跳过任何类型循环的单迭代。\n\
    - * 函数用于将代码组织成可重用的块。\n- * 递归允许函数调用自己。\n- * 内联函数可以通过减少函数调用开销来提高性能。\n\n# 字符串处理\n\
    \n- 创建字符串\n- 获取字符串\n- 解决字符串\n- 复制字符串\n- 交换字符串\n- 查找字符串\n- 替换字符串\n\n与 char、int、double、bool\
    \ 类型不同，C++ 中没有原生字符串类型，但 <string> 库提供了一个。为了使之可用，必须在开头包含 <string> 头文件。\n\nC++ 字符串比\
    \ char 数组要易处理得多，因为它会自动调整大小以适应任何字符串的长度。在较低层次上，文本仍然存储为字符数组，但字符串变量让你能够忽略这些细节。\n\n\
    需要记住，当将数值赋值给字符串变量时，它们不再是数值类型，因此无法对它们执行算术运算。例如，尝试用 + 运算符相加 \"7\" 和 \"6\" 会产生拼接后的字符串\
    \ \"76\"，而不是数值 13。在这种情况下，+ 运算符识别出上下文不是算术运算，因此采用“拼接运算符”的外壳来合并字符串。+= 运算符将一个字符串添加到另一个字符串上，对于构建长字符串很有用。\n\
    \n在下面描述的示例中，多个字符串值被构建在一个字符串中。\n\n```cpp\n#include <string>\n// 字符串支持。\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    string text = \"9\";\n\
    \    string term = \"9\";\n    string info = \"Toys\";\n    string color;\n  \
    \  // 在此处添加更多语句。\n    char hue[4] = { 'R', 'e', 'd', '\\0' };\n    color = hue;\n\
    \    info = \"Balloons\";\n    text += (term + color + info);\n    cout << endl\
    \ << text << endl;\n    return 0;\n}\n```\n\n"
