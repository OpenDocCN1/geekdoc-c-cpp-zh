    \ XAML 视图代码和 Source 属性中\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_329_1.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_330_0.png)\n\n探索图像**属性** 窗口中的 **Appearance**（外观）和\
    \ **Transform**（变换）选项，以发现如何修改它的显示方式。\n\n# 设计布局\n\n为了完成应用程序的布局，可以向 XAML 元素标签添加设计属性，以指定它们将显示的内容以及在界面中的精确位置：\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_332_0.png)\n\n通用\n\n- 1. 打开 MainPage.xaml，然后为外部\
    \ <StackPanel> 元素添加两个属性以固定其位置 HorizontalAlignment = \"Left\" VerticalAlignment\
    \ = \"Top\"\n- 2. 接下来，通过修改初始分配值 200 来编辑 <image> 元素以增加宽度 Width = \"300\"\n- 3.\
    \ 现在，为嵌套的 <StackPanel> 元素添加属性以固定其位置 VerticalAlignment = \"Center\"\n- 4. 然后，同样编辑所有六\
    \ <TextBlock> 元素，指定它们的初始内容、宽度和四周的边距 Text = \"\", Width = \"20\" Margin = \"15\"\
    \ Text = \"\", Width = \"20\" Margin = \"15\" Text = \"\", Width = \"20\" Margin\
    \ = \"15\" Text = \"\", Width = \"20\" Margin = \"15\" Text = \"\", Width = \"\
    20\" Margin = \"15\" Text = \"\", Width = \"20\" Margin = \"15\"\n- 5. 编辑第一个 <Button>\
    \ 元素进行重命名，指定其标签内容和四周的边距 x:Name = \"BtnPin\" Content = \"Get Lucky Numbers\" Margin\
    \ = \"15\"\n- 6. 编辑第二个 <Button> 元素进行重命名并指定其标签内容 x:Name = \"BtnReset\" Content\
    \ = \"Reset\"\n- 7. 最后，为每个 <Button> 元素添加属性以指定它们的初始状态 IsEnabled = \"True\" IsEnabled\
    \ = \"False\"\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_332_1.png)\n\n单个 Margin\
    \ 值会设置组件周围的所有四个边距。你可以指定两个值作为左/右和上下的边距，例如 Margin = \"10,30\"。或者，你可以单独为左、右、下设置值，例如\
    \ Margin = \"10,30,10,50\"。\n\n每个元素中属性的顺序很重要，但 XAML 文件中的元素可能如下：\n\n```xml\n<StackPanel\
    \ Orientation=\"Horizontal\">\n    <Image Source=\"icon.png\" Width=\"100\" Height=\"\
    100\"/>\n    <StackPanel Orientation=\"Vertical\" VerticalAlignment=\"Center\"\
    >\n        <StackPanel Name=\"Labels\">\n            <TextBlock Text=\"text1\"\
    \ />\n            <TextBlock Text=\"text2\" />\n            <TextBlock Text=\"\
    text3\" />\n        </StackPanel>\n        <StackPanel Name=\"Buttons\" Orientation=\"\
    Horizontal\">\n            <Button Content=\"Button\" />\n            <Button\
    \ Content=\"Button\" />\n        </StackPanel>\n    </StackPanel>\n</StackPanel>\n\
    ```\n\n注意每个 <TextBlock> 元素都有一个 Text 属性，可以在功能代码中引用它。例如 `textBlock1->Text`。\n\n\
    # 导入程序资源\n\n为了让 XAML <Image> 组件显示图形，首先需要将图像文件添加到项目的 Assets 文件夹中。然后可以将其分配给 <Image>\
