- md: "\nThe Boat class has properties common to any boat, whereas the Sailboat class\
    \ has properties specific to boats that have sails.\n\nIn the Laser class, insert\
    \ a call to its constructor method to assign values to the variables in each class\
    \ from which the class is derived – and call the destructor method\n\n```cpp\n\
    Laser() { mast = 19; length = 35; }\n~Laser();\n```\n\nIn the Laser class, define\
    \ the pure virtual methods declared in each class from which this class is derived\n\
    \n```cpp\nvoid Model() { cout << \"Laser Classic\" << endl; }\nvoid Boom() { cout\
    \ << \"Boom: 14ft\" << endl; }\n```\n\nDeclare a main method containing a final\
    \ return statement and creating an instance of the derived class on the bottom\
    \ tier of the hierarchy\n\n```cpp\nint main() {\n  Laser* pLaser = new Laser;\n\
    \  // Add more statements here\n  return 0;\n}\n```\n\nIn the main method, insert\
    \ calls to each defined method\n\n```cpp\npLaser -> Model();\ncout << \"Length:\
    \ \" << pLaser -> getLength() << \"ft\" << endl;\ncout << \"Height: \" << pLaser\
    \ -> getMast() << \"ft\" << endl;\npLaser -> Boom();\n```\n\nSave, compile, and\
    \ run the program to see the output\n\nLaser Sailboat (Boat)\n\nTry adding a Powerboat\
    \ class derived from the Boat class (to contain engine information), and a Cruiser\
    \ class derived from the Powerboat class – to assign variable values and to define\
    \ virtual methods.\n\n# Isolating class structures\n\nThe source code for each\
    \ example program in this book is generally contained in a single .cpp file to\
    \ save space, but in reality OOP programs are often contained in three separate\
    \ files:\n\n- Header .h file – contains only class declarations.\n- Implementation\
    \ .cpp file – contains class definitions to implement the methods declared in\
    \ the header file, which is referenced by an #include directive.\n- Client .cpp\
    \ file – contains a main method that employs the class members declared in the\
    \ header file, which is also referenced by an #include directive.\n\nThe client\
    \ file is sometimes referred to as a “driver” file.\n\nFor example, a sum calculator\
    \ program might comprise three files: ops.h (a header file declaring operation\
    \ classes), ops.cpp (an implementation file defining the operation methods), and\
    \ sum.cpp (a client file calling the various operations).\n\nWhen compiling sum.cpp,\
    \ the compiler incorporates the included header file and implementation file into\
    \ the program. It first translates the header file and implementation file into\
    \ a binary object file (ops.o), then it translates the header file and client\
    \ file into a second binary object file (sum.o). Finally, the Linker combines\
    \ both object files into a single executable file (sum.exe).\n\nUsing an #include\
    \ directive to reference a header files in a similar manner to using an #include\
    \ directive to reference a standard C++ library.\n\nIsolating class structures\
    \ in separate “modular” files has the advantage of improving portability, and\
    \ makes code maintenance easier by clearly identifying the purpose of each file.\n\
    \nTo have the compiler combine all source code files into a single, executable\
    \ file it is only necessary to explicitly specify the .cpp files in the compiler\
    \ command – an #include directive ensures the header file will also be recognized.\n\
    \nFor example, with the statement #include “ops.h” in both ops.cpp and sum.cpp,\
    \ the command to compile the example below does not specify the ops.h header in\
    \ the compiler command, but is just c++ ops.cpp sum.cpp -o sum.exe.\n\n## Calculator\n\
    \nThis example will allow the user to input a simple arithmetical expression and\
    \ output the calculated result. It will provide instructions when first launched\
    \ and allow the user to make subsequent expressions – or by entering a zero character.\n\
    \n### ops.h\n\n1. Start a header file by declaring a class named “Calculator”\n\
    ```cpp\nclass Calculator\n{\n```\n\n2. In the class declaration, insert public\
    \ method declarations\n```cpp\npublic:\n    Calculator(); // (Constructor)\n \
    \   void launch(); // To display instructions.\n    void readInput(); // Get input.\n\
    \    void writeOutput(); // Display result.\n    bool run(); // Get current status.\n\
    ```\n\n3. In the class declaration, insert private variables\n```cpp\nprivate:\n\
    \    double num1, num2;\n    char oper;\n```\n\n4. Save the header file as “ops.h”\n\
    \n5. In the implementation file, define the methods declared in the header.\n\n\
    ### Employing isolated classes\n\n### ops.cpp\n\nStart an implementation file\
    \ with an include directive to incorporate the header here\n```cpp\n#include \"\
    ops.h\"\n#include <iostream>\nusing namespace std;\n\nCalculator::Calculator()\n\
    {\n    status = true;\n}\n\nvoid Calculator::launch()\n{\n    cout << \"*** SUM\
    \ CALCULATOR ***\" << endl;\n    cout << \"Enter a number, an operator (+,-*,/),\
    \ and another number.\" << endl;\n    cout << \"Hit Return to calculate. Enter\
    \ zero to exit.\";\n}\n\nvoid Calculator::readInput()\n{\n    cout << \"> \";\n\
    \    cin >> num1;\n    if (num1 == 0)\n        status = false;\n    else {\n \
    \       cin >> oper;\n        cin >> num2;\n    }\n}\n\nvoid Calculator::writeOutput()\n\
    {\n    if (status) {\n        switch (oper) {\n            case '+': cout << num1\
    \ + num2 << endl; break;\n            case '-': cout << num1 - num2 << endl; break;\n\
    \            case '*': cout << num1 * num2 << endl; break;\n            case '/':\
    \ \n                if (num2 != 0)\n                    cout << num1 / num2 <<\
    \ endl;\n                else\n                    cout << \"Cannot divide by\
    \ zero\" << endl;\n                break;\n        }\n    }\n}\n\nbool Calculator::run()\n\
    {\n    return status;\n}\n```\n\n### sum.cpp\n\nStart a client file with an include\
    \ directive to incorporate the header here\n```cpp\n#include \"ops.h\"\n\nint\
    \ main() {\n    Calculator* pCalc = new Calculator;\n    pCalc->launch();\n  \
    \  while (pCalc->run()) {\n        pCalc->readInput();\n        pCalc->writeOutput();\n\
    \    }\n    delete pCalc;\n    return 0;\n}\n```\n\nDue to space limitation, this\
    \ program makes barely no attempt at input validation – it assumes the user will\
    \ enter a valid expression, such as 8 * 3.\n\nSave the client file as \"sum.cpp\"\
    , alongside \"ops.h\" and \"ops.cpp\", then compile the program with this command:\n\
    c++ ops.cpp sum.cpp -o sum\n\nRun the program and enter simple expressions to\
    \ see the results, then enter zero and hit Return to exit the program.\n"
  mdcn: "\n`Boat` 类具有所有船只共有的属性，而 `Sailboat` 类具有带有帆的船只特有的属性。\n\n在 `Laser` 类中，插入对其构造方法的调用，以为派生自每个类中的变量赋值——并调用析构方法。\n\
