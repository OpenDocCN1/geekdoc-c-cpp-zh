    # Summary


    - The Universal Windows Platform (UWP) enables a single app to run on any modern
    Windows-based device.

    - The eXtensible Application Markup Language (XAML) is used to specify components
    and layout on UWP apps.

    - The Universal Windows App Development Tools are needed in order to develop UWP
    apps.

    - The Blank App (Universal Windows) template can be used to create a new UWP project.

    - Visual Studio provides a graphical Design view and a text code XAML view for
    the MainPage.xaml file.

    - Component elements can be placed within XAML <StackPanel> elements to arrange
    their orientation.

    - Image files can be added to the Assets folder and assigned to XAML <image> elements
    for display on the interface.

    - Space can be added around a component by adding a Margin attribute and assigned
    value within its element tag.

    - Functional C++ programming code can be added to the MainPage.xaml.cpp code-behind
    to develop and test UWP apps.

    - The Developer Mode setting must be enabled in the Windows 10 options in order
    to develop and test UWP apps.

    - A UWP app can be tested in Debug mode on the Local Machine, a Mobile Emulator,
    and a connected Device.

    - The interface of a UWP app can adapt to different screen sizes by changing the
    orientation of <StackPanel> elements.

    - Image files can be added to the Assets folder for assignment as logos in the
    Package.appmanifest window.

    - The Release version can be deployed by selecting the target configuration, then
    using the Build, Deploy Solution menu.


