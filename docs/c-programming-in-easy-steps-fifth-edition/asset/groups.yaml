    ```\n\n- 2. Declare a Base class containing a method to output a passed integer\
    \ value in hexadecimal format\n```cpp\nclass Base\n{\npublic:\n    virtual void\
    \ Common()\n        cout << \"I am parent\" << endl;\n\n    virtual void identify(int\
    \ adr)\n        cout << \"Base class called by 0x\" << hex << adr << endl;\n};\n\
    ```\n\n- 3. Declare two empty derived classes, SubA and SubB\n```cpp\nclass SubA\
    \ : public Base { };\nclass SubB : public Base { };\n```\n\n- 4. Declare a main\
    \ method containing a final return statement\n```cpp\nint main() {\n    // Program\
    \ code goes here.\n    return 0;\n}\n```\n\n- 5. In the main method, insert statements\
    \ to create two base class pointers – each binding to a specific derived class\n\
    ```cpp\nBase*ptrA = new SubA;\nBase*ptrB = new SubB;\n```\n\n- 6. Now, insert\
    \ statements that use the pointers to call the base class method, passing the\
    \ memory address of each output\n```cpp\nptrA -> identify((int) &ptrA);\nptrB\
    \ -> identify((int) &ptrB);\n```\n\n- 7. Save, compile, and run the program to\
    \ see the addresses\n\n- 8. A base class pointer that is bound to a specific derived\
    \ class can be used to call derived class methods that have been inherited from\
    \ the base class. Methods that are unique to the derived class must, however,\
