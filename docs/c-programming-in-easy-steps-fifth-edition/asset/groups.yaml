    # Declaring constants


    Data that will not change during the execution of a program should be stored in
    a constant container, rather than in a variable. This better enables the compiler
    to check the code for errors – if the program attempts to change the value stored
    in a constant, the compiler will report an error and the compilation will fail.


    A constant can be created for any data type by prefixing a variable declaration
    with the const keyword, followed by a space. Typically, constant names appear
    in uppercase to distinguish them from (lowercase) variable names. Unlike variables,
    constants must always be initialized in the declaration. For example, a constant
    for the math pi value looks like this:


    ```

    const double PI = 3.1415926536;

    ```


    The enum keyword provides a way to create a sequence of integer constants in a
    concise manner. Optionally, the declaration can include a name for the sequence
    after the enum keyword. The constant names follow as a comma-separated list within
    braces. For example, this declaration creates a sequence of constants:


    enum suit { CLUBS, DIAMONDS, HEARTS, SPADES };


    Each of the constants will, by default, have a value one greater than the preceding
    constant in the list. The first constant will have a value of zero, the next and
    so on. A constant can be assigned any integer value, but the next in the list
    will increment it by one.


    It is occasionally convenient to define a list of enumerated constants as a “custom
    data type” by using the typedef keyword. This can begin the enum declaration,
    and a chosen type name can be added at the end of the declaration. For example,
    this typedef statement creates a custom data type named “charge":


    ```

    typedef enum { NEGATIVE, POSITIVE } charge;

    ```


    Variables can be created of the custom data type in the usual way, which may legally
    be assigned any of the listed constants. Essentially, these variables act just
    like an int variable – as they store the integer value the assigned constant represents.
    For example, with the example above, assigning a POSITIVE constant to a charge
    variable actually assigns an integer of one.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_38_0.png)


    The typedef keyword simply creates a nickname for a structure.'
