- md: "\n## Summary\n\n- The three cornerstones of Object Oriented Programming are\
    \ encapsulation, inheritance, and polymorphism.\n- Polymorphic entities have a\
    \ different meaning, or purpose, according to their context.\n- A base class pointer\
    \ can be used to explicitly call inherited methods in the derived class to which\
    \ it is bound.\n- A base class pointer can be used to explicitly call base class\
    \ methods using the :: scope resolution operator.\n- Virtual base class methods\
    \ are intended to be overridden in derived classes.\n- Polymorphism allows calls\
    \ to methods of the same name to be directed to the appropriate overriding method.\n\
    - Capability classes generally contain no data, but merely declare virtual methods\
    \ that can be overridden in derived classes.\n- Virtual methods that return a\
    \ -1 value signal an error to indicate they should not be called directly.\n-\
    \ An Abstract Data Type represents a concept, and is always the base to other\
    \ classes.\n- Declaration of a pure virtual method, with the assignment =0, indicates\
    \ that class is an ADT.\n- Classes can be derived from an ADT – but you cannot\
    \ create an instance of an ADT.\n- An ADT can be derived from another ADT to create\
    \ a complex hierarchy of classes.\n- Programs can be separated into header, implementation,\
    \ and client files to aid portability and to ease code maintenance.\n- Header\
    \ files that are referenced by #include directives will be automatically included\
    \ by the compiler during compilation.\n\n# 9 Processing macros\n\nThis chapter\
    \ demonstrates how the C++ compiler can be made to perform useful tasks before\
    \ compiling a program.\n\n- Exploring compilation\n- Defining substitutes\n- Defining\
    \ conditions\n- Providing alternatives\n- Guarding inclusions\n- Using macro functions\n\
    - Building strings\n- Debugging assertions\n- Summary\n\n## Exploring compilation\n\
    \nWhenever the C++ compiler runs, it first calls upon its preprocessor to seek\
    \ any compiler directives that may be included in the source code. Each of these\
    \ begin with the # hash character and will be implemented first to effectively\
    \ modify the source code before it is assembled and compiled.\n\nSource Code (.cpp)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_285_0.png)\n\nThe changes made by compiler\
    \ directives to the preprocessor create new temporary files that are not normally\
    \ seen. It is these temporary files that are used to create a binary object file:\n\
    \n- The first temporary file created during compilation expands the original source\
    \ code by replacing its compiler directives with library code that implements\
    \ those directives. This text file is named the source file, but with a .ii file\
    \ extension.\n- The second temporary file created during compilation is a translation\
    \ of the expanded .ii file into low-level Assembly language instructions. This\
    \ text file is named the source file, but with a .s extension.\n- The third temporary\
    \ file created during compilation is a translation of the temporary Assembly .s\
    \ file into machine code. This binary object file is named like the source file,\
    \ but with a .o file extension.\n\nSo, the compilation process employs the Preprocessor\
    \ to compile source code, an \"Assembler\" to translate this into machine code,\
    \ and a Linker to convert one or more binary objects into an executable program.\n\
    \nYou can see the temporary files by instructing the compiler to save them using\
    \ the -save-temps compiler option. Both temporary text files can then be examined\
    \ by opening them in a plain text editor.\n\nMost significantly, you can see that\
    \ the temporary file with the .ii file extension contains the complete function\
    \ definitions from any included library. For example, it replaces #include <iostream>\
    \ directive with definitions for the cin, cout, cerr functions, and the clog function\
    \ that can be used to redirect error messages to a file. The end of the .ii file\
    \ shows the defined functions to be part of the “std” namespace – so they can\
    \ appear without the std:: prefix.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_286_0.png)\n\
    \n- Create a simple program named “prog.cpp” that will output a message when it\
    \ is executed\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    cout << \"This is a simple test program\" << endl;\n    return 0;\n}\n\
    ```\n\n- Issue a command using the -save-temps option, to save temporary files,\
    \ and a -c option to compile this program’s source files into an object file –\
    \ with no executable file: c++ prog.cpp -save-temps -c\n\n- Open the .ii file\
    \ in a plain text editor as Notepad, to scroll to the end of the file to see the\
    \ modified source code – notice how the <iostream> library functions are defined\
    \ in the std namespace\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_286_1.png)\n\
    \n- Open the .s file in a plain text editor to see the low-level assembler instructions\
    \ – notice how the message string is now terminated by the special \\0 character\n\
    \n- Issue a command to output an executable file from the .o object file, then\
    \ run the program to see the message: c++ prog.o -o prog.exe\n\n```\nCommand Prompt\n\
    C:\\Programs>c++ prog.cpp -save-temps -c\nC:\\Programs>c++ prog.cpp -o prog.exe\n\
    C:\\Programs>prog\nThis is a simple test\n```\n![](img/7b77dfe98ba5541875fec43413b9f6e4_287_0.png)\n\
    \nOne or more object files can be used to create an executable file – as described.\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_287_1.png)\n\nYou can combine these\
    \ steps, creating an executable file and saving temporary files, by issuing the\
    \ command c++ prog.cpp -save-temps -o prog.exe.\n\n## Defining substitutes\n\n\
    Just as the preprocessor substitutes library code for #include directives, other\
    \ preprocessor directives can be used to substitute text or numeric values before\
    \ compilation.\n\nThe #define directive specifies a macro, comprising an identifier\
    \ name and a string or numeric value, to be substituted by the preprocessor for\
    \ each occurrence of that macro in the source code.\n\nLike #include preprocessor\
    \ directives, #define directives can appear at the start of the source code. As\
    \ with constant variable names, the macro name traditionally uses uppercase, and\
    \ defined string values should be enclosed within double quotes. For numeric substitutions\
    \ in expressions the macro name should be enclosed in parentheses to ensure correct\
    \ precedence.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_289_0.png)\n\n- Start\
    \ a new program by declaring three directives:\n#define BOOK \"C++ Programming\
    \ in easy steps\"\n#define NUM 200\n#define RULE \"################################**\"\
    \n\n- Specify the library classes to include, and the namespace:\n#include <iostream>\n\
    using namespace std;\n\n- Add a main function containing a final return statement\
    \ and three statements to output substituted values:\nint main()\n{\n    cout\
    \ << RULE << endl << BOOK << endl << RULE;\n    cout << \"NUM is: \" << NUM <<\
    \ endl;\n    cout << \"Double NUM: \" << ((NUM) * 2) << endl;\n    return 0;\n\
    }\n```\n\n- Save, compile, and run the program to see the output\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_290_0.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_290_1.png)\n\nBeware constants are\
    \ often best declared as const variables – because values substituted by the preprocessor\
    \ are not subject to type-checking.\n\n- 5. Recompile the program saving the temporary\
    \ files: c++ define.cpp -save-temps -o define.exe\n\n- 6. Open the temporary “define.ii”\
    \ file in a plain text editor and scroll to the end of the file to see the substitutions\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_290_2.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_290_3.png)\n\
    \nSubstitutions can alternatively be made from the command-line using a -Dname\
    \ option to replace macros with values. Note that string values within double-quotes\
    \ must also be enclosed in escaped quotes in the command – so the substitution\
    \ will include the double-quote characters.\n"
