    # Preface


    The creation of this book has provided me, Mike McGrath, a welcome opportunity
    to update my previous books on C++ programming with the latest techniques. All
    examples I have given in this book demonstrate C++ features supported by current
    compilers on both Windows and Linux operating systems, and in the Microsoft Visual
    Studio development suite, and the book’s screenshots illustrate the actual results
    produced by compiling and executing the listed code.


    Conventions in this book


    In order to clarify the code listed in the steps given in each example, I have
    adopted certain colorization conventions. Components of the C++ language itself
    are colored blue, numeric and string values are red, programmer-specified names
    are black, and comments are green, like:


    ```

    // Store then output a text string value.

    string myFunction = "Hello from C++";

    cout << myFunction;

    ```


    Additionally, in order to identify each source code file described in the steps,
    a colored icon and file name appears in the margin alongside the steps:


