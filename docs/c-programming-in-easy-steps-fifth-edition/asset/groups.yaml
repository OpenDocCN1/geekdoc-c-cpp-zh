    \ are passed to functions, their data is passed “by reference” – so the function\
    \ operates on the original value.\n\nThe benefit of passing reference allows functions\
    \ to directly manipulate variable values declared within the calling function.\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_204_0.png)\n\n+   1. Start a new program\
