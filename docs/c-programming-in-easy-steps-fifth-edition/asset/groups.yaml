- md: "\n## Recognizing exceptions\n\nWhen a program exception occurs within a try\
    \ block, an “exception” object is automatically thrown. A reference to the exception\
    \ can be passed to the associated catch block in the parentheses after the catch\
    \ keyword. This specifies the argument to be an exception type, and a chosen exception\
    \ name prefixed by the & reference operator. For example, exception&error.\n\n\
    More on references in the next chapter.\n\nOnce an exception reference is passed\
    \ to a catch block, an error description can be retrieved by the exception’s what()\
    \ function:\n\n- 1. Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n```cpp\n#include <string> // Include\
    \ string support.\n#include <iostream>\nusing namespace std;\n```\n\n- 2. Add\
    \ a main function containing a final return statement and declaring an initialized\
    \ string variable\n```cpp\nint main()\n{\nstring lang = \"C++\";\n// Add more\
    \ statements here.\nreturn 0;\n}\n```\n\n- 3. In the main function, insert a try\
    \ block containing a statement attempting to erase part of the string variable\n\
    ```cpp\ntry {lang.erase(4,6); }\n```\n\n- 4. Next, insert a catch block containing\
    \ a statement to send a description to standard error output by the cerr function\n\
    ```cpp\ncatch (exception &error)\n{cerr << \"Exception: \" << error.what() <<\
    \ endl;}\n```\n\n- 5. Compile, and run the program to see the error description\
    \ of the caught exception\n\n```\nCommand Prompt\nC:\\MyPrograms>c++ what.cpp\
    \ -o what.exe\nC:\\MyPrograms>what\nException: basic_string::erase: __pos\nC:\\\
    MyPrograms>_\n```\n\nThe error description will vary for different compilers –\
    \ the Visual C++ compiler describes the error in this example as an “invalid string\
    \ position”.\n\nThe C++ <stdexcept> library defines a number of exception classes.\
    \ Its base class is named “exception”, from which other classes are derived, categorizing\
    \ common exceptions.\n\nEach of the exception classes are listed in the table\
    \ below, illustrating their relationship and describing their exception type:\n\
    \n| Exception class | Description |\n| --- | --- |\n| exception | General exception\
    \ |\n| - failure allocating storage | |\n| - failure casting data type | |\n|\
    \ - failure referencing typeid | |\n| bad_alloc | Logic exception |\n| bad_cast\
    \ | - invalid domain |\n| bad_typeid | - invalid argument in call |\n| logic_error\
    \ | - invalid length for container |\n| - domain_error | - invalid element range\
    \ |\n| invalid_argument | Runtime exception |\n| length_error | - invalid range\
    \ request |\n| out_of_range | - invalid arithmetic request |\n| runtime_error\
    \ | |\n| overflow_error | |\n\nThe `cout` function sends data to standard output,\
    \ whereas the `cerr` function sends error data to standard error. These are simply\
    \ two different data streams.\n\nWhen the <stdexcept> library is made available\
    \ to a program, by adding an #include <stdexcept> preprocessor directive, the\
    \ exception classes can be used to identify the type of exception thrown to a\
    \ catch block.\n\nThe specific exception class name can appear, in place of the\
    \ general exception type, within the catch block's parentheses.\n\nThe example\
    \ described here demonstrates the use of standard exceptions.\n\nMultiple catch\
    \ blocks can be used in succession, much like case statements in a switch block,\
    \ to handle several types of exception.\n\nAdditionally, exceptions can be produced\
    \ manually by the throw keyword. This can be used to create any of the logic_error\
    \ and runtime_error exceptions in the table above. Optionally, a custom error\
    \ message can be specified for manual exceptions, which can be retrieved by its\
    \ what() function.\n\n## Handling errors\n\nException type information can be\
    \ provided by including the C++ standard <typeinfo> library. its typeid() function\
    \ accepts an exception argument so its name() function can return the type name:\n\
    \n- Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use\n```cpp\n#include <stdexcept> // Support standard\
    \ exceptions.\n#include <typeinfo> // Support type information.\n#include <fstream>\n\
    #include <string>\n#include <iostream>\nusing namespace std;\n```\n\n- Add a main\
    \ function containing a final return statement, two initialized variable declarations,\
    \ and a statement outputting a text message\n```cpp\nint main()\n{\n    string\
    \ lang = \"C++\";\n    int num = 10000;\n    // ...\n}\n```\n\n- In the main function,\
    \ insert a try block containing a statement attempting to erase part of the string\
    \ variable\n```cpp\ntry {lang.erase(4,6); }\n```\n\n- Next, insert a catch block\
    \ containing a statement to send a description to standard error output by the\
    \ cerr function\n```cpp\ncatch (exception &error)\n{cerr << \"Exception: \" <<\
    \ error.what() << endl;}\n```\n\n- Compile, and run the program to see the error\
    \ description of the caught exception\n```\nCommand Prompt\nC:\\MyPrograms>c++\
    \ what.cpp -o what.exe\nC:\\MyPrograms>what\nException: basic_string::erase: __pos\n\
    C:\\MyPrograms>_\n```\n"
