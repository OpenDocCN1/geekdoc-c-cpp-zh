    C:\\MyPrograms>_\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_185_0.png)\n\
    \nL-values are containers but R-values are data.\n\n## Getting values with pointers\n\
    \nPointers are a useful part of efficient C++ programming – they are simply variables\
    \ that store the memory address of other variables.\n\nPointers are declared in\
    \ the same way that other variables are declared, but the data type is suffixed\
    \ by a “*” character. This denotes, in a declaration, that the variable will be\
    \ a pointer. Always remember that the pointer’s data type must match that of the\
    \ variable to which it points.\n\nA pointer variable is initialized by assigning\
    \ it the memory address of another variable, using the & reference operator. The\
