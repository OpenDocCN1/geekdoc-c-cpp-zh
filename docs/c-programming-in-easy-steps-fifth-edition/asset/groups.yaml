    # Summary


    +   * Data is stored in computer memory within sequentially numbered addresses.

    * Operands to the left of an = operator are L-values, and those to its right are
    R-values.

    * An R-value may only appear to the right of an = operator.

    * A pointer is a variable that stores the memory address of another variable –
    that to which it points.

    * The * character appears as an L-value in a pointer declaration, indicating that
    the statement will create a pointer variable.

    * Once declared, the * dereference operator can be used to reference the value
    within a variable to which a pointer points.

    * Pointer arithmetic is used to iterate through the values stored in array elements.

    * A variable is passed to a function by value, whereas pointers and references
    are passed by within the calling function.

    * Passing by reference allows the receiving function to directly manipulate variables

    * A string value can be assigned to a pointer of the char data type, and the whole
    string retrieved using the pointer name.

    * Each element in a pointer array can store data or a pointer.

    * A reference is not a variable, but merely an alias for a variable.

    * The & & character appears as an L-value in a reference declaration, indicating
    that the statement will create an alias.

    * The & reference operator can be used to reference the memory address stored
    within a pointer.

    * References are easier to use than pointers but, unlike pointers, a reference
    must always be initialized in its declaration and can never be assigned a different
    variable.'
- md: "\n## 7\n## Creating classes and objects\n\nThis chapter introduces the topics\
    \ of encapsulation and inheritance – the first two principles of C++ Object Oriented\
    \ Programming.\n\n- Encapsulating data\n- Creating an object\n- Creating multiple\
    \ objects\n- Initializing class members\n- Overloading methods\n- Inheriting class\
    \ properties\n- Calling base constructors\n- Overriding base methods\n- Summary\n\
    \n## Encapsulating data\n\nA class is a data structure that can contain both variables\
    \ and functions in a single entity. These are collectively known as “members”,\
    \ and the functions are known as its “methods”. Access to class members from outside\
    \ the class is controlled by “access specifiers” in the class declaration. Typically,\
    \ these will deny access to the variable members, but allow access to methods\
    \ that can store and retrieve data from those variable members. This technique\
    \ of “data hiding” ensures that stored data is safely encapsulated within the\
    \ class variable members, and is the first principle of Object Oriented Programming\
    \ (OOP).\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_215_0.png)\n\nA class declaration\
    \ begins with the class keyword, followed by a space, then a programmer-specified\
    \ name – adhering to the usual C++ naming conventions, but beginning in uppercase.\
    \ Next, come the access specifiers and class members, contained within a pair\
    \ of braces. Every class declaration must end with a semicolon after the closing\
    \ brace – so the class declaration syntax looks like this:\n\n```cpp\nclass ClassName\n\
    {\n  access specifier :\n    member1;\n    member2;\n  access specifier :\n  \
    \  member3;\n    member4;\n};\n```\n\nAn access specifier may be any one of the\
    \ keywords public, private, or protected to specify access rights for its listed\
    \ members:\n\n- Public members are accessible from any place where the class is\
    \ visible\n- Private members are accessible only to other members of the same\
    \ class\n- Protected members are accessible only to other members of the same\
    \ class and to members of classes derived from that class\n\nBy default, all class\
    \ members have private access – so any members that appear in the class declaration\
    \ without an access specifier will have private access.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_216_0.png)\n\
    \nDerived classes, which use the protected access specifier, are introduced later\
    \ in this chapter.\n\nAny real-world object can be defined by its attributes and\
    \ by its actions. For example, a dog has attributes such as age, weight, and actions\
    \ it can perform such as bark. The class mechanism in C++ provides a way to create\
    \ a virtual dog object within a program, where the variable members of a class\
    \ can represent its attributes, and the methods represent its actions:\n\n```cpp\n\
    class Dog\n{\n  private: // The default access level.\n  int age, weight;\n  string\
    \ color;\n  public:\n  void bark();\n  // ... Plus methods to store/retrieve data.\n\
    };\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_216_1.png)\n\nWhile a program\
    \ class cannot perfectly emulate a real-world object, the aim is to encapsulate\
    \ all relevant attributes and actions.\n\nIt is important to recognize that a\
    \ class declaration only defines a data structure – in order to create an object\
    \ you must declare an “instance” of that data structure. This is achieved in the\
    \ same way that instances are declared of regular C++ data types:\n\n```cpp\n\
    int num; // Creates an instance named \"num\".\n// of the regular C++ int data\
    \ type.\n```\n\n```cpp\nDog fido; // Creates an instance named \"fido\".\n// of\
    \ the programmer-defined Dog data structure.\n```\n\nAlternatively, an instance\
    \ object can be created by specifying its name between the class declaration’s\
    \ closing brace and its final semicolon. Multiple instances can be created this\
    \ way, by specifying a comma-separated list of object names. For example, the\
    \ class declaration listed below creates four instance objects of the Dog class\
    \ named “fido”, “peach”, “rex”, and “sammy”.\n\n```cpp\nclass Dog\n{\n  int age,\
    \ weight;\n  string color;\n  public:\n    void bark();\n    // ... Plus methods\
    \ to store/retrieve data.\n} fido, pooch, rex, sammy;\n```\n\nThe principle of\
    \ encapsulation in C++ programming describes the grouping together of data and\
    \ functionality in class members – age, weight, color attributes and bark action\
    \ in the Dog class.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_217_0.png)\n\n\
    It is conventional to begin class names with an uppercase character and object\
    \ names with lowercase.\n\n## Creating an object\n\nIn order to assign and retrieve\
    \ data from private members of a class, special public accessor methods must be\
    \ added to the class. These are “setter” methods, to assign data, and “getter”\
    \ methods, to retrieve data. Accessor methods are often named as the variable\
    \ address, with the first letter made uppercase, and prefixed by “set” or “get”.\
    \ For example, accessor methods to address an age variable may be named setAge()\
    \ and age().\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_219_0.png)\n\nobject.cpp\n\
    \n1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use\n```cpp\n#include <string>\n#include <iostream>\n\
    using namespace std;\n```\n\n2. Declare a class named “Dog\"\n```cpp\nclass Dog\n\
    {\n```\n\n3. Between the braces of the Dog class declaration, declare three private\
    \ variable members\n```cpp\nint age, weight;\nstring color;\n```\n\n4. After the\
    \ private variables, add a public access specifier\n```cpp\npublic:\n```\n\n5.\
    \ Begin the public members list by adding a method to output a string when called\n\
    ```cpp\nvoid bark() { cout << \"WOOF!\" << endl; }\n```\n\n6. Add public setter\
    \ methods – to assign individual values to each of the private variables\n```cpp\n\
    void setAge(int yrs) { age = yrs; }\nvoid setWeight(int lbs) { weight = lbs; }\n\
    void setColor(string hue) { color = hue; }\n```\n\n7. Add public getter methods\
    \ – to retrieve individual values from each of the private variables\n```cpp\n\
    int getAge() { return age; }\nint getWeight() { return weight; }\nstring getColor()\
    \ { return color; }\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_220_0.png)\n\
    \nMembers declared before the access specifier are by default.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_220_1.png)\n\
    \nIn the class declaration, notice that all methods are declared public and private.\n\
    \n```cpp\nint main() {\n    // Program code goes here.\n    return 0;\n}\n```\n\
    \nBetween the braces of the main method, declare an instance of the Dog\n```cpp\n\
    Dog fido;\n```\n\nNow, add statements calling each setter method to assign\n```cpp\n\
    fido.setAge(3);\nfido.setWeight(15);\nfido.setColor(\"brown\");\n```\n\nAdd statements\
    \ calling each getter method to retrieve\n```cpp\ncout << \"Fido is a \" << fido.getColor()\
    \ << \" dog\" << endl;\ncout << \"Fido is \" << fido.getAge() << \" years old\"\
    \ << endl;\ncout << \"Fido weighs \" << fido.getWeight() << \" pounds\" << endl;\n\
    ```\n\nSave, compile and run the program to see the output\n\n```\nC:\\HyPrograms>c++\
    \ object.cpp -o object.exe\nC:\\HyPrograms>object\nFido is a brown dog\nFido is\
    \ 3 years old\nFido weighs 15 pounds\n```\n\nThis program will get modified over\
    \ the next pages as new features are incorporated.\n\n## Creating multiple objects\n\
    \nA program can easily create multiple objects, simply by declaring multiple instances\
    \ of a class, and each object can have unique attributes by assigning individual\
    \ values with its setter methods.\n\nIt is often convenient to combine the setter\
    \ methods into a single method that accepts arguments for each private variable.\
    \ This means that all values can be assigned with a single statement in the program,\
    \ but the method will contain multiple statements.\n\nThe class declaration in\
    \ the previous example contains short methods \"inline\" – entirely within the\
    \ class declaration block. Where methods have more than two lines, they should\
    \ not be created inline, but should instead be declared as a \"prototype\" in\
    \ the class declaration block and defined separately – after the class declaration.\
    \ The definition must prefix the method name with the class name and the scope\
    \ resolution operator :: to identify the class containing its prototype.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_223_0.png)\n\
    \n1. Rename a copy of the previous example \"object.cpp\" as a new program \"\
    multiple.cpp\"\n\n2. In the Dog class declaration, replace the three setter methods\
    \ with a single combined setter prototype that specifies the argument data types\
    \ – but not their names\n```cpp\nvoid setValues(int, int, string);\n```\n\n3.\
    \ After the Dog class declaration, add a definition block for the prototype using\
    \ the :: scope resolution operator to identify the class in which it resides\n\
    ```cpp\nvoid Dog::setValues(int age, int weight, string color)\n{\n}\n```\n\n\
    Notice that, for easy identification, the arguments are named with the same names\
    \ as the variables to which they will be. Where a class method definition has\
    \ an argument of the same name as a class member, the this -> class pointer can\
    \ be used to explicitly refer to the class member. For example, this -> age refers\
    \ to the class member variable, whereas age refers to the argument.\n"
  mdcn: "\n\n## 7\n## 创建类和对象\n\n本章将介绍封装和继承主题——这是 C++ 面向对象编程的前两个原则。\n\n- 封装数据\n- 创建对象\n\
    - 创建多个对象\n- 初始化类成员\n- 方法重载\n- 继承类属性\n- 调用基类构造函数\n- 重写基方法\n- 总结\n\n## 封装数据\n\n\
    类是一种数据结构，可以在单个实体中同时包含变量和函数。这些统称为“成员”，而函数被称为该类的“方法”。从类外部对类成员的访问由类声明中的“访问修饰符”控制。通常，这些修饰符会拒绝对变量成员的访问，但允许对可以从这些变量成员中存储和检索数据的方法进行访问。这种“数据隐藏”（data\
    \ hiding）技术确保了存储的数据被安全地封装在类变量成员中，它是面向对象编程（OOP）的第一大原则。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_215_0.png)\n\
    \n类声明以 `class` 关键字开头，随后跟着一个空格，然后是程序员指定的名称——遵循标准的 C++ 命名规范，但以大字母开头。接下来是访问修饰符和类成员，它们包含在一对括号中。每个类声明必须在右括号后以分号结束——因此类声明的语法如下：\n\
    \n```cpp\nclass ClassName\n{\n  access specifier :\n    member1;\n    member2;\n\
    \  access specifier :\n    member3;\n    member4;\n};\n```\n\n访问修饰符可以是 `public`、`private`\
    \ 或 `protected` 关键字中的任意一个，用于指定所列成员的访问权限：\n\n- 公共（Public）成员可以在类可见的任何地方访问\n- 私有（Private）成员仅可由同类的其他成员访问\n\
    - 保护（Protected）成员仅可由同类的其他成员以及该类派生类的成员访问\n\n默认情况下，所有类成员都是 `private` 访问权限——因此，类声明中任何没有访问修饰符的成员都将具有\
    \ `private` 访问权限。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_216_0.png)\n\n使用\
    \ `protected` 访问修饰符的派生类将在本章稍后介绍。\n\n任何现实世界的对象都可以通过属性和动作来定义。例如，狗有年龄、重量等属性，以及可以执行的如叫等动作。C++\
    \ 中的类机制提供了一种在程序中创建虚拟狗对象的方法，类的变量成员可以代表它的属性，而方法则代表它的动作：\n\n```cpp\nclass Dog\n{\n\
    \  private: // 默认访问级别。\n  int age, weight;\n  string color;\n  public:\n  void\
    \ bark();\n  // ... 加上用于存储/检索数据的方法。\n};\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_216_1.png)\n\
    \n虽然程序类不能完美模拟现实世界的对象，但目标是封装所有相关的属性和动作。\n\n重要的是，类声明只定义了数据结构——为了创建对象，你必须声明该数据结构的“实例”。它的实现方式与声明普通\
    \ C++ 数据类型的实例的方式相同：\n\n```cpp\nint num; // 创建一个名为 \"num\" 的实例。\n// 属于普通的 C++ int\
    \ 数据类型。\n```\n\n```cpp\nDog fido; // 创建一个名为 \"fido\" 的实例。\n// 属于程序员定义的 Dog 数据结构。\n\
    ```\n\n或者，可以通过在类声明的右括号和最终分号之间指定其名称来创建实例对象。可以通过这种方式创建多个实例，只需指定用逗号分隔的对象名称列表。例如，下面列出的类声明创建了四个名为“fido”、“peach”、“rex”和“sammy”的\
    \ `Dog` 类实例对象。\n\n```cpp\nclass Dog\n{\n  int age, weight;\n  string color;\n\
    \  public:\n    void bark();\n    // ... 加上用于存储/检索数据的方法。\n} fido, pooch, rex,\
    \ sammy;\n```\n\nC++ 编程中的封装原则描述了将数据和功能归类集合在类成员中——即 `Dog` 类中的年龄、重量、颜色属性和 bark 动作。\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_217_0.png)\n\n类名以大字母开头、对象名以小字母开头是常规。\n\
    \n## 创建对象\n\n为了从类的私有成员中分配和检索数据，必须在类中添加特殊的公共访问方法。这些是用于分配数据的“set器”（setter）方法，以及用于检索数据的“get器”（getter）方法。访问方法通常命名为变量地址，首字母大写，并以\
    \ `set` 或 `get` 为前缀。例如，处理 `age` 变量的访问方法可以命名为 `setAge()` 和 `age()`。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_219_0.png)\n\
    \nobject.cpp\n\n1. 指定要包含的 C++ 库类和要使用的命名空间前缀开始新程序\n```cpp\n#include <string>\n\
    #include <iostream>\nusing namespace std;\n```\n\n2. 声明一个名为“Dog”的类\n```cpp\nclass\
    \ Dog\n```\n\n3. 在类声明的右括号和最终分号之间声明私有成员\n```cpp\n  private: // 默认访问级别。\n  int age,\
    \ weight;\n  string color;\n```\n\n4. 在私有成员之后添加访问修饰符\n```cpp\n  public:\n```\n\
    \n5. 添加一个输出字符串的公共 bark 方法\n```cpp\n  void bark() {\n    cout << \"WOOF!\" << endl;\n\
    \  }\n```\n\n6. 在 `main` 方法的右括号内声明 `Dog` 实例\n```cpp\nint main() {\n    Dog fido;\n\
    ```\n\n7. 添加调用 setter 方法的方法来分配\n```cpp\n    fido.setAge(3);\n    fido.setWeight(15);\n\
    \    fido.setColor(\"brown\");\n```\n\n8. 添加调用 getter 方法的方法来检索\n```cpp\n    cout\
    \ << \"Fido is a \" << fido.getColor() << \" dog\" << endl;\n    cout << \"Fido\
    \ is \" << fido.getAge() << \" years old\" << endl;\n    cout << \"Fido weighs\
    \ \" << fido.getWeight() << \" pounds\" << endl;\n    return 0;\n}\n```\n\n9.\
    \ 保存、编译并运行程序查看输出\n\n```\nC:\\HyPrograms>c++ object.cpp -o object\nC:\\HyPrograms>object\n\
    Fido is a brown dog\nFido is 3 years old\nFido weighs 15 pounds\n```\n\n随着新功能的引入，程序将在接下来几页中进行修改。\n\
    \n## 创建多个对象\n\n程序可以通过声明类的多个实例轻松创建多个对象，每个对象都可以其 setter 方法具有独特的属性。\n\n通常方便将 setter\
    \ 方法合并为一个接受每个私有变量参数的合并。这意味着在程序中使用一个语句分配所有值，但该方法将包含多个语句。\n\n上一个示例中的类声明包含了短内联方法——完全位于类声明块中。如果方法超过两行，就不应该内联创建，而应该在类声明中声明为“原型”，并在类声明之后单独定义。定义必须使用类名和作用域运算符\
