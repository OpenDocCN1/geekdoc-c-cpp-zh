    # Making arrays of pointers


    A variable of the regular char data type can be assigned a single character value,
    but a pointer to a constant char array canfully be assigned a string of characters.
    The string is actually stored as an array of characters, with one character per
    element, but referencing the char pointer will automatically retrieve the entire
    string.


    This ability to retrieve a string value from a char pointer using just its variable
    name resembles the way that a string can be retrieved from a regular char array
    using its variable name.


    Multiple strings can be stored in a constant char pointer array, with one string
    per element. You can even store multiple char pointer arrays in a “master” char
    pointer array – one array per element.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_196_0.png)


