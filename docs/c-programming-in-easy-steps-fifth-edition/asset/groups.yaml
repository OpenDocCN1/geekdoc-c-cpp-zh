    \ << endl;\n```\n\n+ 6. Save, compile, and run the program to see the output from\
    \ the text file\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_166_0.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_166_1)\n\
    \n```cpp\ncout << endl << \"Record Number: \" << ++j << endl;\ncout << \"Forename:\
    \ \" << tab[i++] << endl;\ncout << \"Surname: \" << tab[i++] << endl;\ncout <<\
    \ \"Department: \" << tab[i++] << endl;\ncout << \"Telephone: \" << tab[i++] <<\
    \ endl;\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_166_0.png)\n\n# Predicting\
    \ problems\n\nDespite the best efforts, C++ programs may unfortunately contain\
    \ one, of three types:\n- Syntax errors – the code contains incorrect use\n- Logic\
    \ errors – the code is syntactically correct, but attempts an illegal operation\n\
    - Exception errors – the program runs until it crashes\n\nThe C++ standards allow\
    \ the compiler to spot compile-time errors, but exception errors are more difficult\
    \ to locate as they only occur at runtime. The first step is to identify which\
    \ part of the code may arise then be surrounded by a “try” block. This uses the\
    \ **try** keyword and encloses the code within a pair of braces.\n\nAlways consider\
    \ that the user will perform the unexpected – then ensure your programs can handle\
    \ those actions.\n\nWhen an exception occurs, control passes to the **catch**\
    \ block – which immediately follows the **try** block. This uses handle the exception.\n\
    \nThe program described below has a **try** block containing a loop that increments\
