  - '[PAGE 96]


    # Declaring functions


    Functions enclose a section of code that provides specific functionality to the
    program. When a function is called from the main program, its statements are executed
    and, optionally, a value can be returned to the main program upon completion.
    There are three main benefits to using functions:


    +   - Functions make program code easier to understand and maintain.

    - Tried and tested functions can be re-used by other programs.

    - Several programmers can divide the workload in large projects by working on
    different functions of the program.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_96_0.png)


    # Declaring functions


    Each function is declared early in the program code as a “prototype”, comprising
    a data type for the value it will return and the function name followed by parentheses,
    which may optionally contain a list of “argument” data types of passed values
    it may use. The syntax of a function prototype declaration looks like this:


    ```

    return-data-type function-name ( arguments-data-type-list ) ;

    ```


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_96_1.png)


    Strictly speaking, the arguments in a function prototype are known as its “formal
    parameters”.


    For example, a function named “computeArea” that returns a float value and is
    passed float arguments is declared as:


    ```

    float computeArea(float, float ) ;

    ```


    # Defining functions


    The function definition appears later in the program code and comprises a repeat
    of the prototype, plus the actual function body. The function body is the statements
    to be executed whenever the function is called, contained within a pair of braces.'
- md: "\nUse the void keyword if the function will return no value to the caller.\n\
    \nIt is important to recognize that the compiler checks the function definition\
    \ against the prototype, so the actual returned data type must match what is specified\
    \ in the prototype, and any supplied arguments must match in both number and data\
    \ type. Compilation fails if the definition does not match the prototype. A simple\
    \ computeArea definition might look like this:\n\n```cpp\nfloat computeArea(float\
    \ width, float height)\n{\n    return (width * height);\n}\n```\n\n# Variable\
    \ scope\n\nVariables that are declared in a function can only be used locally\
    \ within that function, and are not accessible globally for use in other functions.\
    \ This limitation is known as “variable scope”.\n\nscope.cpp\n\n+   1. Start a\
    \ new program by specifying the C++ library classes to include, and a namespace\
    \ prefix to use\n#include <iostream>\nusing namespace std;\n\n+   2. Next, declare\
    \ two simple function prototypes\nfloat bodyTempC();\nfloat bodyTempF();\n\n+\
    \   3. Now add a main function containing calls to each function and a final return\
    \ statement\nint main() {\n    cout << \"Centigrade: \" << bodyTempC() << endl;\n\
    \    cout << \"Fahrenheit: \" << bodyTempF() << endl;\n    return 0;\n}\n\n+ \
    \  4. After the main function, define both other functions – to each return the\
    \ value of a local \"temperature\" variable\nfloat bodyTempC()\n{\n    float temperature\
    \ = 37.0;\n    return temperature;\n}\n\n```cpp\nfloat bodyTempF()\n{\n    float\
    \ temperature = 98.6;\n    return temperature;\n}\n```\n\n+   5. Save, compile,\
    \ and run the program to see the output\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_98_0.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_98_1.png)\n\nVariables of the same\
    \ name do not conflict when they are declared in a different scope – they are\
    \ not visible to each other.\n\n# Passing arguments\n\nFunction calls frequently\
    \ supply argument values to a function. These can be of any quantity and data\
    \ type, but they must agree with those specified in the function prototype declaration.\n\
    \nNote that arguments passed to a function only supply a copy of the original\
    \ value, in a procedure known as \"passing by value\".\n\nThe values passed to\
    \ arguments can be \"static\" values, specified in the program code, or \"dynamic\"\
    \ values that are input by the user. At a command prompt, the C++ cin input stream\
    \ operator to direct a value from standard input to a variable, like this:\n\n\
    ```cpp\nfloat num;\ncout << \"Please enter a number: \";\ncin >> num;\n```\n\n\
    ![](img/7b77dfe98ba5541875fec43413b9f6e4_100_0.png)\n\nFunction prototypes must\
    \ be declared before they can be defined. Typically, the prototypes appear before\
    \ the main function and their definitions appear after the main function.\n\n\
    Input can then be passed to a function as an argument in a function call, such\
    \ as workWith(num).\n\nOptionally, a function prototype can assign default values\
    \ to arguments, which will be used when a call does not pass an argument value.\
    \ Multiple arguments can be assigned default values in the prototype but these\
    \ must always appear at the end of the argument list, after any other arguments.\n\
    \nIn the same way that functions can be called from the main function, functions\
    \ may call other functions and pass arguments.\n\nargs.cpp\n\n+   1. Start a new\
    \ program by specifying the C++ library classes to include, and a namespace prefix\
    \ to use\n#include <iostream>\nusing namespace std;\n\n+   Next, declare a function\
    \ prototype that returns a float value and specifies a single float argument,\
    \ which to a default value is assigned\nfloat toC( float degreesF = 32.0 );\n\n\
    Add a main function containing a final return statement\nint main() {\n  // Program\
    \ code goes here.\n  return 0;\n}\n\nAfter the main function, define the \"fToC\"\
    \ function with statements that will return a converted value\nfloat toC(float\
    \ degreesF)\n{\n  float degreesC = ((5.0 / 9.0) * (degreesF - 32.0));\n  return\
    \ degreesC;\n}\n\nIn the main function, insert a statement to declare two float\
    \ variables – to store an input Fahrenheit temperature value and its Centigrade\
    \ equivalent\nfloat fahrenheit, centigrade;\n\nInsert statements to request that\
    \ user input stored in the first variable\ncout << \"Enter a Fahrenheit temperature:\
    \ \";\ncin >> fahrenheit;\n\nNext, call the \"fToC\" function to convert the input\
    \ value – assign the conversion to the second variable\ncentigrade = toC(fahrenheit);\n\
    \nNow, output a message describing the result\ncout << fahrenheit << \"F is \"\
    \ << centigrade << \"C\";\n\nFinally, add a statement to output a further message\
    \ using the default argument value of the function prototype\ncout << endl <<\
    \ \"Freezing point: \" << toC() << \"C\";\n\nSave, compile, and run the program,\
    \ then enter a numeric value when requested to see the output\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_101_0.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_102_0.png)\n\nIn the same way that\
    \ functions can be called from the main function, functions may call other functions\
    \ and pass arguments.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_102_1.png)\n\
    \n# Overloading functions\n\nFunction “overloading” allows functions of the same\
    \ name to co-exist in the same program, yet they differ in number, data type.\
    \ Function resolution matches a function call to the correct version by recognizing\
    \ its arguments.\n\noverload.cpp\n\n+   1. Start a new program by specifying the\
    \ C++ library classes to include, and a namespace prefix to use\n#include <iostream>\n\
    using namespace std;\n\n+   2. Next, declare two function prototypes – having\
    \ different arguments\nfloat computeArea(float diameter);\nfloat computeArea(char\
    \ letter, float width, float height);\n\n+   3. Now, add a main function containing\
    \ a final return statement\nint main() {\n  // Program code goes here.\n  return\
    \ 0;\n}\n\n+   4. After the main function, define the first function that receives\
    \ just one argument\nfloat computeArea(float diameter)\n{\nfloat radius = diameter\
    \ / 2;\nreturn 3.14159 * (radius * radius);\n}\n\n+   5. Below the first function\
    \ definition, define the overloaded functions that receive different arguments\n\
    float computeArea(float width, float height)\n{\n    return (width * height);\n\
    }\nfloat computeArea(char letter, float width, float height)\n{\n    return ((width\
    \ / 2) * height);\n}\n\n+   6. In the main function, insert statements to declare\
    \ two variables, and initialize one with user input\nfloat num, area;\ncout <<\
    \ \"Enter dimension in feet: \";\ncin >> num;\n\nCall the first function and output\
    \ its returned value\narea = computeArea(num);\ncout << \"Circle: Area = \" <<\
    \ area << \" sq.ft.\" << endl;\n\nCall the overloaded functions and output their\
    \ results\narea = computeArea(num, num);\ncout << \"Square: Area = \" << area\
    \ << \" sq.ft.\" << endl;\narea = computeArea('T', num, num);\ncout << \"Triangle:\
    \ Area = \" << area << \" sq.ft.\" << endl;\n\nSave, compile, and run the program,\
    \ then enter a numeric value when requested to see the output.\n"
  mdcn: "\n\n如果函数不向调用者返回任何值，请使用 `void` 关键字。\n\n重要的是，编译器会检查函数定义与原型之间的匹配情况，因此实际返回的数据类型必须与原型中指定的匹配，且提供的任何参数在数量和数据类型上必须匹配。如果定义与原型不匹配，编译将失败。一个简单的\
