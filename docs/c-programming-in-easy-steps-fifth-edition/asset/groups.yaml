    int main()\n{\n  // Program code goes here.\n  return 0;\n}\n\n+   5 At the start\
    \ of the main function block, declare and initialize an integer variable\n\n```cpp\n\
    int num = 5;\n```\n\nNow, insert statements to call each macro function and each\
    \ comparable inline function\ncout << \"Macro SQUARE: \" << SQUARE(num) << endl;\n\
    cout << \"Inline square: \" << square(num) << endl;\ncout << \"Macro CUBE: \"\
    \ << CUBE(num) << endl;\ncout << \"Inline cube: \" << cube(num) << endl;\n\nSave\
    \ the file, then de compile, saving the temporary files and runs the program\n\
    c++ macro.cpp -save-times -o macro.exe\n\nOpen the temporary \".ii file in a plain\
    \ text editor, like Notepad, to see that the macro functions have been directly\
    \ substituted in each output statement\n\nUsing uppercase for macro names ensures\
    \ that will not conflict with lowercase.\n\n# Building strings\n\nThe # operator\
    \ is known as the \"stringizing\" operator, as it converts to string.\n\nThe merging\
    \ operator is alternatively known as the \"token-pasting\" operator, as it pastes\
    \ tokens together.\n\n# Debugging assertions\n\nIt is sometimes helpful to use\
    \ preprocessor directives to assist with debugging – by defining an ASSERT function\
    \ to evaluate a specified condition.\n\nThe condition to be evaluated will be\
