  - "[PAGE 312]\n\n# Debugging assertions\n\nIt is sometimes helpful to use preprocessor\
    \ directives to assist with debugging program code – by defining an ASSERT macro\
    \ function to evaluate a specified condition for a Boolean value.\n\nThe condition\
    \ to be evaluated will be passed from the caller as the ASSERT function argument.\
    \ The function can then execute appropriate statements according to the result\
    \ of the evaluation. Multiple statements can be included in the macro function\
    \ definition by adding a backslash at the end of each line, allowing the definition\
    \ to continue on the next line.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_312_0.png)\n\
    \nYou can comment-out sections of code when debugging using C-style /* */ comment\
    \ operators.\n\nNumerous statements calling the ASSERT function can be added to\
    \ the program code to monitor a condition as the program proceeds. For example,\
    \ check the value of a variable as it changes.\n\nUsefully, an ASSERT function\
    \ can be controlled by a DEBUG macro. This allows debugging to be easily turned\
    \ on and off simply by changing the value of the DEBUG control macro:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_312_1.png)\n\
    \n+   Start a new program by defining a DEBUG macro with an \"on\" value of one\
    \ – to control an ASSERT function\n\n+   Next, add a macro if-elif statement to\
    \ define the ASSERT function according to the control value\n```c\n#if (DEBUG\
    \ == 1)\n    // Definition for \"on\" goes here.\n#elif (DEBUG == 0)\n    // Definition\
    \ for \"off\" goes here.\n#endif\n```\n\n+   In the top part of the ASSERT statement\
    \ block insert a definition for when the debugging control is set to \"on\" –\
    \ to output failure details from predefined macros\n```c\n#define ASSERT(expr)\n\
    ```"
