    # Providing alternatives


    The conditional test performed by #ifdef and #ifndef can be extended to provide
    an alternative by adding an #else directive. For example:


    ```

    #ifdef WEATHER

    cout << WEATHER ;

    #else

    #define WEATHER "Sunny"

    #endif

    ```


    Similarly, #if, #else, and #elif macros can perform multiple conditional tests,
    much like the regular C++ if and else keywords.


    For testing multiple definitions, the #ifdef macro can be expressed as #if defined,
    and further tests made by #elif defined macros.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_297_0.png)


    The #elif macro simply combines else and if to offer an alternative test.


    While most macros are defined in the source file with a #define directive, or
    on the command line with the -D option, some macros are automatically predefined
    by the compiler. Typically, these have names beginning with a double underscore
    to avoid accidental confusion with chosen names. The compiler’s predefined macros
    are platform-specific, so a program employs a multiple definition test to identify
    the host platform:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_297_1.png)


    +   Launch a plain text editor and save a new file (without any content) as “empty.txt”
    in your program’s directory

    To see a list of the compiler’s predefined macros, issue a command calling the
    cpp preprocessor directly with a “-dM” option on the empty file cpp-dM empty.txt

    Scroll through the list to find the “_WIN32” macro on Windows or the “_linux”
    macro on Linux systems'
