    +   4. Add an overloaded constructor, which takes a single integer argument, and
    also outputs identifying text

    Parent (int a)

    { cout << endl << "Overloaded Parent constructor called."; }


    +   5. After the Parent class, declare a derived “Daughter” class

    class Daughter : public Parent

    {

