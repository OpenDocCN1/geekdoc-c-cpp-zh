    \ zero is false and any non-zero is true or false | 0 or 1 |\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_27_0.png)\n\
    \nCharacter values of the char data type must always be enclosed between single\
    \ quotes – not double quotes.\n\nVariable declarations must appear before executable\
