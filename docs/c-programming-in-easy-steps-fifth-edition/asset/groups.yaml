  - '[PAGE 247]


    # Summary


    +   - The first principle of Object Oriented Programming is the encapsulation
    of data and functionality within a single class.


    +   - Access specifiers public, private, and protected control the accessibility
    of class members from outside the class.


    +   - A class declaration describes a data structure from which instance objects
    can be created.


    +   - Public setter and getter methods store and retrieve data from private class
    variable members.


    +   - The scope resolution operator :: can explicitly identify a class.


    +   - Class members that have the same name as a passed argument can be explicitly
    identified by the this->pointer.


    +   - A constructor method is called when an object gets created and a destructor
    method is called when it gets destroyed.


    +   - Class variables can be automatically initialized by a constructor.


    +   - Class methods can be overloaded like other functions.


    +   - The second principle of Object Oriented Programming is the virtue of inheritance
    allows derived classes to inherit the properties of their parent base class.


    +   - In a derived class declaration, the class name is followed by a : colon
    character, an access specifier, and its base class name.


    +   - When an instance object of a derived class is created, the default constructor
    of the base class gets called in addition to the constructor of the derived class.


    +   - A derived class method can override a matching method in its base class
    – also overriding all overloaded methods of that name within the base class.'
- md: "\n# 8\n\n## Harnessing polymorphism\n\nThis chapter demonstrates how to separate\
    \ programs into modular components and introduces the topic of polymorphism –\
    \ the third principle of C++ Object Oriented Programming.\n\n- Pointing to classes\n\
    - Calling a virtual method\n- Directing method calls\n- Providing capability classes\n\
    - Making abstract data types\n- Building complex hierarchies\n- Isolating class\
    \ structures\n- Employing isolated classes\n- Summary\n\n## Pointing to classes\n\
    \nThe three cornerstones of Object Oriented Programming (OOP) are encapsulation,\
    \ inheritance, and polymorphism. Examples in the previous chapter have demonstrated\
    \ how data can be encapsulated within a C++ class, and how derived classes inherit\
    \ the properties of their base class. This chapter introduces the final cornerstone\
    \ principle of polymorphism.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_250_0.png)\n\
    \nThe term \"polymorphism\" (from Greek, meaning \"many forms\") describes the\
    \ ability to assign a different meaning, or purpose, to an entity according to\
    \ its context.\n\nIn C++, overloaded operators can be described as polymorphic.\
    \ For example, the * character can represent either the multiply operator or the\
    \ dereference operator, according to its context. Similarly, the + character can\
    \ represent the add operator or the concatenate operator, according to its context.\n\
    \nMore importantly, C++ class methods can also be polymorphic. The key to understanding\
    \ polymorphism with classes is to recognize that a base pointer can be created\
    \ that is also bound to a particular derived class by association.\n\nA pointer\
    \ to a base class can be assigned the memory address of a derived class to provide\
    \ a \"context\" – to uniquely identify derived class. For example, with a Base\
    \ base class and derived Sub class, a pointer can be created like this:\n\n```\n\
    Sub int;\nBase* pSub = &int;\n```\n\nor more simply using the new keyword, like\
    \ this:\n\n```cpp\nBase* pSub = new Sub;\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_250_1.png)\n\
    \nTurn back to Chapter Six for more on pointers.\n\nWhere there are multiple derived\
    \ classes, base class pointers can be created binding each derived class by its\
    \ unique memory address – which can be revealed using the addressof & operator.\n\
    \n## classptr.cpp\n\n- Start a new program by specifying the C++ library classes\
    \ to include, and a namespace prefix to use\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n```\n\n- Declare a Base class containing a method to output\
    \ a passed integer value in hexadecimal format\n\n```cpp\nclass Base {\npublic:\n\
    \    void identify(int adr)\n        cout << \"Base class called by 0x\" << hex\
    \ << adr << endl;\n}\n```\n\n- Declare two empty derived classes, SubA and SubB\n\
    ```cpp\nclass SubA : public Base { };\nclass SubB : public Base { };\n```\n\n\
    - Declare a main method containing a final return statement\n\n```cpp\nint main()\
    \ {\n    // Program code goes here.\n    return 0;\n}\n```\n\n- In the main method,\
    \ insert statements to create two base class pointers – each binding to a specific\
    \ derived class\n```cpp\nBase*ptrA = new SubA;\nBase*ptrB = new SubB;\n```\n\n\
    - Now, insert statements that use the pointers to call the base class method,\
    \ passing the memory address of each output\n```cpp\nptrA -> identify((int) &ptrA);\n\
    ptrB -> identify((int) &ptrB);\n```\n\n- Save, compile, and run the program to\
    \ see the addresses\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_251_0.png)\n\n\
    ![](img/7b77dfe98ba5541875fec43413b9f6e4_252_0.png)\n\nThe -> class pointer operator\
    \ is used here to call class methods.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_252_1.png)\n\
    \nThe hexadecimal address is passed as an int data type, then displayed in hexadecimal\
    \ format by the hex output manipulator. The addresses will be different each time\
    \ the program executes – they are assigned dynamically.\n\n## Calling a virtual\
    \ method\n\nA base class pointer that is bound to a specific derived class can\
    \ be used to call derived class methods that have been inherited from the base\
    \ class. Methods that are unique to the derived class must, however, be called\
    \ via an instance object.\n\nA base class pointer that is bound to a specific\
    \ derived class can also be used to explicitly call a method in the base class\
    \ using the :: scope resolution operator.\n\nMost useful, an inherited method\
    \ in a derived class can override that in the base class when the base method\
    \ has been declared as a “virtual” method. This is just a regular declaration\
    \ in the base class preceded by the virtual keyword. The declaration of a virtual\
    \ method indicates that the class will be used as a base class from which another\
    \ class will be derived, which may contain a method to override the virtual base\
    \ method.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_254_0.png)\n\nvirtual.cpp\n\
    \n- 1. Start a new program by specifying the C++ library classes to include, and\
