    \ C++ 类和命名空间前缀开始新程序\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n\
    2. 添加一个包含最终返回语句的 main 函数\n```cpp\nint main() {\n  // 程序代码写在这里。\n  return 0;\n\
    }\n```\n\n3. 在 `main` 函数中，插入语句声明两个整数变量\n```cpp\nint a, b;\n```\n\n4. 接下来，插入语句输出简单的赋值值\n\
    ```cpp\ncout << \"Assign values:\";\ncout << \"a = \" << (a = 8) << \"\";\ncout\
