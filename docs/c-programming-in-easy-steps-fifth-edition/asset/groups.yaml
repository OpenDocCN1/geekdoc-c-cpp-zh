    # Discovering string features


    C++ <string> library provides a number of functions that make it easy to work
    with strings. To use them, simply add the function name after the string variable
    name and a dot. For example, with a stringvariable named "msg" you can call the
    size() function, to return its character length, with msg.size().


    A string variable can be emptied of all characters by assigning an empty string
    with two double quotes without spacing as "", or alternatively by calling the
    <string> library''s clear().


    Unlike a char array, a string variable will dynamically enlarge to accommodate
    the number of characters assigned to it, and its current memory size can be revealed
    with the <string> library''s capacity() function. Once enlarged, the allocated
    memory size remains, even when a small string gets assigned to the variable.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_127_0.png)


    The length() function can be used in place of the size() function to reveal the
    size of a string value.


    The <string> library''s empty() function returns a Boolean true (1) or false (0)
    response to reveal whether the string is empty or not.


