  - "[PAGE 243]\n\n# Overriding base methods\n\nA method can be declared in a derived\
    \ class to override a matching method in the base class – if both method declarations\
    \ have the same name, arguments, and return type. This effectively hides the base\
    \ class method as it becomes inaccessible unless it is called explicitly, using\
    \ the :: scope resolution operator for precise identification.\n\nThe technique\
    \ of overriding base class methods must be used with care, however, to avoid unintentionally\
    \ hiding overloaded methods – a single overriding method in a derived class will\
    \ hide all overloaded methods of that name in the base class!\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_243_0.png)\n\
