    \n## Providing capability classes\n\nClasses whose sole purpose is to allow other\
    \ classes to be derived from them are known as “capability classes” – they provide\
    \ capabilities to the derived classes.\n\nCapability classes generally contain\
    \ no data, but merely declare a number of virtual methods that can be overridden\
    \ in their derived classes.\n\nThe following example builds upon the previous\
    \ example to demonstrate how the “Bird” class can be better written as a capability\
    \ class. Its methods no longer contain output statements, but return a -1 (error)\
    \ value if they are called explicitly.\n\nIt is necessary to change the return\
    \ type of those methods from void to int and these changes must also be reflected\
    \ in each overriding method in the derived classes.\n\n- 1. Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use `#include <iostream> using namespace std;`\n\n- 2. Declare a base class\
    \ named “Bird”, containing two virtual method declarations that will signal an\
    \ error if called explicitly\n```cpp\nclass Bird\n{\n  public:\n    virtual int\
    \ Talk() const { return -1 };\n    virtual int Fly() const { return -1 };\n}\n\
    ```\n\n- 3. Declare a derived class named \"Pigeon\", containing two methods to\
    \ override those in the base class\n```cpp\nclass Pigeon : public Bird\n{\n  public:\n\
    \  int Talk() const {\n    cout << \"Cool! Coo!\" << endl; return 0;\n  }\n\n\
    \  int Fly() const {\n    cout << \"A pigeon flies away...\" << endl; return 0;\n\
    \  }\n}\n```\n\nThe return value of overriding methods in derived classes must\
    \ match those declared in the base class.\n\n## Declare a derived class named\
    \ “Chicken” containing two methods to override in the base class\n\n```cpp\nclass\
    \ Chicken : public Bird\n{\n    public :\n    int Talk() const\n    { cout <<\
    \ \"Cluck! Cluck!\" << endl; return 0; }\n\n    int Fly() const\n    { cout <<\
    \ \"I'm just a chicken - I can't fly!\" << endl; return 0; }\n};\n```\n\n## Declare\
    \ a main method creating base pointers binding the derived classes\n\n```cpp\n\
    int main()\n{\n    Bird* pPigeon = new Pigeon;\n    Bird* pChicken = new Chicken;\n\
    }\n```\n\n## In the main method, insert method calls and a statement to terminate\
    \ the program when an error is met by explicitly calling a base method\n\n```cpp\n\
    pPigeon -> Talk();\npChicken -> Talk();\npPigeon -> Bird::Talk();\nif (-1) { cout\
    \ << \"Error - Program ended.\" << endl; return 0; }\n```\n\n```cpp\npPigeon ->\
    \ Fly(); // Call will not be made.\npChicken -> Fly(); // Call will not be made.\n\
    return 0; // Statement will not be executed\n```\n\nSave, compile, and run the\
    \ program to see the output\n\nCapability class methods are intended to be overridden\
    \ in derived classes – they should not be called explicitly.\n\nRefer back here\
    \ for more.\n\n## Making abstract types\n\nAn Abstract Data Type (ADT) represents\
    \ a concept, rather than a tangible object, and is always the base to other classes.\
    \ These are known as “pure methods” and must always be overridden in derived classes.\n\
    \n- 1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use `#include <iostream> using namespace std;`\n\n- 2.\
    \ Declare a base ADT class named “Shape”, containing three virtual methods\n```cpp\n\
    class Shape {\npublic:\n    virtual int getArea() = 0;\n    virtual int getEdge()\
    \ = 0;\n    virtual void Draw() = 0;\n}\n```\n\n- 3. Declare a derived class “Rect”,\
    \ containing two private variables\n```cpp\nclass Rect {\nprivate:\n    int height,\
    \ width;\n}\n```\n\n- 4. In the derived class, insert a public constructor and\
    \ destructor\n```cpp\npublic:\nRect(int intWidth, int intHeight) {\n    width\
    \ = intWidth;\n    height = intHeight;\n}\n~Rect();\n```\n\nIt is illegal to create\
    \ an instance of an ADT – attempting to do so will create a compiler error.\n\n\
    ```cpp\nint getArea() { return height * width; }\nint getEdge() { return 2 * height\
    \ + width; }\nvoid Draw() {\n    for (int i = 0; i < height; i++) {\n        for\
    \ (int j = 0; j < width; j++) {\n            cout << \"x\";\n        }\n    }\n\
    }\n```\n\nDeclare a main method containing a final return statement and creating\
    \ two instances of the derived \"Rect\"\n```cpp\nint main() {\n    Shape pQuad\
    \ = new Rect(3, 7);\n    Shape pSquare = new Rect(5, 5);\n}\n```\n\nIn the main\
    \ method, insert calls to each method then save, compile, and run the program\n\
    \n```cpp\npQuad -> Draw();\ncout << \"Area is \" << pQuad -> getArea() << endl;\n\
    cout << \"Perimeter is \" << pQuad -> getEdge() << endl;\n\npSquare -> Draw();\n\
    cout << \"Area is \" << pSquare -> getArea() << endl;\ncout << \"Perimeter is\
    \ \" << pSquare -> getEdge() << endl;\n```\n\nA base class need only contain one\
    \ virtual method to create Abstract Data Type.\n\n## Building complex hierarchies\n\
    \nIt is sometimes desirable to derive an ADT from another ADT to construct a complex\
    \ hierarchy of classes. This provides great flexibility and is perfectly acceptable,\
    \ providing each pure method is defined at some point in a derived class.\n\n\
    - 1. Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use\n#include <iostream>\nusing namespace std;`\n\n- 2.\
    \ Declare a base ADT class named \"Boat\", containing a variable and accessor\
    \ method together with one pure virtual method\n```cpp\nclass Boat {\nprotected:\n\
    \  int length;\n  public:\n  int getLength() { return length; }\n  virtual void\
    \ Model() = 0;\n}\n```\n\n- 3. Declare an ADT class (derived from the Boat class)\
    \ named \"Sailboat\" – also containing a variable and accessor method together\
    \ with one pure virtual method\n```cpp\nclass Sailboat : public Boat {\nprotected:\n\
    \  int mast;\n  public:\n  int getMast() { return mast; }\n  virtual void Boom()\
    \ = 0;\n}\n```\n\n- 4. Declare a regular class (derived from the Sailboat class)\
    \ named \"Laser\", in which all members will allow public access\n```cpp\nclass\
    \ Laser : public Sailboat {\npublic:\n}\n```\n"
  mdcn: "\n在派生类中重写方法时，可以选择包含 `virtual` 前缀——作为提醒，表示它正在重写基类方法。\n\n声明一个名为 \"Chicken\"\
    \ 的派生类，包含基类中两个要重写的方法\n```cpp\nclass Chicken : public Bird {\n  public:\n    void\
    \ Talk() const {\n      cout << \"Cluck! Cluck!\" << endl;\n    }\n    void Fly()\
    \ const {\n      cout << \"I'm just a chicken - I can't fly!\" << endl;\n    }\n\
    };\n```\n\n声明一个 main 方法，其中包含最终的返回语句，并创建绑定到派生类的基类指针\n```cpp\nint main() {\n  Bird*\
    \ pigeon = new Pigeon;\n  Bird* pchicken = new Chicken;\n  // 在此处添加更多语句。\n  return\
    \ 0;\n}\n```\n\n在 main 方法中，插入对每个方法的调用\nPigeon -> Talk();\nPigeon -> Fly();\nChicken\
    \ -> Talk();\nChicken -> Fly();\nPigeon -> Bird::Talk();\nChicken -> Bird::Fly();\
    \ // 不恰的调用。\n\n保存、编译并运行程序以查看输出\n\n```\nCommand Prompt\nC:\\MyPrograms>c++ birds.cpp\
    \ -o birds.exe\nbirds\nC:\\MyPrograms\\birds\nCool Cool\nPigeon flies away...\n\
    Cluck! Cluck!\nI'm just a chicken - I can't fly!\nA bird bawks...\nA bird flies...\n\
    C:\\MyPrograms>>\n```\n\n反斜杠 `\\` 字符用于转义字符串中的单引号。\n\n## 能力类 (Capability classes)\n\
    \n唯一目的是允许其他类派生自该类的类被称为“能力类”——它们为派生类提供了功能。\n\n能力类通常不包含数据，仅声明了若干可以在其派生类中重写的虚方法。\n\
    \n以下示例在之前的示例的基础上，展示了如何将“Bird”类更好地改写为能力类。它的方法不再包含输出语句，但如果被显式调用，将返回 -1（错误）值。\n\n\
    有必要将这些方法的返回类型从 `void` 改为 `int`，并且这些更改必须反映在派生类中的每个重写方法中。\n\n- 1. 通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序：`#include\
    \ <iostream> using namespace std;`\n\n- 2. 声明一个名为“Bird”的基类，包含两个在显式调用时会指示错误的虚方法声明\n\
    ```cpp\nclass Bird\n{\n  public:\n    virtual int Talk() const { return -1 };\n\
    \    virtual int Fly() const { return -1 };\n}\n```\n\n- 3. 声明一个名为 \"Pigeon\"\
    \ 的派生类，包含两个重写基类中的方法\n```cpp\nclass Pigeon : public Bird\n{\n  public:\n  int Talk()\
    \ const {\n    cout << \"Cool! Coo!\" << endl; return 0;\n  }\n\n  int Fly() const\
    \ {\n    cout << \"A pigeon flies away...\" << endl; return 0;\n  }\n}\n```\n\n\
    派生类中重写方法的返回值必须与基类中声明的返回值匹配。\n\n## 声明一个名为“Chicken”的派生类，包含基类中两个要重写的方法\n\n```cpp\n\
    class Chicken : public Bird\n{\n    public :\n    int Talk() const\n    { cout\
    \ << \"Cluck! Cluck!\" << endl; return 0; }\n\n    int Fly() const\n    { cout\
    \ << \"I'm just a chicken - I can't fly!\" << endl; return 0; }\n};\n```\n\n##\
    \ 声明一个 main 方法，创建绑定派生类的基指针\n\n```cpp\nint main()\n{\n    Bird* pPigeon = new Pigeon;\n\
    \    Bird* pChicken = new Chicken;\n}\n```\n\n## 在 main 方法中，插入方法调用以及在显式调用基类方法遇到错误时终止程序的语句\n\
    \n```cpp\npPigeon -> Talk();\npChicken -> Talk();\npPigeon -> Bird::Talk();\n\
    if (-1) { cout << \"Error - Program ended.\" << endl; return 0; }\n```\n\n```cpp\n\
    pPigeon -> Fly(); // 不调用\npChicken -> Fly();\n```\n\n保存、编译并运行程序以查看输出\n\n能力类方法旨在被派生类重写——它们不应被显式调用。\n\
    \n参见此处。\n\n## 抽象类型 (Abstract types)\n\n抽象数据类型 (ADT) 代表一个概念而非具体的对象，并且总是基类。这些被称为“纯方法”，并且必须在派生类中重写。\n\
    \n- 1. 通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序：`#include <iostream> using namespace std;`\n\
    \n- 2. 声明一个名为“Shape”的基类 ADT，包含三个虚方法\n```cpp\nclass Shape {\npublic:\n    virtual\
    \ int getArea() = 0;\n    virtual int getEdge() = 0;\n    virtual void Draw()\
    \ = 0;\n}\n```\n\n- 3. 声明一个派生类“Rect”，包含两个私有变量\n```cpp\nclass Rect : public Shape\
    \ {\nprivate:\n    int height, width;\n}\n```\n\n- 4. 在派生类中插入公共构造函数和析构函数\n```cpp\n\
    public:\nRect(int intWidth, int intHeight) {\n    width = intWidth;\n    height\
    \ = intHeight;\n}\n~Rect();\n```\n\n创建 ADT 的实例会导致编译器错误。\n\n```cpp\nint getArea()\
    \ { return height * width; }\nint getEdge() { return 2 * height + width; }\nvoid\
    \ Draw() {\n    for (int i = 0; i < height; i++) {\n        for (int j = 0; j\
    \ < width; j++) {\n            cout << \"x\";\n        }\n    }\n}\n```\n\n声明一个\
    \ main 方法，创建两个派生类 \"Rect\" 的实例\n```cpp\nint main() {\n    Shape pQuad = new Rect(3,\
    \ 7);\n    Shape pSquare = new Rect(5, 5);\n}\n```\n\n在 main 方法中插入对每个方法的调用，然后保存、编译并运行程序\n\
    \n```cpp\npQuad -> Draw();\ncout << \"Area is \" << pQuad->getArea() << endl;\n\
    cout << \"Perimeter is \" << pQuad->getEdge() << endl;\n\npSquare -> Draw();\n\
    cout << \"Area is \" << pSquare->getArea() << endl;\ncout << \"Perimeter is \"\
    \ << pSquare->getEdge() << endl;\n```\n\n基类包含一个虚方法即可创建抽象数据类型。\n\n## 构建复杂的层级结构\
    \ (Building complex hierarchies)\n\n有时从另一个 ADT 派生一个 ADT 以构建复杂的类层级结构。这提供了极大的灵活性并且是完全允许的，只要每个纯方法在某个派生类中都有定义。\n\
    \n- 1. 通过指定要包含的 C++ 库类和使用的命名空间前缀开始一个新程序：\n#include <iostream>\nusing namespace\
    \ std;\n\n- 2. 声明一个名为 \"Boat\" 的基 ADT，包含一个变量、访问方法以及一个纯虚方法\n```cpp\nclass Boat\
    \ {\nprotected:\n  int length;\n  public:\n  int getLength() { return length;\
    \ }\n  virtual void Model() = 0;\n}\n```\n\n- 3. 声明一个派自 Boat 类的 ADT 类 \"Sailboat\"\
    ——同样包含一个变量、访问方法以及一个纯虚方法\n```cpp\nclass Sailboat : public Boat {\nprotected:\n\
    \  int mast;\n  public:\n  int getMast() { return mast; }\n  virtual void Boom()\
    \ = 0;\n}\n```\n\n- 4. 声明一个派自 Sailboat 类的普通类 \"Laser\"，其所有成员将允许公共访问\n```cpp\n\
    class Laser : public Sailboat {\npublic:\n}\n```\n"
