    # Replacing substrings


    The <string> library contains a number of useful functions to manipulate substrings.
    A string can be inserted into another string using the insert() function. This
    requires the index position at which the string should be inserted as its first
    argument, and the string value to be inserted as its second argument.


    Conversely, a substring can be removed from a string using the erase() function.
    This requires the index position at which it should begin erasing as its first
    argument, and the number of characters to be erased as its second argument.


    The replace() function needs the erase() and insert() functions to both remove
    a substring and insert a replacement. It requires three arguments specifying the
    position at which it should begin erasing, the number of characters to be erased,
    and the replacement string to be inserted at that position.


    A substring can be copied from a string using the substr() function, stating the
    index position at which it should begin copying as its first argument, and the
    number of characters to be copied as its second argument.


    The character at any specified position within a string can be copied using the
    at() function, which requires the index position as its argument. The final character
    in a string always has an element index one less than the length of the string
    – because index numbering starts at zero, not one.


