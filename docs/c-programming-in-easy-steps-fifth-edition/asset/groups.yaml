    Additionally, the current date and time can be output from the __DATE__ and __TIME__\
    \ predefined macros.\n\n# Summary\n\n- The C++ compiler's -save-temps option saves\
    \ the temporary files created during the compilation process for examination.\n\
    - Compilation first writes program code and included library code into a single\
    \ .ii text file, which is then translated into low-level Assembly language as\
    \ a .s text file.\n- Assembly language .s files are translated to machine code\
    \ as .o object files, which are used to create the executable program.\n- A #define\
    \ directive defines a macro name and a value that the preprocessor should substitute\
    \ for name in program code.\n- The preprocessor can be made to perform conditional\
    \ tests using #ifdef, #ifndef, and #endif directives.\n- Preprocessor alternatives\
    \ can be provided using #if, #else, and #elif directives, and a definition can\
    \ be removed using #undef.\n- Each header file should use inclusion guards to\
    \ prevent accidental multiple definition of the same class or function.\n- The\
    \ macro name of an inclusion guard is an uppercase version of the file name, but\
    \ with the dot replaced by an underscore.\n- A #define directive may also define\
    \ a macro function that will be substituted in program code in place of the macro\
    \ name.\n- Inline functions are usually preferable to macro functions because,\
    \ unlike macro functions, they perform type-checking.\n- The preprocessor # stringizing\
    \ operator converts a series of characters passed as a macro argument into a string\
    \ value.\n- Two terms can be combined into a single term by the preprocessor ##\
    \ merging operator.\n- An ASSERT macro function is useful for debugging code,\
    \ and may be controlled by a DEBUG macro to easily turn debugging on or off.\n\
    \n# 10\n\n# Programming visually\n\nThis chapter brings together elements from\
