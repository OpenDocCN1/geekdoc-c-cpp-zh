    # Using macro functions\n\nThe #define directive can be used to create macro functions\
    \ that will be substituted in the source code before compilation.\n\nA preprocessor\
    \ function declaration comprises a macro name, immediately followed by parentheses\
    \ containing the function's arguments – it is important not to leave any space\
    \ between the name and the parentheses. The declaration is then followed by the\
    \ function within another set of parentheses. For example, a preprocessor macro\
    \ function to half an argument looks like this:\n\n```cpp\n#define HALF(n) (n\
    \ / 2)\n```\n\nCare should be taken when using macro functions, because unlike\
    \ regular C++ functions, they do not perform any kind of type checking – so it's\
    \ easy to create a macro that causes errors. For this reason, inline functions\
    \ are usually preferable to macro functions, but because macros directly substitute\
    \ their code, they avoid the overhead of a function call – so the program runs\
    \ faster. The resulting difference can be seen in the first temporary file created\
    \ during the compilation process:\n\nmacro.cpp\n\n+   1 Start a new program by\
    \ defining two macro functions to manipulate a single argument\n#define SQUARE(n)\
