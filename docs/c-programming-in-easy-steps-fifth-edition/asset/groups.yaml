    \ <iostream>\nusing namespace std;\n```\n\n- 2. Add a main function containing\
    \ one string variable declaration and a final return statement\n```cpp\nint main()\
    \ {\n  string name;\n  // Add more statements here.\n  return 0;\n```\n\n- 3.\
    \ In the main function, insert statements assigning the user name input to a string\
    \ variable, outputting its value\n```cpp\ncout << \"Please enter your full name:\
    \ \";\ncin >> name;\ncout << \"Welcome \" << name << endl;\n```\n\nNext, insert\
    \ a string variable requesting the user name again, but this time assigning the\
    \ input to cin << getline() function before outputting its value\n```cpp\ncout\
    \ << \"Please re-enter your full name: \";\ngetline(cin, name);\ncout << \"Thanks,\
    \ \" << name << endl;\n```\n\nSave, compile, and run the program and re-enter\
    \ your full name when requested\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_120_0.png)\n\
