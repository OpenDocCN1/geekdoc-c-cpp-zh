    \ number as FF\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_165_0.png)\n\nManipulators\
    \ marked with an * are the default behaviors.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_165_1.png)\n\
    \nmanipulate.cpp\n\n+ 1. Start a new program by specifying the C++ library classes\
