- md: "\n- Delete, or comment-out, the define directives for both the BOOK and NUM\
    \ identifiers - then save the program file to apply the changes\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_291_0.png)\n\
    \nAttempting to compile a program in which an identifier has not been defined\
    \ will produce a “not declared in this scope” error.\n\n## Defining conditions\n\
    \nThe preprocessor can make intelligent insertions to program source code by using\
    \ macro functions to perform conditional tests. An #ifdef directive performs the\
    \ most common preprocessor function by testing to see if a specified macro has\
    \ been defined. When the macro has been defined, the test returns true, the preprocessor\
    \ will insert all directives, or statements, on subsequent lines up to a corresponding\
    \ #endif.\n\nConversely, an #ifndef directive tests to see if a specified macro\
    \ has not been defined. When that test returns true, it will insert all directives,\
    \ or statements, on subsequent lines up to a corresponding #endif directive.\n\
    \nTo satisfy either conditional test, it should be noted that a #define directive\
    \ needs only specify the macro name to define the identifier – it need not specify\
    \ a value to substitute.\n\nAny previously defined macro can be removed later\
    \ using the #undef directive – so that subsequent #ifdef conditional tests fail.\
    \ The macro can then be redefined by a further #define directive:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_293_0.png)\n\
    \nifdef.cpp\n\n- 1. Start a new program with a conditional test to insert a directive\
    \ when a macro is already defined\n```cpp\n#ififndef BOOK\n#define BOOK \"C++\
    \ Programming in easy steps\"\n#endif\n```\n\n- 2. Specify the library classes\
    \ to include, and the namespace\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n- 3. Add a main function containing a final return statement\n\
    ```cpp\nint main() {\n  // Program code goes here.\n  return 0;\n}\n```\n\n- 4.\
    \ In the main function, add a conditional preprocessor test to insert an output\
    \ statement\n```cpp\n#ifdef BOOK\ncout << BOOK ;\n#endif\n```\n\n- Add another\
    \ conditional preprocessor test to define a new macro and insert an output statement\
    \ when the test succeeds\n\n```cpp\n#ifndef AUTHOR\n#define AUTHOR \"Mike McGrath\"\
    \ncout << \" by \" << AUTHOR << endl;\n#endif\n```\n\nNext, add a conditional\
    \ test to redefine a macro if it has already been defined\n\n```cpp\n#ifndef BOOK\n\
    #undef BOOK\n#endif\n```\n\nNow, add a conditional test to redefine a macro if\
    \ it is no longer defined, and to insert an output statement\n\n```cpp\n#ifndef\
    \ BOOK\n#define BOOK \"Linux in easy steps\"\ncout << BOOK \" by \" << AUTHOR\
    \ << endl;\n#endif\n```\n\nSave, compile, and run the program to see the insertions\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_294_0.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_294_1.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_294_2.png)\n\nEach preprocessor directive\
    \ must appear on its own line – you cannot put multiple directives on the same\
    \ line.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_295_0.png)\n\nOn Windows systems,\
    \ string macro values specified in a command must be enclosed in escaped double\
    \ quotes.\n\n## Providing alternatives\n\nThe conditional test performed by #ifdef\
    \ and #ifndef can be extended to provide an alternative by adding an #else directive.\
    \ For example:\n\n```cpp\n#ifdef WEATHER\ncout << WEATHER ;\n#else\n#define WEATHER\
    \ \"Sunny\"\n#endif\n```\n\nSimilarly, #if, #else, and #elif macros can perform\
    \ multiple conditional tests, much like the regular C++ if and else keywords.\n\
    \nFor testing multiple definitions, the #ifdef macro can be expressed as #if defined,\
    \ and further tests made by #elif defined macros.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_297_0.png)\n\
    \nThe #elif macro simply combines else and if to offer an alternative.\n\nWhile\
    \ most macros are defined in the source file with #define directive, or on the\
    \ command line with -D, some macros are automatically predefined by the compiler.\
    \ Typically, these have names beginning with a double underscore to avoid confusion\
    \ with names. The compiler’s predefined macros are platform-specific, so a program\
    \ employs multiple definition test to identify the host:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_297_1.png)\n\
    \n- Launch a plain text editor and save a new file (without any content) as “empty.txt”\
    \ in your program’s directory To see a list of compiler’s predefined macros, issue\
    \ a command calling the cpp preprocessor directly with “-dM” option on empty file\
    \ cpp-dM empty.txt Scroll through the list to find the “WIN32” macro on Windows\
    \ or the “linux” macro on Linux\n\n```cpp\n#define __WIN32 1\n```\n\n```cpp\n\
    #define __linux 1\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_298_0.png)\n\
    \nUse the cpp command to call preprocessor directly (not the c++) ensure the cpp\
    \ -dM option is capitalized correctly.\n\n- 4. Start a new program with a conditional\
    \ test to seek WIN32 and linux macros – to identify the platform\n```cpp\n#if\
    \ defined WIN32\n#define PLATFORM \"Windows\"\n#elif defined __linux\n#define\
    \ PLATFORM \"Linux\"\n#endif\n```\n\n- 5. Specify the library classes to include,\
    \ and the namespace\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n\
    - 6. Now, add a main function containing a final return statement and a statement\
    \ to identify the host\n```cpp\nint main() {\n  cout << PLATFORM << \"System\"\
    \ << endl;\n  return 0;\n}\n```\n\n- 7. In the main function, insert statements\
    \ to execute for specific platforms\n```cpp\nif (PLATFORM == \"Windows\")\n  cout\
    \ << \"Performing Windows-only tasks...\" << endl;\nif (PLATFORM == \"Linux\"\
    )\n  cout << \"Performing Linux-only tasks...\" << endl;\n```\n\n- 8. Save, compile,\
    \ and run the program to see platform-specific output\n\n```bash\nC:\\MyPrograms>\
    \ windows_System\nPerforming Windows-only tasks...\nC:\\MyPrograms>\n```\n\n```bash\n\
    user> c++ else.cpp -o else.exe\nuser> ./else.exe\nLinux_System\nPerforming Linux-only\
    \ tasks...\nuser>\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_299_0.png)\n\
    \nThe predefined win32 macro has one underscore but the __linux macro has two\
    \ underscore characters.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_299_1.png)\n\
    \nThe conditional test of predefined macros could be extended to seek those of\
    \ other operating systems, and a final #else directive added to specify an “Unknown”\
    \ default.\n\n Guarding inclusions\n\nTypically, a C++ program will have many\
    \ .h files and a single .cpp implementation file containing the main program.\
    \ Header files may often contain one or more #include directives to make other\
    \ classes or functions available from other header files, and can cause duplication\
    \ where definitions appear in two files. For example, a header file includes another\
    \ header file containing a function definition, the compiler will consider that\
    \ definition to appear in each file – so compilation will fail.\n\nThe popular\
    \ solution to this problem of re-definition employs preprocessor directives to\
    \ ensure the compiler will only be exposed to a single definition. These are known\
    \ as “inclusion guards” and create a unique macro name for each header file. Traditionally,\
    \ the name is an uppercase version of the file name, with the dot changed to an\
    \ underscore. For example, MUM_H for a file rum.h.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_301_0.png)\n\
    \nInclusion guards are also known as “macro guards” or simply as “include guards”.\n\
    \nIn creating a macro to guard against duplication, an #ifndef directive first\
    \ tests to see if the definition has already been made by another header file\
    \ included in the same program. If the definition already exists, the compiler\
    \ ignores the duplicate definition, otherwise a #define directive will permit\
    \ the compiler to use the definition in that header file:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_301_1.png)\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_301_2.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_301_3.png)\n"
  mdcn: "\n\n-   删除或注释掉针对 `BOOK` 和 `NUM` 标识符的定义指令——然后保存程序文件以应用更改\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_291_0.png)\n\
    \n尝试编译未定义标识符的程序将产生“not declared in this scope”（在此作用范围内未声明）错误。\n\n## 定义条件\n\n预处理器可以通过宏函数执行条件测试，从而对程序源代码进行智能插入。`#ifdef`\
    \ 指令通过测试是否定义了指定的宏来执行最常见的预处理器功能。当宏被定义时，测试返回真，预处理器将插入从后续行开始直到相应的 `#endif` 之前的所有指令或语句。\n\
    \n相反，`#ifndef` 指令测试指定的宏是否**未**被定义。当该测试返回真时，它将插入从后续行开始直到相应的 `#endif` 指令之前的所有指令或语句。\n\
    \n为了满足任一条件测试，需要注意的是，`#define` 指令只需要指定宏名称来定义标识符——不需要指定要替换的值。\n\n任何之前定义的宏稍后可以使用\
    \ `#undef` 指令移除——这样随后的 `#ifdef` 条件测试就会失败。然后可以通过进一步的 `#define` 指令重新定义宏：\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_293_0.png)\n\
    \nifdef.cpp\n\n-   1. 启动一个新程序，使用条件测试在宏已定义时插入指令\n```cpp\n#ififndef BOOK\n#define\
    \ BOOK \"C++ Programming in easy steps\"\n#endif\n```\n\n-   2. 指定要包含的库类和命名空间\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n```\n\n-   3. 添加一个包含最终返回语句的\
    \ main 函数\n```cpp\nint main() {\n  // 程序代码放在这里。\n  return 0;\n}\n```\n\n-   4.\
    \ 在 main 函数中，添加一个条件预处理器测试以插入输出语句\n```cpp\n#ifdef BOOK\ncout << BOOK ;\n#endif\n\
    ```\n\n-   添加另一个条件预处理器测试，以定义新宏并在测试成功时插入输出语句\n\n```cpp\n#ifndef AUTHOR\n#define\
    \ AUTHOR \"Mike McGrath\"\ncout << \" by \" << AUTHOR << endl;\n#endif\n```\n\n\
    接下来，添加一个条件测试，如果宏已经定义则对其进行重新定义\n\n```cpp\n#ifndef BOOK\n#undef BOOK\n#endif\n```\n\
    \n现在，添加一个条件测试，如果宏不再被定义则重新定义它，并插入输出语句\n\n```cpp\n#ifndef BOOK\n#define BOOK \"\
    Linux in easy steps\"\ncout << BOOK \" by \" << AUTHOR << endl;\n#endif\n```\n\
    \n保存、编译并运行程序以查看插入的结果\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_294_0.png)\n\n\
    ![](img/7b77dfe98ba5541875fec43413b9f6e4_294_1.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_294_2.png)\n\
    \n每个预处理器指令必须独占一行——你不能将多个指令放在同一行上。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_295_0.png)\n\
    \n在 Windows 系统上，命令中指定的字符串宏值必须用转义的双引号括起来。\n\n## 提供替代方案\n\n由 #ifdef 和 #ifndef 执行的条件测试可以通过添加\
    \ #else 指令进行扩展，以提供替代方案。例如：\n\n```cpp\n#ifdef WEATHER\ncout << WEATHER ;\n#else\n\
    #define WEATHER \"Sunny\"\n#endif\n```\n\n同样，`#if`、`else` 和 `#elif` 宏可以执行多个条件测试，就像普通的\
    \ C++ `if` 和 `else` 关键字一样。\n\n对于测试多个定义，`#ifdef` 宏可以表示为 `#if defined`，并通过 `#elif\
    \ defined` 宏进行进一步测试。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_297_0.png)\n\n\
    `#elif` 宏简单地将 `else` 和 `if` 结合起来提供替代方案。\n\n虽然大多数宏是在源文件中通过 `#define` 指令或在命令行通过\
    \ `-D` 定义的，但某些宏是由编译器自动预定义的。通常，这些名称以双下划线开头以避免混淆。编译器的预定义宏是特定平台的，因此程序使用多个定义测试来识别主机：\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_297_1.png)\n\n-   启动纯文本编辑器并将新文件（无内容）保存为程序目录下的“empty.txt”。要查看编译器的预定义宏列表，使用带“-dM”的命令直接调用\
    \ cpp 预处理器：`cpp -dM empty.txt`滚动滚动找到 Windows 上的 `WIN32` 宏或 Linux 上的 `linux` 宏。\n\
    \n```cpp\n#define __WIN32 1\n```\n\n```cpp\n#define __linux 1\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_298_0.png)\n\
    \n使用 cpp 命令直接调用预处理器（而不是 c++），确保 -dM 选项大正确。\n\n-   4. 启动一个新程序，使用条件测试查找 WIN32 和\
