    \ through which string values can be converted to a numeric data type, and numeric\
    \ values can be converted to a string data type. To make this ability available\
    \ to a program, the library must be added with an #include <sstream> directive\
    \ at the start of the program.\n\nValues can be loaded into a stringstream object\
    \ with the familiar output stream << operator that is used with cout statements.\
    \ Contents can then be extracted from a stringstream object with the >> input\
    \ operator that is used by cin statements.\n\nIn order to re-use a stringstream\
    \ object, it must first be returned to its original state. This requires its contents\
    \ to be set as an empty string and its status flags to be cleared.\n\n# Discovering\
    \ string features\n\nC++ <string> library provides a number of functions that\
    \ make it easy to work with strings. To use them, simply add the function name\
    \ after the string variable and a dot. For example, with a string named \"msg\"\
    \ you can call the size() function, to return its character length, with msg.size().\n\
    \nA string variable can be emptied of all characters by assigning an empty string\
    \ with two double quotes without spacing as \"\", or alternatively by calling\
    \ the <string> library's clear().\n\nUnlike a char array, a string variable will\
    \ dynamically enlarge to accommodate the number of characters assigned to it,\
    \ and its current memory size can be revealed with the <string> library's capacity()\
    \ function. Once enlarged, the allocated memory size remains, even when a small\
    \ string gets assigned to the variable.\n\nThe length() function can be used in\
    \ place of the size() function to reveal the size of a string value.\n\nThe <string>\
    \ library's empty() function returns a Boolean true (1) or false (0) response\
    \ to reveal whether the string is empty or not.\n\nfeatures.cpp\n\n```cpp\n#include\
    \ <string> // Include string support.\n#include <iostream>\nusing namespace std;\n\
    \nvoid computeFeatures(string string);\n\nint main(){\n```\n"
