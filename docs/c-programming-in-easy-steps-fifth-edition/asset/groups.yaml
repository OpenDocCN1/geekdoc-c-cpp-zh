    # Adjusting the interface


    The app test for mobile devices above failed to satisfactorily present the controls,
    as the interface is too wide for small screen devices. Happily, the interface
    can be made to adapt to different screen sizes so it can also look good on mobile
    devices. The adaptation relies upon recognizing the screen size and changing the
    orientation of a <StackPanel> element in XAML for narrow screen devices:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_345_0.png)


    +   Open MainPage.xml, then in XAML view add these elements immediately below
    the opening <Grid> element and before the component <VisualStateManager.VisualStateGroups>

    <VisualStateGroup>

    <!-- Elements to be inserted here (Steps 2-3) -->


    ```

    <VisualStateGroup>

    <VisualStateManager.VisualStateGroups>

    ```


    +   Next, insert elements to recognize wide screens

    <VisualState x:Name = "wideState">

    <VisualState.StateTriggers>

    <AdaptiveTrigger MinWindowWidth="641" />

    </VisualState.StateTriggers>

    </VisualState>


    +   Next, insert elements to recognize narrow screens and to change the Orientation
    of the outer <StackPanel>

    <VisualState x:Name = "narrowState">

    <VisualState.StateTriggers>

    <AdaptiveTrigger MinWindowWidth="0" />

    </VisualState.StateTriggers>

    <VisualState.Setters>

    <Setter

    Target = "MainStack.Orientation" Value = "Vertical" />

    </VisualState.Setters>

    </VisualState>


