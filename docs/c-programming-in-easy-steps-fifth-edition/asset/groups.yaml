    \nUse the cin function for numeric input or single word input, but use the getline()\
    \ function for string input.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_121_0.png)\n\
    \nThe arguments to the **cin.ignore()** function specify it should discard up\
    \ to 256 characters and stop when it encounters a newline character.\n\n# Solving\
    \ the string problem\n\nA problem arises with string variables when you need to\
    \ convert them to a different data type, perhaps to perform arithmetical operations\
    \ with those values. As the string object is not a native C++ data type a string\
    \ value cannot be converted to an int or any other regular data type by casting.\n\
    \nThe solution is provided by the C++ <sstream> library that allows a stringstream\
    \ to act as an intermediary, through which string values can be converted to a\
    \ numeric data type, and numeric values can be converted to a string data type.\
    \ To make this ability available to a program, the library must be added with\
    \ an #include <sstream> directive at the start of the program.\n\nValues can be\
