  - "[PAGE 293]\n\n# Defining conditions\n\nThe preprocessor can make intelligent\
    \ insertions to program source code by using macro functions to perform conditional\
    \ tests. An #ifdef directive performs the most common preprocessor function by\
    \ testing to see if a specified macro has been defined. When the macro has been\
    \ defined, the test returns true, the preprocessor will insert all directives,\
    \ or statements, on subsequent lines up to a corresponding #endif.\n\nConversely,\
    \ an #ifndef directive tests to see if a specified macro has not been defined.\
    \ When that test returns true, it will insert all directives, or statements, on\
    \ subsequent lines up to a corresponding #endif directive.\n\nTo satisfy either\
    \ conditional test, it should be noted that a #define directive needs only specify\
    \ the macro name to define the identifier – it need not specify a value to substitute.\n\
    \nAny previously defined macro can be removed later using the #undef directive\
    \ – so that subsequent #ifdef conditional tests fail. The macro can then be redefined\
    \ by a further #define directive:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_293_0.png)\n\
    \nifdef.cpp\n\n+   1. Start a new program with a conditional test to insert a\
    \ directive when a macro is already defined\n#ififndef BOOK\n#define BOOK \"C++\
    \ Programming in easy steps\"\n#endif\n\n+   2. Specify the library classes to\
    \ include, and the namespace\n#include <iostream>\nusing namespace std;\n\n+ \
    \  3. Add a main function containing a final return statement\nint main() {\n\
    \  // Program code goes here.\n  return 0;\n}\n\n+   4. In the main function,\
    \ add a conditional preprocessor test to insert an output statement\n#ifdef BOOK\n\
    cout << BOOK ;\n#endif"
