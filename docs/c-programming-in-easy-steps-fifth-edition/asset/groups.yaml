    cout << \"Cast integer char: \" << letter << endl;\n```\n\n- 保存、编译并运行程序以查看结果\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_74_1.png)\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_75_0.png)\n\
    \nASCII（读作 \"askee\"）是美国信息交换代码，是纯文本的认可标准。在 ASCII 中，字符在 0-127 的范围内用数值表示。大写字母 'A'\
    \ 是 65，因此该整数值被转换为 int 变量。\n\n# 总结\n\n- 算术运算符可以形成两个操作数的表达式，用于加 +、减 -、乘 *、除 / 或取模\
    \ %。\n- 递增 ++ 和递减 -- 运算符通过值 1 修改单个操作数。\n- 赋值运算符 = 可以与算术运算符结合执行算术计算，然后赋值其结果。\n\
    - 比较运算符可以形成表达式，比较两个操作数的相等 ==、不相等 !=、大于 >、小于 <、大于或等于 >= 以及小于或等于 <= 值。\n- 逻辑 &&\
    \ 和 || 运算符形成表达式，评估两个操作数以返回 true 或 false 的布尔值。\n- 逻辑 ! 运算符返回单个操作数的取反布尔值。\n- 三元运算符\
    \ ? 评估给定的布尔表达式，然后根据其结果返回两个操作数之一。\n- sizeof 运算符返回变量的内存大小。\n- int 变量可以修饰为 short\
    \ 类型以处理较小的数字，或修饰为 long 类型以处理大数字。\n- 当 int 变量仅存储正数时，可以将其修饰为无符号（unsigned）以扩展其数值范围。\n\
    - 在复杂的表达式中，通过添加括号 () 显式设置运算符优先级是非常重要的。\n- 变量中存储的数据可以通过类型转换过程强制转换为不同数据类型的变量。\n\
    - C++ 支持传统的 C 风格转换和使用 static_cast 关键字的更新类型转换形式。\n\n# 3\n# 编写语句\n\n本章演示了 C++ 条件语句，它允许程序在不同的方向上分支，并引入了\
    \ C++ 函数结构。\n\n- 使用 if 分支\n- 切换分支\n- for 循环\n- while 循环\n- 声明函数\n- 传递参数\n- 函数重载\n\
    - 优化函数\n- 总结\n\n# 使用 if 分支\n\nC++ 的 if 关键字执行基础条件测试，评估给定的表达式以获得 true 或 false 的布尔值——其语法如下：\n\
    \n```\nif ( test-expression ) { statements-to-execute-when-true }\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_80_0.png)\n\
    \n测试语句后面的大括号可以包含一个或多个语句，每个语句都以分号结束；但这些语句只有在发现表达式为真时才会执行。当发现测试为假时，程序将继续下一个任务。\n\
    \n可选地，if 语句可以在 if 语句块之后附加 else 语句块，在测试失败时提供备选执行语句，如下：\n\n```\nif ( test-expression\
    \ ) { statements-to-execute-when-true }\nelse { statements-to-execute-when-false\
    \ }\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_80_1.png)\n\n当在测试成功时只有一个语句要执行时，可以省略大括号——但保留它们有助于代码的清晰度。\n\
    \n要测试两个条件，测试表达式可以使用 && 运算符。例如，`if (( num > 5) && ( letter == 'A') )`。或者，一个 if\
    \ 语句可以“嵌套”在另一个 if 语句中，因此内部语句块中的语句只有在两个测试都成功时才会执行——但如果外部测试成功，则外部语句块中的语句将执行。\n\n\
    ![](img/7b77dfe98ba5541875fec43413b9f6e4_80_2.png)\n\n- 1. 通过指定要包含的 C++ 库类和要使用的命名空间前缀开始一个新程序\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n```\n\n添加一个包含最终返回语句的 main 函数\n\
    \n```cpp\nint main()\n{\n    // 程序代码写在此处。\n    return 0;\n}\n```\n\n在 main 函数中，插入语句来声明和初始化两个变量\n\
    \n接下来，插入一个 if-else 语句测试整数变量的值并输出适当的响应\n\n```cpp\nif (num > 5)\n    cout << \"\
    Number exceeds five\" << endl;\nelse\n    cout << \"Number is five or less\" <<\
    \ endl;\n```\n\n在 if 语句块中，插入一个嵌套的 if 语句测试字符变量的值并输出匹配\n\n```cpp\nif (letter ==\
    \ 'A') cout << \"Letter is A\" << endl;\n```\n\n保存、编译并运行程序以查看两个测试都成功\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_81_0.png)\n\
    \n编辑字符变量以更改值\n\n```cpp\nchar letter = 'B';\n```\n\n保存、编译并运行程序以查看两个测试都成功\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_81_1.png)\n\
    \n编辑整数变量以更改值\n\n```cpp\nint num = 3;\n```\n\n再次保存并运行程序以查看两个测试失败\n\n```\nC:\\MyPrograms\\\
    ifelse.cpp -o ifelse.exe\nC:\\MyPrograms>ifelse\nNumber five\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_82_0.png)\n\
    \n测试布尔值时可以使用简写——所以 **if ( flag == true )** 可以写为 **if ( flag )**。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_82_1.png)\n\
    \n避免嵌套超过三层的 **if** 语句。\n\n# 切换分支\n\n上述引入的 if 和 else 关键字允许根据测试结果在特定方向分支，并可反复测试变量以匹配值。例如，测试整数：\n\
    \n```cpp\nif (num == 1) { cout << \"Monday\"; }\nelse\nif (num == 2) { cout <<\
    \ \"Tuesday\"; }\nelse\nif (num == 3) { cout << \"Wednesday\"; }\nelse\nif (num\
    \ == 4) { cout << \"Thursday\"; }\nelse\nif (num == 5) { cout << \"Friday\"; }\n\
    ```\n\n程序将在匹配的方向分支。\n\n使用 switch 语句通常比长 if-else语句效率，特别是当测试表达式评估一个变量时。\n\nswitch\
    \ 语句的工作方式异常。它接收给定的变量值，然后在多个 case 语句中寻找匹配的值。与 case语句值相关的语句将执行。\n\n当未找到匹配时，没有 case\
    \ 语句将执行，但你可以在最后一个 case 语句之后添加 default 语句，指定在未找到匹配时执行的语句。\n\n在每个 case 语句后面跟上 break\
    \ 关键字是非常重要的，以便在与匹配的 case 值相关的语句执行后停止程序通过 switch 块——除非这正是你需要的。例如，对于三个值中的每个值一个语句：\n\
    \n```\nswitch(variable-name)\n{\n  case value1; case value2; case value3;\n  \
    \  statements-to-be-executed; break;\n  case value4; case value5; case value6;\n\
    \    statements-to-be-executed; break;\n}\n```\n\n通常，每个 case 语句都有自己的要执行语句集并以 break\
    \ 结束，如下程序所示。\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_84_0.png)\n\n"
