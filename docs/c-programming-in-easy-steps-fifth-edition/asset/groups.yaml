    combined setter prototype that specifies the argument data types – but not their
    names

    void setValues(int, int, string);


    +   3 After the Dog class declaration, add a definition block for the prototype
    using the :: scope resolution operator to identify the class in which it resides

    void Dog::setValues(int age, int weight, string color)

    {

    }


    Notice that, for easy identification, the arguments are named with the same names
    as the variables to which they will be assigned. Where a class method definition
    has an argument of the same name as a class member, the this -> class pointer
    can be used to explicitly refer to the class member. For example, this -> age
    refers to the class member variable, whereas age refers to the argument.'
