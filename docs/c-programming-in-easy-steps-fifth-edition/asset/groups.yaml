- md: "\nThe ternary operator can return values of any data type – numbers, strings,\
    \ Boolean values, etc.\n\n## Establishing size\n\nDeclaration of a variable allocates\
    \ system memory where values assigned to that variable will be stored. The amount\
    \ of memory allocated for this is determined by your system and the data type.\n\
    \nTypically, an int data type is created as a “long” value by default, which can\
    \ store values from +2,147,483,647 to -2,147,483,648. On the other hand, if the\
    \ int data type is created as a “short” value by default, it can only store values\
    \ from +32,767 to -32,768.\n\nThe preferred range can be explicitly specified\
    \ when declaring the variable by prefixing the int with a short or long qualifier.\
    \ The short int is useful to save memory space when you are sure your limit will\
    \ never be exceeded.\n\nWhen an int variable is declared, it by default contains\
    \ either positive or negative integers, which are known as “signed” values. If\
    \ the variable will always contain positive integers, it can be qualified as unsigned\
    \ to increase its maximum possible value. Typically, an unsigned short int has\
    \ a range from zero to 65,535 and an unsigned int has a range from zero to 4,294,967,295.\n\
    \nThe memory of any variable can be discovered using the C++ sizeof operator.\
    \ The name of the variable to be examined can be specified in optional parentheses\
    \ following the sizeof operator. For example, to examine a variable named “var\"\
    :\n\n```\nsizeof(var); // Alternatively you can use sizeof var;\n```\n\nThe sizeof\
    \ operator will return an integer that is the number of bytes allocated to store\
    \ data within the named variable.\n\nSimple data types, as char and bool, only\
    \ need a single byte of memory to store just one piece of data. Longer numeric\
    \ values need more memory, according to their possible range – determined by data\
    \ type and qualifiers.\n\nThe memory allocated to an array is a multiple of that\
    \ allocated to a single variable of its type, according to its number of elements.\
    \ For example, an int array of 50 elements will allocate 50 times the memory allocated\
    \ to a single int variable.\n\nThe sizeof operator is demonstrated in the program\
    \ below.\n\n## sizeof.cpp\n\nStart a new program by specifying the C++ library\
    \ classes to include, and a namespace prefix to use\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nAdd a main function containing a final return statement\n\
    int main()\n{\n    // Program code goes here.\n    return 0;\n}\n```\n\nIn the\
    \ main function, int statements declaring variables of various data types\n```cpp\n\
    int num[50]; float decimal;\nbool isTrue; unsigned int max; char letter;\ndouble\
