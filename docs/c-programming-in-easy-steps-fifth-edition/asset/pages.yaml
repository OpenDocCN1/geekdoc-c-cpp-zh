    \ RULE << endl << BOOK << endl << RULE;\n    cout << endl << \"NUM is: \" << NUM\
    \ << endl;\n    cout << \"Double NUM: \" << ((NUM) * 2) << endl;\n    return 0;\n\
    }\n\n+   Save, compile, and run the program to see the output"
