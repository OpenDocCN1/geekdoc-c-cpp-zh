  md: "# Solving the string problem\n\nA problem arises with string variables when\
    \ you need to convert them to a different data type, perhaps to perform arithmetical\
    \ operations with those values. As the string object is not a native C++ data\
    \ type a string value cannot be converted to an int or any other regular data\
    \ type by casting.\n\nThe solution is provided by the C++ <sstream> library that\
    \ allows a stringstream to act as an intermediary, through which string values\
    \ can be converted to a numeric data type, and numeric values can be converted\
    \ to a string data type. To make this ability available to a program, the library\
    \ must be added with an #include <sstream> directive at the start of the program.\n\
    \nValues can be loaded into a stringstream object with the familiar output stream\
    \ << operator that is used with cout statements. Contents can then be extracted\
    \ from a stringstream object with the >> input operator that is used by cin statements.\n\
    \nIn order to re-use a stringstream object, it must first be returned to its original\
    \ state. This requires its contents to be set as an empty string and its status\
    \ flags to be cleared.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_123_0.png)\n\
    \n+   Start a new program by specifying the C++ library classes to include, and\
    \ a namespace prefix to use\n#include <string> // Include string support.\n#include\
    \ <sstream> // Include stringstream support.\n#include <iostream>\nusing namespace\
    \ std;\n\n+   Add a main function containing a final return statement and declaring\
    \ two initialized variables to be converted\n\n```\nint main()\n{\n    string\
    \ term = \"100\";\n    int number = 100;\n    // Add more statements here.\n \
    \   return 0;\n}\n```\n\n+   In the main function, insert statements to declare\
    \ an integer variable, string variable, and a stringstream object\nint num; //\
    \ To store a converted string.\nstring text; // To store a converted integer.\n\
    stringstream stream; // To perform conversions."
