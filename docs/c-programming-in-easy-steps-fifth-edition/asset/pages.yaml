  md: '# Writing a file


    The ability to read and write files from a program provides a useful method of
    maintaining data on the computer''s hard disk. The format of the data may be specified
    as human-readable plain text format or machine-readable binary format.


    The standard C++ <iostream> library provides functions for working with files,
    which can be made available by adding an #include <fstream> directive at the start
    of the program.


    For each file to be opened, a filstream object must first be created. This will
    either be an "ofstream" (output filesize) object, for writing data to the file,
    or an "ifstream" (input filesize) object, for reading data from the file. The
    ofstream object is used like the cout function that writes to standard output,
    and the ifstream object works like the cin function that reads from standard input.


    The declaration of a filstream object for writing output begins with the ofstream
    keyword, then a chosen name for that filstream object followed by parentheses
    nominating the text to write to. So, the declaration syntax looks like:


    ofstream object-name ("file-name");


    The argument nominating the file type may contain the full file path, such as
    "C:datalog.txt" or "home/user/log.txt", otherwise the program will seek the file
    within the directory in which the program resides.


    Before writing to a file, the program should always first test that the filstream
    object has actually been created. Typically, this is performed by an if statement
    that allows the program to write output only when the test is successful.


    If a nominated file already exists, it will by by default be overwritten without
    warning. Otherwise, a new file will be created and written.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_148_0.png)


    The nominated file name or path must be enclosed within double quotes, like a
    string.


    For writing output to a nominated file, the program should always call the associated
    filstream object''s close() function to close the output filstream.


    The program described below builds a string for writing as output. This is written
    to a nominated file when the filstream object has been successfully created, then
    the filstream closed.'
