  md: "# Building complex hierarchies\n\nIt is sometimes desirable to derive an ADT\
    \ from another ADT to construct a complex hierarchy of classes. This provides\
    \ great flexibility and is perfectly acceptable, providing each pure method is\
    \ defined at some point in a derived class.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_270_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n#include <iostream>\nusing namespace std;\n\n\
    +   2. Declare a base ADT class named \"Boat\", containing a variable and accessor\
    \ method together with one pure virtual method\nclass Boat {\nprotected:\n  int\
    \ length;\n  public:\n  int getLength() { return length; }\n  virtual void Model()\
    \ = 0;\n}\n\n+   3. Declare an ADT class (derived from the Boat class) named \"\
    Sailboat\" – also containing a variable and accessor method together with one\
    \ pure virtual method\nclass Sailboat : public Boat {\nprotected:\n  int mast;\n\
    \  public:\n  int getMast() { return mast; }\n  virtual void Boom() = 0;\n}\n\n\
    +   4. Declare a regular class (derived from the Sailboat class) named \"Laser\"\
    , in which all members will allow public access\nclass Laser : public Sailboat\
    \ {\npublic:\n}"
