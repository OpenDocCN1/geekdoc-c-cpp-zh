  md: '# Creating multiple objects


    A program can easily create multiple objects, simply by declaring multiple instances
    of a class, and each object can have unique attributes by assigning individual
    values with its setter methods.


    It is often convenient to combine the setter methods into a single method that
    accepts arguments for each private variable. This means that all values can be
    assigned with a single statement in the program, but the method will contain multiple
    statements.


    The class declaration in the previous example contains short methods of "inline"
    – entirely within the class declaration block. Where methods have more than two
    lines, they should not be created inline, but should instead be declared as a
    "prototype" in the class declaration block and defined separately – after the
    class declaration. The definition must prefix the method name with the class name
    and the scope resolution operator :: to identify the class containing its prototype.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_223_0.png)


    +   1 Rename a copy of the previous example "object.cpp" as a new program "multiple.cpp"


    +   2 In the Dog class declaration, replace the three setter methods with a single
    combined setter prototype that specifies the argument data types – but not their
    names

    void setValues(int, int, string);


    +   3 After the Dog class declaration, add a definition block for the prototype
    using the :: scope resolution operator to identify the class in which it resides

    void Dog::setValues(int age, int weight, string color)

    {

    }


    Notice that, for easy identification, the arguments are named with the same names
    as the variables to which they will be assigned. Where a class method definition
    has an argument of the same name as a class member, the this -> class pointer
    can be used to explicitly refer to the class member. For example, this -> age
    refers to the class member variable, whereas age refers to the argument.'
