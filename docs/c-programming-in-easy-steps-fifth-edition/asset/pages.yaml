  md: '# Guarding inclusions


    Typically, a C++ program will have many .h files and a single .cpp implementation
    file containing the main program. Header files may often contain one or more #include
    directives to make other classes or functions available from other header files,
    and can cause duplication where definitions appear in two files. For example,
    a header file includes another header file containing a function definition, the
    compiler will consider that definition to appear in each file – so compilation
    will fail.


    The popular solution to this problem of re-definition employs preprocessor directives
    to ensure the compiler will only be exposed to a single definition. These are
    known as “inclusion guards” and create a unique macro name for each header file.
    Traditionally, the name is an uppercase version of the file name, with the dot
    changed to an underscore. For example, MUM_H for a file rum.h.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_301_0.png)


    Inclusion guards are also known as “macro guards” or simply as “include guards”.


    In creating a macro to guard against duplication, an #ifndef directive first tests
    to see if the definition has already been made by another header file included
    in the same program. If the definition already exists, the compiler ignores the
    duplicate definition, otherwise a #define directive will permit the compiler to
    use the definition in that header file:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_301_1.png)


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_301_2.png)


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_301_3.png)'
  merge: -1
  pgno: 301
