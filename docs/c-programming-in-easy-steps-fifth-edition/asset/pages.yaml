  md: "# Making abstract data types\n\nAn Abstract Data Type (ADT) represents a concept,\
    \ rather than a tangible object, and is always the base to other classes. A base\
    \ class can be made into an ADT by initializing one or more of its methods with\
    \ zero. These are known as “pure virtual methods” and must always be overridden\
    \ in derived classes.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_266_0.png)\n\
    \nadt.cpp\n\n+   Start a new program by specifying the C++ library classes to\
    \ include, and a namespace prefix to use\n#include <iostream>\nusing namespace\
    \ std;\n\n+   Declare a base ADT class named “Shape”, containing three pure virtual\
    \ methods\nclass Shape {\npublic:\n    virtual int getArea() = 0;\n    virtual\
    \ int getEdge() = 0;\n    virtual void Draw() = 0;\n}\n\n+   Declare a derived\
    \ class named “Rect”, containing two private variables\nclass Rect {\nprivate:\n\
    \    int height, width;\n}\n\n+   In the derived class declaration, insert a public\
    \ constructor and destructor\npublic:\nRect(int intWidth, int intHeight) {\n \
    \   height = initState;\n    width = intWidth;\n}\n~Rect();\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_266_1.png)"
