  md: "# Switching branches\n\nThe if and else keywords, introduced above, allow programs\
    \ to branch in a particular direction according to the result of a test condition,\
    \ and can be used to repeatedly test a variable to match a value. For example,\
    \ testing an integer:\n\n```\nif (num == 1) { cout << \"Monday\"; }\nelse\nif\
    \ (num == 2) { cout << \"Tuesday\"; }\nelse\nif (num == 3) { cout << \"Wednesday\"\
    ; }\nelse\nif (num == 4) { cout << \"Thursday\"; }\nelse\nif (num == 5) { cout\
    \ << \"Friday\"; }\n```\n\nThe program will branch in the direction of the match.\n\
    \nConditional branching with long if-else statements can often be more efficiently\
    \ performed using a switch statement indent, especially when the test expression\
    \ evaluates one variable.\n\nThe switch statement works in an unusual way. It\
    \ takes a given variable value, then seeks a matching value among a number of\
    \ case statements. Statements associated with the case statement value no match\
    \ will be executed.\n\nWhen no match is found, no case statements will be executed,\
    \ but you may add a default statement after the final case statement to specify\
    \ statements to be executed when no match is found.\n\nIt is important to follow\
    \ each case statement with the break keyword, to stop the program proceeding through\
    \ the switch block after all statements associated with the matched case value\
