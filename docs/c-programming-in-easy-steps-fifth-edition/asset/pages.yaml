  md: '# # Starting a Universal project


    Windows 10 introduced the Universal Windows Platform (UWP) that enables you to
    create a single application that will run on any modern Windows-based device –
    phone, tablet, or PC.


    The interface layout of a UWP application uses the eXtensible Application Markup
    Language (XAML) to specify components.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_319_0.png)


    The example in this chapter is for Visual Studio 2015 on Windows 10 – it won’t
    work with earlier versions.


    In order to develop apps for the UWP, you should be running the latest version
    of Windows 10, and your Visual Studio IDE must include the Universal Windows App
    Development Tools:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_319_1.png)


    +   Open Control Panel, Programs and Features, then right-click on the Visual
    Studio item and select Change – to launch the Visual Studio installer


    | Name | Publisher |

    | --- | --- |

    | Visual Studio 2015 Update 3 (KB3033596) | Microsoft Corporation |

    | Visual Studio Community 2015 with Update 2 | Microsoft Corporation |

    | MyVC++ Redistributable 1.4 | Microsoft Corporation |

    | VS2 C++ 11.0 | Florian Heidenberg |


    +   Select all options in the Universal Windows App Development Tools category,
    and click the Next button – to download and install the tools'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# After installation of the tools, open the Visual Studio IDE


    A UWP application is also known as a “UWA” – Universal Windows Application.


    Depending upon your choices when you installed Visual Studio, you may see the
    options checked when the installer launches, to indicate that you have the Universal
    Windows App Development Tools.


    Next, select File, New, Project and create a new Blank App (Universal Windows)
    project called “Universal”'
  merge: -1
