  md: "# Optimizing functions\n\nFunctions can call themselves recursively, to repeatedly\
    \ execute the statements contained in their function body – like a loop. As loops,\
    \ a recursive function must contain an incrementer and a conditional test to call\
    \ itself again, or stop repeating when a condition is met. The syntax of a recursive\
    \ function looks like this:\n\n```\nreturn-data-type function-name ( argument-list\
    \ )\n{\n    statements-to-be-executed;\n    incrementer;\n    conditional-test-to-recall-or-exit;\n\
    }\n```\n\nThe incrementer will change the value of a passed argument – so subsequent\
    \ calls will pass the adjusted value back to the function.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_108_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n#include <iostream>\nusing namespace std;\n\n\
    +   2. Below the preprocess instructions, declare two function prototypes that\
    \ will be both recursive functions\nint computeFactorials ( int, int );\nint factorial\
    \ ( int );\n\n+   3. Below the prototype declarations, add a main function containing\
    \ a return statement\nint main()\n{\n    // Program code goes here.\n    return\
    \ 0;\n}\n\n+   4. After the main function, add the definition for the first function\
    \ prototype – a recursive function\nint computeFactorials(int num, int max)\n\
    {\n    cout << \"Factorial of \" << num << \":\";\n    cout << factorial( num\
    \ ) << endl; // Statements.\n    num++; // Incrementer.\n    if ( num > max )\
    \ return 0; // Exit...\n    else computeFactorials(num, max); // or call again."
