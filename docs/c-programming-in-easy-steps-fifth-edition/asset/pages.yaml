  md: '# Referencing data


    C++ “reference” is an alias for a variable or an object in a program. A reference
    must be initialized within its declaration, assigning the name of the variable
    or object to which it refers. From then on, the reference acts as an alternative
    for the item to which it refers – anything that happens to the reference is really
    implemented on the variable or object to which it refers.


    A reference declaration first states its data type, matching that of the item
    to which it will refer, suffixed by an & character denoting that variable will
    be a reference, and a chosen name. Finally, the declaration uses the = operator
    to associate a variable or object.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_200_0.png)


    Once a reference has been created, it will always refer to the item to which it
    was initialized – a different item cannot be assigned to that reference.


    Traditionally, a reference is named with the name of the associated variable or
    object, but with an uppercase first letter and the whole name prefixed by “r”.
    For example, a declaration to create a reference to an integer variable named
    “num” looks like this:


    ```

    int &rNum = num;

    ```


    Note that the purpose of the & reference operator is context-sensitive so that
    it declares a reference when used as an L-value, on the left side of the = operator,
    otherwise it returns a memory address when used as an R-value.


    A reference is such true alias to its associated item, that querying its memory
    address returns the address of its associated item – there is no way to discover
    the address of the reference itself.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_200_1.png)


    +   1. Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

    include <iostream>

    using namespace std;


    +   2. Add a main function containing a final return statement and declaring two
    variables – a'
