    The separate parts of the program code here can be examined individually to understand
    each part more clearly:


    +   **Preprocessor Directives** – these are processed by the compiler before the
    program code, so always appear at the start of the page. Here, the #include instructs
    the compiler to use the standard C++ input/output library named iostream, specifying
    the library name between < > brackets. The next line is the “using directive”
    that allows functions in the specified namespace to be used without their namespace
    prefix. Functions of the iostream namespace are within the `std` namespace – so
    using this directive allows functions such as `std::cout` and `std::endl` to be
    simply written as `cout` and `endl`.


    +   **Comments** – these should be used to make the code more easily understood
    by others, and by yourself when revisiting the code later. In C++, everything
    on a single line after // double-slash is ignored by the compiler.


    +   **Main function** – this is the mandatory entry point of every C++ program.
    Programs may contain many functions, but they must always contain one `main`,
    otherwise the compiler will not compile the program. Optionally, the parentheses
    after the function name specify a comma-separated list of “argument” values to
    be used by that function. Following execution, the function must return a value
    to the operating system of the data type specified in its declaration – in this
    case, an `int` (integer) value.


    +   **Statements** – these are the actions that the program will execute when
