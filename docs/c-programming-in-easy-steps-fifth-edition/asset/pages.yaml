  md: '# Predicting problems


    Despite the best efforts of the programmer, C++ programs may unfortunately contain
    one, or more, of these three types of bugs:


    +   - Syntax errors – the code contains incorrect use of the C++language. For
    example, an opening brace does not have a matching closing brace.


    +   - Logic errors – the code is syntactically correct, but attempts to perform
    an operation that is illegal. For example, the program may attempt to divide a
    number by zero, causing an error.


    +   - Exception errors – the program runs as expected until an exceptional condition
    is encountered that crashes the program. For example, the program may request
    a number, which the user enters in word form rather than in numeric form.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_168_0.png)


    The C++ standards allow the compiler to spot "compile-time" errors involving syntax
    and logic, but the possibility of exceptional errors is more difficult to locate
    as they only occur at “run-time”. This means the programmer must try to predict
    problems that may arise and prepare to handle these exceptional errors.


    The first step is to identify which part of the program code that may, under certain
    conditions, cause an exception error. This can then be surrounded by a “try” block,
    which uses the **try** keyword and encloses the suspect code within a pair of
    braces.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_168_1.png)


    Always consider that the user will perform the unexpected – then ensure your programs
    can handle those actions.


    When an exception error occurs, the **try** block then “throws” the exception
    out to a “catch” block, which immediately follows the **try** block. This uses
    the **catch** keyword and encloses statements to handle the exception error within
    a pair of braces.


    The program described below has a **try** block containing a loop that increments
    an integer. When the integer reaches five, a **throw()** function manually throws
    an exception to the **catch** block handler, passing the integer argument.'
