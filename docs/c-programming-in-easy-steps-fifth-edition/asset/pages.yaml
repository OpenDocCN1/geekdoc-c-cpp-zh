  md: '# Exploring compilation


    Whenever the C++ compiler runs, it first calls upon its preprocessor to seek any
    compiler directives that may be included in the source code. Each of these begin
    with the # hash character and will be implemented first to effectively modify
    the source code before it is assembled and compiled.


    Source Code (.cpp)


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_285_0.png)


    The changes made by compiler directives to the preprocessor create new temporary
    files that are not normally seen. It is these temporary files that are used to
    create a binary object file:


    +   - The first temporary file created during compilation expands the original
    source code by replacing its compiler directives with library code that implements
    those directives. This text file is named the source file, but with a .ii file
    extension.


    +   - The second temporary file created during compilation is a translation of
    the expanded .ii file into low-level Assembly language instructions. This text
    file is named the source file, but with a .s extension.


    +   - The third temporary file created during compilation is a translation of
    the temporary Assembly .s file into machine code. This binary object file is named
    like the source file, but with a .o file extension.


    So, the compilation process employs the Preprocessor to compile source code, an
    "Assembler" to translate this into machine code, and a Linker to convert one or
    more binary'
