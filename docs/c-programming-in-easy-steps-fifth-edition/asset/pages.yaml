  md: "# Providing capability classes\n\nClasses whose sole purpose is to allow other\
    \ classes to be derived from them are known as “capability classes” – they provide\
    \ capabilities to the derived classes.\n\nCapability classes generally contain\
    \ no data, but merely declare a number of virtual methods that can be overridden\
    \ in their derived classes.\n\nThe following example builds upon the previous\
    \ example to demonstrate how the “Bird” class can be better written as a capability\
    \ class. Its methods no longer contain output statements, but return a -1 (error)\
    \ value if they are called explicitly.\n\nIt is necessary to change the return\
    \ type of those methods from void to int and these changes must also be reflected\
    \ in each overriding method in the derived classes.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_262_0.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use `#include <iostream> using namespace std;\n\n\
    +   2. Declare a base class named “Bird”, containing two virtual method declarations\
    \ that will signal an error if called explicitly\nclass Bird\n{\n  public:\n \
    \   virtual int Talk() const { return -1 };\n    virtual int Fly() const { return\
    \ -1 };\n}\n\n+   3. Declare a derived class named \"Pigeon\", containing two\
    \ methods to override those in the base class\nclass Pigeon : public Bird\n{\n\
    \  public:\n  int Talk() const\n    cout << \"Cool! Coo!\" << endl; return 0;\n\
    \n  int Fly() const\n    cout << \"A pigeon flies away...\" << endl; return 0;\n\
    }"
  merge: -1
  pgno: 262
- img_proc: true
  md: "![](img/7b77dfe98ba5541875fec43413b9f6e4_263_0.png)\n\nThe return value of\
    \ overriding methods in derived classes must match those declared in the base\
    \ class.\n\n# Declare a derived class named “Chicken” containing two methods to\
    \ override in the base class\n\n```\nclass Chicken : public Bird\n{\n    public\
    \ :\n    int Talk()const\n    { cout << \"Cluck! Cluck!\" << endl; return 0; }\n\
    \n    int Fly()const\n    { cout << \"I'm just a chicken - I can't fly!\" << endl;\
