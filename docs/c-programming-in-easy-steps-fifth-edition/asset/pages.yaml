  md: '# Assigning values


    The operators that are used in C++ programming to assign values are listed in
    the table below. All except the simple = assignment operator are a shorthand form
    of a longer expression so each equivalent is given for clarity:


    | Operator | Example: | Equivalent: |

    |---|---|--|

    | = | a = b | a = b |

    | += | a += b | a = (a + b) |

    | -= | a -= b | a = (a - b) |

    | *= | a *= b | a = (a * b) |

    | /= | a /= b | a = (a / b) |

    | %= | a %= b | a = (a % b) |


    In the example above, the variable "a" is assigned the value that is contained
    in the variable named "b" – so that becomes the new value stored in a variable.


    The += operator is useful to add a value onto an existing value that is stored
    in the a variable.


    In the table example, the += operator first adds the value contained in variable
    a to the value contained in variable b. It assigns the result to become the new
    value stored in variable a.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_49_0.png)


    It is important to regard the = operator to mean "assign" rather than "equals"
    to avoid confusion with the == equality operator.


    All the other operators work in the same way by making the arithmetical operation
    between the two values first, then assigning the result of that operation to the
    first variable – to become its new stored value.


    With the %= operator, the first operand a is divided by the second operand b,
    and then the remainder of that operation is assigned to the a variable.


    Each assignment operation is demonstrated in the program below.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_49_1.png)'
