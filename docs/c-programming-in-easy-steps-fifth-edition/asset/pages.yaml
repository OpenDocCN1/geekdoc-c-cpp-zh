  md: '# # Deploying the application


    Having tested the app in a Mobile Emulator above, it can now be tested on a real
    device before deployment:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_349_0.png)


    +   On a Windows 10 device select Developer mode from the Settings, Update & Security,
    For developers menu


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_349_1.png)


    +   Next, connect the device to your PC via a USB socket


    +   On the Visual Studio toolbar, select Debug for ARM architecture and Device
    options, then click the Start button to run the app on the connected device


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_349_2.png)


    +   Wait while the application gets built and loaded, then tap the buttons to
    try out their functionality'
  merge: -1
