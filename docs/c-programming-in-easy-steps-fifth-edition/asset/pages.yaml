  md: '# Adjusting the interface


    The app test for mobile devices above failed to satisfactorily present the controls,
    as the interface is too wide for small screen devices. Happily, the interface
    can be made to adapt to different screen sizes so it can also look good on mobile
    devices. The adaptation relies upon recognizing the screen size and changing the
    orientation of a <StackPanel> element in XAML for narrow screen devices:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_345_0.png)


    +   Open MainPage.xml, then in XAML view add these elements immediately below
    the opening <Grid> element and before the component <VisualStateManager.VisualStateGroups>

    <VisualStateGroup>

    <!-- Elements to be inserted here (Steps 2-3) -->


    ```

    <VisualStateGroup>

    <VisualStateManager.VisualStateGroups>

    ```


    +   Next, insert elements to recognize wide screens

    <VisualState x:Name = "wideState">

    <VisualState.StateTriggers>

    <AdaptiveTrigger MinWindowWidth="641" />

    </VisualState.StateTriggers>

    </VisualState>


    +   Next, insert elements to recognize narrow screens and to change the Orientation
    of the outer <StackPanel>

    <VisualState x:Name = "narrowState">

    <VisualState.StateTriggers>

    <AdaptiveTrigger MinWindowWidth="0" />

    </VisualState.StateTriggers>

    <VisualState.Setters>

    <Setter

    Target = "MainStack.Orientation" Value = "Vertical" />

    </VisualState.Setters>

    </VisualState>


    The beginning of the MainPage.xml file should now look similar to the screenshot
    below:'
  merge: -1
  pgno: 345
- img_proc: true
  md: "XAML code recognizes the same <<!-- --> comment tags that are used in HTML\
    \ code.\n\nRemember that the outer <StackPanel> in this app contains an <Image>\
    \ and a nested <StackPanel> displayed horizontally, side-by-side. If displayed\
    \ vertically, they should appear one over the other.\n\n```\n<Grid Background=\"\
    ThemeResource ApplicationPageBackgroundThemeBrush\">\n  <VisualStateManager.VisualStateGroups>\n\
    \    <VisualStateGroup>\n      <VisualState Name=\"WideState\">\n        <VisualState.TargetState>\n\
    \          <Setter Target=\"Grid.Width\" Value=\"641\" />\n        </VisualState.TargetState>\n\
    \      </VisualState>\n      <VisualState Name=\"NarrowState\">\n        <VisualState.TargetState>\n\
    \          <Setter Target=\"StackPanel.Orientation\" Value=\"Vertical\" />\n \
    \       </VisualState.TargetState>\n      </VisualState>\n    </VisualStateGroup>\n\
    \  </VisualStateManager.VisualStateGroups>\n</VisualStateManager.VisualGroups>\n\
    ```\n\nSelect **x64** and **Local Machine** to run the app for a PC device once\
    \ more – it still looks and functions well\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_346_0.png)\n\
    \nNow select **x86** and **Mobile Emulator** to run the app for a mobile device\
    \ – it also now looks and functions well"
