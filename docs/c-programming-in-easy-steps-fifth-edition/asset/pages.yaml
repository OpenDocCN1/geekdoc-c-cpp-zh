  md: '# C++ Programming Essentials


    Keywords:


    | auto | break | case | catch | delete |

    | char | class | const | continue | default |

    | do | double | else | enum | float |

    | for | friend | goto | if | long |

    | mutable | new | operator | private | public |

    | register | short | signed | sizeof | static |

    | struct | switch | template | this | typedef |

    | union | unsigned | virtual | void | volatile | while |


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_354_0.png)


    Data Types:


    | char | A single character |

    | int | An integer number |

    | float | A floating-point number, correct to six decimal places |

    | double | A floating-point number, correct to ten decimal places |

    | bool | A Boolean value of TRUE (1) or FALSE (0) |

    | string | A string of characters |


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_354_1.png)


    Library Classes:


    | <iostream> | Reads and writes to the console |

    | <fstream> | Reads and writes to a file |

    | <string> | Stores and manipulates text strings |

    | <sstream> | Converts strings to other data types |

    | <vector> | Stores and manipulates data in vector array elements |

    | <stdexcept> | Reports logic errors and runtime errors |

    | <ctime> | Reports the date and time |


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_354_2.png)'
