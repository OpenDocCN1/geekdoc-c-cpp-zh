  md: "# Adding runtime function\n\nHaving completed the application component layout\
    \ with XAML elements above, you are ready to add functionality with C++ programming\
    \ code:\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_336_0.png)\n\nUniversal\n\n\
    +   1. In Design view, double-click on the BnPick button\n\n+   2. In the MainPage.xaml.cpp\
    \ code-behind page opens in the Code Editor at a generated BnPick_Click event-handler\n\
    \n+   3. In the BnPick_Click event-handler block, insert these statements to create\
    \ a randomized array of integers between 1 and 59\n```cpp\n i, j, k, seq[60];\n\
    rand((int) time(0));\n\nfor (i = 1; i < 60; i++) seq[i] = i;\nfor (i = 1; i <\
    \ 60; i++)\n{\n j = (int) rand() % 59 + 1;\n k = seq[i]; seq[i] = seq[j]; seq[j]\
    \ = k;\n// Statements to be inserted here (Steps 4-5).\n```\n\n+   4. Next, insert\
    \ statements to assign array element values to the <TextBlock> components\ntextBlock1->Text\
    \ = seq[1].ToString();\ntextBlock2->Text = seq[2].ToString();\ntextBlock3->Text\
    \ = seq[3].ToString();\ntextBlock4->Text = seq[4].ToString();\ntextBlock5->Text\
    \ = seq[5].ToString();\ntextBlock6->Text = seq[6].ToString();\n\n+   5. Next,\
    \ insert statements to set the <Button> states\nBtnPick->IsEnabled = false;\n\
    BtnReset->IsEnabled = true;\n\n+   6. Return to MainPage.xaml, then in Design\
    \ view, double-click on the BtnReset button\n\n+   7. In the MainPage.xaml.cpp\
    \ code-behind page opens in the Code Editor at a generated BnReset_Click event-handler"
