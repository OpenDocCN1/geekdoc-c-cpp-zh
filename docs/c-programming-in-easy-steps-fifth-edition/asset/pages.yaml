  md: '# Getting values with pointers


    Pointers are a useful part of efficient C++ programming – they are simply variables
    that store the memory address of other variables.


    Pointers are declared in the same way that other variables are declared, but the
    data type is suffixed by a “*” character. This denotes, in a declaration, that
    the variable will be a pointer. Always remember that the pointer’s data type must
    match that of the variable to which it points.


    A pointer variable is initialized by assigning it the memory address of another
    variable, using the & & reference operator. The assignment can be made either
    in the declaration statement, or in a separate statement after the declaration.
    Referencing a pointer variable by its name alone will simply reveal the memory
    address that it contains.


    After a pointer variable has been initialized, either in the declaration or by
    a subsequent assignment, it “points” to the variable at the address which it contains.
    Usefully, this means the value of the variable to which it points can be referenced
    by prefixing the pointer with a * dereference operator:


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_187_0.png)


    +   Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

    include <iostream>

    using namespace std;


    +   Add a main function containing a final return statement and declaring two
    initialized integer variables

    int main()

    {

    int a = 8,b = 16;

    // Add more statements here.

    return 0;

    }


    +   In the main function, insert a statement to declare, and initialize a pointer
    with the memory address of the first integer variable

    int*aPtr = &a; // aPtr assigned address of a.


    +   Insert a statement to declare a second pointer, then initialize it with the
    address of the second integer variable

    int*bPtr; // bPtr declared.'
