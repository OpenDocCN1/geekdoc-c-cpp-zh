    Any real-world object can be defined by its attributes and by its actions. For\
    \ example, a dog has attributes such as age, weight, and actions it can perform\
    \ such as bark. class mechanism in C++ provides a way to create a virtual dog\
    \ object within a program, where the variable members of a class can represent\
    \ its attributes, and the methods represent its actions:\n\n```\nclass Dog\n{\n\
