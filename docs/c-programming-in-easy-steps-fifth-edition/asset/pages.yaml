  md: '# Overloading functions


    Function “overloading” allows functions of the same name to happily co-exist in
    the same program, providing their arguments differ in number, data type, or both
    number and data type. The compiler matches a function call to the correct version
    of the function by recognizing its argument number and data types – a process
    known as “function resolution”.

    It is useful to create overloaded functions when the tasks they are to perform
    are similar, yet subtly different.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_104_0.png)


