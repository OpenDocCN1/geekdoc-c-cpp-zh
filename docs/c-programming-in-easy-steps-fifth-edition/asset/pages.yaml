    +   XAML and C++ files for the MainPage – here is where you will create interface
    components and functional code


    +   Other miscellaneous Package files


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_321_1.png)


    In Windows 10, you should ensure that the Developer Mode option is enabled in
