  md: '# Setting precedence


    Operator precedence determines the order in which C++ evaluates expressions. For
    example, in the expression a = 6 + 8 * 3, the order of precedence determines that
    multiplication is completed.


    The table below lists operator precedence in descending order – those on the top
    row have highest precedence, those on lower rows have successively lower precedence.
    The order in which C++ evaluates multiple operators of equal precedence is determined
    by “operator associativity” – grouping operands with the one on the left (LTR)
    or on the right (RTL).


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_69_0.png)


    * multiply operator is on a higher row than the + addition operator – so in the
    expression a=6+8*3, multiplication is completed first, before the addition.


    | Operator | () Function call | [] Array index | Direction |

    |---|---|---||

    | -> Class pointer | . Class member | LTR |

    | ! Logical NOT | * Pointer | |

    | -- Decrement | ++ Increment | |

    | + Positive sign | - Negative sign | RTL |

    | sizeof of | & Address of | |

    | * Multiply | / Divide | LTR |

    | % Modulus | | |

    | + Add | - Subtract | LTR |

    | <= Less or equal | < Less than | LTR |

    | >= Greater or | > Greater than | LTR |

    | == Equality | !== Inequality | LTR |

    | && Logical AND | | LTR |

    | || Logical OR | | LTR |

    | ? Ternary | | RTL |'
