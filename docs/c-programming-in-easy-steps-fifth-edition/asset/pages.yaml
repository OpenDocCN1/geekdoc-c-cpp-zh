    a namespace prefix to

    #include <iostream>

    using namespace std;


    +   2. Declare a class named “Parent”, which will be a base class

    class Parent

    {\ // Class members go here

    }


    +   3. Between the braces of the Parent class declaration, insert a public access
    specifier and add a default constructor to output text – identifying when it has
    been called

    public:

    Parent()

    { cout << "Default Parent constructor called."; }


    +   4. Add an overloaded constructor, which takes a single integer argument, and
    also outputs identifying text

    Parent (int a)

    { cout << endl << "Overloaded Parent constructor called."; }


    +   5. After the Parent class, declare a derived “Daughter” class

    class Daughter : public Parent

    {

    };'
