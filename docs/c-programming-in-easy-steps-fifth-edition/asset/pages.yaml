  md: '# Creating string variables


    Unlike the char, int, float, double, and bool data types, there is no native "string"
    data type in C++ – but its <string> library class provides a string object that
    emulates a string data type. To make this available to a program, the library
    must be added with an #include <string> directive at the start of the program.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_115_0.png)


    With the <iostream> class library, the <string> library is part of the std namespace
    that is used by the C++ standard library classes. This means that a string object
    can be referred to as std::string, or more simply as string when using a namespace
    std; directive is included at the start of the program.


    Once the <string> library is made available, a string "variable" can be declared
    in the same way as other variables. The declaration may optionally initialize
    the variable using the = assignment operator, or it may be initialized later in
    the program.


    Additionally, a string variable may be initialized by including a text string
    in parentheses.


    Text strings in C++ must always be enclosed within " double quote characters –
    ‘ ’ single quotes are only used to surround character values of the char data
    type.


    A C++ string is much easier to work with than the char arrays which programmers
    must use, as it automatically resizes to accommodate the length of any string.
    At a lower level, the text is still stored as a character array, but the string
    variable lets you ignore those details. Consequently, a character array can be
    assigned to a string variable using the = assignment operator.


    It is important to remember that when numeric values are assigned to a string
    variable, they are no longer a numeric data type, so arithmetic cannot be performed
    on them. For example, attempting to add string values of "7" and "6" with the
    + operator produces the concatenated string "76", not the numerical value of 13.
    In this case, the + operator recognizes the context is not arithmetic, so adopts
    the guise of "concatenation operator" to unite two strings. The += operator app
    a string to another string and is useful to build long strings of text.'
