  md: '# Initializing class members


    Class variable members can be initialized by a special “constructor” method that
    is called whenever an instance of the class is created. The constructor method
    is always named exactly as the name, and requires arguments to set the initial
    value of class variables.


    When a constructor method is declared, an associated “destructor” method should
    also be declared – that is called whenever an instance of the class is destroyed.
    The destructor method is always named as the class name, prefixed by a ~ tilde
    character.


    Constructor and destructor methods have no return value, and are called automatically
    – they cannot be called explicitly.


    Values to initialize class variables are passed to the constructor method in the
    statement creating an object, in parentheses following the object name.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_227_0.png)


