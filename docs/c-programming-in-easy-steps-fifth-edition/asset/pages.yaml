    \ to using an #include directive to reference a standard C++ library.\n\nIsolating\
    \ class structures in separate “modular” files has the advantage of improving\
    \ portability, and makes code maintenance easier by clearly identifying the purpose\
    \ of each file.\n\nTo have the compiler combine all source code files into a single,\
    \ executable file it is only necessary to explicitly specify the .cpp files in\
    \ the compiler command – an #include directive ensures the header file will also\
    \ be recognized.\n\nFor example, with the statement #include “ops.h” in both ops.cpp\
    \ and sum.cpp command to compile the example described below not specify the ops.h\
    \ header in the compiler command, but is just c++ ops.cpp sum.cpp -o sum.exe.\n\
