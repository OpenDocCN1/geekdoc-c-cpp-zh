  md: "# Understanding data storage\n\nIn order to understand C++ pointers it is helpful\
    \ to understand how data is stored on your computer. Envision the computer's memory\
    \ as a very long row of sequentially numbered slots, which each can contain one\
    \ byte of data. When a variable is declared in a program, the machine reserves\
    \ a number of slots at which store data assigned to that variable. The number\
    \ of slots it reserves depends on the variable's data type. When the program uses\
    \ the variable name to retrieve stored data, it actually retrieves the number\
    \ of the variable's first slot.\n\nComparison can be drawn to a long row of sequentially-numbered\
    \ houses that can each accommodate a different family. Any family can be explicitly\
    \ referenced by addressing the house number.\n\nThe slot (house) numbers in memory\
    \ are expressed in hexadecimal format and can be revealed by the & reference operator.\n\
    \n![](img/7b77dfe98ba5541875fec43413b9f6e4_183_0.png)\n\n+   Start a new program\
    \ by specifying the C++ library classes to include, and a namespace prefix to\
    \ use\n#include <string>\n#include <iostream>\nusing namespace std;\n\n+   Add\
    \ a main function containing a final return statement and declaring three initialized\
    \ variables\nint main() {\n  int num = 100;\n  double sum = 0.0123456789;\n  string\
    \ text = \"C++ Fun\";\n  // Add more statements here.\n  return 0;\n}\n\n+   In\
    \ the main function, insert statements to output the memory address of the first\
    \ slot of each variable\ncout << \"Integer variable starts at: \" << &num << endl;\n\
    cout << \"Double variable starts at: \" << &sum << endl;\ncout << \"String variable\
    \ starts at: \" << &text << endl;\n\n+   Save, compile, and run the program to\
    \ see the three memory addresses"
