  md: '# Declaring functions


    Functions enclose a section of code that provides specific functionality to the
    program. When a function is called from the main program, its statements are executed
    and, optionally, a value can be returned to the main program upon completion.
    There are three main benefits to using functions:


    +   - Functions make program code easier to understand and maintain.

    - Tried and tested functions can be re-used by other programs.

    - Several programmers can divide the workload in large projects by working on
    different functions of the program.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_96_0.png)


    # Declaring functions


    Each function is declared early in the program code as a “prototype”, comprising
    a data type for the value it will return and the function name followed by parentheses,
    which may optionally contain a list of “argument” data types of passed values
    it may use. The syntax of a function prototype declaration looks like this:


    ```

    return-data-type function-name ( arguments-data-type-list ) ;

    ```


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_96_1.png)


    Strictly speaking, the arguments in a function prototype are known as its “formal
    parameters”.


    For example, a function named “computeArea” that returns a float value and is
    passed float arguments is declared as:


    ```

    float computeArea(float, float ) ;

    ```


    # Defining functions


    The function definition appears later in the program code and comprises a repeat
    of the prototype, plus the actual function body. The function body is the statements
    to be executed whenever the function is called, contained within a pair of braces.'
