  md: "# Getting string input\n\nC++ cin function, which was introduced in the last\
    \ chapter to input numeric values, can also assign text input to string variables.\
    \ This has a limitation, as it can only be used to input a single word at a time\
    \ – the cin function stops reading the input when it encounters a space, leaving\
    \ any other text in the “input buffer”.\n\nWhen you want to allow the user to\
    \ input a string with spaces, such as a sentence, the getline() function can be\
    \ used. This function requires two arguments to specify the source and destination\
    \ of the string. For example, where the cin function is the source, and a string\
    \ variable named “str” is the destination:\n\n```\ngetline(cin, str);\n```\n\n\
