  md: "# Branching with if\n\nThe C++ if keyword performs the basic conditional test\
    \ that evaluates a given expression for a Boolean value of true or false – and\
    \ its syntax looks like this:\n\n```\nif ( test-expression ) { statements-to-execute-when-true\
    \ }\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_80_0.png)\n\nThe braces following\
    \ the test may contain one or more statements, each terminated by a semi-colon;\
    \ but these will only be executed when the expression is found to be true. When\
    \ the test is found to be false, the program proceeds to its next task.\n\nOptionally,\
    \ an if statement can offer alternative statements to execute when the test fails\
    \ by appending an else statement block after the if statement block, like this:\n\
    \n```\nif ( test-expression ) { statements-to-execute-when-true }\nelse { statements-to-execute-when-false\
    \ }\n```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_80_1.png)\n\nWhere there\
    \ is only one statement to execute when the test succeeds, the braces may be omitted\
    \ – but retaining them aids code clarity.\n\nTo test two conditions, the test\
    \ expression may use the && operator. For example, if (( num > 5) && ( letter\
    \ == 'A') ). Alternatively, an if statement can be \"nested\" within another if\
    \ statement, so those statements in the inner statement block will only be executed\
    \ when both tests succeed – but statements in the outer statement block will be\
    \ executed if the outer test succeeds.\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_80_2.png)\n\
    \n+   1. Start a new program by specifying the C++ library classes to include,\
    \ and a namespace prefix to use\n   #include <iostream>"
