  md: '# Recognizing exceptions


    When a program exception occurs within a try block, an “exception” object is automatically
    thrown. A reference to the exception can be passed to the associated catch block
    in the parentheses after the catch keyword. This specifies the argument to be
    an exception type, and a chosen exception name prefixed by the & reference operator.
    For example, exception&error.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_172_0.png)


