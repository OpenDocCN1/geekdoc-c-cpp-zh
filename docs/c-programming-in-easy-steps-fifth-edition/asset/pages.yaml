  md: "# Encapsulating data\n\nA class is a data structure that can contain both variables\
    \ and functions in a single entity. These are collectively known as “members”,\
    \ and the functions are known as its “methods”.\\Access to class members from\
    \ outside the class is controlled by “access specifiers” in the class declaration.\
    \ Typically, these will deny access to the variable members, but allow access\
    \ to methods that can store and retrieve data from those variable members. This\
    \ technique of “data hiding” ensures that stored data is safely encapsulated within\
    \ the class variable members, and is the first principle of Object Oriented Programming\
    \ (OOP).\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_215_0.png)\n\nA class declaration\
    \ begins with the class keyword, followed by a space, then a programmer-specified\
    \ name – adhering to the usual C++ naming conventions, but beginning in uppercase.\
    \ Next, come the access specifiers and class members, contained within a pair\
    \ of braces. Every class declaration must end with a semicolon after the closing\
    \ brace – so the class declaration syntax looks like this:\n\nclass ClassName\n\
    \n```\n{\n  access specifier :\n    member1;\n    member2;\n  access specifier\
    \ :\n    member3;\n    member4;\n}\n```\n\nAn access specifier may be any one\
    \ of the keywords public, private, or protected to specify access rights for its\
    \ listed members:\n\n+   * Public members are accessible from any place where\
    \ the class is visible\n* Private members are accessible only to other members\
    \ of the same class\n* Protected members are accessible only to other members\
    \ of the same class and to members of classes derived from that class\n\nBy default,\
    \ all class members have private access – so any members that appear in the class\
    \ declaration without an access specifier will have private access."
