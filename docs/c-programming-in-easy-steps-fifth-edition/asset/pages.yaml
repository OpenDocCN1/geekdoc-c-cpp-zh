    ```\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_216_1.png)\n\nWhile a program\
    \ class cannot perfectly emulate a real-word object, the aim is to encapsulate\
    \ all relevant attributes and actions.\n\nIt is important to recognize that a\
    \ class declaration only defines a data structure – in order to create an object\
    \ you must declare an “instance” of that data structure. This is achieved in the\
    \ same way that instances are declared of regular C++ data types:\n\n```\nint\
    \ num; // Creates an instance named \"num\".\n// of the regular C++ int data type.\n\
    ```\n\n```\nDog fido; // Creates an instance named \"fido\".\n// of the programmer-defined\
    \ Dog data structure.\n```\n\nAlternatively, an instance object can be created\
    \ by specifying its name between the class declaration’s closing brace and its\
    \ final semicolon. Multiple instances can be created this way, by specifying a\
    \ comma-separated list of object names. For example, the class declaration listed\
    \ below creates four instance objects of the Dog class named “fido”, “peach”,\
    \ “rex”, and “sammy”.\n\n```\nclass Dog\n{\n```"
