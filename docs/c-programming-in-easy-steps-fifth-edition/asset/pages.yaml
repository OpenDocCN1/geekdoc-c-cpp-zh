  md: '# Calling base constructors


    Although derived classes inherit the members of their parent base class, they
    do not inherit its constructor and destructor. However, it should be noted that
    the default constructor of the base class is always called when a new object of
    a derived class is created – and the base destructor is called when the object
    gets destroyed. These calls are made in addition to those made to the constructor
    and destructor methods of the derived class.


    The default constructor of the base class has no arguments – but that class may
    also have overloaded constructors which do. If you prefer to call an overloaded
    constructor of the base class when a new object of a derived class is created,
    you can create a matching overloaded constructor in the derived class – having
    the same number and type of arguments.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_239_0.png)


    basecon.cpp


