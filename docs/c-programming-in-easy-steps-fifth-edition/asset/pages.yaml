  md: '# Appending to a file


    When a filestream object is created, the parentheses following its chosen name
    can optionally contain additional arguments, specifying a range of file “modes”
    to control the behavior of that filestream object. These file modes are part of
    the ios namespace, so must be explicitly addressed using that prefix. Each file
    mode is listed in the table below, together with a behavior description:


    | Mode | Behavior |

    | --- | --- |

    | ios::out | Open a file to write |

    | ios::in | Open a file to read input |

    | ios::app | Open a file to append output at the end of any existing content |

    | ios::trunc | Truncate the existing file (default behavior) |

    | ios::ate | Open a file without truncating and allow data to be written anywhere
    in the file |

    | ios::binary | Treat the file as binary format rather than text so the data may
    be stored in non-format |


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_152_0.png)


    The preprocessor directive using namespace std; allows the std namespace prefix
    to be omitted – so cout refers to the std::cout function. The ios namespace exists
    within the std namespace – so the files can be explicitly addressed using both
    namespace prefixes, for example std::ios::out.


    Multiple modes may be specified if they are separated by a “|” pipe character.
    For example, the syntax of a statement to open a file for binary output looks
    like this:


    ```

    ofstream object-name ("file-name", ios::out|ios::binary);

    ```


    The default behavior when no modes are specified regards the file as a text file
    that will be truncated after writing.


    The most commonly specified mode is ios::app, which ensures existing content will
    be appended, rather than overwritten, when new output is written to the nominated
    file.


    The program described below appends data to the text file created in the previous
    example.'
