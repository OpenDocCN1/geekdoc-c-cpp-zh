    \ This returns true (1) when both strings precisely match, otherwise it returns\
    \ false (0).\n\nAlternatively, the <string> library's compare() function can be\
    \ used to compare a string value as its argument. Unlike the == comparison, the\
    \ compare() function returns zero when the strings are identical, by examining\
    \ the string value's combined ASCII code values. When the string argument totals\
