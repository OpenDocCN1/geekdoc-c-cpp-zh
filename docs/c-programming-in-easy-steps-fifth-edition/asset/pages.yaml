    to the first prototype

    float computeArea( float, float )

    float computeArea( char, float, float ) ;


    +   4. Below the prototype declarations, add a main function containing a final
    return statement

    int main())

    {

    // Program code goes here.

    return 0 ;

    }


    +   5. After the main function, define the first function that receives just one
    argument

    float computeArea(float diameter)

    {

    float radius = { diameter / 2 );

    return ( 3.141593 * ( radius * radius )

    }'
