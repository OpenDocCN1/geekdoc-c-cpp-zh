  md: '# Isolating class structures


    The source code for each example program in this book is generally contained in
    a single .cpp file to save space, but in reality OOP programs are often contained
    in three separate files:


    +   - Header .h file – contains only class declarations.


    +   - Implementation .cpp file – contains class definitions to implement the methods
    declared in the header file, which is referenced by an #include directive.


    +   - Client .cpp file – contains a main method that employs the class members
    declared in the header file, which is also referenced by an #include directive.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_274_0.png)


    The client file is sometimes referred to as a “driver” file.


    For example, a sum calculator program might comprise three files ops.h (a header
    file declaring operation classes), ops.cpp (an implementation file defining the
    operation methods), and sum.cpp (a client file calling the various operations).


    When compiling sum.cpp, the compiler incorporates the included header file and
    implementation file into the program. It first translates the header file and
    implementation file into a binary object file (ops.o), then it translates the
    header file and client file into a second binary object file (sum.o). Finally,
    the Linker combines both object files into a single executable file (sum.exe).


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_274_1.png)


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_274_2.png)'
