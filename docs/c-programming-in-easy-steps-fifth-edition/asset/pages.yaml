  md: '# Assessing logic


    The logical operators most commonly used in C++ programming are listed in the
    table below:


    | Operator | Operation |

    |---|---|

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    The logical operators are used with operands that have Boolean values of **true**
    or **false**, or are values that convert to **true** or **false**.


    The logical **&&** operator will evaluate two operands and return **true** only
    if both operands themselves are **true**. Otherwise, the **&&** operator will
    return **false**. This is used in conditional branching where the direction of
    a program is determined by testing two conditions – if both conditions are satisfied,
    the program will go in a certain direction, otherwise it will take a different
    direction.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_57_0.png)


    Where there is more than one operand each expression must be enclosed by parentheses.


    Unlike the **&&** AND operator that needs both operands to be **true**, the **||**
    OR operator will evaluate its two operands and return **true** if either one of
    the operands returns **true**. If neither returns **true** then the **||** operator
    will return **false**. This is useful in C++ programming to perform a certain
    action if one of two conditions has been met.


    The logical **!** NOT operator is a unary operator that is used before a single
    operand. It returns the inverse value of the given operand, so if the variable
    had a value of **true**, then **!a** would have a value of **false**. The **!**
    NOT operator is useful in C++ programs to toggle the value of a variable in successive
    loop iterations with a statement like **a = !a**. This ensures that on each pass
    the value is changed, like flicking a light switch on and off.'
