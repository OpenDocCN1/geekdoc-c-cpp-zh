  md: '# Inheriting class properties


    A C++ class can be created as a brand new class, like those in previous examples,
    or can be “derived” from an existing class. Importantly, a derived class inherits
    members of the parent (base) class from which it is derived – in addition to its
    own members.


    The ability to inherit members from a base class allows derived classes to be
    created that share certain common properties, which have been defined in the base
    class. For example, a “Polygon” base class may define width and height properties
    that are common to all polygons. Classes of “Rectangle” and Triangle could be
    derived from the Polygon class – inheriting width and height properties, in addition
    to their own members defining unique features.


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_235_0.png)


    The virtue of inheritance is extremely powerful and is the second principle of
