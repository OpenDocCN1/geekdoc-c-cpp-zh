    \    Bird* pChicken = new Chicken;\n};\n```\n\n# In the main method, insert method\
    \ calls and a statement to terminate the program when an error is met by explicitly\
    \ calling a base method\n\n```\npPigeon -> Talk();\npChicken -> Talk();\npPigeon\
    \ ->::Talk();\nif (-1) { cout << \"Error - Program ended.\" << endl; return 0;\
    \ }\n```\n\n```\npPigeon -> Fly(); // Call will not be made.\npChicken -> Fly();\
    \ // Call will not be made.\nreturn 0; // Statement will not be executed\n```\n\
    \nSave, compile, and run the program to see the output\n\n![](img/7b77dfe98ba5541875fec43413b9f6e4_263_1.png)"
