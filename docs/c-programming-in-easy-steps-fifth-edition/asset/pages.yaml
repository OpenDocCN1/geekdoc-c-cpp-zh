  md: '# Creating an object


    In order to assign and retrieve data from private members of a class, special
    public accessor methods must be added to the class. These are “setter” methods,
    to assign data, and “getter” methods, to retrieve data. Accessor methods are often
    named as the variable address, with the first letter made uppercase, and prefixed
    by “set” or “get”. For example, accessor methods to address an age variable may
    be named setAge() and age().


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_219_0.png)


    object.cpp


    +   1. Start a new program by specifying the C++ library classes to include, and
    a namespace prefix to use

    #include <string>

    #include <iostream>

    using namespace std;


    +   2. Declare a class named “Dog"

    class Dog

    {


    +   3. Between the braces of the Dog class declaration, declare three private
    variable members

    int age, weight;

    string color;


    +   4. After the private variables, add a public access specifier

    public:


    +   5. Begin the public members list by adding a method to output a string when
    called

    void bark() { cout << "WOOF!" << endl; }


    +   6. Add public setter methods – to assign individual values to each of the
    private variables

    void setAge(int yrs) { age = yrs; }

    void setWeight(int lbs) { weight = lbs; }

    void setColor(string hue) { color = hue; }


    +   7. Add public getter methods – to retrieve individual values from each of
    the private variables

    int getAge() { return age; }

    int getWeight() { return weight; }

    string getColor() { return color; }'
