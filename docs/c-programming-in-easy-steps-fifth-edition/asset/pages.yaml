  md: '# Examining conditions


    Possibly the C++ programmer''s most favorite operator is the ?: "ternary" operator.
    This operator first evaluates an expression for a true or false condition, returns
    one of two specified values depending on the result of the evaluation. For this
    reason it is also known as the "conditional" operator.


    The ?: ternary operator has this syntax:


    ```

    ( test-expression ) ?: if-true-return-this : if-false-return-this ;

    ```


    Although the ternary operator can initially appear a little confusing, it is well
    worth becoming familiar with it as it can execute powerful program branching with
    minimal code. For example, when a variable is not a value of:


    ```

    var i = 1 ?: if-true-do-this : if-false-do-this ;

    ```


    The ternary operator is commonly used in C++ programming to assign the maximum
    or minimum value of two variables to a third variable. For example, to assign
    a minimum like this:


    ```

    c = (a < b) ? a : b ;

    ```


    The expression in parentheses returns true when the value of variable a is less
    than that of b – so in this case, the lesser value of variable a gets assigned
    to c.


    Similarly, replacing the < less than operator in the test expression with the
    > greater than operator would assign the greater value of variable b to variable
    c.


    Another common use of the ternary operator incorporates the % modulus operator
    in the test expression to determine whether the value of a variable is an odd
    number or an even number:


    ```

    ( var x % 2 != 0) ?: if-true(odd)-do-this : if-false(even)-do-this ;

    ```


    ![](img/7b77dfe98ba5541875fec43413b9f6e4_61_0.png)


    The ternary operator has three operands – the one before the ?, and those before
    and after the :


    Where the result of dividing the variable value by two does leave a remainder,
    the number odd – where there is no remainder, the number is even. The test expression
    (var % 2 == 1) would have the same effect but it is preferable to test for inequality
    – it''s easier to spot something is different than when it''s identical.


    The ternary operator is demonstrated in the program below.'
