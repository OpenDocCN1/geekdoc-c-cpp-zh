  md: 'ASP.NET Core 2.0 Razor Pages for Beginners


    # 20. The Video View


    # Introduction


    In this chapter, you will create the Video view and two partial views called _VideoComing-UpPartial
    and _VideoPlayerPartial. You will also reuse the already created _InstructorBio-Partial
    view. The content will be styled with CSS and Bootstrap as you add it. The Video
    view is displayed when the user clicks one of the video links in the Course view,
    a video player, information about the selected video, buttons to select the next
    and previous video, and it contains a button that takes the user back to the Course
    view, the instructor''s bio.


    Technologies Used in This Chapter


    +   - HTML – To create the view''s layout.

    - CSS – To style the view.

    - Razor – To use C# in the view.

    - JavaScript – To display the video player and load the selected video.


    # Overview


    Your task is to use the view model in the Video action and render a view that
    displays a course image, video duration, title, and description as a separate
    column, on a new row, below the Back to Course button at the top of the video.
    Beside the video player column, a second column should be added. The upper part
    should contain the _VideoComingUp-Partial partial view, and the lower part the
    _InstructorBioPartial partial view.


    In this exercise, the JWPlayer video player is used, but you can use any video
    player you like that can play YouTube videos.'
