  md: 'ASP.NET Core 2 MVC & Razor Pages for Beginners


    # 8. Front-End Frameworks


    In this chapter, you will learn how to install front-end libraries using Bower.
    The two types of libraries you will install are for styling and client-side validation.


    **Bootstrap**: This is the most popular library for styling and responsive design.
    You will use some Bootstrap CSS classes to style the video list and the navigation
    links. You can find out more about Bootstrap on their site: http://getBootstrap.com.


    **JQuery**: You will use jQuery and jQuery Validation to perform client-side validation.
    This will make sure that the user input is conforming to the validation rules
    before the data is sent to the server action. Some validation rules are added
    by the framework; others you have added yourself to the entity and view model
    classes as attributes. Examples of validation rules are: password restrictions
    set by the framework (can be changed), and the **Required, MaxLength, and DataType**
    attributes.


    # Installing Bower and the Frameworks


    Bower is the preferred way to install front-end frameworks in ASP.NET Core 2.0.
    When the libraries have been installed, they must be referenced from the _Layout
    view for global access, or in individual views for local access. You can use the
    environment tag to specify the environment the libraries should be accessible
    from. You usually want the un-minified libraries in the **Development** environment
    for easy debugging, and the minified versions in the **Staging** and **Production**
    environments for faster load times.


    Many times, you can achieve faster load times by use Content Delivery Networks
    (CDNs), servers that have cached versions of the libraries that can be called.
    You can find information about the Microsoft''s CDNs at: https://docs.microsoft.com/en-us/aspnet/ajax/cdn/overview.


    Four attributes are used to check that the JavaScript libraries have been installed:
    **asp-fallback-test-class**, **asp-fallback-test-property**, **asp-fallback-test-value**,
    and **asp-fallback-test**.


    Two of the attributes are used to load an alternative source if the JavaScript
    libraries haven''t been installed: **asp-fallback-src** and **asp-fallback-href**.'
