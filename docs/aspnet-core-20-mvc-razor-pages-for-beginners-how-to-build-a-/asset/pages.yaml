  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    The RegisterUserModelPage Class


    The RegisterUserModel class is used in the Create Razor Page for the AspnetUsers
    table. The class should contain string properties called Email, Password, and
    Confirm-Password. The properties should be decorated with attributes that help
    with client-side validation.


    The Email and Password properties should be decorated with the [Required] attribute.


    The Email property should also be decorated with the [EmailAddress] attribute.


    The Password property should also be formatted as a password and have a maximum
    length of 100 characters.


    The ConfirmPassword property should be formatted as a password and compared to
    the content in the Password property using the [Compare] attribute.


    +   1. Add a class called RegisterUserModel to the Models folder.

    2. Add an Email (string) property decorated with [Required] and [EmailAddress]

    [Required]

    [EmailAddress]

    public string Email { get; set; }

    3. Add a Password (string) property decorated with [Required], [StringLength],
    and [DataType] attributes.

    [Required]

    [StringLength(100, ErrorMessage = "The {0} must be at least {2} and at max {1}
    characters long.", MinimumLength = 6)]

    [DataType(DataType.Password)]

    public string Password { get; set; }

    4. Add a ConfirmPassword (string) property decorated with [Display], [Compare],
    and [DataType] attributes.

