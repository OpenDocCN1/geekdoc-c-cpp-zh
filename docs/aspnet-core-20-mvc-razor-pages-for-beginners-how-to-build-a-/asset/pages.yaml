  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    Below is a list of commonly used data annotations.


    | Name | Purpose |

    | MinLength / MaxLength | Enforces length of strings |

    | Range | Enforces min and max for numbers |

    | RegularExpression | Makes a match pattern |

    | Display | Sets the label text for a property |

    | DataType | Determines how the output control will be rendered in the browser,
    for instance password or email |

    | Required | The model value is mandatory |

    | Compare | Compares the values of two input controls, often used for password
    validation |


    # Preparing the Create View for Validation


    To validate the annotations in the browser, the view must be altered to display
    possible errors. You can do this by adding a <span> or a <div> element decorated
    with the `asp-validation-for` Tag Helper, specifying which property it displays
    errors for. You can also add a validation summary that displays all errors as
    an unordered list inside a <div> element decorated with the `asp-validation-summary`
    Tag Helper.


    # Adding Validation to the Create View


    Let''s add both types of validation to the **Create** view to see what it looks
    like.


    +   1. Open the **Create** view.

    2. Add a validation <div> at the top of the form.

    `<form asp-action="Create" method="post"><div asp-validation-summary="All"></div>`

    3. Add validation to the **Title** property. Add a <span> decorated with the `asp-validation-for`
    Tag Helper inside a <td> element below the **Title** <input>.

    <td><td><span> asp-validation-for="Title"></span></td></td>

    4. Repeat step 3 for the **Genre** property.'
