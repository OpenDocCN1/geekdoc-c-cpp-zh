  md: '# 24. Adding the Admin Project


    # Overview


    In this chapter, you will add a Web Application project called VideoOnDemand.Admin
    to the solution. The application will be used by administrators to add, remove,
    update, and view data that can be accessed by the regular users from the VideoOnDemand.UI
    project. To access the data, the application will share the same database context
    and data read that you added earlier to the VideoOnDemand.Data project.


    You will be using the Web Application template when creating the Admin project;
    this is a template that wasn''t available in ASP.NET Core 1.1. It makes it possible
    to create a lightweight application using Razor Pages instead of creating a full-fledged
    MVC application with models, views, and controllers.


    A good candidate for this type of application is a small company web page that
    contains a few pages of data with a navigation menu and maybe a few forms that
    the visitor can fill out.


    Even though you are working with Razor Pages (and not views), they are still part
    of the same MVC framework. This means you don''t need to learn a whole new framework
    to create Razor Pages if you already know MVC.


    Although it''s possible to contain all code, C#, Razor syntax, and HTML in the
    same file, this is not the recommended practice. Instead, you create two files,
    one .cshtml code-behind C# file and one .cshtml file for HTML and Razor syntax.
    The two files are presented as one node in the Solution Explorer inside the Pages
    folder.


    The Razor Page looks and behaves much like a regular view; the difference is that
    it has a code-behind file that sort of acts as the page''s model and controller
    in one.


    One way to determine if a .cshtml file is a page (and not a view) is to look for
    the @page directive, which should be present in all Razor Pages.


    Just like views, the Razor Pages have a _Layout for shared HTML and imported JavaScript
    and CSS style sheets. They also have a _ViewImports view where using statements,
    namespaces, and TagHelpers can be added that should be available in all pages.'
