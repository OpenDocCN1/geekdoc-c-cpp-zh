  md: 'ASP.NET Core 2 MVC & Razor Pages for Beginners


    # Serving Up Static Files


    A feature that nearly all web applications need the ability to serve up static
    files, such as JSON, CSS, and HTML files. To allow ASP.NET to serve up files,
    you must add a new middleware component that is called the UseStaticFiles method,
    located in the Microsoft.AspNetCore.StaticFiles NuGet package, which is installed
    with the default Microsoft.AspNetCore.All NuGet package.


    Without the UseStaticFiles middleware component, the application will display
    the message from the Run middleware.


    Let''s add an HTML file to the wwwroot folder and see what happens, and why. Static
    files must be added to the wwwroot folder for ASP.NET to find them.


    +   1. Right click on the wwwroot folder and select Add-New Item.

    2. Search for the HTML Page template and select it.

    3. Name the file index.html and click the Add button.

    4. Add the text An HTML Page to the <title> tag, and Hello, from index.html in
    the <body> tag.

    5. Save all files and navigate to the /index.html page in the browser.

    6. The message Hello, from configuration is displayed, which probably isn''t what
    you expected.


    The reason why the message Hello, from configuration is displayed is that there
    currently is no middleware that can serve up the static file. Instead the Run
    middleware, which is accessible, will be displayed.


    Let''s fix this by adding a new middleware located in the Microsoft.AspNetCore.StaticFiles
    NuGet package, which is installed bydefault.


    When the UseStaticFiles method is called on the app object, ASP.NET will look
    in the wwwroot for the desired file. If a static file is found, the next piece
    of middleware will not be called.


    +   1. Open the Startup.cs file and locate the Configure method.

    2. Add a call to the UseStaticFiles method on the app object above the Run middleware.

    app.UseStaticFiles();

    3. Save all the files and start the application with F5.'
