    </head>\n<body>\n    <div>\n        @Body\n    </div>\n    <footer>\n        @RenderSection(\"\
    footer\", false)\n        @await Component.InvokeAsync(\"Message\")\n    </footer>\n\
    </body>\n</html>\n```"
