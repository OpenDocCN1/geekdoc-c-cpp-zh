  md: 'ASP.NET Core 2 MVC & Razor Pages for Beginners


    # 2. Middleware


    In this chapter, you will add middleware that handles HTTP requests, like how
    the application behaves if there is an error. One key aspect of the middleware
    is to perform user authentication and authorization.


    By the end of this chapter you will have built a middleware pipeline for a MVC
    application.


    # How Does Middleware Work?


    Let''s have a look at how middleware works and what it is used for.


    When an HTTP request comes to the server, it is the middleware components that
    handle that request.


    Each piece of middleware in ASP.NET is an object with a very limited, specific,
    and focused role. This means that you will have to add many middleware components
    for an application to work properly.


    The following example illustrates what can happen when an HTTP POST request to
    a URL, ending with /reviews, reaches the server.


    ![](img/4b74569a91d8303eca7672688cf7d979_44_0.png)


    Logger is a separate middleware component that you want to use to log information
    about every incoming HTTP request. It can see every piece of data, such as the
    headers, the query string, cookies, and access tokens. Not only can it read data
    from the request, it can also change information about it, and/or stop processing
    the request.


    The most likely scenario with a logger is that it will log information and pass
    the processing onto the next middleware component in the pipeline.


    This mean that middleware is a series of components executed in order.'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nThe next middleware component\
    \ might be an authorizer that can look at access tokens or cookies to determine\
    \ if the request will proceed. If the request doesn't have the correct credentials,\
    \ the authorizer middleware component can respond with an HTTP error code or redirect\
    \ the user to a login page.\n\nIf the request is authorized, it will be passed\
    \ to the next middleware component, which might be a routing component. The router\
    \ will look at the URL to determine where to go, by looking in the application\
    \ for something that can respond. If it can't find anything that can respond,\
    \ the JSON, XML, or HTML page for instance, could throw a 404 Not Found error.\n\
    \nLet's say that found an HTML page respond; then the pipeline starts to call\
    \ all the middleware components in reverse order, passing along the HTML. When\
    \ the response reaches the first component, which is the logger in our example,\
    \ it might log the time the request took and then allow the response to go back\
    \ over the network to the client's browser.\n\nThis is what middleware is, a way\
    \ to configure how the application should behave. A series of components will\
    \ handle specific, narrow tasks, such as handle errors, serve up static files\
    \ and send HTTP requests to the MVC framework. This will make it possible for\
    \ you to build the example video application.\n\nThis book will not go into the\
    \ nitty-gritty of middleware – only the basics that you need to build an MVC application.\n\
    \n# IApplicationBuilder\n\nThe IApplicationBuilder interface injected into the\
    \ Startup class's Configure method is used when setting up the middleware pipeline.\n\
    \n```\npublic void Configure(IApplicationBuilder app, IHostingEnvironment env,\
    \ IMessageService msg)\n{\n    if (env.IsDevelopment()) app.UseDeveloperExceptionPage();\n\
    \n    app.Run(async (context) =>\n    {\n        await context.Response.WriteAsync(msg.GetMessage());\n\
    \    });\n}\n```"
