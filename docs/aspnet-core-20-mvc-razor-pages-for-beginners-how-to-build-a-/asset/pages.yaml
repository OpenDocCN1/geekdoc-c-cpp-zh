  md: "# ASP.NET Core 2.0 MVC Razor Pages for Beginners\n\nConfiguration in the Startup\
    \ Class\nBefore the initial migration can be applied, you have to configure Entity\
    \ Framework to use the VideoDbContext, and add the connection string from the\
    \ secrets.json file. Using the secrets.json file has two purposes: It stores the\
    \ connection string in a safe place that is not checked into source control. It\
    \ also renders the appsettings.json obsolete for secret sensitive data, which\
    \ is a good thing, since it is checked into source control.\n\n+   1. Right click\
    \ on the project node in the Solution Explorer and select Manage User Secrets.\n\
    2. Add the following connection string property. Note that the database name is\
    \ VideoCoreDb. The connection string should be on one line in the file.\n```json\n\
    \"ConnectionString\": {\n  \"DefaultConnection\": \"Server=(localdb)\\mssqldb;Database=VideoCoreDb;Trusted_Connection=True;MultipleActiveResultSetSets=true\"\
    \n}\n```\n3. Open the Startup class and load the constructor.\n4. Add the optional:true\
    \ parameter value temporarily to the AddJsonFile method for the appsettings.json\
    \ file if it is missing from the project.\\AddJsonFile(\"appsettings.json\", optional:\
    \ true);\n5. To be able to check the environment IHostingEnvironment interface\
    \ must be injected into the constructor.\n6. Add an statement, checking if the\
    \ development environment is active, and use the AddUserSecrets method to add\
    \ it to the builder object. Add it above the Build method.\n```csharp\nif (env.IsDevelopment())\n\
    builder.AddUserSecrets<Startup>();\n```\n7. Locate the ConfigureServices method\
    \ and fetch the connection string from the secrets.json file using the Configuration\
    \ object. Store the connection string in a variable called conn.\n```csharp\n\
