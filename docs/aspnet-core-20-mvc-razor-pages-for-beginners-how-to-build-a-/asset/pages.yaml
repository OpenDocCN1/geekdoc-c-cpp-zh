  md: '# ASP.Net Core 2.0 MVC Razor Pages for Beginners


    You can create cross-platform applications using ASP.Net Core 2.0, but this requires
    the .NET Core template. As of this writing, this template has limitations compared
    with the .NET Framework template. This is because .NET Framework contains features
    that are relying on the Windows operating system. In a few years’, this gap will
    not be as significant, as the .NET Core evolves. So, if you don’t need the added
    features in .NET Framework, then use the .NET Core template, as it is much leaner
    and cross-platform.


    # The Startup.cs File


    Gone are the days when web.config file ruled the configuration universe. Now the
    Startup.cs file contains a Startup class, ASP.NET will look for by convention.
    The application and its configuration sources are configured in that class.


    The Configure and ConfigureServices methods in the Startup class handle most of
    the application configuration. The HTTP processing pipeline is created in the
    Configure method, located at the end of the class. The pipeline defines how the
    application responds to requests; by default, the only thing it can do is print
    Hello World! to the browser.


    If you want to change this behavior, you will have to add additional code to the
    pipeline in this method. If you have instance to handle route requests in an ASP.NET
    MVC application, you have to modify the pipeline.


    In the Configure method, you set up the HTTP request pipeline (middleware) that
    is called when the application starts. In the second part of this book, you will
    add an object-to-mapper called AutoMapper to this method. AutoMapper transforms
    objects from one to type.


    The ConfigureServices method is where you set up the services, as MVC. You can
    also register your own services and make them ready for Dependency Injection (DI);
    for instance, the service that you implement using the IMessageService interface
    at the beginning of the book.


    You will learn more about how to configure your application in the next chapter.


    For now, all you need to know about dependency injection is that, instead of creating
    instances of a class explicitly, they can be handed to a component when asked
    for. This makes your application loosely coupled and flexible.'
  merge: -1
