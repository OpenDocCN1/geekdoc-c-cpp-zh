  md: 'ASP.NET Core 2.0 & Razor Pages for Beginners


    # # 9. The Use Case


    # ## Introduction


    In the remainder of this book you will learn how to build an ASP.NET Core 2.0
    Web Application with MVC and one with Razor Pages, Entity Framework Core 2.0,
    custom Tag Helpers, HTML, CSS, AutoMapper and JW Player.


    # ## The Use Case


    The customer has ordered a Video on Demand (VOD) application and has requested
    that the newest technologies be used when developing the solution. The application
    should be able to run in the cloud, be web based, and run on any device. They
    have specifically asked that Microsoft technologies be used as the core of the
    solution. Any deviations from that path should be kept to a minimum.


    As a first step, they would like a demo version using dummy data to get a feel
    for the application. The dummy data source must be interchangeable with the final
    SQL database storage, with minimal extra cost.


    YouTube should be used to store the videos, to keep costs down. No API or functionality
    for uploading videos is necessary in the final application. It is sufficient for
    the administrator to be able to paste a link to a video stored in a YouTube account
    when adding a new video with the admin user interface.


    The solution should contain three applications: The first is called **VideoOnDemand.Data**,
    and will contain all entity classes as well as a couple of services for interacting
    with the database that it creates. The second is a user interface for regular
    users called **VideoOnDemand.UI**; this application has a reference to the **Data**
    project to get access to the database through the services. The third application
    is for administrators and is called **VideoOnDemand. Admin**; with it, admins
    can perform CRUD operations on the tables in the database.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# ASP.NET Core 2 MVC & Razor Pages for Beginners


    The User Interface (MVC)


    This web application should be created using MVC project template. Users should
    be able to register and log in to the web application. Upon successful login or
    registration, the user should be automatically redirected to the membership site.


    The first view after login login should be a dashboard, displaying the courses
    available to the user. When clicking on a course, the course curriculum should
    be displayed in a list below a marquee and some information about the course.
    Each course can have multiple modules, which can have multiple videos and downloadable
    content. Downloadable content should open in a separate browser tab.


    When the user clicks on a video listing, a new view is opened, where a video player
    is preloaded with the video but displays an image (no auto play). Information
    about the course, and a description of the video, should be displayed below the
    video player. To the right of the video player, a thumbnail image for the next
    video in the module should be displayed, as well as buttons to the previous and
    next video. The buttons should be disabled if no video is available.


    An instructor bio should be displayed in the **Course, Detail, and Video** views.


    The menu should have a logo on the far left and a settings menu to the far right.


    The database entity classes should not be used as view models; instead, each view
    should use a view model, which contains the necessary Data Transfer Objects (DTOs)
    and other properties. Auto Mapper should be used to convert entities to DTO objects,
    which are sent to the views.


    # Login and Register User


    When an anonymous user visits the site, the **Login** view should be displayed.
    From that view, the visitor will be able to register the site by clicking on a
    **Register as a new user** link. The link opens a **Register** view where a new
    user account can be created.


    When these views are displayed, a menu with the standard options should be available,
    like **Home** (takes the visitor to the login view), **About**, and **Contact**.
    The two latter views don’t have to be implemented since the company will do that
    themselves; just leave them with their default content.'
  merge: -1
  pgno: 181
- img_proc: true
  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nThe Administrator Interface\
    \ (Razor Pages)\n Web application should be created with Razor Pages. Each table\
    \ should have Razor Pages for adding and modifying data: Index, Create, Edit,\
    \ Delete. To display data in a drop-down, a collection of SelectList items will\
    \ be sent to the Razor Page from its code-behind using the dynamic ViewData object,\
    \ and displayed with a <select> element and the ViewBag object in the Razor Page.\
    \ Data stored using the ViewData object in C# can be retrieved and displayed in\
    \ HTML with the ViewData object.\n\nIf the logged in user is an administrator,\
    \ a drop-down menu should appear to the right of the logo, containing links to\
    \ views for CRUD operations on the database connected to the site. There should\
    \ also be a dashboard on the main Index page where the admin can click to open\
    \ the Index pages associated with the different tables in the database and perform\
    \ CRUD operations.\n\n# Conclusion\n\nAfter careful consideration, these are the\
    \ views and controls necessary for the application to work properly.\n\n# Login\
    \ and Register\n\nIt is clear that the default views can be reused; they only\
    \ need some styling. The default links for registering and logging in a user in\
    \ the navigation bar has to be removed, the Home controller's Index action will\
    \ reroute to the Login view instead of displaying the Index view. This will ensure\
    \ that the login panel is displayed when the application starts.\n\nBelow is a\
    \ mock-up image of the Login and Create views. Note the icons in the textboxes,\
    \ they will be represented by Glyphicons.\n\nThe application will collect the\
    \ user's email and password when registering with the site, and that information\
    \ will be requested of the visitor when logging in. There will also be a checkbox\
    \ asking if the user wants to remain logged in when visiting the site the next\
    \ time."
