  md: '# 14. Data Transfer Objects


    # ## Introduction


    In this chapter, you will begin the creation of the *Membership* views, by figuring
    out what

    objects are needed to transfer the necessary data from the server to the client.
    These

    objects are referred to as Data Transfer Objects, or DTOs.


    In some solutions the DTOs are the same as the entities used to create the database.

    in this solution you will create DTOs for data transfer only, and entities for
