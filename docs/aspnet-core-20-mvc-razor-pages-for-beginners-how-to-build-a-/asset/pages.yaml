  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    To achieve this, you create an interface that the service classes implement, and
    then use that interface when serving up the instances. Because the service classes
    implement the same interface, instances from them are interchangeable.


    To get access to the services from the **Configure** method in the **Startup**
    class, or any other constructor, model, Razor Page, or view, you must use dependency
    injection. That is, pass in the interface as a parameter to the method.


    You must register the service interface, and the desired service class, with the
    services collection in the **ConfigureServices** method, in the **Startup** class.
    This determines which class will be used to create the instance, when dependency
    injection is used to pass in an instance of a class implementing the interface.


    In the upcoming example, you will inject a service class into the **Configure**
    method, but it works just as well with regular classes that you want to inject
    into constructor, model, Razor Page, or view, using dependency injection. The
    same type of registration that you did in the **ConfigureServices** method could
    be applied to this scenario, but you wouldn''t have to implement it as a service.


    You might ask how the **WebApplicationBuilder** parameter gets populated in the
    **Configure** method, when no configuration has been added for it in the **ConfigureServices**
    method. The answer is that certain service objects will be served up for interfaces
    automatically by ASP.NET; one of those interfaces is the **IApplicationBuilder**.
    Another is the **IHostingEnvironment** service, which handles different environments,
    such as development, staging, and production.


    # Example


    Let''s implement an example where you create two service classes that retrieve
    data in different ways. The first will simply return a hardcoded string (you can
    pretend that the data is fetched from a database or a web service if you like),
    and the second class will return the value from the **Message** property that
    you added to the *appsettings.json* file.


    You will begin by adding an interface called **IMessageService**, which will define
    a method called **GetMessage**, which returns a string.


    Then you will implement that interface in a service class called **HardcodedMessageService**,
    which will return a hardcoded string. After implementing the class, you will add
    configuration for it and the interface in the **ConfigureServices** method and
    test the functionality.'
