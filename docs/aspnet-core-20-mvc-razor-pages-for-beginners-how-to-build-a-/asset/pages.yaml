  md: 'ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    # 4. Models


    In this chapter, you will learn more about different types of model classes in
    the MVC framework and how to use them.


    Up until now, you have used the Video class as a model for the Index view. In
    simple solutions that might be fine, but in more complex solutions, you need to
    use entity models and view models. Sometimes you make even a more granular distinction
    between the models, using Data Transfer Objects (DTOs) with the view models.


    An entity model is typically used to define a table in a database. A view model
    is used to transport data from the controller to the view, but sometimes the view
    model needs to contain objects, and that''s where the DTOs come into play. Some
    argue that DTOs are view models, and in some scenarios they are.


    You will create a new folder Entities and move the Video class to that folder.
    The reason for moving the file is that the Video class later will be used to define
    a table in a SQL Server database. A class used to define a database table is referred
    to as an entity. You will also add a new folder named ViewModels, which will hold
    the view models created throughout the first part of the book.


    Important to note is that the view model typically contains other data than the
    entity model, although some properties are the same. One example is when a video
    is being added in a Create view. The view model needs some properties from the
    entity model, but could also need other information that is not stored in the
    Video entity and must be fetched from another database table, or an enum.


    A view model is never used to directly update the database. To update the database
    the data from the view model is added to an entity model, which then in turn updates
    the database table.


    Let''s look at an example where enum is used to display the genre a video belongs
    to. For simplicity, a video can only belong to one genre.'
