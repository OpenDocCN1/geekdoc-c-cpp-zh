  md: '# 13. Modifying the Navigation Bar


    # Introduction


    The default layout and styling of the navigation bar leaves a bit to be desired.
    In this chapter, you will alter the layout of the navigation bar, only displaying
    certain links when the user is logged out, and creating a drop-down menu for the
    **Logout** and **Settings** options. You will also add a logo to the navigation
    bar, making it look more professional.


    Technologies Used in This Chapter


    +   - **Razor** – To incorporate C# in the views where necessary.

    - **HTML 5** – To build the views.

    - **Bootstrap and CSS** – To style the HTML 5 elements.


    # Overview


    Your task is to change the appearance of the navigation bar. It should be white
    with a logo to the far left. Your **Home**, **About**, and **Contact** links should
    only be visible to users before they have logged in to the site. No other links
    should be visible in the navigation bar, except for a drop-down menu at the far
    right, which should be visible when the user has logged in.


    To control when the links are displayed you need to inject the **SignInManager**
    and **UserManager** to the **_Layout** view.


    ```

    @inject SignInManager<User> SignInManager

    @inject UserManager<User> UserManager

    ```


    To achieve this you will alter the **_Layout** and **_LoginPartial** views.


    Current navigation bar when logged out


    | VideoOnDemand | Home | About | Contact | Register | Log in |


    Current navigation bar when logged in


    | VideoOnDemand | Home | About | Contact | Hello a@b.cl | Log out |'
