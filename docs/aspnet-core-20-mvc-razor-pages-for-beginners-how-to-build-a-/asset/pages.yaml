  md: '# 26. The Admin Menu


    # Introduction


    In this chapter, you will create an Admin menu with links to all Index Razor Pages
    associated with the entities in the Data project. Since you know that a Page folder
    will have the same name as its corresponding entity, all the menu items can be
    added before the pages have been created.


    You will create the menu in a partial view called _AdminMenuPartial that is rendered
    in the Layout view, using the PartialAsync method in the Html class.


    Technologies Used in This Chapter


    +   - C# – To add authorization checks in the _AdminMenuPartial view.

    - HTML – To create the drop-down menu and its items


    # Overview


    Your task is to create a menu for all the Index Razor Pages, in a partial view
