  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    code-behind class; through this model, you can access the public properties that
    you add to the class from the HTML in the page using Razor syntax.


    The code-behind class comes with an empty OnGet method that can be used to fetch
    data that will be used in the Razor Page, much like an Http action method in a
    controller.


    You can also add an asynchronous OnPostAsync method that can be used to handle
    posts from the client to the server, for instance a form that is submitted. This
    method is similar to the HttpPost action method in a controller.


    As you can see, the code-behind class works kind of like a combined controller
    and model. You can use controllers, if needed, handle requests that don''t require
    a Razor Page, such as logging out a user.


    # The [TempData] Attribute


    The [TempData] attribute is new in ASP.NET Core 2.0 and can be used with properties
    in controllers and Razor Pages to store data until it is read. It is particularly
    useful for redirection, when data is needed for more than a single request. The
    Keep and Peek methods can be used to examine the data without deletion.


    Since the [TempData] attribute is built on top of session state, it can be shared
    between Razor Pages. You can take advantage of this when sending a message from
    one Razor Page to another, and display it using the <status-message> Tag Helper
    that you will implement in the next chapter.


    You will prepare for the Tag Helper by adding a [TempData] property called StatusCode
    (string) to the code-behind class for the Razor Pages. This property will hold
    the message assigned in one of the Create, Edit, or Delete Razor Pages and display
    it in the Tag Helper that you add to the Index Razor Page. By adding the property
    to several code-behind classes, the message can be changed as needed because only
    one property is created in the session state.


    # The Users/Index Razor Page


    The Index Razor Page in the Users folder can be viewed as a dashboard for users,
    listing them in a table with data about the users and buttons to delete each user.
    It also has a Create New button above the HTML table for creating a new user in
    the AspNetUsers database table.'
