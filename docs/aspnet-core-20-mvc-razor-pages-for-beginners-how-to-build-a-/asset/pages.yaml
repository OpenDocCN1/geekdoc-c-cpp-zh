  md: 'ASP.NET Core 2.0 MVC Razor Pages for Beginners


    # Introduction to Views


    The most popular way to render a view from an ASP.NET Core MVC application is
    to use the Razor view engine. To render the view, a **ViewResult** is returned
    from the controller using the **View** method. It carries with it the name of
    the view in the filesystem, and a model object if needed.


    The framework receives that information and produces the HTML that is sent to
    the browser.


    Let''s implement a view for the **Index** action and pass in a **Video** object
    as its model.


    +   1. Open the **HomeController** class.

    2. Change the return type of the **Index** action to **ViewResult**

    `public ViewResult Index()`

    3. Call the **View** method and pass in the **model** object that you created
    earlier.

    `return View(model);`

    4. Save the file and refresh the application in the browser.

    5. By convention ASP.NET will look for a view with the same name as the action
    that produced the result. It will look in two places, both subfolders, to a folder
    called Views: the first is a folder with the same name as the controller class,
    the second folder named **Shared**. In this case, there is no view for the **Index**
    action, so an exception will be thrown.


    ![](img/4b74569a91d8303eca7672688cf7d979_67_0.png)'
