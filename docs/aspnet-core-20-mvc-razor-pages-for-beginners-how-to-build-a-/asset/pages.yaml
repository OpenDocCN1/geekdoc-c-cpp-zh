  md: "ASP.NET Core MVC & Razor Pages for Beginners\n\n# IActionResult\n\nThe controller\
    \ actions that you have seen so far all returned strings. When working with actions,\
    \ you rarely return strings. Most of the time you use the IActionResult return\
    \ type, which can return many types of data, such as objects and views. To access\
    \ to IActionResult or derivations thereof, the controller class must inherit the\
    \ Controller class.\n\nThere are more specific implementations of that interface,\
    \ for instance the ContentResult class, which can be used to return simple content\
    \ such as strings. Using a more specific return type can be beneficial when unit\
    \ testing, because you get a specific data type to test.\n\nAnother return type\
    \ is Object, which often is used in Web API applications because it turns the\
    \ result into an object that can be sent over HTTP. JSON is the default return\
    \ type, making the result easy to use from JavaScript on the client. The data\
    \ carrier can be configured to deliver the data in other formats, such as XML.\n\
    \nA specific data type helps the controller decide what to do with the data returned\
    \ from an action. The controller itself does not do anything with the data, and\
    \ does not write anything into the response. That is the framework that acts on\
    \ that decision, and transforms the data into something that can be sent over\
    \ HTTP. That separation of letting the controller decide what should be returned,\
    \ and the framework doing the actual transformation, gives you flexibility and\
    \ makes the controller easier to test.\n\n# Implementing ContentResult\n\nLet's\
    \ change the Name to return a ContentResult.\n\n+   1. Open the EmployeeController\
    \ class class inherit the Controller class.\n2. Have the EmployeeController class\
    \ inherit the Controller class.\n   public class EmployeeController : Controller\n\
    3. Change the Name action's return type to ContentResult.\n   public ContentResult\
    \ Name()\n4. Change the return statement to return a content object by calling\
    \ the Content method, and pass the string to it.\n   public ContentResult Name()\n\
    \   {\n     return Content(\"Jonas\");\n   }"
