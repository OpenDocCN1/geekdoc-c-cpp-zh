  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    The Properties folder in the Solution Explorer contains a file launchSettings.json,
    which contains all the settings to launch the application. It contains IIS settings,
    as well as project settings, such as environment variables and the application
    URL.


    One major change from ASP.NET Core 1.0 is that the project.json file no longer
    exists; instead the NuGet packages are listed in the .csproj file. It can be opened
    and edited directly from Visual Studio (which is another change) or its content
    can be changed using the NuGet Package Manager.


    To open the .csproj file, you simply right click on the project node in the Solution
    Explorer and edit AspNetVideoCore.csproj (substitute AspNetVideoCore with the
    name of the project you are in).


    You can add NuGet packages by adding PackageReference nodes to the .csproj, or
    by opening the NuGet Package Manager. Right click on the project node or the References
    node, and select Manage Packages to open the NuGet Manager.


    One change from the ASP.NET Core 1.1 version is that there is only one NuGet package
    called Microsoft.AspNetCore.All that is installed when the project is created.
    It contains references to the most frequently used NuGet packages, the ones that
    you had to add separately in the 1.1 version.


    Open the .csproj file and the NuGet manager side by side and compare them. As
    you can see, the package is listed in the dialog and in the file.


    ![](img/4b74569a91d8303eca7672688cf7d979_30_0.png)'
