  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    The first step is to add a method to the DbDataService in the Data project that
    returns the necessary statistics for the dashboard from the database.


    The second step is to create a partial view called _CardPartial that will be used
    to render the dashboard items (cards).


    The third step is to modify the Index view and its code-behind file to receive
    data from the database through the DbDataService.


    Adding the Count Method to the DbDataService

    To be able to display the number of records stored in the entity tables in the
    database, you will add a method called Count the DbDataService class in the Data
    project. Instead of adding a model class with properties for the record count
    in each table and returning an object of class from the method, you will make
    the method return a tuple containing the values.


    Use the Count on the entities in the method to return their number of records.


    +   1. Open the IdbDataService interface in the Data project.

    2. Add a method that returns an integer for each entity count. Use camel naming
    to name the tuple parameters as the entities. The Count method you should not
    take any in-parameters.

    (int courses, int downloads, int instructors, int modules, int videos, int users,
    int userCourses);

    3. Open the DbDataService class and add the Count method.

    4. Return the number of records in each entity and assign the values to the appropriate
    tuple parameter. Use the Count method on each entity in the _db context object
    to fetch the number of records.

    return (

    courses: _db.Courses.Count(),

    downloads: _db.Downloads.Count(),

    instructors: _db.Instructors.Count(),

    modules: _db.Modules.Count(),

    videos: _db.Videos.Count(),

    users: _db.Users.Count(),

    userCourses: _db.UserCourses.Count());

    5. Open the Startup class in the Admin project.

    6. Add the IdbReadService service to the ConfigureServices method.

    services.AddTransient<IDbReadService, DbDataService>();'
