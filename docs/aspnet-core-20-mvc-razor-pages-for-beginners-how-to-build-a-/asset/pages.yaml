  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nTo add middleware, you\
    \ call extension methods on the **app** parameter, which contains the dependency-injected\
    \ object for the **ApplicationBuilder** interface. Two middleware components are\
    \ already defined in the **Configure** method.\n\nThe **UseDeveloperExceptionHandler**\
    \ middleware component will display a pretty error page to the developer, not\
    \ the user; you can see that it is encapsulated in an if-block that checks if\
    \ the environment variable is set to the development environment.\n\nThe **UseDeveloperExceptionHandler**\
    \ middleware component then calls the **Run** middleware component that is used\
    \ to process every response. **Run** is not frequently used because it is a terminal\
    \ piece of middleware, which means it is the end of the pipeline. No-middleware\
    \ component added after the **Run** component will execute, because **Run** doesn't\
    \ call into any other middleware components.\n\n```\napp.Run(async (context) =>\
    \ {\n  await context.Response.WriteAsync(msg.GetMessage());\n});\n```\n\nBy using\
    \ the context object passed into the **Run** method, you can find out anything\
    \ about the request through its **Request** object –the header information, for\
    \ instance. It will also have access to a **Response** object, which currently\
    \ is used to print out a string.\n\nIn the previous chapter, you called the **GetMessage**\
    \ method on the message service in the **Run** method.\n\nMost middleware components\
    \ will be added by calling a method beginning with **Use** on the **app** object,\
    \ such as **app.UseDeveloperExceptionHandler**.\n\nAs you can see, there are several\
    \ middleware components available out of the box using the **app** object. You\
    \ can add more middleware components by installing NuGet packages containing middleware.\n\
    \n```\napp.use\n```\n\n![](img/4b74569a91d8303eca7672688cf7d979_46_0.png)"
