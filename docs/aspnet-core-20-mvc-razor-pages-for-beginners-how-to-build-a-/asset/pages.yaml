    personally dislike having to read hundreds upon hundreds of pages of irrelevant
    fluff (filler material) not necessary for the tasks at hand, and also view it
    as a disservice to the readers, I assume that we are of the same mind on this,
    and therefore I will include only important information pertinent to the tasks
