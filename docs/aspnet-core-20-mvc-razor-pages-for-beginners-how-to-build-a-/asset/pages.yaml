  md: "ASP.NET Core 2 MVC & Razor Pages for Beginners\n\n# Adding a Configuration\
    \ Service\n\nLet's say the hard-coded string Hello, from My World is a string\
    \ that shouldn't be hardcoded, and you want to read it from a configuration source.\
    \ The source is irrelevant; it could be a JSON file, a database, a web service,\
    \ or some other source. To solve this, you could implement a configuration service\
    \ that fetches the value when asked.\n\nLet's implement this scenario in your\
    \ application\n\n+   1. Right click on the project folder and select Add-New Item.\n\
    2. Search for JSON in the dialog's search field.\n3. Select the ASP.NET Configuration\
    \ File template.\n4. Make sure the file you name is appsettings.json. The file\
    \ could be named anything, appsettings is convention for this type of configuration\
    \ file.\n5. Click the Add button.\n6. As you can see, a default connection string\
    \ is already in the file. Remove the connection string property and add the following\
    \ key-value pair: \"Message\":\"Hello, from configuration\" This is the file content\
    \ after you have changed it.\n\n```\n{\n  \"Message\": \"Hello, from configuration\"\
    \n}\n```\n\nTo read configuration information from the appsettings.json file,\
    \ you have to add a constructor to the Startup class. You can do that by typing\
    \ ctor and hitting the Tab key in the class.\n\n```\npublic class Startup {\n\
    \    public Startup() {\n        ...\n    }\n}\n```\n\n8. You need to create an\
    \ instance of the ConfigurationBuilder class called builder in the constructor,\
    \ and chain on the SetBasePath method with the application's current directory\
    \ as an argument. Without specifying the base path, the application will not know\
    \ where to search for files.\n\n```\nvar builder = new ConfigurationBuilder()\n\
    .SetBasePath(Directory.GetCurrentDirectory());\n```"
