  md: 'ASP.NET Core MVC & Razor Pages for Beginners


    # 16. Mock Data Repository


    # Introduction


    In this chapter, you will create an interface called IRepository, which will be
    a contract that any data source repository can implement for easy reuse. It will
    also be used whendependencyinjection is used to inject objects into constructors.
    This is crucial because it makes it possible to switch one repository for another
    without breaking the application; it is also a requirement from the customer.


    You will implement the interface in a class called MockReadRepository, which will
    be used when building the user interface. Once the UI is working, you will switch
    to another repository called SQLReadRepository, targets the database you will
    create in a later chapter.


    You will add some dummy data in the MockReadRepository class that will act as
