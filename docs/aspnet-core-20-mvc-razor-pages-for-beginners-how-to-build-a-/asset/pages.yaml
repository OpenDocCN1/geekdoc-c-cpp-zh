  md: 'ASP.NET Core 2.0 MVC Razor Pages for Beginners


    # 22. The Database Read Service


    # Introduction


    In this chapter, you will create a service called DbReadService in the VideoOnDemand.
    Data project. This service will be used from the UI and Admin projects to read
    data from the database. Since this is a service that will be injected with dependency
    injection, you need to create an interface for it.


    The service will be called through a second service in the UI project called Sql-Repository,
    using the same IReadRepository interface that you used when adding the MockRepository
    class. You will replace the MockRepository class with the SqlRepository class
    for the IReadRepository service in the ConfigureServices method in the Startup
    class. This will make the application use data from the database, instead of the
    mock data.


    The Admin project doesn''t have a service and will therefore use the DbReadService
    directly.


    # Technologies Used in This Chapter


    +   1. C# – Used to create the service.

    2. Entity framework – To interact with the tables from the repository.

    3. LINQ – To query the database tables.

    4. Reflection – To fetch the names of intrinsic entities.


    # Overview


    Your objective is to create a data service that communicates with the database
    tables. Some methods will use reflection to fetch intrinsic entities – properties
    in an entity that references other entities, essentially reading data from related
    tables.


    # Adding the DbReadService Service


    You need to add an interface called IDbReadService that can be used from the two
    other projects with dependency injection to fetch data from the database. You
    then need to implement the interface in a class called DbReadService that contains
    the code to access the database.'
