  md: '# ASP.NET Core 2 MVC & Razor Pages for Beginners


    Adding the HTTP POST Create Action

    Aform> element is used when a user enters data in a view. There are a few steps
    that are performed when a user posts data. The first you already know: the user
    sends an HTTP request to the HTTP GET action in the controller, which fetches
    the necessary data after which the view is rendered.


    To handle the form’s post back to the server, an HTTP POST version of the action
    method is called with the form values. The names of the form controls are matched
    against the model properties or parameters available in the action’s list.


    The Post action uses that to create, update, or delete data in the data source.


    When passing data from the view to the action, MVC, by default, match all properties
    in the form with properties in the model. This can be risky, especially if you
    use an entity class as the model. In many scenarios, you don’t want to receive
    all data the form sends to the action. So how do tell MVC to use only the values
    of interest? You create a separate view, like you did in the previous session.


    Let’s implement the HTTP POST Create action in the HomeController class.


    +   1. Add the HomeController

    2. Add a new action method called Create that takes the VideoEditViewModel as
    a parameter named model.

    ```csharp

    public IActionResult Create(VideoEditViewModel model) {

    return View();

    }

    ```n3. Save all files and switch to the browser. Navigate to the /Home/Create
    URL. You should see an error message telling you that multiple actions were found
    with the same name.


