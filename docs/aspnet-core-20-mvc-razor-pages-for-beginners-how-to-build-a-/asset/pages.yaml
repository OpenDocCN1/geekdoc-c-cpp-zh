    # Installing AutoMapper


    AutoMapper will be used to map entity (database table) objects to Data Transfer
    Objects (DTOs), which are used to transport data to the views. You can either
    add the following to the <ItemGroup> node in the .csproj file manually or use
    the file or the NuGet manager to add AutoMapper.


    ```

    <PackageReference Include="AutoMapper" Version="6.1.1" />

    ```


    The following list shows you how to use the NuGet manager to install packages.


    +   1. Right click on the Dependencies node in the Solution Explorer and select
    Manage NuGet Packages in the context menu.


    ![](img/4b74569a91d8303eca7672688cf7d979_195_0.png)


    +   2. Click on the Browse link in the top of the dialog.

    3. Select nuget.org in the drop-down to the far right in the dialog.

    4. Type AutoMapper in the textbox.

    5. Select the AutoMapper package in the list; it will probably be the first package
    in the list.

    6. Make sure that you use the latest stable version (6...1).

    7. Click the Install button.'
