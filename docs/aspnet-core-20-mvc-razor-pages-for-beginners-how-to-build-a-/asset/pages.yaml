  md: "# ASP.NET Core 2.0 MVC Razor Pages for Beginners\n\nThe complete code in the\
    \ VODContext\n\n```\npublic class VODContext : IdentityDbContext<User>\n{\n  \
    \  public DbSet<Course> Courses { get; set; }\n    public DbSet<Download> Downloads\
    \ { get; set; }\n    public DbSet<Instructor> Instructors { get; set; }\n    public\
    \ DbSet<Module> Modules { get; set; }\n    public DbSet<UserCourse> UserCourses\
    \ { get; set; }\n    public DbSet<Video> Videos { get; set; }\n}\n```\n\n```\n\
    public VODContext(DbContext<VODContext> options)\n: base(options) { }\n```\n\n\
    ```\nprotected override void OnModelCreating(ModelBuilder builder)\n{\n    base.OnModelCreating(builder);\n\
    \n    // Composite key\n    Entity<UserCourse>().HasKey(uc =>\n        new { uc.UserId,\
    \ uc.CourseId });\n\n    // Restrict cascading deletes\n    foreach (var relationship\
    \ in builder.Model.GetEntityTypes()\n        .SelectMany(e => e.ForeignKeyKeys()))\n\
    \    {\n        relationship.DeleteBehavior = DeleteBehavior.Restrict;\n    }\n\
    }\n```\n\nCreating the Tables\n\nTo add the tables to the database, you have to\
    \ create a new migration and update the database.\n\n+   1. Open the Package Manager\
    \ Console and select VideoOnDemand.Data in the right drop-down.\n2. Execute the\
    \ following command to create the migration table\n   add-migration CreateVideoRelatedTables\n\
    3. Execute the following command to make the migration changes in the database.\n\
    \   update-database"
