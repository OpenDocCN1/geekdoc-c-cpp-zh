    # The User Dashboard View


    By analyzing the use case you can surmise that the dashboard''s course panels
    should be loaded dynamically, based on the number of courses the user has access
    to. The courses will be displayed three to a row, to make them large enough. This
    means that the view model has to contain a collection of collections, defined
    by a course DTO.


    Each course DTO should contain properties for the course id, course title, description,
    a course image, and a marquee image. Each course should be displayed as a panel
    with the course image, title, description, and a button leading to the course
    view.


