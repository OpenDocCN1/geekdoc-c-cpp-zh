  md: "ASP.NET Core 2 MVC Razor Pages for Beginners\n\n# # Adding the Tables\n\nTo\
    \ tell Entity Framework the entity classes should be added as tables in the database,\
    \ you need to add them as DbSet properties in the VODContext class. Use the same\
    \ entity classes you created for the mock data repository.\n\nYou can inject the\
    \ VODContext class into the constructor of the SqlReadRepository class to perform\
    \ CRUD (Create, Read, Update, Delete) operations on the tables. When you replace\
    \ the MockRepository class with the SqlReadRepository class in the IReadRepository,\
    \ service data will be used instead of the mock data.\n\nAdding the Entity Classes\
    \ to the VODContext\n\n+   - Open the VideoDemand.Data project in the Solution\
    \ Explorer.\n- Open the VODContext class located in the Data folder.\n- Add all\
    \ the entity as DbSet properties to the class.\npublic DbSet<Course> Courses {\
    \ get; set; }\npublic DbSet<Download> Downloads { get; set; }\npublic DbSet<Instructor>\
    \ Instructors { get; set; }\npublic DbSet<Module> Modules { get; set; }\npublic\
    \ DbSet<UserCourse> UserCourses { get; set; }\npublic DbSet<Video> Videos { get;\
    \ set; }\n- Because the UserCourses table has a composite key (UserId and CourseId),\
    \ you need to specify that in the OnModelCreating method in the VODContext class.\
    \ In previous versions of ASP.NET Core 2.0 you could pass it as a Lambda expression\
    \ to the attributes,\n\nHasKey method.\nbuilder.Entity<UserCourse>().Has(uc =>\
    \ uc.UserId, uc.CourseId));\n\nTo avoid cascading deletes when a parent record\
    \ is deleted, you can add a delete behavior to the OnModelCreating method. A cascading\
    \ delete will delete all related records to the one being deleted; for instance,\
    \ if you delete an order, its rows will also be deleted.\n\n```\nforeach (var\
    \ relationship in builder.Model.GetEntityTypes().SelectMany(e => e.ForeignKeys))\n\
    {\n    relationship.DeleteBehavior = DeleteBehavior.Restrict;\n}\n```"
