    To verify that the package has been installed, you can open the .csproj file by
    right clicking on the project node and selecting **Edit VideoDemand.csproj**,
    or you can expand the *Dependencies-NuGet* folder in the Solution Explorer.


    # Creating the Database


    There are only a few steps to create the database that will enable users to register
    and log in. In a later chapter, you will expand the database by adding tables
    to store application data.


    To create the database, you have to create an initial migration to tell Entity
    Framework how the database should be set up. You do this by executing the **add-migration**
    command in the Package Manager Console.


    After the migration has been successfully created, you execute the **update-database**
    command in the same console to create the database. After the database has been
    created, you can view it in the **SQL Server Object Explorer**, which can be opened
    from the **View** menu.


    Because the entities and the database context will be shared between the administration
    UI and the user UI, you will add a separate project called **VideoDemand.Data**
    for the database classes. This project will then be referenced from the other
    projects.'
