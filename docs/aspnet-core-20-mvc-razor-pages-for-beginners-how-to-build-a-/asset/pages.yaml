  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\n```\n[HttpGet]\npublic\
    \ IActionResult Video(int id)\n{\n    return View();\n}\n```\n\n# Configuring\
    \ AutoMapper\n\nFor AutoMapper to work properly, you have to add configuration\
    \ to the ConfigureServices method in the Startup.cs file. The configuration tells\
    \ AutoMapper how to map between entity and DTOs. Default mapping can be achieved\
    \ by spelling the class names of objects to be mapped, without naming specific\
    \ properties. With default matching, only properties with the same name in both\
    \ classes will be matched.\n\nA more granular mapping can be made by specifying\
    \ exactly which properties match. In this scenario the property names can be different\
    \ in the classes.\n\n+   Open the Startup.cs file and locate the ConfigureServices\
    \ method.\nGo to the end of the method and assign a call to AutoMapper's MapperConfiguration\
    \ to a variable config.\nvar config = new AutoMapper.MapperConfiguration(cfg =>\
    \ {\n});\nAdd a mapping for the Video entity and VideoDTO classes inside the config\
    \ block. Since the properties of interest are named the same in both classes,\
    \ no specific configuration is necessary.\ncfg.CreateMap<Video, VideoDTO>();\n\
    Add a mapping for the Download entity and DownloadDTO classes inside the config\
    \ block. Here specific configuration is necessary since the properties are named\
    \ differently in the two classes.\ncfg.CreateMap<Download, DownloadDTO>()(\n.ForMember(dest\
    \ => dest.DownloadUrl,\n    src => src.MapFrom(s => s.Url))\n.ForMember(dest =>\
    \ dest.DownloadTitle,\n    src => src.MapFrom(s => s.Title)));"
