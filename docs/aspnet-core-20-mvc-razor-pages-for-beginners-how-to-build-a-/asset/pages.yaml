  md: '# 6. Razor Views


    In this chapter, you will learn about different views that can be used for layout,
    to include namespaces, and to render partial content in a view.


    # Layout Views


    The _Layout.cshtml Razor view gives the application more structure and makes it
    easier to display data that should be visible on every page, such as a navigation
    bar and a footer. You avoid duplication using this view. The underscore at the
    beginning of the name is not required, but it is a convention that is commonly
    used among developers. It signifies that the view shouldn''t be rendered as a
    view result with inside the View method from a controller action.


    The normal views, like the Index view, are rendered inside the _Layout view. This
    means they don''t have any knowledge about the navigation and the footer; they
    only need to render what the action tells them to.


    If you look inside the views you have created, they have some code in common,
    such as the <html>, <head>, and <body> elements. Because the markup is the same
    for all the views, it should be moved to the _Layout view.


    Shared views, like _Layout, are placed in a folder called Shared inside the Views
    folder. These views are available anywhere in the application. The layout view
    doesn''t have to be named _Layout; you can have multiple layout views in the application
    if you like.


    The _Layout is a Razor view, which means that you can use C# inside the view,
    like you can in any other view. It should also have a method called @RenderBody,
    which is responsible for rendering the different content views the user navigates
    to, such as the Index and the Details views.


    There is an object called @ViewBag in the _Layout view. It is a dynamic object
    that you can use to send data from the server to the view.


    Another method that can be used in the _Layout view is the @RenderSection. This
    method can be used to render specific sections of HTML from the content view in
    the _Layout view. It is an asynchronous version of this method that you can use
    if you want that type of behavior.'
