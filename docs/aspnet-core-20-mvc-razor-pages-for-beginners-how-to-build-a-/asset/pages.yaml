    \ />\n</div>\n</form>\n```\n\n# Summary\n\nIn this chapter, you used ASP.NET Identity\
    \ to secure your application, implementing registration and login from scratch.\n\
    \nThe first thing you did was to add a User entity that inherited the IdentityUser\
    \ base class. This gave you access to properties such as Username, PasswordHash,\
    \ and Email.\n\nThen you plugged the User entity into a UserStore and an IdentityDb\
    \ class. This made it possible to create and validate a user, which was then stored\
    \ in the database.\n\nThe UserManager and SignManager were then used to implement\
    \ registration and login for users, with a cookie that handles the Forms Authentication.\n\
    \nThe [Authorize] and [AllowAnonymous] attributes were used to restrict user access\
    \ to controller actions.\n\nYou also added views to register, log in, and log\
    \ out a user.\n\nIn the next chapter, you will use front-end frameworks to style\
    \ the application."
