  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    Finding an Entity’s Intrinsic Entity Properties (GetEntityNames)

    This method will return the names of all entity properties in an entity class.
    The names are then used to load these entities when the parent entity is loaded
    into memory. An example of intrinsic entity properties can be found in the Course
    class that has two. The first is the Instructor property and the second is the
    Modules collection.


    If you have direct access to the DbSets in the database context class, you can
    use eager loading to load the data. But when working with generics and the methods
    in the IReadRepository interface, the solution is a little more complex. One way
    to solve this is to use reflection to find the names of the intrinsic entities
    and load them using the combination of three methods: Include, which is available
    as an extension method on an entity loaded with the Set method on the database
    context, or the Collection and Reference extension methods available on the Entry
    method on the database context.


    The private GetEntityNames<TEntity> method you will examine all properties in
    the entity defining and return the names of all properties that correspond to
    DbSet properties in the VODContext class, which are entities. It should not be
    added to the IDbService interface since it is a helper method only used internally
    in the DbReadService class.


    To fetch the names, you first have to find the DbSets in the VODContext class
    by calling the GetProperties method on the type. You do this by reflecting over
    that class and fetching the names of all properties that are public and of instance
    type, and where the property name contains DbSet.


    Then you fetch all instance properties in the entity defining the GetEntityNames
    method by calling the GetProperties method on the entity’s type.


    You need to separate the collection properties from the reference (class) properties
    and return their names in two different collections from the GetEntityNames method;
    the easiest way to return two values from a method is to use tuples, which is
    built into C# 7 and later. Note that the return statement returns two collections
    called collections and classes by specifying the name of the tuple – defined by
    the method – followed by the name of the variable that holds the value.'
