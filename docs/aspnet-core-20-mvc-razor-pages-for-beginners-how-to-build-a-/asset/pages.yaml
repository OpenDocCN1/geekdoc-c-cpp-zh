  md: "# ASP.NET Core 2.0 MVC Razor Pages for Beginners\n\n# View Components\n\nA\
    \ View Component is almost a complete abstraction. It is a partial view that has\
    \ its own model, which it gets from a method called Invoke in a controller-like\
    \ class. A View Component's model is independent from the current view's model.\
    \ You should not use a regular view, with a model, from the _Layout view model,\
    \ since it has no model and it is difficult to get one into it. Use a View Component\
    \ to render partial content in the _Layout view.\n\nIn previous versions of MVC,\
    \ you use @Html.ActionHelper to execute a child action. In this version of MVC\
    \ it has been replaced with the View Component.\n\nYou can look at a View Component\
    \ as having a controller that never route to.\n\nView Components are always placed\
    \ in a folder Components inside the Views folder. If you place the folder in the\
    \ Views/Shared folder, the view can be used from any view. Each View Component\
    \ has a subfolder in the Components folder with the same name as the View Component.\n\
    \n# Adding a View Component for the IMessageService\n\nLet's implement a View\
    \ Component that uses the IMessageService to display the configuration message\
    \ in every view.\n\n+   1. Create a new folder called Components under the project\
    \ node. This folder will hold the necessary files for View Components to work.\n\
    2. Add a class called Message to the folder and inherit the ViewComponent class.\
    \ Add a using statement to the Microsoft.AspNetCore.Mvc namespace to get access\
    \ to the ViewComponent class.public class Message : ViewComponent { }\n3. Add\
    \ a constructor and inject the IMessageService interface to, name the parameter\
    \ message, and store it in a class-level variable called _message. Add a using\
    \ statement to the Services namespace to get access to the IMessageService class.\
    \ private IMessageService _message;\npublic Message(IMessageService message)\n\
    {\n    _message = message;\n}"
