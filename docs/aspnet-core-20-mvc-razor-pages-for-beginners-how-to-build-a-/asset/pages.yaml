  md: '# ASP.NET Core MVC & Razor Pages for Beginners


    # The Course Entity


    Properties in the CourseDTO: CourseId, CourseTitle, CourseDescription, CourseImageUrl,
    and MarqueeImageUrl.


    Apart from the DTO properties, the Course entity needs a unique id, an instructor
    id and a single Instructor entity, and a list of Module entities.


    The single Instructor property is the 1 in the 1-many relationship between the
    Course and Instructor entities.


    The list of Module entities is the many in a 1-many relationship between the Course
    entity and the Module entities. A course can have many modules, but a module can
    only belong to one course.


    You could change this behavior by implementing another entity that connects the
    Course and the Module entities, creating a many-many relationship. Here you''ll
    implement the 1-many relationship.


    | Property | Type | Attribute/Comment |

    |---|---|-|

    | Id | int | Key (will make it the primary key) |

    | Title | string | MaxLength(80) and Required |

    | Description | string | MaxLength(1024) |

    | ImageUrl | string | MaxLength(255) |

    | MarqueeImageUrl | string | MaxLength(255) |

    | InstructorId | int | Navigation property |

    | Instructor | Instructor | Navigation property |

    | Modules | List<Module> | Navigation property |


    # The Module Entity


    Properties in the ModuleDTO: Id, ModuleTitle, Videos, and Downloads.


    Apart from the DTO properties, the Module entity needs a unique id, and needs
    a navigation property to the Course entity it belongs to.'
