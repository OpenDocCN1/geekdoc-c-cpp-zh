  md: 'ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    # The Course View


    The course view should have a button at the top, leading back to the dashboard.
    Below the button, there should be three sections: an overview, the course modules,
    and an instructor bio.


    The marquee image, the course image (as a thumbnail in the marquee), the title,
    and description should be in the top panel.


    Below the top panel to the left, the course modules and their content should be
    listed. Note that there are two possible types of content in a module: videos
    and downloads. Each video should display a thumbnail, title, description, and
    the length of the video (duration). Downloads are listed as links with a descriptive
    title.


    To the right of the module list is the instructor bio, which contains a thumbnail,
    name, and description of the instructor.


    To pull this off, the course view model needs to have a Course DTO, an Instructor
    DTO, and a list of Module DTOs. Each Instructor DTO should contain the avatar,
    name, and description of the instructor teaching a course. The Module DTO should
    contain the module id, title, and lists of Video DTOs and Download DTOs.


    A Video DTO should contain the video id, title, description, duration, a thumbnail,
    and the URL to the video. When a video is clicked, the video should be loaded
    into, and displayed by, the Video view. Auto play should be disabled.


    A Download DTO should contain a title and the URL to the content. When the link
    is clicked, the content should open in a new browser tab.'
