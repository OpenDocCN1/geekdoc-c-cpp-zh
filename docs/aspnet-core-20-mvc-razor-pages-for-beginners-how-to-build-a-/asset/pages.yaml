  md: '# 11. Login


    # Introduction


    In this chapter, you will make the login view available as soon as a visitor navigates
    to the web application. To achieve this, you will redirect from the Home/Index
    action to the Account/Login action.


    Because the login view only should be displayed to visitors who haven''t already
    logged in, you will use Dependency Injection to make the SignInManager available
    from the controller, making it possible to check if the user is logged in.


    To enable visitors to register and log in, you have to use the same connection
    string used in the VideoOnDemand.Data project.


    # Technologies Used in This Chapter


    +   - Dependency Injection – To inject objects into a controller''s constructor.

    - C# – For writing code in the controller''s actions and constructor.

    - Razor – To incorporate C# in the views where necessary.

    - HTML 5 – To build the views.

    - Bootstrap and CSS – To style the HTML 5 elements.

    - TagHelpers – To add HTML 5 elements and their attributes.


    # Redirecting to the Login View


    ASP.NET Core is designed from the ground up to support and leverage Dependency
    Injection (DI). Dependency Injection is a way to let the framework automatically
    create instances of services (classes) and inject them into constructors. Why
    is this important? Well, it creates loose couplings between objects and their
    collaborators. This means that no hardcoded instances need to be created in the
    collaborator itself; they are sent into it.


    Not only can built-in framework services be injected, but objects from your own
    can also be configured for DI in the Startup class.


    Now, you will use DI to pass the SignInManager to a constructor in the HomeController
    class and store it in a private variable. The SignInManager and its User type
    need two using statements: Microsoft.AspNetCore.Identity and VideoOnDemand.Data.Entities.'
