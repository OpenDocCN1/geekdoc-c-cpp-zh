  md: 'ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    # 3. MVC Controllers


    In this chapter, you will learn about MVC, which is a popular design pattern for
    the user interface layer in applications, where M stands for Model, V stands for
    View, and C stands for Controller. In larger applications, MVC is typically combined
    with other design patterns, like data access and messaging patterns, to create
    a full application stack. This book will focus on the MVC fundamentals.


    The controller is responsible for handling any HTTP requests that come to the
    application. It could be a web browsing to the /videos URL of the application.
    The controller''s responsibility is to handle and combine all the necessary data
    and package it in model objects, which act as data carriers to the views.


    The model is sent to the view, which uses the data when it is rendered into HTML.
    The HTML is then sent back to the client browser as an HTML response.


    The MVC pattern creates a separation of concerns between the model, view, and
    controller. The sole responsibility of the controller is to handle the request
    and to build a model. The model''s responsibility is to transport data and logic
    between the controller and the view, and the view is responsible for transforming
    data into HTML.


    For this to work, there must be a way to send HTTP requests to the correct controller.
    That is the purpose of ASP.NET MVC routing.


    ![](img/4b74569a91d8303eca7672688cf7d979_56_0.png)


    39'
