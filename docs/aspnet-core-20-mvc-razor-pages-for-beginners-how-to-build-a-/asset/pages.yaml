- img_proc: true
  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    The single Course entity is the 1 in 1-many relationship between the Course entity
    and the Module entity. A module can only belong to one course, but a course can
    have many modules.


    The lists of Video and Download entities are the part of the 1-many relationships
    between them and a Module entity; in other words, a collection property in an
    entity signifies that many records of that type can be associated with the entity.
    For instance, an order has a 1-many relationship with its order rows, where one
    order can have many order rows. A module can have many videos and downloads, and
    a download and a video can only belong to one module.


    | Property | Type | Attribute/Comment |

    | --- | --- | --- |

    | Id | int | Key (will make it primary key) |

    | Title | string | MaxLength(80) and Required |

    | Courseld | int | Navigation property |

    | Course | Course | Navigation property |

    | Videos | List<Video> | Navigation property |

    | Downloads | List<Download> | Navigation property |


    # The UserEntity Entity


    Properties in the UserCourseDTO: UserId, Courseld, CourseTitle, and UserEmail.


    Apart from the DTO properties, the UserCourse entity needs a navigation property
    to the Course entity. Note that the UserEmail property in the DTO is not persisted
    to the database; you get that from the logged user information.


    In earlier versions of Entity Framework, a composite primary key – a primary key
    made up of more than one property – could be defined using attributes in the entity
    class. In Entity Framework Core, they are defined in the DbContext class, which
    you will do in a later chapter.


    | Property | Type | Attribute/Comment |

    | --- | --- | --- |

    | UserId | string | Key (part of primary key) |

    | User | User | Navigation property |

    | Courseld | int | Key (part of primary key) |

    | Course | Course | Navigation property |'
