  md: "# ASP.NET Core MVC & Razor Pages for Beginners\n\n# Login and Logout\n\nIn\
    \ this section, you will implement login and logout in your application. The links\
    \ will be added to a partial view called _LoginLinks that you will add to the\
    \ Views/Shared folder. The partial view will then be rendered by the _Layout view\
    \ using the @Partial or @PartialAsync method.\n\nWhen an anonymous user arrives\
    \ at the site, Login and Register links should be available. When a user has logged\
    \ in or registered, the username and a Logout link should be visible.\n\nYou must\
    \ also create a new view called Login in the Views/Account folder, a view that\
    \ the Login link opens by calling a Login action in the Account controller.\n\n\
    To work with users and sign-in information views, you inject the SignSignInManager\
    \ and UserManager, similar to the way you use dependency injection in methods\
    \ and constructors in classes.\n\nWhen an anonymous user clicks a restricted link,\
    \ like the Edit link, a ReturnUrl parameter is sent with the URL, so that the\
    \ user will end up on when a successful login has been made. When creating the\
    \ LoginViewModel you must add a property for the return URL, so that the application\
    \ can redirect to. Below is an example URL with the ReturnUrl parameter.\n\nhttp://localhost:51457/Account/Login?ReturnUrl=%2FHome%2FEdit%2F1\n\
    \n# Adding the _Login Partial View\n\nThis partial view will contain the Login\
    \ and Register links that will be visible when an anonymous user visits the site,\
    \ and a Logout link and the username when the user is logged in.\n\n+   - Add\
    \ a MVC View Page called _LoginLinks to the Views/Shared.\n- Delete all the code\
    \ in the view.\n- Add a using statement to the Microsoft.AspNetCore.Identity namespace\
    \ to access to the SignInManager and UserManager.\n  using Microsoft.AspNetCore.Identity\n\
    - Inject the SignInManager and UserManager to the view, below the using statement.\n\
    \  @inject SignInManager<User> SignInManager\n  @inject UserManager<User> UserManager"
