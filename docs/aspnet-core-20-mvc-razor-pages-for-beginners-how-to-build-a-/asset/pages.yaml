  md: '# 5. Entity Framework


    In this chapter, you will set up Entity Framework (EF) and get familiar with how
    it works. To work with EF, you must install the proper services, either manually
    in the .csproj file or by using the NuGet Manager.


    When the services have been installed and configured in the Startup class, you
    will need to add a data context class that inherits from the DbContext class.
    This will be the class that you use to interact with the database. To add a table
    to the database, the table''s entity class must be added as a DbSet property in
    the context class.


    When the services are installed and configured in the Startup class, you create
    the first migration by using the Package Manager Console and the Add-Migration
    command. When the initial migration has been added, the database can be generated
    with the Update-Database command.


    If you make any changes to the database, like adding or changing columns or tables,
    then you must execute the Add-Migration and Update-Database commands again for
    the application to work properly.


    In previous versions you had to install Entity Framework NuGet packages to create
    and use a database. In ASP.NET Core 2.0 these NuGet packages are installed as
    part of the Microsoft.AspNetCore.All NuGet package.


    The setup for User Secrets has been incorporated into the new BuildWebHost method
    in the Program.cs file, which means that you no longer have to add any configuration
    for it in the Startup class. You can use Secrets to store sensitive data locally
    in a file called secrets.json, which is stored outside the solution folder structure
    and is never committed to the source code repository, if you use. You will store
    the connection string to the database securely in the secrets.json file.


    # Adding the VideoDbContext Class


    Now that the NuGet packages have been installed, you can add a class called VideoDbContext
    that inherits form the DbContext class. This class will be your connection to
    the database. It defines the entity classes as DbSet properties, which are mirrored
    as tables in the database.'
