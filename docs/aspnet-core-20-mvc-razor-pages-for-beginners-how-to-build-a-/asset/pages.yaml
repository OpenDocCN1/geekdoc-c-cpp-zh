  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nThe complete code for\
    \ the **Message** View Component:\n\n```\npublic class Message : ViewComponent\n\
    {\n    private IMessageService _message;\n\n    public Message(IMessageService\
    \ message)\n    {\n        _message = message;\n    }\n\n    public IViewResult\
    \ Invoke()\n    {\n        var model = _message.GetMessage();\n        return\
    \ View(\"Default\", model);\n    }\n}\n```\n\nThe complete markup for the **Default**\
    \ view:\n\n```\n@model string\n\n<section>\n    <small>@Model</small>\n</section>\n\
