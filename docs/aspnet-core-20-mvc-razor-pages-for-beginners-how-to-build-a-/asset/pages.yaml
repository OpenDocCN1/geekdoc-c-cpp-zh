  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    # 31. The StatusMessage Tag Helper


    # Introduction


    In this chapter, you will create a Tag Helper that displays a success message
    sent from another page when data has been successfully added, updated, or deleted.
    The Tag Helper will use attributes and attribute values to configure the finished
    HTML elements, such as the message and the message type.


    The StatusMessage property used earlier to the Razor Pages will be used to store
    the message that is assigned in OnPostAsync method when the data has been modified.
    You can see an example of the alert message under the heading in the image below.
    The message is a <div> decorated with the Bootstrap alert classes.


    The [TestData] attribute is new in ASP.NET Core 2.0 and can be used with properties
    in controllers and Razor Pages to store data when it is read. It is particularly
    useful for redirection, when data is needed for more than a single request. The
    Keep and Peek methods can be used to examine the data without deletion.


    Since the [TestData] attribute is built on top of session state, it can be shared
    between Razor Pages. You will use this to send a message from one Razor Page to
    another and display it using the <status-message> Tag Helper that you will implement
    in this chapter.


    ![](img/4b74569a91d8303eca7672688cf7d979_480_0.png)


    463'
  merge: -1
  pgno: 480
- img_proc: true
  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nTechnologies Used in\
    \ This Chapter\n\n+   1 C# – To create the Tag Helper.\n2. HTML – To create the\
    \ Tag Helper and add it to the Razor Pages.\n\nAdding the Tag Helper Class\n\n\
    +   1. Add a Tag Helper called StatusMessageTagHelper to the TagHelpers folder.\n\
    [HtmlTargetElement(\"tag-name\")\npublic class StatusMessageTagHelper : TagHelper\n\
    {\n    public override void Process(TagHelperContext context, TagHelperOutput\
    \ output) { }\n}\n\n+   2. Change the HtmlTargetElement attribute to status-message.\
    \ This will be the Tag Helper’s \"element\" name. It’s not a real HTML element,\
    \ but it looks like one, to blend with the TagHelper markup. However, generate\
    \ a real HTML element when rendered.\n[HtmlTargetElement(\"status-message\")]\n\
    \n+   3. Add two string properties called Message and MessageType to the class\
    \ and assign success to the MessageType. These properties will be the Tag Helper\
    \ attributes you will use with the <status-message> element.\npublic string Message\
    \ { get; set; }\n// Possible Bootstrap classes: success, danger, warning, ...\n\
    public string MessageType { get; set; } = \"success\";\n\n+   4. Return from the\
    \ Process method if the Message property is null or empty.\nif (string.IsNullOrEmpty(Message))\
    \ return;\n\n+   5. Throw an ArgumentNullException if either of the context or\
    \ output method parameters are null. If they are, the Tag Helper element cannot\
    \ be rendered.\nif (context == null)\n    throw new ArgumentNullException(nameof(context));\n\
    if (output == null)\n    throw new ArgumentNullException(nameof(output));\n\n\
    +   6. Call the base class’s Process method with the two method parameters.\n\
    base.Process(context, output);"
  merge: -1
  pgno: 481
- img_proc: true
  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    7. Tell the Process method the element type that it should output. Use the TagName
    property on the output object to specify the Tag Helper''s main element container.

    output.TagName = "div";


    8. Add the element and style. Use the two properties to assign the text to be
    displayed and show the background color of the <div>. Only append the message
    if the Message property isn''t null or empty. You can see examples of alerts on
    the Bootstrap website:

    https://getbootstrap.com/docs/3/components/#alerts


    ```

    var count = "<div class=''alert alert-{MessageType}" + \

    ''alert-dismissible'' role=''alert''><button type=''button'' " + \

    ''class=''close'' data-dismiss=''alert'' aria-label=''button''> + \

    ''<span aria-hidden=''true''>&times;</span></span>

    if (!string.IsNullOrEmpty(Message)) content += Message;

    ```


    9. Add the content to the output variable''s Content property. Also, append a
    closing </div> to the output object.

    output.Content.AppendHtml(content);

    output.Content.AppendHtml("</div>");


    10. Save the file and open the Index Page in the Users folder.

    11. Add a <status-message> element above the two <page-button> Tag Helpers you
    added previously and before the <h2> heading. Assign the @Model.StatusMessage
    property to the message attribute (you can skip this if you want the default success
    type).


    ```

    <h2>Users</h2>

    <status-message message="@Model.StatusMessage" message-type="success"></status-message>

    ```


    Or you can leave the message-type attribute.


    ```

    <h2>Users</h2>

    <status-message message="@Model.StatusMessage"></status-message>

    ```


    12. Save all files and start the application.

    13. Open the Users/Index page and add a new user. A success message should be
    displayed with the Tag Helper when you have been redirected to the Index page.'
