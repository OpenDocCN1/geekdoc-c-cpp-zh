    # _ViewStart file


    The Razor view has a convention that looks for a file called _ViewStart.cshtml.
    This engine is executed before any other views, but it has no HTML output. One
    purpose it has to remove duplicate code from code blocks in the views, like the
    Layout declaration. Instead of declaring the location of the _Layout view in each
    view, it can be placed inside the _ViewStart view. It is possible to override
    the settings in the _ViewStart view by adding the Layout declaration in individual
    views.


    If you place this view directly in the Views folder, it will be available to all
    views. Placing it in another folder inside the Views folder makes it available
    to the views in that folder.


    You can assign null to the Layout property in a specific view to stop any layout
    view from being used with the view.


    ![](img/4b74569a91d8303eca7672688cf7d979_123_0.png)'
