  md: 'ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    # 30. The User Razor Pages


    In this chapter, you will create the User Razor Pages, which are used to perform
    CRUD operations against the AspNetUsers and the AspNetUserRoles in the database.
    These Razor Pages are a bit different, in that they use a page model instead of
    an entity class. The AspNetUsers table handles users and the AspNetUserRoles assigns
    roles to registered users.


    You will use the MainPage container to send collection data to the pages that
    contain dropdowns to provide them with data; this is to prevent the items being
    displayed as text boxes.


    Technologies Used in This Chapter


    +   1. C# – To write code in Razor Pages code-behind methods.

    2. HTML – To add content to the Razor Pages.

    3. Entity framework – To perform CRUD operations.


    # Overview


    In this chapter, you will create the User Razor Pages. This enables the administrator
    to display, add, update, and delete data in the AspNetUsers and the AspNetRoles
    tables.


    In this scenario the two tables aren''t linked through the entity classes, you
    will use a view model called UserPageModel to pass the data from the code-behind
    to the page with a property of type UserPageModel or Iumerable<UserPageModel>
    declared directly in the code-behind. Remember that the code-behind doubles as
    a model and controller.


    All Razor Page code-behind PageModel classes need access to the IUserService to
    fetch and modify data in the Admin project and AspNetUsers and AspNetUserRoles
    tables in the database. The easiest way to achieve this is to add a constructor
    to the class and use DI to inject the service into the class.


    The code-behind file belonging to a Razor Page can be accessed by expanding the
    Razor Page node and opening the nested .cshtml.cs file.


    Each Razor Page comes with a predefined @page directive signifying that it is
    a Razor Page and not a MVC view. It also has an @model directive defined that
    is linked directly to the


    435'
