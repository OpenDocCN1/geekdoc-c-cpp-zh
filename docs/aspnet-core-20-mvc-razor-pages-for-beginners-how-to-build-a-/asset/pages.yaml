  md: '# 17. The Membership Controller and AutoMapper


    # Introduction


    In this chapter you will create a new Membership controller and add its three
    actions: Dashboard, Course, and Video. For now, they won’t be serving up any views.
    You will use to implement the mapping between entity objects and DTO objects with
    Auto-Mapper, and fetch the data for each action from the MockReadRepository you
    implemented in the previous chapter.


    AutoMapper and IReadRepository will be injected into the constructor you add to
    the Membership controller. Two other objects are injected into the constructor
    with Dependency Injection. The first is the UserManager, which is used to get
    the user id from the logged in user, and the second is the HttpContextAccessor,
    which contains information about the logged in user.


    Using AutoMapper removes tedious and boring work, code that otherwise would have
    to implement manually to convert one object to another, with the risk of writing
    erroneous conversion code.


    Technologies Used in This Chapter


    +   1. C# – Creating controller actions, view models, and mapping objects.

    2. AutoMapper – To map entity objects to DTO objects.


    # Overview


    You will begin by adding the Membership controller and its action methods. Then
    you will use dependency injection to inject the four previously mentioned objects
    into the controller’s constructor and save them in private class-level variables.


    Then you will set up AutoMapper’s configuration in the Startup.cs file. With that
    complete, you can proceed with the actual mappings in the action methods.'
