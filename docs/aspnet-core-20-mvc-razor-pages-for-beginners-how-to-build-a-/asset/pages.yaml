    The Instructor Entity


    Properties in the InstructorDTO: InstructorName, InstructorDescription, and Instructor-Avatar.


    Apart from the name, description, and avatar properties, the Instructor entity
    needs a unique id and a property that ties it to the Course entity. This makes
    it possible to assign the same instructor to many courses, but each course can
    only have one instructor. This is implemented by a 1-to-many relationship, where
    the many-part is located in the Instructor entity. Its entity framework knows
    that it should implement a 1-to-many relationship if one entity has a collection
    of the other entity, and the other has a corresponding id.


    Properties in the Instructor entity class:


    | Property | Type | Attribute/Comment |

    | Id | int | Key (will make it the primary key) |

    | Name | string | MaxLength(80) and Required |

    | Description | string | MaxLength(1024) |

    | Thumbnail | string | MaxLength(1024) |

    | Courses | List<Course> | Navigation property |'
