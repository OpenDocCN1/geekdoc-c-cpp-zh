  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    # 15. Entity Classes


    # Introduction


    In this chapter, you will add the entity classes needed to store data in the data
    sources. In the next chapter you will implement a mock data repository using the
    entities you define in this chapter, and later on you will create database tables
    from the entities.


    Now that you have defined the DTOs, you can figure out what the data objects,
    the entities, should contain. There will not always be a 1-1 match between a DTO
    and an entity; that''s where an object mapper comes into the picture. In a later
    chapter you will use AutoMapper to convert an entity to a DTO.


    # Technologies Used in This Chapter


    +   1. C# – Creating entity classes.

    2. Attributes – To define behaviors of entity properties.


    # Overview


    Your task is to use your knowledge about the DTOs to create a set of entity classes
    that will make up the data sources. Remember that an entity doesn''t have to contain
    all properties of a DTO, and that sometimes it will contain more properties.


    # The Entities


    Let''s go back and review the DTOs one at a time, and decide which of their properties
    should be duplicated in the entities. Some of the entity need restrictions: maximum
    length, required, and if it''s a primary key in the table.


    # The Video Entity


    Properties of the VideoDTO: Id, Title, Description, Thumbnail, and URL.


    The Video entity needs the same properties that the DTO has, but it could use
    a few more. You might want to keep track of a record''s position relative to other
    records, so a Position property could be added to the class. Then the Video needs
    to know which module it belongs to, which can be solved by adding a Module navigation
    property, as well as a property for the actual module. You will also add navigation
    properties for the courseld and the course. Navigation properties can be used
    to avoid complex LINQ joins.'
