  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    Changing the Register Action

    This change will set the user''s EmailConfirmed flag. You do this to tell the
    application that the user has verified the registration. This might not be necessary
    in all cases, but it shows how you to do it if Server need to modify user data
    when a user is created.


    +   1. Open the AccountController class.

    2. Locate the Register action.

    3. Add the EmailConfirmed property to the User object and assign true to it.

    ```csharp\var user = new User { Username = model.Email, Email = model.Email, EmailConfirmed
    = true };

    ```

    4. Save the file.


    # Testing the Registration


    +   1. Start the application.

    2. Click the Register as new user? link below the login form.

    3. Fill in an email address and a password and click the Register button. It can
    be a fake email address if you like. I usually use an easy-to-remember email address,
    like a@b.c when testing.

    4. If the registration succeeded, the Home/Index view should be displayed, and
    the email should be visible in the right bar.

    5. Click the Logout link to the far right in the navigation bar. The login form
    should be displayed.

    6. Try to log in to the site with the email you just registered with. This should
    take you back to the Home/Index view.

    7. Close the application from Visual Studio.

    8. Open the SQL Server Object Explorer from the View menu.

    9. Expand the MSSQLDB node, and then your database.

    10. Expand the Tables node and click on the AspNetUsers table. See image below.

    11. Right click on the table and select View Data to open the table in Visual
    Studio.

    12. The table should contain the user you added. See image below.'
