    ```\n\nYou will be adding more NuGet packages (frameworks) as you build the projects.\n\
    \n# Compiling the Solution\n\nIt is important to know that ASP.NET monitors the\
    \ file system and recompile the application when files are changed and saved.\
    \ Because ASP.NET monitors the file system and recompiles the code, you can use\
    \ any text editor you like, such as Visual Studio, when building your applications.\
    \ You are no longer bound to Visual Studio; all you need to do is get the application\
    \ running in the web server (IIS). Let's illustrate it with an example.\n\n+ \
    \  - Start the application without debugging (Ctrl+F5), if it's not already open\
    \ in browser.\n- Open the Startup.cs file with Notepad (or any text editor) outside\
    \ of Visual Studio. This file is responsible for configuring your application\
    \ when it starts.\n- Locate the line of code with string *Hello World*. This line\
    \ of code is responsible for responding to every HTTP request in your application.\n\
    `await context.Response.WriteAsync(\"Hello World!\");`\n- Change the text to *Hello,\
    \ from My World!* and save the file.\n`await context.Response.WriteAsync(\"Hello,\
    \ from My World!\");`\n- Refresh the application in the browser. Do not build\
    \ the solution in Visual Studio before refreshing the page.\n- The text should\
    \ change from *Hello World! To To Hello, from My World!*\nThe reason this works\
    \ is because ASP.NET monitors the file system and recompiles the application when\
    \ changes are made to a file.\n\n![](img/4b74569a91d8303eca7672688cf7d979_31_0.png)"
