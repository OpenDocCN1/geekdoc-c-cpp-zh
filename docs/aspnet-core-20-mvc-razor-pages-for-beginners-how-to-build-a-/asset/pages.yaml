    # The View Models


    That’s great – now you know what the individual DTOs contain – but how do you
    get the information to the views? With the more complex views, there’s no easy
    way to pass multiple DTOs at the same time. You could use Tuples, but that is
    hard to implement. A better choice is to use a view model.


    A view model is exactly what it sounds like, a model that can contain other objects,
    and is sent to the view.


    There will be three view models, although you could argue the first one isn’t
    strictly necessary, because it contains only one property. I beg to differ, however,
    because it will be easier to update the view with more data, if the need should
    arise.


    The first view model is the DashboardViewModel, which has only one property. The
    property data type is somewhat complex; it is a list containing a list. The reason
    for using a list in a list is what you want to display three course panels on
    each row. An easy way to make sure that is possible is to add a list containing
    a maximum of three CourseDTOs, for each row, to the outer list.


    | Property name | Type |

    |---|---|

    | Courses | List<List<CourseDTO>> |


    The second view model is the CourseViewModel, which contains a CourseDTO, an InstructorDTO,
    and a list of ModuleDTOs.


    | Property name | Type |

    |---|---|

    | Course | CourseDTO |

    | Instructor | InstructorDTO |

    | Modules | IEnumerable<ModuleDTO> |


    The third view model is the VideoViewModel, which contains a VideoDTO, an Instructor-DTO,
    a CourseDTO, and a LessonInfoDTO.'
