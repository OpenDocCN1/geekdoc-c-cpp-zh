  md: '# ASP.NET Core 2.0 MVC & Razor Pages for Beginners


    A video can only belong to one module in this scenario. If you want a video to
    be used in multiple modules, you need to implement a many-to-many relationship
    entity between the Video and Module entities. In this application it is sufficient
    that a video only belong to one module and that module can have multiple videos
    associated with it.


    You could also add a CourseId navigation property, to avoid lengthy joins.


    Properties in the Video class:


    | Property | Type | Attribute/Comment |

    | --- | --- | --- |

    | Id | int | Key (primary key in Entity Framework) |

    | Title | string | MaxLength(80) and Required |

    | Description | string | MaxLength(1024) |

    | Thumbnail | string | MaxLength(1024) |

    | Url | string | MaxLength(1024) |

    | Position | int | |

    | Duration | int | |

    | ModuleId | int | Navigation property |

    | Module | Module | Navigation property |

    | CourseId | int | Navigation property |

    | Course | Course | Navigation property |


    The Download Entity

    Properties in the DownloadDTO: DownloadUrl and DownloadTitle.


    Looking back at the Video entity, you can surmise that more properties are needed
    in the Download entity than are defined in its DTO class. It needs a unique id,
    and the same navigation properties as the Video entity, as they are listed with
    the modules.


    Note that the property names don''t have to be the same in the DTO and the entity.
    AutoMapper can be configured to map between properties with different names. By
    default it uses auto-mapping between properties with identical names.'
