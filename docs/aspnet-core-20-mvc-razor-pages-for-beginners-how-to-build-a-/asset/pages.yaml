  md: '# 21. Creating the Database Tables


    # Introduction


    In this chapter, you will create the database tables for storing the video data;
    you have already created the tables for user data in an earlier chapter. Although
    you could have several database contexts for interacting with the database, you
    will continue using the one that you have already created.


    You will also seed the database with initial data after the tables have been created.
    It makes it a little easier for you to follow along as you create the various
    views, because then the views will already contain data that you are familiar
    with.


    When the tables have been created and seeded, you will create a new data repository
    called SqlRepository, using the same IRepository interface that you used when
    adding the MockReadRepository class. When it has been implemented, you will replace
    the MockReadRepository class with the SqlReadRepository class for the IRead-Repository
    service in the ConfigureServices method in the Startup class. This will make the
    application use the data from the database, instead of the mock data.


    # Technologies Used in This Chapter


    +   1. C# – Used when seeding the database and creating the repository.

    2. Entity framework – To create and interact with the new tables from the repository.

    3. LINQ – To query the database tables.


    # Overview


    Your first objective is to create the tables for storing video-related data in
    the database, and seed them with data. The second objective is to create a data
    repository that can communicate with the database tables, and use it instead of
    the existing mock data repository in the Startup class. After implementing these
    two steps, the application will work with live data from the database.'
