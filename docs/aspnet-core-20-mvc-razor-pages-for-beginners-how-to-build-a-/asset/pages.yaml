    # Introduction


    In this chapter, you will add a Dashboard view to the Views/Membership folder.
    It will be rendered by the Dashboard action in the Membership controller. This
    is the first view the user sees after logging in; it lists all the courses the
    user has access to.


    The courses are displayed three to a row, to make the optimal size.


