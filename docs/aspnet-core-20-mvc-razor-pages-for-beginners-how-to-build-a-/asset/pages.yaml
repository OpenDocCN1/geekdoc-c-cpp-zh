    # Adding Seed Data


    To have some data to work with when the tables have been created, you will add
    seed data to them when they have been created. You need to add a class called
    DbInitializer to the Data folder to add seed data.


    The seed data is added using a static method called Initialize, which you will
    need to add to the class.


    If you want the database to be recreated every time migrations are applied, you
    can add the following two code lines at the beginning of the Initialize method.
    This could be useful in certain test scenarios where you need a clean database.
    You will not add them in this exercise because you want to keep the data you add
    between migrations.


    ```

    context.Database.EnsureDeleted();

    context.Database.EnsureCreated();

    ```


    To add data to a table, you create a list of the entity type and instances to
    it. Then you add that to the entity collection (DbSet for that entity), in the
    VODContext class, using the context object passed into the Initialize method.


    Note the order in which you add the seed data is important because some tables
    may be related to other tables and need the primary keys from those tables.


