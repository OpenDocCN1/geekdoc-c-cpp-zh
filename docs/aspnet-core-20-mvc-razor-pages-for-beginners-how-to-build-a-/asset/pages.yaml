  md: '# 10. Setting Up the Solution


    # Introduction


    In this chapter, you will create the solution and install the necessary NuGet
    packages for it in Visual Studio 2017.


    +   - **ASP.NET Core Web Application** – The template used to create the applications.

    - **MVC** – To structure the UI application.

    - **AutoMapper** – A NuGet package that, when installed, will map objects from
    one type to another. Will be used to map entity objects to DTOs.


    # Overview


    The customer you want to build the web applications using Visual Studio 2017,
    ASP.NET Core 2.0, and the **ASP.NET Core Web Application** template. The first
    step will be to create the solution and install all the necessary NuGet packages
    aren''t installed with the default UI project template. The template will install
    the basic MVC plumbing and a **Home** controller with **Index**, **About**, and
    **Contact** action methods, and their corresponding views.


    # Creating the Solution


    If you haven''t already installed Visual Studio 2017 version 15.3.5 version or
    later, you can download a free copy here: https://www.visualstudio.com/downloads.


    +   1. Open Visual Studio 2017 and select **File-New-Project** in the main menu
    to create a new solution.

    2. Click on the **Web** tab and select **ASP.NET Core Web Application** in the
    template list (see image below).

    3. Name the project *VideoOnDemand.Ui* in the **Name** field.

    4. Name the solution *VideoOnDemand* in the **Solution name** field. It should
    not end with *UI*.

    5. Click the **OK** button.

    6. Make sure that **NET Core** and **ASP.NET Core 2.0** are selected in the drop-downs.

    7. Select **Web Application (Model-View-Controller)** in the template list.'
