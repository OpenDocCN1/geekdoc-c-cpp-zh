  md: '# 7. Forms Authentication


    In this chapter, you will learn about ASP.NET Identity and how you can use it
    to implement registration and login in your application. You will add the authentication
    from scratch to learn how all the pieces fit together.


    ASP.NET Identity is a framework that you need to install either with the NuGet
    Manager or by adding it manually in the .csproj file. It can handle several types
    of authentication, but in this chapter, you will focus on Forms Authentication.


    The first thing you need to add is a User class that inherits from an identity
    base class, which gives you access to properties such as Username, PasswordHash,
    and Email. You can add many properties to the User class as you will only use
    some of the inherited properties.


    The User class needs to be plugged into a class called UserStore, provided by
    the Identity framework. It is used when creating and validating a user that then
    is sent to a database; Entity Framework is supported out of the box. You can implement
    your own UserStore, for a different database provider.


    The User class needs to be plugged into an IdentityDb class that handles all communication
    with an Entity Framework-supported database, through an Entity Framework DbContext.
    The way to do this is by making your VideoDbContext inherit from the IdentityDbContext
    instead of the current DbContext class.


    The UserStore and the IdentityDbContext work together to store user information
    and validate against hashed passwords in the database.


    Another class involved in the process is the SignInManager, which will sign in
    a user once the password has been validated. It can also be used to sign out logged
    in users. A cookie is used to handle Forms Authentication sign-in and sign-out.
    The cookie is then sent with every subsequent request from the browser, so that
    the user can be identified.


    The last piece is the Identity Middleware that needs to be configured to read
    the cookie and verify the user.


    The [Authorize] attribute can be applied to a controller to restrict user access;
    a user must be signed in and verified to have access to the actions in that controller.'
