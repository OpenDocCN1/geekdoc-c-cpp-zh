  md: 'ASP.NET Core 2 MVC & Razor Pages for Beginners


    # 27. Custom Button Tag Helper


    Introduction


    In this chapter, you will create a configurable button Tag Helper that will be
    used instead of links in the Razor Pages. The Tag Helper will use attributes and
    attribute values to configure the finished HTML elements, such as the path, Bootstrap
    button style and size, what Glyphicon to display, and the description on the button.
    The ids needed for of the Razor Pages will be assigned dynamically, depending
    on the id attributes that have been added to the Tag Helper. All ids will begin
    with an id prefix, or tag id, if that is the name of the action parameter.


    For example, if the attribute id-course="1" is added to a URL parameter with the
    name courseid will be added to the URL, with a value of 1. If you want to add
    a URL parameter named id with a value of 2, then the Tag Helper should be id="2".


    ```

    <page-button path="Videos/Edit" glyph="pencil" id-courseId="1">

    </page-button>

    ```


    http://localhost:55962/Videos/Edit?courseId=1


    ```

    <page-button path="Videos/Edit" glyph="pencil" id="2\></page-button>

    ```


    http://localhost:55962/Videos/Edit?id=2


    A Tag Helper is created with a C# class that builds the HTML element with C# code.
    It is then inserted into the views as HTML markup.


    The class must inherit from the TagHelper class and implement a method called
    Process, which creates or modifies the HTML element. Tag Helper attributes can
    be added as properties in the class, or dynamically to a collection, adding them
    to the HTML Tag Helper element.


    Technologies Used in This Chapter


    +   1. C# – to create the Tag Helper.

    2. HTML – To create and add the Tag Helper to the Razor Pages.'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'ASP.NET Core 2.0 MVC Razor Pages for Beginners


    # Overview


    Your task is to create a custom Tag Helper page-button. You''ll start with the
    more static approach using strings to pass in values, and then implement a more
    dynamic way of reading attributes and their values. The links could be displayed
    as Bootstrap-styled buttons with a description and/or a Glyphicon.


    You should be able to configure the following with the Tag Helper: add a path,
    a description, use different Bootstrap styles and sizes, and add a Glyphicon name.
    Each value should be represented by a string for use in the class.


    ![](img/4b74569a91d8303eca7672688cf7d979_413_0.png)


    For example, the Tag Helpers would create two buttons. The first would have a
    pencil Glyphicon and the second remove Glyphicon. The first button would be targeting
    the Edit Razor Page for altering a record in the database, and the other would
    target the Delete Razor Page that removes a record from the database. Both will
    use the id attribute to store the record id. This is then added to the URL that
    the button carries, setting it to the code-behind page for that Razor Page. The
    Bootstrap-style determines what color the button will be. The @item.id fetches
    the values in the model''s property and sets it as a value for the


    ```

    <page-button path="Videos/Edit" Bootstrap-style="success" glyph="pencil" id="@item.id"></page-button>

    ```


    ```

    <page-button path="Videos/Delete" Bootstrap-style="danger" glyph="remove" id="@item.id"></page-button>

    ```


    The following Tag Helper would create a button without an id that targets the
    Index Razor Page, which lists all the records in the table. Note that it has an
    information Glyphicon and a Back to List description (see image above).


    ```

    <page-button path="Videos/Index" Bootstrap-style="primary" glyph="info-sign" description="Back
    to List"></page-button>

    ```


    The Tag Helper would create a button without an id that targets the Create Razor
    Page, which is used to add a new record to the table. Note that it only has the
    description Create New and, no Glyphicon.'
