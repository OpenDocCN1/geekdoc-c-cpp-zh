  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nAdding the _Layout View\n\
    \n+   Add a new folder called Shared to the Views folder.\nAdd a MVC View Layout\
    \ Page called _Layout to the Shared folder using the New Item dialog.\nAdd a <footer>\
    \ element at the bottom of the <body> element.\nAdd a call to the @RenderSection\
    \ method to the <footer> element and pass in the name of the section that could\
    \ be of any of the views. If the section to be optional, pass in false for the\
    \ second parameter. Name the section footer and pass in false.\n\n```\n<footer>@RenderSection(\"\
    footer\", false)</footer>\n```\n\nThe complete markup for the _Layout view:\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta name=\"viewport\" content=\"width=device-width\"\
    \ />\n  <title>@ViewBag.Title</title>\n</head>\n<body>\n<div>\n  @RenderBody()\n\
    </div>\n<footer>\n  @RenderSection(\"footer\", false)\n</footer>\n</body>\n</html>\n\
    ```\n\n# Altering the Content Views\n\nNow that the _Layout view has been added,\
    \ you need to remove the markup shared among the <head> and <body> elements, and\
    \ do the same for the other views in the Home folder.\n\nOpen the Index view and\
    \ remove the <head> and <body> elements, and do the same for the other views in\
    \ the Home folder. You can use the Ctrl+E, D keyboard command to format the HTML."
