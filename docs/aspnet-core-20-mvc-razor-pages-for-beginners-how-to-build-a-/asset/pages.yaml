  md: '# ASP.NET Core 2.0 MVC Razor Pages for Beginners


    Adding an Edit View and Its Actions

    There are two more views needed to complete the CRUD operations, the Edit and
    Delete views. Let''s add the Edit view by copying the Create view and modify the
    form. Then let''s refactor the IVideoData interface, and the classes implementing
    it. Instead of saving data when a view is edited or deleted, this refactoring
    will make it possible to add or edit multiple views before saving the changes
    to the database.


    +   1. Copy the Create view and paste it into the Home footer. Rename the view
    Edit.

    2. Visual Studio sometimes gets confused when a view is copied, pasted, and renamed.
