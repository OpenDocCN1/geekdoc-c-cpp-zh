  md: "# ASP.NET Core 2.0 MVC & Razor Pages for Beginners\n\nAdding Properties to\
    \ the LessonInfoDTO Class\nThere is one piece of information that you need to\
    \ add to the LessonInfoDTO and the Membership controller. To avoid displaying\
    \ an empty image container when the user navigates to the last video using the\
    \ Next button in the Coming Up section, the current video's thumbnail should be\
    \ displayed. You therefore have to include the current video's thumbnail and title\
    \ in the LessonInfoDTO class and add that data to the view model in the Video\
    \ action of the Membership controller.\n\n+   1. Open the LessonInfoDTO class.\n\
    2. Add two string properties called CurrentVideoTitle and CurrentVideoThumbnail.\n\
    ```csharp\npublic string CurrentVideoTitle { get; set; }\npublic string CurrentVideoThumbnail\
    \ { get; set; }\n```\n3. Open the Membership controller and locate the Video action.\n\
    4. Assign the thumbnail and title from the video object's Thumbnail and Title\
