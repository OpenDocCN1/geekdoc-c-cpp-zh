- img_proc: true
  md: "# ASP.NET Core 2 MVC Razor Pages for Beginners\n\n+   1. The user sends an\
    \ HTTP request to the server by typing in a URL.\n2. The controller on the server\
    \ handles the request by fetching data and creating a model object.\n3. The model\
    \ object is sent to the view.\n4. The view uses the data to render HTML.\n5. The\
    \ view is sent back to the user’s browser in an HTTP response.\n\n# Routing\n\n\
    The ASP.NET middleware implemented in the previous chapter must be able to route\
    \ incoming HTTP requests to a controller, since you are building an ASP.NET Core\
    \ MVC application. The decision to send the request to a controller action is\
    \ determined by the URL, and the configuration information you provide.\n\nIt\
    \ is possible to define multiple routes. ASP.NET will evaluate them in the order\
    \ they have been added. You can also combine convention-based routing with attribute\
    \ routing if you need. Attribute routing is especially useful in edge cases where\
    \ convention-based routing is hard to use.\n\nOne way to provide the routing configuration\
    \ is to use convention-based routing in the Startup class. With this type of configuration,\
    \ you tell ASP.NET how to find the controller’s name, action’s name, and possibly\
    \ parameter values in the URL. The controller is a C# class, and an action is\
    \ a public method in a controller class. A parameter can be any value that can\
    \ be represented as a string, such as an integer or a GUID.\n\nThe configuration\
    \ can be done with a Lambda expression, as an inline method:\n\n```\napp.UseMvc(routes\
    \ => {\n  routes.MapRoute(\n    name: \"default\",\n    template: \"{controller=Home}/{action=Index}/{id?}\"\
    );\n  );\n});\n```\n\nASP.NET looks at the route template to determine how to\
    \ pull apart the URL. If the URL contains /Home, it will locate the HomeController\
    \ class by convention, because the name begins with Home. If the URL contains\
    \ /Home/Index, ASP.NET will look for a public action called Index inside the HomeController\
    \ class. If the URL contains /Home/Index/123, ASP.NET will look for a public action\
    \ called Index with an Id parameter"
