  md: "ASP.NET Core 2. MVC & Razor Pages for Beginners\n\n+   1. Open the HomeController\
    \ class located in the Controllers folder in the UI project.\n\n+   2. Add the\
    \ following using statements.\nusing Microsoft.AspNetCore.Identity;\nusing VideoOnDemand.Data.Entities;\n\
    using VideoOnDemand.UI.Models;\n\n+   3. Add a constructor that receives the SignInManager\
    \ through dependency injection and stores in a private class-level variable.\n\
    private SignInManager<User> _signInManager;\n\n```\npublic HomeController(SignInManager<User>\
    \ signInMgr)\n{\n    _signInManager = signInMgr;\n}\n```\n\n+   4. Check if the\
    \ user is signed in using the class-level variable you just added, and redirect\
    \ to the Login action in the AccountController class if it's an anonymous user.\
    \ Otherwise open the default Index view, for now. You will change this in later\
    \ chapter.\npublic IActionResult Index()\n{\n    if (!_signInManager.IsInSignedIn(User))\n\
    \        return RedirectToAction(\"Login\", \"Account\");\n\nreturn View();\n\
    }\n\n+   5. Run the application by pressing F5 or Ctrl+F5 (without debugging)\
    \ on the keyboard.\n\n+   6. The login view should be displayed. If you look at\
    \ the URL, it should point to /Account/login on the localhost (your local IIS\
    \ server) because of the RedirectToAction method call."
