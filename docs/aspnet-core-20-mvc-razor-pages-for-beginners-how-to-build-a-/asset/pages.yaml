  md: "# ASP.NET Core 2.0 MVC Razor Pages for Beginners\n\nCreate a Video Player\n\
    \n+   1. Navigate to www.jwplayer.com and sign up for an account, and sign in.\n\
    2. Select the Manage link in the Players section of the menu.\n3. Click the Create\
    \ New Player button to create your video player.\n4. Name the player in the text\
    \ field; you can call it whatever you like.\n5. Select the Responsive radio button\
    \ in the Basic Setup section.\n6. You can change other settings if you want, to\
    \ customize the player marker.\n7. Click the Save button.\n8. Copy the link below\
    \ the demo video player. This is the link that you will add to the _Layout view,\
    \ to get access to the video player.\n\n# Add the Video Player to the Video View\n\
    \n+   1. Open the _Layout view.\n2. Add the link you copied from the JWPlayer\
    \ site to all the <environment> elements at the end of the <body> element.\n3.\
    \ Open the Video view.\n4. Add a Scripts section at the bottom of the view where\
    \ the jwplayer function is called as soon as the page has been loaded into the\
    \ DOM. Note that the jwplayer function name must be written with lowercase characters.\n\
    @section Scripts {\n<script type=\"text/javascript\">\n$(function () {\n    jwplayer(\"\
    video\").setup({\n        file: $(\"#hiddenUrl\").text(),\n        image: $(\"\
    #hiddenImageUrl\").text()\n    });\n});\n</script>\n5. Save all files.\n6. Refresh\
    \ the Video view in the browser. The video image should be visible, and the video\
    \ should start playing if you click on it."
