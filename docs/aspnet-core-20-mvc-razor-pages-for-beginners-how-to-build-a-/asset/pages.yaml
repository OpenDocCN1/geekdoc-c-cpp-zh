  md: '# Overview


    I would like to welcome you to ASP.NET Core 2.0 MVC & Razor Pages for Beginners.
    This book will guide you through creating your very first MVC and Razor Page applications.
    To get the most from this book, you should have a basic understanding of HTML
    and be familiar with C# language.


    ASP.NET Core is a new framework from Microsoft. It has been designed from the
    ground to be fast and flexible and to work across multiple platforms. ASP.NET
    Core is the framework to use for your future ASP.NET applications.


    The first application you build will evolve into a basic MVC application, starting
    with an empty template. You will add the necessary pieces one at a time to get
    a good understanding of how things fit together. The focus is on installing and
    configuring middleware, services, and other frameworks. Styling with CSS is not
    a priority in this application; you''ll learn more about it in the second application
    you build.


    You will install middleware to create a processing pipeline, and then look at
    the MVC you are already familiar with MVC or Web API from previous versions of
    ASP.NET, you will notice some similarities.


    There still are model classes, which are used as data carriers between the controller
    and its views. There are, however, many new features that you will learn, such
    as Tag Helpers and view components. You will also work with Entity Framework to
    store and retrieve data, implement authentication with ASP.NET Identity framework,
    install CSS libraries such as Bootstrap, and install JavaScript libraries like
    jQuery. Note that dependency injection is a first-class design pattern.


    The second solution you create will contain three projects: one for the database
    and services (referenced from the other projects), one MVC project for the user
    UI, and one Razor Page project for the administrator UI. Pre-existing MVC and
    Razor Page templates will be used for the two UI projects, and an empty template
    will be used for the database project.


    You will modify the database support installed by the templates to instead target
    the database created by the database project. Only minor modifications will be
    made to the authentication and routing provided by the templates.'
  merge: -1
  pgno: 18
