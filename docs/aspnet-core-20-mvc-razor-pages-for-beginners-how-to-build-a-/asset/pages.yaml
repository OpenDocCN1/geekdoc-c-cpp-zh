    This is the Index footer rendered by the _Layout view.


    # _ViewImports file


    The Razor view engine has a convention that looks for a file called _ViewImports.cshtml.
    This file is executed before any other views, but it has no HTML output. You can
    use this file to add using statements that will be used by all the views; this
    removes code duplication and cleans up the views.


    So, if you know that many views use the same namespaces, then add them to the
    _ViewImports.cshtml file. Add the file to the Views folder.


