  md: '# 25. The Administrator Dashboard


    Introduction


    In this chapter, you will create an Admin dashboard with links to all Index Razor
    Pages associated with the entities you have added. Since you know that a folder
    for pages should have the same name as its corresponding entity, the dashboard
    items can be added before the actual folders and pages have been created.


    You will create the dashboard using two partial views, one for the dashboard called
    _DashboardPartial and one for its items (cards) called _CardPartial. The dashboard
    partial view is rendered in the main Index page located in the Pages folder and
    will be restricted to logged users. The partial views are loaded with the PartialAsync
    method located in the Html class.


    You will also remove the About and Contact links and pages, and change the text
    to Dashboard for the Home link. Then you will move the menu into a partial view
    named _MenuPartial and render it from the _Layout view. Then you will restrict
    the menu to logged in users who belong to the Admin role.


