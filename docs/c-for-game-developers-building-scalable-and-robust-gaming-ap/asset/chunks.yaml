    \ <AL/al.h>\n#include <AL/alc.h>\nint main() {\n  ALCdevice device = alcOpenDevice(nullptr);\n\
    \  ALCcontext context = alcCreateContext(device, nullptr);\n  alcMakeContextCurrent(context);\n\
    \  ALuint buffer, source;\n  alGenBuffers(1, &buffer);\n  alGenSources(1, &source);\n\
