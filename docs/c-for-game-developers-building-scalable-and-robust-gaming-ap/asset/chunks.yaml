    collection         if (sf::Keyboard::isKeyPressed(sf::Keyboard::Space)) {           sf::Vector2f
    playerPos = player.getPosition();           sf::Vector2f itemPos = item.getPosition();           float
    distance = std::sqrt((playerPos.x - itemPos.x) * (playerPos.x - itemPos.x) +                        (playerPos.y
    - itemPos.y) * (playerPos.y - itemPos.y));           if (distance < 50.0f) {             player.collectItem();             item
    = Item(rand() % 700 + 50, rand() % 500 + 50); // Move item to a new random position           }         }         //
