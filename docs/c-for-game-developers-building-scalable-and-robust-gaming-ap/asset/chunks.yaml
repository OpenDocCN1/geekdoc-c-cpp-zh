    2, 3, 4, 5, 6, 7, 8, 9, 10};       int* deviceArray;       cudaMalloc((void**)&deviceArray,
    arraySize * sizeof(int));       cudaMemcpy(deviceArray, hostArray, arraySize *
    sizeof(int), cudaMemcpyHostToDevice);       // Define block and grid dimensions       dim3
    blockSize(256);       dim3 gridSize((arraySize + blockSize.x - 1) / blockSize.x);       //
    Launch the kernel on the GPU       gpuKernel<<<gridsize_ _="" span="">blockSize>>>(deviceArray,
    arraySize);</gridsize_>       // Copy the results back to the host       cudaMemcpy(hostArray,
    deviceArray, arraySize * sizeof(int), cudaMemcpyDeviceToHost);       // Output
    the modified array       std::cout << "Modified Array: ";       for (int i = 0;
    i < arraySize; ++i) {         std::cout << hostArray[i] << " ";       }       std::cout
