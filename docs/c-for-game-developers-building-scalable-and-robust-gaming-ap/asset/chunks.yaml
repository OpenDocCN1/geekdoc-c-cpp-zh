    \ Using State Machines\nAn agent’s behavior is modeled by finite state machines,\
    \ a basic idea in artificial intelligence, as a collection of states, and actions.\
    \ An example of a simple `NPC` using FSM is shown below:\n\n```cpp\n#include <iostream>\n\
    enum class State { Idle, Patrol, Chase };\nclass NPC {\nprivate:\n  State currentState;\n\
    public:\n  NPC() : currentState(State::Idle) {}\n  void update() {\n    switch\
    \ (currentState) {\n      case State::Idle:\n        std::cout << \"NPC is idling.\\\
    n\";\n        if (rand() % 100 < 30) currentState = State::Patrol;\n        else\
    \ if (rand() % 100 < 30) currentState = State::Chase;\n        break;\n      //\
    \ ... other states\n    }\n  }\n};\n```\n\n#### Decision-Making with Behavior\
    \ Trees\nBehavior Trees give gaming characters a hierarchical framework for making\
    \ decisions. We’ll construct an `NPC` class in this example, and it will use a\
    \ Behavior Tree to make decisions:\n\n```cpp\n#include <iostream>\nenum class\
    \ Action { MoveTo, Attack, Idle };\nclass BehaviorNode {\npublic:\n  virtual Action\
    \ evaluate() = 0;\n};\nclass SequenceNode : public BehaviorNode {\nprivate:\n\
    \  BehaviorNode* left;\n  BehaviorNode* right;\npublic:\n  SequenceNode(BehaviorNode*\
    \ left, BehaviorNode* right) : left(left), right(right) {}\n  Action evaluate()\
    \ override {\n    Action result = left->evaluate();\n    if (result != Action::Idle)\
    \ result = right->evaluate();\n    return result;\n  }\n};\n```\n\n#### Reactive\
    \ AI for Dynamic Interactions\nNPCs can react dynamically to player actions and\
