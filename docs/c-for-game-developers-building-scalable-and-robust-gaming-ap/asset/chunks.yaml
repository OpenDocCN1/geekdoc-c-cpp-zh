    to play. Jarrel E.  Contents Foreword Preface Acknowledgement I. INTRODUCTION
    TO C++ IN GAME DEVELOPMENT Understanding the Fundamentals of C++ II. GAME DEVELOPMENT
    FOUNDATIONS Essential Game Development Tools Design Patterns for Game Development III.
