    {     public:       virtual void onEvent() = 0;     };     class EventHandler
    {     private:       std::vectorobservers;     public:       void addObserver(EventObserver*
    observer) {         observers.push_back(observer);       }       void notifyObservers()
    {         for (EventObserver* observer : observers) {           observer->onEvent();         }       }       void
    simulateEvent() {         std::cout << "Event occurred!\n";         notifyObservers();       }     };     class
    ExampleObserver : public EventObserver {     public:       void onEvent() override
    {         std::cout << "ExampleObserver received the event!\n";       }     };     int
    main() {       EventHandler eventHandler;       ExampleObserver exampleObserver;       //
    Add observer to the event handler       eventHandler.addObserver(&exampleObserver);       //
    Simulate an event       eventHandler.simulateEvent();       return 0;     }       In
    this example, the EventObserver class defines the interface for observers, and
    the EventHandler class manages the observers and notifies them when an event occurs.      User
