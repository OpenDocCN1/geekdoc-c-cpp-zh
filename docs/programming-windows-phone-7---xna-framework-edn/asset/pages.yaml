  md: "# 118 Part I The Basics\n\n```\nargs.Complete();\nargs.Handled = true;\n\n\
    ```\n\nThe MainPage class also overrides OnNavigatedTo so it can retrieve the\
    \ stored color and set it to the background of the grid.\n\nSilverlight Project:\
    \ SilverlightShareData File: MainPage.xaml.cs (excerpt)\n\n```\nprotected override\
    \ void OnNavigatedTo(NavigationEventArgs args)\n\nColor? sharedColor = (Application.Current\
    \ as App).SharedColor;\n\nif (sharedColor != null)\n    ContentPanel.Background\
    \ =\n        new SolidColorBrush(sharedColor.Value);\n\nbase.OnNavigatedTo(args);\n\
    \n```\n\nAs you navigate between the pages they all share the same color.\n\n\
    Using the App class as a repository for shared data among pages is so convenient\
    \ that you might find yourself using it exclusively. But you should really consider\
    \ more structured solutions that involve only the pages navigating between each\
    \ other and not some third-party class like App.\n\nBesides the OnNavigatedTo\
    \ virtual method, Page also defines an OnNavigatedFrom method, which first seems\
    \ much less useful. After all, a page knows it's navigating from itself because\
    \ it's just called Navigate or GoBack.\n\nHowever, both OnNavigatedFrom and OnNavigatedTo\
    \ have event arguments of type NavigationEventArgs, which defines two properties:\
    \ Uri of type Uri, and Content of type object. These always indicate the page\
    \ being navigated to.\n\nFor example, MainPage calls Navigate with argument \"\
    SecondPage.xaml\". The OnNavigatedFrom method in MainPage is called with event\
    \ arguments a Uri property indicating \"SecondPage.xaml\" and a Content property\
    \ of type SecondPage. This is the newly created instance of SecondPage that is\
    \ about to be displayed, which is the most convenient way to obtain that. The\
    \ OnNavigatedTo method of MainPage is then called with the same event arguments\
    \ indicating a Uri of \"/SecondPage.xaml\" and the SecondPage object.\n\nSimilarly,\
    \ when SecondPage calls GoBack, its OnNavigatedFrom method is called with event\
    \ arguments that include a Uri property indicating \"/MainPage.xaml\" and a Content\
    \ property with the MainPage instance. The OnNavigated method of MainPage is then\
    \ called with those same event arguments."
