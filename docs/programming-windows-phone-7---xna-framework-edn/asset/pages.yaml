  md: 'In computer graphics, however, areas are traditionally filled based on horizontal
    scan lines, also known as raster lines. (The terms come from television displays.)
    This straight line equation represents x as a function of y:


    ```

    x = ay + b

    ```


    For a line pt1 to pt2,


    ```

    pt2X - pt1X

    pt2Y - pt1Y

    ```


    ```

    b = pt1X - a · pt1Y

    ```


    For any y, there is a point on the line that connects pt1 and pt2 if y is between
    pt1.Y and pt2.Y. The x value can be calculated from the equations of the line.


    Look at the previous diagram and imagine a horizontal scan that crosses these
    two lines from pt1 to pt2a, and from pt1b to pt2b. For any y, we can calculate
    xa on the line from pt1a to pt2a, and xb on the line from pt1b to pt2b. For that
    scan, the pixels must be colored are between (xa, y) and (xb, y). This can be
    repeated for all y.


    This process gets a little messier for the rounded caps but not much messier.
    A circle of radius R centered on the origin consists of all points (x, y) that
    satisfy the equation:


    ```

    x² + y² = R²

    ```


    For a circle centered on (xc, yc), the equation is:


    ```

    (x - xc)² + (y - yc)² = R²

    ```


    For any y:


    ```

    x = xc ± R² - (y - yc)²

    ```


    If the square root is negative, then y is outside the circle entirely. Otherwise,
    there are (in general) two values of x for each y. The only exception is when
    the square root is zero, that is, when y is exactly R units from yc, which are
    the top and bottom points of the circle.


    We''re dealing with a semicircle so it''s a little more complex, but not much.
    Consider the semi-circle at the top of the diagram. The center is pt1, and the
    semicircle from pt1 to pt1a. The line from pt1 to pt1b forms an angle1 that can
    be calculated with Math.Atan2. Similarly for the line from pt1 to pt1 there is
    an angle2. If the point (x, y) is on the circle as calculated above, it forms
    an angle from the center pt1. If the angle is between angle1 and angle2, then
    the point is on the semicircle. (This determination of “between” gets just a little
    messier because angles returned from Math.Atan2 wrap around pi to—π.).'
