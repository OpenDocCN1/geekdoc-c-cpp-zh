    # Silverlight and Dynamic Layout


    If you run the SilverlightHelloPhone program from the last chapter, and you turn
    the phone or emulator sideways, you will discover that the display doesn''t change
    to accommodate the new orientation. That''s easy to fix. In the root ApplicationPage
    tag, of MainPage.xaml change the attribute


    ```

    SupportedOrientations="Portrait"

    ```


    to:


    ```

    SupportedOrientations="PortraitOrLandscape"

    ```


    SupportedOrientations is a property of ApplicationPage. It''s set to a member
    of the SupportedPageOrientation enumeration, either Portrait, Landscape, or PortraitOrLandscape.


    Recompile. Now when you turn the phone or emulator sideways, the contents of the
    page shift accordingly:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_45_0.png)


    The SupportedOrientations property also allows you to restrict your program to
    Landscape you need to.


