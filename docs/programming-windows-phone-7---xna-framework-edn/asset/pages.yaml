  md: '# Charles Petzold


    Charles Petzold has been writing programming for Windows-based operating systems
    for 24 years. His books include Programming Windows (5th edition, Microsoft Press,
    1998) and six books about .NET programming, including 3D Programming for Windows:
    Three-Dimensional Graphics Pro-gram for the Windows Presentation Foundation (Microsoft
    Press, 2007). He is also the author of two unique books that explore the intersection
    of computing technology, mathematics, and history: Code: The Hidden Language of
    Computer Hardware and Software (Microsoft Press, 1999) and The Annotated Turing:
    A Guided Tour though Alan Turing’s Historic Paper on Computability and the Turing
    Machine (Wiley, 2008). Petzold lives in New York City. His website is www.charlespetzold.com.'
