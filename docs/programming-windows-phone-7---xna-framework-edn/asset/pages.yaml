    Because the GeoCoordinateWatcher left running for the duration of the program,
    it should update the location as the phone is moved. Here''s where I live:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_112_0.png)


    With the phone emulator, however, the GeoCoordinateWatcher program might not work.
    With some beta software releases of Windows Phone 7 development tools, the Accelerometer
    always returned the coordinates of a spot in Princeton, New Jersey, perhaps as
    a subtle reference to the college where Alan Turing earned his PhD.


    # Using a Map Service


    Of course, most curious people about their location prefer to see a map rather
    than numeric coordinates. The Silverlight demonstration of the location service
    displays a map that comes to the program in the form of bitmaps.


    In a real application, you''d probably be using Bing Maps, particularly considering
    the existence of a Bing Maps Silverlight control tailored for the phone. Unfortunately,
    making use of Bing Maps in a program involves opening a developer account, getting
    a map key and a developer token. all free and straightforward but it doesn''t
    work well for a program that will be shared among all the readers of a book.


    For that reason, I''ll be using an alternative that doesn''t require keys or tokens.
    This alternative is Microsoft Research Maps, which you can learn about at msmaps.com.
    The aerial images are provided by the United States Geological Survey (USGS).
    Microsoft Research Maps makes these images available through a web service called
    MSR Maps, but still sometimes referred to by its old name of TerraService.


    The downside is that the images are not quite state-of-the-art and the service
    doesn''t seem entirely reliable.


    MSR Maps Service is a SOAP (Simple Object Access Protocol) service with the transactions
    described in a WSDL (Web Services Description Language) file. Behind the scenes,
    all the'
  merge: -1
