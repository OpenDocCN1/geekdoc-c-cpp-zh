  md: "# Chapter 1 Hello, Windows Phone 7 17\n\ntext in the center of the page apart\
    \ from the titles. The area of the program content is the Grid towards the bottom\
    \ of the file preceded by the comment \"ContentPanel - place additional content\
    \ here.\" This Grid has a name of \"ContentPanel\" and I'm going to refer to it\
