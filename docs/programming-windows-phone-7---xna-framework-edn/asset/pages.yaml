  md: "# Xna Tombstoning and Settings\n\nXNA applications aren’t normally built around\
    \ pages like Silverlight applications. If you wanted, you could potentially implement\
    \ your own page-like structure within an XNA program. You’ll recall that the state\
    \ of the phone’s Back button is checked during every call to the standard Update\
    \ override. You can use this logic for navigational purposes as well as terminating\
    \ the program. But that's something I'll let you out on your own.\n\nAn XNA program\
    \ can also make use of the same PhoneApplicationService class used by Silverlight\
    \ programs for saving transient state information during tombstoning. An XNA program\
    \ can also use this class to install handlers for the four PhoneService events:\
    \ Launch, Activated, Deactivated, and Closing. You’ll need references to the Microsoft.Phone\
    \ library (for PhoneApplicationService itself) and System.Windows (for the IApplicationService\
    \ interface that PhoneApplicationService implements). Within the Game1.cs file\
    \ you’ll want a using directive for Microsoft.Phone.Shell.\n\nIn the constructor\
    \ of the Game1 class you can obtain the PhoneApplicationService instance associated\
    \ with the application through the static PhoneApplicationService.Current property.\n\
    \nThe Game class also defines a couple handy virtual methods named Activated and\
    \ OnDeactivated that are also useful for handling tombstoning. The Activated method\
