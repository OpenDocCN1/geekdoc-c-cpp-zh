  md: '# Introduction


    > **Important** This book and Microsoft Silverlight Edition: Programming Windows
    Phone 7 are fully indexed, print-book versions of a single free, electronic edition
    titled Programming Windows Phone 7, which you can find on the Microsoft Press
    blog: http://blogs.msn.com/b/microsoft_press/; No changes have been made to the
    original edition''s text, including references to the color of the original images,
    which appear black and white in this book. What follows is the Introduction that
    originally appeared in *Programming Windows Phone 7*; “Code Samples” is the only
    section in this Introduction that has been updated.


    This book is a gift from the Windows Phone 7 team at Microsoft to the programming
    community, and I am proud to have been a part of it. Within the pages that follow,
    I show you the basics of writing applications for Windows Phone 7 using the C#
    programming language with Silverlight and XNA frameworks.


    Programming Windows Phone 7 is truly a free download, but for those who still
    love paper—as I certainly do—this book will also be available (for sale) divided
    into two fully-indexed print editions: Silverlight Edition: Programming Windows
    Phone 7 and Microsoft XNA Framework Edition: Programming Windows Phone 7.


    With the money you''ve saved downloading this book, please buy other books. Despite
    the plethora of information available online, books are still the best way to
    learn about programming within a coherent and cohesive tutorial narrative. Every
    book sale brings a tear of joy to an author''s eye, so please help them weep overflowing
    rivers.


    In particular, you might want to buy other books to supplement the material in
    this book. For example, barely mentioning Web services in this book, a serious
    deficiency Web services are likely to become increasingly important in Windows
    Phone 7 applications. My coverage of XNA is limited to 2D graphics and I hope
    to add several 3D chapters in the next edition of this book, I do not really get
    into the whole XBOX LIVE community of game development. Nor do I discuss any programming
    tools beyond Visual Studio—not ever Expression Blend.


    My publisher Microsoft Press has two additional Windows Phone 7 books coming soon:
    *Windows Phone 7 Silverlight Development Step* by Andy Wigley & Peter Foot offers
    a more tools-oriented approach. Although Michael Shor''s *Windows Phone 7 Plain
    & Simple* is a guide to using the phone rather than developing for it, I suspect
    it will give developers some insights and ideas.


    Moreover, I also hear that my old friend Doug Boling is working on a Windows Phone
    7 enterprise-programming book that is likely to be considered his masterpiece.
    Be sure to check that out.'
  merge: -1
