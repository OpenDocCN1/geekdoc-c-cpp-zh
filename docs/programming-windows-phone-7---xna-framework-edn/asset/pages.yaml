  md: "# Chapter 8 Textures and Sprites 181\n\nYou'll notice a speed in terms of laps,\
    \ the instantiation of the mysterious PolylineInterpolator class. The LoadContent\
    \ method is very much like that in the previous project instead of adding an array\
    \ called turnPoints, it adds them to a Vertices property of the PolylineInterpolator\
    \ class:\n\nXNA Project: CarOnPolylineCourse File: Game1.cs (excerpt)\n\n```\n\
    protected override void LoadContent()\\{\n    spriteBatch = new SpriteBatch(GraphicsDevice);\n\
    \    var car = this.Content.LoadTexture2D(\"Car\");\n    carCenter = new Vector2(car.Width\
    \ / 2, car.Height / 2);\n    float margin = car.Width;\n    Viewport viewport\
    \ = this.GraphicsDevice.Viewport;\n\n    polylineInterpolator.Vertices.Add(\n\
    \        new Vector2(car.Width, car.Width));\n    polylineInterpolator.Vertices.Add(\n\
    \        new Vector2(viewport.Width - car.Width, car.Width));\n    polylineInterpolator.Vertices.Add(\n\
    \        new Vector2(car.Width, viewport.Height - car.Width));\n    polylineInterpolator.Vertices.Add(\n\
    \        new Vector2(viewport.Width - car.Width, viewport.Height - car.Width));\n\
    \    polylineInterpolator.Vertices.Add(\n        new Vector2(car.Width, car.Width));\n\
    }\n```\n\nAlso note that this method adds the beginning point again in the end,\
    \ and these points don't exactly describe the same course as the previous project.\
    \ The previous project caused the car to travel from the upper-left to the upper-right\
    \ down lower-right and across to the lower-left and back up upper-left. The order\
    \ goes from upper-left to upper-right but then diagonally down to lower-left and\
    \ across to lower-right before another diagonal up to the beginning. This is precisely\
    \ the kind of versatility the previous program lacked.\n\nAs with the programs\
    \ in the last chapter that used parametric equations, the Update is now so simple\
    \ it makes you to weep:\n\nXNA Project: CarOnPolylineCourse File: Game1.cs (excerpt)\n\
    \n```\nprotected override void Update(GameTime gameTime)\\{\n    if (GamePad.GetState(PlayerIndex.One).Buttons.Back\
    \ == ButtonState.Pressed)\n        this.Exit();\n\n    float t = (SPEED * (float)gameTime.TotalGameTime.TotalSeconds)\
    \ % 1;\n    float angle;\n```"
