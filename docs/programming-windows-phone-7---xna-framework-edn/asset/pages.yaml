  md: '# Part I The Basics


    Here it is:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_84_0.png)


    This is certainly easy enough, and pulling images off the Web rather than binding
    them into the application certainly keeps the size of the executable down. But
    an application running on Windows Phone 7 is not guaranteed to have an Internet
    connection, and you''re undoubtedly associated with other problems associated
    with downloading. The Image element has two events named ImageOpened and ImageFailed
    that you can use to determine if the download was successful or not.


    For Windows Phone 7 programs that display a list of bitmaps, you will need to
    do some hard thinking. You can embed the bitmaps into the executable and have
    their access guaranteed, or you can save and download them when necessary.


    In XNA, downloading a bitmap from the Web is not quite as easy, but a .NET class
    named WebClient makes the job relatively painless. It''s somewhat easier to use
    the common alternative (HttpWebRequest and HttpWebResponse) and is often the preferred
    choice for downloading individual items.


    You can use WebClient to download either strings (commonly XML files) or binary
    objects. The actual transfer occurs asynchronously and then WebClient calls a
    method in your program to indicate completion or failure. This call is in your
    program''s thread, so you get the benefit of an asynchronous data transfer without
    explicitly dealing with secondary threads.'
