  md: '# Chapter 2 Getting Oriented


    # 45


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_59_0.png)


    Silverlight program often doesn’t seem to draw at all! Deep inside of Silverlight
    is a visual composition layer that operates in a retained graphics mode and organizes
    all the visual elements into a composite whole. Elements such as TextBlock exist
    as actual entities inside this composition layer. At some point, TextBlock is
    rendering itself—and re-rendering itself when one of its properties as Text changes—but
    what it is retained along with the rendered output of all the other elements in
    the visual tree.


    In contrast, an XNA program is actively drawing during every frame of the video
    display. This is conceptually different from older Windows programming environments
    as well as Silverlight. It is very powerful, but I''m sure you know quite well
    must also come with great power.


    Sometimes an XNA program''s display is static; the program might not need to update
    the display every frame. To conserve power, it is possible for the Update method
    to call the SuppressDraw method defined by the Game class to include a corresponding
    call to Draw. The Update method will still be called 30 times per second because
    it needs to check for user input, but if the code in Update calls SuppressDraw,
    Draw won''t be called during cycle of the game loop. If it in Update calls SuppressDraw,
    Draw will be called.


    An XNA clock program doesn''t need a timer because a timer is effectively built
    into the normal game loop. However, the clock I want to code here won''t display
    milliseconds so the display only needs to be updated every second. For that reason
    it uses the SuppressDraw method to inhibit superfluous Draw calls.'
