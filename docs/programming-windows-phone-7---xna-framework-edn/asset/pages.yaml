  md: '# Part II XNA


    This is a type of smoothing known as a *low-pass filter*. High-frequency jitter
    is eliminated by averaging the value with earlier values. If $v_0$ is the current
    raw vector reading (newAcceleration), and $v_1$ is the previous raw reading, and
    $v_{-2}$ is the raw reading before that, then the smoothed value is:


    ```

    $v = \frac{v_0}{2} + \frac{v_1}{4} + \frac{v_{-2}}{8} + \frac{...}{16} + \dots$

    ```


    The influence of each reading is iteratively halved as it recedes further into
    the past. In theory, no reading ever stops affecting the smoothed value, but one
    second after a particular reading (or 30 calls to the *Update override*) the denominator
    on that reading is approximately one million, so the influence is very small.


    You can adjust the weights between the old and the new but they must sum to 1.
    For example, this *avgAcceleration* smoothing placing less against the earlier
    values:


    ```

    Vector3 avgAcceleration = 0.25f * oldAcceleration + 0.75f * newAcceleration;

    ```


    This provides more smoothing:


    ```

    Vector3 avgAcceleration = 0.75f * oldAcceleration + 0.25f * newAcceleration;

    ```


    In the blog entry I mentioned earlier, Dave Edson expresses the low-pass filter
    slightly differently. Using my variable names, his formula is


    ```

    Vector3 avgAcceleration = oldAcceleration + alpha * (newAcceleration - oldAcceleration);

    ```


    where alpha ranges from 0 (smoothing to oblivion) to 1 (no smoothing at all).
    That blog entry also discusses alternatives to low-pass filtering when a program
    might be interested in sudden changes or jerks.


    The other interesting activity of *Update* involves compensating for the two different
    landscape orientations, which are ultimately based on the accelerometer vector.
    Suppose the phone is in *LandscapeLeft*:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_368_0.png)'
