  md: '# Part II XNA


    How are these corner points calculated? Well, it''s really easy using vectors.
    Let''s calculate the normalized vector from pt1 to pt2 and normalize it:


    ```

    Vector2 vector = Vector2.Normalize(pt2 - pt1);

    ```


    This vector must be rotated in 90 degrees, and that''s a snap. To rotate vector
    by 90 degrees clockwise, switch the X and Y while negating the Y coordinate:


    ```

    Vector2 vector90 = new Vector2(-vector.Y, vector.X)

    ```


    A vector rotated -90 degrees from vector is the negation of vector90.


    If vector points from pt1 to pt2, then the vector from pt1 to pt1a (for example)
    is that vector rotated -90 degrees with a length of R. Then that vector from pt1
    to get get pt1a.


    ```

    Vector2 pt1a = pt1 - R * vector90;

    ```


    In a similar manner, you can also calculate pt1b, pt2a, and pt2b.


    But as you saw before, the rectangle is not sufficient for thick lines that join
    at angles. To avoid those slivers seen earlier, you really need to draw rounded
    caps on these rectangles:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_232_0.png)


    These are semi-circles of radius R centered on pt1 and pt2.


    At this point, we have derived an overall outline of the shape to draw for two
    successive points: A line from pt1a to pt2a, a semi-circle from pt2a to pt2b,
    another line from pt2b to pt1b, and another semi-circle from pt1b to pt1a. The
    goal is to fill all pixels (x, y) in the interior of this outline.


    When drawing vector outlines, parametric equations are ideal. When filling areas,
    it''s best to go back to the standard equations that we learned in school. You
    probably remember the equations for a line in slope-intercept form:


    ```

    y = mx + b

    ```


    where m is the slope of the line (“rise over run”) and b is the value of y where
    the line intercepts the Y axis.'
