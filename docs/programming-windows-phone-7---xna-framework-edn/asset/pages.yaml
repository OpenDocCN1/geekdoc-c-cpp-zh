- img_proc: true
  md: '# Part I The Basics


    The magnitude of the vector (x, y, z) is calculable from the three-dimensional
    form of the Pythagorean Theorem:


    Magnitude = $\sqrt{x^2 + y^2 + z^2}$


    For working with the accelerometer, you can imagine the phone as defining a three-dimensional
    coordinate system. No matter how the phone is oriented, the positive Y axis points
    from the bottom of the phone (with the buttons) to the top, the positive X axis
    points from left to right,


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_98_0.png)


    This is a traditional three-dimensional coordinate system, the same coordinate
    system used in XNA3D programming. It''s termed a right-hand coordinate system:
    Point the index finger of your right hand to increasing X, the middle finger to
    increase Y, and your thumb points to increasing Z. Or, curve the fingers of your
    right hand from the positive X axis to the positive Y axis. Your thumb again points
    to increasing Z.


    This coordinate system remains fixed-relative to the phone regardless of how you
    hold the phone, and regardless of the orientation of any programs running on the
    phone. In fact, as you might expect, the accelerometer is the basis for performing
    orientation changes of Windows Phone 7 applications.


    When the phone is still, the accelerometer vector points towards the Earth. The
    magnitude is 1, meaning 1 g, which is the force of gravity on the earth''s surface.
    When holding your phone in the upright position, the acceleration vector is (0,
    -1, 0), that is, straight down.'
