  md: "# Chapter 9 Dynamic Textures 207\n\n```\nnamespace Petzold.Phone.Xna\n{\n \
    \   public class LineRenderer\n    {\n        RenderTarget2D lineTexture;\n\n\
    \        public LineRenderer(GraphicsDevice graphicsDevice)\n        {\n     \
    \       lineTexture = new RenderTarget2D(graphicsDevice, 2, 3);\n\n          \
    \  graphicsDevice.SetRenderTarget(lineTexture);\n            graphicsDevice.Clear(Color.white);\n\
    \            graphicsDevice.SetRenderTarget(null);\n        }\n\n        public\
    \ void DrawLine(SpriteBatch spriteBatch,\n            Vector2 point1, Vector2\
    \ point2,\n            float thickness, Color color)\n        {\n            Vector2\
    \ difference = point2 - point1;\n            float length = difference.Length();\n\
    \            float angle = (float)Math.Atan2(difference.Y, difference.X);\n  \
    \          sprite.Draw(lineTexture, point1, null, color, angle,\n            \
    \    new Vector2(0, 1),\n                new Vector2(length / 2, thickness / 3),\n\
    \                SpriteEffects.None, 0);\n        }\n    }\n}\n```\n\nThe constructor\
    \ creates the small white RenderTarget2D. The DrawLine method requires an argument\
    \ of type SpriteBatch and calls the Draw method on that object. Notice the scaling\
    \ factor, which is the 7th argument to Draw call. The width of the RenderTarget2D\
    \ is 2 pixels, so horizontal scaling is half the length of the line. The height\
    \ of the bitmap is 3 pixels, so the vertical scaling is the line thickness divided\
    \ by 3. I chose a height of 3 so the line always straddles the geometric point\
    \ regardless of how thick it is.\n\nTo use this in any projects, you will need\
    \ to build the library project. Then, in any regular XNA project, you can right-click\
    \ the References section in the Solution Explorer and select Add Reference. In\
    \ the Add Reference dialog select the Browse label. Navigate to the directory\
    \ with Petzold.Phone.Xna.dll and select it.\n\nIn the code file you'll need a\
    \ using directive:\n\n```\nusing Petzold.Phone.Xna;\n```\n\nYou'll probably create\
    \ a LineRenderer object in the LoadContent override and then call DrawLine in\
    \ the Draw override, passing to the SpriteBatch object you're using to draw other\
    \ 2D graphics."
