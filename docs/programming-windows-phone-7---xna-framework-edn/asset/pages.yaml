- img_proc: true
  md: '# Part II XNA


    red, green, and blue values and another byte for the alpha channel, which is the
    opacity of that pixel.


    It is also possible (and very convenient) to treat each pixel as a 32-bit unsigned
    integer, which in C# is a uint. The colors appear in the 8-bit hexadecimal value
    of this uint like so:


    AABBGGGR


    Each letter represents four bits. If you have a Texture2D that you loaded as content
    or created as above, it has a Format property of SurfaceFormat.Color, you can
    obtain all the pixels of the bitmap by first creating an array of type uint large
    enough to encompass all pixels


    ```

    uint[] pixels = new uint[texture.width * texture.height];

    ```


    You then transfer all the pixels of the Texture2D into the array like:


    ```

    texture.GetData<uint>(pixels);

    ```


    GetData is a generic method and you simply need to indicate the data type of the
    array. Overloads of GetData allow you to get pixels corresponding to a rectangular
    subset of the bitmap, or by starting at an offset in the pixels array.


    Because RenderTarget2D derives from Texture2D you can use this technique with
    RenderTarget2D objects as well.


    You can also go the other way to transfer the data in the pixels array back into
    the bitmap:


    ```

    texture.Set<uint>(pixels);

    ```


    The pixels in the pixels array are arranged by row beginning with the topmost
    row. The pixels in each row are arranged left by right. For a particular row y
    and column x in the bitmap, you can index the pixels array using a simple formula:


    ```

    pixels[y * texture.width + x]

    ```


    One exceptionally convenient property of the Color structure is PackedValue. This
    converts a Color object into a uint of the precise format required for this array,
    for example:


    ```

    pixels[y * texture.width + x] = Color.Fuchsia.PackedValue;

    ```


    In fact, Color and uint are so closely related that you can alternatively create
    a pixels array of type Color:


    ```

    Color[] pixels = new Color[texture.Width * texture.Height];

    ```


    You can then use this array with GetData


    ```

    texture.GetData<Color>(pixels);

    ```'
