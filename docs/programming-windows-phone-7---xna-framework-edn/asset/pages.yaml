    To nail down the mathematics, it will be easier to first assume that the original
    image we’re trying to transform is 1 pixel wide and 1 pixel tall. We want a transform
    that produces the following mappings from the corners of the image to three arbitrary
    points:


    +   (0,0) → (x_0, y_0)

