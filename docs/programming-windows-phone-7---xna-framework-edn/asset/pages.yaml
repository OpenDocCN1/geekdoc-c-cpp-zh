- img_proc: true
  md: '# Chapter 5 Sensors and Services


    The GeoCoordinateWatcher constructor optionally takes a member of the GeoPositionAccuracy
    enumeration:


    +   - Default

    - High


    After creating a GeoCoordinate object, you''ll want to install a handler for the
    PositionChanged event and call Start. The PositionChanged event delivers a GeoCoordinate
    object that has eight properties:


    +   - Latitude, a double between -90 and 90 degrees

    - Longitude, a double between -180 and 180 degrees

    - Altitude of type double

    - HorizontalAccuracy and VerticalAccuracy of type double

    - Course, a double between 0 and 360 degrees

    - Speed of type double

    - IsUnknown, a Boolean that is true if the Latitude or Longitude is not a number


    If the application does not have permission to get the location, then Latitude
    and Longitude will be Double.NaN, and IsUnknown will be true.


    In addition, GeoCoordinate has a GetDistanceTo method that calculates the distance
    between two GeoCoordinate objects.


    I''m going on the first two properties, which together are referred to as coordinates
    to indicate a point on the surface of the Earth. Latitude is the angular distance
    from the equator. In common usage, latitude is an angle between 0 and 90 degrees
    followed with either N or S meaning north or south. For example, the latitude
    of New York is approximately 40°N. In the GeoCoordinate object, latitudes of the
    north are positive values and south of the equator are negative values, so that
    90° is the North Pole and -90° is the South Pole.


    All locations with the same latitude define a line of latitude. Along a particular
    line, longitude is the angular distance from the Prime Meridian, which passes
    through the Royal Observatory at Greenwich. In common usage, longitude is either
    east or west. New York City is 74°W because it''s the Prime Meridian. In a GeoCoordinate
    object, positive longitude denote east and negative values are west. Longitude
    of 180 and -180 meet up at the International Date Line.


    Although the System.Device.Location namespace includes classes that use the geographic
    coordinates to determine civic address (streets and cities), these are not implemented
    in the initial release of Windows 7.'
