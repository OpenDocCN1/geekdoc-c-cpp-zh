  md: '# Part I The Basics


    In fact, XNA doesn''t have any built-in fonts. You might think that an XNA program
    running on the phone can make use of the same native fonts as Silverlight programs,
    but this is not so. Silverlight uses vector-based TrueType fonts and XNA doesn''t
    know anything about such exotic concepts. To XNA, everything is a bitmap, including
    fonts.


    If you wish to use a particular font in your XNA program, that font must be embedded
    into the executable as a collection of bitmaps for each character. XNA Game Studio
    (which is integrated into Visual Studio) makes the actual process of font embedding
    very easy, but it raises some legal issues. You can''t legally distribute an XNA
    program unless you also legally distribute the embedded font, and with most of
    the fonts distributed with Windows itself or Windows applications, this is not
    the case.


    To help you out of this costly, Microsoft licensed some fonts from Ascender Corporation
    specifically for the purpose of allowing you to embed them in your XNA programs.
    Here they are:


    | Kootenay | Lindsey |

    | Miramonte | Pescadero |

    | Miramonte Bold | Pescadero Bold |

    | PERICLES | Segoe UI Mono |

    | PERICLES LIGHT | Segoe UI Mono Bold |


    Notice that the Pericles font uses small capitals for lower-case letters, so it''s
    probably suitable only for headings.


    From the menu of Visual Studio select New and Project. On the left of the dialog
    box, select Visual C# and XNA Game Studio 4.0. select Windows Phone Game (4.0).
    Select a location and enter a project name of XnaHelloWorld


    Visual Studio creates two projects, one for the program and the other for your
    program''s content. XNA programs usually contain lots of content, mostly bitmaps
    and 3D models, but fonts as well. To add a font to this program, right-click the
    Content project (labeled "XnaHelloWorldContent (Content)") and from the pop-up
    menu choose Add and New Item. Choose Sprite font, leave the filename as Sprite1.spritefont,
    and click Add.


    The word "sprite" is common in game programming and usually refers to a small
    bitmap that can be moved very quickly, much like the sprites you might encounter
    in an enchanted forest. In XNA, even fonts are sprites.


    You''ll see SpriteFont1.spritefont show up in the file list of the Content directory,
    and you can edit an extensively commented XML file describing the font.'
