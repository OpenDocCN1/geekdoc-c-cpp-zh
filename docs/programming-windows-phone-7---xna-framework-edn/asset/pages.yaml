  md: '# Silverlight Project: SilverlightHelloPhone File: App.xaml (excerpt)


    ```

    <Application

    x:Class="SilverlightHelloPhone.App"

    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"

    xmlns:phone="clr-namespace:Microsoft.Phone.Controls;assembly=Microsoft.Phone"

    xmlns:shell="clr-namespace:Microsoft.Phone.Shell;assembly=Microsoft.Phone">

    </Application>

    ```


    You''ll recognize this file as XAML, but more precisely it is a XAML file, in
    particular, developers often use the App.xaml file for storing resources that
    are used throughout the application. These resources might include color schemes,
    gradient brushes, styles, and so forth.


    The root element is Application, which is the Silverlight class that the App class
    derives from. The root element contains four XML namespace declarations. Two are
    common in all Silverlight applications; two are unique to the phone.


    The first namespace declaration ("xmlns") is the standard namespace for Silverlight,
    and it helps the compiler locate and identify Silverlight classes such as Application.
    If most XML namespace declarations, this URI doesn''t actually point to anything;
    it''s a URI that Microsoft owns and which it has defined for this purpose.


    Among the several attributes supported by XAML and referenced with this "x" prefix
    is Class, in this particular XAML file x:Class is assigned the name SilverlightHelloPhone.App.
    This means a class named App in the .NET SilverlightHelloPhone namespace derives
    from the Silverlight class, the root element. It is the class definition you saw
    in the App.xaml file but with very different syntax.


    The App.xaml and App.cs files really define two halves of the App class. During
    compilation, Visual Studio parses App.xaml and generates another file named App.g.cs.
    The "g" is for "generated". If you look at this file, you can find it in the \obj\
    subdirectory of the project. The App.g.cs file contains another partial definition
    of the App class, and it contains a method named InitializeComponent that is called
    from the constructor in the App.cs. file.


    You''re free to edit the App.xaml and App.cs files, but don''t mess around with
    App.g.cs. That file is recreated when you build the project.'
  merge: -1
