  md: '# Part II XNA


    multiplication by constants and adding the results; $x$ and $y$ aren''t multiplied
    by each other, for example.


    An affine translation adds in another constant that isn''t multiplied by anything:


    ```

    $x'' = a_x x + b_y y + c_x$

    $y'' = a_y x + b_x y + c_y$

    ```


    Very often some of these constants are zero. If $a_x$ and $b_y$ are both 1, and
    $b_x$ and $a_y$ are both zero, then the formulas represent a type of transform
    known as *translation:*


    ```

    $x'' = x + c_x$

    $y'' = y + c_y$

    ```


    This transform just causes a shift to another location—unlike the OneFingerDrag
    program that started off this chapter.


    If $b_x$ and $a_y$ are zero, and $c_x$ and $c_y$ are also zero, then the formulas
    represent *scaling:*


    ```

    $x'' = a_x x$

    $y'' = b_y y$

    ```


    Coordinates are multiplied by factors to make objects larger or smaller.


    The four multiplicative constants can be set to sines and cosines of a particular
    angle like so:


    ```

    $x'' = \cos(\alpha)x - \sin(\alpha)y$

    $y'' = \sin(\alpha)x + \cos(\alpha)y$

    ```


    The formulas rotate the point around the origin by $\alpha$ degrees. Setting these
    four constants to other values not related by trigonometric functions cause a
    type of transform known as *skew*, which transforms a square into a parallelogram.
    But that''s as strange as affine transforms get: Affine transforms never cause
    straight lines to become curves, or parallel lines to become non-parallel. As
    the name suggests, *affine* transforms don''t cause coordinates to become infinite.


    Translation, scaling, and rotation are the most common types of transforms, and
    they can be combined. To keep the math easy (well, *easier*) transforms are often
    represented as $3 \times 3$ matrices:


    \begin{matrix} a_x & a_y & 0 \ b_x & b_y & 0 \ c_x & c_y & 1 \end{matrix}'
