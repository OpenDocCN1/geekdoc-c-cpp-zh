  md: "The “smooth step” interpolation is based on cubic, and causes it to slow down\
    \ as it approaches one of the vertices, and speed up afterwards. It makes an abrupt\
    \ and unrealistic turn but the speed change is quite nice.\n\nWhat I don't like\
    \ about the PolylineInterpolator is its inefficiency. GetValue needs to make several\
    \ calls to the Length method of Vector2, course involves a square-root calculation.\
    \ It would be nice for the class to retain the total length and the accumulated\
    \ length at each vertex so it could re-use that information on successive GetValue\
    \ calls. As written, the class can't do that because it has no knowledge when\
    \ Vector2 values are added to or removed from the Vertices collection. One possibility\
    \ is that collection private, and to only allow a collection of points to be submitted\
    \ in the class's constructor. Another approach is to replace the List with an\
    \ ObservableCollection, which provides an event notification when objects are\
    \ added and removed.\n\n# The Elliptical Course\n\nThe unrealistic behavior of\
    \ the previous program involves the turns. Real cars slow down to turn corners,\
    \ but they actually travel along a curved path to change direction. To make the\
    \ program more realistic, the corners would have to be replaced by curves. These\
    \ curves could be approximated with polylines, but with the increasing number\
    \ of polylines would then require PolylineInterpolator to be restructured for\
    \ better performance.\n\nInstead, I'm going to go off on a somewhat different\
    \ tangent and drive the curve around a traditional oval course, or to express\
    \ it more mathematically, an elliptical course.\n\nLet's look at math. A circle\
    \ centered on the point (0, 0) with a radius of R consists of all points (x, y)\
    \ where\n\n```\n$x^2 + y^2 = R^2$\n```\n\nAn ellipse has two radii. If these are\
    \ parallel to the horizontal and vertical axes, they are sometimes called $R_x$\
    \ and $R_y$, and the ellipse formula is:\n\n```\n$\\left(\\frac{x}{R_x}\right)^2\
    \ + \\left(\\frac{y}{R_y}\right)^2 = 1$\n```\n\nFor our purposes, it is more convenient\
    \ to represent the ellipse in the parametric form. For these two equations, x\
    \ and y are functions of the angle $\\alpha$, which ranges from 0 to $2\\pi$:\n\
    \n```\n$x = R_x \\cos\\alpha$\n```\n\n```\n$y = R_y \\sin\\alpha$\n```"
  merge: -1
  pgno: 199
- img_proc: true
  md: "# Part II XNA\n\nWhen the ellipse is centered around the point (Cx, Cy), the\
    \ formulas become:\n\nx = C_x + R_x \\cos t\\ny = C_y + R_y \\cos t$\n\nIf we\
    \ also want to introduce a variable $t$, where $t$ goes from 0 to 1, the formulas\
    \ are:\n\nx(t) = C_x + R_x \\cos(2πt)\\ny(t) = C_y + R_y \\sin(2πt)\n\nAnd these\
    \ will be ideal for our purpose. As $t$ goes from 0 to 1, the car goes around\
    \ the lap once. But how do we rotate the car so it appears to be travelling in\
    \ a tangent to this ellipse? For that job, the differential calculus comes to\
    \ the rescue. First, take the derivatives of the parametric equations:\n\nx'(t)\
    \ = -R_x \\sin(2πt)\\ny'(t) = R_y \\cos(2πt)\n\nIn physical terms, these equations\
    \ represent the instantaneous change in direction in the X and Y direction, respectively.\
    \ To turn that into a tangent angle, simply apply the ever useful area of Math.Atan2.\n\
    \nAnd now we're ready to code. Here are the fields:\n\nXNA Project: CarOnOvalCourse\
    \ File: Game1.cs (excerpt showing fields)\n\n```\npublic class Game : Microsoft.Xna.Framework.Game\n\
    {\n    const float SPEED = 0.25f; // laps per second\n    GraphicsDevice graphics;\n\
    \    SpriteBatch spriteBatch;\n    Texture2D car;\n    Vector2 center;\n    Point\
    \ ellipseCenter;\n    float ellipseRadiusX, ellipseRadiusY;\n    Vector2 position;\n\
    \    float rotation;\n\n}\n```\n\nThe fields include the three items required\
    \ for the parametric equations for the ellipse: the center and the two radii.\
    \ These are determined during the LoadContent method based on the dimensions of\
    \ the screen:"
  merge: -1
  pgno: 200
- img_proc: true
  md: "# XNA Project: CarOnOvalCourse File: Game1.cs (excerpt)\n\nNotice that the\
    \ Update method below calculates two angles. The first, called ellipseAngle, is\
    \ based on t and determines where on the ellipse is located. This is the angle\
    \ passed to the parametric equations for the ellipse, to obtain the position as\
    \ a combination of x and y:\n\n# XNA Project: CarOnOvalCourse File: Game1.cs (excerpt)\n\
    \n```\noverrode void Update(GameTime gameTime)\n{\n    if (Gamepad.GetState(PlayerIndex.One).Back\
    \ == ButtonState.Pressed)\n    {\n        this.Exit();\n    }\n\n    float t =\
    \ (SPEED / (float)gameTime.TotalGame.Seconds) % 1;\n    float ellipseAngle = MathHelper.Pi\
    \ * t;\n    float x = ellipseCenter.X + ellipseRadiusX * (float)Math.Cos(ellipseAngle);\n\
    \    float y = ellipseCenter.Y + ellipseRadiusY * (float)Math.Sin(ellipseAngle);\n\
    \    float position = new Vector2(x, y);\n\n    float dxdt = -ellipseRadiusX *\
    \ (float)Math.Sin(ellipseAngle);\n    float dydt = ellipseRadiusY * (float)Math.Cos(ellipseAngle);\n\
    \    rotation = MathHelper.PiOver + Math.Atan2(dydt, dxdt);\n\n    base.Update(gameTime);\n\
    ```\n\nThe second angle Update is called rotation. This is the angle that governs\
    \ the orientation of the car. The dxdt and dydt variables are the derivatives\
    \ of the parametric equations that I showed earlier. The Math.Atan2 method provides\
    \ the rotation angle relative to the Positive X, and this must be rotated 90 degrees\
    \ for the original orientation of the bitmap."
