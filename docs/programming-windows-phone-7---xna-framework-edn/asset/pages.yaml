  md: '# Part I The Basics


    The Silverlight XNA platforms for Windows Phone 7 share some libraries, and you
    can use XNA libraries in a Silverlight program and vice versa. But you can''t
    create a program that mixes visuals from both platforms. Maybe that will be possible
    in the future, but not yet. Before you create a Visual Studio project, you must
    decide whether your million-dollar idea is a Silverlight program or an XNA program.


    Generally you''ll choose Silverlight for writing programs you might classify as
    applications or utilities. These programs are built from a combination of markup
    and code. The markup is the Extensible Application Markup Language, XAML and pronounced
    “zamel.” The XAML mostly defines a layout of user-interface controls and panels.
    Code-behind files can also perform initialization and logic, but are generally
    relegated to handling events from the controls. Silverlight is great for bringing
    to the Windows Phone style of Rich Internet Applications (RIA), including media
    and the Web. Silverlight for Windows Phone is a version of Silverlight 3 excluding
    some features not appropriate for the phone, but compensating with some enhancements.


    XNA is primarily for writing high-performance games. For 2D games, you define
    sprites and backgrounds around bitmaps; for 3D games you define models in 3D space.
    The action of the game, which includes moving objects around the scene and polling
    for user input, is synchronized by the built-in XNA game loop.


    The differentiation between Silverlight-based applications and XNA-based games
    is convenient but not restrictive. You can certainly use Silverlight for writing
    games and you can even write traditional applications using XNA, although doing
    so might sometimes be challenging.


    In particular, Silverlight might be ideal for games that are less graphically
    oriented, or vector graphics rather than bitmaps, or paced by user-time rather
    than clock-time. A Tetris-type program might quite well in Silverlight. You''ll
    probably find XNA to be a bit harder to stretch into Silverlight territory, however.
    Implementing a list box in XNA might be considered “fun” by some programmers but
    by many others.


    The first several chapters in this book describe Silverlight and XNA together,
    and then the book splits into directs for the two platforms. I suspect that some
    developers will stick with either Silverlight or XNA exclusively and won''t even
    bother learning the other environment. I hope that''s not a common attitude. The
    good news is that Silverlight and XNA are so dissimilar that you can probably
    bounce back and forth between them without confusion!


    Microsoft has been positioning Silverlight as the front end or “face” of the cloud,
    so cloud services and Windows Azure form an important part of Windows Phone 7
    development. The Windows Phone is “cloud-ready.” Programs are location-aware and
    have access to maps and other data through Bing and Windows Live. One of the available
    cloud services is Xbox Live,'
  merge: -1
