  md: '# Part II XNA


    If you use this form of the Begin call, then Matrix object will affect all the
    Draw and DrawString calls until End. This can be very useful for applying a transform
    to a whole group of graphical objects.


    You can also apply transforms to Vector2 objects "manually" with several versions
    of the static Vector2.Transform method.


    The Matrix structure supports very many static methods for creating Matrix objects
    that represent various types of transforms. These are all designed for 3D, but
    here''s how you can use the most basic ones for 2D:


    ```

    Matrix matrix = Matrix.CreateTranslation(xOffset, yOffset, 0);

    Matrix matrix = Matrix.CreateScale(xScale, yScale, 1);

    Matrix matrix = Matrix.CreateRotationZ(radians);

    ```


    The last argument of the first two methods is normally set to the translation
    or scaling factor for the three-dimensional Z axis. 0 A 0 will work for most purposes,
    but if you need to invert the matrix, a zero scaling factor is a real deal killer.
    Also notice that the third method name makes reference to the Z axis. The method
    needs to calculate rotation around the Z axis for rotation in the two-dimensional
    XY plane.


    The Matrix structure supports arithmetic operators, so you can easily multiply
    matrices for compounding transforms. One of the most common reasons is to represent
    scaling or rotation around a particular point.


    Suppose you have a point stored as a Vector2 object called center. Want to calculate
    a matrix that represents rotation by angle centered on that point. You begin with
    translation to move center point to the origin, then apply the rotation (or scaling)
    and another translation to move the center back to where it was:


    ```

    Matrix matrix = Matrix.CreateTranslation(-center.X, -center.Y, 0);

    matrix *= Matrix.CreateRotationZ(angle);

    matrix *= Matrix.CreateTranslation(center.X, center.Y, 0);

    ```


    Notice the multiplication operators.


    The Matrix structure in XNA has 16 public fields of type float representing all
    16 cells of the 4 x 4 matrix. These names indicate that their row and column position
    within the matrix:


    ```

    M11 M12 M13 M14

    M21 M22 M23 M24

    M31 M32 M33 M34

    M41 M42 M43 M44

    ```'
