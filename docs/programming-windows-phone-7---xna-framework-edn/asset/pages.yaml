    \            tm.Tick += OnTick;\n            tm.Start();\n        }\n\n      \
    \  void OnClick(object sender, EventArgs args)\n        {\n            txtbl.Text\
    \ = DateTime.Now.ToString();\n        }\n    }\n}\n```\n\nThe constructor initializes\
    \ the DispatcherTimer, instructing it to call OnTick once every second. The event\
    \ handler simply converts the time to a string to set it to the TextBox.\n\nAlthough\
    \ DispatcherTimer is defined in the System.Windows.Threading namespace, the OnTick\
    \ method is called in the same thread as the rest of the program. If that was\
    \ not the case, the program would not be able to access the TextBox directly.\
    \ Silverlight elements and related objects are not thread safe, and will prohibit\
    \ access from threads that do not create them. I'll discuss the procedure for\
    \ accessing Silverlight elements from secondary threads in Chapter 5.\n\nThe clock\
    \ is yet another Silverlight project in this chapter that changes the Text property\
