  md: "# Part I The Basics\n\nFor most purposes, you just need to use one of the other\
    \ static methods in TouchPanel.\nTo obtain low-level touch input, you'll probably\
    \ be calling this method during every call to\nUpdate after program initialization:\n\
    \n```\nTouchCollection touchLocations = TouchPanel.GetState();\n```\n\nThe TouchCollection\
    \ is a collection of zero or more TouchLocation objects. TouchLocation has\nthree\
    \ properties:\n\n+   - State is a member of the TouchLocation enumeration: Pressed,\
    \ Moved, Released.\n\n+   - Position is a of Vector2 indicating the finger position\
    \ to the upper-left corner\nof the viewport.\n\n+   - Id is an identifying particular\
    \ finger from Pressed through Released.\n\nIf no fingers are touching the screen,\
    \ the TouchCollection will be empty. When a finger\ntches the screen, TouchCollection\
    \ contains a single TouchLocation object with State equal\nto Pressed. On subsequent\
    \ calls to TouchPanel.GetState, the TouchLocation object will have\nState equal\
    \ to Moved if the finger has not physically moved. When the finger is lifted\n\
    from the screen, the State property of the TouchLocation object will be Released.\
    \ When\nsubsequent calls to TouchPanel.GetState, the TouchCollection will be empty.\n\
    \nOne exception: If the finger is tapped and released on the screen very quickly—that\
    \ is, within\na 1/30th of a second—it's possible that the TouchLocation object\
    \ with State equal to Pressed\nwill be followed by State equal to Released with\
    \ no Moved states in between.\n\nThat's just one finger touching the screen and\
    \ lifting. In the general case, multiple fingers will\be touching, moving, and\
    \ lifting from the screen independently of each other. You can track\nfingers\
    \ using the Id property. For any particular finger, that Id will be the same\n\
    from Pressed, through all the Moved values, to Released.\n\nWhen dealing with\
    \ low-level touch input, you'll use a Dictionary object with keys\nbased on the\
    \ Id property to retain information for a particular finger.\n\nTouchLocation\
    \ also has a very handy method called GetPreviousLocation, which you call\nlike\
    \ this:\n\n```\nTouchLocation previousTouchLocation;\nbool success = touchLocation.GetPreviousLocation(out\
    \ previousTouchLocation);\n```\n\nAlways, you will call this method when touchLocation.State\
    \ is Moved because you\nobtain the previous location and calculate a difference.\
    \ If touchLocation.State equals\nPressed, then GetPreviousLocation will return\
    \ false and previousTouchLocation.State is\nequal to the enumeration member TouchLocationState.Invalid.\
    \ You'll also get these results if you\nuse the method on a TouchLocation that\
    \ itself was returned from GetPreviousLocation."
