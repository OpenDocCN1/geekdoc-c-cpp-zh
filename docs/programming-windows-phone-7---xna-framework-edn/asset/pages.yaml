  md: "![](img/d9347c1f55fa6d523479d2cd9b4d5459_391_0.png)\n\nAs you can see, this\
    \ is not a very interesting maze, but its most advantageous feature is that any\
    \ area within the maze is accessible from any other area.\n\nConceptually, the\
    \ area is divided into a grid of cells. In this example, there are five cells\
