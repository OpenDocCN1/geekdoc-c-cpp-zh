  md: '# Chapter 12


    # Tilt and Play


    If the primary means of user interface in a Windows Phone 7 is touch, then what
    is the second most important? It depends on the application, of course, but in
    many Silverlight applications, I suspect the keyboard will still play a big role.
    In many XNA programs, however, the second most important means of user-interface
    is probably the accelerometer—particularly in arcade-type games where moving the
    phone itself can take the place of traditional hand controllers. For example,
    a game that drives a car around a race track or through a town can respond to
    left and right tilts of the phone by turning the car, and perhaps from back tilts
    can control the gas pedal.


    # 3D Vectors


    As you saw in Chapter 5, the data from the phone''s accelerometer is essentially
    a 3D vector (**x, y, z**) in a coordinate system that is fixed relative to the
    phone. The accelerometer coordinate system remains fixed regardless whether you
    hold the phone in portrait mode:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_359_0.png)'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'Part II XNA


    Or left landscape:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_360_0.png)


    Or right landscape:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_360_1.png)


    Notice that Y coordinates increase going up the phone, just like a real Cartesian
    coordinate system and the XNA 3D coordinate system, but not like XNA 2D coordinates
    where values of Y increase going down.


    If the phone is held still, the acceleration vector points to the part of the
    phone that is closest to the earth. For example, if the acceleration vector is
    approximately **(0.7,-0.7, 0)** then the phone is being held like this:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_360_2.png)'
