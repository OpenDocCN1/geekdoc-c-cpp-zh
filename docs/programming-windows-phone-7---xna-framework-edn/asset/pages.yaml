    \ Foreground property is set to the original brush.\n\nIn this OnManipulation\
    \ method we're handling events for MainPage, but that OriginalSource property\
    \ tells us the event actually originated lower in the visual tree. This is part\
    \ of the benefit of the Silverlight feature as routed event handling.\n\n# Routed\
    \ Events\n\nIn Windows programming, keyboard and mouse input always go to particular\
    \ controls. Keyboard input goes to the control with the input focus. Mouse input\
    \ always goes to the topmost enabled control over the mouse pointer. Stylus and\
    \ touch input are handled similarly to the mouse. But sometimes this is inconvenient.\
    \ Sometimes the control underneath the user-input more than the control on top.\n\
    \nTo be a bit more flexible, Silverlight implements a system called routed event\
    \ handling. Most user input events—including the three Manipulation events—do\
    \ originate using the same paradigm as Windows. The Manipulation events originate\
    \ at the topmost enabled element touched by the user. However, if that element\
    \ is not interested in the event, the event then goes to element's parent, and\
    \ so up the visual tree ending at the PhoneApplicationFrame. Any element along\
    \ the way can grab the input and do something with it, and also inhibit further\
    \ the progress of the event under the tree.\n\nThis is why you can override the\
    \ OnManipulationStarted method in MainPage and also get manipulation events for\
    \ the TextBlock. By default the TextBlock isn't interested in those events."
