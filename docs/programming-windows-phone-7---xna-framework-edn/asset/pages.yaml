  md: 'It can also be shown through the use of similar triangles that the angle opposite
    the shorter leg of this triangle is the same angle α that the phone makes with
    the level surface:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_380_0.png)


    This means that the sine of α is 0.34 and the cosine of α is 0.94, and α is 20°.


    In summary, the left-right tilt of the phone is equal to the inverse sine of the
    X component of the acceleration vector; similarly, the top-bottom tilt is equal
    to the inverse sine of the Y component.


    Now let''s roll a ball down the phone. A ball rolling down an inclined plane experiences
    less acceleration than a ball in free fall:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_380_1.png)


    Galileo used balls rolling down long inclined planes to slow down the process
    of acceleration and study it in more detail.


    The calculation of the acceleration of the rolling ball is a bit messy (see, for
    example, A. P. French, Newtonian Mechanics, W. W. Norton, 1971, pages 652-653)
    but in the absence of friction it turns out to be:


    ```

    acceleration = \frac{2}{3}g - g sin(α)

    ```


    where g is the normal acceleration of 32 feet per second squared to gravity. But
    even this is an excessive amount of detail for implementing a rolling ball in
    a simple Windows Phone 7 application. All that really necessary to know is that
    the acceleration is proportional to the sine of α. And that is extremely fortuit
    because it means the acceleration of a rolling ball across the width of the phone
    (in portrait mode) is proportional to the X component of the accelerometer vector!
    For a ball that rolls along a plane, then the acceleration is a two-dimensional
    vector that can be calculated directly from the X and Y components of the accelerometer
    vector.


    The TiltAnd seems to roll a ball around the surface of the screen based on the
    tilting of the phone. When the ball hits one of the edges, it does not bounce
    but instead loses all its velocity in the direction perpendicular to the edge.
    The ball continues to roll along the edge if the tilt of the phone justifies it.'
