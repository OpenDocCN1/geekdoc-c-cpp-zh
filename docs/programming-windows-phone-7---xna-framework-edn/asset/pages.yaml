  md: "# Chapter 4 Bitmaps, Also Known as Textures\n\n# Image and ImageSource\n\n\
    Although you can certainly use WebClient in a Silverlight application, it's not\
    \ generally necessary with bitmaps because the bitmap-related classes already\
    \ implement asynchronous downloading.\n\nHowever, once you begin investigating\
    \ the Image element, it might seem a little confusing. The Image element is not\
    \ the bitmap; the Image element merely displays the bitmap. In the uses you've\
    \ seen so far, the Source property of bitmap has been set to a relative path or\
    \ URL:\n\n```\n<Image Source=\"Hello.png\" />\n<Image Source=\"http://www.charlespetzold.com/Media/HelloW7.jpg\"\
    \ />\n```\n\nYou might have assumed that this Source property was of type String,\
    \ not even close! You're actually seeing XAML syntax that hides some activity\
    \ behind the scenes. The Source property is really of type ImageSource, an abstract\
    \ class that derives BitmapSource, another abstract class that defines a method\
    \ named SetSource that allows loading the bitmap from a Stream object.\n\nFrom\
    \ BitmapSource derives BitmapImage, which supports a constructor that accepts\
    \ a Uri object and also includes a Uri property of type Uri. The SilverlightToDownload\
    \ project mimics a program that needs to download a bitmap whose URI is known\
    \ at runtime. The XAML contains an Image element with no bitmap to display:\n\n\
    | Silverlight Project: SilverlightToDownload1 | File: MainPage.xaml (excerpt)\
    \ |\n\n```\n<Grid x:Name=\"ContentPanel\" Grid.Row=\"1\" Margin=\"12,0,12,0\"\
    >\n  <Image Source=\"img\" />\n</Grid>\n```\n\nBitmap requires a using directive\
    \ for the System.Windows.Media.Imaging namespace. When MainPage gets a tap, it\
    \ creates a BitmapImage from the Uri object and sets that to the Source property\
    \ of the Image:\n\n| Silverlight Project: SilverlightToDownload1 | File: MainPage.xaml.cs\
    \ (excerpt) |\n\n```\nprotected override void OnManipulationStarted(ManipulationStartedEventArgs\
    \ args)\n{\n  Uri uri = new Uri(\"http://www.charlespetzold.com/Media/HelloW7.jpg\"\
    );\n  BitmapImage bmp = new BitmapImage(uri);\n  img.Source = bmp;\n\n  args.Complete();\n\
    \  args.Handled = true;\n  base.OnManipulationStarted(args);\n}\n```"
