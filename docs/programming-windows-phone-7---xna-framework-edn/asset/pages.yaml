    ```

    // Query proxy for AreaBoundingBox

    LonPt center = new LonLatPt();

    center.Lon = args.Position.Location.Longitude;

    center.Lat = args.Position.Location.Latitude;


    statusText.Text = "Microsoft Research Maps Service...";

    proxy.GetAreaFromPtAsync(center, 1, Scale.Scale16m,

    (int)ContentPanel.ActualWidth,

    (int)ContentPanel.ActualHeight);

    );

    ```


    The method concludes by making its first call to the proxy. The GetAreaFromPtAsync
    requires a longitude and latitude as a center point, but some other information
    as well. The second argument is 1 to get an aerial view and 2 for a map (you''ll
    see at the end of this chapter). The third argument is the desired scale, a of
    the Scale enumeration. The member I''ve chosen each pixel of the returned bitmaps
    is equivalent to 16 meters.


    Watch out: Some scaling factors—in particular, Scale2m, Scale8m, and Scale32m—result
    in GIF files being returned. Remember, remember, remember that Silverlight doesn''t
    GIF! For the other scaling factors, JPEGs are returned.


    The final arguments to GetAreaFromPtAsync are the width and height of the area
    you wish to cover with the map.


    All the bitmaps you get back from MSR Maps Service are 200 pixels square. Almost
    always, you''ll need multiple bitmaps to tile a complete area. For example, if
    the last two arguments to GetAreaFromPtAsync are 400 and 600, you will need 6
    bitmaps to tile the area.


    Well, actually not: An area of 400 pixels by 600 pixels will require 12 bitmaps,
    3 horizontally and 4 vertically.


    Here''s the catch: These bitmaps aren''t specially created when a program requests
    them. They already exist on the server in all the various scales. The geographic
    coordinates where these bitmaps begin and end are fixed. If you want to cover
    a particular area of your display with a tiled map, and you want the center of
    this area to be precisely the coordinate you specify, the tiles aren''t going
    to fit exactly. You want sufficient tiles to cover your area, but the tiles around
    the boundary are to hang over the edges.


    What you get back from the GetAreaFromPtAsync call (in the following OnProxyGetAreaFromPtCompleted
    method) is an object of type AreaBoundingBox. This is a rather complex structure
    that nonetheless has all the information required to request the individual tiles
    you need and assemble them together in a grid.'
