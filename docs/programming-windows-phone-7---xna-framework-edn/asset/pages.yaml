    \ time it touches the screen to the time it lifts, you can use one of two strategies:\
    \ Either save the value from FreeDrag after a DragComplete and compare that with\
    \ the later Position values, or accumulate the Delta values in a running total.\n\
    \nLet's look at a simple program that lets the user drag a little bitmap around\
