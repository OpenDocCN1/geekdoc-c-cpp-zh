  md: "# Chapter 10 From Gestures to Transforms 249\n\nRather than using the static\
    \ methods of Matrix to create Matrix objects, you can set these fields individually\
    \ (or set them all in a 16-argument constructor.) The subscribed constants I used\
    \ earlier correspond to these cells:\n\n```\nax 0 0 0\nby 0 0 0\n0 0 1 1\nc_ 0\
    \ 1 0\n```\n\nThe M11 field is the horizontal scaling factor and M22 is vertical\
    \ scaling; M41 is horizontal translation and M42 is vertical translation. Or,\
    \ you can rewrite the 2D affine transform formulas using the Matrix structure\
    \ names:\n\n```\nx' = M11 · x + M21 · y + M41\ny' = M12 · x + M22 · y + M42\n\
    ```\n\nKnowing the relationship between these fields and transforms can aid in\
    \ extracting information from the Matrix structure or implementing short cuts\
    \ that don't involve creating new Matrix objects and multiplying them. I'll demonstrate\
    \ some of these techniques in the pages ahead.\n\n# The Pinch Gesture\n\nWith\
