- img_proc: true
  md: '# Chapter 5 Sensors and Services 99


    transactions between your program and the web service are in the form of XML files.
    However, to avoid programmer anguish, generally the WSDL file is used to generate
    a proxy, which is a collection of classes and structures that allow your program
    to communicate with the web service with method calls and events.


    You can generate this proxy in Visual Studio. Here''s how I did it: I first created
    a Windows Phone 7 project in Visual Studio called SilverlightLocationMapper. In
    the Solution Explorer, I right-clicked the project name and selected Add Service
    Reference. In the Address field I entered the URL of the MSR Maps Service WSDL
    file: http://MSRMaps.com/TerraService2.asmx.


    (You might wonder if the URL should be http://msrmaps.com/TerraService2.asmx?WSDL
    because that''s how WSDL files are often referenced. That address will seem to
    work at first, but you''ll get finding obsolete URLs.)


    After you entered the URL in the Address field, press Go. Visual Studio will see
    the site and report back what it finds. There will be one service, called by the
    name of TerraService.


    Next you''ll need to enter a name in the Namespace field to replace the generic
    ServiceReference1. I used MsrMapsService and pressed OK.


    You''ll see MsrMapsService show under the project in the Solution Explorer. When
    you click the Show All icon on the Solution Explorer, you can view the generated
    files. In particular, nested MsrMapsService and Reference.svcmap, you''ll see
    Reference.cs, a big file (over 4000 lines) with a namespace of XnaLocationMapper.MsrMapsService,
    which combines the original project name and the name you selected for the web
    service.


    This Reference.cs file contains all the classes and structures you need to access
    the web service, and which are documented on the msrmaps.com web site. To access
    these in your program, add a using


    ```

    using SilverlightLocationMapper.MsrMapsService;

    ```


    You also need a reference to the System.Device assembly and using directives for
    the System.Device.Location, System.IO, and System.Windows.Media.Imaging namespaces.


    In the MainPage.xml file, I left the SupportedOrientations property at its default
    setting of Portrait, I removed the page title to free up space, and I moved the
    title panel below the content grid in case there was a danger of something spilling
    out of the content grid and obscuring the title. Moving the title panel below
    the content grid in the XAML file ensures that it will be visually on top.'
  merge: -1
