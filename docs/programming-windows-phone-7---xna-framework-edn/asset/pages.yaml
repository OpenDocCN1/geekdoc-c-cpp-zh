  md: 'It''s possible that you''ll need to save an unserializable object as a transient
    setting, but because it''s not serializable, you can''t use the State dictionary
    of the PhoneApplicationService class. You''ll need to use isolated storage for
    such an object, but you don''t want to accidentally retrieve that object and reuse
    it when the program is run again. In this case, you''ll use a flag in the State
    dictionary indicating whether you need to load the transient object from isolated
    storage.


    # # Testing and Experimentation


    Programmers at Microsoft who have been writing Windows Phone 7 applications longer
    than many of us report that dealing with tombstoning can be one of the trickier
    aspects of phone development. The techniques I''ve shown you in this chapter illustrate
    a good starting point but all applications will have slightly different requirements.
    Surely you''ll want to do a lot of testing in your own programs, and it always
    helps to know exactly what methods of a program are being called and in what order.
    For this job, the Debug.WriteLine method of the System.Diagnostics namespace can
    be very helpful.'
