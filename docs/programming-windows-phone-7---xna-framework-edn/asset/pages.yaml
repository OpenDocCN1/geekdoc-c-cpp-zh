  md: "# Chapter 6 Issues in Application Architecture 121\n\n```\nContentPanel.Background\
    \ = =\n    new SolidColorBrush(ReturnedColor.Value);\n\nbase.OnNavigatedTo(args);\n\
    \n}\n```\n\nIn a sense, MainPage invokes SecondPage to obtain a Color value, just\
    \ like a real dialog box. If you navigate to SecondPage subsequent times, it starts\
    \ out with a black screen (or if you've selected the Light color theme).\n\nInterestingly,\
    \ SecondPage can't initialize itself from any MainPage because the OnNavigatedTo\
    \ call that SecondPage doesn't receive the source page. To work in a symmetrical\
    \ manner, SecondPage would need to define its own Color property, and in its OnNavigatedFrom\
    \ override.\n\nYou might consider a little variation on this program where SecondPage\
    \ defines the ReturnedColor property. When MainPage navigates to SecondPage the\
    \ OnNavigatedFrom method in MainPage is called, and the method saves the instance\
    \ of SecondPage being navigated to a field in MainPage. When SecondPage is finished,\
    \ it sets the Color value in its Returned property and calls GoBack. The OnNavigatedTo\
    \ method in MainPage is then called. MainPage can use the SecondPage instance\
    \ saved as a field to access the ReturnedColor property.\n\nThis scheme sounds\
    \ fine, but it won't always work. The problem is that MainPage can't be assured\
    \ that the SecondPage instance it navigates to will be the same SecondPage instance\
    \ that navigates back to MainPage. You'll have a better sense of this problem.\n\
    \n# Retaining Data across Instances\n\nEvery time MainPage navigates to SecondPage,\
    \ it's a different instance of SecondPage. That's why SecondPage always starts\
    \ out the same. It's always a new instance.\n\nIf we want SecondPage to \"remember\"\
    \ the last color it was set to, something outside of SecondPage must be responsible\
    \ for saving that data. That could be MainPage.\n\nOr, SecondPage could save its\
    \ state in isolated storage. Isolated storage is much like regular disk storage.\
