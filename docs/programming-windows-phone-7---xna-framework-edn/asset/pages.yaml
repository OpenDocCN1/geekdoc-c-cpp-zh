  md: "# Part II XNA polylineInterpolatorGetValue(t, false, out angle);\n\n```\nposition\
    \ = polylineInterpolator.GetValue(t, false, out angle);\nrotation = angle + MathHelper.PiOver2;\n\
    \nbase.Update(gameTime);\n\n```\n\nAs usual, t is calculated to range 0 to 1,\
    \ 0 indicates the beginning of the course in the upper-left corner of the screen,\
    \ and t approaches 1 as it's heading towards initial position again. If t is passed\
    \ directly to the GetValue method of PolylineInterpolator, which returns a Vector2\
    \ value somewhere along the polyline.\n\nAs an extra bonus, the last argument\
