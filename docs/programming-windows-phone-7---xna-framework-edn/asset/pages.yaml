  md: '# Chapter 9 Dynamic Textures


    It is possible for an XNA program to temporarily replace the back buffer in the
    *GraphicsDevice* object with an object of type *RenderTarget2D*:


    ```

    this.GraphicsDevice.SetRenderTarget(renderTarget2D);

    ```


    You can draw on this *RenderTarget2D* in the same way you draw on the back buffer.
    After you''re finished drawing, you disassociate the *RenderTarget2D* from the
    *GraphicsDevice* with another call to *SetRenderTarget(null)* argument:


    ```

    this.GraphicsDevice.SetRenderTarget(null);

    ```


    Now the *GraphicsDevice* is back to normal.


    If you''re creating a *RenderTarget2D* that remains the same for the duration
    of the program, you can have a loop in the *LoadContent* override. If the *RenderTarget2D*
    needs to change, you can also draw on the bitmap during the *Update* override.
    Because *RenderTarget2D* derives from *Texture2D* you can display the *RenderTarget2D*
    on the screen during your *Draw* override just as as you display any other *Texture2D*
    image.


    Of course, you''re not limited to one *RenderTarget2D* object. If you have a complex
    series of images that form some kind of animation, you can create a series of
    *RenderTarget2D* objects that you then display in sequence as a kind of movie.


    Suppose you want to display something that looks like this:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_209_0.png)


    That''s a bunch of text strings all saying "Windows Phone 7" rotated around a
    center point with colors that vary between cyan and yellow. Of course, you can
    have a loop in the *Draw* override that makes 32 calls to the *DrawString* method
    of *SpriteBatch*, but if you assemble those text strings on a single bitmap, you
    can reduce the *Draw* override to just a single call to the *Draw* method of *SpriteBatch*.
