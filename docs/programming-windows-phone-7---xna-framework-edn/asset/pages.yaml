  md: "# I The Basics\n\nreferred to controls in other programming environments are\
    \ more correctly referred to as elements in Silverlight. Control derivatives include\
    \ buttons and sliders that I'll discuss in Chapter 10.\n\nAnother class that derives\
    \ from FrameworkElement is Panel, which is the parent class to the Grid and StackPanel\
    \ elements you see in MainPage.xml. Panels elements can host multiple children\
    \ and arrange them in ways on the screen. I'll discuss panels in more depth in\
    \ Chapter 9.\n\nAnother class that derives from FrameworkElement is TextBlock,\
    \ the element you'll most use in displaying blocks of text up to a paragraph in\
    \ length. The two Text elements in MainPage.xml display the two chunks of title\
    \ in a new Silverlight program.\n\nPhoneApplication, Grid, StackPanel, and TextBlock\
    \ are all Silverlight classes. In Markup these become XML elements. Properties\
    \ of these classes become XML attributes.\n\nThe nesting of elements in MainPage.xml\
    \ is said to define a visual tree. In a Silverlight program for Windows Phone\
    \ 7, the visual tree always begins with an object of type PhoneApplicationFrame,\
    \ which occupies the entire visual surface of the phone.\n\nA Silverlight program\
    \ for Windows Phone 7 always has one and only instance of PhoneApplicationFrame,\
    \ referred to informally as the frame.\n\nIn contrast, a program can have multiple\
    \ instances of PhoneApplicationPage, referred to informally as a page. At any\
    \ time, the frame holds one page, but lets you navigate to the other pages. By\
    \ default, the page does not occupy the full display surface of the frame because\
    \ it makes room for the system tray (also known as the status bar) at the top\
    \ of the phone.\n\nOur simple application has only one page, appropriately called\
    \ MainPage. This MainPage contains a Grid, which contains a StackPanel with a\
    \ couple TextBlock elements, and another Grid, all in a hierarchical tree. The\
    \ visual tree of a Silverlight program creates Visual Studio:\n\n```\nPhoneApplicationFrame\n\
    PhoneApplicationPage\n  Grid named \"LayoutRoot\"\n    StackPanel named \"TitlePanel\"\
    \n      TextBlock named \"ApplicationTitle\"\n      TextBlock named \"PageTitle\"\
    \n    Grid named \"ContentPanel\"\n```\n\nOur original goal was to create a Silverlight\
    \ program that displays some text in the center of the display, but given the\
    \ presence of a couple titles, let's amend that displaying the"
