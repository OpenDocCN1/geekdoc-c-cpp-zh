  md: "# Chapter 6\nIssues in Application Architecture\n\nA Silverlight application\
    \ for Windows Phone 7 consists of several standard classes:\n\n+   - an App class\
    \ that derives from *Application;\n- an instance of the *PhoneApplicationFrame*\
    \ class; and\n- one or more classes that derive from *PhoneApplicationPage*.\n\
    \nThis chapter is partly about the “more” or more of that last item. The programs\
    \ you’ve seen so far consist of a single class named *MainPage* that derives from\
    \ *PhoneApplicationPage*. In more complex applications, you might want to have\
    \ multiple pages and allow the user to navigate among them through the phone's\
    \ Start screen, much like navigating among Web pages.\n\nPage navigation would\
    \ seem to be an advanced Silverlight programming topic, and a topic that applies\
    \ only to Silverlight programming rather than XNA programming. However, there\
    \ are issues with navigation that are related to the very important topic of *tombstoning*,\
    \ which is what happens to your Windows Phone 7 application when the user navigates\
    \ to another application through the phone’s Start screen. Tombstoning is very\
    \ much an issue that also affects XNA programmers.\n\n# Basic Navigation\n\nThe\
    \ SilverlightSimpleNavigation project begins as usual with a *MainPage* class,\
    \ and as usual I set the two TextBlock elements for the titles:\n\n| Silverlight\
    \ Project: *SilverlightSimpleNavigation* File: * MainPage.xaml* (excerpt) |\n\n\
    ```\n<StackPanel xName=\"TitlePanel\" Grid.Row=\"0\" Margin=\"12,17,0,28\">\n\
    \  <TextBlock xName=\"ApplicationTitle\" Text=\"SIMPLE NAVIGATION\" ... />\n \
    \ <TextBlock xName=\"PageTitle\" Text=\"main page\" ... />\n</StackPanel>\n```"
  merge: -1
  pgno: 121
