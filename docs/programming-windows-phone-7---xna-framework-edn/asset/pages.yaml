  md: "# Chapter 1 Hello, Windows Phone 7 15\n\nVisual Studio itself. The DesignerWidth\
    \ and DesignerHeight attributes are ignored during compilation.\n\nThe compilation\
    \ of the program generates a file MainPage.cs that contains another partial class\
    \ definition for MainPage (you can look at it in the \\obj\\Debug subdirectory)\
    \ with the InitializeComponent method called from the constructor in MainPage.xml.\n\
    \nIn theory, the App.cs and MainPage.cs files generated during the build process\
    \ are solely for internal use by the compiler and can be programmed by the programmer.\
    \ However, sometimes when a buggy program raises an exception, one of these files\
    \ coming up into view. It might help your understanding of the problem before\
    \ they mysteriously appear in front of your face. However, don't try to edit these\
    \ files to fix the problem! The real problem is probably somewhere in the XAML\
    \ file.\n\nIn the root element of MainPage.xml you will see settings for FontFamily,\
    \ FontSize, and Foreground that affect the whole page. I describe StaticResource\
    \ and this syntax in Chapter 7.\n\nThe body of the MainPage.xml file contains\
    \ several nested elements like Grid, StackPanel, and TextBlock in a parent-child\
    \ hierarchy.\n\nNotice the word element: In Silverlight programming, this word\
    \ has two related meanings. It is an XML term used to indicate items delimited\
    \ by start tags and end tags. It's also a word used in Silverlight to refer to\
    \ visual objects, and in fact, the word element shows up in the names of two actual\
    \ Silverlight classes.\n\nMany of the classes you use in Silverlight are part\
    \ of this important class hierarchy:\n\n+   Object\n\n  DependencyObject (abstract)\n\
    \    UIElement (abstract)\n    FrameworkElement (abstract)\n\nBesides *UIElement*,\
    \ other Silverlight classes derive from *DependencyObject*. But *UIElement* has\
    \ the distinction of being the class that has the power to appear as a visual\
    \ object on the screen and to receive user input. (In Silverlight, all visual\
    \ objects can receive user input.\\** ) Traditionally, this user input comes from\
    \ the keyboard or mouse; on the phone, most user input comes from touch.\n\nThe\
    \ only class that derives from UIElement is FrameworkElement. The distinction\
    \ between these two classes is a historical artifact of the Windows Presentation\
    \ Foundation. In WPF, it is possible for developers to create their own unique\
    \ frameworks by deriving from UIElement. In Silverlight this is not possible,\
