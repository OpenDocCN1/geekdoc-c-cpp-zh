  md: '# Chapter 3 An Introduction to Touch


    The high-level interface consists of three events defined by the UIElement class:
    ManipulationStarted, ManipulationDelta, and ManipulationCompleted. The Manipulation
    movement events, as they''re collectively called, consolidate the interaction
    of multiple fingers into movement and scaling factors.


    The core of the low-level touch interface in Silverlight is a class TouchPoint,
    instance of which represents a particular finger touching the screen. TouchPoint
    has get-only properties:


    +   * Action of type TouchAction, an enumeration of members Down, Move, and Up.

    * Position of type Point, relative to the upper-left corner of a particular element.
    Let''s call this element reference element.

    * Size of type. This is supposed to represent the touch area (and, hence, pressure,
    more or less) but Windows Phone 7 doesn''t return useful values.

    * TouchDevice of type TouchDevice.


    The TouchDevice object has two get-only properties:


    +   * Id of type Id, to distinguish between fingers. A particular finger is associated
    with a unique Id for all events from Down through Up.

    * DirectlyOver of type UIElement, the topmost element underneath the finger.


    As you can see, the Silverlight TouchPoint and TouchDevice objects give you mostly
    the same information as the XNA Touch object, but the DirectlyOver of TouchDevice
    is very useful for determining what element the user is touching.


    To use the low-level touch interface, you install a handler for the static Touch.FrameReported
    event:


    ```

    Touch.FrameReported += OnTouchReported;

    ```


    The OnTouchReported method looks like this:


    ```

    void OnTouchReported(object sender, TouchFrameEventArgs args)

    {


    }

    ```


    The event handler gets all touch events throughout your application. The TouchFrameEventArgs
    object has a Timestamp property of type int, plus three methods:


    +   * GetTouchPoints(refElement) returns a TouchPointCollection

    * GetPrimaryTouchPoint(refElement) returns one TouchPoint

    * SuspendMousePromotionUntilTouchUp()'
