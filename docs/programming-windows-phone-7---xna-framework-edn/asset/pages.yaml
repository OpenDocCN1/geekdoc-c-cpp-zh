  md: '# The Multitasking Ideal


    Over the past few decades, it''s been a common desire that our personal computers
    be able to do more than one thing at a time. When user interfaces are involved,
    multitasking is never quite seamless as we''d like. The Terminate-and-Stay-Resident
    (TSR) programs of MS-DOS and the cooperative multitasking of early Windows were
    only first meager attempts in an ongoing struggle. In theory, process switching
    is easy. But sharing resources—including the screen and a handful of various input
    devices—is very hard.


    While the average user might marvel at the ability of modern Windows to juggle
    many different applications at once, programmers will wrestle with the difficulties
    of multitasking—carefully coding our UI threads to converse amicably with our
    non-UI threads, always on the lookout for the hidden treachery of asynchronous
    operations.


    Every new application programming interface we encounter makes a sort of awkward
    accommodation with the ideals of multitasking, and as we become familiar with
    the API we also become accustomed to this awkward accommodation, and eventually
    we might even consider this accommodation to be a proper solution to the problem.


    On Windows Phone 7, that awkward accommodation is known as tombstoning.


    # Task Switching on the Phone


    We want our phones to be like our other computers. We want to have a lot of applications
    available. We want to start a particular application as soon as we conceive a
    need for it. While that application is running, we want it to be as fast as possible
    and have access to unlimited resources. But we want this application to coexist
    with other running applications we want to be able to jump among multiple applications
    running on the machine.


    Arbitrarily jumping among running applications is somewhat impractical on the
    phone. It would require some kind of display showing all the currently running
    applications, like the Windows taskbar. Either this taskbar would have to be constantly
    visible—taking valuable screen space away from the active applications—or a special
    button or command would be assigned to display the taskbar or task list.


    Instead, Windows Phone 7 manages multiple active applications by implementing
    a task. In a sense, this application extends the page stack within a single Silverlight
    program. You can think of the phone as an old-fashioned web browser with no tab
    feature and no Forward button. But it does have a Back button and it also has
    a Start button, which brings you to the Start screen and allows you to launch
    a new program.


    Suppose you choose to launch a program called Analyze. You work a little with
    Analyze and then decide you''re finished. Press the Back button. The Analyze program
    is terminated and you''re back at the Start screen. That''s the simple scenario.'
