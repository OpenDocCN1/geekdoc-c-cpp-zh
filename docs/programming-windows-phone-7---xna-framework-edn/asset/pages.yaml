  md: '# Chapter 9


    # Dynamic Textures


    The most common way for an XNA program to obtain a Texture2D object is by loading
    it as program content. In Chapter 4 you also saw how a program can create a Texture2D
    from a Stream object using the static Texture2D.FromStream method. This Stream
    object can reference a bitmap downloaded over the internet, or a picture stored
    in the user’s photo library, or a photo just snapped by the phone''s camera.


    It is also possible to create a Texture2D object in early code using this constructor:


    ```

    Texture2D texture = new Texture2D(this.GraphicsDevice, width, height);

    ```


    The width and height arguments are indicate that the desired size of the Texture2D
    in pixels; this size cannot be changed after the Texture2D is created. The total
    number of pixels in the bitmap is easily calculated as width * height. The result
    is a bitmap filled with zeros. So now the big question is: How do you get actual
    stuff onto the surface of the bitmap?


    You have two ways:


    +   - Draw on the bitmap surface just as you draw on the video display.

    - Algorithically manipulate the actual pixel bits that make up the bitmap.


    You can use these two techniques separately, or in combination with each other.
    You can begin with an initial image, and modify it using these techniques.


    # The Render Target


    Strictly speaking, you can''t use the first of the two techniques with a Texture2D
    object. You need to create an instance of a class that derives from Texture2D
    called RenderTarget2D:


    ```

    RenderTarget2D renderTarget = new RenderTarget2D(this.GraphicsDevice, width, height);

    ```


    As with any code that references the GraphicsDevice property of the Game class,
    you''ll want to wait until the LoadContent method to create any Texture2D or RenderTarget2D
    objects your program needs. You''ll usually be storing the objects in fields so
    you can display them later in the Draw override.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 194 Part II XNA


    The idea behind the Render2D is fairly simple but understanding it requires some
    background:


    As you know, during the Draw override of the Game class, your program draws to
    the video display. You can set the entire video display to a particular color
    by calling the Clear method of the GraphicsDevice object associated with your
    game:


    ```

    this.GraphicsDevice.Clear(Color.CornflowerBlue);

    ```


    You can draw Texture2D objects and text strings on the display using a SpriteBatch
    object:


    ```

    spriteBatch.Begin();

    spriteBatch.Draw(...);

    spriteBatch.DrawString(...);

    spriteBatch.End();

    ```


    This SpriteBatch object is routinely created in the LoadContent override. It is
    associated with the GraphicsDevice object because a GraphicsDevice object is required
    in its constructor:


    ```

    spriteBatch = new SpriteBatch(this.GraphicsDevice);

    ```


    The calls to the Clear method of the GraphicsDevice and the Draw and DrawString
    methods of SpriteBatch actually draw to a bitmap calling the back buffer, the
    contents of which are then transferred to the video display. You can discover
    information about the back buffer through the PresentationParameters property
    of GraphicsDevice. If your program is running on a large-screen phone and you
    haven''t noticed that you want a non-default size for the back buffer, you will
    discover that BackBufferWidth and BackBufferHeight properties of PresentationParameters
    indicate 800 and 480, respectively.


    PresentationParameters also define BackBufferFormat property set to some of the
    SurfaceFormat enumeration. The format indicates the number of bits in each pixel
    and how these bits represent color. For Windows Phone 7 devices, you will discover
    that this BackBufferFormat property equals SurfaceFormat.Bgr565. This means that
    each pixel is 16 bits wide with 5 bits used for red and 6 bits for green in the
    following configuration:


    ```

    RRRRGGGGGGGBBBBB

    ```


    Green gets an extra bit because the human is in the center of the spectrum of
    electromagnetic radiation that is visible to the human eye—the primary to which
    humans are most sensitive.


    If you''ve ever seen any color gradients displayed on a Windows Phone 7 device—and
    if not, there''s one coming up in this chapter—you''ll probably notice that they
    aren''t as smooth as gradients on desktop displays. Video adapters in common use
    on the desktop use 8 bits for each primary. The 5 or 6 bits for each primary in
    the Phone 7 video display is insufficient to represent the color gradations that
    most humans can perceive. It is very likely that Windows Phone devices of the
    future will move beyond 16-bit color.'
  merge: -1
  pgno: 208
