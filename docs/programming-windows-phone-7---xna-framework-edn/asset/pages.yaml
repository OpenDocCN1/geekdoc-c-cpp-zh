    \ phone's photo library, and later email it to your friends.\n\nAs with the PhingerPaint\
    \ program, you can use up to four fingers for simultaneous drawing, and that's\
    \ why both programs use the low-level touch input rather than the gesture interface.\n\
    \n# The SpinPaint Code\n\nSpinPaint needs to handle touch in a very special way.\
    \ Not only can fingers move on the screen, but the disk rotates underneath the\
    \ fingers, even if a finger isn't moving it's still going to be drawing. Unlike\
    \ PhingerPaint, this program needs to keep track of each finger. For that reason,\
    \ it defines a *Dictionary* with an integer key (which is the touch ID) that maintains\
    \ objects of type *Touchinfo*, a small class internal to *Game1* that stores two\
    \ touch positions:\n\nXNA Project: SpinPaint File: Game1.cs (excerpt showing fields)\n\
    \n```\npublic class Game1 : Microsoft.Xna.Framework.Game\n{\n    GraphicsDeviceManager\
    \ graphics;\n    SpriteBatch spriteBatch;\n```"
