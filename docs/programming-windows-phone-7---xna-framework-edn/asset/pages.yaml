  md: '# Chapter 5

    Sensors and Services


    This chapter covers two the facilities in Windows Phone 7 that provide information
    about the outside world. With the user''s permission, the location service lets
    your application obtain the phone''s location on the earth in the traditional
    geographic coordinates of longitude and latitude, whereas the accelerometer tells
    your program which way is down.


    The accelerometer and location service are related in that neither of them will
    work well in outer space.


    Although the accelerometer and the location service are ostensibly rather easy,
    this chapter also explores issues involved with working with secondary threads
    of execution, handling asynchronous operations, and accessing web services.


    # Accelerometer


    Windows Phones contain an accelerometer—a small hardware device that essentially
    measures force, which elementary physics tells us is proportional to acceleration.
    When the phone is held still, the accelerometer responds to the force of gravity,
    so the accelerometer can tell you the direction of the Earth relative to the phone.


    A simulation of a bubble level is an archetypal application but the accelerometer
    can also provide a basis for interactive animations. For example, you might pilot
    a messenger bubble through the streets of Manhattan by tilting the phone left
    or right to indicate steering.


    The accelerometer also responds to sudden movements such as shakes or jerks, useful
    for simulations of dice or some type of randomizing activity. Coming with creative
    uses of the accelerometer is one of the many challenges of phone development.


    It is convenient to represent the accelerometer output as a vector in three-dimensional
    space. Vectors are commonly written in boldface, so the acceleration vector can
    be symbolized by (x, y, z). XNA defines a three-dimensional vector type; Silverlight


    While a three-dimensional point (x, y, z) indicates a location in space, the vector
    (x, y, z) encapsulates instead a direction and a magnitude. Obviously the point
    and the vector are related: Direction of the vector (x, y, z) is the direction
    from the point (0, 0, 0) to the point (x, y, z). But the vector (x, y, z) is definitely
    not the line from (0, 0, 0) to (x, y, z). It''s only the direction of that line.'
  merge: -1
