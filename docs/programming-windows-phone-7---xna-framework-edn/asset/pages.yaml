- img_proc: true
  md: '![](img/d9347c1f55fa6d523479d2cd9b4d5459_33_0.png)


    Although these colors are applied automatically, you''re not stuck with them in
    your application. If you''d like the text to be displayed in a different color,
    you can try setting the Foreground attribute in the *TextBlock* tag, for example:


    Foreground="Red"


    You can put it anywhere in the tag as long as you leave spaces on either side.
    As you type this attribute, you''ll see a list of colors pop up. Silverlight supports
    the 140 color names supported by many browsers, as well as a bonus 141st color,
    *Transparent.*


    In a real-world program, you''ll want to test out any custom colors with the available
    themes so text doesn''t mysteriously disappear or becomes hard to read.


    # # Points and Pixels


    Another property of the *TextBlock* that you can easily change is *FontSize:*


    FontSize="36"


    But what exactly does this mean?


    All dimensions in Silverlight are in units of pixels, and the *FontSize* is no
    exception. When you specify 36, you get a font from the top of its ascenders to
    the bottom of its descenders measures approximately 36 pixels.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Part I The Basics


    But fonts are never simple. The resultant TextBlock will actually have a height
    more like 48 pixels—about 33% higher than the FontSize would imply. This additional
    space (called leading) prevents successive lines of text against each other.


    Traditionally, font sizes are expressed in units of points. In classical typography,
    a point is very close to 1/72nd inch in digital typography the point is assumed
    to be exactly 1/72nd inch. A font with a size of 72 points measures approximately
    an inch from the top of its characters to the bottom. I say “approximately” because
    the point size indicates a typographic design height, and it''s really the creator
    of the font who determines exactly how large the characters of a 72-point font
    should be.


    How do you convert pixels and points? Obviously can''t except for a particular
    output device. On a 600 dots-per-inch (DPI) printer, for example, the 72-point
    font will be 600 pixels tall.


    Desktop displays in common use usually have a resolution somewhere in the region
    of 1000 DPI. For example, consider a 21" display that displays 1000 pixels horizontally
    and 1200 pixels vertically. The 2000 pixels diagonally, which divided by 21" is
    about 95 DPI.


    By default, Microsoft Windows assumes that video displays have a resolution of
    96 DPI. Under that assumption, font sizes and pixels are related by the following
    formulas:


    points = ¼ × pixels


    pixels = 4/3 × points


    Although this relationship applies only to common video displays, people so much
    enjoy having these conversion formulas, they show up in Windows Phone 7 programming
    as as


    So, when you set a FontSize property such as


    ```

    FontSize="36"

    ```


    you can also claim to be setting a 27-point size.


    For a particular point size, increase by 33% to get a pixel size. This is what
    you set to the FontSize property of TextBlock. The resultant TextBlock will then
    be 33% taller than the FontSize setting.


    The issue of font size becomes complex when dealing with high-resolution screens
    found on devices such as Windows Phone 7. The 480 × 800 pixel display has a diagonal
    of 933 pixels. The font I used for this book has a screen with about 3½ for a
    pixel density closer to 264 DPI. (Screen resolution is usually expressed as a
    multiple of 24.4) Roughly that 2½ times means the resolution of conventional video
    displays.


    This doesn''t necessarily mean that all the fonts used on a conventional screen
    can be increased by 2½ times the phone. The higher resolution of the phone—allows
    smaller font sizes to be more readable.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'When running in a Web browser, the default Silverlight FontSize is 11 pixels,
    for a font size of 8.25 points, which is fine for a desktop view display but a
    little too small for the phone. For that, Silverlight for Windows Phone defines
    a collection of common font sizes that you can use. (I''ll describe how later
    in Chapter 7). The standard MainPage.xml file includes the following attribute
    in the root element:


    ```

    FontSize={StaticResource FontSizeNormal}"

    ```


    This FontSize is inherited through the visual tree and applies to all TextBlock
    elements that don''t set their own FontSize properties. It has a value of 20 pixels—almost
    double the Silverlight FontSize on the desktop. Using the standard formulas, this
    20-pixel FontSize corresponds to 15 points, but as actually displayed on the phone,
    it is about 2/5 the size that a 15-point font would appear in printed text.


    The actual height of the TextBlock displaying text with font is about 33% more
    than the FontSize, in this case 27 pixels.


    # # The XAP is a ZIP


    If you navigate to the \bin\Debug directory of the Visual Studio project for SilverlightHelloPhone,
    you''ll find a file named SilverlightHelloPhone.xap. This is commonly referred
    to as a XAP file, pronounced “zap.” This is the file that is deployed to the phone
    or phone emulator.


    The XAP file is a package of others, in the very popular compression format known
    as ZIP (Shouting “The XAP is a ZIP” in a crowded will will attract attract Silverlight
    programmers.) If you rename SilverlightHelloPhone.xap to SilverlightHelloPhone.zip,
    you can look inside. You will see several bin files that are part of the project,
    an XML file, a XAML file, and a SilverlightHelloPhone.dll file, which is the compiled
    binary of your program.


    Any assets that your program needs can be made part of the Visual Studio project
    and added to this XAP file. Your program can access these files at runtime. I''ll
    discuss some of the concepts in Chapter 4.


    # # XNA Program for the Phone


    Next on the agenda is an XNA program that displays a little greeting in the center
    of the screen. While text is often prevalent in Silverlight applications, it is
    less common in graphical games. In games, text is usually relegated to describing
    how the game works or displaying the score, the very concept of a “hello, world”
    program doesn''t fit in the whole XNA programming paradigm.'
