    NavigationService that contains properties, methods, and events related to navigation,
    including the crucial Navigation method:


    ```

    this.NavigationService.Navigate(new SecondPage.xml", UriKind.Relative);

    ```


    The argument is an object of type Uri. Notice the slash in front of SecondPage.xml,
    and the use of UriKind.Relative to indicate a Uri relative to MainPage.xml.


    I created a page in the SilverlightNavigation project by right-clicking the project
    name in the Visual Studio solution explorer, and selecting Add and New Item. From
    the Add New Item dialog box, I picked Windows Portrait Page and gave it a name
