  md: "# Part II XNA\n\nFor example, suppose your texture has lots of color information\
    \ and you wish all those colors to be preserved on the display. Use a value of\
    \ Color.White in the Draw method.\n\nNow suppose you want to draw that texture\
    \ much darker. Perhaps the sun is setting in your game world. Use some gray value\
    \ in the Draw method. The darker the gray, the darker the texture will appear.\
    \ If you use Color.Black, the texture will appear as a silhouette with no color.\n\
    \nSuppose your texture is all white and you wish to display it as blue. Use Color.Blue\
    \ in the Draw method. You can display the same-white texture in a variety of colors.\
    \ (I’ll do precisely in the first sample program in this chapter.)\n\nIf your\
    \ texture is yellow (a combination of red and green) and you use Color.Green in\
    \ the Draw method, it will be displayed as green. If you use Color.Blue in the\
    \ Draw method, it will turn black. The argument to Draw can only attenuate or\
    \ suppress colors that aren't in the texture to begin with.\n\nThe second version\
    \ of the Draw method is:\n\n```\nDraw(Texture2D texture, Rectangle destination,\
    \ color color)\n```\n\nInstead of a Vector2 to indicate the position of the texture,\
    \ you use a Rectangle, which is the combination of a point (the upper-left corner),\
    \ a width, and a height. If the height of the Rectangle doesn't match the width\
    \ and height of the texture, the texture will be scaled to the size of the Rectangle.\
    \ The original aspect ratio is ignored.\n\nIf you only want to display a rectangular\
    \ subset of the texture, you can use one of the two slightly expanded versions\
    \ of the Draw method:\n\n```\nDraw(Texture2D texture, Vector2 position, Rectangle?,\
    \ source, Color color)\nDraw(Texture2D texture, Vector2 position, Rectangle destination,\
    \ Rectangle?, source, Color color)\n```\n\nThe third arguments are nullable Rectangle\
    \ objects. If you set this argument to null, the result is the same as one of\
    \ the first two versions of Draw. Otherwise you can specify a pixel subset of\
    \ the image.\n\nThe next two versions of Draw have five additional arguments that\
    \ you’ll recognize from the DrawStrings:\n\n```\nDraw(Texture2D texture, Vector2\
    \ position, Rectangle?, source, Color color,\n    Float rotation, Vector2 origin,\
    \ float scale, SpriteEffects effects, float depth)\n```\n\n```\nDraw(Texture2D\
    \ texture, Vector2 position, Rectangle?, source, Color color,\n    Float rotation,\
    \ Vector2 origin, Vector2 scale, SpriteEffects effects, float depth)\n```\n\n\
    As with DrawString, the rotation angle is in radians, measured clockwise. The\
    \ origin is a point in the texture that is to be aligned with the position argument.\
    \ You can scale uniformly"
