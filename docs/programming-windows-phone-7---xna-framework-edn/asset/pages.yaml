    \ graphics;\n    SpriteBatch spriteBatch;\n    Viewport;\n    Texture2D car;\n\
    \    Vector2 carCenter;\n    Curve XCurve = new Curve();\n    Curve YCurve = new\
    \ Curve();\n    Vector2 position;\n    float rotation;\n\n}\n```\n\nNotice the\
    \ two Curve objects, one for X coordinates and the other for Y. Because the initialization\
    \ of these objects uses precisely the coordinates I described above and don't"
