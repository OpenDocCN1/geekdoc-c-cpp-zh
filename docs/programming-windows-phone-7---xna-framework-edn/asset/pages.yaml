  md: 'In 1980, Benoit Mandelbrot (1924–2010), a Polish-born French and American mathematician
    working for IBM, saw for the first time a graphic visualization of a recursive
    equation involving complex numbers that had been investigated earlier in the century.
    It looked something like this:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_274_0.png)


    Since that time, the Mandelbrot Set (as it is called) has become a favorite plaything
    of computer programmers.


    The Mandelbrot Set is graphed on the complex plane, where the horizontal axis
    represents real numbers (negative at the left and positive at the right) and the
    vertical axis represents imaginary numbers (negative at the bottom and positive
    at the top). Take any point in the plane and call it c, and set z equal to 0:


    ```

    z = 0

    ```


    Now perform the following recursive operation:


    ```

    z = z² + c

    ```


    If the magnitude of z does not diverge to infinity, then c is said to belong to
    the Mandelbrot Set and is colored black in the above screen.


    For some complex numbers (for example, the real number 0) it is very clear that
    the number belongs to the Mandelbrot Set. For others (for example, the real number
    1) it is very clear that it does not. For many others, you just have to start
    cranking the values. Fortunately, the absolute value of z becomes greater than
    2 after a finite number of iterations, you know that c does not belong to the
    Mandelbrot Set.


    Each number c that does not belong to the Mandelbrot Set has an associated “iteration”
    factor, which is the number of iterations calculating z that occur before the
    absolute value'
