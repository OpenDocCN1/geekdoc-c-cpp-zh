  md: "# Chapter 10 From Gestures to Transforms 291\n\nThe point (1, 1) is mapped\
    \ to (a, b), which requires a bit of algebra to derive:\n\n```\nM11 = \\frac{a}{a+b-1}\n\
    M22 = \\frac{b}{a+b-1}\n```\n\nAnd a and b have already been calculated in connection\
    \ with the affine transform.\n\nThis math has been incorporated into a second\
    \ MatrixHelper.ComputeMatrix method in the Petzold.Phone.Xna library.\n\n![](img/d9347c1f55fa6d523479d2cd9b4d5459_305_0.png)\n\
    \n```\npublic static Matrix ComputeMatrix(Vector2 size, Vector2 ptUL, Vector2\
    \ ptUR,\n  Vector2 ptLL, Vector2 ptLR)\n{\n  // Scale transform\n  Matrix S =\
    \ Matrix.CreateScale(1 / size.X, 1 / size.Y, 1);\n\n  // Affine transform\n  Matrix\
    \ A = ComputeAffineTransform(ptUL, ptUR, ptLL);\n\n  // Non-Affine transform\n\
    \  Matrix B = new Matrix();\n  float a = (A.M11 * A.M22 - A.M12 * A.M21) * ptLR.Y\
    \ +\n    A.M21 * A.M42 - A.M22 * A.M41) / den;\n\n  float b = (A.M11 * ptLR.Y\
    \ - A.M12 * ptLR.X) * ptLR.X +\n    A.M12 * A.M41 - A.M21 * A.M42) / den;\n\n\
    \  B.M11 = a / (a + b - 1);\n  B.M22 = b / (a + b - 1);\n  B.M33 = 1;\n  B.M14\
    \ = B.M11 - 1;\n  B.M24 = B.M22 - 1;\n  B.M44 = 1;\n\n  // Product of three transforms\n\
    \  return S * B * A;\n}\n```\n\nI won't show you the NonAffineTransform program\
    \ because it's pretty much the same as the AffineTransform program but with a\
    \ fourth component whose Position property is passed to the second ComputeMatrix\
    \ method.\n\nThe big difference with the new program is that non-affine transforms\
    \ are much more fun!"
