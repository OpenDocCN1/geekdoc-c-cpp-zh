    Silverlight Project: SilverlightPhone File: App.xaml.cs (excerpt)\nnamespace SilverlightPhone\n\
    {\n    public partial class App : Application\n    {\n        public App()\n \
    \       {\n            InitializeComponent();\n        }\n        ...\n    }\n\
    }\n```\n\nAll Silverlight programs contain an App class that derives from Application;\
    \ this class performs application-wide initialization, startup, and shutdown chores.\
    \ You'll notice this class is defined as a partial class, meaning that the project\
    \ should probably include another C# file that contains additional members of\
