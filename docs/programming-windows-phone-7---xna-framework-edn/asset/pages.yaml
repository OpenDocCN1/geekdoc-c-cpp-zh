  md: "# Chapter 5 Sensors and Services\n\nTowards the bottom you'll see a field named\
    \ accelerometerVector of type Vector3. The OnAccelerometerReadingChanged event\
    \ handler will store a new value in that field, and the Update method will utilize\
    \ the value in calculating a position for a bitmask.\n\nOnAccelerometerReadingChanged\
    \ and Update run in separate threads. One is setting the field; the other is accessing\
    \ the field. This is no problem if the field is set or accessed in a single machine\
    \ code instruction. But that would be the case if Vector3 were a class, with a\
    \ reference type and basically referenced with something akin to a pointer. But\
    \ Vector3 is a structure (a value type) consisting of three properties of type\
    \ float, each of occupies four bytes, for a total of 12 bytes or 96 bits. Setting\
    \ or accessing this Vector3 field requires many bits to be transferred.\n\nA Windows\
    \ Phone 7 device contains at least a 32-bit ARM processor, and a brief glance\
    \ at the ARM instruction set does not reveal any machine code that would perform\
    \ a 12-byte memory transfer in one instruction. This means that the accelerometer\
    \ storing a new Vector3 value could be interrupted midway in the process by the\
    \ Update method in the program's main thread when it retrieves that value. The\
    \ resultant value might have X, Y, and Z values mixed up from two readings.\n\n\
    While that could be hardly classified as a catastrophe in this program, let it\
    \ entirely safe and use the C# lock statement to make sure the Vector3 value is\
    \ stored and retrieved by the two threads without interruption. That's the purpose\
    \ of the accelerometerLock variable among the fields.\n\nI chose to create the\
    \ Accelerometer object and set the event handler in the Initialize method:\n\n\
    ```\nXNA Project: XnaAccelerometer File: Game1.cs (excerpt)\n\nprotected override\
    \ void Initialize()\n{\n    Accelerometer accelerometer = new Accelerometer();\n\
    \    accelerometer.ReadingChanged += OnAccelerometerReadingChanged;\n\n    try\n\
    \    {\n        accelerometer.Start();\n    }\n    catch\n    {\n    }\n\n   \
    \ base.Initialize();\n}\n\nvoid OnAccelerometerReadingChanged(object sender, AccelerometerEventArgs\
    \ args)\n{\n}\n```"
