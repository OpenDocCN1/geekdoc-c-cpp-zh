  md: "# Part I The Basics\n\n```\nvoid OnTouchFrameReported(object sender, TouchFrameEventArgs\
    \ args)\n{\n    TouchPoint primaryTouchPoint = args.GetPrimaryTouchPoint(null);\n\
    \    if (primaryTouchPoint != null && primaryTouchPoint.Action == TouchAction.Down)\n\
    \    {\n        if (primaryTouchPoint.TouchDevice.DirectlyOver == txtblk)\n  \
    \      {\n            txtblk.Foreground = new SolidBrush(Color.FromArgb(255, (byte)rand.Next(256),\
    \ (byte)rand.Next(256), (byte)rand.Next(256)));\n        }\n        else\n   \
    \     {\n            txtblk.Foreground = originalBrush;\n        }\n    }\n}\n\
    ```\n\nThe handler is only interested in primary touch points with an Action of\
    \ Down. If the DirectlyOver property is the element named txtblk, a random color\
    \ is created. Unlike the Color structure in XNA, the Silverlight Color structure\
    \ doesn't have a constructor to set a color from red, green, and blue, but it\
    \ does have a FromArgb method that creates a Color object based on alpha, red,\
    \ green, and blue values, where alpha is opacity. Set the alpha channel to 255\
    \ to get an opaque color. Although it's not obvious at all in the XAML files,\
    \ the Foreground property is actually of type Brush, an abstract class from SolidColorBrush\
    \ descends.\n\nIf DirectlyOver is not set, the program doesn't change the color\
    \ to white, because that wouldn't work if the user chose a color theme of black\
    \ text on a white background. Instead, it sets the Foreground property to the\
    \ brush originally set on the TextBlock. This is obtained in the constructor.\n\
    \n# The Manipulation Events\n\nThe high-level touch interface in Silverlight involves\
    \ three events: ManipulationStarted, ManipulationDelta, and ManipulationCompleted.\
    \ These events don't bother with reporting the activity of individual fingers.\
    \ Instead, they consolidate the activity of multiple fingers into translation\
    \ and scaling operations. The events also accumulate velocity information, so\
    \ while they don't support inertia directly, they can be used to implement inertia."
