    (0,1) → (x_2, y_2)


    These are, respectively, the upper-left, upper-right, and lower-left corners.
    Using the fields of the Matrix object defined in XNA, the transform formulas are:


    ```

    x'' = M11 · x + M21 · y + M41

    y'' = M12 · x + M22 · y + M42

    ```


    It’s easy to apply the transform to the points (0, 0), (1, 0), and (0, 1) and
    solve for the elements of the matrix:


    ```

    M11 = x_1 - x_0

    M12 = y_1 - y_0

    M21 = x_2 - x_0

    M22 = y_2 - y_0

    M41 = x_0

    M42 = y_0

    ```'
