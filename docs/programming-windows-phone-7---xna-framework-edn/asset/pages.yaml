  md: '# Chapter 10 From Gestures to Transforms 247


    A particular transform is applied to a point (x, y) by representing the point
    as a 1 × 3 matrix with a 1 in the third position and performing a matrix multiplication:


    ```

    $$\begin{matrix} a_x & a_y & 0 \ b_x & b_y & 0 \ c_x & c_y & 1 \end{matrix} |x\
    y\ 1| = |x''\ y''\ 1|$

    ```


    The identity matrix contains a diagonal of all 1''s and results in no transform:


    ```

    1 0 0

    0 1 0

    1 0 1

    ```


    Representing transforms with matrices is of great advantage when transforms are
    combined. Combining transforms is equivalent to multiplying matrices, and that''s
    an operation that is well known. It is also well known that matrix multiplication
    is not commutative. The order of the multiplication makes a difference in the
    result.


    For example, you might apply a scale transform to a graphical object to make it
    larger, and then apply a translate transform to move it. If you switch two operations—perform
    the first translation and then the scaling—the result is different because you''re
    effectively scaling the original factors as well.


    Transforms in 2D space require a 3x3 matrix, and transforms in 3D space require
    a 4x4 matrix. There is a good reason why the matrix needs one more dimension than
    the coordinate space. It''s all about translation. Translation is very basic and
    very desirable but it can''t be represented with a linear transform that only
    applies to x and y. To represent translation as a linear transform, another dimension
    must be added. Translation in two dimensions in actually skew in three dimensions,
    and that''s why the two-dimensional point is converted to a three-dimensional
    point with a z value of 1 for multiplying by the matrix.


    The third column of a two-dimensional affine transform is always two zeros and
    a 1 in the bottom right corner. That''s what makes it an affine transform. (I''ll
    discuss affine-dimensional transforms towards the end of this chapter).


    After my big build-up, you''ll probably be surprised to learn that XNA is unlike
    other graphical programming environments in it does not support a structure that
    encapsulates a 3x3 transform matrix. In XNA matrices are used much more for 3D
    programming, so the XNA structure actually encapsulates a 4x4 matrix suitable
    for 3D graphics but is a bit-overkill for 2D.


    Although you can use the Matrix structure with 2D graphics—and is very convenient
    for performing compound transforms—there is not much support for transforms in
    2D drawing except a more extensive version of the Begin call of SpriteBatch:


    ```

    spriteBatch.Begin(SpriteMode.Deferred, null, null, null, null, null, matrix);

    ```'
