  md: '# Chapter 4

    Bitmaps, Also Known as Textures


    Aside from text, one of the most common objects to appear in both Silverlight
    and XNA applications are the bitmap, formally defined as a two-dimensional array
    of bits corresponding to the pixels of a graphics display device.


    In Silverlight, a bitmap is sometimes referred to as an image, but that''s mostly
    a remnant of the Windows Presentation Foundation, where the word image refers
    to both bitmaps and vector-based drawings. In both WPF and Silverlight, the Image
    element displays bitmaps but the Image element is not the bitmap itself.


    In XNA, a bitmap has a data type of Texture2D and hence often referred to as a
    texture, but that term is mostly related to 3D programming where bitmaps are used
    to cover surfaces of 3D solids. In XNA 2D programming, bitmaps are often used
    as sprites.


    Bitmaps are also used to symbolize your application on the phone. A new XNA or
    Silverlight project in Visual Studio results in the creation of bitmaps for various
    purposes.


    The native Windows bitmap format has an extension of BMP but it becomes less popular
    in recent years as compressed formats have become widespread. At this time, the
    three most popular bitmap formats are probable:


    +   - JPEG (Joint Photography Experts Group)

    - PNG (Portable Network Graphics)

    - GIF (Graphics Interchange File)


    XNA supports all three (and more). Silverlight supports only JPEG and PNG. (And
    if you''re like most Silverlight programmers, you''ll always remember this simple
    fact and someday why your Silverlight program refuses to display a GIF or a BMP)


    The compression algorithms implemented by PNG and GIF do not result in the loss
    of any data. The original bitmap can be reconstructed exactly. For that reason,
    these are often referred to as "lossless" compression algorithms.


    JPEG implements a "lossy" algorithm by discarding visual information that is less
    perceptible by human observers. This type of compression works well for real-world
    images such as photographs, but is less suitable for bitmaps that derive from
    text or vector-based images, such as architectural drawings or cartoons.'
  merge: -1
  pgno: 79
