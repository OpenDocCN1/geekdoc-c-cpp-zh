    One of the interesting characteristics of the Mandelbrot Set is that no matter
    how much you zoom in, the complexity of the image does not decrease:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_275_1.png)


    That qualifies the Mandelbrot Set as a fractal, a branch of mathematics that Benoit
    Mandelbrot pioneered. Considering the simplicity of the algorithm that produces
    this image, the results are truly astonishing.


