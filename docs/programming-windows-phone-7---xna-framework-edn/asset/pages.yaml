  md: "# Chapter 9 Dynamic Textures 231\n\nThe goal during the Update method is to\
    \ transfer pixels from srcPixels to dPixels based on an algorithm that incorporates\
    \ animation. The dPixels array is copied into dstTexture with SetData.\n\nTo transfer\
    \ pixels from a source to a destination, two different approaches are used:\n\n\
    +   - Loop through the source rows and columns. Get each source pixel. Figure\
    \ out the corresponding destination row and column and store the pixel.\n- Loop\
    \ through the destination rows and columns. Figure out the corresponding source\
    \ row and column, get the pixel, and store it in the destination.\n\nIn the general\
    \ case, the second approach is usually a bit harder than the first but that doesn't\
    \ matter because it's the only one that guarantees every pixel in the destination\
    \ bitmap is set. That's why the for loops in the following method are based on\
    \ xD and yDst, the column and row of the destination bitmap. From these, xSrc\
    \ and yDst are calculated. (In this particular algorithm, xSrc always equals xDst).\n\
    \nThe two pixel arrays can be indexed with dstindex and srcindex. Although dstindex\
    \ will always be valid based on xDst and yDst values, for some values srcindex\
    \ might not be valid. In those cases, I set the pixel reference by dstindex to\
    \ a transparent value.\n\n> XNA Project: RippleEffect File: Game1.cs (excerpt)\n\
    \n```\nprotected override void Update(GameTime gameTime)\n    // Allows the game\
