  md: 'Part I The Basics


    The final argument to Draw is a color that can be used to attenuate the existing
    colors in the bitmap. Use Color.White if you want the bitmap''s colors to display
    without any alteration.


    And here it is:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_82_0.png)


    # The Silverlight Image Element


    The equivalent program in Silverlight is even simpler. Let''s create a project
    named SilverlightLocalBitmap. First create a directory in the project to store
    the bitmap. This isn''t strictly required but makes it for a tidier project. Programmers
    usually name this directory Images or Media or Assets depending on the types of
    files that might be stored there. Right-click the project name and choose Add
    and then New Folder. Let''s name it Images. Then right-click the folder name and
    choose Add and Existing Item. Navigate to the Hello png file. (If you''ve created
    a different bitmap on your own, keep in mind that Silverlight only supports JPEG
    and PNG files).


    From the Add button choose either Add or As Link. If you choose Add, a copy will
    be made and the file will be physically copied into a subproject of the project.
    If you choose As Link, only a reference will be retained with the project but
    the file will still be copied into the executable.


    The final step: Right-click the bitmap filename and display Properties. Note that
    the Build Action is Resource. It''s possible to change Build Action to Content,
    but let''s leave it for now and I''ll discuss the difference shortly.


    In Silverlight, you use the Image element to display bitmaps just as you use the
    TextBlock element to display text. Set the Source property of Image to the folder
    and filename of the bitmap within the project:'
