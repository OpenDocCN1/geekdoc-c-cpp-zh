  md: '# Chapter 10


    # From Gestures to Transforms


    The primary means of user input to Windows Phone 7 application is touch. A Windows
    Phone 7 device has a screen that supports at least four touch points, and applications
    can be written to accommodate touch in a way that feels natural and intuitive
    to the user.


    As you''ve seen, XNA programmers have two basic approaches to obtaining touch
    input. With the low-level TouchPanel.GetState method program can track individual
    fingers—each identified by an ID number—as they first touch the screen, move,
    and lift off. The TouchPanel.ReadGesture method provides a somewhat higher-level
    interface that allows rudimentary handling of inertia and two-finger manipulation
    in the form of "pinch" and "stretch" gestures.


    # Gestures and Properties


    The various gestures supported by the TouchPanel class correspond to members of
    the GestureType enumeration:


    +   * Tap—quickly touch and lift

    * DoubleTap—the second of two successive taps

    * Hold—press and hold for one second

    * FreeDrag—move finger around the screen

    * HorizontalDrag—horizontal component of FreeDrag

    * VerticalDrag—vertical component of FreeDrag

    * DragComplete—finger lifted from screen

    * Flick—single-finger swipe movement

    * Pinch—two fingers moving towards each other or apart

    * PinchComplete—fingers lifted from screen


    To receive information for particular gestures, the gestures must be enabled by
    setting the TouchPanel.EnabledGestures property. The program then obtains gestures
    during the Update override of the Game class in form of GestureSample structures
    that include a GestureType property to identify the gesture.'
