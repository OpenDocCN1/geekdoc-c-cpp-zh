  md: "# Part II XNA\n\n```\n// Notice looping begins at index 1\nfor (int i = 1;\
    \ i < Vertices.Count; i++)\n{\n    float prevLength = accumulateLength;\n    accumulateLength\
    \ += Vertices[i - 1].Length();\n\n    if (t >= prevLength / totalLength && t <\
    \ accumulateLength / totalLength)\n    {\n        float tPrev = prevLength / totalLength;\n\
    \        float tThis = accumulateLength / totalLength;\n        float tNew = (t\
    \ - tPrev) / (tThis - tPrev);\n\n        return GetValue(Vertices[i - 1], Vertices[i],\n\
    \            tNew, smooth, out angle);\n    }\n}\n\n    return GetValue(Vector2.Zero,\
    \ Vector2.Zero, t, smooth, out angle);\n}\n\nVector2 GetValue(Vector2 vertex1,\
    \ Vector2 vertex2, float t,\n    smooth, out angle)\n{\n    angle = (float)Math.Atan2(vertex2.Y\
    \ - vertex1.Y, vertex2.X - vertex1.X);\n\n    return smooth ? Vector2.SmoothStep(vertex1,\
    \ vertex2, t) :\n        Vector2.Lerp(vertex1, vertex2, t);\n}\n```\n\nThe single\
    \ Vertices property allows you to define a collection of Vector2 objects that\
    \ define the polyline. If you want the polyline to end up where you started, need\
    \ to explicitly duplicate that point. All the work occurs during the GetValue\
    \ method. At that time, the method determines the total length of the polyline.\
    \ It then loops through the vertices and accumulates their length, finding the\
    \ pair of vertices whose accumulated length straddles the t value. These are passed\
    \ to the GetValue method to perform the linear interpolation using Vector2.Lerp,\
    \ and to calculate the tangent angle with the graphics programmer's second BFF,\
    \ Math.Atan2.\n\nBut wait: there is a Boolean argument to GetValue that causes\
    \ the method to use Vector2.SmoothStep rather than Vector2.Lerp. You can try this\
    \ alternative by replacing this call in the Update method of Game1:\n\n```\nposition\
    \ = polylineInterpolator.GetValue(t, false, out angle);\n```\n\nwith this one:\n\
    \n```\nposition = polylineInterpolator.GetValue(t, true, out angle);\n```"
