    # The Essential People


    This book owes its existence to Dave Edson—an old friend from the early 1990s
    era of Microsoft Systems Journal—who had the brilliant idea that I would be the
    perfect person to write a tutorial on Windows Phone 7. Dave arranged for me to
    attend a technical deep on the phone at Microsoft in December 2009, and I hooked.
    Todd Brix gave the thumbs up on the book, and Anand Iyer coordinated the project
    with Microsoft Press.


    At Microsoft Press, Ben Ryan launched the project and Devon Musgrave had the unviable
    job of making me copy and prose an actual book. (We all go way back: You''ll see
    Ben and Devon''s names on the bottom of the copyright page of Programming Windows,
    fifth edition, published in 1998).


    My Technical Reviewer was the diligent Blomquist, who apparently tested all the
    code in both the sample files as the listings appear in the book, and who the
    process caused several errors on my part that were truly, well, shocking.


    Dave Edson also reviewed some chapters and served as conduit to the Windows Phone
    team to deal with my technical problems and questions. Early on, Aaron Steiner
    provided essential guidance; Michael Klucher reviewed chapters, Kirti Deshpande,
    Charlie Kindel, Casey McGee, and Shawn Oster also had important things to tell
    me. Thanks to Bonnie Lehenbauer for reviewing a chapter.


    I am also indebted to Shawn Hargves for his XNA expertise, and Yochay Kiriaty
    and Richard Bailey for the lowdown on tombstoning.


    My wife Deirdre Sinnott has been a marvel of patience and tolerance over the past
    months as she dealt with an author given to sudden mood swings, insane yelling
    at the computer screen, and the conviction that the difficulty of writing a book
    relieves her the responsibility of performing basic household chores.'
