  md: "# Part I The Basics\n\nYou'll need a using directive for the System.Windows.Navigation\
    \ namespace for the NavigationEventArgs class.\n\nThe OnNavigatedTo method is\
    \ defined by Page, the class from which PhoneApplicationPage derives. The method\
    \ is called right after the page has been created. When OnNavigatedTo is called,\
    \ the page constructor has already executed, of course, but not much has happened.\n\
    \nThe destination class can access the query strings used to invoke the page through\
    \ the page's NavigationContext. This property is of type NavigationView, a class\
    \ that has only one public property named QueryString, which returns a dictionary\
    \ that I've saved in a variable called parameters. The code here assumes that\
    \ if the \"Red\" query string is present, the \"Blue\" and \"Green\" must exist\
    \ well. It passes all the strings to the Byte.Parse method and reconstructs the\
    \ color.\n\nNow as you navigate from MainPage to SecondPage, the background color\
    \ remains the same. As you go, however, that's not the case. There is no built-in\
    \ facility to pass the query string to data from one page to another.\n\n# Sharing\
    \ Data Among Pages\n\nKeep in mind that all the pages in your program have convenient\
    \ access to the App class that derives from Application. The static Application.Current\
    \ property returns the Application object associated with the program, and you\
    \ can simply cast that to App. This means that you can use App class for storing\
    \ data you want to share among multiple pages of the application.\n\nIn the SilverlightShareData\
    \ project, I defined a simple property in the App class:\n\n```\nSilverlight Project:\
    \ SilverlightShareData File: App.xaml.cs (excerpt)\n\npublic partial class App\
    \ : Application\n{\n    // public property for sharing data among pages\n    public\
    \ Color? SharedColor { get; set; }\n\n}}\n```\n\nI defined this property of type\
    \ nullable Color rather than just Color for cases where a SolidColorBrush has\
    \ not been set on the Background property of ContentPanel. In those cases, the\
    \ Background property is null and then there't be a Color stored in this property.\
    \ If the property were of type Color, then a Color would be default by default;\
    \ that Color value would be transparent black, and that's wrong. Even non-transparent\
    \ black is wrong if the user has selected the Light color scheme."
