    \ assisted by some similar logic on the site for Windows Forms (which suppose\
    \ dates it a bit).\n\nNotice that the loop creates each Image object to display\
    \ each tile. Each of these Image objects has the same Stretch, HorizontalAlignment,\
    \ and VerticalAlignment properties, but a different Margin. Margin is how the\
    \ individual tiles are positioned within the content grid. The XOffset and YOffset\
