  md: "A static class named MatrixHelper in the Petzold.Xna library has a method named\
    \ ComputeAffineTransform that creates a Matrix object based on these formulas:\n\
    \n# XNA Project: Petzold.Xna File: MatrixHelper.cs (excerpt)\n\n```\nstatic Matrix\
    \ ComputeAffineTransform(Vector2 ptUL, Vector2 ptUR, Vector2 ptLL)\n{\n    return\
    \ new Matrix()\n    {\n        M11 = (ptUR.X - ptUL.X),\n        M12 = (ptUR.Y\
    \ - ptUL.Y),\n        M21 = (ptLL.X - ptUL.X),\n        M22 = (ptLL.Y - ptUL.Y),\n\
    \        M33 = 1,\n        M41 = ptUL.X,\n        M42 = ptUL.Y,\n        M44 =\
    \ 1\n    };\n}\n```\n\nThis method isn't public because it's not very useful by\
    \ itself. It's not very useful because the formulas are based on transforming\
    \ an image that is one-pixel wide and one-pixel tall. Notice, however, that the\
    \ code sets M33 and M44 to 1. This doesn't happen automatically and it is essential\
    \ for the matrix to work right.\n\nTo compute a Matrix for an affine transform\
    \ that applies to an object of a particular size, the following method might be\
    \ very useful:\n\n# XNA Project: Petzold.Xna File: MatrixHelper.cs (excerpt)\n\
    \n```\npublic static Matrix ComputeAffineTransform(Vector2 size, Vector2 ptUL,\
    \ Vector2 ptUR, Vector2 ptLL)\n{\n    // Scale transform\n    Matrix S = Matrix.CreateScale(1\
    \ / size.X, 1 / size.Y, 1);\n\n    // Affine transform\n    Matrix A = ComputeAffineTransform(ptUL,\
    \ ptUR);\n\n    // Product of two transforms\n    return S * A;\n}\n```\n\nThe\
    \ first transform scales the object to a 1×1 size before applying the computed\
    \ affine transform."
