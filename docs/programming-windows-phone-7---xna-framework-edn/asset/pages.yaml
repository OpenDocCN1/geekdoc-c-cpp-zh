  md: "# Part II XNA\n\nThe cells along the top edge have their HasTop properties\
    \ set to true, all cells along the left edge have their HasLeft properties set\
    \ to true and similarly for the right and bottom.\n\nThe array of MazeCell objects\
    \ that comprise a maze is created and maintained by MazeGrid, which has a single\
    \ constructor that accepts a width and height in number of cells (for example,\
    \ 5 and 8 in the above example). Here's the MazeGrid constructor, three properties,\
    \ as well as the Random object:\n\n```\nProject: Petzold.Phone.Xna File: MazeGrid.cs\
    \ (excerpt)\n\npublic class MazeGrid\n{\n    Random rand = new Random();\n\n \
    \   public MazeGrid(int width, int height)\n    {\n        Width = width;\n  \
    \      Height = height;\n        Cells = new MazeCell[Width, Height];\n\n    \
    \    for (int y = 0; y < Height; y++)\n            for (int x = 0; x < Width;\
    \ x++)\n            {\n                Cells[x,y].HasLeft = x == 0;\n        \
    \        Cells[x,y].HasTop = y == 0;\n                Cells[x,y].HasRight = x\
    \ == Width - 1;\n                Cells[x,y].HasBottom = y == Height - 1;\n   \
    \         }\n\n        MazeChamber rootChamber = new MazeChamber(0, 0, Width,\
    \ Height);\n        DivideChamber(rootChamber);\n    }\n\n    public int Width\
    \ { protected set; get; }\n    public int Height { protected set; get; }\n   \
    \ public MazeCell[,] Cells { protected set; get; }\n\n}\n```\n\nThe constructor\
    \ concludes by creating an object of type MazeChamber the same size as itself\
    \ and calling DivideChamber, which is a recursive method I'll show you shortly.\
    \ In maze-generation algorithm, a chamber is a rectangular grid of cells with\
    \ an interior that is devoid of walls. Each chamber is then divided into two with\
    \ a wall placed randomly within the chamber (but generally going across the shortest\
    \ dimension) with a single randomly selected gap. This process creates two chambers\
    \ accessible to each other through that gap, and the sub-division continues until\
    \ the chambers become the size of the cell."
