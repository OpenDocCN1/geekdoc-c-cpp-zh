  md: "# Chapter 6 Issues in Application Architecture 139\n\nNotice that the new color\
    \ is not saved as a field, but as the BackgroundColor property of the Settings\
    \ instance. That property is then referenced in the Draw override:\n\n```\nSilverlight\
    \ Project: XnaTombstoning File: Game1.cs (excerpt)\nprotected override void Draw(GameTime\
    \ gameTime)\n{\n    GraphicsDevice.Clear(settings.BackgroundColor);\n\n    spriteBatch.Begin();\n\
    \    spriteBatch.DrawString(seoe14, text, position, Color.White);\n    spriteBatch.End();\n\
    \n    base.Draw(gameTime);\n}\n```\n\nThe transient value of the numTaps field\
    \ is saved to and restored from the State dictionary of the PhoneApplicationService\
    \ in overrides of OnActivated and OnDeactivated:\n\n```\nSilverlight Project:\
    \ XnaTombstoning File: Game1.cs (excerpt)\nprotected override void OnActivated(object\
    \ sender\n```\n\nIt might seem a little arbitrary to save and restore application\
    \ settings in one set of handlers, and save and restore transient settings in\
    \ another set of overrides to virtual methods, and in a practical sense it is\
    \ arbitrary. The program will get a call to OnActivated about the same time the\
    \ Launching and Activated events are fired, and a call to OnDeactivated the same\
    \ time the Deactivating and Closing events are fired. The differentiation is more\
    \ conceptual in that OnActivated and OnDeactivated are associated with the Game\
    \ instance, so they should be used for properties associated with the game rather\
    \ than overall application settings."
