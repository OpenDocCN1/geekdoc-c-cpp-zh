  md: '# XNA Orientation


    By default, XNA for Windows Phone is set up for a landscape orientation, perhaps
    to be compatible with other screens on which games are played. Both landscape
    orientations are supported, and the display will automatically flip around when
    you turn the phone from one landscape orientation to the other. If you prefer
    designing your game for a portrait display, it''s easy to do that. In the constructor
    of the Game1 class of XnaHello, try inserting the following statements:


    ```

    graphics.PreferredBackBufferwidth = 320;

    graphics.PreferredBackBufferHeight = 480;

    ```


    The back buffer is the surface area on which XNA constructs the graphics you display
    in the Draw method. You can control the size and the aspect ratio of this buffer.
    Because the buffer width I''ve specified here is smaller than the buffer height,
    XNA assumes that I want a portrait display:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_54_0.png)


    Look at that! The back buffer I specified is not the same aspect ratio as the
    Windows Phone 7 display, so the drawing surface is letter-boxed! The text is larger
    because it''s the same pixel size but now the display resolution has been reduced.'
