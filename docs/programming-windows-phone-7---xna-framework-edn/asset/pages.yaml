  md: "# Chapter 11 Touch and Play 319\n\nTo take account of the spinning of the disk,\
    \ the fields include previousAngle and currentAngle. Update now calculates two\
    \ matrices called previousRotation and currentRotation based on these fields.\
    \ Notice that these matrices are obtained from calls to Matrix.CreateRotationZ\
    \ but they are bracketed with multiplications by translations that adjust the\
    \ rotation it is so relative to the center of the Texture2D:\n\nXNA Project: SpinPaint\
    \ File: Game1.cs (excerpt)\n\n```\nprotected override void Update(GameTime gameTime)\n\
    {\n    // Calculate transforms for rotation\n    Matrix translate1 = Matrix.CreateTranslation(-textureCenter.X,-textureCenter.Y,\
    \ 0);\n    Matrix translate2 = Matrix.CreateTranslation(textureCenter.X, textureCenter.Y,\
    \ 0);\n    Matrix previousRotation = translate1 * Matrix.CreateRotationZ(-previousAngle)\
    \ * translate2;\n    Matrix currentRotation = translate1 * Matrix.CreateRotationZ(-currentAngle)\
    \ * translate2;\n}\n```\n\nOnce these transforms are defined, they can then be\
    \ applied to the PreviousPosition and CurrentPosition fields of the TouchInfo\
    \ object using the state Vector2.Transform method, and then passed to RoundCappedLine\
    \ to obtain the information necessary to draw a line on the Texture2D:\n\nXNA\
    \ Project: SpinPaint File: Game1.cs (excerpt)\n\n```\nprotected override void\
    \ Update(GameTime gameTime)\n{\n    bool textureNeedsUpdate = false;\n    foreach\
    \ (TouchInfo touchInfo in touchDictionary)\n{\n        // Now draw from previous\
    \ points\n        Vector2 point1 = Vector2.Transform(touchInfo.PreviousPosition,\
    \ previousRotation);\n        Vector2 point2 = Vector2.Transform(touchInfo.CurrentPosition,\
    \ currentRotation);\n        float radius = 6;\n        RoundCappedLine line =\
    \ new RoundCappedLine(point1, point2, radius);\n        int yMin = (int)(Math.Min(point1.Y,\
    \ point2.Y) - radius);\n```"
