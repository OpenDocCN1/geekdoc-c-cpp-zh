  md: "# Part II XNA\n\nThe transform we desire will be much easier to derive if we\
    \ break it down into two transforms:\n\n```\n$(0,0) \rightarrow (0,0) \rightarrow\
    \ (x_0, y_0)$\n$(1,0) \rightarrow (1,0) \rightarrow (x_1, y_1)$\n$(0,1) \rightarrow\
    \ (0,1) \rightarrow (x_2, y_2)$\n$(1,1) \rightarrow (a,b) \rightarrow (x_3, y_3)$\n\
    ```\n\nThe first transform is a non-affine transform I'll call B. The second is\
    \ that I'll force to be an affine transform A (for \"affine\"). The composite\
    \ transform is B × A. The task here is to derive the two transforms plus the point\
    \ (a, b).\n\nI've already defined the affine transform. But I want this affine\
    \ transform to map a point (a, b) to the point $(x_3, y_3)$. What is the point\
    \ (a, b)? If we apply the affine transform to $(a, b)$ and solve for $a$ and $b$:\n\
    \n| a = | x3 - M21 | y3 + M41 | M42 - M22 | M41 |\n| | M11 | M22 - M12 | M21 |\
    \ |\n| b = | y3 - M12 | x3 + M12 | M41 - M11 | M42 |\n| | M11 | M22 - M12 | M21\
    \ |\n\nNow let's focus on the non-affine transform, which needs to produce the\
    \ following mappings:\n\n```\n$(0,0) \rightarrow (0,0)$\n$(1,0) \rightarrow (1,0)$\n\
    $(0,1) \rightarrow (0,1)$\n$(1,1) \rightarrow (a,b)$\n```\n\nThe generalized non-affine\
    \ 2D transform formulas (using field names from the Matrix structure and incorporating\
    \ the division by $w$) are:\n\n| x' = | x + M21 | y + M41 |\n| M14 | x + M24 |\
    \ y + M44 |\n| y = | x + M22 | y + M42 |\n| M14 | x + M24 | y + M44 |\n\nThe point\
    \ (0, 0) is mapped to (0, 0), which tells us that $M41$ and $M42$ are zero, and\
    \ $M44$ is non-zero. Let's go out on a limb and say $M44$ is 1.\n\nThe point (1,\
    \ 0) is mapped to (1, 0), which tells us that $M12$ is zero and $M14 = M11 - 1$.\n\
    \nThe point (0, 1) is mapped to (0, 1), which tells us that $M21$ is zero and\
    \ $M24 = M22 - 1$."
