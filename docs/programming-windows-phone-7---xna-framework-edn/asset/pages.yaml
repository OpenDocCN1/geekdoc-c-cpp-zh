  md: '# Part II XNA


    The complete matrix transform for a three-dimensional coordinate point looks like
    this:


    | M11 M12 M13 M14 |

    | x y z 1 |

    | M21 M22 M23 M24 |

    | M31 M32 M33 M34 |

    | M41 M42 M43 M44 | = |x'' y'' z'' w|


    Because x, y, and z are already the last letters of the alphabet, the fourth dimension
    is represented with the letter w. The three-dimensional coordinate point is first
    expressed as a four-dimensional point for multiplying by the 4 x 4 matrix. The
    following formulas result from the matrix multiplication:


    ```

    x'' = M11 x+M21 y+M31 z+M41

    y'' = M12 x+M22 y+M32 z+M42

    z'' = M13 x+M23 y+M33 z+M43

    w'' = M14 x+M24 y+M34 z+M44

    ```


    For an affine transform, M14, M24, and M34 are all zero, and M44 is 1, so w''
    is 1, and the entire transform occurs on a plane in 4D space. For non-affine transforms,
    w'' is not 1, and to project 4D space back into 3D space, the three-deimensional
    point must be constructed from the four-dimensional point (x'', y'', z'', w'')
    like so:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_302_0.png)


    It''s the division here that causes tapering. If M14 is a positive number, for
    example, then w'' will increase for increasing x, and the graphical object will
    get progressively smaller as x gets larger.


    What happens if w'' becomes zero? That''s the non-affine part of this process:
    Coordinates can become infinite. Generally you''ll want to keep infinite objects
    out of sight because they tend to hog the screen.


    Although non-affine transforms are essential for 3D graphics programming, I wasn''t
    sure if SpriteBatch supported two-dimensional non-affine transforms until I tried
    them, and I was pleased to discover that XNA says "No problem!" What means is
    that you can use non-affine transforms in 2D programming to simulate perspective
    effects.


    A non-affine transform in 2D can transform a square into a simple convex quadrilateral—a
    four-sided figure where the sides meet only at the corners, and interior angles
    at any corner are less than 180°. Here''s one example:'
