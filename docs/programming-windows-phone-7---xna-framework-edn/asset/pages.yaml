    which allows XNA-based programs to participate in online multiplayer games, and
    can be accessed by Silverlight applications.


    Programs you write for the Windows Phone 7 will be sold and deployed through the
    Windows Phone Marketplace, which provides registration services and certifies
    that programs meet minimum standards of reliability, efficiency, and good behavior.


    I have characterized Windows Phone 7 as representing a severe break with the past.
    If you compare it with past versions of Windows Mobile, that is certainly true.
    But the support of Silverlight, XNA, and C# are not breaks with the past, but
    a balance of continuity and innovation. As you are, Silverlight and XNA have already
    proven themselves as powerful and popular platforms. Many skilled programmers
    are already working with either framework or the other—probably not so many with
    both just yet—and they have expressed their enthusiasm with a wealth of online
    information and communities. C# has become the favorite language of many programmers
    (myself included), and developers can use C# to share libraries between their
    Silverlight and XNA programs as well as programs for other.NET environments.


    # The Hardware Chassis


    Developers with experience targeting Windows Mobile devices of the past will find
    significant changes in Microsoft''s strategy for the Windows Phone 7. Microsoft
    has been extremely proactive in defining the hardware specification, often referred
    to as a "chassis."


    Initial releases of Windows Phone 7 devices will have one consistent screen size.
    (A second screen size is expected in the future) Many other hardware features
    are guaranteed to exist on each device.


    The front of the phone consists of a multi-touch display and three hardware buttons
    positioned in a row below the display. From left to right, these buttons are called
    Back, Start, and Search:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_19_0.png)


    +   Back Programs can use this button for their own navigation needs, much like
    the Back button on a Web browser. From the home page of a program, the button
    calls the program to terminate.


    +   Start This button takes the user to start the start screen of the phone; it
    is otherwise inaccessible to programs running on the phone.


    +   Search The operating system uses this button to initiate a search feature.'
  merge: -1
