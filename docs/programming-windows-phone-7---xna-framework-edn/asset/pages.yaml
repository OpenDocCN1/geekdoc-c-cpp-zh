  md: '# Chapter 6 Issues in Application Architecture 129


    Notice the appService field set to PhoneApplicationService.Current. That''s just
    for convenience for accessing the State property. You can use the long PhoneApplicationService.Current.State
    instead if you prefer.


    Storing items in the Dictionary is easier than getting them out. The syntax:


    ```

    appService.State["numTaps"] = numTaps;

    ```


    replaces an item if the "numTaps" key exists, or adds a new item if the key does
    not exist. Saving the background color is a little trickier: By default the Background
    property of ContentPanel is null, the code checks for a non-null value before
    attempting to save the Color property.


    To get items out of the dictionary, you can''t use similar syntax. You''ll raise
    an exception if the key does not exist (And these keys will not exist when the
    application is launched). The OnNavigatedTo method shows two different ways of
    accessing the items: The first checks if the dictionary contains the key; the
    second uses TryGetValue, which returns true if the key exists


    In a real program, you''ll probably want string variables for the keys to avoid
    accidentally typing inconsistent values. (If your typing is impeccable, don''t
    worry about the multiple identical strings taking up storage: Strings are internal,
    and identical strings are consolidated into one.) You''ll probably also want to
    write some standard routines that perform this jobs.


    Try running this program like you ran earlier: Press F5 to deploy it to the phone
    or phone emulator from Visual Studio. Tap the screen few times. If you''re going
    to start a new program. Visual Studio indicates that the process has terminated.
    Now press the Back button. When the program resumes the settings have been saved
    and the corpse looks as good as new!'
