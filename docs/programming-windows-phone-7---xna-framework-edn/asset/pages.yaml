  md: '# Part I The Basics


    In case, when you press the Accept button, the camera goes away and the program’s
    OnCameraCaptureTaskCompleted method takes over. It creates a Bitmap object, sets
    the input stream from args.ChosenPhoto, and then sets the Bitmap object to the
    Image element, displaying the photo on the screen.


    The whole process seems fairly straightforward. Conceptually it seems as if the
    program is spawning the camera process, and then resuming control when that process
    terminates.


    However, the Windows Phone 7 documentation that I''m consulting warns that this
    is not the case. There is something going on at first and which you might find
    somewhat unnerving.


    When the SilverlightTapShoot program calls the Show method on the CameraTask object,
    the SilverlightTapShoot program is terminated. (Not immediately, though. the OnManipulationStarted
    method is allowed to return back to the program, and a couple of others are fired,
    then the program is terminated.)


    The camera utility then runs. When the camera utility does its job, the SilverlightTapShoot
    program is re-executed. A new instance of the program starts up from the beginning,
    the MainPage constructor is eventually called which sets the Completed event of
    the CameraCaptureTask to OnCameraCaptureTaskCompleted, and then that method is
    called.


    For these reasons, the documentation advises that when you use a chooser or launcher
    as CameraCaptureTask, the object must be defined as a field, and the handler for
    the Completed event must be attached to the program''s constructor, and as late
    as possible because once the handler is attached when the program starts again,
    it will be called.


    This termination and re-execution of your program is a characteristic of Windows
    Phone 7 programming call tombstoning. When the program is terminated as the camera
    task begins, sufficient information is retained by the operating system to start
    the program again when the camera finishes. However, not enough information is
    retained to restore the program entirely to its tombstone state. That''s your
    responsibility.


    Running a launcher or chooser is one way tombstoning can occur. But it also occurs
    when the user leaves your program by pressing the Start button. Eventually the
    user could return to your program by pressing the Back button, and your program
    needs to be re-executed from its tombstoned. Tombstoning also takes place when
    a lack of activity on the phone causes it to go into a lock state.


    Tombstoning does not occur when your program is running and the user presses the
    Back button. The Back button simply terminates the program normally.'
