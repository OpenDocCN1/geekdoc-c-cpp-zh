  md: '# Chapter 12 Tilt and Play 357


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_371_0.png)


    Because the intention of this program is to show you what''s really coming through,
    it doesn''t perform any smoothing. Red is X, green is Y, and blue is Z. (The mnemonic
    RGB == XYZ.) From the perspective in portrait mode, the graph moves up the screen
    and new values are added at the bottom. Vertically, each pixel represents a video
    display refresh "tick"—1/30th second. The heavier horizontal lines represent seconds.
    The lighter horizontal lines are tenths of a second (six pixels). The vertical
    line in the center represents an acceleration movement value of 0. The left edge
    is -2 and the right edge is 2. From what you saw (in the previous program, this
    should be adequate for displaying the complete range of possible values.


    As you let the program run, the old data seems to crawl up the screen, and perhaps
    one''s immediate instinct is to code like that: Create a Texture2D the size of
    the screen and every Update just shift all the pixels by the width of the Texture2D
    so the top row disappears and the new row be added at the end. But that''s a lot
    of pixel shifting 30 times a second.


    It makes more sense to insert the new data at a variable row number that is incremented
    with every Update call. (Let''s call this the insert row) In the Draw method,
    you can then the Texture2D twice into two parts. The first part is displayed at
    the top of the screen and begins with the row following the insert row and goes
    to the end of the Texture2D. The second part is drawn underneath the first part,
    and begins at the top of the Texture2D and ends with the insert row.


    Because old data must be erased at the insert row to make for new data, it makes
    sense to handle the fixed lines of the graph separately. That portion repeats
    itself vertically'
