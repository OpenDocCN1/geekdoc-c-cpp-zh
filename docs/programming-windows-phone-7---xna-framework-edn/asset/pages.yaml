  md: '# Chapter 12 Tilt and Play 347


    The value of 0.7 in the example is, of course, the approximate square root of
    ½. If you calculate the magnitude of the acceleration vector using the Pythagorean
    Theorem


    ```

    x^2 + y^2 + z^2

    ```


    the result should be 1 if the phone is held still. A phone lying on a level surface
    has an acceleration vector of approximately (0, 0, -1), which is the same value
    displayed by the phone emulator.


    I say “approximately” because the phone’s accelerometer is not a very precise
    piece of hardware. The magnitude of the vector is supposed to be in units of gravity
    on the surface of the earth, traditionally denoted as g, and approximately 32
    feet per second squared. However, you will often see as much as 5% error in the
    figure.


    You’ll also notice that the X, Y and Z components of the accelerometer reading
    for a phone lying on a level surface might also be several points in error. If
    you’re writing a program that uses the accelerometer for a carpenter’s level,
    you will want to include an option to “calibrate” the accelerometer, which really
    means to adjust all future readings based on the reading the user presses the
    “calibrate” button.


    The data from the accelerometer is also often jittery, as undoubtedly discovered
    when running the two accelerometer programs shown in Chapter 5. Data smoothing
    is also a big part of accelerometer usage.


    In this chapter I’ll be using a very low-pass filtering technique for smoothing
    the data and I won’t get into calibration issues. A library that can help you
    out with both of these issues can be found in Dave Edison’s blog entry “Using
    the Accelerometer on Windows Phone 7” at http://windowsteamblog.com/windows_phone/b/wpdev/archive/2010/09/08/using-the-accelerometer-on-windows-phone-7.aspx.


    All the programs in this chapter require references to the Microsoft.Devices.Sensors
    assembly and are using directives for the Microsoft.Devices.Sensors namespace.


