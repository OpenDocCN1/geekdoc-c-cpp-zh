    \ the AllowStreamBuffering property of WebClient is true, which means that the\
    \ entire file was downloaded when the OpenReadCompleted event is raised. The Stream\
    \ object available in the Result is actually a memory stream, except that it's\
    \ an instance of a class internal to the .NET libraries rather than MemoryStream\
    \ itself.\n\nIf you set AllowStreamBuffering to false, the Result will be a network\
    \ stream. The Texture2D class will not allow you to read from stream on main thread.\n\
    \nNormally the LoadContent method of a Game derivative is called before the first\
