  md: '# Organization


    This book is divided into three parts. The first part discusses basic concepts
    of Windows Phone 7 programming using examples programs that target both Silverlight
    and the XNA framework. It is likely that Windows Phone 7 developers will choose
    either one platform or the other, but it''s important for all developers who have
    at least a little knowledge of the alternative to their chosen path.


    The second part of this book focuses entirely on Silverlight, and the third part
    on XNA 2D. For your convenience, the chapters in each part build upon previous
    knowledge in a progressive tutorial narrative, and here are intended to be read
    sequentially.


    # My Assumptions About You


    I assume that you know the basic principles of .NET programming and you have a
    working familiarity with the C# programming language. If not, you might benefit
    from reading my free online .NET Book Zero: What the C or C++ Programmer Needs
    to Know about C# and the .NET Framework, from my website www.charlespetzold.com/dotnet.


    # System Requirements


    To use this book properly you''ll need to download and install the Windows Phone
    Developer Tools, which includes Visual Studio 2010 Express for Windows Phone,
    XNA Game Studio 4.0, and an on-screen Phone Emulator to test your programs in
    the absence of an actual device. Get the latest information and downloads at http://developer/windowsphone.com.


    You can install these tools on top of Visual Studio 2010, in effect enhancing
    Visual Studio 2010 for phone development. That''s the configuration I used.


    Although you can do a bit with the phone emulator, at some point you''ll want
    to deploy your programs to an actual Windows Phone 7 device. You can register
    as a phone developer at http://developer.windowsphone.com and then have the ability
    to unlock your phone so you can deploy from Visual Studio.


    Since July 2010, I''ve had an LG GW910 phone to test the programs in this book.
    For the record, the final build I installed was 7.0.7003.0.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Using the Phone Emulator


    Windows Phone 7 supports multi-touch, and working with multi-touch is an important
    part of developing programs for the phone. When using the Windows Phone Emulator,
    mouse and clicks movement on the PC can mimic touch on the emulator, but for only
    one finger. You can test multi-touch for real on the phone emulator if you have
    a multi-touch monitor running under Windows 7.


    In the absence of a multi-touch monitor, you might want to explore simulating
    multi-touch with multiple mouse devices. The site http://multitouchvista.codplex.com
    has the download you''ll need and includes a link to http://michaelysync.net/2010/04/06/step-by-step-tutorial-installing-multi-touch-simulator-for-silverlight-phone-7
    that provides instructions.


    Windows Phone 7 devices have a built-in accelerometer, which can be very difficult
    to simulate in an emulator. Per Blomqvist, the Technical Reviewer for this book,
    found an application at accelkit.codplex.com that utilizes the webcam and ARToolkit
    to emulate the accelerometer sensor and feed data into the Windows Phone 7 emulator
    through a TCP/HTTP Server, and another which we have tried out, it sounds quite
    intriguing.


    # Code Samples


    To illustrate Silverlight and XNA programming concepts, this book describes 190
    complete programs. Many of them are small and simple, but others are larger and
    more interesting.


    Some people like to learn new programming environments by re-creating the projects
    in Visual Studio and typing in the source code themselves from the pages of the
    book. Others prefer to study the code and run the pre-existing programs to see
    what the code does. If you fall into the latter category, you can download all
    the source in a ZIP file via the Companion Content link at http://oreilly.com/catalog/0790145316899/


    If you find something in code that is useful in your own software project, feel
    free to use the code without restriction—either straight up or modified in whatever
    you want. That''s what it''s for.


    # Last-Minute Items


    As I was nearing the completion this book, the first version of Silverlight for
    Windows Phone Toolkit was released with some additional elements, and is available
    for downloading at http://silverlight.codplex.com. Historically, these Silverlight
    toolkits often contain previews of elements and controls that are incorporated
    into later Silverlight releases. I regret that I could not include a discussion
    of the toolkit contents in the appropriate chapters of this book.'
  merge: -1
  pgno: 11
