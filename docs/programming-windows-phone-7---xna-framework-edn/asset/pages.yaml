    \ 0);\n    spriteBatch.DrawString(sego48, titleText, titlePosition, currentColor);\n\
    \    spriteBatch.End();\n\n    base.Draw(gameTime);\n}\n```\n\n# # ThreeCell and\
    \ a Deck of Cards\n\nI originally thought that my ThreeCell solitaire game would\
    \ have features beyond what was strictly necessary to play the game. My wife—who\
    \ has played FreeCell under Windows and only rarely could complete a deal—made\
    \ clear that FreeCell would need features that I hadn't planned on implementing:\
    \ First and most importantly, there had to be some kind of positive feedback from\
    \ the program acknowledging that the player has won. I implemented this as a DrawableGameComponent\
    \ derived called CongratulationsComponent.\n\nThe second essential feature was\
    \ something I called \"auto move.\" If a card could be legally moved to the piles\
    \ at the right of the board, and there was no reason to do otherwise, the card\
    \ is automatically moved. Other than that, ThreeCell has no amenities. There is\
    \ no animated \"deal\" at the beginning of play, you cannot simply \"click\" to\
    \ indicate a destination spot, and there is no way to move multiple cards in one.\
    \ There is no undo and no hints.\n\nMy coding for ThreeCell began not with an\
    \ XNA program but with a Windows Foundation program to generate a single 1040\
    \ x 448 bitmap containing all 52 playing cards, each of which is 96 pixels wide\
    \ and 112 pixels tall. This program uses TextBlock objects to draw a Canvas with\
    \ numbers, letters, and suits. It then passes the Canvas to a RenderBitmap and\
    \ saves the result out to a file named cards.png. In the XNA ThreeCell project,\
    \ I added this file to the program's content."
