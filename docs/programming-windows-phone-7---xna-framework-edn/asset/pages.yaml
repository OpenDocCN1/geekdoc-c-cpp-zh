  md: 'Now there is a 100-pixel breathing room between the TextBlock and the left
    and top edges of the client area. The Margin property is of type Thickness, a
    structure that has four properties named Left, Top, Right, and Bottom. If you
    specify one number in XAML, that''s used for all four sides. You can also specify
    two numbers like this:


    ```

    Margin="100 200"

    ```


    The first applies to the left and right; the second to the top and bottom. With
    four numbers


    ```

    Margin="100 200 50 300"

    ```


    they''re in the order left, top, right, and bottom. Watch out: if the margins
    are too large, the text or parts of the text will disappear. Silverlight preserves
    the margins even at the expense of truncating the element.


    If you set both HorizontalAlignment and VerticalAlignment to Center, and set Margin
    to four different numbers, you will notice that the text is no longer centered
    in the content area. Silverlight bases the centering on the size of the element
    including the margins.


    TextBlock has a Padding:


    ```

    <TextBlock Text="Top-Left"

    VerticalAlignment="Top"

    HorizontalAlignment="Left"

    Padding="100 200" />

    ```


    Padding is also type of Thickness, and when used with the TextBlock, Padding is
    visually indistinguishable from Margin. But they are different: Margin is space
    on the outside of the TextBlock; Padding is space inside the TextBlock not occupied
    by the text itself. If you are using TextBox for touch events (as I''ll demonstrate
    in the next chapter), it would respond to touch in the Padding area but not the
    Margin area.


    The Margin property is defined by FrameworkElement; in real-life Silverlight programming,
    almost everything is a non-zero Margin to prevent the elements from jammed against
    each other. Padding property is rarer; it''s defined only by TextBlock, Border,
    and Control.


    It''s possible to use Margin to position multiple elements within a single-cell
    Grid. It''s not common—and there are better ways to do the job—it''s possible.
    I will have an example in Chapter 5.


    What''s crucial to realize is we''re not doing. We''re not explicitly setting
    the Width and Height of the TextBlock like in some programming environment:


    ```

    <TextBlock Text="Top-Left"

    VerticalAlignment="Top"

    HorizontalAlignment="Left"

    Width="100"

    Height="50" />

    ```'
