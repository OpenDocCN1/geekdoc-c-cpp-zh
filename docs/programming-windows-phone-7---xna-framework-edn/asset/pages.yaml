  md: '# Part I The Basics


    As you experiment, you''ll discover that the settings are saved when the application
    is tombstoned (that is, when you navigate away from the application with the Start
    button and then return) but not when a new instance starts from the Start list.
    This is correct behavior. The operating system discards the State dictionary when
    the program terminates for real. The State dictionary is only for transient data
    and not for data that affects other instances of the same application.


    If you want some shared data among all instances of a program, you probably want
    to implement what''s often called application settings. You can do that as well.


    # Isolated Storage


    Every program installed on Windows Phone 7 has access to its own area of permanent
    disk referred to as isolated storage, which the program can access using classes
    in the System.IO.IsolatedStorage namespace. While files can be read and written
    to isolated storage, and I''ll show you how to do that in the program that concludes
    this chapter. For the program that I''m going to focus inside a special use of
    isolated storage for storing application settings. The IsolatedStorageSettings
    class exists specifically for this purpose.


    For application settings, you should be thinking in terms of the whole application
    rather than a particular page. Perhaps some of the application settings apply
    to multiple pages. Hence, a good place to deal with these application settings
    is in the App class.


    Not coincidently it is the App.xml file that creates a PhoneApplicationService
    object (the same PhoneApplicationService used for saving transient data) and assigns
    event handlers for the following


    ```

    <shell:PhoneApplicationService Launching="Application_Launching"

    Closing="Application_Closing"

    Activated="Application_Activated"

    deactivated="Application_Deactivated"/>

    ```


    The Launch event is fired when the program is first executed from the Start screen.
    The Deactivated event occurs when the program is tombstoned, and the Activated
    event occurs when the program is resumed from tombstoning. The Closing event occurs
    when the program is really terminated, probably by the user pressing the Back
    button.


    So, when a program starts up, it gets either a Launch event or an Activated event
    (but not both), depending whether it''s being started from the Start screen or
    coming out of a tombstoned state. When a program ends, it gets either a Deactivated
    event or a Closing event, depending whether it''s being tombstoned or terminated
    for real.


    A program should load application settings and save them in response to the Closing
    event. That much is obvious. But a program should also save application settings
    during the Deactivated event because the program really doesn''t know'
