  md: '# Chapter 7

    Principles of Movement


    Much of the core of XNA program is dedicated to moving sprites around the screen.
    Sometimes these sprites move under control; at other times they move on their
    own volition as if animated by some internal vital force. Instead of moving real
    sprites, you can instead move some text, and is what I''ll be sticking with for
    this entire chapter. The concepts and strategies involved in moving text around
    the screen are the same as those in moving sprites.


    A particular text string seeks to move around the screen when it''s given a different
    position in the DrawString method during subsequent calls of the Draw method in
    Game. In Chapter 1, you''ll recall, the textPosition variable was simply assigned
    a fixed value during the LoadContent method. This code puts the text in the center
    of the screen:


    ```

    Vector2 textSize = segoe14.MeasureString(text);

    Viewport viewport = this.GraphicsDevice.Viewport;

    textPosition = new Vector2(viewport.Width - textSize.X) / 2,

    (viewport.Height - textSize.Y) / 2);

    ```


    Most of the programs in this chapter recalculate textPosition during every call
    to Update so the text is drawn in a different location during the Draw method.
    Usually Nathan fancy will be happening; the text will be simply moved from the
    top of the screen to the bottom, and then back up to the top, and down again.
    Lather, rinse, repeat.


    I''m going to begin with a rather "naive" approach to moving text, and then refine
    it. If you''re not accustomed to thinking in terms of vectors or parametric equations,
    my refinements will first seem to make the program more complex, but you''ll see
    that the program actually becomes simpler and more flexible.


    # The Naive Approach


    For this first attempt at movement, I want to try something simple. I''m just
    going to move the text up and down vertically so the movement is entirely in one
    dimension. All we have to worry about is increasing and decreasing the Y coordinate
    of textPosition.'
  merge: -1
  pgno: 157
- img_proc: true
  md: "If you want to play along, you can create a Visual studio project named NaiveTextMovement\
    \ and add the 14-point Segoe UI Mono font to the Content directory. The fields\
    \ in the Game class are defined like so:\n\n# XNA Project: NaiveTextMovement File:\
    \ (excerpt showing fields)\n\n```\npublic class Game1 : Microsoft.Xna.Framework.Game\n\
    {\n    const float SPEED = 240; // pixels per second\n    const string TEXT =\
    \ \"Hello, Windows Phone 7!\";\n\n    GraphicsDeviceManager graphics;\n    SpriteBatch\
    \ spriteBatch;\n    SpriteFont sego14;\n    Viewport viewport;\n    Vector2 textSize;\n\
    \    Vector2 textPosition;\n    bool isGoingUp = false;\n    ...\n}\n```\n\nNothing\
    \ should be too startling here. I've defined both the SPEED and TEXT as constants.\
    \ The SPEED is set at 240 pixels per. The Boolean isGoingUp indicates whether\
    \ the text is currently moving down the screen or up the screen.\n\nThe LoadContent\
    \ method is very familiar from the program in Chapter 1 except that the viewport\
    \ is saved as a field:\n\n# XNA Project: NaiveTextMovement File: Game1.cs (excerpt)\n\
    \n```\nprotected override void LoadContent()\n{\n    spriteBatch = new SpriteBatch(GraphicsDevice);\n\
    \    viewport = this.GraphicsDevice.Viewport;\n    sego14 = this.Content.LoadFont(\"\
    sego14\");\n    textSize = sego14.MeasureString(TEXT);\n    textPosition = new\
    \ Vector2(viewport.X + (viewport.Width - textSize.X) / 2, 0);\n}\n```\n\nNotice\
    \ that this textPosition centers the text horizontally but positions it at the\
    \ top of the screen. As is usual with most XNA programs, the real calculational\
    \ work occurs during the Update method:"
