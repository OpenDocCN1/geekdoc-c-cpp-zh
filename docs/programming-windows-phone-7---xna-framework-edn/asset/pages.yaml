  md: "# Part II XNA\n\nrequire accessing any resources or program content, I decided\
    \ to use the Initialize override\for this work.\n\n# XNA Project: CarOnInfinityCourse\
    \ File: Game1.cs (excerpt)\n\n```\nprotected void Initialize()\n{\n    float[]\
    \ xValues = { 0, 0.293f, 1, 1.707f, 2.293f, 3, 3.707f,\n        4, 3.707f };\n\
    \    float[] yValues = { 1, 0.293f, 0, 0.293f, 1, 1.707f, 2, 1.707f,\n       \
    \ 1, 0.293f, 0, 0.293f, 1, 1.707f, 2, 1.707f };\n\n    for (int i = -1; i < 8;\
    \ i++)\n    {\n        int index = (i + 6) % 16;\n        float t = 0.0625f *\
    \ 1;\n        xCurve.Keys.Add(new CurveKey(t, xValues[index]));\n        yCurve.Keys.Add(new\
    \ CurveKey(t, yValues[index]));\n    }\n\n    xCurve.ComputeTangents(CurveTangent.Smooth);\n\
    \    yCurve.ComputeTangents(CurveTangent.Smooth);\n    base.Initialize();\n}\n\
    ```\n\nThe xValues and yValues arrays have only 16 values; they don't include\
    \ the last point that -1 through 17 but the modulo 16 operation ensures the arrays\
    \ are indexed from 0 through 15. The end result is that the Keys collections of\
    \ xCurve and yCurve get coordinates associated with t values of -0.0625, 0, 0.0625,\
    \ 0.125, ..., 0.875, 0.9375, 1 and 1.0625, which are apparently two points more\
    \ than is necessary to make this work right.\n\nThese extra points are necessary\
    \ for the ComputeTangents calls following the loop. The Curve class performs a\
    \ type of interpolation using a cubic Hermite spline, also called a spline. Consider\
    \ two points pt1 and pt2. The spline interpolates between these two points based\
    \ only on pt1 and pt2 but also on adjacent tangents of the curve at pt1 and pt2.\
    \ You can specify these tangents to the Curve object yourself or can have the\
    \ Curve object calculate tangents for adjoining points. That is the approach I've\
    \ taken by the two calls to ComputeTangents. With an argument of CurveTangent.Smooth,\
    \ the ComputeTangents method uses only the two adjacent points, but the points\
    \ on each side. It's just a simple weighted average but it's better than the alternatives.\n\
    \nThe Curve and CurveKey classes have several other options, the approach I've\
    \ taken seemed to offer the best results with the least amount of work. (And isn't\
    \ that all about?)"
