    # Drawing Lines


    For developers coming from more mainstream graphical programming environments,
    it is starting to realize that XNA has no way of rendering simple lines and curves
    in 2D. In this chapter I''m going to show you how that limitation can be overcome.


    Suppose you want to draw a line between the points (x₁, y₁) and (x₂, y₂), and
    you want this line to have a 3-pixel thickness. First, create a RenderTarget2D
    that is 3 pixels high with a width to:


    ```

    √(x₂ - x₁)² + (y₂ - y₁)²

    ```


    That''s the length of the line between the two points. Now set the RenderTarget2D
    to the GraphicsDevice, clear it with Color.Red, and reset the GraphicsDevice back
    to normal.


    During the Draw override, draw this bitmap to the screen using a position of (x₁,
    y₁) with an origin of (0, 1). The origin is the point within the RenderTarget2D
    that is aligned with the position argument. This line is supposed to have a 3-pixel
    thickness so that the vertical center of the bitmap should be aligned with (x₁,
    y₁). In this Draw call you''ll also need to apply a rotation equal to the angle
    from (x₁, y₁) to (x₂, y₂), which can be calculated with Math.Atan2.


    Actually, you don''t need to map a bitmap of the size of the line. You can use
    a much smaller bitmap and apply a scaling factor. The easiest bitmap for this
    purpose is 2 pixels wide and 3 pixels high. This allows you to set an origin of
    (0, 1) in the Draw call, which means the point (0, 1) in the bitmap remains fixed.
    A horizontal scaling factor then enhances the bitmap for the line length, and
    a vertical scaling factor handles the thickness.


    I have such a class in XNA library project called Petzold.Phone. I created this
    project in Visual Studio by selecting a project type of Windows Phone Game Library
    (4.0). Here''s the complete class I call LineRenderer:


    > XNA Project: Petzold.Phone.Xna File: LineRenderer.cs


    ```

    using System;

    using Microsoft.Xna.Framework;

    using Microsoft.Xna.Framework.Graphics;

    ```'
