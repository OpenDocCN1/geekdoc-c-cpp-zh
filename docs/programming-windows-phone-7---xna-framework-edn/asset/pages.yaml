  md: "# Part I The Basics\n\nIn the general case, you can GetTouchPoints, passing\
    \ to a reference element. The TouchPoint objects in the returned collection have\
    \ Position properties relative to that element. You can pass null to GetTouchPoints\
    \ to get Position properties relative to the upper-left corner of the application.\n\
    \nThe reference element and the DirectlyOver element have no relationship to each\
    \ other. The event always gets all touch for the entire program. Calling GetTouchPoints\
    \ or GetPrimaryTouchPoints with a particular element does not limit the events\
    \ to only those events happening to that element. For that reason, Position coordinates\
    \ can easily be negative if the finger is to the left of or above the reference\
    \ element. The DirectlyOver element indicates the element under the finger.\n\n\
    A discussion of the second and third methods requires some attention: The TouchFrameed\
    \ event originated on Silverlight for the desktop, where it is convenient for\
    \ the mouse logic of existing controls to automatically use touch. For this reason,\
    \ touch events are \"promoted\" to mouse events.\n\nBut this promotion only involves\
    \ the \"primary\" touch point, which is the activity of the first finger touches\
    \ the screen when no other fingers are touching the screen. If you don't want\
    \ the activity of this finger to be promoted to mouse events, the event handler\
    \ usually begins like this:\n\n```\nvoid OnTouchFrameReport(object sender, TouchEventArgs\
    \ args)\n{\n    TouchPoint primaryTouchPoint = args.GetPrimaryTouchPoint(null);\n\
    \n    if (primaryTouchPoint != null && primaryTouchPoint.Action == TouchAction.Down)\n\
    \    {\n        args.SuspendMousePromotionUntilTouchUp();\n    }\n    ...\n}\n\
    ```\n\nThe SuspendMousePromotionUntilTouchUp method can only be called when a\
    \ finger first touches the screen when no other fingers are touching the screen.\n\
    \nOn Windows Phone 7, such logic presents something of a quandary. As written,\
    \ it basically wipes out all mouse promotion throughout the application. If your\
    \ phone application incorporates mouse controls that were originally written for\
    \ mouse input but haven't been upgraded to touch, you're basically disabling those\
    \ controls.\n\nOf course, you can also check the DirectlyOver property to suspend\
    \ mouse promotion selectively. On the phone, no elements should be processing\
    \ mouse input except for those that don't process touch input! So it might make\
    \ more sense to never suspend mouse promotion.\n\nI'll leave that for your consideration\
    \ and your older mouse-handling controls. Meanwhile, the program I want to write\
    \ is only interested in the primary touch point when it has a TouchAction of Down,\
    \ so I can use that same logic."
