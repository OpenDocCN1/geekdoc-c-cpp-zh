- img_proc: true
  md: '# Part I The Basics


    The initial releases of Windows Phone 7 devices have a display size of 480 × 800
    pixels. In the future, screens of 320 × 480 pixels are also expected. There are
    no other screen options for Windows Phone 7, so obviously these two screen sizes
    play a very important role in phone development.


    In theory, it''s usually considered best to write programs that adapt themselves
    to any screen size, but that''s not always possible, particularly with game development.
    You will probably find yourself specifically targeting these two screen sizes,
    even to the extent of having conditional code paths and different XAML files for
    layout that is size-dependent.


    I will generally refer to these two sizes as the "large" screen and the "small"
    screen. The greatest common denominator of the horizontal and vertical dimensions
    of both screens is 160, so you can visualize the two screens as multiples of 160-pixel
    squares:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_20_0.png)


    I''m showing these screens in portrait mode because that''s usually the way smartphones
    are designed. The screen of the original Zune is 240 × 320 pixels; the Zune HD
    is 272 × 480.


    Of course, phones can be rotated to put the screen into landscape mode. Some programs
    might require the phone to be held in a certain orientation; others might be more
    adaptable.


    You have complete control over the extent to which you support orientation. By
    default, Silverlight applications appear in portrait mode, but you''ll want to
    write your Silverlight applications so they adjust themselves to orientation changes.
    New events are available specifically for the purpose of detecting orientation
    change, and some orientation shifts are handled automatically. In contrast, game
    programmers can usually impose a particular orientation on the user. XNA programs
    use landscape mode by default, but it''s easy to override that.


    In portrait mode, the small screen is half of an old screen (that is, 640 × 480).
    In landscape mode, the large screen has a dimension sometimes called WVGA ("wide
    VGA\). In'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'landscape mode, the small screen has an aspect ratio of 3:2 or 1.5; the large
    screen has an aspect ratio of 5:3 or 1.66… Neither matches the aspect ratio of
    television, for standard definition is 4:3 or 1.33… and for high-definition is
    16:9 or 1.77… The Zune HD screen has an aspect ratio of 16:9.


    Like recent phones and the Zune HD, the Windows Phone 7 displays will use OLED
    (''organic light emitting diode'') technology, although this is not a hardware
    requirement. OLEDs are different from flat displays of the past in that power
    consumption is proportional to the light emitted from the display. For example,
    an OLED consumes less than half the power of an LCD display of the same size,
    but only when the screen is black. For an all-white screen, an OLED consumes more
    than three times the power of the LCD.


    Because life is extremely important on mobile devices, this characteristic of
    OLED implies an aesthetic of mostly black with sparse graphs and light-stroked
    fonts. Regardless, Windows Phone 7 users can choose between two major themes:
    light text on a dark background, or dark text on a light background.


    Most user input to a Windows Phone 7 program will come through multi-touch. The
    screens incorporate capacitance-touch technology, which means they respond to
    a stylus but not to any other forms of pressure. Windows Phone 7 screens are required
    to respond to at least four simultaneous touch-points.


    A hardware keyboard is optional. Keep in mind that phones can be designed in different
    ways, so when the keyboard is used in either portrait mode or landscape mode.
    A Silverlight program that uses keyboard input must respond to orientation changes
    so that the user can use both the view and the screen without wondering what idiot
    designed the program sideways. An-screen keyboard is also provided, known in Windows
    circles as the Soft Input Panel or SIP. XNA programs also have access to the hardware
    keyboard and SIP.


    # Sensors and Services


    A Windows Phone 7 device is required to contain several other hardware features—sometimes
    called sensors—and provide some software services, perhaps through the assistance
    of hardware. These are the ones that affect the most:


    +   - Camera The phone has at least a 5-megapixel camera with flash. Programs
    can invoke the camera program for their own input, or register themselves as a
    Photos Extra Application and appear on a menu to obtain access to photographed
    images, perhaps for some image processing.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Part I The Basics


    +   - Accelerometer An accelerometer detects acceleration, which in physics is
    a change in velocity. When the camera is still, the accelerometer responds to
    gravity. Programs can obtain a three-dimensional vector that indicates how the
    camera is oriented with respect to earth. The accelerometer can also detect sharp
    movements of the phone.


    +   - Location If the user desires, the phone can use multiple strategies for
    determining where it is geographically located. The phone supplies a hardware
    GPS device with information from the Web or cell phones. If the phone is moving,
    course and speed might also be available.


    +   - Vibration The phone can be vibrated through program control.


    +   - FM Radio An FM Radio is available and accessible through program control.


    +   - Push Notifications Some Web services would normally require the phone to
    frequently poll the service to obtain updated information. This can drain battery
    life. To help out, a push notification service has been developed that will allow
    any required polling outside the phone and for the phone to receive notifications
    only when data has been updated.


    # File | New | Project


    I assume you have Visual Studio 2010 Express for Windows Phone installed, either
    by itself or supplementing a regular version of Visual Studio 2010. For convenience,
    I''m going to refer to this development environment simply "Visual Studio."


    The traditional "hello, world" program that displays a little bit of text might
    seem silly to nonprogrammers, but programmers have discovered that such a program
    serves at least two purposes: First, the program provides a way to examine how
    easy (or ridiculously complex) it is to display a simple text. Second, it gives
    the programmer an opportunity to experience the process of creating, compiling,
    and running a program without a lot of distractions. When developing programs
    that run on a mobile device, this process is a little more complex than customary
    because you''ll be creating and compiling programs on the PC you''ll be deploying
    and running them on an actual phone or at least an emulator.


    This chapter presents programs for both Microsoft Silverlight and Microsoft XNA
    that display the text "Hello


    Just to make these programs a little more interesting, I want to display the text
    in the center of the day. The Silverlight program will use the background and
    foreground colors selected by the user in the Themes section of the phone''s Settings
    screen. In the XNA program, the text will be white on a dark background to use
    less power on OLED.


    If you''re playing along, it''s time to bring up Visual Studio and from the File
    menu select New and Project.'
  merge: -1
