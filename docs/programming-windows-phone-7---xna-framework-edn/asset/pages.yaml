  md: "# Chapter 12 Tilt and Play\n\nThe TiltAndRoll program calculates a two-dimensional\
    \ acceleration vector from the three-dimensional accelerometer vector and multiplies\
    \ it by a constant named GRAVITY that is in units of pixels per squared. You can\
    \ determine what GRAVITY should theoretically equal by multiplying 32 feet per\
    \ squared by 12 inches per foot and by 264 pixels per inch and 2/3 and you'll\
    \ get something like 68,000, but in practical use this causes the ball to accelerate\
    \ much too quickly. I've chosen something a bit lower, so as to make the effect\
    \ as if the ball is moving through a thick liquid.\n\nXNA Project: TiltAndRoll\
    \ File: Game1.cs (excerpt showing fields)\n\n```\npublic class Game1 : Microsoft.Xna.Framework.Game\n\
    {\n    const float GRAVITY = 1000;\n    const int BALL_RADIUS = 16;\n    const\
    \ int BALL_SCALE = 16;\n\n    GraphicsManager graphics;\n    SpriteBatch spriteBatch;\n\
    \n    Viewport viewport;\n    Texture2D ball;\n    Vector2 ballCenter;\n    Vector2\
    \ ballPosition;\n    Vector2 ballVelocity = Vector2.Zero;\n    Vector3 oldAcceleration,\
    \ acceleration;\n    object accelerationLock = new object();\n\n    public Game1()\n\
    {\n        graphics = new GraphicsManager(this);\n        Content.RootDirectory\
    \ = \"Content\"\n\n        // Frame rate is 30 fps by default for Windows Phone.\n\
    \        TargetElapsedTime = TimeSpan.FromTicks(333333);\n\n        // Restrict\
    \ orientation to portrait\n        graphics.SupportedOrientations = DisplayOrientation.Portrait;\n\
    \        graphics.PreferredBackBufferWidth = 480;\n        graphics.PreferredBackBufferHeight\
    \ = 768;\n}\n\n```\n\nOf course, increase the value of GRAVITY if you'd like.\n\
    \nTo simplify the calculations, the constructor fixes a portrait orientation.\
    \ The X and Y components of the accelerometer vector will match the coordinates\
    \ of the display except that the accelerometer Y and the display Y increase in\
    \ opposite directions."
