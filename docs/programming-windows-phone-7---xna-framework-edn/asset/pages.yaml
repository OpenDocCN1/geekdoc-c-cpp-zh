  md: '# Part I The Basics


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_32_0.png)


    This screen shot—and some of the remaining screen shots in this book—are shown
    on the pages of this book with a size that approximates the size of the actual
    phone, surrounded by some simple ''chrome'' that symbolizes either the actual
    phone or the phone emulator.


    As simple as it, program demonstrates some essential concepts of Silverlight programming,
    including dynamic layout. The XAML file defines a layout of elements in a visual
    tree. These elements are capable of arranging themselves dynamically. The HorizontalAlignment
    and VerticalAlignment properties can put an element in the center of another element,
    or (as you might suppose) along one of the edges or in one of the corners. TextBlock
    is one of number of possible elements you can use in a Silverlight program; others
    include bitmap images, movies, and familiar controls like buttons, sliders, and
    list boxes.


    # Color Themes


    From the start of the phone or phone emulator, click or touch the right arrow
    at the upper right and navigate to the Settings page and then select them. A Windows
    Phone 7 theme consists of a Background and an Accent color. For the Background
    you can select either Dark (light text on a dark background, you''ve been seeing)
    or Light (the opposite). Select the Light theme, run SilverlightHelloPhone again,
    and express some satisfaction that the theme colors are automatically applied:'
  merge: -1
