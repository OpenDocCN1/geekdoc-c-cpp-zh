    \ rotation,\ncarCenter, 1, SpriteEffects.None, 0);\n    spriteBatch.End();\n\n\
    \    base.Draw(gameTime);\n}\n```\n\n# A Generalized Curve Solution\n\nFor movement\
    \ along curves that are not quite convenient to express in parametric equations,\
    \ XNA itself provides a generalized solution based on the Curve and CurveKey classes\
    \ defined in the Microsoft.Xna.Framework namespace.\n\nThe Curve class contains\
    \ a property named Keys of type CurveKeyCollection, a collection of CurveKey objects.\
    \ Each CurveKey object allows you to specify a number pair of the form (Position,\
    \ Value). Both the Position and Value properties are of type float. When you pass\
    \ a position to the Curve method Evaluate, it returns an interpolated value.\n\
    \nBut it's all rather confusing because—as the documentation indicates—the Position\
    \ property of CurveKey is almost always a time, and the Value property is often\
    \ a position, or more accurately, one coordinate of a position. If you want to\
    \ use Curve to interpolate points in two-dimensional space, you need two instances\
    \ of Curve—one for the X coordinate and the other for Y. These Curve instances\
    \ are treated very much like parametric equations.\n\nSuppose you want the car\
    \ to go around a path that looks like an infinity sign, and let's assume that\
    \ we're going to approximate the infinity sign with two adjacent circles. (The\
    \ technique I'm going to show you will allow you to move those two circles apart\
    \ at a later time if you'd like.)\n\n![](img/d9347c1f55fa6d523479d2cd9b4d5459_202_0.png)"
