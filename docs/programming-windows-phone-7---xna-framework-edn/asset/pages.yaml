  md: "# Part II XNA\n\n```\nbool firstDragInGesture = true;\nCardInfo touchedCard;\n\
    Vector2 touchedCardPosition;\nobject touchedCardOrigin;\nint touchedCardOriginIndex;\n\
    ..\n```\n\nThe program uses two Texture2D objects: the cards object is the bitmap\
    \ containing 52 cards; individual cards are displayed by defining rectangular\
    \ subsets of this bitmap. The surface is the dark blue area you see in the screen\
    \ that also includes the rectangles and the red button. The coordinates of these\
    \ 16 white rectangles—there are eight more under the top card in each pile—are\
    \ stored in the cardSpots array.\n\nThe displayMatrix is normally the identity\
    \ matrix. However, if you're a Free Cell player you know that some piles of cards\
    \ can grow long. The displayMatrix performs vertical compression to compress the\
    \ entire area. The inverseMatrix is the inverse of that matrix and is necessary\
    \ to convert screen-relative touch input to points on the compressed bitmap.\n\
    \nThe next fields are the basic data structures used by the program. The deck\
    \ array contains all 52 Card objects created early in the program and re-used\
    \ until the program terminates. During play, copies of these cards are also in\
    \ piles, holds, and finals. I originally thought finals would be an array like\
    \ holds only the top card can be displayed, but I discovered that the auto-move\
    \ feature potentially required more cards to be visible.\n\nThe other fields are\
    \ connected with touching and moving cards with the fingers. The touchedCardPosition\
    \ field is the current position of the moving card. The touchedCardOrigin field\
    \ stores the object where the moving card comes from and is the holds or piles\
    \ array, while touchedCardCreateIndex is the array index. These are used to return\
    \ the card to its original spot if the user tries to move the card illegally.\n\
