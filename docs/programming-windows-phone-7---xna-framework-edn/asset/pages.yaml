  md: '# 10 Part I The Basics


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_24_0.png)


    The phone emulator has a little floating menu at the upper right that comes into
    view when you move the mouse to that location. You can change orientation through
    this menu, or change the emulator size. By default, the emulator is displayed
    at 50% actual size, about the same size as the image on this page. When you display
    the emulator at 100%, it becomes enormous, and you might wonder "How will I ever
    fit this phone big into my pocket?"


    The difference involves pixel density. Your computer screen probably has about
    100 pixels per inch. (By default, Windows assumes screens are 96 DPI.) The screen
    on an actual Windows Phone 7 device is more than 2½ times that. When you display
    the emulator at 100%, you''re seeing all the pixels of the phone''s screen, but
    at about 250% their actual size.


    You can terminate execution of this program and return to editing the program
    either through Visual Studio (using Shift-F5 or selecting Stop Debugging from
    the Debug menu) or by clicking the Back button on the emulator.


    Don''t exit the emulator by clicking the X at the top of the floating menu! Keeping
    the emulator running will make subsequent deployments much faster.


    While the emulator is running, it retains all programs deployed to it. If you
    click the arrow at the upper-right of the Start screen, you''ll get a list that
    will include this program identified by the text "Silverlight Hello Phone" and
    you can run the program again. The program will disappear from this list when
    you exit the emulator.


    If you have a Windows Phone 7 device, you''ll need to register for the marketplace
    at the Windows Phone 7 portal, http://developer.windowsphone.com. After you''re
    approved, you''ll'
