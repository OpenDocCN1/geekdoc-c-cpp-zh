  md: '# Chapter 6 Issues in Application Architecture


    Now you touch the TextBlock again to navigate to the second page:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_127_0.png)


    The background is black. The second page does not display the color you set when
    you last visited the second page. This is very obviously a brand new instance
    of the SecondPage class.


    The navigation system in Silverlight for Windows Phone is based around the metaphor
    of the last-in-first-out data structure called the stack. I''ll sometimes refer
    to the page calling Navigate as the source and the page being navigated to as
    the destination. When the source page calls Navigate, the source page is put on
    the stack and a new instance of the destination page is created and displayed.
    When a page calls GoBack—or when the user presses the phone''s hardware Back button—that
    page is abandoned, and the page at the top of the stack is popped off and displayed.


    Within a Silverlight application, the phone''s Back button performs the same function
    as a call to GoBack except if you''re at the initial page of the program, in which
    case the hardware button terminates the application.


    Try this: Replace the GoBack call in SecondPage.xml with the following:


    ```

    this.NavigationService.Navigate(new Uri("/MainPage.xaml"), UriKind.Relative));

    ```


    This is not the same as the GoBack call. You won''t go back to the original instance
    of MainPage. This call causes SecondPage to navigate to a new instance of MainPage,
    and if you keep pressing the TextBlock on each the pages, you will build up a
    stack of alternating MainPage and SecondPage instances, each of which can have
    its own unique'
