  md: '# Part II XNA


    The acceleration2D vector is simply the accelerometer vector with the Z coordinate
    ignored and the Y coordinate negated. The velocity vector is adjusted by the acceleration
    vector times the elapsed time in seconds. The ball position is then adjusted by
    the resultant velocity vector, also times the elapsed time in seconds.


    It is the beauty of vectors that we really don''t have to know whether the phone
    is tilted in the same direction as the velocity (and hence will tend to increase
    that velocity) or tilted in the opposite direction (in which case it tends to
    dampen the velocity), or tilted at some other angle that has no relation to the
    velocity.


    The statements that conclude Update checking if the ball has gone beyond one of
    the edges, in which case it is brought back into view and that component of the
    velocity is set to zero. These are not if else statements because the ball might
    simultaneously go outside the bounds of two edges and this case needs to be handled;
    if so, the ball will then come to rest in the corner.


