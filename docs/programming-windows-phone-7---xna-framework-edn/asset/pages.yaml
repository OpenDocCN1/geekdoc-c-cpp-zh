  md: "# Chapter 10 From Gestures to Transforms 257\n\nAlthough not explicitly included,\
    \ a pair of fingers can also translate the image if the fingers move in the same\
    \ direction.\n\n# Flick and Inertia\n\nIn the move Minority Report (2002), Tom\
    \ Cruise demonstrated how to flick an object off one side of the computer screen,\
    \ and the whole world said \"Way cool!\n\nFor the most part, implementing inertia\
    \ in the touch interfaces of a program is your responsibility. XNA helps out a\
    \ little with the Flick gesture, which is generated when the user quickly swipes\
    \ a finger on the screen. The Delta property of the GestureSample object indicates\
    \ the velocity of the finger in pixels per second (That's what it is supposed\
    \ to be, anyway. It seems to be closer to the actual velocity.) The velocity is\
    \ represented as a Vector2, so it indicates direction as well as magnitude.\n\n\
    There's no position information with the Flick gesture. It's basically no matter\
    \ where you flick the screen. If you need to implement inertia based on finger\
    \ position as well as velocity, you will probably find yourself calculating velocity\
    \ from Drag gestures by dividing the Delta values by the ElapsedGameTime property\
    \ of the GameTime argument to Update.\n\nTo implement inertia, you need to continue\
    \ moving an object based on an initial velocity and a deceleration value. If the\
    \ velocity is in units per second, the deceleration is probably in units of pixels\
    \ per second squared. Every second, the velocity decreases by the deceleration\
    \ value until the magnitude gets down to zero. For Update calls occurring every\
    \ fraction of a second, the velocity decreases proportionally.\n\nThe Flickinertia\
    \ project demonstrates a very simple implementation of inertia. The fields position,\
    \ velocity, and a deceleration constant:\n\n```\nXNA Project: Flickinertia File:\
    \ Game1.cs (excerpt showing fields)\n\npublic class Game1 : Microsoft.Xna.Framework.Game\n\
    {\n    GraphicsDeviceManager graphics;\n    SpriteBatch spriteBatch;\n\n    const\
    \ float DEELERATION = 1000; // pixels per second squared\n\n    Texture2D texture;\n\
    \    Vector2 position = Vector2.Zero;\n    Vector2 velocity;\n    SpriteFont sego14;\n\
    \    StringBuilder text = new StringBuilder();\n\n```"
