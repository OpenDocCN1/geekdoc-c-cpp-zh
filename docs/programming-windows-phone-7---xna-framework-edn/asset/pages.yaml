  md: "# Chapter 9 Dynamic Textures 203\n\nBy default, the RenderTarget2D is created\
    \ with 32 bits per pixel—8 bits each for red, green, blue, and alpha—corresponding\
    \ to the enumeration SurfaceFormat.Color. I'll have to say about this format before\
    \ the end of this chapter, but this 32-bit color format is now commonly regarded\
    \ as standard. It is the only color format supported in Silverlight bitmaps.\n\
    \nTo maximize performance, you might want to create a RenderTarget2D or a Texture\
    \ object that has the same pixel format as the back buffer and the display. Classes\
    \ support constructors that include arguments of type SurfaceFormat to indicate\
    \ a color format.\n\nFor the PinwheelText program, creating a RenderTarget2D object\
    \ with SurfaceFormat. Bgr565 wouldn't work. There's no alpha channel in this format\
    \ so the background of the RenderTarget2D isn't transparent. The background would\
    \ have to be colored to match the background of the back buffer.\n\nThe following\
    \ program creates a RenderTarget2D object that is not only the size of the back\
    \ buffer but also the same color format. The program, however, is rather retro,\
    \ and you might wonder what the point is.\n\nBack in the early days of Microsoft\
    \ Windows, particularly at trade shows where computers were running, it was common\
