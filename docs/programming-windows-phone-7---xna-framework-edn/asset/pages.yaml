  md: "# Chapter 12 Tilt and Play 369\n\nThe ballPosition initialized in LoadContent\
    \ is a point stored as a Vector2 object. Velocity is stored as a Vector2 object\
    \ but this is a real unit of pixels per second. The velocity will remain constant\
    \ throughout the effect of inertia the ball hits one of the edges or the position\
    \ is tilted. All these calculations occur in the Update override:\n\n```\nXNA\
    \ Project: TiltAndRoll File: Game1.cs (excerpt)\n\nprotected override void Update(GameTime\
    \ gameTime)\n{\n    // Allow the game to exit\n    if (Game.GetState(PlayerIndex.One).Buttons.Back\
    \ == ButtonState.Pressed)\n        this.Exit();\n\n    // Calculate new velocity\
    \ and position\n    Vector2 acceleration2D = Vector2.Zero;\n\n    lock (accelerationLock)\n\
    \    {\n        acceleration2D = new Vector2(acceleration.X, -acceleration.Y);\n\
    \        float elapsedSeconds = (float)gameTime.TotalSeconds;\n        ballVelocity\
    \ += GRAVITY * acceleration2D * elapsedSeconds;\n        ballPosition += ballVelocity\
    \ * elapsedSeconds;\n    }\n\n    // Check for hitting edge\n    if (ballPosition.X\
    \ - BALL_RADIUS < 0)\n    {\n        ballPosition.X = BALL_RADIUS;\n        ballVelocity.X\
    \ = 0;\n    }\n    if (ballPosition.X + BALL_RADIUS > viewport.Width)\n    {\n\
    \        ballPosition.X = viewport.Width - BALL_RADIUS;\n        ballVelocity.X\
    \ = 0;\n    }\n    if (ballPosition.Y - BALL_RADIUS < 0)\n    {\n        ballPosition.Y\
    \ = BALL_RADIUS;\n        ballVelocity.Y = 0;\n    }\n    if (ballPosition.Y +\
    \ BALL_RADIUS > viewport.Height)\n    {\n        ballPosition.Y = viewport.Height\
    \ - BALL_RADIUS;\n        ballVelocity.Y = 0;\n    }\n\n    base.Update(gameTime);\n\
    }\n```\n\nThe two crucial calculations are these:\nballVelocity += GRAVITY * acceleration2D\
    \ * elapsedSeconds;\nballPosition += ballVelocity * elapsedSeconds;"
