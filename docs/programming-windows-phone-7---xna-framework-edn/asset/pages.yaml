  md: '# A First Silverlight Phone Program


    In the New Project dialog box, on the left under Installed Templates, choose Visual
    C# and then Silverlight for Windows Phone. In the middle area, choose Windows
    Phone Application. Select a location for the project, and enter the project name:
    SilverlightHelloPhone.


    As the project created you''ll see an image of a large-screen phone in portrait
    mode with a screen area 480 × 800 pixels in size. This is the design view. Although
    you can interactively pull controls from a toolbox to design the application,
    I am going to focus instead on showing how to write your own code and markup.


    Several files have been created for this SilverlightHelloPhone project and are
    listed under the project name in the Solution Explorer or at right. In the Properties
    folder are three files that you can usually ignore when you''re creating little
    sample Silverlight programs for the phone. Only when you''re actually in the process
    of making a real application do these files become important.


    However, you might want to open the WMAAppManifest.xml file. In the App tag near
    the top, you''ll see the:


    ```

    Title="SilverlightHelloPhone"

    ```


    That''s the project name you select. Insert some spaces to make it a little friendlier:


    ```

    Title="Silverlight Hello Phone"

    ```


    This is the name used by the phone and the emulator to display the program in
    the list of installed applications presented to the user. If you''re really ambitious,
    you can also edit the ApplicationIcon.png and Background.png files that the phone
    uses to visually symbolize the program. The SplashScreen.jpg file is what the
    program displays as it''s initializing.


    In the Standard Visual Studio toolbar under the program, you''ll see a drop-down
    list probably displaying "Windows 7 Emulator". The other is "Windows 7 Device."
    This is how you deploy your project to either the emulator or an actual phone
    connected to your computer via USB.


    Just to see that everything''s working OK, select Windows 7 Emulator and press
    F5 (or select Debugging from the Debug menu). Your program will quickly build
    and in the status bar you will see the "Connecting to Windows 7 Emulator..." The
    first time you use the emulator during a session, it might take a little time
    to start up. If you leave the emulator running between edit/build/run cycles,
    Visual Studio doesn''t need to establish this


    Soon the emulator will appear on the desktop and you''ll see the screen, followed
    soon by this little-nothing Silverlight program as it is deployed and run on the
    emulator. On the phone you''ll see pretty much the same image you saw in the design
    view.'
  merge: -1
