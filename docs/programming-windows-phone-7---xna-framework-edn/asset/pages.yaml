    # The Geometry of Line Drawing


    To draw lines on a Texture2D, it would be convenient to directly set the pixels
    in the bitmap to render the line. For purposes of analysis and illustration, let''s
    suppose you want to draw a line between pt1 and pt2:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_231_0.png)


    This geometric line has zero thickness, but a rendered line has a non-zero thickness,
    which we''ll assume is 2R pixels. (R stands for radius, and you''ll understand
    why I''m thinking of it in those terms shortly.) You really want to draw a rectangle,
