  md: "# Part II XNA\n\nup to that maximum number, and if it hasn't diverged by then,\
    \ the pixel is set to black. In pseudocode, it's something like this:\n\nFor each\
    \ pixel\n\n```\n{\n    Perform up to MAX iterations\n    Set pixel to black or\
    \ some color\n}\n```\n\nThe problem with this approach is that it tends to be\
    \ inadequate when you zoom in a great deal. Generally the more you zoom in a particular\
    \ area of the Mandelbrot set, the more iterations are needed to determine whether\
    \ a pixel is not part of the set and how it should be colored.\n\nThat problem\
    \ implied to me a different approach: My MandelbrotSet program initially sets\
    \ all the pixels to black and then performs the following in a second thread of\
    \ execution:\n\nDo forever\n\n```\n{\n    {\n        Perform another iteration\
    \ if necessary\n        Possibly set pixel to some color\n    }\n}\n```\n\nThis\
    \ approach creates a screen that progressively gets more interesting the longer\
    \ you wait. The downside is that about 17 megabytes of memory is required to support\
    \ the data structure necessary for this job. It's too large to be saved during\
    \ tombstoning. The overall performance also seems to be slower than more traditional\
    \ approaches.\n\nHere is the PixelInfo structure used to store information for\
