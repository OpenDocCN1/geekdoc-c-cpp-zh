    You''ll discover that the accelerometer is very jittery and cries out for some
    data smoothing. I''ll discuss this and other accelerometer-related issues in Chapter
    12.


    # Geographic Location


    With the user''s permission, a Windows Phone 7 program can obtain the geographic
    location of the phone using a technique called Assisted-GPS or A-GPS.


    The most accurate method of determining location is accessing signals from Global
    Positioning System (GPS) satellites. However, GPS can be slow. It doesn''t work
    well in cities or indoors, and it''s considered expensive in terms of battery
    use. To work more cheaply and quickly, an A-GPS system can determine location
    from cell-phone towers or the network. These methods are faster and more reliable,
    but less accurate.


    The core class involved in location detection is GeoCoordinate. You''ll need a
    reference to the System.Device assembly and using a direction for the System.Device.Location
    namespace. The WMAppManifest.xml file requires the tag:


    ```

    <Capability Name="ID_CAP_LOCATION" />

    ```


    This is included by default.'
  merge: -1
