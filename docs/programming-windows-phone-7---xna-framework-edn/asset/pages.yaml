  md: "# 158 Part II XNA\n\nThe additional arguments to these longer versions of DrawString\
    \ are primarily for rotating, scaling, and flipping the text. The exception is\
    \ the last argument, which is a float value that indicates multiple sprites should\
    \ be arranged from front (0) to back (1). I won't be using that argument in connection\
    \ with DrawString.\n\nThe penultimate argument is a member of the SpriteEffects\
    \ enumeration. The default is None. The FlipHorizontally and FlipVertically members\
    \ both create mirror images but don't change the location of the text:\n\nThe\
    \ alternatives are really the same just flipped 180° from each other.\n\nThe argument\
    \ labeled origin is a point with a default value of (0, 0). This argument is used\
    \ for three related purposes:\n\n+   - It is the point relative to the text string\
    \ that is aligned with the position argument relative to the screen.\n- It is\
    \ the center of rotation. The rotation argument is a clockwise angle in radians.\n\
    - It is the center of scaling. Scaling can be specified with either a single number,\
    \ which scales equally in the horizontal and vertical directions to maintain the\
    \ correct aspect ratio, or a Vector2, which allows unequal horizontal and vertical\
    \ scaling.(Sometimes these two modes of scaling are called isotropic—equal in\
    \ all directions—and anisotropic.)\n\nIf you use one of the longer versions of\
    \ DrawString and are not interested in scaling, do not set that argument to zero!\
    \ Text or a sprite scaled to a zero dimension will not show up on the screen and\
    \ you will spend many hours trying to figure out what went wrong.(I speak from\
    \ experience.) If you don't want any scaling, set the argument to 1 or the static\
    \ property Vector2.One.\n\nThe very first XNA program in this book calculated\
    \ textPosition based on the dimensions of the screen and the dimensions of the\
    \ text:\n\n```\ntextPosition = new Vector2((viewport.Width - textSize.X) / 2,\n\
    \                (viewport.Height - textSize.Y) / 2);\n```"
