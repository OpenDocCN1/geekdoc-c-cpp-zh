  md: '# Part I The Basics


    Notice the call to the **Complete** method of the event arguments at the end.
    This is not

    required but effectively tells the system that further **Manipulation** events
    involving this finger

    won''t be necessary.


    This program is flawed: if you try it out, you will see that it works properly.
    Touching the

    `TextBlock` changes the text to a random color. But if you touch outside the `TextBlock`,
    the text

    *does not go back to white*. Because this event was set on the `TextBlock`, the
    event handler is

    only called when the user touches the TextBlock. No other *Manipulation* events
    are processed

    by the program.


    A program that functions correctly according to my original specification needs
    to get touch

    ev occurring *anywhere* on a page. A handler for the *ManipulationStarted* event
    needs

    to be installed on `MainPage` rather than on the `TextBlock`.


    Although that''s potentially possible, there''s actually an easier way. The `UIElement`
    class

    defines all the **Manipulation** events. The `Control` class (from `MainPage`
    derives)

