  md: "The constructor calculates cReal and climag from a pixelIndex that ranges from\
    \ 0 up to (but not including) the product of the pixel width and height of the\
    \ display. The static pixelWidth and pixelHeight fields are based on the screen\
    \ dimensions and fixed throughout the duration of the program.\n\nThe calculation\
    \ of cReal and climag is also based on other static fields. The xCoordAtComplexOrigin\
    \ and yCoordAtComplexOrigin fields indicate the horizontal and vertical coordinates\
    \ that correspond to the origin of the complex plane. The use of double for these\
    \ fields indicates that they are capable of representing fractional pixels. The\
    \ unitsPerPixel field indicates the range of real numbers or imaginary numbers\
    \ associated with a single pixel. These values change with scaling operations.\n\
    \nThis PixelInfo structure contains more double values than in all the other XNA\
    \ programs in this book combined. I originally made these values all float, of\
    \ course (and pixelCoordAtComplexOrigin was a Vector2) I leaped to use double\
    \ the first time I zoomed in beyond the precision of float. Interestingly, moving\
    \ from float to double had very little impact on performance.\n\nThe second argument\
    \ to the constructor is optional. If it's present, the constructor will copy the\
    \ corresponding color from the pixels array into its packedColor field. You will\
