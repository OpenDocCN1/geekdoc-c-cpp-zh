  md: '# Part I The Basics


    In a document entitled "Creating High Performance Silverlight Applications for
    Windows Phone," Microsoft has recommending using a Build Action of Content rather
    than Resource for assets included in your application to minimize the size of
    the binary and startup time. However, if these assets are embedded in a Silverlight
    library that the program references, then it is better for them to be embedded
    in the binary with a Build Action of Resource.


    If you have a number of images in your program, and you don''t want to include
    them all in the XAP file, or if you''re nervous about downloading the images,
    why do not use a little of both? Include low resolution (or highly compressed)
    images in the XAP file, but download better versions asynchronously while the
    application is running.


    # Capturing from the Camera


    Besides embedding bitmaps in your application or accessing them from the web,
    Windows Phone 7 also allows you to acquire images from the built-in camera.


    Your application has no control over the camera itself. For reasons of security,
    your program cannot arbitrarily snap a picture, or "see" what''s coming through
    the camera lens. Your application basically invokes a standard camera utility,
    the user points and shoots, and the picture is returned to your program.


    The classes for this job are in the Microsoft.Phone.Tasks namespace, which contains
