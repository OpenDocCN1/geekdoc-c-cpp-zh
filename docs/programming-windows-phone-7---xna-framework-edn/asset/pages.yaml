  md: "# Part II XNA\n\nThe Initialize method starts up the accelerometer, and the\
    \ ReadingChanged event handler itself handles the smoothing of the values:\n\n\
    ```\nXNA Project: TiltAndRoll File: Game1.cs (excerpt)\nprotected override void\
    \ Initialize()\n{\n    Accelerometer accelerometer = new Accelerometer();\n  \
    \  accelerometer.ReadingChanged += OnAccelerometerReadingChanged;\n\n    try {\n\
    \        accelerometer.Start();\n    } catch {\n    }\n\n    base.Initialize();\n\
    }\nnvoid OnAccelerometerReadingChanged(object sender, AccelerometerReadingEventArgs\
    \ args)\n{\n    lock (accelerationLock)\n    {\n        acceleration = 0.5F *\
    \ oldAcceleration +\n0.5F * new Vector3((float)args.X, (float)args.Y, (float)args.Z);\n\
    \        oldAcceleration = acceleration;\n    }\n}\n```\n\nYou'll notice the constants\
    \ above define both BALL_RADIUS and a BALL_SCALE. Because the Texture2DEensions.CreateBall\
    \ method does not attempt to implement-aliasing, a smoother image results if the\
    \ ball is larger than the displayed size XNA performs smoothing when rendering\
    \ it. Although the ball is created with a total radius of the product of BALL_RADIUS\
    \ and BALL_SCALE, it is later drawn with a scaling factor of 1 / BALL_SCALE.\n\
    \n```\nXNA Project: TiltAndRoll File: Game1.cs (excerpt)\nprotected override void\
    \ LoadContent()\n{\n    // Create a new SpriteBatch, which can be used to draw\
    \ textures.\n    spriteBatch = new SpriteBatch(GraphicsDevice);\n\n    viewport\
    \ = this.GraphicsDevice.Viewport;\n    ball = Texture2DEensions.CreateBall(this.GraphicsDevice,\n\
    BALL_RADIUS * BALL_SCALE);\n\n    ballCenter = new Vector2(ball.Width / 2, ball.Height\
    \ / 2);\n    ballPosition = new Vector2(viewport.Width / 2, viewport.Height /\
    \ 2);\n}\n```"
