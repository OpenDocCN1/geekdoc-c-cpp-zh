  md: '# Chapter 6 Issues in Application Architecture 125


    Later you decide you need to run Analyze. While you are using Analyze, you need
    to check something on the Web. You press the Start button to get to the Start
    screen and select Internet Explorer. While you are browsing, you remember you
    haven''t played any games recently. You press the Start button, select Backgammon
    and play a little of. While playing Backgammon, you wonder about the odds of a
    particular move, so you press the Start button and run Calc. Then you feel guilty
    about not doing any work, so you press the Start button again and run Draft.


    Draft is a Silverlight program with multiple pages. From the main page, you navigate
    to other pages.


    Now press the Back button. You go backwards through all the pages in the page
    stack of the Draft, then Draft is terminated as you go back to Calc. Calc still
    displays the remnants of your work, and Calc is terminated as you go back to Backgammon,
    which shows a game in progress, and Backgammon is terminated as you go back to
    Internet Explorer, and you go backwards through any Web pages you have navigated
    through, and IE is terminated as you go back to Analyze, and Analyze is terminated
    as you go back to the Start screen. The stack is now empty.


    However, the limited resources of the phone convinced the Windows 7 developers
    that applications on the stack should have as minimum a footprint as possible.
    For this reason, an application on the stack does not continuing away at work.
    It''s not put into a suspended state of some sort. Something more severe than
    what happens. The process is actually terminated. When this terminated process
    comes off the stack, it is then re-executed from scratch.


    This is tombstone. The application is killed but then allowed to come back to
    life.


    You''ve probably seen even movies to know that re-animating a corpse can be very
    scary proposition. Almost always the hidden thing that arises out of the filthy
    is not clean and manicured loved one who went in.


    The trick here is to persuade the disentered program to look and feel much the
    same as it was last alive and the user interacted with it. This process is a collaboration
    between you and Windows Phone 7. The phone gives you the tools (events and a place
    to put some data); your job is to use the tools to restore your program to a presentable
    state. Ideally the user should have no idea that it''s a completely new process.


    For some applications, resurrection doesn''t have to be 100% successful. We all
    have experience with navigating among Web pages to know what''s acceptable and
    what''s not.'
