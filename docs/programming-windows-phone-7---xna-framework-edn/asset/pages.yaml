  md: "# Part II XNA\n\nGestureSample also defines four properties of type Vector2.\
    \ None of these properties are valid for the DragComplete and PinchComplete types.\
    \ Otherwise:\n\n+   - Position is valid for all gestures except Flick.\n\n+  \
    \ - Delta is valid for all Drag gestures, Pinch, and Flick.\n\n+   - Position2\
    \ and Delta2 are valid only for Pinch.\n\nThe Position property indicates the\
    \ current position of the finger relative to the screen. The Delta property indicates\
    \ the movement of the finger since the last position. For an object of type GestureSample\
    \ named gestureSample,\n\nVector2 previousPosition = gestureSample.Position -\
    \ gestureSample.Delta;\n\nThe Delta vector equals zero when the first finger touches\
    \ the screen or when the finger is still.\n\nSuppose you're only interested in\
