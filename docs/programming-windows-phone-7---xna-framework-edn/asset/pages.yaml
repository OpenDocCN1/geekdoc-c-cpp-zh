  md: '# Part II XNA


    because the LoadContent method might soon be followed by a call to the OnActivated
    override which signals either the program is starting up, or it''s returning from
    a tombstoned state.


    It is important for FingerPaint to implement tombstoning users tend to become
    enraged when their creative efforts disappear from the screen. For that reason
    the OnActivated override saves the image to the ApplicationService in PNG format,
    and the OnActivated override gets it back out. I chose PNG for this process because
    it''s a lossless compression format, and if the image should be restored exactly
    to its original state.


    To slightly ease the process of saving and loading Texture2D object, I used the
    methods in the Texture2DEensions class in the Petz.Phone.Xna library I described
    in the previous chapter. The OnActivated method calls LoadFromPhoneService to
    obtain a saved Texture2D, and if that''s not available, only then does it create
    a new one and clear.


    The use of the ApplicationService class requires references to the System.Windows
    and Microsoft.Phone assemblies, and a using directive for Microsoft.Phone.Shell.


