  md: '# Chapter 1

    Hello, Windows Phone 7


    Sometimes it becomes apparent that previous approaches to a problem haven''t worked

    the you anticipated. Perhaps you need to clear away the smoky residue of the past,

    take a deep breath, and try again with a new attitude and fresh ideas. In golf,
    it''s known as

    a "mulligan"; in schoolyard sports, it''s called a "do-over"; and in the computer
    industry, we

    say it''s "reboot".


    A reboot is what Microsoft has initiated with its new approach to the mobile phone
    market.

    With its clean, striking fonts, and new organizational paradigms, Microsoft Windows

    Phone 7 not only represents a break with the Windows Mobile past but also differentiates

    itelf from other smartphones in the market. Windows Phone 7 devices will be

    made by several manufacturers and available with a variety of cell providers.


    For programmers, Windows Phone 7 is also exciting, for it supports two popular
    and modern

    programming platforms: Silverlight and XNA.


    Silverlight—a spinoff of the client-based Windows Presentation Foundation (WPF)—has

    already given Web programmers unprecedented power to develop sophisticated user

    interfaces with a variety of traditional controls, high-quality text, graphics,
    media,

    animation, and data binding that run on multiple platforms and browsers. Windows
    Phone 7

    extends Silverlight to mobile devices.


    XNA—the three letters for something like "XNA is Not an Acronym"—Microsoft''s

    game platform supporting both 2D sprite-based and 3D graphics with a traditional

    game-loop architecture. Although XNA is mostly associated with writing games for
    the Xbox

    360 console, developers can also use XNA to target the PC, as well as Microsoft''s
    classy

    audio player, the Zone HD.


    Either Silverlight or XNA would make sense as the sole application platform for
    the

    Windows Phone 7, but programmers have a choice. And this will "an embarrassment
    of riches.".


    # Targeting Windows Phone 7


    All programs for Windows Phone 7 are written in .NET managed code. The sample

    programs in this book are written in the C# programming language, it is also possible
    to

    write Windows Phone 7 applications in Visual Basic. .NET. The free downloadable
    Microsoft

    Visual Studio 2010 Express for Windows Phone includes XNA Game Studio 4.0 and
    an

    on-screen phone emulator, and also integrates with Visual Studio 2010. You can
    develop

    visuals and animations for Silverlight applications using Microsoft Blend.'
  merge: -1
