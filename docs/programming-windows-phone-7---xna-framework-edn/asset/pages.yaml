  md: '![](img/d9347c1f55fa6d523479d2cd9b4d5459_259_0.png)


    Of course, the most common form of scaling implemented in multi-touch applications
    involves two fingers in a pinching or stretching gesture, and in a sense, that
    isn''t much more difficult than what you''ve already seen. I''ve been stretching
    and rotating relative to a reference point, and with two fingers it''s similar
    except that the reference point is always the other finger.


    For example, two fingers on an on-screen object. If you keep one finger steady
    and move the other finger, you should expect all scaling and rotation to occur
    relative to the first finger. If that first finger is also moving, then whatever
    scaling and rotation it defines relative to the second finger. If the two fingers
    move in the same direction, then normal dragging results.


    The math is likely to get messy; fortunately XNA provides some very powerful tools
    to help out.


    # Matrix Transforms


    Traditionally, two-dimensional graphical systems have supported operations called
    transforms. These are basically mathematical formulas that are applied to coordinates
    (x, y) to make new coordinates (x'', y''). Although completely generalized transforms
    can be very complex, two-dimensional graphics programming environments often restrict
    transforms to a subset ("non-infinite") transforms, which are a slight superset
    of linear transforms.


    Linear transforms of x and y look like this:


    ```

    x'' = a*x + b*y

    y'' = c*x + d*y

    ```


    where the subscribed a and b are constants that define a particular transform.
    As you can see, x'' and y'' are both functions of x and y, but they are very simple
    functions.'
