- img_proc: true
  md: "# Part I The Basics\n\nIn the Save method, the area of isolated storage reserved\
    \ for this application is obtained from the static IsolatedStorageFile.GetUserForApplication\
    \ method. This method returns an object of type IsolatedStorageFile but the name\
    \ is a little misleading. IsolatedStorageFile object is closer in functionality\
    \ to a file system than a file. You use it to maintain directories, and to create\
    \ open files. A call to CreateFile returns an IsolatedStorageStream which is used\
    \ with an XmlSerializer to serialize and save the file.\n\nThe Load method is\
    \ a bit more complex because it's possible that the program is being run for the\
    \ very first time and the settings.xml file does not exist. In that case, the\
    \ Load method creates a new instance of Settings.\n\nNotice the constructor that\
    \ initializes the property to their default values, in which this case involves\
    \ only the single public property BackgroundColor. If you add a second public\
    \ property for another application at some point, you'll want to also specify\
    \ a default value of that property in the constructor. The first time you run\
    \ the new version of the program, that property will be initialized in the constructor,\
    \ but the Load method will retrieve a file that doesn't have that, so the new\
    \ version smoothly integrates with the previous version.\n\nHere's another consideration:\
    \ this scheme only works if the properties representing application settings are\
    \ serializable. For a more complex program, that might not be the case. For objects\
    \ that are not serializable but must still be saved to isolated storage, you can\
    \ still include a property for that object in this file but you'll want to flag\
    \ that definition with the [XmlIgnore] attribute. The property will be ignored\
    \ for serialization purposes. Instead you'll need to handle that property with\
    \ special code in the Save and Load methods.\n\nThe remainder of the XnaTombstoning\
    \ project lets you tap the screen and responds by displaying new random background\
    \ color and a count of the number of taps. The background color is treated as\
    \ an application setting (as is evident by its inclusion in the Settings class)\
    \ and the number of taps is a transient setting.\n\nHere's an excerpt of the Game1\
    \ class showing the fields, constructor, and PhoneApplicationService events:\n\
    \n> Silverlight Project: XnaTombstoning File: Game1.cs (excerpt)\n\n```\npublic\
    \ class Game1 : Microsoft.Xna.Framework.Game\n{\n    GraphicsDeviceManager graphics;\n\
    \    SpriteBatch spriteBatch;\n\n    Settings settings;\n    SpriteFont segoe14;\n\
    ```"
