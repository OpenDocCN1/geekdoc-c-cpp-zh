  md: 'If you think about what''s actually being rendered here, those cracks will
    make sense. You''re really drawing rectangles between pairs of points, and if
    those rectangles are at angles to one another, then a sliver is missing:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_227_0.png)


    This is much less noticeable for thin lines, but becomes intolerable for thicker
    ones.


    What can be done? Well, if the method displaying these rectangular textures knows
    that it''s drawing a series of lines (called a *polyline* in graphics circles)
    it can increase the scaling factor of the bitmap a little more in the horizontal
    direction so they meet up at the outer corner rather than the center:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_227_1.png)


    Getting this right requires calculations involving the angle between the two lines.
    And the technique has to be modified a bit for a finger painting program because
    you don''t know what the next line will be at the time each line is rendered.


    In environments that support line-drawing functions (such as Silverlight), problems
    such as these also exist with default line-drawing properties. However, in Silverlight,
    it''s possible to set rounded “caps” on the lines so they join very smoothly.


    In XNA, putting rounded caps on the lines is probably best handled by manipulating
    the actual pixel bits.


    # Manipulating the Pixel Bits


    Early in this chapter I showed you how to create a blank *Texture2D* object using
    one of its constructors:


    ```

    Texture2D texture = new Texture2D(this.GraphicsDevice, width, height);

    ```


    As the back buffer and the RenderTarget2D, how the bits of each pixel correspond
    to a particular color is indicated by a member of the *SurfaceFormat* enumeration.
    A *Texture2D* created with this simple constructor will have a *Format* property
    of *SurfaceFormat.Color*, which means that every pixel consists of 4 bytes (or
    32 bits) of data, one byte each for'
