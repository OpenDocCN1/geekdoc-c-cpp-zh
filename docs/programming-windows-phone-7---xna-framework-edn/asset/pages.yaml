  md: "# Part I The Basics\n\nThe code-behind file of the SecondPage class is also\
    \ very much like the FirstPage class:\n\n```\nSilverlight Project: SilverlightSimpleNavigation\
    \ File: SecondPage.xaml.cs (excerpt)\n\npublic partial class SecondPage : PhoneApplicationPage\n\
    {\n    Random rand = new Random();\n\n    public SecondPage()\n    {\n       \
    \ InitializeComponent();\n    }\n\n    void OnTextBlockManipulationStarted(object\
    \ sender, ManipulationEventArgs args)\n    {\n        this.NavigationService.GoBack();\n\
    \n        args.Complete();\n        args.Handled = true;\n    }\n\n    protected\
    \ override void OnManipulationStarted(ManipulationStartedEventArgs args)\n   \
    \ {\n        ContentPanel.Background = new SolidColorBrush((byte)rand.Next(255),\
    \ (byte)rand.Next(255), (byte)rand.Next(255));\n\n        base.OnManipulationStarted(args);\n\
    \    }\n}\n```\n\nAgain, when you touch anything on the page except the TextBlock,\
    \ the background changes to a random color. When you touch the TextBlock, the\
    \ handler calls another method of NavigationService.\n\nthis.NavigationService.GoBack();\n\
    \nThis causes the program to go back to the page that navigated to SecondPage.xaml,\
    \ in this case, MainPage.xaml. Take a look at the Navigate call in MainPage.cs\
    \ again:\n\nthis.NavigationService.Navigate(new Uri(\"/SecondPage.xaml\"), UriKind.Relative);\n\
    \nNavigation in a Silverlight program is built around XAML files in the same way\
    \ that navigation in a traditional Web environment is built around HTML files.\
    \ The actual instance of the SecondPage class is created by the scenes. The PhoneApplicationFrame\
    \ instance in the application handles many of the actual mechanics of navigation,\
    \ but the public interface of PhoneApplicationFrame also involves Uri objects\
    \ and XAML files rather than instances of PhoneApplicationPage derivatives."
