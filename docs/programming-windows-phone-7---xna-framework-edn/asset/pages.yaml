  md: "# Chapter 12 Tilt and Play 381\n\n```\nDivideChamber(chamber.Chamber1);\nDivideChamber(chamber.Chamber2);\n\
    }\n```\n\nI realized that I needed to generalize the bouncing logic, and for that\
    \ I needed a good way to represent a geometric line segment that would allow calculating\
    \ intersections and performing other useful operations. This is a structure called\
    \ Line2D. The line segment is defined with two points that also define a Vector\
    \ property and a Normal property, which is perpendicular to the Vector, so that\
    \ conceptually the line has a direction and can also have an \"inside\" and an\
    \ \"outside.\"\n\n# Project: Petzold.Phone.Xna File: Line2D.cs\n\n```\nusing System;\n\
    using Microsoft.Xna.Framework;\n\nnamespace Petzold.Phone.Xna\n{\n    // represents\
    \ line pt1 + t(pt2 - pt1)\n    public struct Line2D\n    {\n        public Line2D(Vector\
    \ pt1, Vector pt2) : this(\n        {\n            Point1 = pt1;\n           \
    \ Point2 = pt2;\n        });\n\n        Vector Vector = Point2 - Point1;\n   \
    \     Normal Normal = Vector2.Normalize(new Vector2(-Vector.Y, Vector.X));\n\n\
    \        public Vector2 Point1 { private set; get; }\n        public Vector2 Point2\
    \ { private set: get; }\n        public Vector2 Vector { private set; get; }\n\
    \        public Vector2 Normal { private set; get; }\n        public float Angle\n\
    \        {\n            return (float)Math.Atan2(this.Point2.Y - this.Point1.Y,\
    \ this.Point2.X - this.Point1.X);\n        }\n\n        public Line2D Shift(Vector\
    \ shift)\n        {\n            return new Line2D(this.Point1 + shift, this.Point2\
    \ + shift);\n        }\n    }\n```"
