  md: 'Part I The Basics


    Both Silverlight XNA allow manipulating bitmaps at the pixel level for generating
    bitmaps—or altering existing bitmaps—interactively or algorithmically. This chapter
    will focus more on the techniques of obtaining bitmaps from various sources, including
    the program itself, the Web, the phone''s built-in camera, and the phone''s photo
    library.


    # XNA Texture Drawing


    Because XNA 2D programming is almost entirely a process of moving sprites around
    the screen, you might expect that loading and drawing bitmaps in an XNA program
    is fairly easy, and you would be correct.


    The first project is called XnaLocalBitmap, so named because this bitmap will
    be stored as part of the project''s content. To add a new bitmap to the program''s
    content project, right-click the XnaLocalBitmapContent name, select Add and then
    New Item, and then Bitmap File. You can create the bitmap right in Visual Studio.


    Or, you can create the bitmap in an external program, as I did. Windows Paint
    is often convenient, so for this exercise I created the following bitmap with
    a dimension of 320 pixels wide and 160 pixels high:


    ![](img/d9347c1f55fa6d523479d2cd9b4d5459_80_0.png)


    I saved it this file as part of the program''s content, right-click the XnaLocalBitmapContent


    project in Visual Studio, select Add and Existing Item, and then navigate to the
    file. Once the file shows up, you can right-click it to display Properties, and
    you''ll see that it has an Asset Name of "Hello."


    The goal is to display this bitmap centered on the screen. Define a field in the
    Game1.cs file to store the Texture2D and another field for the position:'
