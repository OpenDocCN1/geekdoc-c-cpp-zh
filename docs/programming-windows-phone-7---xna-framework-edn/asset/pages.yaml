  md: "# 114 Part I The Basics\n\ncolor. You'll need to use the hardware Back button\
    \ on the phone to back up through these pages and finally terminate the application.\n\
    \nNavigate and GoBack are the basic methods of NavigationService, and it's unlikely\
    \ you'll need to use anything besides these for your applications. Keep in mind\
    \ that you're coding for a phone, and it doesn't make a lot of sense to have very\
    \ complex navigation schemes within your program without also some of reminding\
    \ the user how the current page was arrived at and how to unwind the process.\n\
    \nPerhaps the most important use of secondary pages in a Silverlight application\
    \ for the phone is to serve as dialog boxes. When a program needs some information\
    \ from the user, it navigates to a new page collection to contain. The user enters\
    \ the information, and then goes back to the main page.\n\n# Passing Data to Pages\n\
    \nThe possible use of pages as dialog boxes provokes two questions:\n\n+   - How\
    \ do I pass data from a source page to a destination page?\n- How do I return\
    \ data when going back to the original page?\n\nInterestingly, a facility is provided\
    \ specifically for the first item but not for the second. I'll show you this facility\
    \ and then look at more generalized solutions to the second problem.\n\nThe following\
    \ project is called SilverlightPassData. It is very much like the first project\
    \ in this chapter except that when MainPage navigates to SecondPage, it provides\
    \ SecondPage with its current background color, and SecondPage initializes itself\
    \ with that.\n\nHere's the content area of MainPage.xaml, the same as in the previous\
    \ program:\n\n```\nSilverlight Project: SilverlightPassData File: MainPage.xaml\
    \ (excerpt)\n<Grid x:Name=\"ContentPanel\" Grid.Row=\"1\" Margin=\"12,0,12,0\"\
    >\n    <TextBlock Text=\"Navigate to 2nd Page\"\n               HorizontalAlignment=\"\
    Center\"\n               VerticalAlignment=\"Center\"\n               Padding=\"\
    0 34\"\n               ManipulationStarted=\"OnManipulationStarted\" />\n</Grid>\n\
    ```\n\nI won't show you the OnManipulationStarted override because it's the same\
    \ as in the previous program, but the ManipulationStarted event handler for the\
    \ TextBlock is a bit enhanced."
