  md: '# Chapter 3


    # An Introduction to Touch


    For experienced Silverlight XNA programmers, Windows Phone 7 comes with a feature
    that is likely to be new and unusual. The screen on the phone is sensitive to
    touch. And not like old touch screens that basically mimic a mouse, or the tablet
    screens that recognize handwriting.


    The multi-touch screen on a Windows Phone 7 device can detect at least four simultaneous
    fingers. It is the interaction of these fingers that makes multi-touch so challenging
    for programmers. For this chapter, however, I have a less ambitious goal. I only
    want to introduce the touch interfaces in the context of sample programs that
    respond to simple taps.


    For testing multi-touch, an actual Windows Phone 7 device is essential. In the
    interim, the phone emulator will respond to mouse activity and convert it to touch
    input. If you run the emulator under Windows 7 with a multi-touch display and
    a Windows 7 driver, you can also use touch directly on the emulator.


    The programs in this chapter look much like the “Hello, Windows Phone 7!” programs
    in the first chapter, except that when you tap the text with your finger, it changes
    to a random color, and when you tap outside the area of the text, it goes back
    to white (whatever color the text was when the program started up).


    In a Silverlight program, touch input is obtained through events. In an XNA program,
    touch input comes through a static class polled during the Update method. One
    of the primary purposes of the XNA Update method is to check the state of touch
    input and make changes that affect what goes out to the screen during the Draw
    method.


    # Low-Level Touch Handling in XNA


    The multi-touch input device is referred to in XNA as a touch panel. You use methods
    in the static TouchPanel class to obtain this input. Although you can obtain gestures,
    let''s begin with the lower-level touch information.


    It is possible (although not necessary) to obtain information about the multi-touch
    device itself by calling the static TouchPanel.GetCapabilities method. The TouchPanelCapabilities
    object returned from this method has two properties:


    +   - IsConnected is true if the touch panel is available. For the phone, this
    will always be true.

    - MaximumTouchCount returns the number of touch points, at least 4 for the phone.'
