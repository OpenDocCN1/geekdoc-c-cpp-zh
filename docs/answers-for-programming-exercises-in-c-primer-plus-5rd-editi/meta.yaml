    \   printf(\"Here, in reverse order, are the values you entered:\\n\");\n    for\
    \ (i = SIZE - 1; i > 0; i--)\n        printf(\"%d \", vals[i]);\n    return 0;\n\
    }\n```\n\n## PE 6-12\n\n```c\n/* pe6-12.c */\n/* This version starts with the\
