    \ double res;\n\n    printf(\"Enter a pair of numbers: \");\n\n    while (scanf(\"\
    %lf %lf\", &n, &m) == 2) {\n        res = (n - m) / (n * m);\n        printf(\"\
    %.3f - %.3f / %.3f = %.5g\\n\", n, m, res);\n        printf(\"Enter next pair\
