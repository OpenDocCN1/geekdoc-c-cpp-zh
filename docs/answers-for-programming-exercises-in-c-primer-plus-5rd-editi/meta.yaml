    ```c\n/* pe6-1.c */\n/* this implementation assumes the character codes\n* are\
    \ sequential, as they are in ASCII. */\n#include <stdio.h>\n#define SIZE 26\n\
    int main(void )\n{\n    char lcase[SIZE];\n    int i;\n\n    for (i = 0; i < SIZE;\
    \ i++)\n        lcase[i] = 'a' + i;\n    for (i = 0; i < SIZE; i++)\n        printf(\"\
    %c\\n\", lcase[i]);\n\n    return 0;\n}\n```\n\n## PE 6-3\n\n```c\n/* pe6-3.c\
    \ */\n/* this implementation assumes the character codes\n* are sequential, as\
    \ they are in ASCII. */\n#include <stdio.h>\n\nint main( void )\n{\n    char let\
    \ = 'F';\n    char start;\n    char end;\n\n    for (end = let; end >= 'A'; end--)\n\
