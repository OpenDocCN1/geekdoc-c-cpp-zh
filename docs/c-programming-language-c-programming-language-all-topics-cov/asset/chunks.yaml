    a=300\n\nb=200\n\nIn base\n\na=400\n\n### **RUNTIME POLYMORPHISM USING VIRTUAL\
    \ FUNCTIONS**\n\n**Static & Dynamic Binding**\n\nPolymorphism means „one name‟\
    \ „multiple forms.\n\nThe overloaded member functions are „selected‟ for invoking\
    \ by matching arguments, both type and number. This information is known to the\
    \ compiler at the compile time and compiler is able to select the appropriate\
    \ function for a particular call at the compile time itself. This is called **Early\
    \ Binding** or **Static Binding** or **Static Linking**. Also known as **compile\
    \ time polymorphism**. Early binding means that an object is bound to its function\
    \ call at the compile time.\n\nIt would be nice if the appropriate member function\
