    \n}\n\nEnter A & B values in class sample_1:1 2 A=1\n\nB=2\n\nEnter A & B values\
    \ in class sample_1:1 2 3 4 Enter C & D values in class sample_2:A=1 B=2\n\nC=3\n\
    \nD=4\n\nSUM=10\n\ncout<<\"A=\"<<obj1.a<<endl; cout<<\"B=\"<<obj1.b<<endl; cout<<\"\
    C=\"<<c<<endl;\n\ncout<<\"D=\"<<d<<endl;\n\ncout<<\"SUM=\"<<sum<<endl;\n\n**UNIT\
    \ -3**\n\n**Constructors, Destructors, Inheritance:**\n\nIntroduction to Constructors,\
    \ Default Constructors,Parameterized Constructors, Copy Constructors Multiple\
    \ Constructors in a Class, Destructors.\n\n**Inheritance :**Introduction to inheritance,\
    \ Defining Derived Classes, Single Inheritance, Multiple Inheritance, Multi-Level\
    \ Inheritance, Hierarchical Inheritance, Hybrid Inheritance.\n\n### ^ Introduction\
    \ to Constructors: C++ provides a special member function called the [] constructor\
    \ which enables an object to initialize itself when it is created.^\n\n**Definition:**\
    \ A constructor is a special member function whose task is to initialize the objects\
    \ of its class. It is special because its name is the same name as the class name.\
    \ The constructor is invoked whenever an object of its associated class is created.\
    \ It is called constructor because it constructs the values of data members of\
    \ the class.\n\nA constructor is declared and defined as follows:\n\nclass integer\
    \ {\n\nint m,n; public:\n\ninteger( ); ……….. ………..\n\n};\n\ninteger :: integer(\
    \ )\n\n{\n\nm=0; n=0;\n\n}\n\nint main()\n\n{ integer obj1; ………..\n\n………..\n\n\
    }\n\n![](Images/image00080.jpeg)\n\ninteger obj1; => not only creates object obj1\
    \ but also initializes its data members m and n to zero. There is no need to write\
    \ any statement to invoke the constructor function.\n\n**CHARACTERISTICS OF CONSTRUCTOR**\n\
    \n ^ They should be declared in the public section.^(\n\n) They are invoked\
    \ automatically when the objects are created.^(\n\n) They do not have return\
    \ type, not even void.^(\n\n) They cannot be inherited, though a derived class\
    \ can call the base class constructor.^(\n\n) Like other c++ functions, they\
    \ can have default arguments.^() \n\n^( ) Constructors cannot be virtual.^()\n\
