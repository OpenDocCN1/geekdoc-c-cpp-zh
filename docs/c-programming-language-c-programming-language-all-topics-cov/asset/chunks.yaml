    cout<<"Data in object 2 is"<<endl; cout<<"b="<<y.b<<endl;


    }


    void swap(sample1 *x,sample2 *y) {


    int t;


    t=x->a;


    x->a=y->b;


    y->b=t;


    }


    int main()


    {


    sample1 obj1;


    sample2 obj2;


    obj1.getdata(5);


    obj2.getdata(15);


    cout<<"Before Swap of data between Two objects\n "; display(obj1,obj2);


    swap(&obj1,&obj2);


