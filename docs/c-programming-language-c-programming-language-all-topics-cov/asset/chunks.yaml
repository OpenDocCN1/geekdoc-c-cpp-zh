    FUNCTION TEMPLATES


    Like class template we can also define function templates that would be used to
    create a family of functions with different argument types.


    General Form:


    template <class T>


    return-type function-name (arguments of type T) {


    ………


    ………


    }


    #include<iostream.h>


    template<class T>


    void swap(T &x, T &y)


    {


    T temp = x;


    x=y;


    y=temp;


    }


    void fun(int m,int n,float a,float b)


    {


    cout<<m<<n;


    swap(m,n);


    cout<<m<<n;


    cout<<a<<b;


    swap(a,b);


    cout<<a<<b;


    }


    int main()


    {


    fun(100,200,11.22,33.44);


    return 0;


    }


