  raw: "corresponding data structures and procedures. The program is reusable and\
    \ more maintainable.\n\nThe important aspect in oop is a **class** which has similar\
    \ syntax that of structure.\n\n### **class**: It is a collection of data and member\
    \ functions that manipulate data. The data components of class are\n\ncalled data\
    \ members and functions that manipulate the data are called member functions.\n\
    \nIt can also called as blue print or prototype that defines the variables and\
    \ functions common to all objects of certain kind. It is also known as user defined\
    \ data type or ADT(abstract data type) A class is declared by the keyword **class**.\n\
    \nSyntax:class class_name\n\n{\n\nAccess specifier :\n\nVariable declarations;\n\
    \nAccess specifier :\n\nfunction declarations;\n\n};\n\n![](Images/image00077.jpeg)**Access\
    \ Control:\n\nAccess specifier or access modifiers** are the labels that specify\
    \ type of access given to members of a class. These are used for data hiding.\
    \ These are also called as visibility modes. There are three types of access specifiers\n\
    \n1.private\n\n2.public\n\n3.protected\n\n**1.Private:**\n\nIf the data members\
    \ are declared as private access then they cannot be accessed from other functions\
    \ outside the class. It can only be accessed by the functions declared within\
    \ the class. It is declared by the key word „**private**‟ .\n\n**2.public:**\n\
    \nIf the data members are declared public access then they can be accessed from\
    \ other functions out side the class. It is declared by the key word „**public**‟\
    \ .\n\n**3.protected:** The access level of protected declaration lies between\
    \ public and private. This access specifier is used at the time of inheritance\n\
    \nNote:\n\nIf no access specifier is specified then it is treated by default as\
    \ private The default access specifier of structure is public where as that of\
    \ a class is “private”\n\nExample:\n\nclass student\n\n{\n\nprivate : int roll;\n\
    \nchar name[30]; public:\n\nvoid get_data()\n\n{\n\ncout<<”Enter roll number and\
    \ name”: cin>>roll>>name;\n\n}\n\nvoid put_data()\n\n{\n\ncout<<”Roll number:”<<roll<<endl;\
    \ cout<<”Name :”<<name<<endl;\n\n}\n\n};\n\nObject:-Instance of a class is called\
    \ object. Syntax:\n\nclass_name object_name; Ex:\n\nstudent s;\n\n**Accessing\
    \ members**:-dot operator is used to access members of class\n\n**Object-name.function-name(actual\
    \ arguments);** Ex: s.get_data(); s.put_data();\n\n**Note:**\n\n1.If the access\
    \ specifier is not specified in the class the default access specifier is private\n\
    \n2.All member functions are to be declared as public if not they are not accessible\
    \ outside the class. Object:\n\nInstance of a class is called as object.\n\nSyntax:\n\
    \nClass_name object name;\n\nExample:\n\n**student s;**\n\nin the above example\
    \ s is the object. It is a real time entity that can be used\n\n**Write a program\
    \ to read data of a student**\n\n#include<iostream>\n\nusing namespace std;\n\n\
    class student\n\n{\n\nprivate:\n\nint roll;\n\nchar name[20];\n\npublic: void\
    \ getdata()\n\n{cout<<”Enter Roll number:”;\n\ncin>>roll;\n\ncout<<”Enter Name:”;\n\
    \ncin>>name;\n\n}\n\nvoid putdata()\n\n{ cout<<”Roll no:”<<roll<<endl;\n\ncout<<Name:”<<name<<endl;\n\
    \n}\n\n};\n\nint main()\n\n{\n\nstudent s;\n\ns.getdata();\n\ns.putdata();\n\n\
    returm 0;\n\n}\n\n### **Scope Resolution operator: Scope:**Visibility or availability\
    \ of a variable in a program is called as scope. There are two types of scope.\
    \ i)Local scope ii)Global scope **Local scope:** visibility of a variable is local\
    \ to the function in which it is declared. **Global scope:** visibility of a variable\
    \ to all functions of a program Scope resolution operator in **“::” .** This is\
    \ used to access global variables if same variables are declared as local and\
    \ global\n\n#include<iostream.h> int a=5; void main() { int a=1; cout<<”Local\
    \ a=”<<a<<endl; cout<<”Global a=”<<::a<<endl; }\n\n**Class Scope:**\n\nScope resolution\
    \ operator(::) is used to define a function outside a class.\n\n#include <iostream>\n\
    \nusing namespace std;\n\nclass sample\n\n{\n\npublic:\n\nvoid output(); //function\
    \ declaration\n\n};\n\n// function definition outside the\n\nclass void sample::output()\
    \ {\n\ncout << \"Function defined outside the class.\\n\";\n\n};\n\nint main()\
    \ { sample obj;\n\nobj.output(); return 0;\n\n}\n\nOutput of program:\n\nFunction\
    \ defined outside the class.\n\nWrite a program to find area of rectangle #include<iostream.h>\n\
    \nclass rectangle\n\n{\n\nint L,B;\n\npublic:\n\nvoid get_data(); void area();\
    \ };\n\nvoid rectangle::get_data() {\n\ncout<<”Enter Length of rectangle”; cin>>L;\n\
    \ncout<<”Enter breadth of rectangle”; cin>>B;\n\n}\n\nint rectangle::area()\n\n\
    {\n\nreturn L*B;\n\n}\n\nint main()\n\n{\n\nrectangle r;\n\nr.get_data();\n\n\
    cout<<”Area of rectangle is”<<r.area();\n\nreturn 0;\n\n}\n\n### **INLINE FUNCTIONS:**\n\
    \n**Definition:**\n\nAn inline function is a function that is expanded in line\
    \ when it is invoked. Inline expansion makes a program run faster because the\
    \ overhead of a function call and return is eliminated. It is defined by using\
    \ key word **“inline”**\n\n**Necessity of Inline Function:**\n\n^ One of the\
    \ objectives of using functions in a program is to save some memory space, which\
    \ becomes appreciable ^ when a function is likely to be called many times.^(\n\
    \n) Every time a function is called, it takes a lot of extra time in executing\
    \ a series of instructions for tasks such as jumping to the function, saving registers,\
    \ pushing arguments into the stack, and returning to the calling function.^(\n\
    \n) When a function is small, a substantial percentage of execution time may\
    \ be spent in such overheads. One solution to this problem is to use macro definitions,\
    \ known as macros. Preprocessor macros are [popular in C. The major drawback\
    \ with macros is that they are not really functions and]\n\n[] therefore, the\
    \ usual error checking does not occur during compilation.\n\nC++ has different\
    \ solution to this problem. To eliminate the cost of calls to small functions,\
    \ C++ proposes a new feature called inline function.^()\n\n**General Form:**\n\
    \ninline function-header {\n\nfunction body; }\n\nEg:\n\n#include<iostream.h>\n\
    \ninline float mul(float x, float y)\n\n{\n\nreturn (x*y);\n\n}\n\ninline double\
    \ div(double p, double q)\n\n{\n\nreturn (p/q);\n\n}\n\nint main()\n\n{\n\nfloat\
    \ a=12.345;\n\nfloat b=9.82;\n\ncout<<mul(a,b);\n\ncout<<div(a,b);\n\nreturn 0;\n\
    \n}\n\nProperties of inline function:\n\n1.Inline function sends request but not\
    \ a command to compiler\n\n2.Compiler my serve or ignore the request\n\n3.if function\
    \ has too many lines of code or if it has complicated logic then it is executed\
    \ as normal function\n\n^(**Situations where inline does not work:**  ) A function\
    \ that is returning value , if it contains switch ,loop or both then it is treated\
    \ as\n\n[ ] normal function.\n\n[] if a function is not returning any value\
    \ and it contains a return statement then it is treated as normal function^(\
    \ ) If function contains static variables then it is executed as normal function^()\n\
    \n### ^If the inline function is declared as recursive function then it is executed\
    \ as normal function.^()\n\n**Memory Allocation for Objects:** Memory for objects\
    \ is allocated when they are declared but not when class is defined. All objects\
    \ in a given class uses same member functions. The member functions are created\
    \ and placed in memory only once when they are defined in class definition\n\n\
    ![](Images/image00078.jpeg)\n\n### **STATIC CLASS MEMBERS**\n\nStatic Data Members\n\
    \nStatic Member Functions\n\n**Static Data Members:**\n\nA data member of a class\
    \ can be qualified as static. A static member variable has certain\n\nspecial\
    \ characteristics:[]\n\n### \n\n ^It is initialized to zero when the first\
    \ object of its class is created. No other initialization is permitted. ^ Only\
    \ one copy of that member is created for the entire class and is shared by all\
    \ the objects of that class, no matter how  \n\nmany objects are created.^()\n\
    \nIt is visible only within the class, but its lifetime is the entire program.\n\
    \n\n\n^ Static data member is defined by keyword**„static**‟^()\n\n### Syntax:\
    \ Data type class name::static_variable Name; Ex: int item::count;\n\n#include<iostream.h>\n\
    \n#include<conio.h>\n\nclass item\n\n{\n\nstatic int count; int number; public:\n\
    \nvoid getdata(int a) {\n\nnumber=a;"
