    ### **Loop control statements or repetitions:**


    A block or group of statements executed repeatedly until some condition is satisfied
    is called Loop. The group of statements enclosed within curly brace is called
    block or compound statement. We have two types of looping structures.


    One in which condition is tested before entering the statement block called entry
    control. The other in which condition is checked at exit called exit controlled
    loop.


    Loop statements can be divided into three categories as given below


    1.while loop statement


    2.do while loop statement


    3.for loop statement


