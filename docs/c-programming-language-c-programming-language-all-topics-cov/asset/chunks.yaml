    \nFunction Operator Virtual Overloading Overloading Functions\n\n**VIRTUAL FUNCTIONS**\n\
    \nPolymorphism refers to the property by which objects belonging to different\
    \ classes are able to respond to the same message, but different forms. An essential\
    \ requirement of polymorphism is therefore the ability to refer to objects without\
