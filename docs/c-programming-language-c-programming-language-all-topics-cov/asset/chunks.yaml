    { a=0;


    }


    fact (int i)


    {


    a=i;


    }


    fact operator!()


    {


    int f=1,i;


    fact t;


    for (i=1;i<=a;i++) {


    f=f*i; }


    t.a=f;


    return t;


    }


    void display()


    {


    cout<<”The factorial ”<< a; }


    };


    void main()


    {


    int x; cout<<”enter a number”; cin>>x;


    fact s(x),p;


    p=!s;


    p.display();


