    ### GENERIC PROGRAMMING(**Templates**)


    Generic programming is an approach where generic types are used as parameters
    in algorithms so that they work for a variety of suitable data types and data
    structures.


    A significant benefit of object oriented programming is reusability of code which
    eliminates redundant coding. An important feature of C++ called templates strengthens
    this benefit of OOP and provides great flexibility to the language. Templates
    support generic programming, which allows to develop reusable software components
    such as functions, classes etc.. supporting different data types in a single framework.


    Templates Concept


    Introduction


    Instead of writing different functions for the different data types, we can define
    common


    function. For example


    int max(int a,int b); // Returns maximum of two integers float


    max(float a,float b); // Return maximum of two floats char


    max(char a,char b); // Returns maximum of two characters


    (this is called as function overloading)


    But, instead of writing three different functions as above, C++ provided the facility
    called "Templates". With the help of templates you can define only one common
    function as follows:


    T max(T a,T b); // T is called generic data type


    Template functions are the way of making function/class abstracts by creating
    the behavior of function without knowing what data will be handled by a function.
    In a sense thisis what is known as “generic functions or programming”.


    Template function is more focused on the algorithmic thought rather than a specific
    means of single data type. For example you could make a templated stack push function.
    This push function can handle the insertion operation to a stack on any data type
    rather then having to create a stack push function for each different type.


    Syntax:


    template < class type >


    ret_type fun_name(parameter list)


    {


    --------------//body of function


    ---------------


    } //www.suhritsolutions.com


    Features of templates:


    1\. It eliminates redundant code


    2\. It enhances the reusability of the code.


    3\. It provides great flexibility to language Templates are classified into two
    types. They are


    1.Function templates


    2.Class Templates.


    Function Templates


    The templates declared for functions are called as function templates. A function
    template defines how an individual function can be constructed.


    Syntax :


    template < class type,………>


    ret _type fun_ name(arguments)


    {


    -----------------// body of the function


    ----------------


    }


    CLASS TEMPLATES


    The templates declared for classes are called class templates. A class template
    specifies how individual classes can be constructed similar to the normal class
    specification. These classes model a generic class which support similar operations
    for different data types. General Form of a Class Template


    template <class T> class class-name {


    …….


    …….


    };


    A class created from a class template is called a template class. The syntax for
    defining an object of a template class is:


    classname<type> objectname(arglist);


