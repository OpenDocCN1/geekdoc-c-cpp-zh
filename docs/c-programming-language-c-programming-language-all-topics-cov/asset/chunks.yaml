  raw: 'When a function is made virtual, C++ determines which function to use at runtime
    based on the type of object pointed to by the base pointer, rather than the type
    of the pointer. Thus, by making the base pointer to point to different objects,
    we can execute different versions of the virtual function.


    #include<iostream.h>


    class Base


    {


    public:


    void display()


    {


    cout<<”Display Base”;


    }


    virtual void show()


    {


    cout<<”Show Base”;


    }


    };


    class Derived : public Base


    {


    public:


    void display()


    {


    cout<<”Display Derived”;


    }


    void show()


    {


    cout<<”show derived”;


    }


    };


    void main()


    {


    Base b;


    Derived d;


    Base *ptr;


    cout<<”ptr points to Base”; ptr=&b;


    ptr->display(); //calls Base ptr->show(); //calls Base cout<<”ptr points to derived”;
    ptr=&d;


    ptr->display(); //calls Base ptr->show(); //class Derived }


    Output:


    ptr points to Base Display Base Show Base


    ptr points to Derived


    Display Base


    Show Derived


    When ptr is made to point to the object d, the statement ptr->display(); calls
    only the function associated with the Base i.e.. Base::display()


    where as the statement


    ptr->show();


    calls the derived version of show(). This is because the function display() has
    not been made virtual in the Base class.


    **Rules For Virtual Functions:**


    When virtual functions are created for implementing late binding, observe some
    basic rules that satisfy the compiler requirements.


    1\. The virtual functions must be members of some class.


    2\. They cannot be static members.


    3\. They are accessed by using object pointers.


    4\. A virtual function can be a friend of another class.


    5\. A virtual function in a base class must be defined, even though it may not
    be used.


    6\. The prototypes of the base class version of a virtual function and all the
    derived class versions must be identical. C++ considers them as overloaded functions,
    and the virtual function mechanism is ignored.


    7\. We cannot have virtual constructors, but we can have virtual destructors.


    8\. While a base pointer points to any type of the derived object, the reverse
    is not true. i.e. we cannot use a pointer to a derived class to access an object
    of the base class type.


    9\. When a base pointer points to a derived class, incrementing or decrementing
    it will not make it to point to the next object of the derived class. It is incremented
    or decremented only relative to its base type. Therefore we should not use this
    method to move the pointer to the next object.


    10\. If a virtual function is defined in the base class, it need not be necessarily
    redefined in the derived class. In such cases, calls will invoke the base function.


    **OVERLOADING**


    **OPERATOR OVERLOADING**


    C++ has the ability to provide the operators with as special meaning for a data
    type. The mechanism of giving such special meanings to an operator is known as
    operator overloading. We can overload all the operators except the following:


    Class member access operato r (“.” And ”


    .*”) Scope resolution operator **“::”**


    Size operator (sizeof)


    Conditional operator


    To define an additional task to an operator, specify what it means in relation
    to the class to which the operator is applied. This is done with the help of a
    special function, **called operator function.** The process of overloading involves
    following steps:


    1\. Create a class that defines the data type that is to be used in the overloading
    operation.


    2\. Declare the operator function **operator op()** in the public part of the
    class. It may be a member function or a friend function.


    3\. Here op is the operator to be overloaded.


    4. Define the operator function to implement the required operations.


    General Form:


    return-type classname :: operator op(arglist) {


    Function body


    }


    ![](Images/image00090.gif)


    Ex:


    complex complex::operator+(complex c)


    {


    complex t;


    t.real=real+c.real;


    t.img=img+c.img;


    return t;


    }


    **Concept of Operator Overloading**


    One of the unique features of C++ is Operator Overloading. Applying overloading
    to operators means,


    same operator in responding different manner. For example operator + can be used
    as concatenate


    operator as well as additional operator.


    That is 2+3 means 5 (addition), where as


    "2"+"3" means 23 (concatenation).


    Performing many actions with a single operator is operator overloading. We can
    assign a user defined function to an operator. We can change function of an operator,
    but it is not recommedned to change the actual functions of operator. We can''t
    create new operators using this operatorloading. Operator overloading concept
    can be applied in following two major areas (Benefits)


    1\. Extension of usage of operators


    2\. Data conversions


    **Rules to be followed for operator overloading:**


    1.Only existing operators can be overloaded.


    2.Overloaded operators must have at least one operand that is of user defined
    operators


    3.We cannot change basic meaning of an operator.


    4.Overloaded operator must follow minimum characteristics that of original operator


    5.When using binary operator overloading through member function, the left hand
    operand must be an object of relevant class


    The number of arguments in the overloaded operator‟ s arguments list depends


    1\. Operator function must be either member function or friend function.


    2\. If operator function is a friend function then it will have one argument for
    unary operator & two arguments for binary operator


    3\. If operator function is a member function then it will have Zero argument
    for unary operator & one arguments for binary operator


    **Unary Operator Overloading**


    An unary operator means, an operator which works on single operand. For example,
    ++ is an unary operator, it takess single operand (c++). So, when overloading
    an unary operator, it takes no argument (because object itself is considered as
    argument).


    **Syntax for Unary Operator (Inside a class)**


    return-type operator operatorsymbol( ) {


    //body of the function


    }


    Ex:


    void operator-() {


    real=-real;


    img=-img;


    }


    **Syntax for Unary Operator (Outside a class)**


    return-type classname::operator operatorsymbol( )


    {


    //body of the function


    }


    Example 1:


    void operator++() {


    counter++; }


    Example 2:


    void complex::operator-() {


    real=-real;


    img=-img;


    }


