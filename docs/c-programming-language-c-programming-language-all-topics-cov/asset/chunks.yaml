    **INHERITANCE:** . The mechanism of deriving a new class from an old one is called
    **inheritance** or


    **derivation**. The old class is referred to as the **base class** and the new
    one is called the **derived class** or **sub class**. The derived class inherits
    some or all of the traits from the base class.


    A class can also inherit properties from more than one class or from more than
    one level.Reusability is an important feature of OOP


    A derived class can be defined by specifying its relationship with the base class
    in addition to its own details.


    ### class derived-class-name : visibility-mode base-class-name { ……… ………


    }


    ![](Images/image00081.jpeg)


    The **colon** indicates that the derived class name is derived from the base-class-name.
    the visibility mode is optional and if present, may be either **private or protected
    or public.** The default is private. Visibility mode specifies whether the features
    of the base class are privately derived or publicly derived.


    class ABC : private XYZ //private derivation


    {


    members of ABC;


    };


    class ABC:public XYZ {


    members of ABC; };


    //public derivation


    class ABC:protected XYZ {


    // protected derivation members of ABC;


    };


    class ABC:XYZ //private by default {


    members of ABC;


    };


    When a base class is **privately inherited** by a derived class, public members
    of the base class can only be accessed by the member functions of the derived
    class.private membes of base class are inaccessible to the objects of the derived
    class


    When a base class is **protected inherited** by a derived class, public members
    of the base class can only be accessed by the member functions of the derived
    class.private membes of base class are inaccessible to the objects of the derived
    class. If private members of base class are to be inherited to derived class then
    declare them as protected


    When the base class is **publicly inherited**, public members of the base class
    is publicly inherited, public members of the base class become public members
    of the derived class and therefore they are accessible to the objects of the derived
    class. In both the cases, the private members are not inherited and therefore,
    the private members of a base class will never become the members of its derived
    class


    In inheritance, some of the base class data elements and member functions are
    „inherited‟ into the derived class. We can add our own data and member functions
    and thus extend the functionality of the base class. Inheritance, when used to
    modify and extend the capability of the existing classes, becomes a very powerful
    tool for incremental program development


    ![](Images/image00082.jpeg)


    Types of Inheritance:


    1.Single Inheritance


    2.Multi level Inheritance


    3.Mutiple Inheritance


    4.Hybrid inheritance


    5\. Hierarchical Inheritance.


