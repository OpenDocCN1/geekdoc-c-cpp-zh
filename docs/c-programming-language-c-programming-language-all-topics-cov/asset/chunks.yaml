    **Objects as Function Arguments:** Objects can be used as arguments to


    functions This can be done in three ways


    a. Pass-by-value or call by value


    b. Pass-by-address or call by address


    c. Pass-by-reference or call by reference


    **a.Pass-by-value** – A copy of object (actual object) is sent to function and
    assigned to the object of called function (formal object). Both actual and formal
    copies of objects are stored at different memory locations. Hence, changes made
    in formal object are not reflected to actual object. write a program to swap values
    of two objects


    **write a program to swap values of two objects**


    #include<iostream.h>


    using namespace std;


    class sample2;


    class sample1


    {


    int a;


