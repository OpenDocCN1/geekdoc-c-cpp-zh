- fmt: "\n# Friend Functions and Classes\n\nA friend function possesses certain special\
    \ characteristics:\n\n- It is not in the scope of the class to which it has been\
    \ declared as `friend`.\n- Since it is not in the scope of the class, it cannot\
    \ be called using the object of that class. It can be invoked like a normal function\
    \ without the help of any object.\n- Unlike member functions, it cannot access\
    \ the member names directly and has to use an object name and dot membership operator\
    \ with each member name.\n- It can be declared either in `public` or `private`\
    \ part of a class without affecting its meaning.\n- Usually, it has objects as\
    \ arguments.\n\n```\n#include<iostream.h>\n\nclass sample\n{\n    int a;\n   \
    \ int b;\npublic:\n    void setvalue()\n    {\n        a=25;\n        b=40;\n\
    \    }\nfriend float mean(sample s);\nfloat mean(sample s)  \n{\nreturn float(s.a+s.b)/2.0;\
