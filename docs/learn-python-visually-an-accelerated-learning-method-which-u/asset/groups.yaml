    \ Image\n>>> im = Image.open(\"image.jpg\")\n```\n\nGet a list of pixels from:\n\
    \n```python\n>>> from urllib.request import urlopen\n>>> response = urlopen(\"\
    http://a/b/c\")\n>>> data = response.read()\n```\n\nNote that \"response\" is\
    \ a file-like object, which points at the remote resource.\n\n# Image Processing\
    \ (PIL)\n\nThe Python Imaging Library (PIL) adds image processing capabilities\
    \ to Python. You can use this library to create thumbnails, convert between file\
    \ formats, print images, etc.\nLoad an image from a file:\n\n```python\n>>> import\
    \ Image\n>>> im = Image.open(\"image.jpg\")\n```\n\nGet a list of pixels from:\n\
    \n```python\n>>> from urllib.request import urlopen\n>>> response = urlopen(\"\
    http://a/b/c\")\n>>> data = response.read()\n```\n\nNote that \"response\" is\
    \ a file-like object, which points at the remote resource.\n\n# Directory cleanup\n\
    \nLet's imagine that you need to clean up directory and remove all files before\
    \ 2002. Each file within this directory is a text document (.txt) whose first\
    \ line is a date (yyyy-mm-dd).\n\n```python\nimport os\nimport time\ncount = 0\n\
    kept = 0\ndeleted = 0\nfor (root, dirs, files) in os.walk('.'):\n    for filename\
    \ in files:\n        if filename.endswith('.txt'):\n            f = open(filename,\
    \ 'r')\n            sdate = f.readline()\n            f.close()\n            pdate\
    \ = time.strptime(sdate, '%Y-%m-%d')\n            if pdate.tm_year > 2002:\n \
    \               kept += 1\n            else:\n                os.remove(filename)\n\
    \                deleted += 1\n            count += 1\nprint('Total files: ' +\
    \ str(count))\nprint('Kept: ' + str(kept))\nprint('Deleted: ' + str(deleted))\n\
    ```\n\nThe code above does the following 4 things:\n\n- 1. Imports the necessary\
    \ modules.\n2. Uses the “walk” method to navigate the current directory. For each\
    \ text file in our directory:\n   a. Open file\n   b. Read date using f.readline()\n\
    \   c. Convert string date into Python object\n   d. If date is before 2002 the\
    \ file is deleted\n3. Keep count of the number of deleted files and display this\
    \ number at the end.\n\n# Quiz\n\nPROBLEM: Why and when would you want to automate\
    \ a task?\nIf doc1.pdf is a PDF document whose first page is blank, what does\
    \ the following code print out?\n\n```python\nimport slate\nf = open('doc1.pdf')\n\
