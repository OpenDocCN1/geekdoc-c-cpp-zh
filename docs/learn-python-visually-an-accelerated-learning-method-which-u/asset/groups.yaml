    # 文件操作


    大多数文件操作都可以归结为：打开文件、读取文件、向文件写入数据以及关闭文件。通常，你写入文件中的数据是文本格式。

    假设你想将一个整数列表写入文件，使得每个整数单独占一行。首先，打开文件：


    ```python

    the_file = open("integers.txt", "w")

    ```


    ```python

    1. integers = [1, 2, 3, 4, 5]

    2. for integer in integers:

    3. the_file.write(str(integer) + "\n")

    ```


    "write" 方法接受字符串作为参数并将其写入文件。

    注意 `\n` 符号 - 它在文件中开始一个新行。当你完成对文件的操作后，必须关闭它：


    ```python

    1. the_file.close()

    ```


    你也可以从文件中读取数据。

    首先，在不使用“w”标记的情况下打开文件：


    ```python

    1. the_file = open("integers.txt")

    ```


    从文件中获取所有行：


    ```python

    1. lines = the_file.readlines()

    ```


    readlines() 函数将文件中的所有行作为字符串列表返回。

    让我们打印出这些行：


    ```python

    1. for line in lines:

    2. print(line)

    ```


    执行上述代码后，你将在屏幕上看到以下内容：


    ```

    1

    2

    3

    4

    5

    ```


    和写入文件一样，完成后也别忘了关闭它：


    - 1. the_file.close()


    # 测验


    问题：


    - 1. 换行符看起来是什么样的？

    2. 在完成文件操作后，你应该对文件做什么？

    3. 使用什么方法将数据放入文件中？

    4. 你应该使用哪种方法获取文件中的所有行？


    答案：


    - 1. \n

    2. 关闭它

    3. write

    4. readlines


    # 异常


    有时会发生意料之外的情况，导致程序无法按预期执行。这些事件被称为“异常”。


    ```python

    >>> 1 / 0

    ```


    按下回车键后，你将看到以下输出：


    ```

    Traceback (most recent call last):

    File "<html>", line 1, in <module>

    ZeroDivisionError: division by zero

    ```


    这被称为异常回溯（traceback）。它显示了在异常发生之前调用了哪些函数或方法。最后一行告诉你抛出了哪种异常，并提供了一些额外的、人类可读的信息。

    在 Python 中，你可以通过 `try/except` 块来实现这一点。

    如果在重要任务执行过程中发生了异常怎么办？

    让我们打印“division by zero. But it is totally fine.”，而不是直接抛出回溯。


    ```python

    1. try:

    2. 1 / 0

    3. except ZeroDivisionError as e:

    4. print(str(e) + "But it is totally fine.")

    ```


    在上面的代码中，你可以看到想要尝试执行的语句放在 `try` 块中。所有的错误处理代码都放在 `except` 下。`except` 关键字必须伴随一个异常类。它还可以跟一个
    `as` 关键字和一个变量，该变量用于存储对错误的人类可读描述。


    # 自定义异常


    你可以定义自己的异常类，以进一步通知代码内部发生了异常情况：


    ```python

    1. class YourException(Exception):

    2. pass

    ```


    所有自定义异常必须必须有一个内置的 Python 异常作为父类。

    异常不需要实现任何其他逻辑。

    为了抛出异常，你应该使用 `raise` 关键字：


    ```python

    1. raise YourException("Human-readable message")

    ```


    执行上述代码后，你将看到一个带有“Human-readable message”字符串的回溯。

    处理自定义异常与处理内置异常是类似的：


    ```python

    1. try:

    2. raise YourException("Human-readable message")

    3. except YourException as e:

    4. print("Your exception occured with message: " + str(e))

    ```


    # 测验


    问题：


    - 1. 什么块用于处理异常？

    2. 异常发生时，打印的长文本名称是什么？


    答案：


    - 1. try/except block

    2. traceback


