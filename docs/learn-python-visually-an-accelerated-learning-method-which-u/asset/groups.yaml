    # Regular Expressions


    This table shows the most frequently-used symbols.


    | Symbol | Description |

    | --- | --- |

    | . | Any character |

    | \" | Double quote character |

    | '' | Single quote character |

    | \ | Backslash |

    | \t | Tab character |

    | \n | New line character |

    | [0-9] | Any digit from 0 to 9 inclusively |

    | [^0-9] | Any character that is not a digit |

    | [a-z] | Any lowercase letter |

    | [^a-z] | Any character that is not a lowercase letter |

    | [a-zA-Z0-9_] | Any digit, any letter or an underscore |


    As you can see, some symbols start with a backslash. These symbols are escape
    sequences and represent things that can''t be described otherwise or are reserved
    characters.


    Now let''s to compose patterns that combine both symbols and cardinalities.


    One or more digit: [0-9]+


    An optional number that does not start with zero: ([1-9]{1}[0-9]+)

    Parentheses let you combine multiple symbols into symbol groups and apply cardinalities
    to the whole groups. You may rephrase the regular expression mentioned above the
    following way: zero or one number that begins with exactly one digit that is not
    zero and multiple arbitrary digits afterwards.


    A string that may contain any lowercase letter but can''t be preceded with an
    underscore [_][a-z]*


    In order to replace the first occurrence of a substring with another value you
    ought to use re.sub function. Replace dolor BLA BLA amet amet with foobar the
    following way:


    ```

    re.sub("dolor.*amet", "foobar", lorem_text)

    ```'
