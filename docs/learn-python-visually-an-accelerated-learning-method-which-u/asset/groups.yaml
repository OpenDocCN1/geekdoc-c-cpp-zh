    # SQL


    To illustrate the meaning of referential integrity it is the best to have a look
    at the following real life example.


    If a student were to leave a school to attend another school, their name must
    be removed from the register in all of their classes. Similarly, if you want to
    remove an item from a relational database, you must also remove all references
    to it in the database.


    The process of removing students from respective courses whenever they change
    school in the context of relational database is called referential integrity management.
    Foreign key constraints tell you which columns contain references to other places
    in the database.


    There are dozens of other constraints. And even though they won''t be covered
    in this chapter the ones that were already briefly introduced are enough to get
    a reasonable understanding about how relational databases behave.


    The last thing you need to know about before we move on is Structured Query Language
    (SQL). SQL is a programming language data specifically used for declaring database
    constraints, and for manipulating data (i.e. listing, viewing, creating, updating,
    or deleting data).'
