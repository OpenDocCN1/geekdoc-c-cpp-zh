    # Classes and objects


    One of the key principles of object-oriented programming is encapsulation - hiding
    the details of the inner workings of the system, so that the user doesn''t need
    to know how it works in order to use it. The part of the program that the user
    interacts with is called the “interface”.


    Just as the driver of a car needs like a steering wheel and a gas pedal to use
    the car’s capabilities, users of your code need to use syntax constructs called
    methods.


    Here, we have implemented a car in Python:


    ```

    1. class Car:

    2. def turn_left(self):

    3.     pass

    4. def turn_right(self):

    5.     pass

    6. def accelerate(self):

    7.     pass

    8. def slow_down(self):

    9.     pass

    10. def open_a_window(self):

    11.    pass

    ```


    In the code above, we have created a class. A class is an entity that has specific
    behaviours. These behaviours take the form of methods, which are the same as the
    functions we have used previously, and are indented in the same way. The methods
    of a class are given the class (“self”) as their first parameter. The “pass” keyword
    tells Python that this code block does nothing.


    There are a variety of different cars that this class could represent - BMW, Mercedes,
    Audi, Fiat, Tesla, and many others. Let’s create a car with some parameters.


    ```

