    # import 语句、模块和包


    正如你所看到的，Python 中的所有源代码存储在称为模块（modules）的文件中。每个模块都有 .py 扩展。不同的模块在逻辑上组合成包（packages）。包是一个带有
    `__init__.py` 的文件夹。例如，以下是一个包：


    ```

    foobar/

    __init__.py

    one.py

    two.py

    three.py

    ```


    而不是：


    ```

    foobar/

    one.py

    three.py

    ```


    默认安装带有大量的包。这些包被称为标准库（standard library）。


    # import 语句


    如果你想使用存储另一个包中的功能，必须使用 `import` 语句。让我们在屏幕上打印你的名称：


    ```python

    >>> import os

    >>> os.path

    ```


    上面的片段显示了如何导入顶层包。通过点运算符访问包的成员。你可以通过直接导入来避免使用点运算符：


    ```python

    >>> from os import path

    >>> path()

    ```


    要指定来源，必须使用 `from`。有时你可能从同一个包导入多个实体。在这种情况下，直接导入所有实体更简单：


    ```python

    >>> from os import sys

    ```


    注意，包内部的实体可以是任何构造：类、函数甚至是包（嵌套包是可能的）。


    # 测验


    问题：


    1. Python 源文件的别名是什么？

    2. 带有包的术语是什么？

    3. 默认安装的包集合名称是什么？

    4. 如何从 os 导入 path？


    答案：


    1. module

    2. package

    3. standard library

    4. from os import path


