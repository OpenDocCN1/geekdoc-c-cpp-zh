    # Functions


    We talked before about how reusability is a key principle of software engineering.
    Once you''ve written some code, you''ll want to store it so you can use it again
    without having to copy and paste.


    This is what functions are for! Functions are a way to wrap up your code so it
    can be used again by calling an easy shortcut.


    Let''s say you want to be able to print “Hello Mr. Jones! How are you today?”
    three times in a row without any code duplication. This can be achieved in the
    following way:


    ```

    1. def hi():

    2.     print("Hello Mr. Jones! How are you today?")

    3.     hi()

    4.     hi()

    5.     hi()

    ```'
