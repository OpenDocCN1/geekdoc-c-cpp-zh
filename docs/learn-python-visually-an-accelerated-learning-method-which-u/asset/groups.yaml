    If you head over to https://www.python.org/downloads/ you can select the right
    installation method for your operating system. Most Linux systems come with Python
    pre-installed.


    Version 3 of Python is used in this book.

    In Windows, once you have installed Python, select Python IDLE or Python command
    line/console from the Start menu or screen.


    The difference between the IDLE and the console is that the IDLE has a graphical
    interface, which looks similar to a text editor. In Linux, UNIX, and OS X, you
    can launch Python emulator from command line by typing Python.


    To choose a specific version of Python type PythonX where X is the version number
    (e.g. "Python3" for version 3).


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_9_0.png)'
