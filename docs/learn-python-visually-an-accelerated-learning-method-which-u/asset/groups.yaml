    # About this book


    THE PROBLEM


    People cannot be blamed for thinking programming is hard when trying it out for
    the first time. Learning to programming is like learning a new language.


    A number of rules and grammar syntax guidelines exist to follow. It also requires
    memorizing a bevy of glossary terms for each language, and unless a person works
    with programming at least 8 hours a day, the person is unlikely to become very
    familiar with programming quickly; at least, that has been the situation for years
    until now.


    Our approach involves teaching programming concepts via simple illustrations.


    The visual approach works because it is one of the most fundamental ways of learning.
    Everyone as a baby and toddler learns the world around them via sight and sound
    long before there is comprehension associated with letters and meanings.


    Programming works in modules and building blocks. As a person learns a few basic
    modules and steps, he can learn to build more complex modules on those first basic
    units.


    It''s a building block approach where bigger structures can be coded once the
    basic modules are mastered. I start with a set of basic building blocks that are
    easy to learn through illustrations and metaphors.


    From there, a user can apply multiple variations and build further. However, the
    initial set of building blocks becomes a Rosetta stone of sorts, allowing a user
    to program and build in any situation going forward.'
