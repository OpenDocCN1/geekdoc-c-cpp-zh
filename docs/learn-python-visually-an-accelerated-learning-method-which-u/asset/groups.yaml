    # # Regular Expressions


    Although you can use the "in" operator to check if a substring is present within
    a string, it doesn''t tell you where the substring is located, nor does it let
    you match the substring non-precisely.


    Take this string:


    ```

    >>> lorem_text = "Lorem Ipsum dolor sit amet, consectetur

    adispiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."

    ```


    If you want to find out this text contains something like "dolor BLA BLA amet"
    - the words "dolor" and "amet" in that order, with any amount of text in between.


    To do this, you can use the re.search method:


    ```

    >>> import re

    >>> found = re.search("dolor.* amet", lorem_text)

    >>> found

    <_sre.RE_Match object; span=(12, 26), match=''dolor sit amet''>

    ```


    The "search" function takes a regular expression pattern as its first argument,
    and the text to be searched as its second argument.


    The regular expression pattern is a flexible description of what you''re looking
    for in the text. The format is covered later in this chapter.


    Look at the return value of the search function: it''s called a MatchObject, and
    it tells you where the substring was found in the original.


    If the pattern can''t be found, the function returns None:


    ```

    >>> match = re.search("found", lorem_text)

    >>> type(match)

    <class ''NoneType''>

    ```


    If you want to start and end indices of the substring from the match object:


    ```

    >>> found.start()

    12

    >>> found.end()

    26

    ```


    and access the substring matched by the pattern:


    ```

    >>> found.group()

    ''dolor sit amet''

    >>> lorem_text[12:26]

    ''dolor sit amet''

    ```


    Note: if multiple occurrences of the pattern are found, only the first one is
    returned. If you need to go through all of the occurrences, use the re.finditer
    function:


    ```

    >>> list(re.finditer("dolor.* amet", lorem_text))

    [<_sre.RE_Match object; span=(12, 26), match=''dolor sit amet''>]

    ```


    If you want to find all matches a certain pattern, you should use the re.match'
