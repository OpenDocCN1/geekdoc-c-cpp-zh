    \n```python\n1. @app.route('/data', methods=['GET'])\n2. def show_data():\n3.\
    \     ...\n4. @app.route('/data', methods=['POST'])\n5. def handle_data():\n6.\
    \     ...\n7. @app.route('/user/<username>')\n8. def greet_user(username):\n9.\
    \     return \"Hello \" + username\n```\n\nYou can use sections of the webpage’s\
    \ URL as a variable in your function.\n\n```python\n1. import json\n2. from flask\
    \ import make_response, Flask\n3. app = Flask(__name__)\n4. @app.route('/json')\n\
    5. def get_image():\n6.     # Create response\n7.     response = make_response(json.dumps({\"\
    foo\": \"bar\"}))\n8.     # Set correct mimetype\n9.     response.mimetype = \"\
    application/json\"\n10.    return response\n11. if __name__ == \"__main__\":\n\
    12.     app.run(debug=True)\n```\n\nUntil now, all of the pages would return simple\
    \ text.\nFlask would automatically transform this string into an HTTP response,\
    \ and would give it the mimetype \"text/html\" along with a status code 200.\n\
    Now let's modify this behavior.\nThis code returns a JSON object.\nWe can also\
    \ change the error code:\n\n```python\n1. ...\n2. @app.route(\"/error\")\n3. def\
    \ error_page():\n4.     response = make_response(\"Error Page\")\n5.     response.status_code\
    \ = 404\n6.     return response\n7. ...\n```\n\n# Quiz\n\nPROBLEM:\n\n- 1. What\
    \ is Flask and what should you use it for?\n2. Why is Flask called a microframework?\n\
    3. What is the default port for the Flask integrated HTTP server?\n4. Can you\
