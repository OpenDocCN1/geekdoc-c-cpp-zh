    # # Comments


    Writing comments on Python code is rather simple.

    There are two ways to write Python comments, single line comments, and multiple
    line comments.


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_38_0.png)


    Comments are intended to help the user to understand the code, and are ignored
    by the interpreter.

    Single line comments are created by adding the # character to the beginning. They
    are useful for adding small comments at the beginning of functions.


    +   1. # This is a valid single line comment.


    You can also add inline comments after a line of code, which can be useful for
    clarifying statements.


    ```

    1. print("Hello there!") # This would be an inline comment in Python

    2. # This is another.

    ```'
