    # Basic Math


    Python has a bunch of built-in arithmetic operators. The table below provides
    a brief comparison of the short notations and their equivalents.

    Assume that initially the following is true: a = 3.


    | Operation name | Short notation | Long notation | Value of a | Comment |

    | :--- | :--- | :--- | :--- | :--- |

    | Addition | a += 1 | a = a + 1 | 4 | |

    | Subtraction | a -= 1 | a = - 1 | 2 | |

    | Multiplication | a *= 2 | a = * 2 | 6 | |

    | Division | a /= 2 | a = / 2 | 1.5 | Returns decimal values or float numbers
    |

    | Modulo | a %= 2 | a = % 2 | 1 | Returns an integer remainder of a division |

    | Exponent | a **= 2 | a = ** 2 | 9 | Similar to a^2 in regular maths |

    | Floor division | a //= 2 | a = // 2 | 1 | Returns only decimal (int) values
    |

    | Negation | a = -a | a = -a | -3 | Returns the same value with an opposite sign
    |


    Finding the square root of a number is also easy in Python, but it''s not a built-in
    language feature. You''ll find out about it in the book!

    You can calculate the absolute value of a digit (e.g. |-3|), using abs(). For
    example, abs(-3) returns 3.


    # Operators of precedence


    The order of execution of mathematical operations in Python is similar to the
    order used in conventional mathematics.

    In maths there are three general priority levels:


    1. exponents and roots

    2. multiplication, division and modulus

    3. addition and subtraction


    Exponents and roots are represented by functions of a standard library in Python
    and are covered further on in this book.


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_23_0.png)


    All other priority levels have their own built-in Python operators.

    High order operations are performed before the lower ones. All the operations
    of the same order are executed one by one from left to right.


    For example, the statement: 2 + 3 * 4 - 1 returns 13. The multiplication is performed
    before the addition and subtraction.


    In order to affect the order of operator execution, you should use parentheses
    (). For example, (3 + 6) * 2 equals 18 and 8 / (1 + 1) equals 4.


    # Code Samples


    The code snippet below shows how simple maths operations are processed in the
    Python interpreter.


    ```

    >>> 13 * 2

    26

    >>> 10 - 32

    22

    >>> 11 % 10

    1

    >>> 6 ** 2

    36

    >>> 12 / 8

    1.5

    >>> 12 % 8

    12

    >>> -- -16

    22

    >>> a = 16

    >>> a += 3

    19

    >>> a = 4

    >>> b = 6

    >>> a *= b

    24

    ```


