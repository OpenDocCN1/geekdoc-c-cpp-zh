    Inside the parentheses is the argument list, which in this case is completely
    empty. After the function, the code block has to be indented to define it as a
    nested block.

    There are two Python conventions you should stick to: use four spaces to indent
    your code blocks, and use only lowercase letters and underscores in function names.

