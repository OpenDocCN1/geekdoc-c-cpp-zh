    # # Hello World!


    Most of the time you write Python code, you will be writing the script in the
    IDE or any other IDE like Eclipse or rich text editor like Sublime text or Notepad++.
    However, you can use the Python interpreter to write code interactively as it
    acts like a UNIX shell, Even though it is possible to create programs using just
    the interpreter it is strongly recommended not to do so since it is hard to save
    the code as a script for further reuse. Rather consider the interpreter as "on
    the fly" testing tool for your coding ideas. Now lets make the interpreter output
    "Hello World!" string on the screen. Lets do it via the interpreter.


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_10_0.png)'
  - '[PAGE 11]


    # Terminal way


    Launch the interpreter from command line using Python command as it was described
    in the previous chapter.


    Type the following: `print("Hello world!")` and hit “Enter”.


    The terminal shall look like the following way:


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_11_0.png)


    In the code snippet above you you can see that the first line starts with >>>.
    This symbol indicates the line where you provide dynamic input to the interpreter.
    Notice, as soon as the result of your first command was printed on the screen
    the interpreter printed >>> again. Giving instructions to the interpreter is sequential.
    You give one instruction - wait till execution finishes, you enter another command
    and so on.


    Note, further on in this book if you spot >>> symbol in a code snippet it shall
    mean that you are expected to test the code in the interpreter yourself.


    On the first line you entered a statement. The statement is nothing else but an
    instruction for a computer to perform some task. The task could be anything from
    make_a_coffee to launch_a_rocket. In your case it is a simple print function though.
    Functions will be covered further in this book.'
- md: '

    # Scripting Way


    One of the main principles of software engineering is reusability.

    Let''s make the code that was just tested in the interpreter reusable.

    To do so, create a file called "hello_world.py" and type the following text inside:


    ```

    1. print("Hello World!")

    ```


    What you placed into the file is exactly the line that was previously executed
    via the interpreter.

    Now lets execute the script that you wrote.

    Open the command line, navigate to the location where the script resides and type
    the following: python hello_world.py. After you hit enter you shall see that a
    “Hello World!” text was placed on the screen.

    Congratulations!

    You''ve managed to write your first Python program and successfully launch it.


    # Part I: Built-in language features


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_14_0.png)


    # MEMORY


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_15_0.png)


    lets change the value of b from 11 to 8


    # MEMORY


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_15_1.png)


    a = 23 b = 11 name = "GOOD"


    b = 8


    Because numbers are immutable, "b" changes location to the new value. When there
    is no reference to a memory location the value fades away and the location is
    free to use again. This process is known as garbage collection


    # MEMORY


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_15_2.png)


    # MEMORY


    ![](img/eb45b7762fdb39a4647a098f831fcd1e_15_3.png)


    instead of finding another memory location for b, the interpreter saves memory
    by pointing to the same location


    a = b


    a = 2 b = 3 c = a + b


    This is how to test if ''a'' and ''b'' share the same memory location


    ```

    >>> a is b

    True

    >>> print (Id(a))

    123123123

    >>> print (Id(b))

    123123123

    ```


    You may assign the same value to multiple variables using the following syntax:


    ```

