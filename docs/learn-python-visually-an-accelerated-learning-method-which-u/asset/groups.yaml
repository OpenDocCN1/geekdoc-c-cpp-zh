    ```

    >>> from os import remove, rename

    >>> os.path import join

    >>> remove(join(''foo'', ''one.txt''))

    >>> rename(join(''foo'', ''two.txt''), join(''foo'', ''bar.txt''))

    ```


    You pass all the parts of the path to the join function as strings, and then the
    operating system-specific path delimiter is used to produce a string.


    You can list all the files and folders in a particular directory:


    ```

    >>> from os import listdir

    >>> listdir(''foo'')

    [''bar.txt'', ''three.txt'']

    ```


    Now let''s try to remove the foo directory.


    ```

    >>> from os import rmdir

    >>> rmdir(''foo'')

    Traceback (most recent call last):

    File "<stdin>", line 1, in <module>

    rror: [Errno 39] Directory not empty: ''foo''

    ```


    Oops! We''ve caused an exception. The directory can''t be deleted as long as it
    contains anything inside.'
