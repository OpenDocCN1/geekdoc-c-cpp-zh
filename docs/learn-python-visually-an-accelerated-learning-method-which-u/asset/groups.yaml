    # Exceptions


    Sometimes something unexpected happens that stops a program from executing as
    it should. These events are called “exceptions".


    ```python

    >>> 1 / 0

    ```


    After you hit enter, you''ll see the following output:


    ```

    Traceback (most recent call last):

    File "<html>", line 1, in <module>

    ZeroDivisionError: division by zero

    ```


    This is called an exception traceback. It shows you which functions or methods
    were called before the exception happened. The last line tells you which exception
    was raised and gives you some additional, human-readable information.

    In Python you can achieve this via a try/except block.

    What if an exception happens in the middle of something important?

    Lets print "division by zero. But it is totally fine." instead of throwing a traceback.


    ```python

    1. try:

    2. 1 / 0

    3. except ZeroDivisionError as e:

    4. print(str(e) + "But it is totally fine.")

    ```


    In the code above you can see that the statements you want to make an attempt
    to execute go into the try block. And all the error handling code goes under except.
    except keyword must be accompanied with a class of the exception. It also can
    be followed by an as keyword and a variable which is supposed to store a human
    readable description of the error.


    # Custom exceptions


    You can define your own exception classes to further notify that something extraordinary
    happened inside your code:


    ```python

    1. class YourException(Exception):

    2. pass

    ```


    All custom exceptions must have a built-in Python exception as a superclass.

    The exceptions do not have to implement any other logic.

    In order to throw an exception you should use the raise keyword:


    ```python

    1. raise YourException("Human-readable message")

    ```


    Once you execute the code above, you shall see a traceback with “Human-readable
    message” string as an extra detail.

    Handling custom exceptions is not different from handling the built-in ones:


    ```python

    1. try:

    2. raise YourException("Human-readable message")

    3. except YourException as e:

    4. print("Your exception just occured with a message: " + str(e))

    ```


    # Quiz:


    PROBLEM:


    - 1. Which block is supposed to be used to handle exceptions?

    2. What is the name of the long text that printed once an exception takes place?


    ANSWER:


    - 1. try/except block

    2. traceback


    # Part II: Standard Library


    # Import statement and modules and packages


    All source code in Python, as you have noticed, is stored in files called modules.
    Each module has a .py extension. Different modules are logically combined together
    in packages. A package is a plain folder with __init__.py. E.g. the following
    is a package:


    ```

    foobar/

    __init__.py

    one.py

    two.py

    three.py

    ```


    And this one is not:


    ```

    foobar/

    one.py

    two.py

    three.py

    ```


    Default Python installation comes with a significant amount of packages. This
    set of packages is called standard library.


    # Import statement


    If you want to use functionality stored in another package you must use import
    statement. Lets print your name on the screen:


    ```python

    >>> import os

    >>> os.path

    ```


    The snippet above shows how to import top level package. As you see members of
    the package are supposed to be accessed via the dot operator. You may avoid using
    the dot operator by importing directly:


    ```python

    >>> from os import path

    >>> path()

    ```


    To indicate the source of the import you must use from. Sometimes you may want
    to use multiple entities from the same package. In this case it is simpler to
    import all entities straight away:


    ```python

    >>> from os import sys

    ```


    Note, the entities kept inside packages can be virtually any constructs. A class,
    a function, a variable or even a package (nested packages are possible).


    # Quiz


    PROBLEM:


    1. What is the synonym of Python source file?

    2. What is the term for folders with modules?

    3. What is the name of collection of packages that comes with default installation?

    4. How to import path from os?


    ANSWER:


    1. module

    2. package

    3. standard library

    4. from os import path


    # File operations using os module


    Even though it is possible to work with files using builtin functions and methods
    they do not cover all the scenarios that you may face when computing file system.
    This chapter provides an overview of all the common tasks you may face on the
    lower level when processing data and managing with these tasks. A quick note:
    some of the examples below use Linux''s path. To play them on Windows replace
    a slash (/) with a backslash (\). To begin with lets say you got the following
    folder structure (e.g. created using a file manager):


    ```

    /parent/

    foo/

    one.txt

    two.txt

    three.txt

    ```


    First navigate to parent directory of foo using a terminal command:


    ```bash

    cd /parent

    ```


    Lets verify that directory''s path is what we expect it to be. To get the absolute
    path of the current directory you ought to employ abspath function and curdir
    property of os.path module:


    ```python

    >>> from os.path import abspath, curdir

    >>> curdir

    >>> abspath(curdir)

    /parent

    ```


    curdir variable holds a string pointing to the current directory - abspath expects
    any path as its argument and returns the absolute path. Now remove one.txt and
    rename two.txt into bar.txt. To do this you will need two functions from the standard
    library''s os module: remove and rename respectively.


    # File operations using os module


    ```python

    >>> from os import remove, rename

    >>> remove(''foo/one.txt'')

    >>> rename(''foo/two.txt'', ''foo/bar.txt'')

    ```


    As you noticed, in order to get rid of the file you must pass its name to the
    function and in order to rename the file apart from supplying the original name
    you are also supposed to pass the string that will be assigned as the file''s
    new name.

    Note, when supplying the name of the file you must give either a relative or an
    absolute path to the file. In case of the absolute path everything is plain and
    simple - it should start with the root of your file system. The absolute path
    could look the following way on UNIX and Windows respectively:


    ```

    /Blah/Blah/foo/one.txt

    C:\Blah\Blah\foo\one.txt

    ```


    Relative paths are calculated with your current directory. Lets say you are in
    a directory /foo/bar/one and you want to move to /foo/bar/two. In this case the
    relative path shall be: ../two. Two dots represent a parent directory. And since
    you need to navigate two levels above - a sequence of ../ is required.


    Due to the fact that different delimiters above on nix and Windows the remove/rename
    code snippet has a serious flaw. It is not multi-platform. In order to transform
    it into one you should use join function from os.path module:


    ```python

    >>> from os import remove, rename

    >>> os.path import join

    >>> remove(join(''foo'', ''one.txt''))

    >>> rename(join(''foo'', ''two.txt''), join(''foo'', ''bar.txt''))

    ```


    You pass all the parts of the path to the join function as strings, and then the
    operating system-specific path delimiter is used to produce a string.


    You can list all the files and folders in a particular directory:


    ```python

    >>> from os import listdir

    >>> listdir(''foo'')

    [''bar.txt'', ''three.txt'']

    ```


    Now let''s try to remove the foo directory.


    ```python

    >>> from os import rmdir

    >>> rmdir(''foo'')

    Traceback (most recent call last):

    File "<stdin>", line 1, in <module>

    rror: [Errno 39] Directory not empty: ''foo''

    ```

