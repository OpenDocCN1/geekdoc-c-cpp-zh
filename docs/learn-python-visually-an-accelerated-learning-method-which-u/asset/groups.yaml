    THE PROBLEM\n\nPeople cannot be blamed for thinking programming is hard when trying\
    \ it out for the first time. Learning to programming is like learning a new language.\n\
    \nA number of rules and grammar syntax guidelines exist to follow. It also requires\
    \ memorizing a bevy of glossary terms for each language, and unless a person works\
    \ with programming at least 8 hours a day, the person is unlikely to become very\
    \ familiar with programming quickly; at least, that has been the situation for\
    \ years until now.\n\nOur approach involves teaching programming concepts via\
    \ simple illustrations.\n\nThe visual approach works because it is one of the\
    \ most fundamental ways of learning. Everyone as a baby and toddler learns the\
    \ world around them via sight and sound long before there is comprehension associated\
    \ with letters and meanings.\n\nProgramming works in modules and building blocks.\
    \ As a person learns a few basic modules and steps, he can learn to build more\
    \ complex modules on those first basic units.\n\nIt's a building block approach\
    \ where bigger structures can be coded once the basic modules are mastered. I\
    \ start with a set of basic building blocks that are easy to learn through illustrations\
    \ and metaphors.\n\nFrom there, a user can apply multiple variations and build\
    \ further. However, the initial set of building blocks becomes a Rosetta stone\
    \ of sorts, allowing a user to program and build in any situation going forward.\n\
    \n# Why Python?\n\nWhen you embark on your computer science journey at college,\
    \ you'll probably start by learning Python.\n\nSo why choose Python over any other\
    \ programming language?\nIt's simple:\n\n- Regardless of your operating system,\
    \ Python is easy to set up.\n- Python code uses plain English, making it easy\
    \ to understand.\n- Python will let you run bad code.\n  Why is this good?\n \
    \ When you're learning you're bound to make mistakes.\n  Python tells you what\
    \ the error is after you run the code, helping you to find the problem.\n- Python\
    \ is a very powerful tool, but it's also easy and fast to learn, which is why\
    \ most people prefer it.\n\n# Installation\n\nThere are pre-compiled packages\
    \ made for easy installation on multiple operating systems such as Windows, Linux,\
    \ UNIX and Mac OS to name but a few.\nIf you head over to https://www.python.org/downloads/\
    \ you can select the right installation method for your operating system. Most\
    \ Linux systems come with Python pre-installed.\n\nVersion 3 of Python is used\
    \ in this book.\nIn Windows, once you have installed Python, select Python IDLE\
    \ or Python command line/console from the Start menu or screen.\n\nThe difference\
    \ between the IDLE and the console is that the IDLE has a graphical interface,\
    \ which looks similar to a text editor. In Linux, UNIX, and OS X, you can launch\
    \ Python emulator from command line by typing Python.\n\nTo choose a specific\
    \ version of Python type PythonX where X is the version number (e.g. \"Python3\"\
    \ for version 3).\n\n![](img/eb45b7762fdb39a4647a098f831fcd1e_9_0.png)\n\n# Hello\
    \ World!\n\nMost of the time you write Python code, you will be writing the script\
    \ in an IDE or any other IDE like Eclipse or rich text editor like Sublime text\
    \ or Notepad++. However, you can use the interpreter to write code interactively\
    \ as it acts like a UNIX shell. Even though it is possible to create programs\
    \ using just the interpreter it is strongly recommended not to do so since it\
    \ is hard to save the code as a script for further reuse. Rather consider the\
    \ interpreter as \"on the fly\" testing tool. Now lets make the interpreter output\
    \ \"Hello World!\" string on the screen. Lets do it via the interpreter.\n\n![](img/eb45b7762fdb39a4647a098f831fcd1e_10_0.png)\n\
    \n# Terminal way\n\nLaunch the interpreter from command line using Python command\
    \ as it was described in the previous chapter.\n\nType the following: `print(\"\
    Hello world!\")` and hit “Enter”.\n\nThe terminal shall look like the following\
    \ way:\n\n![](img/eb45b7762fdb39a4647a098f831fcd1e_11_0.png)\n\nIn the code snippet\
    \ above you can see that the first line starts with >>>. This symbol indicates\
    \ the line where you provide dynamic input to the interpreter. Notice as soon\
    \ as the result of your first command was printed on the screen the interpreter\
    \ printed >>> again. Giving instructions to the interpreter is sequential. You\
    \ give one instruction - wait till execution finishes, you enter another command\
    \ and so on.\n\nNote, further on in this book if you spot >>> symbol in a code\
    \ snippet it shall mean that you are expected to test the code in the interpreter\
    \ yourself.\n\nOn the first line you entered a statement. The statement is nothing\
    \ else but an instruction for a computer to perform some task. The task could\
    \ be anything from make_a_coffee to launch_a_rocket. In your case it is a simple\
    \ print function though. Functions will be covered further in this book.\n"
