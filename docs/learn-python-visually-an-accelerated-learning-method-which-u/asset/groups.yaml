    虽然可以使用内置函数和方法处理文件，但它们并没有涵盖你在计算文件系统时可能遇到的所有场景。本章概述了你在处理数据和管理任务时可能遇到的常见任务。快速说明：下面的示例使用了
    Linux 路径。要在 Windows 上运行它们，将斜杠（/）替换为反斜杠（\）。首先假设你有了如下文件夹结构：


    ```

    /parent/

    foo/

    one.txt

    two.txt

    three.txt

    ```


    首先使用终端命令进入 foo 的父目录：


    ```bash

    cd /parent

    ```


    让我们验证路径是否符合预期。获取当前目录的绝对路径，你应该使用 os.path 模块的 `abspath` 函数和 `curdir` 属性：


    ```python

    >>> from os.path import abspath, curdir

    >>> curdir

    >>> abspath(curdir)

    /parent

    ```


    `curdir` 变量持有指向当前目录的字符串——`abspath` 接受任何路径作为参数并返回绝对路径。现在将 `one.txt` 重命名为 `bar.txt`。要实现这一点，你需要标准库
    os 模块中的两个函数：分别是 `remove` 和 `rename`。


    ```python

    >>> from os import remove, rename

    >>> remove(''foo/one.txt'')

    >>> rename(''foo/two.txt'', ''foo/bar.txt'')

    ```


    正如你看到的，为了删除文件，必须将其名称传递给函数；为了重命名文件，除了提供原始名称外，还必须传递将赋值为文件新名的字符串。

    注意，提供文件名时，必须提供文件的相对路径或绝对路径。对于绝对路径，一切都很简单——它应该从文件系统的根目录开始。绝对路径在 UNIX 和 Windows
    上分别如下：


    ```

    /Blah/Blah/foo/one.txt

    C:\Blah\Blah\foo\one.txt

    ```


    相对路径是通过你的当前目录计算的。假设你在 `/foo/bar/one` 目录下并想移动到 `/foo/bar/two`。在这种情况下，相对路径应该是`../two`。两个点代表父目录。由于你需要向上导航两层，需要一组
    `../`。


    由于上述 nix 和 Windows 上的分隔符不同，`remove/rename` 代码段有一个严重缺陷。它不是跨平台的。为了将其转换为通用，你应该使用
    `os.path` 模块中的 `join` 函数：


    ```python

    >>> from os import remove, rename

    >>> os.path import join

    >>> remove(join(''foo'', ''one.txt''))

    >>> rename(join(''foo'', ''two.txt''), join(''foo'', ''bar.txt''))

    ```


    你将路径的所有部分作为字符串传递给 `join` 函数，然后使用操作系统特定的路径分隔符生成字符串。


    你可以列出特定目录下所有的文件和文件夹：


    ```python

    >>> from os import listdir

    >>> listdir(''foo'')

    [''bar.txt'', ''three.txt'']

    ```


    现在尝试删除 foo 目录。


    ```python

    >>> from os import rmdir

    >>> rmdir(''foo'')

    Traceback (most recent call last):

    File "<stdin>", line 1, in <module>

    rror: [Errno 39] Directory not empty: ''foo''

    ```


