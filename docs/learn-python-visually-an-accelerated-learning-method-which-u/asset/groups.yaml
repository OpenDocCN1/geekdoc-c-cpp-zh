    \ you need to do something over and over again, you may want to think of a way\
    \ to automate this task to save yourself some time and make your life easier.\n\
    \n- 2. \\n\\n\n"
  mdcn: "\n传输的数据。\n在这种情况下，你使用了请求对象来返回页面的路径。\nFlask 提供了一种简单的方法来响应不同的 HTTP 方法：\n\n```python\n\
    1. @app.route('/data', methods=['GET'])\n2. def show_data():\n3.     ...\n4. @app.route('/data',\
    \ methods=['POST'])\n5. def handle_data():\n6.     ...\n7. @app.route('/user/<username>')\n\
    8. def greet_user(username):\n9.     return \"Hello \" + username\n```\n\n你可以将网页\
    \ URL 的部分作为函数中的变量。\n\n```python\n1. import json\n2. from flask import make_response,\
    \ Flask\n3. app = Flask(__name__)\n4. @app.route('/json')\n5. def get_image():\n\
    6.     # 创建响应\n7.     response = make_response(json.dumps({\"foo\": \"bar\"}))\n\
    8.     # 设置正确的 mimetype\n9.     response.mimetype = \"application/json\"\n10.\
    \    return response\n11. if __name__ == \"__main__\":\n12.     app.run(debug=True)\n\
    ```\n\n到目前为止，所有页面都会返回简单的文本。\nFlask 会自动将此字符串转换为 HTTP 响应，并赋予其 mimetype \"text/html\"\
    \ 以及状态码 200。\n现在让我们来修改这种行为。\n这段代码返回一个 JSON 对象。\n我们还可以更改错误代码：\n\n```python\n1.\
    \ ...\n2. @app.route(\"/error\")\n3. def error_page():\n4.     response = make_response(\"\
    Error Page\")\n5.     response.status_code = 404\n6.     return response\n7. ...\n\
    ```\n\n# 测验\n\n问题：\n\n- 1. 什么是 Flask？你应该用它来什么？\n2. 为什么 Flask 被称为微框架（microframework）？\n\
    3. Flask 集成 HTTP 扩展的默认端口是什么？\n4. 你能列出最常用的 HTTP 方法吗？\n5. 考虑以下代码片段：\n\n```python\n\
    1. @app.route(\"/error\")\n2. def error_page():\n3. return \"Error Page\"\n```\n\
    \n答案：\n\n- 1. Flask 是一个用于创建 Web 的 Python 微框架。\n2. 它保持了核心的简单性。新功能必须通过扩展添加。\n3.\
    \ 5000\n4. GET, POST, HEAD, PUT 和 DELETE\n5. 200。不要被错误名称误导。你没有做任何操作来更改状态码。\n\n\
    # 练习题\n\n问题：\n假设你想为你的网站创建一个小型讨论页面，让用户能够发布和阅读消息。消息按降序排列，最新的消息显示在最前面。\n\n你的网站非常受欢迎，导致消息多到无法全部显示！你决定将每页的消息数限制为\
    \ 50 条，并添加“下一页”和“上一页”按钮来在页面之间跳转。\n\n你能创建一个脚本来显示给定页面的第一条和最后一条帖的编号吗？\n\n示例答案\n\n\
    ```python\n...\n@app.route(\"/posts\")\n@app.route(\"/posts/page/<int:page_nb>\"\
    )\ndef show_posts(page_nb=1):\n    first_msg = 1 + 50 * (page_nb)\n    last_msg\
    \ = first_msg + 49\n    return \"Messages {} to {}\".format(first_msg, last_msg)\n\
    ...\n```\n\n笔记：\n\n- 为变量 `page_nb` 设置一个默认值，使得路由 \"/posts\" 和 \"/posts/page/1\"\
    \ 是效的。\n- 在装饰器中强制 `page_nb` 的类型为 `int`。这样路由 \"/posts/page/something\" 将返回 404\
    \ 错误。\n\n# 任务自动化配方\n\n# 文件与目录\n\n处理文件和目录可能会变得繁琐。Python 提供了方便的方法来遍历目录并对文件进行操作。\n\
    \n以下代码将以向下的方式扫描目录：\n\n- 1. import os\n2. for (root, dirs, files) in os.walk('.'):\n\
    3.     for name in files:\n4.         print(os.join(root, name))\n\nSlate 是一个可以让你轻松访问\
    \ PDF 的模块：\n\n```python\nimport slate\nf = open(\"doc.pdf\")\ndoc = slate.PDF(f)\n\
    ```\n\n你可以使用它来提取 PDF 的第一行文本：\n\n```python\nfirst_line = f.readline()\n```\n\n\
    关闭文件：\n\n```python\nf.close()\n\n\n# 目录清理\n\n假设你需要清理目录并删除 2002 年之前的文件。目录中的每个文件都是文本文件\
    \ (.txt)，其第一行为日期 (yyyy-mm-dd)。\n\n```python\nimport os\nimport time\ncount = 0\n\
    kept = 0\ndeleted = 0\nfor (root, dirs, files) in os.walk('.'):\n    for filename\
    \ in files:\n        if filename.endswith('.txt'):\n            f = open(filename,\
    \ 'r')\n            sdate = f.readline()\n            f.close()\n            pdate\
    \ = time.strptime(sdate, '%Y-%m-%d')\n            if pdate.tm_year > 2002:\n \
    \               kept += 1\n            else:\n                os.remove(filename)\n\
    \                deleted += 1\n            count += 1\nprint('Total files: ' +\
    \ str(count))\nprint('Kept: ' + str(kept))\nprint('Deleted: ' + str(deleted))\n\
    ```\n\n上述代码完成了以下 4 件事：\n\n- 1. 导入了必要的模块。\n2. 使用 “walk” 方法遍历当前目录。对于目录中的每个文本文件：\n\
    \   a. 打开文件\n   b. 使用 f.readline() 读取日期\n   c. 将字符串日期转换为 Python 对象\n   d. 如果日期在\
    \ 2002 年之前，则删除该文件\n3. 记录删除文件的数量并在最后显示该数字。\n\n# 测验\n\n问题：你为什么以及何时想要自动化任务？\n如果 doc1.pdf\
    \ 是一个第一页为空的 PDF 文，以下代码会打印什么？\n\n```python\nimport slate\nf = open('doc1.pdf')\n\
    doc = slate.PDF(f)\nf.close()\nprint(doc[0])\n```\n\n答案：\n\n- 1. 每当你需要重复执行某项任务时，你可能都会想要一种自动化任务的方法，以节省时间并让生活更轻松。\n\
    \n- 2. \\n\\n\n\n"
