    \n```python\n1. @app.route(\"/error\")\n2. def error_page():\n3. return \"Error\
    \ Page\"\n```\n\nANSWER:\n\n- 1. Flask is a microframework for Python used to\
    \ create web applications.\n2. It keeps its core simple. New functionality must\
    \ be added via extensions.\n3. 5000\n4. GET, POST, HEAD, PUT and DELETE\n5. 200.\
    \ Do not be fooled by the error name. You did nothing to change the status code.\n\
    \n# Exercises\n\nPROBLEM:\nImagine you want to create a small discussion page\
    \ for your website to let your users post and read messages. Messages are sorted\
    \ in descending order, the most recent message is displayed first.\n\nYour website\
    \ is so popular that there are too many messages to be displayed! You decide to\
    \ limit the number of messages per page to 50, and add \"next\" and \"previous\"\
    \ buttons to navigate between pages.\n\nCan you create a script to display the\
    \ first and last post number on a given page?\n\nSAMPLE ANSWER\n\n```python\n\
    ...\n@app.route(\"/posts\")\n@app.route(\"/posts/page/<int:page_nb>\")\ndef show_posts(page_nb=1):\n\
    \    first_msg = 1 + 50 * (page_nb)\n    last_msg = first_msg + 49\n    return\
    \ \"Messages {} to {}\".format(first_msg, last_msg)\n...\n```\n\nNOTES:\n\n- -\
    \ set a default value for the variable page_nb so that the routes \"/posts\" and\
    \ \"/posts/page/1\" are equivalent.\n- force page_nb to be of type int in the\
    \ decorator. So that a route \"/posts/page/something\" would return a 404 error.\n\
    \n# Recipes for task automation\n\n# Files and Directories\n\nWorking with files\
    \ and directories can rapidly grow into a tedious and time consuming task. Python\
    \ offers convenient methods to help you easily walk directories and perform operations\
    \ on files.\n\nThe following code will scan all directories and subdirectories\
    \ in a top-down manner:\n\n- 1. import os\n2. for root, dirs, files in os.walk(\"\
    .\", topdown = True):\n3.     for name in files:\n4.         print(os.path.join(root,\
    \ name))\n5.     for name in dirs:\n6.         print(os.path.join(root, name))\n\
    \nSlate is a small module you can use to easily extract text from PDF files.\n\
    The following code reads a PDF file and extracts all text from the document, presenting\
    \ each page as a string of text:\n\n```python\n>>> import slate\n>>> f = open(\"\
    doc.pdf\")\n>>> doc = slate.PDF(f)\n>>> doc\n[..., ..., ...]\n>>> doc[1]\n\"Text\
    \ from page 2....\",\n```\n\nPython makes it easy to access remote resources using\
    \ the urllib.\n\n```python\n>>> from urllib.request import urlopen\n>>> response\
    \ = urlopen(\"http://a/b/c\")\n>>> data = response.read()\n```\n\nNote that \"\
    response\" is a file-like object, which points at the remote resource.\n\n# Image\
    \ Processing (PIL)\n\nThe Python Imaging Library (PIL) adds image processing capabilities\
    \ to Python. You can use this library to create thumbnails, convert between file\
