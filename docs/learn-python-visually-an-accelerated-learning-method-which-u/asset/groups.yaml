    # Collections


    In many cases, you want to perform the same action on a lot of very similar objects.
    For example, in real life, you might want to iron your socks. It wouldn''t make
    sense for you to consider each one individually as a unique object requiring special
    treatment.


    In programming, this is where Python collections come in handy. A good analogy
    for collections is a set of lockers.


    Python has two types of lockers: ones with name tags, and anonymous ones, indexed
    only by number.


    To access items in the anonymous locker room, you can either go through all the
    lockers one by one, or access a specific one by an integer index. In Python, these
    lockers are represented by lists and tuples.


    For lockers with name tags, you can either go through each locker one by one,
    or you can look at a specific name tag. In Python, these lockers are represented
    by dictionaries. This chapter provides an overview of built-in Python collections.


    Lists and tuples use integers for indexing.


    Dictionaries use keys for indexing.


