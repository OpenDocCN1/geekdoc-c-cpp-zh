    # Math module


    This chapter provides an overview of the math module from the Python standard
    library. The module contains implementations of common mathematical operations,
    such as square root, that aren''t includded in the standard function set.


    Using the math module you can perform regular trigonometric operations:


    ```

    >>> math.sin(math.radians(30))

    0.4999999999999999

    >>> math.cos(math.radians(60))

    0.5000000000000001

    >>> math.tan(math.radians(45))

    0.9999999999999999

    ```


    Note, the argument to is a value of the angle in radians not degrees. This is
    why an additional call to math.radians was used.


    Also, you see 0.49999999999 instead of 0.5 or 0.99999999999 instead of 1. This
    is due to the way the language handles floating point number calculations.


    You can get special numbers, like pi and e, to a certain level of precision:


    ```

    >>> math.pi

    3.141592653589793

    >>> math.e

    2.718281828459045

    ```


    You can also calculate square roots:


    ```

    >>> math.sqrt(16)

    4.0

    >>> math.sqrt(25)

    5.0

    ```'
