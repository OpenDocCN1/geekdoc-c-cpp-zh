    2. 这一个呢？(2 + 2 + 3 + 4) * (4 * 4 - (2 * 6 + 4))？


    答案：10 - 如果你回答 0，说明你忘记乘法的优先级高于加法。0 - 如果你的答案是其他，说明你忘记括号内的运算先执行 - 第二个表达式的乘积 (4 *
    4 - (2 * 6 + 4)) 是 0，任何数乘以 0 都 0。


