    # SQL: sqlite3


    One of the main principles of software development reusability. The principle
    can be rephased as DRY - Don''t Repeat Yourself. The best way to achieve it is
    to avoid reinventing the wheel and apply the solutions that were implemented before
    you.


    Over the decades of industry development in information processing and data storage,
    a common set of constraints has emerged. In this context, the word "constraint"
    means a set of rules that you apply to the data to be stored.


    To understand what constraints are think about an email address. The address is
    expected to have an "@" character. This expectation is a constraint.


    A real-life system with multiple constraints is an automobile assembly line. All
    the parts are expected to fit criteria - if they don''t, it''s not possible to
    fully automate the line, and you will have to involve manual labor. A general
    rule of thumb is that to achieve a reasonable level of automation, you must sacrifice
    a fraction of the input''s flexibility.


    To create a common system of constraints, the existing systems were combined into
    what is now called a relational database.


    Data are stored in the relational database as tables, where each column represents
    a set of rules for what data types (strings, ints, booleans, etc.) can be stored
    in each row.


    Each column has a type that represents a rule for the database engine regarding
    what sort of data can be stored in respective fields. The types can be integers,
    strings, booleans, etc.


    The primary key constraint defines which field should be used as the main index,
    i.e. which piece of information in the row can be used as its address. A word
    index means exactly the same thing as in post industry. It is a unique identifier
    used to simplify access to information. In case of post it is the address of a
    particular recipient, in case of relational database - a particular row in the
    table.'
