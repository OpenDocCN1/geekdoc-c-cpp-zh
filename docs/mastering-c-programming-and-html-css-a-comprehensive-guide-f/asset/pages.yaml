    # ### Exception Safety


    Exception safety is an important concept in C++ exception handling. It refers
    to the ability of a program to handle exceptions without causing resource leaks
    or entering an inconsistent state. C++ provides three levels of exception safety:


    +   1. **No-throw guarantee**: A function is guaranteed not to throw exceptions.
    This level of safety is the most desirable because it ensures that no resources
    are leaked and the program remains in a consistent state.


    +   2. **Basic exception safety**: A function guarantees that if an exception
    is thrown, it will not leak resources. However, the program''s state might be
    inconsistent. It is up to the caller to decide how to handle the inconsistent
    state.


    +   3. **Strong exception safety**: A function guarantees that if an exception
    is thrown, the program''s state will remain unchanged. This level of safety is
    the most challenging to achieve but ensures the highest level of reliability.'
