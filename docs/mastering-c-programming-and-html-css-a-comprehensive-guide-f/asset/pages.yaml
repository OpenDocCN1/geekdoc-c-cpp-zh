- img_proc: true
  md: "# ## How CSS Works\n\nAt its core, CSS is a rule-based language. You create\
    \ rules that define how specific HTML elements should be styled. Each rule consists\
    \ of two main parts: a selector and a declaration block. Let's break down these\
    \ components:\n\n+   1. **Selector:** The selector identifies which HTML elements\
    \ the rule should apply to. You can select elements by their tag name (e.g., `p`\
    \ for paragraphs), class (e.g., `.header` for elements with the class \"header\"\
    ), ID (e.g., `#main-content` for an element with the ID \"main-content\"), or\
    \ other attributes.\n\n+   2. **Declaration Block:** The declaration block is\
    \ enclosed in curly braces `{}` and contains one or more declarations. Each declaration\
    \ consists of a property and a value, separated by a colon. For example, `color:\
    \ blue;` sets the text color to blue.\n\nHere's an example of a simple CSS rule:\n\
    \n```\n```css\np {\n  color: #333;\n  font-size: 16px;\n  margin-bottom: 20px;\n\
    }\n```\n```"
