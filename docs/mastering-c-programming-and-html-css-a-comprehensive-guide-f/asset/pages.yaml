  md: "# #### 2. **Main and Cross Axes**\n\nFlexbox operates along two primary axes:\
    \ the **main axis** and the **cross axis**. The main axis aligns flex items horizontally\
    \ or vertically, depending on the `flex-direction` property, while the cross axis\
    \ runs perpendicular to the main axis.\n\n```\n```css\n/* Setting the main axis\
    \ direction */\n.container {\n  flex-direction: row; /* Main axis is horizontal\
    \ (default) */\n}\n\n.container-reversed {\n  flex-direction: column-reverse;\
    \ /* Main axis is vertical, reversed */\n}\n```\n```\n\n# #### 3. **Justify and\
    \ Align**\n\nFlexbox provides properties like `justify-content` and `align-items`\
    \ to control the positioning of flex items along both"
