    # ## Creating the Basic Structure of an HTML Page


    Now that we understand the components of an HTML element, let''s create a simple
    HTML page. Every HTML page follows a basic structure known as the "HTML Document
    Structure." It consists of the following main parts:


    +   1. `<!DOCTYPE>`: This declaration, known as the document type declaration,
    defines the document type and version. In modern web development, we use `<!DOCTYPE>`
    to indicate an HTML5 document.


    +   2. `<html>`: The `<html>` element is the root element of an HTML page. It
    encapsulates all the content on the page and serves as the container for all other
    HTML elements.


    +   3. `<head>`: The `<head>` element contains meta-information about the document,
    such as the page title, character encoding, and links to external resources like
    stylesheets and scripts. It doesn''t display any visible content on the web page
    itself.'
