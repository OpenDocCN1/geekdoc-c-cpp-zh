- img_proc: true
  md: '- `std::runtime_error`: Represents a generic runtime error.


    - `std::logic_error`: Indicates a logical error in the program.


    - `std::domain_error`: Thrown when a function receives an argument that is out
    of its valid domain.


    - `std::invalid_argument`: Used for invalid function arguments.


    - `std::length_error`: Thrown when a container (such as a vector or string) exceeds
    its maximum length.


    - `std::out_of_range`: Signifies an out-of-range index or iterator.


    - `std::overflow_error` and `std::underflow_error`: Indicate arithmetic overflow
    and underflow, respectively.


    These standard exception types cover a wide range of potential issues, and you
    can also create your custom exception classes to handle specific errors in your
    application.


    # ### The Exception Hierarchy


    Exception classes in C++ are organized in a hierarchy, with the base class `std::exception`
    at the top. This hierarchy allows you to catch exceptions of a more general type
    or handle exceptions more specifically.


    For example, you can catch a `std::exception` to handle any standard exception,
    or you can catch specific exception types like `std::runtime_error` or `std::invalid_argument`
    to address particular error scenarios.'
