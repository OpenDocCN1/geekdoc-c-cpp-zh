  md: '# #### 1. **JPEG (Joint Photographic Experts Group)**


    +   - **Pros:**** Suitable for photographs and images with many colors. Offers
    good compression without a noticeable loss in quality.


    +   - **Cons:**** May not be the best choice for images with sharp edges or text,
    as it can result in artifacts.


    # #### 2. **PNG (Portable Network Graphics)**


    +   - **Pros:**** Ideal for images with transparency, sharp edges, or text. Lossless
    compression maintains high quality.


    +   - **Cons:**** Larger file sizes compared to JPEG for the same level of detail.


    # #### 3. **GIF (Graphics Interchange Format)**


    +   - **Pros:**** Supports animation and simple graphics. Suitable for small,
    repetitive animations like loading icons.


    +   - **Cons:**** Limited color palette and lower image quality compared to JPEG
    and PNG.


    # #### 4. **SVG (Scalable Vector Graphics)**


    +   - **Pros:**** Vector format that scales without loss of quality. Ideal for
    logos, icons, and graphics with sharp edges.'
