- img_proc: true
  md: '- **Right-Aligned:** Right alignment can be used for creative or decorative
    purposes but is less common for body text.


    - **Centered:** Centered text is often used for headings or short blocks of text.
    It can create a visually appealing effect when used sparingly.


    - **Justified:** Justified text aligns both the left and right edges of the text
    block. While it can create a clean and formal look, it may result in uneven word
    spacing, which can affect readability. Use it with caution.


    # ### Text Styling


    Text styling includes various attributes like bold, italics, underline, and color.
    These styles can be applied to emphasize specific content or create visual interest.
    Here are some considerations:


    - **Bold:** Use bold text for headings or to highlight important phrases. Avoid
    excessive use, as it can make text heavy and distracting.


    - **Itics:** Italics are commonly used for emphasizing words or providing context.
    They can also be used for quotations or book titles.'
