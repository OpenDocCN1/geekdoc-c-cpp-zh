    \ `DerivedClass` then overrides this virtual function with its own implementation\
    \ using the `override` keyword.\n\n### Abstract Classes: Promoting Concrete Implementations\n\
    \nAn abstract class is a class that cannot be instantiated directly and is meant\
    \ to serve as a base class for other classes. It often contains one or more pure\
    \ virtual functions, which are virtual functions without a default implementation\
    \ in the base class. Derived classes must provide concrete implementations for\
    \ these pure virtual functions.\n\nHere's an example of an abstract class with\
    \ a pure virtual function:\n\n```cpp\nclass AbstractShape {\npublic:\n    // Pure\
    \ virtual function\n    virtual double area() const = 0;\n\n    // Regular member\
    \ function\n    void printArea() const {\n        std::cout << \"Area: \" << area()\
    \ << std::endl;\n    }\n};\n```\n\nIn this code, `AbstractShape` is an abstract\
    \ class with a pure virtual function `area()`. Derived classes like `Circle` or\
    \ `Rectangle` must provide their own implementations of the `area()` function\
    \ to become concrete classes.\n\n### Polymorphism and Object Slicing: A Cautionary\
    \ Note\n\nWhen working with polymorphism, it's essential to understand the concept\
    \ of object slicing. Object slicing occurs when you assign an object of a derived\
    \ class to an object of a base class. During this process, the specific attributes\
    \ and behaviors of the derived class are \"sliced off,\" leaving only the base\
    \ class part.\n\nHere's an example illustrating object slicing:\n\n```cpp\nclass\
    \ Base {\npublic:\n  int baseValue;\n\n  Base(int value) : baseValue(value) {}\n\
    \  virtual void display() const {\n    std::cout << \"Base: \" << baseValue <<\
    \ std::endl;\n  }\n};\n\nclass Derived : public Base {\npublic:\n  int derivedValue;\n\
    \n  Derived(int baseVal, int derivedVal) : Base(baseVal), derivedValue(derivedVal)\
    \ {}\n  void display() const override {\n    std::cout << \"Derived: \" << baseValue\
    \ << \", \" << derivedValue << std::endl;\n  }\n};\n\nint main() {\n    Derived\
    \ derivedObj(42, 101);\n    Base baseObj = derivedObj; // Object slicing\n\n \
    \   baseObj.display(); // Calls Base's display()\n    return 0;\n}\n```\n\nIn\
    \ this code, we have a base class `Base` and a derived class `Derived`. The `Derived`\
    \ class extends the base class by adding an additional attribute `derivedValue`.\
    \ In the `main()` function, we create a `Derived` object and then assign it to\
    \ a `Base` object. This assignment results in object slicing.\n\nWhen we call\
    \ `baseObj.display()`, it calls the `display()` method of the base class, not\
    \ the derived class, because `baseObj` is a `Base` object.\n\n## Conclusion: Building\
    \ Hierarchies and Embracing Flexibility\n\nInheritance and polymorphism are foundational\
    \ concepts in C++ and object-oriented programming. Inheritance allows you to create\
    \ class hierarchies, reuse code, and build logical relationships between classes.\
    \ It enables you to design software systems with structured and organized class\
    \ structures.\n\nPolymorphism, on the other hand, empowers your code to treat\
    \ objects of different classes in a unified way. It promotes flexibility and adaptability,\
    \ making your software more robust and easier to maintain.\n\nUnderstanding how\
    \ to design class hierarchies, utilize inheritance, and leverage polymorphism\
    \ is essential for building complex and extensible software systems in C++. These\
    \ concepts provide the foundation for creating efficient and organized code that\
    \ can adapt to changing requirements.\n\n## Chapter 12: Templates and Generic\
    \ Programming\n\nTemplates and generic programming are powerful features in C++\
    \ that enable you to write flexible, reusable code capable of working with different\
    \ data types. In this chapter, we'll explore the concept of templates, learn how\
    \ to create generic functions and classes, and understand how templates contribute\
    \ to the versatility and efficiency of C++ programs.\n\n## The Need for Generic\
    \ Programming\n\nWhen writing C++ code, it's common to encounter situations where\
    \ you want to create functions or classes that can work with multiple data types.\
    \ For example, you might need a sorting algorithm that can sort arrays of integers,\
    \ floating-point numbers, or even custom objects. Writing separate functions or\
    \ classes for each data type is neither practical nor efficient.\n\nThis is where\
    \ generic programming comes into play. It allows you to write code that is independent\
    \ of specific data types, making your code more versatile and reducing redundancy.\
    \ Templates are the foundation of generic programming in C++.\n\n## Introduction\
    \ to Templates\n\n### What are Templates?\n\nTemplates in C++ are a mechanism\
    \ for creating generic code that can operate on different data types without sacrificing\
    \ type safety. A template is essentially a blueprint for generating classes or\
    \ functions. When you use a template, you define the generic structure, and the\
    \ C++ compiler generates concrete code for specific data types when you use the\
    \ template.\n\nTemplates are particularly useful when you want to create algorithms,\
    \ data structures, or functions that work with various data types while ensuring\
    \ type safety and minimizing code duplication.\n\n### Function Templates\n\nFunction\
    \ templates allow you to create generic functions that can work with different\
    \ data types. Here's the basic syntax for defining a function template:\n\n```cpp\n\
    template <typename T>\nT add(T a, T b) {\n    return a + b;\n}\n```\n\nIn this\
    \ example, `add` is a function that takes two parameters of type `T` and returns\
    \ their sum. The `<typename>` part specifies the template parameter, and `T` is\
    \ a placeholder for the actual data type. You can then use this template with\
    \ various data types, like `int` or `double`:\n\n```cpp\nint result1 = add<int>(5,\
    \ 10);      // Calls add<int>\ndouble result2 = add<double>(3.5, 2.7); // Calls\
    \ add<double>\n```\n\n### Class Templates\n\nClass templates extend the concept\
    \ of templates to classes. They allow you to create generic classes that can work\
    \ with different types. Here's an example of a stack:\n\n```cpp\ntemplate <typename\
    \ T>\nclass Stack {\nprivate:\n    std::vector<T> elements;\n\npublic:\n  void\
    \ push(T value) {\n    elements.push_back(value);\n  }\n\n  T pop() {\n    if\
    \ (empty()) {\n      throw std::runtime_error(\"Stack is empty\");\n    }\n  \
    \  T top = elements.back();\n    elements.pop_back();\n    return top;\n  }\n\n\
    \  bool empty() const {\n    return elements.empty();\n  }\n};\n```\n\nYou can\
    \ then create instances of the `Stack` class for different data types:\n\n```cpp\n\
    Stack<int> intStack;\nStack<double> doubleStack;\n```\n\n### Template Specialization\n\
    \nTemplate specialization allows you to provide specialized implementations for\
    \ specific data types while maintaining the generic template for others. This\
    \ is useful when you need to optimize or customize behavior for certain types.\n\
    \nHere's an example of template specialization for a generic function that computes\
    \ the square of a number:\n\n```cpp\ntemplate <typename T>\nT square(T x) {\n\
    \    return x * x;\n}\n\n// Template specialization for char\ntemplate <>\nchar\
    \ square<char>(char x) {\n    return '!';\n}\n```\n\n### Template Parameters\n\
    \nTemplate parameters are the placeholders for data types or values that you can\
    \ use within a template. There are two types of template parameters: type parameters\
    \ (typename or class) and non-type parameters (int, double, etc.).\n\nHere's an\
    \ example of a function template with both type and non-type parameters:\n\n```cpp\n\
    template <typename T, int N = 2>\nT multiplyBy(T value) {\n  return value * N;\n\
    }\n```\n\nIn this template, `T` is a type parameter, and `N` is a non-type parameter\
    \ with a default value of 2. You can use this template with different data types\
    \ and values of `N`.\n"
