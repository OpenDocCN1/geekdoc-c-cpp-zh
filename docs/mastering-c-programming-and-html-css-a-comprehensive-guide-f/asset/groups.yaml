- md: '

    ### Bitwise AND `&`


    The bitwise AND operator `&` performs a bitwise AND operation between corresponding
    bits of two integers.


    ```cpp

    int x = 5; // Binary: 0101

    int y = 3; // Binary: 0011

    int result = x & y; // Result: 0001 (decimal 1)

    ```


    ### Bitwise OR `|`


    The bitwise OR operator `|` performs a bitwise OR operation between corresponding
    bits of two integers.


    ```cpp

    int a = 5; // Binary: 0101

    int b = 3; // Binary: 0011

    int result = a | b; // Result: 0111 (decimal 7)

    ```


    ### Bitwise XOR `^`


    The bitwise XOR operator `^` performs a bitwise XOR (exclusive OR) operation between
    corresponding bits of two integers.


    ```cpp

    int p = 5; // Binary: 0101

    int q = 3; // Binary: 0011

    int result = p ^ q; // Result: 0110 (decimal 6)

    ```


    ### Bitwise NOT `~`


    The bitwise NOT operator `~` inverts (flips) all the bits of an integer.


    ```cpp

    int num = 5; // Binary: 0000 0101

    int result = ~num; // Result: 1111 1010 (decimal -6 due to two''s complement representation)

    ```


    ### Left Shift `<<`


    The left shift operator `<<` shifts the bits of an integer to the left by a specified
    number of positions.


    ```cpp

    int x = 5; // Binary: 0000 0101

    int result = x << 2; // Result: 0001 0100 (decimal 20)

    ```


    ### Right Shift `>>`


    The right shift operator `>>` shifts the bits of an integer to the right by a
    specified number of positions.


    ```cpp

    int a = 20; // Binary: 0001 0100

    int result = a >> 2; // Result: 0000 0101 (decimal 5)

    ```


    Bitwise operators are used in scenarios where you need to manipulate individual
    bits within integers, such as in low-level hardware programming and certain algorithms.


    ## Ternary Operator `?:`


    The ternary operator `?:` is a conditional operator that allows you to write compact
    conditional expressions. It''s also known as the conditional operator.


    ```cpp

    condition ? expression_if_true : expression_if_false

    ```


    The `condition` is evaluated first. If it''s `true`, the expression before the
    `:` is executed; otherwise, the expression after the `:` is executed.


    ```cpp

    int age = 18;

    std::string message = (age >= 18) ? "Adult" : "Minor";

    ```


    In this example, if `age` is greater than or equal to `18`, the `message` will
    be assigned the value "Adult"; otherwise, it will be assigned "Minor".


    The ternary operator is handy for writing concise conditional assignments and
    can make your code more readable when used appropriately.


    ## Operator Precedence


    Operators in C++ have a specific precedence, which determines the order in which
    they are evaluated combined in an expression. It''s important to understand operator
    precedence to avoid unexpected results in your code.


    Here''s a simplified overview of operator precedence from highest to lowest:


    - 1. Parentheses `()`: Highest precedence; used to group expressions and override
    default precedence.

    - 2. Postfix increment/decrement `x++`, `x--`: Next highest precedence; modifies
    the variable and returns its current value.

    - 3. Prefix increment/decrement `++x`, `--x`: Same as postfix but returns the
    updated value.

    - 4. Arithmetic operators `+`, `-`, `*`, `/`, `%`: These operators perform basic
    mathematical operations.

    - 5. Bitwise operators `&`, `|`, `^`, `~`, `<<`, `>>`: Used for bitwise manipulation.

    - 6. Comparison operators `==`, `!=`, `<`, `>`, `<=`, `>=`: Used for comparisons.

    - 7. Logical operators `&&`, `||`, `!`: Used for combining boolean expressions.

    - 8. Ternary operator `?`: Used for conditional expressions.

    - 9. Assignment operators `=`, `+=`, `-=` etc.: Lowest precedence; used for assignment
    and calculations.


    Remember that parentheses can be used to change the order of evaluation and explicitly
    specify the desired precedence.


    ## Expressions


    An expression is a combination of operators, operands, and variables that produces
    a value. Expressions can be simple, involving just one variable, or complex, involving
    multiple operators and operands. Here are some examples of expressions:


    ```cpp

    int sum = 3 + 4; // Simple expression that calculates the sum.

    bool isTrue = (x > 5) && (y <= 10); // Complex expression combining comparisons.

    int result = (a * b) + (c / d) - (e % f); // Expression with arithmetic operators.

    ```


    In C++, expressions are used extensively to perform calculations, make decisions,
    and manipulate data.


    ## Summary


    In this chapter, we''ve explored bitwise operators, the ternary operator, operator
    precedence, and expressions. We''ve seen how bitwise operators allow for bit manipulation,
    how the ternary operator provides a concise syntax for conditional assignments,
    why operator precedence is crucial for correct evaluation, and finally we''ve
    looked at how expressions are constructed in C++. These concepts are fundamental
    to writing effective C++ programs.

