    \ the `number` variable by reference to the `modifyValue` function, which then\
    \ modifies the original `number` variable.\n\n### Differences Between Pointers\
    \ and References\n\nWhile pointers and references both provide ways to indirectly\
    \ access and modify variables, there are some important differences between them:\n\
    \n- **Initialization**: References must be initialized when declared, and they\
    \ cannot be changed to refer to a different variable. Pointers can be declared\
    \ without initialization or can be changed to point to different variables.\n\
    - **Nullability**: Pointers can be null (pointing to no valid memory location),\
    \ while references always refer to valid objects.\n- **Arithmetic**: Pointers\
    \ support arithmetic operations, such as pointer addition and subtraction, while\
    \ references do not.\n"
