- md: "\n### Abstract Classes\n\nAn abstract class is a class that cannot be instantiated\
    \ and is typically used as a base class for other classes. Abstract classes often\
    \ contain one or more pure virtual functions, which are declared with the `virtual`\
    \ keyword and have no implementation in the base class. Derived classes must provide\
    \ implementations for all pure virtual functions, making them concrete classes.\n\
    \nHere's an example of an abstract class:\n\n```cpp\nclass Shape {\npublic:\n\
    \    virtual double area() const = 0; // Pure virtual function\n    virtual double\
    \ perimeter() const = 0; // Pure virtual function\n};\n```\n\nIn this code, the\
    \ `Shape` class is abstract and defines two pure virtual functions: `area` and\
    \ `perimeter`. Derived classes, such as `Circle` or `Rectangle`, must implement\
    \ these functions to become concrete classes.\n\n### Encapsulation\n\nEncapsulation\
    \ is one of the key principles of OOP that involves bundling data (attributes)\
    \ and the methods (functions) that operate on that data into a single unit called\
    \ a class. It also includes controlling access to the data by defining access\
    \ specifiers (public, protected, private). Encapsulation helps in hiding the internal\
    \ details of a class and provides a clear interface for interacting with objects.\n\
    \nHere's an example of encapsulation:\n\n```cpp\nclass BankAccount {\nprivate:\n\
    \    double balance;\n\npublic:\n    BankAccount(double initialBalance) {\n  \
    \      balance = initialBalance;\n    }\n\n    double getBalance() const {\n \
    \     return balance;\n    }\n\n    void deposit(double amount) {\n      if (amount\
    \ > 0) {\n        balance += amount;\n      }\n    }\n\n    void withdraw(double\
    \ amount) {\n      if (amount > 0 && amount <= balance) {\n        balance -=\
    \ amount;\n      }\n    }\n};\n```\n\nIn this code, the `balance` attribute is\
    \ encapsulated within the `BankAccount` class. Access to the `balance` is controlled\
    \ through the `getBalance`, `deposit`, and `withdraw` methods.\n\n## Conclusion\n\
    \nObject-Oriented Programming is a powerful programming paradigm that allows you\
    \ to create organized, reusable, and efficient code by modeling real-world entities\
    \ as objects. In C++, classes and objects serve as the foundation of OOP, providing\
    \ a structured way to encapsulate data and behavior.\n\nInheritance, polymorphism,\
    \ and encapsulation are key concepts in OOP that enable you to create complex\
    \ and flexible software systems. Understanding how to design and implement classes,\
    \ use inheritance to create hierarchies of classes, and leverage polymorphism\
    \ for dynamic behavior is essential for writing maintainable and extensible C++\
    \ code.\n\n## Chapter 10: Classes and Objects\n\nIn this chapter, we will delve\
    \ deeper into the concept of classes and objects in C++. Classes serve as blueprints\
    \ for creating objects, allowing you to structure your code in an organized and\
    \ modular way. Understanding how to define classes, create objects, and work with\
    \ their attributes and methods is fundamental to object-oriented programming (OOP)\
    \ in C++.\n\n## Defining Classes\n\n### Anatomy of a Class\n\nA class in C++ is\
    \ a user-defined data type that encapsulates data (attributes) and functions (methods)\
    \ that operate on data. Think of a class as a template for creating objects with\
    \ specific behaviors and characteristics. To define a class, you use the `class`\
    \ keyword followed by the class name and a pair of curly braces.\n\nHere's a basic\
    \ structure of a class:\n\n```cpp\nclass Class {\n  // Member variables (attributes)\n\
    \  data_type attribute1;\n  data_type attribute2;\n\npublic:\n  // Member functions\
    \ (methods)\n  return_type method1(parameters);\n  return_type method2(parameters);\n\
    };\n```\n\nLet's break down the components of a class:\n\n- class ClassName: The\
    \ `class` keyword is used to declare a class, and `ClassName` is the name of the\
    \ class, which you can choose to be descriptive of its purpose.\n- Member Variables\
    \ (Attributes): These are variables declared within the class, defining the data\
    \ that the class will hold. They are often private to the class to enforce encapsulation.\n\
    - Member Functions (Methods): These are functions declared within the class that\
    \ define the behaviors and actions objects of the class can perform. They can\
    \ be public, protected, or private, controlling their accessibility.\n\n### Example\
    \ Class Definition\n\nLet's create a simple class called `Person` to illustrate\
    \ the concept:\n\n```cpp\nclass Person {\nprivate:\n    std::string name;\n  \
    \  int age;\n\npublic:\n  // Constructor\n  Person(std::string n, int a) : name(n),\
    \ age(a) {}\n\n  // Member function to get the name\n  std::string getName() {\n\
    \    return name;\n  }\n\n  // Member function to get the age\n  int getAge()\
    \ {\n    return age;\n  }\n};\n```\n\nIn this `Person` class:\n\n- We have two\
    \ private member variables, `name` and `age`, which are not directly accessible\
    \ from outside the class to maintain encapsulation.\n- There's a constructor that\
    \ allows us to initialize the `name` and `age` attributes when creating a `Person`\
    \ object.\n- Two public member functions, `getName` and `getAge`, provide access\
    \ to the private attributes. These functions allow us to retrieve the values of\
    \ `name` and `age` safely.\n\n## Creating Objects\n\nOnce you have defined a class,\
    \ you can create objects (instances) of it. Objects are instances of the class\
    \ and can be manipulated to perform actions. To create an object, you use the\
    \ class name.\n\nHere's how you create an object:\n\n```cpp\nClassName objectName;\
    \ // Create an object of the class\n```\n\nIn our `Person` example, you create\
    \ a `Person` object like this:\n\n```cpp\nPerson person1(\"Alice\", 30); // Create\
    \ a Person object with name \"Alice\" and 30\n```\n\nIn this code, `person1` is\
    \ an object of the `Person` class. We pass the values \"Alice\" and 30 to the\
    \ constructor to initialize its attributes.\n\n## Accessing Attributes and Methods\n\
    \nOnce you have created an object, you can access its attributes and methods using\
    \ the dot (`.`) operator. This operator allows you to interact with the object\
    \ and perform various operations.\n\n### Accessing Attributes\n\nTo access the\
    \ attributes (member variables) of an object, use the dot operator followed by\
    \ the attribute name. However, keep in mind that if the attributes are defined\
    \ as private, you should use public member functions (methods) to access them.\n\
    \nHere's how you access attributes:\n\n```cpp\nobjectName.attributeName = value;\
    \ // Set the value of an attribute\ndata_type attributeValue = objectName.attributeName;\
    \ // Get the value of an attribute\n```\n\nFor our `Person` class, you can access\
    \ the `name` and `age` attributes as follows:\n\n```cpp\nstd::string name = person1.getName();\
    \ // Get the name attribute\nint age = person1.getAge(); // Get the age attribute\n\
    ```\n\n### Invoking Methods\n\nMethods (member functions) define the behavior\
    \ of objects. You can invoke methods on objects to perform specific actions or\
    \ retrieve data. To call a method on an object, use the dot operator followed\
    \ by the method name and any required parameters.\n\n```cpp\nobjectName.methodName(parameters);\
    \ // Call a method\n```\n"
  mdcn: "\n\n### 抽象类\n\n抽象类是一种不能实例化的类，通常作为其他类的基类。抽象类通常包含一个或多个纯虚拟函数，这些函数用 `virtual`\
    \ 关键字声明且在基类中没有实现。派生类必须为所有纯虚拟函数提供实现，从而成为具体类。\n\n这里有一个抽象类的示例：\n\n```cpp\nclass Shape\
    \ {\npublic:\n    virtual double area() const = 0; // Pure virtual function\n\
    \    virtual double perimeter() const = 0; //``` virtual在这个代码```\n`Shape` 类是抽象的\
    \ 类定义了两个纯虚拟函数：`area` 和 `perimeter`。派生类（如 `Circle` 或 `Rectangle`）必须实现这些函数才能成为具体类。\n\
    \n### 封装\n\n封装是面向对象编程（OOP）的核心原则之一，涉及将数据（属性）和操作数据的方法（函数）封装在一个称为类的单一单元中。它还包括通过定义访问修饰符（public、protected、private）来控制对数据的访问。封装有助于隐藏类的内部细节，并为与对象的交互提供清晰的接口。\n\
    \n这里有一个封装的示例：\n\n```cpp\nclass BankAccount {\nprivate:\n    double balance;\n\n\
    public:\n    BankAccount(double initialBalance) {\n        balance = initialBalance;\n\
    \    }\n\n    double getBalance() const {\n      return balance;\n    }\n\n  \
    \  void deposit(double amount) {\n      if (amount > 0) {\n        balance +=\
    \ amount;\n      }\n    }\n\n    void withdraw(double amount) {\n      if (amount\
    \ > 0 && amount <= balance) {\n        balance -= amount;\n      }\n    }\n};\n\
    ```\n\n在此代码中，`balance` 属性被封装在 `BankAccount` 类中。对 `balance` 的访问通过 `getBalance`、`deposit`\
    \ 和 `withdraw` 方法控制。\n\n## 结论\n\n面向对象编程是一种强大的编程范式，允许你通过将现实实体建模为对象来创建组织化、可重用且高效的代码。在\
    \ C++ 中，类和对象是 OOP 的基础，为封装数据和行为提供了结构化的方法。\n\n继承、多态和封装是 OOP 中的关键概念，使能够创建复杂且灵活的软件系统。理解如何设计和实现类、使用继承创建类层次结构，以及利用多态实现动态行为，对于编写可维护且可扩展的\
    \ C++ 代码至关重要。\n\n## 第 10 章：类与对象\n\n在本章中，我们将深入探讨 C++ 中类和对象的概念。类作为创建对象的蓝图，允许你以组织化和模块化的方式结构化代码。理解如何定义类、创建对象以及处理它们的属性和方法，是\
    \ C++ 面向对象编程（OOP）的基础的基础。\n\n## 定义类\n\n### 类的解剖结构\n\nC++ 中的类是一种用户定义的数据类型，它封装了数据（属性）和操作数据的函数（方法）。可以将类类为创建具有特定行为和特征的对象的模板。要定义一个类，你使用\
    \ `class` 关键字，后跟类名和一对大括号。\n\n这里是类的基本结构：\n\n```cpp\nclass Class {\n  // Member\
    \ variables (attributes)\n  data_type attribute1;\n  data_type attribute2;\n\n\
    public:\n  // Member functions (methods)\n  return_type method1(parameters);\n\
    \  return_type method2(parameters);\n};\n```\n\n让我们来拆解类的组件：\n\n- class ClassName:\
    \ 使用 `class` 关键字声明类，`ClassName` 是类的名称，你可以选择一个描述其用途的名字。\n- 成员变量（属性）：这些是在类内部声明的变量，定义了类将持的数据。它们通常是类的私有的，以强制封装。\n\
    - 成员函数（方法）：这些是在类内部声明的函数，定义了类对象可以执行的行为和动作。它们可以是公共、受保护或私有的，从而控制它们的访问权限。\n\n### 示例类定义\n\
    \n让我们创建一个名为 `Person` 的简单类来演示这一概念：\n\n```cpp\nclass Person {\nprivate:\n    std::string\
    \ name;\n    int age;\n\npublic:\n  // Constructor\n  Person(std::string n, int\
    \ a) : name(n), age(a) {}\n\n  // Member function to get the name\n  std::string\
    \ getName() {\n    return name;\n  }\n\n  // Member function to get the age\n\
    \  int getAge() {\n    return age;\n  }\n};\n```\n\n在这个 `Person` 类中：\n\n- 我们有两个私有成员变量\
    \ `name` 和 `age`，它们不能从类外部直接访问，以保持封装。\n- 有一个构造函数，允许我们在创建 `Person` 对象时初始化 `name`\
    \ 和 `age` 属性。\n- 两个公共成员函数 `getName` 和 `getAge` 提供了访问私有属性的方法。这些函数允许我们安全地检索 `name`\
    \ 和 `age` 的值。\n\n## 创建对象\n\n一旦定义了类，你就可以创建它的对象（实例）。对象是类的实例，可以通过操作它们来执行动作。要创建一个对象，你使用类名。\n\
    \n以下是创建对象的方法：\n\n```cpp\nClassName objectName; // 创建一个类的对象\n```\n\n在我们的 `Person`\
    \ 示例中，你这样创建一个 `Person` 对象：\n\n```cpp\nPerson person1(\"Alice\", 30); // 创建一个名为\
    \ \"Alice\" 且年龄为30的 Person 对象\n```\n\n在此代码中，`person1` 是 `Person` 类的一个对象。我们将 \"\
    Alice\" 和 30 传递给构造函数以初始化其属性。\n\n## 访问属性和方法\n\n一旦创建了对象，你就可以使用点运算符来访问它的属性和方法。该运算符允许你与对象交互并执行各种操作。\n\
    \n### 访问属性\n\n要访问对象的属性（成员变量），使用点运算符后跟属性名。但请记住，如果属性被定义为私有，你应该使用公共成员函数（方法）来访问它们。\n\
    \n访问属性的方法如下：\n\n```cpp\nobjectName.attributeName = value; // 设置属性值\ndata_type\
    \ attributeValue = objectName.attributeName; // 获取属性值\n```\n\n对于我们的 `Person` 类，你可以这样访问\
    \ `name` 和 `age` 属性：\n\n```cpp\nstd::string name = person1.getName(); // 获取名称属性\n\
    int age = person1.getAge(); // 获取年龄属性\n```\n\n### 调用方法\n\n方法（成员函数）定义了对象的行为。你可以在对象上调用方法来执行特定操作或检索数据。要在对象上调用方法，使用点运算符后跟方法名和任何所需的参数。\n\
    \n```cpp\nobjectName.methodName(parameters); // 调用方法\n```\n\n"
