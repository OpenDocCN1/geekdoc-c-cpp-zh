    \n当我们调用 `baseObj.display()` 时，调用的是基类的 `display()` 方法，而不是派生类的，因为 `baseObj` 是一个\
    \ `Base` 对象。\n\n## 结论：构建层次结构与拥抱活性\n\n继承和多态是 C++ 和面向对象编程的基础概念。继承允许你创建类层次结构、重用代码并在类之间建立逻辑关系。它使你能够结构化和组织化的类结构设计软件系统。\n\
    \n另一方面，多态使你的代码能够以统一的方式处理不同类的对象。它促进了灵活性和适应性，使软件更加健壮且易于维护。\n\n理解如何设计类层次结构、利用继承以及利用多态，对于在\
    \ C++ 中构建复杂且可扩展的软件系统非常重要。这些概念为创建能够适应不断变化的需求且组织良好的代码提供了基础。\n\n## 第 12 章：模板与泛型编程\n\
    \n模板和泛型编程是 C++ 中强大的特性，允许你编写灵活、可重用的代码以处理不同的数据类型。在本章中，我们将探索模板的概念，学习如何创建泛型函数和类，并理解模板如何有助于\
    \ C++ 程序的通用性和效率。\n\n## 泛型编程的必要\n\n在编写 C++ 代码时，经常会遇到这样的情况：你想创建一个可以处理多种数据类型的函数或类。例如，你可能需要一个排序算法，可以对整数数组、浮点数甚至自定义对象进行排序。为每种数据类型编写单独的函数或类既不也不高效。\n\
    \n这就是泛型编程发挥作用的地方。它允许你编写独立于特定数据类型的代码，使你的代码更通用并减少冗余。模板是 C++ 泛型编程的基础。\n\n## 模板简介\n\
    \n### 什么是模板？\n\nC++ 中的模板是一种创建泛型代码的机制，可以在不牺牲类型安全的情况下操作不同的数据类型。模板本质上是生成类或函数的蓝图。当你使用模板时，你定义了泛型结构，C++\
    \ 编译器会在你使用模板时为特定数据类型生成具体的代码。\n\n当你想要创建能够处理各种数据类型同时确保类型安全并最小化代码重复的算法、数据结构或函数时，模板特别有用。\n\
    \n### 函数模板\n\n函数模板允许你创建可以处理不同数据类型的泛型函数。以下是定义函数模板的基本语法：\n\n```cpp\ntemplate <typename\
    \ T>\nT add(T a, T b) {\n    return a + b;\n}\n```\n\n在例示例中，`add` 是一个接受两个 `T`\
    \ 类型参数并返回它们的和的函数。`<typename>` 部分指定了模板参数，`T` 是实际数据类型的占位符。然后你可以对各种数据类型（如 `int` 或\
    \ `double`）使用此模板：\n\n```cpp\nint result1 = add<int>(5, 10);      // Calls add<int>\n\
    double result2 = add<double>(3.5, 2.7); // Calls add<double>\n```\n\n### 类模板\n\
    \n类模板将模板的概念扩展到类。它们允许你创建可以处理不同类型的泛型类。这里有一个栈的示例：\n\n```cpp\ntemplate <typename T>\n\
    class Stack {\nprivate:\n    std::vector<T> elements;\n\npublic:\n  void push(T\
    \ value) {\n    elements.push_back(value);\n  }\n\n  T pop() {\n    if (empty())\
    \ {\n      throw std::runtime_error(\"Stack is empty\");\n    }\n    T top = elements.back();\n\
    \    elements.pop_back();\n    return top;\n  }\n\n  bool empty() const {\n  \
    \  return elements.empty();\n  }\n};\n```\n\n然后你可以为不同的数据类型创建 `Stack` 实例：\n\n```cpp\n\
    Stack<int> intStack;\nStack<double> doubleStack;\n```\n\n### 模板特化\n\n模板特化允许你为特定数据类型提供专门的实现，同时为其他类型保持泛型模板。当你需要对某些类型进行优化或自定义行为时，这种方法非常有用。\n\
    \n这里有一个计算数字平方的泛型函数的模板特化示例：\n\n```cpp\ntemplate <typename T>\nT square(T x) {\n\
    \    return x * x;\n}\n\n// 针对 char 的模板特化\ntemplate <>\nchar square<char>(char\
    \ x) {\n    return '!';\n}\n```\n\n### 模板参数\n\n模板参数是在模板内部使用的数据类型或值的占位符。模板参数分为两类：类型参数（typename\
    \ 或 class）和非类型参数（int、double 等）。\n\n这里是一个同时包含类型参数和非类型参数的函数模板示例：\n\n```cpp\ntemplate\
    \ <typename T, int N = 2>\nT multiplyBy(T value) {\n  return value * N;\n}\n```\n\
    \n在此模板中，`T` 是类型参数，而 `N` 是一个默认值为 2 的非类型参数。你可以用不同的数据类型和 `N` 的值使用此模板。\n\n"
