    # ## CSS Positioning


    CSS positioning is a critical concept for controlling the placement of elements
    within a web page''s layout. The `position` property plays a central role in positioning,
    and it offers several values:


    +   - **static:**: This is the default value, and elements follow the normal document
    flow. They are not affected by top, right, bottom, or left properties, nor are
    they relative to their parent or other elements.


    +   - **relative:**: Elements with `position: relative;` are positioned relative
    to their normal position in the document flow. You can use top, right, bottom,


    and left properties to adjust their position without affecting surrounding elements.


    +   - **absolute:**: Elements with `position: absolute;` are removed from the
    normal document flow and positioned relative to their closest positioned ancestor.
    If no ancestor is positioned, they are positioned relative to the initial containing
    block (usually the viewport).'
