    \ the ternary...\n\n## Looping with `while`\n\nLoops are essential for executing\
    \ a block of code repeatedly. One of the simplest looping structures in C++ is\
    \ the `while` loop. It repeatedly executes a block of code as long as a specified\
    \ condition is true. Here's the basic syntax:\n\n```cpp\nwhile (condition) {\n\
    \    // Code to execute while 'condition' is true\n}\n```\n\nLet's look at a practical\
    \ example:\n\n```cpp\n#include <iostream>\n\nint main() {\n    int count = 0;\n\
    \n    while (count < 5) {\n        std::cout << \"Count: \" << count << std::endl;\n\
    \        count++;\n    }\n\n    return 0;\n}\n```\n\nIn this example, we declare\
    \ a variable `count` and use `while` loop to print its value while the condition\
    \ `count < 5` is true. After each iteration, `count` is incremented by `1`. The\
    \ loop continues until `count` is no longer less than `5`.\n\n### Infinite Loops\n\
    \nBe cautious when using `while` loops, as they can lead to infinite loops if\
    \ not properly controlled. An infinite loop is a loop that never terminates because\
    \ its condition is always true. Here's an example:\n\n```cpp\nwhile (true) {\n\
    \  // This is an infinite loop\n}\n```\n\nTo avoid infinite loops, make sure your\
    \ loop's condition will eventually become false. In the previous example, `count`\
    \ eventually becomes `5`, causing the loop to terminate.\n\n### The `do-while`\
    \ Loop\n\nAnother `do-while` construct in C++ is the `do-while` loop. It's similar\
    \ to the `while` loop but with one key difference: it always executes its block\
    \ of code at least once before checking the condition. Here's the syntax:\n\n\
    ```cpp\ndo {\n  // Code to execute at least once\n} while (condition);\n```\n\n\
    Let's see an example:\n\n```cpp\n#include <iostream>\n\nint main() {\n  int count\
    \ = 0;\n\n  do {\n    std::cout << \"Count: \" << count << std::endl;\n    count++;\n\
    \  } while (count < 5);\n\n  return 0;\n}\n```\n\nIn this example, the code inside\
    \ the `do` block is executed first, and then the condition `count < 5` is checked.\
    \ If the condition is true, the loop continues; otherwise, it terminates. This\
    \ guarantees that the code inside the `do` block runs at least once.\n\n### Controlling\
    \ Loops with `break` and `continue`\n\nYou can use the `break` statement to exit\
    \ a loop prematurely. When a `break` statement is encountered within a loop, the\
    \ loop immediately terminates, and the program continues with the next statement\
    \ after the loop. Here's an example:\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    for (int i = 0; i < 10; i++) {\n        if (i == 5) {\n            std::cout\
    \ << \"Loop terminated at i = \" << i << std::endl;\n            break; // Exit\
    \ the loop when i equals 5\n        }\n        std::cout << \"i = \" << i << std::endl;\n\
    \    }\n    return 0;\n}\n```\n\nIn this example, the `break` statement is triggered\
    \ when `i` equals `5`, causing the loop to terminate prematurely.\n\nThe `continue`\
    \ statement, on the other hand, allows you to skip the current iteration of a\
    \ loop and proceed to the next iteration. Here's an example:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n  for (int i = 0; i < 5; i++) {\n    if (i == 2)\
    \ {\n      std::cout << \"Skipping i = \" << i << std::endl;\n      continue;\
    \ // Skip the rest of the loop body for i = 2\n    }\n    std::cout << \"i = \"\
    \ << i << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example, when `i` is\
    \ equal to `2`, the `continue` statement is encountered, and the loop proceeds\
    \ to the next iteration, skipping the rest of the loop body for that specific\
    \ value of `i`.\n\n### Loop Control with `break` and `continue`\n\nLoop control\
    \ statements like `break` and `continue` provide you with the ability to fine-tune\
    \ the behavior of your loops. Whether you need to exit a loop prematurely or skip\
    \ specific iterations, these statements can help you achieve precise control over\
    \ your loops.\n\n## Iterating with `for` Loops\n\nThe `for` loop is a versatile\
    \ construct that allows you to specify initialization, condition, and iteration\
    \ in a single line. Its syntax is as follows:\n\n```cpp\nfor (initialization;\
    \ condition; iteration) {\n  // Code to execute while 'condition' is true\n}\n\
    ```\n\nLet's break down the components of a `for` loop:\n\n- **Initialization**:\
    \ This part is executed once at the beginning of the loop to initialize loop variables.\n\
    - **Condition**: The loop continues as long as this is true. If it evaluates to\
    \ false, the loop terminates.\n- **Iteration**: After each iteration, this part\
    \ is used to update loop variables.\n\nHere's an example:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    for (int i = 0; i < 5; i++) {\n        std::cout\
    \ << \"Iteration \" << i << std::endl;\n    }\n\n    return 0;\n}\n```\n\nIn this\
    \ example, the `for` loop initializes `i` to `0`, continues as long as `i` is\
    \ less than `5`, and increments `i` by `1` after each iteration.\n\n### Multiple\
    \ Initialization and Iteration\n\nYou can have multiple initialization and iteration\
    \ expressions in a `for` loop, separated by commas. This allows you to work with\
    \ multiple variables simultaneously. Here's an example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    for (int i = 0, j = 10; i < 5 && j > 5; i++, j--) {\n    \
    \    std::cout << \"i = \" << i << \", j = \" << j << std::endl;\n    }\n\n  \
    \  return 0;\n}\n```\n\n### Infinite `for` Loops\n\nJust like `while` loops, be\
    \ cautious when using `for` loops to avoid infinite loops. Make sure your loop's\
    \ condition will eventually become false.\n\n## Looping with `for-each`\n\nC++\
    \ offers a convenient way to iterate over elements in a collection (e.g., arrays,\
    \ vectors) using a `for-each` loop. This loop is also known as a range-based `for`\
    \ loop. It simplifies the process of iterating over elements without needing explicit\
    \ indices. Here's the syntax:\n\n```cpp\nfor (element_type element : collection)\
    \ {\n  // Code to process 'element'\n}\n```\n\nLet's see an example using array:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  int numbers[] = {1, 2, 3, 4,\
    \ 5};\n\n  for (int number : numbers) {\n    std::cout << \"Number: \" << number\
    \ << std::endl;\n  }\n\n  return 0;\n}\n```\n\nIn this example, the `for-each`\
    \ loop iterates over each element in the `numbers` array, and the current element\
    \ is stored in the variable `number`. The loop prints each number to the console.\n"
