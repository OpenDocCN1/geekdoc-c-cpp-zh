    \n### ### 1. Flexbox 布局\n\nFlexbox 是一种强大的布局模型，允许你创建灵活且响应式的布局。它对于在容器内对齐和分配元素特别有用，即使当这些元素的大小未知或动态时也是如此。\n\
    \n```css\n/* flex 容器和 flex 项目示例 */\n.flex-container {\n  display: flex;\n  justify-content:\
