    ```

    grid-template-rows: 100px 200px; /* Two rows with

    specific heights */

    grid-template-columns: 1fr 2fr; /* Two columns with

    relative widths */

    }

    ```


    # #### 3. **Grid Placement**


    Grid items can be placed explicitly into specific grid cells using properties
    like `grid-row` and `grid-column`. This precise placement gives you granular control
    over your layout.


    ```

    ```css

    /* Placing grid items into specific cells */

    .item {

    grid-row: 1 / 3; /* Item spans from row 1 to row 3 */

    grid-column: 2; /* Item placed in the second column */

    }

    ```

    ```


    # #### 4. **Alignment and Spacing**


    Grid provides properties like `justify-items` and `align-items` to align items
    within their grid cells. You can also'
  - "[PAGE 396]\n\ncontrol the spacing between grid items using properties like `grid-gap`.\n\
    \n```\ncss\n/* Aligning and spacing grid items */\n.container {\n  justify-items:\
    \ center; /* Horizontally centers items within cells */\n  align-items: end; /*\
    \ Vertically aligns items to the bottom of cells */\n  grid-gap: 10px; /* Specifies\
    \ the gap between grid items */\n}\n```\n\n# #### 5. **Auto Placement and Sizing**\n\
    \nGrid offers automatic placement for grid items using the `grid-auto-flow` property.\
    \ You can also use `auto` to allow grid items to size themselves based on their\
    \ content.\n\n```\ncss\n/* Automatic placement and sizing of grid items */\n.container\
    \ {\n  grid-auto-flow: row; /* Items flow in rows (default) */\n}\n```"
