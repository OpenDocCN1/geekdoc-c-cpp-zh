    # ## CSS Selectors


    Selectors are the keys to targeting specific HTML elements for styling. CSS offers
    a variety of selectors to suit different needs. Here are some commonly used selectors:


    - **Element Selector:**** Selects all instances of a particular HTML element.
    For example, `p` selects all `<p>` elements on the page.


    - **Class Selector:**** Selects elements with a specific class attribute. For
