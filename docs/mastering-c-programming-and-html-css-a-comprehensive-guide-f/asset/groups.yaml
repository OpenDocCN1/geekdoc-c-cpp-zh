    \ an existing variable using the address-of operator `&`. Here's an example:\n\
    \n```cpp\nint number = 42; // Declare and initialize an integer variable\nint*\
    \ ptrToNumber; // Declare an integer pointer\nptrToNumber = &number; // Initialize\
