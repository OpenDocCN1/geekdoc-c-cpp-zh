    \ as `private` in the derived class, making them inaccessible from outside the\
    \ base class.\n\nHere's an example:\n\n```\n```cpp\nclass BaseClass {\n  public:\n\
    \    int publicMember;\n  protected:\n    int protectedMember;\n  private:\n \
    \   int privateMember;\n};\n```\n```"
