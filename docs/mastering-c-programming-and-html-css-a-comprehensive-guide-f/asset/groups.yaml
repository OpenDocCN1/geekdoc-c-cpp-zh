    # # Chapter 11: Inheritance and Polymorphism


    Inheritance and polymorphism are two fundamental concepts in object-oriented programming
    (OOP) that enable the creation of hierarchies of classes and the development of
    flexible, extensible code. In this chapter, we will explore the core principles
    of inheritance, understand how it facilitates code reuse, and delve into the concept
    of polymorphism, where objects of different classes can be treated in a unified
    manner.


    # ## Inheritance: Building on Existing Classes


    # ### The Concept of Inheritance


    Inheritance is a fundamental concept in OOP that allows you to create new classes
    based on existing classes. Inheritance establishes an "is-a" relationship between
    classes, where a new class, known as the derived or child class, inherits attributes
    and behaviors from an existing class, known as the base or parent class. This
    mechanism enables code reuse, hierarchy modeling, and the organization of classes
    into logical structures.


    The derived class inherits the properties and methods of the base class, and it
    can also add its own unique attributes and behaviors. This inheritance relationship
    forms a hierarchy, where the derived class is a specialized version of the base'
- md: "\nclass. The primary goal of inheritance is to promote code reusability and\
    \ maintain a clear and logical class structure.\n\n### Base and Derived Classes\n\
    \nTo create an inheritance relationship in C++, you define a base class and a\
    \ derived class. The base class contains common attributes and behaviors that\
    \ are shared among related classes, while the derived class inherits these members\
    \ and extends or specializes them.\n\nHere's the basic syntax for defining a derived\
    \ class:\n\n```cpp\nclass BaseClass {\n    // Base class members\n}\nclass DerivedClass\
    \ : accessSpecifier BaseClass {\n    // Derived class members\n}\n```\n\n- `BaseClass`:\
    \ The name of the base class.\n- `DerivedClass`: The name of the derived class.\n\
    - `accessSpecifier`: Specifies the access control for the inheritance relationship\
    \ (public, protected, or private). This determines how the base class members\
    \ are accessible in the derived class.\n\n### Access Control in Inheritance\n\n\
    C++ provides three access control specifiers for inherited members: `public`,\
    \ `protected`, and `private`. These specifiers control how the inherited members\
    \ can be accessed within the derived class and from outside the class hierarchy.\n\
    \n- `public`: Inherited members retain their original access control. If a member\
    \ was `public` in the base class, it remains `public` in the derived class, and\
    \ it can be accessed from outside the derived class.\n\n- `protected`: Inherited\
    \ members are treated as `protected` in the derived class, meaning they can only\
    \ be accessed within the derived class or its subclasses. They are not directly\
    \ accessible from outside the class hierarchy.\n\n- `private`: Inherited members\
    \ are treated as `private` in the derived class, making them inaccessible from\
    \ outside the base class. This level of access control is rarely used in practice.\n\
    \nHere's an example illustrating access control in inheritance:\n\n```cpp\nclass\
    \ BaseClass {\npublic:\n    int publicMember;\n    void publicMethod() {\n   \
    \ // ...\n  }\n\nprotected:\n    int protectedMember;\n    void protectedMethod()\
    \ {\n    // ...\n  }\n\nprivate:\n    int privateMember;\n    void privateMethod()\
    \ {\n    // ...\n  }\n};\n\nclass DerivedClass : public BaseClass {\n    // Inherited\
    \ members retain their access control\n    // publicMember and publicMethod are\
    \ public\n    // protectedMember and protectedMethod are protected\n    // privateMember\
    \ and privateMethod are not accessible\n};\n```\n\nIn this code, the `DerivedClass`\
    \ inherits members from `BaseClass` with the specified access control.\n\n###\
    \ Constructors and Destructors in Inheritance\n\nConstructors and destructors\
    \ play a vital role in the object's lifecycle when inheritance is involved. When\
    \ you have a base class and a derived class, the base class constructor is called\
    \ before the derived class constructor, and the base class destructor is called\
    \ after the derived class destructor.\n\nHere's how the constructor and destructor\
    \ calls work in inheritance:\n\n1. Base Class Constructor: When you create an\
    \ object of the derived class, the base class constructor is called first to initialize\
    \ the base class part of the object.\n2. Derived Class Constructor: After the\
    \ base class constructor completes, the derived class constructor is called to\
    \ initialize the derived class part of the object.\n3. Derived Class Destructor:\
    \ When the object goes out of scope or is explicitly deleted, the derived class\
    \ destructor is called first to perform cleanup specific to the derived class.\n\
    4. Base Class Destructor: After the derived class destructor completes, the base\
    \ class destructor is called to perform cleanup specific to the base class.\n\n\
    ### Example: Inheritance in Action\n\nLet's explore a practical example involving\
    \ shapes to illustrate inheritance. We'll start with a base class `Shape` that\
    \ defines common attributes and behaviors. Then, we'll create two derived classes,\
    \ `Circle` and `Rectangle`, which inherit from `Shape` and introduce their own\
    \ attributes and behaviors.\n\n```cpp\nclass Shape {\nprotected:\n    double width;\n\
    \    double height;\npublic:\n    Shape(double w, double h) : width(w), height(h)\
    \ {}\n    virtual double area() const {\n        return width * height;\n    }\n\
    };\n```\n\nclass Circle : public Shape {\nprivate:\n  double radius;\n\npublic:\n\
    \  Circle(double r) : Shape(0, 0), radius(r) {}\n  double area() const override\
    \ {\n    return 3.14159 * radius * radius;\n  }\n};\n\nclass Rectangle : public\
    \ Shape {\npublic:\n  Rectangle(double w, double h) : Shape(w, h) {}\n};\n```\n\
    \nIn this code:\n\n- `Shape` is the base class, containing attributes `width`\
    \ and `height` and a method `area()` to calculate the area.\n- `Circle` is a derived\
    \ class that inherits from `Shape`. It adds a `radius` attribute and overrides\
    \ the `area()` method to calculate the area of the circle.\n- `Rectangle` is another\
    \ derived class that inherits from `Shape`. It takes `width` and `height` as constructor\
    \ parameters.\n\nNow, let's create objects of these classes and demonstrate how\
    \ they can be used:\n\n```cpp\nCircle circle(5.0);\nRectangle rectangle(4.0, 6.0);\n\
    \nShape* shape1 = &circle;\nShape* shape2 = &rectangle;\n\ndouble area1 = shape1->area();\
    \ // Calls Circle's area()\ndouble area2 = shape2->area(); // Calls Rectangle's\
    \ area()\n```\n\nIn this example, we create `Circle` and `Rectangle` objects and\
    \ use pointers to `Shape` to demonstrate how objects of different classes can\
    \ be treated uniformly.\n\n## Polymorphism: Treating Objects in a Unified Way\n\
    \n### The Concept of Polymorphism\n\nPolymorphism is a fundamental concept in\
    \ OOP that allows objects of different classes to be treated as objects of a common\
    \ base class. It is achieved through function overriding and virtual functions.\
    \ The key idea behind polymorphism is that you can write generic code that operates\
    \ on a base class, and at runtime, the correct derived class version of a method\
    \ is called based on the actual type.\n\n### Function Overriding: The Heart of\
    \ Polymorphism\n\nFunction overriding is a critical aspect of polymorphism. It\
    \ occurs when a derived class provides a specific implementation of a method that\
    \ is already defined in the base class.\n\nHere's an example that demonstrates\
    \ function overriding:\n\n```cpp\nclass Animal {\npublic:\n    virtual void makeSound()\
    \ const {\n        std::cout << \"Animal makes a sound\" << std::endl;\n    }\n\
    };\n\nclass Dog : public Animal {\npublic:\n    void makeSound() const override\
    \ {\n        std::cout << \"Dog barks\" << std::endl;\n    }\n};\n```\n\n```cpp\n\
    Animal* animal1 = new Animal();\nAnimal* animal2 = new Dog();\n\nanimal1->makeSound();\
    \ // Calls Animal's makeSound()\nanimal2->makeSound(); // Calls Dog's makeSound()\n\
    ```\n\nIn this code, we create two pointers to the base class `Animal`. The first\
    \ pointer, `animal1`, points to an object of the `Animal` class, while the second\
    \ pointer, `animal2`, points to an object of the `Dog` class. When we call the\
    \ `makeSound()` method on these pointers, polymorphism comes into play:\n\n- `animal1->makeSound()`\
    \ calls the `makeSound()` method of the `Animal` class because it points to an\
    \ `Animal` object.\n- `animal2->makeSound()` calls the `makeSound()` method of\
    \ the `Dog` class because it points to a `Dog` object. This demonstrates dynamic\
    \ binding, where the correct method is determined at runtime based on the actual\
    \ object type.\n\n### Virtual Functions: The Foundation of Polymorphism\n\nTo\
    \ enable polymorphism and function overriding, you should declare base class functions\
    \ as `virtual`. A virtual function is a member function in the base class that\
    \ can be overridden by derived classes. It allows the correct derived class version\
    \ of the function to be called based on the object's actual type.\n"
  mdcn: "\n\n类。继承的主要目标是提高代码重用性，并保持类结构的清晰和逻辑。\n\n### 基类与派生类\n\n在 C++ 中创建继承关系，你需要定义一个基类和一个派生类。基类包含相关类共享的公共属性和行为，而派生类继承这些成员并对其进行扩展或特化。\n\
    \n以下是定义派生类的基本语法：\n\n```cpp\nclass BaseClass {\n    // 基类成员\n}\nclass DerivedClass\
    \ : accessSpecifier BaseClass {\n    // 派生类成员\n}\n```\n\n- `BaseClass`: 基类的名称。\n\
    - `DerivedClass`: 派生类的名称。\n- `accessSpecifier`: 指定继承关系的访问控制限定符（public、protected\
    \ 或 private）。这决定了基类成员在派生类中如何被访问。\n\n### 继承中的访问控制\n\nC++ 为继承的成员提供了三种访问控制限定符：`public`、`protected`\
    \ 和 `private`。这些限定符控制了在派生类内部以及从类层次外部访问这些继承成员的方式。\n\n- `public`: 继承的成员保留其原始的访问控制权限。如果一个成员在基类中是\
    \ `public`，那么它在派生类中仍然是 `public`，并且可以在派生类外部访问。\n\n- `protected`: 继承的成员在派生类中被视为\
    \ `protected`，这意味着它们只能在派生类或其子类内部访问。它们无法从类层次外部直接访问。\n\n- `private`: 继承的成员在派生类中被视为\
    \ `private`，导致它们无法从基类外部访问。这种级别的访问控制在实践中很少使用。\n\n以下是一个说明继承中访问控制的示例：\n\n```cpp\n\
    class BaseClass {\npublic:\n    int publicMember;\n    void publicMethod() {\n\
    \    // ...\n  }\n\nprotected:\n    int protectedMember;\n    void protectedMethod()\
    \ {\n    // ...\n  }\n\nprivate:\n    int privateMember;\n    void privateMethod()\
    \ {\n    // ...\n  }\n};\n\nclass DerivedClass : public BaseClass {\n    // 继承的成员保留其访问控制\n\
    \    // publicMember 和 publicMethod 是 public\n    // protectedMember 和 protectedMethod\
    \ 是 protected\n    // privateMember 和 privateMethod 无法访问\n};\n```\n\n在此段代码中，`DerivedClass`\
    \ 根据指定的访问控制继承了 `BaseClass` 的成员。\n\n### 继承中的构造函数与析构函数\n\n当涉及继承时，构造函数和析构函数在对象的生命周期中起着至关重要的作用。当你有一个基类和一个派生类时，基类构造函数会在派生类构造函数之前调用，基类析构函数会在派生类析构函数之后调用。\n\
    \n以下是继承中构造和析构函数的调用机制：\n\n1. 基类构造函数：当你创建一个派生类对象时，首先调用基类构造函数初始化对象的基类部分。\n2. 派生类构造函数：在基类构造函数完成后，调用派生类构造函数初始化对象的派生类部分。\n\
    3. 派生类析构函数：当对象超出范围或被显删除时，首先调用派生类析构函数执行派生类特定的清理工作。\n4. 基类析构函数：在派生类析构函数完成后，调用基类析构函数执行基类特定的清理工作。\n\
    \n### 示例：应用中的继承\n\n让我们通过一个涉及形状的实际示例来探索继承。我们将从定义了公共属性和行为的基类 `Shape` 开始。然后，我们将创建两个派生类\
    \ `Circle` 和 `Rectangle`，它们继承自 `Shape` 并引入了自身的属性和行为。\n\n```cpp\nclass Shape {\n\
    protected:\n    double width;\n    double height;\npublic:\n    Shape(double w,\
    \ double h) : width(w), height(h) {}\n    virtual double area() const {\n    \
    \    return width * height;\n    }\n};\n\nclass Circle : public Shape {\nprivate:\n\
    \  double radius;\n\npublic:\n  Circle(double r) : Shape(0, 0), radius(r) {}\n\
    \  double area() const override {\n    return 3.14159 * radius * radius;\n  }\n\
    };\n\nclass Rectangle : public Shape {\npublic:\n  Rectangle(double w, double\
    \ h) : Shape(w, h) {}\n};\n```\n\n在此段代码中：\n\n- `Shape` 是基类，包含属性 `width` 和 `height`\
    \ 以及一个计算面积的 `area()` 方法。\n- `Circle` 是一个继承自 `Shape` 的派生类。它添加了 `radius` 属性并重写了\
    \ `area()` 方法来计算圆的面积。\n- `Rectangle` 是另一个继承自 `Shape` 的派生类。它接受 `width` 和 `height`\
    \ 作为构造函数参数。\n\n现在，让我们创建这些类的对象并演示如何使用它们：\n\n```cpp\nCircle circle(5.0);\nRectangle\
    \ rectangle(4.0, 6.0);\n\nShape* shape1 = &circle;\nShape* shape2 = &rectangle;\n\
    \ndouble area1 = shape1->area(); // 调用 Circle 的 area()\ndouble area2 = shape2->area();\
    \ // 调用 Rectangle 的 area()\n```\n\n在这个示例中，我们创建了 `Circle` 和 `Rectangle` 对象，并使用指向\
    \ `Shape` 的指针来演示如何统一地处理不同类的对象。\n\n## 多态：以统一的方式处理对象\n\n### 多态的概念\n\n多态是 OOP 中的一个基本概念，它允许不同类的对象被视为同一种基类的对象。它是通过函数重写和虚函数实现的。多态背后的核心思想是：你可以编写对基类操作的通用代码，而在运行时，将根据实际类型调用派生类正确的方法版本。\n\
    \n### 函数重写：多态的核心\n\n函数重写是多态的一个关键方面。当派生类为基类中已定义的方法提供特定实现时就会发生重写。\n\n这是一个演示函数重写的示例：\n\
    \n```cpp\nclass Animal {\npublic:\n    virtual void makeSound() const {\n    \
    \    std::cout << \"Animal makes a sound\" << std::endl;\n    }\n};\n\nclass Dog\
    \ : public Animal {\npublic:\n    void makeSound() const override {\n        std::cout\
    \ << \"Dog barks\" << std::endl;\n    }\n};\n```\n\n```cpp\nAnimal* animal1 =\
    \ new Animal();\nAnimal* animal2 = new Dog();\n\nanimal1->makeSound(); // 调用 Animal\
    \ 的 makeSound()\nanimal2->makeSound(); // 调用 Dog 的 makeSound()\n```\n\n在此段代码中，我们创建了两个指向基类\
    \ `Animal` 的指针。第一个指针 `animal1` 指向 `Animal` 类对象，而第二个指针 `animal2` 指向 `Dog` 类对象。当我们通过这些指针调用\
    \ `makeSound()` 方法时，多态开始发挥作用：\n\n- `animal1->makeSound()` 调用 `Animal` 的 `makeSound()`\
    \ 方法，因为它指向一个 `Animal` 对象。\n- `animal2->makeSound()` 调用 `Dog` 的 `makeSound()` 方法，因为它指向一个\
    \ `Dog` 对象。这演示了动态绑定，即在运行时根据实际对象类型确定正确的方法。\n\n### 虚函数：多态的基础\n\n为了启用多态和函数重写，你应该将基类函数声明为\
    \ `virtual`。虚函数是基类中的成员函数，可以被派生类进行重写。它允许根据对象的实际类型调用派生类正确的函数版本。\n\n"
