- md: "\n- **Font Size (`font-size`):** Sets the size of text. You can use units like\
    \ pixels (e.g., `16px`), ems (e.g., `1.2em`), or percentages (e.g., `120%`).\n\
    \n- **Background Color (`background-color`):** Defines the background color of\
    \ an element, such as a div or a page section.\n\n- **Margin (`margin`):** Specifies\
    \ the space outside an element. You can set margins for individual sides (e.g.,\
    \ `margin-top`, `margin-right`, `margin-bottom`, `margin-left`) or use shorthand\
    \ (e.g., `margin: 10px 20px`).\n\n- **Padding (`padding`):** Sets the space between\
    \ an element's content and its border. Like margins, you can set padding for individual\
    \ sides or use shorthand.\n\n- **Border (`border`):** Adds a border around an\
    \ element. You can define the border's width, style, and color (e.g., `border:\
    \ 2px solid #000;`).\n\n- **Width and Height (`width` and `height`):** Control\
    \ the dimensions of elements. You can use units like pixels, percentages, or auto\
    \ (e.g., `width: 100%;`).\n\n- **Text Align (`text-align`):** Aligns text within\
    \ an element. Values include \"left,\" \"right,\" \"center,\" and \"justify\"\
    .\n\n- **Display (`display`):** Determines how an element is displayed in the\
    \ layout. Common values include \"block\" (elements stack vertically), \"inline\"\
    \ (elements flow horizontally), and \"none\" (element is hidden).\n\n- **Position\
    \ (`position`):** Specifies the positioning method for an element. Values include\
    \ \"static,\" \"relative,\" \"absolute,\" and \"fixed\".\n\nThese are just a few\
    \ examples, CSS offers many more properties and values to explore. As you gain\
    \ experience with CSS, you'll discover the versatility and flexibility it provides\
    \ for web design.\n\n## CSS Selectors\n\nSelectors are the keys to targeting specific\
    \ HTML elements for styling. CSS offers a variety of selectors to suit different\
    \ needs. Here are some commonly used selectors:\n\n- **Element Selector:** Selects\
    \ all instances of a particular HTML element. For example, `p` selects all `<p>`\
    \ elements on the page.\n\n- **Class Selector:** Selects elements with a specific\
    \ class attribute. For example, `.button` selects all elements with the class\
    \ \"button.\"\n\n- **ID Selector:** Selects a `single element` with a specific\
    \ ID attribute. For example, `#header` selects the element with the ID \"header.\"\
    \n\n- **Descendant Selector:** Selects an element that is a descendant of another\
    \ element. For example, `ul li` selects all `<li>` elements that are descendants\
    \ of `<ul>` elements.\n\n- **Child Selector:** Selects an element that is a direct\
    \ child of another element. For example, `ul > li` selects all `<li>` elements\
    \ that are direct children of `<ul>` elements.\n\n- **Attribute Selector:** Selects\
    \ elements with a specific attribute value. For example, `[type=\"text\"]` selects\
    \ all elements with a \"type\" attribute set to \"text.\"\n\n- **Pseudo-class\
    \ Selector:** Selects elements based on their state or position. For example,\
    \ `:hover` selects elements when the mouse pointer hovers over them.\n\n## Applying\
    \ CSS to HTML\n\nNow that we've explored CSS properties, values, and selectors,\
    \ let's see how we can apply CSS to our HTML documents. There are three primary\
    \ ways to do this:\n\n### 1. Inline CSS\n\nInline CSS is applied directly within\
    \ an HTML element using the `style` attribute. While it's convenient for making\
    \ quick style adjustments, it's not recommended for extensive styling, as it mixes\
    \ content with presentation.\n\n```html\n<p style=\"color: blue; font-size: 18px;\"\
    >This text is styled with inline CSS.</p>\n```\n\n### 2. Internal CSS\n\nInternal\
    \ CSS is placed within the `<style>` element in the `<head>` section of an HTML\
    \ document. This allows you to define styles for the entire page or specific elements.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\np {\ncolor: blue;\nfont-size:\
    \ 18px;\n}\n</style>\n</head>\n<body>\n<p>This text is styled with internal CSS.</p>\n\
    </body>\n</html>\n```\n\n### 3. External CSS\n\nExternal CSS involves creating\
    \ a separate CSS file with a `.css` extension and linking it to your HTML document\
    \ using the `<link>` element. This method is highly recommended for maintaining\
    \ clean and organized code.\n\n**styles.css** (external CSS file):\n\n```css\n\
    /* styles.css */\np {\ncolor: blue;\nfont-size: 18px;\n}\n```\n\n**index.html**\
    \ (HTML document with external CSS):\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"styles.css\">\n</head>\n<body>\n\
    <p>This text is styled with external CSS.</p>\n</body>\n</html>\n```\n\nUsing\
    \ external CSS files allows for easy maintenance and consistency across multiple\
    \ pages of a website. Any changes made to the CSS file will automatically apply\
    \ to all linked HTML pages.\n\n## Specificity\n\nAs you work with CSS, you may\
    \ encounter situations where multiple rules target the same element. Specificity\
    \ determines which styles take precedence. It is calculated based on the following\
    \ factors:\n\n- **Inline Styles:** Applied directly to an element, these have\
    \ the highest specificity. \n- **ID Selectors:** Selectors with IDs have higher\
    \ specificity than class selectors.\n- **Class Selectors:** Selectors with classes\
    \ have moderate specificity.\n- **Element Selectors:** Based solely on element\
    \ names, these have the lowest specificity.\n\nFor example, consider the following:\n\
    \n```css\np {\n  color: red; /* Specificity: 0,0,1 */\n}\n\n.special {\n  color:\
    \ blue; /* Specificity: 0,1,0 */\n}\n\n#header {\n  color: green; /* Specificity:\
    \ 1,0,0 */\n}\n```\n\n## The Box Model\n\nIn web design, every element is considered\
    \ a box. The CSS Box Model describes how boxes are structured. Here is a breakdown\
    \ of components:\n\n- **Content:** The innermost part of the box where the actual\
    \ text and images appear.\n- **Padding:** The space between the content and the\
    \ border.\n- **Border:** A line that surrounds the padding and content.\n- **Margin:**\
    \ The space outside the border, creating separation between other elements.\n\n\
    To calculate the total width of an element, consider the following:\n\n```css\n\
    .box {\n  width: 200px;\n  padding: 20px;\n  border: 2px solid #333;\n  margin:\
    \ 10px;\n}\n```\n\nThe total width will be:\n- Content width: 200px\n- Padding\
    \ (left + right): 20px + 20px = 40px\n- Border (left + right): 2px + 2px = 4px\n\
    - Margin (left + right): 10px + 10px = 20px\n\nTotal width = 200px + 40px + 4px\
    \ + 20px = 264px.\n\n## Display Property\n\nThe `display` property in CSS determines\
    \ how an element should be rendered in the layout. It's a fundamental property\
    \ that influences the flow of elements on a web page. Here are some common values:\n\
    \n- **block:** Elements with `display: block;` create a new block context and\
    \ typically stack vertically, taking up the full width of their container. Examples\
    \ include `<div>`, `<p>`, and `<h1>`.\n- **inline:** Elements with `display: inline;`\
    \ do not create a new block context and flow horizontally within the content.\
    \ They only take up as much width as necessary. Examples include `<span>`, `<a>`,\
    \ and `<strong>`.\n- **inline-block:** Combines features of both `block` and `inline`.\
    \ Elements with `display: inline-block;` create a new block context but flow horizontally\
    \ like inline elements. They can have block-level styling.\n- **none:** Elements\
    \ with `display: none;` are not displayed on the web page and take up no space\
    \ in the layout. This is commonly used for hiding elements via JavaScript.\n-\
    \ **flex:** Introduced with CSS Flexbox, elements with `display: flex;` become\
    \ flexible containers for their child elements. This value allows for advanced\
    \ layout control.\n- **grid:** Introduced with CSS Grid, elements with `display:\
    \ grid;` become grid containers, enabling grid-based layout design.\n"
