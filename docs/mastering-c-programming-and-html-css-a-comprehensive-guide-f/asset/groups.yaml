    \n```css\n/* styles.css */\np {\ncolor: blue;\nfont-size: 18px;\n}\n```\n\n**index.html**\
    \ (带有外部 CSS 的 HTML 文档):\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"\
