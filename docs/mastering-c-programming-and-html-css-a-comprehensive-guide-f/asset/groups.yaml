    +   - **ID Selector:** Selects a `single element` with a specific ID attribute.
    For example, `#header` selects the element with the ID "header."


    +   - **Descendant Selector:** Selects an element that is a descendant of another
    element. For example, `ul li` selects all `<li>` elements that are descendants
    of `<ul>` elements.


    +   - **Child Selector:** Selects an element that is a direct child of another
    element. For example, `ul > li` selects all `<li>` elements that are direct children
    of `<ul>` elements.


    +   - **Attribute Selector:** Selects elements with a specific attribute value.
    For example, `[type="text"]` selects all elements with a "type" attribute set
    to "text."


    +   - **Pseudo-class Selector:** Selects elements based on their state or position.
    For example, `:hover` selects elements when the mouse pointer hovers over them.


