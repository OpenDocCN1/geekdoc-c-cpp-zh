- md: "\nIn this code, the `power` function has a default argument of `2` for the\
    \ `exponent` parameter. When we call `power(5)`, it calculates the square (since\
    \ we didn't provide an exponent) using the default value. When we call `power(3,\
    \ 3)`, we specify a custom exponent value of `3`.\n\n## Scope of Variables\n\n\
    Scope refers to the region or context in which a variable is defined and can be\
    \ accessed. In C++, variables have different scopes, and their visibility and\
    \ lifetime depend on where they are declared.\n\n### Local Scope\n\nVariables\
    \ declared within a function are said to have local scope. They are accessible\
    \ only within that function and are not visible to other functions or code outside\
    \ of the function. When a function exits, its local variables are destroyed.\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int x = 10; // Local\
    \ variable with scope limited to myFunction\n    std::cout << \"Inside myFunction:\
    \ x = \" << x << std::endl;\n}\n\nint main() {\n    myFunction();\n    // Uncommenting\
    \ the line below would\n    result in an error\n    // std::cout << \"Outside\
    \ myFunction: x = \" << x << x << std::endl;\n    return 0;\n}\n```\n\nIn this\
    \ example, the variable `x` declared inside `myFunction` is local to that function.\
    \ It cannot be accessed from `main`, as attempting to do so would result in an\
    \ error.\n\n### Global Scope\n\nVariables declared outside of any function, typically\
    \ at the beginning of a program, have global scope. They are visible and accessible\
    \ throughout the entire program, including all functions.\n\n```cpp\n#include\
    \ <iostream>\n\nint globalVar = 20; // Global variable with program-wide\nscope\n\
    \nvoid myFunction() {\n    std::cout << \"Inside myFunction: globalVar = \" <<\n\
    \    globalVar << std::endl;\n}\n\nint main() {\n    std::cout << \"In main: globalVar\
    \ = \" << globalVar <<\n    std::endl;\n    myFunction();\n    return 0;\n}\n\
    ```\n\nIn this code, `globalVar` is declared at the global scope and is accessible\
    \ both within `main` and `myFunction`.\n\n### Scope Resolution Operator (::)\n\
    \nIn cases where there's a local variable with the same name as a global variable,\
    \ you can use the scope resolution operator `::` to specify which variable you\
    \ want to access.\n\n```cpp\n#include <iostream>\n\nint x = 10; // Global variable\n\
    \nvoid myFunction() {\n    int x = 5; // Local variable with the same name as\
    \ the\n    global variable\n    std::cout << \"Local x: \" << x << std::endl;\n\
    \    std::cout << \"Global x: \" << ::x << std::endl; // Access\nthe global x\n\
    }\n\nint main() {\n    myFunction();\n    return 0;\n}\n```\n\nIn this example,\
    \ `myFunction` has a local variable `x`, but we can still access the global `x`\
    \ using `::x`.\n\n### Lifetime of Variables\n\nThe lifetime of a variable is the\
    \ duration for which it exists in memory and holds a valid value. The lifetime\
    \ of a variable depends on its scope and storage duration.\n\n### Automatic Storage\
    \ Duration\n\nVariables with automatic storage duration (the default for local\
    \ variables) have a lifetime that begins when the program execution enters the\
    \ block in which the variable is defined and ends when the block is exited. In\
    \ other words, they are created when the function is called and destroyed when\
    \ the function exits.\n\n```cpp\n#include <iostream>\n\nvoid myFunction() {\n\
    \    int x = 10; // Local variable with automatic storage duration\n    std::cout\
    \ << \"Inside myFunction: x = \" << x << x << std::endl;\n} // x goes out of scope\
    \ and is destroyed here\n\nint main() {\n    myFunction();\n    // Uncommenting\
    \ the line below would result in an error\n    // std::cout << \"Outside myFunction:\
    \ x = \" << x << x << std::endl;\n    return 0;\n}\n```\n\nIn this code, the variable\
    \ `x` has automatic storage duration and is created when `myFunction` is called\
    \ and destroyed when the function exits. Attempting to access `x` outside of the\
    \ function would result in an error.\n\n### Static Storage Duration\n\nVariables\
    \ with static storage duration (global variables or local variables declared as\
    \ `static`) have a lifetime that extends throughout the entire program execution.\
    \ They are created when the program starts and destroyed when the program exits.\n\
    \n```cpp\n#include <iostream>\nvoid myFunction() {\n    static int x = 10; //\
    \ Static local variable with static storage duration\n    std::cout << \"Inside\
    \ myFunction: x = \" << x << std::endl;\n} // x retains its value and persists\
    \ for the entire program lifetime\nint main() {\n    myFunction();\n    std::cout\
    \ << \"Outside myFunction: x = \" << x << std::endl; // Accessing static x\n \
    \   return 0;\n}\n```\n\nIn this example, the variable `x` is a static local variable.\
    \ It is created when `myFunction` is first called, retains its value between function\
    \ calls, and is destroyed when the program exits. This allows us to access `x`\
    \ both inside and outside of the function.\n\n### Dynamic Storage Duration\n\n\
    Variables with dynamic storage duration are created and destroyed explicitly.\n"
  mdcn: "\n\n在这段代码中，`power` 函数的参数 `exponent` 有一个默认值 `2`。当我们调用 `power(5)` 时，它将使用默认值计算平方（因为我们没有提供指数）。当我们调用\
    \ `power(3, 3)` 时，我们指定了自定义的指数值 `3`。\n\n## 变量的作用域\n\n作用域是指变量定义并可以被访问的区域或上下文。在 C++\
    \ 中，变量具有不同的作用域，它们的可见性和生命周期取决于它们声明的位置。\n\n### 局部作用域\n\n在函数内部声明的变量具有局部作用域。它们只能在该函数内部访问，对其他函数或函数外部的代码不可见。当函数退出时，其局部变量会被销毁。\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int x = 10; // 作用域限制在\
    \ myFunction 中的局部变量\n    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n\
    }\n\nint main() {\n    myFunction();\n    // 取消下面这一行的注释将导致\n    // 错误\n    //\
    \ std::cout << \"Outside myFunction: x = \" << x << x << std::endl;\n    return\
    \ 0;\n}\n```\n\n在这个示例中，在 `myFunction` 内部声明的变量 `x` 是该函数的局部变量。它无法从 `main` 访问，因为这样做会导致错误。\n\
    \n### 全局作用域\n\n在任何函数外部声明的变量（通常在程序开头）具有全局作用域。它们在整个程序（包括所有函数）中都是可见且可的。\n\n```cpp\n\
    #include <iostream>\n\nint globalVar = 20; // 范围范围的全局变量\n\nvoid myFunction() {\n\
    \    std::cout << \"Inside myFunction: globalVar = \" <<\n    globalVar << std::endl;\n\
    }\n\nint main() {\n    std::cout << \"In main: globalVar = \" << globalVar <<\n\
    \    std::endl;\n    myFunction();\n    return 0;\n}\n```\n\n在这段代码中，`globalVar`\
    \ 在全局作用域声明，可以在 `main` 和 `myFunction` 中均访问。\n\n### 作用域解析运算符 (::)\n\n当局部变量与全局变量同名时，你可以使用作用域解析运算符\
    \ `::` 来指定你想要访问的变量。\n\n```cpp\n#include <iostream>\n\nint x = 10; // 全局变量\n\n\
    void myFunction() {\n    int x = 5; // 与全局变量同名的局部变量\n    std::cout << \"Local\
    \ x: \" << x << std::endl;\n    std::cout << \"Global x: \" << ::x << std::endl;\
    \ // 访问\n    全局 x\n}\n\nint main() {\n    myFunction();\n    return 0;\n}\n```\n\
    \n在这个示例中，`myFunction` 拥有一个局部变量 `x`，但我们仍然可以使用 `::x` 访问全局 `x`。\n\n## 变量的生命周期\n\n\
    变量的生命周期是指它在内存中存在并持有有效值的持续。变量的生命周期取决于它的作用域和存储持续时间。\n\n### 自动存储持续时间\n\n具有自动存储持续时间的变量（局部变量的默认类型）其生命周期从程序执行进入定义变量的块开始，到该块结束。换句话说，它们在函数被调用时创建，在函数退出时销毁。\n\
    \n```cpp\n#include <iostream>\n\nvoid myFunction() {\n    int x = 10; // 具有自动存储持续时间的局部变量\n\
    \    std::cout << \"Inside myFunction: x = \" << x << x << std::endl;\n} // x\
    \ 在此处超出作用域并被销毁\n\nint main() {\n    myFunction();\n    // 取消下面这一行的注释将导致错误\n  \
    \  // std::cout << \"Outside myFunction: x = \" << x << x << std::endl;\n    return\
    \ 0;\n}\n```\n\n在这段代码中，变量 `x` 具有自动存储持续时间，在调用 `myFunction` 时创建，在函数退出时销毁。在函数外部访问\
    \ `x` 将导致错误。\n\n### 静态存储持续时间\n\n具有静态存储持续时间的变量（全局变量或声明为 `static` 的局部变量）其生命周期贯穿整个程序执行。它们在程序启动时创建，在程序退出时销毁。\n\
    \n```cpp\n#include <iostream>\nvoid myFunction() {\n    static int x = 10; //\
    \ 具有静态存储持续时间的静态局部变量\n    std::cout << \"Inside myFunction: x = \" << x << std::endl;\n\
    } // x 保留其值并持续整个程序生命周期\nint main() {\n    myFunction();\n    std::cout << \"Outside\
    \ myFunction: x = \" << x << std::endl; // 访问静态 x\n    return 0;\n}\n```\n\n在这个示例中，变量\
    \ `x` 是一个静态局部变量。它在第一次调用 `myFunction` 时创建，在函数调用之间保留其值，并在程序退出时销毁。这使得我们能够能够在函数内部和外部都访问\
    \ `x`。\n\n### 动态存储持续时间\n\n具有动态存储持续时间的变量是显式地创建和销毁的。\n\n"
