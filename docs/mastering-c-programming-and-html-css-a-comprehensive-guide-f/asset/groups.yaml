    # ## Pointers


    # ### What is a Pointer?


    A pointer is a variable that stores the memory address of another variable. Instead
    of directly holding a value, a pointer points to the location in memory where
    the value is stored. Pointers are a fundamental concept in C++ and provide a way
    to work with memory directly.


    Here''s how you declare a pointer in C++:


    ```

    ```cpp

    data_type* pointer_name;

    ```

