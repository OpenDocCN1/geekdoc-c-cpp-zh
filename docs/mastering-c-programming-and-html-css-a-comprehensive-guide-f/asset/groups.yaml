    Responsive web design is guided by a set of fundamental principles that inform
    its implementation. These principles are the building blocks of responsive design:


    # ### 1. **Fluid Grid Layouts**


    Instead of fixed-width layouts, responsive websites use fluid grids. Elements
    on the page are sized in relative units (e.g., percentages) rather than fixed
    pixels. This allows content to expand or contract based on the screen size.


