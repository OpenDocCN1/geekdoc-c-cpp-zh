    \ on the main axis */\n  align-items: flex-start; /* Vertically aligns items to\
    \ the top on the cross axis */\n}\n```\n\n# #### 4. **Flexibility and Ordering**\n\
    \nFlexbox introduces the concept of **flexibility**, where items can expand or\
