    \n在此代码中，`AbstractShape` 是一个带有纯虚函数 `area()` 的抽象类。像 `Circle` 或 `Rectangle` 这样的派生类必须提供\
    \ `area()` 函数的自己的实现才能成为具体类。\n\n### 多态与对象切片：注意事项\n\n在处理多态时，理解对象切片（Object Slicing）的概念至关重要。当将一个派生类对象赋值给一个基类对象时，就会发生对象切片。在这个过程中，派生类的特定属性和行为会被“切掉”，只剩下基类部分。\n\
    \n这里是一个说明对象切片的示例：\n\n```cpp\nclass Base {\npublic:\n  int baseValue;\n\n  Base(int\
    \ value) : baseValue(value) {}\n  virtual void display() const {\n    std::cout\
