    # ## Constructors and Destructors


    Constructors and destructors are special member functions in C++ classes that
    are used for object initialization and cleanup, respectively.


    # ### Constructors


    A constructor is a member function that is automatically called when an object
    of the class is created. It initializes the object''s attributes, allocates resources,
    and performs any necessary setup. Constructors have the same name as the class
    and can have parameters for custom initialization.'
- md: "\nHere's an example of a constructor in our `Person` class.\n\n```cpp\nPerson(std::string\
    \ n, int a) : name(n), age(a) {}\n```\n\nIn this code, `Person` is the constructor,\
    \ and it takes two parameters, `n` for the name and `a` for the age, to initialize\
    \ the `name` and `age` attributes of the object.\n\n### ### Destructors\n\nA destructor\
    \ is a member function with a special name preceded by the tilde (`~`) character,\
    \ such as `~ClassName()`. It is automatically called when an object goes out of\
    \ scope or is explicitly deleted. Destructors are used to release resources, close\
    \ files, or perform any necessary cleanup for an object.\n\nHere's an example\
    \ of a destructor in our `Person` class:\n\n```cpp\n~Person() {\n    // Destructor\
    \ code here (if needed)\n}\n```\n\nIn this case, the destructor for the `Person`\
    \ class is empty because there are no resources to release, but you can include\
    \ cleanup code as needed.\n\n## Member Access Control\n\nIn C++, class members\
    \ (attributes and methods) can have different access control specifiers that determine\
    \ their visibility and accessibility from outside the class. There are three primary\
    \ access control specifiers: `protected`, and `private`.\n\n### Public\n\nMembers\
    \ declared as `public` are accessible from anywhere in the program, including\
    \ outside the class. They provide a public interface to the class and can be used\
    \ to interact with objects of the class.\n\n### Protected\n\nMembers declared\
    \ as `protected` are accessible within the class and by derived classes. They\
    \ are not directly accessible from outside the class but can be accessed by derived\
    \ classes if the inheritance relationship is established.\n\n### Private\n\nMembers\
    \ declared as `private` are only accessible within the class. They are not visible\
    \ or accessible from outside the class, ensuring strong encapsulation.\n\nHere's\
    \ an example demonstrating access control in a class:\n\n```cpp\nclass MyClass\
    \ {\npublic:\n    int publicMember; // Public member\nprotected:\n    int protectedMember;\
    \ // Protected member\nprivate:\n    int privateMember; // Private member\n};\n\
    ```\n\nIn this code, `publicMember` is accessible from anywhere, `protectedMember`\
    \ can be accessed by derived classes, and `privateMember` is only accessible within\
    \ the `MyClass` itself.\n\n## Static Members\n\nIn addition to regular instance\
    \ (non-static) members, C++ classes can have static members. Static members belong\
    \ to the class itself rather than to specific instances of the class. They are\
    \ shared among all objects of the class and can be accessed without creating an\
    \ instance.\n\n### Static Variables\n\nStatic variables are declared using the\
    \ `static` keyword within the class. They are often used to represent data that\
    \ is shared across all objects of the class.\n\nHere's an example of a static\
    \ variable:\n\n```cpp\nclass MyClass {\npublic:\n    static int staticVar; //\
    \ Static variable\n};\n```\n\nIn this code, `staticVar` is a static variable belonging\
    \ to the `MyClass` class. It is shared among all instances of the class.\n\n###\
    \ Static Methods\n\nStatic methods (member functions) are declared using the `static`\
    \ keyword and do not operate on instance-specific data. They can only access static\
    \ members of the class.\n\nHere's an example of a static method:\n\n```cpp\nclass\
    \ MyClass {\npublic:\n    static void staticMethod() {\n    // Static method code\
    \ here\n    }\n};\n```\n\nStatic methods are called on the class itself, not on\
    \ instances of the class:\n\n```cpp\nMyClass::staticMethod(); // Call the static\
    \ method\n```\n\n## Const-Correctness\n\nConst-correctness is a concept that involves\
    \ ensuring that objects and their member functions behave as expected when declared\
    \ as `const`. It is a good practice to use `const` to indicate that an object\
    \ or a member function does not modify the object's state.\n\n### Const Member\
    \ Functions\n\nYou can declare member functions as `const` to indicate that they\
    \ do not modify the object's data. This allows these functions to be called on\
    \ `const` objects and ensures that the object's state remains unchanged.\n\nHere's\
    \ an example of a const member function:\n\n```cpp\nclass MyClass {\npublic:\n\
    \    int getData() const {\n        return data;\n    }\n\nprivate:\n    int data;\n\
    };\n```\n\nIn this code, the `getData` method is declared as `const`, indicating\
    \ that it does not modify the `data` attribute. This allows `Data` to be called\
    \ on `const` objects of `MyClass`.\n\n### Const Objects\n\nYou can also create\
    \ `const` objects, which cannot be modified after their initial assignment. Const\
    \ objects are especially useful for ensuring data integrity and preventing accidental\
    \ changes.\n\nHere's how you create a `const` object:\n\n```cpp\nconst ClassName\
    \ constObjectName;\n```\n\nFor example, you can create a `const` object of the\
    \ `Person` class like this:\n\n```cpp\nconst Person constPerson(\"Alice\", 30);\
    \ // Create a const Person object\n```\n\nOnce an object is declared as `const`,\
    \ you cannot call non-const member functions on it, ensuring that the object's\
    \ state remains unchanged.\n\n## Operator Overloading\n\nOperator overloading\
    \ is a feature in C++ that allows you to define custom behaviors for operators\
    \ when working with class.\n\n### ### Example: Operator Overloading (Addition)\n\
    \nOperator overloading allows you to define custom behaviors for operators when\
    \ working with class. Let's say you have `Complex` and you want to add two.\n\n\
    ```cpp\nclass Complex {\nprivate:\n    double real;\n    double imag;\n\npublic:\n\
    \    Complex(double r, double i) : real(r), imag(i) {}\n\n    // Overload the\
    \ + operator\n    Complex operator+(const Complex& other) const {\n        double\
    \ newReal = real + other.real;\n        double newImag = imag + other.imag;\n\
    \        return Complex(newReal, newImag);\n    }\n\n    // Member function to\
    \ display the complex number\n    void display() const {\n        std::cout <<\
    \ real << \" \" << imag << \"i\" << std::endl;\n    }\n};\n```\n\nIn this code,\
    \ we overload the `+` operator to add `Complex` objects. Now, you can use the\
    \ `+` operator:\n\n```cpp\nComplex a(3.0, 4.0);\nComplex b(1.5, 2.5);\nComplex\
    \ result = a + b; // Use the + operator\nresult.display(); // Output: 4.5 + 6.5i\n\
    ```\n"
  mdcn: "\n这是我们 `Person` 类中构造函数的一个示例。\n\n```cpp\nPerson(std::string n, int a) : name(n),\
