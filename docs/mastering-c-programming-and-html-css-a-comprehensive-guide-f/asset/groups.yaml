    # ## Looping with `for-each`


    C++ offers a convenient way to iterate over elements in a collection (e.g., arrays,
    vectors) using a `


    `for-each` loop. This loop is also known as a range-based `for` loop. It simplifies
    the process of iterating over elements without needing explicit indices. Here''s
    the syntax:'
  - "[PAGE 79]\n\n```\n```cpp\nfor (element_type element : collection) {\n  // Code\
    \ to process 'element'\n}\n```\n```\n\nLet's see an example using array:\n\n```\n\
    ```cpp\n#include <iostream>\n\nint main() {\n  int numbers[] = {1, 2, 3, 4, 5};\n\
    \n  for (int number : numbers) {\n    std::cout << \"Number: \" << number << std::endl;\n\
    \  }\n\n  return 0;\n}\n```\n```\n\nIn this example, the `for-each` loop iterates\
    \ over each element in the `numbers` array, and the current element is stored\
    \ in the variable `number`. The loop prints each number to the console."
- md: "\n### `auto` Keyword with `for-each`\n\nYou can use the `auto` keyword to let\
    \ the compiler deduce the type of the elements in the collection. This is particularly\
    \ useful when working with complex data types. Here's an example:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<std::string>\
    \ fruits = {\"Apple\", \"Banana\", \"Cherry\"};\n\n    for (auto fruit : fruits)\
    \ {\n        std::cout << \"Fruit: \" << fruit << std::endl;\n    }\n\n    return\
    \ 0;\n}\n```\n\nIn this example, the `auto` keyword is used to iterate over a\
    \ `std::vector` of strings, and the type of `fruit` is deduced automatically by\
    \ the compiler.\n\n## Conditional Loops with `while` and `for`\n\nLoops often\
    \ involve conditions, and you can combine `while` or `for` loops with `if` statements\
    \ to create complex looping logic. For example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  int i = 0;\n  while (i < 5) {\n    if (i % 2 == 0) {\n     \
    \ std::cout << \"Even: \" << i << std::endl;\n    } else {\n      std::cout <<\
    \ \"Odd: \" << i << std::endl;\n    }\n    i++;\n  }\n  return 0;\n}\n```\n\n\
    In this example, we use a `while` loop to iterate from `0` to `4`. Inside the\
    \ loop, we check if the current value of `i` is even or odd using an `if` statement.\
    \ Depending on the condition, we print \"Even\" or \"Odd\" along with the value\
    \ of `i`.\n\nSimilarly, you can incorporate conditional logic within `for` loops\
    \ to achieve the desired behavior for your program.\n\n## Summary\n\nControl structures\
    \ are essential tools in programming for making decisions, looping, and controlling\
    \ the flow of your code. In this chapter, we explored conditional statements with\
    \ `if`, `else`, and `else if`, allowing you to execute different code blocks based\
    \ on specific conditions. We also learned about loops with `while`, `do-while`,\
    \ and `for`, which enable you to repeat code as long as certain conditions are\
    \ met.\n\nThe use of control structures, along with loop control statements like\
    \ `break` and `continue`, gives you precise control over your program's behavior.\
    \ We also introduced the `for-each` loop for easy iteration over collections.\n\
    \nUnderstanding and mastering control structures is fundamental to becoming a\
    \ proficient C++ programmer. With these tools, you can create more dynamic and\
    \ responsive programs, making your code more efficient and adaptable to different\
    \ situations.\n\n## Chapter 6: Functions and Scope\n\nIn this chapter, we'll delve\
    \ into the world of functions and scope in C++. Functions are a fundamental building\
    \ block of any C++ program, allowing you to organize your code, promote reusability,\
    \ and improve maintainability. Additionally, we'll explore the concept of scope,\
    \ which dictates the visibility and lifetime of variables within your program.\n\
    \n## Understanding Functions\n\n### What Are Functions?\n\nA function in C++ is\
    \ a named block of code that performs a specific task or a set of tasks. Functions\
    \ provide a way to break down a program into smaller, more manageable pieces,\
    \ making it easier to develop, understand, and maintain. They also enable code\
    \ reuse, as you can call a function multiple times from different parts of your\
    \ program.\n\nHere's the basic structure of a function in C++:\n\n```cpp\nreturn_type\
    \ function_name(parameters) {\n    // Function body\n    // Code to perform a\
    \ task\n    return result; // Optional return statement\n}\n```\n\nLet's break\
    \ down the components of a function:\n\n- **Return Type**: The return type specifies\
    \ the data type of the value that the function will return upon completion. It\
    \ can be any valid C++ data type, such as `int`, `double`, `string`, or even `void`\
    \ if the function doesn't return any value.\n- **Function Name**: The function\
    \ name is a user-defined identifier that you choose to represent the function.\
    \ It should be meaningful and follow naming conventions.\n- **Parameters**: Parameters\
    \ (also known as arguments) are variables you declare within the parentheses after\
    \ the function name. They act as placeholders for values that will be passed to\
    \ the function when it's called. Functions can have zero or more parameters.\n\
    - **Function Body**: The function body contains the actual code that performs\
    \ the task or tasks assigned to the function. It's enclosed within curly braces\
    \ `{}`.\n- **Return Statement**: The `return` statement is used to send a value\
    \ back to the calling code. It's optional, especially in functions with a `void`\
    \ return type. When a `return` statement is encountered, the function exits, and\
    \ the specified value is sent back to the caller.\n\n## Function Example\n\nLet's\
    \ look at a simple example of a function that calculates the square of a number:\n\
    \n```cpp\n#include <iostream>\n\n// Function declaration\nint square(int num)\
    \ {\n    int result = num * num;\n    return result;\n}\n\nint main() {\n    //\
    \ Function call\n    int number = 5;\n    int squared = square(number);\n\n  \
    \  std::cout << \"The square of \" << number << \" is \" << squared << std::endl;\n\
    \    \n    return 0;\n}\n```\n\n### Function Prototypes\n\nIn C++, functions are\
    \ typically declared before they are used. This provides the compiler with information\
    \ about the function's return type, name, and parameter list.\n\nFor example:\n\
    \n```cpp\n#include <iostream>\n\n// Function prototype\nint square(int num);\n\
    \nint main() {\n    int number = 5;\n    int squared = square(number);\n\n   \
    \ std::cout << \"The square of \" << number << \" is \" << squared << std::endl;\n\
    \n    return 0;\n}\n\n// Function definition\nint square(int num) {\n    int result\
    \ = num * num;\n    return result;\n}\n```\n\n### Function Overloading\n\nC++\
    \ supports function overloading, which allows you to define multiple functions\
    \ with the same name but different parameter lists. The compiler determines which\
    \ function to call based on the number or type of arguments passed.\n\nHere's\
    \ an example of function overloading:\n\n```cpp\n#include <iostream>\n\n// Function\
    \ to add two integers\nint add(int a, int b) {\n  return a + b;\n}\n\n// Function\
    \ to add two doubles\ndouble add(double a, double b) {\n  return a + b;\n}\n\n\
    int main() {\n    int sum_int = add(5, 10);\n    double sum_double = add(3.5,\
    \ 2.7);\n\n    std::cout << \"Sum of integers: \" << sum_int << std::endl;\n \
    \   std::cout << \"Sum of doubles: \" << sum_double << std::endl;\n\n    return\
    \ 0;\n}\n```\n\n### Default Arguments\n\nC++ allows you to specify default values\
    \ for function parameters. This means that if a caller doesn't provide a value\
    \ for a particular parameter, the default value will be used. Default arguments\
    \ make functions more flexible and simplify function calls.\n\nHere's an example:\n\
    \n```cpp\n#include <iostream>\n// Function with default argument\nint power(int\
    \ base, int exponent = 2) {\n    int result = 1;\n    for (int i = 0; i < exponent;\
    \ i++) {\n        result *= base;\n    }\n    return result;\n}\n\nint main()\
    \ {\n    int square = power(5); // Uses default exponent value of 2\n    int cube\
    \ = power(3, 3); // Provides custom exponent value\n\n    std::cout << \"Square:\
    \ \" << square << std::endl;\n    std::cout << \"Cube: \" << cube << std::endl;\n\
    \n    return 0;\n}\n```\n"
  mdcn: "\n\n### 在 `for-each` 中使用 `auto` 关键字\n\n你可以使用 `auto` 关键字让编译器推导集合中元素的类型。这在处理复杂数据类型时特别有用。这是一个示例：\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<std::string>\
    \ fruits = {\"Apple\", \"Banana\", \"Cherry\"};\n\n    for (auto fruit : fruits)\
    \ {\n        std::cout << \"Fruit: \" << fruit << std::endl;\n    }\n\n    return\
    \ 0;\n}\n```\n\n在这个示例中，`auto` 关键字被用于遍历字符串的 `std::vector`，`fruit` 的类型由编译器自动推导。\n\
    \n## 使用 `while` 和 `for` 带有条件循环\n\n循环通常涉及条件，你可以将 `while` 或 `for` 循环与 `if` 语句结合，以创建复杂的循环逻辑。例如：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  int i = 0;\n  while (i < 5) {\n\
    \    if (i % 2 == 0) {\n      std::cout << \"Even: \" << i << std::endl;\n   \
    \ } else {\n      std::cout << \"Odd: \" << i << std::endl;\n    }\n    i++;\n\
    \  }\n  return 0;\n}\n```\n\n在这个示例中，我们使用 `while` 循环从 `0` 迭代到 `4`。在循环内部，我们使用 `if`\
    \ 语句检查 `i` 的当前值是偶数还是奇数。根据条件，我们打印“Even”或“Odd”以及 `i` 的值。\n\n同样，你可以在 `for` 循环中加入条件逻辑，以实现程序所需的行为。\n\
    \n## 总结\n\n控制结构是编程中用于决策、循环和控制代码流的本质工具。在本章中，我们探索了带有 `if`、`else` 和 `else if` 的条件语句，允许你根据特定条件执行不同的代码块。我们还学习了\
    \ `while`、`do-while` 和 `for` 循环，它们使你能够在满足某些条件时重复代码。\n\n控制结构的使用，配合 `break` 和 `continue`\
    \ 等循环控制语句，可以让你对程序的行为进行精确控制。我们还介绍了 `for-each` 循环，以便对集合进行便捷迭代。\n\n理解并掌握控制结构是成为一名练\
    \ C++ 程序员的基础。通过这些工具，你可以创建更具动态且响应灵敏的程序，让你的代码更高效并适应不同的情况。\n\n## 第 6 章：函数与作用域\n\n\
    在本章中，我们将深入研究 C++ 中的函数和作用域。函数是任何 C++ 程序的基石构建块，允许你组织代码、提高重用性并增强可维护性。此外，我们将探索作用域的概念，它决定了变量在程序中的可见性和生命周期。\n\
    \n## 理解函数\n\n### 什么是函数？\n\nC++ 中的函数是执行特定任务或一组任务的命名代码块。函数提供了一种将程序拆分为更小、更易于管理的部分的方法，使得开发、理解和维护变得更容易。它们还实现了代码复用，因为你可以从程序的不同部分多次调用函数。\n\
    \n以下是 C++ 中函数的的基本结构：\n\n```cpp\nreturn_type function_name(parameters) {\n    //\
    \ 函数体\n    // 执行任务的代码\n    return result; // 可选的返回语句\n}\n```\n\n让我们拆解函数的组成部分：\n\
    \n-   **返回类型 (Return Type)**：返回类型指定了函数完成后返回的值的数据类型。它可以是任何有效的 C++ 数据类型，例如 `int`、`double`、`string`，或者如果函数不返回任何值，可以是\
    \ `void`。\n-   **函数名 (Function Name)**：函数名是由用户定义的标识符，用于表示该函数。它应该具有意义并遵循命名规范。\n\
    -   **参数 (Parameters)**：参数（也称为参数）是你在函数名括号内声明的变量。它们充当调用函数时传递给函数的值的占位符。函数可以有零或多个参数。\n\
    -   **函数体 (Function Body)**：函数体包含了执行分配给函数的任务的实际代码。它被包含在大括号 `{}` 之中。\n-   **返回语句\
    \ (Return Statement)**：`return`语句用于将值传回调用代码。它是可选的，特别是对于返回类型为 `void` 的函数。当遇到 `return`\
    \ 语句时，函数退出并将指定的值传给调用者。\n\n## 函数示例\n\n让我们来看一个计算数字平方的简单函数示例：\n\n```cpp\n#include\
    \ <iostream>\n\n// 函数声明\nint square(int num) {\n    int result = num * num;\n\
    \    return result;\n}\n\nint main() {\n    // 函数调用\n    int number = 5;\n   \
    \ int squared = square(number);\n\n    std::cout << \"The square of \" << number\
    \ << \" is \" << squared << std::endl;\n    \n    return 0;\n}\n```\n\n### 函数原型\
    \ (Function Prototypes)\n\n在 C++ 中，函数通常在在使用之前声明。这为编译器提供了关于函数返回类型、名称和参数列表的信息。\n\
    \n例如：\n\n```cpp\n#include <iostream>\n\n// 函数原型\nint square(int num);\n\nint main()\
    \ {\n    int number = 5;\n    int squared = square(number);\n\n    std::cout <<\
    \ \"The square of \" << number << \" is \" << squared << std::endl;\n\n    return\
    \ 0;\n}\n\n// 函数定义\nint square(int num) {\n    int result = num * num;\n    return\
    \ result;\n}\n```\n\n### 函数重载 (Function Overloading)\n\nC++ 支持函数重载，允许你定义具有相同名称但参数列表不同的多个函数。编译器根据传递参数的数量或类型来决定调用哪个函数。\n\
    \n这是一个函数重载的示例：\n\n```cpp\n#include <iostream>\n\n// 两个整数相加的函数\nint add(int a,\
    \ int b) {\n  return a + b;\n}\n\n// 两个浮点数相加的函数\ndouble add(double a, double b)\
    \ {\n  return a + b;\n}\n\nint main() {\n    int sum_int = add(5, 10);\n    double\
    \ sum_double = add(3.5, 2.7);\n\n    std::cout << \"Sum of integers: \" << sum_int\
    \ << std::endl;\n    std::cout << \"Sum of doubles: \" << sum_double << std::endl;\n\
    \n    return 0;\n}\n```\n\n### 默认参数 (Default Arguments)\n\nC++ 允许为函数参数指定默认值。这意味着如果调用者没有提供特定参数的值，将使用默认值。默认参数使函数更加灵活并简化了函数调用。\n\
    \n这是一个示例：\n\n```cpp\n#include <iostream>\n// 带有默认参数的函数\nint power(int base, int\
    \ exponent = 2) {\n    int result = 1;\n    for (int i = 0; i < exponent; i++)\
    \ {\n        result *= base;\n    }\n    return result;\n}\n\nint main() {\n \
    \   int square = power(5); // 使用默认指数值 2\n    int cube = power(3, 3); // 提供自定义指数值\n\
    \n    std::cout << \"Square: \" << square << std::endl;\n    std::cout << \"Cube:\
    \ \" << cube << std::endl;\n\n    return 0;\n}\n```\n\n"
