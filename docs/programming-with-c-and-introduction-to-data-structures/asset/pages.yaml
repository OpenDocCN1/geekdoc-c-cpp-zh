    # String Manipulation Functions


    The string manipulation functions are created to manipulate the values of string
    data type, in a C program. The noteworthy built-in string manipulation functions,
    used in a C program are:


    +   - strcpy(char *deststr, char *sourcestr): Copies the soucestr string to the
    deststr and returns the resultant string to the calling code


    +   - strncpy(char *str1, char *str2, int num): Copies the number of characters
    specified as num from the first index of the str2 string to the str1 string and
    returns the resultant string to the calling code


    +   - strcmp(char *str1, char *str2): Compares the str1 string and str2 string
    and returns a value <0, if str1 is less than str2, >0 if str2 is less than str1,
    and 0 if str1 is equal to str


    +   - strlen(char *str): Returns the length of the string to the calling code


    +   - strcat(char *deststr, char *sourcestr): Concatenates the soucestr string
    to the deststr and returns the resultant string to the calling code


    # Memory Management Functions


    The memory management functions are the built-in library functions which are used
    to perform tasks related to memory manipulation. The noteworthy built-in memory
    management functions, used in a C program:


    +   - free(void *memoryaddress, int size): Frees a block of memory at the specified
    memory address


    +   - calloc(int numelements, int elementsize): Allocates an array of memory locations
    for the elements specified as numelements, with the specified size


    +   - malloc(int numbytes): Allocates a block of memory that is similar to the
    size specified as numbytes


    +   - realloc(void *memoryaddress, int size): Reallocates the memory at the location
    specified as memoryaddress with the specified size as newsize


    # Buffer Manipulation Functions


    A buffer is memory location that is shared by programs and hardware devices to
    perform their tasks. The buffer manipulation functions are built-in library functions
    which are used to manage the buffer used by a C program. The following are the
    noteworthy built-in buffer functions:


    +   - memcpy(void *buf, const void *sourcebuf, int num): Copies the number of
    characters specified as num from the sourcebuf buffer to the buf buffer. The buf
    buffer corrupts in the case the objects overlap.'
