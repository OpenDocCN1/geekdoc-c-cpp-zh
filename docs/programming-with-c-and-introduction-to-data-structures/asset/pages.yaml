  md: "# 238 ► Chapter 7\n\n# 7.5 Tree\n\nThis is a non-linear data structure. Tree\
    \ is a non-empty finite set of elements that contains root R and other subtrees.\
    \ This is a general tree. A general tree cannot be empty.\n\nThe level of any\
    \ node is the length of its path from the root plus one and the degree of a node\
    \ is the number of its subtrees. The degree of terminating node i.e. leaves, is\
    \ zero.\n\nBinary tree has a finite set of nodes which are either empty or have\
    \ a root of two disjoint binary trees, the left subtree and the right subtree.\n\
    \nThese are are also called left successor and right successor of root node.\n\
    \nThe node of tree is declared as\n\n```\n#define TOTALNODES 100\nstruct typeofnode\n\
    {\n    int info;\n    int left;\n    int right;\n    int father;\n}\nstruct typeofnode\
    \ node[TOTALNODES];\n```\n\n# 7.6 Graphs\n\nThis is a non-linear data structure.\
    \ It consists of a nonempty set of nodes (vertices or points) and a set of arcs\
    \ (edges). Nodes are represented by a geometrical symbol, usually by circles and\
    \ arcs are represented by lines. Arcs connect nodes. Consider a graph with the\
    \ set of nodes N={n1,n2,n3,n4}. Then the set of arcs is A={(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)}.\
    \ Diagrammatically, the situation is shown below.\n\n![](img/d708a3768f380d8ce4567cde085e68dc_253_0.png)\n\
    \nThe arcs may or not have a direction. If all the arcs are directed then the\
    \ graph is called directed graph and the graph in which every arc is undirected\
    \ is an undirected graph. The graph in which some arcs are directed and some are\
    \ undirected is called a mixed graph.\n\nA graph is said to be connected if an\
    \ arc exists between any two nodes.\nThe graph may be represented either sequentially\
    \ or as a linked list."
