    - Operator Precedence in C


    C is a structured and procedural programming language used to develop portable
    application software. It was introduced in 1972 by Dennis Ritchie at the Bell
    Telephone Laboratories and was first used with the UNIX (Uniplexed Information
    and Computing System) operating system. it is also known as the middle-level language,
    which combines the best features of the assembly language as well as of high-level
    languages. C allows you to work with text, bytes, addresses, which are the basic
    elements used for computer''s functioning. Apart from this, C provides portability
    to a program, which means that you can easily run a C program in DOS as well as
    Windows operating system.


    Similar to other languages, a C program also uses data types, constants, and variables
    to execute the program. A variable is the basic entity of a program, and can be
    defined as an arbitrary placeholder for storing data. A variable must be assigned
    a data type, which specifies the type of data that the variable can store. For
    example, a variable of the int data type can store integer values. However, in
    case you need to keep the value of a variable constant, then you should declare
    the variable as constant by using the const type qualifier.'
