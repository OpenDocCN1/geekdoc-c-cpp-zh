    It should be noted that in case of a simple statement, you do not need to use
    the { } curly braces.


    Let''s explore the usage of conditional statements in C.


    # 2.2 Working with Conditional Statements


    A conditional statement is a control structure that allows you to select one or
    more execution paths in a program. It causes a program to execute a block of code
    after evaluating a given conditional expression. If the conditional expression
    comes out to be true, the accompanying block of code is executed; otherwise, the
    block of code is bypassed.


    In most of the programming languages, the following selections are included:


    +   One-way selection: In a one-way selection, if the condition evaluates to true
    then the statements in the true block are executed these statements are ignored
    and the control flow passes to the next statement. An if statement without else
    is an example of one-way selection.


    +   Two-way selection: In a two-way selection, if the condition evaluates to true
    then the statements in the true block are executed the statements in the false
    block are executed. An if-else statement is an example of two-way selection.


    +   N-way (multiple) selections: In a multiple selection, the conditional expression
    has multiple values to be tested. A switch statement is an example of multiple
    selection.


    The following is the list of the conditional statements supported by C:


    ```

    if statement

    if-else if-else statements

    ```'
