  md: '# Basic Operations on Files


    While working on a document using a word processor, you can perform the following
    operations:


    +   - Creating a new document

    - Writing data in the document

    - Saving the document

    - Opening the document

    - Reading the data from the document


    In programming, you can perform the following operations on files:


    +   - Opening a file. If none exists, creating a new file.

    - Closing the file.

    - Writing data to the file.

    - Reading the data from the file.

    - Determining the end of the file.


    # Opening and Closing of Files


    The open(filename) function is used to open a file. When you open a file, you
    establish a connection between your program and the file being opened. The following
    is the syntax to open a file:


    ```

    fop = fopen("filename", "mode of opening")

    ```


    In the preceding syntax, fop is a pointer of FILE type and refers to a file and
    filename is the name of the file to be opened. The mode of opening can be any
    of the following modes as in Table 1:


    | Mode of Opening a File | Description |

    |---|---|\| w | Creates a new file. If the file already exists then its data is
    deleted. |

    | r | Opens a text file in read-only mode. The file must exist. |

    | a | Opens a text file to append the new data. If the file does not exist then
    it is created. |

    | w+ | Creates a text file to perform read and write operations. If the file already
    exists then its data is deleted. |

    | r+ | Opens a text file to perform read and write operations. The file must exist.
    |'
