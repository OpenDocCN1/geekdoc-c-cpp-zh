    # 5.2 File Management


    Till now, we have declared variables of different types, such as char, int, and
    float. These variables are used to store an employee''s details such as first
    name, last name, mobile number, and salary. These values are stored only temporarily,
    till the execution of the program. This is because the data stored in program
    variables and arrays is temporary in nature. Such data is generally stored in
    the main memory of a computer and is lost when the program is terminated or the
    power is turned off.


    The ideal solution to process large data is to store the data permanently in the
    computer memory secondary storage devices, such as hard disks and floppy disks,
    in the form of data files, also known as flat files. The approach of storing data
    in files is known as the file-oriented approach.


    For this, you need to know about file management or file handling. The term ''file
    management'' refers to the process of writing data to a file, reading data from
    a file, and performing other operations on files.


    # Defining Files


    In word processors, data is stored in documents. Similarly, in programming, files
    are created to store the data of programs or applications.


    Consider the example of a student management system. In, the details of the students,
    such as names, registration numbers, colleges, semesters, and percentage of marks
    secured by each, need to be maintained.


    These details can be stored in files. Similarly, in a library management system,
    you may need to store information such as name of the book and the author, book
    price, and ISBN of the book. Such data should be stored in files so that it can
    be accessed and processed at any point of time.


    Files are defined for the following purposes:


    +   - Reading the data


    +   - Writing the data


    +   - Processing the data'
