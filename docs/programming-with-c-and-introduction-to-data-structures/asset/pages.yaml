  md: '# Summary


    In this chapter, you learned about various primitive and non-primitive data types.
    Further, the chapter explained about arrays, linked list, stack, tree, graphs,
    and queues. In each of these data structures, you learned to perform various operations
    such as searching, sorting, inserting an element, and deleting an element from
    a structure.


    # Quick Revise


    Q1. Discuss the term data structure?


    Ans. Data structure is a term used for the organized data, which is stored into
    a format to get the desired information as required.


    Q2. What are the common operations to be performed in data structure? Explain
    in brief.


    Ans. The following are the common operations that can be performed in data structure:


    +   Creating

    Traversing

    Counting the elements

    Printing

    Looking up an item for editing or printing

    Inserting

    Deleting

    Concatenating


    Traversing refers to the process of visiting each element of structure. Inserting
    means to add an element into a structure and deleting means to remove an item
    from the structure.


    Q3. Discuss the types of linked list.


    Ans. The following are the different types of linked lists:


    +   Singly linked lists

    Singly linked lists

    Doubly linked lists


    The circular linked lists have no beginning and end. The last item points back
    to the first item. Each structure of a singly linked list contains a single link
    that it attaches to the following structure in the chain. A doubly linked list
    contains pointers to both, the following and the preceding structure.


    A main difficulty with singly linked list is that if we are pointing to a specific
    node then we can move certify only in the direction of the links. The only way
    to find out the preceding node is to start back at the beginning of the list.
    This problem arises in case of insertion and deletion also.'
