  md: '# 84 Chapter 3


    In this chapter, you first learn what an array is and how elements are organized
    in an array. Then, you learn different types of arrays. You also learn to work
    with one-, two-, and multidimensional arrays. You also learn about some limitations
    of arrays.


    Further, you learn about strings in C language. The chapter also explores the
    concept of strings. Next, you learn how to declare and initialize a string. Then,
    you explore the functions that are used to read the strings at runtime, and the
    functions that are used to display the strings. Next, you learn how to create
    an array of string and how to perform various string operations, as as comparing
    and combining strings. Finally, you explore various string manipulation functions,
    which are used to perform various tasks with strings.


    Let''s first discuss about array.


    # 3.1 Introducing Arrays


    An array is a collection of same type of values stored in consecutive memory locations.
    It can be used to store the values of different data types, such as int, float,
    double, char, and string. Each value in an array is referred by a single name,
    which is the name of the array, and a subscript or index, which indicates the
    position of the value in the array. The subscript is a positive integer, which
    is enclosed in a pair of square brackets. As subscripts are used in arrays, they
    are also referred as subscribed variables.


    The individual values in an array are called the elements of the array. The structure
    of an array, myArray, containing n elements is shown in Figure 1:


    | myArray[0] | myArray[1] | myArray[2] | ... | myArray(n-1) |


    > Figure 1: Structure of an Array


    In Figure 1, myArray[0] represents the first element of the array, myArray[1]
    represents the second element of the array, myArray[2] represents the third element
    of the array, and myArray[n-1] represents the nth element of the array.


    > The C language does not perform bound checking for arrays; therefore, you need
    to ensure that you are not trying to access an array element that falls outside
    the array boundary.


    Following are some rules that need to be kept in mind while using arrays:


    +   - The array should be declared with some data type

    - The size of the array should be specified at the time of its declaration

    - In array, elements are stored sequentially, that is, in contiguous memory locations

    - Only one element can be added or removed from the array at a time


    Let''s now discuss the types of arrays.'
