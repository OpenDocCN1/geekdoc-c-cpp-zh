  md: '# 03 Arrays and Strings


    # OBJECTIVES


    +   - Introducing Arrays

    - Types of Arrays

    - Limitations of Arrays

    - Understanding Strings in C

    - Declaring and Initializing a String

    - Reading and Printing Strings

    - String Input and Output Functions

    - Single Character Input-Output Functions

    - Creating an Array of Strings

    - Performing String Operations

    - Using String Manipulation Functions


    As you know, arrays are used to store values in a program. However, many times
    we need to work with a set of variables of the same type. For example, we may
    need to store the marks obtained by 100 students in an examination. In this case,
    it is very difficult to define 100 variables to store the marks of each student.
    In such a situation, it is better to have a single variable that can store all
    the values rather than storing each value in a separate variable. The simplest
    way to store a set of values is to use an array.


    When the elements of an array are integers or floating-points, the arrays are
    called numerical arrays. However, when the elements of an array are characters,
    the arrays are called strings. In simple terms, a string is an array of characters
    in C language. Consider a scenario, where you need to store a word, WELCOME. For
    this, one option is to declare seven variables of char type and initialize the
    variables with the characters: W, E, L, C, O, and M individually. Another option
    is to declare and initialize a char variable or a char array or string, which
    stores the data, WELCOME. Therefore, you need to declare and use a char array
    or string when you need to store a complete word, for instance, WELCOME. In addition,
    C allows you to create an array of strings, which means two-dimensional char array,
    to store a complete sentence, for instance, WELCOME TO C.


    The C language also provides various string functions, such as strcpy(), strpr(),
    and strlen(), to handle string operations. These operations include comparing
    two strings, converting the characters of a string into upper case, and calculating
    the length of a string. The string functions are stored in a string library, called
    the string.h header file.'
