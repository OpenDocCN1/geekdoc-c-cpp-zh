  md: '# Dereferencing a Pointer


    Pointer dereferencing refers to the process of referencing the values of the variables
    by pointers indirectly. To store the address of a variable, you need to use the
    reference operator. You retrieve the address of a variable, say i, as follows:


    ```

    int i = 10;

    int *p = &i;

    ```


    Now, if you want to use the value that the p pointer variable points to, you can
    use the dereference operator * as follows:


    ```

    printf("value at p-%d", p);

    ```


    In the preceding statement, p itself is a variable (it holds the address of an
    integer), so a pointer to it can be defined as:


    ```

    int **q = &p;

    ```


    You can directly access the value stored in the variable which it points to by
    preceding the pointer variable with an asterisk (*) sign. In this case, the *
    sign acts as the dereference operator, which is read as value pointed by. Dereferencing
    is generally done in two steps. In the first step, the address of the referenced
    variable is assigned to a pointer and in the second step, the pointer points to
    the value stored in the variable. For example, let''s consider the following code:


    ```

    int a=100, ptr;

    ptr=&a;      /* Step 1 */

    ptr=a;       /* Step 2 */

    ```


    In the preceding code, the address of the a variable is assigned to the pointer
    variable, ptr. Then the value of a is referenced by ptr. The "ptr=a" statement
    specifies that the ptr pointer variable accesses the value of a variable from
    the main memory. The process is shown in Figure 1:


    ![](img/d708a3768f380d8ce4567cde085e68dc_192_0.png)


    **Figure 1:** Dereferencing a Pointer


    In Figure 1, you can see that the ptr variable is stored at the address, 10051,
    and references the address (10056) of a variable that contains the value, 100.
    Let''s create a C program to understand the concept of dereferencing more clearly.
    Listing 4 shows the code of this program:'
