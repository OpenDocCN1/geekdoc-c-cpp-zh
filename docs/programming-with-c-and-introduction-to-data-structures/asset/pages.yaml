    Let''s now learn how to initialize a pointer variable, in the next section.


    # 6.4 Initializing a Pointer Variable


    While declaring pointer variables, you can explicitly specify which variables
    you want the pointer variables to point to. Similar to the initialization of other
    variables at the time of the declaration, you can also initialize the pointer
    variables by assigning the addresses of other variables to them. However, these
    variables must be declared in the program. You can initialize a pointer variable
    using the following syntax:


    ```

    data_type *pointer_variable_name = expression;

    ```


    In the preceding syntax, `data_type` can be any basic data type, `*pointer_variable_name`
    is a pointer variable, and `expression` can be a constant value or any variable
    containing a value.


    For example, let''s consider the following code:


    ```

    int num;

    int *var = &num;

    This code is equivalent to:

    int num;

    int *var;

    var = &num;

    ```


    When you initialize a pointer variable, you assign the reference value to the
    memory location which the pointer variables point to, such as `*var`. You should
    note that at the time of declaring a pointer variable, the asterisk (*) symbol
    is used to indicate a pointer variable, it is not the dereference operator (The
    dereference operator also uses the same `* sign`). Therefore, you should not confuse
    the use of the `*` symbol for two different functions as the preceding code cannot
    be written as:


    ```

    int num;

    int *var;

    *var = &num;

    ```'
