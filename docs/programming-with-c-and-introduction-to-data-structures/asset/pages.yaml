    +   * The float Data Type


    The float data type is used to store real numbers that have a single-precision
    floating-point. Floating-point numbers are numbers that contain a decimal point
    either to the left or to the right of an integer. These numbers can be expressed
    in decimal notation (in the form of decimals) or in scientific notation. The scientific
    notation, also called the mantissa-exponent notation, is a method of writing numbers
    that are too large or small to be written easily in standard decimal notation.
    Table 7 lists the valid and invalid floating-point numbers:


    | Table 7: List of Valid and Invalid Floating-Point Numbers |

    | Valid Floating-Point Number | Invalid Floating-Point Number |

    | -261.218 | 4.4 (comma not allowed) |

    | 2.43130 E+02 | -1.8.9 (two decimal points are not allowed) |

    | 0.0233333 E+04 | -9999999.99999 (out of valid range of the float data type )
    |

    | 25313.8 E-02 | - +18.88 (two successive operators are not allowed) |


    In Table 7, you look at the Valid Floating-Point Number, the first example is
    in decimal notation and the rest of the examples are in scientific notation. The
    character E stands for exponent.


    You can use the scientific notation in situations where the given data is too
    large or too small. For example, if the specified number is 0.0000000000017, then
    you must use the scientific notation to represent this number. In scientific notation,
    you can write the number as 1.7 x 10⁻¹¹ or 1.7 E-11.


