  md: '# 3.2 Types of Arrays


    Arrays can be classified into three types: one-dimensional arrays, two-dimensional
    arrays, and multi-dimensional arrays. A one-dimensional array has only one subscript,
    a two-dimensional array defines two upper bounds for the array and a multi-dimensional
    array has n subscripts, where n represents the dimensions of the array.


    The dimensionality of an array is determined by the number of pairs of square
    brackets placed after the array name. For example, array1{} represents a one-dimensional
    array, array2{} represents a two-dimensional array, and array3{} represents a
    multidimensional array. Each pair of square brackets contains the number of elements
    corresponding to this chapter, you will learn about the following types of arrays:


    +   - One-dimensional arrays

    - Two-dimensional arrays

    - Multidimensional arrays


    # ### Using One-Dimensional Arrays


    A one-dimensional array or a single dimensional array is used to store a linear
    list of values of the same type. The elements in the one-dimensional array are
    stored with the index values starting from zero to one less than the size of the
    array. Each element in a one-dimensional array is accessed using the same name
    and a single subscript. A one-dimensional array is similar to a raw matrix or
    a column matrix.


    # ### Declaring a One-Dimensional Array


    Similar to ordinary variable, you need to declare an array before using it. A
    one-dimensional array can be declared using the following syntax:


    ```

    data_type array_name[size];

    ```


    In the preceding syntax, data_type represents the data type of the array to be
    declared, array_name represents the name of the array, and size represents the
    number of values of the data_type that can be stored in the array_name.


    The following code snippet declares an integer array, myArray, of size 10:


    ```

    int myArray[10];

    ```


    In the preceding example, the myArray can contain 10 elements, which are indexed
    0 to 9. If the data type and the number of elements in a one-dimensional array
    are known, total amount of memory that can be allocated to the array can be calculated
    using the following formula:


    ```

    Total amount of memory = size * [sizeof(data_type)]

    ```'
