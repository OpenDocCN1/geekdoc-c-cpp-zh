    # 3.4 Understanding Strings in C


    In language, a string is a one-dimensional character array where each element
    is either a character or a constant string. For example, you create an array of
    characters that stores the vowels of English language. Then, the vowels (a, e,
    i, o, and u) are either characters or constant strings.


    Now, let''s explain how a string is stored in the main memory of a computer. Consider
    an example of storing the kogent. The kogent word contains six characters. Figure
    2 shows the storing of the kogent word, as a string in C language:


    ![](img/d708a3768f380d8ce4567cde085e68dc_107_0.png)


    Figure 2 Displaying the Storage of a String


    Similar to a numerical array, the first element of a string is stored at Oh subscript
    position; the second element is stored at 1st subscript position, and so on. In
    last character of the string is stored at n-1 subscript position, where n is the
    total number of characters. There is a difference between a numerical array and
    a character array or string. The difference is that a character array or a string
    stores a null (0) character at the nth subscript position, while a numerical array
    does not store such a character n+1 elements, because the last character of the
    array is always null.


    Now, let''s learn how to declare and initialize a string.


    # 3.5 Declaring and Initializing a String


    As similar to a numerical array, a character array or string is declared as follows:


    ```

    char <variable_name>[<array_length>

