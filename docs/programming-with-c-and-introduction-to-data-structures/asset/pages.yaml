  md: 'Jump statement: Transfers the control from one part to another within the program.
    Some examples of jump statements are: goto, break, and continue.


    The following syntax shows a compound statement:


    ```

    {

    statement 1;

    statement 2;

    statement 3;

    }

    ```


    An example of a compound statement in C language is:


    ```

    {

    printf("First statement");

