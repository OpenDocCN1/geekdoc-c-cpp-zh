  md: "# Structures and File Management\n\n+   OBJECTIVES\n* Structures\n* File Management\n\
    \nAs you know, arrays are used to store a set of values of the same data type.\
    \ However, in many situations, it is required to store a set of values of different\
    \ data types together. For example, you may need to store the complete record\
    \ of each student, including roll number, name, age, and grade, at one place.\
    \ The different fields of the student record consists of different types of values,\
    \ for example, an roll number and age are of type int, and name and grade are\
    \ of type char; therefore, you cannot use an array to store a student. In such\
    \ a situation, you can use a structure, which provides a way to store different\
    \ data types together.\n\nFurther, if you have a lot of data to process then you\
    \ cannot store them in a single variable. In such a situation, it is better to\
    \ use files.\n\nIn this chapter, you learn about structure and how to define a\
    \ structure. Next, you learn how to declare variables of a structure type and\
    \ initialize these variables. Further, you learn how to create nested structures\
    \ and arrays of structures. In addition, you learn about the typedef statement.\
    \ In the end, you learn about managing files through different functions such\
    \ as fopen(), fclose(), fgetc(), fputc(), gets(), fflush(), fprintf(), and fcancf().\n\
    \n# 5.1 Structures\n\nA structure is a user-defined data type, which is used to\
    \ store values of different data types together under the same name. Each member\
    \ of a structure is assigned a separate memory location.\n\n+   Defining a Structure\n\
    You must define a structure before using it in a program. Definition of a structure\
    \ starts with the struct keyword, followed by the name of the structure, a pair\
    \ of curly braces containing declaration of a set of variables called structure\
    \ members, and then a semicolon. The syntax for defining a structure is as follows:\n\
    \n```\nstruct structure-name\n{\n    data-type variable1;\n    data-type variable2;\n\
    ```"
