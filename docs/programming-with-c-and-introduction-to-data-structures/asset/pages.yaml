  md: '# 180 Chapter 6


    You can also assign a Null Value to a pointer variable. For example:


    ```

    int *ptr;

    ptr = NULL;

    ```


    +   - Arithmetic


    C allows you to add integers to pointers as well as subtract one pointer from
    another. Arithmetic operation on pointers is somewhat different from the arithmetic
    operations on regular integer data types. The arithmetic operation refers to the
    addition and subtraction operations. You can add or subtract an integer value
    from a pointer variable. Both addition and subtraction have different behaviors
    according to the size of the data type to which they point. Shorthand operators
    can also be used with the pointers for arithmetic expressions, such as += *p2.
    For example, suppose P1 is a pointer with a current value of 2000. After the expression
    P++, content of P1 will be 2002, not 2001. Each time P1 is incremented, it points
    to the next integer. Let''s consider the following examples of adding a number
    to a


    ```

    int i = 5, *j, *k;

    j = &i;

    j = *j+1;

    j = *j+9;

    k = *j+3;

    ```


    Similarly, the following examples illustrate the subtraction of a number from
    a pointer:


    ```

    int i = 5, *j, *k;

    j = &i;

    j = *j-2;


    J = *j-5;

    k = *j-6;

    ```


    Subtraction of one pointer variable from another can be performed only when both
    variables point to elements of the same array.


    You cannot perform the following operations on pointers:


    +   a. Multiply a pointer with a constant

    b. Add two pointers

    c. Divide a pointer by a constant


    > If P is a pointer having address ''2000'' would be values for the following:

    P = P+2; for int "P"

    P = P-1; for float "P"

    P = P+10; for char "P"

    P = P+1; for double "P"


    (VTU, Jan/ Feb 2006)'
