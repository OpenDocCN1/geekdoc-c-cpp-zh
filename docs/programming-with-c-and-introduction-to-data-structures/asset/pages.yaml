    # 6.14 The #if, #elif, #else, and #endif Directives


    The #if, #elif, #else, and #endif directives are used to conditionally include
    a header file or define a macro under specified conditions in different ways.
    The #if preprocessor directive behaves similar to the C language if statement.
    The only difference is that the #if directive controls whether certain statements
    are compiled or not and if statement controls whether these statements are executed
    or not.


    The following is a structure of #if directive:


    ```

    #if condition1

    statement_block1

    #elif condition2

    statement_block2

    ...

    #elif condition_n

    statement_blockn

    #else

    default_statement_block

    #endif

    ```'
