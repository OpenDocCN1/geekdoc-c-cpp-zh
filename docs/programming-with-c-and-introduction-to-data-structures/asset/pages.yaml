    +   - Conditional statements

    - Control transfer statements

    - Loop structures/ Iterative structures

    - Comments whenever necessary


    After program coding, let''s move ahead and learn about the testing phase of a
    program.


    # Phase 5: Testing a Program


    After writing a program, a programmer needs to test the program for its completeness,
    correctness, reliability, and maintainability. To test any program, it is important
    to identify the available data based on the specific criteria and the level at
    which the data is tested.


    # Selection of Data for Testing Purpose


    Testing of data is relevant only if the selection of data is accurate and appropriate.
    The selected data can be either live data or artificial data. Live data refers
    to the data that is collected from an existing system being currently used. On
    the other hand, artificial data may be generated by some other source.


    # Levels of Testing the Program


    You can test a program at the following levels:


    +   - Unit testing: Refers to testing in which a complex program is divided into
    sub programs and each sub program is then tested separately.

    - Program testing: Refers to testing in which a program is sufficiently small
    to test in one single run.

    - Verification testing: Refers to the process of using a program in a simulated
    environment and identifying design specifications.

    - Validation testing: Refers to the process of using a program in a live environment
    and finding errors.


    # Phase 6: Maintaining the Program


    In this phase, you improve the logic of the program or correct the errors that
    arise during the execution of the program. Improvement or amendment in a program
    requires proper documentation of the program. If one programmer has developed
    the program and another is involved in its maintenance, the programmer involved
    in the maintenance of the program must have complete information about the data
    items of the program and the logical development of that program.


    Now that you have a basic idea of computation, let''s learn about the various
    paradigms used to implement programming.'
