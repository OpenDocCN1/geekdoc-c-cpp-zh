  md: '# Arrays and Strings 99


    The putchar() function writes a character to the standard output device (instance,
    monitor). It returns the character, which is written. In addition, if a write
    error occurs, the stream is set to an error indicator, and the putchar() function
    returns EOF.


    > In C, end-of-file is a condition of an operating system, where no more data
    can be read from a data source. The data source can be a file or a stream. The
    functions, performing file operations or I/O operations, may return a symbolic
    value that equal to EOF, which means an end-of-file condition is encountered.
    The actual value of EOF constant is system dependent number, but generally, it
    is -1.


