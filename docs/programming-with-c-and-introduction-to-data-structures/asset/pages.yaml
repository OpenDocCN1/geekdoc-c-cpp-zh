  md: '# 198 Chapter 6


    The compiler control directives: Refer to the directives that help in identifying
    the parts of code to be compiled under some special conditions

    Preprocessor directive statements are always preceded with a hash (#) symbol and
    never end up with a semicolon (;). Space and tab characters are the only characters
    that are allowed to precede the # character in a single line. The newline character
    is used to end a directive declaration. If a directive fits in one line, you can
    terminate the line using a backslash (\) and continue the directive declaration
    on the next line. For example:


    ```

    #define MacroNameis = a \

    Simple Example.

    ```


    The backslash must precede the newline character while continuing the directive
    on the next line. The preprocessor concatenates both lines by removing the backslash
    and Spaces and tab characters are allowed between the # character and the directive
    name.

    Note that the null is the shortest preprocessor directive. This directive contains
    a line having the # character and some comments or whitespace characters. The
    null directive removes them from the source code.


    # 6.12 #define Directive


    C replaces all the occurrences of a macro name or macro tag with some predefined
    (or text) known as macro body. This process of replacing a macro name with a macro
    body in the preprocessing stage is called macro definition. C provides the #define
    directive to accomplish this task. The syntax of the #define directive is as follows:


    ```

    #define identifier string

    ```


    If the defining statement is included in the beginning of a program, the preprocessor
    replaces every occurrence of the identifier in the source code by the string.
    This string is some predefined value and the identifier is any valid identifier
    name in C language. The #define directive can be used to create symbolic constants
    and function macros.


    +   Creating Symbolic Constants


    Symbolic constant is also called substitution. In this subsection, you learn how
    to define a simple macro using the #define directive. While defining a macro,
    you need to provide an identifier and a value for that identifier. Listing 19
    shows how to create a symbolic constant using the #define directive:


    +   Listing 19: Defining a Symbolic Constant


    ```

    #include <stdio.h>

    /* using the #define directive */

    #define VAL 35

    #define HELLO "HELLO"

    ```'
