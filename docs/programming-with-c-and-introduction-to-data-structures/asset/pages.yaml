    # The Logical Operators


    You can combine the results of multiple relations or logical operations by using
    logical operators. The logical operators are negation (!), logical AND (&) and
    logical OR (||). The negation operator takes only one operand and returns a false
    value if the operand is true and vice-versa. The AND operator returns a value
    1 if both expressions are true and the OR operator returns a value 1 if either
    of the expression is true. It can be explained in a better way using Table 12.


    Table 12: The Logical Operators


    | R1 | R2 | R1 & R2 | R1 || R2 | ! R1 |

    | T | T | T | T | F |

    | T | F | F | T | F |

    | F | T | F | F | T |

    | F | F | F | F | T |


    In short, you can say that the logical AND operator returns True value if both
    the relational expressions are True. The logical OR operator returns True any
    if any one of the expressions are True. The negation operator returns complements
    of value of relational expressions.


