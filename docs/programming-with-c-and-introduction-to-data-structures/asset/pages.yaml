    \nThis is a double ended deque. In other words, we can define it as a double ended\
    \ linear list where insertion and deletion is possible at both ends. This has\
    \ two pointers, LEFT and RIGHT indicate the two ends of the queue. It is further\
    \ divided into two types. Input-restricted and output-restricted. In input-restricted\
