  md: "# 216 Chapter 7\n\nTraversing refers to the process of visiting each element\
    \ of structure. Inserting means to add an element into a structure and deleting\
    \ means to remove an item from the structure. The insertion and deletion are easy\
    \ if they are at the beginning or the end. However, in some cases, we need to\
    \ delete or insert an item from the middle of the structure. Every model has its\
    \ own advantages and disadvantages. Detailed study of these models is beyond the\
    \ scope of this chapter.\n\n# 7.1 Primitive and Non-Primitive Data Types\n\nData\
    \ structures are broadly classified into two categories:\n\n+   * Primitive Data\
    \ Structures: Refer to a basic structure that is built into the programming language.\
    \ A programmer can use the pre-defined or built-in data structures in the program\
    \ to define variables. For example, a float type data structure can be used to\
    \ define a variable named salary. Examples of primitive data structure are: Integer,\
    \ floating point, and character.\n A pointer is used to point a location in computer's\
    \ memory. In other words, pointers are declared to store the memory addresses\
    \ of other variables used in a program.\n* Non-Primitive Data Structures: Refer\
    \ to data structures that are built from primitive data structures, which are\
    \ connected together in meaningful ways. The non-primitive data structures that\
    \ are discussed in this session are array, linked list, stack, and queue. Examples\
    \ of non-primitive data structure are array, linked list, stack, queue, tree,\
    \ and graph.\n\nSome of the data structures are discussed below.\n\n# 7.2 Array\n\
