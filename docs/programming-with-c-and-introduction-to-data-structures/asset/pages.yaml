    # 3.8 Single Character Input-Output Functions


    In C, the getch() function is used to read a single character from the standard
    input device and the putchar() function is used to write a character to the standard
    output device.


    Let''s learn how to use these functions next.


    +   Using the getch() and putchar() in stdio


    The getch() function, available in stdio header file, is used to read input data
    from the standard input device (keyboard). It returns the new character from the
    input stream provided by stdin.h. If the stream is reached to the end-of-file
    (EOF) condition, the stream is set to the EOF constant, and the getch() function
    returns EOF. However, if a read error occurs, the stream is set to an error indicator,
    and the getch() function returns EOF.'
