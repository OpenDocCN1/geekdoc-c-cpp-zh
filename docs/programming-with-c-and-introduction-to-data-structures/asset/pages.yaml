    \nAlgorithm is a step-by-step description of the programming logic where each\
    \ step is numbered in a hierarchical order. In the algorithm, the number of steps\
    \ must be finite, and every step must be complete and error-free. The steps must\
    \ specify the input and output as per the requirement of the user.\n\nThe following\
    \ are some examples of algorithms:\n\n+   Example 1: Calculating the sum of numbers\
    \ 1,2,...,100:\n1. Initialize the sum, s=0\n2. Set counter, c=1\n3. While c is\
    \ less than or equal to 100, the following statements are performed repeatedly:\n\
    \   a. calculate sum as current sum = recent sum + c\n   b. increment c by 1\n\
