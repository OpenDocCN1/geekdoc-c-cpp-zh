    # 6.18 The #error Directive


    The #error directive stops custom error messages at compile time and terminates
    the process of compilation. The following is the syntax of the #error directive:


    ```

    #error [text]

    ```


    The text parameter is optional. The text given is displayed as error message.
    When an error occurs, the compiler stops further processing of the code, exits
    the program, and displays the error message. The text passed as parameter can
    be any preprocessor tokens. It is recommended to use a string literal instead
    of punctuation characters, as single quotation marks, to avoid any error.


    This example tests whether or not the macro ETS is defined and throws an error
    message if it is not defined:


    ```

    #ifndefETS

    #error "Error occurred"

    #endif

    ```


