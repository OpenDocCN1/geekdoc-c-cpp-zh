  md: '# 1.14 The scanf() Place Holders


    scanf() place holder consists of % at the beginning and type indicator at the
    end. Apart from that it can have *, maximum field-width indicator and type indicator
    modifier. For example:


    ```

    scanf("%10.2f %10d",&a, &b);

    ```


    +   * Type Indicators

    Type indicator is specifying the type of data to be read. Table 10 shows the description
    of type indicators:


    | Table 10: Description of Type Indicator |

    | Type Indicator | Result |

    | d, i | Reads signed integers: the expected argument should be a pointer to int.
    However, these are slightly different in functionality. |

    | o | Reads unsigned integer in octal form. |

    | u | Reads unsigned integer in decimal form. |

    | x, X | Reads unsigned integer in hexadecimal form. |

    | E, e, f, G | Reads floating-point values. However, these are slightly different
