    # 1.5 Introducing the C Language


    Unlike other computer languages, such as COBOL (Common Business Oriented Language)
    and BASIC, C facilitates the programmers to develop programs by using the programming
    tools, such as block structures, standalone functions, and keywords.


    C is also considered a structured language as it implements the most important
    feature of a structured programming language, that is, compartmentalization. The
    ability to hide the data or information from the rest of the program to fulfill
    a task is known as compartmentalization. In other words, C, you can create subroutines
    by using variables so that occurrence of an event in a subroutine does not affect
    the entire program. Moreover, unlike other structured languages, C also provides
    for several loop constructs, such as do-while, and for.


    Due to the portable feature of the C language, it is used to develop both system
    and application software. In addition, C can also use the compilers, libraries,
    and interpreters of other programming languages. The C language also serves as
    an intermediate language to implement other languages. However, unlike intermediate
    languages, C does not generate machine specific code. C is also used by the programmers
    to develop the end-user applications.


    In this section, we explore the history and features of the C programming language.'
