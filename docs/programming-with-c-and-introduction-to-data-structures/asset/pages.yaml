    # 7.3 Linked List


    Everyone is linked somewhere. Only that we have to maintain it and access it.
    We can form a list of links to get a chain of links. Link connects the members.


    A linked list is a set of records where each record points to the next record.
    It is a dynamic data structure. When sequential mapping is used for ordered lists,
    the operations such as insertion and deletion of arbitrary element becomes expensive.
    For example, consider a list of string array having three characters in each item.
    Now suppose one wants to add a word at any position in between. The Insertion
    will require moving the elements already in the list one location higher or lower.
    On the other hand, if one decides to remove the word, then one again has to move
    many elements so as to maintain the sequential representation of the list. Now
    when a problem occurs of sequential lists of varying sizes, the sequential representation
    proves to inadequate. This is because storing each list in a different array or
    maximum size space is wasted.


    The solution to this problem of data movement in sequential representation lies
    using linked representation. In this concept, the data items may be placed anywhere
    in the memory. To access elements in the list in the correct order, the address
    or location of the next element in the list is stored.


    Types of linked lists:


    +   1. Circular linked lists.


    +   2. Singly linked lists.


    +   3. Doubly linked lists.


    The circular linked lists have no beginning and no end. The last item points back
    to the first item. Each structure of a singly linked list contains a single link
    that attaches it to the following structure. A doubly linked list contains pointers
    to both, the following structure and the preceding structure.


    A difficulty with singly linked list is that if we are pointing to a specific
    node then we can move certify only in the direction of the links. The only way
    to find out the preceding node is to start at the beginning of the list. This
    problem arises in case of insertion and deletion also.


    If we need in both directions then it is useful to have doubly linked lists. In
    doubly linked list, each node has two link fields.


    +   linking in the forward direction


    +   linking in the backward direction.'
