    # 4.3 Types of Functions in C


    While writing programs using the language, various statements such as printf(),
    scanf(), get(),(), circ() are used in most of the programs. These statements are
    functions, which are already defined in C library. Moreover, the main() function
    is the function where the execution of a program starts; therefore, this function
    is used in all the C programs.


    The various functions that the C compiler provides to the programmers are built-in
    functions. These functions are also called built-in or built-in library function.
    In addition to the functions provided by the C compiler, you can create functions
    in your C program to perform various tasks. Therefore, you can conclude that there
    are two types of functions used in C:


    +   - Built-in functions

    - User-defined functions


    Let''s discuss these types of functions in the following sections.


    # Built-in Functions


    Built-in functions or built-in library functions are the functions provided in
    the library of the C compiler. These are functions that are commonly required
    to write a C program. Therefore, these functions are created and stored in the
    library of the C compiler by C developers. The various types of built-in library
    functions in C are as follows:


    +   - String manipulation functions

    - Memory management functions

    - Buffer manipulation functions'
