  md: '# History of C


    Prior to C, the Basic Combined Programming Language (BCPL) was used, which was
    introduced by Ken Thompson. The C language had derived many features from the
    B language. In addition, with the introduction of struct types, the C language
    became more popular; and there, the UNIX kernel was re-written in C.


    Initially, the version provided along with the UNIX operating system was the facto
    standard for the C language. This version was firstly described in ''The C Programming
    Language'', written by Ken Ritchie and Dennis Ritchie. Later, in 1983, a committee
    was introduced to create the American National Standards Institute (ANSI) standard
    to define the standard of the C Language. Finally, the ANSI standard was developed
    in early 1990s. This standard was also adopted by International Standard Organization
    (ISO) to develop ANSI. By the end of 1999, the C standard was referred as C99.
    The following are the standards of the C language:


    +   - K&R C: Refers to standards for the C language defined in the first edition
    of ''The C Programming Language'' book. The K&R standard provides several language
    features, such as input/output, long int type, unsigned int type, and compound
    assignment operator.

    - ANSI and ISO C: Refers to the C standard that was defined by the ANSI committee
    in 1983. Later, ISO adopted this standard and developed ISO C, which is also referred
    as C90.

    - C99: Provides several new features, such as inline functions, new data types-
    long int, variable-length arrays, and support for single line comments.

    - C1X: Refers to the C standard, in which the C standard committee adopted guidelines
    to limit the introduction of the new features until they are tested by existing
    implementations.


    After understanding the history and standards of the C language, let''s now explore
    its features.


    # Features of C


    The following are the features of the C language:


    +   - Is a structured programming language

    - Provides various operators, such as arithmetic, increment, decrement, and relational

    - Helps to develop efficient programs and system software

    - Can be compiled and executed on any computer

    - Allows manipulation of internal processor registers

    - Provides various data types, such as int, float, and char

    - Allows the use of pointers for memory, array, structures and functions

    - Allows the programmers to make extensive use of function calls'
