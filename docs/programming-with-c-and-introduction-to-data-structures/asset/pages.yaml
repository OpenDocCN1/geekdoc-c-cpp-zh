    # The Conditional Operators


    Conditional operators, more commonly called the ternary operators (? :) in C are
    used to return values that are based on the outcome of relational expressions.
    For example, in case you want return value 1 if the expression is True or return
    2 if the expression is False then you can use Ternary operator. The syntax for
    conditional operators in C is:


    ```

    e1 ? e2 : e3

    ```


    In the preceding syntax, first, e1 is evaluated, which if true, and e2 is evaluated,
    which then becomes the result of the expression. If e1 is false, e3 is evaluated,
    which, then becomes the result of the expression.


    Let''s consider the program in Listing 9 to understand the conditional operator
    in C:


    +   Listing 9: Using the Conditional Operator


    ```

    #include<stdio.h>

    void main () {

    int a = 25;

    int b = 95;

    int result1;

    int result2;

    result1 = a > b ? a : b;

    printf("the value of result1 is = %d\n", result1);

    result2 = a < b ? a : b;

    printf("the value of result2 is = %d\n", result2);

    getch();

    }

    ```


    When you run the program in Listing 9, you get the following output:


    ```

    The value of result1 is = 95

    The value of result2 is = 25

    ```


