  md: '# Introduction


    The book contains the comprehensive content on the various concepts of the C programming
    language. On a broad basis, the book covers the introduction to the variables,
    constants, functions, data types, operators, conditional statements, arrays, strings,
    parameter passing mechanism, passing arrays in function, recursive functions,
    structures, file management, pointers and preprocessors, types of data structures
    as primitive and non-primitive data types, arrays, linked list, stack, tree, graphs,
    and queues.


    We hope that your learning experience with this book will prove as irresistible
    to you as it has proved to us while authoring and editing the book.


    # About this Book


    Programming with C and Introduction to Data Structures extends the approach of
    using C programming language by explaining basic model of computation, paradigms
    of programming, steps to develop a program, introduce constants, data types, constants,
    and variable. The range of topics and coverage offered by this book is a superior
    mix of description about various C programming concepts, with all relevant details
    on C language and practical examples to use C concepts such as variables, constants,
    control statements, pointers, and structures.


    This book is ideal for beginners, who intend to familiarize themselves with fundamentals
    of C programming language.


    This book mainly covers the following:


    +   Fundamental concepts of C language such as data types, constants, variables,
    operators, and operator precedence


    +   Use branching and looping statements such as conditional statements including
    the if, if-else statement, nested if-else statement, cascading if-else statement,
    switch statement, nested switch statement, iterative statements, such as loop,
    do-while loop, and for the loop; and jump statements, such as break statement,
    continue statement and goto


    +   Implement arrays and strings by understanding their types and limitations,
    reading and printing strings, string input and output functions, single character
    input-output functions, creating an array of strings, performing string operations,
    and using string manipulation functions


    +   Functions and program structure in C, location of functions, types of functions
    in C, parameter passing mechanism, passing arrays in function, using the void
    and parameter less functions, and recursive functions'
