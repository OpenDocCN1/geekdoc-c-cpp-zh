  md: '# Chapter 1


    # The char Data Type


    The char data type is used to store character type data. A char data type takes
    1 byte for storage. It can store data type that can be either a character constant
    or a string constant.


    A character constant is a single character enclosed within a pair of single quotes.
    For example ''A'', ''s'', ''@'', ''4''. The character constant can be signed or
    unsigned. The signed characters that have values in the range of -128 to +127
    whereas, the unsigned characters have values in the range of 0 to 255. Each character
    constant contains an integer value, which is provided by the ASCII (American Standard
    Code for Information Interchange) set. Table 5 lists some of the character constants
    along with their corresponding ASCII values:


    Table 5: Character Constants and their ASCII Values

    | Character Constant | ASCII Value |

    |---||

    | ''a'' | 97 |

    | ''s'' | 115 |

    | ''M'' | 77 |

    | ''D'' | 68 |

    | ''1'' | 49 |

    | ''3'' | 51 |

    | ''@'' | 64 |

    | ''?'' | 63 |


    A string constant is a sequence of characters enclosed within a pair of double
    quotes. For example "software", "Programming", "competitive". A string constant
    should always be terminated by a null character (0). The null character indicates
    the end of a string constant.


    # The int Data Type


    The int data type is used to store numbers, which are a set of non-negative integers
    including 0. The range for an int data type depends on the word length defined
    for a computer.


    > A word length refers to the number of bits a data computer is allowed to read
    or write at a single time.


    In case of an 8-bit computer, the range of int data type can be -2^7 <= integer
    number <= 2^7-1 or -128 <= integer <= 127. This means that an 8-bit computer can
    have an input range of maximum integer value of either -128 or +127. Similarly,
    a 16-bit computer can have an integer range from -32768 to +32767.


