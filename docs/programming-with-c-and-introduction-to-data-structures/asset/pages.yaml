    Let''s learn how pointers are used with arrays in C.


    # Working with Arrays and Pointers


    As you know that an array is a set of homogeneous elements, which means in an
    array all the elements are stored adjacent to one another. Therefore, you can
    access an array by using a single pointer.


    For example:


    ```

    int aa[5] = {10,15,20,25,30};

    ```


    The array without any subscript returns the base address that means the memory
    location of its first element.


    The first element of the array that we have created in the preceding code is aa[0]
    and the last element is aa[4]. The array elements and their values are represented
    with their addresses, which are as follows:


    | Variable name | aa[0] | aa[1] | aa[2] | aa[3] |

    |---|---|---|---|---||

    | aa[4] | 10 | 15 | 20 | 25 | 30 |

    | Address | 1004 | 1006 | 1008 | 1010 | 1012 |

    | aa | is equivalent to | &aa[0] | | |

    | aa+0 | is equivalent to | &aa[0] | | |

    | aa+1 | is equivalent to | &aa[1] | | |


    Note that an increment in the address gives the address of the next element and
    therefore.


    +   * "aa is equivalent to &aa[0]

    * "aa+i) is equivalent to &aa[i]"


    Consider a two-dimensional array aa[i][j]. The expression is


    | aa | is equivalent to | &aa[0][0] = &aa[0] |

    | aa+1 | is equivalent to | &aa[1][0] = &aa[1] |

    | *(aa+i) | is equivalent to | &aa[i][0] = aa[i] |

    | aa[i]+j | is equivalent to | &aa[i][j] |

    | *(aa+i)+j | is equivalent to | &aa[i][j] |

