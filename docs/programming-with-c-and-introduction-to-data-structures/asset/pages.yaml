  md: '# Chapter 1


    Further, one of the essential operations performed in C programs is to provide
    input values to the program and output the data produced by the program to a standard
    output device. Input refers to entering some data into the program and output
    refers to displaying some data on the screen, printer or in any file. You can
    provide input in the form of file or as a command from the command prompt. C programming
    provides a set of built-in functions such as printf() and scanf() to read the
    input and output the required data. Input can also be provided directly in the
    program by assigning the values to the variables.


    Operators in C are symbols, which are used to perform not only arithmetic calculations
    such as addition, subtraction, multiplication, or division but also logical computations.
    The operators specify the type of operation that needs to be applied. The values
    that are operated by operators are operands.


    The combination of variable and constants along with the C operators creates expressions.
    In other words, operators take more than one expression or operand to perform
    arithmetic and logical operations on it. The expressions are evaluated by the
    operator precedence rules, which determine the order in which the operators in
    an expression are evaluated.


    In this chapter, you learn to solve a problem through different programming approaches.
    You also learn about history and features of the C language. This chapter explores
    the basic concepts of the C language, such as character sets and tokens. It also
    discusses the basic structure of a C program.


    In the chapter, you also learn about data types and constants the use of printf()
    and scanf() functions. Further, you learn about the different operators that are
    used in the C programming language. Toward the end, you learn the operator precedence
    used in C.


    # Basic Model of Computation


    Computation refers to the process of arriving at output from a given program,
    a problem statement, or a given decision. This process should be logical, and
    the problem should follow a step-by-step approach to arrive at a meaningful output
    or result. To achieve the desirable output, you should follow the basic model
    of computation.


    The basic model of computation includes a series of phases starting from defining
    a problem, analyzing that, designing and planning the process to be followed,
    coding of the actual program, testing the created program, and maintaining the
    program.


    Let us discuss these details in the following sections.


    +   Phase 1: Defining the Problem


    In this phase, a programmer has to define the task precisely and check for completeness.
    The defined problem should not be ambiguous, imprecise, or arbitrarily defined.


    For example, if you need to solve a quadratic equation, but it is not specified
    whether you have to find the value of the roots of the quadratic equation or the
    nature of the roots, or both. In this case, the problem is incomplete. Therefore,
    different programmers may approach this problem according to their understanding.'
