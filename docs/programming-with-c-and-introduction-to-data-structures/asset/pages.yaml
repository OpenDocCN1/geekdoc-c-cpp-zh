  md: '# 04 Working with Functions


    +   OBJECTIVES

    - Functions and Program Structure in C

    - Location of Functions

    - Types of Functions in C

    - Parameter Passing Mechanisms

    - Passing Arrays in Function

    - void and Parameter Less Functions

    - Recursive Functions


    A function is a group of statements that perform a specific task. While writing
    programs using the C language, you need to write various statements to perform
    a task. When a task is performed repeatedly, the statements required to perform
    the intended task at various places in the program become tedious. Therefore,
    you can write the repetitive code in the form of a function and use this function
    to perform the intended task. In other words, the use of functions in a program
    provides modularity, easy error detection, and correction in the program. The
    C compiler provides you with some functions that you can use in your program to
    perform various tasks such as, displaying a message, getting input from the console,
    and calculating the square root of a number. The functions provided by the C compiler
    are all built-in functions. However, the functions that you create in your program,
    are called user-defined functions.


    In this chapter, you learn about the functions used in a C program. You also learn
    about void and parameter less functions and the passing of parameters to the functions
    in this chapter. Moreover, the chapter also discusses the passing of an array
    to functions. Next, you learn about the recursive functions in detail, in this
    chapter.


    # 4.1 Functions and Program Structure in C


    Functions are used to avoid the repetition of codes in a program. In addition,
    it provides modularity, code manageability, and code reusability in the program.
