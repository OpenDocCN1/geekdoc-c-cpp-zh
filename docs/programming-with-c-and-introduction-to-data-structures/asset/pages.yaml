    # The typedef Statement


    The typedef statement allows you to create a new data type from an existing data
    type. The new data type has a different name but same characteristics as of the
    existing data type. You can create a new data type from both a predefined data
    type, such as int, char, and float, and a user defined data type, such as a structure.
    You can use the new data type to declare variables and arrays of the original
    data type. The scope of the new data type is limited to the function in which
    it is created.


    The syntax of the typedef statement is as follows:


    ```

    typedef old_data_type new_data_type;

    ```


    In the preceding syntax, typedef is a keyword, old_data_type is the name of the
    original data type, and new_data_type is the name of the new data type.


    The following code snippet creates a new data type, integer, from the predefined
    data type, int, and then declares three variables and an array of type integer:


    ```

    typedef int integer;

    integer a, b, c;

    integer arr[10];

    ```'
