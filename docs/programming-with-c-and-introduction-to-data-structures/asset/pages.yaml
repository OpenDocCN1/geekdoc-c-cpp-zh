  md: '# Chapter 6


    Sometimes pointers are set to zero to make them null pointers or tested against
    zero to see if they are null. The pointers that point to nothing are called null
    pointers. In simple words, we can say that a null pointer is a pointer that has
    a special value to indicate that it is not pointing to any valid reference or
    memory address. This is the result of type casting the integer value zero is type
    cast to any pointer type. For example:


    ```

    int *ptr;

    ptr = 0;

    ```


    The null pointers are completely different from the void pointers. A null pointer
    is a pointer type indicating that it is pointing to nothing whereas a void pointer
    is a pointer type that points to something with a specific type. If a null pointer
    constant is assigned to any other pointer, or for equality with any other pointer,
    then it is first converted to that of other pointer. Listing 3 shows how to initialize
    a pointer variable:


    +   Initializing a Pointer Variable


    ```

    #include <stdio.h>

    #include <conio.h>

    main()

    {

    int a=30, *ptr1;

    clrscr();

    ptr1=&a;

    printf("\nnThe value of a is %d \n", ptr1);

    *ptr1=100;    /* Pointer Initialization*/

    printf("\nnThe value of a after initializing the pointer variable is %d \n\",
    ptr1);

    getch();

    }

    ```


    Output:


    ```

    The value of a is 30

    The value of a after initializing the pointer variable is 100

    ```


    In Listing 3, the ptr=&a statement specifies that the address of the a variable
    is assigned to the pointer variable, ptr1, and the first printf() function prints
    the value of the a variable. When ptr1 is initialized with the value 100, the
    value of the a variable is changed in the memory location and the second printf()
    function prints the new.


    Let''s now learn how to dereference a pointer.'
