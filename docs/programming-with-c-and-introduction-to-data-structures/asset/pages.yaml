  md: '# 6.10 Allocating Memory at Runtime


    During compilation, C needs number of elements in an array. If the array elements
    are not found appropriate, the program execution fails or causes memory wastage.


    In some languages, as BASIC, it is possible to input the array size during program
    execution. This process of allocation of memory size at runtime is referred to
    as dynamic memory allocation.


    In C, there are four libraries called memory management functions for the purpose
    of memory management. Table 1 describes the tasks of these functions:


    | Table 1: Describing the Tasks of the Memory Management Functions |

    | Function | Task |

    | malloc() | Allocates memory from a pool and returns a pointer to a block of
    contiguous of the specified size |

    | calloc() | Allocates memory for array elements, initializes them to 0, and returns
    a pointer to the memory |

    | free() | Frees the block that are previously allocated by malloc() and calloc()
    |

    | realloc() | Modifies the size of a previously allocated block |


    The program instructions and global variables are stored in a permanent storage
    area where local variables are stored in another area stack. The memory space
    that is located between these two regions is available for dynamic allocation
    during program execution. This free region is known as heap. Due to creation and
    termination of local variables, the size of the heap keeps changing during program
    execution. Let''s now discuss all the aforementioned memory management functions
    by one.


    +   * malloc()

    When a C compiler executes a function, the memory is allocated to local variables.
    The memory is taken from a free pool. Free pool refers to a memory that is not
    used by a program. After completing the execution, allocated memory is returned
    to the free pool for subsequent execution. The syntax of malloc() is as follows:


    ```

    malloc(nob);

    ```


    where, nob (number of bytes) represents the contiguous memory locations to be
    allocated.

    The malloc() function allocates memory from a pool. The malloc() function takes
    integer value as a parameter that specifies the number of bytes to be allocated.
    It returns a pointer to a block of contiguous memory of the specified size. The
    pointer is actually of char *, but it can be cast into any other type as per requirement.'
