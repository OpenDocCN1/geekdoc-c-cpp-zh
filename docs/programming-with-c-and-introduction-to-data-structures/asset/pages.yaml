    The student structure in the preceding snippet contains four members: two variables,
    roll_no and age, to store roll number and age of student, a char array, name,
    to store the name of the student, and a char variable, grade, to store the grade
    of the student.


    +   Declaring Structure Variables


    After defining a structure, you can declare variables of the structure type in
    the same way as you declare variables of a predefined data type, such as int,
    char, float, and double. The syntax for declaring a structure variable is as follows:


    ```

    struct structure-type variable-name;

    ```


    You can also declare multiple structure variables using a single line of code
    by using the following syntax:


    ```

    struct structure-type variable1, variable2, variable3,.... variabel;

    ```


    The following code snippet declares two variables of type student:


    ```

    struct student1, student2;

    ```


    You can combine the definition of a structure and the declaration of the structure
    variables together, as shown in the following syntax:


    ```

    struct structure-name {

    data-type1 variable1;

    data-type2 variable2;

    data-type3 variable3;

    ......

    data-typen variabel;

    } structure-variable1, structure-variable2,.... structure-varin;

    ```'
