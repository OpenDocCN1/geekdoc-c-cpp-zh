    # 6.1 Understanding Pointers


    A pointer is a variable that holds the address of another variable stored elsewhere
    in the computer memory. The pointer variable contains only the address of the
    referenced variable not the value stored at address. Pointers are generally used
    to point to the variables, such as array, structures, unions, and the variables
