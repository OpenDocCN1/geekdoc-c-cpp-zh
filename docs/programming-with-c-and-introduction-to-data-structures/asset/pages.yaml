    # The Increment and Decrement Operators


    You can increment or decrement the value of a variable by using the increment
    (++) or decrement--) operator. The increment operator is used to add 1 to its
    operand and the decrement operator is used to subtract 1 from its operand. In
    other words, the increment operator increases the value of an integer by 1 and
    the decrement operator decreases the value of the integer by 1. These operators
    can be applied only to variables using either the prefix or postfix form.


    When prefix form is used, the value of the variable is either incremented or decremented
    first and is then assigned. However, in the postfix form, the value is used and
    only after the assignment operator has performed the operation, that the value
    is incremented or decremented.


    The following is an example of the increment operator:


    ```

    a = ++ b

    ```'
