    # 6.13 The #include Directive


    C provides the #include directive to include a file in the source file of a program.
    An external containing functions or macro definitions can be included as a part
    of a program so that you need not rewrite these functions or macro definitions.
    This is achieved with the help of the preprocessor #include "header filename",
    where filename is the name of the file containing the required definitions or
    functions. At this point, the preprocessor inserts the entire contents of the
    file into the source code of the program. C language compiler searches a file
    in the current directory and in the standard directories if the file name is specified
    within double quotation.


    Alternatively, this can also be used in the #include <filename>, that is, without
    double quotation mark. In this case, the file is searched only in the standard
    directories, and this type of declaration is used only in case of standard header
    files. Nesting of included files is allowed, that an included file can include
    other files. However, if a file is not found, an error is reported and the compilation
    is terminated. Listing 21 shows the implementation of the #include directive:'
