    # 4.6 void and Parameter Less Functions


    A void function is a function that does not return a value. A void function is
    created similar to a function that returns a value. However, in this case, the
    return type used is void, which indicates that the function will not return any
    value. This type of function will perform a particular task and then the program
    control is returned to the calling function. A good example of void function is
    to print a series of numbers in a particular order. The following is the syntax
    of the void function:


    ```

    void function_name (int a, int b)

    ```


    In the preceding syntax, void is the return type, function_name is the name of
    the function, and a and b are integer variables passed as parameters to the function.


    To ensure that the program control is returned back to the calling function, you
    must specify the return keyword before ending a void function, as shown in the
    following code snippet:


    ```

    return;

    }

    ```


    Let''s understand now about a parameter less function.


    A parameter less function does not have any parameters. In such a function the
    void keyword is used twice that at the beginning of a function declaration and
    also inside the parenthesis to indicate that there are no parameters. Even if
    you do not specify the second void keyword the program will work. However it is
    recommended to specify the void keywords at both the places. The following is
    the syntax to declare a parameter less function:


    ```

    void function_name (void)

    ```


    Even without specifying the return keyword, the program control in a void function
