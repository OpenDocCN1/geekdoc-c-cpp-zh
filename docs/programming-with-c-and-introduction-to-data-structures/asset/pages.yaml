    | Mode of Opening the File | Description |

    |--- | --- |

    | w | Creates a new file. If the file already exists then its data is deleted.
    |

    | a+ | Opens a text file to perform read and append operations. If the file not
    exist then it is created and if it exists then the new data is appended at the
    end of the file. |

    | wb | Creates a binary file. If the file already exists then its data is deleted.
    |

    | rb | Opens a binary file in read-only mode. The file must exist. |

    | ab | Opens a binary file to append the new data. If the file does not exist
    then it is created. |

    | wb+ | Creates a binary file to perform read and write operations. If the file
    already exists then its data is deleted. |

    | rb+ | Opens a binary file to perform read and write operations. The file must
    exist. |

    | ab+ | Opens a binary file to perform read and append operations. If the file
    does not exist then it is created and if it exists then the new data is appended
    at the end of the file. |


    The `fclose()` function is used to close a file. Closing a file means removing
    its connection from the program and saving its content.


    The following is the syntax for closing a file:


    ```

    fclose(fp);

    ```


    In the preceding syntax, `fp` is a pointer of `FILE` type and refers to a file
    to be closed.


    # ### File Input and Output Operations


    After you a file, you can read the data stored in it or write new data into it.
    C offers few functions that can be used to perform input and output (I/O) operations
    on files. Such functions are called I/O functions.


    You can read a single character at a time from a file is useful in scenarios where
    you need to keep track of every single character instead of reading an entire
    string. The fgetc() function takes a pointer as a parameter and returns an int
    value. The syntax to use this function is as follows:


    ```

    int fgetc(FILE *fp);

    ```


    While reading you reach the end of the file this function returns "EOF". EOF is
    a constant which indicates that you have reached the end of the file.'
