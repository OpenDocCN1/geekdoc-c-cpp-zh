    # Character Manipulation Functions


    The character manipulation functions are the built-in library functions used to
    perform various types of character manipulation in a C program. The following
    are the noteworthy built-in character manipulation functions used in a C program:


    +   - islower(char c): Checks whether the specified character is a lower case
    character and returns a nonzero value if c is a lower case character.


    +   - isupper(char c): Checks whether the specified character is an upper character
    and returns a nonzero value if c is an upper case character.


    +   - isnum(char c): Checks whether the specified character is an alphanumeric
    character and returns nonzero value if c is an alphanumeric character.


    +   - charlower(char c): Returns the corresponding lowercase of the specified
    character (if one exists and if the islower(c) function returns nonzero value
    for the character) otherwise, it returns c.


    +   - toupper(char c): Returns the corresponding uppercase of the specified character
    (if one exists and if the isupper(c) function returns nonzero value for the character)
    otherwise, it returns c.


    # Error Handling Functions


    The error handling functions are built-in functions that are used to manage errors
    during C programming. The following are the noteworthy error handling built-in
    functions used in a C program:


    +   - void error(const char*str): Displays a message on that standard error output
    describes the last error encountered in a C program.


    +   - char*strerror(int errcode): Returns a string describing the error code passed
    as the argument errcode.


