  md: '# Phase 2: Analyzing the Problem


    In the problem definition phase, a programmer has to reflect on all the possibilities
    of a solution to the problem. When a programmer defines a problem, a proper analysis
    of that problem is required, which helps in designing and coding for the solution
    of that particular problem.


    In this phase, the programmer has to declare the computational strategies to analyze
    the defined problem with help of available resources, such as a database. Programming
    techniques, including sequence, selection, and iteration, can be used to develop
    the logic for the analysis with the help of searching, sorting, and merging. Different
    procedures, such as arithmetic, logical, and relational, are followed to analyze
    the problem.


    After the problem is analyzed, the next phase is to design a program to solve
    the problem.


    # Phase 3: Designing a Program


    After defining and analyzing the problem, you need to design a solution for the
    problem. In this phase, you select a solution depending on the amount and nature
    of the data that is be stored. An algorithm provides a way to solve a problem.


    Another way to design a solution for a problem is to use the top-down design approach.
    In this approach, the problem is divided into a hierarchical structure of modules.
    A separate program may be designed for each module. The top-down approach provides
    a method to handle the inherent logical complexity of the problem. This allows
    a programmer to build a solution in a step-by-step manner. A flowchart is a good
    example for the top-down design approach.


    After learning about designing phase, let''s discuss the coding of a program in
    the next section.


    # Phase 4: Coding a Program


    In the coding phase, a programmer needs to write a program for the problem which
    helps in solving the problem. However, before coding a program, you must develop
    its logic by using program development tools, such as algorithms, pseudocode and
    flowcharts. You can also divide a program into smaller programs for easier programming.
    This procedure is called refinement of the original problem. You can define the
    data items, variables, and constants in a program writing the code for the program.
    The structure of a program consists of the following elements:


    +   - Data item definition

    - Initialization

    - Input statements

    - Assignment statements

    - Imperative statements'
