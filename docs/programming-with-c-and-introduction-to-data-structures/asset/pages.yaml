  md: '# The double Data Type


    The double data type is used to store real numbers that have a double-precision
    floating-point. The precision is related to the accuracy of data. When you require
    more accuracy in representing the floating-point numbers, you must use the double
    data type. A double data type value is similar to a normal float data type value.
    However, the number of digits stored after the decimal point is the digits stored
    in case of the float data type. A float data type stores a maximum of 6 digits
    after the decimal point whereas a double data type stores 16 digits after the
    decimal point. For example, 215.000003456287654, -0.7384690076001239.


    # The void Data Type


    The void data type stores no values and therefore cannot perform any operations
    on a variable that is declared void. It is the only non-specific data type in
    C. Unlike all other data types, the void data type has no size nor any permissible
    range. It is typically used to return the result of a function that returns no
    value. A function is a set of instructions which performs some actions and returns
    a value to the calling function. When a function returns no value, you can declare
    its return type as void.


