    # The Bitwise Operators


    The bitwise operators operate as operand of bits and the bit operations are done
    on this operand. There are 6 bit operators in C: AND(&) operator, OR(|) operator,
    XOR(^) operator, complement() operator, left shift(<<) operator, and right shift(>>)
    operator. The different bitwise operators have been explained in detail in Table
    13:


    | Table 13: Bitwise Operators in C |

    | Operator | Explanation |

    | & | Compares each bit of the first operand with the corresponding bit of the
    second operand. If both bits are 1, then the corresponding bit is set to 1, else
    it is set to 0. |

    | | Compares each bit of the first operand with the corresponding bit of the second
    operand. If either of the bit is 1, the result is set to 1, otherwise the result
    is set to 0. |

    | ^ | Compares each bit of the first operand with the corresponding bit of the
    second operand. If either bit is 0 and the other bit is 1, the result is set to
    1, otherwise the result is set to 0. |

    | ~ | Assigns every bit that is 1 in the operand as 0 in the result and vice-versa.
    |

    | << | Shifts their first operand to its left. |

    | >> | Shifts their first operand to its right. |


    Lets consider the program provided in Listing 8 to understand the bitwise operators
    in C:


    +   Listing 8: Using the Bitwise Operators


    ```

    #include <stdio.h>

    {

    int x, y;

    x = 78;

    y = 456;

    x = x >> 3;

    printf("The value of x is %d\n", x);

    y = y << 7;

    printf("The value of y is %d\n", y);

    getch();

    }

    ```'
