  md: '# 1.2 Paradigms of Programming


    Programming in computers can be referred to as the way a sequence of steps or
    instructions are written in a particular programming language to perform a predefined
    task. Ever since the inception of computer programming, various methodologies
    have evolved to implement programming in efficient way. Some of the well known
    programming paradigms are as follows:


    +   - Procedural Programming: Refers to the programming paradigm that is based
    on procedure calls. A procedure contains a sequence of computational steps that
    can be called anywhere during the execution of a program. C follows the Procedural
    Programming paradigm.


    +   - Functional Programming: Refers to the programming paradigm in which computation
    depends on evaluation of mathematical functions. Information Processing Language
    (IPL) follows this paradigm.


    +   - Logic Programming: Refers to the programming paradigm that uses logic for
    computer programming. Prolog is one such language that follows this paradigm.


    +   - Object-Oriented Programming: Refers to the programming paradigm that includes
    features such as information hiding, data abstraction, modularity, polymorphism,
    and inheritance. Languages such as Smalltalk, C++, and C# follow this paradigm.


    In the next section, you learn about the structures in a program.


    # 1.3 Main Programming Structures


    Programming can be categorized in the following three main structures:


    +   - Sequence: Implies that there is no intervening control structure and the
    control flows normally from one step to the next step in sequence without any
    change in the program control.


    +   - Selection: Refers to the decision-making based on the evaluated result of
    a specified condition. It is applicable when several options are available, and
    the programmer has to select the one depending on some criteria.


    +   - Iteration: Refers to the repetition of the same logic for execution till
    a specified condition is true. It has both time and effort of writing the same
    statements repeatedly. It is a loop that has an iterative structure.


    You can select any condition or all preceding structures according to your requirements.
    For example, if there is no condition in the program logic, then the program can
    be categorized as a sequence. However, if the logic contains a condition whose
    result may be any of the available outputs, then selection is applicable. In case
    you have to repeat the same logic again and again, iteration is suitable.


    In the next section you learn about the structures used to develop a program.'
