    # 1.10 Introducing Variables


    A variable is entity whose value changes during the execution of a program. The
    variables are the names provided to identify the programming elements. As a variable
    is used to identify a value; therefore, variables are also called identifiers.
    Variables also refer to a specific location in the memory where data can be stored
    easily. Each variable has a name and data-type. All variables must have their
    type indicated so that the compiler can record all the necessary information about
    them, generate the appropriate code during translation, and allocate the required
    space in the memory. You can use variables to represent constants.'
