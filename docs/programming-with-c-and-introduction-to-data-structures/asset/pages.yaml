  md: '# 8 Chapter 1


    +   - Flowcharts


    A flowchart is a graphical representation of an algorithm. Generally, graphics
    are more understandable than text. We can memorize the graphical form more easily
    and retrieve it quickly. The logic in a flowchart is developed by using data items,
    mathematical expressions, equations, and conditions; some predefined symbols are
    also used for each step. A flowchart follows a two-dimensional approach, where
    the logic flows from the top to the bottom. A flowchart is not specific to any
    language and can be created in any language. With a flowchart, you can easily
    understand the data and the control flow of the algorithm. Flowcharts also help
    in debugging and error-correction. Developing the logic for a program becomes
    very easy in flowcharts with the use of symbols.


    Let''s discuss the symbols used in a flowchart and some examples to illustrate
    the use of flowcharts in the following sections.


    # Basic Flowchart Symbols


    In a flowchart, symbols are used to represent a sequence of operations, the flow
    of data, and the resources required to complete a task. The task is normally from
    top to bottom and left to right. Table 1 shows the commonly used symbols of a
    flowchart:


    | Table 1: List of Flowchart Symbols |

    | Symbol | Name | Description |

    |---|---|--|

    | | Terminator | Represents the terminal points (Start / Stop). |

    | | Process | Represents the process steps defined in an algorithm. |

    | | Data (I/O) | Indicates the reading operation used for the input/output of
    data or information from/to any device. |

    | | Decision | Indicates the decisions (questions) regarding the flow of a program
    and consequently the branch points or paths to be followed based on the result
    of the question. |

    | | Flow Line | Shows the direction of a flowchart and connects the various flowchart
    symbols. |

    | | Connector | Shows the continuation of one point in the process flow to another.


    # Sample Logic Using Flowcharts


    Let''s now illustrate the use of flowcharts through examples. These examples show
    how symbols are represented in flowcharts and help to understand an algorithm.'
