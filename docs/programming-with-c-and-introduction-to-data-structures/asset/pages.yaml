    # 1.11 The printf() Function


    The printf() function is used to display information on the screen. It returns
    the number of characters printed by printf() function, or a negative value if
    an output error occurs.


    The syntax for printf() function is:


    ```

    printf("control character", variable_list\);

    ```


    where control character determines the type and format of the variables to be
    displayed. And variable_list is the list of variables that you want to display.

    Let''s see some example where we have used the printf() function:


    ```

    printf("kogent learning solution:\");

    printf("%d", var1);

    printf("%f %f", m, n);

    printf("nSum of four numbers=%d", sum);

    printf("\n A=%d, B=%d", a, b\);

    ```


    First statement displays text enclosed within the pair of double-quotes.

    Second statement displays the value of var1.

    Third statement displays the values of m and n.

    Fourth statement displays the message and displays the value of sum variable next
    to it.

    Fifth statement displays the value of variables a and b next to A= and B.


