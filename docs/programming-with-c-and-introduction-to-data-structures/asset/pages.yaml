    Let''s now discuss how to represent an algorithm using pseudocode.


    # Pseudocode Solution to Problem


    Pseudocode is an informal method of representing a program and does not require
    any programming syntax. Usually, programs are developed by programming languages,
    such as Java, C or C++ and all of these follow a specific syntax to write a program.
    On the contrary, pseudocode does not require syntax instead it provides a basic
    representation of the actual program.


    The following example illustrates a pseudocode:


    ```

    begin

    define: average, mark1, mark2, mark3, mark4

    print: "Enter the marks for four subjects"

    read: mark1, mark2, mark3, mark4

    calculate: average = [mark1 + mark2+ mark3+ mark4] / 4

    print: "The average of marks scored is " average

    end

    ```


    Let''s now discuss how to use a flowchart, which is the graphical representation
    of an algorithm.'
