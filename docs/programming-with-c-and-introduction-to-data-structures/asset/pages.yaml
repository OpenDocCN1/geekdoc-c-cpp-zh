    Let''s learn how to allocate memory at runtime in the C language.


    # 6.9 Pointers to Pointer


    As already stated, a pointer is a variable that can hold the address of another
    variable. When a pointer variable is declared, the compiler assigns an address
    to it. A pointer address can be assigned to another pointer variable. When the
    address of another pointer variable is assigned to another pointer variable, in
    such case, the later pointer points to the first pointer. This type of declaration
    is called a pointer to pointer variable. This chain of declaration can continue
    to any extent.


    The following code illustrates a pointer to pointer declaration:


    ```

    int **p;

    ```


    Note that when a single asterisk * is used to declare a variable it is a simple
    pointer variable and when double asterisk ** is used it is pointer to pointer
    declaration.


    Listing 17 illustrates a program that prints the value of a variable using pointer
    and pointer to pointer:


    +   Listing 17: Code Demonstrating the Use of Pointer to Pointer


    ```

    void main()

    {

    int ct=2, *ptr1, **ptr2;

    ptr1=&ct;

    ptr2=&ptr1;

    clr();

    printf("\n Value of ct = %d Address of ct = %u\n", ct, ct);

    printf("\n *ptr1 value of ct = %d Address of ct = %u\n", ptr1, ptr1);

    printf("\n *ptr2 value of ct = %d Address of ct = %d\n", ptr2, ptr2);

    }

    ```


    ```

    Output:

    Value of ct = 2 Address of ct = 4056

    Through *ptr1 value of ct = 2 Address of ct = 4056

    Through *ptr2 value of ct = 2 Address of ct = 4056

    ```


    In Listing 17, ptr1 is a pointer variable and ptr2 is a pointer to pointer variable.
    The address of variable ct is assigned to ptr1. Similarly, the address of ptr1
    is assigned to ptr2. The program displays the value and address of the variable
    ct using the pointer variables.'
