  md: '# Introduction to Preprocessors


    In C programming language, a preprocessor comprises a part of the C compiler packages.
    It is a program that processes the source code before compiling and translating
    it into a machine language and hence the name. In other words, preprocessor statements
    provided in a program are not the program statements; however, they are the directives
    of preprocessor.


    In C, the preprocessor acts as a separate program that is invoked by the compiler
    before translating the program into the machine language. They use the preprocessor
    directives to instruct the compiler to perform specific actions. For example,
    a preprocessor allows you to insert the contents of a header file in the source
    file or defines the value of a macro.


    In the source code, the preprocessors are placed before the main() function. Preprocessors
    are also referred to as macro processor they enable you to define macros, which
    are a set of commands represented in an abbreviated form.


    Table 2 lists the commonly used preprocessor directives of the C language along
    with their functionalities:


    | Table 2: Commonly used Preprocessor Directives and their Functions |

    | Directive | Function |

    | #include | Specifies the files to be included |

    | #define | Defines a macro substitution |

    | #undef | Undefines a macro |

    | #ifdef | Tests whether or not a macro is defined |

    | #if | Tests a compile-time condition |

    | #endif | Specifies the end of the #if/directive test fails |

    | #else | Specifies alternatives when the #if/directive test fails |

    | #ifelse | Allows to specify the action if the condition is not true |

    | #elif | Allows to take one action if there are multiple decision points |

    | #error | Prints error message |


    ![](img/d708a3768f380d8ce4567cde085e68dc_212_0.png)


    Write a short note on preprocessor directives. (Computer concepts and C programming
    (VTU, Jan/ Feb 2005)


    +   - **The file inclusion directives:** Refer to the directives that insert the
    contents of other source files


    +   - **The macro substitution directives:** Refer to the directives that define
    macros'
