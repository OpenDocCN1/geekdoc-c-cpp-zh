  md: "# Branching and Looping Statements\n\nThe program created by using if-else\
    \ ladders is difficult to read and maintain as it becomes more complex to understand.\
    \ C provides switch statements to overcome the difficulties and complexities in\
    \ understanding a program, which is discussed next.\n\n+   Using the switch Statement\n\
    \nA switch statement is a conditional statement that tests a value against different\
    \ values. If the value is matched, the corresponding group of statements is executed.\
    \ A switch statement begins with the switch keyword and is followed by a value\
    \ expression in the parenthesis (). It is a combination of multiple case labels\
    \ that must be separated by the break statement. Every case label contains a constant\
    \ value that is matched against the value, which is specified in the switch expression.\
    \ If the value is matched, the statements of that case are executed. In addition,\
    \ you can specify the default label, which is executed when the value specified\
    \ in the switch expression, does not match with the given labels. The syntax to\
    \ use a switch statement is:\n\n```\nswitch(expression)\n{\n  case value: statement1;\n\
    \  break;\n  case value2: statement2;\n  break;\n  case value3: statement3;\n\
    \  break;\n  .\n  .\n  default: default_statement;\n}\n```\n\nThe preceding syntax,\
    \ the value of the expression is compared against the various constants in the\
    \ case labels. If the value of the expression matches with one of the values of\
    \ the case constants, the code associated with that case constant is executed.\
    \ If the execution reaches a break statement, the switch statement ends. If there\
    \ is a default statement, and expression does not match with any value of case\
    \ constants, the code in the default statement is executed.\n\n![](img/d708a3768f380d8ce4567cde085e68dc_72_0.png)\n\
    \nListing 5 shows an example of the switch statement:\n\n+   Listing 5: Using\
    \ the switch Statement\n\n```\n#include<stdio.h>\n#include<conio.h>\n```"
