  md: "# Chapter 2\n\n16\n18\n20\n\nIn Listing 12, the first 10 even numbers are displayed\
    \ with the help of the for loop. The variable is initialized with the value 2,\
    \ incremented by 2 to display even numbers on each iteration. The evaluation becomes\
    \ false when the value of the variable exceeds 20 and the loop terminates.\n\n\
    When a for loop contains another for loop, it is called a nested loop. In the\
    \ nested for loop, execution starts from the outer for loop and the control passes\
    \ to the inner for loop. The inner for loop continues execution till the condition\
    \ of inner loop evaluates to true. When the inner loop is completed, the flow\
    \ of execution is passed to the outer for loop to continue the next iteration\
    \ and again the inner for loop is executed. This implies that for each iteration\
    \ of the outer loop, the inner loop is executed completely. Listing 13 shows an\
    \ example of the nested for loops:\n\n+   Listing 13: Nesting for loops\n\n```\n\
    #include <stdio.h>\n#include <conio.h>\nint main() {\n  int x,y,sum;\n  clrscr();\n\
    \  for(x=1;x<=2;x++) {\n    for(y=1;y<=2;y++) {\n      sum+=y;\n      printf(\"\
    x: %d\\n\", x);\n      printf(\"y: %d\\n\", y);\n      printf(\"Sum: %d\\n\",\
    \ sum);\n    }\n  }\n  getch();\n  return 0;\n}\n```\n\nOutput:\n\nx: 1\ny: 1\n\
    Sum: 1\nx: 1\ny: 2\nSum: 3\nx: 2\ny: 1\nSum: 2\nx: 2\ny: 2\nSum: 4"
