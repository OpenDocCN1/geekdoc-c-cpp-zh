  md: '# Exploring Data Types


    A data type defines the type of data that is stored in a variable. The data in
    a variable can be of any type. For example, the data can be either numeric or
    string. A data type determines how much storage should be allocated to a variable.
    It also determines the permissible operations on variables. C has built-in data
    types for the programming language offers built-in support. The built-in data
    types are also basic or primary data types. Table 4 lists the built-in data types
    supported by C:


    Table 4: Built-In Data Types in C


    | Types | Data Type (Keyword) | Description | Size (Bytes) | Range |

    | --- | --- | --- | --- | --- |

    | Character | char | Stores a single character | 1 | Signed: -128 to +127 |

    | Integer | int | Stores whole numbers | 2 | Signed: -32768 to +32767, Unsigned:
    0 to 65535 |

    | Real (floating-point) | float | Stores real numbers that has single-precision
    floating-point | 4 | 3.4e-38 to 3.4e+38 |

    | Double precision floating-point | double | Stores real numbers that has double-precision
    floating-point | 8 | 1.7e-308 to 1.7e+308 |

    | Non-specific | void | Stores no value | - | - |


    Apart from built-in data types, the C language offers other data types, which
    are called data type modifiers or qualifiers. The data modifiers provide precision
    to the data.


