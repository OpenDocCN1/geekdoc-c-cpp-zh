  md: "# Using the for Loop\n\nThe for loop iterates over a fixed number of times\
    \ and consists of three parts, such as initialization, conditional expression,\
    \ and post expression. The syntax of the for loop is:\n\n```\nfor(initialization;conditional_expression;post_expression)\n\
    simple or compound statement\n```\n\nIn the preceding statement, the for loop\
    \ consists of three parts: initialization, conditional_expression, and post expression,\
    \ and then the statement is followed by a simple or compound statement. The initialization\
    \ part executes only once, which is followed by the conditional_expression. The\
    \ initialization part initializes the variable with a value. If the conditional_expression\
    \ evaluates to false, the statement following the for loop evaluates to true,\
    \ then the body of the for loop is executed. The post_expression is used to Increment\
    \ or decrement a counter controlling a loop. The for loop continues to execute\
    \ until the conditional_expression evaluates to false. The simple or compound\
    \ statement represents the body of the for loop.\n\nNote when the for loop is\
    \ constructed with a simple statement, the body of the loop is not represented\
    \ by curly braces. Listing 12 shows the for loop with a simple statement:\n\n\
    +   Listing 12: Using the for Loop with a Compound Statement\n\n```\n#include<stdio.h>\n\
    #include<conio.h>\n{\n    Int i;\n    clrscr();\n    printf(\"First ten even numbers\
    \ are as follows:\\n\");\n    for(i=2;i<20;i+=2)\n    printf(\"%d\\n\",i);\n \
    \   getch();\n    return 0;\n}\n```\n\nOutput:\n\nFirst ten even numbers are as\
    \ follows:\n2\n4\n6\n8\n10\n12\n14"
