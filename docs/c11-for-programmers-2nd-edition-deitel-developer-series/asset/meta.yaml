  - 4. **输入你的第一次猜测。** 应用程序显示"Please type your first guess."，然后在下一行显示问号（`?`）作为提示（图
    1.8）。在提示符处，输入 `500`（图 1.9）。
- - '###'
  - 5. **输入另一个猜测。** 应用程序显示"Too high. Try again."，意味着你输入的值大于应用程序选择作为正确答案的数字。因此，你应该在下次猜测时输入一个较小的数字。在提示符处，输入
    `250`（图 1.10）。应用程序再次显示"Too high. Try again."，因为你输入的值仍然大于应用程序选择作为正确答案的数字。
- - '###'
  - 6. **输入额外的猜测。** 继续输入值来玩游戏，直到猜中正确数字。应用程序将显示"Excellent! You guessed the number!"（图
    1.11）。
- - '###'
  - 7. **再次玩游戏或退出应用程序。** 在你猜中后，应用程序会询问你不想再玩一次游戏（图 1.11）。在"Would you like to play again
    (y or n)?" 提示符处，输入字符 `y` 会导致应用程序选择一个新的数字，并显示消息"Please type your first guess."
    随后是问号提示（图 1.12），以便你可以在新游戏中进行第一次猜测。输入字符 `n` 将结束应用程序并返回到命令提示符中的应用程序目录（图 1.13）。每当你从头执行此应用程序时（即*第
    3 步*），它都会为你选择相同的数字供你猜测。
