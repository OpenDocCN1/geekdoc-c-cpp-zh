  md: '# A SCREEN IS THE MOST COMMON OUTPUT DEVICE,


    # OUTPUTS


    WHEN YOU TYPE WORDS INTO A COMPUTER, THE COMPUTER USUALLY SHOWS THEM ON ITS SCREEN.
    IT CAN ALSO SEND THEM TO A PRINTER, OR IT CAN BROADCAST THEM THROUGH A SPEAKER.
    THESE ARE ALL OUTPUT DEVICES.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_21_0.png)


    Today, computer screens are usually liquid crystal displays (LCDs). LCDs are covered
    in thousands of pixels, or tiny areas of the screen. Each pixel has three sub-pixels:
    red, green and blue. When an electronic signal containing data (such as words,
    a picture or a video) is sent to a pixel, the liquid crystal changes to allow
    light to shine through. Depending on the colour the pixel needs to show, it allows
    light to shine through the red, green and blue sub-pixels in different amounts.
    Any colour can be created by combining those three primary colours.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_21_1.png)'
