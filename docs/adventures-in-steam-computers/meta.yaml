    # 创建于 1962 年。


    大多数家用游戏机使用手持式控制器作为输入设备，通过按钮或摇杆来控制游戏中的移动。某些游戏控制器（如 Wii 遥控器）包含运动传感器。另一种常见的输入设备是用于舞蹈游戏的触敏垫子。对于某些游戏机，玩家完全不需要触摸输入设备。例如，Xbox
    360 使用 Kinect 相机检测玩家的动作。


    Kinect 输入设备会对动作和语音指令做出响应。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_32_0.png)


    ## 艺术


    许多热门游戏提供了虚拟世界，玩家可以在其中与其他玩家互动。玩家选择一个化身，即在世界上代表自己的精灵。通常，化身可以由玩家设计得看起来像他们自己，或者设计得奇特又惊喜。在普通游戏中，图形背景可能非常真实或美丽，但在虚拟世界中，它们被设计为玩家享受和游戏互动的关键部分。流行的虚拟世界包括《我的世界》（Minecraft）和《第二人生》（Second
    Life）。


    在《我的世界》中，玩家可以设计自己的房子、公园和城市。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_32_1.png)


    ## 最早的计算机占据整个房间。因此，它们只能由政府和大型机构使用。一系列突破促促进了如今个人电脑的发展，而这些电脑存在于办公室、家庭和口袋中。


    ## 荣誉堂：个人电脑


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_0.png)


    ## 苹果 II，1977年


    这是第一批带有微处理器的即用个人电脑之一。它由苹果电脑公司的联合创始人史蒂夫·沃兹尼亚克（Steve Wozniak）和史蒂夫·乔布斯（Steve Jobs）设计。苹果
    II 的最初售价为 1,298 美元，约相当于今天货币的 4,000 英镑。


    ## 鼠标，1963年


    鼠标是由美国计算机工程师道格拉斯·恩格尔巴特（Douglas Engelbart）和威廉·英国（William English）于 1963 年发明的。第一个鼠标有一个木制外壳、一块电路板和两个金属轮。九年后，英国将轮子替换为可以监测任何方向运动的球，改进了设计。1973
    年，Xerox Alto 成为第一个使用鼠标的桌面电脑。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_1.png)


    ## 智能手机，1994年


    1994 年，IBM Simon（西蒙）是第一部运行软件的手机，并带有用于手笔的触摸屏。应用程序包括电话录、日历、计算器、时钟和电子记事本。西蒙还可以发送和接收电子邮件。三年后，即
    1997 年，第一批智能手机配备了用于搜索网页的网络浏览器。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_0.png)

    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_1.png)


    ## iPad，2010年


    平板电脑自 21 世纪初就问世了，但直到苹果在 2010 年推出 iPad，它们才变得真正流行。iPad 的成功归功于它的许多内置功能，如无线网络连接、摄像头和音乐库。


    ## 谷歌眼镜，2013年


    这种可穿戴计算机配备了屏幕和摄像头。它接受来自语音命令和侧面触摸板的输入。谷歌眼镜在一年后停止发售，部分原因是人们担心被秘密偷拍。然而，计算的未来可能仍然在于可穿戴设备。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_2.png)


    ## 网络连接跨越房间的计算机，


    ## 网络


    最早的网络使用电线连接一栋建筑内的计算机……如今，互联网是一个覆盖全球的庞计算机网络。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_0.png)


    网络共享数据和其他资源的方式。有线网络由铜线或光纤建立。许多家庭通过铜线连接，数据以电信号传输。大多数新网络使用光纤，数据以光脉冲的形式传输。光纤传输传输的速度比铜线快得多。


    ### 局域网

    小型网络连接学校和办公室内的计算机和打印机。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_1.png)


    ### 广域网

    广域网连接跨城市、国家和世界的计算机。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_2.png)


    ## 城市或行星。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_36_0.png)


    人们经常使用“网页”（web）和“互联网”（Internet）来表示同一个意思。事实上，互联网是一个全球网络，由电缆、卫星和无线连接组成。网址的结尾被称为后缀，它可以告诉我们关于运行该机构的一些信息，例如：


    | 后缀 | 含义 |

    | :--- | :--- |

    | .co.uk | 由英国企业创建 |

    | .org | 由慈善机构创建 |

    | .gov | 由政府托管 |


    ## 网页


    网站是存储在计算机上的文档。网站可以包含文字、图像和视频。网页是由计算机科学家蒂姆·伯纳斯-李（Tim Berners-Lee）于 1989 年发明的。我们使用称为浏览器的软件查看网站。HTML
    是超文本标记语言。流行的浏览器有 Google Chrome 和 Internet Explorer。当我们点击链接时，就会移动到另一个网站。浏览器向存储该网站的计算机发送请求。浏览器通过互联网返回数据。


    ## 技术谈


    所有地址都以“http”开头，代表超文本传输协议。大多数网址都有“www”，代表世界维员网。互联网是一种交换数据的方式。在较小尺度上，它覆盖一栋建筑；在较大的尺度上，它覆盖全球。互联网用户比例最高的国家是冰兰，最低的国家是厄立特里。


    ## 跳出框框思考！


    万维网为知识和通信开辟了巨大的可能性。然而，当我们使用网页时，思考我们如何使用它是重要的。任何人都可以创建一个包含虚假或有害信息的网站。当我们使用允许我们直接与他人交流的网站（通常称为社交网络）时，我们需要考虑自己的行为方式，并警惕他人的行为。由于网页是由人创建的，它的好坏取决于使用它的人。


    '
