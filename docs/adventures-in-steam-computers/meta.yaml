    \ software is able to interpret the different key presses.\n\n**SCANNERS** Scanners\
    \ are used to capture images of photos or paper documents placed in the machine.\
    \ A colour scanner registers how much red, green and blue (the primary colours)\
    \ are in each tiny portion of the image. The scanner then converts this information\
    \ into digital form.\n\n**MICE** Usually, mice shine a bright light onto your\
    \ desk, some of which reflects back off the desk into a sensor. As the mouse moves,\
    \ the pattern of reflected light changes.\n\n**BARCODE READERS** These input devices\
    \ read the barcodes that label goods. Barcodes are patterns of black and white\
    \ lines that represent numbers. A light sensor shines a beam of light on the barcode\
    \ and measures the reflected light. Black reflects less light than white. The\
    \ reader translates the pattern into binary digits: black is 0, and white is 1.\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_19_0.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_19_1.png)\n\
    \n# THOSE ARE INPUTS.\n\n# THINKING OUTSIDE THE BOX!\n\nMice do their job so well\
    \ that most people never think about alternatives. However, there are other hand-held\
    \ pointing devices, which are not so widely used. One is a stylus, a pen-shaped\
    \ device used with touchscreens. Another is a light pen, which shines light onto\
    \ a special computer screen. Can you think of a new design for a hand-held input?\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_20_0.png)\n\nSome computers accept\
    \ inputs that are spoken. To accept voice inputs, a computer needs a microphone\
    \ and speech recognition software. When we speak, our words have patterns of loud\
    \ and soft sounds. For example, a hard consonant, like a p, is a sudden, loud\
    \ sound. Voice recognition software compares the patterns of loud and soft with\
    \ the 50 or so phonemes (speech sounds) in its database.\n\n# TECHNOLOGY TALK\n\
    \nSmartphones and tablets have touchscreens, while laptops have trackpads in place\
    \ of a mouse. A grid of electrical circuits lies beneath the touchscreen or trackpad.\
    \ These pick up the movement of your fingers and send signals to the computer.\
    \ Many touchscreens can recognise particular touches, such as pinches to zoom\
    \ in, and swipes to the pages of an ebook.\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_20_1.png)\n\
    \n# A SCREEN IS THE MOST COMMON OUTPUT DEVICE,\n\n# OUTPUTS\n\nWHEN YOU TYPE WORDS\
    \ INTO A COMPUTER, THE COMPUTER USUALLY SHOWS THEM ON ITS SCREEN. IT CAN ALSO\
    \ SEND THEM TO A PRINTER, OR IT CAN BROADCAST THEM THROUGH A SPEAKER. THESE ARE\
    \ ALL OUTPUT DEVICES.\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_21_0.png)\n\n\
    Today, computer screens are usually liquid crystal displays (LCDs). LCDs are covered\
    \ in thousands of pixels, or tiny areas of the screen. Each pixel has three sub-pixels:\
    \ red, green and blue. When an electronic signal containing data (such as words,\
    \ a picture or a video) is sent to a pixel, the liquid crystal changes to allow\
    \ light to shine through. Depending on the colour the pixel needs to show, it\
    \ allows light to shine through the red, green and blue sub-pixels in different\
    \ amounts. Any colour can be created by combining those three primary colours.\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_21_1.png)\n\n# BUT THERE ARE PLENTY\
    \ OF OTHERS.\n\n# THINKING OUTSIDE THE BOX!\n\nIf you look back at the 'hidden'\
    \ computers on page 9, you might be able to think of more output devices for computers.\
    \ For example, the computer in a traffic light is programmed to change the colour\
    \ displayed by its lights in a sequence. The lights are its output device. What\
    \ do you think are the output devices for a talking robot?\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_0.png)\n\
    \nA computer sends data to a printer as electrical signals through wires, or as\
    \ radio waves through the air. The printer converts the signals into their final\
    \ form: a black and white document, a colour photo or even a three-dimensional\
    \ (3D) object. 3D printers create an object layer by layer, using plastic or metal.\n\
    \n# TECHNOLOGY TALK\n\nAnother common computer output is sound, such as speech,\
    \ game sound effects or music. Sound travels through the air as vibrations. These\
    \ vibrations are picked up by a computer's microphone, which turns them into electrical\
    \ signals. A computer's sound card converts these signals into binary numbers.\
    \ Many computer programs can be used to edit sounds. To output, the sounds are\
    \ turned back into electrical signals and sent to a computer's speaker. The signals\
    \ make the speaker's cone vibrate, creating sounds.\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_1.png)\n\
    ![](img/50ab3428eb54bad681a3964413b0d4f4_22_2.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_3.png)\n\
    ![](img/50ab3428eb54bad681a3964413b0d4f4_22_4.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_5.png)\n\
    \n# ANYONE CAN HAVE A GO AT WRITING THEIR OWN # PROGRAMMING\n\nA PROGRAM IS AN\
    \ ORDERED SET OF INSTRUCTIONS. COMPUTER PROGRAMMERS WRITE THEIR INSTRUCTIONS IN\
    \ ONE OF MANY PROGRAMMING LANGUAGES, OFTEN CALLED CODE.\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_23_0.png)\n\
    \nFirst, a programmer decides exactly what the computer needs to do, breaks down\
    \ the instructions into step-by-step commands that cannot be misunderstood. Rather\
    \ than typing the same command over over, programmers often create subroutines.\
    \ These are parts of a program that need to be repeated. For example, every time\
    \ the programmer wants to command the computer to play a tune, they tell the computer\
    \ to run ‘play a tune’. Sometimes experienced programmers make a mistake! A bug\
    \ is any mistake that stops a program from working, like saying ‘Turn left’ when\
    \ you mean ‘Turn right’.\n\n# PROJECT\n\nWrite a program that commands a friend\
    \ to walk around:\n- Choose a pattern for your friend to walk in, perhaps a square\
    \ or hexagon.\n- Break down your instructions into easy-to-understand commands,\
    \ such as number of steps forward, or half turns.\n- Do you want to include subroutines?\n\
    - Now insert a bug into your program, without causing your friend an injury!\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_23_1.png)\n\n# COMPUTER PROGRAMS.\n\
    \nDifferent programming codes or languages are written in collections of numbers,\
    \ symbols or words. Whatever the programming language, a computer’s ‘interpreter’\
    \ converts it into strings of 1s and 0s. The computer languages you may use in\
    \ school include Scratch, Java and Python.\n\n# PROJECT\n\nWith an adult’s permission,\
    \ try out Scratch. In Scratch, it is easy to program a sprite to move around the\
    \ screen. A sprite does what you say, like your friend in the playground. The\
    \ standard Scratch sprite is a cat. You give it instructions in the form of coloured\
    \ blocks with commands written on them, such as ‘Move 10 steps’.\n- Go to https://scratch.mit.edu/\
    \ and click ‘Try it out’.\n- Find the blocks that command the cat sprite to move.\
    \ They are in the dark blue Motion group, in the centre of the screen. Drag some\
    \ of those blocks over to the empty area on the right side of the screen.\n- Click\
    \ on the blocks to see what the sprite does.\n\n```\n 10 STEPS\nTURN 15 DEGREES\n\
    MOVE 10 STEPS\nTURN 15 DEGREES\n```\n![](img/50ab3428eb54bad681a3964413b0d4f4_24_0.png)\n\
    \n# THE TECHNOLOGY IN YOUR LAPTOP OR SMARTPHONE WAS DEVELOPED STEP BY STEP OVER\
    \ MANY DECADES. SOME GREAT THINKERS AND INVENTORS PLAYED A ROLE IN THAT JOURNEY.\n\
    \n# CHARLES BABBAGE (1791-1871)\n\nThe English mathematician Charles Babbage is\
    \ often called the ‘father of computing’. In 1837, he designed the earliest true\
    \ computer, the Analytical Engine, although he only built part of it. It was to\
    \ be the first programmable calculating machine, using punched cards, invented\
    \ by Joseph Marie Jacquard (see page 7). Any calculation could be carried out\
    \ by a system of interlocking gears. The machine was to be powered by steam.\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_25_0.png)\n\n# ADA LOVELACE (1815-1852)\n\
    \nAda Lovelace, daughter of the English poet Lord Byron, was a friend of Babbage’s.\
    \ A talented mathematician, she saw the potential of the (unbuilt) Analytical\
    \ Engine to be more than just a calculator. She wrote the first ever algorithm\
    \ (a way of solving problems in a series of steps) to be used by the Engine. This\
    \ made her the world’s first computer programmer.\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_25_1.png)\n\
    \n# HALL OF FAME: COMPUTER SCIENTISTS\n"
  mdcn: "\n\n# 输入设备\n\n你可能熟悉使用键盘、鼠标和触摸屏等输入设备。还有许多其他设备和传感器可以向计算机提供信息。\n\n**键盘** 在计算机键盘上，每个按键都是一个向计算机发送电子信号的开关。计算机软件能够解释不同的按键动作。\n\
    \n**扫描仪** 扫描仪用于捕捉放在机器中的照片或纸质文档图像。彩色扫描仪会记录图像中每个微小区域内红、绿、蓝（原色）的比例。然后扫描仪会将这些信息转换为数字形式。\n\
    \n**鼠标** 通常，鼠标会向你的桌面投射出明亮的光，其中一些光会从桌面反射回传感器。随着鼠标的移动，反射光的光路会随之变化。\n\n**条形码器** 这些输入设备读取商品标签上的条形码。条形码是代表数字的黑白线条图案。光敏传感器向条形码投射一束光并测量反射的光。黑色反射的光比白色少。读取器将该图案转换为二进制数字：黑色为\
    \ 0，白色为 1。\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_19_0.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_19_1.png)\n\
    \n# 这些都是输入设备。\n\n# 跳出框架！\n\n鼠标的工作非常出色，以至于大多数人从未考虑过替代方案。然而，还有其他手持指针设备，它们并没有广泛使用。一种是手写笔，配合触摸屏使用的笔状设备。另一种是光笔，它向特殊的计算机屏幕投射光。你能为手持输入设备设计一种新设计吗？\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_20_0.png)\n\n有些计算机可以接受语音输入。为了接受语音输入，计算机需要麦克风和语音识别软件。当我们说话时，我们的词汇具有响亮和柔和的声音模式。例如，硬辅音（如\
    \ p）是一个突然而响亮的声音。语音识别软件会将响亮和柔和的模式与其数据库中的约 50 多个音位（语音声音）进行比较。\n\n# 技术科技\n\n智能手机和平板电脑有触摸屏，而笔记本电脑用触控板代替鼠标。触摸屏或触控板下方有一个电路网格。它们能捕捉你手指的移动并向计算机发送信号。许多触摸屏可以识别特定的触摸动作，例如捏合缩放和滑动电子书页面。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_20_1.png)\n\n# 屏幕是最常见的输出设备，\n\n# 输出设备\n\
    \n当你向计算机输入单词时，计算机通常会在屏幕上显示它们。它还可以将它们发送到打印机，或者通过扬声器广播它们。这些都是输出设备。\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_21_0.png)\n\
    \n今天，计算机屏幕通常是液晶显示器（LCD）。LCD 覆盖着数千个像素，即屏幕的微小区域。每个像素都有三个子像素：红、绿、蓝。当包含数据（如文字、图片或视频）的电子信号发送到像素时，液晶会发生变化允许光线透过。根据像素需要显示的颜色，它允许不同比例的光线透过红、绿、蓝子像素。通过组合这三种原色，可以创建任何颜色。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_21_1.png)\n\n# 但还有很多其他设备。\n\n# 跳出框架！\n\
    \n如果你回顾第 9 页那些“隐藏”的计算机，你可能会想到更多的计算机输出设备。例如，交通灯被程序设定为按顺序显示颜色。灯光就是它的输出设备。你认为说话机器人的输出设备是什么？\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_22_0.png)\n\n计算机通过电线或空气中的无线电波将数据发送到打印机。打印机将信号转换为最终形式：黑白文档、彩色照片甚至是三维（3D）物体。3D\
    \ 打印机使用塑料或金属层层创建物体。\n\n# 技术科技\n\n另一种常见的计算机输出是声音，如语音、游戏特效或音乐。声音以振动的形式在空气中传播。这些振动被计算机的麦克风捕捉并转换为电子信号。计算机声卡将这些信号转换为二进制数字。为了输出，声音被转换回电子信号并发送到扬声器。信号让扬声器振膜振动，产生声音。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_22_1.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_2.png)\n\
    ![](img/50ab3428eb54bad681a3964413b0d4f4_22_3.png)\n![](img/50ab3428eb54bad681a3964413b0d4f4_22_4.png)\n\
    ![](img/50ab3428eb54bad681a3964413b0d4f4_22_5.png)\n\n# 任何人都可以尝试自己编程\n\n程序是一组有序的指令。计算机程序员使用许多编程语言之一（通常称为代码）编写他们的指令。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_23_0.png)\n\n首先，程序员精确决定计算机需要做什么，将指令拆解为不会误解的逐步命令。与其反复输入相同的命令，程序员经常创建子程序。这些是程序中需要重复的部分。例如，每当程序员想要命令计算机播放乐曲时，他们都会告诉计算机运行“播放歌曲”。有时丰富的程序员也会出错！错误（bug）是任何导致程序无法运行的错误，例如在你想“右转”时说“左转”。\n\
    \n# 项目\n\n编写一个程序让朋友行走：\n- 为朋友选择一个路径，例如方形或六边形。\n- 将你的指令拆解为易懂的命令，例如前进步数或半转。\n- 你想包含子程序吗？\n\
    - 现在在你的程序中插入一个错误，但不要让你的朋友受伤！\n\n![](img/50ab3428eb54bad681a3964413b0d4f4_23_1.png)\n\
    \n# 计算机程序不同的编程代码或语言是用数字、符号或单词编写的。无论使用何种编程语言，计算机的“解释器”都会将其转换为 1 和 0 的字符串。你在学校使用的计算机语言包括\
    \ Scratch、Java 和 Python。\n\n# 项目\n\n在成人的许可下，尝试 Scratch。在 Scratch 中，编写一个角色在屏幕上移动很容易。角色会听从你的话，就像你在操场上的朋友一样。标准的\
    \ Scratch 角色是一只猫。你以带有命令的彩色块向它提供指令，例如“移动 10 步”。\n- 访问 https://scratch.mit.edu/\
    \ 并点击“试试看”。\n- 找到让猫移动的块。它们位于屏幕中心的深蓝色“动作”组。将其中一些块拖到屏幕右侧的空白区域。\n- 点击这些块查看角色在做什么。\n\
    \n```\n 10 STEPS\nTURN 15 DEGREES\nMOVE 10 STEPS\nTURN 15 DEGREES\n```\n![](img/50ab3428eb54bad681a3964413b0d4f4_24_0.png)\n\
    \n# 笔记本电脑或智能手机中的技术是几十年来逐步发展的。一些伟大的思想家和发明家在这段旅途中发挥了作用。\n\n# 查尔斯·巴贝奇 (1791-1871)\n\
    \n英国数学家查尔斯·巴贝奇通常被称为“计算机之父”。1837年，他设计了最早的真正的计算机——分析机，尽管他只制造了部分。它将是第一台可编程的计算机器，使用约瑟夫·玛丽·雅卡尔发明的孔片（见第7页）。任何计算都可以通过一组相互锁定的齿轮完成。该机器将由蒸汽驱动。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_25_0.png)\n\n# 艾达·洛芙莱斯 (1815-1852)\n\
    \n艾达·洛芙莱斯是英国诗人拜伦勋的女儿，巴贝奇的朋友。作为一位才华横溢的数学家，她预见到了（未制造的）分析机不仅仅是一个计算器的潜力。她编写了第一个供分析机使用的算法（一种通过一系列步骤解决问题的方法）。这使她成为世界上第一位计算机程序员。\n\
    \n![](img/50ab3428eb54bad681a3964413b0d4f4_25_1.png)\n\n# 名人堂：计算机科学家\n\n"
