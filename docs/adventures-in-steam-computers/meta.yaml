    ## 虚拟现实 (VR) 正在改变我们

    ## 虚拟现实的方式


    “虚拟”意味着“几乎”。虚拟现实是指计算机创造出一个似乎就在你眼前的世界，但它实际上只是程序的产物。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_39_0.png)


    虚拟现实不是在屏幕上观看的，而是通过头戴式设备观看的。在游戏中，虚拟现实头戴设备让玩家感觉自己完全处于游戏世界中。头戴设备中的运动传感器捕捉头部动作，程序会改变视角以匹配这些动作。虚拟现实手套和体服通过对皮肤施加微小的压力，带给人在虚拟世界中触摸东西的感觉。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_39_1.png)


    ## 艺术对话


    增强现实 (AR) 可于移动计算设备（如智能手机和平板电脑）的软件。增强现实与虚拟现实不同：它通过摄像头提供真实世界的视图，并添加额外功能，如有用或趣味性的图形、声音或文字。2016年发布的游戏《宝可梦
    Go》，其特点是出现在屏幕上的虚拟生物，就像出现在现实世界一样。玩家必须找到它们。增强现实的一个缺点是用户可能会分心而忽视现实世界的安全！2016年，两名玩《宝可梦
    Go》的男子走下了悬崖。幸运的是，他们没有受重伤。


    ## 学习、游戏与工作。

    ## 跳出框架思考！


    虽然虚拟现实最常用于游戏，但也被应用于一些工作场所。它的技术对训练士兵很有帮助，士兵可以在不让自己陷入危险的情况下体验身处战斗的感觉。外科医生也能使用虚拟现实进行训练，为他们提供执行手术的真实体验，而不需要人类参与。


    你能想到其他哪些虚拟现实会有帮助的职业或活动吗？增强现实可以提供有用功能的情况又有哪些？考虑一下教育、建筑、购物、交通和政府领域。


    - 这位士兵正在使用虚拟现实程序学习如何进行跳伞跳。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_1.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_2.png)


    ## 人工智能 (AI) 是计算机

    ## 人工智能


    目前，大多数个人电脑只完全执行我们告诉它们要做的事情。然而，有些计算机被程序设定为“自己思考”，就像人类一样。这些计算机被称为拥有人工智能。


    计算机只是执行程序指示它们做的任何事情。AI 本身是通过编程创建的。AI 程序使用数学算法允许计算机在对问题的不同回答之间做出选择。这些程序还允许计算机从过去的事件中“学习”。这是通过算法实现的：如果动作
    A产生了这个结果，但动作 B 产生了更好的结果，那么在未来将选择动作 B。


    ## 跳出框架思考！


    带有 AI 的计算机和机器人自1920年来一直出现在虚构作品中，当时捷克克作家卡雷尔·恰佩克写了一部关于机器人反抗人类主人的戏剧。无数其他书籍、电影和电视节目都关注了计算机自主思考的危险，包括2004年的电影《机械机器人》和2015年的儿童电视节目《伊芙
    (Eve)》。你认为人类为什么对 AI 既着迷又担心？


    - 机器人 Nao 包含一个运行 AI 程序的计算机。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_41_0.png)


    ## 似乎在自己思考。


    1950年，艾伦·图灵（见第23页）开发了一项测试，用来判断计算机是否像人类一样思考的能力。图灵测试由一个人类测试者同时进行两场“对话”，一个与人类对话，一个与计算机对话，使用键盘和屏幕，以使得测试者无法看到正在和“谁”说话。测试者必须判断哪是人，哪是计算机。2014年，一个名为
    Eugene Goostman 的计算机第一次通过了测试。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_0.png)


    图灵测试中，计算机不需要给出正确答案，只需要人类会给出的答案。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_1.png)


    ## 项目


    智能助手 (IPAs) 是为用户执行服务的程序，例如回答问题和通过网络预订桌位。像 Siri 或 Alexa 等智能可以在手机找到。


    - 我可以提供什么帮助？

    - 什么是人类助手？

    - 什么是智能助手？


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_2.png)


    ## 这些计算机可能会改变对计算机的认知

    ## 荣誉堂：ALMA


    ALMA（阿塔卡马大毫米/亚毫米波阵列）是位于智利的望远镜。相关器结合来自许多天线的信号以创建图像。这台超级计算机每秒执行数万亿次操作。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_0.png)


    ## 树莓派


    树莓派是一种价格低于25英元的小型计算机。它被用于学校教学。它包含一个 CPU 并用于编程。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_1.png)


    ## 旅行者号


    旅行者号探测器是距离地球最远的人造物体。它于1977年发射并穿过了太阳系。它利用深空网络发送数据。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_0.png)


    ## 起搏器


    起搏器是一种放置在人体胸内的小型电子设备，用于监测和控制心脏问题。它使用电冲保持心脏正常工作。这些机器每天挽救数百生命。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_1.png)


    ## 谷歌


    谷歌不是一台计算机，而是位于谷歌数据中心的由约90万台强大计算机组成的网络。这些计算机允许全球估计11亿用户搜索网络。谷歌可以被视为世界上最大的计算机或计算机集群。


    ## 自20世纪中期以来发生改变的星球


    在计算机进入办公室之前，许多打字员和职员被雇佣在机械打字机上打印信件和文件，或用铅笔和纸绘制图表和表格。在1961年第一台机器人投入工厂之前，工厂雇佣了数百万从事体力劳动的工人。今天，已有160万台工业机器人。


    工人不再需要一一整天都待在工作场所。通过电子邮件，工人可以在任何连接互联网的地方工作。摄像头允许在所有人到场的情况下进行会议，“临现场”机器人更进一步。通过传感器、麦克风和摄像头，远处的工人可以通过工作场所的机器人说话和观察，就像他们在场一样。临现场机器人现在已应用于教育领域，在远程学校授课，或为住院的孩子授课。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_45_0.png)


