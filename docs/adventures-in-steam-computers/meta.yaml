  md: '# THE TECHNOLOGY IN YOUR LAPTOP OR SMARTPHONE WAS DEVELOPED STEP BY STEP OVER
    MANY DECADES. SOME GREAT THINKERS AND INVENTORS PLAYED A ROLE IN THAT JOURNEY.


    # CHARLES BABBAGE (1791-1871)


    The English mathematician Charles Babbage is often called the ‘father of computing’.
    In 1837, he designed the earliest true computer, the Analytical Engine, although
    he only built part of it. It was to be the first programmable calculating machine,
    using punched cards, invented by Joseph Marie Jacquard (see page 7). Any calculation
    could be carried out by a system of interlocking gears. The machine was to be
    powered by steam.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_25_0.png)


    # ADA LOVELACE (1815-1852)


    Ada Lovelace, daughter of the English poet Lord Byron, was a friend of Babbage’s.
    A talented mathematician, she saw the potential of the (unbuilt) Analytical Engine
    to be more than just a calculator. She wrote the first ever algorithm (a way of
    solving problems in a series of steps) to be used by the Engine. This made her
    the world’s first computer programmer.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_25_1.png)


    # HALL OF FAME: COMPUTER SCIENTISTS'
