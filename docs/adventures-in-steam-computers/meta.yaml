    # HALL OF FAME: AMAZING COMPUTERS


    # ALMA CORRELATOR


    The ALMA correlator is a supercomputer at the ALMA (Atacama Large Millimeter/submillimeter
    Array) observatory, high in the Andes Mountains, in Chile. A supercomputer is
    a computer with many processors, not just one CPU. The ALMA correlator has 134
    million processors and performs 17 quadrillion (that is 17 with 15 zeros!) operations
    per second. The processors combine and compare signals from space, received by
    the observatory''s 50 radio antennae. The correlator enables the antennae to work
    together as a huge telescope, building up images of outer space.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_0.png)


    # RASBERRY PI


    This computer, which costs less than £25, is used for teaching computing in schools.
    It is sold as a circuit board containing a CPU and other basic hardware. It can
    be connected to an electricity supply, keyboard, computer screen and Wi-Fi networks.
    The Raspberry Pi has rows of pins, into which lights or other devices can be plugged.
    Students can learn to program the Raspberry Pi to make the lights turn on and
    off in patterns. Then they can move on to programming robots!


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_1.png)'
