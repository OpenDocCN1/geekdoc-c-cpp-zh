  md: '# THE ''BRAIN'' OF A COMPUTER IS ITS CENTRAL


    # A COMPUTER''S BRAIN


    THE CPU IS A KEY PIECE OF HARDWARE. IT CARRIES OUT ALL THE COMPUTER''S... CALCULATIONS
    AND CONTROLS ITS OTHER HARDWARE.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_15_0.png)


    To carry out any task, every computer follows the same process:


    +   - INPUT The computer receives data. This is known as input.

    - MEMORY When a computer receives input, the CPU and the memory work hand in hand:
    the CPU reads programs stored in the memory, and stores data in the memory.

    - PROCESSING The computer processes the data in its CPU.

    - OUTPUT The computer gives the user the results of its work. This is known as
    output.


    # THINKING OUTSIDE THE BOX!


    You can think of your brain as your own... CPU. Consider how you do a calculation:


    +   1 You receive the instruction from your teacher to add 1 + 2.

    2 You search your memory for the method of how to do addition.

    3 You use your brain to work out the sum.

    4 You give your result (which is 3!) by writing it down or telling your teacher.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_15_1.png)'
