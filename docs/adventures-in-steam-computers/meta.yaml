    \n**标志（logos）** 公司用于识别产品的符号。\n\n**微处理器（microprocessors）** 作为现代计算机“大脑”的小型电子设备。\n\
    \n**主板（motherboard）** 固定计算机主要部分的电路板。\n\n**网络（networks）** 通过电缆、无线连接连接的计算机。\n\n\
