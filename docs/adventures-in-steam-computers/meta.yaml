  md: '# GLOSSARY


    **algorithm** A set of rules to follow when solving a problem.


    **animations** Graphics that create the illusion of movement by showing slightly
    different images one after another.


    **artificial intelligence** Computer programs that can perform tasks that usually
    require human intelligence.


    **binary** With two parts; the binary number system uses only 0 and 1.


    **central processing unit** The ''brains'' of a computer, where most operations
    take place.


    **circuit board** A board on which electrical circuits are installed.


    **data** Information.


    **database** An organised collection of data stored on a computer.


    **data center** A building that holds many networked computers used for storing
    and processing large amounts of data.


    **digital** Information or signals expressed as a pattern of 0s and 1s.


    **ebook** A book that is read on a computer or other electronic device.


    **electrical circuits** Loops around which electric can travel.


    **files** Collections of data that are stored as one unit.


    **hardware** The machinery, wiring and other physical parts of a computer.


    **inputs** Information fed into a computer.


    **Internet** A worldwide network of computer networks.


    **joysticks** Hand-held levers used to control movement in a computer.


    **logos** Symbols used by a company to identify its products.


    **microprocessors** Small electronic devices that act as the ''brain'' of modern
    computers.


    **motherboard** A circuit board that holds the main parts of a computer.


    **networks** Computers connected by cables, wires or wireless links.


    **pixels** The smallest units of an image represented on screen.


    **processing** Operating on data by passing it through a series of actions, using
    a program.


    **radio waves** A form of energy used for sending invisible signals through the
    air.


    **RAM** Random access memory; where data is stored while the user is working.


    **ROM** Read only memory; a hardware device that stores programs and data even
    when the computer is off.


    **search engine** A program that searches for websites.


    **sensors** Devices that detect and respond to light, sound or other physical
    properties.


    **social networking** Using websites that allow people to connect with others.


    **software** The programs used by a computer.


    **web** A worldwide network of hypertext files, ''websites'', which are accessed
    using the Internet.


    **webcam** A computer''s video camera, which can send its images via the Internet.


    **wireless** Communicating without wires, using radio waves.'
