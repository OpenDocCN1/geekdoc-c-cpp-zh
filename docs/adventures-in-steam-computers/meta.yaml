  md: '# ARTIFICIAL INTELLIGENCE (AI) IS WHEN COMPUTER


    # ARTIFICIAL INTELLIGENCE


    AT PRESENT, MOST PERSONAL COMPUTERS ONLY DO EXACTLY WHAT WE TELL THEM. HOWEVER,
    SOME COMPUTERS ARE PROGRAMMED TO ‘THINK FOR THEMSELVES’, LIKE A HUMAN DOES. THESE
    COMPUTERS ARE SAID TO HAVE ARTIFICIAL INTELLIGENCE.


    Computers just do whatever they are told by their programs. AI itself is created
    by programming. AI programs use mathematical algorithms to allow a computer to
    decide between different responses to a question. These programs also allow the
    computer to ‘learn’ from past events. This is accomplished through algorithms:
    if action A produces this result, but action B produces a better result, in future
    action B will be chosen.


