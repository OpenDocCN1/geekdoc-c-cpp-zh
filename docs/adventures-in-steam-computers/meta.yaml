  md: '# BUT THERE ARE PLENTY OF OTHERS.


    # THINKING OUTSIDE THE BOX!


    If you look back at the ''hidden'' computers on page 9, you might be able to think
    of more output devices for computers. For example, the computer in a traffic light
    is programmed to change the colour displayed by its lights in a sequence. The
    lights are its output device. What do you think are the output devices for a talking
    robot?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_22_0.png)


    A computer sends data to a printer as electrical signals through wires, or as
    radio waves through the air. The printer converts the signals into their final
    form: a black and white document, a colour photo or even a three-dimensional (3D)
    object. 3D printers create an object layer by layer, using plastic or metal.


    # TECHNOLOGY TALK


    Another common computer output is sound, such as speech, game sound effects or
    music. Sound travels through the air as vibrations. These vibrations are picked
    up by a computer''s microphone, which turns them into electrical signals. A computer''s
    sound card converts these signals into binary numbers. Many computer programs
    can be used to edit sounds. To output, the sounds are turned back into electrical
    signals and sent to a computer''s speaker. The signals make the speaker''s cone
    vibrate, creating sounds.


