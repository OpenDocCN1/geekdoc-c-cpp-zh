    # ANYONE CAN HAVE A GO AT WRITING THEIR OWN


    # PROGRAMMING


    A PROGRAM IS AN ORDERED SET OF INSTRUCTIONS. COMPUTER PROGRAMMERS WRITE THEIR
    INSTRUCTIONS IN ONE OF MANY PROGRAMMING LANGUAGES, OFTEN CALLED CODE.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_23_0.png)


    First, a programmer decides exactly what the computer needs to do, breaks down
    the instructions into step-by-step commands that cannot be misunderstood. Rather
    than typing the same command over and over, programmers often create subroutines.
    These are parts of a program that need to be repeated. For example, every time
    the programmer wants to command the computer to play a tune, they tell the computer
    to run the ‘play a tune’ subroutine. Sometimes even experienced programmers make
    a mistake though! A bug is any mistake that stops a program from working, like
    saying ‘Turn left’ when you mean ‘Turn right’.


    # PROJECT


    Write a program that commands a friend to walk around the playground:


    +   - Choose a pattern for your friend to walk in, perhaps a square or hexagon
    shape.

    - Break down your instructions into easy-to-understand commands, such as number
    of steps forward, quarter or half turns.

    - Do you want to include any subroutines?

    - Now insert a bug into your program, without causing your friend an injury!


