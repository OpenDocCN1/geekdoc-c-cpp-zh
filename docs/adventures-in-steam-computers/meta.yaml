    Google is not just one computer but a network of around 900,000 powerful computers
    in Google''s data centres. These computers allow the world''s estimated 1.17 billion
    Google users to search the web using the Google search engine. Google can be seen
    as the world''s largest computer, or computer cluster. A cluster is a group of
    connected computers that work together.


