    ## 赫曼·霍立立 (1860-1929)


    美国发明家赫曼·霍立立（Herman Hollerith）发明了打孔卡制表机，这是一种记录和排序信息的电气机器。这是数据处理领域的一个突破。他的理念是，任何信息都可以通过卡片上打的孔来记录。如果卡片上的特定区域代表性别，例如，那里的一个孔可能意味着“男性”。该系统最初用于美国人口普查局记录人口信息。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_0.png)


    ## 艾伦·图灵 (1912-1954)


    英国科学家艾伦·图灵（Alan Turing）发展了我们许多关于计算机如何运作的观点，尽管他的“图灵机”只是一个非常复杂的想法，而不是一台真实的机器。特别是，他研究了未来的电子计算机如何通过二进制数字字符串进行控制。他预测计算机有一天能像人类一样思考，我们称之为人工智能。今天，图灵也因为同性恋而受到迫害而被人记住。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_1.png)


    ## 约翰·莫奇利 (1907-1980) 和 J. 普斯斯珀·埃尔特 (1919-1995)


    美国发明家于1946年制造了第一台通用电子数字计算机，称为ENIAC（电子数值积分器和计算器）。它的输入、输出和内存存储均以打孔卡的形式存在。它每秒可以进行357次10位数的乘法。ENIAC占据了167平方米的地面空间，重量达30吨！


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_2.png)


    ## 有成千上万的软件程序


    软件的关键部分是计算机的操作系统。它控制计算机的基本功能，以及其他软件如何使用CPU和内存。它解释输入，将其转换为1和0。微软Windows是台式电脑最常用的操作系统。许多移动设备，如平板电脑和智能手机运行安卓操作系统。然而，苹果Mac台式电脑运行Mac
    OS操作系统，而移动设备运行iOS。


    > 艺术对话

    > 现代操作系统通过图形用户界面（GUI）与用户通信。它们最早开发于20世纪80年代初。GUI是由下拉菜单、程序坞和图标组成的系统，你点击它们来告诉计算机执行不同的任务。我们往往认为GUI是理所当然的，但仔细观察会发现它们的设计非常精妙。许多功能是通过图片而不是文字展示的。今天，孩子们学习理解GUI与他们学习阅读非常相似。


    检查一下你个人电脑上的GUI。如果可以，你会改变它的设计吗？还是它已经运行得很完美了？


    ![](img/50ab3428eb54bad681a3964413b0d4f4_27_1.png)


    ## 但你经常使用哪些呢？


    ### 家庭软件


    你计算机上的软件可能包括用于输入文档的文字处理程序、电子邮件程序、用于浏览网站的网络浏览器，以及播放音乐和视频的媒体播放器。反病毒软件可以防止你的计算机受到危险软件（病毒）的破坏，病毒通过互联网在计算机之间传播。


    ### 专业软件


    许多程序的创建是为了帮助人们更容易地完成工作。这些包括用于创建演示文稿或电子表格的程序、2D或3D设计程序、网站设计程序以及创建动画的程序。


    ![](img/50ab3428eb54bad681a3964413b0d4f4_28_0.png)


    软件是为特定目的特定“平台”（即计算机类型或操作系统）设计的。例如，某些软件是专为智能手机和平板电脑等移动设备设计的。这些程序被称为app，应用程序的缩写。第一个在线销售应用的商店于2008年开放。一个非常成功的应用是游戏《糖果大曲》（Candy
    Crush Saga），它的下载量超过了5亿次。


    > 技术对话


