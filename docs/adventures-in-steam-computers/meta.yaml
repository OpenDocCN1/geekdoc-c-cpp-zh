    # LEARN, PLAY AND WORK.


    # THINKING OUTSIDE THE BOX!


    Although virtual reality is most commonly used in games, it is also used in some
    workplaces. Its technology can be helpful for training soldiers, who experience
    the feeling of being in battle without putting themselves at risk. Surgeons are
    also able to train using virtual reality, giving them a lifelike experience of
    performing surgery without the need for a human being.


    Can you think of other jobs or activities for which virtual reality would be useful?
    What about situations where augmented reality could offer helpful features? Consider
    the worlds of education, construction, shopping, transport and government.


    +   - This soldier is learning how to make a parachute jump using a virtual reality
    program.


