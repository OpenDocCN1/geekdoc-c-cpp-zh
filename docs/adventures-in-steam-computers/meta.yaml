    # THE EARLIEST COMPUTERS FILLED A WHOLE ROOM. AS A RESULT, THEY COULD BE USED
    ONLY BY GOVERNMENTS AND LARGE ORGANISATIONS. A SERIES OF BREAKTHROUGHS LED TO
    THE DEVELOPMENT OF TODAY''S PERSONAL COMPUTERS, WHICH ARE FOUND IN OFFICES, HOMES
    AND POCKETS.


    # HALL OF FAME: PERSONAL COMPUTERS


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_0.png)


    # APPLE II, 1977


    This was one of the first ready-to-use personal computers with a microprocessor.
    It was designed by Steve Wozniak and Steve Jobs, co-founders of the Apple computer
    company. The Apple II was initially sold for US$1,298, which is equivalent to
    about £4,000 in today''s money.


    # MOUSE, 1963


    The mouse was invented by US computer engineers Douglas Engelbart and William
    English in 1963. The first mouse had a wooden shell, a circuit board and two metal
    wheels. Nine years later, English developed the design by replacing the wheels
    with a ball that could monitor movement in any direction. In 1973, the Xerox Alto
    was the first desktop computer to be used with a mouse.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_1.png)'
  - '[PAGE 34]


    # SMARTPHONE, 1994


    1994, the IBM Simon was the first mobile phone to also run software, and had a
    touchscreen used with a stylus. Applications included an address book, calendar,
    calculator, clock and electronic note pad. Simon could also send and receive emails.
    It was three years later, in 1997, that the first smartphones were given web browsers
    for searching the web.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_1.png)


    # IPAD, 2010


    Tablet-style computers have been available since the early years of the 21st century,
    but they did not become truly popular until Apple launched the iPad in 2010. The
    iPad''s success is due to its many built-in functions, such as wireless Internet
    connection, camera and music library.


    # GOOGLE GLASS, 2013


    This wearable computer featured a screen and camera. It accepted inputs from voice
    commands and a touchpad on the side. Google Glass was withdrawn from sale after
    a year, partly because people were worried about being secretly filmed. However,
    the future of computing may still lie in wearable devices.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_2.png)'
  - '[PAGE 35]


    # A NETWORK CONNECTS COMPUTERS ACROSS THE ROOM,


    # NETWORKS


    THE EARLIEST NETWORKS USED WIRES TO CONNECT THE COMPUTERS... IN A BUILDING. TODAY,
    THE INTERNET IS A VAST COMPUTER NETWORK COVERING THE WHOLE WORLD.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_0.png)


    Networks are a way of sharing data and other resources. Wired networks are created
    by copper wires or optical fibres. Many homes are connected by copper wires, along
    which data is sent as electrical signals. Most new networks use optical fibres,
    along which data travels as pulses of light. Optical fibre networks carry data
    much faster than copper wire.


    LOCAL AREA NETWORKS

    Small networks connect computers and printers within schools and offices.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_1.png)


    WIDE AREA NETWORKS

    Wide area networks link computers across cities, countries and the world.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_2.png)'
  - '[PAGE 36]


    # CITY OR PLANET.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_36_0.png)


    People often use the words ''web'' and ''Internet'' as they mean the same thing.
    In fact, the Internet is a worldwide network, made up of thousands of kilometres
    of cables as well as wireless connections. Like all networks, the Internet is
    a way of exchanging data, and it is commonly used for sending and receiving emails.
    It is also used for accessing millions of websites: the ''web''.


    In a wireless network, data is usually sent and received radio waves. On a global
    scale, communications satellites orbiting the Earth receive and transmit data
    wirelessly. On a smaller scale, wireless local area networks use a system called
    Wi-Fi. A Wi-Fi network covers a single home or business. A device called a wireless
    router sends and receives radio waves within the building. The router is often
    connected to a larger network, either wired or wireless.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_36_1.png)


    # MATHS TALK


    The word ''Internet'' was first used in 1974, when local networks started to merge
    into one giant network. Then, there was just a few hundred people connected to
    the Internet. Today, more than 3.4 billion people are connected to it.


    Internet users in the world


    ![](img/50ab3428eb54bad681a3964413b0d4f4_36_2.png)


    +   - The country with the highest percentage of Internet users is Iceland, with
    100 cent of its population having Internet access.

    - The country with the lowest proportion is Eritrea in East Africa, where only
    1 per cent have Internet access.


    | 2003 | 2005 | 2007 | 2009 | 2011 | 2013 | 2015 | 2017 |

    |---|---|---|---|---|---|---||}{

    | 750 million | 1 billion | 1.3 billion | 17 million | 2.7 billion | 3.1 billion
    | 3.4 billion | |'
  - '[PAGE 37]


    # THE WEB


    WHENEVER WE LOOK AT A WEBSITE, WE ARE USING THE WORLD WIDE. WEBSITES ALLOW US
    TO FIND OUT THE NEWS, WATCH VIDEOS, BUY CLOTHES, PLAY GAMES AND LINK WITH FRIENDS.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_37_0.png)


    A website is a document stored on a computer somewhere in the world. These documents
    can contain words, images and videos. Websites are written in a special computer
    language called Hypertext Mark-up Language (HTML). Websites and webpages are connected
    by hyperlinks when we click on a link, we move from one webpage to another.


    The web was invented by English computer scientist Tim Berners-Lee in 1989


    # TECHNOLOGY TALK


    We view websites using software called a web browser. Google Chrome and Internet
    Explorer are popular browsers. When we type the address of a website into our
    browser, the browser sends a request over the Internet: it asks the computer storing
    the website to send it to our computer. The data is returned via the Internet.
    The browser then follows the instructions in the HTML to display the website on
    our computer.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_37_1.png)'
  - '[PAGE 38]


    # CAN ACCESS USING THE INTERNET.


    Web addresses are like postal addresses: they are a way of identifying a particular
    website. All web addresses start with the letters ''http'', which stands for Hypertext
    Transport Protocol: the set of rules that govern how websites are transported
    over the Internet. Most websites have the letters ''www'', which stand for World
    Wide Web. The end of a web address, called its suffix, can tell something about
    the organisation that runs the website, for example:


    ```

    http://www...

    ```


    ```

    co.uk

    ```


    means the website was created by a UK business


    ```

    .org

    ```


    often means the website was created by a charity


    ```

    .gov

    ```


    means the website is hosted by a government


    # THINKING OUTSIDE THE BOX!


    The World Wide Web opens up huge possibilities for knowledge and communication.
    However, when we are using the web, it is important to think about how we do it.
    Anyone can create a website containing information that is false or harmful. When
    we use websites that allow us to communicate directly with other people, often
    called social networking, we need to think about how we behave and watch out for
    how others behave. Since the web is created by people, it can only be as good
    as or as bad as the people who use it.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_38_0.png)


    +   I don''t play with you!


    +   I don''t like you!


    +   Don''t pass on gossip.


    +   Don''t talk to Emily.


    +   Stop ganging up on her.


    +   Psst! Pass it on!


    +   Heard the gossip?


    +   Tell everyone!


    +   That''s not a nice thing to say. I''m going to tell an adult.


    +   Shut up!


    +   Don''t be unkind.


    +   Not listening!


    +   Hiss!'
