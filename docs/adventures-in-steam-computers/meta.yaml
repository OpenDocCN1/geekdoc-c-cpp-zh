  md: '# CAN ACCESS USING THE INTERNET.


    Web addresses are like postal addresses: they are a way of identifying a particular
    website. All web addresses start with the letters ''http'', which stands for Hypertext
    Transport Protocol: the set of rules that govern how websites are transported
    over the Internet. Most websites have the letters ''www'', which stand for World
    Wide Web. The end of a web address, called its suffix, can tell something about
    the organisation that runs the website, for example:


    ```

    http://www...

    ```


    ```

    co.uk

    ```


    means the website was created by a UK business


    ```

    .org

    ```


    often means the website was created by a charity


    ```

    .gov

    ```


    means the website is hosted by a government


