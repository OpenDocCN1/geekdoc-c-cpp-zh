  md: '# 111111S AND 000000S.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_14_0.png)


    Binary numbers turn a computer''s electrical circuits on and off. The CPU contains
    many tiny circuits with switches in them. Like a light switch, these mini switches
    turn the flow of electricity in the circuit on or off. A 1 turns the electricity
    on. A0 turns it off. The constant turning on and off of electrical circuits is
    what allows a computer to carry out its work.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_14_1.png)


    # TECHNOLOGY TALK


    This is a circuit board, a board with electrical circuits mapped out on it. The
    silver-coloured plugs are large, old-fashioned transistors. Today''s transistors
    are so small they can be seen only under a microscope.


    > The tiny switches in a computer''s electrical circuits are called transistors.
    They are made of a material called silicon, which can be treated with chemicals
    to either let electricity flow or stop it. Switches are made from silicon treated
    in both ways. Transistors were invented in 1947 by John Bardeen, William Shockley
    and Walter Brattain. Since then, transistors have got smaller and smaller. Today,
    they can be as tiny as 7 nanometres. A nanomet is a billionth of a metre.'
