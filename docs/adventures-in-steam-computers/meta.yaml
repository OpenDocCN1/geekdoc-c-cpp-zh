    A COMPUTER IS A MACHINE CONTROLLED BY A SET OF INSTRUCTIONS CALLED A PROGRAM.
    MOST PEOPLE USE A COMPUTER EVERY DAY TO DO ALL SORTS OF THINGS, FROM HELPING HOMEWORK
    TO LISTENING TO MUSIC.


    Computers work with information, known as data. Computers are able to store data
    and carry out tasks with it, called processing. Then computers show the user the
    results of their work. Modern computers work with data in many different forms:


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_1.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_2.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_3.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_4.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_7_5.png)


    # TECHNOLOGY TALK


    A program is a list of instructions that tells a computer exactly what work to
    do. Without programs, a computer could not do anything at all. Programs are written
    by people called computer programmers, or ''coders''. Programs break down any
    task into its most basic steps, telling the computer what to do first, then next,
    then after that. Different programs do different jobs, such as sending emails
    or playing music.'
