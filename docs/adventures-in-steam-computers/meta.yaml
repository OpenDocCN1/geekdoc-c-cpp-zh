  md: '# VOYAGER I


    The space probe Voyager I is the furthest man-made object from Earth, which makes
    its three computers the furthest from Earth. Voyager I was launched in 1977 and
    passed out of the solar system in 2012. The three computers control the probe
    and its cameras. They receive commands from Earth and send data using the Deep
    Space Network. This network uses giant Earth-based radio antennae to transmit
    data.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_0.png)


    # PACEMAKER


    A pacemaker is a small electronic device that is placed inside the human chest
    to monitor and control heart problems. The machine uses electric pulses to keep
    the heart''s muscles working normally. Pacemakers contain a computer, which can
    be programmed from outside the body by a heart specialist. These computers save
    hundreds of lives every day.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_1.png)


