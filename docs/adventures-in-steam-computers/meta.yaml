  mdcn: "\n\n# 而且更加复杂。\n\n互联网改变了我们相互互动的方式。社交网络网站Facebook由马克·扎克伯格及其朋友于2004年推出。到2017年，Facebook已经拥有了19亿用户，他们在这里分享自己的观点、活动记录和照片。今天，有些人每天可能只与一或两人面对面交流，但在网上却与数百甚至数千人“交流”。尽管我们可能觉得比以前联系更频繁，但也许我们中的一些人感到更加孤独。我们的在线“朋友”是真正的朋友吗？我们如何判断他们是否如他们表现出来那样\n\
    \n## 数学对话\n\n1950年，世界上只有几台计算机。如今，每年有约3.5亿台台式电脑和笔记本电脑售出。此外，至少还有9亿智能手机和2亿平板电脑被购买。\n\
    \n## 计算机从未停止发展和\n\n### 未来的计算机\n\n自从70年前第一台电子数字计算机问以来，计算机变得越来越小、越来越快。在未来的70年里，计算机将发生什么变化？\n\
    \n计算机可能会继续变得更快。然而，许多人认为，为了实现这一点，必须放弃目前使用硅片中电子电路的计算方法。新的计算方法的想法正在开发中：\n\n- **量子计算机**可以使用极微小的天然粒子来存储和处理数据。\n\
    - **化学计算机**可以使用化学品的混合物，通过它们相互反应来执行计算。\n- **光学计算机**可以使用光，其开关方式与当今计算机中的电流类似。\n\n\
    > 我们家中的一些设备装有微型计算机，它们通过互联网与其他设备通信，创造了“物联网”。这些连接的设备被称为“智能”：我们已经有了智能加热系统和可以使用手机开启的智能水壶，以及能够重新订购食物的智能冰箱。未来，整个房子都可能是智能的，浴室会在洗澡时间自动运行，卧室会在睡觉时间自动就好。\n\
    \n## 改变——而且它们永不会停止。\n\n在未来，我们可能不再使用物理（“真实”）设备，如笔记本电脑或智能手机。我们使用的“设备”将是我们独一无二的数字身份，可能是一个名字或数字。使用该身份，我们将通过非物理门户（或“门”）访问计算系统，而这些门户尚未被发明。也许数据将使用增强现实的形式进行查看。\n\
    \n## 跳出框架思考！\n\n未来计算的另一种可能方法涉及集成纳米电子设备。“集成”意味着“链接”，“”，“纳米”意味着“微小”。这种计算方法可能直接通过我们的脑信号工作，这些信号沿着神经系统以微小电信号的形式传输。当你想要使用计算机时（它可能佩戴在皮肤上或植入皮肤中），你会想“开启”，而不是按下“开机”开关。这听起来像科幻小说，但对于生活在20世纪初的人来说，智能手机听起来同样不可思议。\n\
    \n## 词汇表\n\n**算法（algorithm)** 解决问题时遵循的一系列规则。\n\n**动画（animations）** 通过逐次显示略有不同的图像来创造运动幻觉的图形。\n\
    \n**人工智能（artificial intelligence）** 可以执行通常需要人类智能的任务的计算机程序。\n\n**二进制（binary）**\
    \ 由两部分组成；二进制系统只使用0和1。\n\n**中央处理器（central processing unit）** 计算机的“大脑”，大多数操作发生的地方。\n\
    \n**电路板（circuit board）** 安装电气电路的板子。\n\n**数据（data）** 信息。\n\n**数据库（database）** 存储在计算机上的组织良好的数据集合。\n\
    \n**数据中心（data center）** 容纳许多网络计算机的建筑，用于存储和处理大量数据。\n\n**数字的（digital）** 以0和1的模式表示的信息或信号。\n\
    \n**电子书（ebook）** 在计算机或其他电子设备上阅读的书。\n\n**电路（electrical circuits）** 电流可以流过的环路。\n\
    \n**文件（files）** 作为一个单元存储的数据集。\n\n**硬件（hardware）** 计算机的机械装置、布线和其他物理部分。\n\n**输入（inputs）**\
