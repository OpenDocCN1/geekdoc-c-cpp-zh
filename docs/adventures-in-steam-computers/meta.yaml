    # TECHNOLOGY TALK


    We view websites using software called a web browser. Google Chrome and Internet
    Explorer are popular browsers. When we type the address of a website into our
    browser, the browser sends a request over the Internet: it asks the computer storing
    the website to send it to our computer. The data is returned via the Internet.
    The browser then follows the instructions in the HTML to display the website on
    our computer.


