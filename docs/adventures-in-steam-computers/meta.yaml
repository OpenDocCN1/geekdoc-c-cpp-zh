  md: '# THOSE ARE INPUTS.


    # THINKING OUTSIDE THE BOX!


    Mice do their job so well that most people never think about alternatives. However,
    there are other hand-held pointing devices, which are not so widely used. One
    is a stylus, a pen-shaped device used with touchscreens. Another is a light pen,
    which shines light onto a special computer screen. Can you think of a new design
    for a hand-held input?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_20_0.png)


    Some computers accept inputs that are spoken. To accept voice inputs, a computer
    needs a microphone and speech recognition software. When we speak, our words have
    patterns of loud and soft sounds. For example, a hard consonant, like a p, is
    a sudden, loud sound. Voice recognition software compares the patterns of loud
    and soft with the 50 or so phonemes (speech sounds) in its database.


    # TECHNOLOGY TALK


    Smartphones and tablets have touchscreens, while laptops have trackpads in place
    of a mouse. A grid of electrical circuits lies beneath the touchscreen or trackpad.
    These pick up the movement of your fingers and send signals to the computer. Many
    touchscreens can recognise particular touches, such as pinches to zoom in, and
    swipes to the pages of an ebook.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_20_1.png)'
