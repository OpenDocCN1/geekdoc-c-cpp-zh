  md: '# PROCESSING UNIT.


    Modern CPUs are small, flat ''chips'' of silicon called microprocessors. They
    are also called ''integrated circuits''. Microprocessors contain billions of tiny
    circuits with switches that can be turned on or off. Before microprocessors were
    invented in 1971, computers were very bulky because they were built from racks
    of circuit boards containing many different circuits (see page 23).


    ![](img/50ab3428eb54bad681a3964413b0d4f4_16_0.png)


    # MATHS TALK


    The more switches, or transistors, a CPU has, the faster it can process data.
    In 1975, the electronics expert Gordon Moore predicted that computer processing
    power would double every two years. He was right! That is because we have learnt
    how to make tinier and tinier transistors and pack them onto microprocessors.
    Today''s most powerful microprocessor contains 2 billion transistors. However,
    will the increase in processing power continue? Some people think that transistors
    are now as small as they possibly can be.


    > Today''s computers are 130,000 times more powerful than they were in 1988.'
