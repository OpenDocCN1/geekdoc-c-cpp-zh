    # EARLY FORM OF COMPUTER.


    The first clockwork calculator was invented by the mathematician Blaise Pascal,
    in 1642. It was designed to help calculate how much tax people owed. It could
    add and subtract one number from another, by the turning of linked cogs. It did
    multiplication and division through repeated addition and subtraction. Sadly,
    the machine was too complicated to be very successful.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_10_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_10_1.png)


    > A great step step forward in the development of programmable machines was a
    loom invented by Joseph Marie Jacquard in 1801. Looms are machines that weave
    cloth. What was extraordinary about Jacquard''s loom was that, for the first time,
    weavers could program the loom to weave a pattern. The program was in the form
    of punched cards, with holes representing the coloured threads making each pattern.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_10_2.png)'
