  mdcn: '


    ## 在你的家里和学校里。


    到处都是“隐藏”的计算机。这些计算机通常被程序化为执行比个人电脑更有限的任务。它们中的大多数设备没有屏幕、键盘或鼠标，所以你可能根本不会将它们识别为计算机。在游戏机、相机、汽车、飞机、交通信号灯和机器人玩具等各种机器内部都有计算机。


    就像你的个人电脑一样，自动取款机内部的计算机也处理数据工作。这些数据包括你的私人个人密码、你想要提取的现金总量以及你银行账户中的资金总额。计算机的软件提供如何使用这些数据的指令，然后如何显示工作结果——通常是发放现金。


    ## 项目


    你可以在个人电脑上完成哪些任务？在成人的帮助下，尝试在接下来的一周内使用计算机完成这些任务。在每种情况下，写下你执行该任务时使用的软件名称：


    - 写一个故事。

    - 画幅画。

    - 访问儿童友好网站。

    - 播放一段曲子。

    - 创建演示文稿。为什么不展示一下你软件的研究结果呢！


    ## 对于计算机来说，一切都是 1 和 0 的流


    计算机的电路无法以文字或图片的形式存储和处理数据。计算机将接收到的所有数据转换为它们可以快速处理的形式：数字。


    计算机是数字设备。这意味着它们使用数字（数位）执行所有操作。计算机实际上处理的是两个数字：0 和 1。这些被称为二进制数。


    ## 数学对话


    在二进制数字系统中，没有数字 2、3、4、5、6、7、8 和 9。尽管如此，任何数字都可以以二进制形式给出。在二进制中，计数方式如下：


    | 二进制值 | 十进制值 |

    |---|||

    | 0 | 0 |

    | 1 | 1 |

    | 10 | 2 |

    | 11 | 3 |

    | 100 | 4 |

    | 101 | 5 |

    | 110 | 6 |

    | 111 | 7 |

    | 1000 | 8 |

    | 1001 | 9 |

    | 1010 | 10 |


    你能看出这个规律吗？尝试从 11 数到 20。


    ## 111111S 和 000000S。


    二进制数控制计算机电路的开启和关闭。CPU 包含许多带有开关的微型电路。就像灯开关一样，这些微型开关控制电路中电流的开启或关闭。1 开启电流。0 关闭电流。电路的不断开启和关闭让计算机能够执行其工作。


    ## 技术对话


    这是一块电路板，一块上面绘制有电气电路的板子。银色的插头是大型的老式晶体管。今天的晶体管非常小，只有在显微镜才能看到。


    > 计算机电路中的微型开关被称为晶体管。它们由名为硅的材料制成，硅可以通过化学处理让电流流动或停止流动。开关是由经过两种方式处理的硅制成的。晶体管由约翰·巴丁（John
    Bardeen）、威廉·肖克利（William Shockley）和沃尔特·布拉特恩（Walter Brattain）于1947年发明。从那时起，晶体管变得越来越小。今天，它们可以小到
    7 纳米。一个纳米是米的十亿分之一。


    ## 计算机的“大脑”是它的中央处理器的大脑


    CPU 是一个关键硬件部件。它执行计算机所有的计算并控制它的其他硬件。


    为了执行任何任务，每台计算机都遵循相同的流程：


    - 输入：计算机接收数据。这被称为输入。

    - 内存：当计算机接收输入时，CPU 和内存协同工作：CPU 读取存储在内存中的程序，并将数据存储在内存中。

    - 处理：计算机在其 CPU 中处理数据。

    - 输出：计算机给用户工作结果。这被称为输出。


    ## 跳出框架思考！


    你可以把大脑想象成自己的。考虑一下：


    1. 你接收来自 CPU 的指令。

    2. 你在内存中搜索数据。

    3. 你使用你的大脑算出算式。

    4. 你给回结果。


    ## 处理单元。


    现代 CPU 是小型扁平的硅芯片。它们也被称为“集成电路”。它们包含许多可以开启或关闭的开关。在1971年微处理器发明之前，计算机非常笨重。


    ## 数学对话


    CPU 拥有的开关越多，处理速度就越快。1975年，电子专家摩尔（Moore）预测计算机能力每两年翻一倍。他是对的！今天的微处理器包含数十亿个开关。


    ## 内存可以存储多达十亿


    计算机内存的重要部分位于其主板上：ROM 和 RAM。


    - ROM：“只读存储器”即使在计算机关闭时也会存储程序。

    - RAM：“随机存存储器”是工作时存储数据的地方。当用户关闭计算机时，除非保存到硬盘，否则数据将会丢失。

    - 硬盘：硬盘位于台式电脑中，但某些平板电脑使用内存代替。


    ## 数学对话


    1956年，第一块硬盘重 1000 公斤，尺寸有两台冰箱大。它只存储了 3.75 兆字节。今天大多数硬盘重 62 克（一个鸡蛋的重量），容量为 10 TB。


    ## 设备


    如果你需要更多的内存空间，可以将数据保存到外部设备上。在外部设备上备份（制作副本）文件也是良好的习惯，以防计算机损坏。


    优存盘

    优存盘（也称为闪盘或 USB 盘）可以放在口袋里，用于将数据从一台计算机携带到另一台计算机。


    内存卡

    内存卡可以滑入笔记本电脑、平板电脑和智能手机中。


    ## 云存储


    云存储是将数据保存在世界上其他地方的计算机上，通常位于数据中心。数据通过互联网传输。


    ## 数学


    就像距离以厘米、米和公里为单位一样，内存以字节、KB、MB、GB 和 TB 为单位。一个字节包含 8 个二进制位。一个 KB 包含 8000 个二进制位。一个
    TB 包含 8 万亿二进制位。一个包含 100 个单词文本的文件可能约为 45 KB，而数字码相机拍摄的照片为 1 MB 或更多。


    '
