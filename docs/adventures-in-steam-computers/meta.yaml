  md: '# HERMAN HOLLERITH (1860-1929)


    US inventor Herman Hollerith invented the punched-card tabulator, an electrical
    machine that recorded and sorted information. This was a breakthrough in data
    processing. The idea was that any piece of information could be recorded by a
    hole punched in a card. If a particular area on the card represented gender, for
    example, a hole there could mean ''male''. The system was initially used for recording
    information about the population for the United States Census Office.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_0.png)


    # ALAN TURING (1912-1954)


    The English scientist Alan Turing developed many of our ideas about how computers
    might work, although his ''Turing machine'' was only a very complex idea, not
    a real machine. In particular, he studied how a future electronic computer might
    be controlled by strings of binary numbers. He predicted that computers would
    one day be able to think like humans, which we call artificial intelligence. Today,
    Turing is also remembered for being persecuted for being gay.


