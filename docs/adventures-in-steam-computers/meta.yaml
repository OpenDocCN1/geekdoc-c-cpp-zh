    # 计算机是……


    ## 计算机是


    计算机是由一组被称为“程序”的指令控制的机器。大多数人每天都使用计算机来完成各种事情，从帮助完成作业到听音乐。


    计算机处理信息，这些被称为数据。计算机能够存储数据并利用它执行任务，这被称为“处理”。然后计算机向用户显示结果。


    # 技术谈


    程序是告诉计算机该做什么的指令列表。没有程序，计算机什么也做不了。程序将任务分解为不同的步骤，例如：首先，然后。现代计算机以各种形式处理数据：


    # 硬件


    硬件是计算机运行的部件。软件存储在硬件中。当你使用计算机时，显而可见的硬件部分是屏幕和键盘。计算机


    - 主板

    - CPU

    - 内存


    # 起之初


    数千年前，人们发明了计算设备来帮助求和。这些是电子机器。


    第一个机械计算器由数学家布莱斯·帕斯卡（Blaise Pascal）于 1642 年发明。它通过联动轮的旋转进行加法和减法。遗憾的是，这台机器太复杂了。


    # 计算机的早期形式


    算盘出现在几千年前。像现代计算机一样，算盘通过织物进行工作。算盘是利用织物进行计数。算盘有七根杆子。


    - 在第一根杆子上，上珠代表 5，下珠代表 1

    - 在第二根杆子上，上珠代表 50，下珠代表 10

    - 在第三根杆子上，上珠代表 500，下珠代表 100

    - 在第四根杆子上，上珠代表 5000，下珠代表 1000

    - 在第五根杆子上，上珠代表 50000，下珠代表 10000

    - 在第六根杆子上，上珠代表 500000，下珠代表 100000

    - 在第七根杆子上，上珠代表 5000000，下珠代表 100000


    # 算盘


    > 可编程机器的发展的一个巨大进步是约瑟夫·玛丽·雅卡（Joseph Marie Jacquard）于 1801 年发明的织机。织机是编织物的机器。雅卡织机的非凡之处在于，织工第一次可以对织机编程以织出图案。程序是以打孔卡的形式存在的，孔代表制作图案的彩色线。


    # 计算机可以画画、播放音乐或


    # 火星上的航天器


    # 科学谈


    今天的计算机由电力驱动。台式计算机插在电源。智能手机和笔记本电脑由电池驱动，电池可以储存一定量的电。它们需要从电源充电。所有的计算机数据都通过被称为电流的小流量传输。


    # 计算机无处不在


    当你想到计算机时，你可能想象的是一台带有屏幕和键盘的机器。这些被称为个人电脑（PC），因为它们是供一个人使用的。但有些计算机看起来完全不同。


    有几种类型的电脑：


    台式计算机这些沉重的计算机固定在一个地方。它们有独立的屏幕和键盘，并使用鼠标作为访问屏幕位置的指向设备。大多数台式计算机还有扬声器、麦克风和摄像头。


    笔记本电脑这些轻型计算机通常采用“合盖”形式，键盘位于“外壳”的下方，屏幕位于上方。它们的指向设备通过触摸操作，使用触控板。


    平板电脑是平板状的手持设备。它们通过触摸屏幕（触摸屏）进行操作。平板电脑有摄像头、扬声器和麦克风，还有一个“加速度计”，它可以监测移动并确保计算机显示始终竖直。


    # 项目


    如果你有一块算盘，或者可以使用珠子进行加法和减法。这里有一个让你开始的例子：

    40 + 12 = 52


    | 40 | 12 | 52 |

    |---|---|---|

    | | | |


