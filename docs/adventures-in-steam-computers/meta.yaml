    # AND FAR MORE COMPLEX.


    The Internet has changed the way we interact with each other. The social networking
    website Facebook was launched in 2004 by Mark Zuckerberg and friends. By 2017,
    Facebook had 1.9 billion users, sharing their opinions, activities and photos.
    Today, some people may speak face to face with just one or two people a day, but
    ''speak'' to hundreds or even thousands online. Although we may feel more connected
    than before, perhaps some of us are lonelier. Are our online ''friends'' real
    friends? How can we tell if they are who they appear to be?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_46_0.png)


    # MATHS TALK


    In 1950, there were just a handful of computers in the world. Today, around 350
    million desktop and laptop computers are sold every year. In addition, at least
    900 million smartphones are bought, as well as 200 million tablets.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_46_1.png)'
  - '[PAGE 47]


    # COMPUTERS HAVE NEVER STOPPED DEVELOPING AND


    # FUTURE COMPUTERS


    SINCE THE FIRST ELECTRONIC DIGITAL COMPUTERS WERE BUILT 70 YEARS AGO, COMPUTERS
    HAVE BECOME MUCH SMALLER AND FASTER. HOW WILL COMPUTERS CHANGE IN THE NEXT 70
    YEARS?


    Computers will probably continue to get faster. However, many people think the
    current method of computing, using electrical circuits in chips of silicon, will
    have to be abandoned to make that happen. Ideas for new computing methods are
    being developed:


    +   * QUANTUM COMPUTERS could use tiny natural particles to store and process
    data.


    +   * CHEMICAL COMPUTERS could use mixtures of chemicals to perform calculations
    through their reactions with each other.


    +   * OPTICAL COMPUTERS could use lights, which would turn on and off in a way
    similar to the electric currents in today''s computers.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_47_0.png)


    > Some of the devices in our homes hold tiny computers which communicate with
    other devices using the Internet, creating the ''Internet of Things''. These connected
    devices are called ''smart'': We already have smart heating systems and smart
    kettles that are turned on using smartphones, and smart fridges that reorder food.
    In future, entire homes may be smart, with baths that run themselves at battime,
    and bedrooms that construct themselves at bedtime.'
  - '[PAGE 48]


    # CHANGING - AND THEY NEVER WILL.


    In the future, we may not use physical (''real'') devices, such as laptops or
    smartphones. The ''devices'' we use will be our own digital identity, unique to
    us, perhaps a name or number. Using that identity, we would access computing systems
    through non-physical portals (or ''doorways''), which have yet to be invented.
    Perhaps data would be viewed using a form of augmented reality.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_1.png)


    # THINKING OUTSIDE THE BOX!


    Another possible method of future computing involves integrated nano-electronics.
    ''Integrated'' means ''linked in and ''nano'' means ''tiny''. This method of computing
    could work directly from our brain signals, which travel along our nerves as tiny
    electrical signals. When you wanted to use your computer, which might be worn
    or implanted in your skin, you would think ''switch on'' rather than pressing
    the ''on'' switch. This sounds like science fiction, but smartphones would have
    sounded just as far-fetched to someone living in the early 20th century.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_2.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_3.png)'
  - '[PAGE 49]


    # GLOSSARY


    **algorithm** A set of rules to follow when solving a problem.


    **animations** Graphics that create the illusion of movement by showing slightly
    different images one after another.


    **artificial intelligence** Computer programs that can perform tasks that usually
    require human intelligence.


    **binary** With two parts; the binary number system uses only 0 and 1.


    **central processing unit** The ''brains'' of a computer, where most operations
    take place.


    **circuit board** A board on which electrical circuits are installed.


    **data** Information.


    **database** An organised collection of data stored on a computer.


    **data center** A building that holds many networked computers used for storing
    and processing large amounts of data.


    **digital** Information or signals expressed as a pattern of 0s and 1s.


    **ebook** A book that is read on a computer or other electronic device.


    **electrical circuits** Loops around which electric can travel.


    **files** Collections of data that are stored as one unit.


    **hardware** The machinery, wiring and other physical parts of a computer.


    **inputs** Information fed into a computer.


    **Internet** A worldwide network of computer networks.


    **joysticks** Hand-held levers used to control movement in a computer.


    **logos** Symbols used by a company to identify its products.


    **microprocessors** Small electronic devices that act as the ''brain'' of modern
    computers.


    **motherboard** A circuit board that holds the main parts of a computer.


    **networks** Computers connected by cables, wires or wireless links.


    **pixels** The smallest units of an image represented on screen.


    **processing** Operating on data by passing it through a series of actions, using
    a program.


    **radio waves** A form of energy used for sending invisible signals through the
    air.


    **RAM** Random access memory; where data is stored while the user is working.


    **ROM** Read only memory; a hardware device that stores programs and data even
    when the computer is off.


    **search engine** A program that searches for websites.


    **sensors** Devices that detect and respond to light, sound or other physical
    properties.


    **social networking** Using websites that allow people to connect with others.


    **software** The programs used by a computer.


    **web** A worldwide network of hypertext files, ''websites'', which are accessed
    using the Internet.


    **webcam** A computer''s video camera, which can send its images via the Internet.


    **wireless** Communicating without wires, using radio waves.'
  - '[PAGE 50]


    # FURTHER READING


    Digital Technology Tom Jackson (Franklin Watts, 2016)


    Project Code Kevin Wood (Franklin Watts, 2017)


    The Science of Computers Clive Gifford (Wayland, 2016)


    # WEBSITES


    FIND OUT MORE ABOUT COMPUTERS AND PROGRAMMING AT THE FOLLOWING WEBSITES:


    +   - www.bbc.co.uk/education/topics/zs7s4wx

