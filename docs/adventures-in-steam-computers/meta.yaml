  md: '# # LAND A SPACECRAFT ON MARS.


    SOFTWARE is all the programs that tell a computer what to do. Software is stored
    and runs on a computer''s hardware.


    HARDWARE is all the parts of a computer you can touch. When you look at the computer
    on your desk, the most obvious pieces of hardware are the screen and keyboard.
    However, many other bits of hardware are hidden away inside a computer.


    Inside a computer, the motherboard holds crucial parts. One of these is the central
    processing unit (CPU), which carries out all the computer''s calculations. There
    are also two types of memory, ROM and RAM (see page 14), for storing data and
    programs.


    # SCIENCE TALK


    Today''s computers are powered by electricity. A desktop computer is plugged into
    the mains electricity supply. Smartphones and laptops are powered by batteries,
    which can store a certain amount of electrical energy. They need recharging from
    the mains electricity supply. All computer data is carried in tiny flows of electricity
    called electric currents.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_8_0.png)


