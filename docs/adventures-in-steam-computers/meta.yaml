    # A COMPUTER IS...


    ## A COMPUTER IS


    A COMPUTER IS A MACHINE CONTROLLED BY A SET OF INSTRUCTIONS CALLED A PROGRAM.
    MOST PEOPLE USE A COMPUTER EVERY DAY TO DO ALL SORTS OF THINGS, FROM HELPING HOMEWORK
    TO LISTENING TO MUSIC.


    Computers work with information, known as data. Computers are able to store data
    and carry out tasks with it, called processing. Then computers show the user the
    results of their work. Modern computers work with data in many different forms:


    # TECHNOLOGY TALK


    A program is a list of instructions that tells a computer exactly what work to
    do. Without programs, a computer could not do anything at all. Programs are written
    by people called ''coders''. Programs break down any task into its most basic
    steps, telling the computer what to do first, then next, then after that. Different
    programs do different jobs, such as sending emails or playing music.


    # HARDWARE


    SOFTWARE is all the programs that tell a computer what to do. Software is stored
    and runs on a computer''s hardware. HARDWARE is all the parts of a computer you
    can touch. When you look at the computer on your desk, the most obvious pieces
    of hardware are the screen and keyboard. However, many other bits of hardware
    are hidden away inside a computer.


    - MOTBOARD

    - CPU

    - RAM


    # THE BEGINNING


    THOUSANDS OF YEARS AGO, PEOPLE INVENTED CALCULATING DEVICES TO HELP THEM DO SUMS.
    THESE WERE NOT ELECTRONIC MACHINES, BUT THEY WERE THE FIRST STEP ON THE WAY. THE
    WORD ''COMPUTER'' WAS FIRST USED IN 1613, DESCRIBING A PERSON WHO DID CALCULATIONS.


    The abacus appeared over 4,000 years ago. Like modern computers, the abacus was
    a machine that performed operations by simplifying them. It was a step up from
    using stones or a tally with counting. The Chinese-style abacus has at least seven
    rods. In the upper section of each rod, there are two beads. In the lower section,
    there are five beads.


    - On the first rod on the right, the upper beads represent 5s, while the lower
    beads represent 1s.

    - On the second rod from the right, the upper beads represent 50s and the lower
    beads represent 10s.

    - The values continue to increase by a factor of ten: to 100s, 1,000s and so on.


    # PROJECT


    If you have an abacus, or can make a basic one using marbles or beads, doing some
    addition and subtraction. Here is an example to get you started:

    40 + 12 = 52


    | 40 | 12 | 52 |

    |---|---|---|

    | | | |


    # EARLY FORM OF COMPUTER.


    The first clockwork calculator was invented by the mathematician Blaise Pascal,
    in 1642. It was designed to help how much tax people owed. It could add and subtract
    one number from another, by the turning of linked cogs. It did multiplication
    and division through repeated addition and subtraction. Sadly, the machine was
    too complicated to be very successful.


    > A great step step forward in the development of programmable machines was a
    loom invented by Joseph Marie Jacquard in 1801. Looms are machines that weave
    cloth. What was extraordinary about Jacquard''s loom was that, for the first time,
    weavers could program the loom to weave a pattern. The program was in the form
    of punched cards, with holes representing the coloured threads making each pattern.


    # A COMPUTER CAN DRAW PICTURES, PLAY TUNES OR


    # A SPACECRAFT ON MARS


    # SCIENCE TALK


    Today''s computers are powered by electricity. A desktop computer is plugged into
    the mains supply. Smartphones and laptops are powered by batteries, which can
    store a certain amount of electrical energy. They need recharging from the mains
    supply. All computer data is carried in tiny flows of electricity called electric
    currents.


    # COMPUTERS EVERYWHERE


    WHEN YOU THINK OF A COMPUTER, YOU PROBABLY IMAGINE A MACHINE WITH A SCREEN AND
    A KEYBOARD. THESE ARE CALLED PERSONAL COMPUTERS (PCS), BECAUSE THEY ARE FOR GENERAL
    USE BY ONE PERSON. BUT SOME COMPUTERS LOOK QUITE DIFFERENT.


    There are several types of personal computers:


    DESKTOP COMPUTERS These heavy computers are kept in one location. They have a
    separate screen and keyboard, and use a mouse as a pointing device for accessing
    locations on the screen. Most desktop computers also have a speaker, microphone
    and webcam.


    LAPTOPS These lightweight computers are usually in a ''clamshell'' form, with
    a keyboard in the lower part of the ''shell'' and a screen in the upper. Their
    pointing device is operated by touch, using a touchpad or trackpad.


    SMARTPHONES As well as making voice calls and sending text messages, these mobile
    phones offer some of the features as personal computers: they can access the web
    and run software.


    TABLETS Tablets are flat, hand-held devices. They are operated by touching the
    screen, called a touchscreen. Tablets have a camera, speaker and microphone, as
    well as an ''accelerometer'', which monitors movement and makes sure the computer
    display is always upright.

