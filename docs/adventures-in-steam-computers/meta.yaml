    The Internet has changed the way we interact with each other. The social networking
    website Facebook was launched in 2004 by Mark Zuckerberg and friends. By 2017,
    Facebook had 1.9 billion users, sharing their opinions, activities and photos.
    Today, some people may speak face to face with just one or two people a day, but
    ''speak'' to hundreds or even thousands online. Although we may feel more connected
    than before, perhaps some of us are lonelier. Are our online ''friends'' real
    friends? How can we tell if they are who they appear to be?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_46_0.png)


    # MATHS TALK


    In 1950, there were just a handful of computers in the world. Today, around 350
    million desktop and laptop computers are sold every year. In addition, at least
    900 million smartphones are bought, as well as 200 million tablets.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_46_1.png)'
  merge: -1
