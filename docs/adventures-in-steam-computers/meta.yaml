    \ 仅读存储器；存储程序。\n\n**搜索引擎（search engine）** 搜索网站的程序。\n\n**传感器（sensors）** 对光、声音或其他属性有响应的设备。\n\
    \n**社交网络（social networking）** 允许人们与其他建立联系的网站。\n\n**软件（software）** 计算机使用的程序。\n\n\
    **网页（web）** 全球性的超文本网络，通过互联网访问。\n\n**摄像头（webcam）** 可以发送图像或视频的摄像。\n\n## 延伸阅读\n\n\
