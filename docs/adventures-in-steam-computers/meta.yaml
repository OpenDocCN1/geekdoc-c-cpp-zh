  - '[PAGE 26]


    # HERMAN HOLLERITH (1860-1929)


    US inventor Herman Hollerith invented the punched-card tabulator, an electrical
    machine that recorded and sorted information. This was a breakthrough in data
    processing. The idea was that any piece of information could be recorded by a
    hole punched in a card. If a particular area on the card represented gender, for
    example, a hole there could mean ''male''. The system was initially used for recording
    information about the population for the United States Census Office.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_0.png)


    # ALAN TURING (1912-1954)


    The English scientist Alan Turing developed many of our ideas about how computers
    might work, although his ''Turing machine'' was only a very complex idea, not
    a real machine. In particular, he studied how a future electronic computer might
    be controlled by strings of binary numbers. He predicted that computers would
    one day be able to think like humans, which we call artificial intelligence. Today,
    Turing is also remembered for being persecuted for being gay.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_1.png)


    # JOHN MAUCHLY (1907-1980) AND J. PRESPER EERT (1919-1995)


    US inventors built the first general-purpose electronic digital computer, called
    ENIAC (Electronic Numerical Integrator and Calculator), in 1946. Its input, output
    and memory storage were in the form of punched cards. It could multiply two 10-digit
    numbers 357 times in a second. ENIAC took up 167 square metres of floor space
    and weighed 30 tons!


    ![](img/50ab3428eb54bad681a3964413b0d4f4_26_2.png)'
  - '[PAGE 27]


    # THERE ARE THOUSANDS OF SOFTWARE PROGRAMS,


    ![](img/50ab3428eb54bad681a3964413b0d4f4_27_0.png)


    A key piece of software is a computer''s operating system. This controls the computer''s
    basic functions and how other software uses the CPU and memory. It interprets
    inputs, turning them into 1s and 0s. Microsoft Windows is the most common operating
    system for desktop computers. Many mobile devices, such as tablets and smartphones,
    run the Android operating system. However, Apple Macintosh desktop computers run
    the Mac OS operating system, and mobile devices run iOS.


    > ART TALK

    Modern operating systems communicate with the user through a graphical user interface
    (GUI). They were first developed in the early 1980s. A GUI is the system of drop-down
    menus, docks and icons that you click on to tell the computer to perform different
    tasks. We tend to take GUIs for granted, but look more closely to see how cleverly
    designed they are. Many functions are shown in pictures rather than words. Today,
    children learn to understand GUIs in much the same way as they learn to read.


    Examine the GUI on your personal computer. Would you change its design if you
    could, or does it already work perfectly?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_27_1.png)'
  - '[PAGE 28]


    # BUT HOW MANY DO YOU USE REGULARLY?


    # HOUSEHOLD SOFTWARE


    The software on your computer may include a word-processing program for typing
    documents, an email program, a web browser for reading websites, and media players
    for playing music and videos. Anti-virus software prevents your computer being
    damaged by dangerous software, called viruses, that travel from computer to computer
    over the Internet.


    # PROFESSIONAL SOFTWARE


    Many programs were created to help people perform their jobs more easily. These
    include programs for creating presentations or spreadsheets, design programs in
    2D or 3D, website design programs, and programs for creating animations.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_28_0.png)


    Software is designed for a particular purpose and a particular ''platform'', meaning
    the type of computer or operating system. For example, some software is designed
    specially for mobile devices such as smartphones and tablets. These programs are
    called apps, short for applications. The first app store, selling apps online,
    opened in 2008. One very successful app is the game Candy Crush Saga, which has
    been downloaded over 500 million times.


    > TECHNOLOGY TALK'
  - '[PAGE 29]


    # IMAGES THAT ARE CREATED ON A COMPUTER ARE


    # GRAPHICS


    THE EARLIEST PERSONAL COMPUTERS COULD DISPLAY ONLY ONE-COLOUR TEXT AND NUMBERS.
    DEVELOPMENTS IN COMPUTERS HAVE LED TO MORE REALISTIC AND EXCITING GRAPHICS.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_29_0.png)


    By the 1980s, personal computers were beginning to have full-colour screens. By
    the 1990s, faster processing speeds were making graphics quicker to create. Alongside
    these developments came changes in photography, with photos stored on computers
    rather than film Today, software developers have written many programs for creating
    graphics and editing photos. There are two main types of graphics:


    In this, 1980s bitmap graphic it is possible to see the separate pixels


    BITMAP GRAPHICS Pictures are made up of pixels of different colours. Many artworks
    are bitmaps, as well as photographs taken on a digital camera.


    VECTOR GRAPHICS Pictures are made up of lines and shapes. Vectors can be enlarged
    without the separate pixels becoming visible. Logos are often created using vector
    graphics.


    # PROJECT


    Try out a bitmap graphics program. If you''re using a Windows desktop computer,
    try the free program Microsoft Paint. On a Mac, try Paint X Lite.


    +   - Create a pattern using squares and circles of different sizes. To do this,
    you will need to find the ''Rectangle'' and ''Ellipse'' tools.


    +   - Find the ''Fill'' tool, then fill the shapes with different colours by clicking
    in them. Now print out your design.


    RECTANGLE TOOL


    ELLIPSE TOOL


    FILL TOOL


    ![](img/50ab3428eb54bad681a3964413b0d4f4_29_1.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_29_2.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_29_3.png)'
  - '[PAGE 30]


    # CALLED COMPUTER GRAPHICS.


    The term computer-generated imagery (CGI) is used to describe the 3D graphics
    created for video games, films and TV shows. Outside the world of entertainment,
    CGI is also employed by architects and engineers to design structures. To create
    a CGI character or building, the artist builds it from a mesh of lines. A surface,
    colour and texture are added to the mesh. Then the character or building can be
    manipulated and seen from different angles, without redrawing it. CGI is created
    using a combination of bitmaps and vectors.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_30_0.png)


    CGI can make extinct creatures, giant armies and alien planets look real!


    # THINKING OUTSIDE THE BOX!


    In the early 1990s, animators at the company Pixar wanted to make a film entirely
    using CGI. This had never been done before. The problem was that CGI was not yet
    so advanced that it could show the range of facial expressions and movements that
    make humans appear human. To solve the problem, the film-makers had a great idea:
    to make a children''s film with toys as the characters. The result was Toy Story,
    released in 1995.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_30_1.png)'
  - '[PAGE 31]


    # THE FIRST COMPUTER GAME, CALLED SPACEWEAR!


    COMPUTER GAMES HAVE BECOME INCREASINGLY REALISTIC, WITH FAST-MOVING GRAPHICS AND
    ATMOSPHERIC SOUND EFFECTS. GAMES CAN BE PLAYED ON A RANGE OF PLATFORMS, FROM GAMES
    CONSOLES TO SMARTPHONES.


    Computer games first became popular in the 1970s. They were usually played on
    coin-operated machines in arcades. An arcade machine has a video game computer,
    a screen, speakers and a game controller, in the form of a joystick, wheel or
    buttons. A games console is a computer specially made for playing games. They
    can be hand-held devices with a built-screen. Home games consoles are larger and
    are usually connected to a television screen. Although consoles first appeared
    in 1966, it was at least another decade before they became widespread. An early
    popular console was the hand-held Game Boy®, released in 1989.


    Across the world, the video game industry makes around £90 billion every year.
    At present, more than half this money is earned from sales of games consoles and
    their games. Games bought for playing personal computers earn about a quarter
    of the money. Games played on smartphones make more than £20 million every year,
    and they are getting more popular.


    In the 1980s, Pac-Man was one of the most successful arcade games.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_31_0.png)'
- md: '

    # WAS CREATED IN 1962.


    Most home games consoles have hand-held controllers as input, with buttons or
    joysticks for controlling movement in the game. Some game controllers, such as
    the Wii remote, contain motion sensors. Another common input device is a touch-sensitive
    mat for use in dancing games. With some consoles, the player does not have to
    touch an input device at all. For example, the Xbox 360 uses a Kinect camera to
    detect the player''s movements.


    The Kinect input device responds to motion and spoken commands.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_32_0.png)


    ## ART TALK


    Many popular games offer virtual worlds, where players can interact with other
    players. The player chooses an avatar, a sprite that represents them in the world.
    Often the avatar can be designed by the player to look like themselves, or to
    be strange and surprising. In an ordinary game, the graphic backgrounds may be
    realistic or beautiful, but in a virtual world they are designed as a key part
    of the player''s enjoyment and interaction with the game. Popular virtual worlds
    include Minecraft and Second Life.


    In Minecraft, a player can design their own houses, parks and cities.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_32_1.png)


    ## THE EARLIEST COMPUTERS FILLED A WHOLE ROOM. AS A RESULT, THEY COULD BE USED
    ONLY BY GOVERNMENTS AND LARGE ORGANISATIONS. A SERIES OF BREAKTHROUGHS LED TO
    THE DEVELOPMENT OF TODAY''S PERSONAL COMPUTERS, WHICH ARE FOUND IN OFFICES, HOMES
    AND POCKETS.


    ## HALL OF FAME: PERSONAL COMPUTERS


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_0.png)


    ## APPLE II, 1977


    This was one of the first ready-to-use personal computers with a microprocessor.
    It was designed by Steve Wozniak and Steve Jobs, co-founders of the Apple computer
    company. The Apple II was initially sold for US$1,298, which is equivalent to
    about £4,000 in today''s money.


    ## MOUSE, 1963


    The mouse was invented by US computer engineers Douglas Engelbart and William
    English in 1963. The first mouse had a wooden shell, a circuit board and two metal
    wheels. Nine years later, English developed the design by replacing the wheels
    with a ball that could monitor movement in any direction. In 1973, the Xerox Alto
    was the first desktop computer to be used with a mouse.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_33_1.png)


    ## SMARTPHONE, 1994


    1994, the IBM Simon was the first mobile phone to also run software, and had a
    touchscreen used with a stylus. Applications included an address book, calendar,
    calculator, clock and electronic note pad. Simon could also send and receive emails.
    It was three years later, in 1997, that the first smartphones were given web browsers
    for searching the web.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_0.png)

    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_1.png)


    ## IPAD, 2010


    Tablet-style computers have been available since the early years of the 21st century,
    but they did not become truly popular until Apple launched the iPad in 2010. The
    iPad''s success is due to its many built-in functions, such as wireless Internet
    connection, camera and music library.


    ## GOOGLE GLASS, 2013


    This wearable computer featured a screen and camera. It accepted inputs from voice
    commands and a touchpad on the side. Google Glass was withdrawn from sale after
    a year, partly because people were worried about being secretly filmed. However,
    the future of computing may still lie in wearable devices.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_34_2.png)


    ## A NETWORK CONNECTS COMPUTERS ACROSS THE ROOM,


    ## NETWORKS


    THE EARLIEST NETWORKS USED WIRES TO CONNECT THE COMPUTERS... IN A BUILDING. TODAY,
    THE INTERNET IS A VAST COMPUTER NETWORK COVERING THE WHOLE WORLD.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_0.png)


    Networks are a way of sharing data and other resources. Wired networks are created
    by copper wires or optical fibres. Many homes are connected by copper wires, along
    which data is sent as electrical signals. Most new networks use optical fibres,
    along which data travels as pulses of light. Optical fibre networks carry data
    much faster than copper wire.


    ### LOCAL AREA NETWORKS

    Small networks connect computers and printers within schools and offices.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_1.png)


    ### WIDE AREA NETWORKS

    Wide area networks link computers across cities, countries and the world.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_35_2.png)


    ## CITY OR PLANET.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_36_0.png)


    People often use the words ''web'' and ''Internet'' to mean the same thing. In
    fact, the Internet is a global network, made up of cables, satellites and wireless
    connections. The end of a web address, called its suffix, can tell something about
    the organisation that runs it, for example:


    | Suffix | Meaning |

    | :--- | :--- |

    | .co.uk | created by a UK business |

    | .org | created by a charity |

    | .gov | hosted by a government |


    ## THE WEB


    A website is a document stored on a computer. Websites can contain words, images
    and videos. The web was invented by computer scientist Tim Berners-Lee in 1989.
    We view websites using software called a browser. HTML Hypertext Markup Language.
    Popular browsers are Google Chrome and Internet Explorer. When we click a link,
    we move to another website. The browser sends a request to the computer storing
    the website. The browser returns the data via the Internet.


    ## TECHNOLOGY TALK


    All addresses start with ''http'', which stands for Hypertext Transfer Protocol.
    Most web addresses have ''www'', which stand for World Wide Web. The Internet
    is a way of exchanging data. On a smaller scale, it covers a building. On a larger
    scale, it covers the world. The country with the highest percentage of Internet
    users is Iceland. The country with the lowest is Eritrea.


    ## THINKING OUT THE BOX!


    The World Wide Web opens up huge possibilities for knowledge and communication.
    However, when we are using the web, it is important to think about how we do it.
    Anyone can create a website containing information that is false or harmful. When
    we use websites that allow us to communicate directly with other people, often
    called social networking, we need to think about how we behave and watch out for
    others behave. Since the web is created by people, it can only be as good as or
    as bad as the people who use it.

    '
