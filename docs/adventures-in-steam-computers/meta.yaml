  md: '# ANYONE CAN HAVE A GO AT WRITING THEIR OWN


    # PROGRAMMING


    A PROGRAM IS AN ORDERED SET OF INSTRUCTIONS. COMPUTER PROGRAMMERS WRITE THEIR
