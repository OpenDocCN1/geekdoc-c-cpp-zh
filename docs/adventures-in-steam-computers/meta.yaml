  md: '# COMPUTERS HAVE NEVER STOPPED DEVELOPING AND


    # FUTURE COMPUTERS


    SINCE THE FIRST ELECTRONIC DIGITAL COMPUTERS WERE BUILT 70 YEARS AGO, COMPUTERS
    HAVE BECOME MUCH SMALLER AND FASTER. HOW WILL COMPUTERS CHANGE IN THE NEXT 70
    YEARS?


    Computers will probably continue to get faster. However, many people think the
    current method of computing, using electrical circuits in chips of silicon, will
    have to be abandoned to make that happen. Ideas for new computing methods are
    being developed:


    +   * QUANTUM COMPUTERS could use tiny natural particles to store and process
    data.


    +   * CHEMICAL COMPUTERS could use mixtures of chemicals to perform calculations
    through their reactions with each other.


    +   * OPTICAL COMPUTERS could use lights, which would turn on and off in a way
    similar to the electric currents in today''s computers.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_47_0.png)


    > Some of the devices in our homes hold tiny computers which communicate with
    other devices using the Internet, creating the ''Internet of Things''. These connected
    devices are called ''smart'': We already have smart heating systems and smart
    kettles that are turned on using smartphones, and smart fridges that reorder food.
    In future, entire homes may be smart, with baths that run themselves at battime,
    and bedrooms that construct themselves at bedtime.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# CHANGING - AND THEY NEVER WILL.


    In the future, we may not use physical (''real'') devices, such as laptops or
    smartphones. The ''devices'' we use will be our own digital identity, unique to
    us, perhaps a name or number. Using that identity, we would access computing systems
    through non-physical portals (or ''doorways''), which have yet to be invented.
    Perhaps data would be viewed using a form of augmented reality.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_1.png)


    # THINKING OUTSIDE THE BOX!


    Another possible method of future computing involves integrated nano-electronics.
    ''Integrated'' means ''linked in and ''nano'' means ''tiny''. This method of computing
    could work directly from our brain signals, which travel along our nerves as tiny
    electrical signals. When you wanted to use your computer, which might be worn
    or implanted in your skin, you would think ''switch on'' rather than pressing
    the ''on'' switch. This sounds like science fiction, but smartphones would have
    sounded just as far-fetched to someone living in the early 20th century.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_2.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_48_3.png)'
