    ## VIRTUAL REALITY (VR) IS CHANGING THE WAY WE

    ## VIRTUAL REALITY


    VIRTUAL MEANS ‘ALMOST’. VIRTUAL REALITY IS WHEN A COMPUTER CREATES A WORLD THAT
    APPEARS TO BE RIGHT IN FRONT OF YOU, BUT IT IS REALLY ONLY THE PRODUCT OF A PROGRAM.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_39_0.png)


    Rather than viewing virtual reality on a screen, it is viewed through a headset.
    In gaming, virtual reality headsets allow the player to feel as if they are completely
    in the world of the game. Motion sensors in the headset pick up on head movements
    and the program changes the view to match the movements. Virtual reality gloves
    and body suits give the feeling of touching something in the virtual world by
    applying slight pressure to the skin.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_39_1.png)


    ## ART TALK


    Augmented reality (AR) can be found in software for mobile computer devices, such
    as smartphones and tablets. Augmented reality is different from virtual reality:
    it offers a view of the real world through the device''s camera, with added features,
    such as useful or entertaining graphics, sounds or text. The game Pokémon Go,
    released in 2016, features virtual creatures who appear on screen as if in the
    real world. Players must locate them. A drawback of augmented reality is that
    users can be distracted from taking care in the real world! In 2016, two men playing
    Pokémon Go walked off a cliff. Luckily, they were not badly hurt.


    ## LEARN, PLAY AND WORK.

    ## THINKING OUTSIDE THE BOX!


    Although virtual reality is most commonly used in games, it is also used in some
    workplaces. Its technology can be helpful for training soldiers, who experience
    the feeling of being in battle without putting themselves at risk. Surgeons are
    also able to train using virtual reality, giving them a lifelike experience of
    performing surgery without the need for a human being.


    Can you think of other jobs or activities for which virtual reality would be useful?
    What about situations where augmented reality could offer helpful features? Consider
    the worlds of education, construction, shopping, transport and government.


    - This soldier is learning how to make a parachute jump using a virtual reality
    program.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_1.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_40_2.png)


    ## ARTIFICIAL INTELLIGENCE (AI) IS WHEN COMPUTER

    ## ARTIFICIAL INTELLIGENCE


    AT PRESENT, MOST PERSONAL COMPUTERS ONLY DO EXACTLY WHAT WE TELL THEM. HOWEVER,
    SOME COMPUTERS ARE PROGRAMMED TO ‘THINK FOR THEMSELVES’, LIKE A HUMAN DOES. THESE
    COMPUTERS ARE SAID TO HAVE ARTIFICIAL INTELLIGENCE.


    Computers just do whatever they are told by their programs. AI itself is created
    by programming. AI programs use mathematical algorithms to allow a computer to
    decide between different responses to a question. These programs also allow the
    computer to ‘learn’ from past events. This is accomplished through algorithms:
    if action A produces this result, but action B produces a better result, in future
    action B will be chosen.


    ## THINKING OUTSIDE THE BOX!


    Computers and robots with AI have featured in fiction since 1920, when the Czech
    writer Karel Čapek wrote a play about robots rebelling against their human masters.
    Countless other books, films and TV shows have focussed on the dangers of computers
    thinking for themselves, including the 2004 film I, Robot and the 2015 children’s
    TV show Eve. Why do you think humans are both fascinated and worried by AI?


    - The robot Nao contains a computer that runs AI programs.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_41_0.png)


    ## SEEM TO THINK FOR THEMSELVES.


    In 1950, Alan Turing (see page 23) developed a test to judge a computer''s ability
    to think like a human. The Turing test has a human tester holding two ''conversations'',
    one with a human and one with a computer, using a keyboard and screen so the tester
    cannot see ''who'' they are talking with. The tester must judge which is the human
    and which the computer. In 2014, a computer called Eugene Goostman passed the
    test for the first time.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_0.png)


    The Turing test, a computer does not have to give correct answers, only the answers
    that a human would give.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_1.png)


    ## PROJECT


    Intelligent personal assistants (IPAs) are programs that perform services for
    the user: for example, answering questions and booking restaurant tables using
    the web. Most IPAs use speech recognition. Some personal assistants, such as Siri
    or Alexa, can be found on smartphones.


    - How can I help?

    - What makes the IPA human?

    - What makes the IPA smart?


    ![](img/50ab3428eb54bad681a3964413b0d4f4_42_2.png)


    ## THESE COMPUTERS MIGHT CHANGE IDEAS ABOUT WHAT A COMPUTER IS

    ## HALL OF FAME: ALMA


    The ALMA (Atacama Large Millimeter/submillimeter Array) is a telescope in Chile.
    The correlator combines signals from many antennas to create images. This supercomputer
    performs 2 quadrillion operations per second.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_0.png)


    ## RASBERRY PI


    The Raspberry Pi is a small computer that costs less than £25. It is used in schools
    for teaching computing. It contains a CPU and is used for programming.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_43_1.png)


    ## VOYAGER I


    The space probe Voyager I is the furthest man-made object from Earth. It was launched
    in 1977 and passed the solar system. It sends data using the Deep Space Network.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_0.png)


    ## PACEMAKER


    A pacemaker is a small electronic device that is placed inside the human chest
    to monitor and control heart problems. It uses electric pulses to keep the heart
    working normally. These machines save hundreds of lives every day.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_44_1.png)


    ## GOOGLE


    Google is not just one computer but a network of around 900,000 powerful computers
    in Google''s data centres. These computers allow the world''s estimated 1.1 billion
    users to search the web. Google can be seen as the world''s largest computer,
    or computer cluster.


    ## A CHANGED PLANET

    SINCE THE MIDDLE OF THE 20TH CENTURY


    Before computers became common in offices, many typists and clerks were employed
    to type letters and documents on mechanical typewriters, or draw graphs and tables
    with pencils and paper. Before the first robot was put to work in a factory in
    1961, factories employed millions of workers for manual tasks. Today, there are
    more than 1.6 million industrial robots.


    ## THINKING OUTSIDE THE BOX!


    Workers no longer have to be in the workplace throughout the day. With email,
    workers can be anywhere with an Internet connection. Webcams allow meetings to
    take place without everyone being in the room ''Telepresence'' robots take this
    step further. Using sensors, microphones and cameras, a worker who is far away
    can speak and see through a robot in the workplace, as if they are present. Telepresence
    robots are now used in education, for giving lessons in remote schools or teaching
    children who are in hospital.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_45_0.png)

