    BY PLUGGING IN AN EXTERNAL MEMORY DEVICE.


    Hard disks save data onto a spinning disk. When the data is needed again, the
    moving arm goes straight to the correct area of the disk.


    +   - ROM

    The ’read only memory’ stores programs and data even when the computer is off.
    The computer’s user cannot save anything to the ROM.


    +   - RAM

    The ’andom access memory’ is where data is stored while the user is working. When
    the user turns off the computer, the data is lost — unless it is saved to the
    hard disk first!


    +   - HARD DISK

    Hard disks are found in desktop computers, but some tablets use memory chips instead.
    The hard disk is where the user can store programs and files. Files are blocks
    of data, such as a letter or a photo.


