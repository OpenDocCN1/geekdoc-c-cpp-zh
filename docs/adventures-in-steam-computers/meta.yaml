  md: '# INPUTS


    YOU ARE PROBABLY FAMILIAR WITH USING INPUT DEVICES SUCH AS KEYBOARDS, MICE AND
    TOUCHSCENS. THERE ARE ALSO MANY OTHER DEVICES AND SENSORS THAT CAN GIVE A COMPUTER
    INFORMATION.


    **KEYBOARDS** On a computer keyboard, each key is a switch that sends an electronic
    signal to the computer. The computer''s software is able to interpret the different
    key presses.


    **SCANNERS** Scanners are used to capture images of photos or paper documents
    placed in the machine. A colour scanner registers how much red, green and blue
    (the primary colours) are in each tiny portion of the image. The scanner then
    converts this information into digital form.


    **MICE** Usually, mice shine a bright light onto your desk, some of which reflects
    back off the desk into a sensor. As the mouse moves, the pattern of reflected
    light changes.


    **BARCODE READERS** These input devices read the barcodes that label goods. Barcodes
    are patterns of black and white lines that represent numbers. A light sensor shines
    a beam of light on the barcode and measures the reflected light. Black reflects
    less light than white. The reader translates the pattern into binary digits: black
    is 0, and white is 1.


    ![](img/50ab3428eb54bad681a3964413b0d4f4_19_0.png)


    ![](img/50ab3428eb54bad681a3964413b0d4f4_19_1.png)'
