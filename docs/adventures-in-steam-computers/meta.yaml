  md: '# CALLED COMPUTER GRAPHICS.


    The term computer-generated imagery (CGI) is used to describe the 3D graphics
    created for video games, films and TV shows. Outside the world of entertainment,
    CGI is also employed by architects and engineers to design structures. To create
    a CGI character or building, the artist builds it from a mesh of lines. A surface,
    colour and texture are added to the mesh. Then the character or building can be
    manipulated and seen from different angles, without redrawing it. CGI is created
    using a combination of bitmaps and vectors.


