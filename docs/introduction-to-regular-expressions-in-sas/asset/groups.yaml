    ## 28 Introduction to Regular Expressions in SAS


    **Note:** Be mindful not to type a space after the comma inside the curly braces.
    It is easy to do out of habit, but it will wreck our pattern!


    ## Greedy n to m Times


    The modifier {n,m} creates a match at least n, but not more than m times. Creating
    a match with a specified range is quite useful for ensuring data quality standards
    are being maintained. When extracting semi-structured data elements such as ZIP
    codes, birthdates, and phone numbers, it is important to maintain a certain level
    of flexibility while also ensuring that the source is within tolerances. For instance,
    a two-digit year might be created in lieu of a four-digit year, but a four-digit
    zip would be unacceptable. Table 2.29 provides examples.


    ### Table 2.29: Examples using {n,m}


    | Usage | Matches |

    | :--- | :--- |

    | /(1-)?\d\d\d{3,3}-\d{4,4}/ | "1-800-123-4567" ... |

    | /\d{1,2]-\d{1,2}-\d{2,4}/ | "10-20-1950" "8-30-52" "4-3-1979"... |

    | /Was{1,7}/ | "Washington" "Wash" "Waste" "Washing"... |


    **Note:** As you can see in the examples above, the {n,m} might not always be
    the best choice of modifier, but these examples are meant to demonstrate the flexibility
    of implementation. For instance, the year in the second example is allowed to
    be three digits with this usage. Using an OR clause with the {n} modifier is a
    simple fix.


    ## Introduction to Lazy Repetition Modifiers


    Now that you are familiar with greedy modifiers, let''s begin examining the lazy
    ones. In terms of syntax, they differ from the greedy modifiers only by the addition
    of a question mark (?). By adding the question mark immediately after each of
    the greedy modifiers, we are able to subtly change their behavior—sometimes in
    unexpected ways.


    In general, lazy modifiers are used to avoid overmatching and improve performance
    when compared to greedy modifiers. There are situations when matching with greedy
    modifiers would lead to grabbing too much information, or simply slowing down
    performance. For instance, processing semi-structured text files like HTML or
    XML is a great example of when lazy modifiers would come in handy.


    ## Lazy 0 or More


    The modifier {*} creates a match 0 or more times, but as few times as necessary
    to create the match. In some situations, it creates the same matches as the greedy
    modifier. However, in other cases, the results are very different. To make it
    clearer, Table 2.30 describes the details of a few examples.


    ### Table 2.30: Examples using *?


    | Usage | Matches | Notes |

    | :--- | :--- | :--- |

    | /Sing\w*?/ | “Sing” | This matches only the word “Sing” because the modifier
    is given the option to match nothing. And since it is lazy, it will take that
    option every time, regardless of whether a word character immediately follows
    the “g” in “Sing”. |

    | /Sing\w*?/s | “Singing” ... | Comparing this to the example above, you see that
    the \s on the pattern creates additional matches. The \s forces the pattern to
    continue searching for a match that includes white space. This could be “Sing”
    or other combinations (similar to the greedy outcomes). |

    | /(ha)*?/ | | This example demonstrates why we need to be careful with lazy modifiers.
    Even when “ha” is ignored, again again because the modifier has the option to
    do so. The greedy version of this would match as many times as the word “ha” occurred
    back-to-back, with a minimum of zero times. |


    ## Lazy 1 or More


    The modifier + creates a match 1 or more times, but as few times as necessary
    to create a match. Again, if it is possible, this matches only once. Table 2.31
    provides examples.


    ### Table 2.31: Examples using +?


    | Usage | Matches | Notes |

    | :--- | :--- | :--- |

    | /Sing\w+?/ | “Singi” | This matches only “Sing” plus exactly one word character
    following the “g”. Again, by giving the lazy modifier an option to match the minimum,
    it will do so every time |

    | /Sing\w+?/s | “Singing” ... | Again, we see that adding the \s on the pattern
    creates additional matches. The \s forces the pattern to continue searching for
    a match that includes white space. This could be “Sing” or other combinations
    (similar to the greedy outcomes). |

    | /(ha)+/ | “ha” | This example is less of a cautionary tale than *?. But it might
    still provide undesirable results. Even when “ha” exists numerous times back-to-back,
    it matches only the first time, unless an additional match element follows it.
    Again, this is because the modifier has the option to match only once. The greedy
    version of this would match as many times as the word “ha” occurred back-to-back,
    with a minimum of once. |


    ## Lazy 0 or 1 Times


    The modifier ?? creates a match 0 or 1 times, but as few as necessary to create
    a match. Unless forced, this modifier will match 0 times. Table 2.32 provides
    examples.


    ### Table 2.32: Examples using ??


    | Usage | Matches |

    | :--- | :--- |

    | /Sing\w??/ | "Sing" | This matches only "Sing" because the modifier is given
    the option to match nothing. And since it is lazy, it will take that option every
    time, regardless of whether a word character immediately follows the “g” in “Sing”.
    |

    | /Sing\w??/s | "Singing" ... | Comparing this to the example above, you see that
    the \s on the pattern creates additional matches. The \s forces the pattern to
    continue searching for a match that includes white space. This could be “Sing”
    or other combinations (similar to the greedy outcomes). |

    | /(ha)?? | | This example demonstrates why we need to be careful with lazy modifiers.
    Even when “ha” is ignored, again again because the modifier has the option to
    do so. The greedy version of this would match as many times as the word “ha” occurred
    back-to-back, with a minimum of zero times. |


    ## Lazy {n} Times


    The modifier {n}? matches exactly n times. This functions like many the other
    lazy modifiers, but it sets a fixed number of matches. Table 2.33 provides examples.


    ### Table 2.33: Examples using {n}?


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-\d{3,3}-\d{4,4}/ | "1-800-123-4567" |

    | /\d{1,2}-\d{1,2}-\d{2,4}/ | "10-20-1950" "8-30-52" "4-3-1979" |

    | /R\w{4}?/ | "Round" ... |


    ## Lazy n or More


    The modifier {n,?} creates a match at least n times, but as few times as necessary
    to create the match. It functions like many the other lazy modifiers discussed
    far, but it sets a cap on how many times it can match. Table 2.34 provides examples.


    ### Table 2.34: Examples using {n,?}


    | Usage | Matches | Notes |

    | :--- | :--- | :--- |

    | /Sing\w{3,}?/ | “Singing” ... | This matches exactly n=3 times. Again, by giving
    the lazy modifier option to match the minimum, it will do so every time. |

    | /0{2,5,?}/s | “0000” ... | Again, we see that adding the \s on the pattern creates
    additional matches. The \s forces the pattern to continue searching for a match
    that includes white space. |

    | /(ha{4,}?/ | “hahaha” | This matches exactly n=4 times. |


    ## Lazy n m Times


    The modifier {n,m}? creates a match at least n times, but no more than m times—as
    few times in that range as necessary to create the match. It functions like many
    the other lazy modifiers discussed far, but it sets a cap on how many times it
    can match. Table 2.35 provides examples.


    ### Table 2.35: Examples using {n,m}?


    | Usage | Matches | Notes |

    | :--- | :--- | :--- |

    | /Read\w{1,3,?}/ | “Ready” ... | This matches exactly n=1 time. Again, by giving
    the lazy modifier option to match the minimum, it will do so every time. |

    | /0{2,5,?}/s | “0000” ... | Again, the pattern is "anchored" to the first occurrence
    of a 0, capturing the minimum if it exists, up to the maximum. |

    | \sha(ha){0,6}? | “ha” | By not having anything after the "anchor" point for
    the pattern to match on, there is nothing for additional matching. The lazy modifier
    just stops after the minimum of n=0. |

