    \    Call PRXCHANGE(RegEx ID, -1, text, text, length, trunc_val,\n    num_changes);\n\
    \    put text=;\nrun;\n\nproc print data=changed;\nrun;\n```\n\n# Simple Insert\
    \ Results\n\nAs we can see in the results below, the phone numbers have been redacted\
    \ in the original text by using the value *REDACTED*. The rest of the data set\
    \ shows our optional variable values. Length is the total length of the string\
    \ written to Text (we just back to the old string). trunc is 0 for every row because\
    \ the inserted value is no longer than the original phone numbers. In fact, lines\
    \ 1, 5, and 7 shrink because the inserted content is shorter. Finally, num_changes\
    \ records the number of times the phone numbers were redacted on each line (multiple\
