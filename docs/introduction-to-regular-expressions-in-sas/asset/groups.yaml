    # Chapter 2: Getting Started with Regular Expressions 23


    # 2.5 Modifiers


    There are two significant things that you probably notice missing from the previous
    sections, which are worth further discussion here. First, all of the applicable
    metacharacters thus far have ignored letter case. In other words, w, \S \D, and
    all match a letter regardless of whether it is lowercase or uppercase. However,
    there are situations in which the case of a letter becomes important, but the
    letter itself is not known in advance.


    Second, we can use a single character as many times as we like, which creates
    additional fuzziness for our matches. However, there is a downside to just typing
    out: each occurrence must exist in order to match the pattern. For instance, if
    the source text for the \D examples above contained "19thStreet" with no spaces,
    we''d never find it by using \D three times. And since the primary goal of RegEx
    capability is to have automated text processing, we need a robust way to make
    this kind of matching more flexible.


    Over the next two subsections (2.5.1 and 2.5.2), we will work through ways to
    overcome these limitations by using modifiers. There are two types of modifiers,
    case modifiers and repetition modifiers. Combining them gives us significant robustness
    and flexibility in real-world RegEx implementations, and should be considered
    as fundamental to real-world implementations as the metacharacters that we have
    discussed this far.


    # 2.5.1 Case Modifiers


    When performing matches on text, there is the obvious consideration of letter
    case (upper vs lower). Although I have already introduced a rudimentary way to
    handle this in situations where the letter is known, there must be a methodology
    for accounting for letter case when it is unknown. This section discusses a variety
    of approaches to dealing with case matching. Depending on the situation, some
    approaches are more convenient than others, while not necessarily being right
    or wrong.


    # Lowercase


    The metacharacter \ matches when the next character in a pattern is lowercase.
    This metacharacter applies only to characters (metacharacters,groups,and so on
    do not work). In practice, it is more practical to simply type the lowercase version
    of the desired character value, or provide a list of lowercase letters to match.
    Table 2.19 examples using


    | Usage | Matches |

    | --- | --- |

    | |Street/ | "street" ... |

    | \sIS\IA\sInstitute/ | "sas Institute" ... |

    | /(IS|IF)leet/ | "fleet" ... |'
- md: '

    # 24 Introduction to Regular Expressions SAS


    ## Uppercase


    The metacharacter \U matches the next letter in a pattern is uppercase. It functions
    exactly as the lowercase version introduced above (\l), but also applies to uppercase.
    Table 2.20 provides examples.


    ### Table 2.20: Examples using \U


    | Usage | Matches |

    | :--- | :--- |

    | \Uinc./ | "Inc." ... |

    | \Ustreet\St./ | "Street" "St." ... |

    | \Uave\|Uavenue,/ | "Ave." "Avenue," |


    ## Lowercase Range


    The metacharacter \L...\E matches all the characters between the \L and \E are
    lowercase. Strings typed between \L and \E are forced to match on lowercase only,
    even when they are typed as capital letters. Unlike the \metacharacter, L...\E
    can also contain character classes and repetition modifiers. Table 2.21 provides
    examples.


    ### Table 2.21: Examples using \L...\E


    | Usage | Matches |

    | :--- | :--- |

    | \L[a-z0-9][a-z0-9][a-z0-9]\E/ | "sas" "abc" "123" ... |

    | \LTHE ARE LOWERCASE\E/ | "these are lowercase" |

    | R\L[a-z][a-z]\E/ | "Read" "Road" "Rode" "Ride" "Real" ... |


    Note: When applying case to non-alphabetic characters, the modifier is ignored.
    It doesn''t affect the match.


    ## Uppercase Range


    The metacharacter \U...\E creates a match when all the characters between the
    \U and \E are uppercase. Again, this metacharacter functions the same way as the
    lowercase version discussed above, but applies to uppercase. This metacharacter
    can be useful for identifying acronyms or other text where capital letters are
    important. Table 2.22 provides examples.


    ### Table 2.22: Examples using \U...\E


    | Usage | Matches |

    | :--- | :--- |

    | \U[a-z][a-z][a-z]\E/ | "SAS" "CIA" ... |

    | \U[a-z][a-z][a-z]\E\Institute\sInc\W/ | "SAS Institute Inc." ... |

    | \Uallcaps\E/ | "ALLCAPS " |


    # Chapter 2: Getting Started with Regular Expressions


    **Note**: Notice that other metacharacters are not allowed inside \L...E or \U...E
    metacharacters. In other words, \w can''t be used to replace the character classes
    above.


    ## Quote Range


    The metacharacter \Q...E match all content inside the \Q and \E as character strings,
    disabling everything including the backslash character. Metacharacters cannot
    be used inside ''\Q...E''. The functionality provided by this metacharacter is
    great for searching within strings that contain a significant number of reserved
    characters, such as XML, webserver logs, or HTML. Table 2.23 provides examples.


    | Usage | Matches |

    | :--- | :--- |

    | \Q<html name>\E/ | "<html name>" |

    | \Q(fx!) + f(y) = z\E/ | "f(x) + f(y) = z" |

    | \Q<!DOCTYPE HTML> <html lang="en-US">\E/ | "<!DOCTYPE HTML> <html lang="en-US">
    |


    ## 2.5.2 Repetition Modifiers


    Repetition modifiers change the matching repetition behavior of the metacharacters
    and characters immediately preceding them in a pattern. They can also modify the
    matching repetition of an entire group—defined using () to surround the group
    of metacharacters and characters before the modifier. Just keep in mind that repetition
    of the entire group means that it repeats-to back (e.g., "haha") unless we also
    modify the individual metacharacters.


    Now, there are two types of repetition modifiers, *greedy* and *lazy*. Lazy modifiers
    attempt to find as few matches as possible within the confines of their definition.
    Greedy modifiers attempt to find as many matches as possible. They have similar
    uses, which can make the difference between their results subtle.


    ## Introduction to Greedy Repetition Modifiers


    Let''s start by discussing greedy modifiers because they are a little intuitive
    to use. As we go through the examples, it is important to keep in mind that greedy
    match as many times as possible—constantly searching for the last possible time
    match is still true. It is easy to create patterns that match differently from
    what you might expect.


    There is a concept in RegEx known as backtracking, which is the root cause for
    potential issues with greedy modifiers (hint: backtracking in the need for lazy
    modifiers). As we discuss further, a greedy modifier actually tries to maximize
    the matches of a pattern chunk. Upon failure, the system backtracks to the position
    where the chunk matched. Processing with backtracking for a single match is insignificant.
    However, as soon as we introduce a few additional factors, the problem can waste
    computing cycles (think loops), and large data sources.


    ## Greedy 0 or More


    The modifier * requires the immediately preceding character or metacharacter to
    match zero or more times enables us to generate unlimited matches within text.
    For example, we might want to match every occurrence of a word with all its prefixes
    and suffixes. By allowing the suffixes to be optional, we are able to achieve
    this goal. Table 2.24 provides examples.


    ### Table 2.24: Examples using *


    | Usage | Matches |

    | :--- | :--- |

    | /Sing\w*/ | "Sing" "Sings" "Singing" "Singers" ... |

    | /\D\w*/ | "DC" "D" "D C" ... |

    | /19D\w*/ | "19th Street" "19thStreet" ... |

    | /Hello\*/ | "Hell" "Hello" ... |


    ## Greedy 1 or More


    The modifier + requires the immediately preceding character or metacharacter to
    match 1 or more times. The plus sign works similarly to the asterisk modifier,
    with the exception that it enforces a match of at least 1 time. Table 2.25 provides
    examples.


    ### Table 2.25: Examples using +


    | Usage | Matches |

    | :--- | :--- |

    | /Ru\w+/ | "Run" "Ruin" "Runners" ... |

    | /R\L[a-z]+\E\s/ | "Words with all letters capitalized, and surrounded by spaces."
    -> (Wait, original says "Words with all letters capitalized, and surrounded by
    spaces.") |

    | /19D+\s/ | "19th Street" "19...Street" ... |

    | /(ha)+ | "hahahahahahaha" ... |


    Pay attention to the addition of \s metacharacter in the second example in Table
    2.24. If it were not, the pattern would also match single letters at the beginning
    of words. By adding \s, the pattern creates a whitespace character to immediately
    follow one or more characters.


    ## Greedy 0 or 1 Time


    The modifier ? creates a match of 0 or 1 time. The question mark provides the
    ability to make the occurrence of a metacharacter optional without allowing it
    to match multiple times. This can be effective matching word pairs that have inconsistent
    use of dashes or spaces (e.g., short-term vs short term). Table 2.26 provides
    examples.


    ### Table 2.26: Examples using ?


    | Usage | Matches |

    | :--- | :--- |

    | /\D?800\D?23\D?4567/ | "1-800-123-4567" "18001234567" ... |

    | /1560Wilson\sBlvd\W?/ | "1560 Wilson Blvd." "1560 Wilson Blvd" ... |

    | /19th?\s/ | "19th Street" "19th Street" ... |


    ## Greedy n Times


    The modifier {n} creates a match of exactly n times. Being able to match on exactly
    n times is the same as using that metacharacter out many times. However, from
    the perspective of coding and maintaining the RegEx patterns, using the modifier
    is a much better approach. It limits the opportunity to make typographical errors
    when initially creating the RegEx pattern, and it improves readability when later
    editing and sharing the patterns. Table 2.27 provides examples.


    ### Table 2.27: Examples using {n}


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{3}-d{4}/ | "1-800-123-4567" "1.800.123.4567" ... |

    | /Ru{4}/ | "Round" "Runts" "Ruins" ... |

    | /19D{3}Street/ | "19th Street" "19thStreet" "19...Street" ... |

    | /d{5,}-d{4}(d{5})/ | "12345-6789" "12345" ... |


    ## Greedy n or More


    The modifier {n,} creates a match at least n times. By ensuring that we can match
    at least n times, we are able to create functionality very similar to the plus
    modifier. However, we are raising the minimum number of times that the metacharacter
    must match. This is quite useful for certain applications, but must be handled
    with caution. Also, the ++ modifier can easily get very long strings of unanticipated
    matches due to a single logical error in pattern construction. Table 2.28 provides
    examples.


    ### Table 2.28: Examples using {n,}


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{1,-}-d{2}/ | "1-800-123-4567" "1-800-789-12" ... |

    | /d{3,}-d{2},-d{4}/ | "143-25-7689" "123456789-54654564-9820" ... |

    | /19D{3}Street/ | "19th Street" "19th, Not My Street" ... |

