    # 2.3 Basic Metacharacters


    As you write RegExp patterns in the future, you will find yourself using most
    of the metacharacters discussed in this section frequently because they are fundamental
    elements of RegExp pattern creation. Now, we can already build some useful patterns
    with the information discussed in Section 2.1. However,


    the metacharacters in this section create the greatest return on time investment
    due to flexible and powerful they can make RegEx patterns.


    Notice as we go through the examples how we can obtain some unexpected results.
    It is important to be very strategic when using some of these RegExp metacharacters
    as you don''t always know what to expect in the text that you are processing.
    When you know the source code, there are inevitably errors or unknown changes
    that can wreck poorly designed pattern. So, like any good analyst, you need to
    think a few steps ahead in order to maintain robust RegEx code.


    **Note:** Unlike SAS, all RegEx metacharacters are case sensitive, If a letter
    is defined here as lowercase or uppercase, then it MUST be that way. Otherwise,
    your programs will do something very different from what you expect. In other
    words, even though you can be lazy with capitalization when writing SAS code (e.g.,
    DATA vs. data), the same is not true here.


    # 2.3.1 Wildcard


    The wildcard metacharacter, which is a period (.), matches any single character
    value, except for a newline character (

    ). The ability to match virtually any single character can prove useful when you
    are searching for the superset of character strings. You might also want to use
    it when you have no idea what values might be in a particular character position.
    Table 2.3 provides examples.


    **Table 2.3: Examples using .**


    | Usage | Matches |

    |---|---|

    | /.rn/ | "Run" "R+n" "R n" "R(n)" "Ron" ... |

    | /.un/ | "Fun" "fun" "Run" "run" "bun" "(un" ... ... |

    | /Street/ | "Street," "Street," "Street+" "Street_ ... |


    **Note:** The period matches anything except the newline character (

    )—including itself. This can be helpful, but be used wisely. Also note, \n matches
    the newline character.


    # 2.3.2 Word


    The metacharacter \w matches any character value, which includes alphanumeric
    and underscore (\_) values. It matches any single letter (regardless of case),
    number, or underscore for a single character position. But do not be fooled by
    the underscore inclusion; \w does NOT match hyphens, dashes, spaces, or punctuation
    marks. Table 2.4 provides examples.'
  - '[PAGE 29]


    # 16 Introduction to Regular Expressions SAS


    Table 2.4: Examples using \w


    | Usage | Matches |

    | --- | --- |

    | /R/wn/ | "Ran" "Run" "Ron" ... |

    | \wun/ | "Fun" "fun" "Run" "run" "Bun" "bun" _un" ... |

    | /Street\w/ | "Streets" "Street" |


    Note: The \w wildcard should not have any unintentional spaces before or after
    it. Such result result in the pattern trying to match those additional spaces
    in addition to the \w. (This goes for any RegEx metacharacter.)


    # 2.3.3 Non-word


    The metacharacter \W matches a non-word character value (i.e., everything that
    \w doesn''t include, except for the-elusive-''). The \W metacharacter is valuable
    when you are sure what is in a character but you know that you don''t want a word
    character (i.e., alphanumeric and _). Table 2.5 provides examples.


    Table 2.5: Examples using \W


    | Usage | Matches |

    | --- | --- |

    | /Washington/W/ | "Washington; "Washington," "Washington;" ... |

    | /D/WC/W/ | "D.C," "D C," "D C " ... |

    | /Street\W/ | "Street," "Street," "Street+\ |


    Note: You will continue to lowercase and uppercase versions of these RegEx characters
    acting as opposites, with some exceptions. It might not be clever, but does help
    simplify matters.


    # 2.3.4 Tab


    The metacharacter \t matches only the tab character in a string. Unlike the RegEx
    characters to follow, this metacharacter matches only the tab whitespace character.
    This is es useful when the tab holds some special significance, such as when you
    are processing tab-delimited text files. Table 2.6 provides examples.


    Table 2.6: Examples using \t


    | Usage | Matches |

    | --- | --- |

    | /SAS/t/ | "SAS " |

    | /SAS/tInstitute\t/ | "SAS Institute Inc" |

    | /Street\t/ | "Street " |'
  - '[PAGE 30]


    # Chapter 2: Getting Started with Regular Expressions


    **Note:** This metacharacter does not have an opposite (i.e., \T does not exist).


    # 2.3.5 Whitespace


    The metacharacter \s matches on a single whitespace character, which includes
    the space, tab, newline, carriage return, and form feed characters. You must include
    this when you are matching on anything in text that is separated by white space,
    and you are unsure of which will occur. Table 2.7 provides examples.


    Table 2.7: Examples using \s


    | Usage | Matches |

    | --- | --- |

    | /SAS\s/ | "SAS" "SAS " |

    | /SAS\Institute\Inc/ | "SAS Institute Inc" "SAS Institute Inc" |

    | /Street\s/ | "Street " "Street "


    **Note:** This form of the \s metacharacter matches only one whitespace character.
    We review how to find multiple matches in Section 2.5.2 because that is frequently
    needed when you are matching text.


    # 2.3.6 Non-whitespace


    The metacharacter \S matches on a single non-whitespace character—the exact opposite
    of \s. This metacharacter is often used to account for unexpected dashes, apostrophes,
    commas, and so on, that might otherwise prevent a match. Table 2.8 provides examples.


    Table 2.8: Examples using \S


    | Usage | Matches |

    | --- | --- |

    | /Leonato''Ss/ | "Leonato''s" "Leonato_s" ... |

    | /Washington\S/ | "Washingtons" "Washington," ... |

    | /Street\S/ | "Street," "Street," "Streets" "Street+" ...


    # 2.3.7 Digit


    The metacharacter \d matches on a numerical digit character (i.e., 0-9). This
    RegEx metacharacter is probably the most straightforward one as it has a very
    narrow focus. Remember that a single occurrence of \d is for only one character
    position in text. In order to capture larger numbers (i.e., anything greater than
    9), you have to build patterns with multiple occurrences of \d. Table 2.9 provides
    examples, but we discuss more sophisticated methods for accomplishing this later
    in the chapter. (See "Repetition Modifiers" in Section 2.4.2).'
  - '[PAGE 31]


    # 18 Introduction to Regular Expressions in SAS


    Table 2.9: Examples using \d

    | Usage | Matches |

    | /dst/ | "1st" "9st" "4st" ... |

    | /10d/ | "101" "102" "103" ... |

    | /1-800-\d\d\d-\d\d\dd/ | "1-800-123-4567" "1-800-789-3456" ... |


    Note: Just remember that even though your pattern might be correct, the data is
    not necessarily correct (4st and 9st don''t make sense!).


    # 2.3.8 Non-digit


    The metachar \D matches on any single non-digit character. Again, this is the
    opposite of the lowercase metachar \d. This metachar matches on every value that
    is not a number. Table 2.10 provides examples.


    Table 2.10: Examples using \D

    | Usage | Matches |

    | /\D800\D123\D4567/ | "1-800-123-4567" "1.800.123.4567" ... |

    | /1560\DW...Blvd/ | "1560 Wilson Blvd" "1560_Wilson_Blvd" ... |

    | /19\D:D\DStreet/ | "19th Street" "19th...Street" "19...Street" ... |


    # 2.3.9 Newline


    The metachar \n matches a newline character. It is quite useful for some patterns
    to know that you have encountered a new line. For instance, you might be processing
    addresses in a text file, which often contain different pieces of information
    on different lines. Table 2.11 provides examples.


    Table 2.11: Examples using \n

    | Usage | Matches |

    | /103 Pennsylvania Ave.\ NW,\nWashington, DC 20216/ | "103 Pennsylvania Ave.
    NW, Washington, DC 20216" |

    | /<html tag>\n/ | "<html tag>\n" |

    | /v\ne''\nr\nt\ni\ne\na\nl\nt\ne\nx\nt/ | "...v... e r t" |'
