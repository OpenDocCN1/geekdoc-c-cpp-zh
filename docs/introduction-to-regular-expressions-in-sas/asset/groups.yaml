    \ SAS 过程（PROC）。\n\n本书提供了你所需的所有工具，帮助你学习如何在 SAS 编程语言中利用正则表达式的力量。书中提供的信息为较为高级的应用定了基础，这些应用将在本章后面作为激励性示例进行简要讨论。我们呈现这些内容并不是为了吓唬或让你感到无从下手，而是鼓励你带着能够快速实现所学内容的预期来阅读接下来的页面。\n\
    \n## 1.2 本书结构\n\n我的目标是提供后即可应用的信息。因此，每一章的结构都引导你完成从理论到应用的每一个步骤，其流程如下：语法 ► 示例。除了后续章节中讨论的信息外，附录还包含了一份正则表达式参考指南，以帮助处理本文范围之外的高级应用。\n\
    \n## 第 1 章\n\n本章在为本书剩余部分提供路线图的同时，还提供了关于如何在现实世界中使用这些信息的激励性示例。\n\n## 第 2 章\n\n本章介绍了正则表达式的基本语法和概念。书中甚至包含了一些\
    \ SAS 代码，用于运行与每个新概念相关的示例。\n\n## SAS 中的正则表达式简介\n\n## 第 3 章\n\n本章旨在详细介绍在 SAS 语言中实现正则表达式的细节。\n\
    \n## 第 4 章\n\n在最后一章中，我们将处理一系列深入的示例——如果可以的话之为案例研究——以便将“所有内容整合在一起”。这些示例并不代表你在完成本书后所能做的局限性，而是对可能性的某些基础思维。\n\
    \n## 附录\n\n虽然这些内容并不详尽，但它们作为正则表达式、SAS 文档和参考表非常有价值且内容丰富的参考。我希望每个人都能利用额外信息来丰富当前和未来的正则表达式能力。\n\
    \n## 1.3 定义正则表达式\n\n在进一步深入之前，我们需要定义什么是正则表达式。\n\n采用非常正式的定义可能无法提供预期的清晰度：\n\n定义 1（正式的）\n\
    \n*正则表达式：“正则表达式由常量和运算符符号组成，这些符号分别表示对这些集合的设置和操作的字符串。”*\n\n为了追求清晰，我们将对正则表达式使用一个稍微松散的定义。由于实际应用是我们的首要目标，遵循任何晦涩的定义都是没有意义的。因此，对于我们的目的来说，我们将使用以下定义：\n\
    \n定义 2（更易理解——我们的定义）\n\n*正则表达式：用于自动搜索和匹配的模式。*\n\n在 SAS 中编程时，正则表达式被视为字母和特殊字符的字符串，这些字符由内置\
    \ SAS 函数识别，用于搜索和匹配。通过与其他内置 SAS 函数和过程结合，你可以实现巨大的能力，其中一些我们将在下一节中探讨。\n\n注意：SAS 使用的正则表达式语法与\
    \ Perl 语言相同²。因此，在整个 SAS 文档中你会你会正则表达式被反复称为“Regular expressions”。在本书中，除非 Perl 惯例对程序员来说是最常见的，否则我选择\
    \ SAS 文档中的习惯。要了解更多关于 SAS 如何看待 Perl，请访问此网站：\n\n```\nhttp://support.sas.com/documentation/cdl/en/functionsref/67239/HTML/default/viewer.html#p0s9ilagexmj8nu7e11jfnzlk.\
    \ 要了解更多 Perl 编程，请访问\nhttp://perldoc.org/perl/perl.html. 在书中，我主要省略对 Perl 的引用，因为可能会引起混淆。\n\
    ```\n\n*\n\n## 1.4 激励性示例\n\n书中的信息对于广泛的应用非常有用。然而，在你阅读它之前，这一点并不显而易见。因此，为了直观展示你如何在工作中使用这些信息，我提供了一些真实的示例。\n\
    \n你们可能都熟悉数据，但提供给分析师的数据很少是直接可用的形式。在使用源数据（尤其是文本数据）之前，通常需要对它们进行清洗、转换和增强。以下关于编码细节的示例将在书中稍后部分讨论，但它们在不同复杂程度上展示了这些概念。这里的主要目标仅仅是帮助你看到这些信息的用处，并开始思考利用它们的方法。\n\
    \n### 1.4.1 提取、转换和加载 (ETL)\n\nETL 是一套通用流程，用于从源提取数据、对其进行修改以符合你的最终需求，并将其加载到目标位置（例如数据库、数据存储、仓库）。我们将从一个非常基本的示例开始。假设我们有一组\
    \ SAS 客户地址集，其中包含一些质量问题。我们不知道记录数据的方法，但目眼检查已经显示了大量重复记录，如下表所示。在这个示例中，\n\n| 名 | 姓\
    \ | 出生日期 | 街道 | 邮编 |\n|---|---|---|---|---|\n| Robert | Smith | 2/5 | 123 | Fairfax\
    \ |\n| Robert | Smith | 2/5 | 123 | 2203 |\n\n目眼检查揭示了大量重复记录，如下表所示。这里的主要目标仅仅是帮助你看到这些信息的用处，并开始思考利用它的方法。\n\
    \n### 1.4.2 数据操纵\n\n假设你被赋予了创建一个关于证券交易委员会（SEC）报告的任务。然而，源数据只是一堆 .xml 文件，对于外行来说，这看起来像是一堆乱码；对于经过训练的人来说，它看起来像大量的工作。图\
    \ 1.1：2009 年 SEC 示例\n\n```\n<xml version=\"1.0\" encoding=\"ISO-8859-1\">\n<administrative_proceeding>\n\
