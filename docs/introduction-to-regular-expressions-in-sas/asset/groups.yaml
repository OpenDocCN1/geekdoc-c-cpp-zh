    ## 4.4 Search and Replacement


    The needs for search and replace vary greatly, but nowhere is this capability
    more necessary than for PII redaction. Redacting PII is a frequent concern in
    the public sector, where information sharing between agencies or periodic release
    is often mandated. We revisit the data here because it includes the kinds of information
    we would likely want to reduce. The example used in Section 4.2 has been exported
    to a text file. We want to know how to perform this task on any data source, from
    highly structured to the completely unstructured. Having worked with structured
    data is a natural next step.


    Now, before we get into how to perform the redaction, it is worth showing how
    the TXT file was created. Despite knowing how it is created in advance, we want
    to behave as though we have no knowledge of its construction in order that we
    are creating reasonably robust code. You can see in the code below that we simply
    take the resulting data set from Section 4.2, FinalPII, as input via the SET statement.
    Next, we use the FILE statement to create a TXT file. Once the FILE statement
    is used, the following PUT statement automatically writes the identified variables
    to it:


    ```sas

    data NULL;

    set finalpii;

    file ''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt'';

    put;

    run;

    ```


    Output 4.5 shows the output provided by this code. As we can see, the structure
    is largely removed, though not entirely. This allows us to more closely approximate
    what you might encounter in the real world (which could be PII stored in a Word
    file).


    ## Chapter 4: Applications of Regular Expressions in SAS


    ### Output 4.5: PII Raw Text


    ![](img/c58184a1652486f0486b8350e0431fbb_94.png)


    Now that we have a usable data source to work with, we can create to redact all
    sensitive elements. The challenge of doing this effectively is that we can''t
    depend on the surrounding text to identify decisions. For this reason, it is important
    that our code takes care to properly detect the individual elements before redacting
    them.


    Below is the code that performs our redaction of the PII elements SAS, DOB, PhoneNumber,
    Street, City and Zip. Now, many organizations are allowed to publish small amounts
    of information, such as city or number. However, we are focusing on how to verify.
    In addition to performing the redaction steps, we also output the redacted text
    to a TXT file. This is an effort to perform a realistic use of these techniques.
    For instance, many organizations keep information in text that are updated by
    administrative staff. There are valid reasons for sharing portions of information
    either internally or with external elements, but must be met with great care.
    Thus, it is useful for such files to be automatically scrubbed to provide a given
    final to others.


    Note: while the following code is more realistic than what we developed in Chapter
    3, it still needs to be improved for robust, real-world applications. The homework
    for this has suggestions, but there is still room for additional refinement.


    ```sas

    data NULL;

    in=''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt''
    length=linelen

    recl=500;

    varlen=linelen=0;

    input_text $varying50, varlen;

    Redact_SSN = PRXPARSE(''/-\d(3)\s*-\d(2)\s*-\d(4)/'',''REDACTED'',o);

    ```


    ### Introduction to Regular Expressions in SAS


    ```sas

    Redact_Phone = PRXPARSE(''s/(\d*)?\s*\d(3)-\s*\d(3)-\s*\d(4))/REDACTED/o'');

    Redact_DOB = PRXPARSE(''s/(\d(1,2)\s*\d(1,2)\s*\d**\s*\d(4))/REDACTED/o'');

    Redact_Addr = PRXPARSE(''s/(\w+)?\s*(\w+)\s*(\w+)?\s*(\w+)?\s*(\w+)?\s*(\d(4))\s*\d(5))/REDACTED,
    REDACTED 4 REDACTED'');

    CALL PRXCHANGE(Redact_Addr_1,source_text);

    CALL PRXCHANGE(Redact_Phone,-1,source_text);

    CALL PRXCHANGE(Redact_DOB,-1,source_text);

    ```


    ```sas

    file "F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\RedactedPII_Output.txt";

    put source_text;

    run;

    ```


