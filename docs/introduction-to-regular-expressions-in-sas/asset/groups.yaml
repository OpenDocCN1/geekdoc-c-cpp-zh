    \ 69\n\n## 3.1 引言\n\n本章重点在于培养你对内置 SAS 函数和调用例程的理解，并开始编写一些真实的 SAS 代码。在这里，你将学习如何实现第\
    \ 2 章引入的奇妙正则表达式元字符的机制。每个函数或调用例程都有相关的示例，以确保它们的用法清晰。我们将简要讨论它们各自的用途。\n\n### 3.1.1\
    \ 捕获缓冲区\n\n现在在继续之前，我们必须处理一个称为捕获缓冲区的概念。捕获缓冲区是一种更高级的技术，到目前为止我一直避免深入探讨，但必须理解它才能使用某些函数（PRXPAREN\
    \ 和 PRXPOSN 强制需要，PRXCHANGE 可选）。正如你在第 2 章中所记忆的，括号在正则表达式中创建局部分组，但它们还有一些有趣的操作。对于特定正则表达式模式中使用的每组括号，内存缓冲区中都会创建一个槽位。这个内存槽位像任何变量一样可以被引用（经验丰富的程序员可以将其想象成指针缓冲区）。每个槽位按照括号对出现的顺序顺序创建，并使用\
    \ $ 符号相应地引用。\n\n例如，正则表达式 `s(The) (cat) (is) (fat)/4 $3 $1/` 创建输出 \"Fat the cat\"\
    。现在，想象拥有同样的识别未知数据元素的能力，而不仅仅是将字符串映射到字面量。这可能成为为了满足特定需求而标准化或重构数据的非常强大的能力。\n\n## 3.2\
    \ 内置 SAS 函数\n\n在本节中，我们涵盖了用于执行正则表达式操作的 SAS 函数。正则表达式的 SAS 函数与内置函数相同的用法限制。（参见 SAS\
    \ 文档。）同样，与其他函数一样，它们只能在赋值语句和表达式中接收参数并返回输出。\n\n注意：每个正则表达式函数开头都有 PRX，代表 Perl-Regular-eX（Perl\
    \ 正则表达式）。\n\n### 3.2.1 PRXPARSE\n\n#### 描述\n\n该函数接受正则表达式模式作为输入，并提供标识符作为输出。该标识符供其他函数和例程使用。\n\
    \n#### 语法\n\n```\nRegEx_ID = PRXPARSE(RegEx)\n```\nRegEx: 要解析的模式（输入）\nRegEx_ID:\
    \ 返回的唯一标识符（输出）\n\n现在，在该这一点理解在使用 PRPARSE 时 /o 选项之所以重要。/o 选项强制 SAS 只编译一次模式。当正则表达式出现在代码中（例如在\
    \ IF 语句内部）时，我们可能不想浪费内存。在其他情况下，这取决于权衡。当你处理少数模式或少量数据时，这些权衡并不适用。但当我们扩展到使用数百个模式或数百万记录的系统时，内存使用变得非常重要。\n\
    \n### 示例 3.1：使用 PRXPARSE 定义模式\n\n让我们回顾第 2 章的代码，因为它已经熟悉了。下面的正则表达式定义为 /Smith/o，这意味着我们在提供的数据中查找字面量\
    \ \"Smith\" 的任何出现。此正则表达式是 PRXPARSE 的参数，它创建一个赋值给变量 ID 的标识符。该变量被传递给将在下一节讨论的调用例程\
    \ STR。你已经熟悉这段代码的功能，这里不需要分心。\n\n该正则表达式的输出如输出 3.1 所示。正如预期，代码找到了每个 \"Smith\" 的出现，无论周围是什么（包括其他字母）。\n\
    \n```\n/*正则表达式测试框架*/\ndata NULL;\npattern = \"Smith/o\"; /*在此处编辑模式*/\npattern_ID\
    \ = PRXPARSE(pattern);\ninput some_data $5;\ncall prxsubstr(pattern_ID, some_data,\
    \ position, length);\n  if position ^= 0 then\n    do;\n      match = substr(some_data,\
    \ position, length);\n      put match:QUOTE. \"found in \" some_data:$QUOTE;\n\
    \    end;\ndatalines;\nSmith, BOB A.\nROBERT Allen Smith\nSmithe, Cindy\n103 Pennsylvania\
    \ Ave. NW, Washington, DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st\
    \ St NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n1560 Wilson\
    \ Blvd, Arlington, VA 22209\n1-800-4567\n1(800) 789-1234\nrun;\n```\n\n### 输出\
    \ 3.1：模式 /Smith/o 的日志输出\n\n![](img/c58184a1652486f0486b8350e0431fbb_54_0.png)\n\
    \n"
