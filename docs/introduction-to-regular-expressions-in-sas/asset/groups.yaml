    significant challenges to processing the data. If you are unfamiliar with XML
    or other tag-based languages (e.g., HTML), further reading on the topic is recommended.
    Though you don''t need to know them at a deep level in order to process them effectively,
    it will save a lot of heartache to have an appreciation for how they are structured.
