    # 2.8 Summary


    We have explored a variety of new concepts in this chapter, and I''ve been doing
    my utmost to make them tangle along with. Hopefully, you are now ready to tackle
    the challenge of implementing these concepts in SAS code in the coming chapters.
    Following are some takeaways you should keep in mind for the coming pages and
    beyond.


    # Flexibility


    It should become clear through reading this chapter that there are many ways to
    accomplish the same task, making few of them truly right or wrong. You have to
    decide the most efficient and effective approach for accomplishing your goals
    to determine what is best for a given situation.


    # Scratching the Surface


    We have only begun to scratch the surface of what RegEx can do. The information
    you have learned thus is a solid foundation upon which you can develop sophisticated
    functionality.


    # Start Small


    As we explored a variety of RegEx capabilities throughout this chapter, it is
    easy to become overwhelmed by attempting to do too much at once. As anything,
    it is best to start small by experimenting with simple patterns and iteratively
    evolve them. And remember that leveraging just a few of the elements we have covered
    can have a tremendous impact on the processing and analysis of textual information.'
