    \ 的值打印到日志中（产生四次日志写入）。然而，使用 `IF` 语句，我们在最后记录上运行 `CALL PRXFREE` 例程，以释放与两个 `RegEx_ID`\
    \ 关联的内存。然后，我们将结果打印到日志。这产生了第五次日志写入，但这次值是缺失的，因为我们的例程成功地释放了分配给它们的内存——使它们变得无法恢复。\n\
    \n```\ndata sample;\ninput address $50;\ndatalines\n103 Pennsylvania Ave NW, Washington,\
