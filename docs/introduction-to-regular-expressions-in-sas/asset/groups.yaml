    # 1.1 Purpose of This Book


    This book is meant for SAS programmers of virtually all skill levels. However,
    it is expected that you have at least a basic knowledge of the SAS language, including
    the DATA step, and how to use SAS PROCs.


    This book provides all the tools you need to learn how to harness the power of
    regular expressions within the SAS programming language. The information provided
    lays the foundation for fairly advanced applications, which are discussed briefly
    as motivating examples later in this chapter. We are not presented to intimidate
    or overwhelm, but instead encourage you to work through the coming pages with
    the anticipation of being able to rapidly implement what you are learning.


    # 1.2 Layout of This Book


    It is my goal in this book to provide immediately applicable information. Thus,
    each chapter is structured to walk through every step from theory to application
    with the following flow: Syntax ► Example. In addition to the information discussed
    in the coming chapters, a regular expression reference guide is included in the
    appendix to help with more advanced applications outside the scope of this text.


    # Chapter 1


    In addition providing a roadmap for the remainder of the book, this chapter provides
    motivational examples of how you can use this information in the real world.


    # Chapter 2


    This chapter introduces the basic syntax and concepts for regular expressions.
    There is even some SAS code for running the examples associated with each new
    concept.'
  - '[PAGE 15]


    Introduction to Regular Expressions in SAS


    # Chapter 3


    This chapter is designed to walk through the details of implementing regular expressions
    within the SAS language.


    # Chapter 4


    In this final chapter, we work through a series of in-depth examples—case studies
    if you will—in order to ‘put it all together’. They don’t represent the limitations
    of what you can do by the end of this book, but instead some baseline thinking
    for what is possible.


    # Appendixes


    While not comprehensive, these serve as valuable, substantial references for regular
    expressions, SAS documentation, and reference tables. I hope everyone can leverage
    the additional information to enrich current and future regular expressions capabilities.


    # 1.3 Defining Regular Expressions


    Before going very further, we need to define regular expressions.


    Taking the very formal definition might not provide the desired level of clarity:


    Definition 1 (formal)


    *regular expressions: “Regular expressions consist of constants and operator symbols
    that denote strings of settings and operations over these sets, respectively.”*


    In the pursuit of clarity, we will operate with a slightly looser definition for
    regular expressions. Since practical application is our primary aim, it doesn’t
    make sense to adhere to any esoteric definition. So, for our purposes we will
    use the following:


    Definition 2 (easier to understand—our definition)


    *regular expressions: pattern used for automated searching and matching.*


    When programming in SAS, regular expressions are seen as strings of letters and
    special characters that are recognized by built-in SAS functions for the purpose
    of searching and matching. Combined with other built-in SAS functions and procedures,
    you can reach tremendous capabilities, some of which we explore in the next section.


    Note: SAS uses the same syntax for regular expressions as the Perl language².
    Thus, throughout SAS documentation, you find regular expressions repeatedly referred
    to as “Regular expressions.” In this book, I choose the conventions present in
    the SAS documentation, unless the Perl conventions are the most common to programmers.
    To learn more about how SAS views Perl, visit this website:


    ```

    http://support.sas.com/documentation/cdl/en/functionsref/67239/HTML/default/viewer.html#p0s9ila

    gexmjl8nu7e11jfnzlk. To learn more about Perl programming, visit

    http://perldoc.org/perl/perl.html. In this book, I primarily dispense with the
    references to

    Perl, as it can be confusing.

    ```


