    ## 关于本书


    ## 目的


    本书旨在面向广泛的 SAS 用户，从初级程序员到非常高级的用户均适用。由于之前关于该主题的出版较少，不同技能水平的读者都能从中受益。然而，本书的编写确保了初学者能够立即实施所讨论的每一个元素。


    ## 这本书适合你吗？


    当然了！你是否希望处理非结构化数据源？你是否想更有效地处理半结构化数据源？你是否希望某日能在 Base SAS 代码中利用高级的文本挖掘概念？你当然想！本书为这一切奠定了基础，是任何想要增强编程能力的人的理想教材。


    ## 先决条件


    读者应该熟练使用和应用 SAS DATA 步、基础 PROC（例如 `PROC PRINT`）、DO 循环和条件处理概念。读者应熟悉 SAS 数组和 RETA
    语句。


    ## 本书范围


    本书涵盖了所有的 PRX 函数和调用例程。


    本书**不**涵盖需要 MACRO 编程、PROC SQL 或系统自动化的高级概念。


    ## 关于示例


    ## 开发本书内容使用的软件


    Base SAS (Microsoft Windows)


    ## 示例代码和数据


    你可以通过访问作者页面 http://support.sas.com/publishing/authors 来访问本书的示例代码和数据。选择作者姓名。然后寻找本书的封面缩略图并选择“Example
    Code and Data”（示例代码和数据）以显示书中包含的 SAS 程序。有关所有提供示例代码和数据的书籍字母列表，请访问 http://support.sas.com/bookcode。点击标题以显示书籍的示例代码。


    如果你无法通过网站访问代码，请发送电子邮件至 saspress@sas.com。


    ## 本书使用的输出和图形


    书中使用的所有输出都是通过 SAS log 和 `PROC PRINT` 生成的。


    ## 额外帮助


    尽管本书说明了各行业企业经常进行的许多分析，但可能会出现针对你特定目标和问题的问题。为了提供全面支持，SAS Institute 和 SAS 为你提供了以下帮助资源：


    - 关于本书涵盖的主题，请通过 SAS Press 联系作者：

    - -

    - 通过电子邮件向 saspress@sas.com 发送问题；请在信函中注明书名。

    - 在 http://support.sas.com/author_feedback 的作者页面提交反馈。

    - 关于本书内或本书之外的话题，请在 https://communities.sas.com/welcome 相应的 SAS 支持社区提问。

    - SAS Institute 维护着一个包含最新信息的网站。对于初学者和老练的 SAS 用户来说，特别用的页面是知识库。可以在 http://support.sas.com/resources
    知识库的“Samples and SAS Notes”部分搜索相关注释。


    - 注册 SAS 用户或其组织可以通过 http://support.sas.com 访问 SAS 客户支持。在这里向 SAS 客户支持提交特定问题：在 Support（支持）下，点击
    Submit a Problem（提交问题）。你需要提供一个可以接收回复的电子邮件地址，识别你的组织并提供客户站点编号或许可信息。这些可以在你的 SAS log
    中找到。


    ## 保持联系


    我们期待你的反馈。我们欢迎提问、评论和疑虑。如果你想就特定书籍与我们联系，请在致 saspress@sas.com 的邮件中注明书名。


    ## 如何通过 SAS Press 联系作者


    电子邮件：saspress@sas.com


    网页访问：http://support.sas.com/author_feedback


    ## SAS 书籍


    有关通过 SAS 可获得的完整书籍列表，请访问 http://support.sas.com/bookstore。


    电话：1-800-727-0025


    电子邮件：sasabook@sas.com


    ## SAS Report


    通过订阅 SAS Report 月度电子报，通过电子邮件接收所有新出版物的最新信息。访问://support.sas.com/sbr。


    ## 在 SAS 出版


    SAS 正在招聘作者！你对写作感兴趣吗？访问 http://support.sas.com/sas 了解更多信息。


    ## 关于作者


    K. Matthew Windham, CAP 是 NTELX Inc. 的分析总监，该公司位于华盛顿特区，提供分析和技术解决方案。他的重点是通过数学和统计建模、数据和文本挖掘以及优化帮助客户改进运营。作为
    SAS 的长期用户，Matt 喜欢利用该平台创建预测性分析。在职业生涯中，Matt 曾在关键环境中领导咨询团队以提供快速且高影响力的成果。Matt 是一位认证分析专业人员
    (CAP)，在北卡罗来纳州立大学获得应用数学学士学位，在乔治大学获得数学和统计硕士学位。访问他的作者页面 http://support.sas.com/publishing/authors/windham.html
    了解更多信息。你可以在那里下载免费书籍摘要、访问代码和数据、阅读最新评论、获取更新等。


    ## 谢谢


    感谢我聪明的妻子 Lori，感谢你对我所做一切的支持和鼓励。没有你我无法完成。感谢我的朋友和家人，你们的建议和鼓励弥足珍贵。


    虽然我在职业生涯中有很多受我恩惠的人，但其中一位尤为突出。我想感谢 Nick Ferens 多年前将我推入池水深处。你看到了比我自己更看到的潜力，并彻底改善了我的职业。


    最后，我要感谢 SAS Press 的编辑团队，我们在此过程中进行了非常真正的合作。Shelley Sessoms, John West, Brenna Leath,
    Joan Keyser, Denise Jones 和 Stacey Hamilton。你们的耐心、见解和努力让这成为了一段愉快的经历。


    '
