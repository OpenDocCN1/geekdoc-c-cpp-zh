  mdcn: "\n处理数据面临着重大挑战。如果你不熟悉 XML 或其他基于标签的语言（例如 HTML），建议对该主题进行进一步阅读。虽然你不需要为了有效地处理它们而深入了解它们，但对它们的结构有一个良好的理解会让你省去很多很多烦恼。我在本书的高级示例中使用了一些基于标签的语言，因为它们在实践中非常普遍。\n\
    \n## 1.4.3 数据增强\n\n数据增强是指利用我们已有的数据从其他来源收集有关我们主题的额外细节或信息，从而增加该数据价值的过程。在文本解析和结构化过程中，我们可以利用\
    \ SAS 中正则表达式的威力来丰富数据。\n\n因此，我们将对 SAS 主校区——北卡罗来州卡里（Cary, NC）对周围社区的经济影响进行分析。为了正确完成，我们需要使用地理空间信息进行统计分析。\n\
    \n地址信息可以从 www.sas.com 轻松获取。然而，为了对地理空间统计进行有效的分析和报告，包含纬度和经度等额外的地理信息是有用的（尽管并非必须的）。自动化这一过程并非易事，它包含了超出本教程范围的高级编程步骤。但是，对你来说，理解书中所述的技术在未来将通向复杂的能力是非常重要的。为了让这些技术更具形象，我们将演示这些步骤及其结果。\n\
    \n- 1. 通过正则表达式从图 1.2 中提取嵌入的地址信息，就像在数据操作示例中一样。\n\n### 图 1.2：HTML 地址信息\n\n```\n\
    <p>World Headquarters<br>\nSAS Institute Inc.<br>\n100 SAS Campus Drive<br>\n\
    Cary, NC 27513-2414, USA<br>\nPhone:919-677-8000<br>\nFax:919-677-4444<br>\n</p>\n\
    ```\n\n### 示例数据集结构\n\n| 位置 | 地址行 1 | 地址行 2 | 城市 | 州 | 邮编 | 电话 | 传真 |\n|---|---|---|---|---|---|---|---|\n\
    | 世界总部 | SAS Institute Inc. | 100 SAS Campus Drive | Cary | NC | 27513-2414 |\
    \ 919-677-8000 | 919-677-4444 |\n\n## 6 SAS 正表达式简介\n\n- 2. 通过 Google 或 Yahoo 等网络服务提交地址进行地理编码，以便免费将地址处理为纬度和经度。在浏览器中输入以下字符串以获取\
    \ XML 输出，该输出在图 1.3 中也有采样。\n\n`http://maps.google.com/maps/api/geocode/xml?address=100+SAS+Campus+Drive,Cary,+NC&sensor=false`\n\
    \n图 1.3：XML 地理编码结果\n\n```\n<geometry>\n  <location>\n    <lat>35.8301733</lat>\n\
    \    <lng>-78.7664916</lng>\n  </location>\n  <location_type>ROOFTOP</location_type>\n\
    \  <viewport>\n    <southwest>\n      <lat>35.8288243</lat>\n      <lng>-78.7678406</lng>\n\
    \    </southwest>\n    <northeast>\n      <lat>35.8315223</lat>\n      <lng>-78.7651426</lng>\n\
    \    </northeast>\n  </viewport>\n</geometry>\n```\n\n- 3. 使用正则表达式解析 XML 文件以所需信息——在我们的案例中是纬度和经度——并将它们添加到数据集中。\n\
    \n注意：** 我们跳过了关于我们如何解析这一特定经纬度点的某些细节。执行此类工作所需的工具将在书的后部分介绍。这里提供的此示例是为了激发你对正则表达式可能性的想象。\n\
    \n示例数据集结构\n\n| 位置 | 纬度 | 经度 |\n|---|---|---|\n| 世界总部 | 35.8301733 | -78.7664916\
    \ |\n\n- 4. 使用 https://maps.google.com/ 对我们从结果文件中解析出的经纬度对进行反向查找以验证你的结果。如图 1.4\
    \ 所示，已经实现了预期结果（北卡罗来州卡里的 SAS 校区主入口）。\n\n图 1.4：使用 Google Maps 查看 SAS 校区\n\n![](img/c58184a1652486f0486b8350e0431fbb_20_0.png)\n\
    \n现在我们已经有了包含了纬度和经度的增强数据集，可以采取后续步骤来执行经济影响分析。\n\n希望前面的示例已被证明具有启发性，你现在准备好发现 SAS 正则表达式的威力了。记住，上一个示例相当高级——需要一些复杂的\
    \ SAS 编程能力来实现端到端的结果。然而，大部分工作利用了正则表达式。\n\nWikipedia, http://en.wikipedia.org/wiki/Regular_expression#Formal_definition\n\
    \n有关所使用的 Perl 版本的更多信息，请参阅 SAS 支持网站上的艺术许可声明：http://support.sas.com/rmd/base/datastep/regexp/compliance.html\n\
    \n此示例文件从 data.gov 获取：http://www.sec.gov/open/datasets/administrative_proceedings_2009.xml\n\
