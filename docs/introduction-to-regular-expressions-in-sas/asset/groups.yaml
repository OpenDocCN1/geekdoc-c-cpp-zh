    ## 28 SAS 正则表达式简介


    **注意：** 请注意在花括号内的逗号后输入空格。这由于习惯性动作很容易发生，但它会破坏我们的模式！


    ## 贪婪匹配 n 到 m 次


    修饰符 {n,m} 创建至少 n 次但不超过 m 次的匹配。使用指定范围创建匹配，对于确保维持数据质量标准非常有用。在提取诸如邮政编码、出生日期和电话号码等半结构化数据元素时，在保持一定灵活性的同时，确保源数据在容差范围内至关重要。例如，可能会用两位年份代替四位年份，但四位邮政编码是不可接受的。表
    2.29 提供了示例。


    ### 表 2.29：使用 {n,m} 的示例


    | 用法 | 匹配结果 |

    | :--- | :--- |

    | /(1-)?\d\d\d{3,3}-\d{4,4}/ | "1-800-123-4567" ... |

    | /\d{1,2]-\d{1,2}-\d{2,4}/ | "10-20-1950" "8-30-52" "4-3-1979"... |

    | /Was{1,7}/ | "Washington" "Wash" "Waste" "Washing"... |


    **注意：** 正如上面的示例所示，{n,m} 并不总是修饰符的最佳选择，但这些示例旨在演示实现的灵活性。例如，在第二个示例中，这种用法下允许年份为三位数。使用带有
    {n} 修饰符的 OR 子语句是一个简单的修复方法。


    ## 懒惰重复修饰符简介


    现在你已经熟悉了贪婪修饰符，让我们开始研究懒惰修饰符。在语法上，它们与贪婪修饰符的唯一区别在于增加了一个问号（?）。通过在每个贪婪修饰符后立即添加问号，我们能够微妙地改变它们的行为——有时会以意想不到的方式改变。


    通常，懒惰修饰符用于避免过度匹配，并与贪婪修饰符相比可以提高性能。在某些情况下，使用贪婪修饰符匹配会导致获取过多的信息，或者简单地降低性能。例如，处理 HTML
    或 XML 等半结构化文本文件就是懒惰修饰符大显身场的绝佳例子。


    ## 懒惰 0 次或多次


    修饰符 {*} 创建 0 次或多次匹配，但仅执行创建匹配所需的最少次数。在某些情况下，它创建与贪婪修饰符相同的匹配。然而，在其他情况下，结果非常不同。为了更清楚这一点，表
    2.30 描述了几个示例的细节。


    ### 表 2.30：使用 *? 的示例


    | 用法 | 匹配结果 | 注释 |

    | :--- | :--- | :--- |

    | /Sing\w*?/ | “Sing” | 这仅匹配单词“Sing”，因为该修饰符被赋予了匹配空内容的选项。由于它是懒惰的，它每次都会采取该选项，无论“Sing”中的“g”后面是否紧跟单词字符。
    |

    | /Sing\w*?/s | “Singing” ... | 与上述示例相比，你看到模式上的 \s 创建了额外的匹配。\s 强制模式继续搜索包含空格的匹配。这可以是“Sing”或其他组合（类似于贪婪的结果）。
    |

    | /(ha)*?/ | | 这个示例演示了为什么我们需要对懒惰修饰符保持谨慎。即使“ha”被忽略了，这同样是因为修饰符有这样做的选项。该版本的贪婪模式将匹配单词“ha”连续出现的次数，最少为零次。
    |


    ## 懒惰 1 次或多次


    修饰符 + 创建 1 次或多次匹配，但仅执行创建匹配所需的最少次数。同样，如果可能的话，它只匹配一次。表 2.31 提供了示例。


    ### 表 2.31：使用 +? 的示例


    | 用法 | 匹配结果 | 注释 |

    | :--- | :--- | :--- |

    | /Sing\w+?/ | “Singi” | 这仅匹配“Sing”加上紧跟在“g”后面的正好一个单词字符。同样，通过赋予懒惰修饰符匹配最小次数的选项，它每次都会这样做。
    |

    | /Sing\w+?/s | “Singing” ... | 再次，我们看到模式上的 \s 创建了额外的匹配。\s 强制模式继续搜索包含空格的匹配。这可以是“Sing”或其他组合（类似于贪婪的结果）。
    |

    | /(ha)+/ | “ha” | 这个示例与其说是一个警示，不如说不像 *?。但它仍可能产生不理想的结果。即使“ha”连续出现多次，它也只匹配第一次，除非后面跟着额外的匹配元素。同样，这是因为修饰符有仅匹配一次的选项。该版本的贪婪模式将匹配单词“ha”连续出现的次数，最少一次。
    |


    ## 懒惰 0 次或 1 次


    修饰符 ?? 创建 0 次或 1 次匹配，但仅执行创建匹配所需的最少次数。除非被强制，否则此修饰符将匹配 0 次。表 2.32 提供了示例。


    ### 表 2.32：使用 ?? 的示例


    | 用法 | 匹配结果 |

    | :--- | :--- |

    | /Sing\w??/ | "Sing" | 这仅匹配 "Sing"，因为修饰符被赋予了匹配空内容的选项。 |

    | /Sing\w??/s | "Singing" | 与上述示例相比，你看到模式上的 \s 创建了额外的匹配。\s 强制模式继续搜索包含空格的匹配。这可以是“Sing”或其他组合（类似于贪婪的结果）。
    |

    | /(ha)?? | | 这个示例演示了为什么我们需要对懒惰修饰符保持谨慎。即使“ha”被忽略了，这同样是因为修饰符有这样做的选项。该版本的贪婪模式将匹配单词“ha”连续出现的次数，最少为零次。
    |


    ## 懒惰 {n} 次


    修饰符 {n}? 创建恰好 n 次匹配。功能上与之前讨论的许多懒惰修饰符相似，但它设置了固定的匹配次数。表 2.33 提供了示例。


    ### 表 2.33：使用 {n}? 的示例


    | 用法 | 匹配结果 |

    | :--- | :--- |

    | /1-800-\d{3,3}-\d{4,4}/ | "1-800-123-4567" |

    | /\d{1,2}-\d{1,2}-\d{2,4}/ | "10-20-1950" "8-30-52" "4-3-1979" |

    | /R\w{4}?/ | "Round" |


    ## 懒惰 n 次或多次


    修饰符 {n,?} 创建至少 n 次匹配，但仅执行创建匹配所需的最少次数。功能上与之前讨论的许多懒惰修饰符相似，但它设置了匹配次数的上限。表 2.34 提供了示例。


    ### 表 2.34：使用 {n,?} 的示例


    | 用法 | 匹配结果 | 注释 |

    | :--- | :--- | :--- |

    | /Sing\w{3,}?/ | “Singing” ... | 这恰好匹配 n=3 次。同样，通过赋予懒惰修饰符匹配最小次数的选项，它每次都会这样做。
    |

    | /0{2,5,?}/s | “0000” ... | 再次，我们看到模式上的 \s 创建了额外的匹配。\s 强制模式继续搜索包含空格的匹配。 |

    | /(ha{4,}?/ | “hahaha” | 这恰好匹配 n=4 次。 |


    ## 懒惰 n m 次


    修饰符 {n,m}? 创建至少 n 次但不超过 m 次的匹配——在该范围内仅执行创建匹配所需的最少次数。功能上与之前讨论的许多懒惰修饰符相似，但它设置了匹配次数的上限。表
    2.35 提供了示例。


    ### 表 2.35：使用 {n,m}? 的示例


    | 用法 | 匹配结果 | 注释 |

    | :--- | :--- | :--- |

    | /Read\w{1,3,?}/ | “Ready” ... | 这恰好匹配 n=1 次。同样，通过赋予懒惰修饰符匹配最小次数的选项，它每次都会这样做。
    |

    | /0{2,5,?}/s | “0000” ... | 再次，模式被“锚定”在第一个 0 出现处，捕获存在的最小次数，直到最大次数。 |

    | \sha(ha){0,6}? | “ha” | 通过在“锚定”点之后没有供模式匹配的内容，因此没有额外的匹配内容。懒惰修饰符在最小的 n=0 次后就停止了。
