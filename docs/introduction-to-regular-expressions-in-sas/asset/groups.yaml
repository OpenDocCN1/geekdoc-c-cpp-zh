    # 3.3.2 CALL PRXPOSN


    # Description


    This routine takes the RegEx_ID provided by PRXPARSE and the numerical capture
    buffer position N as inputs. It produces the matching Position and Length as outputs.


    # Syntax


    ```

    CALL PRXPOSN(RegEx_ID, N, Position, Length)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    N: Integer value for the capture buffer (input argument, required)


    Position: Integer value of the character position for the first character in the
    matched pattern (returned value, required),


    Length: Integer value for the length of the matched pattern (return value, optional)


    This routine takes the RegEx_ID (RegEx is not allowed!) and capture buffer, and
    returns the exact locations where it occurs in the most recent match. Match results
    from PRXMATCH, PRXCHANGE, PRXSUBSTR, or CALL PRNEXT (discussed in Section 3.3.4)
    must exist in order for CALL PRXPOSN to work properly. We then must use the SUBSTR
    function to extract the identified text.'
  - "[PAGE 68]\n\n# Example 3.9: Context-specific Algorithm Development\n\nSometimes\
    \ it's useful to condition code behavior on specific words occurring in text.\
    \ In this example, you'll see how the functionality of CALL PRXPOSN can be used\
    \ in combination with PRXPAREN, PRMATCH, PRXPARSE, and SUBSTR to do just that.\n\
    \nFirst, we create the RegEx_ID using PRXPARSE, which is passed to PRMATCH. If\
    \ a result from PRMATCH exists (i.e., a pattern match is found), then we determine\
    \ if the capture buffers in the pattern is matched by PRXPAREN. The output of\
    \ PRXPAREN is used as input to the CALL PRXPOSN routine to create the Position\
    \ and length. SUBSTR is used to extract the specific text. We then print a message,\
    \ displaying on the buffer. See the result in Output 3.9.\n\n```\ndata null_;\n\
    input text $50;\nRegEx_ID=prxparse('/((Dog) | (Rat) | (Cat))/o');\n\nif prmatch(RegEx_ID)\
    \ then do\n  paren=prparen(RegEx_ID);\n  CALL PRXPOSN(RegEx_ID, paren, position,\
    \ length);\n  buffer = substr(text, position, length);\n  put 'I matched capture\
    \ ' paren 'with ' buffer;;\nend;\n\nelif paren=2 then put 'I love dogs!'\nelse\
    \ put 'I cannot stand a ' buffer'';';\n\ndatalines;\nThe Cat in the Hat\nThe Rat\
    \ in the Hat\nThe Dog on the Roof\n\nrun;\n```\n\n# Output 3.9: Log Output of\
    \ Code Behavior\n\nI added the additional commentary about cats, rats, and dogs\
    \ to show a second way to perform conditioning on the parsed text. Obviously,\
    \ you could perform more interesting things, and it should be fun to experiment\
    \ with in the future. We use this concept in the next chapter to build out some\
    \ interesting functionality.\n\n| matched capture buffer 4 with Cat |\n| cannot\
    \ stand a Cat ! |\n| matched capture buffer 3 with Rat |\n| cannot stand a Rat\
    \ ! |\n| matched capture buffer 2 with Dog |\n| I love dogs! |"
- md: "\n## 3.3.3 CALL PRXSUBSTR\n\n### Description\n\nThis routine takes RegEx_ID\
    \ and Source_Text as inputs, and returns Position and Length as outputs. Using\
    \ the actual RegEx is not an option.\n\n### Syntax\n\n```\nCALL PRXSUBSTR(RegEx_ID,\
    \ Source_Text, Position, Length)\n```\n\n- RegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\n- Source_Text: The text to be operated\
    \ upon (input argument, required)\n- Position: Integer value for the character\
    \ position for the first character in the matched pattern (returned value, required)\n\
    - Length: Integer value for the length of the matched pattern (returned value,\
    \ optional)\n\nThis call is used extensively in Information Extraction applications\
    \ like those discussed in Chapter 4. Since only the position and length of matches\
    \ are identified by CALL PRXSUBSTR, it must be used in conjunction with a function\
    \ like SUBSTR to extract the actual text.\n\n### Example 3.10: Information Extraction\n\
    \nIn this example, we revisit the non-familiar example code from Chapter 2. It\
    \ is a great example of how you can leverage the CALL PRXSUBSTR\n\nThe code creates\
    \ a RegEx pattern to search for all occurrences of \"Smith\" in our source text.\
    \ It then generates a RegEx_ID using PRXPARSE. The code then uses CALL PRXSUBSTR\
    \ to search through source text with the provided pattern and return the position\
    \ and length of matching text. As you know, this could have been a much more complex\
    \ pattern, but the simplicity helps to highlight the functionality we are focused\
    \ on. After the call, the code checks to see whether the variable (Position) is\
    \ 0, which is the default value indicating it did not find a match. If a position\
    \ exists, the code proceeds to use SUBSTR to capture text from the source using\
    \ the position and length obtained by CALL PRXSUBSTR. Results are then output\
    \ to the log.\n\n```\ndata _NULL;\npattern = \"Smith/\\\nend;\ndatalines;\nSmith,\
    \ BOB A.\nROBERT Allen Smith\nSithe, Cindy\n103 Pennsylvania Ave. NW, Washington,\
    \ DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st St NE, Washington,\
    \ DC 20002\n3000 K Street NW, Washington, DC 20007\n1560 Wilson Blvd, Arlington,\
    \ VA 22209\n1-800-123-4567\n1 (800) 789-1234\n;\nrun;\n```\n\nAs we expected,\
    \ the output shows the various occurrences of \"Smith\" from within the provided\
    \ data lines. This example brings us circle with the above code, pulling all of\
    \ the pieces together.\n\nOutput 3.10: Log Results for \"Smith\"\n\n```\n\"Smith\"\
    \ found in \"Smith, BOB A.\"\n\"Smith\" found in \"ROBERT Allen Smith\"\n\"Smith\"\
    \ found in \"Sithe, Cindy\"\n```\n\n## 3.3.4 CALL PRXNEXT\n\n### Description\n\
    \nThis routine searches through Source_Text, between the Start and Stop positions,\
    \ for the pattern associated with RegEx_ID. It returns the Position and Length\
    \ of the location.\n\n### Syntax\n\n```\nCALL PRXNEXT(RegEx_ID, Start, Stop, Source_Text,\
    \ Position, Length)\n```\n\n- RegEx_ID: Unique RegEx identifier returned by PRXPARSE\
    \ (input argument, required)\n- Start: Numerical constant, variable, or expression\
    \ containing the starting character position to begin the search (input argument,\
    \ required)\n- Stop: Numerical constant, variable, or expression containing the\
    \ last character position to use in the search. If the value is -1, the stop position\
    \ becomes the last non-blank character position in the search. (input argument,\
    \ required)\n- Source_Text: The text to be operated upon (input argument, required)\n\
    - Position: Integer value of the character position for the first character in\
    \ the matched pattern (returned value, required)\n- Length: Integer value for\
    \ the length of the matched pattern (returned value, required)\n\nThis call routine\
    \ can be used for two applications:\n\n1. searching for a pattern within a defined\
    \ range\n2. searching for a pattern iteratively throughout text, including multiple\
    \ occurrences per line\n\nThe first application of CALL PRXNEXT is a straightforward\
    \ implementation of the routine’s parameters. However, the second usage is less\
    \ apparent from its definition. Therefore, we focus on that usage of the routine\
    \ in our example.\n\n### Example 3.11: Pattern Matching Multiple Times per Line\n\
    \nBeing able to identify a pattern number of times in a particular line of text\
    \ is valuable for many practical applications. For example, performing word counts\
    \ clearly clears this ability for accurate counts to be obtained.\n\nThe code\
    \ below shows how to USE PRXNEXT to identify multiple occurrences of our pattern\
    \ on each row from the data-lines source. The pattern is defined to match any\
    \ string that is three characters (w) in length and ends with “w”. The Start and\
    \ Stop variables are initialized to character positions 1 and Length(some_data)\
    \ respectively. These variables must be provided with initial values for the routine’s\
    \ first use. However, subsequent calls reset the start position to the character\
    \ immediately following the most recent successful match. This is a fact that\
    \ we take advantage of the DO WHILE loop. If we were to eliminate the loop portion\
    \ of code, we would merely be searching for the pattern in a defined range (use\
    \ the above application #1), but having the loop allows us to achieve the desired\
    \ functionality (use the above application #2). See the results in Output 3.11.\n\
    \n```\ndata _NULL;\ninput some_data = $;\npattern_id = prxparse('/\\w{2}w/');\n\
    start = 1;\nstop = length(some_data);\ndo while (start <= stop);\n  pos = prxnext(pattern_id,\
    \ start, stop, some_data, pos, len);\n  if pos > 0 then do;\n    put substr(some_data,\
    \ pos, len);\n    start = pos + len;\n  end;\n  else stop = -1;\nend;\nrun;\n\
    ```\n*(Note: The OCR text for the code block was fragmented/broken in original;\
    \ I have reconstructed the logic based on SAS syntax and the context provided\
    \ in the text.)*\n\n## 3.3.5 PRXDEBUG\n\n### Description\n\nThis routine is used\
    \ to perform debugging of all PRX functions, and accepts only one input.\n\n###\
    \ Syntax\n\n```\nCALL PRXDEBUG (ON-OFF)\n```\n\n- ON-OFF: Numerical constant,\
    \ variable, or expression. If it equals 0, then debugging is turned, and any positive\
    \ value turns it on. (input argument, required)\n\nThis routine prints step-by-step\
    \ output to the log, enabling a-level understanding of any PRX function. However,\
    \ be prepared–this routine can create voluminous output. It is best to use it\
    \ in a targeted way at first in order to understand. If we were to use this for\
    \ an entire program, we should be ready to deal very amounts of output, which\
    \ is an inefficient approach to diagnosing issues. It is best to perform using\
    \ diagnostics.\n\n### Example 3.12: Debugging the PRXPARSE Function\n\nIn keeping\
    \ with our goal of using CALL PRXDEBUG in a targeted debug code, we are going\
    \ to apply it only to the PRXPARSE function in the code. Notice that we have to\
    \ turn it in and off at different points in the code to identify the segment to\
    \ want our debug. See the results in Output 3.12.\n\n```\ndata null_;\ninput text\
    \ $50;\n\nCALL PRXDEBUG(1);\nRegEx_ID=prparse('/((Dog) | (Rat) | (Cat))/o';\n\
    CALL PRXDEBUG(0);\n  if prxmatch(RegEx_ID, text) then do\n    paren=prxPOSN(RegEx_ID),\
    \ paren, pos, len;\n    CALL PRXPOSN(RegEx_ID);\n    buffer = substr(text, pos,\
    \ len);\n    put ' matched capture buffer ' paren 'with ' buffer;\n  end;\n  if\
    \ paren=2 then put 'I love dogs!';\n  else put 'I cannot stand a ' buffer'!!';\n\
    run;\ndatalines;\nThe Cat in the Hat\nThe Rat in the Hat\nThe Dog on the Roof\n\
    run;\n```\n\n### Debugging Information Printed to the Log\n\nReviewing the output\
    \ in Output 3.12, we see that the debugging information for just a single PRX\
    \ function can be quite large, thus reinforcing our earlier point about limiting\
    \ the scope of CALL PRXDEBUG.\n"
  mdcn: "\n\n## 3.3.3 CALL PRXSUBSTR\n\n### Description\n\n此程序接受 `RegEx_ID` 和 `Source_Text`\
    \ 作为输入，并返回 `Position` 和 `Length` 作为输出。直接使用实际正则表达式是不可行的。\n\n### 语法\n\n```\nCALL\
    \ PRXSUBSTR(RegEx_ID, Source_Text, Position, Length)\n```\n\n- RegEx_ID: 由 `PRXPARSE`\
    \ 返回的唯一正则表达式标识符（输入参数，必需）\n- Source_Text: 需要进行操作的文本（输入参数，必需）\n- Position: 匹配模式中第一个字符的字符位置的整数值（返回值，必需）\n\
    - Length: 匹配模式的长度的整数值（返回值，可选）\n\n此调用被广泛用于信息提取（Information Extraction）应用中，正如在第\
    \ 4 章中讨论的句样。由于 `CALL PRXSUBSTR` 只能识别匹配的位置和长度，因此它必须配合 `SUBSTR` 等函数使用，以提取实际文本。\n\
    \n### 示例 3.10：信息提取\n\n在此示例中，我们重新审视了第 2 章中不熟悉的示例代码。它是展示如何利用 `CALL PRXSUBSTR` 的绝佳示例。\n\
    \n该代码创建了一个正则表达式模式，用于在源文本中搜索所有出现的 \"Smith\" 随后，它使用 `PRXPARSE` 生成一个 `RegEx_ID`。接着，代码使用\
    \ `CALL PRXSUBSTR` 根据提供的模式搜索源文本，并返回匹配文本的位置和长度。如你所知，这本是一个复杂得多的模式，但简单性有助于突出我们关注的功能。调用后，代码会检查变量（`Position`）是否为\
    \ 0，0 是表示未找到匹配项的默认值。如果存在位置，代码将继续使用 `SUBSTR` 根据通过 `CALL PRXSUBSTR` 获取的位置和长度从源中捕获文本。然后将结果输出到日志（log）。\n\
    \n```\ndata _NULL;\npattern = \"Smith/\\\nend;\ndatalines;\nSmith, BOB A.\nROBERT\
    \ Allen Smith\nSithe, Cindy\n103 Pennsylvania Ave. NW, Washington, DC 20216\n\
    508 First St. NW, Washington, DC 20001\n650 1st St NE, Washington, DC 20002\n\
    3000 K Street NW, Washington, DC 20007\n1560 Wilson Blvd, Arlington, VA 22209\n\
    1-800-123-4567\n1 (800) 789-1234\n;\nrun;\n```\n\n正如正如我们预期的，输出显示了从提供的数据行中出现的各种\
    \ \"Smith\" 情况。这个示例让我们与上述代码闭环，将所有部分整合在一起。\n\n输出 3.10：\"Smith\" 的日志结果\n\n```\n\"\
    Smith\" found in \"Smith, BOB A.\"\n\"Smith\" found in \"ROBERT Allen Smith\"\n\
    \"Smith\" found in \"Sithe, Cindy\"\n```\n\n## 3.3.4 CALL PRXNEXT\n\n### Description\n\
    \n此程序在 `Source_Text` 中在 `Start` 和 `Stop` 位置之间搜索与 `RegEx_ID` 关联的模式。它返回位置的 `Position`\
    \ 和 `Length`。\n\n### 语法\n\n```\nCALL PRXNEXT(RegEx_ID, Start, Stop, Source_Text,\
    \ Position, Length)\n```\n\n- RegEx_ID: 由 `PRXPARSE` 返回的唯一正则表达式标识符（输入参数，必需）\n\
    - Start: 包含开始搜索的起始字符位置的数值常数、变量或表达式（输入参数，必需）\n- Stop: 包含在搜索中使用的最后一个字符位置的数值常数、变量或表达式。如果该值为\
    \ -1，则停止位置将变为搜索中最后一个非空字符的位置。（输入参数，必需）\n- Source_Text: 需要进行操作的文本（输入参数，必需）\n- Position:\
    \ 匹配模式中第一个字符的字符位置的整数值（返回值，必需）\n- Length: 匹配模式的长度的整数值（返回值，必需）\n\n此调用程序可用于两个应用：\n\
    \n1. 在定义范围内搜索模式\n2. 在整个文本中迭代搜索模式，包括每行中的多次出现情况\n\n`CALL PRXNEXT` 的第一个应用是该程序参数的直接实现。然而，第二种用法从其定义来看并不直观。因此，我们在示例中重点关注程序的这种用法。\n\
    \n### 示例 3.11：每行进行多次模式匹配\n\n在特定特定行中识别多次模式的能力对于许多实际应用是有价值的。例如，执行词数统计显然需要这种能力来获得准确的计数。\n\
    \n下面的代码展示了如何使用 `PRXNEXT` 来识别来自 `data-lines` 源的每行中我们模式的多次出现。该模式定义为匹配任何长度为三个字符（w）且以“w”结尾的字符串。`Start`\
    \ 和 `Stop` 变量分别初始化为字符位置 1 和 `Length(some_data)`。在程序第一次使用时必须为这些变量提供初始值。然而，随后的调用会将起始位置重置为最近一次成功匹配后的下一个字符。这是我们利用\
    \ `DO WHILE` 循环的客观事实。如果我们消除代码中的循环部分，我们仅仅是在定义范围内搜索模式（使用上述的应用 #1），但使用循环允许我们实现所需的功能（使用上述的应用\
    \ #2）。请参见输出 3.11 中的结果。\n\n```\ndata _NULL;\ninput some_data = $;\npattern_id =\
    \ prxparse('/\\w{2}w/');\nstart = 1;\nstop = length(some_data);\ndo while (start\
    \ <= stop);\n  pos = prxnext(pattern_id, start, stop, some_data, pos, len);\n\
    \  if pos > 0 then do;\n    put substr(some_data, pos, len);\n    start = pos\
    \ + len;\n  end;\n  else stop = -1;\nend;\nrun;\n```\n*注：原始代码块的 OCR 文字是破碎的，我已根据上下文重构了逻辑。*\n\
    \n## 3.3.5 PRXDEBUG\n\n### Description\n\n此程序用于对所有正则表达式函数进行调试，仅接受一个输入。\n\n###\
    \ 语法\n\n```\nCALL PRXDEBUG (ON-OFF)\n```\n\n- ON-OFF: 数值常数、变量或表达式。如果它等于 0，则关闭调试，任何正值将其开启。（输入参数，必需）\n\
    \n此程序向日志打印逐步的输出，以便对任何正则表达式函数进行深入理解。然而，请做好准备——此程序会产生大量的输出。起初最好针对性地使用它。如果我们对整个程序使用它，我们应该准备好处理大量的输出，这是一种低效的问题诊断。最好通过诊断进行。\n\
    \n### 示例 3.12：调试 PRXPARSE 函数\n\n与在目标调试代码中使用 `CALL PRXDEBUG` 的目标一致，我们将仅将其应用于代码中的\
    \ `PRXPARSE` 函数。注意，我们在代码的不同点开启和关闭它，以识别想要调试的片段。请参见输出 3.12 中的结果。\n\n```\ndata null_;\n\
    input text $50;\n\nCALL PRXDEBUG(1);\nRegEx_ID=prparse('/((Dog) | (Rat) | (Cat))/o';\n\
    CALL PRXDEBUG(0);\n  if prxmatch(RegEx_ID, text) then do\n    paren=prxPOSN(RegEx_ID),\
    \ paren, pos, len;\n    buffer = substr(text, pos, len);\n    put ' matched capture\
    \ buffer ' paren 'with ' buffer;\n  end;\n  if paren=2 then put 'I love dogs!';\n\
    \  else put 'I cannot stand a ' buffer'!!';\nrun;\ndatalines;\nThe Cat in the\
    \ Hat\nThe Rat in the Hat\nThe Dog on the Roof\nrun;\n```\n\n### 打印到日志的调试信息\n\n\
    查看输出 3.12 中的输出，我们看到仅仅是单个正则表达式函数的调试信息也可以非常大，这进一步证实了我们之前限制 `CALL PRXDEBUG` 范围的观点。\n\
    \n"
