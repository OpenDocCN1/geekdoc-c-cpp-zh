    # Chapter 3: Using Regular Expressions in SAS


    The first line denotes a RegExp within the PRXPARSE function. The next line shows
    the compiled RegExp size and starting location for the lines that follow. Specifically,
    the size of 26 refers to the 26 lines of compiled RegExp code (numbers on the
    line with a trailing semi-colon); and first refers to the first line of execution
    code. The numbers in parentheses to the right of each line correspond to labels
    for compiled RegExp (these labels work like our pseudo code labels in Chapter
    2).


    Lines 1 through 26 are the compiled steps within our RegExp, and they become easy
    to follow once we understand what each represents. For instance, the various OPEN
    and CLOSE statements correspond to our opening and closing pairs; BRANCH commands
    to the OR tests between the three parenthesis pairs; and EXACT is for the string
    literal match of the associated word. END obviously means the end of the subroutine.


    The remaining output is just the result of our code running normal. Should our
    code be malfunctioning, we would not likely see such normal output when calling
    PRXDEBUG.


