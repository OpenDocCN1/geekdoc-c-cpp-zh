    # 2.5.2 Repetition Modifiers


    Repetition modifiers change the matching repetition behavior of the metacharacters
    and characters immediately preceding them in a pattern. They can also modify the
    matching repetition of an entire group—defined using () to surround the group
    of metacharacters and characters before the modifier. Just keep in mind that repetition
    of the entire group means that it repeats-to-back (e.g., "haha\ unless we also
    modify the individual metacharacters.


    Now, there are two types of repetition modifiers, *greedy* and *lazy*. Lazy modifiers
    attempt to find as few matches as possible within the confines of their definition.
    Greedy modifiers attempt to find as many matches as possible. They have similar
    uses, which can make the difference between their results subtle.


    # Introduction to Greedy Repetition Modifiers


    Let''s start by discussing greedy modifiers because they are a little intuitive
    to use. As we go through the examples, it is important to keep in mind that greedy
    match as many times as possible—constantly searching for the last possible time
    match is still true. It is easy to create patterns that match differently from
    what you might expect.


    There is a concept in RegEx known as backtracking, which is the root cause for
    potential issues with greedy modifiers (hint: backtracking in the need for lazy
    modifiers). As we discuss further when we examine lazy modifiers, a greedy modifier
    actually tries to maximize the matches of a modified pattern chunk by searching
    until the match fails. Upon failure, the system backtracks to the position where
    the modified chunk matched. The processing wasted with backtracking for a single
    match is insignificant. However, as soon as we introduce a few additional factors,
    the problem can waste tremendous computing cycles—multiple pattern chunks, numerous
    match'
  - '[PAGE 39]


    iterations (think loops), and large data sources. It is important to be mindful
    of these factors when

    designing patterns as they can have unintended consequences.


    # Greedy 0 or More


    The modifier * requires the immediately preceding character or metacharacter to
    match 0 or more times.

    It enables us to generate unlimited optional matches within text. For example,
    we might want to match

    every occurrence of a word root, with all of its prefixes and suffixes. By allowing
    the prefixes

    suffixes to be optional, we are able to achieve this goal. Table 2.24 provides
    examples.


    Table 2.24: Examples using *


    | Usage | Matches |

    |---|---|

    | /Sing/w*/ | "Sing" "Sings" "Singing" "Singer" "Singers" ... |

    | /D\W\C\W*/ | "DC" "D.C" "D C" "D...!$%\ C.-)*&%% ... |

    | /19D+Street/ | "19th Street" "19th "19Street" ... |

    | /Hello*/ | "Hell" "Hello" "Hellooooooooo ... |


    # Greedy 1 or More


    The modifier + requires the immediately preceding character or metacharacter to
    match 1 or more times.

    The plus sign modifier works similarly to the asterisk modifier, with the exception
    that it enforces a

    match of the metacharacter or at least 1 time. Table 2.25 provides examples.


    Table 2.25: Examples using +


    | Usage | Matches |

    |---|---|

    | /Ru/w+/ | "Run" "Ruin" "Run" "Runners" ... |

    | /sU[a-z]+E/s/ | Words with all letters capitalized, and surrounded by spaces.
    |

    | /19D+Street/ | "19th Street" "19...Street" ... |

    /(ha)+ | "hahahhahahahahaha" ... |


    Pay attention to the addition of the \s metacharacter in the second example in
    Table 2.24. If it

    were not, the pattern would also match only single letters at the beginning of
    words.

    By adding \s, the pattern creates a whitespace character to immediately follow
    the one or more

    character, eliminating matches on single letters at the beginning of words.


    # Greedy 0 or 1 Time


    The modifier ? creates a match of 0 or 1 time. The question mark provides the
    ability to make the

    occurrence of a metacharacter optional without allowing it to match multiple times.
    This can be effective'
  - '[PAGE 40]


    matching word pairs that have inconsistent use of dashes or spaces (e.g., short-term
    vs. short term).

    Table 2.26 provides examples.


    **Table 2.26: Examples using ?**


    | Usage | Matches |

    | :--- | :--- |

    | /\D?800\D?23\D?4567/ | "1-800-123-4567" "18001234567" ... |

    | /1560sWilson\sBvd\W?/ | "1560 Wilson Blvd." "1560 Wilson Blvd" ... |

    | /19th?sStreet/ | "19th Street" "19th Street" ... |


    # Greedy n Times


    The modifier [n] creates a match of exactly n times. Being able to match on exactly
    n times is the same as using that metacharacter out many times. However, from
    the perspective of coding and maintaining the RegEx patterns, using the modifier
    is a much better approach. It limits the opportunity to make typographical errors
    when initially creating the RegEx pattern, and it improves readability when later
    editing and sharing the patterns. Table 2.27 provides examples.


    **Table 2.27: Examples using {n}**


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{3}-d{4}/ | "1-800-123-4567" "1.800.123.4567" ... |

    | /Rw{4}/ | "Round" "Runts" "Ruins" ... |

    | /19D{3}Street/ | "19th Street" "19thStreet" "19...Street" ... |

    | /d{5,}-d{4}(d{5})/ | "12345-6789" "12345" ... |


    # Greedy n or More


    The modifier [n,] creates a match at least n times. By ensuring that we can match
    at least n times, we are able to create functionality very similar to the plus
    modifier. However, we are raising the minimum number of times that the metacharacter
    must match. This is quite useful for certain applications, but must be handled
    with caution. Also, the + + modifier can easily get very long strings of unanticipated
    matches due to a single logical error in pattern construction. Table 2.28 provides
    examples.


    **Table 2.28: Examples using {n,}**


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{1,-}-d{2}/ | "1-800-123-4567" "1-800-789-12" ... |

    | /d{3,}-d{2},-d{4}/ | "143-25-7689" "123456789-54654564-9820" ... |

    | /19D{3}Street/ | "19th Street" "19th, Not My Street" ... |'
