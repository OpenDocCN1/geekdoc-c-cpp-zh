    \ variety of possible sources from which we might need to extract information,\
    \ as well as the wide array of end goals for the information, there are a number\
    \ of approaches to accomplishing this task. Given the proliferation of tag-based\
    \ languages such as HTML and XML, we need to be prepared to effectively extract\
    \ information from them.\n\nNow, due to the semi-structured nature of tag-based\
    \ languages, they are certainly easier to process than one might anticipate. All\
    \ such languages have paired opening and closing tags for defining various pieces\
    \ of information. We can leverage this to properly dissect and extract the information\
    \ we need.\n\nWith more sophisticated techniques at our disposal (like using the\
    \ SAS macro facility), we could actually “learn” the embedded elements and extract\
    \ the data associated with the discovered variables. However, emphasis on these\
