    # 2.6.5 Substitution Operator


    The substitution operator s// is not technically an option, it belongs here if
    only because it truly stands apart from the other items discussed in this section.
    Although the substitution operation is similar in appearance to the other, it
    fundamentally changes the RegEx activity from a matching operation to a match-and-replace
    operation. "s" in front of the surrounding slashes (/) signifies that the pattern
    is being used to replace the text and inserting the accompanying replacement text.
    This is another peek additional functionality that is explored in the next chapter
    with SAS functions. Once a pattern is matched, we can do a variety of things with
    that information. Great analogy for how this works is the find-and-replace functionality
    provided by many word processing applications—except this is much more powerful.
    Also, notice that there is a third slash in the examples below (in the middle
    of the patterns). That additional slash denotes where the matching portion of
    the RegEx ends and the replacement portion begins. And notice something important
    in the example: everything is a string literal. Right, all the characters between
    the second and third slash are treated as characters. Table 2.39 provides some
    examples, but we cover this in detail in the next chapter, where we also discuss
    how to insert more than character strings.


    Table 2.39: Examples using s//


    | Usage | Matches | Replace with |

    | --- | --- | --- |

    | s/Stop/Go/ | "Stop" | "Go" |

    | s/Sing/Read/ | "Sing" | "Read" |

    | s/1?(800))?-s?/1-800-/ | "1 (800) - ..." | "1-800-" |


    Note: This is a more advanced function that your test case is not set to. You''ll
    need to accept as true until we use it with some SAS code in the next chapter.


    # 2.7 Zero-width Metacharacters


    Zero-width characters, often called positional characters, are not matched in
    isolation because they do not have a width. They are used as an additional piece
    of information for making a pattern match.'
  - '[PAGE 48]


    There are numerous examples for how these zero-width characters can be used. For
    instance, perhaps you want to match a particular word, but only if it occurs at
    the beginning of a line.


    # 2.7.1 Start of Line


    The metacharacter ^ matches the beginning of the line or string. Depending on
    the text that we are processing, we might know a priori that a new line signifies
    something specific. For example, we might be looking for the beginning of a new
    paragraph, which could be denoted by a new line in combination with a capital
    letter and no preceding white space. Or we might need to be prepared to match
    an address that includes a new line for the city, state, and zip. Table 2.40 provides
    examples.


    Table 2.40: Example using ^


    | Usage | Matches |

    | --- | --- |

    | /^Washington, DC 20007/ | Washington, DC 20007 |

    | /^\w+\b/ | The first word in a string. |


    **Note:** This metacharacter is often used as the logical NOT symbol, including
    within the character class metacharacters discussed in Section 2.3 and in SAS
    code. So be careful not to get confused in its usage when shifting between contexts.


    # 2.7.2 End of Line


    The metacharacter $ matches the end of a line or string. There are numerous situations
    in which this might become relevant, similar to the reasons for the ^ metacharacter.
    Table 2.41 provides examples.


    Table 2.41: Example using $\$


    | Usage | Matches |

    | --- | --- |

    | /3000 K Street NW,$/ | "3000 K Street NW |

    | /\d+?\\d{2}\s*$/ | "$150.52 |


    # 2.7.3 Word Boundary


    The metacharacter \b matches a word boundary. The \b RegEx assertion metacharacter
    is zero-width because it actually represents the invisible gap between characters,
    with a \w on one side and \W on the other. Therefore, when you use this metacharacter,
    you won''t generate matches that contain the associated non-word character. Table
    2.42 provides examples.'
  - "[PAGE 49]\n\nTable 2.42: Example using \\b\n\n| Usage | Matches |\n| --- | ---\
    \ |\n| /Street/b/ | \"Street\" from the substrings, \"Street,\" \"Street \" ...\
    \ \n But does NOT match from the substrings \"Streets\" etc. |\n| \\b8\\d{2}\\\
    b/ | \"888\" from the substrings \"(800)\" \"-888-\\ ... \n But does NOT match\
    \ from the substrings \"18002\" ... |\n| \\bU[a-z]+E\\b/ | Words in all caps.\
    \ Without the second \\b, the output would also include single capitalized letters\
    \ from the front of a word. |\n\n# 2.7.4 Non-word Boundary\n\nThe metacharacter\
    \ \\b matches a non-word boundary (i.e., anywhere \\b does not match). This is\
    \ especially useful for matching root words or substrings without including the\
    \ surrounding pieces of information. Table 2.43 provides examples.\n\nTable 2.43:\
    \ Examples using \\b\n\n| Usage | Matches |\n| --- | --- |\n| /read/B/ | \"read\"\
    \ from the substrings, \"reads\" \"reading\" \"reader\" ... \n But does NOT match\
    \ from the substring \"read\" |\n| /Bun/b/ | \"un\" from the substrings, \"fun\
    \ \" \"rerun,\" \"gun,\" ... \n But does NOT match from the substring \"un\" |\n\
    | \\b[a-zA-Z]{3,}\\b/ | Any word longer than three letters.\n\n# 2.7.5 String\
    \ Start\n\nThe metacharacter \\A matches the beginning of a string. Similar to\
    \ the word boundary metacharacter (<b), \\A occurs between two characters. It\
    \ also denotes when a string value occurs to its right with nothing to its left.\
    \ In the context of data lines (as in our test code for this chapter), that situation\
    \ occurs at the beginning of each line.\n\nHowever, suppose we have a more complex\
    \ task as stitching multiple strings of extracted text (stored in SAS variables).\
    \ In this context, \\A could be a key determining in what order to place or sort\
    \ them. However, for our test code, the \\A matches only on the beginning of each\
    \ data line, since each line is identified as the beginning of the string. This\
    \ is another one that you have to approach with a little bit of faith until we\
    \ start doing more interesting tasks in the next chapter. Table 2.44 provides\
    \ examples."
