    # 3.3.3 CALL PRXSUBSTR


    # Description


    This routine takes RegEx_ID and Source_Text as inputs, and returns Position and
    Length as outputs. Using the actual RegEx is not an option.


    # Syntax


    ```

    CALL PRXSUBSTR(RegEx_ID, Source_Text, Position, Length)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)

    Source_Text: The text to be operated upon (input argument, required)

    Position: Integer value for the character position for the first character in
    the matched pattern (returned value, required)

    Length: Integer value for the length of the matched pattern (returned value, optional)


    This call is used extensively in Information Extraction applications like those
    discussed in Chapter 4. Since only the position and length of matches are identified
    by CALL PRXSUBSTR, it must be used in conjunction with a function like SUBSTR
    to extract the actual text.


    # Example 3.10: Information Extraction


    In this example, we revisit the non-familiar example code from Chapter 2. It is
    a great example of how you can leverage the CALL PRXSUBSTR


    The code creates a RegEx pattern to search for all occurrences of "Smith" in our
    source text. It then generates a RegEx_ID using PRXPARSE. The code then uses CALL
    PRXSUBSTR to search through source text with the provided pattern and return the
    position and length of matching text. As you know, this could have been a much
    more complex pattern, but the simplicity helps to highlight the functionality
    we are focused on. After the call, the code checks to see whether the variable
    (Position) is 0, which is the default value indicating it did not find a match.
    If a position exists, the code proceeds to use SUBSTR to capture text from the
    source using the position and length obtained by CALL PRXSUBSTR. Results are then
    output to the log.


    ```

    data _NULL;

    pattern = "Smith/\

    ```'
