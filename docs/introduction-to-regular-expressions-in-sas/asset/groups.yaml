    \ | 1 | 80 | 0 | 0 |\n| 7 | Eric can be reached at: *REDACTED* | 1 | 76 | 0 |\
    \ 1 |\n| 8 | 508 First St NW, Washington, DC 20001 | 1 | 80 | 0 | 0 |\n\n## 3.3.2\
    \ CALL PRXN\n\n### 描述\n该例程接受 RegEx ID 和捕获缓冲区 N 作为输入。它产生 Position 和 Length 作为输出。\n\
    \n### 语法\n```sas\nCALL PRXN(RegEx ID, N)\n```\n- RegEx_ID: 由 PRXPARSE 返回的唯一正则表达式标识符（输入参数，必需）\n\
    - N: 捕获区的整数值（输入参数，必需）\n- Position: 模式字符位置的整数值（返回值，必需）\n- Length: 匹配模式长度的整数值（返回值可选）\n\
    \n## 示例 3.9：特定算法开发\n\n有时根据文本中出现的特定单词来限制代码行为是有用的。在这个示例中，你将看到如何将 CALL PRXN 的功能与\
    \ PRXREN、PRMATCH、PRXPARSE 和 SUBSTR 结合使用来实现。\n\n首先，我们使用 PRXPARSE 创建 RegEx_ID，并将其传递给\
    \ PRMATCH。如果存在 PRMATCH 的结果（即找到了模式匹配），我们就可以确定模式中的捕获缓冲区是否被 PRXREN 匹配。PRXREN 的输出用作\
    \ CALL PRXN 的输入以创建位置和长度。SUBSTR 用于提取特定文本。然后我们打印消息并显示缓冲区。\n\n```sas\ndata null_;\n\
    input text $50;\nRegEx_ID=prxparse('/((Dog) | (Rat) | (Cat))/o');\n\nif prmatch(RegEx_ID)\
    \ then do\n  paren=prparen(RegEx_ID);\n  CALL PRXPOSN(RegEx_ID, paren, position,\
    \ length);\n  buffer = substr(text, position, length);\n  put 'I matched capture\
    \ ' paren 'with ' buffer;;\nend;\n\nelif paren=2 then put 'I love dogs!'\nelse\
    \ put 'I cannot stand a ' buffer'';\n\ndatalines;\nThe Cat in the Hat\nThe Rat\
    \ in the Hat\nThe Dog on the Roof\n\nrun;\n```\n\n## 输出 3.9：代码行为的日志输出\n\n| matched\
    \ capture 4 with Cat |\n| cannot stand a Cat ! |\n| matched capture 3 with Rat\
    \ |\n| cannot stand a Rat ! |\n| matched capture 2 with Dog |\n| I love dogs!\
    \ |\n\n"
