    \ SAS 在我们的 PRX 代码背后执行的底层操作的最佳方法。\n\n`PRXDEBUG` 输出可以提供大量信息，但对调试输出更深层次的研究超出了本文的范围。有关调试输出及其含义的更多信息，请访问\
    \ SAS 支持网站。\n\n## 3.3.6 CALL PRXFREE\n\n### 描述\n\n此例程使用其唯一的 `RegEx_ID` 释放与正则表达式相关的内存资源。对该标识符的后续引用将返回缺失值。\n\
    \n### 语法\n\n```\nCALL PRXFREE(RegEx_ID)\n```\n\nRegEx_ID: 由 PRXPARSE 返回的唯一正则表达式标识符（输入参数，必需）\n\
    \n此例程用于释放特定 `RegEx_ID` 的内存，对于管理大型程序的内存变得非常重要。记住，尽管仅仅有一个数字标识符，但在 `RegEx_ID` 的构建背后发生了许多后续操作。（参见\
    \ `CALL PRXDEBUG`。）无论如何强调都不，SAS 仍然会在会话未被妥善处理时处理内存清理以避免内存泄漏。虽然 SAS 会话会结束，但在单个会话中可能会遇到内存限制。请非常有策略性地考虑每段代码中哪些\
    \ `RegEx_ID`（或任何其他变量）是必要的。\n\n### 示例 3.13：使用 CALL PRXFREE 释放内存\n\n为了演示 `CALL PRXFREE`\
