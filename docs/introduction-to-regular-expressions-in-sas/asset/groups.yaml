    these concepts at varying levels of sophistication. The primary goal here is to
    simply help you to see the utility for this information, and to begin thinking
    about ways to leverage it.


    # 1.4.1 Extract, Transform, and Load (ETL)


    ETL is a general set of processes for extracting data from its source, modifying
    it to best use it to fit your end needs, and loading it into a target location
    that needs (e.g., database, data store, warehouse). We''re going to be working
    with a fairly basic example to get started. Suppose although we have a SAS set
    of customer addresses that contains some quality issues. The method of recording
    the data is unknown to us, but visual inspection has revealed numerous occurrences
    of duplicate records, as in the table below. In this example, it is clearly the
    same with slightly different representations of the address and encoding for gender.
    But how do we fix problems automatically for all of the records?


    | First Name | Last Name | DOB | Gender | Street | City | State | Zip |

    |---|---|---|---|---|---|---||

    | Robert | Smith | 2/5/1967 | M | 123 Fourth Street | Fairfax, | VA | 22030 |

    | Robert | Smith | 2/5/1967 | Male | 123 Fourth Street | Fairfax | va | 22030
    |


    Using regular expressions, we can algorithmically standardize abbreviations, remove
    punctuation, and do much more to ensure that each record is directly comparable.
    In this case, regular expressions enable us to perform more effective record keeping,
    which ultimately impacts analysis and reporting.


    We can easily leverage regular expressions to ensure that each record adheres
    to institutional standards. We can make each occurrence of Gender "M/F" or "Male/Female,"
    make every instance of the Street variable "Street" or "st." in the address line,
    make each City variable include or exclude the comma, and abbreviate State as
    either caps or lowercase.


    This example is simple, but reveals the power of applying some basic data standardization
    techniques to data sets. By enforcing these standards we are then able to properly
    identify duplic references within the data set. In addition to making our analysis
    and reporting less error-prone, we can reduce data storage space and duplicative
    business activities associated with each record (for example, customer catalogs
    will be mailed out, using'
