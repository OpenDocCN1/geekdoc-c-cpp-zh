  - "[PAGE 91]\n\n# 78 Introduction to Regular Expressions in SAS\n\nThe primary concern\
    \ is effectively extract information from the known XML tags that contain data:\
    \ uri, release_number, release_date, and respondents. As you can see in the figure\
    \ above, there are other XML tags in the document, but they aren't relevant to\
    \ the task at hand. For instance, root and administrative_proceeding do not contain\
    \ data of the previously mentioned tags. They merely serve administrative functions\
    \ in the context of XML for properly organizing the information for consumption\
    \ by a system that reads XML directly.\n\n```\ndata SECFilings;\ninfile 'F:Introduction\
    \ to Regular Expressions with\nSAS\\Chapter_4_Example_administrative_proceedings_2009.xml'\n\
    length-lineen recl=500 pad;\nvarlen-lineen=0;\ninput source text $varying500.\
    \ varlen; \nformat ReleaseNumber $20. ReleaseDate $20. Respondents $500. URL $500;\n\
    start = ;\nstop = ;\nPattern_ID = PRXPARSE('/\\<(\\w+)>(.*?)</(\\w+)>/o');\nCALL\
    \ PRXNEXT(pattern_ID, start, stop, source_text, position, length)\nDO WHILE (position\
    \ > 0)\n tag = PRXOSN(pattern_ID,1, source_text);\n if tag='url' then PRXOSN(pattern_ID,2,\
    \ source_text);\n elsif tag='release_number' then ReleaseNumber = \nPRXOSN(pattern_ID,2,\
    \ source_text);\n elsif tag='release_date' then ReleaseDate = \nPRXOSN(pattern_ID,2,source_text);\n\
    \ elsif tag='respondents' then do;\n Respondents = PRXOSN(pattern_ID,2,source_text);\n\
    \ put releasenumber respondents url;\n end;\n retain URL ReleaseNumber ReleaseDate\
    \ Respondents;\n CALL PRXNEXT(pattern_ID, start, stop, source_text, position,\
    \ length);\n end;\nkeep ReleaseNumber ReleaseDate Respondents URL;\nrun;\nproc\
    \ data=secfilings;\nrun;\n```\n\n+   We begin bringing in data from our XML file\
    \ using the INFILE statement, using the length, LCREL, and pad options. (See the\
    \ SAS documentation for additional information about these options.) Next, using\
    \ the INPUT statement, data at positions 1-varlen in the Program Data Vector (PDV)\
    \ are assigned to source_text. Because we LCREL=500, we cannot capture more than\
    \ 500 bytes at one time, but we can capture less. The format $varying500.\n\n\
    +   Using the PRXPARSE function, we create a RegEx pattern identifier, Pattern_ID.\
    \ This RegExp matches a pattern that starts with an opening XML tag, containing\
    \ any number and variety of characters in the middle, and ends with a closing\
    \ XML tag."
