    # 附录 C：POSIX 元字符


    在整本书中，我们讨论了所有遵循 Perl 标准的元字符（由于 SAS 使用了这些字符，因此遵循 Perl 标准是行业事实上的标准）。在 SAS 环境中运行时，这些就是你需要的全部字符。然而，如果你需要将处理任务推送到
    SAS 之外的系统，无法保证它们始终有效，因为并不是所有系统都使用 Perl 语法（主要是旧系统）。


    注意：当你尝试这种更高级的应用时，请了解你正在使用的系统参数。你可能不需要更改正则表达式代码。本附录中描述的元字符的具体应用不在本文范围内，但此处提供给对此感兴趣的高级读者。例如，尽管我们没有涵盖，但在使用
    PROC SQL 进行数据库内模糊匹配时，可能需要 POSIX 元字符。


    ```

    [:alpha:]

    ```

    该元字符匹配任何字母字符，等于 [a-zA-Z]。


    ```

    [:^alpha:]

    ```

    该元字符匹配任何非字母字符，等于 [^a-zA-Z]。


    ```

    [:alnum:]

    ```

    该元字符匹配任何字母数字字符，等于 [a-zA-Z0-9]。


    ```

    [:^alnum:]

    ```

    该元字符匹配任何非字母数字字符，等于 [^a-zA-Z0-9]。


    ```

    [:ascii:]

    ```

    该元字符匹配任何 ASCII 字符，等于 [^177]（即：它不匹配 Unicode 字符）。


    ```

    [:^ascii:]

    ```

    该元字符匹配任何非 ASCII 字符，等于 [^177]（即：它匹配 Unicode 字符）。


    ```

    [:blank:]

    ```

    该元字符匹配任何空白字符。


    ```

    [:^blank:]

    ```

    该元字符匹配任何非空白字符。


    # 98 SAS 中的正则表达式


    ```

    [:cntrl:]

    ```

    该元字符匹配任何控制字符。


    ```

    [:^ctrl:]

    ```

    该元字符匹配任何非控制字符。


    ```

    [:digit:]

    ```

    该元字符匹配任何数字字符，等于 \d 或 [0-9]。


    ```

    [:^digit:]

    ```

    该元字符匹配任何非数字字符，等于 \D 和 [^0-9]。


    ```

    [:graph:]

    ```

    该元字符匹配任何可见字符，等于 [:alnum]:[:punct]。换句话说，如果你在纸上能看到它，它会被此元字符匹配。


    ```

    [:^graph:]

    ```

    该元字符匹配任何非打印字符，等于 [:^alnum]:[:punct]。如果你在纸上看不到它，它会被此元字符匹配。


    ```

    [:lower:]

    ```

    该元字符匹配任何小写字母字符，等于 [a-z]。


    ```

    [:^lower:]

    ```

    该元字符匹配任何非小写字母字符，等于 [^a-z]。


    ```

    [:print:]

    ```

    该元字符打印字符字符串——任何遇到的字符。


    ```

    [:^print:]

    ```

    该元字符不打印任何字符。


    ```

    [:punct:]

    ```

    该元字符匹配任何可见的标点符号或符号字符。


    ```

    [:^punct:]

    ```

    该元字符匹配任何可见的标点符号或符号字符。


    ```

    [:space:]

    ```

    该元字符匹配任何空白字符，等于 \s。


    ```

    [:^space:]

    ```

    该元字符匹配任何非空白字符，等于 \S。


    ```

    [:upper:]

    ```

    该元字符匹配任何大写字母字符，等于 [A-Z]。


    ```

    [:^upper:]

    ```

    该元字符匹配任何非大写字母字符，等于 [^A-Z]。


