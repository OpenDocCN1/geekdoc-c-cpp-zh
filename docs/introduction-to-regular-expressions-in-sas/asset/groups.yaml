    # 24 SAS 正则表达式简介


    ## 大写


    元字符 `\U` 匹配模式中的下一个字母是否为大写。它的功能与上述介绍的小写版本 `\l` 完全相同，但适用于大写字母。表 2.20 提供了示例。


    ### 表 2.20: 使用 \U 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | \\Uinc./ | "Inc." ... |

    | \\Ustreet\St./ | "Street" "St." ... |

    | \\Uave\|Uavenue,/ | "Ave." "Avenue," |


    ## 小写范围


    元字符 `\L...\E` 匹配 `\L` 和 `\E` 之间所有字符均为小写。在 `\L` 和 `\E` 之间输入的字符串将被强制仅匹配小写，即使输入的是大写字母。与元字符不同，`L...\E`
    还可以包含字符类和重复修饰。表 2.21 提供了示例。


    ### 表 2.21: 使用 \L...\E 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | \L[a-z0-9][a-z0-9][a-z0-9]\E/ | "sas" "abc" "123" ... |

    | \LTHE ARE LOWERCASE\E/ | "these are lowercase" |

    | R\L[a-z][a-z]\E/ | "Read" "Road" "Rode" "Ride" "Real" ... |


    注意：当对非字母字符应用大小写转换时，修饰符会被忽略。它不影响匹配。


    ## 大写范围


    元字符 `\U...\E` 在所有字符于 `\U` 和 `\E` 之间均为大写时创建匹配。同样，该元字符的功能与上述讨论的小写版本相同，但适用于大写字母。该元字符对于识别缩写或其他大写字母重要的文本非常有用。表
    2.22 提供了示例。


    ### 表 2.22: 使用 \U...\E 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | \U[a-z][a-z][a-z]\E/ | "SAS" "CIA" ... |

    | \U[a-z][a-z][a-z]\E\Institute\sInc\W/ | "SAS Institute Inc." ... |

    | \Uallcaps\E/ | "ALLCAPS " |


    # 第 2 章：开始使用正则表达式


    **注意**：注意在 `\L...E` 或 `\U...E` 元字符内部不允许使用其他元字符。换句话说，`\w` 不能替换上述字符类。


    ## 引用范围


    元字符 `\Q...E` 将 `\Q` 和 `\E` 内部的所有内容作为字符字符串匹配，禁用包括反斜杠在内的所有字符。在 `\Q...E` 内部不能使用元字符。该元字符提供的功能非常适合在包含大量保留字符的字符串中进行搜索，例如
    XML、服务器日志或 HTML。表 2.23 提供了示例。


    | 用法 | 匹配 |

    | :--- | :--- |

    | \Q<html name>\E/ | "<html name>" |

    | \Q(fx!) + f(y) = z\E/ | "f(x) + f(y) = z" |

    | \Q<!DOCTYPE HTML> <html lang="en-US">\E/ | "<!DOCTYPE HTML> <html lang="en-US">
    |


    ## 2.5.2 重复修饰符


    重复修饰符改变模式中紧邻其后的元字符和字符的匹配重复行为。它们还可以修改整个组的匹配重复——该组使用 `()` 包围修饰符之前的元字符和字符来定义。只需记住，整个组的重复意味着它会重复回（例如
    "haha"），除非我们同时也修改了单个元字符。


    现在有两种类型的重复修饰符：*贪婪的（greedy）*和*懒性的（lazy）*。懒性修饰符试图在定义范围内找到尽可能少的匹配。贪婪修饰符试图找到尽可能多的匹配。它们的用途相似，这可能导致结果之间产生细微差别。


    ## 贪婪重复修饰符简介


    让我们先从讨论贪婪修饰开始，因为它们使用起来比较直观。在查看示例时，请记住贪婪匹配会尽可能多次匹配——不断寻找最后一个可能的匹配点这一点仍然成立。很容易创建出与你预期不符的模式。


    正则表达式中有一个称为“回溯（backtracking）”的概念，这是贪婪修饰符潜在问题的根源（提示：回溯是需要懒性修饰符的原因）。随着我们的进一步讨论，贪婪修饰符实际上尝试使模式块的匹配最大化。失败后，系统会回溯到该块匹配的位置。对于单个匹配，回溯处理是微不足道的。然而，一旦我们引入几个额外因素，问题就会浪费计算周期（考虑循环）并影响大型数据源。


    ## 贪婪 0 或多次


    修饰符 `*` 要求紧邻其前的字符或元字符匹配零次或，这使得能够在文本中生成无限次匹配。例如，我们可能想要匹配每个单词及其所有前缀和后缀。通过允许后缀可选，我们能够实现这一目标。表
    2.24 提供了示例。


    ### 表 2.24: 使用 * 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | /Sing\w*/ | "Sing" "Sings" "Singing" "Singers" ... |

    | /\D\w*/ | "D" ... |

    | /19D\w*/ | "19th" ... |

    | /Hello\*/ | "Hell" ...


    ## 贪婪 1 或多次


    修饰符 `+` 要求紧邻其前的字符或元字符匹配一次或多次。它与星号修饰符类似，不同之处在于强制至少匹配一次。表 2.25 提供了示例。


    ### 表 2.25: 使用 + 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | /Ru+/ | "Run" "Ruin" "Runners" ... |

    | /\L[a-z][a-z]\E/ | "these are lowercase, and surrounded by spaces." |

    | /19D+\s | "19th Street" |

    | /(ha)+ | "hahahah" ... |


    注意表 2.24 中 `\s` 的添加。如果没有它，模式将只匹配单个字符。通过添加 `\s`，模式创建了匹配一次或多次空白。


    ## 贪婪 0 或 1 次


    修饰符 `?` 创建 0 次或 1 次匹配。问号提供了使出现次数可选。这可以有效匹配具有不一致空格的单词（例如 "short term"）。表 2.26 提供了示例。


    ### 表 2.26: 使用 ? 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | /\D?800\D?23?457/ | "1-800-123-457" "80023457" |

    | /1560Wilson\s?/ | "1560 Blvd" |

    | /19th?\s/ | "19th Street"


    ## 贪婪 n 次


    修饰符 `{n}` 创建 n 次匹配。精确匹配 n 次与使用该元字符相同。然而，从编码和维护正则表达式的角度来看，使用修饰符要好得多。它在最初创建模式时限制了拼写错误的机会，并在后期编辑和共享模式时提高了可读性。表
    2.27 提供了示例。


    ### 表 2.27: 使用 {n} 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | /1-800-d{3}-d{4}/ | "1-800-123-4567" |

    | /Ru{4}/ | "Round" "Runts" "Ruins" |

    | /19D{3}Street/ | "19th Street" "19thStreet" |

    | /d{5,}-d{4}(d{5})/ | "12345-6789" "12345" |


    ## 贪婪 n 或多次


    修饰符 `{n,}` 创建至少 n 次匹配。通过确保至少匹配 n 次，我们能够创建与加修饰符非常的功能。然而，我们提高了元字符必须匹配的最小次数。这对于某些应用程序非常有用，但必须小心。此外，由于模式构造中的单个逻辑错误，`++`
    修饰符很容易产生非常长的意外匹配字符串。表 2.28 提供了示例。


    ### 表 2.28: 使用 {n,} 的示例


    | 用法 | 匹配 |

    | :--- | :--- |

    | /1-800-d{1,}-d{2}/ | "1-800-123-4567" "1-800-789-12" ... |

    | /d{3,}-d{2},-d{4}/ | "143-25-7689" "123456789-54654564-9820" ... |

    | /19D{3}Street/ | "19th Street" |


    '
