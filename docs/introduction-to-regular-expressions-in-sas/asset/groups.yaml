- md: "\n## 3.2.2 PRXMATCH\n\n### Description\n\nPRXMATCH returns the numerical position\
    \ of the first character in the matched RegEx pattern. Additionally, it can be\
    \ used in IF statements to test for a pattern match without a variable assignment,\
    \ just like many other familiar SAS functions. The first argument to PRXMATCH\
    \ is either the RegEx or RegExp_ID. The second is the source text variable or\
    \ string literal.\n\n### Syntax\n\n```\nPosition = PRXMATCH(RegEx_ID or RegEx,\
    \ Source_Text)\n\nRegEx_ID: Unique RegEx identifier returned by PRXPARSE (input\
    \ argument, required if RegEx is not used)\nRegEx: The pattern to be matched (input\
    \ argument, required if RegEx_ID is not used)\nSource_Text: The text variable\
    \ or literal to be operated upon (input argument, required)\nPosition: Numerical\
    \ position variable assignment (output, required)\n```\n\nAs discussed with the\
    \ PRXPARSE function, RegEx patterns are compiled by SAS for use by other functions.\
    \ In addition to using the actual RegEx, PRXMATCH is able to leverage the previously\
    \ compiled RegEx via the RegEx ID in lieu of the RegEx itself. This allows us\
    \ to compile the RegEx once via the PRXPARSE function (using the /o option), minimizing\
    \ the associated computing cycles. Small savings in computing cycles can prove\
    \ significant when processing large volumes of text.\n\nThe two different methods\
    \ for leveraging RegEx patterns create significant flexibility in how PRXMATCH\
    \ can be used in practice. By not needing to compile the RegEx in advance, PRXMATCH\
    \ allows us to embed RegEx patterns throughout our code without extra memory allocation\
    \ required to maintain them for each loop through the DATA step. This is very\
    \ useful when you are using PRXMATCH in a dynamic way, as inside nested IF statements\
    \ where RegEx is used only when certain conditions are true. Depending on the\
    \ implementation, there are implications for speed as well as for memory usage.\n\
    \n### Example 3.2: Finding Strings in Source Text with PRXMATCH\n\nLet's try a\
    \ simple example to show how this function is used in practice. Suppose we want\
    \ to find a string as “Street” in a source text. The code below demonstrates how\
    \ we print the position of each occurrence to the log. Obviously, we need to do\
    \ more than just print the position in practice (such as by extracting or manipulating\
    \ the matched text), but this demonstrates the basic functionality of PRXMATCH.\n\
    \nThe PRXMATCH function is implemented in this code with RegEx as the first argument\
    \ and the datelines reference address as the second argument. The result is assigned\
    \ to the variable Position. The value of Position is written to the log using\
    \ the PUT statement.\n\nCount the character positions in the data lines. At what\
    \ position do we encounter the \"S\" in \"Street\" on the lines where they occur?\
    \ Comparing the results to Output 3.2, we find that PRXMATCH is returning the\
    \ position of \"S\" (i.e., the position for the first character in the pattern\
    \ match).\n\n```\ndata _NULL;\ninput address $50;\nposition = PRXMATCH('/Street/o',\
    \ address);\nif position = 0 then\n  do\n    put position=;\ndatalines;\n103 Pennsylvania\
    \ Ave NW, Washington, DC 20216\n508 First Street NW, Washington, DC 20001\n650\
    \ last St Ne, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\nend;\n\
    run;\n```\n\n#### Output 3.2: Log Printout for Positions of \"Street\"\n\n```\n\
    position=11\nposition=8\n```\n\n## 3.2.3 PRXCHANGE\n\n### Description\n\nThis\
    \ function searches for the pattern—provided in the first argument by either RegEx_ID\
    \ or RegEx—within the source text that is provided in the third argument. The\
    \ pattern is matched the number of times given in the second argument, Num_Times.\
    \ Upon finding each match, the function returns the changed text as required by\
    \ the Regex. If no match is found, PRXCHANGE returns the original text unchanged.\n\
    \n### Syntax\n\n```\nOutput_String = PRXCHANGE(RegEx_ID or RegEx, Num_Times, Input_String)\n\
    ```\n\nRegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument,\
    \ required if Regex not used)\n\nRegEx: The pattern to be matched (input argument,\
    \ required if RegEx_ID not used)\n\nNum_Times: Number of times the change is to\
    \ be applied (input argument, required). -1 forces the function to make the changes\
    \ as many times as the pattern occurs in the source text.\n\nInput_String: Input\
    \ text variable (input argument, required)\n\nOutput_String: Output text variable\
    \ assignment (output, required)\n\nJust like the PRXMATCH function, PRXCHANGE\
    \ is able to use the actual RegEx pattern or the RegEx_ID, providing significant\
    \ flexibility. The preferred use again depends on the desired application.\n\n\
    This function is very useful for data standardization, as you will see in more\
    \ advanced examples in the next chapter. We will work through two examples below\
    \ to demonstrate some basic functionality of the PRXCHANGE function, as well as\
    \ to demonstrate how to leverage the capture buffer concept introduced earlier.\n\
    \n### Example 3.3: Standardizing Data\n\nData standardization is a relatively\
    \ simple, yet powerful, capability provided by RegEx in SAS. PRXCHANGE enables\
    \ us to scrub our data source to ensure that each occurrence of a word or phrase\
    \ is exactly the same (or removed entirely). Output 3.3 for the results. Data\
    \ scrubbing becomes essentially important when you are attempting to perform advanced\
    \ applications such as text mining.\n\nFor instance, before doing any analysis,\
    \ we want to know that each occurrence of \"street\" is exactly the same.\n\n\
    ```\ndata NULL;\ninput address $50;\ntext = PRXCHANGE('/\\s+/(Street|St|st|...)\\\
    s+/St. /o',-1,address);\nput text;\ndatalines;\n103 Pennsylvania Ave NW, Washington,\
    \ DC 20216\n508 First Street NW, Washington, DC 20001\n650 last St Ne, Washington,\
    \ DC 20002\n3000 K Street NW, Washington, DC 20007\nrun;\n```\n\n#### Output 3.3:\
    \ Log with Updated Data\n\nimg/c58184a165246f0486b8350e0431fbb_57.png\n\n### Example\
    \ 3.4: Using the Capture Buffer\n\n**Note:** There are often a number of ways\
    \ to achieve the same outcome. Understanding the context of an application will\
    \ help you determine the RegEx pattern to use.\n\nRevisiting Example 3.3, suppose\
    \ we now want to also make the addresses available to a system that accepts only\
    \ comma separated values (CSV) files. This is a great opportunity to use the capture\
    \ buffer. With only a couple of minor changes, we can now process the data lines\
    \ to CSV ready.\n\nThe new line of code uses PRXCHANGE with a complex RegEx that\
    \ changes the address into the street, city, and ZIP code components. And we see\
    \ that the new line takes the output text as the input, instead of address. Doing\
    \ this allows us to make changes to the already changed text. If we were to use\
    \ address, we would merely update the original data lines.\n\n```\ndata NULL;\n\
    input address $50;\ntext = PRXCHANGE('/\\s+/(Street|St|st|...)\\s+/St. /o/',-1,address);\n\
    text2 = PRXCHANGE('/(\\.+?),*\\s+(\\w+)?*\\s+(\\w+)?*\\s+(\\d+)/$1, $2, $3\\n4/o',-1,text);\n\
    put text2;\ndatalines;\n103 Pennsylvania Ave NW, Washington, DC 20216\n508 First\
    \ St NW, Washington, DC 20001\n650 1st St NE, Washington, DC 20002\n3000 K Street\
    \ NW, Washington, DC 20007\nrun;\n```\n\n#### Output 3.4: Corrected Data in the\
    \ Log\n\nimg/c58184a1652486f0486b8350e0431fbb_58.png\n"
  mdcn: "\n\n## 3.2.2 PRXMATCH\n\n### Description\n\nPRXMATCH 返回匹配的正则表达式（RegEx）模式中第一个字符的数值位置。此外，它可以像许多其他熟悉的\
    \ SAS 函数一样，用于 IF 语句以测试模式匹配，而无需进行变量赋值。PRXMATCH 的第一个参数可以是 `RegEx` 或 `RegExExp_ID`。第二个参数是源文本变量或字符串字面量。\n\
    \n```\nPosition = PRXMATCH(RegEx_ID or RegEx, Source_Text)\n\nRegEx_ID: 由 PRXPARSE\
    \ 返回的唯一正则表达式 标识符（输入参数，如果未使用 RegEx 则必需）\nRegEx: 要匹配的模式（输入参数，如果未使用 RegEx_ID 则必需）\n\
    Source_Text: 对要操作的文本变量或字面量（输入参数，必需）\nPosition: 数值位置变量赋值（输出，必需）\n```\n\n正如在 PRXPARSE\
    \ 函数中讨论的那样，RegEx 模式由 SAS 编译以供其他函数使用。除了使用实际的 RegEx 之外，PRXMATCH 能够通过 RegEx ID 备用之前编译的\
    \ RegEx，而不是 RegEx 本身。这允许我们通过 PRXPARSE 函数编译一次 RegEx（使用 `/o` 选项），从而尽可能地减少相关的计算周期。在处理大量文本时，计算周期的微小节省证明是巨大的。\n\
    \n利用 RegEx 模式的两种不同方法为 PRXMATCH 在实践中的用法提供了巨大的灵活性。由于不需要预先编译 RegEx，PRXMATCH 允许我们在代码中嵌入\
    \ RegEx 模式，而不需要额外的内存分配来在每次循环 DATA 步时维护它们。当你以动态方式使用 PRXMATCH 时非常有用，例如在嵌套 IF 语句内部，只有当某些条件成立时才使用\
    \ RegEx。根据实现的不同，这对速度和内存使用都有影响。\n\n### 示例 3.2：使用 PRXMATCH 在源文本中查找字符串\n\n让我们尝试一个简单的示例来展示此函数如何在实践中使用的。假设我们想在源文本中找到字符串“Street”。下面的代码演示了如何将每次出现的位置打印到日志（log）中。显然，在实践中我们需要的不仅仅是打印位置（例如提取或处理匹配的文本），但这展示了\
    \ PRXMATCH 的基本功能。\n\n这段代码中实现的 PRXMATCH 函数以 RegEx 作为第一个参数，以 datelines 地址作为第二个参数。结果赋值给变量\
    \ `Position`。使用 `PUT` 语句将 `Position` 的值写入日志。\n\n计算数据行的字符位置。在出现“Street”的行中，我们在哪个位置遇到“S”？通过将结果与输出\
    \ 3.2 进行比较，我们发现 PRXMATCH 返回的是“S”的位置（即模式匹配中第一个字符的位置）。\n\n```\ndata _NULL;\ninput\
    \ address $50;\nposition = PRXMATCH('/Street/o', address);\nif position = 0 then\n\
    \  do\n    put position=;\ndatalines;\n103 Pennsylvania Ave NW, Washington, DC\
    \ 20216\n508 First Street NW, Washington, DC 20001\n650 last St Ne, Washington,\
    \ DC 20002\n3000 K Street NW, Washington, DC 20007\nend;\nrun;\n```\n\n#### 输出\
    \ 3.2：\"Street\" 位置的日志打印\n\n```\nposition=11\nposition=8\n```\n\n## 3.2.3 PRXCHANGE\n\
    \n### Description\n\n此函数在第三参数提供的源文本中搜索由第一个参数（`RegEx_ID` 或 `RegEx`）提供的模式。模式匹配的次数由第二个参数\
    \ `Num_Times` 给出。在找到每个匹配项时，该函数将根据正则表达式的要求返回更改后的文本。如果没有未找到匹配项，PRXCHANGE 将返回原始文本且不变。\n\
    \n```\nOutput_String = PRXCHANGE(RegEx_ID or RegEx, Num_Times, Input_String)\n\
    ```\n\nRegEx_ID: 由 PRXPARSE 返回的唯一正则表达式 标识符（输入参数，如果未使用 Regex 则必需）\n\nRegEx: 要匹配的模式（输入参数，如果未使用\
    \ RegEx_ID 则必需）\n\nNum_Times: 应用更改的次数（输入参数，必需）。-1 强制函数按照模式在源文本中出现的次数进行更改。\n\n\
    Input_String: 输入文本变量（输入参数，必需）\n\nOutput_String: 输出文本变量赋值（输出，必需）\n\n就像 PRXMATCH\
    \ 函数一样，PRXCHANGE 能够使用实际的 RegEx 模式或 RegEx_ID，提供了巨大的灵活性。首选用法再次取决于所需的应用程序。\n\n此函数对于数据标准化非常有用，正如你将在下一章的更高级示例中看到的那样。我们将在下面通过两个示例来演示\
    \ PRXCHANGE 函数的一些基本功能，并演示如何利用之前介绍的捕获缓冲区（capture buffer）概念。\n\n### 示例 3.3：数据标准化\n\
    \n数据标准化是 SAS 中 RegEx 提供的一种简单但强大的功能。PRXCHANGE 允许我们清洗数据源，以确保单词或短语的每次出现完全相同（或完全删除）。结果输出\
    \ 3.3。当你尝试执行文本挖掘等高级应用时，数据清洗变得至关重要。\n\n例如，在进行任何分析之前，我们希望知道“street”的每次出现都是完全相同的。\n\
    \n```\ndata NULL;\ninput address $50;\ntext = PRXCHANGE('/\\s+/(Street|St|st|...)\\\
