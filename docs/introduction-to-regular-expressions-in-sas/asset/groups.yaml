    \ on context).\n\n### Example 3.6: Identifying Capture Buffers\n\nIdeally, when\
    \ we use PRXPAREN, we want to know the largest buffer position. This allows us\
    \ to know how many buffer values are available.\n\n## 3.3 Built-in SAS Call Routines\n\
    \nIn this section, you learn about the PRX call routines available for performing\
    \ many of the same tasks as functions, as well as some new ones. However, the\
    \ way they are implemented is slightly different compared to the functions.\n\n\
    ### 3.3.1 CALL PRXCHANGE\n\n### Description\n\nThis call routine performs the\
    \ match-and-replace operation similar to that of the PRXCHANGE function. Unlike\
    \ the function version, the call routine must receive a RegEx identifier. Also,\
