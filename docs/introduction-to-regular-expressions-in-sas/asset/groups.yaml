    This function returns the numerical value of the largest capture buffer that contains\
    \ data. It is therefore implicitly required that PRXSUBSTR, PRXMATCH, PRXNEXT,\
    \ or PRXCHANGE be run prior to this function being used—just like with PRXPOSN.\
    \ However, the only input argument is"
  - '[PAGE 61]


    RegEx_ID. Simply providing the RegEx is not an option, so this function must be
    used in conjunction with the PRXPASE function.


    # Syntax


    ```

    Paren=PRXPAREN(RegEx_ID)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPASE (input argument, required)


    Paren: Numerical reference value of the largest capture buffer (output, required)


    **Note:** Since this function requires a Reg_ID in lieu of the actual RegEx, it
    is implied that all precedents are forced to use Reg_ID instead of RegEx as well—otherwise,
    PRXPAREN cannot be used.


    What are we really trying to achieve with this function? Since it provides the
    length of the capture buffer by telling us the largest buffer to contain text,
    we know exactly how many buffer values we can access. Because we know this, we
    can avoid errors when referencing in code. It is worth noting that effective RegEx
    coding avoids many potential problems. However, it is always best practice to
    create fail-safe measures. Additionally, we can use this function to identify
    which of several options has been triggered inside the source.


    # Example 3.6: Identifying Capture Buffers


    Ideally, when we want to use the PRXSON function, the data that we expect to be
    available in the source is available. However, we know that in reality, that is
    not always the case. So, we have to write code that can account for a reasonable
    amount of variability in any data that we might need to process. We are going
    to explore an advanced example in the next chapter (see Section 4.2) that leverages
    the basic concepts outlined by this example.


    Now, suppose we have a pattern with multiple possible matches embedded in it.
    How do we know which option allowed the pattern to create a match? In the code
    below, we see that it is possible to use PRXPAREN to answer this question. We
    have a simple pattern with three possible matches: "Dog", "Rat", and "Cat". Each
    is encapsulated by parentheses to create a capture buffer location. However, notice
    that the group is inside another set of parentheses. Unless for practical purposes,
    this was done to demonstrate how capture buffers are numbered. Also note that
    this is not the most efficient way to write such code. We have sacrificed efficiency
    in order to clarify how the buffers work. Notice in our output “Dog” has a capture
    buffer of 2 despite being the first item in the OR list. Why? Because the outer
    set of parentheses is encountered first by SAS, creating a capture buffer element
    at position 1.'
  - '[PAGE 62]


    # Chapter 3: Using Regular Expressions in SAS


    If we were to use PRXPOSN under each IF statement with position 1 in our argument
    list, we would see each of the three cases below would be provided as output (i.e.,
    when "Dog" is true, "Dog" would be in buffer 1 as well as in buffer 2, and so
    on). See Output 3.6 for the results.


    ```

    data null;

    RegEx_ID=prparse(''*\b(Dog) | (Rat) | (Cat)\b/o'');


    position=prxmatch(RegEx_ID, ''The Cat in the Hat'');

    if position then paren=prxparen(RegEx_ID);

    put ''I matched capture buffer '' paren;


    position=prxmatch(RegEx_ID, ''The Rat on the Hat'');

    if position then paren=prxparen(RegEx_ID);

    put ''I matched capture buffer '' paren;


    position=prxmatch(RegEx_ID, ''The Dog on the Roof'');

    if position then paren=prxparen(RegEx_ID);

    put ''I matched capture buffer '' paren;

    ```


    As we have indicated, our goal is to identify which particular capture buffer
    is used. This allows us to build more sophisticated functionality in the future,
    such as conditional information capture or standardization.


    # Output 3.6: Log Output


    | matched capture buffer 4 |

    | matched capture buffer 3 |

    | matched capture buffer 2 |


    # 3.3 Built-in SAS Call Routines


    In this section, you learn about the PRX call routines available in SAS for performing
    many of the same RegEx tasks as the functions previously discussed, as well as
    some new ones. However, just like all other call routines, PRX call routines cannot
    be used in expressions or assignment statements. The way they are implemented,
    and their ultimate functionality, is slightly different when compared to the functions.
    These differences are explored more thoroughly in the associated examples.'
  - '[PAGE 63]


    # 3.3.1 CALL PRXCHANGE


    # Description


    This call routine performs the match-and-replace operation similar to that of
    the PRXCHANGE function. Unlike, the function version, the call routine must receive
    a RegEx identifier, without the option of using the associated RegEx instead.
    Also, there are some additional arguments not available in the function (result_length
    and truncation_value). The only required arguments are: RegEx_ID, Num_Times, and
    Input_string. All remaining arguments are optional.


    # Syntax


    ```

    CALL PRXCHANGE(RegEx_ID, Num_Times, Input_string, Output_string,

    result_length, trunc_value, num_changes)

    ```


    +   - RegEx_ID: Unique RegEx identified by PRPARSE (input argument, required)

    - Num_Times: Number of times the change is to be applied (input argument, required)

    - Input_string: Input text variable (input argument, required)

    - Output_string: Output text variable (input argument, optional). Default is Input_string.

    - result_length: Length of the characters put into Output_string (returned value,
    optional)

    - Trune_value: Binary integer (0 or 1) value (returned value, optional). 1 means
    that the inserted text is longer than the text replaced. 0 means that the inserted
    text is either the same length or shorter than the text being replaced.

    - num_changes: Number of times the changes were made (returned value, optional)


    Using the call routine inside function can be cleaner from a coding perspective,
    especially when managing large programs. But there is a more practical reason
    for using this call instead of the function: accessing the additional functionality
    provided by the optional arguments. Since we have the ability to write changes
    directly to the original variable, we can avoid creating new variables unnecessarily.
    This is especially useful when applying multiple data standardization filters
    to source text.


    **Note:** Writing changes back to the existing variable makes them irreversible
    in the event of a mistake, while our ultimate use of this functionality requires
    the overwriting approach for sound memory management, creating new variables or
    data sets is ideal when you are still learning. It allows you to experiment and
    make mistakes without fear of making permanent changes to source data.'
