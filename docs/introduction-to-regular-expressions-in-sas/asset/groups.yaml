- md: "\n# Chapter 3: Using Regular Expressions in SAS\n\nThe first line denotes a\
    \ RegExp within the PRXPARSE function. The next line shows the compiled RegExp\
    \ size and starting location for the lines that follow. Specifically, the size\
    \ of 26 refers to the 26 lines of compiled RegExp code (numbers on the line with\
    \ a trailing semi-colon); and first refers to the first line of execution code.\
    \ The numbers in parentheses to the right of each line correspond to labels for\
    \ compiled RegExp (these labels work like our pseudo-code labels in Chapter 2).\n\
    \nLines 1 through 26 are the compiled steps within our RegExp, and they become\
    \ easy to follow once we understand what each represents. For instance, the various\
    \ OPEN and CLOSE statements correspond to our opening and closing pairs; BRANCH\
    \ commands to the OR tests between the three parenthesis pairs; and EXACT is for\
    \ the string literal match of the associated word. END obviously means the end\
    \ of the subroutine.\n\nThe remaining output is just the result of our code running\
    \ normal. Should our code be malfunctioning, we would not likely see such normal\
    \ output when calling PRXDEBUG.\n\n## 3.12: Debugging Information Printed to the\
    \ Log\n\n+ ① Compiling Reg ((Dog)|(Rat)|(Cat))\nsize 26 first at 3\n1: OPEN(3)\n\
    2: BRANCH(0)\n4: OPEN(5)\n6: EXACT <Dog>(8)\n8: CLOSE(24)\n10: BRANCH(17)\n11:\
    \ OPEN(13)\n13: EXACT <Rat>(15)\n15: CLOSE(24)\n17: BRANCH(24)\n18: OPEN(20)\n\
    22: EXACT <Cat>(22)\n24: CLOSE(26)\n26: END(0)\n② minlen 3\n\n```\n| matched capture\
    \ buffer 4 with Cat | | cannot stand a Cat |\n| matched capture buffer 3 with\
    \ Rat | | cannot stand a Rat |\n| matched capture buffer 2 with Dog | | love dogs\
    \ |\n```\n\n+ ① The compilation process begins for the quoted RegExp generated\
    \ by PRXPARSE.\n\n+ ② Notice that each OPEN and CLOSE pair have the same name\
    \ (OPEN1 and CLOSE1). These numbers correspond to the numerical value of the capture\
    \ buffer that was formed by that set of parentheses.\n\n+ ③ Each line has a number\
    \ enclosed in parentheses, denoting the next line to jump from that line. However,\
    \ the END tag has a jump to 0, which takes us out of the subroutine.\n\n+ ④ The\
    \ minlen field defines the minimum length for the match to be 3. This information\
    \ is used by subsequent functions and routines when using this compiled pattern.\n\
    \nMoving the placement of our debug routine should prove to yield some interesting,\
    \ and potentially rather long, output. Doing so is the best way to become more\
    \ familiar with the low-level operations SAS is performing behind the scenes of\
    \ our PRX code.\n\nSignificant amounts of information can be provided by the PRXDEBUG\
    \ output, but a much deeper study of debug output is outside the scope of this\
    \ text. For more information about debug output and its meaning, visit the SAS\
    \ Support website.\n\n## 3.3.6 CALL PRXFREE\n\n### Description\n\nThis routine\
    \ releases memory resources associated with a RegEx, using its unique RegEx_ID.\
    \ Subsequent references to this identifier return a missing value.\n\n### Syntax\n\
    \n```\nCALL PRXFREE(RegEx_ID)\n```\n\nRegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\n\nThis routine is used to free up memory\
    \ for a specific RegEx_ID and becomes very important for managing the memory of\
    \ large programs. Remember, there is much more happening behind the scenes of\
    \ the RegEx_ID construction, despite merely having a numerical identifier. (See\
    \ CALL PRXDEBUG.) It can't be stressed enough that SAS still handles memory cleanup\
    \ to avoid memory leaks when a session is not handled properly. Although SAS a\
    \ session ends, it is possible to run into memory limitations within a single\
    \ session. Think very strategically about which RegEx_IDs—or any other variables\
    \ for matter—are necessary for each chunk of code.\n\n### Example 3.13: Releasing\
    \ Memory with CALL PRXFREE\n\nIn order to demonstrate the functionality of CALL\
    \ PRXFREE, we are revisiting a new version of the example code for PRXCHANGE.\
    \ However, instead of printing output as in the original example, we are going\
    \ to oversee concerns only with the results to CALL PRXFREE. (See Output 3.13.)\n\
    \nAs we see in the code below, the PUT statement is used to print the values of\
    \ Street_RXID and AddPass_RXID to the log for each run the DATA step (creating\
    \ four writes to the log). However, using the IF statement, we run the CALL PRXFREE\
    \ routine on the last record to release the memory associated with both RegEx_IDs.\
    \ Then, we print the results to the log. This creates a fifth write to the log,\
    \ but the values are missing this time because our routine was successful at releasing\
    \ the memory allocated for them—making them unrecoverable.\n\n```\ndata sample;\n\
    input address $50;\ndatalines\n103 Pennsylvania Ave NW, Washington, DC 20216\n\
    508 First St NW, Washington, DC 20001\n650 1st NE, Washington DC 20002\n3000 K\
    \ Street NW, Washington, DC 20007\n;\nrun;\n\ndata null;\nset sample end=last;\n\
    Street_RXID = PRXPARSE('/s\\|s)?(\\s|\\w+)?\\s+/ St. /o');\nAddParse_RXID = PRXPARSE('/(.+),/o');\n\
    ...\nif last then do;\n    call PRXFREE(Street_RXID);\n    call PRXFREE(AddParse_RXID);\n\
    end;\n```\n\nOutput 3.13:\n\n| | |\n|---|---|\n| matched capture buffer 4 with\
    \ Cat | cannot stand a Cat |\n| matched capture buffer 3 with Rat | cannot stand\
    \ a Rat |\n| matched capture buffer 2 with Dog | love dogs |\n\n## 3.4 Summary\n\
    \nIn this chapter, we have explored the suite of functions and call routines available\
    \ in SAS.\n"
