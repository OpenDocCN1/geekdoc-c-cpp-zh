    # More Advanced Insert Results


    The commented Regex_ID definition creates very different output for Output 3.8.2—a
    longer replacement value that occurs for every group of numbers (***NUMBER REMOVED***
    is inserted). The variables are all the same as in Output 3.8.1, but notice how
    the values change. For instance, trunc_val now equals every time a redaction occurred,
    and num_changes is frequently greater than 1. Also, notice something else important
    about this: lines of text are actually truncated!


    Remember, the trunc_val variable being set to 1 does not mean that loss is certainly
    going to occur. Instead, it means it could occur. Think of this as a warning telling
    us, "Hey, keep a look out for a problem." And this is a problem we would indeed
    have for of these lines of text. The insertion of longer text pushes all text
    to the right (beyond the 80-character length defined for the Variable text). Now,
    when there is a significant amount of white space to the right of our text, it
    doesn''t result in an issue. However, when there is valuable information to the
    right of our inserted text, we will likely have data loss. Regardless how small
    the loss of data, the integrity of our entire data set is compromised if we do
    not design code that avoids this problem. We discuss this concept a bit more in
    the next chapter.'
