    \ 5\n\n## 1.1 Purpose of This Book\n\nThis book is meant for SAS programmers of\
    \ virtually all skill levels. However, it is expected that you have at least a\
    \ basic knowledge of the SAS language, including the DATA step, and how to use\
    \ SAS PROCs.\n\nThis book provides all the tools you need to learn how to harness\
    \ the power of regular expressions within the SAS programming language. The information\
    \ provided lays the foundation for fairly advanced applications, which are discussed\
    \ briefly as motivating examples later in this chapter. We are not presented to\
    \ intimidate or overwhelm, but instead encourage you to work through the coming\
    \ pages with the anticipation of being able to rapidly implement what you are\
    \ learning.\n\n## 1.2 Layout of This Book\n\nIt is my goal in this book to provide\
    \ immediately applicable information. Thus, each chapter is structured to walk\
    \ through every step from theory to application with the following flow: Syntax\
    \ ► Example. In addition to the information discussed in the coming chapters,\
    \ a regular expression reference guide is included in the appendix to help with\
    \ more advanced applications outside the scope of this text.\n\n## Chapter 1\n\
    \nIn addition providing a roadmap for the remainder of the book, this chapter\
    \ provides motivational examples of how you can use this information in the real\
    \ world.\n\n## Chapter 2\n\nThis chapter introduces the basic syntax and concepts\
    \ for regular expressions. There is even some SAS code for running the examples\
    \ associated with each new concept.\n\n## Introduction to Regular Expressions\
    \ in SAS\n\n## Chapter 3\n\nThis chapter is designed to walk through the details\
    \ of implementing regular expressions within the SAS language.\n\n## Chapter 4\n\
    \nIn this final chapter, we work through a series of in-depth examples—case studies\
    \ if you will—in order to ‘put it all together’. They don’t represent the limitations\
    \ of what you can do by the end of this book, but instead some baseline thinking\
    \ for what is possible.\n\n## Appendixes\n\nWhile not comprehensive, these serve\
    \ as valuable, substantial references for regular expressions, SAS documentation,\
    \ and reference tables. I hope everyone can leverage the additional information\
    \ to enrich current and future regular expressions capabilities.\n\n## 1.3 Defining\
    \ Regular Expressions\n\nBefore going very further, we need to define regular\
    \ expressions.\n\nTaking the very formal definition might not provide the desired\
    \ level of clarity:\n\nDefinition 1 (formal)\n\n*regular expressions: “Regular\
    \ expressions consist of constants and operator symbols that denote strings of\
    \ settings and operations over these sets, respectively.”*\n\nIn the pursuit of\
    \ clarity, we will operate with a slightly looser definition for regular expressions.\
    \ Since practical application is our primary aim, it doesn’t make sense to adhere\
    \ to any esoteric definition. So, for our purposes we will use the following:\n\
    \nDefinition 2 (easier to understand—our definition)\n\n*regular expressions:\
    \ pattern used for automated searching and matching.*\n\nWhen programming in SAS,\
    \ regular expressions are seen as strings of letters and special characters that\
    \ are recognized by built-in SAS functions for the purpose of searching and matching.\
    \ Combined with other built-in SAS functions and procedures, you can reach tremendous\
    \ capabilities, some of which we explore in the next section.\n\nNote: SAS uses\
    \ the same syntax for regular expressions as the Perl language². Thus, throughout\
    \ SAS documentation, you find regular expressions repeatedly referred to as “Regular\
    \ expressions.” In this book, I choose the conventions present in the SAS documentation,\
    \ unless the Perl conventions are the most common to programmers. To learn more\
    \ about how SAS views Perl, visit this website:\n\n```\nhttp://support.sas.com/documentation/cdl/en/functionsref/67239/HTML/default/viewer.html#p0s9ilagexmj8nu7e11jfnzlk.\
    \ To learn more about Perl programming, visit\nhttp://perldoc.org/perl/perl.html.\
    \ In this book, I primarily dispense with the references to\nPerl, as it can be\
    \ confusing.\n```\n\n*\n\n## 1.4 Motivational Examples\n\nThe information in this\
    \ book is very useful for a wide array of applications. However, that will not\
    \ become obvious until you read it. So, in order to visualize how you can use\
    \ this information in your work, I present some realistic examples.\n\nYou are\
    \ all probably familiar with data, which is rarely provided to analysts in a form\
    \ that is immediately useful. It is frequently necessary to clean, transform,\
    \ and enhance source data before it can be used—especially textual data. The following\
    \ examples of de coding details that are discussed later in the book, but they\
    \ demonstrate these concepts at varying levels of sophistication. The primary\
    \ goal here is to simply help you to see the utility for this information, and\
    \ to begin thinking about ways to leverage it.\n\n### 1.4.1 Extract, Transform,\
    \ and Load (ETL)\n\nETL is a general set of processes for extracting data from\
    \ its source, modifying it to best use it to fit your end needs, and loading it\
    \ into a target location that needs (e.g., database, data store, warehouse). We're\
    \ going to be working with a fairly basic example to get started. Suppose although\
    \ we have a SAS set of customer addresses that contains some quality issues. The\
    \ method of recording the data is unknown to us, but visual inspection has revealed\
    \ numerous occurrences of duplicate records, as in the table below. In this example,\n\
    \n| First Name | Last Name | DOB | Street | Zip |\n|---|---|---|---|---|\n| Robert\
    \ | Smith | 2/5/1967 | 123 Fourth | Fairfax |\n| Robert | Smith | 2/5/1967 | 123\
    \ Fourth | 22030 |\n\nIn this example, the visual inspection has revealed numerous\
    \ occurrences of duplicate records, as in the table below. The primary goal here\
    \ is to simply help you to see the utility for this information, and to begin\
    \ thinking about ways to leverage it.\n\n### 1.4.2 Data Manipulation\n\nSuppose\
    \ you have been given the task of creating a report on all Securities and Exchange\
    \ Commission (SEC). However, the source data is just a bunch of .xml files, to\
    \ the untrained eye, this looks like a lot of gibberish; to the trained eye, it\
    \ looks like a lot of work\n\nFigure 1.1: Sample of 2009 SEC Proceedings\n\n```\n\
    <xml version=\"1.0\" encoding=\"ISO-8859-1\">\n<administrative_proceeding>\n \
    \ <url>http://www.sec.gov/litigation/admin/2009/34-61662.</</url\n\n  release_number>34-61262</release_number>\n\
    \  <release_date>Dec. 30, 2009</release_date>\n  <respondents>Stephen C. Gingir</respondents>\n\
    </administrative_proceeding>\n<administrative_proceeding>\n  <url>http://www.sec.gov/litigation/admin/2009/34-61256.</url>\n\
    \  <release_number>34-61256</release_number>\n  <release_date>Dec. 30, 2009</release_date>\n\
    \  <respondents>Gabelli Funds LLC</respondents>\n</administrative_proceeding>\n\
    <administrative_proceeding>\n  <url>http://www.sec.gov/litigation/admin/2009/34-61255.</url>\n\
    \  <release_number>34-61255</release_number>\n  <release_date>Dec. 30, 2009</release_date>\n\
    \  <respondents>Gabelli Funds LLC</respondents>\n</administrative_proceeding>\n\
    ```\n\nHowever, with the power of regular expressions, creating this report becomes\
    \ a fairly straightforward task. Regular expressions provide a method for us to\
    \ algorithmically recognize patterns in the XML file, parse the data inside each\
    \ tag, and generate a data set with correct columns. The resulting data set would\
    \ contain a row for every record, structured similarly to this data set:\n\n|\
    \ Release Number | Release Date | Respondents | URL |\n|---|---|---|---|\n| 34-61262\
    \ | Dec 30, 2009 | Stephen C. Gingir | http://www.sec.gov/litigation/admin/2009/34-61262.pdf\
    \ |\n| 34-61256 | Dec 30, 2009 | Gabelli Funds LLC | http://www.sec.gov/litigation/admin/2009/34-61256.pdf\
    \ |\n| 34-61255 | Dec 30, 2009 | Gabelli Funds LLC | http://www.sec.gov/litigation/admin/2009/34-61255.pdf\
    \ |\n\nRegular expressions cannot be used in isolation for this task due to the\
    \ complexity of XML files. Sound and other Base SAS functions are required in\
    \ order to process XML files in general. However, the point is that regular expressions\
    \ help us overcome some other\n"
