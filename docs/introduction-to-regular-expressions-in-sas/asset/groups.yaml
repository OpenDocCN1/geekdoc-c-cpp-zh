    # 3.2.2 PRXMATCH


    # Description


    PRXMATCH returns the numerical position of the first character in the matched
    RegEx pattern. Additionally, it can be used in IF statements to test for a pattern
    match without a variable assignment, just like many other familiar SAS functions.
    The first argument to PRXMATCH is either the RegEx or RegExp_ID. The second is
    the source text variable or string literal.


    # Syntax


    ```

    Position = PRXMATCH(RegEx_ID or RegEx, Source_Text)


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required
    if RegEx is not used)

    RegEx: The pattern to be matched (input argument, required if RegEx_ID is not
    used)

    Source_Text: The text variable or literal to be operated upon (input argument,
    required)

    Position: Numerical position variable assignment (output, required)

    ```


    As discussed with the PRXPARSE function, RegEx patterns are compiled by SAS for
    use by other functions. In addition to using the actual RegEx, PRXMATCH is able
    to leverage the previously compiled RegEx via the RegEx ID in lieu of the RegEx
    itself. This allows us to compile the RegEx once via the PRXPARSE function (using
    the /o option), minimizing the associated computing cycles. Small savings in computing
    cycles can prove significant when processing large volumes of text.


    The two different methods for leveraging RegEx patterns create significant flexibility
    in how PRXMATCH can be used in practice. By not needing to compile the RegEx in
    advance, PRXMATCH allows us to embed RegEx patterns throughout our code without
    extra memory allocation required to maintain them for each loop through the DATA
    step. This is very useful when you are using PRXMATCH in a dynamic way, as inside
    nested IF statements where RegEx is used only when certain conditions are true.
    Depending on the implementation, there are implications for speed as well as for
    memory usage.


    # Example 3.2: Finding Strings in Source Text with PRXMATCH


    Let''s try a simple example to show how this function is used in practice. Suppose
    we want to find a string as “Street” in a source text. The code below demonstrates
    how we print the position of each occurrence to the log. Obviously, we need to
    do more than just print the position in practice (such as by extracting or manipulating
    the matched text), but this demonstrates the basic functionality of PRXMATCH.'
  - "[PAGE 56]\n\n# Chapter 3: Using Regular Expressions in SAS 43\n\nThe PRXMATCH\
    \ function is implemented in this code with RegEx as the first argument and the\
    \ datelines reference address as the second argument. The result is assigned to\
    \ the variable Position. The value of Position is written to the log using the\
    \ PUT statement.\n\nCount the character positions in the data lines. At what position\
    \ do we encounter the \"S\" in \"Street\" on the lines where they occur? Comparing\
    \ the results to Output 3.2, we find that PRXMATCH is returning the position of\
    \ \"S\" (i.e., the position for the first character in the pattern match).\n\n\
    ```\ndata _NULL;\ninput address $50;\nposition = PRXMATCH('/Street/o', address);\n\
    if position = 0 then\n  do\n    put position=;\ndatalines;\n103 Pennsylvania Ave\
    \ NW, Washington, DC 20216\n508 First Street NW, Washington, DC 20001\n650 last\
    \ St Ne, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\nend;\n\
    run;\n```\n\n# Output 3.2: Log Printout for Positions of \"Street\"\n\n```\nposition=11\n\
    position=8\n```\n\n# 3.2.3 PRXCHANGE\n\n# Description\n\nThis function searches\
    \ for the pattern—provided in the first argument by either RegEx_ID or RegEx—within\
    \ the source text that is provided in the third argument. The pattern is matched\
    \ the number of times given in the second argument, Num_Times. Upon finding each\
    \ match, the function returns the changed text as required by the Regex. If no\
    \ match is found, PRXCHANGE returns the original text unchanged.\n\n# Syntax\n\
    \n```\nOutput_String = PRXCHANGE(RegEx_ID or RegEx, Num_Times, Input_String)\n\
    ```\n\nRegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument,\
    \ required if Regex not used)\n\nRegEx: The pattern to be matched (input argument,\
    \ required if RegEx_ID not used)"
  - '[PAGE 57]


    Num_Times: Number of times the change is to be applied (input argument, required).
    -1 forces the

    function to make the changes as many times as the pattern occurs in the source
    text.


    Input_String: Input text variable (input argument, required)


    Output_String: Output text variable assignment (output, required)


    Just like the PRXMATCH function, PRXCHANGE is able to use the actual RegEx pattern
    or the

    RegEx_ID, providing significant flexibility. The preferred use again depends on
    the desired application.


    This function is very useful for data standardization, as you will see in more
    advanced examples in the

    ext chapter. We will work through two examples below to demonstrate some basic
    functionality

    of the PRXCHANGE function, as well as to demonstrate how to leverage the capture
    buffer concept

    introduced earlier.


    # Example 3.3: Standardizing Data


    Data standardization is a relatively simple, yet powerful, capability provided
    by RegEx in SAS.

    PRXCHANGE enables us to scrub our data source to ensure that each occurrence of
    a word or phrase is

    exactly the same (or removed entirely). Output 3.3 for the results. Data scrubbing
    becomes

    esially important when you are attempting to perform advanced applications such
    as text mining.


    For instance, before doing any analysis of our data, we want to know that each
    occurrence of the word

    "street" is exactly the same. If each occurrence were not identical, we might
    perform a word frequency

    count on a document with invalid results "street," "Street," "St," and so on on
    all would be

    counted separately. Depending on the eventual use of this information, such problems
    could produce

    disasterous.


    ```

    data NULL;

    input address $50;

    text = PRXCHANGE(''/s\s+([sS]?|St\)\s+/St. /o'',-1,address);

    put text;


    datalines;

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St. NW, Washington, DC 20001

    650 1st St NE, Washington, DC 20002

    3000 K Street NW, Washington, DC 20007

    ;

    run;

    ```


    Output 3.3: Log with Updated Data


    ![](img/c58184a1652486f0486b8350e0431fbb_57_0.png)'
  - '[PAGE 58]


    # Chapter 3: Using Regular Expressions in SAS 45


    **Note:** There are often a number of ways to achieve the same outcome. Understanding
    the context of an application will help you determine the RegEx pattern to use.


    # Example 3.4: Using the Capture Buffer


    Revisiting Example 3.3, suppose we now want to also make the addresses available
    to a system that accepts only comma separated values (CSV) files. This is a great
    opportunity to use the capture buffer. With only a couple of minor changes, we
    can now process the data lines to CSV ready.


    The new line of code uses PRXCHANGE with a complex RegEx that changes the address
    into the street, city, state, and ZIP code components. And we see that the new
    line takes the output variable Text as the input, instead of address. Doing this
    allows us to make changes to the already changed text. If we were to use address,
    we would merely update the original data lines rather than building on the prior
    step.


    In reviewing the parentheses elements in the new RegEx, we can see how the four
    address components are identified. On that line, each of the four elements is
    placed via the buffer reference, with a comma and space immediately following.
    Reviewing Output 3.4, we see that the code produces the expected outcome.


    ```

    data NULL;

    input address $50;

    text = PRXCHANGE(''/\s+/(Street|Street|St|st|...\s+/St. /o/'',-1,address);

    text2 = PRXCHANGE(''/(\.+?),*\s+(\w+)?*\s+(\w+)?*\s+(\d+)/$1, $2, $3\n4/o'',-1,text);

    put text2;

    datalines;

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St NW, Washington, DC 20001

    650 1st St NE, Washington, DC 20002

    3000 K Street NW, Washington, DC 20007

    run;

    ```


    # Output 3.4: Corrected Data in the Log


    ![](img/c58184a1652486f0486b8350e0431fbb_58_0.png)


    So, what else could we do to the text? An help addresses ready for advanced applications.
    For instance, "Ave" and "1st" should also be standardized. Building on the example
    above is the fastest way to explore the options and become more comfortable with
    these concepts.'
- md: "\n## 3.2.4 PRXPOSN\n\n### Description\n\nPRXPOSN returns the matched information\
    \ from specified capture buffers. Also, any RegEx function requires the RSUBSTR,\
    \ PRMATCH, PRXNEXT, and PRXCHANGE functions to be running before used so that\
    \ the buffer can be referenced. Also, RegEx ID is required than the actual RegEx.\
    \ Otherwise, PRXPOSN will not work—necessitating the use of PRXPARSE. The N input\
    \ argument is numeric and refers to the capture buffer ($).\n\n### Syntax\n\n\
    ```\nText = PRXPOSN (RegEx_ID, N, Source_Text)\n```\n\n- RegEx_ID: Unique RegEx\
    \ identifier returned by PRXPARSE (input argument, required)\n- N: Integer value\
    \ of the capture buffer (input argument, required)\n- Source_Text: The text variable\
    \ or literal to be operated upon (input argument, required)\n- Text: Character\
    \ variable assignment of captured text (output, required)\n\nWhen we know the\
    \ exact number of capture buffer elements (i.e., N is known), we can use PRXPOSN\
    \ without an issue. However, what happens when the number of elements is different\
    \ from what we expect? If there are values in the capture buffer but we make a\
    \ reference that is larger than those available (maybe there are three or, but\
    \ we make a reference to number 5), then a missing value is returned. However,\
    \ if we reference buffer position 0 (N=0), then the entire pattern is returned\
    \ regardless of the buffer length.\n\nThe next function, PRXPAREN, is very helpful\
    \ in creating robust code when we are using the capture buffers in conjunction\
    \ with PRXPOSN. It is also important to write robust RegEx patterns to ensure\
    \ that you prevent issues from popping up.\n\n### Example 3.5: Extracting Data\
    \ with Capture Buffers\n\nIn order to make the capture buffer and this new function\
    \ more clear, we're going to walk through a concrete example. Suppose we want\
    \ to process addresses for the structure is known and store many variables in\
    \ a SAS dataset for later. Since we know the layout of the address, the capture\
    \ buffer arrangement and the application of PRXPOSN are both straightforward.\n\
    \nFirst, we test the RegEx ID variable Text by using the PRXPARSE function. Notice\
    \ that this is an implicit test of a match existing (no equal sign is used). If\
    \ a match of the RegEx exists within the identified text source, then we assign\
    \ the capture buffer values to variables by PRXPOSN (city, state, and zip).\n\n\
    Output 3 displays the values of extract, the data set created in our SAS step.\
    \ As expected, we extracted the city, state, and ZIP code from each datalines\
    \ entry. we're going to build on this code to create a more sophisticated address\
    \ extractor that includes the street information as well as the ability to include\
    \ 9-digit zips.\n\n```sas\ndata extract:\n  input address $50;\n  text = PRXPARSE('/\\\
    s+(\\w+),\\s+(\\w+)\\s+(\\d+)/o');\n  if PRXMATCH(text, address) then\n  do\n\
    \    city = PRXPOSN(text, 1, address);\n    state = PRXPOSN(text, 2, address);\n\
    \    zip = PRXPOSN(text, 3, address);\n    output;\n  end;\ndatalines;\n103 Pennsylvania\
    \ Ave NW, Washington, DC 20216\n508 First St NW, Washington, DC 20001\n650 1st\
    \ St NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n3000 K\
    \ Street NW, Washington, DC 20007\nrun;\nproc print data=extract;\nrun;\n```\n\
    \nOutput 3.5: PROC PRINT Results\n\n| Obs | city | state | zip |\n|---|---|---|---|\n\
    | 1 | Washington | DC | 20216 |\n| 2 | Washington | DC | 20001 |\n| 3 | Washington\
    \ | DC | 20002 |\n| 4 | Washington | DC | 20007 |\n\n## 3.2.5 PRXPAREN\n\n###\
    \ Description\n\nThis function returns the numerical value of the largest capture\
    \ buffer that contains data. It is therefore implicitly required that PRXSUBSTR,\
    \ PRXMATCH, PRXNEXT, or PRXCHANGE be run prior to this function being used—just\
    \ like with PRXPOSN. However, the only input argument is RegEx_ID. Simply providing\
    \ the RegEx is not an option, so this function must be used in conjunction with\
    \ the PRXPASE function.\n\n### Syntax\n\n```\nParen=PRXPAREN(RegEx_ID)\n```\n\n\
    - RegEx_ID: Unique RegEx identifier returned by PRXPASE (input argument, required)\n\
    - Paren: Numerical reference value of the largest capture buffer (output, required)\n\
    \n**Note:** Since this function requires a Reg_ID in lieu of the actual RegEx,\
    \ it is implied that all precedents are forced to use Reg_ID instead of RegEx\
    \ as well—otherwise, PRXPAREN cannot be used.\n\nWhat are we really trying to\
    \ achieve with this function? Since it provides the length of the capture buffer\
    \ by telling us the largest buffer to contain text, we know exactly how many buffer\
