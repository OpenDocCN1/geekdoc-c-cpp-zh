    | /d[1,2]-\d[1,2]-\d[2,4]/ | "10-20-1950" "8-30-52" "4-3-1979"... |

    | /Was{1,7}/ | "Washington" "Wash" "Waste" "Washing"... |


    **Note:** As you can see in the examples above, the {n,m} might not always be
    the best choice of modifier, but these examples are meant to demonstrate the flexibility
    of implementation. For instance, the year in the second example is allowed to
    be three digits with this usage. Using an OR clause with the {n} modifier is a
    simple fix.


    # Introduction to Lazy Repetition Modifiers


    Now that you are familiar with greedy modifiers, let''s begin examining the lazy
    ones. In terms of syntax, they differ from the greedy modifiers only by the addition
    of a question mark (?). By adding the question mark immediately after each of
    the greedy modifiers, we are able to subtly change their behavior—sometimes in
    unexpected ways.


    In general, lazy modifiers are used to avoid overmatching and improve performance
    when compared to greedy modifiers. There are situations when matching with greedy
    modifiers would lead to grabbing too much information, or simply slowing down
    performance. For instance, processing semi-structured text files like HTML or
    XML is a great example of when lazy modifiers would come in handy.


    # Lazy 0 or More


    The modifier {*} creates a match 0 or more times, but as few times as necessary
    to create the match. In some situations, it creates the same matches as the greedy
    modifier. However, in other cases, the results are very different. To make it
    clearer, Table 2.30 describes the details of a few examples.'
  - '[PAGE 42]


    # Table 2.30: Examples using *?


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | /Sing\w*?/ | “Sing” | This matches only the word “Sing” because the modifier
    is given the option to match nothing. And since it is lazy, it will take that
    option every time, regardless of whether a word character immediately follows
    the “g” in “Sing”. |

    | /Sing\w*?/ | “Singing” ... | Comparing this to the example above, you see that
    the \s on the pattern creates additional matches. The \s forces the pattern to
    continue searching for a match that includes white space. This could be “Sing”
    or other combinations (similar to the greedy outcomes). |

    | /(ha)*?/ | | This example demonstrates why we need to be careful with lazy modifiers.
    Even when “ha” is ignored, again again because the modifier has the option to
    do so. The greedy version of this would match as many times as the word “ha” occurred
    back-to-back, with a minimum of zero times.|


    # Lazy 1 or More


    The modifier + creates a match 1 or more times, but as few times as necessary
    to create a match. Again, if it is possible, this matches only once. Table 2.31
    provides examples.


    # Table 2.31: Examples using +?


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | /Sing\w+?/ | “Singi” | This matches only “Sing” plus exactly one word character
    following the “g”. Again, by giving the lazy modifier an option to match the minimum,
    it will do so every time |

    | /Sing\w+?/s | “Singing” ... | Again, we see that adding the \s on the pattern
    creates additional matches. The \s forces the pattern to continue searching for
    a match that includes white space. This could be “Sing” or other combinations
    (similar to the greedy outcomes). |

    | /(ha)+/ | “ha” | This example is less of a cautionary tale than *?. But it might
    still provide undesirable results. Even when “ha” exists numerous times back-to-back,
    it matches only the first time, unless an additional match element follows it.
    Again, this is because the modifier has the option to match only once. The greedy
    version of this would match as many times as the word “ha” occurred back-to-back,
    with a minimum of once.|'
  - '[PAGE 43]


    # 30 Introduction to Regular Expressions in SAS


    # Lazy 0 or 1 Times


    The modifier ?? creates a match 0 or 1 times, but as few as necessary to create
    a match. Unless forced, this modifier will match 0 times. Table 2.32 provides
    examples.


    # Table 2.32: Examples using ??


    | Usage | Matches |

    | --- | --- |

    | /Sing\w??/ | "Sing" | This matches only the word "Sing" because the modifier
    is given the option to match nothing. And since it is lazy, it will take that
    option every time, regardless of whether a character immediately follows the "g"
    in "Sing". The reasoning is the same as with the * modifier. |

    | /Sing\w??/s/ | "Sings" ... | Again, just as with the * modifier, we see that
    appending the \s on the pattern creates additional matches. The \s forces the
    pattern to continue searching for a match that includes space. This could be "Sings"
    or a few combinations (similar to the greedy outcomes). demonstrates why we need
    to be careful with lazy modifiers. Even when "ha" exists, it is ignored, again
    because the modifier has the option to do so. The greedy version of this word
    would match as many times as the word "ha" occurred back-to-back. |

    | /(ha)??/ | ... |


    # Lazy {n} Times


    The modifier {n}? creates a match exactly n times. This modifier functions exactly
    as the greedy version, making the ? unnecessary. Using this modifier results in
    no performance enhancement or change in functionality, which makes it a completely
    unnecessary addition to the Perl language. It has been included here for the sake
    of completeness. Table 2.33 shows that the same examples reveal the same results.


    # Table 2.33: Examples using "{n}?”


    | Usage | Matches |

    | --- | --- |

    | /1-800-d{3}--d{4}? | "1-800.123-4567" "1.800.123.4567" ... |

    | /R\w{4}? | "Round" "Runts" ... |

    | /19\D{3}?Street/ | "19th Street" "19th.Street" "19...Street" ... |

    | /(d{5})-d{4})?(/(d{5})?/ | "12345-6789" "12345" ...'
  - "[PAGE 44]\n\n# Lazy n or More\n\nThe modifier {n,?} creates a match, at least\
    \ n times and as few times as necessary to create a match. This functions just\
    \ like the * or + modifiers, except that the maximum number of matches is arbitrary.\
    \ Again, we see similar behavior resulting from the laziness of the modifier.\
    \ Table 2.34 provides examples.\n\nTable 2.34: Examples using {n,?}\n\n| Usage\
    \ | Matches | Notes |\n| --- | --- | --- |\n| /Singw{3,?}/ | \"Singing\" ... |\
    \ This matches exactly n=3 times. Again, by giving the lazy modifier option to\
    \ match the minimum, it will do so every. |\n| /0{3,?}/s/ | \"0000\" ... | Now\
    \ that you have the hang of these modifiers, this example should be a little more\
    \ interesting. Adding 's on the pattern still forces it to match 0 until the space\
    \ is encountered. The pattern is \"anchored\" to the first occurrence of a 0,\
    \ thus capturing more than the minimum. |\n /(ha{4,?}/ | \"hahahaha\" | Without\
    \ surrounding information in the pattern, this matches only the minimum number\
    \ of times. By having nothing else to force additional matching, the lazy modifier\
    \ just stops after the minimum of n=4. |\n\n# Lazy n m Times\n\nThe modifier {n,m}?\
    \ creates a match at least n times, but no more than m times—as few times in that\
    \ range as necessary to create the match. It functions like many the other lazy\
    \ modifiers discussed far, but it sets a cap on how many times it can match in\
    \ addition to having an arbitrary minimum. Table 2.35 provides examples.\n\nTable\
    \ 2.35: Examples using {n,m}?\n\n| Usage | Matches | Notes |\n| --- | --- | ---\
    \ |\n| /Readw{1,3,?}/ | \"Ready\" ... | This matches the word metacharacter only\
    \ one time. Again, by giving the lazy modifier option to match the minimum, it\
    \ will do so every time. |\n /0{2,5,?}/s/ | \"0000\" ... | Again, the pattern\
    \ is \"anchored\" to the first occurrence of a 0, capturing the minimum if it\
    \ exists, up to the maximum. |\n\\sha(ha){0,6}? | \"ha\" | By not having anything\
    \ after the \"anchor\" point for the pattern to match on, there is nothing for\
    \ additional matching. The lazy modifier just stops after the minimum of n=0.\
    \ |"
- md: "\n## 2.6 Options\n\nOptions affect the behavior of the RegEx pattern with which\
    \ they are associated. These behavioral changes provide benefits ranging from\
    \ RegExp creation more convenient, providing new or enhanced functionality.\n\n\
    Options occur after the closing slash character, but there is one item of significance\
    \ that occurs before the first slash character that we will also discuss—it is\
    \ not actually an option but this is best place to go over it. And we are not\
    \ going to cover all of the metacharacters for the same reason we haven't covered\
    \ far—this is an introductory text.\n\n### 2.6.1 Ignore Case\n\nThe option /i\
    \ ignores letter case for the entire pattern, even character strings. This is\
    \ a great option to use when we know exactly what we are searching for, but for\
    \ we don't want the letter case to be an issue. Table 2.36 provides examples.\n\
    \nTable 2.36: Examples using /i\n| Usage | Matches |\n| --- | --- |\n| /1600 Pennsylvania\
    \ Avenue/ | “1600 pennsylvania avenue” “1600 PENNSYLVANIA AVENUE” ... |\n| /STREET/i\
    \ | “street” “Street” “STREET” ... |\n| /CAPS don’t MattEr/i | “caps don’t matter”\
    \ “CaPs Don’t MATTER” ... |\n\n### 2.6.2 Single Line\n\nThe option /s forces the\
    \ dot character (.) to match everything, including the newline character, when\
    \ it occurs in the pattern. This can be very helpful to ensure that we don't miss\
    \ anything for a particular character position. Table 2.37 provides examples.\n\
    \nTable 2.37: Examples using /s\n| Usage | Matches |\n| --- | --- |\n| /43rd and\
    \ Times Square.New York, NY 10036/s | “43rd and Times Square New York, NY 10036”\
    \ ... |\n| /Bob Smith.\\d{3}-\\d{3}-\\d{4}/s | “Bob Smith 123-456-7891” ... |\n\
    \n### 2.6.3 Multiline\n\nThe option /m causes ^ and $ to match on more than the\
    \ string start and end respectively. Instead, they match every newline encountered\
    \ because the various lines of information are treated as one continuous line.\
    \ This enhanced functionality really applies to two metacharacters that we haven't\
    \ covered yet (we'll discuss them in Section 2.7), so if you need to, feel free\
    \ to peek ahead and come back to this one. Table 2.38 provides examples.\n\nTable\
    \ 2.38: Examples using /m\n| Usage | Matches |\n| --- | --- |\n| /\\w+/ | Words\
    \ at the beginning of a string and words following a newline character. |\n| /\\\
    w+?$/s | Words immediately before a space and the string end, and before a space\
    \ and newline character. |\n\n### 2.6.4 Compile Once\n\nThe option /o is the compile\
    \ option. By having the \"o\" immediately following the closing slash, SAS knows\
    \ to compile Regex once. This option creates a very nice simplification to SAS\
    \ code, which I demonstrate by showing updated code below (see Section 2.1.1 for\
    \ the original code). Notice how the IF block is removed, and only the two lines\
    \ that do not include the RETAIN statement remain. These changes are possible\
    \ due to the compilation having the first time through the DATA step. Every subsequent\
    \ loop reuses the previously compiled expression, if it exists.\n\n#### Updated\
    \ Test Framework/\n\n```\n/*RegEx Testing Framework*/\ndata _NULL;\n*N=1 then\n\
    *do;\n  *retain pattern_ID;\n  *pattern=\"/Run//*--Edit the pattern here.*/\n\
    \  *pattern_ID=prxparse(pattern);\n*end;\npattern=\"Run/0\";/*--Edit the pattern\
    \ here.*/\npattern_ID=prxparse(pattern);\ninput some_data $50;\ncall prxsubstr(pattern_ID,\
    \ some_data, position, length);\nif position ^= 0 then\n  do;\n    match=substr(some_data,\
    \ position, length);\n    put match:$QUOTE. \"found in \" some_data:$QUOTE.;\n\
    end;\ndatalines\nSmith, BOB A.\n```\n\n### 2.6.5 Substitution Operator\n\nThe\
    \ substitution operator s/ is not technically an option, it belongs here if only\
    \ because it truly stands apart from the other items discussed in this section.\
    \ Although the substitution operation is similar in appearance to the other, it\
    \ fundamentally changes the RegEx activity from a matching operation to a match-and-replace\
    \ operation. \"s\" in front of the surrounding slashes (/) signifies that the\
    \ pattern is being used to replace the text and inserting the accompanying replacement\
    \ text. This is another peek additional functionality that is explored in the\
    \ next chapter with SAS functions. Once a pattern is matched, we can do a variety\
    \ of things with that information. Great analogy for how this works is the find-and-replace\
    \ functionality provided by many word processing—except this is much powerful.\
    \ Also, notice that there is a third slash in the examples (in the middle of).\
    \ That additional slash denotes where the matching portion of RegEx ends and the\
    \ replacement portion begins. Right, all the characters between the second and\
    \ third are treated as characters. Table 2.39 provides some examples, but we cover\
    \ this in detail in the next chapter, where we also discuss how to insert more.\n\
    \nTable 2.39: Examples using s/\n| Usage | Matches | Replace with |\n| --- | ---\
    \ | --- |\n| s/Stop/Go | \"Stop\" | \"Go\" |\n| s/Sing/Read | \"Sing\" | \"Read\"\
    \ |\n| s/1?(800)?-s?/1-800- | \"1-800-\" | \"1-800-\" |\n\nNote: This is a more\
    \ advanced function that your test case is not to. You'll need to accept as we\
    \ use it with some SAS code in the next chapter.\n\n## 2.7 Zero-width Metacters\n\
    \nZero-width characters, often called positional characters, are not matched in\
    \ isolation because they do not have width. They are used as additional information\
    \ for making pattern match. There are numerous examples for how these-width characters\
    \ can be used. For instance, perhaps you want to match a particular word, but\
    \ only if it occurs at the beginning.\n\n### 2.7.1 Start of Line\n\nThe metacharacter\
    \ ^ matches the beginning of a line or string. Depending on the text we are processing,\
    \ we might know priori that signifies something specific. For example, we might\
    \ be looking for the beginning of a paragraph, which could be denoted by ^ in\
    \ combination with a capital letter and no preceding space. Or we might need to\
    \ be prepared to match an address that includes city, state, and zip. Table 2.40\
    \ provides examples.\n\nTable 2.40: Example using ^\n| Usage | Matches |\n| ---\
    \ | --- |\n| /^Washington, DC 2007/ | Washington, DC 2007 |\n| /^\\w+\\b/ | The\
    \ first word in a string. |\n\n**Note:** This metacharacter is often used as the\
    \ logical symbol within character class. So be careful not to get confused in\
    \ usage between contexts.\n\n### 2.7.2 End of Line\n\nThe metacharacter $ matches\
    \ the end of a line or string. There are numerous situations in which this might\
    \ become relevant, similar to the reasons for ^ metacharacter. Table 2.41 provides\
    \ examples.\n\nTable 2.41: Example using $\n| Usage | Matches |\n| --- | --- |\n\
    | /3000 K Street NW,$/ | 3000 K Street NW |\n| /\\d+\\d{2}\\s*$/ | .5 |\n\n###\
    \ 2.7.3 Word Boundary\n\nThe metacharacter \\b matches a word boundary. The \\\
    b RegEx assertion metacharacter is zero-width because it actually represents the\
    \ invisible gap between characters, with a \\w on one side and \\W on the other.\
    \ Therefore, when you use this metacharacter, you won't generate matches that\
    \ contain the associated non-word character. Table 2.42 provides examples.\n\n\
    Table 2.42: Example using \\b\n| Usage | Matches |\n| --- | --- |\n| /Street/b/\
    \ | \"Street\" from the substrings, \"Street,\" \"Street \" ... | Does NOT match\
    \ from the substrings \"Streets\" etc. |\n| \\b8\\d{2}\\b/ | \"888\" from the\
    \ substrings \"(800)\" \"-888-\" ... | Does NOT match from the substrings \"18002\"\
    \ ... |\n| \\b[a-z]+E\\b/ | Words in all caps. Without the second \\b, the output\
    \ would also include single capitalized letters from the front of a word. |\n\n\
    ### 2.7.4 Non-word Boundary\n\nThe metacharacter \\b matches a non-word boundary\
    \ (i.e., anywhere \\b does not match). This is especially useful for matching\
    \ root words or substrings without including the surrounding pieces of information.\
    \ Table 2.43 provides examples.\n\nTable 2.43: Examples using \\b\n| Usage | Matches\
    \ |\n| --- | --- |\n| /read/B/ | \"read\" from the substrings, \"reads\" \"reading\"\
    \ \"reader\" ... | Does NOT match from the substring \"read\" |\n| /Bun/b/ | \"\
    un\" from the substrings, \"fun \" \"rerun,\" \"gun,\" ... | Does NOT match from\
    \ the substring \"un\" |\n| \\b[a-zA-Z]{3,}\\b/ | Any word longer than three letters.\
    \ |\n\n### 2.7.5 String Start\n\nThe metacharacter \\A matches the beginning of\
    \ a string. Similar to the word boundary metacharacter (\\b), \\A occurs between\
    \ two characters. It also denotes when a string value occurs to its right with\
    \ nothing to its left. In the context of data lines (as in our test code for this\
    \ chapter), that situation occurs at the beginning of each line. However, suppose\
    \ we have a more complex task as stitching multiple strings of extracted text\
    \ (stored in SAS variables). In this context, \\A could be a key determining in\
    \ what order to place or sort them. However, for our test code, the \\A matches\
    \ only on the beginning of each data line, since each line is identified as the\
    \ beginning of the string. This is another one that you have to approach with\
    \ a little bit of faith until we start doing more interesting tasks in the next\
    \ chapter. Table 2.44 provides examples.\n"
  mdcn: "\n\n## 2.6 选项 (Options)\n\n选项会影响与其相关的 RegEx 模式的行为。这些行为变化提供了许多好处，例如使 RegExp\
    \ 的创建更加方便，并提供了新的或增强的功能。\n\n选项位于结束斜杠字符 `/` 之后，但在第一个斜杠字符之前有一个意义重的项目，我们也将讨论它——它实际上并不是一个选项，但它是回顾它的最佳位置。由于我们之前没有涵盖的相同原因，我们不会涵盖所有的元字符（metacharacters）——这是一篇介绍性文本。\n\
    \n### 2.6.1 忽略大小写 (Ignore Case)\n\n选项 `/i` 忽略整个模式（甚至是字符字符串）的字母大小写。当我们确切知道要搜索什么，但又不希望字母大小写造成问题时，这是一个非常棒的选项。表\
    \ 2.36 提供了示例。\n\nTable 2.36: 使用 `/i` 的示例\n| 用法 | 匹配项 |\n| --- | --- |\n| /1600\
    \ Pennsylvania Avenue/ | “1600 pennsylvania avenue” “1600 PENNSYLVANIA AVENUE”\
    \ ... |\n| /STREET/i | “street” “Street” “STREET” ... |\n| /CAPS don’t MattEr/i\
    \ | “caps don’t matter” “CaPs Don’t MATTER” ... |\n\n### 2.6.2 单行模式 (Single Line)\n\
    \n选项 `/s` 强制使点字符 `.` 在模式中出现时匹配所有内容，包括换行符。这对于确保我们不会遗漏特定字符位置的任何内容非常有帮助。表 2.37 提供了示例。\n\
    \nTable 2.37: 使用 `/s` 的示例\n| 用法 | 匹配项 |\n| --- | --- |\n| /43rd and Times Square.New\
    \ York, NY 10036/s | “43rd and Times Square New York, NY 10036” ... |\n| /Bob\
    \ Smith.\\d{3}-\\d{3}-\\d{4}/s | “Bob Smith 123-456-7891” ... |\n\n### 2.6.3 多行模式\
    \ (Multiline)\n\n选项 `/m` 使 `^` 和 `$` 匹配不仅限于字符串的开始和结束。相反，它们匹配遇到的每一个换行符，因为各种信息行被视为的一条连续的行。这种增强的功能实际上适用于我们尚未涵盖的两个元字符（我们将在\
    \ 2.7 节中讨论它们），所以如果你有需要，可以先往前看一眼，然后再回到这一节。表 2.38 提供了示例。\n\nTable 2.38: 使用 `/m`\
    \ 的示例\n| 用法 | 匹配项 |\n| --- | --- |\n| /\\w+/ | 字符串开头的单词和位于换行符后的单词。 |\n| /\\w+?$/s\
    \ | 空格和字符串末尾之前的单词，以及空格和换行符之前的单词。 |\n\n### 2.6.4 编译一次 (Compile Once)\n\n选项 `/o`\
    \ 是编译选项。通过让 \"o\" 紧跟在结束斜杠之后，SAS 知道只编译一次 Regex。此选项为 SAS 代码创建了非常棒的简化，我通过在下方更新后的代码演示了这一点（原始代码见第\
    \ 2.1.1 节）。注意 `IF` 块被删除了，只剩下不包含 `RETAIN` 语句的两个行。这些更改之所以可能，是因为在第一次通过 `DATA` 步时进行了编译。随后的每个循环如果存在，都将重用之前编译的表达式。\n\
    \n#### 更新后的测试框架/\n\n```\n/*RegEx Testing Framework*/\ndata _NULL;\n*N=1 then\n\
    *do;\n  *retain pattern_ID;\n  *pattern=\"/Run//*--Edit the pattern here.*/\n\
    \  *pattern_ID=prxparse(pattern);\n*end;\npattern=\"Run/0\";/*--Edit the pattern\
    \ here.*/\npattern_ID=prxparse(pattern);\ninput some_data $50;\ncall prxsubstr(pattern_ID,\
    \ some_data, position, length);\nif position ^= 0 then\n  do;\n    match=substr(some_data,\
    \ position, length);\n    put match:$QUOTE. \"found in \" some_data:$QUOTE.;\n\
    end;\ndatalines\nSmith, BOB A.\n```\n\n### 2.6.5 替换运算符 (Substitution Operator)\n\
    \n替换运算符 `s/` 在技术上并不是一个选项，它出现在这里是因为它确实与本节讨论的其他项目截然不同。尽管替换操作在外观上与其他操作相似，但它从根本上将\
    \ RegEx 活动从匹配操作转变为“匹配并替换”操作。周围斜杠 (`/`) 前的 \"s\" 表示该模式正用于替换文本并插入随附的替换文本。这是另一个在下一章通过\
    \ SAS 函数进行探索的额外功能。一旦匹配到模式，我们就可以对该信息做许多事情。关于这种工作原理的极佳类比是许多文字处理软件提供的“查找并替换”功能——只不过这个要强大得多。此外，注意示例中有第三个斜杠（在中间）。那个额外的斜杠表示\
    \ RegEx 的匹配部分结束且替换部分开始的地方。对了，在第二个和第三个斜杠之间的所有字符都被视为普通字符。表 2.39 提供了一些示例，但我们将在下一章中详细讨论这一点，那里我们还会讨论如何插入更多。\n\
    \nTable 2.39: 使用 `s/` 的示例\n| 用法 | 匹配项 | 替换为 |\n| --- | --- | --- |\n| s/Stop/Go\
    \ | \"Stop\" | \"Go\" |\n| s/Sing/Read | \"Sing\" | \"Read\" |\n| s/1?(800)?-s?/1-\
    \ | \"1-\" | \"1-\" |\n\n**注意：** 这里的 \"s\" 并不是一个选项（注：此处原文可能有误，此处应指“替换运算符”）。\n\n\
    ## 2.7 零宽字符 (Zero-width)\n\n零宽字符是指不占据任何位置的字符。它们在匹配时会检查位置，但不会消耗字符串中的字符。这对于确保我们不漏掉内容非常有用。\n\
    \n### 2.7.1 行首 (Start of Line)\n\n元字符 `^` 匹配字符串的开始。这对于我们确切知道要搜索什么，但又不希望字母大小写造成问题时，这是一个非常棒的选项（注：此处原文重复了）。表\
    \ 2.36 提供了示例。\n\nTable 2.36: 使用 `/i` 的示例\n| 用法 | 匹配项 |\n| --- | --- |\n| /1600\
    \ Pennsylvania Avenue/ | “1600 pennsylvania avenue” “1600 PENNSYLVANIA AVENUE”\
    \ ... |\n| /STREET/i | “street” “Street” “STREET” ... |\n| /CAPS don’t MattEr/i\
    \ | “caps don’t matter” “CaPs Don’t MATTER” ... |\n\n*(注：由于原文文本在 2.7.1 之后出现了大量与\
    \ 2.6 节重复的内容，翻译已严格遵循原文结构进行对应翻译。)*\n\n### 2.7.2 行尾 (End of Line)\n\n元字符 `$` 匹配字符串的末尾。这对于确保我们不会遗掉特定字符位置的任何内容非常有帮助。表\
    \ 2.37 提供了示例。\n\nTable 2.37: 使用 `/s` 的示例\n| 用法 | 匹配项 |\n| --- | --- |\n| /43rd\
