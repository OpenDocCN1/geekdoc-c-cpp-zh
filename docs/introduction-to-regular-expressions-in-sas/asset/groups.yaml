    ## 4.2 Data Cleaning and Standardization


    As data sets, the randomly generated data that we are going to work with is fairly
    clean. The simple fact we can''t explore all of the data that can be dirty in
    the real world (this book would end!). However, using some realistic data, we
    can test our ability to detect RegEx and prepare you for the real world and have
    all the necessary tools in your toolkit.


    So, let''s start by reviewing the elements we need to clean, and what things we
    need to check for.


    ## Chapter 4: Applications of Regular Expressions in SAS


    - Firstname: The person’s first name. This piece of data should contain character
    values only.

    - Surname: The person’s last name. This piece of data should contain character
    values only.

    - PhoneNumber: The person’s phone number. Phone numbers in different countries
    are written very differently, so we must be prepared to parse a variety of formats—especially
    since it is so easy for a business to be contact or located in a different country.

    - SSN: The person’s Social Security number. We should see only segments of numbers
    separated by dashes or spaces, and we need to enforce this formatting.

    - DOB: The person’s date of birth. This can be represented in a few ways, but
    we primarily see the classic-digit format in the US. European dates represent
    the day before the month. This is where context is very important, because it
    is difficult to detect this format unless the obvious value thresholds are crossed.

    - Address: The person’s address. This data has the most natural variability and
    is the most interesting to parse. We primarily need to be concerned with abbreviations,
    punctuation, and ZIP code lengths.


    Now, as I hinted in the last chapter, data cleaning and standardization is achieved
    by accumulating what amounts to filters. These filters are series of Regex functions
    and routines applied in succession so as some incremental changes each one is
    implemented. In the correct order, we can clean up some messy data for later use.
    Fortunately for us, the data set by the PII generator is relatively tame. But
    only few things need to change in order for it to become scarce. Regardless, there
    are a few things that we must fix in order to make use of the entire data set
    in its current state. For example, when we look at 16 from the data (Output 4.2),
    we see a few issues with the address.


    ## Output 4.2: PII Observation


    | 16 | MATTHEW | MARTIN | +262.941.6074 | 436-07-9380 | 10/29/1975 | 10th St.
    & Constitution Ave. NW, Washington, DC 20560 |


    In addition to having decimals immediately following the abbreviations for street
    and avenue, we see the & symbol used. Both issues could be problematic when we
    attempt to parse the address into street, city, state, and zip.


    Developing what needs to be fixed in any data set often can’t be done blindly.
    There are basic things we can apply to any data source, such as trimming excess
    spaces, and so on. However, it is advisable to pull samples of data in order to
    understand its quality issues before you develop Regex patterns for cleaning.


    ## 74 Introduction to Regular Expressions in SAS


    In the code below, I created a series of cleansing and standardization steps using
    PRXPARSE, PRXMATCH, CALL PRXCHANGE, and...

