    ## 2.8 总结\n\n在本章中，我们探索了各种新概念，我尽力让它们易于理解。希望你现在已经准备好在接下来的章节中应对在 SAS 代码中实现这些概念的挑战。以下是你在后续页面及之后中需要记住的一些要点。\n\
    \n### 灵活性\n\n通过阅读本章，你应该已经明白，完成相同任务有许多方法，很少有方法是绝对正确或绝对错误的。你必须决定最有效、最高率的方法来实现你的目标，以确定适用于特定情况的最佳方案。\n\
    \n### 冰山一角\n\n我们才开始接触正则表达式（RegEx）功能的冰山一角。你所学的信息是一个坚实的基础，你可以在此基础上开发复杂的功能。\n\n###\
