    # 4.5 Summary


    In this chapter, we finally put it all together with a series of examples that
    touch on multiple ways regular expressions can be used in SAS. Hopefully, they
    were each motivating, educational, and useful—and actually helped the first chapters
    make more sense.


    We worked through three long-form examples—“Data Cleansing and Standardization",
    "Information Extraction"—that address commonly needed capabilities that should
    be generalizable to many contexts. These include, but are not limited to: law
    enforcement, retail, E-commerce, finance, and defense.


    At this point, you have all the tools and experience that you need in order to
    apply this information to highly complex problems in the real world. Before you
    do, here are some reminders.


    ### 4.5.1 Start Small


    It can''t be overlooked how beneficial it is to start with a simple task and build
    from there. By implementing RegEx capabilities on merely a small segment of a
    much larger problem, you are able to carefully build each element—ultimately ensuring
    more progress on the overall problem with less rework. This approach also allows
    the beginner to develop capabilities without becoming overwhelmed, which is always
    important for maintaining momentum during development projects.


    ### 4.5.2 Think Big


    Though you might be solving a small portion of a larger problem, you always have
    to think about the big picture. Always take the time to understand the context
    surrounding any development effort; the secondary and tertiary effects of your
    work can never be fully anticipated. Also, thinking about various aspects of any
    project can help you to anticipate the needs of your Regex patterns.


