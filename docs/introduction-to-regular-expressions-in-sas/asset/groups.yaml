    ## 4.2 数据清洗与标准化


    正如我们在上一章中提到的，数据清洗和标准化是通过积累一系列过滤器来实现的。幸运的是，我们正在处理的数据相对整洁。但在某些地方需要调整。让我们从查看我们需要清洗的元素开始：


    - **FirstName**: 名字

    - **Surname**: 姓

    - **PhoneNumber**: 电话号码

    - **SSN**: 社安号

    - **DOB**: 出生日期

    - **Address**: 地址


    ## 第 4 章：正则表达式在 SAS 中的应用


    **FirstName**: 名字。此字段应只包含字符。

    - **Surname**: 姓。此字段应只包含字符。

    - **PhoneNumber**: 电话号码。由于不同国家的号码格式非常不同，我们需要做好准备。

    - **SSN**: 社安号。我们应该看到由连字符或空格分隔的数字段，我们需要强制这种格式。

    - **DOB**: 出生日期。这种日期有多种表示方式，但我们主要看到经典的数字格式。欧洲日期月份在前面。在这里上下文非常重要，除非达到明显的阈值，否则很难检测。

    - **Address**: 地址。此数据具有最大的变异性，是解析中最有趣的部分。我们主要需要关注缩写、标点符号和邮编长度。


    在开发任何数据集中需要修复的问题时，不能盲目进行。我们可以对任何数据源进行一些基础操作，例如修剪多余空格等。然而，在开发清洗正则表达式模式之前，建议提取数据样本以了解其质量问题。


    现在，在下面的代码中，我使用 `PRXPARSE`、`PRXMATCH`、`CALL PRXCHANGE` 以及……创建了一系列清洗和标准化步骤：


    '
