    \ 37\n\n## 2.1 Introduction\n\nThis chapter focuses entirely on developing your\
    \ understanding of regular expressions (RegEx) before getting into the details\
    \ of using them in SAS. We will begin actually jumping right into the SAS code\
    \ behind all of this. However, RegEx patterns are a natural inclination to jump\
    \ into the SAS coding elements useful. Without going through RegEx first, the\
    \ forthcoming SAS functions and calls could be discussed only at a very theoretical\
    \ level, which is the opposite of what I am trying to accomplish in this book.\
    \ Also, trying to learn too many different elements of any process at the same\
    \ time can simply be overwhelming.\n\nTo facilitate the mission of this book—practical\
    \ application—without being overwhelmed by too much information at one time (new\
    \ functions, calls, and expressions), there is a very short bit of test code to\
    \ use with RegEx examples throughout the chapter. I want to stress the point that\
    \ obtaining a thorough understanding of RegEx syntax is critical for harnessing\
    \ the full power of this incredible capability in SAS.\n\nRegex consists of letters.\n\
    \nFor example, suppose we want to match the string of characters “Street” in an\
    \ address. The pattern would look like /Street/. But we are interested in doing\
    \ more with RegEx than just searching for strings. So, the remainder of this chapter\
    \ explores the various RegEx elements that we can insert into // to develop rich\
    \ capabilities.\n\n## Metacharacter\n\nBefore going any further, I should clarify\
    \ some upcoming terminology. Metacharacter is a term used quite frequently in\
    \ this book, so I need to be clear as to what it means. A metacharacter is a character\
    \ or set of characters used by a programming language like SAS for something other\
    \ than its literal meaning. For example, \\s represents a whitespace character\
    \ in RegEx patterns, rather than just being a \\ and the letter \"s\" collocated\
    \ in the text. We begin our discussion of specific metacharacters in Section 2.3.\n\
    \nAll nonliteral Regex elements are some kind of metacharacter. It is good to\
    \ keep this distinction, as I make references to character when I want to discuss\
    \ the actual string values or the results of metacharacter usage.\n\n## Special\
    \ Character\n\nA special character is one of limited set of ASCII characters that\
    \ affects the structure and behavior of Regex patterns. For example, opening and\
    \ closing parentheses, ( ), and are used to create logical groups of characters\
    \ or metacharacters in Regex patterns. These are discussed thoroughly in Section\
    \ 2.2.\n\n## Regex Pattern Processing\n\nAt this juncture, it is also important\
    \ to clarify how Regex are processed by SAS. SAS reads each pattern from left\
    \ to right in chunks, each element (character or metacharacter) of the pattern\
    \ in succession. If we want to match the string \"hello\", searches for the match\
    \ of the letter \"h\" is found. SAS determines whether the letter \"e\" immediately\
    \ follows, and so on until the entire string is found. Below is some pseudo code\
    \ for this process, for which the logic is true even after we begin replacing\
    \ characters with metacharacters (it would simply more impressive).\n\n## Pseudo\
    \ Code for Pattern Matching Process\n\n```\nSTART IF POS = \"h\" THEN+1 NEXT ELSE\
    \ POS+1 GOTO START\nIF POS = \"e\" THEN+1 NEXT ELSE POS+1 GOTO START\nIF POS =\
    \ \"l\" THEN+1 NEXT ELSE POS+1 GOTO START\nIF POS = \"l\" THEN+1 NEXT ELSE POS+1\
    \ GOTO START\nIF POS = \"o\" THEN MATCH=TRUE GOTO END ELSE POS+1 GOTO\n```\n\n\
    In this pseudo code, we see the START tag as our initiation of the algorithm,\
    \ and the END tag denotes the termination of the algorithm. Meanwhile, the NEXT\
    \ tag tells us to skip to the next line of pseudo code, and the GOTO tells us\
    \ to jump to a specified line in the pseudo code. The POS tag denotes the character\
    \ position. If we also use IF, THEN, and ELSE tags in the code.\n\nAgain, this\
    \ demonstrates the search for \"hello\" in some text source. The algorithm initiates\
    \ by testing the first character position is \"h\". If it is not, the algorithm\
    \ increments the character position by one—and tests for \"h\" again. If the first\
    \ position is \"h\", the character position is increased, and the code continues\
    \ for the letter \"e\" until the word \"hello\" is found.\n\n### 2.1.1 Regex Test\
