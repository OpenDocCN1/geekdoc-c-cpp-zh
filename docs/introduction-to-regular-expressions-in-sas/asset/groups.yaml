    \ chapter (See \"Repetition Modifiers\" in Section 2.4.2).\n\n**Table 2.9: Examples\
    \ using \\d**\n\n| Usage | Matches |\n|---|---|\n| /dst/ | \"1st\" \"9st\" \"\
    4st\" ... |\n| /10d/ | \"101\" \"102\" \"103\" ... |\n| /1-800-\\d\\d\\d-\\d\\\
    d\\dd/ | \"1-800-123-4567\" \"1-800-789-3456\" ... |\n\nNote: Just remember that\
    \ even though your pattern might be correct, the data is not necessarily correct\
    \ (4st and 9st don't make sense!).\n\n### 2.3.8 Non-digit\n\nThe metachar \\D\
    \ matches any single non-digit character. Again, this is the opposite of the lowercase\
    \ metachar \\d. This metachar matches on every value that is not a number. Table\
    \ 2.10 provides examples.\n\n**Table 2.10: Examples using \\D**\n\n| Usage | Matches\
    \ |\n|--- |--- |\n| /\\D800\\D123\\D4567/ | \"1-800-123-4567\" \"1.800.123.4567\"\
    \ ... |\n| /1560\\DW...Blvd/ | \"1560 Wilson Blvd\" \"1560_Wilson_Blvd\" ... |\n\
    | /19\\D:D\\DStreet/ | \"19th Street\" \"19th...Street\" \"19...Street\" ... |\n\
    \n### 2.3.9 Newline\n\nThe metachar \\n matches a newline character. It is quite\
    \ useful for some patterns to know that you have encountered a new line. For instance,\
    \ you might be processing addresses in a text file, which often contain different\
    \ pieces of information on different lines. Table 2.11 provides examples.\n\n\
    **Table 2.11: Examples using \\n**\n\n| Usage | Matches |\n|---|---|\n| /103 Pennsylvania\
    \ Ave.\\ NW,\\nWashington, DC 20216/ | \"103 Pennsylvania Ave. NW, Washington,\
    \ DC 20216\" |\n| /<html tag>\\n/ | \"<html tag>\\n\" |\n| /v\\ne'\\nr\\nt\\i\\\
