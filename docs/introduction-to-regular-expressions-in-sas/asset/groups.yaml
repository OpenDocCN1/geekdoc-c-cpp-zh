    \ by the RegEx. Notice that one RegEx is commented out. The RegEx in that line\
    \ behaves differently from the initial RegEx ID, which allows us to demonstrate\
    \ the trunc val and num options. We used this RegEx ID to create Output 3.8.2.\
    \ After the DATA step, we perform a PROC PRINT to create the output shown in Output\
    \ 3.8.1 and Output 3.8.2.\n\n```\ndata example;\n    input text $80;\n    datalines;\n\
    Ken can be reached at (801)443-9876\n103 Pennsylvania Ave NW, Washington, DC 20216\n\
    JP's address:\n650 1st St NE, Washington DC 20002\nCarl's information is: (910)\
    \ 998-8762\n3000 K Street NW, Washington, DC 20007\nEric can be reached at: (321)\
    \ 456-7890\n508 First St NW, Washington, DC 20001\nrun;\n\ndata changed;\n   \
