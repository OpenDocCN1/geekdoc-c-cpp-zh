    them. Table 2.2 shows a few examples of how to use them as normal characters.


    **Table 2.2: Examples using { } ^ $. . \*


    | Usage | Matches |

    |--- |--- |

    | /\$1,00 \$0.50 = \$1.50/ | "$1.00 + \$0.50 = \$1.50" |

