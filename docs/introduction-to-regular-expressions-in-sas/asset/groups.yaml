    \ 69\n\n## 3.1 Introduction\n\nThis chapter is focused on developing your understanding\
    \ of built-in SAS functions and call routines, and on starting to do some real\
    \ SAS coding. Here, you will learn the mechanics of how to implement the wonderful\
    \ RegEx metacharacters introduced in Chapter 2. Each function or call routine\
    \ has associated examples to ensure that their use is clear. We briefly discuss\
    \ how each is useful.\n\n### 3.1.1 Capture Buffer\n\nNow, before we go any further,\
    \ we have to address a concept called the capture buffer. The capture buffer is\
    \ a more advanced technique that I have avoided delving into thus far, but it\
    \ must be understood so that you can use some functions (required for PRXPAREN\
    \ and PRXPOSN, optional for PRXCHANGE). As you should recall from Chapter 2, parentheses\
    \ create local groupings within a RegEx, but they also do something interesting.\
    \ For every set of parentheses used in a particular RegEx pattern, a slot in a\
    \ memory buffer is created. This slot in memory is then referenceable just like\
    \ any variable (a more experienced programmer can think of it like a pointer buffer).\
    \ Each slot is created in sequential order of parentheses pair occurrence and\
    \ is referenced accordingly using the $ sign.\n\nFor example, the RegEx s(The)\
    \ (cat) (is) (fat)/4 $3 $1/ creates the output \"Fat the cat\". Now, imagining\
    \ that same ability to identify unknown data elements instead of just string to\
    \ literals. It could become a very powerful capability for standardizing or restructuring\
    \ data to meet specific needs.\n\n## 3.2 Built-in SAS Functions\n\nIn this section,\
    \ we cover the SAS functions for performing RegEx operations. SAS functions for\
    \ RegEx have the same usage limitations as built-in functions. (See SAS documentation.)\
    \ Also just like other functions, they can only take arguments and return output\
    \ in assignment statements and expressions.\n\nNote: Each RegEx function has PRX\
    \ at the beginning, which represents Perl-Regular-eX.\n\n### 3.2.1 PRXPARSE\n\n\
    #### Description\n\nThis function takes a RegEx pattern as input and provides\
    \ a numerical identifier as output. This identifier is used by other functions\
    \ and routines.\n\n#### Syntax\n\n```\nRegEx_ID = PRXPARSE(RegEx)\n```\nRegEx:\
    \ The pattern to be parsed (input)  \nRegEx_ID: Unique identifier returned (output)\n\
    \nNow, it is important to understand at this point what makes the /o option so\
    \ important when using PRPARSE. The /o option forces SAS to compile the pattern\
    \ once. When a particular RegEx is encountered in code (e.g., inside IF statement),\
    \ then we might not want to waste memory. In other cases, the decision is about\
    \ tradeoffs. When you're dealing with very few of these patterns or a small amount\
    \ of data, the tradeoffs don't really apply. But when we scale up to a system\
    \ using hundreds of patterns, or tens of millions of records, the memory usage\
    \ becomes very important.\n\n### Example 3.1: Defining Patterns with PRXPARSE\n\
    \nLet's revisit the last bit of code from Chapter 2 since it is already familiar.\
    \ The RegEx below is defined as /Smith/o, meaning that we are looking for any\
    \ occurrence of the string literal \"Smith\" within the data provided. This RegEx\
    \ is the argument for PRXPARSE, which creates an identifier that is assigned to\
    \ the variable name, ID. This variable is passed to the call routine PRXSTR, which\
    \ is discussed in the next section. You are familiar with the overall function\
    \ of this code by now, this need not to be a distraction.\n\nThe output of this\
    \ RegEx is presented in Output 3.1. As we expected, the code found every occurrence\
    \ of \"Smith\" regardless of what was surrounding—including other letters.\n\n\
    ```\n/*RegEx Testing Framework*/\ndata NULL;\npattern = \"Smith/o\"; /*Edit the\
    \ pattern here.*/\npattern_ID = PRXPARSE(pattern);\ninput some_data $5;\ncall\
    \ prxsubstr(pattern_ID, some_data, position, length);\n  if position ^= 0 then\n\
    \    do;\n      match = substr(some_data, position, length);\n      put match:QUOTE.\
    \ \"found in \" some_data:$QUOTE;\n    end;\nendatalines;\nSmith, BOB A.\nROBERT\
    \ Allen Smith\nSmithe, Cindy\n103 Pennsylvania Ave. NW, Washington, DC 20216\n\
    508 First St. NW, Washington, DC 20001\n650 1st St NE, Washington, DC 20002\n\
    3000 K Street NW, Washington, DC 20007\n1560 Wilson Blvd, Arlington, VA 22209\n\
    1-800-4567\n1(800) 789-1234\nrun;\n```\n\n### Output 3.1: Log Output of Pattern\
    \ /Smith/o\n\n![](img/c58184a1652486f0486b8350e0431fbb_54_0.png)\n"
