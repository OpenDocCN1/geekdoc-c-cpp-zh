    \ 1 |\n| 8 | 508 First St NW, Washington, DC 20001 | 1 | 80 | 0 | 0 |\n\n## 3.3.2\
    \ CALL PRXN\n\n### Description\nThis routine takes the RegEx ID and the capture\
    \ buffer N as inputs. It produces the Position and Length as outputs.\n\n### Syntax\n\
    ```sas\nCALL PRXN(RegEx ID, N)\n```\n- RegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\n- N: Integer value for the capture buffer\
    \ (input argument, required)\n- Position: Integer value of the character position\
    \ for the pattern (return value, required)\n- Length: Integer value for the length\
    \ of matched pattern (return value, optional)\n\n## Example 3.9: Context-specific\
    \ Algorithm Development\n\nSometimes it's useful to condition code behavior on\
    \ specific words occurring in text. In this example, you'll see how the functionality\
