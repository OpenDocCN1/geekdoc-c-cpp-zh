    \ due to the semi-structured nature of tag-based languages, they are certainly\
    \ easier to process than one might anticipate. All such languages have paired\
    \ opening and closing tags for defining various pieces of information. We can\
    \ leverage this to properly dissect and extract the information we need.\n\nWith\
