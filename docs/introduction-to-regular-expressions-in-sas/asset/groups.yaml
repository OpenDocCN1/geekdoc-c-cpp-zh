  - '[PAGE 45]


    # 2.6 Options


    Options affect the behavior of the RegEx pattern with which they are associated.
    These behavioral changes provide benefits ranging from RegExp creation more convenient,
    providing new or enhanced functionality.


    Options occur after the closing slash character, but there is one item of significance
    that occurs before the first slash character that we will also discuss—it is not
    actually an option but this is best place to go over it. And we are not going
    to cover all of the metacharacters for the same reason we haven''t covered far—this
    is an introductory text.


    # 2.6.1 Ignore Case


    The option/i ignores letter case for the entire pattern, even character strings.
    This is a great option to use when we know exactly what we are searching for,
    but for we don''t want the letter case to be an issue. Table 2.36 provides examples.


    Table 2.36: Examples using /i

    | Usage | Matches |

    | --- | --- |

    | /1600 Pennsylvania Avenue/ | “1600 pennsylvania avenue” “1600 PENNSYLVANIA AVENUE”
    ... |

    | /STREET/i | “street” “Street” “STREET” ... |

    | /CAPS don’t MattEr/i | “caps don’t matter” “CaPs Don’t MATTER” ... |


    # 2.6.2 Single Line


    The option /s forces the dot character (.) to match everything, including the
    newline character, when it occurs in the pattern. This can be very helpful to
    ensure that we don''t miss anything for a particular character position. Table
    2.37 provides examples.


    Table 2.37: Examples using /s

    | Usage | Matches |

    | --- | --- |

    | /43rd and Times Square.New York, NY 10036/s | “43rd and Times Square New York,
    NY 10036” ... |

    | /Bob Smith.\d{3}-d{3}-d{4}/s | “Bob Smith 123-456-7891” ... |'
  - "[PAGE 46]\n\nChapter 2: Getting Started with Regular Expressions 33\n\n# 2.6.3\
    \ Multiline\n\nThe option //m causes ^ and $ to match on more than the string\
    \ start and end respectively. Instead, they match every newline encountered because\
    \ the various lines of information are treated as one continuous line. This enhanced\
    \ functionality really applies to two metacharacters that we haven't covered yet\
    \ (we'll discuss them in Section 2.7), so if you need to, feel free to peek ahead\
    \ and come back to this one. Table 2.38 provides examples.\n\nTable 2.38: Examples\
    \ using //m\n\n| Usage | Matches |\n| --- | --- |\n| /\\w+/ | Words at the beginning\
    \ of a string and words following a newline character. |\n| /\\w+?$/s | Words\
    \ immediately before a space and the string end, and before a space and newline\
    \ character. |\n\n# 2.6.4 Compile Once\n\nThe option //o is the compile option.\
    \ By having the \"o\" immediately following the closing slash, SAS knows to compile\
    \ Regex once. This option creates a very nice simplification to SAS code, which\
    \ I demonstrate by showing updated code below (see Section 2.1.1 for the original\
    \ code). Notice how the IF block is removed, and only the two lines that do not\
    \ include the RETAIN statement remain. These changes are possible due to the compilation\
    \ having the first time through the DATA step. Every subsequent loop reuses the\
    \ previously compiled expression, if it exists.\n\n# Updated Test Framework/\n\
    \n```\n*RegEx Testing Framework*/\ndata _NULL;\n*N=1 then\n*do;\n  *retain pattern_ID;\n\
    \  *pattern=\"/Run//*--Edit the pattern here.*/\n  *pattern_ID=prxparse(pattern);\n\
    *end;\npattern=\"Run/0\";/*--Edit the pattern here.*/\npattern_ID=prxparse(pattern);\n\
    input some_data $50;\ncall prxsubstr(pattern_ID, some_data, position, length);\n\
    if position ^= 0 then\n  do;\n    match=substr(some_data, position, length);\n\
    \    put match:$QUOTE. \"found in \" some_data:$QUOTE.;\nend;\ndatalines\nSmith,\
    \ BOB A.\n```"
