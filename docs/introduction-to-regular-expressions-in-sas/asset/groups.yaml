    the optional arguments.


    # Example 3.8: Redacting Sensitive Data


    In this example, we focus on developing your understanding of the optional elements
    in CALL PRXCHANGE. As a change of pace, we''re going to develop a basic way to
    redact sensitive information. This is a frequent need, especially in the medical
    field, for protecting Personally Identifiable Information (PII). Now, we''re not
    going to eliminate all PII from the provided data because we are just demonstrating
    the functionality of CALL PRXCHANGE. However, this process is done more rigorously
    in the next chapter and on a larger scale.'
