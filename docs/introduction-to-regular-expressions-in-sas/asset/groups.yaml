    # 4.2 Data Cleaning and Standardization


    As data sets, the randomly generated data that we are going to work with is fairly
    clean. The simple fact we can''t explore all of the data that can be dirty in
    the real world (this book would never end!). However, using some realistic data,
    we can test our ability to detect RegEx code and prepare you for the real world
    and have all the necessary tools in your toolkit.


    So, let''s start by reviewing the elements we need to clean and standardize, and
    what things we need to check for analysis.'
  - '[PAGE 86]


    # Chapter 4: Applications of Regular Expressions in SAS 73


    Firstname

    The person’s first name. This piece of data should contain character values only.


    Surname

    The person’s last name. This piece of data should contain character values only.


    PhoneNumber

    The person’s phone number. Phone numbers in different countries are written very
    differently, so we must be prepared to parse a variety of formats—especially since
    it is so easy for a business to be contact from or located in a different country.


    SSN

    The person’s Social Security number. We should see only segments of numbers separated
    by dashes or spaces, and we need to enforce this formatting.


    DOB

    The person’s date of birth. This can be represented in a few ways, but we primarily
    see the classic-digit format in the US. European dates represent the day before
    the month. This is where context is very important, because it is difficult to
    detect this format unless the obvious value thresholds are crossed.


    Address

    The person’s address. This data has the most natural variability and is the most
    interesting to parse. We primarily need to be concerned with abbreviations, punctuation,
    and ZIP code lengths.


    Now, as I hinted in the last chapter, data cleaning and standardization is achieved
    by accumulating what amounts to filters. These filters are series of Regex functions
    and routines applied in succession so as some incremental changes each one is
    implemented. In the correct order, we can clean up some very messy data for later
    use. Fortunately for us, the data set by the PII generator is relatively tame.
    But only few things need to change in order for it to become scarce. Regardless,
    there are a few things that we must fix in order to make use of the entire data
    set in its current state. For example, when we look at 16 from the data (Output
    4.2), we see a few issues with the address.


    # Output 4.2: PII Observation


    | 16 | MATTHEW | MARTIN | +262.941.6074 | 436-07-9380 | 10/29/1975 | 10th St.
    & Constitution Ave. NW, Washington, DC 20560 |


    In addition to having decimals immediately following the abbreviations for street
    and avenue, we see the & symbol used. Both issues could be problematic when we
    attempt to parse the address into street, city, state, and zip.


    Developing what needs to be fixed in any data set often can’t be done blindly.
    There are basic things we can apply to any data source, such as trimming excess
    spaces, and so on. However, it is advisable to pull samples of data in order to
    understand its quality issues before you develop Regex patterns for cleaning.'
  - '[PAGE 87]


    # 74 Introduction to Regular Expressions in SAS


    In the code below, I created a series of cleansing and standardization steps using
    PRXPARSE, PRXMATCH, CALL PRXCHANGE, and PRXPOSN. Notice how clean our code is
    by using CALL PRXCHANGE in lieu of the function version.


    ```

    data CleanPII;

    set PII;


    ChangeAND = PRXPARSE(''s/\x26/and/'');

    ChangeSTR = PRXPARSE(''s/\(St)|[St]/ Street/o'');

    ChangeAVE = PRXPARSE(''s/\(Ave)|[Ave]/ Avenue/o'');

    ChangeRD = PRXPARSE(''s/\(Rd)|[Rd]/ Road/o'');

    ChangeDASH = PRXPARSE(''s/\*(.|\(|\))\s*-\-/o'');

    ChangePLUS = PRXPARSE(''s/\+/+o'');

    ChangeSPAC = PRXPARSE(''s/ //o'');


    /*Cleaning Address*/

    CALL PRXCHANGE(ChangeAND,-1, address);

    CALL PRXCHANGE(ChangeSTR,-1, address);

    CALL PRXCHANGE(ChangeAVE,-1, address);

    CALL PRXCHANGE(ChangeRD,-1, address);


    /*Cleaning Number*/

    CALL PRXCHANGE(ChangeDASH,-1, PhoneNumber);

    CALL PRXCHANGE(ChangePLUS,-1, PhoneNumber);

    CALL PRXCHANGE(ChangeSPAC,-1, PhoneNumber);


    /*Cleaning SSN*/

    CALL PRXCHANGE(ChangeDASH,-1, SSN);

    CALL PRXCHANGE(ChangeSPAC,-1, SSN);


    /*Cleaning DOB*/

    CALL PRXCHANGE(ChangeSPAC,-1, DOB);


    drop ChangeAND ChangeSTR ChangeAVE ChangeDASH ChangePLUS

    ChangeSPAC;

    run;


    data FinalPII;

    set CleanPII;

    ```'
  - "[PAGE 88]\n\n# Chapter 4: Applications of Regular Expressions in SAS 75\n\n```\n\
    /*Parsing the address into its discrete parts*/\nAddr_Pattern =\nPRXPARSE('/^\\\
    ((\\w+\\s*\\w+)*\\s*,\\s+(\\w+\\s*\\w+)*,\\s+(\\w+\\s*+((\\d{5})*-?\\(\\d{4})|(\\\
    d{5))))/o');\nif PRXMATCH(Addr_Pattern, address) then 6\n    do;\n        Street\
    \ = PRXPOSN(Addr_Pattern, 1, address);\n        City = PRXPOSN(Addr_Pattern, 3,\
    \ address);\n        State = PRXPOSN(Addr_Pattern, 4, address);\n        Zip =\
    \ PRXPOSN(Addr_Pattern, 5, address);\n    end;\ndrop Addr_Pattern address;\nrun;\n\
    proc print data=finalpi;\nrun;\n```\n\n+   1. First, we create a series of replacement\
    \ RegEx pattern identifiers using PRXPARSE. We maintain the \"change\" naming\
    \ convention to denote that each identifier represents a RegEx pattern for changing\
    \ the source.\n2. Here we apply specific RegEx_ID's by using the CALL PRXCHANGE\
    \ routine to clean each of the variables in different ways.\n3. Finally, we parse\
    \ the original address data into its constituent parts: street, city, state, and\
    \ zip. The PRXPOSN function grabs each piece of the address by identifying the\
    \ associated capture buffer. Notice that we have to skip buffer location 2 because\
    \ the second bracket set is used for logical separation inside the first bracket\
    \ set (which creates buffer 1). Referencing buffer location 2 would provide only\
    \ a subset of the street information we need.\n\nAs we see in Output 4.3, our\
    \ resulting data set now has clean, standardized data in each field. Such data\
    \ makes future analysis and manipulation much easier and more accurate. This exercise\
    \ should serve a nice warm-up for many other applications."
