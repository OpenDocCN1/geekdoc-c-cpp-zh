  md: 'RegEx_ID. Simply providing the RegEx is not an option, so this function must
    be used in conjunction with the PRXPASE function.


    # Syntax


    ```

    Paren=PRXPAREN(RegEx_ID)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPASE (input argument, required)


    Paren: Numerical reference value of the largest capture buffer (output, required)


    **Note:** Since this function requires a Reg_ID in lieu of the actual RegEx, it
    is implied that all precedents are forced to use Reg_ID instead of RegEx as well—otherwise,
    PRXPAREN cannot be used.


    What are we really trying to achieve with this function? Since it provides the
    length of the capture buffer by telling us the largest buffer to contain text,
    we know exactly how many buffer values we can access. Because we know this, we
    can avoid errors when referencing in code. It is worth noting that effective RegEx
    coding avoids many potential problems. However, it is always best practice to
    create fail-safe measures. Additionally, we can use this function to identify
    which of several options has been triggered inside the source.


    # Example 3.6: Identifying Capture Buffers


    Ideally, when we want to use the PRXSON function, the data that we expect to be
    available in the source is available. However, we know that in reality, that is
    not always the case. So, we have to write code that can account for a reasonable
    amount of variability in any data that we might need to process. We are going
    to explore an advanced example in the next chapter (see Section 4.2) that leverages
    the basic concepts outlined by this example.


    Now, suppose we have a pattern with multiple possible matches embedded in it.
    How do we know which option allowed the pattern to create a match? In the code
    below, we see that it is possible to use PRXPAREN to answer this question. We
    have a simple pattern with three possible matches: "Dog", "Rat", and "Cat". Each
    is encapsulated by parentheses to create a capture buffer location. However, notice
    that the group is inside another set of parentheses. Unless for practical purposes,
    this was done to demonstrate how capture buffers are numbered. Also note that
    this is not the most efficient way to write such code. We have sacrificed efficiency
    in order to clarify how the buffers work. Notice in our output “Dog” has a capture
    buffer of 2 despite being the first item in the OR list. Why? Because the outer
    set of parentheses is encountered first by SAS, creating a capture buffer element
    at position 1.'
