    # 4.1 Introduction


    In this chapter, we explore some real-world applications of RegEx with SAS, demonstrating
    a wide variety of scenarios in which we can implement what you have learned thus
    far. The general categories that these examples have been placed under do not
    to imply that we are limited in what we can do (see Chapter 1), nor do they imply
    a lack of overlap between them.


    Now, in order to execute some of the applications to follow, we need a good source
    of addresses, phone numbers, names, birthdays, and Social Security numbers. Obviously,
    these sources are hard to come by for experimentation (that is a lot of personal
    information!). Therefore, for the sake of practice, I created some code to randomly
    generate these sensitive data items. The code for random Personally Identifiable
    Information (PII) elements is presented below and is not repeated for the applicable
    applications. Access to real data sources is always preferable when developing
    robust code, but the following random generator does a fair job of inserting some
    variability into these elements. Feel free to experiment with it to obtain a different
    records or greater variability.


    While all of the examples in this chapter are realistic, there is still room for
    improvement. However, we can only do so much in this book. So, at the end of each
    section, I assign you some homework— suggested assignments for how to improve
    the code already provided. These items should prove especially interesting for
    the advanced programmers among us.'
  merge: -1
  pgno: 78
