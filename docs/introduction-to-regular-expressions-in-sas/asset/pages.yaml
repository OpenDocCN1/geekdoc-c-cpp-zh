  md: "# Chapter 4: Applications of Regular Expressions in SAS 77\n\n# 4.3 Information\
    \ Extraction\n\nParsing large volumes of text to generate structured data sets\
    \ is a common, valuable use of RegExp capabilities. For example, we might want\
    \ to collect information from a technology blog or website that contains valuable\
    \ customer feedback about our product. Such information could not easily or cheaply\
    \ gathered by hand for the sake of further analysis. Due to the wide variety of\
    \ possible sources from which we might need to extract information, as well as\
    \ the wide array of end goals for the information, there are a number of approaches\
    \ to accomplishing this task. Given the proliferation of tag-based languages such\
    \ as HTML and XML, we need to be prepared to effectively extract information from\
    \ them.\n\nNow, due to the semi-structured nature of tag-based languages, they\
    \ are certainly easier to process than one might anticipate. All such languages\
    \ have paired opening and closing tags for defining various pieces of information.\
    \ We can leverage this to properly dissect and extract the information we need.\n\
    \nWith more sophisticated techniques at our disposal (like using the SAS macro\
    \ facility), we could actually “learn” the embedded elements and extract the data\
    \ associated with the discovered variables. However, emphasis on these techniques\
    \ is the scope of this book. Therefore, we need to know the various tags we are\
    \ looking for in the XML or HTML source in advance. We will use this approach\
    \ to process the XML file in our example.\n\nGoing back to the administrative\
    \ proceedings example from Chapter 1, let's parse and extract the information\
    \ from the sample file:\n\nFigure 4.1: SEC XML Sample\n\n```\n<xml version=\"\
    1.0\" encoding=\"ISO-8859-1\"?>\n<root>\n  <administrative_proceeding>\n    <url>http://www.sec.gov/litigation/admin/2009/34-61262.pdf</url>\n\
    \    <release_number>34-61262</release_number>\n    <release_date>Dec. 30, 2009</release_date>\n\
    \    <respondents>Stephen C. Gingirch</respondents>\n  </administrative_proceeding>\n\
    \  <administrative_proceeding>\n    <url>http://www.sec.gov/litigation/admin/2009/34-61256.pdf</url>\n\
    \    <release_number>34-61256</release_number>\n    <release_date>Dec. 30, 2009</release_date>\n\
    \    <respondents>Cawell Funds LLC</respondents>\n  </administrative_proceeding>\n\
    \  <administrative_proceeding>\n    <url>http://www.sec.gov/litigation/admin/2009/34-61255.pdf</url>\n\
    \    <release_number>34-61255</release_number>\n    <release_date>Dec. 30, 2009</release_date>\n\
    \    <respondents>Cawell Funds LLC</respondents>\n  </administrative_proceeding>\n\
    \  <administrative_proceeding>\n    <url>http://www.sec.gov/litigation/admin/2009/34-61252.pdf</url>\n\
    \    <release_number>34-61252</release_number>\n    <release_date>Dec. 29, 2009</release_date>\n\
    \    <respondents>Banc One Investment Advisors Corporation and Mark A. Beeson</respondents>\n\
    \  </administrative_proceeding>\n</root>\n```"
