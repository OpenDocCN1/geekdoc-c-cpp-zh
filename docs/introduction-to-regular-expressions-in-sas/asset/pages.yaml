    | /19\D:D\DStreet/ | "19th Street" "19th...Street" "19...Street" ... |


    # 2.3.9 Newline


    The metachar \n matches a newline character. It is quite useful for some patterns
    to know that you have encountered a new line. For instance, you might be processing
    addresses in a text file, which often contain different pieces of information
    on different lines. Table 2.11 provides examples.


    Table 2.11: Examples using \n

    | Usage | Matches |

    | /103 Pennsylvania Ave.\ NW,\nWashington, DC 20216/ | "103 Pennsylvania Ave.
    NW, Washington, DC 20216" |

    | /<html tag>\n/ | "<html tag>\n" |

    | /v\ne''\nr\nt\ni\ne\na\nl\nt\ne\nx\nt/ | "...v... e r t" |'
