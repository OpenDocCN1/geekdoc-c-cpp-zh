    # Greedy n Times


    The modifier [n] creates a match of exactly n times. Being able to match on exactly
    n times is the same as using that metacharacter out many times. However, from
    the perspective of coding and maintaining the RegEx patterns, using the modifier
    is a much better approach. It limits the opportunity to make typographical errors
    when initially creating the RegEx pattern, and it improves readability when later
    editing and sharing the patterns. Table 2.27 provides examples.


    **Table 2.27: Examples using {n}**


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{3}-d{4}/ | "1-800-123-4567" "1.800.123.4567" ... |

    | /Rw{4}/ | "Round" "Runts" "Ruins" ... |

    | /19D{3}Street/ | "19th Street" "19thStreet" "19...Street" ... |

    | /d{5,}-d{4}(d{5})/ | "12345-6789" "12345" ... |


    # Greedy n or More


    The modifier [n,] creates a match at least n times. By ensuring that we can match
    at least n times, we are able to create functionality very similar to the plus
    modifier. However, we are raising the minimum number of times that the metacharacter
    must match. This is quite useful for certain applications, but must be handled
    with caution. Also, the + + modifier can easily get very long strings of unanticipated
    matches due to a single logical error in pattern construction. Table 2.28 provides
    examples.


    **Table 2.28: Examples using {n,}**


    | Usage | Matches |

    | :--- | :--- |

    | /1-800-d{1,-}-d{2}/ | "1-800-123-4567" "1-800-789-12" ... |

    | /d{3,}-d{2},-d{4}/ | "143-25-7689" "123456789-54654564-9820" ... |

    | /19D{3}Street/ | "19th Street" "19th, Not My Street" ... |'
