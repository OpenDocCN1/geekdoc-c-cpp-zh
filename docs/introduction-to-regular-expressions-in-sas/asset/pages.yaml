  md: '# 3.2.4 PRXPOSN


    # Description


    PRXPOSN returns the matched information from specified capture buffers. Also,
    any RegEx function requires the RSUBSTR, PRMATCH, PRXNEXT, and PRXCHANGE functions
    to be running before used so that the buffer can be referenced. Also, RegEx ID
    is required than the actual RegEx. Otherwise, PRXPOSN will not work—necessitating
    the use of PRXPARSE. The N input argument is numeric and refers to the capture
    buffer ($).


    # Syntax


    ```

    Text = PRXPOSN (RegEx_ID, N, Source_Text)

    ```


    +   RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    +   N: Integer value of the capture buffer (input argument, required)


    +   Source_Text: The text variable or literal to be operated upon (input argument,
    required)


    +   Text: Character variable assignment of captured text (output, required)


    When we know the exact number of capture buffer elements (i.e., N is known), we
    can use PRXPOSN without an issue. However, what happens when the number of elements
    is different from what we expect? If there are values in the capture buffer but
    we make a reference that is larger than those available (maybe there are three
    or, but we make a reference to number 5), then a missing value is returned. However,
    if we reference buffer position 0 (N=0), then the entire pattern is returned regardless
    of the buffer length.


    The next function, PRXPAREN, is very helpful in creating robust code when we are
    using the capture buffers in conjunction with PRXPOSN. It is also important to
    write robust RegEx patterns to ensure that you prevent issues from popping up.


    # Example 3.5: Extracting Data with Capture Buffers


    In order to make the capture buffer and this new function more clear, we''re going
    to walk through a concrete example. Suppose we want to process addresses for the
    structure is known and store many variables in a SAS dataset for later. Since
    we know the layout of the address, the capture buffer arrangement and the application
    of PRXPOSN are both straightforward.


    First, we test the RegEx ID variable Text by using the PRXPARSE function. Notice
    that this is an implicit test of a match existing (no equal sign is used). If
    a match of the RegEx exists within the identified text source, then we assign
    the capture buffer values to variables by PRXPOSN (city, state, and zip).


    Output 3 displays the values of extract, the data set created in our SAS step.
    As expected, we extracted the city, state, and ZIP code from each datalines entry.
    we''re going to build on this'
