    # 4.4 Search and Replacement


    The specific needs for search and replace functionality can vary greatly, but
    nowhere is this capability more necessary than for PII redaction. Redacting PII
    is a frequent concern in the public sector, where information sharing between
    government agencies or periodic public release is often mandated. We revisit the
    data from our cleansing and standardization example here since it has exported
    because it includes the kinds of information we would likely want to reduce. In
    an effort to make this more realistic, the example data that used in Section 4.2
    has been exported to a text file. We want to know how to perform this task on
    any data source, from the highly structured to the completely unstructured. We
    already worked with structured data sources for this technique, so exploring unstructured
    data sources is a natural next step.


    Now, before we get into how to perform the redaction, it is worth showing how
    the TXT file was created. Despite knowing how it is created in advance, we want
    to behave as though we have no knowledge of its construction in order to ensure
    that we are creating reasonably robust code.


    You can see in the code snippet below that we simply take the resulting data set
    from Section 4.2, FinalPII, as input via the SET statement. Next, we use the FILE
    statement to create the TXT file reference. Once the FILE statement is used, the
    following PUT statement automatically writes the identified variables to it.


    ```

    data NULL;

    set finalpii;

    file ''F:Introduction to Regular Expressions with

    SAS\Chapter_4_Example_Source\FinalPII_Output.txt'';

    put surname firstname sssn ssn dob phonename street city state zip;

    run;

    ```


    Output 4.5 shows the output provided by this code. As we can see, the structure
    is largely removed, though not entirely. This allows us to more closely approximate
    what you might encounter in the real world (which could be PII stored in a Microsoft
    Word file).'
