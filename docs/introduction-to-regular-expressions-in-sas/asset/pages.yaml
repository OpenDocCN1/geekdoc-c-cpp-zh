    # 2.3.8 Non-digit


    The metachar \D matches on any single non-digit character. Again, this is the
    opposite of the lowercase metachar \d. This metachar matches on every value that
    is not a number. Table 2.10 provides examples.


    Table 2.10: Examples using \D

    | Usage | Matches |

