  md: '```

    data sample;

    input address $50;

    datalines

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St NW, Washington, DC 20001

    650 1st NE, Washington DC 20002

    3000 K Street NW, Washington, DC 20007

    ;

    run;


    data null;

    set sample end=last;

    Street_RXID = PRXPARSE(''/s\|s)?(\s|\w+)?\s+/ St. /o'');

    AddParse_RXID = PRXPARSE(''/(.+),*\s?(\w+),*\s?(\w+)?\s?(\w+)?/(\d+)/$1,$2,$3,$4/'');

    text = PRCHANGE(Street_RXID,-1,address);

    text2 = PRCHANGE(AddParse_RXID,-1,text);

    put Street_RXID AddParse_RXID;


    if last then do;

    call PRXFREE(Street_RXID);

    call PRXFREE(AddParse_RXID);

    put Street_RXID AddParse_RXID;

    end;

    ```


