    # 4.2 Data Cleaning and Standardization


    As data sets, the randomly generated data that we are going to work with is fairly
    clean. The simple fact we can''t explore all of the data that can be dirty in
    the real world (this book would never end!). However, using some realistic data,
    we can test our ability to detect RegEx code and prepare you for the real world
    and have all the necessary tools in your toolkit.


    So, let''s start by reviewing the elements we need to clean and standardize, and
    what things we need to check for analysis.'
