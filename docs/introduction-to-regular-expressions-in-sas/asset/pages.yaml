  md: '# 16 Introduction to Regular Expressions SAS


    Table 2.4: Examples using \w


    | Usage | Matches |

    | --- | --- |

    | /R/wn/ | "Ran" "Run" "Ron" ... |

    | \wun/ | "Fun" "fun" "Run" "run" "Bun" "bun" _un" ... |

    | /Street\w/ | "Streets" "Street" |


    Note: The \w wildcard should not have any unintentional spaces before or after
    it. Such result result in the pattern trying to match those additional spaces
    in addition to the \w. (This goes for any RegEx metacharacter.)


    # 2.3.3 Non-word


    The metacharacter \W matches a non-word character value (i.e., everything that
    \w doesn''t include, except for the-elusive-''). The \W metacharacter is valuable
    when you are sure what is in a character but you know that you don''t want a word
    character (i.e., alphanumeric and _). Table 2.5 provides examples.


    Table 2.5: Examples using \W


    | Usage | Matches |

    | --- | --- |

    | /Washington/W/ | "Washington; "Washington," "Washington;" ... |

    | /D/WC/W/ | "D.C," "D C," "D C " ... |

    | /Street\W/ | "Street," "Street," "Street+\ |


    Note: You will continue to lowercase and uppercase versions of these RegEx characters
    acting as opposites, with some exceptions. It might not be clever, but does help
    simplify matters.


    # 2.3.4 Tab


    The metacharacter \t matches only the tab character in a string. Unlike the RegEx
    characters to follow, this metacharacter matches only the tab whitespace character.
    This is es useful when the tab holds some special significance, such as when you
    are processing tab-delimited text files. Table 2.6 provides examples.


    Table 2.6: Examples using \t


    | Usage | Matches |

    | --- | --- |

    | /SAS/t/ | "SAS " |

    | /SAS/tInstitute\t/ | "SAS Institute Inc" |

    | /Street\t/ | "Street " |'
