    Source_Text: The text to be operated upon (input argument, required)

    Position: Integer value for the character position for the first character in
    the matched pattern (returned value, required)

    Length: Integer value for the length of the matched pattern (returned value, optional)


    This call is used extensively in Information Extraction applications like those
    discussed in Chapter 4. Since only the position and length of matches are identified
    by CALL PRXSUBSTR, it must be used in conjunction with a function like SUBSTR
    to extract the actual text.


