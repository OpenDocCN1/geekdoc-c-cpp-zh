  md: '# 2.3 Basic Metacharacters


    As you write RegExp patterns in the future, you will find yourself using most
    of the metacharacters discussed in this section frequently because they are fundamental
    elements of RegExp pattern creation. Now, we can already build some useful patterns
    with the information discussed in Section 2.1. However,


    the metacharacters in this section create the greatest return on time investment
    due to flexible and powerful they can make RegEx patterns.


    Notice as we go through the examples how we can obtain some unexpected results.
    It is important to be very strategic when using some of these RegExp metacharacters
    as you don''t always know what to expect in the text that you are processing.
    When you know the source code, there are inevitably errors or unknown changes
    that can wreck poorly designed pattern. So, like any good analyst, you need to
    think a few steps ahead in order to maintain robust RegEx code.


    **Note:** Unlike SAS, all RegEx metacharacters are case sensitive, If a letter
    is defined here as lowercase or uppercase, then it MUST be that way. Otherwise,
    your programs will do something very different from what you expect. In other
    words, even though you can be lazy with capitalization when writing SAS code (e.g.,
    DATA vs. data), the same is not true here.


    # 2.3.1 Wildcard


    The wildcard metacharacter, which is a period (.), matches any single character
    value, except for a newline character (

    ). The ability to match virtually any single character can prove useful when you
    are searching for the superset of character strings. You might also want to use
    it when you have no idea what values might be in a particular character position.
    Table 2.3 provides examples.


    **Table 2.3: Examples using .**


    | Usage | Matches |

    |---|---|

    | /.rn/ | "Run" "R+n" "R n" "R(n)" "Ron" ... |

    | /.un/ | "Fun" "fun" "Run" "run" "bun" "(un" ... ... |

    | /Street/ | "Street," "Street," "Street+" "Street_ ... |


    **Note:** The period matches anything except the newline character (

    )—including itself. This can be helpful, but be used wisely. Also note, \n matches
    the newline character.


    # 2.3.2 Word


    The metacharacter \w matches any character value, which includes alphanumeric
    and underscore (\_) values. It matches any single letter (regardless of case),
    number, or underscore for a single character position. But do not be fooled by
    the underscore inclusion; \w does NOT match hyphens, dashes, spaces, or punctuation
    marks. Table 2.4 provides examples.'
