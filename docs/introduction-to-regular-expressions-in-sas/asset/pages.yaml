  md: "Length: Integer value for the length of the matched pattern (returned value,\
    \ required)\n\nThis call routine can be used for two applications:\n\n+   1. searching\
    \ for a pattern within a defined range\n2. searching for a pattern iteratively\
    \ throughout text, including multiple occurrences per line\n\nThe first application\
    \ of CALL PRXNEXT is a straightforward implementation of the routine’s parameters.\
    \ However, the second usage is less apparent from its definition. Therefore, we\
    \ focus on that usage of the routine in our example.\n\n# Example 3.11: Pattern\
    \ Matching Multiple Times per Line\n\nBeing able to identify a pattern number\
    \ of times in a particular line of text is valuable for many practical applications.\
    \ For example, performing word counts clearly clears this ability for accurate\
    \ counts to be obtained.\n\nThe code below shows how to USE PRXNEXT to identify\
    \ multiple occurrences of our pattern on each row from the data-lines source.\
    \ The pattern is defined to match any string that is three characters (w) in length\
    \ and ends with “w”. The Start and Stop variables are initialized to character\
    \ positions 1 and Length(some_data) respectively. These variables must be provided\
    \ with initial values for the routine’s first use. However, subsequent calls reset\
    \ the start position to the character immediately following the most recent successful\
    \ match. This is a fact that we take advantage of the DO WHILE loop. If we were\
    \ to eliminate the loop portion of code, we would merely be searching for the\
    \ pattern in a defined range (use the above application #1), but having the loop\
    \ allows us to achieve the desired functionality (use the above application #2).\
    \ See the results in Output 3.11.\n\n```\ndata _NULL;\ninput some_data = $50;\n\
    \npattern = \"/wun/o\";\npattern_ID = PRXPARSE(pattern);\nstart = 1;\nstop = length(some_data);\n\
    \nCALL PRXNEXT(pattern_ID, start, stop, some_data, position, length);\ndo while\
    \ (position > 0);\n  found = substr(some_data, position, length);\n  put \"Line:\"\
    \ _N found= position= length=\n\n  CALL PRXNEXT(pattern_ID, start, stop, some_data,\
    \ position, length);\nend;\n```"
