  md: '# 2.3.13 Hexadadecimal matches


    The metacharacter \xdd character of the form dd. The purpose of our implementation
    here is again not about searching through raw hexadecimal files, etc. We are using
    this to search for the hexadecimal code associated with the ASCII characters that
    we want in a source (manipulation of raw hex data sources is a different book).
    Table 2.15 provides examples.


    # Table 2.15: Examples using \xdd


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | \x2B/ | "+\ | This hexadecimal code translates to the + ASCII character. |

    | \x31\x2B\x31\x3D\x32/ | "1=2" | These hexadecimal codes translate to the 1+1=2
    ASCII characters. |

    | \x30\x30\x20\x46\x46/ | "0 FF" | This is a reminder that we can match hexadecimal
    numbers stored in ASCII, and that they are not the same. |


    # 2.4 Character Classes


    In addition to the built-in RegEx characters to match patterns, users have the
    ability to create custom character matching. This capability is derived via different
    uses of [ ] square braces. The square braces essentially create a custom metacharacter,
    the items contained between the opening brace and closing brace possible match
    values for a single character cell. In addition to putting a list characters inside
    the braces, you can also include metacharacters. Each metacharacter discussed
    below includes an example, which includes the use of a metacharacter, and they
    all have the same result. Just for fun, when they are identifying a hexadecimal
    number range present in the ASCII source file (stored as ASCII characters in the
    source file, but representing the range of possible hexadecimal values).


    Note: Remember that some of the components discussed in this section are special
    characters that must be escaped with \n in order to be matched in isolation. Specifically,
    these characters are: ^, [, and ].


    # 2.4.1 List [...]


    The metacharacter [...] matches any one of the specific characters or metacharacters
    listed within the braces. Being able to define an unordered list of things that
    you want to appear in a space is very convenient, and can sometimes be more convenient
    than the metacharacters that identify broad classes of character types. Table
    2.16 provides examples.'
