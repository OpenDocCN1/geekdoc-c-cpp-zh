    or other tag-based languages (e.g., HTML), further reading on the topic is recommended.
    Though you don''t need to know them at a deep level in order to process them effectively,
    it will save a lot of heartache to have an appreciation for how they are structured.
    I use some tag-based languages as part of the advanced examples in this book because
    they are so prevalent in practice.


    # # 1.4.3 Data Enrichment


    Data enrichment is the process of using the data that we have to collect additional
    details or information from other sources about our subject matter, enriching
    the value of that data. In parsing and structuring text, we can leverage the power
    of regular expressions in SAS to enrich data.


    So, we are going to do economic impact analysis of the main SAS campus—Cary, NC—on
    the surrounding communities. In order to do this properly, we need to perform
    statistical analysis using geospatial information.


    The address information is easily acquired from www.sas.com. However, it is useful,
    if not necessary, to include additional geo-location information such as latitude
    and longitude for effective analysis and reporting of geospatial statistics. The
    process of automating this is non-trivial, containing advanced programming steps
    that are beyond the scope of this book. However, it is important for you to understand
    that the techniques described in this book lead to just sophisticated capabilities
    in the future. To make these techniques more tangible, we will walk through the
    steps and their results.


