    # 3.3 Built-in SAS Call Routines


    In this section, you learn about the PRX call routines available in SAS for performing
    many of the same RegEx tasks as the functions previously discussed, as well as
    some new ones. However, just like all other call routines, PRX call routines cannot
    be used in expressions or assignment statements. The way they are implemented,
    and their ultimate functionality, is slightly different when compared to the functions.
    These differences are explored more thoroughly in the associated examples.'
