  md: '# Chapter 2: Getting Started with Regular Expressions 11


    patterns, rather than just being a \ and the letter "s" collocated in the text.
    We begin our discussion of specific metacharacters in Section 2.3.


    All nonliteral Regex elements are some kind of metacharacter. It is good to keep
