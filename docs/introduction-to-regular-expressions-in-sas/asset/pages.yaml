  md: '# 2.3.11 Control Character


    The metacharacter \cA-\Z matches a control character for the letter that follows
    the \c. For example, \cF matches control-F in the source. This is one of several
    examples where you might be processing less-used file types (i.e., not a file
    meant for humans to read). Control characters, or non-printing characters, were
    once used extensively by transactional computing and telecommunications systems.
    These control characters, while not visible in most text editors, are still part
    of the ASCII character set, for our examples in Table 2.13, we stick with the
    convention that is used for the alarm metacharacter above—the standard ASCII abbreviation
    is used despite the fact that they have never actually seen in text.


