  md: '# 82 Introduction to Regular Expressions in SAS


    ```

    Redact_Phone = PRXPARSE(''s/(\d\*)?\s*\d(3)-\s*\d(3)-\s*\d(4))/REDACTED/o'');

    Redact_DOB = PRXPARSE(''s/(\d(1,2)\s*\d(1,2)\s*\d**\s*\d(4))/REDACTED/o'');

    Redact_Addr = PRXPARSE(''s/(\w+)?\s*(\w+)\s*(\w+)?\s*(\w+)?\s*(\w+)?\s*(\d(4))\s*\d(5))/REDACTED,
    REDACTED 4 REDACTED'');

    CALL PRXCHANGE(Redact_Addr_1,source_text);

    CALL PRXCHANGE(Redact_Phone,-1,source_text);

    CALL PRXCHANGE(Redact_DOB,-1,source_text);

    ```


    ```

    file F:\\Introduction to Regular Expressions with

    SAS\Chapter_4_Example_Source\RedactedPII_Output.txt

    put source_text;

    run;

    ```


    +   - We create four different RegEx IDs with the different PII elements that
    we want to redact from our source file—SAS, PhoneName, DOB, Street, City, and
    Zip.

    - We use the CALL PRXCHANGE routine to output the four different redaction patterns
    in sequence.

    - Using the file statement, we create an output file for writing our redacted
    text changes. Since we overwrote the original text using the CALL PRXCHANGE routine
    (i., changes were inserted back into source_text), we need to output only the
    original variable, source_text, with the PUT statement.


