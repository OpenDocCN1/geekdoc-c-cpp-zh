    # 3.1 Introduction


    This chapter is focused on developing your understanding of built-in SAS functions
    and call routines, and on starting to do some real SAS coding. Here, you will
    learn the mechanics of how to implement the wonderful RegEx metacharacters introduced
    in Chapter 2. Each function or call routine has associated examples to ensure
    that their use is clear. We briefly discuss how each is useful.


    # 3.1.1 Capture Buffer


    Now, before we go any further, we have to address a concept called the capture
    buffer. The capture buffer is a more advanced technique that I have avoided delving
    into thus far, but it must be understood so that you can use some functions (required
    for PRXPAREN and PRXPOSN, optional for PRXCHANGE). As you should recall from Chapter
    2, parentheses create local groupings within a RegEx, but they also do something
    interesting. For every set of parentheses used in a particular RegEx pattern,
    a slot in a memory buffer is created. This slot in memory is then referenceable
    just like'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Introduction to Regular Expressions in SAS


    any variable (a more experienced programmer can think of it like a pointer buffer).
    Each slot is created in sequential order of parentheses pair occurrence and is
    referenced accordingly using the $ sign.


    For example, the RegEx s(The) (cat) (is) (fat)/4 $3 $1/ creates the output "Fat
    the cat". Now, imagining that same ability to identify unknown data elements instead
    of just string to literals. It could become a very powerful capability for standardizing
    or restructuring data to meet specific needs.


    # 3.2 Built-in SAS Functions


    In this section, we cover the SAS functions for performing RegEx operations. SAS
    functions for RegEx have the same usage limitations as built-in functions.(See
    SAS documentation.) Also just like other functions, they can only take arguments
    and return output in assignment statements and expressions.


    Note: Each RegEx function has PRX at the beginning, which represents Perl-Regular-eX.


    # 3.2.1 PRXPARSE


    # Description


    This function takes a RegEx pattern as input and provides a numerical RegEx pattern
    identifier as output. The unique identifier is used by other functions and call
    routines to reference the pattern. This function should look familiar since we
    used it in our example code in Chapter 2.


    # Syntax


    ```

    RegEx_ID = PRXPARSE (RegEx)

    ```


    RegEx: The pattern to be parsed (input argument, required)


    RegEx_ID: Unique numerical RegEx identifier returned by PRXPARSE (output, required)


    Now, it is important to understand at this point that PRXPARSE completes the RegEx
    in order to create the identifier for SAS reference and what makes the RegEx //o
    option so important when using PRXPARSE in code. The //o option forces SAS to
    compile the RegEx once, creating the RegEx identifier the first time. When a particular
    RegEx is reused on every loop through the DATA step every time it is encountered
    in code (i.e., on each iteration of a DATA step). The pattern is not definitely
    going to be used every time through the DATA step (e.g., it''s not defined inside
    an IF statement), then we might not want to waste memory maintaining it. In other
    cases, we might not always to use the //o option—the decision is about tradeoffs.
    When you''re dealing with very few of these patterns or with a small amount of
    data, the tradeoffs don''t really apply. But when we scale up to a system using
    hundreds of patterns, or tens of millions of records, the tradeoffs (speed at
    the expense of memory usage) become very important.'
