    # 3.3.4 CALL PRXNEXT


    # Description


    This routine searches through Source_Text, between the Start and Stop positions,
    for the pattern associated with RegEx_ID. It returns the Position and Length of
    the location.


    # Syntax


    ```

    CALL PRXNEXT(RegEx_ID, Start, Stop, Source_Text, Position, Length)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    Start: Numerical constant, variable, or expression containing the starting character
    position to begin the search (input argument, required)


    Stop: Numerical constant, variable, or expression containing the last character
    position to use in the search. If the value is -1, the stop position becomes the
    last non-blank character position in the search. (input argument, required)


    Source_Text: The text to be operated upon (input argument, required)


    Position: Integer value of the character position for the first character in the
    matched pattern (returned value, required)'
