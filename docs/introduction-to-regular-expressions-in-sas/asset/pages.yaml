    # 2.7.3 Word Boundary


    The metacharacter \b matches a word boundary. The \b RegEx assertion metacharacter
    is zero-width because it actually represents the invisible gap between characters,
    with a \w on one side and \W on the other. Therefore, when you use this metacharacter,
    you won''t generate matches that contain the associated non-word character. Table
    2.42 provides examples.'
