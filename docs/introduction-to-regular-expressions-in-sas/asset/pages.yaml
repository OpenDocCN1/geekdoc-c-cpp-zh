    # 2.6.5 Substitution Operator


    The substitution operator s// is not technically an option, it belongs here if
    only because it truly stands apart from the other items discussed in this section.
    Although the substitution operation is similar in appearance to the other, it
    fundamentally changes the RegEx activity from a matching operation to a match-and-replace
    operation. "s" in front of the surrounding slashes (/) signifies that the pattern
    is being used to replace the text and inserting the accompanying replacement text.
    This is another peek additional functionality that is explored in the next chapter
    with SAS functions. Once a pattern is matched, we can do a variety of things with
    that information. Great analogy for how this works is the find-and-replace functionality
    provided by many word processing applications—except this is much more powerful.
    Also, notice that there is a third slash in the examples below (in the middle
    of the patterns). That additional slash denotes where the matching portion of
    the RegEx ends and the replacement portion begins. And notice something important
    in the example: everything is a string literal. Right, all the characters between
    the second and third slash are treated as characters. Table 2.39 provides some
    examples, but we cover this in detail in the next chapter, where we also discuss
    how to insert more than character strings.


    Table 2.39: Examples using s//


    | Usage | Matches | Replace with |

    | --- | --- | --- |

    | s/Stop/Go/ | "Stop" | "Go" |

    | s/Sing/Read/ | "Sing" | "Read" |

    | s/1?(800))?-s?/1-800-/ | "1 (800) - ..." | "1-800-" |


    Note: This is a more advanced function that your test case is not set to. You''ll
    need to accept as true until we use it with some SAS code in the next chapter.


    # 2.7 Zero-width Metacharacters


    Zero-width characters, often called positional characters, are not matched in
    isolation because they do not have a width. They are used as an additional piece
    of information for making a pattern match.'
