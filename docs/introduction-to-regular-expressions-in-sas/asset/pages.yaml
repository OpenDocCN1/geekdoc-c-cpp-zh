  md: '# 24 Introduction to Regular Expressions SAS


    # Uppercase


    The metacharacter \u matches the next letter in a pattern is uppercase. It functions
    exactly as the lowercase version introduced above (\), but also applies to uppercase.
    Table 2.20 provides examples.


    # Table 2.20: Examples using \u


    | Usage | Matches |

    | \uinc./ | "Inc." ... |

    | \ustreet]ust]./ | "Street" "St." ... |

    | \uave\|uavenue,/ | "Ave." "Avenue," |


    # Lowercase Range


    The metacharacter L...\E matches all the characters between the \L and \E are
    lowercase. Strings typed between \L and \E are forced to match on lowercase only,
    even when they are typed as capital letters. Unlike the \metacharacter, L...\E
    can also contain character classes and repetition modifiers. Table 2.21 provides
    examples.


    # Table 2.21: Examples using \L...\E


    | Usage | Matches |

    | \L[a-z0-9][a-z0-9][a-z0-9]\E/ | "sas" "abc" "123" ... |

    | ALTHE ARE LOWERCASE\E/ | "these are lowercase" |

    |sR[L[a-z][a-z]]E/ | "Read" "Road" "Rode" "Ride" "Real" ... |


    Note: When applying case to non-alphabetic characters, the modifier is ignored.
    It doesn''t affect the match.


    # Uppercase Range


    The metacharacter \U...\E creates a match when all the characters between the
    \U and \E are uppercase. Again, this metacharacter functions the same way as the
    lowercase version discussed above, but applies to uppercase. This metacharacter
    can be useful for identifying acronyms or other text where capital letters are
    important. Table 2.22 provides examples.


    # Table 2.22: Examples using \U...\E


    | Usage | Matches |

    | \U[a-z][a-z][a-z]]E/ | "SAS" "CIA" ... |

    | \U[a-z][a-z][a-z]]E\institute\sInc\W/ | "SAS Institute Inc." ... |

    |sUallcaps\E/ | "ALLCAPS " |'
