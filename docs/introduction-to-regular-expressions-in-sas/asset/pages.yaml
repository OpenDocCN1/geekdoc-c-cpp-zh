    # Special Character


    A special character is one of limited set of ASCII characters that affects the
    structure and behavior of Regex patterns. For example, opening and closing parentheses,
    ( ), and are used to create logical groups of characters or metacharacters in
    Regex patterns. These are discussed thoroughly in Section 2.2.


    # Regex Pattern Processing


    At this juncture, it is also important to clarify how Regex are processed by SAS.
    SAS reads each pattern from left to right in chunks, each element (character or
    metacharacter) of the pattern in succession. If we want to match the string "hello",
    searches for the match of the letter "h" is found. SAS determines whether the
    letter "e" immediately follows, and so on until the entire string is found. Below
    is some pseudo code for this process, for which the logic is true even after we
    begin replacing characters with metacharacters (it would simply more impressive).


    # Pseudo Code for Pattern Matching Process


    ```

    START IF POS = "h" THEN+1 NEXT ELSE POS+1 GOTO START

    IF POS = "e" THEN+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" THEN+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" THEN+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" THEN MATCH=TRUE GOTO END ELSE POS+1 GOTO

    ```


    In this pseudo code, we see the START tag as our initiation of the algorithm,
    and the END tag denotes the termination of the algorithm. Meanwhile, the NEXT
    tag tells us to skip to the next line of pseudo code, and the GOTO tells us to
    jump to a specified line in the pseudo code. The POS tag denotes the character
    position. If we also use IF, THEN, and ELSE tags in the code.


    Again, this demonstrates the search for "hello" in some text source. The algorithm
    initiates by testing the first character position is "h". If it is not, the algorithm
    increments the character position by one—and tests for "h" again. If the first
    position is "h", the character position is increased, and the code continues for
    the letter "e" until the word "hello" is found.


