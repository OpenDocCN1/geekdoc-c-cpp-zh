- img_proc: true
  md: "This routine prints step-by-step output to the log, enabling a low-level understanding\
    \ of any PRX program. However, be prepared–this routine can create voluminous\
    \ output. It is best to use it in a targeted way at first in order to understand\
    \ how a specific function or routine is working (or not working). If we were to\
    \ use this for an entire program, we should be ready to deal very large amounts\
    \ of procedural output, which is an inefficient approach to diagnosing issues.\
    \ It is best to perform gross-level diagnostics using PUT statements and dummy\
    \ variables, narrowing the focus to a specific code segment before using PRXDEBUG.\
    \ In practice, this is the fastest approach to identifying the source of logical\
    \ errors.\n\n# Example 3.12: Debugging the PRXPARSE Function\n\nIn keeping with\
    \ our goal of using CALL PRXDEBUG in a targeted debug code, we are going to apply\
    \ it only to the PRXPARSE function in the code. Notice that we have to turn it\
    \ in and off at different points in the code to identify the segment to we want\
    \ our debug limited. See the results in Output 3.12.\n\n```\ndata null_;ninput\
    \ text $50;\n\nCALL PRXDEBUG(1);\nRegEx_ID=prparse('/((Dog) | (Rat) | (Cat))/o';\n\
    CALL PRXDEBUG(0);\n  if prxmatch(RegEx_ID, text) then do\n    paren=prxPOSN(RegEx_ID),\
    \ paren, position, length;\n    CALL PRXPOSN(RegEx_ID);\n    buffer = substr(text,\
    \ position, length);\n    put ' matched capture buffer ' paren 'with ' buffer;\n\
    \  end;\n  if paren=2 then put 'I love dogs!';\n  else put 'I cannot stand a '\
    \ buffer'!!';\n```\n\n```\ndatalines;\nThe Cat in the Hat\nThe Rat in the Hat\n\
    The Dog on the Roof\nrun;\n```\n\n# Debugging Information Printed to the Log\n\
    \nReviewing the output in Output 3.12, we see that the debugging information for\
    \ just a single PRX function can be quite large, thus reinforcing our earlier\
    \ point about limiting the scope of CALL PRXDEBUG."
