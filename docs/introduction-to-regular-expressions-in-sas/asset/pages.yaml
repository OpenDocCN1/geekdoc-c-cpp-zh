  md: "# Example 3.9: Context-specific Algorithm Development\n\nSometimes it's useful\
    \ to condition code behavior on specific words occurring in text. In this example,\
    \ you'll see how the functionality of CALL PRXPOSN can be used in combination\
    \ with PRXPAREN, PRMATCH, PRXPARSE, and SUBSTR to do just that.\n\nFirst, we create\
    \ the RegEx_ID using PRXPARSE, which is passed to PRMATCH. If a result from PRMATCH\
    \ exists (i.e., a pattern match is found), then we determine if the capture buffers\
    \ in the pattern is matched by PRXPAREN. The output of PRXPAREN is used as input\
    \ to the CALL PRXPOSN routine to create the Position and length. SUBSTR is used\
    \ to extract the specific text. We then print a message, displaying on the buffer.\
    \ See the result in Output 3.9.\n\n```\ndata null_;\ninput text $50;\nRegEx_ID=prxparse('/((Dog)\
    \ | (Rat) | (Cat))/o');\n\nif prmatch(RegEx_ID) then do\n  paren=prparen(RegEx_ID);\n\
    \  CALL PRXPOSN(RegEx_ID, paren, position, length);\n  buffer = substr(text, position,\
    \ length);\n  put 'I matched capture ' paren 'with ' buffer;;\nend;\n\nelif paren=2\
