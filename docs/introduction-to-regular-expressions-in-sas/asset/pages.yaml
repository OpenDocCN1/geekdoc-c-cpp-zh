  md: '# Chapter 4: Applications of Regular Expressions in SAS 81


    # Output 4.5: PII Raw Text


    ![](img/c58184a1652486f0486b8350e0431fbb_94_0.png)


    Now that we have a usable data source to work with, we can create to redact all
    sensitive data elements. The challenge of doing this effectively is that we can''t
    depend on the surrounding text to identify the decisions of code. For this reason,
    it is important that our code takes care to ensure we properly detect the individual
    elements before redacting them.


    Below is the code that performs our redaction of the PII elements SAS, DOB, PhoneNumber,
    Street, City and Zip. Now, many organizations are allowed to publish small amounts
    of information that individuals authorize in advance, such as city or number.
    However, we are focusing on how to verify. In addition to performing the redaction
    steps, we also output the redacted text to a TXT file. This is an effort to perform
    a realistic use of these techniques. For instance, many organizations keep or
    member information in text that are updated by administrative staff. There are
    valid reasons for sharing portions of information that either internally or with
    external elements, but must be met with great care. Thus, it is useful for such
    files to be automatically scrubbed to provide a given final and then with others.


    Note: while the following code is more realistic than we developed in Chapter
    3, it still needs to be improved for robust, real-world applications. The homework
    for this has suggestions, but there is still room for additional refinement.


    ```

    data NULL;

    in=''F:\Introduction to Regular Expressions with

    SAS\Chapter_4_Example_Source\FinalPII_Output.txt'' length=lineelen

    recl=500;

    varlen=linelen=0;

    input_text $varying50, varlen;

    Redact_SSN = PRXPARSE(''/s*-\d(3)\s*-\d(2)\s*-\d(4)/REDACTED/o);

    ```'
