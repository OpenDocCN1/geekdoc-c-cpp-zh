    # 2.3.10 Bell


    The metacharacter `a matches an alarm "bell" character. The alarm character falls
    into a class of non-printing or invisible characters that are part of the ASCII
    set. ASCII was developed long ago when operating systems used non-printing characters
    fairly extensively. Today, however, these characters are relatively uncommon,
    and most often occur only in files meant for computers to read rather than humans—since
    they are not displayed. When encountered, these characters generate an alarm tone,
    or "bell," on a computer''s internal speaker. When they are often associated with
    errors, they can also be used to alert users that the end of a file or process
    has been achieved (e.g., in a system log file). You can use this metacharacter
    when you know to expect such a character in a source file. Table 2.12 provides
    examples.


    **Table 2.12: Examples using \a


    | Usage | Matches |

    |---|---|

    | \a END OF FILE/ | "BEL END OF FILE" |

    | /PROCESS COMPLETED SUCCESSFULLY/\a/ | "PROCESS COMPLETED SUCCESSFULLY BEL" ...
    |

    | \aERROR/ | "BELERROR" ... |


    **Note:** Since the alarm character is a non-printing ASCII character, I am representing
    its location in the matching text with the BEL ASCII character. However, remember
    that such a code does not appear in our text.'
