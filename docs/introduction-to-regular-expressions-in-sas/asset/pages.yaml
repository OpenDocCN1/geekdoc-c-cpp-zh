    # 2.1 Introduction


    This chapter focuses entirely on developing your understanding of regular expressions
    (RegEx) before getting into the details of using them in SAS. We will begin actually
    jumping right into the SAS code behind all of this. However, RegEx patterns are
    a natural inclination to jump into the SAS coding elements useful. Without going
    through RegEx first, the forthcoming SAS functions and calls could be discussed
    only at a very theoretical level, which is the opposite of what I am trying to
    accomplish in this book. Also, trying to learn too many different elements of
    any process at the same time can simply be overwhelming.


    To facilitate the mission of this book—practical application—without being overwhelmed
    by too much information at one time (new functions, calls, and expressions), there
    is a very short bit of test code to use with RegEx examples throughout the chapter.
    I want to stress the point that obtaining a thorough understanding of RegEx syntax
    is critical for harnessing the full power of this incredible capability in SAS.


    Regex consists of letters


    For example, suppose we want to match the string of characters “Street” in an
    address. The pattern would look like /Street/. But we are interested in doing
    more with RegEx than just searching for strings. So, the remainder of this chapter
    explores the various RegEx elements that we can insert into // to develop rich
    capabilities.


    # Metacharacter


    Before going any further, I should clarify some upcoming terminology. Metacharacter
    is a term used quite frequently in this book, so I need to be clear as to what
    it means. A metacharacter is a character or set of characters used by a programming
    language like SAS for something other than its literal meaning. For example, \s
    represents a whitespace character in RegEx'
