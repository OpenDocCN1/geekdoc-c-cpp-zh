  md: '# Chapter 2: Getting Started with Regular Expressions 23


    # 2.5 Modifiers


    There are two significant things that you probably notice missing from the previous
    sections, which are worth further discussion here. First, all of the applicable
    metacharacters thus far have ignored letter case. In other words, w, \S \D, and
    all match a letter regardless of whether it is lowercase or uppercase. However,
    there are situations in which the case of a letter becomes important, but the
    letter itself is not known in advance.


    Second, we can use a single character as many times as we like, which creates
    additional fuzziness for our matches. However, there is a downside to just typing
    out: each occurrence must exist in order to match the pattern. For instance, if
    the source text for the \D examples above contained "19thStreet" with no spaces,
    we''d never find it by using \D three times. And since the primary goal of RegEx
    capability is to have automated text processing, we need a robust way to make
    this kind of matching more flexible.


    Over the next two subsections (2.5.1 and 2.5.2), we will work through ways to
    overcome these limitations by using modifiers. There are two types of modifiers,
    case modifiers and repetition modifiers. Combining them gives us significant robustness
    and flexibility in real-world RegEx implementations, and should be considered
    as fundamental to real-world implementations as the metacharacters that we have
    discussed this far.


    # 2.5.1 Case Modifiers


    When performing matches on text, there is the obvious consideration of letter
    case (upper vs lower). Although I have already introduced a rudimentary way to
    handle this in situations where the letter is known, there must be a methodology
    for accounting for letter case when it is unknown. This section discusses a variety
    of approaches to dealing with case matching. Depending on the situation, some
    approaches are more convenient than others, while not necessarily being right
    or wrong.


    # Lowercase


    The metacharacter \ matches when the next character in a pattern is lowercase.
    This metacharacter applies only to characters (metacharacters,groups,and so on
    do not work). In practice, it is more practical to simply type the lowercase version
    of the desired character value, or provide a list of lowercase letters to match.
    Table 2.19 examples using


    | Usage | Matches |

    | --- | --- |

    | |Street/ | "street" ... |

    | \sIS\IA\sInstitute/ | "sas Institute" ... |

    | /(IS|IF)leet/ | "fleet" ... |'
