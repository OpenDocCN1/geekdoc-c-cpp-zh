  md: '# Chapter 2


    # Matrices


    Matrices occur in many branches of applied mathematics and social sciences, such
    as algebraic and differential equations, mechanics, theory of electrical circuits,
    nuclear physics, aerodynamics, and astronomy. It is, therefore, necessary for
    every young scientist and engineer to learn the elements of matrix algebra.


    A system of $m \times n$ elements from a field $F$ arranged in a rectangular formation
    along $m$ rows and $n$ columns and bounded by the brackets $(\ \ )$ is called
    an $m \times n$ matrix. Usually, a matrix is written by a single capital letter.
    Thus,


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_23_0.png)


    is an $m \times n$ matrix. In short, we often write $A=(a_{ij})$, where it is
    understood that the suffix $i=1,\ldots,m$, and $j=1,\ldots,n$, and $ij$ indicates
    the $i$-th row and the $j$-th column. The numbers $(A)_{ij}=a_{ij}$ are called
    the elements of the matrix $A$. For example, the following matrices $A$ and $B$
    are of order $2\times3$ and $3\times2$,


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_23_1.png)


    A matrix having a single row, i.e., $m=1$, is called a *row matrix* or a *row
    vector*, e.g., $(2\ \ 3\ \ 5\ \ 7)$.


    A matrix having a single column, i.e., $n=1$, is called a *column matrix* or a
    *column vector*, e.g.,


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_23_2.png)


    Thus the columns of the matrix $A$ can be viewed as vertical $m$-tuples (see'
