    **25.5.** Use Theorem 25.4 to show that the following matrices are invertible:

    \(A = \begin{pmatrix} 7 & 2 & 3 \\ 1 & 5 & 2 \\ 3 & 4 & 8 \end{pmatrix}, \quad
    B = \begin{pmatrix} 5 & 4 & 1 \\ 3 & 3 & 0 \\ 0 & 6 & 6 \end{pmatrix}.\)


