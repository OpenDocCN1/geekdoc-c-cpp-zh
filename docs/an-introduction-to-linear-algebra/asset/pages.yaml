  md: '# Chapter 3


    # Determinants


    Many complicated expressions, particularly in electrical and mechanical engineering,
    can be elegantly solved by expressing them in the form of determinants. Further,
    determinants of orders 2 and 3 geometrically represent areas and volumes, respectively.
    Therefore, the working knowledge of determinants is a basic necessity for all
    science and engineering students. In this chapter, we shall briefly sketch the
    important properties of determinants. The applications of determinants to find
    the solutions of linear systems of algebraic equations will be presented in Chapter
    6.


    Associated with a square $n \times n$ matrix $A=(a_{ij})\in M^{n\times n}$ there
    is a scalar in $F$ called the determinant of order $n$ of $A$, and it is denoted
    as $\det(A)$, or $|A|$, or


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_35_0.png)


    The determinants of orders 1 and 2 are defined as


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_35_1.png)


    If in the matrix $A$ we choose any $p$ rows and any $p$ columns, where $p\le n$,
    then the elements at the intersection of these rows and columns form a square
    matrix of order $p$. The determinant of this new matrix is called a minor of $pth$
    order of the matrix $A$. A minor of any diagonal element of $A$ is called a principal
    minor. In particular, an $(n-1)\times(n-1)$ determinant obtained by deleting $i$-th
    row and $j$-th column of the matrix $A$ is the minor of $(n-1)th$ order, which
    we denote as $\tilde a_{ij}$, and call $\alpha_{ij}=(-1)^{i+j}\tilde a_{ij}$ the
    cofactor of $a_{ij}$. In terms of cofactors the determinant of $A$ is defined
    as


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_35_2.png)


    Further,


    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_35_3.png)'
