  md: '(iii) the set \(\{v^1,\cdots,v^r\}\) is an orthonormal basis for \(R(A)\)

    (iv) the set \(\{v^{r+1},\cdots,v^n\}\) is an orthonormal basis for \(R(A)^\perp=\mathcal{N}(A)\).


    **Proof.** (i) It has already been shown in S6. (ii) Since from S7, \(\{u^1,\cdots,u^r|u^{r+1},\cdots,u^m\}\)
    extends \(\{u^1,\cdots,u^r\}\) to an orthonormal basis of \(R^m\), it follows
    that each vector in \(\{u^{r+1},\cdots,u^m\}\) is orthogonal to the Span\(\{u^1,\cdots,u^r\}=C(A)\).
    Thus, \(\{u^{r+1},\cdots,u^m\}\) is an orthogonal set of \(m-r\) vectors in \(C(A)^\perp=\mathcal{N}(A^t)\).
    Now from Corollary 11.4, we have \(n(A^t)=m-r\), which implies that \(\{u^{r+1},\cdots,u^m\}\)
    is an orthonormal basis for \(\mathcal{N}(A^t)\). (iii) and (iv) The set of eigenvectors
    \(\{v^1,\cdots,v^r|v^{r+1},\cdots,v^n\}\) of \(A^tA\) is an orthonormal set. These
    are ordered so that the first \(r\) eigenvectors correspond to the positive eigenvalues
    and the remaining \(n-r\) to the zero eigenvalue. Thus, \(\{v^{r+1},\cdots,v^n\}\)
    is an orthonormal set of \(n-r\) vectors in the null space of \(A^tA\), which
    in view of Problem 11.2 is the same as the null space of \(A\). Now from Theorem
    11.4 we know that \(n(A)\) is \(n-r\), thus the set \(\{v^{r+1},\cdots,v^n\}\)
    must be an orthonormal basis for \(\mathcal{N}(A)\). Next, since each vector of
    the set \(\{v^{r+1},\cdots,v^n\}\) is orthogonal to each vector of the set \(\{v^1,\cdots,v^r\}\),
    it follows that each vector of the set is orthogonal to the Span\(\{v^{r+1},\cdots,v^n\}=\mathcal{N}A)\).
    But this shows that \(\{v^1,\cdots,v^r\}\) is an orthonormal set of \(r\) vectors
    in \(\mathcal{N}(A)^\perp=R(A)\). Finally, since \(R(A)\) has dimension \(r\),
    the set \(\{v^1,\cdots,v^r\}\) must be an orthonormal basis for \(R(A)\). \(\blacksquare\)


    **Remark 19.2.** Following the patricians shown in S7 for the matrices \(U,\Sigma,\)
    and \(V\), we can block multiply \(U\Sigma V^t\) to get the _reduced singular
    value decomposition_ of the matrix \(A\) as


    \(A=U_1D_{rr}V_1^t=(u^1,\cdots,u^r)\left(\begin{array}{ c c c c }

    \sigma_1 & 0 & \cdots & 0 \\

    0 & \sigma_2 & \cdots & 0 \\

    \vdots & \vdots & \ddots & \cdots \\

    0 & 0 & \cdots & \sigma_r

    \end{array}\right)\left(\begin{array}{ c }

    (v^1)^t \\

    \vdots \\

    (v^r)^t

    \end{array}\right).\) (19.2)


    **Remark 19.3.** Multiplying the right side of (19.2), we obtain the reduced singular
    value expansion of the matrix \(A\) as


    \(A=\sigma_1u^1(v^1)^t+\cdots+\sigma_ru^r(v^r)^t.\) (19.3)


    **Example 19.2.** In view of Example 19.1 and Remarks 19.2 and 19.3, we have the
    reduced singular value decomposition


    \(\left(\begin{array}{ c c c c }

    2 & 2 & 1 & 0 \\

    1 & -1 & 0 & 1

    \end{array}\right)=\left(\begin{array}{ c c }

    1 & 0 \\

    0 & 1

    \end{array}\right)\left(\begin{array}{ c c }

    3 & 0 \\

    0 & \sqrt{3}

    \end{array}\right)\left(\begin{array}{ c c c c }

    \frac{2}{3} & \frac{2}{3} & \frac{1}{3} & 0 \\

    \frac{1}{\sqrt{3}} & -\frac{1}{\sqrt{3}} & 0 & \frac{1}{\sqrt{3}}

    \end{array}\right)\)


    and the reduced singular value expansion


    \(\left(\begin{array}{ c c c c }

    2 & 2 & 1 & 0 \\

    1 & -1 & 0 & 1

    \end{array}\right)=3\left(\begin{array}{ c }

    1 \\

    0

    \end{array}\right)\left(\frac{2}{3},\frac{2}{3},\frac{1}{3},0\right)+\sqrt{3}\left(\begin{array}{
    c }

    0 \\

    1

    \end{array}\right)\left(\frac{1}{\sqrt{3}},-\frac{1}{\sqrt{3}},0,\frac{1}{\sqrt{3}}\right).\)'
