  md: '# # Chapter 12


    # # Linear Mappings


    In this chapter we shall extend some earlier results to general linear mappings
    between two vector spaces. These mappings are of general interest and have wide
    applicability, particularly because they preserve the additive structure of linear
    combinations. Further, often it is possible to approximate an arbitrary mapping
    by a linear mapping, which can be managed rather easily.


    Throughout what follows, unless specified, we shall consider the finite dimensional
    vector spaces V and W over the same field F. A mapping \(L: V \rightarrow W\)
    is called a linear mapping (also known as linear transformation, and linear operator)
    if and only if it satisfies the following two conditions:


    +   1. For every pair of vectors \(u, v \in V\), \(L(u+v) = L(u) + L(v)\).

    +   2. For any scalar \(c \in F\), and vector \(u \in V\), \(L(cu) = cL(u)\).


    Thus the mapping L is linear if it preserves the two basic operations of a vector
    space, namely, the vector addition and the scalar multiplication. In particular,
    the second condition implies that \(L(0) = 0\). Clearly, the above two conditions
    can be unified as follows: \(L: V \rightarrow W\) is a linear mapping if and only
    if for any pair of scalars \(\alpha, \beta \in F\) and any pair of vectors \(u,
    v \in V\), \(L(\alpha u + \beta v) = \alpha L(u) + \beta L(v)\). An immediate
    extension of this condition gives \(L(c_1u^1 + \cdots + c_nu^n) = c_1L(u^1) +
    \cdots + c_nL(u^n)\) for all \(c_i \in F\) and \(u^i \in V\). If \(W = V\), then
    L is said to be a linear mapping on V.


    **Example 12.1.** For a given matrix \(A \in M^{m \times n}\) the mapping \(L_A:
    F^n \rightarrow F^m\) defined by \(L_A(u) = Au\) is linear. Indeed, from the properties
    of matrices, for all \(u, v \in F^n\) and \(c, d \in F\), we have


    \(L_A(cu + dv) = A(cu + dv) = cAu + dAv = cL_A(u) + dL_A(v).\)


    In particular, when


    \(A = \begin{pmatrix} \cos \phi & -\sin \phi \\ \sin \phi & \cos \phi \end{pmatrix}\)


    the mapping \(L_A: R^2 \rightarrow R^2\) rotates the xy-plane through an angle
    \(\phi\).


    **Example 12.2.** Consider V as the infinite dimensional space of all real integrable
    functions on an interval J. Then, \(L = \int_J\) is a linear mapping.'
