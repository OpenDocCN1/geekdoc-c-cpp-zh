  md: 'We summarize the above discussion in the following theorem.


    # **Theorem 10.1.** Let $S=\{u^1,\ldots,u^n\}$ and $T=\{v^1,\ldots,v^n\}$ be two
    ordered bases of an $n$-dimensional vector space $(V,F)$. Then there exists a
    unique nonsingular matrix $A$ such that for every vector $u\in V$ relations (10.4)
    hold.


    The matrix $A$ in (10.4) is called the *transition matrix*. A converse of Theorem
    10.1 is the following result.


    # **Theorem 10.2.** Let $S=\{u^1,\ldots,u^n\}$ be an ordered basis of an $n$-dimensional
    vector space $(V,F)$, and let $A\in M^{n\times n}$ be a nonsingular matrix with
    elements in $F$. Then there exists an ordered basis $T=\{v^1,\ldots,v^n\}$ of
    $(V,F)$ such that for every vector $u\in V$ relations (10.4) hold.


    # **Proof.**


    It suffices to show that vectors $v^j$, $j=1,\ldots,n$, defined by the equations
    in (10.1) form a basis of $(V,F)$. For this, let $A^{-1}=B=(b_{ij})$, so that
    in view of (3.1)–(3.3) and (4.1), we have


    ```

    $$\begin{aligned}

    \sum_{j=1}^{n} b_{jk}v^j

    &=\sum_{j=1}^{n}b_{jk}\left(\sum_{i=1}^{n}a_{ij}u^i\right)\\

    &=\sum_{j=1}^{n}\left(\sum_{i=1}^{n}a_{ij}b_{jk}\right)u^i\\

    &=u^k.

    \end{aligned}$$

    ```


    Thus, the subspace spanned by the set $T$ contains $S$, and hence is equal to
    $V$. Therefore, $T$ is a basis of $(V,F)$. From the definition of $T$ and Theorem
    10.1 it is clear that $y_S(u)=Ax_T(u)$ holds. This also implies that $x_T(u)=A^{-1}y_S(u)$.


    The equation (10.1) is the same as


    ```

    $$(v_1^j,\ldots,v_n^j)=a_{1j}(u_1^1,\ldots,u_n^1)+\cdots+a_{nj}(u_1^n,\ldots,u_n^n)
    \tag{10.5}$$

    ```


    and hence the $j$-th column $(a_{1j},\ldots,a_{nj})^t$ of the matrix $A$ in Theorem
    10.1 is the solution of the linear system


    ```

    $$\begin{aligned}

    u_1^1a_{1j}+\cdots+u_1^na_{nj}&=v_1^j\\

    \cdots\\

    u_n^1a_{1j}+\cdots+u_n^na_{nj}&=v_n^j.

    \end{aligned}$$

    ```


    Thus the matrix $A$ is the solution of the matrix linear system


    ```

    $$UA=V, \tag{10.6}$$

    ```


    where $U=(u_i^j)$, $A=(a_{ij})$, and $V=(v_i^j)$.'
