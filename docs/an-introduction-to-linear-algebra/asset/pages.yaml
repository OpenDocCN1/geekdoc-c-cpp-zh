  md: '# # Chapter 4


    # # Invertible Matrices


    In this chapter we shall show that the theory of determinants can be applied

    to find the inverse of a given square matrix. In particular, we shall provide
    analytical representations of inverses of some band matrices that are of immense

    value in chemistry, physics, and solving two-point boundary value problems

    for ordinary differential equations by finite difference methods.


    A square matrix \( A = (a_{ij}) \in M^{n \times n} \) is said to be _invertible_
    or _nonsingular_

    if and only if there exists a matrix \( B \in M^{n \times n} \) such that \( AB
    = BA = I \). Such

    a matrix \( B \) is unique. Indeed, if \( AB = BA = I \) and \( AC = CA = I \),
    then

    \( B = BI = B(AC) = (BA)C = IC = C \). The matrix \( B \) is called the _inverse_
    of

    \( A \) and is denoted by \( A^{-1} \). If \( A \) is nonsingular, then since
    \( AA^{-1} = A^{-1}A = I \)

    it follows that \( (A^{-1})^{-1} = A \). It is clear that if \( B \) is the inverse
    of \( A \), then \( A \)

    is the inverse of \( B \). A square matrix is called _singular_ if it has no inverse.

    We begin with the following result whose proof follows from the discussion in
    our

    next chapter (see Problem 5.1).


    # ### Theorem 4.1.


    If matrices \( A = (a_{ij}) \) and \( B = (b_{ij}) \) are in \( M^{n \times n}
    \) such

    that \( AB = I \) or \( BA = I \), then \( A \) and \( B \) both are invertible,
    and each is the

    inverse of the other.


    Thus to find the inverse of \( A \) it suffices to find the matrix \( B \) such
    that

    \( AB = I \) or \( BA = I \), i.e., we do not have to check both equalities.


    # ### Example 4.1.


    We shall find the inverse


    \( B = \begin{pmatrix} x_1 & x_2 \\ y_1 & y_2 \end{pmatrix} \)


    of the matrix


    \( A = \begin{pmatrix} a & b \\ c & d \end{pmatrix} \).


    For this, we note that \( AB = I \) is the same as the systems


    \( ax_1 + by_1 = 1, \quad ax_2 + by_2 = 0 \)

    \( cx_1 + dy_1 = 0, \quad cx_2 + dy_2 = 1. \)


    If \( |A| = ad - bc \neq 0 \), then these systems can be solved uniquely, to obtain


    \( x_1 = \frac{d}{|A|}, \quad y_1 = -\frac{c}{|A|}, \quad x_2 = -\frac{b}{|A|},
    \quad y_2 = \frac{a}{|A|}. \)'
