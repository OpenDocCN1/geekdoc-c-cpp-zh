  md: "# Chapter 19\n\n# Singular Value Decomposition\n\nIn this chapter, we shall\
    \ develop another type of factorization, which is a generalization of the diagonalization\
    \ procedure discussed in Chapter 18. This factorization is applicable to any real\
    \ $m \\times n$ matrix $A$, and in the literature has been named as the *singular\
    \ value decomposition (SVD)*. Besides solving linear systems, SVD has a wide variety\
    \ of applications in diverse fields such as data compression, noise reduction,\
    \ storage, estimating the rank of a matrix, and transmission of digitized information.\
    \ Before we state the main result of this chapter, let us recall the following\
    \ steps:\n\n+   S1  For an $m \\times n$ matrix $A$, the $m \\times m$ matrix\
    \ $AA^t$ and the $n \\times n$ matrix $A^tA$ are symmetric.\n+   \n+   S2  In\
    \ view of [Problem 17.8], the eigenvalues of $A^tA$ are real and nonnegative.\
    \ We assume that the eigenvalues $\\lambda_1,\\cdots,\\lambda_r$ are nonzero and\
    \ arrange them in decreasing order, i.e., $\\lambda_1 \\geq \\lambda_2 \\geq \\\
    cdots \\geq \\lambda_r > 0$.\n+   \n+   S3  In view of [Theorem 18.2] the matrix\
    \ $A^tA$ has $n$ orthonormal eigenvectors $v^1,\\cdots,v^n$. Let $v^1,\\cdots,v^r$\
    \ be those corresponding to the eigenvalues $\\lambda_1,\\cdots,\\lambda_r$ of\
    \ $A^tA$. Clearly, an immediate extension of [Problem 11.3] implies that $r$ is\
    \ the rank of $A^tA$, which is the same as that of $A$.\n+   \n+   S4  Since $AA^tAv^i=A(\\\
    lambda_i v^i)=\\lambda_iAv^i$, it follows that $v^i$ is an eigenvector of $A^tA$,\
    \ which implies that $Av^i$ is an eigenvector of $AA^t$, with the same eigenvalue\
    \ $\\lambda_i$.\n+   \n+   S5  From [Problem 17.8] it follows that $\\|Av^i\\\
    |_2=\\sigma_i\\|v^i\\|_2$, where $\\sigma_i=\\sqrt{\\lambda_i}$, $i=1,\\cdots,r$.\
    \ These $\\sigma_i$ are called the *singular values* of $A$. Clearly, $\\sigma_1\\\
    geq\\sigma_2\\geq\\cdots\\geq\\sigma_r>0$.\n+   \n+   S6. Define $u^i=Av^i/\\\
    sigma_i$, $i=1,\\cdots,r$. Then, clearly\n\n$$(u^i,u^i)=\\frac{1}{\\lambda_i}(Av^i,Av^i)=\\\
    frac{\\lambda_i}{\\lambda_i}(v^i,v^i)=1,$$\n\ni.e., the vectors $u^i$, $i=1,\\\
    cdots,r$ are also normalized. Further, we have\n\n$$(u^i)^tAv^j=(Av^i/\\sigma_i)^tAv^j=\\\
    frac{1}{\\sigma_i}(v^i)^tA^tAv^j=\\frac{1}{\\sigma_i}(v^i)^t\\lambda_jv^j=\\frac{\\\
    lambda_j}{\\sigma_i}(v^i)^tv^j,$$\n\nwhich implies that for all $1\\leq i,j\\\
    leq r$, $(u^i)^tAv^j=0$ for $i\\neq j$, and $\\sigma_i$ for $i=j$. This means\
    \ that the set $\\{u^1,\\cdots,u^r\\}$ is an orthonormal basis for the column\
    \ space $A$."
