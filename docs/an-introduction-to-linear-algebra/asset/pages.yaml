  md: '# Chapter 10


    # Coordinates and Isomorphisms


    In this chapter we shall extend the known geometric interpretation of the coordinates
    of a vector in $R^3$ to a general vector space. We shall also show how the coordinates
    of a vector space with respect to one basis can be changed to another basis.


    An *ordered basis* of an $n$-dimensional vector space $(V,F)$ is a fixed sequence
    of linearly independent vectors that spans $V$. If $S=\{u^1,\cdots,u^n\}$ is an
    ordered basis, then as we have noted in Chapter 9, every vector $u\in V$ can be
    written uniquely as $u=y_1u^1+\cdots+y_nu^n$. We call $(y_1,\cdots,y_n)^t\in F^n$
    the *coordinates* of $u$ with respect to the basis $S$, and denote it as $y_S(u)$.
    Clearly, $y_S$ is a mapping that assigns to each vector $u\in V$ its unique coordinate
    vector with respect to the ordered basis $S$. Conversely, each $n$-tuple $(y_1,\cdots,y_n)^t\in
    F^n$ corresponds to a unique vector $y_1u^1+\cdots+y_nu^n$ in $V$. Thus the ordered
    basis $S$ induces a correspondence $y_S$ between $V$ and $F^n$, which is one-to-one
    $(u\ne v$ implies $y_S(u)\ne y_S(v)$, equivalently, $y_S(u)\ne y_S(v)$ implies
    $u\ne v)$ and onto (for every $(y_1,\cdots,y_n)^t\in F^n$ there is at least one
    $u\in V$). It is also easy to observe that


    +   1. $y_S(u+v)=y_S(u)+y_S(v)$ for all $u,v\in V$

    +   2. $y_S(\alpha u)=\alpha y_S(u)$ for all scalars $\alpha$ and $u\in V$, and

    +   3. $y_S(u)=0\in F^n$ if and only if $u=0\in V$.


    Hence, the correspondence $y_S$ between $V$ and $F^n$ preserves the vector space
    operations of vector addition and scalar multiplication. This mapping $y_S:V\to
    F^n$ are said to be *isomorphic* or *coordinate isomorphic*. One of the major
    advantages of this concept is that linear dependence and independence, basis,
    span, and dimension of $U\subseteq V$ can be equivalently discussed for the image
    set $y_S(U)$.


    **Example 10.1.** In $R^n$ the coordinates of a column vector relative to the
    ordered basis $\{e^1,\cdots,e^n\}$ are simply the components of the vector. Similarly,
    the coordinates of a polynomial $a_0+a_1x+\cdots+a_{n-1}x^{n-1}$ in $P_n$ relative
    to the ordered basis $\{1,x,\cdots,x^{n-1}\}$ are $(a_0,a_1,\cdots,a_{n-1})^t$.'
