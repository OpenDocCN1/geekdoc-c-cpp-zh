  md: 'Example 1.2), and the rows as horizontal \(n\)-tuples. Hence, if we let


    \(a^j = \left( \begin{array}{ c } \na_{1j} \\ \n\vdots \\ \na_{mj} \\ \n\end{array}
    \right), \quad j = 1, 2, \cdots, n\)


    then the above matrix \(A\) can be written as


    \(A = (a^1, a^2, \cdots, a^n).\)


    A matrix having \(n\) rows and \(n\) columns is called a _square matrix_ of order
    \(n\), e.g.,


    \(A = \left( \begin{array}{ c c c } \n1 & 2 & 3 \\ \n2 & 3 & 4 \\ \n3 & 4 & 5
    \\ \n\end{array} \right)\) (2.1)


    is a square matrix of order 3.


    For a square matrix \(A\) of order \(n\), the elements \(a_{ii}\), \(i = 1, \cdots,
    n\), lying on the _leading_ or _principal diagonal_ are called the _diagonal elements_
    of \(A\), whereas the remaining elements are called the _off-diagonal elements_.
    Thus for the matrix \(A\) in (2.1) the diagonal elements are 1, 3, 5.


    A square matrix all of whose elements except those in the principal diagonal are
    zero, i.e., \(a_{ij} = 0\), \(|i - j| \geq 1\) is called a _diagonal matrix_,
    e.g.,


    \(A = \left( \begin{array}{ c c c } \n7 & 0 & 0 \\ \n0 & 5 & 0 \\ \n0 & 0 & 1
    \\ \n\end{array} \right).\)


    A diagonal matrix of order \(n\) that has unity for all its diagonal elements,
    i.e., \(a_{ii} = 1\), is called a _unit_ or _identity matrix_ of order \(n\) and
    is denoted by \(I_n\) or simply by \(I\). For example, identity matrix of order
    3 is


    \(I_3 = \left( \begin{array}{ c c c } \n1 & 0 & 0 \\ \n0 & 1 & 0 \\ \n0 & 0 &
    1 \\ \n\end{array} \right),\)


    and of \(n\)th order \(I_n = (e^1, e^2, \cdots, e^n)\).


    If all the elements of a matrix are zero, i.e., \(a_{ij} = 0\), it is called a
    _null_ or _zero matrix_ and is denoted by 0, e.g.,


    \(0 = \left( \begin{array}{ c c c } \n0 & 0 & 0 \\ \n0 & 0 & 0 \\ \n0 & 0 & 0
    \\ \n\end{array} \right).\)


    A square matrix \(A = (a_{ij})\) is called _symmetric_ when \(a_{ij} = a_{ji}\).
    If \(a_{ij} = -a_{ji}\), so that all the principal diagonal elements are zero,
    then the matrix is'
