  md: '# Chapter 22


    # Quadratic Forms


    Quadratic forms occur naturally in physics, economics, engineering (control theory),
    and analytic geometry (quadratic curves and surfaces). Particularly, recall that
    the equation (quadratic form) of a central quadratic curve in a plane, after translating
    the origin of the rectangular coordinate system to the centre of the curve, appears
    as


    $q_2(x,y)=(x,y)\begin{pmatrix}a&b\\b&c\end{pmatrix}\binom{x}{y}=ax^2+2bxy+cy^2=d.$


    We also know that by rotating the axes (using a proper transformation) this equation
    (quadratic form) in a new coordinate system can be reduced to a “canonical” (diagonal)
    form:


    $q_2(x'',y'')=(x'',y'')\begin{pmatrix}a''&0\\0&c''\end{pmatrix}\binom{x''}{y''}=a''x''^2+c''y''^2=d.$


    In this chapter we shall study quadratic forms in $n$ variables $x_1,\cdots,x_n$,
    i.e.,


    $q_n(x_1,\cdots,x_n)=\sum_{i=1}^{n}b_i x_i^2+2\sum_{i<j}^{n}c_{ij}x_i x_j,\quad
    b_i,c_{ij}\in R.$ \tag{22.1}


    Clearly, in (22.1) each term is of degree two.


    In matrix form, (22.1) can be written as


    $q_n(x)=q_n(x_1,\cdots,x_n)=x^tAx,$ \tag{22.2}


    where $A=(a_{ij})$ is an $n\times n$ symmetric matrix with $a_{ii}=b_i$, $a_{ij}=a_{ji}=c_{ij}$.
    In (22.2), if we let $x=Py$, a linear transformation of the variables, then it
    follows that


    $q_n(y)=(Py)^tA(Py)=y^t(P^tAP)y,$ \tag{22.3}


    i.e, $P^tAP$ provides the matrix representation of $q_n$ in the new variables.
    Now since $A$ is symmetric, in view of Theorem 18.2, we can always find an orthonormal
    matrix $Q$ and the diagonal matrix $D$ consisting of the eigenvalues of $A$ such
    that $D=Q^{-1}AQ=Q^tAQ$. Thus, with the proper choice of the matrix $P$, (22.3)
    in the new variables can be reduced to a diagonal form,


    $q_n(y)=y^tDy.$ \tag{22.4}'
