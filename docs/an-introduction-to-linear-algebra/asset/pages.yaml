  md: '# # Eigenvalues and Eigenvectors


    Since the cofactor of \((a_{22} - \lambda_2) = 0\) the choice \(u_2^2 = \text{cofactor
    of } (a_{22} - \lambda_2)\) is not correct. However, cofactor of \((a_{11} - \lambda_2)
    = \text{cofactor of } (a_{33} - \lambda_2) = -1 \neq 0\) and we can take \(u_1^2
    = -1\) (\(u_3^2 = -1\)), then \(u_2^2 = \text{cofactor of } a_{12} = 0\), \(u_3^2
    = \text{cofactor of } a_{13} = 1\) (\(u_1^2 = \text{cofactor of } a_{31} = 1\),
    \(u_2^2 = \text{cofactor of } a_{32} = 0\)), i.e., \(u^2 = (-1, 0, 1)^t\) (\((1,
    0, -1)^t\)). Similarly, we can find \(u^3 = (1, 2, 1)^t\).


    For the eigenvalues and eigenvectors of a given \(n \times n\) matrix \(A\) the
    following properties are fundamental:


    P1. There exists at least one eigenvector \(u\) associated with each distinct
    eigenvalue \(\lambda\), and if \(A\) and \(\lambda\) are real, then \(u\) can
    be taken as real: \(\det(A - \lambda I) = 0\) implies that the linear homogeneous
    system \((A - \lambda I)u = 0\) has at least one nontrivial solution. If \(A\)
    and \(\lambda\) are real, and the eigenvector \(u = v + iw\), then \(A(v + iw)
    = \lambda(v + iw)\), i.e., \(Av = \lambda v\) and \(Aw = \lambda w\). Now recall
    that both \(v\) and \(w\) are nonzero.


    P2. If \(u\) is an eigenvector corresponding to the eigenvalue \(\lambda\), then
    so is \(cu\) for all scalars \(c \neq 0\): If \(Au = \lambda u\), then \(A(cu)
    = \lambda(cu)\).


    P3. Let \(U_\lambda\) be the set of all eigenvectors associated with a given eigenvalue
    \(\lambda\). Then, \(V_\lambda = U_\lambda \cup \{0\} \subseteq R^n\) is an _invariant
    subspace_ of \(A\), i.e., \(Au \in V_\lambda\) whenever \(u \in V_\lambda\). Clearly,
    \(0 \in V_\lambda\), and if \(u, v \in V_\lambda\) and \(\alpha, \beta\) are scalars,
    then \(A(\alpha u + \beta v) = \alpha(Au) + \beta(Av) = \lambda(\alpha u) + \beta(\lambda
    v) = \lambda(\alpha u + \beta v)\). The space \(V_\lambda\) is called the _eigenspace_
    of \(A\) belonging to \(\lambda\).


    P4. If \(\lambda_1, \cdots, \lambda_n\) are distinct eigenvalues of \(A\) and
    \(u^1, \cdots, u^n\) are the corresponding eigenvectors, then the set \(S = \{u^1,
    \cdots, u^n\}\) is linearly independent and forms a basis of \(R^n\) (\(C^n\)):
    If \(S\) is linearly dependent, then in view of Theorem 8.1 part 6, there exists
    the first \(u^r\) that is the linear combination of the preceding \(u^1, \cdots,
    u^{r-1}\), i.e., there exist scalars \(c_1, \cdots, c_{r-1}\) such that \(u^r
    = c_1 u^1 + \cdots + c_{r-1} u^{r-1}\). Multiplying this relation by \(\lambda_r\),
    we obtain


    \(\lambda_r u^r = c_1 \lambda_r u^1 + \cdots + c_{r-1} \lambda_r u^{r-1},\)


    whereas multiplying the same relation by \(A\) and using \(Au^i = \lambda_i u^i\),
    we have


    \(\lambda_r u^r = c_1 \lambda_1 u^1 + \cdots + c_{r-1} \lambda_{r-1} u^{r-1}.\)


    Subtracting these equations, we find


    \(0 = c_1(\lambda_r - \lambda_1)u^1 + \cdots + c_{r-1}(\lambda_r - \lambda_{r-1})u^{r-1};\)


    however, since \(u^1, \cdots, u^{r-1}\) are linearly independent and \(\lambda_r
    \neq \lambda_i\), \(i = 1, \cdots, r-1\), it follows that \(c_1 = \cdots = c_{r-1}
    = 0\). But then \(u^r = 0\), which is impossible. The set \(S\) forms a basis
    that follows from Theorem 9.4.


    P5. If \(\lambda_1, \cdots, \lambda_m\) are distinct eigenvalues of \(A\), and
    \(u^i\) is an eigenvector corresponding to the eigenvalue \(\lambda_i\), then
    the set \(S = \{u^1, \cdots, u^m\}\) is linearly independent.


    P6. If \((\lambda, u)\) is an eigenpair of \(A\) and \(A^{-1}\) exists, then \((1/\lambda,
    u)\) is an eigenpair of \(A^{-1}\): If \(Au = \lambda u\), then \(A^{-1}(Au) =
    A^{-1}(\lambda u)\), i.e., \((1/\lambda)u = A^{-1}u\).'
