  md: '# Chapter 20


    # Differential and Difference Systems


    In this chapter we shall show how linear algebra (especially eigenvalues and eigenvectors)
    plays an important role to find the solutions of homogeneous differential and
    difference systems with constant coefficients. Such systems occur in a wide variety
    of real world applications.


    We recall that a linear homogeneous differential system with constant coefficients
    appears as


    $$u'' = Au,$$


    where $A=(a_{ij})$ is an $n\times n$ given matrix with constant elements, and
    $u=u(x)=(u_1(x),\cdots,u_n(x))^t$ is the column vector of unknown functions. A
    solution $\phi(x)$ of (20.1) is a column vector valued function $u=\phi(x)=(\phi_1(x),\cdots,\phi_n(x))^t$
    of differentiable functions that satisfies (20.1), i.e., $\phi''(x)=A\phi(x)$.
    Clearly, $u=0$ is always a solution of (20.1). This solution is known as the trivial
    solution or zero solution. Often, we are interested in finding the solution of
    (20.1) that satisfies the initial condition


    $$u(x_0)=u^0.$$


    Differential system (20.1) together with the initial condition (20.2) is called
    an *initial value problem*, and it always has a unique solution.


    # Example 20.1.


    For the system


    $$u''=Au=\begin{pmatrix}2&1&0\\1&3&1\\0&1&2\end{pmatrix}u$$


    each of the following column vectors is a solution:


    $$\phi^1(x)=\begin{pmatrix}1\\-1\\1\end{pmatrix}e^x,\quad \phi^2(x)=\begin{pmatrix}-1\\0\\1\end{pmatrix}e^{2x},\quad
    \phi^3(x)=\begin{pmatrix}1\\2\\1\end{pmatrix}e^{4x}.$$


    Also, for (20.3) with the initial condition $u(0)=(1,2,3)^t$, the unique solution
    $\phi(x)$ is


    $$\phi(x)=\frac{2}{3}\begin{pmatrix}1\\-1\\1\end{pmatrix}e^x+\begin{pmatrix}-1\\0\\1\end{pmatrix}e^{2x}+\frac{4}{3}\begin{pmatrix}1\\2\\1\end{pmatrix}e^{4x}.$$'
