    Proof. Assume that _r_(_A_)=_n_, then from the singular value decomposition

    it follows that

    \(A^tA=(V_1D_{nn}^tU_1^t)(U_1D_{nn}V_1^t)=V_1D_{nn}(U_1^tU_1)D_{nn}V_1^t=V_1D_{nn}^2V_1^t.\)

    Since _r_(_A_)=_r_(_A<sup>t</sup>A_)=_n_, the matrix _A<sup>t</sup>A_ is invertible,
    and thus we have

    \((A^tA)^{-1}A^t=(V_1D_{nn}^{-2}V_1^t)(V_1D_{nn}^tU_1^t)=V_1D_{nn}^{-2}(V_1^tV_1)D_{nn}U_1^t=V_1D_{nn}^{-1}U_1^t=A^+.\)


    # Example 24.3.


    For the matrix _A_ in (11.2), we have _r_(_A_)=_m_=3, thus

    the Moore-Penrose inverse exists uniquely and simple calculations give

    \(A^+=A^t(AA^t)^{-1}=\left(\begin{array}{ c c c }

    \frac{25}{14} & -\frac{3}{7} & -\frac{4}{7} \\

    -6 & 3 & 1 \\

    \frac{23}{14} & -\frac{5}{7} & -\frac{2}{7} \\

    \frac{11}{7} & -\frac{6}{7} & -\frac{1}{7}

    \end{array}\right),\)


    which is the same as (11.4) with _a_=11_/_7_,b_=-6_/_7_,c_=-1_/_7. For other

