    for each pair of \( m \times n \) matrices \( A = (a_{ij}) \), \( B = (b_{ij})
    \) is defined as


    \( (A,B) = \text{tr}(B^H A) = \sum_{i=1}^m \sum_{j=1}^n \overline{b_{ij}} a_{ij}.
