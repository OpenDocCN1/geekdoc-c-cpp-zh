  md: '# # Chapter 24


    # # Moore–Penrose Inverse


    In Chapter 4 we discussed the inverse of an \(n \times n\) matrix. In this chapter
    we shall introduce the concept of a pseudo/generalized (Moore–Penrose) inverse,
    which is applicable to all \(m \times n\) matrices. As an illustration we shall
    apply Moore–Penrose inverse to least squares solutions of linear equations.


    From Remark 19.2 it follows that each \(n \times n\) invertible matrix \(A\) has
    the reduced singular value decomposition


    \(A = U_1 D_{nn} V_1^t;\) (24.1)


    where \(U_1 = (u^1, \cdots, u^n)\), \(V_1 = (v^1, \cdots, v^n)\) are \(n \times
    n\) orthogonal matrices, and \(D_{nn}\) is the diagonal matrix with elements \(\sigma_1
    \ge \cdots \ge \sigma_n > 0\). Thus, from (24.1), we find


    \(A^{-1} = V_1 D_{nn}^{-1} U_1^t.\) (24.2)


    Since the inverse of a matrix is unique, the right side of (24.2) provides another
    (factorized) representation (see (4.1)) of \(A^{-1}\).


    Following the lead of the representation (24.2), for any \(m \times n\) matrix
    \(A\) with rank \(r\), we define the Moore–Penrose inverse as


    \(A^+ = V_1 D_{rr}^{-1} U_1^t;\) (24.3)


    here, \(V_1, D_{rr}^{-1}, U_1^t\), respectively, are \(n \times r\), \(r \times
    r\), \(r \times m\) matrices.


    **Example 24.1.** For the matrix \(A\) in Example 4.2, (24.2) gives


    \(A^{-1} \simeq \begin{pmatrix} -0.4296 & 0.8082 & 0.4028 \\ -0.4667 & -0.5806
    & 0.6671 \\ 0.7731 & 0.0986 & 0.6266 \end{pmatrix} \begin{pmatrix} 0.1434 & 0.0000
    & 0.0000 \\ 0.0000 & 0.3742 & 0.0000 \\ 0.0000 & 0.0000 & 0.6654 \end{pmatrix}\)


    \(\times \begin{pmatrix} 0.0546 & -0.8732 & -0.4843 \\ 0.8590 & 0.2883 & -0.4231
    \\ 0.5091 & -0.3929 & 0.7658 \end{pmatrix}.\)


