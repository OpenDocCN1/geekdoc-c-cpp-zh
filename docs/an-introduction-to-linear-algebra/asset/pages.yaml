    for the system


    $$u''=Au=\begin{pmatrix}-1&0&4\\0&-1&2\\0&0&1\end{pmatrix}u$$


    three linearly independent solutions are


    $$\phi^1(x)=\begin{pmatrix}1\\0\\0\end{pmatrix}e^{-x},\quad \phi^2(x)=\begin{pmatrix}0\\1\\0\end{pmatrix}e^{-x},\quad
    \phi^3(x)=\begin{pmatrix}2\\1\\1\end{pmatrix}e^x.$$


    **Remark 20.1.** The general solution of (20.1) can be written as


    $$\phi(x)=\sum_{i=1}^{n}c_i e^{\lambda_i x}u^i=(u^1,\cdots,u^n)D(x)(c_1,\cdots,c_n)^t,$$


    where $D(x)$ is the diagonal matrix


    $$D(x)=\begin{pmatrix}e^{\lambda_1x}&0&\cdots&0\\0&e^{\lambda_2x}&\cdots&0\\\vdots&\vdots&\ddots&\vdots\\0&0&\cdots&e^{\lambda_nx}\end{pmatrix}.$$


    Since the matrix $P=(u^1,\cdots,u^n)$ is nonsingular, $P^{-1}$ exists, and thus,
    we can choose the vector $c=(c_1,\cdots,c_n)^t$ as $P^{-1}w$, where $w$ is an
    arbitrary column vector. Hence, when $A$ is diagonalizable, the general solution
    of (20.1) in matrix form appears as


    $$\phi(x)=PD(x)P^{-1}w. \tag{20.7}$$


    Now for an arbitrary $n\times n$ matrix $A$, we introduce the $n\times n$ matrix
    $e^A$ as follows:


    $$e^A=\sum_{k=0}^{\infty}\frac{A^k}{k!}=I+A+\frac{1}{2!}A^2+\frac{1}{3!}A^3+\cdots.
    \tag{20.8}$$


    This exponential series converges for any matrix $A$. Indeed, from the definition
    of convergence in Chapter 17, we have


    $$\left\|\sum_{k=0}^{m+p}\frac{A^k}{k!}-\sum_{k=0}^{m}\frac{A^k}{k!}\right\|=\left\|\sum_{k=m+1}^{m+p}\frac{A^k}{k!}\right\|\leq\sum_{k=m+1}^{m+p}\frac{\|A^k\|}{k!}\leq\sum_{k=m+1}^{m+p}\frac{\|A\|^k}{k!}\leq
    e^{\|A\|}.$$


    Hence, for any $n\times n$ matrix $A$, $e^A$ is a well defined $n\times n$ matrix.


    Let $\lambda$ be an eigenvalue of the diagonalizable matrix $A$ and $u$ be the
    corresponding eigenvector, then from (20.8) and P11 (in Chapter 16), we have


    $$e^Au=\sum_{k=0}^{\infty}\left(\frac{A^k}{k!}\right)u=\sum_{k=0}^{\infty}\left(\frac{\lambda^k}{k!}\right)u=e^{\lambda}u.$$'
