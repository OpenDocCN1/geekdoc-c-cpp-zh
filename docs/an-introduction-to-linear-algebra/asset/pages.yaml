    **14.18.** From (14.7), we have $2n!\int_{-1}^{1}P_m(x)P_n(x)\,dx=\int_{-1}^{1}P_m(x)\frac{d^n}{dx^n}(x^2-1)^n\,dx$.
    Now an integration by parts gives

    $$

    \int_{-1}^{1}P_m(x)\frac{d^n}{dx^n}(x^2-1)^n\,dx=P_m(x)\frac{d^{n-1}}{dx^{n-1}}(x^2-1)^n\bigg|_{-1}^{1}-\int_{-1}^{1}\frac{d}{dx}P_m(x)\frac{d^{n-1}}{dx^{n-1}}(x^2-1)^n\,dx.

    $$

    However, since $\frac{d^{n-1}}{dx^{n-1}}(x^2-1)^n$ contains a factor $(x^2-1)$,
    it follows that

    $$

    2n!\int_{-1}^{1}P_m(x)P_n(x)\,dx=-\int_{-1}^{1}\frac{d}{dx}P_m(x)\frac{d^{n-1}}{dx^{n-1}}(x^2-1)^n\,dx.

    $$

    We can integrate the right side once again, and continue until we have performed
    $n$ such integrations. At this stage, we find

    $$

    2n!\int_{-1}^{1}P_m(x)P_n(x)\,dx=(-1)^n\int_{-1}^{1}\left(\frac{d^n}{dx^n}P_m(x)\right)(x^2-1)^n\,dx.

    $$

    There is no loss of generality if we assume that $m\le n$. If $m<n$, then $d^nP_m(x)/dx^n=0$
    and it follows that $\int_{-1}^{1}P_m(x)P_n(x)\,dx=0$.


