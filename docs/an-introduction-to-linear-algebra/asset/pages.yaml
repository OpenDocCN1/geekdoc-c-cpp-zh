  md: '# Example 3.4. We have


    \(\Delta = \left|\begin{array}{ c c c }

    a-b-c & 2a & 2a \\

    2b & b-c-a & 2b \\

    2c & 2c & c-a-b

    \end{array}\right| = \left|\begin{array}{ c c c }

    a+b+c & a+b+c & a+b+c \\

    2b & b-c-a & 2b \\

    2c & 2c & c-a-b

    \end{array}\right|\)

    \(= (a+b+c) \left|\begin{array}{ c c c }

    1 & 1 & 1 \\

    2b & b-c-a & 2b \\

    2c & 2c & c-a-b

    \end{array}\right|\)

    \(= (a+b+c) \left|\begin{array}{ c c c }

    1 & 0 & 0 \\

    2b & -b-c-a & 0 \\

    2c & 0 & -c-a-b

    \end{array}\right|\)

    \(= (a+b+c) \left|\begin{array}{ c c }

    -b-c-a & 0 \\

    0 & -c-a-b

    \end{array}\right| = (a+b+c)^3.\)


    # Example 3.5. The Vandermonde matrix


    \(V = \left(\begin{array}{ c c c c }

    1 & 1 & \cdots & 1 \\

    x_1 & x_2 & \cdots & x_n \\

    x_1^2 & x_2^2 & \cdots & x_n^2 \\

    \cdots &  &  &  \\

    x_1^{n-1} & x_2^{n-1} & \cdots & x_n^{n-1}

    \end{array}\right)\)


    plays an important role in polynomial interpolation theory. By induction we shall
    show that

    \(|V| = \prod_{1 \leq i < j \leq n} (x_j - x_i).\)


    Indeed, we have

    \(\left|\begin{array}{ c c }

    1 & 1 \\

    x_1 & x_2

    \end{array}\right| = (x_2 - x_1)\)


    and

    \(|V| = \left|\begin{array}{ c c c c }

    1 & 1 & \cdots & 1 \\

    0 & x_2 - x_1 & \cdots & x_n - x_1 \\

    0 & x_2^2 - x_2x_1 & \cdots & x_n^2 - x_nx_1 \\

    \cdots &  &  &  \\

    0 & x_2^{n-1} - x_2^{n-2}x_1 & \cdots & x_n^{n-1} - x_n^{n-2}x_1

    \end{array}\right|\)

    \(= \prod_{j=2}^n (x_j - x_1) \left|\begin{array}{ c c c c }

    1 & 1 & \cdots & 1 \\

    x_2 & x_3 & \cdots & x_n \\

    x_2^2 & x_3^2 & \cdots & x_n^2 \\

    \cdots &  &  &  \\

    x_2^{n-2} & x_3^{n-2} & \cdots & x_n^{n-2}

    \end{array}\right|\)

    \(= \prod_{j=2}^n (x_j - x_1) \prod_{2 \leq i < j \leq n} (x_j - x_i) = \prod_{1
    \leq i < j \leq n} (x_j - x_i).\)'
