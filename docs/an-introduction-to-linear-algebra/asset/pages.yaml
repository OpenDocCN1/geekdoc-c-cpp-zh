    **Example 14.2.** Let \( u = (a_1, \cdots, a_n)^t \), \( v = (b_1, \cdots, b_n)^t
    \in C^n \). The standard inner (dot) product in \( C^n \) is defined as


    \( (u,v) = u^t \overline{v} = a_1 \overline{b_1} + \cdots + a_n \overline{b_n}
    = \sum_{i=1}^n a_i \overline{b_i} = v^H u. \)


    The vector space \( C^n \) with the above inner product is called a _unitary space_.


    Clearly, for \( 1 \times n \) vectors \( u = (a_1, \cdots, a_n) \), \( v = (b_1,
    \cdots, b_n) \) the above definition of inner product is \( (u,v) = u \overline{v}^t
    = uv^H = \sum_{i=1}^n a_i \overline{b_i} \).


