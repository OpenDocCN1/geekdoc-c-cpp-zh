  md: 'P7. The eigenvalues of $A$ and $A^t$ are the same; however, in general the
    eigenvectors are different: It follows from the fact that $\det(A-\lambda I)=\det(A^t-\lambda
    I)$. Now let $A$ be real and have distinct eigenvalues, and assume that the eigenvectors
    correspond to $\lambda_1,\ldots,\lambda_n$, $u^1,\ldots,u^n$, i.e., $Au^i=\lambda_i
    u^i$, $i=1,\ldots,n$. Further, let the eigenvectors of $A^t$ correspond to $\overline{\lambda}_1,\ldots,\overline{\lambda}_n$,
    $v^1,\ldots,v^n$, i.e., $A^t v^j=\overline{\lambda}_jv^j$, $j=1,\ldots,n$. It
    follows that $(v^j)^H Au^i=\lambda_i(v^j)^H u^i$ and $(v^j)^H Au^i=(A^t v^j)^H
    u^i=(\overline{\lambda}_jv^j)^H u^i=\lambda_j(v^j)^H u^i$. Thus, for $i\ne j$,
    $(v^j)^H u^i=(v^j,u^i)=\overline{(u^i,v^j)}=0$. Now since $\{v^i\}$ form a basis
    of $\mathbb{R}^n$ ($\mathbb{C}^n$) we can decompose $u^i$ as


    $$u^i=c_1v^1+\cdots+c_iv^i+\cdots+c_nv^n,$$


    which gives


    $$0<(u^i,u^i)=(u^i)^Hu^i=\sum_{k=1}^{n}c_k(v^i)^Hv^k=\sum_{k=1}^{n}c_k(u^i,v^k)=c_i(u^i,v^i),$$


    and hence $(u^i)^Hv^i\ne0$. We can normalize the vectors so that $(u^i)^Hv^i=1$.
    In conclusion, we have


    $$(v^j)^Hu^i=\begin{cases}0,&j\ne i\\1,&j=i,\end{cases}\tag{16.5}$$


    and because of this property these sets of vectors $\{u^i\}$ and $\{v^i\}$ are
    called *biorthonormal*.


    P8. The eigenvalues of a hermitian matrix are real, whereas those of a skew-hermitian
    matrix are purely imaginary. In particular, the eigenvalues of a real symmetric
    matrix are real, whereas of a real skew-symmetric matrix are purely imaginary:
    When $A=A^H$, $Au=\lambda u$ is the same as $u^HA=\overline{\lambda}u^H$. Thus,
    it follows that $u^HAu=\lambda u^Hu$ and $u^HAu=\overline{\lambda}u^Hu$, and hence
    $(\lambda-\overline{\lambda})u^Hu=0$, but since $u^Hu\ne0$, we have $\lambda-\overline{\lambda}=0$,
    and therefore $\lambda$ is real. Similarly, for a skew-symmetric matrix it follows
    that $\lambda+\overline{\lambda}=0$, and hence $\lambda$ is complex.


    P9. The eigenvectors of a real symmetric matrix that correspond to distinct eigenvalues
    are orthogonal: When $A^t=A$, $Au=\lambda u$ is the same as $A^tu=\lambda u$.
    Thus, if $Av=\mu v$, then since $u^tAv=\lambda u^tv$ it follows that $\mu u^tv=\lambda
    u^tv$, i.e., $(\mu-\lambda)u^tv=0$, and therefore $u^tv=(u,v)=0$.


    P10. Let $P$ be a nonsingular matrix. If $(\lambda,u)$ is an eigenpair of $A$,
    then $(\lambda,P^{-1}u)$ is an eigenpair of $P^{-1}AP$: Clearly, $\det(A-\lambda
    I)=\det(P^{-1}(A-\lambda I)P)=\det(P^{-1}AP-\lambda P^{-1}P)=\det(P^{-1}AP-\lambda
    I)$. Further, since $Au=\lambda u$, we have $P^{-1}Au=\lambda P^{-1}u$, which
    is the same as $(P^{-1}AP)P^{-1}u=\lambda P^{-1}u$.


    P11. If $(\lambda,u)$ is an eigenpair of $A$, then $(\lambda^m,u)$ is an eigenpair
    of $A^m$. It follows from $A^mu=A^{m-1}(Au)=A^{m-1}(\lambda u)=\lambda A^{m-1}u$.
    Thus, if $Q_m(x)$ is a polynomial, then $Q_m(\lambda)$ is an eigenvalue of $Q_m(A)$.
    In particular, the matrix $A$ satisfies its own characteristic equation, i.e.,


    $$p(A)=(-1)^nA^n+a_1A^{n-1}+\cdots+a_{n-1}A+a_n=0.\tag{16.6}$$'
