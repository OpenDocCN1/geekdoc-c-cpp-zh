  md: '# # Inner Products and Orthogonality


    orthogonal if and only if \((u, v) = 0\). For example, if \(u, v \in R^n\), then
    the vector \((u - \text{proj}(u, v))\) is orthogonal to \(v\). Indeed, we have


    \((u - \text{proj}(u, v), v) = (u, v) - \frac{(u, v)}{(v, v)}(v, v) = 0.\)


    A subset \(S\) of \(V\) is said to be *orthogonal* if and only if every pair of
    vectors in \(S\) is orthogonal, i.e., if \(u, v \in S\), \(u \neq v\) then \((u,
    v) = 0\). Clearly, \(0 \in V\) is orthogonal to every \(u \in V\), since \((0,
    u) = (0u, u) = 0(u, u) = 0\). Conversely, if \(v\) is orthogonal to every \(u
    \in V\), then in particular \((v, v) = 0\), and hence \(v = 0\).


    The subset \(\hat{S}\) is called *orthonormal* if \(\hat{S}\) is orthogonal and
    for every \(\hat{u} \in \hat{S}\), \((\hat{u}, \hat{u}) = 1\). If \(S\) is an
    orthogonal set and \(u \in S\), then the set \(\hat{S}\) of vectors \(\hat{u}
    = u/(u, u)^{1/2}\) is orthonormal. Indeed, if \(u, v \in S\), then for \(\hat{u}
    = u/(u, u)^{1/2}\), \(\hat{v} = v/(v, v)^{1/2} \in \hat{S}\), we have


    \((\hat{u}, \hat{v}) = \left(\frac{u}{(u, u)^{1/2}}, \frac{v}{(v, v)^{1/2}}\right)
    = \frac{1}{(u, u)^{1/2}(v, v)^{1/2}}(u, v) = 0\)


    and


    \((\hat{u}, \hat{u}) = \left(\frac{u}{(u, u)^{1/2}}, \frac{u}{(u, u)^{1/2}}\right)
    = \frac{1}{(u, u)^{1/2}(u, u)^{1/2}}(u, u) = 1.\)


    The above process of normalizing the vectors of an orthogonal set is called *orthonormalization*.


    **Example 14.5.** From (14.1) it is clear that in the inner product space \(R^n\)
    two vectors \(u = (a_1, \cdots, a_n)^t\), \(v = (b_1, \cdots, b_n)^t\) are orthogonal
    if and only if \((u, v) = \sum_{i=1}^n a_i b_i = 0\). The subset \(S = \{u, v,
    w\} = \{(1, 2, 0, -1)^t, (5, 2, 4, 9)^t, (-2, 2, -3, 2)^t\}\) of \(R^4\) is orthogonal.
    For this, it suffices to note that \(u^t v = v^t w = w^t u = 0\). This set can
    be orthonormalized, to obtain


    \(\hat{S} = \left\{\frac{u}{(u, u)^{1/2}}, \frac{v}{(v, v)^{1/2}}, \frac{w}{(w,
    w)^{1/2}}\right\} = \left\{\left(\frac{1}{\sqrt{6}}, \frac{2}{\sqrt{6}}, 0, \frac{-1}{\sqrt{6}}\right)^t,\right.\)

    \(\left.\left(\frac{5}{\sqrt{126}}, \frac{2}{\sqrt{126}}, \frac{4}{\sqrt{126}},
    \frac{9}{\sqrt{126}}\right)^t, \left(\frac{-2}{\sqrt{21}}, \frac{2}{\sqrt{21}},
    \frac{-3}{\sqrt{21}}, \frac{2}{\sqrt{21}}\right)^t\right\}.\)


    The set \(\{e^1, \cdots, e^n\}\) is orthonormal.


    Let \(S\) be a subset of an inner product space \(V\). The *orthogonal complement*
    of \(S\), denoted as \(S^\perp\) (read as "S perp") consists of those vectors
    in \(V\) that are orthogonal to every vector \(v \in S\), i.e., \(S^\perp = \{u
    \in V : (u, v) = 0 \text{ for every } v \in S\}\). In particular, for a given
    vector \(v \in V\), we have \(v^\perp = \{u \in V : (u, v) = 0\}\), i.e., \(v^\perp\)
    consists of all those vectors of \(V\) that are orthogonal to \(v\).


    For a given subset \(S\) of an inner product space \(V\) it is clear that \(0
