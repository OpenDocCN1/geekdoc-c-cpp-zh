    # Gauss–Jordan elimination method.


    In the Gauss elimination method, 0’s are obtained not only below the pivots \(a_{ij},i=1,2,\cdots,r\)
    but above them also, so that in the final reduced matrix each pivot element is
    equal to 1 and each pivot is the only nonzero element in its column. Thus the
    matrix (_A_|_b_) is reduced to row canonical form. Now the column can be obtained
    without using the back substitution. However, then, for the case _m_=_n_, the
    total number of multiplications and divisions required is


    \(\frac{n^2}{2}(n+1)=\mathcal{O}\left(\frac{n^3}{2}\right).\) (6.12)


    Hence, the Gauss–Jordan elimination method is more expansive than the Gauss elimination
    method. However, it gives a simpler procedure for computing the inverse of a square
    matrix _A_. We simply write the augmented matrix of _A_ and _I_, i.e., (_A_|_I_),
    and when the Gauss–Jordan procedure is complete, we obtain (_I_|_A_<sup>-1</sup>).


    # Example 6.7.


    In Example 6.6 we follow up to (6.11), and then we have


    \(\sim\left(\begin{array}{ c c c c c c c }

    1 & 0 & -\frac{3}{7} & \frac{2}{7} & \frac{1}{7} & 0 & 0 \\

