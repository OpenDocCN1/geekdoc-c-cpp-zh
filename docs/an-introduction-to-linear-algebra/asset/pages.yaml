  md: '# Preface


    onto another vector, unitary space, orthogonal complement, orthogonal basis,

    and Fourier expansion. This chapter concludes with the well-known Gram–

    Schmidt orthogonalization process. In Chapter 15, we discuss a special type

    of linear mapping, known as linear functional. We also address such notions

    as dual space, dual basis, second dual, natural mapping, adjoint mapping,

    annihilator, and prove the famous Riesz representation theorem.


    Chapter 16 deals with the eigenvalues and eigenvectors of matrices. We

    summarize those properties of the eigenvalues and eigenvectors of matrices

    that facilitate their computation. Here we come across the concepts char-

    acteristic polynomial, algebraic and geometric multiplicities of eigenvalues,

    eigenspace, and companion and circulant matrices. We begin Chapter 17

    with the definition of a norm of a vector and then extend it to a matrix.

    Next, we drive some estimates on the eigenvalues of a given matrix, and prove

    some useful convergence results. Here we also establish well known Cauchy–

    Schwarz, Minkowski, and Bessel inequalities, and discuss the terms spectral

    radius, Rayleigh quotient, and best approximation.


    In Chapter 18, we show that if algebraic and geometric multiplicities of

    an n × n matrix A are the same, then it can be diagonalized, i.e., A = PDP−1;

    here, P is a nonsingular matrix and D is a diagonal matrix. Next, we provide

    necessary and sufficient conditions for A to be orthogonally diagonalizable,

    i.e., A = QDQ<sup>t</sup>, where Q is an orthogonal matrix. Then, we discuss QR
    fac-

    torization of the matrix A. We also furnish complete computational char-

    acterizations of the matrices P, D, Q, and R. In Chapter 19, we develop a

    generalization of the diagonalization procedure discussed in Chapter 18. This

    factorization is applicable to any real m × n matrix A, and in the literature

    has been named singular value decomposition. Here we also discuss reduced

    singular value decomposition.


    In Chapter 20, we show how linear algebra (especially eigenvalues and

    eigenvectors) plays an important role to find the solutions of homogeneous

    differential and difference systems with constant coefficients. Here we also de-

    velop continuous and discrete versions of the famous Putzer’s algorithm. In

    a wide range of applications, we encounter problems in which a given system

    Ax = b does not have a solution. For such a system we seek a vector(s) x̂ so

    that the error in the Euclidean norm, i.e., ∥Ax̂ − b∥<sub>2</sub>, is as small
    as possible

    (minimized). This solution(s) x̂ is called the least squares approximate solu-

    tion. In Chapter 21, we shall show that a least squares approximate solution

    always exists and can be conveniently computed by solving a related system

    of n equations in n unknowns (normal equations). In Chapter 22, we study

    quadratic and diagonal quadratic forms in n variables, and provide criteria for

    them to be positive definite. Here we also discuss maximum and minimum of

    the quadratic forms subject to some constraints (constrained optimization).

    In Chapter 23, first we define positive definite symmetric matrices in terms

    of quadratic forms, and then for a symmetric matrix to be positive definite, we'
