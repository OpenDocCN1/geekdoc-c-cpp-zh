  md: 'then \((W, F)\) is a subspace of \((V, F)\), and \(W\) contains each of the
    vectors \(u^i\), \(i = 1, \cdots, n\).


    # ## Proof.


    Clearly, each \(u^i\) is a linear combination of the form


    \(u^i = \sum_{j=1}^n \delta_{ij} u^j,\)


    where \(\delta_{ij}\) is the Kronecker delta defined by


    \(\delta_{ij} = \left\{\begin{array}{ c c }

    0, & i \neq j \\

    1, & i = j.

    \end{array}\right.\)


    Thus, each \(u^i \in W\). Now, if \(v = \sum_{i=1}^n c_i u^i\), \(w = \sum_{i=1}^n
    d_i u^i\) and \(a \in F\), then we have


    \(av + w = a \sum_{i=1}^n c_i u^i + \sum_{i=1}^n d_i u^i = \sum_{i=1}^n (ac_i
    + d_i)u^i = \sum_{i=1}^n \alpha_i u^i, \quad \alpha_i \in F\)


    which shows that \(av + w \in W\). The result now follows from Theorem 1.2. \(\blacksquare\)


    The subspace \((W, F)\) in Theorem 1.3 is called the subspace _spanned_ or _generated_
    by the vectors \(u^i\), \(i = 1, \cdots, n\), and written as \(\text{Span}\{u^1,
    \cdots, u^n\}\). If \((W, F) = (V, F)\), then the set \(\{u^1, \cdots, u^n\}\)
    is called a _spanning set_ for the vector space \((V, F)\). Clearly, in this case
    each vector \(u \in V\) can be expressed as a linear combination of vectors \(u^i\),
    \(i = 1, \cdots, n\).


    # ## Example 1.10.


    Since


    \(2\left(\begin{array}{ c }

    2 \\

    1 \\

    4

    \end{array}\right) - 3\left(\begin{array}{ c }

    1 \\

    0 \\

    2

    \end{array}\right) + 5\left(\begin{array}{ c }

    3 \\

    2 \\

    1

    \end{array}\right) - \left(\begin{array}{ c }

    4 \\

    2 \\

    0

    \end{array}\right) = \left(\begin{array}{ c }

    12 \\

    10 \\

    7

    \end{array}\right)\)


    it follows that


    \(\left(\begin{array}{ c }

    12 \\

    10 \\

    7

    \end{array}\right) \in \text{Span}\left\{\left(\begin{array}{ c }

    2 \\

    1 \\

    4

    \end{array}\right), \left(\begin{array}{ c }

    1 \\

    0 \\

    2

    \end{array}\right), \left(\begin{array}{ c }

    3 \\

    2 \\

    1

    \end{array}\right), \left(\begin{array}{ c }

    4 \\

    2 \\

    0

    \end{array}\right)\right\}.\)


    However,


    \(\left(\begin{array}{ c }

    1 \\

    2 \\

    3

    \end{array}\right) \notin \text{Span}\left\{\left(\begin{array}{ c }

    1 \\

    0 \\

    0

    \end{array}\right), \left(\begin{array}{ c }

    1 \\

    1 \\

    0

    \end{array}\right)\right\}.\)


