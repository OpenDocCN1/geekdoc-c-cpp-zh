  md: '# Least Squares Approximation


    Clearly, the right side is minimized if _x_ is a solution of the system


    Ax=b<sup>1</sup>. (21.7)


    Since _b_<sup>1</sup> is in _S_, this system is consistent. Any solution of this
    system denoted as \(\hat{x}\) is a least squares solution of (5.2). Further, this
    solution is unique provided the columns of _A_ are lineraly independent.


    Now suppose that \(\hat{x}\) is a solution of the system (21.7). Since _b_<sup>2</sup>
    is orthogonal to the columns of _A_, it follows that _A<sup>t</sup>b_<sup>2</sup>=0.
    Thus, we have


    \(A^tA\hat{x}=A^tb^1=A^t(b-b^2)=A^tb,\)


    i.e., \(\hat{x}\) is a solution of the system (21.2). Conversely, suppose that
    \(\hat{x}\) is a solution of (21.2). Then, we have


    \(A^t(b-A\hat{x})=0.\)


    This means that the vector \((b-A\hat{x})\) is orthogonal to each row of _A<sup>t</sup>_,
    i.e., to each column of _A_. Since _S_=_C_(_A_), we conclude that \((b-A\hat{x})\in
    S^\perp\). Hence, the vector _b_ can be written as


    \(b=A\hat{x}+(b-A\hat{x}),\)


    where \(A\hat{x}\in S\) and \((b-A\hat{x})\in S^\perp\). But again in view of
    Theorem 14.5 and Remark 14.4 such a decomposition is unique, and hence \(A\hat{x}=b^1\).


    # **Corollary 21.1.** Let _A_ be an \(m\times n\) matrix with _r_(_A_)=_n_, and
    suppose _A_=_QR_ is a _QR_ factorization of _A_ (see Theorem 18.3). Then, the
    upper triangular system


    \(Rx=Q^tb\) (21.8)


    gives the least squares approximate solution of the system (5.2).


    # **Proof.** In view of Theorem 18.3, the system (21.2) can be written as _R<sup>t</sup>Q<sup>t</sup>QRx_=_R<sup>t</sup>Q<sup>t</sup>b_.
    However, since _Q<sup>t</sup>Q_=_I_ and _R_ is invertible, this system is the
    same as (21.8).


