  md: '# Chapter 14


    # Inner Products and Orthogonality


    In this chapter we shall extend the familiar concept-inner product of two or three
    dimensional vectors to general vector spaces. Our definition of inner products
    leads to the generalization of the notion of perpendicular vectors, called orthogonal
    vectors. We shall also discuss the well-known Gram–Schmidt orthogonalization process.


    An *inner product* on $(V,\mathbb{C})$ is a function that assigns to each pair
    of vectors $u,v\in V$ a complex number, denoted as $(u,v)$, or simply by $u\cdot
    v$, which satisfies the following axioms:


    +   1. *Positive definite property:* $(u,u)>0$ if $u\ne 0$, and $(u,u)=0$ if and
    only if $u=0$.

    +   2. *Conjugate symmetric property:* $(u,v)=\overline{(v,u)}$.

    +   3. *Linear property:* $(c_1u+c_2v,w)=c_1(u,w)+c_2(v,w)$ for all $u,v,w\in
    V$ and $c_1,c_2\in\mathbb{C}$.


    The vector space $(V,\mathbb{C})$ with an *inner product* is called a *complex
    inner product space*. From 2. we have $(u,u)=\overline{(u,u)}$ and hence $(u,u)$
    must be real, and from 2. and 3. it immediately follows that $(w,c_1u+c_2v)=\overline{c_1}(w,u)+\overline{c_2}(w,v)$.


    The definition of a *real inner product space* $(V,\mathbb{R})$ remains the same
    as above except now for each pair $u,v\in V$, $(u,v)$ is real, and hence in 2.
    complex conjugates are omitted. In $(V,\mathbb{R})$ the angle $0\le\theta\le\pi$
    between the vectors $u,v$ is defined by the relation


    $$\cos\theta=\frac{(u,v)}{(u,u)^{1/2}(v,v)^{1/2}}. \tag{14.1}$$


    Further, the projection of $u$ onto the vector $v$ is denoted and defined by


    $$\operatorname{proj}(u,v)=\operatorname{proj}_v u=\frac{(u,v)}{(v,v)}v. \tag{14.2}$$


    **Example 14.1.** Let $u=(a_1,\ldots,a_n)^t$, $v=(b_1,\ldots,b_n)^t\in\mathbb{R}^n$.
    The inner product in $\mathbb{R}^n$ is defined as


    $$(u,v)=u^tv=a_1b_1+\cdots+a_nb_n=\sum_{i=1}^{n}a_ib_i=v^tu.$$'
