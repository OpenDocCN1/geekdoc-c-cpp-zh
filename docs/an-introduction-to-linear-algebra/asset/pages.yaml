  md: 'determinants. In **Chapter 4**, we provide necessary and sufficient conditions
    for a square matrix to be invertible. We shall show that the theory of determinants
    can be applied to find an analytical representation of the inverse of a square
    matrix. Here we also use elementary theory of difference equations to find inverses
    of some band matrices.


    The main purpose of **Chapters 5 and 6** is to discuss systematically Gauss and
    Gauss–Jordan elimination methods to solve $m$ linear equations in $n$ unknowns.
    These equations are conveniently written as $Ax=b$, where $A$ is an $m\times n$
    matrix, $x$ is an $n\times 1$ unknown vector, and $b$ is an $m\times 1$ vector.
    For this, we introduce the terms consistent, inconsistent, solution space, null
    space, augmented matrix, echelon form of a matrix, pivot, elementary row operations,
    elementary matrix, row equivalent matrix, row canonical form, and rank of a matrix.
    These methods also provide effective algorithms to compute determinants and inverses
    of matrices. We also prove several theoretical results that yield necessary and
    sufficient conditions for a linear system of equations to have a solution. **Chapter
    7** deals with a modified but restricted realization of Gaussian elimination.
    We factorize a given $m\times n$ matrix $A$ to a product of two matrices $L$ and
    $U$, where $L$ is an $m\times m$ lower triangular matrix, and $U$ is an $m\times
    n$ upper triangular matrix. Here we also discuss various variants and applications
    of this factorization.


    In **Chapter 8**, we define the concepts linear dependence and linear independence
    of vectors. These concepts play an essential role in linear algebra and as a whole
    in mathematics. Linear dependence and independence distinguish between two vectors
    being essentially the same or different. In **Chapter 9**, for a given vector
    space, first we introduce the concept of a basis and then describe its dimension
    in terms of the number of vectors in the basis. Here we also introduce the concept
    of direct sum of two subspaces. In **Chapter 10**, we extend the known geometric
    interpretation of the coordinates of a vector in $\mathbb{R}^3$ to a general vector
    space. We show how the coordinates of a vector space with respect to one basis
    can be changed to another basis. Here we also define the terms ordered basis,
    isomorphism, and transition matrix. In **Chapter 11**, we redefine rank of a matrix
    and show how this number is directly related to the dimension of the solution
    space of homogeneous linear systems. Here for a given matrix we also define row
    space, column space, left and right inverses, and provide necessary and sufficient
    conditions for their existence. In **Chapter 12**, we introduce the concept of
    linear mappings between two vector spaces and extend some results of earlier chapters.
    In **Chapter 13**, we establish a connection between linear mappings and matrices.
    We also introduce the concept of similar matrices, which plays an important role
    in later chapters. In **Chapter 14**, we extend the familiar concept inner product
    of two or three dimensional vectors to general vector spaces. Our definition of
    inner products leads to the generalization of the notion of perpendicular vectors,
    called orthogonal vectors. We also discuss the concepts projection of a vector'
