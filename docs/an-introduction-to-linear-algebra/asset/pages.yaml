  md: '1. Interchanging \( R_i \) and \( R_j \).

    2. Replacing \( R_i \) by \( cR_i \), \( c \in F \), \( c \neq 0 \).

    3. Replacing \( R_i \) by \( R_i + cR_j \).


    _Elementary column operations are defined analogously._


    Let \( I \) be the \( m \times m \) identity matrix. A new matrix obtained from
    \( I \) by employing an elementary row operation is called an _elementary matrix_,
    and denoted as \( E \). In what follows we shall denote by \( E_{ij}, E_i(c),
    E_{ij}(c) \) the elementary matrices obtained from \( I \) by employing, respectively,
    the above elementary row operations.


    # **Theorem 5.2.** An elementary row operation on \( A \) is equivalent to \(
    EA \), where \( E \) is the elementary matrix obtained by employing the same elementary
    row operation.


    # **Proof.** We shall prove only for the elementary row operation 3. For this,
    we note that \( E_{ij}(c) = I + c(e^i)^t e^j \), where \( e^i \), \( i = 1, \cdots,
    m \) are the \( m \)-tuple unit vectors. Thus, we have


    \( E_{ij}(c)A = (I + c(e^i)^t e^j)A = A + c(e^i)^t e^j A. \)


    Now it suffices to note that \( e^j A = R_j \), and \( (e^i)^t R_j \) is the \(
    m \times n \) matrix whose \( i \)-th row is \( R_j \), and all other elements
    are zero. \(\blacksquare\)


    # **Theorem 5.3.** Each elementary matrix \( E \) is nonsingular, and


    +   (i) \( E_{ij}^{-1} = E_{ji} = E_{ij} \)

    +   (ii) \( E_i^{-1}(c) = E_i(1/c) \)

    +   (iii) \( E_{ij}^{-1}(c) = E_{ij}(-c) \).


    # **Proof.** (i) It suffices to notice that \( E_{ji}E_{ij} = I \). (ii) Clearly,
    we have \( E_i(c)E_i(1/c) = I \). (iii) As in Theorem 5.2, we find


    \(\begin{aligned} E_{ij}(c)E_{ij}(-c) &= (I + c(e^i)^t e^j)(I - c(e^i)^t e^j)
    \\ &= I + c(e^i)^t e^j - c(e^i)^t e^j - c^2(e^i)^t [e^j(e^i)^t] e^j \\ &= I -
    c^2(e^i)^t [0] e^j = I. \end{aligned} \blacksquare\)


    A matrix \( B \) is said to be _row equivalent_ to a matrix \( A \), and written
    as \( B \sim A \), if \( B \) can be obtained from \( A \) by employing a sequence
    of elementary row operations. It is clear that ~ is an equivalence relation, i.e.,
    1. \( A \sim A \). 2. If \( B \sim A \), then \( A \sim B \). 3. If \( A \sim
    B \) and \( B \sim C \), then \( A \sim C \). If \( B \) is an echelon matrix,
    then \( B \) is called an _echelon form_ of \( A \). _Column equivalent_ matrices
    are defined analogously.


    A combination of Theorems 5.2 and 5.3 gives the following result.'
