  md: '# Chapter 15


    # Linear Functionals


    Let $V$ be a vector space over the field $F$. A linear mapping $\phi: V \to F$
    is called a *linear functional* on $V$. Since a linear functional is a special
    type of linear mapping, all the results presented in Chapters 11 and 12 for general
    mappings hold for linear functionals also. Therefore, in this chapter we shall
    present only those results that have special significance for linear functionals.
    We begin with the following interesting examples.


    **Example 15.1.** Let $V=F^n$. Then, for $u=(u_1,\cdots,u_n)\in V$ the projection
    mapping $\phi_i(u_1,\cdots,u_n)=u_i$ is a linear functional.


    **Example 15.2.** Let $V=C[a,b]$ be the space of all continuous real-valued functions
    on the interval $[a,b]$. Then, for $f\in V$ the integral mapping $\phi(f)=\int_a^b
    f(x)\,dx$ is a linear functional. The mapping $\phi(f)=f(x_0)$, where $x_0\in[a,b]$,
    but fixed, is also a linear functional.


    **Example 15.3.** Let $V=M^{n\times n}$. Then, for $A=(a_{ij})\in V$ the trace
    mapping $\phi(A)=\operatorname{tr}(A)$ is a linear functional.


    **Example 15.4.** In the inner product space $(V,\mathbb C)$, let the vector $u^0$
    be fixed. Then, for $u\in V$ the mapping $(u,u_0)$ is a linear functional; however,
    $(u_0,u)$ is not a linear functional because $(u_0,\alpha u)=\overline{\alpha}(u_0,u)$.


    The vector space $\operatorname{Hom}(V,F)$ is called the *dual space* of $V$,
    and is denoted as $V^*$. In view of Theorem 12.5 it is clear that $\dim V=\dim
    V^*$.


    **Theorem 15.1.** Let $S=\{u^1,\cdots,u^n\}$ be a basis of $V$, and let $\phi_1,\cdots,\phi_n\in
    V^*$ be linear functionals defined by $\phi_j(u^i)=\delta_{ij}$. Then, $S^*=\{\phi_1,\cdots,\phi_n\}$
    is a basis (called *dual basis*) of $V^*$.


    **Proof.** First we shall show that $S^*$ spans $V^*$. For this, let $\phi\in
    V^*$ and suppose that $\phi(u^i)=c_i$, $i=1,\cdots,n$. We set $\psi=c_1\phi_1+\cdots+c_n\phi_n$.
    Then, we have $\psi(u^i)=c_1\phi_1(u^i)+\cdots+c_n\phi_n(u^i)=c_i=\phi(u^i)$,
    $i=1,\cdots,n$. Thus, $\psi$ and $\phi$ have the same values on the basis $S$,
    and hence must be the same on $V$. Therefore, $S^*$ spans $V^*$. To show that
    $S^*$ is linearly independent, let $a_1\phi_1+\cdots+a_n\phi_n=0$. Then, we have
    $0=0(u_i)=a_1\phi_1(u^i)+\cdots+a_n\phi_n(u^i)=a_i$, $i=1,\cdots,n$ as required.


    **Remark 15.1.** Let $0\ne v\in V$, and extend $\{v\}$ to a basis $\{v,v_2,\cdots,v_n\}$
    of'
