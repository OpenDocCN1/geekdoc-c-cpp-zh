    **25.1.** Use Theorem 25.1 to show that the following matrices are reducible:

    \(A = \begin{pmatrix} 2 & 3 & 5 & 2 \\ 0 & 5 & 3 & 0 \\ 0 & 3 & 2 & 0 \\ 0 & 4
    & 1 & 0 \end{pmatrix}, \quad B = \begin{pmatrix} 0 & 1 & 3 & 2 \\ 0 & 5 & 0 &
    7 \\ 2 & 0 & 0 & 1 \\ 0 & 3 & 0 & 2 \end{pmatrix}.\)


    **25.2.** Prove Theorem 25.2.


    **25.3.** Use Theorem 25.2 to determine whether the following matrices are reducible
    or irreducible:

    \(A = \begin{pmatrix} 0 & 2 \\ 3 & 4 \end{pmatrix}, \quad B = \begin{pmatrix}
    3 & 2 \\ 0 & 4 \end{pmatrix}, \quad C = \begin{pmatrix} 4 & 0 & 7 \\ 11 & 8 &
    0 \\ 0 & 5 & 8 \end{pmatrix}.\)


