  md: '**Proof.** From [Theorem 22.1](#) it follows that the transformation $x=Qy$
    reduces (22.2) to the diagonal form (22.7); here, $Q$ consists of vectors that
    are obtained by orthonormalizing the eigenvectors $x^1,\cdots,x^n$. Now since
    $y=Q^tx$ and the matrix $Q$ is orthonormal, we have $\|y\|_2^2=\|Q^tx\|_2^2=(Q^tx,Q^tx)=(Q^tx)^t(Q^tx)=x^tQ
    Q^tx=x^tx=(x,x)=\|x\|_2^2$. Thus, $\|y\|_2=1$ if and only if $\|x\|_2=1$, and
    hence $x^tAx$ and $y^tDy$ assume the same set of values as $x$ and $y$ range over
    the set of all unit vectors. Now since in view of [Lemma 22.1](#) the maximum
    (minimum) value of $q_n(y)$ is attained at $e^n$ ($e^1$), for $q_n(x)$ the maximum
    (minimum) value is attained at $x=Qe^n$ $(Qe^1)=x^n/\|x^n\|_2$ $(x^1/\|x^1\|_2)$.


    # **Example 22.4.**


    From [Example 22.1](#) and [Theorem 22.3](#), it follows that


    $$6\le 11x_1^2+11x_2^2+14x_3^2-2x_1x_2-8x_1x_3-8x_2x_3\le18$$


    provided $x_1^2+x_2^2+x_3^2=1$. The left equality holds for $x=\left(\frac{1}{\sqrt{3}},\frac{1}{\sqrt{3}},\frac{1}{\sqrt{3}}\right)^t$
    and the right inequality holds for $\left(-\frac{1}{\sqrt{6}},-\frac{1}{\sqrt{6}},\frac{2}{\sqrt{6}}\right)^t$.


    # **Example 22.5.**


    From [Example 22.2](#) and [Theorem 22.3](#), it follows that


    $$-2\le\left\{\begin{aligned} &x_1^2+\frac{5}{3}x_2^2-\frac{5}{6}x_3^2-\frac{5}{6}x_4^2+2x_1x_2+2x_1x_3\\
    &\quad+2x_1x_4-\frac{8}{3}x_2x_3-\frac{8}{3}x_2x_4+\frac{7}{3}x_3x_4\end{aligned}\right\}\le3$$


    provided $x_1^2+x_2^2+x_3^2+x_4^2=1$. From [Example 18.5](#) it follows that the
    left equality holds for $x=\left(-\frac{1}{\sqrt{6}},-\frac{1}{\sqrt{6}},\frac{1}{\sqrt{6}},0\right)$,
    $\left(-\frac{1}{\sqrt{12}},\frac{1}{\sqrt{12}},-\frac{3}{\sqrt{12}},\frac{3}{\sqrt{12}}\right)$,
    and $\left(0,0,-\frac{1}{\sqrt{2}},\frac{1}{\sqrt{2}}\right)$. The right-hand
    equality holds at $\left(0,-\frac{2}{\sqrt{6}},\frac{1}{\sqrt{6}},\frac{1}{\sqrt{6}}\right)$.


    # **Remark 22.1.**


    By letting $x_i=a_iz_i$, $1\le i\le n$ we can transform the optimization problem
    $q_n(x)=x^tAx$ subject to $\sum_{i=1}^n x_i^2/a_i^2=1$ into $q_n(z)=(a_1z_1,\cdots,a_nz_n)A(a_1z_1,\cdots,a_nz_n)^t$
    subject to $\|z\|_2=1$, for which [Theorem 22.3](#) is applicable. In particular,
    if $a_i=a$, $1\le i\le n$, then it simply reduces to $q_n(z)=a^2q_n(x)$ subject
    to $\|x\|_2=1$.


    # **Example 22.6.**


    From [Remark 22.1](#) and [Example 22.4](#), it follows that


    $$24\le 11x_1^2+11x_2^2+14x_3^2-2x_1x_2-8x_1x_3-8x_2x_3\le72$$


    provided $x_1^2+x_2^2+x_3^2=4$. The left equality holds for $x=\left(\frac{2}{\sqrt{3}},\frac{2}{\sqrt{3}},\frac{2}{\sqrt{3}}\right)^t$
    and the right inequality holds for $\left(-\frac{2}{\sqrt{6}},-\frac{2}{\sqrt{6}},\frac{4}{\sqrt{6}}\right)^t$.


    Finally, in this chapter we shall prove the following result.'
