    **Example 15.5.** From **Example 6.1**, we know that $S=\{u^1=(2,-1,1),\ u^2=(3,2,-5),\
    u^3=(1,3,-2)\}$ is a basis for $\mathbb{R}^3$. We shall find its dual basis $S^*=\{\phi_1,\phi_2,\phi_3\}$.
    We let $\phi_1(x,y,z)=a_{11}x+a_{12}y+a_{13}z$, $\phi_2(x,y,z)=a_{21}x+a_{22}y+a_{23}z$,
    $\phi_3(x,y,z)=a_{31}x+a_{32}y+a_{33}z$. Since $\phi_j(u^i)=\delta_{ij}$, we need
    to solve the systems


    ```

    $$\begin{aligned}

    2a_{11}-a_{12}+a_{13}&=1 & 2a_{21}-a_{22}+a_{23}&=0\\

    3a_{11}+2a_{12}-5a_{13}&=0 & 3a_{21}+2a_{22}-5a_{23}&=1\\

    a_{11}+3a_{12}-2a_{13}&=0, & a_{21}+3a_{22}-2a_{23}&=0

    \end{aligned}$$

    ```


    and


    ```

    $$\begin{aligned}

    2a_{31}-a_{32}+a_{33}&=0\\

    3a_{31}+2a_{32}-5a_{33}&=0\\

    a_{31}+3a_{32}-2a_{33}&=1.

    \end{aligned}$$

    ```


    Now in view of **Example 6.6**, solutions of these systems can be written as $(a_{11},a_{12},a_{13})=(11/28,1/28,7/28)$,
    $(a_{21},a_{22},a_{23})=(1/28,-5/28,-7/28)$, and $(a_{31},a_{32},a_{33})=(3/28,13/28,7/28)$.
    Thus, it follows that


    ```

    $$\begin{aligned}

    \phi_1(x,y,z)&=\frac{11}{28}x+\frac{1}{28}y+\frac{7}{28}z\\

    \phi_2(x,y,z)&=\frac{1}{28}x-\frac{5}{28}y-\frac{7}{28}z\\

    \phi_3(x,y,z)&=\frac{3}{28}x+\frac{13}{28}y+\frac{7}{28}z.

    \end{aligned}$$

    ```


    **Theorem 15.2.** Let $S=\{u^1,\cdots,u^n\}$ and $T=\{v^1,\cdots,v^n\}$ be bases
    of $V$, and let $S^*=\{\phi_1,\cdots,\phi_n\}$ and $T^*=\{\psi_1,\cdots,\psi_n\}$
    be the corresponding dual bases of $V^*$. Further, let $A=(a_{ij})$ be the transition
    (change-of-basis) matrix from $T$ to $S$, and $B=(b_{ij})$ be the change-of-basis
    matrix from $T^*$ to $S^*$. Then, $A^tB=I$, i.e., $B=(A^{-1})^t$.


    **Proof.** In view of **(10.1)**, we have


    ```

    $$v^i=a_{1i}u^1+a_{2i}u^2+\cdots+a_{ni}u^n$$

    ```


    and


    ```

    $$\psi_j=b_{1j}\phi_1+b_{2j}\phi_2+\cdots+b_{nj}\phi_n.$$

    ```


    Thus, it follows that


    ```

    $$\begin{aligned}

    \delta_{ij}=\psi_j(v^i)&=\sum_{k=1}^{n}b_{kj}\phi_k\left(\sum_{\ell=1}^{n}a_{\ell
    i}u^\ell\right)=\sum_{k=1}^{n}b_{kj}a_{ki}\\

    &=(a_{1i},\cdots,a_{ni})(b_{1j},\cdots,b_{nj})^t.

    \end{aligned}$$

    ```


    This immediately gives $A^tB=I$. ■'
