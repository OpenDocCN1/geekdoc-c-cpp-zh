  md: 'provide necessary and sufficient conditions. Next, for a symmetric matrix we
    revisit $LU$-factorization, and give conditions for a unique factorization $LDL^t$,
    where $L$ is a lower triangular matrix with all diagonal elements 1, and $D$ is
    a diagonal matrix with all positive elements. We also discuss Cholesky’s decomposition
    $L_cL_c^t$ where $L_c = LD^{1/2}$, and for its computation provide Cholesky’s
    algorithm. This is followed by Sylvester’s criterion, which gives easily verifiable
    necessary and sufficient conditions for a symmetric matrix to be positive definite.
    We conclude this chapter with a polar decomposition. In **Chapter 24**, we introduce
    the concept of pseudo/generalized (Moore–Penrose) inverse which is applicable
    to all $m \times n$ matrices. As an illustration we apply Moore–Penrose inverse
    to least squares solutions of linear equations. Finally, in **Chapter 25**, we
    briefly discuss irreducible, nonnegative, diagonally dominant, monotone, and Toeplitz
    matrices. We state 11 theorems which, from the practical point of view, are of
    immense value. These types of matrices arise in several diverse fields, and hence
    have attracted considerable attention in recent years.


    In this book, there are 148 examples that explain each concept and demonstrate
    the importance of every result. Two types of 254 problems are also included, those
    that illustrate the general theory and others designed to fill out text material.
    The problems form an integral part of the book, and every reader is urged to attempt
    most, if not all of them. For the convenience of the reader, we have provided
    answers or hints to all the problems.


    In writing a book of this nature, no originality can be claimed, only a humble
    attempt has been made to present the subject as simply, clearly, and accurately
    as possible. The illustrative examples are usually very simple, keeping in mind
    an average student.


    It is earnestly hoped that **An Introduction to Linear Algebra** will serve an
    inquisitive reader as a starting point in this rich, vast, and ever-expanding
    field of knowledge.


    We would like to express our appreciation to our students and Ms. Aastha Sharma
    at CRC (New Delhi) for her support and cooperation.


    Ravi P. Agarwal

    Cristina Flaut'
