  md: 'Therefore, each linear mapping \( L: V \to W \) can be completely characterized

    by the \( m \times n \) transition matrix \( A = (a_{ij}) \) relative to the bases
    \( S \) and \( T \). Often,

    we shall denote this matrix as \( A_{ST} \).


    # **Example 13.1.** In \( (\mathcal{P}_3, \mathbb{R}) \) and \( (\mathcal{P}_2,
    \mathbb{R}) \) consider the ordered bases \( S = \{1, x, x^2\} \) and \( T = \{1,
    x\} \), respectively. Let \( L: \mathcal{P}_3 \to \mathcal{P}_2 \) be the differential

    mapping, i.e., \( L(a + bx + cx^2) = b + 2cx \). For this mapping, we have


    +   \( L(1) = 0 = 0(1) + 0(x) \)

    +   \( L(x) = 1 = 1(1) + 0(x) \)

    +   \( L(x^2) = 2x = 0(1) + 2(x) \)


    and hence the transition matrix relative to the given bases \( S \) and \( T \)
    is


    +   \( A = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 2 \end{pmatrix} \).


    In particular, for the polynomial \( P_3 = P_3(x) = 4 + 3x + 7x^2 \) we have \(
    x_S(P_3) = (4, 3, 7)^t \), and hence


    +   \( y_T(L(P_3)) = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 2 \end{pmatrix} \begin{pmatrix}
    4 \\ 3 \\ 7 \end{pmatrix} = \begin{pmatrix} 3 \\ 14 \end{pmatrix} \).


    This immediately gives \( L(P_3) = 3 + 14x \).


    # **Example 13.2.** Let \( L: \mathbb{R}^3 \to \mathbb{R}^2 \) be the linear mapping
    defined by

    \( L(x, y, z) = (x + y - z, x - y + z)^t \), and let \( S = \{(1, 1, 1)^t, (1,
