  md: '# # Linear Dependence and Independence


    u<sup>1</sup>(x),⋯,u<sup>n</sup>(x) is different from zero for at least one point
    in an interval J, then these functions are linearly independent in J.


    **Proof.** Let u<sup>1</sup>(x),⋯,u<sup>n</sup>(x) be linearly dependent in J,
    then there exist n constants c<sub>1</sub>,⋯,c<sub>n</sub> not all zero such that
    \(\sum_{i=1}^nc_iu^i(x)=0\) in J. This is the same as saying the homogeneous system
    of equations \(\sum_{i=1}^nu_k^i(x)c_i=0\), \(1\le k\le n\), \(x\in J\), has a
    nontrivial solution. However, from Corollary 5.1 this homogeneous system for each
    \(x\in J\) has a nontrivial solution if and only if W(x)=0. But, \(W(x)\neq 0\)
    for at least one x in J, and, therefore \(u^1(x),\cdots,u^n(x)\) cannot be linearly
    dependent.  \(\blacksquare\)


    In general the converse of this theorem is not true. For instance, for


    \(u^1(x)=\left[\begin{array}{ c }

    x \\

    1

    \end{array}\right],u^2(x)=\left[\begin{array}{ c }

    x^2 \\

    x

    \end{array}\right],\)


    which are linearly independent in any interval J, W(u<sup>1</sup>,u<sup>2</sup>)(x)=0
    in J. This example also shows that \(W(u^1,u^2)(x)\neq 0\) in J is not necessary
    for the linear independence of u<sup>1</sup>(x) and u<sup>2</sup>(x) in J, and
    W(u<sup>1</sup>,u<sup>2</sup>)(x)=0 in J may not imply that u<sup>1</sup>(x) and
    u<sup>2</sup>(x) are linearly dependent in J. Thus, the only conclusion we have
    is \(W(x)\neq 0\) in J implies that \(u^1(x),\cdots,u^n(x)\) are linearly independent
    in J and linear dependence of these functions in J implies that W(x)=0 in J.


    # # Problems


    **8.1.** Find if the given vectors are linearly dependent, and if they are, obtain
    a relation between them:


    (i) \(u^1=(1,3,4,2)^t,u^2=(3,-5,2,2)^t,u^3=(2,-1,3,2)^t\)


