    $p(\lambda)=-\lambda^3+7\lambda^2-14\lambda+8=-(\lambda-1)(\lambda-2)(\lambda-4)=0.$


    Thus, the eigenvalues are $\lambda_1=1$, $\lambda_2=2$, and $\lambda_3=4$. To
    find the corresponding eigenvectors, we need to find nonzero solutions of the
    systems $(A-\lambda_i I)u^i=0$, $i=1,2,3$. For $\lambda_1=1$, we need to solve


    $$(A-\lambda_1I)u^1=\begin{pmatrix}1&1&0\\1&2&1\\0&1&1\end{pmatrix}\begin{pmatrix}u_1^1\\u_2^1\\u_3^1\end{pmatrix}=\begin{pmatrix}u_1^1+u_2^1\\u_1^1+2u_2^1+u_3^1\\u_2^1+u_3^1\end{pmatrix}=\begin{pmatrix}0\\0\\0\end{pmatrix},$$


    which is the same as


    $$u_1^1+u_2^1=0\\u_1^1+u_3^1=0\\u_2^1+u_3^1=0.$$


    In this system the last two equations are the same, and we can take $u_3^1=1$
    so that $u_2^1=-1$, then the first equation gives $u_1^1=1$. Thus, $u^1=(1,-1,1)^t$.
    Similarly, we find $u^2=(1,0,-1)^t$ and $u^3=(1,2,1)^t$.


    In the case when the eigenvalues $\lambda_1,\cdots,\lambda_n$ of $A$ are distinct
    it is easy to find the corresponding eigenvectors $u^1,\cdots,u^n$. For this,
    first we note that for the fixed eigenvalue $\lambda_j$ of $A$ at least one of
    the cofactors of $(a_{ii}-\lambda_j)$ in the matrix $(A-\lambda_jI)$ is nonzero.
    If not, then from (3.6) it follows that $p''(\lambda)=-[\text{cofactor of }(a_{11}-\lambda)]-\cdots-[\text{cofactor
    of }(a_{nn}-\lambda)]$, and hence $p''(\lambda_j)=0$, i.e., $\lambda_j$ was a
    multiple root, which is a contradiction to our assumption that $\lambda_j$ is
    simple. Now let the cofactor of $(a_{kk}-\lambda_j)$ be different from zero, then
    one of the possible nonzero solutions of the system $(A-\lambda_jI)u^j=0$ is $u_i^j=\text{cofactor
    of }a_{ki}\text{ in }(A-\lambda_jI)$, $1\le i\le n$, $i\ne k$, $u_k^j=\text{cofactor
    of }(a_{kk}-\lambda_j)\text{ in }(A-\lambda_jI)$. Since for this choice of $u^j$,
    it follows from (3.2) that every equation, except the $k$th one, of the system
    $(A-\lambda_jI)u^j=0$ is satisfied, and for the $k$th equation from (3.1), we
    have


    $$\sum_{\substack{i=1\\i\ne k}}^n a_{ki}[\text{cofactor of }a_{ki}]+(a_{kk}-\lambda_j)[\text{cofactor
    of }(a_{kk}-\lambda_j)]=\det(A-\lambda_jI),$$


    which is also zero. In conclusion this $u^j$ is the eigenvector corresponding
    to the eigenvalue $\lambda_j$.


    # **Example 16.2.**


    Consider again the matrix $A$ given in (16.4). Since in $(A-\lambda_1I)$ the cofactor
    of $(a_{11}-\lambda_1)=1\ne0$, we can take $u_1^1=1$, and then $u_2^1=\text{cofactor
    of }a_{12}=-1$, $u_3^1=\text{cofactor of }a_{13}=1$, i.e., $u^1=(1,-1,1)^t$. Next,
    for $\lambda_2=2$ we have


    $$(A-\lambda_2I)=\begin{pmatrix}0&1&0\\1&1&1\\0&1&0\end{pmatrix}.$$'
