  md: 'We summarize our above discussion in the following result.


    # Theorem 22.1. If \(A\) is a symmetric matrix, then there exists an orthonormal
    matrix \(Q\) such that the transformation \(y=Q^tx\) changes the quadratic form
    (22.2) into the diagonal quadratic form (22.4).


    # Example 22.1. Consider the quadratic form


    \(q_3(x_1,x_2,x_3)=11x_1^2+11x_2^2+14x_3^2-2x_1x_2-8x_1x_3-8x_2x_3,\) (22.5)


    which in matrix form is the same as \(q_3(x)=x^tAx\), where the symmetric matrix
    \(A\) is as in (18.1). From Example 18.4 it is clear that (22.5) can be reduced
    to a diagonal form,


