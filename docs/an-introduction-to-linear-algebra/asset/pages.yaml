  md: '$(W,F)$ of $(V,F)$ consists of only the zero vector, and the largest subspace
    $(W,F)$ is $(V,F)$ itself.


    # **Example 1.7.** Let $F=R,$


    $$W=\left\{\begin{pmatrix}a_1\\a_2\\0\end{pmatrix}:a_1,a_2\in R\right\}\quad\text{and}\quad
    V=\left\{\begin{pmatrix}a_1\\a_2\\a_3\end{pmatrix}:a_1,a_2,a_3\in R\right\}.$$


    Clearly, $(W,R)$ is a subspace of $(V,R)$. However, if we let


    $$W=\left\{\begin{pmatrix}a_1\\a_2\\a_3\end{pmatrix}:a_1>0,a_2>0,a_3>0\right\},$$


    then $(W,R)$ is not a subspace of $(V,R)$.


    # **Example 1.8.** Let $F$ be a given field. Consider the vector spaces $(\mathcal{P}_4,F)$
    and $(\mathcal{P}_3,F)$. Clearly, $(\mathcal{P}_3,F)$ is a subspace of $(\mathcal{P}_4,F)$.
    However, the set of all polynomials of degree exactly two over the field $F$ is
    not a subspace of $(\mathcal{P}_4,F)$.


    # **Example 1.9.** Consider the vector spaces $(V,F)$ and $(C[X],F)$ considered
    in [Example 1.1](#). Clearly, $(C[X],F)$ is a subspace of $(V,F)$.


    To check if the nonempty subset $W$ of $V$ over the field $F$ is a subspace requires
    the verification of all the axioms B1–B10. However, the following result simplifies
    this verification considerably.


    # **Theorem 1.2.** If $(V,F)$ is a vector space and $W$ is a nonempty subset of
    $V$, then $(W,F)$ is a subspace of $(V,F)$ if and only if for each pair of vectors
    $u,v\in W$ and each scalar $a\in F$ the vector $au+v\in W$.


    # **Proof.** If $(W,F)$ is a subspace of $(V,F)$, and $u,v\in W$, $a\in F$, then
    obviously $au+v\in W$. Conversely, since $W\ne\varnothing$, there is a vector
    $u\in W$, and hence $(-1)u+u=0\in W$. Further, for any vector $u\in W$ and any
    scalar $a\in F$, the vector $au=au+0\in W$. This in particular implies that $(-1)u=-u\in
    W$. Finally, we notice that if $u,v\in W$, then $1u+v\in W$. The other axioms
    can be shown similarly. Thus $(W,F)$ is a subspace of $(V,F)$. ■


    Thus $(W,F)$ is a subspace of $(V,F)$ if and only if for each pair of vectors
    $u,v\in W$, $u+v\in W$ and for each scalar $a\in F$, $au\in W$.


    Let $u^1,\cdots,u^n$ be vectors in a given vector space $(V,F)$, and $c_1,\cdots,c_n\in
    F$ be scalars. The vector $u=c_1u^1+\cdots+c_nu^n$ is known as *linear combination*
    of $u^i$, $i=1,\cdots,n$. By mathematical induction it follows that $u\in(V,F)$.


    # **Theorem 1.3.** Let $u^i\in(V,F)$, $i=1,\cdots,n(\geq 1)$, and


    $$W=\{c_1u^1+\cdots+c_nu^n:c_i\in F,\ i=1,\cdots,n\}$$'
