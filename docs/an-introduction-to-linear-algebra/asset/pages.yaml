  md: '# # Chapter 16


    # # Eigenvalues and Eigenvectors


    Eigenvalues and eigenvectors of a matrix are of great importance in the qualitative
    as well as quantitative study of many physical problems. For example, stability
    of an aircraft is determined by the location of the eigenvalues of a certain matrix
    in the complex plane. Basic solutions of ordinary differential and difference
    equations with constant coefficients are expressed in terms of eigenvalues and
    eigenvectors of the coefficient matrices. In this chapter we shall mainly summarize
    properties of the eigenvalues and eigenvectors of matrices, which are of immense
    value.


    The number \(\lambda\), real or complex, is called an _eigenvalue_ (_characteristic
    root_, _latent root_, _proper value_) of an \(n \times n\) matrix _A_ if there
    exists a nonzero real or complex vector _u_ such that \(Au = \lambda u\), i.e.,
    _Au_ is parallel to _u_. The vector _u_ is called an _eigenvector_, corresponding
    to the eigenvalue \(\lambda\). From Corollary 5.1, \(\lambda\) is an eigenvalue
    of _A_ if and only if it is a solution of the _characteristic equation_


    \(p(\lambda) = \det(A - \lambda I) = 0,\) (16.1)


    which in the expanded form, known as _characteristic polynomial_ of _A_, can be
    written as


    \(p(\lambda) = (-1)^n \lambda^n + a_1 \lambda^{n-1} + \cdots + a_{n-1} \lambda
    + a_n = 0.\) (16.2)


    Thus from the _fundamental theorem of algebra_ it follows that _A_ has exactly
    _n_ eigenvalues counting with their multiplicities, i.e., (16.2) can be rewritten
    as


    \(p(\lambda) = (-1)^n (\lambda - \lambda_1)^{r_1} (\lambda - \lambda_2)^{r_2}
    \cdots (\lambda - \lambda_m)^{r_m} = 0,\) (16.3)


    where \(\lambda_i \neq \lambda_j\), \(r_i \geq 1\), \(r_1 + \cdots + r_m = n\).
    The positive number _r<sub>i</sub>_ is called the _algebraic multiplicity_ of
    the eigenvalue \(\lambda_i\).


    Knowing the distinct eigenvalues \(\lambda_i\), \(i = 1, \cdots, m\) (\(\leq n\))
    from (16.3), the corresponding eigenvectors can be obtained by computing nontrivial
    solutions of the homogenous systems \((A - \lambda_i I)u^i = 0\), \(i = 1, \cdots,
    m\).


    # **Example 16.1.** The characteristic polynomial for the matrix


    \(A = \begin{pmatrix} 2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 2 \end{pmatrix}\) (16.4)'
