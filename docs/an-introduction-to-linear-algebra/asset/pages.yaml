    contains at least two vectors and spans \(V\), or (ii) a subset \(W\) that contains
    only one vector, \(u^i \neq 0\), say, which spans \(V\). Clearly, in view of Theorem
    8.1(2), the set \(W=\{u^i\}\) is linearly independent. \(\blacksquare\)


