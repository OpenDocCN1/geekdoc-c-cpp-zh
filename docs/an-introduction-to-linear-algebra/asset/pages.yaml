    Let \( A = (a_{ij}) \in R^{n \times n} \), then it follows that


    \( (Au,v) = (Au)^t v = u^t A^t v = u^t (A^t v) = (u, A^t v), \)


    and hence, we have the relation


    \( (Au,v) = (u, A^t v). \) (14.3)


    If \( A \) is an orthogonal matrix, then from (14.3) it immediately follows that
    \( (Au,Av) = (u,v) \).


    Clearly, for \( 1 \times n \) vectors \( u = (a_1, \cdots, a_n) \), \( v = (b_1,
    \cdots, b_n) \) the above definition of inner product is \( (u,v) = uv^t = \sum_{i=1}^n
