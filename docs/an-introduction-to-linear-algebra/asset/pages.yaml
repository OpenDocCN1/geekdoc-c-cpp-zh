  md: '# Corollary 11.1.  $r(A)=r(A^t)=r(A^H)$.


    # Theorem 11.2.  Let $A\in\mathbb{C}^{m\times n}$ and $B\in\mathbb{C}^{n\times
    p}$. Then, $r(AB)\le \min\{r(A),r(B)\}$.


    # Proof.


    Let $A=(a_{ij})$, $B=(b_{ij})$ and $AB=C=(c_{ij})$. Since $c_{ij}=\sum_{k=1}^{n}a_{ik}b_{kj}$,
    $i=1,\cdots,m$, $j=1,\cdots,p$, it follows that


    $\begin{pmatrix}c_{1j}\\\vdots\\c_{mj}\end{pmatrix}=\begin{pmatrix}a_{11}\\\vdots\\a_{m1}\end{pmatrix}b_{1j}+\cdots+\begin{pmatrix}a_{1n}\\\vdots\\c_{mn}\end{pmatrix}b_{nj},\quad
    j=1,\cdots,p$


    and hence the columns of $AB$ are dependent on the columns of $A$; and similarly,
    the rows of $AB$ are dependent on the rows of $B$. Thus, we have $C(AB)\subseteq
    C(A)$ and $R(AB)\subseteq R(B)$, and this immediately implies that $r(AB)\le r(A)$
    and $r(AB)\le r(B)$. Combining these, we obtain $r(AB)\le\min\{r(A),r(B)\}$.


    # Corollary 11.2.


    +   1. If one matrix in the product $AB$ is nonsingular, then the rank of $AB$
    is equal to the rank of the other matrix.

    +   2. If $P$ and $Q$ are nonsingular matrices, then $r(PAQ)=r(A)$.


    # Proof.


    +   1. Let the matrix $A$ be nonsingular. From Theorem 11.2 it follows that $r(AB)\le
    r(B)$, and since $B=A^{-1}(AB)$, $r(B)\le r(AB)$. Thus, $r(AB)=r(B)$.

    +   2. Since $P$ and $Q$ are nonsingular, $r(PAQ)=r(AQ)=r(A)$.


    # Theorem 11.3.  Let $A,B\in\mathbb{C}^{m\times n}$. Then, $r(A+B)\le r(A)+r(B)$.


    # Proof.


    Let $A=(a_{ij})$, $B=(b_{ij})$, and let $\{u^1,\cdots,u^p\}$ and $\{v^1,\cdots,v^q\}$
    be the bases of $C(A)$ and $C(B)$, respectively. Then, it follows that


    $\begin{pmatrix}a_{1j}+b_{1j}\\\vdots\\a_{mj}+b_{mj}\end{pmatrix}=\begin{pmatrix}a_{1j}\\\vdots\\a_{mj}\end{pmatrix}+\begin{pmatrix}b_{1j}\\\vdots\\b_{mj}\end{pmatrix}=\sum_{i=1}^{p}\alpha_{ij}u^i+\sum_{i=1}^{q}\beta_{ij}v^i,\quad
    j=1,\cdots,n.$


    Thus, the $j$-th column of $A+B$ can be expressed as a linear combination of the
    $p+q$ vectors $u^1,\cdots,u^p,v^1,\cdots,v^q$. Hence, the column space of $A+B$
    is generated by the linear combination of these vectors. Therefore, it follows
    that


    $\dim C(A+B)=\dim\left\{\sum_{i=1}^{p}s_i u^i+\sum_{i=1}^{q}t_i v^i\right\}$'
