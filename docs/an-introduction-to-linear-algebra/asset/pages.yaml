    is orthonormal on \(0 < x < \pi\). This set generates the Fourier cosine series.


    **14.17.** Show that the set


    \(\left\{\frac{1}{\sqrt{2\pi}}, \frac{1}{\sqrt{\pi}} \cos nx, \frac{1}{\sqrt{\pi}}
    \sin nx, \ n = 1, 2, \cdots \right\}\)


    is orthonormal on \(-\pi < x < \pi\). This set generates the Fourier trigonometric
    series.


    **14.18.** _Legendre polynomials_, denoted as \(P_n(x)\), \(n = 0, 1, 2, \cdots\)
    can be defined by _Rodrigues’ formula_


    \(P_n(x) = \frac{1}{2^n n!} \frac{d^n}{dx^n}(x^2 - 1)^n, \quad n = 0, 1, 2, \cdots\)  (14.7)


    In fact, from (14.7) we easily obtain


    \(P_0(x) = 1, \quad P_1(x) = x, \quad P_2(x) = \frac{1}{2}(3x^2 - 1), \quad P_3(x)
    = \frac{1}{2}(5x^3 - 3x),\)


    \(P_4(x) = \frac{1}{8}(35x^4 - 30x^2 + 3), \quad P_5(x) = \frac{1}{8}(63x^5 -
    70x^3 + 15x), \cdots\)


    Show that the set \(\{P_0(x), P_1(x), P_2(x), \cdots \}\) is orthogonal in the
    interval \([-1, 1]\).


    **14.19.** Consider the space _V_ of all real infinite sequences \(u = (a_1, a_2,
    \cdots)\) satisfying \(\sum_{i=1}^\infty a_i^2 < \infty\). Addition and scalar
    multiplication for all \(u = (a_1, a_2, \cdots), v = (b_1, b_2, \cdots) \in V\),
    \(c \in R\) is defined as \((u + v) = (a_1 + b_1, a_2 + b_2, \cdots)\), \(cu =
    (ca_1, ca_2, \cdots)\). Show that


    (i) _V_ is a vector space


    (ii) the inner product \((u, v) = a_1b_1 + a_2b_2 + \cdots\) is well defined,
    i.e., \(\sum_{i=1}^\infty a_ib_i\) converges absolutely.


    This inner product space is called \(\ell_2\)-_space_ and is an example of a _Hilbert
    space_.'
