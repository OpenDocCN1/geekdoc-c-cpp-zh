  md: '# # Chapter 18


    # # Diagonalization


    An \(n \times n\) matrix \(A\) is said to be _diagonalizable_ if there exists
    a nonsingular matrix \(P\) and a diagonal matrix \(D\) such that \(A = PDP^{-1}\),
    which is the same as \(D = P^{-1}AP\). An immediate advantage of diagonalization
    is that we can find powers of \(A\) immediately. In fact, note that


    ```

    \(A^2 = (PDP^{-1})(PDP^{-1}) = PD(P^{-1}P)DP^{-1} = PD^2P^{-1},\)

    ```


    and for any positive integer \(m\), it follows that


    ```

    \(A^m = PD^mP^{-1}.\)

    ```


    From Chapter 2, we also recall that if the diagonal elements of \(D\) are \((\lambda_1,
    \cdots, \lambda_n)\), then \(D^m\) is also diagonal, with diagonal elements \((\lambda_1^m,
    \cdots, \lambda_n^m)\).


    Our main result of this chapter is the following theorem.


    **Theorem 18.1.** An \(n \times n\) matrix \(A\) is diagonalizable if and only
    if \(A\) has \(n\) linearly independent eigenvectors, i.e., algebraic multiplicity
    of each eigenvalue is the same as the geometric multiplicity. Further, if \(D
    = P^{-1}AP\), where \(D\) is a diagonal matrix, then the diagonal elements of
    \(D\) are the eigenvalues of \(A\) and the column vectors of \(P\) are the corresponding
    eigenvectors.


    **Proof.** Let \(\lambda_1, \cdots, \lambda_n\) be the eigenvalues (not necessarily
    distinct) of \(A\) and let \(u^1, \cdots, u^n\) be the corresponding linearly
    independent eigenvectors. We define an \(n \times n\) matrix \(P\) whose \(i\)-th
    column is the vector \(u^i\). Clearly, in view of Problem 8.3 the matrix \(P\)
    is invertible. Now, since


    ```

    \(Au^i = \lambda_i u^i,\)

    ```


    it follows that


    ```

    \(AP = A(u^1, \cdots, u^n) = (Au^1, \cdots, Au^n) = (\lambda_1 u^1, \cdots, \lambda_n
    u^n) = PD,\)

    ```


    where \(D\) is the diagonal matrix with diagonal elements \(\lambda_1, \cdots,
    \lambda_n\). Thus, \(AP = PD\), and hence \(D = P^{-1}AP\).


    Conversely, suppose that \(A\) is diagonalizable, i.e., there exist a diagonal
    matrix \(D\) and an invertible matrix \(P\) such that \(D = P^{-1}AP\). Again
    assume that the diagonal elements of \(D\) are \((\lambda_1, \cdots, \lambda_n)\)
    and the column vectors of \(P\)'
