    \( A = \begin{pmatrix} 1 & 1 \\ 1 & 1 \end{pmatrix}, \quad B = \begin{pmatrix}
    1 & -1 \\ -1 & 1 \end{pmatrix}, \)


    we have \( AB = 0 \). Thus \( AB = 0 \) does not imply that \( A \) or \( B \)
