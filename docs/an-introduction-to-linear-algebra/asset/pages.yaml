    and hence it has an infinite number of solutions $x_1=-(1/3)x_3$, $x_2=1-(1/3)x_3$,
    where $x_3$ is arbitrary.


    The Gauss elimination method can be used to compute the determinant of a given
    $n\times n$ matrix $A$. If all $a_{i1}=0$, $i=1,\cdots,n$ then $\det(A)=0$; otherwise,
    if necessary we interchange rows of $A$ so that $|a_{11}|=\max\{|a_{11}|,|a_{21}|,\cdots,|a_{n1}|\}$.
    Now following Step 3 with $j_1=1$, we get


    $$|A|=\theta_1a_{11}\left|\begin{array}{cccc}1&\alpha_{12}&\cdots&\alpha_{1n}\\0&\alpha_{22}&\cdots&\alpha_{2n}\\\vdots&\vdots&&\vdots\\0&\alpha_{n2}&\cdots&\alpha_{nn}\end{array}\right|=\theta_1a_{11}\left|\begin{array}{ccc}\alpha_{22}&\cdots&\alpha_{2n}\\\vdots&&\vdots\\\alpha_{n2}&\cdots&\alpha_{nn}\end{array}\right|,$$


    where $\theta_1$ is −1 or 1 accordingly as the number of rows interchanged is
    odd or even, $\alpha_{1j}=a_{1j}/a_{11}$, $2\le j\le n$, $\alpha_{ij}=a_{ij}-\alpha_{1j}a_{i1}$,
    $2\le i,j\le n$. Thus, we could reduce the order of the determinant from $n$ to
    $n−1$. We can continue this process $n−1$ times.


    # **Remark 6.2.** The total number of multiplications and divisions necessary
    for evaluating the determinant $|A|$ by Gauss elimination technique is


    $$\frac{(n-1)}{3}(n^2+n+3)=O\left(\frac{n^3}{3}\right). \tag{6.8}$$


    Hence, if we compute all $(n+1)$ required determinants in Cramer’s rule by the
    Gauss elimination method, we will need


    $$\frac{(n-1)}{3}(n^2+n+3)(n+1)=O\left(\frac{n^4}{3}\right) \tag{6.9}$$


    as the number of multiplications and divisions.'
