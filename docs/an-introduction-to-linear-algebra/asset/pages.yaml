    0 & 0 & 1 & \frac{1}{4} & -\frac{1}{4} & \frac{1}{4} & 0

    \end{array}\right)\sim\left(\begin{array}{ c c c c c c c }

    1 & 0 & 0 & \frac{11}{28} & \frac{1}{28} & \frac{3}{28} \\

    0 & 1 & 0 & \frac{1}{28} & -\frac{5}{28} & \frac{13}{28} \\

    0 & 0 & 1 & \frac{1}{4} & -\frac{1}{4} & \frac{1}{4}

    \end{array}\right).\)'
