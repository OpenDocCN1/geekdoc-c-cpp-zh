  md: '# Chapter 8


    # Linear Dependence and

    Independence


    The concept of linear dependence and independence plays an essential role in linear
    algebra and as a whole in mathematics. These concepts distinguish between two
    vectors being essentially the same or different. Further, these terms are prerequisites
    to the geometrical notion of dimension for vector spaces.


    Let $(V,F)$ be a vector space, and $S=\{u^1,\cdots,u^n\}\subset V$ be a finite
    nonempty set. The set of vectors $S$ is said to be *linearly dependent* if and
    only if there exist $n$ scalars $c_1,\cdots,c_n\in F$, not all zero, such that


    $$c_1u^1+\cdots+c_nu^n=0. \tag{8.1}$$


    The set $S$ is said to be *linearly independent* if the only solution of (8.1)
    is the trivial solution $c_1=\cdots=c_n=0$. Notice that (8.1) always holds for
    $c_1=\cdots=c_n=0$, and hence, to prove the linear independence of $S$ it is necessary
    to show that $c_1=\cdots=c_n=0$ is the only set of scalars in $F$ for which (8.1)
    holds. It is clear that if $S$ is linearly dependent, then there are infinitely
    many choices of scalars $c_i$, not all zero, such that (8.1) holds. However, to
    prove the linear dependence of $S$ it suffices to find one set of scalars $c_i$,
    not all zero, for which (8.1) holds.


    The vectors $u^1,\cdots,u^n$ are said to be linearly dependent or independent
    accordingly as the set $S=\{u^1,\cdots,u^n\}$ is linearly dependent or independent.
    An *infinite set* of vectors is said to be *linearly dependent* if and only if
    it has a finite subset that is linearly dependent. Thus, an infinite set is *linearly
    independent* if and only if its every finite subset is linearly independent.


    **Example 8.1.** The set of vectors $S=\{e^1,\cdots,e^n\}$ is a linearly independent
    set in $R^n$. Indeed, $c_1e^1+\cdots+c_ne^n=0$ immediately implies that $c_1=\cdots=c_n=0$.
    If an $m\times n$ matrix $A$ is in echelon form, then the set of nonzero rows
    of $A$ (considered as vectors in $R^n$) is linearly independent.


    **Example 8.2.** The vectors $(11,19,21)^t$, $(3,6,7)^t$, $(4,5,8)^t\in R^3$ are
    linearly independent. Indeed, $c_1(11,19,21)^t+c_2(3,6,7)^t+c_3(4,5,8)^t=0$ leads'
