    For the multiplication of matrices, the following properties hold:


    +   1. \( A(BC) = (AB)C \), associative law


    +   2. \( A(B \pm C) = AB \pm AC \) and \( (A \pm B)C = AC \pm BC \), distributive
    law


    +   3. \( AI = A \) and \( IA = A \)


    +   4. \( k(AB) = (kA)B = A(kB), \ k \in F \)


    +   5. \( A0 = 0 \) and \( 0B = 0 \).


    If \( A \) is an \( n \times n \) matrix, then the product \( AA \) is denoted
