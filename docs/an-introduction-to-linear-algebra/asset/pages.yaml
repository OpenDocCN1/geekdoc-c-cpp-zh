    +   \( L(u^3) = (1, 1)^t = \frac{1}{3}(1, 2)^t + \frac{1}{3}(2, 1)^t \)


    and hence the transition matrix relative to the given bases \( S \) and \( T \)
    is


    +   \( A = \begin{pmatrix} \frac{1}{3} & -\frac{2}{3} & \frac{1}{3} \\ \frac{1}{3}
    & \frac{4}{3} & \frac{1}{3} \end{pmatrix} \).


    Now since


    +   \( u = (a, b, c)^t = c(1, 1, 1)^t + (b - c)(1, 1, 0)^t + (a - b)(1, 0, 0)^t
