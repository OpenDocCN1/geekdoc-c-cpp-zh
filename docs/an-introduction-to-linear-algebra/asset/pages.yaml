    # Theorem 17.6 (Banach’s lemma). For a given square matrix \(A\),

    if \(\|A\| < 1\), then


    \(\frac{1}{1 + \|A\|} \leq (I \pm A)^{-1} \leq \frac{1}{1 - \|A\|}.\) \(\text{(17.12)}\)


