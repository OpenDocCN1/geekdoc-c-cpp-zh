  md: 'But, this from Theorem 12.1 implies that \( G = L \). Hence, \( L \) is a linear
    combination of \( L^{i,j} \), and this means that \( \{L^{i,j}\} \) generates
    \( \text{Hom}(V, W) \). Finally, we need to show that \( \{L^{i,j}\} \) is linearly
    independent. For this, let \( b_{ij} \) be scalars such that


    \[ \sum_{i=1}^m \sum_{j=1}^n b_{ij} L^{i,j} = 0. \]


    Then, for \( u^k \), \( k = 1, \cdots, n \) we have


    \[ 0 = 0(u^k) = \sum_{i=1}^m \sum_{j=1}^n b_{ij} L^{i,j}(u^k) = \sum_{i=1}^m b_{ik}
    w^i. \]


    But since \( w^i \) are linearly independent, we find \( b_{ik} = 0 \), \( i =
    1, \cdots, m \), \( k = 1, \cdots, n \). \(\blacksquare\)


    Now suppose that \( V, W \), and \( U \) are vector spaces over the same field
    \( F \). Let \( L: V \to W \) and \( G: W \to U \) be linear mappings. We define
    the composition mapping \( G \circ L: V \to U \) by \( (G \circ L)(u) = G(L(u))
    \). Since for any scalars \( c_1, c_2 \in F \) and any vectors \( u, v \in V \),


    \[

    \begin{aligned}

    (G \circ L)(c_1 u + c_2 v) &= G(L(c_1 u + c_2 v)) = G(c_1 L(u) + c_2 L(v)) \\

    &= c_1 G(L(u)) + c_2 G(L(v)) \\

    &= c_1 (G \circ L)(u) + c_2 (G \circ L)(v),

    \end{aligned}

    \]


    the composition mapping \( G \circ L \) is linear.


