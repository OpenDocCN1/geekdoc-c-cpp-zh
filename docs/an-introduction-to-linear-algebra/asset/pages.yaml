    such that


    $v^j=\displaystyle\sum_{i=1}^{n}a_{ij}u^i,\quad j=1,\cdots,n.$  (10.1)


    Let $(x_1,\cdots,x_n)^t$ be the coordinates of a given vector $u\in V$ with respect
    to the ordered basis $T$. Then, we have


    $u=\displaystyle\sum_{j=1}^{n}x_jv^j,$


    and hence from (10.1) it follows that


    $\begin{aligned}u&=\sum_{j=1}^{n}x_j\left(\sum_{i=1}^{n}a_{ij}u^i\right)\\&=\sum_{j=1}^{n}\sum_{i=1}^{n}(a_{ij}x_j)u^i\\&=\sum_{i=1}^{n}\left(\sum_{j=1}^{n}a_{ij}x_j\right)u^i.\end{aligned}$


    Now since the coordinates $(y_1,\cdots,y_n)^t$ of $u$ with respect to the ordered
    basis $S$ are uniquely determined, we find


    $y_i=\displaystyle\sum_{j=1}^{n}a_{ij}x_j,\quad i=1,\cdots,n,$  (10.2)


    which is exactly the same as (5.1) ((5.2) in matrix notation) with $m=n$. Since
    $S$ and $T$ are linearly independent sets, $y=(y_1,\cdots,y_n)^t=0$ if and only
    if $x=(x_1,\cdots,x_n)^t=0$. Thus from Corollary 5.1 it follows that the matrix
    $A$ in (10.2) is invertible, and


    $x=A^{-1}y.$  (10.3)


