  md: "# Chapter 1\n\n# Linear Vector Spaces\n\nA vector space (or linear space) consists\
    \ of four things {F, V, +, s.m.}, where F is a field of scalars, V is the set\
    \ of vectors, and + and s.m. are binary operations on the set V called vector\
    \ addition and scalar multiplication, respectively. In this chapter we shall define\
    \ each term axiomatically and provide several examples.\n\n**Fields.** A *field*\
    \ is a set of scalars, denoted by F, in which two binary operations, addition\
    \ (+) and multiplication (·), are defined so that the following axioms hold:\n\
    \n+   A1. *Closure property of addition:* If a, b ∈ F, then a + b ∈ F.\n+   \n\
    +   A2. *Commutative property of addition:* If a, b ∈ F, then a + b = b + a.\n\
    +   \n+   A3. *Associative property of addition:* If a, b, c ∈ F, then (a + b)\
    \ + c = a + (b + c).\n+   \n+   A4. *Additive identity:* There exists a zero element,\
    \ denoted by 0, in F such that for all a ∈ F, a + 0 = 0 + a = a.\n+   \n+   A5.\
    \ *Additive inverse:* For each a ∈ F, there is a unique element (−a) ∈ F such\
    \ that a + (−a) = (−a) + a = 0.\n+   \n+   A6. *Closure property of multiplication:*\
    \ If a, b ∈ F, then a · b ∈ F.\n+   \n+   A7. *Commutative property of multiplication:*\
    \ If a, b ∈ F, then a · b = b · a.\n+   \n+   A8. *Associative property of multiplication:*\
    \ If a, b, c ∈ F, then (a · b) · c = a · (b · c).\n+   \n+   A9. *Multiplicative\
    \ identity:* There exists a unit element, denoted by 1, in F such that for all\
    \ a ∈ F, a · 1 = 1 · a = a.\n+   \n+   A10. *Multiplicative inverse:* For each\
    \ a ∈ F, a ≠ 0, there is a unique element a⁻¹ ∈ F such that a · a⁻¹ = a⁻¹a = 1.\n\
    +   \n+   A11. *Left distributivity:* If a, b, c ∈ F, then a · (b + c) = a · b\
    \ + a · c.\n+   \n+   A12. *Right distributivity:* If a, b, c ∈ F, then (a + b)\
    \ · c = a · c + b · c.\n\n**Example 1.1.** The set of rational numbers Q, the\
    \ set of real numbers R, and the set of complex numbers C, with the usual definitions\
    \ of addition and multiplication, are fields. The set of natural numbers N = {1,\
    \ 2, ···}, and the set of all integers Z = {···, −2, −1, 0, 1, 2, ···} are not\
    \ fields.\n\nLet F and F₁ be fields and F₁ ⊆ F, then F₁ is called a *subfield*\
    \ of F. Thus, Q is a subfield of R, and R is a subfield of C."
