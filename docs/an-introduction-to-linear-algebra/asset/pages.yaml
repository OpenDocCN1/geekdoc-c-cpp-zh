  md: '# Example 17.1.


    For the vectors \(u = (a_1, \cdots, a_n), v = (b_1, \cdots, n_n) \in C^n\),

    inequality (17.1) reduces to


    \((a_1\overline{b_1} + \cdots + a_n\overline{b_n}) \leq (|a_1|^2 + \cdots + |a_n|^2)^{1/2}(|b_1|^2
    + \cdots + |b_n|^2)^{1/2}. \quad (17.3)\)


    # Example 17.2.


    For the functions \(f,g \in C[a,b]\), inequality (17.1) reduces

    to


    \(\int_a^b f(x)\overline{g(x)}dx \leq \left(\int_a^b |f(x)|^2 dx\right)^{1/2}
    \left(\int_a^b |g(x)|^2\right)^{1/2}. \quad (17.4)\)


    The set \(C^{n \times n}\) can be considered as equivalent to the vector space
    \(C^{n^2}\),

    with a special multiplicative operation added into the vector space. Thus, a

    matrix norm should satisfy the usual three requirements of a vector norm and,

    in addition, we require:


    +   4. \(\|AB\| \leq \|A\|\|B\|\) for all \(n \times n\) matrices \(A, B\) (and
    hence, in particular, for

    +   every positive integer \(p\), \(\|A^p\| \leq \|A\|^p\)),


    +   5. compatibility with the vector norm, i.e., if \(\|\cdot\|_*\) is the norm
    in \(C^n\), then

    +   \(\|Au\|_* \leq \|A\|\|u\|_*\) for all \(u \in C^n\) and any \(n \times n\)
    matrix \(A\).


    Once a norm \(\|\cdot\|_*\) is fixed, in \(C^n\) then an associated matrix norm
    is usually

    defined by


    \(\|A\| = \sup_{u \neq 0} \frac{\|Au\|_*}{\|u\|_*} = \sup_{\|u\|_*=1} \|Av\|_*.
    \quad (17.5)\)


    From (17.5) condition 5 is immediately satisfied. To show 4 we use 5 twice,

    to obtain


    \(\|ABu\|_* = \|A(Bu)\|_* \leq \|A\|\|Bu\|_* \leq \|A\|\|B\|\|u\|_*\)


    and hence for all \(u \neq 0\), we have


    \(\frac{\|ABu\|_*}{\|u\|_*} \leq \|A\|\|B\|,\)


    or


    \(\|AB\| = \sup_{u \neq 0} \frac{\|ABu\|_*}{\|u\|_*} \leq \|A\|\|B\|.\)


    The norm of the matrix \(A\) induced by the vector norm \(\|u\|_*\) will be denoted
    by

    \(\|A\|_*\). For the three norms \(\|u\|_1\), \(\|u\|_2\), and \(\|u\|_\infty\),
    the corresponding matrix

    norms are


    \(\|A\|_1 = \max_{1 \leq j \leq n} \sum_{i=1}^n |a_{ij}|, \quad \|A\|_2 = \sqrt{\rho(A^tA)},
    \quad \text{and} \quad \|A\|_\infty = \max_{1 \leq i \leq n} \sum_{j=1}^n |a_{ij}|,\)


    where for a given \(n \times n\) matrix \(A\) with eigenvalues \(\lambda_1, \cdots,
    \lambda_n\) not necessarily

    distinct, \(\rho(A)\) is called the *spectral radius* of \(A\) and is defined
    as


    \(\rho(A) = \max\{|\lambda_i|, \ 1 \leq i \leq n\}.\)'
