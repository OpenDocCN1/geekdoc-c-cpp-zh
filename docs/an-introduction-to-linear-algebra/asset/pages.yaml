  md: '# Chapter 9


    # Bases and Dimension


    In this chapter, for a given vector space, first we shall define a basis and then
    describe its dimension in terms of the number of vectors in the basis. Here we
    will also introduce the concept of direct sum of two subspaces.


    The set of vectors \(S = \{u^1, \cdots, u^n\}\) in a vector space \((V, F)\) is
    said to form or constitute a *basis* of \(V\) over \(F\) if and only if \(S\)
    is linearly independent, and generates the space \(V\). Thus, every vector \(v
    \in V\) can be written as a linear combination of the vectors \(u^1, \cdots, u^n\),
    i.e.,


    \(v = c_1 u^1 + \cdots + c_n u^n.\)


    This representation is unique. Indeed, if \(v = d_1 u^1 + \cdots + d_n u^n\) is
    also a representation, then \(0 = v - v = (c_1 - d_1)u^1 + \cdots + (c_n - d_n)u^n\)
    immediately implies that \(c_1 - d_1 = 0, \cdots, c_n - d_n = 0\).


    **Example 9.1.** The set of vectors \(S = \{e^1, \cdots, e^n\}\) is a basis of
    \(R^n\). Indeed, the set \(S\) is linearly independent (see Example 8.1), and
    an arbitrary vector \(u = (u_1, \cdots, u_n) \in R^n\) can be written as \(u =
    \sum_{i=1}^n u_i e^i\). The set \(\{e^1, e^1 + e^2, \cdots, e^1 + \cdots + e^n\}\)
    is also a basis of \(R^n\).


    **Theorem 9.1.** Let \((V, F)\) be a vector space, and let \(S = \{u^1, \cdots,
    u^n\}\) be a basis of \(V\). Let \(v^1, \cdots, v^m\) be vectors in \(V\) and
    assume that \(m > n\). Then, \(v^1, \cdots, v^m\) are linearly dependent.


    **Proof.** Since \(S\) is a basis, there exist scalars \(a_{ij}\), \(i = 1, \cdots,
    m\), \(j = 1, \cdots, n\) in \(F\) such that


    \(v^1 = a_{11}u^1 + \cdots + a_{1n}u^n\)


    \(\cdots\)


    \(v^m = a_{m1}u^1 + \cdots + a_{mn}u^n.\)


    Let \(x_1, \cdots, x_m\) be scalars, then


    \(x_1 v^1 + \cdots + x_m v^m\)


    \(= (x_1 a_{11} + \cdots + x_m a_{m1})u^1 + \cdots + (x_1 a_{1n} + \cdots + x_m
    a_{mn})u^n.\)


    Now since \(m > n\), in view of Corollary 5.2, the homogeneous system


    \(x_1 a_{11} + \cdots + x_m a_{m1} = 0\)


    \(\cdots\)


    \(x_1 a_{1n} + \cdots + x_m a_{mn} = 0\)'
