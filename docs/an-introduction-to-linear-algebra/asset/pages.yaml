  md: 'Thus, the inverse $B$ of the matrix $A$ exists if and only if $|A| \ne 0$,
    and it appears as


    $$B=\begin{pmatrix}d/|A|&-b/|A|\\-c/|A|&a/|A|\end{pmatrix}=\frac{1}{|A|}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}.$$


    From [Example 4.1](#) it is clear that for a given matrix the inverse may not
    exist, and hence there are singular as well as nonsingular matrices.


    **Theorem 4.2.** If $A=(a_{ij})$ and $B=(b_{ij})$ are nonsingular matrices in
    $M^{n\times n}$, then $AB$ is also nonsingular, and $(AB)^{-1}=B^{-1}A^{-1}$.
    Conversely, if $AB$ is nonsingular, then $A$ and $B$ are nonsingular.


    **Proof.** Since $A^{-1}$ and $B^{-1}$ exist,


    $$(AB)(B^{-1}A^{-1})=A(BB^{-1})A^{-1}=A(I)A^{-1}=AA^{-1}=I.$$


    Thus [Theorem 4.1](#) implies that $AB$ is nonsingular, and $(AB)^{-1}=B^{-1}A^{-1}$.
    Conversely, in view of [Theorem 4.1](#) it suffices to note that


    $$I=(AB)(AB)^{-1}=A\bigl(B(AB)^{-1}\bigr)$$


    and


    $$I=(AB)^{-1}(AB)=\bigl((AB)^{-1}A\bigr)B.\quad\blacksquare$$


    **Corollary 4.1.** If $A$ is an invertible matrix in $M^{n\times n}$, then


    $$\det(A^{-1})=(\det(A))^{-1}.$$


    **Proof.** Since $AA^{-1}=I$, $\det(AA^{-1})=\det(A)\det(A^{-1})=1$.


    **Corollary 4.2.** If $A,B,C\in M^{n\times n}$ and $A$ is an invertible matrix,
    then $AB=AC$ implies $B=C$.


    **Corollary 4.3.** If $A_i\in M^{n\times n}$, $i=1,2,\cdots,m$ are nonsingular
    matrices, then $A_1A_2\cdots A_m$ is nonsingular, and


    $$(A_1A_2\cdots A_m)^{-1}=A_m^{-1}A_{m-1}^{-1}\cdots A_1^{-1}.$$


    **Theorem 4.3.** If $A$ is a nonsingular real (complex) matrix, then $A^t$ $(A^H)$
    are nonsingular, and $(A^t)^{-1}=(A^{-1})^t$ $((A^H)^{-1}=(A^{-1})^H)$.


    **Proof.** Since $AA^{-1}=I$, we have $(A^{-1})^tA^t=I$, and similarly from $A^{-1}A=I$
    it follows that $(A^t)(A^{-1})^t=I$. These relations imply that $(A^{-1})^t=(A^t)^{-1}$.\quad\blacksquare


    **Theorem 4.4.** The matrix $A\in M^{n\times n}$ is nonsingular if and only if
    $\det(A)\ne 0$.


    The *adjoint* of a given matrix $A\in M^{n\times n}$, written as adj $A$, is the
    transpose of the matrix of cofactors of $A$, i.e., $\operatorname{adj}A=(\alpha_{ij})^t=(\alpha_{ji})$.'
