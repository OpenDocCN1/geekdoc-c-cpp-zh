  md: "called *negative definite* if $q_n(x)<0$, $x\\in R^n/\\{0\\}$ and *negative\
    \ semidefinite* if $q_n(x)\\leq 0$, $x\\in R^n$. The quadratic form $q_n(x)$ is\
    \ called *indefinite* if it is both positive and negative for $x\\in R^n$.\n\n\
    # **Theorem 22.2.**\n\nIf $A$ is a symmetric matrix, then the quadratic form $q_n(x)=x^tAx$\
    \ is positive definite if $A$ has only positive eigenvalues, negative definite\
    \ if $A$ has only negative eigenvalues, and indefinite if $A$ has both positive\
    \ and negative eigenvalues.\n\n# **Proof.**\n\nIf $\\lambda_1,\\cdots,\\lambda_n$\
    \ are the eigenvalues of $A$, then from (22.4) it follows that\n\n$$q_n(y)=\\\
    lambda_1y_1^2+\\cdots+\\lambda_ny_n^2,$$\n\nwhere $y=Q^{-1}x=Q^tx$. Thus, if all\
    \ eigenvalues of $A$ are positive, then from the fact that $y=0$ implies $x=0$\
    \ (one-to-one correspondence between $y$ and $x$), we find $q_n(x)>0$ for all\
    \ $x\\in R^n/\\{0\\}$, i.e., $q_n(x)$ is positive definite. If $\\lambda_k\\leq\
    \ 0$, we can select $y=e^k$, then $q_n(y)=\\lambda_k\\leq 0$, i.e., $q_n(x)$ is\
    \ not positive definite. The other cases can be discussed similarly.\n\n# **Example\
    \ 22.3.**\n\nIn view of *Theorem 22.2* the quadratic form (22.5) is positive definite,\
    \ whereas (22.6) is indefinite. From *Example 18.1*, it is clear that the quadratic\
    \ form\n\n$$q_3(x_1,x_2,x_3)=-11x_1^2-11x_2^2-14x_3^2+2x_1x_2+8x_1x_3+8x_2x_3$$\n\
    \nis negative definite (the eigenvalues of the corresponding matrix are $-6,-12,-18$).\n\
    \nThe rest of the results in this chapter find maximum and minimum of the quadratic\
    \ form $q_n(x)$ subject to some constraints, and so belong to a broad field known\
    \ as *constrained optimization*.\n\n# **Lemma 22.1.**\n\nFor the quadratic form\
    \ $q_n(x)=\\sum_{i=1}^n b_i x_i^2$ subject to the constraint $\\|x\\|_2=1$, the\
    \ following hold:\n\n+   (i) the maximum value is $b_k=\\max\\{b_1,\\cdots,b_n\\\
    }$ and attained at $x=e^k$,  \n+   (ii) the minimum value is $b_\\ell=\\min\\\
    {b_1,\\cdots,b_n\\}$ and attained at $x=e^\\ell$.\n\n# **Proof.**\n\nClearly,\
    \ $q_n(x)=\\sum_{i=1}^n b_ix_i^2\\leq b_k\\sum_{i=1}^n x_i^2=b_k$. Further, at\
    \ $x=e^k$, $q_n(e^k)=b_k$.\n\n# **Theorem 22.3.**\n\nLet the symmetric matrix\
    \ $A$ in (22.2) have the eigenvalues $\\lambda_1\\leq\\cdots\\leq\\lambda_n$,\
    \ and $x^1,\\cdots,x^n$ be the corresponding eigenvectors. Then, for the quadratic\
    \ form $q_n(x)=x^tAx$ subject to the constraint $\\|x\\|_2=1$, the following hold:\n\
    \n+   (i) the maximum value is $\\lambda_n$ and attained at $x=x^n/\\|x^n\\|_2$,\
    \  \n+   (ii) the minimum value is $\\lambda_1$ and attained at $x=x^1/\\|x^1\\\
    |_2$."
