  md: 'We are now in the position to prove the main result of this chapter.


    # Theorem 23.6 (Sylvester’s criterion). A symmetric matrix \(A\) is positive definite
    if and only if all principal minors \(\det(A^k)\), \(k=1,\cdots,n\) are positive.


    **Proof.** If \(A\) is positive definite, then all principal minors are positive,
    as follows from Theorems 23.2 and 23.3. Conversely, the matrix \(A\) has the Cholesky
    decomposition, i.e., \(A=L_cL_c^t\). Since \(\det(A)>0\), the matrix \(L_c^t\)
    must be non- singular, and hence \(L_c^tx\neq 0\) for all \(x\neq 0\). From this,
    we find


    \(x^tAx=x^tL_cL_c^tx=(L_c^tx)^t(L_c^tx)=\|L_c^tx\|^2>0.\)


    Hence, the matrix \(A\) is positive definite.


    # Example 23.4. For the matrix \(A\) in (18.1), we have \(\det(A^1)=11>0\), \(\det(A^2)=120>0\),
    \(\det(A^3)=1296>0\); thus in view of Theorem 23.6, the matrix \(A\) is positive
    definite. This in turn implies that the quadratic form in (22.5) is positive definite.


    Finally, in this chapter we shall prove the following result.


    # Theorem 23.7 (polar decomposition). Let the \(n\times n\) matrix \(A\) have
    rank \(r\). Then, \(A\) can be factored as \(A=PQ\), where \(P\) is a symmetric
    \(n\times n\) positive semidefinite matrix of rank \(r\), and \(Q\) is an \(n\times
    n\) orthogonal matrix. If \(r=n\), then the matrix \(P\) is positive definite.


    **Proof.** We rewrite the singular value decomposition (19.1) as


    \(A=U\Sigma V^t=U\Sigma U^tUV^t=(U\Sigma U^t)(UV^t)=PQ.\) (23.1)


    In (23.1), the matrix \(Q=UV^t\) is the product of two orthogonal matrices, and
    hence in view of Problem 4.7, is orthogonal. The matrix \(P=U\Sigma U^t\) is symmetric,
    also orthogonally similar to \(\Sigma\), and hence in view of P12 (in Chapter
    16) \(P\) has the same rank and eigenvalues as \(\Sigma\). This implies that \(P\)
    is positive semidefinite. Clearly, if \(r=n\) then all diagonal elements of \(\Sigma\)
    are positive, and thus \(P\) is positive definite. \(\blacksquare\)


    # Example 23.5. For the matrix in Problem 16.2(ii), the singular value decomposition
    of \(U\Sigma V^t\), where


