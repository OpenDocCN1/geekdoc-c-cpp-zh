  md: '# # Chapter 17


    # # Normed Linear Spaces


    The distance between a vector and the zero vector is a measure of the length of
    the vector. This generalized notion, which plays a central role in the whole of
    analysis, is called a norm. We begin this chapter with the definition of a norm
    of a vector and then extend it to a matrix. Then we will drive some estimates
    on the eigenvalues of a given matrix. Some very useful convergence results are
    also proved.


    A norm (or length) on a vector space _V_ is a function that assigns to each vector
    \(u \in V\) a nonnegative real number, denoted as \(\|u\|\), which satisfies the
    following axioms:


    +   1. Positive definite property: \(\|u\| \ge 0\), and \(\|u\| = 0\) if and only
    if _u_ = 0,

    +   2. Homogeneity property: \(\|cu\| = |c|\|u\|\) for each scalar _c_,

    +   3. Triangle inequality: \(\|u + v\| \le \|u\| + \|v\|\) for all _u_, \(v \in
    V\) .


    A vector space _V_ with a norm \(\| \cdot \|\) is called a _normed linear space_,
    and is denoted as \((V, \| \cdot \|)\). In the vector space _R<sup>n</sup>_ (_C<sup>n</sup>_)
    the following three norms are in common use:


    absolute norm \(\|u\|_1 = \sum_{i=1}^n |u_i|\),


    Euclidean norm \(\|u\|_2 = \left(\sum_{i=1}^n |u_i|^2\right)^{1/2} = \sqrt{(u,
    u)}\),


    and


    maximum norm \(\|u\|_\infty = \max_{1 \le i \le n} |u_i|\).


    As an example, for the vector _u_ = (1, 2, -3, 5)_<sup>t</sup>_, we have \(\|u\|_1
    = 11\), \(\|u\|_2 = \sqrt{39}\), \(\|u\|_\infty = 5\), whereas for the vector
    _u_ = (1 + _i_, 2 - 3_i_, 4), \(\|u\|_1 = \sqrt{2} + \sqrt{13} + 4\), \(\|u\|_2
    = \sqrt{31}\), \(\|u\|_\infty = 4\).


    The notations \(\| \cdot \|_1\), \(\| \cdot \|_2\), and \(\| \cdot \|_\infty\)
    are justified because of the fact that all these norms are special cases of the
    general \(\ell_p\)-norm


    \(\|u\|_p = \left(\sum_{i=1}^n |u_i|^p\right)^{1/p}, \quad p \ge 1.\)'
