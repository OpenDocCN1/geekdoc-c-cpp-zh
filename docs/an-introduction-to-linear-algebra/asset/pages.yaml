  md: '# Theorem 4.5.


    If $A\in M^{n\times n}$ is a nonsingular matrix, then


    $$A^{-1}=\frac{\operatorname{adj} A}{|A|}. \tag{4.1}$$


    # Proof.


    From (3.1)–(3.3), we have $A(\operatorname{adj} A)=(c_{ij})$, where


    $$c_{ij}=\sum_{k=1}^{n}a_{ik}\alpha_{jk}=\begin{cases}\det(A)&\text{if }i=j,\\0&\text{if
    }i\ne j.\end{cases}$$


    Hence, $A(\operatorname{adj} A)=\det(A)I$, which implies (4.1).


    # Example 4.2.


    For the matrix


    $$A=\begin{pmatrix}2&-1&1\\3&2&-5\\1&3&-2\end{pmatrix},$$


    we have


    $$|A|=\begin{vmatrix}2&-1&1\\3&2&-5\\1&3&-2\end{vmatrix}=28\quad\text{and}\quad
    \operatorname{adj}A=\begin{pmatrix}11&1&3\\1&-5&13\\7&-7&7\end{pmatrix}$$


    and hence from (4.1) it follows that


    $$A^{-1}=\begin{pmatrix}\frac{11}{28}&\frac{1}{28}&\frac{3}{28}\\\frac{1}{28}&-\frac{5}{28}&\frac{13}{28}\\\frac14&-\frac14&\frac14\end{pmatrix}.$$


    An $n\times n$ matrix $A=(a_{ij})$ is said to be a *band matrix* if there exist
    integers $r$ and $s$, $1<r,s<n$ such that $a_{ij}=0$ for all $j-i\ge r$ and $i-j\ge
    s$. The number $w=r+s-1$ is called the bandwidth of $A$. Matrices with $r=s=2$
    so that $w=3$ are called *tridiagonal* matrices. We shall find the inverse of
    the tridiagonal matrix


    $$A_n(x)=\begin{pmatrix}x&-1&&&&\\-1&x&-1&&&\\&-1&x&-1&&\\&&\ddots&\ddots&\ddots&\\&&&-1&x&-1\\&&&&-1&x\end{pmatrix}.
    \tag{4.2}$$


    where $x\ge 0$. For this, let $D_n(x)=D_n=|A_n(x)|$. Then, $D_n$ satisfies the
    following second order linear difference equation


    $$D_n=xD_{n-1}-D_{n-2},\qquad n=1,2,\ldots \tag{4.3}$$'
