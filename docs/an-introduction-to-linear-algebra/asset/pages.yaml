  md: '# # 16.15.


    Let \( A \) be an \( n \times n \) matrix with linearly independent eigenvectors
    \( u^1, \cdots, u^n \) and associated eigenvalues \( \lambda_1, \cdots, \lambda_n
    \), where \( |\lambda_1| > |\lambda_2| \ge |\lambda_3| \ge \cdots \ge |\lambda_n|
    \), i.e., \( \lambda_1 \) is the _dominant eigenvalue_). Further, let \( \hat{u}
    = c_1 u^1 + \cdots + c_n u^n \), where \( c_1 \neq 0 \). Show that \( \lim_{m
    \to \infty} (1/\lambda_1^m) A^m \hat{u} = c_1 u^1 \). In particular, for the matrix
    \( A \) in (16.4) show that


    \(\frac{1}{4^8} A^8 \left( \begin{array}{ c } 1 \\ 1 \\ 1 \end{array} \right)
    = \frac{1}{4^8} \left( \begin{array}{ c c c } 11051 & 21845 & 10795 \\ 21845 &
    43691 & 21845 \\ 10795 & 21845 & 11051 \end{array} \right) \left( \begin{array}{
    c } 1 \\ 1 \\ 1 \end{array} \right) \simeq \left( \begin{array}{ c } 0.666672
    \\ 1.333328 \\ 0.666672 \end{array} \right) \simeq k \left( \begin{array}{ c }
    1 \\ 2 \\ 1 \end{array} \right),\)


    where \( k \) is a constant.


    # # Answers or Hints


    # ## 16.1.


    (i) \( (\alpha A)x = (\alpha \lambda)x \).


    # (ii)


    \( \det(A - \lambda I) = (a_{11} - \lambda) \cdot \text{cofactor}(a_{11} - \lambda)
    + \sum_{j=2}^n a_{1j} \cdot \text{cofactor } a_{1j} \), and since each term \(
    a_{1j} \cdot \text{cofactor } a_{1j} \) is a polynomial of degree at most \( n
    - 2 \), on comparing the coefficients of \( \lambda^{n-1} \), we get \( (-1)^{n+1}
    \sum_{i=1}^n \lambda_i = \text{coefficient of } \lambda^{n-1} \text{ in } (a_{11}
    - \lambda) \cdot \text{cofactor}(a_{11} - \lambda) \). Therefore, an easy induction
    implies \( (-1)^{n+1} \sum_{i=1}^n \lambda_i = \text{coefficient of } \lambda^{n-1}
    \text{ in } (a_{11} - \lambda) \cdots (a_{nn} - \lambda) = (-1)^{n-1} \sum_{i=1}^n
    a_{ii} \).


    # (iii)


    In \( \det(A - \lambda I) = (-1)^n (\lambda - \lambda_1) \cdots (\lambda - \lambda_n)
    \) substitute \( \lambda = 0 \).


    # (iv)


    Clear from the expansion of the determinant.


    # (v)


    For a polynomial with real coefficients, complex roots occur only in conjugate
    pairs. Thus \( \lambda_1 = \mu + i\nu \) and \( \overline{\lambda_1} = \mu - i\nu
    \) both are eigenvalues. Now if \( u = v + iw \) is an eigenvector corresponding
    to \( \lambda_1 \), i.e., \( Au = \lambda_1 u \), then since \( A \) is real,
    \( A\overline{u} = \overline{\lambda_1} \overline{u} \).


    # (vi)


    Use P11.


    # (vii)


    If \( A^{-1} = A^t \), then from P6 and P7, \( 1/\lambda = \lambda \), i.e., \(
