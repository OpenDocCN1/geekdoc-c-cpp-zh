    # Remark 19.4.


    When the matrix _A_ is invertible, i.e., _r_=_n_, then \(\sigma_i>0\), \(i=1,\cdots,n\)
    and the singular value decomposition of _A_ takes the form


    \(A=\left(u^1,\cdots,u^n\right)\left(\begin{array}{ c c c c }

    \sigma_1 & 0 & \cdots & 0 \\

    0 & \sigma_2 & \cdots & 0 \\

    \vdots & \vdots & \ddots & \cdots \\

    0 & 0 & \cdots & \sigma_n

