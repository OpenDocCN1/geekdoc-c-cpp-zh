    } \sigma) a_{1\sigma(1)} a_{2\sigma(2)} \cdots a_{n\sigma(n)}} = \det(\overline{A})\)


    +   3.5. \(\det(A^2 + B^2) = \det(A + iB)(A - iB) = \det(A + iB) \det(A - iB)
    = \det(A + iB) \det(\overline{A + iB}) \geq 0\).'
