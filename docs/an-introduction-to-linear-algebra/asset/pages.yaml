  md: '# ## Example 3.6.


    From the definition of determinants it is clear that for a given \( n \times n
    \) matrix \( A(x) = (a_{ij}(x)) \) of differentiable functions in an interval
    \( J \), the function \( \det A(x) \) is differentiable in \( J \). We shall compute
    \( (\det A(x))'' \) by using the expansion of \( \det A(x) \) given in (3.1).
    Since


    \(\det A(x) = \sum_{j=1}^n a_{ij}(x) \alpha_{ij}(x)\)


    it follows that


    \(\frac{\partial \det A(x)}{\partial a_{ij}(x)} = \alpha_{ij}(x)\)


    and hence


    \((\det A(x))'' = \sum_{j=1}^n \sum_{i=1}^n \frac{\partial \det A(x)}{\partial
    a_{ij}(x)} \frac{da_{ij}(x)}{dx} = \sum_{j=1}^n \sum_{i=1}^n \alpha_{ij}(x) a''_{ij}(x),\)


    which is equivalent to


    \((\det A(x))'' = \begin{vmatrix} a''_{11}(x) & \cdots & a''_{1n}(x) \\ a_{21}(x)
    & \cdots & a_{2n}(x) \\ \cdots & \cdots & \cdots \\ a_{n1}(x) & \cdots & a_{nn}(x)
    \end{vmatrix} + \begin{vmatrix} a_{11}(x) & \cdots & a_{1n}(x) \\ a''_{21}(x)
    & \cdots & a''_{2n}(x) \\ \cdots & \cdots & \cdots \\ a_{n1}(x) & \cdots & a_{nn}(x)
    \end{vmatrix} + \cdots\)

    \(+ \begin{vmatrix} a_{11}(x) & \cdots & a_{1n}(x) \\ a_{21}(x) & \cdots & a_{2n}(x)
    \\ \cdots & \cdots & \cdots \\ a''_{n1}(x) & \cdots & a''_{nn}(x) \end{vmatrix}.\)


    (3.6)


    # ## Problems


    # ### 3.1. Evaluate


    (i) \(\begin{vmatrix} 21 & 17 & 7 & 10 \\ 24 & 22 & 6 & 10 \\ 6 & 8 & 2 & 3 \\
    5 & 7 & 1 & 2 \end{vmatrix},\) (ii) \(\begin{vmatrix} 1+i & 1-i & i \\ 1-i & i
    & 1+i \\ i & 1+i & 1-i \end{vmatrix}.\)


    # ### 3.2. Solve the equations


    (i) \(\begin{vmatrix} x+2 & 2x+3 & 3x+4 \\ 2x+3 & 3x+4 & 4x+5 \\ 3x+5 & 5x+8 &
    10x+17 \end{vmatrix} = 0,\) (ii) \(\begin{vmatrix} 1+x & 2 & 3 \\ 1 & 2+x & 3
    \\ 1 & 2 & 3+x \end{vmatrix} = 0.\)


    # ### 3.3. Show that


    (i) \(\begin{vmatrix} 1+a & 1 & 1 & 1 \\ 1 & 1+b & 1 & 1 \\ 1 & 1 & 1+c & 1 \\
    1 & 1 & 1 & 1+d \end{vmatrix} = abcd \left(1 + \frac{1}{a} + \frac{1}{b} + \frac{1}{c}
    + \frac{1}{d}\right)\)'
