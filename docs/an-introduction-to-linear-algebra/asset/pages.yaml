    From [Problem 14.14(ii)] it follows that for the matrix


    $$A=(a^1,a^2,a^3)=\begin{pmatrix}

    1&1&2\\

    1&2&3\\

    1&3&4\\

    3&4&9

    \end{pmatrix}$$'
