    # **Theorem 8.1.** In any vector space \((V, F)\) the following hold:


    +   1. any set containing 0 is linearly dependent,

    +   2. the set \(\{u\}\) is linearly independent if and only if \(u \neq 0\),

    +   3. the set \(\{u, v\}\) is linearly dependent if and only if \(u = cv\), where
    c is some

    +   scalar,

    +   4. every subset \(S_0\) of a linearly independent set \(S\) is linearly independent,

    +   5. if \(S\) is a finite set of vectors and some subset \(S_0\) of \(S\) is
    linearly dependent,

    +   then \(S\) is linearly dependent,

    +   6. the set \(S = \{u^1, \cdots, u^n\}\) where each \(u^k \neq 0\) is linearly
    dependent if and

    +   only if at least one of the vectors \(u^j\) is linearly dependent on the preceding

    +   vectors \(u^1, \cdots, u^{j-1}\).


    # **Proof.**


    +   1. If \(S = \{0, u^2, \cdots, u^n\}\), then we can write \(1 \times 0 + 0
    \times u^2 + \cdots + 0 \times u^n = 0\).

    +   2. If \(u = 0\), then in view of 1, the set \(\{u\}\) is linearly dependent.
    Conversely,

    +   if \(\{u\}\) is linearly dependent, then there exists a nonzero scalar \(c\)
    such that

    +   \(cu = 0\). But, then \(0 = c^{-1}0 = c^{-1}(cu) = u\), i.e., \(u = 0\).

    +   3. If \(S = \{u, v\}\) is linearly dependent, then there exist scalars \(c_1,
    c_2\) not both

    +   zero such that \(c_1u + c_2v = 0\). If \(c_1 = 0\), then \(c_2v = 0\), and
    hence \(v = 0\),

    +   which in view of 1. implies that \(S\) is linearly dependent. If \(c_1\) and
    \(c_2\) both are

    +   nonzero, then clearly we have \(u = -c_1^{-1}c_2v\). Conversely, in \(u =
    cv\) if \(c = 0\),

    +   then we have \(u = 0\), and if \(c \neq 0\), then \(u - cv = 0\).

    +   4. Suppose a linear combination of the vectors \(S_0\) is equal to zero, then
    the

    +   addition of all the terms of the form 0 times the vectors in \(S \backslash
