    # ## Gauss elimination method.


    This is a systematic procedure (_algorithm_) that is often implemented over a
    machine provided the size of the system (5.1) is not too large. It first reduces
    the augmented matrix \((A|b)\) with rows \(R_1,\cdots,R_m\) to an echelon form,
    and then suggests how to solve the linear system corresponding to the obtained
    echelon matrix. We describe the method in the following steps:


    +   1. Find the first column of \((A|b)\) with a nonzero element. Let \(j_1\)
    denote this column.


    +   2. If necessary, interchange rows of \((A|b)\) so that \(|a_{1j_1}|=\max\{|a_{1j_1}|,|a_{2j_1}|,\cdots,|a_{nj_1}|\}\).
    We once again denote the rows of the rearranged \((A|b)\) by \(R_1,\cdots,R_m\).


    +   3. Divide the first row \(R_1\) by the pivot \(a_{1j_1}\) and use the resulting
    row to obtain 0’s below \(a_{1j_1}\) by replacing \(R_i,i=2,\cdots,m\) by \(R_i-(a_{ij_1}/a_{1j_1})R_1\).


    +   4. Consider the matrix obtained in Step 3 excluding the first row. For this
    submatrix we repeat Steps 1-3. This will give the second pivot \(a_{2j_2}\).


    +   5. Continue Steps 1-4 until all rows (if any) of the submatrix are of the
    form \((0,\cdots,0,d)\).


    It is clear that Steps 1-5 will reduce \((A|b)\) to an echelon form with the pivots
    \(a_{ij_i}=1,i=1,\cdots,r\le m\).


    +   6. If the echelon form of \((A|b)\) has a row of the form \((0,\cdots,0,d),d\neq
    0\) the system (5.2) has no solution. Otherwise, the linear system corresponding
    to the echelon form will be of the form


    \(x_{j_1}+\tilde{a}_{1,j_1+1}x_{j_1+1}+\cdots+\tilde{a}_{1n}x_n=d_{j_1}\cdots
    x_{j_{r-1}}+\tilde{a}_{r-1,j_{r-1}+1}x_{j_{r-1}+1}+\cdots+\tilde{a}_{r-1,n}x_n=d_{j_{r-1}}x_{j_r}+\tilde{a}_{r,j_r+1}x_{j_r+1}+\cdots+\tilde{a}_{rn}x_n=d_{j_r}.\)
    (6.4)


    If \(r<n\), we compute \(x_{j_i},i=1,\cdots,r\) (known as _basic variables_) in
    terms'
