    = A^m \) and \( A^0 = I \). Also, if \( m \) and \( p \) are positive integers,
    then in view of the associative law, we have \( A^m A^p = A^{m+p} \). In particular,
    \( I = I^2 = I^3 = \cdots \). Further, if \( A \) is a diagonal matrix'
