  md: '# **Example 11.3.** Consider the matrices


    $$A=\begin{pmatrix}1&0&1\\0&1&0\end{pmatrix},\qquad B=\begin{pmatrix}0&1\\0&1\\1&-1\end{pmatrix}.$$


    Since $AB=I$, $B$ is a *right inverse* of $A$, and $A$ is a *left inverse* of
    $B$. We also note that the matrix


    $$\begin{pmatrix}1&0\\0&1\\0&0\end{pmatrix}$$


    is also a right inverse of $A$. Hence right as well as left inverse of a given
    matrix is not unique.


    # **Theorem 11.5.**


    If $x$ is a solution of the nonhomogeneous system $(5.2)$ and the matrix $A$ has
    a left inverse $L$, then $x=Lb$. If $A$ has a right inverse, then $(5.2)$ has
    a solution $x=Rb$.


    **Proof.** Notice that $x=Ix=(LA)x=L(Ax)=Lb$, and $A(Rb)=(AR)b=Ib=b$.


    # **Theorem 11.6.**


    Let $A\in M^{m\times n}$ and $r=r(A)$. Then $A$ has a right inverse $R$ if and
    only if $r=m$ and $m\le n$.


    **Proof.** We note that finding a right inverse matrix $R=(r_{ij})$ of order $n\times
    m$ is equivalent to solving the matrix linear system $AR=I$ for which the augmented
    matrix is $(A\mid I)$. Now from **Theorem 5.12**, we know that $AR=I$ has a solution
    if and only if $r(A)=r(A\mid I)$. But, since $r(A\mid I)=r(I)=m$ the matrix $A$
    has a right inverse if and only if $r(A)=m$, and thus $m\le n$.


    # **Theorem 11.7.**


    Let $A\in M^{m\times n}$ and $r=r(A)$. Then $A$ has a left inverse $L$ if and
    only if $r=n$ and $n\le m$.


    **Proof.** The proof follows from the fact that $LA=I$ if and only if $A^tL^t=I$.


