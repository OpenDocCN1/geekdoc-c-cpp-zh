    # ## Corollary 9.1.


    Let \((V, F)\) be a vector space, and let \(S = \{u^1, \cdots, u^n\}\) and \(T
    = \{v^1, \cdots, v^m\}\) be the basis of \(V\). Then, \(m = n\).


    # ## Proof.


    In view of Theorem 9.1, \(m > n\) is impossible. Now since \(T\) is also a basis,
    \(n > m\) is also impossible. \(\blacksquare\)


    Let \((V, F)\) be a vector space, and let \(T = \{v^1, \cdots, v^m\} \subset V\).
    We say that \(S = \{v^{k_1}, \cdots, v^{k_n}\} \subseteq T\) is a *maximal linearly
    independent subset* of \(T\) if \(S\) is linearly independent, and if \(v^i \in
    T \backslash S\), then \(S \cup \{v^i\}\) is linearly dependent.


    # ## Theorem 9.2.


    Let \(T = \{v^1, \cdots, v^m\}\) generate the vector space \((V, F)\), and let
    \(S = \{v^{k_1}, \cdots, v^{k_n}\}\) be a maximal linearly independent subset
    of \(T\). Then \(S\) is a basis of \(V\).


    # ## Proof.


    We need to show that \(S = \{v^{k_1}, \cdots, v^{k_n}\}\) generates \(V\). For
    this, first we shall prove that each \(v^i \in T \backslash S\) is a linear combination
    of \(v^{k_1}, \cdots, v^{k_n}\). Since \(S \cup \{v^i\}\) is linearly dependent,
    there exist scalars \(c_1, \cdots, c_n, x\) not all zero such that


    \(c_1 v^{k_1} + \cdots + c_n v^{k_n} + x v^i = 0.\)


    Clearly, \(x \neq 0\), otherwise, \(S\) will be linearly dependent. Thus, it follows
    that


    \(v^i = \frac{-c_1}{x} v^{k_1} + \cdots + \frac{-c_n}{x} v^{k_n},\)


    which confirms that \(v^i\) is a linear combination of \(v^{k_1}, \cdots, v^{k_n}\).
    Now let \(u \in V\), then there exist scalars \(\alpha_1, \cdots, \alpha_m\) such
    that


    \(u = \alpha_1 v^1 + \cdots + \alpha_m v^m.\)


    In this relation, we replace each \(v^i \in T \backslash S\) by a linear combination
    of \(v^{k_1}, \cdots, v^{k_n}\). The resulting relation on grouping the terms
    will lead to a linear combination of \(v^{k_1}, \cdots, v^{k_n}\) for \(u\). Thus
    \(S\) generates \(V\). \(\blacksquare\)


    Let \((V, F)\) be a vector space, and let \(S = \{u^1, \cdots, u^n\} \subset V\)
    be linearly independent. We say that \(S\) is a *maximal linearly independent
    set* of \(V\) if and only if \(u \in V \backslash S\), then \(S \cup \{u\}\) is
    linearly dependent.


    # ## Theorem 9.3.


    Let \(S = \{u^1, \cdots, u^n\}\) be a maximal linearly independent set of the
    vector space \((V, F)\). Then, \(S\) is a basis of \(V\).


    # ## Proof.


    The proof is the same as in the first part of Theorem 9.2. \(\blacksquare\)


    A vector space \(V\) over the field \(F\) is said to be of *finite dimension*
    \(n\), or \(n\)-dimensional, written as \(\dim V = n\), if and only if \(V\) has
