    (_A_<sup>+</sup>_A_)_<sup>t</sup>_=_A_<sup>+</sup>_A_, does not hold.


    # Example 24.4.


    For the matrix _A_ in Example 19.1, we have _r_(_A_)=_m_=2,

    thus the Moore-Penrose inverse exists uniquely and simple calculations give

    \(A^+=A^t(AA^t)^{-1}=\left(\begin{array}{ c c }

    \frac{2}{9} & \frac{1}{3} \\

    \frac{2}{9} & -\frac{1}{3} \\

    \frac{1}{9} & 0 \\

    0 & \frac{1}{3}

    \end{array}\right).\)


    Our next result provides some basic properties of Moore-Penrose inverse.

    Theorem 24.3. Let the \(m\times n\) matrix _A_ have the rank _r_, and let _A_<sup>+</sup>
    be

    its Moore-Penrose inverse given in (24.3). Then, the following hold:

    (i) for every vector \(y\in R^m\) the vector \(A^+y\in R(A)\)

    (ii) for every vector \(y\in\mathcal{N}(A)\) the vector _A_<sup>+</sup>_y_=0

    (iii) \(A^+u^i=v^i/\sigma_i,i=1,\cdots,r.\)


    # Proof.


    (i) Since \(A^+y=(V_1D_{rr}^{-1}U_1^t)y=V_1(D_{rr}^{-1}U_1^ty)\), it follows that
    _A_<sup>+</sup>_y_

    is a linear combination of the columns of _V_<sub>1</sub>. But this in view of
    Theorem

    19.2(iii) implies that \(A^+y\in R(A)\).

    (ii) If \(y\in\mathcal{N}(A)\), then clearly \(y\perp C(A)\), which in view of
    Theorem 19.2(i)

    implies that \(y\perp U_1\). But this in view of Problem 14.11 implies that \(U_1^ty=0\),

    and hence, we have \(A^+y=(V_1D_{rr}^{-1}U_1^t)y=0\).


