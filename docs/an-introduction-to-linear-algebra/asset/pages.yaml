  md: "# Vector spaces.\n\nA vector space $V$ over a field $F$ denoted as $(V,F)$\
    \ is a nonempty set of elements called vectors together with two binary operations,\
    \ addition of vectors and multiplication of vectors by scalars, so that the following\
    \ axioms hold:\n\n+   B1. *Closure property of addition:* If $u,v\\in V$, then\
    \ $u+v\\in V$.\n+   \n+   B2. *Commutative property of addition:* If $u,v\\in\
    \ V$, then $u+v=v+u$.\n+   \n+   B3. *Associativity property of addition:* If\
    \ $u,v,w\\in V$, then $(u+v)+w=u+(v+w)$.\n+   \n+   B4. *Additive identity:* There\
    \ exists a zero vector, denoted by $0$, in $V$ such that for all $u\\in V$, $u+0=0+u=u$.\n\
    +   \n+   B5. *Additive inverse:* For each $u\\in V$, there exists a vector $v\\\
    in V$ such that $u+v=v+u=0$. Such a vector $v$ is usually written as $-u$.\n+\
    \   \n+   B6. *Closure property of multiplication:* If $u\\in V$ and $a\\in F$,\
    \ then the product $a\\cdot u=au\\in V$.\n+   \n+   B7. If $u,v\\in V$ and $a\\\
    in F$, then $a(u+v)=au+av$.\n+   \n+   B8. If $u\\in V$ and $a,b\\in F$, then\
    \ $(a+b)u=au+bu$.\n+   \n+   B9. If $u\\in V$ and $a,b\\in F$, then $ab(u)=a(bu)$.\n\
    +   \n+   B10. *Multiplication of a vector by a unit scalar:* If $u\\in V$ and\
    \ $1\\in F$, then $1u=u$.\n\nIn what follows, the subtraction of the vector $v$\
    \ from $u$ will be written as $u-v$, and by this we mean $u+(-v)$, or $u+(-1)v$.\
    \ The spaces $(V,\\mathbb{R})$ and $(V,\\mathbb{C})$ will be called real and *complex\
    \ vector spaces*, respectively.\n\n# Example 1.2 (The $n$-tuple space).\n\nLet\
    \ $F$ be a given field. We consider the set $V$ of all ordered $n$-tuples\n\n\
    ![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_14_0.png)\n\nof scalars (known as *components*)\
    \ $a_i\\in F$. If\n\n![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_14_1.png)\n\nis\
    \ in $V$, the addition of $u$ and $v$ is defined by\n\n![](img/049a5f7ee46d1463ca7feb5fdb0d0a78_14_2.png)"
