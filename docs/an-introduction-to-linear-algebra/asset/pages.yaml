  md: 'symmetric matrices. We write the \(n \times n\) symmetric matrix as


    \(A = \left(\begin{array}{ c c }

    A^{n-1} & \begin{array}{ c }

    a_{1n} \\

    \vdots \\

    a_{(n-1)n} \\

    a_{nn} \\

    \end{array} \\

    \begin{array}{ c c c c }

    a_{n1} & \cdots & a_{n(n-1)} & \\

    \end{array} & \\

    \end{array}\right).\)


    By inductive hypothesis, we can reduce the matrix \(A\) to the form


    \(A^* = \left(\begin{array}{ c c c c c }

    a_{11}^* & a_{12} & \cdots & a_{1,n-1} & a_{1n} \\

    0 & a_{22}^* & \cdots & \tilde{a}_{2,n-1} & \tilde{a}_{2,n} \\

    \vdots & \vdots & \ddots & \vdots & \vdots \\

    0 & 0 & \cdots & a_{n-1,n-1}^* & \tilde{a}_{n-1,n} \\

    a_{n1} & a_{n2} & \cdots & a_{n,n-1} & a_{nn} \\

    \end{array}\right),\)


    where \(a_{ii}^*, i = 1, \cdots, n-1\) are positive. From this it immediately
    follows that we can reduce \(A^*\) and hence \(A\) to echelon form without interchanging
    rows, as


    \(A^{**} = \left(\begin{array}{ c c c c c }

    a_{11}^* & a_{12} & \cdots & a_{1,n-1} & a_{1n} \\

    0 & a_{22}^* & \cdots & \tilde{a}_{2,n-1} & \tilde{a}_{2,n} \\

    \vdots & \vdots & \ddots & \vdots & \vdots \\

    0 & 0 & \cdots & a_{n-1,n-1}^* & \tilde{a}_{n-1,n} \\

    0 & 0 & \cdots & 0 & a_{nn}^* \\

    \end{array}\right).\)


    Finally, since \(\det(A) > 0\), \(\det(A^{n-1}) > 0\), and \(\det(A) = \det(A^{**})
    = \det(A^{n-1})a_{nn}^*\), it follows that \(a_{nn}^* = \det(A)/\det(A^{n-1})
    > 0\). \(\blacksquare\)


    # **Example 23.2.** For the matrix \(A\) in (18.1), the echelon form is


    \(\left(\begin{array}{ c c c }

    11 & -1 & -4 \\

    0 & \frac{120}{11} & -\frac{48}{11} \\

    0 & 0 & \frac{54}{5} \\

    \end{array}\right).\)


    For this matrix, it also directly follows that


    \(a_{11}^* = \det(A^1) = 11\)

    \(a_{22}^* = \det(A^2)/\det(A^1) = 120/11\)

    \(a_{33}^* = \det(A)/\det(A^2) = 1296/120 = 54/5.\)


    Further, this matrix can be \(LU\) factorized as


    \(A = LU = \left(\begin{array}{ c c c }

    1 & 0 & 0 \\

    -\frac{1}{11} & 1 & 0 \\

    -\frac{4}{11} & -\frac{2}{5} & 1 \\

    \end{array}\right) \left(\begin{array}{ c c c }

    11 & -1 & -4 \\

    0 & \frac{120}{11} & -\frac{48}{11} \\

    0 & 0 & \frac{54}{5} \\

