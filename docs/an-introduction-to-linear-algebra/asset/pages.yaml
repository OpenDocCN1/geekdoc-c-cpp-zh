  md: '# # Chapter 7


    # # Factorization


    In this chapter we shall discuss a modified but restricted realization of Gaussian
    elimination. It factorizes a given \(m \times n\) matrix \(A\) to a product of
    two matrices \(L\) and \(U\), where \(L\) is an \(m \times m\) lower triangular
    matrix, and \(U\) is an \(m \times n\) upper triangular matrix. We shall also
    discuss various variants and applications of this factorization.


    **Theorem 7.1 (**\(LU\) **factorization).** Let \(A\) be an \(m \times n\) matrix.
    If \(A\) can be reduced to echelon form \(U\) without interchanging rows, then
    there exists an \(m \times m\) lower triangular matrix \(L\) with 1’s on the diagonal
    such that \(A = LU\).


    **Proof.** Let \(E_1, E_2, \cdots, E_r\) be the \(m \times m\) elementary matrices
    that correspond to the row operations which are needed to reduce \(A\) to the
    echelon form \(U\), i.e.,


    \((E_r \cdots E_2 E_1)A = U.\) \(\text{(7.1)}\)


    Notice that during our reduction of \(A\) to \(U\) we are allowed only to add
    a multiple of one row to a row below. This means each row operation \(E_i\) corresponds
    to an \(m \times m\) elementary lower triangular matrix with 1’s on the diagonal.
    Now from Problems 2.2 and 4.4 it follows that both \((E_r \cdots E_2 E_1)\) and
    \((E_r \cdots E_2 E_1)^{-1}\) are \(m \times m\) lower triangular matrix with
    1’s on the diagonal. Thus, from (7.1), we have \(A = LU\), where


    \(L = (E_r \cdots E_2 E_1)^{-1} = E_1^{-1} E_2^{-1} \cdots E_r^{-1}.\) \(\blacksquare\)
