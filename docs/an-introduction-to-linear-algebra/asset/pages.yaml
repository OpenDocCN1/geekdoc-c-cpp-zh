    Finally, in this chapter we prove the following theorem, known as $QR$ factorization.


    # **Theorem 18.3.**


    Let $A=(a^1,\ldots,a^n)$ be an $m\times n$ matrix with linearly independent columns.
    Then, $A$ can be factorized as $A=QR$, where $Q=(q^1,\ldots,q^n)$ is an $m\times
    n$ matrix with orthonormal columns and $R$ is an $n\times n$ upper triangular
    matrix with positive diagonal elements.


    # **Proof.**


    To columns of $A$ we apply the Gram–Schmidt process to obtain the required matrix
    $Q$ with orthonormal columns $\{q^1,\ldots,q^n\}$. For each $a^j$, $1\le j\le
    n$ by the Gram–Schmidt process ensures that $a^j\in\operatorname{Span}\{q^1,\ldots,q^j\}$.
    Thus, from (14.5) it follows that


    $$a^j=(a^j,q^1)q^1+(a^j,q^2)q^2+\cdots+(a^j,q^j)q^j. \tag{18.3}$$


    Let $r_{kj}=(a^j,q^k)$, $1\le j\le n$, $1\le k\le j$, and define the matrix


    $$R=\begin{pmatrix}

    r_{11}&r_{12}&\cdots&r_{1n}\\

    0&r_{22}&\cdots&r_{2n}\\

    \vdots&\vdots&\ddots&\vdots\\

    0&0&\cdots&r_{nn}

    \end{pmatrix}.$$


    Now we claim that $A=QR$. For this, it suffices to note that the $j$-th column
    of $QR$ is exactly (18.3). Now, clearly $a^k\notin\operatorname{Span}\{q^1,\ldots,q^{k-1}\}$,
    and hence $r_{kk}=(a^k,q^k)\ne0$. If $r_{kk}<0$, without affecting the orthonormality
    of $\{q^1,\ldots,q^n\}$, we replace $q^k$ with $-q^k$, which will make $r_{kk}>0$.
    Hence, the diagonal entries of $R$ can be made positive. ■


    # **Remark 18.4.**


    Since $A=QR$, we have $Q^tA=Q^tQR=R$, and hence once $Q$ is known, the matrix
    $R$ can be computed immediately.


