    \(J\), the mapping \(L = d/dx\) is linear.


    # Example 12.3.


    The projection mapping \(L: R^3 \rightarrow R^2\) defined by \(L(x, y, z) = (x,
    y, 0)^t\) is linear. However, the translation mapping \(L: R^3 \rightarrow R^3\)
    defined by \(L(x, y, z) = (x+1, y+2, z+3)^t\) is not linear (nonlinear), because
    \(L(0) = L(0, 0, 0) = (1, 2, 3)^t \neq 0\). The mapping \(L: R^3 \rightarrow R^2\)
    defined by \(L(x, y, z) = (|x|, yz)^t\) is also nonlinear.


    The linear mappings _zero_ (for every \(u \in V\), \(L(u) = 0\)) and _identity_
    (for every \(u \in V\), \(L(u) = u\)) are respectively denoted as 0 and _I_.


    # Theorem 12.1.


    Let \(\{u^1, \cdots, u^n\}\) be a basis of \(V\). Then, for any vectors \(w^1,
    \cdots, w^n \in W\) there exists a unique linear mapping \(L: V \rightarrow W\)
    such that \(L(u^i) = w^i\), \(i = 1, \cdots, n\).


    # Proof.


    Let \(u \in V\). Since \(\{u^1, \cdots, u^n\}\) is a basis of \(V\), there exist
    unique scalars \(c_1, \cdots, c_n\) such that \(u = c_1 u^1 + \cdots + c_n u^n\).
    We claim that \(L(u) = c_1 w^1 + \cdots + c_n w^n\) is the required mapping. For
    this, first we note that _L_ is well-defined because \(c_i\), \(i = 1, \cdots,
    n\) are unique, and since \(u^i = 0u^1 + \cdots + 0u^{i-1} + 1u^i + 0u^{i+1} +
    \cdots + 0u^n\), we have \(L(u^i) = w^i\), \(i = 1, \cdots, n\). Next, to show
    that _L_ is linear, let \(v = b_1 u^1 + \cdots + b_n u^n \in V\) and \(k \in F\),
    then since \(u+v = (c_1+b_1)u^1 + \cdots + (c_n+b_n)u^n\) and \(ku = (kc_1)u^1
    + \cdots + (kc_n)u^n\), we have \(L(u+v) = (c_1+b_1)w^1 + \cdots + (c_n+b_n)w^n\)
    and \(L(ku) = (kc_1)w^1 + \cdots + (kc_n)w^n\), and hence it follows that \(L(u+v)
    = L(u) + L(v)\) and \(L(ku) = kL(u)\). Finally, to show the uniqueness of _L_,
    let \(\tilde{L}: V \rightarrow W\) be another linear mapping such that \(\tilde{L}(u^i)
    = w^i\), \(i = 1, \cdots, n\). Then, for every \(u \in V\) we find \(\tilde{L}(u)
    = \tilde{L}(c_1 u^1 + \cdots + c_n u^n) = c_1 \tilde{L}(u^1) + \cdots + c_n \tilde{L}(u^n)
    = c_1 w^1 + \cdots + c_n w^n = L(u)\), which implies that \(L = \tilde{L}\).


    Now we shall extend the definition of isomorphism given in Chapter 10 to general
    vector spaces. The spaces _V_ and _W_ are said to be _isomorphic_, written as
    \(V \simeq W\), if there exists a one-to-one and onto linear mapping \(L: V \rightarrow
    W\). This mapping _L_ is called an _isomorphism_ between _V_ and _W_. It is clear
    that \(\simeq\) is an equivalence relation, i.e., 1. \(V \simeq V\). 2. If \(U
    \simeq V\), then \(V \simeq U\). 3. If \(U \simeq V\) and \(V \simeq W\), then
    \(U \simeq W\).


    # Theorem 12.2.


    \(V \simeq W\) if and only if \(\dim V = \dim W\).


    # Proof.


    Let _V_ and _W_ be _n_-dimensional vector spaces. Then, in view of Chapter 10,
    \(V \simeq F^n\) and \(W \simeq F^n\). Now \(V \simeq W\) follows from the fact
    that \(\simeq\) is an equivalent relation. Conversely, if \(V \simeq W\), then
    there exists an isomorphism \(L: V \rightarrow W\). Assume that \(\dim V = n\),
