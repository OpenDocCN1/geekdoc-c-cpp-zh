  md: '# # Matrices


    called a _skew-symmetric matrix_. Examples of symmetric and skew-symmetric matrices
    are respectively


    \(\left(\begin{array}{ c c c }

    a & h & g \\

    h & b & f \\

    g & f & c

    \end{array}\right)\text{and}\left(\begin{array}{ c c c }

    0 & h & -g \\

    -h & 0 & f \\

    g & -f & 0

    \end{array}\right).\)


    An \(m \times n\) matrix is called _upper triangular_ if \(a_{ij} = 0\), \(i >
    j\) and _lower triangular_ if \(a_{ij} = 0\), \(j > i\). In particular, a square
    matrix all of whose elements below the principal diagonal are zero is called an
    _upper triangular matrix_, and a square matrix all of whose elements above the
    principal diagonal are zero is called a _lower triangular matrix_. Thus,


    \(\left(\begin{array}{ c c c }

    a & h & g \\

    0 & b & f \\

    0 & 0 & c

    \end{array}\right)\text{and}\left(\begin{array}{ c c c }

    a & 0 & 0 \\

    h & b & 0 \\

    g & f & c

    \end{array}\right)\)


    are upper and lower triangular matrices, respectively. Clearly, a square matrix
    is diagonal if and only if it is both upper and lower triangular.


    Two matrices \(A = (a_{ij})\) and \(B = (b_{ij})\) are said to be _equal_ if and
    only if they are of the same order, and \(a_{ij} = b_{ij}\) for all \(i\) and
    \(j\).


    If \(A\) and \(B\) are two matrices of the same order, then their sum \(A + B\)
    is defined as the matrix each element of which is the sum of the corresponding
    elements of \(A\) and \(B\). Thus,


    \(\left(\begin{array}{ c c c }

    a_1 & b_1 \\

    a_2 & b_2 \\

    a_3 & b_3

    \end{array}\right)+\left(\begin{array}{ c c c }

    c_1 & d_1 \\

    c_2 & d_2 \\

    c_3 & d_3

    \end{array}\right)=\left(\begin{array}{ c c c }

    a_1 + c_1 & b_1 + d_1 \\

    a_2 + c_2 & b_2 + d_2 \\

    a_3 + c_3 & b_3 + d_3

    \end{array}\right).\)


    Similarly, \(A - B\) is defined as a matrix whose elements are obtained by subtracting
    the elements of \(B\) from the corresponding elements of \(A\). Thus,


    \(\left(\begin{array}{ c c c }

    a_1 & b_1 \\

    a_2 & b_2

    \end{array}\right)-\left(\begin{array}{ c c c }

    c_1 & d_1 \\

    c_2 & d_2

    \end{array}\right)=\left(\begin{array}{ c c c }

    a_1 - c_1 & b_1 - d_1 \\

    a_2 - c_2 & b_2 - d_2

    \end{array}\right).\)


    The addition of matrices satisfies the following properties:


    +   1. \(A + B = B + A\), _commutative law_


    +   2. \(A + (B + C) = (A + B) + C\), _associative law_


    +   3. \(A + 0 = 0 + A = A\),


    +   4. \(A + (-A) = (-A) + A = 0\).


    The product of a matrix \(A\) by a scalar \(k \in F\) is a matrix whose every
    element is \(k\) times the corresponding element of \(A\). Thus,


    \(k\left(\begin{array}{ c c c }

    a_1 & b_1 & c_1 \\

    a_2 & b_2 & c_2

    \end{array}\right)=\left(\begin{array}{ c c c }

    ka_1 & kb_1 & kc_1 \\

    ka_2 & kb_2 & kc_2

    \end{array}\right).\)'
