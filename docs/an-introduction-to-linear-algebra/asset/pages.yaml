  md: 'Combining Remark 7.1 with Theorem 23.4, we have the following result.


    # Theorem 23.5.


    If all principal minors \(det(A^k)\), \(k=1,\cdots,n\) of a symmetric matrix \(A\)
    are positive, then \(A\) can be uniquely factored as \(A=LDL^t\), where \(L\)
    is a lower triangular matrix with all diagonal elements 1, and \(D\) is a diagonal
    matrix with all positive elements.


    # Proof.


    In view of Remark 7.1 and Theorem 23.4, the factorization \(A=LD\hat{U}\) is unique,
    where the diagonal matrix \(D\) has only positive elements. Now since \(A\) is
    symmetric, we have


    \(L\hat{D}\hat{U}=A=A^t=\hat{U}^tD^tL^t=\hat{U}^tDL^t,\)


    which immediately implies that \(\hat{U}=L^t\). \(\blacksquare\)


    # Remark 23.2.


    We denote the diagonal elements of \(D\) as \(0<d_{ii}\), \(i=1,\cdots,n\), and
    define the diagonal matrix \(D^{1/2}\) with elements \(0<\sqrt{d_{ii}}\), \(i=1,\cdots,n\).
    Then, the above factorization can be written as


    \(A=LDL^t=(LD^{1/2})(D^{1/2}L^t)=(LD^{1/2})(LD^{1/2})^t=L_cL_c^t,\)


    where \(L_c=LD^{1/2}\). The factorization \(A=L_cL_c^t\) is called _Cholesky decomposition_.
    Now let us denote by \(L_{k-1}\) the \((k-1)\times(k-1)\) upper left corner of
    \(L_c\), \(a_k\) the first \(k-1\) entries in column \(k\) of \(A\), \(\ell_k\)
    the first \(k-1\) entries in column \(k\) of \(L_c^t\), and \(a_{kk}\) and \(\ell_{kk}\)
    the \(kk\) entries of \(A\) and \(L_c\), respectively. Then, the Cholesky algorithm
    is:


    \(L_1=\sqrt{a_{11}}=\ell_{11}\)

    \(L_{k-1}\ell_k=a_k,\text{compute}\ell_k\)

    \(\ell_{kk}=\sqrt{a_{kk}-\ell_k^t\ell_k}\)

    \(L_k=\left(\begin{array}{ c c }

    L_{k-1} & 0 \\

    \ell_k^t & \ell_{kk}

    \end{array}\right),k=2,\cdots,n.\)


    # Example 23.3.


    Using the Cholesky algorithm for the matrix \(A\) in (18.1), we successively have


    \(\ell_{11}=\sqrt{11},\ell_{21}=-\frac{1}{\sqrt{11}},\ell_{22}=\sqrt{\frac{120}{11}},\)

    \(\ell_{31}=-\frac{4}{\sqrt{11}},\ell_{32}=-\sqrt{\frac{96}{55}},\ell_{33}=\sqrt{\frac{54}{5}}.\)


    Thus, the Cholesky decomposition of the matrix \(A\) in (18.1) is


    \(\left(\begin{array}{ c c c }

    \sqrt{11} & 0 & 0 \\

    -\frac{1}{\sqrt{11}} & \sqrt{\frac{120}{11}} & 0 \\

    -\frac{4}{\sqrt{11}} & -\sqrt{\frac{96}{55}} & \sqrt{\frac{54}{5}}

    \end{array}\right)\left(\begin{array}{ c c c }

    \sqrt{11} & -\frac{1}{\sqrt{11}} & -\frac{4}{\sqrt{11}} \\

    0 & \sqrt{\frac{120}{11}} & -\sqrt{\frac{96}{55}} \\

    0 & 0 & \sqrt{\frac{54}{5}}

    \end{array}\right).\)'
