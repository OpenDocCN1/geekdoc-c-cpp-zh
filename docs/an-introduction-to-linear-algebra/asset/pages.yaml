  md: 'and the product of a scalar $c\in F$ and vector $u\in V$ is defined by


    $$cu=\begin{pmatrix}ca_1\\\vdots\\ca_n\end{pmatrix}.$$


    It is to be remembered that $u=v$, if and only if their corresponding components
    are equal, i.e., $a_i=b_i$, $i=1,\cdots,n$. With this definition of addition and
    scalar multiplication it is easy to verify all the axioms B1–B10, and hence this
    $(V,F)$ is a vector space. In particular, if


    $$w=\begin{pmatrix}c_1\\\vdots\\c_n\end{pmatrix}$$


    is in $V$, then the $i$-th component of $(u+v)+w$ is $(a_i+b_i)+c_i$, which in
    view of A3 is the same as $a_i+(b_i+c_i)$, and this is the same as the $i$-th
    component of $u+(v+w)$, i.e., B3 holds. If $F=R$, then $V$ is denoted as $R^n$,
    which for $n=2$ and $3$ reduces respectively to the two and three dimensional
    usual vector spaces. Similarly, if $F=C$, then $V$ is written as $C^n$.


    # Example 1.3 (The space of polynomials).


    Let $F$ be a given field. We consider the set $\mathcal{P}_n$, $n\geq 1$ of all
    polynomials of degree *at most* $n-1$, i.e.,


    $$\mathcal{P}_n=\left\{a_0+a_1x+\cdots+a_{n-1}x^{n-1}=\sum_{i=0}^{n-1}a_ix^i:a_i\in
    F,\quad x\in R\right\}.$$


    If $u=\sum_{i=0}^{n-1}a_ix^i$, $v=\sum_{i=0}^{n-1}b_ix^i\in\mathcal{P}_n$, then
    the addition of vectors $u$ and $v$ is defined by


    $$u+v=\sum_{i=0}^{n-1}a_ix^i+\sum_{i=0}^{n-1}b_ix^i=\sum_{i=0}^{n-1}(a_i+b_i)x^i,$$


    and the product of a scalar $c\in F$ and vector $u\in\mathcal{P}_n$ is defined
    by


    $$cu=c\sum_{i=0}^{n-1}a_ix^i=\sum_{i=0}^{n-1}(ca_i)x^i.$$


    This $(\mathcal{P}_n,F)$ is a vector space. We remark that the set of all polynomials
    of degree exactly $n-1$ is not a vector space. In fact, if we choose $b_{n-1}=-a_{n-1}$,
    then $u+v$ is a polynomial of degree $n-2$.


    # Example 1.4 (The space of functions).


    Let $F$ be a given field, and $X\subseteq F$. We consider the set $V$ of all functions
    from the set $X$ to $F$. The sum of two vectors $f,g\in V$ is defined by $(f+g)$,
    i.e., $(f+g)(x)=f(x)+g(x)$, $x\in X$,'
