    # ## Theorem 8.2


    Let the set \(S=\{u^1,\cdots,u^n\}\) span the vector space \((V,F)\).


    1. If \(u^j\) is linearly dependent on \(U=\{u^1,\cdots,u^{j-1},u^{j+1},\cdots,u^n\}\),
    then the set \(U\) also spans \((V,F)\).


    2. If at least one vector of \(S\) is nonzero, then there exists a subset \(W\)
    of \(S\) that is linearly independent and spans \((V,F)\).


