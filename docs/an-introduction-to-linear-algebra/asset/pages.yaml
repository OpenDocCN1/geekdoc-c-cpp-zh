  md: '# Chapter 6


    # Linear Systems (Cont’d)


    We recall that an exact method is an algorithm with a finite and predetermined
    number of steps, at the end of which it provides a solution of the problem. In
    this chapter we shall study some exact methods to find the solution(s) of the
    linear system (5.2). Some of these methods also provide a systematic procedure
    to compute the value of a determinant, and the inverse of a given matrix.


    **Cramer’s rule.** Suppose $m=n$ and the matrix $A$ is nonsingular so that $A^{-1}$
    exists. Then, from Theorems 5.11 and 4.5, and the relations (3.1)–(3.3), it follows
    that


    $$x=A^{-1}b=\frac{\operatorname{Adj}A}{|A|}b=\frac{(\alpha_{ij})b}{|A|}=\frac{1}{|A|}(|A_1|,|A_2|,\ldots,|A_n|)^t.
    \tag{6.1}$$


    where


    $$|A_i|=\sum_{j=1}^{n}\alpha_{ij}b_j=\left|\begin{array}{cccccc}a_{11}&\cdots&a_{1,i-1}&b_1&a_{1,i+1}&\cdots&a_{1n}\\
    \vdots&&\vdots&\vdots&\vdots&&\vdots\\ a_{n1}&\cdots&a_{n,i-1}&b_n&a_{n,i+1}&\cdots&a_{nn}\end{array}\right|$$


    are the determinants obtained from the determinant $|A|$ by replacing its $i$-th
    column by the column of constant terms. From (6.1) it follows that


    $$x_1=\frac{|A_1|}{|A|},\quad x_2=\frac{|A_2|}{|A|},\ldots,\quad x_n=\frac{|A_n|}{|A|}.
    \tag{6.2}$$


    Thus to solve the system (5.2) with $m=n$ by Cramer’s rule we need to evaluate
    $(n+1)$ determinants of order $n$, which is quite a laborious operation, especially
    when the number $n$ is large. For example, for $n=10$ we require 359,251,210 multiplications
    and divisions if the usual method of expansion of determinants in terms of minors
    is used. However, Cramer’s rule is of theoretical interest.


    **Example 6.1.** To apply Cramer’s rule for the system


    $$Ax=\begin{pmatrix}2&-1&1\\3&2&-5\\1&3&-2\end{pmatrix}\begin{pmatrix}x_1\\x_2\\x_3\end{pmatrix}=\begin{array}{rcl}2x_1-x_2+x_3&=&0\\3x_1+2x_2-5x_3&=&1\\x_1+3x_2-2x_3&=&4\end{array}
    \tag{6.3}$$'
