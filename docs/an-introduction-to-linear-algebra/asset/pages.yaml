    and \( u \) is the corresponding eigenvector. Thus, from Problem 16.1(ii) and
    (iii), we find


    \(\det e^A = \prod_{i=1}^n e^{\lambda_i} = e^{\lambda_1 + \cdots + \lambda_n}
    = e^{\text{Tr } A} \neq 0\)


    (this identity in fact holds for an any \( n \times n \) matrix), and hence the
    matrix \( e^A \) is nonsingular, and therefore diagonalizable.


    Summarizing the above considerations, we find that if \( A \) is diagonalizable,
    then a diagonalization of \( e^{Ax} \) is \( PD(x)P^{-1} \), and hence (20.7)
    can be written as


    \(\phi(x) = e^{Ax}w.\) (20.9)


    We also note that, since \( u^0 = u(x_0) = e^{Ax_0}w \) gives \( w = e^{-Ax_0}u^0
    \), the solution of (20.1), (20.2) can be written as


    \(\phi(x) = e^{Ax}e^{-Ax_0}u^0 = e^{A(x-x_0)}u^0.\) (20.10)


    Now we claim that for any \( n \times n \) matrix \( A \), \( \Phi(x) = e^{Ax}
    \) is a fundamental matrix solution of (20.1). For this, it suffices to note that


    \(\Phi''(x) = Ae^{Ax} = A\Phi(x) \quad \text{and} \quad \Phi(0) = e^{A0} = I.\)


    Thus, (20.9) is not restricted to diagonalizable matrices only, but rather provides
    the general solution of (20.1) for any \( n \times n \) matrix \( A \). However,
    when the matrix \( A \) is not diagonalizable, the computation of \( e^{Ax} \)
    is not straightforward. Among the several known methods to compute \( e^{Ax} \),
    the following seems to be the easiest and most popular.


    **Theorem 20.2 (Putzer’s algorithm).** Let \( \lambda_1, \cdots, \lambda_n \)
    be the eigenvalues of the matrix \( A \), which are arranged in some arbitrary
    but specified order. Then,


    \( e^{Ax} = \sum_{j=0}^{n-1} r_{j+1}(x)P_j,\) (20.11)


    where \( P_0 = I \), \( P_j = \prod_{k=1}^j (A - \lambda_k I) \), \( j = 1, \cdots,
    n \) and \( r_1(x), \cdots, r_n(x) \) are recursively given by


    \( r''_1(x) = \lambda_1 r_1(x), \quad r_1(0) = 1 \)

    \( r''_j(x) = \lambda_j r_j(x) + r_{j-1}(x), \quad r_j(0) = 0, \quad j = 2, \cdots,
    n. \)


    (Note that each eigenvalue in the list is repeated according to its multiplicity.
    Further, since the matrices \( (A - \lambda_i I) \) and \( (A - \lambda_j I) \)
    commute, we can for convenience adopt the convention that \( (A - \lambda_j I)
    \) follows \( (A - \lambda_i I) \) if \( i > j \).)


    **Proof.** It suffices to show that \( \Phi(x) \) defined by \( \Phi(x) = \sum_{j=0}^{n-1}
    r_{j+1}(x)P_j \)'
