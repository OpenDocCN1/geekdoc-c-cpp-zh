    Now we shall apply Moore–Penrose inverse to least squares solutions of the \(m
    \times n\) linear system (5.2). For this, we recall that Theorem 21.1 assures
    the existence of a unique least squares solution (21.3) provided \(A\) is a full
    column matrix, i.e., \(r(A) = n\). This unique solution in view of Theorem 24.2
    can be written as


    \(\hat{x} = A^+b.\) (24.7)


    Theorem 21.1 also says that if the columns of \(A\) are linearly dependent, i.e.,
    \(r(A) \neq n\), then there are an infinite number of least squares solutions.
    However, since for each \(m \times n\) matrix \(A\) the Moore–Penrose inverse
    \(A^+\) exists uniquely, the representation (24.7) is meaningful and provides
    \(\hat{x}\) uniquely. Further, in view of Theorem 24.3(i), \(A^+b \in R(A)\).
    In the following result, we shall show that (24.7) is, in fact, the unique least
    squares solution of the system (5.2) even when \(r(A) \neq n\).


    # **Theorem 24.4.** For each \(m \times n\) matrix \(A\) and \(b \in R^m\), the
    system (5.2) has a unique least squares solution given by (24.7).


    # **Proof.** From our above discussion and Theorem 21.1 it suffices to show that
    \(\hat{x} = A^+b\) satisfies the normal equations (21.2), i.e., \(A^tA\hat{x}
    = A^tb\). For this, from (19.2) and (24.3), we have


    \(\begin{aligned} (A^tA)A^+b &= (V_1D_{rr}U_1^tU_1D_{rr}V_1^t)(V_1D_{rr}^{-1}U_1^tb)
    \\ &= V_1D_{rr}(U_1^tU_1)D_{rr}(V_1^tV_1)D_{rr}^{-1}U_1^tb \\ &= V_1D_{rr}U_1^tb
    = A^tb,\end{aligned}\)


    i.e., \(A^+b\) is a solution of the normal equations (21.2). \(\blacksquare\)


