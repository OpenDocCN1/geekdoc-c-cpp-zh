    matrices. Show that if \(A \ge B\), i.e., \(a_{ij} \ge b_{ij}\), \(1 \le i, j
    \le n\), then \(A^{-1} \le B^{-1}\).


    **25.9.** Use Theorem 25.6 to show that the following matrices are monotone

    \(A = \begin{pmatrix} 2 & 2 & -3 \\ -3 & 2 & 2 \\ 2 & -3 & 2 \end{pmatrix}, \quad
    B = \begin{pmatrix} 28 & -7 & 1 \\ -42 & -28 & 70 \\ 14 & 35 & -27 \end{pmatrix}.\)


