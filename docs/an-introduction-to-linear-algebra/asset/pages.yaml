    Find the values of $\lambda$ and $\mu$ so that the system


    $$\begin{aligned}

    2x_1+3x_2+5x_3&=9\\

    7x_1+3x_2-2x_3&=8\\

    2x_1+3x_2+\lambda x_3&=\mu

    \end{aligned}$$


    has (i) no solution, (ii) a unique solution, and (iii) an infinite number of solutions.


    # 5.11.


    Use row operations to reduce the following matrices to echelon (row canonical)
    form and find their ranks


    +   (i) $\begin{pmatrix}1&3&2\\1&4&2\\2&6&5\end{pmatrix}$,  (ii) $\begin{pmatrix}0&1&-3&-1\\1&0&1&1\\3&1&0&2\\1&-2&2&0\end{pmatrix}$,  (iii)
    $\begin{pmatrix}1&-2&1\\-2&5&-3\\3&-6&3\\1&-2&2\end{pmatrix}$.


    # Answers or Hints


    +   **5.1.** Assume that $BA=I$. If $A$ is invertible, then we can multiply this
    equation on the right by $A^{-1}$ to get $B=A^{-1}$, from which it follows that
    $B^{-1}=(A^{-1})^{-1}=A$. This shows that $B$ is invertible, and that $A$ and
    $B$ are inverses of one another. To show that $A$ is invertible, in view of Corollary
    5.1 it suffices to show that the homogeneous system (5.3) with $m=n$ has only
    the trivial solution. For this, if $u$ is any solution of (5.3), then $BA=I$ implies
    that $u=Iu=(BA)u=B(Au)=B0=0$. The same argument holds when $AB=I$.


    +   **5.2.** Let $C_1,\cdots,C_n\in\mathbb{R}^m$ be the columns of $A$. Then (5.2)
    is equivalent to $C_1x_1+\cdots+C_nx_n=b$.


    +   **5.3.** The vector $v$ is in $\operatorname{Span}\{u^1,\cdots,u^m\}$ if and
    only if there exist scalars $x_1,\cdots,x_m$ such that $x_1u^1+\cdots+x_mu^m=v$.


    +   **5.4.** For $b=0$ the system (5.2) is always consistent.


    +   **5.5.** Let $C_1,\cdots,C_n\in\mathbb{R}^{n+1}$ be the columns of $A$. Then
    $b-C_1x_1-\cdots-C_nx_n=0$. Hence, $\det(A|b)=\det(A|0)=0$. Consider the system
    $x+y=1,\ 2x+2y=3,\ 3x+3y=7$. Let $x_1,\cdots,x_n$ be a nontrivial solution of
    (5.3). We can assume $x_n\ne0$. Then the system $a_i( x_1/x_n)+\cdots+a_{i,n-1}(x_{n-1}/x_n)+a_{i,n}=0$,
    $i=1,\cdots,n$ is consistent.


    +   **5.6.** Let $v\in\mathcal{N}(A)$. Then $A(u^0+v)=Au^0+Av=b+0=b$. Thus $u^0+v$
    is a solution of (5.2). Now suppose that $u$ is a solution of (5.2), then $A(u-u^0)=Au-Au^0=b-b=0$.
    Thus $u-u^0\in\mathcal{N}(A)$. Since $u=u^0+(u-u^0)$, we find that any solution
    of (5.2) can be obtained by adding a solution of (5.3) to a fixed solution of
    (5.2).


    +   **5.7.** Reduce $A$ to its row canonical form, and then if necessary use elementary
    column operations.


    +   **5.8.** Use the definitions of equivalence and transpose of matrices.'
