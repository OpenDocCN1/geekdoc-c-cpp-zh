    # **Remark 17.3.** Let \(A\) be a hermitian matrix with (real) eigenvalues \(\lambda_1,
    \cdots, \lambda_n\). Define \(\lambda = \min\{\lambda_1, \cdots, \lambda_n\}\)
    and \(\Lambda = \max\{\lambda_1, \cdots, \lambda_n\}\). Then, for any nonzero
    vector \(u \in C^m\), the following inequality holds:


    \(\lambda \leq \frac{(Au, u)}{(u, u)} \leq \Lambda.\) \(\text{(17.10)}\)


    Further, \(\lambda = \min_{\|u\|=1}(Au, u)\) and \(\Lambda = \max_{\|u\|=1}(Au,
    u)\). The expression \((Au, u)/(u, u)\) is called the _Rayleigh quotient_.


    A sequence of vectors \(\{u^m\}\) in a normed linear space \(V\) is said to converge
    to \(u \in V\) if and only if \(\|u - u^m\| \rightarrow 0\) as \(m \rightarrow
    \infty\). A sequence of matrices \(\{A^{(m)}\}\) with elements \((a_{ij}^{(m)})\)
    is said to converge to \(A = (a_{ij})\) if and only if \(a_{ij} = \lim_{m \rightarrow
    \infty} a_{ij}^{(m)}\). Further, the series \(\sum_{m=1}^\infty A^{(m)}\) is convergent
    if and only if the sequence of its partial sums, i.e., \(\{\sum_{m=1}^k A^{(m)}\}\),
    converges.


    In a normed linear space \(V\), norms \(\|\cdot\|\) and \(\|\cdot\|_*\) are said
    to be _equivalent_ if there exist positive constants \(m\) and \(M\) such that
    for all \(u \in V\), \(m\|u\| \leq \|u\|_* \leq M\|u\|\). It is well known (see
    Problem 17.7) that in a finite dimensional normed linear space all the norms are
    equivalent. Thus, if a sequence \(\{u^m\}\) converges in one norm then it converges
    in all the norms.


    # **Theorem 17.4.** For a given square matrix \(A\), \(\lim_{m \rightarrow \infty}
    A^m = 0\) if \(\|A\| < 1\).


    # **Proof.** Since \(\|A^m\| \leq \|A\|^m\) and the norm is continuous (see Problem
    17.2), it follows that \(\|\lim_{m \rightarrow \infty} A^m\| \leq \lim_{m \rightarrow
    \infty} \|A\|^m = 0\). \(\blacksquare\)


    # **Theorem 17.5.** For a given square matrix \(A\), \((I - A)^{-1}\) exists if
    \(\|A\| < 1\). Further,


    \(I + A + A^2 + \cdots = \sum_{m=0}^\infty A^m = (I - A)^{-1}.\) \(\text{(17.11)}\)


    # **Proof.** Since


    \(\|(I - A)x\| = \|x - Ax\| \geq \|x\| - \|Ax\| \geq \|x\| - \|A\|\|x\| = (1 -
    \|A\|)\|x\|,\)


    \((I - A)x \neq 0\) for an arbitrary \(x \neq 0\), which implies that \((I - A)\)
