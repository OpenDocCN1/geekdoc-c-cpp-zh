  \ UI，但登录（Log In）和重置（Reset）按钮还没有功能，因为我们还没有添加任何处理它们的逻辑。\n\n12. 首先，我们将更新 `www/index.js`\
  \ 文件，为 `login` 和 `reset` 按钮添加点击事件。我们定义了两个函数 `click_login` 和 `click_reset`，分别对应登录和重置按钮，如下代码所示：\n\
  \n```javascript\ndocument.getElementById('btn_login').addEventListener('click',\
  \ ev => click_login());\ndocument.getElementById('btn_reset').addEventListener('click',\
  \ ev => click_reset());\n```\n\n在 `click_login` 函数中，我们获取用户输入的用户名和密码值，并调用 Rust 源文件\
  \ `wasm-login/src/lib.rs` 中定义的 `login` 函数，该函数使用 `wasm-bindgen` 与 JavaScript 交互。我们本可以在\
