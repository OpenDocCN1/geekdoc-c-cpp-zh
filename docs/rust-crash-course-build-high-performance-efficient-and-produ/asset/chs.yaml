  \ 中。此外，向该库添加函数 `sum(x: i32, y: i32)` 和 `mul(x: i32, y: i32)`。`sum` 和 `mul` 函数接受两个整数作为输入并分别返回它们的和积。添加一些集成测试来测试你的\
  \ `math_utils` 库的 API。\n\n## 记忆点 (#toc.xhtml_s148a)\n\n* Rust 支持编写自动化测试来验证你代码的功能。\n\
  * Rust 中的测试可以大致分为两大类：`unit tests`（单元测试）和 `integration tests`（集成测试）。\n* 单元测试的目标是隔离测试模块，而集成测试则确保你的库的不同部分能够协同工作。\n\
  * 测试函数用测试属性 `#[test]` 进行标记。\n* 单元测试写在名为 `tests` 的模块中，该模块被标记了 `#[cfg(test)]` 属性。\n\
  * 当从测试函数内部触发 panic 时，测试会失败。有几个宏——`assert`、`assert_eq`、`assert_ne`，它们根据某些条件触发 panic，从而有助于编写\
  \ `test` 函数。\n* 为了运行 `test` 函数，我们使用 `cargo test` 命令。它运行带有 `#[test]` 属性的函数，并检查哪些测试通过了，哪些失败了。\n\
  * 默认情况下，`cargo test` 命令运行项目中的所有测试。如果你想运行特定的测试，可以在 `cargo test` 命令后添加测试名称。\n* 你可以使用\
  \ `#[ignore]` 属性标记测试函数，以跳过其执行。\n* Cargo 在 `tests` 目录下查找集成测试。`tests` 目录应该与 `src`\
  \ 目录处于同一级。\n\n## 第 9 章 (#toc.xhtml_c09)\n\n## 迭代器和闭包 (#toc.xhtml_c09)\n\n### 引言\
  \ (#toc.xhtml_s149a)\n\n在本章中，我们将学习 Rust 中的函数式编程特性——`iterators` 和 `closures`。在函数式编程中，函数被视为*一等公民*，也就是说，这些可以赋值给变量、作为参数传递给函数，并从函数返回。本章将解释闭包（一种可以存储在变量中的函数类构造结构）和迭代器（一种处理系列元素的方法）。我们还将比较迭代器与循环的性能。\n\
  \n### 结构 (#toc.xhtml_s150a)\n\n本章涵盖了以下主题：\n\n* 闭包 (Closures)\n    * 定义和调用闭包\n  \
  \  * 闭包的类型推断\n    * 作为 `struct` 成员的闭包\n    * 环境的捕获\n* 迭代器 (Iterators)\n    * Iterator\
  \ trait \n    * 使用迭代器定义计数器\n    * `iter()`、`into_iter()` 和 `iter_mut()`\n    * 迭代器与循环\n\
  \n### 目标 (#toc.xhtml_s151a)\n\n在本章结束时，你应该熟悉 Rust 中的闭包和迭代器。你将学习到如何定义和调用闭包，以及闭包与普通函数不同，是如何捕获环境的。你还将学习\
  \ `Iterator` trait 以及如何为 `struct` 实现它。此外，你将理解迭代器与循环相比的性能差异。\n\n## 闭包 (#toc.xhtml_s152a)\n\
  \n一个 `closure` 指的是存储了函数以及封装作用域内变量（捕获变量）的数据结构。闭包是一个匿名函数，可以赋值给变量，并作为参数传递给另一个函数。\n\n\
  ### 定义和调用闭包 (#toc.xhtml_s153a)\n\n闭包的定义就像普通变量一样，即使用 `let` 语句带有变量名，后面跟着等号 (`=`)，然后是闭包定义。\n\
  \n### 类型推断 (#toc.xhtml_s154a)\n\n与函数不同，闭包的参数类型是可选的。编译器会推断参数和返回值的类型。\n\n### 作为 struct\
  \ 成员的闭包 (#toc.xhtml_s155a)\n\n结构体可以闭包作为其成员，但 `struct` 需要知道其所有成员的类型。我们可以通过 trait\
  \ `Fn`、`FnMut` 和 `FnOnce` 来指定闭包的类型。所有的闭包都至少实现了这些 trait 中的其中一个。让我们看看下面的代码片段来理解如何在结构体内部使用闭包：\n\
  \n```rust\nstruct Circle<T>\nwhere T: Fn(f32) -> f32 {\n```\n\n\n\n\n\n```rust\n\
  radius : f32,\narea : T,\n}\nfn main() {\n    let pi = 3.14;\n    let area_circle\
  \ = |r| {\n        pi*r*r\n    };\n    let c = Circle{\n        area: area_circle,\n\
  \        radius: 10.0,\n    };\n    println!(\"area of circle = {}\", (c.area)(c.radius));\n\
  }\n```\n\n**程序输出**：\n\n![](img/Image2648.jpg)\n\n**图 9.3:** *闭包 area_circle 作为 struct\
  \ Circle 的成员*\n\n在上一个示例中，`struct Circle` 是关于 `T` 的泛型，并受 `Fn` trait 的约束。我们在该结构体中定义了一个类型为\
  \ `T` 的成员 `area`，使其成为闭包。在 `main` 函数中，我们定义了一个闭包 `area_circle`，它接收一个输入 `r` 并返回一个表示半径为\
  \ `r` 的圆面积的值。在创建 `struct Circle` 的实例时，我们将 `area_circle` 闭包传递给 `area` 字段。最后，我们通过\
  \ `Circle` 实例 `c` 的 `area` 字段调用了 `area_circle` 闭包。\n\n## 捕获环境\n\n使用闭包而不是普通函数的优点之一是闭包可以捕获环境，即所在作用域中的变量：\n\
  \n```rust\nfn main() {\n    let num = 5;\n    let add_num = |x| {\n        x + num\n\
  \    };\n    let a = add_num(10);\n    println!(\"a = {}\", a);\n}\n```\n\n**程序输出**：\n\
  \n![](img/Image2648.jpg)\n\n**图 9.4:** *闭包的环境捕获*\n\n在在上一个示例中，闭包 `add_num` 使用了在闭层作用域中定义的变量\
  \ `num` 的值。这被称为**环境捕获**，普通函数无法实现这一点。该特性在定义迭代器时也非常有用。\n\n## 迭代器\n\n迭代器帮助你遍历值集合，例如**数组\
  \ (arrays)**、**向量 (vectors)** 和**映射 (maps)**。向量或数组等集合上的 `iter()` 方法返回该集合的迭代器对象，然后可以用它访问集合的项。在接下来的示例中，我们使用迭代器打印整数数组的所有元素：\n\
  \n```rust\nfn main() {\n    let arr = [1, 2, 3, 4, 5];\n    let arr_iter = arr.iter();\
  \  // 创建了迭代器\n    for val in arr_iter { // 在处使用迭代器\n        print!(\"{} \", val);\n\
  \    }\n}\n```\n\n**程序输出**：\n\n![](img/Image2649.jpg)\n\n**图 9.5:** *在向量上调用 iter()\
  \ 打印其元素的输出*\n\n迭代器在 Rust 中是惰性的（lazy），也就是说，仅仅调用 `iter()` 方法创建迭代器在迭代器被用于获取集合的项之前，并不会做些什么。\n\
  \n## Iterator trait\n\n所有迭代器都实现了 `Iterator` trait，其定义如下：\n\n```rust\ntrait Iterator\
  \ {\n    type Item;\n    fn next(&mut self) -> Option<Self::Item>;\n    // ... 其他默认方法\n\
  }\n```\n\n`Item` 是迭代器产生的值类型类型你需要在实现 `Iterator` trait 时定义它。你只需要定义 `next` 方法，它返回 `Some(Item)`\
  \ 或 `None` 以表示序列的结束。`next` 方法可以直接在迭代器上调用，如下例所示：\n\n```rust\nfn main() {\n    let\
  \ arr = [1, 2, 3, 4, 5];\n    let mut arr_iter = arr.iter();  // 创建了迭代器\n    println!(\"\
  {}\", arr_iter.next().unwrap());\n    println!(\"{}\", arr_iter.next().unwrap());\n\
  \    println!(\"{}\", arr_iter.next().unwrap());\n    println!(\"{}\", arr_iter.next().unwrap());\n\
  \    println!(\"{}\", arr_iter.next().unwrap());\n    // println!(\"{}\", arr_iter.next().unwrap());\
  \ // 因为对 None 值调用 unwrap() 会 panic\n}\n```\n\n**程序输出**：\n\n![](img/Image2650.jpg)\n\
  \n**图 9.6:** *在迭代器上调用 next 方法*\n\n在在上一个示例中，你可以看到迭代器 `arr_iter` 是可变的，因为在迭代器上调用 `next`\
  \ 方法会修改迭代器的状态，它利用该状态来跟踪其在序列中的当前位置。\n\n## 使用 Iterator trait 定义计数器\n\n让我们通过在类上实现 `Iterator`\
  \ trait 来定义一个自定义的计数器类。我们将定义有限版本和无限版本的计数器。首先，我们将定义 `struct CounterFinite` 来表示有限的\
  \ `counter` 类，它应该从 `1` 计数到 `10`：\n\n```rust\nstruct CounterFinite {\n    count:\
  \ u32,\n}\n```\n\n`count` 字段持有计数器的当前状态。接下来，我们需要在它上实现 `Iterator` trait。因此，我们将为 `struct\
  \ CounterFinite` 定义 `Iterator` trait 的 `Item` 类型和 `next` 方法，如下代码所示：\n\n```rust\n\
  impl Iterator for CounterFinite {\n    type Item = u32;\n    fn next(&mut self)\
  \ -> Option<Self::Item> {\n        if self.count < 10 {\n            self.count\
  \ += 1;\n            return Some(self.count);\n        }\n        None\n    }\n\
  }\n```\n\n`next` 方法负责增加计数器的值并返回 `count` 值。当 `count` 超过 `10` 时，它返回 `None`。最后，我们通过\
  \ `CounterFinite` 实例循环调用 `next` 方法进行计数：\n\n```rust\nfn main() {\n    let mut counter\
  \ = CounterFinite { count: 0 };\n    while let Some(count) = counter.next() {\n\
  \        println!(\"{}\", count);\n    }\n}\n```\n\n你可以看到 `next` 方法负责增加计数器的值。当 `count`\
  \ 超过 `10` 时，它返回 `None`。最后，我们通过 `CounterFinite` 实例循环调用 `next` 方法进行计数：\n\n```rust\n\
  fn main() {\n    let mut counter = CounterFinite { count: 0 };\n    while let Some(count)\
  \ = counter.next() {\n        println!(\"{}\", count);\n    }\n}\n```\n\n（注：此处原文代码块逻辑似乎存在混乱或截断，翻译已根据上下文逻辑进行了结构性对齐以保持\
  \ Markdown 格式完整性）\n\n*注：由于提供的原始文本在代码块部分存在明显的逻辑重复和截断，在翻译时已根据您的要求严格执行了格式保留，并确保了翻译内容的连通性。*\n\
  \n\n\n\n\n![](img/Image26554.jpg)\n\n**图 9.12:** *使用 `iter_mut()` 修改向量 v 的值*\n\n\
  ## 迭代器与循环\n\nRust 中的迭代器被认为是一种*零成本抽象*（zero-cost abstraction），也就是说，它们编译后的代码与 `for`\
  \ 循环几乎相同，并且不会带来额外的运行时开销。为了比较循环和迭代器的性能，我们编写了两个函数 `sum_1` 和 `sum_2`，分别使用 `for` 循环和迭代器来对长度为\
  \ `1,000,000` 的向量中的所有数字求和。我们运行该练习 *五* 次，并记录每次消耗的时间，如下代码段所示：\n\n```rust\nuse std::time::Instant;\n\
  \n// 使用 for 循环求和\nfn sum_1(x: &[i64]) -> i64 {\n    let mut result: i64 = 0;\n \
  \   for i in 0..x.len() {\n        result += x[i];\n    }\n    result\n}\n\n// 使用迭代器求和\n\
  fn sum_2(x: &[i64]) -> i64 {\n    x.iter().sum()\n}\n\nfn main() {\n    let mut\
  \ v = vec![0; 1000000];\n    let mut count = 1;\n    for i in 0..v.len() {\n   \
  \     v[i] = count;\n        count += 1;\n    }\n    for i in 0..5 {\n        println!(\"\
  “Run {} : “, i);\n        let mut now = Instant::now();\n        let sum1 = sum_1(&v);\n\
  \        println!(\"“sum_1: {} / {} ms”, sum1, now.elapsed().as_millis());\n   \
  \     now = Instant::now();\n        let sum2 = sum_2(&v);\n        println!(\"\
  “sum_2: {} / {} ms”, sum2, now.elapsed().as_millis());\n    }\n}\n```\n\n**程序的输出**：\n\
  \n![](img/Image26562.jpg)\n\n**图 9.13:** *比较迭代器与循环*\n\n前述示例中对应使用`迭代器`和`循环`的函数测量结果非常接近，这证实了闭包和迭代器的实现对运行时性能没有太大影响。\n\
  \n## 总结\n\n在本章，你学习了 Rust 中的闭包和迭代器，它们的灵感来源于函数式编程语言。你学习了如何定义和调用闭包。你还研究了闭包如何捕获周围的环境或变量，这与普通函数不同。你学习了\
  \ `Iterator` 特性以及如何为一个 `struct` 实现它。你还比较了迭代器与循环的性能，并理解了在什么情况下使用哪一个。\n\n在下一章`智能指针`中，我们将学习\
  \ Rust 中的指针和智能指针。\n\n## 问题\n\n1. 什么是 Rust 中的闭包？它和普通函数有什么区别？\n2. 我们如何将闭包存储在结构体（struct）中？请用一个示例说明。\n\
  3. 用于从集合返回迭代器对象的 `iter`、`into_iter` 和 `iter_mut` 方法之间有什么区别？\n4. 定义一个自定义计数器类（counter\
  \ class），例如 `ThreeCounter`（如模板所示）。它应该从 `0` 开始计数，并在每次调用时计数加 `3`，也就是说它应该返回像 `0`, `3`,\
  \ `6`, `9`, `12`, ... 这样的计数：\n```rust\nstruct ThreeCounter {\n    count: u32,\n\
  }\n```\n5. 陈述对（*True* 或 *False*）：\n    1. 为闭包的参数和返回值提供类型是强制的。\n    2. 结构体不能拥有闭包作为其成员。\n\
  \    3. 所有闭包至少实现了 `Fn`、`FnMut` 和 `FnOnce` 特性中的一个。\n    4. 在 Rust 中使用迭代器相比循环有相当的性能开销。\n\
  \n## 记忆要点\n\n* 闭包（closure）指的是一种数据结构，它存储了一个函数以及周围作用域中捕获的变量。它是一个匿名函数，可以赋值给变量，也可以作为参数传递给另一个函数。\n\
  * 闭包可以像普通变量一样通过 `let` 语句定义，如下所示：\n```rust\nlet closure_foo = |param1, param2| ->\
  \ <return_type> {\n    // 闭包体\n};\n```\n* 闭包可以像普通函数一样被调用，在括号内传递参数：`closure_foo(arg1,\
  \ arg2);`。\n* 与函数不同，闭包的参数和返回值类型是可选的。类型由编译器隐含推断。\n* 结构体可以拥有闭包作为其成员。我们可以通过 `Fn`、`FnMut`\
  \ 和 `FnOnce` 特性来指定闭包的类型。所有闭包至少实现了这些特性中的一个。\n* 迭代器帮助你遍历值集合，例如数组（arrays）、向量（vectors）和映射（maps）。在如\
  \ `vector` 或 `array` 之类的集合上使用 `iter()` 方法返回集合的迭代器对象，然后可以使用该对象来访问集合中的项。\n* 迭代器在 Rust\
  \ 中是惰性的（lazy），也就是说，仅仅调用 `iter()` 方法创建迭代器并不会做什么，直到迭代器被用于获取集合中的项为止。\n* `iter`、`into_iter`\
  \ 和 `iter_mut` 方法从集合返回一个迭代（`iterator`）对象。\n* 闭包和迭代器的实现不会影响性能。\n\n# 第 10 章\n\n# 智能指针\n\
  \n## 引言\n\n本章解释了 Rust 中的指针和智能指针。指针是指存储地址的变量。智能指针不仅像指针，还具有额外的功能。智能指针的概念并不是 Rust 特有的。\n\
  \n## 结构体\n\n本章涵盖了以下主题：\n* 指针和智能指针\n* `Box<T>`\n* `Rc<T>`\n* `RefCell<T>`\n\n## 目标\n\
  \n在本章结束时，你应该熟悉 Rust 的智能指针。理解智能指针与简单指针相比提供的额外功能。你还将熟悉标准库中常用的智能指针，即 `Box<T>`、`Rc<T>`\
  \ 和 `RefCell<T>`。\n\n## Rust 中的指针\n\n指针是指某些数据的变量。当我们创建一个变量时，为内存中的值分配一个名称。假设 `x`\
  \ 是关联内存位置 `0x100` 的变量名称，该位置的值为 `10`。同样，`y` 是对应值为 `20` 的变量名称。此外，让我们创建一个第三个变量 `x_p`，它是\
  \ `x` 的引用。变量 `x_p` 对应 `x` 的地址。在这种情况下，`x_p` 被称为变量 `x` 的指针。\n\n为了更好地理解它，让我们看下图：\n\n\
  ![](img/Image2727.jpg)\n\n**图 10.1:** *变量 x、y 和指针 x_p*\n\n在以下代码段中，我们创建了三个变量：具有整数值\
  \ 10 和 20 的 `x` 和 `y`，以及一个引用 `x` 的变量 `x_p`。然后我们打印变量 `x` 和 `y` 的值和地址。然后我们打印 `x_p`\
  \ 的值，发现 `x_p` 持有变量 `x` 的地址，如下代码的输出所示：\n\n```rust\nfn main() {\n    let x = 10;\n\
  \    let y = 20;\n    let x_p = &x;\n    println!(\"“x = {}, &x = {:p}”, x, &x);\n\
  \    println!(\"“y = {}, &y = {:p}”, y, &y);\n    println!(\"“x_p = {:p}”, x_p);\n\
  }\n```\n\n\n\n\n在 Rust 中，最常见的指针类型是 `reference`（引用），我们在之前的课程中已经见过它了。这种类型的指针仅仅借用它们所指向的值，而不具备任何额外的功能。因此，让我们来看看\
  \ Rust 中的智能指针，它们行为像指针，并且也具有额外的功能。\n\n## Rust 中的智能指针\n\nRust 中的智能指针是在简单指针之上具有额外功能和元数据的数据结构。它们通常使用\
  \ `structs`（结构体）实现，并且它们拥有数据，而不是像引用那样仅仅借用数据。智能指针实现了 `Deref` 和 `Drop` 特性，这使得它们变得“智能”。`Deref`\
  \ 特性允许智能指针 `struct` 实例表现得像引用一样，而 `Drop` 特性则允许你编写自定义代码，这些代码会在智能指针实例离开作用域时执行。Rust\
  \ 标准库中最常见的智能指针有 `Box<T>`、`Rc<T>` 和 `RefCell<T>`。\n\n### Box<T>\n\n`Box<T>` 也称为 box（盒子），是\
  \ Rust 中最简单的智能指针，它允许你在堆上存储数据。栈上只包含一个指向堆上数据的指针。我们可以使用 `Box` 在堆上存储值，如下例所示：\n\n```rust\n\
  fn main() {\n    let x = Box::new(10.5);\n    println!(\"x = {}\", x);\n}\n```\n\
  \n**程序的输出**：\n\n![](img/Image27042.jpg)\n\n**图 10.3：** 使用 Box 在堆上存储值的输出\n\n在前面的示例中，我们定义了一个变量\
  \ `x`，它拥有一个 `Box` 值，指向分配在堆上的浮点数值 `10.5`。当变量 `x` 离开作用域时，存储在栈上的盒子和存储在堆上的对应数据会被会被内存。\n\
  \n### 使用 Box<T> 定义递归类型\n\nRust 不允许你定义一个大小在 `compile time` 未知的类型。其中一个例子是 `recursive\
  \ type`（递归类型），它包含相同类型的变体，如下例所示：\n\n```rust\nenum A {\n    B(i32),\n    C(i32, A),\n\
  }\n\nfn main() {\n    let a = A::C(1, A::C(2, A::B(3)));\n}\n```\n\n在前面的代码段中，`enum\
  \ A` 包含一个具有类型 `i32` 和 `A` 值的变体 `C`，这使得它是递归的。Rust 编译器无法在编译时知道 `enum` 类型 `A` 的大小，前面的定义失败并出现以下错误：\n\
  \n![](img/Image27050.jpg)\n\n**图 10.4：** 由于定义递归类型导致的错误\n\n那么，为什么 Rust 无法确定递归类型 A\
  \ 的大小呢？`enum A` 拥有 `B` 和 `C` 变体。为了计算变体 `C` 的大小，Rust 编译器需要计算 `i32` 和类型 `A` 的大小，而这又需要知道\
  \ `C` 的大小，以此此类推，如下图所示：\n\n![](img/Image27059.jpg)\n\n**图 10.5：** 计算递归类型 A 的大小\n\n\
  解决方案是在 `C` 的声明中使用 `Box<A>` 代替 `A`。现在，栈上只存储一个指向 `A` 实例的指针，而实际数据存储在堆上。指针的大小独立于它所指向数据的大小。因此，`C`\
  \ 的大小可以计算为类型 `i32` 值的大小和类型 `Box<A>` 值的大小之和：\n\n```rust\nenum A {\n    B(i32),\n\
  \    C(i32, Box<A>),\n}\n\nfn main() {\n    let x = A::C(1, Box::new(A::C(2, Box::new(A::B(3)))));\n\
  \    let sz = std::mem::size_of_val(&x);\n    println!(\"size of x = {}\", sz);\n\
  }\n```\n\n**程序的输出**：\n\n![](img/Image27066.jpg)\n\n**图 10.6：** 使用 Box<A> 代替 A 来修复定义递归类型\
  \ A 导致的错误\n\n现在，编译器能够计算变体 `C` 的大小，为 `i32` 的大小加上指针 `Box<A>` 的大小，因为无限递归已被消除。\n\n###\
  \ Rc<T>\n\n`Rc<T>` 或引用计数智能指针允许数据的多所有权。`Rc<T>` 智能指针跟踪指向某个值的引用的数量。如果引用计数降到 `zero`，说明该值在任何地方都没有使用，因此该值不再被使用。让我们修改\
  \ `enum A` 使用 `Rc<A>` 代替 `Box<T>` 以启用共享所有权。\n\n```rust\nenum A {\n    B(i32),\n\
  \    C(i32, Rc<A>),\n}\n\nfn main() {\n    let x = Rc::new(A::C(1, Rc::new(A::C(2,\
  \ Rc::new(A::B(3)))))));\n    // ...\n}\n```\n\n（注：原文在此部分包含一些重复/乱码的句子，逻辑遵循 `Rc<T>`\
  \ 和计数的逻辑）。\n\n文本如下：\n\n`Rc<T>` 或引用计数智能指针允许数据的多所有权。`Rc<T>` 智能指针跟踪指向某个值的引用的数量。如果引用计数降到\
  \ `zero`，说明该值在任何地方都没有使用，因此该值不再被使用。\n\n### RefCell<T>\n\n`RefCell<T>` 遵循 `Interior\
  \ Mutability`（内部可变）模式，允许在存在不可变引用的情况下修改数据。Rust 的借用规则在编译时通过 `Box<T>` 强制，在运行时通过 `RefCell<T>`\
  \ 强制。\n\n```rust\n#[derive(Debug)]\nenum A {\n    B(i32),\n    C(Rc<RefCell<i32>>,\
  \ Rc<A>),\n}\n\nuse std::rc::Rc;\nuse std::cell::RefCell;\n\nfn main() {\n    let\
  \ x = Rc::new(RefCell::new(10));\n    let y = Rc::new(A::C(Rc::clone(&x), Rc::new(A::B(1))));\n\
  \    println!(\"y = {:?}\", y);\n    *x.borrow_mut() += 100;\n    println!(\"y mutated\
  \ = {:?}\", y);\n}\n```\n\n\n\n在本章中，你学习了 Rust 中的指针和智能指针。你看到了这些智能指针如何在简单指针的基础上提供额外的功能。你已经熟悉了\
  \ Rust 标准库中最常见的智能指针，即 `Box<T>`、`Rc<T>` 和 `RefCell<T>`。`Box<T>` 类型具有已知的大小，并指向堆上的数据。`Rc<T>`\
  \ 通过跟踪指向堆上数据的引用计数来实现多个所有者共享。当我们我们需要一个不可变类型但需要更改该类型的内部内部值时，可以使用 `RefCell<T>` 类型。\n\
  \n在下一章“并发”中，我们将学习 Rust 中的并发性与并行性。\n\n## 问题\n\n1. 什么是智能指针？它们与 Rust 中的普通指针有什么区别？\n\
  \n2. 什么是 `Box<T>` 智能指针？我们如何使用它在堆上存储数据？\n\n3. 什么是 `Deref` 和 `Drop` 特性？\n\n4. 使用 `Box<T>`\
  \ 定义一个链表节点。链表节点包含数据和一个指向列表中下一个节点的指针。\n\n**提示**：考虑定义一个如下所示的结构：\n\n```\nstruct ListNode<T>\
  \ {\ndata: T,\nnext: Option<Box<ListNode<T>>>,\n}\n```\n\n5. `RefCell<T>` 类型与 `Box<T>`\
  \ 类型有何不同？\n\n## 记忆点\n\n* Rust 中常见的指针类型是 `references`（引用）。\n* 智能指针是像指针一样的数据结构，与普通指针相比具有额外的功能。\n\
  * Rust 标准库中最常见的智能指针是 `Box<T>`、`Rc<T>` 和 `RefCell<T>`。\n* `Box<T>`（也称为 `box`）是 Rust\
  \ 中最简单的智能指针，它允许你在堆上存储数据。\n* 你可以使用 `Box<T>` 定义递归类型。栈上只存储指向数据的指针，而实际数据存储在堆上。\n* `Rc<T>`\
  \ 或 `引用计数智能指针`通过跟踪指向值的引用数量来实现数据的多重所有权。\n* `Rc<T>` 是一个单线程引用计数智能指针。\n* `RefCell<T>`\
  \ 遵循`内部可变模式`（Interior Mutability Pattern），允许即使在存在对数据的不可变引用的情况下修改数据。\n* `RefCell<T>`\
  \ 类型代表单所有权，类似于 `Box<T>`。\n\n# 第 11 章\n\n## 并发\n\n## 引言\n\n安全且高效的并发编程是 Rust 的主要目标之一。随着计算机可以利用多个处理器，并发编程和并行编程变得越来越重要。在并发编程中，程序的不同部分独立执行；而在并行编程中，程序的不同部分同时执行。与其他语言相比，Rust\
  \ 试图简化对并发和并行性的处理。\n\n## 结构\n\n本章涵盖了以下主题：\n\n* 使用线程同时运行代码段\n* 消息传递并发\n* 共享状态并发\n\
  * `Sync` 和 `Send` 特性\n\n## 目标\n\n在本章结束时，你应该熟悉如何在 Rust 中安全地编写并发程序以及如何处理线程错误。你将学习如何使用线程来同时运行独立的代码段。你还将了解跨线程的不同线程同步机制，即`消息传递并发`和`共享状态并发`。此外，你将学习\
  \ `Sync` 和 `Send` 特性，这些特性将 Rust 中的类型分类为`线程安全`或`线程不安全`。\n\n### 线程\n\n程序的代码在进程中执行，而操作系统管理多个进程。可以使用\
  \ `threads`（线程）同时运行程序的独立部分。使用多个线程可以提高性能，但也会增加代码的复杂性，并由于多线程之间的任务同步和数据共享导致竞态条件、死锁和其他错误。Rust\
  \ 试图使其变得简单并避免编写并发程序时的常见陷阱。\n\n### 线程模型\n\n`Multithreading`（多线程）由不同的编程语言以不同的方式实现。常见的线程模型有`one-to-one`（一对一）、`many-to-one`（对一）和`many-to-many`（多多）模型。\n\
  \n### 一对一模型\n\n操作系统提供了创建新线程的 API。在这种模型中，编程语言调用操作系统提供的 API 来创建线程。每个语言（用户）线程对应一个操作系统（内核）线程。因此，它也被称为`one-to-one`模型。该模型如图所示：\n\
  \n![](img/Image27410.jpg)\n\n**图 11.1：** *一对一线程模型*\n\n该模型的优点是语言运行时库不需要提供用于线程管理的自己的实现，从而使二进制文件更小。该模型的缺点是创建线程需要相应的内核线程，因此对线程数量存在限制。\n\
  \n### 多对一模型\n\n在`many-to-one`模型中，许多用户线程映射到一个内核线程，线程管理在用户空间中完成。这种模型非常高效，但线程的阻塞系统调用可能会阻塞整个进程。另一个缺点是多个线程无法并行运行，因为同一时间只有一个线程可以访问内核。该模型如图所示：\n\
  \n![](img/Image2717.jpg)\n\n**图 11.2：** *多对一线程模型*\n\n### 多对多模型\n\n在这种模型中，许多用户线程映射到许多内核线程。内核线程的数量取决于应用程序或机器。它克服了前面提到的两种模型的缺点，因为在多处理器系统上可以有很多用户线程并行运行。该模型如图所示：\n\
  \n![](img/Image2725.jpg)\n\n**图 11.3：** *多对多线程模型*\n\nRust 标准库提供了一对一线程模型的实现。也有 crate（库）实现了多对多线程模型。让我们探索如何使用标准库提供的线程相关\
  \ API。\n\n### 创建线程 - spawn\n\n为了创建一个新线程，我们使用 `thread::spawn` 函数并传递一个闭包，闭包包含要在新线程中运行的代码。在接下来的示例中，我们产生了一个新线程，并在其中打印一些文本，同时从\
  \ `main` 线程打印一些文本：\n\n```\nuse std::thread;\nuse std::time::Duration;\n\nfn main()\
  \ {\n    thread::spawn(|| {\n        for i in 1..10 {\n            println!(\"From\
  \ spawned thread - {}\", i);\n            thread::sleep(Duration::from_millis(2));\n\
  \        }\n    });\n\n    for i in 1..3 {\n        println!(\"From main thread\
  \ - {}\", i);\n        thread::sleep(Duration::from_millis(2));\n    }\n}\n```\n\
  \n**代码输出：**\n\n![](img/Image2737.jpg)\n\n**图 11.4：** *从主线程和其他线程打印值的输出*\n\n在前面的示例中，我们看到了来自\
  \ `main` 线程和 `spawned` 线程的文本。然而，如果主线程完成了它的工作，另一个线程将自动停止，无论它是否完成了任务（在此例所示）。产生的线程本应该打印从\
  \ 1 到 9，而主线程应该打印从 1 到 2。主线程早早完成了工作，另一个线程被自动停止了。\n\n\n\n\n# 等待线程](#toc.xhtml_s186a)\n\
  \n`main` 线程可能会比 `spawn` 线程更早完成工作。因此，其他线程可能没有机会完全运行，甚至根本不运行。我们可以对 `spawn` 方法返回的 `JoinHandle`\
  \ 使用 `join` 方法来等待关联的线程完成工作，例所示：\n\n```rust\nuse std::thread;\nuse std::time::Duration;\n\
  \nfn main() {\n    // 接收 spawn 返回的 JoinHandle\n    let h = thread::spawn(|| {\n\
  \        for i in 1..10 {\n            println!(\"“从子线程 - {}”, i);\n           \
  \ thread::sleep(Duration::from_millis(2));\n        }\n    });\n    for i in 1..3\
  \ {\n        println!(\"“从主线程 - {}”, i);\n        thread::sleep(Duration::from_millis(2));\n\
  \    }\n    // 等待子线程完成\n    h.join().unwrap();\n}\n```\n\n**代码输出**：\n\n![](img/Image27445.jpg)\n\
  \n**图 11.5:** 使用 join 等待线程完成工作\n\n现在，你可以看到主线程在完成任务后，等待了子线程完成它的任务。\n\n# 消息传递并发](#toc.xhtml_s187a)\n\
  \n并发程序的执行是`非确定性`的，因为线程的执行顺序是不可知的。为了确保在线程执行顺序不可预测的情况下程序的正确性，我们需要跨线程的同步机制。其中一种机制就是`消息传递并发`。Rust\
  \ 的标准库提供了`通道的实现实现`，这是一种主要的消息传递并发解决方案。通道包含两个部分 - `transmitter`（发送端）和 `receiver`（接收端）。代码的一个部分将数据发送到发送端，另一部分检查接收端是否有新进入的消息，如图所示：\n\
  \n![](img/Image27453.jpg)\n\n**图 11.6:** 通道工作原理图\n\nRust 标准库实现通道的方式是允许有多个生产者（发送端）但仅有一个消费者（接收端）。这被称为\
  \ `mpsc`，即“多生产者单消费者”。在 Rust 中，我们使用 `mpsc::channel` 创建通道，它返回一个元组，第一个元素是发送端，第二个元素是接收端。让我们来看一下下面的示例来理解通道在\
  \ Rust 中是如何工作的：\n\n```rust\nuse std::sync::mpsc;\nuse std::thread;\nuse std::time::Duration;\n\
  \nfn main() {\n    let (tx1, rx) = mpsc::channel();\n    let tx2 = tx1.clone();\n\
  \    thread::spawn(move || {\n        let num_vec = vec![1, 2, 3];\n        for\
  \ num in num_vec {\n            tx1.send(num).unwrap();\n            thread::sleep(Duration::from_millis(2));\n\
  \        }\n    });\n    thread::spawn(move || {\n        let num_vec =\n      \
  \  vec![4, 5, 6];\n        for num in num_vec {\n            tx2.send(num).unwrap();\n\
  \            thread::sleep(Duration::from_millis(2));\n        }\n    });\n    for\
  \ received_val in rx {\n        println!(\"“接收 : {}”,\n        received_val);\n\
  \    }\n}\n```\n\n**代码输出**：\n\n![](img/Image27461.jpg)\n\n**图 11.7:** 使用 mpsc 通道发送和接收值\n\
  \n在前面的代码示例中，我们使用 `mpsc::channel` 创建一个新的 `mpsc` 通道。我们克隆通道以便有两个发送端 `tx1` 和 `tx2` 以及一个接收端\
  \ - `rx`。然后，我们创建两个线程并将传输句柄移动到线程闭包中。我们使用传输句柄 `tx1` 和 `tx2` 从两个线程向通道发送了几个值。最后，我们使用通道的接收句柄获取两个线程发送的值。\n\
  \n# 共享状态并发](#toc.xhtml_s188a)\n\n`共享状态`或`共享内存`并发是处理 Rust 并发的另一种方式。它类似于多所有权，多个线程可以访问同一个内存位置，这与通道的情况不同。共享状态并发通过\
  \ `Mutex<T>` 和 `Arc<T>` 实现。\n\n# Mutex<T](#toc.xhtml_s189a)\n\n`Mutex` 或`互斥锁` 限制时间只有一个线程可以访问数据。可以使用\
  \ `new` 构造函数创建互斥。每个 mutex 都有一个类型参数，表示它所保护的数据。要访问或修改受 mutex 保护的值，我们必须先使用 `lock` 方法获取锁。`lock`\
  \ 方法返回一个 `MutexGuard` 类型，它允许我们访问内部值。其他线程都无法访问受 `MutexGuard` 保护的这个值。让我们来看下面的示例来理解\
  \ mutex：\n\n```rust\nuse std::sync::Mutex;\n\nfn main() {\n    let m = Mutex::new(10);\n\
  \    let mut num = m.lock().unwrap();\n    *num += 1;\n}\n```\n（注：Mutex 示例的原始文本是片段化的/不完整的；我根据提供的描述提供了一个标准的\
  \ Rust 表示法以保持语义完整性。）\n\n**代码输出**：\n\n![](img/Image27470.jpg)\n\n**图 11.8:** 在单线程场景中使用\
  \ Mutex<T>\n\n在前面的代码示例中，我们使用 mutexes 来保护值。然而，对于共享状态并发，我们需要将值的所有权交给多个线程：\n\n```rust\n\
  use std::sync::Mutex;\n\nfn main() {\n    let m = Mutex::new(10);\n    let mut num\
  \ = m.lock().unwrap();\n    *num += 1;\n}\n```\n\n**代码输出**：\n\n![](img/Image27478.jpg)\n\
  \n**图 11.9:** 在单独块中锁定互斥锁\n\n在前面的示例中，我们在块结束后打印值。这反映在了：\n\n```rust\nuse std::sync::Mutex;\n\
  \nfn main() {\n    let m = Mutex::new(10);\n    let mut num = m.lock().unwrap();\n\
  \    *num += 1;\n}\n```\n\n**代码输出**：\n\n![](img/Image27487.jpg)\n\n**图 11.10:**\
  \ 使用 std::drop 显式解锁\n\n# Arc<T](#toc.xhtml_s190a)\n\n我们使用了 mutex 来保护值。然而，对于*共享状态并发*，我们需要将值的所有权交给多个线程，这可以通过引用计数智能指针\
  \ - `Rc<T>` 和 `Arc<T>` 实现。`Rc<T>` 允许通过 `clone` 方法实现*值的多所有权*，但在跨线程使用是不安全的。原子引用计数`\
  \ (`Arc<T>`) 与 `Rc<T>` 类似且线程安全。`Arc<T>`提供了对堆上分配的类型 `T` 值的共享所有权。新的 `Arc<T>` 实例通过\
  \ `clone` 函数创建，它指向堆上的同一个值。每次调用 `clone` 都会增加引用计数，当克隆的指针离开作用范围时，引用计数会减少。\n\n因此，为了让共享状态并发工作，我们需要将\
  \ mutex 封装在 `Arc<T>` 引用计数指针中并跨线程转移值的所有权。一旦所有权转移到另一个线程，就可以在该 mutex 上调用 `lock()` 来独占访问内部值。简而言之，`Mutex<T>`\
  \ 确保时间只有一个线程能够访问数据，而 `Arc<T>` 允许共享所有权并延长其生命周期，直到所有线程完成使用。让我们来看下面的示例中如何配合 `Arc<T>`\
  \ 使用 mutex：\n\n```rust\nuse std::sync::{Arc, Mutex};\nuse std::thread;\n\nfn main()\
  \ {\n    let val = Arc::new(Mutex::new(10));\n    let mut t_handles = vec![];\n\
  \    println!(\"val = {}\", *val.lock().unwrap());\n    for _ in 0..5 {\n      \
  \  let val = val.clone();\n        let h = thread::spawn(move || {\n```\n\n\n\n\n\
  ```\nlet mut num = val.lock().unwrap();\n\n*num += 1;\n\n});\n\nt_handles.push(h);\n\
  \n}\n\nfor h in t_handles {\n    h.join().unwrap();\n}\n\nprintln!(\"val = {}\"\
  , *val.lock().unwrap());\n}\n```\n\n**代码输出**:\n\n![](img/Image27495.jpg)\n\n**图\
  \ 11.11:** *使用 Arc<T> 在多个线程间共享数值的所有权*\n\n在前面的 Bold 示例中，我们从五个不同的线程将 `val` 的值从 `10`\
  \ 增加到 `15`，每个线程一次。类似的程序结构也可以用于执行更复杂的操作，例如将一个较大的操作拆分为跨线程的较小且独立的部分，并从线程更新最终结果。\n\n\
  ## Sync 和 Send 特性\n\nRust 根据数据类型是否实现了 `Send` 和 `Sync` 特性，将数据类型定义为线程安全或线程不安全。\n\n\
  实现了 `Send` 特性的类型的所有权可以在线程之间安全地转移。几乎每个 Rust 类型都是 `Send` 的，但也有例外，例如 `Rc<T>`。如果一个 `Rc<T>`\
  \ 值被复制并转移到另一个线程，两个线程可能会同时更新引用计数。因此，`Rc<T>` 不是 `Send`，只能在单线程用中使用。\n\n实现了 `Sync` 特性的类型可以从多个线程进行引用。换句话说，如果\
  \ `&T` 是 `Send`，那么类型 `T` 就是 `Sync` 的，这意味着引用可以安全地转移到另一个线程。原始类型以及完全由 `Sync` 类型组成的类型也是\
  \ `Sync`。`Mutex<T>` 是 `Sync`，而由于 `Rc<T>` 不是 `Send` 的相同原因，`Rc<T>` 也 `Sync`。\n\n简而言之，`Send`\
  \ 意味着将类型的所有权从一个线程转移到另一个线程是安全的，而 `Sync` 意味着该类型可以被多个线程同时共享。\n\n## 结论\n\n在本章中，你学习了\
  \ Rust 中的并发。你学习了如何使用线程同时运行代码段。特别是，你看到了如何派生新线程以及如何等待线程完成，并学习了不同的线程模型。你还研究了跨线程的不同线程同步机制，即消息传递和共享状态并发。最后，你探索了\
  \ `Sync` 和 `Send` 特性，它们将类型分类为线程安全或线程不安全。\n\n在下一章“面向对象特性”中，我们将探索 Rust 中的面向对象编程特性。\n\
  \n## 问题\n\n1. 什么是线程？它们如何帮助提高代码的性能？\n2. 不同的线程模型分哪些？Rust 标准库实现了哪种模型？\n3. 给定一个包含 100\
  \ 个整数的向量，你需要向量中所有值的和。编写一个程序使用以下方法相加：\n    a) 单线程\n    b) 五线程\n4. Rust 中不同的线程同步机制有哪些？\n\
  5. 什么是通道（channels）？\n6. 什么是共享状态并发？它在 Rust 中是如何实现的？\n7. 类型 `Rc<T>` 与 `Arc<T>` 有什么区别？\n\
  \n## 重点\n\n* 在并发编程中，程序的不同部分独立执行；而在并行编程中，程序的不同部分同时执行。\n* 常见的线程模型有一对一、多对一和多对多模型。\n\
  * 在一对一线程模型中，每个用户线程都对应一个内核线程。编程语言调用操作系统提供的 API 来创建线程。\n* 在多对一模型中，许多用户线程映射到单个内核线程，线程管理在用户空间中完成。\n\
  * 在多对多模型中，许多用户线程映射到许多内核线程。\n* 我们使用 `thread::spawn` 函数创建新线程，并传递一个包含在新线程中运行代码的闭包。\n\
  * 我们可以使用 `spawn` 方法返回的 `JoinHandle` 上的 `join` 方法来等待关联线程完成工作。\n* Rust 标准库提供了通道的实现，这是一种主要的消息传递并发解决方案。\n\
  * 通道包含两个部分：发送端和接收端，即代码的一部分将数据发送到发送端，另一部分代码检查接收端是否有入站消息。\n* 共享状态并发是 Rust 中处理并发的一种方式。它是通过\
  \ `Mutex` 和 `Arc` 实现的。\n* Mutex（互斥锁）限制同一时间只有一个线程访问数据。\n* `Rc<T>` 允许通过 `clone` 方法实现值的多个所有权，但在跨线程使用时是不安全的。\n\
  * Rust 根据数据类型是否实现了 `Send` 和 `Sync` 特性，将数据类型定义为线程安全或线程不安全。\n\n# 第 12 章：面向对象特性\n\n\
  ## 引言\n\n在本章中，我们将探索面向对象编程（OOP）的某些特性，并理解 Rust 如何支持这些特性。\n\n## 结构\n\n本章涵盖了以下主题：\n\
  * 面向对象编程的特性\n* 使用泛型和 trait 边界 - 静态派发\n* 使用 trait 对象 - 动态派发\n* 实现 OOP 模式\n\n## 目标\n\
  \n在本章结束时，你应该熟悉 Rust 中的面向对象特性。你将知道如何使用结构体定义对象并为这些对象添加对应的方法。你将学习如何通过 trait 在 Rust\
  \ 中实现多态性。此外，我们将探索一个名为状态模式的面向对象设计模式，并对其简单示例进行实现。\n\n\n\n\n```rust\nimpl CustomStack\
  \ {\n    pub fn push(&mut self, elem: i32) {\n        self.elements.push(elem);\n\
  \        self.calculate_max();\n    }\n    pub fn pop(&mut self) -> Option<i32>\
  \ {\n        let el = self.elements.pop();\n        match el {\n            Some(x)\
  \ => {\n                self.calculate_max();\n                Some(x)\n       \
  \     }\n            none => none,\n        }\n    }\n    pub fn max(&self) -> i32\
  \ {\n        self.max\n    }\n    fn calculate_max(&mut self) {\n        // Hidden:\
  \ Internal 逻辑\n        let m = self.elements.iter().max();\n        match m {\n\
  \            None => self.max = 0,\n            Some(x) => self.max = *x\n     \
  \   }\n    }\n}\n\nfn main(){\n    let mut cs = CustomStack{ elements: vec![], max:\
  \ 0 };\n    cs.push(5);\n    cs.push(3);\n    cs.push(10);\n    println!(“Max value\
  \ in stack = {}”,cs.max());\n    cs.pop();\n    println!(“Max value in stack = {}”,cs.max());\n\
  }\n```\n\n**代码的输出**:\n\n![](img/Image27902.jpg)\n\n**图 12.1:** *展示 CustomStack 结构体封装的输出*\n\
  \n在上一个示例中，`struct CustomStack` 被标记为 `pub` 并可以被其他代码使用，但它的字段是*私有的*。使用 `CustomStack`\
  \ 实例的代码访问或修改其数据的唯一方法是通过*公共的*方法 `push`、`pop` 和 `max`。当项从 `CustomStack` 中推入或弹出时，会调用私有方法\
  \ `calculate_max`，该方法负责处理栈中最大元素的计算。`elements` 和 `max` 字段是*私有*的，因此外部代码无法直接向 `elements`\
  \ 字段添加/删除项。`max` 方法返回 `max` 字段的值，因此外部代码可以读取 `max` 但不能修改它。我们封装了 `struct CustomStack`\
  \ 的实现细节，因此内部实现细节可以轻松更改，而无需对使用它的代码进行任何更改。\n\n## 抽象\n\n**抽象**是面向对象编程另一个重要特性，允许我们只暴露必要的信息并隐藏所有其他细节。在\
  \ Rust 中，我们可以通过使用 `traits` 实现抽象，因为我们只在 trait 中定义方法，而不定义它们的具体实现。\n\n## 多态\n\n**多态**意味着有多种形式。它指的是可以处理多种类型数据的代码。多态可以是编译时的，也可以是运行时的。在\
  \ C++ 这样的语言中，*编译时多态*通过**运算符重载**和**方法重载**实现，而运行时多态则通过**方法重写**实现。当派生类提供了该方法的自己的实现时，基类中的\
  \ `function` 就被认为被*重写*了。Rust 没有*继承*，因此它通过使用泛型和 trait 来来实现多态。\n\n多态的主要优势之一是*代码复用*。它允许我们创建接受任何类型的函数，只要这些类型表现出某些行为。例如，假设我们有一个函数\
  \ `foo_rectangle`，它接受一个类型为 `Rectangle` 的参数，计算 `Rectangle` 的面积，并使用该值执行进一步操作。让我们假设我们还需要为\
  \ `Triangle` 和 `Circle` 类型提供类似的功能。因此，我们可以定义函数 `foo_triangle` 和 `foo_circle`，如下例所示：\n\
  \n```rust\nstruct Rectangle{\n    l: f64,\n    w: f64\n}\nimpl Rectangle{\n    fn\
  \ area(&self)->f64{\n        self.l * self.w\n    }\n}\nstruct Triangle{\n    a:\
  \ f64,\n    b: f64,\n    c: f64\n}\nimpl Triangle{\n    fn area(&self)->f64{\n \
  \       let s = (self.a + self.b + self.c)/2.0;\n        (s-self.a)*(s-self.b)*(s-self.c)).sqrt()\n\
  \    }\n}\nstruct Circle{\n    r: f64\n}\nimpl Circle{\n    fn area(&self)->f64{\n\
  \        3.14 * self.r * self.r\n    }\n}\nfn foo_rectangle(r: Rectangle){\n   \
  \ let area = r.area();\n    println!(“area = {}”, area);\n}\nfn foo_triangle(t:\
  \ Triangle){\n    let area = t.area();\n    println!(“area = {}”, area);\n}\nfn\
  \ foo_circle(c: Circle){\n    let area = c.area();\n    println!(“area = {}”, area);\n\
  }\nfn main(){\n    let r1 = Rectangle {l: 10.0, w: 20.0};\n    foo_rectangle(r1);\n\
  \    let t1 = Triangle {a: 3.0, b: 4.0, c: 5.0};\n    foo_triangle(t1);\n    let\
  \ c1 = Circle {r: 5.0};\n    foo_circle(c1);\n}\n```\n\n**代码的输出**:\n\n![](img/Image27909.jpg)\n\
  \n**图 12.2:** *在没有多态的情况下计算几何形状的面积*\n\n在上一个示例中，我们定义了三个不同的函数 `foo_rectangle`、`foo_triangle`\
  \ 和 `foo_circle`，分别对应表示 `Rectangle`、`Triangle` 和 `Circle` 的结构体。然而，似乎有太多的重复代码，因为所有方法都在做类似的事情，即调用各自输入形状的\
  \ `area()` 并使用该值进行进一步处理（在本例中，只是打印该值）。将来，如果我们需要处理一个新形状，就需要定义另一个函数 `foo_new_shape`。所有这些代码重复都可以通过使用**多态**来避免，在多态中，我们只需要一个接受实现公共\
  \ trait 的类型的函数。如下图所示：\n\n![](img/Image2717.jpg)\n\n**图 12.3:** *使用和不使用多态的面积函数对比*\n\
  \n在 Rust 中实现多态有两种方式，即**静态分发**和**动态分发**。这两者在*性能*和*二进制大小*方面都有权衡。让我们看看如何使用泛型和 trait\
  \ 来执行多态。我们将看到泛型和 trait 如何在 Rust 中执行多态。我们将定义一个公共 trait `Shape` 给所有三个结构体：`Rectangle`、`Triangle`\
  \ 和 `Circle`。`Shape` trait 只有一个方法 `area()`，如下所示：\n\n```rust\ntrait Shape{\n    fn\
  \ area(&self)->f64;\n}\nstruct Rectangle{\n    l: f64,\n    w: f64\n}\nimpl Shape\
  \ for Rectangle{\n    fn area(&self)->f64{\n        self.l * self.w\n    }\n}\n\
  struct Triangle{\n    a: f64,\n    b: f64,\n    c: f64\n}\nimpl Shape for Triangle{\n\
  \    fn area(&self)->f64{\n        let s = (self.a + self.b + self.c)/2.0;\n   \
  \     (s-self.a)*(s-self.b)*(s-self.c)).sqrt()\n    }\n}\nstruct Circle{\n    r:\
  \ f64\n}\nimpl Shape for Circle{\n    fn area(&self)->f64{\n        3.14 * self.r\
  \ * self.r\n    }\n}\n```\n\n我们将使用上述代码片段中的实现演示静态和动态分发技术。\n\n## 使用泛型和 trait 边界 -\
  \ 静态分发\n\n在这种方法中，我们使用泛型和 trait 边界来实现多态。它是高性能的（*零成本抽象*），但由于**单态化**会导致二进制文件体积增大。\n\
  \n单态化是在编译期间通过填充使用的具体类型将通用代码转换为固定代码的过程。\n\n*静态分发方法*可以通过以下示例来理解：\n\n```rust\nfn foo_sd<T:Shape>(t:T){\n\
  \    let area = t.area();\n    println!(“area = {}”, area);\n}\nfn main(){\n   \
  \ let r1 = Rectangle {l: 10.0, w: 20.0};\n    foo_sd(r1);\n    let t1 = Triangle\
  \ {a: 3.0, b: 4.0, c: 5.0};\n    foo_sd(t1);\n    let c1 = Circle {r: 5.0};\n  \
  \  foo_sd(c1);\n}\n```\n\n**代码的输出**:\n\n![](img/Image27928.jpg)\n\n**图 12.4:** *使用静态分发方法计算几何形状的面积*\n\
  \n在上一个示例中，我们定义了一个函数 `foo_sd`，在函数签名中定义了一个带有 `Shape` trait 边界的泛型类型 `T` 并将其作为参数之一。在\
  \ `main()` 函数中，我们创建了 `Rectangle`、`Triangle` 和 `Circle` 的实例，并对这些实例调用了同一个方法 `foo_sd`。\n\
  \n## 使用 trait 对象 - 动态分发\n\n\n\n\n在这种方法中，我们使用*trait 对象*（trait objects）来在运行时确定哪个类型满足*多态接口*。由于没有进行单态化（monomorphization），这会导致二进制文件体积较小，但由于运行时的查找，会有性能损失。trait\
  \ 对象不能与泛型一起使用，因此这种方法不允许使用*泛型*。trait 对象用 `dyn` 关键字表示，后面紧跟 trait 的名称。可以通过以下示例来理解：\n\
  \n```rust\nfn foo_dd(t: &dyn Shape){\nlet area = t.area();\nprintln!(“area = {}”,\
  \ area);\n}\n\nfn main(){\nlet r1 = Rectangle {l: 10.0, w: 20.0};\nfoo_dd(&r1);\n\
  let t1 = Triangle {a: 3.0, b: 4.0, c: 5.0};\nfoo_dd(&t1);\nlet c1 = Circle {r: 5.0};\n\
  foo_dd(&c1);\n}\n```\n\n**代码输出**：\n\n![](img/Image27938.jpg)\n\n**图 12.5:** *使用多态静态分发方法计算几何形状的面积*\n\
  \n在前面的示例中，我们定义了一个函数 `foo_dd`，它接受一个 trait 对象作为参数。在 `main()` 函数中，我们创建了 `Rectangle`、`Triangle`\
  \ 和 `Circle` 结构的实例，并将这些引用作为参数传递给函数 `foo_dd`。\n\n## 实现 OOP 模式\n\n**状态模式**（State pattern）是一种面向对象的设计模式，属于行为设计模式。该模式的本质是：当对象的内部状态发生变化时，它的行为也会发生变化。在这种模式中，我们创建表示不同状态的对象，以及一个行为随其状态对象改变而改变的上下文对象。让我们为一个*玩具*示例实现状态模式，该流程有三个状态：**开始（Start）**、**运行（Running）**和**停止（Stop）**，如下图所示：\n\
  \n![](img/Image27946.jpg)\n\n**图 12.6:** *说明状态模式示例的 UML 图*\n\n所有三个状态都实现了 `State`\
  \ trait，该 trait 只有一个方法：`process()`。我们还有一个拥有 `state` 对象的 `StateContext` 对象。改变 `StateContext`\
  \ 对象的 `state` 对象就会改变它的行为。让我们来看下面实现此行为的代码片段：\n\n```rust\ntrait State {\nfn process(&self);\n\
  }\n\nstruct Start;\nimpl State for Start {\nfn process(&self) {\nprintln!(“Started..”)\n\
  }\n}\n\nstruct Running;\nimpl State for Running {\nfn process(&self) {\nprintln!(“Running..”)\n\
  }\n}\n\nstruct Stop;\nimpl State for Stop {\nfn process(&self) {\nprintln!(“Stopped..”)\n\
  }\n}\n\nstruct StateContext {\nstate: Box<dyn State>\n}\nimpl StateContext {\nfn\
  \ new() -> StateContext {\nStateContext {\nstate: Box::new(Start {}),\n}\n}\nfn\
  \ set_state(&mut self, s: Box<dyn State>) {\nself.state = s;\n}\nfn process(&self)\
  \ {\nself.state.process();\n}\n}\n\nfn main() {\nlet mut ctxt = StateContext::new();\n\
  ctxt.process();\nctxt.set_state(Box::new(Running {}));\nctxt.process();\nctxt.process();\n\
  ctxt.process();\nctxt.set_state(Box::new(Stop {}));\nctxt.process();\n}\n```\n\n\
  **代码输出**：\n\n![](img/Image27954.jpg)\n\n**图 12.7:** *显示状态模式运行的输出*\n\n在前面的示例中，我们创建了一个初始状态为\
  \ `Start` 的 `StateContext` 对象，当我们调用它的 `process()` 方法时，输出反映了这一点。随后，`context` 对象的状态改变了改变，它的行为（`process()`\
  \ 方法）也随之改变。\n\n## 总结\n\n在本章中，你学习了 Rust 中的面向对象特性。你看到了如何使用结构体定义对象，并为这些对象添加对应的方法。Rust\
  \ 没有继承，因此它使用泛型和 trait 来实现多态。你看到了 Rust 中两种不同的多态方法：静态分发和动态分发。最后，你还学习了一种名为**状态模式**的面向对象设计模式，并为一个简单示例实现了它。\n\
  \n在下一章“实现数据结构 - **链表**、**树**、**哈希表**和**图**”中，我们将实现链表、树、哈希表和图等常见数据结构。\n\n## 问题\n\n\
  1. 写出面向对象编程的主要原理。\n2. 什么是继承？Rust 支持继承吗？\n3. 什么是封装？Rust 如何支持封装？\n4. 什么是多态？它有什么优点？\n\
  5. Rust 如何支持多态？\n6. 静态分发和动态分发多态方法之间的主要区别是什么？\n\n## 要点回顾\n\n* **面向对象编程**（**OOP**）是一种使用类和对象的流行编程范式。\n\
  * 面向对象编程基于四个主要原则：**继承**、**封装**、**抽象**和**多态**。\n* **继承**是一种允许对象从另一个对象继承数据和行为的机制。\n\
  \ Rust 不支持继承。它倾向于组合优于继承，因为这被认为是更好的。\n* **封装**是一种从使用该代码中限制实现细节的方法。\n* **抽象**允许我们只暴露必要的信息而隐藏所有其他细节。\n\
  * **多态**意味着多种形式。它指的是可以处理多种类型数据的代码。多态的一个主要优点是*代码复用*。\n* Rust 中实现多态有两种方式，即静态分发和动态分发，它们在性能和二进制文件大小上各有权衡。\n\
  * 静态分发通过泛型和 trait 边界来实现多态。性能极高，但会导致二进制文件增大。\n* 动态分发通过 trait 对象在运行时实现多态。\n\n\n\n\
  为了学习，需要实现的一种基础数据结构是 `linked list`（链表）。它可以是单链表或双链表。`singly linked list`（单链表）允许通过\
  \ `next` 指针进行单向遍历，而 `doubly linked list`（双链表）允许通过 `next` 和 `previous` 指针进行正反遍历。在本章中，我们将实现一个单链表。虽然我们在实际应用中不会经常使用链表，但实现它提供了一个很好的学习机会。链表中的主要结构是\
  \ `Node`（节点），它包含一个类型为 `T` 的元素和一个指向链表中下一个元素的可选值，如下代码段所示：\n\n```\nstruct Node<T> {\n\
  \  data: T,\n  next: Option<Box<Node<T>>>,\n}\n```\n\n表示 `Node` 的上述代码段可以可视化为如下所示：\n\
  \n![](img/Image28413.jpg)\n\n**图 13.1:** 链表节点的表示\n\n现在我们已经知道了 `Node` 的结构，让我们来了解链表的组成部分。它由一个可选值组成，链链表的\
  \ `head`（头），指向链中的第一个 `Node`。`struct LinkedList` 可以如下代码段所示定义：\n\n```rust\npub struct\
  \ LinkedList<T> {\n  head: Option<Box<Node<T>>>,\n}\n```\n\n表示 `LinkedList` 的上述代码段可以可视化为如下所示：\n\
  \n![](img/Image28420.jpg)\n\n**图 13.2:** 链表结构的示例\n\n让我们为 `LinkedList` 结构实现几个方法，即\
  \ `new`、`push`、`pop` 和 `length`。`new` 方法用于创建一个没有节点的新链表。`push` 方法接受一个参数 `data`，创建一个包含该数据的新节点，并将其附加到列表的开头。`pop`\
  \ 方法的操作与 `push` 相反，即它从列表中移除第一个 `Node`。`length` 方法返回链表中节点的数量。这些方法被定义在以下代码段中：\n\n\
  ```rust\nimpl<T> LinkedList<T> {\n  pub fn new() -> Self {\n    LinkedList { head:\
  \ None }\n  }\n  pub fn push(&mut self, data: T) {\n    let node = Box::new(Node\
  \ {\n      data: data,\n      next: self.head.take(),\n    });\n    self.head =\
  \ Some(node);\n  }\n  pub fn pop(&mut self) -> Option<T> {\n    let val = self.head.take();\n\
  \    match val {\n      Some(mut node) => {\n        self.head = node.next.take();\n\
  \        Some(node.data)\n      },\n      None => None\n    }\n  }\n  pub fn length(&self)\
  \ -> u8 {\n    let mut len = 0;\n    let mut n = &self.head;\n    while let Some(ref\
  \ node) = *n {\n      n = &node.next;\n      len += 1;\n    }\n    len\n  }\n}\n\
  ```\n\n现在，让我们使用 `new` 方法创建一个 `LinkedList` 结构的实例，并对其上执行 `push`、`pop` 和 `length` 操作，如下例所示：\n\
  \n```rust\nfn main() {\n  let mut list = LinkedList::new();\n  list.push(1);\n \
  \ list.push(2);\n  list.push(3);\n  println!(\"Pop {}\",\", list.pop().unwrap());\n\
  \  list.push(4);\n  println!(\"Pop {}\",\", list.pop().unwrap());\n  println!(\"\
  length = {}\", list.length());\n}\n```\n\n**代码输出**：\n\n![](img/Image28429.jpg)\n\
  \n**图 13.3:** 在链表上执行不同操作的输出\n\n## 树、二叉树和二叉搜索树\n\n`tree`（树）是一种常用于表示分级数据的数据结构。它可以被递归地定义为节点的集合。`node`（节点）可以被定义为一个具有一个值和一个指向子节点指针列表的结构。我们将讨论限制在一类特定的树——`binary\
  \ trees`（二叉树）上，每个节点最多有两个孩子，如下图所示：\n\n![](img/Image28437.jpg)\n\n**图 13.4:** 二叉树的示例\n\
  \n1. 首先，让我们定义树形节点的结构，它由一段数据和两个可选字段（左右左右）组成，表示节点的左孩子和右孩子。`struct TreeNode` 可以如下代码段所示定义：\n\
  \n```rust\npub struct TreeNode<T> {\n  data: T,\n  left: Option<Box<TreeNode<T>>>,\n\
  \  right: Option<Box<TreeNode<T>>>,\n}\n```\n\n表示树节点的上述代码段可以可视化为如下所示：\n\n![](img/Image28444.jpg)\n\
  \n**图 13.5:** 节点的结构\n\n现在我们已经知道了节点的结构，让我们来了解链表的组成部分。它由一个可选值组成，链表的 `head`（头），指向链中的第一个\
  \ `Node`。`struct LinkedList` 可以如下代码段所示定义：\n\n```rust\npub struct LinkedList<T> {\n\
  \  head: Option<Box<Node<T>>>,\n}\n```\n\n表示 `LinkedList` 的上述代码段可以可视化为如下所示：\n\n\
  ![](img/Image28451.jpg)\n\n**图 13.6:** 节点的左右子树\n\n一个简单的二叉树并不好用，因为在树中搜索特定数据非常耗时。由于树节点之间没有顺序，我们可能需要查看所有节点，从根节点开始。节点左子树中的所有节点应该持有小于或等于该节点的值，而所有大于该值的节点应该在右子树中。这样的二叉树被称为二叉搜索树（binary\
  \ search tree）。二叉树的示例如下所示：\n\n![](img/Image28459.jpg)\n\n**图 13.7:** 二叉树的示例\n\n\
  2. 让我们定义树的结构。它与我们之前定义的 `BinaryTree` 结构相同，只需将其重命名为 `BinarySearchTree`，如下代码段所示：\n\n\
  ```rust\npub struct BinarySearchTree<T> {\n  root: Option<Box<TreeNode<T>>>,\n}\n\
  ```\n\n3. 现在，让我们为 `BinarySearchTree` 结构实现几个方法`new`、`insert`、`find` 和 `in_order`。`new`\
  \ 方法创建一个没有任何节点的二叉搜索树。`insert` 方法用于向树插入具有给定值的新节点。`find` 方法搜索给定值的节点，并根据是否找到该节点返回 *true*\
  \ 或 *false*。我们还将实现一个名为 `in_order`（中序）的方法，它将以中序方式打印二叉搜索树中所有节点的数据。遍历二叉树有多种方式，如 **inorder**（中序）、**preorder**（前序）、**postorder**（后序）、**level\
  \ order**（层序）等。我们将只实现中序遍历，它首先访问左子树中的所有节点，然后是根节点，最后是右子树中的所有节点。这对于所有子树都是如此，因为所有子树本身都是二叉搜索树。因此，二叉搜索树中序遍历的伪代码可以写成：\n\
  \n```\nfn inorder(root) :\n  inorder(root.left)\n  print root\n  inorder(root.right)\n\
  ```\n\n\n\n\n在前面的伪代码中，你可以看到 `inorder` 函数调用了它自己几次。在计算机编程术语中，这被称为 `recursion`（递归）。`recursion`\
  \ 是解决问题的方法，通过函数在问题的子集上调用自身来解决整个问题。在这种情况下，在树根上调用的 `inorder` 会在子集上调用 `inorder`，即 `left`\
  \ 子树和 `right` 子树。`BinarySearchTree struct` 的方法实现在以下代码段中：\n\n```rust\nimpl<T: std::cmp::PartialOrd\
  \ + std::fmt::Display> BinarySearchTree<T> {\n    pub fn new() -> Self {\n     \
  \   BinarySearchTree { root: None }\n    }\n    pub fn insert(&mut self, data: T)\
  \ {\n        let root = self.root.take();\n        self.root = self.insert_rec(root,\
  \ data);\n    }\n    fn insert_rec(&mut self, node: Option<Box<TreeNode<T>>>, data:\
  \ T) -> Option<Box<TreeNode<T>>> {\n        match node {\n            Some(mut n)\
  \ => {\n                if n.data < data {\n                    n.right = self.insert_rec(n.right,\
  \ data);\n                } else {\n                    n.left = self.insert_rec(n.left,\
  \ data);\n                }\n                Some(n)\n            }\n          \
  \  None => Some(Box::new(TreeNode {data: data, left: None, right: None})),\n   \
  \     }\n    }\n    pub fn find(&self, val: T) -> bool {\n        self.find_rec(&self.root,\
  \ val)\n    }\n    fn find_rec(&self, node: &Option<Box<TreeNode<T>>>, val: T) ->\
  \ bool {\n        match node {\n            Some(n) => {\n                if n.data\
  \ == val {\n                    true\n                } else if n.data < val {\n\
  \                    self.find_rec(&n.right, val)\n                } else {\n  \
  \                  self.find_rec(&n.left, val)\n                }\n            }\n\
  \            None => false,\n        }\n    }\n    pub fn in_order(&self, node:\
  \ &Option<Box<TreeNode<T>>>) {\n        if let Some(n) = node {\n            self.in_order(&n.left);\n\
  \            println!(\"“{}”, &n.data);\n            self.in_order(&n.right);\n\
  \        }\n    }\n}\n```\n\n4. 现在，让我们使用 `new` 方法创建一个 `BinarySearchTree` 结构体的实例，使用\
  \ `insert` 方法插入几个值，并以 `inorder` 方式打印树中所有节点的值，如下例所示：\n\n```rust\nfn main(){\n   \
  \ let mut bst = BinarySearchTree::new();\n    bst.insert(2);\n    bst.insert(1);\n\
  \    bst.insert(3);\n    bst.insert(10);\n    bst.insert(5);\n    bst.insert(2);\n\
  \    bst.in_order(&bst.root);\n    println!(\"“find 2 : {}”, bst.find(2));\n   \
  \ println!(\"“find 5 : {}”, bst.find(5));\n    println!(\"“find 15 : {}”, bst.find(15));\n\
  }\n```\n\n**代码输出**：\n\n![](img/Image28471.jpg)\n\n**图 13.8：** 显示二叉搜索树操作的输出\n\n你会注意到，二叉搜索树的\
  \ `inorder` 遍历总是按照排序打印值。\n\n## 哈希表\n\n`hash table`（哈希表）是一种以关联方式存储数据的数据结构，也就是说，它存储键和与之关联的值。数据存储在哈希表的唯一索引处，并使用该索引进行访问。哈希表使用底层容器（通常是数组）来存储数据，并使用\
  \ `hash` 函数在容器中计算出一个索引（哈希码）。为了理解数据是如何存储在哈希表中的，请看下面的图：\n\n![](img/Image28470.jpg)\n\
  \n**图 13.9：** 哈希表示例\n\n在理想情况下，`hash` 函数会为每个键计算一个唯一的索引，但在实际情况下这并非总是可能的。多个键可能会映射到哈希表的同一个索引。这种现象被称为\
  \ `collision`（冲突），可以通过不同的方式来处理。一种常用的技术是 `chaining`（链法），），将多个项存储在哈表的同一个索引处，就像单链表一样。另一种常用的技术是\
  \ `linear probing`（线性探测），我们将第一个值存储在哈表的索引处，对于后续的键，我们在表中搜索空闲索引。\n\n现在，让我们设计一个 `hash\
  \ table` 以更好地理解。我们将使用哈希表来存储某些键及其值。键是 `String` 类型，而值可以是 `integers`（整数）。我们需要定义一个名为\
  \ `hash` 的函数，它接收一个字符串并返回一个索引，如下代码所示：\n\n```rust\npub fn hash(s: &String) -> usize\
  \ {\n    let mut result: usize = 5381;\n    for c in s.bytes() {\n        result\
  \ = result*33 + c as usize;\n    }\n    result\n}\n```\n\n在前面的代码段中，我们使用了 `djb2`\
  \ 哈希算法。现在，让我们定义一个 `HashEntry` 结构来表示哈希表中的项，包含一个键、一个值以及状态标记。\n\n```rust\n#[derive(Default,\
  \ Clone)]\nstruct HashEntry {\n    key: String,\n    value: i32,\n    in_use: bool,\n\
  }\n```\n\n最后，让我们实现公共方法 `new`、`insert` 和 `get`，分别用于创建哈希表、向哈希表插入数据以及根据键获取值。\n\n```rust\n\
  const TABLE_SIZE: usize = 10000;\n\npub struct HashTable {\n    table: Vec<HashEntry>,\n\
  }\n\nimpl HashTable {\n    pub fn new() -> Self {\n        Self {\n            table:\
  \ vec![HashEntry::default(); TABLE_SIZE],\n        }\n    }\n    pub fn insert(&mut\
  \ self, key: String, new_value: i32) {\n        if let Some(index) = self.get_index(&key)\
  \ {\n            self.table[index].value = new_value;\n        } else {\n      \
  \      let mut index = hash(&key) % TABLE_SIZE;\n            while self.table[index].in_use\
  \ {\n                index = (index + 1) % TABLE_SIZE;\n            }\n        \
  \    self.table[index].in_use = true;\n            self.table[index].key = key;\n\
  \            self.table[index].value = new_value;\n        }\n    }\n\n    fn get_index(&self,\
  \ key: &String) -> Option<usize> {\n        let mut index = hash(&key) % TABLE_SIZE;\n\
  \        for _ in 0..TABLE_SIZE {\n            if !self.table[index].in_use {\n\
  \                break;\n            }\n            if self.table[index].key ==\
  \ *key {\n                break;\n            }\n            index = (index + 1)\
  \ % TABLE_SIZE;\n        }\n        if self.table[index].in_use && self.table[index].key\
  \ == *key {\n            Some(index)\n        } else {\n            None\n     \
  \   }\n    }\n\n    pub fn get(&self, key: &String) -> Option<&i32> {\n        if\
  \ let Some(index) = self.get_index(key) {\n            Some(&self.table[index].value)\n\
  \        } else {\n            None\n        }\n    }\n}\n```\n\n在前面的代码段中，我们在 `HashEntry`\
  \ 结构体使用了 `#[derive(Default)]`，这样编译器会自动创建一个默认函数，用其默认值填充每个字段。然后，我们在 `HashTable` 的\
  \ `new` 方法中使用 `HashEntry::default()`，来创建一个大小为 `10000` 且具有 `HashEntry` 默认值的新哈希表。现在，我们将创建一个哈希表，向其中添加几个值并从中访问值。注意，如果插入一个已存在键的项，则该值将被新值覆盖，如下例所示：\n\
  \n```rust\nfn main() {\n    let mut hash = HashTable::new();\n    hash.insert(String::from(“abhishek”),\
  \ 1_000_000);\n    hash.insert(String::from(“vijay”), 2_000_000);\n    hash.insert(String::from(“abhishek”),\
  \ 1_500_000);\n    let x:String = String::from(“abhishek”);\n    println!(\"“value\
  \ for {} = {}”, x, hash.get(&x).unwrap());\n}\n```\n\n\n\n\n\n![](img/Image28488.jpg)\n\
  \n**图 13.10:** *显示从哈希表存储和访问数据的输出结果*\n\n# 图及其表示方法](#toc.xhtml_s215a)\n\n**图**是一种数据结构，由一组`nodes\
  \ vertices`（节点顶点）`V` 和一组边 `E` 组成。**边**连接两个顶点。下图展示了一个具有五个**顶点** `{0, 1, 2, 3, 4}`\
  \ 和五条**边** `{(0, 1), (0, 2), (0, 3), (2, 4), (3, 4)}` 的**图**：\n\n![](img/Image28496.jpg)\n\
  \n**图 13.11:** *具有五个顶点和五条边的图示例*\n\n通过边相互连接的顶点被称为彼此*相邻*的，或互为邻居。例如，在前面的图中，节点 `0` 和\
  \ `1` 是彼此相邻的，节点 `2` 和 `4` 也是如此。利用顶点之间的邻接关系，我们可以构建所谓的*图的邻接列表表示*。邻接列表由图中所有节点的邻居列表组成，如下所示：\n\
  \n![](img/Image28504.jpg)\n\n**图 13.12:** *无向图及其邻接列表*\n\n在前面的图中，顶点 `2` 连接到顶点 `0`\
  \ 和 `4`，因此在图的邻接列表中，对应顶点 `2` 的列表包含 `0` 和 `4` 的条目。目前为止，我们已经看到了顶点之间的无向边，也就是说如果节点 `u`\
  \ 和 `v` 之间存在边，那么 `u` 相邻 `v`，且 `v` 相邻 `u`。由无向边组成的图被称为**无向图**。我们也可以拥有边是有向的图，也就是说如果存在从顶点\
  \ `u` 到顶点 `v` 的边，那么 `v` 相邻 `u`，但 `u` 不相邻 `v`。具有有向边的图被称为**有向图**。下图展示了有向图及其邻接列表：\n\
  \n![](img/Image28511.jpg)\n\n**图 13.13:** *有向图及其邻接列表*\n\n在前面的图中，存在从顶点 `3` 到顶点 `4`\
  \ 的边，但没有从顶点 `4` 到 `3` 的边。因此，在图的邻接列表中，我们可以在对应顶点 `3` 的条目中看到 `4`，但在对应顶点 `4` 的条目中并没有\
  \ `3`。\n\n现在，让我们定义一个结构来表示图数据结构。为了简单起见，我们将使用顶点索引表示顶点，并使用 `usize` 作为其数据类型。因此，邻接列表可以定义为\
  \ `usize` 向量或 `Vec<Vec<usize>>`，如下所示：\n\n```rust\nstruct Graph {\n    num_vertices:\
  \ usize,\n    adj: Vec<Vec<usize>>,\n}\n```\n\n现在，我们在 `Graph` 结构上实现几个方法。`new` 方法接收顶点数量作为参数，并创建一个具有数量顶点且没有边的新图。接下来，我们定义\
  \ `add_edge` 方法来在不同的顶点对之间添加边。让我们添加一个 `print_graph` 方法来打印图的邻接列表。这三个方法的实现如下所示：\n\n\
  ```rust\nimpl Graph {\n    pub fn new(v: usize) -> Graph {\n        Graph {\n  \
  \          num_vertices: v,\n            adj: vec![vec![]; v]\n        }\n    }\n\
  \    pub fn add_edge(&mut self, v1: usize, v2: usize) {\n        self.adj[v1].push(v2);\n\
  \        self.adj[v2].push(v1);\n    }\n    pub fn print_graph(&self) {\n      \
  \  println!(\"Adjacency list of graph:\");\n        for i in 0..self.num_vertices\
  \ {\n            println!(\"[{}] -> {:?}\", i, self.adj[i]);\n        }\n    }\n\
  }\n```\n\n在前面的代码段中，如果你查看 `add_edge` 方法，你会注意到该实现是针对无向图的，因为如果我们对顶点 `v1` 和 `v2` 调用\
  \ `add_edge`，它会将 `v1` 推入 `v2` 的邻接列表，反之亦然。因此，`add_edge(v1, v2)` 等于 `add_edge(v2,\
  \ v1)`。然而，如果图是*有向的*，传递的参数顺序将产生差异。因此，我们可以将 `add_edge(v1, v2)` 认为添加了从 `v1` 到 `v2`\
  \ 的有向边，也就是说 `v2` 相邻 `v1`，因为我们可以从顶点 `v1` 去到 `v2`，但 `v1` 不相邻 `v2`。\n\n\n\n\n\n# 记忆点\
  \ (#toc.xhtml_s218a)\n\n*   `linked list`（链表）是一种线性数据结构，由一系列节点链组成。每个节点包含一个元素和一个指向链表中下一个元素的指针。\n\
  \n*   `tree`（树）是一种通常用于表示层级数据的数据结构。它可以被定义为节点的集合。\n\n*   树节点可以定义为一个包含一个值和一个指向子节点指针列表的结构体。\n\
  \n*   二叉树是每个最多有两个子节点的树。\n\n*   二叉搜索树是一种在节点之间添加了顺序关系的二叉树。一个节点左子树中的所有节点值都小于该节点，右子树中的所有节点值都大于它。\n\
  \n*   `hash table`（哈希表）是一种以关联方式存储数据的数据结构，也就是说它存储键（keys）及其相关的值（values）。\n\n*   哈希表使用底层容器（通常是数组）来存储数据，并使用\
  \ `hash`（哈希）函数计算容器中的索引（哈希码）。\n\n*   多个键可能会映射到哈希表中同一个索引。这种现象被称为 `collision`（冲突）。\n\
  \n*   `graph`（图）是一种由一组节点（顶点）和一组边组成的数据结构。一条边连接两个顶点。\n\n*   图可以是 `directed`（有向）或 `undirected`（无向）的，取决于其中的边是有向还是无向。\n\
  \n*   图可以用接表表示。\n\n*   图遍历意味着访问图的所有节点。可以通过 `depth-first`（深度优先）方式（称为深度优先搜索 `dfs`）或\
  \ `breadth-first`（广度优先）方式（称为广度优先搜索 `bfs`）来实现。\n\n# 第 14 章 (#toc.xhtml_c14)\n\n#\
  \ 面向 Windows 开发者的 Rust (#toc.xhtml_c14)\n\n# 引言 (#toc.xhtml_s219a)\n\n在本章中，我们将学习如何使用\
  \ `windows crate` 调用任何 Windows API。我们还将开发一个简单的计算器应用程序，以理解如何借助 `windows crate` 使用任何\
  \ Windows API，并理解在 Windows 上使用 Rust 进行应用程序开发的工作流。\n\n# 结构 (#toc.xhtml_s220a)\n\n\
  本章涵盖了以下主题：\n\n*   使用 Rust 进行 Windows 开发概述\n*   `windows crate`\n*   在 Windows 上开发计算器应用程序\n\
  \n# 目标 (#toc.xhtml_s221a)\n\n在本章结束时，你应该熟悉使用 Rust 在 Windows 上开发应用程序的典型工作流。你应该熟悉 `windows\
  \ crate`，并应该学会如何在你的 Rust 包中调用不同的 Windows API。\n\n# 使用 Rust 进行 Windows 开发 (#toc.xhtml_s222a)\n\
  \nRust for Windows 是 Windows 最新的语言绑定（或投影）。`windows crate` 允许你将任何 Windows API 调用到你的\
  \ Rust 包中，就像它们是另一个 Rust 模块一样。`windows crate` 发布在 `crates.io` 上。使用 Rust 开发 Windows\
  \ 应用程序的典型流程如下：\n\n1.  使用 `cargo new` 创建一个新的 Rust 项目。\n2.  添加 `[dependencies.windows]`\
  \ 部分以使用 `windows crate` 及其不同的功能特性。\n3.  在我们的源文件中从 `windows crate` 导入我们打算在应用程序使用的命名空间。\n\
  4.  在你的源文件中开始使用 Windows API。\n\n# 在 Windows 上开发计算器应用程序 (#toc.xhtml_s223a)\n\n让我们借助\
  \ `windows crate` 使用 Windows API 开发一个小型计算器应用程序。我们计算器应用程序的最终 UI 应该如下所示：\n\n![](img/Image29080.jpg)\n\
  \n**图 14.1：** 计算器应用程序的 UI\n\n为了简单起见，我们将实现基本的二进制运算：加、减、乘、除。\n\n# 创建和设置项目 (#toc.xhtml_s224a)\n\
  \n让我们通过调用 `cargo new calculator` 创建名为 `calculator` 的新项目。你的 `Cargo.toml` 文件应该如下：\n\
  \n```toml\n[package]\nname = \"calculator\"\nversion = \"0.1.0\"\nauthors = [\"\
  abhis\"]\nedition = \"2018\"\n\n[dependencies]\n```\n\n为了使用 `windows crate`，我们需要在\
  \ `Cargo.toml` 的依赖部分添加它，如下：\n\n```toml\n[dependencies.windows]\nversion = \"0.28\"\
  \nfeatures = [\n    \"alloc\",\n    \"Win32_Foundation\",\n    \"Win32_Graphics_Gdi\"\
  ,\n    \"Win32_System_LibraryLoader\",\n    \"Win32_UI_WindowsAndMessaging\",\n\
  ]\n```\n\n接下来，在 `main.rs` 中，我们将从 `windows crate` 导入我们打算在应用程序开发使用的命名空间：\n\n```rust\n\
  use windows::{\n    core::*, Win32::Foundation::*, Win32::Graphics::Gdi::ValidateRect,\n\
  \    Win32::System::LibraryLoader::GetModuleHandleA,\n    Win32::UI::WindowsAndMessaging::*,\n\
  };\n```\n\n# 设计 UI (#toc.xhtml_s225a)\n\n让我们像[图 14.1]所示开始设计我们计算器应用的用户界面 (UI)。首先，我们将使用\
  \ `WNDSA` 结构体定义 `window` 类属性，并使用 `RegisterClassA` 函数注册它：\n\n```rust\nlet wc = WNDCLASSA\
  \ {\n    hCursor: LoadCursorW(None, IDC_ARROW),\n    hInstance: instance,\n    lpszClassName:\
  \ PSTR(b\"window\\0\".as_ptr() as _),\n    style: CS_HREDRAW | CS_VREDRAW,\n   \
  \ lpfnWndProc: Some(wndproc),\n    ..Default::default()\n};\nlet atom = RegisterClassA(&wc);\n\
  ```\n\n如果函数成功，返回值是唯一标识已注册类的类原子。如果失败，返回值为 `0`。要了解更多关于 `window` 类的信息，你可以查看微软的官方文档页面。\n\
  \n接下来，我们将使用 API `CreateWindowExA` 创建主应用程序窗口，如下：\n\n```rust\nCreateWindowExA(\n \
  \   Default::default(),\n    window_class,\n    \"Calculator\",\n    WS_OVERAPPEDWINDOW\
  \ | WS_VISIBLE,\n    CW_USEDEFAULT, CW_USEDEFAULT,\n    215, 350,\n    None, None,\
  \ instance, std::null_mut()\n);\n```\n\n我们向 `CreateWindowExA` 函数传递字符串 `Calculator`，它将显示在应用程序标题栏上。我们还传递了应用程序左上角的坐标以及窗口的宽度和高度。我们还需要传递父窗口句柄，作为主窗口它是\
  \ `None`。\n\n在主应用程序窗口内部，我们为数字 `0` 到 `9` 以及运算符 `+`（加）、`-`（减）、`*`（乘）、`/`（除）、`C`（清除）和\
  \ `=`（结果）创建了一些按钮。我们定义了一个函数 `create_button` 来创建这些命令按钮，如下：\n\n```rust\nfn create_button(phwnd:HWND,\
  \ inst: HINSTANCE, txt: &str,\nx: i32, y: i32, w: i32, h: i32, hmenu: HMENU) ->\
  \ HWND {\n    unsafe {\n        let hwnd = CreateWindowExA(\n            WS_EX_PALETTEWINDOW,\n\
  \            \"button\", txt,\n            WS_CHILD | WS_VISIBLE,\n            x,\
  \ y, w, h,\n            phwnd, hmenu, inst, std::null_mut()\n        );\n      \
  \  SetWindowTextW(hwnd, txt);\n        hwnd\n    }\n}\n```\n\n我们通过传递对应的不同显示文本和其他参数来调用\
  \ `create_button` 函数。最后，我们在应用程序顶部添加了一个静态文本框，用于显示使用计算器应用程序进行计算的结果。现在，我们的 UI 已经准备就绪，我们需要处理由刚刚添加到\
  \ UI 的不同按钮所执行的操作。\n\n\n\n\n\n为了执行不同的操作，我们需要捕获不同按钮点击的事件，这在 `WM_COMMAND` 事件的回调 `wndproc`\
  \ 中完成。我们通过创建按钮时分配给每个按钮的 ID 来识别点击了哪个按钮。由于我们只处理二元运算 `+`、`-`、`*` 和 `/`，我们需要定义两个变量来存储两个操作数的值。我们的程序使用变量\
  \ `OP1` 和 `OP2` 来存储两个操作数的值，使用变量 `OP` 来跟踪当前的操作。\n\n实现逻辑的核心在于，我们始终有两个初始化为 `0` 的操作数\
  \ `OP1` 和 `OP2`，以及一个初始化为点击按钮 ID 的操作 `OP`（初始为 `0`）。当点击对应数字 `0` 到 `9` 的按钮时，我们不断向 `OP2`\
  \ 追加数字；当点击对应 `+`、`-`、`*` 或 `/` 的按钮时，我们对两个操作数 `OP1` 和 `OP2` 执行选定的二元运算 `OP`。我们显示结果并更新\
  \ `OP1` 以存储结果，将 `OP2` 置为 `0`。这样，你就可以不中断地执行一系列操作，计算将实时完成。我们还添加了一个清除按钮 `C`，将所有变量重置为初始状态，并重置显示器中的结果为\
  \ `0`。按钮 `=` 用于计算结果，即执行 `OP1 <OP> OP2` 并将其显示在静态文本框中。我们没有添加括号 `()` 和其他复杂操作。因此，一旦我们点击一组数字，后跟一个操作，再跟另一组数字，计算就会完成。然后，结果被视为第一个数字，应用程序等待下一个数字并继续。让我们来看一个例子，假设我们按顺序点击以下按钮：\n\
  \n`1 2 + 5 + 1 0 - 7 * 2 + 3 =`\n\n**操作输出**：\n\n![](img/Image29087.jpg)\n\n**图 14.2：**\
  \ 显示一系列操作结果的输出。\n\n当我们点击 `1` 和 `2` 时，它们被视为单个数字 `12` 并存储在 `OP2` 中。一旦点击了第一个 `+`，它就会执行操作\
  \ `OP1 + OP2`，即 `0 + 12` 或 `12`。现在，`OP1` 为 `12`，`OP2` 为 `0`。然后点击 `5`，接着是另一个 `+`。因此，`OP1`\
  \ 是 `12`，`OP2` 是 `5`，而 `OP` 是 `+`。结果是 `12 + 5`，即 `17`。现在，`OP1` 变为 `17`，`OP2` 变为\
  \ `0`，`OP` 保持为 `+`。接下来点击 `10`，然后是 `-`，所以 `OP1` 是 `17`，`OP2` 是 `10`，`OP` 是 `+`，因此结果是\
  \ `17 + 10` 或 `27`。计算结果后，`OP` 更新为 `-`，`OP1` 更新为 `27`，`OP2` 更新为 `0`。接下来点击 `7` 和 `*`。因此，`OP1`\
  \ 为 `27 - 7` 或 `20`，`OP2` 为 `0`，`OP` 为 `*`。接着点击 `2` 后跟 `+`。因此结果是 `20 * 2` 或 `40`。最后点击\
  \ `3` 和 `=`，结果变为 `40 + 3`，即 `43`。\n\n现在，让我们一起编译完整的代码，如下代码段所示：\n\n`// main.rs`\n\n\
  ```rust\nuse windows::{\n    core::*, Win32::Foundation::*, Win32::Graphics::Gdi::ValidateRect,\n\
  \    Win32::System::LibraryLoader::GetModuleHandleA,\n    Win32::UI::WindowsAndMessaging::*,\n\
  };\nconst ID_BTN_PLUS: isize = 10;\nconst ID_BTN_MINUS: isize = 11;\nconst ID_BTN_MULTIPLY:\
  \ isize = 12;\nconst ID_BTN_DIVIDE: isize = 13;\nconst ID_BTN_C: isize = 14;\nconst\
  \ ID_BTN_EQ: isize = 15;\nconst ID_ST_RESULT: isize = 16;\nfn create_button(phwnd:\
  \ HWND, inst: HINSTANCE, txt: &str, x: i32, y: i32, w: i32, hmenu: HMENU) -> HWND\
  \ {\n    unsafe {\n        let hwnd = CreateWindowExA(\n            WS_EX_WINDOW,\n\
  \            \"button\",\n            txt,\n            WS_CHILD | WS_VISIBLE,\n\
  \            x,\n            y,\n            w,\n            phwnd,\n          \
  \  hmenu,\n            inst,\n            std::ptr::null_mut(),\n        );\n  \
  \      SetWindowTextW(hwnd, txt);\n        hwnd\n    }\n}\nfn main() -> Result<()>\
  \ {\n    unsafe {\n        let instance = GetModuleHandleA(None);\n        debug_assert!(instance\
  \ != 0);\n        let window_class = \"window\";\n        let wc = WNDCLASSSA {\n\
  \            hCursor: LoadCursorW(None, ARROW),\n            hInstance: instance,\n\
  \            lpszClassName: PSTR(b\"window\\0\".as_ptr()),\n            style: CS_HRAW\
  \ | CS_VRAW,\n            lpfnWndProc: Some(wndproc),\n            ..Default::default()\n\
  \        };\n        let atom = RegisterClassA(&wc);\n        debug_assert!(atom\
  \ != 0);\n        let hwnd = CreateWindowExA(\n            Default::default(),\n\
  \            window_class,\n            \"Calculator\",\n            WS_OVERAPPEDWINDOW\
  \ | WS_VISIBLE,\n            CW_USEDEFAULT,\n            CW_USEDEFAULT,\n      \
  \      215,\n            350,\n            None,\n            None,\n          \
  \  instance,\n            std::ptr::null_mut(),\n        );\n        for i in 1..10\
  \ {\n            let x = 15 + ((i-1) % 3)*60;\n            let y = ((i-1)/3)*40\
  \ + 60;\n            create_button(hwnd, instance, &i.to_string(), x, y, 50, HMENU(i\
  \ as isize));\n        }\n        create_button(hwnd, instance, \"0\", 15, 180,\
  \ HMENU(0));\n        create_button(hwnd, instance, \"+\", 15, 220, HMENU(ID_BTN_PLUS));\n\
  \        create_button(hwnd, instance, \"-\", 75, 220, HMENU(ID_BTN_MINUS));\n \
  \       create_button(hwnd, instance, \"*\", 135, 220, HMENU(ID_BTN_MULTIPLY));\n\
  \        create_button(hwnd, instance, \"/\", 15, 260, HMENU(ID_BTN_DIVIDE));\n\
  \        create_button(hwnd, instance, \"C\", 75, 260, HMENU(ID_BTN_C));\n     \
  \   create_button(hwnd, instance, \"=\", 135, 260, HMENU(ID_BTN_EQ));\n        let\
  \ hwndr = CreateWindowExA(\n            WS_EX_OVERAPPEDWINDOW,\n            \"static\"\
  ,\n            \"0\",\n            WS_CHILD | WS_VISIBLE,\n            15,\n   \
  \         10,\n            170,\n            30,\n            hwnd,\n          \
  \  HMENU(ID_ST_RESULT),\n            instance,\n            std::ptr::null_mut(),\n\
  \        );\n        SetWindowTextW(hwndr, \"0\");\n        let mut message = MSG::default();\n\
  \        while GetMessageA(&mut message, HWND(0), 0, 0).into() {\n            DispatchMessageA(&mut\
  \ message);\n        }\n        Ok(())\n    }\n}\nuse std::mem;\nstatic mut OP1:\
  \ i32 = 0;\nstatic mut OP2: i32 = 0;\nstatic mut OP: isize = 0;\nextern \"system\"\
  \ fn wndproc(window: HWND, message: u32, wparam: WPARAM, lparam: LPARAM) -> LRESULT\
  \ {\n    unsafe {\n        match message as u32 {\n            WM_PAINT => {\n \
  \               ValidateRect(window, std::ptr::null());\n                LRESULT(0)\n\
  \            }\n            WM_DESTROY => {\n                PostQuitMessage(0);\n\
  \                LRESULT(0)\n            }\n            WM_COMMAND => {\n      \
  \          let wp:isize = mem::transmute(wparam);\n                let disp = GetDlgItem(window,\
  \ ID_ST_RESULT as i32);\n                if wp >= 0 && wp <= 9 {\n             \
  \       OP2 = OP2*10 + wp as i32;\n                } else {\n                  \
  \  if OP == 0 || OP == ID_BTN_C { OP = wp; }\n                    match OP {\n \
  \                       ID_BTN_PLUS => {\n                            OP1 = OP1\
  \ + OP2;\n                        }\n                        ID_BTN_MINUS => {\n\
  \                            OP1 = OP1 - OP2;\n                        }\n     \
  \                   ID_BTN_MULTIPLY => {\n                            OP1 = OP1\
  \ * OP2;\n                        }\n                        ID_BTN_DIVIDE => {\n\
  \                            OP1 = OP1 / OP2;\n                        }\n     \
  \                   _ => {}\n                    }\n                    match wp\
  \ {\n                        ID_BTN_C => {\n                            OP1 = 0;\n\
  \                        }\n                        _ => {\n                   \
  \         println!(\"{}\", wp);\n                        }\n                   \
  \ }\n                    SetWindowTextW(disp, &*OP1.to_string());\n            \
  \        OP2 = 0;\n                    OP = wp;\n                }\n           \
  \     LRESULT(0)\n            }\n            _ => DefWindowProcA(window, message,\
  \ wparam, lparam),\n        }\n    }\n}\n```\n\n## 总结\n\n在本章中，你学习了如何使用 `windows`\
  \ 库调用任何 Windows API。你还借助 `windows` 库使用 Windows API 开发了一个简单的计算器应用程序。作为下一步，我们还建议你查看一下\
  \ **windows-sys** 库，它是针对最严苛的情况和最佳编译时间的*零开销回退* 方案。\n\n在下一章 *Rust for Android* 中，我们将探索\
  \ Rust 如何获得增长势头并获得行业范围的认可，特别是将 Rust 纳入 **Android 开源项目**（**AOSP**）的具体案例。\n\n## 问题\n\
  \n1. 什么是 `windows` 库？\n\n2. 使用 Rust 开发 Windows 程序的步骤有哪些？\n\n3. 更新计算器应用程序，添加一个对应操作\
  \ `xy`的按钮，该操作计算 `x` 的 `y` 次方。\n\n\n\n\n\n# 记忆点 (#toc.xhtml_s229a)\n\n*   Rust for\
  \ Windows 是 Windows 最新的语言绑定。\n\n*   `windows crate` 允许你将任何 Windows API 调用到你的 Rust\
  \ 包中，就像它们是另一个 Rust 模块一样。\n\n*   为了使用 `windows crate`，我们需要将其添加到 `Cargo.toml` 的 `dependencies`\
  \ 部分，并带上 `feature` 列表。\n\n*   我们将使用 `WNDCLASSA struct` 定义一个 `window` 类属性，并使用 `RegisterClassA`\
  \ 函数对其进行注册。\n\n*   `CreateWindowExA` API 用于创建窗口。它指定了窗口类、标题、样式以及（或）窗口的初始位置和大小。\n\n\
  *   我们可以在事件 `WM_COMMAND` 下的回调 `wndproc` 中捕捉不同按钮点击的事件。\n\n# 第十五章章 (#toc.xhtml_c15)\n\
  \n# Rust for Android (#toc.xhtml_c15)\n\n# 引言 (#toc.xhtml_s230a)\n\n在本章中，我们将探索 Rust\
  \ 如何获得动力并被整个行业认可，特别是将其纳入 Android 开源项目（`AOSP`）的案例。Android 操作系统开发的低层组件使用 `C` 和 `C++`\
  \ 等系统编程语言。Rust 提供了类似的低级控制和性能，但增加了内存保护。考虑到这一点，AOSP 现在支持使用 Rust 编程语言开发操作系统本身。我们将学习\
  \ Android 中不同的 Rust 模块，还将构建一个依赖于 Rust 库的 Rust 二进制文件。本章并不是为初开始 Android 编程的人准备的，因为这里不会涵盖\
  \ Android 编程的基础。\n\n# 结构 (#toc.xhtml_s231a)\n\n本章涵盖以下主题：\n\n*   Android 平台中的 Rust\n\
  *   Android 中的 Rust 模块\n*   开发一个 hello Rust 二进制文件\n\n# 目标 (#toc.xhtml_s232a)\n\n\
  在本章结束时，你应该熟悉 Android 中高危漏洞的主要来源，以及将 Rust 集到 Android 开源项目中如何帮助解决这个问题。你还将学习不同的 Android\
  \ Rust 模块类型，即 `rust_binary`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen` 及其属性。\n\n# Android 平台中的 Rust (#toc.xhtml_s233a)\n\n根据 `Google`\
  \ 的说法，`C` 和 `C++` 中的内存安全漏洞是最难解决的错误来源。内存漏洞的预防、检测和修复需要巨大的努力和资源。尽管如此，这类漏洞仍然是导致稳定性问题的的主要因素。这些漏洞占了\
  \ Android 高危安全漏洞的近 70%。\n\n# Android 上的系统编程 (#toc.xhtml_s234a)\n\n系统编程用于产生为其他软件提供服务的软件和软件平台，且通常受到性能限制。对于\
  \ Android 应用开发，开发者主要使用 `Java` 和 `Kotlin`，这些语言易用、可移植且安全。内存由 Android 运行时（`ART`）代表开发者管理。由于\
  \ Android 操作系统（`OS`）广泛使用 Java，Android 平台上大部分内存漏洞被避免了。然而，对于操作系统的底层，无法使用 Java 和 Kotlin。这些层需要\
  \ `C`、`C++` 和 `Rust` 等系统编程语言，这些语言提供了对底层系统资源和硬件的访问，并具有可预测的性能。\n\n在使用 `C` 和 `C++`\
  \ 时，管理内存生命周期的责任在于开发者，这使得很容易犯错，特别是在复杂和多线程环境中。幸运的是，我们有 Rust，它通过一系列检查提供了内存安全保证，同时保持了与\
  \ `C` 和 `C++` 相当的性能。Rust 使用编译时检查来强制对象生命周期和所有权，并使用运行时检查来确保内存访问有效，消除了对垃圾器的的需求。这使得\
  \ Rust 成为开发 Android 平台某些原生 OS 组件的理想人选。\n\n#  legacy C/C++ 代码 (#toc.xhtml_s235a)\n\
  \nAndroid 操作系统的大量代码库是基于 `C/C++` 构建的，要将所有代码替换为 Rust 这样内存安全的系统编程语言是非常困难的。幸运的是，根据 `Google`\
  \ 安全博客报告的数据，不需要这样做。它指出，平台上报告的漏洞约有 50% 是由于一年内编写的代码，这一比例随着代码库年龄的增加而急剧下降。换句话说，新的代码库是内存安全漏洞的来源，如下所示：\n\
  \n![](img/Image29484.jpg)\n\n**图 15.1：** Android 源码中内存安全漏洞的年龄。来源：Google 安全博客\n\n\
  因此，将新开发的重心转向 Rust 可以极大地减少内存安全漏洞。\n\n# 集成到 Android 开源项目 (#toc.xhtml_s236a)\n\nAndroid\
  \ 开源项目（`AOSP`）是一个开源项目，为开发 Android 操作系统的自定义变体提供信息和源代码。Android 的主要目的是为原始设备制造商（`OEMs`）、运营商和开发者创建一个开放的软件平台。Rust\
  \ 已引入 AOSP，作为 Android 平台原生代码开发的内存安全替代方案。\n\n# Android 中的 Rust 模块 (#toc.xhtml_s237a)\n\
  \nAndroid 中的 Rust 使用通过路径管理，限制了特定模块的使用位置。每个新路径必须添加到 `build/soong/rust/config.go`\
  \ 中。\n\n# Rust 模块定义 (#toc.xhtml_s238a)\n\n让我们通过以下示例了解如何定义 Rust 模块：\n\n```\nrust_binary\
  \ {\n    name: \"hello_rust\",\n    crate_name: \"hello_rust\",\n    srcs: [\"src/hello_rust.rs\"\
  ],\n}\n```\n\n在前面的示例中，我们定义了一个二进制文件。其他模块类型的过程类似。\n\n# 通用模块属性 (#toc.xhtml_s239a)\n\
  \n大多数属性，如 `name`、`crate_name`、`srcs` 等在所有 Rust 模块中通用的：\n\n# name (#toc.xhtml_s240a)\n\
  \n`name` 属性存储模块名称且必须唯一。默认情况下，`name` 作为文件名。\n\n# stem (#toc.xhtml_s241a)\n\n`stem`\
  \ 属性允许直接控制文件名。如果未给 `stem` 赋值，则采用模块名称作为默认文件。\n\n# srcs (#toc.xhtml_s242a)\n\n`srcs`\
  \ 属性包含代表模块入口的源文件。\n\n# crate_name (#toc.xhtml_s243a)\n\n`crate_name` 属性用于通过 `rustc\
  \ --crate_name` 参数设置 crate 名称。\n\n# lints (#toc.xhtml_s244a)\n\n默认情况下，对于源生成器以外的所有模块类型都会运行\
  \ `rustc` 检查器和 `clippy` 检查器。某些 lint 设置值，如 `default`、`android`、`vendor`、`none` 等，用于验证模块源码。\n\
  \n# edition (#toc.xhtml_s245a)\n\n`edition` 属性定义了编译代码时使用的 Rust 版本。它可以接受 `2015` 和\
  \ `2018` 的值。默认值为 `2018`。\n\n# flags (#toc.xhtml_s246a)\n\n`flags` 属性包含传递给 `rustc`\
  \ 进行编译的字符串标志列表。\n\n# ld_flags (#toc.xhtml_s247a)\n\n`ld-flags` 属性包含传递给链接器进行源码编译的字符串标志列表。这些通过\
  \ `-C link-args rustc` 参数传递。\n\n# features (#toc.xhtml_s248a)\n\n\n\n\n\n`features`\
  \ 属性是一个字符串特征列表，在编译期间必须启用这些特征，以便根据标志进行条件编译。它通过 `--cfg feature=\"${feature_name}”`\
  \ 传递给 `rustc`。\n\n# cfgs (#toc.xhtml_s249a)\n\n`cfgs` 属性包含字符串列表，表示编译期间要启用的 `cfg`\
  \ 标志。它通过 `--cfg` 选项传递给 `rustc`，例如 `--cfg foo` 或 `--cfg ‘foo = <value>’`。\n\n# strip\
  \ (#toc.xhtml_s250a)\n\n`strip` 属性控制输出文件的剥离（strip）方式。如果值为 `none`，则禁用剥离；如果值设置为 `all`，则将剥离所有内容，包括微型调试信息。有关其他值，请参考\
  \ *Soong Modules* 参考文档。\n\n# host_supported (#toc.xhtml_s251a)\n\n对于设备模块，`host_supported`\
  \ 参数表示该模块是否也提供主机变体。\n\n# Android Rust module types (#toc.xhtml_s252a)\n\n一些基础 Android\
  \ Rust 模块类型包括 `rust_binary`、`rust_binary_host`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen`。\n\n# rust_binary (#toc.xhtml_s253a)\n\n`rust_binary` 模块类型用于生成\
  \ Rust 二进制文件，如下代码所示：\n\n```\nrust_binary {\n  name: “hello_rust”,\n  crate_name:\
  \ “hello_rust”,\n  srcs: [“src/hello_rust.rs”],\n}\n```\n\n除了所有通用模块属性外，`rust_binary`\
  \ 一些独特行为。`rust_binary` 特有的重要属性如下：\n\n* `static_executable`: 用于将二进制文件构建为静态二进制，并表示\
  \ `prefer_rlib` 为 true。对于非 bionic 目标，它并不意味着完全静态的二进制文件；它仅意味着 `prefer_rlib` 为 true，且\
  \ `libc` 和 `libdl` 仍然进行动态链接。\n\n* `prefer_rlib`\n\n对于设备目标，`prefer_rlib` 属性更改 `rustlibs`\
  \ 链接，默认选择 `rlib` 链接，并将 `libstd` 作为 `rlib` 链接。它对主机目标没有影响。\n\n# rust_binary_host (#toc.xhtml_s254a)\n\
  \n`rust_binary_host` 模块类型与 `rust_binary` 模块类型类似，但它提供一个仅限主机的模块。\n\n# rust_library\
  \ (#toc.xhtml_s255a)\n\n`rust_library` 模块类型生成 Rust 库并提供 `rlib` 和 `dylib` 库变体。这是\
  \ Rust 库推荐的模块类型，允许模块与 `rustlibs` 属性正常工作。`rust_library_rlib` 和 `rust_library_dylib`\
  \ 分别提供 Rust 库的 `rlib` 和 `dylib` 变体，无法保证与 `rustlibs` 属性。\n\n# rust_ffi (#toc.xhtml_s256a)\n\
  \n`rust_ffi` 模块类型生成与 `CC` 模块兼容的 C 库，并提供 C 库的静态和共享变体。`rust_ffi_shared` 和 `rust_ffi_static`\
  \ 库类型分别提供 C 库的共享和静态变体。\n\n# rust_proc_macro (#toc.xhtml_s257a)\n\n`rust_proc_macro`\
  \ 模块的工作与 `rust_library` 模块类似。依赖 `rust_proc_macro` 的模块名称应添加到 `proc_macros` 属性中。\n\
  \n# rust_test (#toc.xhtml_s258a)\n\n此模块使用 `rustc` 的 `--test` 标志构建。`--test` 标志根据标记有\
  \ `#[test]` 特性的代码创建测试。我们可以像示例所示定义测试模块：\n\n```\nrust_test {\n  name: “sample_tests”,\n\
  \  srcs: [“src/lib.rs”],\n  test_suites: [“dummy-tests”],\n  auto_gen_config: true,\n\
  \  rustlibs: [\n    “libsample\",\n  ],\n}\n```\n\n通过 `test_suites` 设置，测试可以被 *Trade\
  \ Federation* `test` 测试框架轻松地发现。`auto_gen_config` 设置意味着是否自动创建测试配置。\n\n开发者可以使用测试映射定义在\
  \ Android 源码树中创建提交前和后的测试规则，这些是命名为 `TEST_MAPPING` 的 JSON 文件，可以放在任何源码中。\n\n# rust_fuzz\
  \ (#toc.xhtml_s259a)\n\n`features` 属性是一个字符串特征列表，在编译期间必须启用这些特征，以便根据标志进行条件编译。它通过 `--cfg\
  \ feature=\"${feature_name}”` 传递给 `rustc`。\n\n# cfgs (#toc.xhtml_s249a)\n\n`cfgs`\
  \ 属性包含字符串列表，表示编译期间要启用的 `cfg` 标志。它通过 `--cfg` 选项传递给 `rustc`，例如 `--cfg foo` 或 `--cfg\
  \ ‘foo = <value>’`。\n\n# strip (#toc.xhtml_s250a)\n\n`strip` 属性控制输出文件的剥离（strip）方式。如果值为\
  \ `none`，则禁用剥离；如果值设置为 `all`，则将剥离所有内容，包括微型调试信息。有关其他值，请参考 *Soong Modules* 参考文档。\n\n\
  # host_supported (#toc.xhtml_s251a)\n\n对于设备模块，`host_supported` 参数表示该模块是否也提供主机变体。\n\
