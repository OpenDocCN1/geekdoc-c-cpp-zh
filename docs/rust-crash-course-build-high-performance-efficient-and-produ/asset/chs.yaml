  \ <your.email@example.com>”\n  ],\n  “version”: “0.1.0”,\n  “files”: [\n    “hello_wasm_bg.wasm”,\n\
  \    “hello_wasm.js”,\n    “hello_wasm_bg.js”,\n    “hello_wasm.d.ts”\n  ],\n  “module”:\
  \ “hello_wasm.js”,\n  “types”: “hello_wasm.d.ts”,\n  “sideEffects”: false\n}\n```\n\
  \n10. 为了在网页中使用我们的 `hello-wasm` 包，我们在 `hello-wasm` 目录下运行以下命令：\n\n```bash\nnpm init\
