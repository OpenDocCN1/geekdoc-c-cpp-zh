  \ (#toc.xhtml_s259a)\n\n`features` 属性是一个字符串特征列表，在编译期间必须启用这些特征，以便根据标志进行条件编译。它通过 `--cfg\
  \ feature=\"${feature_name}”` 传递给 `rustc`。\n\n# cfgs (#toc.xhtml_s249a)\n\n`cfgs`\
  \ 属性包含字符串列表，表示编译期间要启用的 `cfg` 标志。它通过 `--cfg` 选项传递给 `rustc`，例如 `--cfg foo` 或 `--cfg\
  \ ‘foo = <value>’`。\n\n# strip (#toc.xhtml_s250a)\n\n`strip` 属性控制输出文件的剥离（strip）方式。如果值为\
  \ `none`，则禁用剥离；如果值设置为 `all`，则将剥离所有内容，包括微型调试信息。有关其他值，请参考 *Soong Modules* 参考文档。\n\n\
  # host_supported (#toc.xhtml_s251a)\n\n对于设备模块，`host_supported` 参数表示该模块是否也提供主机变体。\n\
  \n# Android Rust module types (#toc.xhtml_s252a)\n\n一些基础 Android Rust 模块类型包括 `rust_binary`、`rust_binary_host`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen`。\n\n# rust_binary (#toc.xhtml_s253a)\n\n`rust_binary` 模块类型用于生成\
  \ Rust 二进制文件，如下代码所示：\n\n```\nrust_binary {\n  name: “hello_rust”,\n  crate_name:\
  \ “hello_rust”,\n  srcs: [“src/hello_rust.rs”],\n}\n```\n\n除了所有通用模块属性外，`rust_binary`\
  \ 一些独特行为。`rust_binary` 特有的重要属性如下：\n\n* `static_executable`: 用于将二进制文件构建为静态二进制，并表示\
  \ `prefer_rlib` 为 true。对于非 bionic 目标，它并不意味着完全静态的二进制文件；它仅意味着 `prefer_rlib` 为 true，且\
  \ `libc` 和 `libdl` 仍然进行动态链接。\n\n* `prefer_rlib`\n\n对于设备目标，`prefer_rlib` 属性更改 `rustlibs`\
  \ 链接，默认选择 `rlib` 链接，并将 `libstd` 作为 `rlib` 链接。它对主机目标没有影响。\n\n# rust_binary_host (#toc.xhtml_s254a)\n\
  \n`rust_binary_host` 模块类型与 `rust_binary` 模块类型类似，但它提供一个仅限主机的模块。\n\n# rust_library\
  \ (#toc.xhtml_s255a)\n\n`rust_library` 模块类型生成 Rust 库并提供 `rlib` 和 `dylib` 库变体。这是\
  \ Rust 库推荐的模块类型，允许模块与 `rustlibs` 属性正常工作。`rust_library_rlib` 和 `rust_library_dylib`\
  \ 分别提供 Rust 库的 `rlib` 和 `dylib` 变体，无法保证与 `rustlibs` 属性工作。\n\n# rust_ffi (#toc.xhtml_s256a)\n\
  \n`rust_ffi` 模块类型生成与 `CC` 模块兼容的 C 库，并提供 C 库的静态和共享变体。`rust_ffi_shared` 和 `rust_ffi_static`\
  \ 库类型分别提供 C 库的共享和静态变体。\n\n# rust_proc_macro (#toc.xhtml_s257a)\n\n`rust_proc_macro`\
  \ 模块的工作与 `rust_library` 模块类似。依赖 `rust_proc_macro` 的模块名称应添加到 `proc_macros` 属性中。\n\
  \n# rust_test (#toc.xhtml_s258a)\n\n此模块使用 `rustc` 的 `--test` 标志构建。`--test` 标志根据标记有\
  \ `#[test]` 特性的代码创建测试。我们可以像示例所示定义测试模块：\n\n```\nrust_test {\n  name: “sample_tests”,\n\
  \  srcs: [“src/lib.rs”],\n  test_suites: [“dummy-tests”],\n  auto_gen_config: true,\n\
  \  rustlibs: [\n    “libsample\",\n  ],\n}\n```\n\n通过 `test_suites` 设置，测试可以被 *Trade\
  \ Federation* `test` 测试框架轻松地发现。`auto_gen_config` 设置意味着是否自动创建测试配置。开发者可以使用测试映射定义在\
  \ Android 源码树中创建提交前和后的测试规则，这些是命名为 `TEST_MAPPING` 的 JSON 文件，可以放在任何源码中。\n\n# rust_fuzz\
  \ (#toc.xhtml_s259a)\n\n`features` 属性是一个字符串特征列表，在编译期间必须启用这些特征，以便根据标志进行条件编译。它通过 `--cfg\
  \ feature=\"${feature_name}”` 传递给 `rustc`。\n\n# cfgs (#toc.xhtml_s249a)\n\n`cfgs`\
  \ 属性包含字符串列表，表示编译期间要启用的 `cfg` 标志。它通过 `--cfg` 选项传递给 `rustc`，例如 `--cfg foo` 或 `--cfg\
  \ ‘foo = <value>’`。\n\n# strip (#toc.xhtml_s250a)\n\n`strip` 属性控制输出文件的剥离（strip）方式。如果值为\
  \ `none`，则禁用剥离；如果值设置为 `all`，则将剥离所有内容，包括微型调试信息。有关其他值，请参考 *Soong Modules* 参考文档。\n\n\
  # host_supported (#toc.xhtml_s251a)\n\n对于设备模块，`host_supported` 参数表示该模块是否也提供主机变体。\n\
  \n# Android Rust module types (#toc.xhtml_s252a)\n\n一些基础 Android Rust 模块类型包括 `rust_binary`、`rust_binary_host`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen`。\n\n# rust_binary (#toc.xhtml_s253a)\n\n`rust_binary` 模块类型用于生成\
  \ Rust 二进制文件，如下代码所示：\n\n```\nrust_binary {\n  name: “hello_rust”,\n  crate_name:\
  \ “hello_rust”,\n  srcs: [“src/hello_rust.rs”],\n}\n```\n\n除了所有通用模块属性外，`rust_binary`\
  \ 一些独特行为。`rust_binary` 特有的重要属性如下：\n\n* `static_executable`: 用于将二进制文件构建为静态二进制，并表示\
  \ `prefer_rlib` 为 true。对于非 bionic 目标，它并不意味着完全静态的二进制文件；它仅意味着 `prefer_rlib` 为 true，且\
  \ `libc` 和 `libdl` 仍然进行动态链接。\n\n* `prefer_rlib`\n\n对于设备目标，`prefer_rlib` 属性更改 `rustlibs`\
  \ 链接，默认选择 `rlib` 链接，并将 `libstd` 作为 `rlib` 链接。它对主机目标没有影响。\n\n# rust_binary_host (#toc.xhtml_s254a)\n\
  \n`rust_binary_host` 模块类型与 `rust_binary` 模块类型类似，但它提供一个仅限主机的模块。\n\n# rust_library\
  \ (#toc.xhtml_s255a)\n\n`rust_library` 模块类型生成 Rust 库并提供 `rlib` 和 `dylib` 库变体。这是\
  \ Rust 库推荐的模块类型，允许模块与 `rustlibs` 属性正常工作。`rust_library_rlib` 和 `rust_library_dylib`\
  \ 分别提供 Rust 库的 `rlib` 和 `dylib` 变体，无法保证与 `rustlibs` 属性工作。\n\n# rust_ffi (#toc.xhtml_s256a)\n\
  \n`rust_ffi` 模块类型生成与 `CC` 模块兼容的 C 库，并提供 C 库的静态和共享变体。`rust_ffi_shared` 和 `rust_ffi_static`\
  \ 库类型分别提供 C 库的共享和静态变体。\n\n# rust_proc_macro (#toc.xhtml_s257a)\n\n`rust_proc_macro`\
  \ 模块的工作与 `rust_library` 模块类似。依赖 `rust_proc_macro` 的模块名称应添加到 `proc_macros` 属性中。\n\
  \n# rust_test (#toc.xhtml_s258a)\n\n此模块使用 `rustc` 的 `--test` 标志构建。`--test` 标志根据标记有\
  \ `#[test]` 特性的代码创建测试。我们可以像示例所示定义测试模块：\n\n```\nrust_test {\n  name: “sample_tests”,\n\
  \  srcs: [“src/lib.rs”],\n  test_suites: [“dummy-tests”],\n  auto_gen_config: true,\n\
  \  rustlibs: [\n    “libsample\",\n  ],\n}\n```\n\n通过 `test_suites` 设置，测试可以被 *Trade\
  \ Federation* `test` 测试框架轻松地发现。`auto_gen_config` 设置意味着是否自动创建测试配置。开发者可以使用测试映射定义在\
  \ Android 源码树中创建提交前和后的测试规则，这些是命名为 `TEST_MAPPING` 的 JSON 文件，可以放在任何源码中。\n\n# rust_bindgen\
  \ (#toc.xhtml_s260a)\n\n`rust_bindgen` 模块类型用于生成 `bindgen` 绑定。`Bindgen` 生成对 C（及 C++）库的\
  \ Rust FFI 绑定。本质上，它从 `cc_library` 和头文件生成一个 rust 源文件：\n\n1.  让我们定义一个 C 头文件 `libbind.h`，其中有\
  \ `struct st` 的定义和函数 `foo`，如下代码所示：\n\n```c\ntypedef struct st {\n  int x;\n} st;\n\
  \nvoid foo(int i, st* s);\n```\n\n2.  现在，我们在 C 源码文件 `libbind.c` 中定义函数 `foo`，如下代码所示：\n\
  \n```c\n#include <stdio.h>\n#include \"libbind.h\"\n\nvoid foo(int i, st* s){\n\
  \  printf(\"i = %i, s.x = %i\\n\", i, s->x);\n}\n```\n\n3.  接下来，我们将定义一个 `rust_bindgen`\
  \ 模块。为此，我们首先需要定义一个包装头，例如 `libbind_wrapper.h`，它包含了生成绑定所需的所有头文件：\n\n```c\n#include\
  \ \"libbind.h\"\n```\n\n然后，我们定义 `Android.bp` 文件：\n\n```bp\ncc_library {\n  name:\
  \ “libbind”,\n  srcs: [“libbind.c”],\n}\n\nrust_bindgen {\n  name: “libbind_bindgen”,\n\
  \  crate_name: “crate_bindgen”,\n  wrapper_src: “libbind_wrapper.h”,\n  source_stem:\
  \ “bindings”,\n  shared_libs: [“libbind”],\n}\n```\n\n\n\n\n在前面的代码段中，`crate_name`\
  \ 字段表示用于生成 `rust_library` 变体的 crate 名称，`wrapper_src` 表示包装器源文件的路径，而 `source_stem`\
  \ 控制输出文件名。在这里，我们使用了 `bindings` 作为值，它会生成 `bindings.rs`。该文件名被 `include!` 宏中使用。\n\n\
  4. 现在，我们将这些绑定项作为一个 crate 来使用。因此，我们创建一个 `Android.bp` 文件，如下所示：\n\n```\nrust_binary\
  \ {\n    name: “hello_bindgen”,\n    srcs: [“main.rs”],\n    rustlibs: [“libbind_bindgen”],\n\
  }\n```\n\n在前面的代码段中，我们将 `rust_bindgen` 模块 `libbind_bindgen` 作为 `rust_library` 依赖项添加了。现在，我们创建\
  \ `main.rs` 文件来测试 `bindgen` 绑定，如下所示：\n\n```rust\nfn main() {\n    let mut x = crate_bindgen::st\
  \ { x: 2 };\n    unsafe { crate_bindgen::foo(1, &mut x as *mut crate_bindgen::st)\
  \ }\n}\n```\n\n5. 最后，调用 `m hello_bindgen` 来构建二进制文件。\n\n# 开发一个 Hello Rust 模块\n\n\
  让我们构建一个依赖 Rust 库的 Rust 二进制文件。Rust 模块被限于 `build/soong/rust/config/allowed_list.go`\
  \ 中定义的特定目录。以下 `helloRust` 模块使用 `external/rust` 是为了避免修改允许列表：\n\n```\nmkdir -p external/rust/hello_rust/src/\n\
  mkdir -p external/rust/libhello_world/src/\n```\n\n然后，我们创建 `external/rust/hello_rust/src/hello_rust.rs`\
  \ 文件，其中包含以下代码段：\n\n```rust\nuse hello_world;\nfn main() {\n    hello_world::hello_rust();\n\
  }\n```\n\n接着，我们如下所示创建 `external/rust/libhello_world/src/lib.rs` 文件：\n\n```rust\n\
  pub fn hello_rust() {\n    println!(“Hello Rust!”);\n}\n```\n\n接下来，我们如下所示创建 `external/rust/hello_rust/Android.bp`\
  \ 文件：\n\n```\nrust_binary {\n    name: “hello_rust”,\n    srcs: [“src/hello_rust.rs”],\n\
  \    rustlibs: [“libhello_world”],\n}\n```\n\n然后，我们创建一个包含以下代码段的 `external/rust/libhello_world/Android.bp`\
  \ 文件：\n\n```rust\nrust_library {\n    name: “libhello_world”,\n    crate_name: “hello_world”,\n\
  \    srcs: [“src/lib.rs”],\n}\n```\n\n在前面的示例中，我们将名称设置为 `libhello_world`。通常情况下，`name`\
  \ 或 `stem` 属性必须是 `lib<crate_name><any_suffix>` 的形式。`crate_name` 必须与源码中名称匹配。\n\n\
  最后，让我们构建我们的 `hello_rust` 模块：\n\n```\nsource build/envsetup.sh\nlunch aosp_arm64-eng\n\
  m hello_rust\n```\n\n## 结论\n\n在本章中，你学习了 Android 中高严重漏洞的主要来源，以及将 Rust 集成到 Android\
  \ 开源项目如何帮助解决这个问题。你还学习了不同的 Android Rust 模块类型，即 `rust_binary`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen` 及其属性。你还开发了一个 `hello` Rust 模块。\n\n在下一章中，*项目 1 – 构建 CLI 应用*，我们将使用\
  \ Rust 构建一个名为 `To-Do List` 的命令行应用。\n\n## 问题\n\n1. 什么是系统编程？列举一些流行的系统编程语言。\n2. Android\
  \ 高严重安全漏洞的主要来源是什么？\n3. 为什么 Java 和 Kotlin 等语言不能用于 Android 操作系统的底层？\n4. 列出五个常见的 Android\
  \ Rust 模块属性。\n5. 列出 Android 中的五个 Rust 模块类型。\n\n## 注意事项\n\n- C 和 C++ 中的内存安全漏洞是最难解决的错误来源。\n\
  - 系统编程用于产生向其他软件提供服务的软件和软件平台，通常受到性能限制。\n- Android 系统的低层需要 C、C++ 和 Rust 等系统编程语言。\n\
  - AOSP 是一个开源项目，为开发 Android 系统的自定义变体提供信息和源码。\n- Android 中 Rust 的使用通过路径列表管理，该列表限制了特定\
  \ Rust 模块类型可以使用的位置。若要在新路径中使用 Rust 模块，必须将其添加到 `build/soong/rust/config/allowed_list.go`\
  \ 中相应的允许列表中。\n- `name` 属性存储模块名称且必须是唯一的。\n- `srcs` 属性包含一个代表模块入口的单一源文件。\n- 一些基础 Android\
  \ Rust 模块类型有 `rust_binary`、`rust_binary_host`、`rust_library`、`rust_ffi`、`rust_proc_macro`、`rust_test`、`rust_fuzz`\
  \ 和 `rust_bindgen`。\n\n# 第 16 章\n\n# 项目 1 – 构建 CLI 应用\n\n## 引言\n\n在本章中，我们将构建一个命令行界面（CLI）应用程序。命令行应用是学习\
  \ Rust 的极佳方式。在本章中，我们将开发一个待办列表应用。\n\n## 结构\n\n项目中应用的主要概念如下：\n\n- 结构体 (Structs)\n\
  - 错误处理\n- 闭包和迭代器\n- 所有权和借用\n- 库 (Crates)\n- 文件处理\n\n因此，建议在开始本章之前复习这些概念。本章的结构如下：\n\
  \n- 定义待办事项\n- 实现列表\n- 运行应用\n\n## 目标\n\n在本章结束时，你应该熟悉如何应用 Rust 概念开发命令行应用。你将开始体会 Rust\
  \ 组件如何在开发实用应用的过程中协作工作。\n\n## 待办列表\n\n待办列表应该保存我们想要执行的操作列表，并可选地跟踪它们的进度。假设我们要实现一个存储不同任务的待办列表，每个任务处于三种状态之一：**待办\
  \ (To do)**、**进行中 (In progress)** 和**已完成 (Done)**。我们的应用程序应该接收状态和任务名称作为命令行。\n\n##\
  \ 实现待办列表\n\n在本节中，我们将实现一个名为待办列表的命令行应用。让我们看看实现的步骤。\n\n## 创建项目\n\n首先，使用以下命令创建一个名为 `todo-list`\
  \ 的项目：\n\n```\ncargo new todo-list\n```\n\n这将创建一个简单的 `hello-world` 项目，包含 `Cargo.toml`\
  \ 和 `src/main.rs` 文件。目前，`main` 函数应该有一个简单的 `print` 语句，如果你使用 `cargo run` 运行项目，你应该会在控制台看到\
  \ `Hello World!!`。\n\n## 捕获命令行参数\n\n现在，让我们修改 `main` 函数以捕获命令行参数，如下代码所示：\n\n```rust\n\
  fn main() {\n    let args: Vec<String> = std::env::args().collect();\n    if args.len()\
  \ < 3 {\n        panic!(“传递的参数太少…”);\n    }\n    let action = args[1].clone();\n\
  \    let task = args[2].clone();\n}\n```\n\n\n\n\n在前面的代码段中，我们期望用户在运行 `cargo run`\
  \ 时输入两个命令行参数。第一个参数表示一个操作，第二个参数表示要添加到待办列表（To-do list）中的任务。我们使用 `std::env::args()`\
  \ 来获取命令行参数。`std::env::args()` 函数返回一个 `Args` 迭代器，可以对其进行迭代或收集到一个向量中以获取参数列表。第一个参数是程序本身。因此，我们对第二个和第三个参数感兴趣，它们分别表示\
  \ `action`（操作）和 `task`（任务）。操作的可能值可以是 `add`、`start` 或 `done`。`add` 值表示一个需要添加到待办列表的新任务。`start`\
  \ 值将待办列表中已存在的任务状态更新为 `In Progress`（进行中）。`done` 值告诉我们的应用程序将待办列表的任务状态更新为 `Done`（已）。在这种情况下，我们不会删除任务，因为跟踪已完成的任务可能是有用的。如果用户没有传递所有参数，程序将带有\
  \ `Too less arguments passed…` 消息发生崩溃（panic），如下输出所示：\n\n![](img/Image29934.jpg)\n\
  \n**图 16.1:** 传递参数较少时的错误消息\n\n## 定义 Todo 结构\n\n现在我们已经有了参数，可以使用这些参数向待办列表添加新任务，或更新列表中现有任务的状态。我们将定义一个名为\
  \ `Todo` 的结构体，其中包含一个存储任务及其对应状态的 `hashmap`，如下代码段所示：\n\n```rust\nstruct Todo {\n \
  \   map: HashMap<String, String>,\n}\n```\n\n## 实现 Todo 结构体的方法\n\n遵循以下步骤：\n\n1.\
  \ 让我们为刚刚定义的 `Todo` 结构定义几个对应的方法。特别是，我们将为该 `struct` 定义 `new()`、`insert()`、`save()`、`start()`\
  \ 和 `done()` 方法。在 `new()` 方法中，我们打开一个名为 `todo.db` 的文本文件，以便在应用程序的不同运行之间持久化任务及其状态。如果是第一次运行应用程序，将创建一个空文件。在随后的运行中，将读取由任务及其状态组成的文件内容，并将其添加到\
  \ `Todo struct` 内部 `hashmap` 中，如下代码段所示：\n\n```rust\nimpl Todo {\n    fn new() ->\
  \ Result<Todo, std::io::Error> {\n        let mut f = std::fs::OpenOptions::new()\n\
  \            .write(true)\n            .create(true)\n            .read(true)\n\
  \            .open(\"todo.db\")?;\n        let mut content = String::new();\n  \
  \      f.read_to_string(&mut content)?;\n        let map: HashMap<String, String>\
  \ = content\n            .lines()\n            .map(|line| line.split(\" : \").collect::<Vec<&str>>())\n\
  \            .map(|v| (v[0], v[1]))\n            .map(|(k, v)| (String::from(k),\
  \ String::from(v)))\n            .collect();\n        Ok(Todo { map })\n    }\n\
  }\n```\n\n2. 接下来，我们需要定义一个 `insert()` 的方法向列表添加新任务。在 `insert` 方法中，我们简单地将任务名称作为键并将状态\
  \ `To Do` 作为值，如下代码段所示：\n\n```rust\nfn insert(&mut self, key: String) {\n    self.map.insert(key,\
  \ String::from(\"To Do\"));\n}\n```\n\n3. 然后，我们定义一个 `start()` 方法，它接受任务名称作为参数，在待办列表中找到该任务并将其状态更新为\
  \ `In Progress`，如下代码段所示：\n\n```rust\nfn start(&mut self, key: &String) -> Option<()>\
  \ {\n    match self.map.get_mut(key) {\n        Some(v) => Some(*v = String::from(\"\
  In Progress\")),\n        None => None,\n    }\n}\n```\n\n4. 同样，我们定义了一个函数 `done()`，它也接受任务名称作为参数，并将待办列表中的状态更新为\
  \ `Done`，如下代码段所示：\n\n```rust\nfn done(&mut self, key: &String) -> Option<()> {\n\
  \    match self.map.get_mut(key) {\n        Some(v) => Some(*v = String::from(\"\
  Done\")),\n        None => None,\n    }\n}\n```\n\n5. 最后，我们需要一个 `save()` 方法将 `Todo\
  \ struct` 的内容写入数据库文件 `todo.db`，以便在后续运行中使用，如下所示：\n\n```rust\nfn save(&self) -> Result<(),\
  \ std::io::Error> {\n    let mut content = String::new();\n    for (k, v) in self.map\
  \ {\n        let record = format!(\"{} : {}\", k, v);\n        content.push_str(&record);\n\
  \    }\n    std::fs::write(\"todo.db\", content)\n}\n```\n\n\n\n\n是时候用一些用例来测试我们的命令行应用程序了。让我们向待办列表（To-do\
  \ list）添加几个任务并更新某些任务的状态，如下终端输出所示：\n\n![](img/Image29943.jpg)\n\n**图 16.2：** *显示在待办列表中添加/更新任务的输出*\n\
  \n如果你检查数据库文件 `todo.db` 的内容，它应该是这样的：\n\n![](img/Image29950.jpg)\n\n**图 16.3：** *向待办列表添加/更新任务后\
  \ todo.db 文件的内容*\n\n在上一个示例中，我们向待办列表添加了两个，即 `Run 5 miles`（跑步 5 英里）和 `Study Rust`（学习\
  \ Rust）。这些任务添加时的状态为 `To Do`（待办）。然后，我们启动了 `Study Rust` 任务，根据我们的代码逻辑，它的状态变为 `In Progress`（进行中）。\n\
  \n## 结论\n\n在本章中，你学习了如何将不同的 Rust 概念组合起来开发一个名为 `To-do list` 的简单命令行应用程序。通过这个简单应用的帮助，你学会了在开始开发过程之前收集项目需求并定义不同的用例。一旦需求确定，我们应该开始开始定义应用程序的不同结构，并根据不同的用例处理不同的场景。\n\
  \n在下一章中，*项目 2 – 从 Web 浏览器运行 Rust*，我们将使用 Rust 开发一个用于用户名和密码认证的 Web 应用程序。\n\n## 问题\n\
  \n1.  我们如何在运行程序时获取传递给程序的命令行参数？\n2.  修改在本章实现的待办列表应用程序，使其在任务完成后自动从待办列表中删除。\n3.  更新待办应用程序的\
  \ `main()` 函数，以处理传递的参数数量超过预期的情况。\n\n## 记忆点\n\n*   可以使用 `std::env::args()` 来捕获命令行参数。\n\
  *   `std::env::args()` 函数返回一个 `Args` 迭代器，可以对其进行迭代或将其收集到向量中获取参数列表。\n*   第一个命令行参数是程序本身。\n\
  *   我们必须在开始开发过程之前收集项目需求并定义不同的用例。\n*   一旦项目需求确定，我们应该开始定义应用程序的不同结构，并根据不同的用例处理不同的场景。\n\
  \n## 第 17 章\n\n## 项目 2 – 从 Web 浏览器运行 Rust\n\n## 介绍\n\n在本章中，我们将开发一个用于用户名和密码认证的 Web\
  \ 应用程序。如果用户名和密码匹配，它将显示 *success*（成功）消息；否则，将显示 *failure*（失败）消息。该应用程序可以在浏览器中运行，并具有基本的\
  \ UI 组件，如用户名和密码字段，以及登录、重置和注销按钮。\n\n## 结构\n\n本章涵盖了以下主题：\n\n*   WebAssembly\n*   在\
  \ Rust 代码中引入 HTML\n*   数据库\n*   Docker\n\n## 目标\n\n在本章结束，你应该熟悉如何在 JavaScript 代码中使用\
  \ Rust 的功能和性能，并借助由 Rust 生成的 `wasm` 二进制文件实现*接近原生性能*。你还将学习如何组织 Web 项目以使用用 Rust 编写的函数。\n\
  \n## WebAssembly\n\nWebAssembly 可以在浏览器中运行的代码类型。它是一种底层类汇编语言，具有紧凑的二进制格式，以接近原生性能运行，并为\
  \ C、C++、C# 和 Rust 等语言提供了编译目标，以便它们可以在 Web 上运行。它的设计是为了与 JavaScript 并行运行，两者互为补充。你可以使用\
  \ WebAssembly JavaScript API 将 WebAssembly 模块加载到 JavaScript 应用程序中并在两者之间共享功能。这允许你利用\
  \ WebAssembly 的强大功能和性能以及 JavaScript 的表达力和灵活性。\n\nRust 代码可以编译为 WebAssembly (`wasm`)。使用\
  \ Rust 和 WebAssembly 有两种主要方式：\n\n*   基于 Rust 构建整个 Web 应用程序，以及\n*   在现有的 JavaScript\
  \ 前端使用 Rust，从而使用 Rust 构建现有 Web 应用程序的一部分。\n\n在本章中，我们将关注后一种用例。我们将使用 `wasm-pack`，这是一个用于在\
  \ Rust 中构建 JavaScript 包的工具。该包仅包含 WebAssembly 和 JavaScript 代码，不需要安装 Rust。\n\n## 环境配置\n\
  \n让我们看看如何配置环境以将 Rust 程序编译为 WebAssembly 并将其集成到 JavaScript 中。\n\n## 安装 Rust\n\n你需要安装标准的\
  \ Rust 工具链，包括 `rustup`、`rustc` 和 `cargo`（参考*第 1 章，设置与安装*）。\n\n## wasm-pack\n\n我们需要一个额外的工具\
  \ `wasm-pack` 来构建、测试和发布 Rust 生成的 WebAssembly。可以使用以下命令进行下载和安装：\n\n```bash\ncargo\
  \ install wasm-pack\n```\n\n或者，你可以使用以下命令：\n\n```bash\ncurl https://rustwasm.github.io/wasm-pack/init.sh\
  \ -sSf | sh\n```\n\n如果你遇到任何问题，也可以参考以下页面进行安装：`https://rustwasm.github.io/wasm-pack/`\n\
  \n## cargo-generate\n\n你还可以安装 `cargo-generate` 工具，它可以帮助你使用现有的 Git 仓库作为模板来快速启动一个新的\
  \ Rust 项目。可以使用以下命令安装：\n\n```bash\ncargo install cargo-generate\n```\n\n## npm\n\n\
  npm 是 JavaScript 的包管理器。它可以用于安装 JavaScript 绑定器和开发服务器。我们将编译后的 `.wasm` 发布到 `npm` 注册表。\n\
  \n使用以下命令安装 `npm`：\n\n```bash\nsudo apt install npm\n```\n\n通过以下命令检查 `npm` 版本：\n\n\
  ```bash\nnpm --version\n```\n\n如果系统中已经安装了 `npm`，请确保使用以下命令更新：\n\n```bash\nnpm install\
  \ npm@latest -g\n```\n\n## 创建 hello-wasm 项目\n\n现在准备就绪，我们可以创建一个简单的 hello-wasm 项目：\n\
  \n1.  我们将使用 `cargo generate` 在预定义的模板中创建新项目：\n\n    ```bash\n    cargo generate --git\
  \ https://github.com/rustwasm/wasm-pack-template\n    ```\n\n    运行上述命令会提示输入项目名称，所示：\n\
  \n    ![](img/Image3018.jpg)\n\n    **图 17.1：** *使用 cargo generate 创建新项目*\n\n2.\
  \  输入项目名称 `hello-wasm`，它将在预定义的模板中生成项目及其文件，所示：\n\n    ![](img/Image3026.jpg)\n\n\
  \    **图 17.2：** *使用 cargo generate 生成的 hello-wasm 输出*\n\n3.  如果我们进入 hello-wasm\
  \ 项目，其结构所示：\n\n    ![](img/Image3033.jpg)\n\n    **图 17.3：** *hello-wasm 项目结构*\n\
  \n4.  `Cargo.toml` 文件指定了 cargo（Rust 包管理器和构建工具）的依赖项和元数据。如果你查看 Cargo.toml 文件的内容，你会发现它已经包含了\
  \ `wasm-bindgen` 依赖，如下：\n\n    ```toml\n    [dependencies]\n    wasm-bindgen = \"\
  0.2.63\"\n    ```\n\n\n\n5. `src/lib.rs` 文件使用 `wasm-bindgen` 与 JavaScript 交互。它导入了\
  \ `window.alert` JavaScript 函数并导出了 `greet` Rust 函数，该函数会弹出一个问候消息，如下代码所示：\n\n```rust\n\
  #[wasm_bindgen]\nextern {\n  fn alert(s: &str);\n}\n#[wasm_bindgen]\npub fn greet()\
  \ {\n  alert(“Hello, hello-wasm!”);\n}\n```\n\n6. 接下来，我们使用 `wasm-pack build` 命令构建\
  \ `hello-wasm` 项目，如附所示：\n\n![](img/Image30343.jpg)\n\n**图 17.4:** 使用 wasm-pack 构建\
  \ hello-wasm 项目\n\n7. 构建完成后，其产物将生成在 `pkg` 目录中，内容如下：\n\n```\n├── pkg/\n   ├── package.json\n\
  \   ├── README.md\n   ├── hello_wasm_bg.js\n   ├── hello_wasm_bg.wasm\n   ├── hello_wasm_bg.wasm.d.ts\n\
  \   ├── hello_wasm.d.ts\n   └── hello_wasm.js\n```\n\n`.wasm` 文件 `hello-wasm/pkg/hello_wasm_bg.wasm`\
  \ 是 Rust 编译器从我们的 Rust 源生成的 WebAssembly 二进制文件。它包含了我们所有 Rust 函数和数据的 `wasm` 版本。例如，它包含一个导出的\
  \ `greet` 函数。\n\n8. `.js` 文件 `hello-wasm/pkg/hello_wasm_bg.js` 由 `wasm-bindgen`\
  \ 生成，它允许将 DOM 和 JavaScript 函数导入 Rust，并向 JavaScript 暴露给 WebAssembly 函数的 API。它包含了\
  \ `greet` 函数，该函数封装了从 WebAssembly 模块导出的 `greet` 函数，如下代码所示：\n\n```javascript\nimport\
  \ * as wasm from ‘./hello_wasm_bg.wasm’;\n// …\nexport function greet() {\n  wasm.greet();\n\
  }\n```\n\n9. `hello-wasm/pkg/package.json` 文件包含了关于生成的 JavaScript 和 WebAssembly 包的元数据：\n\
