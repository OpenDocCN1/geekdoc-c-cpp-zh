  ).style.visibility = \"hidden\";\n      document.getElementById(\"Uname\").style.visibility\
  \ = \"hidden\";\n      document.getElementById(\"Pass\").style.visibility = \"hidden\"\
  ;\n      document.getElementById(\"btn_reset\").style.visibility = \"hidden\";\n\
  \      document.getElementById(\"btn_login\").value = \"Log Out\";\n    }\n    document._(\"\
  \").style.\").style.visibility = \"    \";\n    document.getElementById(\"btn_reset\"\
  ).style.visibility = \"visible\";\n    document.getElementById(\"btn_login\").value\
  \ = \"Log In\";\n  } else {\n    document.getElementById(\"lbl_uname\").style.visibility\
  \ = \"visible\";\n    document.getElementById(\"lbl_pwd\").style.visibility = \"\
  visible\";\n    document.getElementById(\"Uname\").style.visibility = \"visible\"\
  ;\n    document.getElementById(\"Pass\").style.visibility = \"visible\";\n    document.getElementById(\"\
  btn_reset\").style.visibility = \"visible\";\n    document.getElementById(\"btn_login\"\
  ).value = \"Log In\";\n  }\n}\n```\n（注：提供的 index.js 文本包含一些重复/损坏的行；我已经清理了逻辑以匹配所提供的上下文，同时保留了核心结构和函数调用。）\n\
  \n\n\n\n在我们的 `wasm-login` Web 应用程序中，我们使用了硬编码的值 `abhishek` 和 `rust` 来匹配用户输入的用户名和密码值，如果值匹配，我们返回\
  \ `true` 表示身份验证成功，否则返回 `false`。然而，在实际应用中，应用程序可能有许多用户，将用户详情存储在代码中既不实际也不安全。因此，你应该在某些数据库中存储用户和应用程序数据，并在需要时从代码中获取数据。所以，你应该更新登录逻辑以从数据库中获取详情。\n\
  \n## Docker\n\nWebAssembly 是由*万维网联盟*（World Wide Web Consortium）发布的规范，用于创建可以像容器一样运行的高效二进制执行文件。它具有成为\
  \ Docker 部署单元的重要替代品的潜力。Docker 的创始人 *Solomon Hykes* 在 *2019 年* 推文中道：“如果在 2008 年存在\
  \ WASM+WASI，我们就不需要创建 Docker 了。”\n\nWebAssembly 和 Docker 都共享宿主机的资源。Docker 使用操作系统级虚拟化来创建名为容器的软件包软件。容器之间是相互隔离的，并且拥有自己的库、软件和配置文件。相反，WebAssembly\
  \ 是一种旨在在 WebAssembly 虚拟机下运行的编译二进制文件。WebAssembly 二进制文件可以使用 C、C++ 或 Rust 等语言编写。WebAssembly\
  \ 执行文件通过将源代码编译为 WebAssembly 虚拟机特有的二进制格式创建，产生体积小、速度快且接近原生速度的二进制文件。\n\n## 结论\n\n在本章中，你学习了如何在\
  \ JavaScript 中使用 Rust 的力量和性能。你使用标准 JavaScript 开发了一个简单的用户登录应用程序，并学习了如何将一些性能密集型的后端任务委托给\
  \ Rust。\n\n在下一章中，*Project 3 – 嵌入式 Rust Hello World*，我们将使用 `QEMU`（一个流行的开源*硬件模拟器*）实现一个\
  \ *hello world* 应用。\n\n## 问题\n\n1. 什么是 WebAssembly？\n2. 使用 Rust 和 WebAssembly 的两种主要方式是什么？\n\
  3. `wasm-pack` 是什么？如何安装它？\n4. `npm` 是什么？安装它的命令是什么？\n5. 创建一个 Web 应用程序接受用户输入的两个数字和一个二运算符，并在屏幕上返回结果。对应二运算符的操作函数应该用\
  \ Rust 编写，并在 JavaScript 代码中调用。\n\n## 注意事项\n\n* WebAssembly 是一种可以在 浏览器中运行的代码类型。\n\
  * WebAssembly 设计为与 JavaScript 并行运行，它们互为互补。\n* `wasm-pack` 工具用于构建、测试和发布 Rust 生成的\
  \ WebAssembly。\n* `npm` 是 JavaScript 的包管理器。可以使用命令安装它：`sudo apt install npm`。\n*\
  \ WebAssembly 具有成为 Docker 部署单元的重要替代品的潜力。\n\n# 第 18 章\n\n# 项目 3 – 嵌入式 Rust Hello\
  \ World\n\n## 简介\n\n在本章中，你将通过使用 `QEMU` 实现一个 *hello-world* 应用，初步体验将 Rust 用于嵌入式应用。`QEMU`\
  \ 是一个免费的开源模拟器。项目的目标是理解编写、构建和调试嵌入式程序。\n\n## 结构\n\n本章涵盖了以下主题：\n\n* 非标准 Rust 程序\n*\
  \ 程序概述\n* 运行程序\n* 调试程序\n\n## 目标\n\n在本章结束时，你应该熟悉使用 `Rust` 进行基础的嵌入式编程。你将理解非标准 Rust\
  \ 程序的结构，以及如何在嵌入式系统上运行它。你还将学习对你的嵌入式程序进行远程调试。\n\n## 非标准 Rust 程序\n\n嵌入式编程是针对微控制器或运行其他设备的小型计算机的特定编程类型。嵌入式编程有两种编程环境——即*托管*（hosted）和*裸机*（bare\
  \ metal），如下图所示：\n\n![](img/Image31043.jpg)\n\n**图 18.1:** *嵌入式编程环境*\n\n*托管环境*接近于我们熟悉的普通计算机环境。它有一个系统接口来与文件系统、内存、网络、线程等各种系统进行交互。相反，*裸机环境*在你的程序运行之前没有加载任何代码，且无法加载标准库。Rust\
  \ 的标准库需要对其宿主系统的各种功能提供支持。裸机系统没有这些功能，但 Rust 可以与这些系统工作。为了做到这一点，我们需要通过在 crate `root`\
  \ 中添加 `#![no_std]` 属性来告诉 Rust 我们不想使用标准库。\n\n## 非标准 Rust 程序\n\n我们将使用一个名为 `cortex-m-quickstart`\
  \ 的项目模板来生成新项目，该项目将包含一个极简的嵌入式 Rust 应用程序。它还包含一个 `examples` 目录，其中包含几个用于说明 Rust 一些关键功能的应用程序：\n\
  \n* 我们可以使用 `cargo-generate` 工具来创建我们的项目。要安装 `cargo-generate`，可以使用命令：`cargo install\
  \ cargo-generate`\n* 使用 `cortex-m-quickstart` 模板创建项目，可以使用以下命令：`cargo generate --git\
  \ https://github.com/rust-embedded/cortex-m-quickstart`\n在提示时，你可以输入项目名称为 `embedded-rust`，如下所示：\n\
  \n![](img/Image31050.jpg)\n\n**图 18.2:** *创建项目* *embedded-rust*\n\n* 现在，让我们进入项目目录\
  \ `embedded-rust` 并查看树形结构：`cd embedded-rust`\n\n树形结构应该像下图所示：\n\n![](img/Image31058.jpg)\n\
  \n**图 18.3:** *embedded-rust 的*目录结构*\n\n## 程序概述\n\n让我们看看 `embedded-rust` 项目的概述。我们将查看\
  \ `src/main.rs` 源文件，它与我们熟悉的标准 Rust 程序略有不同，如下所示所示：\n\n```\n1. #![no_main]\n2. #![no_std]\n\
  3. use cortex_m_rt::entry;\n4. use panic_halt as _;\n5.\n6. // 程序的入口\n7. #[entry]\n\
  8. fn main()->!{\n9. loop {\n10. // 代码其余部分\n11. }\n12. }\n```\n\n在前面的代码段中，程序使用了\
  \ `#![no_std]` 属性，这意味着程序将不会链接到 `std` crate，而是链接到 `core` crate。程序还使用了 `#![no_main]`\
  \ 属性，这意味着程序将不使用 `main` 函数作为入口。`panic_halt` crate 用于为程序提供恐慌处理程序（panic handler）。`#[entry]`\
  \ 属性由 `cortex-m-rt` crate 提供，用于标记程序的入口。\n\n我们可以使用目标 `thumbv7m-none-eabi` 为 Cortex-M3\
  \ 平台交叉编译我们的程序。要将该目标添加到 Rust 工具链中，可以使用以下命令：\n\n**`rustup target add thumbv7m-none-eabi`**\n\
  \n![](img/Image31069.jpg)\n\n**图 18.4:** *向 Rust 工具链添加目标 thumbv7m-none-eabi*\n\n\
  \n\n最后，要编译程序，可以使用以下命令：\n\n```bash\ncargo build --target thumbv7m-none-eabi\n```\n\
  \n将生成一个 ELF 二进制文件 `target/thumbv7m-none-eabi/debug/embedded-rust`。我们可以使用以下命令打印 ELF\
  \ 头：\n\n```bash\ncargo readobj --bin embedded-rust -- --file-headers\n```\n\n生成的\
  \ ELF 二进制文件头确认它是一个 ARM 二进制文件，如图所示：\n\n![](img/Image31079.jpg)\n\n**图 18.5：** 生成\
  \ ELF 二进制文件头的输出\n\n可以使用以下命令打印二进制文件中链接器段（linker sections）的大小：\n\n```bash\ncargo size\
  \ --bin embedded-rust --release -- -A\n```\n\n你将看到如下所示的输出：\n\n![](img/Image31087.jpg)\n\
  \n**图 18.6：** ELF 二进制文件链接器段大小的输出\n\n要反汇编二进制文件，可以使用以下命令：\n\n```bash\ncargo objdump\
  \ --bin embedded-rust --release -- --disassemble --no-show-raw-insn --print-imm-hex\n\
  ```\n\n使用 `cargo objdump` 命令生成的 ELF 二进制文件的反汇编部分如图：\n\n![](img/Image31094.jpg)\n\n\
  **图 18.7：** 二进制文件部分反汇编输出\n\n## 运行程序\n\n现在让我们尝试在 QEMU 硬件仿真器上运行嵌入式程序 `examples/hello.rs`。该程序使用半主机（semi\
  \ hosting）机制向主机控制台输出文本。\n\n半主机是一种机制，允许运行在嵌入式系统或目标（例如 ARM 目标）上的代码与主机的输入输出设施通信。\n\n\
  编译 `hello.rs` 示例，可以使用以下命令：\n\n```bash\ncargo build --example hello\n```\n\n它会生成一个位于\
  \ `target/thumbv7m-none-eabi/debug/examples/hello` 的输出二进制文件。可以使用以下命令在 QEMU 上运行该二进制文件：\n\
  \n```bash\nqemu-system-arm -machine lm3s6965evb -cpu cortex-m3 -semihosting-config\
  \ enable=on,target=native -nographic -kernel target/thumbv7m-none-eabi/debug/examples/hello\n\
  ```\n\n它会在控制台上打印消息 `Hello, world!`，如下截图所示：\n\n![](img/Image31102.jpg)\n\n**图 18.8：**在\
  \ QEMU 仿真器上运行 hello-world 嵌入程序的输出\n\n在前面的命令中，`qemu-system-arm` 仿真 ARM 机器。`-cpu`\
  \ 参数取值为 `cortex-m3`，告诉 QEMU 想要仿真 Cortex-M3 CPU。`-machine` 参数取值为 `lm3s6965evb`，告诉\
  \ QEMU 想要仿真 `LM3S6965EVB`。`LM3S6965EVB` 是一个包含 LM3S6965 微控制器的评估板。`-nographic` 标志防止\
  \ QEMU 启动 GUI。使用 `-semihosting-config` 标志启用半主机。`-kernel` 参数接收输出二进制文件的路径，以便在仿真系统中加载并运行它。\n\
  \n## 调试程序\n\n我们想要调试的嵌入式程序运行在与运行 GDB 或 LLDB 等调试器的不同的机器上。因此，这种调试是远程进行的，采用客户端-服务器架构。在我们的设置中，GDB\
  \ 进程充当客户端，运行嵌入式程序的进程扮演服务器。\n\n1. 让我们使用以下命令以调试模式启动 QEMU，并使用我们编译的 `hello-world` 二进制文件：\n\
  \n```bash\nqemu-system-arm -machine lm3s6965evb -cpu cortex-m3 -semihosting-config\
  \ enable=on,target=native -nographic -kernel target/thumbv7m-none-eabi/debug/examples/hello\
  \ -gdb tcp::3333 -S\n```\n\n在前面的命令中，我们传递了标志 `-gdb tcp::3333`。因此，QEMU 会等待端口 `3333`\
  \ 上的连接。`-S` 标志意味着 QEMU 不应启动客户，这样在运行客户之前就可以建立 GDB 连接，如图所示：\n\n![](img/Image31109.jpg)\n\
  \n**图 18.9：** 以调试模式运行 QEMU\n\n2. 接着，我们在另一个终端中启动 GDB 进程，并使用以下命令加载 `hello` 示例的调试符号：\n\
  \n```bash\ngdb-multiarch -q target/thumbv7m-none-eabi/debug/examples/hello\n```\n\
  \n3. 我们使用 GDB 命令 `gdb-multiarch` 来调试 ARM Cortex-M 程序。如果没有安装 `gdb-multiarch`，你将收到错误。因此，请确保已安装它。\n\
  \n\n\n\n## 4. 为什么嵌入式系统的调试涉及远程调试？\n\n## 5. 什么是半主机（semi hosting）？请给出该机制的使用示例。\n\n\
  ## 重点\n\n- 嵌入式编程是一种针对微控制器或运行其他设备的小型计算机的特定编程类型。\n- 嵌入式编程有两种编程环境，即 `hosted`（宿主）和 `bare\
  \ metal`（裸机）。\n- 如果你不想使用标准库，可以通过向 crate `root` 添加 `#![no_std]` 属性来实现。\n- `QEMU`\
  \ 是一个免费的开源仿真器。\n- 我们可以使用目标三 `thumbv7m-none-eabi` 为 Cortex-M3 平台交叉编译程序。\n- 半主机（Semi-hosting）允许运行在嵌入式系统或目标（如\
  \ `ARM` 目标）上的代码与主机计算机交互，并使用它的输入/输出设施。\n- 我们想要调试的嵌入式程序运行在与 `GDB` 或 `LLDB` 等调试器运行不同的机器上。因此，这种调试是在*客户端-服务器*架构下远程完成的。\n\
  \n# 第 19 章\n\n# 项目 4 – 使用神经网络构建二分类图像分类器\n\n## 引言\n\n在本章中，我们将学习`神经网络`的基本功能，并实现一个简单的`二分类器`来将图像分类为两类。深度学习在过去的\
  \ 10 年中势头正劲，因此本章旨在为想要使用 Rust 进行深度学习任务的 程序员提供一个良好的起点。\n\n## 结构\n\n本章涵盖了以下主题：\n\n\
  - 什么是神经网络？\n- 神经网络是如何工作的？\n- 使用神经网络实现二分类图像分类器\n\n## 目标\n\n在本章结束时，你应该熟悉神经网络的基本组件和功能。你应该学会如何定义一个具有几层的神经网络模型来执行分类任务，这将帮助你开始使用\
  \ Rust 进行神经网络和机器学习。\n\n## 什么是神经网络？\n\n`神经网络`（Neural networks），也称为人工神经网络 (`ANNs`)，是机器学习的一个子集，也是深度学习算法的核心。它们的灵感来源于人类大脑，试图模拟生物神经元的工作方式。神经网络由多层节点组成：输入层、一个或多个隐藏层以及输出层，如下图所示：\n\
  \n![](img/Image31476.jpg)\n\n**图 19.1：** 一个具有两个隐藏层的简单神经网络\n\n每个节点（人工神经元）连接到下一层的其他节点，并带有某些关联权重。如果任何单个节点的输出高于指定的阈值，则该节点就会被*激活*并将数据发送到下一层。否则，没有数据会被传递到网络的下一层。\n\
  \n## 神经网络是如何工作的？\n\n神经网络的每一层都有特定的用途。`输入层`接收输入信号（数据）并将其传输到下一层。`隐藏层`对从上一层传递的数据进行计算。`输出层`返回隐藏层计算的最终结果。与其他机器学习应用一样，神经网络需要数据进行训练。神经元是计算的基本单元，它们将数值输入与权重和偏置结合以产生单个值，如下所示：\n\
  \n```\nvalue = weights * inputs + bias\n```\n\n然后，`激活`函数通过以下方程产生输出：\n\n```\noutput\
  \ = activation(value)\n```\n\n`激活`函数的输出决定了节点是否应该触发以提取特征。模型使用代价函数来降低*错误率*。权重会被调整，输出会被反向传播以最小化误差。模型在每次迭代中调整权重以增强准确性。\n\
  \n## 使用神经网络实现二分类图像分类器\n\n在本节中，我们将为具有 `0` 和 `1` 的图像实现一个二分类器。一旦训练完成，分类器将预测 `0` 或 `1`。\n\
  \n## 创建 Rust 项目\n\n首先，我们使用 `cargo new` 创建一个新的 Rust 项目，并将其命名为 `classifier`。因此，我们进入\
  \ `classifier` 目录并查看文件：\n\n```\nclassifier/\n├── Cargo.toml\n└── src/\n    └── main.rs\n\
  ```\n\n## 添加依赖\n\n对于我们的项目，我们需要 `neural-networks` crate。因此，让我们在 `Cargo.toml` 文件中添加：\n\
  \n```toml\n[dependencies]\nneural-networks = \"0.0.1\"\n```\n\n## 训练和测试数据\n\n我们的数据集包含训练集中的\
  \ 12.6K 张图像和测试集中的 2.1K 张图像。每张图像都是灰度模式（单通道），尺寸为 28x28，即 784 像素。此外，每个像素的取值从 0 到 255\
  \ 不等。我们将这些值归一化到 0 到 1 的范围内，并将这些值添加到逗号分隔的值（**csv**）文件中。由于我们的模型是二分类器，它的输出是 `0` 要非\
  \ `1`。在分类问题中，我们通常处理独热编码向量（one-hot encoded vectors），即长度等于类别数量的二进制向量，其中只有一个值为 1，其余均为\
  \ 0。因此，独热向量 `[1, 0]` 表示类 1（在我们的案例中是数字 0），向量 `[0, 1]` 表示类 2（在我们的案例中是数字 1）。我们在 CSV\
  \ 文件 `ZeroOne_train.csv` 的最后一列添加与每个输入对应的训练标签，如下所示：\n\n![](img/Image3190.jpg)\n\n\
  **图 19.2：** 训练数据 `ZeroOne_train.csv` 的样本数据\n\n测试数据文件 `ZeroOne_test.csv` 的组织方式类似。训练和测试数据可以通过以下\
  \ GitHub 链接下载：\n\n[`github.com/abhishekiit327/rust_book_resources/tree/main/Chapter_19`](https://github.com/abhishekiit327/rust_book_resources/tree/main/Chapter_19)\n\
  \n## 定义我们的模型\n\n现在我们已经有了训练和测试数据，准备好定义用于二分类的神经网络模型了。我们已经在 `Cargo.toml` 中将 `neural-networks`\
  \ crate 作为依赖项添加。我们将使用该 crate 的 `NeuralNetwork` 类以及 `train` 和 `get_accuracy` 函数。因此，让我们在\
  \ `src/main.rs file`中添加以下代码片段：\n\n```\nuse neural_networks::neural_networks::NeuralNetwork;\n\
  ```\n\n\n\n\n\n```rust\nuse neural_networks::{get_accuracy, train};\n```\n\n现在，让我们定义一个包含输入层、两个隐藏层和一个输出层的模型。输入层有\
  \ `784` 个节点，每个隐藏层有五个节点，输出层有两个节点，如下图所示：\n\n![](img/Image31498.jpg)\n\n**图 19.4：**\
  \ 我们的二分类器神经网络模型架构\n\n为了定义该模型，我们将使用 `NeuralNetwork::new` 函数，如下方的代码片段所示：\n\n```rust\n\
  fn main() {\n    let mut nn = NeuralNetwork::new(784, vec![5, 5], 2, 0.1, \"sigmoid\"\
  );\n}\n```\n\n`NeuralNetwork::new` 函数的第一个参数是输入节点数，第二个参数是包含每个隐藏层节点数的向量，第三个参数是输出节点数，第四个参数是学习率（它表示更新模型权重时的步长），第五个参数表示\
  \ `activation` 激活函数。\n\n接下来，让我们开始训练过程，这涉及到对训练数据的多次轮次（epochs）或多次遍历。在一个 `epoch` 中，我们精确地使用所有训练数据一次。一次前向传播（forward\
  \ pass）和一次反向传播（backward pass）共同算作一次遍历。在前向传播中，数据流过所有层并产生输出。该输出用于计算误差，误差用于在反向传播中更新模型权重。我们将模型训练\
  \ `5` 个 epoch，然后计算训练好的模型在新数据（即 `test` 数据）上的准确率，如下方的代码片段所示：\n\n```rust\nfn main()\
  \ {\n    let mut nn = NeuralNetwork::new(784, vec![5, 5], 2, 0.1, \"sigmoid\");\n\
  \    let num_epochs = 5;\n    train(&mut nn, \"ZeroOne_train.csv\", num_epochs);\n\
  \    let acc = get_accuracy(&nn, \"ZeroOne_test.csv\") * 100.0;\n    println!(\"\
  Accuracy: {}%\", acc);\n}\n```\n\n最后，我们可以使用 `cargo build` 和 `cargo run` 来启动训练过程并对训练好的模型进行验证，如下所示：\n\
  \n![](img/Image31506.jpg)\n\n**图 19.5：** 显示神经网络二分类器训练情况和准确率的输出\n\n在前面的图中，我们可以看到模型在训练\
  \ `5` 个 epoch 后，能够达到 `99.85%` 的准确率。\n\n## 结论\n\n在本章中，你学习了神经网络的基本组件和工作原理。然后，我们定义了一个具有几层结构的用于手写数字\
  \ `0` 和 `1` 二分类的神经网络模型。我们实现了接近 `100%` 的准确率，证明了神经网络和深度学习在图像分类等任务中的强大。我们拥有标签的训练数据只是机器学习的一种形式，属于\
  \ `Supervised Learning`（监督学习）的范畴。还有其他形式的机器学习，我们才刚刚触及一角。希望本章为你提供了足够的知识，让你能够 Rust\
  \ 开始神经网络和机器学习。\n\n## 问题\n\n1. 什么是神经网络？\n2. 神经网络的不同层有哪些？每一层的作用是什么？\n3. 神经网络是如何工作的？\n\
  4. 损失函数（loss function）是指什么？\n5. 在训练神经网络的背景下，epoch 是什么？\n\n## 记忆要点\n\n* 神经网络是机器学习的一个子集，是深度学习算法的核心。它们灵感源自人脑，试图模拟生物神经元的工作方式。\n\
  * 神经网络由多层节点组成，包括输入层、一个或多个隐藏层以及输出层。\n* 输入层接收输入信号（数据）并将其传递到下一层。\n* 隐藏层对从上一层传递过的数据进行计算。\n\
  * 输出层返回隐藏层计算的最终结果。\n* 训练神经网络涉及到对训练数据的多次轮次（epochs）或多次遍历。一次前向传播和一次反向传播共同算作一次遍历。\n\n\
