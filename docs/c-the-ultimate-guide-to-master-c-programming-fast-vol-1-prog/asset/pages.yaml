  md: '# Introduction


    Many of the applications of C++ involve more complex organizations of software
    pieces, including graphics and scientific computations. This is not to say that
    Java or other languages lack the ability to tackle these kinds of problems. C++
    does have a history in these fields, with its ancestor being the C programming
    language. The best way to view it is that C++ added some object-oriented principles
    (OOP) to the C language in order to become more modern at the time.


    To be more specific, C++ has a very identical syntax to C in general, but shares
    the OOP concepts that Java also uses. This includes classes, polymorphism, encapsulation,
    inheritance, and a number of other concepts. The gist is that C++ provides an
    easy to understand platform for both new and old programmers to communicate easily.


    This guide isn''t meant to bog you down in terminology though. Once you learn
    any programming language, the next will be easier so long as it''s in the same
    family. Meaning, C++ will help you learn Java which will help you learn C# and
    so on. The best way to choose a programming language is to find a feel for how
    you might like to program. This could mean writing speech like statements in QBASIC,
    or writing esoteric coding magic as in Ook-Ook. In this case, we need a language
    that will introduce the initial aspects of programming while still being flexible
    enough for more advanced topics; therefore we choose the C++ programming language.


    Now we''re up to speed on the general view that our programming language holds,
    we can start to tackle some of the preliminary objectives of setting up your programming
    environment. This will include an editor, a compiler and a file directory structure.
    The editor is where you will actually write your code. The compiler will take
    your code and make an executable application that will run on your computer. The
    only purpose of the file directory structure is to minimize confusion as to where
    your files are being saved while you''re coding. Shall we begin?'
