    about this quick scenario. Say that there''s a really large project that you''re
    tasked to help develop. There are other coders with you. Each they have their
    own way of doing things, which can already spell some problems early on. One of
    them asks you for some help after folder of software. An interface here and a
    realization there, with some utilities with his piece. He tries to explain it
    quickly, but you''re already lost as you try to go inside of folder after another
    folder way over here. See the problem?


    Now then. This simple example will seem to defeat the purpose of needing a strict
    directory structure, but the next to last chapter will you have adding a few pieces
    of code to your program to validate the need for a comprehensible structure. The
    most we''re going to do involves 2 folders.


    For the primary example, we need to make a folder called “tutorials.” If you already
    know how to do this, then continue to chapter 4. Otherwise, here''s step-by-step
    how you make a new folder using Windows, though most other operating systems will
    follow a somewhat similar format.


    The first step is to go to your Desktop. This is the place where all of your icons
    reside. At the bottom is the Taskbar which has the Start button and a clock on
    the right side. Please click your cursor over the Desktop and right click. You
    should see something similar to the image at right.


