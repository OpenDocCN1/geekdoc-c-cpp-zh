    # SQL


    ![](img/35438157c964cd6add78d50335bfad5f_8_0.png)


    # 引言


    C++ 的许多应用涉及更复杂的软件组件组织，包括图形处理和科学计算。这并不是说 Java 或其他语言缺乏处理这类问题的能力。C++ 在这些领域确实拥有历史，其祖先是
    C 语言。看待它的最好方式是，C++ 在 C 语言的基础上增加了一些面向对象的原则 (OOP)，以便在当时变得更加现代化。


    更具体地说，C++ 的语法总体与 C 非常相似，但它共享了 Java 同样使用的 OOP 概念。这包括类、多态、封装、继承以及许多其他概念。其核心在于，C++
    为新老程序员提供了一个易于理解的平台，以便于交流。


    然而，本指南并不是让你陷入术语中。一旦你学会了任何编程语言，只要它属于同一个家族，下一种就会变得更容易。这意味着 C++ 将帮助你学习 Java，而 Java
    将帮助你学习 C#，以此此类推。选择编程语言的最佳方法是找到你可能喜欢编程的感觉。这可能意味着在 QBASIC 中编写像语句一样的代码，或者像 Ook-Ook
    那样编写晦涩的代码魔法。在这种情况下，我们需要一种既能介绍编程入门，又足够灵活以处理更高级主题的语言；因此，我们选择了 C++ 编程语言。


    现在我们已经了解了编程语言的总体观点，可以开始处理设置编程环境的一些初步目标。这包括一个编辑器、一个编译器和一个文件目录结构。编辑器是你实际编写代码的地方。编译器将获取你的代码并生成一个可以在你的计算机上运行的可执行应用程序。文件目录结构的唯一目的是为了减少你在编码期间对文件保存在何处的困惑。我们开始好吗？


    ## 第一章：安装 Cygwin：类 Linux 开发


    第一步是获取编译器。原因是，这将对你的程序在编译器处理后的运行方式产生一些限制。例如，某些特定的编译器宏，例如来自 gcc 编译器的 `__sync_synchronize`，它们会添加一些你不需要手动添加的额外指令。


    撇开编译器的特性，在同一个程序上使用不同的编译器还有其他问题。每当你试图寻找代码中的问题时，编译器警告也会导致一些不必要的困惑。由于对某个特定编译器的共识，编译器的选择也可能会导致进一步研究的停滞。


    使用 Cygwin 软件包的另一个好处是它遵循与默认 Linux 编译器类似的格式。我们将从 Cygwin 软件包中使用的特定编译器是 g++ 编译器，它会有一些特性，但它将帮助深入熟悉代码，使我们不必像某些其他集成开发环境
    (IDE) 那样只需按一个大按钮来获取可执行代码。


    关于编译器有大量的研究正在进行。应用于形式化语言、自动机以及其他许多高级主题的原理。如果你对编译器的底层工作原理有进一步兴趣，网上有很多资源，以及对最流行的编译器的易懂解释。


    [点击此链接获取 Cygwin]。


    一旦安装完成，你还可以做其他几件事。Linux 操作系统使用 bash 这种脚本语言，而 Windows 使用批处理（batch）。bash 和 batch
    之间的差异有很多，但它们都共享一些通用功能。Cygwin 实际上添加了一些 bash 具有的命令，但 Windows 让其变得稍微复杂了一些。


    **pwd** 命令稍后会有用，因为它会打印工作目录。命令提示符也是。


    ## 第二章：安装 Notepad++：从文本到代码


    我们下载的下载项是代码编辑器。代码编辑器和简单文本编辑器之间的区别非常明显，前者将提供一些语法高亮等功能。


    最好的部分是，这个代码编辑器不仅高亮 C++，还能高亮许多其他语言。Linux 也使用名为 gedit 的混合文本编辑器。


    [点击此链接获取 Notepad++]。


    ## 第章：设置工作空间：文件结构是关键


    最后的设置步骤在这里。这一步被认为是可选的；然而，请想一下这个简单的场景。假设你被要求开发一个非常大的项目。还有其他程序员和你一起工作。他们都有自己的办事方式，这可能在早期就会导致一些问题。其中一个人请求你帮助处理软件。这里有一个接口，那里有一个实现，伴随着他的一些工具。他试图快速解释它，但当你试图进入一个文件夹又另一个文件夹时，你已经迷失了。


    现在。这个简单的例子似乎违背了对严格结构的需求，但倒数第二章将带你向程序中添加一些代码，以验证这种结构的必要性。我们要做的最多涉及 2 个文件夹。


    对于主要的示例，我们需要创建一个名为“tutorials”的文件夹。如果你已经知道如何这样做，请继续阅读第 4 章。否则，这里是使用 Windows 创建新文件夹的逐步步骤：


    第一步是前往桌面。这是你所有图标所在的地方。底部是任务栏，有开始按钮，右侧是时钟。请将光标悬停在桌面并点击右键。你应该看到与右侧图像类似的内容。


    '
