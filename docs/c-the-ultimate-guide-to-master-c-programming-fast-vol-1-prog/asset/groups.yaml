  mdcn: "\n编译成功后立即运行程序。被绿色圈出的部分是实际输出。\n\n![](img/35438157c964cd6add78d50335bfad5f_20_0.png)\n\
    \n编译器理解我们何时需要去另一个文件来获取某些函数定义，这样我们只需要向编译器提供该文件的名称即可。既然我们已经知道了程序是如何运行的（绿灯），让我们继续，并顺便多添加一些内容。\n\
    \n既然我们已经完成了命名这部分，就可以将变量应用于我们当前的代码了。下面的图片在某种程度上总结了这些，但如果你需要文字说明，我稍后也会进行解释。\n\n\
    ## hello.cpp\n\n```cpp\n#include <stdio.h>\n#include <iostream>\n#include <string>\n\
    \nusing namespace std;\n\nint main() {\n    string hello = \"Hello, World!\";\n\
    \    string prog_out = \"Program Output:\";\n\n    printf(\"Begin %s:\\n\\n\"\
    , prog_out);\n    printf(\"%s\\n\\n\", hello);\n    cout << hello << \" from a\
    \ stream!\" << endl;\n\n    printf(\"End %s:\\n\\n\", prog_out);\n}\n```\n\n首先注意到的是顶部额外的\
    \ `include` 语句。这把 `string` 数据类型引入到我们的程序中供函数使用。接下来是函数定义之外的 `using namespace` 部分。这类似于使用变量名来使代码更简洁，因为现在我声明我正在使用\
    \ `std` 命名空间，所有与之相关的变量都会自动带入我们的程序中。\n\n函数中新增的两个行是实际的变量声明。这是声明任何数据类型变量的标准写法。`String`\
    \ 是一个特殊情况，它们实际上只是一个更容易理解的 `char*` 数据类型的概念，本质上表示该变量指向一个字符。\n\n指针是 C/C++ 中的一个核心概念，它实际上出现在我们当前的代码中。出现在我们函数调用中的变量前的\
    \ `&` 基本上告诉函数不要使用变量本身，而是使用该变量所引的值。接下来的图片应该消除大多数初学者在最初理解时经常遇到的某些困惑。\n\n![](img/35438157c964cd6add78d50335bfad5f_22_0.png)\n\
    \n核心点在于，如果你有一个指向任何特定类型的指针变量，你可以使用前面的星号 `*` 将指针转换为值，或者使用前面的 ampersand `&` 获取变量的地址并将其传递给其他函数等。这只是指针的一个非常简化的介绍，仅供你了解。\n\
    \n现在，回到代码。在我们的函数中提到的变量前面应该有 ampersands，因为它们需要的是字符串的指针而不是值。这使得函数能够传递正确的字符串并打印出与上次相同的输出。\n\
    \n我们将向当前程序中添加的下项内容是编写多个函数的想法。这对于我们简单的示例来说可能不是必须的，让我们添加一些简单的计算来展示函数的威力。其主意是将两个数字相加并返回它们的和。作为一个挑战，尝试添加一个\
    \ `if` 语句来检查该值是否为负数，如果是则返回零。解决方案将在结论中。\n\n至于我们要添加的函数，让我们取程序的中间部分并替换为我们想要添加的函数。为了方便起见，我们将其命名为\
    \ `calc_sum` 以保持简单。\n\n下面的图片展示了如何添加它。想法是，我们在添加新功能的同时，尽可能保留旧程序的内容。我们只需说程序员喜欢节省时间。不同之处在于函数是负责将其输出到屏幕上还是不是，这影响了返回值是\
    \ `void` 还是 `int`。代码摘要如下：\n\n![](img/35438157c964cd6add78d50335bfad5f_23_0.png)\n\
    \n```cpp\n#include <stdio.h>\n#include <iostream>\n#include <string>\n\nusing\
    \ namespace std;\n\nint calc_sum(int, int);\n\nint main() {\n    string prog_out\
    \ = \"Program Output\";\n    int a = 2;\n    int b = 3;\n\n    printf(\"Begin\
    \ %s:\\n\", prog_out);\n    cout << calc_sum(a,b) << endl;\n\n    printf(\"End\
    \ %s\\n\", prog_out);\n}\n\nint calc_sum(int number_1, int number_2) {\n    int\
    \ result = number_1 + number_2;\n\n    return result;\n}\n```\n\n注意 `main` 函数之前有一个原型，这告诉编译器稍后会在程序中定义一个函数。在这种情况下，它是\
    \ `calc_sum`，它接收两个整数值作为参数。定义本身非常简单，我们只需要返回两个整数的和。这与我们在数学中做的方式相似，不同在于我们现在将其返回给调用者。（注：此处原文存在大量重复的句子，已根据逻辑完成翻译并去重处理）。\n\
