- img_proc: true
  md: '# Role Playing Games


    As the above hierarchy shows, the game will start with the Title Screen. When
    the player presses the Start Button, the Oracle One room will load and the player
    will see the hero character in the room. The player will be given a task from
    the Oracle, which appears as a Dialog Box. Essentially the Oracle is telling the
    player to go through the South Gate and pick up a dagger. The player goes through
    the wall, the Level One room will load.


    Level One has the player avoiding fireballs that are shot from masks on the wall.
    After the player goes through the fireball obstacles and made it to the bottom
    of the room, the player will pick up the dagger which has been placed there. The
    moment the dagger is picked up, the masks begin to shoot fireballs in a faster
    progression, making it impossible for the player to get back to the doorway way
    they walked in. The player will then shoot blades at the masks. As each mask is
    destroyed, the fireballs emitted from it cease. With the fireball danger, the
    player can then exit through the door the way they entered the room.


    When the player exits the room it back to the Oracle One room, but this is actually
    a game designer. The player has actually now entered the Oracle Two room that
    looks almost identical to the Oracle One room. The Oracle Two now has the South
    Gate so player cannot enter the Level One room as mission is complete. The East
    Gate is now open and the Oracle instructs the player to solve a riddle and enter
    the East Gate to pick up some treasure.


    When the player steps through the East Gate, the Level Two room loads. The Level
    Two room contains floor tiles with letters on each of them. If the player has
    solved the riddle correctly, they will walk on and which ones will destroy them.
    The player cannot idle too long as ice will be flying out from the walls to force
    the player to move. Fortunately the player has the dagger and can slash at them.
    Once the player makes it across the room and picks up the treasure, they will
    see that their gold supply has increased. This also allows them to leave the doorway
    where they entered the room with the dagger in the previous level. The player
    will still want to walk on the appropriate tiles will no longer need to worry
    about the ice blades.


    When the player exits the Level Two room it will appear that they have returned
    to the Oracle Two room, however, they are now in the Oracle Three room. The Oracle
    Three room closed the East Gate and the North Gate open. The player is instructed
    to go through the North Gate to pick a new dagger with the coins they just picked
    up.


    When the player enters the North Gate, the Shop level will load. The view is now
    from the player character''s eyes, meaning we are looking through the player character
    to select items they cannot afford, which will give them a message that they need
    more coins. The only item they can afford is the silver dagger. When they select
    the silver dagger the Oracle Four room will load. This room has all the gates
    closed except for the West Gate. The Oracle will tell the player to go through
    the West Gate.


    221'
