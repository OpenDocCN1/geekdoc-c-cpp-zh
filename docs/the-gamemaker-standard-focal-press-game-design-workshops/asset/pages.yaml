  md: '**Trigger**—In-game event that when initiated something causes else to happen
    in the game.


    **Two Player**—Game created for two people to play at the same time.


    **Ubuntu Linux**—Operating system.


    **Use of Views**—Modifying what the player can see inside the room.


    **Visible**—When an object can be seen in a game.


    **W, A, S, D Keys**—Common combination of keys used to control player character
    movements.


    **Windows**—Operating system used on personal computers.


    **Xbox One**—Game console created by Microsoft.


    **x axis**—Where an object is located between the left and right side of the screen.


    **y axis**—Where an object is located between the top and bottom of the screen.


    **Yo Yo Games**—Company that owns GameMaker.'
