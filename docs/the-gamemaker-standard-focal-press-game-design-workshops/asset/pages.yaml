    \ similar to those shown in\n**Figure 6.2**.\n\n# Inserting the Player’s Ship\
    \ and a\nSpinning Background\n\nThe background image for our game as shown in\
    \ **Figure 6.1** is specially created to\nsim illusion of the player moving toward\
    \ the center or moving away from the\ncenter depending on how the graphic is spinning.\
    \ The player will actually control\ndirection the background is spinning depending\
    \ on what movements are required\nby the player at that particular moment of the\
    \ game. The background is a graphical\nrepresentation of what it would appear\
    \ like to travel through the bloodstream. The dark\ncenter of the image creates\
    \ the illusion that the center is farther away from the player than\nt edges because\
    \ it contains less detail and is not as well as the edges of the graphic.\nin\
    \ order to reinforce the illusion that the center of the image is farther away\
    \ we will provide\nan additional object that our brain understands. This additional\
    \ object will be our player’s\nship. The ship will show the scale of which we\
    \ are seeing something in this environment,\n the size of the ship compared to\
    \ the size of the graphic gives us more\ninformation to determine far away the\
    \ center of the background is from our ship.\n\n**Step 1**: Open the three different\
    \ ship sprites and select the center button.\n\n**Step 2**: Create a new object\
    \ named **obj_ship**.\n\n**Step 3**: Set the sprite to **spr_ship_idle**.\n\n\
    **Step 4**: Add a **Create** Event for the **obj_ship**.\n\n**Step 5**: Using\
    \ a resolution of 720 x 720 will cause some scaling issues with the ship\nwhich\
    \ we can counteract by adding a Transform Sprite Action. Add a Transform Sprite\n\
    Action and set the following:\n\n```\nxscale: 0.4\nyscale: 0.5\nAngle: 0\nMirroring:\
