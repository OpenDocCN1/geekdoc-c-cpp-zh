    # Project Overview:

    Keeper of the Oracle


    Role Playing Games (RPGs) are adventure games that tell a story through gameplay
    and allow players to change instances about their character. These instances can
    be changing the character''s wealth, weapons, or appearance. An entire book could
    be written on creating RPGs as different types of games include various elements.
    For this'
