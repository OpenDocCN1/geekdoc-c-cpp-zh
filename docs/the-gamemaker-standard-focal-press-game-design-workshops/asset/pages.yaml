    This opens your new project so you can now import the game assets. In the downloaded
    Scout Game Assets folder you will see several subfolders. The assets you will
    import at this point are in the Sprites, Sounds, and Backgrounds folders. The
    first type of asset you will add here are the sprites. A sprite is any graphic
    used in the game, aside from background graphics.


    There are a couple of ways of adding sprites. You can add each sprite individually
    or you can add all at once. For this you will add all of the sprites at once since
    it is the fastest option.


    Should you wish to add sprites one at a time, you can right-click the Sprites
    folder at the top of the list then choose the Create Sprite option and import
    your sprites that way. Since we are adding all of our sprites at once, we can
    use the drag-and-drop method.


    # Importing Assets


    Step 1: Move the GameMaker window so that it fills only half the screen. You want
    to be able to see the Assets folder we downloaded earlier in order to drag and
    drop the sprite files into GameMaker.'
