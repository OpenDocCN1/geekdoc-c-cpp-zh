  md: '# Deciphering GML Code


    Coding languages use symbols to represent certain actions that are understood
    by the program. The first code symbols we typed were two right-leaning slashes
    also known as forward slashes. Whenever GameMaker encounters two forward slashes
    in the GML code it understands that what follows is a comment and is intended
    to be a reminder of what the code is doing. GameMaker will ignore anything after
    the two forward slashes until it encounters another symbol indicating it should
    do something different. Comments are useful for designers to check if what they
    typed was: if they can also be used to track bugs and relate to another designer
    reading the code what the code should be doing. This later part is helpful when
    a team of designers are working on one project together.


    After the two forward slashes we typed the word left. This reminds us that the
    following code is designed to tell GameMaker to check if the left key is being
    pressed. The next group of text we typed in the actual GML code that tells: GameMaker
    to check if the left key is being pressed. The code we typed was keyboard_check
    (vk_left). This is essentially asking GameMaker to run a check to see if the left
    key on the keyboard is pressed. An “if” statement can be used to check for virtually
    anything in a game such as 1+1=2. As you look at that line of code it should start
    make sense knowing what the intended result should be. The next


    ![](img/584600b080035f863f96e219491bffbd_208_0.png)'
