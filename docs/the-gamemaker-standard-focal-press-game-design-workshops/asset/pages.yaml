  md: '# Glossary


    Event—Tells the game action should take when a certain key is pressed or if a
    particular circumstance occurs, as such an object colliding with another.


    Execute Code—A way of adding customized coding to a GameMaker game.


    Export—Converting a game to a particular device.


    Game Engine—Software used to design games.


    Game Genres—Just as movies are broken down into genres such as horror or action,
    games are broken up into genres as scroll-rollers and puzzles in addition to many
    other types.


    GameMaker—Authoring program used to create games.


    GameMaker Versions—This can refer to past versions of GameMaker or to the three
    versions that currently a part of GameMaker.Studio.


    GML—GameMaker Language.


    Gravity—Applying a realistic force to an object.


    GUI—Graphical User Interface.


    Health Bar—Indicates the life remaining for a character.


    HorSpeed—The speed in which an object travels on the x axes.


    HTML 5—Hyper Text Language standard used for browsers. The number 5 indicates
    the current standard.


    HUD—Heads-Up Displays statistics to the player such as health, score, weapons,
    or coins.


    Icon—A graphical representation that when selects a program.


    Idle—The default position is a character in when no keys are pressed.


    Image Rotation—A function used to move an object on a designated axis.


    Jump to Position—Moving a character to a different location in a game.


    Key Release—An action that occurs occurring when a particular key is pressed on
    a keyboard is no longer held down.


    Keyboard Event—An action that occurs when a particular key is pressed on a keyboard
    to produce a specific action. Typically used to find searching menus options.


    Kill Zone—An area of the game will cause that player to die if they enter the
    area.


    Level—Playable area of a game. Games may contain only one level that continues
    until a player eventually loses or multiple levels from one to another after the
    player meets criteria.


    Licensing Fee—A fee that is paid to a game engine for using its engine.


    Lives—The number of times a player has in a game to complete


    Mac OS—Operating system for Macintosh computers and devices.


    Map Keys—Setting particular keys for players to perform different functions.


    Menu—Portion of a game in which players can make selections as game play or quit.


    Multi-Level—Games that contain more than one playable level.


    Multiple Instances—More than one of the same object in a game.


    Music Loop—When the end of a piece of music starts back at the beginning of the
    song seamlessly so that the song appears to be infinite in length.


    Object—Typically represented as a sprite, an object instructs the sprite how it
    should appear and act.


    Object Spawner—An area or in-game that creates new instances of another object.


