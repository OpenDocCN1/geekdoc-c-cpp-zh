  md: '![](img/584600b080035f863f96e219491bffbd_121_0.png)


    # Two Player Games


    Learning Objectives—Upon completion of Chapter 4 readers will be able to:


    +   - Map control keys and identify which keys are commonly used and should be
    avoided

    - Create two player games

    - Include pick-up items that can be stored and used later in the game

    - Create controls behind player characters

    - Include pick-up items that change the behaviors of player character and opponent

    - Include multiple rounds and track winnings that total to reveal game winner

    - Work with parent objects

    - Include persistent objects that remain across multiple levels


    # Project Overview: Snail Trail


    Snail Trail is two player competitive game in which two people play against each
    other with the goal of winning two out of three rounds. Each player controls their
    own snail which must avoid objects in the game while moving. Players use the trail
    created by their snail to trap the other player''s snail by attempting to get
    the other player to collide with either a trail or another object in the game.
    Players can also pick up different colored mushrooms in the game, which allows
    the player to either freeze the other player temporarily or allow their own snail
    to be indestructible'
