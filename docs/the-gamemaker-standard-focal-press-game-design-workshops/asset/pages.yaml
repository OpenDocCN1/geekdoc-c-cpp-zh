  md: 'Now when we run the game we can see that as the dog reaches the center of the
    screen, the camera, or viewpoint of the player, it will follow it. This allows
    the player to always see the playable character, in this case the dog, and the
    rest of the game objects scroll from right to left as the dog runs to the left.
    This is why this type of game is called a scroller. Now we need to populate our
    game with some obstacles for the dog to overcome.


    # Incorporating Obstacles


    +   * **Step 1:** Go back to the Tiles tab and fill out the rest of the level
    with grass.

    * **Step 2:** Now let''s place some graves for the player to fall into. Under
    the Tiles tab, uncheck the **Delete Underlying** option.

    * **Step 3:** Select the **Add** button below the **Current tile layer:** box.


    In order for the hole to show in front of the grass we will need to place it on
    a layer closer to the viewer. Items in GameMaker that have a higher number depth
    are located closer to the viewer and those with a lower number depth or a negative
    number depth are farther away. For example, if we wanted our dog to walk in front
    of a tree, we might have the tree set for a depth of zero and set the dog with
    the depth of five. If we reversed those numbers, the dog would appear to walk
    behind the tree.


    +   * **Step 4:** Type **1000** into the box labeled **Depth** and hit OK.


    ![](img/584600b080035f863f96e219491bffbd_98_0.png)'
