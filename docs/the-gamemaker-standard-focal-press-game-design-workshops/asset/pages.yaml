  md: '# THE GAMEMAKER STANDARD


    For a limited time. The player who wins two out of three matches wins the game.

    To begin creating the Snail Trail game, first download the Snail Trail game assets
    at https://www.thegamemakerstandard.com/snailtrail/; after downloading the assets
    folder read over the updates.pdf document which contains any changes since the
    publication of this book, then create a new project in GameMaker.


    # # Creating a New Project and

    Importing Assets


    **Step 1**: Create a new project in GameMaker Studio and name it: *Snail Trail*.

    **Step 2**: Import the sprites, backgrounds, and sounds and name them similar
    to those shown in **Figure 4.1**.


    # # Creating Groups


    We will be creating two different characters for the game: a yellow snail and
    a purple snail. One player will control the yellow snail, while the other player
    will control the purple snail. By creating groups we can keep the different files
    used for each snail separate and organized.


