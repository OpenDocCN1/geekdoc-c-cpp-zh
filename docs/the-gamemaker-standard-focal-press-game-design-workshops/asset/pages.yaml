  md: '# Destroying the Pumpkin and Candy Objects


    As the candy and pumpkin objects leave the screen at the bottom after falling
    they seem to disappear. GameMaker is still calculating their movements as the
    game is running, however, and will the player can no longer see these objects
    it is a waste of resources for them to continue existing. With all of the on objects
    being calculated and all of the objects no longer on screen being calculated,
    we face a good possibility of the game crashing after a while because so many
    items are being tracked. It is therefore necessary to destroy the candy and pumpkin
    instances using resources that are in the visible area.


    **Step 1:** Create a new object and name it **obj_collider** and use **spr_collider**
