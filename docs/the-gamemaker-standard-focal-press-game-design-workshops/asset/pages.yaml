  md: '# # Exporting for Different Operating Systems


    If you were to ask a couple of friends to name as many different operating systems
    as they could, many of them would most likely be able to name Windows and Mac.
    However, without realizing it, they are probably familiar with other operating
    systems but never classified them as being in the same category as Windows and
    Mac operating systems. Android is one example of an operating system commonly
    used. Although Android is best known for being a cell phone operating system,
    it has also been used as the operating system for a game console. We will explore
    that later when we discuss various consoles. Operating your systems may not have
    guessed about Ubuntu Linux and Tizen. Although they may not be familiar with the
    names of these operating systems, there is a good chance they have operated a
    device that they use. GameMaker includes game exporting options for all of the
    operating systems mentioned above as well as additional exporting options for
    developers to publish their games for specific platforms.


    # # Windows Platforms


    While working through the previous chapters of this book, you have already exported
    to a Windows platform by publishing your game as an executable so that it could
    be played on other Windows computers that do not have GameMaker installed. Traditionally,
    this is how video games were packaged. In the not-so-distant past independent
    game designers would want their game as an executable, burn to a CD, put in a
    nice CD package with cover art, and sell it. Today''s buyers are looking for something
    different as they may wish to play games on a different device than a personal
    computer with a CD-Rom. Others may wish to play games on their tablets, which
    may not have a CD-Rom; others may wish to play games on their mobile devices such
    as cell phones. Frankly, GameMaker has exporting options for these buyers, although
    these options may not be included in the version of GameMaker you are currently
    running and here is why. The following may sound like a sales pitch of, but the
    intention is to provide information on which version of GameMaker is best suited
    for the needs of different game developers. This book is titled GameMaker Standard
    to reflect that we are using the Standard version of GameMaker: Studio. The Standard
    version allows game developers to develop GameMaker for free in order to learn
    the software. There are two other versions of GameMaker that can be purchased.
    Upgrading to one of these other versions opens up more export options in addition
    to the export to Windows options that we have been using to make our executables.
    The first of these two options is the GameMaker: Professional version. In this
    version of GameMaker, developers have access to all of the tools of the Standard
    version with the'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Selling Games and Licensing Fees


    addition of being able to export games to the Windows app platform. If your goal
    is to create games for the Windows PC and app market, this would be all you needed.
    Additional export options can be purchased for the Professional version of GameMaker,
    allowing designers to choose to purchase only the export options they desire.
    If a designer or a game company wanted all of the various export options that
    GameMaker has to offer, they would want to purchase the GameMaker: Master Collection,
    which contains all exporting options. As each of these export options are discussed
    in this chapter, keep in mind that each one does not come with GameMaker: Standard
    can be purchased individually to the Professional version and all of them come
    with the Master Collection. For example, another Windows platform export available
    is the Windows 8 export. This export is available with the Professional version
    of GameMaker and is designed for buyers wishing to play games on their Windows
    8 phones.


    # Mac Platform


    Mac OS X allows designers to create games that can be exported for use on machines
    Mac OS X. The Mac iOS export is designed for mobile devices such as iPads and
    iPhones. Before entering into steps that may be required to publish games these
    platforms. To publish games for iPads and iPhones, you will need a Mac developer’s
    license first. This is also true for developers wishing to publish their games
    for various game consoles. Additional information on developer licenses is outside
    the scope of this particular book as this information is constantly changing for
    consoles. Developers will want to research what type of developer license, if
    any, is needed for the console they are wishing to develop before beginning any
    project.


    # Game Consoles


    GameMaker also exports to the latest game consoles such as the Playstation 3,
    Playstation 4, and the Xbox One. Each of these export modules are sold separately
    for the GameMaker Professional version developers may wish to research which console
    their target audience is most likely to be before purchasing. Other game consoles
    are also available on the market with more development. The Ouya game console
    may be a good option for game developers using GameMaker. The Ouya console is
    much newer than both the Playstation and Xbox Ouya uses Android as its operating
    system and supports games created with GameMaker. Ouya requires games to be submitted
    for free for users to play or at least contain free components. This may mean
    developers publish a series of game levels for users to play for free with the
    option of purchasing more advanced levels. Game developers may instead wish to


