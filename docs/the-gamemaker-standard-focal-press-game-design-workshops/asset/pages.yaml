  md: '# GML Terminology


    This chapter on GML introduced new terminology that may not be familiar to individuals
    that have not tried coding before. There are various other types of coding languages
    and GML is just one of them. GML stands for Game Maker Language as it is the coding
    language that GameMaker understands. Other engines use different languages. Learning
    GML can assist you in learning coding languages as many of them have similar structures.
    For a complete list of build-in GML variables, click on the Help tab in the GameMaker
    program, then go to Contents>Reference>GML Language Overview. Another term we
    use in this chapter is scripting. As a script for a movie tells what will happen
    in the film, a script in a video game tells the game what will happen. We also
    saw references to vspeed, which indicates the vertical speed an object is traveling,
    and reference to image_scale, which hold the game what direction is facing on
    the x-axis. Many of these terms and references may have seemed foreign to you
    as you began this chapter, but now that you have created a game that required
    typing code, we hope the odd-looking snippets are starting to make sense. Coding
    is a language and the best way to learn any new language is to practice it frequently
    and by learning new expressions. Using code as a game developer can not only save
    time but also allow designers greater flexibility for the actions of the objects
    in the game.'
