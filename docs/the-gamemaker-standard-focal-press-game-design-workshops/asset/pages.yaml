  md: '# THE GAMEMAKER STANDARD


    The answer to the riddle is the letter M.

    When the player enters Level Two they will find that the entire floor is made
    up of tiles that what appears to be roman numerals carved into them. Each tile
    has a separate letter. If the player figured the riddle, they will see if they
    have controlled their character to walk only on the tiles with the letter M on
    that the character could make it all the way the room to reach a treasure chest.
    If this was the only obstacle in the room, the level would be too easy. In order
    to make it more challenging, we will have flying sawblades made of ice toward
    the player so that they will need to move quickly or shoot quickly to destroy
    the sawblades. To create Level Two we will be using a tile set.


    # Using a Tile Set to Create the Level Two Floor


    +   **Step 1:** Open the Background named tile_room_two.

    **Step 2:** Check the Use as Tile Set box.

    **Step 3:** The tiles are now ready to be placed throughout the room. Open room_level_two
    and select the Tiles tab and pick tile_level_two.


