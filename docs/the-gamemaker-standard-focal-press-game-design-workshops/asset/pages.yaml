  md: '# Multi-Level Games


    Learning Objectives—Upon completion of Chapter 3 readers will be able to:


    +   - Incorporate transporters that navigate to additional levels

    - Create additional levels

    - Incorporate puzzle design elements to their game

    - Program Artificial Intelligence (AI) behavior

    - Use tile sets to add objects to their game

    - Show the player how to play the game without using text directions

    - Modify their game using game objects, sound files, and graphics


    # Project Overview: Lost Dog


    There is nothing worse than being lost, especially when you are a little puppy
    that has wandered too far from home. In the game Lost Dog which we are about to
    create, the player is a small dog trying to find its way. The dog journey through
    a haunted graveyard as well as a mysterious cavern before finding its way home.
    Although we will only be creating two levels for this game, the concept could
    allow designers to create many different types strange levels that the dog must
    navigate through before making it.


    Through creation of this game, readers will learn how to create multi-level games
    and incorporate simple puzzle elements into their game to make it more challenging.
    This chapter will also introduce artificial intelligence programming as we add
    ghosts to the graveyard and have them patrol certain areas. The player must recognize
    the


    ![](img/584600b080035f863f96e219491bffbd_73_0.png)'
