  md: '# Creating an Event


    Next, let''s add an event for this object. An event tells the game which action
    should take place when a certain key is pressed or if a particular circumstance
    occurs—such as the object colliding with another. Action is what occurs if the
    player hits the key or the object collides with another. In this particular place,
    we want to create a couple of keyboard events that allow the player to move the
    scout up and down when the player presses the arrow keys.


    **Step 1:** Click the Add Event button at the bottom of the window to open up
    the event options.


    **Step 2:** Choose a Keyboard Event and select the <Down> key. This will add a
    new <Down> key event in the Events window.


    **Step 3:** Now add another Keyboard Event for <Up>.


    **Step 4:** Look on the right side of the Object Properties window and choose
    the Move tab. (These tabs are sideways, like dividers in a notebook.)


    **Step 5:** Look under the Jump submenu for the Jump to Position icon; it has
    a green arrow pointing up and to the right to a white square. Click once on this
    icon and drag your cursor to the Actions window. Doing so adds the Jump to Position
    Action to the Actions window and simultaneously open the Jump to Position properties
    so that you can input the specific details of this action.


    ![](img/584600b080035f863f96e219491bffbd_26_0.png)


