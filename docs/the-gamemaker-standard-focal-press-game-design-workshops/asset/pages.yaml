    outside the room in order to have a bit less, which is fine.


    In order to give the appearance that the dog has fallen into the hole, we will
    need to add some dirt in front of the hole which is also a bit closer to view
    than the dog is. Using patch of dirt as shown below the hole we can create this
    illusion.


    Step 7: Add a new layer with a depth of -3.


    Step 8: Select the patch of dirt as shown in Figure 3.32.


