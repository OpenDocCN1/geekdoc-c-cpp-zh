  md: '# Glossary


    **2.5D**—2.5D uses two-dimensional images in such a way that they create the illusion
    they are moving in a three-dimensional space. Before computer technology allowed
    designers to create fully three-dimensional images, 2.5D was a common technique
    used to simulate a 3D environment.


    **AI**—Artificial Intelligence.


    **Android**—Operating system used on many cell phones and the game console Ouya.


    **Aspect Ratio**—The dimensions of the viewable area of a game as they relate
    to the height of the game window in comparison to the width.


    **Assets**—Resources used to create a game such as graphics and sounds.


    **Authoring Tool**—A program designers uses to create software.


    **Background**—The image behind the action of a game.


    **Block**—Drag-and drop software that allows designers to drag blocks that represent
    items of code rather than having to type code.


    **Bounding Box**—The area around a character or object in a game that represents
    the object''s surface area is.


    **Browser**—Used to search and access web pages on the Internet.


    **Build**—Each new version of a game is called a build. As features are added,
    a new build of the game is created.


    **Bullet**—A projectile that shoots in a game. Although these projectiles are
    called bullets, they can actually appear as any type of object in game.


    **Canvas**—The visual area of the game that players can see in which all game
    elements are placed.


    **Check Empty**—When the software identifies if a particular area is free of objects
    or not.


    **Coding**—Language that instructs the software what to do.


    **Collision**—When two objects hit one another.


    **Collision Checking**—When the software identifies whether or not two objects
    have hit by another.


    **Commercial Games**—Games created for entertainment and profit.


    **Competitive Play**—When two players are playing the game with different goals.


    **Console**—Hardware used to play games specifically designed for the device.


    **Coordinates**—Used to identify where a particular object is located at on the
    canvas.


    **Designer**—Someone who creates games.


    **Destroy Instance**—When a object no longer exists.


    **Dialog Box**—A message providing the player with information relating to the
    game.


    **Different Room**—After completing a level, the player will move to a different
    room that signifies the next level or title screen


    **Drag-and-drop**—Selecting objects with the mouse and moving them to a different
    location.


    **Draw Score**—Used to create a visual representation of the player''s score at
    any time within the game.


    **Else**—The action that takes place if a series of variables is not met.


    **End of a Block**—GameMaker that signifies the end of a series of actions.'
  merge: -1
