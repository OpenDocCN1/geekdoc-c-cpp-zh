    # Project Overview: Scout


    Our game is Scout, a classic space-themed side-scroller in which the player controls
    a space spaceship assigned to destroy approaching asteroids. A side-scrolling
    game is one in which the screen moves from one side of the screen to the other
    with the camera following the player in the center of the screen. The player has
    three lives and unlimited ammo to destroy as many asteroids as they can. Each
    asteroid destroyed increases their score. Along the way, the player will collect
    power-ups which give the ship temporary special abilities. All of the graphics,
    sound effects, and music required to create this game can be downloaded from the'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'GameMaker Standard website. Graphics and sound files are commonly referred
    to as game assets and should be saved on a location where you can easily find
    them. Go to www.thegamamakerstandard.com/scout and download the Scout Game Assets
    zip file. Be to unzip all of the files and place them on your computer. After
    downloading the assets folder read over the updates.pdf document which contains
    any changes since the publication of this book. With the game assets downloaded,
    it is time to run the GameMaker software and get to work designing your first
    game.


