  md: '![](img/584600b080035f863f96e219491bffbd_115_0.png)


    # Incorporating Puzzle Elements


    Level two has our dog entering a cave environment. The nice thing about the Lost
    Dog premise is that hundreds of levels can be created in which the dog has to
    navigate through stronger environments. For our purpose of learning GameMaker
    we will only be creating these two levels, however. In level two the objective
    is for the player to look at the broken stalactites at the top of the screen and
    envision where the other broken part is under the slime. This is where the dog
    will be able to jump and not fall into the slime. We will have the first platform
    in the slime obvious so that the player can figure out the puzzle of looking at
    the top of the screen to see where to jump in the slime. The player will then
    attempt to make their way to the end of the level while avoiding any ghosts.


    # Creating the Illusion of Falling into the Slime


    To give the appearance that the dog is falling into the slime we will place the
    top layer of the slime on a high layer and then place the rest on a layer that
    is lower than the dog. For example, if the dog is at a depth of 0 then the slime
    should be at -1. The platforms that the dog will land on then be set to -2. Use
    Figures 3.46 through 3.50 below as a guide when creating your level.'
