  md: 'portion of the code reads as: if place_free(x-4, y)(x=4). In this particular
    line of code opens parenthesis before the letter x has a paired close parenthesis
    after the y. With coding, parentheses always come in pairs. The same holds true
    for the brackets around the x=-4. Forgetting to type the second parenthesis or
    bracket in a line of code is a common mistake and unfortunately results in an
    error that prevents the intended action from being executed. The intended action
