  md: '# Creating a Parent Object


    With the colliders in place we will set up a parent trail so we do not need to
    make a collision with both trail objects for both snails. This is a time-saving
    technique that reduces the amount of redundant collision events.


    **Step 1:** Create a New Object named **obj_trail** with no sprite.

    **Step 2:** Open both **obj_yellow_trail** and **obj_purple_trail** and set the
    parent option of each to **obj_trail** as shown in **Figure.4**.


    Now we will be able to set up one collision event for the trails of both snails
    at the same time.


    **Step 3:** Open both of the snail objects and add a **Collision** Event to each
    with the **obj_trail**.

    **Step 4:** Add a Destroy Instance Action to the collision events for both snails.


