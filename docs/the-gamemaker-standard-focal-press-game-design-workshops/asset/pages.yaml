  md: '# Earning a Living


    Creating and selling games is a highly competitive field and there are not any
    guarantees that your games will be successful. Testing your game with various
    audiences and incorporating constructive feedback can help you create better games.
    You may not succeed on your first try, not many do, but the ones that succeed
    are naturally the ones that did not stopping. Although the game creation field
    is very competitive, if it were impossible to earn an income you can survive on
    creating games, there would not be so many people and companies competing. The
    skills you learned while working through the chapters of this book will help you
    on your journey of developing your game skills. You may wish to continue using
    this book in the future as a reference source to refresh your skills in a particular
    area. Additional information associated with The GameMaker Standard book can be
    found at this book''s companion website: www.thegamemakerstandard.com.


