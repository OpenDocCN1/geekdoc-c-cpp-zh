    - Identify export options available in GameMaker\n- Compare upgrade options for\
    \ specific target audiences\n- Identify advantages of each exporting option\n\
    - Recognize multiple options for selling their game\n\n# ## Exporting Options\n\
    \nGameMaker provides multiple exporting options designers can use to publish games\
    \ for specific platforms. With various operating systems and game consoles on\
    \ the market, it is necessary for games to be exported in different formats so\
    \ that they can be played on a variety of devices. If, for you wanted to create\
    \ a game that will be played on mobile devices, then you would want to export\
    \ your game one way, whereas if your audience is using a specific game console,\
    \ then you would want to export your game specifically for that particular console.\
    \ Fortunately, these exporting options allow you to create your game one time\
    \ and then through exporting, the game becomes customized for the different platforms\
