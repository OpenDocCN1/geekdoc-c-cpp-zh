    and select Create Object.** This opens the Properties dialog window.


    **Step 2: In the Name:** section at the top left of the window type: **obj_scout.**


    **Step 3:** You will notice directly below the name section that <no sprite> is
    written in the grey rectangle. This tells us that there is currently no graphic
    for this object. Let''s choose our hero idle sprite. The term idle refers to what
    a player''s image looks like when the player is not pressing any keys. If this
    object was a person, the idle state would have a sprite of a person just standing,
    whereas if the player presses a certain key on the keyboard the image would change
    to an image or series of images of the person walking.


