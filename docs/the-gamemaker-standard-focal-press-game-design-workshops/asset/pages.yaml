  md: '# Adding Variables


    Now it is time to add a variable. The variable tells GameMaker to check the location
    of the ship and stop moving up too far so it does not leave the playing area.
    We will also make it that the ship cannot move down the playable area.


    **Step 1:** While the Control tab for the \<Up> Event is selected, look under
    the Variables submenu and choose the center icon named **Test Variable**. Drag
    it above the **Start of a Block** Action.


    **Step 2:** In the Test Variable options, make sure the **Applies to** is set
    for **Self**.

    **Step 3:** Type **y** in the variable option and the number **32** in the value
    option. Then click **OK** to close the Test Variable option. This will check to
    see where the ship is on the y axis and will not allow it to move on the y axis
    past the top edge of the game.


