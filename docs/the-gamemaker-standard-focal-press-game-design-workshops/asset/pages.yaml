  md: '# Adding Pick-Up Items


    The game as it currently stands is pretty challenging but we want to add some
    elements that will add a bit of strategy to the gameplay. We will now add two
    different items that the players can pick up. These items will be in the form
    of different colored mushrooms. If a player picks up a red mushroom they will
    be able to freeze their snail invulnerable for a limited time. This will allow
    player to move their snail over trails without being harmed. This type of pick-up
    item is different than the power-ups we were activated in the Scout game because
    in Snail Trail the player can freeze the other immediately after the player getting
    them. This option becomes more relevant when it comes to the second pick-up item,
    which is a blue mushroom. The blue mushroom allows the player that it picked up
    to freeze the other character when the blue mushroom is activated. When used strategically,
    the player could pick the mushroom and save it until they are near the other player.
    Then they can freeze the other player and move in front of them that when the
    other player starts moving again they have no choice but collide with the other
    player''s trail. To make the decision process on to use the pick-up item more
    challenging, each player can only hold one item at a time. So if a player picks
    up a red mushroom and picks up a blue mushroom without using the red one, they
    will lose the red mushroom.


    Earlier in this chapter we discussed keys that are commonly used for games and
    keys that are frequently not used because they can activate options on the computer.


    ![](img/584600b080035f863f96e219491bffbd_130_0.png)


    118'
