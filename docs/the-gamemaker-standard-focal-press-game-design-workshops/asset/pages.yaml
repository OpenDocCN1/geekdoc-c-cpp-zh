    # Adding a Kill Zone Object


    In game design terms a kill zone is any area in a game that kills the player''s
    character instantly when the character enters the area. Kill zone objects are
    placed in games where there are hazards such as fire or lava virtually any other
    type of hazard that would kill a player''s character instantly. We will be creating
    a kill zone and placing it on all of the tiles in Level Two that are not marked
    with the letter M. If a player were to step on an incorrect tile, it would trigger
    the player''s defeat animation and the player would return to the previous room.


    **Step 1**: Two sets of colliders are needed for this room in addition to the
    next level trigger. Create a **New Object** and name it **obj_killzone**, assign
    the sprite spr_killzone to it, **Uncheck** the **Visible** option.


    **Step 2**: Open **obj_player_bronze** and add a **Collision** Event with the
    **obj_killzone** object.


    **Step 3**: Add a **Change Instance** Action and set the following:


