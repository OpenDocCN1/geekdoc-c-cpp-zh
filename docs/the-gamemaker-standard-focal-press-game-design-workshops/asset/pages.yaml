  md: '![](img/584600b080035f863f96e219491bffbd_27_0.png)


    Our next step requires us to understand coordinates in GameMaker since we will
    be setting the y axis to -4. In GameMaker, x refers to the horizontal axis while
    y refers to the vertical axis. Thus, if an object was located in the top left-hand
    corner of the game screen it would be located at x = 0 and y = 0. If we were to
    set an object to move with x = 0 and y = 0 to x = 25 and y = 0, then we know that
    the object would remain at the top of the screen but move toward the right of
    the screen along the x axis.


    **Step 6**: Change the y option to -4 and make sure the Applies to: radio button
    is set to Self.


    **Step 7**: Set the relative box that it is checked. By checking the relative
    box, you are telling GameMaker that you want the object to move from number of
    spaces from the current position''s position.


    **Step 8**: Choose OK when complete to close the **Jump to Position** properties
    box.


    Now, with the up arrow key pressed, the ship will move upward on the screen. We
    need to make similar changes to the **<Down>** Event as well as that the ship
    will move downward when the arrow key is pressed.


    **Step 9**: Click the **<Down>** Event and repeat Steps 4 through 8 with one small
    change: This time, instead of entering **-4** as the y option, you want to enter
    **4** so the ship will move the opposite direction (down instead of up).'
