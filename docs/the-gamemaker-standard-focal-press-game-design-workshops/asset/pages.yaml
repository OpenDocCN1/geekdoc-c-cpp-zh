  md: '# About the Artists


    # Richard Graham


    Richard is a concept/illustration artist who has been drawing since he was seven
    years old. He learned to draw by looking over his brother''s shoulder while his
    brother was sketching. Drawing allowed Richard to bring to life anything he could
    think of art. He began by designing fictional vehicles and eventually moved on
    designing anime and cartoon characters. It was through art that he won his first
    trophy in an art contest. It was when Richard began selling sketches to other
    children in school that he began to realize how many people love art. He did not
    realize he could work as an artist as a penciler, Linker, or just a freelance
    artist altogether. After seeing game designers can take an artist''s style and
    work if he wanted to be a part of the game design industry, Richard enjoys various
    art styles from manga to comic artists like Mike Mignola, Greg Capullo, Humberto
    Ramos, and John Romita. He always wanted him to do something with his art and
    before she passed away he promised her he would do his best to break into the
    art industry. It is this that keeps him focused on continually developing his
    art skills. It was first introduced to programs such as Photoshop and tools such
    as drawing on a Wacom.


    # Whitney Joyner


    Whitney first found her love for the arts when she was in middle school. A friend
    taught her to draw anime after she spent her middle and high school years drawing,
    taking art classes, and honing her drawing skills. The friendly most mostly drew
    Whitney''s art style naturally also took the look of anime. As she continued to
    study and practice her art gradually to morph into something more of her, which
    she describes as cartoonized. Whitney discovered the field of game by accident.
    She was looking into colleges when another friend had extra reservation to an
    open house at an art college. She talked to the dean who asked about some things
    she enjoyed and from what Whitney told her, she suggested the gaming field. She
    ended up checking out the Simulation and Game Development program at Wayne Community
    College because it was closer to home than the college she visited. She found
    that she really liked the idea of going into the field of game design and soon
    after started her path into gaming art.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Andrew Sanders


    Andrew started drawing when he was four years old. His parents said even then
    that he could draw pretty anything he could see. He focused mostly on comic book
    art and wanted to go into the comic book field for a while. When Andrew was in
    high school he had an art teacher tell him that he was drawing "wrong" he left
    for a while and went into drafting. That led to CAD, which he is really skilled
    in CGI. When Wayne Community College started the Simulation and Game Development
    (SGD), it was a perfect time for him because he had gotten out of the hospital
    and did not go back to full time for a while. Prior to the SGD, Andrew had to
    use 3DS Max, and it was pretty challenging without formal help. During his first
    semester at Wayne Community College, he took Maya and Game Textures and fell in
    love with the whole system. Then, he has never stopped working with Maya. It is
    by far one of his favorite things to do. He has recently started Zbrush, which
    has been a great tool to work with as well. Some of Andrew''s favorite things
    to create are vehicles, mechanical creatures, and robots.


    # Jennifer Vinciguerra


    Jennifer Vinciguerra does a little bit of everything well. One might call her
    a "Jill of all trades." A woman of many skills, she helped her husband, David,
    with this book in a variety of ways: She composed and performed the eerie violin
    music for the Lost Dog game; Snail Trail, and Blood Vessel and colored some of
    the artists'' graphics used to blend them together; best of all, she most enjoyed
    creating all of the graphics for Keeper of the Oracle, partially the landscapes.
    In addition to create work, Jennifer also pitched in toproof a bit of the technical
    writing and tested instructions for clarity by building some of the games as instructed
    in the chapters.


    Jennifer holds a Bachelor of degree in Geography from the University of North
    Carolina, which is probably why she enjoys maps and landscapes for games. She
    also holds a Master of Science degree in Instructional Technology as well as a
    graduate certificate in Virtual Reality in Education and Training from East Carolina
    University (ECU). After working for five years she opened her own Suzuki Violin
    studio where she currently teaches 15 students and puts to use all those years
    of violin lessons her parents invested in. Teaching violin allows her to spend
    quality time with her family, to employ her hedgehogodge multimedia skills for
    promoting the studio, and to help her husband, David, with his exciting projects—like
    textbook authorizing.'
