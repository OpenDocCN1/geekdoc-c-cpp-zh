    Now you place and call the obj_ghost in the room and run it with the dog, the
    dog will flip over and fall, thus restarting the game.


    Place the ghosts throughout the level in places that would add more difficulty
    to the player. One option that can make the game challenging is by placing a ghost
    on a brick wall. As the ghost turns away from the dog the player must follow the
    ghost and time their movements so they can jump down the wall before the ghost
    returns. Be careful not to make the game impossible to beat. A challenging game
    is fun, an unbeatable game.


    This game will consist of two levels. Once the player has navigated the graveyard
    successfully, they can call a teleporter to the next level. A teleporter can be
    anything such as a door, an elevator, or a giant pipe in the ground like those
    seen in the Mario universe. Once a player''s character comes in contact with a
    teleporter, it is transported to the next level. We are going to add a cave at
    the end of our first level, which will lead to the second level of our game.


    # Creating a Teleporter


    Step 1: Create a new object and call it obj_level_collider.


    Step 2: Set the new object''s sprite to spr_collider and click the box Visible
