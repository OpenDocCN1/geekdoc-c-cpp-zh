  md: '# CHAPTER 1


    ![](img/584600b080035f863f96e219491bffbd_13_0.png)


    # # What Is GameMaker: Studio and Who Uses It?


    Learning Objectives—Upon completion of Chapter 1 readers will be able to:


    +   - Describe what a game engine is

    - Identify popular commercial games created with the GameMaker: Studio engine

    - Identify which game genres GameMaker: Studio is well suited to

    - Recognize the various platforms games can be exported to


    # ## Where to Start


    GameMaker: Studio''s user-friendly drag-and-drop interface allows both hobbyists
    and professionals alike to easily create video games. GameMaker: Studio allows
    potential designers with little or no coding experience to quickly design games
    and export them to various platforms. More advanced designers can use of Game
    Maker Language or GML, the coding language of GameMaker: Studio, to create dynamic
    professional commercial products. This book will train you to use the GameMaker:
    engine to create games in a variety of genres starting with the basic tools GameMaker:
    Studio provides and continuing to advanced options and techniques including GML.
    The first step in our journey is to explore in more detail what GameMaker: Studio
    is and who uses it.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# # What Is GameMaker: Studio?


    GameMaker: Studio is a game engine which allows users to easily create games by
    using drag-and-drop options and an easy-to-navigate interface. As users learn
    the basic steps and tools to create games they can then incorporate more advanced
    features into their games and customize their games further using GML, the coding
    language of GameMaker: Studio. The term game engine is used to describe any software
    program which provides game creation tools allowing users to having strictly rely
    on coding. Although games can be created using only coding, engines allow users
    to skip much of the basic coding by means of drag-and-drop options and game property
    boxes in which designers can type in specific actions for objects within


    # # Who Uses GameMaker: Studio?


    Although GameMaker: Studio is used by many hobbyists and students due to its user-friendly
    interface, it should not be considered a tool only for the novice. Many wellcommercial
    games have been created using GameMaker. A quick search through the games on the
    popular gaming website Steam, located at http://store.steampowered.com, will pull
    up examples of commercially successful games created with GameMaker: Studio. An
    impressive list of games and comments by the designers using GameMaker: Studio
    can also be located on the YoYo Games Showcase website. Included here are descriptions
    of a few of the games from the showcase with the designer''s comments. You might
    find that you have already played the games, not yet they were created using GameMaker:
    Studio.


    Gunpoint—The game Gunpoint published by suspicious Developments Ltd. is a puzzle
    game that allows the user to review to each level to defeat the enemies. According
    to Francis Desmond, writer of Gunpoint, "The best thing about GameMaker work is
    that it gives you confidence if you are writing code. You don''t need to write
    anything to make something work, but you can enjoy to learn how to write simple
    instructions as you may. You might end finding freely without any steep learning
    curve".


    Hotline Miami—Jakob Söderström of Denomination Games, based in Sweden, released
    the popular game Hotline Miami in the fall of 2010. Söderström has stated, "I
    would probably not be where I am without GameMaker. It''s been an amazing tool
    that really helped me getting into game design."


    Risk of Rain—The game Risk of Rain developed by Duncan Drummond and Paul of Horopo
    Games and released on Steam in 2013 incorporates elements'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'permanent death and randomly spawning enemies. On the topic of GameMaker, Drummond
    suggests that, "It is magic. GameMaker allows you to circumvent the difficulties
    of programming, allowing you to focus on more important aspects like game design
    and player interactions. If you''re not making games, or just want to make games
    fast and efficiently, GameMaker is the only option.


    **Super Cute Box and Nuclear Throne**—Rami Ismail and Jan Willem Nijman of Vlambeer,
    a dutch independent game studio, created both Super Cute Box and Nuclear Throne
    using GameMaker. Ismail informed us that ''GameMaker is what the designer at Vlambeer
    has been using since he was thirteen years old. GameMaker is the development tool
    that allows the fastest iteration, allowing us to create games that feel great
    simply by iterating over everything rapidly"


    # GameMaker: Studio Features


    The version of GameMaker: Studio we will be using to create all of the games in
    this book is GameMaker: Studio Standard. GameMaker: Studio Standard is free to
    use and can be downloaded from the Yo Games website at www.yoygames.com. GameMaker:
    Studio Standard has all the features required to complete the games in this book
    with primary restrictions including registration, the exported game will include
    a "Made with GameMaker" splash screen, and games created can only be exported
    to the Windows platform.


    There are two other versions of GameMaker: Studio: The Professional version and
    the Master Collection. The GameMaker: Studio Professional eliminates the need
    for registration and has the splash screen removed. Professional also includes
    additional features not present in the Standard version yet exports only to the
    Windows platform. GameMaker: Studio Professional contains all features and includes
    multiple export options such as OS export, HTML, Android, Xbox One, PlayStation
    4, and Ubuntu Linux, among others. Each of these platforms can be purchased separately
    for GameMaker: Studio Professional, allowing developers who are only looking to
    export one or two different platforms those options rather than paying for everything.
    A full comparison list of differences between these three versions of GameMaker:
    as well as a complete list of the export options, can be found on the Yo Games
    website mentioned earlier. In February 2015 Yo Games was acquired by Playtech,
    the oldest and most successful software supplier in the real-money gaming industry,
    according to Nadav Goshen, Pleame Advisor, and Mor Weizer, CEO of Playtech. Playtech
    plans to invest more resources into improving GameMaker so it will appeal to a
    wider demographic, including the advanced developer segment.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Game Genres Ideal for GameMaker: Studio


    With GameMaker: Standard you are not limited to create just one particular type
    of game. In the following chapters we will be creating a variety of crossing multiple
    game games. In Chapter 2 we create the game Scout, which is a traditional Shoot
    ''Em Up-style game where we create an asteroid-blasting spaceship, in Chapter
    3 we incorporate puzzles into a side-scroller game, and in Chapter 4 we create
    our first player competitive game. Each chapter afterward explores other genres.
    GameMaker: Studio provides us with the options to actually create the games we
    have long been imagining.


    # Download and Install GameMaker Studio: Standard


    Before starting Chapter 2: Side-Scroller Game Basics, download GameMaker: Studio
    Standard from the YoYo Games website (www.yoyogames.com), then install and run
    the software. The journey of game development is about to begin!


