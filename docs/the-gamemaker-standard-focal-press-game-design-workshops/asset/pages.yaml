    object. Objects allow us to tell the sprites how they should appear and act. Once
    a sprite has been added to an object, we can tell the object to move up and down
    when the player hits certain keys on the keyboard. Or, we can tell the sprite
    to rotate with all the asteroids. The first object we create is our player''s
    ship.


