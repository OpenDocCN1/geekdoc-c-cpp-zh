  md: 'chapter we will be concentrating on the core aspects of creating an RPG. Fundamental
    aspects included in most RPGs include:


    +   * A store in which the player can purchase items for their character

    * Pick-up items such as weapons or coins that the player can use in the game

    * A system of keeping track of what items a character has and illustrating them
    in the HUD

    * A simple captivating story that drives the player to continue the game

    * Dialog boxes which give the player information needed to know for what to do
    next

    * Increasing challenges in which players must strategize to complete


    In the list above the abbreviation HUD, which stands for Heads-Up Display, A HUD
    is an onscreen interface that shows the player various stats from the game. In
    previous chapters the game HUD showed the player''s score and lives. The game
    will be used to keep track of how many coins the player has and what weapon is
    currently held.


    In Keeper of the Oracle, the player receives instructions from the oracle via
    dialog boxes. The player goes on a series of mini-missions to complete the tasks
    assigned. Each mission changes what the player is carrying. The first mission
    allows the player to pick a weapon. The second mission provides the player with
    coins. The third mission introduces the character to the store where they will
    purchase a new, more powerful weapon with the coins picked up in the previous
    mission. The last mission has the player using their new weapon to defeat a powerful
    enemy and win. Additional information on each mission will be provided throughout
    the chapter to provide context why we are adding elements to the game. We will
    start by downloading the game assets for Keeper of the Oracle from www.thegamemakerstandard.com/oracle.
    After downloading the assets folder read over the updates.pdf document, which
    contains any changes since the publication of this book.


