    # Creating Pixel Art


    Pixel art is a popular style of game graphic art that is reminiscent of the 8-
    and 16-bit games from the early 1980s. Although pixel art games could invoke of
    nostalgia, there is a growing fan base for this style of game art players who
    were not born when these original games were released.


    There are many different methods of creating pixel art for games. Some artists
    will draw a high resolution graphic and then reduce the number of pixels in a
    graphic editing software program like Adobe Photoshop. Others will create graphics
    using basic drawing tools like Microsoft Paint. There is not a right or way to
    create pixel art so long as the result is your liking. For some game we will be
    using the image editor in GameMaker to fill candy and pumpkin images, deleting
    them, and drawing our own version. The main purpose of this portion of the development
    is not to become an expert in designing pixel art as that takes time and practice,
    but rather to be familiar with the term; how pixel art can be created in GameMaker,
    as well as introducing the drawing tools in GameMaker.


    Step 1: Open the spr_pumpkin_one sprite.


    Step 2: Select Edit Sprite. This will open up the Sprite Editor.


    Step 3: On the Sprite Editor toolbar click on Edit. Then select Edit from the
    drop down list.


    Step 4: This will open the Image Editor allowing you to change the style of pumpkin.
    You can zoom in on the image using the mouse button or scroll wheel.


    Step 5: Use the Eraser Tool to erase the existing pumpkin image. You can also
    use the Selection Tool to select the entire pumpkin and then press the Delete
    Key on your keyboard to delete the current image.


    Step 6: Use the drawing tools to draw the outline of a new pumpkin. As you hover
    over each tool a label pop up telling you what the tool does. Experiment with
    the different tools. For the pumpkin you may wish to start with a circle tool
    and use the fill tool to fill in the color for the pumpkin.


    Step 7: Add the pumpkin''s face and details. To add shading, use a color darker
    than the color you are shading.


    Step 8: When your pumpkin is complete, go to File>Close Save Changes. This will
    replace the original pumpkin with the new pixel art drawing you have made.'
