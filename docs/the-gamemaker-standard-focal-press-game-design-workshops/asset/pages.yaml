    # 2.5D—Simulating a 3D Look in a 2D Game


    Learning Objectives—Upon completion of Chapter 6 readers will be able to:


    +   - Define what a 2D game is and how it differs from 2D and 3D games

    - Illustrate techniques used to create the illusion of depth

    - Use sprite sheets to create three-dimensional-looking objects

    - Define what an optical illusion is and how it can be incorporated into game
    design

    - Understand how the human eye sees objects in a three-dimensional space

    - Create an in-game health bar


    # Project Overview: Blood Vessel


    In Blood Vessel, the player is piloting a microscopic vehicle which is traveling
    through another''s bloodstream. The player will want to blast antiviral charges
    at the green viruses that have found their way into the victim''s bloodstream.
    The player will also want to destroy the healthy blood cells. A health bar at
    the top of the screen will track the player''s progress. For each virus that is
    destroyed the green portion of the health bar will increase showing that the person
    is becoming healthier. In contrast for every virus that is missed and every healthy
    cell that is destroyed the red portion of the health bar will increase indicating
    that the person is gettingicker. This game uses a series of optical illusions
    to create the impression that the blood cells and viruses are moving toward the
    player''s ship in a 3D space. We will go into further detail for each of these
    illusions as we add them to the'
