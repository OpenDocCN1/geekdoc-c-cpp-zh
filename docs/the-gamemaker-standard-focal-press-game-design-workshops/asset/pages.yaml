    # Creating a Persistent Object


    For the remainder of this chapter we will be creating each room in the order that
    it will appear when played. The first object we need to create is an object that
    will persist through all the rooms. This object will be used to store values;
    for example, it will keep track of how many coins the player has obtained so that
    the player does not lose them when change rooms.


    **Step 1:** Create a **New Object** `obj_control`.


    **Step 2:** Add a **Create** Event and add a **Set Variable** Action. Set the
    following:


    Variable: global.myCoins

    Value: 0


    **Step 3:** Add a **Set Variable** Action and set the following:


    Variable: global.myWeapon

    Value: 0


    **Step 4:** Add a **Set Variable** Action and set the following:


    Variable: global.hasGem

    Value: 0


    **Step 5:** Add a **Set Sprite** Action and set the following:


    Sprite: spr_hud

    Subimage: 0

    Speed: 0


    **Step 6:** Add an **Other: Room Start** Event.


    **Step 7:** Add a **Change Sprite** Action and set the following:


    Sprite: spr_hud

    Subimage: global.myWeapon

    Speed: 0


    This will make the HUD display the appropriate subimage for the weapon.'
