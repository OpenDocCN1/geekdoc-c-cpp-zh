    ## Variables


    Now it is time to add a variable. The variable tells GameMaker to check the location
    of the ship and stop moving too far so it does not leave the playing area. We
    will also make it that the ship cannot move down the playable area.


    **Step 1:** While the Control tab for <Up> Event is selected, look under the Variables
    submenu and choose the icon **Test Variable**. Drag it above the **Start of a
    Block** Action.


    **Step 2:** In the Test Variable options, make sure **Applies to** is set for
    **Self**.

    **Step 3:** Type **y** in the variable option and the number **32** in the value
    option. Then click **OK** to close the Test Variable option. This will check where
    the ship is on the y axis and will not allow it to move past the edge of the game.


    Now we need to make similar changes to the <Down> Event.


    **Step 4:** Select the <Down> option and drag the **Start of a Block** and **End
    of a Block** icons to the window just as you did for the <Up> Event.


    ![](img/584600b080035f863f96e219491bffbd_31_0.png)


    FIGURE 2.14


    **Step 5:** Drag the Test Variable above the Start of Block icon and set the following
    parameters:


    - Applies to: Self

    - Variable: y

    - Value: 544

    - Operation: less or equal to


    **Step 6:** Select OK to close the Test Variable window. Also select OK to close
    the Object Properties window.


    ## Creating a Precise Mask for Collision


    **Step 1:** Choose the Sprite named spr_scout_strip3 and double-click to open
    the Sprite Properties window.


    **Step 2:** In the Sprite Properties window, find the Origin section and click
    the Center button.


    ![](img/584600b080035f863f96e219491bffbd_32_0.png)


    FIGURE 2.15


    ![](img/584600b080035f863f96e219491bffbd_33_0.png)


    **Step 3:** In the Collision Checking area, select the Modify Mask button.


    **Step 4:** In the Mask Properties window that appears, choose the precise radio
    button in the Shape section. This will tell GameMaker where something could collide
    with our ship. If we have a large square area around the ship, an asteroid could
    hit the square and destroy the ship yet on screen it would appear as though asteroid
    missed the ship, which is not what we want.


    **Step 5:** Keep all other options as their defaults. Select OK to close the Mask
    Properties window and OK to close the Sprite Properties window.


    ## Placement of the Hero Object


    **Step 1:** Under the Rooms on the left-hand side of the screen, double-click
    room0. This will open up the room with the starfield background.


    **Step 2:** Next, click the Objects tab on the left of the window. Click anywhere
    in the scene to place the ship. Click and hold to drag it. Place so that there
    is one column of the grid to the left (back side) of the ship so that the ship
    is not touching the left wall. If you accidentally place more than one ship in
    your scene, you can right-click on the extra ship and choose delete to remove
    it. Click the green button to save your changes and close the Properties window.


