- md: "\n# Game Maker Language GML\n\n![](img/584600b080035f863f96e219491bffbd_213_0.png)\n\
    \n```gml\n// Event: obj_dog_any_key_j\n// Left\nif (keyboard_check(vk_left)) {\n\
    \    if (place_free(x-4, y)) {\n        x -= 4;\n        image_xscale = -1;\n\
    \    }\n}\n\n// Right\nif (keyboard_check(vk_right)) {\n    if (place_free(x+4,\
    \ y)) {\n        x += 4;\n        image_xscale = 1;\n    }\n}\n\n// Jump\nif (keyboard_check_pressed(vk_up))\
    \ {\n    if (place_free(x,y-1)) {\n        vspeed = -12;\n    }\n}\n```\n\nFIGURE\
    \ 7.8\n\n## Deciphering the Jump Movement Code\n\nThe code we will add to check\
    \ is if the **up key was pressed**. This portion of the code should look similar\
    \ to what we have coded before. The next portion checks if there is a **solid\
    \ object below the dog**. The code `place_free` is the same as saying \"place\
    \ is not free\". Exclamation points are used to represent **NOT**. This will then\
    \ change the **vspeed** of the dog to **-12** which will launch it up into the\
    \ air.\n\n## Troubleshooting Coding Errors\n\nIt is common to mistype something\
    \ when writing code. The most common coding errors are misspelled words or misplaced\
    \ parentheses. If you get a coding error and need to troubleshoot it, start by\
    \ comparing each line of the code as it is in the book with each line of the code\
    \ you typed. There may be a difference in the code you typed in the code in the\
    \ book that you are overlooking. This is when you may wish to have someone else\
    \ look at both sets of code to see where the difference is. Often a fresh pair\
    \ of eyes will find a difference in a line of code that someone else has compared\
    \ times.\n\n## Coding the Player Character’s Animations\n\nWe will also create\
    \ the player character’s animations differently than we did the first time we\
    \ created this game using code.\n\n- **Step 1:** Select the Step Event in the\
    \ **obj_dog** object.\n- **Step 2:** Open the **Execute Code** Action.\n- **Step\
    \ 3:** In the **Place Free Section** we know the dog is in the air so here will\
    \ be a good place to change the current sprite into the jumping sprite. Below\
    \ **line 3** press **Enter** and type:\n\n```\nsprite_index = spr_dog_jumping\n\
    ```\n\nThe dog will need to change back to the idle or running sprite when it\
    \ is colliding with the colliders. The best place to do this is in the same action\
    \ below **line 7** because we already know the dog is touching a collider.\n\n\
    ![](img/584600b080035f863f96e219491bffbd_214_0.png)\n\nFIGURE 7.9\n\nStep 4: Below\
    \ line 7 type the following:\n\n```gml\nif (keyboard_check(vk_left) || keyboard_check(vk_right))\
    \ {\n    sprite_index = spr_dog_running\n} else {\n    sprite_index = spr_dog_idle\n\
    }\n```\n\nThis will check to see if the left or right key is pressed. If either\
    \ of the keys are being pressed, the sprite will change into the running sprite.\
    \ If either of the keys are not being pressed, the image will change into the\
    \ idle sprite. The two vertical lines separating the keyboard checks are used\
    \ to represent OR. The & symbol is used to represent AND.\n\n## Coding the Room\
    \ to Follow the Player Character\n\nStep 1: With the dog animations complete,\
    \ the room can now be set up. Open room_level_one and delete the obj_collider\
    \ objects and the obj_dog object placed in the room.\n\nStep 2: Change the room\
    \ settings to:\n\n- Height: 544\n- Width: 4800\n\nStep 3: Click the Views tab.\n\
    Step 4: Click the Enable of Views box and set the following:\n\n- Visible when\
    \ room starts:\n- View in room:\n  x: 0 W: 1024\n  y: 0 H: 544\n- Port on screen:\n\
    \  x: 0 W: 1024\n  y: 0 H: 544\n- Object Following:\n  Obj_dog\n  Hbor: 512 Hsp:\
    \ -1\n  Vbor: 32 Vsp: -1\n\n## Setting the Background Images\n\nNow that the room\
    \ will follow the dog object, we will set the background images that will be used\
    \ as tiles.\n\n**Step 1**: Open tile_level_one.\n\n**Step 2**: Check the Use As\
    \ Tile Set box.\n\n**Step 3**: Do the same for tile_level_one_cave and tile_level_one_wall.\n\
    \n**Step 4**: Open room_level_one.\n\n**Step 5**: Set the background to bg_level_one.\n\
    \nNow we can add the detail to our room. Using what you learned from Chapter 3,\
    \ use the tile sets to create the level. When you're done it should look similar\
    \ to **Figures 7.10** and **7.11**.\n\n**Step 6**: To make the collider invisible,\
    \ open obj_collider and uncheck the Visible option.\n\n![](img/584600b080035f863f96e219491bffbd_216_0.png)\n\
    \nFIGURE 7.10\n\n## Coding Simple Intelligence\n\nWe will populate our level with\
    \ the ghosts. The ghosts in this particular game would be considered to have very\
    \ low intelligence (AI). With the ghost at such a low level, it is debatable if\
    \ coding actually proves to be quicker in this instance. We will code the ghosts\
    \ simply to illustrate how the method would be used to create the ghosts. Before\
    \ you create the object, we will first need to fix the sprite.\n\n- **Step 1**:\
    \ Open the **spr_ghost** object and press the **Center** button.\n- **Step 2**:\
    \ Click the **Mask** option and check the **Precise** checkbox.\n- **Step 3**:\
    \ Change the **Tolerance** to **32**.\n\n## Coding the Ghost AI\n\n- **Step 1**:\
    \ Create a **New Object** and name it **obj_ghost** then set the sprite to **spr_ghost**.\n\
    - **Step 2**: Add a **Create** Event.\n\nStep 3: In the Create Event add an Execute\
    \ Code.\n\nStep 4: To move the ghost to the left we will type:\n\n```gml\nmotion_set(180,\
    \ 2)\n```\n\nThis will set the ghost moving in direction 180, which is left at\
    \ speed of 2.\n\nStep 5: To make the ghost turn and move in the opposite direction\
    \ after 360, we will call Alarm 0 by typing:\n\n```gml\nalarm(0) = 360\n```\n\n\
    Step 6: To make the ghost stop unless we tell it to stop, follow: image_speed\
    \ = 0\n\nStep 7: To create the Alarm 0 Event, create an Alarm 0 Event.\n\nStep\
    \ 8: In this next script program the ghost to move in the opposite direction and\
    \ flip its image. Add an Execute Script then you type:\n\n```gml\nif direction\
    \ = 180 {\n  motion_set(0, 2)\n} else {\n  motion_set(180, 2)\n}\n```\n\nThis\
    \ will see if the ghost is moving in direction 180. If the ghost is moving left\
    \ the script will set a new motion going in direction 0, which is toward the right.\
    \ If direction was not 180, meaning it is 0, it will set a new motion going in\
    \ 180.\n\nStep 9: To flip the image so it is facing the direction it is moving,\
    \ place the cursor below motion_set(0, 2) and type:\n\n```gml\nimage_xscale =\
    \ -1\n```\n\nand below motion_set(180, 2) type:\n\n```gml\nimage_xscale = 1\n\
    ```\n\nStep 10: To repeat this process we will write the code that will recall\
    \ this alarm every 6 seconds. At the bottom of the script type:\n\n```gml\nalarm(0)\
    \ = 360\n```\n\nStep 11: This will complete the ghost object. Place some ghost\
    \ objects throughout the level.\n\nNext we need to set up dog colliding with the\
    \ ghost, falling out of the map, and completing the level.\n\n## Coding the Playable\
    \ Character’s Death\n\nWhen the dog collides with particular objects such as the\
    \ ghosts, the dog will die and fall off the screen. We will produce this by creating\
    \ a dead dog object.\n\n- **Step 1:** Create a **New Object** named **obj_dog_dead**\
    \ and set the sprite to **spr_dead**.\n- **Step 2:** When the dog dies it will\
    \ go into the dead state for 3 seconds before the game transitions to the Game\
    \ Over Screen. An Alarm Event will need to be created for this.\n- **Step 2:**\
    \ Create an **Alarm 0** and a **Create** Event on the **obj_dog_dead** object.\n\
    - **Step 3:** In the Create Event add an Execute Code Action and type the following:\n\
    \n```gml\nalarm = 180\ngravity = 0.5\ngravity_direction = 270\nspeed = 8\naudio_play_sound(snd_yel,\
    \ 10, false)\n```\n\nThis will trigger the **Alarm 0** Event in **3 seconds**,\
    \ which equals **180 steps**, causing the object to bounce up in the air falling\
    \ off-screen. Look over this code again to see if you can now decipher the code\
    \ you specified.\n\n- **Step 4:** Select the **Alarm 0** Event and add an Execute\
    \ Code Action to it and type the following:\n\n```gml\nroom_goto()\n```\n\nWe\
    \ hope you noticed that information is added as a comment to the game developer.\
    \ We will leave this as a comment for now and come back and edit it when we have\
    \ a room for the player to end in when they lose.\n- close obj_dog_dead\n\n##\
    \ Setting Up the Events That Will Kill the Player Character\n\n- **Step 1:** Open\
    \ the **obj_dog** object.\n- **Step 2:** Add a **Collision** with **obj_ghost**.\n\
    - **Step 3:** Add an **Execute Code** Action and type the following:\n\n```gml\n\
    instance_change(obj_dog_dead, true)\n```\n"
  mdcn: "\n\n# Game Maker 语言 (GML)\n\n![](img/584600b080035f863f96e219491bffbd_213_0.png)\n\
    \n```gml\n// 事件: obj_dog_any_key_j\n// 左\nif (keyboard_check(vk_left)) {\n   \
    \ if (place_free(x-4, y)) {\n        x -= 4;\n        image_xscale = -1;\n   \
    \ }\n}\n\n// 右\nif (keyboard_check(vk_right)) {\n    if (place_free(x+4, y)) {\n\
    \        x += 4;\n        image_xscale = 1;\n    }\n}\n\n// 跃跃\nif (keyboard_check_pressed(vk_up))\
    \ {\n    if (place_free(x,y-1)) {\n        vspeed = -12;\n    }\n}\n```\n\n图 7.8\n\
    \n## 解密跳转移动代码\n\n我们将添加检查的代码是检查**是否按下了上方向键**。这部分代码看起来应该与我们之前编写的代码相似。接下来的部分检查**狗下方是否有实心物体**。`place_free`\
    \ 代码等于“位置不是空的”。感叹号用于表示**非（NOT）**。这将把狗的 **vspeed**（垂直速度）更改为 **-12**，使其向空中跳起。\n\n\
    ## 故障排除编码错误\n\n在编写代码时，写错东西是很常见的。最常见的编码错误是单词拼写错误或括号位置不对。如果你遇到编码错误并需要进行故障排除，请从将书中的每一行代码与你输入的代码逐行对比开始。你输入的代码与书中的代码之间可能存在你忽略的差异。这时，你可能希望让别人查看两组代码，看看差异在哪里。通常情况下，新的视角就能发现别人对比了多次仍未发现的行差异。\n\
    \n## 编写玩家角色的动画\n\n我们将创建玩家角色动画的方式，与我们第一次使用代码创建这个游戏的方式不同。\n\n- **步骤 1：** 在 **obj_dog**\
    \ 对象中选择 **Step Event**（步骤事件）。\n- **步骤 2：** 打开 **Execute Code**（执行代码）动作。\n- **步骤\
    \ 3：** 在 **Place Free Section**（空闲区域）中，我们知道狗在空中，所以这里是将当前精灵帧改为跳转精灵帧的好地方。在**第 3\
    \ 行**下方按 **Enter** 并输入：\n\n```\nsprite_index = spr_dog_jumping\n```\n\n当狗与碰撞体碰撞时，需要变回空闲或运行精灵帧。此此最佳地方是在**第\
    \ 7 行**下方的相同动作中，因为我们已经知道狗正在接触碰撞体。\n\n![](img/584600b080035f863f96e219491bffbd_214_0.png)\n\
    \n图 7.9\n\n步骤 4：在第 7 行下方输入以下内容：\n\n```gml\nif (keyboard_check(vk_left) || keyboard_check(vk_right))\
    \ {\n    sprite_index = spr_dog_running\n} else {\n    sprite_index = spr_dog_idle\n\
    }\n```\n\n这将检查是否按了左键或右键。如果按了其中一个键，精灵帧将变为运行精灵帧。如果两个键都没有被按下，图像将变为空闲精灵帧。分隔键盘检查的两条竖线用于表示“或（OR）”。`&`\
    \ 符号用于表示“与（AND）”。\n\n## 编写跟随玩家角色的房间\n\n步骤 1：狗动画完成后，现在可以设置房间了。打开 room_level_one\
    \ 并删除房间中放置的 obj_collider 对象和 obj_dog 对象。\n\n步骤 2：将房间设置更改为：\n\n- 高度 (Height): 544\n\
    - 宽度 (Width): 4800\n\n步骤 3：点击 **Views**（视图）选项卡。\n步骤 4：勾选 **Enable Views**（启用视图）框并设置以下内容：\n\
    \n- 房间开始时可见 (Visible when room starts):\n- 房间内视图 (View in room):\n  x: 0 W: 1024\n\
    \  y: 0 H: 544\n- 屏幕端口 (Port on screen):\n  x: 0 W: 1024\n  y: 0 H: 544\n- 跟随对象\
