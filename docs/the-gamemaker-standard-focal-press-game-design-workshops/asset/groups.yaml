    \ Screen)**——有时被称为游戏的标题屏（界面）。启动画面是玩家运行游戏时看到的第一个屏幕。\n**精灵 (Sprite)**——游戏对象的图形化表示。\n\
    **精灵深度 (Sprite Depth)**——精灵在游戏对象深度中距离玩家的远近。通过改变精灵深度，角色可以出现在其他对象的前面或后面。\n**精灵区域\
    \ (Sprite Area)**——GameMaker 中的区域，设计师可以使用基础绘图工具自定义他们的精灵。\n**精灵条带 (Sprite Strip)**——一系列精灵图像，每个图像都略有不同，连续播放以产生运动的错觉。\n\
    **区块开始 (Start of a Block)**——GameMaker 图标表示一系列动作的开始。\n**Steam**——在线零售商和游戏社区平台。\n\
    **子文件夹 (Subfolder)**——另一个文件夹内部的文件夹。\n**子菜单 (Submenu)**——另一个菜单内部的菜单。\n**切换状态 (Switch\
    \ States)**——将游戏视觉状态更改为不同的状态。\n**目标观众 (Target Audience)**——为某人群设计的游戏。\n**瓦片 (Tile)**——来自瓦片集部分的单个图形，可以拖动到画布上。\n\
    **瓦片集 (Tile Set)**——一组可以拖动到画布上的图形。\n**标题界面 (Title Screen)**——玩家看到的第一个屏幕，允许玩家开始或结束游戏。\n\
    \n**触发器 (Trigger)**——游戏内事件，当启动它时，某些事情会导致游戏中发生其他事情。\n\n**双人 (Two Player)**——为两人同时玩创建的游戏。\n\
    \n**Ubuntu Linux**——操作系统。\n\n**视图的使用 (Use of Views)**——修改玩家在房间内看到的内容。\n\n**可见性\
    \ (Visible)**——当对象在游戏中可见的时。\n\n**W, A, S, D 键**——用于控制玩家角色移动的常用键组合。\n\n**Windows**——用于个人电脑的操作系统。\n\
    \n**Xbox One**——微软创建的游戏机。\n\n**x 轴 (x axis)**——对象位于屏幕左右之间的位置。\n\n**y 轴 (y axis)**——对象位于屏幕顶部底部之间的位置。\n\
