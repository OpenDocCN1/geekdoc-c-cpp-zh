    ## Glossary


    **2.5D**—2.5D uses two-dimensional images in such a way that they create the illusion
    they are moving in a three-dimensional space. Before computer technology allowed
    designers to create fully three-dimensional images, 2.5D was a common technique
    used to simulate a 3D environment.


    **AI**—Artificial Intelligence.


    **Android**—Operating system used on many cell phones and the game console Ouya.


    **Aspect Ratio**—The dimensions of the viewable area of a game as they relate
    to the height of the game window in comparison to the width.


    **Assets**—Resources used to create a game such as graphics and sounds.


    **Authoring Tool**—A program designers uses to create software.


    **Background**—The image behind the action of a game.


    **Block**—Drag-and drop software that allows designers to drag blocks that represent
    items of code rather than having to type code.


    **Bounding Box**—The area around a character or object in a game that represents
    the object''s surface area is.


    **Browser**—Used to search and access web pages on the Internet.


    **Build**—Each new version of a game is called a build. As features are added,
    a new build of the game is created.


    **Bullet**—A projectile that shoots in a game. Although these projectiles are
    called bullets, they can actually appear as any type of object in game.


    **Canvas**—The visual area of the game that players can see in which all game
    elements are placed.


    **Check Empty**—When the software identifies if a particular area is free of objects
    or not.


    **Coding**—Language.


    **Collision**—When objects meet.


    **Console**—Hardware used to play.


    **Coordinates**—The position of an object in space.


    **Designer**—Someone who creates.


    **Destroy**—When an instance is removed.


    **Dialog Box**—A message providing information.


    **Different Room**—Another location in the game.


    **Drag-and-drop**—Using the mouse.


    **Draw Score**—A visual representation of score.


    **Else**—The action if a condition is not met.


    **End of Game**—The end of a level.


    **Event**—An action that occurs.


    **Execute Code**—Adding coding to a game.


    **Export**—Converting a game to a device.


    **Game Engine**—Software used to design.


    **Game Genres**—Types of games.


    **GameMaker**—Authoring program.


    **Game Versions**—Past or current versions.


    **GML**—GameMaker Language.


    **Gravity**—Applying a force.


    **GUI**—Graphical User Interface.


    **Health Bar**—Indicates life remaining.


    **HorSpeed**—Speed on the x axis.


    **HTML 5**—Hyper Text Language standard.


    **HUD**—Heads-Up Displays.


    **Icon**—A graphical representation.


    **Idle**—Default position.


    **Image Rotation**—Rotating an object.


    **Jump to Position**—Moving a character.


    **Key Release**—When a key is let go.


    **Keyboard Event**—When a key is pressed.


    **Kill Zone**—An area that causes death.


    **Level**—Playable area.


    **Licensing Fee**—A fee paid for an engine.


    **Lives**—Number of times a player has.


    **Mac OS**—Operating system for Mac.


    **Map Keys**—Setting keys for functions.


    **Menu**—Portion of game for selections.


    **Multi-Level**—Games with multiple levels.


    **Multiple Instances**—More than one of an object.


    **Music Loop**—Music starting over.


    **Object**—Instructs the sprite.


    **Object Spawner**—Area that creates instances.

