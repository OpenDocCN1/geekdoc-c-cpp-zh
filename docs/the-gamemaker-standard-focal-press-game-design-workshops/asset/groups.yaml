    \ is much easier.\n\nStep 4: Open the obj_crosshairs object and add a Create Event.\n\
    \nStep 5: Add in a Jump to Position Action and set the following:\n\nx: 360\n\
    y: 360\n\n## Creating Title Screens\n\nThe gameplay is now complete and the Title\
