    Standard 是免费供备的，并可以从 Yo Games 网站（www.yoygames.com）下载。GameMaker: Studio Standard
    拥有完成书中游戏所需的所有功能，主要限制包括：需要注册、导出的游戏将包含“Made with GameMaker”启动界面，且创建的游戏只能导出到 Windows
