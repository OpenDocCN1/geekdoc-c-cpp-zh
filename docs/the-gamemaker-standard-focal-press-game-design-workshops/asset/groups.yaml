    ## 创建标题和游戏结束界面


    - **步骤 1：** 右键点击 **Rooms** 文件夹文件夹并创建两个新房间。

    - **步骤 2：** 在 Room 属性编辑器的 **Settings**（设置）选项卡下，将一个房间命名为 **room_title**，另一个命名为
    **room_defeat**。

    - **步骤 3：** 对于每个房间，将宽度（Width）设置为 **1024**，高度（Height）设置为 **576**。

    - **步骤 4：** 对于每个房间，点击 **Backgrounds**（背景）选项卡并设置背景图像。失败房间背景使用 **bg_end**，标题界面背景使用
    **bg_title**。

    - **步骤 5：** 对于每个房间，点击**绿色勾选**按钮保存属性更改并关闭 Room 属性窗口。

    - **步骤 6：** 在屏幕左侧的列表中，确保 Rooms 是按照你希望它们在游戏中出现的顺序排列的。要更改房间顺序，点击 Rooms 文件夹中你想移动的房间，并将其拖到适当的位置。对于此项目，请确保
    room_title 位于第一，room0 第二，room_defeat 排在最后。

    - **步骤 7：** 右键点击 Room0 并将其重命名为：room_game。


    现在我们需要为玩家添加可以点击的按钮，这些按钮将运行游戏或退出游戏。


    ## 创建开始和退出按钮


    - **步骤 1：** 创建两个对象，并将它们命名为 obj_button_play 和 obj_button_quit。

    - **步骤 2：** 打开 obj_button_play 对象，将 Sprite（精灵）设置为 spr_button，取消勾选选择精灵 区域下方的 Visible（可见性）复选框。这将使该对象对玩家不可见。

    - **步骤 3：** 点击 Add event（添加事件）并选择 Mouse>Left Button（鼠标>左键）。选择 Main1 选项卡并在 Action
    窗口中添加一个 Different Room Action（不同房间动作）。此图标是一个带有指向下的绿色箭头的正方形。

    - **步骤 4：** obj_button_quit 的设置为：新房间：room_game。

    - **步骤 5：** 打开 obj_button_quit 对象，将 Sprite 设置为 spr_button，然后取消勾选 Visible 复选框。

    - **步骤 6：** 点击 Add event 并选择 Mouse>Left Button。选择 Main2 选项卡，并在 Game 子菜单下，在 Actions
    窗口中点击并拖动 End Game（结束游戏）图标。该图标看起来像是一个带有圆圈和线的绿色正方形。

    - **步骤 7：** 打开房间：Room_title。

    - **步骤 8：** 在 Object pick（对象选择器）下选择对象：obj_button_play。你会发现文本框旁边有一个显示“Object to
    add with left mouse（用左鼠标添加对象）”的下拉菜单：

    - **步骤 9：** 这允许你在合适的位置放置播放和退出按钮。将 obj_button_play 对象放置在房间中的播放按钮上。点击并拖动右下角的正方形，直到
    obj_button_play 缩放足够完全覆盖玩家按钮。你可以移动或缩放对象，而其不会完全锁定到网格位置。要移动它，请按住 Alt 键。

    - **步骤 10：** 对退出按钮执行相同的操作，使其看起来与图 2.28 相似。

    - **步骤 11：** 打开房间：Room_Defeat 并向该房间添加播放和退出按钮。

    - **步骤 12：** 打开 obj_asteroid_controller 对象，通过右键删除 Collision（碰撞）事件中现有的 Actions。将它们替换为


