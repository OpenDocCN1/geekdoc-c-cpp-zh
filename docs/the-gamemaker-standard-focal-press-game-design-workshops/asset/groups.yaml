    Subimage: 0\nSpeed: 1\n\n**Step 7:** Drag in an End of a Block.\n\n**Step 8:**\
    \ Repeat Steps 6 and 7 for the Release<Left> Event.\n\n![](img/584600b080035f863f96e219491bffbd_184_0.png)\n\
    \nFIGURE 6.6\n\n![](img/584600b080035f863f96e219491bffbd_185_0.png)\n\nAt this\
    \ point when the right button is pressed to make sure the ship animates properly\
    \ appear that the ship is banking toward the right and when the left button is\
    \ pressed the ship should appear as if it is banking toward the left. If no buttons\
    \ are pressed, the ship should appear as if it is flying straight.\n\n## Moving\
    \ Objects Toward the Player\n\nEarlier in the chapter we discussed how objects\
    \ that are farther away higher in the horizon, less defined, and smaller objects\
    \ closer to us. We are going to use this information to train the brain of the\
    \ player's into thinking that there are actual 3D models moving toward the player's\
    \ ship. We will do this by putting in graphics that are designed to show an object\
    \ starting with little detail and gaining detail and size while moving downward\
    \ on the horizon. This will make the object appear as if we also have these objects\
    \ constantly switches so that the flat 2D sprites appear as if they are 3D models.\n\
