    \n![](img/584600b080035f863f96e219491bffbd_201_1.png)\n\nFIGURE 6.21\n\n## Adding\
    \ Background Music\n\nStep 1: Create a New Object named obj_music and add check\
    \ the Persistent option.\nStep 2: Add an Other: Game Start Event and add a Play\
    \ Sound Action and set the following:\n\nSound: snd_music\nLoop: true\n\n## Testing\
    \ the Blood Vessel Game\n\nWe hope by now that you have noticed the pun in the\
    \ title of the game. The game is about a vessel that travels in the blood. When\
    \ you test your game it should look as though the ship is able to move out of\
    \ the way of blood cells. However, rather than the ship moving instead, it remains\
    \ in the same position and the whole environment moves instead. Knowing how the\
    \ eye sees objects in space and identifies which objects are closer or farther\
    \ away, we have been able to trick the player into thinking three-dimensional\
    \ objects are traveling toward them when in fact the screen they are playing on\
    \ is flat, and the objects in the game are all two-dimensional sprites rather\
    \ than 3D objects. Continue to have others test your game to see if there are\
