    \nNow you can test the game. Run along the grass and jump over holes. Before quitting\
    \ sera try to jump into or fall into a hole. It should now appear that the dog\
    \ is falling into the hole; however, when it does you notice that nothing happens.\
    \ We need to add an extra event to the dog that will restart the game when the\
    \ dog is no longer visible on the screen.\n\n## Restarting Game When Dog Disappears\n\
    \n- **Step 1:** Open the **obj_dog.**\n- **Step 2:** Click **Add Event** and select\
    \ **Other Event** and then **Outside Room.**\n- **Step 3:** In the **Main** tag\
    \ drag a **Restart Room** Action into the Actions window.\n\nWhenever the dog\
    \ falls through the room will now reset. Our game is coming along nicely, but\
    \ it looks a bit plain. Let's add a scrolling graveyard background to our level.\n\
    \n## Adding a Scrolling Background\n\n- **Step 1:** Open **room_level_one.**\n\
    - **Step 2:** Select the **Backgrounds** tab.\n- **Step 3:** Click the drop down\
    \ box and then choose **bg_level_one**. This background is made to tile itself\
    \ across the room no matter the size.\n\nTo give the graves a more authentic look\
    \ we will now add some tombstones behind the grave openings.\n\n## Adding Tombstones\n\
    \n- **Step 1:** Open **room_level_one.**\n- **Step 2:** Select the **Tiles** tab\
    \ and choose **tile_level_one.**\n- **Step 3:** Add a new layer and type **1001**\
    \ into the box labeled **Depth** and hit **OK**. This will place the tile depth\
    \ between the grass and the open grave.\n- **Step 4:** Highlight the tombstone\
    \ graphic.\n- **Step 5:** While holding down the Alt key, place the tombstone\
    \ behind the open grave so that it looks similar to **Figure 3.38.**\n\n![](img/584600b080035f863f96e219491bffbd_104_0.png)\n\
    FIGURE 3.37\n\n![](img/584600b080035f863f96e219491bffbd_104_1.png)\nFIGURE 3.38\n\
    \nOur graveyard is going to be haunted by ghosts. We do not want our dog to get\
    \ close to these ghosts so we are going to add some brick walls that the player\
    \ can use strategically to avoid the ghosts.\n\n## Adding Brick Walls to the Level\n\
    \n- **Step 1:** In the **Backgrounds** folder open **tile_bricks**.\n- **Step\
    \ 2:** Click the **Use as tile** box and click **OK**.\n- **Step 3:** Open **room_level_one**\
    \ and go to the **Tiles** tab.\n- **Step 4:** Choose **tile_level_one_wall**.\n\
    - **Step 5:** Select layer **1001**.\n- **Step 6:** Place the wall in the two\
    \ spots indicated in **Figure 3.39**.\n- **Step 7:** Click the **Objects** tab\
    \ and select **collider**.\n- **Step 8:** Place the collider along the wall as\
    \ shown in **Figure 3.40.**\n\n![](img/584600b080035f863f96e219491bffbd_105_0.png)\n\
    FIGURE 3.39\n\n![](img/584600b080035f863f96e219491bffbd_106_0.png)\n\nThis will\
    \ give the illusion that the dog can run into and jump on top of the wall. The\
    \ player will now be able to use the spaces between the walls to avoid the ghosts.\
    \ Of course this will only work if there are actual ghosts in our game.\n\n##\
    \ Adding Ghosts to the Level\n\n- **Step 1:** Create a new object and name it\
    \ **obj_ghost**.\n- **Step 2:** Set the object's sprite to **spr_ghost**.\n- **Step\
    \ 3:** Add a **Create** Event. In the **Main** section drag in an **Alarm** and\
    \ set the following:\n  Number of steps: 1\n  Alarm no: 0\n- **Step 4:** Create\
    \ an **Alarm** Event with **Alarm 0**.\n- **Step 5:** Drag a **Move Fixed** into\
    \ the **Alarm** Event and set its arrow to the left and a speed to 4.\n- **Step\
    \ 6:** Drag **Change Sprite** into the Actions window with the following:\n  Sprite:\
    \ spr_ghost\n  Subimage: 0\n  Speed: 0\n- **Step 7:** Drag a **Set Alarm** below\
    \ the **Move Fixed** and set the following:\n  Number of steps: 120\n  Alarm no:\
    \ 1\n- **Step 8:** Create an **Alarm** Event with **Alarm 1**.\n- **Step 9:**\
    \ Drag a **Move Fixed** into the **Alarm** Event and set its arrow to the right\
    \ and a speed to 4.\n- **Step 10:** Drag a **Change Sprite** into the Actions\
    \ window with the following:\n  Sprite: spr_ghost\n  Subimage: 1\n  Speed: 0\n\
    - **Step 11:** Drag a **Set Alarm** below the **Move Fixed** and set the following:\n\
    \  Number of steps: 120\n  Alarm no: 0\n\nThis will make the ghosts move left\
    \ for a few seconds, then turn and move right. The ghosts will always start by\
    \ moving left, which is good to keep in mind when placing them into the game.\
    \ Now we will make the ghosts lethal to the dog.\n\n## Making the Ghosts Lethal\n\
    \n- **Step 1:** Create a new object and name it **obj_dog_dead**.\n- **Step 2:**\
    \ Choose the sprite **spr_dead**.\n- **Step 3:** Make a **Create** Event.\n- **Step\
    \ 4:** Drag a **Set Alarm** into the Actions window and set the following:\n \
    \ Number of steps: 60\n  Alarm no: 0\n- **Step 5:** Create an **Alarm** Event\
    \ using **Alarm 0**.\n- **Step 6:** In the **Alarm 0** Event drag a **Restart\
    \ Game** Action, which is located in **Main2**.\n- **Step 7:** Close the **obj_dog_dead**.\n\
    - **Step 8:** Open **obj_dog**.\n- **Step 9:** Add a collision with the **obj_ghost**\
    \ Event.\n- **Step 10:** In **Main1** drag an **Instance Change** Event into the\
    \ Actions window. Set the following:\n  Change into: obj_dog_dead\n  Perform events:\
    \ yes\n\nNow you place and call the **obj_ghost** in the room and run with the\
    \ dog, the dog will flip over and fall, thus restarting the game.\n\nPlace the\
    \ ghosts throughout the level in places that would add more difficulty to the\
    \ player. One option that can make the game challenging is by placing a ghost\
    \ on a brick wall. As the ghost turns away from the dog the player must follow\
    \ the ghost and time their movements so they can jump down the wall before the\
    \ ghost returns. Be careful not to make the game impossible to beat. A challenging\
    \ game is fun, an unbeatable game.\n\nThis game will consist of two levels. Once\
    \ the player has navigated the graveyard successfully, they can call a teleporter\
    \ to the next level. A teleporter can be anything such as a door, an elevator,\
    \ or a giant pipe in the ground like those seen in the Mario universe. Once a\
    \ player's character comes in contact with a teleporter, it is transported to\
    \ the next level. We are going to add a cave at the end of our first level, which\
    \ will lead to the second level of our game.\n\n## Creating a Teleporter\n\n-\
    \ **Step 1:** Create a new object and call it **obj_level_collider**.\n- **Step\
    \ 2:** Set the new object's sprite to **spr_collider** and click the **Visible**\
    \ box it is unchecked.\n- **Step 3:** Add a Collision Event with **obj_dog**.\n\
    - **Step 4:** In **Main1**, drag a **Room Action** into the Actions window.\n\
    - **Step 5:** Click OK and open the background named **tile_cave_one**.\n- **Step\
    \ 6:** Use the **Use as title set** box and click OK.\n- **Step 7:** Open your\
    \ view so you can see the end of the level and place the cave using the system\
    \ we have built. Use layer **1000001**. Your screen should now look similar to\
    \ Figure 3.41.\n- **Step 9:** Open the Objects tab and place the **obj_level_collider**\
    \ on the cave so it appear to run through the cave. Use the squares around the\
    \ object after it is placed in the room to increase the scale of it.\n"
