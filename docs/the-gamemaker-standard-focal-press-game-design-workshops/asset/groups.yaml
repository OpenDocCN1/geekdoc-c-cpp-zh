  - '[PAGE 252]


    # THE GAMEMAKER STANDARD


    The answer to the riddle is the letter M.

    When the player enters Level Two they will find that the entire floor is made
    up of tiles that what appears to be roman numerals carved into them. Each tile
    has a separate letter. If the player figured the riddle, they will see if they
    have controlled their character to walk only on the tiles with the letter M on
    that the character could make it all the way the room to reach a treasure chest.
    If this was the only obstacle in the room, the level would be too easy. In order
    to make it more challenging, we will have flying sawblades made of ice toward
    the player so that they will need to move quickly or shoot quickly to destroy
    the sawblades. To create Level Two we will be using a tile set.


    # Using a Tile Set to Create the Level Two Floor


    +   **Step 1:** Open the Background named tile_room_two.

    **Step 2:** Check the Use as Tile Set box.

    **Step 3:** The tiles are now ready to be placed throughout the room. Open room_level_two
    and select the Tiles tab and pick tile_level_two.


    ![](img/584600b080035f863f96e219491bffbd_252_0.png)


    FIGURE 8.13


    240'
  - '[PAGE 253]


    Step 4: Place the tiles in the level similar to Figure 8.13. This configuration
    will allow the player to walk along the tiles with the letter M on them and move
    across the room without walking on any tiles that have other letters over them.


    # Adding a Kill Zone Object


    In game design terms a kill zone is any area in a game that kills the player''s
    character instantly when the character enters the area. Kill zone objects are
    placed in games where there are hazards such as fire or lava virtually any other
    type of hazard that would kill a player''s character instantly. We will be creating
    a kill zone and placing it on all of the tiles in Level Two that are not marked
    with the letter M. If a player were to step on an incorrect tile, it would trigger
    the player''s defeat animation and the player would return to the previous room.


    **Step 1**: Two sets of colliders are needed for this room in addition to the
    next level trigger. Create a **New Object** and name it **obj_killzone**, assign
    the sprite spr_killzone to it, **Uncheck** the **Visible** option.


    **Step 2**: Open **obj_player_bronze** and add a **Collision** Event with the
    **obj_killzone** object.


    **Step 3**: Add a **Change Instance** Action and set the following:


    Object: player_defeat

    Perform events: yes


    ![](img/584600b080035f863f96e219491bffbd_253_0.png)


    FIGURE 8.14'
