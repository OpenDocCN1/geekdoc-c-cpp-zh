  - '[PAGE 224]


    # GML Terminology


    This chapter on GML introduced new terminology that may not be familiar to individuals
    that have not tried coding before. There are various other types of coding languages
    and GML is just one of them. GML stands for Game Maker Language as it is the coding
    language that GameMaker understands. Other engines use different languages. Learning
    GML can assist you in learning coding languages as many of them have similar structures.
    For a complete list of build-in GML variables, click on the Help tab in the GameMaker
    program, then go to Contents>Reference>GML Language Overview. Another term we
    use in this chapter is scripting. As a script for a movie tells what will happen
    in the film, a script in a video game tells the game what will happen. We also
    saw references to vspeed, which indicates the vertical speed an object is traveling,
    and reference to image_scale, which hold the game what direction is facing on
    the x-axis. Many of these terms and references may have seemed foreign to you
    as you began this chapter, but now that you have created a game that required
    typing code, we hope the odd-looking snippets are starting to make sense. Coding
    is a language and the best way to learn any new language is to practice it frequently
    and by learning new expressions. Using code as a game developer can not only save
    time but also allow designers greater flexibility for the actions of the objects
    in the game.'
  - '[PAGE 225]


    ![](img/584600b080035f863f96e219491bffbd_225_0.png)


    # Role Playing Games


    Learning Objectives—Upon completion of Chapter 8 readers will be able to:

    * Incorporate mini-missions within a game

    * Create a store for players to purchase game items

    * Pick up weapons and gold

    * Create a persistent object for all levels which will store values such as coins

    picked up

    * Add inventory items to the HUD

    * Add dialog boxes that direct the player where to go

    * Create multiple instances of the same room to create the illusion that the room
    is the same but elements have changed


    # Project Overview:

    Keeper of the Oracle


    Role Playing Games (RPGs) are adventure games that tell a story through gameplay
    and allow players to change instances about their character. These instances can
    be changing the character''s wealth, weapons, or appearance. An entire book could
    be written on creating RPGs as different types of games include various elements.
    For this'
  - '[PAGE 226]


    chapter we will be concentrating on the core aspects of creating an RPG. Fundamental
    aspects included in most RPGs include:


    +   * A store in which the player can purchase items for their character

    * Pick-up items such as weapons or coins that the player can use in the game

    * A system of keeping track of what items a character has and illustrating them
    in the HUD

    * A simple captivating story that drives the player to continue the game

    * Dialog boxes which give the player information needed to know for what to do
    next

    * Increasing challenges in which players must strategize to complete


    In the list above the abbreviation HUD, which stands for Heads-Up Display, A HUD
    is an onscreen interface that shows the player various stats from the game. In
    previous chapters the game HUD showed the player''s score and lives. The game
    will be used to keep track of how many coins the player has and what weapon is
    currently held.


    In Keeper of the Oracle, the player receives instructions from the oracle via
    dialog boxes. The player goes on a series of mini-missions to complete the tasks
    assigned. Each mission changes what the player is carrying. The first mission
    allows the player to pick a weapon. The second mission provides the player with
    coins. The third mission introduces the character to the store where they will
    purchase a new, more powerful weapon with the coins picked up in the previous
    mission. The last mission has the player using their new weapon to defeat a powerful
    enemy and win. Additional information on each mission will be provided throughout
    the chapter to provide context why we are adding elements to the game. We will
    start by downloading the game assets for Keeper of the Oracle from www.thegamemakerstandard.com/oracle.
    After downloading the assets folder read over the updates.pdf document, which
    contains any changes since the publication of this book.


    # Creating a New Project


    **Step 1:** Create a new project and name it Oracle.

    **Step 2:** Import the Keeper of the Oracle assets from the Oracle assets folder.

    **Step 3:** Organize the player sprites in the Sprite Folder with Subfolders so
    that they appear similar to Figure 8.1.'
