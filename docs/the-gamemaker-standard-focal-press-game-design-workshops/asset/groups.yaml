    xscale: 0.4\nyscale: 0.5\nAngle: 0\n```\n\n**第 7 步：** 放置背景。2.5D 是一种用于在 2D 环境中创建深度幻觉的技术。通过使用精灵集创建三三维的物体，我们可以让游戏感觉更有沉浸感和吸引力。视觉错觉是操纵玩家对空间感知的关键工具，理解人眼如何观察三维空间的物体对于创建这些效果至关重要。最后，我们将创建一个游戏内血条。\n\
    \n**第 8 步：** 创建对象 obj_background。\n\n**第 9 步：** 将精灵设为 spr_background。\n\n# 插入玩家\n\
