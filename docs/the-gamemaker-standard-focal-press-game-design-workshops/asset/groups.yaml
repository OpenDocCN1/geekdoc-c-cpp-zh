    # Destroying the Pumpkin and Candy Objects


    As the candy and pumpkin objects leave the screen at the bottom after falling
    they seem to disappear. GameMaker is still calculating their movements as the
    game is running, however, and the player can no longer see these objects it is
    a waste of resources for them to continue existing. With all objects being calculated
    and no longer on screen we face a possibility of the game crashing after a while
    because many items are being tracked. It is therefore necessary to destroy the
    candy and pumpkin instances that are in the visible area.


    **Step 1:** Create a new object and name it **obj_collider** and use **spr_collider**
    as the sprite. Uncheck the Visible option on the **obj_collider**.


    **Step 2:** Place the **obj_collider** at the bottom left of the **room_gameplay**
    screen.


    **Step 3:** Change the **x scale** so that the **obj_collider** covers the bottom
    of the screen as shown in **Figure 5.5**.


    **Step 4:** We will now create the collision events that will destroy a pumpkin
    object or a candy object when either of them hits the object collider. **obj_pumpkin**
    and add a **Collision** Event with the **obj_collider**.


