    to name this alarm for the next number that has not been used which is 4. This
    alarm will have two functions. The first function for this is to pause the game
    for 3 seconds after a round is finished; will then see what level the players
    are. If they are on level 3 it will calculate who the winner is and move the players
    to the winner screen. If the players are on one of the previous levels it will
    advance the players to the next level.


    Step 1: Open the obj_snail_parent object if it is not already open and create
