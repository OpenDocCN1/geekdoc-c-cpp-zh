    **Step 6:** Open obj_candy and add a Collision Event with the obj_collider Event.


    **Step 7:** Add a Destroy Instance Action to the event.


    # Adding a Mouse: Left Button Event


    The player will attempt to squash the pumpkins before the pumpkins reach the bottom
    of the screen. We will use a Mouse: Left Button Event which will allow players
    to use their mouse to cursor over the pumpkin images to squash them, which will
    also play a sound effect. If a player is using a touch screen on a tablet they
    would be able to squash pumpkins by touching the screen in the same type of movement
    they would use to click an icon to activate a program. By using this type of control
    it allows users with touch screens to use the touch screen options while also
    allowing users with traditional mouse to play the game as well.


    **Step 1:** Open the obj_pumpkin object and add a Mouse: Left Button Event.


    **Step 2:** Once the pumpkin is clicked we will stop it moving. Drag a Move Fixed
    Action and set the following to stop the pumpkin:


    - Square in the middle pressed

    - Speed: 0


    **Step 3:** Now that the pumpkin has stopped moving, we will set it so that the
    pumpkin switches to that of a squashed pumpkin. Drag in a Change Sprite and set
    the following:


    - Sprite: spr_splat

    - Subimage: 0

    - Speed: 0


    **Step 4:** We will now add a sound effect that will play when the pumpkin is
    squashed. Drag in a Play Sound Action and set the following:


    - Sound: nd_splat

    - Loop: false


