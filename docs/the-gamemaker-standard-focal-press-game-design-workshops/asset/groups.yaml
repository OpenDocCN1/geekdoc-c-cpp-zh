    \ **Change Instance** Action and set the following:\n\nObject: obj_player_defeat\n\
    Perform event: yes\n\n## Activating the Next Level Trigger\n\n**Step 1:** Create\
    \ a **New Object** named **obj_nlt_two.**\n\n**Step 2:** Check the **Solid** checkbox.\n\
    \n**Step 3:** Set the sprite to **spr_nlt.**\n\n**Step 4:** Add a **Collision**\
    \ with **obj_player_bronze.**\n\n**Step 5:** Add a **Different Room** Event and\
    \ set the following:\n\nRoom: room_oracle_two\n\n## Allowing the Player to Exit\
    \ the Room\n\nWhen the player picks up the dagger the Solid option will need to\
    \ become unchecked allowing the player to exit the room.\n\n**Step 1**: Open the\
    \ `obj_player_default` object\n\n**Step 2**: In the collision with `obj_dagger`\
    \ add a `Set Variable` Action and set the following:\n\n- Object: obj_nlt_two\n\
    Variable: solid\nValue: false\n\n## Arrange the Room Objects\n\nAll of the Level\
    \ One objects are set up and ready to be placed in the room. The stone wall objects\
    \ can be used to create a maze for the player to navigate through. Two separate\
    \ stone objects can be used to create the maze. The first stone object will disappear\
    \ when the player reaches the dagger but the second stone object, will remain\
    \ and can be used by the player as a barricade to avoid being hit by the fireballs.\
    \ The masks can be attached to the top and side walls\n\n![](img/584600b080035f863f96e219491bffbd_250_0.png)\n\
    \nthe player will have to dodge shooting fireballs and the dagger can be placed\
    \ at the bottom of the room as the player's goal. Arrange the room with the objects\
    \ to create your own maze configuration. You may wish to use Figure 8.12 as a\
    \ guide.\n\n## Creating the Oracle Room Two\n\n- Step 1: Place the obj_player_bronze\
    \ object just above the South Gate, which will now appear closed.\n- Step 2: Place\
