    # What Are Parent and Child Objects?


    Using parent objects can save developers a lot of time. Parent objects are used
    for a variety of purposes, but to define what makes them special we use an example.
    Imagine we created a game in which a character falls over pits and if the player''s
    character lands in a pit they will be destroyed. One method of setting this up
    would take a lot of time. By using parent, we can set the parent object with all
    the information relating to the collision and share that with all the child objects,
    in which case would be the pits. By doing this we only need to set the collision
    once in the parent object and place as many child objects in the game as we want.
    This allows developers to save a lot of time when creating games and also allows
    each child object to have different attributes since they are still separate objects.


    # Setting Up a Parent Object


    To save time adding colliders to our game we are going to set a parent for the
    snails that will hold that executed when a snail calls a trail or a collider.


    Step 1: Create a new object and name it obj_snail_parent. This object will not
    need a sprite.


