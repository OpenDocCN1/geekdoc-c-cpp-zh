    # About the Artists


    # Richard Graham


    Richard is a concept/illustration artist who has been drawing since he was seven
    old. He learned to draw by looking over his brother''s shoulder while his brother
    was sketching. Drawing allowed Richard to bring to life anything he could think
    of. He began by designing fictional vehicles and eventually moved on designing
    anime and cartoon characters. It was through art that he won his first trophy
    in art contest. It was when Richard began selling sketches to other children in
    school that he began to realize how many people love art. He did not realize he
    could work as an artist as a penciler, linker, or just a freelance artist altogether.
    After seeing game designers can take an artist''s style and work if he wanted
    to be a part of, Richard enjoys various art styles from manga to comic artists
    like Mike Mignola, Greg Capullo, Humberto Ramos, and John Romita. He always wanted
    him to do something with his art and before she passed away he promised her he
    would do his best to break into the industry. It is this that keeps him focused
    on continually developing his art skills.


    # Whitney Joyner


    Whitney first found her love for the arts when she was in middle school. A friend
    taught her to draw anime after she spent her middle and high school years drawing,
    taking art classes, and honing her drawing skills. The friendly mostly drew Whitney''s
    art style naturally also took the look of anime. As she continued to study and
    practice her art gradually to morph into something more of her, which she describes
    as cartoonized, Whitney discovered the field of game by accident. She was looking
    into colleges when another friend had extra reservation to an open house at an
    art college. She talked to the dean who asked about some things she enjoyed and
    from what Whitney told her, she suggested the gaming field. She ended up checking
    out the Simulation and Game Development program at Wayne Community College because
    it was closer to home than the college she visited. She found that she really
    liked the idea of going into the field of game design and soon after started her
    path into gaming art.

