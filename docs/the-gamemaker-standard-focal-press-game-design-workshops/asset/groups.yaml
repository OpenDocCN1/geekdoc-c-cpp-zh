    这将确保左方向键和右方向键没有被按住。

    **步骤 6：** 在 Key Release<Right> 事件下方拖入一个 Start of a Block，然后拖入一个 Change Sprite
    并设置以下内容：


    Sprite: spr_ship_idle

    Subimage: 0

    Speed: 1


    **步骤 7：** 拖入一个 End of a Block。

    **步骤 8：** 对 Release<Left> 事件重复步骤 6 和 7。


