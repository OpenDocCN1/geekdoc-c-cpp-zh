    the up and down arrow keys on your keyboard. Notice that the navigation engines
    on the sides of the ship should move each time you press up or down and the ship
    cannot leave the sizeable area of the game. It should now look as though the player
    ship is flying through space. Close the game preview window.


    ## Creating the Asteroid Objects


    **Step 1:** Select the Objects folder on the far left, right-click, and create
    a new object.


    **Step 2:** Name this object: **obj_asteroid_small**.


    **Step 3:** Choose the sprite: **spr_asteroid_small** as the image.


    **Step 4:** Select OK to close the Object Properties window.


    **Step 5:** Repeat Steps 1 through 4 to create a new object for the medium-sized
    asteroid and the large asteroid.


