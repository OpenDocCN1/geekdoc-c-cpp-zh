    \n## 创建掉入粘液的幻觉\n\n为了营造掉入粘液的视觉效果，我们将粘液的顶层放在较高的层，然后将其余部分放在比狗狗更低的层。例如，如果狗狗的深度为 0，那么粘液应该是\
