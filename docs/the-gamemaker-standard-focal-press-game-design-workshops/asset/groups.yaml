- md: "\n## Adding Start and End Game Menus\n\n**Step 1:** Create two new rooms and\
    \ name them `room_title` and `room_end`. **544**.\n**Step 2:** Leave the width\
    \ the same but change the height of both rooms to **544**.\n**Step 3:** Set the\
    \ background of `room_title` to `bg_title`, and `room_end` to `bg_end`.\n**Step\
    \ 4:** Select the green checks on the top left of both rooms to save and close\
    \ the windows.\n\nOn the start menu we will have two options for the player to\
    \ choose from. The player will be able to start the game or exit the game. On\
    \ the end menu the options are the same, but rather than use the word `start`\
    \ we will be using the word `replay`.\n\n![](img/584600b080035f863f96e219491bffbd_110_0.png)\n\
    \n## Adding Buttons to Menus\n\n**Step 1:** Create two New Objects and name them\
    \ **obj_play** and **obj_quit.**\n\n**Step 2:** Assign the **spr_button** selected\
    \ to both and uncheck the **Visible** option.\n\n**Step 3:** With **obj_play**\
    \ selected add a **Mouse**>Left Button Event and in the **Main1** tab add a Different\
    \ Room Action to it. Set the new room to **room_level_one**.\n\n**Step 4:** With\
    \ **obj_quit** selected add a **Mouse**>Left Button Event and under **Main2**\
    \ add an **End Game** Action to it.\n\n**Step 5:** Drag the rooms up and down\
    \ in the room's folder so they follow the order: **room_title**, **room_level_one**,\
    \ **room_end**.\n\n**Step 6:** Open **room_title** and in the **Objects** tab\
    \ select the **obj_start** button and drag it into the appropriate location. Scale\
    \ the button to fit over the word **Play** completely.\n\n**Step 7:** In the **Objects**\
    \ tab select the **obj_quit** button and drag it into the appropriate location\
    \ over the **Quit** text. Click the green check to close the **room_title** window.\n\
    \n**Step 8:** Open **room_end** and place **obj_start** and **obj_quit** over\
    \ the appropriate trash cans.\n\n![](img/584600b080035f863f96e219491bffbd_111_0.png)\n\
    \nFIGURE 3.44\n\nRun the game and test the Start and Quit buttons. The Start button\
    \ should activate level one and the Quit button should close out the game. Rather\
    \ than having level restart when the dog falls or gets hit by a ghost, we are\
    \ going to have the game go to the title screen instead. This will allow the player\
    \ to either start the game or quit playing altogether.\n\n## Resetting Game Restart\
    \ to Title Screen\n\n- **Step 1:** Open obj_dog.\n**Step 2:** Click the Outside\
    \ Room Event and delete the Restart the Room Action.\n**Step 3:** Drag a Different\
    \ Room Action into the window to replace it. Set the following:\n  New room: Room_title\n\
    **Step 4:** Select OK.\n**Step 5:** Open obj_dog_dead and select the Alarm 0 Event.\n\
    **Step 6:** Delete the Restart the Game Action and place a Different Room in replace\
    \ it. Set the following:\n  New room: Room_title\n\nTo add to the creepiness of\
    \ the graveyard we are going to add some ambient music and sound effects to our\
    \ game. Each level will have a different background music and sound effects so\
    \ we will import all the sounds at once and apply them to the correct levels.\n\
    \n## Importing Music and Sounds\n\n- **Step 1:** Find the Lost Dog assets folder\
    \ and locate the sounds folder.\n**Step 2:** Drag all the sound files from the\
    \ sounds folder into the GameMaker window just as you did earlier for sprites\
    \ and backgrounds.\n**Step 3:** Click the OK box for all the windows that pop\
    \ up.\n**Step 4:** Remove the sound1_ portion from all of the sounds that they\
    \ end up being named as:\n\n```\nSnd_end_screen\nsnd_level_one\nsnd_level_two\n\
    snd_dog_yelp\nsnd_splash\n```\n\n## Adding Music\n\nStep 1: Create three new objects\
    \ and name them as follows:\n\n```\nobj_snd_end\nobj_snd_one\nobj_snd_two\n```\n\
    \nWe'll use these to control which sound plays on each level. None of these objects\
    \ will sprites.\n\nStep 2: Open **obj_snd_one** and add a Create Event. Reminder,\
    \ all sound actions are found under the Main1 tab.\n\nStep 3: Drag a **Play Sound**\
    \ Action into the Actions window and set the following:\n\n```\nSound: snd_level_one\n\
    Loop: true\n```\n\nStep 4: Add a **New Event**, **Other>Room end**.\n\nStep 5:\
    \ Drag a **Stop Sound** Action into the Actions window and set the following:\n\
    \n```\nSound: snd_level_one\n```\n\nStep 6: Click **OK** and open the **obj_snd_two**.\n\
    Step 7: Use **snd_level_two** and repeat the previous steps.\nStep 8: Open **obj_snd_end**\
    \ and use **snd_end_screen**. Repeat the steps.\n\n## Placing Sound Objects\n\n\
    Step 1: Open **room_level_one** and place **obj_snd_one** anywhere.\nStep 2: Open\
    \ **room_level_two** and place **obj_snd_two**.\nStep 3: Open **room_title** and\
    \ place **obj_snd_end**.\n\n## Adding the Dog Yelp\n\nTo make the dog yelp when\
    \ it hits a ghost, we will do the following:\n\n- **Step 1:** Open obj_dog.\n\
    **Step 2:** Select the collision with ghost.\n**Step 3:** Drag a Play Sound Action\
    \ above and set the following:\n\n```\nSound: snd_dog_yelp\n```\n\n## Applying\
    \ Your Knowledge\n\nNow it is time to apply the knowledge you have acquired.\n\
    \n**Step 1:** Attempt to design the level using the colliders.\n**Step 2:** Level\
    \ two should be named **room_level_two**.\n**Step 3:** In the folder **room_level_one**.\n\
    **Step 4:** Use the following assets:\n  Background: bg_level_two\n  Tiles: Tile_two_cave,\
    \ Tile_two_ground, Tile_two_slime\n**Step 5:** Create the level so that...\n\n\
    ## Incorporating Puzzle Elements\n\nLevel two has our dog entering a cave environment.\
    \ The nice thing about the Lost Dog premise is that hundreds of levels can be\
    \ created in which the dog has to navigate through stronger environments. For\
    \ our purpose of learning GameMaker we will only be creating these two levels,\
    \ however. In level two the objective is for the player to look at the broken\
    \ stalactites at the top of the screen and envision where the other part is under\
    \ the slime. This is where the dog will be able to jump and not fall into the\
    \ slime. We will have the first platform in the slime obvious so that the player\
    \ can figure out the puzzle of looking at the top of the screen to see where to\
    \ jump in the slime.\n\n## Creating the Illusion of Falling into the Slime\n\n\
    To give the appearance that the dog is falling into the slime we will place the\
    \ top layer of the slime on a high layer and then place the rest on a layer that\
    \ is lower than the dog. For example, if the dog is at a depth of 0 then the slime\
    \ should be at -1. The platforms that the dog will land on be set to -2. Use Figures\
    \ 3.46 through 3.50 below as a guide when creating your level.\n\n![](img/584600b080035f863f96e219491bffbd_115_0.png)\n"
