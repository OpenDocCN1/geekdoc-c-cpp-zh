    Richard 开始向其他孩子出售草图时，他意识到人们有多热爱艺术。他并没有意识到自己可以作为画稿、上色师或自由插画师工作。在看到游戏设计师可以使用艺术风格之后，Richard
    喜欢 Mike Mignola、Greg Capullo、Humberto Ramos 和 John Romita 等漫画家的风格。母亲一直希望他能用艺术做些什么，在她去世前，他承诺会尽力进入行业。正是这一点促使他不断提高自己的艺术技能。


    # Whitney Joyner


    Whitney 在初中时期就发现了对艺术的热爱。在初中和高中通过绘画、上艺术课和磨练绘画技巧后，一位朋友教会了画动漫。Whitney 的艺术风格大多自然地带有了动漫的感觉。随着
    Whitney 继续学习和练习艺术，使其逐渐演变为更具自己的风格（她将其描述为卡通化），Whitney 意外发现了游戏领域。当她在考虑大学时，另一个朋友有一张艺术学院开放日的额外入证。她与院长交流，院长询问了一些她喜欢的事情，根据
    Whitney 的描述，院长建议了游戏领域。她最终选择了韦恩社区学院的模拟与游戏开发专业，因为那里比她访问的学院更近。她发现自己非常喜欢游戏设计这个想法，并在此后开始了游戏艺术之路。


