    Different game engines have different licensing fees associated with them. Some
    game engines allow you to use the engine to create and sell your game without
    paying a licensing fee until your sales reach a certain amount. Other game engines
    allow you to purchase the game engine and whatever you create belongs to you and
    do not need to pay any royalties or licensing fees (GameMaker falls into this
    category). When using a game engine to develop your game, it is recommended that
    you read the licensing agreement before attempting to sell your game. Providing
    a rundown of different game engines and licensing fees for each would make for
    a quickly outdated document as new engines are being developed and other engines
    change their licensing periodically. Therefore, keeping up with the current licensing
    fees for the game you are using is paramount in the business of designing and
    selling games.


    ## Selling Your Game


    Once you have your game complete, there is a variety of marketplaces in which
    you can sell your game. The following examples are listed as some of the ones
    for YoYo Games and a description of each can be found on the YoYo Games distribution
    webpage www.yogames.com/publish/


    - Google Play—The most-visited store for Android apps with 1 billion downloads
    a month.

    - Apple App Store—Marketplace to sell your game to be played by iPad, iPhone,
    and iPod touch customers.

    - Amazon App Store—Allows developers to sell apps on Amazon and Kindle Fire.

    - Tizen App Store—Marketplace for games based on HTML 5 for use on multiple devices.

    - Opera Mobile Store—Described as one of the leading mobile app stores and application
    distribution platforms for the developers of mobile apps in the world.

    - Windows Phone Store—Marketplace for designers creating content for the Windows
    Phone.

    - Steam—Provides the ability to distribute games to a community of more than 25
    million gamers around the world.

    - Ubuntu Center—Ubuntu users will be able to view your applications, along with
    ratings and reviews.

    - Facebook—All of the core Facebook Technologies, such as Plugins, the Graph API,
    and Platform Dialogs, are available to Apps on Facebook.

    - Chrome Web Store—Marketplace for apps designed for the Google Chrome browser.


    This list is not all-encompassing as there are many other marketplaces online
    for games. You may find that you need to distribute your game to multiple marketplaces,
    and even then you may find other ways to distribute your game to make the income
    you are looking for.


    ## Earning a Living


    Creating and selling games is a highly competitive field and there are not any
    guarantees that your games will be successful. Testing your game with various
    audiences and incorporating constructive feedback can help you create better games.
    You may not succeed on your first try, not many do, but the ones that succeed
    are naturally the ones that did not stopping. Although the game creation field
    is very competitive, if it were impossible to earn an income you can survive on
    creating games, there would not be so many people and companies competing. The
    skills you learned while working through the chapters of this book will help you
    on your journey of developing your game skills. You may wish to continue using
    this book in the future as a reference source to refresh your skills in a particular
    area. Additional information associated with The GameMaker Standard book can be
    found at this book''s companion website: www.thegamemakerstandard.com.


