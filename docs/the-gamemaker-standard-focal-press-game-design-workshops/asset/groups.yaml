    ## Andrew Sanders


    Andrew started drawing when he was four years old. His parents said even then
    that he could draw pretty anything he could see. He focused mostly on comic book
    art and wanted to go into the comic book field for a while. When Andrew was in
    high school he had an art teacher tell him that he was drawing "wrong"; he left
    for a while and went into drafting. That led to CAD, which he is really skilled
    in CGI. When Wayne Community College started the Simulation and Game Development
    (SGD), it was a perfect time for him because he had gotten out of the hospital
    and did not go back to full time for a while. Prior to the SGD, Andrew had to
    use 3DS Max, and it was pretty challenging without formal help. During his first
    semester at Wayne Community College, he took Maya and Game Textures and fell in
    love with the whole system. Then, he has never stopped working with Maya. It is
    by far one of his favorite things to do. He has recently started Zbrush, which
    has been a great tool to work with as well. Some of Andrew''s favorite things
    to create are vehicles, mechanical creatures, and robots.


    ## Jennifer Vinciguerra


    Jennifer Vinciguerra does a little bit of everything well. One might call her
    a "Jill of all trades." A woman of many skills, she helped her husband, David,
    with this book in a variety of ways: She composed and performed the eerie violin
    music for the Lost Dog game; Snail Trail, and Blood Vessel and colored some of
    the artists'' graphics used to blend them together; best of all, she most enjoyed
    creating all of the graphics for Keeper of the Oracle, partially the landscapes.
    In addition to create work, Jennifer also pitched in to proof a bit of the technical
    writing and tested instructions for clarity by building some of the games as instructed
    in the chapters.


    Jennifer holds a Bachelor of degree in Geography from the University of North
    Carolina, which is probably why she enjoys maps and landscapes for games. She
    also holds a Master of Science degree in Instructional Technology as well as a
    graduate certificate in Virtual Reality in Education and Training from East Carolina
    University (ECU). After working for five years she opened her own Suzuki Violin
    studio where she currently teaches 15 students and puts to use all those years
    of violin lessons her parents invested in. Teaching violin allows her to spend
    quality time with her family, to employ her deododge multimedia skills for promoting
    the studio, and to help her husband, David, with his exciting projects—like textbook
    authorizing.


    ## Acknowledgments


    This book would not exist if not for the incredible team of people that contributed
    their time, talent, and encouragement during the creation process. Compiling this
    book followed a process very similar to creating games. Concept artists were needed
    to visualize the games. 2D and 3D artists created the game visuals based on sketches
    and descriptions. Music and sound effects were created specifically for each game
    and beta testers and editors were needed to review materials to make sure bugs
    in both games and narrative were removed. It should be noted that if any bugs
    still remain in the text of this book or in the games it is the fault of the writers
    alone and not of the testers and editors who have done a phenomenal job over each
    chapter and re-creating games to make sure everything is clear and working properly
    for the reader.


    We are tremendously grateful for the patience and assistance from our families
    during the writing of this book, specifically in providing the time needed to
    hide away and write without distractions. David would like to thank his wife,
    Jennifer, for her contributions of art, music, narrative editing, encouragement,
    and overall for always believing in him.


    We would like to give thanks to those of you that provided ideas, technical assistance,
    feedback, encouragement, and contributed original artwork for this project: Richard
    Graham, Beth Hooks, Whitney Joyner, Glenn Rooster, Andrew Sanders, Hunter Springer
    (for the Lost Dog puzzle), Jaquan Walker, Alice Watkins, and Stephen Westbrook.


    Additionally we would like to thank all the people involved in the review process:

