    \ when the player collides with the dagger, the blocks will be destroyed and the\
    \ masks will shoot in rapid fire, forcing the player to attack them in order.\n\
    \nWe'll need to set up the actions to detect when the player attacks the masks.\n\
    \n## Destroying the Masks\n\nStep 1: Open the spr_explosion sprite and center\
    \ it.\n\nStep 2: When each mask is destroyed, it will explode to let the player\
    \ know it has been deactivated. Create a New Object obj_explosion and set the\
    \ sprite to spr_explosion.\n\nStep 3: Add a Create Event.\n\nStep 4: Add a Play\
    \ Sound Action.\n\n```\nSound: snd_explosion\nLoop: false\n```\n\nStep 5: Add\
    \ an Other: Animation End Event and drag in a Destroy Instance Action. This will\
    \ destroy the obj_explosion object after the explosion animation is complete.\
    \ We will now have the masks turn into explosion when they are hit by a dagger.\n\
    \nStep 6: Open All Three Mask objects and for each add a Collision Event with\
