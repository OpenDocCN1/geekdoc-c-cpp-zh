    **Step 1:** Under Rooms, double-click to open Room0 back up.


    **Step 2:** Under the Objects tab, find the rectangle containing the text **obj_scout**.
    Click the icon next to it to open a list of the three asteroids you just created.


    **Step 3:** Select the small asteroid. Then click on the grid to place the object
    in the game.


    **Step 4:** Repeat Steps 2–3 to add the medium and large asteroids to the game.


