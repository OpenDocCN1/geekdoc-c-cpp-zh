    \n# 血管 (BLOOD-VESSEL)\n\n![](img/584600b080035f863f96e219491bffbd_177_0.png)\n\
    \n# 2.5D——在 2D 游戏中模拟 3D 效果\n\n学习目标——完成第 6 章后，读者将能够：\n\n- 定义什么是 2D 游戏以及它与 2D 和\
    \ 3D 游戏的区别\n- 阐述用于创建深度幻觉的技术\n- 使用精灵集（sprite sheets）创建看起来像三维的物体\n- 定义什么是视觉错觉以及如何将其纳入游戏设计中\n\
    - 理解人眼如何观察三维空间中的物体\n- 创建一个游戏内血条\n\n# 项目概述：血管 (Blood Vessel)\n\n在《血管》中，玩家驾驶一辆微型载具穿过另一个人的血液循环。玩家将对那些进入受害者血液循环的绿色病毒发射抗病毒粒子。玩家还想要破坏健康的血细胞。屏幕顶部的血条将跟踪玩家的进度。每摧毁一个病毒，血条的绿色部分就会增加，显示此人变得越来越健康。相反，每漏掉一个病毒或每破坏一个健康细胞，血条的红色部分就会增加，表示此人的状况正在恶化。这个游戏使用一系列视觉错觉来营造血细胞和病毒正在\
    \ 3D 空间中向玩家移动的印象。当我们把这些幻觉添加到游戏时，将对每种幻觉进行更详细的说明。首先，我们需要从 www.thegame-makerstandard.com/bloodvessel\
    \ 下载 Blood Vessel 的资源文件。下载资源文件夹后，阅读 updates.pdf 文档，其中包含了自本书出版以来的任何更改。\n\n## 创建\
    \ 2.5D 效果\n\n视觉错觉当你看向一个东西时，你的大脑感知它的方式与实际情况不同。通过理解人眼区分\n\n物体距离的方式\n\n![](img/584600b080035f863f96e219491bffbd_178_0.png)\n\
    \n# 2.5D——在 2D 游戏中模拟 3D 效果\n\n我们可以欺骗游戏的玩家，让他们认为正在玩的 2D 游戏实际上是 3D 的。2.5D 是一种用于在\
    \ 2D 环境中创建深度幻觉的技术。通过使用精灵集创建看起来像三维的物体，我们可以让游戏感觉更有沉浸感和吸引力。视觉错觉是操纵玩家对空间感知的关键工具，理解人眼如何观察三维空间的物体对于创建这些效果至关重要。最后，我们将创建一个游戏内血条。\n\
