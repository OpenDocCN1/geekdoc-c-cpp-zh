    **步骤 2：** 接下来，点击窗口左侧的 Objects 选项卡。点击场景中的任意位置放置飞船。点击并按住。在飞船左侧（背部）留出一列网格，使飞船不接触左墙。如果不小心在场景中放置了多个飞船，可以右键点击额外的飞船并选择
    delete 将删除。点击绿色按钮保存更改并关闭属性窗口。


