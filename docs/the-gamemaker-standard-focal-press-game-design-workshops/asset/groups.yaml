    - Step 3: Close the rooms for now as we need to create the navigational buttons\
    \ that will allow the player to start or quit the game.\n- Step 4: Create two\
    \ New Objects and name them obj_play and obj_quit.\n- Step 5: Set both objects'\
    \ sprites to spr_collider.\n- Step 6: In obj_play add a Mouse: Left Button Event\
    \ then drag in a Different Room Action and set the following:\n\nRoom:room_gameplay\n\
    - Step 7: Open the obj_quit object and add a Mouse: Left Button Event and drag\
    \ in an End Game Action.\n- Step 8: Open all three screen rooms and place the\
    \ buttons over the graphics using the Scale. The final results look similar to\
    \ Figure 6.19.\n- Step 9: Arrange the Rooms in the Rooms Folder that we were putting\
    \ in a place holder in the obj_health object. Now that our win and lose room are\
    \ complete we can replace the holder with the correct rooms. Open obj_health and\
    \ select the Event.\n- Step 11: Open the first Different Room Action and set the\
    \ following:\n\nRoom:room_win\n- Step 12: Open the second Different Room Action\
    \ and set the following:\n\nRoom:room_loss\n\n## THE GAMEMAKER STANDARD\n\n![](img/584600b080035f863f96e219491bffbd_200_0.png)\n\
    \nFIGURE 6.18\n\n![](img/584600b080035f863f96e219491bffbd_200_1.png)\n\nFIGURE\
