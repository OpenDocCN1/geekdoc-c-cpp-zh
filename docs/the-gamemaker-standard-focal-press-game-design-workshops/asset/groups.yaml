- md: "\nWhen the player enters the West Gate, the **Boss Level** will load. In the\
    \ **Boss Level** they will see a **Totem Pole** which represents the **Boss**\
    \ for this game. Some games have what are called mini-bosses at the end of each\
    \ level and a **Final Boss** at the end of the game. The Totem Pole would be the\
    \ **Boss** for this game since we do not have any additional levels. If the game\
    \ had many **mini-bosses** and at the end of the game there would be a powerful\
    \ **Final Boss**. The **Totem Pole** contains multiple heads that shoot fire and\
    \ ice. The player will need to use the obstacles in the room to hide from the\
    \ fire and ice projectiles. They will use their new dagger which is more powerful\
    \ than the original dagger to destroy each of the totem heads individually. When\
    \ all of the heads are destroyed, a gem will appear. When the player picks up\
    \ the gem, a new **Dialog Box** will appear telling them they completed the game.\
    \ This will then load the screen after a few seconds.\n\n## Preparing the Remaining\
    \ Rooms\n\n- **Step 1:** Create five Rooms and name them: *room_title, room_level_one,\
    \ room_level_two, room_shop, room_finalboss.*\n- **Step 2:** Set the **Width to\
    \ 800** and **Height to 600** for all the rooms.\n\n222\n\n- Step 3: The background\
    \ of the rooms should be self-explanatory by now. Set up the backgrounds for each\
    \ room and arrange them so your room's folder looks to **Figure 8.3.**\n\nWe will\
    \ move the Title Room to the top of the list after setting up the Play and Quit\
    \ buttons.\n\n## Creating a Persistent Object\n\nFor the remainder of this chapter\
    \ we will be creating each room in the order that it will appear when played.\
    \ The first object we need to create is an object that will persist through all\
    \ the rooms. This object will be used to store values; for example, it will keep\
    \ track of how many coins the player has obtained so that the player does not\
    \ lose them when changing rooms.\n\n- **Step 1:** Create a **New Object** `obj_control`.\n\
    \n- **Step 2:** Add a **Create** Event and add a **Set Variable** Action. Set\
    \ the following:\n\n  Variable: global.myCoins\n  Value: 0\n\n- **Step 3:** Add\
    \ a **Set Variable** Action and set the following:\n\n  Variable: global.myWeapon\n\
    \  Value: 0\n\n- **Step 4:** Add a **Set Variable** Action and set the following:\n\
    \n  Variable: global.hasGem\n  Value: 0\n\n- **Step 5:** Add a **Set Sprite**\
    \ Action and set the following:\n\n  Sprite: spr_hud\n  Subimage: 0\n  Speed:\
    \ 0\n\n- **Step 6:** Add an **Other: Room Start** Event.\n\n- **Step 7:** Add\
    \ a **Change Sprite** Action and set the following:\n\n  Sprite: spr_hud\n  Subimage:\
    \ global.myWeapon\n  Speed: 0\n\nThis will make the HUD display the appropriate\
    \ subimage for the weapon.\n\n- Step 8: Check the Persistent checkbox.\n- Step\
    \ 9: Place the obj_control object in the top right of room_oracle_one.\n\n## Displaying\
    \ Coins in the HUD Display\n\nThe game will now display in the HUD which weapon\
    \ if any player character is carrying. We will also want the HUD to display the\
    \ amount of coins the player character has at any given in the game.\nWe will\
    \ create a Persistent Counter Object that will be placed beside the image of the\
    \ coin bag. For the purposes of this game and tutorial, the player will never\
    \ have over 60 gold pieces so the counter will stop at the 90 and only count in\
    \ multiples of 10.\n\n- Step 1: Create a New Object and name it obj_counter.\n\
    - Step 2: Set the Sprite to spr_counter.\n- Step 3: Check the Persistent option\
    \ and set the depth to –1.\n- Step 4: Add a Create Event.\n- Step 5: Add a Set\
    \ Sprite Action and set the following:\n\n  Sprite: spr_counter\n  Subimage: 0\n\
    \  Speed: 0\n\n![](img/584600b080035f863f96e219491bffbd_236_0.png)\n\nIf the coins\
    \ go up at any point, we will have the object that changes the coins also change\
    \ the counter image.\n\n- **Step 6:** Place the obj_counter object at the top\
    \ right room_oracle_one beside the coin bag X symbol.\n\n## Creating the Oracle\
    \ Object\n\nThe Oracle object is the entity that gives our player information\
    \ on what to do and where to go in the game. This could actually be any type of\
    \ character such as a person, animal, or magical being. In the case of this game,\
    \ it is a pool of water.\n\n- **Step 1:** Create a New Object named obj_oracle\
    \ and set the sprite to spr_oracle.\n- **Step 2:** Check the Solid option and\
    \ click the Depth to 1.\n- **Step 3:** Open the spr_oracle sprite and click the\
    \ Modify Mask option and set the shape to Precise.\n- **Step 4:** Open all of\
    \ the Oracle Rooms and place obj_oracle in the middle of the room so it appears\
    \ similar to Figure 8.5.\n\n![](img/584600b080035f863f96e219491bffbd_237_0.png)\n\
    \nFIGURE 8.5\n\n## Creating the Scrolls\n\nThe Oracle will give instructions to\
    \ the player via scrolls that appear on the screen after the player enters the\
    \ Oracle Rooms.\n\n- **Step 1:** Create a New Object and name it obj_scroll.\n\
    - **Step 2:** Set the sprite to spr_scroll.\n- **Step 3:** Uncheck the Visible\
    \ option.\n- **Step 4:** Add a Create Event.\n- **Step 5:** Add an Alarm then\
    \ set the following:\n\n  - Number of steps: 90\n  - In alarm: 0\n\n- **Step 6:**\
    \ Add an Alarm 0 Event.\n- **Step 7:** Add a Set Variable Action and set the following:\n\
    \n  - Variable: visible\n  - Value: true\n\n- **Step 8:** Place the scroll object\
    \ in the top left of the room so it looks similar to Figure 8.6.\n\n![](img/584600b080035f863f96e219491bffbd_238_0.png)\n\
    \n226\n\n## Creating Level Triggers\n\nA trigger is an object that triggers some\
    \ sort of event in the game. Triggers can be used to spawn enemies, change music,\
    \ or in this case load the next level.\n\n- **Step 1:** Create a Folder named\
    \ Triggers.\n- **Step 2:** Create a New Object named obj_nlt_one. The abbreviation\
    \ nlt stands for \"next level\".\n- **Step 3:** Set the sprite for obj_nlt_one\
    \ to be Solid.\n- **Step 4:** Add a Collision with the player_default object.\n\
    - **Step 5:** Add a Different Room Action and set the following:\n\n  - Room:\
    \ room_level_one\n\n- **Step 6:** Place the obj_nlt_one object just outside the\
    \ gate is located so that it looks similar to Figure 8.7.\n\n![](img/584600b080035f863f96e219491bffbd_239_0.png)\n\
    \nFIGURE 8.7\n\n## Building the First Level\n\nLevel One will have stone walls\
    \ that the player cannot pass through. These stone walls can be used to create\
    \ a maze for the player to navigate through. This is also the level with the fireball\
    \ shooting masks. The player will need to navigate the maze while at the same\
    \ avoid the fireballs. The player at this point in the game does not have any\
    \ weapons, which increases the difficulty of the level.\n\n## Creating the Stone\
    \ Objects\n\n- **Step 1:** Create a New Object named obj_stone and set the sprite\
    \ to spr_stone.\n- **Step 2:** Check the Solid checkbox and set the Depth to 2.\n\
    - **Step 3:** Create a Second Object named obj_stone_two. This second stone object\
    \ will not be destroyed when the player collects the dagger. The player will be\
    \ able to use this stone as a barrier to hide from the fireballs.\n- **Step 4:**\
    \ Set the sprite to spr_stone_two and check the Solid option and set the Depth\
    \ to 2.\n\n## Creating the Masks\n\n- **Step 1:** Create Three New Objects and\
    \ name them obj_mask_left, obj_mask_right, and obj_mask_down. To keep track of\
    \ them you may wish to put these objects in a folder named Masks.\n- **Step 2:**\
    \ Assign the following sprites:\n\n| obj_mask_left | spr_mask_left |\n| obj_mask_right\
    \ | spr_mask_right |\n| obj_mask_down | spr_mask_down |\n\nThe masks can be placed\
    \ anywhere on the top and side walls. The appropriate mask will need to be used\
    \ depending on which wall it is on. This will be where the fireballs will shoot\
    \ out of, so masks and walls should be placed in such a way that it is difficult\
    \ but not impossible for the player to navigate to the bottom of the level. We\
    \ will now add the shooting feature to all three of the masks.\n\n- Step 1: For\
    \ each of the mask objects add a Create Event.\n"
  mdcn: "\n\n当玩家进入西门时，将加载**Boss 关卡**。在**Boss 关卡**中他们将看到一个代表该游戏**Boss**的**图腾柱**。有些游戏在每个关卡的结束会有所谓的小\
    \ Boss（mini-bosses），并在游戏结束时有一个**最终 Boss**（Final Boss）。由于我们没有额外的关卡，图腾柱就是该游戏的**Boss**。如果游戏有许多**小\
    \ Boss**，那么在游戏结束时有一个强大的**最终 Boss**。**图腾柱**包含多个可以射出火焰和冰弹的头部。玩家需要利用房间里的障碍物来躲避火焰和冰弹射物。他们将使用比原始匕首更强大的新匕首来逐个破坏每个图腾头部。当所有头部都被摧毁后，将会出现一颗宝石。当玩家拿起宝石时，会出现一个新的**对话框**，告诉他们已完成游戏。几秒钟后将加载屏幕。\n\
    \n## 准备剩余房间\n\n- **步骤 1：** 创建五个房间并命名为：*room_title, room_level_one, room_level_two,\
    \ room_shop, room_finalboss.*。\n- **步骤 2：** 将所有房间的**宽度设为 800**，**高度设为 600**。\n\
    \n222\n\n- 步骤 3：房间的背景现在应该是一目易懂的。为每个房间设置背景并进行排列，使你的房间文件夹看起来类似于**图 8.3**。\n\n在设置好“播放”和“退出”按钮之后，我们将标题房间移动列表顶部。\n\
    \n## 创建持久对象\n\n在本章的剩余部分，我们将按照游戏运行时出现的顺序创建每个房间。我们需要创建的第一个对象是一个贯穿所有房间的对象。此对象将用于存储数值；例如，它将跟踪玩家获得了多少硬币，以便玩家在切换房间时不会丢失它们。\n\
    \n- **步骤 1：** 创建一个**新对象** `obj_control`。\n\n- **步骤 2：** 添加**创建（Create）**事件并添加**设置变量（Set\
    \ Variable）**动作。设置如下：\n\n  变量：global.myCoins\n  值：0\n\n- **步骤 3：** 添加一个**设置变量（Set\
    \ Variable）**动作并设置如下：\n\n  变量：global.myWeapon\n  值：0\n\n- **步骤 4：** 添加一个**设置变量（Set\
    \ Variable）**动作并设置如下：\n\n  变量：global.hasGem\n  值：0\n\n- **步骤 5：** 添加一个**设置精灵（Set\
    \ Sprite）**动作并设置如下：\n\n  精灵：spr_hud\n  子图像：0\n  速度：0\n\n- **步骤 6：** 添加一个**其他：房间开始（Other:\
    \ Room Start）**事件。\n\n- **步骤 7：** 添加一个**更改精灵（Change Sprite）**动作并设置如下：\n\n  精灵：spr_hud\n\
    \  子图像：global.myWeapon\n  速度：0\n\n这将使 HUD 显示相应的子图像。\n\n- 步骤 8：勾选**持久性（Persistent）**。\n\
    - 步骤 9：将 `obj_control` 对象放置在 `room_one` 的右上角。\n\n## 在 HUD 中显示硬币\n\n游戏现在会在 HUD\
    \ 中显示玩家携带的武器。我们还希望 HUD 显示玩家在游戏中拥有的硬币数量。我们将创建一个持久对象，放置在硬币图像旁边。为了本游戏的目的，玩家的硬币永远不会超过\
    \ 60，因此计数器将在 60 时停止并以 10 为倍数计数。\n\n- 步骤 1：创建一个新对象并命名为 `obj_counter`。\n- 步骤 2：将其设置为\
    \ `spr_counter`。\n- 步骤 3：勾选**持久性（Persistent）**并将深度设为 -1。\n- 步骤 4：添加**创建（Create）**事件。\n\
    - 步骤 5：添加**设置精灵（Set Sprite）**动作并设置如下：\n\n  精灵：spr_counter\n  子图像：0\n\n![](img/58460b080035f863f96e219411bd236)\n\
    \n如果硬币增加，我们将更改计数器图像。\n\n- **步骤 6：**将 `obj_counter` 对象放置在 `room_one` 的右上角，硬币符号旁边。\n\
    \n## 创建 Oracle 对象\n\nOracle 对象是告诉玩家在游戏中应该做什么以及去哪里的实体。这可以是任何类型的角色，如人类、动物或魔法生物。在本游戏中，它是一个水池。\n\
    \n- 步骤 1：创建一个命名为 `obj_oracle` 的新对象并设置为 `spr_oracle`。\n- 步骤 2：勾选**实体（Solid）**并将深度设为\
    \ 1。\n- 步骤 3：打开 `spr_oracle` 精灵，点击**掩码（Mask）**选项并将形状设置为**精确（Precise）**。\n- 步骤\
    \ 4：打开所有 Oracle 房间并将 `obj_oracle` 放置在房间中间，类似于图 8.5。\n\n![](img/58460b080035f863f96e219411bd237)\n\
    \n图 8.5\n\n## 创建卷轴\n\nOracle 将通过进入 Oracle 房间后出现在屏幕上的卷轴向玩家提供指令。\n\n- 步骤 1：创建一个命名为\
    \ `obj_scroll` 的对象。\n- 步骤 2：将其设置为 `spr_scroll`。\n- 步骤 3：取消勾选**可见（Visible）**选项。\n\
    - 步骤 4：添加**创建（Create）**事件。\n- 步骤 5：添加**报警（Alarm）**然后设置如下：\n\n  步数：90\n  报警编号：0\n\
    \n- 步骤 6：添加**报警 0（Alarm 0）**事件。\n- 步骤 7：添加**设置变量（Set Variable）**动作并设置如下：\n\n \
    \ 变量：visible\n  值：true\n\n- 步骤 8：将卷轴对象放置在房间的左上角，类似于图 8.6。\n\n![](img/58460b080035f863f96e219411bd238)\n\
    \n226\n\n## 创建关卡触发器\n\n触发器是触发游戏中某种事件的对象。触发器可以用于生成敌人、更改音乐，或者在本情况下加载下一个关卡。\n\n-\
    \ 步骤 1：创建一个名为 `Triggers` 的文件夹。\n- 步骤 2：创建一个命名为 `obj_nlt_one` 的新对象。`nlt` 缩写代表“next\
    \ level”（下一个关卡）。\n- 步骤 3：将 `obj_nlt_one` 的精灵设置为**实体（Solid）**。\n- 步骤 4：添加与 `player_default`\
    \ 对象的碰撞。\n- 步骤 5：添加一个**不同房间（Different Room）**动作并设置如下：\n\n  房间：room_level_one\n\
