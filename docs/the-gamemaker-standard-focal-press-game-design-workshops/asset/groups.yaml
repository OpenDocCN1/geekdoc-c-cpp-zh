    # GameMaker 标准


    《GameMaker 标准》是一本关于使用 GameMaker 引擎创建游戏的实战资源书。通过循序渐进的指导和大量的视觉示例，本书教授了读者基础技能和高效流程，帮助他们开始创建自己的游戏，同时也为希望扩展到
    GameMaker 格式的资深游戏开发读者提供了更高级的选项。每一章都包含一个关于创建特定游戏类型游戏的教程，为读者在自己创作游戏期间提供详细且准确的指南。本书的其他特色还包括：


    -   创建各种游戏的工具和方法，包括多关卡、双玩家和 RPG

    -   对用户界面选项和 GML 代码的涵盖

    -   如何创建 2.5D 游戏，以及它们与 2D 和 3D 的区别

    -   像素艺术创作技术

    -   关于导出和销售个人创作游戏的行业技巧和建议


    David C. Vinciguerra 是韦恩社区学院模拟与游戏开发学专业的讲师。在担任现职之前，他曾担任虚拟现实与教育实验室的共同主任，以及国际同行评审期刊《VR
    in Schools》的共同编辑，同时在东卡罗来纳大学教授研究生和本科生虚拟现实课程。David 居住在北卡罗来纳州的派克维尔，与他的妻子 Jennifer
    和女儿 Natalie 一住。


    Andrew Howell 在攻读模拟与游戏开发学位期间培养了对游戏编程的热爱。他使用 GameMaker 和 Unity3D 引擎开发了多个游戏。在韦恩社区学院模拟开发实验室期间，他发现向他人教授技能非常有趣。Andrew
    喜欢学习新的开发技术，目前住在北卡罗来纳州的金德斯堡。


