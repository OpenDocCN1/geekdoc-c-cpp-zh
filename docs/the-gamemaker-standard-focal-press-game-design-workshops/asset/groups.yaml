    predict where the next item will appear or how fast it is moving. In Alarm 0 we
    create a Moving Action and set the following:


    ```

    Object: obj_pumpkin

    x: random(980)+32 (This will pick a random value between 0 and 980, then add 32
    to it. Figure 5.2 illustrates the area of the room that this relates to.)

    y: -64

    Speed: random(5)+2 (This will pick a random speed between 0 and 5, then add 2
    to it.)

    Direction: 270

    Relative: checked

    ```


    **Step 6:** We will now create a delay so that no two pumpkins will appear at
