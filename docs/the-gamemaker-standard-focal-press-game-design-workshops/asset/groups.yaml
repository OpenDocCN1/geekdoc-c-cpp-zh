    Now that first room is created and our player character is placed in the room,
    we will want to run the game and test that the player animates, moves, and collides
    with the walls correctly.


    # Setting Up the Additional Oracle Rooms


    +   **Step 1:** Create a **New Folder** in the **Rooms** section and name it **Oracle
    Rooms**.

    **Step 2:** Drag the **room_oracle_one** room into the **Oracle Rooms** folder.

    **Step 3:** Create **Three New Rooms** and name them: **room_oracle_two**, **room_oracle_three**,
    **room_oracle_four** and place each of them into the **Oracle Rooms** folder.

    **Step 4:** Set the **Width to 800** and **Height to 600** for all three rooms.

