    # Pixel Art


    Learning Objectives—Upon completion of Chapter 5 readers will be able to:


    +   * Create pixel art sprites and import them into their games

    * Set the visual area of a room different from the actual area of the game

    * Create multiple simultaneously spawns for different objects

    * Use random to create random variables within a set range

    * Use Mouse:Left Button Events so the game can be played on a touch screen

    * Automatically remove a game object after a set time period


    # Project Overview: Candy Catch


    The objective for the Candy Catch game is simple. The player will want to collect
    as much candy as possible while simultaneously squashing all the pumpkins. Pumpkin
    will spawn randomly and travel down from the top of the screen to the bottom of
    the screen along a variety of candy pieces. The challenge of the game is to only
    click on the pumpkins and not the candy pieces. Doing so will result in a loss
    of points for the player. The player will also lose one of their three lives each
    time a pumpkin travels all the way to the bottom of the screen without being squashed.
    After creating this game we will then replace the pumpkin and candy graphics with
    pixel art.'
