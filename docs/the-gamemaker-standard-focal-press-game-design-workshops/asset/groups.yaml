    ## Project Overview: Candy Catch


    The objective for the Candy Catch game is simple. The player will want to collect
    as much candy as possible while simultaneously squashing all the pumpkins. Pumpkin
    will spawn randomly and travel down from the top of the screen to bottom of the
    screen. Doing so will result in a loss of points for the player. The player will
    also lose one of three lives each time a pumpkin travels all the way to the bottom
    of the screen. After creating this game we will then replace the pumpkin and candy
    graphics with pixel art.


