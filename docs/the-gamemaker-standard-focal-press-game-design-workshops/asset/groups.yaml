    # Side-Scroller Game Basics


    ![](img/584600b080035f863f96e219491bffbd_21_0.png)


    Figure 2.4


    You will now see a list of all of these sprites under the Sprites folder, a list
    of all the backgrounds in the Background folder, and a list of all the sounds
    in the Sounds folder in the top left side of your screen.


    # Room Creation


    GameMaker uses rooms to differentiate between different levels and screens. For
    this particular game, we will create three rooms: one room for the title screen,
    the second for the actual game level, and the third is for the game over. If we
    were creating a game with multiple levels, there would be a room for each additional
    level.


    **Step 1:** Maximize the GameMaker screen so that it fills your entire screen.


    **Step 2:** In the menu at the top of the window, select **Resources.** This opens
    a drop box with options. Choose **Create Room.** This opens the Rooms Properties
    window. You can move this window around needed so that you can still see all of
    the sprites on the left side of the screen.


    ![](img/584600b080035f863f96e219491bffbd_22_0.png)


    This room is our actual game level where all of the action occurs. We need to
    set the width, height, and speed for our game.


    **Step 3:** Select the Settings tab and make the following changes:


    - Width setting 1024

    - Height setting 576

    - Speed 30


    **Step 4:** Whenever you are finished making the changes in one of the Properties
    window in GameMaker, be sure to select the green checkmark in the top left corner
    of the window to save the options. We have a few more changes to make to the Room
    Properties, so do not click it yet.


    # Adding Backgrounds


    Since this game takes place in outer space, a starfield background is in order.
    We will be animating this background so that it scrolls from left to right continuously.
    This will give the illusion that the scout ship is flying through space, even
    though the actual scout ship sprite will not move from the left side of the screen.


    # Side-Scroller Game Basics


    **Step 1:** With the Room Properties window still open, select the **backgrounds**
    tab. You will see a grey rectangle that has **<no background>** written inside
    of it. This indicates that the room does not currently have a background; rectify
    this.


    **Step 2:** Click the small icon next to the grey rectangle to see a list of the
    backgrounds we have already uploaded into GameMaker. Doing so opens a drop down
    list with all of our background options, including the currently selected **no
    background** option at the top.


    **Step 3:** Choose the background title: **bg_starfield**. You should now see
    that the starfield background has been placed into the game. This particular graphic
    has specifically created to fit the height and width of this game. The starfield
    graphic is also designed so that it can be tiled. Tiling graphics appears as one
    long graphic placed side by side. The player should not notice where the first
    graphic ends and the next begins.


    **Step 4:** With our backgrounds tab selected, look to the bottom of the pane
    and change the **Hor.Speed** to **-2** to set the speed at which the starfield
    will move from right to left.


    **Step 5:** Choose the **green checkmark** at the top left of the Rooms Properties
    window to close it.


    ![](img/584600b080035f863f96e219491bffbd_23_0.png)


