    # Finalizing the Title and Win Screens


    In order for the players to start playing the game, quit the game, or replay the
    game after the game is complete, we need to create a title screen and add buttons
    to our screens.


    **Step 1:** Create a new room and name it room_title, then set the background
    to bg_title. Drag the room_title above all the other rooms in the Rooms folder.
    For the buttons on these screens we are going to use the scalable objects that
    we used previously on the colliders.


    **Step 2:** Create two new objects and name them obj_start and obj_quit. Use the
    spr_collider_square sprite for both of these objects.


    **Step 3:** In the obj_start object add a Mouse: Left Button Event.


    **Step 4:** Drag in a Go to Room Action and set the following:


    Room: room_level_one


    **Step 5:** Click OK and open the obj_quit object.


    **Step 6:** Add another Mouse: Left Button Event and drag in an End Game Action.


    **Step 7:** Go through room_title, room_purple_wins, and room_yellow_wins and
    position the obj_quit objects over the Quit buttons and scale it so it fits. Do
    the same with the obj_start for the start and replay graphics.


