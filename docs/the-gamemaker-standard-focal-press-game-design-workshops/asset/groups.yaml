    # Creating Next Level Triggers


    A trigger is an object that triggers some sort of event in a game. Triggers can
    be used to spawn enemies, change music, or in this case load the next level.


    **Step 1:** Create a Folder named Level Triggers.


    **Step 2:** Create a New Object named obj_nlt_one. The abbreviation nlt stands
    for "next level trigger".


    **Step 3:** Set the sprite for the obj_nlt_one object to be **Solid** until the
    player meets


    When a player enters a new level the Triggers will be Solid until the player meets
    the requirements to move to the next level. This way it can also work like a collider
    keeping the player in the room until the objective is met.


    **Step 4:** Add a Collision with the obj_player_default object.


    **Step 5:** Add a Different Room Action and set the following:


    Room: room_level_one


    **Step 6:** Place the obj_nlt_one object just outside the room where the open
    gate is located in room_oracle_one so that it looks similar to **Figure 8.7.**


