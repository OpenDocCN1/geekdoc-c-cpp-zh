    FIGURE 3.3


    As we found out when creating our previous game, sprites are simply graphics that
    do not do anything. In order for our dog to do anything other than stand still
    we need to create an object that we can add to our sprites. Objects tell the sprites
    how they should appear and act.


    ## Create the Dog Object


    - Step 1: Right click on the Objects folder and select Create Object.

    - Step 2: Name the object; obj_collider and set its sprite to spr_collider. Check
    the Solid box with then click OK.

    - Step 3: Create a new object and name it obj_dog.

    - Step 4: Set its sprite to spr_dog_idle.


    We will now create an event that will allow our dog to move left and right on
    the screen. While the dog will appear to be moving, GameMaker will be checking
    to see if there are any objects our player would collide with. If there is a solid
    object immediately in front of the dog is moving, the dog will collide with the
    object and will not be able to continue moving in that particular direction.


    ## Moving the Dog Left and Right


    - Step 1: With obj_dog open, click Add Event and choose Keyboard <Left>.

    - Step 2: Click the Control tab and drag a Check Object Action into the Actions
    panel.

    Set the following:


    Object: obj_collider

    x: -4

    y: 0


    Check both the Relative box and the NOT box.

    This makes sure obj_collider object is not four spaces to the left of the player.


    - Step 3: Click the Move tab and drag a Jump to Position Action under the Check
    Object we just created. Set the following:


    x: -4

    y: 0

    Relative: checked


    - Step 4: Click Add Event and choose Keyboard <Right>

    - Step 5: Repeat the previous four steps except make the x: 4 instead of -4 for
    both actions. Your Events will look similar to Figure 3.4.


    - Step 6: Click OK to exit the obj_dog.


    ![](img/584600b080035f863f96e219491bffbd_77_0.png)


    FIGURE 3.4


    ## Creating the First Level


    **Step 1:** Create a new room.

    **Step 2:** Click the Settings tab.

    **Step 3:** For this game we''re going to use a Width of 1024, and a Height of
    544 and a Speed of 60. To do this set the following:


    | Property | Value |

    | :--- | :--- |

    | Name | room_level_one |

    | Width | 1024 |

    | Height | 544 |

    | Speed | 60 |


    ## Adding the Dog to the Environment


    **Step 1:** Click the Objects tab.

    **Step 2:** Click the obj_dog as shown in Figure 3.5.

    **Step 3:** Place the dog in the middle of the room.

    **Step 4:** Select the obj_collider.


    ![](img/584600b080035f863f96e219491bdbd_78_0.png)


    66


    ![](img/584600b080035f863f96e219491bffbd_79_0.png)


    FIGURE 3.6


    Step 5: Place one obj_collider a short distance in front of the dog and another
    behind the dog similar to those shown in Figure 3.6.


    Step 6: Select the green check at the top left of the room window.


    ## Testing Character Movement


    Step 1: Click the green at the top of the screen to run the game.


    As you press the left and right keys the dog should slide left and right. With
    the object colliders in place the dog animation stop when it touches the two red
    squares. We have not added the run animation yet so do not be surprised when your
    dog appears to be sliding back and forth as if it were wearing roller skates.
    We will be adding the run animation shortly.


    Step 2: Close the window.


    Thanks gravity, what goes up must come down, at least that is our plan once we
    add gravity to the environment. By adding gravity to the level the dog will return
    to the ground in a natural way after jumping. Without gravity the dog would continue
    to float away when jumping. Although this would be to witness it would make for
    a very short game.


    ## Adding Gravity to the Dog


    **Step 1**: Open the obj_dog.


    **Step 2**: Click **Add Event** and choose **Step** and then **Step** again.


    **Step 3**: Select the control band and drag a **Check Empty** Action into the
    Actions box.

    Set the following:


    x: 0

    y: 1

    Objects: Only Solid

    Relative: Checked


    **Step 4**: Click **OK**.


    **Step 5**: Select the Move tab and drag a **Set Gravity** Action into the Actions
    window.

    Set the following:


