    \ **Set Alarm**并设置如下：\n  Number steps: 120\n  Alarm no: 0\n\n这将使鬼魂向左移动几秒钟，然后转向向右移动。鬼魂总是从向左移动，在将它们放入游戏时记住这一点。现在我们将让鬼魂对狗具有致命性。\n\
