    ## 安德鲁·桑德斯 (Andrew Sanders)


    安德鲁四岁就开始画画。他的父母说，那时他就能画出他看到的任何东西。他主要专注于漫画艺术，并希望在漫画领域发展一段时间。当安德鲁读高中时，一位美术老师告诉他他画得“不对”；他离开了一段时间转行做了制图。这让他接触了
    CAD，而他在 CGI（计算机生成影像）方面非常擅。当韦恩社区学院（Wayne Community College）开设模拟与游戏开发（SGD）专业时，对他来说是一个完美的时机，因为他当时刚出院，还没有回到全职工作。在学习
    SGD 之前，安德鲁必须使用 3DS Max，在没有正式帮助的情况下，这非常有挑战性。在韦恩社区学院的第一学期，他学习了 Maya 和游戏纹理，并爱上了这整个系统。从那以后，他就没有停止过使用
    Maya。到为止，这是他最喜欢的事情之一。他最近开始学习 Zbrush，这也是一个非常好用的工具。安德鲁最喜欢创作的内容包括车辆、机械生物和机器人。


    ## 詹妮弗·文西格拉 (Jennifer Vinciguerra)


    詹妮弗·文西格拉在许多方面都做得很好。人们可能会称她为“全能手”。作为一个多才多艺的女性，她通过多种方式帮助她的丈夫大卫编写这本书：她为游戏《迷失狗》（Lost
    Dog）创作并演奏了诡异的小提琴音乐；为《蜗牛之路》（Snail Trail）和《血槽》（Blood Vessel）为一些艺术家用于合成的图形进行了上色；最棒的是，她最喜欢创作《神谕守护者》（Keeper
    of the Oracle）的所有图形，包括部分景观。除了创作工作外，詹妮弗还参与了技术写作的校对，并通过按照章节中的指令构建了一些游戏来测试说明的清晰度。


    詹妮弗拥有北卡罗来纳大学的地理学学士学位，这可能就是为什么她喜欢游戏中的地图和景观的原因。她还拥有东部卡罗来纳大学（ECU）的教学技术硕士学位，以及教育与培训虚拟现实的研究生证书。在工作五年后，她开设了自己的瑞士鲁基小提琴工作室，目前她在那里教授
    15 名学生，并利用了父母多年投入的小提琴课程。教授小提琴让她能够与家人共度高质量的时光，利用她的多媒体技能推广工作室，并帮助她的丈夫大卫完成他令人兴奋的项目——如教材授权。


