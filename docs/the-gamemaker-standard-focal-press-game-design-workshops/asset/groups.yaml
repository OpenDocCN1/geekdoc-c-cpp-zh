    The value of 50 will add 50 coins to the player''s coin inventory.


    **Step 4:** Add a **Set Sprite** Action and set the following:


    +   Object: obj_counter

    Sprite: spr_counter

    Subimage: 5

    Speed: 0


    This will display 50 coins in the HUD.


    **Step 5:** Drag in a **Destroy Instance** Action below the **Set Variable** Action
    and check the **Other** checkbox.


    # Activating the Next Level Trigger


    When the player collides with the chest the Next Level Trigger needs to be activated.


    **Step 1:** Create a **New Object** and name it **obj_nlt_four**.


    **Step 2:** Check the **Solid** checkbox.'
