    在此时刻，当按下右键以确保飞船动画正常显示时，飞船看起来在向右倾斜；当按下左键时，飞船看起来在向左倾斜。如果没有按下任何按钮，飞船应该看起来正在直线飞行。


    ## 物体向玩家移动


    在本章前面，我们讨论了距离较远的物体在地平线位置更高、更模糊且更较小，而靠近我们的物体则反之。我们将利用这些信息来训练玩家的大脑，认为有真正的 3D 模型正在向玩家的飞船移动。我们将通过放入设计的图形来实现，这些图形显示物体开始时细节很少，随着在地平线上向下移动，细节和尺寸不断增加。这将使得物体看起来就像我们不断切换这些物体，从而让扁平的
    2D 精灵看起来像是 3D 模型。


    - **步骤 1：** 打开 **spr_blood** 精灵，并在 **Origin**（原点）部分将 **x** 设置为 **100**，**y** 设置为
    **0**。

    - **步骤 2：** 点击 **Modify Mask**（修改掩码）选项。

    - **步骤 3：** 勾选 **Precise**（精确）选项。


    ![](img/584600b080035f863f96e219491bffbd_186_0.png)


