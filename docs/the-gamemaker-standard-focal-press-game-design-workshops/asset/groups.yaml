  mdcn: "\n\n# 创建狗狗和碰撞器对象\n\n步骤 1：创建两个新对象，并将它们命名为 obj_dog 和 obj_collider。\n\n步骤 2：将\
    \ obj_dog 对象的精灵（sprite）设置为 spr_dog_idle。\n\n步骤 3：将 obj_collider 对象的精灵（sprite）设置为\
    \ spr_collider。\n\n# 创建一个测试房间\n\n为了测试我们将要实现的函数，我们需要为我们的狗狗和碰撞器对象创建一个房间。\n\n- 步骤\
    \ 1：创建一个新房间，并将其命名为 room_level_one。\n- 步骤 2：将房间速度（Room Speed）设置为 60。\n- 步骤 3：将\
    \ obj_dog 对象放置在 room_level_one 房间的中心位置。\n- 步骤 4：在狗狗周围放置几个碰撞器，使你的房间看起来类似于图 7.3\
    \ 所示。\n\n![](img/584600b080035f863f96e219491bffbd_206_0.png)\n\n图 7.3\n\n# 编写可角色的移动代码\n\
    \n当我们最初创建这个游戏时，我们使用了键盘事件来告诉游戏使用哪些按键进行特定移动。这一次我们将编写代码让狗狗向左和向右移动。\n\n**步骤 1：** 打开\
    \ **obj_dog** 对象并添加一个 **Keyboard: Any Key Event（键盘：任意键事件）**。\n\n**步骤 2：** 为事件添加一个\
    \ **Execute Code（执行代码）** 。\n\n**步骤 3：** 将弹出一个窗口，允许你输入特定的代码。输入以下内容：\n\n```\n//Left\n\
    if keyboard_check(vk_left) {\n    if place_free(x-4, y) {\n        x-=4\n    }\n\
    }\n//Right\nif keyboard_check(vk_right) {\n    if place_free(x+4, y) {\n     \
    \   x+=4\n    }\n}\n```\n\n![](img/584600b080035f863f96e219491bffbd_207_0.png)\n\
    \n图 7.4\n\n# 解析 GML 代码\n\n编程语言使用符号来表示程序理解的某些动作。我们输入的第一个代码符号是两个右斜斜杠，也称为正斜杠。每当 GameMaker\
    \ 在 GML 代码中遇到两个正斜杠时，它就理解后面的内容是注释，用于提醒代码正在做什么。GameMaker 将忽略两个正斜杠后的任何内容，直到它遇到另一个指示它应该执行不同操作的符号。注释对于设计师检查他们输入了什么很有用：它们还可以用于跟踪错误，并让阅读代码的另一个设计师知道代码应该做什么。这后半部分当一个设计师团队共同完成一个项目时非常有帮助。\n\
    \n在我们输入的两个正斜杠之后，我们输入了单词 left。这提醒我们接下来的代码设计用于告诉 GameMaker 检查是否按下了左键。我们在实际的 GML\
    \ 代码中输入的下一组文本是告诉：：让 GameMaker 检查左键是否被按下。我们输入的代码是 `keyboard_check (vk_left)`。这本质上是要求\
    \ GameMaker 运行检查以查看键盘上的左键是否被按下。一个“if”语句可以检查游戏中的几乎任何内容，例如 1+1=2。当你看着那行代码时，知道预期的结果是什么，它应该开始变得有意义。代码的下一部分读作：`if\
    \ place_free(x-4, y) (x=4)`。在这一特定行代码中，字母 x 之前的左括号在 y 之后有一个匹配的右括号。在编码中，括号总是是成对出现的。x=-4\
    \ 周围的括号也是如此。在某行代码中忘记输入第二个括号或括号是一个常见的错误，不幸的是，这会导致错误并阻止预期的动作被执行。在这种情况下，预期的动作是让 GameMaker\
    \ 检查狗狗左侧是否有四个空位，且空间内没有实体对象出现。如果有四个空位，GameMaker 将在游戏中把狗狗放在左侧四个格的位置。代码的其余部分告诉 GameMaker\
    \ 执行相同的操作，但这次是检查狗狗右侧是否有实体对象。\n\n![](img/584600b080035f863f96e219491bffbd_208_0.png)\n\
    \n# 将碰撞器转换为实体对象\n\n代码正在指示 GameMaker 搜索距离狗狗四格之远的任何实体对象。为了让碰撞器被识别为实体对象，我们需要将其转换为实体对象。\n\
    \n**步骤 1：** 打开 obj_collider 对象并勾选标记为 **Solid（实体）** 的框。\n\n![](img/584600b080035f863f96e219491bffbd_209_0.png)\n\
    \n图 7.6\n\n**步骤 2：** 测试游戏并使用左右键向左和向右移动。狗狗将无法通过碰撞器。\n\n# 编写狗狗图像切换方向的代码\n\n考虑到按下左键时必须向后移动，狗狗的表现还可以。为了改变这一点，我们将添加另一段代码指示狗狗的图像进行翻转，使其面向移动的方向。\n\
