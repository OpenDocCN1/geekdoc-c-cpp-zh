  - '[PAGE 240]


    # Building the First Level


    Level One will have stone walls that the player cannot pass through. These stone
    walls can be used to create a maze for the player to navigate through. This is
    also the level with the fireball shooting masks. The player will need to navigate
    the maze while at the same time avoid the fireballs. The player at this point
    in the game does not have any weapons, which increases the difficulty of the level.


    # Creating the Stone Objects


    +   Step 1: Create a New Object named obj_stone and set the sprite to spr_stone.

    Step 2: Check the Solid checkbox and set the Depth to 2.

    Step 3: Create a Second Object named obj_stone_two. This second stone object will
    not be destroyed when the player collects the dagger. The player will be able
    to use this stone as a barrier to hide from the fireballs.

    Step 4: Set the sprite to spr_stone_two and check the Solid option and set the
    Depth to 2.


    # Creating the Masks


    +   Step 1: Create Three New Objects and name them obj_mask_left, obj_mask_right,
    and obj_mask_down. To keep track of them you may wish to put these objects in
    a folder named Masks.

    Step 2: Assign the following sprites:


    | obj_mask_left | spr_mask_left |

    | obj_mask_right | spr_mask_right |

    | obj_mask_down | spr_mask_down |


    The masks can be placed anywhere on the top and side walls. The appropriate mask
    will need to be used depending on which wall it is on. This will be where the
    fireballs will shoot out of, so masks and walls should be placed in such a way
    that it is difficult but not impossible for the player to navigate to the bottom
    of the level. We will now add the shooting feature to all three of the masks.


    +   Step 1: For each of the mask objects add a Create Event.'
