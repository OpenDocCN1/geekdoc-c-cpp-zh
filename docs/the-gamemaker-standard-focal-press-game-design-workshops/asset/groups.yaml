    ![](img/584600b080035f863f96e219491bdbd_128_0.png) 图 4.4


    ![](img/584600b080035f863f96e219491bdbd_128_1.png) 图 4.5


    ## 创建父对象


    设置完成后，我们将设置一个父对象，这样就不需要为每个轨迹创建碰撞事件。


    **第 1 步：** 创建一个名为 **obj_trail** 的 **New Object（新对象）**，且没有精灵。

    **第 2 步：** 打开 **obj_yellow_trail** 和 **obj_purple_trail**，并将它们的 parent（父级）选项设置为
    **obj_trail**。


    现在我们将能够为两条轨迹设置一个碰撞事件。


    **第 3 步：** 打开两个蜗牛对象，为它们各添加与 **obj_trail** 的 **Collision（碰撞）** 事件。

    **第 4 步：** 在事件中添加 Destroy Instance（摧毁实例）。


    ## 测试蜗牛轨迹


    测试你的游戏，观察当蜗牛与轨迹碰撞时，它是否会被摧毁。如果蜗牛在没有碰到轨迹的情况下被毁，你需要回去检查碰撞码，确保图像是居中的。


    ![](img/584600b080035f863f96e219491bdbd_129_0.png)


    ## 添加道具物品


    目前的游戏非常有挑战性，但我们希望添加一些元素增加游戏的策略性。我们现在将添加两种玩家可以捡取的物品。这些物品以不同颜色蘑菇的形式存在。如果玩家捡起红色蘑菇，他们将使蜗牛在有限时间内处于无敌状态。这种捡取物品与我们在
    Scout 游戏中激活的强化道具不同，因为在《Snail Trail》中，玩家可以在获得它们后立即冻结对方。当涉及到第二个捡取物品——蓝色蘑菇时，这个选项变得更有意义。策略性地使用时，玩家可以捡起蘑菇并保存直到靠近对方。然后冻结对方并移动到对方前面，这样当对方开始移动时，就无法碰撞对方的轨迹。为了让使用道具的决策过程更具挑战性，玩家每次只能持有一个物品。如果玩家捡起红色蘑菇后又捡起蓝色蘑菇而不使用红色蘑菇，他们将丢失红色蘑菇。'
