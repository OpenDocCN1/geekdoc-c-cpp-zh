    恭喜你，你现在创建了一个多关卡游戏并在其中加入了简单的谜题元素。你还引入了人工智能元素来控制幽灵的巡逻路线。尝试玩你的游戏，看看能否发现任何运行异常的元素。在游戏开发领域，他们把这些称为
    bug。通常，可以通过重新检查你在某些动作中输入的设置来轻松修复 bug。如果你找不到任何问题，那么是时候让别人玩玩你的游戏，看看他们是否忽略了某些东西，因为你已经知道游戏应该是如何运作的。没有参与游戏开发过程的人经常会尝试一些我们从未想过的操作，从而为我们发现一些需要修复的
    bug。如果你还没有，可能想在关卡中添加一些 bug 来使其变得更有挑战性。你可能希望使用提供的资源创建额外的关卡。尝试不同的谜题想法会非常有趣。


