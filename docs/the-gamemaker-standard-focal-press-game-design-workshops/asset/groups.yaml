    # Creating the Oracle Object


    The Oracle object is the entity that gives our player information on what to do
    and where to go in the game. This could actually be any type of character such
    as a person, animal, or magical being. In the case of this game, it is a pool
    of water.


    +   **Step 1:** Create a New Object named obj_oracle and set the sprite to spr_oracle.

    **Step 2:** Check the Solid option and click the Depth to 1.

    **Step 3:** Open the spr_oracle sprite and click the Modify Mask option and set
    the shape to Precise.

    **Step 4:** Open all of the Oracle Rooms and place obj_oracle in the middle of
    the room so it appears similar to Figure 8.5.


