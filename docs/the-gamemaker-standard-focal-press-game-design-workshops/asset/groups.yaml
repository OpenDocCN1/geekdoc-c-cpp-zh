    purple. Since we have just used Alarm 2 we will now want to use the next consecutive
    number for purple.


    Step 4: Create an Alarm 3 Event and drag in a Set Variable and set the following:


    Variable: global.purpleWins

    Value: 1

    Relative: checked


    Step 5: Press OK to save the obj_snail_parent and then open obj_yellow_snail and
    obj_purple_snail.


    Step 6: For both objects, in the Collision Events with obj_trail we will now replace
    the Destroy Instance Action with a Set Alarm Action and delete the Destroy Instance
    located between the green arrows for both objects.


