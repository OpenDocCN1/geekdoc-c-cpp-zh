    ## Testing the Game


    You will want to have several people test this game for you after you have eliminated
    initial bugs you find. This RPG game has incorporated several features that were
    not present in previous games. The more features added to a game, the higher the
    potential for bugs to occur. We added several features to the game using code
    which saved time; however, should one character of code be off, such as a letter
    capitalized and should not be, the coded feature will not work. After your game
    has been tested, you may wish to change the layout of the obstacles or floor tiles
    of the south, east, and west rooms to make the game more challenging. Remember
    that a challenging game is fun while an impossible-to-win game is not.


