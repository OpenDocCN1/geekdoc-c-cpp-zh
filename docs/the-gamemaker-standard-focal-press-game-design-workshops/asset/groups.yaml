    # Creating Bullets


    Our ship at present can only destroy things by running into them. Although this
    can be fun does not allow the ship to destroy viruses that are far away. By allowing
    the ship to shoot antiviral charges (aka bullets) the player will be able to strategize
    which objects to shoot and which are better to ram to. Either of the options will
    benefit the player as they both destroy viruses. Yet by adding the antiviral charges
    the player can eliminate viruses that are further away, which will give the player
    time to navigate around incoming blood cells.


    Step 1: We first need to tweak the sprite a bit to make the collision follow the
    bullet and change the origin. Open the spr_bullet sprite and set the origin to:


