    \ object.\n- Step 6: Add a Different Room Action and set the following:\n  room_nlt_two\n\
    - Step 7: Place the obj_nlt_three object in the gap between the East Gates similar\
    \ to how we did for the First Oracle Room.\n- Step 8: Create a New Object and\
    \ name it obj_scroll_two.\n- Step 9: Set the sprite to spr_scroll_two.\n- Step\
    \ 10: Uncheck the Visible option.\n- Step 11: Add a Create Event.\n- Step 12:\
    \ Add a Set Alarm Action and set the following:\n- Step 13: Add an Alarm: 0 Event.\n\
    - Step 14: Add a Set Variable Action and set the following:\n- Step 15: Place\
    \ the scroll object in the top left of the room.\n  Number of steps: 90\n  In\
    \ alarm: 0\nVariable: visible\nValue: true\n\nThe player has been instructed to\
    \ solve the following riddle: \"What appears once in every minute, twice in every\
    \ moment, never in one thousand years?\" The answer to the riddle is the letter\
    \ M. When the player enters Level Two they will find that the entire floor is\
    \ made up of tiles that have M carved into them. Each tile has a separate letter.\
    \ If the player figured the riddle, they will see they have controlled their character\
    \ to walk only on the tiles with the letter M all the way to reach the treasure\
    \ chest. If this was the only obstacle in the room, the level would be too easy.\
    \ In order to make it more challenging, we will have blades of ice toward the\
    \ player so that they will need to move quickly or shoot quickly to destroy blades.\
    \ To create Level Two we will be using a tile set.\n\n## Using a Tile Set to Create\
    \ the Level Floor\n\n**Step 1:** Open the Background named_room_two.\n**Step 2:**\
    \ Check the Use as Tile Set box.\n**Step 3:** The tiles are now ready to be placed\
    \ throughout the room. Open room_level_two and select the Tiles tab and pick tile_level_two.\n\
    \n![](img/584600b080035f863f96e219491bffbd_252_0.png)\n\nStep 4: Place the tiles\
    \ in the level similar to Figure 8.13. This configuration will allow the player\
    \ to walk along the tiles with the letter M on them and move across the room without\
    \ walking on any tiles that have letters over them.\n\n## Adding a Kill Zone\n\
    \nIn game design terms a kill zone is any area that kills the player's character\
    \ instantly when the character enters the area. Kill zone objects are placed in\
    \ games where there are hazards such as fire or lava any other type of hazard\
    \ that would kill a player's character instantly. We will be creating a kill zone\
    \ and placing it on all of the tiles in Level Two that are not marked with the\
    \ letter M. If a player were to step on an incorrect tile, it would trigger the\
    \ player's defeat animation and the player would return to the previous room.\n\
    \n**Step 1**: Two sets of colliders are needed for this room in addition to the\
    \ next level trigger. Create a **New Object** and name it **obj_killzone**, assign\
    \ the sprite spr_killzone to it, **Uncheck** the **Visible** option.\n\n**Step\
    \ 2**: Open **obj_player_bronze** and add a **Collision** Event with the **obj_killzone**\
    \ object.\n\n**Step 3**: Add a **Change Instance** Action and set the following:\n\
    \nObject: player_defeat\nPerform events: yes\n\n![](img/584600b080035f863f96e219491bffbd_253_0.png)\n\
    \nStep 4: Reopen the **room_level_two** room and fit the **obj_killzone** objects\
    \ over all the tiles that do not have the letter **M** carved into them. You may\
    \ wish to use Figure 8.14 as a guide. If the player were to step on a tile that\
    \ does not have the letter **M** on it, the player character would go into player\
    \ defeat animation and the game would restart the room so the player would get\
    \ another chance to complete Level Two. If the player navigated the room correctly,\
    \ they would be able to pick up the contents of the treasure. We will now create\
    \ a trigger for when the player collides with the treasure.\n\n## Creating a Trigger\
    \ for the Treasure\n\n**Step 1:** Create a **New Object** named **obj_chest_trigger**\
    \ and set it to the **spr_collider** sprite.\n\n**Step 2:** Open the **obj_player_bronze**\
    \ object and add a **Collision** Event with the **obj_chest_trigger** object.\n\
    \n**Step 3:** Drag in a **Set Variable** Action and set the following:\n\n- Variable:\
    \ global.myCoins\nValue: 50\nRelative: checked\n\nThe value of 50 will add 50\
    \ coins to the player's coin inventory.\n\n**Step 4:** Add a **Set Sprite** Action\
    \ and set the following:\n\n- Object: obj_counter\nSprite: spr_counter\nSubimage:\
    \ 5\nSpeed: 0\n\nThis will display 50 coins in the HUD.\n\n**Step 5:** Drag in\
    \ a **Destroy Instance** Action below the **Set Variable** Action and check the\
    \ **Other** checkbox.\n\n## Activating the Next Level Trigger\n\nWhen the player\
    \ collides with the chest the Next Level Trigger needs to be activated.\n\n**Step\
    \ 1:** Create a **New Object** and name it **obj_nlt_four**.\n\n**Step 2:** Check\
    \ the **Solid** checkbox.\n"
