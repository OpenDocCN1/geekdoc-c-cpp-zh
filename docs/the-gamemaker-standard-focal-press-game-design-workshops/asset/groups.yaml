    # Coding the Playable Character’s Death


    When the dog collides with particular objects such as the ghosts, the dog will
    die and fall off the screen. We will produce this by creating a dead dog object.


    +   **Step 1:** Create a **New Object** named **obj_dog_dead** and set the sprite
    to **spr_dead**.

    **Step 2:** When the dog dies it will go into the dead state for 3 seconds before
    the game transitions to the Game Over Screen. An Alarm Event will need to be created
    for this.

    **Step 2:** Create an **Alarm 0** and a **Create** Event on the **obj_dog_dead**
    object.

    **Step 3:** In the **Create** Event add an **Execute Code** Action and type the
    following:


    ```

    alarm() = 180

    gravity = 0.5

    gravity_direction = 270

    speed= 8

    audio_play_sound(snd_yel, 10, false)

    ```


    This will trigger the **Alarm 0** Event in **3 seconds**, which equals **180 steps**,
    causing the object to bounce up in the air falling falling-screen. Look over this
    code again to see if you can now decipher the code you specifies.


    +   **Step 4:** Select the **Alarm 0** Event and add an **Execute Code** Action
    to it and type the following:


    ```

    /room_goto()

    ```


