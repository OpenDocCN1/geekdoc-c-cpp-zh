    # Setting the Objects to Spawn


    We now create an object that will spawn pumpkins and candy. For this we will be
    using two different Alarms. We will create an Alarm 0 which will be in charge
    of spawning the pumpkins that the player must destroy. We then create an Alarm
    1 which will be in charge of spawning the candy that the player will want to avoid
    touching so that it can be collected in their bag at the bottom of the screen.


    **Step 1:** Create a new object and name it obj_spawner.


    **Step 2:** Create three new events in the obj_spawner object. Add a Create Event,
    an Alarm 0 Event, and an Alarm 1 Event.


    **Step 3:** In the Create Event add a Set Alarm Action and set the following:


    - Number of steps: 1

    - In alarm no: Alarm 0


