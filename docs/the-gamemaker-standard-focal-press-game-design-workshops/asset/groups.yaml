    be bg_level_two, and the room_level_three background should be set to bg_level_three.


    Around the perimeter of each level are graphics that represent areas snails cannot
    go. At the moment these are simply graphics and a snail could easily move on top
    of them. We need to set up colliders so that the snails cannot leave the room,
