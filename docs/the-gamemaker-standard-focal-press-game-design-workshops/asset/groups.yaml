    **Step 7:** Release the Shift key and click on the bottom left corner of the game.
    This will place the grass tile into the level as shown in **Figure 23.**


    **Step 8:** Continue placing grass tiles until the bottom of the screen looks
    similar to **Figure 24.**


    Currently the grass tiles we placed in the game are not solid. We want our dog
    to be able to walk on the grass rather than in front of it or behind it. In order
    to make the grass solid we will need to place colliders on the grass. The object
    colliders will appear as red boxes. This helps us to know where we have placed
    colliders and where others are needed. We will eventually make these colliders
    invisible so they will not be seen during game play.


    ## Making Tiles into Objects


    **Step 1:** Click the **Objects** tab and make sure `obj_collider` is selected.

    **Step 2:** Place the object colliders along the grass similar to those shown
    in **Figure 3.25**. You can hold the Ctrl key and Shift while dragging to place
    multiple objects.


    ![](img/584600b080035f863f96e219491bffbd_95_0.png)


    **Step 3:** Delete the `obj_colliders` that are floating in the air. You can hold
    the Shift key and use the right mouse button while dragging to delete faster.


    If you play the game now you will notice that the red boxes are currently visible
    during game play. We will now make the collider invisible so that it appears the
    dog is walking on top of the grass.


    **Step 4:** Open `obj_collider`.

    **Step 5:** Uncheck the checkbox labeled **Visible.**


    Our dog is very happy to have a nice grassy to run along, however, our level is
    not very long so the dog cannot go far. We are going to increase the horizontal
    size of the level. If we were to play the game immediately after doing this, it
    would appear the dog is very small in comparison to the level since we would see
    the entire level at once. We will later change the way the camera works that the
    camera will follow the dog and the level will scroll to the right. This will allow
    us to create a large level while still allowing the dog to appear close on the
    screen.


    ![](img/584600b080035f863f96e219491bffbd_96_0.png)


    FIGURE 3.26


    ## Adjusting Level Dimensions


    **Step 1:** Open room_level_one.

    **Step 2:** Click the Settings tab.

    **Step 3:** Change the width to 4800.

    **Step 4:** Select the View tab.

    **Step 5:** Click **Enable the use of views** so it is checked. Set the view tab
    settings as follows:


    Visible when room starts: checked

    View in room:

    x:0 W: 1024

    y:0 H: 544

    Port on screen:

    x:0 W: 1024

    y:0 H: 544

    Object Following:

    Obj_dog

    Hbor: 512 Hsp: -1

    Vbor: 32 Vsp: -1


    ![](img/584600b080035f863f96e219491bffbd_97_0.png)


    FIGURE 3.27


    ![](img/584600b080035f863f96e219491bffbd_97_1.png)


    FIGURE 3.28


    Now when we run the game we can see that as the dog reaches the center of the
    screen, the camera, or viewpoint of the player, it will follow it. This allows
    the player to always see the playable character, in this case the dog, and the
    rest of the game objects scroll from right to left as the dog runs to the left.
    This is why this type of game is called a scroller. Now we need to populate our
    game with some obstacles for the dog to overcome.


    ## Incorporating Obstacles


    **Step 1:** Go back to the Tiles tab and fill out the rest of the level with grass.

    **Step 2:** Now let''s place some holes for the player to fall into. Under the
    Tiles tab, uncheck the **Delete Underlying** option.

    **Step 3:** Select the **Add** button below the **Current tile layer:** box.


    In order for the hole to show in front of the grass we will need to place it on
    a layer closer to the viewer. Items in GameMaker that have a higher number depth
    are located closer to the viewer and those with a lower number depth or a negative
    number depth are farther away. For example, if we wanted our dog to walk in front
    of a tree, we might have the tree set for a depth of zero and set the dog with
    the depth of five. If we reversed those numbers, the dog would appear to walk
    behind the tree.


    **Step 4:** Type **1000** into the box labeled **Depth** and hit OK.


