    to drag all the images into the GameMaker window. Set all the images as backgrounds
    and name them so they appear similar to **Figure 3.19.**


    **Step 2:** Open the *tile_level_one* background and click the block that reads
    **Use as tile**.


    **Step 3:** Click OK.


    **Step 4:** Open room *room_level_one*.


    **Step 5:** Click the Tiles tab at the top and click the word that reads *<undefined>*
    and select *tile_level_one*.


    **Step 6:** Click the top left corner of the grass section on the tile set, then
    hold down the Shift key on your keyboard and drag the mouse to the bottom right
    corner of the grass section to select it.


    ![](img/584600b080035f863f96e219491bffbd_91_0.png)


