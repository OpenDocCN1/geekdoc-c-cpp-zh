    ## Mapping Keys


    For this particular project we will stick with the keyboard. The player on the
    right side of the keyboard will use the W, A, S, and D keys. The player on the
    left side of the keyboard will use the W, A, S, and D keys. Certain keys are frequently
    used when mapping keys for games. An example of a key you would not want to use
    to fire in a game is the Shift key. Although the location of the Shift key is
    near the movement keys we mentioned, which would make it easy to reach, hitting
    the Shift key few times will activate the sticky key option which disrupt the
    game. The Right Shift key would be a poor choice if used as an accelerator for
    a racing game.


