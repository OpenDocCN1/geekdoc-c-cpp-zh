    **Step 1:** In the expanding menu on the left side of the window, locate and double-click
    on the **obj_scout** object. On the right side of the Object Properties window,
    choose **Main1** from the tab options.


    **Step 2:** In the Sprite submenu, select the **Change Sprite** icon, which looks
    like green Pac-Man, and drag it into the Actions area. Doing so opens the **Change
    Sprite** options box.


    **Step 3:** Make sure **Applies to** is set to **Self**. Then click the icon next
    to the sprite option to ensure the following sprite is selected: **spr_scout_strip3**.
    Since this is a strip of three different images, we need to identify a subimage.
    For the **<Down>** Event, enter 1 as the subimage. For the **<Up>** Event, enter
    0 as the subimage. Enter **0** as the Speed for both the **<Up>** and **<Down>**
    Events.


    ![](img/584600b080035f863f96e219491bffbd_29_0.png)


    From the tabs on the far right side of the Object Properties window, click the
    **Control**. From the **Other** submenu, locate the **Start of a Block** icon,
    which looks like a green triangle pointing upwards. Drag the **Start of a Block**
    icon into the Actions area and place it above the **Jump to position [0, 4]**
    Action to indicate that this is the start of a block of actions.


    **Step 5:** Drag the **End of a Block** icon, which looks like a green arrow pointing
    downward, underneath the **Change Sprite** Action to indicate that this is the
    end of the block of actions. Be sure to complete Steps 1 through 5 for both the
    **<Up>** and **<Down>**—Events.


    **Step 6:** Now we want to make sure the ideal image is only showing the ship
    instead of other images in the sprite. In the Object Properties window, click
    the **Add Event** button and choose **Create**. Then, on the far right side of
    the window, click the **Main** tab. In the **Sprite** submenu, click the **Change
    Sprite** Action and drag it into the Actions area.


    **Step 7:** In the **Change Sprite** dialogue box, ensure that **Applies to:**
    is set to **Self**, then set the following:


    - Sprite: spr_scout_strip3

    - Subimage: 2

    - Speed: 0


    This will start the ship in the idle graph.


    ## Release Events


    To make sure that the ship returns to the idle state after the up or down keys
    are pressed, we need to create events to trigger the image to return to idle.


    **Step 1:** With the Object Properties window for the obj_scout ship open, click
    the Add button.


    **Step 2:** Add a Key Release <Up> and a Key Release <Down> Event.


    **Step 3:** For each of the release events, click the Main1 tab and drag the Change
    Sprite into the Actions area.


    **Step 4:** In the Change Sprite dialogue box, ensure that Applies to: is set
    to Self and set the following:


    - Sprite: spr_scout_strip3

    - Subimage: 2

    - Speed: 0


    Be sure to complete Steps 3 and 4 above for both the Release <Up> and Release
    <Down> Events.


    Actions:

    | | | |

    |---|---|---|

    | 1 | Start of a block | |

    | 2 | Jump to position (0,-4) | |

    | 3 | Change sprite into spr_scout_strip3 | |

    | 4 | End of a block | |


