    # THE GAMEMAKER STANDARD


    DAVID C. VINCIGUERRA & ANDREW HOWELL


    FOCAL PRESS GAME DESIGN WORKSHOPS


    # The GameMaker Standard


    The GameMaker Standard is the hands-on resource for creating games using the GameMaker
    engine. With step-by-step directions and numerous visual examples, this book teaches
    readers the fundamental skills and efficient procedures to help them begin creating
    their own games, while also offering more advanced options for seasoned game development
    readers who are expanding to the GameMaker format. Each chapter contains a tutorial
    on creating a game in a specific game genre, giving readers detailed and accurate
    guides to follow during their own game creation. Further features of this book
    include:


    -   Tools and methods to create a variety of games, including multi-level, two
    player, and RPGs

    - Coverage of user interface options and GML code

    - How to create a 2.5D game, and how these differ from 2D and 3D

    - Pixel art creation techniques

    - Industry tips and recommendations for exporting and selling personally created
    games


    David C. Vinciguerra is the instructor for the Simulation and Game Development
    degree at Wayne Community College. Prior to his current position he served as
    Co-Director of the Virtual Reality and Education Laboratory and Co-Editor for
    the internationally peer-reviewed journal VR in Schools while teaching graduate
    and undergraduate virtual reality courses at East Carolina University. David lives
    in Pikeville, North Carolina, with his wife, Jennifer, and Natalie.


    Andrew Howell developed a love for game programming while working toward his Simulation
    and Game Development degree. He has developed multiple games using the GameMaker
    and the Unity3D game engines. During his time working in the Simulation Development
    Laboratory at Wayne Community College, he found teaching his skills to others
    enjoyable. Andrew enjoys learning new development techniques and currently resides
    in Goldsboro, North Carolina.


