    virus objects while at the same time avoiding the healthy cells. To reinforce
    this objective the game will have a health bar at the top to gauge how successful
    the player is at avoiding healthy cells and destroying viruses. The health of
    the individual player is attempting to save go when a virus gets past the ship.
    The visual representation of this will be the health bar at the top of the screen
    consisting of two colors. The green color will increase and the red color will
    decrease when a virus is destroyed. The player will want to increase the green
    portion of the bar by destroying viruses until the red portion of the bar is completely
    gone. However, each time the player lets a virus leave the screen or if the player
    accidentally destroys a healthy blood cell, the green portion of the bar will
    decrease while the red will increase, indicating that the health of the person
    being saved is gone. If the green portion of the bar is completely eliminated
    the player loses the game. If the red portion of the bar is completely eliminated
    the player will win the game. There will be times which a player will have to
    destroy a healthy cell in order to destroy multiple viruses. This strategy carries
    a temporary setback for a larger gain in the future.


