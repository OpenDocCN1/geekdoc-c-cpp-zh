    Step 2: Create Group from the options.


    Step 3: Name the group: Yellow Snail.


    Step 4: Repeat Steps 1–3 under the Creating Groups heading, but by this time the
    group: Purple Snail.


    Step 5: Drag the four snail images: spr_yellow_down, spr_yellow_left, spr_yellow_right,
    and spr_yellow_up into the Yellow Snail folder.


    Step 6: Do this for the Purple Snail images and place them in the Purple Snail
    folder.


    # Mapping Keys


    For this particular project the game will be played using one keyboard that both
    players will share. Developers can later map the keys to two separate USB game
    controllers, but for this particular project we will be sticking with just the
    keyboard. The player on the right side of the keyboard will use the arrow keys
    to control their player. The player on the left side of the keyboard will use
    the W, A, S, and D keys to control their player. Certain keys are frequently used
    when mapping keys to control games. The arrow keys are common as the W, A, S,
    and D keys. The Space bar is frequently used for keystrokes such as shooting and
    the number keys such as 1, 2, and 3 are typically used to activate different menus
    in a game. Other keys should not be used for some actions because the keys may
    have different functions when held for several seconds or tapped multiple times.
    An example of a key that you would not want to use to fire weapons in a game is
    the Shift key. Although the location of the Shift key is near of the movement
    keys we mentioned earlier, which would make it easy to reach, hitting the Shift
    key few times in a row will activate the sticky key option which disrupt the game.
    The Right Shift key would be a poor choice if used as an accelerator for a car
    racing game holding down the Right Shift key for eight seconds activates filters.
    When choosing to map keys for a game that may be outside of what games typically
    use, be sure to test your games using those keys to ensure that they do not have
    any other hidden functions you did not know.


