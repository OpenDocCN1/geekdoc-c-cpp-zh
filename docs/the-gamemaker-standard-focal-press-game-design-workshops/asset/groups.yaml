    ## Creating the Contrail


    We have the snail, now we need the trail. Each snail is going to leave a colored
    trail behind them. Not only the opponent not cross this trail, but the player
    cannot cross over their own trail without being destroyed. The yellow snail will
    create a yellow trail on the screen and the purple snail will leave a purple trail
    on the screen. The yellow snail cannot collide with either of these trails and
    neither can the purple snail.


    **Step 1:** Close the room options and create a **New Object** called **obj_yellow_trail**.


    **Step 2:** Set the Sprite to **spr_yellow_trail** object.


    **Step 3:** Click OK and open the **obj_yellow_snail** object.


    **Step 4:** Create an **Alarm, Alarm 0** Event.


    **Step 5:** Add a **Create Instance** to the Alarm Event and set the following:


    Object: obj_yellow_trail

    x: 0

    y: 0

    Relative: checked


    **Step 6:** Under the **Main2** tab, drag a **Set Alarm** Action below the **Create
    Instance Action** and set the following:


    Number of steps: 2

    Alarm no: Alarm 0


    **Step 7:** Click the **Create** Event, add a **Set Alarm**, and set the following:


    Number of steps: 1

    Alarm no: Alarm 0


    If you were to run the game now you would notice that the yellow trail is off
    to the left side of the snail. We will now center the trail so that it is created
    from the center of the snail.


    **Step 8:** Open **spr_yellow_trail** and click the **Center** button, then select
    **OK.**


    **Step 9:** You will now want to open the four yellow snail sprites and do the
    same.


    When you run the game now you will see a trail following from the center of the
    snail. The trail is actually a series of yellow circles that are created quickly
    and placed on top of each other that it gives the illusion that there is a solid
    trail following the snail rather than a series of yellow circles.


    ## Creating the Right Side Player Character


    If we were creating a single player game we now have finished setting up our player
    character. *Snail Trail* is a two player game so we need to set up our player
    character. This is an opportunity to practice what you have learned thus far in
    the chapter with the creation of the snail. You will be completing the same steps
    to create the snail, but making changes appropriate so that the snail is purple,
    starts from the right side of the screen moving towards the left, a purple trail
    that is centered, and moves correctly when the player presses different arrow
    keys.


    Now you should have a yellow and a purple snail in the game that move and leave
    a trail behind them. If we played the game now it would look more like two player
    cooperative drawing game than a competitive to-the-death race. Time to make the
    trails lethal.


    ## Setting Colliders on the Snails


    You may have been wondering why we have separate sprites for each snail instead
    of using subimages. This is so we can use separate colliders for each direction
    the snail is facing. The colliders will be located on the snails'' head, this
    way the snails will not die immediately after spawn. If the collider was not the
    snail''s head and instead on its whole body, as soon as the trail started to form
    it would destroy the snail because the trail would be touching the back of the
    snail.


    - **Step 1:** Open spr_yellow_right and click the Modify Mask option.

    **Step 2:** Check the magnifying glass icon with the + to zoom in a bit.

    **Step 3:** Check the manual box.

    **Step 4:** Check and drag the mouse over the snail''s head so it looks similar
    to Figure 4.3.


    - **Step 5:** The dark-colored box is the snail''s right; if this comes in contact
    with any of the trail it will destroy the snail and the player will lose that
    round.

    **Step 6:** Select the OK button and repeat the process for all the yellow and
    purple snail images. The results should look similar to Figures 4.4 and 4.5.


    ![](img/584600b080035f863f96e219491bdbd_127_0.png)

    FIGURE 4.3


