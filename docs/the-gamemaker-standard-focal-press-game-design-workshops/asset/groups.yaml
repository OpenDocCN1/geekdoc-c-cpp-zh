    the following:


    Number of steps: 1

    In alarm no: Alarm (3 for obj_yellow_snail, 2 for obj_purple_snail)


    Step 8: Now we will set up the Collision Event with the obj_collider. For both
    objects create a new Collision Event with the obj_collider.


    Step 9: For both objects drag a Set Alarm Action in and set the following:


    Number of steps: 1

    In alarm no: Alarm (3 for obj_yellow_snail, 2 for obj_purple_snail)


