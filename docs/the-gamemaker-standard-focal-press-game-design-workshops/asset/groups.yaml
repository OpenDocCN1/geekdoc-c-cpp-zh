  - '[PAGE 234]


    When the player enters the West Gate, the **Boss Level** will load. In the **Boss
    Level** they will see a **Totem Pole** which represents the **Boss** for this
    game. Some games have what are called mini-bosses at the end of each level and
    a **Final Boss** at the end of the game. The Totem Pole would be the **Boss**
    for this game since we do not have any additional levels. If the game had many
    **mini-bosses** and at the end of the game there would be a powerful **Final Boss**.
    The **Totem Pole** contains multiple heads that shoot fire and ice. The player
    will need to use the obstacles in the room to hide from the fire and ice projectiles.
    They will use their new dagger which is more powerful than the original dagger
    to destroy each of the totem heads individually. When all of the heads are destroyed,
    a gem will appear. When the player picks up the gem, a new **Dialog Box** will
    appear telling the they they completed the game. This will then load the screen
    after a few seconds.


    # # Preparing the Remaining Rooms


    +   **Step 1:** Create five Rooms and name them: *room_title, room_level_one,
    room_level_two, room_shop, room_finalboss.*\n**Step 2:** Set the **Width to 800**
    and **Height to 600** for all the rooms.


