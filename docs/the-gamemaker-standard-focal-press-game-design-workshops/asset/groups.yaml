    \n精灵：spr_idle_down\n子图像：0\n速度：0\n\n## 创建碰撞对象\n\n第 1 步：创建一个名为 `obj_collider` 的新对象。\n\
    \n第 2 步：将精灵设置为 `spr_collider`。\n第 3 步：勾选实体（Solid）选项。\n第 4 步：取消勾选可见（Visible）选项。\n\
    \n## 设置房间\n\n神谕室（Oracle Room）是玩家首次出现并接收神谕指令的房间，神谕由中心带有一个门的池子表示。我们将创建此房间的多个版本，营造出一种错觉：玩家每次返回房间时，房间都是同一个，但神谕说的话不同，并且有一扇新门打开了。实际上，玩家将进入一个与原始房间看起来相同的新房间，只是这次背景有一个不同的门，对话框的内容也不同。玩家每次返回神谕室时，我们准备一个不同的神谕室。玩家将返回神谕室三次；因此我们最终会有四个不同的神谕室\
