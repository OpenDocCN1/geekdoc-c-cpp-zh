  - '[PAGE 281]


    # Glossary


    **Ouya**—Android-based console.

    **Parent**—Object used to control a series of other objects.

    **Persistent Object**—An object that remains no matter what level player is currently
    on.

    **Pick-Up**—In-game item the player can pick up and carry.

    **Pixel Art**—Style of art in which images are created by drawing individual pixels.

    **Player**—The person playing a game.

    **Player Character**—The in-game character player is controlling.

    **Pop-Up box**—A box that appears with information and can contain selectable
    options.

    **Power Up**—In-game object that can be picked up by the player to enhance their
    ability.

    **Puzzle Elements**—In-game riddles that players must move to solve in a game.

    **Relative**—Relating to the position of the player character.

    **Room**—Title screens and game levels in a game represented by different rooms.

    **RPG**—Role Playing Game.

    **Score Counter**—Visual representation of the player''s score in a game.

    **Script**—Code that tells a particular object or game element what behaviors
    to perform.

    **Shoot ''Em**—Game in which players shoot other objects as the primary mission.

    **Shop**—An in-game store where the playable character can buy in-game items using
    coins found in the game.

    **Side-Scaler**—Game in which the player moves sideways across the screen. Typically,
    the game camera follows the player so the character stays in the same position
    to create the illusion of running through the environment.

    **Snap X,**—Maker option that allows designers to move items on the game grid.

    **Sound Effect**—Audio file plays in the game to present an event.

    **Spawn**—When a new object appears in a game.

    **Speed**—How many steps it takes for an action to complete in a game.

    **Splash Screen**—Sometimes referred to as the title screen of a game. The splash
    screen is the first screen player sees when they run a game.

    **Sprite**—Graphical representation of a game object.

    **Sprite Depth**—How close a sprite is to the player in the depth of in-game objects.
    By changing the sprite depth, characters can appear in front of or behind other
    objects.

    **Sprite Area**—Area in GameMaker which designers can customize their sprites
    using basic drawing tools.

    **Sprite Strip**—A series of sprite images that each appear slightly different
    to give the illusion of movement played in succession.

    **Start of a Block**—GameMaker icon signifies the beginning of a series of actions.

    **Steam**—Online retailer and game community base.

    **Subfolder**—A folder inside another folder.

    **Submenu**—A menu inside another menu.

    **Switch States**—Changing the visual state of a game object to something different.

    **Target Audience**—Group of people a game is designed for.

    **Tile**—A single graphic from part of a tile set that can be dragged onto the
    canvas.

    **Tile Set**—Set of graphics that can be dragged onto the canvas.

    **Title Screen**—The first screen a player sees allows the player to start or
    end the game.


