    +   **Step 1:** Create a **New Room** named **room_oracle_one**.

    **Step 2:** Change the **Width to 800** and the **Height to 600**.

    **Step 3:** Set the **Background** to **bg_oracle_one**.

    **Step 4:** Place the **Player Object** anywhere in the room.

    **Step 5:** Place **Colliders** along the walls similar to those shown in **Figure
