    ## Testing the Final Game


    Snail Trail is two player competitive game in which two players play against each
    other with the goal of winning two out of three rounds. In order to test this
    game you will want to find another player to play against. Rather than playing
    the game from the GameMaker program you can export your game as a stand-alone
    executable by clicking on File, then Create Executable. Drop down below File Name
    should be set to Single runtime executable (*exe). This will allow you to play
    your game on another computer, even if that computer does not have GameMaker installed.
    Test to make sure each player can control their own snail and that each snail
    is in a continuous state of movement. Make sure that when each snail collides
    with a solid object the snail is destroyed. This should also include if the snail
    turns back upon its own and if the two snails collide with another. You and the
    other player should practice using the snail controls to trap one another and
    that the game scores the winner is appropriately. If all those controls are working
    properly, then you will want to test that the picked-up items are working as they
    are designed to. If one player wins two out of three matches, the game should
    then go to the winner screen. Once you have tested the game with a friend and
    everything appears to be working correctly have two more players that have not
    played the game play against each other while you observe. This can sometimes
    reveal bugs that you would not have found on your own because different players
    may try things in a game that you never would have thought of trying.


