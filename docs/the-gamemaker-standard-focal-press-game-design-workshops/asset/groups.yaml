    # Creating the Collider Object


    Step 1: Create a New Object named obj_collider.


    Step 2: Set the sprite to spr_collider.


    Step 3: Check the Solid option.


    Step 4: Uncheck the Visible option.


    # Setting Up the First Oracle Room


    The Oracle Room is the room in which the player first appears and receives instructions
    from the Oracle, which is represented by a pool of water with a giant eye in the
    center of the pool. We will be creating multiple versions of this room to create
    the illusion that each time the player returns to the room it is the same room
    but the oracle is saying something different and a new gate is open. In actuality
    the player will be entering a new room that looks identical to the original room,
    except this time the background image has a different gate open and the dialog
    box says something different. We will have a different Oracle Room for each time
    the player appears to return to the Oracle Room. The player will return to the
    Oracle Room three times; therefore, we will eventually have four different Oracle
    Rooms, the original and


    ![](img/584600b080035f863f96e219491bffbd_231_0.png)


