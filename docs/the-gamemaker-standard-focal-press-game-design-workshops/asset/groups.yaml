    FIGURE 4.5


    ## Creating a Parent Object


    With the colliders in place we will set up a parent so we do not need to make
    collision events for both.


    **Step 1:** Create a New Object named **obj_trail** with no sprite.

    **Step 2:** Open both **obj_yellow_trail** and **obj_purple_trail** and set the
    parent option of each to **obj_trail** as shown in Figure 4.


    Now we will be able to set up one collision for both trails.


    **Step 3:** Open both of the snail objects and add a **Collision** Event to each
    with **obj_trail**.

    **Step 4:** Add a Destroy Instance to the collision events.


    ## Testing the Snail Trails


    Test your game and watch to see when a snail collides with a trail, that snail
    is destroyed. If a snail is destroyed without hitting a trail, you will want to
    go back and check the collision mask to be sure the images are centered.


    ![](img/584600b080035f863f96e219491bdbd_129_0.png)


    ## Adding Pick-Up Items


    The game as it currently stands is pretty challenging but we want to add some
    elements that will add a bit of strategy to the gameplay. We will now add two
    different items that the players can pick up. These items will be in the form
    of different colored mushrooms. If a player picks up a red mushroom they will
    be able to freeze their snail invulnerable for a limited time. This will allow
    player to move their snail over trails without being harmed. This type of pick-up
    item is different than the power-ups we were activated in the Scout game because
    in Snail Trail the player can freeze the other immediately after the player getting
    them. This option becomes more relevant when it comes to the second pick-up item,
    which is a blue mushroom. The blue mushroom allows the player that it picked up
    to freeze the other character when the blue mushroom is activated. When used strategically,
    the player could pick the mushroom and save it until they are near the other player.
    Then they can freeze the other player and move in front of them that when the
    other player starts moving they have no choice but to collide with the other player''s
    trail. To make the decision process on to use the pick-up item more challenging,
    each player can only hold one item at a time. So if a player picks up a red mushroom
    and picks up a blue mushroom without using the red one, they will lose the red
    mushroom.


