- md: "\n![](img/584600b080035f863f96e219491bffbd_183_0.png)\n\n## Animating the Ship\n\
    \nOur ship is going to stay at the bottom center of the screen as the perspective\
    \ is focused on the camera. The ship will appear to bank left and right by switching\
    \ states. As the ship does, the entire game environment will rotate. This provides\
    \ the player with an interesting vantage point. They can see the world around\
    \ spinning while they are sitting still, when it is actually the ship that is\
    \ moving. Since the camera perspective is following the ship, when the player\
    \ uses the arrow keys to move, it appears as if the environment is turning rather\
    \ than the ship.\n\n**Step 1:** Open the `obj_ship` object. We will change the\
    \ ship so it appears to tilt left and right when the keys are pressed. Since the\
    \ ship is not an actual 3D model, but rather flat 2D image, we will be replacing\
    \ the ship with different images when the player presses the left and right keys.\
    \ This will make it appear as if the ship is a 3D object and is pivoting left\
    \ and right.\n\n**Step 2:** Add a **Key Press: Left** Event and **Key Press: Right**\
    \ Event. In the `<Press Left>` Event add a `Change Sprite` Action and set the\
    \ following:\n\n- Sprite: spr_ship_left\n- Subimage: 0\n- Speed: 1\n\n**Step 3:**\
    \ In the `<Press Right>` Event add a Change Sprite Action and set the following:\n\
    \nSprite: spr_ship_right\nSubimage: 0\nSpeed: 1\n\n**Step 4:** In order for this\
    \ to work we also need the ship to switch back to an idle animation when no keys\
    \ are pressed. Create a Key Release: Right Event and a Key Release: Left Event.\n\
    \n**Step 5:** In the Key Release<Right> Event add a Test Expression Action and\
    \ set the following:\n\nExpression: keyboard_check(vk_left) || keyboard_check(vk_right)\n\
    Not: checked\n\nThis will make sure the left and right arrows are not being held\
    \ down.\n\n**Step 6:** Drag in a Start of a Block below the Key Release<Right>\
    \ Event, then drag in a Change Sprite and set the following:\n\nSprite: spr_ship_idle\n\
    Subimage: 0\nSpeed: 1\n\n**Step 7:** Drag in an End of a Block.\n\n**Step 8:**\
    \ Repeat Steps 6 and 7 for the Release<Left> Event.\n\n![](img/584600b080035f863f96e219491bffbd_184_0.png)\n\
    \nFIGURE 6.6\n\n![](img/584600b080035f863f96e219491bffbd_185_0.png)\n\nAt this\
    \ point when the right button is pressed to make sure the ship animates properly\
    \ appear that the ship is banking toward the right and when the left button is\
    \ pressed the ship should appear as if it is banking toward the left. If no buttons\
    \ are pressed, the ship should appear as if it is flying straight.\n\n## Moving\
    \ Objects Toward the Player\n\nEarlier in the chapter we discussed how objects\
    \ that are farther away higher in the horizon, less defined, and smaller objects\
    \ closer to us. We are going to use this information to train the brain of the\
    \ player's into thinking that there are actual 3D models moving toward the player's\
    \ ship. We will do this by putting in graphics that are designed to show an object\
    \ starting with little detail and gaining detail and size while moving downward\
    \ on the horizon. This will make the object appear as if we also have these objects\
    \ constantly switches so that the flat 2D sprites appear as if they are 3D models.\n\
    \n- **Step 1:** Open the **spr_blood** sprite and in the **Origin** section set\
    \ **x** to **100** and **y** to **0**.\n- **Step 2:** Click the **Modify Mask**\
    \ option.\n- **Step 3:** Check the **Precise** option.\n\n![](img/584600b080035f863f96e219491bffbd_186_0.png)\n\
    \nStep 4: Repeat Steps 1 through 3 for the spr_virus sprite. This ensures that\
    \ the collider is always on the visible image as it moves towards the edge of\
    \ the screen. By doing this we can destroy any of these objects no matter how\
    \ close or far away they are from the center of the screen and it will appear\
    \ as the visible version of the object rather than where the object was a moment\
    \ ago or where it will be in a few seconds. We also set the center point to the\
    \ top in the middle of the image.\n\n## Spawning Objects\n\nIn order for the blood\
    \ cells and viruses to appear, a new object will need to be created that will\
    \ spawn the objects. This object will be responsible for spawning the blood cells\
    \ and viruses. The object will spawn either a virus or blood cell at random so\
    \ that the player will not know which type of object will be appearing next. The\
    \ human brain is quite remarkable and if we set a particular pattern of spawning\
    \ many players would be able to figure it out and predict which type of object\
    \ will appear next. Keeping the objects random keeps the game interesting and\
    \ unpredictable.\n\n**Step 1:** Create a new object named obj_spawner. This object\
    \ will not have a sprite attached to it.\n\n**Step 2:** Add a **Create** Event\
    \ and an **Alarm: Alarm 0** Event to the obj_spawner.\n\n**Step 3:** In the Key\
    \ Release<Right> Event add a Test Expression Action and set the following:\n\n\
    Expression: keyboard_check(vk_left) || keyboard_check(vk_right)\nNot: checked\n\
    \nThis will make sure the left and right arrows are not being held down.\n\n**Step\
