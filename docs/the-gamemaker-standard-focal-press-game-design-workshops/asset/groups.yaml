    \ Set the sprite to **spr_player_defeat.**\n\n**Step 4:** Add a **Create** Event.\n\
    \n**Step 5:** Add a **Sprite** Action and set the following:\n\nSprite: spr_player_defeat\n\
    Subimage: 0\nSpeed: 0.5\n\n**Step 6:** Add a **Play Sound** Action and set the\
    \ following:\n\nSound: snd_death\nLoop: false\n\n**Step 7:** Add an **Other: Animation\
    \ End** Action to it.\n\n**Step 8:** Add a **Start Room** Action.\n\n**Step 9:**\
    \ Open the **obj_player_default** and **obj_player_bronze** objects and add a\
