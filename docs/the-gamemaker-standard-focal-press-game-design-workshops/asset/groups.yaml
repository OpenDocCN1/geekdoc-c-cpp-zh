    | room_oracle_four | bg_oracle_four |


    # Game Progression and Room Hierarchy


    The progression of the *Keeper of the Oracle* game appears as follows:


    **Title Screen** > **Oracle One** > **Level One** > **Oracle Two** > **Level Two**
