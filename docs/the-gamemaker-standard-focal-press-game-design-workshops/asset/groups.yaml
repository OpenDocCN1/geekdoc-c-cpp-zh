    ## 像素艺术 (Pixel Art)


    学习目标——完成本章后，读者将能够：

    - 创建像素艺术精灵并将其导入到游戏中

    - 设置与实际区域不同的房间区域

    - 创建多个对象的同步生成

    - 使用随机数在设定范围内创建随机变量

    - 使用鼠标：左键事件使游戏可触摸

    - 在设定时间内自动移除游戏对象


    ## 项目概述：Candy Catch


    Candy Catch 游戏的目标非常简单。玩家将尽可能收集糖果，同时压碎蜗牛。蜗牛会随机产生从屏幕顶部移动到屏幕。这样做会导致玩家失去分数。每当蜗牛到达底部时，玩家将失去一条生命。在创建此游戏后，我们将用像素艺术替换蜗牛和糖果的图形。


    ### 精灵 (Sprites)

    - spr_eyes

    - spr_candy_five

    - spr_candy_four

    - spr_candy_one

    - spr_candy_three

    - spr_candy_two

    - spr_splat

    - spr_pumpkin_one

    - spr_collider


    ### 声音 (Sounds)

    - snd_music

    - snd_splat


    ### 背景 (Backgrounds)

    - bg_catground

    - bg_end

    - bg_title


    ![](img/584600b080035f863f96e219491bffbd_158_0.png)


    访问 www.thegamemakerstandard.com/candycatch 下载 Candy Catch Game Asset 压缩包。下载文件夹后，仔细阅读
    updates.document，该文件包含了自出版以来的任何更改。


