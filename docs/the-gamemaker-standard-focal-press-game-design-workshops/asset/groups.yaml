    ## 飞船动画


    由于视角聚焦在相机上，我们的飞船将保持在屏幕底部中央。飞船将通过切换状态看起来向左向右倾斜。当飞船移动时，整个游戏环境都会旋转。这为玩家提供了一个有趣的视角。当他们静止不动时，可以看到周围的世界在旋转，而实际上移动的是飞船。由于相机视角一直跟随飞船，当玩家使用方向键移动时，看起来是环境在转，而不是飞船。


    **步骤 1：** 打开 `obj_ship` 对象。我们将更改飞船，使其在按下按键时看起来向左向右倾斜。由于飞船不是真正的 3D 模型，而是扁平的 2D
    图像，当玩家按下左、右键时我们将用不同的图像替换飞船。这将使飞船看起来像是一个 3D 对象并正在左右转动。


    **步骤 2：** 添加一个 **Key Press: Left**（按键：左）事件和一个 **Key Press: Right**（按键：右）事件。在 `<Press
    Left>` 事件中添加一个 `Change Sprite`（更改精灵）动作并设置以下内容：


    - Sprite: spr_ship_left

    - Subimage: 0

    - Speed: 1


    **步骤 3：** 在 `<Press Right>` 事件中添加一个 Change Sprite 动作并设置以下内容：


    Sprite: spr_ship_right

    Subimage: 0

    Speed: 1


    **步骤 4：** 为了让此操作生效，我们还需要飞船在没有按下按键时切换回空闲动画。创建一个 **Key Release: Right**（按键释放：右）事件和一个
    **Key Release: Left**（按键释放：左）事件。


    **步骤 5：** 在 `Key Release<Right>` 事件中添加一个 Test Expression（测试表达式）动作并设置以下内容：


    Expression: keyboard_check(vk_left) || keyboard_check(vk_right)

    Not: checked


    这将确保左方向键和右方向键没有被按住状态。


    **步骤 6：** 在 Key Release<Right> 事件下方拖入一个 Start of a Block（块开始），然后拖入一个 Change Sprite
    并设置以下内容：


    Sprite: spr_ship_idle

    Subimage: 0

    Speed: 1


    **步骤 7：** 拖入一个 End of a Block（块结束）。


    **步骤 8：** 对 Release<Left> 事件重复步骤 6 和 7。


