    \ keyboard_check(vk_right) {\n    if place_free(x + 4, y) {\n        x += 4;\n\
    \        image_scale = 1;\n    }\n}\n```\n\n![](img/584600b080035f863f96e219491bffbd_203_0.png)\n\
    \n## Game Maker Language (GML)\n\nLearning Objectives—Upon completion of Chapter\
    \ 7 readers will be able to:\n- Define GML and how it can be used\n- Write scripts\
    \ using GML\n- Identify commonly used variables\n- Use GML to change object\n\n\
    ## Project Overview: Redesigning Lost Dog Using GML\n\nIn Chapter 3 we created\
    \ a side-scroller game using the drag-and-drop features. In this chapter we will\
    \ create the game again, but this time using GML to replace many of the steps\
    \ we add each code segment to the game. First we will want to download the Lost\
    \ Dog asset files from www.thegamemakerstandard.com/LostDogGML. After downloading\
    \ the assets folder read the updates.pdf document contains any changes since the\
    \ publication of this book.\n\n## Creating a New Project and Importing Assets\n\
    \nStep 1: Create a new project and name it lostdogGML\nStep 2: Import the assets\
    \ from the **LostDogGML** asset folder.\nStep 3: Rename the assets so they appear\
    \ similar to **Figure 7.1.**\n\n![](img/584600b080035f863f96e219491bffbd_204_0.png)\n\
    \nFIGURE 7.1\n\n## Setting Up the Player’s Collision Box\n\nThe player will control\
    \ a dog in this game by using the keyboard to move back and forth and avoiding\
    \ obstacles. Our dog will need to jump on top of objects without falling through\
    \ them; therefore, our dog must be solid so it can collide with other solid objects.\n\
    \nStep 1: Open the **spr_dog_id, spr_dog_running**, and **spr_dog_jumping** sprites.\n\
    Step 2: In each of these sprites click the **Modify Mask** box.\nStep 3: Click\
    \ the **Manual** option and enter the following for each of the sprites:\n\nLeft:\
    \ 15\nTop: 20\nRight: 64\nBottom: 55\n\nStep 4: Press the **Center** option for\
    \ all the dog sprites including **spr_dead** and then close the sprites.\n\n![](img/584600b080035f863f96e219491bffbd_205_0.png)\n\
    \nFigure 7.2\n"
  mdcn: '

    第 14 步：添加“设置变量”（Set Variable）动作并设置以下内容：


    应用于：obj_health

    变量：image_xscale

    值：0.05

    相对：已勾选


    ## 射击子弹


    抗病毒射线现在准备好释放给病毒了。现在时候设置飞船让它可以发射它们了。


    第 1 ：打开 obj_ship 对象并添加一个“按下按下：空格”（Key Press: Space）事件。


    第 2 ：添加一个“创建实例”（Create Instance）并设置以下内容：


    对象：obj_bullet

    x: 360

    y: 360


    第 3 ：在创建实例下方添加一个“播放声音”（Play Sound）并设置以下内容：


    声音：snd_bullet

    循环：否


    测试游戏以确保子弹击中健康细胞时健康条会减少，在击中病毒时健康条会增加。同时，确保移动飞船以检查子弹是否如预期那样在环境中旋转。


    ## 添加准星


    尽管游戏看起来已经像是一个 3D 游戏，但玩家可能仍然认为他们可以射向屏幕顶部的物体，而不是从游戏中心出来的物体。我们现在将使用另一个简单的技巧，通过在屏幕中心放置准星图形，来强化这是一个
    3D 游戏的印象。这会提醒玩家，子弹是背离玩家向屏幕中心移动的，而不是像典型的 2D 游戏那样向上屏幕顶部移动。


    第 1 ：打开 spr_crosshair 精灵图并点击“中心”（Center）按钮，然后点击该精灵图。


    第 2 ：创建一个新对象并将其命名为 obj_crosshairs。


    第 3 ：打开 room_gameplay 关卡，并将 obj_crosshairs 放置在房间的任何位置。再次，尝试将它们精确地放在房间正中心会非常乏味，让游戏自动帮我们处理要简单得多。


    第 4 ：打开 obj_crosshairs 对象并添加一个“创建事件”（Create Event）。


    第 5 ：添加一个“跳转到位置”（Jump to Position）动作并设置以下内容：


    x: 360

    y: 360


    ## 创建标题界面


    游戏玩法现在已完成，现在可以添加标题界面、胜利界面和失败界面了。


    - 第 1 ：创建三个新房间并将其命名为 room_title、room_loss 和 room_win。

    - 第 2 ：为 room_title 房间将背景设置为 bg_title。为 room_win 房间将背景设置为 bg_win。为 room_loss 房间将背景设置为
    bg_loss。

    - 第 3 ：暂时关闭这些房间，因为我们需要创建允许玩家开始或退出游戏的导航按钮。

    - 第 4 ：创建两个新对象并将其命名为 obj_play 和 obj_quit。

    - 第 5 ：将两个对象的精灵图都设置为 spr_collider。

    - 第 6 ：在 obj_play 中添加一个“鼠标：左键点击”（Mouse: Left Button Event）事件，然后拖入一个“不同房间”（Different
    Room）动作并设置以下内容：


    房间：room_gameplay

    - 第 7 ：打开 obj_quit 对象并添加一个“鼠标：左键点击”，然后拖入一个“结束游戏”（End Game）动作。

    - 第 8 ：打开三个屏幕房间，并使用“缩放”（Scale）将按钮放置在图形上方。最终结果与图 6.19 类似。

    - 第 9 ：在房间文件夹中安排房间，我们之前在 obj_health 对象中放置了一个占位符。现在我们的胜利和失败房间已经完成，我们可以用正确的房间替换占位符。打开
    obj_health 并选择事件。

    - 第 11 ：打开第一个“不同房间”动作并设置以下内容：


    房间：room_win

    - 第 12 ：打开第二个“不同房间”动作并设置以下内容：


    房间：room_loss


    ## GAMEMAKER 标准


    ![](img/584600b080035f863f96e219491bffbd_200_0.png)


    图 6.18


    ![](img/584600b080035f863f96e219491bffbd_200_1.png)


    图 6.19


    ![](img/584600b080035f863f96e219491bffbd_201_0.png)


    图 6.20


    ![](img/584600b080035f863f96e219491bffbd_201_1.png)


    图 6.21


    ## 添加背景音乐


    第 1 ：创建一个名为 obj_music 的新对象并勾选“持久性”（Persistent）选项。

    第 2 ：添加一个“其他：游戏开始”（Other: Game Start）事件并添加一个“播放声音”动作并设置以下内容：


    声音：snd_music

    循环：真


    ## 测试血管游戏


    我们希望到现在你已经注意到了游戏标题中的双关语。这个游戏是关于一个在血液中旅行的血管。当你测试游戏时，它看起来就像是飞船能够避开血细胞。然而，飞船并没有移动，而是停留在原位，而是整个环境在移动。通过了解眼睛如何观察空间中的物体并识别哪些物体更近或更远，我们能够欺骗玩家认为三维物体正在向他们移动，而实际上他们运行的屏幕是平坦的，游戏中的物体都是二维精灵图而不是
    3D 对象。继续让其他人测试你的游戏，看看是否有任何 bug。


    '
