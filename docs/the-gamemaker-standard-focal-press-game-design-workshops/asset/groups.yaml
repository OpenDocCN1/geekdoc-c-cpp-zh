    \ myDirection + 15\nRelative: checked\n```\n\n第 7步：添加 spr_silver_projectile 并将精灵图居中，然后将修改变形（Modify\
    \ Mask）设置为 Precise（精确）。\n\n## 创建神谕房间四\n\n- 第 1步：将 obj_player_silver 放置在北门下方，大门现在将显示为关闭状态。\n\
