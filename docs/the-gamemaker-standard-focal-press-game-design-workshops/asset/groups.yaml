    ## 更改图像状态


    当我们的飞船向上移动时，我们希望船的图像发生变化。在这个项目中，我们使用包含三个不同图像的条带作为主角飞船的单一精灵（sprite）。分别是：引擎水平的闲置精灵、引擎背部向下的移动精灵，以及引擎背部向上的向下移动精灵。这种精灵的切换增强了玩家向上或向下移动的体验感。


    **步骤 1：** 在窗口左侧的展开菜单中，找到并双击 **obj_scout** 对象。在对象属性（Object Properties）窗口的右侧，从选项卡选项中选择
    **Main1**。


    **步骤 2：** 在精灵（Sprite）子菜单中，选择 **Change Sprite** 图标（看起来像一个绿色的吃豆人），将其拖入动作（Actions）区域。这样做会打开
    **Change Sprite** 选项框。


    **步骤 3：** 确保 **Applies to** 设置为 **Self**。然后点击精灵选项旁边的图标，确保选择了后续精灵：**spr_scout_strip3**。由于这是一个包含三个不同图像的条带，我们需要识别一个子图像（subimage）。对于
    **<Down>** 事件，将子图像输入 1。对于 **<Up>** 事件，将子图像输入 0。为 **<Up>** 和 **<Down>** 事件的速度都输入
    **0**。


    ![](img/584600b080035f863f96e219491bffbd_29_0.png)


    从对象属性窗口最右侧的选项卡中，点击 **Control**。在 **Other** 子菜单中，找到 **Start of a Block** 图标（看起来像一个指向上的绿色三角形）。将
    **Start of a Block** 图标拖入动作区域，并将其放在 **Jump to position [0, 4]** 动作上方，以表示这是一个动作块的开始。


    **步骤 5：** 将 **End of a Block** 图标（看起来像一个指向下的绿色箭头）拖到 **Change Sprite** 动作下方，以表示这是动作块的结束。确保对
    **<Up>** 和 **<Down>** 事件都完成步骤 1 到 5。


    **步骤 6：** 现在我们想要确保理想的图像只显示船，而不是精灵中的其他图像。在对象属性窗口中，点击 **Add Event** 按钮并选择 **Create**。然后在窗口的最右侧，点击
    **Main** 选项卡。在 **Sprite** 子菜单中，点击 **Change Sprite** 动作并将其拖入动作区域。


    **步骤 7：** 在 **Change Sprite** 对话框中，确保 **Applies to:** 设置为 **Self**，然后设置以下内容：


    - Sprite: spr_scout_strip3

    - Subimage: 2

    - Speed: 0


    这将使飞船从闲置状态开始。


    ## 释放事件


    为了确保在按下向上或向下键后飞船能返回闲置状态，我们需要创建事件来触发图像返回闲置。


    **步骤 1：** 在 obj_scout 飞船的对象属性窗口打开的情况下，点击 Add 按钮。


    **步骤 2：** 添加一个 Key Release <Up> 和一个 Key Release <Down> 事件。


    **步骤 3：** 对于每个释放事件，点击 Main1 选项卡并将 Change Sprite 拖入动作区域。


    **步骤 4：** 在 Change Sprite 对话框中，确保 Applies to: 设置为 Self，并设置以下内容：


    - Sprite: spr_scout_strip3

    - Subimage: 2

    - Speed: 0


    确保对 Release <Up> 和 Release <Down> 事件都完成上述步骤 3 和 4。


    动作：

    | | | |

    |---|---|---|

    | 1 | Start of a block | |

    | 2 | Jump to position (0,-4) | |

    | 3 | Change sprite into spr_scout_strip3 | |

    | 4 | End of a block | |


