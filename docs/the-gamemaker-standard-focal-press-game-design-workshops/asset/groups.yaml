    \ 的碰撞（Collision）。\n- 第 5步：添加与 obj_player_silver 的碰撞。\n- 第 6步：添加一个不同房间动作（Different\
    \ Room Action）并设置以下内容：\n\n  room_finalboss\n\n- 第 7步：将 obj_nlt_six 对象放置在西门之间的隙中。\n\
    - 第 8步：创建一个新对象并命名为 obj_scroll_four。\n- 第 9步：将精灵设置为 spr_scroll_four。\n- 第 10步：取消勾选可见（Visible）选项。\n\
    - 第 11步：添加一个创建事件（Create Event）。\n- 第 12步：添加一个设置报警动作（Set Alarm Action）并设置以下内容：\n\
    \n  Number of steps: 90\n  In alarm no: Alarm 0\n\n- 第 13步：添加一个警报：Alarm 0 事件。\n\
    - 第 14步：添加一个设置变量动作（Set Variable Action）并设置以下内容：\n\n  Variable: visible\n  Value:\
    \ true\n\n- 第 15步：将卷轴对象放在房间的右下角。\n\n## 创建 Boss 层\n\n我们游戏的最后一个关卡是 Boss 关，通过西门进入。玩家需要使用银匕首逐个摧毁柱子上的头部。所有头部被摧毁后，将出现一颗宝石，触发一个对话框，告诉玩家他们已经完成了游戏。柱子将向玩家发射冰球和火球，玩家需要利用房间里的障碍物进行躲避。我们将为这个房间创建的第一批对象是火冰图腾柱。\n\
    \n- 第 1步：创建两个新对象并分别命名为 obj_totem_fire 和 obj_totem_ice。\n- 第 2步：将 spr_totem_fire\
    \ 精灵应用到 obj_totem_fire 对象，将 spr_totem_ice 应用到 obj_totem_ice 对象。\n\n它们将堆叠放在房间左侧，以形成图腾柱。\n\
    \n- 第 3步：Boss 将向玩家发射冰球和火球。当我们在 room_level_one 中为面具创建射击对象时，已经创建了火球对象。我们只需要创建冰球对象。创建一个新对象并命名为\
    \ obj_iceball。\n- 第 4步：在 obj_iceball 对象中添加一个创建事件。\n- 第 5步：添加一个播放声音动作（Play Sound\
