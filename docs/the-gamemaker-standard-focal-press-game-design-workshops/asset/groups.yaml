    ## Game Play Through and Bug Testing


    Congratulations, you have now created a multi-level game and incorporated simple
    puzzle elements into it. You have also introduced artificial intelligence elements
    to control the patrol routes of the ghosts. Try playing your game to see if you
    can spot any elements that are not working. In the game development field they
    call these bugs. Usually a bug can be easily fixed by rechecking the settings
    you typed in certain actions. If you cannot find any then it is time to have someone
    play your game to see if they overlook something because you already know how
    the game is supposed to work. People not involved in the game development process
    will often try to do things in a game we never thought about and thus uncover
    some bugs for us to fix. If you have not, you may wish to add some bugs to level
    to make it a bit more challenging. You may wish to create additional levels using
    the assets provided for you. Experimenting with different puzzle ideas can be
    a lot of fun.


