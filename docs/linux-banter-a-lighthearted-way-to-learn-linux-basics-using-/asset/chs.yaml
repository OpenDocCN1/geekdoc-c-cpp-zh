  \ - Opportunity to lock exists by this process with pid, 34980`\n\n数据库\n\nLingaraj\
  \ 开始说道：\n\n“让我们聊聊数据库吧。你们知道，数据库是用来存储数据的。鹦鹉 Paresh 是一个后来变成强匪的人。他从人们那里偷了许多财物，并训练了鹦鹉来维护数据库。他也偷了我的财物。Paresh\
  \ 只需要说出被劫者的名字，鹦鹉就会告诉详细信息，从人的名字开始，财物是什么以及隐藏在哪里。”\n\n![](img/image_rsrc854.jpg)\n\n\
  检查员把 Ravi 的名字告诉鹦鹉。鹦鹉开始吐出详细信息。\n\n‘Name : Ravi.\n\n\n\n\n\n# 贵物品：2 颗钻石，4 条金项链，6 条珍珠项链，20\
  \ 万卢比现金。\n\n“藏在 Sohi 山顶的橡树树下，”鹦鹉说。\n\n然后警察员把我的名字告诉了鹦鹉。\n\n“名字：Lingaraj。\n贵物品：关于如何改善世界的电影剧本和诗歌。\n\
  丢在他房子外的侧水沟里。”\n\n所以，鹦鹉有一个数据库，可以通过名称（键）进行请求。\n\n当你创建一个数据库时，会创建两个文件，一个扩展名为 `.dir`，另一个扩展名为\
  \ `.pag`。它们构成了由单一 `dbm` 指针标识的对。你只能通过 `dbm` 例程来修改它们。\n\n## 主要函数\n\n主要函数有这些：\n\n```c\n\
  #include <ndbm.h>\nDBM *dbm_open(const char *filename, int file_open_flags, mode_t\
  \ file_mode);\n```\n\n- `filename` 是你给数据库的没有扩展名的名称。\n- `file_open_flags` 与 `O_CREAT`\
  \ 进行“或”位运算。\n- `mode` 用于设置权限。\n- 它返回一个数据库描述符。\n\n```c\nint dbm_store(DBM *database_descriptor,\
  \ datum key, datum content, int store_mode);\n```\n\n- `datum` 是一种数据类型，至少包含 2 个成员：\n\
  \  - `void *dptr;`\n  - `size_t dsize`\n- `dsize` 指定数据的大小，`dptr` 指向存储的数据。\n- `datum\
  \ key` 是我们在鹦鹉故事中提到过的键，一个标识符。\n- `datum content` 是实际内容。\n- `store_mode`：当你尝试使用已存在的键存储某些数据时，会发生什么。如果设置为\
  \ `dbm_insert`，则值不会被存储。但是，如果设置为 `dbm_replace`，则值会被替换。\n\n```c\ndatum dbm_fetch(DBM\
  \ *database_descriptor, datum key);\n```\n\n“这根据键取取数据，”Seema 说。Lingaraj 继续说道。\n\n\
  ```c\nvoid dbm_close(DBM *database_descriptor);\n```\n\n“关闭数据库并移除进程对指定数据库的访问。”\n\
  \n```c\nint dbm_delete(DBM *database_descriptor, datum key);\n```\n\n它删除数据库中的某特定记录。\n\
  \n```c\nint dbm_error(DBM *database_descriptor);\n```\n\n这检查数据库中的错误。\n\n```c\nint\
  \ dbm_clearerr(DBM *database_descriptor);\n```\n\n这清除任何错误状态标志位。\n\n```c\ndatum dbm_firstkey(DBM\
  \ *database_descriptor);\ndatum dbm_nextkey(DBM *database_descriptor);\n```\n\n\
  这用于按顺序访问记录。关于数据库的部分就这些。\n\n## 进程\n\n“我们去散散步吧，”Lingaraj 说。\n\n他们去散了步去了一个椰子林。Seema\
  \ 对这个地方感到惊为观止，那里有很多高树。树上有一些蜂巢，Lingaraj 告诉 Seema，他带她来这里是为了谈论蜜蜂。\n\n![](img/image_rsrc855.jpg)\n\
  \n“蜜蜂总是在忙碌。蜂王准许许多蜜蜂的请求。但只有一只蜂王。请求可能是‘我得到了这些花蜜，我该把它放在哪儿？’\n\n而蜂王的回答是：\n‘花蜜？绝对不要在路上。’”\n\
  \nSeema 没有笑，Lingaraj 指出 nectar（花蜜）是道路建设中使用的 tar（焦油）一词的双关语。Seema 还是没有笑。Lingaraj 就放过了。\n\
  \n“所以每个工蜂与蜂王的每次听见都是一个时间片。蜂王往往有注意力缺陷症。她通过给一只工蜂大约 5 分钟的时间，要求他等待并移动到下一只蜜，那只蜜可能会询问如何对熊。她可能会说：\n\
  ‘请忍耐（bear with it）。’\n\n当然，蜂王的听众中会有更多的蜂。\n\n![](img/image_rsrc856.jpg)\n\n这给人一种她在同时处理所有人的印象。但事实并非。要理解的一点是，所有的蜜蜂都执行所有的任务，但在不同的时间片轮中进行。所以，当蜂王正在处理一个想做饭的厨蜂的请求时，她和所有其他蜜蜂都在积极处理这项工作。然后他们暂停该工作，转到下一个任务，可能是由于人类唱了一首反复重复的歌曲而去刺他。他们包围他，当这个人在震惊中准备挨刺时，他们停下来并回来。然后，他们承担巢内部的清洁工作。然后他们重复所有工作，从他们暂停的地方继续。告诉他们他们在何处的——例如，他们包围人类时所在的位置——是该进程的程序计数器。\n\
  \n在 Linux 中，处理器一次处理一个任务，以时间片的形式进行，但它们都发生得非常快，给人一种它正在同时做这一切的印象。\n\n“所以，蜂王就像内核。当蜂王要求采取后续行动时，工蜂的请求就可以转换为一个操作，”Seema\
  \ 说。\n\n“或者你可以把一切都看作一个进程。每个进程都有一个 `PID`，一个进程标识符。有一个进程的 `PID` 为 1。它被称为‘init’。它被称为所有进程的父进程。\n\
  \n当程序存储在内存中，没有程序可以修改代码。它是只读的。其他程序可以共享它，”Lingaraj 说。\n\n“当蜂王下命令并放在告示板上，没有人能改变它。它们可以共享它，”Seema\
  \ 说。\n\nLingaraj 笑了。“我们也有共享库。库是现成的代码。就像薯片。你不需要烹饪它们，而是采购现成的。蜂王告诉蜜蜂去烹饪。”\n\n制作配料的方法（对于两者）都在共享库中，命令引用它。制作配料的指令没有针对每道菜指定。也就是说，它在内存中。\n\
  \n当然变量不能共享。例如，如果 Idly 的配料是辣椒粉，而 Dosei 的配料是香菜，你不能只有一个配料项。在两种情况下都需要两个实例。\n\n进程拥有：\n\
  - 它自己的栈空间。\n- 它自己的环境空间。\n- 它自己的程序计数器。\n\n执行 `ps -ef` 命令查看更多信息。在这里你可以看到：\n- 进程的用户\
  \ ID\n- `PID`\n- 父 PID\n- 进程调度信息\n- 开始时间\n- 终端\n- 持续时间\n- 启动进程的命令\n\n\n\n\n与之相似，`system`\
  \ 调用就像一个代理人，通过让别人来完成工作。假设我有一个家庭管家。我请他为派对叫一个厨师，当我在办公室时，他在家里做饭。管家会收取佣金，并让厨师执行这项任务。水管维修、开车以及排队付账单也是同样的。\n\
  \n但如果你有一个全能的人才，他既会做饭，又会开车，还会付账单，那将会非常有帮助。\n\n它们有很多类型。有些只接受一个参数。有些接受参数数组，还有的要求你提供路径。\n\
  \n```c\n#include <unistd.h>\nchar **environ;\nint execl(const char *path, const\
  \ char *arg0, ..., (char *)0);\n```\n\n`path` 显然是命令可执行文件存储的位置。\n\n`arg0`、`arg1`\
  \ 等是所调用程序的参数。如果你自己写了一个程序，这些参数就是该程序中 `main` 函数的参数。`(char *) 0` 告诉 `execl` C 库函数，参数列表结束了。\n\
  \n现在，`execl` 类的 C 库函数，你可以把它们想象成“全能阿伦”（Mr All round Arun）。\n\n“全能阿伦是我请过的一个管家。他无所不知。他是个好司机、好厨师、电影导演、火箭科学家和水管工。每当我要求他做某项工作时，他就会戴上那顶特定的帽子。我的工作变成了他的工作，他执行得非常好。”\n\
  \n“你的意思是没有启动新进程吗？就像是你自己在做一样？”Seema 问。\n\n“没错。当 `exec` 类的函数启动一个新进程时，它使用调用进程的进程 ID（PID）。记得\
  \ Shell 脚本中的执行吗？我祖父去世时想让我父亲接手配方工作。这很像，但它是 C 库函数的形式。它们调用的是可执行文件，”Lingaraj 说。他继续道：\n\
  \n“阿伦从不向我收钱，因为他很有钱。”\n\n“后来发生了什么？他去世了吗？”\n\n“不，我解雇了他。”\n\n“为什么？”\n\n“有一天他戴上了我的帽子，开始认为自己就是我。他指使我，我为他工作，直到我有机会把他的帽子摘下来。”\n\
  \n被调用的进程实际上会消除调用进程。调用进程消失了。\n\n```c\nint execlp(const char *file, const char *arg0,\
  \ ..., (char *)0);\n```\n\n在这里，`path` 被替换为 `file`。这意味着命令将自动在 `PATH` 变量中查找文件。如果文件不在路径中，你必须指定完整路径名。\n\
  \n```c\nint execle(const char *path, const char *arg0, ..., (char *)0, char *constenvp[]);\n\
  ```\n\n在这里，`e` 象征“额外的”（extra）。通常指新进程应该运行的环境。如果没有定义，则使用当前进程的环境。\n\n```c\nint execv(const\
  \ char *path, char *const argv[]);\n```\n\n在这里，该函数接受一个参数数组。\n\n```c\nint execvp(const\
  \ char *file, char *const argv[]);\n```\n\n它将 `PATH` 中的文件名或完整路径，以及一个数组作为参数传递。\n\n\
  ```c\nint execve(const char *path, char *const argv[], char *const envp[]);\n```\n\
  \n同样，将 `PATH` 中的文件名或完整路径，以及数组同环境作为参数传递。\n\n所以，如果函数名中包含 `p`，它会在路径中搜索；`e` 意味着额外的（环境）；而\
  \ `v` 意味着数组。\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\npid_t fork(void);\n\
  ```\n\n如果你想让 Vijay 在赞美你亲戚的同时启动另一个进程……”\n\n“我会使用 `Ctrl+C` 和 `Ctrl+V`，复制粘贴。”\n\n“`Ctrl+C`\
  \ 是一个停止前台进程的信号。所以，如果你对 Vijay 使用 `Ctrl+C`，你将立即停止他正在赞美你亲戚的前台进程。”\n\n`fork` 就像是进程的复制粘贴，但它为生成的每个进程分配了不同的\
  \ `PID`。\n\n你为什么需要 `fork`？为了创建一个子进程。\n\n无论如何，`fork` 会将子进程的 `PID` 返回给父进程。对于子进程，它返回\
  \ `0`。在失败的情况下，它向父进程返回 `-1`。这在编程语文中非常重要。它给了我们一种方法来判断程序是在父进程还是子进程中。因此类型为 `pid_t`。所以，当你\
  \ `fork` 时，你创建了进程的另一个实例，即子进程。如果失败，它返回 `-1`。可能失败的原因有：\n\n- 子进程过多，限制由 `CHILD_MAX`\
  \ 指定。当你看到 `errno` 时，它将是 `EAGAIN`。\n- 如果进程表中没有空间或没有内存，`errno` 被设置为 `ENOMEM`。\n\n\
  ```c\n#include <sys/types.h>\n#include <sys/wait.h>\npid_t wait(int *stat_loc);\n\
  ```\n\n让我再次提一下。在程序执行过程中，如何发现你是在子进程还是父进程中？通过返回值。在子进程中是零，在父进程中是子进程的 `pid`。\n\n父进程（创建子进程的进程）可以使用\
  \ `wait()` 查询状态，判断它是运行还是停止。状态存储在 `stat_loc` 中。列表如下：\n- `WEXITED`\n- `WSTATUS`\n\
  - `WSIGNALED`\n- `WTERMSIG`\n- `WSTOPPED`\n\n```c\n#include <sys/types.h>\n#include\
  \ <wait.h>\npid_t waitpid(pid_t pid, int *stat_loc, int options);\n```\n\n`pid`\
  \ 是子进程的进程 ID。现在，`options`：\n- 与 `wait()` 相同，但 `WNHANG` 不阻塞调用者。如果子进程仍在运行，它返回 `0`。\n\
  - 如果调用被中断或参数无效，它返回 `-1`。\n\n另一个需要知道的重要是：如果进程打开了文件描述符，当调用 `exec` 类函数时，这些描述符会被保留。当进程终止时，该项会留在进程表中，直到父进程终止（此时父进程变为\
  \ `init`）。让我们来看一个程序。`maker.c`\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n\
  #include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n \
  \   pid_t pid;\n    char *message;\n    int exit_code;\n    printf(\"Fork starting\\\
  n\");\n    pid = fork();\n    switch(pid)\n    {\n        case -1:\n           \
  \ exit(1);\n        case 0:\n            printf(\"This is the child\\n\");\n   \
  \         printf(\"With PID : %d\\n\", getpid());\n            exit(EXIT_SUCCESS);\n\
  \            break;\n        default:\n            printf(\"\\n\\nThis is the parent\\\
  n\");\n            printf(\"With PID : %d\\n\", getpid());\n            sleep(30);\n\
  \            break;\n    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n上面的程序通过 `fork` 创建了一个子进程。我们可以识别（当程序运行时）进程是在父进程还是子进程中。如果进程\
  \ ID 为 `0`，意味着它是子进程。它立即结束了。父进程允许继续运行 30 秒。然后程序退出。我为什么要这么做？为了给你们展示僵尸进程。如果子进程在父进程之前终止且父进程没有调用\
  \ `wait()`，则子进程被称为称为僵尸进程。\n\n正如你们所知，`wait` 将子进程的状态返回给父进程。当我们运行这个程序时，会得到以下输出：\n\n\
  ```\nThis is the parent\nWith PID : 35916\nThis is the child\nWith PID : 35917\n\
  ```\n\n在另一个终端，如果你输入\n\n```bash\n$ ps -al\n```\n\n在其他进程中，你会发现一个项：\n\n```\n1 Z  1000\
  \  35917  35916  0  80  0 -       0 -       pts/0   00:00:00\n```\n\n\n\n注意这个代表僵尸进程的\
  \ ‘Z’，以及进程号 `35917`。当然，你也会看到 `35916`，但那是 `ppid`，即父进程 ID。在父进程结束之前，它会将此进程显示为僵进程。\n\
  \n我们使用 `wait` 来修复这个问题。\n\n`zwait.c`\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n\
  #include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n    pid_t\
  \ pid;\n    char *message;\n    int exit_code;\n    printf(\"Fork program starting\\\
  n\");\n    pid = fork();\n    switch(pid)\n    {\n    case -1:\n        exit(1);\n\
  \    case 0:\n        printf(\"This is the child\\n\");\n        printf(\"With PID\
  \ : %d\\n\", getpid());\n        exit(24);/*在这里，我们给出一个退出码，以查看它是否能在父进程中获取到。 */\n\
  \        break;\n        default:\n        printf(\"\\n\\nThis is the parent\\n\"\
  );\n        printf(\"With PID : %d\\n\", getpid());/* 从这里开始，添加了行 */\n        int\
  \ stat_val;\n        pid_t child_pid;\n        child_pid = wait(&stat_val);/*调用了\
  \ wait，它返回子进程的 pid 并释放资源。子进程之所以显示为僵尸是因为它的资源没有被释放.*/\n        printf(\"Child has\
  \ finished: PID = %d\\n\", child_pid);\n        if(WIFEXITED(stat_val))\n      \
  \      printf(\"Child exited with code %d\\n\", WEXITSTATUS(stat_val));在这里，我们使用\
  \ WIFEXITED 查看子进程是否正常终止，如果是，我们就继续使用 WEXITSTATUS(stat_val) 显示子进程是以什么代码退出的。\n    \
  \    else\n            printf(\"Child terminated abnormally\\n\");\n        sleep(30);\n\
  \        break;\n    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n当我们运行它时：\n\n```\nThis\
  \ is the parentWith PID : 36960This is the childWith PID : 36961Child has finished:\
  \ PID = 36961Child exited with code 23\n```\n\n所以，子进程 ID 和退出码被父进程获取了。\n\n而且如果我们用\
  \ `ps -al` 检查，尽管父进程又运行了 30 秒，但并没有关于僵尸进程的记录。\n\n一个好的 Shell 命令是 `pstree -p`，通过它可以看到带有进程\
  \ ID 的进程树。我建议你在运行上述程序时自己尝试一下，看看是哪个进程产生了哪个进程。\n\n# 信号 (Signals)\n\nLingaraj 开始说道。\n\
  \n“在一个商场发生过这样一起事。我正试着给女朋友挑礼物，这时我注意到一个年轻女性正试图为耳朵挑选耳饰。她一直在尝试各种耳饰，我们都能在镜子眼里看到彼此。我针对她尝试的东西向她发出信号。当她试戴一对耳环时，我向她比了一个大拇指反对的手势。”\n\
  \n![](img/image_rsrc857.jpg)\n\n她拒绝了。接下来的两次尝试也发生了同样，然后她问我为什么。我让她等一下，去上了手语课程然后回来。她还在那里试着合适的款式。于是我开始向她发手势。\n\
