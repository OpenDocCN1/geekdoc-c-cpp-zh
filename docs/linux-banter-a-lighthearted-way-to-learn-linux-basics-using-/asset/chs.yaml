  \ pattern`\n文件名（不包括任何路径），匹配提供的模式。为了确保模式被传递给 `find` 而不是立即被 shell 评估，模式必须始终放在引号中。\n\
  \n例如如下：\n\n```bash\nfind . -name \"*ma\" -print\n```\n\n将打印所有以 ‘ma’ 结尾的文件。注意那个点。它表示当前目录。所以，我们了解到，如果你不知道任何名字，`*`\
