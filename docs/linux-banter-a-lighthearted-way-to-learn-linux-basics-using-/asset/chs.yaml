  );\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main\
  \ after thread join\\n\");\n}\n```\n\n我将解释这个。\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\npthread_mutex_t\
  \ mutex1 = PTHREAD_MUTEX_INITIALIZER;\n```\n这初始化了互斥锁 mutex1。\nvoid *print_func(char*\
  \ message){\n   pthread_mutex_lock(&mutex1);\n我们在这里锁定了互斥锁。之后是代码的临界区域。\n   printf(\"\
  %s - Before sleep\\n\", message);\n   sleep(4);\n   printf(\"%s - After waking up\\\
  n\", message);\n   pthread_mutex_unlock(&mutex1);\n}在这里我们解锁了互斥锁。\nint main(){\n\
