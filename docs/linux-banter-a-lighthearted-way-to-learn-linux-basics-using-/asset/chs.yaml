  \ 能捕捉到它。”\n\n\n\n\n## 要阻塞的信号\n\n我们在这里讨论的是这一点：当一个信号发生时，处理函数会被调用并运行到结束。如果在此时间内出现了另一个信号，这个健壮的系统调用\
  \ `sigaction` 就可以阻塞这个新信号。\n\n`int sa_flags`\n\n## 信号动作修饰\n\n它告诉我们是否要返回位置以捕获新信号。当你将其设置为\
  \ `SA_RESETHAND` 时，`sigaction` 系统调用将处理一次信号。\n\n手册页（man pages）中还有其他可用的标志。\n\n`oact`\
  \ 是一个位置，将保存之前之前的信号动作。\n\n```c\n#include <signal.h>\nint sigaddset(sigset_t *set,\
  \ int signo);\nint sigemptyset(sigset_t *set);\nint sigfillset(sigset_t *set);\n\
  int sigdelset(sigset_t *set, int signo);\n```\n\n这些是 C 库函数。你可以让程序专门处理一个信号，或者制定一个通用的策略来处理信号。因此，你可以创建一个所有这些信号的集合并指定做什么。此外，可能会出现这样的情况：你的程序正在处理一个接收到的信号，而另一个信号又来了。这时你可能需要暂停该函数并杀死进程。无需困惑，你可以使用信号集来处理所有这些信号。\n\
  \n信号集的类型为\n\n`sigset_t`\n\n因此，你可以通过 `sigfillset()` C 库函数用所有可用信号填充你的信号集。同样，你可以使用\
  \ `sigemptyset()` C 库函数清空所有信号集合。\n\n你可以通过 `sigaddset()` 指定信号编号将单个信号添加到集合中。\n\n你可以通过\
  \ `sigdelset()` 指定信号编号从集合中删除单个信号。\n\n此外，你可以通过查询确定某个信号是否是集合的成员。\n\n```c\nint sigismember(\
  \ const sigset_t *set, int signum)\n```\n\n如果信号是集合的成员，则返回 1；否则返回 0；出错时返回 -1。\n\n\
  ```c\n#include <signal.h>\nint sigprocmask(int how, const sigset_t *set, sigset_t\
  \ *oset);\n```\n\n上述系统调用用于更改进程的信号掩码。如果信号被进程阻塞，它将不会被递送，而是保持挂起状态。程序可以通过调用 C 库函数 `sigpending`\
  \ 来确定哪些被阻塞的信号是挂起的。\n\n```c\n#include <signal.h>\nint sigpending(sigset_t *set);\n\
  ```\n\n该系统调用将一组信号写入由 `set` 指向的信号集中，这些信号是被阻塞递送的。如果成功则返回 0，否则返回 -1 并设置 `errno` 以指示错误。\n\
  \n```c\n#include <signal.h>\nint sigsuspend(const sigset_t *sigmask);\n```\n\n`sigsuspend`\
  \ 系统调用将进程信号掩码替换为 `sigmask` 提供的信号集，然后挂执行。它将在信号处理函数执行后恢复。\n\n## 示例：ayyo.c\n\n让我们来看一个使用\
  \ `sigaction` 的程序。\n\n`ayyo.c`\n\n```c\n#include <signal.h>\n#include <stdio.h>\n\
  #include <unistd.h>\n\nvoid ctrlc(int sig){\n    printf(\"我建议你不要停止我，%s\\n\", getlogin());\n\
  }\n\nvoid shutdown_req(int sig){\n    printf(\"我是进程 %d，我知道是谁在尝试杀掉我。是你，%s\\n\", getpid(),\
  \ getlogin());\n}\n\n/*\nvoid finish(int sig){\n    printf(\"这个函数非常没用，因为它试图处理 SIGKILL\
  \ 信号。\");\n}\n*/\n\n/*\n我们声明了上述三个函数，每个对应一个特定的信号：`SIGINT`、`SIGTERM` 和 `SIGKILL`。处理\
  \ `SIGINT` 的函数 `ayyo` 在按下 Ctrl+C 后只运行一次，因为我们使用了 `SA_RESETHAND` 标志。我们打印相关消息，这就是该函数做的所有。\n\
  */\n\nint main(){\n    struct sigaction act;\n    act.sa_handler = ctrlc;\n    sigemptyset(&act.sa_mask);\n\
  \    act.sa_flags = SA_RESETHAND;\n    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler\
  \ = shutdown_req;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n    sigaction(SIGTERM,\
  \ &act, 0);\n\n    /*\n    这与此无关，因为 SIGKILL 会立即杀死进程且无法被处理。\n    act.sa_handler =\
  \ finish;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags = 0;\n    sigaction(SIGKILL,\
  \ &act, 0);\n    */\n\n    /*\n    然后指定处理函数并将信号集 sa_mask 置为空。我们不希望任何信号被阻塞。因为你放在此这里的任何内容都不会被递送给进程。指定了是否需要\
  \ `SA_RESETHAND`。在第一种情况下，指定了 `SA_RESETHAND`，这意味着信号只会被处理一次，因为信号不会被重置。如果你希望它每次都生效。\n\
  \    */\n    while(1) {\n        printf(\"我很快乐\\n\");\n        sleep(1);\n    }\n\
  }\n```\n\n\n\n\n“所以，我想要更多的控制权。此外，我发现开支很大。我必须共享我的品牌标识、网站等内容。因此，我关闭了特许经营体系，并开始开设分公司。当然，这并不是经营业务的方法。那是我个人的特殊情况。”\n\
  \n“我不知道你为什么要告诉我这些。”\n\n“第一个案例，即我以前在那里建立一个小规模的运营，类似于在程序中调用一个函数。我的进程独立管理了它。\n\n第二个案例是我给出特许经营权，这创建了另一个进程，例如通过调用\
  \ `fork`。大量的信息必须被复制。\n\n第三个案例是开设分公司。只共享信息，而不进行复制。这就像执行一个线程。\n\n线程是程序的一部分，会执行多次，但不是作为函数执行。如果你同时处理两个文件，让\
  \ `kernel` 使用函数并作为单体块运行将非常繁琐。它可以让代码的另一个实例实例运行，但不会像进程那样对所有内容都进行复制。在线程执行中，正在运行的程序拥有它自己的栈，新的执行线程也拥有自己的栈，因此也有局部变量。但它与创建它的进程共享（请注意不是复制，而是共享）全局变量、文件描述符、信号处理程序和当前目录状态。\n\
  \n所以，特许经营有它自己的财务记账、工资，而分公司共享财务账目。进程是复制，而线程是共享，且复制涉及更多资源。”\n\n“是的，现在说说‘重入’代码。重入函数是指一个可以运行、被中断然后再次运行的函数。\n\
  \n同一个例程可以在不同的实例中重用，一个实例的变量值对其他实例可能无效。所以，如果一个例程改变了变量的值并被再次调用，它不会记住旧的一组值。它会采用调用程序发送的值。\n\
  \n在我们的社区里，饮酒年龄是 21 岁。我朋友的父亲，一位历史老师 Ritesh（他坚持传统就像 sambhar 汤坚持穿衬衫一样），曾是那家酒吧的老板。这没什么问题，除了他从不让我们进入酒吧。他以前会喝醉，当我们出现在酒吧门口时，对话是这样的：\n\
  \n![](img/image_rsrc859.jpg)\n\n‘哦，Lingaraj。你好吗？’他以前这样问。\n\n‘我很好，先生。我的编程表现不错，而且……’\n\
  \n‘我是想问你，你多大了？’\n\n‘25 岁，叔叔。’\n\n‘别骗我。你 20 岁。我记得你告诉过我。’\n\n‘那是 5 年前了，先生。’\n\n‘那又怎样？记录就是记录。出去吧。’\n\
  \n他不符合重入例程的标准。他唯一做的重入就是进入酒吧加水。所以，一个重入函数会为各种实例进行更新。\n\n它基本上意味着，只对调用者提供的数据操作。\n\n\
  ```c\n#include <pthread.h>\nint pthread_create(pthread_t *thread, pthread_attr_t\
  \ *attr, void*(*start_routine)(void *), void *arg);\n```\n\n成功时返回 `0`。\n\nC 库函数\
  \ `pthread_create()` 方便例程作为线程运行。它有一个名称，除了函数名外，你可以通过它识别线程。它由 `pthread_t *thread`\
