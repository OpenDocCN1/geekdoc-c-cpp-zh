  \ <string.h>\n#include <pthread.h>\n#include <unistd.h>\nvoid *print_func(char*\
  \ message){\n  printf(\"%s - Before sleep\\n\", message);\n  sleep(4);\n  printf(\"\
  %s - After waking up\\n\", message);\n}\n```\n\n（上面的代码展示了 `print_func` 是如何工作的。\n\
  \n```c\nint main(){\n  pthread_t t1, t2;\n  printf(\"Main program now running\\\
  n\");\n  pthread_create(&t1, NULL, (void *)print_func, (void *) \"First call to\
  \ pthread\");\n  pthread_create(&t2, NULL, (void *)print_func, (void *) \"Second\
  \ call to pthread\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n  printf(\"\
  Back to main after thread join\\n\");\n}\n```\n\n线程通过 `pthread_create` 创建。\n\n```c\n\
  struct thread_args {\n    char *message;\n};\n```\n\n为了传递参数给线程，我们使用结构体。\n\n```c\n\
  void *print_func(void *arg) {\n    struct thread_args *args = (struct thread_args\
  \ *)arg;\n    printf(\"%s - Before sleep\\n\", args->message);\n    sleep(4);\n\
  \    printf(\"%s - After waking up\\n\", args->message);\n    return NULL;\n}\n\
  ```\n\n这是我们向线程传递值。\n\n```c\nstruct thread_args args1, args2;\nargs1.message = \"\
  First call to pthread\";\nargs2.message = \"Second call to pthread\";\npthread_create(&t1,\
