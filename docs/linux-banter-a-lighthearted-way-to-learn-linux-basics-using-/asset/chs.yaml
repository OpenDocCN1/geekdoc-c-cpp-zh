  \    char *s_proto;\n};\n```\n\n```c\n#include <arpa/inet.h>\nchar *inet_ntoa(struct\
  \ in_addr in);\n```\n这会将 Internet 主机地址转换为点分位格式的字符串。\n\n```c\n#include <unistd.h>\n\
  int gethostname(char *name, int namelength);\n```\n这将主机名写入 `name` 提供的字符串中。当然，你必须对想要建立网络的系统有所了解。\n\
  \n### UDP\n\n正如我所说，UDP 是没有保证的。你以与 TCP/IP 类似的方式构建程序，但不是使用 `read` 和 `write`，而是使用以下系统调用。UDP\
  \ 是获取某些不重要数据的一种廉价方法。\n\n```c\nint sendto(int sockfd, void *buffer, size_t len, int\
  \ flags, struct sockaddr *to, socklen_t tolen);\n```\n`sendto` 向 socket 发送。\n\n\
  ```c\nint recvfrom(int sockfd, void *buffer, size_t len, int flags, struct sockaddr\
  \ *from, socklen_t *fromlen);\n```\n`recvfrom` 系统调用在 socket 上等待来自指定地址的数据包，并将其接收到缓冲区中。\n\
  \n现在让我们来看一些使用 `select` 的程序。\n\n### 首先是服务器：`server_select.c`\n\n```c\n#include <sys/types.h>\n\
  #include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <netinet/in.h>\n\
  #include <sys/select.h>\n#include <string.h>\n\n```c\n#include <sys/types.h>\n#include\
  \ <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <netinet/in.h>\n\
  #include <sys/select.h>\n#include <string.h>\n\nint create_tcp_socket() {\n    struct\
  \ sockaddr_in saddr;\n    int fd, ret_val;\n    fd = socket(AF_INET, SOCK_STREAM,\
  \ IPPROTO_TCP);\n    printf(\"Created a socket with fd : %d\\n\", fd);\n    saddr.sin_family\
  \ = AF_INET;\n    saddr.sin_port = htons(7000);\n    saddr.sin_addr.s_addr = htonl(INADDR_ANY);\n\
  \    ret_val = bind(fd, (struct sockaddr *)&saddr, sizeof(struct sockaddr_in));\n\
  \    ret_val = listen(fd, 5);\n    return(fd);\n}\n\nint main() {\n    fd_set read_set,\
  \ testfds;\n    struct sockaddr_in client_address;\n    int nread, server_fd, lc\
  \ = 0, ret_val, i;\n    char buf[100];\n    server_fd = create_tcp_socket();\n \
  \   while (1) {\n        FD_ZERO(&testfds);\n        FD_SET(server_fd, &testfds);\n\
  \        printf(\"Starting loop %d\\n\", lc);\n        ret_val = select(server_fd\
  \ + 1, &testfds, NULL, NULL, NULL);\n        printf(\"Return from select value is\
  \ : %d\\n\", ret_val);\n        if (ret_val < 1) {\n            perror(\"server_select\"\
  );\n            exit(1);\n        } else {\n            int new_lc = lc + 3;\n \
  \           for (fd = 3; fd <= new_lc; fd++) {\n                if (FD_ISSET(fd,\
  \ &testfds)) {\n                    if (fd == server_fd) {\n                   \
  \     printf(\"It is a new connection to the server. So grant it\\n\");\n      \
  \                  socklen_t addrlen = sizeof(client_address);\n               \
  \         fd = accept(server_fd, (struct sockaddr *)&client_address, &addrlen);\n\
  \                        FD_SET(fd, &testfds);\n                        printf(\"\
  Added client with fd %d\\n\", fd);\n                    } else {\n             \
  \           printf(\"The client %d is an already connected one. So read data\\n\"\
  , fd);\n                        nread = read(fd, buf, sizeof(buf));\n          \
  \              printf(\"\\nSize of buf is : %ld and received message: %s\\n\", nread,\
  \ buf);\n                        FD_CLR(fd, &testfds);\n                    }\n\
  \                }\n            }\n        }\n        lc++;\n    }\n}\n```\n*(注：由于提供的代码片段在原文中存在大量重复和错乱，翻译时已根据逻辑进行了整理，以保持可读性)*\n\
  \n\n\n\n\n```c\nprintf(\"Starting select in loop %d and waiting\\n\", lc);\nwhile\
  \ (1) {\n    FD_ZERO(&testfds);\n    testfds = read_fd_set;\n    printf(\"Loop %d\
  \ starting\\n\", lc);\n    printf(\"Starting select in loop %d and waiting\\n\"\
  , lc);\n    ret_val = select(FD_SETSIZE, &testfds, NULL, NULL, NULL);\n}\n```\n\n\
  启动 `select` 并开始监控是否有任何活动。当它返回时，它并不会告诉你活动具体的发生的位置，但有一种方法可以知道。在这里，由于只对 `testfds` 进行读取监控，因此不需要将任何其他文件描述符集合传递给\
  \ `select` 用于写入或检查异常。也没有设置超时值，因此该调用只有在发生某种活动时才会返回。在这里，我们使用 `testfds` 作为 `read_fd_set`\
  \ 的扩展，因为我们想在 `read_fd_set` 中填充值，但在每次迭代的开始时初始化 `testfds`。某种意义上，我们想保持 `read_fd_set`\
  \ 中的数据完好无损。这使得 `testfds` 可以在修改而不丢失我们之前设置的文件描述符。\n\n```c\nprintf(\"Return from select\
  \ value is : %d\\n\", ret_val);\nif(ret_val < 1) {\n    perror(\"server_select\"\
  );\n    exit(1);\n}\n```\n\n如果 `select` 失败，这将将打印相关消息。\n\n```c\nelse {\n    int new_lc\
  \ = lc+3;\n```\n\n谈到上面那行代码，我们依赖一些系统知识。我们知道 0、1 和 2 分别代表标准输入、标准输出和标准错误。如果创建了更多文件描述符，对于特定的进程，它们将按照顺序进行分配，因为它们对于该进程是唯一的。所以，我们利用这一点。在这种情况下，进程开始后创建的第一个文件描述符是\
  \ 3，即套接字。随后，客户端文件描述符从 4 开始。\n\n```c\nfor(fd = 3; fd <= new_lc; fd++)\n```\n\n在这里，我们启动了一个从文件描述符\
  \ 3 开始并递增的 `for` 循环。`fd` 是文件描述符编号。\n\n```c\n{\n    if(FD_ISSET(fd, &testfds))\n\
  ```\n\n我们检查属于 `testfds` 的 `fd` 文件描述符是否已变为活动。如果是，我们就继续。\n\n```c\n{\n    if(fd ==\
  \ server_fd)\n```\n\n查看 `server_fd` 是否被激活。只有当客户端尝试服务器进程建立新连接时，它才会被激活。你可能记得，接受连接后，会使用一个特定客户端的文件描述符。\n\
  \n```c\n    {\n        printf(\"It is a new connection to the server. So grant it\\\
  n\");\n        addrlen = sizeof(client_address);\n        client_particular_fd =\
  \ accept(server_fd, (struct sockaddr *)&client_address, &addrlen);\n        FD_SET(client_particular_fd,\
  \ &read_fd_set);\n        printf(\"Added client with client_particular_fd %d\\n\"\
  , fd);\n    }\n```\n\n在这里，我们接受连接并分配一个特定的客户端 `fd` 用于通信。\n\n```c\nelse{\n    printf(\"\
  The file descriptor %d is an already connected one. So read data\\n\", fd);\n  \
  \  read(fd, &buf, sizeof(buf));\n```\n\n在这里，如果激活的不是 `server_fd`，即如果它不是新连接的请求，那么意味着一个已经连接的客户端正在尝试传递消息。我们向用户打印相关消息。然后使用文件描述符编号\
  \ `fd` 读取它。\n\n```c\n    printf(\"\\nSize of buf is : %ld and received message:\
  \ %s\\n\",sizeof(buf), buf);\n    FD_CLR(fd, &read_fd_set);\n}\n```\n\n我们向用户打印从已连接客户端收到的消息内容。我们使用\
  \ `FD_CLR` 从集合中清除该文件描述符，因为如果不这样做，它将仍然留在下一次迭代中，并且将再次从该套接字读取消息。但这带来了一些局限性，我们将在看到输出后进行讨论。\n\
  \n```c\n    }\nlc++;\n}\n}\n```\n\n为了测试这个服务器的效率，我们需要两个客户端。一个连接到服务器并在 15 秒后传递消息；另一个连接到服务器并立即传递消息。我们交替运行它们，服务器必须在处理传入的消息和接受连接之间进行切换。\n\
  \n### client_select_1.c\n```c\n#include <sys/types.h>\n#include <sys/time.h>\n#include\
  \ <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include\
  \ <netinet/in.h>\n#include <arpa/inet.h>\n#include <errno.h>\n#define DATA_BUFFER\
  \ \"Seema learnt\"\nint main(){\n    char input[100];\n    struct sockaddr_in saddr;\n\
  \    int fd, ret_val;\n    struct hostent *local_host;\n    fd = socket(AF_INET,\
  \ SOCK_STREAM, IPPROTO_TCP);\n    printf(\"Created a socket with fd : %d\\n\", fd);\n\
  \    saddr.sin_family = AF_INET;\n    saddr.sin_port = htons(7000);\n    saddr.sin_addr.s_addr\
  \ = inet_addr(\"127.0.0.1\");\n    ret_val = connect(fd, (struct sockaddr *)&saddr,\
  \ sizeof(struct sockaddr_in));\n    if (ret_val == 0) {\n        printf(\"Connected\
  \ to the server.\\n\");\n        printf(\"Sleep 15 seconds before sending data.\\\
  n\");\n        sleep(15);\n        ret_val = write(fd, DATA_BUFFER, strlen(DATA_BUFFER));\n\
  \        printf(\"Sent data: %d bytes\\n\", ret_val);\n    }\n    close(fd);\n \
  \   return 0;\n}\n```\n\n### client_select_2.c\n```c\n#include <sys/types.h>\n#include\
