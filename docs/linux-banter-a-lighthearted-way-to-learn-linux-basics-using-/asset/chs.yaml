  # 进程间通信\n\n## 管道\n\n让我们接触进程间通信。\n\n从一个故事开始。我喜欢那个女孩并想更了解她。所以，我为她写了这首诗。\n\n你，\n看到我的心在徘徊\n\
  在平静的河流中\n在童真的斜坡上\n掉进海洋\n我们能多聊聊吗？\n关于北方的山脉\n关于如何在那里点燃篝火\n关于南方的草原\n在那里坐着喝着咖啡\n延伸的沙漠\n\
  把骆驼系在绿洲的棕榈树上\n西方的海洋\n拿着海壳贴在耳朵\n东方的天空\n被它的许多月亮点亮\n珠宝躺在床上\n清澈的水流下\n羚羊护着你\n在起伏的水域中\n\
  森林变成了长笛\n生命是和谐的\n那里无事可做\n所有发生的一切\n源于包容之，一片叶子\n\n我想把这封信读给她听，于是到了她家。我响了铃，她的父亲叫他“pop”，打开了门。那是一个大房子。我告诉我想见\
  \ Suparna。\n\n![](img/image_rsrc85F.jpg)\n\n“你想告诉她？”他问。\n\n“是私事的，”我回答道。\n\n“你想告诉她的，告诉我，我会告诉她的。”\n\
  \n我很惊讶。我告诉他关于 Linux 中的多线程以及它是如何实现的，这持续了一小时。\n\n“我会告诉她的，”他说并关上了门。\n\n我重复了这一周，深入研究多线程。第八天，他打开了门。\n\
  \n“在多线程中……”我开始\n“你想告诉她的，直接告诉她。”\n\n“那也无果了，我想。”\n\n“以后我会告诉你的。所以，她的 pop 就像一个管道。这引出了第一个\
  \ C 库函数。”\n\n```c\n#include <stdio.h>\nFILE *popen(const char *command, const char\
  \ *open_mode);\n```\n\n所以，这通常用于向进程传递命令。`open_mode` 是 `r` 或 `w`。\n\n调用程序可以使用 `\"\
  r\"` 从被调用进程接收输出。\n\n调用程序可以使用 `\"w\"` 将其输出发送到被调用进程的输入，”Lingaraj 说。\n\n```c\nint pclose(FILE\
  \ *stream_to_close);\n```\n\n这关闭管道。如果被调用进程仍在运行，`pclose` 将等待它完成然后关闭管道。\n\n它返回进程的退出码，其文件流为。\n\
  \n“这是一个示例，”Lingaraj 展示给她并开始解释。\n\n```c\npipe_fork.c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <fcntl.h>\nint\
  \ main(){\n    int total_bytes;\n    int filed_pipe[2];\n    const char chars_passed[]\
  \ = \"Crocodile Doctor\";\n    char buffer[BUFSIZ +1];\n    pid_t fork_success;\n\
  \    memset(buffer,'\\0',sizeof(buffer));\n    pipe(filed_pipe);\n    fork_success\
  \ = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"Fork Failure\"\
  );\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success == 0)\n    {\n\
  \        total_bytes = read(filed_pipe[0],buffer, BUFSIZ);\n        printf(\"This\
  \ program has read %d bytes - %s\\n\",total_bytes, buffer);\n        exit(EXIT_SUCCESS);\n\
  \    }\n    else\n    {\n        total_bytes = write(filed_pipe[1],chars_passed,\
  \ strlen(chars_passed));\n        printf(\"This program wrote %d bytes\\n\", total_bytes);\n\
  \    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n输出是：\n\n```\nThis program wrote 16 bytes\n\
  This program has read 16 bytes - Crocodile Doctor\n```\n\n顺序看起来不对，仅仅是因为父进程在子进程之前结束了。所以，写入操作是先进行的。\n\
  \n\n\n\n上述程序中发生的情况是：使用 `fork` 创建了一个子进程，我们通过 `fork` 的返回值判断程序现在是处于父进程还是子进程中。在第一次实例中，它处于子进程中，因为\
  \ `fork` 返回值为 `0`。然后我们从第一个文件描述符中进行读取。现在，一个与正在执行的程序不同的进程成功地从你编写的程序中读取了内容，尽管这是一个子进程。因此，某种通信正在发生。这很容易，因为子进程继承了文件描述符。但如果程序是完全不同的呢？\n\
  \n我们需要两个程序。让我们把这一个称为生产者程序，因为它提供了要传递的数据。我们将将其命名为 `pipe_prod.c`。\n\n### pipe_prod.c\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n\
  int main(){\n    int total_bytes;\n    int filed_pipe[2];\n    const char chars_passed[]\
  \ = \"Crocodile Doctor\";\n    char buffer[BUFSIZ + 1];\n    pid_t fork_success;\n\
  \    memset(buffer, '\\0', sizeof(buffer));\n    pipe(filed_pipe);\n    fork_success\
  \ = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"Fork Failure\"\
  );\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success == 0)\n    {\n\
  \        sprintf(buffer,\"%d\", filed_pipe[0]);\n        (void) execl(\"pipe_cons\"\
  ,\"pipe_cons\", buffer, (char*) 0);\n        printf(\"This is the child process,but\
  \ this text won't be displayed because execl finishes off the calling process.\"\
  );\n        exit(EXIT_FAILURE);\n    }\n    else\n    {\n        total_bytes = write(filed_pipe[1],chars_passed,\
  \ strlen(chars_passed));\n        printf(\"This program wrote %d bytes - %s\\n\"\
  , total_bytes, buffer);\n    }exit(EXIT_SUCCESS);}\n```\n\n“第一个变化是 `sprintf` 函数。它将传递给\
  \ `pipe` 的数组中的第一个文件描述符捕获到缓冲区 `buffer` 中。也就是说，它将存储在 `filed_pipe[0]` 中的文件描述符值打印到 `buffer`\
  \ 中。因为我们之后调用的第二个程序将不会继承这些文件描述符，”Lingaraj 解释道。\n\n“但是有一个对 `fork` 的调用，”Seema 说。\n\n\
  “是的。逻辑是，如果我们使用 `execl` 调用另一个程序（我们确实会这么做），调用进程就会被消除，尽管进程 ID 仍然存在。这就像 Arun 完全接管了我的位置，而我不再那里了。所以，该进程结束了。我们调用\
  \ `fork` 创建子进程，然后从子进程中调用 `execl`。这样，父进程被保留，而子进程结束。因此，在调用 `execl` 后，你不会看到 `printf`\
  \ 语句中的文本‘This is the child process,but this text won't be displayed because execl\
  \ finishes off the calling process.’”\n\n在 `execl` 中，我们调用了要执行的程序 `pipe_cons`，并提供了两个信息：其一是作为调用程序参数的程序名称；另一个是存储存储在\
  \ `buffer` 中的文件描述符。因此，通过 `execl` 调用的程序将拥有这些信息。\n\n让我们来看看接收数据的消费者程序。它命名为 `pipe_cons`。\n\
  \n### pipe_cons.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
  #include <string.h>\nint main(int argc,char *argv[]){\n    int bytes_ex;\n    char\
  \ buffer[BUFSIZ + 1];\n    int file_des;\n    memset(buffer,'\\0',sizeof(buffer));\n\
  \    sscanf(argv[1],\"%d\", &file_des);\n    printf(\"The argument to the consumer\
  \ program is %s\\n\", *argv);\n    bytes_ex = read(file_des, buffer, BUFSIZ);\n\
  \    printf(\"The process %d has read %d bytes. Content : %s \\n\", getpid(), bytes_ex,\
  \ buffer);\n    exit(EXIT_SUCCESS);}\n```\n\n这是通过 `sscanf` 传递的数据。但还有一个对 `memset`\
  \ 的调用。\n\n```c\n#include <string.h>\nvoid *memset(void *s, int c, size_t n);\n```\n\
  \n这是通过 `sscanf` 传递的数据。但还有一个对 `mkfifo` 的调用。\n\n```c\n#include <sys/types.h>\n#include\
  \ <sys/stat.h>\nint mkfifo(const char *filename, mode_t mode);\n```\n\n\n\n一个错误，-1，且\
  \ FIFO 将无法打开。如果已经有一个进程打开了 FIFO 进行读取，那么返回的文件描述符可以用于写入 FIFO。”\n\n“好的，所以助手会给你打电话，但如果你没法联系，他就会将其记录为错误。但如果你在电话那头接听，他就可以进行沟通。听起来有点不公平。正如你所说，这很奇怪。”Seema\
  \ 说道。\n\n“你可能不会相信的，但这真的发生了。他在屋里给我打电话想直接和她交谈后，就不再让我们独处。他以前会审视我的每一个字句。我心起大意，尝试在所有的多线程概念之间溜插一条消息。\n\
