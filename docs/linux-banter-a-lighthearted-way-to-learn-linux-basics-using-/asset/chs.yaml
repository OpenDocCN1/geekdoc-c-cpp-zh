  \ *), void *arg` 是将作为线程运行的例程，`arg` 是它的参数。\n\n```c\n#include <pthread.h>\nvoid pthread_exit(void\
  \ *retval);\n```\n\n这会退出线程。与函数不同，你不能返回一个变量。因为……？”\n\n“对。”\n\n```c\n#include <pthread.h>\n\
  int pthread_join(pthread_t th, void **thread_return);\n```\n\n这个 C 库函数类似于进程中的 `wait`\
  \ 系统调用。在这里，`pthread_t th` 代表例程标识符，记得 `pthread_create` 吗？\n\n它返回一个指向线程返回值的指针的指针。\n\
  \n他在他的笔记本电脑上打开了一个文件。\n\n`thread_program.c`\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\nvoid\
