- "# Linux Banter：使用 C 语言学习 Linux 基础的轻松入门指南\n\n\n\n\nLinux® 是 Linus Torvalds 在美国及其他国家的注册商标。\n\
  \n所有人物均为虚构。与任何在世或已故人士的相似纯属巧合。\n\n# GNU 通用公共许可证\n\n书中的源代码根据 GNU 通用公共许可证第 3 版提供，网址为：`http://www.gnu.org/licenses/gpl-3.0.en.html`\n\
  \n## 免责声明\n\n某些依赖于机器的代码在某些机器上可能可以，也可能无法工作。所有代码都在我们的计算机上经过了测试，我们没有发现任何损坏系统的问题。然而，我们对误用这些程序对您的系统造成的任何损害不负责。\n\
  \n## 本书适用读者\n\n本书适合那些对直观了解 Linux 技术感兴趣，并想知道通过 Linux 系统调用和某些 C 库函数可以做些什么的人。本书概述了用于编写程序的工具，以及\
  \ Linux 系统为普通读者提供的内容。请注意，本书旨在作为一种学习 Linux 基础知识的轻松读物。这不是一本关于 Linux 管理的书，也不传授关于 Linux\
  \ 安装的知识。\n\n我们还敦促您负责任且自信地使用计算机这一强大的系统，它是基于奉献人士多年心血的结晶，也是我们文明进步的典范和稳定的基础。编程具有巨大的潜力，它确实可以为世界带来积极的变化。希望您在本课程中得愉快。这些内容概述了使用编程语言编写系统的各种方法，其中也包含实用程序。从这里学习的方法也可以扩展到理解其他编程语言。当然，由于程序数量庞大以及全球各地的高效贡献，本书不可能涵盖\
  \ Linux 系统的所有方面。但它提供了一个读者可以借此入门的基础。\n\n## 先决条件\n\n你需要一个安装了 GNU C 编译器的 Linux 系统，并具备\
  \ `C` 基础知识。\n\n| 索引 | 页码 |\n| :--- | :--- |\n| 引言 | 4 |\n| Shell 脚本 | 51 |\n| C\
  \ 编译器 | 83 |\n| 文件与目录 | 89 |\n| 内存与命令行参数 | 126 |\n| 与时间相关的调用 | 142 |\n| 临时文件 | 146\
  \ |\n| 用户 ID 与组 | 147 |\n| 资源与限制 | 154 |\n| 数据管理 | 157 |\n| 文件锁 | 161 |\n| 数据库 |\
  \ 169 |\n| 进程 | 172 |\n| 信号 | 184 |\n| 线程与互斥 | 193 |\n| 进程间通信管道 | 216 |\n| IPC：信号量\
  \ | 232 |\n| IPC：共享内存 | 242 |\n| IPC：消息队列 | 248 |\n| 套字 | 256 |\n| 结语 | 286 |\n\n\
  书中还讲述了 Lingaraj 的轶事，他开始向想学习的地质学专家 Seema 教授 Linux。本书使用比喻来介绍各种概念，请读者不要假设这些比喻是完全等同的。\n\
  \n# Linux 趣谈\n\n版权所有作者。源代码和技术事务除外。\n\n出版商：Purple Prose，印度班加罗尔。Purple Prose 是印度的注册商标。\n\
