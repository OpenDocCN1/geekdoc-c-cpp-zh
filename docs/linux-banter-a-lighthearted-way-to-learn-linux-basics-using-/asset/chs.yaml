  - 有人挡住了镜子里的视线。\n- 在不记得的情况下重复穿戴同样的东西。\n- 向镜子扔大大石头把它砸碎，因为你已经站在那里了很久，而她又决结不定。\n\n“然后发生了什么？”Seema\
  \ 问。\n\n“她挑选了大约 8 处耳环、12 条项链和 7 枚鼻钉。然后迅速消失了。我本也会这么做的，但她告诉店员我是她的丈夫。店员相信了，因为挑选是我做的。由于我当时赖她生活，我不得不用女朋友的信用卡买单。我一直和女朋友在一起，直到信用卡账单寄到。我正在吃她做的‘洋葱饼\
