  \ const char *message, arguments...);\n```\n\n这是一个日志消息。但未来的文明可能会视为历史，并根据你独特的案例重建那个时代的精神。它就像日记，只不过这些消息的去向取决于优先级。优先级选项有这些。\n\
  \n| 优先级 |\n| :--- |\n| `LOG_EMERG` |\n| `LOG_ALERT` |\n| `LOG_CRIT` |\n| `LOG_ERR`\
  \ |\n| `LOG_WARNING` |\n| `LOG_NOTICE` |\n| `LOG_INFO` |\n| `LOG_DEBUG` |\n\n```c\n\
  void openlog(const char *ident, int logopt, int facility);\n```\n\n如果你想“自定义”记录消息的方式，可以使用这个\
  \ C 库函数。`ident` 是你可以加在消息前面的内容，比如“Seema 的活动是：”。`facility` 参数记录了一个默认设施值，供未来的 `syslog`\
  \ 调用使用。`logopt` 参数配置未来 `syslog` 调行为。\n\n## 资源和限制\n\nLingaraj 开始说道。\n\n“一个程序，一组系统调用，用于对使用\
  \ Vijay 资源的人设置限制，并对他设定你的优先级。你想要那样吗？”\n\n“Vijay 是个成年人，无论机器还是人，他都可以自己决定。但是的，我想学习这些调用。”\n\
  \n\n\n\nLinux 系统中的一些常见限制：\n\n| `NAME_MAX` |\n| `CHAR_BIT` |\n| `CHAR_MAX` |\n| `INT_MAX`\
  \ |\n\n因此，为了尝试这些限制，你需要系统调用。\n\n```c\n#include <sys/resource.h>\nint setpriority(int\
  \ which, id_t who, int priority);\nint getrlimit(int resource, struct rlimit *r_limit);\n\
  int setrlimit(int resource, const struct rlimit *r_limit);\nint getrusage(int who,\
  \ struct rusage *r_usage);\nint getpriority(int which, id_t who);\n```\n\n如你所知，`id_t`\
  \ 是用于用户 ID 和组 ID 的特殊整数类型。`int which` 告诉该 ID 是用户 ID 还是进程 ID。`int priority` 是优先级值，一个\
  \ `-20` 到 `20` 之间的整数。默认值为 `0`。`rlimit` 是一个包含指针的结构体：\n\n```c\nstruct rlimit {\n \
  \   rlim_t rlim_cur;\n    rlim_t rlim_max;\n};\n```\n\n软限制（soft limit）你可以将其理解为会产生错误的限制，而硬限制（hard\
  \ limit）则会导致程序终止。如果 Vijay 参加了很多，我猜你可以用这个来设置一个限制。让他只拥有有限的额度。\n\n硬限制大于软限制。硬限制好比一个人可以喝多少酒。Prabhu\
  \ 的硬限制是 `750` 毫升。但他妻子只允许他喝 `180` 毫升。这就是软限制。实施限制可能还有其他考虑，比如配给。其他人可能需要喝酒。你可以喝，但不敢喝。你可以喝，但非常小心。如果符合你的情况，硬限制和软限制就不重要了。只有超级用户（superuser）可以增加硬限制，就像医生可以增加容量一样。否则，普通用户只能减小软限制。\n\
  \n这些是对应的资源及其描述：\n\n| `RLIMIT_AS` |\n| `RLIMIT_CORE` |\n| `RLIMIT_CPU` |\n| `RLIMIT_DATA`\
  \ |\n| `RLIMIT_FSIZE` |\n| `RLIMIT_NOFILE` |\n| `RLIMIT_STACK` |\n\n`rusage` 结构包含更多成员，其类型同样为\
  \ `timeval`。它的成员是：\n\n```c\nstruct rusage {\n    struct timeval utime;\n    struct\
  \ timeval stime;\n};\n```\n\n```c\nint setpriority(int which, id_t who, int priority);\
  \ // 设置进程的优先级。\nint getpriority(int which, id_t who); // 返回优先级值。\nint getrlimit(int\
  \ resource, struct rlimit *r_limit); // 返回某个资源的限制值，如 RLIMIT_CPU 包含硬限制和软限制值。\nint\
  \ setrlimit(int resource, const struct rlimit *r_limit); // 设置软、硬限制的值。\nint getrusage(int\
  \ who, struct rusage *usage); // 提供进程消耗的用户时间和系统时间。\n```\n\n`who` 选自：\n\n| `RUSAGE_SELF`\
  \ |\n| `RUSAGE_CHILD` |\n\n### 数据管理\n\nLingaraj 说话了。让我们谈谈 Linux 是如何管理内存。虚拟内存是一种抽象。这意味着它被组织并使其看起来非常有规律且易于访问。\n\
  \n```c\n#include <stdlib.h>\nvoid *malloc(size_t size);\n```\n\n`size_t size` 的类型是\
  \ `unsigned long`。想象你城市里有一个仓库。Linux 中的内存就像那个仓库。假设我想存储 `50` 公斤檀香，我在仓库里预订了 `10` 英尺乘以\
  \ `10` 英尺的空间。仓库管理员（我们叫他 Varadaraj 吧）会把它存放在仓库里并给我收据。\n\nimage_rsrc852.jpg\n\n现在，我有\
  \ `10` 英尺乘以 `10` 英尺的空间存放檀香。我通常不会问他仓库内部物理空间的位置。如果我问，我可以查到，但并不一定要这样做。所以，这 `10` 英尺乘以\
  \ `10` 英尺就是你通过 `malloc()` 分到的内存数量。\n\n我不能在仓库的某个房间里放大象粪，然后问 Varadaraj 隔壁放了什么。他会立即把我从系统中移除。我连大象粪都拿不回来。我不能写一个程序去查询程序不关心的其他内存地址。同样，我不能请求\
  \ `10` 英尺乘以 `10` 英尺的空间，却要一个长 `12` 英尺的木鹿雕塑。所以我不能写一个尝试写入超出其分配的独立地址空间的程序。\n\n如果仓库很小，比如是一个初创公司，没有足够的空间处理额外订单，仓库管理员\
  \ Varadaraj 会把额外的物品带回家里存放。但当然，他不会告诉我。如果他对我的订单这么做了，当我要求提取时，我能发现送货需要更长时间。对硬盘驱动的使用被称为交换空间（swap\
  \ space）。\n\n如果他觉得某个物品一段时间不会被使用，他也会把物品移到家里。如果我去仓库向他要，他会再次从后面把它搬回仓库，给我一种它直一直在仓库里的印象。\n\
  \n调用 `malloc` 让 `malloc` 库能够管理内存。\n\n```c\n#include <stdlib.h>\nvoid free(void *ptr);\n\
  ```\n\n这就像告诉仓库你已经用完了该空间，不再需要了。当然，在使用 `free` 之后，你不能再尝试访问该空间。\n\n```c\n#include <stdlib.h>\n\
  void *calloc(size_t number_of_elements, size_t element_size);\n```\n\n`calloc` 分配空间。`number_of_elements`\
  \ 和 `element_size` 的类型都是 `size_t`。\n\n```c\nvoid *realloc(void *ptr, size_t size);\n\
  ```\n\n`realloc` 修改之前分配内存的大小。它返回指向更新内存的指针。\n\n这应该很直观。我们来看看分配到底。Lingaraj 展示了一个程序。\n\
  \n`memory_less.c`\n\nLingaraj 展示了程序：\n\n```c\n#include <unistd.h>\n#include <stdlib.h>\n\
  #include <stdio.h>\nint main() {\n    char *some_memory;\n    int exit_code;\n \
  \   some_memory = (char *)malloc(5);\n    if (some_memory != NULL) {\n        sprintf(some_memory,\
  \ \"Will this be printed?\\n\");\n        printf(\"%s\", some_memory);\n       \
  \ exit_code = EXIT_SUCCESS;\n    }\n    exit(exit_code);\n}\n```\n\n输出不多，但它说明了由于我们只分配了\
  \ `5` 字节，它无法处理这个超过 `20` 字节的长字符串。所以，我们这次修改了程序，分配了 `30` 字节。\n\n```\nmalloc(): corrupted\
  \ top size\nAborted (core dumped)\n```\n\n\n\n\n\n当程序结束或文件描述符关闭时，所有的锁都会清除。\n\n在文件锁定过程中，不要使用\
  \ `fread` 或 `fwrite`。请使用 `read` 和 `write`。这是因为 `fread` 或 `fwrite` 是带缓冲的，也就是说缓冲区中会有更多的待读或待写字节。”\n\
  \n这样一个 C 库函数：\n\n```c\n#include <unistd.h>\nint lockf(int fildes, int function,\
  \ off_t size_to_lock);\n```\n\n`function` 的选项有：\n\n- `F_ULOCK`\n- `F_LOCK`\n- `F_TLOCK`\n\
  - `F_TEST`\n\n这些锁在本质上是建议性的，也就是说程序必须要有礼貌地检查锁并尊重锁。\n\n我将向你展示两个程序：一个锁定数据文件的某个区域（在某些字节之间），另一个程序检查它是否可以获取该区域的锁。首先，我们将测试排他性访问。`lock_reg_ex.c`\n\
  \n```c\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\n\
  const char *file_with_regions = \"/tmp/test_lock\";\nint main() {\n    int fd;\n\
  \    int count;\n    char *fill_string = \"Seema\";\n    struct flock region;\n\
  \    // 我们进行了重要的声明，并决定测试文件将填充为“Seema”。我们声明了一个类型为 `flock` 的结构体 `region`，它将包含有关锁定、解锁锁或测试的详细信息。\n\
  \n    int res;\n    fd = open(file_with_regions, O_RDWR | O_CREAT, 0666);\n    if\
  \ (!fd) {\n        fprintf(stderr, \"Unable to open %s.\\n\", file_with_regions);\n\
  \        exit(EXIT_FAILURE);\n    }\n    // 因为之前提到的原因，我们明智地使用了 `open` 而不是 `fopen`。\n\
  \    for(count = 0; count < 100; count++) {\n        (void)write(fd, fill_string,\
  \ 1);\n    }\n    // 我们只是用“Seema”这个单词填充它。\n\n    region.l_type = F_WRLCK;\n    region.l_whence\
  \ = SEEK_SET;\n    region.l_start = 40;\n    region.l_len = 10;\n    // 我们使用 `F_WRLCK`，它是写锁或排他锁。\n\
  \n    printf(\"Process %d locking file\\n\", getpid());\n    res = fcntl(fd, F_SETLK,\
  \ &region);\n    // 我们对打开的文件使用文件描述符 `fd` 调用 `fcntl`，使用 `SETLK` 创建锁并指定 `region` 结构体。\n\
  \    if (res == -1) fprintf(stderr, \"Failed to lock region.\\n\");\n    sleep(20);\n\
  \    printf(\"Process %d closing file\\n\", getpid());\n    close(fd);\n    exit(EXIT_SUCCESS);\n\
  }\n```\n\n显然，我们可以通过编写一个访问相同文件的程序来测试它，并继续使用 `fcntl` 查询是否存在锁，以及是否可以获取新锁。\n\n`lock_reg_ex_test.c`\n\
  \n```c\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\n\
  const char *file_with_regions = \"/tmp/test_lock\";\n#define SIZE_INCREMENT 5\n\
  int main() {\n    int fd;\n    int res;\n    struct flock region_of_interest;\n\
  \    int start_byte;\n    fd = open(file_with_regions, O_RDWR | O_CREAT, 0666);\n\
  \    if (!fd) {\n        fprintf(stderr, \"Unable to open %s for read/write\", file_with_regions);\n\
