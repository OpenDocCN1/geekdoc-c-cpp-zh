  \ 和 `ctime` 返回的是人类可读的字符串。\n\n## 临时文件\n\nLingaraj 开始了这个话题。\n\n“让我们谈谈临时文件。有时你可能需要创建临时文件。\n\
  \n```c\n#include <stdio.h>\nchar *tmpnam(char *s);\n```\n\n它返回一个系统中不存在的唯一字符串。它也会更新字符串\
  \ `s` 中的内容。但问题是，另一个程序在你开始使用它之前，可能会创建一个同名的文件。\n\n```c\n#include <stdio.h>\nFILE *tmpfile(void);\n\
  ```\n\n上面的 C 库函数创建并打开一个具有唯一名称的文件并返回一个文件流供立即使用。\n\n```c\n#include <stdlib.h>\nchar\
  \ *mktemp(char *template);\nint mkstemp(char *template);\n```\n\n\n\n如果你希望新文件名遵循某种模式或模板，可以使用上面提到的\
  \ C 库函数。模板可以是你想要的内容，后面跟着六个 X 字符。这六个 X 字符会被替换以生成唯一的文件。\n\n`mktemp` 和 `mkstemp` 的区别在于\
  \ `mktemp` 只提供文件名。`mkstemp` 在打开文件后返回一个文件描述符。然而，建议仅使用 `tmpfile()` 和 `mkstemp()`。\n\
  \n## 用户 ID 和组\n\nLingaraj 提出了一个新话题。\n\n“用户信息。提供 `uid`（即人员的用户 ID）的系统调用是：\n\n```c\n\
  #include <sys/types.h>\n#include <unistd.h>\nuid_t getuid(void);\nchar *getlogin(void);\n\
  ```\n\n`getuid()` 系统调用返回与程序关联的用户 ID。这通常是运行该程序的用户的 UID。\n\n`getlogin()` C 库函数返回当前用户的登录名。\n\
  \n```c\n#include <sys/types.h>\n#include <pwd.h>\nstruct passwd *getpwuid(uid_t\
  \ uid);\nstruct passwd *getpwnam(const char *name);\n```\n\n你可以获取关于已知 ID 或名称的用户许多详细信息。上述\
  \ C 库函数返回一个 `passwd` 类型的结构。访问其内容即可获得细节。我假设你读过 C 语言，已经知道如何访问结构。”\n\n“是的。”\n\n“`passwd`\
  \ 结构的成员有：\n\n| 成员 | 描述 |\n| :--- | :--- |\n| `char *pw_name` | 用户的登录名 |\n| `uid_t\
  \ pw_uid` | UID 号 |\n| `gid_t pw_gid` | GID 号 |\n| `char *pw_dir` | 用户的家目录 |\n|\
  \ `char *pw_gecos` | 用户的全名 |\n| `char *pw_shell` | 用户的默认 shell |\n\n你可以连续获取连续的条目：\n\
  \n```c\n#include <pwd.h>\n#include <sys/types.h>\nvoid endpwent(void);\nstruct passwd\
  \ *getpwent(void);\nvoid setpwent(void);\n```\n\n`getpwent` 返回一个包含单个用户条目的结构。第一次调用它时，它返回第一个条目；第二次调用时，返回第二个条目。所以不需要设置一个变量并每次递增。\n\
  \n`endpwent` 停止这个 C 库函数。`setpwent` 将位置置到起始处。\n\n```c\n#include <sys/types.h>\n#include\
  \ <unistd.h>\nuid_t geteuid(void);\ngid_t getgid(void);\ngid_t getegid(void);\n\
  int setuid(uid_t uid);\nint setgid(gid_t gid);\n```\n\n你可以使用 `getgid` 获取用户/程序的组\
  \ ID。`setuid` 只能由超级用户或 root 使用，但建议谨慎使用，因为一旦你将进程的用户 ID 改为较小的值，就无法恢复了。这就像一位国王在他的王国里巡游，当他回来时，卫兵不让他进入。因此，通常使用设置有效用户\
  \ ID 的 `seteuid`。我会给你们看一个简单的程序，”他说，并展示了一个程序 `passwd.c`。\n\n```c\n#include <sys/types.h>\n\
  #include <pwd.h>\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
  int main(){\n    uid_t userid;\n    gid_t groupid;\n    struct passwd *password;\n\
  \    userid = getuid();\n    groupid = getgid();\n    printf(\"User is %s\\n\",\
  \ getlogin());\n    printf(\"User IDs: User id is %d, Group id is %d\\n\", userid,\
  \ groupid);\n    password = getpwuid(uid);\n    printf(\"User ID entry shows the\
  \ following data :\\n Name is %s, User id is %d, Home Directory is %s, The shell\
  \ is %s\\n\", password->pw_name, password->pw_uid, password->pw_gid, password->pw_dir,\
  \ password->pw_shell);\n    exit(0);\n}\n```\n\n你明白了吗？这只是对密码结构的简单读取。”Seema 看了几分钟后说她懂了。\n\
  \n```c\n#include <sys/utsname.h>\nint uname(struct utsname *name);\n```\n\n`uname`\
  \ 系统调用将主机信息写入由 `name` 指向的 `utsname` 类型结构中。我说的“类型结构”，简单是指包含与相关文件中定义的相同字段的结构。`utsname`\
  \ 结构定义在 `utsname.h` 中。它必须至少包含这些成员：\n\n| 成员 | 描述 |\n| :--- | :--- |\n| `char sysname[]`\
  \ | 操作系统名称 |\n| `char nodename[]` | 主机名 |\n| `char release[]` | 系统的发布级别 |\n| `char\
  \ version[]` | 系统的版本号 |\n| `char machine[]` | 硬件类型 |\n\n```c\n#include <unistd.h>\n\
  int gethostname(char *name, size_t namelen);\n```\n\n此系统调用将主机名写入字符串 `name` 中。`namelen`\
  \ 是假设的最小长度。\n\n“为什么这很重要？我们通常知道主机的名字。”Lingaraj 回想起了某些事，决定告诉 Seema。Seema 准备好听他的另一个故事。\n\
  \n“当我当软件工程师工作时，我们中一些人去了这家酒店。我们看到一个大厅里在举办派对，决定闯进去。我们当时在另一家公司工作。派对是由一家名为 Some Software\
