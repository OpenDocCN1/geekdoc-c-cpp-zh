  \n# getopt()\n\n假设你派你的朋友去帮着买一个手包。你会告诉她什么呢？”\n\n“我会告诉她买一个带拉链的、有一个放小镜子的口袋、一个可以放手机的隔层，而且设计是红色的。预算是\
  \ 750 卢比。”\n\n“好的，`fetchbag()` 将包含获取手包的指令。\n\n而你说的所有其他东西都是选项。现在，这些选项将是\n\n--zip\n\
  --pocket\n--mirror\n--cellphone holder\n--design : red\n--amount : 750 rupees\n\n\
  注意这些冒号。”\n\n我们会使用代码。`z`、`p`、`m`、`c`、`d`、`red` 和 `a` 是这些选项的简写，”Seema 说。\n\n“如果是那样，我们将使用\
  \ `getopt()`。你所做的就是指定以‘-’为前缀的代码选项。`getopt()` 会捕获这些选项并使其对被调用的程序可用。否则，你将使用 `argv`\
  \ 列表，并根据选项前的‘-’前缀来区分参数和选项。”\n\n如果你认识的朋友正在帮着买它们，那没关系。但如果是像我这样不一定了解手包选项的人，我必须有一个程序根据你指定的选项，在每一步都告诉我该做什么。让我们从一个\
  \ C 库函数开始。\n\n## 语法如下：\n\n```c\n#include <unistd.h>\nint getopt(int argc, char *const\
  \ argv[], const char *optstring);\nextern char *optarg;\nextern int optind, optterr,\
  \ optopt;\n```\n\n- `argc` 是参数的数量，包含了调用的函数。\n- `argv` 是参数列表。\n- `optstring` 是调用\
  \ `getopt()` 的程序可以接受的有效选项列表。这意味着，程序必须知道用户将传递什么样的选项，并且程序最好准备好一个 `switch case` 语句，根据传递的选项执行相应的操作。\n\
  \n如果一个像我这样不懂手包术语的用户传递了 `-b` 选项作为啤酒杯架，那么 `getopt()` 会识别出这超出了程序的范围并将其放入 `optopt` 中。因此，查看\
  \ `optopt` 就可以得到由不懂手包的用户传递的选项。\n\n由于这每次 `getopt()` 运行时都会更新，因此它通常在循环中运行。\n\n- `optind`\
  \ 是索引，帮助 `getopt()` 在下次被调用时使用。由于 `getopt()` 返回程序收到的下一个选项字符，`getopt()` 会一直运行，直到 `getopt()`\
  \ 返回 `-1`，这意味着没有更多选项了。如果遇到未知选项，它将返回 `?`，即问号字符。\n\n每个选项可能还有进一步的参数。例如，当你提到预算时，必须指定金额。该特定选项存在后续参数是通过选项字符旁边的\
  \ `:` 冒号指示的。该选项的指定参数也可以通过 `getopt()` C 库函数 `optarg` 访问。因此，你的程序将是：\n\n### fetchbag.c\n\
  \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <ctype.h>\n\
  int main(int argc, char *argv[]){\n    int option;\n    while((option = getopt(argc,\
  \ argv, \"zpmcd: a:\")) != -1)\n    {\n        switch(option) {\n            case\
  \ 'z':\n                printf(\"So you want a handbag with a zip.\\n\");\n    \
  \            continue;\n            case 'p':\n                printf(\"So you want\
  \ a handbag with a pocket.\\n\");\n                continue;\n            case 'm':\n\
  \                printf(\"So you want a handbag with a mirror.\\n\");\n        \
  \        continue;\n            case 'c':\n                printf(\"So you want\
  \ a handbag with a cellphone holder.\\n\");\n                continue;\n       \
  \     case 'd':\n                printf(\"You want a particular design. The design\
  \ is %s.\\n\", optarg);\n                continue;\n            case 'a':\n    \
  \            printf(\"You have a budget for this. The budget is %s.\\n\", optarg);\n\
  \                continue;\n            case '?':\n                if (optopt ==\
  \ 'a')\n                    fprintf(stderr, \"You need to be more specific for the\
  \ option, %c.\\n\", optopt);\n                    continue;\n                else\
  \ if (optopt == 'd')\n                    fprintf(stderr, \"For this option, you\
  \ need to specify a design %c\\n\", optopt);\n                    continue;\n  \
  \              else\n                    printf(\"Looks like you't know much about\
  \ handbags. %c is an invalid option.\\n\", optopt);\n        }\n    }\n}\n```\n\n\
