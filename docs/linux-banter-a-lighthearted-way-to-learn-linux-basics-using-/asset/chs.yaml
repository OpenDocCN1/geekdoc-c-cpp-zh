  \    return 0;\n}\n```\n\n在读取程序中，不需要创建内存。只需要键。\n\n`shm_reader_2995.c`\n\n```c\n\
  #include <sys/shm.h>\n#include <stdio.h>\n#define key 0x2995\nint main(){\n    int\
  \ shmid = shmget(key,BUFSIZ,0666);\n    char *str = (char *)shmat(shmid,0, 0);\n\
  \    printf(\"Data read from memory is %s\", str);\n    shmdt(str);\n    shmctl(shmid,IPC_RMID,NULL);\n\
  \    return 0;\n}\n```\n\n\n\n\n“那是那个提示他切换话题的信号。”\n\n“那是信号（CUE）。信号（CUE）。我说的是队列（QUEUE）。”\n\
  \n“哦，好的。”\n\n### Lingaraj:\n\n```c\n#include <sys/msg.h>\nint msgctl(int msqid,\
  \ int cmd, struct msqid_ds *buf);\nint msgget(key_t key, int msgflg);\nint msgrcv(int\
  \ msqid, void *msg_ptr, size_t msg_sz, long int msgtype, int msgflg);\nint msgsnd(int\
