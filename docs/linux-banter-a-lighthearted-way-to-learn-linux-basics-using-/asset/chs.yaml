  Return from select value is : 1\nThe client 4 is an already connected one. So read\
  \ data\nSize of buf is : 100 and received message: Because Seema learnt Linux\n\
  Loop 4 starting\nStarting select in loop 4 and waiting\n```\n\n这是在 `client_select_1.c`\
  \ 在发送消息之前等待 15 秒后的输出。这至少等待了 15 秒。\n\n\n\n\n二. 如果 `client_select_1` 进程在第一条消息（“Because\
  \ Seema learn Linux”）之后等待 10 秒并决定发送另一条消息，它将不会被服务器读取。因为我们已经从 `read_fd_set` 中移除了该\
  \ `fd`。在客户端关闭连接之前，理想情况下我们希望它留在 `read_fd_set` 中。有一种方法可以绕过这个限制。一种方法是获取 socket 上 `read`\
  \ 调用的返回值。如果激活时返回值为 0，则意味着客户端已关闭连接。随后我们会在服务器端关闭客户端的 socket 文件描述符。由于我们只关闭了客户端端已完成的\
  \ socket，而没有清除客户端端尚未完成的 socket，因此在下一次迭代中，开启的客户端 socket 文件描述符将留在检查读取活动的文件描述符集中。已关闭的则不会再次被激活。\n\
  \n此外，它显示“Loop 0”开始。这看起来并不对。因此，我们在 `server_select2.c` 中引入了这些更改。\n\n### server_select2.c\n\
