  \ `client_select_1.c` 和 `client_select_2.c`。\n\n我们在启动服务器的终端上得到以下输出：\n\n```text\n\
  Created a socket with fd : 3\nLoop 0 starting\nStarting select in loop 0 and waiting\n\
  Return from select value is : 1\nIt is a new connection to the server. So grant\
