  \ += SIZE_INCREMENT) {\n        region_of_interest.l_type = F_WRLCK;\n        region_of_interest.l_whence\
  \ = SEEK_SET;\n        region_of_interest.l_start = start_byte;\n        region_of_interest.l_len\
  \ = SIZE_INCREMENT;\n        region_of_interest.l_pid = -1;\n        // 在测试之前，我们填充了结构体。我们每次递增\
  \ 5 个字节。\n        printf(\"Testing for exclusive lock on region from %d to %d\\\
  n\", start_byte, start_byte + SIZE_INCREMENT);\n        res = fcntl(fd, F_GETLK,\
  \ &region_of_interest);\n        if (res == -1) {\n            fprintf(stderr, \"\
  F_GETLK failed!\");\n            exit(EXIT_FAILURE);\n        }\n        if (region_of_interest.l_pid\
  \ != -1) {\n            printf(\"No opportunity to lock exists by the process :\
  \ %d\\n\", getpid());\n            printf(\"Because of a lock by another process.\"\
  );\n            printf(\"The details including the process number of the locking\
  \ process are:\\n\");\n            printf(\"l_type %d, \", region_of_interest.l_type);\n\
  \            printf(\"l_whence %d, \", region_of_interest.l_whence);\n         \
  \   printf(\"l_start %d, \", (int)region_of_interest.l_start);\n            printf(\"\
  l_len %d, \", (int)region_of_interest.l_len);\n            printf(\"l_pid %d\\n\"\
  , region_of_interest.l_pid);\n        } else {\n            printf(\"F_WRLCK - Opportunity\
  \ to lock exists by this process with pid, %d\\n\", getpid());\n        }\n    }\n\
  \    close(fd);\n    exit(EXIT_SUCCESS);\n}\n```\n\n我们在后台运行 `lock_reg_ex.c`：\n`./lock_reg_ex.c\
  \ &`\n在另一个终端中运行：\n`./lock_reg_ex_test.c`\n\n第一个终端的输出是：\n`Process 34974 locking file`\n\
