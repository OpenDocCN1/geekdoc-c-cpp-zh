  n\");\n            exit(EXIT_FAILURE);\n        }\n        puts(ca1);\n        fflush(stdout);\n\
  \        sleep(4);\n        puts(ca2);\n        if(semop(id, &v, 1) < 0) {\n   \
  \         printf(\"Semop failed.\\n\");\n            exit(EXIT_FAILURE);\n     \
  \   }\n    }\n}\n```\n\n## 解析\n- `KEY` `0x1254` 定义了一个信号量标识符。\n- `union semun` 包含\
  \ `val`、`struct semid_ds *buf` 和 `unsigned short *array` 有些技术性，但对于实际操作，只需要知道定义它。这对于\
  \ `semctl` 是必要的。\n- `struct sembuf p = {0, -1, SEM_UNDO}` 和 `struct sembuf v = {0,\
  \ +1, SEM_UNDO}` 表示信号量的减法和增操作，类似于 `sem_wait` 和 `sem_post`。\n- `semget(KEY, 1, 0666\
  \ | IPC_CREAT)` 创建信号量，后续是测试其是否成功。\n- `semctl(id,0,SETVAL, u)` 初始化信号量。\n- `fork()`\
  \ 让我们判断是在子进程还是父进程中以执行相应的代码。\n- 在子进程中，我们开始信号量减法。正如你可能注意到的，这是一个二值信号量。\n- `semop(id,\
  \ &p, 1)` 和 `semop(id, &v, 1)` 处理减和增操作，并延迟 4 秒以确保同步。\n\n\n\n\n\n| Seemaloves YogaVijay$\
  \ 喜欢足球 |\n\n部分输出在 4 之后打印，因为父进程比子进程先结束了。\n\n你可能会怀疑并没有发生任何真实的通信。没有消息交换。但如果你留意，它们在时间上正在进行协调。这已经足以被称为进程间通信（IPC）了。\n\
  \n## IPC：共享内存\n\nLingaraj 说道：\n\n“想一想我给出的那个例子，我们在岩石附近的某个地方放了一个鸡尾酒配方。敲开那些石头。你甚至允许其他进程访问该内存位置。我告诉过你这很有用，因为当我们把配方放在那些石头上并回来收集时，会有那些昨晚上实验过的人添加更多的配方。”\n\
  \n![](img/image_rsrc84T.jpg)\n\n配方纸可以被看作内存。通过这张纸，醉鬼和我们之间共享信息。这比创建管道（pipes）或 FIFO\
  \ 要快得多。在这里应该确保没有两个进程在同时写入。\n\n系统调用如下：\n\n```c\n#include <sys/shm.h>\nint shmget(key_t\
  \ key, size_t size, int shmflg);\n```\n\n`key_t` `key` 是内存段的。你可以使用 `#define` 来定义键，但这个键必须被两个进程共同知道，以便于进程间通信。\n\
