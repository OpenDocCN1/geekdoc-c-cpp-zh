  ```\n\n## 套接字 (Sockets)\n\n“在准备面试的背景下，你可以自己对自己说话。我曾为了充分准备面试做过这种事。我以前会模拟面试小组，在脑子里组建三位绅士，并使用信号量、管道和消息队列与他们通信。当我懒得回答时，还会使用共享内存。有一次我上了一辆公交，除了我以外车上是空的，务员问我要票的数量。我说我有\
  \ 4 张，包括我脑子里的面试小组。”\n\n![](img/image_rsrc85H.jpg)\n\n“噢，天哪！你是怎么脱困的？”\n\n“噢，我想象的面试小组里的那些人非常老。他们最终一个接一个地去世了。那时一切就停止了。总之，重点是，你需要一套不同的工具来与他人通信。\n\
  \n让我们聊聊位于不同系统上的进程之间的通信。套接字。当然，你可以使用套接字在同一系统上通信，但它通常用于两个连接的系统之间的通信。\n\n有一次，我和一个女人被困在一个岛上。这是因为跳伞伞故障导致的。我们都降落在了岛上。当时是傍晚。\n\
  \n我问她：\n\n‘你想吃晚饭吗？’\n\n她正打着电话，沉浸在她的社交网站中。\n\n然后她抬头说：\n\n‘我不认识你。’\n\n于是我给她发了好友请求，她接受了。然后她给我发消息：\n\
  \n‘我在哪里见过你。’\n\n![](img/image_rsrc85J.jpg)\n\n所以，你打开一个套接字连接来处理两个不同的系统。有一种构建套接字的方法。\n\
  \n让我给你描述一个背景。我祖父制作了一台鸡尾酒售卖机。它有 3 个不同的出出口和额外的功能。这三个不同的出口是：\n\n1) 用于实际饮料。这种饮料根据客户的故事而变化。如果是财务危机，就是一种饮料；如果是关于无法原谅他人，就是另一种饮料；失败的感情又是另一种饮料，以此类推。\n\
  \n2) 用于零食。这些是饮料的配菜，用户可以选择低脂肪和无罪恶感版本。\n\n3) 用于个性化消息。我祖父以前写过很多名言。我很喜欢他的一句特定的名言：‘别担心你赚了多少钱，你仍然是可以生物降解的。’所以，会根据客户的情况发放合适的消息。\n\
  \n每个售卖口都是通过贴上贴纸来命名的，贴纸上方有一个数字，它们还配有一个放置硬币的槽。当然，没有什么是免费的，如果你只需要消息而不需要饮料，你可以单独为之付费并获取它。”\n\
  \n所以，如果我必须给你一个类比的话。\n\n这些出出口在他制作时被称为**端口 (ports)**。一个用于饮料，一个用于零食，另一个用于消息。\n\n然后他必须进行组织。他必须决定关于如何提供饮料的某些技术细节，是必须倒出来，还是以小包提供。\n\
  \n这是他向他人提供服务并赚钱的想法。\n\n他是一个很活跃的人，不相信被动收入，更多是因为他想听听别人的的故事。所以，他没有自动化这个过程。他用笔记本来分配端口号、技术细节以及鸡尾酒售卖机放置的位置。这构成了一个包：端口号、技术细节和地址。他把这个包称为**套接字\
  \ (socket)**。虽然我们只在讨论一台机器，你可能会质疑地址的必要性，但他有扩张计划。\n\n## 技术细节\n\n这些分配器每一个都有一个关联的按钮。当新客户来并按下按钮时，他会向外看并竖起耳朵表示他在听。傍晚时，会有很多客户过来。\n\
  \n现在，我的祖父正在听并已准备好了。客户不能走进来就开始讲述他的诉苦故事。他必须先投一个硬币，投到分配出口旁相关的硬币槽里。然后我的祖父会看到硬币，一眼就能验证其真伪。\n\
  \n在接受后，我的祖父会写一个数字告诉客户他的连接现在已被接受。在客户端侧，客户需要意识到他需要什么，他是需要饮料还是消息，以及它们在哪个端口被提供。\n\n\
  让我们看一些系统调用。\n\n```\n#include <sys/types.h>\n#include <sys/socket.h>\nint socket(int\
  \ domain, int type, int protocol);\n```\n\n套接字就像一个文件描述符。\n\n\n\n\n```c\n#include\
  \ <sys/socket.h>\nint bind(int socket, const struct sockaddr *address, size_t address_len);\n\
  ```\n\nsocket 是套接字数字。`sockaddr` 结构包含了服务器端口号、族和 IP 地址，通过将其绑定到套接字数字，并将 socket 文件描述符封装成一个包，因此，对\
  \ socket 文件描述符的引用意味着我们正在访问特定的端口和网络地址。\n\n端口（port）和 socket 的区别在于：端口是 socket 的一部分。\n\
  \n地址是包含内容的结构：\n\n```c\nstruct sockaddr_in {\n    short int sin_family;\n    unsigned\
  \ short int sin_port;\n    struct in_addr sin_addr;\n};\n```\n\n`sin_family` 可以是\
  \ `AF_INET`，尽管还有其他可能性。\n\n`sin_port` 是端口号，`in_addr` 是 IP 地址。\n\n如果客户端必须通过 socket\
  \ 跨网络连接，它需要服务器计算机的 IP 地址。IP 地址类似于 `255.255.255.255` 这种格式，其中 `255` 是最大值。这是一种识别设备的方式。\n\
  \n`sin_addr` 是 IP 地址结构：\n\n```c\nstruct in_addr {\n    unsigned long int s_addr;\n\
  };\n```\n\n成功时返回 `0`，错误时返回 `-1`。\n\n错误类型：\n\n| Error | Description |\n| :--- | :---\
  \ |\n| `EBADF` | 无效的文件描述符 |\n| `ENOTSOCK` | 不引用 socket。 |\n| `EINVAL` | 已经存在相同命名标识符的\
  \ socket。 |\n| `EADDRNOTAVAIL` | 地址不可用 |\n| `EADDRINUSE` | 该地址已绑定了 socket。 |\n\n\
  ```c\n#include <sys/socket.h>\nint listen(int socket, int backlog);\n```\n\n这使得\
  \ socket 能够监听传入的连接并分配一个连接队列。`backlog` 是等待处理连接的最大数量。\n\n一旦服务器在执行上述调用后准备好监听，客户端就可以发起请求了。\n\
  \n服务器可以使用此系统调用来接受连接：\n\n```c\n#include <sys/socket.h>\nint accept(int socket, struct\
  \ sockaddr *address, size_t *address_len);\n```\n\n`accept()` 系统调用会创建一个新的 socket\
  \ 与该特定客户端通信，并返回其文件描述符。如果服务器必须为许多客户端提供服务，这将非常有帮助。这是一个重要的这一点：对于每个连接到服务器 socket 的客户端，在执行\
  \ `accept` 之后都会分配另一个数字。客户端的地址被存放在 `sockaddr` 结构中。\n\n如果没有客户端，`accept` 调用将阻塞。但你可以通过以下方式更改它：\n\
  \n```c\nint flags = fcntl(socket, F_GETFL, 0);\nfcntl(socket, F_SETFL, O_NONBLOCK|flags);\n\
  ```\n\n在 `flags` 中使用 `O_NONBLOCK` 设置。\n\n在客户端侧，我们只需要连接、发送或接收以及关闭。\n\n```c\n#include\
  \ <sys/socket.h>\nint connect(int socket, const struct sockaddr *address, size_t\
  \ address_len);\n```\n\n该 socket 是客户端的 socket 而不是服务器的 socket。服务器的规范在 `sockaddr`\
  \ 结构中给出，包含 IP 地址、端口号等。\n\n成功时返回 `0`，错误时返回 `-1`。错误可能是：\n\n| Error | Description |\n\
  | :--- | :--- |\n| `EBADF` | 无效的文件描述符 |\n| `EALREADY` | 该 socket 正在进行连接 |\n| `ETIMEDOUT`\
  \ | 连接超时 |\n| `ECONNREFUSED` | 连接被服务器拒绝。 |\n\n你可以像对待文件描述符一样对 socket 使用 `write` 和\
  \ `read` 系统调用。\n\n当我们进入编程阶段时，你将看到这一点。\n\n```c\nint close(int socket)\n```\n\n关闭\
  \ socket。这既可以用于服务器端，也可以用于客户端。\n\n在之前的进程间通信（Inter-process Communication）示例中，我们必须使用\
  \ socket。这是理解通信的基本方法。\n\n\n\n\n\n`writefds` 用于写入就绪，`errorfds` 用于我们想要检查错误条件的文件描述符集合。\n\
  \n`timeval` 结构体包含两个成员，一个指定用户时间，另一个指定微秒为单位的时间。\n\n这是超时值，当这段时间过去后，`select` 将带有已激活的文件描述符返回。\n\
  \n```c\n#include <sys/types.h>\n#include <sys/time.h>\nvoid FD_ZERO(fd_set *fdset);\n\
  void FD_CLR(int fd, fd_set *fdset);\nvoid FD_SET(int fd, fd_set *fdset);\nint FD_ISSET(int\
  \ fd, fd_set *fdset);\n```\n\n上述是一组宏。\n\n- `FD_ZERO` 初始化文件描述符集合，无论是 `readfds` 还是\
  \ `writefds` 或 `errorfds`。\n- `FD_CLR` 从文件描述符集合中移除一个文件描述符。\n- `FD_SET` 向文件描述符集合中添加一个文件描述符。\n\
  - `FD_ISSET` 检查属于特定文件描述符集合的文件描述符是否激活。这在 `select` 返回后进行，以查看我们感兴趣的文件描述符是否准备好进行读、写或是否存在错误条件。\n\
  \n我们很快将在一个程序中看到这些操作的运行情况。\n\n还有几个函数需要过一遍。\n\n不同类型的计算机在通过网络传输的多字节整数值上达成了一致，并使用了网络字节序。特别是端口号。不同的计算机可能使用不同的方式来表示所需的数字。我的门牌号是\
  \ `1\\.`。在我的脑海中，我把它看作：\n\n```\n((-b) ± √(b²-4ac))\n```\n\n`2a`\n\n其中\n\n`a = 3`\n\
  `b = -6`\n`c = 3`\n\n出于某种原因。如果我从外卖服务点餐，我不能把这个放在地址框里。我必须输入 `1\\.`。因此，我们有函数充当原生主机格式与标准网络之间的中介桥梁。\n\
  \n```c\n#include <netinet/in.h>\nunsigned long int htonl(unsigned long int hostlong);\n\
