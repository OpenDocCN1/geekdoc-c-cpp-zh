  \ `difftime`：\n\n```c\n#include <time.h>\ndouble difftime(time_t time1, time_t time2);\n\
  ```\n\n这将给出秒差。\n\n如果你必须将一个分解的结构转换为原始时间，使用这个：\n\n```c\n#include <time.h>\ntime_t\
