  \n这用于控制共享内存。\n\n`shm_id` 是来自 `shmget` 的返回值。\n\n命令可以是 `IPC_STAT` 用于获取共享内存段的状态信息。\n\
  \n`IPC_RMID` 意味着控制。它从系统中移除共享内存段，销毁它并销毁 `shmid_ds` 数据结构。\n\n`shmid_ds` 结构包含了关于内存段的更多细节。\n\
  \n让我们来看这个写入程序，\n\n`shm_writer_1254.c`\n\n```c\n#include <sys/shm.h>\n#include <stdio.h>\n\
