  trans: "\n上述程序中发生的情况是：使用 `fork` 创建了一个子进程，我们通过 `fork` 的返回值判断程序现在是处于父进程还是子进程中。在第一次实例中，它处于子进程中，因为\
    \ `fork` 返回值为 `0`。然后我们从第一个文件描述符中进行读取。现在，一个与正在执行的程序不同的进程成功地从你编写的程序中读取了内容，尽管这是一个子进程。因此，某种通信正在发生。这很容易，因为子进程继承了文件描述符。但如果程序是完全不同的呢？\n\
    \n我们需要两个程序。让我们把这一个称为生产者程序，因为它提供了要传递的数据。我们将将其命名为 `pipe_prod.c`。\n\n### pipe_prod.c\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include\
    \ <string.h>\nint main(){\n    int total_bytes;\n    int filed_pipe[2];\n    const\
    \ char chars_passed[] = \"Crocodile Doctor\";\n    char buffer[BUFSIZ + 1];\n\
    \    pid_t fork_success;\n    memset(buffer, '\\0', sizeof(buffer));\n    pipe(filed_pipe);\n\
    \    fork_success = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"\
    Fork Failure\");\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success\
    \ == 0)\n    {\n        sprintf(buffer,\"%d\", filed_pipe[0]);\n        (void)\
    \ execl(\"pipe_cons\",\"pipe_cons\", buffer, (char*) 0);\n        printf(\"This\
    \ is the child process,but this text won't be displayed because execl finishes\
    \ off the calling process.\");\n        exit(EXIT_FAILURE);\n    }\n    else\n\
    \    {\n        total_bytes = write(filed_pipe[1],chars_passed, strlen(chars_passed));\n\
    \        printf(\"This program wrote %d bytes - %s\\n\", total_bytes, buffer);\n\
    \    }exit(EXIT_SUCCESS);}\n```\n\n“第一个变化是 `sprintf` 函数。它将传递给 `pipe` 的数组中的第一个文件描述符捕获到缓冲区\
    \ `buffer` 中。也就是说，它将存储在 `filed_pipe[0]` 中的文件描述符值打印到 `buffer` 中。因为我们之后调用的第二个程序将不会继承这些文件描述符，”Lingaraj\
    \ 解释道。\n\n“但是有一个对 `fork` 的调用，”Seema 说。\n\n“是的。逻辑是，如果我们使用 `execl` 调用另一个程序（我们确实会这么做），调用进程就会被消除，尽管进程\
    \ ID 仍然存在。这就像 Arun 完全接管了我的位置，而我不再那里了。所以，该进程结束了。我们调用 `fork` 创建子进程，然后从子进程中调用 `execl`。这样，父进程被保留，而子进程结束。因此，在调用\
    \ `execl` 后，你不会看到 `printf` 语句中的文本‘This is the child process,but this text won't\
    \ be displayed because execl finishes off the calling process.’”\n\n在 `execl`\
    \ 中，我们调用了要执行的程序 `pipe_cons`，并提供了两个信息：其一是作为调用程序参数的程序名称；另一个是存储存储在 `buffer` 中的文件描述符。因此，通过\
    \ `execl` 调用的程序将拥有这些信息。\n\n让我们来看看接收数据的消费者程序。它命名为 `pipe_cons`。\n\n### pipe_cons.c\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include\
    \ <string.h>\nint main(int argc,char *argv[]){\n    int bytes_ex;\n    char buffer[BUFSIZ\
    \ + 1];\n    int file_des;\n    memset(buffer,'\\0',sizeof(buffer));\n    sscanf(argv[1],\"\
    %d\", &file_des);\n    printf(\"The argument to the consumer program is %s\\n\"\
    , *argv);\n    bytes_ex = read(file_des, buffer, BUFSIZ);\n    printf(\"The process\
    \ %d has read %d bytes. Content : %s \\n\", getpid(), bytes_ex, buffer);\n   \
    \ exit(EXIT_SUCCESS);}\n```\n\n这是通过 `sscanf` 传递的数据。但还有一个对 `memset` 的调用。\n\n```c\n\
    #include <string.h>\nvoid *memset(void *s, int c, size_t n);\n```\n\n这是通过 `sscanf`\
    \ 传递的数据。但还有一个对 `mkfifo` 的调用。\n\n```c\n#include <sys/types.h>\n#include <sys/stat.h>\n\
    int mkfifo(const char *filename, mode_t mode);\n```\n"
- fmt: "\nan error, -1, and the FIFO won’t be opened. If a process does have the FIFO\
    \ open for reading, the file descriptor returned can be used for writing to the\
    \ FIFO.”\n\n“Okay, so the assistant calls you, but if you are not reachable, he\
    \ will put it down as an error. But if you are reachable on the phone, he can\
    \ communicate. Sounds lopsided. As you said, it’s strange.” said Seema.\n\n“You\
    \ won’t believe it, but this actually happened. After he called me inside the\
    \ house to talk to her directly, he would not let us be alone. He used to scrutinise\
    \ my every word. I got adventurous and tried to sneak in a message between all\
    \ the multithreading concepts.\n\nI said:\n\n```\nfree()\nprintf(\"Lunch and ice\
    \ cream\\n\");\n```\n\nsomewhere between the lines. I thought only Suparna would\
    \ understand it. Her dad understood it as well.\n\n“So, where there ought to have\
    \ been lunch, there was a punch and you screamed?”\n\n“No, that guy got all dressed\
    \ up and ready. He was beaming. He told his daughter, ‘This guy is offering us\
    \ free lunch with ice cream. We should not deny the requests of our guests.’ Then\
    \ all of us went and I had to get them both lunch and ice cream at this 5 star\
    \ hotel.\n\n![](image_rsrc85G.jpg)\n\nHe had even brought a hot box with him to\
    \ get the night’s dinner packed. I told them I had no money. But they went about\
    \ their eating. After he had the ice cream, the waiter came.\n\n‘Sir, pleased\
    \ to serve the owner of out hotel.’ the waiter said.\n\nI was shocked. Suparna’s\
    \ father was the owner of the 5 star hotel. So this was a trick all along. He\
    \ actually liked me and this was the surprise. What Suparna’s father said next\
    \ floored me.\n\n‘Please give the bill to this young man here.’\n\n“But…” I began.\
    \ The both of them got up and left.\n\nThen the waiter told me that Suparna’s\
    \ father was the biggest miser in town.\n\nI had to wash the dishes of course.\
    \ I also found out later that the guy had been making copies of my notes on Linux\
    \ threading and selling them.\n\nAnyway, let’s move on. We can read and write\
    \ to fifos after we create them and access it using a file descriptor. \n\n```c\n\
    #include <unistd.h>\nint access(const char *pathname, int mode);\n```\n\nThe above\
    \ command checks to see whether a file given by the `pathname` exists. The mode\
    \ is usually `F_OK`.\n\nIf the number of bytes being written is greater than `PIPE_BUF`\
    \ defined in `limits.h`, let’s just say the write fails. There could be a case\
    \ where many programs are writing to the FIFO and in such a scenario, rather than\
    \ interleave the data, you would be safe if the size does not exceed `PIPE_BUF`.\n\
