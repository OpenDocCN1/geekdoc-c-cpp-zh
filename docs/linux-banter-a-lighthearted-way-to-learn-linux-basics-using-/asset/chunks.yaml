    sem_flags let you modify behaviour. The above system call can return the value
    of an existing semaphore identified by the key or if the flag is 0.


    Other values of sem_flags are akin to the mode in open(). Write means the value
    of the semaphore can be altered. And execute permission means nothing.


    The least significant 9 bits of sem_flags represent the permissions.


    It returns the semaphore identifier, a non negative integer. If it fails, it sets
    ERRNO and returns -1.


