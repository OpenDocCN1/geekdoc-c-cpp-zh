    “Contact Gidaa ”    ;;crocodileconversation)    echo “Contact Lingaraj ”    ;;*)    echo
    "Lingaraj can help"esac |


    So, for each case of user input, there is a different output. You end the statement
    with esac. This is the syntax to follow.” said Lingaraj.


    “Would you help me in talking to a crocodile?” asked Seema.


    “You don’t want to do that. It hardly shuts it’s mouth once it opens. If ‘if’
    has to sift through different statements life can become difficult. So we have
    the && list. The && list is like a sequential test. Example


    seqtest.sh


    | echo Can you climb trees?read treeclimbecho  Do you know how to cook millets?read
    cookmilecho Can you run faster than a gazelle?read gazecho Can you sing ghazals?read
    ghazif [ $treeclimb=“yes” ] && [ "$cookmil"=“yes” ] && [ "$gaz"=“yes” ] && [ "$ghaz"=“yes”
    ] ; thenecho Will you marry me?fi |


    said Lingaraj as he showed Seema what he typed.


    “I predicted the marriage proposal.” said Seema.


    “So, only if all the conditions are satisfied, the final proposal is displayed
    on the screen. This was written 4 years ago. Now I have changed it. See.”


    Lingaraj showed her the new version of the program.


    seqtest_or.sh


    | echo Can you climb trees?read treeclimbecho  Do you know how to cook millets?read
    cookmilecho Can you run faster than a gazelle?read gazecho Can you sing ghazals?read
    ghazif [ $treeclimb=“yes” ] &#124;&#124; [ "$cookmil"=“yes” ] &#124;&#124; [ "$gaz"=“yes”
    ] &#124;&#124; [ "$ghaz"=“yes” ] ; thenecho Will you marry me?fi |


    The double pipe is an OR list. Even if one condition is satisfied, it proceeds
    to propose.”


    “I think you really need to get engaged. I will introduce you to some women. You
    are a nice guy.” said Seema sensing the session was over.


    The next day Seema woke up to the sound of knocking. Lingaraj came inside with
    boxes of bananas, apples and pineapples.


    “Thanks for your gesture.” said Lingaraj and left.


    They started the session at the usual time. Lingaraj began.


    “Now, functions. If you have a function in the house, a ceremony or a ritual,
    you don’t do everything. You delegate all the different work to different contractors.
    Food for one, the decorations for another, invitation cards to one guy, welcoming
    to another,etc. So, you can concentrate on what you do. Each guy can be called
    whenever the need arises.


    Here’s a function example.”


    Lingaraj showed Seema a shell script.


    foodfunc.sh


    | #!/bin/shfood() {echo “Food is being prepared.”}echo “script started”foodecho
    “script ends”exit 0 |


    Lingaraj ran the shell script and the output was shown on the screen.


    | script startedFood is being prepared.script ends |


    You call a function, the function executes.


    When you marry Vijay, please use me as a function to bring the horse the groom
    rides on. One of my hobbies is catching horses near the forest and training them.”
    said Lingaraj.


    “Really? I don’t believe it.”


    “I have a hard disk full of those videos. Wait, I will show you.”


    ![](image_rsrc83U.jpg)


    Lingaraj removed a hard disk drive from his cupboard and connected it to the laptop.
    Then he stopped.


    “What happened?” asked Seema.


    “The hard disk of horses did not mount.”


    Lingaraj continued.


    “In case of functions, the $* $1 $2 are replaced until the function finishes,
    by the parameters of that particular function. So too, variables. Variables for
    use within the function are called local variables.


    Suppose you have a budget of 2 crore rupees earmarked for the whole function.
    And the value of the budget variable, $budget is 2 crore. But you will be paying
    me 20 lakhs for getting the horse. So, the budget variable in my function, $budget
    will be 20 lakhs.


    “That’s too much. Give me a discount.” asked Seema.


    “Neigh!”


    They both laughed. Seema was finding Linux enjoyable and Lingaraj made her feel
    she could one day find it in her to program Vijay and make him revert to being
    human again.


    Lingaraj showed her another shell script.


    paramdiff.sh.


    | #!/bin/shparamshow() {var="Lingaraj’s function"echo The variable var inside
    the function is $varecho The first parameter for this function is $1} |


    The main part of the shell script goes like this:


    | var="Seema’s wedding"echo The variable var in the program is $varecho Original
    first parameter for this program is $1paramshow Lingarajexit 0 |


    Lingaraj ran it using the command :


    | $ sh ./paramdiff.sh Seema |


