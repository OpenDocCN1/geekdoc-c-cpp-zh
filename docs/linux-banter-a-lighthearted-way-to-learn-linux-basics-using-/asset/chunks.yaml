    thing and I had to search in this thing for that thing to make this thing work
    like the thing I was used to. So I went to this guy selling this thing you use
    for that thing and that guy asked for this thing you see and….”


    “Stop. You can go.” said Lingaraj.


    Thimma walked back into his shed.


    “I get the drift. ‘Thing Thimma’ has a nice ring to it.” said Seema.


    “So, Thimma treats everything as a thing. From nuts, gears, press, machines, the
    phone etc. And Linux, too does the same. Everything is a file. From text files,
    programs, directories, devices, Linux treats everything as a file.”


    “Ok”


    “In Linux there are commands to work with files. Now ‘open’. What does this command
    do?” Lingaraj asked Seema.


    “Opens the file.”


    “Close?”


    “Closes the file.”


