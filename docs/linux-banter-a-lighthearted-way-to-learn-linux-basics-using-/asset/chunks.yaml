    ![](image_rsrc820.jpg)​LINUX BANTER


    Linux® is the registered trademark of Linus Torvalds in the US. and other countries.


    All characters are fictitious. Any resemblance to any person living or dead is
    merely coincidental.


    The GNU General Public License


    The source code in the book is made available under the terms of the GNU General
    Public License version 3, http://www.gnu.org/licenses/gpl-3.0.en.html


    Disclaimer :


    Some of the source code that are machine dependant might or might not work in
    some machines. All the code has been tested on our computers and we haven’t noticed
    anything that can harm the system. However, we are not responsible for any damages
    that misuse of these programs can cause to your system.


    Who this book is for:


    It is a book for those interested in getting a bird’s eye view of Linux technicalities
    and what can be done vis a vis Linux  system calls and some C library functions.
    This book outlines the tools that can be used to write programs and what the Linux
    system offers a casual reader. Please note that this book is intended to make
    light reading compatible with learning some Linux basics. This is not a book for
    Linux administration and it does not impart knowledge on installation of Linux.


    We also urge you to use this powerful system called the computer, built upon decades
    of hard work by dedicated people, making it an epitome as well as a stable base
    for the progress of our civilization, responsibly and with confidence. Programming
    has immense potential and it definitely can be used to usher in positive changes
    in the world. Hope you have fun going through this course. This content outlines
    the various ways a programming language can be used to program a system. There
    are utilities as well. The approach that can be learned from this can be extended
    to understand other programming languages as well. Of course, it is impossible
    to cover all aspects of the Linux system in this, because of the sheer volume
    of programs and efficient contributions from around the world. But it provides
    a base from which the reader can get her feet wet.


    Requisites :


    You need a Linux system with the GNU C Compiler installed and an elementary knowledge
    of C.


