  raw: 'Seema had never heard such nonsense in her life. But Lingaraj made it sound
    so convincing.


    “Let’s move on.” said Seema.


    “You can use system calls or C library functions. System calls are expensive.”


    “Expensive in what sense?”


    “There was this guy called Ceremony Seena. Every time we used to call him, he
    used to come with a caravan and a retinue. And there was this huge ritual to invite
    him and protocol to receive him.


    He lived on the main road that connected all the roads. His entourage would block
    the roads for hours. He was a well connected man who was in touch with people
    in the higher echelons of power. If a message needed to be passed to those powerful
    people, people had to speak to him. But whenever anybody called him, he would
    make a pompous ceremony. And we had to feed him, feed his followers etc. We had
    to make the switch between doing our work and looking after him. Overheads. So,
    later people devised these approaches where they called him once and finished
    with all the jobs. System calls are like calling Seena. Very expensive. But having
    people work out the details and finish all his jobs, it’s like high level access.
    So, we have C library functions for these.


    An example is the standard I/O library. You might have data storage that deals
    with blocks of data. The standard I/O library makes the data to be sent to the
    storage, tailor made even if it’s a file that’s not used to writing in blocks
    of data.


    So, how do you find out whether a call is a system call or a function?


    C library functions are described in section 3 of the man pages. The section 2
    is for system calls.


    So, if you type


    | $ man 2 fopen |


    It says


    | No manual entry for fopen in section 2 |


    However, if you type


    | $ man 3 fopen |


    It shows the entry of fopen.


    For the rest of the time, I use the phrase ‘C library function’ and the word ‘function’
    for C library functions. For a function within the program, like a routine, I
    use just function. You have to identify whether I am talking about a C library
    function or a routine.


    File descriptors. You so badly want to open some files in Vijay’s system.”


    “And write to them.”


    “You need file descriptors for that.”


    “What’s a file descriptor?”


    “It’s an integer associated with a file. And how is it different from an inode?
    An inode is a structure that has info about the files. A file descriptor is used
    in system calls. It is used by the system to refer to an open file.”


    He then showed her a program.


    writestd.c


    | #include <stdio.h>#include <unistd.h>#include <stdlib.h>int main(){if ((write(1,
    “Standard output’s file descriptor is 1”, 38)) != 38)write(2, “Error writing to
    even standard output.”,39);exit(0);} |


    What the above program does is, tries to write the first message indicated by
    write, “Standard output’s file descriptor is 1” to the standard output whose file
    descriptor is 1\. The string has 38 characters excluding the double quotes. It
    returns the number of bytes written. One byte per character. If all the bytes
    weren’t written, then it moves to the next line and prints the error message,
    “Error writing to even standard output.” to standard error, whose file descriptor
    is 2\. The file descriptor for standard input is 0.


    readinp.c


    | #include <stdio.h>#include <unistd.h>#include <stdlib.h>void main(){printf(“Please
    input some text.\n”);  char readinp[128];  read (0, readinp, 17);  printf("%s",
    readinp);} |


    The above program reads 17 characters from standard input which happens when you
    type after running the program. Then it promptly prints the first 17 characters
    of what you typed. So, the syntax for the read and write system calls are :


    | #include <unistd.h>size_t read(int fildes, void *buf, size_t nbytes);#include
    <unistd.h>size_t write(int fildes, const void *buf, size_t nbytes); |


    The <unistd.h> is a header file. A header file contains declarations and macros.
    It does not contain implementations unlike a library which can do a job. It simply
    calls functions that do a job. You might have wondered in some organisations,
    there are heads who don’t do any work, but know people, especially those who study
    in libraries, who can work, even though the heads themselves know nothing about
    implementation. I said this only to help you remember. You can write your own
    header file, but if you want to include it, you use


    #include “myheaderfile.h”


    Also, let me talk about system calls. The kernel is not freely available to one
    and everybody. It is quite reserved having allocated a part of it for users to
    utilise the system. But sometimes you need the kernel for some operations. They
    could be process control, file or device management etc. The user cannot have
    the audacity to alter these things on his own. He needs to request the kernel
    for support and the kernel, with it’s rules allows the program to work on the
    operations. So, the mode is called supervisor mode or kernel space because it
    involves the kernel’s supervision.


    Each system call, read or write, returns the number of bytes read. ‘filedes’ is
    the file descriptor. *buf is the character string which you have to declare beforehand
    and nbytes is the number of bytes. In ‘read’ the content is placed on the character
    string pointed to by buf and in write this can be an actual string. I will take
    you to a play.”


    Seema was getting used to this unpredictability.


    They both went on a bicycle on the same road which Seema had taken to get to the
    camp.


    ![](image_rsrc84G.jpg)


    They reached a mud building and an open air theatre. There were about 20 people
    in there. Lingaraj introduced Seema to the director Nithin and a few actors. Then
    they watched the rehearsal of the play.


    “Notice carefully.” said Lingaraj.


    The actor Prashanth got into the character of a one ‘Odubari’. It was about an
    academic. Then Nithin, who wrote the play and who was the director as well made
    some changes in the script. He called out the actor, Prashanth by his character
    name, ‘Odubari’ and the character spoke his lines.


    ![](image_rsrc84H.jpg)


    Lingaraj spoke to Seema in a hushed tone.


    “Now, every character in the play, once he gets into the character has a character
    name.”


    The director Nithin then called Prashanth by his character name, ‘Odubari’ and
    gave him a few lines.


    Lingaraj continued.


    “A file descriptor if you will. The dialogue writer opens this file, that is reads
    the dialogues by calling him, by his character name and asking him to tell the
    dialogue and even adds some dialogues. And even though the lines are meant for
    the character, Prashanth does remember them in his real life. This is like the
    read and write operation.


    So, if it helps you remember,


    The person Prashanth. A normal file.


    Prashanth as ‘Odubari’. A descriptor.


    Using the character name to write dialogues, append or remove etc. can be thought
    of as a parallel to the read() and write() system calls.”


    Lingaraj took this opportunity to tell another story from his life.


    “I once wanted to act in a play when I was in the city. There was a call for auditions
    from director Ranganath which I saw online. I caught an autorickshaw and told
    the auto driver that I wanted to go to Director Ranganath’s house and the area
    in which he lived. They had sent the audition lines via email and I practised
    them in the autorickshaw. Then I reached a big house with a lawn. I saw a lot
    of people waiting. I asked somebody who looked like the manager to let me meet
    Director Ranganath. He asked me to wait. I saw people of all ages and then I saw
    the lawn. I thought I would go there and practice, thus having an advantage over
    a![](image_rsrc84J.jpg)ll these idiots who weren’t practising.


    I started practising in the lawn and rendered the monologue.


    “What kind of a man are you? You are a corrupt person having cheated the government
    and the people. This is the time to expose you and let the world know your nefarious
    deeds.”


    A lot of people came running and started hitting me. I managed to get the question
    out.


    ![](image_rsrc84K.jpg)'
