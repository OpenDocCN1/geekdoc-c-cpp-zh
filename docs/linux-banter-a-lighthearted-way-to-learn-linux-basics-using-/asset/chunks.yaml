- fmt: "\nA process waiting for a resource to be available based on the status of\
    \ a variable.\nA process executes using a resource when available based on the\
    \ status of a variable.\nA process changes the status of a variable after it’s\
    \ job is done.\nA process changes the status of a variable before it begins it’s\
    \ job.”\n\n“Ok.”\n“In the case of the doctors vs film makers, the switch is key.”\n\
    “The bulb.” Seema tried to correct.\n“They are part of one package. The switch\
    \ comes free with the bulb. They have to be connected, or why else would it cause\
    \ an electric shock?”\n“No, the bulb has to be connected with the switch or how\
    \ else would it light?”\n“Good perspective.”\n\n## System calls related to semaphores\n\
    \n### semget\n```c\nint semget(key_t key, int num_sems, int sem_flags);\n```\n\
    `key` is basically the resource identifier.\n\n“Something like the operation room.\
    \ A reference to the operation room.”\n“If there is a resource, `num_sems` is\
    \ the number of semaphores. Usually 1.\n\n`sem_flags` let you modify behaviour.\
    \ The above system call can return the value of an existing semaphore identified\
    \ by the `key` or if the flag is 0.\n\nOther values of `sem_flags` are akin to\
    \ the mode in `open()`. Write means the value of the semaphore can be altered.\
    \ And execute permission means nothing.\nThe least significant 9 bits of `sem_flags`\
    \ represent the permissions.\n\nIt returns the semaphore identifier, a non negative\
    \ integer. If it fails, it sets `ERRNO` and returns -1.\n\n“Like the switch. A\
    \ reference to the switch rather.”\n\n### semop\n```c\nint semop(int sem_id, struct\
    \ sembuf *sem_ops, size_t num_sem_ops);\n```\n`sem_id` is what `semget` returned,\
    \ the semaphore identifier.\n`sem_ops` is a pointer to an array of structures.\
    \ The important members are:\n\n```c\nstruct sembuf {\n    short sem_num;\n  \
    \  short sem_op;\n    short sem_flg;\n}\n```\n`sem_num` is the semaphore number\
    \ in terms of count. 0 if it’s only 1 semaphore.\n`sem_op` perhaps the most important\
    \ because it is the value by which the semaphore has to be changed. -1 and +1\
    \ are the ones generally used.\n`sem_flag` is set to `SEM_UNDO` and it helps the\
    \ OS release the semaphore in case the process terminates before it releases the\
    \ semaphore.\n\n### semctl\n```c\nint semctl(int sem_id, int sem_num, int command,\
    \ ...);\n```\nThis system call lets you directly control semaphore information.\n\
    The first parameter is the semaphore identifier returned by `semget()`. `sem_num`\
    \ again is the semaphore number in terms of count. 0 for only 1 semaphore.\n\n\
    The `command` parameter can be:\n- `SETVAL`: Used at the beginning to initialise\
    \ the semaphore to a value.\n- `IPC_RMID`: This is when you need to delete a semaphore\
    \ after use.\n\nThere can exist named semaphores as well. But I will not get into\
    \ it.\n\n## Program without a semaphore\n\n### seema_loves_yoga.c\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\nint main(int argc,char\
    \ *argv[]) {\n    int i;\n    pid_t pid;\n    pid = fork();\n    if(pid < 0) {\n\
    \        printf(\"Fork failed.\\n\");\n        exit(1);\n    }\n    else if(pid\
    \ == 0) {\n        char *ca1 = \"Vijay\";\n        char *ca2 = \"loves football\"\
    ;\n        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n        puts(ca2);\n\
    \    }\n    else {\n        char *ca1 = \"Seema\";\n        char *ca2 = \"loves\
    \ Yoga\";\n        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n  \
    \      puts(ca2);\n    }\n}\n```\nHere, a `fork` is called and each process, the\
    \ parent and the child print a character, twice in a for loop after a `sleep`.\
    \ We assume that characters in one process are printed one after the other. But\
    \ see the output:\nSeema\nVijay loves football\nThe kernel sneaked in the child\
    \ process while the parent process was in the loop and tried to catch a few, not\
    \ allowing either the parent or the child process to print strings in sequence.\
    \ So, we use semaphores to get the critical section committed.\n\n### seema_loves_yoga_sem.c\n\
    ```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <sys/sem.h>\n\
    #define KEY 0x1254\n\nunion semun {\n    int val;\n    struct semid_ds *buf;\n\
    \    unsigned short *array;\n};\nstruct sembuf p = {0, -1, SEM_UNDO};\nstruct\
    \ sembuf v = {0, +1, SEM_UNDO};\n\nint main(int argc,char *argv[]){\n    int id\
    \ = semget(KEY, 1, 0666 | IPC_CREAT);\n    if (id < 0) {\n        printf(\"Couldn't\
    \ create semaphore.\\n\");\n        exit(EXIT_FAILURE);\n    }\n     semun u;\n\
    \    u.val = 1;\n    if(semctl(id,0,SETVAL, u) < 0) {\n        printf(\"Semctl\
    \ failed.\\n\");\n        exit(EXIT_FAILURE);\n    }\n    int i;\n    pid_t pid;\n\
    \    pid = fork();\n    if(pid < 0) {\n        printf(\"Fork failed.\\n\");\n\
    \        exit(1);\n    }\n    else if(pid == 0) {\n        char *ca1 = \"Vijay\"\
    ;\n        char *ca2 = \"loves football\";\n        if(semop(id, &p, 1) < 0) {\n\
    \            printf(\"Semop failed\");\n            exit(EXIT_FAILURE);\n    \
    \    }\n        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n     \
    \   puts(ca2);\n        if(semop(id, &v, 1) < 0) {\n            printf(\"Semop\
    \ failed\");\n            exit(EXIT_FAILURE);\n        }\n    }\n    else {\n\
    \        char *ca1 = \"Seema\";\n        char *ca2 = \"loves Yoga\";\n       \
    \ if(semop(id, &p, 1) < 0) {\n            printf(\"Semop failed\");\n        \
    \    exit(EXIT_FAILURE);\n        }\n        puts(ca1);\n        fflush(stdout);\n\
    \        sleep(4);\n        puts(ca2);\n        if(semop(id, &v, 1) < 0) {\n \
    \           printf(\"Semop failed\");\n            exit(EXIT_FAILURE);\n     \
    \   }\n    }\n}\n```\n\n## Explanation\n- `KEY` `0x1254` defines a semaphore identifier.\n\
    - `union semun` with `val`, `struct semid_ds *buf`, and `unsigned short *array`\
    \ is a bit technical, but for all practical purposes it will suffice to know you\
    \ need to define it. This is needed for `semctl`.\n- `struct sembuf p = {0, -1,\
    \ SEM_UNDO}` and `struct sembuf v = {0, +1, SEM_UNDO}` signify the decrement and\
    \ increment operations of the semaphore, like `sem_wait` and `sem_post`.\n- `semget(KEY,\
    \ 1, 0666 | IPC_CREAT)` creates the semaphore and what follows is testing whether\
    \ it is successful.\n- `semctl(id,0,SETVAL, u)` initializes the semaphore.\n-\
