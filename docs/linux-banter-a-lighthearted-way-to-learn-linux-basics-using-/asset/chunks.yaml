    |  |  |


    This gives you the local time. gmtime() gives the Greenwich Mean Time.


    | #include <time.h>time_t mktime(struct tm *timeptr); |


    This converts a broken down structure to raw time.


    “Who would need that?”


    “My grandfather used to comfort people.”


    “By handing out cocktails?”


    “Not just that. When people used to go to him and tell him their problem, he used
    to say, “You have 1261440000 seconds to live”.


    “You say great grandfather sometimes and grandfather.”


    “He was my grandfather…..but he was great. ”


    “Thank God I missed him.”


    “1261440000 seconds is a lot actually, 40 years. But it seems like less. Made
    people forget their worries.


    Another time command is used on the command line to run programs and calculate
    system resource usage.


    | $ time ./a.out |


    | #include <time.h>char *asctime(const struct tm *timeptr);char *ctime(const time_t
    *timeval); |


    ‘asctime’ and ‘ctime’ return strings that are human readable.


    If you want to print time, there’s a tool better than ‘printf’ for time related
    outputs.


    | #include <time.h>size_t strftime(char *s, size_t maxsize, const char *format,
    struct tm *timeptr); |


    char *s is the resultant string.


    format is where you specify the formatting, the % symbols etc.


    You can use the ‘strptime’ function, which takes a string connoting a date


    and time and creates a ‘tm’ structure representing the same date and time:


    | #include <time.h>char *strptime(const char *buf, const char *format, struct
    tm *timeptr); |


    The buf is the string.


    Temporary files


    Lingaraj began the topic.


    “Let’s talk about temporary files. Sometimes you might need to create temporary
    files.


    | #include <stdio.h>char *tmpnam(char *s); |


    It returns a string which is a unique filename not present on the system. It also
    updates it in the string ‘s’. But the problem is another program can create a
    file with the same name later, without using the above C library function, but
    before you start using it.


    | #include <stdio.h>FILE *tmpfile(void); |


    The above C library function creates and opens a file with the unique name and
    returns a file stream for immediate use, so the risk of another program creating
    a file by the same name is reduced.


    | #include <stdlib.h>char *mktemp(char *template); |


    | int mkstemp(char *template); |'
