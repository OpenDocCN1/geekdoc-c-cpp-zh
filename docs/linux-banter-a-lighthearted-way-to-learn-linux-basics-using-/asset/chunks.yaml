    \ = write(filed_pipe[1],chars_passed, strlen(chars_passed));\n        printf(\"\
    This program wrote %d bytes - %s\\n\", total_bytes, buffer);\n    }exit(EXIT_SUCCESS);}\n\
    ```\n\nThe first change is the `sprintf` function. It captures the first file\
    \ descriptor in the array passed to `pipe` in the holder, `buffer`. That is, it\
    \ prints the value of the file descriptor stored in `filed_pipe[0]` into `buffer`.\
    \ Because the second program we call later will not inherit the file descriptors.”\
    \ explained Lingaraj.\n\n“But there is a call to `fork`.” said Seema.\n\n“Yes.\
    \ The logic is, if we call another program using `execl`, which we will, the calling\
    \ process is done away with, even though the process id continues. It’s like all\
    \ round Arun completely taking over my position and I not being there any longer.\
    \ So, the process is finished. We call the `fork`, create a child process and\
    \ then call `execl` from the child process. This way, the parent process is retained\
    \ and the child process finishes. Hence, you won’t see the text in the `printf`\
    \ statement, “This is the child process,but this text won't be displayed because\
    \ execl finishes off the calling process.” after `execl` is called.\n\nIn `execl`,\
    \ we call the program to be executed which is `pipe_cons` and also supply two\
    \ pieces of information. One, the name of the program as an argument to the program\
    \ being called. And the other, the file descriptor we had stored in `buffer`.\
    \ So, the program being called by `execl` will have the information.\n\nLet’s\
    \ move on to the consumer program which receives the data. This is named `pipe_cons`.\n\
    \n### pipe_cons.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <string.h>\nint main(int argc,char *argv[]){\n    int bytes_ex;\n   \
    \ char buffer[BUFSIZ + 1];\n    int file_des;\n    memset(buffer,'\\0',sizeof(buffer));\n\
    \    sscanf(argv[1],\"%d\", &file_des);\n    printf(\"The argument to the consumer\
    \ program is %s\\n\", *argv);\n    bytes_ex = read(file_des, buffer, BUFSIZ);\n\
    \    printf(\"The process %d has read %d bytes. Content : %s \\n\", getpid(),\
    \ bytes_ex, buffer);\n    exit(EXIT_SUCCESS);}\n```\n\nThis receives the data\
    \ passed through `sscanf`. But a call to `memset`.\n\n```c\n#include <string.h>\n\
    void *memset(void *s, int c, size_t n);\n```\n\nThis receives the data passed\
    \ through `sscanf`. But a call to `memset`.\n\n```c\n#include <sys/types.h>\n\
    #include <sys/stat.h>\nint mkfifo(const char *filename, mode_t mode);\n```\n\n\
    This receives the data passed through `sscanf`. But a call to `mkfifo`.\n"
