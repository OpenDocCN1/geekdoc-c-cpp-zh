  trans: "\n\n更改映射值前的数字：1234\n\n更改映射值前的句子：\n\nSeema 不懂 Linux。\n\n更改映射值后的数字：5678\n\n\
    更改映射值后的句子：\n\nSeema 已经学会了 Linux。\n\n# getopt()\n\n假设你派你的朋友去帮着买一个手包。你会告诉她什么呢？”\n\
    \n“我会告诉她买一个带拉链的、有一个放小镜子的口袋、一个可以放手机的隔层，而且设计是红色的。预算是 750 卢比。”\n\n“好的，`fetchbag()`\
    \ 将包含获取手包的指令。\n\n而你说的所有其他东西都是选项。现在，这些选项将是\n\n--zip\n--pocket\n--mirror\n--cellphone\
    \ holder\n--design : red\n--amount : 750 rupees\n\n注意这些冒号。”\n\n我们会使用代码。`z`、`p`、`m`、`c`、`d`、`red`\
    \ 和 `a` 是这些选项的简写，”Seema 说。\n\n“如果是那样，我们将使用 `getopt()`。你所做的就是指定以‘-’为前缀的代码选项。`getopt()`\
    \ 会捕获这些选项并使其对被调用的程序可用。否则，你将使用 `argv` 列表，并根据选项前的‘-’前缀来区分参数和选项。”\n\n如果你认识的朋友正在帮着买它们，那没关系。但如果是像我这样不一定了解手包选项的人，我必须有一个程序根据你指定的选项，在每一步都告诉我该做什么。让我们从一个\
    \ C 库函数开始。\n\n### 语法如下：\n\n```c\n#include <unistd.h>\nint getopt(int argc, char\
    \ *const argv[], const char *optstring);\nextern char *optarg;\nextern int optind,\
    \ optterr, optopt;\n```\n\n- `argc` 是参数的数量，包含了调用的函数。\n- `argv` 是参数列表。\n- `optstring`\
    \ 是调用 `getopt()` 的程序可以接受的有效选项列表。这意味着，程序必须知道用户将传递什么样的选项，并且程序最好准备好一个 `switch case`\
    \ 语句，根据传递的选项执行相应的操作。\n\n如果一个像我这样不懂手包术语的用户传递了 `-b` 选项作为啤酒杯架，那么 `getopt()` 会识别出这超出了程序的范围并将其放入\
    \ `optopt` 中。因此，查看 `optopt` 就可以得到由不懂手包的用户传递的选项。\n\n由于这每次 `getopt()` 运行时都会更新，因此它通常在循环中运行。\n\
    \n- `optind` 是索引，帮助 `getopt()` 在下次被调用时使用。由于 `getopt()` 返回程序收到的下一个选项字符，`getopt()`\
    \ 会一直运行，直到 `getopt()` 返回 `-1`，这意味着没有更多选项了。如果遇到未知选项，它将返回 `?`，即问号字符。\n\n每个选项可能还有进一步的参数。例如，当你提到预算时，必须指定金额。该特定选项存在后续参数是通过选项字符旁边的\
    \ `:` 冒号指示的。该选项的指定参数也可以通过 `getopt()` C 库函数 `optarg` 访问。因此，你的程序将是：\n\n#### fetchbag.c\n\
    \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include\
    \ <ctype.h>\nint main(int argc, char *argv[]){\n    int option;\n    while((option\
    \ = getopt(argc, argv, \"zpmcd: a:\")) != -1)\n    {\n        switch(option) {\n\
    \            case 'z':\n                printf(\"So you want a handbag with a\
    \ zip.\\n\");\n                continue;\n            case 'p':\n            \
    \    printf(\"So you want a handbag with a pocket.\\n\");\n                continue;\n\
    \            case 'm':\n                printf(\"So you want a handbag with a\
    \ mirror.\\n\");\n                continue;\n            case 'c':\n         \
    \       printf(\"So you want a handbag with a cellphone holder.\\n\");\n     \
    \           continue;\n            case 'd':\n                printf(\"You want\
    \ a particular design. The design is %s.\\n\", optarg);\n                continue;\n\
    \            case 'a':\n                printf(\"You have a budget for this. The\
    \ budget is %s.\\n\", optarg);\n                continue;\n            case '?':\n\
    \                if (optopt == 'a')\n                    fprintf(stderr, \"You\
    \ need to be more specific for the option, %c.\\n\", optopt);\n              \
    \      continue;\n                else if (optopt == 'd')\n                  \
    \  fprintf(stderr, \"For this option, you need to specify a design %c\\n\", optopt);\n\
    \                    continue;\n                else\n                    printf(\"\
    Looks like you't know much about handbags. %c is an invalid option.\\n\", optopt);\n\
    \        }\n    }\n}\n```\n\n为了解释，\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <stdlib.h>\nint main(int argc, char *argv[]){\n    int option;\n    while((option\
    \ = getopt(argc, argv, \"zpmcd: a:\")) != -1) // 开始一个 while 循环和 getopt 函数，我们在其中列出了有效选项。在\
    \ d 和 a 之后，有一个 :，表示该选项需要一个参数。\n    {\n        switch(option) {\n            case\
    \ 'z':\n                printf(\"So you want a handbag with a zip.\\n\");\n  \
    \              continue;\n            case 'p':\n                printf(\"So you\
    \ want a handbag with a pocket.\\n\");\n                continue;\n          \
    \  case 'm':\n                printf(\"So you want a handbag with a mirror.\\\
    n\");\n                continue;\n            case 'c':\n                printf(\"\
    So you want a handbag with a cellphone holder.\\n\");\n                continue;\n\
    \            case 'd':\n                printf(\"You want a particular design.\
    \ The design is %s.\\n\", optarg);\n                continue;\n            case\
    \ 'a':\n                printf(\"You have a budget for this. The budget is %s.\\\
    n\", optarg);\n                continue;\n            case '?':\n            \
    \    if (optopt == 'a')\n                    fprintf(stderr, \"You need to be\
    \ more specific for the option, %c.\\n\", optopt);\n                    continue;\n\
    \                else if (optopt == 'd')\n                    fprintf(stderr,\
    \ \"For this option, you need to specify a design %c\\n\", optopt);\n        \
    \            continue;\n                else\n                    printf(\"Looks\
    \ like you't know much about handbags. %c is an invalid option.\\n\", optopt);\n\
    \        }\n    }\n}\n```\n\n如果我们运行这个，\n\n```bash\n$ gcc fetchbag.c -o fetchbag\n\
    $ fetchbag -z -p -m -c -d red -a 750\n```\n\n输出是：\n\nSo you want a handbag with\
    \ a zip.\nSo you want a handbag with a pocket.\nSo you want a handbag with a mirror.\n\
    So you want a handbag with a cellphone holder.\nYou want a particular design.\
    \ The design is red.\nYou have a budget for this. The budget is 750.\n\n下次运行：\n\
    \n```bash\n$ /fetchbag -z -p -m -c -d red -a\n```\n\n输出是：\n\nSo you want a handbag\
    \ with a zip.\nSo you want a handbag with a pocket.\nSo you want a handbag with\
    \ a mirror.\nSo you want a handbag with a cellphone holder.\nYou want a particular\
    \ design. The design is red./fetchbag: option requires an argument -- 'a'You need\
    \ to be more specific for the option, a.\n\n所以，你看到如果用户漏掉了某个选项的参数，程序会通知用户。\n\n\
    这次运行是我请求一个啤酒杯架选项：\n\n```bash\n$ ./fetchbag -z -p -m -c -d red -a 750 -b\n```\n\
    \n输出是：\n\nSo you want a handbag with a zip.\nSo you want a handbag with a pocket.\n\
    So you want a handbag with a mirror.\nSo you want a handbag with a cellphone holder.\n\
    You want a particular design. The design is red.\nYou have a budget for this.\
    \ The budget is 750./fetchbag: invalid option -- 'b'Looks like you don't know\
    \ much about handbags. b is an invalid option\n\n但我们看到了一个缺点。并不是说我要让程序万无一失，但如果漏掉了作为\
    \ d 的参数 red\n\n```bash\n$ ./fetchbag -z -p -m -c -d -a 750\n```\n\n它会显示这个输出：\n\
    \nSo you want a handbag with a zip.\nSo you want a handbag with a pocket.\nSo\
    \ you want a handbag with a mirror.\nSo you want a handbag with a cellphone holder.\n\
    You want a particular design. The design is -a.\n\n"
- fmt: "\nWhat happened here was that the `getopt` assumed the next option to `-d`,\
    \ input as `-a` as the argument to the option `-d`. The user has to input the\
    \ correct sequence and be precise in his supplying of options. Otherwise it would\
    \ again involve a lot of scanning of the `argv` array and finding out whether\
    \ there is a ‘-’ next to the option and things like that.\n\nIf you want to make\
    \ things simpler for me and use the long form of the options, then you use\n\n\
    ```c\nint getopt_long_only(int argc, char * const argv[], const char *optstring,\
    \ const struct option *longopts, int *longindex);\n```\n\nThere is a structure\
    \ of the type `option`, which is\n\n```c\nstruct option {\nconst char *name;\n\
    int        has_arg;\nint        *flag;\nint        val;\n};\n```\n\n“So, you can\
    \ access these values through the structure.” said Lingaraj.\n\n“Any story you\
    \ have related to bags?”\n\n“Yes.”\n\n“And it turned out sad for you.”\n\n“How\
    \ did you guess?!” asked Lingaraj with surprise.\n\n“Frankly, I didn’t even have\
    \ to guess.”\n\n“There was this girl’s birthday when I was in college.\n\n![](image_rsrc84U.jpg)\n\
    \nShe was very studious and good at making notes and many students wanted to learn\
    \ from her notes. The final exams were just announced and they were scheduled\
    \ a couple of weeks from then. One day, I came to know it was her birthday. So\
    \ I wanted to wish her uniquely. She was having lunch on the lawn when I saw her\
    \ bag lying. I then proceeded to tie the bag with balloons as she was busy talking.\
    \ She didn’t notice.\n\n![](image_rsrc84V.jpg)\n\nI tied about a 100 balloons\
    \ and yelled “Surprise!”. She turned around. I took my hands off the bag to show\
    \ my handiwork. The bag flew away with the balloons. She failed in her exams.”\n\
    \n![](image_rsrc84W.jpg)\n\nSeema seriously wished she could do something about\
    \ Lingaraj’s love life. Lingaraj continued.\n\n“The Linux environment. I have\
    \ two resumes. In one, it says the following :\n\nSmoke : No\nDrink : No\nFavourite\
    \ TV shows : Documentaries\nPrevious affairs : Nil\nVideo games : No\nand so on.\n\
    \nIn the other :\n\nSmoke : Occasionally\nDrink : Occasionally\nFavourite shows\
    \ : Thrillers\nPrevious affairs : Many\nVideo games : Shooting zombies and so\
    \ on.\n\nWhich do you think is the real one?”\n\n“The second one obviously.” replied\
    \ Seema with confidence.\n\n“The second one is reserved for true friends. The\
    \ first one for matrimonial alliances. So I keep switching between these two environments.\n\
    \nWhen I have to remember which is the value of a particular environment variable,\
    \ I use this C library function\n\n```c\nchar *getenv(const char *name);\n```\n\
    \nIt tells the environment variable value of the variable given by `name`.\n\n\
    If I have to change a particular value, I use\n\n```c\nint putenv(const char *string);\n\
    ```\n\nThe string ought to be in this format:\n\n`name=value`\n\nFor example,\
    \ \n\n`drink=beer`\n\nThis setting I use when I am with friends and have to ride\
    \ back home on my horse.\n\n“That’s because when you drink more, you are not stable,\
    \ I suppose.”\n\n“If I want to find out all the variable values, I use\n\n```c\n\
    #include <stdlib.h>\nextern char **environ;\n```\n\nIt is an array of strings,\
    \ that contain the list of variables. You can access them in a program one by\
    \ one, using a `while` loop. Okay, see you tomorrow then.” said Lingaraj suddenly.\n\
    \n## Time related functions\n\nThe next day, Seema took a walk early in the morning.\
    \ She saw a group of about 4 to 5 people doing slow moving exercises.\n\nShe joined\
    \ them and found it enjoyable. It was some time before she realised she was running\
    \ late. Seema got ready as fast as she could and went and rang Lingaraj’s house\
    \ doorbell. The doorbell was a simple bell contraption which did not run on electric\
    \ power.\n\n![](image_rsrc84X.jpg)\n\nLingaraj appeared near the door and Seema\
    \ could see him. He lingered and though he saw Seema, he took about 5 minutes\
    \ to open the door.\n\n“Why did you open the door so late?” asked Seema with a\
    \ hint of anger.\n\n![](image_rsrc84Y.jpg)\n\n“No. You were late. You started\
    \ it. Please come inside.”\n\nAfter Seema had settled, she told Lingaraj.\n\n\
    “I did some slow moving exercises.”\n\n“Since we are on the topic of time,\n\n\
    There is this time system call, which tells you, how many seconds have elapsed\
    \ since Jan 1 1970.”\n\n“In seconds? That’s inconvenient.”\n\nLingaraj showed\
    \ her the screen.\n\n```c\n#include <time.h>\ntime_t time(time_t *tloc);\n```\n\
    \nIt returns an integer of the type `time_t` as defined in `time.h` and if you\
    \ specify a location in the form of `tloc`, it stores the value there.\n\nSo,\
    \ if you have to find the difference between two times, you invoke `difftime`:\n\
    \n```c\n#include <time.h>\ndouble difftime(time_t time1, time_t time2);\n```\n\
    \nThis will give the difference in seconds. \n\nIf you have to convert a broken\
    \ down structure to raw time, you use this:\n\n```c\n#include <time.h>\ntime_t\
    \ mktime(struct tm *timeptr);\n```\n\n“Who would need that?”\n\n“My grandfather\
    \ used to.”\n\n“But it seems like less.”\n\n“Thank God I missed him.”\n\n“And\
    \ if you want the local time, use:\n\n```c\n#include <time.h>\nstruct tm *localtime(const\
    \ time_t *time);\n```\n\nThis gives you the local time. For Greenwich Mean Time,\
    \ use:\n\n```c\n#include <time.h>\nstruct tm *gmtime(const time_t *time);\n```\n\
    \nIf you want to print time, there’s a tool better than `printf` for time outputs.\n\
    \n```c\n#include <time.h>\nsize_t strftime(char *s, size_t maxsize, const char\
    \ *format, struct tm *timeptr);\n```\n\n`s` is the resultant string. `format`\
    \ is where you specify the formatting, the `%` symbols etc.\n\nYou can use the\
    \ `strptime` function, which takes a string connoting a date and time and creates\
    \ a `tm` structure representing the same date and time:\n\n```c\n#include <time.h>\n\
    char *strptime(const char *buf, const char *format, struct tm *timeptr);\n```\n\
    \nAnother `time` command is used on the command line to run programs and calculate\
    \ system usage.\n\n```bash\n$ time ./a.out\n```\n\nFor human readable strings,\
    \ use:\n\n```c\n#include <time.h>\nchar *asctime(const struct tm *time);\nchar\
    \ *ctime(const time_t *time);\n```\n\n`asctime` and `ctime` return strings that\
    \ are human readable.\n\n## Temporary files\n\nLingaraj began the topic.\n\n“Let’s\
    \ talk about temporary files. Sometimes you might need to create temporary files.\n\
    \n```c\n#include <stdio.h>\nchar *tmpnam(char *s);\n```\n\nIt returns a string\
    \ which is a unique filename not present on the system. It also updates it in\
    \ the string `s`. But the problem is another program can create a file with the\
    \ same name later, but before you start using it.\n\n```c\n#include <stdio.h>\n\
    FILE *tmpfile(void);\n```\n\nThe above C library function creates and opens a\
    \ file with the unique name and returns a file stream for immediate use.\n\n```c\n\
    #include <stdlib.h>\nchar *mktemp(char *template);\nint mkstemp(char *template);\n\
    ```\n"
