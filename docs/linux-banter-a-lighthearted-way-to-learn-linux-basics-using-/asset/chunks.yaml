    of the above special access modes O_RDONLY, O_WRONLY and O_RDWR have to be used
    along with other options by ‘OR’ing (|) with other flags. Now, there are many
    scenarios in the rehearsal.


    Let’s look at the oflags parameter:


    | O_APPEND | Appends data to the end of the file. A new set of lines might need
    to be appended. Give the guy more dialogues, especially if he’s doing good. |


    | O_TRUNC | Cut the file to zero, discarding existing content. This is one way
    to insult and say a guy’s not good at acting by removing all the lines given to
    him. |


    | O_CREAT | Creates the file, if necessary, with permissions given in mode. A
    new character might have to be created. |


    | O_EXCL | Used with O_CREAT , to make sure that only one instance of a file is
    created. If that file is already created, it won’t create a file. A new character
    like no other in the play might need to be created. |


    Now, how do we find out the file descriptor number. The open system call returns
    the file descriptor as a positive integer. -1 if it fails.


    When you use O_CREAT, you need to use the following further modes.


    | S_IRUSR | Read permission, owner |


    | S_IWUSR | Write permission, owner |


    | S_IXUSR | Execute permission, owner |


    | S_IRGRP | Read permission, group |


    | S_IWGRP | Write permission, group |


    | S_IXGRP | Execute permission, group |


    | S_IROTH | Read permission, others |


    | S_IWOTH | Write permission, others |


    | S_IXOTH | Execute permission, others |


    If you want to specify more options, use the | (pipe OR) option. I will show you
    how it works in a program in a little while. There is also the creat() system
    call which is


    | #include <sys/types.h>#include <sys/stat.h>#include <fcntl.h>int creat(const
    char *pathname, mode_t mode); |


    A  call  to creat() is equivalent to calling open() with flags equal to


    O_CREAT|O_WRONLY|O_TRUNC.


    Also, some functions set this global variable, ‘errno’ giving it an error number.
    I am quite a fan of this ‘errno’. When you ask a woman out, if she refuses, she
    can set the ‘errno’ privately. You can look it up and see why you were rejected.
    Once I wanted to go out with this woman, Roshni and gave her a letter with a form.
    The form included the ‘errno’ column. She said ‘no’ as usual in the letter. She
    was a programmer and knew this concept of ‘errno’ and that I was a fan of it.
    So I went and checked ‘errno’, it was written ‘errno’. I then asked her what it
    meant. She said ‘err…...no!’”


    “It is easier to understand Linux than understand you.” replied Seema.


    “Now, the number of characters a play can have in our community is limited to
    16\. Same way, the number of files one process can open at a time is limited to
    16\. It is defined by OPEN_MAX in limits.h. This can be changed.”


    | #include <unistd.h>int close(int fildes); |


    0 on success -1 on error.


    This is how you close a file. I will show you a program named ‘filecopy.c’.


    | #include <stdio.h>#include <unistd.h>#include <fcntl.h>#include <stdlib.h>int
    main(){  char c;  int in,out;  in=open("inputfile", O_RDONLY);  out=open("outputfile",
    O_WRONLY&#124;O_CREAT,S_IWUSR&#124;S_IRUSR);  while(read(in,&c,1) == 1)      {  ​printf("%c",c);  ​write(out,&c,1);      }close(in);close(out);    exit(0);}
    |


    This uses the system call to copy from the inputfile (which is about 3.5MB) to
    the outputfile (which as of now does not exist), character by character, excruciatingly.
    This is like calling ceremony Seena to pass on a message and every time he comes,
    you tell him only one character of the message.


    Compile the program using gcc.


    | $ gcc filecopy.c -o filecopy |


    You can measure how much time this program took by using the time command on the
    command line.


    | $ time ./filecopy |


    The output was displayed after some time.


    | real​0m16.305suser​0m3.948ssys​0m12.353s |


    “Maybe character by character is a wrong idea.” observed Seema.


    “Yes, we did that as a lesson to him, thinking he would be exasperated, but he
    loved all the protocol nonsense.


    If we change the read call to read and write in blocks, the speed will be boosted.


    Just add this :


    | char word[1024];while((nread = read(in,&word,sizeof(word))) > 0)write(out,&word,nread);
    |


    So, the program would look like this.


    filecopy_new.c


    | #include <stdio.h>#include <unistd.h>#include <fcntl.h>#include <stdlib.h>int
    main(){  char c;  int in,out, nread;  in=open("inputfile", O_RDONLY);  out=open("outputfile",
    O_WRONLY&#124;O_CREAT,S_IWUSR&#124;S_IRUSR);  char word[1024];  while((nread =
    read(in,&word,sizeof(word))) > 0)  write(out,&word,nread);  exit(0);} |


    The next system call we talk about is the ‘lseek’ call.


    | #include <unistd.h>#include <sys/types.h>off_t lseek(int fildes, off_t offset,
    int whence); |


    ‘lseek’ points to a place in the file. So, offset is the distance from a point.
    And the offset is described with whence. The options for whence are :


    | SEEK_SET | offset is an absolute position |


    | SEEK_CUR | offset is relative to the current position |


    | SEEK_END | offset is relative to the end of the file |


    It’s like the dialogue writer can say, let’s go to the 5th dialogue, or the 3rd
    dialogue from where we were, or the penultimate dialogue.


    ‘lseek’ returns the distance from the beginning of the file in terms of bytes.


    Here are some calls that tell you about files.


    | #include <unistd.h>#include <sys/stat.h>#include <sys/types.h>int fstat(int
    fildes, struct stat *buf);int stat(const char *path, struct stat *buf);int lstat(const
    char *path, struct stat *buf); |


    If you know the file descriptor, you can use ‘fstat’ to find out more info. If
    you know the path, use ‘stat’. And if the file is a link, use ‘lstat’ to get information
    about the link. Now, what is this information? It is a structure with the following
    components.


    Here it is.


    | st_mode |


    | st_ino |


    | st_dev |


    | st_uid |


    | st_gid |


    | st_atime |


    | st_ctime |


    | st_mtime |


    | st_nlink |


    Now, suppose you are programming a part of Vijay’s brain and you feel there’s
    too much data, then you can take the help of your friend.


    There’s the dup() system call where you can duplicate the file descriptor and
    get another file descriptor number for the same file. The number is the lowest
    available number which is free. This way, you can give another process the method
    to alter the file. You can work on one part and your friend on another.


    “Well, all my friends are busy. So I will go at it alone. Thanks.”


    “dup2 makes one file descriptor like another, but rather than using the lowest
    number, it uses a new number specified by you .” finished Lingaraj and showed
    her the calls.


    | #include <unistd.h>int dup(int fildes);int dup2(int fildes, int fildes2); |


    Lingaraj continued.'
