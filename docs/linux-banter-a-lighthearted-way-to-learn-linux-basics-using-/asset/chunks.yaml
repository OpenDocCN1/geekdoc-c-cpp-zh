  trans: "\n\n```c\n#include <sys/socket.h>\nint bind(int socket, const struct sockaddr\
    \ *address, size_t address_len);\n```\n\nsocket 是套接字数字。`sockaddr` 结构包含了服务器端口号、族和\
    \ IP 地址，通过将其绑定到套接字数字，并将 socket 文件描述符封装成一个包，因此，对 socket 文件描述符的引用意味着我们正在访问特定的端口和网络地址。\n\
    \n端口（port）和 socket 的区别在于：端口是 socket 的一部分。\n\n地址是包含内容的结构：\n\n```c\nstruct sockaddr_in\
    \ {\n    short int sin_family;\n    unsigned short int sin_port;\n    struct in_addr\
    \ sin_addr;\n};\n```\n\n`sin_family` 可以是 `AF_INET`，尽管还有其他可能性。\n\n`sin_port` 是端口号，`in_addr`\
    \ 是 IP 地址。\n\n如果客户端必须通过 socket 跨网络连接，它需要服务器计算机的 IP 地址。IP 地址类似于 `255.255.255.255`\
    \ 这种格式，其中 `255` 是最大值。这是一种识别设备的方式。\n\n`sin_addr` 是 IP 地址结构：\n\n```c\nstruct in_addr\
    \ {\n    unsigned long int s_addr;\n};\n```\n\n成功时返回 `0`，错误时返回 `-1`。\n\n错误类型：\n\
    \n| Error | Description |\n| :--- | :--- |\n| `EBADF` | 无效的文件描述符 |\n| `ENOTSOCK`\
    \ | 不引用 socket。 |\n| `EINVAL` | 已经存在相同命名标识符的 socket。 |\n| `EADDRNOTAVAIL` | 地址不可用\
    \ |\n| `EADDRINUSE` | 该地址已绑定了 socket。 |\n\n```c\n#include <sys/socket.h>\nint\
    \ listen(int socket, int backlog);\n```\n\n这使得 socket 能够监听传入的连接并分配一个连接队列。`backlog`\
    \ 是等待处理连接的最大数量。\n\n一旦服务器在执行上述调用后准备好监听，客户端就可以发起请求了。\n\n服务器可以使用此系统调用来接受连接：\n\n```c\n\
    #include <sys/socket.h>\nint accept(int socket, struct sockaddr *address, size_t\
    \ *address_len);\n```\n\n`accept()` 系统调用会创建一个新的 socket 与该特定客户端通信，并返回其文件描述符。如果服务器必须为许多客户端提供服务，这将非常有帮助。这是一个重要的这一点：对于每个连接到服务器\
    \ socket 的客户端，在执行 `accept` 之后都会分配另一个数字。客户端的地址被存放在 `sockaddr` 结构中。\n\n如果没有客户端，`accept`\
    \ 调用将阻塞。但你可以通过以下方式更改它：\n\n```c\nint flags = fcntl(socket, F_GETFL, 0);\nfcntl(socket,\
    \ F_SETFL, O_NONBLOCK|flags);\n```\n\n在 `flags` 中使用 `O_NONBLOCK` 设置。\n\n在客户端侧，我们只需要连接、发送或接收以及关闭。\n\
    \n```c\n#include <sys/socket.h>\nint connect(int socket, const struct sockaddr\
    \ *address, size_t address_len);\n```\n\n该 socket 是客户端的 socket 而不是服务器的 socket。服务器的规范在\
    \ `sockaddr` 结构中给出，包含 IP 地址、端口号等。\n\n成功时返回 `0`，错误时返回 `-1`。错误可能是：\n\n| Error |\
    \ Description |\n| :--- | :--- |\n| `EBADF` | 无效的文件描述符 |\n| `EALREADY` | 该 socket\
    \ 正在进行连接 |\n| `ETIMEDOUT` | 连接超时 |\n| `ECONNREFUSED` | 连接被服务器拒绝。 |\n\n你可以像对待文件描述符一样对\
    \ socket 使用 `write` 和 `read` 系统调用。\n\n当我们进入编程阶段时，你将看到这一点。\n\n```c\nint close(int\
    \ socket)\n```\n\n关闭 socket。这既可以用于服务器端，也可以用于客户端。\n\n在之前的进程间通信（Inter-process Communication）示例中，我们必须使用\
    \ socket。这是理解通信的基本方法。\n\n"
- fmt: "\n`writefds` for write ready and `errorfds` for the set of file descriptors\
    \ we want to check for an error condition.\n\nThe `timeval` structure contains\
    \ two members, one specifying user time and the other specifying time in microseconds.\n\
    \nThis is the timeout value, when a period of time elapses before `select` returns\
    \ with the activated file descriptors.\n\n```c\n#include <sys/types.h>\n#include\
    \ <sys/time.h>\nvoid FD_ZERO(fd_set *fdset);\nvoid FD_CLR(int fd, fd_set *fdset);\n\
    void FD_SET(int fd, fd_set *fdset);\nint FD_ISSET(int fd, fd_set *fdset);\n```\n\
    \nThe above are a set of macros.\n\n- `FD_ZERO` initialises the file descriptor\
    \ set, whether the `readfds` or `writefds` or `errorfds`.\n- `FD_CLR` removes\
    \ a file descriptor from a file descriptor set.\n- `FD_SET` adds a file descriptor\
    \ to a file descriptor set.\n- `FD_ISSET` checks whether a file descriptor that\
    \ belongs to a particular file descriptor set is active. This is done after the\
    \ return from `select` to see whether the file descriptor we are interested in\
    \ is ready for reading or writing or has an error condition.\n\nWe will see all\
    \ this at work in a program shortly.\n\nThere are a few more functions to run\
    \ through.\n\nComputers of different types agree on values for multibyte integers\
    \ transmitted over a network, using network ordering. Especially port numbers.\
    \ Different computers may use different ways to denote numbers that need to be\
    \ used. My house number is `1\\.`. In my mind, I think of it as:\n\n```\n((-b)\
    \ ± √(b²-4ac))\n```\n\n`2a`\n\nwhere\n\n`a = 3`\n`b = -6`\n`c = 3`\n\nfor some\
    \ reason. If I order food from a food delivery service, I can’t put this in the\
    \ address box. I have to type in `1\\.`. So, we have functions that act as a go\
    \ between, between the native host formats and the standard network.\n\n```c\n\
    #include <netinet/in.h>\nunsigned long int htonl(unsigned long int hostlong);\n\
    ```\nConverts host format to standard network long.\n\n```c\nunsigned short int\
    \ htons(unsigned short int hostshort);\n```\nhost format to network format short.\n\
    \n```c\nunsigned long int ntohl(unsigned long int netlong);\n```\nnetwork to host\
    \ long.\n\n```c\nunsigned short int ntohs(short int unsigned short int netshort);\n\
    ```\nnetwork to host short.\n\n```c\n#include <sys/socket.h>\n#include <netinet/in.h>\n\
    #include <arpa/inet.h>\nin_addr_t inet_addr(const char *cp);\n```\nThis function\
    \ converts your IP address to network form to put it bluntly.\n\n“What if the\
    \ server and client don’t know the port numbers or the addresses?”\n\n“In such\
    \ a scenario, there are functions you can use where the complete details of the\
    \ computer are obtained. Example:\n\n```c\n#include <netdb.h>\nstruct hostent\
    \ *gethostbyaddr(const void *addr, size_t len, int type);\nstruct hostent *gethostbyname(const\
    \ char *name);\n```\nThis will return a structure:\n\n```c\nstruct hostent {\n\
    \    char *h_name;\n    char **h_aliases;\n    int h_addrtype;\n    int h_length;\n\
    \    char **h_addr_list\n};\n```\n\nFor services and relevant port numbers:\n\n\
    ```c\n#include <netdb.h>\nstruct servent *getservbyname(const char *name, const\
    \ char *proto);\nstruct servent *getservbyport(int port, const char *proto);\n\
    ```\nIt returns a structure:\n\n```c\nstruct servent {\n    char *s_name;\n  \
    \  char **s_aliases;\n    int s_port;\n    char *s_proto;\n};\n```\n\n```c\n#include\
    \ <arpa/inet.h>\nchar *inet_ntoa(struct in_addr in);\n```\nThis converts an Internet\
    \ host address to a string in dotted quad format.\n\n```c\n#include <unistd.h>\n\
    int gethostname(char *name, int namelength);\n```\nThis will write the hostname\
    \ into the string given by `name`. Of course, you have to know something about\
    \ the system you want to have a network with.\n\n### UDP\n\nLike I said, UDP is\
    \ no guarantee. You construct the programs in a similar manner to TCP/IP but rather\
    \ than use `read` and `write`, you use the following system calls. UDP is a less\
    \ expensive way of getting some not so important data.\n\n```c\nint sendto(int\
    \ sockfd, void *buffer, size_t len, int flags, struct sockaddr *to, socklen_t\
    \ tolen);\n```\n`sendto` sends to a socket.\n\n```c\nint recvfrom(int sockfd,\
    \ void *buffer, size_t len, int flags, struct sockaddr *from, socklen_t *fromlen);\n\
    ```\n`recvfrom` system call waits on a socket for a datagram from a specified\
    \ address and receives it into a buffer.\n\nLet’s look at some programs now, that\
    \ use `select`.\n\n#### The server first: `server_select.c`\n\n```c\n#include\
    \ <sys/types.h>\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    #include <netinet/in.h>\n#include <errno.h>\n#include <string.h>\n#include <sys/select.h>\n\
    #include <sys/socket.h>\n\nint create_tcp_server_socket() {\n    struct sockaddr_in\
    \ saddr;\n    int fd, ret_val;\n    fd = socket(AF_INET, SOCK_STREAM, IPPROTO_TCP);\n\
    \    printf(\"Created a socket with fd : %d\\n\", fd);\n    saddr.sin_family =\
    \ AF_INET;\n    saddr.sin_port = htons(7000);\n    saddr.sin_addr.s_addr = htonl(INADDR_ANY);\n\
    \    ret_val = bind(fd, (struct sockaddr *)&saddr, sizeof(struct sockaddr_in));\n\
    \    ret_val = listen(fd, 5);\n    return(fd);\n}\n\nint main() {\n    int nread;\n\
    \    fd_set read_fd_set, testfds;\n    struct sockaddr_in client_address;\n  \
    \  int server_fd, lc = 0, ret_val, i;\n    int addrlen, fd, fd1;\n    char buf[100];\n\
    \    server_fd = create_tcp_server_socket();\n    FD_ZERO(&read_fd_set);\n   \
    \ FD_SET(server_fd, &read_fd_set);\n    while (1) {\n        FD_ZERO(&testfds);\n\
    \        testfds = read_fd_set;\n        printf(\"Loop %d starting\\n\", lc);\n\
    \        printf(\"Starting select in loop %d\\n\", lc);\n        ret_val = select(FD_SETSIZE,\
    \ &testfds, NULL, NULL);\n        printf(\"Return from select value is : %d\\\
    n\", ret_val);\n        if (ret_val < 1) {\n            perror(\"server_select\"\
    );\n            exit(1);\n        } else {\n            int new_lc = lc + 3;\n\
    \            for (fd = 3; fd <= new_lc; fd++) {\n                if (FD_ISSET(fd,\
    \ &testfds)) {\n                    if (fd == server_fd) {\n                 \
    \       printf(\"It is a new connection to the server. So grant it\\n\");\n  \
    \                      addrlen = sizeof(client_address);\n                   \
    \     fd = accept(server_fd, (struct sockaddr *)&client_address, &addrlen);\n\
    \                        FD_SET(fd, &read_fd_set);\n                        printf(\"\
    Added client with fd %d\\n\", fd);\n                    } else {\n           \
    \             printf(\"The client %d is an already connected one. So read data\\\
    n\", fd);\n                        read(fd, &buf, sizeof(buf));\n            \
    \            printf(\"\\nSize of buf is : %ld and received message: %s\\n\", sizeof(buf),\
    \ buf);\n                        FD_CLR(fd1, &read_fd_set);\n                \
    \    }\n                }\n            }\n        }\n        lc++;\n    }\n}\n\
    ```\n\n#### Let me explain this:\n\n```c\nint create_tcp_server_socket() {\n \
    \   struct sockaddr_in saddr;\n    int fd, ret_val;\n    fd = socket(AF_INET,\
    \ SOCK_STREAM, IPPROTO_TCP);\n    printf(\"Created a socket with fd : %d\\n\"\
    , fd);\n    saddr.sin_family = AF_INET;\n    saddr.sin_port = htons(7000);\n \
    \   saddr.sin_addr.s_addr = htonl(INADDR_ANY);\n    ret_val = bind(fd, (struct\
    \ sockaddr *)&saddr, sizeof(struct sockaddr_in));\n    ret_val = listen(fd, 5);\n\
    \    return(fd);\n}\n```\nThe above function creates a tcp socket and passes the\
    \ value of the returned file descriptor to the calling program. Of course, there\
    \ is no need for a separate function and you can include this in the main program\
    \ if you are talking about only one server. But if you want to scale up, this\
    \ is a good option. The port number will be `7000\\. And the client programs too\
    \ have to stick to this.\n"
