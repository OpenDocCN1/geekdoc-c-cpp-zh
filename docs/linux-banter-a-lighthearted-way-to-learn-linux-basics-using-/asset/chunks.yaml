  trans: "\n\n# 文件操作与权限\n\n- 包含必要的头文件。\n- 启动 `main()` 函数。\n- 声明两个类型为 `FILE` 的流，一个用于输入，另一个用于输出。\n\
    - 使用 `fopen()` 以读模式打开输入文件。将返回的文件流赋值给已声明的文件流变量。\n- 以写模式打开输出文件。再次将返回的文件流赋值给声明的变量。\n\
    - 使用 `while` 循环从输入文件流中获取一个字符，并使用输出文件流将其写入输出文件，直到到达文件结束符（`EOF`）。\n- 退出。\n\n## 文件权限故事\n\
    \n当你查看我目录中的文件时，你会看到很多像这样的字符：`rwx`。\n\n它们是权限（permissions）。我来向你展示我的烹饪目录。\n\nLingaraj\
    \ 在他的笔记本电脑上打开了烹饪目录。他展示了一个条目：\n\n| 药草面包 `rw_rw_r__` |\n\n第一组三个字符代表用户（user），第二组代表有文件访问权限的用户组（group），第三组代表其他人（others）。\n\
    \n- `r` 代表读（read）。意味着我可以读取这个文件。\n- `w` 代表写（write），意味着我可以向这个文件写入。\n- 缺失的位 `x` 代表可执行（executable）。由于这是一个文本文件，它是无法执行的。”\n\
    \nLingaraj 远视远方。Seema 感觉到一个故事要来了。\n\n“我曾经拥有一群羊。我过去通过用基础技术训练羊来授予权限。我曾会把给那些签了合同的人的照片展示给这些羊看，羊就会信任那些家伙。羊毛给某一个人，牛奶给另一个人，粪便留给第三一个人。\n\
    \n![](img/image_rsrc84M.jpg)\n\n“后来我懒得维护它们了。我过去常让它们自由奔跑。这些羊被训练得非常好，如果一个拿了牛奶合同的人试图拿一些羊毛，羊就会咬他。所以，一个用户无法访问不属于他的文件。”\n\
    \n“我猜结局并不好。发生什么事了？”\n\n“有一天，我发现它们不见了。”\n\n“是有人杀了它们吃肉吗？”\n\n“不是。一个邻国的国王把这些羊征兵进了他的军队。”\n\
    \n“为什么？”\n\n“因为羊的叫声能把敌人身上的粪便逼出来。\n\n![](img/image_rsrc84N.jpg)\n\nSeema 真心希望笔记本电脑没有掉在\
    \ Vijay 的头上。Lingaraj 继续说道。\n\n## 用于设置所有权的系统调用\n\n```c\n#include <sys/stat.h>\n\
    int chmod(const char *path, mode_t mode);\n```\n这会更改文件或目录的模式。\n\n```c\n#include\
    \ <sys/types.h>\n#include <unistd.h>\nint chown(const char *path, uid_t owner,\
    \ gid_t group);\n```\n这会更改文件或目录的所有权。你从哪里获取 `uid_t` 和 `gid_t` 的值？通过 `getuid()`\
    \ 和 `getgid()` 调用。`getuid` 和 `getgid` 分别返回用户 ID 和组 ID。它们不是整数，而是 `uid_t` 和 `gid_t`\
    \ 类型，但它们看起来像整数。\n\n“就像这样。我们有一只叫 Stupid（呆呆）的狗。我来演示一下。” Lingaraj 带着 Seema 到了外面。\n\
    \n“Stupid!” Lingaraj 大声喊道。\n\n![](img/image_rsrc84P.jpg)\n\n一只狗突然出现，看起来很调皮。然后它看向\
    \ Seema 并试图攻击。\n\n![](img/image_rsrc84R.jpg)\n\nSeema 吓了。狗走近并要向 Seema 跳过去时，Lingaraj\
    \ 喊道：`chown Seema`。\n\n狗立刻改变了态度，摇起了尾巴。\n\n![](img/image_rsrc84S.jpg)\n\nSeema\
    \ 喘了一口气。Lingaraj 解释道：“这只狗 Stupid 既会玩也很凶。每当有新人来时，如果狗试图攻击他，人们会立即使用这个命令 `chown name`。狗就会更新自己，认为自己是新主人，不再攻击他。它会和他一起玩。不用说，这狗是我训练的。这只是一个教你关于所有权和\
    \ ID 的例子。”\n\n“你的手段也太低了，我觉得这是一个很‘蠢（stoopid）’的教学方法。”\n\n“得好。” 他们回到室内，Lingaraj 继续讲解。他向她展示了一些系统调用。\n\
    \n## 文件和目录管理\n\n```c\n#include <unistd.h>\nint unlink(const char *path);\nint\
    \ link(const char *path1, const char *path2);\nint symlink(const char *path1,\
    \ const char *path2);\n```\n`unlink()` 类似于删除。除了在最后一个使用文件的进程终止后，该文件占用的空间会被释放。\n\
    \n`link()` 将一个文件链接到另一个文件。因此，可以通过指定 `path2` 来访问由 `path1` 指定的文件。如果 `path2` 指定的文件已经存在，则会报错。所以，`path2`\
    \ 中的文件不应该存在\n\n当然，当你执行 `ls` 时，`path2` 指定的文件会被列出来，但它打开的是 `path1` 指定的文件。\n\n```c\n\
    #include <sys/types.h>\n#include <sys/stat.h>\nint mkdir(const char *path, mode_t\
    \ mode);\n#include <unistd.h>\nint rmdir(const char *path);\n```\n创建和删除目录。你知道\
    \ `rmdir` 是移除目录的。关于模式，你是知道的。`rmdir` 只有在目录为空时才有效。\n\n关于目录的切换。\n\n```c\n#include\
    \ <unistd.h>\nint chdir(const char *path);\n```\n切换目录。\n\n## 目录遍历\n\n```c\n#include\
    \ <unistd.h>\nchar *getcwd(char *buf, size_t size);\n```\n切换目录。为了说明，看这个程序：\n\n\
    ```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    \nint main(){\n    char word[1024];\n    int fd = open(\"/tmp\", O_CREAT | O_WRONLY);\n\
    \    write(fd, \"Lingaraj\", 8);\n    close(fd);\n    getcwd(word, 1024);\n  \
    \  printf(\"当前目录是：%s\\n\", word);\n    chdir(\"/tmp\");\n    getcwd(word, 1024);\n\
    \    printf(\"当前目录是：%s\\n\", word);\n}\n```\n\n## 目录项详情\n\n目录函数定义在 `dirent.h`\
    \ 中。它们使用结构体 `DIR`。`opendir` 函数打开目录并创建一个目录流。\n\n```c\n#include <sys/types.h>\n\
    #include <dirent.h>\nDIR *opendir(const char *name);\n```\n`opendir` 在失败时返回空指针。\n\
    \n```c\n#include <sys/types.h>\n#include <dirent.h>\nstruct dirent *readdir(DIR\
    \ *dirp);\n```\n上述库函数返回目录结构中的下一个项。为什么不是当前项？因为 `opendir` 已经返回了第一个项。我们需要之后的。\n\n\
    ```c\n#include <sys/types.h>\n#include <dirent.h>\nlong int telldir(DIR *dirp);\n\
    ```\n它告诉你目录流中的当前位置。\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\nvoid\
    \ seekdir(DIR *dirp, long int loc);\n```\n这用于设置目录项指针。它与 `readdir` 的区别在于 `readdir`\
    \ 返回下一个项，而这个库函数可以让 `readdir` 返回后面或之前的目录项。但位置 `loc` 必须预先通过 `telldir` 获取。\n\n“如果调用\
    \ `telldir` 获取一个 `loc` 的位置，然后调用 `seekdir` 并传入相同的位置，我在实现什么？指针会停留在。”\n\n“通常情况下，你需要创建一个循环，并使用\
    \ `telldir` 获取连续项的目录位置 `loc`。然后，你可以选择将 `loc` 值传递给 `seekdir`。”\n\n```c\n#include\
    \ <sys/types.h>\n#include <dirent.h>\nint closedir(DIR *dirp);\n```\n\n"
- fmt: "\nThe following program will display all the files in the current directory.\n\
    \n`displaydir.c`\n\n```c\n#include <unistd.h>\n#include <stdio.h>\n#include <dirent.h>\n\
    #include <stdlib.h>\nvoid displayfiles(){\n    DIR *dp;\n    struct dirent *entry;\n\
    \    char dir[1024];\n    getcwd(dir, 1024);\n    if((dp = opendir(dir)) == NULL)\
    \ {\n        printf(\"Cannot open the specified directory: %s\\n\", dir);\n  \
    \      exit;\n    }\n    while((entry = readdir(dp)) != NULL) {\n        printf(\"\
    \ Name of file is : %s\\n\", entry->d_name);\n    }\n    closedir(dp);\n}\nvoid\
    \ main(){\n    printf(\"Beginning to display contents of current directory.\\\
    n\");\n    displayfiles();\n    exit(0);\n}\n```\n\nThe `->` is actually a special\
    \ character, but in the program you have to use `->`, which is a minus sign followed\
    \ by the greater than sign. We access structure members with a structure.member\
    \ usually, but if it’s a pointer to a structure, we use `pointer_to_structure->member`.\n\
    \nThe types of Errors you can get are :\n\n- `EPERM`\n- `ENOENT`\n- `EINTR`\n\
    - `EIO`\n- `EBUSY`\n- `EEXIST`\n- `EINVAL`\n- `EMFILE`\n- `ENODEV`\n- `EISDIR`\n\
    - `ENOTDIR`\n\n```c\n#include <string.h>\nchar *strerror(int errnum);\n```\n\n\
    `strerror` is a C library function that tells you what the error was if you give\
    \ it an error number. It returns a pointer to a string containing the message.\n\
    \n```c\n#include <stdio.h>\nvoid perror(const char *s);\n```\n\nThis prints the\
    \ latest error following the string you specify in `s.`\n\n## Memory and command\
    \ line arguments\n\nLingaraj began.\n\n“We can use a file and store it in a particular\
    \ memory location.”\n\nAn example would be putting a cocktail recipe in a particular\
    \ location. You can even specify the location or leave it to the kernel. Usually,\
    \ according to my grandfather’s instructions we place it near the pond on the\
    \ rocks. You can even specify whether it can be read, written or executed. You\
    \ can even allow other files and processes to access the memory location. Useful\
    \ because whenever we put it on those rocks and come back to collect it, there\
    \ would be more recipes added by people who would have experimented the previous\
    \ night. Also, we find the inventors of this recipe still lying there in stupor.\n\
    \n![](image_rsrc84T.jpg)\n\nThe syntax is :\n\n```c\n#include <sys/mman.h>\nvoid\
    \ *mmap(void *addr, size_t len, int prot, int flags, int fildes, off_t off);\n\
    ```\n\n“Lots of arguments.” said Seema.\n\n“Let’s imagine we have have a cocktail\
    \ called the conflict arrestor and if you look at my grandfather’s text file for\
    \ this, the contents of the file are :\n\n‘This is a conflict arrestor where the\
    \ parties indulging in a quarrel are given doses so they forget logic. This is\
    \ achieved by…””\n\n“Forget the contents, tell me what the arguments are.” said\
    \ Seema.\n\n- `addr` is the address in memory. Usually it is zero to let the kernel\
    \ decide on its own.\n- `len` is the length of the memory block.\n- `prot` is\
    \ what sets permissions :\n    - `PROT_READ`: You can read the segment.\n    -\
    \ `PROT_WRITE`: The segment can be written to.\n    - `PROT_EXEC`: The segment\
    \ can be executed\n    - `PROT_NONE`: The segment can’t be accessed\n- The `flags`\
    \ parameter controls how changes made to the segment by the program are reflected\
    \ in other places.\n    - `MAP_PRIVATE`\n    - `MAP_SHARED`\n    - `MAP_FIXED`\n\
    - `filedes` is the file descriptor.\n- `off_t` is the offset.\n\n```c\n#include\
    \ <sys/mman.h>\nint msync(void *addr, size_t len, int flags);\n```\n\nIf there\
    \ are changes, `msync()` updates the mapped file. Something like `fflush`.\n\n\
    It’s like saving.\n\nThe flags are :\n- `MS_ASYNC`: An update be scheduled, but\
    \ the call returns immediately.\n- `MS_SYNC`: Requests an update and waits for\
    \ it to complete.\n- `MS_INVALIDATE`: Invalidates other mappings of the same file.(Useful\
    \ when you want to update with fresh values just written.)\n\nSeema attempted\
    \ to explain the flags.\n\n“I can’t be as good as you at analogies or weird stories.\
    \ But `MS_ASYNC` is like asking your subordinate to do a job, tell him and come\
    \ back. `MS_SYNC` is like being there until the job is complete.\n\n`MS_INVALIDATE`\
    \ is like saying, “Don’t listen to anybody else for instructions.” to your subordinate.”\n\
    \n```c\n#include <sys/mman.h>\nint munmap(void *addr, size_t len);\n```\n\nThe\
    \ `munmap` releases the memory segment. Something you will find useful if Vijay’s\
    \ memory is rife with information about a particular Sanjana or Savitri.”\n\n\
    Lingaraj showed her the screen.\n\n“Look here.”\n\n`mapandunmap.c`\n\n```c\n#include\
    \ <string.h>\n#include <unistd.h>\n#include <stdio.h>\n#include <sys/mman.h>\n\
    #include <fcntl.h>\n#include <stdlib.h>\ntypedef struct {\n    int integer;\n\
    \    char string[1024];\n} RECORD;\nint main(){\n    RECORD record, *mapped;\n\
    \    int i, f;\n    FILE *fs;\n    fs = fopen(\"records.dat\",\"w+\");\n    record.integer\
    \ = 1234;\n    strcpy( record.string , \"Seema doesn't understand Linux.\");\n\
    \    fwrite(&record,sizeof(record),1,fs);\n    fclose(fs);\n    f = open(\"records.dat\"\
    ,O_RDWR);\n    mapped = (RECORD *) mmap(0, sizeof(record), PROT_READ|PROT_WRITE,\
    \ MAP_SHARED, f, 0);\n    printf(\"Number before changing the mapped value : %d\\\
    n\", record.integer);\n    printf(\"Sentence before changing the mapped value\
    \ : \\n%s\\n\", record.string);\n    mapped->integer = 5678;\n    strcpy( mapped->string\
    \ , \"Seema has learnt Linux.\");\n    msync(mapped, sizeof(record), MS_ASYNC);\n\
    \    munmap(mapped, sizeof(record));\n    close(f);\n    fs = fopen(\"records.dat\"\
    ,\"r+\");\n    fread(&record, sizeof(record),1, fs);\n    printf(\"Number after\
    \ changing the mapped value : %d\\n\", record.integer);\n    printf(\"Sentence\
    \ after changing the mapped value : \\n%s\\n\", record.string);\n    fclose(fs);\n\
    \    exit(0);\n}\n```\n\nThis needs some explanation\n\n```c\n#include <string.h>\n\
    #include <unistd.h>\n#include <stdio.h>\n#include <sys/mman.h> // is an important\
    \ include file.\n#include <fcntl.h>\n#include <stdlib.h>\ntypedef struct {\n \
    \   int integer;\n    char string[1024];\n} RECORD; // We define a structure of\
    \ the type `RECORD` which consists of two members, an integer and a string.\n\
    int main(){\n    RECORD record, *mapped; // We declare `record` and `mapped`,\
    \ which we will call later to store the return from `mmap`, to be structures of\
    \ the type `record`. `mapped` points to the address where a record of the type\
    \ `RECORD` is stored.\n    int i, f;\n    FILE *fs;\n    fs = fopen(\"records.dat\"\
    ,\"w+\");\n    record.integer = 1234;\n    strcpy( record.string , \"Seema doesn't\
    \ understand Linux.\");\n    fwrite(&record,sizeof(record),1,fs);\n    fclose(fs);\
    \ // We open a file stream because we need formatted output as we are copying\
    \ the a string to the member in the structure.\n    f = open(\"records.dat\",O_RDWR);\n\
    \    mapped = (RECORD *) mmap(0, sizeof(record), PROT_READ|PROT_WRITE, MAP_SHARED,\
    \ f, 0); // We open a file called records.dat. It does not have to have a `.dat`\
    \ extension. We use `open` because we need the file descriptor number to use `mmap`.\
    \ The return is assigned to `mapped`, which as we have already declared points\
    \ to a structure of the type `RECORD` and record.\n    printf(\"Number before\
    \ changing the mapped value : %d\\n\", record.integer);\n    printf(\"Sentence\
    \ before changing the mapped value : \\n%s\\n\", record.string); // Here, we print\
    \ the values before mapping.\n    mapped->integer = 5678;\n    strcpy( mapped->string\
    \ , \"Seema has learnt Linux.\"); // We change the values. Mind you, we are not\
    \ changing the values of the structure members in the records.dat file directly.\
    \ We are changing the mapped values, which should be reflected in the records.dat\
    \ file.\n    msync(mapped, sizeof(record), MS_ASYNC);\n    munmap(mapped, sizeof(record));\
    \ // We update the mapped memory and unmap. Then we close the file descriptor\
    \ which had opened records.dat.\n    close(f);\n    fs = fopen(\"records.dat\"\
    ,\"r+\");\n    fread(&record, sizeof(record),1, fs); // We then again open the\
    \ file stream pertaining to records.dat because we need to read a structure stored\
    \ in records.dat. We then proceed to read using `fread` and print the values which\
    \ have been changed.\n    printf(\"Number after changing the mapped value : %d\\\
    n\", record.integer);\n    printf(\"Sentence after changing the mapped value :\
