  trans: "\n\n# 贵物品：2 颗钻石，4 条金项链，6 条珍珠项链，20 万卢比现金。\n\n“藏在 Sohi 山顶的橡树树下，”鹦鹉说。\n\n然后警察员把我的名字告诉了鹦鹉。\n\
    \n“名字：Lingaraj。\n贵物品：关于如何改善世界的电影剧本和诗歌。\n丢在他房子外的侧水沟里。”\n\n所以，鹦鹉有一个数据库，可以通过名称（键）进行请求。\n\
    \n当你创建一个数据库时，会创建两个文件，一个扩展名为 `.dir`，另一个扩展名为 `.pag`。它们构成了由单一 `dbm` 指针标识的对。你只能通过\
    \ `dbm` 例程来修改它们。\n\n## 主要函数\n\n主要函数有这些：\n\n```c\n#include <ndbm.h>\nDBM *dbm_open(const\
    \ char *filename, int file_open_flags, mode_t file_mode);\n```\n\n- `filename`\
    \ 是你给数据库的没有扩展名的名称。\n- `file_open_flags` 与 `O_CREAT` 进行“或”位运算。\n- `mode` 用于设置权限。\n\
    - 它返回一个数据库描述符。\n\n```c\nint dbm_store(DBM *database_descriptor, datum key, datum\
    \ content, int store_mode);\n```\n\n- `datum` 是一种数据类型，至少包含 2 个成员：\n  - `void *dptr;`\n\
    \  - `size_t dsize`\n- `dsize` 指定数据的大小，`dptr` 指向存储的数据。\n- `datum key` 是我们在鹦鹉故事中提到过的键，一个标识符。\n\
    - `datum content` 是实际内容。\n- `store_mode`：当你尝试使用已存在的键存储某些数据时，会发生什么。如果设置为 `dbm_insert`，则值不会被存储。但是，如果设置为\
    \ `dbm_replace`，则值会被替换。\n\n```c\ndatum dbm_fetch(DBM *database_descriptor, datum\
    \ key);\n```\n\n“这根据键取取数据，”Seema 说。Lingaraj 继续说道。\n\n```c\nvoid dbm_close(DBM\
    \ *database_descriptor);\n```\n\n“关闭数据库并移除进程对指定数据库的访问。”\n\n```c\nint dbm_delete(DBM\
    \ *database_descriptor, datum key);\n```\n\n它删除数据库中的某特定记录。\n\n```c\nint dbm_error(DBM\
    \ *database_descriptor);\n```\n\n这检查数据库中的错误。\n\n```c\nint dbm_clearerr(DBM *database_descriptor);\n\
    ```\n\n这清除任何错误状态标志位。\n\n```c\ndatum dbm_firstkey(DBM *database_descriptor);\n\
    datum dbm_nextkey(DBM *database_descriptor);\n```\n\n这用于按顺序访问记录。关于数据库的部分就这些。\n\
    \n## 进程\n\n“我们去散散步吧，”Lingaraj 说。\n\n他们去散了步去了一个椰子林。Seema 对这个地方感到惊为观止，那里有很多高树。树上有一些蜂巢，Lingaraj\
    \ 告诉 Seema，他带她来这里是为了谈论蜜蜂。\n\n![](img/image_rsrc855.jpg)\n\n“蜜蜂总是在忙碌。蜂王准许许多蜜蜂的请求。但只有一只蜂王。请求可能是‘我得到了这些花蜜，我该把它放在哪儿？’\n\
    \n而蜂王的回答是：\n‘花蜜？绝对不要在路上。’”\n\nSeema 没有笑，Lingaraj 指出 nectar（花蜜）是道路建设中使用的 tar（焦油）一词的双关语。Seema\
    \ 还是没有笑。Lingaraj 就放过了。\n\n“所以每个工蜂与蜂王的每次听见都是一个时间片。蜂王往往有注意力缺陷症。她通过给一只工蜂大约 5 分钟的时间，要求他等待并移动到下一只蜜，那只蜜可能会询问如何对熊。她可能会说：\n\
    ‘请忍耐（bear with it）。’\n\n当然，蜂王的听众中会有更多的蜂。\n\n![](img/image_rsrc856.jpg)\n\n这给人一种她在同时处理所有人的印象。但事实并非。要理解的一点是，所有的蜜蜂都执行所有的任务，但在不同的时间片轮中进行。所以，当蜂王正在处理一个想做饭的厨蜂的请求时，她和所有其他蜜蜂都在积极处理这项工作。然后他们暂停该工作，转到下一个任务，可能是由于人类唱了一首反复重复的歌曲而去刺他。他们包围他，当这个人在震惊中准备挨刺时，他们停下来并回来。然后，他们承担巢内部的清洁工作。然后他们重复所有工作，从他们暂停的地方继续。告诉他们他们在何处的——例如，他们包围人类时所在的位置——是该进程的程序计数器。\n\
    \n在 Linux 中，处理器一次处理一个任务，以时间片的形式进行，但它们都发生得非常快，给人一种它正在同时做这一切的印象。\n\n“所以，蜂王就像内核。当蜂王要求采取后续行动时，工蜂的请求就可以转换为一个操作，”Seema\
    \ 说。\n\n“或者你可以把一切都看作一个进程。每个进程都有一个 `PID`，一个进程标识符。有一个进程的 `PID` 为 1。它被称为‘init’。它被称为所有进程的父进程。\n\
    \n当程序存储在内存中，没有程序可以修改代码。它是只读的。其他程序可以共享它，”Lingaraj 说。\n\n“当蜂王下命令并放在告示板上，没有人能改变它。它们可以共享它，”Seema\
    \ 说。\n\nLingaraj 笑了。“我们也有共享库。库是现成的代码。就像薯片。你不需要烹饪它们，而是采购现成的。蜂王告诉蜜蜂去烹饪。”\n\n制作配料的方法（对于两者）都在共享库中，命令引用它。制作配料的指令没有针对每道菜指定。也就是说，它在内存中。\n\
    \n当然变量不能共享。例如，如果 Idly 的配料是辣椒粉，而 Dosei 的配料是香菜，你不能只有一个配料项。在两种情况下都需要两个实例。\n\n进程拥有：\n\
    - 它自己的栈空间。\n- 它自己的环境空间。\n- 它自己的程序计数器。\n\n执行 `ps -ef` 命令查看更多信息。在这里你可以看到：\n- 进程的用户\
    \ ID\n- `PID`\n- 父 PID\n- 进程调度信息\n- 开始时间\n- 终端\n- 持续时间\n- 启动进程的命令\n\n"
- fmt: "\nA parallel would be the `system` call is like an agent, which gets things\
    \ done by others. Suppose I have a home manager. I ask him to call a cook for\
    \ a party and he does the cooking at home while I was in office. The home manager\
    \ would charge his commission and get the job executed by the cook. The same way\
    \ with plumbing, driving and standing in a queue to pay the bills.\n\nBut if you\
    \ have an all rounder, who knows how to cook, knows how to drive and pay bills,\
    \ it would be helpful.\n\nThere are many types. Some who accept only one argument.\
    \ Some, that accept an array of arguments and some who ask you for the path.\n\
    \n```c\n#include <unistd.h>\nchar **environ;\nint execl(const char *path, const\
    \ char *arg0, ..., (char *)0);\n```\n\nThe `path` is obviously where the command\
    \ executable is stored.\n\n`arg0`, `arg1` etc are the arguments to the program\
    \ being called. If you have written a program yourself, these arguments are the\
    \ arguments to the `main` function in that. `(char *) 0` tells the `execl` C library\
    \ function, the argument list is over.\n\nNow, the `execl` class of C library\
    \ functions, you can think of them as Mr All round Arun.\n\nAll round Arun was\
    \ a valet I had. He knew everything. He was a good driver, a good cook, a film\
    \ director, a rocket scientist and a plumber. Whenever I asked him to do a job,\
    \ he would don that particular hat. My job became his job and he used to execute\
    \ it very well.”\n\n“You mean a new process wasn’t started? It was like you were\
    \ doing it?” asked Seema.\n\n“Exactly. When an `exec` class of functions, starts\
    \ a new process, it uses the process ID of the calling process. Remember will\
    \ execution in shell scripts? How my grandfather died and wanted my father to\
    \ take over concoction duties. This is like the same thing, but as C library functions.\
    \ And they call executable files.” said Lingaraj. He continued.\n\n“Arun never\
    \ even used to charge me anything because he was rich.”\n\n“And what happened\
    \ then? He died?”\n\n“No, I fired him.”\n\n“Why?”\n\n“One day he wore my hat and\
    \ started thinking he was me. He ordered me around and I worked for him until\
    \ I had an opportunity to take his hat off.”\n\nThe called process actually does\
    \ away with the calling process. The calling process goes away.\n\n```c\nint execlp(const\
    \ char *file, const char *arg0, ..., (char *)0);\n```\n\nHere, `path` is replaced\
    \ with `file`. This suggests that the command will automatically look for the\
    \ file in the `PATH` variable. If the file isn’t in the path, you have to specify\
    \ the full path name.\n\n```c\nint execle(const char *path, const char *arg0,\
    \ ..., (char *)0, char *constenvp[]);\n```\n\nHere, the `e` symbolises ‘extra’.\
    \ Usually the environment the new process should run in. If not defined, the environment\
    \ of the current process is used.\n\n```c\nint execv(const char *path, char *const\
    \ argv[]);\n```\n\nHere, this function takes an array of arguments.\n\n```c\n\
    int execvp(const char *file, char *const argv[]);\n```\n\nThe name of the file\
    \ in the `PATH` or the complete path and an array is passed as an argument.\n\n\
    ```c\nint execve(const char *path, char *const argv[], char *const envp[]);\n\
    ```\n\nAgain, the name of the file in the `PATH` or the complete path and an array\
    \ as an argument along with the environment.\n\nSo, if there is a `p` in the function,\
    \ it will search in the path, `e` means something extra, an environment and `v`\
    \ means an array.\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\npid_t\
    \ fork(void);\n```\n\nIf you want Vijay to start another process whilst he is\
    \ praising your relatives...”\n\n“I will use `Ctrl+C` and `Ctrl+V`, Copy-paste.”\n\
    \n“Ctrl+C` is a signal that will stop the foreground process. So, if you use `Ctrl+C`\
    \ on Vijay, you will immediately stop his foreground process, which is praising\
    \ your relatives.\n\nThe `fork` is like the copy paste for processes, but it assigns\
    \ a different `PID` for each process that is spawned.\n\nWhy would you need to\
    \ `fork`? To create a child process.\n\nAnyway the `fork` returns the `PID` of\
    \ the child process to the parent process. To the child process, it returns `0`.\
    \ And in case of failure, it returns `-1` to the parent process. This is very\
    \ important in the context of programming. It gives us a way to know whether the\
    \ program is in the parent process or in the child process. Hence of the type\
    \ `pid_t`. So, when you `fork`, you create another instance of the process, a\
    \ child process. If it fails, it returns `-1`. The reasons it might fail are:\n\
    \n- Too many child processes, the limit being specified by `CHILD_MAX`. When you\
    \ see the `errno`, it will be `EAGAIN`.\n- If there’s no space in the process\
    \ table or if there’s no memory, the `errno` is set to `ENOMEM`.\n\n```c\n#include\
    \ <sys/types.h>\n#include <sys/wait.h>\npid_t wait(int *stat_loc);\n```\n\nLet\
    \ me mention it again. How do you find out if you are in the child process or\
    \ the parent in the program execution? By the return value. In the child it is\
    \ zero, in the parent, the `pid` of the child process.\n\nThe parent process,\
    \ the one which created the child can enquire the status, whether it is running\
    \ or stopped using `wait()`. The status is stored in `stat_loc`. A list of:\n\
    - `WEXITED`\n- `WSTATUS`\n- `WSIGNALED`\n- `WTERMSIG`\n- `WSTOPPED`\n\n```c\n\
    #include <sys/types.h>\n#include <wait.h>\npid_t waitpid(pid_t pid, int *stat_loc,\
    \ int options);\n```\n\n`pid` is the process ID of the child. Now, `options`:\n\
    - Same as `wait()` but `WOHANG` does not suspend the caller. It returns `0` if\
    \ the child is still running.\n- It returns `-1` if the call is interrupted or\
    \ the argument is invalid.\n\nAnother important thing to know is that if a process\
    \ opens file descriptors, they are preserved when `exec` family of functions is\
    \ called. When a process terminates, the entry remains in the process table until\
    \ the parent terminates, the parent process becomes `init`. Let’s look at a program.\
    \ `maker.c`\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n#include <unistd.h>\n\
    #include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    pid_t pid;\n    char\
    \ *message;\n    int exit_code;\n    printf(\"Fork starting\\n\");\n    pid =\
    \ fork();\n    switch(pid)\n    {\n        case -1:\n            exit(1);\n  \
    \      case 0:\n            printf(\"This is the child\\n\");\n            printf(\"\
    With PID : %d\\n\", getpid());\n            exit(EXIT_SUCCESS);\n            break;\n\
    \        default:\n            printf(\"\\n\\nThis is the parent\\n\");\n    \
    \        printf(\"With PID : %d\\n\", getpid());\n            sleep(30);\n   \
    \         break;\n    }\n    exit(EXIT_SUCCESS);\n}\n```\n\nThe above program\
    \ `fork`s and creates a child process. And we can identify whether the process(when\
    \ the program is running) is in the parent process or in the child process. If\
    \ the process ID is `0`, it means it is the child process. It is immediately ended.\
    \ The parent is allowed to continue for 30 seconds more. Then the program exits.\
    \ Why did I do this? To show you a zombie process. A zombie process is a name\
    \ given to the child process if it terminates before the parent process in case\
    \ the `wait()` call is not called by the parent.\n\n`wait` as you know returns\
    \ the status of the child process to the parent. When we run this program, we\
    \ get the following output.\n\n```\nThis is the parent\nWith PID : 35916\nThis\
    \ is the child\nWith PID : 35917\n```\n\nAt the other terminal, if you type\n\n\
    ```bash\n$ ps -al\n```\n\nAmong other processes, you will find an entry:\n\n```\n\
    1 Z  1000  35917  35916  0  80  0 -       0 -       pts/0   00:00:00\n```\n"
