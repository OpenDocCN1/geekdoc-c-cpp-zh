    “为了社会的利益，仪式官 Seena 必须传递这些信息。由于协议的成本太高，我们设置了消息信使。就像这些外卖伙伴一样。这些消息信使从人们那里收集信息，最后交给仪式官
    Seena 让他们在傍晚进行打印。这样一来，大家都很开心。


    所以这些高层调用就像这些消息信使，在不产生太多开销的情况下，让 Seena 参与进来。


    有些 C 库函数可以节省系统开销。它们是：


    | `fopen` |

    | `fclose` |

    | `fread` |

    | `fwrite` |

    | `fflush` |

    | `fseek` |

    | `fgetc` |

    | `getc` |

    | `getchar` |

    | `fputc` |

    | `putc` |

    | `putchar` |

    | `fgets` |

    | `gets` |

    | `printf`, `fprintf` and `sprintf` |

    | `scanf`, `fscanf` and `sscanf` |

    | `#include <stdio.h>FILE *fopen(const char *filename, const char *mode);` |


    `fopen` 打开由 `filename` 参数命名的文件并与其关联一个流。`mode` 参数指定了打开文件的方式。它是以下字符串之一：


    | “r” |

    | “w” |

    | “a” |

    | “r+” |

    | “w+” |

    | “a+” |


    它是作为流打开的，而不是作为文件。”


    “流（stream）和文件描述符（file descriptor）的区别是什么？”


    “区别在于系统看待文件的方式。流是高层访问。如果你想对文件执行控制操作，你需要使用文件描述符。文件描述符可以简单发送或接收数据，但打开一个流使得格式化的输入输出成为可能。


    这就像是微妙地、有技巧地处理情况与否。你以特定的方式交谈，展现各种礼仪。打开文件描述符更多是关于控制。


    这是技术性与诗意之间的区别。


    “继续下去，如果你正在浏览 Vijay 大脑中的文件，而你遇到了一个描述了 Vijay 与一个名为 Asha 的女性约会记忆的文件，你会怎么做。”Lingaraj
    问道。


    “我会问他，Asha 是谁。”


    “而 Vijay 会毫无畏惧地回答，因为他现在是一台机器了。更智能的选择是修改文件。你可以将它们设置为只读。或者更新文件将 Asha 的名字改为你的名字。或者追加，添加细节如
    Asha 对 Vijay 并不好，她和他吵过架。或者完全删除所有内容。”


    “我会完全删除所有内容。”


    “再次，打开文件的语法是


    ```c

    FILE *fopen(const char *filename, const char *mode);

    ```


    该 C 库函数返回指向相关文件流的指针。


    ```c

    #include <stdio.h>size_t fread(void *ptr, size_t size, size_t nitems, FILE *stream);#include
    <stdio.h>size_t fwrite(const void *ptr, size_t size, size_t nitems, FILE *stream);

    ```


    在刚才提到的 C 库函数中，`fopen` 返回的文件流被用于读取和写入。`fread()` 和 `fwrite()` 返回已写入或读取的数据的大小。


    ```c

    #include <stdio.h>int fclose(FILE *stream);

    ```


    `fclose` 关闭文件。即使没有调用 `fclose()`，文件也会关闭。但它并不是完全多余。`fclose()` 返回一个整数，可以用于失败时检查错误。


    ```c

    #include <stdio.h>int fflush(FILE *stream);

    ```


    这会导致文件流上的数据被立即写入。如果你在使用 `fclose()`，则没需要使用它，因为调用 `fclose()` 会执行刷新操作。


    ```c

    #include <stdio.h>int fseek(FILE *stream, long int offset, int whence);

    ```


    `fseek` 将你带到文件的特定位置。


    ```c

    #include <stdio.h>int fgetc(FILE *stream);int getchar();

    ```


    `fgetc` 从文件流中读取下一个字节作为字符。


    `getchar` 从标准输入读取字符。


    ```c

    #include <stdio.h>int fputc(int c, FILE *stream);

    ```


    `fputc` 将一个字符放入文件流。


    ```c

    int putchar(int c);

    ```


    `putchar` 将一个字符输出到标准输出。


    ```c

    #include <stdio.h>char *fgets(char *s, int n, FILE *stream);char *gets(char *s);

    ```


    `fgets` 从文件流读取字符并写入字符串。


    “那 `gets` 呢？它是做什么的？”Lingaraj 突然问道。


    “`gets` 从标准输入读取字符并写入字符串。”Seema 勤奋地回答道。


    “据我所知，它的功能得多，建议不要使用它。”Lingaraj 警告道。


    ```c

    #include <stdio.h>int printf(const char *format, ...);int sprintf(char *s, const
    char *format, ...);int fprintf(FILE *stream, const char *format, ...);

    ```


    “我希望你在 C 语言中涵盖了这些。”Lingaraj 问道。


    “是的，我会解释。


    `printf` 在标准输出上产生输出。


    `sprintf` 写入字符串。


    `fprintf` 写入特定的流。”Seema 说道。


    “好的。这是你所知道的打印格式。你会经常用到它，所以我们在这里来看一遍。


    | %d , %i |

    | %o , %x |

    | %c |

    | %s |

    | %f |


    ```c

    #include <stdio.h>int scanf(const char *format, ...);int fscanf(FILE *stream,
    const char *format, ...);int sscanf(const char *s, const char *format, ...);

    ```


    `scanf` 从标准输入获取数据。`fscanf` 从文件流获取，


    而 `sscanf` 从字符串获取。打印让我想起了这些。”Lingaraj 说。


    “流和文件描述符并不是像油和水那样的，


    ```c

    #include <stdio.h>int fileno(FILE *stream);FILE *fdopen(int fildes, const char
    *mode);

    ```


    `fileno` 告诉你流的文件描述符。


    `fdopen` 根据文件描述符和模式打开一个文件流。`fopen` 也打开了文件，但是使用文件名。


    所以，文件描述符和流之间存在联系，它们并不是对立的选择路径。


    接下来是伪代码。一种构建程序的方法。伪代码通常更易理解，但既然我在这里陪着，我想我们可以跳过详细的指导部分。这是一个使用 FILE 流从一个文件读取并写入另一个文件的程序。这并不是一个完整的程序，因为完整的程序可能是在喂饭给你你。我希望你根据这些信息写一个程序并在你的系统上尝试。”Lingaraj
    向 Seema 展示了他笔记本电脑上的一个文本文件。

