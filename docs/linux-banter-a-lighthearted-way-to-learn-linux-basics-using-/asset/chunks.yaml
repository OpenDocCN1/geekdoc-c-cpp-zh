- fmt: "\n# File Operations and Permissions\n\n- Include the necessary header files.\n\
    - Start the `main()` function.\n- Declare two file streams, one for input and\
    \ the other for output of the type `FILE`.\n- Open the input file using `fopen()`\
    \ in read mode. Assign the returning file stream to the declared file stream variable.\n\
    - Open the output file in write mode. And again assign the returning file stream\
    \ to the declared variable.\n- Use a `while` loop to get a character from the\
    \ input file stream and write it to the output file using the output file stream\
    \ until the End Of File(`EOF`) is reached.\n- Exit.\n\n## File Permissions Storytelling\n\
    \nWhen you looked at my files in my directory you saw a lot of characters that\
    \ looked like this: `rwx`.\n\nThey are permissions. I will show you my cooking\
    \ directory. \n\nLingaraj opened the Cooking Directory on his laptop. He showed\
    \ one entry:\n\n| Herbed bread `rw_rw_r__` |\n\nThe first group of three characters\
    \ is for the user, the second group is for the group of people who have access\
    \ to the file. The third group is for others.\n\n- `r` stands for read. Which\
    \ means I can read this file.\n- `w` stands for write, it means I can write to\
    \ this file.\n- The missing bit `x`, is for executable. Since this is a text file,\
    \ it can't be executed.”\n\nLingaraj looked into the distance. Seema sensed a\
    \ story was coming.\n\n“I once had a flock of sheep. I used to grant permissions\
    \ by training the sheep with basic technology. I used to show photos of people\
    \ to whom I had given contracts, to those sheep, and the sheep would trust these\
    \ guys. The wool to one guy, milk to another, droppings to another.\n\n![](image_rsrc84M.jpg)\n\
    \nThen I did not bother to maintain them. I used to let them roam free. The sheep\
    \ would be so well trained that if a guy given the milk contract would try to\
    \ get some wool, the sheep would bite him. So, a user cannot access a file that’s\
    \ not meant for him.”\n\n“I am guessing it didn’t end well. What happened?”\n\n\
    “One day I found them missing.”\n\n“Somebody killed them for meat?”\n\n“No. A\
    \ neighbouring king drafted the sheep into his army.”\n\n“Why?”\n\n“Because the\
    \ sheep bleat the droppings out of the enemies.\n\n![](image_rsrc84N.jpg)\n\n\
    Seema seriously wished the laptop hadn’t fallen on Vijay’s head. Lingaraj continued.\n\
    \n## System Calls for Ownership\n\n```c\n#include <sys/stat.h>\nint chmod(const\
    \ char *path, mode_t mode);\n```\nThis changes the mode of a file or directory.\n\
    \n```c\n#include <sys/types.h>\n#include <unistd.h>\nint chown(const char *path,\
    \ uid_t owner, gid_t group);\n```\nThis changes the ownership of the file or directory.\
    \ Where do you get values for the `uid_t` and `gid_t`? From the `getuid()` and\
    \ `getgid()` calls. `getuid` and `getgid` return the user ids and group ids respectively.\
    \ They are not integers, but of the type `uid_t` and `gid_t`, but they look like\
    \ integers.\n\nIt’s like this. We have a dog called Stupid. I will demonstrate.”\
    \ And Lingaraj took Seema outside.\n\n“Stupid!” Lingaraj called out loud.\n\n\
    ![](image_rsrc84P.jpg)\n\nA dog suddenly appeared and looked playful. Then it\
    \ looked at Seema and tried to attack.\n\n![](image_rsrc84R.jpg)\n\nSeema was\
    \ scared. The dog came near and was about to jump at Seema when Lingaraj shouted,\
    \ `chown Seema`.\n\nThe dog changed it’s attitude immediately and wagged it’s\
    \ tail.\n\n![](image_rsrc84S.jpg)\n\nSeema gasped. Lingaraj explained. “This dog,\
    \ Stupid, is good at playing and ferocious as well. Whenever a new person comes\
    \ and if the dog tries to attack him, the people immediately use this command\
    \ `chown name`. The dog then updates itself thinking he is the new owner and doesn’t\
    \ attack him. He plays with him. Needless to say, I trained this dog. Just an\
    \ example to teach you about ownership and ids.”\n\n“You have stooped too low,\
    \ I think it’s a ‘stoopid’ way to teach.”\n\n“That’s a good one.” They went back\
    \ inside and Lingaraj resumed. He showed her some system calls.\n\n## File and\
    \ Directory Management\n\n```c\n#include <unistd.h>\nint unlink(const char *path);\n\
    int link(const char *path1, const char *path2);\nint symlink(const char *path1,\
    \ const char *path2);\n```\n`unlink()` is something like deletion. Except the\
    \ space the file had been using is released after the last process using the file\
    \ is terminated.\n\n`link()` links one file with another. So, the file specified\
    \ by `path1` can be accessed by specifying `path2`. If a file actually exists\
    \ as you specified in `path2`, there will be an error. So, the file in `path2`\
    \ should not exist.\n\nOf course, when you do `ls`, the file specified by `path2`\
    \ will be listed, but will open the file specified by `path1`.\n\n```c\n#include\
    \ <sys/types.h>\n#include <sys/stat.h>\nint mkdir(const char *path, mode_t mode);\n\
    #include <unistd.h>\nint rmdir(const char *path);\n```\nMakes and removes directories.\
    \ You know the part about the mode when it comes to making directories. `rmdir`\
    \ removes the directory only if it’s empty. Of course, you have to try them out\
    \ in your programs. All of it. I can’t teach you C programming. I only teach you\
    \ the theory behind the system.\n\n```c\n#include <unistd.h>\nint chdir(const\
    \ char *path);\n```\nChanges the directory.\n\n## Directory Traversal\n\n```c\n\
    #include <unistd.h>\nchar *getcwd(char *buf, size_t size);\n```\nChanges the directory.\
    \ To illustrate, look at this program:\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <stdlib.h>\n#include <unistd.h>\n\nint main(){\n    char word[1024];\n\
    \    int fd = open(\"/tmp\", O_CREAT | O_WRONLY);\n    write(fd, \"Lingaraj\"\
    , 8);\n    close(fd);\n    getcwd(word, 1024);\n    printf(\"Current directory\
    \ is : %s\\n\", word);\n    chdir(\"/tmp\");\n    getcwd(word, 1024);\n    printf(\"\
    Current directory is : %s\\n\", word);\n}\n```\n\n## Directory Entry Details\n\
    \nThe directory functions are declared in `dirent.h`. They use a structure `DIR`.\
    \ The `opendir` function opens a directory and creates a directory stream.\n\n\
    ```c\n#include <sys/types.h>\n#include <dirent.h>\nDIR *opendir(const char *name);\n\
    ```\n`opendir` returns a null pointer on failure.\n\n```c\n#include <sys/types.h>\n\
    #include <dirent.h>\nstruct dirent *readdir(DIR *dirp);\n```\nThe above C library\
    \ function returns a pointer to the next entry in the directory structure. Why\
    \ not the current entry? Because `opendir` has already returned the first entry.\
    \ And we need the entry after that.\n\n```c\n#include <sys/types.h>\n#include\
    \ <dirent.h>\nlong int telldir(DIR *dirp);\n```\nIt tells you the current position\
    \ in a directory stream.\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\n\
    void seekdir(DIR *dirp, long int loc);\n```\nThis is used to set the directory\
    \ entry pointer. The difference between this and `readdir` is that `readdir` returns\
    \ the next entry, but this C library function can make `readdir` return the directory\
    \ entry further down or back. But the location, `loc` has to be obtained previously\
    \ using `telldir()`.\n\n“If I call `telldir`, get a position for `loc` and then\
    \ call `seekdir` and give it the same position, what am I achieving? The pointer\
    \ stays at the same place.”\n\n“Usually, you would have to create a loop, and\
    \ get directory locations, `loc` using `telldir` for successive entries. Then,\
    \ you can choose which `loc` value to pass to `seekdir`.”\n\n```c\n#include <sys/types.h>\n\
    #include <dirent.h>\nint closedir(DIR *dirp);\n```\n"
