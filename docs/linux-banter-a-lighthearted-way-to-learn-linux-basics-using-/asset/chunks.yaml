- fmt: "\n# Valuables: 2 diamonds, 4 gold necklaces, 6 pearl necklaces, 20 lakhs in\
    \ cash.\n\n‘Hidden under the oak tree at the top of Sohi mountain.’ said the parrot.\n\
    \nThen the policeman told my name to the parrot.\n\n‘Name : Lingaraj.\nValuables\
    \ : Film scripts and poems about how to improve the world.\nThrown in the gutter\
    \ outside his house.’\n\nSo, the parrot has a database which can be requested\
    \ using a name, which is the key.\n\nWhen you create a database, two files are\
    \ created, one with a `.dir` extension and one with a `.pag` extension. These\
    \ constitute a pair which is identified by a single `dbm` pointer. You have to\
    \ change them only through `dbm` routines.\n\n## Major Functions\n\nThe major\
    \ functions are these.\n\n```c\n#include <ndbm.h>\nDBM *dbm_open(const char *filename,\
    \ int file_open_flags, mode_t file_mode);\n```\n\n- `filename` is a name without\
    \ an extension you give the database.\n- `file_open_flags` are ‘OR’ed with `O_CREAT`.\n\
    - `mode` is used to set permissions.\n- It returns a database descriptor.\n\n\
    ```c\nint dbm_store(DBM *database_descriptor, datum key, datum content, int store_mode);\n\
    ```\n\n- `datum` is a data type which has at least 2 members:\n  - `void *dptr;`\n\
    \  - `size_t dsize`\n- The size specifies the size of the data and `dptr` points\
    \ to the stored data.\n- `datum key` is the key which we have touched upon in\
    \ the parrot story, an identifier.\n- `datum content` is the actual content.\n\
    - `store_mode`: What happens if you try to store some data using a key that already\
    \ exists. If it’s set to `dbm_insert` the value isn’t stored. However if it’s\
    \ set to `dbm_replace`, the value is replaced.\n\n```c\ndatum dbm_fetch(DBM *database_descriptor,\
    \ datum key);\n```\n\n“This fetches the data based on the key.” said Seema. Lingaraj\
    \ continued.\n\n```c\nvoid dbm_close(DBM *database_descriptor);\n```\n\n“Closes\
    \ the database and removes process access to the specified database.\n\n```c\n\
    int dbm_delete(DBM *database_descriptor, datum key);\n```\n\nIt deletes a particular\
    \ record in the database.\n\n```c\nint dbm_error(DBM *database_descriptor);\n\
    ```\n\nThis checks for errors in the database.\n\n```c\nint dbm_clearerr(DBM *database_descriptor);\n\
    ```\n\nThis clears any error condition flags.\n\n```c\ndatum dbm_firstkey(DBM\
    \ *database_descriptor);\ndatum dbm_nextkey(DBM *database_descriptor);\n```\n\n\
    This is used to access records in a sequence. That does it for databases.\n\n\
    ## Processes\n\n“Let’s take a walk.” said Lingaraj.\n\nThey took a walk and went\
    \ to a coconut grove. Seema was awestruck with the place and there were a lot\
    \ of tall trees. There was some bee hives in the trees and Lingaraj told Seema\
    \ he had got her here to talk about bees.\n\n![](image_rsrc855.jpg)\n\n“Bees are\
    \ always doing something. The queen bee grants the requests of many bees. But\
    \ there’s only one queen bee. The request could be ‘I got this nectar. Where do\
    \ I put it?’\n\nAnd the Queen bee’s response would be,\n‘Nectar? Definitely not\
    \ on the road.’”\n\nSeema did not laugh and Lingaraj pointed out that nectar was\
    \ a play on the word tar used in road construction. Seema still didn’t laugh.\
    \ Lingaraj let it go.\n\n“So each audience of a worker bee with the Queen bee\
    \ is a time slice. The Queen bee tends to have Attention Deficiency Disorder.\
    \ It masks it by giving a worker bee about 5 minutes, asks him to wait and moves\
    \ on to the next bee, who might ask about how to tackle the bear. She might say,\n\
    ‘Please bear with it.’\n\nOf course, there will be many more bees in the Queen’s\
    \ audience.\n\n![](image_rsrc856.jpg)\n\nIt gives the impression that she’s handling\
    \ them all at once. But it is not. One thing to understand is that all the bees\
    \ perform all the tasks, but in different shifts called time slices. So, as a\
    \ Queen is handling the request of one cook bee who wants to cook, she and all\
    \ other bees are actively working on that. Then they pause that job and move on\
    \ to the next job which could be stinging a human being for singing an oft repeated\
    \ song. They surround him and as the man is in shock bracing for the sting, they\
    \ stop and come back. Then, they take up a cleaning job inside the hive. Then\
    \ they repeat all the jobs resuming from where they had paused. What tells them\
    \ where they were, the position they were in when they had surrounded the human\
    \ being, for instance, is the program counter of that process.\n\nIn Linux, the\
    \ processor handles one job at a time, in time slices, but they all happen so\
    \ fast, it gives the impression that it is doing all this at once.\n\n“So, the\
    \ Queen is like the kernel. And a worker bee’s request can be turned into an operation\
    \ when the Queen demands subsequent action.” said Seema.\n\n“Or you can call everything\
    \ a process. Each process has a `PID`, a process identification number. There\
    \ is a process which has a `PID` of 1. It’s called the ‘init’. It is called the\
    \ father of all processes.\n\nWhen the program is stored in memory, no program\
    \ can change the code. It becomes read only. Other programs can share it.” said\
    \ Lingaraj.\n\n“It’s like when the Queen commands and puts an instruction on the\
    \ decree board, nobody has the guts to change it. They can share it.” said Seema.\n\
    \nLingaraj laughed. “We also have shared libraries. Libraries are ready made codes.\
    \ Like potato chips. You don’t cook them, but you procure already made ones. The\
    \ Queen tells the bees to cook.”\n\nThe procedure to make chutney, an accompaniment\
    \ for both, is in a shared library, which the command makes a reference to. The\
    \ instructions to make chutney are not specified for each dish. That is, it is\
    \ in memory where the process. The instructions are loaded in only one instance.\n\
    \nOf course variables can’t be shared. For example if the garnish in Idly is spice\
    \ powder and the garnish to Dosei is cilantro, you can’t have one entry for garnish.\
    \ You need two instances even in both cases.\n\nA process has:\n- Its own stack\
    \ space.\n- Its own environment space.\n- Its own program counter.\n\nDo a `ps\
    \ -ef` command to see more. Here you can see the\n- User id of the process\n-\
    \ The `PID`\n- Parent PID\n- The process scheduling information\n- Start time\n\
    - Terminal\n- Time duration\n- The command which started the process\n\n`ps ax`\
    \ will also show you a column which tells you the state of the process. The process\
    \ can be:\n`S` | `R` | `D` | `T` | `Z` | `N` | `+` | `<`\n\nFor example the `init`\
    \ program starts a `getty` program. Once the user logs in, the `getty` passes\
    \ control to the login program. This can allow log in and set up the environment\
    \ according to the user and starts the shell. On exit, another `getty` process\
    \ is started by `init`.\n\nThere are some bees who are more important than the\
    \ others. The Queen’s schedule contains more time for implementing important jobs\
    \ like adding chemicals to get more yield of honey and less time for collective\
    \ fitness. Similarly processes are given different time slices in the processor.\
    \ A particular process can’t take more time than allocated.\n\nHow do we start\
    \ a new process? We use the `system` C library function.\n\n```c\n#include <stdlib.h>\n\
    int system(const char *string);\n```\n\nThe `string` is the command of the new\
    \ process to be started. A system calls a shell, which in turn executes the command.\
    \ So, if it’s a shell which is executing, the command ought to be what you can\
    \ type on the command prompt.\n"
