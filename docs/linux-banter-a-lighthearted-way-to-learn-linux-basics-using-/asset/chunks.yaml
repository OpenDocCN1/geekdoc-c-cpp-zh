    \ look for a single character\n\nSo the result is\n\n```\nHuge is the sky\nBut\
    \ if it weren’t for the eye\n```\n\nA metacharacter is a normal character which\
    \ has a meaning beyond it’s literal meaning.”\n\n“The `$` is a great example.”\
    \ offered Seema.\n\n“An anchor is the position in the line of text that the Regular\
    \ Expression is to match. For example, `^`, and `$` are anchors.\n\nWhat is `4\
    \ + 2`?”\n\nSeema was surprised. Seema thought of asking Lingaraj ‘Why?’ But she\
    \ had a feeling Lingaraj himself did not ask himself ‘Why?’ before he did things.\
    \ She answered.\n\n“6.”\n\n“5 + 1?”\n\n“6”\n\n“12/2?”\n\n“6.”\n\n“3+3?”\n\n“6.”\n\
    \n“3 * 2?”\n\n“6”\n\n“Think of a vegetable.”\n\n“OK”\n\n“Is that a carrot?”\n\n\
    “Yes, how did you….”\n\n“Works on most people.”\n\n“Now, on the keyboard, if you\
    \ use `shift 6`, you get a symbol. What is it called?”\n\nSeema pressed shift\
    \ and pressed 6 to get the `^` symbol.\n\n“A caret.” she answered.\n\nWhen you\
