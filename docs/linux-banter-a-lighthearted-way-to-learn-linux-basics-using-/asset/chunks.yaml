    ```


    “这展示了使用变量并回显它们的语法。”


    Lingaraj 继续说道。


    ![](img/image_rsrc83T.jpg)


    “假设你身处一个系统，想了解更多关于系统的信息。Shell 提供了一些脚本启动后即可使用的变量。


    我允许你住在房子里了。”他突然换了话题。


    “是的，你真是太好了。我想感谢你，但由于这些关于 Vijay 的事……”


    “你打扫房间了吗？”


    “我必须扫吗？我的意思是已经足够干净了。”


    “那是因为在你来之前我就扫过了。现在，假设我没有打扫房子，你会怎么办？”


    “我会扫的。”


    “在执行任务时，你的认知中会有这些细节。


    1) `Home`。你的家在哪里？


    2) `PATH`：去哪里寻找扫帚、桶等工具。


