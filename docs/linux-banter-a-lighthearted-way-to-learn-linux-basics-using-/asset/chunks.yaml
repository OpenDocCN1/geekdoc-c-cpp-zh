    Errors in this system call happen if :


    | There are no child processes |


    | The call is interrupted by a signal |


    | The option argument is invalid |


    Another important thing to know is that if a program opens file descriptors, they
    are preserved even when fork or the exec family of functions is called.


    When a child process is done executing, but the kernel waits to remove it from
    the process table because it’s parent process might enquire the status or something,
    it is called a ‘Zombie’ process. Until the parent process terminates or calls
    wait, the entry in the process table still remains. If the parent process terminates,
    the ‘init’ becomes the child process’ parent process.


    Let’s look at a program. zmaker.c


    | #include <sys/types.h>#include <sys/wait.h>#include <unistd.h>#include <stdio.h>#include
    <stdlib.h>int main(){    pid_t pid;    char *message;    int exit_code;    printf("Fork
    program starting\n");    pid = fork();    switch(pid)    {    case -1:        exit(1);    case
    0:        printf("This is the child\n");        printf("With PID : %d\n", getpid());        exit(EXIT_SUCCESS);        break;        default:        printf("\n\nThis
    is the parent\n");        printf("With PID : %d\n", getpid());        sleep(30);        break;    }    exit(EXIT_SUCCESS);}
    |


    The above program forks and creates a child process. And we can identify whether
    the process(when the program is running) is in the parent process or the child
    process. If the process ID is 0, it means it is the child process. It is immediately
    ended. The parent is allowed to continue for 30 seconds more. Then the program
    exits. Why did I do this? To show you a zombie process. A zombie process is a
    name given to the child process if it terminates before the parent process in
    case the wait() call is not called by the parent.


    The wait as you know returns the status of the child process to the parent. When
    we run this program, we get the following output.


    | This is the parentWith PID : 35916This is the childWith PID : 35917 |


    At the other terminal, if you type


    | $ ps -al |


    Among other processes, you will find an entry :


    | 1 Z  1000   35917   35916  0  80   0 -     0 -      pts/0    00:00:00 |'
