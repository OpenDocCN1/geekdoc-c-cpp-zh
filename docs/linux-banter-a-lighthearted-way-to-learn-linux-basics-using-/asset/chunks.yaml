    “Just kidding. There are many distributions of Linux available, called flavours.


    To use a system, you need to program it as well. You can use C, C++, Java, Python
    etc. to program. What language did you use to talk in with Vijay?”


    “English, Hindi, Kannada and Tamil. But I can learn C. Goes with my name, Seema.”


    “If only it were so easy.”


    Seema was at a loss about what to make of this person. She was alone near a jungle
    with this guy and she wondered whether he was trying to deliberately insult her
    or he was built like that.


    “The kernel is the thing that does everything. The outer interface is called the
    shell. The shell is how you talk to the kernel.”


    Then Lingaraj looked away.


    “I will tell you a story. My story. I have lived both in the city as well as here.
    I worked as a chef in a hotel once near Banashankari in Bengaluru. I used to cook
    well but the owner sitting at the cash counter got all the credit.


    ![](image_rsrc831.jpg)


    Nobody came to see me at the back where I was working. I had become a bit of a
    loner. I had decided to quit and that very evening, this guy  came running into
    the kitchen.


    ![](image_rsrc832.jpg)


    I was so happy, I thought he had come to see me and tell me how great the food
    was. I asked him,


    ‘Are you here to congratulate me?’


    ‘No, somebody’s  chasing me, I came to escape through the kitchen like they do
    in movies.’ he said.” said Lingaraj.


    “So you are saying the kernel does not get the credit it deserves?” asked ![](image_rsrc833.jpg)Seema.


    “Not at all. I am saying how lonely people can become.”


    He continued. “Anyway, this shell is called bash. This shell was written in C.
    The makers thought of all the various utilities you might generally need and bundled
    them up in the shell. I will give you the hotel example. A hotel has many ready
    made dishes and you can order anything. For example, a chocolate shake. This is
    like a program already installed. But if you want a special something like spicy
    noodles with sweet dates chutney, you need to tell the cooking team how it’s made.
    So, what’s already available in the system like a chocolate shake is akin to the
    programs already installed, like the ‘cat’ command, etc. Noodles with sweet dates
    chutney, you have to use C and program yourself. So, inbuilt programs are what
    is on the menu. Programming yourself is what isn’t already on the menu.


    We use the Bourne again shell. Also called bash.


    Let me login with my credentials.”


    On the computer screen, it showed:


    | $ |


    “This is the command prompt, the dollar symbol.” explained Lingaraj.


    Lingaraj typed ‘root’ and when prompted for a password, he typed it.  He took
    a long time typing it. His password was ‘LivingLegendLingaraj’.


    | $ root |


    “What’s root? Which plant root are you talking about?” asked Seema.


    “Root is the superuser. He has complete access to the system. He can do anything
    to the system which others can’t. Except probably breaking the computer in frustration.”


    Seema suddenly became wary.


    “Have you...you ever broken a computer in frustration?”


    “Yes.”


    Seema was now worried.


    “But it was for a film shoot. Now, we are at the command prompt, the ‘$’. I will
    type


    | $ ls -al |


    What do you think the system will do?”'
