    # Shell 脚本


    傍晚时，Seema 觉得录下 Lingaraj 的课程会比较好。这在她回到班加罗尔后会有所帮助。但课程里也包含了一些他个人的私故事，于是她决定不这样做了。她给自己做了一些三明治，那天早睡了。这将会变成一种习惯。


