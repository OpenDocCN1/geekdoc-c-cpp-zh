    job inside the hive. Then they repeat all the jobs resuming from where they had
    paused. What tells them where they were, the position they were in when they had
    surrounded the human being, for instance, is the program counter of that process.


    In Linux, the processor handles one job at a time, in time slices, but they all
    happen so fast, it gives the impression that it is doing all this at once.


    “So, the Queen is like the kernel. And a worker bee’s request can be turned into
    an operation when the Queen demands subsequent action.” said Seema.


    “Or you can call everything a process. Each process has a PID, a process identification
    number. There is a process which has a PID of 1. It’s called the ‘init’. It is
    called the father of all processes.


    When the program is stored in memory, no program can change the code. It becomes
    read only. Other programs can share it.” said Lingaraj.


    “It’s like when the Queen commands and puts an instruction on the decree board,
    nobody has the guts to change it. They can take photos of it and share it among
    themselves for they need to carry out the instructions. They dare not change the
    command. They let it bee.” said Seema.


    Lingaraj laughed a sarcastic laugh.


    “We also have shared libraries. Libraries are ready made codes. Like potato chips.
    You don’t cook them yourself, but you procure already made ones because it is
    used often.


    If the Queen tells the bees to cook ‘Rava Idly’ and ‘Dosei’ and the procedure
    to make chutney, an accompaniment for both, is in a shared library, which the
    command makes a reference to. The instructions to make chutney is not specified
    for each dish. That is, it is not written in a way in memory where the ‘Dosei’
    dish command also contains instructions on how to make chutney and the ‘Idly’
    dish command also contains instructions on how to make chutney. The instructions
    to make chutney are loaded in only one instance.


    Of course variables can’t be shared. For example if the garnish in Idly is spice
    powder and the garnish to Dosei is cilantro, you can’t have only one entry for
    garnish. You need two instances of garnish even though it is called garnish in
    both cases.


    A process has :


    | Its own stack space. |


    | Its own environment space. |


    | Its own program counter. |


    Do a ‘ps -ef’ command to see more. Here you can see the


    User id of the process.


    The Process ID


    Parent Process ID


    The process scheduling information


    Start time


    Terminal


    Time duration


    The command which started the process


    ‘ps ax’ will also show you a column which tells you the state of the process.
    The process can be :


    | S |


    | R |


    | D |


    | T |


    | Z |


    | N |


    | + |


    | < |


    For example the ‘init’ program starts a ‘getty’ program. Once the user logs in,
    the ‘getty’ passes control to the login program. This can allow log in and set
    up the environment according to the user and starts the shell. On exit, another
    ‘getty’ process is started by ‘init’.


    There are some bees who are more important than the others. The Queen’s schedule
    contains more time for implementing important jobs like adding chemicals to get
    more yield of honey and less time for collective fitness. Similarly processes
    are given different time slices in the processor. A particular process can’t take
    more time than allocated.


    How do we start a new process? We use the system C library function.


    | #include <stdlib.h>int system(const char *string); |


    The string is the command of the new process to be started. A system calls a shell,
    which in turn executes the command. So, if it’s a shell which is executing, the
    command ought to be what you can type on the command prompt. The ‘system’ C library
    function starts a new process whenever you specify a command. '
