    \ pthread_setcanceltype(int type, int *oldtype);\n```\n\ntype 是：\n\n`PTHREAD_CANCEL_ASYNCHRONOUS`\n\
    \n这在接收到请求时立即取消线程。\n\n`PTHREAD_CANCEL_DEFERRED`\n\n这取消线程直到指定的 `pthread` 函数被调用。\n\
    \n我想我们关于线程的话多了。\n\n# 进程间通信\n\n## 管道\n\n让我们接触进程间通信。\n\n从一个故事开始。我喜欢那个女孩并想更了解她。所以，我为她写了这首诗。\n\
    \n你，\n看到我的心在徘徊\n在平静的河流中\n在童真的斜坡上\n掉进海洋\n我们能多聊聊吗？\n关于北方的山脉\n关于如何在那里点燃篝火\n关于南方的草原\n\
    在那里坐着喝着咖啡\n延伸的沙漠\n把骆驼系在绿洲的棕榈树上\n西方的海洋\n拿着海壳贴在耳朵\n东方的天空\n被它的许多月亮点亮\n珠宝躺在床上\n清澈的水流下\n\
    羚羊护着你\n在起伏的水域中\n森林变成了长笛\n生命是和谐的\n那里无事可做\n所有发生的一切\n源于包容之，一片叶子\n\n我想把这封信读给她听，于是到了她家。我响了铃，她的父亲叫他“pop”，打开了门。那是一个大房子。我告诉我想见\
    \ Suparna。\n\n![](img/image_rsrc85F.jpg)\n\n“你想告诉她？”他问。\n\n“是私事的，”我回答道。\n\n“你想告诉她的，告诉我，我会告诉她的。”\n\
    \n我很惊讶。我告诉他关于 Linux 中的多线程以及它是如何实现的，这持续了一小时。\n\n“我会告诉她的，”他说并关上了门。\n\n我重复了这一周，深入研究多线程。第八天，他打开了门。\n\
    \n“在多线程中……”我开始\n“你想告诉她的，直接告诉她。”\n\n“那也无果了，我想。”\n\n“以后我会告诉你的。所以，她的 pop 就像一个管道。这引出了第一个\
    \ C 库函数。”\n\n```c\n#include <stdio.h>\nFILE *popen(const char *command, const\
    \ char *open_mode);\n```\n\n所以，这通常用于向进程传递命令。`open_mode` 是 `r` 或 `w`。\n\n调用程序可以使用\
    \ `\"r\"` 从被调用进程接收输出。\n\n调用程序可以使用 `\"w\"` 将其输出发送到被调用进程的输入，”Lingaraj 说。\n\n```c\n\
    int pclose(FILE *stream_to_close);\n```\n\n这关闭管道。如果被调用进程仍在运行，`pclose` 将等待它完成然后关闭管道。\n\
    \n它返回进程的退出码，其文件流为。\n\n“这是一个示例，”Lingaraj 展示给她并开始解释。\n\n```c\npipe_fork.c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include\
    \ <fcntl.h>\nint main(){\n    int total_bytes;\n    int filed_pipe[2];\n    const\
    \ char chars_passed[] = \"Crocodile Doctor\";\n    char buffer[BUFSIZ +1];\n \
    \   pid_t fork_success;\n    memset(buffer,'\\0',sizeof(buffer));\n    pipe(filed_pipe);\n\
    \    fork_success = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"\
    Fork Failure\");\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success\
    \ == 0)\n    {\n        total_bytes = read(filed_pipe[0],buffer, BUFSIZ);\n  \
    \      printf(\"This program has read %d bytes - %s\\n\",total_bytes, buffer);\n\
    \        exit(EXIT_SUCCESS);\n    }\n    else\n    {\n        total_bytes = write(filed_pipe[1],chars_passed,\
    \ strlen(chars_passed));\n        printf(\"This program wrote %d bytes\\n\", total_bytes);\n\
    \    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n输出是：\n\n```\nThis program wrote 16\
    \ bytes\nThis program has read 16 bytes - Crocodile Doctor\n```\n\n顺序看起来不对，仅仅是因为父进程在子进程之前结束了。所以，写入操作是先进行的。\n\
    \n"
- fmt: "\nWhat happened in the above program was this. A child process was created\
    \ using `fork` and we saw whether the program was now in the parent or child process\
    \ using the return from `fork`. In the first instance, it was in the child process\
    \ as the `fork` return was `0`. Then we read from the first file descriptor. Now,\
    \ a process different from the program which is executing managed to read from\
    \ the program you wrote, albeit a child process. So, some kind of communication\
    \ is happening. This is easy because the child process inherited the file descriptors.\
    \ But what if, the programs are completely different?\n\nWe need two programs.\
    \ Let’s call this the producer program, because it supplies the data to be passed.\
    \ We will name it `pipe_prod.c`.\n\n### pipe_prod.c\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\nint main(){\n \
    \   int total_bytes;\n    int filed_pipe[2];\n    const char chars_passed[] =\
    \ \"Crocodile Doctor\";\n    char buffer[BUFSIZ + 1];\n    pid_t fork_success;\n\
    \    memset(buffer, '\\0', sizeof(buffer));\n    pipe(filed_pipe);\n    fork_success\
    \ = fork();\n    if (fork_success == -1)\n    {\n        fprintf(stderr,\"Fork\
    \ Failure\");\n        exit(EXIT_FAILURE);\n    }\n    else if (fork_success ==\
    \ 0)\n    {\n        sprintf(buffer,\"%d\", filed_pipe[0]);\n        (void) execl(\"\
    pipe_cons\",\"pipe_cons\", buffer, (char*) 0);\n        printf(\"This is the child\
    \ process,but this text won't be displayed because execl finishes off the calling\
