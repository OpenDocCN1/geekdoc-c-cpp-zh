  trans: "\n如果你希望新文件名遵循某种模式或模板，可以使用上面提到的 C 库函数。模板可以是你想要的内容，后面跟着六个 X 字符。这六个 X 字符会被替换以生成唯一的文件。\n\
    \n`mktemp` 和 `mkstemp` 的区别在于 `mktemp` 只提供文件名。`mkstemp` 在打开文件后返回一个文件描述符。然而，建议仅使用\
    \ `tmpfile()` 和 `mkstemp()`。\n\n## 用户 ID 和组\n\nLingaraj 提出了一个新话题。\n\n“用户信息。提供\
    \ `uid`（即人员的用户 ID）的系统调用是：\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\n\
    uid_t getuid(void);\nchar *getlogin(void);\n```\n\n`getuid()` 系统调用返回与程序关联的用户 ID。这通常是运行该程序的用户的\
    \ UID。\n\n`getlogin()` C 库函数返回当前用户的登录名。\n\n```c\n#include <sys/types.h>\n#include\
    \ <pwd.h>\nstruct passwd *getpwuid(uid_t uid);\nstruct passwd *getpwnam(const\
    \ char *name);\n```\n\n你可以获取关于已知 ID 或名称的用户许多详细信息。上述 C 库函数返回一个 `passwd` 类型的结构。访问其内容即可获得细节。我假设你读过\
    \ C 语言，已经知道如何访问结构。”\n\n“是的。”\n\n“`passwd` 结构的成员有：\n\n| 成员 | 描述 |\n| :--- | :---\
    \ |\n| `char *pw_name` | 用户的登录名 |\n| `uid_t pw_uid` | UID 号 |\n| `gid_t pw_gid`\
    \ | GID 号 |\n| `char *pw_dir` | 用户的家目录 |\n| `char *pw_gecos` | 用户的全名 |\n| `char\
    \ *pw_shell` | 用户的默认 shell |\n\n你可以连续获取连续的条目：\n\n```c\n#include <pwd.h>\n#include\
    \ <sys/types.h>\nvoid endpwent(void);\nstruct passwd *getpwent(void);\nvoid setpwent(void);\n\
    ```\n\n`getpwent` 返回一个包含单个用户条目的结构。第一次调用它时，它返回第一个条目；第二次调用时，返回第二个条目。所以不需要设置一个变量并每次递增。\n\
    \n`endpwent` 停止这个 C 库函数。`setpwent` 将位置置到起始处。\n\n```c\n#include <sys/types.h>\n\
    #include <unistd.h>\nuid_t geteuid(void);\ngid_t getgid(void);\ngid_t getegid(void);\n\
    int setuid(uid_t uid);\nint setgid(gid_t gid);\n```\n\n你可以使用 `getgid` 获取用户/程序的组\
    \ ID。`setuid` 只能由超级用户或 root 使用，但建议谨慎使用，因为一旦你将进程的用户 ID 改为较小的值，就无法恢复了。这就像一位国王在他的王国里巡游，当他回来时，卫兵不让他进入。因此，通常使用设置有效用户\
    \ ID 的 `seteuid`。我会给你们看一个简单的程序，”他说，并展示了一个程序 `passwd.c`。\n\n```c\n#include <sys/types.h>\n\
    #include <pwd.h>\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    int main(){\n    uid_t userid;\n    gid_t groupid;\n    struct passwd *password;\n\
    \    userid = getuid();\n    groupid = getgid();\n    printf(\"User is %s\\n\"\
    , getlogin());\n    printf(\"User IDs: User id is %d, Group id is %d\\n\", userid,\
    \ groupid);\n    password = getpwuid(uid);\n    printf(\"User ID entry shows the\
    \ following data :\\n Name is %s, User id is %d, Home Directory is %s, The shell\
    \ is %s\\n\", password->pw_name, password->pw_uid, password->pw_gid, password->pw_dir,\
    \ password->pw_shell);\n    exit(0);\n}\n```\n\n你明白了吗？这只是对密码结构的简单读取。”Seema 看了几分钟后说她懂了。\n\
    \n```c\n#include <sys/utsname.h>\nint uname(struct utsname *name);\n```\n\n`uname`\
    \ 系统调用将主机信息写入由 `name` 指向的 `utsname` 类型结构中。我说的“类型结构”，简单是指包含与相关文件中定义的相同字段的结构。`utsname`\
    \ 结构定义在 `utsname.h` 中。它必须至少包含这些成员：\n\n| 成员 | 描述 |\n| :--- | :--- |\n| `char sysname[]`\
    \ | 操作系统名称 |\n| `char nodename[]` | 主机名 |\n| `char release[]` | 系统的发布级别 |\n| `char\
    \ version[]` | 系统的版本号 |\n| `char machine[]` | 硬件类型 |\n\n```c\n#include <unistd.h>\n\
    int gethostname(char *name, size_t namelen);\n```\n\n此系统调用将主机名写入字符串 `name` 中。`namelen`\
    \ 是假设的最小长度。\n\n“为什么这很重要？我们通常知道主机的名字。”Lingaraj 回想起了某些事，决定告诉 Seema。Seema 准备好听他的另一个故事。\n\
    \n“当我当软件工程师工作时，我们中一些人去了这家酒店。我们看到一个大厅里在举办派对，决定闯进去。我们当时在另一家公司工作。派对是由一家名为 Some Software\
    \ Solutions 的公司举办的。他们正在庆祝项目的成功。由于人很多，而且我们穿得正式，没有人怀疑我们来自另一家公司。但我们有一班午夜 12 点的飞机，我们不想错过航班。我们喝醉了，没有意识到时间的流逝。11\
    \ 点时，我突然意识到我们只有一小时就要赶飞机了。我试图寻找我的朋友，但他们已经消失在人群中。所以我上 DJ 播放音乐的舞台。那里大约有 300 人。我跟\
    \ DJ 说话，但由于噪音太大他听不见。于是，我示意他停止音乐。我当时太兴奋了，直接接过了麦克风。”大家都开始盯着他。然后我意识到，这就是使用 `gethostname()`\
    \ 的重要性。让我给你们看这个程序。和密码文件的方法类似，只是获取细节的结构不同。`compdetails.c`\n\n```c\n#include <utsname.h>\n\
    #include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n  \
    \  char machine[512];\n    struct utsname comp_details;\n    gethostname(machine,\
    \ 511);\n    uname(&comp_details);\n    printf(\"The machine host name is %s\\\
    n\", machine);\n    printf(\"The System is %s on %s hardware\\n\", comp_details.sysname,\
    \ comp_details.machine);\n    printf(\"The nodename of the machine is %s\\n\"\
    , comp_details.nodename);\n    printf(\"The version is %s, %s\\n\", comp_details.release,\
    \ comp_details.version);\n    exit(0);\n}\n```\n\n现在，日志。\n\n```c\n#include <syslog.h>\n\
    void syslog(int priority, const char *message, arguments...);\n```\n\n这是一个日志消息。但未来的文明可能会视为历史，并根据你独特的案例重建那个时代的精神。它就像日记，只不过这些消息的去向取决于优先级。优先级选项有这些。\n\
    \n| 优先级 |\n| :--- |\n| `LOG_EMERG` |\n| `LOG_ALERT` |\n| `LOG_CRIT` |\n| `LOG_ERR`\
    \ |\n| `LOG_WARNING` |\n| `LOG_NOTICE` |\n| `LOG_INFO` |\n| `LOG_DEBUG` |\n\n\
    ```c\nvoid openlog(const char *ident, int logopt, int facility);\n```\n\n如果你想“自定义”记录消息的方式，可以使用这个\
    \ C 库函数。`ident` 是你可以加在消息前面的内容，比如“Seema 的活动是：”。`facility` 参数记录了一个默认设施值，供未来的 `syslog`\
    \ 调用使用。`logopt` 参数配置未来 `syslog` 调行为。\n\n## 资源和限制\n\nLingaraj 开始说道。\n\n“一个程序，一组系统调用，用于对使用\
    \ Vijay 资源的人设置限制，并对他设定你的优先级。你想要那样吗？”\n\n“Vijay 是个成年人，无论机器还是人，他都可以自己决定。但是的，我想学习这些调用。”\n"
- fmt: "\nSome common limits on the Linux system are:\n\n| `NAME_MAX` |\n| `CHAR_BIT`\
    \ |\n| `CHAR_MAX` |\n| `INT_MAX` |\n\nSo, to play around with these limits you\
    \ need system calls.\n\n```c\n#include <sys/resource.h>\nint setpriority(int which,\
    \ id_t who, int priority);\nint getrlimit(int resource, struct rlimit *r_limit);\n\
    int setrlimit(int resource, const struct rlimit *r_limit);\nint getrusage(int\
    \ who, struct rusage *r_usage);\nint getpriority(int which, id_t who);\n```\n\n\
    `id_t` as you know is a special type of integer used for user ids and group ids.\
    \ `int which` tells you whether the id is a user id or process id. `int priority`\
    \ is the priority value, an integer between `-20` and `20`. The default is `0`.\
    \ `rlimit` is a structure, containing pointers:\n\n```c\nstruct rlimit {\n   \
    \ rlim_t rlim_cur;\n    rlim_t rlim_max;\n};\n```\n\nThe soft limit, well you\
    \ can think of it as something which gives errors, and a hard limit causes the\
    \ program to terminate. If Vijay attends a lot, guess you can use this to set\
    \ a limit. Allow him to have only limited.\n\nThe hard limit is more than the\
    \ soft limit. The hard limit is say, how much a person can drink. Prabhu’s hard\
    \ limit is `750` ml. But his wife allows him to drink only `180` ml. This is the\
    \ soft limit. There might be other considerations for imposing limits, like rationing.\
    \ Other people might need to drink. You can drink but dare not. You can drink\
    \ but care a lot. Hard and soft limits don’t matter if your fits. Only a superuser\
    \ can increase the hard limit, say like doctor who can increase capacity. Otherwise,\
    \ normal user can only reduce the soft limit.\n\nThese are the resources with\
    \ Description:\n\n| `RLIMIT_AS` |\n| `RLIMIT_CORE` |\n| `RLIMIT_CPU` |\n| `RLIMIT_DATA`\
    \ |\n| `RLIMIT_FSIZE` |\n| `RLIMIT_NOFILE` |\n| `RLIMIT_STACK` |\n\nThe `rusage`\
    \ structure contains more members which are again of the type `timeval`. Its members\
    \ are:\n\n```c\nstruct rusage {\n    struct timeval utime;\n    struct timeval\
    \ stime;\n};\n```\n\n```c\nint setpriority(int which, id_t who, int priority);\
    \ // Sets the priority of the process.\nint getpriority(int which, id_t who);\
    \ // Returns the priority value.\nint getrlimit(int resource, struct rlimit *r_limit);\
    \ // Returns the limit value of one of the resources like RLIMIT_CPU consists\
    \ of hard limit and soft limit values.\nint setrlimit(int resource, const struct\
    \ rlimit *r_limit); // sets the values of soft and hard limits.\nint getrusage(int\
    \ who, struct rusage *usage); // Gives the user and system times spent for a process.\n\
    ```\n\n`who` is either:\n\n| `RUSAGE_SELF` |\n| `RUSAGE_CHILD` |\n\n### Data Management\n\
    \nLingaraj spoke. Let’s talk about how memory is managed in Linux. The virtual\
    \ memory is an abstraction. Meaning it is organised and made to look very orderly\
    \ and accessible.\n\n```c\n#include <stdlib.h>\nvoid *malloc(size_t size);\n```\n\
    \n`size_t size` is of the type `unsigned long`. Imagine a warehouse which operates\
    \ in your city. Memory in Linux is like the warehouse where. Suppose I want to\
    \ store `50` kgs of sandalwood and I book `10` ft by `10` ft in a warehouse for\
    \ it. The warehouse guy, let’s call him Varadaraj, will store it in the warehouse\
    \ and give me the receipt.\n\nimage_rsrc852.jpg\n\nNow, I have `10` ft by `10`\
    \ ft for the sandalwood. I don’t usually ask him for the location of the physical\
    \ space inside the warehouse. I can find out if I ask him, but I do not necessarily\
    \ have to. So, the `10` ft by `10` ft is the memory quantity you will. I got it\
    \ allocated through `malloc()`.\n\nI can’t put elephant dung in a room in the\
    \ warehouse and ask Varadaraj for the item placed in the next room. He is going\
    \ to remove me from the system instantly. I won’t even get my elephant dung back.\
    \ I can’t write a program which queries other addresses in memory that is not\
    \ the program’s concern. Similarly, I cant ask for `10` ft by `10` ft space and\
    \ have a wooden giraffe sculpture that is `12` feet in length. So I can’t write\
    \ a program which tries to write beyond its allocated individual address space.\n\
    \nIf the warehouse is small, say if it’s a startup and there is not enough space\
    \ available for extra orders, the warehouse guy Varadaraj takes the extra items\
    \ to his house to store them. But of course, he does not tell me that. If he’s\
    \ done that with my order, I can see that the item if asked takes more time to\
    \ be delivered. The using of the disk drive is called the swap space.\n\nIf he\
    \ feels an item will not be used for some time, then too he would move the item\
    \ to his house. If I go to the warehouse and ask for it, he will move it to the\
    \ warehouse again from the back, to give me the impression that it was in the\
    \ warehouse all along and then give it from there.\n\nCalling `malloc` enables\
    \ the `malloc` library to look after memory.\n\n```c\n#include <stdlib.h>\nvoid\
    \ free(void *ptr_to_memory);\n```\n\nIt’s like telling the warehouse you are done\
    \ with the space and don’t need it any more. Of course, after using `free`, you\
    \ cannot try to access that space again.\n\n```c\n#include <stdlib.h>\nvoid *calloc(size_t\
    \ number_of_elements, size_t element_size);\n```\n\n`calloc` allocates space.\
    \ `number_of_elements` and `element_size` are of type `size_t`.\n\n```c\nvoid\
    \ *realloc(void *ptr, size_t size);\n```\n\n`realloc` alters the size of previously\
    \ allocated memory. It returns a pointer to the updated memory.\n\nThis should\
    \ be straightforward. We look at what allocation is about. Lingaraj showed a program.\n\
    \n`memory_less.c`\n\nLingaraj showed a program:\n\n```c\n#include <unistd.h>\n\
    #include <stdlib.h>\n#include <stdio.h>\nint main() {\n    char *some_memory;\n\
    \    int exit_code;\n    some_memory = (char *)malloc(5);\n    if (some_memory\
    \ != NULL) {\n        sprintf(some_memory, \"Will this be printed?\\n\");\n  \
    \      printf(\"%s\", some_memory);\n        exit_code = EXIT_SUCCESS;\n    }\n\
    \    exit(exit_code);\n}\n```\n\nIt is not much of an output, but it shows since\
    \ we allocated only `5` bytes, it could not handle such a big string which is\
    \ more than `20` bytes. So, we change the program this time allocating `30` bytes.\n\
    \n```\nmalloc(): corrupted top size\nAborted (core dumped)\n```\n"
