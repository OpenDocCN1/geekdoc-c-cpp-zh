    ‘calloc’ allocates space for an array of structures.


    ‘element_size’ is the size of each structure.


    | void *realloc(void *existing_memory, size_t new_size); |


    ‘realloc’ alters the size of a previously allocated memory. It returns a void
    pointer to the updated memory.


    Like it’s simply a request to the warehouse to allocate a bigger space. He might
    allocate it next to the space already given or in some other place.


    Let’s look at something that shows what memory allocation is about.”


    Lingaraj showed her a program.


    memory_less.c


    | #include <unistd.h>#include <stdlib.h>#include <stdio.h>int main() {    char
    *some_memory;    int exit_code;    some_memory = (char *)malloc(5);    if (some_memory
    != NULL) {        sprintf(some_memory, "Will all this be printed?\n");        printf("%s",
    some_memory);        exit_code = EXIT_SUCCESS;    }    exit(exit_code);} |


    This should be straightforward. We have allocated some memory with malloc, which
    is 5 bytes. For a string. some_memory is a pointer to this string. We print the
    string to some_memory, and then print the string stored at some_memory.


    The output is


    | malloc(): corrupted top sizeAborted (core dumped) |


    It is not much of an output, but it shows since we allocated only 5 bytes, it
    could not handle such a big string which is more than 20 bytes long.


    So, we change the program this time allocating 30 bytes.


    The output then is :


    | Will all this be printed? |


    File Locking


    “Let’s move on to file locking.


    When I was living in the city, I lived in an apartment block. Water was scarce
    and there was a huge queue for the solitary tap. We used to stand in the queue
    for hours. This guy, Lock Lakshman used to come with three buckets. Lest others
    might help themselves to his third bucket which was filled while he was carrying
    two buckets up the stairs, he used to spit in them. Nobody would touch it.


    ![](image_rsrc853.jpg)


    File locking reminds me of this.


    Linux too kind of achieves locking. It can be either for a complete file, or a
    region of the file. Lock Lakshman’s locking method is not binding on the person
    who wants to carry away his bucket. It is not mandatory. The person who intends
    to carry off the bucket of water needs to cooperate. So, there are cooperative
    locks and mandatory locks. 


    fcntl is pretty useful for not only file locking, but also other other things
    like modifying files, etc.


    | int fcntl(int fildes, int command, struct flock *flock_structure); |


    The command can be :


    | F_GETLK |


    | F_SETLK |


    | F_SETLKW |


    The flock structure :


    | short l_type |


    | short l_whence |


    | off_t l_start |


    | off_t l_len |


    | pid_t l_pid |


    ‘short l_type’ options :


    | F_RDLCK |


    | F_UNLCK |


    | F_WRLCK |


    The command ‘fcntl’ returns -1 on failure.'
