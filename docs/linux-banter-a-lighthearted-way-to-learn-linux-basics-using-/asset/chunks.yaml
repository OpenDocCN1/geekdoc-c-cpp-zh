    "For this option too, you need to specify a design %c\n", optopt);        continue;        }else{            printf("Looks
    like you don''t know much about handbags. %c is an invalid option.\n", optopt);        }This
    is if the single character is not either d or a, but an option input by a person
    ignorant of handbags.        }    }} |


    If we run this,


    | $ gcc fetchbag.c -o fetchbag$ /fetchbag -z -p -m -c -d red -a 750 |


    The output is :


    | So you want a handbag with a zip.So you want a handbag with a pocket.So you
    want a handbag with a mirror.So you want a handbag with a cellphone holder.You
    want a particular design. The design is red.You have an amount for this. The amount
    is 750. |


    Next run :


    | $ /fetchbag -z -p -m -c -d red -a |


    The output is


    | So you want a handbag with a zip.So you want a handbag with a pocket.So you
    want a handbag with a mirror.So you want a handbag with a cellphone holder.You
    want a particular design. The design is red../fetchbag: option requires an argument
    -- ''a''You need to be more specific for the option, a. |


    So, you see if the user misses an argument for an option, the program informs
    the user.


    Another run this time it’s me requesting a beer mug holder option:


    | ./fetchbag -z -p -m -c -d red -a 750 -b |


    The output is :


    | So you want a handbag with a zip.So you want a handbag with a pocket.So you
    want a handbag with a mirror.So you want a handbag with a cellphone holder.You
    want a particular design. The design is red.You have a budget for this. The budget
    is 750../fetchbag: invalid option -- ''b''Looks like you don''t know much about
    handbags. b is an invalid option |


    But we see a drawback. Not that I am going to make the program foolproof, but
    if the red is missed as the argument to -d


    | ./fetchbag -z -p -m -c -d -a 750 |


    It shows this output.


    | So you want a handbag with a zip.So you want a handbag with a pocket.So you
    want a handbag with a mirror.So you want a handbag with a cellphone holder.You
    want a particular design. The design is -a. |'
