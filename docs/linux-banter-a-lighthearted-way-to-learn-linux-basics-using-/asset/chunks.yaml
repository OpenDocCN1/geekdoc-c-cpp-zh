    | Failed relationshipThis is a file with failure in it. Please watch some motivational
    videos.$ |


    I will explain the above later.”


    “You mean the failed relationships?” asked Seema.


    “The grep command.” corrected Lingaraj.


    “Okay.” said Seema.


    “Variables. Variables are those which vary and constants are those which don’t
    vary during program execution.


    You can declare variables in the program as you go. Variables are case sensitive.
    To capital and small letters. ‘Linux’ is different from ‘linux’.”


    “Let me try.” said Seema and typed on the command prompt :


    | $ var=Sonal$ constant=Seema |


    “I read a lot into it. To find out what the variable value is, you prefix a $
    sign to it. You can use echo $var to see who the current...I mean what the current
    variable is.”


    Seema typed on the command prompt.


    | $ echo $var |


    The output was then shown on the screen.


    | Sonal |


    She typed further.


    | $ echo $constant |


    The output was shown.


    | Seema |


    Seema felt triumphant.


    “There is this peculiar situation. If you assign a value to the variable like
    3 + 4 what happens?” asked Lingaraj.


    Seema typed.


    | $ result=3+4$ echo $result |


    The output was shown.


    | 3+4 |


    “It didn’t add.” said Seema.


    “So, we learn that the variable is stored as a string and not as a value.


    No spaces on either side of the equal. And if you want to include spaces like
    ‘Sonal Vijay’, you quote them.”


    Lingaraj was oblivious to his mistake regarding ‘Sonal Vijay’ together and Seema
    thought he would correct it. She typed.


    | $ constant=“Seema Vijay”echo $constant |


    The output was shown.


    | Seema Vijay |


    “You can read input also and assign the input to a variable using read and the
    variable name after you ask for the user input in the script.” said Lingaraj.


    Seema typed.


    | $ read earinput |


    The she typed.


    | Let’s go to the movie. |


    “Now, use echo $earinput” said Lingaraj.


    Seema typed.


    | $ echo $earinputLet’s go to the movie. |


    “Let’s try this in a program. Notice the quotation marks” said Lingaraj. And typed
    in a new shell script named vardemo.sh.


    | #!/bin/shVijaysvar=“Are you in there”echo $Vijaysvarecho “$Vijaysvar”echo ‘$Vijaysvar’echo
    \$Vijaysvarecho Enter some textread Vijaysvarecho ‘$Vijaysvar’ now equals $Vijaysvarexit
    0 |


    He executed the shell script at the command prompt, by using


    | $ sh vardemo.sh |


    and the output was displayed on the screen.


    | Are you in thereAre you in there$Vijaysvar$VijaysvarEnter some text |


    At this point, Lingaraj entered some text.


    | All variables cleared |


    The program continued to execute.


    | $Vijaysvar now equals All variables cleared |


    “This shows the syntax of using variables and echoing them.”


    Lingaraj continued.


    ![](image_rsrc83T.jpg)


    “Suppose you find yourself in a system and want to know more about the system.
    The shell supplies some variables that are available once the script starts.


    I allowed you to live in the house.” he said changing the topic suddenly.


    “Yes, that was mighty good of you. I wanted to thank you but with all this Vijay
    situation…”


    “Did you clean the room.”


    “Did I have to? I mean it was clean enough.”


    “That’s because I cleaned it before you came. Now, suppose I hadn’t cleaned the
    house, what would you have done?”


    “I would have cleaned it.”


    “While executing the task, you would have these details in your know how.


    1) Home. Which is your home?


    2) PATH : Where to look for tools like broom, buckets, etc.


    3) The name of the task. In this case, cleaning. But it could be even disinfecting
    or fumigating.


    4) The number of variables passed. In case you are cleaning, I will say to you,
    use neem paste, turmeric root extract and apple cedar vinegar as the cleaning
    agent. So, the count is three, there are three variables.


    5) The variables passed, also called arguments. The neem paste, turmeric root
    extract and apple cedar vinegar.


    5) The id of the job. In case there are 25 jobs you are doing, I will assign an
    id to each of them.


    Similarly, in a shell script, we have variables as part of the environment. So,
    there is this class called environment variables.


    These are some environment variables.


    | $HOME | The home directory of the current user. |


    | $PATH | Where to look for commands. |


    | $0 | The name of the shell script. |


    | $# | The number of variables passed. |


    | $$ | The process ID of the shell script. |


    Other environment variables are.


    | $PS1 | A command prompt. The $ sign usually, but you can change it here. |


    | $PS2 | The command prompt when prompting for additional input. |


    | $IFS | The input field separator. |


    Moving on, let’s try it in a program.”


    Lingaraj created a new shell script started.sh and typed.


    | #!/bin/shbegin=“Starting”echo $beginecho “The program $0 is now running”echo
    “The first parameter was $1”echo “The second parameter was $2”echo “The parameter
    list was $*”echo “The user’s home directory is $HOME”echo “Please enter a new
    greeting”read sentenceecho The sentence you entered : $sentenceecho “Script done”exit
    0 |


    “We can run this using ‘sh started.sh’, but if you want to run it like an executable
    with arguments and all, we need to change the permissions first using


    | $ chmod +x started.sh |


    Then we use the following command.


    | $ ./started var1 var2 |


    You get this output.


    | StartingThe program ./started is now runningThe first parameter was var1The
    second parameter was var2The parameter list was var1 var2The user’s home directory
    is /home/LingarajPlease enter a new greeting |


    At this point, Lingaraj entered some text.


    | How goes the day?The sentence you entered : How goes the day?Script done.$ |


    Now, conditions. You take decisions based on how a set of conditions are. To find
    out whether a condition is true, you test it. 


    With the test command you can test if two things are equal.


    The test command goes like this if there are two string variables. In a program,
    if you use this line of logic,


    | if test speech1 = speech2thenecho Speeches are consistent.fi |


    You can even use this


    | if [ speech1 = speech2 ]thenecho Speeches are consistent.fi |


    | if test value1 != value2thenecho Value not same.fi |


    Test can work for strings, arithmetic expressions and files in the sense that
    you can test for conditions.


    Like you can test for null strings.


    | if test -n speech1thenecho The file is not a null string.fi |


    | if test -z speech1thenecho The file is a null string.fi |


    About the ‘if’ and ‘fi’, I will tell you later.


    It can be used for arithmetical expressions too. The result, which is true or
    false can then be utilised for implementing a set of actions. That is where the
    ‘if and fi’ come in.


    Some more things you need to know about testing for conditions.


    | expression1 -eq expression2 | True if the expressions are equal |


    | expression1 -ne expression2 | True if the expressions are not equal |


    | expression1 -gt expression2 | True if expression1 is greater than expression2
    |'
