    \n现在，我们来看一些在 Shell 编程中通常无法在命令行提示符上直接使用的命令。\n\n```bash\n| break\n```\n\n“你可以使用\
    \ `break` 在条件满足之前跳出循环。`break` 语句会立即退出它所在的循环。如果 `break` 在一个 `if` 语句中，而 `if` 语句又在\
    \ `while` 或 `for` 循环中，那么 `break` 会让程序不仅跳出 `if` 语句，还会跳出 `while` 循环或 `for` 循环。”\
    \ Lingaraj 说道。\n\n“在我的情况下，当我准备演示稿时，我决定一直工作到完成。但如果闻到邻居家里传来的蛋糕的味道，我会休息（`break`）去烤一个。”\
    \ Seema 说道。\n\n“在我们的社区，如果邻居做了蛋糕，我们直接过去分一份。就好像那是为我们准备的一样。”\n\n“就像 `break` 一样，我们还有\
    \ `continue`，它告诉程序继续执行。”\n\n`continue` 会跳过当前迭代中循环内的剩余命令。\n\n假设你正在为研讨会接待人们。这些你要做的事情：\n\
    \n```bash\ndo {\n    你看到这个人\n    向他们要身份证\n    向他们要填好的申请表\n    你收钱\n}\nwhile (people\
    \ walking in)\n```\n\n如果必须对每个人都这样做，这必须是一个循环。但如果你在研讨会上看到了我呢？那么，我们就改变逻辑。\n\n```bash\n\
    do {\n    你看到这个人\n    if person = Lingaraj\n    continue\n    向他们要身份证\n    向他们要填好的申请表\n\
    \    你收钱\n}\nwhile (people walking in)\n```\n\n基本上，`continue` 会根据条件跳过该特定迭代的循环。\n\
    \n暂时不用担心语法。如果你在研讨会上看到我，你就会跳过所有剩余任务，因为你很了解我，不会向我要身份证、申请表或钱。\n\n“我懂了。`continue`\
    \ 是用于像你这样的特殊情况，我们不希望走为普通人设计的后续流程。”\n\nLingaraj 像往常一样继续说道：\n\n“回到命令。有时命令可以存储在变量中。例如：\n\
    \n```bash\n| $ CD=”cd Lingaraj”$ eval $CD~/Lingaraj $ |\n```\n\n“你有没有遇到过这样的情况：你不告诉\
    \ Vijay 发生了什么，而是等他去猜？” Lingaraj 问。\n\n“我必须承认。那是我的生日，我做了一道特殊的菜。Vijay 忘了。更糟糕的是他问：‘今天什么日子？’。我说‘没什么’，”\
    \ Seema 回道。\n\n“现在，如果 `eval` 可以用于现实生活：\n\n```bash\n| eval $Nothing\n```\n\n输出将会是：\n\
    \n`Today is my birthday, wish me!`\n\n在这里，`Nothing` 是一个变量，存储了一个命令，告诉 Vijay 告诉你些什么。\n\
    \n`eval` 查看存储在变量中的命令并执行它。\n\n所以，如果你看这个现实程序：\n\n```bash\n| $ Nothing=“echo ‘Today\
    \ is my birthday, wish me!’$ eval $Nothing |\n```\n\n输出将是：\n\n```bash\n| Today\
    \ is my birthday, wish me! |\n```\n\n`exec` 用另一个程序替换 Shell。就像废除 Shell 一样。\n\n\
    ```bash\n| $ exec echo This shell is gone! |\n```\n\n“文字显示在屏幕上，然后 Shell 就消失了。”\n\
    \n“这样好吗？Shell 消失？Shell 不重要吗？” Seema 问。\n\n“从哲学上来说，不！”\n\nSeema 明白他指的是人的外壳。Lingaraj\
    \ 继续说道：\n\n“你可以这样记忆它：遗嘱执行。一个人提名某人代替自己的位置然后消失。\n\n我的曾祖父非常喜欢调制各种植物和蔬菜汁来制作他的特制饮料。之后他经常编些大故事。在宿命的一天，他做了一种饮料。他喝了一口，脸就蓝了。在去世之前，他宣布我的父亲——实际上是一位拥有生物技术工程学位和\
    \ MBA 学位的高望学者——是下一个调制者。我祖父的老客户现在仍然来我父亲那里买饮料，而我父亲把他们赶走了。\n\n`exit` 命令。如果你在程序中的命令后输入\
    \ `exit`，你可以返回一个程序可以使用的值。我有一个请求。当你跟我一起上完这门课程后，有人问你进展得如何，告诉他们结果是 0。”\n\n“你并不那么糟！”\n\
    \n“在 Linux 中，`exit` 状态码 `0` 通常表示成功。还有 125 种退出状态。\n\n现在，是 `export` 命令。你说我并不那么糟。如果你觉得我很棒（我确信你会这么想），光告诉我是不没的。你还得告诉别人。所以：\n\
    \n```bash\n| Lingaraj=Great |\n```\n\n除了赋值之外，你还必须将其导出（`export`）出来。\n\n```bash\n\
    | export Lingaraj |\n```\n\n这样像你这样的人就可以来向我学习了。\n\n在 Linux 中，当你使用 `export` 命令时，该变量就不再只是局部变量，它的值可以在由当前脚本调用的其他脚本和命令中使用。看这个\
    \ Shell 脚本，`echoexport1.sh`：\n\n```bash\n| Lingaraj=greatexport Lingarajecho The\
    \ value of Lingaraj is $Lingarajecho \"This is the shell script where Lingaraj=great\
    \ is declared.\"echo Now calling the second script./echoexport2.sh |\n```\n\n\
    还有 `echoexport2.sh`：\n\n```bash\n| Lingaraj=greatexport Lingarajecho The value\
    \ of Lingaraj is $Lingarajecho \"This is the shell script where Lingaraj=great\
    \ is declared.\"\n```\n\n（注：由于原始文本存在大量重复和乱码，以上内容已根据逻辑进行了最核心的提取与翻译。）\n\n"
