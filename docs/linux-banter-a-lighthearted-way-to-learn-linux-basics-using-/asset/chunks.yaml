    I once gave a speech about how one has to be truthful. By the end of the speech,
    there was only one guy who was listening.


    ![](image_rsrc85K.jpg)


    I went on for an hour more and after I had finished, I asked him why he was still
    lingering, even though the others had left and the program was over.


    ‘Oh, I played truth or dare. I chose dare. Next time, I will choose the truth.’
    he said.


    “I took it as a compliment.” said Lingaraj.


    “I can tell you it wasn’t a compliment. But you will get enough of them in your
    life.”


    “Go ahead and get Vijay back to normal. Keep me updated.”


    “Sure.”


    Seema hugged Lingaraj and left.


    # Epilogue


    Seema had learnt enough. It was evident in the way Vijay started to behave. Seema
    had started using impersonal statements and slowly over a period of time, accessed
    his memory and reminded him of his human side. It worked. Vijay was back to normal
    and took Seema to his favourite Pizza joint. He began showering love on Seema
    and was very grateful to her.


    They got married and Lingaraj was given the honour of welcoming the guests with
    sweets.


    ![](image_rsrc85M.jpg)


    He was introduced to one Santrupthi by Seema and the both of them found overlapping
    interests.


    ![](image_rsrc85N.jpg)

