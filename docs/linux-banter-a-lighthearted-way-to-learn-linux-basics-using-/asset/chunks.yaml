  raw: '| $ find / -name test -print |


    You will find all files named test and get it printed on screen. Starting with
    the / , the ….?”


    “root directory.” Seema answered.


    “So,


    | $ find / -name Seema -print |


    will print all the files named Seema in the system.”


    These are a few options.


    | -atime N |


    N here is a number. The file was last accessed N days ago. When you know when
    Vijay last accessed a particular file to give you a parallel.


    | -mtime N |


    The file was modified N days ago.


    | -name pattern |


    The name of the file, excluding any path, matching the pattern provided. To ensure
    that the pattern is passed to find, and not evaluated by the shell immediately,
    the pattern must always be in quotes.


    An example would be :


    | find . -name “*ma” -print |


    Will print all files ending with ‘ma’. Notice the dot. In the current directory.
    So, we learn that the * is pretty handy if you don’t know any names. It’s a great
    tool to use in marriage functions where some relatives come and ask you, “Remember
    who I am?” If this were an accepted convention, people would say, you are ‘* uncle’
    or ‘* aunt’ literally and they would be happy and we can move onto more valuable
    pursuits like setting status messages.


    Since we are on this topic, if you remember some part of the name like it has
    to be either Suresh or Ramesh, but can’t pinpoint, you can use ‘???esh’. That
    way, you will score some more social acceptability points. Because you weren’t
    off by a long way. You can even use [SR][ua][rm]esh. That way, people will think
    you are working on artificial intelligence. 


    | find . -newer Seema |


    Notice the period(.).


    Finds the files newer than the file Seema. In case, there are any more additions
    since you last met Vijay.” said Lingaraj aiming to help.


    “This is going a bit too far.”


    “Look who’s talking.


    type “-d” for a directory and “-f” for a regular file.


    | $ find . \( -name “*ti” -o -newer Seema \) -a -type f -print |


    “It finds all the files ending with ‘ti’ or files newer than Seema and must be
    a regular file as pointed out by f and then print. The backslash \ before the
    bracket is an escape character. 


    You have seen how to find with filenames, but what about searching inside the
    files? You have the ‘grep’ command.


    My great grandfather, as I told you made a lot of concoctions and I documented
    them on this computer. I have a list of files. Now, if I want to search all concoctions
    with grapes in them, this is how I do it


    | $ grep grapes pprosedrink.txtYou shall squash these grapes |


    | $ grep -c grapes pprosedrink.txtpprosedrink.txt:24 |


    -c is count and there are other options. Like -v which is an inversion, shows
    how many lines there are without the word ‘grapes’. To see how many files have
    the grapes words without wanting to see the file, just add -l(small L).


    | $ grep [a-h] pprosedrink.txt |


    The square bracket can contain things that can be matched.


    This will highlight all the words that contain alphabets between a and h.


    | $ grep a[[:blank:]] pprosedrink.txtI am a fighting machine after this drink.
    |


    After the ‘a’, ‘grep’ used the regular expression a[[:blank:]] which told the
    system to look for a blank after the a. That is in short, a word ending with ‘a’.
    ”


    | grep th.[[:space:]] pprosedrink.txt |


    Seema asked about the dot after th. She then told Lingaraj that she knew what
    was inside the square bracket was looking for a space. Lingaraj answered.


    “The dot is telling the system to look for a single character


    So the result is


    | Huge is the skyBut if it weren’t for the eye |


    A metacharacter is a normal character which has a meaning beyond it’s literal
    meaning.”


    “The $ is a great example.” offered Seema.


    “An anchor is the position in the line of text that the Regular Expression is
    to match. For example, ^, and $ are anchors.


    What is 4 + 2?”


    Seema was surprised. Seema thought of asking Lingaraj ‘Why?’ But she had a feeling
    Lingaraj himself did not ask himself ‘Why?’ before he did things. She answered.


    “6.”


    “5 + 1?”


    “6”


    “12/2?”


    “6.”


    “3+3?”


    “6.”


    “3 * 2?”


    “6”


    “Think of a vegetable.”


    “OK”


    “Is that a carrot?”


    “Yes, how did you….”


    “Works on most people.”


    “Now, on the keyboard, if you use shift 6, you get a symbol. What is it called?”


    Seema pressed shift and pressed 6 to get the ^ symbol.


    “A caret.” she answered.


    When you use regular expressions,


    | $ grep ^T Seema.txt |


    looks for lines beginning with T in the file Seema.txt


    Moving on, you might want to execute a command and put the output of the command
    into as part of another command. Simple, put the command in brackets


    | $ echo $(who) |


    Enough for today.”


    The next day, Lingaraj took Seema to a mango grove in the morning. There were
    a lot of monkeys there and they all seemed to recognise Lingaraj.


    Lingaraj spoke as they walked.


    “There is a way to talk to a system.  The system demands the syntax be right and
    a lot of other things. I trained a monkey once. If I snapped my fingers thrice
    in front of it’s face, it would fetch me mangoes from a tree. But if I snapped
    5 times, it would attack me.”


    “Why would you train a monkey to attack you?”


    Lingaraj paused before he answered. “Guilt.”


    ![](image_rsrc83V.jpg)Lingaraj then called out to a monkey making a weird sound.


    ![](image_rsrc83W.jpg)


    The monkey promptly appeared.


    “This is the monkey I trained. Now, command the monkey to get mangoes from this
    tree.”


    “You said it attacks. Now, I am confused. Should I snap or clap?”


    “I knew this situation would arise. So, we have a safety option. Just say, ‘noexec’
    and do what you think is the right thing.”


    ![](image_rsrc83X.jpg)


    Seema said ‘noexec’ and clapped thrice rather than snapping her fingers.


    The monkey gave a bewildered expression.


    ![](image_rsrc83Y.jpg)


    And gave the thumbs down signal.


    “In the shell script, if you use the ‘noexec’ option, the shell will tell you
    whether there is a syntax error or not. It won’t execute the program.”


    Here you meant getting mangoes and clapped rather than snap, but the monkey doesn’t
    understand the syntax. And it communicates this and doesn’t execute the commands
    because you used ‘noexec’.


    At the command prompt,


    | $ sh -n <name of shellscript> |


    and type the name of the shell script or


    | $ set -o noexec$ sh <name of shellscript> |


    in the command prompt and then execute the script. It then checks for syntax errors
    only.


    Now, say ‘-v’, for verbose and snap your fingers thrice.


    ![](image_rsrc83Z.jpg)


    Seema did it.


    ![](image_rsrc840.jpg)


    The monkey repeated what Seema did by snapping it’s fingers thrice and proceeded
    to get mangoes from a tree.


    ![](image_rsrc841.jpg)


    “See, the monkey echoed the command before executing it.” said Lingaraj.


    | $ sh -v <script> set -o verbose$ set -v |


    “Echoes commands before running them.” continued Lingaraj.


    “This one,


    | $ sh -x <script> set -o xtrace$ set -x |


    Echoes commands after processing on the command line.” said Lingaraj.


    “Okay, now he will get the mangoes and then will snap his fingers.” inferred Seema.


    “Correct.”


    ![](image_rsrc842.jpg)![](image_rsrc840.jpg)


    During rains, I programmed this monkey to sneak into a wine store and get us drinks.
    The command for this is, you make a thumbs up sign and say your preferred drink.
    Go ahead.”


    ![](image_rsrc843.jpg)


    Seema gave a thumbs up sign and said


    “Apple juice.”


    ![](image_rsrc844.jpg)


    The monkey made a screeching sound.


    “This is an error message. It happens when there is an undefined variable used.
    Apple juice is the undefined variable. We usually have rum or whiskey.


    | $ sh -u <script> set -o nounset$ set -u |


    Gives an error message when an undefined variable is used.


    There is the dialog utility in Linux.


    The syntax is :


    | dialog --msgbox “I need rum” 9 18 |


    9 and 18 are dimensions.


    There are various options. The message can appear like a message box, or an info
    box, etc. Use the man command and try it on my laptop.”'
