  trans: "\nSeema 一生中从未听过如此荒唐的话。但 Lingaraj 说得听起来非常有说服力。\n\n“我们继续吧，”Seema 说道。\n\n“你可以使用系统调用或\
    \ C 库函数。系统调用是昂贵的。”\n\n“在哪个方面昂贵？”\n\n“以前有一个叫 `Ceremony Seena` 的家伙。每当我们以前叫他时，他都会带着车队和随从来。邀请他以及接待他有一套巨大的仪式和礼仪。\n\
    \n他住在连接所有道路的主路上。他的随从会封堵道路几个小时。他人关系很广，与权力高层的人接触。如果有信息需要传给那些权人物，人们必须通过他。但每当有人叫他时，他就会举行盛大的仪式。我们还得养他、养他的追随者等等。我们必须在工作和照顾他之间来回。这是开销。所以，后来人们发明了这些方法，只叫他一次并一次性完成所有任务。系统调用就像叫\
    \ `Seena`。非常昂贵。但让人去处理细节并完成他所有的工作，就像是层级访问。所以，我们为这些操作提供了 C 库函数。\n\n例如是标准 I/O 库。你可能有一个处理数据块的数据存储。标准\
    \ I/O 库会为发送到存储的数据量身定制，即使它是一个不是用于按块写入数据的文件。\n\n那么，如何判断一个调用是系统调用还是函数？\n\nC 库函数描述在\
    \ man 页（man pages）的第 3 节。第 2 节用于系统调用。\n\n所以，如果你输入\n\n```\n$ man 2 fopen\n```\n\
    \n它显示\n\n```\nNo manual entry for fopen in section 2\n```\n\n然而，如果你输入\n\n```\n\
    $ man 3 fopen\n```\n\n它显示了 `fopen` 的条目。\n\n在其余大部分时间里，我使用“C 库函数”这个短语，并将 C 库函数称为“function”。对于程序内部的函数（如\
    \ routine），我直接用 function。你必须识别我谈论的是 C 库函数还是例程。\n\n“文件描述符。你太想在 Vijay 的系统中打开一些文件了。”\n\
    \n“并且向它们写入。”\n\n“你需要文件描述符来实现。”\n\n“什么是文件描述符？”\n\n“它是与文件关联的整数。它和 `inode` 有什么区别？`inode`\
    \ 是一个包含文件信息的结构。文件描述符用于系统调用。它被系统用来引用一个已打开的文件。”\n\n然后向她展示了一个程序。\n\n`writestd.c`\n\
    \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\nint main(){\n\
    \    if ((write(1, “Standard output’s file descriptor is 1”, 38)) != 38)\n   \
    \     write(2, “Error writing to even standard output.”,39);\n    exit(0);\n}\n\
    ```\n\n上述程序的作用是，尝试将 `write` 指定的第一个消息“Standard output’s file descriptor is 1”写入文件描述符为\
    \ 1 的标准输出。该字符串排除双引号有 38 个字符。它返回写入的字节数。每个字符一个字节。如果所有字节都没有被写入，它将移动到下一行并将错误信息“Error\
    \ writing to even standard output.”打印到标准错误，标准错误的文件描述符为 2。标准输入的文件描述符是 0。\n\n`readinp.c`\n\
    \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\nvoid main(){\n\
    \    printf(“Please input some text.\\n”);\n    char readinp[128];\n    read (0,\
    \ readinp, 17);\n    printf(\"%s\", readinp);\n}\n```\n\n上述程序从标准输入读取 17 个字符，这是在你运行程序后输入时发生的。然后它迅速打印你输入的前\
    \ 17 个字符。所以，`read` 和 `write` 系统调用的语法为：\n\n```c\n#include <unistd.h>\nsize_t read(int\
    \ fildes, void *buf, size_t nbytes);\n#include <unistd.h>\nsize_t write(int fildes,\
    \ const void *buf, size_t nbytes);\n```\n\n`<unistd.h>` 是头文件。头文件包含声明和宏。与可以执行工作的库不同，它不包含实现。它只是调用了执行工作的函数。你可能奇怪过在某些组织中，有些领导什么工作都不做，但认识人脉，尤其是那些在图书馆学习的人，他们可以工作，即使领导自己对实现一无所知。我这么说只是为了帮你记忆。你可以写自己的头文件，但如果你想包含它，你可以使用\n\
    \n```c\n#include “myheaderfile.h”\n```\n\n另外，让我谈谈系统调用。内核并不是所有人都可以自由使用的。分配内核一部分供用户使用系统是相当保留的。但有时你需要内核来执行某些操作。它们可以是进程控制、文件或设备管理等。用户没有胆量自己修改这些东西。他们需要请求内核的支持，内核根据它的规则允许程序在这些操作上运行。所以，这种模式被称为监控模式或内核空间，因为涉及到内核的监督。\n\
    \n每个系统调用 `read` 或 `write` 都返回读取的字节数。`filedes` 是文件描述符。`buf` 是你必须预先声明的字符字符串，`nbytes`\
    \ 是字节数。\n\n"
- fmt: "\n‘Is this Director Ranganath’s house?’\n\n‘Yes, Ranganath, the director of\
    \ the Transport and Travel department of the Government.’”\n\n“I thought such\
    \ stories were limited to your love life. Outside of your love life too, you have\
    \ not done great.” said Seema.\n\n“If you need a file descriptor, you need to\
    \ open the file. There are several modes you can open them. Sometimes the dialogue\
    \ writer wants to simply listen to the character’s dialogue, that is read-only.\
    \ This has to be specified in the command within the parenthesis. The options\
    \ are :\n\n- `O_RDONLY`: Open for read-only : (Dialogue writer wants to only listen.)\n\
    - `O_WRONLY`: Open for write-only (Dialogue writer just gives the new dialogue.\
    \ Doesn’t listen.)\n- `O_RDWR`: Open for reading and writing (Dialogue writer\
    \ both listens and gives new dialogues.)\n\n```\n#include <fcntl.h>\n#include\
    \ <sys/types.h>\n#include <sys/stat.h>\nint open(const char *path, int oflags);\n\
    int open(const char *path, int oflags, mode_t mode);\n```\n\nThe `char *path`\
    \ is the path of the file to be opened. The `oflags` parameter consists of the\
    \ above special access modes `O_RDONLY`, `O_WRONLY` and `O_RDWR` have to be used\
    \ along with other options by ‘OR’ing (`|`) with other flags. Now, there are many\
    \ scenarios in the rehearsal.\n\nLet’s look at the `oflags` parameter:\n\n| Flag\
    \ | Description |\n| :--- | :--- |\n| `O_APPEND` | Appends data to the end of\
    \ the file. A new set of lines might need to be appended. Give the guy more dialogues,\
    \ especially if he’s doing good. |\n| `O_TRUNC` | Cut the file to zero, discarding\
    \ existing content. This is one way to insult and say a guy’s not good at acting\
    \ by removing all the lines given to him. |\n| `O_CREAT` | Creates the file, if\
    \ necessary, with permissions given in mode. A new character might have to be\
    \ created. |\n| `O_EXCL` | Used with `O_CREAT`, to make sure that only one instance\
    \ of a file is created. If that file is already created, it won’t create a file.\
    \ A new character like no other in the play might need to be created. |\n\nNow,\
    \ how do we find out the file descriptor number. The `open` system call returns\
    \ the file descriptor as a positive integer. -1 if it fails.\n\nWhen you use `O_CREAT`,\
    \ you need to use the following further modes.\n\n| Mode | Description |\n| :---\
    \ | :--- |\n| `S_IRUSR` | Read permission, owner |\n| `S_IWUSR` | Write permission,\
    \ owner |\n| `S_IXUSR` | Execute permission, owner |\n| `S_IRGRP` | Read permission,\
    \ group |\n| `S_IWGRP` | Write permission, group |\n| `S_IXGRP` | Execute permission,\
    \ group |\n| `S_IROTH` | Read permission, others |\n| `S_IWOTH` | Write permission,\
    \ others |\n| `S_IXOTH` | Execute permission, others |\n\nIf you want to specify\
    \ more options, use the `|` (pipe OR) option. I will show you how it works in\
    \ a program in a little while. There is also the `creat()` system call which is\n\
    \n```\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\nint\
    \ creat(const char *pathname, mode_t mode);\n```\n\nA call to `creat()` is equivalent\
    \ to calling `open()` with flags equal to `O_CREAT|O_WRONLY|O_TRUNC`.\n\nAlso,\
    \ some functions set this global variable, `errno` giving it an error number.\
    \ I am quite a fan of this `errno`. When you ask a woman out, if she refuses,\
    \ she can set the `errno` privately. You can look it up and see why you were rejected.\
    \ Once I wanted to go out with this woman, Roshni and gave her a letter with a\
    \ form. The form included the `errno` column. She said ‘no’ as usual in the letter.\
    \ She was a programmer and knew this concept of `errno` and that I was a fan of\
    \ it. So I went and checked `errno`, it was written `errno`. I then asked her\
    \ what it meant. She said ‘err…...no!’”\n\n“It is easier to understand Linux than\
    \ understand you.” replied Seema.\n\n“Now, the number of characters a play can\
    \ have in our community is limited to 16. Same way, the number of files one process\
    \ can open at a time is limited to 16. It is defined by `OPEN_MAX` in `limits.h`.\
    \ This can be changed.”\n\n```\n#include <unistd.h>\nint close(int fildes);\n\
    ```\n\n0 on success -1 on error.\n\nThis is how you close a file. I will show\
    \ you a program named ‘filecopy.c’.\n\n```\n#include <stdio.h>\n#include <unistd.h>\n\
    #include <fcntl.h>\n#include <stdlib.h>\nint main(){\n  char c;\n  int in,out;\n\
    \  in=open(\"inputfile\", O_RDONLY);\n  out=open(\"outputfile\", O_WRONLY|O_CREAT,S_IWUSR|S_IRUSR);\n\
    \  while(read(in,&c,1) == 1)\n      {\n      printf(\"%c\",c);\n      write(out,c,1);\n\
    \      }\nclose(in);\nclose(out);\n  exit(0);\n}\n```\n\n`$ gcc filecopy.c -o\
    \ filecopy`\n`$ ./filecopy`\n`$ cat outputfile`\n\nThis is how you copy a file.\n"
