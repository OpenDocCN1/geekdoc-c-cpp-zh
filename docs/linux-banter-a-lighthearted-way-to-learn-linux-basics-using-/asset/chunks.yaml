  raw: 'Let me tell you about a scenario. When my uncle, a doctor was in the operating
    room in his private hospital, they locked the door in case operations were going
    on. Once the operation finished, they would open the door by unlocking the door.


    If the door was unlocked, a film crew would go in and make videos because it was
    the only room which had big lights. While this was going on, they would lock the
    door. After their job was done, the film crew used to unlock the door.


    Let’s move on to mutually exclusive threads. What are they? They are resources
    that can be blocked. If for example, you are with Vijay and he keeps getting distracted
    with a football match, how can you block his resource so neither a football match,
    nor wrestling can’t obtain his interest?”


    “Easy, I would use a mutually exclusive thread program on him.” Seema was doing
    some research and fast.


    “Easy? Good luck doing that, not because mutex programs are difficult, but tearing
    one away from football is. A mutex, short for mutually exclusive, locks a critical
    region of a code, so that the locking program is done with it before others can
    have a go at it. Remember Lock Lakshman?”  Lingaraj showed a C library function.


    | #include <pthread.h>int pthread_mutex_init(pthread_mutex_t *mutex, const pthread_mutexattr_t*mutexattr);
    |


    Initialises a mutex, ‘*mutex’ which is based on the thread function.


    const pthread_mutexattr_t *mutexattr


    This will take some explaining. Will save it for later.


    | int pthread_mutex_lock(pthread_mutex_t *mutex)); |


    This locks the resource.


    | int pthread_mutex_unlock(pthread_mutex_t *mutex); |


    This unlocks the resource.


    | int pthread_mutex_destroy(pthread_mutex_t *mutex); |


    This will destroy the mutex and clean up as well.


    Let’s get into a program.”


    “Ok.”


    “The mutex program. Before that, the thread program we talked about.


    thread_program .c


