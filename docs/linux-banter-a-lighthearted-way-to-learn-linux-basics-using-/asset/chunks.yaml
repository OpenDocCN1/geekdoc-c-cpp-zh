    In the previous examples of Interprocess Communication, we had keys. A distinct
    key that brought processes together to cooperate using either queues or shared
    memory. In sockets, we need the IP address and the port number.


    Let’s talk about the localhost. I have always wondered what it would be like to
    call myself over my phone. I haven’t attempted it yet. “


    “Why?”


    “What if I answer the phone and say ‘Hello’. I have a fear of parallel universes.


    A localhost program allows you to talk to the same system using a network. The
