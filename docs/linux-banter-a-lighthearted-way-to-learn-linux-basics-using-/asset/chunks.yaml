  trans: "\n\n# 要阻塞的信号\n\n我们在这里讨论的是这一点：当一个信号发生时，处理函数会被调用并运行到结束。如果在此时间内出现了另一个信号，这个健壮的系统调用\
    \ `sigaction` 就可以阻塞这个新信号。\n\n`int sa_flags`\n\n## 信号动作修饰\n\n它告诉我们是否要返回位置以捕获新信号。当你将其设置为\
    \ `SA_RESETHAND` 时，`sigaction` 系统调用将处理一次信号。\n\n手册页（man pages）中还有其他可用的标志。\n\n`oact`\
    \ 是一个位置，将保存之前之前的信号动作。\n\n```c\n#include <signal.h>\nint sigaddset(sigset_t *set,\
    \ int signo);\nint sigemptyset(sigset_t *set);\nint sigfillset(sigset_t *set);\n\
    int sigdelset(sigset_t *set, int signo);\n```\n\n这些是 C 库函数。你可以让程序专门处理一个信号，或者制定一个通用的策略来处理信号。因此，你可以创建一个所有这些信号的集合并指定做什么。此外，可能会出现这样的情况：你的程序正在处理一个接收到的信号，而另一个信号又来了。这时你可能需要暂停该函数并杀死进程。无需困惑，你可以使用信号集来处理所有这些信号。\n\
    \n信号集的类型为\n\n`sigset_t`\n\n因此，你可以通过 `sigfillset()` C 库函数用所有可用信号填充你的信号集。同样，你可以使用\
    \ `sigemptyset()` C 库函数清空所有信号集合。\n\n你可以通过 `sigaddset()` 指定信号编号将单个信号添加到集合中。\n\n\
    你可以通过 `sigdelset()` 指定信号编号从集合中删除单个信号。\n\n此外，你可以通过查询确定某个信号是否是集合的成员。\n\n```c\nint\
    \ sigismember( const sigset_t *set, int signum)\n```\n\n如果信号是集合的成员，则返回 1；否则返回\
    \ 0；出错时返回 -1。\n\n```c\n#include <signal.h>\nint sigprocmask(int how, const sigset_t\
    \ *set, sigset_t *oset);\n```\n\n上述系统调用用于更改进程的信号掩码。如果信号被进程阻塞，它将不会被递送，而是保持挂起状态。程序可以通过调用\
    \ C 库函数 `sigpending` 来确定哪些被阻塞的信号是挂起的。\n\n```c\n#include <signal.h>\nint sigpending(sigset_t\
    \ *set);\n```\n\n该系统调用将一组信号写入由 `set` 指向的信号集中，这些信号是被阻塞递送的。如果成功则返回 0，否则返回 -1 并设置\
    \ `errno` 以指示错误。\n\n```c\n#include <signal.h>\nint sigsuspend(const sigset_t *sigmask);\n\
    ```\n\n`sigsuspend` 系统调用将进程信号掩码替换为 `sigmask` 提供的信号集，然后挂执行。它将在信号处理函数执行后恢复。\n\n\
    ## 示例：ayyo.c\n\n让我们来看一个使用 `sigaction` 的程序。\n\n`ayyo.c`\n\n```c\n#include <signal.h>\n\
    #include <stdio.h>\n#include <unistd.h>\n\nvoid ctrlc(int sig){\n    printf(\"\
    我建议你不要停止我，%s\\n\", getlogin());\n}\n\nvoid shutdown_req(int sig){\n    printf(\"\
    我是进程 %d，我知道是谁在尝试杀掉我。是你，%s\\n\", getpid(), getlogin());\n}\n\n/*\nvoid finish(int\
    \ sig){\n    printf(\"这个函数非常没用，因为它试图处理 SIGKILL 信号。\");\n}\n*/\n\n/*\n我们声明了上述三个函数，每个对应一个特定的信号：`SIGINT`、`SIGTERM`\
    \ 和 `SIGKILL`。处理 `SIGINT` 的函数 `ayyo` 在按下 Ctrl+C 后只运行一次，因为我们使用了 `SA_RESETHAND`\
    \ 标志。我们打印相关消息，这就是该函数做的所有。\n*/\n\nint main(){\n    struct sigaction act;\n    act.sa_handler\
    \ = ctrlc;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags = SA_RESETHAND;\n\
    \    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler = shutdown_req;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = 0;\n    sigaction(SIGTERM, &act, 0);\n\n    /*\n    这与此无关，因为\
    \ SIGKILL 会立即杀死进程且无法被处理。\n    act.sa_handler = finish;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = 0;\n    sigaction(SIGKILL, &act, 0);\n    */\n\n    /*\n \
    \   然后指定处理函数并将信号集 sa_mask 置为空。我们不希望任何信号被阻塞。因为你放在此这里的任何内容都不会被递送给进程。指定了是否需要 `SA_RESETHAND`。在第一种情况下，指定了\
    \ `SA_RESETHAND`，这意味着信号只会被处理一次，因为信号不会被重置。如果你希望它每次都生效。\n    */\n    while(1) {\n\
    \        printf(\"我很快乐\\n\");\n        sleep(1);\n    }\n}\n```\n\n"
- fmt: "\n“So, I wanted more control. Also, I realised there was a lot of spending.\
    \ I had to share my brand identity, the website, etc. So, I closed down the franchise\
    \ system and started opening branch offices. Of course, this is not a way to run\
    \ businesses. It was my particular case.”\n\n“I don’t know why you are telling\
    \ me this.”\n\n“The first case, where I used to set up a small operation there\
    \ is akin to invoking a function in a program. My process managed it alone.\n\n\
    The second case where I gave out franchises was creating another process, say\
    \ by invoking `fork`. A lot of information had to be duplicated.\n\nThe third\
    \ case was opening a branch office. Only information was shared and not duplicated.\
    \ This is like executing a thread.\n\nA thread is a part of a program that executes\
    \ multiple times, but not as a function. If you work on two files at the same\
    \ time, it is cumbersome for the `kernel` to use functions and run as a monolithic\
    \ block. It can have another instance of a part of the code running, but not as\
    \ a process where everything is duplicated. In thread execution, the program running\
    \ gets it’s own stack and the new thread of execution gets its own stack and so,\
    \ local variables. But it shares (please note not duplication, but a share) global\
    \ variables, file descriptors, signal handlers, and its current directory state\
    \ with the process that created it.\n\nSo whereas a franchise has it’s own financial\
    \ bookkeeping, salaries, the branch office shares the financial books. A process\
    \ duplicates while a thread shares and duplicating involves more resources.”\n\
    \n“Yes, now ‘reentrant’ code. A re-entrant function is one which can run, be interrupted\
    \ and then be run again.\n\nThe same routine can be reused in different instances\
    \ and the value of a variable for one instance might not hold good for other.\
    \ So, if a routine alters the value of a variable and it is called again, it won’t\
    \ remember it’s old set of values. It takes the value being sent by the calling\
    \ program.\n\nIn our community, the drinking age is 21. Once my friend’s father,\
    \ a history teacher, Ritesh who stuck to customs like sambhar sticks to shirts,\
    \ was the bar owner. Nothing wrong with that, except he would never allow us into\
    \ the bar. He used to get drunk and when we presented ourselves at the bar door,\
    \ this was the conversation.\n\n![](image_rsrc859.jpg)\n\n‘Oh Lingaraj. How are\
    \ you?’ he used to ask.\n\n‘I am good Sir. I did well at programming and....’\n\
    \n‘I meant to ask, how old are you?’\n\n‘25 uncle.’\n\n‘Don’t lie to me. You are\
    \ 20. I remember you telling that to me.’\n\n‘That was 5 years ago, Sir.’\n\n\
    ‘So what? A record is a record. Get out of here.’\n\nHe wouldn’t have qualified\
    \ for a reentrant routine. The only re-entrance he used to do was into the bar\
    \ for a refill. So a reentrant function updates for various instances.\n\nIt also\
    \ means, basically work only on the data provided by the caller.\n\n```c\n#include\
    \ <pthread.h>\nint pthread_create(pthread_t *thread, pthread_attr_t *attr, void*(*start_routine)(void\
    \ *), void *arg);\n```\n\nreturns `0` on success.\n\nThe C library function `pthread_create()`\
    \ facilitates a routine to run as a thread. It has a name that you can identify\
    \ the thread with, apart from the function name. It is given by `pthread_t *thread`.\
    \ It is of the type `pthread_t`.\n\n`pthread_attr_t *attr` is an attribute which\
    \ I will explain later.\n\n`void *(*start_routine)(void *), void *arg` is the\
    \ routine that will run as a thread and `arg` is it’s argument.\n\n```c\n#include\
    \ <pthread.h>\nvoid pthread_exit(void *retval);\n```\n\nThis exits from the thread.\
    \ And unlike functions, you cannot return a variable. Because.....?”\n\n“Right.”\n\
    \n```c\n#include <pthread.h>\nint pthread_join(pthread_t th, void **thread_return);\n\
    ```\n\nThis C library function is like the `wait` system call in processes. Here,\
    \ `pthread_t th` represents the routine identifier, remember `pthread_create`?\n\
    \nIt returns a pointer to a pointer to the return value from the thread.\n\nHe\
    \ opened a file on his laptop.\n\n`thread_program.c`\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    void *print_func(char* message){\n   printf(\"%s - Before sleep\\n\", message);\n\
    \   sleep(4);\n   printf(\"%s - After waking up\\n\", message);\n}\nint main(){\n\
    \  pthread_t t1, t2;\n  printf(\"Main program now running\\n\");\n  pthread_create(&t1,\
    \ NULL, (void *)print_func, (void *) \"First call to pthread\");\n  pthread_create(&t2,\
    \ NULL, (void *)print_func, (void *) \"Second call to pthread\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main after thread join\\\
    n\");\n}\n```\n\nAnd then he proceeded to explain.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    void *print_func(char* message){\n  printf(\"%s - Before sleep\\n\", message);\n\
    \  sleep(4);\n  printf(\"%s - After waking up\\n\", message);\n}\n```\n\nThe above\
    \ code shows how `print_func` works.\n\n```c\nint main(){\n  pthread_t t1, t2;\n\
    \  printf(\"Main program now running\\n\");\n  pthread_create(&t1, NULL, (void\
    \ *)print_func, (void *) \"First call to pthread\");\n  pthread_create(&t2, NULL,\
    \ (void *)print_func, (void *) \"Second call to pthread\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main after thread join\\\
    n\");\n}\n```\n\nThe thread is created using `pthread_create`.\n\n```c\nstruct\
    \ thread_args {\n    char *message;\n};\n```\n\nTo pass arguments to the thread,\
    \ we use a structure.\n\n```c\nvoid *print_func(void *arg) {\n    struct thread_args\
    \ *args = (struct thread_args *)arg;\n    printf(\"%s - Before sleep\\n\", args->message);\n\
    \    sleep(4);\n    printf(\"%s After After waking up\\n\", args->message);\n\
    \    return NULL;\n}\n```\n\nThis is how we pass values to the thread function.\n\
    \n```c\nstruct thread_args args1, args2;\nargs1.message = \"First call to pthread\"\
    ;\nargs2.message = \"Second call to pthread\";\npthread_create(&t1, NULL, (void\
    \ *)print_func, (void *)&args1);\npthread_create(&t2, NULL, (void *)print_func,\
    \ (void *)&args2);\n```\n\nThe output will be like this:\n\n```\nMain program\
    \ now running\nFirst call to pthread - Before sleep\nSecond call to pthread -\
    \ Before sleep\nFirst call to pthread - After waking up\nSecond call to pthread\
    \ - After waking up\nBack to main after thread join\n```\n\nHowever, because the\
    \ scheduler can switch, the output might be:\n\n```\nMain program now running\n\
    First call to pthread - Before sleep\nSecond call to pthread - Before sleep\n\
    Second call to pthread - After waking up\nFirst call to pthread - After waking\
    \ up\nBack to main after thread join\n```\n\nWait, the output could be:\n\n```\n\
    Main program now running\nFirst call to pthread - Before sleep\nSecond call to\
    \ pthread - Before sleep\nFirst call to pthread - After waking up\nSecond call\
    \ to pthread - After waking up\nBack to main after thread join\n```\n\nThis is\
    \ because the function is not reentrant if it uses a global variable.\n\n```c\n\
    int counter = 0;\nvoid *print_func(void *arg) {\n    int temp = counter;\n   \
    \ sleep(4);\n    counter = temp + 1;\n    printf(\"%d\\n\", counter);\n    return\
    \ NULL;\n}\n```\n\nIf we use a local variable, it becomes reentrant.\n\n```c\n\
    void *print_func(void *arg) {\n    int temp = 0;\n    sleep(4);\n    temp++;\n\
    \    printf(\"%d\\n\", temp);\n    return NULL;\n}\n```\n\nEach thread has its\
    \ own stack, so local variables are safe.\n"
