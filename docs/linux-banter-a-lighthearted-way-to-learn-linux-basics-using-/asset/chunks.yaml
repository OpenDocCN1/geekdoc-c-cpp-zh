    “`ls…..Lingaraj Seema?”


    “`ls` is a command that tells the system to list all the files in the directory.
    The `-al` is passing options to the command. `-a` stands for all files and `l`
    (small L) tells it to show detailed information.”


    Lingaraj then pressed the ‘Enter’ key. A list of files come up saying


    | Loveletter_Mythri | rw-rw-rw |

    | Loveletter_Chitra | rw-rw-rw |

    | Loveletter_Sanjana | rw-rw-rw |

    | Loveletter_Sangeetha | rw-rw-rw |

    | letterwriter | rwx-rw-rw |


    “What are all those `r`s? Rejections? And `x`? Ex love affair?” asked Seema.


    “Maybe I have to change the directory. Which directory am I in now?” Lingaraj
    asked mostly to himself.


    Lingaraj then typed


    ```$ pwd

    ```


    The system showed ‘Love life progress’ as the directory.


    “About all the `r`s and `x`s I will tell you when we get to file permissions.
    Enough for this session. Let’s meet after an hour. I am not in a good mood now.”
    said Lingaraj.


    “I can understand.” said Seema.


    Seema thought of taking a walk and stepped on to the path. She saw many cyclists
    approach in a group. There were youngsters and old people as well, those who kept
    themselves fit. They all looked at Seema and some of them smiled and waved at
    her.


    ![](image_rsrc834.jpg)


    They all parked their bicycles and went on to their respective homes. Seema continued
    with her walk and found a small stream nearby. She sat there on the rocks for
    a while and decided that she would include this in her everyday routine.


    ![](image_rsrc835.jpg)


    “So, do you want to start with chocolate milk shake or noodles with sweet chutney?”
    asked Lingaraj when they resumed in his house.


    “A chocolate milk shake.”


    “So, the shell. There are many ways to the kernel. This shell is one of them.
    There are many shell commands which you will find. There are many kinds of shells
    as well, like Korn shell, C shell etc. But we use `Bash`.


    When we type


    ```

    $ /bin/bash –version

    ```


    It gives you the version of the shell.”


    Lingaraj called out to a parrot making a weird sound and a parrot came and perched
    on the window rail.


    “This is Paresh’s parrot. Say Hi.”


    “Hi.” said Seema to the parrot and the parrot responded in like making Seema happy.


    ![](image_rsrc836.jpg)


    “You can redirect the output to a file. In our community, if somebody is trying
    to talk to us and we are busy, we ask them to talk to a parrot’s ear. The parrot
    then repeats it to whoever is interested. So,


    ```

    $ ls -al > lsoutput.txt

    ```


    Here `ls -al` is the command that lists all the files. The output can be sent
    to `lsoutput.txt` for future use.


    Of course there are cases when a person talks nonsense. We ask them to speak into
    a tree’s hollow. It’s gone forever. In Linux, we have


    `/dev/null`


    Once you send it there, there’s no return.”


    Lingaraj continued.


    “So,


    ```

    $ ls -al > /dev/null

    ```


    gives nothing.


    ```

    $ ls -al > lsoutput.txt

    ```


    If the file called `lsoutput.txt` exists, it will be overwritten. To append to
    the file, that is to make the parrot retain what was said yesterday, use the


    ```

    $ ls -al >> lsoutput.txt

    ```


    Notice there is a double greater than symbol.


    Sometimes you would want to know what is going on in somebody’s mind.”


    “Yes, I do have that curiosity.” said Seema.


    “You can see the list of processes that are happening in the system. Use the `ps`
    command.” said Lingaraj.


    ```

    $ ps

    ```


    A list of processes on the system were shown.


    “That would be very helpful. I can see what’s happening in Vijay’s mind.” said
    Seema.


    “Yes, if he’s thinking of a particular car.”


    “Especially if he’s thinking of me.”


    “I will tell you something that can help. You can even kill a process using the
    `kill` command.”


    “Let’s finish all these things quickly. I have many processes to kill. Can I add
    a process to his mind, like think about my birthday gift for example?”


    “That would take many birthdays to learn.”


    Lingaraj paused. Seema thought he would ask her when her birthday was.


    “You can listen to the parrot. In Linux, you can read the contents of a file in
    degrees by using the


    ```

    $ cat lsoutput.txt

    ```


    Also, this


    ```

    $ more < lsoutput.txt

    ```


    Like the output was redirected, in this case the input is redirected to a utility
    called `more`.


    The `wc` command tells you the word count. An option is


    ```

    $ wc -m

    ```


    which tells you the number of characters.


    The `man` command…”


    “Helps us understand men?” Seema interjected.


    “No, helps us understand the Linux system. `Man` is short for manual. If you need
    help, type `help`, say


    ```

    $ ls –help

    ```


    You can even try `info ls`. Let’s take a walk.”


    Seema and Lingaraj packed some food and went near the mountains. There was a small
    mountain which they agreed would be nice to climb. Lingaraj had brought his laptop.
    As they climbed, Seema felt she could do so comfortably without panting or being
    out of breath. The air was not polluted and it energised her.


    ![](image_rsrc837.jpg)


    They reached the top and she could see rivers and make out some village settlements.
    There was no sign of asphalt roads.


    “Shout Vijay’s name.” Lingaraj suggested.


    “Vijay!” shouted Seema.


    There was a prompt echo that repeated twice.


    ![](image_rsrc838.jpg)


    “There’s this is a command in Linux. The `echo` command.” said Lingaraj opening
    his laptop and giving it to Seema.


    “Wow, I can get Vijay to shout my name and the echoes will keep resonating.”


    “It just repeats what you say. Once. Try it out. Say something original.”


    Seema typed into the laptop.


    ```

    $ echo I am there for, Vijay

    ```


    There was the following.


    ```

    I am there for, Vijay

    ```


    “As original as `echo`.” Lingaraj commented.


    Lingaraj was silent for a while.


    “Do you want to use `pipe`?” asked Lingaraj.


    ![](image_rsrc39.jpg)


    “No, it connects one’s output to another’s.” said Lingaraj pointing at his laptop.”
    He typed and showed Seema the pipe key just above the ‘Enter’ key.


    ```

    $ echo Seema is original | wc -m

    ```


    The `echo` command is piped with the `wc` command which them the number of characters
    because `>` is used to input from files and `<` to output to files and the pipes
    are for Let’s go back.” said Lingaraj.


    As they approached the camp, they could see some people already at work. A few
    of them making jute bags.


    ![](image_rsrc83A.jpg)


    “Just like we use jute bags to hold things, there are directories that hold files.


    ![](image_rsrc83B.jpg)


    There are many directories. Here’s a list of them.


    `/root`


    This is the source directory.


    `/bin`


    Any idea?”


    “The waste directory, some kind of trash bin?” asked Seema.


    “It contains all binaries of programs. There’s this book about directories in
    my room. Read that. Meanwhile, I will get some fresh juice.”


    Seema proceeded to Lingaraj’s room and found the book. As she was searching, she
    saw books on various topics like film making, writing poetry and others.


    ![](image_rsrc83C.jpg)


    Then she met Lingaraj outside after she read the first few pages. Lingaraj gave
    her watermelon juice.


    ![](image_rsrc83D.jpg)


    Lingaraj continued.


    `/boot` Your thoughts on it?


    “When a computer boots up, the necessary files are stored here.” replied Seema.


    `/dev`


    “Development tools…no wait, device files. Devices, programs, databases, etc. etc.”


    “This brings me to `/etc`?” asked Lingaraj.


    “All the host specific system configuration files.”


    `/home`


    “All your personal stuff. All those 43 letters.”


    “44 now.” said Lingaraj with sadness in his tone.


    `/lib`


    “Essential shared libraries and kernel modules.”


    “What’s a shared library?” asked Seema.


    “Many programs that are written can use already existing programs which are written
    for such a benefit. Like if you order noodles with sweet chutney, the noodles
    already made can be bought by the hotel management. So, if I write a program that
    involves adding two numbers, I can call a program from a library that already
    has the addition program written.”


    “And kernel modules?”

