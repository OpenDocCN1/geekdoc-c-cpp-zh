    \n`-c` is count and there are other options. Like `-v` which is an inversion,\
    \ shows how many lines there are without the word `grapes`. To see how many files\
    \ have the grapes words without wanting to see the file, just add `-l` (small\
    \ L).\n\n```bash\n$ grep [a-h] pprosedrink.txt\n```\n\nThe square bracket can\
    \ contain things that can be matched.\n\nThis will highlight all the words that\
    \ contain alphabets between `a` and `h`.\n\n```bash\n$ grep a[[:blank:]] pprosedrink.txt\n\
    ```\nI am a fighting machine after this drink.\n\nAfter the `a`, `grep` used the\
    \ regular expression `a[[:blank:]]` which told the system to look for a blank\
    \ after the `a`. That is in short, a word ending with ‘a’. ” \n\n```bash\ngrep\
    \ th.[[:space:]] pprosedrink.txt\n```\n\nSeema asked about the dot after `th`.\
