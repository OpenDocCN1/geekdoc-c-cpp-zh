    \n![](img/image_rsrc857.jpg)\n\n她拒绝了。接下来的两次尝试也发生了同样，然后她问我为什么。我让她等一下，去上了手语课程然后回来。她还在那里试着合适的款式。于是我开始向她发手势。\n\
