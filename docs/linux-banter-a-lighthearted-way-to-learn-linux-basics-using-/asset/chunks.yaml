    <unistd.h>void *print_func(char* message){   printf("%s - Before sleep\n", message);   sleep(4);  
    printf("%s - After waking up\n", message);   }int main(){  pthread_t t1, t2; 
    printf("Main program now running\n");  pthread_create(&t1, NULL, (void *)print_func,
    (void *) "First call to pthread");  pthread_create(&t2, NULL, (void *)print_func,
    (void *) "Second call to pthread");  pthread_join(t1, NULL);  pthread_join(t2,
    NULL);  printf("Back to main after thread join\n");} |


    And then he proceeded to explain.


    | #include <stdio.h>#include <stdlib.h>#include <string.h>#include <pthread.h>#include
    <unistd.h>void *print_func(char* message){   printf("%s - Before sleep\n", message);   sleep(4);  
    printf("%s - After waking up\n", message);   } |


    The above code declares the required header files and prints two messages before
    sleep and after sleep. This is the routine which will be used by two calls. The
    above function will be called twice later on in the program.


    | int main(){    pthread_t t1, t2; |


    Threads are declared.


    |   printf("Main program now running\n"); |


    Just an indicator.


    | pthread_create(&t1, NULL, (void *)print_func, (void *) "First call to pthread");pthread_create(&t2,
    NULL, (void *)print_func, (void *) "Second call to pthread"); |


    Create the thread.


    To differentiate between two instances of the same function running, we have different
    messages that are passed on to the function in each instance. That way, it will
    let you see which thread is running.


    As seen above, the thread is created that calls the print_func function and a
    different message is passed each time. Usually, the best way to pass values is
    to pass a structure to the thread function using pthread_create. It is of the
    form,


    struct thread_args *args


    |   pthread_join(t1, NULL);  pthread_join(t2, NULL); printf("Back to main after
    thread join\n");} |


    Just an indicator to let us know that we are back in the main program.


    So, what do you think the output will be?” Lingaraj asked.


    “I think it will print the things with the first call to pthread and then the
    second call. Like this.


    Main program now  running


    First call to pthread - Before sleep


    First call to pthread - After waking up


    Second call to pthread - Before sleep


    Second call to pthread - After waking up


    Back to main after thread join


    Of course, with the 4 second delay for sleep.” said Seema.


    Lingaraj proceeded to run the program using


    | cc -D_REENTRANT thread_program .c  -lpthread |


    “You would have to compile like this :


    cc -D_REENTRANT thread_program .c –o thread_program -lpthread


    if NPTL(Native Posix Threads Library) is the default in your system.


    ” explained Lingaraj.


    The output was displayed on the screen.


    | Main program now  runningFirst call to pthread - Before sleepSecond call to
    pthread - Before sleepFirst call to pthread - After waking upSecond call to pthread
    - After waking upBack to main after thread join |


    Now, you will notice something amiss. The sequence you predicted is not there.
    While the 1st execution slice was sleeping, the scheduler thought it wise to sneak
    in the the 2nd execution slice. It didn’t wait for the 1st thread to finish execution.
    There is no synchronicity.”


    Lingaraj looked away and as was his habit, into the distance.


    “What is it?”


    “Once, I met this woman who was a believer in synchronicity. I was working in
    animal manure analysis at the time. She was a database analyst. She asked me over
    candle light dinner.


    ![](image_rsrc85A.jpg)


    ‘There is this number 7 that keeps popping up wherever I go and usually when I
    am doing something important. Do you have a number like that?’


    ‘Yes, I see number 2 everywhere.’


    She got up and left.”


    “No wonder!”


    “What if we wanted one piece of code to be locked before the scheduler got the
    next one in.'
