  trans: "\n\n- 根据变量的状态等待资源可用的进程。\n- 根据变量的状态，在资源可用时使用该资源的进程。\n- 进程在任务完成后更改变量的状态。\n\
    - 进程在开始任务之前更改变量的状态。”\n\n好的。”\n“在医生与电影制作人的案例中，开关是关键。”\n“灯泡。” Seema 试图纠正道。\n“它们是一个包的一部分。开关随灯泡免费赠送。它们必须连接在一起，否则为什么会导致触电呢？”\n\
    “不，灯泡必须和开关连接在一起，否则它怎么会亮呢？”\n“很有见。”\n\n## 与信号量相关的系统调用\n\n### semget\n```c\nint\
    \ semget(key_t key, int num_sems, int sem_flags);\n```\n`key` 基本上是资源标识符。\n\n“就像手术室。对手术室的引用。”\n\
    “如果存在资源，`num_sems` 是信号量的数量。通常为 1。\n\n`sem_flags` 允许你修改行为。上述系统调用可以返回由 `key` 标识的现有信号量的值，或者当标志为\
    \ 0 时返回。\n\n`sem_flags` 的其他值类似于 `open()` 中的模式。写入（Write）意味着信号量的值可以被修改。而执行权限则没有意义。\n\
    `sem_flags` 的低 9 位表示权限。\n\n它返回信号量标识符，一个非负整数。如果失败，它会设置 `ERRNO` 并返回 -1。\n\n“就像开关。更说是对开关的引用。”\n\
    \n### semop\n```c\nint semop(int sem_id, struct sembuf *sem_ops, size_t num_sem_ops);\n\
    ```\n`sem_id` 是 `semget` 返回的内容，即信号量标识符。\n`sem_ops` 是指向结构体数组的指针。重要的成员有：\n\n```c\n\
    struct sembuf {\n    short sem_num;\n    short sem_op;\n    short sem_flg;\n}\n\
    ```\n`sem_num` 是按计数定义的信号量编号。如果只有 1 个信号量，则为 0。\n`sem_op` 可能是最重要的，因为它是信号量必须改变的值。通常使用的是\
    \ -1 和 +1。\n`sem_flag` 设置为 `SEM_UNDO`，它可以帮助操作系统在进程在释放信号量之前终止时释放该信号量。\n\n### semctl\n\
    ```c\nint semctl(int sem_id, int sem_num, int command, ...);\n```\n此系统调用允许你直接控制信号量信息。\n\
    第一个参数是 `semget()` 返回的信号量标识符。`sem_num` 同样是按计数定义的信号量编号。只有 1 个信号量时为 0。\n\n`command`\
    \ 参数可以是：\n- `SETVAL`: 用于在开始将信号量初始化为一个值。\n- `IPC_RMID`: 当你使用后需要删除信号量时。\n\n可能存在命名信号量。但我不会深入探讨这一点。\n\
    \n## 没有信号量的程序\n\n### seema_loves_yoga.c\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <unistd.h>\nint main(int argc,char *argv[]) {\n    int i;\n    pid_t\
    \ pid;\n    pid = fork();\n    if(pid < 0) {\n        printf(\"Fork failed.\\\
    n\");\n        exit(1);\n    }\n    else if(pid == 0) {\n        char *ca1 = \"\
    Vijay\";\n        char *ca2 = \"loves football\";\n        puts(ca1);\n      \
    \  fflush(stdout);\n        sleep(4);\n        puts(ca2);\n    }\n    else {\n\
    \        char *ca1 = \"Seema\";\n        char *ca2 = \"loves Yoga\";\n       \
    \ puts(ca1);\n        fflush(stdout);\n        sleep(4);\n        puts(ca2);\n\
    \    }\n}\n```\n在这里，调用了 `fork`，父进程和子进程都会在 `sleep` 之后在 `for` 循环中打印两次字符。我们假设一个进程中的字符是一个一个打印的。但看输出：\n\
    Seema\nVijay loves football\n内核在父进程处于循环时偷偷插进了子进程，并尝试捕获几个，不允许任何父进程或子进程顺序打印字符串。因此，我们使用信号量来确保临界区的提交。\n\
    \n### seema_loves_yoga_sem.c\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <unistd.h>\n#include <sys/sem.h>\n#define KEY 0x1254\n\nunion semun {\n\
    \    int val;\n    struct semid_ds *buf;\n    unsigned short *array;\n};\nstruct\
    \ sembuf p = {0, -1, SEM_UNDO};\nstruct sembuf v = {0, +1, SEM_UNDO};\n\nint main(int\
    \ argc,char *argv[]){\n    int id = semget(KEY, 1, 0666 | IPC_CREAT);\n    if\
    \ (id < 0) {\n        printf(\"Couldn't create semaphore.\\n\");\n        exit(EXIT_FAILURE);\n\
    \    }\n     semun u;\n    u.val = 1;\n    if(semctl(id,0,SETVAL, u) < 0) {\n\
    \        printf(\"Semctl failed.\\n\");\n        exit(EXIT_FAILURE);\n    }\n\
    \    int i;\n    pid_t pid;\n    pid = fork();\n    if(pid < 0) {\n        printf(\"\
    Fork failed.\\n\");\n        exit(1);\n    }\n    else if(pid == 0) {\n      \
    \  char *ca1 = \"Vijay\";\n        char *ca2 = \"loves football\";\n        if(semop(id,\
    \ &p, 1) < 0) {\n            printf(\"Semop failed.\\n\");\n            exit(EXIT_FAILURE);\n\
    \        }\n        puts(ca1);\n        fflush(stdout);\n        sleep(4);\n \
    \       puts(ca2);\n        if(semop(id, &v, 1) < 0) {\n            printf(\"\
    Semop failed.\\n\");\n            exit(EXIT_FAILURE);\n        }\n    }\n    else\
    \ {\n        char *ca1 = \"Seema\";\n        char *ca2 = \"loves Yoga\";\n   \
    \     if(semop(id, &p, 1) < 0) {\n            printf(\"Semop failed.\\n\");\n\
    \            exit(EXIT_FAILURE);\n        }\n        puts(ca1);\n        fflush(stdout);\n\
    \        sleep(4);\n        puts(ca2);\n        if(semop(id, &v, 1) < 0) {\n \
    \           printf(\"Semop failed.\\n\");\n            exit(EXIT_FAILURE);\n \
    \       }\n    }\n}\n```\n\n## 解析\n- `KEY` `0x1254` 定义了一个信号量标识符。\n- `union semun`\
    \ 包含 `val`、`struct semid_ds *buf` 和 `unsigned short *array` 有些技术性，但对于实际操作，只需要知道定义它。这对于\
    \ `semctl` 是必要的。\n- `struct sembuf p = {0, -1, SEM_UNDO}` 和 `struct sembuf v =\
    \ {0, +1, SEM_UNDO}` 表示信号量的减法和增操作，类似于 `sem_wait` 和 `sem_post`。\n- `semget(KEY,\
    \ 1, 0666 | IPC_CREAT)` 创建信号量，后续是测试其是否成功。\n- `semctl(id,0,SETVAL, u)` 初始化信号量。\n\
    - `fork()` 让我们判断是在子进程还是父进程中以执行相应的代码。\n- 在子进程中，我们开始信号量减法。正如你可能注意到的，这是一个二值信号量。\n\
    - `semop(id, &p, 1)` 和 `semop(id, &v, 1)` 处理减和增操作，并延迟 4 秒以确保同步。\n\n"
- fmt: "\n| Seemaloves YogaVijay$ loves football |\n\nA part of the output is printed\
    \ after 4 because the parent process finishes before the child.\n\nYou might wonder\
    \ no real communication is happening. No messages were exchanged. But if you notice,\
    \ coordination is happening with respect to time. And that is good enough for\
    \ it to be called Interprocess Communication.\n\n## IPC : Shared Memory\n\nLingaraj\
    \ said,\n\n“Think of the example I gave where we would be putting a cocktail recipe\
    \ in a particular location near the rocks. The knock out rocks. You can even allow\
    \ other processes to access the memory location. I also told you it was useful\
    \ because whenever we put it on those stones and come back to collect it, there\
    \ would be more recipes added by people who would have experimented the previous\
    \ night.\n\n![](image_rsrc84T.jpg)\n\nThe recipe paper can be thought of as the\
    \ memory. And information is shared between the drunkards and we through this\
    \ sheet. This is faster than creating pipes or fifos. Here care should be taken\
    \ to see to it that no two processes are writing at the same time.\n\nThe system\
    \ calls are\n\n```c\n#include <sys/shm.h>\nint shmget(key_t key, size_t size,\
    \ int shmflg);\n```\n\nThe `key_t` `key` is the name of the memory segment. You\
    \ can use a `#define` to define a key, but this key has to be known by both the\
    \ processes to facilitate Inter Process Communication.\n\nThe value `IPC_PRIVATE`\
    \ makes the shared memory private to the process. When I was down in life, I wanted\
    \ to share my stories. But I could find no one. So, it used to be an `IPC_PRIVATE`\
    \ situation.\n\n“That’s sad.”\n\n“It was, until I started visiting the knock out\
    \ rocks.”\n\n“No, it’s not a joke. You have told me so many stories about yourself.\
    \ They are sad stories, but you make them sound funny. I laughed, I was amused,\
    \ I was taken aback and I was surprised at some of your stories. I am not a psychoanalyst\
    \ but I am human and I want to tell you that I admire the guy who is brave enough\
    \ to laugh at himself. I am missing Vijay in this situation, but in you I have\
    \ found an ally, a friend and a teacher. I have enormous respect for you. According\
    \ to family tradition, when we get married, there’s this ceremony where the bride’s\
    \ brother welcomes the guests with a sweet dish. That is a privilege given to\
    \ the most honourable member of the family and I can’t think of anybody else but\
    \ you doing it. I know I haven’t run it across with you, but I have decided that\
    \ it will be you.”\n\nLingaraj looked into the distance. He was feeling emotional\
    \ for the first time as far as Seema was concerned. Then he said,\n\n“I would\
    \ be over the ‘jamoon’ doing it.”\n\n“And there will be a lot of people who you\
    \ can connect with. It will be my responsibility to introduce you to a worthy\
    \ woman and get you married.”\n\n“Then let’s waste no time, sister. Size is the\
    \ size in bytes.”\n\nThe `shmflag` is something similar to `mode` in `open`. It\
    \ is `I_CREAT` `OR`ed with permissions to create a new segment. And if the segment\
    \ is already open, it does not say error, rather it is ignored unlike when you\
    \ use semaphores.\n\nAnd the return value is the memory segment identifier. -1\
    \ on error.\n\n```c\nvoid *shmat(int shm_id, const void *shm_addr, int shmflg);\n\
    ```\n\nThis is for telling which processes have access to the shared memory. This\
    \ is like attaching a shared memory segment to a process.\n\n`shm_id` is what\
    \ you get from `shmget()`, the shared memory identifier.\n\n`shm_addr` is the\
    \ address at which the shared memory is attached to the process. Leave it as a\
    \ null pointer and the system will handle the assignment.\n\nBut if you want to\
    \ control the memory address, you can use it in conjunction with `shmflg`. But\
    \ I would advise you against it. `SHM_RND` is used if you want to really control\
    \ the address of the memory segment.\n\nOne of the other values of `shmflg` is\
    \ `SHM_RDONLY` which makes the memory segment read only.\n\nSome more values are\
    \ :\n\n`SHM_EXEC` allows the code inside the shared memory segment to be executed.\n\
    \nIf `shmat` is successful, it returns a pointer to the first byte of the shared\
    \ memory.\n\n```c\nint shmdt(const void *shm_addr);\n```\n\nThis deletes a shared\
    \ memory segment. Not the contents though. It takes the address returned by `shmat()`.\n\
    \n```c\nint shmctl(int shm_id, int command, struct shmid_ds *buf);\n```\n\nThis\
    \ is for control of the shared memory.\n\n`shm_id` is the return from `shmget`.\n\
    \nThe commands can be `IPC_STAT` to obtain status information for the shared memory\
    \ segment.\n\n`IPC_RMID` means control. It removes the shared memory segment from\
    \ the system, destroys it and also the `shmid_ds` data structure.\n\nThe `shmid_ds`\
    \ structure contains more details about the shared memory segment.\n\nLet’s look\
    \ at this writer program,\n\n`shm_writer_1254.c`\n\n```c\n#include <sys/shm.h>\n\
    #include <stdio.h>\n#define key 0x1254\nint main(){\n    int shmid = shmget(key,BUFSIZ,0666\
    \ | IPC_CREAT);\n    char *str = (char *) shmat(shmid, (void*)0, 0);\n    printf(\"\
    Input some data\\n\");\n    fgets(str, BUFSIZ, stdin);\n    printf(\"Data written\
    \ in memory is %s\", str);\n    shmdt(str);\n}\n```\n\nHere, a key id defined.\
    \ This has to be known by the calling program. We then create the shared memory\
    \ using `shmget`. The `BUFSIZ` is usually around 8192, but it also depends on\
    \ the system. Then attach the memory. Also, we assign a string pointer to the\
    \ attached memory. So, the value of the string is written to the memory segment.\n\
    \nNext we ask the user to input the string, which is then stored in the string\
