  trans: "\n这里发生的情况是 `getopt` 假设 `-d` 之后的下一个选项（即输入的 `-a`）是选项 `-d` 的参数。用户必须输入正确的顺序，并在提供选项时保持精确。否则，它将再次涉及到对\
    \ `argv` 数组大量的扫描，并寻找选项后面是否有“-”之类的操作。\n\n如果你想让我工作起来更简单，并使用长格式的选项，你可以使用：\n\n```c\n\
    int getopt_long_only(int argc, char * const argv[], const char *optstring, const\
    \ struct option *longopts, int *longindex);\n```\n\n有一个类型为 `option` 的结构体如下：\n\n\
    ```c\nstruct option {\nconst char *name;\nint        has_arg;\nint        *flag;\n\
    int        val;\n};\n```\n\n“所以，你可以通过这个结构体访问这些值，”Lingaraj 说道。\n\n“你有什么关于包包的故事吗？”\n\
    \n“有。”\n\n“而且结果对你来说很悲惨。”\n\n“你是怎么猜到的？！”Lingaraj 惊讶地问。\n\n“坦率地说，我甚至不需要猜。”\n\n“我上大学的时候有一个女孩的生日。”\n\
    \n![](img/image_rsrc84U.jpg)\n\n她非常刻苦，擅长做笔记，很多学生都想向她的笔记学习。期末考试刚公布，安排在几周后。一天，我得知那是她的生日。所以我想送给她一个独特的惊喜。她正在草坪上吃午餐，我看到她的包放在那里。由于她正忙着说话，我便用气球系住那个包。她并没有注意到。\n\
    \n![](img/image_rsrc84V.jpg)\n\n系了大约 100 个气球并大喊道：“惊喜！”她转过头来。我松开手展示我的杰作。包连着气球飞走了。她的考试挂格了。”\n\
    \n![](img/image_rsrc84W.jpg)\n\nSeema 真心希望希望能为 Lingaraj 的感情生活做点什么。Lingaraj 继续说道：\n\
    \n“Linux 环境。我有两份简历。其中一份，写着以下内容：\n\n吸烟：否\n喝酒：否\n最喜欢的电视节目：纪录片\n过往感情：无\n视频游戏：否\n\
    等等。\n\n在另一份中：\n\n吸烟：偶尔\n喝酒：偶尔\n最喜欢的节目：惊疑片\n过往感情：很多\n视频游戏：射击僵尸等等。\n\n你认为哪一个是真实的？”\n\
    \n“显然是第二个，”Seema 充满心地回答道。\n\n“第二个是留给真朋友的。第一个是留给婚姻联盟的。所以我在这两个环境之间切换。\n\n当我必须记住某个特定环境变量的值时，我使用这个\
    \ C 库函数：\n\n```c\nchar *getenv(const char *name);\n```\n\n它告诉我由 `name` 指定的环境变量值。\n\
    \n如果我必须更改某个特定值，我使用：\n\n```c\nint putenv(const char *string);\n```\n\n字符串应该是这种格式：\n\
    \n`name=value`\n\n例如， \n\n`drink=beer`\n\n当我和朋友在一起且必须骑马回家时，我会使用这个设置。\n\n“那是因为当你喝得更多时，你就不稳定了，我想。”\n\
    \n“如果我想找到所有变量的值，我使用：\n\n```c\n#include <stdlib.h>\nextern char **environ;\n```\n\
    \n这是一个字符串数组，包含了变量列表。你可以在程序中使用 `while` 循环逐个地访问它们。好了，那明天见，”Lingaraj 突然说道。\n\n##\
    \ 时间相关函数\n\n第二天，Seema 早上早起去散步。她看到一组大约 4 到 5 个人正在慢运动。\n\n她加入了他们并发现很有趣。过了一段时间，她才意识到自己迟到了。Seema\
    \ 尽快准备好，去按了 Lingaraj 家的门铃。门铃是一个简单的铃装置，不需要电力。\n\n![](img/image_rsrc84X.jpg)\n\n\
    Lingaraj 出现在门口，Seema 能看到他。他留了一下，虽然看到了 Seema，但花了 5 分钟才开门。\n\n“你为什么这么才开门？”Seema\
    \ 略带地问道。\n\n![](img/image_rsrc84Y.jpg)\n\n“不。是你迟了。是你先开始的。请进。”\n\nSeema 安顿后，她告诉\
    \ Lingaraj。\n\n“我做了一些慢运动。”\n\n“既然说到时间，\n\n有一个时间系统调用，它能告诉你自 1970 年 1 月 1 日以来经过了多少秒。”\n\
    \n“秒？那可不方便。”\n\nLingaraj 给她看屏幕。\n\n```c\n#include <time.h>\ntime_t time(time_t\
    \ *tloc);\n```\n\n它返回一个在 `time.h` 中定义的 `time_t` 类型整数，如果你以 `tloc` 的形式指定位置，它会将值存储在那里。\n\
    \n所以，如果你必须找到两个时间之间的差，你就调用 `difftime`：\n\n```c\n#include <time.h>\ndouble difftime(time_t\
    \ time1, time_t time2);\n```\n\n这将给出秒差。\n\n如果你必须将一个分解的结构转换为原始时间，使用这个：\n\n```c\n\
    #include <time.h>\ntime_t mktime(struct tm *timeptr);\n```\n\n“谁会需要那个？”\n\n“我祖父以前用过。”\n\
    \n“但看起来没那么多了。”\n\n“谢天谢我错过了他。”\n\n“如果你想获取本地时间，使用：\n\n```c\n#include <time.h>\n\
    struct tm *localtime(const time_t *time);\n```\n\n这给了你本地时间。对于格林尼治标准时间，使用：\n\n\
    ```c\n#include <time.h>\nstruct tm *gmtime(const time_t *time);\n```\n\n如果你想打印时间，有一个比\
    \ `printf` 更好的时间输出工具。\n\n```c\n#include <time.h>\nsize_t strftime(char *s, size_t\
    \ maxsize, const char *format, struct tm *timeptr);\n```\n\n`s` 是结果字符串。`format`\
    \ 是你指定格式的地方、`%` 符号等。\n\n你可以使用 `strptime` 函数，它接收一个表示日期时间的字符串并创建一个表示相同日期和时间的 `tm`\
    \ 结构：\n\n```c\n#include <time.h>\nchar *strptime(const char *buf, const char *format,\
    \ struct tm *timeptr);\n```\n\n另一个 `time` 命令用于命令行运行程序并计算系统资源消耗。\n\n```bash\n$\
    \ time ./a.out\n```\n\n对于人类可读的字符串，使用：\n\n```c\n#include <time.h>\nchar *asctime(const\
    \ struct tm *time);\nchar *ctime(const time_t *time);\n```\n\n`asctime` 和 `ctime`\
    \ 返回的是人类可读的字符串。\n\n## 临时文件\n\nLingaraj 开始了这个话题。\n\n“让我们谈谈临时文件。有时你可能需要创建临时文件。\n\
    \n```c\n#include <stdio.h>\nchar *tmpnam(char *s);\n```\n\n它返回一个系统中不存在的唯一字符串。它也会更新字符串\
    \ `s` 中的内容。但问题是，另一个程序在你开始使用它之前，可能会创建一个同名的文件。\n\n```c\n#include <stdio.h>\nFILE\
    \ *tmpfile(void);\n```\n\n上面的 C 库函数创建并打开一个具有唯一名称的文件并返回一个文件流供立即使用。\n\n```c\n#include\
    \ <stdlib.h>\nchar *mktemp(char *template);\nint mkstemp(char *template);\n```\n"
- fmt: "\nIf you want the new filename to adhere to a pattern or template, use the\
    \ just mentioned C library functions. The template is whatever you want followed\
    \ by six X characters. The six X characters are replaced to give a unique file\
    \ name.\n\nThe difference between `mktemp` and `mkstemp` is that `mktemp` gives\
    \ just the file name. `mkstemp` returns a file descriptor after opening the file.\
    \ However it is advisable to use only `tmpfile()` and `mkstemp()`.\n\n## User\
    \ ids and groups\n\nLingaraj brought up a new topic.\n\n“User information. The\
    \ system call which gives you the `uid`, that is the user id of the person is\n\
    \n```c\n#include <sys/types.h>\n#include <unistd.h>\nuid_t getuid(void);\nchar\
    \ *getlogin(void);\n```\n\nThe `getuid()` system call returns the User ID with\
    \ which the program is associated. This is usually the UID of the user who is\
    \ running the program.\n\nThe `getlogin()` C library function returns the login\
    \ name of the current user.\n\n```c\n#include <sys/types.h>\n#include <pwd.h>\n\
    struct passwd *getpwuid(uid_t uid);\nstruct passwd *getpwnam(const char *name);\n\
    ```\n\nYou can get a lot of details about the user whose ID or name you know.\
    \ The above C library functions return a structure of the type `passwd`. Accessing\
    \ the contents will give you the details. You know how to access a structure I\
    \ suppose, having read C.”\n\n“Yes.”\n\n“The members of the `passwd` structure\
    \ are :\n\n| Member | Description |\n| :--- | :--- |\n| `char *pw_name` | The\
    \ user’s login name |\n| `uid_t pw_uid` | The UID number |\n| `gid_t pw_gid` |\
    \ The GID number |\n| `char *pw_dir` | The user’s home directory |\n| `char *pw_gecos`\
    \ | The user’s full name |\n| `char *pw_shell` | The user’s default shell |\n\n\
    You can fetch successive entries:\n\n```c\n#include <pwd.h>\n#include <sys/types.h>\n\
    void endpwent(void);\nstruct passwd *getpwent(void);\nvoid setpwent(void);\n```\n\
    \n`getpwent` returns a structure with a single user entry. The first time you\
    \ call it, it returns the first entry. The second time you call, the second entry.\
    \ So no need to have a variable and increment a value each time.\n\n`endpwent`\
    \ stops this C library function. `setpwent` sets the position to the start.\n\n\
    ```c\n#include <sys/types.h>\n#include <unistd.h>\nuid_t geteuid(void);\ngid_t\
    \ getgid(void);\ngid_t getegid(void);\nint setuid(uid_t uid);\nint setgid(gid_t\
    \ gid);\n```\n\nYou can use `getgid` to get the group id of the user/program.\
    \ `setuid` can only be used by the superuser or root, but is cautioned against\
    \ as once you change the user id of the process to something less, it is not possible\
    \ to get it back. This is like a king goes to roam in his kingdom and when he\
    \ comes back, the guards won’t let him enter. So, generally, `seteuid` which sets\
    \ the effective user id is used. I will show you a simple program.” he said and\
    \ showed a program passwd.c\n\n```c\n#include <sys/types.h>\n#include <pwd.h>\n\
    #include <stdio.h>\n#include <unistd.h>\n#include <stdlib.h>\nint main(){\n  \
    \  uid_t userid;\n    gid_t groupid;\n    struct passwd *password;\n    userid\
    \ = getuid();\n    groupid = getgid();\n    printf(\"User is %s\\n\", getlogin());\n\
    \    printf(\"User IDs: User id is %d, Group id is %d\\n\", userid, groupid);\n\
    \    password = getpwuid(uid);\n    printf(\"User ID entry shows the following\
    \ data :\\n Name is %s, User id is %d, Home Directory is %s, The shell is %s\\\
    n\", password->pw_name, password->pw_uid, password->pw_gid, password->pw_dir,\
    \ password->pw_shell);\n    exit(0);\n}\n```\n\nDo you get it? It’s a simple reading\
    \ of the password structure.” Seema saw it for a couple of minutes before saying\
    \ she did\n\n```c\n#include <sys/utsname.h>\nint uname(struct utsname *name);\n\
    ```\n\nThe `uname` system call writes host information to the structure pointed\
    \ to by `name` of the type `utsname`. When I say structure of the type, simply\
    \ means a structure containing the same fields as defined in the relevant file.\
    \ The `utsname` structure is defined in `utsname.h`. It must contain at least\
    \ these members:\n\n| Member | Description |\n| :--- | :--- |\n| `char sysname[]`\
    \ | The operating system name |\n| `char nodename[]` | The host name |\n| `char\
    \ release[]` | The release level of the system |\n| `char version[]` | The version\
    \ number of the system |\n| `char machine[]` | The hardware type |\n\n```c\n#include\
    \ <unistd.h>\nint gethostname(char *name, size_t namelen);\n```\n\nThis system\
    \ call writes the hostname onto the string `name`. The `namelen` is the least\
    \ size that is assumed.\n\n“Why is this important? We usually know the host’s\
    \ name.” Lingaraj remembered something and decided to tell Seema. Seema braced\
    \ for another of his stories.\n\n“When I was working as a software engineer, some\
    \ of us went to this hotel. We saw a party inside one of the halls and decided\
    \ to gatecrash. We were working for another firm. The party was by a company called\
    \ Some Software Solutions. They were celebrating success in a project. Since there\
    \ were a great number of people and we were dressed in formal attire, nobody suspected\
    \ we were from a different company. But we had a flight at 12 in the night and\
    \ we didn’t want to miss the flight also. We got drunk and did not realise the\
    \ passage of time. At 11, it hit me that we had only an hour to catch the flight.\
    \ I tried to look for my friends, but they had merged among the crowd. So I went\
    \ on stage where the DJ was playing. There were about 300 people in there. I spoke\
    \ to the DJ, but he couldn’t hear with the noise. So, I signalled him to stop\
    \ the music. I was too high by then and I took the mic. ‘People from another firm,\
    \ we have a flight to catch at 12, so let’s leave from here.’ Everybody started\
    \ staring. Then it hit me. That is why it is important to use `gethostname()`.\
    \ Moving on, let me show you this program. Works the same way as the program with\
    \ the password file, except the structure from which we get the details are different.\
    \ compdetails.c\n\n```c\n#include <sys/utsname.h>\n#include <unistd.h>\n#include\
    \ <stdio.h>\n#include <stdlib.h>\nint main(){\n    char machine[512];\n    struct\
    \ utsname comp_details;\n    gethostname(machine, 511);\n    uname(&comp_details);\n\
    \    printf(\"The machine host name is %s\\n\", machine);\n    printf(\"The System\
    \ is %s on %s hardware\\n\", comp_details.sysname, comp_details.machine);\n  \
    \  printf(\"The nodename of the machine is %s\\n\", comp_details.nodename);\n\
    \    printf(\"The version is %s, %s\\n\", comp_details.release, comp_details.version);\n\
    \    exit(0);\n}\n```\n\nNow, logging.\n\n```c\n#include <syslog.h>\nvoid syslog(int\
    \ priority, const char *message, arguments...);\n```\n\nIt’s a log message. But\
    \ future civilisations might see it as history and try to recreate the ethos of\
    \ the age based on your unique case alone. It’s something like a diary, except\
    \ action about where these messages go is taken depending on the priority. The\
    \ options for priority are these.\n\n| Priority |\n| :--- |\n| `LOG_EMERG` |\n\
    | `LOG_ALERT` |\n| `LOG_CRIT` |\n| `LOG_ERR` |\n| `LOG_WARNING` |\n| `LOG_NOTICE`\
    \ |\n| `LOG_INFO` |\n| `LOG_DEBUG` |\n\n```c\nvoid openlog(const char *ident,\
    \ int logopt, int facility);\n```\n\nIf you want to ‘customise’ the way the messages\
    \ are logged, you can use this C library function. `ident` is what you can prepend\
    \ to messages, like “Seema’s activity was: The `facility` parameter records a\
    \ default facility value to be used for future calls to `syslog`. The `logopt`\
    \ parameter configures the behaviour of future calls to `syslog`.\n\n## Resources\
    \ and limits\n\nLingaraj began speaking.\n\n“A program, a set of system calls\
    \ to set limits on others who are using Vijay’s resources and set your priorities\
    \ on him. Would you like that?”\n\n“Vijay is a grown man, a machine or not, he\
    \ can decide for himself. But yes, I would like to learn these calls.”\n"
