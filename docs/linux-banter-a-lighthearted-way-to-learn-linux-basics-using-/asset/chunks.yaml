  trans: "\n与之相似，`system` 调用就像一个代理人，通过让别人来完成工作。假设我有一个家庭管家。我请他为派对叫一个厨师，当我在办公室时，他在家里做饭。管家会收取佣金，并让厨师执行这项任务。水管维修、开车以及排队付账单也是同样的。\n\
    \n但如果你有一个全能的人才，他既会做饭，又会开车，还会付账单，那将会非常有帮助。\n\n它们有很多类型。有些只接受一个参数。有些接受参数数组，还有的要求你提供路径。\n\
    \n```c\n#include <unistd.h>\nchar **environ;\nint execl(const char *path, const\
    \ char *arg0, ..., (char *)0);\n```\n\n`path` 显然是命令可执行文件存储的位置。\n\n`arg0`、`arg1`\
    \ 等是所调用程序的参数。如果你自己写了一个程序，这些参数就是该程序中 `main` 函数的参数。`(char *) 0` 告诉 `execl` C 库函数，参数列表结束了。\n\
    \n现在，`execl` 类的 C 库函数，你可以把它们想象成“全能阿伦”（Mr All round Arun）。\n\n“全能阿伦是我请过的一个管家。他无所不知。他是个好司机、好厨师、电影导演、火箭科学家和水管工。每当我要求他做某项工作时，他就会戴上那顶特定的帽子。我的工作变成了他的工作，他执行得非常好。”\n\
    \n“你的意思是没有启动新进程吗？就像是你自己在做一样？”Seema 问。\n\n“没错。当 `exec` 类的函数启动一个新进程时，它使用调用进程的进程\
    \ ID（PID）。记得 Shell 脚本中的执行吗？我祖父去世时想让我父亲接手配方工作。这很像，但它是 C 库函数的形式。它们调用的是可执行文件，”Lingaraj\
    \ 说。他继续道：\n\n“阿伦从不向我收钱，因为他很有钱。”\n\n“后来发生了什么？他去世了吗？”\n\n“不，我解雇了他。”\n\n“为什么？”\n\n\
    “有一天他戴上了我的帽子，开始认为自己就是我。他指使我，我为他工作，直到我有机会把他的帽子摘下来。”\n\n被调用的进程实际上会消除调用进程。调用进程消失了。\n\
    \n```c\nint execlp(const char *file, const char *arg0, ..., (char *)0);\n```\n\
    \n在这里，`path` 被替换为 `file`。这意味着命令将自动在 `PATH` 变量中查找文件。如果文件不在路径中，你必须指定完整路径名。\n\n```c\n\
    int execle(const char *path, const char *arg0, ..., (char *)0, char *constenvp[]);\n\
    ```\n\n在这里，`e` 象征“额外的”（extra）。通常指新进程应该运行的环境。如果没有定义，则使用当前进程的环境。\n\n```c\nint execv(const\
    \ char *path, char *const argv[]);\n```\n\n在这里，该函数接受一个参数数组。\n\n```c\nint execvp(const\
    \ char *file, char *const argv[]);\n```\n\n它将 `PATH` 中的文件名或完整路径，以及一个数组作为参数传递。\n\
    \n```c\nint execve(const char *path, char *const argv[], char *const envp[]);\n\
    ```\n\n同样，将 `PATH` 中的文件名或完整路径，以及数组同环境作为参数传递。\n\n所以，如果函数名中包含 `p`，它会在路径中搜索；`e` 意味着额外的（环境）；而\
    \ `v` 意味着数组。\n\n```c\n#include <sys/types.h>\n#include <unistd.h>\npid_t fork(void);\n\
    ```\n\n如果你想让 Vijay 在赞美你亲戚的同时启动另一个进程……”\n\n“我会使用 `Ctrl+C` 和 `Ctrl+V`，复制粘贴。”\n\n\
    “`Ctrl+C` 是一个停止前台进程的信号。所以，如果你对 Vijay 使用 `Ctrl+C`，你将立即停止他正在赞美你亲戚的前台进程。”\n\n`fork`\
    \ 就像是进程的复制粘贴，但它为生成的每个进程分配了不同的 `PID`。\n\n你为什么需要 `fork`？为了创建一个子进程。\n\n无论如何，`fork`\
    \ 会将子进程的 `PID` 返回给父进程。对于子进程，它返回 `0`。在失败的情况下，它向父进程返回 `-1`。这在编程语文中非常重要。它给了我们一种方法来判断程序是在父进程还是子进程中。因此类型为\
    \ `pid_t`。所以，当你 `fork` 时，你创建了进程的另一个实例，即子进程。如果失败，它返回 `-1`。可能失败的原因有：\n\n- 子进程过多，限制由\
    \ `CHILD_MAX` 指定。当你看到 `errno` 时，它将是 `EAGAIN`。\n- 如果进程表中没有空间或没有内存，`errno` 被设置为\
    \ `ENOMEM`。\n\n```c\n#include <sys/types.h>\n#include <sys/wait.h>\npid_t wait(int\
    \ *stat_loc);\n```\n\n让我再次提一下。在程序执行过程中，如何发现你是在子进程还是父进程中？通过返回值。在子进程中是零，在父进程中是子进程的\
    \ `pid`。\n\n父进程（创建子进程的进程）可以使用 `wait()` 查询状态，判断它是运行还是停止。状态存储在 `stat_loc` 中。列表如下：\n\
    - `WEXITED`\n- `WSTATUS`\n- `WSIGNALED`\n- `WTERMSIG`\n- `WSTOPPED`\n\n```c\n\
    #include <sys/types.h>\n#include <wait.h>\npid_t waitpid(pid_t pid, int *stat_loc,\
    \ int options);\n```\n\n`pid` 是子进程的进程 ID。现在，`options`：\n- 与 `wait()` 相同，但 `WNHANG`\
    \ 不阻塞调用者。如果子进程仍在运行，它返回 `0`。\n- 如果调用被中断或参数无效，它返回 `-1`。\n\n另一个需要知道的重要是：如果进程打开了文件描述符，当调用\
    \ `exec` 类函数时，这些描述符会被保留。当进程终止时，该项会留在进程表中，直到父进程终止（此时父进程变为 `init`）。让我们来看一个程序。`maker.c`\n\
    \n```c\n#include <sys/types.h>\n#include <sys/wait.h>\n#include <unistd.h>\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    pid_t pid;\n    char *message;\n\
    \    int exit_code;\n    printf(\"Fork starting\\n\");\n    pid = fork();\n  \
    \  switch(pid)\n    {\n        case -1:\n            exit(1);\n        case 0:\n\
    \            printf(\"This is the child\\n\");\n            printf(\"With PID\
    \ : %d\\n\", getpid());\n            exit(EXIT_SUCCESS);\n            break;\n\
    \        default:\n            printf(\"\\n\\nThis is the parent\\n\");\n    \
    \        printf(\"With PID : %d\\n\", getpid());\n            sleep(30);\n   \
    \         break;\n    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n上面的程序通过 `fork` 创建了一个子进程。我们可以识别（当程序运行时）进程是在父进程还是子进程中。如果进程\
    \ ID 为 `0`，意味着它是子进程。它立即结束了。父进程允许继续运行 30 秒。然后程序退出。我为什么要这么做？为了给你们展示僵尸进程。如果子进程在父进程之前终止且父进程没有调用\
    \ `wait()`，则子进程被称为称为僵尸进程。\n\n正如你们所知，`wait` 将子进程的状态返回给父进程。当我们运行这个程序时，会得到以下输出：\n\
    \n```\nThis is the parent\nWith PID : 35916\nThis is the child\nWith PID : 35917\n\
    ```\n\n在另一个终端，如果你输入\n\n```bash\n$ ps -al\n```\n\n在其他进程中，你会发现一个项：\n\n```\n1 Z \
    \ 1000  35917  35916  0  80  0 -       0 -       pts/0   00:00:00\n```\n"
- fmt: "\nNotice the ‘Z’ that means Zombie process and the process number `35917`.\
    \ Of course, you see `35916` as well, but that is the `ppid`, the parent process\
    \ ID. It will show this process as a Zombie until the parent process finishes.\n\
    \nWe rectify this, using `wait`.\n\n`zwait.c`\n\n```c\n#include <sys/types.h>\n\
    #include <sys/wait.h>\n#include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
    int main(){\n    pid_t pid;\n    char *message;\n    int exit_code;\n    printf(\"\
    Fork program starting\\n\");\n    pid = fork();\n    switch(pid)\n    {\n    case\
    \ -1:\n        exit(1);\n    case 0:\n        printf(\"This is the child\\n\"\
    );\n        printf(\"With PID : %d\\n\", getpid());\n        exit(24);/*Here,\
    \ we give an exit code to see whether it can be retrieved in the parent process.\
    \ */\n        break;\n        default:\n        printf(\"\\n\\nThis is the parent\\\
    n\");\n        printf(\"With PID : %d\\n\", getpid());/*  From here, lines are\
    \ added */\n        int stat_val;\n        pid_t child_pid;\n        child_pid\
    \ = wait(&stat_val);/*wait is called, which returns the pid of the child and also\
    \ frees up resources. The child was showing as a zombie because it’s resources\
    \ weren’t freed up.*/\n        printf(\"Child has finished: PID = %d\\n\", child_pid);\n\
    \        if(WIFEXITED(stat_val))\n            printf(\"Child exited with code\
    \ %d\\n\", WEXITSTATUS(stat_val));Here, we use WIFEXITED to see if the child process\
    \ terminated normally, and if so, we continue to display with what code the child\
    \ process exited with using WEXITSTATUS(stat_val)\n        else\n            printf(\"\
    Child terminated abnormally\\n\");\n        sleep(30);\n        break;\n    }\n\
    \    exit(EXIT_SUCCESS);\n}\n```\n\nWhen we run this:\n\n```\nThis is the parentWith\
    \ PID : 36960This is the childWith PID : 36961Child has finished: PID = 36961Child\
    \ exited with code 23\n```\n\nSo, the child process ID and the exit code were\
    \ retrieved by the parent process.\n\nAnd if we check with `ps -al`, there is\
    \ no mention of the Zombie process despite the parent process running for 30 seconds\
    \ more.\n\nA good shell command is the `pstree -p` command with which you can\
    \ see the process tree along with the process IDs. I suggest you try this on your\
    \ own while running the above programs to see which process gave rise to which\
    \ process.\n\n# Signals\n\nLingaraj began.\n\n“There was this incident that happened\
    \ in a shopping mall. I was trying to pick up a gift for my girlfriend when I\
    \ noticed a young woman trying to select jewellery for her ears. She kept on trying\
    \ various jewellery and we both could see each other in the mirror. I gave her\
    \ signals on what she was trying out. She was trying out a pair of earrings when\
    \ I gave her the thumbs down sign.\n\n![](image_rsrc857.jpg)\n\nShe rejected it.\
    \ The same thing happened with the next two tries and then she asked me why. I\
    \ asked her to wait, took a course in sign language and came back. She was still\
    \ there trying to get the right look. Then I started signalling her.\n\n“What\
    \ did you signal?” asked Seema.\n\nHere’s a set of signal messages:\n\n- The very\
    \ idea of earrings is wrong.\n- You are taking too much time to decide.\n- Please\
    \ stop talking on the phone and try out something.\n- Somebody blocking the view\
    \ in the mirror.\n- Repeating the same thing she wore without remembering it.\n\
    - Throw a big rock at the mirror and shatter it because you have been standing\
    \ there for ages and she can’t decide.\n\n“And what happened?” asked Seema.\n\n\
    “She made a selection of about 8 pairs of earrings, 12 necklaces and 7 studs for\
    \ the nose. And promptly disappeared. I would have too, but she had told the shopkeeper\
    \ that I was her husband. The shopkeeper believed since I had made the selections.\
    \ I had to pay from my girlfriend’s credit card as I was living off her at that\
    \ time. I stayed with my girlfriend until the credit card bill arrived. I was\
    \ eating ‘onion dosei’ she had made and I had to tear myself away from the dosei.\
    \ She used to make such good onion doseis.”\n\nSeema saw Lingaraj had a catch\
    \ in his throat and she was not sure whether Lingaraj was feeling emotional for\
    \ the woman or the doseis.\n\nLingaraj recovered and continued.\n\n“I told you\
    \ about `Ctrl+C`. On Linux, it sends the `SIGINT`. If Vijay’s being erratic in\
    \ behaviour, you can stop it using `Ctrl+C`. Unless Vijay can catch it.”\n\nHere’s\
    \ a list of some signals:\n\n| `SIGABORT` |\n| `SIGALRM` |\n| `SIGFPE` |\n| `SIGHUP`\
    \ |\n| `SIGILL` |\n| `SIGINT` |\n| `SIGKILL` |\n| `kill [options] <pid> [...]`\
    \ |\n\nCan you guess what a `kill` command can do to a process?\n\n“It kills it.”\
    \ said Seema.\n\n“It sends a signal to a process to kill it. And the `kill` command\
    \ can send a signal that even tells the process to continue if it’s in a good\
    \ mood.\n\nIf you don’t specify a signal, the default is `TERM`. Meaning, true\
    \ to it’s name, the `kill` command will send a terminate signal to the process\
    \ defined by `pid`. If the program doesn’t listen, the option `-KILL` definitely\
    \ kills. BTW, the `kill` does not work on zombie processes.\n\nIf `pid` is a negative\
    \ number, the positive value of `pid` will be treated as a process group. If it’s\
    \ positive, the process id is indicated. If it’s `-1`, all processes will be sent\
    \ the `kill` signal except `init` and `inetd`.\n\nThe signal can be specified\
    \ using the name or number. To see a list of available signals, use the `kill\
    \ -l` command.\n\nThis was the `kill` command. There is a `kill` system call as\
    \ well.\n\n```c\n#include <sys/types.h>\n#include <signal.h>\nint kill(pid_t pid,\
    \ int sig);\n```\n\nAs you can see, it takes the `pid` of the process to be done\
    \ away with.\n\nThe `kill` system call takes the `pid` of the process to be done\
    \ away with and the `sig`. It can fail and return `-1` if:\n\n- The signal specified\
    \ is not valid, setting `errno` to `EINVAL`.\n- If it doesn’t have permission,\
    \ in which case `errno` is set to `EPERM`.\n- If the specified process doesn’t\
    \ exist, setting `errno` to `ESRCH`.\n\n“Why is it only signals are sent. So negative.”\n\
    \n“Imagine Vijay is thinking about friends while his uncle is going on. What happens\
    \ when a signal occurs? Will a function be called, or SIG_DFL, that is default\
    \ action be taken? Or SIG_IGN which will ignore the signal.”\n\n“Would you want\
    \ to encourage that or kill it?” asked Lingaraj.\n\n“You can set `nice` for that.\
    \ The `nice` command.\n\n| `nice` options |\n\nYou can set a value like `-20`\
    \ to `20`.”\n\n“Okay, I will use it to set a value to my uncle.”\n\nLingaraj thought\
    \ for a moment. He appeared to be in a dilemma. He spoke.\n\n“Setting a high value\
    \ with `nice`, you reduce the priority of the command. Lower value means higher\
    \ priority. You can use `renice` to change a process priority. Example:\n\n`renice\
    \ 10 1362` where `1362` is the process id.\n\nThe `signal()` system call.\n\n\
    ```c\n#include <signal.h>\nvoid (*signal(int sig, void (*func)(int)))(int);\n\
    ```\n\nYou can provide actions for signals received or catch it using the `signal`\
    \ command, which makes the process, either ignore it, use default behaviour or\
    \ run a function in the program.\n\nSo, every signal’s response can be coded using\
    \ the `signal` system call.\n\nBut then, you can forget it, because it is no longer\
    \ being used.\n\nI will just mention `pause`.\n\n```c\n#include <unistd.h>\nint\
    \ pause(void);\n```\n\nIt makes the process pause until a signal appears. In place\
    \ of `signal()`, we have a more robust system call.\n\n```c\n#include <signal.h>\n\
    int sigaction(int sig, const struct sigaction *act, struct sigaction *oact);\n\
    ```\n\nReturn values of `sigaction`:\n\n`0` if there’s no error.\n\n`-1` if there\
    \ is an error. This happens if the signal is invalid or if the signal cannot be\
    \ caught or ignored.\n\nThe `sig` is the signal.\n\nThe `struct sigaction` has\
    \ within it, members that deal with a signal.\n\nSome of the members of the structure\
    \ `sigaction` are:\n\n- `void (*) (int) sa_handler`\n\nWhat happens when a signal\
    \ occurs? Will a function be called, or SIG_DFL, that is default action be taken?\
    \ Or SIG_IGN which will ignore the signal.\n\n- `sigset_t sa_mask`\n"
