  trans: "\n\n`sem_open()` 创建一个新的 POSIX 信号量或打开一个已存在的信号量。信号量通过名称标识。它返回信号量的地址。\n\n```c\n\
    #include <semaphore.h>\nint sem_destroy(sem_t * sem);\n```\n\n该函数正如其名所示会销毁信号量。它还会清理资源。\n\
    \n回到灯光开关并并行的类比。一个挑剔的电影星在等待时，如果他在外面而医生们在里面，他会一直要求导演检查灯的状态。这种行为是不被鼓励的，无论是不是电影星，该演员都会被踢出剧组。当灯熄灭时，团队会知道的。因为程序一直在关注这一点。就像那些一直在寻找折扣或免费优惠券的人一样。\n\
    \n所以，在编写程序时，你可以使用 `pthread` 启动一个线程。它将一直运行。你创建一个信号量，并告诉内核当信号量值为 `0` 时会发生什么。这会启动一个例程。你可以告诉当信号量有值时会发生什么。但你不需要告诉程序不断查找该变量并检查它是否变为\
    \ `0` 或为正数。这是系统的工作。让我们修改程序并命名为 `thread_sem_program.c`，这次使用信号量。确保包含 `semaphore.h`。\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\n#include <semaphore.h>\nsem_t semap1;\nvoid\
    \ *print_func(char* message){\n    sem_wait(&semap1);\n    printf(\"%s - Before\
    \ sleep\\n\", message);\n    sleep(4);\n    printf(\"%s - After waking up\\n\"\
    , message);\n    sem_post(&semap1);\n}\nint main(){\n  sem_init(&semap1,0,1);\n\
    \  pthread_t t1, t2;\n  printf(\"I am in main\\n\");\n  int iret1 = pthread_create(&t1,\
    \ NULL,(void *) print_func, (void *) \"First Instance\");\n  int iret2 = pthread_create(&t2,\
    \ NULL, (void *) print_func, (void *) \"Second Instance\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  sem_destroy(&semap1);\n  printf(\"Back\
    \ to main after thread join\\n\");\n}\n```\n\n我将这样运行它：\n\n```bash\ncc -D_REENTRANT\
    \ thread_sem_program.c -lpthread -lrt\n```\n\n输出再次如下：\n\n```\nMain now running\n\
    First Instance - Before sleep\nFirst Instance - After waking up\nSecond Instance\
    \ - Before sleep\nSecond Instance - After waking up\nBack to main after thread\
    \ join\n```\n\n“Vijay 现在怎么样了？”\n“他不记得我们相处时的一些事了。”\n“你说的那个键盘，他会把它交给任何每一个人来让自己被编程吗？”\n\
