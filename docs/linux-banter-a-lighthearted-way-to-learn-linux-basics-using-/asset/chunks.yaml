    Back to main after thread join\\n\");\n}\n```\n\n我将解释这个。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    pthread_mutex_t mutex1 = PTHREAD_MUTEX_INITIALIZER;\n```\n这初始化了互斥锁 mutex1。\nvoid\
