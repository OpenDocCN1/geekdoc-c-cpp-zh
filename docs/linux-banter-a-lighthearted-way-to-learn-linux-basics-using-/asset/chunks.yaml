    “I have a question. Once you get access to `Vijay`, what are you going to do?”


    “I will become his superuser.”


    “Tomorrow, we will get into shell scripting, superuser.”


    # Shell Scripting


    It was evening and Seema thought it would be better to record Lingaraj’s classes.
    It would help her when she went back to Bengaluru. But it also contained some
    personal stories of his, and she decided against it. She made some sandwiches
    for herself and slept early that day. It was going to become a habit. 


    ![](image_rsrc83S.jpg)


    “This is a shell script. But it’s not a file. We will type it into the command
    prompt.”


    ```bash

    $ for file in *>

    ```


    Lingaraj said while showing the screen on the laptop.


    “The dollar just changed to this ‘>’ symbol!” exclaimed Seema.


    “That happens to me in real life when it comes to money. Except it is the less
    than symbol.”


    Lingaraj typed further. The complete program looked like this :


    ```bash

    $ for file in *>>do if grep -l failure $file> then more $file> fi done own```


    What followed was the output.


    ```

    | Failed relationshipThis is a file with failure in it. Please watch some motivational
    videos.$ |

    ```


    “I will explain the above later.”


    “You mean the failed relationships?” asked Seema.


    “The `grep` command.” corrected Lingaraj.


    “Okay.” said Seema.


    ## Variables and Constants


    “Variables. Variables are those which vary and constants are those which don’t
    vary during program execution.


    You can declare variables in the program as you go. Variables are case sensitive.
    To capital and small letters. ‘`Linux’ is different from ‘`linux’.”


    “Let me try.” said Seema and typed on the command prompt :


    ```bash

    $ var=Sonal$ constant=Seema

    ```


    “I read a lot into it. To find out what the variable value is, you prefix a `$`
    sign to it. You can use `echo $var` to see who the current...I mean what the current
    variable is.”


    Seema typed on the command prompt.


    ```bash

    $ echo $var

    ```


    The output was then shown on the screen.


    ```

    | Sonal |

    ```


    She typed further.


    ```bash

    $ echo $constant |

    ```


    The output was shown.


    ```

    | Seema |

    ```


    Seema felt triumphant.


    “There is this peculiar situation. If you assign a value to the variable like
    `3 + 4` what happens?” asked Lingaraj.


    Seema typed.


    ```bash

    $ result=3+4$ echo $result

    ```


    The output was shown.


    ```

    | 3+4 |

    ```


    “It didn’t add.” said Seema.


    “So, we learn that the variable is stored as a string and not as a value.


    No spaces on either side of the equal. And if you want to include spaces like
    ‘`Sonal Vijay`’, you quote them.”


    Lingaraj was oblivious to his mistake regarding ‘`Sonal Vijay`’ together and Seema
    thought he would correct it. She typed.


    ```bash

    $ constant=“Seema Vijay”echo $constant

    ```


    The output was shown.


    ```

    | Seema Vijay |

    ```


    “You can read input also and assign the input to a variable using `read` and the
    variable name after you ask for the user input in the script.” said Lingaraj.


    Seema typed.


    ```bash

    $ read earinput

    ```


    The she typed.


    ```

    | Let’s go to the movie. |

    ```


    “Now, use `echo $earinput`” said Lingaraj.


    Seema typed.


    ```bash

    $ echo $earinputLet’s go to the movie. |

    ```


    “Let’s try this in a program. Notice the quotation marks” said Lingaraj. And typed
    in a new shell script named `vardemo.sh`.


    ```bash

    #!/bin/shVijaysvar=“Are you in there”echo $Vijaysvarecho “$Vijaysvar”echo ‘$Vijaysvar’echo
    \$Vijaysvarecho Enter some textread Vijaysvarecho ‘$Vijaysvar’ now equals $Vijaysvarexit
    0

    ```


    He executed the shell script at the command prompt, by using


    ```bash

    $ sh vardemo.sh

    ```


    and the output was displayed on the screen.


    ```

    | Are you in thereAre you in there$Vijaysvar$VijaysvarEnter some text |

    ```


    At this point, Lingaraj entered some text.


    ```

    | All variables cleared |

    ```


    The program continued to execute.


    ```bash

    $Vijaysvar now equals All variables cleared |

    ```


    “This shows the syntax of using variables and echoing them.”


    Lingaraj continued.


    ![](image_rsrc83T.jpg)


    “Suppose you find yourself in a system and want to know more about the system.
    The shell supplies some variables that are available once the script starts.


    I allowed you to live in the house.” he said changing the topic suddenly.


    “Yes, that was mighty good of you. I wanted to thank you but with all this Vijay
    situation…”


    “Did you clean the room.”


    “Did I have to? I mean it was clean enough.”


    “That’s because I cleaned it before you came. Now, suppose I hadn’t cleaned the
    house, what would you have done?”


    “I would have cleaned it.”


    “While executing the task, you would have these details in your know how.


    1) `Home`. Which is your home?


    2) `PATH` : Where to look for tools like broom, buckets, etc.


    3) The name of the task. In this case, cleaning. But it could be even disinfecting
    or fumigating.


    4) The number of variables passed. In case you are cleaning, I will say to you,
    use neem paste, turmeric root extract and apple cedar vinegar as the cleaning
    agent. So,

