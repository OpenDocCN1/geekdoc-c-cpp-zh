    The first change is the sprintf function. It captures the first file descriptor
    in the array passed to pipe in the holder, buffer. That is, it prints the value
    of the file descriptor stored in filed_pipe[0] into buffer. Because the second
    program we call later will not inherit the file descriptors.” explained Lingaraj.


    “But there is a call to fork.” said Seema.


    “Yes. The logic is, if we call another program using execl, which we will, the
    calling process is done away with, even though the process id continues. It’s
    like all round Arun completely taking over my position and I not being there any
    longer. So, the process is finished. We call the fork, create a child process
    and then call execl from the child process. This way, the parent process is retained
    and the child process finishes. Hence, you won’t see the text in the printf statement,
    “This is the child process,but this text won''t be displayed because execl finishes
    off the calling process.” after execl is called.


    In execl, we call the program to be executed which is ‘pipe_cons’ and also supply
    two pieces of information. One, the name of the program as an argument to the
    program being called.  And the other, the file descriptor we had stored in buffer.
    So, the program being called by execl will have the information.


    Let’s move on to the consumer program which receives the data. This is named pipe_cons.


    pipe_cons.c


