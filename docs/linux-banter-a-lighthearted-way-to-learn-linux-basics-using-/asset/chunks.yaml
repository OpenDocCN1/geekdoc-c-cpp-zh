    The select system call basically is a monitoring system. I had gone to this kung
    fu school to learn. We were supposed to be doing the moves and suddenly the instructor
    would say stop. We had to stop and hold the pose for a long time. Then he would
    monitor us. He would notice if anybody moved and if he did, he would immediately
    return to the master’s chamber and tell him that somebody moved. Sometimes the
    master would be doing his own practice and the instructor would have to wait for
    a specific time duration before he went running inside and told the master how
    many people had moved.


    Select monitors a set of file descriptors if they are ready for reading, writing
    or whether they have an error condition.


    The parameters are :


    nfds : The maximum number of file descriptors it can monitor. It is usually the
    highest file descriptor number plus one.


    The fd_set tells the system that it is a file descriptor set and this has to be
    declared.


    readfds refers to the file descriptor set that we want to test are read ready,
    that is whether they can accept any inputs.'
