    \  int msgid;\n  char buffer[BUFSIZ];\n  msgid = msgget((key_t)key, 0666 | IPC_CREAT);\n\
    \  if (msgid == -1) {\n    fprintf(stderr, \"msgget failed with error: %d\\n\"\
    , errno);\n    exit(EXIT_FAILURE);\n  }\n```\n\nWe get into main and after the\
    \ necessary initialisations, we call msgget using the unique key and IPC_CREAT.\n\
    \nWe print the relevant message to the screen in case of failure.\n\n```c\n  while(loop_cond)\
    \ {\n    printf(\"Enter text to be passed. Type 'enough' to stop: \");\n    fgets(buffer,\
    \ BUFSIZ, stdin);\n    data_passed.msg_type = 1;\n    strcpy(data_passed.text,\
