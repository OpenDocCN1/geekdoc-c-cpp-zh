    \ intelligence. \n\n```bash\nfind . -newer Seema\n```\n\nNotice the period(.).\n\
    \nFinds the files newer than the file `Seema`. In case, there are any more additions\
    \ since you last met Vijay.” said Lingaraj aiming to help.\n\n“This is going a\
