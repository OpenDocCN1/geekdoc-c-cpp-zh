    file_des;    memset(buffer,''\0'',sizeof(buffer));    sscanf(argv[1],"%d", &file_des);   
    printf("The argument to the consumer program is %s\n", *argv);    bytes_ex = read(file_des,
    buffer, BUFSIZ);    printf("The process %d has read %d bytes. Content : %s \n",
    getpid(), bytes_ex, buffer);    exit(EXIT_SUCCESS);} |


    This receives the data passed through sscanf. But a word about memset().


    #include <string.h>


    void *memset(void *s, int c, size_t n);


    The  memset()  function  fills  the  first  n  bytes of the memory area


    pointed to by s with the constant byte c. If you want a memory area to be filled
    with NULL characters, use what the above program uses.


    “There was this guy we called Speech Sathya. He was a speaker. Nobody used to
    listen to him because he used to lie. He had a false NULL terminator. A NULL terminates
    a string as you know. He used to say “My speech is done.” and would go on for
    half an hour more. You want to meet him?


    “NULL. I won’t say anything beyond this.”


    Lingaraj knew she hadn’t got the point. He didn’t know how to explain this. So
    he moved on.


    The next line prints the argument received by this consumer program, which is
    sent when we run the producer program. This will show in the output as this program’s
    name, which is ‘pipe_cons’. Then it reads from the file descriptor. What does
    it read? It is not reading from a file, but from a file descriptor which was written
    to using a pipe. Of course, you can say, rather than passing the argument and
    the file descriptor through the buffer, why not pass the string, ‘Crocodile Doctor’
    directly. We might need to pass amounts of data which cannot be simply held in
    a string.”


    The output, after we create the executables, name them pipe_prod and pipe_cons
    respectively, an important step, and run the pipe_prod program only using ./pipe_prod


    | This program wrote 16 bytes -The argument to the consumer program is pipe_consThe
    process 53534 has read 16 bytes. Content  : Crocodile Doctor |


    The 53534 is specific to this instance as I said before.”


    “What if the second process isn’t started from the first program, but a totally
    unrelated program?” asked Seema.


    “Good question. We have FIFOs for that. A FIFO as I said is First In First Out.
    Whatever you put into a FIFO has to be accessed in the same sequence you put it
    in.


    | #include <sys/types.h>#include <sys/stat.h>int mkfifo(const char *filename,
    mode_t mode); |


    This makes a FIFO with a filename and a mode you specify. Modes are important.
    You simply cannot use O_RDWR. It is unnecessary in the first place and secondly
    the results are undefined. Suppose I upload a video online and go out on a trek
    where there is no internet access. I ask my friend to keep track of the views.
    After 2 days, I call him from an old fashioned landline, and if the views are
    0, he will block my call so as to not make me feel gloomy on the trek. If I call
    him an hour later, he will still block me. But if there is 1 view, he will answer
    the call and tell me the good news. If it’s a friend, I can’t enforce him to give
    me the report even if it’s 0 views. However, if I employ an assistant from the
    film industry, and pay him, he will tell me there are 0 views. Of course, he will
    lose respect for me and look for employment elsewhere, but that’s besides the
    question. I can enforce a O_NONBLOCK on  him. In the context of open when you
    pipe the mode, either O_RDONLY or O_WRONLY with O_NONBLOCK,


    | open(const char *path, O_RDONLY); |


    The open call will block; it will not return until a process opens the same FIFO
    for writing.” said Lingaraj.


    “So, it’s like your friend blocking your call until there are views on your video.”
    said Seema. Lingaraj continued.


    “


    | open(const char *path, O_RDONLY &#124; O_NONBLOCK); |


    The open call will now succeed and return immediately, even if the FIFO has not
    been opened for writing


    by any process.”


    “So, the employee who doesn’t block your calls.” said Seema.


    | open(const char *path, O_WRONLY); |


    In this case, the open call will block until a process opens the same FIFO for
    reading. I don’t have an analogy for this.” admitted Lingaraj.


    “Your friend is excited to tell you that there is a view, but your phone is not
    reachable.” offered Seema.


    “Sounds okay. The next one though is a bit strange.


    | open(const char *path, O_WRONLY &#124; O_NONBLOCK); |


    What do you think this will do?” asked Lingaraj.


    “The employee, because it is O_NONBLOCK calls you as soon as there is a view and
    shares the ‘good news’ as you call it.” said Seema.


    “Despite me being not reachable? Actually wrong. It returns immediately, but if
    no process has the FIFO open for reading, open will return'
