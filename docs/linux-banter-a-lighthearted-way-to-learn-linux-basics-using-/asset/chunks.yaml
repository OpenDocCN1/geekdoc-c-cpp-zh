    \ for a regular file.\n\n```bash\n$ find . \\( -name \"*ti\" -o -newer Seema \\\
    ) -a -type f -print\n```\n\n“It finds all the files ending with ‘ti’ or files\
    \ newer than `Seema` and must be a regular file as pointed out by `f` and then\
    \ print. The backslash `\\` before the bracket is an escape character. \n\nYou\
    \ have seen how to find with filenames, but what about searching inside the files?\
    \ You have the `grep` command.\n\nMy great grandfather, as I told you made a lot\
