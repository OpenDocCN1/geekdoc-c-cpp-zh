- fmt: "\n`sem_open()` creates a new POSIX semaphore or opens an existing semaphore.\
    \ The semaphore is identified by name. It returns the address of the semaphore.\n\
    \n```c\n#include <semaphore.h>\nint sem_destroy(sem_t * sem);\n```\n\nThis destroys\
    \ the semaphore as the name of the function suggests. It also tidies up resources.\n\
    \nComing back to the light on-off parallel. A fussy film star waiting, would keep\
    \ asking the director to check for the status of the light if he’s outside and\
    \ the doctors are inside. This won’t be encouraged and the actor will be kicked\
    \ out of the sets, film star or not. When it turns off, the team will know. Because\
    \ the program is always on the lookout for that. Like these people who are always\
    \ on the lookout for a discount or a free coupon.\n\nSo, to program, you could\
    \ start a thread with `pthread`. That will keep running. You create a semaphore\
    \ and you tell the kernel, what happens when the semaphore value is `0`. This\
    \ starts a routine. You can tell what happens when the semaphore has a value.\
    \ But you don’t have to tell the program, keep looking for the variable and check\
    \ whether it goes to `0` or whether it is positive in the program. It’s the job\
    \ of the system. Let’s modify the program naming it `thread_sem_program.c`, this\
    \ time with semaphores. Be sure to include `semaphore.h`.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <string.h>\n#include <pthread.h>\n#include <unistd.h>\n\
    #include <semaphore.h>\nsem_t semap1;\nvoid *print_func(char* message){\n    sem_wait(&semap1);\n\
    \    printf(\"%s - Before sleep\\n\", message);\n    sleep(4);\n    printf(\"\
    %s - After waking up\\n\", message);\n    sem_post(&semap1);\n}\nint main(){\n\
    \  sem_init(&semap1,0,1);\n  pthread_t t1, t2;\n  printf(\"I am in main\\n\");\n\
    \  int iret1 = pthread_create(&t1, NULL,(void *) print_func, (void *) \"First\
    \ Instance\");\n  int iret2 = pthread_create(&t2, NULL, (void *) print_func, (void\
    \ *) \"Second Instance\");\n  pthread_join(t1, NULL);\n  pthread_join(t2, NULL);\n\
    \  sem_destroy(&semap1);\n  printf(\"Back to main after thread join\\n\");\n}\n\
    ```\n\nI will run it like this:\n\n```bash\ncc -D_REENTRANT thread_sem_program.c\
    \ -lpthread -lrt\n```\n\nThe output again, is:\n\n```\nMain program now running\n\
    First Instance - Before sleep\nFirst Instance - After waking up\nSecond Instance\
    \ - Before sleep\nSecond Instance - After waking up\nBack to main after thread\
    \ join\n```\n\nHow is Vijay doing now?”\n“He doesn’t remember a few things about\
    \ how we spent time with each other.”\n“The keyboard that you speak of, does he\
    \ hand it over to anybody and everybody to let himself be programmed?”\n“You are\
    \ making me anxious.”\n“Then you better learn fast.”\n“Thanks for understanding.\
    \ I need a couple of days break. I need to see Vijay.”\n“Sure.”\n\nSeema called\
    \ the same cab driver and left for Bangalore. She came back after a couple of\
    \ days and walked into Lingaraj’s house.\n\n“How was your trip?” asked Lingaraj.\n\
    “It was nice to see him, he’s changed for the better. But he’s become secretive,\
    \ I feel. What did you do?” she asked Lingaraj.\n“I posed at the edge of a cliff\
    \ to take a selfie when a strong gust of wind….”\n“He hardly notices I am there.\
    \ He keeps calculating football moves and tells their outcome beforehand.” Seema\
    \ interrupted.\n“That’s awesome!”\n\nSeema stared at Lingaraj. Lingaraj looked\
    \ away and continued.\n\n### Thread Attributes\n\nYou throw a party and you arrange\
    \ for cooks and bartenders to the party. Some of your friends might have come\
    \ with their drivers, some by a cab and some running. There are people like that.\
    \ After the party is over, your friends go back. You would want to know if a friend\
    \ reached home. So, you call her and find out whether she reached home safe. Now,\
    \ the cook who had come, you won’t call him to find out if he reached home safely.\
    \ More so, if the prepared food was not good and you find out he had also partaken\
    \ of some drinks without your permission.\n\nSo, if you imagine these two going\
    \ back home processes to be threads, one is an attached thread and the other is\
    \ a detached thread. So, to a thread you can specify attributes that tell it to\
    \ behave in a particular way. This is the list:\n\n```c\n#include <pthread.h>\n\
    int pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);\nint pthread_attr_getdetachstate(const\
    \ pthread_attr_t *attr, int *detachstate);\nint pthread_attr_setschedpolicy(pthread_attr_t\
    \ *attr, int policy);\nint pthread_attr_getschedpolicy(const pthread_attr_t *attr,\
    \ int *policy);\nint pthread_attr_setschedparam(pthread_attr_t *attr, const struct\
    \ sched_param*param);\nint pthread_attr_getschedparam(const pthread_attr_t *attr,\
    \ struct sched_param*param);\nint pthread_attr_setinheritsched(pthread_attr_t\
    \ *attr, int inherit);\nint pthread_attr_getinheritsched(const pthread_attr_t\
    \ *attr, int *inherit);\nint pthread_attr_setscope(pthread_attr_t *attr, int scope);\n\
    int pthread_attr_getscope(const pthread_attr_t *attr, int *scope);\nint pthread_attr_setstacksize(pthread_attr_t\
    \ *attr, int stacksize);\nint pthread_attr_getstacksize(const pthread_attr_t *attr,\
    \ int *stacksize);\n#include <pthread.h>\nint pthread_attr_init(pthread_attr_t\
    \ *attr);\nint pthread_attr_destroy(pthread_attr_t *attr);\n```\n\nThe first function\
    \ initializes the thread attribute and the second will destroy it.\n\n“You created\
    \ the thread and so soon you need it.”\n“Probably a thread de you destroying the\
    \ thread object.”\n\n```c\nint pthread_attr_setdetachstate(pthread_attr_t *attr,\
    \ int detachstate);\n```\n\nIt has two arguments, the attribute object pointer\
    \ and the `detachstate`. In the flag you can specify:\n- `PTHREAD_CREATE_JOINABLE`:\
    \ This is the default, where you have to call the thread to join.\n- `PTHREAD_CREATE_DETACHED`:\
    \ This is where you don’t call the thread join.\n\n“So you will never find out\
    \ if the cook reached home or not.”\n\n```c\nint pthread_attr_getdetachstate(const\
    \ pthread_attr_t *attr, int *detachstate);\n```\n\nThis tells you the current\
    \ state of the thread. Note that the `int detachstate` was something you specified.\
    \ Here, you are specifying a pointer in which will be returned the value of the\
    \ current state.\n\n“Whether a thread can be pre empted by an other thread or\
    \ not.”\n\n“No equal treatment.”\n\n“If there is a mutex lock on one resource,\
    \ you can schedule which thread gets the resource, in case multiple threads are\
    \ running, once the mutex is unlocked.”\n\nThe second function returns the state\
    \ in `*policy`.\n\n```c\nint pthread_attr_setschedparam(pthread_attr_t *attr,\
    \ const struct sched_param*param);\nint pthread_attr_getschedparam(const pthread_attr_t\
    \ *attr, struct sched_param *param);\n```\n\nThis allows you to control the scheduling\
    \ of threads running with schedule policy `SCHED_OTHER`.\n\n```c\nint pthread_attr_setinheritsched(pthread_attr_t\
    \ *attr, int inherit);\nint pthread_attr_getinheritsched(const pthread_attr_t\
    \ *attr, int *inherit);\n```\n\nThis only means whether a new thread’s scheduling\
    \ is set by the attributes or whether the scheduling is inherited from the thread\
    \ that created it. This can take two values:\n- `PTHREAD_EXPLICIT_SCHED`\n- `PTHREAD_INHERIT_SCHED`\n"
