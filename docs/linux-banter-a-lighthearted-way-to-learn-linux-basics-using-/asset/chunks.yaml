    They reached the place and as the driver switched off the engine, a solitary man
    of around 28 came dressed wearing a T-shirt that had the words, “Legendary is
    overrated.”


    ![](image_rsrc82M.jpg)


    Seema was relieved to see him because it was getting dark and there was no one
    around.


    “You are Lingaraj, I presume. I am Seema.” Seema introduced herself.


    “Yes.” replied Lingaraj.


    ![](image_rsrc82N.jpg)


    “My fiance Vijay has imbibed machine consciousness. I came to you for help.”


    “Yes, the doctor told me. And we thought the problem one day would be machines
    imbibing human consciousness.”


    “So, when do we start?”


    “Well, you both have had a tough journey. Rest and we shall start tomorrow.”


    “I will go back to Bengaluru, Sir” said the driver.


    ![](image_rsrc82P.jpg)


    “Nobody is going to know where you will go if you leave from here, least of all,
    yourself. Do as I say. Have a nice dinner here and go back tomorrow.” said Lingaraj.


    The cab driver agreed.


    Lingaraj asked them to park the car and they walked towards their camp.


    ![](image_rsrc82R.jpg)


    Their camp was set in a large clearing and they had built eco-friendly houses
    for themselves. Some houses were in groups and some were set apart from the rest.
    Seema was shown into her private house and the driver was shown Lingaraj’s house.


    ![](image_rsrc82S.jpg)


    Seema freshened up and sat on the porch outside. The atmosphere was very serene
    and crickets stridulated. There were a lot of birds chirping and she was lost
    in it for a while.


    ![](image_rsrc82T.jpg)


    Then, Lingaraj and Manjunath came to where she was. Lingaraj offered her dinner
    made of sprouts and some healthy sandwiches. Seema tried to bring up the issue
    of Vijay, but Lingaraj was busy telling jokes to the cab driver Manjunath.


    ![](image_rsrc82U.jpg)


    After they had finished, Lingaraj told her classes would start the next day at
    9.


    Seema went to her home and slept immediately. She dreamt of Vijay and she taking
    a walk in the forests.


    ![](image_rsrc82V.jpg)


    The next day, Seema woke up and went to Lingaraj’s house. The driver had already
    left by then. Lingaraj then showed her a box full of supplies for food and asked
    Seema to take them to her house in the evening, after the class. She could notice
    millets and fruits with small mud containers with masalas in them. Then Lingaraj
    led her to the computer in his hall.


    ![](image_rsrc82W.jpg)


    Seema had not met anyone apart from Lingaraj during the whole time and asked him
    about it. Lingaraj said most of the people had gone on a trek.


    ![](image_rsrc82X.jpg)


    “Let’s begin.” said Lingaraj. “You need to be able to talk to the machine. Now,
    talk to this machine.” said Lingaraj showing his laptop which was being charged.
    It had many cables sticking out of it.


    ![](image_rsrc82Y.jpg)


    “Hi computer, will you be friends with me?” said Seema.


    “That won’t work.”


    Seema thought a lot. Then she took out her hairband, loosened her hair and promptly
    proceeded to join her hair with the computer wires.


    ![](image_rsrc82Z.jpg)


    “That won’t work too. If it worked, people would queue up outside ATMs and plead
    with the ATM to understand their plight and give them money.” said Lingaraj.


    “Then what do I do? I am not a software engineer, I am a geography expert.” said
    Seema with desperation.


    “You need to understand the system first. Then write programs to change the system
    or utilise it.”


    “There are primarily two ways to interact with this system, which is a Linux system.
    Shell programming and using a programming language. To make a program you need
    proficiency in a programming language like C. And to get the program to make sense
    to the system, you need a compiler. About C basics, you will learn parallelly
    on your own, but before that, we need to see what the system can offer.”


    “This system is a Linux system. Linux is a kernel and it’s being added to as we
    speak. A man called `Linus Torvalds` took the initiative to make software embody
    free spiritedness. He wrote the core of the Operating system. And Linux with contributions
    from all over the world is growing.” continued Lingaraj.


    ![](image_rsrc830.jpg)


    “To work with the system you need to log in. For which you need access.” he said
    further.


    “Okay. Vijay recognises me, so I have access.”


    “Yes, he has imbibed machine consciousness. You sure you want to change him back?”


    “He was so perfect. He used to satisfy my every whim. Got me flowers everyday.
    Used to sing for me. He always took my side in arguments.”


    “Are you sure he’s not acting like a machine now.”


    “What?”


    “None of my business. Anyway, once you get into the system you can use it. You
    can make it do tasks and execute your commands. So whether he reverts or not,
    it’s a win win situation for you.”


    “Please stick to teaching me.”


    “Just kidding. There are many distributions of Linux available, called flavours.


    To use a system, you need to program it as well. You can use `C`, `C++`, `Java`,
    `Python`.

