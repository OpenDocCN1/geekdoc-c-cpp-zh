    But we had a flight at 12 in the night and we didn’t want to miss the flight also.
    We got drunk and did not realise the passage of time.


    ![](image_rsrc84Z.jpg)


    At 11, it hit me that we had only an hour to catch the flight. I tried to look
    for my friends, but they had merged among the crowd. So I went on stage where
    the DJ was playing. There were about 300 people in there. I spoke to the DJ, but
    he couldn’t hear with the noise. So, I signalled him to stop the music. I was
    too high by then and I took the mic.


    ![](image_rsrc850.jpg)


    ‘People from Greaterthanall firm, we have a flight to catch at 12, so let’s leave
    from here.’


    Everybody started staring.


    ![](image_rsrc851.jpg)


    Then it hit me. That is why it is important to use gethostname().


    Moving on, let me show you this program. Works the same way as the program with
    the password file, except the structure from which we get the details from are
    different.


    compdetails.c


    | #include <sys/utsname.h>#include <unistd.h>#include <stdio.h>#include <stdlib.h>int
    main(){char machine[512];struct utsname comp_details;gethostname(machine, 511)uname(&comp_details);printf(“The
    machine host name is %s\n”, machine);printf(“The System is %s on %s hardware\n”,
    comp_details.sysname, comp_details.machine);printf(“The nodename of the machine
    is %s\n”, comp_details.nodename);printf(“The version is %s, %s\n”, comp_details.release,
    comp_details.version);exit(0);} |


    Now, logging.


    | #include <syslog.h>void syslog(int priority, const char *message, arguments...);
    |


    It’s a log message. But future civilisations might see it as history and try to
    recreate the ethos of the age based on your unique case alone. It’s something
    like a diary, except action about where these messages go is taken depending on
    the priority. The options for priority are these.


    | LOG_EMERG |


    | LOG_ALERT |


    | LOG_CRIT |


    | LOG_ERR        |


    | LOG_WARNING |


    | LOG_NOTICE |


    | LOG_INFO |


    | LOG_DEBUG |


    | void openlog(const char *ident, int logopt, int facility); |


    If you want to ‘customise’ the way the messages are logged, you can use this C
    library function.


    ‘ident’ is what you can prepend to messages, like “Seema’s activity was: ”.


    The facility parameter records a default facility value to be used for future
    calls to ‘syslog’.


    The ‘logopt’ parameter configures the behaviour of future calls to ‘syslog’.              


    | int setlogmask(int maskpri); |


    setlogmask is used to control the priority of the log messages.


    See the following program.


    logmesg.c


    | #include <syslog.h>#include <stdio.h>#include <stdlib.h>#include <dirent.h>int
    main(){DIR *dir_type_ptrdir_type_ptr = opendir(“Nonexisting_dir”);if (dir_type_ptr
    = NULL){syslog(LOG_ERR&#124;LOG_USER,“Tried to open a non existing directory.\n”);exit(0);}}
    |


    If run, this program will write the message to the file /var/log/syslog file.
    You can open and see after you run the program.”


    Resources and limits


    Lingaraj began speaking.


    “A program, a set of system calls to set limits on others who are using Vijay’s
    resources and set your priorities on him. Would you like that?”


    “Vijay is a grown man, a machine or not, he can decide for himself. But yes, I
    would like to learn these calls.”'
