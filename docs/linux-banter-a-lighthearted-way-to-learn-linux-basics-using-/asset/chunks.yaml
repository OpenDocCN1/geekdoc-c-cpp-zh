    ## Sockets


    “You can talk to yourself in the context of preparing for an interview. I did
    that once to prepare well for an interview. I used to simulate the interview panel,
    consisting of three gentlemen inside my head and used semaphores, pipes and message
    queues to communicate with them. And shared memory when I was too lazy to answer.
    I once got into a bus which was empty except for me and the conductor asked for
    the number of tickets. I said 4 including the interview panel inside my head.”


    ![](image_rsrc85H.jpg)


    “Oh my God! How did you get out of it?”


    “Oh, the people in the interview panel I was imagining were very old. They eventually
    died one after the other. It was then that it stopped. Anyway, the point is, you
    need a different set of tools to communicate with others.


    Let’s talk about communication between two processes which are on different systems.
    Sockets. Of course, you can use sockets to communicate on the same system, but
    it is usually for communication between two systems. Which are connected.


    Once I was marooned on an island with a woman. This was due to a skydiving parachute
    malfunction. We both landed on the island. It was evening.


    I asked her,


    ‘Would you like to have dinner?’


    She was on the phone and engrossed in her social networking site.


    Then she looked up and said,


    ‘I don’t know you.’


    So I sent her a friend request which she accepted. Then she messaged me,


    ‘I have seen you somewhere.’


    ![](image_rsrc85J.jpg)


    So, you open a socket connection to deal with two different systems. There is
    a way to build a socket.


    Let me give you a context. My grandfather made a cocktail vending machine. It
    had 3 different dispensing outlets and additional features. The three different
    outlets were:


    1) For the actual drink. This drink varied depending on the customer’s story.
    If it was a financial crisis, it was a different drink, if it was about not being
    able to forgive people, it was a different drink, another drink for failed relationships
    and so on.


    2) For snacks. These were drink accompaniments and users had the option of low
    fat and guilt free.


    3) This was for personalised messages. My grandfather used to write a lot of quotes.
    One particular quote of his, I liked was. “Don’t bother about how little money
    you made, you are still biodegradable.” So, the appropriate message depending
    on the customer’s situation was handed out.


    Each of these vending slots were named by attaching a sticker which had a number
    above them and they were also accompanied by a slot for putting coins. Of course,
    nothing was free and if you wanted just a message and no drinks, you could pay
    for that alone and get it. ”


    So, if I have to give you a parallel.


    These dispensing slots, when he made them, were called ports. One for the drink,
    one for the snack and the other for messages.


    He then had to organize. He had to decide some technicalities about how he was
    going to serve his drinks, whether he had to pour it, or offer it in small packets.


    It was his idea of providing service to others and also make money.


    He was an active man and did not believe in passive income, more so because he
    wanted to listen to stories of others. So, he didn’t automate the process. He
    used a notebook to assign the number of the port, the technicalities and the location
    of where the cocktail vending machine was placed. This made a package, the port
    number, the technicalities and the address. He called this package, a socket.
    Though we are talking about only one machine and you might question the need of
    the address, but he had plans to expand.


    ## Technical Details


    Each of these dispensers had a button associated with them. When a new customer
    came and pressed a button, he would look outside and show his ear indicating that
    he had listened. During evenings, a lot of customers would come.


    Now, my grandfather is listening and is ready. A customer cannot walk in and start
    telling his sob stories. He has to put a coin first, in the relevant slot for
    the coin next to the dispensing outlet. My grandfather will then see the coin,
    and at a glance verify it’s authenticity.


    After the acceptance, my grandfather would write a number to tell the customer
    that his connection is now accepted. On the client’s side, the client needed to
    have awareness of what he needed, whether he needed a drink or a message at which
    port they were supplied.


    Let’s look at some system calls.


    ```

    #include <sys/types.h>

    #include <sys/socket.h>

    int socket(int domain, int type, int protocol);

    ```


    A socket is something like a file descriptor.


    The domain can be either `AF_INET` or `AF_UNIX` or others which we won’t go into.
    `AF_INET` is used in networking as well as the internet.


    Type is whether the socket is a stream of data, `SOCK_STREAM` or a datagram, `SOCK_DGRAM`.
    `SOCK_DGRAM` was like my first message asking the girl on the island whether she
    would like to have dinner. There is no guarantee whether the message will be received.
    But it’s convenient. Datagrams are implemented in `UDP/IP` and they are unreliable.


    The protocol can be either `TCP/IP` or `UDP/IP`. If you are using a stream, you
    have to use `TCP/IP` which assures sequencing, flow control, and retransmission,
    enabling large data transfers being received with all of the data. An error provision
    also exists. It is a reliable way to communicate with a guaranteed response. Unless
