  trans: "\n让我给你说一个场景。当我叔叔是一名医生，在他私立医院的手术室里，他们会把门锁上以防手术正在进行。一旦手术结束，他们就会通过解锁门来打开门。\n\
    \n如果门没锁上，电影剧组就会进去拍摄视频，因为那是唯一一个有大灯的房间。在他们进行期间，他们会把门锁上。工作完成后，剧组通常会解锁门。\n\n让我们来聊互斥线程（mutually\
    \ exclusive threads）。它们是什么？它们是能够被阻塞的资源。例如，如果你和 `Vijay` 在一起，而他一直被足球赛分散注意力，你该如何阻塞他的资源，让无论是足球赛还是摔跤都无法吸引他的兴趣呢？”\n\
    \n“简单，我会对他使用一个互斥线程程序。”Seema 正在进行研究，而且速度很快。\n\n“简单？祝你好运吧，那不是因为互斥程序很难，而是要把他的注意力从足球中夺回来很难。mutex\
    \ 是 mutually exclusive 的缩写，它会锁定代码的临界区域，使得锁定程序在其他人尝试之前先完成操作。记得‘锁锁拉什什曼’（Lock Lakshman）吗？”Lingaraj\
    \ 展示了一个 C 库函数。\n\n```c\n#include <pthread.h>\nint pthread_mutex_init(pthread_mutex_t\
    \ *mutex, const pthread_mutexattr_t*mutexattr);\n```\n\n初始化一个互斥锁 `*mutex`，它基于线程函数。\n\
    \n`const pthread_mutexattr_t *mutexattr` 这需要一些解释。留以后以后说。\n\n```c\nint pthread_mutex_lock(pthread_mutex_t\
    \ *mutex));\n```\n\n这锁定了资源。\n\n```c\nint pthread_mutex_unlock(pthread_mutex_t\
    \ *mutex);\n```\n\n这解锁了资源。\n\n```c\nint pthread_mutex_destroy(pthread_mutex_t\
    \ *mutex);\n```\n\n这将销毁互斥锁并进行清理。\n\n“让我们进入程序吧。”\n\n“好的。”\n\n“互斥程序。在那之前，是我们讨论过的线程程序。\n\
    \n`thread_program .c`\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n#include <pthread.h>\n#include <unistd.h>\nvoid *print_func(char*\
    \ message){\n   printf(\"%s - Before sleep\\n\", message);\n   sleep(4);\n   printf(\"\
    %s - After waking up\\n\", message);\n   }\nint main(){\n  pthread_t t1, t2;\n\
    \  printf(\"Main program now running\\n\");\n  pthread_create(&t1, NULL, (void\
    \ *)print_func, (void *) \"First call to pthread\");\n  pthread_create(&t2, NULL,\
    \ (void *)print_func, (void *) \"Second call to pthread\");\n  pthread_join(t1,\
    \ NULL);\n  pthread_join(t2, NULL);\n  printf(\"Back to main after thread join\\\
    n\");\n}\n```\n\n输出结果为：\n\n```\nMain program now running\nFirst call to pthread\
    \ - Before sleep\nSecond call to pthread - Before sleep\nFirst call to pthread\
    \ - After waking up\nSecond call to pthread - After waking up\nBack to main after\
    \ thread join\n```\n\n正如之前解释的那样，并没有同步性。我们使用互斥线程。回到程序，现在加上了互斥锁。\n\n`thread_with_mutex.c`\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include\
    \ <pthread.h>\n#include <unistd.h>\npthread_mutex_t mutex1 = PTHREAD_MUTEX_INITIALIZER;\n\
    void *print_func(char* message){\n   pthread_mutex_lock(&mutex1);\n   printf(\"\
    %s - Before sleep\\n\", message);\n   sleep(4);\n   printf(\"%s - After waking\
    \ up\\n\", message);\n   pthread_mutex_unlock(&mutex1);\n   }\nint main(){\n \
