    the signal once.


    There are other flags too which are available in the man pages.  


    ‘oact’ is a location which will hold the previous signal action that was made.


    | #include <signal.h>int sigaddset(sigset_t *set, int signo);int sigemptyset(sigset_t
    *set);int sigfillset(sigset_t *set);int sigdelset(sigset_t *set, int signo); |


    These are C library functions. You can tell the program to specifically deal with
    one signal at a time or make a broad policy to deal with signals. So, you can
    make a set of all these signals and specify what to do. Also, there might be situations
    where your program is working on a signal received and another signal comes. So,
    you might need to suspend the function of this and kill the process. No need of
    confusion. You can handle all these signals using a signal set.


    The signal set is of the type


    sigset_t


    So, you can fill your signal set with all the available signals through the sigfillset()
    C library function. Likewise, you can empty the set of all signals using the sigemptyset()
    C library function.


    You can add individual signals to a set by specifying their numbers through sigaddset()


    And you can delete individual signals from a set by specifying their numbers through
    sigdelset()


    Also, you can find out if a signal is a member of a set by enquiry.


    | int sigismember( const sigset_t *set, int signum) |


    This returns 1 if the signal is a member of the set, 0 if it’s not and -1 on error.


    | #include <signal.h>int sigprocmask(int how, const sigset_t *set, sigset_t *oset);
    |


    The above system call is to change the process signal mask. If a signal is blocked
    by a process, it won’t be delivered, but will remain pending. A program can determine
    which of its blocked signals are pending by calling the C library function sigpending.


    | #include <signal.h>int sigpending(sigset_t *set); |


    This system call writes a set of signals into the signal set pointed to by set,
    that are blocked from delivery.. It returns 0 if successful, otherwise, -1 with
    errno set to indicate the error.


    | #include <signal.h>int sigsuspend(const sigset_t *sigmask); |


    The sigsuspend system call replaces the process signal mask with the signal set
    given by sigmask and then suspends execution. It will resume after the execution
    of a signal handling function.


    Let’s look at a program that uses sigaction.


    ayyo.c


    | #include <signal.h>#include <stdio.h>#include <unistd.h>void ctrlc(int sig){   
    printf("I advise you not to stop me, %s\n", getlogin());}void shutdown_req(int
    sig){    printf("I am process %d and I know who is trying to kill me. It''s you,
    %s\n", getpid(), getlogin());}/*void finish(int sig){    printf("This function
    is pretty useless because it is trying to handle a SIGKILL signal.\n");}*//*We
    declare the above three functions, one each for a particular signal, SIGINT, SIGTERM
    and SIGKILL. The function that handles SIGINT, ayyo works only once Ctrl+C is
    pressed because we have used the SA_RESETHAND flag. We print the relevant message
    and that is all this function does. */int main(){    struct sigaction act;    act.sa_handler
    = ctrlc;    sigemptyset(&act.sa_mask);act.sa_flags = SA_RESETHAND;    sigaction(SIGINT,
    &act, 0);    act.sa_handler = shutdown_req;    sigemptyset(&act.sa_mask);    act.sa_flags
    = 0;    sigaction(SIGTERM, &act, 0);/* This is irrelevant because a SIGKILL will
    kill the process immediately and it cannot be handled.      act.sa_handler = finish;    sigemptyset(&act.sa_mask);    act.sa_flags
    = 0;    sigaction(SIGKILL, &act, 0);    *//*Then the handler function is specified
    and the signal set, sa_mask is made empty. We don’t want any signals to block.
    Because anything you put here will not be delivered to the process. The flags
    whether SA_RESETHAND is needed is specified. In the first case, SA_RESETHAND is
    specified, which means the signal will be handled only once because the signal
    is not reset. If you want it to work every time, you need to reset the signal
    by including SA_RESETHAND.*/  while(1) {  printf("I am happy in my world!\n");  sleep(1);  }}/*This
    is the main part where the program keeps on printing in an infinite loop until
    the signal is sent. */ |


    The output is:


    | I am happy in my world!I am happy in my world!I am happy in my world!I am happy
    in my world!I am happy in my world!I am happy in my world!I am happy in my world!I
    am happy in my world!I am happy in my world!^CI advise you not to stop me, Lingaraj!I
    am happy in my world!I am happy in my world!I am happy in my world!I am happy
    in my world!I am happy in my world!I am happy in my world!I am happy in my world!I
    am happy in my world!I am happy in my world!I am happy in my world!I am happy
    in my world!I am process 41620 and I know who is trying to kill me. It''s you,
    LingarajI am happy in my world!I am happy in my world!I am happy in my world!I
    am process 41620 and I know who is trying to kill me. It''s you, LingarajI am
    happy in my world!I am happy in my world!I am happy in my world!I am happy in
    my world!^C |


    So, you see for the second Ctrl+C, it got killed whereas for the SIGTERM process,
    it used the handler everytime.


    Tomorrow, we will go to this exciting place.” said Lingaraj and finished the session.
    Seema went and called the doctor. There was a change in Vijay’s disposition and
    he was showing human like tendencies and Seema was convinced that he would come
    back to normal soon.


    Threads and mutex


    The next day, they took an 8 mile hike. They passed wonderful streams, waterfalls,
    through foliage and over cliffs without meeting a single person.


    ![](image_rsrc858.jpg)


    They finally reached a small settlement where a few people were making threads.


    “I brought you here to set up the context. Today, we will talk about threads.”


    “Are you out of your mind? I am really worried and trying to get back to Vijay
    at the earliest and you are behaving like ceremony Seena.” said Seema with anger
    in her voice. After a while, Seema apologised. Lingaraj didn’t seem like he was
    hurt. He spoke.


    “A thread is an execution slice.”


    “I don’t understand.”


    “I opened a hotel once. I used to get orders from Mysore and sometimes Hubli.
    So I used to set up a small operation there whenever the order came. I used to
    go there and cook. But the orders kept pouring in. So I started a franchise model
    and gave them to people in various districts of Karnataka. They used to inherit
    my model of work. Until one fateful day.”


    This was the thing about Lingaraj Seema had noticed. He had to tell his life experiences
    whether he was the hero of it or not. Most of the times, he was not. Lingaraj
    continued with his story.


    “I had given a franchise in Hubli. I had to meet this woman for a marriage alliance.
    That day, I received a complaint from a person that the food in my particular
    franchise in Hubli was not up to standards. I went to the franchise with my fiance
    the next day itself. I wanted to show off my fiat. I told the guy who had purchased
    the franchisee from me that a person had complained the food was bad and that
    I wanted to inspect. I asked them to bring the food. They brought me the food.
    I asked my fiance Nagashree to eat the food. We both ate, after we had eaten,
    I told the hotel manager, “The food is good, but there’s some smell.”


    So the manager replied, ‘Sir you had a problem with yesterday’s food. So we got
    you yesterday’s food.’” finished Lingaraj.


    “Phew! Man you have so much of history.”'
