    int pthread_attr_getinheritsched(const pthread_attr_t *attr, int *inherit);\n\
    ```\n\n这意味着新线程的调度是由属性设置的还是从创建它的线程继承。这可以取两个值：\n- `PTHREAD_EXPLICIT_SCHED`\n- `PTHREAD_INHERIT_SCHED`\n\
    \n"
