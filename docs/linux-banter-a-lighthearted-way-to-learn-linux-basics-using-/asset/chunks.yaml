    `Because of a lock by another process.`\n`The details including the process number\
    \ of the locking process are:`\n`l_type 1, l_whence 0, l_start 40, l_len 10, l_pid\
    \ 34974`\n`Testing for exclusive lock on region from 45 to 50`\n`No opportunity\
    \ to lock exists by the process : 34980`\n`Because of a lock by another process.`\n\
    `The details including the process number of the locking process are:`\n`l_type\
