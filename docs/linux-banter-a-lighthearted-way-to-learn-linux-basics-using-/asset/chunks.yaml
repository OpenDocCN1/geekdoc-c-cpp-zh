- fmt: "\nSeema had never heard such nonsense in her life. But Lingaraj made it sound\
    \ so convincing.\n\n“Let’s move on.” said Seema.\n\n“You can use system calls\
    \ or C library functions. System calls are expensive.”\n\n“Expensive in what sense?”\n\
    \n“There was this guy called `Ceremony Seena`. Every time we used to call him,\
    \ he used to come with a caravan and a retinue. And there was this huge ritual\
    \ to invite him and protocol to receive him.\n\nHe lived on the main road that\
    \ connected all the roads. His entourage would block the roads for hours. He was\
    \ a well connected man who was in touch with people in the higher echelons of\
    \ power. If a message needed to be passed to those powerful people, people had\
    \ to speak to him. But whenever anybody called him, he would make a pompous ceremony.\
    \ And we had to feed him, feed his followers etc. We had to make the switch between\
    \ doing our work and looking after him. Overheads. So, later people devised these\
    \ approaches where they called him once and finished with all the jobs. System\
    \ calls are like calling `Seena`. Very expensive. But having people work out the\
    \ details and finish all his jobs, it’s like high level access. So, we have C\
    \ library functions for these.\n\nAn example is the standard I/O library. You\
    \ might have data storage that deals with blocks of data. The standard I/O library\
    \ makes the data to be sent to the storage, tailor made even if it’s a file that’s\
    \ not used to writing in blocks of data.\n\nSo, how do you find out whether a\
    \ call is a system call or a function?\n\nC library functions are described in\
    \ section 3 of the man pages. The section 2 is for system calls.\n\nSo, if you\
    \ type\n\n```\n$ man 2 fopen\n```\n\nIt says\n\n```\nNo manual entry for fopen\
    \ in section 2\n```\n\nHowever, if you type\n\n```\n$ man 3 fopen\n```\n\nIt shows\
    \ the entry of `fopen`.\n\nFor the rest of the time, I use the phrase ‘C library\
    \ function’ and the word ‘function’ for C library functions. For a function within\
    \ the program, like a routine, I use just function. You have to identify whether\
    \ I am talking about a C library function or a routine.\n\n“File descriptors.\
    \ You so badly want to open some files in Vijay’s system.”\n\n“And write to them.”\n\
    \n“You need file descriptors for that.”\n\n“What’s a file descriptor?”\n\n“It’s\
    \ an integer associated with a file. And how is it different from an `inode`?\
    \ An `inode` is a structure that has info about the files. A file descriptor is\
    \ used in system calls. It is used by the system to refer to an open file.”\n\n\
    He then showed her a program.\n\n`writestd.c`\n\n```c\n#include <stdio.h>\n#include\
    \ <unistd.h>\n#include <stdlib.h>\nint main(){\n    if ((write(1, “Standard output’s\
    \ file descriptor is 1”, 38)) != 38)\n        write(2, “Error writing to even\
    \ standard output.”,39);\n    exit(0);\n}\n```\n\nWhat the above program does\
    \ is, tries to write the first message indicated by `write`, “Standard output’s\
    \ file descriptor is 1” to the standard output whose file descriptor is 1. The\
    \ string has 38 characters excluding the double quotes. It returns the number\
    \ of bytes written. One byte per character. If all the bytes weren’t written,\
    \ then it moves to the next line and prints the error message, “Error writing\
    \ to even standard output.” to standard error, whose file descriptor is 2. The\
    \ file descriptor for standard input is 0.\n\n`readinp.c`\n\n```c\n#include <stdio.h>\n\
    #include <unistd.h>\n#include <stdlib.h>\nvoid main(){\n    printf(“Please input\
    \ some text.\\n”);\n    char readinp[128];\n    read (0, readinp, 17);\n    printf(\"\
    %s\", readinp);\n}\n```\n\nThe above program reads 17 characters from standard\
    \ input which happens when you type after running the program. Then it promptly\
    \ prints the first 17 characters of what you typed. So, the syntax for the `read`\
    \ and `write` system calls are :\n\n```c\n#include <unistd.h>\nsize_t read(int\
    \ fildes, void *buf, size_t nbytes);\n#include <unistd.h>\nsize_t write(int fildes,\
    \ const void *buf, size_t nbytes);\n```\n\nThe `<unistd.h>` is a header file.\
    \ A header file contains declarations and macros. It does not contain implementations\
    \ unlike a library which can do a job. It simply calls functions that do a job.\
    \ You might have wondered in some organisations, there are heads who don’t do\
    \ any work, but know people, especially those who study in libraries, who can\
    \ work, even though the heads themselves know nothing about implementation. I\
    \ said this only to help you remember. You can write your own header file, but\
    \ if you want to include it, you use\n\n```c\n#include “myheaderfile.h”\n```\n\
    \nAlso, let me talk about system calls. The kernel is not freely available to\
    \ one and everybody. It is quite reserved having allocated a part of it for users\
    \ to utilise the system. But sometimes you need the kernel for some operations.\
    \ They could be process control, file or device management etc. The user cannot\
    \ have the audacity to alter these things on his own. He needs to request the\
    \ kernel for support and the kernel, with it’s rules allows the program to work\
    \ on the operations. So, the mode is called supervisor mode or kernel space because\
    \ it involves the kernel’s supervision.\n\nEach system call, `read` or `write`,\
    \ returns the number of bytes read. `filedes` is the file descriptor. `buf` is\
    \ the character string which you have to declare beforehand and `nbytes` is the\
