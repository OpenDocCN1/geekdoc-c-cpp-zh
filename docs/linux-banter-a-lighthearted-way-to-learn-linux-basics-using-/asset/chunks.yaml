    \ directory.” Seema answered.\n\n“So,\n\n```bash\n$ find / -name Seema -print\n\
    ```\n\nwill print all the files named `Seema` in the system.”\n\nThese are a few\
    \ options.\n\n### `-atime N`\n`N` here is a number. The file was last accessed\
    \ `N` days ago. When you know when Vijay last accessed a particular file to give\
    \ you a parallel.\n\n### `-mtime N`\nThe file was modified `N` days ago.\n\n###\
    \ `-name pattern`\nThe name of the file, excluding any path, matching the pattern\
    \ provided. To ensure that the pattern is passed to `find`, and not evaluated\
    \ by the shell immediately, the pattern must always be in quotes.\n\nAn example\
    \ would be:\n\n```bash\nfind . -name \"*ma\" -print\n```\n\nWill print all files\
    \ ending with ‘ma’. Notice the dot. In the current directory. So, we learn that\
    \ the `*` is pretty handy if you don’t know any names. It’s a great tool to use\
    \ in marriage functions where some relatives come and ask you, “Remember who I\
    \ am?” If this were an accepted convention, people would say, you are ‘* uncle’\
    \ or ‘* aunt’ literally and they would be happy and we can move onto more valuable\
    \ pursuits like setting status messages.\n\nSince we are on this topic, if you\
    \ remember some part of the name like it has to be either Suresh or Ramesh, but\
