  trans: "\n\nLinux 系统中的一些常见限制：\n\n| `NAME_MAX` |\n| `CHAR_BIT` |\n| `CHAR_MAX` |\n\
    | `INT_MAX` |\n\n因此，为了尝试这些限制，你需要系统调用。\n\n```c\n#include <sys/resource.h>\nint\
    \ setpriority(int which, id_t who, int priority);\nint getrlimit(int resource,\
    \ struct rlimit *r_limit);\nint setrlimit(int resource, const struct rlimit *r_limit);\n\
    int getrusage(int who, struct rusage *r_usage);\nint getpriority(int which, id_t\
    \ who);\n```\n\n如你所知，`id_t` 是用于用户 ID 和组 ID 的特殊整数类型。`int which` 告诉该 ID 是用户 ID 还是进程\
    \ ID。`int priority` 是优先级值，一个 `-20` 到 `20` 之间的整数。默认值为 `0`。`rlimit` 是一个包含指针的结构体：\n\
    \n```c\nstruct rlimit {\n    rlim_t rlim_cur;\n    rlim_t rlim_max;\n};\n```\n\
    \n软限制（soft limit）你可以将其理解为会产生错误的限制，而硬限制（hard limit）则会导致程序终止。如果 Vijay 参加了很多，我猜你可以用这个来设置一个限制。让他只拥有有限的额度。\n\
    \n硬限制大于软限制。硬限制好比一个人可以喝多少酒。Prabhu 的硬限制是 `750` 毫升。但他妻子只允许他喝 `180` 毫升。这就是软限制。实施限制可能还有其他考虑，比如配给。其他人可能需要喝酒。你可以喝，但不敢喝。你可以喝，但非常小心。如果符合你的情况，硬限制和软限制就不重要了。只有超级用户（superuser）可以增加硬限制，就像医生可以增加容量一样。否则，普通用户只能减小软限制。\n\
    \n这些是对应的资源及其描述：\n\n| `RLIMIT_AS` |\n| `RLIMIT_CORE` |\n| `RLIMIT_CPU` |\n| `RLIMIT_DATA`\
    \ |\n| `RLIMIT_FSIZE` |\n| `RLIMIT_NOFILE` |\n| `RLIMIT_STACK` |\n\n`rusage` 结构包含更多成员，其类型同样为\
    \ `timeval`。它的成员是：\n\n```c\nstruct rusage {\n    struct timeval utime;\n    struct\
    \ timeval stime;\n};\n```\n\n```c\nint setpriority(int which, id_t who, int priority);\
    \ // 设置进程的优先级。\nint getpriority(int which, id_t who); // 返回优先级值。\nint getrlimit(int\
    \ resource, struct rlimit *r_limit); // 返回某个资源的限制值，如 RLIMIT_CPU 包含硬限制和软限制值。\n\
    int setrlimit(int resource, const struct rlimit *r_limit); // 设置软、硬限制的值。\nint\
    \ getrusage(int who, struct rusage *usage); // 提供进程消耗的用户时间和系统时间。\n```\n\n`who`\
    \ 选自：\n\n| `RUSAGE_SELF` |\n| `RUSAGE_CHILD` |\n\n### 数据管理\n\nLingaraj 说话了。让我们谈谈\
    \ Linux 是如何管理内存。虚拟内存是一种抽象。这意味着它被组织并使其看起来非常有规律且易于访问。\n\n```c\n#include <stdlib.h>\n\
    void *malloc(size_t size);\n```\n\n`size_t size` 的类型是 `unsigned long`。想象你城市里有一个仓库。Linux\
    \ 中的内存就像那个仓库。假设我想存储 `50` 公斤檀香，我在仓库里预订了 `10` 英尺乘以 `10` 英尺的空间。仓库管理员（我们叫他 Varadaraj\
    \ 吧）会把它存放在仓库里并给我收据。\n\nimage_rsrc852.jpg\n\n现在，我有 `10` 英尺乘以 `10` 英尺的空间存放檀香。我通常不会问他仓库内部物理空间的位置。如果我问，我可以查到，但并不一定要这样做。所以，这\
    \ `10` 英尺乘以 `10` 英尺就是你通过 `malloc()` 分到的内存数量。\n\n我不能在仓库的某个房间里放大象粪，然后问 Varadaraj\
    \ 隔壁放了什么。他会立即把我从系统中移除。我连大象粪都拿不回来。我不能写一个程序去查询程序不关心的其他内存地址。同样，我不能请求 `10` 英尺乘以 `10`\
    \ 英尺的空间，却要一个长 `12` 英尺的木鹿雕塑。所以我不能写一个尝试写入超出其分配的独立地址空间的程序。\n\n如果仓库很小，比如是一个初创公司，没有足够的空间处理额外订单，仓库管理员\
    \ Varadaraj 会把额外的物品带回家里存放。但当然，他不会告诉我。如果他对我的订单这么做了，当我要求提取时，我能发现送货需要更长时间。对硬盘驱动的使用被称为交换空间（swap\
    \ space）。\n\n如果他觉得某个物品一段时间不会被使用，他也会把物品移到家里。如果我去仓库向他要，他会再次从后面把它搬回仓库，给我一种它直一直在仓库里的印象。\n\
    \n调用 `malloc` 让 `malloc` 库能够管理内存。\n\n```c\n#include <stdlib.h>\nvoid free(void\
    \ *ptr);\n```\n\n这就像告诉仓库你已经用完了该空间，不再需要了。当然，在使用 `free` 之后，你不能再尝试访问该空间。\n\n```c\n\
    #include <stdlib.h>\nvoid *calloc(size_t number_of_elements, size_t element_size);\n\
    ```\n\n`calloc` 分配空间。`number_of_elements` 和 `element_size` 的类型都是 `size_t`。\n\n\
    ```c\nvoid *realloc(void *ptr, size_t size);\n```\n\n`realloc` 修改之前分配内存的大小。它返回指向更新内存的指针。\n\
    \n这应该很直观。我们来看看分配到底。Lingaraj 展示了一个程序。\n\n`memory_less.c`\n\nLingaraj 展示了程序：\n\n\
    ```c\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\nint main()\
    \ {\n    char *some_memory;\n    int exit_code;\n    some_memory = (char *)malloc(5);\n\
    \    if (some_memory != NULL) {\n        sprintf(some_memory, \"Will this be printed?\\\
    n\");\n        printf(\"%s\", some_memory);\n        exit_code = EXIT_SUCCESS;\n\
    \    }\n    exit(exit_code);\n}\n```\n\n输出不多，但它说明了由于我们只分配了 `5` 字节，它无法处理这个超过 `20`\
    \ 字节的长字符串。所以，我们这次修改了程序，分配了 `30` 字节。\n\n```\nmalloc(): corrupted top size\nAborted\
    \ (core dumped)\n```\n\n"
- fmt: "\nWhen the program ends or the file descriptor is closed, all locks are cleared.\n\
    \nDon’t use `fread` or `fwrite` during a file locking process. Use `read` and\
    \ `write`. This is because `fread` or `fwrite` buffers, that is places more bytes\
    \ to be read or written in the buffer.”\n\nThere is also this C library function:\n\
    \n```c\n#include <unistd.h>\nint lockf(int fildes, int function, off_t size_to_lock);\n\
    ```\n\nThe options for `function` are : \n\n- `F_ULOCK`\n- `F_LOCK`\n- `F_TLOCK`\n\
    - `F_TEST`\n\nThese locks are advisory in nature, that is programs have to have\
    \ the courtesy to check for locks and respect the lock.\n\nI will show you two\
    \ programs, one that locks a region of a data file, between so and so bytes and\
    \ the other that proceeds to see whether it can get a lock on that region. Firstly,\
    \ we will test for exclusive access. `lock_reg_ex.c`\n\n```c\n#include <unistd.h>\n\
    #include <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\nconst char *file_with_regions\
    \ = \"/tmp/test_lock\";\nint main() {\n    int fd;\n    int count;\n    char *fill_string\
    \ = \"Seema\";\n    struct flock region;\n    We make the important declarations\
    \ and also decide that the test file will be filled with “Seema”. We declare a\
    \ structure, `region` of the type `flock`, which will hold details about the locking,\
    \ unlocking or testing.\n\n    int res;\n    fd = open(file_with_regions, O_RDWR\
    \ | O_CREAT, 0666);\n    if (!fd) {\n        fprintf(stderr, \"Unable to open\
    \ %s.\\n\", file_with_regions);\n        exit(EXIT_FAILURE);\n    }\n    We open,\
    \ sensibly with `open` and not `fopen` for reasons I stated earlier.\n    for(count\
    \ = 0; count < 100; count++) {\n        (void)write(fd, fill_string, 1);\n   \
    \ }\n    We just fill it with the word “Seema”.\n\n    region.l_type = F_WRLCK;\n\
    \    region.l_whence = SEEK_SET;\n    region.l_start = 40;\n    region.l_len =\
    \ 10;\n    We use the `F_WRLCK` which is the write lock or the exclusive lock.\n\
    \n    printf(\"Process %d locking file\\n\", getpid());\n    res = fcntl(fd, F_SETLK,\
    \ &region);\n    We call `fcntl` for the opened file with file descriptor `fd`,\
    \ use the `SETLK` to create a lock and specify the `region` structure.\n    if\
    \ (res == -1) fprintf(stderr, \"Failed to lock region.\\n\");\n    sleep(20);\n\
    \    printf(\"Process %d closing file\\n\", getpid());\n    close(fd);\n    exit(EXIT_SUCCESS);\n\
    }\n```\n\nWe can obviously test it by writing a program that accesses the same\
    \ file, and proceeds to query using `fcntl` whether a lock exists and also whether\
    \ a new lock can be obtained or not.\n\n`lock_reg_ex_test.c`\n\n```c\n#include\
    \ <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\nconst\
    \ char *file_with_regions = \"/tmp/test_lock\";\n#define SIZE_INCREMENT 5\nint\
    \ main() {\n    int fd;\n    int res;\n    struct flock region_of_interest;\n\
    \    int start_byte;\n    fd = open(file_with_regions, O_RDWR | O_CREAT, 0666);\n\
    \    if (!fd) {\n        fprintf(stderr, \"Unable to open %s for read/write\"\
    , file_with_regions);\n        exit(EXIT_FAILURE);\n    }\n    for (start_byte\
    \ = 0; start_byte < 99; start_byte += SIZE_INCREMENT) {\n        region_of_interest.l_type\
    \ = F_WRLCK;\n        region_of_interest.l_whence = SEEK_SET;\n        region_of_interest.l_start\
    \ = start_byte;\n        region_of_interest.l_len = SIZE_INCREMENT;\n        region_of_interest.l_pid\
    \ = -1;\n        Before we test, we fill the structure. We increment in a value\
    \ of 5 bytes.\n        printf(\"Testing for exclusive lock on region from %d to\
    \ %d\\n\", start_byte, start_byte + SIZE_INCREMENT);\n        res = fcntl(fd,\
    \ F_GETLK, &region_of_interest);\n        if (res == -1) {\n            fprintf(stderr,\
    \ \"F_GETLK failed!\");\n            exit(EXIT_FAILURE);\n        }\n        if\
    \ (region_of_interest.l_pid != -1) {\n            printf(\"No opportunity to lock\
    \ exists by the process : %d\\n\", getpid());\n            printf(\"Because of\
    \ a lock by another process.\");\n            printf(\"The details including the\
    \ process number of the locking process are:\\n\");\n            printf(\"l_type\
    \ %d, \", region_of_interest.l_type);\n            printf(\"l_whence %d, \", region_of_interest.l_whence);\n\
    \            printf(\"l_start %d, \", (int)region_of_interest.l_start);\n    \
    \        printf(\"l_len %d, \", (int)region_of_interest.l_len);\n            printf(\"\
    l_pid %d\\n\", region_of_interest.l_pid);\n        } else {\n            printf(\"\
    F_WRLCK - Opportunity to lock exists by this process with pid, %d\\n\", getpid());\n\
    \        }\n    }\n    close(fd);\n    exit(EXIT_SUCCESS);\n}\n```\n\nWe run the\
    \ `lock_reg_ex.c` in the background:\n`./lock_reg_ex.c &`\nAnd in another terminal,\n\
    `./lock_reg_ex_test.c`\n\nThe output in the first terminal is:\n`Process 34974\
    \ locking file`\n`Process 34974 closing file`\n\nThe output from the second terminal\
    \ is:\n`Testing for exclusive lock on region from 0 to 5`\n`F_WRLCK - Opportunity\
    \ to lock exists by this process with pid, 34980`\n`Testing for exclusive lock\
    \ on region from 5 to 10`\n`F_WRLCK - Opportunity to lock exists by this process\
    \ with pid, 34980`\n`Testing for exclusive lock on region from 10 to 15`\n`F_WRLCK\
    \ - Opportunity to lock exists by this process with pid, 34980`\n`Testing for\
    \ exclusive lock on region from 15 to 20`\n`F_WRLCK - Opportunity to lock exists\
    \ by this process with pid, 34980`\n`Testing for exclusive lock on region from\
    \ 20 to 25`\n`F_WRLCK - Opportunity to lock exists by this process with pid, 34980`\n\
    `Testing for exclusive lock on region from 25 to 30`\n`F_WRLCK - Opportunity to\
    \ lock exists by this process with pid, 34980`\n`Testing for exclusive lock on\
    \ region from 30 to 35`\n`F_WRLCK - Opportunity to lock exists by this process\
    \ with pid, 34980`\n`Testing for exclusive lock on region from 35 to 40`\n`F_WRLCK\
    \ - Opportunity to lock exists by this process with pid, 34980`\n`Testing for\
    \ exclusive lock on region from 40 to 45`\n`No opportunity to lock exists by the\
    \ process : 34980`\n`Because of a lock by another process.`\n`The details including\
    \ the process number of the locking process are : l_type 1, l_whence 0, l_start\
    \ 40, l_len 10, l_pid 34974`\n`Testing for exclusive lock on region from 45 to\
    \ 50`\n`No opportunity to lock exists by the process : 34980`\n`Because of a lock\
    \ by another process.`\n`The details including the process number of the locking\
    \ process are : l_type 1, l_whence 0, l_start 40, l_len 10, l_pid 34974`\n`Testing\
    \ for exclusive lock on region from 50 to 55`\n`F_WRLCK - Opportunity to lock\
    \ exists by this process with pid, 34980`\n`Testing for exclusive lock on region\
    \ from 55 to 60`\n`F_WRLCK - Opportunity to lock exists by this process with pid,\
    \ 34980`\n`Testing for exclusive lock on region from 60 to 65`\n`F_WRLCK - Opportunity\
    \ to lock exists by this process with pid, 34980`\n`Testing for exclusive lock\
    \ on region from 65 to 70`\n`F_WRLCK - Opportunity to lock exists by this process\
    \ with pid, 34980`\n`Testing for exclusive lock on region from 70 to 75`\n`F_WRLCK\
    \ - Opportunity to lock exists by this process with pid, 34980`\n`Testing for\
    \ exclusive lock on region from 75 to 80`\n`F_WRLCK - Opportunity to lock exists\
    \ by this process with pid, 34980`\n`Testing for exclusive lock on region from\
    \ 80 to 85`\n`F_WRLCK - Opportunity to lock exists by this process with pid, 34980`\n\
    `Testing for exclusive lock on region from 85 to 90`\n`F_WRLCK - Opportunity to\
    \ lock exists by this process with pid, 34980`\n`Testing for exclusive lock on\
    \ region from 90 to 95`\n`F_WRLCK - Opportunity to lock exists by this process\
    \ with pid, 34980`\n`Testing for exclusive lock on region from 95 to 100`\n`F_WRLCK\
    \ - Opportunity to lock exists by this process with pid, 34980`\n\nDatabases\n\
    \nLingaraj started talking.\n\n“Let’s move on to databases. Databases are you\
    \ know, used to store data. Parrot Paresh was a guy who went on to become a robber.\
    \ He stole a lot of valuables from people and had trained the parrot to maintain\
    \ the database. He had stolen my valuables too. All Paresh had to do was tell\
    \ the name of the person who was robbed and the parrot would tell the details\
    \ beginning with the person’s name, what the valuables were and where they were\
    \ hidden.”\n\n![](image_rsrc854.jpg)\n\nThe Inspector told Ravi’s name to the\
    \ parrot. The parrot began churning out the details.\n\n‘Name : Ravi.\n"
