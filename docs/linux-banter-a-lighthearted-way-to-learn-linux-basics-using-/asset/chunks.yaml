    listen.)


    O_RDWR Open for reading and writing (Dialogue writer both listens and gives new
    dialogues.)


    | #include <fcntl.h>#include <sys/types.h>#include <sys/stat.h>int open(const
    char *path, int oflags);int open(const char *path, int oflags, mode_t mode); |


