  raw: 'Seema tried it on her laptop and explored various options. Lingaraj then proceeded
    to open his bag and distributed some bananas to the monkeys.


    The C Compiler


    When they were back at Lingaraj’s house, Seema proceeded to ask about Lingaraj’s
    parents.


    “My father is in a biotechnology conference in Sweden. And my mother, on a trip
    to Ladakh and the Himalayas.”


    “What made you choose to learn Linux? For me, it’s a necessity.”


    “I like Linux because it made even a simple programmer like me see what the established
    programmers of great stature were seeing. Everything is shared here and it is
    one of the examples of a coming together of humanity, albeit in a part, to bring
    something of benefit to the world without really looking for a profit.


    Now, let’s talk about the compiler.


    The compiler takes what you write in human readable form and turns it into machine
    readable form.”


    Lingaraj showed her a part of a C program on his laptop.


    |   pthread_t t1, t2;  pthread_mutex_t mutex1;  pthread_mutex_init(&mutex1, NULL);   
    int iret1 = pthread_create(&t1, NULL, (void *) print_func, (void *) message);  
    int iret2 = pthread_create(&t2, NULL, (void *) print_func, (void *) message);  pthread_join(t1,
    NULL);  pthread_join(t2, NULL); |


    “Oh! This is the machine readable form.”


    “No, that’s human readable.”


    Seema was taken aback.


    “Linux usually uses the gcc. It’s a C compiler which can compile C, C++  and more.”
    continued Lingaraj.


    The trick is to be able to speak to something in it’s language and make it do
    a job based on conditions.


    Who lives with you at home?” asked Lingaraj.


    “My mother.”


    “Did you give any instructions to her as you came here?”


    “Yes, I said ‘Don’t open the door unless you know the person very well.”


    “See, that’s a program. You programmed her for safety.


    Same with machines. But they understand only 0 and 1\. And the most basic are
    gates which can decide whether to allow current through it based on a condition.
    So, this behaviour depending on conditions is what makes computers. That an element
    found in mud allows current only one way through it is what made the electronics
    and computer worlds possible.


    So, every line that you speak to a computer, current flows in a particular way
    and operations happen. You need to learn C. I would have suggested a good book
    written by me, but then I haven’t written it. I suggest you refer this book.”
    said Lingaraj handing over a book on C.


    Seema came back the next day after poring over the book and taking notes.


    “I learnt a bit of C. I now know the ‘Hello world!’ program.”


    “I will cover a bit of structures and pointers now. A structure is a way to group
    related variables of different types in a basket, if you will. An example is


    | struct example_structure{int any_number;char one_letter;}; |


    The members can be accessed like this :


    | example_structure.any_numberexample_structure.one_letter |


    Most of the data like a variable is stored in memory. Now, C allows you the liberty
    to access that variable based on the memory address as well. The variable that
    stores the address of the variable is called a pointer. The address of the variable
    can be obtained as well as what’s stored there, the value.


    For example


    | #include <stdio.h>int main(){    int variable1 = 20;    int *vp;    vp = &variable1;   
    printf("The address of variable1 is %p\n", (void*) &variable1);    printf("Address
    stored in variable vp is %p\n", vp);    printf("The value of the variable variable1
    is %d\n", variable1);    printf("The value at the address given by variable vp
    is %d\n", *vp);} |


    We can try this program to get an idea. I won’t show you how I run it yet.”


    Lingaraj ran the program and the output was displayed on the screen.


    | The address of variable1 is 0x7ffe17ff187cAddress stores in variable vp is 0x7ffe17ff187cThe
    value of the variable variable1 is 20The value at the address given by variable
    vp is 20 |


    The address is machine and instance specific. But if you see it, it gives you
    an idea of how pointers work.


    Let’s test the ‘Hello World’ program. So, how do you invoke gcc, the GNU C Compiler?
    You just type gcc and the program name. The compiler will save the executable
    binary file as ‘a.out’ in the directory. But if you are bursting over with creativity
    and want to name it as something else, use the -o option.”


    Then Lingaraj as was his wont, seemingly jumped to a completely unrelated topic.


    “If you take a crocodile to the veterinary doctor for vaccination, the doctor
    will see it’s a crocodile from the south and he will talk to the crocodile in
    a language meant for crocodiles from the south. He won’t talk to it in north crocodile
    language. Similarly, the gcc is a cross compiler. Meaning it can understand what
    kind of a machine it is residing in and compile the program appropriately.


    A north crocodile is different from a south crocodile


    gcc knows this as it begins to compile


    A different binary for a different architecture style


    No wonder gcc is great and very versatile”


    Seema had come to expect stories, but poetry about crocodiles was a bit too much.


    “I heard you were a crocodile doctor over here.” she said.


    “Right.”


    Seema wondered whether he would take her to a crocodile for a demo.


    “Can you really communicate with crocodiles?”


    “Yes. One day there was this situation. I was wandering near the river when I
    saw this man of around 40 years of age. He sat meditating on the rock and put
    a lot of rubber crocodiles around him.


    ![](image_rsrc845.jpg)


    He wanted to give the impression that he had some spiritual power which could
    deter even crocodiles from attacking him. He later said there were a lot of gullible
    people in the world and he had to guide them spiritually. He had brought a cameraman
    who was almost a gymnast.


    ![](image_rsrc846.jpg)


    The cameraman then shot the video. It was going alright till cameraman decided
    to sit on one of the rubber crocodiles. Then he started moving sidewards. Everybody
    thought he was working the trolley shot. Actually, it was the crocodile moving.
    He had sat on a live one. I had to step in to calm down the crocodile. Turned
    out he was a fake spiritual guru, but I had to save him anyway.


    Coming back to gcc, let’s run the hello world program that you learnt.”


    Lingaraj saw the program. It was pretty straightforward.


    | #include <stdio.h>main(){printf(“Hello World!\n”);} |


    He compiled it invoking gcc.


    | $ gcc hello.c -o hello$ lshello.c hello$ ./helloHello World! |


    You can even invoke gcc step by step. The 4 stages in the compilation process
    are: preprocessing, compilation, assembly and linking.


    If you want to do this step by step, this is how you go about it :


    | $ gcc -E hello.c -o hello.cpp |


    The above command creates the preprocessing file hello.cpp


    | $ gcc -x cpp-output -c hello.cpp hello.o |


    This make an object file hello.o. The cpp-output is a standard telling the input
    file type, in this case hello.cpp


    | $ gcc hello.o -o hello |


    This creates the final executable which you can run.


    Files and Directories


    Let’s look at the Linux system. Before that, I want to introduce you to ‘Thing
    Thimma.’”


    They took a walk and reached a sugarcane field. The place was beautiful and they
    noticed a dainty looking hut in the distance. As always, Lingaraj carried his
    laptop. As they approached the hut, they could see lots of sugarcane pulp lying
    in heaps after the juice had been extracted. There was a man working in the hut.


    ![](image_rsrc847.jpg)


    Then the man came out.


    “Hi TT. This is Seema. She’s learning Linux.” said Lingaraj.


    Seema proceeded to shake hands with TT.


    “Thimma is into bagasse plate making, plates made of sugarcane pulp, after the
    juice has been extracted. Tell me Thimma how was your day? Everything okay?”'
