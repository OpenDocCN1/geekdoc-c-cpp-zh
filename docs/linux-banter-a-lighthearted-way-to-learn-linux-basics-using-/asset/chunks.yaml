    “There is one more way. The cd tilde.


    | $ cd ~ |


    I have a knock knock joke.


    Knock knock.”


    “Who’s there?”


    “Tilde”


    “Tilde who?”


    “Till date no one’s opened their heart for me.”


    “I am really tired.”


    The session was over and Seema was introduced to a guy with a boat by Lingaraj.
    The boatman took her on a boat ride and Seema enjoyed it very much.


    The next day. Lingaraj continued at his house.


    Let’s look at some hardware files. Three of them. We start with.


    | dev/console |


    This is the system console. A place where messages are usually displayed.


    | dev/tty |


    This is the controlling terminal. That is where the control of the system externally
    is coming from. And the messages go there.


    | dev/null |


    As told earlier, it is like a hollow in the tree. Most of what my great grandfather
    told in his later years were diverted to this hollow. The interesting thing is,
    I still hear his voice in the hollow. Maybe his ghost lives there. Do you want
    to see it?”


    “No!”


    “There is /dev/zero as well, which gives an endless supply of zeros if you read
    from it.”


    “Who would want many zeros. Useless, I think.”


    “I would. The difference between me and the richest man in our community is actually
    useless zeros as you say. But they come after the 1.”


    “Character and block devices. Character devices deal with one character at a time,
    whereas block devices deal with one block of data at a time.


    It’s like writing. If you are writing a phone number, you do it one character
    at a time. But if you were reading a story, you read a word, a block of data at
    a time. Like pigeons eat one grain at a time and dogs eat a whole chunk at a time.”


    “This was the first example you gave me without involving a weird character from
    your community.”


    “Wait, let me finish. I was once in a fight with a robber in the city. He was
    ![](image_rsrc84A.jpg)stealing my audio cables. He threw punches at me, like a
    character device.


    But I took them all and gave him a solid shot with my hard disk, like a block
    device, which floored him.


    ![](image_rsrc84B.jpg)


    Will help you remember.”


    “The difference between character and block devices?”


    “No, it will help you remember me as a hero. You said you would introduce some
    friends. Tell them this story.”


    Seema began to count how many friends she would lose.


    “Anyway, ‘ioctl’ is usually used not to pass input and output, but to make the
    device work which the software can’t do. Like reset the printer to it’s starting
    point. Or to rewind a tape drive, etc. Each driver has it’s own set of ioctl commands.


    If you get to Vijay’s hand driver, you can program it to keep holding your hand.
    And when a bad guy approaches, you can program his hands and legs drivers to fight
    them. And maybe go on to participate in competitions. Maybe become a prize fighter.
    Maybe get into movies and earn money. I can be his programmer and we can show
    off Vijay to the world. It will be like a consolation for me.”


    “That’s not what I came to you for. What do you mean consolation?”


    “I made a robot once that looked exactly like me.


    ![](image_rsrc84C.jpg)


    It used to act in movies in Bangalore and I had programmed it to fight well. After
    the robot was back home, I used to charge it and then go out and bask in all the
    glory of being a film celebrity.


    ![](image_rsrc84D.jpg)


    One day I forgot to charge the robot and I had to go personally to the film scene
    being shot, which I found out later was a fight scene. The stunt director came
    and spoke to me.


    ![](image_rsrc84E.jpg)


    He said, “Sir, you hit 50 fighters yesterday. Today, I have got 100 fighters for
    the climax. Action!”


    ![](image_rsrc84F.jpg)


    There was action indeed. And lot of cuts.”'
