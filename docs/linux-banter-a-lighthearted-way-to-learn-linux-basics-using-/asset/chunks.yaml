    | $ cd |


    And if you want to go to some other directory, the /usr/lib for instance,


    | $ cd /usr/lib |


    | $ cd .. |


    takes you one level up in the directory structure.


    I will now list some commands and explain them.


    | $ file textfile |


    Says what kind of a file it is. Whether a directory or a C source file, or an
    executable or a text file, etc.


    | $ cat textfile |


    The cat command displays the contents of a file.”


    Again Lingaraj was disturbed. Seema by now had learnt he would have a story to
    say. And she was willing to bet her last rupee it was going to be a sad story.


    “There was this girl, Billy in the city. One day, as her cat was trying to cross
    the road, a guy on a bike desperate to cross the road before the cat crossed his
    path sped and almost killed the cat. I took the cat to a vet and I saved the cat’s
    life. I felt heroic and special. Billy and I became friends. One day, I went and
    told her, ‘Let’s concatenate our lives.’


    ‘You are in a queue because there are eight other people who have saved the cat’s
    life, because a cat has 9 lives.’”


    “Why do you bring up these stories of love disappointment? You have to delete
    them and move on.” said Seema.


    “Which brings us to the next set of commands.


    ‘rm’ and ‘mv’. rm, removes a file and mv moves the file to another location.”


    “OK, rm Billy. Mv /home/Lingarajlovefiles to /newprospect” said Seema enthusiastically.


