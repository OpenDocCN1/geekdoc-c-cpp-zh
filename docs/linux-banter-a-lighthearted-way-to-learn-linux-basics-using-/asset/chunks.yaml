    we unlcok the mutex.   }int main(){   pthread_t t1,t2;   pthread_mutex_t mutex1;   pthread_mutex_init(&mutex1,
    NULL);  pthread_create(&t1, NULL, (void *)print_func, (void *) "First call                    to
    pthread");  pthread_create(&t2, NULL, (void *)print_func, (void *) "Second call
    to pthread");   pthread_join(t1, NULL);  pthread_join(t2, NULL); printf("Back
    to main after thread join\n");} |


    So, you see, now a routine is locked and then released.


    The output is


    | Main program now  runningFirst call to pthread - Before sleepFirst call to pthread
    - After waking upSecond call to pthread - Before sleepSecond call to pthread -
    After waking upBack to main after thread join |


    This is the sequence you had predicted for the thread program without the mutex.
    Now, it is synchronous. There is another way to achieve synchronicity. Let me
    tell you about another scenario. When my uncle, the doctor was in the operating
    room in his private hospital, they had a red light on in case operations were
    going on. Once the operation finished, they would turn off the red light.


    ![](image_rsrc85B.jpg)


    If the red light was off, a film crew would go in, turn the red light on and make
    videos. After their job was done, the film crew used to switch off the red light.


    ![](image_rsrc85C.jpg)


    So, the functioning of the light is a semaphore which allows only the doctors
    during the operation and closes it for film makers and the other way round.


    This allowed film makers, to see the light off, enter, switch it on and shoot.
    Once the job was done, they would switch off the light. Same with doctors.


    If the light was on, the film team or the doctors had to wait until the light
    was off.


    “But isn’t it unfair on the patients? They have to wait till the film star finishes.”


    “All my uncle’s patients were opportunists. They just signed up for operations
    so they could tell, ‘I shared the spotlight with Film Star Subbu.’


    Also, they had to learn patience. How else would you call him a patient?”


    Seema was agonised. But didn’t say anything. Lingaraj continued.


    “A semaphore basically tells different threads whether a resource is available
    or not. A semaphore can be extended to tell even processes whether a routine is
    available or not. Here are some C library functions :


    | #include <semaphore.h>int sem_init(sem_t *sem, int pshared, unsigned int value);
    |


    We initialise the semaphore here.


    ‘sem_t *sem’ is the semaphore itself. The type is sem_t.


    ‘int pshared’ indicates whether the semaphore is shared across processes. If it’s
    only threads in the current process, this value is 0.


    the ‘int’ value is the value you initialise the semaphore with.


    | #include <semaphore.h>int sem_post(sem_t * sem); |


    The ‘sem_post’ function atomically increases the value of the semaphore by one.
    Like how a good economic situation increases wealth. Atomically means, in one
    go without listening to other signals. Like how a King used to throw his necklace
    at poor artists as soon as he heard their rendition about his might and prowess.


    ![](image_rsrc85D.jpg)


    Nobody else in the court used to dare catch those necklaces or tell the King,
    ‘Of course, he is lying. But you can’t tell, can you?’


    | int sem_wait(sem_t * sem); |


    This decreases the count of the semaphore by 1, but has the good sense to wait
    if it’s zero. This is like some erstwhile King’s income tax official. If the person
    had zero money, they were courteous enough to wait until he made money due to
    a good economic system and then decrease his wealth back to zero.


    sem_post() and sem_wait() are coordinated in their implementation. It means, sem_wait
    keeps track of the semaphore and once it goes to zero, it increments it and the
    corresponding thread is pressed into service. The condition of the variable decides
    what routine will happen.


    | sem_t *sem_open(const char *name, int oflag); |'
