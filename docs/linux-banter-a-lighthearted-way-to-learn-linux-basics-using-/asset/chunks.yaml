    \ printf(\"l_whence %d, \", region_of_interest.l_whence);\n            printf(\"\
    l_start %d, \", (int)region_of_interest.l_start);\n            printf(\"l_len\
    \ %d, \", (int)region_of_interest.l_len);\n            printf(\"l_pid %d\\n\"\
    , region_of_interest.l_pid);\n        } else {\n            printf(\"F_WRLCK -\
    \ Opportunity to lock exists by this process with pid, %d\\n\", getpid());\n \
    \       }\n    }\n    close(fd);\n    exit(EXIT_SUCCESS);\n}\n```\n\n我们在后台运行 `lock_reg_ex.c`：\n\
