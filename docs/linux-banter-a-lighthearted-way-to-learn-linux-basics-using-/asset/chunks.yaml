- fmt: "\n# The signals to block\n\nWhat we are talking about here, is this. When\
    \ a signal occurs, the handler function is called and runs to completion. If within\
    \ that time, another signal appears, this robust system call, `sigaction`, can\
    \ block the fresh signal.\n\n`int sa_flags`\n\n## Signal Action Modifiers\n\n\
    It tells whether to get back into position to catch a new signal. When you set\
    \ it to `SA_RESETHAND`, the `sigaction` system call handles the signal once.\n\
    \nThere are other flags too which are available in the man pages. \n\n`oact` is\
    \ a location which will hold the previous signal action that was made.\n\n```c\n\
    #include <signal.h>\nint sigaddset(sigset_t *set, int signo);\nint sigemptyset(sigset_t\
    \ *set);\nint sigfillset(sigset_t *set);\nint sigdelset(sigset_t *set, int signo);\n\
    ```\n\nThese are C library functions. You can tell the program to specifically\
    \ deal with one signal at a time or make a broad policy to deal with signals.\
    \ So, you can make a set of all these signals and specify what to do. Also, there\
    \ might be situations where your program is working on a signal received and another\
    \ signal comes. So, you might need to suspend the function of this and kill the\
    \ process. No need of confusion. You can handle all these signals using a signal\
    \ set.\n\nThe signal set is of the type\n\n`sigset_t`\n\nSo, you can fill your\
    \ signal set with all the available signals through the `sigfillset()` C library\
    \ function. Likewise, you can empty the set of all signals using the `sigemptyset()`\
    \ C library function.\n\nYou can add individual signals to a set by specifying\
    \ their numbers through `sigaddset()`.\n\nAnd you can delete individual signals\
    \ from a set by specifying their numbers through `sigdelset()`.\n\nAlso, you can\
    \ find out if a signal is a member of a set by enquiry.\n\n```c\nint sigismember(\
    \ const sigset_t *set, int signum)\n```\n\nThis returns 1 if the signal is a member\
    \ of the set, 0 if it’s not and -1 on error.\n\n```c\n#include <signal.h>\nint\
    \ sigprocmask(int how, const sigset_t *set, sigset_t *oset);\n```\n\nThe above\
    \ system call is to change the process signal mask. If a signal is blocked by\
    \ a process, it won’t be delivered, but will remain pending. A program can determine\
    \ which of its blocked signals are pending by calling the C library function `sigpending`.\n\
    \n```c\n#include <signal.h>\nint sigpending(sigset_t *set);\n```\n\nThis system\
    \ call writes a set of signals into the signal set pointed to by `set`, that are\
    \ blocked from delivery. It returns 0 if successful, otherwise, -1 with `errno`\
    \ set to indicate the error.\n\n```c\n#include <signal.h>\nint sigsuspend(const\
    \ sigset_t *sigmask);\n```\n\nThe `sigsuspend` system call replaces the process\
    \ signal mask with the signal set given by `sigmask` and then suspends execution.\
    \ It will resume after the execution of a signal handling function.\n\n## Example:\
    \ ayyo.c\n\nLet’s look at a program that uses `sigaction`.\n\n`ayyo.c`\n\n```c\n\
    #include <signal.h>\n#include <stdio.h>\n#include <unistd.h>\n\nvoid ctrlc(int\
    \ sig){\n    printf(\"I advise you not to stop me, %s\\n\", getlogin());\n}\n\n\
    void shutdown_req(int sig){\n    printf(\"I am process %d and I know who is trying\
    \ to kill me. It's you, %s\\n\", getpid(), getlogin());\n}\n\n/*\nvoid finish(int\
    \ sig){\n    printf(\"This function is pretty useless because it is trying to\
    \ handle a SIGKILL signal.\");\n}\n*/\n\n/*\nWe declare the above three functions,\
    \ one each for a particular signal, `SIGINT`, `SIGTERM` and `SIGKILL`. The function\
    \ that handles `SIGINT`, `ayyo` works only once Ctrl+C is pressed because we have\
    \ used the `SA_RESETHAND` flag. We print the relevant message and that is all\
    \ this function does.\n*/\n\nint main(){\n    struct sigaction act;\n    act.sa_handler\
    \ = ctrlc;\n    sigemptyset(&act.sa_mask);\n    act.sa_flags = SA_RESETHAND;\n\
    \    sigaction(SIGINT, &act, 0);\n\n    act.sa_handler = shutdown_req;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = 0;\n    sigaction(SIGTERM, &act, 0);\n\n    /*\n    This is\
    \ irrelevant because a SIGKILL will kill the process immediately and it cannot\
    \ be handled.\n    act.sa_handler = finish;\n    sigemptyset(&act.sa_mask);\n\
    \    act.sa_flags = 0;\n    sigaction(SIGKILL, &act, 0);\n    */\n\n    /*\n \
    \   Then the handler function is specified and the signal set, sa_mask, is made\
    \ empty. We don’t want any signals to block. Because anything you put here will\
    \ not be delivered to the process. The flags whether `SA_RESETHAND` is needed\
    \ is specified. In the first case, `SA_RESETHAND` is specified, which means the\
    \ signal will be handled only once because the signal is not reset. If you want\
    \ it to work every time.\n    */\n    while(1) {\n        printf(\"I am happy\\\
    n\");\n        sleep(1);\n    }\n}\n```\n"
