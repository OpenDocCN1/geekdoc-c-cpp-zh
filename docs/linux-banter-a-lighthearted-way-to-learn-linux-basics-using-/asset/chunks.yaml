  trans: "\n\n| Seemaloves YogaVijay$ 喜欢足球 |\n\n部分输出在 4 之后打印，因为父进程比子进程先结束了。\n\n你可能会怀疑并没有发生任何真实的通信。没有消息交换。但如果你留意，它们在时间上正在进行协调。这已经足以被称为进程间通信（IPC）了。\n\
    \n## IPC：共享内存\n\nLingaraj 说道：\n\n“想一想我给出的那个例子，我们在岩石附近的某个地方放了一个鸡尾酒配方。敲开那些石头。你甚至允许其他进程访问该内存位置。我告诉过你这很有用，因为当我们把配方放在那些石头上并回来收集时，会有那些昨晚上实验过的人添加更多的配方。”\n\
    \n![](img/image_rsrc84T.jpg)\n\n配方纸可以被看作内存。通过这张纸，醉鬼和我们之间共享信息。这比创建管道（pipes）或 FIFO\
    \ 要快得多。在这里应该确保没有两个进程在同时写入。\n\n系统调用如下：\n\n```c\n#include <sys/shm.h>\nint shmget(key_t\
    \ key, size_t size, int shmflg);\n```\n\n`key_t` `key` 是内存段的。你可以使用 `#define` 来定义键，但这个键必须被两个进程共同知道，以便于进程间通信。\n\
    \n值 `IPC_PRIVATE` 使共享内存对进程是私有的。当我的人生处于低谷时，我想分享我的故事。但我找不到任何人。所以，那曾是一个 `IPC_PRIVATE`\
    \ 的情况。\n\n“那真可悲。”\n\n“确实如此，直到我开始去拜那些敲开的石头。”\n\n“不，这不是在开玩笑。你告诉我了这么多关于你自己的故事。它们是悲伤的故事，但你让它们听起来很有趣。我笑了，我觉得很有趣，我感到有些措手不及，并对你的一些故事感到惊讶。我不是精神分析学家，但我也是人，我想告诉你，我佩服那个勇敢于自嘲的哥们。在这种情况下，我很怀念\
    \ Vijay，但在你这里我找到了一个盟友、一个朋友和一个老师。我对你有极大的尊重。根据家族传统，当我们结婚时，有一个仪式，新娘的哥哥会用甜点迎接客人。这是给家族中最受荣誉成员的特权，我无法想象还有别人能做这件事。我知道我还没和你商量过，但我已经决定由你来。”\n\
    \nLingaraj 望向远方。对于 Seema 而言，他第一次感到情感波动。接着他说：\n\n“我做这件事时会开心得忘掉（‘jamoon’）的。”\n\n\
    “而且会有很多人你可以联系。向你介绍一位值得信赖的女性并让你嫁出去是我的责任。”\n\n“那我们就不要浪费时间了，姐姐。大小以字节为单位。”\n\n`shmflag`\
    \ 类似于 `open` 中的 `mode`。它是 `I_CREAT` 与权限进行位或（OR）操作的结果，用于创建一个新的段。如果该段已经打开，它不会报错，这与使用信号量（semaphores）时不同，它会被忽略。\n\
    \n返回值是内存段标识符。错误时返回 -1。\n\n```c\nvoid *shmat(int shm_id, const void *shm_addr,\
    \ int shmflg);\n```\n\n这用于指定哪些进程有权访问共享内存。这就像是将共享内存段挂载到进程中。\n\n`shm_id` 是你从 `shmget()`\
    \ 获取的共享内存标识符。\n\n`shm_addr` 是共享内存挂载到进程的地址。将其留为空指针（null pointer），系统将处理分配。\n\n但如果你想控制内存地址，可以结合\
    \ `shmflg` 使用。但我建议不要这样做。如果你真的想控制内存段的地址，则使用 `SHM_RND`。\n\n`shmflg` 的其他值之一是 `SHM_RDONLY`，它使内存段变为只读。\n\
    \n更多的一些值包括：\n\n`SHM_EXEC` 允许执行共享内存段中的代码。\n\n如果 `shmat` 执行成功，它返回一个指向共享内存第一个字节的指针。\n\
    \n```c\nint shmdt(const void *shm_addr);\n```\n\n这会删除共享内存段。但不是删除内容。它接收 `shmat()`\
    \ 返回的地址。\n\n```c\nint shmctl(int shm_id, int command, struct shmid_ds *buf);\n\
    ```\n\n这用于控制共享内存。\n\n`shm_id` 是来自 `shmget` 的返回值。\n\n命令可以是 `IPC_STAT` 用于获取共享内存段的状态信息。\n\
    \n`IPC_RMID` 意味着控制。它从系统中移除共享内存段，销毁它并销毁 `shmid_ds` 数据结构。\n\n`shmid_ds` 结构包含了关于内存段的更多细节。\n\
    \n让我们来看这个写入程序，\n\n`shm_writer_1254.c`\n\n```c\n#include <sys/shm.h>\n#include\
    \ <stdio.h>\n#define key 0x1254\nint main(){\n    int shmid = shmget(key,BUFSIZ,0666\
    \ | IPC_CREAT);\n    char *str = (char *)shmat(shmid,0, 0);\n    printf(\"Input\
    \ some data\\n\");\n    fgets(str,BUFSIZ, stdin);\n    printf(\"Data written in\
    \ memory is %s\", str);\n    shmdt(str);\n}\n```\n\n在这里，有一个定义的键。这必须被调用进程已知。我们通过\
    \ `shmget` 创建共享内存。`BUFSIZ` 通常是 8192，但取决于系统。然后挂载到内存。同样，我们将字符串分配到挂载的内存中。下一个程序也是一个写入程序，但键改成了\
    \ 2995。\n\n`shm_writer_2995.c`\n\n```c\n#include <sys/shm.h>\n#include <stdio.h>\n\
    #define key 0x2995\nint main(){\n    int shmid = shmget(key,BUFSIZ,0666 | IPC_CREAT);\n\
    \    char *str = (char *)shmat(shmid,0, 0);\n    printf(\"Input some data\\n\"\
    );\n    fgets(str,BUFSIZ, stdin);\n    printf(\"Data written in memory is %s\"\
    , str);\n    shmdt(str);\n}\n```\n\n现在，我们来看读取程序。不需要创建内存段，所以 `shmget` 不需要使用 `IPC_CREAT`。接下来，挂载到内存段。\n\
    \n`shm_reader_1254.c`\n\n```c\n#include <sys/shm.h>\n#include <stdio.h>\n#define\
    \ key 0x1254\nint main(){\n    int shmid = shmget(key,1024,0666);\n    char *str\
    \ = (char *)shmat(shmid,0, 0);\n    printf(\"Data read from memory is %s\", str);\n\
    \    shmdt(str);\n    shmctl(shmid,IPC_RMID,NULL);\n    return 0;\n}\n```\n\n\
    在读取程序中，不需要创建内存。只需要键。\n\n`shm_reader_2995.c`\n\n```c\n#include <sys/shm.h>\n#include\
    \ <stdio.h>\n#define key 0x2995\nint main(){\n    int shmid = shmget(key,BUFSIZ,0666);\n\
    \    char *str = (char *)shmat(shmid,0, 0);\n    printf(\"Data read from memory\
    \ is %s\", str);\n    shmdt(str);\n    shmctl(shmid,IPC_RMID,NULL);\n    return\
    \ 0;\n}\n```\n\n"
- fmt: "\n“That was a message cue for him to change the topic.”\n\n“That’s a cue.\
    \ CUE. I am talking about queues. QUEUE.”\n\n“Oh ok.”\n\n### Lingaraj:\n\n```c\n\
    #include <sys/msg.h>\nint msgctl(int msqid, int cmd, struct msqid_ds *buf);\n\
    int msgget(key_t key, int msgflg);\nint msgrcv(int msqid, void *msg_ptr, size_t\
    \ msg_sz, long int msgtype, int msgflg);\nint msgsnd(int msqid, const void *msg_ptr,\
    \ size_t msg_sz, int msgflg);\n```\n\nA message queue is something like your instant\
    \ messenger. If I send you messages, the messages are queued. So, when you open\
    \ the app, they will be delivered.\n\n```c\nint msgget(key_t key, int msgflg);\n\
    ```\n\nYou can create or access a message queue with the above system call. `key`,\
    \ you know can take on `IPC_PRIVATE` which does….?”\n\n“Creates a message queue\
    \ which can be accessible only by the process creating it. And `msgflg` is usually\
    \ `IPC_CREAT` OR’ed with the nine permission bits. No error if `IPC_CREAT` is\
    \ used even if there already exists a message queue.\n\nReturns a message queue\
    \ identifier. -1 on error.” answered Seema.\n\n```c\nint msgsnd(int msqid, const\
    \ void *msg_ptr, size_t msg_sz, int msgflg);\n```\n\nThis is what you do to send\
    \ messages.\n\n`msqid` is the return from `msgget`.\n\nThe `msg_ptr` argument\
    \ is a pointer to a caller-defined structure of the following general form:\n\n\
    ```c\nstruct msgbuf {\n  long mtype;      /* message type, must be > 0 */\n  char\
    \ mtext[1];   /* message data */\n};\n```\n\nThe `msgflg` decides what happens\
    \ if the current message queue is full or the limit in the system for message\
    \ queues has been reached. There are two scenarios.\n\n| `IPC_NOWAIT` (Set) |\n\
    | `IPC_NOWAIT` (clear) |\n\n0 on Success and -1 on failure for `msgsnd`.\n\n```c\n\
    int msgrcv(int msqid, void *msg_ptr, size_t msg_sz, long int msgtype, int msgflg);\n\
    ```\n\nThis receives messages from a message queue.\n\n`msqid` is again the one\
    \ returned by `msgget`.\n\n`msg_ptr` is a pointer to the message to be received.\n\
    \n`msg_sz` is the message size.\n\n`long int msgtype` specifies the type of message.\n\
    \n`msgflg` sets the priority of the message to be retrieved.\n\n```c\nint msgctl(int\
    \ msqid, int command, struct msqid_ds *buf);\n```\n\nThis is for controlling the\
    \ message queue. One of the commands can be :\n\n`IPC_RMID` which deletes the\
    \ message queue.\n\nThe `ipcs` commands.\n\n`ipcs -s`, `ipcs -m`, `ipcs -q` will\
    \ tell you whether any semaphores, shared memory or message queues still linger\
    \ around. And if some semaphores or shared memory or message queues still linger\
    \ after the processes have been completed, you can remove them using `ipcrm -s`,\
    \ `ipcrm -m` and `ipcrm -q`, respectively.\n\nThe message queue program works\
    \ kind of the same way as the shared memory when it comes to the apparent procedure.\n\
    \nLet’s look at two programs, the sender first and the receiver next.\n\n####\
    \ mqsender.c\n\n```c\n#include <stdlib.h>\n#include <stdio.h>\n#include <string.h>\n\
    #include <errno.h>\n#include <unistd.h>\n#include <sys/msg.h>\n#define key 0x1254\n\
    struct message_st {\n  long int msg_type;\n  char text[BUFSIZ];\n};\nint main(){\n\
    \  int loop_cond = 1;\n  struct message_st data_passed;\n  int msgid;\n  char\
    \ buffer[BUFSIZ];\n  msgid = msgget((key_t)key, 0666 | IPC_CREAT);\n  if (msgid\
    \ == -1) {\n    fprintf(stderr, \"msgget failed with error: %d\\n\", errno);\n\
    \    exit(EXIT_FAILURE);\n  }\n  while(loop_cond) {\n    printf(\"Enter text to\
    \ be passed. Type 'enough' to stop: \");\n    fgets(buffer, BUFSIZ, stdin);\n\
    \    data_passed.msg_type = 1;\n    strcpy(data_passed.text, buffer);\n    if\
    \ (msgsnd(msgid, (void *)&data_passed, BUFSIZ, 0) == -1) {\n      printf(\"msgsnd\
    \ failed\\n\");\n      exit(EXIT_FAILURE);\n    }\n    if (strncmp(buffer, \"\
    enough\", 6) == 0) {\n      loop_cond = 0;\n    }\n  }\n  exit(EXIT_SUCCESS);\n\
    }\n```\n\n“Can you explain what’s happening?” asked Lingaraj.\n\nSeema by now,\
    \ knew a lot about programming and proceeded to explain.\n\n```c\n#include <stdlib.h>\n\
    #include <stdio.h>\n#include <string.h>\n#include <errno.h>\n#include <unistd.h>\n\
    #include <sys/msg.h>\n#define key 0x1254\nstruct message_st {\n  long int msg_type;\n\
    \  char text[BUFSIZ];\n};\n```\n\n“We include the necessary header files. Then\
    \ we define the key which is unique to this program as well as the reader. We\
