    \ &testfds))\n```\n\n我们检查属于 `testfds` 的 `fd` 文件描述符是否已变为活动。如果是，我们就继续。\n\n```c\n\
    {\n    if(fd == server_fd)\n```\n\n查看 `server_fd` 是否被激活。只有当客户端尝试服务器进程建立新连接时，它才会被激活。你可能记得，接受连接后，会使用一个特定客户端的文件描述符。\n\
    \n```c\n    {\n        printf(\"It is a new connection to the server. So grant\
    \ it\\n\");\n        addrlen = sizeof(client_address);\n        client_particular_fd\
    \ = accept(server_fd, (struct sockaddr *)&client_address, &addrlen);\n       \
    \ FD_SET(client_particular_fd, &read_fd_set);\n        printf(\"Added client with\
    \ client_particular_fd %d\\n\", fd);\n    }\n```\n\n在这里，我们接受连接并分配一个特定的客户端 `fd`\
    \ 用于通信。\n\n```c\nelse{\n    printf(\"The file descriptor %d is an already connected\
    \ one. So read data\\n\", fd);\n    read(fd, &buf, sizeof(buf));\n```\n\n在这里，如果激活的不是\
    \ `server_fd`，即如果它不是新连接的请求，那么意味着一个已经连接的客户端正在尝试传递消息。我们向用户打印相关消息。然后使用文件描述符编号 `fd`\
    \ 读取它。\n\n```c\n    printf(\"\\nSize of buf is : %ld and received message: %s\\\
    n\",sizeof(buf), buf);\n    FD_CLR(fd, &read_fd_set);\n}\n```\n\n我们向用户打印从已连接客户端收到的消息内容。我们使用\
    \ `FD_CLR` 从集合中清除该文件描述符，因为如果不这样做，它将仍然留在下一次迭代中，并且将再次从该套接字读取消息。但这带来了一些局限性，我们将在看到输出后进行讨论。\n\
    \n```c\n    }\nlc++;\n}\n}\n```\n\n为了测试这个服务器的效率，我们需要两个客户端。一个连接到服务器并在 15 秒后传递消息；另一个连接到服务器并立即传递消息。我们交替运行它们，服务器必须在处理传入的消息和接受连接之间进行切换。\n\
    \n### client_select_1.c\n```c\n#include <sys/types.h>\n#include <sys/time.h>\n\
    #include <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    #include <netinet/in.h>\n#include <arpa/inet.h>\n#include <errno.h>\n#define DATA_BUFFER\
    \ \"Seema learnt\"\nint main(){\n    char input[100];\n    struct sockaddr_in\
    \ saddr;\n    int fd, ret_val;\n    struct hostent *local_host;\n    fd = socket(AF_INET,\
    \ SOCK_STREAM, IPPROTO_TCP);\n    printf(\"Created a socket with fd : %d\\n\"\
    , fd);\n    saddr.sin_family = AF_INET;\n    saddr.sin_port = htons(7000);\n \
    \   saddr.sin_addr.s_addr = inet_addr(\"127.0.0.1\");\n    ret_val = connect(fd,\
    \ (struct sockaddr *)&saddr, sizeof(struct sockaddr_in));\n    if (ret_val ==\
    \ 0) {\n        printf(\"Connected to the server.\\n\");\n        printf(\"Sleep\
    \ 15 seconds before sending data.\\n\");\n        sleep(15);\n        ret_val\
    \ = write(fd, DATA_BUFFER, strlen(DATA_BUFFER));\n        printf(\"Sent data:\
    \ %d bytes\\n\", ret_val);\n    }\n    close(fd);\n    return 0;\n}\n```\n\n###\
    \ client_select_2.c\n```c\n#include <sys/types.h>\n#include <sys/time.h>\n#include\
    \ <stdio.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include\
    \ <netinet/in.h>\n#include <arpa/inet.h>\n#include <errno.h>\n#include <string.h>\n\
    #define DATA_BUFFER \"Vijay has changed\"\nint main(){\n    char input[100];\n\
    \    struct sockaddr_in saddr;\n    int fd, ret_val;\n    fd = socket(AF_INET,\
    \ SOCK_STREAM, IPPROTO_TCP);\n    printf(\"Created a socket with fd : %d\\n\"\
    , fd);\n    saddr.sin_family = AF_INET;\n    saddr.sin_port = htons(7000);\n \
    \   saddr.sin_addr.s_addr = inet_addr(\"127.0.0.1\");\n    ret_val = connect(fd,\
    \ (struct sockaddr *)&saddr, sizeof(struct sockaddr_in));\n    if (ret_val ==\
    \ 0) {\n        printf(\"Connected to the server.\\n\");\n        ret_val = read(fd,\
    \ input, sizeof(input));\n        if (ret_val > 0) {\n            input[ret_val]\
    \ = '\\0';\n            printf(\"Received message: %s\\n\", input);\n        }\n\
    \    }\n    close(fd);\n    return 0;\n}\n```\n\n我们首先运行 `server_select.c`，然后在不同的终端中运行\
    \ `client_select_1.c` 和 `client_select_2.c`。\n\n我们在启动服务器的终端上得到以下输出：\n\n```text\n\
    Created a socket with fd : 3\nLoop 0 starting\nStarting select in loop 0 and waiting\n\
    Return from select value is : 1\nIt is a new connection to the server. So grant\
    \ it\nAdded client with client_particular_fd 4\nLoop 1 starting\nStarting select\
    \ in loop 1 and waiting\nReturn from select value is : 1\nIt is a new connection\
    \ to the server. So grant it\nAdded client with client_particular_fd 5\nLoop 2\
    \ starting\nStarting select in loop 2 and waiting\nReturn from select value is\
    \ : 1\nThe client 5 is an already connected one. So read data\nSize of buf is\
    \ : 100 and received message: Vijay has changed\nLoop 3 starting\nStarting select\
    \ in loop 3 and waiting\nReturn from select value is : 1\nThe client 4 is an already\
    \ connected one. So read data\nSize of buf is : 100 and received message: Because\
    \ Seema learnt Linux\nLoop 4 starting\nStarting select in loop 4 and waiting\n\
    ```\n\n这是在 `client_select_1.c` 在发送消息之前等待 15 秒后的输出。这至少等待了 15 秒。\n\n"
