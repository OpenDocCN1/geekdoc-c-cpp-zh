  trans: "\n\n```bash\n$ find / -name test -print\n```\n\n你将找到所有名为 `test` 的文件并将它们打印在屏幕上。从\
    \ `/` 开始，那个……？”\n\n“根目录。” Seema 回答道。\n\n“所以，\n\n```bash\n$ find / -name Seema\
    \ -print\n```\n\n将打印系统中所有名为 `Seema` 的文件。”\n\n这些是其中的几个选项。\n\n### `-atime N`\n`N`\
    \ 在这里是一个数字。该文件最后被访问是在 `N` 天前。当你知道 Vijay 上次访问某个特定文件的时间时，可以用来做一个类比。\n\n### `-mtime\
    \ N`\n该文件在 `N` 天前被修改过。\n\n### `-name pattern`\n文件名（不包括任何路径），匹配提供的模式。为了确保模式被传递给\
    \ `find` 而不是立即被 shell 评估，模式必须始终放在引号中。\n\n例如如下：\n\n```bash\nfind . -name \"*ma\"\
    \ -print\n```\n\n将打印所有以 ‘ma’ 结尾的文件。注意那个点。它表示当前目录。所以，我们了解到，如果你不知道任何名字，`*` 就非常有用。这在婚礼场合是一个很好的工具，当时有些亲戚来并问你：“记得我是谁吗？”如果这是一个被接受的习惯，人们会字面上地称呼你为‘*\
    \ 叔’或‘* 姨’，他们会很开心，我们可以去追求更有价值的事情，比如设置状态消息。\n\n既然提到了这个话题，如果你记得名字的一部分，比如必须是 Suresh\
    \ 或 Ramesh，但无法精确确定，你可以使用 `???esh`。这样，你就能赢得更多的社交认可度分数。因为你偏离并不远。你甚至可以使用 `[SR][ua][rm]esh`。这样，人们会认为你正在研究人工智能。\
    \ \n\n```bash\nfind . -newer Seema\n```\n\n注意那个点（.）。\n\n查找比文件 `Seema` 更新更新的文件。“自从你上次见到\
    \ Vijay 之后，是否有任何新增的内容，”Lingaraj 说，并想提供帮助。\n\n“这有点过头了。”\n\n“看看是谁在说话。\n\n输入 `-d`\
    \ 表示目录，`-f` 表示普通文件。\n\n```bash\n$ find . \\( -name \"*ti\" -o -newer Seema \\\
    ) -a -type f -print\n```\n\n“它找到所有以 ‘ti’ 结尾的文件或比 `Seema` 更新的文件，并且根据 `f` 的指示，必须是普通文件，然后打印。括号前的反斜杠\
    \ `\\` 是转义字符。\n\n你已经见过如何通过文件名查找，但搜索文件内部的内容呢？你有 `grep` 命令。\n\n我的祖父，正如我告诉过你的，制作了很多药剂，我在这台电脑上记录了它们。我有一个文件列表。现在，如果我想搜索所有包含葡萄的药剂，我是这样做的\n\
    \n```bash\n$ grep grapes pprosedrink.txt\n```\n你应该压碎这些葡萄\n\n```bash\n$ grep -c\
    \ grapes pprosedrink.txt\n```\n`pprosedrink.txt:24`\n\n`-c` 是计数，还有其他选项。比如 `-v`\
    \ 是反向，显示不包含单词 `grapes` 的行数。如果你想看有多少文件包含 grapes 这个单词而不查看文件内容，只需添加 `-l`（小写 L）。\n\
    \n```bash\n$ grep [a-h] pprosedrink.txt\n```\n\n方括号可以包含可以匹配的内容。\n\n这将高亮所有包含 a\
    \ 到 h 之间字母的单词。\n\n```bash\n$ grep a[[:blank:]] pprosedrink.txt\n```\n喝了这种酒后，我就成了一台战斗机器。\n\
    \n在 `a` 之后，`grep` 使用正则表达式 `a[[:blank:]]`，它告诉系统在 `a` 之后寻找空格。简而言之，就是一个以 ‘a’ 结尾的单词。”\n\
    \n```bash\ngrep th.[[:space:]] pprosedrink.txt\n```\n\nSeema 问起 `th` 之后的点。她接着告诉\
    \ Lingaraj，她知道括号里的内容是在寻找空格。Lingaraj 回答道。\n\n“点告诉系统寻找单个字符。\n\n所以结果是\n\n```\nHuge\
    \ is the sky\nBut if it weren’t for the eye\n```\n\n元字符是一个具有其字面意思之外含义的普通字符。”\n\
    \n“`$` 是很好的例子。” Seema 提议道。\n\n“锚点是文本行中正则表达式匹配的位置。例如，`^` 和 `$` 就是锚点。\n\n`4 + 2`\
    \ 等于？”\n\nSeema 感到很惊讶。她想问 Lingaraj “为什么？”，但她直觉 Lingaraj 自己在做某事之前并没有问过自己“为什么？”她回答道。\n\
    \n“6。”\n\n“5 + 1?”\n\n“6”\n\n“12/2?”\n\n“6。”\n\n“3+3?”\n\n“6。”\n\n“3 * 2?”\n\n\
    “6”\n\n“想一种蔬菜。”\n\n“好的”\n\n“那是胡萝卜吗？”\n\n“是的，你怎么……”\n\n“这对大多数人都有效。”\n\n“现在，在键盘上，如果你使用\
    \ `shift 6`，你会得到一个符号。它叫什么？”\n\nSeema 按下 shift 然后 6 得到了 `^` 符号。\n\n“脱字符。”她回答道。\n\
    \n当你使用正则表达式时，\n\n```bash\n$ grep ^T Seema.txt\n```\n\n会在 `Seema.txt` 文件中查找以 `T`\
    \ 开头的行。\n\n接下来，你可能想执行一个命令，并将命令的输出作为另一个命令的一部分。简单的，把命令放在括号里\n\n```bash\n$ echo $(who)\n\
    ```\n\n“今天就到这里。”\n\n第二天，你可能想执行一个命令，并将命令的输出作为另一个命令的一部分。简单的，把命令放在括号里\n\n[注：提供的文本包含重复部分和碎片产物；我已保持了源文本的核心逻辑。]\
    \ the the the the the the the the \n\n“在下雨期间，我编写了这只猴子溜进酒类商店给我们买饮料。执行这个命令是，你竖起大拇指并说你喜欢的饮料。去吧。”\n\
    \nSeema 竖起大拇指说\n\n“苹果汁。”\n\n猴子发出了尖叫。\n\n“这是一个错误消息。它发生在使用了未定义的变量时。苹果汁就是未定义的变量。我们通常喝朗姆或威士忌。\n\
    \n```bash\n$ sh -u <script> set -o nounset$ set -u\n\n```\n\n在使用未定义变量时给出错误消息。\n\
    \nLinux 中有一个 `dialog` 工具。\n\n语法是：\n\n```bash\ndialog --msgbox “我需要朗姆” 9 18\n```\n\
    \n9 和 18 是维度。\n\n有各种选项。消息可以是消息框、信息框等。使用 `man` 命令并在我的笔记本电脑上试试吧。”\n\n"
