- pgno: 72
  md: "# **STEP 6**\n\nInterestingly, you can also use a function within the random\
    \ module to shuffle the items in the list, thus adding a little more randomness\
    \ into the equation:\n\n```\n```python\nrandom.shuffle(lst)\nprint(lst)\n```\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_0.png)\n\n# **STEP 7**\n\n\
    Using shuffle, you can create an entirely random list of numbers. For example,\
    \ within a given range:\n\n```\n```python\nimport random\nlst=[i for i in range(20)]\n\
    random.shuffle(lst)\nprint(lst)\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_1.png)\n\
    \n# **STEP 8**\n\nYou can also select a random number from a given range in steps,\
    \ using the start, stop, step loop:\n\n```\n```python\nimport random\nfor i in\
    \ range(10):\n    print(random.randrange(0, 200, 7))\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_1.png)\n\
    \n# **STEP 9**\n\nLet's use an example piece of code which flips a virtual coin\
    \ ten thousand times and counts how many times it will land on heads or tails:\n\
    \n```\n```python\nimport random\noutput = {\"Heads\":0, \"Tails\":0}\ncoin=list(output.keys())\n\
    for i in range(10000):\n    output[random.choice(coin)]+=1\nprint(\"Heads:\",\
    \ output[\"Heads\"])\nprint(\"Tails:\", output[\"Tails\"])\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_3.png)\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_4.png)\n\n# **STEP 10**\n\nHere's\
    \ an interesting piece of code. Using a text file containing 466 thousand words,\
    \ you can pluck a user generated number of words from the file (text file found\
    \ at www.github.com/dwyl/english-words):\n\n```\n```python\nimport random\nprint(\"\
    >>>>>>>>>>>>Random Word Finder<<<<<<<<<<<<<\")\nprint(\"\\nUsing a 466K English\
    \ word text file I can pick any words at random.\\n\")\nwds=int(input(\"\\nHow\
    \ many words shall I choose? \"))\nwith open(\"/home/pi/Downloads/words.txt\"\
    , \"rt\") as f:\n    words = f.readlines()\nwords = [w.rstrip() for w in words]\n\
    print(\"----------------\")\nfor w in random.sample(words, wds):\n    print(w)\n\
    print(\"----------------\")\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_5.png)\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_72_6.png)"
  merge: -1
  img_proc: true
- pgno: 73
  md: "# Tkinter Module\n\nWhile running your code from the command line, or even\
    \ in the Shell, is perfectly fine, Python is capable of so much more. The Tkinter\
    \ module enables the programmer to set up a Graphical User Interface to interact\
    \ with the user, and it’s surprisingly powerful too.\n\n# GETTING GUI\n\nTkinter\
    \ is easy to use but there’s a lot more you can do with it. Let’s start by seeing\
    \ how it works and getting some code into it. Before long you will discover just\
    \ how powerful this module really is.\n\n# STEP 1\n\nTkinter is usually built\
    \ into Python 3. However, if it’s available when you enter: import tkinter, then\
    \ you need to pip install tkinter from the command prompt. We can start to import\
    \ modules differently than before, to save on typing and by importing all their\
    \ contents:\n\n```\nimport tkinter as tk\nfrom tkinter import *\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_0.png)\n\
    \n# STEP 3\n\nThe ideal approach is to add mainloop() into the code to control\
    \ the Tkinter event loop, but we’ll get to that soon. You’ve just created a Tkinter\
    \ widget and there are several more we can play around with:\n\n```\nbtn=Button()\n\
    btn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\n```\n\nThe first line focuses on\
    \ the newly created window. Click back into the Shell and continue the other lines.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_1.png)\n\n# STEP 2\n\nIt’s not recommended\
    \ to import everything from a module using the asterisk but it won’t do any harm\
    \ normally. Let’s begin by creating a basic GUI window, enter:\n\n```\nwind=Tk()\n\
    ```\n\nThis creates a small, basic window. There’s not much else to do at this\
    \ point but click the X in the corner to close the window.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_2.png)\n\
    \n# STEP 4\n\nYou can combine the above into a New File:\n\n```\nimport tkinter\
    \ as tk\nfrom tkinter import *\nbtn=Button()\nbtn.pack()\nbtn[\"text\"]=\"Hello\
    \ everyone!\"\n```\n\nThen add some button interactions:\n\n```\ndef click():\n\
    \    print(\"You just clicked me!\")\nbtn[\"command\"]=click\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_3.png)"
  merge: -1
  img_proc: true
- pgno: 74
  md: "# STEP 5\n\nSave and execute the code from Step 4 and a window appears with\
    \ 'Hello everyone!' inside. If you click the Hello everyone! button, the Shell\
    \ will output the text 'You just clicked me!'. It's simple but shows you what\
    \ can be achieved with a few lines of code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_0.png)\n\
    \n# STEP 6\n\nYou can also display both text and images within a Tkinter window.\
    \ However, only GIF, PGM or PPM formats are supported. So find an image and convert\
    \ it before using the code. Here's an example using the BDM Publishing logo:\n\
    \n```\nfrom tkinter import *\nroot = Tk()\nlogo = PhotoImage(file=\"/home/pi/Downloads/BDM_logo.gif\"\
    )\nw1 = Label(root, root.title(\"BDM Publications\"), image=logo).pack(side=\"\
    right\")\ncontent = \"\"\" From its humble beginnings in 2004, the BDM brand quickly\
    \ grew from a single publication produced by a team of just two to one of the\
    \ biggest names in global bookazine publishing, for two simple reasons. Our passion\
    \ and commitment to deliver the very best product each and every volume. While\
    \ the company has grown with a portfolio of over 250 publications delivered by\
    \ our international staff, the foundation that it has been built upon remains\
    \ the same, which is why we believe BDM isn't just the first choice it's the only\
    \ choice for the smart consumer. \"\"\"\nw2 = Label(root, justify=LEFT, padx =\
    \ 10, text=content).pack(side=\"left\")\nroot.mainloop()\n```\n\n# STEP 7\n\n\
    The previous code is quite weighty, mostly due to the content variable holding\
    \ a part of BDM's About page from the company website. You can obviously change\
    \ the content, the root.title and the image to suit your needs.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_1.png)\n\
    \n# STEP 8\n\nYou can create radio buttons too. Try:\n\n```\nfrom tkinter import\
    \ *\nroot = Tk()\nv = IntVar()\nLabel(root, root.title(\"Options\"), text=\"\"\
    \"Choose a preferred language:\"\"\", justify = LEFT, padx = 20).pack()\nRadiobutton(root,\
    \ text=\"Python\", padx = 20, variable=v, value=1).pack(anchor=W)\nRadiobutton(root,\
    \ text=\"C++\", padx = 20, variable=v, value=2).pack(anchor=W)\nmainloop()\n```\n\
    \n# STEP 9\n\nYou can also create check boxes, with buttons and output to the\
    \ Shell:\n\n```\nfrom tkinter import *\nroot = Tk()\ndef var_states():\n    print(\"\
    Warrior: %d,\\nMage: %d\" % (var1.get(), var2.get()))\nLabel(root, root.title(\"\
    Adventure Game\"), text=\">>>>>>>>>Your adventure role<<<<<<<<<<\").grid(row=0,\
    \ sticky=N)\nvar1 = IntVar()\nCheckbutton(root, text=\"Warrior\", variable=var1).grid(row=1,\
    \ sticky=W)\nvar2 = IntVar()\nCheckbutton(root, text=\"Mage\", variable=var2).grid(row=2,\
    \ sticky=W)\nButton(root, text='Quit', command=root.destroy).grid(row=3, sticky=W,\
    \ pady=4)\nButton(root, text='Show', command=var_states).grid(row=3, sticky=E,\
    \ pady=4)\nmainloop()\n```\n\n# STEP 10\n\nThe code from Step 9 introduced some\
    \ new geometry elements into Tkinter. Note the sticky=N, E and W arguments. These\
    \ describe the locations of the check boxes and buttons (North, East, South and\
    \ West). The row argument places them on separate rows. Have a play around and\
    \ see what you get.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_2.png)"
