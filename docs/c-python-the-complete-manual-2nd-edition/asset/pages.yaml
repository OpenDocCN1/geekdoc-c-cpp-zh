- pgno: 21
  md: '# Starting Python for the First Time


    We’re going to be using the Raspberry Pi as our Python 3 hardware platform. The
    latest version of Raspbian comes preinstalled with Python 3, version 3.4.2 to
    be exact, so as long as you have a version 3 Shell, all our code will work.


    # STARTING PYTHON


    We’re not going to go into the details of getting the Raspberry Pi up and running,
    there’s plenty of material already available on that subject. However, once you’re
    ready, fire up your Pi and get ready for coding.


    STEP 1 With the Raspbian desktop loaded, click on the Menu button followed by
    Programming > Python 3 (IDLE). This opens the Python 3 Shell. Windows and Mac
    users can find the Python 3 IDLE Shell from within the Windows Start button menu
    and via Finder.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_21_0.png)


    STEP 3 For example, in the Shell enter: 2+2 After pressing Enter, the next line
    displays the answer: 4. Basically, Python has taken the ‘code’ and produced the
    relevant output.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_21_1.png)


    STEP 2 The Shell is where you can enter code and see the responses and output
    of code you’ve programmed into Python. This is a kind of sandbox, where you’re
    able to try out some simple code and processes.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_21_2.png)


    STEP 4 The Python Shell acts very much like a calculator, since code is basically
    a series of mathematical interactions with the system. Integers, which are the
    infinite sequence of whole numbers can easily be added, subtracted, multiplied
    and so on.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_21_3.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Starting Python for the First Time


    # STEP 5


    While that’s very interesting, it’s not particularly exciting. Instead, try this:


    ```

    print("Hello everyone!")

    ```


    Just like the code we entered in Sublime in the Installing a Text Editor section
    of this book.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_22_0.png)


    # STEP 6


    This is a little more like it, since you’ve just produced your first bit of code.
    The Print command is fairly self-explanatory, it prints things. Python 3 requires
    the brackets as well as quote marks in order to output content to the screen,
    in this case the ‘Hello everyone!’ bit.


    ```

    >>> print("Hello everyone!")

    Hello everyone!

    >>>

    ```


    # STEP 7


    You may have noticed the colour coding within the Python IDLE. The colours represent
    different elements of Python code. They are:


    +   - Black – Data and Variables

    +   - Green – Strings

    +   - Purple – Functions

    +   - Orange – Commands

    +   - Blue – User Functions

    +   - Dark Red – Comments

    +   - Light Red – Error Messages


    # IDLE Colour Coding


    | Colour | Use for | Examples |

    | Black | Data & variables | 23.6 area |

    | Green | Strings | "Hello World" |

    | Purple | Functions | len() print() |

    | Orange | Commands | if for else |

    | Blue | User functions | get_area() |

    | Dark red | Comments | #Remember VAT |

    | Light red | Error messages | SyntaxError: |


    # STEP 8


    The Python IDLE is a configurable environment. If you don’t like the way the colours
    are represented, then you can always change them via Options > Configure IDLE
    and clicking on the Highlighting tab. However, we don’t recommend that, as you
    won’t be seeing the same as our screenshots.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_22_1.png)


    # STEP 9


    Just like most programs available, regardless of the operating system, there are
    numerous shortcut keys available. We don’t have room for them all here but within
    the Options > Configure IDLE and under the Keys tab, you can see a list of the
    current bindings.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_22_2.png)


    # STEP 10


    The Python IDLE is a power interface and one that’s actually been written in Python
    using one of the available GUI toolkits. If you want to know the many ins and
    outs of the Shell, we recommend you take a few moments to view www.docs.python.org/3/library/idle.html,
    which details many of the IDLE’s features.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_22_3.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# # Your First Code


    Essentially, you''ve already written your first piece of code with the `print(“Hello
    everyone!”)` function from the previous tutorial. However, let''s expand that
    and look at entering your code and playing around with some other Python examples.


    # ## PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing these words,
    so you need to learn them.


    **STEP 1** If you''ve closed Python 3 IDLE, reopen it in whichever operating system
    version you prefer. In the Shell, enter the familiar following:


    ```

    ```python

    print("Hello")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_23_0.png)


    **STEP 2** Just as predicted, the word Hello appears in the Shell as blue text,
    indicating output from a string. It''s fairly straightforward and doesn''t require
    too much explanation. Now try:


    ```

    ```python

    print("2+2")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_23_1.png)


    **STEP 3** You can see that instead of the number 4, the output is the 2+2 you
    asked to be printed to the screen. The quotation marks are defining what''s being
    outputted to the IDLE Shell; to print the total of 2+2 you need to remove the
    quotes:


    ```

    ```python

    print(2+2)

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_23_2.png)


    **STEP 4** You can continue as such, printing 2+2, 464+2343 and so on to the Shell.
    An easier way is to use a variable, which is something we will cover in more depth
    later. For now, enter:


    ```

    ```python

    a=2

    b=2

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_23_3.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# STEP 5


    What you have done here is assign the letters a and b two values: 2 and 2. These
    are now variables, which can be called upon by Python to output, add, subtract,
    divide and so on for as long as their numbers stay the same. Try this:


    ```

    print(a)

    print(b)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_0.png)


    # STEP 6


    The output of the last step displays the current values of both a and b individually,
    as you’ve asked them to be printed separately. If you want to add them up, you
    can use the following:


    ```

    print(a+b)

    ```


    This code simply takes the values of a and b, adds them together and outputs the
    result.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_1.png)


    # STEP 7


    You can play around with different kinds of variables and the Print function.
    For example, you could assign variables for someone’s name:


    ```

    name="David"

    print(name)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_2.png)


    # STEP 8


    Now let’s add a surname:

    surname="Hayward"

    print(surname)


    You now have two variables containing a first name and a surname and you can print
    them independently.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_3.png)


    # STEP 9


    If we were to apply the same routine as before, using the + symbol, the name wouldn’t
    appear correctly in the output in the Shell. Try it:


    ```

    print(name+surname)

    ```


    You need a space between the two, defining them as two separate values and not
    something you mathematically play around with.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_4.png)


    # STEP 10


    In Python 3 you can separate the two variables with a space using a comma:


    ```

    print(name, surname)

    ```


    Alternatively, you can add the space yourself:


    ```

    print(name+" "+surname)

    ```


    The use of the comma is much neater, as you can see. Congratulations, you’ve just
    taken your first steps into the wide world of Python.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_24_5.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Saving and Executing Your Code


    Whilst working in the IDLE Shell is perfectly fine for small code snippets, it’s
    not designed for entering longer program listings. In this section you’re going
    to be introduced to the IDLE Editor, where you will be working from now on.


    # EDITING CODE


    You will eventually reach a point where you have to move on from inputting single
    lines of code into the Shell. Instead, the IDLE Editor will allow you to save
    and execute your Python code.


    STEP 1 First, open the Python IDLE Shell and when it’s up, click on File > New
    File. This will open a new window with Untitled as its name. This is the Python
    IDLE Editor and within it you can enter the code needed to create your future
    programs.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_25_0.png)


    STEP 3 You can see that the same colour coding is in place in the IDLE Editor
    as it is in the Shell, enabling you to better understand what’s going on with
    your code. However, to execute the code you need to first save it. Press F5 and
    you get a Save…Check box open.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_25_1.png)


    STEP 2 The IDLE Editor is, for all intents and purposes, a simple text editor
    with Python features, colour coding and so on; much in the same vein as Sublime.
    You enter code as you would within the Shell, so taking an example from the previous
    tutorial, enter:


    ```

    print("Hello everyone!")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_25_2.png)


    STEP 4 Click on the OK button in the Save box and select a destination where you’ll
    save all your Python code. The destination can be a dedicated folder called Python
    or you can just dump it wherever you like. Remember to keep a tidy drive though,
    to help you out in the future.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_25_3.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# STEP 5


    Enter a name for your code, ‘print hello’ for example, and click on the Save button.
    Once the Python code is saved it’s executed and the output will be detailed in
    the IDLE Shell. In this case, the words ‘Hello everyone!’.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_0.png)


    # STEP 6


    This is how the vast majority of your Python code will be conducted. Enter it
    into the Editor, hit F5, save the code and look at the output in the Shell. Sometimes
    things will differ, depending on whether you’ve requested a separate window, but
    essentially that’s the process. It’s the process we will use throughout this book,
    unless otherwise stated.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_1.png)


    # STEP 7


    If you open the file location of the saved Python code, you can see that it ends
    in a .py extension. This is the default Python file name. Any code you create
    will be whatever.py and any code downloaded from the many Internet Python resource
    sites will be .py. Just ensure that the code is written for Python 3.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_2.png)


    # STEP 8


    Let’s extend the code and enter a few examples from the previous tutorial:


    ```

    a=2

    b=2

    name="David"

    surname="Hayward"

    print(name, surname)

    print (a+b)

    ```


    If you press F5 now you’ll be asked to save the file, again, as it’s been modified
    from before.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_3.png)


    # STEP 9


    If you click the OK button, the file will be overwritten with the new code entries,
    and executed, with the output in the Shell. It’s not a problem with just these
    few lines but if you were to edit a larger file, overwriting can become an issue.
    Instead, use File > Save As from within the Editor to create a backup.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_4.png)


    # STEP 10


    Now create a new file. Close the Editor, and open a new instance (File > New File
    from the Shell).

    Enter the following and save it as hello.py:


    ```

    a="Python"

    b="is"

    c="cool!"

    print(a, b, c)

    ```


    You will use this code in the next tutorial.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_26_5.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Executing Code from the Command Line


    Although we’re working from the GUI IDLE throughout this book, it’s worth taking
    a look at Python’s command line handling. We already know there’s a command line
    version of Python but it’s also used to execute code.


    # COMMAND THE CODE


    Using the code we created in the previous tutorial, the one we named hello.py,
    let’s see how you can run code that was made in the GUI at the command line level.


    STEP 1

    Python, in Linux, comes with two possible ways of executing code via the command
    line. One of the ways is with Python 2, whilst the other uses the Python 3 libraries
    and so on. First though, drop into the command line or Terminal on your operating
    system.


    STEP 3

    Now you’re at the command line we can start Python. For Python 3 you need to enter
    the command python3 and press Enter. This will put you into the command line version
    of the Shell, with the familiar three right-facing arrows as the cursor (>>>).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_27_0.png)


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_27_1.png)


    STEP 2

    Just as before, we’re using a Raspberry Pi; Windows users will need to click the
    Start button and search for CMD, then click the Command Line returned search;
    and macOS users can get access to their command line by clicking Go > Utilities
    > Terminal.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_27_2.png)


    STEP 4

    From here you’re able to enter the code you’ve looked at previously, such as:


    ```

    a=2

    print(a)

    ```


    You can see that it works exactly the same.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_27_3.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Executing Code from the Command Line


    # STEP 5


    Now enter: exit() to leave the command line Python session and return you back
    to the command prompt. Enter the folder where you saved the code from the previous
    tutorial and list the available files within; hopefully you should see the hello.py
    file.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_0.png)


    # STEP 6


    From within the same folder as the code you’re going to run, enter the following
    into the command line:


    ```

    python3 hello.py

    ```


    This will execute the code we created, which to remind you is:


    ```

    a="Python"

    b="is"

    c="cool!"

    print(a, b, c)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_1.png)


    # STEP 7


    Naturally, since this is Python 3 code, using the syntax and layout that’s unique
    to Python 3, it only works when you use the python3 command. If you like, try
    the same with Python 2 by entering:


    ```

    python hello.py

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_2.png)


    # STEP 8


    The result of running Python 3 code from the Python 2 command line is quite obvious.
    Whilst it doesn’t error out in any way, due to the differences between the way
    Python 3 handles the Print command over Python 2, the result isn’t as we expected.
    Using Sublime for the moment, open the hello.py file.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_3.png)


    # STEP 9


    Since Sublime Text isn’t available for the Raspberry Pi, you’re going to temporarily
    leave the Pi for the moment and use Sublime as an example that you don’t necessarily
    need to use the Python IDLE. With the hello.py file open, alter it to include
    the following:


    ```

    name=input("What is your name? ")

    print("Hello,", name)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_4.png)


    # STEP 10


    Save the hello.py file and drop back to the command line. Now execute the newly
    saved code with:


    ```

    python3 hello.py

    ```


    The result will be the original Python is cool statement, together with the added
    input command asking you for your name, and displaying it in the command window.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_5.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Numbers and Expressions


    We’ve seen some basic mathematical expressions with Python, simple addition and
    the like. Let’s expand on that now and see just how powerful Python is as a calculator.
    You can work within the IDLE Shell or in the Editor, whichever you like.


    # IT’S ALL MATHS, MAN


    You can get some really impressive results with the mathematical powers of Python;
    as with most, if not all, programming languages, maths is the driving force behind
    the code.


    # STEP 1


    Open up the GUI version of Python 3, as mentioned you can use either the Shell
    or the Editor. For the time being, you’re going to use the Shell just to warm
    our maths muscle, which we believe is a small gland located at the back of the
    brain (or not).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_29_0.png)


    # STEP 3


    You can use all the usual mathematical operations: divide, multiply, brackets
    and so on. Practise with a few, for example:


    +   1/2

    +   6/2

    +   2+2*3

    +   (1+2)+(3*4)


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_29_1.png)


    # STEP 2


    In the Shell enter the following:


    +   2+2

    +   54356+34553245

    +   99867344*27344484221


    You can see that Python can handle some quite large numbers.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_29_2.png)


    # STEP 4


    You’ve no doubt noticed, division produces a decimal number. In Python these are
    called floats, or floating point arithmetic. However, if you need an integer as
    opposed to a decimal answer, then you can use a double slash:


    +   1//2

    +   6//2


    And so on.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_29_3.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# STEP 5


    You can also use an operation to see the remainder left over from division. For
    example:


    ```

    10/3

    ```


    Will display 3.333333333, which is of course 3.3-recurring. If you now enter:


    ```

    10%3

    ```


    This will display 1, which is the remainder left over from dividing 10 into 3.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_0.png)


    # STEP 6


    Next up we have the power operator, or exponentiation if you want to be technical.
    To work out the power of something you can use a double multiplication symbol
    or double-star on the keyboard:


    ```

    2**3

    10**10

    ```


    Essentially, it''s 2x2x2 but we''re sure you already know the basics behind maths
    operators. This is how you would work it out in Python.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_1.png)


    # STEP 7


    Numbers and expressions don''t stop there. Python has numerous built-in functions
    to work out sets of numbers, absolute values, complex numbers and a host of mathematical
    expressions and Pythagorean tongue-twisters. For example, to convert a number
    to binary, use:


    ```

    bin(3)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_2.png)


    # STEP 8


    This will be displayed as ''0b11'', converting the integer into binary and adding
    the prefix 0b to the front. If you want to remove the 0b prefix, then you can
    use:


    ```

    format(3, ''b'')

    ```


    The Format command converts a value, the number 3, to a formatted representation
    as controlled by the format specification, the ''b'' part.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_3.png)


    # STEP 9


    A Boolean Expression is a logical statement that will either be true or false.
    We can use these to compare data and test to see if it''s equal to, less than
    or greater than. Try this in a New File:


    ```

    a = 6

    b = 7

    print(1, a == 6)

    print(2, a == 7)

    print(3, a == 6 and b == 7)

    print(4, a == 7 and b == 7)

    print(5, not a == 7 and b == 7)

    print(6, a == 7 or b == 7)

    print(7, a == 7 or b == 6)

    print(8, not (a == 7 and b == 6))

    print(9, not a == 7 and b == 6)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_4.png)


    # STEP 10


    Execute the code from Step 9, and you can see a series of True or False statements,
    depending on the result of the two defining values: 6 and 7. It''s an extension
    of what you''ve looked at, and an important part of programming.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_30_5.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Using Comments


    When writing your code, the flow of it, what each variable does, how the overall
    program will operate and so on is all inside your head. Another programmer could
    follow the code line by line but over time, it can become difficult to read.


    # #COMMENTS!


    Programmers use a method of keeping their code readable by commenting on certain
    sections. If a variable is used, the programmer comments on what it’s supposed
    to do, for example. It’s just good practise.


    STEP 1 Start by creating a new instance of the IDLE Editor (File > New File) and
    create a simple variable and print command:


    ```

    a=10

    print("The value of A is,", a)

    ```


    Save the file and execute the code.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_31_0.png)


    STEP 3 Resave the code and execute it. You can see that the output in the IDLE
    Shell is still the same as before, despite the extra lines being added. Simply
    put, the hash symbol (#) denotes a line of text the programmer can insert to inform
    them, and others, of what’s going on without the user being aware.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_31_1.png)


    STEP 2 Running the code will return the line: The value of A is, 10 into the IDLE
    Shell window, which is what we expected. Now, add some of the types of comments
    you’d normally see within code:


    ```

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_31_2.png)


    STEP 4 Let’s assume that the variable A that we’ve created is the number of lives
    in a game. Every time the player dies, the value is decreased by 1. The programmer
    could insert a routine along the lines of:


    ```

    a=a-1

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_31_3.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# STEP 5


    Whilst we know that the variable A is lives, and that the player has just lost
    one, a casual viewer or someone checking the code may not know. Imagine for a
    moment that the code is twenty thousand lines long, instead of just our seven.
    You can see how handy comments are.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_0.png)


    # STEP 6


    Essentially, the new code together with comments could look like:


    ```

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    # Player lost a life!

    a=a-1

    # Inform player, and display current value of A (lives)

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_1.png)


    # STEP 7


    You can use comments in different ways. For example, Block Comments are a large
    section of text that details what’s going on in the code, such as telling the
    code reader what variables you’re planning on using:


    ```

    # This is the best game ever, and has been developed by a crack squad of Python
    experts

    # who haven’t slept or washed in weeks. Despite being very smelly, the code at
    least

    # works really well.

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_2.png)


    # STEP 8


    Inline comments are comments that follow a section of code. Take our examples
    from above, instead of inserting the code on a separate line, we could use:


    ```

    a=10 # Set the start value of A to 10

    print("The value of A is,", a) # Print the current value of A

    a=a-1 # Player lost a life!

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!") # Inform player, and display current value
    of A (lives)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_3.png)


    # STEP 9


    The comment, the hash symbol, can also be used to comment out sections of code
    you don’t want to be executed in your program. For instance, if you wanted to
    remove the first print statement, you would use:


    ```

    # print("The value of A is,", a)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_4.png)


    # STEP 10


    You also use three single quotes to comment out a Block Comment or multi-line
    section of comments. Place them before and after the areas you want to comment
    for them to work:


    ```

    ''''''

    This is the best game ever, and has been developed by a crack squad of Python
    experts who haven’t slept or washed in weeks. Despite being very smelly, the code
    at least works really well.

    ''''''

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_5.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Working with Variables


    We’ve seen some examples of variables in our Python code already but it’s always
    worth going through the way they operate and how Python creates and assigns certain
    values to a variable.


    # VARIOUS VARIABLES


    You’ll be working with the Python 3 IDLE Shell in this tutorial. If you haven’t
    already, open Python 3 or close down the previous IDLE Shell to clear up any old
    code.


    STEP 1 In some programming languages you’re required to use a dollar sign to denote
    a string, which is a variable made up of multiple characters, such as a name of
    a person. In Python this isn’t necessary. For example, in the Shell enter: name="David
    Hayward" (or use your own name, unless you’re also called David Hayward).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_33_0.png)


    STEP 2 You can check the type of variable in use by issuing the type() command,
    placing the name of the variable inside the brackets. In our example, this would
    be: type(name). Add a new string variable: title="Descended from Vikings".


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_33_1.png)


    STEP 3 You’ve seen previously that variables can be concatenated using the plus
    symbol between the variable names. In our example we can use: print(name + ":
    " + title). The middle part between the quotations allows us to add a colon and
    a space, as variables are connected without spaces, so we need to add them manually.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_33_2.png)


    STEP 4 You can also combine variables within another variable. For example, to
    combine both name and title variables into a new variable we use: character=name
    + ": " + title


    ```

    character=name + ": " + title

    ```


    Then output the content of the new variable as:


    ```

    print(character)

    ```


    Numbers are stored as different variables:


    ```

    age=44

    ```


    ```

    Type(age)

    ```


    Which, as we know, are integers.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_33_3.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# STEP 5\n\nHowever, you can't combine both strings and integer type variables\
    \ in the same command, as you would a set of similar variables. You need to either\
    \ turn one into the other or vice versa. When you do try to combine both, you\
    \ get an error message:\n\n```\nprint (name + age)\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_0.png)\n\
    \n# STEP 6\n\nThis is a process known as TypeCasting. The Python code is:\n\n\
    ```\nprint (character + \" is \" + str(age) + \" years old.\")\n```\n\nor you\
    \ can use:\n\n```\nprint (character, \"is\", age, \"years old.\")\n```\n\nNotice\
    \ again that in the last example, you don't need the spaces between the words\
    \ in quotes as the commas treat each argument to print separately.\n\n```\n>>>\
    \ print (name + age)\nTraceback (most recent call last):\n  File \"<pyshell#18>\"\
    , line 1, in <module>\n    print (name + age)\nTypeError: Can't convert 'int'\
    \ object to str implicitly\n>>> print (character + \" is \" + str(age) + \" years\
    \ old.\")\nDavid Hayward: Descended from Vikings is 44 years old.\n>>> print (character,\
    \ \"is\", age, \"years old.\")\nDavid Hayward: Descended from Vikings is 44 years\
    \ old.\n```\n\n# STEP 7\n\nAnother example of TypeCasting is when you ask for\
    \ input from the user, such as a name. for example, enter:\n\n```\nage= input\
    \ (\"How old are you? \")\n```\n\nAll data stored from the Input command is stored\
    \ as a string variable.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_1.png)\n\
    \n# STEP 8\n\nThis presents a bit of a problem when you want to work with a number\
    \ that's been inputted by the user, as age + 10 won't work due to being a string\
    \ variable and an integer. Instead, you need to enter:\n\n```\nint(age) + 10\n\
    ```\n\nThis will TypeCast the age string into an integer that can be worked with.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_2.png)\n\n# STEP 9\n\nThe use of\
    \ TypeCasting is also important when dealing with floating point arithmetic; remember:\
    \ numbers that have a decimal point in them. For example, enter:\n\n```\nshirt=19.99\n\
    ```\n\nNow enter type(shirt) and you'll see that Python has allocated the number\
    \ as a 'float', because the value contains a decimal point.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_3.png)\n\
    \n# STEP 10\n\nWhen combining integers and floats Python usually converts the\
    \ integer to a float, but should the reverse ever be applied it's worth remembering\
    \ that Python doesn't return the exact value. When converting a float to an integer,\
    \ Python will always round down to the nearest integer, called truncating; in\
    \ our case instead of 19.99 it becomes 19.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_4.png)"
