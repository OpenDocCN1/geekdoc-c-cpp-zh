- pgno: 87
  md: '# # How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is Code::Blocks.


    # ## CODE::BLOCKS


    Code::Blocks is a free C++, C and Fortran IDE that''s feature rich and easily
    extendable with plug-ins. It''s easy to use, comes with a compiler and has a vibrant
    community behind it.




    Start by visiting the Code::Blocks download site, at www.codeblocks.org/downloads.
    From there, click on the ''Download the binary releases'' link to be taken to
    the latest downloadable version for Windows.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_0.png)




    You can see that there are several Windows versions available. The one you want
    to download has ''mingw-setup.exe'' at the end of the current version number.
    At the time of writing this is: codeblocks-17.12mingw-setup.exe. The difference
    is that the mingw-setup version includes a C++ compiler and debugger from TDM-GCC
    (a compiler suite).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_1.png)




    When you''ve located the file, click on the Sourceforge.net link at the end of
    the line and a download notification window appears; click on Save File to start
    the download and save the executable to your PC. Locate the downloaded Code::Blocks
    installer and double-click to start. Follow the on-screen instructions to begin
    the installation.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_2.png)




    Once you''ve agreed to the licencing terms, there is a choice of installation
    options available. You can opt for a smaller install, missing out on some of the
    components but we would recommend you opt for the Full option as default.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_3.png)'
