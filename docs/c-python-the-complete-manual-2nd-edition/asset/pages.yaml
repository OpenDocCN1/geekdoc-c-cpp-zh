- pgno: 119
  md: "# Defining Constants\n\nConstants are fixed values in your code. They can be\
    \ any basic data type but as the name suggests their value remains constant throughout\
    \ the entire code. There are two separate ways to define a constant in C++, the\
    \ #define pre-processor and const.\n\n# #DEFINE\n\nThe pre-processors are instructions\
    \ to the compiler to pre-process the information before it goes ahead and compiles\
    \ the code. #include is a pre-processor as is #define.\n\nSTEP 1 You can use the\
    \ #define pre-processor to define any constants you want in our code. Start by\
    \ creating a new C++ file complete with the usual headers:\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_119_0.png)\n\
    \nSTEP 3 Note the capitals for defined constants, it's considered good programming\
    \ practise to define all constants in capitals. Here, the assigned values are\
    \ 50, 40 and 60, so let's call them up:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\n#define LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\nint main ()\n\
    {\n    cout << \"Length is: \" << LENGTH << \"\\n\";\n    cout << \"Width is:\
    \ \" << WIDTH << \"\\n\";\n    cout << \"Height is: \" << HEIGHT << \"\\n\";\n\
    }\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_119_1.png)\n\nSTEP 2 Now let's\
    \ assume your code has three different constants: length, width and height. You\
    \ can define them with:\n\n```\n#include <iostream>\nusing namespace std;\n#define\
    \ LENGTH 50\n#define WIDTH 40\n#define HEIGHT 60\n\nint main ()\n{\n}\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_119_2.png)\n\nSTEP 4 Build and run the\
    \ code. Just as expected, it displays the values for each of the constants created.\
    \ It's worth noting that you don't need a semicolon when you're defining a constant\
    \ with the #define keyword.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_119_3.png)"
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Defining Constants


    STEP 5 You can also define other elements as a constant. For example, instead
    of using \n for a newline in the cout statement, you can define it at the start
    of the code:


    ```

    ```cpp

    #include <iostream>

    using namespace std;

    #define LENGTH 50

    #define WIDTH 40

    #define HEIGHT 60

    #define NEWLINE ''\n''

    int main ()

    {

    cout << "Length is: " << LENGTH << NEWLINE;

    cout << "Width is: " << WIDTH << NEWLINE;

    cout << "Height is: " << HEIGHT << NEWLINE;

    }

    ```

    ```


    STEP 6 The code, when built and executed, does exactly the same as before, using
    the new constant NEWLINE to insert a newline in the cout statement. Incidentally,
    creating a newline constant isn''t a good idea unless you''re making it smaller
    than \n or even the end command.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_120_0.png)


    STEP 7 Defining a constant is a good way of initialising your base values at the
    start of your code. You can define that your game has three lives, or even the
    value of PI without having to call up the C++ math library:


    ```

    ```cpp

    #include <iostream>

    using namespace std;

    #define PI 3.14159

    int main ()

    {

    cout << "The value of Pi is: " << PI << endl;

    }

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_120_1.png)


    STEP 8 Another method of defining a constant is with the const keyword. Use const
    together with a data type, variable and value: const type variable = value. Using
    PI as an example:


    ```

    ```cpp

    #include <iostream>

    using namespace std;

    int main ()

    {

    const double PI = 3.14159;

    cout << "The value of Pi is: " << PI << endl;

    }

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_120_2.png)


    STEP 9 Because you''re using const within the main block of code, you need to
    finish the line with a semicolon. You can use either, as long as the names and
    values don''t clash, but it''s worth mentioning that #define requires no memory,
    so if you''re coding to a set amount of memory, #define is your best bet.


    STEP 10 Const works in much the same way as #define. You can create static integers
    and even newlines:


    ```

    ```cpp

    #include <iostream>

    using namespace std;

    int main()

    {

    const int LENGTH = 50;

    const int WIDTH = 40;

    const char NEWLINE = ''\n'';

    int area;

    area = LENGTH * WIDTH;

    cout << "Area is: " << area << NEWLINE;

    }

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_120_3.png)'
