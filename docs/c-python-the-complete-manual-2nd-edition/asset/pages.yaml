- pgno: 59
  md: '# Writing to Files


    The ability to read external files within Python is certainly handy but writing
    to a file is better still. Using the write() function, you’re able to output the
    results of a program to a file, that you can then read() back into Python.


    # WRITE AND CLOSE


    The write() function is slightly more complex than read(). Along with the filename
    you must also include an access mode which determines whether the file in question
    is in read or write mode.


    # STEP 1


    Start by opening IDLE and enter the following:


    ```

    t=open("/home/pi/Documents/text.txt","w")

    ```


    Change the destination from /home/pi/Documents to your own system. This code will
    create a text file called text.txt in write mode using the variable ‘t’. If there’s
    no file of that name in the location, it will create one. If one already exits,
    it will overwrite it, so be careful.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_59_0.png)


    # STEP 3


    However, the actual text file is still blank (you can check by opening it up).
    This is because you’ve written the line of text to the file object but not committed
    it to the file itself. Part of the write() function is that you need to commit
    the changes to the file; you can do this by entering:


    ```

    t.close()

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_59_1.png)


    # STEP 2


    You can now write to the text file using the write() function. This works opposite
    to read(), writing lines instead of reading them. Try this:


    ```

    t.write("You awake in a small, square room. A single table stands to one side,
    there is a locked door in front of you.")

    ```


    Note the 109. It’s the number of characters you’ve entered.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_59_2.png)


    # STEP 4


    If you now open the text file with a text editor, you can see that the line you
    created has been written to the file. This gives us the foundation for some interesting
    possibilities: perhaps the creation of your own log file or even the beginning
    of an adventure game.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_59_3.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Writing to Files


    To expand this code, you can reopen the file using ''a'', for access or append
    mode. This will add any text at the end of the original line instead of wiping
    the file and creating a new one. For example:


    ```

    ```python

    t=open("/home/pi/Documents/text.txt","a")

    t.write("\n")

    t.write("You stand and survey your surroundings. On top of the table is some meat,
    and a cup of water.\n")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_0.png)


    You can keep extending the text line by line, ending each with a new line (\n).
    When you''re done, finish the code with t.close() and open the file in a text
    editor to see the results:


    ```

    ```python

    t.write("The door is made of solid oak with iron strips. It''s bolted from the
    outside, locking you in. You are a prisoner!\n")

    t.close()

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_1.png)


    There are various types of file access to consider using the open() function.
    Each depends on how the file is accessed and even the position of the cursor.
    For example, r+ opens a file in read and write and places the cursor at the start
    of the file.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_2.png)


    You can pass variables to a file that you''ve created in Python. Perhaps you want
    the value of Pi to be written to a file. You can call Pi from the math module,
    create a new file and pass the output of Pi into the new file:


    ```

    ```python

    import math

    print("Value of Pi is: ",math.pi)

    print("\nWriting to a file now...")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_3.png)


    Now let''s create a variable called pi and assign it the value of Pi:


    pi=math.pi


    You also need to create a new file in which to write Pi to:


    t=open("/home/pi/Documents/pi.txt","w")


    Remember to change your file location to your own particular system setup.


    ```

    ```python

    pi=math.pi

    t=open("/home/pi/Documents/pi.txt","w")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_4.png)


    To finish, you can use string formatting to call the variable and write it to
    the file, then commit the changes and close the file:


    t.write("Value of Pi is: {}".format(pi))

    t.close()


    You can see from the results that you''re able to pass any variable to a file.


    ```

    ```python

    t.write("Value of Pi is: {}".format(pi))

    t.close()

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_60_5.png)'
