  md: '# # Strings


    Strings are objects that represent and hold sequences of characters. For example,
    you could have a universal greeting in your code ‘Welcome’ and assign that as
    a string to be called up wherever you like in the program.




    There are different ways in which you create a string of characters, which historically
    are all carried over from the original C language, and are still supported by
    C++.




    ```

    ```cpp

    #include <iostream>

    using namespace std;


    int main ()

    {

    }

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_109_0.png)




