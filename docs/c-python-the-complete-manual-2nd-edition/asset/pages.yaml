- pgno: 68
  md: "# STEP 5\n\nYou can also create a program that will display all the days, weeks\
    \ and months within a given year:\n\n```\nimport calendar\nyear=int(input(\"Enter\
    \ the year to display: \"))\nprint(calendar.prcal(year))\n```\n\nWe’re sure you’ll\
    \ agree that’s quite a handy bit of code to have to hand.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_0.png)\n\
    \n# STEP 6\n\nInterestingly we can also list the number of days in a month by\
    \ using a simple for loop:\n\n```\nimport calendar\ncal=calendar.TextCalendar(calendar.SUNDAY)\n\
    for i in cal.itermonthdays(2018, 6):\n    print(i)\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_1.png)\n\
    \n# STEP 7\n\nYou can see that code produced some zeros at the beginning, this\
    \ is due to the starting day of the week, Sunday in this case, and overlapping\
    \ days from the previous month. So the counting of the days will start on Friday\
    \ 1st June 2018 and will total 30 as the output correctly displays.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_2.png)\n\
    \n# STEP 8\n\nYou’re also able to print the individual months or days of the week:\n\
    \n```\nimport calendar\nfor name in calendar.month_name:\n    print(name)\n```\n\
    \n```\nimport calendar\nfor name in calendar.day_name:\n    print(name)\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_3.png)\n\n# STEP 9\n\nThe calendar\
    \ module also allows us to write the functions in HTML, so that you can display\
    \ it on a website. Let’s start by creating a new file:\n\n```\nimport calendar\n\
    cal=open(\"/home/pi/Documents/cal.html\", \"w\")\nc=calendar.HTMLCalendar(calendar.SUNDAY)\n\
    cal.write(c.formatmonth(2018, 1))\ncal.close()\n```\n\nThis code will create an\
    \ HTML file called cal, open it with a browser and it displays the calendar for\
    \ January 2018.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_4.png)\n\n# STEP\
    \ 10\n\nOf course, you can modify that to display a given year as a web page calendar:\n\
    \n```\nimport calendar\nyear=int(input(\"Enter the year to display as a webpage:\
    \ \"))\ncal=open(\"/home/pi/Documents/cal.html\", \"w\")\ncal.write(calendar.HTMLCalendar(calendar.MONDAY).formatyear(year))\n\
    cal.close()\n```\n\nThis code asks the user for a year, then creates the necessary\
    \ webpage. Remember to change your file destination.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_68_5.png)"
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # OS Module


    The OS module allows you to interact directly with the built-in commands found
    in your operating system. Commands vary depending on the OS you''re running, as
    some will work with Windows whereas others will work with Linux and macOS.




    One of the primary features of the OS module is the ability to list, move, create,
    delete and otherwise interact with files stored on the system, making it the perfect
    module for backup code.




    ```

    ```python

    import os

    home=os.getcwd()

    print(home)

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_69_0.png)




    The returned result from printing the variable home is the current user''s home
    folder on the system. In our example that''s ''/home/pi'', it will be different
    depending on the user name you log in as and the operating system you use. For
    example, Windows 10 will output: C:\Program Files (x86)\Python36-32




    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_69_1.png)




    Yet another interesting element to the OS module, is its ability to launch programs
    that are installed in the host system. For instance, if you wanted to launch the
    Chromium browser from within a Python program you can use the command:


    ```

    ```python

    import os

    browser=os.system("/usr/bin/chromium-browser")

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_69_2.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# STEP 5\n\nThe os.system() function is what allows interaction with external\
    \ programs; you can even call up previous Python programs using this method. You\
    \ will obviously need to know the full path and program file name for it to work\
    \ successfully. However, you can use the following:\n\n```\nimport os\nos.system('start\
    \ chrome \"https://www.youtube.com/feed/music\"')\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_0.png)\n\
    \n# STEP 6\n\nFor Step 5’s example we used Windows, to show that the OS module\
    \ works roughly the same across all platforms. In that case, we opened YouTube’s\
    \ music feed page, so it is therefore possible to open specific pages:\n\n```\n\
    import os\nos.system('chromium-browser \"http://bdmpublications.com/\"')\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_1.png)\n\n# STEP 7\n\nNote in the\
    \ previous step’s example the use of single and double quotes. The single quotes\
    \ encase the entire command and launching Chromium, whereas the double quotes\
    \ open the specified page. You can even use variables to call multiple tabs in\
    \ the same browser:\n\n```\nimport os\na=('chromium-browser \"http://bdmpublications.com/\"\
    ')\nb=('chromium-browser \"http://www.google.co.uk\"')\nos.system(a + b)\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_2.png)\n\n# STEP 8\n\nThe ability\
    \ to manipulate directories, or folders if you prefer, is one of the OS module’s\
    \ best features. For example, to create a new directory you can use:\n\n```\n\
    import os\nos.mkdir(\"NEW\")\n```\n\nThis creates a new directory within the Current\
    \ Working Directory, named according to the object in the mkdir function.\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_3.png)\n\n# STEP 9\n\nYou can also\
    \ rename any directories you’ve created by entering:\n\n```\nimport os\nos.rename(\"\
    NEW\", \"OLD\")\n```\n\nTo delete them:\n\n```\nimport os\nos.rmdir(\"OLD\")\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_4.png)\n\n# STEP 10\n\nAnother\
    \ module that goes together with OS is shutil. You can use the shutil module together\
    \ with OS and time to create a time-stamped backup directory, and copy files into\
    \ it:\n\n```\nimport os, shutil, time\nroot_src_dir = r'/home/pi/Documents'\n\
    root_dst_dir = '/home/pi/backup/' + time.asctime()\nfor src_dir, dirs, files in\
    \ os.walk(root_src_dir):\n    dst_dir = src_dir.replace(root_src_dir, root_dst_dir,\
    \ 1)\n    if not os.path.exists(dst_dir):\n        os.makedirs(dst_dir)\n    for\
    \ file_ in files:\n        src_file = os.path.join(src_dir, file_)\n        dst_file\
    \ = os.path.join(dst_dir, file_)\n        if os.path.exists(dst_file):\n     \
    \       os.remove(dst_file)\n        shutil.copy(src_file, dst_dir)\nprint(\"\
    >>>>>>>>>>>Backup complete<<<<<<<<<<<\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_70_5.png)"
  merge: -1
  img_proc: true
