  md: "# Data Types\n\nVariables, as we’ve seen, store information that the programmer\
    \ can then later call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, floating point,\
    \ Boolean, character and so on. It’s widely accepted that there are seven basic\
    \ data types, often called Primitive Built-in Types; however, you can create your\
    \ own data types should the need ever arise within your code.\n\nThe seven basic\
    \ data types are:\n\n| TYPE | COMMAND |\n|---|---|\n| Integer | Integer |\n| Floating\
    \ Point | float |\n| Character | char |\n| Boolean | bool |\n| Double Floating\
    \ Point | double |\n| Wide Character | wchar_t |\n| No Value | void |\n\nThese\
    \ basic types can also be extended using the following modifiers: Long, Short,\
    \ Signed and Unsigned. Basically this means the modifiers can expand the minimum\
    \ and maximum range values for each data type. For example, the int data type\
    \ has a default value range of -2147483648 to 2147483647, a fair value, you would\
    \ agree.\n\nNow, if you were to use one of the modifiers, the range alters:\n\n\
    +   - Unsigned int = 0 to 4294967295\n+   - Signed int = -2147483648 to 2147483647\n\
    +   - Short int = -32768 to 32767\n+   - Unsigned Short int = 0 to 65,535\n+ \
    \  - Signed Short int = -32768 to 32767\n+   - Long int = -2147483647 to 2147483647\n\
    +   - Signed Long int = -2147483647 to 2147483647\n+   - Unsigned Long int = 0\
    \ to 4294967295\n\nNaturally you can get away with using the basic type without\
    \ the modifier, as there’s plenty of range provided with each data type. However,\
    \ it’s considered good C++ programming practise to use the modifiers when possible.\n\
    \nThere are issues when using the modifiers though. Double represents a double-floating\
    \ point value, which you can use for\n\nincredibly accurate numbers but those\
    \ numbers are only accurate up to the fifteenth decimal place. There’s also the\
    \ problem when displaying such numbers in C++ using the cout function, in that\
    \ cout by default only outputs the first five decimal places. You can combat that\
    \ by adding a cout.precision() function and adding a value inside the brackets,\
    \ but even then you’re still limited by the accuracy of the double data type.\
    \ For example, try this code:\n\n```\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.141592653589793238463;\n\nint main()\n{\n    cout << PI;\n}\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_107_0.png)\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_107_1.png)\n\
    \nBuild and run the code and as you can see the output is only 3.14159, representing\
    \ cout’s limitations in this example.\n\nYou can alter the code including the\
    \ aforementioned cout.precision function, for greater accuracy. Take precision\
    \ all the way up to 22 decimal places, with the following code:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\nint\
    \ main()\n{\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: "# Data Types\n\n```\ncout.precision(22);\ncout << PI;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_108_0.png)\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_108_1.png)\n\nAgain, build and run\
    \ the code; as you can see from the command line window, the number represented\
    \ by the variable PI is different to the number you’ve told C++ to use in the\
    \ variable. The output reads the value of PI as 3.141592653589793115998, with\
    \ the numbers going awry from the fifteenth decimal place.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_108_2.png)\n\
    \nThis is mainly due to the conversion from binary in the compiler and that the\
    \ IEEE 754 double precision standard occupies 64-bits of data, of which 52-bits\
    \ are dedicated to the significant (the significant digits in a floating-point\
    \ number) and roughly 3.5-bits are taken holding the values 0 to 9. If you divide\
    \ 53 by 3.5, then you arrive at 15.142857 recurring, which is 15-digits of precision.\n\
    \nTo be honest, if you’re creating code that needs to be accurate to more than\
    \ fifteen decimal places, then you wouldn’t be using C++, you would use some scientific\
    \ specific language with C++ as the connective tissue between the two languages.\n\
    \nYou can create your own data types, using an alias-like system called typedef.\
    \ For example:\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_108_3.png)\n\n```\n\
    #include <iostream>\nusing namespace std;\ntypedef int metres;\nint main()\n{\n\
    \    metres distance;\n    distance = 15;\n    cout << \"distance in metres is:\
    \ \" << distance;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_108_4.png)\n\
    \nThis code when executed creates a new int data type called metres. Then, in\
    \ the main code block, there’s a new variable called distance, which is an integer;\
    \ so you’re basically telling the compiler that there’s another name for int.\
    \ We assigned the value 15 to distance and displayed the output: distance in metres\
    \ is 15.\n\nIt might sound a little confusing to begin with but the more you use\
    \ C++ and create your own code, the easier it becomes."
