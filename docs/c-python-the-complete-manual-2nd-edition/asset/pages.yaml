  md: "# Do... While Loop\n\nA do... while loop differs slightly from that of a for\
    \ or even a while loop. Both for and while set and examine the state of the condition\
    \ at the start of the loop, or the top of the loop if you prefer. However, a do...\
    \ while loop, is similar to a while loop but instead checks the condition at the\
    \ bottom of the loop.\n\n# DO LOOPS\n\nThe good thing about a do... while loop\
    \ is that it’s guaranteed to run through at least once. It’s structure is: do,\
    \ followed by statements, while condition is true. This is how it works.\n\n#\
    \ STEP 1\n\nBegin with a new, blank C++ file and enter the standard headers:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\n}\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_0.png)\n\n# STEP 2\n\nBegin with\
    \ a simple number count:\n\n```\n{\n    int num = 1;\n    do\n    {\n        cout\
    \ << \"Number: \" << num << endl;\n        num = num + 1;\n    }\n    while (num\
    \ < 30 );\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_1.png)\n\
    \n# STEP 3\n\nNow, here’s a look at the structure of a do... while loop. First\
    \ you create an integer called num, with the value of 1. Now the do... while loops\
    \ begins. The code inside the body of the loop is executed at least once, then\
    \ the condition is checked for either true or false.\n\n```\n// Create integer\
    \ with the value of 1\nint num = 1;\n\n// Do... While loops begins\ndo\n{\n  \
    \  cout << \"Number: \" << num << endl; // Display the current value of num\n\
    \    num = num + 1; // Adds 1 to the value of num\n}\nwhile (num < 30 ); // Tests\
    \ the condition of num (true or false)\n```\n\n# STEP 4\n\nIf the condition is\
    \ true, the loop is executed. This continues until the condition is false. When\
    \ the condition has been expressed as false, the loop terminates and the code\
    \ continues. This means you can create a loop where the code continues until the\
    \ user enters a certain character.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_2.png)"
  merge: -1
  img_proc: true
- pgno: 130
  md: "# STEP 5\n\nIf you want code to add up user inputted numbers until the user\
    \ enters zero:\n\n```\n{\n    float number, sum = 0.0;\n    cout << \"**** Program\
    \ to execute a Do... While loop continuously ****\" << endl;\n    cout << \"\\\
    nEnter 0 to stop and display the sum of all the numbers entered\\n\" << endl;\n\
    \    cout << \"\\n------------------------------\\n\" << endl;\n    do {\n   \
    \     cout<<\"\\nPlease enter a number: \";\n        cin>>number;\n        sum\
    \ += number;\n    }\n    while(number != 0.0);\n    cout<<\"Total sum of all numbers:\
    \ \"<<sum;\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_0.png)\n\
    \n# STEP 6\n\nThe code from Step 5 works as follows: two floating point variables\
    \ are assigned, number and sum, both with the value of 0.0. There is a brief set\
    \ of instructions for the user, then the do... while loop begins.\n\n```\nfloat\
    \ number, sum = 0.0;\ncout << \"**** Program to execute a Do... While loop continuously\
    \ ****\" << endl;\ncout << \"\\nEnter 0 to stop and display the sum of all the\
    \ numbers entered\\n\" << endl;\ncout << \"\\n------------------------------\\\
    n\" << endl;\n```\n\n# STEP 7\n\nThe do... while loop in this instance asks the\
    \ user to input a number, which you assigned to the float variable, number. The\
    \ calculation step uses the second floating point variable, sum, which adds the\
    \ value of number every time the user enters a new value.\n\n```\ndo {\n    cout\
    \ << \"\\nPlease enter a number: \";\n    cin >> number;\n    sum += number;\n\
    }\n```\n\n# STEP 8\n\nFinally, the while statement checks the condition of the\
    \ variable number. If the user has entered zero, then the loop is terminated,\
    \ if not then it continues indefinitely. When the user finally enters zero, the\
    \ value of sum, the total value of all the user's input, is displayed. The loop,\
    \ and the program, then ends.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_1.png)\n\
    \n# STEP 9\n\nUsing the countdown and Blast Off! code used previously, a do...\
    \ while loop would look like:\n\n```\n{\n    int a = 10;\n    do {\n        cout\
    \ << a << endl;\n        a = a - 1;\n    }\n    while ( a != 0 );\n    cout <<\
    \ \"\\nBlast Off!\" << endl;\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_2.png)\n\
    \n# STEP 10\n\nThe main advantage of using a do... while loop is because it's\
    \ an exit-condition loop; whereas a while loop is an entry-control loop. Therefore,\
    \ if your code requires a loop that needs to be executed at least once (for example,\
    \ to check the number of lives in a game), then a do... while loop is perfect.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_3.png)"
