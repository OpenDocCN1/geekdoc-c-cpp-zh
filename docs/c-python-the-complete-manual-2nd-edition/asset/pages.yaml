- pgno: 122
  md: '# STEP 5


    The code above is great for opening a file with one or two lines but what if there
    are multiple lines? Here we opened a text file of the poem Cimmeria, by Robert
    E Howard:


    ```

    string line;

    ifstream newfile ("c:\\users\\david\\Documents\\Cimmeria.txt");

    cout << "Cimmeria, by Robert E Howard: \n" << endl;

    while (getline(newfile, line))

    cout << line << endl;

    newfile.close();

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_122_0.png)


    # STEP 6


    You can no doubt see that we’ve included a while loop, which we cover in a few
    pages time. It means that while there are lines to be read from the text file,
    C++ getlines them. Once all the lines are read, the output is displayed on the
    screen and the file is closed.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_122_1.png)


    # STEP 7


    You can also see that the location of the text file Cimmeria.txt isn’t in the
    same folder as the C++ program. When we created the first name.txt file, it was
    written to the same folder where the code was located; this is done by default.
    To specify another folder, you need to use double-back slashes, as per the character
    literals/escape sequence code.


    ```

    string line;

    ifstream newfile ("c:\\users\\david\\Documents\\Cimmeria.txt");

    cout << "Cimmeria, by Robert E Howard: \n" << endl;

    ```


    # STEP 8


    Just as you might expect, you can write almost anything you like to a file, for
    reading either in Notepad or via the console through the C++ code:


    ```

    string name;

    int age;

    ofstream newfile;

    newfile.open("name.txt");

    cout << "Enter your name: " << endl;

    getline(cin, name);

    newfile << name << endl;

    cout << "\nHow old are you: " << endl;

    cin >> age;

    newfile << age << endl;

    newfile.close();

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_122_2.png)


    # STEP 9


    The code from step 8 differs again, but only where we used cin >> age, instead
    of the previous getline(cin, variable). The reason for this is that the getline
    function handles strings, not integers; so when you’re using a data type other
    than a string, use the standard cin.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_122_3.png)


    # STEP 10


    Here’s an exercise: see if you can create code to write several different elements
    to a text file. You can have a user’s name, age, phone number etc. Maybe even
    the value of Pi and various mathematical elements. It’s all good practice.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_122_4.png)'
