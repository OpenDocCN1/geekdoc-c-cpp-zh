- pgno: 11
  md: '# Getting to Know Python


    Python is the greatest computer programming language ever created. It enables
    you to fully harness the power of a computer, in a language that’s clean and easy
    to understand.


    # WHAT IS PROGRAMMING?


    It helps to understand what a programming language is before you try to learn
    one, and Python is no different. Let’s take a look at how Python came about and
    how it relates to other languages.


    # PYTHON


    A programming language is a list of instructions that a computer follows. These
    instructions can be as simple as displaying your name or playing a music file,
    or as complex as building a whole virtual world. Python is a programming language
    conceived in the late 1980s by Guido van Rossum at Centrum Wiskunde & Informatica
    (CWI) in the Netherlands as a successor to the ABC language.


    > Guido van Rossum, the father of Python.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_11_0.png)


    # PROGRAMMING RECIPES


    Programs are like recipes for computers. A recipe to bake a cake could go like
    this:


    +   - Put 100 grams of self-raising flour in a bowl.

    +   - Add 100 grams of butter to the bowl.

    +   - Add 100 millilitres of milk.

    +   - Bake for half an hour.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_11_1.png)


    # CODE


    Just like a recipe, a program consists of instructions that you follow in order.
    A program that describes a cake might run like this:


    ```

    bowl = []

    floor = 100

    butter = 50

    milk = 100

    bowl.append([flour,butter,milk])

    cake.cook(bowl)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_11_2.png)


    # PROGRAM COMMANDS


    You might not understand some of the Python commands, like bowl.append and cake.cook(bowl).
    The first is a list, the second an object; we’ll look at both in this book. The
    main thing to know is that it’s easy to read commands in Python. Once you learn
    what the commands do, it’s easy to figure out how a program works.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_11_3.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal"). Languages
    that "fly close to the metal," like Assembly, are known as "low-level". Low-level
    languages commands read a bit like this: msg db ,0xA len equ $ - msg.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_0.png)


    # ZEN OF PYTHON


    Python lets you access all the power of a computer in a language that humans can
    understand. Behind all this is an ethos called "The Zen of Python." This is a
    collection of 20 software principles that influences the design of the language.
    Principles include "Beautiful is better than ugly" and "Simple is better than
    complex." Type import this into Python and it will display all the principles.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_1.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is complicated somewhat by the existence
    of two active versions of the language: Python 2 and Python 3.


    # WORLD OF PYTHON


    When you visit the Python Download page you''ll notice that there are two buttons
    available: one for Python 3.6.2 and the other for Python 2.7.13; correct at the
    time of writing (remember Python is frequently updated so you may see different
    version numbers).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_2.png)


    # PYTHON 3.X


    In 2008 Python 3 arrived with several new and enhanced features. These features
    provide a more stable, effective and efficient programming environment but sadly,
    most (if not all) of these new features are not compatible with Python 2 scripts,
    modules and tutorials. Whilst not popular at first, Python 3 has since become
    the cutting edge of Python programming.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_3.png)


    # PYTHON 2.X


    So why two? Well, Python 2 was originally launched in 2000 and has since then
    adopted quite a large collection of modules, scripts, users, tutorials and so
    on. Over the years Python 2 has fast become one of the first go to programming
    languages for beginners and experts to code in, which makes it an extremely valuable
    resource.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_4.png)


    # 3.X WINS


    Python 3''s growing popularity has meant that it''s now prudent to start learning
    to develop with the new features and begin to phase out the previous version.
    Many development companies, such as SpaceX and NASA use Python 3 for snippets
    of important code.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_12_5.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Python
    Downloads page. Whilst most seasoned Python developers may shun Windows as the
    platform of choice for building their code, it’s still an ideal starting point
    for beginners.


    # INSTALLING PYTHON 3.X


    Microsoft Windows doesn’t come with Python preinstalled as standard, so you’re
    going to have to install it yourself manually. Thankfully, it’s an easy process
    to follow.


    STEP 1 Start by opening your web browser to www.python.org/downloads/. Look for
    the button detailing the download link for Python 3.x.x (in our case this is Python
    3.6.2 but as mentioned you may see later versions of 3).


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_13_0.png)


    STEP 3 Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, it’s a good habit to adopt as sometimes
    (not with Python, thankfully) installers can include unwanted additional features.
    On the first screen available, ensure all boxes are ticked and click the Next
    button.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_13_1.png)


    STEP 2 Click the download button for version 3.x, and save the file to your Downloads
    folder. When the file is downloaded, double-click the executable and the Python
    installation wizard will launch. From here you have two choices: Install Now and
    Customise Installation. We recommend opting for the Customise Installation link.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_13_2.png)


    STEP 4 The next page of options include some interesting additions to Python.
    Ensure the Associate file with Python, Create Shortcuts, Add Python to Environment
    Variables, Precompile Standard Library and Install for All Users options are ticked.
    These make using Python later much easier. Click Install when you’re ready to
    continue.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_13_3.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# STEP 5


    You may need to confirm the installation with the Windows authentication notification.
    Simply click Yes and Python will begin to install. Once the installation is complete
    the final Python wizard page will allow you to view the latest release notes,
    and follow some online tutorials.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_0.png)


    # STEP 6


    Before you close the install wizard window, however, it''s best to click on the
    link next to the shield detailed Disable Path Length Limit. This will allow Python
    to bypass the Windows 260 character limitation, enabling you to execute Python
    programs stored in deep folders arrangements. Again, click Yes to authenticate
    the process; then you can Close the installation window.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_1.png)


    # STEP 7


    Windows 10 users will now find the installed Python 3.x within the Start button
    Recently Added section. The first link, Python 3.6 (32-bit) will launch the command
    line version of Python when clicked (more on that in a moment). To open the IDLE,
    type IDLE into Windows start.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_2.png)


    # STEP 8


    Clicking on the IDLE (Python 3.6 32-bit) link will launch the Python Shell, where
    you can begin your Python programming journey. Don''t worry if your version is
    newer, as long as it''s Python 3.x our code will work inside your Python 3 interface.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_3.png)


    # STEP 9


    If you now click on the Windows Start button again, and this time type: CMD, you''ll
    be presented with the Command Prompt link. Click it to get to the Windows command
    line environment. To enter Python within the command line, you need to type: python
    and press Enter.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_4.png)


    # STEP 10


    The command line version of Python works in much the same way as the Shell you
    opened in Step 8; note the three left-facing arrows (>>>). Whilst it''s a perfectly
    fine environment, it''s not too user-friendly, so leave the command line for now.
    Enter: exit() to leave and close the Command Prompt window.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_14_5.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# How to Set Up Python on a Mac


    If you’re running an Apple Mac, then setting up Python is incredibly easy. In
    fact a version of Python is already installed. However, you should make sure you’re
    running the latest version.


    # INSTALLING PYTHON


    Apple’s operating system comes with Python installed, so you don’t need to install
    it separately. However, Apple doesn’t update Python very often and you’re probably
    running an older version. So it makes sense to check and update first.


    STEP 1 Open a new Terminal window by clicking Go > Utilities, then double-click
    the Terminal icon. Now enter: python --version. You should see "Python 2.5.1"
    and even later, if Apple has updated the OS and Python installation. Either way,
    it’s best to check for the latest version.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_15_0.png)


    STEP 2 Open Safari and head over to www.python.org/downloads. Just as with the
    Windows setup procedure on the previous pages, you can see two yellow download
    buttons: one for Python 3.6.2, and the other for Python 2.7.13. Note, that version
    numbers may be different due to the frequent releases of Python.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_15_1.png)


    STEP 3 Click on the latest version of Python 3.x, in our case this is the download
    button for Python 3.6.2. This will automatically download the latest version of
    Python and depending on how you’ve got your Mac configured, it automatically starts
    the installation wizard.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_15_2.png)


    STEP 4 With the Python installation wizard open, click on the Continue button
    to begin the installation. It’s worth taking a moment to read through the Important
    Information section, in case it references something that applies to your version
    of macOS. When ready, click Continue again.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_15_3.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# How to Set Up Python on a Mac


    # STEP 5


    The next section details the Software License Agreement, and whilst not particularly
    interesting to most folks, it''s probably worth a read. When you''re ready, click
    on the Continue button once again.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_0.png)


    # STEP 6


    Finally you''re be presented with the amount of space Python will take up on your
    system and an Install button, which you need to click to start the actual installation
    of Python 3.x on to your Mac. You may need to enter your password to authenticate
    the installation process.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_1.png)


    # STEP 7


    The installation shouldn''t take too long; the older Mac Mini we used in this
    section is a little slower than more modern Mac machines and it only took around
    thirty seconds for the Installation Successful prompt to be displayed.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_2.png)


    # STEP 8


    There''s nothing much else left to do in the Python installation wizard so you
    can click the Close button. If you now drop back into a Terminal session and re-enter
    the command: python3 --version, you can see the new version is now listed. To
    enter the command line version of Python, you need to enter: python3. To exit,
    it''s: exit().


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_3.png)


    # STEP 9


    You need to search in Finder for the Python IDLE; when you''ve found it, click
    it to launch and it should look similar to that of the Windows IDLE version shown
    on the previous page. The only difference being the Mac detected hardware platform
    it''s running on.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_4.png)


    # STEP 10


    Older Mac versions may have trouble with the newer versions of Python, in which
    case you will need to revert to a previous Python 3.x build; as long as you''re
    using Python 3.x, the code in this book will work for you.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_16_5.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# How to Set Up Python in Linux


    Python version 2.x is already installed in most Linux distributions but as we’re
    going to be using Python 3.x, there’s a little work we need to do first to get
    hold of it. Thankfully, it’s not too difficult.


    # PYTHON PENGUIN


    Linux is such a versatile operating system that it’s often difficult to nail down
    just one way of doing something. Different distributions go about installing software
    in different ways, so we will stick to Linux Mint 18.1 for this particular tutorial.


    STEP 1 First you need to ascertain which version of Python is currently installed
    in your Linux system; as we mentioned, we’re going to be using Linux Mint 18.1
    for this section. As with macOS, drop into a Terminal by pressing Ctrl+Alt+T.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_17_0.png)


    STEP 3 Some Linux distros will automatically update the installation of Python
    to the latest versions whenever the system is updated. To check, first do a system
    update and upgrade with:


    ```

    sudo apt-get update && sudo apt-get upgrade

    ```


    Enter your password and let the system do any updates.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_17_1.png)


    STEP 2 Next enter: python --version into the Terminal screen. You should have
    the output relating to version 2.x of Python in the display. Ours in this particular
    case is Python 2.7.12.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_17_2.png)


    STEP 4 Once the update and upgrade is complete, you may need to answer ‘Y’ to
    authorise any upgrades, enter: python3 --version to see if Python 3.x is updated
    or even installed. In the case of Linux Mint, the version we have is Python 3.5.2,
    which is fine for our purposes.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_17_3.png)'
