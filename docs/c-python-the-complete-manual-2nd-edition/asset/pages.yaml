- pgno: 37
  md: '# Creating Functions


    Now that you’ve mastered the use of variables and user input, the next step is
    to tackle functions. You’ve already used a few functions, such as the print command
    but Python enables you to define your own functions.


    # FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It’s a little
    piece of self-contained code that takes data, works on it and then returns the
    result.


    # STEP 1


    It’s not just data that a function works on. They can do all manner of useful
    things in Python, such as sort data, change items from one format to another and
    check the length or type of items. Basically, a function is a short word that’s
    followed by brackets. For example, len(), list() or type().


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_0.png)


    # STEP 3


    You can pass variables through functions in much the same manner. Let’s assume
    you want the number of letters in a person’s surname, you could use the following
    code (enter the text editor for this example):


    ```

    name=input ("Enter your surname: ")

    count=len(name)

    print ("Your surname has", count, "letters in it.")

    ```


    Press F5 and save the code to execute it.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_1.png)


    # STEP 2


    A function takes data, usually a variable, works on it depending on what the function
    is programmed to do and returns the end value. The data being worked on goes inside
    the brackets, so if you wanted to know how many letters are in the word antidisestablishmentarianism,
    then you’d enter: len("antidisestablishmentarianism") and the number 28 would
    return.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_2.png)


    # STEP 4


    Python has tens of functions built into it, far too many to get into in the limited
    space available here. However, to view the list of built-in functions available
    to Python 3, navigate to www.docs.python.org/3/library/functions.html. These are
    the predefined functions, but since users have created many more, they’re not
    the only ones available.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_3.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: "# STEP 5\n\nAdditional functions can be added to Python through modules. Python\
    \ has a vast range of modules available that can cover numerous programming duties.\
    \ They add functions and can be imported as and when required. For example, to\
    \ use advanced mathematics functions enter:\n\n```\nimport math\n```\n\nOnce entered,\
    \ you have access to all the math module functions.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_0.png)\n\
    \n# STEP 6\n\nTo use a function from a module enter the name of the module followed\
    \ by a full stop, then the name of the function. For instance, using the math\
    \ module, since you've just imported it into Python, you can utilise the square\
    \ root function. To do so, enter:\n\n```\nmath.sqrt(16)\n```\n\nYou can see that\
    \ the code is presented as module.function(data).\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_1.png)\n\
    \n# FORGING FUNCTIONS\n\nThere are many different functions you can import created\
    \ by other Python programmers and you will undoubtedly come across some excellent\
    \ examples in the future; you can also create your own with the def command.\n\
    \n# STEP 1\n\nChoose File > New File to enter the editor, let's create a function\
    \ called Hello, that greets a user.\nEnter:\n\n```\ndef Hello():\n    print(\"\
    Hello\")\n\nHello()\n```\n\nPress F5 to save and run the script. You can see Hello\
    \ in the Shell, type in Hello() and it returns the new function.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_2.png)\n\
    \n# STEP 3\n\nTo modify it further, delete the Hello(\"David\") line, the last\
    \ line in the script and press Ctrl+S to save the new script. Close the Editor\
    \ and create a new file (File > New File). Enter the following:\n\n```\nfrom Hello\
    \ import Hello\n\nHello(\"David\")\n```\n\nPress F5 to save and execute the code.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_3.png)\n\n# STEP 2\n\nLet's now\
    \ expand the function to accept a variable, the user's name for example. Edit\
    \ your script to read:\n\n```\ndef Hello(name):\n    print(\"Hello\", name)\n\n\
    Hello(\"David\")\n```\n\nThis will now accept the variable name, otherwise it\
    \ prints Hello David. In the Shell, enter: name=(\"Bob\"), then: Hello(name).\
    \ Your function can now pass variables through it.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_4.png)\n\
    \n# STEP 4\n\nWhat you've just done is import the Hello function from the saved\
    \ Hello.py program and then used it to say hello to David. This is how modules\
    \ and functions work: you import the module then use the function. Try this one,\
    \ and modify it for extra credit:\n\n```\ndef add(a, b):\n    result = a + b\n\
    \    return result\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_38_5.png)"
