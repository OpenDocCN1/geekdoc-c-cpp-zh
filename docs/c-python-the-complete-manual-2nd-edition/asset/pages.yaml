- pgno: 41
  md: '# # Python Modules


    We’ve mentioned modules previously, (the Math module) but as modules are such
    a large part of getting the most from Python, it’s worth dedicating a little more
    time to them. In this instance we’re using the Windows version of Python 3.


    # ## MASTERING MODULES


    Think of modules as an extension that’s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available and as we’ve
    seen, you can even make your own.


    # ### STEP 1


    Although good, the built-in functions within Python are limited. The use of modules,
    however, allows us to make more sophisticated programs. As you are aware, modules
    are Python scripts that are imported, such as `import math`.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_41_0.png)


    # ### STEP 2


    Some modules, especially on the Raspberry Pi, are included by default, the math
    module being a prime example. Sadly, other modules aren’t always available. A
    good example on non-Pi platforms is the pygame module, which contains many functions
    to help create games. Try: **`import pygame`**.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_41_1.png)


    # ### STEP 3


    The result is an error in the IDLE Shell, as the pygame module isn’t recognised
    or installed in Python. To install a module we can use PIP (Pip Installs Packages).
    Close down the IDLE Shell and drop into a command prompt or Terminal session.
    At an elevated admin command prompt, enter:


    ```

    ```bash

    pip install pygame

    ```

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_41_2.png)


    # ### STEP 4


    The PIP installation requires an elevated status due it installing components
    at different locations. Windows users can search for CMD via the Start button
    and right-click the result then click Run as Administrator. Linux and Mac users
    can use the Sudo command, with sudo pip install package.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_41_3.png)'
  merge: -1
  img_proc: true
