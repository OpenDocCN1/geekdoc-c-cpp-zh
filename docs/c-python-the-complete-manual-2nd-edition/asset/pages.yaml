- pgno: 92
  md: '# STEP 5


    When you’ve entered your code, click File > Save As and choose a folder in which
    to save your program. Name the file as helloworld.cpp (it can be any name as long
    as it has .cpp as the extension). Click Save to continue.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_0.png)


    # STEP 8


    Before you can execute the C++ file you need to compile it. In Linux it’s common
    to use g++, an open source C++ compiler; as you’re now in the same folder as the
    C++ file, enter: g++ helloworld.cpp in the Terminal and press Return.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_1.png)


    # STEP 6


    The first thing to notice is that Xed has automatically recognised this as a C++
    file, since the file extension is now set to .cpp. The colour coding is present
    in the code and if you open up the file manager you can also see that file’s icon
    has C++ stamped on it.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_2.png)


    # STEP 9


    It takes a short time while the code is compiled by g++ but providing there are
    no mistakes or errors in the code you are returned to the command prompt. The
    compiling of the code has created a new file. If you enter: ls into the Terminal
    you can see that alongside your C++ file is a.out.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_3.png)


    # STEP 7


    With your code now saved, drop into the Terminal again. You need to navigate to
    the location of the C++ file you’ve just saved. Our example is in the Documents
    folder, so we can navigate to it by entering: cd Documents. Remember, the Linux
    Terminal is case sensitive, so any capitals must be entered correctly.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_4.png)


    # STEP 10


    The a.out file is the compiled C++ code. To run the code enter: ./a.out and press
    Return. The words ‘Hello World!’ appear on the screen. However, a.out isn’t very
    friendly. To name it something else post-compiling, you can recompile with: g++
    helloworld.cpp -o helloworld. This creates an output file called helloworld which
    can be run with: ./helloworld.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_5.png)'
