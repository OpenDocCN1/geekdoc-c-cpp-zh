- pgno: 61
  md: "# # Exceptions\n\nWhen coding, you'll naturally come across some issues that\
    \ are out of your control. Let's assume you ask a user to divide two numbers and\
    \ they try to divide by zero. This will create an error and break your code.\n\
    \n# ## EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your code, Python includes\
    \ exception objects which handle unexpected errors in the code. You can combat\
    \ errors by creating conditions where exceptions may occur.\n\nYou can create\
    \ an exception error by simply trying to divide a number by zero. This will report\
    \ back with the ZeroDivisionError. Division by zero message, as seen in the screenshot.\
    \ The ZeroDivisionError part is the exception class, of which there are many.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_61_0.png)\n\nMost exceptions are raised\
    \ automatically when Python comes across something that's inherently wrong with\
    \ the code. However, you can create your own exceptions that are designed to contain\
    \ the potential error and react to it, as opposed to letting the code fail.\n\n\
    +   - BaseException\n+   - SystemExit\n+   - KeyboardInterrupt\n+   - GeneratorExit\n\
    +   - StopIteration\n+   - StopAsyncIteration\n+   - ArithmeticError\n+   - BufferError\n\
    +   - AssertionError\n+   - AttributeError\n+   - EOFError\n+   - ImportError\n\
    +   - ModuleNotFoundError\n+   - LookupError\n+   - IndexError\n+   - ValueError\n\
    +   - FloatingPointError\n+   - OverflowError\n+   - ZeroDivisionError\n+   -\
    \ ConnectionError\n+   - BrokenPipeError\n+   - ChildProcessError\n+   - ConnectionAbortedError\n\
    +   - ConnectionRefusedError\n+   - ConnectionResetError\n+   - FileExistsError\n\
    +   - FileNotFoundError\n+   - InterruptedError\n+   - IsADirectoryError\n+  \
    \ - NotADirectoryError\n+   - PermissionError\n+   - ProcessLookupError\n+   -\
    \ TimeoutError\n+   - ReferenceError\n+   - RuntimeError\n+   - NotImplementedError\n\
    +   - SyntaxError\n+   - IndentationError\n+   - TabError\n+   - TypeError\n+\
    \   - UnboundLocalError\n+   - OSError\n+   - BlockingIOError\n+   - ChildProcessError\n\
    +   - ConnectionError\n+   - BrokenPipeError\n+   - ConnectionAbortedError\n+\
    \   - ConnectionRefusedError\n+   - ConnectionResetError\n+   - FileExistsError\n\
    +   - FileNotFoundError\n+   - InterruptedError\n+   - IsADirectoryError\n+  \
    \ - NotADirectoryError\n+   - PermissionError\n+   - ProcessLookupError\n+   -\
    \ TimeoutError\n+   - ReferenceError\n+   - RuntimeError\n+   - NotImplementedError\n\
    +   - SyntaxError\n+   - IndentationError\n+   - TabError\n+   - TypeError\n+\
    \   - UnboundLocalError\n+   - OSError\n+   - BlockingIOError\n\nYou can use the\
    \ functions raise exception to create our own error handling code within Python.\
    \ Let's assume your code has you warping around the cosmos, too much however results\
    \ in a warp core breach. To stop the game from exiting due to the warp core going\
    \ supernova, you can create a custom exception: raise Exception(\"warp core breach\"\
    )\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_61_1.png)\n\nTo trap any errors\
    \ in the code you can encase the potential error within a try block. This block\
    \ consists of try, except, else, where the code is held within try, then if there's\
    \ an exception do something, else do something else.\n\n```\ntry:\n    # Insert\
    \ your operations here ---->\n    except Exception 1:\n        If there is an\
    \ exception do this ---->\n    except Exception 2:\n        If there is another\
    \ exception do this ---->\n    else:\n        If there is no exception, then do\
    \ this ----->\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "# STEP 5\n\nFor example, use the divide by zero error. You can create an exception\
    \ where the code can handle the error without Python quitting due to the problem:\n\
    \n```\ntry:\n    a=int(input(\"Enter the first number: \"))\n    b=int(input(\"\
    Enter the second number:\"))\n    print(a/b)\nexcept ZeroDivisionError:\n    print(\"\
    You have tried to divide by zero!\")\nelse:\n    print(\"You didn’t divide by\
    \ zero. Well done!\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_0.png)\n\
    \n# STEP 6\n\nYou can use exceptions to handle a variety of useful tasks. Using\
    \ an example from our previous tutorials, let’s assume you want to open a file\
    \ and write to it:\n\n```\ntry:\n    txt = open(\"/home/pi/Documents/textfile.txt\"\
    , \"r\")\n    txt.write(\"This is a test. Normal service will shortly resume!\"\
    )\nexcept IOError:\n    print (\"Error: unable to write the file. Check permissions\"\
    )\nelse:\n    print (\"Content written to file successfully. Have a nice day.\"\
    )\n    txt.close()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_1.png)\n\
    \n# STEP 7\n\nObviously this won’t work due to the file textfile.txt being opened\
    \ as read only (the \"r\" part). So in this case rather than Python telling you\
    \ that you’re doing something wrong, you’ve created an exception using the IOError\
    \ class informing the user that the permissions are incorrect.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_2.png)\n\
    \n# STEP 8\n\nNaturally, you can quickly fix the issue by changing the \"r\" read\
    \ only instance with a \"w\" for write. This, as you already know, will create\
    \ the file and write the content then commit the changes to the file. The end\
    \ result will report a different set of circumstances, in this case, a successful\
    \ execution of the code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_3.png)\n\
    \n# STEP 9\n\nYou can also use a finally: block, which works in a similar fashion\
    \ but you can’t use else with it. To use our example from Step 6:\n\n```\ntry:\n\
    \    txt = open(\"/home/pi/Documents/textfile.txt\", \"r\")\n    try:\n      \
    \  txt.write(\"This is a test. Normal service will shortly resume!\")\n    finally:\n\
    \        print (\"Content written to file successfully. Have a nice day.\")\n\
    \        txt.close()\nexcept IOError:\n    print (\"Error: unable to write the\
    \ file. Check permissions\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_4.png)\n\
    \n# STEP 10\n\nAs before an error will occur as you’ve used the \"r\" read-only\
    \ permission. If you change it to a \"w\", then the code will execute without\
    \ the error being displayed in the IDLE Shell. Needless to say, it can be a tricky\
    \ getting the exception code right the first time. Practise though, and you will\
    \ get the hang of it.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_5.png)"
  merge: -1
  img_proc: true
- pgno: 63
  md: "# # Python Graphics\n\nWhile dealing with text on the screen, either as a game\
    \ or in a program, is great, there will come a time when a bit of graphical representation\
    \ wouldn't go amiss. Python 3 has numerous ways in which to include graphics and\
    \ they're surprisingly powerful too.\n\n# ## GOING GRAPHICAL\n\nYou can draw simple\
    \ graphics, lines, squares and so on, or you can use one of the many Python modules\
    \ available, to bring out some spectacular effects.\n\n# ### STEP 1\n\nOne of\
    \ the best graphical modules to begin learning Python graphics is Turtle. The\
    \ Turtle module is, as the name suggests, based on the turtle robots used in many\
    \ schools, that can be programmed to draw something on a large piece of paper\
    \ on the floor. The Turtle module can be imported with: `import turtle.`\n\n```\n\
    ```python\nimport turtle\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_63_0.png)\n\
    \n# ### STEP 2\n\n```\n```python\nimport turtle\nturtle.circle(50)\nturtle.circle()._root.mainloop()\n\
    ```\n```\n\nAs usual press F5 to save the code and execute it. A new window will\
    \ now open up and the 'Turtle' will draw a circle.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_63_1.png)\n\
    \n# ### STEP 3\n\nThe command turtle.circle(50) is what draws the circle on the\
    \ screen, with 50 being the size. You can play around with the sizes on the screen,\
    \ if you like, going up to 100, 150 and beyond; you can draw an arc by entering:\
    \ turtle.circle(50, 180), where the size is 50, but you're telling Python to only\
    \ draw 180° of the circle.\n\n```\n```python\nturtle.circle(50, 180)\n```\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_63_2.png)\n\n# ### STEP 4\n\n```\n\
    ```python\nprint(\"Drawing a square...\")\nfor t in range(4):\n    turtle.forward(100)\n\
    \    turtle.left(90)\nturtle.getscreen()._root.mainloop()\n```\n```\n\nYou can\
    \ see that we've inserted a loop to draw the sides of the square.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_63_3.png)"
  merge: -1
  img_proc: true
- pgno: 64
  md: "# **STEP 5**\n\nYou can add a new line to the square code to add some colour:\n\
    turtle.color(\"Red\")\n\nThen you can even change the character to an actual turtle\
    \ by entering:\nturtle.shape(\"turtle\")\n\nYou can also use the command turtle.begin_fill(),\
    \ and turtle.end_fill() to fill in the square with the chosen colours; red outline,\
    \ yellow fill in this case.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_0.png)\n\
    \n# **STEP 6**\n\nYou can see that the Turtle module can draw out some pretty\
    \ good shapes and become a little more complex as you begin to master the way\
    \ it works. Enter this example.\n\n```\n```python\nfrom turtle import *\ncolor('red',\
    \ 'yellow')\nbegin_fill()\nwhile True:\n  forward(200)\n  left(170)\n  if abs(pos())\
    \ < 1:\n    break\nend_fill()\ndone()\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_1.png)\n\
    \n# **STEP 7**\n\nAnother way in which you can display graphics is by using the\
    \ Pygame module. There are numerous ways in which you can help you output graphics\
    \ to the screen but for now let's look at displaying a predefined image. Start\
    \ by opening a browser and finding an image, then save it to the folder where\
    \ you save your Python code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_2.png)\n\
    \n# **STEP 8**\n\nNow let's get the code by importing the pygame module:\nimport\
    \ pygame\npygame.init()\nimg = pygame.image.load(\"RPi.png\")\nwhite = (255, 255,\
    \ 255)\nw = 900\nh = 450\nscreen = pygame.display.set_mode((w, h))\nscreen.fill(white)\n\
    screen.blit(img,(0,0))\npygame.display.flip()\n\nwhile True:\n  for event in pygame.event.get():\n\
    \    if event.type == pygame.QUIT:\n      pygame.quit()\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_3.png)\n\
    \n# **STEP 9**\n\nIn the previous step you imported pygame, initiated the pygame\
    \ engine and asked it to import our saved Raspberry Pi logo image, saved as RPi.png.\
    \ Next you defined the background colour of the window to display the image and\
    \ the window size as per the actual image dimensions. Finally you have a loop\
    \ to close the window.\n\n```\n```python\nw = 900\nh = 450\nscreen = pygame.display.set_mode((w,\
    \ h))\nscreen.fill(white)\nscreen.blit(img,(0,0))\npygame.display.flip()\n\nwhile\
    \ True:\n  for event in pygame.event.get():\n    if event.type == pygame.QUIT:\n\
    \      pygame.quit()\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_4.png)\n\
    \n# **STEP 10**\n\nPress F5 to save and execute the code and your image will be\
    \ displayed in a new window. Have a play around with the colours, sizes and so\
    \ on and take time to look at the many functions within the pygame module too.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_64_5.png)"
  merge: -1
  img_proc: true
