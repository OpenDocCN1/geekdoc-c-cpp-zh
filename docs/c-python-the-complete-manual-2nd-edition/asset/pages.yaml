- pgno: 132
  md: "# STEP 5\n\nWhen you change the value to anything above 30, then build and\
    \ run the code, you can see that the only line to be outputted to the screen is\
    \ the second cout statement, displaying the current value of num. This is because\
    \ the initial if statement is false, so it ignores the code within the braces.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_0.png)\n\n# STEP 6\n\nYou can include\
    \ an if statement within a do... while loop. For example:\n\n```\n{\n    float\
    \ temp;\n    do\n    {\n        cout << \"\\nEnter the temperature (or -10000\
    \ to exit): \" << endl;\n        cin >> temp;\n        if (temp <= 0 )\n     \
    \   {\n            cout << \"\\nBrrrr, it's really cold!\" << endl;\n        }\n\
    \        if (temp > 0 )\n        {\n            cout << \"\\nAt least it's not\
    \ freezing!\" << endl;\n        }\n    }\n    while ( temp != -10000 );\n    cout\
    \ << \"\\nGood bye\\n\" << endl;\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_1.png)\n\
    \n# STEP 7\n\nThe code in Step 6 is simplistic but effective. First we created\
    \ a floating point integer called temp, then a do... while loop that asks the\
    \ user to enter the current temperature.\n\n```\nfloat temp;\ndo\n{\n    cout\
    \ << \"\\nEnter the temperature (or -10000 to exit): \" << endl;\n    cin >> temp;\n\
    ```\n\n# STEP 8\n\nThe first if statement checks to see if the user's inputted\
    \ value is less than or equal to zero. If it is, then the output is 'Brrrr, it's\
    \ really cold!'. Otherwise, if the input is greater than zero, the code outputs\
    \ 'At least it's not freezing!'.\n\n```\ndo\n{\n    cout << \"\\nEnter the temperature\
    \ (or -10000 to exit): \" << endl;\n    cin >> temp;\n    if (temp <= 0 )\n  \
    \  {\n        cout << \"\\nBrrrr, it's really cold!\" << endl;\n    }\n    if\
    \ (temp > 0 )\n    {\n        cout << \"\\nAt least it's not freezing!\" << endl;\n\
    \    }\n}\n```\n\n# STEP 9\n\nFinally, if the user enters the value -10000, which\
    \ is impossibly cold so is therefore a unrealistic value, the do... while loop\
    \ is terminated and a friendly 'Good bye' is displayed to the screen.\n\n```\n\
    float temp;\ndo\n{\n    cout << \"\\nEnter the temperature (or -10000 to exit):\
    \ \" << endl;\n    cin >> temp;\n    if (temp <= 0 )\n    {\n        cout << \"\
    \\nBrrrr, it's really cold!\" << endl;\n    }\n    if (temp > 0 )\n    {\n   \
    \     cout << \"\\nAt least it's not freezing!\" << endl;\n    }\n}\nwhile ( temp\
    \ != -10000 );\ncout << \"\\nGood bye\\n\" << endl;\nreturn 0;\n```\n\n# STEP\
    \ 10\n\nUsing if is quite powerful, if it's used correctly. Just remember that\
    \ if the condition is true then the code executes what's in the braces. If not,\
    \ it continues on its merry way. See what else you can come up with using if and\
    \ a combination of loops.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_2.png)"
