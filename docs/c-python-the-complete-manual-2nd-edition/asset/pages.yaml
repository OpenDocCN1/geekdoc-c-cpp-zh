- pgno: 49
  md: '# Dictionaries


    Lists are extremely useful but dictionaries in Python are by far the more technical
    way of dealing with data items. They can be tricky to get to grips with at first
    but you’ll soon be able to apply them to your own code.


    # KEY PAIRS


    A dictionary is like a list but instead each data item comes as a pair, these
    are known as Key and Value. The Key part must be unique and can either be a number
    or string whereas the Value can be any data item you like.


    # STEP 1


    Let’s say you want to create a phonebook in Python. You would create the dictionary
    name and enter the data in curly brackets, separating the key and value by a colon
    Key:Value. For example:


    ```

    phonebook={"Emma": 1234, "Daniel": 3456, "Hannah": 6789}

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_49_0.png)


    # STEP 3


    As with lists and tuples, you can check the contents of a dictionary by giving
    the dictionary a name: phonebook, in this example. This will display the data
    items you’ve entered in a similar fashion to a list, which you’re no doubt familiar
    with by now.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_49_1.png)


    # STEP 2


    Just as with most lists, tuples and so on, strings need be enclosed in quotes
    (single or double), whilst integers can be left open. Remember that the value
    can be either a string or an integer, you just need to enclose the relevant one
    in quotes:


    ```

    phonebook2={"David": "0987 654 321"}

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_49_2.png)


    # STEP 4


    The benefit of using a dictionary is that you can enter the key to index the value.
    Using the phonebook example from the previous steps, you can enter:


    ```

    phonebook["Emma"]

    phonebook["Hannah"]

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_49_3.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# STEP 5


    Adding to a dictionary is easy too. You can include a new data item entry by adding
    the new key and value items like:


    ```

    phonebook["David"] = "0987 654 321"

    phonebook

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_0.png)


    # STEP 6


    You can also remove items from a dictionary by issuing the del command followed
    by the item''s key; the value will be removed as well, since both work as a pair
    of data items:


    ```

    del phonebook["David"]

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_1.png)


    # STEP 7


    Taking this a step further, how about creating a piece of code that will ask the
    user for the dictionary key and value items? Create a new Editor instance and
    start by coding in a new, blank dictionary:


    ```

    phonebook={}

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_2.png)


    # STEP 8


    Next, you need to define the user inputs and variables: one for the person''s
    name, the other for their phone number (let''s keep it simple to avoid lengthy
    Python code):


    ```

    name=input("Enter name: ")

    number=int(input("Enter phone number: "))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_3.png)


    # STEP 9


    Note we''ve kept the number as an integer instead of a string, even though the
    value can be both an integer or a string. Now you need to add the user''s inputted
    variables to the newly created blank dictionary. Using the same process as in
    Step 5, you can enter:


    ```

    phonebook[name] = number

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_4.png)


    # STEP 10


    Now when you save and execute the code, Python will ask for a name and a number.
    It will then insert those entries into the phonebook dictionary, which you can
    test by entering into the Shell:


    ```

    phonebook

    phonebook["David"]

    ```


    If the number needs to contain spaces you need to make it a string, so remove
    the int part of the input.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_50_5.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Splitting and Joining Strings


    When dealing with data in Python, especially from a user’s input, you will undoubtedly
    come across long sets of strings. A useful skill to learn in Python programming
    is being able to split those long strings for better readability.


    # STRING THEORIES


    You’ve already looked at some list functions, using .insert, .remove, and .pop
    but there are also functions that can be applied to strings.


    STEP 1

    The main tool in the string function arsenal is .split(). With it you’re able
    to split apart a string of data, based on the argument within the brackets. For
    example, here’s a string with three items, each separated by a space:

    text="Daniel Hannah Emma"


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_51_0.png)


    STEP 3

    Note that the text.split part has the brackets, quotes, then a space followed
    by closing quotes and brackets. The space is the separator, indicating that each
    list item entry is separated by a space. Likewise, CSV (Comma Separated Value)
    content has a comma, so you’d use:

    text="January,February,March,April,May,June"

    months=text.split(",")

    months


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_51_1.png)


    STEP 2

    Now let’s turn the string into a list and split the content accordingly:

    names=text.split(" ")

    Then enter the name of the new list, names, to see the three items.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_51_2.png)


    STEP 4

    You’ve previously seen how you can split a string into individual letters as a
    list, using a name:

    name=list("David")

    name

    The returned value is ‘D’, ‘a’, ‘v’, ‘i’, ‘d’. Whilst it may seem a little useless
    under ordinary circumstances, it could be handy for creating a spelling game for
    example.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_51_3.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Splitting and Joining Strings


    **STEP 5** The opposite of the `.split` function is `.join`, where you will have
    separate items in a string and can join them all together to form a word or just
    a combination of items, depending on the program you’re writing. For instance:


    ```

    alphabet="".join(["a","b","c","d","e"])

    alphabet

    ```


    This will display ‘abcde’ in the Shell.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_0.png)


    **STEP 6** You can therefore apply .join to the separated name you made in Step
    4, combining the letters again to form the name:


    ```

    name="".join(name)

    name

    ```


    We’ve joined the string back together, and retained the list called name, passing
    it through the .join function.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_1.png)


    **STEP 7** A good example of using the .join function is when you have a list
    of words you want to combine into a sentence:


    ```

    list=["Conan", "raised", "his", "mighty", "sword", "and", "struck", "the", "demon"]

    text=" ".join(list)

    text

    ```


    Note the space between the quotes before the .join function (where there were
    no spaces in the Step 6’s join)


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_2.png)


    **STEP 8** As with the .split function, the separator doesn’t have to be a space,
    it can also be a comma, a full stop, a hyphen or whatever you like:


    ```

    colours=["Red", "Green", "Blue"]

    col=",".join(colours)

    col

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_3.png)


    **STEP 9** There’s some interesting functions you apply to a string, such as .capitalize
    and .title. For example:


    ```

    title="conan the cimmerian"

    title.capitalize()

    title.title()

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_4.png)


    **STEP 10** You can also use logic operators on strings, with the ‘in’ and ‘not
    in’ functions. These enable you to check if a string contains (or does not contain)
    a sequence of characters:


    ```

    message="Have a nice day"

    “nice” in message


    “bad” not in message

    “day” not in message

    “night” in message

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_52_5.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Formatting Strings


    When you work with data, creating lists, dictionaries and objects you may often
    want to print out the results. Merging strings with data is easy especially with
    Python 3, as earlier versions of Python tended to complicate matters.


    # STRING FORMATTING


    Since Python 3, string formatting has become a much neater process, using the
    .format function combined with curly brackets. It’s a more logical and better
    formed approach than previous versions.


    # STEP 1


    The basic formatting in Python is to call each variable into the string using
    the curly brackets:


    ```

    name="Conan"

    print("The barbarian hero of the Hyborian Age is: {}".format(name))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_53_0.png)


    # STEP 3


    You can of course also include integers into the mix:

    number=10000


    ```

    print("{0} of {1} was a skilled mercenary, and thief too. He once stole {2} gold
    from a merchant.".format(name, place, number))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_53_1.png)


    # STEP 2


    Remember to close the print function with two sets of brackets, as you’ve encased
    the variable in one, and the print function in another. You can include multiple
    cases of string formatting in a single print function:


    ```

    name="Conan"

    place="Cimmeria"

    print("{0} hailed from the North, in a cold land known as {1}".format(name, place))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_53_2.png)


    # STEP 4


    There are many different ways to apply string formatting, some are quite simple,
    as we’ve shown you here; others can be significantly more complex. It all depends
    on what you want from your program. A good place to reference frequently regarding
    string formatting is the Python Docs webpage, found at www.docs.python.org/3.1/library/string.html.
    Here, you will find tons of help.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_53_3.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# STEP 5


    Interestingly you can reference a list using the string formatting function. You
    need to place an asterisk in front of the list name:


    ```

    numbers=1, 3, 45, 567546, 3425346345

    print("Some numbers: {}, {}, {}, {}, {}".format(*numbers))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_0.png)


    # STEP 6


    With indexing in lists, the same applies to calling a list using string formatting.
    You can index each item according to its position (from 0 to however many are
    present):


    ```

    numbers=1, 4, 7, 9

    print("More numbers: {3}, {0}, {2}, {1}.".format(*numbers))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_1.png)


    # STEP 7


    And as you probably suspect, you can mix strings and integers in a single list
    to be called in the .format function:


    ```

    characters=["Conan", "Belit", "Valeria", 19, 27, 20]

    print ("{0} is {3} years old. Whereas {1} is {4} years old.".format(*characters))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_2.png)


    # STEP 8


    You can also print out the content of a user''s input in the same fashion:


    ```

    name=input("What''s your name? ")

    print("Hello {}.".format(name))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_3.png)


    # STEP 9


    You can extend this simple code example to display the first letter in a person''s
    entered name:


    ```

    name=input("What''s your name? ")

    print("Hello {}.".format(name))

    lname=list(name)

    print("The first letter of your name is a {0}.".format(*lname))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_4.png)


    # STEP 10


    You can also call upon a pair of lists and reference them individually within
    the same print function. Looking back the code from Step 7, you can alter it with:


    ```

    names=["Conan", "Belit", "Valeria"]

    ages=[25, 21, 22]

    ```


    Creating two lists. Now you can call each list, and individual items:


    ```

    print("{0[0]} is {1[0]} years old. Whereas {0[1]} is {1[1]} years old.".format(names,
    ages))

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_54_5.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Date and Time


    When working with data it’s often handy to have access to the time. For example,
    you may want to time-stamp an entry or see at what time a user logged into the
    system and for how long. Luckily acquiring the date and time is easy, thanks to
    the Time module.


    # TIME LORDS


    The time module contains functions that help you retrieve the current system time,
    reads the date from strings, formats the time and date and much more.


    # STEP 1


    First you need to import the time module. It’s one that’s built-in to Python 3
    so you shouldn’t need to drop into a command prompt and pip install it. Once it’s
    imported, you can call the current time and date with a simple command:


    ```

    import time

    time.asctime()

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_55_0.png)


    # STEP 2


    The time function is split into nine tuples, these are divided up into indexed
    items, as with any other tuple, and shown in the screen shot below.


    | Index | Field | Values |

    | 0 | 4-digit year | 2016 |

    | 1 | Month | 1 to 12 |

    | 2 | Day | 1 to 31 |

    | 3 | Hour | 0 to 23 |

    | 4 | Minute | 0 to 59 |

    | 5 | Second | 0 to 61 (60 or 61 are leap-seconds) |

    | 6 | Day of Week | 0 to 6 (0 is Monday) |

    | 7 | Day of year | 1 to 366 (Julian day) |

    | 8 | Daylight savings | -1, 0, 1, -1 means library determines DST |


    # STEP 3


    You can see the structure of how time is presented by entering:


    ```

    time.localtime()

    ```


    The output is displayed as such: `time.struct_time(tm_year=2017, tm_mon=9, tm_mday=7,
    tm_hour=9, tm_min=6, tm_sec=13, tm_wday=3, tm_yday=250, tm_isdst=0)`; obviously
    dependent on your current time as opposed to the time shown above.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_55_1.png)


    # STEP 4


    There are numerous functions built into the time module. One of the most common
    of these is .strftime(). With it, you’re able to present a wide range of arguments
    as it converts the time tuple into a string. For example, to display the current
    day of the week you can use:


    ```

    time.strftime(''%A'')

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_55_2.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# STEP 5


    This naturally means you can incorporate various functions into your own code,
    such as:


    ```

    time.strftime("%a")

    time.strftime("%B")

    time.strftime("%b")

    time.strftime("%H")

    time.strftime("%H%M")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_0.png)


    # STEP 6


    Note the last two entries, with %H and %H%M, as you can see these are the hours
    and minutes and as the last entry indicates, entering them as %H%M doesn’t display
    the time correctly in the Shell. You can easily rectify this with:


    ```

    time.strftime("%H:%M")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_1.png)


    # STEP 7


    This means you’re going to be able to display either the current time or the time
    when something occurred, such as a user entering their name. Try this code in
    the Editor:


    ```

    import time

    name=input("Enter login name: ")

    print("Welcome", name, "\n")

    print("User:", name, "logged in at", time.strftime("%H:%M"))

    ```


    Try to extend it further to include day, month, year and so on.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_2.png)


    # STEP 8


    You saw at the end of the previous section, in the code to calculate Pi to however
    many decimal places the users wanted, you can time a particular event in Python.
    Take the code from above and alter it slightly by including:


    ```

    start_time=time.time()

    ```


    Then there’s:


    ```

    endtime=time.time()-start_time

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_3.png)


    # STEP 9


    The output will look similar to the screenshot below. The timer function needs
    to be either side of the input statement, as that’s when the variable name is
    being created, depending on how long the user took to log in. The length of time
    is then displayed on the last line of the code as the endtime variable.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_4.png)


    # STEP 10


    There’s a lot that can be done with the time module; some of it is quite complex
    too, such as displaying the number of seconds since January 1st 1970. If you want
    to drill down further into the time module, then in the Shell enter: help(time)
    to display the current Python version help file for the time module.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_56_5.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Opening Files


    In Python you can read text and binary files in your programs. You can also write
    to file, which is something we will look at next. Reading and writing to files
    enables you to output and store data from your programs.


    # OPEN, READ AND WRITE


    In Python you create a file object, similar to creating a variable, only pass
    in the file using the open() function. Files are usually categorised as text or
    binary.


    # STEP 1


    Start by entering some text into your system’s text editor. The text editor is
    best, not a word processor, as word processors include background formatting and
    other elements. In our example, we have the poem The Cimmerian, by Robert E Howard.
    You need to save the file as poem.txt.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_57_0.png)


    # STEP 3


    If you now enter poem into the Shell, you will get some information regarding
    the text file you’ve just asked to be opened. You can now use the poem variable
    to read the contents of the file:


    ```

    poem.read()

    ```


    Note than a \n entry in the text represents a new line, as you used previously.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_57_1.png)


    # STEP 2


    You use the open() function to pass the file into a variable as an object. You
    can name the file object anything you like, but you will need to tell Python the
    name and location of the text file you’re opening:


    ```

    poem=open("/home/pi/Documents/Poem.txt")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_57_2.png)


    # STEP 4


    If you enter poem.read() a second time you will notice that the text has been
    removed from the file. You will need to enter: poem=open("/home/pi/Documents/Poem.txt")
    again to recreate the file. This time, however, enter:


    ```

    print(poem.read())

    ```


    This time, the \n entries are removed in favour of new lines and readable text.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_57_3.png)'
  merge: -1
  img_proc: true
