    is a four-letter word. Well done.\")\nelif word_length == 3:\n    print (word,\
    \ \"is a three-letter word. Try again.\")\nelse:\n    print (word, \"is not a\
    \ four-letter word.\")\n```\n```\n\nNow expand the code to include another conditions.\
    \ Eventually, it could become quite complex. We’ve added a condition for three-letter\
    \ words:\n\n```\n```python\nword=input(\"Please enter a four-letter word: \")\n\
    word_length=len(word)\nif word_length == 4:\n    print (word, \"is a four-letter\
    \ word. Well done.\")\nelif word_length == 3:\n    print (word, \"is a three-letter\
    \ word. Try again.\")\nelse:\n    print (word, \"is not a four-letter word.\"\
    )\n```\n```\n\n# LOOPS\n\nA loop looks quite similar to a condition but they are\
    \ somewhat different in their operation. A loop will run through the same block\
    \ of code a number of times, usually with the support of a condition.\n\n# STEP\
    \ 1\n\n```\n```python\nx = 1\nwhile x < 10:\n    print (x)\n    x = x + 1\n```\n\
    ```\n\nThe difference between if and while is when while gets to the end of the\
    \ indented code, it goes back and checks the statement is still true. In our example\
    \ x is less than 10. With each loop it prints the current value of x, then adds\
    \ one to that value. When x does eventually equal 10 it stops.\n\n# STEP 3\n\n\
    ```\n```python\nwords=[\"Cat\", \"Dog\", \"Unicorn\"]\nfor word in words:\n  \
    \  print (word)\n```\n```\n\nThe For loop can also be used in the countdown example\
    \ by using the range function:\n\n```\n```python\nfor x in range (1, 10):\n  \
    \  print (x)\n```\n```\n\nThe x=x+1 part isn't needed here because the range function\
    \ creates a list between the first and last numbers used."
