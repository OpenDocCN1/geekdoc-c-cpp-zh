  md: "# Create Your Own Modules\n\n# STEP 6\n\nBack to the basic_math.py window:\
    \ at the top of the code enter:\n\n```\nfrom minimath import *\n```\n\nThis will\
    \ import the function definitions as a module. Press F5 to save and execute the\
    \ program to see it in action.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_80_0.png)\n\
    \n# STEP 7\n\nYou can now use the code further to make the program a little more\
    \ advanced, utilising the newly created module to its full. Include some user\
    \ interaction. Start by creating a basic menu the user can choose from:\n\n```\n\
    print(\"Select operation.\\n\")\nprint(\"1.Times by two\")\nprint(\"2.Times by\
    \ Three\")\nprint(\"3.Square\")\nprint(\"4.Power of\")\n\nchoice = input(\"\\\
    nEnter choice (1/2/3/4):\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_80_1.png)\n\
    \n# STEP 8\n\nNow we can add the user input to get the number the code will work\
    \ on:\n\n```\nnum1 = int(input(\"\\nEnter number: \"))\n```\n\nThis will save\
    \ the user-entered number as the variable num1.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_80_2.png)\n\
    \n# STEP 9\n\nFinally, you can now create a range of if statements to determine\
    \ what to do with the number and utilise the newly created function definitions:\n\
    \n```\nif choice == '1':\n    print(timestwo(num1))\nelif choice == '2':\n   \
    \ print(timesthree(num1))\nelif choice == '3':\n    print(square(num1))\nelif\
    \ choice == '4':\n    num2 = int(input(\"Enter second number: \"))\n    print(power(num1,\
    \ num2))\nelse:\n    print(\"Invalid input\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_80_3.png)\n\
    \n# STEP 10\n\nNote that for the last available options, the Power of choice,\
    \ we've added a second variable, num2. This passes a second number through the\
    \ function definition called power. Save and execute the program to see it in\
    \ action.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_80_4.png)"
