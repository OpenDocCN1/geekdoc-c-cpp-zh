  - '[PAGE 114]


    There’s a satisfying feeling when you program code that asks the user for input,
    then uses that input to produce something that the user can see. Even if it’s
    simply asking for someone’s name, and displaying a personal welcome message, it’s
    a big leap forward.


    User interaction, character literals, defining constants and file input and output
    are all covered in the following pages. All of which help you to understand how
    a C++ program works better.


    +   116  User Interaction

    +   118  Character Literals

    +   120  Defining Constants

    +   122  File Input/Output'
  - "[PAGE 115]\n\n# User Interaction\n\nThere’s nothing quite as satisfying as creating\
    \ a program that responds to you. This basic user interaction is one of the most\
    \ taught aspects of any language and with it you’re able to do much more than\
    \ simply greet the user by name.\n\n# HELLO, DAVE\n\nYou have already used cout,\
    \ the standard output stream, throughout our code. Now you’re going to be using\
    \ cin, the standard input stream, to prompt a user response.\n\n# STEP 1\n\nAnything\
    \ that you want the user to input into the program needs to be stored somewhere\
    \ in the system memory, so it can be retrieved and used. Therefore, any input\
    \ must first be declared as a variable, so it’s ready to be used by the user.\
    \ Start by creating a blank C++ file with headers.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_0.png)\n\
    \n# STEP 2\n\nThe data type of the variable must also match the type of input\
    \ you want from the user. For example, to ask a user their age, you would use\
    \ an integer like this:\n\n```\n#include <iostream>\nusing namespace std;\n\n\
    int main ()\n{\n    int age;\n    cout << \"what is your age: \";\n    cin >>\
    \ age;\n\n    cout <<\"\\nYou are \" << age << \" years old.\\n\";\n}\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_1.png)\n\n# STEP 3\n\nThe cin command\
    \ works in the opposite way from the cout command. With the first cout line you’re\
    \ outputting ‘What is your age’ to the screen, as indicated with the chevrons.\
    \ Cin uses opposite facing chevrons, indicating an input. The input is put into\
    \ the integer age and called up in the second cout command. Build and run the\
    \ code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_2.png)\n\n# STEP 4\n\n\
    If you’re asking a question, you need to store the input as a string; to ask the\
    \ user their name, you would use:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string name;\n    cout << \"what is your name: \"\
    ;\n    cin >> name;\n\n    cout << \"\\nHello, \" << name << \" . I hope you’re\
    \ well today?\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_3.png)"
  - "[PAGE 116]\n\n# STEP 5\n\nThe principal works the same as the previous code.\
    \ The user's input, their name, is stored in a string, because it contains multiple\
    \ characters, and retrieved in the second cout line. As long as the variable 'name'\
    \ doesn't change, then you can recall it wherever you like in your code\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_0.png)\n\
    \n# STEP 6\n\nYou can chain input requests to the user but just make sure you\
    \ have a valid variable to store the input to begin with. Let's assume you want\
    \ the user to enter two whole numbers:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    int num1, num2;\n\n    cout << \"Enter two whole\
    \ numbers: \";\n    cin >> num1 >> num2;\n\n    cout << \"you entered \" << num1\
    \ << \" and \" << num2 << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_1.png)\n\
    \n# STEP 7\n\nLikewise, inputted data can be manipulated once you have it stored\
    \ in a variable. For instance, ask the user for two numbers and do some maths\
    \ on them:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    float num1, num2;\n\n    cout << \"Enter two numbers: \\n\";\n    cin >>\
    \ num1 >> num2;\n\n    cout << num1 << \" + \" << num2 << \" is: \" << num1 +\
    \ num2 << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_2.png)\n\
    \n# STEP 8\n\nWhile cin works well for most input tasks, it does have a limitation.\
    \ Cin always considers spaces as a terminator, so it's designed for just single\
    \ words not multiple words. However, getline takes cin as the first argument and\
    \ the variable as the second:\n\n```\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    string mystr;\n    cout << \"Enter a sentence: \\n\";\n\
    \    getline(cin, mystr);\n\n    cout << \"Your sentence is: \" << mystr.size()\
    \ << \" characters long.\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_3.png)\n\
    \n# STEP 9\n\nBuild and execute the code, then enter a sentence with spaces. When\
    \ you're done the code reads the number of characters. If you remove the getline\
    \ line and replace it with cin >> mystr and try again, the result displays the\
    \ number of characters up to the first space.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_4.png)\n\
    \n# STEP 10\n\nGetline is usually a command that new C++ programmers forget to\
    \ include. The terminating white space is annoying when you can't figure out why\
    \ your code isn't working. In short, it's best to use getline(cin, variable) in\
    \ future:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\
    \    string name;\n    cout << \"Enter your full name: \\n\";\n    getline(cin,\
    \ name);\n\n    cout << \"\\nHello, \" << name << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_5.png)"
  - "[PAGE 117]\n\n# # Character Literals\n\nIn C++ a literal is an object or variable\
    \ that once defined remains the same throughout the code. However, a character\
    \ literal is defined by a backslash, such as the \\n you've been using at the\
    \ end of a cout statement to signify a new line.\n\n\n\nWhen used in something\
    \ like a cout statement, character literals are also called Escape Sequence Codes.\
    \ They allow you to insert a quote, an alert, new line and much more.\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_0.png)\n\nYou've already experienced\
    \ the \\n character literal placing a new line wherever it's placed. The line:\
    \ cout << \"Hello\\n\" << \"I'm a C++\\n\" << \"Program!\\n\"; outputs three lines\
    \ of text, each starting after the last \\n.\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n\tcout << \"Hello\\n\" << \"I'm a C++\\\
    n\" << \"Program!\\n\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_1.png)\n\
    \nIf you wanted to insert speech quotes inside a cout statement, you would have\
    \ to use a backslash as it already uses quotes:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n\tcout << \"Hello, user. This is how to\
    \ use \\\"quotes\\\".\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_2.png)\n\
    \nThere's even a character literal that can trigger an alarm. In Windows 10, it's\
    \ the notification sound that chimes when you use \\a. Try this code, and turn\
    \ up your sound.\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main ()\n{\n\tcout << \"ALARM! \\a\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_3.png)"
