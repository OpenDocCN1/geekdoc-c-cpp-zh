  mdcn: "\n## 其他可安装的 C++ IDE\n\n如果你想尝试一种不同的方式编写 C++ 代码，那么你面前有很多选择。Windows 是 C++ IDE\
    \ 最丰富的平台，但也有很多面向 Mac 和 Linux 用户的选择。\n\n### C++ 开发\n\n这里列出了十款值得关注的优秀 C++ IDE。你可以根据自己的喜好安装其中一款或全部，但请找到最适合你的那一款。\n\
    \n### ECLIPSE\n\nEclipse 是一款非常流行的 C++ IDE，为程序员提供了丰富多样的功能。它拥有简洁出色的界面，易于使用，支持 Windows、Linux\
    \ 和 Mac。可前往 **www.eclipse.org/downloads/** 下载最新版本。如果你遇到困难，可以点击 Need Help 链接获取更多信息。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_93_0.png)\n\n### CODELITE\n\nCodeLite\
    \ 是一款免费开源 IDE，定期更新，支持 Windows、Linux 和 macOS。它轻量、简洁，而且功能非常强大。你可以在 **www.codelite.org/**\
    \ 找到更多信息以及下载和安装方法。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_93_1.png)\n\n###\
    \ GNAT\n\nGNAT Programming Studio（GPS）是一款功能强大且直观的 IDE，支持测试、调试和代码分析。社区版免费，专业版收费；不过，社区版可适用于\
    \ Windows、Mac、Linux 甚至树莓派。你可以在 **www.adacore.com/download** 找到它。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_93_2.png)\n\
    \n### NETBEANS\n\n另一个热门选择是 NetBeans。这款优秀的 IDE 功能丰富，使用起来也很愉悦。NetBeans IDE 包含基于项目的\
    \ C++ 模板，让你能够使用动态库和静态库构建应用程序。更多信息请访问 **www.netbeans.org/features/cpp/index.html**。\n\
