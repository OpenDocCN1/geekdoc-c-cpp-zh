    \n你可以看到有多个 Windows 版本可供选择。你需要下载的版本在当前版本号末尾带有 'mingw-setup.exe'。在撰写本文时为：codeblocks-17.12mingw-setup.exe。区别在于\
    \ mingw-setup 版本包含了来自 TDM-GCC 的 C++ 编译器和调试器，这是一个编译器套件。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_1.png)\n\
    \n找到文件后，点击行尾的 SourceForge.net 链接，会出现下载通知窗口；点击 Save File 开始下载并将可执行文件保存到你的电脑。找到已下载的\
    \ Code::Blocks 安装程序并双击启动。按照屏幕上的说明开始安装。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_2.png)\n\
    \n在你同意许可条款后，会出现安装选项。你可以选择较小的安装，缺少部分组件，但我们建议你选择默认的 Full 选项。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_87_3.png)\n\
    \n- **STEP 5:** 接下来为 Code::Blocks 文件选择安装位置。由你决定，但默认位置通常就足够了，除非你有特殊需求。当你点击 Next\
    \ 时，安装开始；完成后会弹出通知询问你是否现在启动 Code::Blocks，点击 Yes。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_0.png)\n\
    \n- **STEP 6:** 第一次加载 Code::Blocks 时，它会运行自动检测，查找系统上可能已安装的 C++ 编译器。如果你没有，点击第一个检测到的选项\
    \ GNU GCC Compiler，并点击 Default 按钮将其设为系统的 C++ 编译器。准备好继续时点击 OK。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_1.png)\n\
    \n- **STEP 7:** 程序启动后会出现另一条消息，告知 Code::Blocks 目前不是 C++ 文件的默认应用程序。你有几个选择：保持现状或允许\
    \ Code::Blocks 关联所有 C++ 文件类型。我们建议你选择最后一种选择，将 Code::Blocks 与每种受支持的文件类型关联。\n\n \
    \ ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_2.png)\n\n- **STEP 8:** 在开始使用 Code::Blocks\
