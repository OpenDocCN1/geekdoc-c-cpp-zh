  - "[PAGE 61]\n\n# # Exceptions\n\nWhen coding, you'll naturally come across some\
    \ issues that are out of your control. Let's assume you ask a user to divide two\
    \ numbers and they try to divide by zero. This will create an error and break\
    \ your code.\n\n# ## EXCEPTIONAL OBJECTS\n\nRather than stop the flow of your\
    \ code, Python includes exception objects which handle unexpected errors in the\
    \ code. You can combat errors by creating conditions where exceptions may occur.\n\
    \nYou can create an exception error by simply trying to divide a number by zero.\
    \ This will report back with the ZeroDivisionError. Division by zero message,\
    \ as seen in the screenshot. The ZeroDivisionError part is the exception class,\
    \ of which there are many.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_61_0.png)\n\
    \nMost exceptions are raised automatically when Python comes across something\
    \ that's inherently wrong with the code. However, you can create your own exceptions\
    \ that are designed to contain the potential error and react to it, as opposed\
    \ to letting the code fail.\n\n+   - BaseException\n+   - SystemExit\n+   - KeyboardInterrupt\n\
    +   - GeneratorExit\n+   - StopIteration\n+   - StopAsyncIteration\n+   - ArithmeticError\n\
    +   - BufferError\n+   - AssertionError\n+   - AttributeError\n+   - EOFError\n\
    +   - ImportError\n+   - ModuleNotFoundError\n+   - LookupError\n+   - IndexError\n\
    +   - ValueError\n+   - FloatingPointError\n+   - OverflowError\n+   - ZeroDivisionError\n\
    +   - ConnectionError\n+   - BrokenPipeError\n+   - ChildProcessError\n+   - ConnectionAbortedError\n\
    +   - ConnectionRefusedError\n+   - ConnectionResetError\n+   - FileExistsError\n\
    +   - FileNotFoundError\n+   - InterruptedError\n+   - IsADirectoryError\n+  \
    \ - NotADirectoryError\n+   - PermissionError\n+   - ProcessLookupError\n+   -\
    \ TimeoutError\n+   - ReferenceError\n+   - RuntimeError\n+   - NotImplementedError\n\
    +   - SyntaxError\n+   - IndentationError\n+   - TabError\n+   - TypeError\n+\
    \   - UnboundLocalError\n+   - OSError\n+   - BlockingIOError\n+   - ChildProcessError\n\
    +   - ConnectionError\n+   - BrokenPipeError\n+   - ConnectionAbortedError\n+\
    \   - ConnectionRefusedError\n+   - ConnectionResetError\n+   - FileExistsError\n\
    +   - FileNotFoundError\n+   - InterruptedError\n+   - IsADirectoryError\n+  \
    \ - NotADirectoryError\n+   - PermissionError\n+   - ProcessLookupError\n+   -\
    \ TimeoutError\n+   - ReferenceError\n+   - RuntimeError\n+   - NotImplementedError\n\
    +   - SyntaxError\n+   - IndentationError\n+   - TabError\n+   - TypeError\n+\
    \   - UnboundLocalError\n+   - OSError\n+   - BlockingIOError\n\nYou can use the\
    \ functions raise exception to create our own error handling code within Python.\
    \ Let's assume your code has you warping around the cosmos, too much however results\
    \ in a warp core breach. To stop the game from exiting due to the warp core going\
    \ supernova, you can create a custom exception: raise Exception(\"warp core breach\"\
    )\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_61_1.png)\n\nTo trap any errors\
    \ in the code you can encase the potential error within a try block. This block\
    \ consists of try, except, else, where the code is held within try, then if there's\
    \ an exception do something, else do something else.\n\n```\ntry:\n    # Insert\
    \ your operations here ---->\n    except Exception 1:\n        If there is an\
    \ exception do this ---->\n    except Exception 2:\n        If there is another\
    \ exception do this ---->\n    else:\n        If there is no exception, then do\
    \ this ----->\n```"
  - "[PAGE 62]\n\n# STEP 5\n\nFor example, use the divide by zero error. You can create\
    \ an exception where the code can handle the error without Python quitting due\
    \ to the problem:\n\n```\ntry:\n    a=int(input(\"Enter the first number: \"))\n\
    \    b=int(input(\"Enter the second number:\"))\n    print(a/b)\nexcept ZeroDivisionError:\n\
    \    print(\"You have tried to divide by zero!\")\nelse:\n    print(\"You didn’t\
    \ divide by zero. Well done!\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_0.png)\n\
    \n# STEP 6\n\nYou can use exceptions to handle a variety of useful tasks. Using\
    \ an example from our previous tutorials, let’s assume you want to open a file\
    \ and write to it:\n\n```\ntry:\n    txt = open(\"/home/pi/Documents/textfile.txt\"\
    , \"r\")\n    txt.write(\"This is a test. Normal service will shortly resume!\"\
    )\nexcept IOError:\n    print (\"Error: unable to write the file. Check permissions\"\
    )\nelse:\n    print (\"Content written to file successfully. Have a nice day.\"\
    )\n    txt.close()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_1.png)\n\
    \n# STEP 7\n\nObviously this won’t work due to the file textfile.txt being opened\
    \ as read only (the \"r\" part). So in this case rather than Python telling you\
    \ that you’re doing something wrong, you’ve created an exception using the IOError\
    \ class informing the user that the permissions are incorrect.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_2.png)\n\
    \n# STEP 8\n\nNaturally, you can quickly fix the issue by changing the \"r\" read\
    \ only instance with a \"w\" for write. This, as you already know, will create\
    \ the file and write the content then commit the changes to the file. The end\
    \ result will report a different set of circumstances, in this case, a successful\
    \ execution of the code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_3.png)\n\
    \n# STEP 9\n\nYou can also use a finally: block, which works in a similar fashion\
    \ but you can’t use else with it. To use our example from Step 6:\n\n```\ntry:\n\
    \    txt = open(\"/home/pi/Documents/textfile.txt\", \"r\")\n    try:\n      \
    \  txt.write(\"This is a test. Normal service will shortly resume!\")\n    finally:\n\
    \        print (\"Content written to file successfully. Have a nice day.\")\n\
    \        txt.close()\nexcept IOError:\n    print (\"Error: unable to write the\
    \ file. Check permissions\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_4.png)\n\
    \n# STEP 10\n\nAs before an error will occur as you’ve used the \"r\" read-only\
    \ permission. If you change it to a \"w\", then the code will execute without\
    \ the error being displayed in the IDLE Shell. Needless to say, it can be a tricky\
    \ getting the exception code right the first time. Practise though, and you will\
    \ get the hang of it.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_62_5.png)"
