    \ 这一行，然后重新输入。你会看到自动选择框出现。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_97_3.png)\n\
    \n- **第 5 步：** 命令的自动选择非常方便，可以减少潜在的输入错误。按 Return 键转到第 3 行，然后输入：\n\n  ```\n  int\
    \ main()\n  ```\n\n  注意：括号之间没有空格。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_0.png)\n\
    \n- **第 6 步：** 在 int main() 下面一行，输入一个花括号：\n\n  ```\n  {\n  ```\n\n  在英文英国键盘布局下，可以同时按下\
    \ Shift 和 P 键右侧的按键来输入。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_1.png)\n\
    \n- **第 7 步：** 注意，Code::Blocks 已经自动在下方几行创建了一个对应的右花括号，将这一对括号关联起来，还添加了少量缩进。这是由 C++\
    \ 的结构决定的，也是输入代码核心内容的地方。现在输入：\n\n  ```\n  //My first C++ program\n  ```\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_2.png)\n\
    \n- **第 8 步：** 再次注意颜色标记的变化。在上一步那一行的末尾按 Return 键，然后输入：\n\n  ```\n  std::cout <<\
    \ \"Hello, world!\\n\";\n  ```\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_3.png)\n\
    \n- **第 9 步：** 和之前一样，Code::Blocks 会自动补全你输入的代码，包括在你输入左引号后立即补上右引号。别忘了行末的分号；分号是 C++\
    \ 程序最重要的元素之一，我们将在下一节告诉你原因。现在，将光标移到右花括号处并按 Return 键。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_4.png)\n\
    \n- **第 10 步：** 目前你需要做的就是这些。它看起来可能并不惊艳，但 C++ 最好一小块一小块地吸收。现在先不要执行代码，因为你得先了解 C++\
    \ 程序的结构；之后你就可以编译并运行代码了。现在，点击 Save 按钮，即那个单独的软盘图标。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_98_5.png)\n\
    \n## C++ 程序的结构\n\nC++ 具有非常明确的结构和做事方式。哪怕漏掉一个像分号这样小的东西，整个程序都无法编译和执行。许多专业程序员都曾因为结构马虎而栽过跟头。\n\
    \n### #INCLUDE 与 C++ 结构\n\n学习编程基础知识时，你会开始理解程序的结构。不同语言的命令可能不同，但你会开始看到代码是如何运作的。\n\
    \n### C++\n\nC++ 由丹麦学生比雅尼·斯特劳斯特鲁普于 1979 年发明，作为其博士论文的一部分。最初，C++ 被称为“带类的 C”，它在已经流行的\
    \ C 语言基础上增加了新功能，同时通过一种新的结构使其成为一种更友好的编程环境。\n\n比雅尼·斯特劳斯特鲁普，C++ 的发明者。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_99_0.png)\n\
    \n### #INCLUDE\n\nC++ 程序的结构相当严谨。每段 C++ 代码都以一个指令开头：#include <>。该指令指示预处理器包含一段标准\
    \ C++ 代码。例如：#include <iostream> 会包含 iostream 头文件，以支持输入/输出操作。\n\n```\n1   #include\
    \ <iostream>\n2\n3\n4\n5\n6\n```\n\n### INT MAIN()\n\nint main() 声明了一个名为 main\
    \ 的函数，函数是一组代码语句的集合。所有 C++ 代码都从 main 函数开始，无论它实际位于代码中的什么位置。\n\n```\n1   #include\
    \ <iostream>\n2\n3   int main()\n4\n5\n6\n```\n\n### 花括号\n\n左花括号（大括号）可能是你以前没有遇到过的，尤其是如果你已经习惯了\
    \ Python。左花括号表示 main 函数的开始，并包含属于该函数的所有代码。\n\n```\n1   #include <iostream>\n2\n\
    3   int main()\n4   {\n5\n6   }\n```\n\n"
