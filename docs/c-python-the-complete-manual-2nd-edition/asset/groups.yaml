  mdcn: "\n\n## COMMENTS\n\n以双斜杠开头的行是注释。这意味着它们在代码中不会被执行，并且会被编译器忽略。注释旨在帮助你，或查看你代码的另一位程序员，解释正在发生的事情。有两种类型的注释：/*\
