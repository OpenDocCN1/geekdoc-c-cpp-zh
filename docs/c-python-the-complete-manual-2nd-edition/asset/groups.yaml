    # STEP 5


    Whilst we know that the variable A is lives, and that the player has just lost
    one, a casual viewer or someone checking the code may not know. Imagine for a
    moment that the code is twenty thousand lines long, instead of just our seven.
    You can see how handy comments are.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_0.png)


    # STEP 6


    Essentially, the new code together with comments could look like:


    ```

    # Set the start value of A to 10

    a=10

    # Print the current value of A

    print("The value of A is,", a)

    # Player lost a life!

    a=a-1

    # Inform player, and display current value of A (lives)

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!")

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_1.png)


    # STEP 7


    You can use comments in different ways. For example, Block Comments are a large
    section of text that details what’s going on in the code, such as telling the
    code reader what variables you’re planning on using:


    ```

    # This is the best game ever, and has been developed by a crack squad of Python
    experts

    # who haven’t slept or washed in weeks. Despite being very smelly, the code at
    least

    # works really well.

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_2.png)


    # STEP 8


    Inline comments are comments that follow a section of code. Take our examples
    from above, instead of inserting the code on a separate line, we could use:


    ```

    a=10 # Set the start value of A to 10

    print("The value of A is,", a) # Print the current value of A

    a=a-1 # Player lost a life!

    print("You’ve just lost a life!")

    print("You now have", a, "lives left!") # Inform player, and display current value
    of A (lives)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_3.png)


    # STEP 9


    The comment, the hash symbol, can also be used to comment out sections of code
    you don’t want to be executed in your program. For instance, if you wanted to
    remove the first print statement, you would use:


    ```

    # print("The value of A is,", a)

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_4.png)


    # STEP 10


    You also use three single quotes to comment out a Block Comment or multi-line
    section of comments. Place them before and after the areas you want to comment
    for them to work:


    ```

    ''''''

    This is the best game ever, and has been developed by a crack squad of Python
    experts who haven’t slept or washed in weeks. Despite being very smelly, the code
    at least works really well.

    ''''''

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_32_5.png)'
