  - "[PAGE 73]\n\n# Tkinter Module\n\nWhile running your code from the command line,\
    \ or even in the Shell, is perfectly fine, Python is capable of so much more.\
    \ The Tkinter module enables the programmer to set up a Graphical User Interface\
    \ to interact with the user, and it’s surprisingly powerful too.\n\n# GETTING\
    \ GUI\n\nTkinter is easy to use but there’s a lot more you can do with it. Let’s\
    \ start by seeing how it works and getting some code into it. Before long you\
    \ will discover just how powerful this module really is.\n\n# STEP 1\n\nTkinter\
    \ is usually built into Python 3. However, if it’s available when you enter: import\
    \ tkinter, then you need to pip install tkinter from the command prompt. We can\
    \ start to import modules differently than before, to save on typing and by importing\
    \ all their contents:\n\n```\nimport tkinter as tk\nfrom tkinter import *\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_0.png)\n\n# STEP 3\n\nThe ideal\
    \ approach is to add mainloop() into the code to control the Tkinter event loop,\
    \ but we’ll get to that soon. You’ve just created a Tkinter widget and there are\
    \ several more we can play around with:\n\n```\nbtn=Button()\nbtn.pack()\nbtn[\"\
    text\"]=\"Hello everyone!\"\n```\n\nThe first line focuses on the newly created\
    \ window. Click back into the Shell and continue the other lines.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_1.png)\n\
    \n# STEP 2\n\nIt’s not recommended to import everything from a module using the\
    \ asterisk but it won’t do any harm normally. Let’s begin by creating a basic\
    \ GUI window, enter:\n\n```\nwind=Tk()\n```\n\nThis creates a small, basic window.\
    \ There’s not much else to do at this point but click the X in the corner to close\
    \ the window.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_2.png)\n\n# STEP\
    \ 4\n\nYou can combine the above into a New File:\n\n```\nimport tkinter as tk\n\
    from tkinter import *\nbtn=Button()\nbtn.pack()\nbtn[\"text\"]=\"Hello everyone!\"\
    \n```\n\nThen add some button interactions:\n\n```\ndef click():\n    print(\"\
    You just clicked me!\")\nbtn[\"command\"]=click\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_73_3.png)"
  - "[PAGE 74]\n\n# STEP 5\n\nSave and execute the code from Step 4 and a window appears\
    \ with 'Hello everyone!' inside. If you click the Hello everyone! button, the\
    \ Shell will output the text 'You just clicked me!'. It's simple but shows you\
    \ what can be achieved with a few lines of code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_0.png)\n\
    \n# STEP 6\n\nYou can also display both text and images within a Tkinter window.\
    \ However, only GIF, PGM or PPM formats are supported. So find an image and convert\
    \ it before using the code. Here's an example using the BDM Publishing logo:\n\
    \n```\nfrom tkinter import *\nroot = Tk()\nlogo = PhotoImage(file=\"/home/pi/Downloads/BDM_logo.gif\"\
    )\nw1 = Label(root, root.title(\"BDM Publications\"), image=logo).pack(side=\"\
    right\")\ncontent = \"\"\" From its humble beginnings in 2004, the BDM brand quickly\
    \ grew from a single publication produced by a team of just two to one of the\
    \ biggest names in global bookazine publishing, for two simple reasons. Our passion\
    \ and commitment to deliver the very best product each and every volume. While\
    \ the company has grown with a portfolio of over 250 publications delivered by\
    \ our international staff, the foundation that it has been built upon remains\
    \ the same, which is why we believe BDM isn't just the first choice it's the only\
    \ choice for the smart consumer. \"\"\"\nw2 = Label(root, justify=LEFT, padx =\
    \ 10, text=content).pack(side=\"left\")\nroot.mainloop()\n```\n\n# STEP 7\n\n\
    The previous code is quite weighty, mostly due to the content variable holding\
    \ a part of BDM's About page from the company website. You can obviously change\
    \ the content, the root.title and the image to suit your needs.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_1.png)\n\
    \n# STEP 8\n\nYou can create radio buttons too. Try:\n\n```\nfrom tkinter import\
    \ *\nroot = Tk()\nv = IntVar()\nLabel(root, root.title(\"Options\"), text=\"\"\
    \"Choose a preferred language:\"\"\", justify = LEFT, padx = 20).pack()\nRadiobutton(root,\
    \ text=\"Python\", padx = 20, variable=v, value=1).pack(anchor=W)\nRadiobutton(root,\
    \ text=\"C++\", padx = 20, variable=v, value=2).pack(anchor=W)\nmainloop()\n```\n\
    \n# STEP 9\n\nYou can also create check boxes, with buttons and output to the\
    \ Shell:\n\n```\nfrom tkinter import *\nroot = Tk()\ndef var_states():\n    print(\"\
    Warrior: %d,\\nMage: %d\" % (var1.get(), var2.get()))\nLabel(root, root.title(\"\
    Adventure Game\"), text=\">>>>>>>>>Your adventure role<<<<<<<<<<\").grid(row=0,\
    \ sticky=N)\nvar1 = IntVar()\nCheckbutton(root, text=\"Warrior\", variable=var1).grid(row=1,\
    \ sticky=W)\nvar2 = IntVar()\nCheckbutton(root, text=\"Mage\", variable=var2).grid(row=2,\
    \ sticky=W)\nButton(root, text='Quit', command=root.destroy).grid(row=3, sticky=W,\
    \ pady=4)\nButton(root, text='Show', command=var_states).grid(row=3, sticky=E,\
    \ pady=4)\nmainloop()\n```\n\n# STEP 10\n\nThe code from Step 9 introduced some\
    \ new geometry elements into Tkinter. Note the sticky=N, E and W arguments. These\
    \ describe the locations of the check boxes and buttons (North, East, South and\
    \ West). The row argument places them on separate rows. Have a play around and\
    \ see what you get.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_74_2.png)"
  - "[PAGE 75]\n\n# Pygame Module\n\nWe’ve had a brief look at the Pygame module already\
    \ but there’s a lot more to it that needs exploring. Pygame was developed to help\
    \ Python programmers create either graphical or text-based games.\n\n# PYGAMING\n\
    \nPygame isn’t an inherent module to Python but those using the Raspberry Pi will\
    \ already have it installed. Everyone else will need to use: pip install pygame\
    \ from the command prompt.\n\nSTEP 1 Naturally you need to load up the Pygame\
    \ modules into memory before you’re able to utilise them. Once that’s done Pygame\
    \ requires the user to initialise it prior to any of the functions being used:\n\
    \n```\nimport pygame\npygame.init()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_75_0.png)\n\
    \nSTEP 3 Sadly you can’t close the newly created Pygame window without closing\
    \ the Python IDLE Shell, which isn’t very practical. For this reason, you need\
    \ to work in the editor (New > File) and create a True/False while loop:\n\n```\n\
    import pygame\nfrom pygame.locals import *\npygame.init()\n\ngamewindow=pygame.display.set_mode((800,600))\n\
    pygame.display.set_caption(\"Adventure Game\")\n\nrunning=True\n\nwhile running:\n\
    \    for event in pygame.event.get():\n        if event.type==QUIT:\n        \
    \    running=False\n            pygame.quit()\n```\n\nSTEP 2 Let’s create a simple\
    \ game ready window, and give it a title:\n\n```\ngamewindow=pygame.display.set_mode((800,600))\n\
    pygame.display.set_caption(\"Adventure Game\")\n```\n\nYou can see that after\
    \ the first line is entered, you need to click back into the IDLE Shell to continue\
    \ entering code; also, you can change the title of the window to anything you\
    \ like.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_75_1.png)\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_75_2.png)"
  - "[PAGE 76]\n\n**STEP 4** If the Pygame window still won’t close don’t worry, it’s\
    \ just a discrepancy between the IDLE (which is written with Tkinter) and the\
    \ Pygame module. If you run your code via the command line, it closes perfectly\
    \ well.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_76_0.png)\n\n**STEP 5** You’re\
    \ going to shift the code around a bit now, running the main Pygame code within\
    \ a while loop; it makes it neater and easier to follow. We’ve downloaded a graphic\
    \ to use and we need to set some parameters for pygame:\n\n```\n```python\nimport\
    \ pygame\npygame.init()\n\nrunning=True\n\nwhile running:\n    gamewindow=pygame.display.set_mode((800,600))\n\
    \    pygame.display.set_caption(\"Adventure Game\")\n    black=(0,0,0)\n    white=(255,255,255)\n\
    ```\n```\n\n```\n```python\nimg=pygame.image.load(\"/home/pi/Downloads/sprite1.png\"\
    )\n\ndef sprite(x,y):\n    gamewindow.blit(img, (x,y))\n\nx=(800*0.45)\ny=(600*0.8)\n\
    \ngamewindow.fill(white)\nsprite(x,y)\npygame.display.update()\n\nfor event in\
    \ pygame.event.get():\n    if event.type==pygame.QUIT:\n        running=False\n\
    ```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_76_1.png)\n\n**STEP 6** Let’s\
    \ quickly go through the code changes. We’ve defined two colours, black and white\
    \ together with their respective RGB colour values. Next we’ve loaded the downloaded\
    \ image called sprite1.png and allocated it to the variable img; and also defined\
    \ a sprite function and the blit function will allow us to eventually move the\
    \ image.\n\n```\n```python\nimport pygame\nfrom pygame.locals import *\npygame.init()\n\
    \nrunning=True\n\nwhile running:\n    gamewindow=pygame.display.set_mode((800,600))\n\
    \    pygame.display.set_caption(\"Adventure Game\")\n    black=(0,0,0)\n    white=(255,255,255)\n\
    \    img=pygame.image.load(\"/home/pi/Downloads/sprite1.png\")\n\n    def sprite(x,y):\n\
    \        gamewindow.blit(img, (x,y))\n```\n```\n\n```\n```python\nx=(800*0.45)\n\
    y=(600*0.8)\n\ngamewindow.fill(white)\nsprite(x,y)\npygame.display.update()\n\n\
    for event in pygame.event.get():\n    if event.type==pygame.QUIT:\n        running=False\n\
    \        pygame.quit()\n```\n```"
