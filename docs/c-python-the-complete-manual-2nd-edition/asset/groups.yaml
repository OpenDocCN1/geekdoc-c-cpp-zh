    \ C++ a variable has to be declared with its type before it can be used.\n\n###\
    \ THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable by using statements\
    \ within the code. There are several distinct types of variables you can declare.\
    \ Here’s how it works.\n\n#### STEP 1\n\nOpen up a new, blank C++ file and enter\
    \ the usual code headers:\n\n```\n#include <iostream>\nusing namespace std;\n\n\
    int main()\n{\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_105_0.png)\n\
    \n#### STEP 2\n\nStart simple by creating two variables, a and b, with one having\
    \ a value of 10 and the other 5. You can use the data type int to declare these\
    \ variables. Within the curly brackets, enter:\n\n```\nint a;\nint b;\n\na = 10;\n\
    b = 5;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_105_2.png)\n\n#### STEP\
    \ 3\n\nYou can build and run the code but it won’t do much, other than store the\
    \ values 10 and 5 to the integers a and b. To output the contents of the variables,\
    \ add:\n\n```\ncout << a;\ncout << \"\\n\";\ncout << b;\n```\n\nThe `cout << \"\
    \\n\";` part simply places a new line between the output of 10 and 5.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_105_1.png)\n\
    \n#### STEP 4\n\nNaturally you can declare a new variable, call it result and\
    \ output some simple arithmetic:\n\n```\nint result;\nresult = a + b;\ncout <<\
    \ result;\n```\n\nInsert the above into the code as per the screenshot.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_105_3.png)\n\
    \n#### STEP 5\n\nYou can assign a value to a variable as soon as you declare it.\
    \ The code you’ve typed in could look like this, instead:\n\n```\nint a = 10;\n\
    int b = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_106_0.png)\n\
    \n#### STEP 6\n\nSpecific to C++, you can also use the following to assign values\
    \ to a variable as soon as you declare them:\n\n```\nint a (10);\nint b (5);\n\
    ```\n\nThen, from the C++ 2011 standard, using curly brackets:\n\n```\nint result\
