    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_28_4.png)


    **STEP 10** 保存 hello.py 文件并返回到命令行。现在使用以下命令执行新保存的代码：


    ```bash

    python3 hello.py

    ```


    结果将是原始的 Python is cool 语句，加上新增的 input 命令要求你输入姓名，并在命令行窗口中显示它。


