  mdcn: "\n\n### Step 5\n\n可以通过模块为 Python 添加额外的函数。Python 有大量可用的模块，可以涵盖众多编程任务。它们会添加函数，并且可以根据需要随时导入。例如，要使用高级数学函数，请输入：\n\
