    \ STEP 9\n\nThe modern C++ compiler is far more intelligent than most programmers\
    \ give it credit. While there are numerous data types you can declare for variables,\
    \ you can in fact use the auto feature:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.141593;\n\nint main()\n{\n    double area, radius = 1.5;\n\
    \    area = pi * radius * radius;\n    cout << area;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_106_4.png)\n\
    \n#### STEP 10\n\nA couple of new elements here: first, auto won’t work unless\
    \ you go to Settings > Compiler and tick the box labelled ‘Have G++ follow the\
    \ C++11 ISO C++ Language Standard [-std=c++11]’. Then, there’s the new data type,\
    \ double, which means a double-precision floating point value. Enable C++11, then\
    \ build and run the code. The result should be 7.06858.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_106_5.png)\n\
