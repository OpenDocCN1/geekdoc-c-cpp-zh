  md: "\n## C++ Input/Output\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_113_0.png)\n\
    \nThere’s a satisfying feeling when you program code that asks the user for input,\
    \ then uses that input to produce something that the user can see. Even if it’s\
    \ simply asking for someone’s name, and displaying a personal welcome message,\
    \ it’s a big leap forward.\n\nUser interaction, character literals, defining constants\
    \ and file input and output are all covered in the following pages. All of which\
    \ help you to understand how a C++ program works better.\n\n- 116 User Interaction\n\
    - 118 Character Literals\n- 120 Defining Constants\n- 122 File Input/Output\n\n\
    ## User Interaction\n\nThere’s nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you’re able to do much more than simply\
    \ greet the user by name.\n\n### HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you’re going to be using cin,\
    \ the standard input stream, to prompt a user response.\n\n### STEP 1\n\nAnything\
    \ that you want the user to input into the program needs to be stored somewhere\
    \ in the system memory, so it can be retrieved and used. Therefore, any input\
    \ must first be declared as a variable, so it’s ready to be used by the user.\
    \ Start by creating a blank C++ file with headers.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_0.png)\n\
    \n### STEP 2\n\nThe data type of the variable must also match the type of input\
    \ you want from the user. For example, to ask a user their age, you would use\
    \ an integer like this:\n\n```\n#include <iostream>\nusing namespace std;\n\n\
    int main ()\n{\n    int age;\n    cout << \"what is your age: \";\n    cin >>\
    \ age;\n\n    cout <<\"\\nYou are \" << age << \" years old.\\n\";\n}\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_1.png)\n\n### STEP 3\n\nThe cin command\
    \ works in the opposite way from the cout command. With the first cout line you’re\
    \ outputting ‘What is your age’ to the screen, as indicated with the chevrons.\
    \ Cin uses opposite facing chevrons, indicating an input. The input is put into\
    \ the integer age and called up in the second cout command. Build and run the\
    \ code.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_2.png)\n\n### STEP 4\n\
    \nIf you’re asking a question, you need to store the input as a string; to ask\
    \ the user their name, you would use:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    string name;\n    cout << \"what is your name: \"\
    ;\n    cin >> name;\n\n    cout << \"\\nHello, \" << name << \" . I hope you’re\
    \ well today?\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_3.png)\n\
    \n### STEP 5\n\nThe principal works the same as the previous code. The user's\
    \ input, their name, is stored in a string, because it contains multiple characters,\
    \ and retrieved in the second cout line. As long as the variable 'name' doesn't\
    \ change, then you can recall it wherever you like in your code\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_0.png)\n\
    \n### STEP 6\n\nYou can chain input requests to the user but just make sure you\
    \ have a valid variable to store the input to begin with. Let's assume you want\
    \ the user to enter two whole numbers:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    int num1, num2;\n\n    cout << \"Enter two whole\
    \ numbers: \";\n    cin >> num1 >> num2;\n\n    cout << \"you entered \" << num1\
    \ << \" and \" << num2 << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_1.png)\n\
    \n### STEP 7\n\nLikewise, inputted data can be manipulated once you have it stored\
    \ in a variable. For instance, ask the user for two numbers and do some maths\
    \ on them:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    float num1, num2;\n\n    cout << \"Enter two numbers: \\n\";\n    cin >>\
    \ num1 >> num2;\n\n    cout << num1 << \" + \" << num2 << \" is: \" << num1 +\
    \ num2 << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_2.png)\n\
    \n### STEP 8\n\nWhile cin works well for most input tasks, it does have a limitation.\
    \ Cin always considers spaces as a terminator, so it's designed for just single\
    \ words not multiple words. However, getline takes cin as the first argument and\
    \ the variable as the second:\n\n```\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    string mystr;\n    cout << \"Enter a sentence: \\n\";\n\
    \    getline(cin, mystr);\n\n    cout << \"Your sentence is: \" << mystr.size()\
    \ << \" characters long.\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_3.png)\n\
    \n### STEP 9\n\nBuild and execute the code, then enter a sentence with spaces.\
    \ When you're done the code reads the number of characters. If you remove the\
    \ getline line and replace it with cin >> mystr and try again, the result displays\
    \ the number of characters up to the first space.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_4.png)\n\
    \n### STEP 10\n\nGetline is usually a command that new C++ programmers forget\
    \ to include. The terminating white space is annoying when you can't figure out\
    \ why your code isn't working. In short, it's best to use getline(cin, variable)\
    \ in future:\n\n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    string name;\n    cout << \"Enter your full name: \\n\";\n    getline(cin,\
    \ name);\n\n    cout << \"\\nHello, \" << name << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_5.png)\n\
    \n## Character Literals\n\nIn C++ a literal is an object or variable that once\
    \ defined remains the same throughout the code. However, a character literal is\
    \ defined by a backslash, such as the \\n you've been using at the end of a cout\
    \ statement to signify a new line.\n\nWhen used in something like a cout statement,\
    \ character literals are also called Escape Sequence Codes. They allow you to\
    \ insert a quote, an alert, new line and much more.\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_0.png)\n\
    \nYou've already experienced the \\n character literal placing a new line wherever\
    \ it's placed. The line: cout << \"Hello\\n\" << \"I'm a C++\\n\" << \"Program!\\\
    n\"; outputs three lines of text, each starting after the last \\n.\n\n```\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main ()\n{\n\tcout << \"Hello\\\
    n\" << \"I'm a C++\\n\" << \"Program!\\n\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_1.png)\n\
    \nIf you wanted to insert speech quotes inside a cout statement, you would have\
    \ to use a backslash as it already uses quotes:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n\tcout << \"Hello, user. This is how to\
    \ use \\\"quotes\\\".\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_2.png)\n\
    \nThere's even a character literal that can trigger an alarm. In Windows 10, it's\
    \ the notification sound that chimes when you use \\a. Try this code, and turn\
    \ up your sound.\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main ()\n{\n\tcout << \"ALARM! \\a\";\n}\n```\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_3.png)\n\
    \n### A HANDY CHART\n\nThere are numerous character literals, or escape sequence\
    \ codes, to choose from. We therefore thought it would be good for you to have\
    \ a handy chart available, for those times when you need to insert a code.\n\n\
    | ESCAPE SEQUENCE CODE | CHARACTER |\n|---|---|\n| \\\\ | Backslash |\n| \\' |\
    \ Single Quote |\n| \\\" | Double Quote (Speech Marks) |\n| \\? | Question Mark\
    \ |\n| \\a | Alert/Alarm |\n| \\b | Backspace |\n| \\f | Form Feed |\n| \\n |\
    \ New Line |\n| \\r | Carriage Return |\n| \\t | Horizontal Tab |\n| \\v | Vertical\
    \ Tab |\n| \\0 | Null Character |\n| \\uxxxx | Unicode (UTF-8) |\n| \\Uxxxxxxxx\
    \ | Unicode (UTF-16) |\n\n### UNICODE CHARACTERS (UTF-8)\n\nUnicode characters\
    \ are symbols or characters that are standard across all platforms. For example,\
    \ the copyright symbol, that can be entered via the keyboard by entering the Unicode\
    \ code, followed by ALT+X. In the case of the copyright symbol enter: 00A9 Alt+X.\
    \ In C++ code, you would enter:\n\n```\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n    cout << \"\\u00A9\";\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_118_0.png)\n\
    \n### UNICODE CHARACTER TABLE\n\nA complete list of the available Unicode characters\
    \ can be found at www.unicode-table.com/en/. Hover your mouse over the character\
    \ to see its unique code to enter in C++.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_118_1.png)\n"
  mdcn: "\n\n## C++ 输入/输出\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_113_0.png)\n\
    \n当你编写代码让用户输入，然后使用该输入产生用户可见的内容时，会有一种令人满意的感觉。即使只是询问某人的名字，并显示个性化的欢迎信息，这也是向前迈出的重要一步。\n\
    \n用户交互、字符字面量、定义常量以及文件输入和输出都将在以下页面中介绍。所有这些都有助于你更好地理解 C++ 程序的工作原理。\n\n- 116 用户交互\n\
    - 118 字符字面量\n- 120 定义常量\n- 122 文件输入/输出\n\n## 用户交互\n\n没有什么比创建一个响应你的程序更令人满意的了。这种基本用户交互是任何语言中最常教授的方面之一，有了它，你就能做得远不止按名字问候用户。\n\
    \n### HELLO, DAVE\n\n你已经在我们的代码中多次使用过 cout，标准输出流。现在你将使用 cin，标准输入流，来提示用户响应。\n\n\
    ### STEP 1\n\n你希望用户输入到程序中的任何内容都需要存储在系统内存中的某个位置，以便检索和使用。因此，任何输入都必须首先声明为变量，以便用户可以使用。先创建一个空白的\
    \ C++ 文件并添加头文件。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_0.png)\n\n###\
    \ STEP 2\n\n变量的数据类型也必须与你希望从用户处获得的输入类型相匹配。例如，要询问用户的年龄，你会使用整数，如下所示：\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    int age;\n    cout <<\
    \ \"what is your age: \";\n    cin >> age;\n\n    cout <<\"\\nYou are \" << age\
    \ << \" years old.\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_1.png)\n\
    \n### STEP 3\n\ncin 命令的工作方式与 cout 命令相反。第一个 cout 行将“what is your age”输出到屏幕上，如尖括号所示。Cin\
    \ 使用相反方向的尖括号，表示输入。输入被放入整数 age 中，并在第二个 cout 命令中调用。构建并运行代码。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_2.png)\n\
    \n### STEP 4\n\n如果你要提问，需要将输入存储为字符串；要询问用户的名字，你会使用：\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    string name;\n    cout << \"what is\
    \ your name: \";\n    cin >> name;\n\n    cout << \"\\nHello, \" << name << \"\
    \ . I hope you’re well today?\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_115_3.png)\n\
    \n### STEP 5\n\n原理与之前的代码相同。用户的输入，即他们的名字，被存储在一个字符串中，因为它包含多个字符，并在第二个 cout 行中检索。只要变量\
    \ 'name' 不改变，你就可以在代码中的任何地方调用它\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_0.png)\n\
    \n### STEP 6\n\n你可以将输入请求链接给用户，但只要确保一开始有有效的变量来存储输入即可。假设你希望用户输入两个整数：\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    int num1, num2;\n\n\
    \    cout << \"Enter two whole numbers: \";\n    cin >> num1 >> num2;\n\n    cout\
    \ << \"you entered \" << num1 << \" and \" << num2 << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_1.png)\n\
    \n### STEP 7\n\n同样，一旦你将数据存储在变量中，就可以对其进行操作。例如，询问用户两个数字并对其进行数学运算：\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    float num1, num2;\n\n\
    \    cout << \"Enter two numbers: \\n\";\n    cin >> num1 >> num2;\n\n    cout\
    \ << num1 << \" + \" << num2 << \" is: \" << num1 + num2 << \"\\n\";\n}\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_2.png)\n\n### STEP 8\n\n虽然 cin\
    \ 对于大多数输入任务效果很好，但它确实有一个限制。Cin 总是将空格视为终止符，因此它设计用于单个单词而不是多个单词。然而，getline 将 cin 作为第一个参数，变量作为第二个参数：\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    string\
    \ mystr;\n    cout << \"Enter a sentence: \\n\";\n    getline(cin, mystr);\n\n\
    \    cout << \"Your sentence is: \" << mystr.size() << \" characters long.\\n\"\
    ;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_3.png)\n\n### STEP 9\n\
    \n构建并执行代码，然后输入包含空格的句子。完成后代码会读取字符数。如果你删除 getline 行并用 cin >> mystr 替换它然后再试一次，结果会显示到第一个空格为止的字符数。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_4.png)\n\n### STEP 10\n\nGetline\
    \ 通常是新 C++ 程序员忘记包含的命令。当你无法弄清楚为什么代码无法工作时，终止空白会很烦人。简而言之，最好以后使用 getline(cin, variable)：\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    string\
    \ name;\n    cout << \"Enter your full name: \\n\";\n    getline(cin, name);\n\
    \n    cout << \"\\nHello, \" << name << \"\\n\";\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_116_5.png)\n\
    \n## 字符字面量\n\n在 C++ 中，字面量是一旦定义后在整个代码中保持不变的对象或变量。然而，字符字面量由反斜杠定义，例如你在 cout 语句末尾使用的\
    \ \\n 来表示新行。\n\n当在像 cout 语句这样的地方使用时，字符字面量也称为转义序列代码。它们允许你插入引号、警报、新行等。\n\n```\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_0.png)\n\n你已经体验过 \\n 字符字面量在放置的位置放置新行。行：cout\
    \ << \"Hello\\n\" << \"I'm a C++\\n\" << \"Program!\\n\"; 输出三行文本，每行在最后一个 \\n 之后开始。\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\t\
    cout << \"Hello\\n\" << \"I'm a C++\\n\" << \"Program!\\n\";\n}\n```\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_1.png)\n\n如果你想在 cout 语句中插入语音引号，就必须使用反斜杠，因为它本身就使用引号：\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\t\
    cout << \"Hello, user. This is how to use \\\"quotes\\\".\";\n}\n```\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_2.png)\n\n甚至有一个字符字面量可以触发警报。在 Windows\
    \ 10 中，它是使用 \\a 时响起的通知声音。试试这段代码，并调大你的音量。\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n\tcout << \"ALARM! \\a\";\n}\n```\n```\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_117_3.png)\n\n### A HANDY CHART\n\n\
    有许多字符字面量或转义序列代码可供选择。因此我们认为在你需要插入代码时为你提供一个方便的图表会很好。\n\n| ESCAPE SEQUENCE CODE |\
    \ CHARACTER |\n|---|---|\n| \\\\ | Backslash |\n| \\' | Single Quote |\n| \\\"\
    \ | Double Quote (Speech Marks) |\n| \\? | Question Mark |\n| \\a | Alert/Alarm\
    \ |\n| \\b | Backspace |\n| \\f | Form Feed |\n| \\n | New Line |\n| \\r | Carriage\
    \ Return |\n| \\t | Horizontal Tab |\n| \\v | Vertical Tab |\n| \\0 | Null Character\
    \ |\n| \\uxxxx | Unicode (UTF-8) |\n| \\Uxxxxxxxx | Unicode (UTF-16) |\n\n###\
    \ UNICODE CHARACTERS (UTF-8)\n\nUnicode 字符是跨所有平台标准的符号或字符。例如，版权符号，可以通过输入 Unicode\
    \ 代码然后按 ALT+X 在键盘上输入。版权符号的情况下输入：00A9 Alt+X。在 C++ 代码中，你会输入：\n\n```\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n    cout << \"\\u00A9\";\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_118_0.png)\n\
    \n### UNICODE CHARACTER TABLE\n\n可用的 Unicode 字符的完整列表可以在 www.unicode-table.com/en/\
    \ 上找到。将鼠标悬停在字符上以查看在 C++ 中输入的唯一代码。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_118_1.png)\n\
    \n"
