    \ float 或 double，具体取决于所需的精度。运行代码并查看结果。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_111_1.png)\n\
    \n### 步骤 3\n\n乘法和除法可以这样应用：\n\n```\n#include <iostream>\nusing namespace std;\n\
