    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_33_2.png)


    步骤4 你也可以在另一个变量中组合变量。例如，要将 name 和 title 这两个变量组合成一个新变量，我们使用：character=name + ":
    " + title


