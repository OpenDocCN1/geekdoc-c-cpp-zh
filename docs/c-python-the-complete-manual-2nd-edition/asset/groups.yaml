    # C++ COMMENTS


    Commenting in C++ involves using a double forward slash ''//'', or a forward slash
    and an asterisk, ''/*''. You''ve already seen some brief examples but this is
    how they work.


    # STEP 1


    Using the Hello World code as an example, you can easily comment on different
    sections of the code using the double forward slash:


    ```

    //My first C++ program

    cout << "Hello, world!\n";

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_0.png)


    # STEP 4


    Be careful when commenting, especially with block comments. It''s very easy to
    forget to add the closing asterisk and forward slash and thus negate any code
    that falls inside the comment block.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_1.png)


    # STEP 2


    However, you can also add comments to the end of a line of code, to describe in
    a better way what''s going on:


    ```

    cout << "Hello, world!\n"; //This line outputs the words ''Hello, world!''. The
    \n denotes a new line.

    ```


    Note, you don''t have to put a semicolon at the end of a comment. This is because
    it''s a line in the code that''s ignored by the compiler.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_2.png)


    # STEP 5


    Obviously if you try and build and execute the code it errors out, complaining
    of a missing curly bracket ''}'' to finish off the block of code. If you''ve made
    the error a few times, then it can be time consuming to go back and rectify. Thankfully,
    the colour coding in Code::Blocks helps identify comments from code.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_3.png)


    # STEP 3


    You can comment out several lines by using the forward slash and asterisk:


    ```

    /* This comment can

    cover several lines

    without the need to add more slashes */

    ```


    Just remember to finish the block comment with the opposite asterisk and forward
    slash.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_4.png)


    # STEP 6


    If you''re using block comments, it''s good practise in C++ to add an asterisk
    to each new line of the comment block. This also helps you to remember to close
    the comment block off before continuing with the code:


    ```

    /* This comment can

    *   cover several lines

    *   without the need to add more slashes */

    ```


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_104_5.png)'
