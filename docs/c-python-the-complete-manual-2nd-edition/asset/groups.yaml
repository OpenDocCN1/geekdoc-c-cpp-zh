  mdcn: "\n\n## Do... While 循环\n\ndo...while 循环与 for 甚至 while 循环略有不同。for 和 while 都在循环开始时（或者如果你愿意，也可以说是循环顶部）设置并检查条件状态。而\
    \ do...while 循环类似于 while 循环，但它是在循环底部检查条件。\n\n### do 循环\n\ndo...while 循环的一个优点是它保证至少运行一次。其结构是：do，后跟语句，while\
    \ 条件为真。其工作原理如下。\n\n#### 步骤 1\n\n从一个新的空白 C++ 文件开始，输入标准头文件：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_0.png)\n\
    \n#### 步骤 2\n\n从一个简单的数字计数开始：\n\n```cpp\n{\n    int num = 1;\n    do\n    {\n \
    \       cout << \"Number: \" << num << endl;\n        num = num + 1;\n    }\n\
    \    while (num < 30 );\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_1.png)\n\
    \n#### 步骤 3\n\n现在，来看一下 do...while 循环的结构。首先你创建一个名为 num 的整数，值为 1。接着 do...while 循环开始。循环体内的代码至少执行一次，然后检查条件为真或为假。\n\
    \n```cpp\n// Create integer with the value of 1\nint num = 1;\n\n// Do... While\
    \ loop begins\ndo\n{\n    cout << \"Number: \" << num << endl; // Display the\
    \ current value of num\n    num = num + 1; // Adds 1 to the value of num\n}\n\
    while (num < 30 ); // Tests the condition of num (true or false)\n```\n\n####\
    \ 步骤 4\n\n如果条件为真，则执行循环。如此持续，直到条件为假。当条件为假时，循环终止，代码继续执行。这意味着你可以创建一个循环，使代码持续运行，直到用户输入某个特定字符。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_129_2.png)\n\n#### 步骤 5\n\n如果你希望代码累加用户输入的数字，直到用户输入零：\n\
    \n```cpp\n{\n    float number, sum = 0.0;\n    cout << \"**** Program to execute\
    \ a Do... While loop continuously ****\" << endl;\n    cout << \"\\nEnter 0 to\
    \ stop and display the sum of all the numbers entered\\n\" << endl;\n    cout\
    \ << \"\\n------------------------------\\n\" << endl;\n    do {\n        cout<<\"\
    \\nPlease enter a number: \";\n        cin>>number;\n        sum += number;\n\
    \    }\n    while(number != 0.0);\n    cout<<\"Total sum of all numbers: \"<<sum;\n\
    \    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_0.png)\n\
    \n#### 步骤 6\n\n步骤 5 中的代码工作原理如下：定义了两个浮点变量 number 和 sum，初值均为 0.0。先给用户一段简要的说明，然后\
    \ do...while 循环开始。\n\n```cpp\nfloat number, sum = 0.0;\ncout << \"**** Program\
    \ to execute a Do... While loop continuously ****\" << endl;\ncout << \"\\nEnter\
    \ 0 to stop and display the sum of all the numbers entered\\n\" << endl;\ncout\
    \ << \"\\n------------------------------\\n\" << endl;\n```\n\n#### 步骤 7\n\n此处的\
    \ do...while 循环要求用户输入一个数字，该数字赋给浮点变量 number。计算步骤使用第二个浮点变量 sum，每当用户输入新值时，它都会将 number\
    \ 的值累加到 sum 中。\n\n```cpp\ndo {\n    cout << \"\\nPlease enter a number: \";\n\
    \    cin >> number;\n    sum += number;\n}\n```\n\n#### 步骤 8\n\n最后，while 语句检查变量\
    \ number 的条件。如果用户输入了零，则循环终止；如果没有，则无限继续。当用户最终输入零时，显示 sum 的值，即用户所有输入的总和。循环及程序随之结束。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_1.png)\n\n#### 步骤 9\n\n使用前面用过的倒计时和“发射！”代码，do...while\
    \ 循环如下所示：\n\n```cpp\n{\n    int a = 10;\n    do {\n        cout << a << endl;\n\
    \        a = a - 1;\n    }\n    while ( a != 0 );\n    cout << \"\\nBlast Off!\"\
    \ << endl;\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_2.png)\n\
    \n#### 步骤 10\n\n使用 do...while 循环的主要优点是它是一个退出条件循环；而 while 循环是一个入口控制循环。因此，如果你的代码需要一个至少执行一次的循环（例如，检查游戏中的生命次数），那么\
    \ do...while 循环非常理想。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_130_3.png)\n\n\
    ## If 语句\n\n#### 步骤 5\n\n当你将值改为大于 30 的任意数值，然后编译并运行代码，你会看到输出到屏幕的唯一一行是第二个 cout 语句，显示\
    \ num 的当前值。这是因为最初的 if 语句为假，所以它忽略了大括号内的代码。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_0.png)\n\
    \n#### 步骤 6\n\n你可以在 do...while 循环中包含 if 语句。例如：\n\n```cpp\n{\n    float temp;\n\
    \    do\n    {\n        cout << \"\\nEnter the temperature (or -10000 to exit):\
    \ \" << endl;\n        cin >> temp;\n        if (temp <= 0 )\n        {\n    \
    \        cout << \"\\nBrrrr, it's really cold!\" << endl;\n        }\n       \
    \ if (temp > 0 )\n        {\n            cout << \"\\nAt least it's not freezing!\"\
    \ << endl;\n        }\n    }\n    while ( temp != -10000 );\n    cout << \"\\\
    nGood bye\\n\" << endl;\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_1.png)\n\
    \n#### 步骤 7\n\n步骤 6 中的代码虽然简单但很有效。首先，我们创建了一个名为 temp 的浮点变量，然后使用 do...while 循环要求用户输入当前温度。\n\
    \n```cpp\nfloat temp;\ndo\n{\n    cout << \"\\nEnter the temperature (or -10000\
    \ to exit): \" << endl;\n    cin >> temp;\n```\n\n#### 步骤 8\n\n第一个 if 语句检查用户输入的值是否小于或等于零。如果是，则输出“Brrrr，真冷！”。否则，如果输入大于零，代码输出“至少没有结冰！”。\n\
    \n```cpp\ndo\n{\n    cout << \"\\nEnter the temperature (or -10000 to exit): \"\
    \ << endl;\n    cin >> temp;\n    if (temp <= 0 )\n    {\n        cout << \"\\\
    nBrrrr, it's really cold!\" << endl;\n    }\n    if (temp > 0 )\n    {\n     \
    \   cout << \"\\nAt least it's not freezing!\" << endl;\n    }\n}\n```\n\n####\
    \ 步骤 9\n\n最后，如果用户输入值 -10000（这个温度不可能，因此是一个不现实的数值），do...while 循环终止，并在屏幕上显示友好的“再见”。\n\
    \n```cpp\nfloat temp;\ndo\n{\n    cout << \"\\nEnter the temperature (or -10000\
    \ to exit): \" << endl;\n    cin >> temp;\n    if (temp <= 0 )\n    {\n      \
