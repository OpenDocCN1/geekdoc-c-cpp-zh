    \ in the same command, as you would a set of similar variables. You need to either\
    \ turn one into the other or vice versa. When you do try to combine both, you\
    \ get an error message:\n\n```\nprint (name + age)\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_0.png)\n\
    \n## STEP 6\n\nThis is a process known as TypeCasting. The Python code is:\n\n\
    ```\nprint (character + \" is \" + str(age) + \" years old.\")\n```\n\nor you\
    \ can use:\n\n```\nprint (character, \"is\", age, \"years old.\")\n```\n\nNotice\
    \ again that in the last example, you don't need the spaces between the words\
    \ in quotes as the commas treat each argument to print separately.\n\n```\n>>>\
    \ print (name + age)\nTraceback (most recent call last):\n  File \"<pyshell#18>\"\
    , line 1, in <module>\n    print (name + age)\nTypeError: Can't convert 'int'\
    \ object to str implicitly\n>>> print (character + \" is \" + str(age) + \" years\
    \ old.\")\nDavid Hayward: Descended from Vikings is 44 years old.\n>>> print (character,\
    \ \"is\", age, \"years old.\")\nDavid Hayward: Descended from Vikings is 44 years\
    \ old.\n```\n\n## STEP 7\n\nAnother example of TypeCasting is when you ask for\
    \ input from the user, such as a name. for example, enter:\n\n```\nage= input\
    \ (\"How old are you? \")\n```\n\nAll data stored from the Input command is stored\
    \ as a string variable.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_1.png)\n\
    \n## STEP 8\n\nThis presents a bit of a problem when you want to work with a number\
    \ that's been inputted by the user, as age + 10 won't work due to being a string\
    \ variable and an integer. Instead, you need to enter:\n\n```\nint(age) + 10\n\
    ```\n\nThis will TypeCast the age string into an integer that can be worked with.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_2.png)\n\n## STEP 9\n\nThe use of\
    \ TypeCasting is also important when dealing with floating point arithmetic; remember:\
    \ numbers that have a decimal point in them. For example, enter:\n\n```\nshirt=19.99\n\
    ```\n\nNow enter type(shirt) and you'll see that Python has allocated the number\
    \ as a 'float', because the value contains a decimal point.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_3.png)\n\
    \n## STEP 10\n\nWhen combining integers and floats Python usually converts the\
    \ integer to a float, but should the reverse ever be applied it's worth remembering\
    \ that Python doesn't return the exact value. When converting a float to an integer,\
    \ Python will always round down to the nearest integer, called truncating; in\
    \ our case instead of 19.99 it becomes 19.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_4.png)\n\
    \n## User Input\n\nWe’ve seen some basic user interaction with the code from a\
    \ few of the examples earlier, so now would be a good time to focus solely on\
    \ how you would get information from the user then store and present it.\n\n###\
    \ USER FRIENDLY\n\nThe type of input you want from the user will depend greatly\
    \ on the type of program you’re coding. For example, a game may ask for a character’s\
    \ name, whereas a database can ask for personal details.\n\n## STEP 1\n\nIf it’s\
    \ not already, open the Python 3 IDLE Shell, and start a New File in the Editor.\
    \ Let’s begin with something really simple, enter:\n\n```\nprint(\"Hello\")\n\
    firstname=input(\"What is your first name? \")\nprint(\"Thanks.\")\nsurname=input(\"\
    And what is your surname? \")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_0.png)\n\
    \n## STEP 3\n\nNow that we have the user’s name stored in a couple of variables\
    \ we can call them up whenever we want:\n\n```\nprint(\"Welcome\", firstname,\
    \ surname, \". I hope you’re well today.\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_1.png)\n\
    \n## STEP 2\n\nSave and execute the code, and as you already no doubt suspected,\
    \ in the IDLE Shell the program will ask for your first name, storing it as the\
    \ variable firstname, followed by your surname; also stored in its own variable\
    \ (surname).\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_2.png)\n\n## STEP\
    \ 4\n\nRun the code and you can see a slight issue, the full stop after the surname\
    \ follows a blank space. To eliminate that we can add a plus sign instead of the\
    \ comma in the code:\n\n```\nprint(\"Welcome\", firstname, surname+\". I hope\
    \ you’re well today.\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_3.png)\n\
    \n## STEP 5\n\nYou don’t always have to include quoted text within the input command.\
    \ For example, you can ask the user their name, and have the input in the line\
    \ below:\n\n```\nprint(\"Hello. What’s your name?\")\nname=input()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_0.png)\n\
    \n## STEP 6\n\nThe code from the previous step is often regarded as being a little\
    \ neater than having a lengthy amount of text in the input command, but it’s not\
    \ a rule that’s set in stone, so do as you like in these situations. Expanding\
    \ on the code, try this:\n\n```\nprint(\"Halt! Who goes there?\")\nname=input()\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_1.png)\n\n## STEP 7\n\nIt’s\
    \ a good start to a text adventure game, perhaps? Now you can expand on it and\
    \ use the raw input from the user to flesh out the game a little:\n\n```\nif name==\"\
    David\":\n    print(\"Welcome, good sir. You may pass.\")\nelse:\n    print(\"\
    I know you not. Prepare for battle!\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_2.png)\n\
    \n## STEP 8\n\nWhat you’ve created here is a condition, which we will cover soon.\
    \ In short, we’re using the input from the user and measuring it against a condition.\
    \ So, if the user enters David as their name, the guard will allow them to pass\
    \ unhindered. Else, if they enter a name other than David, the guard challenges\
    \ them to a fight.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_3.png)\n\n##\
    \ STEP 9\n\nJust as you learned previously, any input from a user is automatically\
    \ a string, so you need to apply a TypeCast in order to turn it into something\
    \ else. This creates some interesting additions to the input command. For example:\n\
    \n```\n# Code to calculate rate and distance\nprint(\"Input a rate and a distance\"\
    )\nrate = float(input(\"Rate: \"))\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_4.png)\n\
    \n## STEP 10\n\nTo finalise the rate and distance code, we can add:\n\n```\ndistance\
    \ = float(input(\"Distance: \"))\nprint(\"Time:\", (distance / rate))\n```\n\n\
    Save and execute the code and enter some numbers. Using the float(input element,\
    \ we’ve told Python that anything entered is a floating point number rather than\
    \ a string.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_5.png)\n\n## Creating\
    \ Functions\n\nNow that you’ve mastered the use of variables and user input, the\
    \ next step is to tackle functions. You’ve already used a few functions, such\
    \ as the print command but Python enables you to define your own functions.\n\n\
    ### FUNKY FUNCTIONS\n\nA function is a command that you enter into Python to do\
    \ something. It’s a little piece of self-contained code that takes data, works\
    \ on it and then returns the result.\n\n## STEP 1\n\nIt’s not just data that a\
    \ function works on. They can do all manner of useful things in Python, such as\
    \ sort data, change items from one format to another and check the length or type\
    \ of items. Basically, a function is a short word that’s followed by brackets.\
    \ For example, len(), list() or type().\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_0.png)\n\
    \n## STEP 3\n\nYou can pass variables through functions in much the same manner.\
    \ Let’s assume you want the number of letters in a person’s surname, you could\
    \ use the following code (enter the text editor for this example):\n\n```\nname=input\
    \ (\"Enter your surname: \")\ncount=len(name)\nprint (\"Your surname has\", count,\
    \ \"letters in it.\")\n```\n\nPress F5 and save the code to execute it.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_1.png)\n\
    \n## STEP 2\n\nA function takes data, usually a variable, works on it depending\
    \ on what the function is programmed to do and returns the end value. The data\
    \ being worked on goes inside the brackets, so if you wanted to know how many\
    \ letters are in the word antidisestablishmentarianism, then you’d enter: len(\"\
    antidisestablishmentarianism\") and the number 28 would return.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_2.png)\n\
    \n## STEP 4\n\nPython has tens of functions built into it, far too many to get\
    \ into in the limited space available here. However, to view the list of built-in\
    \ functions available to Python 3, navigate to www.docs.python.org/3/library/functions.html.\
    \ These are the predefined functions, but since users have created many more,\
    \ they’re not the only ones available.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_3.png)\n"
  mdcn: "\n\n## 步骤 5\n\n然而，你不能像组合一组相似变量那样，在同一条命令中同时组合字符串和整数类型变量。你需要将其中一个转换为另一个，或者反过来。当你确实尝试组合两者时，你会收到一条错误信息：\n\
    \n```\nprint (name + age)\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_0.png)\n\
    \n## 步骤 6\n\n这就是所谓的类型转换（TypeCasting）过程。Python 代码如下：\n\n```\nprint (character +\
    \ \" is \" + str(age) + \" years old.\")\n```\n\n或者你可以使用：\n\n```\nprint (character,\
    \ \"is\", age, \"years old.\")\n```\n\n再次注意，在最后一个示例中，引号内的单词之间不需要空格，因为逗号会将每个参数分别传给\
    \ print。\n\n```\n>>> print (name + age)\nTraceback (most recent call last):\n\
    \  File \"<pyshell#18>\", line 1, in <module>\n    print (name + age)\nTypeError:\
    \ Can't convert 'int' object to str implicitly\n>>> print (character + \" is \"\
    \ + str(age) + \" years old.\")\nDavid Hayward: Descended from Vikings is 44 years\
    \ old.\n>>> print (character, \"is\", age, \"years old.\")\nDavid Hayward: Descended\
    \ from Vikings is 44 years old.\n```\n\n## 步骤 7\n\n类型转换的另一个例子是向用户请求输入时，例如输入名字。例如，输入：\n\
    \n```\nage= input (\"How old are you? \")\n```\n\n从输入命令存储的所有数据都是作为字符串变量存储的。\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_1.png)\n\n## 步骤 8\n\n当你想使用用户输入的数字时，这会带来一点小问题，因为\
    \ age + 10 无法正常工作，原因是一个是字符串变量，一个是整数。相反，你需要输入：\n\n```\nint(age) + 10\n```\n\n这会将\
    \ age 字符串类型转换为一个可处理的整数。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_2.png)\n\
    \n## 步骤 9\n\n在处理浮点数运算时，类型转换的使用也很重要；记住：浮点数就是带有小数点的数字。例如，输入：\n\n```\nshirt=19.99\n\
    ```\n\n现在输入 type(shirt)，你会看到 Python 将该数字定义为“浮点数”（float），因为该值包含小数点。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_3.png)\n\
    \n## 步骤 10\n\n当组合整数和浮点数时，Python 通常会将整数转换为浮点数，但如果需要反向转换，请记住 Python 不会返回精确值。将浮点数转换为整数时，Python\
    \ 总是向下取整到最接近的整数，这称为截断；在我们的例子中，19.99 会变成 19。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_34_4.png)\n\
    \n## 用户输入\n\n前面几个例子中我们已经看到了与代码的一些基本用户交互，所以现在是时候专门关注如何从用户那里获取信息，并将其存储和呈现了。\n\n\
    ### 用户友好\n\n你希望从用户那里获得的输入类型，在很大程度上取决于你正在编写的程序类型。例如，游戏可能会询问角色名称，而数据库可能会询问个人详细信息。\n\
    \n## 步骤 1\n\n如果还没有打开 Python 3 IDLE Shell，请先打开它，并在编辑器中新建一个文件。让我们从非常简单的内容开始，输入：\n\
    \n```\nprint(\"Hello\")\nfirstname=input(\"What is your first name? \")\nprint(\"\
    Thanks.\")\nsurname=input(\"And what is your surname? \")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_0.png)\n\
    \n## 步骤 3\n\n现在我们已经将用户的名字存储在了几个变量中，可以随时调用它们：\n\n```\nprint(\"Welcome\", firstname,\
    \ surname, \". I hope you’re well today.\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_1.png)\n\
    \n## 步骤 2\n\n保存并执行代码，正如你无疑已经猜到的那样，在 IDLE Shell 中，程序会询问你的名字，将其存储为变量 firstname，然后询问你的姓氏；姓氏也存储在其自己的变量（surname）中。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_2.png)\n\n## 步骤 4\n\n运行代码，你会发现一个小问题：姓氏后面的句号前面有一个空格。为了消除这个空格，我们可以在代码中用加号代替逗号：\n\
    \n```\nprint(\"Welcome\", firstname, surname+\". I hope you’re well today.\")\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_35_3.png)\n\n## 步骤 5\n\n你并不总是需要在\
    \ input 命令中包含带引号的文本。例如，你可以询问用户的名字，并在下一行进行输入：\n\n```\nprint(\"Hello. What’s your\
    \ name?\")\nname=input()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_0.png)\n\
    \n## 步骤 6\n\n上一步的代码通常被认为比在 input 命令中放置大量文本更简洁一些，但这并不是一条刻板的规则，因此在这些情况下你可以随心所欲。扩展这段代码，试试这个：\n\
    \n```\nprint(\"Halt! Who goes there?\")\nname=input()\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_1.png)\n\
    \n## 步骤 7\n\n这或许是文字冒险游戏的一个好开端？现在你可以对其进行扩展，利用用户的原始输入来充实游戏内容：\n\n```\nif name==\"\
    David\":\n    print(\"Welcome, good sir. You may pass.\")\nelse:\n    print(\"\
    I know you not. Prepare for battle!\")\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_2.png)\n\
    \n## 步骤 8\n\n你在这里创建的是一个条件，我们很快会讲到。简而言之，我们使用用户的输入并将其与条件进行比对。因此，如果用户输入的名字是 David，守卫会让他们畅通无阻地通过。否则，如果他们输入的不是\
    \ David，守卫就会向他们发起战斗挑战。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_3.png)\n\
    \n## 步骤 9\n\n正如你之前所学，来自用户的任何输入都自动是字符串，因此你需要应用类型转换来将其转换为其他类型。这为 input 命令增加了一些有趣的用法。例如：\n\
    \n```\n# Code to calculate rate and distance\nprint(\"Input a rate and a distance\"\
    )\nrate = float(input(\"Rate: \"))\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_4.png)\n\
    \n## 步骤 10\n\n为了完成速率和距离的代码，我们可以添加：\n\n```\ndistance = float(input(\"Distance:\
    \ \"))\nprint(\"Time:\", (distance / rate))\n```\n\n保存并执行代码，然后输入一些数字。通过使用 float(input\
    \ 元素，我们告诉 Python 输入的任何内容都是浮点数，而不是字符串。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_36_5.png)\n\
    \n## 创建函数\n\n现在你已经掌握了变量和用户输入的用法，下一步就是处理函数。你已经使用过一些函数，比如 print 命令，但 Python 还允许你定义自己的函数。\n\
    \n### 有趣的函数\n\n函数是你输入到 Python 中用来执行某项操作的命令。它是一小段自包含代码，接收数据、处理数据，然后返回结果。\n\n##\
    \ 步骤 1\n\n函数处理的不只是数据。它们能在 Python 中做各种有用的事情，比如对数据排序、将条目从一种格式转换为另一种格式，以及检查条目的长度或类型。基本上，函数是一个后面跟着括号的短单词。例如，len()、list()\
    \ 或 type()。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_0.png)\n\n## 步骤 3\n\
    \n你可以用类似的方式将变量传递给函数。假设你想知道一个人姓氏中的字母数量，你可以使用以下代码（在文本编辑器中输入这个示例）：\n\n```\nname=input\
    \ (\"Enter your surname: \")\ncount=len(name)\nprint (\"Your surname has\", count,\
    \ \"letters in it.\")\n```\n\n按 F5 并保存代码以执行它。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_1.png)\n\
    \n## 步骤 2\n\n函数接收数据（通常是变量），根据函数编程要执行的操作来处理数据，并返回最终值。被处理的数据放在括号内，所以如果你想了解 antidisestablishmentarianism\
    \ 这个词中有多少个字母，你可以输入：len(\"antidisestablishmentarianism\")，然后会返回数字 28。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_2.png)\n\
    \n## 步骤 4\n\nPython 内置了数十个函数，数量太多，无法在有限的篇幅内一一介绍。不过，要查看 Python 3 可用的内置函数列表，请访问\
    \ www.docs.python.org/3/library/functions.html。这些是预定义函数，但由于用户还创建了更多函数，它们并不是唯一可用的函数。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_37_3.png)\n\n"
