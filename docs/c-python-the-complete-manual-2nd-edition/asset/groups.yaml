    # # Compile and Execute


    You''ve created your first C++ program and you now understand the basics behind
    the structure of one. Let’s actually get things moving and compile and execute,
    or run if you prefer, the program and see how it looks.


    # ## GREETINGS FROM C++


    Compiling and executing C++ code from Code::Blocks is extraordinarily easy; just
    a matter of clicking an icon and seeing the result. Here’s how it’s done.


    **STEP 1** Open Code::Blocks, if you haven’t already, and load up the previously
    saved Hello World code you created. Ensure that there are no visible errors, such
    as missing semicolons at the end of the std::cout line.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_101_0.png)


    **STEP 2** If your code is looking similar to the one in our screenshot, then
    look to the menu bar along the top of the screen. Under the Fortran entry in the
    topmost menu you can see a group of icons: a yellow cog, green play button and
    a cog/play button together. These are Build, Run, Build and Run functions.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_101_1.png)


    **STEP 3** Start by clicking on the Build icon, the yellow cog. At this point,
    your code has now been run through the Code::Blocks compiler and checked for any
    errors. You can see the results of the Build by looking to the bottom window pane.
    Any messages regarding the quality of the code are displayed here.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_101_2.png)


    **STEP 4** Now click on the Run icon, the green play button. A command line box
    appears on your screen displaying the words: Hello, world!, followed by the time
    it’s taken to execute the code, and asking you press a key to continue. Well done,
    you just compiled and executed your first C++ program.


    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_101_3.png)'
