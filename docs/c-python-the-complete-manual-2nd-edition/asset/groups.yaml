    \ C++ 程序中使用的文件。点击列表中的 main.cpp 文件。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_3.png)\n\
    \n- **STEP 9:** 你可以看到 Xcode 已自动为你完成了基本的 Hello World 程序。虽然目前可能意义不大，但随着你进步会发现更多，内容只是\
    \ Xcode 利用 Mac 上可用的资源。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_4.png)\n\
    \n- **STEP 10:** 当你想运行代码时，点击 Product > Run。你可能会被要求在 Mac 上启用开发者模式；这是为了授权 Xcode\
