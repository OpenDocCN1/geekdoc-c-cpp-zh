    \ main()\n{\n    int a, b, c, d;\n    a=10;\n    b=20;\n    c=30;\n    d=40;\n\
    \n    cout << a, b, c, d;\n}\n```\n\n### SEMICOLONS\n\nRemember that each line\
    \ of a C++ program must end with a semicolon. If it doesn’t then the compiler\
    \ treats the line with the missing semicolon as the same line with the next semicolon\
    \ on. This creates all manner of problems when trying to compile, so don’t forget\
    \ those semicolons.\n\n```\n#include <iostream>\n\nint main()\n{\n    int a, b,\
    \ c, d;\n    a=10;\n    b=20;\n    c=30;\n    d=40;\n\n    std::cout << a, b,\
    \ c, d;\n}\n```\n\n### GCC OR G++\n\nIf you’re compiling in Linux then you will\
    \ no doubt come across gcc and g++. In short, gcc is the Gnu Compiler Collection\
    \ (or Gnu C Compiler as it used to be called) and g++ is the Gnu ++ (the C++ version)\
    \ of the compiler. If you’re compiling C++ then you need to use g++, as the incorrect\
    \ compiler drivers will be used.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_141_1.png)\n\
    \n## Where Next?\n\nCoding, like most subjects, is a continual learning experience.\
    \ You may not class yourself as a beginner any more but you still need to test\
    \ your code, learn new tricks and hacks to make it more efficient and even branch\
    \ out and learn another programming language.\n\nWhat can you do to further your\
    \ skills, learn new coding practises, experiment and present your code and even\
    \ begin to help others using what you’ve experienced so far?\n\nTwitter isn't\
    \ all trolls and antagonists, among the well-publicised vitriol are some genuine\
    \ people who are more than willing to spread their coding knowledge. We recommend\
    \ you find a few who you can relate to and follow them. Often they post great\
    \ tips, hacks and fixes for common coding problems.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_0.png)\n\
    \nLook open source projects that you like the sound of and offer to contribute\
    \ to the code to keep it alive and up to date. There are millions of projects\
    \ to choose from, so contact a few and see where they need help. It may only be\
    \ a minor code update but it’s a noble occupation for coders to get into.\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_1.png)\n\nIf you’ve mastered Python\
    \ fairly well, then turn your attention to C++ or even C#. Still keep your Python\
    \ skills going but learning a new coding language keeps the old brain ticking\
    \ over nicely and give you a view into another community, and how they do things\
    \ differently.\n\n```\n#pragma once\n\ndefine EXPAND_ME _FILE_ \" : \" _LINE_\n\
    \nconstexpr auto pi = 314.159;\nthread_local decltype(pi) rage = @10;\n\n[[deprecated(\"\
    abc\")]] char16_t *f() noexcept { return nullptr; }\n\ntemplate <typename T> struct\
    \ Foo {\n\tstatic_assert(std::is_floating_point<T>::value, \"Foo<T>: T must be\
    \ floating point\");\n};\n\nstruct A final : Foo {\n\tA() = default;\n\t[[noreturn]]\
    \ virtual void foo() override;\n};\n\ntemplate <typename T> concept bool EqualityComparable\
    \ = requires(T a, T b) { a == b; } -> bool;\n```\n\nBecome more active on coding\
    \ and development knowledge sites, such as StackExchange. If you have the skills\
    \ to start and help others out, not only will you feel really good for doing so\
    \ but you can also learn a lot yourself by interacting with other members.\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_2.png)\n\n## GOING MOBILE\n\nThe\
    \ mobile market is a great place to test your coding skills and present any games\
    \ or apps you've created. If your app is good, then who knows, it could be the\
    \ next great thing to appear on the app stores. It's a good learning experience\
    \ nevertheless, and something worth considering.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_0.png)\n\
    \n## PORTFOLIOS\n\nIf you've learned how to code with an eye for a developer job\
    \ in the future, then it's worth starting to build up an online portfolio of code.\
    \ Look at job postings and see what skills they require, then learn and code something\
    \ with those skills and add it to the portfolio. When it comes to applying, include\
    \ a link to the portfolio.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_1.png)\n\
    \n## ONLINE LEARNING\n\nOnline courses are good examples of where to take your\
    \ coding skills next, even if you start from the beginner level again. Often,\
    \ an online course follows a strict coding convention, so if you're self-taught\
    \ then it might be worth seeing how other developers lay out their code, and what's\
    \ considered acceptable.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_2.png)\n\
    \n## TEACH CODE\n\nCan you teach? If your coding skills are spot on, consider\
    \ approaching a college or university to see if they have need for a programming\
    \ language teacher, perhaps a part-time or evening course. If not teaching, then\
    \ consider creating your own YouTube how to code channel.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_3.png)\n\
    \n## SHARE CODE\n\nGet sharing, even if you think your code isn't very good. The\
    \ criticism, advice and comments you receive back help you iron out any issues\
    \ with your code, and you add them all to your checklist. Alternatively your code\
    \ might be utterly amazing but you won't know unless you share it.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_4.png)\n\
    \n## HARDWARE PROJECTS\n\nContributing to hardware projects is a great resource\
    \ for proving your code with others and learning from other contributors. Many\
    \ of the developer boards have postings for coders to apply to for hardware projects,\
    \ using unique code to get the most from the hardware that's being designed.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_5.png)\n"
  mdcn: "\n## Python 初学者常犯的错误\n\n### 计数循环\n\n请记住，在 Python 中，循环不会计入你在 range 中指定的最后一个数字。因此，如果你希望循环从\
    \ 1 数到 10，则需要使用：\n\n```\nn = list(range(1, 11))\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_140_0.png)\n\
    \n### 冒号\n\n初学者经常忘记在结构性语句的末尾添加冒号，例如：\n\n```\nclass Hangman:\n    def __init__(self,\
    \ word):\n        self.word = word\n        self.missed_letters = []\n       \
    \ self.guessed_letters = []\n\ndef guess(self, letter):\n    if letter not in\
    \ self.word and letter not in self.guessed_letters:\n        self.guessed_letters.append(letter)\n\
    \    elif letter not in self.word and letter not in self.missed_letters:\n   \
    \     self.missed_letters.append(letter)\n    else:\n        return False\n  \
    \  return True\n\ndef hangman_over(self):\n    return self.hangman_won() or (len(self.missed_letters)\
    \ == 6)\n\ndef hangman_won(self):\n    if '-' not in self.hide_word():\n     \
    \   return True\n    return False\n\ndef hide_word(self):\n    rtn = ''\n    for\
    \ letter in self.word:\n        if letter not in self.guessed_letters:\n     \
    \       rtn += ' '\n        else:\n            rtn += letter\n    return rtn\n\
    ```\n\n### 大小写敏感\n\nPython 是一种大小写敏感的编程语言，因此你需要检查所赋值的任何变量。例如，Lives=10 与 lives=10\
    \ 是不同的变量，在代码中调用错误的变量可能会产生意想不到的结果。\n\n```\nLives=10\nlives=9\nprint(Lives, lives)\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_140_1.png)\n\n### 括号\n\n每个人都会忘记在语句末尾加上那个本应添加的额外括号。Python\
    \ 依赖于程序中的闭合括号数量与开放括号数量相等，因此代码中的任何错误都可能是因为你忘了数括号，包括方括号。\n\n```\ndef print_game_status(self):\n\
    \    print (board[len(self.missed_letters)])\n    print ('Word: ' + self.hide_word())\n\
    \    print ('Letters Missed: ')\n    for letter in self.missed_letters:\n    \
    \    print (letter,)\n    print ()\n    print ('Letters Guessed: ')\n    for letter\
    \ in self.guessed_letters:\n        print (letter,)\n    print ()\n```\n\n###\
    \ 运算符\n\n使用错误的运算符也是一个常见的错误。例如，当你对两个值进行比较时，需要使用相等运算符（双等号 ==）。使用单等号（=）是赋值运算符，用于将值赋给变量（例如\
    \ lives=10）。\n\n```\nb = 5\nc = 10\nd = 10\nb == c #false because 5 is not equal\
    \ to 10\nc == d #true because 10 is equal to 10\n```\n\n### 操作系统\n\n为多个平台编写代码很困难，尤其是当你开始使用操作系统的外部命令时。例如，如果你的代码需要清除屏幕，那么在\
    \ Windows 上应使用 cls，而在 Linux 上则需要使用 clear。你需要通过捕获错误并发出替代命令来解决这个问题。\n\n```\n# Code\
    \ to detect error for using a different OS\nrun=1\nwhile (run==1):\n    try:\n\
    \        os.system('clear')\n    except OSError:\n        os.system('cls')\nprint(\"\
    \\n>>>>>>>>>>>>>>Python 3 File Manager<<<<<<<<<<<<<\\n\")\n```\n\n## C++ 初学者常犯的错误\n\
    \nC++ 开发者会遇到许多陷阱，尤其是因为这是一种更复杂、往往对错误毫不留情的语言。初学者需要一步一步地学习 C++，在继续之前消化所学的内容。\n\n\
    ### VOID（C++ 错误）\n\n诚然，并非只有 C++ 初学者才会犯我们在此列出的这类错误，即使是经验丰富的程序员也难免时不时地出点小差错。以下是一些需要尽量避免的常见问题。\n\
    \n### 未声明的标识符\n\n一个常见的 C++ 错误（老实说也是大多数编程语言的常见错误）是试图输出一个不存在的变量。在屏幕上显示 x 的值是可以的，但如果你一开始就没有告诉编译器\
    \ x 的值是多少，那就不行了。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_141_0.png)\n\n###\
    \ STD 命名空间\n\n初学者在代码中引用标准库是很常见的，但如果你漏掉了语句中的 std:: 部分，代码在编译时就会出错。你可以通过添加以下内容来解决这个问题：\n\
    \n```\nusing namespace std;\n```\n\n将其放在 #include 部分之下，然后直接使用 cout、cin 等即可。\n\n\
    ```\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int a, b,\
    \ c, d;\n    a=10;\n    b=20;\n    c=30;\n    d=40;\n\n    cout << a, b, c, d;\n\
    }\n```\n\n### 分号\n\n请记住，C++ 程序的每一行都必须以分号结尾。如果没有分号，编译器会把缺少分号的那一行与下一个有分号的语句视为同一行。这会在编译时造成各种问题，所以千万别忘了那些分号。\n\
    \n```\n#include <iostream>\n\nint main()\n{\n    int a, b, c, d;\n    a=10;\n\
    \    b=20;\n    c=30;\n    d=40;\n\n    std::cout << a, b, c, d;\n}\n```\n\n###\
    \ GCC 还是 G++\n\n如果你在 Linux 中编译，那么你一定会遇到 gcc 和 g++。简而言之，gcc 是 Gnu 编译器集合（或以前所称的\
    \ Gnu C 编译器），而 g++ 是该编译器的 Gnu ++ 版本（C++ 版本）。如果你在编译 C++，则需要使用 g++，否则会使用错误的编译器驱动。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_141_1.png)\n\n## 下一步做什么？\n\n编程和大多数学科一样，是一个持续学习的过程。你可能不再把自己归类为初学者，但你仍然需要测试代码，学习新的技巧和妙招以提高效率，甚至拓展学习另一种编程语言。\n\
    \n你可以做些什么来进一步提升技能、学习新的编程实践、试验和展示你的代码，甚至开始利用你迄今积累的经验帮助他人呢？\n\nTwitter 上并非全是喷子和杠精，在那些广为人知的尖刻言论之中，也有一些真心实意的人非常愿意传播他们的编程知识。我们建议你找到一些与你志同道合的人并关注他们。他们经常会发布关于常见编程问题的实用技巧、妙招和修复方法。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_0.png)\n\n寻找你感兴趣的开源项目，并主动为代码做出贡献，使其保持活力和最新状态。有数以百万计的项目可供选择，所以可以联系几个项目，看看他们哪里需要帮助。可能只是一次小小的代码更新，但这是程序员值得投入的高尚事业。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_1.png)\n\n如果你已经相当熟练地掌握了 Python，那么可以把注意力转向\
    \ C++ 甚至 C#。继续保持你的 Python 技能，但学习一门新的编程语言可以让你的大脑保持活跃，并让你了解另一个社区，以及他们不同的做事方式。\n\n\
    ```\n#pragma once\n\ndefine EXPAND_ME _FILE_ \" : \" _LINE_\n\nconstexpr auto\
    \ pi = 314.159;\nthread_local decltype(pi) rage = @10;\n\n[[deprecated(\"abc\"\
    )]] char16_t *f() noexcept { return nullptr; }\n\ntemplate <typename T> struct\
    \ Foo {\n\tstatic_assert(std::is_floating_point<T>::value, \"Foo<T>: T must be\
    \ floating point\");\n};\n\nstruct A final : Foo {\n\tA() = default;\n\t[[noreturn]]\
    \ virtual void foo() override;\n};\n\ntemplate <typename T> concept bool EqualityComparable\
    \ = requires(T a, T b) { a == b; } -> bool;\n```\n\n在 StackExchange 等编程和开发知识网站上更加活跃。如果你有能力帮助别人解决问题，不仅会有很好的成就感，还能通过与其他成员互动学到很多东西。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_143_2.png)\n\n### 转向移动端\n\n移动市场是测试你的编程技能和展示你创建的游戏或应用的好地方。如果你的应用足够好，谁知道呢，它或许会成为应用商店里下一个大热门。无论如何，这都是一个很好的学习经历，值得考虑。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_0.png)\n\n### 作品集\n\n如果你学习编程是为了将来从事开发工作，那么值得开始建立一个在线的代码作品集。看看招聘信息，了解他们要求哪些技能，然后学习这些技能并用它们编写一些东西，将其添加到作品集中。在申请时，附上作品集的链接。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_1.png)\n\n### 在线学习\n\n在线课程是进一步提升编程技能的好途径，即使你再次从初学者水平开始。通常，在线课程遵循严格的编码规范，因此如果你是自学成才，那么不妨看看其他开发者如何组织他们的代码，以及什么样的代码风格是可以接受的。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_2.png)\n\n### 教授编程\n\n你能教书吗？如果你的编程技能非常扎实，可以考虑联系学院或大学，看看他们是否需要编程语言教师，也许是兼职或夜校课程。如果不教书，那么可以考虑创建自己的\
    \ YouTube 编程教学频道。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_3.png)\n\n###\
    \ 分享代码\n\n开始分享吧，即使你觉得自己的代码不怎么样。你收到的批评、建议和评论会帮助你解决代码中的任何问题，你可以把它们全部加入你的检查清单。或者，你的代码可能非常出色，但除非你分享，否则你不会知道。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_4.png)\n\n### 硬件项目\n\n为硬件项目做贡献是与他人一起验证你的代码并向其他贡献者学习的绝佳途径。许多开发板都有面向程序员的硬件项目申请帖，利用独特的代码从正在设计的硬件中获得最大收益。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_144_5.png)\n\n"
