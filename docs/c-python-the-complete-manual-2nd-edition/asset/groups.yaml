    \ the bottom of the screen you are informed of the error, in this case: Expected\
    \ ‘;’ before ‘}’ token, indicating the missing semicolon.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_102_4.png)\n\
    \n- **STEP 10** Replace the semicolon and under the cout line, enter a new line\
    \ to your code:\n\n  ```cpp\n  cout << \"And greetings from C++!\\n\";\n  ```\n\
    \n  The `\\n` simply adds a new line under the last line of outputted text. Build\
    \ and Run the code, to display your handiwork.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_102_5.png)\n\
    \n## Using Comments\n\nWhile comments may seem like a minor element to the many\
    \ lines of code that combine to make a game, application or even an entire operating\
    \ system, in actual fact they’re probably one of the most important factors.\n\
    \n### THE IMPORTANCE OF COMMENTING\n\nComments inside code are basically human\
    \ readable descriptions that detail what the code is doing at that particular\
    \ point. They don’t sound especially important but code without comments is one\
    \ of the many frustrating areas of programming, regardless of whether you’re a\
    \ professional or just starting out.\n\nIn short, all code should be commented\
    \ in such a manner as to effectively describe the purpose of a line, section,\
    \ or individual elements. You should get in to the habit of commenting as much\
    \ as possible, by imagining that someone who doesn’t know anything about programming\
    \ can pick up your code and understand what it’s going to do simply by reading\
    \ your comments.\n\nIn a professional environment, comments are vital to the success\
    \ of the code and ultimately, the company. In an organisation, many programmers\
    \ work in teams alongside engineers, other developers, hardware analysts and so\
    \ on. If you’re a part of the team that’s writing a bespoke piece of software\
    \ for the company, then your comments help save a lot of time should something\
    \ go wrong, and another team member has to pick up and follow the trail to pinpoint\
    \ the issue.\n\nPlace yourself in the shoes of someone whose job it is to find\
    \ out what’s wrong with a program. The program has in excess of 800,000 lines\
    \ of code, spread across several different modules. You can soon appreciate the\
    \ need for a little help from the original programmers in the form of a good comment.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_103_0.png)\n\nThe best comments are\
    \ always concise and link the code logically, detailing what happens when the\
    \ program hits this line or section. You don’t need to comment on every line.\
    \ Something along the lines of: if x==0 doesn’t require you to comment that if\
    \ x equals zero then do something; that’s going to be obvious to the reader. However,\
    \ if x equalling zero is something that drastically changes the program for the\
    \ user, such as, they’ve run out of lives, then it certainly needs to be commented\
    \ on.\n\nEven if the code is your own, you should write comments as if you were\
    \ going to publicly share it with others. This way you can return to that code\
    \ and always understand what it was you did or where it was you went wrong or\
    \ what worked brilliantly.\n\nComments are good practise and once you understand\
    \ how to add a comment where needed, you soon do it as if it’s second nature.\n\
    \n```asm\n        DEFB    26h,30h,32h,26h,30h,32h,0,32h,72h,73h,32h,72h,73h,32h\n\
    \        DEFB    60h,61h,32h,40h,4Dh,32h,4Ch,99h,32h,4Ch,3Dh,42h,4Ch,4Dh\n   \
    \     DEFB    32h,4Ch,99h,32h,5Bh,5Ch,32h,5Bh,5Ch,32h,3Dh,32h,3Dh,33h\n      \
    \  DEFB    34h,32h,33h,34h,32h,0C0h,32h,40h,41h,32h,66h,67h,64h\n        DEFB\
