    \ 00111011\n  ```\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_4.png)\n\n\
    - **STEP 10:** The compiler therefore takes what you’ve entered as C++ code and\
    \ translates that to Machine Language. To execute C++ code the IDE ‘builds’ the\
    \ code, checking for errors, then passes it through the compiler to check standardisation\
    \ and convert it to ones and zeros for the computer to act upon. It’s rather clever\
    \ stuff, when you stop to think about it.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_5.png)\n\
    \n## How to Set Up C++ on a Mac\n\nTo begin C++ coding on a Mac you first need\
    \ to install Apple’s Xcode. This is a free, full-featured IDE that’s designed\
    \ to create native Apple apps. However, you can also use it to create C++ code\
    \ relatively easily.\n\n### XCODE\n\nApple’s Xcode is primarily designed for users\
    \ to develop apps for macOS, iOS, tvOS and watchOS applications in Swift or Objective-C\
    \ but you can use it for C++ too.\n\n- **STEP 1:** Start by opening the App Store\
    \ on your Mac, Apple Menu > App Store. In the Search box enter ‘Xcode’ and press\
    \ Return. There are many suggestions filling the App Store window but it’s the\
    \ first option, Xcode, that you need to click on.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_89_0.png)\n\
    \n- **STEP 2:** Take a moment to browse through the app’s information, including\
    \ the compatibility, to ensure you have the correct version of macOS. Xcode requires\
    \ macOS 10.12.6 or later to install and work.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_89_2.png)\n\
    \n- **STEP 3:** When you’re ready, click on the Get button which then turns into\
    \ Install App. Enter your Apple ID and Xcode begins to download and install. It\
    \ may take some time depending on the speed of your Internet connection.\n\n \
    \ ![](img/2f9c26fcf758b5bc56897d9c75b6347f_89_1.png)\n\n- **STEP 4:** When the\
    \ installation is complete, click on the Open button to launch Xcode. Click Agree\
    \ to the licence terms and enter your password to allow Xcode to make changes\
    \ to the system. When that is done, Xcode begins to install additional components.\n\
    \n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_89_3.png)\n\n- **STEP 5:** With everything\
    \ now installed, including the additional components, Xcode launches, displaying\
    \ the version number along with three choices and any recent projects that you’ve\
    \ worked on; with a fresh install though, this is blank.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_0.png)\n\
    \n- **STEP 6:** Start by clicking on Create New Xcode Project; this opens a template\
    \ window to choose which platform you’re developing code for. Click the macOS\
    \ tab, then click the Command Line Tool option. Click Next to continue.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_1.png)\n\
    \n- **STEP 7:** Fill in the various fields but ensure that the Language option\
    \ at the bottom is set to C++; simply choose it from the drop-down list. When\
    \ you’ve filled in the fields and made sure that C++ is the chosen language, click\
    \ on the Next button to continue.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_2.png)\n\
    \n- **STEP 8:** The next step asks where to create a Git Repository for all your\
    \ future code. Choose a location on your Mac, or a network location, and click\
    \ the Create button. When you’ve done all that, you can start to code. The left-hand\
    \ pane details the files used in the C++ program you’re coding. Click on the main.cpp\
    \ file in the list.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_3.png)\n\n\
    - **STEP 9:** You can see that Xcode has automatically completed a basic Hello\
    \ World program for you. While it may not make much sense at present, you will\
    \ discover more as you progress, the content is just Xcode utilising what’s available\
    \ on the Mac.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_4.png)\n\n- **STEP\
    \ 10:** When you want to run the code, click on Product > Run. You may be asked\
    \ to enable Developer Mode on the Mac; this is to authorise Xcode to perform functions\
    \ without needing your password every session. When the program executes, the\
    \ output is displayed at the bottom of the Xcode window.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_90_5.png)\n\
    \n## How to Set Up C++ in Linux\n\n- **STEP 5:** When you’ve entered your code,\
    \ click File > Save As and choose a folder in which to save your program. Name\
    \ the file as helloworld.cpp (it can be any name as long as it has .cpp as the\
    \ extension). Click Save to continue.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_0.png)\n\
    \n- **STEP 6:** The first thing to notice is that Xed has automatically recognised\
    \ this as a C++ file, since the file extension is now set to .cpp. The colour\
    \ coding is present in the code and if you open up the file manager you can also\
    \ see that file’s icon has C++ stamped on it.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_2.png)\n\
    \n- **STEP 7:** With your code now saved, drop into the Terminal again. You need\
    \ to navigate to the location of the C++ file you’ve just saved. Our example is\
    \ in the Documents folder, so we can navigate to it by entering: cd Documents.\
    \ Remember, the Linux Terminal is case sensitive, so any capitals must be entered\
    \ correctly.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_4.png)\n\n- **STEP\
    \ 8:** Before you can execute the C++ file you need to compile it. In Linux it’s\
    \ common to use g++, an open source C++ compiler; as you’re now in the same folder\
    \ as the C++ file, enter: g++ helloworld.cpp in the Terminal and press Return.\n\
    \n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_1.png)\n\n- **STEP 9:** It takes\
    \ a short time while the code is compiled by g++ but providing there are no mistakes\
    \ or errors in the code you are returned to the command prompt. The compiling\
    \ of the code has created a new file. If you enter: ls into the Terminal you can\
    \ see that alongside your C++ file is a.out.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_3.png)\n\
    \n- **STEP 10:** The a.out file is the compiled C++ code. To run the code enter:\
    \ ./a.out and press Return. The words ‘Hello World!’ appear on the screen. However,\
    \ a.out isn’t very friendly. To name it something else post-compiling, you can\
    \ recompile with: g++ helloworld.cpp -o helloworld. This creates an output file\
    \ called helloworld which can be run with: ./helloworld.\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_92_5.png)\n"
  mdcn: "\n\n## 如何在 Windows 上设置 C++\n\nWindows 用户在 C++ 编程方面有丰富的选择。有许多 IDE 和编译器可供使用，包括微软的\
    \ Visual Studio。然而，我们认为，最佳的入门 C++ IDE 是 Code::Blocks。\n\n### CODE::BLOCKS\n\n\
    Code::Blocks 是一款功能丰富且可通过插件轻松扩展的免费 C++、C 和 Fortran IDE。它易于使用，附带编译器，并且拥有活跃的社区支持。\n\
    \n首先访问 Code::Blocks 下载站点，网址为 www.codeblocks.org/downloads。从那里，点击 'Download the\
