    \ 00100000\n  01010111 01101111 01110010 01101100 01100100\n  00100001 00100010\
    \ 00111011\n  ```\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_4.png)\n\n\
    - **STEP 10:** 因此，编译器会将你输入的 C++ 代码翻译成机器语言。要执行 C++ 代码，IDE 会 ‘构建’ 代码，检查错误，然后将其传递给编译器以检查标准化和将其转换为计算机可操作的\
    \ 0 和 1。仔细想想，这相当巧妙。\n\n  ![](img/2f9c26fcf758b5bc56897d9c75b6347f_88_5.png)\n\n\
    ## 如何在 Mac 上设置 C++\n\n要在 Mac 上开始 C++ 编程，首先需要安装苹果的 Xcode。这是一款免费的、功能齐全的 IDE，旨在创建原生的\
