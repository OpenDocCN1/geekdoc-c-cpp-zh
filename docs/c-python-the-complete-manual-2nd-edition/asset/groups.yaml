    \ or a double, depending on the accuracy needed. Run the code and see the results.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_111_1.png)\n\n# STEP 3\n\nMultiplication\
    \ and division can be applied as such:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main ()\n{\n    float numbers = 100;\n    numbers = numbers * 10;\
    \ // This multiplies 100 by 10\n    cout << numbers << \"\\n\";\n    numbers =\
    \ numbers / 10; // And this divides 1000 by 10\n    cout << numbers << \"\\n\"\
    ;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_111_2.png)\n\n# STEP 4\n\
    \nAgain, execute the simple code and see the results. While not particularly interesting,\
    \ it’s a start into C++ maths. We used a float here, so you can play around with\
    \ the code and multiply by decimal places, as well as divide, add and subtract.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_111_3.png)"
