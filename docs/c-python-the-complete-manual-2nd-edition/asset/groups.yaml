    \ 4:\n    print (word, \"is a four-letter word. Well done.\")\nelif word_length\
    \ == 3:\n    print (word, \"is a three-letter word. Try again.\")\nelse:\n   \
    \ print (word, \"is not a four-letter word.\")\n```\n\n### Loops\n\n循环看起来与条件非常相似，但在操作上却有所不同。循环会多次运行同一块代码，通常在条件的支持下。\n\
    \n### Step 1\n\n```python\nx = 1\nwhile x < 10:\n    print (x)\n    x = x + 1\n\
    ```\n\nif 和 while 的区别在于 while 到达缩进代码的末尾时，会返回并检查语句是否仍然为真。在我们的示例中 x 小于 10。每次循环它都会打印\
    \ x 的当前值，然后给该值加一。当 x 最终等于 10 时它会停止。\n\n### Step 2\n\n```python\nwords=[\"Cat\"\
    , \"Dog\", \"Unicorn\"]\nfor word in words:\n    print (word)\n```\n\nfor 循环也可以在使用\
    \ range 函数的倒计时示例中使用：\n\n```python\nfor x in range (1, 10):\n    print (x)\n```\n\
    \n这里不需要 x=x+1 部分，因为 range 函数会在第一个和最后一个数字之间创建一个列表。\n\n## Python Modules\n\n我们之前提到过模块（Math\
