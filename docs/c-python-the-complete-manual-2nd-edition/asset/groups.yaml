    \n- **STEP 9:** 本质上，计算机只理解并使用二进制，即 0 和 1，或机器语言。用二进制编程对人类来说并不有效。例如，在 C++ 中将单词 “Hello\
    \ World!” 输出到屏幕上，其二进制形式为：\n\n  ```\n  01100011 01101111 01110101 01110100 00100000\
