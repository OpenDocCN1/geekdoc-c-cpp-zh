    \nC++（或者说 C with Classes）诞生于 1979 年，当时正值家用计算的黄金时代开端，是丹麦计算机科学家比雅尼·斯特劳斯特鲁普（Bjarne\
    \ Stroustrup）在攻读博士论文期间的心血结晶。斯特劳斯特鲁普的初衷是进一步发展自 70 年代初起就广泛使用的原始 C 语言。\n\nC++ 在 80\
    \ 年代的开发者中广受欢迎，因为它是一个更容易上手的环境，更重要的是，它与原始 C 语言有 99% 的兼容性。这意味着它不仅能用于主流计算实验室，也能供那些无法使用大型机和大规模计算数据中心的人使用。\n\
    \nC++ 在数字世界中的影响极为巨大。许多程序、应用、游戏甚至操作系统都是用 C++ 编码的。例如，Adobe 的所有主要应用程序，如 Photoshop、InDesign\
    \ 等，都是用 C++ 开发的。你会发现，你上网所用的浏览器、Windows 10、Microsoft Office 以及 Google 搜索引擎的支柱，都是用\
    \ C++ 编写的。Apple 的 macOS 大部分也是用 C++ 编写的（根据功能不同还混入了其他语言），而 NASA、SpaceX 甚至 CERN 等机构都在各种应用、程序、控制系统以及数不清的其他计算任务中使用\
    \ C++。\n\nC++ 代码比 Python 代码快得多。\n\n```cpp\n#include<iostream>\nusing namespace\
    \ std;\nvoid main()\n{\n    char ch;\n    cout<<\"Enter a character to check it\
    \ is vowel or not\";\n    cin>>ch;\n    switch(ch)\n    {\n        case 'a': case\
    \ 'A':\n            cout<<ch<<\" is a Vowel\";\n            break;\n        case\
    \ 'e': case 'E':\n            cout<<ch<<\" is a Vowel\";\n            break;\n\
    \        case 'i': case 'I':\n            cout<<ch<<\" is a Vowel\";\n       \
    \     break;\n        case 'o': case 'O':\n            cout<<ch<<\" is a Vowel\"\
    ;\n            break;\n        case 'u': case 'U':\n            cout<<ch<<\" is\
    \ a Vowel\";\n            break;\n    }\n}\n```\n\n![]()\n\n*Microsoft 的 Visual\
    \ Studio 是一个绝佳的免费学习 C++ 的环境。*\n\nC++ 还极其高效，全面表现出色，同时也是对 C 核心语言的一种更易用的扩展。这种相对于\
    \ Python、BASIC 等其他语言的更高性能，使其成为现代计算的理想开发环境，也正因如此，前述公司才会如此广泛地使用它。\n\n虽然 Python 是一门值得学习的优秀编程语言，但\
    \ C++ 能为开发者打开一个广阔得多的编码世界。掌握 C++ 后，你可以为 Microsoft、Apple 等公司编写代码。一般来说，C++ 开发者的薪资高于某些其他语言的程序员；而且由于\
    \ C++ 的多功能性，C++ 程序员可以在不同工作和公司之间切换，而无需重新学习任何特定内容。不过，Python 是更容易入门的语言。如果你是编程新手，我们建议你从\
    \ Python 开始，花一些时间掌握编程结构，以及通过编程解决问题的各种方式方法。等你能够愉快地打开电脑、单手就能写出 Python 程序时，再转向 C++。当然，也没有任何东西阻止你直接跳进\
    \ C++；如果你觉得自己能行，那就放手去学吧。\n\n开始使用 C++ 和 Python 一样容易，你只需要一套合适的工具来用 C++ 与计算机交流，就可以开始你的旅程了。C++\
    \ IDE 是免费的，即使是功能极其强大的 Microsoft Visual Studio，也可以免费下载和使用。你可以从任何操作系统进入 C++ 世界，无论是\
    \ macOS、Linux、Windows 甚至移动平台。\n\n就像 Python 一样，回答“为什么用 C++？”这个问题，答案是：它快速、高效，而且你日常使用的大多数应用都是用\
    \ C++ 开发的。它是一门前沿且值得掌握的绝佳语言。\n\n![]()\n\n*事实上，你正在使用的操作系统就是用 C++ 编写的。*\n\n![]()\n\
    \n## 所需设备\n\n学习 C++ 并不需要投入大量金钱，也不需要你拥有一整间计算实验室。只要你的电脑还算现代，其他一切都可免费获得。\n\n### C++\
    \ 环境搭建\n\n大多数操作系统（如果不是全部的话）的代码中都有 C++，因此无论你当前使用的是什么操作系统，都可以学习 C++ 编程，这是理所当然的。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_85_0.png)\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_85_1.png)\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_85_2.png)\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_85_3.png)\n\
    \n### 电脑\n\n除非你想在纸上手写 C++ 代码（很多老一辈程序员确实这样做过），否则电脑是绝对必需的。PC 用户可以使用任何较新的 Linux 发行版或\
    \ Windows 操作系统，Mac 用户则可以使用最新的 macOS。\n\n### IDE\n\n与 Python 一样，你需要用 IDE 来输入和执行\
    \ C++ 代码。许多 IDE 带有扩展和插件，以帮助其更好地工作或提供额外的功能。通常，IDE 会根据所使用的核心操作系统提供增强功能，例如针对 Windows\
    \ 10 的增强。\n\n### 编译器\n\n编译器是一种将 C++ 语言转换成二进制、以便计算机理解的程序。有些 IDE 自带编译器，有些则没有。Code::Blocks\
    \ 是我们最喜欢的 IDE，它随包自带了 C++ 编译器。关于这一点，稍后会详细说明。\n\n### 文本编辑器\n\n有些程序员非常偏好使用文本编辑器来编写\
    \ C++ 代码，然后再通过编译器运行。基本上你可以使用任何文本编辑器来编写代码，只需以 .cpp 扩展名保存即可。不过，Notepad++ 是目前最好的代码文本编辑器之一。\n\
    \n### 互联网连接\n\n在一台不联网的电脑上学习编程虽然并非完全不可能，但难度极大。你需要安装相关软件、保持更新、安装额外的组件或扩展，并在编写代码时寻求帮助，这些都离不开互联网接入。\n\
    \n### 时间与耐心\n\n是的，和 Python 一样，你需要留出大量时间来学习如何用 C++ 编程。遗憾的是，除非你是天才，否则这不可能一夜之间实现，甚至一周也不行。优秀的\
    \ C++ 编码者都花了很多年打磨他们的技艺，所以请保持耐心，从小处着手，并持续学习。\n\n### 各操作系统的特定需求\n\nC++ 可以在任何操作系统中运行，但要把所有必要部分整合在一起，可能会让新手感到困惑。下面是一些针对\
    \ C++ 的操作系统细节。\n\n### Linux\n\nLinux 用户很幸运，因为他们的操作系统中已经内置了编译器和文本编辑器。你可以用任何文本编辑器输入\
    \ C++ 代码；当文件以 .cpp 扩展名保存后，使用 g++ 编译即可。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_86_0.png)\n\
    \n### Windows\n\n前面我们已经提到，Microsoft 的 Visual Studio 是一个不错的 IDE。不过，Code::Blocks\
    \ 是更好的 IDE 和编译器组合，它定期更新，每年发布两个新版本。否则，Windows 用户可以在 Notepad++ 中输入代码，然后用 Code::Blocks\
    \ 所使用的 MinGW 进行编译。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_86_1.png)\n\n###\
    \ 树莓派\n\n树莓派的操作系统是 Raspbian，它基于 Linux。因此，你可以使用文本编辑器编写代码，然后像在任何其他 Linux 发行版中一样，用\
    \ g++ 编译。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_86_2.png)\n\n### Mac\n\n\
    Mac 用户需要下载并安装 Xcode，才能原生编译自己的 C++ 代码。macOS 的其他选择包括 NetBeans、Eclipse 或 Code::Blocks。注意：由于缺乏\
    \ Mac 开发者，最新版 Code::Blocks 没有适用于 Mac 的版本。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_86_3.png)\n\
    \n"
