    \n```bash\npip install pygame\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_41_2.png)\n\
    \n### Step 4\n\nPIP 安装需要提升的权限，因为它会在不同位置安装组件。Windows 用户可以通过开始按钮搜索 CMD，右键单击结果然后点击以管理员身份运行。Linux\
