  - "[PAGE 132]\n\n# STEP 5\n\nWhen you change the value to anything above 30, then\
    \ build and run the code, you can see that the only line to be outputted to the\
    \ screen is the second cout statement, displaying the current value of num. This\
    \ is because the initial if statement is false, so it ignores the code within\
    \ the braces.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_132_0.png)\n\n# STEP\
    \ 6\n\nYou can include an if statement within a do... while loop. For example:\n\
    \n```\n{\n    float temp;\n    do\n    {\n        cout << \"\\nEnter the temperature\
    \ (or -10000 to exit): \" << endl;\n        cin >> temp;\n        if (temp <=\
    \ 0 )\n        {\n            cout << \"\\nBrrrr, it's really cold!\" << endl;\n\
