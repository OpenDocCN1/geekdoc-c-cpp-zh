    \ countdown code.\n\n```\n#include <iostream>\n#include <windows.h>\nusing namespace\
    \ std;\n\nint main ()\n{\n    int a = 10;\n\n    while (a != 0)\n    {\n     \
    \   cout << a << endl;\n        a = a - 1;\n        Sleep(1000);\n    }\n\n  \
    \  cout << \"\\nBlast Off!\" << endl;\n\n    return 0;\n}\n```\n\n## For Loop\n\
    \nIn some respects, a for loop works in a very similar way to that of a while\
    \ loop, although it’s structure is different. A for loop is split into three stages:\
    \ an initialiser, a condition and an incremental step. Once set up, the loop repeats\
    \ itself until the condition becomes false.\n\n### LOOPY LOOPS\n\nThe initialise\
    \ stage of a for loop is executed only once and this sets the point reference\
    \ for the loop. The condition is evaluated by the loop to see if it’s true or\
    \ false and then the increment is executed. The loop then repeats the second and\
    \ third stage.\n\n### STEP 1 Create a new C++ file, with the standard headers:\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{ \n}\n```\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_127_0.png)\n\n### STEP 2 Start simple\
    \ and create a for loop that counts from 1 to 30, displaying the value to the\
    \ screen with each increment:\n\n```\n{ \n    //For Loop Begins\n    for( int\
    \ num = 1; num < 30; num = num +1 )\n    {\n        cout << \"Number: \" << num\
    \ << endl;\n    }\n    \n    return 0;\n}\n```\n\n### STEP 3 Working through the\
    \ process of the for loop, begin by creating an integer called num and assigning\
    \ it a value of 1. Next, set the condition, in this case num being less than 30.\
    \ The last stage is where you create the increments; here it’s the value of num\
    \ being added by 1.\n\n```\n{ \n    //For Loop Begins\n    for( int num = 1; num\
    \ < 30; num = num +1 )\n```\n\n### STEP 4 After the loop, you created a compound\
    \ statement in braces (curly brackets), that displays the current value of the\
    \ integer num. Every time the for loop repeats itself, the second and third stages\
    \ of the loop, it adds 1 until the condition <30 is false. The loop then ends\
    \ and the code continues, ending neatly with return 0.\n\n```\n{ \n    //For Loop\
    \ Begins\n    for( int num = 1; num < 30; num = num +1 )\n    {\n        cout\
    \ << \"Number: \" << num << endl;\n    }\n    \n    return 0;\n}\n```\n\n### STEP\
    \ 5 A for loop is quite a neat package in C++, all contained within its own brackets,\
    \ while the other elements outside of the loop are displayed below. If you want\
    \ to create a 10-second countdown, you could use:\n\n```\n#include <iostream>\n\
    #include <windows.h>\nusing namespace std;\n\nint main ()\n{\n    //For Loop Begins\n\
    \    for( int a = 10; a != 0; a = a -1 )\n    {\n        cout << a << endl;\n\
    \        Sleep(1000);\n    }\n    \n    cout << \"\\nBlast Off!\" << endl;\n \
    \   \n    return 0;\n}\n```\n\n### STEP 6\n\nWith the countdown code, don’t forget\
    \ to include the windows.h library, so you can use the Sleep command. Build and\
    \ run the code; in the command console you can see the numbers 10 to 1 countdown\
    \ in one second increments, until it reaches zero and Blast Off! appears.\n\n\
    ![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_0.png)\n\n### STEP 7\n\nNaturally\
    \ you can include a lot more content into a for loop, including some user input:\n\
    \n```\nint i, n, fact = 1;\ncout << \"Enter a whole number: \";\ncin >> n;\nfor\
    \ (i = 1; i <= n; ++i) {\n    fact *= i;\n}\ncout<< \"\\nFactorial of \"<< n <<\"\
    \ = \"<< fact << endl;\nreturn 0;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_1.png)\n\
    \n### STEP 8\n\nThe code from step 7, when built and run, asks for a number, then\
    \ displays the factorial of that number through the for loop. The user’s number\
    \ is stored in the integer n, followed by the integer i which is used to check\
    \ if the condition is true or false, adding 1 each time and comparing it to the\
    \ user’s number, n.\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_2.png)\n\n\
    ### STEP 9\n\nHere’s an example of a for loop displaying the multiplication tables\
    \ of a user inputted number. Handy for students:\n\n```\n{\n    int n;\n    cout\
    \ << \"Enter a number to view its times table: \";\n    cin >> n;\n    for (int\
    \ i = 1; i <= 12; ++i) {\n        cout << n << \" x \" << i << \" = \" << n *\
    \ i << endl;\n    }\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_3.png)\n\
    \n### STEP 10\n\nThe value of the integer i can be expanded from 12 to whatever\
    \ number you want, displaying a very large multiplication table in the process\
    \ (or a small one). Of course the data type within a for loop doesn’t have to\
    \ be an integer; as long as it’s valid, it works.\n\n```\nfor ( float i = 0.00;\
    \ i < 1.00; i += 0.01)\n{\n    cout << i << endl;\n}\nreturn 0;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_4.png)\n"
  mdcn: "\n\n## 循环与\n决策\n\n循环和重复是任何编程语言最重要的因素之一。合理使用循环可以创建一个程序，它完全按照你的期望执行，并在没有问题或错误的情况下提供所需的结果。\n\
    \n如果代码中没有循环和决策事件，你的程序将永远无法为用户提供任何选择。正是对选择的这种理解提升了你作为程序员的技能，并使代码变得更好。\n\n- 126\
    \ While 循环\n- 128 For 循环\n- 130 Do... While 循环\n- 132 If 语句\n- 134 If... Else\
    \ 语句\n\n## While 循环\n\nwhile 循环的功能是在某个条件保持为真时重复一条语句或一组语句。当 while 循环开始时，它通过测试循环的条件和其中的语句来初始化自身，然后执行循环的其余部分。\n\
    \n### TRUE OR FALSE？\n\nwhile 循环是 C++ 代码中最受欢迎的循环形式之一。它在条件为真时反复运行循环内的代码。一旦条件证明为假，代码就会照常继续。\n\
    \n### STEP 1\n\n清除你迄今为止所做的工作并创建一个新的 C++ 文件。目前不需要任何额外的头文件，所以按通常的方式添加标准头文件：\n\n\
    ```\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_125_0.png)\n\
    \n### STEP 2\n\n创建一个简单的 while 循环。输入下面的代码，构建并运行（我们在屏幕截图中添加了注释）：\n\n```\n{\n   \
    \ int num = 1;\n    while (num < 30 )\n    {\n        cout << \"Number: \" <<\
    \ num << endl;\n        num = num +1;\n    }\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_125_1.png)\n\
    \n### STEP 3\n\n首先你需要创建一个条件，所以使用一个名为 num 的变量并赋值为 1。现在创建 while 循环，说明只要 num 小于 30，循环就为真。在循环内，num\
    \ 的值会被显示并加 1，直到它大于 30。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_125_2.png)\n\
    \n### STEP 4\n\n我们在这里引入了一些新元素。首先是 while 循环的开头和结尾大括号。这是因为我们的循环是一个复合语句，意味着一组语句；请注意，while\
    \ 语句后面没有分号。你现在也有了 return 0，这是一种干净且首选的结束代码的方式。\n\n```\nint num = 1; // Create the\
    \ condition\nwhile (num < 30) // The condition remains true while num is less\
    \ than 30\n{\n    cout << \"Number: \" << num << endl; // Displays the current\
    \ value of num\n    num = num +1; // Adds 1 to the value of num\n}\nreturn 0;\
    \ // Correctly closes the code and finishes the program\n```\n\n### STEP 5\n\n\
    如果你不需要看到 num 不断增加的值，你可以放弃复合 while 语句，而只是单独使用 num，直到它达到 30，然后再显示该值：\n\n```\n{\n\
    \    int num = 1;\n    while (num < 30 )\n        num++;\n    cout << \"Number:\
    \ \" << num << endl;\n    return 0;\n}\n```\n\n### STEP 6\n\n重要的是要记住不要在 while\
    \ 语句末尾添加分号。为什么呢？正如你所知，分号代表 C++ 代码行的结束。如果你把它放在 while 语句的末尾，你的循环将永久卡住，直到你关闭程序。\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_126_0.png)\n\n### STEP 7\n\n在我们的示例中，如果我们执行代码，num\
    \ 的值将为 1，如 int 语句所设置。当代码遇到 while 语句时，它会读取只要 1 小于 30 的条件为真，就循环。分号关闭该行，因此循环重复；但它永远不会给\
    \ num 加 1，因为它不会继续通过复合语句。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_126_1.png)\n\
    \n### STEP 8\n\n你可以操纵 while 语句以根据循环内的代码显示不同的结果。例如，要逐字读取诗歌《Cimmeria》，你需要输入：\n\n\
    ```\n#include <iostream>\n#include <fstream>\nusing namespace std;\n\nint main\
    \ ()\n{\n    string word;\n    ifstream newfile (\"C:\\\\users\\\\david\\\\Documents\\\
    \\Cimmeria.txt\");\n\n    cout << \"Cimmeria, by Robert E Howard: \\n\" << endl;\n\
    \n    while (newfile >> word)\n    {\n        cout << word << endl;\n    }\n\n\
    \    return 0;\n}\n```\n\n### STEP 9\n\n你可以进一步扩展代码，使诗歌的每个单词每秒出现一次。为此，你需要引入一个新的库，<windows.h>。这是一个仅限\
    \ Windows 的库，在其中你可以使用 Sleep() 函数：\n\n```\n#include <iostream>\n#include <fstream>\n\
    #include <windows.h>\nusing namespace std;\n\nint main ()\n{\n    string word;\n\
    \    ifstream newfile (\"C:\\\\users\\\\david\\\\Documents\\\\Cimmeria.txt\");\n\
    \n    cout << \"Cimmeria, by Robert E Howard: \\n\" << endl;\n\n    while (newfile\
    \ >> word)\n    {\n        cout << word << endl;\n        Sleep(1000);\n    }\n\
    \n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_126_2.png)\n\
    \n### STEP 10\n\nSleep() 以毫秒为单位工作，因此 Sleep(1000) 为一秒，Sleep(10000) 为十秒，依此类推。结合\
    \ sleep 函数（以及它需要的头文件）和 while 循环，你可以制作一些有趣的倒计时代码。\n\n```\n#include <iostream>\n\
    #include <windows.h>\nusing namespace std;\n\nint main ()\n{\n    int a = 10;\n\
    \n    while (a != 0)\n    {\n        cout << a << endl;\n        a = a - 1;\n\
    \        Sleep(1000);\n    }\n\n    cout << \"\\nBlast Off!\" << endl;\n\n   \
    \ return 0;\n}\n```\n\n## For 循环\n\n在某些方面，for 循环的工作方式与 while 循环非常相似，尽管其结构不同。for\
    \ 循环分为三个阶段：初始化器、条件和增量步骤。设置好后，循环会重复自身，直到条件变为假。\n\n### LOOPY LOOPS\n\nfor 循环的初始化阶段只执行一次，这为循环设置了参考点。循环通过判断条件是否为真或假来评估条件，然后执行增量。循环然后重复第二和第三阶段。\n\
    \n### STEP 1 Create a new C++ file, with the standard headers:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{ \n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_127_0.png)\n\
    \n### STEP 2 Start simple and create a for loop that counts from 1 to 30, displaying\
    \ the value to the screen with each increment:\n\n```\n{ \n    //For Loop Begins\n\
    \    for( int num = 1; num < 30; num = num +1 )\n    {\n        cout << \"Number:\
    \ \" << num << endl;\n    }\n    \n    return 0;\n}\n```\n\n### STEP 3 Working\
    \ through the process of the for loop, begin by creating an integer called num\
    \ and assigning it a value of 1. Next, set the condition, in this case num being\
    \ less than 30. The last stage is where you create the increments; here it’s the\
    \ value of num being added by 1.\n\n```\n{ \n    //For Loop Begins\n    for( int\
    \ num = 1; num < 30; num = num +1 )\n```\n\n### STEP 4 After the loop, you created\
    \ a compound statement in braces (curly brackets), that displays the current value\
    \ of the integer num. Every time the for loop repeats itself, the second and third\
    \ stages of the loop, it adds 1 until the condition <30 is false. The loop then\
    \ ends and the code continues, ending neatly with return 0.\n\n```\n{ \n    //For\
    \ Loop Begins\n    for( int num = 1; num < 30; num = num +1 )\n    {\n       \
    \ cout << \"Number: \" << num << endl;\n    }\n    \n    return 0;\n}\n```\n\n\
    ### STEP 5 A for loop is quite a neat package in C++, all contained within its\
    \ own brackets, while the other elements outside of the loop are displayed below.\
    \ If you want to create a 10-second countdown, you could use:\n\n```\n#include\
    \ <iostream>\n#include <windows.h>\nusing namespace std;\n\nint main ()\n{\n \
    \   //For Loop Begins\n    for( int a = 10; a != 0; a = a -1 )\n    {\n      \
    \  cout << a << endl;\n        Sleep(1000);\n    }\n    \n    cout << \"\\nBlast\
    \ Off!\" << endl;\n    \n    return 0;\n}\n```\n\n### STEP 6\n\n使用倒计时代码时，不要忘记包含\
    \ windows.h 库，以便你可以使用 Sleep 命令。构建并运行代码；在命令控制台中，你可以看到数字从 10 到 1 以一秒为间隔倒计时，直到达到零并出现\
    \ Blast Off！\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_0.png)\n\n### STEP\
    \ 7\n\n自然地，你可以在 for 循环中包含更多内容，包括一些用户输入：\n\n```\nint i, n, fact = 1;\ncout << \"\
    Enter a whole number: \";\ncin >> n;\nfor (i = 1; i <= n; ++i) {\n    fact *=\
    \ i;\n}\ncout<< \"\\nFactorial of \"<< n <<\" = \"<< fact << endl;\nreturn 0;\n\
    ```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_1.png)\n\n### STEP 8\n\n步骤\
    \ 7 的代码在构建并运行时，会要求输入一个数字，然后通过 for 循环显示该数字的阶乘。用户的数字存储在整数 n 中，然后是整数 i，用于检查条件是否为真或假，每次加\
    \ 1 并与用户的数字 n 进行比较。\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_2.png)\n\n\
    ### STEP 9\n\n下面是一个 for 循环显示用户输入数字的乘法表的示例。对学生很有用：\n\n```\n{\n    int n;\n    cout\
    \ << \"Enter a number to view its times table: \";\n    cin >> n;\n    for (int\
    \ i = 1; i <= 12; ++i) {\n        cout << n << \" x \" << i << \" = \" << n *\
    \ i << endl;\n    }\n    return 0;\n}\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_3.png)\n\
    \n### STEP 10\n\n整数 i 的值可以从 12 扩展到你想要的任何数字，从而在过程中显示非常大的乘法表（或很小的表）。当然，for 循环中的数据类型不必是整数；只要有效，就可以使用。\n\
    \n```\nfor ( float i = 0.00; i < 1.00; i += 0.01)\n{\n    cout << i << endl;\n\
    }\nreturn 0;\n```\n\n![](img/2f9c26fcf758b5bc56897d9c75b6347f_128_4.png)\n\n"
