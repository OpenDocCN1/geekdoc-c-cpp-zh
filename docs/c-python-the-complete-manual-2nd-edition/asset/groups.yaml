    \n### STEP 4\n\nIf the Pygame window still won’t close don’t worry, it’s just\
    \ a discrepancy between the IDLE (which is written with Tkinter) and the Pygame\
    \ module. If you run your code via the command line, it closes perfectly well.\n\
    \n![](img/2f9c26fcf758b5bc56897d9c75b6347f_76_0.png)\n\n### STEP 5\n\nYou’re going\
