  \n\n\n\n在本章中，我们将描述一组可用于探索数据集多维特性的图表。我们介绍了基础图表（柱状图、折线图和散点图）、分布图（箱线图和直方图），以及扩展这些图表功能以可视化更多信息的各种增强方法。我们重点关注不同的可视化方案和操作如何支持数据挖掘任务，从有监督任务（预测、分类和时间序列预测）到无监督任务，并针对每种数据挖掘任务建议使用的特定可视化方法提供了一些指南。我们还描述了交互式可视化优于静态图表的优势。本章最后介绍了适用于具有特殊结构数据（分层、网络和地理）的特种图表。\n\
  \n## 3.1 数据可视化的用途\n\n“一画胜于千言”这句俗语是指将分散的口头信息浓缩为紧凑且易于理解的图形图像的能力。对于数字而言，数据可视化和数值汇总既为我们提供了探索数据的强有力工具，也提供了一种呈现结果的有效方法。\n\
  \n在目前为止描述的数据挖掘过程中，可视化技术处于什么位置？它们主要用于数据挖掘过程的预处理部分。可视化通过通过发现错误值（例如，年龄为 999 或−1 的患者）、缺失值、重复行、全值相同的列等，来支持数据清洗。可视化技术对于变量派生和选择也有用：它们可以帮助确定哪些变量应该纳入分析，哪些变量可能是冗余的。如果需要对数值变量进行分箱（binning），它们还可以帮助确定合适的箱宽（例如，如果需要做出是/否决策，数值结果变量可能需要转换为二分类变量）。它们还可以在数据归约过程中合并类别的一部分发挥作用。最后，如果数据尚未收集且收集成本高昂（如项目初期的潘多拉项目，参见第\
  \ 7 章），可视化方法可以帮助通过样本确定哪些变量和指标是有用的。\n\n在本章中，我们关注通过图形展示进行`data exploration`（数据探索）的使用，特别是与预测性分析的关系。尽管我们的重点不是用于数据报告目的的可视化，但本章提供了关于各种图形显示在数据呈现方面有效性的观点。这些提供了比表格摘要和基础柱状图之外的丰富有用呈现形式，后者目前是商业环境中最流行的数据呈现形式。有关如何使用图表报告业务数据的优秀讨论，请参阅\
  \ Few (2004)。在以图形形式报告数据挖掘结果方面，我们在书中其他地方描述了常见的图形显示，其中一些是特定技术的[例如，用于分层聚类的树状图（第 15\
  \ 章）、用于社交网络分析的网络图（第 19 章）以及用于分类和回归树的树图（第 9 章）]，而另一些更为通用[例如用于分类的受试者工作特征（ROC）曲线和提升图（第\
  \ 5 章），以及用于聚类的剖面图和热图（第 15 章）]。\n\n**注意：** “graph”在统计学中有两种含义。在通俗用法中，它可以指代表数据的任何图形（例如，折线图、柱状图、直方图等）。在更技术性的用法中，指的是网络中的数据结构和可视化（参见第\
  \ 19 章）。在本章探索的可视化方案中使用“plot”一词可以避免这种混淆。\n\n无论后续是否有更正式的分析，数据探索都是强制性的初始步骤。图形探索可以支持为了理解数据结构的自由形式探索、数据清洗（例如识别意外的间隙或“非法”值）、识别离群值、发现初始模式（例如变量之间的相关性和令人惊讶的聚类）以及产生有趣的问题。图形探索也可以更具针对性，面向特定的感兴趣的问题。在数据挖掘语境下，需要一种结合：以支持特定目标为目的进行的自由形式探索。\n\
  \n图形探索的范围从生成非常基础的图表到使用交互式过滤和缩放等操作来探索一组相互关联的可视化方案，这些方案包含了颜色和多面板等高级功能。本章并非旨在成为可视化技术的详尽指南，而是讨论在数据挖掘语境下支持数据探索的主要原理和特征。我们首先描述了可视化方面的不同复杂程度，并展示不同功能和操作的优势。我们的讨论是从可视化如何支持后续数据挖掘目标的角度出发。特别是，我们区分了有监督和无监督学习；在有监督学习中，我们进一步区分了分类（类别结果变量）和预测（数值结果变量）。\n\
  \n### 使用 Base R 还是 ggplot?\n\n由 Hadley Wickham 开发的`ggplot` 包已成为 R 语言中最流行的专用图形包，用于在各种场景下创建演示级的可视化。`ggplot`\
  \ 中的“gg”指的是“Grammar of Graphics”（图形语法法），这是由 Leland Wilkinson 提出的术语，用于定义一套绘图理论和命名系统。有效学习\
  \ `ggplot` 意味着熟悉这种绘图的哲学和技术语言。这带来了灵活性和力量，但也意味着存在不容忽视的学习曲线。如果你可能经常在通过高质量图形与他人交流时使用数据可视化，那么花时间精力掌握\
  \ `ggplot` 是值得的。如果你的可视化用途可能是探索性和非正式的（例如作为分析中不会正式记录的初始部分），你可能决定不投入精力学习 `ggplot`。\n\
  \n在本章中（主要是介绍），对于我们呈现的几乎所有可视化方案，都显示了基础 R 语法。在大多数示例中，每个图后的 R 代码中也显示了 `ggplot` 语法。\n\
