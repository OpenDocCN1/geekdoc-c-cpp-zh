  \ 3 年内的每月销售额数据。来源：Hyndman, R.J., Time Series Data Library, [`data.is/TSDLdemo`](http://data.is/TSDLdemo)。访问于\
  \ 2015/07/25)。\n\n1. 为这些数据创建一个格式良好的时间序列图。\n2. 这四个组成部分（水平、趋势、季节性、噪声）中，哪些似乎存在于该序列中？\n\
