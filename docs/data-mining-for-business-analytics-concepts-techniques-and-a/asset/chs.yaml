  \n## 10.2 逻辑回归模型\n\n逻辑回归背后的思想非常直接：与其直接使用 `Y` 作为结果变量，不如使用它的函数，称为 `logit`。事实证明，`logit`\
  \ 可以建模为预测变量的线性函数。为了理解 `logit`，我们需要几个中间步骤：首先，我们看 `p = P(Y = 1)`，即属于类别 1 的概率。与只取 0\
