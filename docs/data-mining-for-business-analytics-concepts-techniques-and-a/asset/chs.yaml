  \    506          0\n\n```\n\n`melt()` 和 `cast()` 函数是 `reshape` 包中非常有用的函数，它们允许创建透视表（pivot\
  \ tables）。`melt()` 将一组列堆叠成单列。`cast()` 则根据我们选择的聚合变量将单列重新重塑为多列。例如，表 4.7 计算了按 CHAS\
  \ 和 RM 分类的 MEDV 平均值并以透视表的形式展示。\n\n\n\n\n\n```r\n# 第一次使用该包时请使用 install.packages(\"\
  reshape\")\nlibrary(reshape) \nboston.housing.df <- read.csv(\"BostonHousing.csv\"\
  )\n### 创建大小为 1 的箱\nboston.housing.df$RM.bin <- .bincode(boston.housing.df$RM, c(1:9))\
  \ \n\n# 使用 melt() 将一组列堆叠成单列数据。\n# 对每种（分箱后的）RM 和 CHAS 组合的 MEDV 值进行堆叠\nmlt <- melt(boston.housing.df,\
  \ id=c(\"RM.bin\", \"CHAS\"), measure=c(\"MEDV\"))\nhead(mlt, 5)\n\n### 使用 cast()\
  \ 转换数据形状并生成透视表\ncast(mlt, RM.bin ~ CHAS, subset=variable==\"MEDV\", \n     margins=c(\"\
  grand_row\", \"grand_col\"), mean)\nOutput\n> mlt <- melt(boston.housing.df, id=c(\"\
  RM.bin\", \"CHAS\"), measure=c(\"MEDV\"))\n> head(mlt, 5)\n\n  RM.bin CHAS variable\
