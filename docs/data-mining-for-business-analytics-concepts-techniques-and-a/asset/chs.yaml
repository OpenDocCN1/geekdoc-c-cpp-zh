  \ 线性回归中的变量选择\n\n### 减少预测变量的数量\n\n数据挖掘中的一个常见问题是，当我们有很多变量可供模型作为预测变量时，使用回归方程来预测因变量的值。鉴于现代多重线性回归计算速度非常快，在这种情况下，人们很容易采取“厨房大杂烩”的方法（kitchen-sink\
  \ approach）：为什么要费力选择子集呢？直接使用模型中的所有变量就好了。\n\n另一个支持包含大量变量的考虑因素是希望此前隐藏的关系能够显现出来。例如，一家公司发现，购买了椅子和桌腿防刮保护垫的客户信贷风险较低。然而，在将所有可能的变量都投入模型之前，有几个原因需要谨慎考虑：\n\
  \n*   对于未来的预测，收集全套预测变量可能是昂贵的或不可行的。\n*   我们可能能够更准确地测量较少的预测变量（例如，在调查中）。\n*   预测变量越多，数据中出现缺失值的概率越高。如果我们删除或插值带有缺失值的记录，多个预测变量将导致更高的记录删除或插值率。\n\
  *   `简洁性`（Parsimony）是优秀模型的一个重要特性。在参数较少的模型中，我们对预测变量的影响有更深入的理解。\n*   由于多变量模型中的`多重共线性`（multicollinearity），回归系数的估计可能是不稳定的。（多重共线性是指存在）\n\
  \n\n\n\n\n另一组用于平衡欠拟合和过拟合常用标准是`赤池信息准则`(`AIC`) 和施华特的`贝叶斯信息准则`(`BIC`)。`AIC` 和 `BIC`\
  \ 衡量模型的拟合优度，但也包含了一个关于模型参数数量的惩罚项。因此，它们可以用于比较针对同一数据集的不同模型。`AIC` 和 `BIC` 是基于信息理论的预测误差估计。它们的推导过程超出了本书的范围，但只需说明\
  \ `AIC` 和 `BIC` 值越小的模型被认为越好。\n\n第三种经常用于子集选择的标准是 `Mallow’s C[p]`（见下方公式^(1)）。该标准假设全模型（包含所有预测变量）是无偏的，尽管它可能包含某些如果删除就会减少预测变性的变量。基于这一假设，我们可以证明：如果子集模型无偏的，则平均\
  \ `C[p]` 值等于 `p + 1`（即预测变量数量 + 1），即子集的大小。因此，识别低偏差子集模型的一种合理方法是检查 `C[p]` 值接近 `p +\
  \ 1` 的模型。良好的模型是那些 `C[p]` 值接近 `p + 1` 且 `p` 较小（即规模较小）的模型。`C[p]` 由公式计算\n\n(6.3)![编号显示方程](img/c06_M0004.gif)\n\
  \n其中 `![]OPS/images/c06_ILM0006.gif)` 是包含所有预测变量的全模型中 `σ²` 的估计值。需要注意的是，这种方法的有效性很大程度上取决于全模型\
  \ `σ²` 估计值的可靠性。这要求训练集的记录数相对于预测变量的数量很多。\n\n**注意：** 可以证明对于线性回归，在大样本中 Mallows’s `C[p]`\
  \ 等于 `AIC`。\n\n最后，需要注意的是的一点是，对于固定大小的子集，`R²`、`R²[adj]`、`C[p]`、`AIC` 和 `BIC` 选择的是同一个子集。事实上，它们在赋予固定大小子集的优劣排序上没有区别。如果在比较具有相同数量预测变量的模型，这很有用，但我们通常想比较具有不同数量预测变量的模型。\n\
  \n表 6.5 给出了对丰田酷锐价格数据（包含 11 个预测变量）进行穷举搜索的结果。它报告了单预测变量、双预测变量等的最佳模型。可以看到，`R²[adj]`\
  \ 一直增加到使用八个预测变量（系数数量 = 9），然后趋于稳定。`C[p]` 表明具有 7 到 8 个预测变量的模型是良好的。所有模型中的主导预测变量都是车龄，马力和里程也发挥了重要作用。\n\
  \n```\ncode for best subset\n```\n\n|\n\n```\n# use regsubsets() in package leaps\
