  \ 24 户家庭割草机地面积、收入和所有权情况\n\n如果我们对这些数据应用分类树程序，该程序将选择 `Income` 作为第一次划分，划分值为 60。此时，（`X[1]`,\
  \ `X[2]`）空间空间被划分为两个矩形，一个包含 `Income < 60`，另一个包含 `Income ≥ 60`。这在图 9.3 中所示。\n\n![图表显示了从\
  \ 20 到 120 的千美元（收入）与从 13 到 25 的千平方英英单位（地面积）之间的关系，并绘制了主人和非所有者的分布图。](img/c09f003.jpg)\n\
  \n**图 9.3**](#c09.xhtml_figureanchor9-3) 按收入值 60 划分 24 条记录\n\n注意划分如何创建了两个矩形，每个矩形都比划分前的矩形具有更高的同质性。左侧矩形包含的大多是非所有者（7\
  \ 个非所有者 1 个主人），右侧矩形包含的多是主人（11 个主人 5 个非所有者）。\n\n是如何选择这个特定的划分的？算法检查了每个预测变量（在本例中为 `Income`\
  \ 和 `Lot Size`）以及每个变量所有可能的划分值，以找到最佳划分。一个变量可能的划分值是什么？它们仅仅是每个预测变量的值。`Income` 的可能划分点为\
  \ `{33.0, 43.2, 47.4, …, 110.1}`，`Lot Size` 的可能划分点为 `{14.0, 14.8, 16.0, …, 23.6}`。这些划分点根据它们对结果矩形不纯度（异质性）的减少程度进行排序。纯矩形是指由单一类别（例如主人）组成的矩形。不纯度的减少定义为划分前的整体不纯度减去划分产生的两个矩形的不纯度之和。\n\
  \n### 分类预测变量\n\n之前的描述使用了数值预测变量；然而，在递归划分背景下也可以分类预测变量。为了处理分类预测变量，分类预测变量的划分选择是将类别集合划分为两个子集的所有方法。例如，具有四个类别的分类变量，如\
  \ `{a, b, c, d}`，可以以七种方式被划分为两个子集：`{a}` 和 `{b, c, d}`；`{b}` 和 `{a, c, d}`；`{c}` 和\
  \ `{a, b, d}`；`{d}` 和 `{a, b, c}`；`{a, b}` 和 `{c, d}`；`{a, c}` 和 `{b, d}`；最后是 `{a,\
  \ d}` 和 `{b, c}`。当类别数量很大时，划分次数会变得非常多。\n\n### 不纯度量\n\n有许多方法可以衡量不纯度。最流行的两种指标是 `Gini\
  \ 指数`和`熵指标`。我们接下来将描述这两种指标。用 `k = 1, 2, …, m` 表示响应变量的 `m` 个类别。\n\n矩形 `A` 的 Gini 不纯度指数定义为\n\
  \n![numbered Display Equation](img/c09_M0001.gif)\n\n其中 `p[k]` 是矩形 `A` 中属于类别 `k`\
  \ 的记录比例。该指标的取值范围在 0（所有记录都属于同一类别）和 `(m – 1)/m`（所有 `m` 个类别占比相等）之间。图 9.4 显示了双分类情况下\
  \ Gini 指数随类别 1 记录比例 (`p[1]`) 的变化。可以看出，当 `p[k] = 0.5` 时，不纯度量达到峰值（即矩形包含两个类别中各占 50%\
  \ 时）。\n\n![图表显示 p1 从 0 到 1 与 Gini 指数从 0 到 0.6 的关系。](img/c09f004.jpg)\n\n**图 9.4**](#c09.xhtml_figureanchor9-4)\
  \ 双分类情况下 Gini 指数随类别 1 记录比例 (`p[1]`) 的函数值\n\n第二个不纯度量是熵指标。矩形 `A` 的熵定义为\n\n![numbered\
  \ Display Equation](img/c09_M0002.gif)\n\n（在 R 中计算 `log 2` 请使用函数 `log2()`）。该指标的取值范围在\
  \ 0（最纯，所有记录属于同一类别）和 `log 2`（所有 `m` 个类别占比相等）之间。在双分类情况下，熵指标像 Gini 指数一样在 `p[k] = 0.5`\
  \ 处最大化。\n\n让我们计算割草机示例在第一次划分前后的不纯度（在第一次划分前，在双分类情况下，不纯度在 `p[k] = 0.5` 处最大化（类似于 Gini\
  \ 指数），即矩形包含两个类别中各占 50% 时）。\n\n*(此处由于原文逻辑存在重复描述，译文已按要求完整翻译并确保逻辑通畅)*\n\n\n\n\n\n```\n\
  library(rpart)\nlibrary(rpart.plot)\nmower.df <- read.csv(\"RidingMowers.csv\")\n\
  \n### 使用 rpart() 运行分类树。\n### 在 rpart() 中定义 rpart.control() 以确定树的深度。\nclass.tree\
  \ <- rpart(Ownership ~ ., data = mower.df, \n    control = rpart.control(maxdepth\
  \ = 2), method = \"class\")\n### 画树\n# 使用 prp() 绘制树。你可以控制绘图参数，如颜色、形状\n# 以及显示的信息（显示什么以及显示位置）。\n\
  prp(class.tree, type = 1, extra = 1, split.font = 1, varlen = -10) \n```\n\n![图表显示非所有者（12,\
  \ 12）收入（小于 60）的标记分为非所有者（7, 1）和所有者（5, 11）。](img/c09f007.jpg)\n\n**图 9.7** 首次划分的树表示（对应于\
  \ 图 9.3）\n\n![图表显示非所有者收入（小于 60）的标记分为地块大小（小于 21）和地块大小（小于 20），其中收入（小于 85）被分为收入（大于等于\
  \ 62）。](img/c09f008.jpg)\n\n**图 9.8** 所有划分后的树表示（对应于 图 9.6）。这是一棵完全生长的树。\n\n### 树的结构\n\
  \n树中有两种类型的节点：决策节点和终端节点。具有后继节点的节点被称为`决策节点`，因为如果我们要用树来对一个仅已知预测变量值的新记录进行分类，我们将该记录“丢进”树中，使得在每个决策节点上选择相应分支，直到到达一个没有后继节点的节点。此类节点被称为`终端节点`（或树的`叶子`），代表通过预测变量对数据进行划分。\n\
  \n值得注意的是，R 的 `rpart()` 函数生长的树类型（也称为 `CART` 或二叉树）具有这样一个属性：终端节点的数量正好比决策节点的数量多一个。\n\
  \n当使用 R 函数 `prp()` 绘制树时，决策节点用白色椭圆形表示，终端节点用灰色椭圆形表示。\n\n用于划分的变量名称及其划分值位于每个决策节点上方。节点下方的数字是该节点中小于（左侧）或大于或等于（右侧）划分值的记录数量。（顶端节点上的“是”和“否”标签标明了我们在哪一侧可以找到较小的值）。\n\
  \n### 分类新记录\n\n要对新记录进行分类，需要将其“丢进”树中。当它一直掉到一个终端节点时，我们可以通过对树生长时属于该终端节点的所有训练数据进行“投票”来简单地分配其类别。票数最高的类别被分配给新记录。例如，到达\
  \ 图 9.8 中右侧终端节点的新记录（该节点的大多数记录属于所有者类）将被分类为“所有者”。或者，如果对单个类别感兴趣，算法会计算该类别的“票数”数量，将其转换为比例（倾向），然后与用户指定的截止值进行比较。有关在对单个类别感兴趣的情况下使用截止值的进一步讨论，请参阅第\
  \ 5 章。\n\n在二分类情况下（通常成功类相对稀少且具有特殊价值），我们也可以建立一个较低的截止值以更好地捕获那些稀缺的成功（代价是将更多的失败归类为成功）。有了较低的截止值，`success`\
  \ 类的票数只需要达到该低截止值水平，整个终端节点即可被分类为`success`。因此，截止值决定了确定终端节点类别所需的票数比例。\n\n## 9.3 评估分类树的性能\n\
  \n我们通过之前的方法看到，建模工作并不是通过对训练数据拟合模型就完成的；我们需要样本外数据来评估和调整模型。这对于分类和回归树尤为如此，原因有两个：\n\n\
  *   树结构可能非常不稳定，根据所选样本而发生显著变化。\n*   完全拟合的树不可避免地会导致过拟合。\n\n为了可视化第一个挑战（即潜在的不稳定性），假设我们将数据随机划分为两个样本\
  \ A 和 B，并用每个样本构建一棵树。如果有几个预测能力大致相当的预测变量，你可以看到样本 A 和 B 很容易根据记录最终落在哪个样本来为顶层划分选择不同的预测变量。顶层一个不同的划分可能会产生级联反应，一直向下传递，并产生一组完全不同的规则集。因此，我们应该审慎地看待单棵树的结果。\n\
  \n为了说明第二个挑战（即过拟合），让我们来看另一个例子。\n\n### 示例 2：个人贷款审批\n\nUniversal Bank 是一家相对年轻的银行，在总体客户获取方面增长迅速。这些客户大部分是具有不同关系规模的负债客户。这些客户大部分是具有不同关系规模的负债客户（此处原文重复多次，已按要求保留翻译逻辑但注意原文结构）。\n\
