  \ |\n\n**表 21.8** 每个家庭的变量描述\n\n### 衡量品牌忠诚度\n\n本案例中的几个变量衡量了品牌忠诚度的不同方面。客户购买的不同品牌数量是忠诚度的一种衡量标准。然而，一个连续购买一或两个品牌，然后长期选定第三个品牌的消费者，与一个不断在三个品牌之间切换的消费者是不同的。因此，客户从一个品牌切换到另一个品牌的频率是另一个忠诚度衡量标准。然而对同一问题的第三种视角是购买于不同品牌的比例——一个将\
  \ 90% 购买资金花在一个品牌上的消费者，比将资金平均分配在几个品牌上的消费者更具忠诚度。\n\n这三个组成部分都可以通过购买摘要工作表中的数据进行衡量。\n\
  \n### 任务\n\n1. 使用 `k`-means 聚类根据以下标准识别家庭簇：\n    1. 描述购买行为的变量（包括品牌忠诚度）\n    2. 描述购买依据的变量\n\
  \    3. 同时描述购买行为和购买依据的变量\n\n    **注意 1：** 应该如何选择 `k`？考虑这些簇将如何被使用。营销工作可能会支持二到五不同的促销方案。\n\
  \n    **注意 2：** 应如何处理各种品牌占总购买额的百分比？购买所有品牌 A 的客户是否与购买所有品牌 B 的客户一样忠诚？直接使用品牌份额变量对任何距离度量量会产生什么影响？考虑使用单一派生变量。\n\
  \n2. 选择你认为最佳的细分方法，并对这些簇的特征（人口统计学、品牌忠诚度和购买依据）进行注释。（这些信息将用于指导广告和促销活动的开发。）\n\n3. 开发一个模型将数据归类到这些细分中。由于这些信息很可能用于定向直邮促销，因此选择一个在分类模型中被定义为\
  \ `success` 的市场细分将是很有用的。\n\n## 21.7 直邮募捐\n\n`Fundraising.csv` 和 `FutureFundraising.csv`\
  \ 是本案例研究使用的数据集。\n\n### 背景\n\n**注意：** 在开始处理此案例之前，务必阅读第 5 章中关于过采样和调整的信息。\n\n一家国家性的退军人组织希望开发一个预测模型，以提高其直邮营销活动的成本效益。该组织拥有超过\
  \ 1300 万捐赠者的内部数据库，是美国最大的直邮募捐机构之一。根据他们最近的邮寄记录，总体响应率为 5.1%。在做出响应（捐赠）的人中，平均捐赠金额为 $13.00。每封邮件（包含个性化地址标签以及各种卡片和信封）制作和发送成本为\
  \ $0.68。利用这些事实，我们对该数据集进行采样，开发一个能够有效捕获捐赠者的模型，使预期净利润最大化。采用加权采样，减少非响应者的占比，使样本中捐赠者和非捐赠者的数量相等。\n\
