  \n中心移动平均通过对给定时间点的过去和未来数据取平均值计算。从意义上说，它们不能预测，因为在预测时，未来通常是未知的。因此，为了预测目的，我们使用滞后移动平均，其中宽度为\
  \ `w` 的窗口设置为序列中最近的 `w` 个值。`k`步前预测 `F[`t` + `k`]`（`k` = 1, 2, 3, …）是这些 `w` 个值的平均值（参见图\
  \ 18.1 中的底部图表）：\n\n![编号显示方程](img/c18_M0002.gif)\n\n例如，在 Amtrak 客运序列中，为了预测 1992 年\
  \ 2 月或之后月份的客运量，在已知截至 1992 年 1 月的信息并使用窗口宽度 `w` = 12 的移动平均，我们将取最近 12 个月的平均客运量（1991\
  \ 年 2 月到 1992 年 1 月）。图 18.2 所示的输出。注意，对于训练期的前 12 条记录，没有预测（因为用于平均的过去值少于 12 个）。\n\n\
  \n\n\n```r\n# fit regression model with trend and seasonality\ntrain.lm.trend.season\
  \ <- tslm(train.ts ~ trend + I(trend²) + season)\n\n# create single-point forecast\n\
  train.lm.trend.season.pred <- forecast(train.lm.trend.season, h = 1, level = 0)\n\
  \n# apply MA to residuals\nma.trailing <- rollmean(train.lm.trend.season$residuals,\
  \ k = 12, align = \"right\")\nlast.ma <- tail(ma.trailing, 1)\n\nOutput\n> train.lm.trend.season.pred\n\
  \         Point Forecast     Lo 0     Hi 0\nApr 2001       2004.271 2004.271 2004.271\n\
  > last.ma\n[1] 30.78068\n```\n\n**Table 18.1** 将移动平均应用于回归模型（缺乏趋势和季节性）的残差中，以预测 2001\
  \ 年 4 月的残差\n\n### 选择窗口宽度 ![](img/c18_ILM0001.gif)\n\n在使用移动平均预测或可视化时，用户必须做的选择是窗口宽度\
  \ `w`。与 `k`-最近邻等其他方法一样，平滑参数的选择是在欠平滑和过度平滑之间进行平衡。对于可视化（使用中心窗口），较宽的窗口将暴露更多的全局趋势，而较窄的窗口将揭示局部趋势。因此，检查多个窗口宽度对于探索不同局部/全局性质的趋势是有用的。对于预测（使用滞后窗口），选择应该考虑有关过去值的相关性以及序列变化快慢的领域知识。也可以通过通过实验不同的\
  \ `w` 值并比较性能来完成经验性预测评估。然而，应注意不要过拟合！\n\n## 18.3 简单指数平滑\n\n业务领域中一种流行的预测方法是指数平滑。它的流行源于其灵活性、易于自动化、计算成本低廉以及良好的性能。简单指数平滑与移动平均预测相似，区别在于我们不是对最近的\
  \ `w` 个值取简单平均值，而是对`所有`过去值取`加权平均值`，使得权重随时间指数级衰减。其思想是给近期信息更大的权重，但又不完全忽略旧信息。\n\n与移动平均一样，简单指数平滑应仅用于预测`没有趋势或季节性的序列`。如前所述，此类序列可以通过从原始序列中去除趋势和/或季节性来获得，然后将指数平滑应用于残差序列（假设残差序列不包含趋势或季节性）。\n\
  \n指数平滑器在时间 `t` + 1 处生成的预测（F[`t` + 1]）如下：\n\n(18.2)![编号显示公式](img/c18_M0003.gif)\n\
  \n其中 `α` 是一个 0 到 1 之间的常数，称为`平滑参数`。上述公式将指数平滑器显示为所有过去观测值的加权平均，权重呈指数衰减。\n\n事实证明，我们可以用另一种方式编写指数预测器，这在实践中非常有用：\n\
  \n(18.3)![编号显示公式](img/c18_M0004.gif)\n\n其中 `E[t]` 是时间 `t` 处的预测误差。该公式将指数预测器呈现为一个“主动学习者”：它查看之前的预测（`F[t]`）以及它与实际值之间的差距（`E[t]`），然后根据这些信息修正下次预测。如果某周期的预测过高，则下一个周期将下调。修正量取决于平滑参数\
  \ `α` 的值。(18.3) 中的公式在数据存储和计算时间方面也有优势：这意味着我们只需要存储和使用最近一期的预测值和预测误差，而不是整个序列。在进行实时预测或并行连续地预测多个序列的应用中，这种节省是至关重要的。\n\
  \n注意，预测更远的未来产生与一步前预测相同的预测。因为假设序列缺乏趋势和季节性，对未来的预测仅依赖于预测时间之前的信息。因此，`k`-步前预测等于\n\n![编号显示公式](img/c18_M0005.gif)\n\
  \n### 选择平滑参数 ![](img/c18_ILM0002.gif)\n\n由用户设置的平滑参数 `α` 决定了学习率。接近 1 的值表示学习快（即，只有最近的值对预测有影响），而接近\
  \ 0 的值表示学习慢（过去的值对预测有很大影响）。可以通过将 0 或 1 代入方程 (18.2) 或 (18.3) 看到。因此，`α` 的选择取决于所需的平滑程度，以及历史对生成预测的相关性。证明良好的默认值在\
  \ 0.1–0.2 左右。一些试错也有助于选择 `α`：检查实际序列和预测序列的时间图，以及预测准确率（例如验证集的 MAPE 或 RMSE）。找到在验证集上优化预测准确率的\
  \ `α` 值可以用于确定趋势的局部性质与全局性质的程度。然而，注意不要为了预测目的而选择“最佳 α”。\n\n### 移动平均与简单指数平滑的关系\n\n在两种平滑方法中，用户必须指定一个参数：在移动平均中必须设置窗口宽度\
  \ `w`；在指数平滑中必须设置平滑参数 `α`。在两种情况下，参数都决定了新信息相对于旧信息的重要性。事实上，如果移动平均的窗口宽度等于 `w` = 2/α\
  \ − 1，则这两个平滑器将相等。\n\n## 18.4 高级指数平滑\n\n\n\n\n如前所述，移动平均法和简单指数平滑法仅适用于预测没有趋势或季节性的序列；即仅包含水平层（level）和噪声的序列。预测具有趋势和/或季节性序列的一种解决方案是首先移除这些组件（例如，通过回归模型）。另一种解决方案是使用更复杂的指数平滑版本，它可以捕捉趋势和/或季节性。\n\
  \n### 带有趋势的序列\n\n对于包含趋势的序列，我们可以使用“双重指数平滑”。与回归模型不同，趋势形状并不被假设是全局性的，而是可以随时间变化。在双重指数平滑中，局部趋势是从数据中估计的，并随着更多数据的到来而更新。与简单指数平滑类似，序列的水平也是从数据中估计的，并随着更多数据的到来而更新。`k`-步前预测通过结合时间\
  \ `t` 的水平估计（`L[t]`）和时间 `t` 的趋势估计（`T[t]`）给出：\n\n(18.4)![numbered Display Equation](img/c18_M0006.gif)\n\
  \n注意，在存在趋势的情况下，1 步、2 步、3 步（等）前预测不再是相同的。水平和趋势通过一对更新方程进行更新：\n\n(18.5)![numbered Display\
  \ Equation](img/c18_M0007.gif)(18.6)![numbered Display Equation](img/c18_M0008.gif)\n\
  \n第一个方程意味着时间 `t` 的水平是时间 `t` 实际值与上一个周期水平的加权平均，并根据趋势调整（在存在趋势的情况下，从一个周期移动到下一个周期需要考虑趋势）。第二个方程意味着时间\
  \ `t` 的趋势是上一个周期趋势与关于水平变化的最新信息的加权平均。^(3) 这里这里有两个平滑参数 `α` 和 `β`，它们决定了学习速率。与简单指数平滑一样，它们都是\
  \ `[0,1]` 范围内的常数，由用户设置，值越高，学习速度越快（给最新信息赋予更大的权重）。\n\n### 带有趋势和季节性的序列\n\n对于既包含趋势又包含季节性的序列，可以使用“Holt–Winter\
  \ 指数平滑”方法。这是双重指数平滑的进一步扩展，其中 `k`-步前预测还考虑了 `t + k` 期的季节性。假设具有 `M` 个季节的季节性（例如，对于每周季节性\
  \ `M = 7`），预测公式为：\n\n(18.7)![numbered Display Equation](img/c18_M0009.gif)\n\n（注意，在预测时刻\
  \ `t`，该序列必须包含至少一个完整的季节周期才能使用此公式产生预测，即 `t > M`。）\n\n作为一种自适应方法，Holt–Winter 指数平滑允许水平、趋势和季节性模式随时间变化。随着更多信息的到来，这三个组件会被估计和更新。这三个更新方程为：\n\
  \n(18.8)![numbered Display Equation](img/c18_M0010.gif)(18.9)![numbered Display\
  \ Equation](img/c18_M0011.gif)(18.10)![numbered Display Equation](img/c18_M0012.gif)\n\
  \n第一个方程类似于双重指数平滑中的方程，但使用的是时间 `t` 的季节性调整值而不是原始值。这是通过将 `Y[t]` 除以其在上周期中估计的季节指数来实现的。第二个方程与双重指数平滑相同。第三个方程意味着季节指数是通过通过对上一个周期的季节指数和当前趋势调整值进行加权平均来更新的。注意，这种公式描述的是乘法季节性关系，其中不同季节之间的值按百分比不同。还存在加法季节性的\
  \ Holt–Winter 指数平滑版本，其中季节之间的差异为恒定值（更多细节，请参见 Shmueli and Lichtendahl, 2016）。\n\n\
  为了说明如何使用 Holt–Winter 方法预测序列，考虑原始的 Amtrak 乘人数数据。正如我们之前观察到的，数据既包含趋势也包含月度季节性。图 18.5\
  \ 显示了拟合值和预测值。表 18.2 给出了模型的摘要。\n\n|  \n\n```\n 创建图 18.5 的代码\n``` |\n\n|  \n\n```\n\
