  \n## 21.3 Tayko 软件目录分类\n\n*Tayko.csv* 是本案例研究的数据集。\n\n### 背景\n\n\n\n\n\nTayko 是一家销售游戏和教育软件的软件目录公司。它最初作为软件制造商起，后来在产品组合中加入了第三方作品。最近，它在一个新的目录中汇编了一份修订后的物品清单，并正准备通过邮寄将其推出。\n\
  \n除了自己的软件产品外，Tayko 的客户名单也是其核心资产。为了扩大客户群，它最近加入了一个专门从事计算机和软件产品的目录公司联盟体。该联盟让成员有机会从汇总的客户列表中提取姓名并邮寄目录。成员将自己的客户列表提供到池中，并可以在每个季度“提取”等数量的姓名。成员被允许对池中的记录进行预测建模，以便能够更好地从池中筛选姓名。\n\
  \n### 邮寄实验\n\nTayko 已向其包含 200,000 个名称的客户列表提供给该池，总共有超过 5,000,000 个名称，因此它现在有权提取 200,000\
  \ 个名称进行邮寄。Tayko 希望选择最有可能表现良好的姓名，因此它进行了一项测试——从池中抽取了 20,000 个名称，并对新目录进行了测试邮寄。\n\n\
  这次邮寄产生了 1065 名购买者，响应率位 0.053。为了优化数据挖掘技术的性能，决定使用包含相同数量购买者和非购买者的分层样本。为了方便演示，此案例的数据集仅包含\
  \ 1000 个购买者和 1000 个非购买者，表观响应率为了 0.5。因此，在使用该数据集预测谁将成为购买者之后，我们必须通过将每个案例的“购买概率”乘以 0.053/0.5（即\
  \ 0.107），将购买率调回原来的。\n\n### 数据\n\n本案例中有两个结果变量。`Purchase` 表示潜在客户是否对测试邮寄做出了响应并购买了东西。`Spending`\
  \ 表示对于那些进行了购买的人，他们花费了多少钱。本案例的总体程序是开发两个模型。一个将用于将记录分类为 `purchase`（购买）或 `no purchase`（未购买）。第二个将用于那些被归类为\
  \ `purchase` 的案例，并预测他们将花费的金额。\n\n表 21.6 显示了前几行数据。表 21.7 提供了本案例可用变量的说明。\n\n| sequence_number\
