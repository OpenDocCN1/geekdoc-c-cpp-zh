  \ 是多少？这意味着什么？\n\n2. 如果使用上述 `k*-NN` 对训练数据评分，验证误差是多少？\n\n3. 如果目标是预测数千个区域的 MEDV，使用\
  \ `k*-NN` 的缺点是什么？\n\n4. 列出算法生成每个预测所经过的操作。\n\n| CRIM | ZN | INDUS | CHAS | NOX |\
  \ RM | AGE | DIS | TAX | PTRATIO | LSTAT |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- | :--- |\n :--- |\n| 0.2 | 0 | 7 | 0 | 0.538 | 6 | 62\
  \ | 4.7 | 307 | 21 | 10 |\n\n\n\n\n4. 如果该概率高于截断概率，则将新记录分配给感兴趣的类别。\n\n### 条件概率\n\n\
  这两种程序都引入了`条件概率`的概念，即在事件 `B` 发生的条件下，事件 `A` 发生的概率（记为 `P(A|B)`）。在这种情况下，我们将考虑在预测变量值为\
  \ `x[1]`、`x[2]`、 …, `x[p]` 的情况下，记录属于类别 `C[i]` 的概率。泛而言之，对于一个具有 `m` 个类别 `C[1]`、`C[2]`、\
  \ …, `C[m]` 的响应以及预测变量值 `x[1]`、`x[2]`、 …, `x[p]`，我们想要计算\n\n(8.1)![numbered Display\
  \ Equation](img/c08_M0001.gif)\n\n为了对记录进行分类，我们以这种方式计算其属于每个类别的概率，然后将记录归到概率最高的类别，或使用截断概率来决定其应被分配给感兴趣的类别。\n\
  \n从这个定义中可以看出，贝叶斯分类器仅适用于分类预测变量。如果我们使用一组数值型预测变量，那么多个记录在这些数值预测变量上具有相同值的可能性极小。因此，数值型预测变量必须分箱（binned）并转换为分类预测变量。*贝叶斯分类器是书中介绍的所有分类或预测方法中，特别适用于（且仅限于）分类预测变量的方法。*\n\
  \n### 示例 1：预测财务报告造假\n\n一家会计师有很多大型公司作为客户。每个客户都向该事务所提交年度财务报告，然后由会计事务所进行审计。为了简单起见，我们将审计结果命名为“欺诈”或“真实”，指的是会计事务所对客户财务报告的评估。会计事务所有强烈的动机来准确识别欺诈报告——如果它将欺诈报告判定为真实，它将面临法律问题。\n\
  \n会计事务所注意到，除了所有的财务记录外，它还有关于客户之前是否有过法律纠纷（针对其提出的任何类型的刑事或民事起诉）的信息。这些信息在之前的审计中未使用，但会计事务所正在考虑未来是否可以使用它们来识别需要更深入审查的报告。具体而言，它想知道之前的法律纠纷是否是财务造假报告的预测指标。\n\
  \n在这种情况下，每个客户都是一条记录，感兴趣的输出变量![](img/c08_ILM0001.gif)有两个公司可以归入的类别：`C[1]` = 欺诈和 `C[2]`\
  \ = 真实。预测变量——“之前的法律纠纷”有两个值：0（无之前的法律纠纷）和 1（有之前的法律纠纷）。\n\n该会计事务所拥有其过去调查过的 1500 家公司的数据。对于每家公司，它都有关于财务报告被判定为欺诈还是真实的信息，以及该公司是否有过之前的法律纠纷的信息。数据被划分为训练集（1000\
  \ 家公司）和验证集（500 家公司）。训练集中的计数显示表 8.1。\n\n| | **此前法律纠纷** | **无此前法律纠纷** | |\n| | (`X`\
  \ = 1) | (`X` = 0) | **总计** |\n| 欺诈 (![](img/c08_ILM0002.gif)) | 50 | 50 | 100 |\n\
  | 真实 (![](img/c08_ILM0003.gif)) | 180 | 720 | 900 |\n| 总计 | 230 | 770 | 1000 |\n\
  \n**表 8.1** 财务报告示例透视表\n\n### 8.2 应用完全（精确）贝叶斯分类器\n\n现在考虑一家新公司的财务报告，我们希望使用这些数据将其分类为欺诈或真实。为了做到这一点，我们像上面一样计算其属于这两个类别中每个类别的概率。\n\
  \n如果这家新公司有过之前的法律纠纷，那么其属于欺诈类的概率将是 `P(fraudulent | prior legal)` = 50/230（在训练集中 230\
  \ 家有此前法律纠纷的公司中，有 50 家财务报告为欺诈）。属于另一个类别“真实”的概率显然是剩余部分 = 180/230。\n\n#### 使用“分配给概率最大的类别”方法\n\
  \n如果一家公司有之前的法律纠纷，我们将其分配到“真实”类。对于无此前法律纠纷情况的类似计算留给读者练习。在这个示例中，使用“分配给概率最大的类别”的规则，所有记录都被分配到“真实”类。这与“将所有记录分配给多数类”的朴素规则得到相同的结果。\n\
  \n#### 使用截断概率方法\n\n在这个示例中，我们更感兴趣的是识别欺诈报告——那些可能让审计师入狱的报告。我们意识到，为了识别出欺诈报告，某些真实报告会被误判为欺诈，且整体分类准确率可能会下降。因此，我们的方法是为欺诈概率建立一个截断值，并将所有高于该值的记录分类为欺诈。计算记录属于类别\
  \ `C[i]` 概率的贝叶斯公式为：\n\n(8.2)![numbered Display Equation](img/c08_M0002.gif)\n\n\
  在这个示例中（其中欺诈案例较少），如果截断值设定在 0.20，我们将有法律纠纷的记录分类为欺诈，因为 `P(fraudulent | prior legal)`\
  \ = 50/230 = 0.22。用户可以将此截断值视为“滑动条”，像任何分类模型中的其他参数一样进行调整。\n\n#### 完全（精确）贝叶斯程序的实际操作困难\n\
  \n上述方法等同于在样本中寻找与待分类记录完全相同的记录。在上面那个仅有一个预测变量的小示例中，这是很容易的。\n\n当预测变量数量增加时（即使是 20 个这种中等数量），许多待分类记录将没有匹配项。这可以在根据人口统计变量预测投票的背景下理解。即使是巨大的样本，也可能找不到一个匹配男性、裔、高收入、来自美国中部、在上一次选举投票、在上之前的选举未投票、有三个女儿和一个儿子且离婚的记录。这仅仅是八个变量，对于大多数数据挖掘练习来说数量很少。仅仅增加一个具有五个类别的变量，匹配概率就会减少\
  \ 5 倍。\n\n#### 解决方案：朴素贝叶斯\n\n在朴素贝叶斯解决方案中，我们不再将概率计算限制在与待分类记录匹配的记录上。相反，我们使用整个数据集。回到章节开头概述的原始分类程序，回顾对新记录的分类程序为：\n\
  \n1. 找到所有具有相同预测配置的其它记录（即预测变量值相同）。\n2. 确定记录属于哪些类别以及哪种类别最常见。\n3. 将该类别分配给新记录。\n\n朴素贝叶斯的修改（针对基础分类程序）如下：\n\
  \n1. 对于类别 `C[1]`，估计每个预测变量的单个条件概率 `P(x[j]|C[1])`——这些是待分类记录中的预测值出现在类别 `C[1]` 中的的概率。例如，对于\
  \ `X[1]`，该概率通过训练集中 `C[1]` 记录中 `x[1]` 值的比例来估计。\n2. 将这些概率相乘，乘以属于类别 `C[1]` 的记录的比例。\n\
  3. 对所有类别重复第 1 和第 2 步。\n\n\n\n\n\n4. 估计类别 `C[i]` 的概率，将步骤 2 中计算出的类别 `C[i]` 的值除以所有类别此类值的总和。\n\
  \n5. 将记录分配给在该组预测值下概率概率的类别。\n\n上述步骤得出了朴素贝叶斯公式，用于计算具有给定一组预测值 `x[1]`， …, `x[p]` 的记录在\
  \ `m` 个类别中属于类别 `C[1]` 的概率。该公式可以写如如下所示：\n\n(8.3)![编号的显示方程](img/c08_M0003.gif)\n\n\
  这是一个相当令畏的公式；请参见示例 2 以获取更简单的数值版本。请注意，所有需要的数量都可以从 `Y` 与每个分类预测变量的交叉视表中获得。\n\n### 朴素贝叶斯的条件独立性假设\n\
  \n在概率术语中，我们做了一个简化假设，即在特定类别内看到预测特征配置为 `x[1]`、`x[2]`、 …, `x[p]` 的记录的确切*条件概率* `P(x[1],\
  \ x[2], …, x[p]|C[i])` 被各个条件概率的乘积 `P(x[1]|C[i]) × P(x[2]|C[i])⋅·⋅ × P(x[p]|C[i])`\
  \ 良好近似。当预测变量在每个类别内部独立时，这两个值是相等的。\n\n例如，假设“去年亏钱”是会计欺诈示例中的一个额外变量。我们通过朴素贝叶斯做的简化假设是，在给定类别内，我们不再需要寻找同时具有“曾有法律纠纷”和“去年亏钱”特征的记录。相反，假设这两者是独立的，我们可以简单地将“曾有法律纠纷”的概率乘以“去年亏钱”的概率。当然，在实践中完全完全独立是不可能的，因为预计预测变量之间存在某些相关性。\n\
  \n在实践中，尽管违反了假设，该程序运行得相当不错——主要是因为通常需要的不是每个记录在绝对意义上准确的倾向性，而是倾向性的一个合理的*排序*。即使在假设被违反的情况下，记录倾向性的排序通常也能得以保留。\n\
  \n请注意，如果我们感兴趣的仅仅是排序，且分母对所有类别都是相同的，那么只需关注分子就足够了。这种方法的缺点是，它产生的概率值（倾向性）虽然排序是正确的，但与用户预期的确切值不在同一尺度上。\n\
  \n### 使用截断概率法\n\n上述程序适用于基本情况，即我们寻求所有类别的最大分类准确率。在*感兴趣的相对稀有类别*的情况下，程序如下：\n\n1. 为感兴趣的类别建立一个截断概率，高于该概率的记录被认为属于该类别。\n\
  2. 对于感兴趣的类别，计算待分类记录中每个单独预测器值在训练数据中出现的概率。\n3. 将这些概率相乘，然后乘以属于感兴趣类别的记录的比例。\n4. 估计感兴趣类别的概率，将步骤\
  \ 3 中计算出的感兴趣类别的值除以所有类别相似值的总和。\n5. 如果该值高于截断值，则将新记录分配给感兴趣的类别，否则不。\n6. 根据需要调整截断值，将其作为模型的一个参数。\n\
  \n### 示例 2：预测欺诈财务报告，两个预测变量\n\n让我们财务报告示例扩展到两个预测变量，并使用一小部分数据，比较完全（确切）贝叶斯计算与朴素贝叶斯计算。\n\
  \n考虑表 8.2 列出的会计师的 10 个客户。对于每个客户，我们都有关于其是否曾有法律纠纷、是小公司还是大公司，以及财务报告被发现是欺诈还是属实的信息。使用这些信息，我们将给定四种可能的组合\
  \ `{y, small}`、`{y, large}`、`{n, small}`、`{n, large}`欺诈的条件概率。\n\n| 公司 | 曾有法律纠纷 |\
  \ 公司规模 | 状态 |\n| --- | --- | --- | --- |\n| 1 | 是 | 小 | 真实 |\n| 2 | 否 | 小 | 真实 |\n\
  | 3 | 否 | 大 | 真实 |\n| 4 | 否 | 大 | 真实 |\n| 5 | 否 | 小 | 真实 |\n| 6 | 否 | 小 | 真实 |\n\
  | 7 | 是 | 小 | 欺诈 |\n| 8 | 是 | 大 | 欺诈 |\n| 9 | 否 | 大 | 欺诈 |\n| 10 | 是 | 大 | 欺诈 |\n\
  \n**表 8.2**10 家公司的信息\n\n**完全（确切）贝叶斯计算：** 概率计算如下\n\n![编号的显示方程](img/c08_M0004a.jpg)\n\
  \n**朴素贝叶斯计算：** 现在我们计算朴素贝叶斯概率。对于给定 `{PriorLegal = y, Size = small}` 欺诈行为的条件概率，分子是欺诈公司中\
  \ `{PriorLegal = y}` 实例的比例，乘以欺诈公司中 `{Size = small}` 实例的比例，再乘以欺诈公司的比例：`(3/4)(1/4)(4/10)`\
  \ = `0.075`。为了获得实际概率，我们还必须计算给定 `{PriorLegal = y, Size = small}` 属实行为的条件概率的分子：`(1/6)(4/6)(6/10)`\
  \ = `0.067`。分母是这两个条件概率之和（`0.075 + 0.067 = 0.14`）。因此，给定 `{PriorLegal = y, Size =\
  \ small}` 的欺诈行为条件概率为 `0.075/0.14` = `0.53`。以类似的方式，我们计算所有条件概率：\n\n![编号的显示方程](img/c08_M0005.jpg)\n\
  \n这些朴素贝叶斯概率与确切贝叶斯概率有多接近。尽管它们不相等，但在 0.5（以及许多其他值）处，两者会导致相同的分类。概率的排序往往比概率本身更接近确切贝叶斯，且对于分类目的来说，排序才是重要的。\n\
  \n我们现在考虑一个更大的数值示例。\n\n### 示例 3：预测延误\n\n预测延误对各种组织都有用：机场管理局、航空公司和航空当局。有时会成立联合工作组来解决这个问题。如果这样一个组织能够提供实时的航班延误协助，将从可能延误的提前通知中受益。\n\
  \n在这个简化的插图中，我们查看五个预测变量（参见表 8.3）。感兴趣的结果是航班是否延误（*延误*在这里意味着晚了 15 分钟）。我们的数据由 2004 年\
  \ 1 月期间从华盛顿地区飞往纽约地区的所有航班组成。记录是一个特定的航班。这 2201 架航班中延误的比例为 19.5%。数据来自运输统计局（可在[`www.transtats.bts.gov`](http://www.transtats.bts.gov）获取）。目标是准确预测新航班（不在此数据集中）是否会延误。结果变量是航班是否延误，因此它有两个类别（1=延误，0=准时）。此外，还收集了表\
  \ 8.3 列出的预测变量的信息。\n\n| 星期 | 编码为 1 = 周一，2 = 周二，... 7 = 周日 |\n| 计划出发时间 | 分为早晨 6 点到晚上\
  \ 10 点之间的 18 个间隔 |\n| 出发地 | 三个机场代码：DCA（雷根国家机场）、IAD（杜勒斯）、 |\n| | BWI（巴尔的摩-华盛顿国际）\
  \ |\n\n\n\n\n\n| 目的地 | 三个机场代码：JFK (Kennedy), LGA (LaGuardia), EWR (Newark) |\n||\
  \ 航空公司 | 八个航空公司代码：CO (Continental), DH (Atlantic Coast), DL (Delta), MQ (American\
  \ Eagle), OH (Comair), RU (Continental Express), UA (United), 和 US (USAirways) |\n\
  \n### 表 8.3 航班延迟示例中的变量说明\n\n#### 数据分区\n\n数据首先被划分为训练集（60%）和验证集（40%），然后对训练集应用朴素贝叶斯分类器（我们使用\
  \ `e1071` 软件包）。\n\n表 8.4 输出的第一部分显示了训练集中延误航班和准点航班的比例（称为先验概率），随后是每个类别作为预测值函数的条件概率。请注意，朴素贝叶斯输出中的条件概率简单地通过对训练数据使用透视表来复制，查看每个值相对于整个类别的记录比例。这在表\
  \ 8.5 中所示，该表显示了按目的地机场划分的延误（或准点）航班比例（每行总和为 1）。\n\n```\n# 运行朴素贝叶斯的代码\n```\n\n```r\n\
  library(e1071)\ndelays.df <- read.csv(\"FlightDelays.csv\")\n\n# 先将数值变量转换为分类变量\n\
