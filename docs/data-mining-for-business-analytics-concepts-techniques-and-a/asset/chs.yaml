  \ ARIMA 模型\n\n当我们使用线性回归进行时间序列预测时，能够考虑到趋势和季节性模式。然而，普通的回归模型并没有考虑到不同时期之间的依赖性，而在横截面数据中这种假设是成立的。但在时间序列中，相邻时期的值往往是相关的。这种相关性被称为自相关，它非常有意义并有助于预测。如果我们知道高值往往会紧随高值（正相关），我们就可以据此调整预测。现在我们将讨论如何计算序列的自相关，以及如何更好地利用这些信息来预测。\n\
  \n### 计算自相关\n\n时间序列相邻值之间的相关性被称为自相关，因为它描述了序列与其自身的关系。为了计算自相关，我们计算序列与其滞后版本之间的相关性。滞后序列是原始序列向后移动一个或多个期的“副本”。滞后\
  \ 1 序列是向后移动一个期的原始序列；滞后 2 序列是向后移动两个期的原始序列，以此此类推。表 17.6 显示了 Amtrak 客流量的前 24 个月、滞后\
  \ 1 序列和滞后 2 序列。\n\n| 月份 | 客流量 | 滞后 1 序列 | 滞后 2 序列 |\n| :--- | :--- | :--- | :---\
  \ |\n| --- | --- | --- | --- |\n| 1991 年 1 月 | 1709 | | |\n| 1991 年 2 月 | 1621 |\
  \ | |\n| 1991 年 3 月 | 1973 | | |\n| 1991 年 4 月 | 1812 | | |\n| 1991 年 5 月 | 1775\
  \ | | |\n| 1991 年 6 月 | 1862 | | |\n| 1991 年 7 月 | 1940 | | |\n| 1991 年 8 月 | 2013\
  \ | | |\n| 1991 年 9 月 | 1596 | | |\n| 1991 年 10 月 | 1725 | | |\n| 1991 年 11 月 |\
  \ 1676 | | |\n| 1991 年 12 月 | 1814 | | |\n| 1992 年 1 月 | 1615 | | |\n| 1992 年 2\
  \ 月 | 1557 | | |\n| 1992 年 3 月 | 1891 | | |\n| 1992 年 4 月 | 1956 | | |\n| 1992 年\
  \ 5 月 | 1885 | | |\n| 1992 年 6 月 | 1623 | | |\n| 1992 年 7 月 | 1903 | | | |\n| 1992\
  \ 年 8 月 | 1997 | | | |\n| 1992 年 9 月 | 1704 | | | |\n| 1992 年 10 月 | 1810 | | |\
  \ |\n| 1992 年 11 月 | 1862 | | | |\n| 1992 年 12 月 | 1875 | | | |\n\n表 17.6 Amtrak\
  \ 客流量序列的前 24 个月及其滞后 1 和 2 序列\n\n接下来，为了计算衡量相邻时期值之间线性关系的滞后 1 自相关，我们计算原始序列与滞后 1 序列之间的相关性（例如通过\
  \ `cor()` 函数），结果为 0.08。请注意，虽然表 17.6 中的原始序列有 24 个时期，但滞后 1 自相关将仅基于 23 对（因为滞后 1 序列没有\
  \ 1991 年 1 月的值）。同样，衡量相隔两个时期值的关系的滞后 2 自相关，是原始序列与滞后 2 序列之间的相关性（得出 -0.15）。\n\n我们可以使用\
  \ R 语言中 forecast 包的 `Acf()` 函数直接计算并绘制序列在不同滞后阶数的自相关图。例如，24 个月客流量的输出如图 17.7 所示。\n\n\
  ```\n创建图 17.7 的代码\n```\n\n```\nridership.24.ts <- window(train.ts, start = c(1991,\
  \ 1), end = c(1991, 24))\nAcf(ridership.24.ts, lag.max = 12, main = \"\")\n```\n\
  \n图 17.7 滞后 1–12 自相关图（针对前 24 个月）\n\n一些值得探索的典型自相关行为：\n\n- **大于 1 的倍数处的强相关（正或负）**\
  \ (2k, 3k, ...) 通常反映周期模式。例如，月数据中的强滞后 12 相关反映了年度季节性（每年相同月份的值正相关）。\n- **正滞后 1 自相关**（被称为“粘性”）描述了连续值大致向同一方向移动的序列。在存在强趋势的情况下，我们预计会看到强滞后\
  \ 1 自相关。\n- **负滞后 1 自相关**反映了序列的波动，高值紧接着低值，反之亦然。\n\n因此，检查序列的自相关有助于检测季节性模式。例如，在图 17.7\
  \ 中，我们看到最强相关位于滞后 6 且为负。这表明客流量存在双年度模式，即每 6 个月发生高低值切换。\n\n\n\n\n\n通常情况下，利用自相关性有两种方法。一种是将自相关性直接构建到回归模型中，另一种是在残差序列上构建一个二级预测模型。\n\
  \n### 回归类型模型\n\n在直接考虑自相关性的回归类型模型中，包括`自回归` (AR) 模型，或者更通用的模型类 `ARIMA`（自回归积分移动平均）模型。`AR`\
  \ 模型与线性回归模型相似，不同之处在于预测变量是序列的过去值。例如，阶为 2 的自回归模型记作 `AR(2)`，可以写为：\n\n(17.1)![numbered\
  \ Display Equation](img/c17_M0002.gif)\n\n估计此类模型大致等同于拟合一个以序列为结果变量的线性回归模型并将并将滞后序列（在本例中为滞后\
  \ 1 和 2 期）作为预测变量。然而，使用指定的 `ARIMA` 估计方法（例如 R 语言 `forecast` 包中提供的方法）比普通线性回归估计更好，可以产生更准确的结果。从\
  \ `AR` 扩展到 `ARIMA` 模型创建了一组更灵活的预测模型，但也需要更多的统计专业知识。即使是使用简单的 `AR` 模型，将它们拟合到包含趋势和季节性等模式的原始时间序列也需要用户进行多次初始数据转换并选择模型阶数。这些并不是简单的任务。由于\
  \ `ARIMA` 建模比其他方法不够健壮，且需要更多的经验和统计专业知识，在实际预测中，使用此类模型预测原始序列并不常见。因此，我们建议感兴趣的读者经典的时间序列教材[例如，参见\
  \ Chatfield (2003) 的第 4 章]。\n\n### 利用 AR 模型处理残差\n\n然而，我们确实讨论了 `AR` 模型的一种特定用途，这种方法在预测环境中应用非常简单，并能显著改进短期预测。这涉及到利用自相关性的第二种方法，即为残差构建一个二级预测模型，如下：\n\
  \n1. 使用任何预测方法生成序列的 `k` 步提前预测 (`F[t + k]`）。\n2. 使用 `AR`（或其他）模型生成预测误差（残差）的 `k` 步提前预测\
  \ (`E[t + k]`）。\n3. 根据预测误差调整对序列的初始 `k` 步提前预测以进行改进：`Improved F[t + k] = F[t + k]\
  \ + E[t + k]`。\n\n特别地，我们可以对残差序列（或“预测误差”）拟合低阶 `AR` 模型，然后用它来预测未来的预测误差。通过拟合残差序列而非原始序列，我们避免了初始数据转换的需求（因为预计残差序列不包含自相关之外的任何趋势或周期行为）。\n\
  \n为了对残差序列拟合 `AR` 模型，我们首先检查残差序列的自相关性。然后根据自相关出现的滞后阶数选择 `AR` 模型的阶数。通常，当滞后 1 及以上存在自相关性时，拟合如下形式的\
  \ `AR(1)` 模型就足够了：\n\n(17.2)![numbered Display Equation](img/c17_M0003.gif)\n\n其中\
  \ `E[t]` 表示时间 `t` 处的残差（或预测误差）。例如，尽管图 17.8 中的自相关性从滞后 1 到 10 左右看起来很大，但 `AR(1)` 可能会捕捉到所有这些关系。原因是，如果相邻的值是相关的，那么这种关系就会传播到两个周期后的值、三个周期后的值等，以此此类推。\n\
  \n对 Amtrak 客运量残差序列拟合 `AR(1)` 模型的结果所示表 17.7。`AR(1)` 系数 (0.5998) 接近于我们之前发现的滞后 1 自相关系数\
  \ (0.6041)（图 17.8）。2001 年 4 月的预测残差是通过将 2001 年 3 月的最最近的残差（等于 12.108）代入 `AR(1)` 模型计算出的：\n\
  \n(17.3)![numbered Display Equation](img/c17_M0004.gif)\n\n你可以直接使用 `forecast()`\
  \ 函数获取这个数字（参见表 17.7 中的输出）。正值告诉我们，回归模型产生的 2001 年 4 月的客运量预测太低，我们应该通过增加 7411 人来向上调整。在这个特定的示例中，回归模型（带有二次趋势和季节性）产生的预测值为\
  \ 2,004,271 人，而改进后的二阶段模型 `[回归 + AR(1) 修正]` 通过将其增加到 2,011,906 人进行了修正。2001 年 4 月的实际值为\
  \ 2,023,792 人——更接近改进后的预测值。\n\n| |\n```\n # 在残差上运行 AR(1) 模型的代码\n``` | |\n\n| | ```\
  \ ```\n# 为 Ridership 拟合带有二次趋势和季节性的线性回归\ntrain.lm.trend.season <- tslm(train.ts ~\
  \ trend + I(trend²) + season)\n\n### 对训练残差拟合 AR(1) 模型\n# 使用 forecast 包中的 Arima()\
  \ 拟合 ARIMA 模型\n# （包含 AR 模型）；order = c(1,0,0) 得到 AR(1)\ntrain.res.arima <- Arima(train.lm.trend.season$residuals,\
  \ order = c(1,0,0))\nvalid.res.arima.pred <- forecast(train.lm.trend.season$residuals,\
  \ h = 1)\n``` | **表 17.7 客运残差的 AR(1) 模型输出\n\n从实际值与预测序列的图中（图 17.9）可以看出，`AR(1)` 模型很好地拟合了残差序列。然而，注意该图是基于训练数据的（截至\
  \ 2001 年）。为了评估 `[回归 + AR(1)]` 的预测性能，我们需要在验证数据上检查性能（例如通过 MAPE 或 RMSE），方法类似于我们为 2001\
  \ 年 4 月进行的计算。\n\n| | ``` 创建图 17.9 的代码 ``` |\n| | ``` plot(train.lm.trend.season$residuals,\
  \ ylim = c(-250, 250), ylab = \"Residuals\", \n    xlab = \"Time\", bty = \"l\"\
  , xaxt = \"n\", xlim = c(1991,2006), main = \"\")\naxis(1, at = seq(1991, 2006,\
  \ 1), labels = format(seq(1991,2006, 1)))\n``` |\n\n最后，为了检查我们是否确实考虑了序列中的自相关性，并且序列中不再包含更多信息，我们检查了残差的残差序列（即在应用于回归残差的\
  \ `AR(1)` 后得到的残差）。这在图 17.10 中所示。显然，不再存在自相关性，添加 `AR(1)` 模型已经充分捕捉了自相关信息。\n\n\n\n\n\
  我们之前提到，通过增加一个 `AR` 层来改进预测对于短期预测是有用的。这是因为阶阶为 `k` 的 `AR` 模型通常只对未来 `k` 个周期提供有用的预测，此后的预测将依赖于早期的预测而非实际数据。例如，在预测时间为\
  \ 2001 年 3 月时预测 2001 年 5 月的残差，我们需要 2001 年 4 月的残差。然而，由于该值可用，它将由其预测值取代。因此，2001 年 5\
  \ 月的预测将基于 2001 年 4 月的预测。\n\n### 评估可预测性\n\n在尝试预测时间序列之前，确定其是否具有可预测性很重要，即其历史数据是否可以用于预测超越朴素预测（naive\
  \ forecast）的未来。评估可预测性的一种有效方法是测试该序列是否为`随机游走`（random walk）。随机游走是指从一个时间段到下一个时间段的变化是随机的序列。根据经济学中的有效市场假设，资产价格是随机游走的，因此预测股票价格是一场概率游戏。([7)\n\
  \n随机游走是 `AR(1)` 模型的一种特例，其斜率系数等于 1：\n\n(17.4)![numbered Display Equation](img/c17_M0005.gif)\n\
  \n我们也可以将其写为：\n\n(17.5)![numbered Display Equation](img/c17_M0006.gif)\n\n从最后一个方程可以看出，`t\
  \ − 1` 和 `t` 周期之间的值差是随机的，因此有了“随机游走”这一术语。此类模型的预测基本上等于最近的观测值（朴素预测），反映了缺乏其他信息。\n\n\
  要测试一个序列是否为随机游走，我们拟合一个 `AR(1)` 模型并测试斜率系数等于 1 的假设（`H[0]: β[1] = 1` 对比 `H[1]: β[1]\
  \ ≠ 1`）。如果拒绝原假设（由较小的 `p`-值反映），则该序列不是随机游走，我们可以尝试对其进行预测。\n\n例如，考虑图 17.6 所示的 `AR(1)`\
  \ 模型。斜率系数 (0.5998) 离 1 以上 5 个标准差，表明这不是随机游走。相反，考虑拟合 1995 年 5 月至 2003 年 8 月期间 S&P500\
  \ 月收收价序列的 `AR(1)` 模型（在 `SP500.csv` 中，见表 17.8）。这里的斜率系数为 0.9833，标准差为 0.0145。该系数非常接近\
  \ 1（大约一个标准差），表明这是一个随机游走。因此，使用之前描述的任何方法（朴素预测之外）预测该序列都是徒劳的。\n\n```\n> sp500.df <-\
  \ read.csv(\"SP500.csv\")\n\n> sp500.ts <- ts(sp500.df$Close, start = c(1995, 5),\
  \ end = c(2003, 8), freq = 12)\n> sp500.arima <- Arima(sp500.ts, order = c(1,0,0))\n\
  > sp500.arima\nSeries: sp500.ts \nARIMA(1,0,0) with non-zero mean \n\nCoefficients:\n\
  \            ar1    intercept\n      0.9833410  890.0706502\ns.e.  0.0145083  221.0280170\n\
  \nsigma² estimated as 2833.446:  log likelihood=-540.05\nAIC=1086.1   AICc=1086.35\
  \   BIC=1093.92\n```\n\n**表 17.8** S&P500 月收盘价的 AR(1) 模型输出\n\n### 问题\n\n1. **9·11\
  \ 事件对美国航空旅行的影响。** 与创新技术管理局运输统计局进行了一项研究，以评估 2001 年 9 月 11 日恐怖袭击对美国运输的影响。2006 年的研究报告和数据可以在\
  \ [`goo.gl/w2lJPV`](http://goo.gl/w2lJPV)找到。研究目标如下：\n\n   > 本研究目的是对 9/11 前后长途旅行人员的出行行为模式提供更深入的理解。\n\
  \n   报告分析了 1990 年 1 月至 2004 年 5 月之间的每月客运数据。该期间三个月时间序列的数据在文件 `Sept11Travel.csv` 中：(1)\
  \ 实际航空公司收入客里程（Air），(2) 铁路客英里（Rail），以及 (3) 汽车里程（Car）。\n\n   为了评估 9·11 事件的影响，BTS 采取了以下方法：报告分析了\
  \ 1990 年 1 月至 2004 年 5 月之间的每月客运数据。该期间三个月时间序列的数据在文件 `Sept11Travel.csv` 中：(1) 实际航空公司收入客里程（Air），(2)\
  \ 铁路客英里（Rail），以及 (3) 汽车里程（Car）。\n\n（注：原文此处存在大量重复段落，已根据要求进行去重并保留核心内容）\n\n\n\n\n**图\
  \ 17.12** 加拿大制造业工人平均每年工作小时\n\n### 3. 玩具乐场（Toys “R” Us）收入。图 17.13 是 1992 年至 1995\
  \ 年间玩具乐场季度收入的时间图（感谢 Chris Albright 建议使用这些数据，这些数据可在 `ToysRUsRevenues.csv` 中找到）。\n\
  \n1.  拟合一个具有线性趋势和加法季节性的回归模型。使用整个序列（排除最后两个季度）作为训练集。\n2.  回归模型的部分输出如表 17.9 所示（其中 `season2`\
