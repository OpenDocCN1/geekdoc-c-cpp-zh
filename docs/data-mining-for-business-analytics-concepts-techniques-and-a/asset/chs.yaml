  \ 中，我们看到周日和周一的延误比例最高。延误率似乎还根据航空公司、一天中的时间以及出发地和目的地机场而不同。对于 `Weather`（天气），我们看到 `Weather\
  \ = 1`（在这种情况下总是延误）和 `Weather = 0` 时延误之间存在显著差异。图 10.5 中的热图揭示了一些具有高延误率的特定组合，例如从 BWI\
