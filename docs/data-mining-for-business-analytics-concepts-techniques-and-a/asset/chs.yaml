  \n## 图 15.1 22 家公用事业公司燃料成本与销售额的散点图\n\n因此，我们可以聚类分析视为一种更正式的记录记录距离算法，根据这些距离（这里是二维距离）形成聚类。对于\
  \ `n` 个记录的数据集，有两种通用的聚类算法：\n\n- **层次聚类（Hierarchical methods）**：凝聚法（agglomerative）或分裂法（divisive）。凝聚法从\
  \ `n` 个聚类开始，不断合并相似的聚类直到得到一个聚类；分裂法则相反，从包含所有记录的类聚类开始。\n- **非层次聚类（Non-hierarchical\
  \ methods）**：如 `k-means`。通过指定聚类数量将记录分配到每个聚类。这些方法计算量较小，因此更适用于大型数据集。我们在这里关注两种流行的方法：层次聚类和\
  \ `k-means` 聚类。\n\n## 15.2 测量两条记录之间的距离\n\n我们用 `dij` 表示记录 `i` 和 `j` 之间的“距离量”或“差异度量”。对于记录\
  \ `i`，我们有测量向量 (`xi1`, `xi2`, ..., `xp`)；对于记录 `j`，我们有测量向量 (`xj1`, `xj2`, ..., `xp`)。例如，我们可以将亚利桑服务的测量值写为\
  \ `[1.06, 9.2, 151, 54.4, 1.6, 9077, 0.628]`。距离有多种定义方式，但通常需要以下属性：\n\n- **非负性**：`dij\
  \ ≥ 0`\n- **自反性**：`ii = 0`\n- **对称性**：`dij = dij`\n- **三角不等式**：`dij ≤ dik + kj`（任意两之间的距离不能超过另外两个距离之和）\n\
  \n### 欧几里得距离\n\n最流行的距离度量是记录 `i` 和 `j` 之间的欧几里得距离 `dij`：\n![](img/c15_M001.gif)\n\
  例如，亚利桑服务与 Edison 公司的距离可以从原始数据计算：\n![](img/c15_M002.gif)\n在 R 中计算欧几里得距离，请见表 15.2。\n\
  \n### 数据归一化\n\n上述度量受每个变量尺度的影响很大，因此尺度较大的（例如 `Sales`）对总距离的影响更大。因此，在计算欧几里得距离之前，会对连续测量值进行归一化。归一化意味着减去平均值并除以标准差（归一化值称为\
  \ `z-scores`）。例如，22 家公用事业公司的平均销售额为 8914.045，标准差为 3549.984。因此，亚利桑服务的归一化销售值为 `(9077\
  \ − 8914.045)/3549.984 = 0.046`。回到只有两个测量值（`Sales` 和 `Fuel Cost`）的简化数据，我们首先对测量值进行归一化（见表\
  \ 15.3），然后计算每对记录之间的欧几里得距离。表 15.4 提供了前五家公司的这些两距离。也可以为所有 22 家公用事业公司构建类似的表格。\n\n| 公司\
