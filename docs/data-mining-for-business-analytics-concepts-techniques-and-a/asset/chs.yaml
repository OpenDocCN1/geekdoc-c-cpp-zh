  \ in graph layout. The first step in making a choice is to establish what principles\
  \ should govern the layout. Dunne and Shneiderman (2009, cited in Golbeck, 2013)\
  \ list these four graph readability principles:\n\n1. Every node should be visible.\n\
  2. For every node, you should be able to count its degree (explained below).\n3.\
  \ For every link, you should be able to follow it from source to destination.\n\
  4. Clusters and outliers should be identifiable.\n\nThese general principles are\
  \ then translated into readability metrics by which graphs can be judged. Two simple\
  \ layouts are `circular` (all nodes lie in a circle) and `grid` (all nodes lie at\
  \ the intersection of grid lines in a rectangular grid).\n\nYou can probably think\
  \ of alternate layouts that more clearly reveal structures such as clusters and\
  \ singletons, and so can computers using a variety of algorithms. These algorithms\
  \ typically use a combination of fixed arbitrary starting structures, random tweaking,\
  \ analogs to physical properties (e.g., springs connecting nodes), and a sequence\
  \ of iteration and measurement against the readability principles. A detailed discussion\
  \ of layout algorithms is beyond the scope of this chapter; see Golbeck (2013, chapter\
