  \ 12.3](#c12.xhtml_figure12-3) 中所示，该图包含了判别模型生成的线条。(2)\n\n![图表显示收入从 20 到 120 千美元，对比地面积从\
  \ 13 到 25 千平方英尺，并带有所有者、非业主、DA 线和特有线条的图。](img/c12f003.jpg)\n\n### 图 12.3 图 12.3](#c12.xhtml_figureanchor12-3)\
  \ 从判别模型获得的类别分离（与图 12.1](#c12.xhtml_figure12-1) 中的特有线条相比）\n\n\n\n\n尽管这些统计假设中存在局限性，但请记住，在预测建模环境中，最终的测试是模型是否有效运行。一种合理的方法是针对正态性和相关性进行一些探索性分析，训练并评估模型，然后根据分类准确率以及你从初始探索中学到的知识，返回并进一步探索是否应该检查离群值，或是否需要重新选择预测变量。\n\
  \n在分类准确率的评估方面，我们再次使用第 5 章中描述的通用性能指标（判断分类器的性能），主要的指标是基于用于分类的混淆矩阵（仅考虑准确率或结合成本）以及用于排序的提升图（lift\
  \ chart）。使用验证集评估性能的相同论点仍然成立。例如，在割草机的示例中，第 1、13 和 17 号家庭被分类错误了。这意味着模型对这些数据产生的错误率为\
  \ 12.5%。然而，这个比率是一个偏估计——它是过度乐观的，因为我们使用了同一组数据来拟合分类函数并用其估计误差。因此，与其他所有模型一样，我们在包含未参与拟合分类函数的数据的验证集上进行性能测试。\n\
  \n要从判别分析中获得混淆矩阵，我们可以直接使用分类评分，或者使用从分类评分计算出的倾向性（属于某类别的概率）。在这两种情况下，我们都根据最高分或最高概率决定每个记录的类别分配。然后，我们将这些分类与这些记录的实际类别归属进行比较。由此产生混淆矩阵。\n\
  \n## 12.5 先验概率\n\n到目前，我们假设目标是最小化分类错误。上述方法假设遇到任一类别记录的概率是相同的。如果未来遇到不同类别记录以进行分类的概率不相等，我们应该修改函数以降低我们预期的（长期平均）错误率。修改方法如下：令\
  \ `p[j]` 表示属于类别 `j` 的先验概率或未来成员概率（在二分类情况下，我们有 `p[1]` 和 `p[2] = 1 - p[1]`）。我们通过添加\
  \ `log(p[j])` 来修改每个类别的分类函数。为了说明这一点，假设人口中割草机所有者的百分比为 15%，而样本中为 50%。这意味着模型应该将较少的家庭归类为\
  \ `owners`（所有者）。为了补偿这种失真，我们调整了表 12.1 中分类函数中的常数，并获得了所有者的调整常数 `- 73.16 + log (0.15)\
  \ = -75.06` 以及非所有者的调整常数 `- 51.42 + log (0.85) = -50.58`。为了观察这如何影响分类，考虑第 13 号家庭，在类别归属概率相等的情况下，该家庭被误归类为所有者。当我们考虑到人口中拥有割草机的概率较低时，第\
  \ 13 号家庭被正确地归类为非所有者（其 `owner` 分类分数低于 `nonowner` 分数）。\n\n## 12.6 不等的分类错误成本\n\n当分类错误成本不对称时，需要进行第二种实际修改。如果误分类类别\
  \ 1 记录的成本与误分类类别 2 记录的成本有巨大差异，我们可能希望最小化误分类的预期成本，而不是简单的错误率（后者没有考虑不等的分类错误成本）。在二分类情况下，很容易操纵分类函数来考虑不同的分类错误成本（加上先验概率）。令\
  \ `q[1]` 为误分类类别 1 成员（进入类别 2）的成本。同样，`q[2]` 表示误分类类别 2 成员（进入类别 1）的成本。这些成本通过向类别 1 常数添加\
  \ `log(q[1])` 以及向类别 2 常数添加 `log(q[2])` 整合到分类函数的常数中。为了同时纳入先验概率和分类错误成本，向类别 1 常数添加\
  \ `log(p[1]*q[1])`，并向类别 2 常数添加 `log(p[2]*q[2])`。\n\n在实践中，为每个类别确定分类错误成本 `q[1]` 和\
  \ `q[2]` 并不总是简单的。估计成本比例（`ratio of costs`）`q[2]/q[1]` 通常容易得多（例如，误分类信用卡违约者的成本是误分类非违约者的\
  \ 10 倍）。幸运的是，分类函数之间的关系仅取决于这个比例率。因此，我们可以设置 `q[1] = 1` 且 `q[2] = ratio`，并简单地向类别 2\
  \ 常数添加 `log(q[2]/q[1])`。\n\n## 12.7 分类两个以上的类别\n\n### 示例 3：事故现场的医疗调度\n\n理想情况下，每个拨打紧急号码\
  \ 911 的汽车事故电话都会导致救护车立即派遣至现场。然而，在某些情况下，调度可能会延迟（例如，在事故高峰期或在某些资源匮乏的城镇或班次中）。在这种情况下，911\
  \ 调度员必须根据模糊的信息对派遣哪些单位做出决定。通过在初始电话提供的有限信息中补充额外信息，以便将事故分类为轻伤、重伤或死亡是很有用的。为此，我们可以使用\
  \ 2001 年收集的涉及受伤的汽车事故数据。对于每起事故，都记录了额外信息，如星期、天气状况和道路类型。图 12.4](#c12.xhtml_figure12-4\
  \ 显示了一小部分记录。\n\n![image](img/c12f004.jpg)\n\n目标观察预测变量能够很好地用于正确分类受伤类型。为了评估这一点，抽取了\
  \ 1000 条记录并分为训练集和验证集，然后在训练数据上进行了判别分析。输出结构与二分类情况非常相似。唯一的区别是每个记录现在有三个分类函数（每个受伤类型一个），且混淆矩阵和误差矩阵是\
  \ 3 × 3 的，以考虑到所有正确和错误的分类组合（见表 12.3](#c12.xhtml_table12-3)）。分类规则仍然是将记录分类为具有最高相应分类数的类别。分数像之前一样使用分类函数系数计算。可以在表\
  \ 12.4](#c12.xhtml_table12-4)中看到。例如，训练集中第一起事故的 `no-injury` 分类分为 `- 24.51 + (1.95)(1)\
  \ + (1.19)(0) + ⋅⋅⋅ + (16.36)(1) = 31.42`。`nonfatal` 分数同样计算为 30.93，`fatal` 分数为 25.94。由于\
  \ `no-injury` 分数最高，这起事故被（正确地）分类为无受伤。```\n 产生线性判别分析评分和倾向性的代码\n```\n\n\n\n\n```\n\
