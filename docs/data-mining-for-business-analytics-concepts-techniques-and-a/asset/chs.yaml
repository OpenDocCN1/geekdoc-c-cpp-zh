  \ | 4818 | 2992 | 2 | 8 | 4 | 2 | 0 | 1 | 0 | 无 |\n\n### 表 2.2 West Roxbury 房屋价值数据集前\
  \ 10 条记录\n\n正如我们之前看到的，在标题行下方，数据中的每行都代表一栋房屋。例如，第一栋房屋的估值总额为 344.2 千美元（`TOTAL VALUE`）。其税单为\
  \ $4330。它的占地面积为 9965 平方英尺（`ft²`），建于 1880 年，有两层，六个房间等等。\n\n### 在 R 中加载和查看数据\n\n要将数据加载到\
  \ R，我们通常希望数据以 `csv`（逗号分隔值）文件的格式可用。如果数据在 `xls`（或 `xlsx`）文件中，我们 Excel 中将该文件另存为 `csv`\
  \ 文件：点击文件 > 另存为 > 保存为类型：CSV (逗号分隔) (`*.csv`) > 保存。\n\n**注意：** 在 Excel 中处理 `.csv`\
  \ 文件时，请注意以下两点：\n\n*   在 Excel 中打开 `.csv` 文件会去掉开头的数字 0，这会导致邮政编码数据损坏。\n*   在 Excel\
  \ 中保存 `.csv` 文件只会保存显示的数字；如果你需要特定的小数位精度，则需要确保在保存之前已显示了这些位数。\n\n一旦我们的机器上安装了 R 和 RStudio，并将\
  \ `West Roxbury.csv` 文件保存为 `csv` 文件，我们就可以运行表 2.3 中的代码将数据加载到 R 中。\n\n```\n首先，打开 RStudio，点击文件\
  \ > 新建文件 > R 脚本。这将打开一个新标签页。\n然后将你的 Untitled1.R 文件保存到 csv 文件所在的目录。将其重命名为 WestRoxbury.R。\n\
  从菜单栏，进入会话 > 设置工作目录 > 到源文件所在位置；这将工作目录设置为 R 文件和 csv 文件所在的位置。\n\n从数据中加载并创建子集的代码\n```\n\
  \n```\nhousing.df <- read.csv(\"WestRoxbury.csv\", header = TRUE)  # 加载数据\ndim(housing.df)\
  \  # 数据框的维度\nhead(housing.df)  # 显示前六行\nView(housing.df)  # 在新标签页中显示所有数据\n\n###\
  \ 显示数据的不同子集\nhousing.df[1:10, 1]  # 仅显示第一列的前 10 行\nhousing.df[1:10, ]  # 显示每列的前\
  \ 10 行\nhousing.df[5, 1:10]  # 显示前 10 列的第五行\nhousing.df[5, c(1:2, 4, 8:10)]  # 显示某些列的第五行\n\
  housing.df[, 1]  # 显示整个第一列\nhousing.df$TOTAL_VALUE  # 显示整个第一列的另一种方法\nhousing.df$TOTAL_VALUE[1:10]\
  \  # 显示第一列的前 10 行\nlength(housing.df$TOTAL_VALUE)  # Find 第一列的长度\nmean(housing.df$TOTAL_VALUE)\
  \  # 计算第一列的平均值\nsummary(housing.df)  # 计算每列的统计摘要\n```\n\n### 表 2.3 在 R 中处理文件\n\n\
  来自 `csv` 文件的数据在 R 中被存储为数据框（例如 `housing.df`）。\n\n### 从数据库采样\n\n在处理大型数据集时，通常需要处理数据的子集以节省内存或处理时间。\n\
  \n```\n# 采样和欠采代码\n```\n\n### 分类中的稀有事件过采样\n\n如果我们感兴趣的分类事件是稀缺的，例如对邮件响应并购买的客户，或欺诈信用卡交易，随机采样产生的事件（例如购买）可能太少，以至于我们没有足够的信息。我们将获得大量非购买者和非欺诈交易的数据，但可用于建立模型的数据却很少。在这种情况下，我们希望采样程序相对于多数类来加权考虑稀有类（购买者或欺诈者），以便我们的样本最终包含健康的补充数据。\n\
  \n```\n### 随机采样 5 个\ns <- sample(row.names(housing.df), 5)\n\n### 过采样 10 个\ns <-\
  \ sample(row.names(housing.df), 5, prob = ifelse(housing.df$ROOMS>10, 0.9, 0.01))\n\
  housing.df[s]\n```\n\n\n\n\n变量有多种分类方法。变量可以是数值型，也可以是文本（字符/字符串）。它们可以是连续型（可以假设为任意实数值，通常在给定范围内）、整数型（仅取整数值）、分类型（假设为有限数量中的某一个）或日期型。分类变量可以编码为数值（1,\
  \ 2, 3）或文本（即时付款、非即时付款、已破产）。分类变量可以是无序的（称为`名义变量`），具有如北美、欧洲和亚洲等类别；也可以是有序的（称为`序数变量`），具有如高值、低值和无值等类别。\n\
  \n连续型变量可以由大多数数据挖掘程序处理，但朴素贝叶斯分类器除外，该分类器专门处理分类预测变量。数据挖掘的机器学习根源于解决分类结果的问题；而统计学的根源源于对连续变量的分析。有时，将连续变量转换为分类变量是有意义的。这通常发生在结果变量的情况下，将数值变量映射到一个决策上（例如，信用评分超过某个阈值意味着“授予信贷”，医疗检测结果超过某个阈值意味着“开始治疗”）。\n\
  \n对于 West Roxbury 数据，表 2.5 展示了一些 R 语句，用于查看变量并确定 R 认为它们是什么类型（类），并确定因子变量中的层级数量。\n\n\
  ```\ncode for reviewing variables\n```\n\n```\nnames(housing.df)  # 在屏幕打印变量列表。\n\
  t(t(names(housing.df)))  # 以有用的列格式打印列表\ncolnames(housing.df)[1] <- c(\"TOTAL_VALUE\"\
  )  # 修改第一列名称\nclass(housing.df$REMODEL) # REMODEL 是一个因子变量\nclass(housing.df[ ,14])\
  \ # 同样\nlevels(housing.df[, 14])  # 它可以取三个层级之一\nclass(housing.df$BEDROOMS)  # BEDROOMS\
  \ 是一个整数变量\nclass(housing.df[, 1])  # Total_Value 是一个数值变量\n```\n\n部分输出\n```\n> t(t(names(housing.df)))\n\
  \      [,1]         \n [1,] \"TOTAL_VALUE\"\n [2,] \"TAX\"        \n [3,] \"LOT.SQFT\"\
  \   \n [4,] \"YR.BUILT\"   \n [5,] \"GROSS.AREA\" \n [6,] \"LIVING.AREA\"\n [7,]\
  \ \"FLOORS\"     \n [8,] \"ROOMS\"      \n [9,] \"BEDROOMS\"\n[10,] \"FULL.BATH\"\
  \n [11,] \"HALF.BATH\"\n [12,] \"KITCHEN\" \n [13,] \"FIREPLACE\"\n[14,] \"REMODEL\"\
  \n\n> class(housing.df$REMODEL)\n[1] \"factor\"\n\n> levels(housing.df[, 14])\n\
  [1] \"None\"   \"Old\"    \"Recent\"\n```\n\n表 2.5 在 R 中查看变量\n\n### 处理分类变量\n\n分类变量也可以由大多数数据挖掘程序处理，但通常需要特殊处理。如果分类变量是有序的（年龄组、信用信誉程度等），我们有时可以将类别编码为数值（1,\
  \ 2, 3, ...），并将该变量像连续型变量一样处理。类别越少，且它们代表的等值增量越小，这种方法就越变得棘手，但它通常效果尚可。\n\n然而，名义分类变量通常无法直接使用。在许多情况下，它们必须被分解为一系列二进制变量，称为`哑变量`（dummy\
  \ variables）。例如，一个可能具有“学生”、“失业”、“已就业”或“退休”等可能值的单一分类变量将拆分为四个独立的哑变量：\n\n> *学生*—是/否\n\
  \n> *失业*—是/否\n\n> *已就业*—是/否\n\n> *退休*—是/否\n\n\n\n\n\n即使在我们拥有充足的数据时，也有充分的理由密切关注模型包含的变量。应该咨询具有领域知识（即对业务流程和数据的了解）的人员，因为了解变量代表的含义通常对于构建良好的模型和避免错误至关重要。例如，假设我们正尝试预测客户的总支出金额，而我们有几个编码为\
  \ `X[1]`、`X[2]`、`X[3]`、……的预测列，但我们并不知道这些代码的含义。我们可能会发现 `X[1]` 是总支出金额的极佳预测因子。然而，如果我们发现\
  \ `X[1]` 是运费，且是按购买金额的百分比计算的，那么显然，使用运费的模型无法用于预测购买金额，因为运费在交易完成之前是未知的。另一个例子是，如果我们正尝试在客户申请贷款时预测贷款违约情况。如果我们的数据集仅包含已批准贷款申请的信息，那么我们将无法获得在被拒绝的申请者中如何区分违约者和非违约者的信息。因此，仅基于已批准贷款的模型无法预测申请时的违约行为，而只能在贷款获批后进行预测。\n\
  \n### 离群值 (Outliers)\n\n我们处理的数据越多，遇到由于测量误差、数据录入错误等导致的错误值的概率就越大。如果错误值与其余数据处于同一范围，它可能是有无害的。如果它远超出其余数据的范围（例如，小数点位置错误），它可能会对我们计划使用的某些数据挖掘程序产生重大影响。\n\
  \n远离大部分数据的值被称为 `outliers`（离群值）。`far away`（远离）这个词被刻意留得模糊，因为什么是或不是离群值是一个主观决定。分析师会使用诸如经验法则，例如“任何距离均值超过三个标准差的数值都是离群值”，但没有任何统计规则可以告诉我们这样的离群值是否是错误的结果。从统计学意义上说，离群值并不一定是无效的数据点，它只是一个遥远的点。\n\
  \n识别离群值的目的通常是引起对需要进一步审查的关注。我们可能会通过观察数据得出解释——在小数点位置错误的情况下，这很有可能。我们可能没有解释，但知道该值是错误的——例如，病人的体温\
  \ `178°F`。或者，我们可能会认为该值在可能范围内并对其置之不理。这些判断最好由具有 `domain knowledge`（领域知识，即对所考虑的特定应用的知识，如直邮、抵押贷款融资等）的人来做出，而不是基于统计或数据挖掘程序的专业知识。统计程序除了将记录标记为需要审查的内容之外，几乎做不了什么。\n\
  \n如果人工审查可行，则可以识别并修正某些离群值。在任何情况下，如果带有离群值的记录数量非常少，它们可能会被视为缺失数据。我们如何检查离群值呢？一种技术是按第一列对记录进行排序（例如使用\
  \ R 函数 `order()`，然后检查该列中非常大或非常小的值），然后对每个后续列重复此操作。另一种方案是使用 R 的 `min()` 和 `max()`\
  \ 函数检查每列的最小值和最大值。对于一种将每个记录视为一个单元而非孤立地考虑每列的更自动化方法，可以使用聚类技术（见第 14 章）来识别与其他记录远离的一个或几个记录簇。然后可以对这些记录进行检查。\n\
  \n### 缺失值 (Missing Values)\n\n通常，某些记录将包含缺失值。如果包含缺失值的记录较少，这些记录可能会被省略。然而，如果我们有大量变量，即使是极小比例的缺失也会影响大量记录。即使只有\
  \ 30 个变量，如果只有 5% 的值缺失（在案例和变量之间随机且独立地分布），几乎 80% 的记录将不得不从分析中删除。（给定记录逃避缺失值的概率为 `0.95³⁰\
  \ = 0.215`。）\n\n省略带有缺失值的记录的另一种替代方案是根据所有记录中该变量的其他值，用插补值替换缺失值。例如，如果 30 个变量中，某个记录的家庭收入缺失，我们可能会用所有记录的平均家庭收入来代替。当然，这样做不会增加任何关于家庭收入如何影响结果变量的信息。它只是允许我们继续分析，而不会丢失该记录中其他\
  \ 29 个变量包含的信息。注意，使用这种技术会低估数据集中的变异性。然而，我们可以使用验证数据评估变异性和数据挖掘技术的性能，因此这并不一定构成主要问题。一种方案是使用相当简单的替代品（如平均值、中位数）替换缺失值。确实存在更复杂的程序——例如，基于其他变量使用线性回归来填充缺失值。这些方法主要针对医学和科学研究的分析进行了详述，在这些研究中，每个患者或对象的记录成本很高。在数据通常充足的数据挖掘中，简单的方法通常足够了。Table\
  \ 2.7 显示了一些 R 代码，说明了使用中位数替换缺失值。由于数据本身是完整的，第一步是为了说明目的而人为创建了一些缺失记录。使用中位数而非平均值进行插补，是为了保留卧室数量的整数性质。\n\
  \n```r\n### 使用中位数插补缺失数据的代码\n### 为了说明缺失数据，我们首先人为将一些条目转换为 NA\nrows.to.missing <- sample(row.names(housing.df),\
  \ 10)\nhousing.df[rows.to.missing]$BEDROOMS <- NA\n\n### 现在有 10 个 NA，剩余值的中位数是 3。\n\
  ### 使用 median() 并配合 na.rm = TRUE 来忽略缺失值\n### 计算中位数\nhousing.df[rows_to_missing]$BEDROOMS\
  \ <- median(housing.df$BEDROOMS, na.rm = TRUE)\n\nsummary(housing.df)\n```\n\n```text\n\
  Partial Output\n > housing.df[rows.to.missing]$BEDROOMS <- NA\n> summary(housing.df$BEDROOMS)\n\
  \   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.    NA's \n   1.00    3.00    3.00\
  \    3.23    4.00    9.00      10 \n\n > housing.df[rows.to.missing]$BEDROOMS <-\
  \ median(housing.df$BEDROOMS, na.rm = TRUE)\n> summary(housing.df$BEDROOMS)\n  \
  \ Min. 1st Qu.  Median    Mean 3rd Qu.    Max. \n   1.00    3.00    3.00    3.23\
  \    4.00    9.00 \n```\n\n**Table 2.7**缺失数据\n\n某些数据集包含具有大量缺失值的变量。也就是说，某项测量在大量记录中都是缺失。在这种情况下，删除带有缺失值的记录会导致大量数据丢失。插补缺失值也可能是没用的，因为插补是基于少数现有记录的。另一种方案是检查预测因子的重要。如果它不是非常关键，就可以丢弃。如果它很重要，也许可以使用缺失值较少的代理变量来代替。当这种预测因子被认为是核心时，最佳解决方案是投入资金获取缺失的数据。\n\
  \n\n\n\n处理缺失数据可能需要大量时间，因为并非所有情况都能通过自动化解决方案解决。例如，在混乱的数据集中，“0”可能代表两种含义：(1) 数值缺失；(2)\
  \ 数值实际上为零。在信贷行业中，`past due`（逾期）变量中的“0”可能意味着客户已全额付清，也可能意味着客户完全没有信用记录——这是两种截然不同的情况。对于特定案例，可能需要人工判断或为了制定特殊规则来处理该情况。\n\
  \n## 数据的归一化（标准化）与重缩\n\n某些算法要求在有效实施算法之前对数据进行归一化。要对变量进行归一化，我们需要从每个值中减去平均值，然后除以标准差。这种操作有时称为\
  \ `standardizing`（标准化）。在 R 语言中，函数 `scale()` 可执行此操作。实际上，我们将每个值表示为“距离均值的标准差倍数”，称为\
  \ `z-score`。\n\n归一化是将所有变量带到相同尺度的一种方法。另一种流行的方法是将每个变量重缩放到 `[0,1]` 尺度。这是通过减去最小值然后除以极差来实现的。去最小值会将变量原点移到零。除以极差则缩小或扩大数据到\
  \ `[0,1]` 范围。在 R 中，可以使用 `scales` 包中的 `rescale()` 函数进行重缩。\n\n为了理解为什么需要归一化或缩放至 `[0,1]`，可以考虑聚类的情况。聚类通常涉及计算距离量，反映每条记录距离聚类中心或其他记录有多远。对于多个变量，会使用不同的单位：天、美元、计数等。如果美元是以千为单位，而其他都是是以十为单位，那么美元变量将主距离量。此外，改变单位（例如从天改为小时或月份）可能会完全改变结果。\n\
  \n数据挖掘软件通常在可能需要归一化的算法中提供归一化数据的选项。这是一种选项而非此类算法的自动功能，因为在某些情况下，我们希望每个变量根据其原始尺度比例地对距离量做出贡献。\n\
  \n## 2.5 预测能力与过拟合\n\n在监督学习中，出现了一个关键问题：当我们把预测或分类模型应用于新数据时，它的表现如何？我们特别关注比较各种模型的性能，以便选择我们认为在实践中表现最好的模型。一个核心概念是确保我们所选的模型能够泛化到现有数据集之外。为了确保泛化，我们使用\
  \ `data partitioning`（数据划分）的概念并尝试避免 `overfitting`（过拟合）。这两个重要概念将在下文中描述。\n\n### 过拟合\n\
  \n模型中包含的变量越多，对建模数据数据过拟合的风险就越大。什么是过拟合？\n\n在表 2.8 中，我们展示了关于某时期广告支出和随后时期销售量的假设数据。数据的散点图见图\
  \ 2.2。我们可以用一个平滑但复杂的函数来连接这些点，该函数完美地插值所有数据点且不留任何误差（残差）。这可以在图 2.3 中看到。然而，我们可以看到，这种曲线在根据广告支出预测未来销售方面不太可能准确，甚至有用。例如，很难相信支出从\
  \ 400 美元增加到 500 美元真的会减少收入。\n\n![图显示了从 0 到 1000 的支出与从 0 到 1600 的收入对比图。](img/c02f002.jpg)\n\
  \n**图 2.2** 广告和销售数据的散点图\n\n![图显示了从 0 到 1000 的支出与从 0 到 1600 的收入对比图，并有穿过点的线。](img/c02f003.jpg)\n\
  \n**图 2.3** 过拟合：该函数无误差拟合数据\n\n| **广告** | **销售** |\n| --- | --- |\n| 239 | 514 |\n\
  | 364 | 789 |\n| 602 | 550 |\n| 644 | 1386 |\n| 770 | 1394 |\n| 789 | 1440 |\n|\
  \ 911 | 1354 |\n\n**表 2.8**\n\n建立模型的基本目的是表示变量之间的关系，使得这种表示能够根据未来的预测变量值很好地预测未来的结果值。当然，我们希望模型能够很好地描述我们现有的数据，但我们更感兴趣的是在未来数据上的表现。\n\
  \n在假设的广告示例中，在根据广告预测未来销售方面，一条简单的直线可能比复杂的函数表现更好。相反，我们设计了一个完美拟合数据的复杂函数，并在此过程中过度追求了。我们最终模拟了数据中的某些变化，而这些变化仅仅是随机波动。我们将数据中的噪声误为了信号。\n\
  \n同样，我们可以向模型中添加预测变量，以提高其对手头数据的处理性能。考虑一个包含 100 个人的数据库，其中有一半人捐赠过。关于收入、家庭规模和邮编的信息可能很好地预测某人是否是捐赠者。如果我们不断添加预测变量，可以提高模型对数据的性能，并将错误率降低到可以忽略的水平。然而，这种低错误率是误导性的，因为它可能只适用于这\
  \ 100 个人，而不能泛化到其他。\n\n例如，变量之一可能是身高。我们从理论上没有理由认为高个子捐捐更多或更少，但如果我们的样本中有几个高个子且他们恰好捐赠了慈善，我们的模型可能会包含一个身高项——你越高，捐赠得越多。当然，当该模型应用于额外数据时，这可能不是一个好的预测器。\n\
  \n如果数据集并不比预测变量的数量大，这种虚假关系很可能会进入模型。继续我们的慈善例子，在一个小样本中，只有少数是高个子，无论高个子的贡献水平如何，算法都倾向于将其归因于身高。如果数据集相对于预测变量非常大，这种情况就不可能发生。在这种情况下，每个预测变量都必须帮助预测大量情况的结局，因此它所起的作用不再仅仅取决于少数案例，这些案例可能是巧合。\n\
  \n\n\n\n后者对于某些技术（如树和神经网络）来说是一个尤为严重的问题，这些技术没有对数据施加线性或其他结构，从而导致了过拟合。\n\n为了解决过拟合问题，我们简单地将数据进行划分（分区），并仅使用其中一个划分来开发模型。得到模型后，我们会在另一个划分上进行测试并观察其性能，我们可以通过多种方式对其进行衡量。在分类模型中，我们可以计算被留存记录中被分类错误的记录比例。在预测模型中，我们可以衡量预测值与实际值之间的残差（预测误差）。这种评估方法实际上模拟了部署场景，即我们的模型被应用到它未“见过”过的数据上。\n\
  \n我们通常处理两个或三个划分：训练集、验证集，有时还包括一个额外的测试集。将数据划分为训练集、验证集和测试集既可以根据预设的比例随机进行，也可以根据某些相关变量指定哪些记录进入哪个划分（例如，在时间序列预测中，数据根据时间顺序进行划分）。在大多数情况下，应该随机进行划分，以最小化获得有偏性划分的概率。请注意命名上的差异——训练划分几乎总是被称为“training”，但其他划分的名称可能会不同且重叠。\n\
  \n### 训练划分 (Training Partition)\n训练划分是最大的划分，包含了构建我们正在研究的各种模型的数据。同一个训练划分通常用于开发多个模型。\n\
  \n### 验证划分 (Validation Partition)\n验证划分（有时被称为 `test partition`）用于评估每个模型的预测性能，以便你可以比较模型并选择最佳的一个。在某些算法（例如，分类和回归树、`k`-最近邻）中，验证划分可以以自动的方式用于调优和改进模型。\n\
  \n### 测试划分 (Test Partition)\n测试划分（有时被称为 `holdout` 或 `evaluation partition`）用于通过新数据评估所选模型的性能。\n\
  \n为什么既要有验证划分又有测试划分呢？当我们使用验证数据来评估多个模型，然后选择在验证数据上表现最好的模型时，我们再次遇到了过拟合问题的另一个（较小的）方面——验证数据中的随机特征，这些特征恰好比与其他模型更契合所选的模型。换句话说，通过使用验证数据从几个模型中选择一个模型，所选模型在验证数据上的表现将过于乐观。\n\
  \n增强所选模型表现性能的验证数据的随机特征，可能不会出现在模型应用的新数据中。因此，我们可能高估了模型的准确性。我们测试的模型越多，其中一个模型就越有可能对验证数据中的噪声建模得特别有效。将模型应用到它以前未见过的测试数据，将为该模型在新数据上的表现如何提供一个无偏的估计。图\
  \ 2.4 显示了三个数据划分及其在数据挖掘过程中的用途。当我们主要关注寻找最佳模型，而较少关注其具体表现如何时，我们可能只使用训练划分和验证划分。表 2.9\
  \ 显示了使用 R 代码将 West Roxbury 数据划分为两组（训练集和验证集）或三组（训练集、验证集和测试集）。这样做的方法是首先随机抽取记录到训练集，然后将剩余记录分配为验证集。在三个划分的情况下，验证记录是在排除已采样到训练集的记录后，从数据中随机选择的。\n\
