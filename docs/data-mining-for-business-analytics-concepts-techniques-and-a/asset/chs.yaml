  \ Catalog Alliance）。\n\n## 21.4 政治说服\n\n`Voter-Persuasion.csv` 是本案例研究的数据集。\n\n**注：**\
  \ 我们感谢 Ken Strasma，HaystaqDNA 总裁以及 2004 年凯里竞选和 2008 年奥巴马竞选的定位总监，他为本案例提供了数据，并在下文中分享了相关信息。\n\
  \n### 背景\n\n当你考虑到政治说服时，可能会想到政治竞选活动所做的努力，即说服你他们的候选人比另一位更好。事实上，竞选活动与其说是说服人们改变主意，不如说是说服那些同意你观点的人真正去投票。预测分析现在在这项工作中发挥着巨大的作用，但在\
  \ 2004 年，它还是政治工具箱中的新成员。\n\n### 预测分析进入美国政坛\n\n2004 年 1 月，美国总统竞选的候选人正在爱荷华州党团中进行竞争，这是漫长的各州初选竞选的一部分，最终将选出共和党和民主党的总统候选人。在民主党人中，霍华·迪恩在全国民意调查中领先。然而，爱荷华州党团是一个复杂且密集的过程，只吸引最有投入和最感兴趣的选民。参与者并不是全国选民的代表性样本。对计划参加的人进行的调查显示，迪恩与约翰·凯里在内的三位其他候选人竞争激烈。\n\
  \n凯里最终以出人意的大优势获胜，这种超出预期的表现归于他的竞选活动创新性且成功地使用了预测分析，以更多地了解个人选民可能的行为。这使得竞选活动能够针对选民进行定位，从而优化党团中的表现。例如，一旦模型显示某个选区的支持率足以赢得该选区的党团代表，资金和时间就可以被重新分配到竞争更激烈的其他选区。\n\
  \n### 政治定位\n\n政治中对选民的定位并不新鲜。传统上有三种形式：\n\n- 地理定位\n- 人口统计定位\n- 个人定位\n\n在地理定位中，根据先前的投票模式或揭示该地理单元政治倾向的调查，将资源导向地理单元——州、市、县等。然而，它有显著的局限性。如果一个县只有\
  \ 52% 的人支持你，它可能是最需要关注的，但如果信息发送给该县的每个人，那么近一半的信息是发送给了错误的人。\n\n在人口统计定位中，信息针对人口统计群体——例如，老年选民、年轻女性选民、西班牙裔选民等。这种方法的局限性是它往往难以实施——很难将信息仅传递给单一的人口群体。\n\
  \n传统的个人定位是最有效的定位形式，它是基于询问选民计划如何投票的调查。这种方法的巨大局限性在于成本。通过电话或上门调查接触所有选民的费用可能是令人望而的。\n\
  \n预测分析的使用增加了个人定位方法的力量并降低了成本。模型允许预测推广到整个选民群体，而不仅仅是接受过调查的人群，并利用了丰富的信息。地理和人口统计数据仍然是画面的一部分，但它们是在个人层面使用的。\n\
  \n### 提升（Uplift）\n\n在营销的经典预测模型应用中，会选择数据样本并提供优惠（例如在网络上）或发送信息（例如通过邮件），并开发一个预测模型将个人分类为响应者或非响应者。然后将该模型应用于新数据，计算响应倾向，根据响应倾向对个人进行排序，营销人员随后就可以选择最可能对邮寄或优惠做出反应的人。\n\
  \n这种经典方法缺少了一些关键信息：在没有优惠或邮件的情况下，个人会如何反应？高倾向客户是否可能无论是否有优惠都倾向于购买？一个人的购买倾向是否实际上会因为优惠的出现而减少？提升建模（见第\
  \ 13 章）允许我们在个人层面估算“有优惠 vs  无优惠”或“有邮寄 vs. 无邮寄”的效果。\n\n在本案例中，我们将提升建模应用到真实的选民数据上，这些数据已经通过一项假设实验的结果进行了增强。该实验包括以下步骤：\n\
  \n1. 对选民进行预调查，以确定他们投票给民主党的意愿。\n2. 将选民随机分为两个样本——控制组和实验组。\n3. 向实验组寄发一份宣传民主党候选人的传单。\n\
  4. 对对选民进行另一次调查，以确定他们投票给民主党的意愿。\n\n### 数据\n\n本案例的数据位于 `Voter-Persuasion.csv` 文件中。目标变量是\
  \ `MOVED_AD`，其中 1 = “观点倾向于民主党候选人”，0 = “观点没有倾向于民主党候选人”。该变量封装了预调查和事后调查的信息。重要的预测变量是\
  \ `Flyer`，这是一个二值变量，表示选民是否收到了传单。此外，还有来自以下来源的许多其他预测变量：\n\n1. 政府选民文件\n2. 政党数据\n3. 商业消费者和人口统计数据\n\
  4. 人口普查社区数据\n\n政府选民文件经过维护并公开，以确保投票过程的完整性。它们包含了身份识别所需的本质数据，如姓名、地址和日期。本案例使用的文件还包含党派身份（如果某个州限制政党初选仅限该政党的选民参加，则需要）。政党还在选举期间派遣自己的观察员，记录个人是否参加了投票。这些数据（在案例中被称为“派生数据”）由各政党维护和整理，并可以根据姓名匹配到选民数据。社区级的人口统计数据可以从人口普查获得，并可以通过地址添加到选民数据中。消费者和额外的人口统计数据（习惯、教育）可以从营销公司购买，并通过地址匹配添加到选民数据中。\n\
  \n### 任务\n\n本案例的任务是开发一个预测每位选民提升率的模型。提升定义为转向民主党观点倾向的增加。首先，查看 `Voter-Persuasion.csv`\
  \ 中的变量，并了解它们可能来自哪些数据源。然后，回答以下问题并执行指示的任务：\n\n1. 总体而言，传单在引导选民转向民主党方面表现如何？（比较收到传单的人和未收到传单的人的目标变量。）\n\
  2. 使用数据可视化探索数据，以更多地了解预测变量与 `MOVED_AD` 之间的关系。哪些预测变量似乎具有良好的预测潜力？展示支持性的图或表。\n3. 使用数据集中的划分变量对数据进行划分，对预测变量的包含做出决策，并相应拟合三个预测模型。对于每个模型，给出关于用方法、参数和预测变量的足够细节，以便你的结果可以被重复。\n\
  \n\n\n\n\n4. 在你的三个模型中，根据预测能力选择最最好的一个。模型是哪一个？你为什么选择它？\n\n5. 使用你选择的模型，报告验证集中前三条记录的倾向（propensities）。\n\
  \n6. 创建一个与 `Flyer` 相反的衍生变量，命名为 `Flyer-reversed`。使用你选择的模型，用 `Flyer-reversed` 变量作为预测因子（而非\
  \ `Flyer`）对验证数据进行重新评分。报告验证集中前三条记录的倾向。\n\n7. 对于每条记录，提升率（uplift）基于以下差异计算：\n\n`P(success\
  \ | Flyer = 1) − P(success | Flyer = 0)`\n\n计算验证集中每位选者的提升率，并报告前三条记录的提升率。\n\n8. 如果一项营销活动的资源仅够向\
  \ 10% 的选者邮寄传单，应该使用什么种提升率阈值？\n\n## 21.5 出租车取消\n\n`Taxi-cancellation-case.csv` 是本案例研究的数据集。\n\
  \n### 业务背景\n\n2013 年底，印度班加尔的出租车公司 `Yourcabs.com` 面临着司机使用平台的问题——并非所有司机都会按照预约的订单出现。司机会取消对订单的接受，如果取消时没有充分通知，客户就会被耽误甚至被放鸽。\n\
  \n班加罗尔是印度的关键技术中心，技术正在改变出租车行业。`Yourcabs.com` 拥有一个在线预订系统（尽管客户也可以打电话），并将自己定位为出租车预订门户。Uber\
  \ 共享乘车服务于 2014 年年中在班加罗尔开始运营。\n\n`Yourcabs.com` 收集了 2011 年至 2013 年的预订数据，并与印度管理学院合作在\
  \ Kaggle 上发布了一项竞赛，看看他们能从出租车取消问题中学到什么。\n\n本案例提供的数据是原始数据的随机抽取的子集，包含 10,000 行，每行代表一次订单。共有\
  \ 17 个输入变量，包括用户（客户） ID、车辆型号、是否通过在线或移动应用进行预订、旅行类型、预订包类型、地理信息以及计划行程的日期和时间。感兴趣的目标变量是行程是否取消的二分类指标。总体取消率在\
  \ 7% 到 8% 之间。\n\n### 作业\n\n1. `Yourcabs.com` 如何使用基于这些数据建立预测模型？\n\n2. `Yourcabs.com`\
  \ 如何使用画像分析模型（识别区分已取消/未取消行程的预测因子）？\n\n3. 探索、准备并转换数据以促进预测建模。这里是一些提示：\n\n   * 在探索性建模中，尽快建立一个至少是初始模型，而不必解决所有数据准备问题，是有用的。一个例子是\
  \ GPS 信息——其他地理信息是可用，因此你可以推迟如何解释/使用 GPS 信息的挑战。\n\n** 你将如何处理缺失数据，例如指示为 `NULL` 的情况？\n\
  \n   * 思考日期时间字段（预订时间戳和行程时间戳）可能包含哪些有用信息。数据文件包含一个工作表，提供了如何从日期/时间字段中提取特征的提示。\n\n  \
  \ * 还要考虑分类变量以及如何处理它们。我们应该将它们全部转换为虚拟变量（dummies）吗？还是只使用一部分？\n\n4. 拟合你选择的几个预测模型。它们是否提供了关于预测变量与取消之间如何关系的信息？\n\
  \n5. 以错误率（混淆矩阵）报告你的模型预测性能。模型表现如何？该模型在实践中可以使用吗？\n\n6. 从排名（提升度 lift）的角度检查你模型的预测性能。模型表现如何？该模型在实践中可以使用吗？\n\
  \n## 21.6 沐浴皂消费者细分\n\n`BathSoap.csv` 是本案例研究的数据集。\n\n### 业务背景\n\nCRISA 是一家亚洲市场研究机构，专门负责追踪消费品（包括耐用和非耐用消费）的消费者购买行为。在一个大型研究项目中，CRISA\
  \ 追踪了许多消费品类别（例如“洗涤剂”），并且在每个类别中可能有几十个品牌。为了追踪购买行为，CRISA 在印度 100 多个城市和城镇组成了家庭小组，涵盖了印度大部分城市市场。这些家庭是使用分层抽样精心选择的以确保样本的代表性；这里分析了\
  \ 600 条记录的子集。分层是根据社会经济地位和市场（城市集合）定义的。\n\nCRISA 同时拥有交易数据（每行是一笔交易）和家庭数据（每行是一个家庭），对于家庭数据，它维护以下信息：\n\
  \n* 家庭的人口统计信息（每年更新）\n* 耐用品拥有情况（汽车、洗衣机等，每年更新；根据这些信息计算出一个“富裕指数”）\n* 产品类别和品牌的购买数据（每月更新）\n\
  \nCRISA 有两类客户：(1) 订阅数据库服务的广告代理，他们每月获得更新的数据，并使用这些数据为自己的客户提供广告和促销策略建议；(2) 消费品制造商，他们使用\
  \ CRISA 数据库监控自己的市场份额。\n\n### 关键问题\n\nCRISA 传统上根据购买者的人口统计进行市场细分。他们现在想根据两组与购买过程和品牌忠诚度相关的变量进行市场细分：\n\
  \n1. 购买行为（数量、频率、对折扣的敏感度和品牌忠诚度）\n2. 购买依据（价格、销售主张）\n\n这样做可以让 CRISA 获取有关哪些人口统计属性与不同的购买行为和忠诚度相关的信息，从而更有效地部署促销预算。更有效的市场细分将使\
  \ CRISA 的客户（在本例中是一家名为 IMRB 的公司）能够针对合适的细分群体设计更具成本效益的促销活动。因此，可以在不同的时间针对不同的群体启动多次促销。这将使促销预算更有效益地分配到不同的细分群体。它还能让\
  \ IMRB 设计更有效的客户奖励系统并增加忠诚度。\n\n### 数据\n\n表 21.8 中的数据描述了每个家庭，每行包含一个家庭的数据。\n\n| 变量类型\
  \ | 变量名称 | 描述 |\n| --- | --- | --- |\n| 成员 ID | Member id | 每个家庭的唯一标识符 |\n| 人口统计\
