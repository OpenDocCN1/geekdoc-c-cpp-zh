  \ -0.0031\n\n\n\n\n在本章中，我们将讨论如何评估数据挖掘方法的预测性能。我们指出了对训练数据过拟合的危险，并强调了在训练阶段未未使用的数据上测试模型性能的必要性。我们讨论了常用的性能指标。对于预测任务，指标包括`Average\
  \ Error`（平均误差）、`MAPE` 和 `RMSE`（基于验证数据）。对于分类任务，基于混淆矩阵的指标包括总体准确率、特异性和灵敏度，以及考虑误分类成本的指标。我们还展示了截断值选择与分类性能之间的关系，并介绍了`ROC\
  \ 曲线`，这是一种用于评估不同截断值下方法性能的常用图表。当目标是准确分类最感兴趣或最重要的记录（称为`排序`），而不是准确分类整个样本时（例如，最可能响应优惠的\
  \ 10% 客户，或最可能欺诈的 5% 索赔），则使用提升图（lift charts）来评估性能。我们还讨论了对稀有类进行过采样的必要性，以及如何针对过采样调整性能指标。最后，我们提到了将基于验证数据的指标与基于训练数据的指标进行比较以检测过拟合的用途。虽然预计会有某些差异，但极端差异可能表明存在过拟合。\n\
  \n## 5.1 引言\n\n在监督学习中，我们对预测新记录的结果变量感兴趣。感兴趣的三类主要结果有：\n\n* **预测的数值**：当结果变量为数值型时（例如房价价格）\n\
  * **预测的类别归属**：当结果变量为类别型时（例如，买家/非买家）\n* **倾向 (Propensity)**：当结果变量为类别型时，属于某一类别的概率（例如违约倾向）\n\
  \n预测方法用于生成数值预测，而分类方法（“分类器”）用于生成倾向，通过对倾向使用截断值，我们可以生成预测的类别归属。\n\n需要记住的一个细微差别是分类器的两种不同预测用途：其中一种用途是`分类`，旨在预测新记录的类别归属；另一种用途是`排序`，即在一组新记录中检测出最可能属于感兴趣类别的记录。\n\
  \n现在让我们检查判断用于生成数值预测的预测方法（第 5.3 节）、用于分类的分类器（第 5.8 节）以及用于排序的分类器（第 5.19 节）实用性的方法。在第\
  \ 5.27 节中，我们将查看过采样场景下的性能评估。\n\n## 5.2 评估预测性能\n\n首先，让我们强调预测准确率不等同于拟合优度。经典的统计性能指标旨在找到一个与训练数据拟合得良好的模型。在数据挖掘中，我们感兴趣的是在应用于*新*记录时具有高预测准确率的模型。`R²`和`估计标准误差`（standard\
  \ error of estimate）是经典回归建模中的常用指标，而残差分析用于衡量这种情况下的拟合优度。然而，这些指标并不能告诉我们模型预测新记录的能力。\n\
  \n为了评估预测性能，使用了多种衡量方法。在所有情况下，这些衡量都基于验证集，验证集比训练集是更客观的依据，用于评估预测准确率。这是因为验证集中的记录与未来要预测的记录更相似，意义在于它们未被用于选择预测变量或估计模型参数。模型在训练数据上进行训练，应用到验证数据上，然后准确率衡量将使用该验证集上的预测误差。\n\
  \n### 幼稚基准：平均值\n\n**预测中的基准标准是使用平均结果值（从而忽略了所有预测变量信息）。换句话说，对新记录的预测仅仅是训练集中记录结果值的平均值![](img/c05_ILM0001.gif)。这有时被称为幼稚基准（naive\
  \ benchmark）。一个良好的预测模型在预测准确率方面应该优于基准标准。\n\n### 预测准确率衡量\n\n记录`i`的预测误差定义为其实际结果值与预测结果值之间的差：![](img/c05_ILM0002.gif)。几个常用的预测准确率数值指标包括：\n\
  \n* **MAE**（平均绝对误差/偏差）![](img/c05_ILM0003.gif)。它给出了平均绝对误差的幅度。\n* **平均误差 (Mean Error)**![](img/c05_ILM0004.gif)。该指标与`MAE`\
  \ 类似，不同之处在于它保留了误差的符号，因此负误差会抵消相同大小的正向误差。因此，它指示了预测平均而言高估还是低估了结果变量。\n* **MPE**（平均百分比误差）![](img/c05_ILM0005.gif)。它给出了预测偏离实际值（平均）的百分比得分，并考虑了误差的方向。\n\
  * **MAPE**（平均绝对百分比误差）![](img/c05_ILM0006.gif)。该指标给出了预测（平均）偏离实际值的百分比得分。\n* **RMSE**（均方根误差）![](img/c05_ILM0007.gif)。这与线性回归中的`估计标准误差`类似，不同之处是它是基于验证数据而非训练数据计算的。它与结果变量具有相同的单位。\n\
  \n此类衡量方法可用于比较模型并评估它们的预测准确程度。注意，所有这些指标都会受到离群值的影响。要检查离群值的影响，我们可以计算基于中数的指标（并与上述基于平均的指标比较），或者简单地绘制误差直方图或箱线图。绘制误差分布实际上非常有用，可以比仅用指标突出更多信息。\n\
  \n为了说明预测准确率衡量和预测误差图的使用，请考虑表 5.1 和图 5.1 所示的误差指标和图表。这些是对二手丰田卡罗拉价格拟合特定预测模型的结果。训练集包含\
  \ 600 辆汽车，验证集包含 400 辆汽车。结果分对针对训练集和验证集显示。从对应验证集的直方图和箱线图中可以看到，大多数误差在`[-1000, 1000]`范围内，有几个较大的正（低估）误差。\n\
  \n![柱状图显示从 -10000 到 10000 对应训练（0 到 50）和验证（0 到 40），图显示了训练和验证相对于 -6000 到 4000 的情况。](img/c05f001.jpg)\n\
  \n**图 5.1** 丰田价格预测误差的直方图和箱线图，针对训练集和验证集\n\n|  \n\n```\n 用于衡量准确率的代码\n```\n\n |\n\n\
  |  \n\n\n\n\n\n```r\n # package forecast is required to evaluate performance\nlibrary(forecast)\n\
  \n### load file\ntoyota.corolla.df <- read.csv(\"ToyotaCorolla.csv\")\n\n### randomly\
  \ generate training and validation sets\ntraining <- sample(toyota.corolla.df$Id,\
  \ 600)\nvalidation <- sample(setdiff(toyota.corolla.df$Id, training), 400)\n\n###\
  \ run linear regression model\nreg <- lm(Price~., data=toyota.corolla.df[,-c(1,2,8,11)],\
  \ subset=training,\n          na.action=na.exclude)\npred_t <- predict(reg, na.action=na.pass)\n\
  pred_v <- predict(reg, newdata=toyota.corolla.df[validation,-c(1,2,8,11)],\n   \
  \               na.action=na.pass)\n\n### evaluate performance\n### training\naccuracy(pred_t,\
  \ toyota.corolla.df[training,]$Price)\n### validation\naccuracy(pred_v, toyota.corolla.df[validation,]$Price)\n\
  \nOutput\n> # training\n> accuracy(pred_t, toyota.corolla.df[training,]$Price)\n\
  \                    ME     RMSE      MAE        MPE     MAPE\nTest set -3.542119e-11\
  \ 1012.578 784.1166 -0.8180893 7.773598\n\n> # validation\n> accuracy(pred_v, toyota.corolla.df[validation,]$Price)\n\
  \                ME     RMSE      MAE       MPE     MAPE\nTest set -107.8089 1262.623\
  \ 833.3621 -2.345028 8.846669\n```\n\n| 表 5.1 丰田汽车价格模型的预测误差指标。训练集与验证集\n\n### 比较训练与验证的性能\n\
  \n基于训练集的误差告诉我们模型拟合得的情况，而基于验证集的误差（被称为“预测误差”）则衡量了模型预测新数据的能力（预测性能）。我们预期训练误差会小于验证误差（因为模型是用训练集拟合的），而且模型越复杂，它越有可能*过拟合*训练数据（表现为训练误差和验证误差之间存在较大的差异）。在过拟合的极端情况下，训练误差将为零（模型对训练数据的完美拟合），而验证误差将将是非零且不容忽视的。因此，比较训练集和验证集的误差图和指标（`RMSE`、`MAE`\
  \ 等）至关重要。表 5.1 表明了这种比较：训练集的性能指标看起来比验证集低得多（即更好）。然而，图表揭示的信息比单纯的指标要多得多：查看图 5.1 中的图表，差异很可能是由于验证集中的某些离群值导致的，尤其是验证集中的非对称离群值。正值的验证误差（低估）略大于训练误差，这从中位数和离群值中反映出来。\n\
  \n### 提升图 (Lift Chart)\n\n在某些应用中，目标是从一组新记录中寻找子集能够提供最高累计预测值的记录。在这种情况下，通过*提升图*（lift\
  \ chart）评估预测性能的一种种可视化方法。它将模型的预测性能与没有预测变量的基准模型进行比较。只有当我们寻找一组能提供最高累计预测值的记录时，连续响应变量的提升图才有意义。如果我们感兴趣的是预测*每个*新记录的输出值，则提升图就没有意义。\n\
  \n为了说明这种被称为*排序* (ranking) 的目标，考虑一家租车公司，它定期更新其车队以确保客户开的是新款车型。这需要持续地处置大量的旧车。由于该公司并非主要从事二手车销售业务，它试图通过向二手车经销商进行批量销售来尽可能处理掉大部分车队。然而，通过自己的渠道销售有限数量的汽车是有利润的。它与二手车经销商的批量交易使其能够灵活地选择以这种方式销售的哪些汽车，因此它希望有一个模型来选择用于通过自己的渠道进行转售的汽车。由于所有的汽车都是在之前购买的，且与二手车经销商的交易是固定价格（指定了特定数量的特定品牌和型号的汽车），汽车的成本现在已经无关，经销商只感兴趣的是收入最大化。这是通过选择可能产生最多收入的汽车进行自己的转售来实现的。在这种情况下，提升图给收入的预测提升。\n\
  \n提升图是基于感兴趣的记录集（通常是验证数据）按预测值从高到低进行排序。然后，我们累加实际值并将累计值绘制在 *y* 轴上，作为累计记录数量（*x* 轴值）的函数。该曲线与为每个记录分配朴素预测值(![](img/c05_ILM0008.gif))\
  \ 并累加这些平均值进行比较，结果产生一条对角线。提升曲线越偏离对角基准线，模型在分离高值结果记录和低值结果记录方面的表现越好。同样的信息可以在分位数提升图中呈现，其中按排序的记录被分为十个分位数，对于每个分位数，图表展示了模型提升与朴素提升的比率。\n\
  \n图 5.2 显示了基于对丰田数据进行线性回归的提升图和分位数提升图。图表基于 400 辆汽车的验证数据。可以看出模型在提升方面的预测性能优于基准模型，因为其提升曲线高于基准模型。图\
  \ 5.2 中的提升图和分位数图在以下场景中非常有用：选择预测销售最高的 10%的汽车，例如，我们将获得 1.7 倍的收入，与随机选择 10%的汽车相比。这可以从分位数图中看出（图\
  \ 5.2）。这个数字也可以通过提升图计算，即比较 40 辆随机汽车的销量（基准曲线在`x = 40`处的值）486,871（400 辆验证集汽车实际销量总和除以\
  \ 10）与预测值最高的 40 辆汽车的实际销量（提升曲线在`x = 40`处的值）835,883。这两个数字之间的比例为 1.7。\n\n![显示从 0 到\
  \ 400 的案例数量与从 0 到 3000000 的累计价格的提升图，柱状图显示从 10 到 90 的百分位数与从 0.0 到 1.5 的平均响应。](img/c05f002.jpg)\n\
  \n**图 5.2** 连续输出变量（丰田汽车销量）的提升图（左）和分位数提升图（右）\n\n|\n\n```r\n code 生成提升图和分位数提升图的代码\n\
  ```\n\n|\n\n\n\n\n\n```r\ntoyota.corolla.df <- read.csv(\"ToyotaCorolla.csv\")\n\
  \n### remove missing Price data\ntoyota.corolla.df <-     \n     toyota.corolla.df[!is.na(toyota.corolla.df[validation,]$Price),]\n\
  \n### generate random Training and Validation sets\ntraining <- sample(toyota.corolla.df$Id,\
  \ 600)\nvalidation <- sample(toyota.corolla.df$Id, 400)\n\n### regression model\
