  注意在该示例中，训练数据中不存在某些预测值。要分类新航班，我们计算其延误的概率和准点的概率。由于由于分母相同，我们只需要比较分子。每个分子都是通过乘以所有相关预测值的条件概率计算的，最后乘以该类别的比例（在本例中\
  \ `delayed=0.197`）。符号 `∝` 意味着“正比于”，反映了该计算只处理朴素贝叶斯公式（8.3）中的分子。比较分子，因此航班更有可能是准点的。注意训练集中不存在这种预测值的组合记录，因此我们使用朴素贝叶斯而不是精确贝叶斯。为了计算实际概率，我们将每个分子除以它们的和：\n\
  \n当然，我们依赖软件来计算任何记录（训练集、验证集或评分数据）的这些概率。表 8.6 显示了示例的估计概率和类别。\n\n#### 表 8.6 示例评分（概率和类别）\n\
  \n```r\n# 使用朴素贝叶斯进行评分数据的代码\n```\n\n```r\n ## 预测概率\npred.prob <- predict(delays.nb,\
