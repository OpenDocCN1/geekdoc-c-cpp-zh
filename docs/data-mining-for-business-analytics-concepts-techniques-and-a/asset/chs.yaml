  \ 延误预测因素描述\n\n评估模型分类性能的另一个有用工具是提升图（收益图）和分位数提升图（见第 5 节）。图 10.3 展示了使用验证集获得的个人贷款优惠逻辑模型的提升图。相对于基准曲线的“提升”表示对于给定的案例数量（读取\
  \ `x` 轴），使用模型可以识别出的额外响应者。同样的信息展示在图 10.3 中：选取模型排名为“最可能是 1”的前 10% 记录，获得的 1 的数量是简单选择的\
  \ 7.9 倍。\n\n### 变量选择\n\n下一步包括寻找替代模型。一种方案是通过尝试更多模型来减少预测器的数量。例如，如果我们假设收入和家庭规模之间存在交互作用，我们应该添加一个形式为\
  \ `Income × Family` 的交互项。替代模型之间的选择主要由验证数据上的性能指导。对于表现相同的模型，简单模型通常比复杂模型更优。同样注意，在验证数据上的性能在预测未见数据的性能时可能过于乐观。因此，在测试集上评估所选模型以了解其表现是很有用的。此外，在选择最终模型时，必须考虑实际问题，如变量收集的成本、错误性和模型复杂性。\n\
  \n\n\n\n# 10.5 完整分析示例：预测航班延误\n\n预测航班延误对许多机构都有用：机场管理部门、航空公司、航空管理部门。有时，会成立联合工作组来解决这一问题。如果这样一个机构能够提供有关航班延误的持续实时帮助，将从有关可能延误的航班的提前通知中获益。\n\
  \n在这个简化的示例中，我们查看了六个预测因子（参见表 10.4）。我们关注的结果是航班是否延误（`delayed` 表示晚误超过 15 分钟）。我们的数据包含\
  \ 2004 年 1 月份从华盛顿特区地区飞往纽约市地区的所有航班。在这些 2201 次航班中，延误航班的百分比为 19.5%。数据获取自运输统计局网站（[www.transtats.bts.gov](http://www.transtats.bts.gov)）。\n\
  \n目标是准确预测一个不在此数据集中的新航班是否会延误。结果变量是一个名为 `Flight Status`（航班状态）的变量，编码为 `delayed`（延误）或\
  \ `ontime`（准点）。\n\n网站上提供的其他信息（如距离和到达时间）是无关的，因为我们查看的是特定的航线（数据中所有航班的距离、飞行时间等应大致相等）。20\
