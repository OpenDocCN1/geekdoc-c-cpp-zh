  \n### 模型解释\n\n到达机场 JFK (`DESTJFK`) 的系数估计为 -0.19。记得参考组是 `LGA`。我们如下如下解释该系数：$e^{-0.19}\
  \ = 0.83$ 是到达 JFK 的航班延误相对于飞往 `LGA` 的航班延误（即基准优势率）的优势率，在保持其他变量不变的情况下。这意味着飞往 `LGA`\
  \ 的航班比飞往 JFK 的航班更容易延误（在其他所有因素不变的情况下）。如果我们考虑系数的统计显著性，我们可以看到通常，起点和目的机场与延误概率没有关联。对于航空公司，两家航空公司\
  \ (`CO`、`MQ`) 与基础航空公司 (`USAirways`) 有显著差异，与其他航空公司相比，其延误优势率范围在 4 到 5.5 之间。天气的系数巨大，但在统计上并不显著。周日或周一出发的航班平均相对于一周内其他天，其延误优势率是\
  \ 1.8（其他天在统计上似乎与参考组 `周三` 相似）。此外，延误优势率似乎随着时间的推而变化，与参考类别（凌晨 6–7 点）最明显的区别是下午 3–4 点。\n\
