  10. 建议中位数（跨越主要经纪商）\n11. 公司总部所在地\n12. 公司上市的交易所\n\n使用聚类分析按如下探索和分析给定的数据集：\n\n1. 仅使用数值变量（1\
  \ 到 9）对 21 家公司进行聚类。为进行聚类分析时所做的各种选择理由，例如不同变量的权重、使用的特定聚类算法、形成的类数量等。\n2. 结合形成类时使用的数值变量来解释这些类。\n\
