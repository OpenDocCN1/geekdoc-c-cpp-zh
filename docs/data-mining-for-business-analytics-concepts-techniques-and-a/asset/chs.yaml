  \ subset = training)\n\n### predictions\npred_v <- predict(reg, newdata = toyota.corolla.df[validation,-c(1,2,8,11)])\n\
  \n### load package gains, compute gains (we will use package caret for categorical\
  \ y later)\nlibrary(gains)\ngain <- gains(toyota.corolla.df[validation,]$Price[!is.na(pred_v)],\
  \ pred_v[!is.na(pred_v)])\n\n### cumulative lift chart\noptions(scipen=999) # avoid\
  \ scientific notation\n### we will compute the gain relative to price\nprice <-\
  \ toyota.corolla.df[validation,]$Price[!is.na(toyota.corolla.df[validation,]$Price)]\n\
  plot(c(0,gain$cume.pct.of.total*sum(price))~c(0,gain$cume.obs), \n     xlab=\"#\
  \ cases\", ylab=\"Cumulative Price\", main=\"Lift Chart\", type=\"l\")\n\n### baseline\n\
  lines(c(0,sum(price))~c(0,dim(toyota.corolla.df[validation,])[1]), col=\"gray\"\
  , lty=2)\n\n### Decile-wise lift chart\nbarplot(gain$mean.resp/mean(price), names.arg\
  \ = gain$depth,\n        xlab = \"Percentile\", ylab = \"Mean Response\", main =\
  \ \"Decile-wise lift chart\")\n```\n\n## 5.3 评估分类器性能\n\n性能衡量标准的出现源于分类器和预测方法的广泛选择。我们不仅有多种不同的方法，即使在单一种方法内部，通常也有许多选项可能导致完全不同的结果。一个简单的例子是在特定预测算法中所使用的预测变量的选择。在详细研究这些各种算法并面对如何设置这些选项的决策之前，我们需要知道如何衡量成功。\n\
  \n判断分类器性能的自然标准是产生 `misclassification error`（分类错误）的概率。分类错误意味着记录属于某一类，但模型将其分类为另一类的成员。一个不产生任何错误的分类器是完美的，但由于“噪声”以及缺乏精确分类记录所需的所有信息，我们并不期望能在现实世界中构建这样的分类器。我们是否应该要求分类器具有最小的分类错误概率？\n\
  \n### 基准：朴素规则（The Naive Rule）\n\n将记录分类为 `m` 类之一的一种非常简单的规则是（忽略我们可能拥有的所有预测信息 `x[1]`、`x[2]`、……\
  \ `x[p]`）是将记录分类为多数类别的成员。换句话说，“分类为属于最普遍的类别。”`naive rule`（朴素规则）主要用作评估更复杂分类器性能的基准或参考标准。显然，使用外部预测信息（在类别成员分配之上）的分类器性能应该优于朴素规则。有多种基于朴素规则的性能标准，用于衡量某个分类器比朴素规则好多少。一个例子是多个\
  \ `R²`，它衡量了分类器对数据的拟合程度与朴素规则对数据拟合程度之间的距离（更多细节请参见第 10.6 节）。\n\n与在数值结果情况下使用样本均值作为朴素基准类似，分类的朴素规则完全依赖于\
  \ `y` 信息，并排除任何额外的预测信息。\n\n### 类别分离（Class Separation）\n\n如果类别通过预测信息很好地分离，即使是较小的数据足以找到良好的分类器；而如果预测变量完全无法分离类别，即使是非常大的数据集也无于事。图\
  \ 5.3 展示了二分类情况的情况。顶部面板包含了一个小型数据集（`n` = 24 条记录），其中使用两个预测变量（收入和地块）来区分所有者和非所有者 [感谢\
  \ Dean Wichern 提供的此示例，该示例在 Johnson and Wichern (2002) 中描述]。在这里，预测信息似乎是有用的，因为它区分了两个类别（所有者/非所有者）。底部面板显示了一个大得多的数据集（`n`\
  \ = 5000 条记录），其中两个预测变量（收入和每月平均信用卡支出）在大多数高范围内（贷款接受者/非接受者）不能很好地区分这两个类别。\n\n![图显示了收入（千美元）从\
  \ 20 到 120 与地块大小从 13 到 25 的对比，图显示了年收入从 1 到 1000 与每月平均信用卡支出从 0.10 到 10.00 的对比。](img/c05f003.jpg)\n\
  \n**图 5.3**](#c05.xhtml_figureanchor5-3) 使用两个预测变量的两个类别之间高（顶部）和低（底部）分离水平\n\n### 混淆（分类）矩阵\n\
  \n在实践中，大多数准确性指标都源于 `confusion matrix`（混淆矩阵）。该矩阵总结了正确和错误的分类情况。混淆矩阵的行和列分别对应预测类别和真实类别。表\
  \ 5.2 显示了一个二分类（0/1）问题在应用分类器处理 3000 条记录后的混淆矩阵示例。混淆矩阵的两个对角线单元给出正确分类的数量。非对角线单元给出分类错误的计数。左下角的单元给出被误分类为\
  \ 0 的 1 类成员数量（在该示例中，有 85 次误分类）。同样，右上单元给出被误分类为 1 的 0 类成员数量（25 条记录）。在 R 中，我们可以使用 `caret`\
  \ 包中的 `confusionMatrix()` 函数获取混淆矩阵。我们稍后会看到示例。\n\n### 使用验证数据\n\n为了获得未来分类错误的诚实估计，我们使用从\
  \ `validation data`（验证数据）计算出的混淆矩阵。换句话说，我们首先通过随机选择记录将数据划分为训练集和验证集。然后我们使用训练数据构建分类器，将其应用于验证数据。这将产生验证数据的预测分类。\n\
  \n![image](img/c05t002.jpg)\n\n混淆矩阵提供了真实分类和分类错误率的估计。当然，这些是估计值且可能是错误的，但如果我们有足够大的数据集且哪一个类别都不稀有，我们的估计将是可靠的。除了检查验证数据混淆矩阵以评估在新数据上的分类性能外，我们对比训练数据混淆矩阵与验证数据混淆矩阵，以检测过拟合：尽管我们预计验证数据上的结果会稍差，但差异不会巨大。\n\
  \n\n\n\n\n从分类矩阵中可以导出不同的准确性衡量。考虑一个包含类别 `C[1]` 和 `C[2]` 的二分类情况（例如：买者/非买者）。表 5.3 中的示意混淆矩阵使用符号\
  \ `n[*i*, *j*]` 表示属于类别 `C[i]` 且被分类为 `C[j]` 成员的记录数。当然，如果 `i` ≠ `j`，这些就是误分类的计数。记录总数为\
  \ `n = n[1, 1] + n[1, 2] + n[2, 1] + n[2, 2]`。\n\n|  |  | **实际类别** |\n\n|  |  |\
  \ ![](img/c05_ILM0014.gif) | ![](img/c05_ILM0015.gif) |\n\n| 预测类别 | ![](img/c05_ILM0016.gif)\
  \ | ![](img/c05_ILM0017.gif) = ![](img/c05_ILM0018.gif) 记录数 | ![](img/c05_ILM0019.gif)\
  \ = ![](img/c05_ILM0020.gif) 记录数 |\n\n|  |  | 分类正确 | 错误分类为 ![](img/c05_ILM0021.gif)\
  \ |\n\n|  | ![](img/c05_ILM0022.gif) | ![](img/c05_ILM0023.gif) = ![](img/c05_ILM0024.gif)\
  \ 记录数 | ![](img/c05_ILM0025.gif) = ![](img/c05_ILM0026.gif) 记录数 |\n\n|  |  | 错误分类为\
  \ ![](img/c05_ILM0027.gif) | 分类正确 |\n\n表 5.3 混淆矩阵：每个单元格的含义\n\n主要的准确性衡量指标是*估计误分类率*，也称为*总体错误率*。其公式为：\n\
  \n![numbered Display Equation](img/c05_M0001.gif)\n\n其中 `n` 是验证数据集中记录的总数。在表 5.2\
  \ 的示例中，我们得到 `err = (25 + 85)/3000 = 3.67%`。\n\n我们可以通过观察正确分类（杯子的完整部分）而不是误分类来衡量准确性。分类器的*总体准确率*通过以下公式估计：\n\
  \n![numbered Display Equation](img/c05_M0002.gif)\n\n在示例中，$(201 + 2689)/3000 = 96.33\\\
  %$。\n\n### 分类的倾向性与阈值\n\n大多数分类算法的第一步是估计记录属于每个类别的概率。这些概率也称为*倾向性*（propensities）。倾向性通常用于生成预测类别成员（分类）的中间步骤，或者根据记录属于感兴趣类别的概率对记录进行排序。让我们考虑它们在本节中的第一个用途。第二种用途将在\
  \ 5.19 节中讨论。\n\n如果对总体分类准确率（涉及所有类别）感兴趣，可以将记录分配给概率类别。在许多记录中，某个特定类别具有特殊意义，因此我们将关注该特定类别，并将属于该类别的倾向性与分析师设置的*阈值*（cutoff\
  \ value）进行比较。这种方法可以用于两个类别或多个类别，尽管在这种情况下，合并类别以最终只剩下两个（感兴趣的类别和其他所有类别）可能有意义。如果属于感兴趣类别的概率高于阈值，则该记录被分配到该类别。\n\
  \n二分类分类器的默认阈值为 `0.5`。因此，如果一条记录是 `C[1]` 成员的概率大于 `0.5`，则该记录被分类为 `C[1]`。任何估计概率小于 `0.5`\
  \ 的记录都将被分类为 `C[2]`。然而，也可以使用高于或低于 `0.5` 的阈值。高于 `0.5` 的阈值最终会导致更少的记录被分类为 `C[1]`，而低于\
  \ `0.5` 的阈值会导致更多的记录被分类为 `C[1]`。通常，在这情况下误分类率都会上升。\n\n考虑表 5.4 中的数据，它显示了 24 条记录的实际类别，并按记录是“所有者”的概率（由数据挖掘算法估计）排序。如果我们采用标准的\
  \ `0.5` 作为阈值，我们的误分类率为 `3/24`；而如果我们采用 `0.25` 的阈值，我们会将更多记录分类为所有者，误分类率会上升（包含更多非所有者被误分类为所有者）达到\
  \ `5/24`。相反，如果我们采用 `0.75` 的阈值，我们将把更少的记录分类为所有者。这些都可以在表 5.5 中看到。\n\n\n\n\n\n如果误分类率会增加，我们为什么想要使用不同于\
  \ 0.5 的截断值呢？答案是，正确分类所有者可能比正确分类非所有者更重要，我们可以容忍后者的更大误分类。或者反之亦然；换句话说，误分类的成本可能是不对称的。在这种情况下，我们可以调整截断值，将更多记录分类为高价值类别，即在误分类成本较低接受更多的误分类。请记住，我们是在数据挖掘模型选定之后才做的——我们并没有改变该模型。在推导模型之前将成本考虑进去也是可能的。这些主题将在下面进行更详细的讨论。\n\
  \n### 类别重要性不相等时的性能\n\n假设正确预测 `C[1]` 类成员比正确预测 `C[2]` 类成员更重要。。一个例子是预测企业的财务状况（破产/有能力）。正确预测一家即将破产的公司可能比正确预测一家将保持有能力的公司更重要。分类器本质上被用作检测或信号破产的系统。在这种情况下，总准确率不是评估分类器的良好标准。假设重要类别是\
  \ `C[1]`。以下两个准确率指标是最流行的：\n\n*   分类器的**敏感性**（也称为召回率）是其正确检测重要类别成员的能力。它通过 `n[1, 1]/(n[1,\
  \ 1] + n[1, 2])` 衡量，即正确分类的 `C[1]` 成员的百分比。\n*   分类器的**特异性**是其正确排除 `C[2]` 成员的能力。它通过\
  \ `n[2, 2]/(n[2, 1] + n[2, 2])` 衡量，即正确分类的 `C[2]` 成员的百分比。\n\n将这些指标相对于截断值绘图，有助于找到平衡这些指标的截断值。\n\
  \n## ROC 曲线\n\n绘制这两个指标更流行的方法是通过`ROC`（受者工作特征）`曲线`。从左下角开始，ROC 曲线随着截断值从 1 下降到 0，绘制出\
  \ `{敏感性, 特异性}` 对。（另一种典型的表示方法是在`x`轴上绘制 1-特异性，这允许 0 放在轴的左端，将 1 放在右端）。曲线越靠近左上角，反映性能越好。比较曲线是对角线，它反映了使用不同截断值的朴素规则的性能（即在多数规则所使用的多数派水平上设置不同的阈值）。用于总结\
  \ ROC 曲线的常用指标是“曲线下面积（AUC）”，其范围从 1（类别之间的完美区分）到 0.5（不优于朴素规则）。所有者/非所有者示例的 ROC 曲线及其相应的\
  \ AUC 所示图 5.5。\n\n![图显示特异性从 1.0 到 0.0 与敏感性从 0.0 到 1.0 的对比。](img/c05f005.jpg)\n\n\
  图 5.5 割草机示例的 ROC 曲线\n\n```\n用于生成 ROC 曲线和计算 AUC 的代码\n```\n\n```\nlibrary(pROC)\n\
  r <- roc(df$actual, df$prob)\nplot.roc(r)\n\n### compute auc\nauc(r)\n\nOutput\n\
  > auc(r)\nArea under the curve: 0.9375\n```\n\n\n\n### 不对称的误分类成本\n\n我们在讨论提升曲线（lift\
  \ curve，用于衡量我们识别某一特定类别成员的有效性）时，隐含了一个假设，即误分类属于某一类别的记录的错误比另一类别的错误更严重。例如，当一个家庭属于会响应销售报价的类别时，将其误分类为可能不会响应销售报价，其付出的成本（错失销售的机会成本）要比反向错误更大。在前一种情况下，你错失了一笔可能价值数十或数百美元的销售。在后一种情况下，你付出了联系一个不会购买的人的成本。在这种情况下，使用误分类率作为标准可能会产生误导。\n\
  \n请注意，我们假设做出正确分类的成本（或收益）为零。初看之下，这似乎并不完整。毕竟，将买家正确分类为买家带来的收益（负成本）似乎是巨大的。在其他情况下（例如，对新数据对我们的分类算法进行评分以实施我们的决策），考虑每种可能的分类（或误分类）的实际净美元影响是恰当的。然而，在这里我们试图从分类错误的角度评估分类器的价值，因此如果我们能够在误分类单元格中捕获所有的成本/收益信息，就会大大简化问题。所以，我们不是记录将受访家庭正确分类为响应家庭的收益，而是记录未能将其分类为响应家庭的成本。它们是等同的，我们的目标是成本最小化，无论这些成本是实际成本还是错失的收益（机会成本）。\n\
  \n考虑这种情况：向随机样本发送销售报价，以构建一个良好的分类器。假设这些家庭中有 1%接受了报价。对于这些数据，如果分类器简单地将每个家庭分类为非响应者，其错误率仅为\
  \ 1%，但在实践中它是徒用的。一个将 20%的非买家误分类为买家的分类器其错误率较高，但如果销售的利润远高于发送的成本，那么它会更好。在这些情况下，如果我们对两种类型误分类的成本有估计，我们可以使用混淆矩阵计算每条记录的预期误分类成本。这使我们能够以总成本（或利润）为标准比较不同的分类器。\n\
  \n假设我们正在考虑向额外的 1000 人发送报价，其中平均有 1%的人响应（1）。朴素地将所有人分类为 0，错误率仅为 1%。使用数据挖掘程序，假设我们可以产生这些分类：\n\
  \n| | **实际 0** | **实际 1** |\n| 预测 0 | 970 | 2 |\n| 预测 1 | 20 | 8 |\n\n这些分类的错误率位\
  \ 100 × (20 + 2)/1000 = 2.2%——高于朴素率。\n\n现在假设一个响应者的利润为$10，发送报价的成本为$1。将所有人分类为 0 的误分类率仍仅为\
  \ 1%，但产生了$0 的利润。使用数据挖掘程序，尽管误分类率较高，但产生了$60 的利润。\n\n利润矩阵如下（对预测的 0 不发送任何内容，因此该列没有成本或销售）：\n\
  \n| **利润** | **实际 0** | **实际 1** |\n| 预测 0 | 0 | 0 |\n| 预测 1 | − $20 | $80 |\n\n\
  单纯从成本的角度来看，当所有人分类为 0 时，没有发送报价的成本；唯一的是错失向这十个 1 销售的机会成本 = $100。使用数据挖掘程序选择发送报价的人的成本（实际发送的成本，加上错失销售的机会成本）仅为$48，如下：\n\
  \n| **成本** | **实际 0** | **实际 1** |\n| 预测 0 | 0 | $20 |\n| 预测 1 | $20 | $8 |\n\n\
  然而，这并没有改进分类本身。更好的方法是如前一节所述，改变分类规则（从而改变误分类率），以反映不对称成本。\n\n\n\n\n\n一种包含成本的常用性能指标是`平均误分类成本`（average\
  \ misclassification cost），它衡量每个分类记录的平均误分类成本。用 `q`[1] 表示将类 `C`[1] 记录误分类（归为类 `C`[2]）的成本，用\
  \ `q`[2] 表示将类 `C`[2] 记录误分类（归为类 `C`[1]）的成本。平均误分类成本公式为：\n\n![numbered Display Equation](img/c05_M0003.gif)\n\
  \n因此，我们正在寻找一个最小化该数值的分类器。这可以通过不同的截止值来计算。\n\n事实证明，最优参数仅通过这些成本的比例受到误分类成本的影响。如果我们对上述指标稍作修改，就可以看出这一点：\n\
  \n![numbered Display Equation](img/c05_M0004.gif)\n\n最小化该表达式等同于最小化该表达式除以一个常数。如果除以\
  \ `q`[1]，可以清楚地看到，最小化仅取决于 `q`[2]/`q`[1]，而不取决于它们的具体值。这非常实用，因为在许多情况下，评估误分类 `C`[1] 成员和\
  \ `C`[2] 成员相关的成本是困难的，但估计它们的比例较容易。\n\n如果样本数据中类 `C`[1] 和 `C`[2] 的比例与未来预期类 `C`[1] 和\
  \ `C`[2] 的比例相似，那么该表达式就是未来误分类成本的合理估计。如果不是抽取随机样本，而是抽取使得某一类被过采样的样本（如下一节所述），那么样本中 `C`[1]\
  \ 和 `C`[2] 的比例与未来或总体比例相比就会扭曲。此时我们可以通过将真实比例的估计值（来自外部数据或领域知识），记为 `p`(`C`[1]) 和 `p`(`C`[2])\
  \ 引入公式，对扭曲的样本比例修正平均误分类成本指标：\n\n![numbered Display Equation](img/c05_M0005.gif)\n\
  \n使用上述相同的逻辑，可以证明优化该数值仅通过其成本的比例（`q`[2]/`q`[1]）以及仅通过先验概率的比例 [`p`(`C`[2])/*p`(`C`[1])]受到它们的影响。这就是为什么结合成本和先验概率的软件软件包可能会提示用户输入比例，而不是实际成本和概率。\n\
  \n### 向多类别的泛化\n\n上述关于二分类分类器的所有注释都可以很容易扩展到两个以上类别的分类。假设我们有 `m` 个类 `C`[1], `C`[2],\
  \ …, `C`[m]。混淆矩阵有 `m` 行 `m` 列。与对角线单元格相关的误分类成本显然始终为零。结合各个类的先验概率（现在我们有 `m` 个这样的数字）仍然以相同的方式进行。然而，评估误分类成本变得复杂得多：对于\
  \ `m` 类情况，我们有 `m`(`m` − 1) 种类型的误分类。因此，构建误分类成本矩阵变得极其复杂。\n\n## 5.4 评价排名性能\n\n我们现在转向预测目标：在一组新记录中检测最可能属于感兴趣类的记录。回想一下与预测每个新记录的类别成员身份的目标不同。\n\
  \n### 二分类数据的提升图（Lift Charts）\n\n我们已经在数值结果的背景下（第 5.3 节）引入了提升图。我们现在描述用于二分类结果的提升图，也称为`lift\
  \ curves`、`gains curves`（收益曲线）或`gains charts`。这比预测连续结果的用法更常见。提升图帮助我们确定通过选择相对少量的记录并获得很大比例的响应者可以有多有效地“大鱼取菁”。构建提升图所需的输入是一个验证数据集，该数据集已经过“评分”，即在每个记录后附加了其属于给定类别的倾向。\n\
  \n让我们继续考虑特定类相对稀少且比另一类更感兴趣的情况，例如：逃税者、债务违约者或邮件的响应者。我们希望我们的分类模型能够筛选记录，并根据哪些记录最可能是逃税者、邮件的响应者等，对它们进行排序。然后我们就可以做出更明智的决策。例如，在寻找逃税者时，我们可以决定检查多少份以及哪些纳税申报。模型将为我们提供估计，即当我们从最可能的逃税者记录开始处理排序数据时，我们将遇到越来越多的非逃税者的程度。或者我们可以使用排序后的数据来决定有限预算的邮件应该针对哪些潜在客户。换句话说，我们描述的是目标是根据记录的类别成员倾向获得记录之间的排名排序的情况。\n\
  \n### 按倾向排序\n\n为了构建提升图，我们按倾向性降序对记录集进行排序。这是属于重要类（例如 `C`[1]）的倾向。然后，在每一行中，我们计算 `C`[1]\
  \ 成员的累计数量（实际类别 = `C`[1]）。例如，表 5.6 显示了按类别“1”倾向降序排列的 24 条记录。最右侧的列累计了实际 1 的数量。提升图将该累计列与记录数量作图。\n\
  \n| Obs | Propensity | Actual | Cumulative |\n| :--- | :--- | :--- | :--- |\n| 1\
  \ | 0.995976 | 1 | 1 |\n| 2 | 0.987533 | 1 | 2 |\n| 3 | 0.984456 | 1 | 3 |\n| 4\
  \ | 0.980439 | 1 | 4 |\n| 5 | 0.948111 | 1 | 5 |\n| 6 | 0.889297 | 1 | 6 |\n| 7\
  \ | 0.762806 | 1 | 7 |\n| 8 | 0.706991 | 1 | 8 |\n| 9 | 0.680754 | 1 | 9 |\n| 10\
  \ | 0.656343 | 1 | 10 |\n| 11 | 0.622419 | 1 | 11 |\n| 12 | 0.505506 | 0 | 11 |\n\
  | 13 | 0.471340 | 0 | 11 |\n| 14 | 0.337117 | 0 | 11 |\n| 15 | 0.217967 | 0 | 11\
  \ |\n| 16 | 0.199240 | 0 | 11 |\n| 17 | 0.149482 | 0 | 11 |\n| 18 | 0.047962 | 0\
  \ | 11 |\n| 19 | 0.038341 | 0 | 11 |\n| 20 | 0.024851 | 0 | 11 |\n| 21 | 0.021806\
  \ | 0 | 11 |\n| 22 | 0.016129 | 0 | 11 |\n| 23 | 0.013553 | 0 | 11 |\n| 24 | 0.003559\
  \ | 0 | 11 |\n\n表 5.6 割机示例按倾向从高到低排序的记录\n\n| **Confusion matrix, Oversampled (validation)**\
  \ | | | |\n| :--- | :--- | :--- | :--- |\n| | **Actual 0** | **Actual 1** | **Total**\
  \ |\n| Predicted 0 | 390 | 80 | 470 |\n| Predicted 1 | 110 | 420 | 530 |\n| Total\
  \ | 500 | 500 | 1000 |\n\n| **Confusion matrix, Reweighted** | | | |\n| :--- | :---\
  \ | :--- | :--- |\n| | **Actual 0** | **Actual 1** | **Total** |\n| Predicted 0\
  \ | 390/0.5102 = 764.4 | 80/25 = 3.2 | |\n| Predicted 1 | 110/0.5102 = 215.6 | 420/25\
  \ = 16.8 | |\n| Total | 980 | 20 | 1000 |\n\n\n\n\n\n```r\n### 使用 'caret' 库的方法：\n\
  library(caret)\nlift.example <- lift(relevel(as.factor(actual), ref=\"1\") ~ prob,\
  \ data = df)\nxyplot(lift.example, plot = \"gain\")\n\n### 使用 'gains' 库的方法：\nlibrary(gains)\n\
  df <- read.csv(\"liftExample.csv\")\ngain <- gains(df$actual, df$prob, groups=dim(df)[1])\n\
  plot(c(0, gain$cume.pct.of.total*sum(df$actual)) ~ c(0, gain$cume.obs), \n     xlab\
  \ = \"# cases\", ylab = \"Cumulative\", type=\"l\")\nlines(c(0,sum(df$actual))~c(0,dim(df)[1]),\
  \ col=\"gray\", lty=2)\n```\n\n### 解释提升图 (Lift Chart)\n\n什么是被认为是好或坏的表现？理想的排名性能是将所有的\
  \ 1 放在开头（实际的 1 具有最高的概率并位于表格顶部），并将所有的 0 放在末尾。对应这种理想情况的提升图是一条斜率为 1 的对角线，当所有的 1 都累积完成后，它将变为水平线。在示例中，最佳分类器——一个不犯错误的分类器——的提升曲线在开始处与现有曲线重叠，然后以\
  \ 1 的斜率持续直到达到所有的 12 个 1，然后继续向右水平。\n\n相比之下，一个无用的模型是随机分配概率的模型（在“实际类别”Actual Class\
  \ 列中随机打乱 1 和 0）。这种行为平均每行会使 1 的累积数量增加 ![](img/c05_ILM0028.gif)。事实上，这就是连接点 (0,0) 到\
  \ (24,12) 的对角线，如所示图 5.6。这作为一条参考线。对于任何给定的记录数（`x` 轴值），它代表了如果我们没有模型而只是随机选择记录，那么预期的\
  \ 1 分类数量。它提供了一个基准，我们可以借此来评估模型的排名性能。在这个示例中，尽管我们的模型并不完美，但它的表现似乎比随机基准好得多。\n\n我们如何阅读提升图？对于一个给定的记录数（`x`\
  \ 轴），`y` 轴上的提升曲线值告诉我们与随机分配相比表现好了多少。例如，查看图 5.6，如果我们使用我们的模型来选择前 10 条记录，提升曲线告诉我们我们大约会在其中\
  \ 9 条记录上是正确的（如果使用 `caret` 包的提升曲线则为 18%）。如果我们简单地随机选择 10 条记录，我们预计会有 `10 × 12/24 =\
  \ 5` 条记录是正确的。该模型为我们在检测类别 1 成员方面提供了“提升”倍数 `9/5 = 1.8`。提升率会随着我们选择处理的记录数量而变化。良好的分类器在我们只处理少数记录时会给我们很高的提升率。随着我们包含更多记录，提升率将会下降。\n\
  \n### 分位数提升图 (Decile Lift Charts)\n\n提升图中的信息可以被描绘为`分位数图`(decile chart)，如图 5.7 所示，这在直接营销预测建模中被广泛。分位数图将所有提升信息聚合到\
  \ 10 个桶中。点在 `y` 轴上显示了我们的模型优于随机分配 0 和 1 的倍数，每次取一个分位数。读取左侧的条形，我们看到选取模型排名为“最可能的 1”（具有最高概率）的前\
  \ 8% 记录，其产生的 1 的数量是随机选择 8% 记录的两倍。在这个示例中，分位数图表明，我们甚至可以使用该模型来选择概率最高的前 29% 记录，且表现仍然比随机好两倍。\n\
  \n![条形图显示了从 8% 到 100% 百分比的分位数提升图，与从 0.0 到 2.0 的平均响应值进行对比。](img/c05f007.jpg)\n\n\
  **图 5.7** 分位数提升图\n\n```r\n### 创建分位数提升图的代码\n```\n\n```r\n# 使用 gains() 计算分位数。 \n#\
  \ 当使用 caret 包时，分位数必须手动计算。 \n\ngain <- gains(df$actual, df$prob,)\nbarplot(gain$mean.resp\
  \ / mean(df$actual), names.arg = gain$depth, xlab = \"Percentile\", \n        ylab\
  \ = \"Mean Response\", main = \"Decile-wise lift chart\")\n```\n\n### 二分类之外\n\n\
  提升图不能用于多分类器，除非定义了一个单一的“重要类别”并将分类减少为“重要”和“不重要”类别。\n\n### 结合成本和收益的提升图\n\n当正确分类和错误分类的收益和成本已知或可以估算时，提升图仍然是一个非常有用的展示和决策工具。与之前一样，我们需要一个分类器：\n\
  \n1. 按成功概率降序对记录进行排序。\n2. 对于最高概率，与实际结果相关的成本（收益）。\n3. 对于下一条记录，将此成本（收益）加上之前的和。这是提升曲线的\
  \ `y` 坐标。\n4. 重复步骤 4 直到检查所有记录。\n5. 连接所有点，这就是提升曲线。\n6. 参考线是从原点到 `y` = 总收益的直线。\n\n\
  **注意：** 如果整体价值为负，结合成本和收益的参考线完全可能是负斜率。例如，如果发送一个人的成本为 $0.65，响应价值为 $25，而整体响应率为 2%，则发送\
  \ 10000 人的预期净价值为 `(0.02 × 25 × 10000) - (0.65 × 10000) = $5000 - $6500 = -$1500`。因此，在最右侧（`x`\
  \ = 10000）的值为 `-1500`，来自原点的斜率将为负。最佳点将出现在提升曲线最大值处（即针对 3000 个人），如图 5.8。\n\n![图显示了\
  \ 3000 到 10000 的水平线以及 -1500 美元到 1500 美元的垂直线，提升曲线参考线具有负斜率。](img/c05f08.jpg)\n\n###\
  \ 作为截值函数的提升率\n\n我们也可以将提升率绘制为截值的函数。唯一的区别是 `x` 轴的刻度。当目标是根据特定预算选择顶部记录时，记录数的提升图更为理想。相比之下，当目标是找到一个良好区分两个类别的截值时，截值的提升图更有用。\n\
  \n## 5.5 过采样 (Oversampling)\n\n正如我们在第 2 章中简要过的，当类别比例极不均衡时，简单随机采样产生的稀有类太少，无法产生关于它们如何区分主类别的有用信息。在这种情况下，通常使用分层采样对稀有类记录进行过采样，以提高分类器的性能。通常稀有事件往往更有趣或更重要：邮件响应者、欺诈者、债务违约者等。我们将坚持使用*过采样*这一术语。\n\
  \n\n\n\n考虑图 5.9 中的数据，其中 `×` 代表非响应者，而 `○` 代表响应者。两个轴对应于两个预测变量。在成本相等的假设下，虚线的分类效果最好：它只导致了一次误分类（将一个\
  \ `○` 误分类为 `×`）。如果我们引入更符合实际的误分类成本——假设漏掉一个 `○` 的成本是漏掉一个 `×` 的五倍——那么误分类的成本将跃升到 5。在这种情况下，如图\
  \ 5.10 所示的水平线效果更好：它的误分类成本仅为 2。\n\n![图显示了两个框，分类为“x”在左侧，分类为“O”在右侧，并带有点图。](img/c05f009.jpg)\n\
  \n图 5.9 假设误分类成本相等的分类\n\n![图显示了两个部分，分类为“x”在上方，分类为“O”在下方，并带有点图。](img/c05f010.jpg)\n\
  \n图 5.10 假设误分类成本不等的分类\n\n过采样是将这些成本纳入训练过程的方法之一。在图 5.11 中，我们可以看到如果在每个现有的 `○` 处增加四个\
  \ `○`，分类算法将自动确定合适的分类线。我们可以通过获取比随机采样多五倍的 `○`（必要时采用有放回采样），或者通过将现有的 `○` 复制四倍来获得适当的结果。\n\
  \n![图显示了两个部分，分类为“x”在上方，分类为“O”在下方，并带有点图。](img/c05f011.jpg)\n\n图 5.11 使用过采样考虑不相等成本的分类\n\
  \n根据成本比例进行不放回过采样（上述第一种方案）是优解，但并不总是可行。如果响应者仅占总数的极小比例，则可能没有足够的响应者来确保有足够的人数拟合模型。此外，通常情况下是，我们对发现响应者的兴趣远大于对发现非响应者的兴趣，但准确的成本比例很难确定。在分类问题中面临极低响应率时，从业人员通常对等量的响应者和非响应者进行采样，作为一种相对有效且方便的方法。无论使用哪种方法，在评估和预测模型性能时，我们需要通过以下两种方式之一调整过采样带来的：\n\
  \n1. 对一个未经过过采样的验证集（即通过简单随机采样获得）进行模型评分；\n2. 对过采样的验证集进行模型评分，并对结果重新加权以消除过采样的影响。\n\n\
  第一种方法更直观且更容易实现。我们将描述如何对这两种方法分别进行过采样以及如何评估性能。\n\n### 对训练集进行过采样\n\n如何进行加权采样？当响应者极其稀缺到你希望使用所有响应者时，一种常用程序如下：\n\
  \n1. 首先，将响应和非响应数据分为两个不同的集合，或称为 `strata`（分层）。\n2. 然后，从每个分层中随机选择记录进入训练集。通常，可能会为训练集选择一半的（稀缺的）响应者，然后选择等数量的非响应者。\n\
  3. 将剩余的响应者放入验证集。\n4. 随机选择足够数量的非响应者进入验证集，以保持与响应者与非响应者的原始比例。\n5. 如果需要测试集，可以从验证集中随机提取。\n\
  \n### 使用非过采样验证集评估模型性能\n\n虽然可以使用过采样的数据来训练模型，但它们通常不适用于评估模型性能，因为响应者的数量（理当然）会被夸大。获得模型性能无偏估计的最直接方法是将模型应用于正规数据（即未过采样的数据）。简而言之，在过采样数据上训练模型，但使用正规数据对其进行验证。\n\
  \n### 在仅存在过采样验证集时评估模型性能\n\n在某些情况下，极低的响应率可能使得过采样数据不仅用于训练数据，还用于验证数据更具可行性。这可能会发生，例如如果分析师获得了一个用于探索和原型开发的数据集，该数据集已经过采样，以提高感兴趣的稀有响应的比例（可能是因为传输和处理较小的数据更方便）。在这种情况下，仍然可以评估模型在真实数据上的表现如何，但这需要对过采样的验证集进行重新加权，以恢复在采样过程中代表性不足的类别。这种调整应该应用在混淆矩阵和提升图（lift\
  \ chart）中，以获得良好的准确率衡量标准。接下来将描述这些调整。\n\n### I. 为过采样调整混淆矩阵\n\n假设数据的整体响应率为 2%，且数据经过了过采样，得到一个响应率高出\
  \ 25 倍的样本（50% 为响应者）。关系如下：\n\n* **响应者：** 整体数据的 2%；占样本的 50%\n* **非响应者：** 整体数据的 98%；占样本的\
  \ 50%\n\n整体中的每个响应者相当于样本中的 25 个响应者（权重/权重）；整体中的每个非响应者相当于样本中的 0.5102 个非响应者（权重）。我们将这些值称为\
  \ `过采样权重`。\n\n假设验证混淆矩阵如下：\n\n此时，误分类率看起来为 (80+110)/1000 = 19%，模型最终将 53% 的记录分类为 1。然而，这反映的是响应者占比\
  \ 50% 样本上的性能。\n\n为了估计当该模型应用于总体（响应率为 2%）时的预测性能，我们需要消除过采样的影响。响应者的实际数量必须除以 25，非响应者的实际数量除以\
  \ 0.5102。\n\n调整后的混淆矩阵如下：\n\n调整后的误分类率为 (3.2+215.6)/1000 = 21.9%。当我们假设响应率为 2% 时，模型最终将\
  \ 23.24% 的记录分类为 1。\n\n### II. 为过采样调整提升图\n\n在低响应情况下，提升图可能是一个更有用的衡量标准，在这种情况下，我们的兴趣不在于正确分类所有记录，而是找到一个引导我们走向最可能包含感兴趣响应记录的模型（假设资源限制无法检查或联系所有记录）。通常，在这种情况下我们的兴趣在于最大化价值或最小化成本，因此我们将展示包含收益/成本元素的调整过程。可以使用以下步骤：\n\
  \n1. 根据预测成功的概率（成功 = 属于感兴趣的类别）对验证记录进行排序。\n2. 对于每条记录，记录与实际结果相关的成本（收益）。\n3. 将该值除以过采样率。例如，如果响应者被加权了\
  \ 25 倍，则除以 25。\n4. 对于概率最高（即第一条）记录，上述值即为提升图第一个点的 *y* 坐标。*x* 坐标为索引数 1。\n\n\n\n\n5.\
  \ 对于下一条记录，再次计算与实际结果相关的调整值。将此值加到上一条记录的调整后成本（收益）中。该总和为提升曲上第二个点的 `y` 坐标。`x` 坐标为索引值\
  \ 2。\n\n6. 重复步骤 5，直到所有记录都检查完毕。连接所有点，这便形成了提升曲线。\n\n7. 参考线是从原点到点 `y` = 总净收益且 `x` =\
  \ `n`（`n` = 记录数）的一条直线。\n\n### 问题\n\n1. 一项数据挖掘程序被应用于一个交易数据集，并将 88 条记录分类为欺诈（其中 30\
  \ 条分类正确），将 952 条记录分类为非欺诈（其中 920 条分类正确）。请构建混淆矩阵并计算总体错误率。\n\n2. 假设该程序有一个可调的截断（阈值）机制，通过该机制你可以更改分类为欺诈的记录比例。描述向上或向下移动截断如何影响：\n\
  \n    1. 真实欺诈记录的分类错误率\n    2. 真实非欺诈记录的分类错误率\n\n3. FiscalNote 是由一位华盛顿特区的企业家创立的初创公司，由新加坡主权基金、因\
  \ Facebook 闻名的温克沃斯兄弟以及其他人资助。它利用机器学习和数据挖掘技术为客户预测美国国会和美国州级议会的法案是否会通过。该公司报告的准确率为 94%（*华盛顿邮报*，2014\
  \ 年 11 月 21 日，“资本商业”）。\n\n   仅考虑美国国会提出的法案，进行一些网络研究以了解法案提出的数量和通过率。识别可能的误分类类型，并对使用总体准确率作为指标的合理性进行评论。讨论其他可能的指标以及倾向（propensities）可能的作用。\n\
