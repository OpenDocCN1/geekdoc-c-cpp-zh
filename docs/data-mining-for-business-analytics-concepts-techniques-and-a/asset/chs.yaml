  \ 章：逻辑回归\n\n在本章中，我们将描述一种非常流行且强大的分类方法，称为逻辑回归（logistic regression）。与线性回归一样，它依赖于一个将预测变量与结果联系起来特定模型。用户必须指定要包含的预测变量及其的形式（例如，包含任何交互项）。这意味着即使是小型数据集也可以用于构建逻辑回归分类器，而且一旦模型估计完成，即使是对大量的新记录进行分类，在计算上也是快速且廉价的。我们将描述\
  \ `logistic regression` 模型的公式以及如何从数据中对其估计。我们还解释了在逻辑模型背景下出现的“logit”、“几率（odds）”以及事件的“概率（probability）”的概念，以及三者之间的关系。我们将利用系数和统计显著性来讨论变量重要性，并提到用于降维的变量选择算法。我们的陈述严格从数据挖掘的角度出发，其中分类是目标，性能在单独验证集上进行评估。然而，由于逻辑回归也广泛用于统计分析以进行推断，我们在本章末尾的附录中简要回顾了与系数解释、拟合优评估、推断和多分类模型相关的关键概念。\n\
  \n## 10.1 引言\n\n逻辑回归将线性回归的思想扩展到结果变量 `Y` 为分类变量的情况。我们可以将分类变量看作是把记录划分为不同的几类。例如，如果 `Y`\
  \ 表示对持有/卖出/购买股票的建议，那么我们就有一个具有三个类别的分类变量。我们可以认为数据集中的每只股票（记录）都属于三个类之一：`hold`（持有）类、`sell`（卖出）类和\
  \ `buy`（购买）类。逻辑回归可以根据其预测变量（称为 `classification`）的值，将类别未知的新记录分类到这些类别之一（这被称为“分类”）。它也可以用于类别已知的数据，以根据预测变量找到区分不同类别记录的因素，或“预测变量特征”（称为\
  \ `profiling`，即“画像分析”）。逻辑回归用于此类应用，例如：\n\n1. 将客户分类为回头客或非回头客（分类）\n2. 寻找区分男性和女性高管的因素（画像分析）\n\
  3. 根据信用评分等信息预测贷款的批准或拒绝（分类）\n\n逻辑回归模型用于多个领域：每当需要结构化模型来解释或预测分类（特别是二分类）结果时。其中一个应用是描述计量经济学中的选择行为。\n\
  \n在本章中，我们重点关注使用逻辑回归进行分类的用法。我们只处理具有两个可能类别的二分类结果变量。在附录中，我们展示了如何将结果扩展到 `Y` 假设有两个以上可能类别的情况。二分类结果的常见例子有成功/失败、是/否、买/不买、违约/不违约以及生存/死亡。为了方便，我们通常将二分类结果变量\
  \ `Y` 的值编码为 0 和 1。\n\n注意，在某些情况下，我们可能选择将连续结果变量或具有多个类别的结果变量转换为二分类结果变量以为了简化，这反映了决策可能是二元的（批准贷款/不批准，提供报价/不提供报价）。与多元线性回归一样，预测变量\
  \ `X[1]`、`X[2]`、…… `X[k]` 可能是分类变量、连续变量或这两种类型的混合。虽然在多元线性回归中，目标是预测连续值的值，但在逻辑回归中，目标是根据其预测变量的值将类别未知的新记录分类到这些类别之一（这被称为\
