  \ 预测模型的分类和倾向性（部分摘录）\n\n然而，我们感兴趣的不仅仅是信息的整体效果如何，也不仅仅是我们是否可以预测选民观点向有利方向转变的概率。相反，我们的目标是预测信息会对特定选民产生多大（正向）影响。这样，竞选活动就可以将其有限的资源投入到最易说服的选民——即那些发送信息对其产生最大正面影响的人。\n\
  \n### 建模个体提升\n\n为了回答信息对每位选民的影响，我们需要对信息的影响进行建模。为了构建提升（uplift），我们遵循以下步骤：\n\n1. 将数据随机分为两组：处理组和控制组。\n\
  2. 对于处理组，拟合逻辑回归预测 `Moved_AD`。\n3. 对于控制组，拟合逻辑回归预测 `Moved_AD`。\n4. 对于每位选民，计算处理组与控制组之间\
  \ `Moved_AD` 预测概率的差异：\n   `Uplift = P(Moved_AD = 1 | Message = 1) - P(Moved_AD =\
  \ 1 | Message = 0)`\n\n然而，我们感兴趣的不仅仅是信息的整体效果如何，也不仅仅是我们是否可以预测选民观点向有利方向转变的概率。相反，我们的目标是预测信息会对特定选民产生多大（正向）影响。这样，竞选活动就可以将其有限的资源投入到最易说服的选民——即发送信息对其产生最大正面影响的人。\n\
  \n继续示例，表 13.7 显示了反转 Message 的倾向性。表 13.6 显示了用于预测 `Moved_AD` 的逻辑回归模型输出的前几行。\n\n---\n\
  \n### 使用 R 计算提升\n\n我们手动展示的整个过程都可以使用 R 的 uplift 包来完成。我们手动计算与 R 的 uplift 包之间的一个区别在于，我们使用了逻辑回归，而\
  \ uplift 包使用的是随机森林（`upliftRF()`）或 *k*-最近邻分类器（`upliftKNN()`）。表 13.9 显示了在 R 中使用随机森林实现提升分析的结果。输出显示了针对每条记录估计的两个条件概率\
  \ P(Success ∣ Treatment = 1) 和 P(Success ∣ Treatment = 0)。表 13.8 和表 13.9 中值之间的差异由于使用了两种不同的预测算法（逻辑回归与随机森林）。\n\
  \n\n\n\n\n```r\nlibrary(uplift)\nvoter.df <- read.csv(\"Voter-Persuasion.csv\")\n\
  # 将变量 MOVED_AD 转换为数值\nvoter.df$MOVED_AD_NUM <- ifelse(voter.df$MOVED_AD == \"Y\"\
  , 1, 0)\n\nset.seed(1)  \ntrain.index <- sample(c(1:dim(voter.df)[1]), dim(voter.df)[1]*0.6)\
  \  \ntrain.df <- voter.df[train.index, ]\nvalid.df <- voter.df[-train.index, ]\n\
  \n# 使用 upliftRF 应用随机森林（或者使用 upliftKNN() 应用 k-近邻算法）。 \nup.fit <- upliftRF(MOVED_AD_NUM\
  \ ~ AGE + NH_WHITE + COMM_PT + H_F1 + REG_DAYS+ \n                   PR_PELIG +\
  \ E_PELIG + POLITICALC  + trt(MESSAGE_A),\n                 data = train.df, mtry\
  \ = 3, ntree = 100, split_method = \"KL\",\n                 minsplit = 200, verbose\
  \ = TRUE)\npred <- predict(up.fit, newdata = valid.df)\n# 第一列：p(y | treatment) \n\
  # 第二列：p(y | control) \nhead(data.frame(pred, \"uplift\" = pred[,1] - pred[,2]))\n\
  ```\n\nOutput\n  pr.y1_ct1 pr.y1_ct0   uplift\n1  0.356284  0.319376 0.036908\n\
  2  0.489685  0.437061 0.052624\n3  0.380408  0.365436 0.014972\n4  0.379597  0.341727\
  \ 0.037870\n5  0.371465  0.293659 0.077806\n6  0.405424  0.349785 0.055639\n```\n\
  \n| 表 13.9 应用于选民数据的 R 语言提升模型 |\n\n### 使用提升模型的结果\n\n一旦我们估计了每个个体的提升性（uplift），就可以按照提升率对结果进行排序。然后，可以将信息发送给所有具有正提升率的选民，或者如果资源有限，则只发送给子集——即提升率最大的那部分人。\n\
  \n提升模型主要用于营销领域，近期也应用于政治竞选。它有两个主要目的：\n\n*   确定是否向某人发送说服性信息，还是置他们不管。\n*   在确定会发送消息的情况下，在几种可能的消息中确定确定发送哪一条。\n\
  \n从技术上讲，这等于同一件事——“不发送消息”只是另一种处理类别，可以构建一个包含多个处理组的实验，例如：不发消息、消息 A 和消息 B。然而，从业者倾向于将这两个目的视为不同的，并倾向于关注第一个。营销人员希望避免向那些无论如何都会购买或续订的客户发送优惠信息。政治竞选同样也希望避免给那些无论如何都会投他们候选人的选民打电话。而且双方特别希望避免在可能产生反作用的情况下发送信息或提供优惠——即提升率为负的情况。\n\
  \n### 13.3 总结\n\n在实践中，本书中讨论的方法通常不是孤立使用的，而是作为分析过程中的构建模块，其目标始终是提供信息和见解。\n\n在本章中，我们查看了部署多个模型的两种方式。在集成学习中，多个模型通过加权和组合来产生更改进的预测。在提升建模中，A-B\
  \ 测试的结果被作为预测变量折叠到预测建模过程中，不仅指导关于“是否发送优惠或说服性信息”的决策，还指导“发送给谁”。\n\n### 问题\n\n1.  **消费贷款的接受**\
