  \n\n\n2. 查看残差的直方图或概率图，可以发现结果变量（或残差）遵循正态分布的假设被违反了。显然，如果 `Y` 仅取值为 0 和 1，它就不可能呈正态分布。事实上，对于数据集中\
  \ 1 的数量，更合适的分布是二项分布，其中 `p` = `P(Y = 1)`。\n\n3. `Y` 的方差在所有类别中均保持恒定的假设被违反了。由于 `Y`\
