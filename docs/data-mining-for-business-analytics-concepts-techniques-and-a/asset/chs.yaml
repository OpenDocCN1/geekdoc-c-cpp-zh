  \n## 11.2 神经网络的概念与结构\n\n神经网络背后的思想是以一种非常灵活的方式结合预测变量的信息，以捕捉这些变量之间以及它们与结果变量之间复杂的关系。例如，回想一下线性回归模型，结果变量与预测变量之间的关系形式是由用户直接指定的（见第\
  \ 6 章）。在许多情况下，这种关系的确切形式非常复杂，或者通常是未知的。在线性回归建模中，我们可能会尝试预测变量的不同变换、预测变量之间的交互作用等，但指定的关系形式仍然是线性的。相比之下，在神经网络中，用户不需要指定正确的形式。相反，网络会尝试从数据中学习此类关系。事实上，线性回归和逻辑回归可以被视为非常简单的神经网络的特例，这些网络只有输入层和输出层，没有隐藏层。\n\
  \n尽管研究人员已经研究了许多不同的神经网络架构，但神经网络在数据挖掘中最成功的应用是`多层前馈网络`（multilayer feedforward networks）。这类网络包含一个`输入层`（input\
  \ layer），该层由节点（有时称为`神经元`）组成，它们仅接受预测变量的值；以及接收来自前一层输入的连续节点层。每一层节点的输出是下一层结节点的输入。最后一层被称为`输出层`（output\
  \ layer）。输入层和输出层之间的层被称为`隐藏层`（hidden layers）。前馈网络是一种具有单向流且无循环的全连接网络。图 11.1 显示了该架构的示意图，它包含两个隐藏层，输出层中有一个节点，代表要预测的结果值。在一个具有\
  \ `m` 个类别的分类问题中，将会有 `m` 个输出节点（取决于软件，也可能是 `m − 1` 个输出节点）。\n\n![由标题和周围文本描述的图像。](img/c11f001.jpg)\n\
  \n**图 11.1**](#c11.xhtml_figureanchor11-1) 多层前馈神经网络\n\n## 11.3 拟拟合数据\n\n为了说明如何将神经网络拟合到数据，我们从一个非常小的说明性示例开始。尽管这种方法在如此小的示例中完全不具有操作性，但它对于解释主要步骤和操作、展示计算是如何完成的以及整合神经网络数据拟合的所有不同方面是有用的。我们稍后将讨论一个更真实的设定。\n\
  \n### 示例 1：微型数据集\n\n考虑以下非常小的数据集。表 11.1 包含了关于某种加工奶酪品味评分的信息。两个预测变量是脂肪评分和盐分评分，表示特定奶酪样本中脂肪和盐的相对含量（其中\
  \ 0 是制造过程中可能的最小量，1 是最大量）。结果变量是奶酪样本的消费者口味偏好，其中 `like`（喜欢）或 `dislike`（不喜欢）表示消费者是否喜欢奶酪。\n\
  \n| **观测值** | **脂肪评分** | **盐分评分** | **接受度** |\n| --- | --- | --- | --- |\n| 1 |\
  \ 0.2 | 0.9 | like |\n| 2 | 0.1 | 0.1 | dislike |\n| 3 | 0.2 | 0.4 | dislike |\n\
  | 4 | 0.2 | 0.5 | dislike |\n| 5 | 0.4 | 0.5 | like |\n| 6 | 0.3 | 0.8 | like |\n\
  \n**表 11.1**](#c11.xhtml_tableanchor11-1) 关于六个消费者和两个预测变量品味评分的微型示例\n\n图 11.2 描述了一个典型的神经网络示例，该用于基于这些数据预测新消费者的奶酪偏好（`like/dislike`）。我们将示例中的节点从\
  \ 1 到 7 编号。节点 1 和 2 属于输入层，节点 3 到 5 属于隐藏层，节点 6 和 7 属于输出层。连接箭头上的值称为`weights`（权重），从节点\
  \ `i` 到节点 `j` 的箭头上的权重表示为 `w[i, j]`。额外的 `bias`（偏置）节点表示为 `θ[j]`，作为节点 `j` 输出的截距。下将在下方进行更详细的解释。\n\
  \n![显示带有输入层、隐藏层和输出层列的神经网络图，以及对脂肪、盐分、不喜欢、喜欢、theta3, theta4, theta5, w13, w14, w15\
  \ 等的标记。](img/c11f002.jpg)\n\n**图 11.2**](#c11.xhtml_figureanchor11-2) 用于微型示例的神经网络。圆表示节点（“神经元”），箭头上的\
  \ `W[i, j]` 是权重，`θ[j]` 是节点偏置值\n\n### 计算节点的输出\n\n我们分别讨论三种类型层（输入层、隐藏层和输出层）的节点输入和输出。主要区别在于用于从节点输入映射到输出的函数。\n\
  \n输入节点接受预测变量的值作为输入。它们的输出与输入相同。如果我们有 `p` 个预测变量，输入层通常包含 `p` 个节点。\n\n隐藏层节点接收来自上一层的输出作为输入。为了计算隐藏节点的输出，我们计算输入的加权和并应用一个特定的函数\
  \ `g`。更正式地说，对于一组输入值 `x[1], x[2], ..., x[p]`，我们通过取 `θ[j] + ∑(i=1 to p) w[ij]x[i]`\
  \ 来计算节点 `j` 的输出，其中 `θ[j]`（称为节点 `j` 的 `bias`）是控制节点 `j` 贡献水平的常量。在下一步，我们对这个和取函数 `g`。该函数\
  \ `g` 是某种单调函数。示例包括线性函数 `g(s) = bs`、指数函数 `g(s) = exp(bs)` 以及逻辑/sigmoid 函数 `g(s) =\
  \ 1/(1 + e^(-s))`。后一种函数显然是神经网络中最流行的函数。它的实际价值在于它对非常小或大的值具有压缩作用，但在函数值处于 0.1 到 0.9\
  \ 的范围内几乎是线性的。\n\n如果我们使用逻辑激活函数，可以将隐藏层节点 `j` 的输出写为：\n\n```\n(11.1) output_j = 1 /\
  \ (1 + e^(-sum))\n```\n\n### 初始化权重\n\n`θ[j]` 和 `w[ij]` 的值初始化为较小的、通常是随机的数字（通常但不总是，在\
  \ 0.00 ± 0.05 范围内）。这些值代表网络处于无知识状态，类似于没有预测变量的模型。初始权重用于第一轮训练。回到我们的示例，假设节点 3 的初始权重为\
  \ `θ[3] = -0.3`，`w[1, 3] = 0.05` 且 `w[2, 3] = 0.01`（如图 11.3](#c11.xhtml_figure11-3)\
  \ 所示）。\n\n\n\n\n\n# 图 11.3 使用微型示例中的第一条记录（加粗字体）计算计算节点的输出\n\n通过逻辑函数，我们可以计算出隐藏层中节点\
  \ 3 的输出（使用第一条记录）：如下\n\n![numbered Display Equation](img/c11_M0002.gif)\n\n图 11.3\
  \ 显示了我们微型示例中第一条记录的初始权重、输入和输出。如果存在多个隐藏层，则适用相同的计算方法，不同的是第二层、第三层及后续隐藏层的输入值将是前一个隐藏层的输出值。这意味着进入某个节点的输入值数量等于前一层中的节点数量。（如果我们的示例中还有一个额外的隐藏层，那么它的节点将接收来自第一个隐藏层中三个节点的输入。）\n\
  \n最后，输出层从（最后一个）隐藏层获取输入值。它应用与上述相同的函数来创建输出。换句话说，它通过对其输入值进行加权求和，然后应用函数 `g`。在我们的示例中，输出节点\
  \ 6 和 7 接收来自三个隐藏层节点的输入。我们可以通过以下方式计算这些节点的输出：\n\n![numbered Display Equation](img/c11_M0003.gif)\n\
  \n这两个数字几乎就是概率 `P(Y = dislike | Fat = 0.2, Salt = 0.9)` 和 `P(Y = like | Fat = 0.2.\
  \ Salt = 0.9)`。最后一步涉及对这两个值进行归一化，使其和为 1。换句话说：\n\n![numbered Display Equation](img/c11_M0004.gif)\n\
  \n对于分类，我们在概率上使用截断值（针对二分类结果）。使用 0.5 作为截断，我们将该记录分类为*like*（喜欢）。对于具有超过两个类别的应用，我们选择值最大的输出节点。\n\
  \n## 与线性回归和逻辑回归的关系\n\n考虑一个具有单个输出节点且没有隐藏层的神经网络。对于具有 *p* 个预测变量的数据集，输出节点接收 `x[1]`、`x[2]`、\
  \ ..., `x[p]`，对这些值进行加权求和，并应用 `g` 函数。因此，神经网络的输出为 `g(θ + ∑^(p)[i = 1]w[i]x[i])`。\n\
  \n首先，考虑一个数值结果变量 `Y`。如果 `g` 是恒等函数 `[g(s) = s]`，则输出简单为：\n\n![numbered Display Equation](img/c11_M0005.gif)\n\
  \n这等同于多元线性回归的公式！这意味着一个没有隐藏层、单个输出节点且恒等函数 `g` 的神经网络只搜索结果变量与预测变量之间的线性关系。\n\n现在考虑一个二分类输出变量\
  \ `Y`。如果 `g` 是逻辑函数，则输出简单为：\n\n![numbered Display Equation](img/c11_M0006.gif)\n\n\
  这等同于逻辑回归的公式！\n\n在两种情况下，尽管公式等同于线性回归和逻辑回归模型，但得出的权重估计值（线性和逻辑回归中的*系数*）可能会有所不同，因为估计方法不同。神经网络的估计方法不同于*最小二乘法*（线性回归中计算系数的方法），也不同于逻辑回归中使用的*极大似然法*。我们将在下文中解释神经网络学习的方法。\n\
  \n## 数据的预处理\n\n使用逻辑激活函数（R 语言中的选项 `act.fct = ’logistic’`）时，当预测变量和结果变量处于 [0,1] 尺度时，神经网络性能最佳。由于这个原因，所有变量在进入网络之前都应该缩放到\
  \ [0,1] 区间。对于取值范围在 `[a, b]` 之间的数值变量 `X`（其中 `a < b`），我们通过减去 `a` 并除以 `b - a` 对测量值进行归一化。归一化后的值为：\n\
  \n![numbered Display Equation](img/c11_M0007.gif)\n\n注意，如果 `[a, b]` 在 [0,1] 区间内，则原始尺度将被拉伸。\n\
  \n如果 `a` 和 `b` 未知，我们可以从数据中 `X` 的最小值和最大值来估计它们。即使新数据略微超出此范围，导致归一化值略小于 0 或大于 1，也不会对结果产生太大影响。\n\
  \n对于二分类变量，除了创建虚拟变量外不需要其他调整。对于具有 *m* 个类别的分类变量，如果它们本质上是有序的，则在 [0,1] 中选择的 *m* 个分数应反映它们的感知顺序。例如，如果四个有序类别之间的距离相等，我们可以将它们映射到\
  \ `[0, 0.25, 0.5, 1]`。如果类别是无名的，将其转换为 `m - 1` 个虚拟变量是一个很好的解决方案。\n\n另一个提高网络性能的操作是转换极度偏态的预测变量。在业务应用中，往往存在许多高度右偏的变量（例如收入）。对右偏变量进行取对数变换（在转换为\
  \ [0,1] 尺度之前）通常会使数值分布得更对称。\n\n另一个常见的 sigmoid 型函数是双曲正切函数（R 语言中的选项 `act.fct = ’tanh’`）。使用此函数时，最好将预测变量缩放到\
  \ [-1,1] 尺度。\n\n## 模型训练\n\n训练模型意味着估计能够产生最佳结果的权重 `θ[j]` 和 `w[ij]`。我们之前（第 11.6 节）描述的计算神经网络输出的步骤对所有记录重复。对于每个记录，模型产生一个预测，然后与实际值进行比较。\n\
  \n## 误差反向传播\n\n使用模型误差更新权重的最流行的方法被称为*反向传播*。正如名称所示，误差是从最后一层（输出层）向隐藏层计算的。\n\n让我们用 `OPS/images/c11_ILM0001.gif`\
  \ 表示输出节点 `k` 的输出。输出节点 `k` 的误差通过以下方式计算：\n\n![numbered Display Equation](img/c11_M0008.gif)\n\
  \n注意，这类似于误差的普通定义(!OPS/images/c11_ILM0002.））乘以修正因子。然后如下更新权重：\n\n(11.2)![numbered\
  \ Display Equation](img/c11_M0009.gif)\n\n其中 `l` 是学习率或权重衰减参数，是一个通常在 0 到 1 之间的常量，用于控制每次迭代之间权重的变化量。\n\
  \n在我们的示例中，第一条记录与输出节点 7 相关的误差为 `0.506(1 - 0.506)(1 - 0.506) = 0.123`。对于节点 6，误差为 `0.481(1\
  \ - 0.481)(1 - 0.481) = 0.129`。这些误差随后被用于计算与隐藏层节点相关的误差，并使用类似于 11.2 的公式相应更新相应权重。\n\
  \n更新权重有两种方法：*案例更新*和*批量更新*。在案例更新中，每个记录运行网络后都会更新权重（称为一次*试验*）。例如，如果我们在微型示例中使用案例更新，则将在运行第一条记录后首先如下更新权重：使用\
  \ 0.5 的学习率，权重 `θ[7]`、`w[3, 7]`、`w[4, 7]` 和 `w[5, 7]` 更新为：\n\n![numbered Display\
  \ Equation](img/c11_M0010.gif)\n\n\n\n\n同样，我们获得了更新后的权重 `θ[6] = 0.025`、`w[3, 6] =\
  \ 0.045`、`w[4, 6] = 0.035` 和 `w[5, 6] = 0.045`。这些新权重在第二条记录通过网络后再次更新，第三条，依此类推，直到所有记录都被使用。这被称为对数据进行一次\
  \ `epoch`（轮）、`sweep`（扫描）或 `iteration`（迭代）。通常会有多次迭代。\n\n在批量更新中，在每次权重更新之前，整个训练集都会通过网络。在这种情况下，更新方程中的误差\
  \ `err[*k*]` 是所有记录误差之和。在实践中，逐样本更新比批量更新倾向于产生更准确的结果，但需要更长的运行时间。这是一个需要考虑的因素，因为即使在批量更新中，也会对训练数据执行数百次甚至数千次扫描。\n\
  \n更新何时停止？最常见的条件是以下之一：\n\n1. 当新权重与前一次迭代的权重仅有微小差异时\n2. 当误分类率达到所需的阈值时\n3. 当达到运行次数限制时\n\
