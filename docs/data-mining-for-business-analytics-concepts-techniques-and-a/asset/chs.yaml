  \    | 0.02 | |\n\n\n\n\n多元线性回归适用于许多预测建模场景。例如：根据人口统计学特征和历史活动模式预测信用卡客户的活跃情况；根据历史常旅客旅客数据预测假期旅行开支；根据历史数据以及产品和销售信息预测帮助热线的人员需求；根据历史信息预测产品交叉销售的销售额；以及预测折扣对零售店销售额的影响。\n\
  \n## 6.2 解释性建模与预测性建模\n\n在介绍使用线性回归进行预测之前，我们必须澄清一个重要的区别，这种区别往往会被那些早期在统计学课程中熟悉线性回归的人所忽略。具体而言，在拟合回归模型背后的两个流行但不同的目标是：\n\
  \n1. 解释或量化输入对结果的平均影响（分别对应解释性任务或描述性任务）\n2. 在给定输入值的情况下，预测新记录的输出值（预测任务）\n\n经典的统计学方法侧重于第一个目标。在这种情况下，数据被视为来自感兴趣的更大总体的随机样本。从该样本估计出的回归模型试图捕捉更大总体中的`average`\
  \ 关系。该模型随后被用于决策，生成诸如语句：“服务速度 `X[1]` 每增加一个单位，客户满意度 `Y` 平均增加 5 个点，所有其他因素 `X[2]`、`X[3]`、……`X[p]`\
  \ 保持不变。”如果已知 `X[1]` `导致` `Y`，那么这种描述表明了可以操作的政策变化——这被称为解释性建模。当因果结构未知时，该模型量化输入与结果变量之间的\
  \ `association` 程度，这种方法被称为描述性建模。\n\n然而，在预测分析中，重点通常是第二个目标：预测新的个体记录。在这里，我们不感兴趣系数本身，也不关心“平均记录”，而是对该模型能为新记录生成的预测感兴趣。在这种情况下，模型被用于记录层面的微决策。在我们之前的示例中，我们将使用回归模型来预测每个感兴趣的新客户的客户满意度。\n\
  \n解释性建模和预测性建模都涉及使用数据集来拟合模型（即估计系数）、检查模型有效性、评估其性能并与其他模型进行比较。然而，在这两种情况下，建模步骤和性能评估是不同的，这通常会导致不同的最终模型。因此，模型的选择与目标是解释性的还是预测性的紧密相连。\n\
  \n在解释性和描述性建模中，重点是对平均记录进行建模，我们尝试对数据拟合最佳模型，以试图了解总体中的潜在关系。相比之下，预测性建模（数据挖掘）的目标是找到一个最能预测新个体记录的回归模型。对现有数据拟合过好的回归模型在新数据上的表现可能不会良好。因此，我们通过在留集上进行评估并使用预测指标（见第\
  \ 5 章）来寻找具有最高预测能力的模型。\n\n让我们总结一下在两种场景下使用线性回归的主要区别：\n\n1. 一个良好的解释性模型是与数据拟合紧密模型，而一个良好的预测性模型是准确预测新记录的模型。因此，输入变量及其形式的选择可能有所不同。\n\
  2. 在解释性模型中，整个数据集被用于估计最佳拟合模型，以最大化我们关于总体中假设关系的信息量。当目标是预测新个体记录的结果时，数据通常被划分为训练集和验证集。训练集用于估计模型，而验证集或`holdout\
  \ set` 用于评估该模型在新的、未观测数据上的预测性能。\n3. 解释性模型的性能衡量衡量的是数据与模型的拟合程度（模型近似数据的程度）以及平均关系的强弱，而在预测性模型中，性能是通过预测准确率来衡量的（模型预测新个体记录的程度）。\n\
  4. 在解释性模型中，重点是系数 `β`，而在预测性模型中，重点是预测值。\n\n正由于这些原因，在开始建模过程之前知道分析目标是极其重要的。一个良好的预测性模型对其基础数据的拟合程度可能较松，而一个良好的解释性模型的预测准确率可能较低。在这一章的剩余部分，我们关注预测性模型，因为这些模型在数据挖掘中更流行，而且大多数统计教科书侧重于解释性建模。\n\
  \n## 6.3 估计回归方程与预测\n\n一旦我们确定了要包含的预测变量及其形式，我们就使用名为`普通最小二乘法` (`OLS`）的方法从数据中估计回归公式的系数。这种方法找到使实际结果值\
  \ `Y` 与基于该模型的预测值之间的平方偏差和最小化的值。\n\n为了预测预测变量值为 `x[1]`、`x[2]`、……`x[p]` 的记录的结果变量值，我们使用方程\n\
  \n(6.2)\n\n基于此方程的预测是可能的最佳预测，其意义在于如果 `if` 我们满足以下假设，它们将是无偏的（平均等于真实值），并且与任何无偏估计相比，将具有最小的均方误差：\n\
  \n1. 噪声 `ε`（或等效的 `Y`）遵循正态分布。\n2. 预测变量的选择及其形式是正确的（`线性`）。\n3. 各记录之间相互独立。\n4. 对于给定的预测变量，结果值的变异性无论预测变量值如何都是相同的（`同方差`）。\n\
  \n对于预测目标来说，一个重要且有趣的事实是，即使我们放弃第一个假设并允许噪声遵循任意分布，这些估计对于预测来说是非常好的，其意义在于在所有由方程 (6.1)\
  \ 定义的线性模型中，使用最小二乘估计的模型将具有最小的均方误差。正态分布假设在解释性建模中是需要的，因为它用于构建置信区间对模型参数进行统计检验。\n\n###\
  \ 示例：预测二手丰田罗拉的价格\n\n\n\n\n一家大型丰田汽车经销商为购买新丰田汽车的客户提供将旧车以旧换新的选项。特别是一项新促销活动承诺为购买新车的客户购买旧丰田卡罗拉（Corolla）汽车提供高价。随后，经销商以小额利润出售这些旧车。为了确保合理的利润，经销商需要能够预测其旧车可能获得的价格。为此，我们收集了该经销商之前销售的所有旧丰田卡罗拉汽车的数据。这些数据包括销售价格以及有关汽车的其他信息，如车龄、里程数、燃料类型和发动机排量。每个变量的描述请见表\
  \ 6.1。该数据集的样本见表 6.2。数据集中的记录总数为 1000 辆车（我们使用了数据集 `ToyotoCorolla.csv` 中的前 1000 辆车）。在将数据划分为训练集（60%）和验证集（40%）后，我们仅使用训练集在价格（结果变量）与其他变量（预测变量）之间拟合了一个多元线性回归模型。表\
  \ 6.3 显示了估计的系数。注意燃料类型（Fuel Type）预测变量有三个类别（`Petrol`、`Diesel` 和 `CNG`）。因此，我们在模型中有两个虚拟变量：`Fuel_TypePetrol`\
  \ (0/1) 和 `Fuel_TypeDiesel` (0/1)；第三个变量 `CNG` (0/1) 在已有前两个虚拟变量信息的情况下是冗余的。包含冗余变量会导致回归失败，因为该冗余变量将是另外两个变量的完美线性组合；R\
  \ 的 `lm` 程会自动处理此问题。\n\n| 变量 | 描述 |\n| --- | --- |\n| Price | 欧元报价价格 |\n| Age | 截至\
