  \n```\n用于数据标准化和寻找最近邻居的代码\n```\n\n```\n# 初始化归一化的训练数据、验证数据以及原始完整数据框\ntrain.norm.df\
  \ <- train.df\nvalid.norm.df <- valid.df\nmower.norm.df <- mower.df\n# 使用 caret\
  \ 包中的 preProcess() 对 Income 和 Lot_Size 进行标准化。\nnorm.values <- preProcess(train.df[,\
  \ 1:2], method=c(\"center\", \"scale\"))\ntrain.norm.df[, 1:2] <- predict(norm.values,\
