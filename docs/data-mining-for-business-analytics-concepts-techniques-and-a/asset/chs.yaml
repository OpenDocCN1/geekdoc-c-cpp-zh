  \    * 调整模型参数以获得验证数据的良好拟合\n    * 查看训练集的 `MAPE` 和 `RMSE` 值\n    * 查看验证集的 `MAPE` 和\
  \ `RMSE` 值\n\n# 第 17 章\n\n## 基于回归的预测\n\n一种流行的预测工具是基于多元线性回归模型，使用适当的预测变量来捕捉趋势和/或季节性。在本章中，我们将展示如何建立线性回归模型来捕捉具有趋势和/或季节性的时间序列。该模型通过数据估计，然后可以通过将相关的预测变量信息插入估计的回归方程中产生未来预测。我们描述了不同类型的常见趋势（线性、指数、多项式），以及两种类型的季节性（加法和乘法）。接下来，我们展示了如何使用回归模型来量化时间序列中相邻值之间的相关性（称为自相关）。这种模型被称为自回归模型，它通过利用自相关中包含的信息（趋势和季节性之外）来提高预测精度。\n\
  \n### 17.1 带有趋势的模型\n\n从时间序列图中可以看出，全局趋势不是线性的。然而，我们使用这个例子来说说明如何拟合线性趋势。为了获得客流量（Ridership）与时间之间的线性关系，我们将输出变量\
  \ `Y` 设置为客流量，并创建一个新的时间索引 `t` = 1, 2, 3, …… 该时间索引随后作为回归模型中的单一预测变量：\n\n```\nlibrary(forecast)\n\
  Amtrak.data <- read.csv(\"Amtrak.csv\")\n\n### 创建时间序列\nridership.ts <- ts(Amtrak.data$Ridership,\
  \ start = c(1991,1), end = c(2004), freq = 12)\n\n### 产生线性模型\nridership.lm <- tslm(ridership.ts\
  \ ~ trend)\n\n### 绘制序列\nplot(ridership.ts, xlab = \"Time\", ylab = \"Ridership\"\
  , ylim = c(1300,2300), bty = \"l\")\nlines(ridership.lm$fitted, lwd = 2)\n```\n\n\
  ![图显示了从 1970 年到 2000 年与每周 34.5 到 38.0 小时的对比。](img/c17f005.jpg)\n\n图 17.1 客流量的趋势拟合\n\
  \n为了获得客流量与时间之间的线性关系，我们将客流量设置为 Amtrak 客流量，并创建一个新的时间索引 `t` = 1, 2, 3, …… 该时间索引随后作为回归模型中的单一预测变量：\n\
  \n![编号方程](img/c17_M01.gif)\n\n其中 `Y[t]` 是 `t` 期的客流量，`ε` 是线性回归中的标准噪声项。因此，我们正在模拟四个时间序列成分中的三个：水平（`β[0]`）、趋势（`β[1]`）和噪声（`ε`）。季节性未被建模。对应的两列（`Y`\
  \ 和 `t`）所示表 17.1。\n\n| 月份 | 客流量 (*Y[t]*) | *t* |\n| --- | --- | --- |\n| 1991 年\
  \ 1 月 | 1709 | 1 |\n| 1991 年 2 月 | 1621 | 2 |\n| 1991 年 3 月 | 1973 | 3 |\n| 1991\
  \ 年 4 月 | 1812 | 4 |\n| 1991 年 5 月 | 1975 | 5 |\n| 1991 年 6 月 | 1862 | 6 |\n| 1991\
  \ 年 7 月 | 1940 | 7 |\n| 1991 年 8 月 | 2013 | 8 |\n| 1991 年 9 月 | 1596 | 9 |\n| 1991\
  \ 年 10 月 | 1725 | 10 |\n| 1991 年 11 月 | 1676 | 11 |\n| 1991 年 12 月 | 1814 | 12 |\n\
  | 1992 年 1 月 | 1615 | 13 |\n| 1992 年 2 月 | 1557 | 14 |\n\n表 17.1 用于拟合线性趋势的输出变量（中间）和预测变量（右侧）\n\
  \n\n\n\n将数据划分为训练集和验证集后，下一步是在训练集上拟合线性回归模型，以 `t` 作为单一预测变量（函数 `tslm()` 依赖于 `ts()`，该函数会自动创建\
  \ `t` 并将其命名为 `trend`）。将此应用于 Amtrak 乘客量数据（验证集包含最后 12 个月），得到如图 17.2 所示的估计模型。实际值、拟合值以及残差（或预测误差）显示在两个时间图中。\n\
  \n```\n# 创建图 17.2 的代码\n```\n\n```r\n# 在训练集上拟合线性趋势模型并创建预测\ntrain.lm <- tslm(train.ts\
  \ ~ trend)\ntrain.lm.pred <- forecast(train.lm, h = nValid, level = 0)\n\npar(mfrow\
  \ = c(2, 1))\nplot(train.lm.pred, ylim = c(1300, 2600),  ylab = \"Ridership\", xlab\
  \ = \"Time\", \n     bty = \"l\", xaxt = \"n\", xlim = c(1991,2006.25), main = \"\
  \", flty = 2)\naxis(1, at = seq(1991, 2006, 1), labels = format(seq(1991, 2006,\
  \ 1)))\nlines(train.lm.pred$fitted, lwd = 2, col = \"blue\")\nlines(valid.ts)\n\
  plot(train.lm.pred$residuals, ylim = c(-420, 500),  ylab = \"Forecast Errors\",\
  \ \n    xlab = \"Time\", bty = \"l\", xaxt = \"n\", xlim = c(1991,2006.25), main\
  \ = \"\")\naxis(1, at = seq(1991, 2006, 1), labels = format(seq(1991, 2006, 1)))\n\
  lines(valid.ts - train.lm.pred$mean, lwd = 1)\n```\n\n数据划分的代码见图 16.4。\n\n![图显示了\
  \ 1991 年到 2005 年的时间与 1400 到 2600 的乘客量，以及 -400 到 400 的预测误差的对比，包含训练、验证和未来的图表。](img/c17f002.jpg)\n\
  \n**图 17.2** 训练期内 Amtrak 乘客量的线性趋势拟合，以及在验证期内的预测。\n\n表 17.2 包含了估计系数的报告。请注意，仅检查估计系数及其统计显著性可能会产生误导！在例例中，它们会表明线性拟合是合理的，尽管从时间图中可以明显看出趋势并不是线性的。通过检查残差的时间图最容易检测出趋势形状不当。\n\
  \n```r\n> summary(train.lm)\n\nCall: lm(formula = formula, data = \"train.ts\",\
  \ na.action = na.exclude)\n\nResiduals:\n    Min      1Q  Median      3Q     Max\
  \ \n-411.29 -114.02   16.06  129.28  306.35 \n\nCoefficients:\n             Estimate\
  \ Std. Error t value Pr(>&#124|t&#124|)    \n(Intercept) 1750.3595    29.0729  60.206\
  \   <2e-16 ***\ntrend          0.3514     0.4069   0.864     0.39    \n---\nSignif.\
  \ codes:  0 *** 0.001 ** 0.01 * 0.05 .0.1   1\n\nResidual standard error: 160.2\
  \ on 121 degrees of freedom\nMultiple R-squared:  0.006125,\tAdjusted R-squared:\
  \ -0.002089 \nF-statistic: 0.7456 on 1 and 121 DF,  p-value: 0.3896\n```\n\n**表\
  \ 17.2** 应用于训练期 Amtrak 乘客量数据的线性回归模型输出摘要。\n\n### 指数趋势\n\n几种替代的趋势形状非常有用，且能通过线性回归模型易于拟合。其中一种形状就是指数趋势。指数趋势意味着序列随时间呈乘法增长/减少（![](img/c17_ILM0001.gif)）。要拟合指数趋势，只需将结果变量\
  \ `Y` 替换为 `log Y`（其中 `log` 是自然对数），并拟合线性回归（`log Y[t] = β[0] + β[1]t + ε`）。例如，在 Amtrak\
  \ 示例中，我们将对索引变量 `t` 进行 `log (Ridership)` 的线性回归。指数趋势在销售数据中非常流行，因为它们反映了百分比增长。在 R 中，通过在函数\
  \ `tslm()` 中设置参数 `lambda = 0` 来拟合指数趋势（2）。**注**：在一般情况下，为了比较预测精度，当使用 `log Y` 拟合指数趋势时，必须将预测转换回原始尺度。这在图\
  \ 17.3 中显示，其中对 Amtrak 拟合了指数趋势。\n\n```r\n# 创建图 17.3 的代码\n```\n\n```r\n# 使用 lambda\
  \ = 0 拟合指数趋势\ntrain.lm.expo <- tslm(train.ts ~ trend, lambda = 0)\ntrain.lm.pred.pred\
  \ <- forecast(train.lm.expo, h = nValid, level = 0)\n\n# 使用 lambda = 1 拟合线性趋势\n\
  train.lm.linear <- tslm(train.ts ~ trend, lambda = 1)\ntrain.lm.pred.linear <- forecast(train.lm.linear,\
  \ h = nValid, level = 0)\n```\n\n### 多项式趋势\n\n另一种通过线性回归模型易于拟合的非线性形状是多项式趋势。一种常见的形状是二次趋势。二次趋势意味着序列随时间呈现非线性增长/减少（![](img/c17_ILM0001.gif)）。要拟合二次趋势，只需在预测变量\
  \ `t` 中引入平方项 `t²` 并拟合线性回归（`Y[t] = β[0] + β[1]t + β[2]t² + ε`）。在 Amtrak 示例中，我们将对索引变量\
  \ `t` 和 `t²` 进行 `log (Ridership)` 的线性回归。在 R 中，通过在 `tslm()` 函数中使用 `I(t²)` 来拟合二次趋势。\n\
  \n```r\n# 创建图 17.4 的代码\n```\n\n```r\n# 使用 I(t²) 拟合二次趋势\ntrain.lm.poly <- tslm(train.ts\
  \ ~ trend + I(trend²))\ntrain.lm.pred.poly <- forecast(train.lm.poly, h = nValid,\
  \ level = 0)\n\npar(mfrow = c(2, 1))\nplot(train.lm.pred.poly, ylim = c(1300, 2600),\
  \  ylab = \"Ridership\", xlab = \"Time\", \n     bty = \"l\", xaxt = \"n\", xlim\
  \ = c(1991,2006.25), main = \"\", flty = 2)\naxis(1, at = seq(1991, 2006, 1), labels\
  \ = format(seq(1991, 2006, 1)))\nlines(train.lm.pred.poly$fitted, lwd = 2, col =\
  \ \"blue\")\nlines(valid.ts)\nplot(train.lm.pred.poly$residuals, ylim = c(-400,\
  \ 500),  ylab = \"Forecast Errors\", \n    xlab = \"Time\", bty = \"l\", xaxt =\
  \ \"n\", xlim = c(1991,2006.25), main = \"\")\naxis(1, at = seq(1991, 2006, 1),\
  \ labels = format(seq(1991, 2006, 1)))\nlines(valid.ts - train.lm.pred.poly$mean,\
  \ lwd = 1)\n```\n\n![图显示了 1991 年到 2005 年的时间与 1400 到 2600 的乘客量，以及 -400 到 400 的预测误差的对比，包含训练、验证和未来的图表。](img/c17f004.jpg)\n\
  \n**图 17.4** 用于预测 Amtrak 乘客量的二次趋势模型。\n\n\n\n\n\n通常情况下，只要具有数学表达式，任何类型的趋势形状都可以进行拟合。然而，其隐含假设是该形状适用于我们拥有的整个数据期间，也适用于我们未来要预测的期间。不要选择过于复杂的形状。尽管它能很好地拟合训练数据，但实际上会对数据产生过拟合。为了避免过拟合，请务必检查验证集的性能，并避免选择过于复杂的趋势模式。\n\
  \n## 17.2 带有季节性的模型\n\n时间序列中的季节性意味着落在某些季节的观测值始终高于或低于其他季节的观测值。例如，周内模式、月份模式和季度模式。如时间图所示，阿特拉克（Amtrak）客运量的月度时间序列显示出强烈的月份季节性（夏季月份流量最高）。\n\
  \n回归模型通过创建一个新的分类变量（用于表示每个值所属的季节）来捕捉季节性。然后，将该分类变量转换为虚拟变量（dummies），并将其作为预测变量包含在回归模型中。为了说明这一点，我们为阿特拉克客运量数据创建了一个新的\
  \ `Season` 列，所示表 17.3。然后，为了将 `Season` 分类变量作为 `Y`（客运量）回归模型的预测变量，我们将其转换为虚拟变量（对于 `m`\
  \ = 12 个季节，我们创建了 11 个虚拟变量，这些是二进制变量，如果记录落在特定季节，则值为 1，否则为 0^(3）。\n\n| Month | Ridership\
  \ | Season |\n| :--- | :--- | :--- |\n| Jan 91 | 1709 | Jan |\n| Feb 91 | 1621 |\
  \ Feb |\n| Mar 91 | 1973 | Mar |\n| Apr 91 | 1812 | Apr |\n| May 91 | 1975 | May\
  \ |\n| Jun 91 | 1862 | Jun |\n| Jul 91 | 1940 | Jul |\n| Aug 91 | 2013 | Aug |\n\
  | Sep 91 | 1596 | Sep |\n| Oct 91 | 1725 | Oct |\n| Nov 91 | 1676 | Nov |\n| Dec\
  \ 91 | 1814 | Dec |\n| Jan 92 | 1615 | Jan |\n| Feb 92 | 1557 | Feb |\n| Mar 92\
  \ | 1891 | Mar |\n| Apr 92 | 1956 | Apr |\n| May 92 | 1885 | May |\n\nTable 17.3**\
  \ 新的分类变量（右侧），用于（通过虚拟变量）线性回归模型的预测变量\n\n在 R 中，函数 `tslm()` 使用 `ts()` 自动创建分类 `Season`\
  \ 列（称为 `season`）并将其转换为虚拟变量。\n\n在将数据划分为训练集和验证集后（见第 16.5 节），我们对训练数据拟合回归模型。拟合后的序列和该模型的残差所示图\
  \ 17.5。该模型似乎捕捉到了数据中的季节性。然而，由于我们没有在模型中包含趋势成分（如 17.2 节所示），拟合值并未捕捉到现有的趋势。因此，残差（实际值与拟合值之间的差）清晰地显示了剩余的\
  \ U 形趋势。\n\n![图显示了 1991 年到 2005 年相对于 1400 到 2600 的客运量以及 -400 到 400 的预测误差，包含训练、验证和未来的图。](img/c17f005.jpg)\n\
  \nFigure 17.5** 应用于阿特拉克客运量的季节性回归模型（顶部）及其预测误差（底部）\n\n按照上述方法添加季节性（创建分类季节变量，然后从其创建虚拟变量，然后对\
  \ `Y` 进行回归），捕捉的是`加法季节性`。这意味着某个季节内 `Y` 的平均值比另一个季节多或少一个固定量。表 17.4 显示了带有季节性的客运量 (`Y`)\
  \ 线性回归拟合的输出。例如，在阿特拉克客运量中，`season8` 的系数 (396.66) 表示 8 月的平均人数比 1 月（参考类别）平均高 396.66\
  \ 万。使用回归模型，我们还可以捕捉`乘法季节性`，即某个季节的数值平均与另一个季节相比按百分比更高或更低。要拟合乘法季节性，我们使用与上面相同的模型，但使用\
  \ `log (Y)` 作为结果变量。在 R 中，这通过在 `tslm()` 函数中设置 `lambda=0` 实现。\n\n```\n> # 在 tslm()\
  \ 中包含 season 作为预测变量。这里创建了 11 个虚拟变量，\n> 除了第一个季节一月之外，每个月一个。\n> train.lm.season <-\
  \ tslm(train.ts ~ season)\n> summary(train.lm.season)\n```\n\nTable 17.4** 对训练期间客运量拟合加法季节性的输出摘要\n\
  \n## 17.3 带有趋势和季节性的模型\n\n最后，我们可以通过包含两种类型的预测变量来创建捕捉趋势和季节性的模型。例如，通过对阿特拉克客运量数据的探索，二次趋势和月份季节性似乎都是必要的。因此，我们对训练数据拟合了一个包含\
