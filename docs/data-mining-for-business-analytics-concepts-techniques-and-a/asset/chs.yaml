  \ 最差，空白 = 未参加\n\n# 第 15 章：聚类分析\n\n本章介绍了流行的无监督学习任务——聚类，其目标是将数据划分为一组同质的记录簇，以产生洞察。将数据集划分为同质记录簇对于提高监督学习方法的性能也有帮助，因为可以通过对每个簇进行单独建模，而不是对整个异质数据集进行建模。聚类被应用于各种业务场景中，从定制营销到行业分析。我们描述了两种流行的聚类方法：`层次聚类`和`k-means\
  \ 聚类`。在层次聚类中，根据记录之间的距离和簇之间的距离按顺序对记录以创建簇。我们从聚类过程描述了算法的工作原理，并提到了几种常用的距离度量。层次聚类还能产生聚类过程和结果的有用图形显示，称为树图。我们展示了树图并说明了它们的用处。`k-means\
  \ 聚类`被广泛应用于大型数据集。在`k-means 聚类`中，根据记录与其预设簇的距离将其分配到其中之一。我们描述了`k-means 聚类`算法及其计算优势。最后，我们介绍了一些有助于从聚类结果中产生洞察的技术。\n\
  \n## 15.1 引言\n\n聚类分析用于根据对记录的几项测量形成相似记录的组或簇。其核心思想是以有利于分析目标的方式来表征簇。这一思想已应用于许多领域，包括天文学、考古学、医学、化学、教育、心理学、语言学和社会学。例如，生物学家已广泛利用类和亚类来组织物种。聚类思想在化学领域的一个巨大成功是门捷列夫元素周期表。\n\
  \n营销中聚类分析的一个流行用途是`市场细分：`根据人口统计和交易历史信息对客户进行细分，并为每个细分市场身定制营销策略。在印度等客户多样性对位置极其敏感的国家，连锁店通常在门店层面进行市场细分，而不是整个连锁范围（称为“微细分”）。另一个用途是`市场结构分析：`根据竞争性的相似性衡量识别相似产品组。在营销和政治预测中，利用美国邮政编码对社区进行聚类已成功用于根据生活方式对社区分组。这种方法的先驱者\
  \ Claritas 公司利用各种消费支出和人口统计指标将社区分为 40 个簇。通过检查这些簇，Claritas 能够为捕捉主要生活方式的群体起富有生感的名称，例如“波西米亚混合风”（Bohemian\
  \ Mix）、“皮草与旅行车”（Furs and Station Wagons）以及“金钱与大脑”（Money and Brains）。对生活方式的了解可以用于对产品（如运动多用途汽车）和服务（如休闲游轮）的潜在需求进行估计。同样，销售组织将推导出客户细分并为其命名为“画像”（personas）——以集中销售精力。\n\
  \n在金融领域，聚类分析可用于创建`平衡投资组合`：给定各种投资机会（如股票）的数据，人们可以根据收益率（每日、每周或每月）、波动性、Beta 值以及行业和市值等财务性能变量和其他特征发现聚类。从不同的簇中选择证券有助于创建平衡的投资组合。聚类分析在金融领域的另一个应用是`行业分析：`对于给定的行业，我们感兴趣根据增长率、盈利能力、市场规模、产品范围以及在各个国际市场的存在情况等指标寻找相似的公司组。然后可以对这些组进行分析，以理解行业结构并确定（例如）谁是竞争对手。Berry\
  \ 和 Linoff (1997) 描述的聚类分析的一个有趣且异常的应用是为美国陆军女性设计一套新的尺码。该研究提出了一种仅有 20 个尺码的新服装尺寸系统，不同的尺码适应不同的体型。这\
  \ 20 个尺码是五个测量值的组合：胸围、颈围和肩围、袖外长以及颈到臀部的长度（更多细节请参见 McCull 等人，1998）。这个例子很重要，因为它展示了如何通过检查记录簇获得全新的、具有洞察力的观点。\n\
  \n聚类分析可以应用于海数据。例如，互联网搜索引擎使用聚类技术对用户提交的查询进行聚类。这些查询可以用于改进搜索算法。本章的目标是描述聚类分析最常用技术背后的核心思想，并阐述它们的优缺点。\n\
  \n通常，用于形成簇的基本数据是一个包含多个变量测量的表，其中每列代表一个变量，每行代表一条记录。我们的目标形成记录组，使得相似的记录位于同一组。簇的数量可以是预指定的。\n\
