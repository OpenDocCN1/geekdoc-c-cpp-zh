  \ 募捐数据集变量描述\n\n### 任务\n\n* **步骤 1：分区。** 将数据集分为 60% 训练集和 40% 验证集（设置种子为 `12345`）。\n\
  \n* **步骤 2：建模。** 按照以下步骤构建、评估并选择模型。\n\n    1. *选择分类工具和参数。* 运行至少两个你选择的分类模型。确保在分析中不使用\
  \ `TARGET_D`。描述你选择的两个模型，提供足够的细节（方法、参数、变量等）以便复制。\n\n    2. *非对称响应和成本下的分类。* 使用加权采样产生捐赠者和非捐赠者数量相等的训练集的原理是什么？为什么不直接从原始数据集进行简单随机采样？\n\
  \n\n\n\n\n### \n\n3. *计算净利润。* 对于每种方法，根据实际响应率（5.1%）计算训练集和验证集的净利润提升率（lift）。同样，假设他们是捐赠者，预期捐赠金额为\
  \ 13.00 美元，每封邮件的总成本为 0.68 美元。（*提示*：要计算估的净利润，我们需要抵消加权采样的影响，并计算出反映 5.1% 捐赠者和 94.9%\
  \ 非捐赠者实际响应分布的净利润。为了做到这一点，将每行的净利润除以适用于该行实际状态的过采样权重。实际捐赠者的过采样权重为 50%/5.1% = 9.8。实际非捐赠者的过采样权重为\
  \ 50%/94.9% = 0.53。）\n\n4. *绘制提升曲线。* 将每个模型在验证集的净利润提升曲线绘制在同一张图上（*y* 轴为净利润，*x* 轴为列表比例或邮寄数量）。是否存在占据主导地位的模型？\n\
  \n5. *选择最佳模型。* 根据你在第 (4) 问的回答，你认为哪个是“最佳模型？\n\n#### 步骤 3：测试`FutureFundraising.csv`\
  \ 文件包含未来邮寄候选人的属性。\n\n1. 使用你在步骤 2（第 5 点）中的“最佳”模型，预测这些候选人哪些是捐赠者哪些是非捐赠者？按捐赠概率从高到低列出。从此排序列表的顶部开始，在邮寄活动中大约会进行到哪里？\n\
  \n## 21.8 目录交叉销售\n\n`CatalogCrossSell.csv` 是本案例的数据集。\n\n### 背景\n\nExeter, Inc. 是一家目录公司，在其拥有的多个不同目录中销售产品。目录多达几十个，但分为九大类：\n\
  \n1. 服装\n2. 家用品\n3. 健康\n4. 汽车\n5. 个人电子产品\n6. 计算机\n7. 园艺\n8. 新奇礼品\n9. 珠宝\n\n打印和分发目录的成本很高。到目前，最大的运营成本是向不购买任何东西的人推广产品的成本。Exeter\
  \ 在艺术品制作和目录打印上投入了大量资金，希望利用一切机会有效利用它们。其中一个机会就是交叉销售——一旦客户“上了钓钩”并购买了一种产品，就在你获得他们注意力时尝试向他们销售另一种产品。\n\
  \n这种交叉促销的形式可能是：在购买产品的货中随附一份目录，并附上一张折扣券以诱导购买该目录的产品。或者，也可能是通过电子邮件发送类似的优惠券，并带有指向该目录网页版本的链接。\n\
  \n但是，哪种目录应该放入箱中或作为链接包含在折扣券的电子邮件中呢？Exeter 希望这是一个明智的选择——一个比简单随机选择目录具有更高购买诱导概率的目录。\n\
  \n### 任务\n\n使用数据集 `CatalogCrossSell.csv` 进行关联规则分析（分析，并对结果进行评论。你的讨论应用英文对各种输出统计量（提升率、置信度、支持度）的含义提供解释，并非常粗略地估算（不需要精确计算）这将在多大程度上帮助\
  \ Exeter 对向购买者交叉促销哪种目录做出明智的选择。\n\n### 致谢\n\n本案例的数据改编自直接营销教育基金会（DMEF）为教育目的提供的一组案例（“DMEF\
  \ Academic Data Set Two, Multi Division Catalog Company, Code: 02DMEF”）；经许可使用。\n\
  \n## 21.9 预测破产\n\n`Bankruptcy.csv` 是本案例的数据集。\n\n### 21.9.1 预测企业破产\n\n正如医生检查血压和脉搏作为患者健康的关键指标一样，业务分析师查阅公司的财务报表以监控其财务状况。然而，血压、脉搏和大多数医疗生命体征是通过精确定义的程序测量的，而财务变量根据根据不具体的通用会计原则记录的。因此，财务分析中的一个主要问题是，公司的健康状况有多可预测性？\n\
  \n分析财务报告信息的一个困难在于缺乏实际现金收入和支出的披露。财务报表的用户不得不依赖现金流的代理，其中最简单的可能是收入（`INC`）或每股收益。改进 `INC`\
  \ 作为现金流代理的尝试包括使用收入加旧（`INCDEP`）、经营运资金（`WCFO`）和经营活动现金流量（`CFFO`）。`CFFO` 通过对经营收入调整所有非现金支出和收入，以及调整流动资产和流动负债账户的变化获得。\n\
  \n每当会计标准发生重大变化时，解释历史财务披露信息的困难随之增加。例如，财务会计标准委员会在 20 世纪 70 年中期发布了多项公告，改变了有关权益收益、外汇损益和递延税等应产生报告的要求。此类变化的影响之一是利润数字成为现金流可靠性较低的指标。\n\
  \n鉴于解释会计信息的这些困难，企业健康的重要生命体征是什么？现金流是一个重要信号吗？如果不是，是什么？如果是，近似现金流的最佳方法是什么？我们可以预测公司即将到来的终结吗？\n\
  \n为了回答这些重要问题，我们对破产和健康公司的财务生命体征进行了研究。我们首先从邓白氏公司（Dun and Bradstreet）提供的列表中识别出 66 家倒闭企业。这些公司属于制造业或零售业，拥有\
  \ 1970 年至 1982 年间的 Compustat 财务数据。对于这 66 家倒闭公司中的每一家，我们选择了一个规模相似（以资产面值衡量）、行业相同（3\
  \ 位 SIC 代码）的健康公司作为比较基础。这种匹配样本技术用于减少外部因素（如行业）对研究结论的影响。该研究旨在观察如何提前两年预测破产。我们使用破产年份两年前的\
  \ Compustat 数据和 Moody’s 工业手册为每家公司计算了 24 个财务比率。表 21.10 列出了这 24 个比率以及基础财务变量的缩写解释。这些变量都包含在年度报告中，`CFFO`\
  \ 除外。\n\n| **缩写** | **财务变量** | **比率** | **定义** |\n| --- | --- | --- | --- |\n| `ASSETS`\
  \ | 总资产 | `R[1]` | `CASH/CURDEBT` |\n| `CASH` | 现金 | `R[2]` | `CASH/SALES` |\n|\
  \ `CFFO` | 经营现金流量 | `R[3]` | `CASH/ASSETS` |\n| `COGS` | 销售成本 | `R[4]` | `CASH/DEBTS`\
  \ |\n| `CURASS` | 流动资产 | `R[5]` | `CFFO/SALES` |\n| `CURDEBT` | 流动负债 | `R[6]` |\
  \ `CFFO/ASSETS` |\n| `DEBTS` | 总债务 | `R[7]` | `COGS/INV` |\n| `INC` | 收入 | `R[8]`\
  \ | `CURASS/CURDEBT` |\n| `INCDEP` | 收入加旧 | `R[9]` | `CURASS/SALES` |\n| `INV` |\
  \  way | `R[10]` | `CURASS/ASSETS` |\n| `REC` | 应收账款 | `R[11]` | `CURDEBT/DEBTS`\
  \ |\n| `SALES` | 销售 | `R[12]` | `INC/SALES` |\n| `WCFO` | 经营运资金 | `R[13]` | `INC/ASSETS`\
  \ |\n| | | `R[14]` | `INC/DEBTS` |\n| | | `R[15]` | `INCDEP/SALES` |\n| | | `R[16]`\
  \ | |\n\n\n\n\n\n| | | R[17] | 净收入/资产 |\n| | | R[18] | 净收入/负债 |\n| | | R[19] | 销售/应收\
  \ |\n| | | R[20] | 销售/资产 |\n| | | R[21] | 资产/负债 |\n| | | R[22] | WCFO/销售 |\n| |\
  \ | R[23] | WCFO/资产 |\n| | | R[24] | WCFO/负债 |\n\n**表 21.10** 预测企业破产：财务变量与比率\n\n\
  前四个以 `CASH` 为分子的比率可以被视为衡量企业用于偿债的现金储备量。三个以 `CURASS` 为分子的比率衡量了企业用于偿债的流动资产产生能力。两个比率\
  \ `CURDEBT/DEBT` 和 `ASSETS/DEBTS` 衡量了企业的债务结构。存货和应收账款周转率通过 `COGS/INV` 和 `SALES/REC`\
  \ 衡量，而 `SALES/ASSETS` 衡量了企业的销售能力。最后的 12 个比率是资产流量衡量指标。\n\n### 作业\n\n1. 采用什么数据挖掘技术可以评估是否存在一组传达相同信息的变量，以及这些信息有多重要？请进行此类分析。\n\
  \n2. 评价对破产企业特征进行画像描述与简单预测（黑箱模式）企业是否会破产的目标有何不同，并讨论这两个目标（或仅其中一个）是否有用。还要对每种情况下合适的分类方法进行评论。\n\
  \n3. 探索数据，以初步了解哪些变量对于区分破产企业和非破产企业可能重要。（*提示*：作为此分析的一部分，请使用并列箱线图，并将破产/非破产变量作为 `x`\
  \ 变量。）\n\n4. 使用你选择的分类器，利用 `R` 生成几个模型来预测企业是否会破产，并在验证划分集上评估模型性能。\n\n5. 根据上述结果，说明哪些变量在分类中是重要的，并讨论它们的影响。\n\
  \n## 21.10 时间序列案例：预测公共交通需求\n\n`bicup2006.csv` 是本案例研究的数据集。\n\n### 背景\n\n预测交通需求对于人员配备、规划和库存控制等多个目的都非常重要。智利圣哥的公共交通系统经历了一项巨大的重建工作。在此背景下，2006\
  \ 年 10 月举行了一场商业智能竞赛，重点是预测公共交通的需求。本案例基于该竞赛并进行了一些修改。\n\n### 问题描述\n\n一家公共交通公司预计服务需求将增加，并计划购买新公交和扩展终站。这些投资需要对未来需求的可靠预测。为了创建此类预测，可以使用历史需求数据。公司的数据仓库存储了每天\
  \ 6:30 到 22:00 之间每 15 分钟间隔到达终站的人数数据。作为一名预测顾问，你被要求创建一种能够生成终站人数预测的预测方法。\n\n### 可用数据\n\
  \n部分历史信息可用文件 `bicup2006.csv` 提供。该文件包含“历史信息”（Historic Information）工作表，其中有 3 周时间的已知需求，按每\
  \ 15 分钟间隔划分。第二个工作表（“未来”，Future）包含了未来 3 天的日期和时间，需要对这些时间生成预测（作为 2006 年竞赛的一部分）。\n\n\
  ### 作业目标\n\n你的目标是创建一个产生准确预测的模型/方法。为了评估你的准确性，请将给定的历史数据分为两个时期：训练期（前两周）和验证期（最后一周）。模型应仅在训练数据上拟合，并在验证数据上进行评估。\n\
  \n尽管竞赛的获胜标准是未来 3 天数据的平均绝对误差 (`MAE`) 最低，但这*不是*本次作业的目标。相反，如果我们考虑更真实的业务背景，我们的目标是创建一个在任何时间/周几内都能生成相当良好预测的模型。不仅要考虑如\
  \ `MAE`、`MAPE` 和 `RMSE` 等预测指标，还要查看叠加在时间图上的实际值与预测值，以及预测误差的时间图。\n\n### 作业\n\n对于你的最终模型，请给出以下总结：\n\
  \n1. 方法/方法组合的名称。\n2. 该方法/方法组合的简要描述。\n3. 与该方法构建预测相关的所有估计方程。\n4. 训练期和验证期的 `MAPE` 和\
  \ `MAE`。\n5. 未来时期（3 月 22 日–24 日）的预测，以 15 分钟为箱体。\n6. 一张显示模型最终版本对整个时期（包括训练、验证和未来）拟合情况的图表。注意，该模型应使用训练+验证合并数据进行拟合。\n\
  \n### 提示与建议步骤\n\n1. 使用探索性分析识别此时间序列的成分。是否存在趋势？是否存在季节性？如果是，有多少个“季节”？是否存在其他可见的模式？这些模式是全局的（整个序列相同）还是局部的？\n\
  \n2. 从实际和技术角度考虑数据的频率。有哪些选项？\n\n3. 比较工作日周末。它们有什么不同？\n\n4. 检查序列中的缺失值或异常值。\n\n5. 根据发现的数据，应该考虑哪些模型？\n\
  \n6.考虑如何处理计数。\n\n## Notes\n\n### 参考文献\n\n（此处参考文献列表保持原样或翻译）\n\n\n\n17. Jank, W.,\
