  \n我们的结果取决于我们如何设置不同的参数，并且有一些需要避免的陷阱。我们将在下文中讨论这些。\n\n### 避免过拟合\n神经网络的一个缺点是它很容易过拟合数据，导致验证集上的错误率过高。因此，需要限制迭代次数并观察其何时开始恶化。验证误差在训练早期阶段会下降，但在一段时间后会开始增加。在该阶段的权重可能在新数据上提供最佳性能。\n\
  \n### 使用输出进行预测和分类\n当神经网络用于预测数值变量时，输出需要转换回原始单位。记住，数值变量（包括预测变量和结果变量）在使用之前通常会被缩放到 [0,1]。输出也将处于\
  \ [0,1] 尺度。为了将其转换回范围在 $[a, b]$ 的原始单位，我们将网络输出乘以 $b - a$ 并加上 $a$。\n\n当神经网络用于分类且我们有\
  \ $m$ 个类别时，我们将从每个节点获得一个输出（取决于软件可能是 $m-1$ 个节点）。我们如何将这些 $m$ 输出转换为分类规则？通常，值最大的节点决定网络的分类。\n\
  \n在二分类（$m=2$）的情况下，我们使用两个输出节点和一个阈值将预测概率映射到两个类别之一。虽然我们在其他分类器中通常使用 0.5 作为截止，但在神经网络中，值倾向于聚集在\
  \ 0.5 附近（从上下）。另一种方法是使用验证集确定产生合理预测性能的阈值。\n\n## 11.4 需要的用户输入\n使用反向传播训练模型的最耗时且复杂方面之一是，我们首先需要确定网络架构。这意味着指定隐藏层的数量以及每层中节点的数量。通常的程序是根据以往经验进行智能判断，并对不同的架构进行多次实验性运行。存在一些算法可以在训练期间选择性地增加节点，或者以类似于分类回归树（见第\
  \ 9 章）的方式进行修剪。此类方法的研究仍在进行中。目前，没有某种自动方法明显优于实验性方法。选择架构的一些通用指南如下：\n\n- *隐藏层的数量。* 隐藏层数量流行的选择是一个层。单个隐藏层通常足以捕捉预测变量之间非常复杂的关系。\n\
  \n\n\n\n\n> **隐藏层的大小。**\n> 隐藏层中的节点数量决定了网络所捕捉的预测变量之间关系的复杂程度。这涉及到在欠拟合和过拟合之间的权衡。一方面，使用过少的节点可能不足以捕捉复杂的关系（回想线性关系的特殊情况，例如线性回归和逻辑回归，在极端情况下为零个节点或没有隐藏层）。另一方面，节点过多可能导致过拟合。一个经验法则是从\
  \ `p`（预测变量的个数）个节点开始，并在检查过拟合的同时逐渐减少或增加节点。隐藏层的层数和每个隐藏层的大小可以在 R 语言的 `neuralnet()` 函数中通过参数\
  \ `hidden` 来指定。\n\n> **输出节点的数量。**\n> 对于具有 `m` 个类别的分类型结果，节点节点数应等于 `m` 或 `m - 1`。对于数值型结果，除非我们感兴趣预测多个函数，否则通常使用单个输出节点。\n\
  \n除了架构选择外，用户还应该注意预测变量的选择。由于神经网络对输入的质量有高度依赖性，因此在使用网络之前，应该利用领域知识、变量选择和降维技术来仔细选择预测变量。我们在讨论优缺点时会回到这一点。\n\
  \n根据软件的不同，用户可能能够控制的其他参数还包括学习率（又称权重衰减）、`l` 和动量（momentum）。第一个主要用于通过降低新信息的权重来避免过拟合。这有助于减轻离群值对权重的影响，并避免陷入局部最优。该参数通常取在\
  \ [0, 1] 范围内的值。Berry 和 Linoff (2000) 建议从一个较大的值开始（远离随机初始权重，从而从数据中“快速学习”），然后随着迭代的进行和权重的更加可靠，逐渐减小该值。Han\
  \ 和 Kamber (2001) 提出了更具体的经验规则，即设置 `l = 1/(当前迭代次数)`。这意味着在开始时 `l = 1`，在第二次迭代期间为 `l\
  \ = 0.5`，然后持续衰减到 `l = 0`。在 R 中，你可以使用 `neuralnet()` 函数中的参数 `learningrate` 设置学习率。\n\
  \n第二个参数称为 `momentum`（动量），用于在权重向最优值收敛的过程中“保持惯性”（因此有了这个术语）。其核心思想是让权重的变化方向与上一次迭代保持一致。这有助于避免陷入局部最优。高动量值意味着网络将“不愿”从想要改变权重方向的数据中学习，特别是当我们考虑案例更新时。通常情况下，使用\
  \ 0–2 范围内的值。\n\n## 11.5 探索预测变量与结果之间的关系\n\n神经网络之所以被称为“黑箱”，是因为它们的输出无法揭示其所建模的数据模式（就像我们的大脑一样）。事实上，这是对该方法最大的批评之一。然而，在某些情况下，通过对验证集进行敏感性分析，可以更深入地了解网络捕捉的关系。这是通过将所有预测变量的值设置为其平均值并获取网络的预测来实现的。然后，通过将每个预测变量设置为其最小值和最大值来重复该过程。通过比较不同预测变量水平的预测，我们可以感知哪些预测变量对预测的影响更大，以及是以什么方式影响。\n\
  \n## 11.6 神经网络的优缺点\n\n神经网络最显著的优点是良好的预测性能。它们已知对噪声数据具有高容忍度，并能够捕捉预测变量与结果变量之间高度复杂的关系。它们最弱的点在于无法提供关于关系结构的洞察，因此具有“黑箱”声誉。\n\
  \n在使用神经网络时，应该记住几点考虑和危险。首先，尽管它们能够从一组示例中泛化，但外推仍然是一个严重的危险。如果网络只见过某个范围内的记录，那么它在该范围之外的预测可能是完全的。\n\
  \n其次，神经网络没有内置的变量选择机制。这意味着需要对预测变量进行仔细考虑。通常与分类回归树（见第 9 章）和其他降维技术（例如第 4 章的主成分分析）相结合来识别关键预测变量。\n\
  \n第三，神经网络极大的灵活性严重依赖于有足够的训练数据。一个相关问题是，在分类问题中，网络需要足够的少数类记录以便学习该类别。这通过在第 2 章所解释的过采样来实现。\n\
  \n第四，一个技术问题是存在获得导致局部最优而非全局最优权重的风险，即权重收敛到无法为训练数据提供最佳拟合的数值。我们描述了几个用于尝试避免这种情况的参数（例如控制学习率和缓慢减小动量）。然而，并无法保证生成的权重确实是最优的。\n\
  \n最后，一个决定神经网络实用性的实际考虑因素是计算时间。神经网络在计算时间上相对较重，比其他分类器需要更长的运行时。当预测变量数量增加时，运行时间会大幅增加（因为会有更多权重需要计算）。在需要实时或近实时预测的应用中，应该测量运行时间以确保它不会导致决策产生不可接受的延迟。\n\
  \n### 问题\n\n1. **信用卡使用。** 考虑表 11.8 中关于消费者使用信用卡设施的假设数据。在 Excel 中创建一个小型工作表（如示例 1 所示），以说明通过神经网络的传播。\n\
