  \ 10 章中预测航班延误的示例，以说明如何使用回归模型进行降维。\n\n### 4.10 使用分类和回归树进行降维\n\n另一种减少列数和合并分类变量类别的方法是应用分类和回归树（参见第\
  \ 9 章）。分类树用于分类任务，回归树用于预测任务。在这两种情况下，算法都会在预测变量上创建二分切点，以最好地分类/预测结果变量（例如：年龄 30 岁以上/以下）。虽然我们把详细讨论推迟到第\
  \ 9 章，但我们在此指出，生成的树图可以用于确定重要的预测变量。未出现在树中的预测变量（数值型或分类型）可以删除。同样，未出现在树中的类别可以合并。\n\n\
