  \ = No ∣ SPD_LIM = 5)` 的概率为 0？\n\n# 第 9 章：分类与回归树\n\n本章描述了一种灵活的数据驱动方法，该方法可用于分类（称为`分类树`）和预测（称为`回归树`）。在所有数据驱动的方法中，树模型是最透明且最易于解释的。树基于通过对预测变量进行拆分来将记录分为子组。这些拆分创建了透明且易于理解的逻辑规则，例如，“如果\
  \ 年龄 < 55 且 教育 > 12 则 类别 = 1。”产生的子组在结果变量方面具有更高的同质性，从而创建有用的预测或分类规则。我们讨论了树的两个核心思想：`递归划分`（用于构建树）和`剪枝`（用于修剪树）。在树的构建背景下，我们还描述了树算法中常用的几种同质性指标，用于确定结果记录子组的同质性。我们解释了剪枝是避免过拟合的有效策略，并展示了如何操作。我们还描述了避免过拟合的其他替代策略。与其他数据驱动方法一样，树需要大量数据。然而，一旦构建，即使在大样本上部署其计算成本也很廉。它们还具有其他优势，例如高度自动化、对异常值鲁棒以及能够处理缺失值。除了预测和分类，我们还描述了如何使用树进行降维。最后，我们引入了`随机森林`和`提升树`，它们通过结合多棵树的结果来提高预测能力。\n\
  \n## 9.1 引言\n\n如果必须选择一种在各种情况下都表现良好、不需要分析师花费过多精力，且分析结果者易于理解的分类技术，那么 Breiman 等人（1984）开发的树方法将是一个强有力的竞争者。我们首先讨论这种分类程序，然后在随后的章节中展示如何将该程序扩展到数值结果的预测。Breiman\
  \ 等人创建的实现这些程序的程序被称为 `CART`（分类与回归树）。相关的程序称为 `C4.5`。\n\n什么是分类树？图 9.1 显示了一棵树，用于根据收入、教育程度和平均信用卡支出等信息，将获得贷款提议的银行客户分类为“接受者”或“非接受者”。树分类器非常受欢迎的原因之一是它们提供了易于理解的分类规则（只要树不是太大即可）。考虑示例中的树。灰色的`终端节点`标记为\
  \ 0 或 1，分别对应非接受者 (0) 或接受者 (1)。白色节点上方的值给出预测变量的拆分值。节点下方的值给出该拆分中的记录数量。这棵树可以很容易转换为一套分类银行客户的规则。例如，这棵树中“Family”圆圈左下角的矩形节点为我们提供了以下规则：\n\
  \n```\nIF(Income ≥ 106) AND (Education < 1.5) AND (Family < 2.5)\nTHEN Class = 0\
  \ (nonacceptor).\n```\n\n![图表显示收入（小于 106）分为教育（小于 1.5），再分为家庭和收入，后者进一步细分为收入和 CCavg。](img/c09f001.jpg)\n\
  \n**图 9.1** 通过对训练数据拟合全树后获得的最佳剪枝树\n\n在下文中，我们将展示如何构建和评估树。\n\n## 9.2 分类树\n\n分类树的基础有两个核心思想。第一个是预测变量空间的`递归划分`思想。第二个是使用验证数据进行`剪枝`的思想。在接下来的几节中，我们将描述递归划分，并在随后的章节中解释剪枝方法。\n\
  \n### 递归划分\n\n我们将结果变量标记为 `Y`，将输入（预测）变量标记为 `X[1]`, `X[2]`, `X[3] ..., `X[p]`。在分类中，结果变量将是一个分类变量。递归划分将预测变量\
  \ `X` 的 p 维空间分为不重叠的多维矩形。这里的预测变量被认为是连续的、二元的或定序的。这种划分是递归完成的（即对之前划分的结果进行操作）。首先，选择一个预测变量，例如\
  \ `X[i]`，并选择 `X[i]` 的一个值例如 `s[i]`，将 p 维空间拆分为两部分：一部分包含所有 `X[i] < s[i]` 的点，另一部分包含所有\
  \ `X[i] ≥ s[i]` 的点。然后，以类似的方式将这两部分之一分为更小的矩形，使得每个矩形尽可能是“纯”的。我们所说的“纯”是指属于某一个类别。当然，这并不总是可能的，因为可能属于不同的类别。\n\
  \n### 示例 1：割草机\n\n我们再次使用第 3 章提到的割草机示例。制造商希望找到一种方法，将城市的家庭分为可能购买割草机的和不购买的。数据如表 9.1\
  \ 和图 9.2 所示。\n\n![图显示了 2 万到 120 万美元的收入与 000 平英尺土地面积的关系，分为所有者和非所有者。](img/c09f002.jpg)\n\
