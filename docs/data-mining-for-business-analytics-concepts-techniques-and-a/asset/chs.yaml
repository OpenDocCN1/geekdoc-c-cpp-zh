  \ matrix）。解释为什么会出现这种情况。\n\n### 4. 化妆品购买\n表 14.14 所示的数据和表 14.15 中的输出是基于大型连锁药店化妆品购买数据集的一部分（`Cosmetics.csv`）。该商店希望分析这些物品购买之间的关联性，用于销售点展示、指导销售人员进行交叉销售，以及为最终试点一种购买时电子推荐系统提供指导以增加交叉销售。首先仅考虑表\
  \ 14.14 中给出的二进制矩阵形式的数据。\n\n| 交易号 # | 手袋 | 腮红 | 指甲油 | 刷子 | 遮瑕粉 | 眉笔 | 棕粉 |\n| ---\
