  \n> cast(mlt, RM.bin ~ CHAS, subset=variable==\"MEDV\", \n       margins=c(\"grand_row\"\
  , \"grand_col\"), mean)\n\n  RM.bin        0        1    (all)\n1      3 25.30000\
