  \n## Notes\n\n# 第八部分 案例\n\n# 第 21 章 案例\n\n## 21.1 查尔书俱乐部 (Charles Book Club)\n`CharlesBookClub.csv`\
  \ 是本案例研究的数据集。\n\n### 图书行业\n美国每年出版约 5000 万种新书（包括新版），在 2001 年催生了一个 250 亿美元的行业。从销售额百分比来看，该行业可以划分为：\n\
  \n| 16% | 教科书 |\n| 16% | 书店销售的商品书 |\n| 21% | 技术、科学和专业书籍 |\n| 10% | 书籍俱乐部和其他邮购书籍\
  \ |\n| 17% | 大众市场平装书 |\n| 20% | 所有其他书籍 |\n\n20 世纪 70 年代美国图书零售业的特点是位于购物场的书店连锁的增长。20\
  \ 世纪 80 年代，广泛实行的折扣策略刺激了书店购买量的增加。20 世纪 90 年代，超级市场图书零售概念得到认可，并促进了图书行业双位数的增长。超级市场便利地位于大型购物中心附近，拥有\
  \ 30000 到 80000 种书的库存，并聘佣了知识丰富的销售人员。亚马逊的出现使图书零售发生了根本性的变化，它从一家在线书店起，到 2015 年成为全球最大的在线零售商。亚马逊的利润率低且便利性高，给所有其他图书零售商带来了巨大的竞争压力。作为两大超级市场连锁之一的\
  \ Borders 在 2011 年停止了运营。\n\n订阅制的书籍俱乐部提供了一种持续的替代模式，尽管它也受到了亚马逊主导地位的影响。\n\n\n\n从历史上看，书俱乐部为读者提供不同类型的会员计划。两种常见的会员计划是连续性计划（continuity\
  \ programs）和负性选择计划（negative option programs），这两者都是俱乐部与其成员之间扩展的合同关系。在`continuity\
  \ program`下，读者通过接受一个只需几美元（外加运费和手续费）即可获得几本书的提议来注册，并同意此后每月以更标准的价格收到一到两本书。连续性计划在儿童书市场最为常见，在那里，父母们愿意将选书的权利委托给书俱乐部，而俱乐部的声誉很大程度上取决于其选书的质量。\n\
  \n在`negative option program`（负性选择计划）中，读者可以选择他们想要接收的额外书籍的数量和种类。然而，除非他们在规定的截止日期前在订单单上明确标记“否”，否则俱乐部的每月选书会自动发送给他们。负性选择计划有时会导致客户不满，并且总是产生高昂的邮寄和处理成本。\n\
  \n为了应对这些趋势，一些书俱乐部开始基于`积极选择基础`（positive option basis）提供书籍，但仅针对那些可能对特定提议感兴趣的特定客户群体。一些书俱乐部不再扩大邮件的量和覆盖范围，而是开始使用数据库营销技术来更准确地针对客户。他们数据库中包含的信息用于识别谁最可能对特定报价感兴趣。这些信息使俱乐部能够精心设计专门计划，以满足其客户细分的各种需求。\n\
  \n## 查尔斯的数据库营销\n\n### 俱乐部\n查尔斯书俱乐部（Charles Book Club，简称 CBC）成立于 1986 年 12 月，其前提是书俱乐部通通过对其客户群的深度理解以及提供独特定制的产品来自己差异化竞争。CBC\
  \ 专注于通过多种渠道（包括媒体广告（电视、杂志、报纸）和邮寄）通过直接营销销售特种书籍。CBC 是一个严格的分销商，不出版其销售的任何书籍。为了履行理解客户群的承诺，CBC\
  \ 建立并维护了一个关于俱乐部成员的详细数据库。在注册时，读者需要填写一张表格并将其寄给 CBC。通过这个过程，CBC 创建了一个拥有 50 万名读者的活跃数据库；大多数人是通过专业杂志的广告获取的。\n\
  \n### 问题\nCBC 每个月向其俱乐部成员发送包含最新提议的邮件。从表面上看，CBC 看起来非常成功：邮寄量在增加，选书日益多样化并不断增长，他们的客户数据库也在增加。然而，他们的净利润正在下降。利润的下降导致\
  \ CBC 重新审视最初的计划，即使用数据库营销来提高邮寄收益并保持盈利。\n\n### 可能的解决方案\nCBC 接受了从其数据中获取智能的想法，这让他们能够更好地了解客户，并实现多次有针对性的活动，每个目标受众都能收到适当的邮件。CBC\
  \ 的管理层决定将精力集中在最有利润的客户和潜在客户身上，并设计针对性的营销策略以最好地接触他们。他们有的两个流程是：\n\n1. 客户获取：\n    * 通过在专业杂志、报纸和电视上投放广告获取新成员。\n\
  \    * 通过直接邮寄和电话推销联系现有的俱乐部成员。\n    * 每本新书在普通广告之前都会提供给俱乐部成员。\n2. 数据收集：\n    * 所有的客户响应都将记录并维护在数据库中。\n\
  \    * 任何未被收集但关键信息都将向客户索取。\n\n对于每个新标题，他们决定使用两步法：\n\n1. 进行一项市场测试，涉及数据库中随机抽取的 4000\
  \ 名客户，以便对客户响应进行分析。该分析将为当前的书籍报价创建并校准响应模型。\n2. 根据响应模型，为数据库中的每个客户计算一个`score`（分数）。使用此分数和截止值提取出用于直接邮寄推广的目标客户列表。\n\
  \n有针对性的促销被认为是至关重要的。其他基于客户行为数据（退货、不活跃、投诉、赞扬等）创建成功营销活动的机会将在稍后的阶段由 CBC 处理。\n\n### 佛罗伦斯艺术史\n\
  一本新书《佛罗伦斯艺术史》（`The Art History of Florence`）准备发行。CBC 向其客户群中随机抽取的 4000 名客户发送了一封测试邮件。客户的响应已与过去的购买数据进行了汇总。该数据集被随机分为三部分：`Training\
  \ Data`（训练数据，1800 名客户）：用于拟合模型的初始数据；`Validation Data`（验证数据，1400 名客户）：用于比较不同模型性能的保留数据；以及`Test\
  \ Data`（测试数据，800 名客户）：仅在选择最终模型后使用，用于估计模型在部署时的可能性能。电子表格中的每一行（除表头外）对应一个市场测试客户。每一列都是一个变量，表头行给出变量名称。变量名称和描述见表\
  \ 21.1。\n\n| 变量名称 | 描述 |\n| --- | --- |\n| Seq# | 分区中的序列号 |\n| ID# | 完整数据集中的识别号\
  \ |\n| |   （未分区的）市场测试数据集 |\n| Gender | 0 = 男性，1 = 女性 |\n| M | 金额——在书籍上花费的总金额 |\n\
  | R | 最近一次性——距离上次购买以来的月数 |\n| F | 频率——购买总次数 |\n| FirstPurch | 自从首次购买以来的月数 |\n| ChildBks\
  \ | 在儿童书类别的购买次数 |\n| YouthBks | 在青少年书类别的购买次数 |\n| CookBks | 在烹饪书籍类别的购买次数 |\n| DoItYBks\
  \ | 在手工制作书类别的购买次数 |\n| RefBks | 在参考书类别的购买次数 |\n| |   （地图、百科全书、字典） |\n| ArtBks |\
  \ 在艺术书类别的购买次数 |\n| GeoBks | 在地理书类别的购买次数 |\n| ItalCook | 购买《意大利烹饪秘密》的次数 |\n| ItalAtlas\
  \ | 购买《意大利历史地图》的次数 |\n| ItalArt | 购买《意大利艺术》的次数 |\n| Florence | = 1 如果购买了《佛罗伦斯艺术史》；=\
  \ 0 如果没有 |\n| Related Purchase | 相关书籍的购买次数 |\n\n[**表 21.1**]查尔斯俱乐部数据集变量列表\n\n##\
  \ 数据挖掘技术\n可以使用各种数据挖掘技术来挖掘从市场测试中收集的数据。没有哪种技术是普遍优于其他技术的。特定的背景和数据的特定特征是决定哪些技术在应用中表现更好的主要因素。对于本次作业，我们关注两种基础技术：`k`-最近邻和`逻辑回归`。我们将它们相互进行比较，并与一种行业标准做法即`RFM（最近性、频率、金额）分群`进行比较。\n\
  \n### RFM 分群\n\n\n\n\n\n数据库营销中的细分过程旨在将潜在客户列表中的客户划分为购买行为上相似的同质性组（细分群体）。我们细分所需的同质性标准是对所提产品的购买倾向。然而，由于我们无法衡量这一属性，因此我们可以使用作为该倾向的合理指标的变量。\n\
  \n在直接营销业务中，最常用的变量是 `RFM 变量`：\n\n- `R = recency`（最近性），距离上次购买的时间\n- `F = frequency`（频率），在一段时间内从公司购买的过去次数\n\
  - `M = monetary`（金额），在一段时间内在公司产品上花费的金额\n\n假设是：上次购买时间越近，过去从公司购买的产品越多，过去购买公司产品花费的钱越多，客户购买所提产品的概率就越高。\n\
  \n数据集中的 1800 个观测值被分为以下最近性、频率和金额类别：\n\n**最近性 (Recency):**\n- 0–2 个月 (`Rcode = 1`)\n\
  - 3–6 个月 (`Rcode = 2`)\n- 7–12 个月 (`Rcode = 3`)\n- 13 个月及以上 (`Rcode = 4`)\n\n**频率\
  \ (Frequency):**\n- 1 本书 (`Fcode = 1`)\n- 2 本书 (`Fcode = 2`)\n- 3 本书及以上 (`Fcode\
  \ = 3`)\n\n**金额 (Monetary):**\n- $0–$25 (`Mcode = 1`)\n- $26–$50 (`Mcode = 2`)\n\
  - $51–$100 (`Mcode = 3`)\n- $101–$200 (`Mcode = 4`)\n- $201 及以上 (`Mcode = 5`)\n\n\
  ### Assignment\n\n将数据分为训练集 (60%) 和验证集 (40%)。使用 `seed = 1`。\n\n1. 训练数据客户整体的响应率是多少？`4\
  \ × 5 × 3 = 60` 种 RFM 类别组合中每种的响应率是多少？哪些组合在训练数据中的响应率高于训练数据的整体响应率？\n\n2. 假设我们决定只向第\
  \ 1 部分识别出的“高于平均水平”的 RFM 组合发送促销邮件。计算使用这些组合在验证数据中的响应率。\n\n3. 使用三个细分重新处理第 1 和第 2 部分：\n\
  \    - `Segment 1`:响应率超过整体响应率两倍的 RFM 组合\n    - `Segment 2`:响应率超过整体响应率但未超过两倍的 RFM\
  \ 组合\n    - `Segment 3`:剩余的 RFM 组合\n\n绘制提升曲线（包含这三个细分的三个点），其中 `x` 轴显示验证数据集中的客户数量，`y`\
  \ 轴显示验证数据集中的累计买家人数。\n\n#### ![](img/c21_ILM0001.gif)-最近邻\n\n`k`-最近邻算法技术可以根据产品与所提产品相似产品的接近性以及购买倾向（通过\
  \ RFM 变量衡量）来创建细分。对于《佛罗伦斯艺术史》，可以使用以下变量创建基于产品接近性的可能细分：\n\n- `R`: 最近性——距离上次购买的月数\n\
  - `F`: 频率——过去购买的总次数\n- `M`: 金额——在书籍上花费的总金额（美元）\n- `FirstPurch`:距离首次购买的月数\n- `RelatedPurch`:\
  \ 过去购买相关书籍的总次数（即艺术和地理类别的购买次数，以及《意大利烹饪的秘密》、《意大利历史地图》和《意大利艺术》书目的购买次数之和）\n\n4. 使用 `k`-最近邻方法对\
  \ `k = 1, 2, ..., 11` 的情况进行分类，以 `Florence` 为结果变量。根据验证集找到最佳 `k`。记得对所有五个变量进行归一化。为最佳\
  \ `k` 模型创建提升曲线，并报告验证数据集中等数量客户的预期提升（lift）。\n\n5. `k-NN` 预测算法给出一个数值，该值是 `k` 个最近邻 `Florence`\
  \ 变量值的加权平均，权重与距离成反比。使用你上面计算的用于 `k-NN` 分类的最佳 `k`，现在运行一个 `k-NN` 预测模型并为验证数据计算提升曲线。使用所有\
  \ 5 个预测变量和归一化数据。预测将落在哪个范围内？此结果与你通过 `k`-最近邻分类得到的输出相比如何？\n\n#### Logistic Regression\n\
  \n逻辑回归模型为响应建模提供了一种强大的方法，因为它产生了定义良好的购买概率。该模型在消费者选择设置中特别有吸引力，因为它可以从消费者行为的随机效用理论中推导出。\n\
  \n使用 1800 条记录的训练集数据构建三个逻辑回归模型，以 `Florence` 为结果变量，并使用以下一组预测变量：\n- 数据集中的全部 15 个预测变量\n\
  - 你认为最佳的预测变量子集\n- 仅 `R`、`F` 和 `M` 变量\n\n6. 创建一个提升图，汇总上述三个三个逻辑回归模型的结果，以及从验证集中随机选择等数量客户的预期提升。\n\
  \n7. 如果营销活动的截止标准是购买概率为 30%，请找到验证数据中将被定位的客户，并统计该组中买家的数量。\n\n## 21.2 German Credit\n\
  \n`GermanCredit.csv` 是本案例的数据集。\n\n### Background\n\n贷款自货币出现以来一直存在；它可能是世界上第二古老的职业。然而，对信贷风险的系统评估是较晚出现的，贷款很大程度上基于声誉和不完整的数据。美国第三任总统托马斯·杰斐逊一生负债且不可靠，但人们仍然继续借给他钱。直到\
  \ 20 世纪初，零售信用公司成立以共享信用信息。该公司现在是 Equifax，三大信贷机构之一（另外两家是 Transunion 和 Experion）。\n\
  \n个人和当地的人判断现在对信用报告过程已基本无关。信用机构和其他在零售层面提供贷款的大型机构收集大量数据，以预测是否会违约或其他事件。\n\n### Data\n\
