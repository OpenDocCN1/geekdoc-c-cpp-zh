  \ Logistic Regression for Profiling\n\n本章逻辑回归的介绍主要从数据挖掘的角度出发，目标是分类或排序，并通过验证样本的结果进行评估。作为参考，包含了经典统计视角的一些概念。\n\
  \n### Appendix A: Why Linear Regression Is Problematic for Categorical Outcome\n\
  \n现在你已经看到逻辑回归是如何工作的，我们解释为什么对于二分类结果它优于线性回归。从技术上，可以将线性回归应用于此问题，将结果变量 `Y` 视为连续变量。这被称为线性概率模型（Linear\
  \ Probability Model）。当然，`Y` 必须数值编码（例如，接受贷款的为 1，未接受的为 0）。虽然软件产生的输出乍看起来很标准（例如表 10.9），但仔细观察会发现一些异常：\n\
