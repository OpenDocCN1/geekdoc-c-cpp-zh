  \ | 2370 | 1438 | 2 | 7 | 3 | 2 | 0 | 1 | 0 | 无 |\n| 337.4 | 4244 | 5142 | 1950\
  \ | 2124 | 1060 | 1 | 6 | 3 | 1 | 0 | 1 | 1 | 旧 |\n| 359.4 | 4521 | 5000 | 1954\
