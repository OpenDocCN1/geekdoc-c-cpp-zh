  \ [0, 1] 范围内。解决方案是使用预测变量的非线性函数，形式如下：\n\n```\n10.1\n```\n这被称为 `logistic response\
  \ function`。对于任何值 `x[1] …… `x[q]`，右侧的值始终落在[0, 1] 范围内。接下来，我们看另一种属于特定类别的衡量，称为 `odds`（几率）。属于类别\
  \ 1 的几率定义为*属于类别 1 的概率与属于类别 0 的概率的比值*：\n\n```\n10.3\n```\n这种指标在赛马、体育、赌博、流行病学和其他领域非常流行。人们与其讨论获胜或感染疾病的*概率*，不如讨论获胜或感染疾病的*几率*。这两者之间有什么区别？例如，如果获胜概率是\
  \ 0.5，那么获胜的几率就是 0.5/0.5 = 1。我们也可以进行反计算：给定事件的几率，我们可以通过变形方程 (10.3) 计算概率：\n\n```\n\
  10.4\n```\n将 (10.2) 代入 (10.4)，我们可以写出几率与预测变量之间的关系为：\n\n```\n10.5\n```\n\n\n\n\n最后这个方程描述了预测变量与几率（odds）之间的乘法（比例）关系。这种关系可以用百分比来解释，例如，预测变量\
  \ `X[j]` 的每增加一个单位，伴随着几率平均增加 `β[j] × 100%`（在保持其他预测变量不变的情况下）。\n\n现在，如果我们对两边同时取自然对数，就得到了逻辑模型的标准公式：\n\
