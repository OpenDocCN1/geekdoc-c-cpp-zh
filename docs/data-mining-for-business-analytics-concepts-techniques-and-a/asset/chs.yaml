  ```\n\n| 表 8.7** 使用朴素贝叶斯分类器进行航班误期预测的混淆矩阵 |\n\n## 8.3 朴素贝叶斯分类器的优缺点\n\n朴素贝叶斯分类器的优之处在于其简单性、计算效率高、良好的分类性能以及直接处理类别变量的能力。事实上，即使在预测变量相互独立的假设并不成立的情况下，它的表现往往优于更复杂的分类器。当预测变量数量很大时，这种优势尤为明显。\n\
  \n然而，需要记住三个主要问题。第一，朴素贝叶斯分类器需要大量的记录才能获得良好的结果。\n\n其次，当训练数据中不存在某个预测变量的类别时，朴素贝叶斯假设具有该类别预测变量的新记录概率为零。如果这个稀有的预测值很重要，就会产生问题。一个例子是航班误期数据集中的二分类预测变量\
  \ `Weather`（我们没有将其用于分析），它代表恶劣天气。当天气不好时，所有航班都延误了。考虑另一个例子，结果变量是“购买了高价值人寿险”（bought\
  \ high-value life insurance），预测变量类别是“拥有游艇”（owns yacht）。如果训练数据中没有 `owns yacht` =\
  \ 1 的记录，那么对于任何 `owns yacht` = 1 的新记录，朴素贝叶斯都会为结果变量 `bought high-value life insurance`\
  \ 分配概率 0。由于没有 `owns yacht` = 1 的训练记录，显然，没有任何数据挖掘技术能够将这个潜在重要的变量纳入分类模型——它会被忽略。然而，使用朴素贝叶斯时，该预测变量的缺失会主动“否决”记录中的任何其他信息，从而为结果值分配\
  \ 0（而在这种情况下，它为 1 的概率相对较大）。大型训练集的存在（以及如果需要，对连续预测变量进行合理的分箱）有助于减轻这种影响。在这种情况下，一种常用的解决方案是使用名为\
  \ `smoothing`（平滑）的方法将零概率替换为非零值（例如，可以通过在函数 `naiveBayes()` 参数 `laplace` = 0 应用拉普拉斯平滑）。\n\
  \n最后，当目标是根据记录属于某一类的概率对其进行 `classification`（分类）或 `ranking`（排名）时，可以获得良好的性能。然而，当目标是`估计类别成员的概率（倾向性）`时，这种方法的结果具有很大的偏差。因此，朴素贝叶斯方法很少用于信用评分（Larsen,\
