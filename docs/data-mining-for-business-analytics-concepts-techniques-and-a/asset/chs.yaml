  \n数据分析分析\n\n# 第 19 章\n\n# 社交网络分析\n\n在本章中，我们将研究视觉化和描述社交网络的基本方法，衡量链接，并结合有监督和无监督技术对网络进行分析。我们使用的方法远在互联网，但随着社交媒体数据的爆炸式增长而得到了广泛应用。例如，Twitter\
  \ 将其馈流公开供公众分析，另一些社交媒体公司则通过应用程序接口（API）向程序员和开发者提供其部分数据。\n\n## 19.1 引言\n\n社交媒体的使用从\
  \ 21 世纪 00 年代开始快速增长，随着 Friendster 和 MySpace 的出现，以及 2004 年 Facebook 的诞生。面向专业人士的 LinkedIn\
  \ 紧随其后，Twitter、Tumblr、Instagram、Yelp、TripAdvisor 等也如此。这些信息驱动型公司迅速开始产生海量数据——尤其是关于人之间链接（朋友、关注者、联系人等）的数据。\n\
  \n对于像 Facebook、Twitter 和 LinkedIn 这样的公司，公司的几乎全部价值都取决于其社交网络数据的分析价值和预测价值。截至本文写作时（2017\
  \ 年 3 月），Facebook 的价值是通用汽车和福特总值的两倍。其他公司，如 Amazon 和 Pandora，将社交网络数据作为旨在销售产品服务的预测引擎的重要组成部分。\n\
  \n社交网络基本上是实体（例如人）以及它们之间的连接。让我们来看描述、描和分析网络的构建模块。网络的基本元素是：\n\n* 节点（也称为顶点）\n* 边（节点之间的连接或链接）\n\
  \n一个非常简单的 LinkedIn 网络可以像图 19.1 所示所示。该网络有六个代表成员的节点，边连接了部分而非全部的节点对。\n\n```\n用于绘制假设\
  \ LinkedIn 网络的代码\n```\n\n```\nlibrary(igraph)\n\n# 定义数据中的链接\nedges <- rbind(\n \
  \ c(\"Dave\", \"Jenny\"), c(\"Peter\", \"Jenny\"), c(\"John\", \"Jenny\"),\n  c(\"\
  Dave\", \"Peter\"), c(\"Dave\", \"John\"), c(\"Sam\", \"Albert\"),\n  c(\"Peter\"\
  , \"John\")\n)\n\n# 生成并绘图\n# 在 graph.edgelist() 中设置参数 directed = FALSE 以绘制无向图。\n\
  g <- graph.edgelist(edges, directed = FALSE)\nplot(g, vertex.size = 1, vertex.label.dist\
  \ = 0.5)\n```\n\n![显示带有 Albert, Sam, Peter, John, Dave, Jenny 标记的网络]](OPS/images/c19f001.jpg)\n\
  \n**图 19.1** 假设 LinkedIn 网络；边代表连接\n\n## 19.2 有向网络与无向网络\n\n在图 19.1 所示的图中，边是双向或无向的，这意味着如果\
