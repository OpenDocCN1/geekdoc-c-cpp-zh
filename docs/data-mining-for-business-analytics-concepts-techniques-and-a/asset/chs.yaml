  \n### 数值数据的其他距离度量\n\n注意的是，距离度量的选择在聚类分析中起着重要作用。主要的指导原则取决于领域：具体在测量什么？不同的测量之间有什么关系？每个测量应该被视为何种尺度（数值、定序或名义）？是否存在异常值？最后，取决于分析的目标，类应该主要通过少数几个测量值来区分，还是通过多个中等权重的测量值来分离？\n\
  \n尽管欧几里得距离是最常用的距离，但它有三个需要注意的主要特征。首先，如前所述，它是高度依赖于尺度的。改变一个变量的单位（例如，从分改为美元）会对结果产生巨大影响。因此，归一化是一种常见的解决方案。但如果我们希望类更多地取决于某些测量值而不是其他值，则应该考虑不均等的权重。欧几里得距离的第二个特征是它完全忽略了测量值之间的关系。因此，如果测量值实际上强相关，那么不同的距离（如后文描述的统计距离）可能是更好的选择。第三，欧几里得距离对异常值敏感。如果认为数据包含异常值且无法选择仔细删除，则倾向于使用更稳健的距离（如后文描述的曼哈顿距离）。\n\
  \n其他常用的距离指标（出于上述原因）包括：\n\n*   **基于相关性的相似性。** 有时，使用记录之间的相似性度量比衡量差异的距离量更自然或更方便。一种常用的相似性度量是皮尔逊相关系数的平方\
  \ `r`²[`ij`]`，其中相关系数定义为\n\n    (15.1)![编号的显示公式](img/c15_M0003.gif)\n\n    此类度量始终可以转换为距离度量。在上面的示例中，我们可以定义距离度量\
  \ `d[ij] = 1 − `r`²[`ij`]`。\n\n*   **统计距离（也称为马拉松比距离）。** 该指标相对于上述其他指标的优势在于考虑了测量值之间的相关性。使用该指标，与其他测量值高度相关的测量值的贡献没有与不相关或弱相关的测量值大。记录\
  \ `i` 和 `j` 之间的统计距离定义为![编号的显示公式](img/c15_M0004.gif)其中 `x`[`i]` 和 `x`[`j]` 分别是记录\
  \ `i` 和 `j` 测量值的 `p` 维向量；`S` 是协方差矩阵。\n\n*   **曼哈顿距离。** 这种距离查看坐标之间的绝对差。\n\n*   **最大距离。**\
  \ 这种距离查看任何单个坐标之间的最大差异。\n\n### 类数据的距离度量\n\n对于分类测量，使用相似性度量比距离更具吸引力。假设我们有二值，最有用的度量是：\n\
  \n*   **匹配系数。** 该系数统计两个记录都具有该属性的情况。\n\n*   **杰卡德系数。** 该系数忽略两个记录都缺少该属性的情况。\n\n###\
  \ 混合数据的距离度量\n\n当测量是混合（部分连续，部分二进制）时，Gower 的相似性非常有用。Gower 相似性度量是每个变量计算距离的加权平均值，前提是将每个变量缩放到\
  \ [0,1]。它定义为\n\n![编号的显示公式](img/c15_M008)\n\n其中 `s[ij]` 是记录 `i` 和 `j` 在测量 `m` 上的相似性，`w[ij]`\
  \ 是赋予相应距离的权重。相似性度量 `s[ij]` 和权重 `w[ij]` 计算如下：\n\n1.  对于连续测量，`s[ij]` 为 `1 − abs(x[`i]`\
  \ - x[`j]`]) / range(x_m)`，`w[ij]` 为 1，除非一个或两个记录的测量 `m` 值未知，此时 `w[ij]` = 0。\n\n\
  2.  对于二进制测量，`s[ij]` = 1 如果 `x[`i]` = `x[`j]` = 1，否则为 0。`w[ij]` 为 1，除非 `x[`i]` =\
  \ `x[`j]` = 0。\n\n3.  对于非二进制分类测量，`s[ij]` = 1 如果 `x[`i]` 和 `x[`j]` 属于同一类别，否则 `s[ij]`\
  \ = 0。`w[ij]` 为 1，除非一个或两个记录的测量 `m` 类别未知，此时 `w[ij]` = 0。\n\n\n\n\n\n最远两个记录 `A[i]`\
  \ 和 `B[j]` 之间的距离：\n\n![numbered Display Equation](img/c15_M0010.gif)\n\n### 平均距离\n\
  \n一个簇中的记录与另一个簇记录之间所有可能距离的平均距离：\n\n![numbered Display Equation](img/c15_M0011.gif)\n\
  \n### 质心距离\n\n两个簇质心之间的距离。`簇质心`是该簇中所有记录测量平均值的向量。对于簇 A，该向量为 ![](img/c15_ILM0002.gif)。簇\
  \ A 和 B 之间的质心距离为\n\n![numbered Display Equation](img/c15_M0012.gif)\n\n最小距离、最大距离和质心距离通过一张包含葡萄牙和法国地图的二维平面进行了可视化展示，见图\
  \ 15.2。\n\n![Image described by caption and surrounding text.](img/c15f002.jpg)\n\
  \n图 15.2 葡萄牙和法国之间几种不同距离度量的二维表示\n\n例如，考虑前两个公用事业（亚利桑那、波士顿）作为簇 A，接下来的三个公用事业（中央、联邦、合并）作为簇\
  \ B。使用表 15.3 中的归一化评分和表 15.4 中的距离矩阵，我们可以计算上述每种距离。使用欧几里得距离进行每次距离计算，得到：\n\n*   最近的记录对是亚利桑那和联邦，因此簇\
  \ A 和簇 B 之间的最小距离为 0.76。\n*   最远的记录对是亚利桑那和合并，因此簇 A 和簇 B 之间的最大距离为 3.02。\n*   平均距离为\
  \ (0.77 + 0.76 + 3.02 + 1.47 + 1.58 + 1.01)/6 = 1.44。\n*   簇 A 的质心是![numbered Display\
  \ Equation](img/c15_M0013.gif)，而簇 B 的质心是![numbered Display Equation](img/c15_M0014.gif)，则两个质心之间的距离为![numbered\
  \ Display Equation](img/c15_M0015.gif)\n\n在选择聚类方法时，领域知识是关键。如果你有充分理由相信簇可能是链状或香肠状的，最小距离将是一个很好的选择。这种方法不要求簇成员之间彼此相互靠近，只需要新添加的成员与现有成员之一靠近即可。这种情况可能发生的一个应用示例是种植在长行中的作物特征，或者沿位于该地区主要定居点的可航水道发生的疾病爆发。另一个例子是布设和寻找地雷（陆地或海洋）。最小距离对距离的小幅偏差也相当具有鲁健性。然而，添加或删除数据会对其产生巨大影响。\n\
  \n如果你知道簇更有可能是球形的（例如，基于众多属性聚类的客户），那么最大距离和平均距离是更好的选择。如果你不知道簇的可能性质，这些是很好的默认选择，因为大多数簇在性质上倾向于球形。\n\
  \n我们现在转向对两种主要聚类算法的更详细描述：层次类（凝聚类）和非层次类。\n\n## 15.4 层次（凝聚类）聚类\n\n层次凝聚聚类的背后的思想是从每个簇恰好包含一条记录开始，然后逐渐凝聚（合并）两个最近的簇，直到最后只剩下一个包含所有记录的簇。\n\
  \n回到只有五个公用事业和两个衡量标准（销售额和燃料成本）的小例子，并使用距离矩阵（表 15.4），层次聚类的第一步是将亚利桑那和联邦合并，因为它们最近（使用归一化测量和欧几里得距离）。接下来，我们将重新计算一个\
  \ 4 × 4 的距离矩阵，其中包含这四个簇之间的距离：{亚利桑那，联邦}、{波士顿}、{中央}和合并。此时，我们使用如 15.3 节中描述的簇间距离度量。这些距离（最小、最大、平均和质心距离）中的每一个都可以按照下所述在层次方案中实现。\n\
  \n### 单链法 (Single Linkage)\n\n在`single linkage clustering` 中，我们使用的距离度量是最小距离（两个簇中最近的记录对之间的距离，每个簇各一条记录）。在我们的公用事业示例中，我们将计算{波士顿}、{中央}和{合并}与{亚利桑那，联邦}之间的之间的距离，以创建表\
  \ 15.5 所示的 4 × 4 距离矩阵。\n\n|   | **亚利桑那–联邦** | **波士顿** | **中央** | **合并** |\n| ---\
  \ | --- | --- | --- | --- |\n| 亚利桑那–联邦 | 0 |  |  |  |\n| 波士顿 | `min(2.01,1.58)`\
  \ | 0 |  |  |\n| 中央 | `min(0.77,1.02)` | 1.47 | 0 |  |\n| 合并 | `min(3.02,2.57)`\
  \ | 1.01 | 2.43 | 0 |\n\n表 15.5 使用单链法后，亚利桑那和联邦簇合并的距离矩阵\n\n下一步是将{中央}与{亚利桑那，联邦}合并，因为这两个簇最近。距离矩阵将再次重新计算（这次将是\
  \ 3 × 3），依此类推。这种方法倾向于在早期阶段将彼此距离较远的记录聚在一起，因为在同一个簇中存在由中间记录构成的链。当将这些簇作为空间中的对象进行可视化时，它们会呈现出拉长的的香肠状形状。\n\
  \n### 全链法 (Complete Linkage)\n\n在`complete linkage clustering` 中，两个簇之间的距离是最大距离（最远记录对之间的距离）。如果我们在五个公用事业的示例中使用全链法，重新计算的距离矩阵将等于表\
  \ 15.5，区别在于 `min` 函数将被替换为 `max` 函数。这种方法倾向于在早期阶段产生记录之间彼此距离处于较狭窄范围内的簇。如果我们把它们可视化为空间中的对象，此类簇中的记录具有大致的球形。\n\
  \n### 平均链法 (Average Linkage)\n\n`Average linkage clustering` 基于簇之间的平均距离（所有可能的记录对之间的距离）。如果我们在五个公用事业的示例中使用平均链法，重新计算的距离矩阵将等同于表\
  \ 15.5，区别在于 `min` 函数将被替换为 `average`。这种方法也被称为“平均加权凝聚法”（UPGMA）。\n\n注意，与平均链法不同，单链和全链方法的结果取决于记录间距离的排序。距离的线性变换（以及其他改变排序的变换）不会影响结果。\n\
  \n### 质心法 (Centroid Linkage)\n\n质心法基于质心距离，簇由每个变量的平均值表示，这形成了一个平均值向量。两个簇之间的距离是这两个向量之间的距离。在平均链法中，计算每对的距离，然后计算所有此类距离的平均值。相比之下，在质心距离聚类中，只计算一个距离：组均值之间的距离。这种方法也被称为“质心加权凝聚法”（UPGMC）。\n\
  \n### 沃德法 (Ward’s Method)\n\n\n\n\nWard 方法也是一种凝聚类的，因为它通过逐步合并记录和聚类来生成越来越大的聚类，但其操作方式与上述描述的通用方法略有不同。Ward\
  \ 方法考虑了记录聚类在一起时会发生的“信息损失”。当每个类只包含一条记录时，没有信息损失，所有单个值都保持可用。当记录被合并并表示在类中时，单个记录的信息会被其所属的类的信息所取代。为了衡量这种信息损失，Ward\
  \ 方法使用了一种名为“误差平方和”（ESS）的衡量指标，该指标用于衡量单个记录与组平均值之间的差异。\n\n这在单变量数据中最容易观察到。例如，考虑值 (2,\
  \ 6, 5, 6, 2, 2, 2, 2, 0, 0, 0)，其平均值为 2.5。它们的 ESS 等于\n\n![numbered Display Equation](img/c15_M0016.gif)\n\
  \n因此，将这些值分为一个组所产生的信息损失为 50.5。现在将记录分为四组：(0, 0, 0), (2, 2, 2, 2), (5), (6, 6)。信息损失是每组\
  \ ESS 之和，结果为 0（每组中的每条记录都等于该组的平均值，因此每组的 ESS 为 0）。因此，将 10 条记录聚类为 4 个类不会产生信息损失，这将 Ward\
  \ 方法的第一步。在转向更少数量的类时，Ward 方法会选择导致增量信息损失最小的配置。\n\nWard 方法倾向于产生大小大致相等的凸聚类，这在某些应用中是一个重要的考虑因素（例如，在建立有意义的客户细分时）。\n\
  \n### 树图：显示聚类过程和结果\n\n`endrogram`（树图）是一种总结聚类过程的树状图。`x` 轴上是记录。相似的记录通过线条连接在一起，线条的垂直长度反映了记录之间的距离。图\
  \ 15.3 显示了使用 8 个归一化测量值和欧几里得距离对 22 家公用事业进行聚类生成的树图，一次使用单链法（顶部），另一次使用平均链法（底部）。\n\n\
  | |\n```\n 运行分层次聚类并生成树图的代码\n``` |\n| |\n```\n# 在 hclust() 中设置参数 method =  \n# 为\
  \ \"ward.D\", \"single\", \"complete\", \"average\", \"median\", 或 \"centroid\"\n\
  hc1 <- hclust(d.norm, method = \"single\")\nplot(hc1, hang = -1, ann = FALSE)\n\
  hc2 <- hclust(d.norm, method = \"average\")\nplot(hc2, hang = -1, ann = FALSE)\n\
  ``` | |\n\n![图表显示了从 1.0 到 3.5 的刻度，有 NY, Nevada, San Diego, Idaho, Pacific 等标记；图表显示了从\
  \ 1.0 到 4.5 的刻度，有 Nevada, United, Oklahoma 等标记。](img/c15f003.jpg)\n\n**图 15.3**\
  \ 树图：针对所有 22 家公用事业的单链法（顶部）和平均链法（底部），使用了所有八项测量值\n\n通过在 `y` 轴上选择截断距离，可以创建一个类集。从视觉上看，这意味着在树图上画一条水平线。位于水平线以下连接的记录（即它们的距离小于截断距离）属于同一个类。例如，在图\
  \ 15.3（顶部）的单链树图上将截断距离设置为 2.7，会得到六个类。这六个类是（从树图从左到右）：{NY}, {Nevada}, {San Diego},\
  \ {Idaho, Puget}, {Central}, {Others}。\n\n如果我们想使用平均链法获得六个类，可以选择 3.5 的截断距离。生成的六个类略有不同。\n\
  \n在 R 中，可以通过对树图对象应用 `cutree()` 函数来计算这六个（或其他数量的）类。表 15.6 显示了单链聚类和平均链聚类分为六个类的结果。每条记录都被分配了一个类号。虽然某些记录在两种方法中仍留在同一类中（例如亚利桑那、佛罗里达、肯塔基、俄克拉荷马、德克萨斯），其他记录发生了变化。\n\
  \n| |\n```\nSingle Linkage\n> memb <- cutree(hc1, k = 6)\n> memb\n    Arizona  \
  \     Boston      Central  Commonwealth           NY \n           1            1\
  \            2            1            3 \n    Florida     Hawaiian         Idaho\
  \     Kentucky     Madison  \n           1            1            4           \
  \ 1            1 \n      Nevada  New England     Northern     Oklahoma     Pacific\
  \  \n           5            1            1            1            1 \n       Puget\
  \    San Diego     Southern        Texas    Wisconsin \n           4           \
  \ 6            1            1            1 \n      United     Virginia \n      \
  \     1            1 \n\nAverage Linkage\n\n> memb <- cutree(hc2, k = 6)\n> memb\n\
  \    Arizona       Boston      Central  Commonwealth           NY \n           1\
  \            2            1            2            3 \n    Florida     Hawaiian\
  \         Idaho     Kentucky     Madison  \n           1            4          \
  \  5            1            1 \n      Nevada  New England     Northern     Oklahoma\
  \     Pacific  \n           5            4            2            1           \
  \ 4 \n       Puget    San Diego     Southern        Texas    Wisconsin \n      \
  \     5            6            1            1            2 \n      United     Virginia\
  \ \n           4            2 \n``` |\n\n通过“切割”树图计算类成员身份\n\n注意，如果我们想要五个类，它们将与上述六个类相同，只是其中两个类将被合并为一个类。例如，在单链情况下，最右侧的两个类将被合并。通常情况下，分层次方法的类随着类数量的减少是嵌套的。这是解释类的一个价值的属性，在生物分类等某些应用中至关重要。\n\
  \n### 类的验证\n\n聚类分析的一个重要目标是产生有意义的类。由于有很多变化可以选择，确保生成的类是有效的（即它们确实产生了洞解）很重要。要判断聚类分析是否有用，请考虑以下方面：\n\
  \n1.  类的可解释性。对类的解释是否合理？通过以下方式解释类：\n    1.  对于用于聚类的每项测量值，获取每个类的汇总统计数据（例如平均值、最小值、最大值）。\n\
  \    2.  检查类在未用于聚类的某些共同特征（变量）上的分离情况。\n    3.  标记类：根据解释，尝试为每个类分配一个名称或标签。\n\n2.  类的稳定性。如果某些输入发生微变化，类的分配会发生显著变化吗？另一种稳定性的方法是划分数据并查看在部分上形成的类是否适用于另一部分数据：\n\
  \    1.  对划分 A 进行聚类。\n    2.  使用 A 的类中心分配划分 B 中的每条记录。\n    3.  评估与基于所有数据的分配相比的一致性。\n\
  \n3.  类的分离。检查类间变异与类内变异的比率，以查看分离是否合理。该任务存在统计测试方法（F 比），但它们的用性仍存在争议。\n\n\n\n\n## 4.\
  \ 聚类数量。\n\n考虑到分析的目的，生成的聚类数量必须具有实用性。例如，假设聚类的目标是识别客户类别并为它们分配标签，以用于市场细分。如果营销部门只能维持三种不同的营销方案，那么识别出三个以上的聚类可能就没有意义。\n\
  \n回到公用事业部门的示例，我们注意到（两种方法（单链连接和平均连接）都将 `{NY}` 和 `{San Diego}` 识别为单点聚类。此外，两幅树图都暗示该数据集中合理的聚类数量是四个。从平均连接聚类中可以得到的一个见解是，聚类倾向于在地理上进行分组。四个非单点聚类（大约）形成了一个南部小组、一个北部小组、一个东西部沿岸小组和一个西部小组。\n\
  \n我们可以通过检查其测量值的统计摘要，或通过视觉观察单个测量值的热力图来进一步描述每个聚类的特征。图 15.4 显示了四个聚类和两个单点的热力图，突出了每个聚类在八项测量指标上的不同特征。例如，我们看到聚类\
  \ 2 的特征是核电占比较高的公用事业；聚类 1 的特征是高固定费用和高回报（RoR）；聚类 4 具有高燃料成本。\n\n```\n# code for creating\
  \ heatmap\n```\n\n```r\n# set labels as cluster membership and utility name\nrow.names(utilities.df.norm)\
  \ <- paste(memb, \": \", row.names(utilities.df), sep = \"\")\n\n# plot heatmap\
  \ \n# rev() reverses the color mapping to large = dark\nheatmap(as.matrix(utilities.df.norm),\
  \ Colv = NA, hclustfun = hclust, \n        col=rev(paste(\"gray\",1:99,sep=\"\"\
  )))\n```\n\n![图表显示了 fixed_charge, RoR, cost, load_factor, demand_growth, et cetera\
  \ 等列，以及 Puget, Northern, Wisconsin, Boston, Central, Southern, Arizona, Texas, et\
  \ cetera 等行。](img/c15f004.jpg)\n\n**图 15.4**](#c15.xhtml_figureanchor15-4) 22 家公用事业（行）的热力图。行按平均连接聚类的六个聚类排序。颜色较深的单元格表示列内值较高。\n\
  \n### 层次聚类的局限性\n\n层次聚类具有非常吸引人的之处，因为它不需要指定聚类的数量，从这个意义上说，它是纯数据驱动的。通过树图表示聚类过程和结果也是该方法的一个优势，因为它更容易理解和解释。然而，有几个局限性需要考虑：\n\
  \n1. 层次聚类需要计算并存储 *n* × *n* 距离矩阵。对于非常大的数据集，这可能是非常昂贵且缓慢的。\n2. 层次算法对数据只进行一次扫描。这意味着在过程早期分配不当的记录在随后无法重新分配。\n\
  3. 层次聚类的稳定性通常较低。重新排序数据或丢弃几条记录可能会导致不同的解决方案。\n4. 关于聚类之间距离的选择，只要保持相对顺序，单链连接和完全连接对距离指标（例如，欧式距离、统计距离）的变化是稳健的。相比之下，平均连接受对距离指标选择的影响更大，当指标改变时，可能会导致完全不同的聚类。\n\
  5. 层次聚类对离群值敏感。\n\n## 15.5 非层次聚类：![](img/c15_ILM0003.gif)-Means 算法\n\n形成良好聚类的非层次方法是预先指定期望的聚类数量\
  \ *k*，并将每个案例分配到 *k* 个聚类中的一个，以使聚类内部的散度最小。换句话之，目标是将样本划分为预定的 *k* 个不重叠的聚类，使得聚类对于所使用的测量值尽可能同质。\n\
  \n聚类内散度的常用衡量标准是记录到其聚类质心的距离和（或欧式距离平方和）。这个问题可以设定为一个涉及整数规划的优化问题，但由于求解具有大量变量的整数规划非常耗时，通常使用快速的启发式方法来计算聚类，产生良好的（但不一定最优）解决方案。*k*-means\
  \ 算法就是这种方法之一。\n\n回到五个公用事业部门和两项测量值的示例，假设 *k* = 2，且初始聚类为 A = {Arizona, Boston} 和 B\
  \ = {Central, Commonwealth, Consolidated}。聚类质心已在第 15.4 节计算：\n\n![编号显示方程](img/c15_M0017.gif)\n\
  \n每个记录到这两个质心之一的距离如表 15.7 所示。\n\n| | **距离来自** | **距离来自** |\n| --- | --- | --- |\n\
  | | **质心 A** | **质心 B** |\n| Arizona | 1.0052 | 1.3887 |\n| Boston | 1.0052 | 1.6289\
  \ |\n| Central | 0.6029 | 0.8995 |\n| Commonwealth | 0.7281 | 1.0207 |\n| Consolidated\
  \ | 2.0172 | 1.6341 |\n\n**表 15.7**](#c15.xhtml_table15) 记录到每个质心的距离\n\n我们看到 Boston\
  \ 更靠近聚类 B，而 Central 和 Commonwealth 都靠近聚类 A。因此，我们将这些记录移动到另一个聚类，得到 A = {Arizona, Central,\
  \ Commonwealth} 和 B = {Consolidated, Boston}。重新计算质心得到\n\n![编号显示方程](img/c15_M018.gif)\n\
  \n每个记录到新计算质心的距离如表 15.8 所示。在此此时我们停止，因为每个记录都分配到了它最近的聚类。\n\n| | **距离来自** | **距离来自**\
  \ |\n| --- | --- | --- |\n| | **质心 A** | **质心 B** |\n| Arizona | 0.3827 | 2.5159\
  \ |\n| Boston | 1.6289 | 0.5067 |\n| Central | 0.5463 | 1.9432 |\n| Commonwealth\
  \ | 0.5391 | 2.0745 |\n| Consolidated | 2.6412 | 0.5067 |\n\n**表 15.8**](#c15.xhtml_tableanchor15-8)\
  \ 记录到新计算质心的距离\n\n### 15.5.1 选择聚类数量 (![](img/c15_ILM0005.gif))\n\n聚类数量的选择可以由外部因素驱动（例如，现有知识、实际限制等），或者我们可以尝试不同的\
  \ *k* 值并比较生成的聚类。选择 *k* 后，将 *n* 条记录划分到这些初始聚类中。\n\n\n\n\n\n在许多情况下，没有可供用于初始划分的信息。在这些情况下，可以使用不同的随机生成的初始划分来重新运行算法，以减少启发式方法产生较差解的概率。数据中的聚类数量通常是未知的，因此使用接近对数据中预期聚类数量的不同\
  \ `k` 值来运行算法是一个好主意，以观察距离和如何随着 `k` 值的增加而减少。请注意，使用不同 `k` 值得到的聚类并不是嵌套的（这与层次聚类得到的聚类不同）。\n\
  \n使用 `kmeans()` 函数运行 `k`-means 算法对 22 个公用事业部门和八项测量进行 `k = 6` 聚类的结果如表 15.9 所示。与层次聚类的结果一样，我们再次看到{圣地亚}是一个单点类。另外两个类（聚类\
  \ #3 = {亚利桑那、佛罗里达、中部、肯塔基、俄克拉荷马、德克萨斯} 和聚类 #4 = {弗吉尼亚、北部、联邦州、麦迪逊、威斯康星}）与平均链接法层次聚类中出现的类几乎完全相同。\n\
