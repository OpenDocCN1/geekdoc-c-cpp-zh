  \                \n\n> # 更深树：验证\n> confusionMatrix(deeper.ct.point.pred.valid, valid.df$Personal.Loan)\n\
  混淆矩阵和统计数据\n\n          Reference\nPrediction    0    1\n         0 1788   19\n \
  \        1   23  170\n\n               Accuracy : 0.979 \n```\n\n表 9.3 默认（小）和更深（全）分类树在训练集和验证集上的混淆矩阵和准确率\n\
  \n## 9.4 避免过拟合\n\n在训练数据上生长深层树的一个危险是过拟合。正如第 5 章所述，过拟合会导致新数据上的性能下降。如果我们观察不同大小树的总体误差，它会随着终端节点的增加而减少，直到过拟合的点。当然，对于训练数据，总体误差会一直减少直到零。然而，对于新数据，总体误差预计会增加。这在图\
  \ 11 中所示。大树可能过拟合的一个直观原因是其最终分叉是基于少数记录的。在这种情况下，类别差异可能归因于噪声而非预测信息。\n\n![图显示了训练数据的划分次数与误差率的关系。](img/c09f011.jpg)\n\
  \n### 停止树生长：条件树\n\n可以考虑在开始过拟合数据之前停止生长的标准。例如树深（即划分次数）、终端节点中的最小记录数以及纯度的最小减少。在 R 的\
  \ `rpart()` 中，例如，通过复杂度参数 `cp` 控制树的深度。问题是，使用此类规则确定一个良好的停止点并不简单。\n\n以前开发的方法基于递归划分的思想，使用规则防止树过度生长并过拟合训练数据。一种被称为\
  \ CHAID（卡方自动交互检测）的流行方法是一种比分类回归树（CART）程序早多年的递归划分方法，至今仍广泛应用于数据库营销。它使用一种著名的统计检验（独立卡方检验）来评估划分节点是否显著提高了纯度。特别是，在每个节点，我们根据与结果变量关联最强的预测变量进行划分。关联强度通过独立卡方检验的\
  \ *p* 值衡量。如果对于最佳预测变量测试没有显示显著改进，则不进行划分并终止树。基于这种想法的一种更一般的树类被称为条件推理树（见 Hothorn et al.,\
  \ 2006）。R 的实现实现在 `party` 和 `partykit` 包中，适用于数值型和分类型的结果及预测变量。\n\n### 剪枝树\n\n\n\n\n\
  \n另一种流行且被证明比停止树生长更有效的解决方案是修剪已成长的树。这是诸如 `CART`（由 Breiman 等人开发，实现在多个数据挖掘软件包中，如 `R`\
  \ 的 `rpart` 扩展、`SAS Enterprise Miner`、`CART` 和 `MARS`）和 `C4.5`（由 Quinlan 开发，实现在\
  \ `IBM SPSS Modeler` 等包中）方法的基础。在 `C4.5` 中，训练数据既用于树的生长，也用于修剪。在 `CART` 中，创新之处在于使用验证数据来修剪从训练数据中生成的树。`CART`\
  \ 和类 `CART` 过程使用验证数据来修剪那些使用训练数据故意过度生长的树。\n\n修剪背后的思想是认识到一棵非常大的树可能会过拟合训练数据，而那些几乎无法降低错误率的虚弱分支应该被移除。在割草机机的例子中，最后几次划分产生了点数非常少的矩形（全树中有四个矩形仅包含一条记录）。我们可以直观地看到，这些最后的划分可能只是捕捉了训练集中的噪声，而不是反映未来数据中可能出现的模式。修剪由连续选择一个决策节点并将其重新指定为终端节点组成，切掉延伸到该节点之外的分（`subtree`），从而减小树的大小。修剪过程是在验证集上的误分类错误与修剪树中的决策节点数量之间进行权衡。\n\
  \n### 交叉验证\n\n使用验证数据修剪树解决了过拟合问题，但没有解决稳定性问题。回想 `CART` 算法在选择顶层划分的变量时可能是不稳定的，这种效应会级联下去，产生变异性极大的集合。解决方案是避免仅依赖于数据的某一次训练和验证划分。相反，应该通过交叉验证重复这样做，然后汇总结果。当然，仅仅累积一组具有不同规则的不同树本身并起不起作用。然而，我们可以利用所有树的结果来学习原始树应该生长到多深。在这个过程中，我们引入了一个可以衡量并控制树生长深度的参数。我们为交叉验证过程中的每棵最小误差树记录该参数值，取平均值，然后应用该平均值来将树的生长限制到这一最优深度。树的复杂度（`CC`）等于其误分类错误（基于训练数据）加上树大小的惩罚因子。对于一个具有\
  \ `L` 个终端节点的树 `T`，其复杂度可以写为：\n\n![Equation](img/c09_M003.gif)\n\n其中 `err(T)` 是树 `T`\
  \ 误分类的训练记录比例，`α` 是树大小的惩罚因子。当 `α = 0` 时，对树中有很多节点没有惩罚，这会使用复杂度准则得到全树。当我们将 `α` 增加到一个非常大的值时，惩罚部分会淹没复杂度准则的误分类错误，结果仅仅是终端节点最少的树：即只有一个节点的树。因此，存在一个从微小到巨大的树范围，对应于\
  \ `α` 从大到小的范围。回到交叉验证过程，我们现在可以将 `α` 的值与该过程每次迭代中开发的最小误差树相关起来。\n\n这里是该算法的简单版本：11. 将数据划分为训练集和验证集。\n\
  2. 使用训练数据生长树。\n3. 逐步、分步地对其进行修剪，在每一步记录 `CP`（使用训练数据）。\n4. 记录与验证数据上最小误差对应的 `CP`。\n\
  5. 将数据重新划分为训练集和验证集，重复生长、修剪和记录 `CP` 的过程。\n6. 反复执行，对反映每棵树最小误差的 `CP` 取平均值。\n7. 回到原始数据，在这个最优\
  \ `CP` 值处停止生长树。\n\n通常，交叉验证的使得用于验证的划分（也称为“折”）是不重叠的。`R` 会自动执行此交叉验证过程以选择 `CP` 并构建默认修剪树，但用户可以指定\
  \ `CP` 的替代值（例如，如果你想看看更深的树长什么样）。在 `Table 9.4` 中，我们看到了在 Universal Bank 数据上生长的深度递增的八棵树的交叉验证误差参数表。我们可以简单地选择交叉验证误差最低（`xerror`）的树。在这种情况下，第\
  \ 6 行的树交叉验证误差最低。`Figure 9.12` 显示了具有 15 个终端节点的修剪树。这棵树是使用复杂度参数值 `CP = 0.0034326` 从最大的树修剪而来的，该值在\
  \ `Table 9.4` 中产生了最低的交叉验证误差。\n\n```\n# 修剪树的代码\n### 通过较低的 cp 修剪\npruned.ct <- prune(cv.ct,\
  \ \n    cp = cv.ct$cptable[which.min(cv.ct$cptable[,\"xerror\"])])\nlength(pruned.ct$frame$var[pruned.ct$frame$var\
  \ == \"<leaf>\"])\nprp(pruned.ct, type = 1, extra = 1, split.font = 1, varlen =\
  \ -10)\n```\n\n![Chart showing income (less than 114) divided into CCavg and education\
  \ which is divided into income and CD.account, and family and income, respectively.](img/c09f01.jpg)\n\
  \n**Figure 9.12** 使用 `CP` 在贷款接受数据上获得最低 `xerror` 的修剪树\n\n```\n# 复杂度参数 (CP) 列出树误差的代码\n\
  # 参数 xval 指的是用于交叉验证的折数\n# 参数 cp 设置复杂度参数的最小值\ncv.ct <- rpart(Personal.Loan ~ ., data\
  \ = train.df, method = \"class\",\n    cp = 0.0001, minsplit = 5, xval = 5)\n###\
  \ 使用 printcp() 打印表格\nprintcp(cv.ct)\n\nOutput\n         CP nsplit error  xerror\
  \     xstd\n1 0.335051      0  1.00000 1.00000 0.05505\n2 0.134020      2  0.329897\
  \ 0.37457 0.03520\n3 0.0154639      3  0.195876 0.19931 0.025917\n4 0.0068729  \
  \    7  0.134021 0.134021 0.024096\n5 0.0051546      12  0.099656 0.17182 0.024096\n\
  6 0.0034326      14  0.089347 0.16838 0.023858\n7 0.0022910      19  0.072165 0.17182\
  \ 0.024096\n8 0.0000100      25  0.058419 0.17182 0.024096\n```\n\n### 最佳修剪树\n\n\
  为了模型简洁，进一步的改进是纳入采样误差，如果我们有不同的样本，这种误差可能会导致最小值发生变化。这种改进使用交叉验证误差的估计标准差（`xstd`）进一步修剪树；我们可以在最小\
  \ `xerror` 上加上一个标准差。这有时被称为*最佳修剪树*Best-Pruned Tree）。例如，第 6 行树的 `xstd` 为 `0.023858`。我们可以通过向上一个交叉验证误差更大但在一个标准差范围内的行来选择更小的树——即\
  \ `xerror` 加上 `xstd`（0.16838 + 0.023858 = 0.192238）。在这种情况下，第 4 行的树是该范围内 `xerror`\
  \ 最低的较小树。贷款接受示例的最佳修剪树如图 `Figure 9.13` 所示。在这种情况下它与默认树（`Figure 9.9`）重合。\n\n\n\n\n\n\
  ![Chart shows markings for income (less than 114) divided into CCavg and education,\
  \ and then to CD.account and family, respectively, and finally CD.account leads\
  \ to income and then family.](img/c09f013.jpg)\n\n**图 9.13**](#c09.xhtml_figureanchor9-13)\
  \ 通过对训练数据拟合全树、使用交叉验证数据进行剪枝，并选择距离最小 xerror 树一个标准误差内的树所获得的最剪枝树。\n\n## 9.5 来自树的分类规则\n\
  \n如第 9.2 节所述，分类树提供了易于理解的`分类规则`（如果树不是太大话）。每个叶子节点等同于一条分类规则。回到示例，最佳剪枝树（图 9.13）中最右侧的叶子节点给了我们如下规则：\n\
  \n*   如果 (`Income` ≥ 114) 且 (`Education` ≥ 1.5)\n*   那么 `Class` = 1。\n\n然而，在许多情况下，可以通过消除冗余来减少规则的数量。例如，考虑图\
  \ 9.13 中从倒数第二个左侧的叶子节点的规则：\n\n*   如果 (`Income` < 114) 且 (`CCAvg` ≥ 3) 且 (`CD.Account`\
  \ < 0.5)\n*   且 (`Income` < 92)\n*   那么 `Class` = 0\n\n这条规则可以简化为：\n\n*   如果 (`Income`\
  \ < 92) 且 (`CCAvg` ≥ 3) 且 (`CD.Account` < 0.5)\n*   那么 `Class` = 0\n\n这种过程的透明度和导致将记录归为某一类别的算法的可理解性，在最终分类不是唯一关注点的场景中是非常有优势的。Berry\
  \ 和 Linoff (2000) 给出了健康保险承保的例子，保险公司需要证明拒绝承保不是基于歧视。通过展示导致拒绝的规则（例如，`income < $20K`\
  \ 且 信用记录低），公司可以避免诉讼。与其他分类器（如判别函数）的输出相比，基于树的分类规则很容易向经理和操作人员解释。它们的逻辑显然比神经网络中的权重要透明得多！\n\
  \n## 9.6 适用于多于两个类别的分类树\n\n分类树可以用于具有两个以上类别的结果变量。在衡量不纯度方面，之前提出的两种衡量（吉尼不纯度指数和熵量）是针对\
  \ `m` 个类别定义的，因此可以用于任何数量的类别。树本身将具有相同的结构，只是它的叶子节点将采取 `m` 个类标签之一。\n\n## 9.7 回归树\n\n\
  树方法也可以用于数值型结果变量。用于预测的回归树的操作方式与分类树非常。。在这种，结果变量（`Y`）是一个数值变量，但原理和步骤是相同的：尝试多次划分，并且对于每次划分，我们测量生成树中每个分支的“不纯度”。然后树过程会选择使此类指标之和最小的划分。为了说明回归树，考虑预测丰田卡罗拉汽车的示例（来自第\
  \ 6 章）。数据集包含了 1000 辆售出的丰田卡罗拉的信息（我们使用数据集 `ToyotoCorolla.csv` 中的前 1000 辆汽车）。目标是找到一个关于\
  \ 10 个预测因子（包括里程、马力、扇数等）函数的定价预测模型。使用 600 条记录的训练集构建了用于这些数据的回归树。最佳剪枝树所示于图 9.14。\n\n\
  ![Chart shows markings for age_08_0 (greater than or equal to 32) divided into age_08_0\
  \ and weight, and finally to age_08_0 and HP, respectively.](img/c09f014.jpg)\n\n\
  **图 9.14**](#c09.xhtml_figureanchor9-14) 丰田卡罗拉价格的最佳剪枝回归树\n\n我们看到从 12 个输入变量（包括虚拟变量）中，只有三个预测因子显示出对预测价格有用：汽车的年龄、它的重量和马力。\n\
  \n回归树和分类树之间有三个细节不同：预测、不纯度衡量和性能评估。我们接下来描述这些。\n\n### 预测\n\n对记录预测结果值的操作方式与分类情况类似：预测因子信息用于将记录“向下丢入”树直到到达叶子节点。例如，为了预测一辆\
  \ `Age = 60`、`Horse_Power = 100` 且 `Weight = 1200` 的丰田卡罗拉的价格，我们将其向下丢入树并到达值为 `$9358`\
  \ 的节点。这是根据树对该汽车的预测预测。在分类树中，叶子节点的值（它是类别之一）是由位于该叶子节点的训练记录的“投票”决定的。在回归树中，叶子节点的值是由位于该叶子节点的训练记录的平均结果值决定的。在上面的示例中，值\
  \ `$9358` 是训练集中属于年龄 ≥ 类别的 279 辆汽车的平均值。\n\n### 衡量不纯度\n\n我们描述了分类树节点的两种不纯度衡量类型：吉尼指数和熵量。在这两种情况下，指标都是节点记录类别之间`比例`的函数。在回归树中，典型的不纯度衡量是离平均值的平方和。这等同于平方误差，因为节点的平均值正是预测值。最低不纯度为零，当节点中的所有值相等时。\n\
  \n### 性能评估\n\n如上述，预测是通过对节点取平均得到的。因此我们有了预测和错误的通常定义。回归树的预测性能可以使用评估其他预测方法（例如线性回归）的方法来衡量，使用指标\
  \ RMSE。\n\n## 9.8 改进预测：随机森林和提升树\n\n尽管上述单棵树具有透明度优势，但在纯预测应用中（其中可视化一组规则并不重要），通过结合多个树的结果若干扩展提供了更好的性能。这些是`集成`的示例（参见第\
  \ 13 章）。一种流行的多树方法是`随机森林`，由 Breiman 和 Cutler 引入。(1) 随机森林是 `bagging` 的特例，是一种通过结合多种分类器或预测算法提高预测能力的方法。更多细节请见第\
  \ 13 章。\n\n### 随机森林\n\n随机森林的基本思想是：\n\n1.  从数据中有放回随机采样（这种采样方法称为 `自助`）。\n2.  在每个阶段使用预测因子的随机子集，对每个样本拟合分类（或回归）树（从而得到一个“森林”）。\n\
  3.  结合单棵树的预测/分类以获得改进的预测。分类使用投票，预测使用平均化。\n\n图 9.15 中的代码和输出说明了如何在 R 中对个人贷款示例应用随机森林。随机森林的准确率比我们之前拟合的单个默认树略高（与表\
  \ 9.3 中的验证性能进行比较）。\n\n```\n 运行随机森林、绘制变量重要性图并计算准确率的代码\n```\n\n\n\n\n```\nlibrary(randomForest)\n\
  ### random forest\nrf <- randomForest(as.factor(Personal.Loan) ~ ., data = train.df,\
  \ ntree = 500, \n    mtry = 4, nodesize = 5, importance = TRUE)  \n\n### variable\
  \ importance plot\nvarImpPlot(rf, type = 1)\n\n### confusion matrix\nrf.pred <-\
  \ predict(rf, valid.df)\nconfusionMatrix(rf.pred, valid.df$Personal.Loan)\n\nPartial\
  \ Output\n\n> confusionMatrix(rf.pred, valid.df$Personal.Loan)\nConfusion Matrix\
  \ and Statistics\n\n          Reference\nPrediction    0    1\n         0 1801 \
  \  19\n         1   10  170\n\n               Accuracy : 0.986 \n```\n\n![Graph\
  \ shows rf on meandecreaseaccuracy from 0 to 140 versus securities.account, online,\
  \ creditcard, mortgage, age, CD.account, experience, CCavg, family, education, and\
  \ income. ]](OPS/images/c09f015.jpg)\n\n图 9.15 随机森林变量重要性图（个人贷款示例）\n\n与单棵树不同，随机森林的结果无法以树形图表的形式显示，因此失去了单棵树所提供的解释性。然而，随机森林可以产生“变量重要性”评分，这些评分衡量了不同预测变量的相对贡献。特定预测变量的重要性得分是通过累加该变量在森林中所有树上导致的\
  \ Gini 指数下降量来计算的。图 9.15 显示了从个人贷款示例的随机森林模型生成的变量重要性图。我们看到 `Income` 和 `Education` 的得分最高，`Family`\
  \ 居第三。其他预测变量的重要性得分要低得多。\n\n### 提升树 (Boosted Trees)\n\n第二种多树改进方法是`提升树`。在这里拟合了一系列树，使得每棵树都关注前一棵树中分类错误的记录。\n\
  \n1. 拟合一棵单树。\n2. 抽取一个样本，赋予分类错误的记录更高的抽中概率。\n3. 对新样本拟合一棵树。\n4. 重复步骤 2 和 3 多次。\n5.\
  \ 使用加权投票对记录进行分类，后生成的树具有更大的权重。\n\n表 9.5 显示了在之前看到的贷款接受示例上运行提升树的结果。我们可以看到，与单棵修剪树的性能（表\
  \ 9.3）相比，提升树在验证数据上的整体准确率，特别是在对 1 的正确分类（即我们感兴趣的稀有类别）方面表现更好。提升算法寻找 1 的特殊才能源自何处？当某一类占据主导地位时（此处\
  \ `0` 占了数据的 90% 以上），基本分类器倾向于将用例归为主导类，而在这种情况下，`1` 成了使用单棵最佳修剪树时大部分的分类错误。提升算法集中在分类错误上（大部分是\
  \ `1`），因此它在减少 `1` 的分类错误方面自然会表现良好（在验证集中，从单树的 18 个减少到提升树的 15 个）。\n\n```\n 运行提升树的代码\n\
  ```\n\n```\nlibrary(adabag)\nlibrary(rpart) \nlibrary(caret)\n\nboost <- boosting(Personal.Loan\
  \ ~ ., data = train.df)\npred <- predict(boost, valid.df)\nconfusionMatrix(pred$class,\
  \ valid.df$Personal.Loan)\n\nOutput\n\nConfusion Matrix and Statistics\n\n     \
  \     Reference\nPrediction    0    1\n         0 1805   15\n         1    6  174\n\
  \n               Accuracy : 0.9895 \n```\n\n表 9.5 提升树：验证集的混淆矩阵（贷款数据）\n\n## 9.9 树的优点与缺点\n\
  \n树方法是很好的开箱即用分类器和预测器。它们对于变量选择也很有用，最重要的预测变量通常出现在树的顶部。树在以下方面对用户投入的精力相对较少：首先，不需要对变量进行转换（变量的任何单调变换都会产生相同的树）。其次，变量子集选择是自动完成的，因为它是分裂选择的一部分。在贷款示例中，注意最佳修剪树已从\
  \ 14 个可用变量中自动选择了三个变量（`Income`、`Education` 和 `Family`）。\n\n树在本质上对离群值具有稳健性，因为分裂的选择取决于值的`ordering`（排序），而不是这些值的绝对`magnitudes`（幅度/大小）。然而，它们对数据变化非常敏感，即使是微小的变化也可能导致非常不同的分裂！\n\
  \n与假设结果和预测变量之间存在特定关系的模型（例如线性回归和线性判别分析中的线性关系）不同，分类和回归树是非线性且非参数的。这允许预测变量与结果变量之间存在广泛的关系。然而，这可能也是一个缺点：由于分裂是针对每次一个预测变量进行的，而不是针对预测变量的组合，树可能会错过预测变量之间的关系，特别是像线性或逻辑回归模型中的线性结构。在预测空间进行水平和垂直分裂能够充分划分类别的情况下，分类树是很有用的分类器。但考虑一下，例如一个具有两个预测变量和两个类别的数据集，两个类别之间的分离最明显是通过使用对角线实现的（如图\
  \ 9.16 所示）。在这种情况下，分类树的性能预计低于判别分析等方法。提高性能的一种方法是根据现有预测变量派生新的预测变量，这可以捕捉预测变量之间的假设关系（类似于回归模型中的交互作用）。随机森林是这种情况的另一种解决方案。\n\
  \n![Graph shows income in 000s dollars from 20 to 120 versus education from 13 to\
  \ 25 with plots for class 0 and class 1.](img/c09f016.jpg)\n\n图 9.16 描述具有两个类别的双预测变量的散点图。通过对角线实现了最佳分离，而分类树无法做到。\n\
  \n分类树的另一个性能问题是它们需要大型数据集来构建良好的分类器。从计算角度来看，树的生长可能相对昂贵，因为在每个变量上计算所有可能的的分裂涉及多次排序。使用验证集修剪数据会进一步增加计算时间。\n\
  \n虽然树对于变量选择很有用，但一个挑战是它们“偏好”具有许多分裂点的预测变量。这包括具有许多类别的分类预测变量和具有许多值的数值预测变量。此类预测变量出现在树中的概率更高。一种简单的解决方案是将多个类别合并为较小的集合，并对具有许多值的数值变量进行分箱。或者，某些特殊算法通过使用不同的分裂准则来避免这个问题（例如\
  \ R 包 `party` 中的条件推理树——参见 Hothorn 等人 (2006)——以及 QUEST 分类树——参见 Loh 和 Shih (1997)）。\n\
  \n\n\n\n\n# 1. [eBay.com](http://eBay.com) 上的竞争性拍卖\n\n文件 `eBayAuctions.csv` 包含了\
  \ 2004 年 5 月至 6 月期间在 [eBay.com](http://eBay.com) 上交易的 1972 场拍卖信息。目标是使用这些数据建立一个模型，将拍卖分类为竞争性或非竞争性。*竞争性拍卖*定义为对所拍卖物品至少有两次出价的拍卖。数据包含了描述物品（拍卖类别）、卖家（其/她的\
  \ eBay 评级）以及卖家选择的拍卖条款（拍卖持续时间、起拍价、货币、拍卖结束的星期）的变量。此外，我们还有拍卖结束时的价格。任务是预测该拍卖是否具有竞争性。\n\
  \n### 数据预处理\n将变量 `Duration` 转换为分类变量。将数据分为训练集（60%）和验证集（40%）。\n\n1. 使用所有预测变量拟合一个分类树，并使用最佳修剪后的树。为了防止过拟合，将终端节点中的最小记录数设置为\
  \ 50（在 R 语言中：`minbucket` = 50）。同时，将显示的最大层数设置为七（在 R 语言中：`maxdepth = 7`）。以规则的形式写下结果。（*注*：如果由于软件限制或为了演示清晰，你必须稍微减少预测变量的数量，你会选择哪个变量比较好？）\n\
  2. 该模型对于预测新拍卖的结果实用吗？\n3. 描述这些规则所提供的有趣信息和无趣信息。\n4. 再次拟合另一个分类树（同样使用最佳修剪后的树，每个终端节点的最小记录数\
  \ = 50，允许的最大显示层数 = 7），这次仅使用可以预测新拍卖结果的预测变量。以规则的形式描述生成的树。确保报告分类所需的所需的最小规则集。\n5. 在散点图上绘制生成的树：使用两个最佳的（定量）预测变量作为两个轴。每场拍卖将作为一个点出现，其坐标对应于它在这两个预测变量上的值。使用不同的颜色或符号来区分竞争性拍卖和非竞争性拍卖。在产生划分的值处画线（你可以手绘或使用\
  \ R 语言）。这种划分相对于两个预测变量的意义来说是否合理？它是否很好地分离了两个类别？\n6. 检查树的提升图（lift chart）和混淆矩阵。关于该模型的预测性能你可以说明什么？\n\
  7. 根据最后一棵树，从这些数据中可以得出关于拍卖获得至少两次出价的机会及其与卖家设置的拍卖设置（持续时间、起拍价、结束日期、货币）之间关系的结论？对于卖家，你推荐什么策略最可能导致竞争性拍卖？\n\
  \n### 2. 预测延航班\n\n文件 `FlightDelays.csv` 包含了 2004 年 1 月份从华盛顿特区地区出发并飞往纽约的所有商业航班信息。对于每班航班，都有出发和到达机场的信息、路线距离、航班的预定时间和日期等。我们试图预测的变量是航班是否延误。延误定义为到达时间比计划至少晚\
  \ 15 分钟。\n\n### 数据预处理\n将 `day of week` 转换为分类变量。使用 R 的 `cut()` 将 `scheduled time`\
