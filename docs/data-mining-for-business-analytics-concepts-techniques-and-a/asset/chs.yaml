  \ 0 到 2000 的数量与从 0 到 150 的累计值。](img/c10f09.jpg)\n\n### 单一预测变量的影响\n\n与多元回归类似，逻辑回归的输出通常产生一个系数表，对于每个预测变量\
  \ `X[i]`，我们都有一个估计系数 `b[i]` 和相关的标准误差。相关的 `p`-值指示了预测变量 `X[i]` 的统计显著性，极低的 `p`-值表示预测变量与结果之间存在关系（在考虑其他预测变量的情况下），这种关系很可能不是偶然。需要记住的三点是：\n\
  \n1. 统计显著的关系并不意味着具有*实际意义*的关系，即预测变量具有巨大影响。如果样本非常大，`p`-值会非常小，仅仅是因为拟合特定数据集时的偶然不确定性可以忽略不计。\n\
  \n2. 除非所有预测变量尺度相同，否则比较系数的大小（或几几率的大小）是没有意义的。由于每个系数乘以预测变量值，因此不同的尺度会导致不同的系数尺度。\n\n\
  3. 统计显著的预测变量意味着*平均而言*，该变量增加一个单位会对结果产生特定影响（保持其他预测变量不变）。然而，它并不指示预测能力。统计显著性在解释模型（或画像分析）中非常重要，但在预测模型（分类）中是次要的。在预测建模中，统计显著的预测变量可能提供关于变量重要性的的提示，但预测变量的最终选择应基于预测指标，例如验证集混淆矩阵（用于分类）或验证集提升图（用于排序）。\n\
  \n### 附录 C：多分类逻辑回归\n\n二分类结果的逻辑模型可以扩展到两个类别以上。假设有 *m* 个类别。使用逻辑回归模型，对于每条记录，我们都会获得属于\
  \ *m* 个类别中每个类别的概率。由于 *m* 个概率之和必须为 1，我们只需要估计 *m* − 1 个概率。\n\n### 序数类别\n\n\n\n\n\n\
  # 序类\n\n序类是指具有有意义顺序的类别。例如，在股票推荐中，`buy`（买入）、`hold`（持有）和 `sell`（卖出）这三个类别可以视为有序。根据一个简单的规则，如果类别可以用有意义的方式编号，我们就认为它们是序类。当类别数量较多（通常超过\
  \ 5 个）时，可以将结果变量视为连续变量并进行多元线性回归。当 `m` = 2 时，使用上述逻辑模型。因此，我们需要针对少数几个序类（3 ≤ `m` ≤ 5）对逻辑回归进行扩展。有几种方法可以扩展二分类的情况。在这里，我们描述了比例优势（proportional\
  \ odds）或累积逻辑（cumulative logit）方法。其他方法，请参见 Hosmer and Lemeshow (2000)。\n\n为了便于解释和计算，我们查看类别隶属的`cumulative`概率。例如，在股票推荐中，我们有\
  \ `m` = 3 个类别。让我们将其标记为 1 = `buy`，2 = `hold`，3 = `sell`。模型估计的概率为 `P(Y ≤ 1)`（`buy`\
  \ 推荐的概率）和 `P(Y ≤ 2)`（`buy` 或 `hold` 推荐的概率）。三个非累积的类别隶属概率很容易从两个累积概率中恢复：\n\n![numbered\
  \ Display Equation](img/c10_M0015.gif)\n\n接下来，我们希望将每个逻辑（logit）建模为预测变量的函数。每一个 `m`\
  \ − 1 累积概率都对应一个 logit。在我们的示例中，我们将得到：\n\n![numbered Display Equation](img/c10_M0016.gif)\n\
  \n每个 logit 然后被建模为预测变量的线性函数（类似于二分类情况）。如果我们在股票推荐中有一个单一预测变量值 `x`，我们使用两个方程计算两个 logit\
  \ 值：\n\n![numbered Display Equation](img/c10_M0017.gif)\n\n这意味着这两条线具有相同的斜率（`β[1]`）但不同的截距。一旦估计了系数\
  \ `α[0]`、`β[0]`、`β[1]`，我们就可以通过用概率重写逻辑方程来计算类别隶属概率。对于三分类情况，例如，我们将得到：\n\n![numbered\
  \ Display Equation](img/c10_M0018.gif)\n\n其中 `a[0]`、`b[0]` 和 `b[1]` 是从训练集中获得的估计值。\n\
  \n对于每条记录，我们现在有了属于每个类别的估计概率。在我们的示例中，每只股票将有三个概率：`buy` 推荐、`hold` 推荐和 `sell` 推荐。最后一步是将记录分类为其中一个类别。这是通过将其分配给隶属概率最高的类别来实现。例如，如果某股票的估计概率为\
  \ `P(Y = 1) = 0.2`、`P(Y = 2) = 0.3` 和 `P(Y = 3) = 0.5`，我们将将其分类为获得 `sell` 推荐。\n\n\
  ## 名类\n\n当类别无法排序且仅相互不同时，我们就处于名类的情况。一个例子是在几种品牌的谷物之间进行选择。验证类别为名类的简单方法是，当将它们标记为 `A`、`B`、`C`、……是有意义的时，且字母对类别的分配并不重要。为了简单起见，让我们假设消费者有\
  \ `m` = 3 种品牌的谷物可以选择（假设每个消费者选择一种）。然后我们估计概率 `P(Y = A)`、`P(Y = B)` 和 `P(Y = C)`。与之前一样，如果知道其中两个概率，第三个概率就确定了。因此，我们使用其中一个类别作为参考类。让我们使用\
  \ `C` 作为参考品牌。\n\n目标再次是将类别隶属建模为预测变量的函数。因此在谷物示例中，如果我们知道谷物的价格 `x`，我们可能想预测将选择哪种谷物。\n\
  \n接下来，我们形成 `m` − 1 个在预测变量上线性的伪逻辑方程。在我们的示例中，我们将得到：\n\n![numbered Display Equation](img/c10_M0019.gif)\n\
