  4. 关于各种变量的影响，是否提供了什么信息？\n\n## 注释\n\n# 第 12 章\n\n判别分析\n\n在本章中，我们描述了判别分析法，这是一种基于模型的分类方法。我们讨论了其主要原理，即分类是基于记录与每个类别均值之间的距离。我们解释了“统计距离”的底层衡量标准，该标准考虑了预测变量之间的相关性。判别分析程序的输出会生成估计的“分类函数”，然后用这些函数产生分类评分，这些评分可以转化为分类或倾向（属于某一类的概率）。人们还可以将误分类成本直接整合到判别分析设置中，我们将解释如何实现这一点。最后，我们讨论了底层的模型假设、对某些假设违反的实际稳健性，以及当假设合理满足时判别分析的优势（例如小型训练样本的充分）。\n\
  \n## 12.1 引言\n\n判别分析是一种分类方法。与逻辑回归一样，它是一种经典的统计技术，可用于分类和画像分析。它利用不同类别记录的一组测量值，将新记录分类到这些类别之一（*分类*）。该方法的常见用途包括：将生物体分为物种和亚种；将贷款、信用卡和保险的申请分为低风险和高风险类别；将新产品的客户分为早期采用者、早期大众、晚期大众和落后者；将债券分为不同的评级类别；对人类化石头骨分类；以及涉及争议归属、大学录取决策、涉及饮酒者非饮酒者的医学研究以及识别人类指纹的方法的研究。判别分析还可以用于突出区分类别的特征（*画像分析*）。\n\
  \n我们回到前面章节中描述的两个示例：割草机示例和个人贷款接受示例。在每个示例中，结果变量都有两个类别。我们以涉及两个以上类别的第三个示例结束。\n\n###\
  \ 示例 1：割草机\n\n我们回到第 7 章的示例，该割草机制造商希望找到一种方法，将城市中的家庭分类为可能购买割草机的家庭和可能不购买的家庭。对城市中的 12\
  \ 名所有者和 12 名非所有者进行了试点随机抽样。数据见第 7 章（表 7.1），并在图 12.1 中显示了散点图。我们可以将线性分类规则视为一条线，它将二维区域分为两部分，大多数所有者在一个半平面内，大多数非所有者在另一个补的半平面内。一个良好的分类规则应该分离数据，使得误分类的点数最少：图\
  \ 12.1 中所示线在区分这两个类别方面表现良好，因为它在 24 个点中仅产生了 4 次误分类。我们能做得更好吗？\n\n![图显示了从 20 到 120（千美元）的收入与从\
  \ 13 到 25（千平方英尺）的地面积的对比，并附有所有者和非所有者的点图。](img/c12f001.jpg)\n\n**图 12.1** 24 割草机所有者和非所有者的地面积与收入散点图。（特设的）线试图将所有者与非所有者分开\n\
  \n### 示例 2：个人贷款接受\n\n割草机示例是一个经典案例，有助于描述判别分析的概念和目标。然而，在今天的业务应用中，记录的数量要大得多，且类别之间的划分远不明显。为了说明这一点，我们回到第\
  \ 9 章描述的通用银行（Universal Bank）示例，银行的目标是识别最可能接受个人贷款的新客户。为了简单起见，我们只考虑两个预测变量：客户年收入（`Income`，单位为千美元）和平均每月信用卡支出（`CCAvg`，单位为千美元）。图\
  \ 12.2 的第一部分显示了银行数据库中 200 个客户子集根据收入和 CCAvg 接受个人贷款的情况。我们在两个轴上都使用了对数刻度以增强可见性，因为低收入、低支出区域聚集了许多点。即使对于这个小子集，划分也不清晰。第二幅图显示了所有\
  \ 5000 个客户，以及处理大量记录的额外复杂性。\n\n![图显示了从 1 到 1000（千美元）的年收入与从 0.10 到 10.00（千美元）的每月信用卡平均支出的对比，并附有非接受和接受者的点图。](img/c12f002.jpg)\n\
  \n**图 12.2** 通用银行 5000 名客户的收入、信用卡支出与个人贷款接受的关系（对数刻度）\n\n## 12.2 记录与类别的距离\n\n\n\n\n\
  \n寻找记录之间的最佳分离边界涉及测量它们与其所属类别的距离。通用的思想是将记录归类到距离其最近的类别。假设我们需要根据收入 `x`，将环球银行（Universal\
  \ Bank）的一位新客户分类为个人贷款优惠的 `acceptor`（接受者）或 `nonacceptor`（非接受者）。从银行数据库中，我们发现贷款接受者的平均收入为\
  \ $144.75K，非接受者为 $66.24K。我们可以使用 `Income` 作为贷款接受的预测变量，并遵循简单的 `欧几里德距离规则`：如果 `x` 距离接受者类别的平均收入比非接受者类别的平均收入更近，则将客户分类为\
  \ `acceptor`；否则，将其分类为 `nonacceptor`。换句话说，如果 `|x| − 144.75| < |x| − 66.24|`，则 `classification\
  \ = acceptor`；否则为 `nonacceptor`。从单个预测变量（`income`）扩展到两个或多个预测变量时，类的均值等同于该类的 `centroid`（质心）。这仅仅是均值的向量\
  \ ![](img/c12_ILM0001.gif)。具有 `p` 个测量值 `x = [x[1], …, x[p]]` 的记录与质心 ![](img/c12_ILM0002.gif)\
  \ 之间的欧几里德距离定义为各个值与均值之间平方和的平方根：\n\n(12.1)![numbered Display Equation](img/c12_M0001.gif)\n\
  \n使用欧几里德距离有三个缺点。首先，距离取决于我们选择衡量预测变量的单位。例如，如果我们决定以美元而非每千美元来衡量收入，我们将得到不同的答案。\n\n其次，欧几里德距离没有考虑变量的变异性。例如，如果我们比较两个类别中收入的变异性，会发现接受者的标准差低于非接受者（$31.6K\
  \ 对比 $40.6K）。因此，一个新客户的收入以美元计算可能更接近接受者的平均收入，但由于非接受者收入的变异性很大，该客户同样可能是非接受者。因此，我们希望距离量能够考虑到不同变量的方差，并以标准差而非原始单位来衡量距离。这等同于\
  \ `z`-scores。\n\n第三，欧几里德距离忽略了变量之间的相关性。这通常是非常重要的考虑因素，特别是当我们使用许多预测变量来区分类别时。在这种情况下，通常会有某些变量本身是类别之间的有效区分器，但在其他预测变量存在时实际上是冗的，因为它们捕捉了与其他变量相同的效应。\n\
  \n解决这些缺点的方案是使用名为 `统计距离`（或马氏距离）的量。让我们用 `S` 表示 `p` 个变量之间的协方差矩阵。统计距离的定义为\n\n(12.2)![numbered\
  \ Display Equation](img/c12_M0002.gif)\n\n（符号 `'` 表示 `转置操作`，仅是将列向量转换为行向量）。`S^(−\
  \ 1)` 是 `S` 的逆矩阵，它是除法在 `p` 维上的扩展。当只有一个预测变量（`p = 1`）时，该公式简化为（平方）`z`-score 计算，因为我们减去均值并除以标准差。统计距离不仅考虑了预测均值，还考虑了预测值的离散程度以及不同预测变量之间的相关性。要计算记录与类别之间的统计距离，我们必须计算预测均值（`centroid`）以及每对预测变量之间的协方差。这些值被用于构建距离。判别分析方法使用统计距离作为寻找分离线（如果变量超过两个，则为分离超平面）的基础，使该分离线到不同类别均值的距离相等。它基于测量记录到每个类别的统计距离，并将其分配给最近的类别。这是通过\
  \ `分类函数` 的，接下来将对其进行解释。\n\n## 12.3 费舍线性分类函数\n\n线性分类函数由著名统计学家 R. A. Fisher 于 1936\
  \ 年提出，作为改进记录分类到类别的基础。其核心思想是寻找测量值的线性函数，使得类间变异性与类内变异性的比值最大。换句话说，我们将获得非常同质且彼此差异最大的类别。对于每条记录，这些函数被用于计算得分，衡量该记录与每个类别的接近程度。记录被归类为分类得分最高的类别（等同于最小统计距离）。\n\
  \n分类函数是通过软件估计的。例如，表 12.1 显示了在使用两个预测变量对割草机数据进行判别分析后得到的分类函数。请注意，分类函数的数量等于类别的数量（在这种情况下为两个：`owner/nonowner`）。\n\
  \n|  \n\n```\n code for linear discriminant analysis\n```\n\n |\n\n|  \n\n``````\n\
  library(DiscriMiner)\nmowers.df <- read.csv(\"RidingMowers.csv\")\nda.reg <- linDA(mowers.df[,1:2],\
  \ mowers.df[,3])\nda.reg$functions\n\nOutput\n> da.reg$functions\n             \
  \  Nonowner          Owner\nconstant -51.4214499777 -73.1602116488\nIncome     0.3293554091\
  \   0.4295857129\nLot_Size   4.6815655074   5.4667502174\n```\n\n |\n\n**表 12.1**\
  \ 割草机数据的判别分析，显示分类函数\n\n要将家庭分类为业主（owners）或非业主（`nonowners`），我们使用分类函数计算家庭的分类得分：如果业主函数得分高于非业主函数得分，则将家庭分类为\
  \ `owners`；反之分类为 `nonowners`。这些函数的指定方式可以很容易推广到多个类别。函数给出的值是线性函数中每个变量的权重，类似于多元线性回归。例如，第一个家庭的收入为\
  \ $60K，面积为 18.4K ft²。因此，他们的 `owner` 得分为 − 73.16 + (0.43)(60) + (5.47)(18.4) = 53.2，而他们的\
  \ `nonowner` 得分为 − 51.42 + (0.33)(60) + (4.68)(18.4) = 54.48。由于第二个得分较高，该家庭被模型（误）分类为非业主。此类计算由软件完成，不需要手动计算。例如，由\
  \ R 的 `linDA()` 函数产生的所有 24 个家庭的得分和分类列于 表 12.2 中。\n\n\n\n\n\n\n```r\nda.reg <- linDA(mowers.df[,1:2],\
  \ mowers.df[,3])\n# 手动计算概率（如下）；或者使用 MASS 包中的 lda() 配合 predict()\npropensity.owner\
  \ <- exp(da.reg$scores[,2])/(exp(da.reg$scores[,1])+exp(da.reg$scores[,2]))\ndata.frame(Actual=mowers.df$Ownership,\
  \ \n           da.reg$classification, da.reg$scores, propensity.owner=propensity.owner)\n\
