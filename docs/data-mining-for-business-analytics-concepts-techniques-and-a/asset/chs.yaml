  14 {White,Green} => {Red}   0.2     1.0        1.666667\n4  {Orange}      => {White}\
  \ 0.2     1.0        1.428571\n6  {Green}       => {White} 0.2     1.0        1.428571\n\
  13 {Red,Green}   => {White} 0.2     1.0        1.428571\n```\n\n**表 14.4** 手机面板示例的二值发生矩阵、事务数据库和规则\n\
  \n### 结果解释\n\n我们可以将表 14.5 中的每条规则翻译成易于理解的句子，提供有关性能的信息。例如，我们可以这样读取第 4 条规则：\n\n> 如果购买了橙色，那么有\
  \ 100% 的置信度会有白色。\n\n### 规则与偶然性\n\n随机生成的规则又是怎样的？让我们查看算法对小型数据库的输出——关联规则显示在表 14.5 中。查看这些表格时，记住\
  \ `lhs` 和 `rhs` 指的是项集。\n\n![image](img/c14t002.jpg)\n\n**表 14.5** 随机分配项目的五十次事务\n\
  \n| **最小支持度:** | 4% |\n| **最小置信度 %:** | 70 |\n\n```r\n> rules.tbl[rules.tbl$support\
  \ >= 0.04 & rules.tbl$confidence >= 0.7,]\n                  lhs         rhs support\
  \ confidence lift\n[18]         {item.2} => {item.9}    0.08        0.8 1.48141\n\
  [89]  {item.2,item.7} => {item.9}    0.04        1.0 1.85152\n[104] {item.3,item.4}\
  \ => {item.8}    0.04        1.0 1.85152\n[105] {item.3,item.8} => {item.4}    0.04\
  \        1.0 5.00000\n[113] {item.3,item.7} => {item.9}    0.04        1.0 1.85152\n\
  [119] {item.1,item.5} => {item.8}    0.04        1.0 1.85152\n[149] {item.4,item.5}\
  \ => {item.9}    0.04        1.0 1.85152\n[155] {item.5,item.7} => {item.9}    0.06\
  \        1.0 1.85152\n[176] {item.6,item.7} => {item.8}    0.06        1.0 1.85152\n\
  ```\n\n在这个示例中，提升度比例突出了规则 [105] 最为有趣，因为它表明，当购买项目 3 和 8 时，购买项目 4 的概率是项目 4 与项集 {3,8}\
  \ 不关联时的近五倍。然而，我们知道这些数据背后并没有基础性的关联——它们是随机生成的。\n\n两个原则可以指导我们评估由于偶然效应可能产生的虚假规则：\n\n\
  1. 规则基于的记录越多，结论就越可靠。\n\n\n\n2. 我们考虑的规则越独特（可能合并了多个处理相同条目的规则），那么至少有一些规则是基于随机抽样结果的可能性就越大。如果一个人投\
  \ 10 次硬币并得到 10 次正面，将非常令人惊讶。如果有 1000 人每人投 10 次硬币，那么其中有一个人得到 10 次正面的概率就没那么令人惊讶了。在进行多次比较时对“统计显著性”进行正式调整本身就是一个复杂的课题，且超出了本书的范围。一种合理的方法是从业务或操作的可适用性从上到下地考虑规则，并且不考虑超过可以合理纳入人类决策过程的内容。这将对于通过自动审查成百或数千条规则以寻找“有趣内容”而可能产生的危险施加一个粗略的限制。\n\
  \n现在我们考虑一个更切实际的例子，使用更大的数据库和真实的交易数据。\n\n### 示例 2：相似书籍购买的规则\n\n以下示例（摘自 Charles 图书俱乐部案例；见第\
