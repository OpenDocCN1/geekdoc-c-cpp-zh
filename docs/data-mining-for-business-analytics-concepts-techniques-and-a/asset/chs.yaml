  \n## 12.8 优点与缺点\n\n判别分析通常被认为更多是一种统计分类方法，而非数据挖掘方法。这体现在许多数据挖掘资源中对其的缺失或仅有简短提及。然而，它在社会科学中非常流行，并表现出良好的性能。判别分析的使用和性能与多元线性回归相似。因此，这两种方法共享若干优点和缺点。\n\
  \n与线性回归一样，判别分析寻找预测变量的最优权重。在线性回归中，权重与数值结果变量相关；而在判别分析中，权重与区分类别相关。两种方法都使用最小二乘法进行估计，所得估计值对局部最优具有稳健性。\n\
  \n在这两种方法中，底层假设都是正态性。在判别分析中，我们假设预测变量近似从从正态分布。尽管这一假设在许多实际情况下（例如使用常用的二分类预测变量）被违背，但该方法异常地稳健。根据\
  \ Hastie 等人（2001）的观点，原因可能是因为数据通常只能支持简单的分离边界，例如线性边界。然而，对于发现非常偏态的连续变量（可以通过直方图看出），如对数变换等变换可以提高性能。此外，该方法对异常值的敏感性要求我们探索数据的极值，并从分析中移除这些记录。\n\
  \n判别分析作为分类器的一个优点（在这方面与逻辑回归类似）是它提供了单个预测变量贡献的估计值。([4) 这对于获取预测变量的重要性排序以及变量选择非常有用。\n\
  \n最后，该方法计算简单、模型简洁，且对小数据集特别有用。由于其参数化形式，判别分析充分利用了数据，因此对小样本特别有用（如第 12.7 节所述）。\n\n###\
  \ 问题\n\n### 1. 个人贷款接受\n\n通用银行（Universal Bank）是一家相对年轻的银行，在整体客户获取方面增长迅速。这些客户大部分是负债客户，与银行的关系深度不一。资产客户群规模相当较小，银行希望快速扩大这一基数，以引入更多贷款业务。特别是，它希望探索将其负债客户转换为个人贷款客户的方法。\n\
  \n银行去年针对负债客户开展的一项营销活动显示出健康的转化率，成功率超过 9%。这激励了零售营销部门制定更聪明的活动和更具针对性的营销策略。我们分析的目标是对之前的营销活动客户行为进行建模，以分析哪些因素的组合使得客户更有可能接受个人贷款。这将为新活动的设计提供基础。\n\
  \n`UniversalBank.csv` 文件包含 5000 名客户的数据。数据包括客户的人口统计信息（例如年龄、收入）、客户与银行的关系（例如抵押贷款、证券账户）以及客户对上一次个人贷款营销的响应（Personal\
  \ Loan）。在这 5000 名客户中，只有 480 人（= 9.6%）接受了他们提供的个人贷款。\n\n对数据进行划分（60% 训练集和 40% 验证集），然后执行判别分析，将\
  \ `Personal Loan` 建模为其余预测变量（排除邮政编码）的函数。记住先将具有超过两个类别的分类预测变量转换为虚拟变量。指定成功类为 1，并使用 0.5\
  \ 的默认阈值。\n\n1. 分别计算贷款接受者和非接受者预测变量的汇总统计量。对于连续预测变量，计算平均值和标准差。对于分类预测变量，计算百分比。是否存在两类之间存在显著差异的预测变量？\n\
  \n2. 检查验证集上的模型性能。\n\n    1. 准确率是多少？\n\n    2. 是否某一种类型的误分类比另一种类型更可能发生？\n\n    3.\
  \ 选择三个被误分类为 `acceptors` 的客户和三个被误分类为 `nonacceptors` 的客户。目标是确定他们被误分类的原因。首先，检查他们被归类为接受者的概率：该概率是否接近\
  \ 0.5 的阈值？如果没有，将他们的预测变量值与两类的汇总统计量进行比较，以确定他们为何被误分类。\n\n4. 正如许多营销活动一样，识别会接受提议的客户比识别不接受接受的客户更重要。因此，一个好的模型在检测接受者方面应该特别准确。检查验证集上的提升图（lift\
  \ chart）和分位数提升图（decile-wise lift chart），并根据这一排序目标对其进行解释。\n\n5. 将判别分析的结果与逻辑回归的结果进行比较（两者均使用\
  \ 0.5 阈值和相同的预测变量）。检查混淆矩阵、提升图和分位数图。哪种方法在你的验证集上检测接受者的表现更好？\n\n6. 银行计划通过向额外的 1000 名客户发送提议来继续其活动。假设发送提议的成本为\
  \ 1 美元，接受提议的利润为 50 美元。该活动的预期利润是多少？\n\n\n\n\n\n6. 将贷款接受者客户误分类为非接受者客户的成本远高于相反的误分类成本。为了使误分类的预期成本降至最低，分类的截断阈值（目前为\
  \ 0.5）应该增加还是减少？\n\n## 2. 识别优秀的系统管理员。\n一位管理顾问正在研究经验和培训在系统管理员在规定时间内完成一系列任务的能力方面所起的作用。特别是，她对区分那些能够在规定时间内完成给定任务的管理员与无法完成任务的管理员感兴趣。她收集了\
  \ 75 位随机选择的管理员的性能数据。这些数据存储在 `SystemAdministrators.csv` 文件中。\n\n使用这些数据，顾问执行了判别分析。变量\
  \ `Experience` 衡量的是全职系统管理员的经验月数，而 `Training` 衡量的是相关培训学分的数量。因变量 `Completed` 根据管理员是否完成任务，取值为\
  \ `Yes` 或 `No`。\n\n1. 创建 `Experience` 与 `Training` 的散点图，并使用颜色或符号区分完成任务的管理员与未完成任务的管理员。看看你是否能识别出一条能以最少误分类将两类成员分开的直线。\n\
  2. 使用整个数据集作为训练数据，运行包含两个预测变量的判别分析。在完成任务的人员中，被错误分类为“未完成任务”的管理员百分比是多少？\n3. 为一个具有 4\
  \ 个月经验和 6 个学分的管理员计算两个分类得分。根据这些得分，你会如何对该管理员分类？\n4. 一个具有 4 个培训学分的管理员必须积累多少经验，其完成任务的估计概率才会超过\
  \ 0.5？\n5. 将此模型的分类准确率与通过截断值为 0.5 的逻辑回归得出的准确率进行比较。\n\n## 3. 检测垃圾邮件（来自 UCI 机器学习库）。\n\
  惠尔惠公司的一个团队从他们的邮局管理员和个人邮箱中收集了大量的邮件数据，目的是寻找一种分类器，可以将邮件分为 `spam`（垃圾邮件）和 `nonspam`（也称为“ham”，即正常邮件）。垃圾邮件的概念是多样化的：它包括产品或网站的广告、“快速致钱”计划、链信、色情等。这里使用的定义是“非自愿的商业邮件”。`Spambase.csv`\
  \ 文件包含 4601 封邮件的信息，其中 1813 封被标记为“spam”。预测变量包括 57 个属性，大部分是某个单词（例如 mail, George）或符号（例如\
  \ #, !）在邮件中出现的平均次数。少数预测变量与大写单词的数量和长度有关。\n\n1. 为了将预测变量的数量减少到可管理的范围，通过比较 `spam` 类平均值和\
  \ `nonspam` 类平均值，检查每个预测变量在两类邮件之间的何差异。在 `spam` 和 `nonspam` 邮件之间变化最大的 11 个预测变量是哪些？在这\
  \ 11 个变量中，哪些单词或符号在垃圾邮件中出现频率更高？\n2. 将数据划分为训练集和验证集，然后仅使用 11 个预测变量在训练数据上执行判别分析。\n3.\
  \ 如果我们主要关注检测垃圾邮件信息，这个模型有用吗？请使用验证集的混淆矩阵、提升图（lift chart）和分位数图（decile chart）进行评估。\n\
  4. 在样本中，几乎 40% 的邮件被标记为垃圾邮件。然而，假设这些邮箱账户中垃圾邮件的实际比例为 10%。计算分类函数的常数以考虑这一信息。\n5. 使用了基于你的模型的垃圾邮件过滤器，使得只有被分类为\
  \ `nonspam` 的信息会被投递，而被分类为 `spam` 的信息会被隔离。在这种情况下，将非正常邮件误分类为垃圾邮件的成本高得多。假设隔离非正常邮件的成本是检测到垃圾邮件的\
  \ 20 倍。计算分类函数的常数以考虑这些成本（假设垃圾邮件比例由样本正确反映）。\n\n## 注释\n\n# 第 13 章\n### 结合方法：集成与提升模型\n\
  \n在本章中，我们研究了两种提高预测能力的有效结合方法：集成（ensembles）和提升建模（uplift modeling）。集成将多个监督学习模型结合成一个“超级模型”。本书的前面的章节介绍了用于预测和分类的不同监督方法。早些在第\
  \ 5 章中，我们学习了评估预测性能，这可以用于比较模型并选择最佳模型。集成基于“结合模型”这一强大概念。\n\n在`提升建模` 中，我们将监督建模与 A/B\
  \ 测试（这是一种简单的随机实验）相结合。我们描述了 A/B 测试的基础知识，以及它如何与预测模型结合使用，不仅是为了预测结果，而是为了预测谁应该接收哪种信息。\n\
  \n## 13.1 集成\n集成在 2006 年开始的 Netflix 百万奖赛中起了重要作用。当时，全球最大的 DVD 租赁服务 Netflix 想要改进他们的推荐系统：\n\
  \n> Netflix 的核心是让人们找到他们喜欢的电影。为了帮助客户找到这些电影，我们开发了世界级的电影系统：Cinemach(SM)...虽然 Cinemach\
  \ 已经做得很好，但可以做得更好。\n\n作为一个大胆的举措，公司决定分享大量的用户电影评分数据，并设立了一个面向公众的竞赛，旨在改进他们的推荐系统：\n\n\
  > 我们为您提供大量的匿名评分数据，以及一个比 Cinemach 在相同训练集上表现提高 10% 的预测准确率基准。\n\n\n\n\n组合方法在降低风险方面非常流行。例如，在金融领域，创建投资组合是为了降低投资风险。投资组合的回报通常风险较低，因为它的变异小于每个单个组件的变异。\n\
  \n在预测建模中，“风险”等同于预测误差的变异。预测误差的变化越大，我们的预测模型就越不稳定。考虑两个不同模型对一组包含 `n` 条记录的预测结果。`e[1,\
  \ i]` 是方法 1 对第 `i` 条记录的预测误差，`e[2, i]` 是方法 2 对同一记录的预测误差。\n\n假设每个模型产生的预测误差平均为零（对于某些记录，模型预测高；对于另一些则预测低，但平均误差为零）：\n\
  \n![numbered Display Equation](img/c13_M0001.gif)\n\n如果对每条记录取两个预测值的平均值：![](img/c13_ILM0001.gif)，那么预期的均误差也将为零：\n\
  \n(13.1)![numbered Display Equation](img/c13_M0002.gif)\n\n这意味着集成模型的均误差与单个模型相同。现在，让我们检查集成模型预测误差的方差：\n\
  \n(13.2)![numbered Display Equation](img/c13_M0003.gif)\n\n在某些情况下，这种方差可以小于任何单个方差\
  \ `Var(e[1, i])` 和 `Var(e[2, i])`。关键因素是两个预测误差之间的协方差（或等效的相关性）。不相关的情况得到的数值比任何单个方差都要小。当两个预测误差负相关时，平均预测误差的方差会更小。\n\
  \n总之，使用两个预测值的平均值可能会导致更小的方差，从而提高预测能力。这些结果可以推广到两种以上的方法；你可以结合多个预测方法或分类器的结果。\n\n###\
  \ 简单平均\n\n创建集成模型最简单的方法是组合多个模型的预测、分类或倾向。例如，我们可能有一个线性回归模型、一个回归树和一个 `k`-NN 算法。我们使用这三种方法对测试集进行评分。然后我们对这三组结果进行组合。\n\
  \n这三个模型也可以是相同算法的变体。例如，我们可能有三个线性回归模型，每个模型使用不同的预测变量集。\n\n### 组合预测\n\n在结果变量为数值的预测任务中，我们可以简单地通过平均值来组合不同方法的预测。在上面的示例中，对于测试集中的每条记录，我们都有三个预测值（分别来自每个模型）。集成预测即为这三个值的平均值。\n\
  \n简单平均的另一种方案是取中位数预测，这受极端预测值的影响较小。另一种可能性是计算加权平均值，其中权重与感兴趣的数量成比例。例如，权重可以与模型的准确性成比例；如果使用了不同的数据源，权重可以与数据质量成比例。\n\
  \n用于预测的集成不仅适用于横截面预测，也适用于时间序列预测（见第 16–18 章）。在预测中，这种组合多种方法未来预测结果的方法可以带来更精确的预测。一个例子是天气预报应用\
  \ `Forecast.io` ([www.forecast.io](http://www.forecast.io))，它对其算法描述如下：\n\n> Forecast.io\
  \ 后由广泛的数据源支持，这些数据通过统计方法汇总在一起，为给定位置提供尽可能准确预测。\n\n### 组合分类\n\n在分类情况下，可以使用“投票”来组合多个分类器的结果：对于每条记录，我们有多个分类结果。一个简单的规则是选择这些分类结果中最受欢迎的类别。例如，我们可能使用分类树、朴素贝叶斯分类器和判别分析来对二元结果进行分类。然后对于每条记录，我们都会生成三个预测类别。简单投票将选择这三个类别中最常见的类。\n\
  \n与预测类似，我们可以根据模型准确性或数据质量等考虑，为某些模型的评分分配更大的权重。这将通过设置一个不同于 50% 的“多数规则”来实现。\n\n## 组合倾向\n\
  \n与预测类似，倾向可以通过取简单（或加权）平均值来组合。请记住，某些算法（如朴素贝叶斯，见第 8 章）会产生有偏的倾向，因此不应与其他方法的倾向进行简单平均。\n\
  \n### Bagging\n\n另一种集成形式是基于多个随机数据样本的平均化。`Bagging` 是“自助聚合”（bootstrap aggregating）的缩写，包含两个步骤：\n\
  \n1. 生成多个随机样本（通过对原始数据进行有放回采样）——这种方法被称为“自助采样”。\n2. 在每个样本上运行算法并产生评分。\n\nBagging 通过分别建模不同的数据样本并组合结果，提高了模型的性能稳定性并有助于避免过拟合。因此，它对于树和神经网络等算法特别有用。\n\
  \n### Boosting\n\n`Boosting` 是创建集成模型的一种稍有不同的方法。这里的目标是通过强制模型更多关注某些记录，直接改进数据中模型出错的区域。Boosting\
  \ 的步骤是：\n\n1. 对数据拟合模型。\n2. 从数据中抽取样本，使得分类分类的记录（或预测误差大的记录）具有更高的选择概率。\n3. 在新样本上拟合模型。\n\
  4. 重复步骤 2–3 多次。\n\n### R 中的 Bagging 和 Boosting\n\n在第 9 章中，我们描述了基于自助树的随机森林。我们展示了针对个人贷款示例的随机森林实现。R\
  \ 中的 `abag` 包可以生成自助树和提升树。表 13.1 和 13.2 显示了生成自助树和提升树的 R 代码和输出，以及如何将其用于生成验证集的分类。\n\
  \n**表 13.1**](#c13.xhtml_table13-1) 个人贷款数据上的 Bagging 和 Boosting 分类：R 代码\n\n```r\n\
  \ 用于 bagging 和 boosting trees 的代码\nlibrary(adabag)\nlibrary(rpart) \nlibrary(caret)\n\
  \nbank.df <- read.csv(\"UniversalBank.csv\")\nbank.df <- bank.df[ , -c(1, 5)]  #\
  \ 删除 ID 和邮政编码列\n\n# 将 Personal.Loan 转换为分类变量\nbank.df$Personal.Loan = as.factor(bank.df$Personal.Loan)\n\
  \n### 划分数据\ntrain.index <- sample(c(1:dim(bank.df)[1]), dim(bank.df)[1]*0.6)  \n\
  train.df <- bank.df[train.index, ]\nvalid.df <- bank.df[-train.index, ]\n\n# 单棵树\n\
  tr <- rpart(Personal.Loan ~ ., data = train.df)\npred <- predict(tr, valid.df, type\
  \ = \"class\")\nconfusionMatrix(pred, valid.df$Personal.Loan)\n\n# bagging\nbag\
  \ <- bagging(Personal.Loan ~ ., data = train.df)\npred <- predict(bag, valid.df,\
  \ type = \"class\")\nconfusionMatrix(pred$class, valid.df.Personal.Loan)\n\n# boosting\n\
  boost <- boosting(Personal.Loan ~ ., data = train.df)\npred <- predict(boost, valid.df,\
  \ type = \"class\")\nconfusionMatrix(pred$class, valid.df.Personal.Loan)\n```\n\n\
