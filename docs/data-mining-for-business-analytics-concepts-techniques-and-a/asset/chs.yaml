  \ #1 从置信度水平来看是一个非常有前景的规则，但可能没有意义。它说：“如果购买了意大利菜书籍，则购买了菜谱。”意大利菜书籍很可能是菜谱的一个子集。规则 14、15\
  \ 和 16 涉及相同的三本书籍，但前件和后件不同。规则 17 和 18 以及 19 和 20 也是如此。（这样的配对和组通过查找具有相同支持度的行很容易找到。）这并不意味着这些规则没有用。相反，它可以减少从业务角度考虑可能采取行动的项集数量。\n\
  \n## 14.2 协同过滤 (3)\n\n推荐系统是提供多种产品或服务的网站至关重要的部分。示例包括 Amazon.com，它提供数百万种不同的产品；Netflix\
  \ 有数千部电影供租赁；Google 搜索海量网页；Spotify 和 Pandora 等网络电台网站包含各种艺术家的各种音乐专辑；旅游网站提供许多目的地和酒店；社交网络网站有许多小组。推荐引擎根据用户的信息以及相似用户的信息为用户提供个性化推荐。信息意味着指示偏好的行为，例如购买、评分和点击。\n\
  \n\n\n推荐系统为用户提供的价值有助于在线公司将浏览者转化为买家，增加交叉销售并建立忠诚度。\n\n协同过滤是此类推荐系统使用的一种流行技术。*协同过滤*（collaborative\
  \ filtering）这一术语基于通过考虑许多用户的偏好（协作），从大量的物品中识别特定用户的相关物品（过滤）。\n\n[Fortune.com](http://Fortune.com)\
  \ 文章“亚马逊的推荐秘密”（2012 年 6 月 30 日）描述了该公司不仅为提供个性化产品推荐，还通过协同过滤为每个用户定制整个网站界面：\n\n> 从根本上说，这家零售巨头的推荐系统基于许多简单元素：用户过去购买过什么、他们的虚拟购物车里有什么、他们评分和喜欢的物品，以及其他客户查看和购买了什么。亚马逊将这种自研数学称为“物品间协同过滤”，并使用该算法为返回客户深度定制浏览体验。\n\
  \n### 数据类型和格式\n\n协同过滤需要所有物品-用户信息。具体来说，对于每个物品-用户组合，我们应该拥有该用户对该物品偏好的度量。偏好可以是数值评分，也可以是二值行为，如购买、“赞”或点击。\n\
  \n\n\n对于 `n` 个用户 (`u[1]`, `u[2]`, …, `u[n]`) 和 `p` 个物品 (`i[1]`, `i[2]`, …`i[p]`)，我们可以将数据视为一个\
  \ `n` × `p` 的矩阵，包含 `n` 行（用户）和 `p` 列（物品）。每个单元格包含该用户对物品偏好的对应的评分或二值事件（参见表 14.9 中的示意图）。通常并不是每个用户都会购买或评分每个物品，因此购买矩阵将有很多零（它是稀疏的），而评分矩阵将有很多缺失值。这些缺失值有时传达了“不感兴趣”（与表示感兴趣的非缺失值相反）。\n\
  \n![image](img/c14t003.jpg)\n\n**表 14.9**](#c14.xhtml_tableanchor14-10) 带有评分数据的矩阵格式示意图\n\
  \n当 `n` 和 `p` 都很大时，在 `n` × `p` 表中存储偏好数据 (`r[u, i]`) 是不可行的。相反，数据可以存储在许多行三元组中，形式为\
  \ (`U[u]`, `I[i]`, `r[u, i]`)，每个三元组包含用户 ID、物品 ID 和偏好信息。\n\n### 示例 3：Netflix 竞赛\n\
  \n我们一直关联规则和协同过滤视为无监督技术，但通过查看留存数据（holdout data），观察用户购买了什么以及他们如何评价物品，就可以判断它们的效果如何。第\
  \ 13 章中提到的著名的 Netflix 竞赛正是这样做的，并为说明协同过滤提供了一个实用的例子，尽管扩展到训练和验证已超出本书的范范围。\n\n2006 年，北美最大的电影租赁服务商\
  \ Netflix 宣布了一项金额为百万美元的竞赛（[www.netflixprize.com](http://www.netflixprize.com)），目的是改进其名为\
  \ `Cinematch` 的推荐系统。参与者被提供若干数据集，每个电影对应一个。每个数据集包含该电影的所有客户评分（以及时间戳）。我们可以认为一个大型组合数据集的形式为\
  \ [客户 ID, 电影 ID, 评分, 日期]，其中每条记录包含特定客户在特定日期对特定电影出的评分。评分采用 1–5 星制。参赛者被要求开发一种能够改进现有\
  \ Netflix 系统的推荐算法。表 14.10 显示了竞赛数据的一个较小样本，以矩阵格式组织。\n\n![image](img/c14t004.jpg)\n\
  \n**表 14.10**](#c14.xhtml_tableanchor14-11) Netflix 竞赛记录样本，针对 10 个客户和 9 部电影的子集\n\
  \n有趣的是，获胜团队通过不仅考虑电影的评分，还考虑特定客户*是否*对电影进行了评分，改进了他们的系统。换句话说，客户决定评价哪些电影的信息对于客户偏好具有关键信息价值，超过了简单的\
  \ 1–5 分的评分信息^(4)\n\n> 协同过滤方法处理稀疏的评分值集合。然而，通过查看数据的其他特征也可以获得很大的准确性。首先是关于每个用户选择对哪些电影评分的信息，无论具体的评分值如何（“二值视图”）。这在我们\
  \ 2007 年的解决方案中起了决定性作用，并反映了被评分的电影是由用户故意选择的，而不是随机样本。\n\n这是一个将评分信息转换为已评分/未评分的二值矩阵证明是有有用的例子。\n\
  \n### 基于用户的协同过滤：“像你的人”\n\n使用协同过滤为用户生成个性化推荐的一种方法是基于寻找具有相似偏好的用户，并推荐他们喜欢但用户尚未购买的物品。算法有两个步骤：\n\
  \n1. 找到与感兴趣的用户最相似的用户（邻居）。这是通过比较我们的用户的偏好与其他用户的偏好完成。\n2. 仅考虑用户*尚未*购买的物品，推荐邻居最喜欢的物品。\n\
  \n这是亚马逊“购买此物品的客户也购买了……”背后的方法（参见图 14.1）。它也被用于 Google 搜索，以生成显示每个搜索结果附近的“相似页面”链接。\n\
  \n步骤 1 需要选择一个距离（或接近度）度量来衡量我们的用户与其他用户之间的距离。一旦计算出距离，我们可以对距离或所需的邻居数量设置阈值，以确定步骤 2 中使用的最近邻居。这种方法被称为“基于用户的\
  \ Top-*N* 推荐”。\n\n最近邻方法衡量我们的我们的用户到数据库中每个其他用户的距离，类似于 `k`-最近邻算法（参见第 7 章）。我们在该章中讨论的欧几里得距离度量在协同过滤方面的效果不如其他度量。两个用户之间常用的接近度度量是他们评分之间的皮尔逊相关系数。我们用用户\
  \ `U[1]` 对物品 `I[1]`, …, `I[p]` 的评分记为 `r[1]`。\n\n\n\n当我们拥有大型用户数据库时，最近邻算法的计算开销可能很大。一种解决方案是使用聚类方法（见第\
  \ 15 章）根据用户的偏好将用户分组为同类簇，然后测量用户到每个簇的距离。这种方法将计算负载放在了聚类步骤，而该步骤可以更早且离线进行；这样在实时将用户与每个簇进行比较就会更加廉价（且更快）。聚类的代价是推荐的准确性会降低，因为最近簇中的所有成员并不与我们的用户最相似。\n\
  \n### 基于物品的协同过滤\n\n当用户数量远大于物品数量时，寻找相似物品比寻找相似用户的计算成本更低（且更快）。具体来说，当用户对特定物品表示兴趣时，基于物品的协同过滤算法有两个步骤：\n\
  \n1. 找到与感兴趣物品被（任何用户）共同评分或共同购买的物品。\n2. 在相似物品中推荐最流行或相关性最高的物品。\n\n现在相似性是在物品之间计算的，而不是用户之间。例如，在我们小的\
  \ Netflix 样本中（表 14.10），电影 1（平均分 ![](img/c14_M0012.gif)\n\n零相关是因为评分过电影 1 的用户对电影 5\
  \ 给出了相反的评分。一个用户给了 5 星，另一个用户给了 1 星。\n\n同样，我们可以计算所有电影之间的相似性。这可以离线完成。在实时，对于对某部电影给出高分的用户，我们可以查找电影相关性表，并向用户推荐与其新评分电影正相关性最高的电影。\n\
  \n根据开发 Amazon 物品物品推荐系统的研究人员编写的一份行业报告^(6)：\n\n> “[基于物品的]算法可以实时生成推荐，扩展到海量数据集，并生成高质量的推荐。”\n\
  \n基于物品的推荐的缺点是物品之间的多样性较少（与用户的口味相比），因此，推荐往往是显而易见的。\n\n表 14.11 显示了使用 `recommenderlab`\
  \ 包对类似于 Netflix 数据的模拟数据进行协同过滤的 R 代码。\n\n```\n### code for collaborative filtering\n\
  ### 模拟一个包含 1000 个用户和 100 个物品的矩阵\nm <- matrix(nrow = 1000, ncol = 100)\n### 模拟评分（数据的\
  \ 1%）\nm[sample.int(100*1000, 1000)] <- ceiling(runif(1000, 0, 5))\n### 转换为 realRatingMatrix\n\
  r <- as(m, \"realRatingMatrix\")\n\nlibrary(recommenderlab)\n### 基于用户的协同过滤\nUB.Rec\
  \ <- Recommender(r, \"UBCF\")\npred <- predict(UB.Rec, r, type=\"ratings\")\nas(pred,\
  \ \"matrix\")\n\n### 基于物品的协同过滤\nIB.Rec <- Recommender(r, \"IBCF\")\npred <- predict(IB.Rec,\
  \ r, type=\"ratings\")\nas(pred, \"matrix\")\n```\n\n表 14.11 R 中的协同过滤\n\n### 协同过滤的优点与缺点\n\
  \n协同过滤依赖于用户偏好的主观信息的可用性。如果我们的数据库包含足够的相似用户（不一定很多，但每个用户至少有几个），它即使对“长尾”物品也能提供有用的推荐，这样每个用户都能找到口味相似的其他用户。同样，数据应该包含足够的每个物品评分或购买记录。因此，协同过滤的一个局限性是它无法为新用户或新物品生成推荐。应对这一挑战有多种方法。\n\
  \n基于用户的协同过滤通过从高评分或偏好物品的相似性来寻找相似性。然而，它对低评分或不想要物品的数据视而不见。因此，我们不能期望原样使用它来检测不需要的物品。\n\
  \n基于用户的协同过滤有助于利用人们口味之间的相似性来提供个性化推荐。然而，当用户数量变得非常大时，协同过滤的计算会变得困难。解决方案包括基于物品的算法、用户聚类和降维。在这种情况下最常用的降维方法是奇异值分解\
  \ (`SVD`)，它是主成分分析的一种计算卓越的形式（见第 4 章）。\n\n虽然“预测”一词经常用于描述协同过滤的输出，但这种方法本质上是无监督的。它可以用于为用户生成预测评分或购买指示，但在实践中我们通常没有真实的结果值。改进协同过滤生成的推荐的一种重要方法是获取用户反馈。一旦生成了推荐，用户可以指示推荐是否合适。由于这个原因，许多推荐系统会鼓励用户对其推荐提供反馈。\n\
  \n### 协同过滤 vs 关联规则\n\n虽然协同过滤和关联规则都是用于生成推荐的无监督方法，但它们在几个方面不同：\n\n- **频繁项集 vs. 个性化推荐**：关联规则寻找频繁的物品组合，并仅对这些物品提供推荐。相比之下，协同过滤为每个物品提供个性化推荐，从而迎合具有独特口味的用户。从这个意义上说，协同过滤有助于捕捉用户偏好的“长尾”，而关联规则寻找“头部”。这种差异对所需数据有影响：关联规则需要大量的\
  \ `baskets`（交易）以找到包含某些物品组合的足够数量。相比之下，协同过滤不需要许多 `baskets`，但需要每个用户尽可能多的物品数据。此外，关联规则在篮子级别运行（我们的数据库每个用户可以包含多次交易），而协同过滤在用户级别运行。由于关联规则产生通用的、非个性化的规则（如\
  \ Amazon 的“经常一起购买”等关联规则推荐会对所有搜索特定物品的用户显示相同的推荐），它们可以用于制定通用策略，例如商店的产品摆放或医院的诊断检查顺序。相比之下，协同过滤生成用户特定的推荐（例如\
  \ Amazon 的“购买此物品的人也购买了……”），因此是为为个性化设计的工具。\n\n- **交易数据 vs. 用户数据**：关联规则根据物品在许多交易/篮中与其他物品的共同购买提供物品推荐。相比之下，协同过滤根据极少数其他用户的共同购买或共同评分提供物品推荐。考虑不同的篮子在相同物品被反复购买时非常有用（例如杂货购物）。考虑不同的用户在每个物品通常只被购买/评分一次时有用（例如书籍、音乐和电影的购买）。\n\
  \n- **二值数据和评分数据**：关联规则将物品视为二值数据（1 = 购买，0 = 未购买），而协同过滤可以在二值数据上运行，也可以在数值评分上运行。\n\n\
  \n\n\n*   **两个或多个项目**：在关联规则中，前件和后件各可以包含一个或多个项目（例如，`IF milk THEN cookies and cornflakes`，如果买牛奶则买饼干和玉米片）。因此，推荐可能是感兴趣的项目与多个项目的组合（“购买牛奶、饼干和玉米片可享\
  \ 9 折优惠”）。相比之下，在协同过滤中，相似性是在项目`pairs`之间或用户对之间衡量的。因此，推荐将针对单个项目（与你相似的人购买过的最热门、但你尚未购买的物品），或者是针对多个不一定相互相关的单个项目（与你相似的人购买过的排名前二最热门、但你尚未购买的物品）。\n\
  \n在针对非热门物品的购买和推荐时，这些区别更加明显，特别是当将关联规则与基于用户的协同过滤进行比较时。当考虑为购买过热门物品的用户推荐内容时，关联规则和基于物品的协同过滤可能会针对单个项目产生相同的推荐。但基于用户的推荐可能会有所不同。考虑一位每周都购买牛奶以及无麸质产品（其他客户很少购买此类产品）的客户。假设对交易数据库使用关联规则，我们识别出规则\
  \ `IF milk THEN cookies`。那么，下一次该客户购买牛奶时，他/她将收到购买饼干的推荐（例如优惠券），无论他/她是否购买过饼干，也无论其是否购买过无麸质产品。在基于物品的协同过滤中，我们将查看所有用户与牛奶共同购买的所有项目，并推荐其中最热门的项目（我们的客户尚未购买的项目）。这可能也会导致对饼干的推荐，因为该项目我们的客户尚未购买。现在考虑基于用户的协同过滤。基于用户的协同过滤寻找相似的客户——即购买了相同项目集合的人——然后推荐这些邻居最常购买的项目，而这些项目`was\
  \ not purchased by our customer`。因此，基于用户的推荐不太可能推荐饼干，而更有可能推荐推荐客户尚未购买的热门无麸质产品。\n\n\
  ## 14.3 总结\n\n关联规则（也称为市场篮子分析）和协同过滤是无监督方法，用于从交易数据库中推断购买项目之间的关联性。关联规则搜索关于共同购买项目的通用规则。这种方法的主要优势是它能生成如“如果\
  \ *X* 被购买，那么 *Y* 也可能被购买”的清晰、简单的规则。该方法非常透明且易于理解。\n\n创建关联规则的过程分为两个阶段。首先，基于频繁项目集生成一组候选规则（`Apriori`\
  \ 算法是最常用的规则生成算法）。然后，从这些候选规则中选择出指示项目间存在最强关联的规则。我们使用 `support`（支持度）和 `confidence`（置信度）指标来评估规则的不确定性。用户还会指定在规则生成和选择过程中用的最小支持度和置信度值。第三个衡量指标\
  \ `lift`（提升度）比例，比较了规则检测真实关联的效率与随机组合的效率。\n\n关联规则的缺点是生成的规则数量过多。因此，需要一些方法将这些规则减少为一小部分有用且强大的规则。一种压缩信息的重要非自动化方法是检查规则以是否存在无信息和琐碎的规则，以及具有相同支持度的规则。另一个需要注意的问题是，稀有组合往往会被忽略，因为它们不满足最小支持度要求。因此，数据中的项目频率大致相等会更好。这可以通过使用更高别的层次结构作为项目来实现。例如，在从书店交易数据库中推导关联规则时，使用书籍类型而不是单个书籍的标题。\n\
  \n协同过滤是在线推荐系统中使用的一种流行技术。它基于对某项目采取相似行为（例如购买该项目或对其给出高评分）的用户形成的项目间关系。基于用户的协同过滤基于项目-用户组合数据运行，计算用户之间的相似性并为用户提供个性化推荐。协同过滤成功的关键要素是用户对提供的推荐提供反馈，并且对每个项目都有足够的信息。协同过滤方法的一个缺点是它们无法为新用户或新项目生成推荐。此外，由于用户数量巨大，基于用户的协同过滤在计算上变得具有挑战性，经常使用基于物品的方法或降维等替代方案。\n\
