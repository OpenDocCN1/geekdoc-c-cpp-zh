  \ 10,000 名选民的样本随机分为两半，向列表的一半发送了推广斯密斯的信息（处理组 A），对另一半不发送任何内容（处理组 B）。未收到信息的控制组至关重要，因为其他竞选活动或新闻事件可能会导致意见的转变。目标是衡量信息发送后，相对于未收到信息的控制组的意见变化。\n\
  \n下一步是对这同样的 10,000 名选民进行事后调查，以衡量每位选民对斯密斯的观点是否发生了正向转变。在上述数据中将添加一个二变量 `Moved_AD`，表示观点是否向民主党方向转变\
