  6      8 45.70000 35.95000 44.20000\n7  (all) 22.09384 28.44000 22.53281\n```\n\n\
  ## 表 4.7 R 中的透视表\n\n在分类任务中，目标是寻找区分两个类别的预测变量，一个很好的探索性步骤是为每个类别生成摘要。这有助于检测在两个类之间显示出某些分离性的有用预测变量。数据摘要对于几乎任何数据挖掘任务都是有用的，因此它们是在进行进一步分析之前，清理和理解数据的重要准备步骤。\n\
  \n## 4.5 相关性分析\n\n在具有大量变量（这些变量可能作为预测变量）的数据集中，变量集涵盖的信息通常有很大重叠。发现冗余的一种简单方法是查看相关性矩阵。它显示了变量之间所有两对的相关性。具有很强（正或负）相关性的配对包含大量信息重叠，是删除其中一个变量进行数据降维的良好候选。删除与其他变量强相关的变量有助于避免在各种模型中出现多共线性问题。（*多共线性*是指两个或多个预测变量与结果变量共享相同的线性关系；`R`\
  \ 在回归中会自动处理这种情况。）\n\n相关性分析也是检测数据中变量重复的良好方法。有时，同一个变量会意外在数据集中出现多次（使用不同的名称），这是因为数据集是从多个源合并的、相同的现象在不同的单位中测量，以及等原因。使用如第\
  \ 3 节所示的相关性表热图，可以使识别强相关性的任务变得更容易。\n\n## 4.6 减少分类变量中的类别数量\n\n当分类变量具有许多类别，且该变量注定作为预测变量时，许多数据挖掘方法将要求将其转换为许多虚拟变量。特别是，一个具有\
  \ `m` 个类别的变量将转换为 `m` 或 `m - 1` 个虚拟变量（取决于具体方法）。这意味着即使我们的原始分类变量非常少，它们也会极大地膨胀数据集的维度。处理此问题的一种方法是通过合并相近或相似的类别来减少类别数量。合并类别需要结合专家知识和常识。透视表对于此任务非常有用：我们可以检查各个类别的规模以及结果变量在每个类别中的表现。通常，包含极少数观测值的类别是与其它类别合并的良好候选。仅使用与分析最相关的类别，并将其余标记为“其他（other）”。在分类任务（具有分类结果变量）中，按结果类别细分的透视表可以帮助识别无法区分类别的类别。这些类别同样是包含在“其他”类别中的候选。一个示例如\
  \ 图 4.1 所示，其中结果变量 `CAT.MEDV` 的分布按 `ZN`（在此处视为分类变量）进行细分。我们可以看到 `CAT.MEDV` 的分布在 `ZN\
  \ = 17.5`、`90`、`95` 和 `100` 时是相同的（其中所有社区的 `CAT.MEDV = 1`）。这四个类别随后可以合并。我们可以看到 `CAT.MEDV`\
  \ 的分布在 `ZN = 17.5`、`90`、`95` 和 `100` 时是相同的（其中所有社区的 `CAT.MEDV = 1`）。这四个类别随后可以合并。\n\
  \n![ZN 的 CAT.MEDV 分布图](img/c04f00.jpg)\n\n## 图 4.1 按 ZN 的 CAT.MEDV 分布\n\n## 4.7\
  \ 将分类变量转换为数值变量\n\n有时，分类变量中的类别代表区间。常见的例子是年龄组或收入水平。如果区间值是已知的（例如，类别 2 是 20-30 岁的年龄区间），我们可以用区间的值替换分类值（此处为“25”）。结果将是一个数值变量，不再需要多个虚拟变量。\n\
  \n### 4.8 主成分分析\n\n*主成分分析*（PCA）是一种非常有用的降维方法，特别是在变量变量数量很多时候。当我们有一组在相同尺度上测量且高度相关的子集时，PCA\
  \ 特别有价值。在这种情况下，它提供了几个（通常只有三个）作为原始变量的加权线性变量，并保留了原始集合的大部分信息。PCA 旨在用于数值变量。对于分类变量，其他方法（如对应分析）更为合适。\n\
