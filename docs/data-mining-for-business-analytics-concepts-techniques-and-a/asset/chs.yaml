  \n在逻辑回归中，`Y` 与 β 参数之间的关系是非线性的。因此，β 参数不使用最小二乘法进行估计（如线性回归那样）。相反，使用了一种名为`极大似然`的方法。简单来说，该思想是找到使现有数据概率最大的估计。这需要使用计算机程序进行迭代。\n\
  \n计算系数估计的算法没有线性回归算法那么稳健。\n\n... 为了说明此类过程的典型输出，我们对 3000 名 Universal 银行客户的训练集拟合逻辑模型。结果变量是个人贷款，其中\
  \ `Yes` 定义为`成功`（这等同于将接受者设为 1，非接受者设为 0）。\n\n### 数据预处理\n\n我们首先将预测变量 Education 转换为因子变量。在数据集中，它被编码为整数，取值为\
  \ 1、2 或 3。为了将其转换为因子变量，我们使用 R 函数 `factor()`。当我们将此预测变量包含在 R 的逻辑回归中时，它将根据因子的三个水平自动创建虚拟变量。逻辑回归只会使用三个水平中的两个，因为使用所有三个会产生多共线性问题（参见第\
  \ 6 章）。总而言，R 中的逻辑回归函数将包含 6 = 2 + 1 + 1 + 1 + 1 个虚拟变量，用来描述表 10.1 中的五个分类预测变量。结合六个数值预测变量一起，我们总共有\
  \ 12 个预测变量。\n\n\n接下来，我们将数据随机划分为训练集（60%）和验证集（40%）。我们使用训练集来拟合逻辑回归模型，并使用验证集来评估模型的性能。\n\
