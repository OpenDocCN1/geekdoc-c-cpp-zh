  \ Universal Bank 信用卡与较低的接受率相关。\n\n### 从比率的角度解读结果\n\n忽略忽略系数的 *p*-值，基于所有 12 个预测变量的模型具有估计的逻辑方程：\n\
  \n(10.9)![编号显示方程](img/c10_M0010.gif)\n\n虚拟变量 `EducationGraduate`、`EducProf` 和 `CD.Account`\
  \ 的正系数意味着，持有定期存款（CD）账户以及拥有研究生或专业教育背景（在虚拟变量中均标记为 1）与更高的贷款报价接受概率相关。相比之下，拥有证券账户、使用网上银行以及拥有\
  \ Universal Bank 信用卡与较低的接受率相关。\n\n报告比率（Odds）而非概率结果的优势在于，上述语句对于 `X[1]` 的任何值都成立。除非\
  \ `X[1]` 是虚拟变量，否则我们无法将此类关于 `X[1]` 增加一个单位的影响的陈述应用于概率。这是因为结果依赖于 `X[1]` 的实际值。因此，如果我们将\
  \ `X[1]` 从 3 增加到 4，对 *p*（属于类别 1 的概率）的影响将与 `X[1]` 从 30 增加到 31 的影响不同。简而言之，当特定预测变量增加一个单位时，概率\
  \ *p* 的变化并不是常数——它取决于预测变量的具体值。因此，我们只在特定记录的背景下讨论概率。\n\n\n\n第 5 节中描述的通用性能指标被用于评估逻辑模型的性能。回想起，有多种性能指标，最流行的是基于混淆矩阵的指标（仅准确率或结合成本的指标）以及提升图（lift\
  \ chart）。与其他分类方法一样，目标是找到一个仅使用预测器信息就能准确地将记录分类到其所属类别的模型。该目标的一个变体是`ranking`（排序），即找到一个模型，能够对一组新记录更优地识别出我们感兴趣的特定类别的成员（这可能以整体准确率的下降为代价）。由于训练数据被用于选择模型，我们期望模型在这些数据上的表现得非常好，因此更倾向于在验证集上测试其性能。回想起，验证集中的数据没有参与模型的构建，因此我们可以使用它们来测试模型分类它未“见过”的数据的能力。\n\
  \n要从逻辑回归分析中获取混淆矩阵，我们使用估计方程来预测验证集中每个记录属于某一类别的概率（`propensities`），并使用截断值（cutoff value）来决定这些记录的分类。然后，我们将这些分类结果与这些记录的实际类别进行比较。在通用银行（Universal\
  \ Bank）案例中，我们使用方程 (10.10) 中的估计模型来预测包含 2000 名客户的验证集中接受提议的概率（这些数据未用于建模步骤）。技术上，这是通过使用方程\
  \ (10.10) 中的估计模型预测 `logit`，然后通过关系 `p = e^(logit)/1 + e^(logit)` 获取概率 `p` 实现的。然后我们将这些概率与选定的截断值进行比较，以便将\
  \ 2000 条验证记录中的分类为接受者或非接受者。\n\n表 10.3 显示了验证集中前 5 条记录的倾向（propensities）。假设我们使用 `0.5`\
  \ 作为截断值。我们看到前三个客户接受提议的概率低于 `0.5` 的截断值，因此他们被分类为非接受者（0）。事实上，他们确实是非接受者（实际 = 0）。第四和第五位客户的接受概率被模型估计超过\
  \ `0.5`，因此他们被分类为接受者（1）。虽然第四位客户确实是接受者（实际 = 1），但我们的模型误将第五位客户归类为接受者，而实际上他是非接受者（实际 =\
  \ 0）。\n\n| |\n```\n code for using logistic regression to generate predicted probabilities\n\
