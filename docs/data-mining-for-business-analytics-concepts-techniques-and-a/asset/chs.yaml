  \ |\n\n### 表 4.9 麦片热量与评分\n\n可以看出这两个变量强相关，负相关系数为\n\n```\n![numbered Display Equation](img/c04_M0002.gif)\n\
  ```\n\n粗略来说，两个变量总变异的 69% 实际上是“协变异”，即一个变量中的变化被另一个变量的相似变化所重复。我们能否利用这一事实在减少变量数量的同时，最大限度地利用它们对整体变异的独特贡献？由于两个变量包含的信息存在冗余，可能可以在不丢失太多信息的情况下将两个变量减少为一个。主成分分析（PCA）的思想是找到两个变量的线性组合使其包含大部分（即使不是全部）信息，以便这个新变量可以替代两个原始变量。这里的信息是指变异性方面的信息：什么能解释\
  \ 77 种麦片*之间*最大部分变异？这里的总变异是两个变量方差之和，在本例中为 379.63 + 197.32 = 577。这意味着 `calories` 占据了总变异的\
  \ 66%（即 379.63 / 577），而 `rating` 占据了剩余的 34%。如果我们为了降而降维而丢弃其中一个变量，我们将丢失至少 34% 的变异。\n\
  \n图 4.4 显示了 `rating` 与 `calories` 的散点图。直线 `z1` 是数据变异最大的方向。如果我们决定将数据维度从两个降到一，它是捕捉最多数据变异的直线。在所有可能的直线中，它是当我们对数据集中的点正交投影得到\
  \ 77 个（一维）值时，使得 `z1` 值的方差最大的直线。这被称为*第一主成分*。它也是使直线垂直距离平方和最小的直线。`z2` 轴被选择为垂直 `z1`\
  \ 轴。在两个变量的情况下，只有一条直线与 `z1` 垂直，它具有次大的变异，但其信息与 `z1` 不相关。这被称为*第二主成分*。通常，当我们有超过两个变量时，一旦找到变异最大的\
  \ `z1` 方向，我们就在所有 `z1` 的正交方向中搜索变异次高的方向。这就是 `z2`。其思想是找到这些直线的坐标，并观察它们如何重新分配变异。\n\n\n\
  \n\n**图 4.4**](#c04.xhtml_figureanchor4-4) 77 种早餐麦片的 `rating` 与 `calories` 的散点图，显示了两个主成分方向\n\
  \n在 R 中运行 PCA 是通过 `prcomp()` 函数完成的。表 4.10 显示了对两个变量 `calories` 和 `rating` 运行 PCA\
  \ 的输出。该函数的 `.rot` 值是旋转矩阵，它提供了用于将原始点投影到两个新方向的权重。`z[1]` 的权重由 (0.847, −0.532) 给出，`z[2]`\
  \ 的权重由 (0.532, 0.847) 给出。`summary()` 函数给出重新分配的差：`z[1]` 解释了总变异性的 86%，`z[2]` 解释了剩余的\
  \ 14%。因此，如果我们舍弃 `z[2]`，仍然保留了 86% 的总变异性。\n\n| 运行 PCA 的代码 |\n| :--- |\n| ```\ncereals.df\
  \ <- read.csv(\"Cereals.csv\") \n# 在两个维度上计算 PC\npcs <- prcomp(data.frame(cereals.df$calories,\
  \ cereals.df$rating)) \nsummary(pcs) \npcs$rot\nscores <- pcs$x\nhead(scores, 5)\n\
  Output\n> summary(pcs) \n\nImportance of components:\n                         \
  \  PC1    PC2\nStandard deviation     22.3165 8.8844\nProportion of Variance  0.8632\
  \ 0.1368\nCumulative Proportion   0.8632 1.0000\n\n> pcs$rot\n                 \
  \          PC1       PC2\ncereals.df.calories  0.8470535 0.5315077\ncereals.df.rating\
  \   -0.5315077 0.8470535\n\n> scores <- pcs$x\n> head(scores, 5)\n\n           \
  \ PC1        PC2\n[1,] -44.921528  2.1971833\n[2,]  15.725265 -0.3824165\n[3,] -40.149935\
  \ -5.4072123\n[4,] -75.310772 12.9991256\n[5,]   7.041508 -5.3576857\n``` |\n\n\
  | **表 4.10**](#c04.xhtml_tableanchor4-10) 对两个变量 `calories` 和 `rating` 进行 PCA |\n\
  \n这些权重用于计算主成分得分，这些得分是 `calories` 和 `rating` 投影到新轴上的值（在减去均值之后）。在 R 中，两个维度的得分由 PCA\
  \ 值 `.x` 描述。第一列是使用权重 (0.847, −0.532) 投影到 `z[1]` 的值。第二列是使用权重 (0.532, 0.847) 投影到 `z[2]`\
  \ 的结果。例如，100% 全麦麦片（含 70 卡路里，评分为 68.4）的第一个得分为 ![](img/c04_ILM0001.gif)。\n\n注意，新变量\
  \ `z[1]` 和 `z[2]` 的均值为零，因为我们减去了每个变量的均值。方差之和 `var(z[1]) + var(z[2])` 等于原始变量的方差之和\
  \ `var(calories)+var(rating)`。此外，`z[1]` 和 `z[2]` 的方差分别为 498 和 79，因此第一个主成分 `z[1]`\
  \ 占了 86% 的总方差。由于它捕捉了数据中大部分变异性，因此使用一个变量（第一个主成分得分）来代表原始数据中的两个变量是合理的。接下来，我们将这些思想推广到两个以上变量的情况。\n\
  \n### 主成分\n\n让我们将上述过程形式化，以便于将其推广到 `p > 2` 个变量。用原始的 `p` 个变量标记为 `X[1]`, `X[2]`, …,\
  \ `X[p]`。在 PCA 中，我们正在寻找一组新变量 `Z[1]`, `Z[2]`, …, `Z[p]`，它们是原始变量的加权平均值（在减去均值之后）：\n\
  \n(4.1)![编号公式](img/c04_M0003.gif)\n\n其中每对 `Z` 之间的相关性 = 0。然后我们按方差对生成的 `Z` 进行排序，其中\
  \ `Z[1]` 的方差最大，`Z[p]` 的方差最小。软件计算权重 `a[i, j]`，然后这些权重用于计算主成分得分。\n\n与原始数据相比，主成分的进一步优势是它们之间是不相关的（相关系数\
  \ = 0）。如果我们使用这些主成分作为预测变量构建回归模型，将不会遇到多重共线性问题。\n\n回到包含所有 15 个变量的早餐麦片数据集，并对 13 个数值变量应用\
  \ PCA。输出所示表 4.11。注意，前三个成分占了 13 个原始变量总变异性的 96% 以上。这表明可以用少于 25% 的原始维度捕捉数据中的大部分变异。事实上，仅前两个成分就捕捉了总变异性的\
  \ 92.6%。然而，这些结果受变量尺度的影响。\n\n| 关于缺失值的注释 |\n| :--- |\n| ```\npcs <- prcomp(na.omit(cereals.df[,-c(1:3)]))\n\
