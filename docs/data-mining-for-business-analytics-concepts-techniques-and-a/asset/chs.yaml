  \  7  173\n\n               Accuracy : 0.9885\n```\n\n| 表 13.2 个人贷款数据上的 Bagging\
  \ 和 Boosting 分类树示例：输出 | |\n\n### 集方法的优点与缺点\n\n###结合多个模型的得分旨在生成更精确的预测（降低预测误差方差）。当组合模型产生的预测误差之间存在负相关时，集成方法最为有用，但在相关性较低时它也很有用。集成方法可以使用简单平均、加权平均、投票、中位数等。模型可以基于相同的算法，也可以基于不同的算法，使用相同的样本或不同的样本。集成方法已成为数据挖掘竞赛参赛者的主要策略，其目标是优化某些预测指标。从这个意义上说，集成方法还提供了一种通过并行运行多个团队的“数据处理者”并结合其结果，来快速获得高预测能力解决方案的运行方法。\n\
  \n基于不同数据样本的集成方法有助于避免过拟合。然而，请记住，如果你对集成方法进行微调（例如在使用加权平均时选择“最佳”权重），你仍然可能对数据产生过拟合。\n\
  \n集成方法的主要缺点是它对资源的需求：包括计算资源，以及软件可用性、分析师的技能和时间投入。结合不同算法结果的集成方法需要开发每个模型并对其进行评估。Boosting\
  \ 类集成和 Bagging 类集成方法不需要这样的努力，但它们确实有计算成本（尽管 Boosting 可以很容易地并行化）。依赖多个数据源的集成方法需要收集和维护多个数据源。最后，集成方法是“黑箱”方法，因为预测变量与结果变量之间的关系通常变得不透明。\n\
  \n### 13.2 提升（说服）建模\n\n在互联网出现很久以前，直接向个人发送信息（即直邮）就占据了广告市场的很大份额。直接营销为营销人员提供了邀请和监控消费者直接响应的能力。这反过来允许营销人员了解信息传达是否产生了成效。可以在大型列表的一小部分对信息进行测试，如果见效，就可以将信息推广到整个列表。通过预测建模，我们看到推广可以针对列表中最可能响应或以某种方式行为的那部分人员。这在传统媒体广告（电视、广播、报纸、杂志）中是不可能的。\n\
  \n直接响应还使得测试不同信息之间成为可能，并找出哪种更好。\n\n### A-B 测试\n\nA-B 测试是营销行业对标准科学实验的术语，在实验中可以跟踪每个个人的结果。其想法是测试一种处理方法与另一种，或者一种处理方法与对照组。“处理”仅仅是你正在测试的干预措施的术语：在医学试验中，它通常是药物、设备或其他疗法；在营销中，它通常是提供给消费者的优惠——例如，电子邮箱或展示给消费者的网页。杂志上的普通显示广告通常不符合条件，除非它有特定的行动号召（call\
  \ to action），允许营销人员将行动（如购买）追溯到特定的广告，并且能够随机分割杂志分发并为每个群体提供不同的提议。\n\nA-B 测试的一个重要元素是随机分配——处理方法被随机分配或交付给个人。这样，处理方法\
  \ A 和方法 B 之间的任何差异都可以归因于处理方法（除非是随机因素导致的）。\n\n### 提升\n\nA-B 测试告诉你哪种处理方法平均而言更好，但没有说明哪种处理方法对哪个个人更好。一个经典的例子是政治竞选。考虑以下情景：民主党国会候选人\
  \ Smith 的竞选总想知道应该给哪些选民打电话以鼓励他们支持 Smith。倾向于投民主党票但不是活跃分子的选民如果接到电话，可能会更倾向于投票给 Smith。活跃的民主党人可能已经支持他了，因此，给他们打电话将是浪费。给共和党人打电话不仅是浪费，而且可能有害。\n\
  \n竞选现在维护着关于选民的大量数据，以指导针对个人选民的外展决策。在 2008 年奥马竞选之前，做法是根据专家政治判断做出基于规则的决策。2008 年以来，人们越来越多地认识，与其依靠判断或假设来决定是否给某人打电话，不如使用数据开发一个模型，预测选民是否会对外展做出积极响应。\n\
  \n### 收集数据\n\n美国各州维护公开的选民文件，作为选举透明监督流程的一部分。选民文件包含姓名、地址和出生日期等数据。政党在选举期间有“监票员”记录谁投票了，因此他们有关于选民参加哪些选举的额外数据。根据选民地址可以附加人口普查数据。表\
  \ 13.3 显示了特拉华州选民文件的一小部分。本问题使用的实际数据在 `Persuasion-A.csv` 中，包含 10,000 条记录以及表 13.3 所示的多个变量。\n\
  \n| 选民 | 年龄 | 非裔白人比例 | 公共交通 | 单身女性家庭 | 注册天数 | 初选率 | 大选参与率 | 政治贡献 |\n| --- | ---\
