  \ 的数据表节录\n\n\n\n\n\n* `Path`（路径）和`path length`（路径长度）衡量节点之间的距离非常重要。路径是从节点 A 到节点 B\
  \ 所需的路线；路径长度是该路线中边的数量。通常，这些术语指的是最短路径。在权图中，最短路径并不意味着边数最少的路径，而是权重最小的路径。例如，如果权重反映成本因素，那么最短路径反映的就是最小成本。\n\
  \n* `Connected network`连通网络：如果网络中的每个节点都有通往所有其他节点的任意长度路径，则该网络是连通的。一个网络整体可能是不连通的，但由内部相互连通的分段组成。在洗钱可视化（图\
  \ 19.4）中，整个网络是不连通的——节点之间并非相互连接。你可以看到一个大的连通段，以及左下角的较小连通段和一个孤立点。\n\n* `A clique`（团））是指每个节点都通过边与所有其他节点直接连接的网络。这些连接必须全部是单边——通过多节点路径的连接不计入内。\n\
  \n* `A singleton`（孤立点）是一个不连接的节点。它可能出现在个人注册了社交网络服务（例如为了阅读评论）但不参与任何社交活动时。\n\n### 节点级中心性指标\n\
  \n通常，我们可能对特定个人或节点的重要性或影响感兴趣，这反映了该节点在网络中的中心程度。\n\n计算这种最常用的方法是度（degree）——连接到节点的边数。连接越多的节点越处于中心。在图\
  \ 19.1 中，Albert 节点的度为 1，Sam 的度为 2，Jenny 的度为 3。在有向网络中，我们同时关注`indegree`（入度）和`outdegree`（出度）——即节点入连接和出连接的数量。在图\
  \ 19.2 中，Peter 的入度为 2，出度为 1。\n\n节点中心性的另一个指标是`closeness`（紧密性）——该节点距离网络中其他节点的远近。这是通过寻找该节点到所有其他节点的短路径，然后取平均路径长度来衡量的。\n\
  \n另一个指标是`betweenness`（中介性）——给定节点位于节点对之间最短路径的程度。计算从给定节点（假设为节点 A）和网络中其他两个节点（假设为 B\
  \ 和 C）开始，列出 B 和 C 之间的最短路径，并记录包含 A 的路径比例。该比例也对所有其他节点对进行记录，中介性是这些比例的平均值。\n\n适用于社交媒体网络的格言是：“重要的不是你知些什么，而是你认识谁。”更准确的表述可以进一步限定为：“重要的你认识谁，以及他们认识谁。”连接到一个有许多其他连接的成员，可能比连接到一个连接很少的成员更有价值。衡量这种连通性层面的指标是`eigenvector\
  \ centrality`（特征向量中心性），它同时考虑了来自节点的链接数量以及这些链接的后续连接数量。这里不讨论计算的细节，但结果始终介于 0（不中心）和 1（最大中心性）之间。\n\
  \n中心性可以通过节点的大小在网络图上表示——节点越处于中心，尺寸越大。\n\n在 R 中中计算小型有向 LinkedIn 数据中心性指标的代码见表 19.3。\n\
  \n```R\n > degree(g)\n  Dave  Jenny  Peter   John    Sam Albert \n     3      3\
  \      4      3      2      1 \n> betweenness(g)\n  Dave  Jenny  Peter   John  \
  \  Sam Albert \n     0      0      2      0      2      0 \n> closeness(g)\n   \
  \   Dave      Jenny      Peter       John        Sam     Albert \n0.12500000 0.03333333\
  \ 0.09090909 0.04000000 0.04000000 0.03333333 \n> eigen_centrality(g)\n$vector\n\
  \     Dave     Jenny     Peter      John       Sam    Albert \n0.9119867 0.9119867\
  \ 1.0000000 0.9119867 0.3605471 0.1164367 \n```\n\n**表 19.3** 在 R 中计算中心性\n\n###\
  \ 自我中心网络 (Egocentric Network)\n\n分析个人及其连接来获取信息通常是重要的。例如，一家高管招聘公司可能对具有特定职位名称的人员以及这些人所连接的人感兴趣。\n\
  \n自我中心网络是以单个节点为中心的连接网络。1 度自我中心网络包含连接到该个人节点的所有边以及它们的连接。2 度自我中心网络是所有这些节点和边的网络，加上连接到它们的边和节点。LinkedIn\
  \ 图中 Peter 的 1 度和 2 度自我中心网络见图 19.4。\n\n\n\n\n\n**图 19.8**](#c19.xhtml_figureanchor19-8)\
  \ 一个相对密密的网络\n\n```\n> degree.distribution(g) # normalized\n[1] 0.0000000 0.1666667\
  \ 0.1666667 0.5000000 0.1666667\n\n> edge_density(g)\n[1] 0.2666667\n```\n\n**表\
  \ 19.5**](#c19.xhtml_tableanchor19-5) 在 R 中计算中心性\n\n## 19.5 在预测和分类中使用网络指标\n\n网络属性可以与其他预测变量一起用于标准的分类和预测程序中。最常见的应用涉及`匹配`（matching）的概念。例如，在线约会服务会为其成员预测哪些其他成员可能具有潜在匹配性。它们的算法通常涉及计算寻求关系的成员与候选匹配对象之间的距离度量。它还可能超出成员自报告的特征，并整合有关成员与候选匹配对象之间链接的信息。一个链接可能代表“查看候选个人资料”这一动作。\n\
  \n### 链接预测\n\nFacebook 和 LinkedIn 等社交网络使用网络信息来推荐新连接。将这一目标转化为分析问题是：\n\n> “如果给你一个网络，你能预测出下一个形成的链接吗？”\n\
  \n预测算法列出所有可能的节点对，然后为每一对分配一个反映两个节点相似性的评分。得分最高（最接近）的对就是预测下一个形成的链接（如果它尚未存在）。关于此类距离度量的讨论，请参见第\
  \ 15 章。计算相似性量量的某些变量与基于非网络信息的变量相同（例如：教育年限、年龄、性别、位置）。用于链接预测的其他指标专门适用于网络数据：\n\n* 最短路径\n\
  * 共同邻居数量\n* 边权重\n\n链接预测也用于目标监视。“收集一切”在技术、政治或法律上可能是不可行的，因此机构必须预先识别出一小部分需要监视的个人。机构通常从已知目标开始，然后使用链接预测来识别额外目标并优先考虑收集工作。\n\
  \n### 实体解析\n\n政府使用网络分析来跟踪恐怖分子网络，而该工作的关键部分是识别个人。同一个人可能从不同的数据源多次出现，机构想要知道，例如，法国监视部门在突尼的识别出的个人\
  \ `A` 是否与以色列情报部门在黎巴嫩识别出的个人 `AA` 以及美国情报部门在巴基斯坦识别出的个人 `AAA` 是同一个人。\n\n评估一个个人是否出现在多个数据库中的一种方法是测量距离，并以类似于最近邻域或聚类的方式使用它们。在第\
  \ 15 章中，我们特别查看了欧几里得距离，并在讨论该指标时不是基于个人所属的网络，而是基于个人的个人简介（预测变量值）。在基于这些变量进行实体解析时，将领域知识引入其中以衡量每个变量重要性是有用的。例如，个人记录中的两个变量可能是街道地址和邮政编码。街道地址匹配比邮政编码匹配更具确定性，因此我们可能希望在评分算法中给街道地址更大的权重。关于自动权重计算和分配的更详细讨论，请参见\
  \ Golbeck (2013) 的第 137 页。\n\n除了基于个人简介测量距离外，我们还可以引入网络属性。考虑图 19.9 中每个个人的简单网络，显示了与已知个人的连接：基于网络连接，你会得出结论认为`A`\
  \ 和 `AA`可能是同一个人，而 `AAA` 可能是另一个人。可以形式化这种搜索并在人工干预可视化不切实际的情况下以自动方式使用的指标，与链接预测中使用的指标相同。\n\
  \n![图显示了标记为 A, R, T, Q, P, S, N, M, AA, U, AAA, V, X, Z, W 和 J 的边的网络。](img/c19f009.jpg)\n\
  \n**图 19.9**](#c19.xhtml_figureanchor19-9) 嫌疑人 `A`（顶部）、嫌疑人 `AA`（中间）和嫌疑人 `AAA`（底部）的网络\n\
  \n实体解析也广泛用于客户记录管理和搜索。例如，客户可能会联系公司咨询产品或服务，从而触发客户记录的创建。该客户稍后可能会再次咨询或购买物品。客户数据库系统应将第二次交互标记为属于第一个客户。理想情况下，客户会在每次交互中以完全相同的方式输入其信息，从而有助于匹配，但这并非总是发生。如果未能精确匹配，则可能会根据接近程度建议其他客户作为匹配对象。\n\
  \n实体解析的另一个领域是欺诈检测。例如，大型电信公司使用链接解析来检测那些在累积债务后“消失”但随后通过开设新账户重新出现的客户。此类人员拨入和出的电话网络倾向于保持稳定，有助于公司识别他们。\n\
  \n在传统的业务操作中，匹配可能基于名称、地址和邮政编码等变量。在社交媒体产品中，匹配也可以基于网络相似性进行计算。\n\n### 协同过滤\n\n我们在第 14\
  \ 章中看到，协同过滤使用相似性指标来识别相似的个人，从而为特定个人开发推荐。业务中包含社交媒体组件的公司可以使用网络连接信息来增强衡量相似性的其他数据。\n\n\
  例如，在一个以互联网广告为重要业务的公司中，关键问题是向消费者展示哪些广告。考虑以下关于以互联网广告为核心的简单插图：`A` 刚刚登录，并与用户 `B–D` 进行比较。表\
  \ 19.6 显示了每个用户的人口统计和数据。\n\n| **User** | **Months as Cust.** | **Age** | **Spending**\
  \ | **Education** |\n| --- | --- | --- | --- | --- |\n| A | 7 | 23 | 0 | 3 |\n|\
  \ B | 3 | 45 | 0 | 2 |\n| C | 5 | 29 | 100 | 3 |\n| D | 11 | 59 | 0 | 3 |\n\n**表\
  \ 19.6**](#c19.xhtml_table19-6) 用户 A、B、C 和 D 的数据\n\n我们的步骤是根据这些值计算距离，以确定哪个用户距离用户\
  \ A。首先，我们将原始数据归一化，以将所有测量值放在相同的尺度上（对于教育：1=高中，2=大学，3=研究生）。归一化意味着减去平均值并除以标准差。归一化后的数据如表\
  \ 19.7 所示。\n\n| **User** | **Months as Cust.** | **Age** | **Spending** | **Education**\
  \ |\n| --- | --- | --- | --- | --- |\n| A | 0.17 | -1.14 | -0.58 | 0.58 |\n| B |\
  \ -1.18 | 0.43 | -0.58 | -1.73 |\n| C | -0.51 | -0.71 | 1.73 | 0.58 |\n| D | 1.52\
  \ | 1.42 | -0.58 | 0.58 |\n\n**表 19.7**](#c19.xhtml_tableanchor19-7) 用户 A、B、C 和\
  \ D 的归一化测量值\n\n| **Pair** | **Months as Cust.** | **Age** | **Spending** | **Education**\
  \ | **Euclidean Dist.** |\n| --- | --- | --- | --- | --- | --- |\n| A-B | 1.83 |\
  \ 2.44 | 0 | 5.33 | 3.1 |\n| A-C | 0.46 | 0.18 | 5.33 | 0 | 2.44 |\n| A-D | 1.83\
  \ | 6.55 | 0 | 0 | 2.89 |\n\n**表 19.8**](#c19.xhtml_tableanchor19-8) 每对用户之间的欧几里得距离\n\
  \n\n\n\n\n接下来，我们计算 A 与其他每个用户之间的欧几里德距离（参见表 19.8）。基于这些仅考虑人口统计数据和用户数据的计算，用户 C 是距离新用户\
  \ A 最近的。。\n\n现在我们引入网络指标，假设最短路径意义的用户间距离为 A-B = 2、A-C = 4、A-D = 3（参见表 19.9）。\n\n|\
  \ **配对** | **最短路径** |\n| --- | --- |\n| A-B | 2 |\n| A-C | 4 |\n| A-D | 3 |\n\n\
  **表 19.9** 网络指标\n\n最后，我们可以将此网络指标与之前计算的其他用户测量距离相结合。没有必要像处理其他用户测量那样计算和归一化差异，因为最短路径指标本身就已经衡量了记录之间的距离。因此，我们对网络和非网络指标进行加权平均，使用的权重反映了我们希望赋予每个指标的相对重要性。使用等权重（参见表\
  \ 19.10），用户 B 的得分距离 A 最近，并可以作为用户 A 的推荐链接（在社交环境中），或可以作为产品和服务推荐的来源。使用不同的权重，可能会获得不同的结果。选择权重并不是一个科学过程；而是取决于对网络指标与非网络用户测量之间相对重要性的业务判断。\n\
  \n| **配对** | **最短路径** | **权重** | **非网络** | **权重** | **平均值** |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| A-B | 2 | 0.5 | 3.1 | 0.5 | 2.55 |\n| A-C | 4 | 0.5 | 2.44\
  \ | 0.5 | 3.22 |\n| A-D | 3 | 0.5 | 2.89 | 0.5 | 2.95 |\n\n**表 19.10** 结合网络和非网络指标\n\
  \n除了推荐社交媒体连接和提供推荐数据外，网络分析还用于基于网络数据识别相似个体的聚类（例如用于营销目的）、识别影响人物（例如针对促销或外展活动进行目标定位），以及理解——在某些情况下控制——疾病和信息的传播。\n\
  \n## 19.6 使用 R 收集社交网络数据\n\n在本节中，我们简要展示如何从两个最常用的社交网络：Twitter 和 Facebook 收集数据。R 通过两个包提供了这些社交网络的接口：`TwitteR`\
  \ 和 `Rfacebook`。这两个包都需要预先注册为开发者，以获取应用授权代码：\n\n* 在爬取 Twitter 数据之前，创建一个新的 Twitter\
  \ 应用程序，并从 `https://apps.twitter.com/` 获取开发者密钥和密钥代码。有关 R 中 Twitter 接口的更多信息，请参见 `https://cran.r-project.org/web/packages/twitteR/twitteR.pdf`。\n\
  \n* 在爬取 Facebook 数据之前，创建一个新的 Facebook 应用，并从 `https://developers.facebook.com/apps`\
  \ 获取应用 ID 和密钥数字。有关 R 中 Facebook 接口的更多信息，请参见 `https://cran.r-project.org/web/packages/Rfacebook/Rfacebook.pdf`。\n\
  \n表 19.11 和 19.12 为 `TwitteR` 和 `Rfacebook` 包提供了简单的示例。在表 19.11 中，代码收集了包含“text mining”词的\
  \ 25 条最新推文的数据。输出显示了结果前两条推文的内容。在表 19.12 中，代码收集了 Facebook 页面“dataminingbook”以及该页面最新的\
  \ 25 条帖子的信息。部分输出显示了页面详情，以及其中一条帖子的评论、分享和点赞数量。\n\n| |\n```\nTwitter 接口代码\n``` |\n\
  | |\n```\nlibrary(twitteR)\n# 将密钥和密钥数字替换为您从 Twitter 获取的那些\nsetup_twitter_oauth(consumer_key\
  \ = \"XXX\", consumer_secret = \"XXX\")\n\n# 获取最新推文\nrecent.25.tweets <- searchTwitter(\"\
  text mining\", resultType=\"recent\", n = 25)\n\nOutput\n> recent.25.tweets\n[[1]]\n\
  [1] \"Solvonauts: Image from ‘A Text-Book of Coal-Mining … Second edition, etc’,\
  \ \n001758763 : Image from ‘A Tex... https://t.co/8DMuZuSYNY #randomoer\"\n\n[[2]]\n\
  [1] \"https://t.co/8DMuZuSYNY\"\n``` | **表 19.11** Twitter 接口\n\n| |\n```\n Facebook\
  \ 接口代码\n``` |\n| |\n```\nlibrary(Rfacebook)\n# 将密钥和密钥数字替换为您从 Facebook 获取的那些\nfb_oauth\
  \ <- fbOAuth(app_id = \"XXX\", app_secret = \"XXX\")\n\n# 获取页面信息\nfb_page <- getPage(page\
  \ = \"dataminingbook\", token = fb_oauth)\n\n# 获取最新帖子\nfb_posts <- getPosts(page\
  \ = \"dataminingbook\", n = 25, token = fb_oauth)\n\nOutput\n> fb_page\n...\n> fb_posts\n\
  ...\n``` | **表 19.12** R 中的 Facebook 接口\n\n## 19.7 优点与缺点\n\n社交网络数据对企业的关键价值在于它提供了关于个人需求、欲望和喜好的信息。这些信息可以用于改进定向广告——完美的定向广告是广告业务的圣杯。人们通常鄙视或忽略“广撒式”广告，但在面对他们感兴趣的信息时会密切关注。网络数据的力量在于，它允许在不测量或收集数据的情况下捕捉个人需求和喜好。此外，网络数据通常是用户提供的。\n\
  \n\n\n\n\n区分社交网络参与度与社交网络分析的使用至关重要。许多组织拥有社交媒体政策，并将社交媒体作为其传播和广告策略的一部分；然而，这并不意味着他们拥有可以用于分析的详细社交网络数据。互联网营销机构\
  \ Abrams Research 曾在 2009 年引用前卫的在线零售商 Zappos 为社交媒体使用的最佳案例，但 Zappos 的侧重点是参与度——即利用社交媒体进行产品支持和客户服务——而不是分析。\n\
  \n依赖社交网络分析伴随着风险和挑战。一个主要风险是社交媒体使用的动态性、时尚性和某种转瞬即逝的本质。这在一定是因为社交媒体的参与相对较新，而且随着新玩家和新技术的出现，格局正在发生变化。这也源于社交媒体的本质。人们使用社交媒体不是为了提供食物和住所等基本需求，而是作为一种自愿的爱好，以提供娱乐和与人的互动。口味会变化，在这些领域，流行与过时的转换非常迅速。\n\
  \nFacebook 是一个先驱，它最初的吸引力是大学生群体，后来针对年轻人。八年后，近一半的用户年龄在 45 岁或以上，远高于社交媒体行业的其他部分。这些用户每次访问花费的时间更长，且比大学生更富有，因此\
  \ Facebook 可能正从这一人口统计趋势中受益。然而，这种快速转变表明了其业务模式的核心要素变化得有多快。\n\n其他挑战在于涉及数据的公共性和个人性质。尽管个人几乎总是自愿参与社交媒体的，但这并不意味着他们这样做是负责任的，或者是在不知道潜在后果的情况下进行的。在\
  \ Facebook 上发布的信息已在 33% 的美国离婚案件中成为证据，并且有许多案例被提到个人因为在 Facebook 上发布的信息而被解雇。\n\n一位富有进取的程序员创建了网站\
  \ `pleaserobme.com`（现已删除），该网站列出了通过 FourSquare 在咖啡馆或餐厅进行“签到”的人的实时位置，从而让世界知道他们不在家里。FourSquare\
  \ 并没有让黑客轻松获取这些信息，但签到会自动发布到 Twitter，在那里这些信息可以通过 API（应用程序编程接口）进行采集。因此，为了增强对用户广告“可针对性”而收集的信息，最终为\
  \ FourSquare 和 Twitter 都造成了法律责任。Twitter 的责任是间接产生的，在建立与 FourSquare 的连接时，Twitter 很容易忽视这种风险。\n\
  \n总结，尽管存在滥用的可能性和风险暴露，但社交网络分析提供的价值似乎足够大，足以确保本章概述的分析方法继续受到需求。\n\n## Problems\n\n1.\
  \ **描述网络。** 考虑一个由个人 A、B、C、D 和 E 组成的无向网络。A 与 B 和 C 连接。B 与 A 和 C 连接。C 与 A、B 和 D 连接。D\
  \ 与 C 和 E 连接。E 与 D 连接。\n\n    1. 为该网络生成一个网络图。\n    2  需要从图中移除哪些节点才能使剩余节点构成一个团子图（clique）？\n\
  \    3. 节点 A 的度是多少？\n    4. 哪些节点的度最低？\n    5. 以表格形式列该网络的度分布。\n    6. 该网络是连通的吗？\n\
  \    7. 计算节点 A 和 C 的中性中心性。\n    8. 计算网络的密度。\n\n2. **网络密度和规模。** 想象在上一个练习的无向网络中添加了两个新节点。\n\
  \n    1. 节点数量增加了百分之几？\n    2. 可能的边数量增加了百分之几？\n    3. 假设新节点具有典型的（中位数）连接数。网络密度会发生什么变化？\n\
  \    4. 对比较不同规模网络中的密度进行评论。\n    5. 以表格形式列该网络的度分布。\n\n3. **链接预测。** 考虑图 19.10 所示的网络。\n\
  \n    1. 使用共同邻居数评分预测下一个形成的链接（即建议哪个新链接的成功机会最高）。\n    2. 使用最短路径评分识别最不可能形成的链接。\n\n\
  \    ![图显示了链接预测网络，边标记为 F, B, A, C, D, E 和 G。](img/c19f010.jpg)\n\n    图 19.10 链接预测练习网络\n\
  \n4. **创业市场探索。** 社交媒体为手工艺和贸易注入了活力。许多人接受了酿啤酒、做面包和陶艺等爱好。社交媒体既为离散社区的在线形成提供了机制，又为指令和建议的快速传播提供了媒介。它还为新思想、产品和服务病毒式传播提供了平台。这为创业者和现有公司向手工艺社区提供设备和用品提供了机会，并使其成为中小型生产者。在社交媒体出现之前，高昂的广告和营销成本将大多数手工艺人限制在业余爱好者的行列。现在，社交媒体作为营销工具的可用性使得商业化和扩张对数十万潜在创业者及其财务资助者触手可及。由于社交媒体已成为手工艺社区许多人的首选通信工具，对于那些营销预算不受类似限制的既有供应公司来说，它是一个重要的渠道。\n\
  \n\n\n\n\n在本章中，我们将文本引入为数据形式。首先，我们讨论了文本数据的表格化表示法，其中每一列是一个单词，每行是一份文档，每个单元格为 0 或 1，表示该列的单词是否出现在该行的文档中。然后，我们考虑如何从非结构化文档转换为这种结构化矩阵。最后，我们将说明如何将此过程整合到书的前几个部分涵盖的标准数据挖掘程序中。\n\
  \n## 20.1 引言\n\n到为止，以及在广泛的数据挖掘中，我们处理的是三种类型的数据：\n\n* 数值型\n* 二分类型（是/否）\n* 多分类\n\n\
  然而，在一些常见的预测分析应用中，数据是以文本形式存在的。例如，互联网服务提供商可能希望使用算法将支持工单分类为紧急或常规，以便让紧急工单获得立即的人工审核。面临海量取证过程（审查大量文档）的律师事务所将受益于一种能够将文档分类为相关或不相关的文档审查算法。在这两种情况下，预测变量（特征）都是以文本的形式嵌入在文档中的。\n\
  \n文本挖掘方法受益于社交媒体数据的可用性——例如 Twitter 动态，以及博客、在线论坛、评论网站和新闻文章。根据 Rexer Analytics 2013\
  \ 年数据挖掘调查，响应调查的数据挖掘者中，有 25% 到 40% 使用来自这些来源的文本进行数据挖掘。这些数据的公开性和高关注度提供了一个巨大的数据库，研究人员可以在此基础上完善文本挖掘方法。一个增长领域是将文本挖掘方法应用于联系中心和售后中心的笔记及转录稿。\n\
  \n## 20.2 文本的表格化表示：词项-文档矩阵与“词袋”\n\n考虑以下三个句子：\n\nS1. this is the first sentence.\n\
  S2. this is a second sentence.\nS3. the third sentence is here.\n\n我们可以将这三个句子（称为\
  \ `documents`）中的单词（称为 `terms`）表示在词项文档矩阵（`term-document matrix`）中，其中每行是一个单词，每列是一个句子。在\
  \ R 语言中，将一组文档转换为词项文档矩阵可以通过首先将文档收集到一个语料库（使用函数 `corpus`），然后使用 `tm` 包中的 `tdm()` 函数来实现。[表\
  \ 20.1] 展示了这三个句子的处理过程。\n\n```\n# code for term frequency\nlibrary(tm)\n\n# 定义句子向量\
  \ (\"docs\")\ntext <- c(\"this is the first sentence\", \n          \"this is a\
  \ second sentence\", \n          \"the third sentence is here\")\n\n# 将句子转换为语料库\n\
  corp <- Corpus(VectorSource(text))\n\n# 计算词频\ntdm <- TermDocumentMatrix(corp)\n\
  inspect(tdm)\n\nOutput\n> inspect(tdm)\n<<TermDocumentMatrix (terms: 7, documents:\
  \ 3)>>\nNon-/sparse entries: 12/9\n\nSparsity           : 43%\nMaximal term length:\
  \ 8\nWeighting          : term frequency (tf)\n\n            Docs\nTerms       \
  \ 1 2 3\n  first      1 0 0\n  here       0 0 1\n  second     0 1 0\n  sentence\
  \   1 1 1\n  the        1 1 1\n  third      0 0 1\n  this       1 1 0\n```\n\n**表\
  \ 20.1** 句子 S1–S3 中单词的词项文档矩阵表示\n\n注意，三个句子中的所有单词（除了“is”，它被 R 的 `TermDocumentMatrix`\
  \ 函数移除了）都表示在矩阵中，每个单词恰恰有一行。顺序并不重要，单元格中的数字表示该词项在句子中出现的频率。这就是“词袋”（`bag-of-words`）方法，其中文档被简单地视为单词的集合，顺序、语法和句法并不重要。\n\
  \n这三个句子现在已经转换成了表格数据格式，就像我们在此之前看到的格式一样。在一个简单的世界里，这种二值矩阵可以用于聚类，或者在添加结果变量后用于分类或预测。然而，文本挖掘的世界并不简单。即使将分析限制在词袋方法上，也可能需要大量的思考和预处理。除了为了训练目的对文档进行简单分类外，对文档进行一些人工审核可能是必不可少的。\n\
  \n## 20.3 词袋 vs. 文档级含义提取\n\n我们可以将文本挖掘中的任务分为两类：\n\n* 将文档标记为属于某类，或对相似文档进行聚类\n* 从文档中提取更详细的含义\n\
  \n第一个目标需要大量的文档集合，即语料库（`corpus`），具备从文档中提取预测变量的能力，并且对于分类任务，需要大量预标记的文档来训练模型。然而，所使用的模型是我们在处理数值和分类数据时已经过的标准统计和机器学习预测模型。\n\
  \n第二个目标可能涉及单个文档，而且野心勃勃。计算机必须学会至少某种版本的构成人类语言的复杂“算法”：语法、句法、标点符号等。换句话说，它必须对自然语言（即非计算机语言）进行处理以*理解*文档。单单理解一份文档的含义，比根据从成百上千份相似文档得出的规则为文档概率分配类别要困难得多。\n\
  \n其其一，文本理解需要对词序进行维护和考虑。“San Francisco beat Boston in last night’s baseball game”（旧金山昨晚的棒球赛中击败了波士顿）与“Boston\
  \ beat San Francisco in last night’s baseball game”（波士顿昨晚的棒球赛中击败了旧金山）完全不同。\n\n即使顺序相同的单词也具有不同的含义，取决于文化和社会背景：“Hitchcock\
  \ shot The Birds in Bodega Bay”（希区柯克在博德加湾拍摄了《鸟》），对于一个对大小写不敏感且不熟悉阿尔弗德·希区柯克电影的人来说，可能是在关于猎鸟的。歧义消除是文本理解中的一大挑战——“bot”是指“购买”（bought），还是指机器人？\n\
  \n我们的重点将保持本书的整体重点以及更容易的目标——为文档概率分配类别，或对相似文档进行聚类。第二个目标——从单个文档中推导出理解，是自然语言处理（NLP）领域的主题。\n\
  \n\n\n\n\n```\nlibrary(tm)\ntext <- c(\"this is the first     sentence!!\", \n \
  \         \"this is a second Sentence :)\", \n          \"the third sentence, is\
  \ here\", \n          \"forth of all sentences\")\ncorp <- Corpus(VectorSource(text))\n\
  tdm <- TermDocumentMatrix(corp)\ninspect(tdm)\n\n inspect(tdm)\n<<TermDocumentMatrix\
  \ (terms: 12, documents: 4)>>\nNon-/sparse entries: 14/34\nSparsity           :\
  \ 71%\nMaximal term length: 10\nWeighting          : term frequency (tf)\n\n   \
  \         Docs\nTerms        1 2 3 4\n  all        0 0 0 1\n  first      1 0 0 0\n\
  \  forth      0 0 0 1\n  here       0 0 1 0\n  second     0 1 0 0\n  sentence  \
  \ 0 1 0 0\n  sentence!! 1 0 0 0\n  sentence,  0 0 1 0\n  sentences  0 0 0 1\n  the\
  \        1 0 1 0\n  third      0 0 1 0\n  this       1 1 0 0\n```\n\n|\n\n 表 20.2\
  \ 句子 S1–S4 中单词的词-文档矩阵表示（示例 2）\n\n这组句子包含额外的空格、非字母字符、错误的大小写以及“fourth”一词的拼写错误。\n\n\
  ### 分词 (Tokenization)\n\n我们的第一个简单数据集完全由字典中找到单词组成。真实的文档集将具有更多多样性——它将包含数字、字母数字字符串（如日期戳或零件号）、网页地址和电子邮件地址、缩写、俚语、专有名词、拼写错误等。\n\
  \n`Tokenization` 是以自动化方式将文本划分为单独“标记”（tokens）或术语（terms）的过程。标记（术语）是分析的基本单位。空格分隔的单词是一个标记。`2+3`\
  \ 需要被分成三个标记，而 `23` 将保持为一个标记。标点符号也可以作为一个独立的标记（例如 @ 符号）。这些标记成为了数据矩阵中的行标题。每个文本挖掘软件程序都会有自己的分隔符列表（空格、逗号、冒号等），用于此将文本划分为标记。在表\
  \ 20.3 中，我们使用 R 的 `tm_map()` 来从表 20.2 所示的四个句子中移除空格和标点符号。\n\n|\n\n```\ncode for tokenization\n\
  ```\n\n|\n\n```\n# tokenization\ncorp <- tm_map(corp, stripWhitespace) \ncorp <-\
  \ tm_map(corp, removePunctuation) \ntdm <- TermDocumentMatrix(corp)\ninspect(tdm)\n\
  \nOutput\n> inspect(tdm)\n<<TermDocumentMatrix (terms: 10, documents: 4)>>\nNon-/sparse\
  \ entries: 14/26\nSparsity           : 65%\nMaximal term length: 9\nWeighting  \
  \        : term frequency (tf)\n\n           Docs\nTerms       1 2 3 4\n  all  \
  \     0 0 0 1\n  first     1 0 0 0\n  forth     0 0 0 1\n  here      0 0 1 0\n \
  \ second    0 1 0 0\n  sentence  1 1 1 0\n  sentences 0 0 0 1\n  the       1 0 1\
  \ 0\n  third     0 0 1 0\n  this      1 1 0 0\n```\n\n|\n\n表 20.3 S1–S4 分词示例\n\n\
  对于大规模语料库，分词将产生海量的变量——英语有超过百万个单词，更不用说典型文档中会遇到的非单词术语了。在预处理阶段任何可以减少术语数量的操作都将有助于分析。初始重点是消除那些仅增加体积和噪声的术语。\n\
  \n语料库的初始解析产生的某些术语在进一步分析中可能没有用，并可以在预处理阶段将其消除。例如，在法律取证案件中，一组文档语库可能是电子邮件，所有邮件都包含公司信息和作为签名部分的某些模板内容。这些术语可以添加到`stopword\
  \ list`（停用词列表），在预处理阶段自动消除。\n\n### 文本还原 (Text Reduction)\n\n大多数文本处理软件（包括 R 中的 `tm`\
  \ 包）都带有一个通用的、用于移除的高频术语`stopword`列表。如果你在预处理阶段查看 R 的停用词列表，你会发现它包含大量需要移除的术语（表 20.4\
  \ 显示了前 174 个停用词）。你可以从通用列表中添加额外的术语或移除现有的术语。\n\n|\n\n```\n> stopwords(\"english\"\
  )\n  [1] \"i\"          \"me\"         \"my\"         \"myself\"     \"we\"    \
  \     \"our\"       \n  [7] \"ours\"       \"ourselves\"  \"you\"        \"your\"\
  \       \n```\n\n\n\n```r\n# 停用词\nlibrary(SnowballC)\ncorp <- tm_map(corp, removeWords,\
  \ stopwords(\"english\"))\n\n# 词干\ncorp <- tm_map(corp, stemDocument) \n\ntdm <-\
  \ TermDocumentMatrix(corp)\ninspect(tdm)\n```\n\nOutput\n\n```\n> inspect(tdm)\n\
  <<TermDocumentMatrix (terms: 5, documents: 4)>>\nNon-/sparse entries: 8/12\nSparsity\
  \           : 60%\nMaximal term length: 7\nWeighting          : term frequency (tf)\n\
  \n         Docs\nTerms     1 2 3 4\n  first   1 0 0 0\n  forth   0 0 0 1\n  second\
  \  0 1 0 0\n  sentenc 1 1 1 1\n  third   0 0 1 0\n```\n\n| 表 20.5 S1–S4 的文本缩减（分词后）\
  \ |\n\n### 存在/缺失 vs. 频率\n\n词袋模型（bag-of-words）可以根据术语的`频率`或也可以根据术语的`存在/缺失`来实现。在某些情况下，后者可能更为合适——例如，在法务分类模型中，特定供应商名称的出现或缺失可能是一个关键的预测变量，而不考虑它在给定文档中出现的频率。然而，在其他情况下，`频率`可能同样重要。例如，在处理支持工单时，单次提到“IP\
  \ 地址”可能没有意义——因为所有支持工单可能都包含用户的 IP 地址作为提交的一部分。然而，该短语的多次重复可能会提供有用信息，即 IP 地址是问题的一部分（例如\
  \ DNS 解析）。*注意*：R 语言中的 `tm` 包仅实现了频率选项。要实现存在/缺失选项，你需要将频率数据转换为二值矩阵（即将所有非零计数转换为 1）。\n\
  \n### 词频-逆文档文档频率 (TF-IDF)\n\n还有其他一些流行的选项，它们同时考虑了术语在文档中的频率以及包含该术语的文档频率。其中一种用于衡量术语对文档重要性的流行选项是`词频-逆文档文档频率`\
  \ (TF-IDF)。对于给定的文档 `d` 和术语 `t`，词频是术语 `t` 在文档 `d` 中出现的次数：\n\n`TF(d, t)` = 术语 `t`\
  \ 在文档 `d` 中出现的次数。\n\n为了考虑到在感兴趣领域中频繁出现的术语，我们计算术语 `t` 的`逆文档文档频率`，该值在整个语料库上计算，并定义为^(3)\n\
  \n![numbered Display Equation](img/c20_M0001.gif)\n\n特定术语-文档对的 `TF-IDF(t, d)` 是词频\
  \ `TF(t, d)` 和逆文档文档频率 `IDF(t, d)` 的乘积：\n\n(20.1)![numbered Display Equation](img/c20_M0002.gif)\n\
  \nTF-IDF 矩阵包含每个术语-文档组合的值。尽管上述 TF-IDF 的定义是常用的，但定义和加权 TF 及 IDF 的方法有多种，因此 TF-IDF 的定义多种多样。例如，表\
  \ 20.6 显示了四个句子示例（分词和文本缩减后）的 TF-IDF 矩阵。`weightTfIdf()` 函数使用以 2 为底对数计算 IDF，并通过除以文档\
  \ `d` 中的术语总数来归一化分子。例如，文档 1 中术语“first”的 TF-IDF 值计算方法如下：\n\n![numbered Display Equation](img/c20_M0003.gif)\n\
  \n```\n> tfidf <- weightTfIdf(tdm)\n> inspect(tfidf)\n<<TermDocumentMatrix (terms:\
  \ 5, documents: 4)<<\nNon-/sparse entries: 4/16\nSparsity           : 80%\nMaximal\
  \ term length: 7\nWeighting          : term frequency - inverse document frequency\
  \ (normalized) (tf-idf)\n\n         Docs\nTerms     1 2 3 4\n  first   1 0 0 0\n\
  \  forth   0 0 0 1\n  second  0 1 0 0\n  sentenc 0 0 0 0\n  third   0 0 1 0\n```\n\
  \n| 表 20.6 S1–S4 示例的 TF-IDF 矩阵（分词和文本缩减后） |\n\nTF-IDF 的核心思想是识别频繁出现稀有术语的文档。对于总体稀疏的术语频率较高的文档，TF-IDF\
  \ 会产生高值；而对于文档中缺失或出现在大多数文档中的术语，则产生接近于零的值。\n\n### 从术语到概念：隐含语义索引\n\n在第 4 章中，我们展示了如何将许多数值变量减少为少数几个“主成分”，这些成分可以解释变量集中大部分的变异。主成分是原始（通常是相关的）变量的线性组合，其中一部分子集作为新变量来取代许多原始变量。\n\
  \n一种类似的降维方法——`隐含语义索引`（或`隐含语义分析`，`LSA`）可以应用于文本。该算法的数学原理超出了本章的范围^(4)，但一个直观的解释可以参考此处^(5)：\n\
  \n> 例如，如果我们检查我们的集合，可能会发现每当“分配器”出现在文档中时，文档也包含了“电池”和“大灯”。或者每当“刹车”出现在文档中时，“闸片”也出现了。\n\
  \n### 提取含义\n\n在简单的隐含语义索引示例中，术语所映射的概念（刹车故障、分配器故障）是清晰易于理解的。在许多情况下，事实并非如此——术语所映射的概念并不显而易见。在这种情况下，隐含语义索引可以极大提高用于构建模型的文本的管理性，并通过减少噪声提高预测能力，但它会将模型变成一个预测黑盒设备，而不是为了理解术语和概念的角色。这对于我们的目的是可以的——如之前所述，我们关注的是文本挖掘进行分类或聚类，而不是提取含义。\n\
  \n## 20.5 实现数据挖掘方法\n\n文本经过预处理阶段后，将变为数值矩阵格式，你可以应用书中之前讨论过的各种数据挖掘方法。聚类方法可用于识别文档簇——例如，对大量的医疗报告进行挖掘以识别症状簇。预测方法可用于技术支持工单，以预测解决问题所需的时间。文本挖掘最流行的应用可能是文档分类——也称为`标记`。\n\
  \n## 20.6 示例：关于汽车和电子产品的在线讨论\n\n这个示例^(66)展示了一个分类任务——将网络帖子分类为汽车相关或电子相关。其中一个帖子如下：\n\
  \n> 来自：smith@logos.asd.sgi.com (Tom Smith)主题：Ford Explorer 4WD - 我需要性能差速器吗？\n\n\
  >\n> 我们正在考虑购买带有 4WD 的 Ford Explorer XLT，有以下几个问题（我们只是去滑滑雪 - 不越野）：\n\n> \n> 1\\. 如果有了\
  \ 4WD，我们还需要“性能差速器”吗——（限差差桥）。它的目的是允许轮胎在不同地形上独立作用。\n\n\n\n\n\n> 2. 我们需要全地形轮胎 (`P235/75X15`)，还是说全季轮胎\
  \ (`P225/70X15`) 对我们在太湖就足够了？\n>\n> 谢谢，\n>\n> Tom\n>\n> –\n>\n> ================================================\n\
  > Tom Smith Silicon Graphics smith@asd.sgi.com 2011 N. Shoreline Rd. MS 8U-815 415-962-0494\
  \ (fax) Mountain View, CA 94043\n> ================================================\n\
  \n这些帖子来源于专注于汽车和电子产品的群组，因此已经过预标记。显然，这一个与汽车有关。一个相关的组织场景可能涉及医疗办公室收到的消息，这些消息必须归类为医疗或非医疗（在这样的真实场景中，这些消息可能需要由人类作为预处理的一部分进行标记）。\n\
  \n这些帖子以压缩压缩包的形式存在，其中包含两个文件夹：`auto posts` 和 `electronics posts`，每个文件夹包含一组以小文件组织的\
  \ 1000 条帖子。在下文中，我们将描述从预处理到基于数据构建分类模型的主要步骤。表 20.7 提供了该示例中文本处理步骤的 `R` 代码。接下来的我们将分别描述每个步骤。\n\
  \n| |\n```\n导入和标记记录、预处理文本以及生成概念矩阵的代码\n``` |\n| |\n```R\nlibrary(tm)\n# step 1: 导入并标记记录\n\
  # 读取 zip 文件到语料库\ncorp <- Corpus(ZipSource(\"AutoElectronics.zip\", recursive = T))\n\
  \n# 创建记录标签数组\nlabel <- c(rep(1, 1000), rep(0, 1000))\n\n# step 2: 文本预处理\n# 分词\n\
  corp <- tm_map(corp, stripWhitespace) \ncorp <- tm_map(corp, removePunctuation)\
  \ \ncorp <- tm_map(corp, removeNumbers) \n\n# 停用词\ncorp <- tm_map(corp, removeWords,\
  \ stopwords(\"english\"))\n\n# 词干提取\ncorp <- tm_map(corp, stemDocument) \n\n# step\
  \ 3: TF-IDF 和潜在语义分析\n# 计算 TF-IDF\ntdm <- TermDocumentMatrix(corp)\ntfidf <- weightTfIdf(tdm)\n\
  \n# 提取 (20) 个概念 \nlibrary(lsa)\nlsa.tfidf <- lsa(tfidf, dim = 20)\n\n# 转换为数据框\n\
  words.df <- as.data.frame(as.matrix(lsa.tfidf$dk)) \n``` |\n\n**表 20.7** 导入和标记记录、预处理文本以及生成概念矩阵\n\
  \n### 导入和标记记录\n\n`R` 中的 `tm` 软件包包含了用于不同文档格式的多个加载函数。在我们的示例中，我们使用 `ZipSource()` 函数读取压缩文件。其他选项包括读取整个目录、读取\
  \ `PDF` 或 `XML` 文件等。我们还创建了一个与文档顺序相对应的标签数组——我们将用“1”代表汽车，用“0”代表电子产品。前 1000 份文档应归类为“1”，剩余\
  \ 1000 份文档归类为“0”（见表 20.7 中的步骤 1）。\n\n### R 中的文本预处理\n\n第一个预处理步骤是`分词`（tokenization），包括删除空格、标点符号和数字。下一步是删除`停用词`（stop\
  \ words）。最后一个预处理步骤是`词干提取`（stemming），即将一个单词的多种形式合并为一个单一的核心。例如，“road”和“Rd.”可能会被提取为“road.”这两个操作显示在表\
  \ 20.7 的步骤 2 中。\n\n### 生成概念矩阵\n\n预处理步骤将产生一个“干净”的语料库和词文档矩阵，可用于计算前面描述的 `TF-IDF` 词文档矩阵。`TF-IDF`\
  \ 矩阵结合了术语的频率以及包含该术语的文档在整个语料中中频率。\n\n生成的矩阵可能太大，无法在预测模型中高效分析（具体来说示例中的预测变量数量为 21,789，因此我们使用潜在语义索引来提取一个降维空间，称为“概念”）。为了可管理性，我们将概念的数量限制在\
  \ 20 个。表 20.7 显示了将这两种操作——创建 `TF-IDF` 矩阵和潜在语义索引——应用于该示例的 `R` 代码。\n\n最后，我们可以使用这个精简的概念集来辅助构建预测模型。我们不会尝试解释概念的含义。\n\
  \n### 拟合预测模型\n\n此时，我们已经将原始文本数据转换为预测建模所需的熟悉形式——单个目标变量（1 = 汽车，0 = 电子产品）和 20 个预测变量（概念）。\n\
  \n现在我们可以划分数据划分（60% 训练，40% 验证），并尝试应用几种分类模型。表 20.8 显示了逻辑回归的性能，以“class”为结果变量，以 20 个概念变量为预测变量。\n\
  \n| |\n```R\n拟合和评估逻辑模型的代码\n``` |\n| |\n```R\n# 采样 60% 训练数据\ntraining <- sample(1:2000),\
  \ 0.6*2000)\n\n# 在训练集上运行逻辑模型\ntrainData = cbind(label[training], words.df[training])\n\
  reg <- glm(label ~ ., data = trainData, family = 'binomial')\n\n# 在验证集上计算准确率\nvalidData\
  \ = cbind(label[-training], words.df[-training])\npred <- predict(reg, newdata =\
  \ validData, type = \"response\")\n\n# 生成混淆矩阵\nlibrary(caret)\nconfusionMatrix(ifelse(pred>0.5,\
  \ 1, 0), label[-training])\n```\n```\n> confusionMatrix(ifelse(pred>0.5, 1, 0),\
  \ label[-training])\nConfusion Matrix and Statistics\n\n          Reference\nPrediction\
  \   0   1\n         0 385  16\n         1   9 390\n\n               Accuracy : 0.9688\
  \ \n```\n\n[表 20.8] 汽车和电子数据拟合预测模型\n\n混淆矩阵（表 20.8）显示了区分两个类别的准确率相当之高——准确率为 96.88%。分位提升图（图\
  \ 20.1）证实了类别的高可分性，以及该模型对于排序目标的用处。对于一个类别分布接近 50/50 的二分类数据集，每个分位的最大提升为 2，而这里显示的提升在前\
  \ 40% 的案例中略小于 2，在后 40% 的案例中接近 0。在决策过程中，人工审查可以集中在可能发生分类错误的中间 20% 部分。\n\n![图显示了从 10\
  \ 到 100 的百分比与从 0.0 到 2.0 的平均响应。](img/c20f001.jpg)\n\n**图 20.1** 汽车-电子文档分类的分位提升图\n\
  \n### 预测\n\n文本挖掘最常见的应用是分类（标记），但它也可以用于数值的预测。例如，维护或支持工单可以用于预测维修的长度或成本。上述过程中唯一不同的步骤是预处理后应用的的标签，该标签将是一个数值而非类别。\n\
  \n## 20.7 总结\n\n\n\n\n在本章中，我们区分了为了从单个文档提取含义的文本处理（自然语言处理——NLP）与以概率方式对大量文档进行分类或标记（文本挖掘）。我们重点关注后者，并研究了在文本进行挖掘之前需要进行的预处理步骤。这些步骤比准备数值数据时涉及的步骤更丰富、更复杂。最终目标是生成一个矩阵，其中行代表术语，列代表文档。由于语言的特性，术语的数量对于有效的模型构建来说过于巨大，因此预处理步骤包含了词汇削减。如果我们使用一组有限的概念来代表文档中的大多数变异，而不是术语，就会发生最后一次主要的削减，这就像主成分捕捉数值数据中的大多数变异一样。最后，我们得到了一个定量矩阵，其中单元格代表术语的频率或出现情况，列代表文档。在此基础上添加文档标签（类别），就可以使用该矩阵对文档进行分类了。\n\
