  \n### 4.4 数据摘要\n\n正如我们在数据可视化章节中所看到的，数据探索的一个重要初始步骤是通过摘要熟悉数据及其特征。这一步的重要性不言而喻。你对数据越了解，建模或挖掘过程的结果就越好。\n\
  \n### 统计摘要\n\nR 具有许多函数和功能可以辅助数据汇总。`summary()` 函数提供了整个变量集的概览。`mean()`、`sd()`、`min()`、`max()`、`median()`\
  \ 和 `length()` 对于学习每个变量的特征非常有帮助。首先，它们让我们了解关于变量取值范围和类型的信息。`min()` 和 `max()` 函数可以检测可能异常的极值。`mean()`\
  \ 和 `median()` 提供了变量中心值感，两者之间巨大的差异也表明偏态。标准差反映了数据的离散程度（相对于均值）。进一步的选项例如 `sum(is.na(variable))`\
  \ 可以返回空值的数量，告诉我们缺失值的情况。\n\n表 4.3](#c04.xhtml_table4-3) 显示了波士顿案例的统计摘要（以及 R 代码）。\n\
  \n```\n code for summary statistics\n```\n\n\n\n\n```\nboston.housing.df <- read.csv(\"\
  BostonHousing.csv\", header = True) \nhead(boston.housing.df, 9)\nsummary(boston.housing.df)\
  \ \n\n# 计算 CRIM 的均值、标准差、最小值、最大值、中位数、长度和缺失值\nmean(boston.housing.df$CRIM) \nsd(boston.housing.df$CRIM)\n\
  min(boston.housing.df$CRIM)\nmax(boston.housing.df$CRIM)\nmedian(boston.housing.df$CRIM)\
  \ \nlength(boston.housing.df$CRIM) \n\n# 查找变量 CRIM 的缺失值个数\nsum(is.na(boston.housing.df$CRIM))\
  \ \n\n# 计算所有变量的均值、标准差、最小值、最大值、中位数、长度和缺失值\ndata.frame(mean=sapply(boston.housing.df,\
  \ mean), +\n+            sd=sapply(boston.housing.df, sd), +\n+            min=sapply(boston.housing.df,\
  \ min), +\n+            max=sapply(boston.housing.df, max), +\n+            median=sapply(boston.housing.df,\
  \ median), +\n+            length=sapply(boston.housing.df, length) +\n+       \
  \     miss.val=sapply(boston.housing.df, function(x) \n+            sum(length(which(is.na(x)))))))\
