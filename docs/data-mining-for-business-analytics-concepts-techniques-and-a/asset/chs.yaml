  \ 0.003022113\ncups      0.000510111 0.001591013 -0.000694321 0.000985380 0.002148458\n\
  rating   -0.075296292 -0.071742153 0.307947121 0.334533899 0.757708025\n``` |\n\n\
  ### 归一化数据\n\nPCA 的进一步用途是理解数据结构。这是通过检查权重来观察原始变量如何贡献于不同的主成分的。在我们的示例中，显然第一个主成分被麦片的钠含量所主导：它具有最高的（在这种情况下是正的）权重。这意味着第一个主成分实际上是在衡量麦片中钠含量。类似于，第二个主成分似乎是在测量钾的量。由于这两个变量都是以毫克为单位的，而其他营养素是以克为单位的，尺度显然导致了这种结果。钾和钠的方差大于其他变量的方差，因此总方差被这两个方差所支配。解决方案是在执行\
  \ PCA 之前对数据进行归一化。归一化（标准化）是将每个原始变量替换为具有单位方差的标准化变量。这可以通过将每个变量除以其标准差来轻松实现。这种归一化的效果是使所有变量在变异性方面具有相同的重要性。\n\
  \n\n\n\n\n我们何时应该对数据进行归一化？这取决于数据的性质。当变量的测量单位是通用的（例如 `dollars`），且它们的尺度反映了其重要性（如喷气燃料的销售额、加热油的销售额），可能最好不要进行归一化（即不重放数据使其具有单位方差）。如果变量的测量单位不同，以至于不如何比较不同变量的变异性（例如，某些使用\
  \ `dollars`，另一些使用 `parts per million`），或者对于使用相同单位的变量，尺度并不能反映重要性（如每股收益、总收入），通常建议进行归一化。这样一来，测量单位的差异就不会影响主成分的权重。在少数可以给变量赋予相对权重的情况下，我们在进行主成分分析之前，会将归一化后的变量乘以这些权重。\n\
  \n到为止，我们一直使用协方差矩阵计算主成分。先归一化再执行 PCA 的替代方案是对相关矩阵而非协方差矩阵执行 PCA。大多数软件程序都允许用户在两者之间进行选择。记住，使用相关矩阵意味着你正在对归一化后的数据进行操作。\n\
  \n回到早餐谷物数据，由于变量尺度不同，我们对 13 个变量进行了归一化，然后执行 PCA（等等于使用应用于相关矩阵的 PCA）。输出见表 4.12。\n\n\
