  ## 3. 消费者对早餐谷片的评分\n\n`Cereals.csv` 数据集包含了 77 种早餐谷片的营养信息、商店陈列和消费者评分。\n\n### 数据预处理\n\
  删除所有具有缺失值的谷物。\n\n1. 使用对归一化后测量值的欧式距离对数据应用层次聚类。比较单链法（single linkage）和完全链法（complete\
  \ linkage）的聚类图，并观察聚类中心。对类的结构及其稳定性进行评论。*提示*：若要获取层次聚类的聚类中心，请使用 `aggregate()` 函数计算每个类成员的平均值。\n\
  2. 哪种方法产生的聚类最具洞察力或最有意义？\n3. 选择其中一种方法。你会使用多少个类？此截断使用了什么距离？（查看聚类图。）\n4. 基础公小学想选择一组谷物包含在他们的每日食堂中。每天提供不同的谷物，但所有谷物都应该支持健康饮食。为了这一目标，要求你找到一个“健康谷物”类。数据是否应该进行归一化？如果不应该，它们应该如何在聚类分析中使用？\n\
  \n## 4. 针对常旅客飞行客的营销\n\n`EastWestAirlinesCluster.csv` 文件包含了 3999 名属于航空公司常旅客计划乘客的信息。对于每位乘客，数据包括他们的里程行程历史以及过去一年累积或消耗里程的各种方式。目标是尝试识别出具有相似特征的乘客类，以便针对不同类型的里程优惠针对不同的细分群体。\n\
  \n1. 使用欧式距离和 Ward 方法应用层次聚类。确保先对数据进行归一化。出现了几类？\n2. 如果数据不进行归一化会发生什么？\n3. 比较聚类中心以表征不同的类，并尝试给每个类贴上标签。\n\
  4. 为了检查类的稳定性，随机删除 5% 的数据（通过对 95% 的记录进行随机采样），并重复分析。是否出现了相同的图？\n5. 使用你上面发现的类数量进行 `k`-means\
  \ 聚类。是否出现了相同的图？\n6. 你会针对哪些类提供优惠，你会针对该类中的客户提供什么种类型的优惠？\n\n# 第六部分\n\n# 时间序列预测\n\n\
  # 第 16 章\n\n## 处理时间序列\n\n在本章中，我们描述了业务时间序列预测的背景，并介绍了在后续章节中详细介绍的主要方法，特别是基于回归的预测和基于平滑的方法。我们的重点是预测单个时间序列的未来值。这三章旨在作为对通用预测方法和方法的介绍。\n\
  \n在本章中，我们讨论了时间序列预测的预测性质与时间序列分析的描述性或解释性任务之间的区别。随后将对对结合预测方法或结果以增加精度的一般性讨论。接下来，我们从四个成分（水平层、趋势、季节性和噪声）的角度介绍时间序列，并介绍可视化不同成分以及探索时间序列数据的方法。最后我们讨论了数据划分（创建训练集和验证集），这与横截面数据划分是不同的。\n\
  \n### 16.1 引言\n\n时间序列预测在几乎每个处理量化数据的组织中进行。零售店用它预测销售额。能源公司用它预测储量、产量、需求和价格。教育机构用它预测入学人数。政府用它预测税收和支出。世界银行和国际货币基金等国际金融组织用它预测通货膨胀和经济活动。运输公司用时间序列预测未来的旅行情况。银行和贷款机构用它（有时用得很糟糕！）预测新房购买。风险投资公司用它预测市场潜力并评估业务计划。\n\
  \n本书之前的几个章节处理的是时间不是因素的数据分类和预测，这里的意义是指时间没有被视为与其他变量无异的，并且随时间测量的顺序并不重要。这些通常被称为横截面数据。相比之下，本章处理的是另一种类型的数据：时间序列。\n\
  \n\n\n随着如今技术的发展，许多时间序列是以非常频繁的时间尺度记录的。股票数据可以达到股票代码层面的颗粒。在线和线下商店的购买记录是实时记录的。物联网（IoT）产生了海量的时间序列，由传感器和其他测量设备产生。尽管数据可能以非常高的频率获取，但从预测的角度来看，并不总是优先使用这种时间尺度。在考虑选择时间尺度时，必须考虑所需预测的规模以及数据中的噪声水平。例如，如果目标是预测杂货店的日销售额，使用分钟级的销售数据对预测而言可能不如使用日聚合数据有用。分钟序列将包含许多噪声源（例如高峰和非高峰购物时段的波动），这会削弱其预测能力，而当数据被聚合到更粗略的水平时，这些噪声误差可能会被相互抵消。\n\
  \n本书的这一部分的重点是单时间序列的预测。在某些情况下，需要预测多个时间序列（例如多个产品的月销售额）。即使在预测多个序列时，最流行的预测做法也是对每个序列进行单独预测。单序列预测的优点是简单，但缺点是它没有考虑到序列之间可能的关系。统计学文献包含了针对多元时间序列的模型，这些模型直接对序列之间的交叉相关性建模。此类方法往往对数据和跨序列结构做出限制性假设。它们还需要统计专业知识来进行估计和维护。计量经济学模型通常将一个或多个序列的信息作为输入引入另一个序列中。然而，此类模型基于理论模型的因果假设。另一种方法是更具启发性地捕捉感兴趣序列与外部信息之间的关联。一个例子是根据雅诗·兰黛（Estee\
  \ Lauder）主席罗纳德·劳瑟德（Ronald Lauder）的观察，口红销量在经济困难时期之前往往倾向于增加（这种现象被称为“领先口红指标”）。\n\n\
  ## 16.2 描述性建模与预测性建模\n\n与截面数据一样，时间序列数据的建模是为了描述性或预测性目的。在描述性建模或`时间序列分析`（time series\
  \ analysis）中，对时间序列进行建模是为了确定其在季节性模式、趋势、与外部因素的关系等成分。这些随后可以用于决策和政策制定。相比之下，`时间序列预测`（time\
  \ series forecasting）利用时间序列中的信息（可能还有其他信息）来预测该序列的未来值。时间序列分析与时间序列预测目标之间的差异导致了所用方法类型以及建模过程本身的差异。例如，在选择描述时间序列的方法时，优先考虑能产生可理解结果的方法（而非“黑箱”方法），有时还会考虑基于因果论证的模型（解释性模型）。此外，描述可以是追溯性质的，而预测在本质上是`前瞻性`（prospective）的。这意味着描述性模型可能会使用“未来”信息（例如，对昨天、今天和明天的数值取平均以获得今天数值的平滑表示），而预测模型则不能。\n\
  \n本章的重点是时间序列预测，其目标是预测时间序列的未来值。关于时间序列分析的信息，请参见 Chatfield (2003)。\n\n## 16.3 业务中常用的预测方法\n\
  \n在本书的这一部分，我们关注在业务应用中流行的两种主要预测方法。这两种都很多功能且强大，且相对容易理解和部署。一种预测工具是多元线性回归，用户指定一个模型，然后从时间序列中对其估计。另一种是更具数据驱动性的平滑法（smoothing），该方法从数据中学习模式。这两种类型的工具各有优缺点，详见第\
  \ 17 章和第 18 章。我们还注意到，用于截面数据的神经网络等数据挖掘方法有时也用于时间序列预测，特别是将外部信息整合到预测中（参见 Shmueli & Lichtendahl,\
  \ 2016）。\n\n### 方法结合\n\n在接下来的两章讨论具体的预测方法之前，应该指出，提高预测性能的一种常用方法是结合预测方法。这类似于第 13 章描述的集成（ensemble）方法。结合预测方法可以通过二级（或多级）预测器来实现，其中第一个方法使用原始时间序列生成未来值的预测，第二种方法使用第一个模型的残差生成未来预测误差的预测，从而“修正”第一层的预测。我们在第\
  \ 17 章（第 17.4 节）描述了两级预测。另一种结合方法是通过“集成”，将多种方法应用于时间序列，并对产生的预测结果进行某种方式的平均以产生最终预测。结合方法可以利用不同预测方法的优势来捕捉时间序列的不同方面（这在截面数据中同样适用）。多个方法的平均可以产生更具稳健且精度更高的预测。\n\
  \n## 16.4 时间序列成分\n\n在两种类型的预测方法（回归模型和平滑法）中，以及通常情况下，习惯将时间序列分解为四个成分：`水平`（level）、`趋势`（trend）、`季节性`（seasonality）和`噪声`（noise）。前三个成分被假设是不可见的，因为它们刻画了底层序列，而我们只能观察到带有额外噪声的序列。水平描述序列的平均值，趋势是序列从一个时期到下一个周期的变化，季节性描述了在给定序列中可以观察到多次短期周期行为。最后，噪声是由于测量误差或其他未考虑的原因引起的随机波动。它始终以某种程度存在于时间序列中。\n\
  \n为了识别时间序列的成分，第一步是检查时间图。在最简单的形式中，时间图是随时间变化的折线图，横轴为时间标记（例如日期）。为了说明这一点，请考虑以下示例。\n\n\
  ### 示例：Amtrak 火车客量\n\n美国铁路公司 Amtrak 定期收集客量数据。在这里我们关注使用 1991 年 1 月至 2004 年 3 月的月客量序列预测未来客量。这些数据可以在\
  \ `www.forecastingprinciples.com` 公开获取。\n\nAmtrak 月客量序列的时间图如图 16.1 所示。注意数值单位为千人。\n\
  \n```\n 创建时间序列图的代码\n```\n\n\n\n\n```r\nlibrary(forecast)\nAmtrak.data <- read.csv(\"\
  Amtrak.csv\")\n\n### 使用 ts() 创建时间序列对象\n# ts() 取三个参数：start, end, 和 freq. \n# 对于月度数据，每个季节的周期频率为\
  \ 12（每年）。 \n# 参数 start 和 end 是 (季节数, 周期数) 元对。 \n# 这里 start 是 1991 年 1 月：start =\
  \ c(1991, 1); end 是 2004 年 3 月：end = c(2004, 3)。\nridership.ts <- ts(Amtrak.data$Ridership,\
  \ \n    start = c(1991, 1), end = c(2004, 3), freq = 12)\n\n### 绘制序列\nplot(ridership.ts,\
  \ xlab = \"Time\", ylab = \"Ridership (in 000s)\", ylim = c(1300, 2300))\n```\n\n\
  ![图显示了从 1992 年到 2004 年的时间与 1400 到 2200 千人流量的对比。](img/c16f001.jpg)\n\n**图 16.1**\
  \ (#c16.xhtml_figureanchor16-1) 1991 年 1 月至 2004 年 3 月 Amtrak 火车的月度客运（千人）\n\n观察时间图可以揭示序列分量的特质：整体水平约为每月\
  \ 1,800,000 人。在此期间可以发现轻微的 U 形趋势，并具有明显的年度季节性，其中夏季（7 月和 8 月份）是旅行高峰。\n\n时间序列可视化的第二步是更仔细地检查它。以下工具非常有用：\n\
  \n*   **放大（Zoom in）：** 将序列放大到较较短的时间段可以揭示查看整个序列时被隐藏的模式。当时间序列很长时，这尤为重要。考虑一组瑞士 Baregg\
  \ 隧道每日通过车辆数的序列（数据与 Amtrak 客运数据位于相同位置；序列 `D028`）。图 16.2 顶部面板显示了从 2003 年 11 月 1 日到\
  \ 2005 年 11 月 16 日的序列。放大到 4 个月期间（底部面板）显示了完整序列时间图中不可见的明显周模式。\n\n*   **更改序列比例（Change\
  \ scale of series）：** 为了更好地识别趋势的形状，更改序列比例是有用的。一种简单的方法是将垂直比例改为对数比例（在 Excel 选项中，选择\
  \ `Chart Tools > Axes > Primary Vertical Axis > More Primary Vertical Axis Options`，并在\
  \ `Format Axis` 菜单中点击“对数刻度”）。如果新比例上的趋势看起来更具线性，那么原始序列中的趋势更接近于指数趋势。\n*   **添加趋势线（Add\
  \ trend lines）：** 更好地识别趋势形状的另一种可能性是添加趋势线（Excel 选项：`Chart Tools > Trendline`）。通过尝试不同的趋势线，可以查看哪种类型的趋势（例如线性、指数、二次）最能拟合数据。\n\
  *   **抑制季节性（Suppress seasonality）：** 在抑制季节性时，通常更容易看到数据中的趋势。可以通过在较粗的时间尺度上绘制序列（例如，将月度数据聚合为年度）或为每个季节创建单独的线条或时间图（例如为每周每一天创建单独线条）来抑制季节性模式。另一个流行的选项是使用移动平均图。我们将在第\
  \ 18 章（第 18.2 节）讨论这些内容。\n\n继续我们的 Amtrak 客运示例，图 16.3 中的图表有助于使序列成分更加可见。\n\n![图显示了从\
  \ 03-11-01 到 05-11-01 以及 04-02-01 到 04-05-31 天与 60000 到 140000 车辆数的对比。](img/c16f002.jpg)\n\
  \n**图 16.2** (#c16.xhtml_figureanchor16-2) 瑞士 Baregg 隧道每日通过车辆数的时间图。底部面板放大到 4 个月期间，揭示了周模式\n\
  \n```r\n# 创建图 16.3 的代码\n```\n\n```r\nlibrary(forecast) \n\n# 创建短时间序列\n# 使用 window()\
  \ 创建一个新的较短的 ridership.ts 序列\n# 对于新的三年序列，开始时间是 1997 年 1 月，结束时间是 1999 年 12 月\nridership.ts.3yrs\
  \ <- window(ridership.ts, start = c(1997, 1), end = c(1999, 12))\n\n# 对时间序列拟合线性回归模型\n\
  ridership.lm <- tslm(ridership.ts ~ trend + I(trend²))\n\n# 较短和较的时间序列\npar(mfrow\
  \ = c(2, 1))\nplot(ridership.ts.3yrs, xlab = \"Time\", ylab = \"Ridership (in 000s)\"\
  , \n                    ylim = c(1300, 2300))\nplot(ridership.ts, xlab = \"Time\"\
  , ylab = \"Ridership (in 000s)\", \n                    ylim = c(1300, 2300))\n\n\
  # 叠加线性模型的拟合值\nlines(ridership.lm$fitted, lwd = 2)\n```\n\n![图显示了从 1997.0 到 2000.0\
  \ 时间与 1992 到 2004 年 1400 到 2200 之间客运量（千人）的对比。](img/c16f003.jpg)\n\n**图 16.3** (#c16.xhtml_figureanchor16-3)\
  \ 增强时间序列不同成分的图。顶部：放大到 3 年。底部：叠加趋势的原始序列\n\n某些预测方法通过对这些成分做出假设来直接对其建模。例如，关于趋势的一个流行假设是它在给定时间范围内是线性的或指数的。另一个常见假设是关于噪声：许多统计方法假设噪声遵循正态分布。依赖此类假设方法的优点是，当假设合理时，预测结果将更健壮，模型也更易理解。其他预测方法（数据自适应方法）对这些成分的假设较少，而是尝试仅从数据进行估计。当此类假设可能被违反时，或者时间序列的结构随时间变化时，数据自适应方法具有优势。\n\
  \n决定模型驱动和数据驱动预测方法的关键标准是序列在全局模式与局部模式方面的性质。全局模式是指在整个序列中相对恒定的模式。例如是整个序列的线性趋势。相反，局部模式是指仅在数据的一短时期发生并随后变化的模式，例如在四个相邻时间点内近似线性的趋势，但趋势大小（斜率）随时间缓慢变化。\n\
  \n模型驱动方法通常更适用于具有全局模式的序列，因为它们利用所有数据来估计全局模式。对于局部模式，模型驱动模型需要指定模式何时以及如何变化，这通常是不可行的且往往未知的。因此，数据驱动方法更适用于局部模式。此类方法从数据中“学习”模式，其记忆长度可以设置为最能适应序列变化率。变化快速的模式需要“短记忆”，而变化缓慢的模式则需要“长记忆”。结论，时间图不仅应用于识别时间序列成分，还应识别趋势和季节性的全局/局部性质。\n\
  \n## 16.5 数据划分与性能评估\n\n\n\n\n与截面数据一样，为了避免过拟合并能够评估模型在预测数据上的预测性能，我们首先将数据划分为训练集和验证集（可能还有一个额外的测试集）。然而，截面数据和时间序列数据在数据划分上存在一个重要的区别。在截面数据中，划分通常是随机进行的，将一组随机记录指定为训练数据，其余部分作为验证数据。然而，在时间序列中，随机划分会创建出两个带有“空洞”的时间序列。几乎所有的标准预测方法都无法处理具有缺失值的时间序列。因此，我们以不同的方式将时间序列划分为训练集和验证集。将序列切分为两个时期：较早的时期设置为训练数据，较晚的时期设置为验证数据。然后在较早的训练期上对方法进行训练，并在较晚的验证期上评估其预测性能。评估指标通常使用与截面评估中相同的指标（见第\
  \ 5 章），其中 `MAE`、`MAPE` 和 `RMSE` 是实践中最常用的指标。在评估和比较预测方法时，另一个重要的工具是可视化：检查实际序列和预测序列的时间图可以阐明性能，并提示可能的改进方向。\n\
  \n### 基准性能：朴素预测\n\n虽然应用“复杂”的预测方法很有吸引力，但我们必须评估它们与非常简单的方法——`naive forecast`（朴素预测）相比的价值。朴素预测就是序列的最新值。换句话说，在时间\
  \ `t`，对任何未来时期 `t + k` 的预测仅仅是序列在时间 `t` 的值。虽然朴素预测很简单，但有时发现很难通过更复杂的模型来超越。因此，与朴素预测方法的结果进行基准比较是非常重要的。\n\
  \n当时间序列具有季节性时，可以生成季节性朴素预测。它简单地是该季节内上一次的相似值。例如，为了预测 Amtrak 客运量的 2001 年 4 月数据，我们使用最近的一个\
  \ 4 月（即 2000 年 4 月）的客流量。同样，预测 2002 年 4 月时也使用 2000 年 4 月的客流量。在图 16.4 中，我们展示了从 2001\
  \ 年 4 月到 2004 年 3 月的 3 年验证集中的朴素预测（水平线）、季节性朴素预测以及实际值（虚线）。\n\n| |\n```\n code 用于创建图\
  \ 16.4 的代码\n``` |\n| |\n```r\nnValid <- 36\nnTrain <- length(ridership.ts) - nValid\n\
  \n### partition the data\ntrain.ts <- window(ridership.ts, start = c(1991, 1), end\
  \ = c(1991, nTrain))\nvalid.ts <- window(ridership.ts, start = c(1991, nTrain +\
  \ 1), \n                                 end = c(1991, nTrain + nValid))\n\n#  generate\
  \ the naive and seasonal naive forecasts\nnaive.pred <- naive(train.ts, h = nValid)\n\
  snaive.pred <- snaive(train.ts, h = nValid)\n\n### plot forecasts and actuals in\
  \ the training and validation sets\nplot(train.ts, ylim = c(1300, 2600),  ylab =\
  \ \"Ridership\", xlab = \"Time\", bty = \"l\", \n    xaxt = \"n\", xlim = c(1991,2006.25),\
  \ main = \"\")\naxis(1, at = seq(1991, 2006, 1), labels = format(seq(1991, 2006,\
  \ 1)))\nlines(naive.pred$mean, lwd = 2, col = \"blue\", lty = 1)\nlines(snaive.pred$mean,\
  \ lwd = 2, col = \"blue\", lty = 1)\nlines(valid.ts, col = \"grey20\", lty = 3)\n\
  lines(c(2004.25 - 3, 2004.25), c(0, 3500)) \nlines(c(2004.25, 2004.25), c(0, 3500))\n\
  text(1996.25, 2500, \"Training\")\ntext(2002.75, 2500, \"Validation\")\ntext(2005.25,\
  \ 2500, \"Future\")\narrows(2004 - 3, 1991.25, 2004, 2450, code = 3, length = 0.1,\
  \ lwd = 1, angle = 30)\narrows(2004.5 - 3, 2004, 2004, 2450, code = 3, length =\
  \ 0.1, angle = 30)\narrows(2004.5, 2006, 2450, code = 3, length = 0.1, angle = 30)\n\
  ``` |\n\n![图显示了 1991 年到 2005 年的时间与 1400 到 2600 的客流量对比，包含训练、验证和未来的图表。](img/c16f04.jpg)\n\
  \n图 16.4 验证集中的朴素预测和季节性朴素预测\n\n表 16.1 客运量在验证集中的朴素预测和季节性朴素预测。由于客运量具有季节性，季节性朴素预测在训练集和验证集上都是胜者。在选择两种方法时，验证集的表现比训练集更具参考价值。|\
  \ |\n```r\n> accuracy(naive.pred, valid.ts)\n                    ME      RMSE  \
  \      MAE      MPE     MAPE\nTraining set   2.45090 168.150 125.297  0.346027 7.27139\
  \ \nTest set     -14.7172 142.751 115.923  -1.27492 6.02139 \n> accuracy(snaive.pred,\
  \ valid.ts)\n                    ME      RMSE        MAE      MPE     MAPE\nTraining\
  \ set   13.9391 95.2655 84.4917  2.65272 4.24765 \nTest set     54.729 95.6243 84.096\
  \ 5.8801 4.71525 \n``` |\n\n### 生成未来预测\n\n截面数据与时间序列划分的另一个重要区别出现在创建实际预测时。在尝试预测未来值之前，我们将训练集和验证集合并，并对完整数据重新运行模型。合并的三个优势是：\n\
  \n1. 验证集最接近预测时期，通常包含价值价值；\n2. 拥有更多的数据（相比于只有训练集），某些模型的估计会更准确；\n3. 如果仅使用训练集生成预测，则需要预测更远（例如，如果验证集包含四个时间点，则需要从训练集进行五步预测）。\n\
  \n### 问题\n\n1. **9/11 事件对美国航空旅行的影响。** 研究与创新管理局交通统计局进行了一项研究，评估 2001 年 9 月 11 日恐怖袭击对交通的影响。该\
  \ 2006 年的研究报告和数据可以在 [`goo.gl/w2lJPV`](http://goo.gl/w2lJPV) 找到。研究目标如下：\n\n> 本研究的目的是更深入地理解\
  \ 9/11 前后长途旅行的行为模式。\n\n> 报告分析了 1990 年 1 月到 2004 年 5 月之间的每月出行数据。`Sept11Travel.csv`\
  \ 文件提供了三个每月时间序列的数据：\n\n1. 实际航空收入乘客里程（Air），\n2. 铁路乘客里程（Rail），\n3. 汽车里程（Car）。\n\n\
