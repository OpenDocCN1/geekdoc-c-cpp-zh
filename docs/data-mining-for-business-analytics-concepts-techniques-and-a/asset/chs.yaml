  )\nbank.df <- bank.df[ , -c(1, 5)]  # 删除 ID 和邮政编码列\n\n### 划分\nset.seed(1)  \ntrain.index\
  \ <- sample(c(1:dim(bank.df)[1]), dim(bank.df)[1]*0.6)  \ntrain.df <- bank.df[train.index,\
  \ ]\nvalid.df <- bank.df[-train.index, ]\n\n#分类树\ndefault.ct <- rpart(Personal.Loan\
  \ ~ ., data = train.df, method = \"class\")\n### 绘制树\nprp(default.ct, type = 1,\
  \ extra = 1, under = TRUE, split.font = 1, varlen = -10)\n```\n\n![图表显示收入（小于 114）的标记分为\
  \ CCavg 和教育，然后分别到 CD.account 和家庭，最后 CD.account 指向收入然后是家庭。](img/c09f009.jpg)\n\n\
  图 9.9 使用训练集（3000 条记录）的贷款接受数据的默认分类树\n\n完整的树如 图 9.10 所示。虽然很难看到精确的分叉，但让我们用验证数据评估这棵树的性能，并将其与较小的默认树进行比较。验证数据中的每条记录都“向下通过”树，并根据其到达的终端节点进行分类。这些预测类别随后可以通过混淆矩阵与实际身份进行比较。当关注某个特定类别时，提升图（lift\
  \ chart）对于评估模型捕捉这些成员的能力非常有用。\n\n```r\n# 创建更深层分类树的代码\n```\n\n```r\ndeeper.ct <- rpart(Personal.Loan\
  \ ~ ., data = train.df, method = \"class\", cp = 0, minsplit = 1)\n### 统计叶节点数量\n\
