  mower.norm.df[, 1:2] <- predict(norm.values, mower.df[, 1:2])\n# 使用 knn() 计算最近邻居\n\
  # knn() 在 library FNN 中可用（提供最近邻的列表并允许数值输出）。\nlibrary(FNN)\nnn <- knn(train = train.norm.df[,\
  \ 1:2], test = new.norm.df, \n          cl = train.norm.df[, 3], k = 3)\n\nrow.names(train.df)[attr(nn,\
  \ \"nn.index\")]\n\n输出\n> row.names(train.df)[attr(nn, \"nn.index\")]\n[1] \"9\"\
  \ \"14\" \"1\"\n< nn\n[1] Owner\nattr(nn,\"dist\")\n[1] 0.513738 0.571628 0.794605\n\
  ```\n\n表 7.2 运行 k-NN![](img/c07_ILM003.gif)\n\n7.1.4 选择 k![](img/c07_ILM04.gif)\n\
  \n选择 `k` > 1 的优点是较高的 `k` 值可以减少过拟合的风险。通常情况下，如果 `k` 太小，可能会拟合数据中的噪声。然而，如果 `k` 太大，我们将失去该方法捕捉数据中局部结构的能力。在极端情况下，`k`\
  \ = `n`（训练数据集中的记录数），在这种情况下，我们简单地将所有记录分配给训练数据中的多数类（忽略 `x[1]`、`x[2]`、...`x[p]` 的值），这与朴素规则一致！这显然是在缺乏关于类别的有效预测信息的情况下过度平滑。换句话说，我们希望在过度拟合预测信息和完全忽略这些信息之间取得平衡。平衡的选择很大程度上取决于数据的性质。数据的结构越复杂、不规则，最优\
  \ `k` 值就越小。通常 `k` 的值在 1 到 20 之间。我们将使用奇数来避免平局。\n\n那么 `k` 是如何选择的？答案是：选择分类性能最好的 `k`。我们使用训练数据对验证数据进行分类，然后计算不同\
  \ `k` 值的错误率。对于偶数 `k`，如果在分类家庭时出现平局，则随机打破平局。这在表 7.3 所示。我们会选择验证集准确率最大的 `k`。注意，现在验证集作为训练过程（设置\
  \ `k`）的一部分，不再像以前那样反映真实的留集。理想情况下，我们希望有一个第三测试集来评估该方法在未见数据上的性能。\n\n```\n测量不同 k 值准确率的代码\n\
  ```\n\n```\nlibrary(caret)\n\n# 初始化带有两列的数据框：k 和准确率。\naccuracy.df <- data.frame(k\
  \ = seq(1, 14, 1), accuracy = rep(0, 14))\n\n# 计算验证集上不同 k 的 knn\nfor(i in 1:14)\
  \ {\n  knn.pred <- knn(train.norm.df[, 1:2], valid.norm.df[, 1:2], \n          \
  \        cl = train.norm.df[, 3], k = i)\n  accuracy.df[i, 2] <- confusionMatrix(knn.pred,\
  \ valid.norm.df[, 3])$overall[1] \n}\n\n输出\n> accuracy.df\n    k accuracy\n1   1\
  \      0.7\n2   2      0.7\n3   3      0.8\n4   4      0.9\n5   5      0.8\n6  \
  \ 6      0.9\n7   7      0.9\n8   8      1.0\n9   9      0.9\n10 10      0.9\n11\
  \ 11      0.9\n12 12      0.8\n13 13      0.4\n14 14      0.4\n```\n\n表 7.3 验证集上针对不同\
  \ k ![](img/c07_ILM005.gif) 选择的 k-NN 预测的准确率（或正确率）\n\n[-content]\n\n一旦选定了 `k`，我们将在合并的训练集和测试集上重新运行算法，以生成新记录的分类。示例在表\
  \ 7.4 中所示，其中使用了四个最近的邻居来分类新家庭。\n\n```\n运行 k-NN 算法分类新家庭的代码\n```\n\n\n\n\n\n```r\n\
  knn.pred.new <- knn(mower.norm.df[, 1:2], new.norm.df, \n                    cl\
  \ = mower.norm.df[, 3], k = 4)\nrow.names(train.df)[attr(nn, \"nn.index\")]\n\n\
  部分输出\n> row.names(train.df)[attr(nn, \"nn.index\")]\n[1] \"9\"  \"14\" \"1\"  \"\
  20\"\n> knn.pred.new\n[1] Owner\nattr(,\"nn.index\")\n     [,1] [,2] [,3] [,4]\n\
  [1,]    3   12    7    6\nattr(,\"nn.dist\")\n      [,1]  [,2]  [,3]  [,4]\n[1,]\
  \ 0.514 0.572 0.795 0.865\nLevels: Owner\n```\n\n## 表 7.4 使用“最佳 k” = 4 对新家庭进行分类\n\
  \n### 设置阈值\n\n`k`-NN 使用多数通过规则对新记录进行分类，其中该记录被归类为 `k` 个邻居中多数类类别的成员。“多数”的定义与应用于类别成员概率的阈值概念直接相关。让我们考虑一个二元结果情况。对于一个新记录，其邻居中类别\
  \ 1 成员的比例是其属于类别 1 倾向（概率）的估计。在 `k` = 4 的割草机示例中，我们发现距离新家庭（收入 = 60,000 美元，地面积 = 20,000\
  \ 平方英尺）最近的四个邻居是 9、14、1 和 20 号家庭。由于其中两个是所有者，另外两个不是所有者，我们可以估计新家庭作为所有者的概率为 0.5（非所有者的概率也为\
  \ 0.5）。使用简单的多数通过规则等同于将阈值设置为 0.5。在表 7.4 中，我们看到软件通过（随机地）将类别 `owner` 分配给该记录来打破平局。\n\
  \n正如第 5 章提到的，更改阈值会影响混淆矩阵（即错误率）。因此，在某些情况下，我们可能希望选择默认 0.5 以外的阈值，以最大化准确性或纳入误分类成本。\n\
  \n### ![](img/c07_ILM0007.gif)-多两个类别的 NN\n\n`k`-NN 分类器可以很容易应用于具有 `m` 个类别的结果，其中 `m`\
  \ > 2。“多数规则”意味着新记录被归类为其 `k` 个邻居中多数类类别的成员。当我们感兴趣要识别某个特定类别（并愿意“过度识别”记录属于该类别）时，另一种方法是计算\
  \ `k` 个邻居中属于我们感兴趣的类别的比例，将该比例用作新记录属于该类别的概率（倾向）的估计值，然后参考用户指定的阈值来决定是否将新记录分配给该类别。关于在存在单个感兴趣类别的分类中使用阈值用例的更多信息，请参阅第\
  \ 5 章。\n\n### 将分类变量转换为二值哑变量\n\n计算两个非数值类别之间（例如书店中的菜谱和地图）的欧几里得距离通常没有意义。因此，在应用 `k`-NN\
  \ 之前，必须将分类变量转换为二值哑变量。与回归等统计模型的情况不同，所有 `m` 个二值变量都应该创建并用于 `k`-NN。虽然这在数学上是冗余的，因为 `m`\
  \ − `1` 个哑变量就足够了，但在 k-NN 中应创建所有 `m` 个二值变量。虽然这在数学上是冗余的，因为 `m` − `1` 个哑变量已经包含了与 `m`\
  \ 个变量相同的信息，但在 k-NN 中使用 `m` 个哑变量不会产生回归模型中那样的多重共线性问题。\n\n## 7.2 ![](img/c07_ILM0008.gif)-针对数值结果的\
  \ NN\n\n对于数值结果，`k`-NN 的想法可以很容易扩展到连续值的预测（如回归模型所示）。通过计算距离确定邻居的第一步保持不变。使用邻居的多数投票来确定类别的第二步被修改为我们使用最近邻居的平均值进行预测。在\
  \ R 中，我们使用 `knn` 包中的函数来计算验证集的 `k`-NN。通常，这种平均值是随着距离增加而减小的加权平均值。\n\n## 7.3 ![](img/c07_ILM0009.gif)-NN\
  \ 算法的优缺点\n\nk-NN 方法的主要优点是简单且不需要参数假设。在存在足够大的数据集的情况下，这些方法的效果非常好，特别是当每个类别由预测值的多种组合表征时。例如，在房地产数据库中，{房屋类型、房间数、社区、挂价等}的多种组合可以特征快速销售的房屋与在市场上很久的房屋。\n\
  \n实际利用 k-NN 方法存在三个困难。首先，虽然不需要从训练数据中估计参数（如回归模型那样），但在大型训练集中寻找邻居的时间可能是无法接受的。已经实施了一些想法来克服这种困难。主要包括：\n\
  \n*   通过使用主成分分析等降维技术在降维后的空间中工作，以减少计算距离的时间。\n*   使用树等复杂的数据结构来加速最近邻居的识别。这种方法通常为了速度接受“近似最近邻”。一个例子是分桶，将记录分组到桶中，使每个桶内的记录相互靠近。对于待预测记录，根据其到桶的距离进行排序。从最近的桶开始，测量桶内每个记录的距离。当桶的距离大于目前发现的最近记录的距离时，算法停止。\n\
  \n其次，为了算作大型，训练集中所需的记录数量随预测变量数量 `p` 指数级增长。这是因为除非数据集的大小随 `p` 指数级增长，否则最近邻的预期距离会剧增。这种现象被称为维度灾咒，是所有分类、预测和聚类技术共同面临的基础问题。这就是为什么我们经常寻求通过选择预测变量子集或通过主成分分析等方法组合变量来减少预测变量。\n\
  \n第三，k-NN 是一种“懒惰学习者”：耗时的计算被推迟到预测阶段。对于每个待预测记录，我们只在预测时才计算其与整个训练集的距离。这种行为阻止了同时对大量记录进行实时预测。\n\
  \n\n\n\n# 1. 使用分类预测变量计算距离\n\n这个使用微数据集的练习演示了欧几里得距离的计算以及二分类变量（dummies）的。在线教育公司 [Statistics.com](http://Statistics.com)\
  \ 将其客户和潜在客户分为三大类：IT 专业人员 (IT)、统计学家 (Stat) 和其他 (Other)。它还跟踪了每个客户自首次联系以来的年数 (`years`)）。考虑以下客户；其中包含了他们是否上过课程（要预测的结果）的信息：\n\
  \n客户 1：Stat，1 年，未上过课程\n\n客户 2：Other，1.1 年，上过课程\n\n1. 现在考虑以下这个新潜在客户：\n\n潜在客户 1：IT，1\
  \ 年\n\n利用上述关于两个客户和一个潜在客户的信息，为这三者创建一个数据集，将分类预测变量转换为 2 个二分类变量，并创建一个将分类预测变量转换为 3 个二分类变量的数据集。\n\
  \n2. 对于每个派生数据集，计算潜在客户与另外两个客户之间的欧几里得距离。（*注*：虽然在 `k*-NN` 中通常会对数据进行归一化，但这不是铁律，你可以在此处不进行归一化直接进行。）\n\
  \n3. 使用 `k` = 1 的 `k*-NN`，利用两个派生数据集将潜在客户分类为上过课程或未上过课程。使用 2 个还是 3 个哑变量（dummies）会有区别吗？\n\
  \n# 2. 个人贷款接受\n\nUniversal Bank 是一家相对年轻的银行，在总体客户获取方面增长迅速。这些客户的大多数是负债客户（存款人），与银行的关系规模不一。资产端客户（借款人）的客户群非常小，银行希望迅速扩大这一基数以引入更多贷款业务。特别是，它希望探索将其负债客户转换为个人贷款客户的方法（同时保留其存款人身份）。\n\
  \n银行去年针对负债客户开展的一项活动显示出超过 9% 的健康转化率。这鼓励了零售营销部门制定更精明的活动和更好的针对性营销。目标是使用 `k*-NN` 预测新客户是否会接受贷款提议。这将作为新活动设计的基础。\n\
