  \n表 9.3 显示了较小默认树（顶部）和完整树（底部）的训练集和验证集的混淆矩阵。比较两个训练矩阵，我们发现完整树的准确率更高：它在分类训练数据时达到了 100%\
  \ 的准确率，这意味着它的终端节点是完全纯净的。相比之下，验证数据的混淆矩阵显示较小的树更准确。主要原因是完全树过拟合了训练数据（达到了完美准确率！）。这引出了下一节，在其中我们描述了通过在树完全生长之前停止其生长或通过剪枝完全树来避免过拟合的方法。\n\
  \n```r\n### 分类验证数据中的记录。\n# 在 predict() 中设置参数 type = \"class\" 以生成预测类别身份。\ndefault.ct.point.pred.train\
  \ <- predict(default.ct,train.df,type = \"class\")\n### 为训练数据生成混淆矩阵\nconfusionMatrix(default.ct.point.pred.train,\
