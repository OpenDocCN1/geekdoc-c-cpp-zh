  \n## 降维\n\n在本章中，我们描述了降维这一重要步骤。数据集的维度（变量的数量）必须被降低，以便数据挖掘算法高效运行。这一过程是数据挖掘试点/原型阶段的一部分，并在部署模型之前完成。我们介绍并讨论了几种降维方法：(1)\
  \ 引入领域知识以删除或合并类别，2) 使用数据摘要检测变量之间的信息重叠（并删除或合并冗余变量或类别），3) 使用数据转换技术，例如将分类变量转换为数值变量，以及\
  \ (4) 采用自动还原技术，例如主成分分析 (PCA)，其中创建一组新变量（原始变量的加权平均值）。这些新变量之间是不相关的，且其中的一小部分通常包含了它们的大部分信息（因此，我们可以通过使用新变量的子集来降低维度）。最后，我们提到了回归模型和分类回归树等数据挖掘方法，它们用于删除冗余变量以及合并分类变量的“相似”类别。\n\
  \n### 4.1 引言\n\n在数据挖掘中，经常会遇到数据库中存在大量变量的情况。即使初始变量数量很少，这组变量在数据准备步骤也会迅速扩大，在该步骤会创建新的派生变量（例如分类变量的哑变量和现有变量的新形式）。在这种情况下，变量子集之间可能高度相关。在分类或预测模型中包含高度相关的变量或包含与结果无关的变量可能会导致过拟合，并损害准确性和可靠性。大量的变量还给某些监督和无监督算法带来了计算问题（相关性问题之外）。在模型部署中，多余变量会增加收集和处理这些变量的成本。\n\
  \n### 4.2 维度灾咒\n\n模型的维度是指模型使用的预测器或输入变量的数量。维度灾咒是由于向多元数据中添加变量引起的痛苦。随着变量的增加，数据空间变得越来越稀疏，分类和预测模型会因为可用数据不足以提供有效模型而失效。一个重要的考虑因素是，添加变量带来的困难随着每个变量的增加呈指数级增长。一种直观理解这种现象的方法是考虑棋盘上物体的位置。它有两个维度和\
  \ 64 个格子或选择。如果你将棋盘扩展为立方体，维度增加了 50%——从 2 维增加到 3 维。然而，位置选项增加了 800%，达到 512 个（8 × 8\
  \ × 8）。在统计距离角度来看，变量的激增意味着任何东西都不再接近了——添加了太多的噪声，模式和结构变得无法识别。这个问题在大数据应用中尤为严重，包括基因组学，例如，分析可能需要处理成千上万不同基因的值。因此，数据挖掘的关键步骤之一是找到以最小准确性损失为代价降低维度的方法。\n\
  \n## 4.3 实际考虑因素\n\n\n\n\n尽管数据挖掘更倾向于自动化方法而非领域知识，但在数据探索的第一步，确保所测量的变量对于当前任务是合理的关重要的。通过与数据提供者（或用户）讨论来整合专家知识，可能会获得更好的结果。实际的考虑因素包括：哪些变量对当前任务最重要，哪些变量最可能没用？哪些变量可能包含大量误差？如果重复分析，未来哪些变量可以进行测量（以及测量它们的成本是多少）？哪些变量在结果出现之前实际上是可以测量的？例如，如果我们想预测正在进行的在线拍卖的结束价格，我们不能使用竞价次数作为预测因子，因为这在拍卖结束之前是未。\n\
