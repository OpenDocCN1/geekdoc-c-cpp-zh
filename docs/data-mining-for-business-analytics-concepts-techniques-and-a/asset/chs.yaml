  \n# 第 7 章\n\n![](img/c07_ILM0001.gif)-最近邻 (![](img/c07_ILM0002.gif)-NN)\n\n在本章中，我们描述了\
  \ `k`-最近邻算法，该算法可用于分类（类别型结果）或预测（数值型结果）。为了对新记录进行分类或预测，该方法依赖于在训练数据中寻找“相似”的记录。这些“邻居”随后通过投票（用于分类）或取平均（用于预测）来推导出新记录的分类或预测。我们解释了如何确定相似性、如何选择邻居的数量，以及如何计算分类或预测。`k`-NN\
  \ 是一种高度自动化的数据驱动方法。我们讨论了 `k`-NN 方法在性能和实际考虑因素（如计算时间）方面的优点和缺点。\n\n## 7.1 *k*-NN 分类器（类别型结果）\n\
  \n`k`-最近邻方法的核心思想是在训练数据集中找到与我们想要分类的新记录相似的 `k` 条记录。然后，我们使用这些相似（邻居）记录将新记录归为一类，将新记录分配给这些邻居中占多数的类别。用该新记录的预测变量值标记为\
  \ `x[1]`、`x[2]`、……`x[p]`。我们在训练数据中寻找在预测空间中与待分类记录相似或“接近”的记录（即具有接近 `x[1]`、`x[2]`、……`x[p]`\
  \ 值的记录）。然后，根据这些邻近记录所属的类别，我们为想要分类的记录分配一个类别。\n\n### 确定邻居\n\n`k`-最近邻算法是一种分类方法，它不对对比形式上做出关于类别隶属（`Y`）与预测变量\
  \ `X[1]`、`X[2]`、……`X[p]` 之间关系的假设。这是一种非参数方法，因为它不涉及在假设的函数形式中估计参数，例如线性回归（第 6 章）中假设的线性形式。相反，这种方法从预测值之间的相似性中提取信息。\n\
  \n一个核心问题是如何衡量记录之间的距离。最常用的度量是欧几里距离。记录 `x[1]`、`x[2]`、……`x[p]` 与 `u[1]`、`u[2]`、……`u[p]`\
  \ 之间的欧几里距离为：\n\n(7.1)![编号方程](img/c07_M0001.gif)\n\n你将在第 12 和第 15 章找到针对数值和类别变量各种距离指标。然而，`k`-NN\
  \ 算法依赖于大量的距离计算（每个待预测记录与训练集中每条记录之间的距离），因此，计算廉价的欧几里距离是 `k`-NN 中常用的。\n\n为了平衡各种预测变量可能具有的尺度，请注意在大多数情况下，在计算距离之前应该先进行标准化。还需要注意，用于标准化新记录的均值和标准差是`训练`数据的，新记录不包含在。验证数据像新数据一样也不包含在计算中。\n\
  \n### 分类规则\n\n在计算待分类记录与现有记录之间的距离后，我们需要一个规则根据邻居的类别为该记录分配类别。最简单的情况是 `k = 1`，我们寻找最近的记录（最近邻居），并将新记录归为与其邻居相同的类别。一个惊人的事实是，这种使用单个邻居进行分类的简单直观的想法在训练集中有大量记录时是非常强大的。事实证明，当我们切切每个类的概率密度函数时，1-最近邻方案的分类错误率不超过真实误差的两倍。\n\
  \n1-最近邻的想法可以扩展到 `k > 1` 个邻居，如下所示：\n\n1. 找到待分类记录最近的 `k` 个邻居。\n2. 使用多数决判定规则对记录进行分类，将记录分类为\
  \ `k` 个邻居中多数类的成员。\n\n### 示例：割草机\n\n一家割草机制造商希望找到一种方法，将城市的家庭分类为可能购买割草机的人和可能购买的人。对城市内的\
  \ 12 个业主和 12 个非业主进行了试点随机调查。数据见表 7.1。我们首先将数据分为训练数据（14 个家庭）和验证数据（10 个家庭）。显然，这个数据集太小，无法进行划分，这可能会导致结果不稳定，但为了说明目的，我们将继续这种划分。训练数据的散点图见图\
  \ 7.1。\n\n| **家庭编号** | **收入 ($000s)** | **地块大小 (000s ft²)** | **拥有割草机** |\n| ---\
