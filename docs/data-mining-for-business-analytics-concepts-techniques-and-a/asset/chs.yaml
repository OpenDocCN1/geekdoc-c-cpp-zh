  \ 1991 年 1 月至 2004 年 3 月之间的每月客量序列来预测未来客量。数据及其来源见第 16 章。因此，我们这里的任务是（数值型）时间序列预测。\n\
  \n## 3.3 基础图表：柱状图、折线图和散点图\n\n最有效的三种基础图是柱状图、折线图和散点图。这些图在 `R` 中很容易创建，也是当前商业领域数据探索和展示中最常用的图表（遗憾的是，饼图也很流行，尽管它们通常可视化效果并不理想）。基础图表通过一次显示一或两列数据（变量）来支持数据探索。这在熟悉数据结构、变量数量和类型、缺失值的数量和类型等早期阶段非常有用。\n\
  \n数据挖掘任务的性质和关于数据的领域知识会影响基础图表的使用，体现在分配给不同变量的时间和精力上。在监督学习中，将更多地关注结果变量。在散点图中，结果变量通常与\
  \ *y* 轴相关。在无监督学习中（为了数据降维或聚类），传达关系的基础图非常重要。\n\n\n\n\n\n分布图：箱线图与直方图\n\n在转向能够进行多维研究的复杂可视化方法之前，我们注意到两种重要的图表，它们通常不被视为“基础图表”，但在统计和数据挖掘背景下非常有用。`boxplot`\
  \ 和 `histogram` 是显示数值变量整个分布的两种图表。虽然平均值是非常流行且实用的汇总统计，但通过观察变量的额外统计量（如 `median` 和 `standard\
  \ deviation`）通常可以获得更多信息，通过检查整个分布则获益更多。柱状图只能使用单一聚合，而箱线图和直方图可以显示数值变量的整个分布。箱线图通过生成并排箱线图来比较子组，或者通过创建一系列箱线图来观察随时间变化的分布，同样有效。\n\
  \n分布图在监督学习中确定潜在的数据挖掘方法和变量转换非常有用。例如，如果要在假设正态性的方法（如 `linear regression`、`discriminant\
  \ analysis`）中使用，偏态数值变量可能需要进行转换（例如移动到对数刻度）。\n\n`histogram` 用一系列连接的垂直条形表示所有 `x` 值的频率。例如，在图\
  \ 3.2 的左侧面板中，有 150 多个区域的中位数（`MEDV`）在 $20K–$25K 之间。\n\n![条形图显示从 10 到 50 的 MEDV 与\
  \ 0 到 150 的频率，图显示 0 到 1 的 CHAS 与 10 到 50 的 MEDV。](img/c03f002.jpg)\n\n图 3.2 数值变量\
  \ `MEDV` 的分布图。左：直方图，右：箱线图\n\n| |\n\n```\n code for creating Figure 3.2\n```\n\n\
  \ |\n\n| |\n\n```\n### histogram of MEDV\nhist(housing.df$MEDV, xlab = \"MEDV\"\
  )\n### alternative plot with ggplot\nlibrary(ggplot2)\nggplot(housing.df) + geom_histogram(aes(x\
  \ = MEDV), binwidth = 5)\n\n## boxplot of MEDV for different values of CHAS\nboxplot(housing.df$MEDV\
  \ ~ housing.df$CHAS, xlab = \"CHAS\", ylab = \"MEDV\")\n### alternative plot with\
  \ ggplot\nggplot(housing.df) + geom_boxplot(aes(x = as.factor(CHAS), y = MEDV))\
  \ + xlab(\"CHAS\")\n```\n\n |\n\n`boxplot` 表示在 `y` 轴上绘制的变量（尽管图表可以旋转 90 度，使得箱体与 `x`\
  \ 轴平行）。在图 3.2 的右侧面板中有两个箱线图（称为并排箱线图）。箱体包含 50% 的数据——例如，在右侧箱体中，一半的区域中位数（`MEDV`）在 $20,000–$33,000\
  \ 之间。箱体内部的水平线代表 `median`（第 50 百位数）。箱体的顶部和底部分别代表第 75 百位数和第 25 百位数。延伸到箱体上下线条覆盖了剩余的数据范围；离群值可能以点或圆表示。有时平均值用\
  \ `+`（或类似）符号标记。比较平均值和 `median` 有助于评估数据的偏斜程度。箱线图通常排列成一系列，为 `x` 轴上显示的第二个变量的每个值提供一个不同的图表。\n\
  \n由于 `histograms` 和 `boxplots` 针对数值变量，它们的基本形式对于*预测任务*非常有用。箱线图还可以通过显示数值变量（`y` 轴）与分类变量（`x`\
  \ 轴）之间的关系来支持*无监督学习*。为了说明这些点，请再次查看图 3.2。左侧面板显示 `MEDV` 的 `histogram`，揭示了偏态分布。将输出变量转换为\
  \ `log(MEDV)` 可能会提高 `linear regression` 预测器的结果。\n\n图 3.2 的右侧面板显示了并排箱线图，比较了临界查尔斯河（1）或不临界（0）房屋的\
  \ `MEDV` 分布，类似于图 3.1。我们看到，不仅临河房屋的平均 `MEDV` 高于不临河房屋，而且整个分布更高（中位数、四分位数、最小值和最大值）。我们还可以看到，所有临河房屋的\
  \ `MEDV` 都在 1 万美元以上，而不临河房屋则不然。这些信息对于识别该预测器（`CHAS`）的潜在重要性，以及对于选择能够捕捉两个分布之间非重叠区域的数据挖掘方法（例如树）非常有用。\n\
  \n应用于数值变量的 `Boxplots` 和 `histograms` 还可以为衍生新变量提供方向，例如，它们可以指示如何对数值变量进行分箱（例如，为了使用\
  \ `naive Bayes classifier` 而对数值结果进行分箱，或者在波士顿房价示例中，选择截断点将 `MEDV` 转换为 `CAT.MEDV`）。\n\
  \n最后，并排箱线图在分类任务中对于评估数值预测器的潜力非常有用。这是通过使用 `x` 轴表示分类结果，使用 `y` 轴表示数值预测器来实现的。图 3.3 展示了一个示例，我们可以在其中看到四个预测器对\
  \ `MEDV` 的影响。\n\n\n\n\n\n`heatmap` 是一种数值数据的图形化显示，其中颜色用于表示数值值。在数据挖掘语境下，热图对于两个目的特别有用：可视化相关性矩阵和可视化数据中的缺失值。在这两种情况下，信息都是以二维表格的形式呈现的。包含\
  \ `p` 个变量的相关性矩阵有 `p` 行和 `p` 列。数据表包含 `p` 列（变量）和 `n` 行（观测值）。如果行数非常巨大，则可以使用子集。在这两种情况下，扫描颜色编码都比扫描数值要容易得多，也快得多。请注意，热图在检查大量数值时非常有用，但它们不能替代更精确的图形化显示（如柱状图），因为人类无法准确地感知颜色差异。\n\
  \n相关性矩阵热图的示例见图 3.4，它显示了 13 个变量（`MEDV` 和 12 个预测变量）之间所有的两对相关性。颜色越深对应于越强的（正或负）相关性。可以很容易地快速发现高低相关性。\n\
  \n![表格显示了 CRIM, ZN, INDUS, CHAS, NOX, RM, AGE, DIS, RAD, TAX, PTRATIO, LSTAT, MDEV,\
  \ 和 CAT.MDEV 的标记。](img/c03f004.jpg)\n\n图 3.4 相关性矩阵热图。较深的值表示更强的相关性\n\n|  \n\n```\n\
  \ code for creating Figure 3.4\n```\n\n |\n\n|  \n\n```\n### 相关性热图（不带数值）\nheatmap(cor(housing.df),\
  \ Rowv = NA, Colv = NA)\n\n### 带有数值的热图\nlibrary(gplots)\nheatmap.2(cor(housing.df),\
  \ Rowv = FALSE, Colv = FALSE, dendrogram = \"none\", \n          cellnote = round(cor(housing.df),2),\
  \ \n          notecol = \"black\", key = FALSE, trace = 'none', margins = c(10,10))\n\
  \n# 使用 ggplot 的替代绘图\nlibrary(ggplot2)\nlibrary(reshape) # 为绘图生成输入\ncor.mat <- round(cor(housing.df),2)\
  \ # 四舍五入的相关性矩阵\nmelted.cor.mat <- melt(cor.mat)\nggplot(melted.cor.mat, aes(x =\
  \ X1, y = X2, fill = value)) + \n  geom_tile() + \n  geom_text(aes(x = X1, y = X2,\
  \ label = value))\n```\n\n |\n\n在缺失值热图中，行对应记录，列对应变量。我们对原始数据集使用二进制编码，其中 1 表示缺失值，否则为\
  \ 0。然后对这个新的二进制表进行染色，使得只有缺失值单元（值为 1）被着色。图 3.5 显示了一个具有超过 1000 列的数据集的缺失值热图示例。数据包括关于全球不同国家的经济、社会、政治和“福祉”信息（每行代表一个国家）。变量是从多个来源合并而来的，对于每个来源，信息并非在每个国家都可用。缺失数据热图有助于可视化合并数据文件中“缺失性”的程度和数量。某些“缺失”模式很容易显现：几乎所有观测值都缺失的变量，以及缺失许多值的行（国家）簇。缺失值较少的变量也是可见的。这些信息随后可以用于确定如何处理缺失值（例如，删除某些变量、删除某些记录、插补或通过其他技术）。\n\
  \n![图表显示了缺失值的热图，颜色表示缺失值。](img/c03f005.jpg)\n\n图 3.5 数据集中缺失值的热图。黑色表示缺失值\n\n|  \n\n\
  ```\n code for generating a heatmap of missing values\n```\n\n |\n\n|  \n\n```\n\
  # 将 dataFrame 替换为你的数据。\n# is.na() 返回一个布尔值（TRUE/FALSE）输出，指示缺失值的位置。\n# 将布尔值乘以 1 将输出转换为二进制（0/1）。\n\
  heatmap(1 * is.na(dataFrame), Rowv = NA, Colv = NA)\n```\n\n |\n\n## 3.4 多维可视化\n\
  \n基础图表可以通过颜色、大小和多个面板等特征，以及通过启用缩放、聚合和交互等操作，传递更丰富的信息。这些增强允许我们一次观察一个或多个变量。这些新增内容的优之处在于它们能够以易于理解的方式显示复杂信息。有效的特征基于对视觉感知如何运作的理解（讨论请参见\
  \ Few (2009)）。目的是让信息更易于理解，而不仅仅是将数据表示在更高维度上（例如通常无效的三维图视化）。\n\n### 添加变量：颜色、大小、形状、多个面板和动画\n\
  \n为了在图中包含更多变量，我们必须考虑要包含的变量类型。为了表示额外的类别信息，最好的方法是使用色调、形状或多个面板。对于额外的数值信息，我们可以使用颜色强度或大小。时间信息可以通过动画添加。\n\
  \n将额外的类别和/或数值变量整合到基础（以及分布）图中，意味着我们现在可以将所有这些变量用于执行预测和分类任务。例如，我们可以使用色调、形状或多个面板来表示额外的类别信息。对于额外的数值信息，我们可以使用颜色强度或大小。时间信息可以通过动画添加。\n\
  \n将额外的类别和/或数值变量整合到基础（以及分布）图中，意味着我们现在可以将所有这些变量用于执行预测和分类任务。例如，我们可以使用色调、形状或多个面板来表示额外的类别信息。对于额外的数值信息，我们可以使用颜色强度或大小。时间信息可以通过动画添加。\n\
  \n\n\n\n\n在预测语境下，颜色编码支持探索数值结果（在 `y`-轴上）与数值预测变量之间的条件关系。颜色编码的散点图有助于评估是否有创建交互项的必要性（例如，`MEDV`\
  \ 与 `LSTAT` 之间的关系对于靠近与远离河流的房屋是否不同？）。\n\n颜色也可以用于将更多的类别变量包含在柱图中，只要类别数量较少。当类别数量很多时，更好的替代方案是使用多面板。创建多面板（也称为“分面”）是通过根据类别变量对观测值进行分割，并为每个类别创建一个独立的（相同类型的）图来实现的。图\
  \ 3.6 的右面板显示了一个示例，其中按 `RAD` 分类的平均 `MEDV` 柱状图根据 `CHAS` 分成了两个面板。我们看到，对于不同的公路可达性水平（`RAD`），平均\
  \ `MEDV` 在靠近河流的房屋（下方面板）与远离河流的房屋（上方面板）之间表现不同。这在 `RAD = 1\\.` 时尤为显著。我们还看到在 `RAD` 级为\
  \ 2、6 和 7 时没有靠近河流的房屋。此类信息可能会引导我们在 `RAD` 和 `CHAS` 之间创建一个交互项，并考虑对 `RAD` 中的某些分箱进行合并。这些探索对于预测和分类都是有用的。\n\
  \n一种使用多面板散点图的特殊图是*散点图矩阵*。其中，所有两对散点图显示在一个显示器。矩阵散点图中的面板以特殊方式组织，使得每列和每行都对应一个变量，从而交叉产生所有可能的两对散点图。散点图矩阵在无监督学习中用于研究数值变量之间的关联、检测异常值和识别聚类。对于监督学习，它可以用于检查预测变量之间的两两关系（性质），以支持变量转换和变量选择（见第\
  \ 4 章中的相关性分析）。对于预测，它也可以用于描绘结果与数值预测变量的关系。\n\n![Graph shows CRIM, INDUS, LSTAT, MEDV\
  \ from 0 to 75, 0 to 20, 0 to 30, and 10 to 50 versus MEDV, LSTAT, INDUS, and CRIM\
  \ from 10 to 50, 0 to 30, 0 to 20, and 0.0 to 0.3.](img/c03f007.jpg)\n\n**图 3.7**\
  \ `MEDV` 和三个数值预测变量的散点图矩阵\n\n|  \n\n```\n code for creating Figure 3.7\n```\n\n |\n\
  \n|  \n\n```\n### simple plot\n# use plot() to generate a matrix of 4X4 panels with\
  \ variable name on the diagonal, \n# and scatter plots in the remaining panels.\n\
  plot(housing.df[, c(1, 3, 12, 13)])\n\n# alternative, nicer plot (displayed)\nlibrary(GGally)\n\
  ggpairs(housing.df[, c(1, 3, 12, 13)])\n```\n\n |\n\n散点图矩阵的示例所示在图 3.7 中，包含 `MEDV`\
  \ 和三个预测变量。对角线下方是散点图。变量名称表示 `y`-轴变量。例如，底行的所有图在 `y`-轴上都为 `MEDV`（这允许研究单个结果与预测变量之间的关系）。我们可以从不同的形状看到不同类型的关系（例如，`MEDV`\
  \ 与 `LSTAT` 之间的指数关系，以及 `CRIM` 与 `INDUS` 之间高度偏斜的关系），这可能表明需要转换。在对角线处，由于涉及单个变量，显示的是该变量的频率分布。对角线上方是对应两个变量的相关系数。\n\
  \n一旦使用了色调，就可以通过形状和多面板添加更多的类别变量。然而，添加多个变量时必须谨慎，因为显示可能会变得过度拥挤，导致视觉感知失效。\n\n通过大小添加数值变量在散点图中特别有用（从而创建“气泡图”），因为在散点图中，点代表单个观测值。在聚合观测值的图中（如箱线图、直方图、柱图），通常不包含大小。\n\
  \n最后，通过动画可以在图中添加时间维度，显示信息随时间的变化。一个著名的例子是 Rosling 的动画散点图，展示了世界人口统计随多年来的变化（[www.gapminder.org](http://www.gapminder.org)）。然而，虽然这类动画对于“统计叙事”有效，但它们对于数据探索并不非常有效。\n\
  \n### 操作：重标、聚合与层次结构、缩放、过滤\n\n数据挖掘项目的大部分时间花在预处理上。通常，需要花费大量精力将所有数据转换为可以在数据挖掘软件中实际使用的格式。还需要花费额外时间处理数据以提高数据挖掘程序的性能。数据挖掘中的此预处理步骤包括变量转换和新变量生成，以帮助模型更有效地运行。转换包括改变变量的数值比例、对数值变量分箱以及合并类别变量中的类别。以下操作支持预处理步骤以及对合适数据挖掘方法的选择。它们通过揭示模式及其性质来实现这一点。\n\
  \n### 重标\n\n更改显示中的比例可以增强图表并阐明关系。例如，在图 3.8 中，我们看到了将散点图（顶部）和 `y`-轴（底部）的轴改为对数（`log`）比例的影响。原始图（左侧）难以理解，而在对数比例下，模式变得可见。在箱线图中，向\
  \ `x`-轴的拥挤使得我们无法比较两个箱体。\n\n\n\n\n另一种非常有用的缩放操作是更改聚合级别。对于时间尺度，我们可以按照不同的粒度（例如，按月、天、小时）进行聚合，甚至根据感兴趣的“季节性”因素（如月份或星期）进行聚合。时间序列中常用的聚合方法是移动平均法，即绘制给定窗口大小内邻近值的平均值。移动平均图有助于可视化全局趋势（参见第\
  \ 16 章）。\n\n如果存在某些有意义的层级结构，非时间变量也可以进行聚合：地理上的（波士顿住房示例中邮政编码内的区块）、组织上的（单位内部门内的人员）等。图\
  \ 3.9 展示了铁路客运时间序列的两种聚合类型。原始的度序列显示在左上面板。右上面板显示了季节性聚合（按月份），可以很容易地看到 7 月至 8 月的客运高峰以及\
  \ 1 月至 2 月的低谷。右下面板显示了时间聚合，此时序列现在以年度聚合的形式显示。该图揭示了客运量的全局长期趋势，以及从 1996 年起总体呈上升的趋势。\n\
  \n检查不同的尺度、聚合或层级结构有助于支持监督和无监督任务，因为它们可以揭示不同级别的模式和关系，并能提供一组新的变量用于工作。\n\n![图显示了 1992\
  \ 年到 2004 年以及 1991.0 到 1992.5 对比 1400 到 2200 的客运量，另一图显示了 1 月到 11 月以及 1992 年到 2002\
  \ 年对比 1400 到 2200 的平均客运量。](img/c03f009.jpg)\n\n图 3.9 使用不同聚合（右侧面板）、添加曲线（左上面板）和缩放（左下面板）的时间序列线图\n\
  \n|  \n\n```\n code for creating Figure 3.9\n```\n\n |\n\n|  \n\n```\nlibrary(forecast)\n\
  Amtrak.df <- read.csv(\"Amtrak data.csv\")\nridership.ts <- ts(Amtrak.df$Ridership,\
  \ start = c(1991, 1), end = c(2004, 3), freq = 12)\n\n### fit curve\nridership.lm\
  \ <- tslm(ridership.ts ~ trend + I(trend²))\nplot(ridership.ts, xlab = \"Year\"\
  , ylab = \"Ridership (in 000s)\", ylim = c(1300, 2300))\nlines(ridership.lm$fitted,\
  \ lwd = 2)\n### alternative plot with ggplot\nlibrary(ggplot2)\nggplot(Amtrak.df,\
  \ aes(y = Ridership, x = Month, group = 12)) +\n  geom_line() + geom_smooth(formula\
  \ = y ~ poly(x, 2), method= \"lm\",\n    colour = \"navy\", se = FALSE, na.rm =\
  \ TRUE)\n\n### zoom in, monthly, and annual plots\nridership.2yrs <- window(ridership.ts,\
  \ start = c(1991,1), end = c(1992,12))\nplot(ridership.2yrs, xlab = \"Year\", ylab\
  \ = \"Ridership (in 000s)\", ylim = c(1300, 2300))\nmonthly.ridership.ts <- tapply(ridership.ts,\
  \ cycle(ridership.ts), mean)\nplot(monthly.ridership.ts, xlab = \"Month\", ylab\
  \ = \"Average Ridership\",\n    ylim = c(1300, 2300), type = \"l\", xaxt = 'n')\n\
  ### set x labels\naxis(1, at = c(1:12), labels = c(\"Jan\",\"Feb\",\"Mar\", \"Apr\"\
  ,\"May\",\"Jun\",\n                                \"Jul\",\"Aug\",\"Sep\",  \"\
  Oct\",\"Nov\",\"Dec\"))\n\nannual.ridership.ts <- aggregate(ridership.ts, FUN =\
  \ mean)\nplot(annual.ridership.ts, xlab = \"Year\", ylab = \"Average Ridership\"\
  ,\n    ylim = c(1300, 2300))\n```\n\n |\n\n### 缩放与和平\n\n在图表对数据的某些区域进行放大和缩小的能力对于揭示模式和离群点至关重要。我们通常对信息密集区域或特别感兴趣的区域更多细节。和平是指将缩放窗口移动到其他区域的操作（在\
  \ Google Maps 等地图应用中很常见）。缩放的一个示例可见图 3.9 的左下面板，其中客运序列被放大到了序列的前两年。\n\n缩放和平移通过检测不同行为的区域来支持监督和无监督方法，这可能会导致新的交互项、新变量，甚至为数据子集创建单独的模型。此外，缩放和平移有助于在假设全局行为的方法（例如回归模型）和数据驱动的方法（例如指数平滑预测器和\
  \ `k`-最近邻分类器）之间进行选择，并指示全局/局部行为的水平（如 `k`-最近邻中的参数 `k`、树的大小或指数平滑中的平滑参数等所示）。\n\n###\
  \ 过滤\n\n过滤意味着移除某些观测值。\n\n### 参考文献：趋势线与标签\n\n趋势线和标签有助于可视化模式。在拥挤的图中，可以使用 `label` 或\
  \ `text` 来识别聚类。\n\n### 扩展到大型数据集\n\n当观测值（行数）很多时，显示每个单独观测值的图（例如散点图）可能会变得无效。除了使用箱线图等聚合图外，其他替代方案包括：\n\
  \n1.  采样——抽取随机样本并用于绘图\n2.  减小标记尺寸\n3.  使用更透明的标记颜色并移除填充\n4.  将数据拆分为子集（例如通过创建多个面板）\n\
  5.  使用聚合（例如气泡图，其大小对应于特定范围内观测值数量）\n6.  使用抖动（通过添加少量噪声来轻微移动每个标记）\n\n\n\n\n\n第 12 章中的图\
  \ 12.2 展示了在大型数据集上绘制样本的优势示例，该图中将 5000 条记录的散点图与样本的散点图并排绘制。这些图是在 Excel 中生成的。图 3.11\
  \ 展示了通过更小的标记、使用抖动（jittering）来揭示重叠点以及更透明的颜色，对完整数据集进行的改进绘图。我们可以看到，图表的大部分区域被灰色类别占据，黑色类别主要在右侧，而右上区域存在大量重叠。\n\
  \n![图显示了 10 到 200 的收入与 0.1 到 10.0 的 CCAvg 的关系。](img/c03f011.jpg)\n\n图 3.11 减小标记尺寸、使用抖动和更透明着色的后的大型数据集散点图\n\
  \n```\n用于创建图 3.11 的代码\n```\n\n```r\n# 使用 library scales 中的函数 alpha() 添加透明颜色\nlibrary(scales)\n\
  plot(jitter(universal.df$CCAvg, 1) ~ jitter(universal.df$Income, 1),\n    col =\
  \ alpha(ifelse(universal.df$Securities.Account == 0, \"gray\", \"black\"), 0.4),\n\
  \    pch = 20, log = 'xy', ylim = c(0.1, 10),\n    xlab = \"Income\", ylab = \"\
  CCAvg\")\n### 使用 ggplot 的替代方案\nlibrary(ggplot2)\nggplot(universal.df) +\n  geom_jitter(aes(x\
  \ = Income, y = CCAvg, colour = Securities.Account)) + \n  scale_x_log10(breaks\
  \ = c(10, 20, 40, 60, 100, 200)) +\n  scale_y_log10(breaks = c(0.1, 0.2, 0.4, 0.6,\
  \ 1.0, 2.0, 4.0, 6.0)) \n```\n\n### 多变量图图：平行坐标图\n\n在二维图中呈现多维信息的另一种方法是使用专门的图表，如 `parallel\
  \ coordinates plot`（平行坐标图）。在此图中，为每个变量绘制一条垂直轴。然后，每个观测值通过绘制一条连接其在不同轴上值的线来表示，从而创建一个“多变量特征”。图\
  \ 3.12 显示了一个针对波士顿房价数据的示例。在此显示中，使用了两个独立的面板分别对应 `CAT.MEDV` 的两个值，以便比较两类房屋的特征（用于分类任务）。我们看到，与廉价房屋（顶部面板）相比，昂贵的房屋（底部面板）始终具有低\
  \ `CRIM`、低 `LSAT` 和高 `RM`，而廉价房屋在 `CRIM` 和 `LSAT` 上混合较多，且 `RM` 处于中等水平。这一观察指示了有用的预测变量，并建议对某些数值预测变量进行可能的分箱（binning）。\n\
  \n![图表显示 CAT.MEDV 等于 0 且 CRIM, ZN, INDUS, CHAS, NOX, RM, AGE, DIS, RAD, TAX, PTRATIO,\
  \ LSTAT 和 MEDV 刻度上等于 1。](img/c03f012.jpg)\n\n图 3.12 波士顿房价数据的平行坐标图。每个变量（显示在水平轴上）都缩放为\
  \ 100%。\n\n```\n用于创建图 3.12 的代码\n```\n\n```r\nlibrary(MASS)\npar(mfcol = c(2,1))\n\
  parcoord(housing.df$CAT..MEDV == 0, -14], main = \"MEDV = 0\")\nparcoord(housing.df$CAT..MEDV\
  \ == 1, -14], main = \"MEDV = 1\")\n```\n\n平行坐标图在无监督任务中也有用。它们可以揭示类、离群值以及跨变量的信息。一种实用的操作是重新排序列以更好地显示类。\n\
  \n### 交互式可视化\n\n与数据挖掘过程的交互性质类似，交互性是增强我们从图形可视化获取信息能力的关键。正如数据可视化专家 Stephen Few（Few,\
  \ 2009）所说：\n\n> 当盯着像打印图表之类的静态可视化内容时，我们能学到的东西是有限的……如果我们不与数据交互……我们就会碰壁。\n\n我们所说的交互式可视化是指支持以下内容的接口：\n\
  \n1. 对图表的修改是`容易、快速且可逆的`。\n2. 多个并发的图表和表格可以轻松组合并显示在单个屏幕上。\n3. 一组可视化图可以关联起来，使得一个显示中的操作会反映在另一个显示中。\n\
  \n让我们考虑几个例子，对比静态绘图生成器（例如 Excel）与交互式可视化：\n\n- **直方图分箱 (Histogram binning)**：考虑对数值变量进行分箱并使用直方图来实现此目的的需求。静态直方图需要为每个新的分箱选择重新绘制。如果用户生成了多个图，屏幕会变得杂乱。如果重新创建同一张图，则很难比较不同的分箱。相比之下，交互式可视化将提供一种易于交互式更改宽度的方法（例如，参见图\
  \ 3.13 直方图下方的滑块），然后自动更新。\n\n- **聚合与缩放 (Aggregation and Zooming)**：考虑在一个时间序列预测任务中，给定一组数据。静态绘图需要多个层级的时间聚合（例如将每日数据聚合为每周）。缩放需要手动更改轴上的最小最大值（从而失去了在不同区域间移动的能力）。交互式可视化将提供用户可以轻松切换的即时层级结构。通过滑块（例如图\
  \ 3.13 左上角的滑块）实现缩放。\n\n- **合并单个屏幕的多个关联图表 (Combining Multiple Plots That Fit in a\
  \ Single Screen)**：为了支持分类任务，创建了结果变量与潜在类别及数值预测变量的多个图。这些可以包括箱图、彩色散点图和多面板条形图。用户希望通过选择数据的子集（例如某个变量类别）来检测可能的多维关系（并识别离群值）。在静态接口中，用户必须手动组织图表并调整大小以适应单个屏幕。静态接口通常不支持图间关联，即使支持，每次做出选择时也必须重新生成整个图集。相比之下，交互式可视化提供了一种易于自动组织并调整图集大小以适应屏幕的方法。图集的关联将很容易的，当用户对其中一个图做出选择时，其他图中的相应选择将自动高亮（参见图\
  \ 3.13）。\n\n![窗口显示了从 4 到 8.5 的 RM 与 0 到 35 的 LSTAT 的关系，CHAS 从 0 到 1 以及 MEDV 从 5\
  \ 到 50，以及从 0.01 到 40 的 CRIM 与 10 到 50 的 MEDV 的关系，条形图显示 MEDV 从 5.00 到 50.00 与计数从\
  \ 0 到 120 的关系。](img/c03f013.jpg)\n\n图 3.13 单视图中的多个关联图（使用 Spotfire）。注意左上面板中标记的观测值，它在所有其他图中都被高亮了。\n\
  \n\n\n\n\n与图表交互并将它们关联起来的能力，使绘图变成了一种支持数据持续探索的分析工具。一些商业可视化工具提供了了这方面的强大功能；其中两个非常流行的工具是\
  \ Spotfire ([`spotfire.tibco.com`](http://spotfire.tibco.com)) 和 Tableau ([www.tableausoftware.com](http://www.tableausoftware.com))；图\
  \ 3.13 是使用 Spotfire 生成的。\n\nTableau 和 Spotfire 投入了数亿美元软件研发，并通过与客户的交互评审来精炼界面，使分析师能够顺畅、高效地通过图表与数据进行交互。在\
  \ R 等编程语言中，很难复制为了快速切换数据不同探索视图而所需的、复杂且经过高度工程化的用户界面。然而，这种需求是存在的，R 社区正在致力于提供图表交互的能力。JavaScript\
  \ 在 Web 开发中的广泛应用促使一些程序员为 JavaScript 绘图工具（如 Highcharts 和 Plotly）提供 R 封装。请参见 http://flowingdata.com/2016/10/21/interactive-charts-in-r/\
  \ 中的“R 中的交互图表”。来自 RStudio Hadley Wickham 的工具 `ggvis` 也为 R 图表提供了交互功能。在本文写作期间，R 的交互工具正在演进，R\
  \ 程序员可能会看到更多、层次更高的工具，这些工具将允许他们快速开发出自定义的交互图表，这些图表可以由组织内的其他非编程分析师部署和使用。\n\n![图表显示了\
  \ EBay 卖家、买家、节点交易数量以及卖家-买家对之间交易数量的图。](img/c03f014.jpg)\n\n**图 3.14** eBay 施华奇奇卖家（黑色圆圈）和买家（灰色圆圈）的网络图。圆圈的大小代表节点的交易数量。线宽代表该卖家-买家对之间的交易次数。\n\
  \n|  \n\n```\n code for creating Figure 3.14\n```\n\n |\n\n|  \n\n```\nlibrary(igraph)\n\
  ebay.df <- read.csv(\"eBayNetwork.csv\")\n\n# transform node ids to factors\nebay.df[,1]\
  \ <- as.factor(ebay.df[,1])\nebay.df[,2] <- as.factor(ebay.df[,2])\n\ngraph.edges\
  \ <- as.matrix(ebay.df[,1:2])\ng <- graph.edgelist(graph.edges, directed = FALSE)\n\
  isBuyer <- V(g)$name %in% graph.edges[,2]\n\nplot(g, vertex.label = NA, vertex.color\
  \ = ifelse(isBuyer, \"gray\", \"black\"), \n     vertex.size = ifelse(isBuyer, 7,\
  \ 10))\n```\n\n |\n\n## 3.5 特殊可视化\n\n在本节中，我们提到了能够捕捉标准时间序列和横截结构之外的数据结构的几种特殊可视化——这些特殊关系通常很难通过普通图表来捕捉。特别是，我们讨论了层次数据、网络数据和地理数据这三种日益丰富的数据类型。\n\
  \n### 网络数据可视化\n\n网络分析技术起源于社交和产品网络数据的爆炸。社交网络的示例是 eBay 上的卖家买家网络以及 Facebook 上的用户网络。产品网络的示例是\
  \ Amazon 上的网络（通过推荐系统连接）。网络数据可视化可见于各种专门的网络软件，也可见于通用软件。\n\n网络图由参与者和它们之间的关系组成。“节点”是参与者（例如社交网络中的用户或产品网络中的产品），并用圆圈表示。“边”是节点之间的关系，用连接节点的线表示。例如，在\
  \ Facebook 这样的社交网络中，我们可以构建一个用户（节点）列表以及所有“朋友”用户之间两两对的关系（边）。或者，我们可以将边定义为一个用户在另一位用户的\
  \ Facebook 页面上发布的帖子。在在这种设置中，两个节点之间可能存在多条边。网络也可以具有多种类型的节点。一种常见的结构是具有两种类型节点的网络。双类型节点网络的示例如图图\
  \ 3.14 所示，其中我们看到了在线拍卖网站 [www.eBay.com](http://www.eBay.com) 上卖家和买家网络之间的一系列交易（数据来自销售施华奇奇水晶钻的拍卖，发生在几个月的时间内；来自\
  \ Jank and Yahav (2010)）。黑色圆圈代表卖家，灰色圆圈代表买家。圆圈的大小代表该节点（卖家或买家）在此网络中参与的交易次数。线宽代表出价者-卖家对交互的拍卖次数。我们可以看到这个市场由三个或四个高交易卖家主导。我们还可以看到许多买家与单个卖家交互。通过这种方式可以快速查看许多单个产品的市场结构。网络提供者可以使用这些信息，例如，识别可以与卖家探索的可能合作伙伴关系。\n\
  \n图 3.14 是使用 R 的 `igraph` 包生成的。另一个有用的包（特别是对于社交网络分析）是 `sna`。使用这些包，可以从 Twitter 和 Facebook\
  \ 等社交网络网站导入网络。图的外观可以自定义，并提供各种功能，如过滤节点和边、3D 可视化。\n\n\n\n\n我们在图表操作的语境下讨论了层次数据以及在不同层次层级上对数据进行探索。`Treemaps`（树状图）是用于探索具有层次结构（树形结构）的大型数据集的有效可视化工具。它们允许在保持数据层次结构特性的同时，探索数据的各个维度。图\
  \ 3.15 中的一个示例展示了来自 eBay.com 的大型拍卖数据集，^(4)该数据按物品类别、子类别和品牌进行了层次化排序。树状图层次中的各个层级被可视化为包含子矩形的矩形。通过使用\
  \ `hue` 可以在显示中包含类别变量。可以通过矩形的大小和颜色强度（饱和度）来包含数值变量（有时会使用矩形的排列顺序来强化尺寸效果）。在图 3.15 的示例中，尺寸代表平均收盘价（反映了物品价值），颜色强度代表具有负面反馈的卖家的百分比（负面卖家反馈表明买家在过去的交易中不满意，通常是卖家欺诈行为的指标）。考虑根据欺诈结果对正在进行的拍卖进行分类的任务。从树状图中，我们看到具有负面评分卖家（黑色）的比例最高集中在昂贵物品的拍卖（劳力士和卡地亚亚手表）中。\n\
  \n理想情况下，树状图应该通过交互式方式进行探索，缩放到层次结构的不同层级。树状图的交互式在线应用的一个示例目前可以在 [www.drasticdata.nl](http://www.drasticdata.nl)\
  \ 获取。他们的树状图示例之一显示了 2014 年世界杯的球员级数据，并聚合到团队级别。用户可以选择探索球员和团队数据。\n\n![Graph shows map\
