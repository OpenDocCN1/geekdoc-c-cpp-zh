  \ 获取）包含了 1302 所提供本科课程的美国学院大学的信息。对于每所大学，有 17 项测量值，包括连续测量（如学费和毕业率）和分类测量（如按州划分以及是否为私立或公立学校）。\n\
  \n\n\n\n注意，许多记录缺少了一些测量值。我们的首要目标是从“相似”记录中估计这些缺失值。这将通过对完整记录进行聚类，然后为每个部分记录找到最近的类来实现。缺失值将根据该类中的信息进行插补。\n\
  \n1. 从数据集中删除所有缺失测量值的记录。\n2. 针对所有连续测量值，使用完全链法（complete linkage）和欧式距离（Euclidean distance）运行层次聚类。确保对测量值进行归一化处理。从聚类图（dendrogram）：描述这些数据，分成几类看起来比较合理？\n\
  3. 比较每个类的汇总统计数据，并结合此背景描述每个类（例如，“学费高、录取率低的大学……”）。*提示提示*：若要获取层次聚类的聚类统计数据，请使用 `aggregate()`\
  \ 函数。\n4. 使用未在分析过的分类变量（州和私立/公立）来表征不同的类。聚类与分类信息之间是否存在任何关系？\n5. 还有哪些外部信息可以解释这些类中部分或全部的内容？\n\
  6. 考虑特特夫斯大学（Tufts University），它缺少一些信息。计算该记录与你上面找到每个类之间的欧式距离（仅使用你拥有的测量值）。它最接近哪个类？通过取该类在这些测量值上的平均值来插补特大学的缺失值。\n\
  \n## 2. 制药行业\n\n一名股票分析师正在研究制药行业，并希望你帮助探索和理解她公司收集的财务数据。她的主要目标是使用一些基本的财务指标理解制药行业的结构。\n\
