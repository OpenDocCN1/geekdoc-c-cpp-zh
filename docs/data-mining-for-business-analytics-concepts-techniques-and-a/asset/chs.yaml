  \ 交易数据的分位数提升图\n\n5. 需要检查大量的保险记录，以开发一个预测欺诈理赔的模型。在历史数据库的理赔中，1% 的理赔被判定为欺诈。选取了一个样本来开发模型，并考虑到极低的响应率，使用了过采样来提供平衡样本。当应用于该样本（`n`\
  \ = 800）时，模型最终正确分类了 310 笔欺诈和 270 笔非欺诈。它漏掉了 90 笔欺诈，并将 130 笔非欺诈记录错误地分类为欺诈。\n\n   \
