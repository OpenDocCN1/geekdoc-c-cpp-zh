  \ R 中的数据划分\n\n### 交叉验证 (Cross-Validation)\n当样本中的记录较少时，数据划分可能并不合适，因为每个划分包含的记录不足以构建模型和评估。数据划分的替代方案是交叉验证，它对于小样本特别有用。交叉验证是一种将数据划分为“折”（folds）即不重叠的子样本的程序。我们通常选择\
  \ `k=5` 折，这意味着将数据随机划分为 5 份，每份包含 20% 的观测值。然后拟合 `k` 次模型。每次使用其中一个折作为验证集，其余的 `k-1` 折作为训练集。结果是每个折都曾作为一次验证集，从而对数据集中的每个观测值产生预测。然后我们可以合并在\
  \ `k` 个验证集上的模型预测结果，以评估模型的整体性能。\n\n\n\n\n\n让我们通过一个熟悉的流程：多元线性回归，来回顾许多数据挖掘任务的典型步骤。这将帮助你在开始处理新算法之前，理解整体流程。\n\
  \n### 建模过程\n\n我们现在通过 West Roxbury 房屋价值的示例，详细描述各个模型阶段。\n\n1. **确定目的**。假设我们数据挖掘项目的目的是为了预测\
  \ West Roxbury 新记录的房屋估估值。\n\n2. **获取数据**。我们将使用 2014 年的 West Roxbury 房屋数据。该数据集足够小，我们不需要对其进行采样——可以直接使用其全部数据。\n\
  \n3. **探索、清洗和预处理数据**。让我们先看一眼变量的描述（也称为“数据字典”），以确保我们理解了所有变量。这些描述可以在 Excel 文件中的“description”工作表中找到，也可以在表\
  \ 2.2 中查看到。该数据集中的变量名和描述看起来都非常直观，但情况并非总是如此。通常，变量名可能是晦涩的，其描述可能不明或缺失。\n\n   停下来思考一下变量的含义以及它们是否应该包含在模型中是有很有用的。考虑变量\
  \ `TAX`。初看之下，我们认为房屋税通常是其估算值的函数，因此模型中存在某种循环性——我们想用 `TAX` 作为预测变量来预测房屋价值，但 `TAX` 本身是由房屋价值决定的。从数值意义上说，`TAX`\
  \ 是房屋价值的一个很好的预测指标，但如果我们想将模型应用到可能未知估值的房屋上，它还会有用吗？出于这个原因，我们从分析中排除 `TAX`。\n\n   检查可能属于错误的离群值也是很有用的。例如，假设在根据层数降序排序后，`FLOORS`（层数）列看起来像表\
  \ 2.10 所示。\n\n   我们一眼就能看出 15 是错误的——房屋不太可能有 15 层。由于其他所有值都在 1 到 2 之间，小数点可能放错了位置，该值应该是\
  \ 1.5。\n\n   最后，我们为分类变量创建虚拟变量。这里有一个分类变量：`REMODEL`，它有三个类别。\n\n4. **降低数据维度**。West\
  \ Roxbury 数据集在准备展示时维度已经相当低——它只有 13 个变量，且考虑的单个分类变量只有三个类别（因此在线性回归模型中使用时会增加两个虚拟变量）。如果我们有更多变量，在这一阶段我们可能应用变量归约技术，例如将多个类别合并为较少数量，或者应用主成分分析将多个相似的数值变量（例如\
  \ `LIVING AREA`、`ROOMS`、`BEDROOMS`、`BATH`、`HALF BATH`）合并为少数几个变量。\n\n5. **确定数据挖掘任务**。具体任务是使用预测变量预测\
  \ `TOTAL VALUE`。这是一个监督预测任务。为了简单起见，我们排除了原始数据集中具有许多类别的额外变量（`BLDG TYPE`、`ROOF TYPE`\
  \ 和 `EXT FIN`）。因此，我们使用了所有的数值变量（`TAX` 除外）以及为剩余分类变量创建的虚拟变量。\n\n6. **划分数据（监督任务）**。在这种情况下，我们将数据分为两个部分：训练集和验证集（参见表\
  \ 2.9）。训练集用于构建模型，验证集用于查看模型在应用于新数据时的表现如何。我们需要指定用于每个部分的数据百分比。\n\n   *注意*：虽然在我们的示例中没有用到，但也可以使用测试集。\n\
  \n7. **选择技术**。在这种情况下，是多元线性回归。将数据划分为训练和验证部分后，我们可以使用训练数据构建多元线性回归模型。我们希望根据所有其他预测变量（`TAX`\
  \ 除外）预测 West Roxbury 房屋的价值。\n\n8. **使用算法执行任务**。在 R 中，我们使用 `lm()` 函数通过训练数据预测房屋价值，然后使用相同的模型预测验证数据的值。第\
  \ 6 章关于线性回归将进行更详细的介绍。表 2.11 显示了训练集中前几记录的预测值以及实际值和残差（预测误差）。注意，预测值通常被称为*拟合值*（fitted\
  \ values），因为它们是针对模型拟合的记录。验证集的结果显示在表 2.12 中。训练集和验证集的预测误差在表 2.13 中进行了。\n\n   预测误差可以通过多种方式聚合。表\
  \ 2.13 显示了五种常见衡量方法。第一个是`mean error (ME)`，简单来说残差（误差）的平均值。在两种情况下，它相对于 `TOTAL VALUE`\
  \ 的单位都非常小，这表明平均而言，预测大致是正确的——我们的预测是“无偏的”。当然，这仅仅意味着正负误差相互抵消了。它并没有告诉我们这些误差到底有多大。\n\n\
  \   `RMS error (RMSE)`（均方根误差）对误差的大小更具参考价值：它是平均平方误差的平方根，因此提供了与原始变量相同单位的误差概念。正如我们预期的，验证集的\
  \ RMS 误差（161.5 千美元）大于训练集的误差（约 0 千美元）。其他衡量方法将在第 5 章中讨论。\n\n9. **解释结果**。在此阶段，我们通常会尝试其他算法（例如回归树），看看它们在误差方面表现如何。我们还可以对不同的模型尝试不同的“设置”（例如，我们可以在多元线性回归中使用*最佳子集*选项来选择在验证集上可能更好的变量集）。在选择了最佳模型后（通常是验证集上误差最低的模型，同时也考虑到“简单越好”），我们使用该模型预测新数据的输出。这些步骤在案例分析中会有详细介绍。\n\
  \n10. **部署模型**。选择最佳模型后，将其应用于新数据以预测未知价值房屋的 `TOTAL VALUE`。这当然是最初的目的。对新记录预测输出值被称为*评分*（scoring）。对于预测任务，评分产生预测数值。对于分类任务，评分产生类别和/或概率。表\
  \ 2.14 显示了使用我们的线性回归模型对三个房屋进行评分的数据框示例。注意，所有的预测列都存在，但缺少输出列。\n\n| **FLOORS** | **ROOMS**\
  \ |\n| --- | --- |\n| 15 | 8 |\n| 2 | 10 |\n| 1.5 | 6 |\n| 1 | 6 |\n\n**表 2.10**\
