- "# 商业分析数据挖掘：R 语言概念、技术与应用\n\n\n\n![](img/cover.jpg)\n\n![封面页](img/cover.jpg)\n\n\n\
  \n\n\n\n### 编辑部\n\n\n\n\n*智慧的开端是：*\n*获得智慧，无论你获得其他什么，都要获得洞察。*\n\n![image](img/fded.jpg)\n\
  \n– 箴言 4:7\n\n# 第 2 章\n\n## 数据挖掘过程概述\n\n在本章中，我们概述了数据挖掘涉及的步骤，从明确的目标定义开始到模型部署。通用步骤在图\
  \ 2.1 中示意性显示。我们还讨论了与数据收集、清洗和预处理相关的问题。我们引入了数据划分的概念，即在训练数据集上训练方法，然后在另一组验证数据集上评估其性能，并解释了这种做法如何帮助避免过拟合。最后，我们通过将这些步骤应用于数据来说说明模型构建的步骤。\n\
  \n![图表显示了定义目的、获取数据、探索和清洗数据、确定 DM 任务、选择 DM 方法、应用方法并选择最终模型、评估性能和部署的标记。](img/c02f001.jpg)\n\
  \n`图 2.1` 数据建模过程示意图\n\n## 2.1 引言\n\n在第 1 章中，我们看到关于数据挖掘的一些非常通用的定义。在本章中，我们引入了有时被称为*数据挖掘*的各种方法。本书的核心关注于所谓的*预测分析*内容，即分类和预测任务，这些已成为大型企业“分析”功能的关键元素。下文描述了这些术语。\n\
  \n书中介绍了两种有时被认为是数据挖掘技术的简单数据库方法：(1) `OLAP`（联机分析处理）和 (2) `SQL`（结构查询语言）。OLAP 和数据库的搜索是描述性的，基于用户设置的业务规则（例如，“找到所有邮政编码内、年度费用超过\
  \ 20,000 美元、住房且至少 95% 的时间全额支付月账的信用卡客户”）。尽管 `SQL` 查询经常用于获取数据挖掘的数据，但它们不涉及统计建模或算法方法。\n\
  \n## 2.2 数据挖掘的核心思想\n\n### 分类\n\n分类可能是最基本的数据分析形式。优惠接收者可能响应或不响应。贷款申请人可能准时还款、逾期还款或破产。信用卡交易可能是正常的或欺诈的。网络传输的数据包可能是良性的或威胁性的。车队中的汽车可以是用的或不可用的。疾病受害者可能康复、仍在家或去世。\n\
  \n数据挖掘的一项常见任务是检查未知或未来发生分类的数据，目标是预测该分类是什么或将会是什么。使用已知分类的相似数据来开发规则，然后将这些规则应用于未知分类的数据。\n\
  \n### 预测\n\n预测与分类相似，区别在于我们试图预测的是数值变量（例如购买金额），而不是类别（例如购买者或非购买者）。当然，在分类中我们是试图预测一个类别，但书中的*预测*一词是指连续变量数值的预测。（在数据挖掘文献中，有时使用*估计*和*回归*术语来代连续变量数值的预测，而*预测*可以用于连续型和分类数据。）\n\
  \n### 关联规则和推荐系统\n\n\n\n\n大量的客户交易数据库非常适合分析购买项目之间的关联性，或者说“什么与什么配”。`关联规则`（Association\
  \ rules）或`关联性分析`（affinity analysis）旨在从大型数据库中的物品之间寻找此类通用关联模式。这些规则可以用于多种方式。例如，杂货店可以使用此类信息进行商品陈列。它们可以使用这些规则进行每周促销或产品捆绑。从医院数据库得出的患者在连续住院期间症状的关联规则，可以帮助发现“某种症状之后是其他什么症状”，从而帮助预测复诊患者的未来症状。\n\
  \n在线推荐系统，例如用于 [Amazon.com](http://Amazon.com) 和 Netflix.com 的系统，使用了`协同过滤`（collaborative\
  \ filtering）。该方法根据个人用户的历史购买、评分、浏览或任何其他指示偏好的可衡量行为，结合其他用户的历史，利用个人用户的偏好和品味。与生成适用于整个人群通用规则的`关联规则`不同，协同过滤是在个人用户层面上生成“什么与什么配对”。因此，协同过滤被用于许多推荐系统，旨在为具有广泛偏好的用户提供个性化推荐。\n\
  \n### 预测性分析\n\n分类、预测，以及在某种程度上关联规则和协同过滤构成了`预测性分析`（predictive analytics）中所采用的分析方法。预测性分析一词有时也包括聚类等数据模式识别方法。\n\
  \n### 数据削减与降维\n\n当变量数量有限且大量记录可以被归为同类组时，数据挖掘算法的性能通常会提高。例如，分析师与其处理成千上种产品类型，不如希望将它们分成较少的小组，并为每组建立单独的模型。或者，营销人员可能希望将客户分类为不同的“用户画像”（personas），因此必须将客户归分为同类组以定义这些画像。这种将大量记录（或案例）合并为较小集合的过程被称为`数据削减`（data\
  \ reduction）。减少案例数量的方法通常被称为`聚类`（clustering）。\n\n减少变量的数量通常被称为`降维`（dimension reduction）。降维是部署数据挖掘方法之前的一个常见的初始步骤，旨在提高预测能力、可管理性和可解释性。\n\
  \n### 数据探索与可视化\n\n与数据集交互的早期阶段之一是对进行探索。探索的目标是理解数据的全局布局并检测异常值。探索用于数据清洗和处理，也用于视觉发现和“假设生成”。\n\
  \n探索数据的方法包括从数值和图形方面查看各种数据聚合和摘要。这包括单独查看每个变量以及查看变量之间的关系。其目的是发现模式和异常。通过创建图表和仪表板进行的探索被称为`数据可视化`Data\
  \ Visualization）或`视觉分析`Visual Analytics）。对于数值变量，我们使用直方图和箱线图来了解其值的分布，检测离群值（极端观测），并寻找与分析任务相关的其他信息。同样，对于分类变量我们使用条形图。我们还可以查看数值变量对的散点图，以了解可能的关系及其类型，再次检测异常。通过添加颜色和交互导航等功能可以大大增强可视化。\n\
  \n### 监督学习与无监督学习\n\n数据挖掘技术之间的基本区别是监督方法和无监督方法。`监督学习算法`（Supervised learning algorithms）是用于分类和预测的。我们必须拥有数据，其中感兴趣的结果（例如购买或不购买）的值已知。此类数据被称为“标记数据”，因为它们包含每个记录的标签（结果值）。这些`训练数据`（training\
  \ data）是分类或预测算法借此“学习”或“训练”预测变量与结果变量之间关系的数据。一旦算法从训练数据学习完成，它就会被应用于另一组标记数据（`验证数据` validation\
  \ data），其中结果是已知的但最初是隐藏的，以观察其与其他模型相比的表现如何。如果正在尝试许多不同的模型，稳妥的做法是保留第三个也包含已知结果的样本（`测试数据`\
  \ test data），用于最终选定的模型以预测其表现。然后，该模型可以用于分类或预测结果未知的新案例中感兴趣的结果。\n\n简单线性回归是监督学习算法的一个示例（尽管在你可能首次遇到它的入门统计学课程中，很少被这样称呼）。`Y`\
  \ 变量是（已知的）结果变量，`X` 变量是预测变量。绘制一条回归线，使实际 `Y` 值与该线预测值之间的平方差和最小化。现在，该回归线可以为我们未知的 `X`\
  \ 的新值预测 `Y` 值。\n\n`无监督学习算法`（Unsupervised learning algorithms）是用于没有待预测或待分类的结果变量的算法。因此，不存在从已知此类结果变量的案例中进行“学习”。关联规则、降维方法和聚类技术都是无监督学习方法。\n\
  \n监督方法和无监督方法有时结合使用。例如，使用无监督聚类方法将贷款申请人分为几个风险等级组。然后，将监督算法分别应用于每个风险等级组，以预测贷款违约的倾向。\n\
  \n## 2.3 数据挖掘的步骤\n\n本书重点关注理解和使用数据挖掘算法（下文第 4 到 7 步）。然而，分析项目中一些最严重的错误源于对问题的理解不深——在我们进入要使用的算法细节之前，必须建立起这种理解。以下是典型数据挖掘工作中需要采取的步骤列表：\n\
  \n1. `建立对数据挖掘项目目的的理解。`利益相关者将如何使用结果？谁会受到结果的影响？分析是一次性的工作还是持续的程序？\n\n2. `获取用于分析的数据集。`这这通常涉及从大型数据库中进行采样，以获取用于分析的记录。该样本反映感兴趣记录的程度，影响了数据挖掘结果推广到该样本之外记录的能力。它还可能涉及从不同的数据库或来源汇总数据。数据库可以是内部的（例如客户过去的购买记录），也可以是外部的（信用评级）。虽然数据挖掘处理非常大的数据库，但通常需要进行的分析仅需要几千或几万条记录。\n\
  \n\n\n\n\n### 3. **探索、清洗和预处理数据。** 这一步涉及验证数据是否处于合理状态。如何处理缺失数据？根据你对每个变量的预期，这些值是否在合理范围内？是否存在明显的离群值？通过图表对数据进行审查：例如，使用散点图矩阵显示每个变量与其他所有其他变量之间的关系。我们还需要确保字段定义、测量单位、时间段的一致性。在这一步中，通常还会根据现有变量创建新变量。例如，可以从开始日期和结束日期计算出“持续时间”（duration）。\n\
  \n### 4. **如有必要，减少数据维度。** 降维可能涉及多种操作，如消除不需要的变量、转换变量（例如，将“花费金额”转换为“花费 > $100”与“花费\
  \ ≤ $100”）以及创建新变量（例如，记录是否购买了多个产品中的至少一个的变量）。确保你了解每个变量的含义，以及将其包含在模型中是否合理。\n\n### 5.\
  \ **确定数据挖掘任务。**（分类、预测、聚类等）。这涉及到将步骤 1 中的通用问题或议题转化为更具体的数据挖掘问题。\n\n### 6. **划分数据（针对有监督任务）。**\
  \ 如果任务是有监督的（分类或预测），则将数据集随机划分为三个部分：训练集、验证集和测试集。\n\n### 7. **选择要使用的数据挖掘技术。**（回归、神经网络、层次聚类等）。\n\
  \n### 8. **使用算法执行任务。** 这通常是一个迭代过程——尝试多个变体，并且经常使用同一算法的多个变体（在算法内部选择不同的变量或设置）。在适当的情况下，利用算法在验证集上的性能反馈来优化设置。\n\
  \n### 9. **解释算法结果。** 这涉及选择要部署的最佳算法，并在可能的情况下，在测试集上对最终选择进行测试，以了解其性能如何。（记住，每个算法也可能为了调优目的而在验证集上进行测试；通过这种方式，验证集成为了拟合过程的一部分，并且可能会低估最终选择的模型在部署时的误差。）\n\
  \n### 10. **部署模型。** 这一步涉及将模型集成到业务系统中，并在真实记录上运行，以产生决策或行动。例如，模型可以应用于一份潜在客户列表，采取的行动可能是“如果预测的购买金额\
  \ > $10，则将其列入邮件列表”。这里的关键步骤是对新记录进行“评分”，或使用所选模型预测每个新记录的输出值（“分数”）。\n\n上述步骤涵盖 SEMMA\
  \ 中的步骤，这是由软件公司 SAS 开发的一种方法论：\n\n| 样本 (Sample) | 从数据集中样本；分为训练集、验证集和测试集。 |\n| 探索 (Explore)\
  \ | 从统计和图形上检查数据集。 |\n| 修改 (Modify) | 转换变量并填补缺失值。 |\n| 模型 (Model) | 拟合预测模型（例如，回归树、神经网络）。\
  \ |\n| 评估 (Assess) | 使用验证集比较模型。 |\n\nIBM SPSS Modeler（以前称为 SPSS-Clementine）采用类似的方法，称为\
  \ CRISP-DM（数据挖掘行业标准流程）。所有这些框架都包含了预测建模中相同的主要步骤。\n\n## 2.4 预备步骤\n\n### 数据集的组织\n\n\
  数据集几乎总是这样构建和显示的：变量在列中，记录在行中。我们将以 2014 年波士顿西罗克斯里（West Roxbury）的房屋价值来进行说明。对 5000 多栋房屋记录了\
  \ 14 个变量。表格的组织方式使得每行代表一个房屋——第一栋房屋的评估价值为 $344,200，税金为 $4430，面积为 9965 英方，建成 1880 年，依此类推。在有监督学习的情况下，这些变量中的一个将是结果变量，通常列在第一列或最后一列（在本例中第一列是\
  \ `TOTAL VALUE`）。\n\n#### 预测西罗克斯里社区的房屋价值\n\n互联网彻底改变了房地产行业。房地产经纪人现在可以在网上列出房屋及其价格，房屋和公寓价格的估值已变得广泛可用，即使对于未上市的单元也是如此。在本文写作此时，Zillow（[www.zillow.com](http://www.zillow.com)）是美国最流行的在线房地产信息网站，它们在\
  \ 2014 年收购了其主要竞争对手 Trulia。到 2015 年，Zillow 已成为查询房价的主导平台，并因此成为房地产经纪人主要的在线广告场所。过去让房地产经纪人获得舒适的\
  \ 6% 佣金结构（为他们提供了丰厚的盈余，并导致经纪人供需过剩），正因在 Zillow 上支付广告费日益增长的需求而被迅速侵蚀。（事实上，这是 Zillow\
  \ 业务模式的关键——将 6% 的佣金从经纪人手中转移到自己手中。）\n\nZillow 房屋价值“Zestimates”的大部分数据直接来自公开的城市住房数据，这些数据用于估计用于收税评估的物业价值。寻求进入市场的竞争对手可能会采取相同的方法。寻求开发\
  \ Zillow 替代方案的经纪人也可能如此。\n\n简单的方法是使用幼稚的无模型方法——直接使用城市决定的评估值。然而，这些值并不一定包含所有物业，并且可能无法反映真实的市场价值。\n\
  \n让我们看看从城市获取波士顿物业数据如何被用于预测房屋价值。`Westoxbury.csv` 中的数据包含了 2014 年马萨诸塞州西罗克斯里（West Roxbury,\
  \ MA）单户家庭自住房屋的信息。数据包括各种预测变量的值，以及一个结果变量——评估值。该数据集有 14 个变量，每个变量的描述见表 2.1（波士顿市提供的数据字典可在\
  \ [`goo.gl/QBRlYF`](http://goo.gl/QBRlYF)；我们修改了一些变量名称）。该数据集包含 5802 栋房屋。\n\n\n\n\n\
  \n| **价值** | | **平方英尺** | **建造** | **面积** | **面积** | | | | **房间** | **浴室** | **浴室**\
  \ | **厨房** | **壁炉** | | |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 344.2 | 4330 | 9965 | 1880\
  \ | 2436 | 1352 | 2 | 6 | 3 | 1 | 1 | 1 | 0 | 无 |\n| 412.6 | 5190 | 6590 | 1945\
  \ | 3108 | 1976 | 2 | 10 | 4 | 2 | 1 | 1 | 0 | 最近 |\n| 330.1 | 4152 | 7500 | 1890\
  \ | 2294 | 1371 | 2 | 8 | 4 | 1 | 1 | 1 | 0 | 无 |\n| 498.6 | 6272 | 13,773 | 1957\
