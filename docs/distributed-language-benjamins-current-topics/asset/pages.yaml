    (2006) rejects Dennett’s view as ''developmental'' and posits, in its place, ‘shadow
    imagine encodings’. In the distributed view, second-order constructs are latent
    in hearing (like opportunities glimpsed as we manipulate the necklace). After
    infancy, we live in a world of virtual patterns where act as a medium through
    which computation functions enable us to use ‘reason’ to self-construct as persons
    who act, speak, and hear in accordance with their beliefs (see, Ross 2007; Cowley
    and MacDorman 2007; Cowley 2007a).'
