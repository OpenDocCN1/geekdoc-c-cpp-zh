  md: '# Ecological pragmatics


    # Values, dialogical arrays, complexity, and caring*


    Bert Hodges

    Gordon College, Wenham, MA & University of Connecticut, Storrs, CT, USA


    This paper explores the hypothesis that first-order linguistic activities are
    better understood in terms of ecological, values-realizing dynamics rather than
    in terms of rule-governed processes. Conversing, like other perception-action
    skills (e.g., driving) is constrained by multiple values, heterarchically organized.
    This hypothesis is explored in three broad approaches that contrast with models
    of language which view it as a cognitive system: (1) conversing as a perceptual
    system for exploring dialogical arrays (Hodges 2007a); as an action system for
    integrating diverse space-time scales (Van Order 2007); and (3) conversing as
    a caring system for embodying the context-sensitivity and interdependency necessary
    to realize values (Hodges 2007b). Approach-language as a caring-perception system
    leads to a reconsideration of cognitive dimensions of linguistic activities, including
    consciousness, pragmatics, suffering, and hope.


    **Keywords:** action systems, attentement, consciousness, context-sensitivity,
    ecological psychology, heterarchy, nonlinear dynamics, suffering, values


    # 1. Beyond rules


    It is widely believed that language is rule-governed, or at least, rule-following.
    A typical example is offered by Smith (1999:29): “Any native speaker of English
    knows that *I speak English fluently* and *I speak fluent English* are acceptable,
    and that *I speak fluent English is wrong*. But the example fails. One quickly
    thinks of the legitimacy of saying *I speak fluently English*, Swahili, and French.
    Smith might object that this is not the (attempted) sentence, but the reply fails
    as well, since one can say: *I speak fluently English. Swahili and French I speak
    only a little*. This two-sentence sequence — which might be a reply to a question
    about one’s fluency is not only allowable, it is elegantly stated. Only a fluent
    speaker would say such a thing.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# 136 Bert Hodges


    The point of this counterexample is not that it refutes the claim that language
    is rule-following, but that both my ability to generate a counterexample, and
    Smith''s ability to pose as an example of an improperly formed sentence in the
    first place, are dependent on something other than rules. If language were dependent
    solely on rules to function, then it would not be possible for Smith to generate
    intentionally and completely ill-formed sentence. In doing so would violate the
    rules he claims language follows. Similarly, I would have no basis for generating
    an alternative possibility. So supposedly rule-following sequences point beyond
    themselves: Our ability to speak competently and fluently requires more than rules.


    What beyond rules is required? A variety of answers might be offered to this question,
    but the one I will explore in this paper is that rule-following st point to and
    depend on values-realizing dynamics (Hodges 2007a, 2007b; Hodges and Baron 1992).
    Exploring the nature of these values-realizing dynamics will lead to a consideration
    of three broad approaches to rethinking how we should understand language.


    The first approach is to look at language as a perceptual system (Gibson 1966)
    for exploring dialogical arrays (Hodges 2007a). This will provide an opportunity
    to consider how language enables both locating and way-finding. The second approach
    is to work out what it might mean to claim language is an action system (Reed
    1982, 1996) for coordinating space-time scales (Thibault 2005). Consideration
    of the activities of speaking and listening (and/or signing and looking) will
    reveal the complexity of their dynamics, including the context-sensitivity, global
    interdependence, and non-causal nature of these dynamics. The third approach is
    to embody the concern that language is a caring system (Hodges 2007b), rather
    than (primarily) a represent system or a control system. This approach affords
    consideration of the hypothesis that conversations embody a complex set of action-perception
    skills, including the pragmatics of consciousness, that allows humans to take
    care of each other and the environments that support them.


    Before going further it is important to clarify the term language. To refer to
    language as a perception-action system for caring is to consider what has been
    called first-order language (Love 2004), or languaging (Cowley 2005). Language
    in this first-order sense is a diverse and distributed set of activities that
    involve multiple speakers over time, embedded in cultural histories that unfold
    over an array of time scales. Most of these, distributed activities are not represented
    in individual brains; they are collective phenomena. Second-order language is
    what is often seen in linguistics, which is a series of reflections on various
    stabilities across these speakers, scales, and collective activities. Various
    patterns and dependencies that have been described as phonological, syntactic,
    or semantic mean have'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'identified. The identification of these patterns and dependencies is what has
    made the “language is rule-governed” claim appearing. These patterns and dependencies
    are frequently reified, counted as codes (Kravchenko 2007; Love 2007), and located
    in individuals, so that language is treated as an acquisition of individuals or
    a property of neural modules. To avoid confusing these second-order claims with
    first-order claims, I will sometimes refer to conversing, or speaking and listening,
    or linguistic activities. On the other hand, I am unwilling to give up the term
    language as referring to first-order activities of conversing with others. In
    the traditional view, language is viewed as a system, and conversation as the
    use of that system. The argument of this paper is that language is use and that
    the use is systematic, but in ways more complex than previously assumed (i.e.,
    governed). Language as a pragmatic, first-order activity that emerges in use and
    is more extensive and more integrated (i.e., systemic) than most current cognitive
    models of language envision, will be further discussed in considering language
    as an action system.


    This article will proceed as follows: To explore language as a distributed set
    of dialogical activities (Linell 2007) — beyond rules — I first sketch an ecological
    (Gibson 1979), values-realizing approach to the nature of action and perception
    (Hodges and Baron 1992) that may be applied to language (ges 2007a). Then I will
    explore in more detail how such an ecological, values-realizing approach may be
    fleshed out, following the three avenues mentioned earlier, language as a perceptual
    system, as an action system, and as a caring system. The hope is that looking
    at linguistic activities from these varying perspectives — caring, action, perception
    — will provide an integrated view that yields a richer, more comprehensive appreciation
    of what it means to converse with others. In integrating these three perspectives,
    issues relating to consciousness and pragmatics will come to the fore, along with
    their emotional exertions.


    # 2. Ecological perception and action: Recognizing values in driving and conversing


    The theoretical framework used in this paper to consider linguistic activities
    is an ecological, values-realizing psychology, sometimes referred to as values-pragmatics
    theory. This is a general approach to psychology (Hodges 2007b; Hodges and Baron
    1992), which has been applied to issues in social psychology (Hodges 2004; Hodges
    and Geyer 2006), perception-action studies (Hodges 2007b; Hodges and Lindheem
    2006), developmental psychology (Hodges and Baron 1992), and language studies
    (Hodges 2007a). According to values-realizing theory, all actions, whether driving
    a car or conversing with a colleague, are constrained and'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'legitimated by multiple values. Values are the real goods that actions must
    realize sufficiently for an ecosystem to exist; thus, values are obligatory demands
    that define what constitutes good driving or a good conversation (Hodges 2007a
    2007b; Hodges and Baron 1992). These multiple constraints on action are often
    in tension (e.g., accuracy and safety in driving) pull may against each other;
    Hodges 2007b), but overall they work cooperatively, since each value can only
    be realized jointly with all the others (Hodges and Baron 1992).


    One of the crucial sources of values-realizing psychology is Gibson''s (1966,
    1979) ecological theory of perception with its focus on agency and affordances.
    Perceiving is an act that depends on an animal''s embodied movement and through
    various arrays (i.e., optic, cosmic) that yield information revealed through variance),
    that is sufficiently specific to sources that the animal can locate food, shelter,
    potential mates, and the other goods (i.e., values) for its existence. Perceiving
    and acting are reciprocal: Neither is possible without the other, neither causes
    the other to occur. Actions are exploratory, performatory, or both. Perceiving
    is not fundamentally conceptual: It is a matter of an animal acting so to detect
    affordances, not objects or categories or any other type of thinking. Affordances
    are the possibilities for the animal''s interacting with its environmental surroundings
    to realize goods. Cats, for example, do not see windowsills, but see/feel jumping-on
    and lying-down affordances. They see a field of potential actions, defined with
    respect to the goods of the ecosystem as a whole and demands on them. The animal
    acts as an agent of the ecosystem, realizing affordances through action.


    Before turning to linguistic activity in humans, the example of humans driving
