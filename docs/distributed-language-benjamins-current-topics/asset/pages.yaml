  md: '**Sune Vork Steffensen** is associate professor at the Institute of Language
    and Communication at the University of Southern Denmark. He leads the *Research
    Group: Holism, Dialogue, Organization* which investigates cognition, language
    and interactivity in organizational settings. His research interests include holistic,
    ecological and distributed theories in (interactional) linguistics as well as
    health interaction. He has co-edited the books *Language, Ecology and Society:
