    # Language beyond the language system


    Claim 1: Language cannot be explained with reference to a ''language system'',
    i.e. ''a semiotic system for communication''.


    Andy Clark presents his view on language in Chapter 3, Material Symbols in his
    recent book Supersizing the mind (Clark, 2008:44-60).2 Clark’s starting point
    is the pivotal question: "Where does language fit into our emerging picture of
    the plastic, environmentally exploitative, ecologically efficient agent?" (Clark,
    2008:44). While the question is highly relevant, Clark’s strategy for answering
    may surprise the reader:


    > One useful way to approach this question is to consider language itself as a
    form of mind-transforming cognitive scaffolding: a persisting, though never stationary,
    symbolic edifice whose critical role in promoting thought and reason remains surprisingly
    understood (44).


    The devil lies in appeal to "language itself" which, for a linguist, echoes Ferdinand
    de Saussure’s structuralist notion of "la langue elle-même" and "la linguistique
    elle-même).\3 Language is, in his own words, an edifice that scaffolds cognition,
    i.e. the importance of language depends on how it appears to the individual cognizer.
    In so saying, Clark places his work in Western grammatical tradition by adopting
    a naive realist view of language. Clark chooses to ignore the embodied dynamics
    that give life to the phenomena under scrutiny (language or languaging). Reduced
    to a structural entity, language is placed on a par with the various artifacts
    of the extended mind literature, e.g. Otto’s notebook (cf. Clark and Chalmers,
    1998), Sheba’s plastic tags (cf. Clark, 2008:45) and Tetris players’ computers
    (cf. Kirsh and Maglio, 1994). Language, in Clark’s view, is best understood in
    the relation between cognizer and “language itself”. Indeed, it is because of
    the conservative view that his work shows a biased preference for non-dialogical
    and non-conversational examples, such as labelling, recalling and reasoning.'
