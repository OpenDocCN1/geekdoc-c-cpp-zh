    the same, representing function.


    +   2. In Pattee''s words, laws of physics are expressed as rate-dependent equations
    (e.g., Pattee 2001:11), they are directly related to physical time and space.


    +   3. A symbol is an outcome of a selection process, compressing dynamical information
    into a variable relevant — this, in Pattee''s writings, is a function of measurement.


    +   4. The term "description" should be interpreted with caution. It was used
    by von Neumann and others to characterize the conditions for adaptable self-reproduction
    or self-reconstruction. *Description*, being one of such conditions, does not
    have a straightforward relation to "representation" that the term "internal description"
    usually evokes in the context of cognitive sciences.


    +   5. Other timeframes are certainly involved in the emergence of language. Recently
