  md: '# Insightful thinking: Cognitive dynamics and material artifacts


    Taking an embodied, embedded view of cognition, we use the CNP in two experiments.
    In the first, we test hypotheses about how external resources facilitate insight.
    Accordingly, we present two versions of the problem. On the EM view, solutions
    depend literally on artifacts. What matters is not experience of resources but,
    rather, how artifacts extend cognitive powers. Conversely, on the DCog view, what
    matters is how resources are incorporated into distributed cognitive systems.
    Insightful solutions depend on how we cope with embedded cultural events. Insight
    is less likely to occur in imagining and drawing movements than manipulating the
    beads and chains of a real necklace


    # 4.1 Experiment 1: Paper and pen concretized versions


    To test this approach, the task was presented in an abstract (paper and pen version)
    and a concrete (physical) counterpart. Both versions carry information relevant
    to the solution. The solutions are identical and people can do things with either
    the pen or by handling the chain links. On the EM view, external resources scaffold
    problem solving and so, if this happens, experience makes little difference. Contrast,
    if we rely on processes ‘in the head’, solution rates would fall just as if parts
    of the brain were missing (c. Clark and Chalmers 1998:9).


    On the DCog view, distributed cognitive systems are inseparable from opportunities
    associated with their components. In the CNP experiment, therefore, sensorim experience
    with manipulating objects is expected to affect solution rates. The necklace will
    give better performance than paper and pen because, while giving feedback, manipulating
    links can set off events that show a path towards the goal.


    # 4.1.1 Method


    Participants. Seventy-two undergraduate and postgraduate students at Lancaster
    University acted as participants. Of these 39 were placed in the paper and pen
    condition and 33 in dealing with a concretized material.


    Materials. Paper and pen and concretized versions of the CNP were used. The concretized
    version used physical links that formed the chains as in the paper and pen version.
    The links could be opened and close. The same instructions (see Figure 1) were
    used for both the pen and concretized versions of the CNP.


    Design. The experiment used a between-participants design with two groups. The
    groups differed in their external resources. The control group received paper
    and pen and the experimental group received the physical chains. The dependent
    variable was whether the problem was solved or not.'
