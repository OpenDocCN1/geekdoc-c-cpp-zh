    # 3. Dialogical arrays: Conversing as a perceptual system


    Hodges (2007a) considered the hypothesis that language is a perceptual system
    and why it is not usually thought of as such (e.g., no dedicated sensory anatomy).
    If language is thought of in perceptual terms, the focus is usually on how phonemes
    or syntactic structures are perceived, or how semantic inferences influence the
    perception of speech, for example. Occasionally, the focus is on the perception
    of voice qualities that indicate something about the speaker (e.g., identity,
    mood). What Hodges was proposing, was, to consider as part of a perceptual system
    that was fundamentally dialogical. Through conversation with others one can perceive,
    partially and fallibly to be sure, information about the layout of the physical
    environment in which he or she is situated is frequently superior to what could
    be learned by personal exploration, no matter how extensive. Furthermore, one
    can perceive through dialogue a considerable amount about the prior events in
    which ones conversational partners have participated, and about future events
    in which they intend to participate. The specific proposal offered was that conversing
    allows for the perceptual probing of dialogical arrays.


    Somewhat like bats, humans produce complex acoustic patterns that are broadcast,
    yielding complex acoustic patterns in return, that provide information about their
    surroundings. A crucial difference between a normal acoustic array and one generated
    by human speech is that while the former is caused, the latter is not. People
    may speak in informative ways, but they may not.'
