  md: 'mind (Clark


    Authors give quite different emphasis to individual, interactional and collective
    factors. Some focus on second-order constructs (verbal patterns) highlight first-order
    activity. All concur, however, human experience arises as we co-ordinate with
    artifacts and each other. Literal meaning is often secondary in making and constructing
    texts. Järvehito et al. (this volume) demonstrate that, in reading aloud, people
    generate meaning and using, test expectations against inscriptions. Textual patterns
    are imbued with sense as we couple dynamics with the feeling of thinking. Given
    that co-ordination allows us to project meaning onto the text while monitoring
    its physical features, this explains how we act as Organism-Environment Systems
    (Järvehito, 1998). In the same spirit of body-world interdependence, Kravchenko
    (this volume) turns to social change in Russia. Rejecting symbol-first (or ‘code’)
    models of language, he argues that, with changing reading (and teaching) habits,
    the educated are losing inferential skills. With the abandonment of intensive
    study (above all) literary inferences, inference-making is in decline. Conjecturally,
    the paper emphasizes differences between reading and dialogue and cognitive domains.
    Reading, for example, gives us cognitive powers based on orienting to ourselves,
    among other things, observers of what we read.


    Other papers focus on how artifacts influence cognitive dynamics. Using an insight
    experiment, Fioratou and Cowley (this volume) contrast solutions between concrete
    and abstract versions of a task. They find, first, that using artifacts makes
    the task easier. Second, they argue, this is because they contribute to the functioning
    of the distributed cognitive system (c.f., Hollan et al. 2000) without being intrinsically
    cognitive (c.f., Giera, 2004). It is sufficient that human parts of'
