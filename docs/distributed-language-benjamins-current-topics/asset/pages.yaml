  md: '# Attunement and alienation: Consciousness, suffering, and hope


    Thus far, language has been considered as a perceptual system for exploring dialogical
    arrays, and an action system for coordinating diverse space-time scales. Both
    have pointed towards the integrity of conversing as a pragmatic activity that
    is concerned to realize appropriateness (i.e., values) from beginning to end.
    Such pragmatic activity is not caused, but jointly-enacted within the integrity
    of the ecosystem as a whole. But values-realizing is not automatic and inevitable.
    It requires work. Through cooperative (argumentative as well as agreeing) dialogue
    can the world be proffered, and our ability to enact and embody the good be increased.
    The task is a shared one that demands creativity, not conformity, but it does
    require following as well as leading (Hodges 2007b).


    With its focus on joint act, an ecological approach sees language less as a tool
    of exclusion than many pragmatic theorists (de Saussure 2005:6; May 2003:343–345)
    would have. The very act of conversing moves us toward sharing, rather than conforming.
    But it is a sharing that is complex, and surprising. Although ecological psychology
    approaches language in terms of action and perception, there is a need for cognition.
    Thibault (2004:1) rightly claims we have no serious account of language if we
    ignore human consciousness. Developmental research suggests that the first perceptual
    emerges in early childhood through dialogical interactions with caregivers (Bräten
    2007; Reddy and Morris 2004; Trevarthen 1999): “the principle of the other — the
    oneself ... is an affordance — perhaps the most fundamental one of all — of the
    ecosemiotic environment ... This observation suggests that the ontological basis
    of our bio-social being is the principle of alterity”.


    Here Thibault is being perfectly ecological. Shaw and Turing (1999) have discussed
    the ecological foundations of consciousness as follows. Taking the “new physics”
    as their point of departure — in which there is a forced, unforced coupling of
    organismic biological dynamics and environmental dynamics by information — they
    suggest that the question is whether Schrödinger’s cat is alive or dead,


    whether the cat observes us as well [as being observed]. If so, there is a social
    dyad, sharing an environment ... Here an ecosystem exists... As parts the ontological
    descent together, coupled by information, satisfying the same observations, governed
    by the same laws ... [In this system of mutual constraints] their wave functions
    are perfectly in phase ... [and] harmony is achieved a posteriori (Shaw and Turing
    1999:119–120).'
