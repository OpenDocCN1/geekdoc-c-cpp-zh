  md: '# Distributed language


    Stephen J. Cowley

    University of Hertfordshire, England


    In viewing language as multi-scale co-ordination, the distributed perspective
    challenges two dominant orthodoxies. First, it denies that language is essentially
    ''symbolic'' and, second, that verbal patterns are represented inside minds (or
    brains). Rather, language is, at once, individual and constitutive of the feeling
    of thinking. It is distributed between us. In illustration, the opening Chapters
    report empirical work on the anticipatory dynamics of reading, its cognitive consequences,
    Shakespearean theatre, that images evoke and solving insight problems. Having
    given reason to consider this challenge to linguistic autonomy, the collie concludes
    with theoretical papers. First, it is argued that language depends on a specific
    function of semantic cognition. Second, it is suggested that realizing values
    is a central function of language. Third, as with all social activity, this is
    traced to how cultural and biological symbols regulate human dynamics. Finally,
    Steffensen (this volume) argues, far from being organism-centred, language gives
    us access to an extended ecology in which, through co-ordination, we enact our
    own history.


    # Beyond symbolic processing


    Computational views of mind invoke a system that functions syntactically and,
    for that reason, without reference to human life. Today, however, the study of
    cognition is moving away from such models. Living humans rely only on, not just
    symbols, but also interactions that sensitise us to each other and our cultural
    practices. This commonplace idea took on new life when Hutchins (1995a, 1995b)
    used cognitive models to examine how we navigate ships and land planes. He showed
    that culturally-specific artefacts and narratives serve in propagating representations
    in a public domain. Cognition is cultural and embodied: while much happens in
    the brain, events arise as people interact with each other and the world. While
    the view is now mainstream in cognitive science, Distributed Language shows its
    radical implications for language. Since humans do not need artefacts to embody
    thoughts, language is fundamentally dynamic. Verbal patterns constrain bodily'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Stephen J. Cowley


    movements and the feeling of thinking as people co-ordinate the flow of activity.
    The perspective thus challenges theories that privilege linguistic form and/or
    function. Co-ordination becomes an embodying of thoughts: language is, at once,
    ecological, dialogical and non-local.


    # 2. The distributed perspective


    Language can be traced to how living bodies co-ordinate with the world. On this
    perspective, far from being a synchronic ''system'', language is a mode of organization
    that functions by linking people with each other, external resources and cultural
    traditions. We concert speech, thinking, gesture and action in speciespecific
    ways. Language arises as we give voice to words, makes gestures, imagine and deal
    with objects and institutions. It is whole-bodied activity that shapes sense-making,
    and also develops, allows texts and institutions to enrich what we think and do.
    Rather than view language as an object, we live in a meshwork (Steffensen, Thibault
    and Cowley, 2010; Thibault, 2011) whose dynamic fuse events draw on many time-scales.
    Linguistic experience alerts us how we become as orient to others (who orient
    to us). Just as I co-ordinate with my reader, you have head movements with your
    expectations, can scan what is before your eyes, evoke memories and, perhaps,
    see future prospects. Even in reading, language-activity connects you and with
    inscriptions and words. For those concerned with the results, we can ask what
    we create and construe language, and generally, manage human action. Language
    links the here-and-now with what has been and crucially, what is to come. It is
    thus beyond dispute that, in this sense, language is a distributed phenomenon.


    Though languages and their parts constrain sense-making, humans also rely on intertwining
    gestures, voices and artifacts. When the language focuses on these multi-scale
    dynamics, they discover an alternative to prioritizing priori linguistic signifiers
    (or language-systems). I briefly sketch difficulties that arise from putting symbols
    (or words) first. Above all, these are abstractions that unzip language from embodied
    activity. They conflict acts of utterance (movements) with descriptions of results
    (verbal patterns). Not only does this mark the interdependence of voices, gestures
    and artifacts, but languages become disembodied ''systems''. They come to be reified
    in terms of constituents, larger units and linguistic forms. Of value to characterise
    meanings, words, and grammars, abstractions cannot explain human behaviour. Quite
    simply, what we do and say – how we embody thoughts – is cultural activity. Symbol-for
    or disembodied approaches overlook activity and, in its offer,'
  merge: -1
  pgno: 12
