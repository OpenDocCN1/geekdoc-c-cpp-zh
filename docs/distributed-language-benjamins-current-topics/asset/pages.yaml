  md: '# The role of anticipation in reading*


    Timo Järvilehto, Veli-Matti Nurkkala, and Kyösti Koskela

    University of Oulu, Finland


    The paper introduces measurement of fixation-speech intervals (FSI) as an important
    tool for the study of the reading process. Using the theory of the organism-environment
    system (Jarvilehto 1998a), we developed experiments to investigate the time course
    of reading. By combining eye tracking with synchronous recording of reading in
    a single measure, we issue a fundamental mental challenge to information processing
    models. Not only is FSI an authentic measure of the reading process, but it shows
    that we exploit verbal patterns, textual features and less directly, reading experience.
    Reading, we conclude, is not a matter of decoding linguistic information. Far
    from a text-driven process, it depends on integrating both sensory and motor processes
    in anticipation meaning generation based on the history of experience and cultural
    context of the reader. Finally, we conclude with remarks on the social character
    and cognitive history of reading.


    **Keywords:** anticipation, eye tracking, fixation-speech interval, neural basis,
    organism-environment system, reading


    # 1. Introduction


    Experimental research on reading has long been dominated by the view that language
    is based in text-like entities or words that are processed by the brain. Thus,
    the first experiments on reading used single words in the study of the speed of
    naming (Cattell 1886). During the last century the experimental possibilities
    were enlarged by the development of methods for tracking eye movements and for
    recording electrophysiological and hemodynamic measures of brain activity. However,
    there has been a surprising lack of interest in methods for determining the time
    course of events in the reading process. In study of oral reading, most work has
    used different kinds of naming experiments where participants make lexical decisions
    or rapidly articulate single words, pseudonyms, or short separate sentences (for
    a review, e.g., Altmann 2001). However, since context matters'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'to reading (e.g., Stanovich 2000:3ff), this is open to criticism. No comprehensive
    theory of reading can rely on studies based on measures of how participants name
    single words or read sentences.


    The easiest way to determine the course of reading is by continuous measurement
    of the interval between the fixation to a word by the eyes and the start of word
    articulation. In fact, such a measure was developed over a hundred years ago.
    Pioneering quantitative measures, Quantz (1897) recognised that, before articulation,
    the eye identifies the word. Furthermore, the eye identifies the voice, Quantz
    called the spatial distance between the two eye-voice *span* (EVS). In the beginning
    of the 20th century EVS was usually limited by the number of characters or words
    whereby the eye led the word (Buswell 1920). However, for technical reasons, temporal
    measurements were seldom made. After the middle of the century the measurement
    of EVS continued to be used (see Levin 1979), as an indicator of the reading process
    and reading skills. In recent decades, however, interest in such measures has
    fallen away. This may be because, in the information processing framework, reading
    is seen as a predominantly decoding process. Accordingly, there is little interest
    in oral reading. Further, as Rayner (1998: 384–385) suggests, many believe that
    eye movement dynamics and cognitive processes differ (at least in the time scale).


    # 2. Information processing or anticipation?


    Reading research is still dominated by the information processing model. On this
    view, reading is seen in terms of how the brain processes information that is
    stored in the written text. While theorists debate how the processing is realised
    (e.g., Rayner 1998: 388), models generally trace the process to when eyes fixate
    on the word. They assume that this leads to the transfer and further processing
    of visual information. It is posited that visual or phonological codes (or both)
    serve in identifying word and sentence meaning. When reading aloud, the perceptual
    part of the process is said to be *followed* by selection of motor programs and
    realisation of speech sounds.


    Such conceptualisation of the reading process follows the general cognitive model
    of perception and motor action as linear/parallel information processing in the
    nervous system. While willing to debate whether reading is based on transmission
    of letters, syllables or whole words, or whether word recognition is based on
    dual route or interactive models (see, e.g., Altmann 2001), these theories share
    a single assumption. Their cornerstone is the claim that word recognition occurs
    only *after* the presentation of a stimulus or fixation on a textual item. Recognition
    is based on comparing incoming information with representations that'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'are stored in a putative inner lexicon. It is often said that these psychological
    mod-nels gain support from the use of EEG or MEG brain imaging that traces sequential
    activations of the brain (e.g., Sereno and Rayner 2003; Parviainen et al. 2006).


    Even 19th century work challenged linear information processing models of perception
    (Bain 1855; Dewey 1896). More recent traditions have pursued this critique (e.
    v. Uhull and Krisat 1932; Gibson 1979). Using the theory of the organism-environment
    system (Järvilehto 1998a), experimental work on ani-mals and humans has been used
    to defend an alternative. Accordingly, Järvilehto (1999:97) suggests that:


    Perception is not a linear process proceeding from the stimulus to the percept,
    but, rather, a circle involving both the sensory and motor organs as well the
    events in the environment. A perceptual process does not start with the stimulus,
    rather the stimulus is an end of this process. The stimulus is the last piece
    in a jigsaw-puzzle. The last piece of the puzzle fits in its place because all
    other pieces of the puzzle have been placed in a particular way. It is just joining
    of the other pieces, their coordinated organization, leaves a certain kind of
    hole into which this piece can fit. Thus, it is the organization of the other
    pieces which defines a possible last piece with which we finish the puzzle. Exactly
    in the same way, a stimulus is present only if there is an organi-s into which
    this may be fitted. Thus, the stimulus is as little in a causal relation to the
    percept as the last piece of the puzzle to the constructed picture. The stimulus
    is a part of the process of reorganisation of the organism-environment system,
    which forms the basis of new knowledge.


    Applied to read, the models that the brain analyses and interprets marks or inscriptions
    in a linear fashion. Rather, the organism-environment system in integrates what
    can be seen with current organisation. Far from processing ''word or sentence
    stimuli'', inscriptions serve to create words and meanings. This is be-cause,
    like single pieces of a jigsaw puzzle, inscriptions take on significance only
    as they become constituents of the organism-environment system. Since they lack
    intrinsic meaning, it is a mistake to say that words and sentences exist on paper
    or they are decoded by a brain. Rather, reorganisation of the whole organism-environment
    system gives rise to these results. To look'' at inscriptions on paper enables
    marks to be included in anticipatory organisation that leads to the formation
    of the personal meaning and/or an articulatory act (in reading aloud). This process
    is not determined by the stimulus. Rather, it is to be traced to how the reader''s
    cultural and experiential history set the structural conditions for the dynamics
    of the organism-environment system.


    Although fixation is often viewed as the starting point of information transfer
    from the written word, there are competing explanations. On the basis of ''miscue''
    analysis of oral reading, Goodman (1969:9) likened reading to a “guessing game”'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'and, quite explicitly, denied that it depended on veridical information transfer.
    More recently, McDonald and Shillock argue that “the remarkable efficiency of
    reading is due, at least in part, to the on-line formation of predictions about
    words. The statistical properties of the linguistic environment offer a source
    for these predictions” (2003:651). In recent work on comprehension, Levy (2007:11)
    stresses expectations in his theory of resource-allocation processing difficulty.
    In parallel, Federme (2007) used recording of event related potentials (N400)
    associated with expected and unexpected words to say that “the brain seems to
    deal with the speed and complexity of language processing by thinking ahead, by
    generating likely stimuli and preparing ahead of time, at multiple levels, to
    process them” (ibid.:502). Reading is a special skill that is carried out at a
    remarkable speed. This is why anticipation is likely to have a major role in reading
    just as it does on temporally demanding skills (see, e.g., Abernethy et al. 2001).


    # 3. Fixation-speech interval (FSI) as a measure of temporal dynamics in reading


    The relative ease with which words with transposed letters can be read suggests
    the likely importance of anticipation (Rayner et al. 2006). However, Rayner et
    al. (2006: 192–193) also found that there is a cost when the order of letters
    in the word is changed: reading rate decreases and the number of fixations increases.
    This was interpreted by Rayner et al. (2006: 192–193) in terms of the mainstream
    information processing model.


    # 3.1 FSI and type of text


    Järvilehto et al. (2008) examined the effect of letter transposition in more detail.
    In doing so, we introduced two kinds of controls alongside ‘scrambled’ text: normal
    ‘discrete’ text and ‘continuous’ text without spaces between words. Further, in
    addition to recording the usual eye movement parameters, we developed a measure
    of reading efficiency. This consists in fixation-speech interval (FSI) or the
    time-interval between initial fixation to a word and the start of articulation
    (in reading aloud). The FSI measure allows ecologically valid investigation of
    parameters that impact on time-intervals between fixating an inscription and articulating
    its meaning. In this way, the whole reading situation opens up investigation in
    this general process that it serves to capture the use made of separate parts
    by a series of fixations and saccades.'
