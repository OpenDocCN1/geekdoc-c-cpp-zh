    What are values on an ecological accounting, and how are they related to affordances?
    Ontologically, values are the global constraints on self-organizing systems, the
    boundary conditions that "provide not only for the conditions of the system but...
    underlie the system dynamics" (Hodges and Baron 1992: 270). As such, they motivate
    and align the activities of intentional agents within the system. However, the
    system as a whole is intentional: Values are "the intentions of the world as a
    self-organizing system" (Hodges and Baron 1992: 270, italics deleted). Thus, values
    are not properties of people or objects, as is often assumed or argued (e.g.,
    Read 1996: Rokech 1973), but are about relationships and the demands that the
    ecosystem places on these relationships. Values are ecological, not subjective
    or objective. Affordances are possibilities of particular layouts of events and
    objects for a particular animal. If they are realized, affordances are a partial
