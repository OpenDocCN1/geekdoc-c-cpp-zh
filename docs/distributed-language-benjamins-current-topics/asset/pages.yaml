    # 4.o Discussion


    The results of both coding procedures show substantial differences between experimental
    and control scenes supporting our hypotheses. In parallel to the neurocognitive
    scenes cited above, we found significant differences in how experimental participants
    afford semantic affordances in each of the three conditions. Coding procedure
    I shows a within-subject effect affecting how the participants'' lexically construe
    vs. control scenes as signals and non-signals respectively. In the between-subjects
    coding procedure, while descriptions of the control showed showed variation, experimental
    scenes were generally characterized by a strong propensity to alignment, indicating
    conformity to social norms. Independently, participants do very similar descriptions
    of particular scenes applying distinctive semiotic strategies.


    While perception of non-social objects is a more private affair that characterized
    unregulated, episodic sense-making, certain objects have an sensitive quality
    that alter participants'' attitudes to construal: they afford a special kind of
    social constraining the perceptual explorations. As shown by verbal construals,
    they elicit more explicit references to communicative concepts, social meaning,
    and discursive roles.


    The second coding procedure used Peirce''s classification of sign types (icon,
    index and symbol) to explore normative aspects of meaning-construction. Striking'
