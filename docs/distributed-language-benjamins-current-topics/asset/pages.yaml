    space and home territory. The child actively in-forms himself in linguistic environment,
    he develops initial standards of linguistic behavior. During interactions, these
    are continuously tested through direct or indirect appeal to authority (parents,
    caretakers, members of the family, etc.). The adequacy of a child''s linguistic
    behavior is assessed by relating it to the family members personal values, priorities,
    and idiosyncrasies. These, of course, with respect to nature, character, and public
    relevance. In other words, in the process of language acquisition children learn
    to conform (Tomarello 2006; Hodges 2007), ensuring their ''functional fit''.


    In the intra-cultural domain of interactions, the concept of functional fit is
    controversial. Dialectical contradictions often oppose an individual''s goals
    to those of the community. Over time, therefore, behavioral patterns emerge as
    adaptive solutions to dealing with events in the social world. Each individual
    must come with behavioral strategies that produce actions which ''fit'' the intracultural
    domain. This leads to tension. A child may seek to maximize autonomy as a cognizer
    by minimizing the restrictive influence of the (social) environment. At the same
    time, other interests exert control. The living community (society) will act to
    enhance the group''s adaptive potential by minimizing individual cognitive autonomy.
    Thus, the intracultural domain of interactions (as the larger cross-cultural domain
    of interactions) gives rise to oscillating patterns of cognitive activity. In
    evolutionary time, attractors will seek to establish dynamic equilibrium between
    the parts and the whole. For social psychology, one consequence of this cognitive
    flux is the inevitability of conflicts—often categorized as criminal behavior—at
    the interactive interface between second- and third-order living systems.


    As a young individual grows, his domain of interactions with the environment expands
    into the domain of public relations. However, integrating into society and its
    culture, the child''s development is socialized by educational interactions. In
    other words, the child is in-formed in the human habitat as he draws on the norms
    and standards of the consensual domain by attempting to'
