  md: '# Distributed language


    experience (Port, 2010) that gives windings a particular sense. Utterance-types
    that we report (or transcribe) are also co-ordinated voice dynamics. Dialogical
    activity is constrained by phonetic gestures that prompt us to hear windings,
    and at times, to attend to verbal structures: languaging arises as phonetic gesture
    is coordinated with other neuromuscular activity. We talk, experience encounters
    others and enrich the feeling of thinking (Harnad, 2006). From an ecological perspective,
    this is neither internal nor organism-centred: feelings contribute to a common
    world.


    Language is fundamentally dialogical. While its ecological side can be traced
    through phonetic science, its ''digital'' or verbal aspects profoundly influence
    our sense of self and experience of others. In part, we are how we speak with
    each other. As Bakhtin (1981) and Mead (1932) saw, experience of sense-making
    insinuates a self into what we feel, act and think. As this emerges, we discover
    the cross-crossing or overlapping senses that are evoked by windings. Semantics
    is dialogical and rich in codifications: if this seems odd, it is because written
    language bias (Lennell, 2005) masks the other orientation (Lennell, 2009) of human
    communication. To speak is to anticipate the response of the other: vocal and
    moving drives flexible, adaptive behaviour. Though inseparable from cognition,
    language unites social action, verbal pattern, meaning and, crucially, real-time
    understanding. Further, the brain-social prompts us to individuale. In learning
    to talk, we speak, monitor the saying, and displays of expectations. Contingencies
    of our lives lead to the flowering of language. To make sense of its complexities,
    we entwine dialogical with actions and, thus, set off expressions of power and
    experience of relationships.


    This may seem puzzling: how can a focus on organism-environment relations be linked
    to the windings and dialogical events of social life? How can language enact expressive
    control, feeling, thinking, and prompt us to hear people saying something? Taking
    a phenomenological view, Lennell (2009) emphasises situations while recognising
    that expression evokes traditions, vows and ever changing circumstances. While
    situated, language explores dialogality by linked events with material and, separately,
    ''third-party'' phenomenon (2019). Lincoln echoes Bakhtin''s, ''the world is a
    drama in which three characters participate (it is not a duet but a trio)'' (1986:
    xviii). Far from appealing to linguistic signification/meaning or a Peirce triad
    of sign/object/effect, a world of social norms prompts us to orient others. We
    integrate activity, what we have, and bundles of social expectations. This contributes
    to what Goffman (1959) calls the ''public presentation of self'' by means of,
    for example, use of interactional regularities, genres, register and language
    varieties. Language is thus grounded in bodies nor society but the play of dialogue.
    The challenge to the distrib'
  merge: -1
  pgno: 15
