  md: 'explanations about the organism (or its parts). Instead of tracing skills to
    experience, these are ascribed to the functioning or minds, discourse or, perhaps,
    knowledge of social conventions. Appeal to language-systems excludes real-time
    dynamics by invoking brains or minds that make, construe and manage utterances
    types to be generated or produced by a single organism. For Saussure, regularities
    are imposed rather than freely chosen; forms and/or functions draw on an inheritance
    that we have no choice but to accept (Saussure, 1983: 71). On a disembodied view,
    linguistic signs are given in advance and humanizing reduces to how ‘systems’
    manipulate verbal patterns. In the distributed language movement, by contrast,
    we reject symbol-first views of language.


    # 3. The Distributed Language Movement: Prehistory


    Language can be traced to multi-scalar dynamics that share across groups, times
    and time-scales. The perspective emerged from linking inorganic critique of linguistics
    (Harris, 1981; Spurrett, 2004), with distributed cognition (see, Hutchins, 1995a;
    Holman, Holman and Kirsh, 2000; Giere). The move made clear that challenges to
    decode views of language parallel those mounted on the symbolic view of mind (see,
    Love, 2004; Kravchenko, 2007; Cowley, 2007a). Like human cognition, language is
    embodied, embedded and intrinsic to the cultural world. In Love’s (2004) terms,
    first-order activity (e.g. speaking and hearing) can be perceived, decoded and
    interpreted as verbal patterns or second-order cultural constructs. On this view,
    learning to talk depends on human bodies that act intersubjective behaviour (Trevarten,
    1979). Contextualizing bodies prompt us to vocalize, engage with others and, eventually,
    act in line with constraints that are perceived as verbal patterns (Cowley, 2004).
    We learn to act and, when it suits, to frame explicit messages. This, however,
    depends on a form of control based on hearing utterances taking a language stance
    (Cowley, 2011), we develop skills based on careful use of windings. With spontaneous
    language arises as we use people, and even our own thoughts. At all times, however,
    digital signalling (Ross, 2004) is co-ordinated with bodily expression and prosody.
    In the resulting-activity, vocal and non-verbal expression are integrated by bodies
    that adjust to events in a cultural world. As Ross (2007) argues, following Dennett
    (1991), we narrate selves into being. Biological agents reorganize events (of
    various kinds) with structures based on ontogenesis, learning, history, and human
    phenotypes. To pursue reciprocal links between language and humanity, a group
    of scholars see the goal of transforming the language sciences.'
