    # The complexity of fractal dynamics: Conversing as an action-system


    Viewed from an ecological, values-realizing perspective, linguistic activity is
    not only perceptual, but enactive. While it is common to think of language as
    a cognitive skill, it is a form of action since “actions are realizations of what
    the environment affords (Reed 1982: 101), they are distributed, “much as ‘in’
    the environment as ‘in’ the organism” (ibid: 125). As the discussion of dialogical
    arrays has revealed, the ecosystem relations within which utterances function
    as a perceptual system (Hodges 2007a) are both local and distant, both present
    and historical. Dialogical utterances are enacted as perceptual systems to locate
    and orient us to the possibilities, opportunities, and obligations that surround
    us. In locating and orienting us, linguistic activity functions, like all perceptual
    systems, to act context-sensitive.


    As actions, utterances are also prospective. They are intentional. As we saw earlier,
    dialogical arrays can only be explored by being enacted through dialogical fields
    (fields of caring conversation). The creation and development of dialogical fields,
    as people move in and through dialogical arrays, requires that language functions
    as as an action system (e.g., Hodges 2007a; Reed 1982). That is, the movements
    we designate as linguistic cannot be so many separate actions, independent and
    reactively cobbled together, oriented only to local signs. The movements'
