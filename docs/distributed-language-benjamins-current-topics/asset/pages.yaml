    The research on fractal patterns points to the possibility that "contemporary
    models grossly underestimate the number of temporal scales on which cognitive
    activity is actually assembled" (Kloos and Van Orden, 2009: 263). World pronunciation
    tasks, with local decisions and semantic categorization tasks, all interaction-dominant
    dynamics in which control is distributed, not localized. These findings consider
    considerable difficulty for any view that gives priority to the central nervous
    system and to any purported processes in explaining linguistic and related cognitive
    skills (Van Orden and Kloos 2003). Processes that are traditionally seen as separate
    and encapsulated, capable of independent analysis, are in fact of a complex, unified,
    dialogical system (Van Orden, Holden, and Turvey 2005: 121).


    Complexity is not the mark of a distressed system, but a vibrant one. Disease
    is marked by a "departure away from healthy fractal variability and toward loss
    of complexity" (Van Orden 2007:1). For example, hearts show fractal, periodic
    rhythms. It is often proposed by cognitive researchers and linguists who simplicity,
    economy, and repetition are the markers of language proper, but as noted earlier,
    complexity and variability seem to be better candidates for identifying the systematicity
    and usefulness of language.


    One way to evade the force of fractal patterning is to claim that tasks (i.e.,
    goals) should be treated as canonical in establishing the nature of a competence
    or skill, while other interaction effects are treated as peripheral to the competence,
    that is, of particular performance conditions. The difficulty is that there appears
    to be no principled, empirical basis upon which to decide which tasks should be
    canonical (Kloos and Van Orden, 2009; Van Orden, Holden, and Turvey 2005). What
    has happened in numerous areas of research is that arguments about which task
    is right for carving up the competences or the modules correctly have reached
    "stalmates" (Kloos and Van Orden, 2009). Instead of arguing about which task and
