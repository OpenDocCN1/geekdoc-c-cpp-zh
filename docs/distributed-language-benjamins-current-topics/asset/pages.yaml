  md: 'uted movement is of reconciling dialogical propensities with, first, our cultural
    nature and second, our co-evolutionary history.


    The challenge of integrating time-scales makes a non-local ontology (Stevens and
    Cowley, 2010). By linking phonetics, phenomenology and its products, language
    becomes measurable activity that, oddly, is perceived around historically-patterns.
    Its symbiotic character undermines any simple division between subject (the observer)
    and object (the observed). We are bound to be sceptical that social events, including
    linguistic events, can be traced to a localised ‘cause’ or, in Whitehead’s (1926)
    terms, that they can be explained around the assumption of simple location. Indeed,
    even objects like stones exist in a state of change – however slow the change
    may be. While much could be said, a cautious view highlights biological function.
    Living systems do not ‘occupy’ space-time because, among other things, their genetic
    structures outlast phenotypes. Even simple human observations and actions link
    evolutionary, developmental and collective history. Exploration of real-time language
    cannot ignore non-local ‘regions of space-time’ (Whitehead 1926: 62). Given that
    linguistic states or processes do not ‘occupy’ a determinate space-time zone,
    Steffensen and Cowley propose a principle of non-locality. Cognitive dynamics
    evoke (non-local) wording: language is both measurable first-order activity and
    organization that sustains traditions. It is both dynamical and symbolic or, in
    short, a symbiotic mode of communication. While we trace this duality to our use
    of virtual structures (Cowley, Love, 2007), others stress that biological dynamics
    result from physical constraints (Carr, 2017), Rązaszek-Leonardi and Kelso, 2008).
    1) In enacting utterance-activity, they argue we draw on physical structures (in
    some-to-be-specified sense). While the future of this debate is unknown, the underlying
    premise is clear. However non-locality is construed, language links people, phonetic
    activity, wording and history. Though occurring ‘in’ time, it is not wholly situated.
    Activity is ‘mediated’ by patterns that make language, at once, a phenomenological
    construct and a biological product of evolutionary change (including natural selection).


    # 5. Investigating the view of cognition


    The DLG views language as ecological, dialogical and non-local. While specifying
