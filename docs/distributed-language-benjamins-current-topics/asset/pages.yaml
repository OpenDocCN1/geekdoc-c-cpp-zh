  md: '# 154 Bert Hogdes


    This suggests that consciousness functions as con-science, literally "together
    know-ing" (von Foer 1986; Järvilehto, 2009); that is, consciousness is a form
    of conversing that encourages vision and criticizes carelessness. It points to
    the possibility that it is in the dialogue of attenuation and alienation within
    dialogical arrays that humans become conscious and caring.


    Pragmatics, I have argued, is values-realizing. Within these heterarchically organized
    activities, we may set goals and generate rules in an attempt at ordering our
    efforts. But, since language be so chaotic as well as orderly, goal-seeking and
    rule-following by themselves are too imprecise and repetitive for the coordination
    necessary for pragmatics. Values, on the other hand, provide an ediness, a playfulness,
    that makes it possible for language to work properly (Hodge 1995,2007). Thibault
    (2004) suggests that it is through triadic, cooperative play that consciousness
    develops: through play, the child''s world is significantly enlarged in one sense,
    and significantly entrenched in another. More specifically, the child learns that
    language is not itself reality, but is a form of play (Thibault 2004: 298). But
    it is play of a serious sort. How so?


    Paradoxically, we find rule-breaking utterances more interesting and informative
    than conventional, rule-following ones. It is as if we find language more useful
    when it is playful rather than when it is "working to rule" (a phrase used by
    labor unions to denote abiding by contractual obligations in a legalistic way
    rather than language is values-realizing; Schwartz 1986). Cowley (2004) discusses
    ways in which language is playful and serious, arguing that utterances (i.e.,
    "words") cannot come to function as tools until the child takes them seriously.
    Thus, parents. Goodwin and her colleagues (Goodnow 1988, 1990; Goodwin and Warton
    1991) noted that parents, intent on encouraging their child to be responsible,
    like and caring, often say strange, difficult to compare-things to them. (Wait,
    the text has a typo: "difficult to compare-things to them\). Rather than clearly
    explaining what their children want to do and why (as nearly all developmental
    experts encourage them to do), parents seem intentionally to occlude, at least
    partially. The purpose of this partial occlusion may be that it invites the child
    into a game of sorts, a hide-and-seek, but with the serious intent of getting
    them to move from their egocentric position to positions that make it possible
    for them to see more clearly the other. In having to work (and play) to understand
    the parent''s utterance, the child will have begun to vary the very parents the
    child to learn. The parent''s playful occlusion invites the child to make the
    serious move of entering into the dialogical array.


    Representational consciousness (i.e., the disengaged self) offers itself as a
    sufficient guide to perception and action, to learning and social achievement.
    It is'
