  md: 'Actualizing semiotic affordances in a material world


    # Table 2. Coding scheme II.


    | Code | Description | Examples |

    |---|---|---|

    | Icon | An iconic/aesthetic strategy: objects are appreciated for their intended
    aesthetic qualities | Explicit references aspects of artistic com positionality
    such as symmetry, intended resemblances or figurative/metaphorical analogies |

    | Index | An instructional strategy: objects are experienced as social imperatives
    for coordination or instruction | Explicit attribution of perceiver-directed deontic
    meanings for instance manifested in modal verbs such as ''shall'', ''ought to'',
    ''is supposed to'', etc. |

    | Symbol | A symbolic strategy: objects are appreciated for their conventional
    reference to arbitrary cultural meanings | Explicit references to meanings associated
    with specific cultural uses of objects as symbols |


    Coding scheme for the identification of different semiotic strategies applied
    by participants in their descriptions of material signals. An expert coder scored
    participants'' image descriptions in relation to the three variables, defined
    in the scheme.


    # 3-3 Results of the second coding procedure


    Analysed revealed strong alignment effects in participants'' interpretive approach
    to images of the experimental conditions (overall agreement = 91,5%). Generally,
    participants independently adopted the same meaning-constructing strategies in
    their approaches to experimental scenes. For example, in the descriptions of the
    rose-scene (Figure 1b), 18/20 participants categorized the roses as a signal.
    Of these, 17 made a symbolic reading the roses to grief in relation to the re-natural
    death of someone at the particular spot (while only one participant made an aesthetic
    reading). Interestingly, however, there were substantial differences between the
    two experimental conditions (conventional and unconventional signals). For example,
    the interpretive approach to the Figure 1d (vacuum cleaners lined up on a lawn)
    showed much alignment effects. While 17/20 participants categorize the vacuum
    cleaner scene as a signal, only 12 participants agree in their choice of an associating
    the scene with a cemetery or an army of warriors). Others are hesitant in their
    strategies. This difference applies generally to the two experimental conditions.
    While we observe a high inter-subject agreement in the case of the conventional
    material signals (PA = 999%), the alignment effect is somewhat weaker for the
    un-conventional material signals depicted in images of experimental condition
    II (PA = 81%) (See Figure 3). Participants'' interpretive material signals show
    more uncertainty. This is shown by a higher between-subject disagreement. Besides,
    this is supported by the observation that participants seem more indecis in their
    construcals of these scenes and often try out several possible interpretive strategies.'
