    It is an priori division of language into elements that leads to questions like:
    "what rules order those elements?” Indeed, there may be better ways to discover
    the ordering forces, focused on how language is functional on various levels of
    its systemic properties. Various substructures may be functional on various levels
    and time-scales: e.g., some shaping and being shaped by developmental processes,
    others by on-line communication.


    Pattee’s view of how symbols constrain dynamics allows us to rethink coordin influence
    symbolic function (and vice versa). This enables a greater role to give to the
    dynamical processes, during human interactions, are always present. Indeed, applying
    Pattee’s view of biological symbols back to language aids, in recognizing the
    relevant dynamics. It can promote a grant of relevant substructures. At a more
    theoretical level, the approach suggests that the shape of a specific language
    is unlikely to ‘reflect’ either the structure of the physical world or an individual’s
    perceptual system. This is because the forces that structure language manifestly
    function on many levels and timescales. While both physics and human perceptual
    powers are likely to have a role on structuring language, the resulting ‘mapping’
    depends on mediating functions that specify perception of the physical world plays
    out in (social) action that depends heavily on interindividual coordination.


    # 6. Conclusion: The specificity of natural language


    There are advantages in following Pattee’s positing of a particular relation between
    symbols and dynamics in natural language. Above all, it affords theory to work
    on information in living systems by recognizing that dynamics and self-organization
    have an explanatory role in shaping symbolic structure. By admitting that several
    kinds of dynamics on this structure, a theorist is able to recognize that her
    focus on one scale or level. At the same time, it can be acknowledged that each
    of these is embedded in dynamical systems that have their time scales. Far from
    being reducible to a system ‘in the brain’, language must be viewed as radically
    heterogeneous and as spread across space, time and bodies.


    It is mistaken to focus exclusively on either individual or collective processes.
    Indeed, the theoretical challenge lies in showing how these can be connected.
    By recognizing that symbols function to constrain dynamics, we can begin to ask
    how it is that individual dynamics gains from being embedded in (shaping'
  merge: -1
