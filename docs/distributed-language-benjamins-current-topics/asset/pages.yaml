  md: 'Sune Vork Steffensen


    The **extended ecology** lies on a middle path between reducing language to biology
    and treating language without recurrence to biology. Both extremes are deleterious.
    Language unfolds in human Organism-Environment-Systems (cf. Järvile, 1998, 2009),
    and as it is part of the human ecology, just like the web is a part of the spider''s
    ecology. But admitted, language has catapulted and stabilized human cognition
    in ways that are unequaled in the ecology of any other species. The human ecology
    is radically *extended*. All living systems realize values (cf. Hodges, this vol.)
    by categorizing its environment in terms of what they can eat, with whom they
    can mate and what jeopards their survival. Language allows human beings to share
    carries, reflect upon them, and then animate distributed cognitive systems. Importantly,
    by languing with each other, we are more than parts of each other''s environment;
    we develop shared agency in a shared world. As Bert Hodges observes, this allows
    us to develop deep emotional relations to each other. Our shared agency depends
    on, not just each of us can gain individually, but on our ability and willingness
    to distribute our agency across larger social groupings. In Hodges'' terms, "Social
    solidarity with those we speak to listen to in caring ways is a crucial dimension
    of why and how we speak at all" (Hodges 2007: 598).


    +   1. Conclusion: If you want to learn about language, forget about language!


    We are to understand how mind and cognition extend beyond brains, we need a careful
    examination of how language saturates human cognition in our everyday existence.
    Using integrational theory as a springboard (Harris, 1981; 1998; Love, 2004),
    the distributed language movement seeks an understanding by looking beyond our
    (abecedaric phenomenological experiences of ‘using language.’ Summarized *à la
    manière* de Bloomfield, this can be stated in the slogan: “If you want to learn
    about language, forget about language!” Thus, a fuller understanding requires
    that we give up the naive idea that our idea of ‘language’ corresponds to a'
