    # 4. Ecologically extended cognition


    CLAIM 4: Language functions, metaphorically, as airborne synapses in distributed
    cognitive systems.


    Our kinds of minds depend on social and phenomenal aspects of language. They give
    us an ecology in which we become parts of each other''s environment and, thus,
    each other''s extended brain-body-world systems. Therefore, as mind ends via languaging,
    an individual''s solving abilities become linked with those of other agents. However,
    in our everyday life, many problems are not purely individual, rather, appear
    as common problems that require collective solutions. This is less clear in experimental
    work, partly because of the methodological individualism (Udehn, 2002) of traditional
    psychology. The fourth claim is that when launching comes to the fore, new importance
