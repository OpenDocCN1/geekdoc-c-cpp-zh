  md: 'Shakespeare''s own position — as an actor as well as a playwright, often performing
    for his social superiors — much more closely resembles that of the nameless actors
    than that of the aristocratic amateur professionals to do their jobs. At the very
    least, we need to acknowledge the tension between “author’s pen and actors voice”
    (Weimann 2000:6) at work here. Indeed, in delivering these lines, the character
    Hamlet must mimic “the improvisatory, ‘oral’ theatre he depicts” (Marcus 1996:
    174; see also Johnson 2003).


    # 8. Conclusion


    The reasons Shakespeare’s work is relevant to the field of distributed language
    is the pivotal historical moment in which he participates, in which plays stand
    uneas between performance and poem. As Shakespeare was writing, the publication
    of his plays and those of others in both quality and large collected editions
    had been the process of back-formation that would ultimately change plays from
    acts to objects. Printing plays was a new phenomenon in this period, and it ultimately
    altered the cognitive ecology of the theatre, shifting emphasis onto the spine
    of the play rather than its present qualities. The shift is apparent in Ben Jonson’s
    publication of a collected edition of his *Workes* (1616). Jonson was much derided
    by contemporaries, mocked him for calling his “works” rather than “plays”. The
    process continued after Shakespeare’s death, when his plays were similarly collected
    in the Folio of 1623. During this period we find evidence of other playwrights
    attempting to fix their work as literary performative; when publishing his play
    *The Roman Actor* in 1626, for the writer Philip Massinger distinguishes his “poem”
    from the “jigs” preferred by the ignorant (Massinger 1626). Describing the play
    as a “poem” is a means of situating it in the domain of the written, safely protected
    from its association with downmarket improvisational action-oriented genres such
    as jigs.


    Whether or not Hamlet reflects Shakespeare’s own opinions — an impossible question
    to settle — it is Hamlet’s version of the “play” that ultimately prevails. The
    enrichment of the text occludes the lived experience of the Elizabethan theatre,
    which included song, dance, improvisatory set-pieces, verbal combat between audience
    and actor, spectacles and jigs (Hattaway 1982). Apart from scattered references
    and eyewitness accounts, however, what we have of Shakespeare’s plays are the
    written texts that have come down to us. Because this is all we have, we have
    a tendency to conclude that this is all they were.'
