    and the social structures of shipboard life. Hutchins argues that


    +   [t]he environments of human thinking are not ‘natural’ environments. They
    are artificial and through their cognitive powers by creating the environments
    in which they exercise their powers. As present so far we have taken the time
    to study these environments as organizers of cognitive activity that we have little
    sense of their role in the construction of thought (Hutchins 1995: 169).


    In making this, Hutchines makes a nest of ants occupying the untr surface of a
    beach after a storm has scored clear. Over time, their activity lays down trails
    that ultimately organize the activity of the ants, who now appear to be “smart
    through [their] simple interaction with the residue of the history of [their]
    ancestor’s actions” (Hutchins 1995:169). The playing companies of the 1590s were
    in process of developing these tracks and trails in the relatively uncontested
    environment of the purpose-built permanent playhouse. For the early modern playing
    company, analogous tools are physical space of the theatre, the bodies of the
    actors, including their movements in space, their gestures, their interactions
    with other actors and with their environment, their level of expertise, and the
    verbal features of the verse in each individual part, which formed the linguistic
    spine of the plays.


    To elaborate this metaphor of ‘spine’ at greater length: the written words constitute
    the skeletal structure of the play, without which it cannot exist, or at least
    would be indistinguishable from the non-verbal arts such as juggling or dancing.
    It is here where the analogy with shipboard navigation breaks down — the time-pressed,
    goal-driven aim of navigation is successful progress from point A to B, while
    the analogous goal of the theatrical company is a successful production, a collaborative
    effort across actors, audience, and environment. Rather than reducing the act
    of performance to the representation of the written word, we should instead conceive
    of it as the successful “cognitive integration” (Menary 2007:3) of a wide range
    of artifacts, practices, and social agents.'
