  md: '# Beyond mind: An extended ecology of languaging 205


    unitary phenomenon in the natural world. Rather we can take a panoramic view of
    how human interactivity based on making and tracking vocal and bodily gestures
    impact our lives. This contrasts with Clark''s view of an individual cognizer
    who uses linguistic (or linguaform) structures: by clinging to an impressionistic
    view of language, Clark propagates an individualistic (disguised as ''organism-centred'')
    view on human cognition.


    This chapter has suggested that the path to a deeper insight into human cognition,
    languaging and interactivity derive from a distinctly extended ecology. Like the
    beavers'' dam, languaging has a history that is influenced by situation-transcending
    third parties (Bang and Dør, 2007:58–61; Linn, 2009:99–105), just as what is left
    of our voices silently contribute to the interactions of our descendants. Being
    the domain of third parties, dam of language is heritable, variable and amenable
    to selection. The historically grounded, transcendentending dimension of human
    cognition scatters its distribution in time (cf. Hollan et al., 2000). However,
    languaging also allows us to engage in collective a cultural network (cf. Donald,
    2001), and, equally, distributed cognitive systems (cf. Hollan et al., 2000).
    In this sense, language functions as airborne synapses: it contributes to inter-human
    coordination, allowing us to be smarter, more creative and flexible, just like
    the brain is smarter and more flexible than a plea of neurons. Alas, at the same
    time it also makes us the most stupid, bizarre and horrendous mistakes, misdeeds
    and misdemeanours. That''s life.


    Since language is real-time metabolic activity (cf. voice dynamics, gate and task-oriented
    modes of action), it can be explained with reference to a ''language system''
    nor a complex of microsocial rules and norms. We need to acknowledge the role
    of human biology in how it unfolds in an extended ecology. However, appeal to
    bio-ecology does not imply that we discard social normativity altogether, by borrowing
    a term from Stephen Cowley (this vol.), language is symbiotic; real-time bio-dynamics
    are partially reconfigured by phenomenology. It plays out in an extended ecology
    where, as it may seem, biology and phenomenology cease to be individual.


    This claim challenges present views of human interaction. In doing so it calls
    for a deeper view of the real-time bodily activities in and between beings. If
    this is to be achieved, there is a need to reject pre-theoretical ideas of ''language'',
    ''gesture'', ''meaning-making'', etc. (cf. Steffen 2008, in press). It is ontologically,
    epistemologically and methodologically unwarranted to assume that we understand
    these phenomena when we try to understand what people do when they do things,
    alone or together. In order to fully grasp the complexities of human interaction
    and cognition, the entire extended ecology will become our unit of analysis.'
