  md: '# 5. Realizing values through affordances: Conversing as a caring system


    The themes of context-sensitivity and interdependency highlight a central theme
    of an ecological, values-realizing account of language: They are distinguishing
    marks of caring, which Hodges (2007a, 2007b) hypothesized as a primary function
    of conversing (i.e., language). Caring arises out of interdependency and demands
    context-sensitivity, which can be contrasted with traditional metrics of autonomy
    and control.


    An ecological approach to language gives primacy to the physical and the pragmatic,
    that to first-order activities. Conversing is a form of orienting, integrating,
    and way-finding (Hodges 2007b: 174), helping humans to recognize and realize existing
    affordances, and modify and create new ones that invite responsible action. As
    the earlier discussion of dialogical arrays illustrated, the particular power
    of language be its ability to assist way-finding by extending our perception retrospectively
    and prospectively, enlarging our horizons and our ability to realize values as
    a consequence.


    Given that the purpose of way-finding is to realize affordances that embody and
    enact values, linguistic activities physically alter humans and their surroundings,
    although less directly and immediately than many perception-action systems. Linguistic
    activity does not engage dialogical arrays and does not alter the orientation
    and direction of other performative and exploratory activities which not realize
    values and would not be maintained. Linguistic activity is maintained, adjusted,
    and altered as a “way of caring for others, for ourselves, and for the world”
    (Hodges 2007b: 174). Caring can be defined as working (i.e., being discomforted)
    to realize values in some encounter (Hodges 2007; Hodges and Lindhiem 2006). There
    is some biological and psychological evidence that suggests caring as a function
    as a physical-social-moral system (e.g., Taylor 2002).


    To be caring is to be anxious and meticulous, and prudent, in assessing and addressing
    a situation — whatever or whoever is cared for. It is to serve the good of event
    or the participants in, in light of the larger circumstances within which the
    event is embedded. The creative choices made will realize values, if the caring
    is to be. To care for someone is to become dependent on them, to put oneself at
    their service, but it requires their dialogical willingness to be cared for. Each
    serves the other in a way, and both serve values, if the relationship functions
    in the flourishing way self-organizing, complex systems do in states of criticality
    (Kloos and Van Orden, 2009).


    Claiming that conversing intends to realize values and embody and enact caring
    does not mean that all linguistic activity is judged good. We can and do make
    claims about utterances inarticulate, awkward, false, irrelevant, careless,'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'inconsiderate, and cruel. Ecological theory does not take these claims to idle
    impositions of personal preference or oppressive structures of social power, although
    they may be, but judgments that are meant to realize values, and are themselves
    subject to judgment.


    Speaking and listening to each other (or ourselves) is always acting appropriately,
    in ways that make appropriate use of prior resources and find appropriate ways
    to "go on" both in the conversation and in life (Hodges 2007a:597–598). Values
    are what makes it possible for linguistic activity to be creative, to challenge
    as well as acknowledge societal practices and their authorizing powers, and to
    violate or alter rules, not as an assertion of autonomous will, but as an act
    of social solidarity and trust (Hodges 2007a; Hodges and Geyer 2006).


    Approaching conversing as a caring system reality aspires to avoid influential,
    limited models for understanding language: one is to posit language''s function
    in terms of representation; the other is to frame language in terms of tool. Both
    see language as a means of fixing reality: language-as-representation aspires
    to realize reality into the ego''s image or toward societal goal. language-as-tool
    works to manipulate reality into ego toward some societal goal. On the representational
    view, which has dominated cognitive psychology and linguistics, autonomy has been
    the watchword (e.g., the autonomy of syntax; I-language). The tool-model, itself
    an attempt to get past the passivity of the representational view, recognizes
    the importance of coordination (Clark 1996:72–91) and even cooperation (Grice
    1975:47), but usually with the point of maintaining control or achieving a goal.
    By themselves, goals and control are insufficient to account for why we listen
    and speak with each other. If we did not care, we would not speak or listen, and
    if our caring were limited to achieving goals and controlling actions, then what
    passes for conversation would be reduced to a code and a tool after all.


    To explore further the nature of language as a caring action-perception system,
    and the centrality of complexity and dialogical relations to its dynamics and
    integrity, we need to move in a surprising direction, at least for ecologically
    oriented researchers. We need to consider cognition and more specifically consciousness.


    However whatever may emerge from this move will be surprising from the perspective
    of traditional cognitive theory: the focus will be on pragmatics and dialogue
    rather than on computations and control.'
