  md: 'insight entered psychology on the basis of Köhler’s (1925) work with chimpanzees.

    In one example, Sultan, a captive chimpanzee ‘insightfully’ joined two sticks
    to a pole for reaching bananas (Köhler 1925: 188). Although tool based, this was
    viewed as a change in (neural or mental) representation. Whether or not an ‘aha’-feeling
    occurred, the ape restructured its environment to reach its goal (the hanging
    bananas). The use of sticks as a pole is as peripheral to the ape’s insight as
    humans too, material artifacts are usually regarded as marginal to problem solving.


    Material artifacts lack any standing in cognitive psychology. Where acknowledged,
    they are treated as constraining and guiding behavior by reducing the load on
    working memory (Gilhooley and Fioratou 2007; Zhang 1997; Zhang and Norman 1994).
    Seeking to redress the balance, the paper examines how material artifacts contribute
    to insightful thinking. To do this we contrast how different artifacts contribute
    to solving the same problem (viz. pen and actual objects). This permits us to
    construct two externalist cognitive models. First, for Clark and Chalmers (1998)
    artifacts scaffold cognition. For their extended mind (EM) view, it is predicted
    that, in some circumstances, material objects augment cognition. Second, following
    Hutchins (1995), it is posited that distributed cognitive systems can connect
    people with objects (see Zhang and Norman 1994; Zhang 1997). Rather regard artifacts
    as themselves part of cognition, they exert causal effects on body-world experience.
    On the distributed cognition (DCog) view, material objects are more likely to
    augment cognition than other objects. This mirrors debate on whether language
    is part of (inter) action or, rather, the ‘ultimate artifact’ (Clark 1997:218).
    On the DCog view, verbal patterns are second order constructs (‘words’) that constrain
    anticipatory processing and first-order language (see Love 2004; Thibault 2004;
    Cowley 2007; Järvilehto 2009). By contrast, on the EM view language is a cognitive
    tool. For Clark, the material symbols of language alter the nature of computational
    tasks involved in various kinds of problem solving (1997: 193).


