  md: '# The role of anticipation in reading 19


    Were the linear processing hypothesis correct, we would expect striking differences
    in time-intervals between ''normal'' and ''scrambled'' text. This is because,
    on the decoding model, text is analysed and processed in a linear fashion. Thus,
    analysis of scrambled words should take longer than that of normal words, and
    it would be predicted, this would apply even when these were continuous (viz.
    writtenwithoutspaces). By contrast, on the anticipatory model, the scrambling
    of letters is expected to make less difference than whether they are discrete
    (normal) or continuous. This is because to generate meaning, an anticipatory model
    requires only that we use fragments of an inscription.


    Since the most conscious changes were associated with ''continuous'' text, this
    supports the anticipatory model. In fact, participants had little difficulty in
    reading the scrambled text. The ''continuous'' condition that slowed reading down
    and significantly disrupted the normal reading rhythm. Findings are contrary to
    the linear model. They suggest that appeal to linear decoding of inscriptions
    provide little insight into the reading process.


    The type of text has a significant effect on fixation-speech. Thus, as noted,
    the longest intervals were associated with the continuous text. Other significant
    differences were found in how fixation-speech intervals correlated with an item''s
    location on the text. While ''words'' at the beginning of the text line were associated
    with short intervals, those in the middle of the text line elicited longer fixation-speech
    intervals. This indicates that the duration of FSI is not correlated with parafoveal
    preview (for the possible significance of parafoveal preview in reading, see Vitu
    1991).²


    # 3.2 FSI in relation to articulation, sentence structure, and reading experience


    Recent work has used FSI measures that are accurate within 4 milliseconds.³ This
    allows closer investigation of relation between reading and speech (especially
    at the role of articulation), sentence structure, and reading experience. In the
    experiments we presented for normal reading three types of Finnish texts (a fairy
    tale about sheep and goat, not known to the subjects). As this was presented in
    scrambled, discrete, and continuous versions. Each participant was asked to use
    normal reading speed in dealing with screens of text (with approximately the same
    number of letters in each trial). Each screen consisted in a trial: the first
    consisted in discrete text. The second, letters were scrambled (for about 50%
    of the words only the beginning and the end was: e.g., the subject had to read
    this kind of words and, in the third continuous trial, words were written without
    spaces (e.g., thesubjecthadadtoreadthiskindoftext).


    Eye movements were recorded with an EyeLinkII (SR Research) tracker using pupil
    and corneal reflection tracking (accuracy of sampling 4 ms; noise <0.1'
