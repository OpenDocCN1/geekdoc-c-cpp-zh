    The cognitive potential of natural linguistic signs (words and utterances) is
    greatly extended with the invention of graphic signs. This is because they can
    exert orientational influence across different time scales and, by so doing, become
    a major historical factor. For example, the cognitive potential of phonetic signs
    is limited by durational and other thresholds of auditory perception. As a result,
    the distance between languing humans and their respective bodily orientations
    in real time can become spacious. This, indeed, gave reason for the use of visual
    symbols systems like semaphores. But as soon as phonetic features of the speech
    are replaced by artifacts symbolically used in communication — as graphic images
    — they cease to be signs of natural language.


    In contemporary scientific discussions the sign and symbol are often used as synonyms.
    Thus, in first-generation cognitive science, written marks be- ''symbols'' that
    are devoid of meaning. Basically, this leads to the symbol-grounding problem (Harnad
    1990; Cowley 200b; Belpaeme and Cowley 2007) or, roughly, that of reference be
    to purely abstract forms. This arises when abstract symbols (graphic artifacts)
    are identified with signs of natural language or acoustic phenomena that are integrated
    in dynamically complex behavior. From a human perspective, signs of natural language
    are never abstract, no such problem arises. It is thus useful to use sign and
    symbol in discriminating concepts (Kravchenko 2003). In etymology, the meaning
    of the Latin signum is ''mark'', while that of symbol (from symbolum, a borrowing
    from Greek: συμβλον), is ''put together'', ''thrown in''. Thus, while signs evoke
    perception and experience, symbols presuppose something more elaborate. Physical
    spoken words are signs — perceived empirical phenomena (dynamic actors) which
    function as ''marks'' of perceived experience. As for corresponding graphic images
    we call ''words'', they are merely symbolizations of phonetic signs. Graphic images,
    such as letters of which written words are made, are abstractions that have been
    ''put together'' and ''thrown in'' to the relational domain of human behaviour.
    Of course, once words begin to play a crucial role in human life, they transform
    our cognitive abilities. (Fenary 2007).


    A system of graphic signs, such as alphabetic writing, enhances human developmental
    continuity. This is possible because texts mediate relevant experience between
    generations and communities. As Donald (1991) notes, it also has evolutionary
    implications. However, new linguistic functions compete with older ones. Texts
    no longer perform the index functions of natural languaging or, indeed, permit
    real-time integration with concurrent activity. Whereas speech is usually coordinated
    between people, dealing with texts, we orient to — not living bod-'
