  md: '# Semiotic cognition and the logic of culture*


    Barend van Heusden

    University of Groningen, The Netherlands


    In this paper I argue that semiotic cognition is a distinctive form of cognition,
    which must have evolved out of earlier forms of non-semiotic cognition. Semiotic
    cognition depends on the use of signs. Signs are understood in terms of a specific
    organization, or structure, of the cognitive process. Semiotic cognition is a
    unique form of cognition available to humans, the semiotic provided the ground
    structure for an evolutionary development that was no longer strictly Darwinian,
    but followed its own — semiotic — logic. In the increasingly abstract ways in
    which the ubiquitous difference is dealt with, we discover this logic of cultural
    evolution, which determines the course of long term change.


    **Keywords:** cognition, cultural evolution, meaning, semiotic cognition


    # 1. Cognition and representation


    In the course of evolution, through variation and selection, living species acquired
    a variety of patterns of reactions. These patterns, which secure the species''
    survival in a certain environment, are mostly genetically encoded but sometimes
    learned by single animals through mimicry, or imitation of other members of the
    species. The patterns of reactions constitute the *memory* of an organism (that
    of a single individual as well as that of species). They provide an organism with
    a *representation* of its environment (cf. Changeux 1997:115). We do not have
    to assume that representations are, as such, cultural or semiotic, or even ‘rational’,
    as instance De Sousa (2007) would have. Neither do we have to conceive representations
    as images ‘in’ the nervous system of the organism, or as coded information that
    has to be perceived, recognized, or decoded by a homunculus (cf. Clark 1997:143f).
    Representations of the environment are patterns of neuronal sensory-motor activity.
    If such a pattern is activated, the environment acquires meaning for the organism
    (the acid for an amoeba, the skin for the tick, the fly for the frog, my walking
    to the door for dog, the antelope for the lion, and'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'this paper for you. Patterns of reactions are triggered, and as long as they
    match, an organism lives in a meaningful way, being a world which ‘recognizes’.
    The activity allows it to maintain its homeostasis and survive — at least as long
    as as is necessary for successful reproduction. Whether one is dealing with the
    unicellular, ticks, frogs, dogs, lions, or humans, when we say that something
    has meaning we assume, either implicitly or explicitly, that this something triggers
    a more or adequate (re)action in the organism. The amoeba moves away from the
    acid, the tick it falls onto the skin, the frog unrolls its tongue to catch the
    fly, the dog runs towards the door for the afternoon sun, the lion hunts the antelope,
    and the human sits down to read a scientific paper.


    The meaning of an environment is thus dependent on the bodily anatomy and the
    behavioral patterns of an organism. This view of the world of full meaning can
    be traced back to the work of Jakob von Ueckill (1920: 1940; cf. also Clark 1997:237f).
    We should not forget, however, that the case of the fly, as we perceive it is
    because of our patterns of reactions — nor the frog probably knows no flies (about
    frogs, for matter), nor do we know ‘what it is to be a frog.’ Its world, i.e.,
    the affordances of the frog, is determined by its frog-anatomy (Gibson 1979: 33–44
    and 127–143).2 If something has triggers an action. No action, no meaning. At
    least so it seems, as we will see, there is more at stake. We could get rid of
    the somewhat loaded term ‘meaning’ and decide that we are talking about patterns
    of behavior of organisms. If such a pattern of behavior is activated, the situation
    has meaning for the organism, if it has not, it has no meaning. From this behaviorist
    perspective, ‘meaning’ becomes no more than a word for programmed or learned behavior.


    This meaningful interaction with an environment brings with it certain risks.
    Situations are either recognized or they ‘re not’ — in the sense that without
    a reaction they simply do not exist (except, of course, for an external observer).
    What if something happens is not matched by the behavioral patterns available?
    What if no representation at all, and therefore no adequate reaction either? As
    I have said, from the perspective of the observer, the organism will either be
    lucky, or dead. In the latter case, from the perspective of the organism, life
    stops. Thus the whole system works well in a more or less stable environment.
    In the case of sudden changes, the organism stands with empty hands (or feet,
    tentacles, etc.) and can only hope that genetic variation will help the species
    out. Eventually, if the animal able to learn, it might succeed in adapting through
    a process of trial and error. If not, so much the worse, so as many species experience
    nowadays — being unable to develop an adequate response to human predation quickly
    enough.3'
