  md: 'In information processing models, decoding is data driven. For theoretical
    reasons, we are assumed to approach texts with grammars andor mental lexicons
    in the brain. By investigating the time-course of reading, we have shown this
    view to be implausible. Measurement of FSI, however, enables stronger claims.
    Hitherto work on distributed language has emphasised the role of dynamics, i.e.,
    language is grounded not just in word-forms, but in “the embodied, situated and
    cultural dynamics of talk” (Cowley 2007a: 106, 2007b). Given the focus on dialogical
    and directed speech, little or no experimental work has examined the dynamics
    of reading. It is important that FSI shows reading to be anticipatory. The subject
    integrates inscriptions with previous experience by making sense of what is before
    the eyes.


    # Anticipatory dynamics in reading


    Information processing models use a weak notion of anticipation (or ‘readiness’,
    ‘preparation’). The term is used to evoke waiting for the activation of an inner
    model with which a stimulus can be compared (see e.g., Neisser 1976; Rosen 1985),
    or, in other contexts, as a general process to advance the processing of the incoming
    stimuli.


    # 4.1 The concept of anticipation


    On the view taken here, the organism-environment system organises by means of
    anticipation (Järvelehto 1998a:331). This shapes both prospective acts and features
    of the environment influence the processes that lead to action results (e.g.,
    reading aloud). The nervous system does not wait to compare stimuli with inner
    models rather shapes events in a process of continuous transformation. The organism-environment
    systems’ anticipatory organisation determines what constituents will serve to
    realise a person’s actions. Long before accomplishing a task, continuous transformation
    prepares a system to use environmental constituents (e.g., inscriptions on paper)
    while configuring movements (e.g., control of laryngeal activity when uttering
    the word). Action is thus almost simultaneous in any task that makes critical
    use of environmental features.


    In reading, many processes that are often followed to follow stimulus occur even
    before measures are made. This is because in an experimental setting there is
    much that knows in advance. As no surprise that a text is presented in visual
    form or that it has to be read aloud. Anticipatory organisation is thus completed
    as the eye fixes an inscription, and by so doing, comes up with the action result
    (e.g., articulation of a specific word).'
