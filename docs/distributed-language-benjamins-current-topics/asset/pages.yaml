    then this skill can be extended by a naked brain. Thus, in Clark''s extended program,
    some crucial cognitive processes are, inherently bound.


    This is rather surprising, as it actually runs counter to the substrate-neutral
    functionalism that allows the mind to extend beyond the brain and body. When some
    of Clark''s critics (e.g., Adams and Aizawa, cf. Clark 2008:85-99) accuse him
    of advocating the view that because it is part of a cognitive system (the notebook
    is intrinsically cognitive), they fail to understand the functional principle.
    This is because, if taken seriously, what is true for the mind is not necessarily
    true for each of its parts: if my car is capable of auto-mobility, this does not
    imply that the transmission or the fuel tank can move by itself. The functional
    principle prompts us, whenever we meet a phenomenon that exhibits signs of cognition,
    to investigate if this is because the phenomenon is intrinsically cognitive, or
    if it is part of a larger system. Clark''s functionalism is based on the priori
    claim that we experience ourselves as cognitive, the individual cognizer aligns
    the centre of (extended) cognition. We need to consider the possibility that human
    beings constitute a single cultural cognitive network (Donald, 2001) that achieves
    a high degree of co-ordination through languaging.


    Whereas the term extended implies a point of origin, the term distributed carries
    no such connotations. Indeed, from a distributed perspective, there is a simpler
    and more radical way to understand the social dimensions of the extended mind.
    This can be done by dismissing the hypothesis of organism-centered cognition altogether.
    Rather, if cognition is extended into a social domain, the extending may be controlled
    by many brains and bodies. Human cognition is often organism-centered, which of
    course does not imply that cognition takes place independent of organism. In a
    similar view, Timo Järvilehto argues that "mental activity cannot be localized
