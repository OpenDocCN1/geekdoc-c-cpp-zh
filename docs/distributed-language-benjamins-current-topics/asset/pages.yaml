  md: '# Symbols as constraints


    # The structuring role of dynamics and

    self-organization in natural language*


    Joanna Rązaszek-Leonardi

    University of Warsaw, Poland


    The paper draws a parallel between natural language symbols and the symbolic mode
    in living systems. The inextricricability of symbols and the dynamics with which
    they are functionally related shows that much of their structuring is due to dynamics
    and self-organization. It is also stressed that important factors that determine
    the shape of language structure lie outside individual mind/brains and they draw
    on time-scales quite different from those of phenomenological experience. Analysis
    of language into units and subsystems is not straightforward, since they show
    functionality on many levels and many time-scales. Finally it is recognized, as
    a specific and specialized system of inter-individual coordination, natural language
    is many hierarchical levels away from simpler forms of information transmission
    in biological systems.


    **Keywords:** control, constraints, dynamics, measurement, natural language, symbol,
    symbolic structure


    # 1. Introduction


    Investigations of natural language are conducted from perspectives that depend
    on the domain of science, available methodology, and on cognitive and practical
    motivations. Cross-talk among the domains is often difficult in that terms are
    often defined differently. This is because they are rooted in diverse theoretical
    traditions and, looking bottom up, by different modes of operationalization and
    data gathering. Differences concern those terms which are crucial for specification
    of the phenomena under study. This applies, for example, to the terms language
    and linguistic symbols. For those fascinated with the evolution of human communication
    gave rise to beautiful and intricate sound-systems, emphasis falls on accurate
    formal description of the system itself and, where needed,'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'models of their ontogenetic and/or on-line generation. On this view, the term
    language identifies a system of symbols (linguistic elements corresponding to
    words) that are lawfully connected by grammatical rules; the main goal of linguistics
    is to discover those rules. By contrast, those interested in how language shapes
    interactions tend to focus on dynamical processes and mechanisms which make language
    an important social-regulatory and coordinating device. From this perspective
    the term language identifies both the sound patterns exchanged and dynamical processes
    in which these sound patterns are engaged. It is inextricably bound up with the
    dynamical variables that shape interactions. It is unlike an artificial code.
