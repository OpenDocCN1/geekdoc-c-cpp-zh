  md: '# About the Authors


    Stephen Cowley is a Senior Lecturer in Developmental Psychology at the University
    of Hertfordshire, UK. Although his PhD and early career were in Linguistics, since
    2000 he has lectured in Psychology and Cognitive Science. Recent empirical work
    has focused on interactions between mothers and infants, children and robots,
    and simulations of health emergencies. He founded and co- the Distributed Language
    Group, a growing community who aim to transform the language sciences by focusing
    on directed, dialogical activity imbues human intelligence with a collective dimension.


    Timo Järälehto is Professor of Psychology in the University of Oulu since 1986.
    His basic field of study is brain research and psychophysiology, starting in the
    1960s with EEG problems (CNV, evoked potentials), extending to problems of sensory
    physiology and psychophysics (human microneography), and to units in behaving
    animals. Since 1990 he has been developing psychological theory under the heading
    “systemic psychology” based on the Theory of the Organism-environment System.


    Veli-Matti Nurkala has a Master’s degree in Sport and Health Science and is currently
    doctoral student in the University of Oulu (Skilllab). His doctoral thesis investigates
    the time reading process in different reading situations in order to develop a
    model of reading process. His other interests include emotional dynamics, well-being
    and stress levels of athletes and pupils.


    Kyösti Koskela has a Bachelor of Engineering and is currently studying for a Master
    of Sport Science at the University of Jyväskylä. He is currently working as a
    laboratory engineer in Skill, specialising in movement research. His other fields
    include motion attention, heart rate variability, and electromyography in skilled
    actions.


    Alex Kravchenko is Chair of the Department of Foreign Languages at the Baikal
    National University of Economics and Law. Since the late 1980s he has worked in
    cognitive linguistics and, specifically, the perceptual grounding of grammatical
    categories. He developed a unified cognitive theory of aspect in English and Russian,
    and more recently, he has focused on the biological theory of language and cognition,
    the phenomenology of semotics, and epistemological issues in philosophy of language.


    Evridiki Fioratu is currently a Research Fellow at the University of Aberdeen,
    working on anaesthetists intraoperative problem solving. She has previously been
    a Research Fellow at the University of Hertfordshire on problem solving projects,
    including individual differences and verbalization and self-explanation effects,
    on the student population. Her research focus is on the cognitive dynamics affecting
    problem solving in the lab and “in the wild” and she is an advocate of the distributed
    cognition approach.'
