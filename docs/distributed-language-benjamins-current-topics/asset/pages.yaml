  md: '# 3.2 Coding procedure II: Semiotic strategies


    While the first procedure explores the ''signal vs. non-signal'' contrast, the
    second focuses on different kinds of meaning-constructing strategies. The analysis
    is motivated by the differences in the participants'' relative inclination to
    align their interpretative strategies to images of the experimental and control
    conditions. As indicated by the results from the first coding procedure, properties
    of the experimental scenes (but not control scenes) afford semiotic strategies
    of interpretive explorations. These seem guided by intersubjective norms. Next,
    therefore, we assess how participants attend to similar meaning-constructing strategies
    in their construal of images of the experimental conditions. Focusing on social/semantic
    meanings, we look more closely at the relevant image descriptions Since Since
    questions relate to subsets of the data (i.e. small sample sizes), we proceed
    in a rather qualitative fashion. Hypotheses are thus formulated *post hoc* and
    analysed more subjectively.


    The interpretative work in attributing social meaning to a red iceburg (cf. Figure
    1f) differs fundamentally from that applied to a flour-arrow on a forest path
    (cf. Figure 1c) or roses on the street (cf. Figure 1b). In coding, therefore,
    asked how semiotic strategies regulate meaning construction. In constructing material
    signals, we found recall Peirce''s (1998) classification of sign types as iconic,
    indexical and symbolic. They are:


    +   1) An *iconic/aesthetic strategy* where attention is put on objects'' resemblances
    and diagrammatic affordances (Stjernfelt, 2007): (e.g. a red iceburg associated
    with blood).


    +   2) An *instructional strategy*, where object configurations are experienced
    as social imperatives, pointing to something or instructing the perceiver to adapt
    his/her behavior, example: (e.g. a flour arrow shows directions).


    +   3) A *symbolic strategy*, where material objects are appreciated for their
    conventional reference to arbitrary cultural meanings (e.g. roses express grief
    in relation to a sudden death).


    Each of the image descriptions previously tagged as *social, semantic meaning*
    were rated by an expert coder in relation to the three interpretative strategies
    specified above. Ratings were then summarized and analyzed for participants''
    relative alignment of interpretative strategy. The aim of this analysis was to
    establish the extent to which participants tend to choose similar interpretative
    strategies in constructing a material signal. Alignment was measured by the percentage
    of agreement in semiotic attitudes to each of the images of the experimental conditions
    (that is, the relative propensity of participants to choose the same strategy
    in their exploration of an image).'
