  md: 'For Thibault, as well as for Shaw and Turvey, the focus of the alterity is
    attentement. Thibault proposes that when a person inhabits their environment in
    a sustaining way (i.e., attentement), there is “dialogic closure” and “no self
    per se of which we may be self-aware (2004:230). This suggests that the consciousness
    of attentement differs from self-consciousness. I think he is right about this.
    What Thibault has identified as something like Csikszentmihalyi (1991) has called
    flow, or what might be a sense of something other as in “the lost”, completely
    given to the activity. A fabulous conversation over a great meal with friends
    illustrates such selfless closure. The burden of time seems absent. The experience
    is like a “taste of heaven”.


    But that, I suggest, presents a problem. Consciousness is marked — weighted, really
    — by a sense of something other than attent. The contextualizing and recontextualizing
    Shaw and Turvey read as intrinsic and harmonious, pragmatic theorists (e.g., May
    2001) as extrinsic, and by asymmetry, exclusion, and alienation. Here, I, pragmatic
    theorists have a point, and one that teleological theorists need heed.


    The hypothesis that I (Hodges 1997) find coming of the origins of consciousness
    is that its roots are historical (Taylor 1908, Mead 1934; Vygotsky 1988), and
    moral (Iopling 1993), inextricably linked to the rise of a sense of self — not
    the ecological self which is the reciprocal of the environment, but a rather self
    by a sense of separation and alienation. The conditions of emergence for consciousness,
    according to many theorists, are forms of interruption. “We have had experience
    of automatically driving a car, typing a letter, or even participating in such
    failure as a defective brake, a stuck key, or of being suddenly brought up by
    some failure or a “You aren''t listening to me” (Mandler 1985:72). Interruption,
    Mandler calls for structuring, choice, or trouble-shooting. The consciousness
    arising from interruption can be painful; in fact, Mandler suggests that pain
    be the most insistent form of consciousness (Ibid.: 67). More generally, consciousness
    is marked by a kind of suffering, a discomforting that challenges the human and
    conventional. According to Baars (1997:16), he proposes the most profound and
    universal of conditions that provoke consciousness is that of loss. The most compelling
    form of loss is death. Knowledge of our impending debts, I once suggested (Hodges
    1997:8), may be the focal point of consciousness, and why we be scientists are
    sometimes reticent to address consciousness. Deacon (1999:22) observes that only
    humans ponder “what it will not like to be” and claims that knowledge of “the
    inconceivable possibility” (436) of one’s own end creates a “foreboding sense
    of … impending loss” (437). Death could be viewed as the dialogical horizon for
    the pragmatics of life.'
