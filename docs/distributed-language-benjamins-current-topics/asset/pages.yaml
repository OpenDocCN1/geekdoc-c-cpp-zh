    +   1. Attempts at developing non-symbiotic approaches to cognition have been
    in neuroscience (Freeman and Skarda 1990), some neural network models, and dynamical
    systems theory (Van Gelder and Port 1995). The "symbols" that we use under these
    approaches are the mentalic representations (the view of cognition as computation
    over these). As it will be shown, the symbols that seem necessary for a Pattee
