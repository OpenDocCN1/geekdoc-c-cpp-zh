  md: '# Semiotic cognition and the logic of culture 119


    From a humanities perspective, this view of the animal world as a world full of
    meaning is far from self-evident. It requires some sort of switch of mind. Scholars
    are used to thinking of meaning as something that pertains to the world of human
    culture, and is directly related to intentionality and the use of signs, language,
    discourse, and texts. This may make it difficult to accept that, for instance,
    the world of a lion spotting, hunting, and catching its prey can be conceived
    of being ''meaningful''. If meaning, as a single phenomenon without any further
    specification, is something we find in all living beings, we no longer have to
    bother about meaning in humans in particular. Importantly, we may be able to study
    meaning in humans with the same methodology as we study it in other beings (and
    maybe even in machines, as it cannot be excluded that meaning exists for machines).
    Humans are animal species after all, and as a bird is known by its note and by
    his talk, why make a fuss? We may be a little more complicated in respects, but
    we are not essentially different.


    In semantics, this perspective was firstly established by Charles Morris, who
    presented his theory of signs in 1938 in the framework of the Encyclopaedia of
    Unified System. A similar perspective seems to justify attempts like the one by
    Mesoudi, Whiten, and Laland (2006), to elaborate a unified science of cultural
    evolution. These authors state, self-confidently, that "culture exhibits Darwinian
    evolutionary properties." If this is accepted," they say, it follows that the
    same tools, methods, and approaches that are used to study biological evolution
    may productively be applied to the study of human culture, and furthermore, that
    the structure of a science of cultural evolution should broadly resemble the structure
    of evolutionary biology" (Ibid.: 329). The transfer of biological methods and
    tools to the study of human culture seems to be justified on the basis of the
    similarity between the non-cultural (biological) and the cultural. According to
    the authors, in fact, the underlying processes in the two fields (biology and
    culture) are so similar as to lead us expect a correspondence (Ibid.: 330). This
    similarity is easier to accept if, in the biological realm, organisms also deal
    with meaning.


    Although nothing opposes this point of view in principle, it should not be grounded
    in a simple transfer of terminology from the one domain — that of the study of
    human culture — to the other — that of research into animal behavior and living
    beings. There are reasons to be wary of supposing that because is similar, the
    phenomena will also be similar. This would be wishful thinking. Rather, we have
    to ask ourselves what is meant by the terms and whether we are in fact dealing
    with one and the same phenomenon.'
