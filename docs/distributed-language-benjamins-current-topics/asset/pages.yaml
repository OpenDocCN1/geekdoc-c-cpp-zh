  md: '# 2.0 The recognition and comprehension of material signals


    The conceptual idea gives rise to predictions that can be investigated empirically.
    In a recent event-related fMRI brain imaging study Tylén and colleagues presented
    two contrast types of images to two-persons in a MR brain imaging system (Tylén
    et al., 2009). The stimuli consisted of a hundred photographic images of static
    everyday objects-in-context that were presented for five seconds in a randomized
    order. In the experimental condition, images depicted objects that called for
    an intersubjective interpretation (e.g. chairs put out in the street to reserve
    a parking space or a bunch of flowers on the doorstep of a private home to express
    a declaration of love, etc.). In the control condition the same objects were shown
    in canonical, instrumental, or accidental (non-communicative) contexts. The conditions
    contrasted objects experienced as intersubjective signals and objects that lack
    communicative relevance. Data analysis was based on the participants'' post scan
    classification of the stimuli images (communicative vs. non-communicative) in
    construction of potential differences in their understanding of the scenes.


    The experimenters found that when participants made communicative interpretations
    and explored the object configurations as sources of intentional meaning they
    had enhanced activity in part of fusiform gyrus (a structure also known as the
    Visual Form Area^part of Broca''s area, BA 45). Furthermore, later, in the pars
    parangularis of the inferior frontal gyrus, the activation of right hemisphere
    inferior gyrus showed sensitivity to the degree of conventionality of the expressive
    signals (the unconventional ones causing enhanced activity) as rated post hoc
    by the participants themselves. These same areas (especially left hemisphere Broca''s
    area) are consistently found in studies of verbal language and reading while the
    right inferior frontal gyrus has been shown to be modulated by nonverbal metaphors
    and figurative language that tend to depend more on contextual integration.^4


    The results complementing a growing number of cognitive neuroimaging studies that
    find Broca-activity with a variety of non-verbal, expressive activities like hand,
    body and facial gestures (e.g. Lotze et al, 2006, Lawrence et al, 2006), non-verbal
    vocalizations (Dietrich et al, 2007), musical patterns (Viust et al, 2005, 2006),
    and joint action (Newman-Norlund et al, 2008). Rather than an innate ''verbal
    language-’ or ''syntax module'' (c.f. Pinker, 1994 and Fodor, 1983), Broca''s
    area seems to be generally involved in interactive sense-making and meaning construction.
    Apparently, it contributes to a variety of modalities and expressive means including
    semiotic configurations of everyday objects (Tylén et al, 2009; Tylén & Allen,
    2009).'
