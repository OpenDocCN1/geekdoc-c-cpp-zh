  md: '# Insightful thinking: Cognitive dynamics and material artifacts


    # ## 6. Insight spreads


    In the CNP, insights cannot be traced to pure computation. Since bodies and artifacts
    contribute to solutions, people make use of material resources. As Newell and
    Simon (1972) saw, insightful thinking is nothing special. The problem, rather,
    is of grasping the problem. Necessary restructuring arises as inner processes
    are integrated with acts that generate contingencies. Insightful solutions arise
    as we anticipate effects. The approach challenges both cognitive internalism and
    extended mind. In real-time, artifacts can restructure effects in the human parts
    of a person-link chain system. This is temporary. Objects neither ‘supplement’
    cognition nor act as parts of a cognitive process. Rather they prompt to use experience
    to anticipate solutions. The problem space extends across the body’s owned world.
    In a distributed cognitive system, while causes spread, solutions emerge for a
    person.


    Our view is deflationary. Since insight uses nothing special, Clark is almost
    certainly correct that no new styles of neural processing support human language.
    Whether with materials activate the brain, physics matters. The flaw of extended
    mind is that it makes links, chains and ‘words’ of cognitive states. For philosophical
    reasons, Clark overlooks real-time effects. Instead of seeing that humans became
    skilled users of cognitive dynamics, he restricts their powers to material symbols.
    In this branch of functionality, the body can be replaced by mentalese/neuralse.
    Our findings, however, show the importance of how people act and, thus, anticipate
    (possible) effects. Playing down the necklace (and verbal) material, we emphasize
    how body-coupling generates layers of acting, perceiving and inhibiting. In short,
    it prompts us to anticipate. This is ironic. As Rupert (2004) saw artifacts as
    an unexpectedly ‘add on’ to a computational space, Clark (2008) treats life-history
    as an ‘add on’ to a public language. Both erroneously trace reasoning to *individuals*.
    On the distributed view, by contrast, weight is given to cultural practices. Using
    simple heuristics, history enables us to discover planning. By mid-childhood,
    we can integrate our activities with culturally derived strategies (e.g., we may
    read).


