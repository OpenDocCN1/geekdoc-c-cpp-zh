    +   3. For example, Zhang (1997) tested people in the game of 15, where two players
    take turns selecting from 0 to 9. The goal is to select the first three numbers
    that sum to 15. In tic-tac-toe, the problem offers a rich external representation:
    people use a 3x3 grid to take turns writing their symbol, often X or O, until
    they achieve a goal. The game of 15 actually proceeds from an internal representation
    that fosters poorer and slower appreciation of what is required for a traditional
    (tic-tac-toe) representation. Such representational effects illustrate that problems
    isomorphic at some level of depth vary significantly in terms of the richness
    of the information embedded in their physical representation. Hence the significant
    differences in solving strategies between the tic-tac-toe and the game of 15.


    +   4. It might be argued that thinks activates bits of mentalese/neural to correspond
    to abstract configurations. We regard the experiments as showing that our action-perception
    model is likely to be simpler.


