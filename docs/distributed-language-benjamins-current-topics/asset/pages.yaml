  md: 'The first is the argument that, whatever the role of symbol systems in human
    life, our daily living in a lived environment depends, first of all, on metabolism:
    we are metabolic first, symbolic second. According to this biogenic premise, cognition
    is Embodied (and not merely procedural), Embedded (and not representational),
    and Enacted (and not subjective nor objective).¹


    The second is a logical continuation of the first argument (though simultaneously
    in the field). Taking one step away from the Cartesian mind, this denies any sharp
    distinction between inner and outer, but makes active use of external referents.
    Building on this argument, we can add that cognition is not merely Embodied, Embedded
    and Enacted; it is also Extended, Distributed and Situated (cf. Robbins and Ayhede,
    2009). These claims are built on a wealth of empirical findings, both experimental
    and ethnographic.


    Hithero, as pointed out by Kiverstein and Clark (2009), there has been a tendency
    to rubric of all these post-Cartesian lineages together as “one church” of Embodied,
    Embedded, Enacted, Distributed and Situated cognition. The present discussion
    is written in the same spirit as their paper: I value the discussion of the differences
    rather than the celebration of the similarities, and I agree that such a discussion
    marks out an important moment in the evolution and maturing of the study of the
    embodied, embedded mind. It marks the moment of critical self-awareness and questioning
    distinctive of an emerging paradigm” (Kiverstein and Clark, 2009:6).


    As mentioned, the current chapter focuses on how language is, or can be, treated
    according to the extended mind hypothesis and the distributed cognition approach.
    The main ten of the discussion is a critique of Clark’s view on language; whilst
    I find his general views on mind and cognition groundbreaking, I find his treatment
    of language quite inadequate. Some of its weaknesses are shared by Hutchins who
    also holds a representationist view on language. Thus my errand is not to oppose
    cognitive anthropology with philosophy of mind. Rather, I make the claim that,
    if we adopt these tenets of cognitive science (cf. Steffensen, in press), we find
    that they necessitate a new approach to the dynamics of linguistic cognition.
    This claim is defended by presenting five claims that foreground relevant and
    critical differences. These will be elaborated one by one in the following five
    sections in this order:


    +   Language cannot be explained with reference to a ‘language system’, i.e. ‘a
    semiotic system for communication.’


    +   Language is ridiculously bound up with real-time metabolic activity (e.g.
    voice dynamics, gaze and task-oriented modes of action).'
