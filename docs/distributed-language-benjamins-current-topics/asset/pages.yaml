  md: '# Ecological pragmatics 143


    The basis for speaking of a dialogical array is a comparison with optic or acoustic
    arrays. An optic array is the different intensities of light in different directions,
    reflected from various bounded surfaces, ordered around an observation point.
    The differing intensities provide optical structure that a visual system can explore.
    What Gibson (1979) calls the ambient optic array is the sum of all these, the
    layout of all points and paths, surrounding an observer that can be explored by
    moving one''s eyes, head, and body. Visual systems do not respond to light, but
    to optical information, revealed in movement through the ambient optic array.


    A dialogical array is a group of hearer-speakers surrounding a given speaker-hearer,
    listening and talking in ways that reveal, inevitably, something of their perspectives,
    their intentions, and their histories relative to the present place and time.
    Like, the ordered gestures of the array, as well as their disordered and reordering
    over time, allow a participant in the array to have their own ordering on various
    scales. It is an array of partners, actual and potential, who provide information,
    not just about themselves as intentional agents and as objects, but about objects,
    events, and agents beyond the physical and temporal horizons of the immediate
    physical surround. As we probe with questions, declarations, examinations, proposals,
    and all the other modes of linguistic "looking," we can increasingly come to see
    (much as in ordinary vision) the real prospects for futures to be realized, and
    the real histories that have given body to a mode of perception. Language as a
    perceptual system provides for "distance perception" in a way we vision can never
    match. One of the tradeoffs, though, that it is less transparent as a medium than
    light, and it is far less continuous. It is full of gaps and often opaque. Nonetheless,
    dialogical arrays provide for retrospective and prospective perception that give
    real direction to our ongoing actions, as well as cognitive preparations for what
    might be future actions. Participation in dialogical arrays is a crucial skill
    for the wide-finding of humans.


    A dialogical array also provides a way of measuring the immediate environment
    more securely and accurately than can be done by an individual, even one that
    moves, putting herself in multiple positions over time. It is for this simple
    reason that we value multiple observers and descriptions of events in scientific
    laboratories, courtrooms, as well as the family dinner table. What emerges from
    dialogue is a super-vision that is equivalent to what would be possible if we
    were omniscient, looking at the world from every possible position in the optic
    array. But since many events are irreversible and if partially short-duration,
    it is better to share — if only partially and often painfully — the intersections
    of our words so that we can orient ourselves more completely and clearly in the
    world in which we find ourselves. Dialogical arrays help to orient us, to locate
    us, to give us a sense of place and event.'
