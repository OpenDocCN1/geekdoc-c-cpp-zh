  md: '# Beyond mind: An extended ecology of languaging 203


    In another ecological niche, parasites provide us with insights into how "a creature''s
    phenotype is extended not by construction but by instruction" (Waters, in press).
    Some parasites instruct their host to behave, more often than not in a way that
    favours the parasite''s life cycle at the expense of the host. For instance, the
    trematode Leucochloridium reproduces in birds, and sheds its eggs along the feces
    of its host. Upon hatching the larvae of the worm need to re-enter a bird''s digestive
    system to reproduce, which is obviously a challenge when you live in bird dropping.
    How does the trematode solve this problem? They get eaten by snails and the snails
    they take on their parasitic existence. The challenge is now to secure that the
    snail is eaten by a bird, but obviously, snails try to avoid catching the attention
    of birds. So...


    The trematode works its way up the snail''s eye stalks, which has two effects.
    First, it causes the snail to become phototropic, attracted instead of avoiding
    it, which is its usual mode. As a result, the snail wants to climb up into the
    sunshine. The snail itself begins to pulsate, animating the snail''s eye stalks
    to appear like a small insect. This attracts [...] an avian predator that ingests
    the snail and the enclosed world. (Waters, in press)


    As demonstrated by this example, extended phenotypes may function through constraining
    other ''phenotypes'' behaviour. As a way of constraining others'' behaviour, languaging
    is pervasive in inter-human relations, not just in face-to-face encounters, but
    also diachronically. As the trematode enter the eye stalks of the snail, langage-laden
    values and norms literally make their way into infants, as they auditorily digest
    their world offers.


    What both superorganisms and parasites testify is that collectives, voluntary
    or not, agents of other organisms are ubiquitous in the animal kingdom, and linguistic
    constraints on dynamics (cf. Raczaszzek-Leonardi, this vol.) are an important
    subclass for human beings. This insight needs to direct the monolithic distinction
    between language and non-language: talk, and other semantic types of behaviour,
    does not constitute a realm of meaning that is sealed off from other human behaviour.
    Though one can methodologically describe the relation between speech acts, or
    turns, by bringing forth, and finding forth one another in a strict sequential
    pattern, this does not provide us with a realistic explanation of what language
    is or does: when languaging, human beings create a meshwork of bio-socio-ecological
    relations (cf. Thibault, 2011; Steffens et al., 2010), and any claim of a distinct
    semiotic realm of sense-making relies purely on a specific perspective (cf. Giere,
    2006) projected onto a poly-human scenery by a semiotic observer.'
