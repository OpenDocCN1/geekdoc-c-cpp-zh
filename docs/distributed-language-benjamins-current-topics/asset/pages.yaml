  md: 'Keywords: material signals, semiotic affordances, intersubjectivity, conventionality,
    object cognition


    #  1.0 Introduction


    In this investigation we focus on a special types of object-mediated communication,
    that is, instances when we happen to perceive everyday objects like chairs, sprinkles
    of flower, or vacuum cleaners, as means of social coordination and construction
    of intersubjective meaning. This is accomplished when we recognize such objects
    or properties of our material environment as manipulated or arranged in a striking
    and deliberate manner that affords a special kind of semiotic exploration.¹ For
    instance, we can encounter counters out in the street to reserve a parking lot,
    flower sprinkled out in the shape of an arrow to indicate a direction, or rows
    of vacuum cleaners lined up on a lawn to create a conceptual piece of art.


    On a fundamental plane, this novel mediating function depends on context. There
    is no such thing as a contextless perception of object. An object is always perceived
    from a certain perspective, in a certain illumination, giving it a profile. Further,
    we bring all our previous experiences and current interests, valences and feelings
    to the encounter. Together, these give shape to perceptual experience. Perception
    of an object is thus jointly constituted by its inherent affordances and the immediate
    relevance brought to the encounter by the perceiver. Generally, this continuity
    between perception, thinking and action anticipation brings mindfulness to our
    experiences (Gallagher and Zahavi 2008).


    However, some cases of object perception cannot be exhaustively described in terms
    of “episodic”; first-person experiences. We sometimes encounter objects and properties
    where the recognized intervention of another agent gives them a special relevance
    to (Tylén, 2007). Specifically, the context is constructed for us in ways that
    profile social meaning-potential in the contextualized object. Examples of such
    constructed semiotic affordances carry out seemingly deliberate placement of objects
    in new and unfamiliar contexts, manipulation of properties such as color or shape
    and arrangement of common objects in a new composition (e.g. a symmetrical configuration)
    (Tylén, 2007). In such cases, perception is structured by more than how the object’s
    affordances bear on the state of mind and past experiences that we bring to the
    subject-object encounter. Rather, we argue, the recognition of the scene’s purposeful
    composition sets off an intersubjective attitude in the perceiver. Making sense
    of the object scene is heavily scaffolded by another, addressing agent.


    The effect of the experienced ostensive quality of a situation on perceptual meaning-making
    is studied in a series of recent behavioral experiments of infant'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Actualizing semiotic affordances in a material world


    cognition. In these studies (e.g. Gargely et al., 2007; Senju & Csiba, 2008; Senju
    et al., 2008), infants are found to respond differently to adult object manipulations
    in contrast to when they are engaged as active recipients. When an infant was
    experimentally framed as a third-person observer, adult behaviors were taken to
    express the dispositions of a specific experimenter (e.g. “Jane likes broccoli”).
    In contrast, the experimenter addressed the infant ostensively (such as making
    eye-contact, nodding and vocalizing in ‘motherese’), object-oriented actions were
    comprehended by socially shared information about the world (e.g. "Broccoli is
    good!"). The participatory engagement of the infant as an active recipient (rather
    than an observer bystander) thus has dramatic effects on her sense-making attitude
    (Gergely et al., 2007). Rather than relying on a ‘private’ and epistemic style
    of perception, the interactive recontextualization of bodily actions and objects
    makes mediators of shared ‘public’ meanings (Cowley et al. 2004; Cowley 2007;
    Tylén & Allen, 2009).


    We argue that such ostensive qualities of intersubjective encounters can be extended
    to our experiments with particular types of static object configurations. Prompted
    by seemingly contextual and compositional properties, our perception ceases to
    be ‘private’ and we engage as second-person recipients who activate semiotic potentials.
    Such active meaning arises from viewing object configurations as acts of signaling.
    In effect, we direct attention to the objects’ situated, recontextualized new
    details of the material scene become semiotically relevant (Tylén, 2007; Tylén
    & Allen, 2009). Perception becomes a kind of co-action whereby attentive scene’s
    compositionality afford receptive social engagement. Further, the fundamental
    asymmetry of the situation (the material signals considered here are inherently
    monological) the perceiver comes to rely on normative strategies to regulate semantic
    intention and interpretive actions (Picker and Garrod, 2004; Itkonen, 2008).


    This distributed approach to material signals finds support in recent cognitive
    studies showing that many forms of communicative mediation including bodily gestures
    and material objects resonate in brain areas, traditionally thought to be ‘language
    areas’ (cf. Tylén & Allen, 2009; Tylén et al, 2009; Rooenst, 2008; Spurrett and
    Cowley, 2004). In parallel, there is a widening consensus that various expressive
    means may have common onto- and phylogenetic origins (Zlate, 2008; Donald, 2002;
    Arbib, 2005).'
