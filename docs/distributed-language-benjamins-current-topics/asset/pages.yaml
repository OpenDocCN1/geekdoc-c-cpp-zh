    # 7. The limits of languaging: The writer and the clown


    A full account of the relationship of Shakespeare’s work to ‘languaging’ must
    take note of the tensions detectable between an emergent written theatre and the
    strongly residual physical “presentational” (Weimann 1998:00) elements of the
    plays. To return to *Hamlet*, we can see these tensions played out within the
    fiction itself, in Hamlet’s famous address to the visiting players, who are about
    to perform for the court as part of Hamlet’s attempt to entrap the King (3.2).
    Among other injunctions, Hamlet is concerned with the role of the Clown, whose
    job in the company was to provide physical and verbal humor, both within the fiction
    of the play and as the leader of the “jig” performed afterwards. Hamlet advises:


    Let those that play clowns speak no more than is set down for them. For there
    of them, who will themselves laugh, to set on some quantity of barren spectators
