  md: '# Insightful thinking


    # Cognitive dynamics and material artifacts*


    Evridiki Fioratou and Stephen J. Cowley

    University of Aberdeen, Denmar / University of Hertfordshire, England


    We trace how cognition arises beyond the skin. Experimental work on insight problem
    solving is used to examine how external artifacts can be used to reach the goal
    of assembling a ‘cheap necklace.’ Instead of asking how insight occurs ‘in the
    head’, our participants in Experiment 1 can either draw solution attempts or manipulate
    real objects (specifically, links that make up a necklace). Even performance with
    real chain links is significantly more successful than paper, access to objects
    does not make this insight problem simple: objects themselves do not shape cognition.
    This challenges extended mind views. While failure often results in the inappropriate
    (to the current insight) application of hill-climbing, material artifacts can
    trigger solutions. In Experiment 2, we used ‘open link’ conditions of the concretized
    problem to prompt participants to act (or think). arrived via serendipity, trial-and-error.
    By investigating how objects are used, we show that they do more than supplement
