  md: '# Semiotic cognition and the logic of culture 121


    not only recognize and act to a more or less stable patterns but they can also
    not *recognize* a pattern. What makes this even more astonishing and disturbing
    is that they do so at the same time, most of the time. But how can an organism
    *recognize* that, while *recognizing* that? Above I argued that for organisms
    absence of meaning coincides with absence — it cannot exist, at least for the
    organism itself. And yet, for humans, this difference between what they remember,
    and the ''here and now'' (about which there will be much more to say) is commonplace.
    It relates directly to our sense of reality, our sense of time and space, and
    our sense of self. We can try to eliminate it — one might think of such different
    things — as isolation cells in psychiatry or meditation techniques — but such
    attempts are generally doomed to fail. What distinguishes human cognition, and
    with human culture, from that of other organics is nothing, but the *absence*
    of meaning. The presence of this absence in human cognition is extremely strange.
    Yet, one might ask what the ability is good for — isn''t it a nuance? Second,
    how can it be realized biologically? Third, how would it have emerged in evolution?
    A theory of human culture and cultural evolution faces the challenge of explaining
    how biological evolution give rise to the specifics of human culture.


    The hypothesis I want to put forth is that absence of meaning, and with the emergence
    of the human sense of reality, time, and space, is the effect of a *double processing*
    of information. Human cognition draws on a peculiar system of representation (or
    ‘pattern matching’) we process what we see and hear² We process this information,
    at the *same time*, in terms of stable patterns. The consequence of this double
    processing is a *difference between*, first, the stable pattern, which corresponds
    to what we call *memory*, and second, an unstable, continuously changing pattern
    that we invoke the *here and now* of the *present*. In a conscious human mind,
    the patterns never merge completely.


    The deep ambiguity this ubiquitous difference creates is not the formal ambiguity
    we know, for instance, two mutually exclusive interpretations of one figure (as
    in the famous duck-rabbit drawing in psychology textbooks). This *semiotic* ambiguity
    is inherent in the occurrence of a pattern (semi, script or type) — where ‘occurrence’
    is an easy word whose, however, is very difficult to grasp. Something — in fact
    perceived — is both A (the stable pattern) and **not-A** (an unstable pattern).
    Further, the occurring **not-A** is always ~A; it is always ‘more or less similar
    to A all the time. The unity of sameness (the *pattern*) and difference (the unstable,
    changing pattern constituting the *occurrence*) seems to be the starting point
    of human culture. By hypothesis, this applies neurobiologically, cognitively,
    and evolutionarily.'
