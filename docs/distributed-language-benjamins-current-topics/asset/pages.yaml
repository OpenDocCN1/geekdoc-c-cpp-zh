  md: '# 5. Conclusion


    The intuition that the evolution of human culture depends upon an immanent logic,
    which is directly related to its semiotic structure is expressed, though of very
    different terms, in the work of Giambattista Vico (1744) and Ernst Cassirer (1923–1929;
    1944), as well as in that of the philosophers Erwin Panofsky (1939) and Alois
    Riegl (1966), and the historians Freud Bauer (1969) and Hayden White (1973). Less
    obviously perhaps, it also grounds the evolutionary psychology of Merlin Donald
    (1991, 1998). Cultural evolution seems to be not so much a matter of continuous
    ‘progress’ — which would imply an external viewpoint from which a value-judgment
    can be made — but of increasing diversity and complexity of the semiotic process.
    Though the basic semiotic structure is relatively simple, the reality of culture
    turns to be extremely wide and complex.


    The ‘double processing’ hypothesis presented in this paper would allow us to shed
    light upon the evolution of human culture, and of cultural evolution as well.
    Semiotic cognition become because of a change in the information processing system.
    Semiotic cognition may well be that “super module” which explains the specificity
    of human cognition better than the ones proposed until now — language and theory
    of mind.² In fact, it explains the emergence of language as one form of semiosis
    and of theory of mind as a consequence of the semiotic process. We do not need
    to assume the existence of a physical system — but what we do to assume is the
    existence of an organization which allows for semiotic cognition. This system
    is in place, a new logic of development can emerge. This logic of cultural evolution
    is based on what seems to be, in the end, a simpler criterion. Specifically, we
    need to ask if a sign or system system offers better choices of dealing with the
    difference that arises in a specific personal, social, and natural context. Further,
    in doing so, it does offer better choices of prediction and survival? Thus we
    come back to biology. The search for better solutions to the problem of difference
    can explain, I think, individual, social, and geographical variations in culture,
    as well as a steady increase in both abstraction and cultural complexity.


    ‘A more progressive and rigorous study of culture’ (Mesoudi, Whiten, and Lalande
    2006:329) I think, be beware of all too simple transfer of terms and concepts
    from biology to the study of culture. Culture is not necessarily more complex
    than biology. In fact, it may be simpler, ‘structure-wise’. Although grounded
    in biology, it is something else. The ‘double processing’ hypothesis offers a
    synthesizing framework. It differs in important ways from ‘dual processing’ views
    in that no appeal is made to combination of two or less autonomous'
