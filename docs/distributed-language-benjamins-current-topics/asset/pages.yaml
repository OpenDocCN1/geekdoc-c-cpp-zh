    Occasionally, we come up with something surprising, new, or effective. In everyday
    life, this may be a practical action and, in thinking, it may strike home as important
    or even true. We deem this insightful or, if verbalization occurs, showing insight.
    Traditionally, the process is traced to what happens ‘in the head’. Indeed,'
