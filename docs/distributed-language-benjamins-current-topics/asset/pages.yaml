  md: '# Languaging in Shakespeare’s theatre


    Evelyn Tribble

    University of Otago, New Zealand


    The enrichment of William Shakespeare’s plays in printed editions has led to the
    assumption that they were performed with an ideal of exact verbatim reproduction
    of the language. Evidence drawn from alternative versions of the plays circulating
    in Shakespeare''s lifetime and from our knowledge of the material practices of
    playing in early modern England presents us with a very different picture. Performing
    practices in this period were marked by a tension between improvisational here-and-now
    languaging practices, including the use of gesture in playing, and a new set of
    expectations based upon an emergent conception of plays as written documents.


    Keywords: distributed language, gesture, Shakespeare, theatre, written language
    bias


    # 1. Written language bias and the code view of language


    Nigel Love, among others, has pointed to the power of inscription technologies
    to shape the “code” view of language: “It is not language is a code that we are
    enabled to reify our thoughts. Rather, it is because (with the crucial act of
    writing) that we reify our utterances — treat them as instances of more abstract
    entities — that we (think) develop a code” (Love 2004:542). As Per Linelli has
    argued, a persistent written language bias undermeans the discipline of linguistics
    and extension, literary studies. The implicit equation of language with written
    language models as a “thing” rather than an active, dynamic, distributed process
    produced by “code-acting bodies” (Cowley 2007:577).¹


    The powerful back-formation is that the written language bias has far-reaching
    effects. This paper examines one: the implicit or explicit assumption that Shakespeare’s
    words are to be seen as codes for reproduction rather than a skeletal structure
    that constrains (but does not comprise or determine) performance. Written language
    bias would tell us that the plays consist of line and stage directions that can
    be reproduced in various ways, a view that the reification of the plays'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'in printed texts underscores. But if we instead take a multimodal dynamic view
    of the plays, we get a very different picture. Far from being a simple translation
    from page to stage, for actors in the 1590s mounting a play was an act of producing
    as of reproducing language. As I will argue, many assumptions in Shakespearean
    studies are essentially based on erroneous assumptions about the over-riding importance
    of the written word and the assumption that players held an ideal of verbatim
    reproduction of the author’s words. But the circumstances of play production in
    this period render such assumptions dubious. Indeed, they are often the result
    of a strong written language bias that assumes that players were attempting to
    conform as closely as possible to a written version of the plays authorized by
    the playwright himself. This led editors and bibliographers at the turn of the
    last century to attribute disparities between early published versions of the
    plays andor inaccuracies and incoherencies within them to dishonest attempts on
    the part of so-called *pirates* to reconstruct the playtext from memory. In this
    view, marks of improvisation, repetition, hesitation, and incoherence are all
    stamps of the actor’s oral performance with the pristine written word of the playwright.


    # 2. Background: The conditions of playing in the early modern theatre


    To understand the dynamics of playing, it is vital to understand the practical,
    material conditions of play production in this period, which differ enormously
    from those experienced by actors today. The conditions were roughly these: players
    formed up to six different plays a week, with an additional new play being learnt
    and mounted every fortnight. There were no long runs, as there are; a play might
    be repeated every couple of weeks, and it was almost unheard of the same play
    to be repeated on subsequent days. There were no directors, very few group rehearsals,
    no special lighting, and no built sets. The company itself was relatively stable
    and consisted of about eight *sharers* — men who jointly financed and managed
    the cast; either or so boys, apprenticed to actors in the company, who played
    all female and juvenile parts. The actors themselves were given almost authority.
    The actors themselves were given almost full authority to make decisions about
    movement across the stage, use of props, delivery of lines, and so forth; most
    preparation for plays consisted of the individual “study” of one’s own part (Stern
    2000:12).


    Three sets of written documents were used to mount the plays, spread evenly across
    the company. Every player received his “part”: his lines copied by hand onto a
    long scroll, separated by 2–3 word cues. Entrances and exits'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Languageing in Shakespeare''s theatre


    and major stage business were charted on a ''plot'', a large A-3 size piece of
    paper, probably posted back-stage and available for consultation. Finally, the
    company scribe prepared the ''play-book'', the complete record of the drama. No
    player, then, had access to the entire play — only his own part, and cues a schematic
    outline of his entrances.


    The ''play-book'' was very valuable to the company for several reasons. First,
    as the only complete record of the full play it was, which any parts should be
    lost or mis-transcribed. The book was also annotated with crucial production cues,
    especially cues for music and sound, which needed to be centrally controlled.
    Most importantly, it constituted an official legal document. No play could be
    produced in London without the signature of the ''Master of the Revels,'' a high-ranking
    court official who certified that the play did not contain politically or religiously
    subversive material. The official rule was that the players could not utter any
    lines that were not set down in the play-book. In practice, this rule could not
    have been enforced in any meaningful way (Potter 1986:87); rather, was meant to
    penalize any attempts to bring in topologically sensitive material after the play
    had been authorized.


    Any given play''s relationship to written documents is somewhat complex. On the
    one hand, the legal requirements for licensing placed a new-found importance on
    the text itself, in contrast to early, more improvisational modes of playing (Wiles
    1987; Weimarn 2000). The sheer mimetic demands of producing six different plays
