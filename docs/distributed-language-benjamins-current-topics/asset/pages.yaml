    which can be transferred across generations or between agents. From this point
    of view, symbols forms whose static mappings have no impact on dynamics.


    # 4. Communication: Meaning mapping or coordination?


    Pattee’s view of symbols is incompatible with positing that symbols “map” any
    “meaning”. Rather, their primary role is that of constructing functional structures
    and shaping coordinative behavioral patterns. Applied to natural language, this
    supports a functional approach that prioritizes the individual but how language
    sustains physical and social coordination. Mapping from hearer to speaker, i.e.,
    establishing common reference, which is usually taken to be the goal of communication,
    is no more than one linguistic function (Halliday 1975; Hymes 1972). Using language,
    parties achieve emotional and cognitive coordination. In such symmetrical interactions,
    each speaker provides and seeks out information (Hodges 2007). Indeed, the sameness
    of reference is itself brought into doubt when one recognizes that a specific
    use of an expression depends not only on objects important in a given communication
    but also on their subjectively, temporally, and contextually important aspects.
    Thus, if some meaning occurs, it may well serve the goal of coordination.'
