  md: '# The experiential basis of speech and writing 39


    literally are we to take this idea? Does it support the view that ''language''
    is an underlying ability? Or must we consider differences between speech and writing?
    While Clark''s appeal to material symbols is an attempt to avoid this, it is surely
    mistaken to overlook cognitive dynamics. Indeed, if we each had our own language,
    we would expect skills in social conversation to map onto our use of graphic signs.
    Yet, skills in speaking and listening do not correlate with literacy. More dramatically,
    on the autistic spectrum high performers may be literate and yet show lacunae
    in their languaging. There is a cognitive discrepancy between the two domains.


    Literacy is often seen as a matter of encoding/decoding mechanisms that are associated
    with written marks. As a result, the process is ''explained'' in a simpler way.
    Language acquisition is seen as mastering an inventory of linguistic signs and
    rules which permit meaning to emerge from sign sequences. Taking stock of what
    is included in such an inventory is accomplished by writing marks as resulting
    from the use of a special code. Here literacy is seen as an ability to perform
    a three-step operation of matching and identification:


    +   i. a particular letter (graphic encoding, or symbol) is matched with a particular
    acoustic phenomenon (sound type, or phoneme),

    ii. a particular concatenation of letters (the graphic word) is matched with a
    particular concatenation of sound types (the spoken, or physical word),

    iii. the graphic word is identified with the spoken word.


    These cognitive abilities are poised under the acquisition of reading and writing
    skills. This narrow view is quite inadequate. No one would think of a child who
    can use a pencil to draw unsophisticated lines and patterns on a piece of paper
    as an artist. Likewise, an child who can produce an octave on the piano while
    matching the sounds to the graphic symbols of music notation is no musician or
    composer. Although he can read the music score (is musically ''literate''), such
    a child cannot play the piano. But if a child can vocalize, more or less correctly,
    graphic representations of words, we may say,"He can read." The analogy with paintings
    and music masters—readers need to do more than decode other people''s thoughts.
    Any code-based view of literacy is, at best, radically incomplete.


    Education provides young people with tools and techniques for cognitive development.
    Literacy thus plays an important part in developing powers of reasoning and judgment
    based on the ''world on paper'' (Olson 1994). It is, however, an indisputable
