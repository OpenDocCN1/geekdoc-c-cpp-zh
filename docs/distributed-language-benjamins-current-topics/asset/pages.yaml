  md: 'If language is shaped not only by cognitive factors (Deacon 1997), learning
    and transmission properties (Steels, Brighton, and Kirby 2003) but also by the
    requirements of interactive coordination, similar physical and social worlds give
    rise to biases for shaping language. Thus, just as in Deacon''s explanation for
    “universal grammar” cited above, we should expect there be similarities across
    human cultures, and for this reason, commonalities in structure. In other words,
    we should expect the world to create “common adaptive contexts” for language evolution.
    Conversely, we can begin to think differently about differences in structure.
    Among other factors, these may point to and stem from how tasks are coordinated
    in a given society.


    This general view has many implications. Once we cease to give priority to symbol-mapping,
    mappings, we see that children by learning to control interpersonal events through
    language. From this it follows that language can be used creatively for on-line
    purposes: when situational factors exert an influence, innovations are likely
    to appear. In some cases, moreover, these may violate the ‘rules of grammar’ in
    linguistic descriptions. In Steels’ terms, “according to this dynamic coordination,
    language is forever changing. It is a complex adaptive system shaped and reshaped
    by the members of a population in order to satisfy their needs” (2006:349). Language
    adapts to coordinative needs, relying on the process of innovation generation
    and selection. As shown in linguistic and sociolinguistic studies, adults often
    deviate from what is semantically and syntactically “correct” for pragmatic reasons
    (Hedges 2007; Garrod and Pickering 2007). Galantucci shows creative processes
    in how we invent communication systems that are suited to various tasks. In cooperative
    settings, adults develop a complex communication system that functions in spite
    of mismatches in reference.


    Language effects coordination on many levels — from individual conceptual coordination
    (on-line and in development), to physical coordination by strictly physical, acoustic,
    and temporal variables that constrain posture and participant attention (Shockley
    et al. 2007), to emotional alignment (development and on-line), and cognitive
    coordination (interpersonal alignment of the situation view). The relevance of
    a multitude of shaping dynamical factors raises questions about the units of linguistic
    structure. One might expect that selective pressures act


