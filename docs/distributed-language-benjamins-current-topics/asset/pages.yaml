  md: 'An interesting example of the importance of measurement Evans and Levinson’s
    (2009) call for greater diversity in the sampling of languages used by linguists
    when making generalizations about linguistic patterns, claims about universal
    features). They argue that most of the languages previously sampled were more
    closely related in their historical development than realized, yielding an insufficiently
    representative sample of all existing human languages. In addition, language groups
    coming into contact with each other lead to changes in each other, as each takes
    the measure of the other. Over time, most of these differing language groups have
