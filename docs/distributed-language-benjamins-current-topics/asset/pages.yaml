    For this reason, the ‘individual cognizer’ is a *contradict in adiectum* when
    comes to linguistic cognition. When we observe how human beings draw on linguistic
    resources, it is simply false, that “Individual cognizing, then, is organism centered*”
    (Clark, 2008:123). Clark adopts this individualistic bias only because he makes
    the “(surely uncontroversial) assumption that the biological brain is, at least,
    the essential core in all episodes of individual human cognitive activity” (Clark,
    2008:118; emphasis added). On the distributed view, language is deeply collective.
    By linking dynamics with the affordances of the languaging stance we become biological
    individuals who act and think drawing on a multitude of peoples’ voices, values
    and verdicts in (polyphonic) reasoning. Clark argues that “languform reason allows
    us to engage with our own thoughts, trains of reasoning, and cognitive and personal
    characters” (59; emphasis added), he overlooks the deeply social character of
    language. fails to see that, given languforming, our thoughts cease to be strictly
    of our own. Interactions exist between the first person and the second person
    in the *medium of the third person* (cf. Bang and Door 2007);


    There is always an anonymous third party when we use language. The anonymous third
    expresses the cultural and social order that has pre-organized the language to
    a certain degree. This means the child learning a language is forced to consider
    the anonymous third. Often we do not reflect on these matters, because it is to
    believing that our inner speech is a conversation with ourselves and no one. We
    are empowered to believe that we are engaged in a ‘free’ conversation (Door 1998:40-41;
    cited in Steffen 2007:24).


    Human beings rely on cognition that they can draw from the social world. While
    language and the social order reshape our subjectivity, they also lessen our individuality.
    Using the anonymous third, we learn to monitor and adjust our behaviour and thoughts
    as we see it; we pay the price of being moulded by the norms and values of social
    reality. Wittgenstein is halfway correct in stating that “A concept forces itself
    on” (Wittgenstein, 1958:204; quoted after Cowley, this vol.); the other half of
    the story is that concepts (as grammatical constructions, etc.) act as proxies
    for the full suite of human agents and their lived environments (forms of life).
    Furthermore, we enact the words voices and values of our forefathers, if prompted
    (or self-prompted) to do so, we can also challenge these.'
