    Language (and material symbols more generally) play a double role. On the one
    hand they do (crucially) activate other kinds of cognitive rescue, bits of mentalese
    or reuse as we prefer. They also play an irreducible role as the material symbols
    that they are (Clark 2006:2).


    Clark’s emphasis on material symbols can be celebrated. For Love (2004:539), the
    approach reaches code-like units (a priori forms and structures). While not singing
    Clark’s view, Harnad (2006) demands that the feeling of thinking being part of
    cognitive models. To recognize affect (and avoid code-models), others stress cognitive
    dynamics or linguistic co-ordination (Cowley 2007a; Thibault 2004; Love 2007;
    Ross 2007; Kravchenko 2007; Port 2007). Experience skills in hearing verbal patterns
    (Cowley 2007b) and later, using these in speaking. On the distributed view, dynamical
    and normative contingencies shape our cognitive powers (Cowley and MacDorman 2006)
    or, in another idiom, we act to realize values (Hodges 2009). Turning to insight
    problems, we can examine if artifacts affect selection rules. Once we have that
    this is the case, we can ask whether this depends on artifacts themselves or the
    works of a distributed system. By looking beyond the skin, it is none of our intention
    to diminish the brain’s role in events. Indeed, our findings seem largely compatible
    with work in both the theory of representational change and stressing criteria
    for satisfactory progress.


    Using Silveraira’s (1971) cheap necklace problem, as modified in Fioratau (2006),
    we ask how (if at all) artifacts contribute to insight. This allows us to use
    standard instructions, formats and artifacts to explore how participants act and
    perceive. While recognizing the importance of neural activity (and conscious thoughts),
    we treat problem solving as action. By doing so, we can use behavioral evidence
    about the emergence of insightful solutions. This enables us to ask whether artifacts
    prompt solutions or if participants rely on body-world dynamics. For until we
    specify how problem solvers alter we cannot evaluate the role of anticipation
    and sensorimotor experience.'
