    which itself is a kind of manifest action (H. Clark, 2005).


    +   2. Most material structures lend themselves to several, alternative meaning
    exploring interpretations (cf. e.g. Myers & Liben, 2008), which makes attention
    and attunement to addresser’s original intention crucial (Levinson, 1979).


    +   3. e.g. Cohen et al, 2000, 2002; Dehaene et al. 2002.


    +   4. See Tylén et al, 2009 for extensive references.'
