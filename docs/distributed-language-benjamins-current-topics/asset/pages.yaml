  md: 'bag to be filled by information from the text. Rather people actively use the
    in- inscriptions encountered in the situation to achieve useful action results,
    or speci- cally, articulation of meaning.


    # 5. Reading as generation of meaning


    Meaning is based on relations within the organism-environment system. In other
    words, far from being contained in the inscriptions of a text, any factor that
    leads to an action result has meaning. When we regard text perception as a result,
    then all perceived inscriptions carry meaning and, crucially, it is necessary
    to reading both silently and aloud. Thus, even ''mechanical reading'' generates
    meaning. When attributing sound to letters (as in reading phonetic nonsense words),
    we engage in meaningful activity. It follows that reading is not like understanding.
    It can be correctly attributed to even single words, letters, or even parts of
    letters. Its basis lies in the reader''s ability to formulate a word (or sound-pattern)
    on the basis of inscriptions on the paper (cf. for a related interpretation, Cowley
    2007c: 83–104).


    # 5.1 The role of unit in reading


    In reading for understanding we are not aware of the meaning of words or their
    graphic counterparts. As, we are, we generate thoughts and ideas because the anticipatory
    process is directed to just such action results. Where reading for understanding,
    therefore the unit is larger (e.g., sentence or thought) than in ''me- chanical
    reading.'' This interpretation is confirmed by variations in length of FSI that
    occur in reading continuous texts (oneswithoutwordbreaks). Since no in- formation
    is transferred, eye fixations serve in modulating the process of meaning generation
    or, over time, confirming the results of anticipatory organisation. Fixations
    neither start with feature analysis (cf. Paul 2002 for a related inter- pretation)
    nor do inner representations feed the verbal content into a ''speech pro- cessor.''
    Rather, they serve in managing the production of speech. Since fixations modulate
    the ongoing process, it is not surprising that measures of FSI can be as short
    as reaction times. Further, far from needing to fix on a particular inscription
    it is enough to identify a fragment for meaningful articulation.


    An inscription exists as a word or meaningful unit only it is integrated into
    the organism-environment system. There is no need for feature analysis or lexical
    search. Since inscriptions contain no information, they are informative only in
    the context of the organism-environment system''s anticipatory organisation. This
    arises from the subject''s history of social relations in a cultural context that,
    as a result, determines the unfolding of the anticipatory process.'
