  md: '# The experiential basis of speech and writing

    as different cognitive domains


    Alexander V. Kravchenko

    Baikal National University of Economics and Law, Russia


    Traditionally, writing is viewed as a code that stands in one-to-one correspondence
    to language, which is therefore also viewed as a code. However, this is a delusion,
    which is shared by educators and has serious consequences for cognition, both
    on individual and social levels. Natural linguistic signs characteristic for the
    activity of languaging and their symbolizations (graphic markings) are ontologically
    different phenomena; speech and writing belong to experiential domains of different
    dynamics. These dynamics impact differently on the linguistic/behavioral strategies
    of individuals and communities, viewed as second- and third-order living systems
    operating in a consensual domain as structure-determined systems. Failure to acknowledge
    this contributes to the spread of functional illiteracy in modern societies, which
    may lead to cognitive/dysfunction. Technology-enhanced new literacies challenge
    the value of traditional written culture, raising questions about the relationship
    between speech and writing and their roles in human evolution


    **Keywords:** consensual domain, phenomenology, speech, structural determinism,
    understanding, writing


    # 1. Speech, text, and dynamics


    The legacy of first-generation (objectivist) cognitive science, with its emphasis
    on language as abstract disembodied symbols processed by a syntactic engine found
    in the head, weighs heavily on linguistics (Kravchenko 2009a). Linguistic signs
    are treated as well-defined binary structures analyzable in terms of form (expression)
    and content. It is posted that these structures convey information by making possible
    for both the sender (speaker) and receiver (listener) to analyze them. Using a
    mutually shared procedure, we are said to identify quanta of meaning that display
    the semantic values of signs. Such analysis, according to the computational'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'theory of cognition and language, consists in a series of decisions made as
    we process ‘encoded’ meanings. The classic approach to Artificial Intelligence
    aims to develop an algorithmic script that analyzes all signs into a priori sets
    of values. No matter how appealing this logical approach may seem, it overlooks
    the experimental character of (linguistic) semiosis.


    For an international, interdisciplinary academic community known as the Distributed
    Language Group, however, experience comes to the fore (Cowley 2007a). The distributed
    language view focuses language as a key aspect of social (dialogical) activity
    distributed over different time scales. The non-objectivist paradigm, the ‘object’
    of cognition is not a referential script of things in an external reality, but
    ‘the co-ordination of actions between the interacting cognitive agents’ (Stewart
    1996:318); hence, other-orientation, contexts, interaction, and semiotic mediation
    become key concepts (Linell 2007). Cowley emphasizes, “language activity is tightly
    constrained by our sensitivity to circumstances and our skills in using many second-order
    cultural constructs (2007a:576). Many cultural artifacts we use, writing is by
    far the most intriguing; its symbiotic relationship with linguistic activity,
    and the degree to which it impacts—both cognitively and evolutionarily— humans,
    is yet to be prepared (Menary 2007). Speech and writing have different ontologies,
    and to avoid a grave fallacy (Love 2007; Kravchenko 2007a), which should not be
    conflated (Linell 2005), and the code model of language have masked profound differences
    between speech and writing. This paper undertakes to explore the most important
    difference, the experiential one, caused by different cognitive dynamics of linguistic
    interactions in the domains of speech and writing.


    Linguistic behavior, or languaging, is a specifically kind of interaction behavior
    which establishes, in Maturana’s terms (1970, 1978a), a cognitive domain. Dialogical
    interactions occur in space-time as communicating partners monitor, and respond
    to what happens (Linell 2005). By contrast, written texts are typically not read
    as they are produced. For a normal reader, the focus must fall on textual products.
    Since the production process is inaccessible, analysis of written language necessarily
    focuses on texts and their component parts. Letters, words, sentences, paragraphs,
    resemble objects that can be manipulated (especially when typesetting and editing
    a text on a computer). Given the interactive nature of speech, this sets up an
    ontologically distinct semiotic system. While, in Maturana’s terms (1978b), languaging
    is orientational, the primary cognitive function of writing is analogous to internal,
    or biological, memory. Unlike language, which extends the human sensorium (Morrison
    1938), writing is “a storage and retrieval system that allows humans to accumulate
    experi-'
