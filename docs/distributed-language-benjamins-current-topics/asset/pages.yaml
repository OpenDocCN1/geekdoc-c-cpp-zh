  md: 'An illustrative example is found in participants'' descriptions of figure 1.e.
    The image depicts a red car with a bunch of thin tomato slices distributed in
    an ordered pattern on the windscreen. The car is apparently parked among other
    cars in a parking lot. The image divides the participants between groups who use
    interpretative frames. This is illustrated by two descriptions:


    +   1) "I don''t think they got there naturally, so I think it is some kind of
    artistic statement, the way the slices of tomato have been put on that window.
    I don''t know exactly what it should mean. It could be some kind of parallel with
    the red color, or I don''t really know. It could be health related, like the car
    has been infected with tomatoes, or something weird like that"


    +   2) "It''s some kind of hostile act, or somebody pulling somebody''s leg by
    putting slices of tomato on the windscreen of their car. Either way it''s a strange
    thing to do. And not quite clear what''s going on. It of course be somebody playing
    a practical joke with (or) some friends"


    The first example represents how part of the participants apply an iconic, figurative
    attitude to the scene (in parallel to the iceberg or vacuum-cleaners). Some participants
    even suggest that the scene might be a "piece of art". By contrast, a slightly
    smaller group appreciates the tomato configuration neither for its iconicsemblances,
    nor as a social imperative (like the arrow). Rather, they see it as a symbolic
    message between interlocutors who are more arbitrary kind of reference (comparable
    to the roses-scene). The tomato-scene becomes a ''hostile act'' or a ''practical
    joke'' addressed the owner of the car.


    The unconventionality of the expressive practice suggests a possible basis for
    the conflicting interpretative strategies observed. With its novelty, the scene
    offers only weak constraints on intersubjective contextualization. As a result,
    there is variability in the distribution and weight of attention applied to different
    parts of the scene (Rollins, 2004). Though participants tend to agree that the
    object configuration is intended as a communicative signal, the meaning potential
    is left open and normatively constrained by its composition. However, the scene
    can easily be imagined as a part of a larger context where preceding events would
    ground the intended interpretation. In this respect, the configuration may be
    addressing "initiates" who have the prerequisites needed for proper construal.
    Naive to this preceding story, participants base their intuitions on the ''unguarded''
    semiotic potentials. In this case, the result is two distinct types of interpretations
    (iconic/aesthetic and symbolic) that reflect different perceptual-attional strategies:
    If we focus on the symmetrical compositionality of the vegetable slices and the
    sameness of color between car and tomatoes that can motivate an aesthetic reading.
    From this perspective, we see a well-ordered arrangement of'
