  md: '# # Actualizing semiotic affordances

    in a material world*


    Kristian Tylén$^{a,b}$, Johanne Stege Björndahl$^{a}$, and Ethan Weed$^{b,c}$

    University of Aarhus, Denmark


    This paper investigates a special kind of social meaning-making manifest in how
    we experience static objects and properties of our everyday environment. This
    happens, for example, when we encounter objects like vacuum cleaners, sliced tomatoes,
    and sneakers that by their contextual arrangements seem to afford an intersubjective,
    semiotic style of exploration. It is argued that our intersubjective experience
    of such object configurations is brought about by attention to special ostensive
    qualities of composition: Certain positional properties are experienced as purposefully
    constructed to afford an intersubjective mode of perception. This significantly
    changes the perceiver’s semiotic exploration of the scene. From a ‘private’ mode
    of sense-making most structured by episodic, autobiographical experiential content,
    the perceiver adopts a qualitatively different meaning-constructing strategy:
    Engaging as an active meaning-pursuing recipient, the perceiver actualizes ‘public’
    intersubjective meaning potentials of the scene. This process is guided by sensitivity
    and alignment to norms. Defending this claim, we present evidence from an empirical
    investigation of 20 participants photographs depicting everyday static objects.
    We show that a subset of these object configurations (signals) evoke a special
    kind of responsive attitude as manifested in participants’ introspective reports.
    The importance of these findings is brought out by discussion of parallels in
    neuro-cognitive work and how ostensive influence behaviour.


    > * This is a revised version of Tylén et al. (2009). Taking a Language Stance
    in a Material World: a comprehensive study, Pragmatics & Cognition, 17(3):573–595.

    (Corresponding author) Email: kristian@cfn.dk


    +   a. Center for Semiotics, University of Aarhus, Jens Skous Vej 7, 8000 Aarhus,
    Denmark;


    +   b. Center for Functionally Integrative Neuroscience, Aarhus University Hospital,
    Nrebrogaard, 8000 Aarhus C, Denmark;


    +   c. Department of Linguistics, University of Aarhus, N. Ringgaarde, Building
    1410, DK-8000 Aarhus C.'
