  md: 'Once we take the social or socio-logical (Bang and Dør 2007: 51-55) dimension
    of languaging seriously, we are bound to consider how the extended mind is embedded
    in social reality. Drawing on the instructive parable of Otto, who finds his way
    to a museum using, not his biological memory, but a notebook as part of extended
    cognitive (cf. Clark, 2008:226-232), we raise new questions: Where did Otto get
    his notebook from? Who taught him to use it? Who put the museum on the map, and
    why? Many persons are integrated, and integral to, dynamical processes that enable
    Otto to find his way around. Such issues lack serious treatment in Clark''s explanation
    because language is reduced to an abstract relation between a cognizer and a symbolic
    edifice. For the same reason, Clark tends to ignore the social nature of human
    life, forgetting that language is anchored in socio-cognitive modes of acting.


    The difference between extended individualism and socially distributed cognition
    can be clarified by considering Clark''s examples. Relying on experimental work
    by Boysen et al. (1996), Clark (2008:45-47) introduces Shiba, one of five numerically
    trained chimzees: In an experiment, the chimps can choose one of two plates that
    are piled with candies, "were highly preferred items, and the animals were highly
    motivated to provoke" (Boysen 1996:77). One of the plates had a large pile of
