    Making a further move, this volume shifts the emphasis from symbols to bodily
    dynamics. Five derive from a workshop on the Dynamics of Linguistic Material where
    several authors (Cowley, Kravchenko, Fioratou, Tylén, Van Heusden, and Rązaszek-Leonardi)
    scrutinised the view that material symbols extend'
