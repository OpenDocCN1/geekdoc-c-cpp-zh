  md: '# Baren van Heusden


    Human culture is thus a difference in which more or less stable memories are used
    to deal with the world forces upon us. The here and now presents itself as a deviance,
    a new and unknown combination of available patterns. This is deviance that offers
    a certain freedom insofar as it calls images that are ''grasped''. Thus the miracle
    of the creative image, of the metaphor and the model come about. First, there
    must be a situation, or an occurrence, that doesn''t match a stable sign. To get
    hold of the difference, we search for other memories — other signs. Thus, for
    example, there is a face, and it wrinkles, yes, but what more does it remind me
    of? Parchment, or may an old age of cloth, or an arid landscape, cut through by
    deep canyons. The image that ''fits'' the new situation was not there in the first
    place, but came along, as an answer to the question: what is it I perceive, how
    should I deal with this difference? The ''blend'' created by the image is not
    the problem but, rather, its solution. Indeed, we all acknowledge this when confronted
    with a meaningful metaphor, trope, image, or narrative. These enable us to grasp
    a difference experienced in life. Alternatively, the following case: I want to
    express my feelings towards someone — I could simply say so, of course, but I
    would have to acknowledge that the concept does not exhaustively cover the feelings
    I have (the ''difference!). For reason, I turn to memories to find images, concepts,
    or models that evoke these feelings. Indeed, I might come up with a list like
    that of The Epic of Gilgamesh (approx. 3000 B.C.). In this oldest of our surviving
    literary works, Gilgamesh insults the goddess Ishtar by the cold, a backdoor which
    keeps neither squall of wind nor storm, a castle which crushes the garrison, pitch
    that blackens the bearer, a waterskin that chaf the carrier, a stone which falls
    from the parapet, a battering ram turned back from the enemy, a sandal that trips
    the "wearer" (Sandars 1960:86).


    # 4. Self-consciousness


    The cognitive process we have been discussing until now is itself one dimension
    of our constantly changing human reality. As such is it one source of difference,
    and (to paraphrase Kant) of: we remember and feel ourselves feeling, we remember
    and look at ourselves looking, we remember and hear ourselves hearing, and we
    remember and think about ourselves, individually as well as collectively. Here
    self-consciousness as a distinct human faculty arises. In, and as a changing here
    and now, we are a difference to ourselves; we are a difference to be dealt with.
    And once more, we draw on stable memories.'
