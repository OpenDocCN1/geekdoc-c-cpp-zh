  md: 'Stimuli consisted of photographic representations depicting a variety of scenes
    featuring everyday objects collected from the local environment and photo sharing
    sites such as www.flickr.com and www.polfoto.dk. While no persons were depicted,
    we included only images of actually occurring scenes. The stimuli were divided
    into three conditions based on a previous classification study. Twenty-two participants
    (not those of the present study) were instructed to make relevant distinctions
    in images of object configurations. Using an electronic questionnaire, they rated
    a sample of one hundred images on two parameters: 1) the presence/non-presence
    of communicative signals, and 2) the degree of conventionality of the signals
    (by Tylén et al., 2009, for details). Conventionality was defined by relative
    frequency or how often participants expected to encounter a certain type of material
    signal. Statistical analysis of the data allowed us to select the eighteen examples,
    for each of three predefined conditions:


    +   - Experimental condition I: images that were found to depict conventional
    ways of employing material objects as communicative signals. Examples: a buoy,
    marking the location of fishing nets, a large crowd of roses left on the pavement
    left in grief of a person killed, and fire sprinkled out as an arrow to show directions.


    +   - Experimental condition II: images that were found to depict unconventional
    ways of using material objects as communicative signals. Examples: a crowd of
    vacuum cleaners arranged on a lawn to make a conceptual piece of art, slices of
    tomato in a patterned distribution on the windscreen of a car, and an iceberg
    covered with red paint.


    +   - The control condition: images that were found by the participants not to
    evoke any conspicuous communicative interpretations. Examples: colorful laundry
    hung out dry, a blender on a kitchen table, and a fire extinguisher in a messy
    cupboard (see Figure 1).


    Stimuli were presented in a randomized order on a 13.3" monitor using Microsoft
    PowerPoint. Each image was shown for sixty seconds and participants were instructed
    to speak while watching the images. Their oral reports were recorded using a stereo
    IC Recorder (model ICD-SX56). The procedure provided a corpus of six hours of
    audio recordings that were transcribed using CLAN software (MacWhinney, 2000).
    Analyses were carried out on the transcribed material.


    Overall, the methodology enabled us to test whether the conceptually grounded
    distinctions (partially validated in the classification study) elicit significant
    differences in participants’ unguided, casual experience of different types object
    scenes. We of course recognize that the experimental procedures may not reliably
    reflect'
