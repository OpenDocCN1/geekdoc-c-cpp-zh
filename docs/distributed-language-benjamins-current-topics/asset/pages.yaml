  md: '# Beyond mind


    # An extended ecology of languaging*


    Sune Vork Steffensen

    University of Southern Denmark, Denmark


    This chapter contrasts a distributed perspective on language with how Andy Clark
    applies the Extended Mind Hypothesis to language in Supersizing the Mind (2008).
    While sympathetic to Clark''s broad picture, his understanding of language is
    shown to be inadequate. The Chapter outlines five main reasons for rejecting his
    conservative view: 1) Language cannot be explained with reference to a ''language
    system'', i.e. aiotic system for communication. 2) Language is irreducibly bound
    up with real-time metabolic activity (e.g. voice dynamics, and task-oriented modes
    of action). 3) Language gains its cognitive power, but not individual cognizers
    handle it, from how they adapt to socially moulded ecological niches. 4) Language
    functions, metaphorically, as airborne synapses in distributed cognitive systems.
    5) Language provides an extended ecology within which human cognizers engage in
    languaging. The chapter concludes that how language contributes to human activities
    cannot be squared with Clark''s surprising view that the extended mind is organism-centred.


    **Keywords:** extended mind hypothesis; language; distributed cognition; interaction;
    extended ecology


    # Introduction


    The purpose of this chapter is to contrast how two post-Cartesian approaches to
    cognition differ when it comes to language. The two approaches are the extended
    mind hypothesis (Clark and Chalmers, 1998; Clark, 2008) and distributed cognition
    (Hutchins 1995; Hollan et al., 2000, Kirsh, 2010). Whereas the former has its
    disciplinary home in the philosophy of mind (though drawing heavily on experimental
    cognitive science), the latter arose from cognitive anthropology. But they'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'share a central tenet, namely that human cognition is non-local (Steffensen
    and Cowley, 2010), i.e. it draws on brains, bodies and surroundings, including
    other cognizers, artefacts, social relations and environmental structures. In
    their own words, this is how Clark and Hutchins, respectively, present their views
    on cognition as both internal and external:


    The actual operations that realize certain forms of human cognition include inextricable
    tangles of feedback, feed-forward, and feed-around loops: loops that prominently
    cross-cross the boundaries of brain, body and world. The local mechanisms of mind,
    if correct, are not at all in the head. Cognition leaks into body and world. (Clark,
    2008:xxviii)


    Human beings are adaptive systems continuously producing and exploiting a rich
    world of cultural structure. [...] This heavy interaction of internal and external
    structure suggests that the boundary between inside and outside, or between individual
    and context, be softened. [...] Thinking of bringing these structures ["of artefacts
    and social organizations"] into coordination so that they can shape and be shaped
    by one another. The thinker in this world is a very special medium that can provide
    cognition among many structured media—some-internal, some external, some embodied
    in artefacts, some in ideas, some in social relationships. (Hutchins, 1995:228,
    316)


    These accounted in the 1980s and 1990s as a revolt against the Cartesian regime
    in cognitive science. Thus, Western cognitive science has for four centuries conceived
    of human cognition in the metaphor of mind as machine, as meticulously fleshed
    out in Margaret Boden’s opus magnus “Mind as machine” (Boden, 2006). By viewing
    mind as machines, one compares human cognition with the computational use of effective
    procedures: mind becomes neural machinery that, with appropriate input, produces
    relevant output. In the second half of the 20th century, cognitive science thus
    flourished with computational input-output models and a representational theory
    of mind “according which cognitive states and processes are constituted by the
    occurrence, transformation and storage (in the mind/brain) of information-bearing
    structures) one kind or other” (Pink, 2008). In linguistics, Chomsky (e.g. 1965)
    used the model to argue that language should be pictured in terms of mind/brains
    that run alongside systems of speech production and processing. In claiming explanatory
    power for classic cognitive theories, performance was subordinated to competence
    (Chomsky, 1965). What people do with language, their performance, was theoretically
    separate from what they know about language, their competence.


    The change in the field, away from Cartesian models of the symbol-processing mind
    towards an extended or distributed view, logically unfolds as two arguments.'
