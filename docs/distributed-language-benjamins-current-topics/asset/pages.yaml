  md: '# Ecological pragmatics 153


    Consciousness, then, might be viewed as pragmatics under the constraint of alienation.
    Research by Kagan (1989) and Lamb (1991) indicates that 18-month old children
    spontaneously begin to notice and bemoan (“uh-oh”) the cracks, and breaks in things.
    Their pragmatic sensitivity to gaps (breaks, distortions, interruptions) may be
    the beginning of a consciousness that presents the world as in need of repair.
    Much of language is provoked by this sense of unfulfilled intentionality of the
    world, and/or our own awkwardness and alienation with respect to our surroundings.
    This is especially true with respect to others, whom we learn cannot be trusted.
    Even more painful, we become aware that ourselves cannot be trusted. Consciousness,
    then, is what allows us to “take care” (i.e., to be cautious and circumspect)
    in what we feel, do, and say. Of course, caution and circumscription are the very
    stuff of pragmatics.


    In fact, the primary reason for the necessity of pragmatics in the first place
    is that there is alienation as well as attentement. Attunement is a project, not
    given. Alienation is not a given either, but the consequence of failures to fulfill
    the project of attentement. Cognitivism assumes attentement is fundamental, but
    not assured. The work required is to imagine a world with which we have no direct
    contact, to explore thoroughly and jointly the world we inhabit and are to care
    for. Once again we come to caring as central to language, and nowhere is more
    evident than the care that defines pragmatics. Politeness, truthfulness, relevance,
    and all the other principles described in pragmatics are grounded in the need
    to be caring and careful. Pragmatics requires that we think about what we say,
    or about other means, because caring “entails suffering, a burdensome and anxious
    sense of responsibility that borders on grief” (Hodges 2007b: 167). Caring is
    a willingness to be disarmed, interrupted, and troubled by another.


    How do we negotiate consciousness as attentement as alienation? How do we take
    care? How do we discern what and should be repaired? The puzzle of consciousness
    brings us back to dialogical arrays. Bakhtin (1993) suggested that the fundamental
    psychological factor for humans, located in their dialogical relation to the other,
    is not attentement or alienation, but answerability. Humans, claims, answer to
    others, he considered variously as the person’s community, the “court of history”,
    even God (Bakhtin 1986: 126). For him, the social and the moral are the defining
    context for the conscious acts of people; thus, consciousness is a matter of ecology,
    not of Cartesian ego. As he puts it:


    I am conscious of myself and become revealing myself for another, through another,
    and with the help of another ... To means to be for the other; and through him
    for oneself. Man has no internal sovereign territory; he is all and always on
    the boundary (Bakhtin 1984: 287).'
