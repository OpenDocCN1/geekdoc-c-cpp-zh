    and Baron (1992), values operate in heterarchical fashion, providing for the "conservation
    of the integrity of the ecosystem as a whole" (Hodges 2007b: 155). What is meant
    by heterarchical relations among values is that actions are mutually constrained
    by all the values, so that there is no fixed, hierarchical ordering of values;
    rather, across time and task, values vary in their ordering for the sake of the
    realization of all the values (i.e., the ecosystem as a whole). There are real
    tensions among values, but it is this tension that gives energy to action, emotion,
    and cognition. It is easy enough to think of these tensions as tradeoffs, but
    that misses the necessary reciprocity of values as they work cooperatively to
    enhance each other (Hodges and Baron 1992: 281–282). For example, without accuracy
    (e.g., direction) and efficiency (e.g., speed), driving would be of little use,
    but driving as close as possible to potential hazards or as fast as possible is
    not good. Safety usually demands reduced speeds (or greater tolerances), but in
    an "emergency" might demand increased speed and smaller tolerances. Good driving
    is a continuous balancing act, jointly realizing all values.


