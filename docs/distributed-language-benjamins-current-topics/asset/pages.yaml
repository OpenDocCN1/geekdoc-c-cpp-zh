  md: '# viii About the Authors


    Kristian Tylén has an MA in Cognitive Semiotics from University of Aarhus and
    a PhD in Linguistics from the University of Southern Denmark. He currently holds
    a postdoctoral position at the Center for Semiotics, University of Aarhus, and
    the Center for Functionally Integrative Neuroscience, Aarhus University Hospital.
    His main interests reside in the interface between semiotics, aesthetics, and
    the cognitive sciences and the application of various experimental approaches
    (including brain imaging) to the study of human construction.


    Johanne Stege Philipsen has an MA in Linguistics and Cognitive Semiotics from
    University of Aarhus, Denmark. She has worked as a research assistant at the Institute
    of Language and Cognition, University of Southern Denmark and Center for Functionally
    Integrative Neuroscience, Aarhus University Hospital. Her main interests are within
    social neuroscience, cognitive semiotics, and neurolinguistics.


    Ethan Weed has an MA in Cognitive Semiotics and is currently a Doctoral Candidate
    at the Department of Linguistics, University of Aarhus. His research interests
    language, cognition, and pragmatics. He works combine lesion studies with ERP
    techniques to investigate communication impairments flourishing right hemisphere
    damage.


    Evelyn Tribble is Donald Collie Professor of the University of Otago. She is the
    author of Cognition in the Globe: Attention and Memory in Shakespeare''s Theatre
    (New York: Palgrave, 2011) and (with Nicholas Keene) Cognitive Ecology and the
    History of Remembering: Religion, Education, and Memory in Early Modern English
    (Basingstoke, Hampshire: Palgrave, 2011). Her interests include memory studies,
    performance, theatre history, and literature and cognition.


    Baren van Heusden is senior lecturer in the Department of Arts, Culture, and Media
    Studies of the University of Groningen (NL). His research focuses on the semiotics
    of culture and the arts. Since 2008 he has been leading the Dutch research project
    ''Culture in the Mirror'' (2008–2012), which aims to develop a theoretical framework
    for integrated culture education curriculum for children and youngsters from 4
    to 18 years old.


    Bert H. Hodges received his PhD in Psychology from Vanderbilt University and is
    Professor of Psychology, Gordon College, Wenham, MA, and Senior Scientist, University
    of Connecticut, Storrs, CT. His work is on developing and applying an ecological
    account of values in perception-action, social psychology, and language. He has
    co-edited with Reuben Baron a special issue of Ecological Psychology, Making social
    psychology more ecological and psychological more social and with Carol Fower,
    Distributed, dynamical, and diagonal: New coordinates for language.


    Joanna Rączeszek-Leonardi received her MA at the University of Warsaw, and her
    PhD at the Center for Complex Systems and Brain Sciences at Florida Atlantic University.
    She is currently Marie Fellow at the University of Bologna and an assistant professor
    at the University of Warsaw. She is a psycholinguist interested in language as
    a dynamical system, and is engaged in identifying important dynamics and timescales
    in language functioning, learning, and evolution. Her experimental interests concern
    methods for studying dynamical processes of on-line communication.'
