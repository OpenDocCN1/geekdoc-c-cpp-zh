  md: '# 4. Multimodal dynamics on stage


    The beginning lines of Hamlet provide a deceptively simple example of the multi-modal
    dynamics at work at the early modern stage:


    +   - Enter Barnardo and Francisco two sentinels

    Barnardo: Who''s there?

    Francisco: Nay


    A successful performance of these lines involves a complex distributed cognitive
    process that calls upon: (a) the individual actor’s ability to recall his lines,
    and more importantly, the cues; (b) the knowledge of entrance conventions and
    the use of the stage; (c) the ability to elaborate the implications of the first
    line for the entire scene — “who’s there?” implies an inability to see, in turn
    that it is dark, which in turn requires the actor to draw upon his embodied expertise
    in *performing*, the stage itself was fully lit by daylight, as the play would
    begin at 2 p.m. in an outdoor venue; (d) the ability to invoke both acting experience,
    a cultural scheme, and the material supplies for actors, properties, and costume
    appropriate to “centinels’; (e) the ability to locate one’s entrance on the play
    “plot” and time it correctly; (f) the subtle and constantly changing coordination
    between the two actors. Rather than simply reproducing the lines, actors are engaged
    in a hybrid process that engages material and social forces. Indeed, dialogism
    is built into the production of the practice of the cue scripts, for remembering
    how to say the cue and to listen for one’s cue was the glue that held the entire
    production — failure to remember cues could cause the entire scene to fall like
    a “house of cards” (Palfrey and Stern 2007:85). The theatre then, constructed
    an “ecosocial semiotic environment” (Thibault 2005:123) that worked only through
    the active dynamics of coordination across people, artifacts, and spaces.


