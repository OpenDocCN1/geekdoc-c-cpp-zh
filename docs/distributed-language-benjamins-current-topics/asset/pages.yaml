    (Tomasello and Akhtar 1995; Tomasello 1999; for a discussion of the notion of
    symbol see Tomasello 2000). Researchers more grounded in the functional tradition
    trace skills in human interaction to the communicative and coordinative capacities
    of newborns and very young children (Trevartarden 1979, 1998). These capacities
    form a basis for language and, on the other hand, the child''s increasing engagement
    with language (and other people) is instrumental in ensuring the self-organization
    of its own coordinative (and cognitive) powers (Cowley 2006).


    In linguistics, the formalist model of linguistic symbols remains stronger. In
    this field, however, it has been challenged by theoretical and empirical research
    on the context-dependency of meaning. As Barwise and Perry (1983) pointed out,
    philosophers of language were too preoccupied with entailments between (seamless)
    eternal sentences, and for this reason, considered the ambiguity of natural language
