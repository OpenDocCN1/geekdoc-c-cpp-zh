  md: 'Hamlet here describes a fundamental division over the question of the purpose
    of playing. For the prince, the play consists of its written instantiation, controlled
    by the writer, transmitted by the actors, and to be consumed by the audience,
    in a tidy process that ensures that “necessary points” of plot are conveyed in
    a model of communicative efficiency. But his account of what is actually played
    in the play differs significantly from this model. In this version, “gentlemen”
    go to plays not to follow complex plots, nor to admire carefully constructed poetry,
    but to engage in the pleasure of the familiar. These gentlemen have already written
    down what they go to — their their notebooks the jests they expect the Clown to
    perform. Phrases as “cannot you stay till I eat my porridge?” or “your beer is
    sour” have little representational content — and perhaps have become unmoored
    from dramatic representations of eating and drinking. They are taglines that bind
    audience and actor in an experience, which cannot be seen as in any advancing
    an argument or plot-line, but instead invokes pleasure at the circulation of familiar
    jests, as concert-goers today demand the familiar old songs from their favorite
    bands. In the way the clown-audience dynamic can be seen as an instance of languaging
    as a means of realizing values (Hodges 2007:585). In this instance, play-going
    is as much about a collaborative social dynamic between performer and audience
    as it is about having ‘hearing’.


    Existing beyond the crucial role of the Clown in the Elizabethan theatre out.
    For an early modern audience, to attend a play was to do more than view a self-contained
    fictional dramatic representation. Plays at theatres invariably drawn by song,
    lewd dancing; these were not crude afterpieces, but essential to the playgoing
    experience (Wiles 1987). The playj jig, accompanied by song, and most importantly,
    dancing (Wiles 1987). After the play proper ended, the stage was given over to
    the company clown, who presided over the jig, which often spread to encompass
    the audience, sometimes with disorderly results (Baskerville 1929: 16). Of course,
    Hamlet claims the clown itself might try to introduce his jests into the play
    itself, by mugging (“blabbering with his lips”) or by bawdy dancing (cinquape
    of jests). The disdain for authority draws the disapproval of the intellectual
    university student, Hamlet. In fact, earlier in the play Hamlet demonstrates his
    contempt for Polonius theatrical taste when he says, “He for a jig, or a tale
    of bawdry, or else he sleeps” (Irace 1998:65; Sc. 8: 322).


    Many Shakespeare scholars have been unable to resist the temptation to see Hamlet
    as a mouthpiece for the play. In this account, the playwright Shakespeare uses
    his character to denounce precisely the languaging practices I have been describing.
    By identifying Shakespeare with Hamlet is not necessarily warranted.'
