  md: '# 5.2 Silent and oral reading


    Where reading is viewed as a visual process, little interest is shown in reading
    aloud. Accordingly, on information-processing models, fixation-speech intervals
    are seen as indexing processes unlike those of silent reading. In this “snap-shot”
    theory, it is posited that fixations should “wait” for word articulation (Rayner
    1998:375). This leads to a prediction. In principle, there should be differences
    between the timing of eye movement and cognitive processing when we read aloud
    silently. In fact, our research provides no support for this view which has been
    questioned also in comparisons of oral and silent reading by Kando and Mazuka
    (1996:358).


    Text perception is regarded as meaning generation that integrates sensory and
    motor constituents in silent action, the time of oral and silent reading is expected
    to be similar. Indeed, both processes are to draw on the same anticipatory processes.
    This is confirmed by that our fixation and saccade amplitudes are of the same
    order magnitude as those of Rayner’s (1998) work on silent reading. Not only do
    our eye tracking results confirm the organism-environment view, but they suggest
    a general conclusion. Reading silently or ‘loud out’, it seems, different aspects
    of a process. In both cases, the text act as a means to speaking even if, in silent
    reading, this is inhibited. In silent reading, we articulate subvocally as is
    found in studies of the EMG activation of larynx muscles (Sokolov 1972; Abramson
    and Goldinger 1997).


    Reading used to be entirely oral. While occasional instances of silent reading
    occur before the tenth century (Manguel 1996:40–53), our findings reflect on our
    history. Texts are written to be spoken and, in many languages, no lexical contrast
    marks acts of reading from speaking (ibid.). Since language is social activity
    that creates cooperation this is, perhaps, not surprising (Järvileto 2000:48–49).
    Indeed, like dialogue, reading may be regarded as a process directed towards the
    expression of the ideas conveyed by the writer. Given the importance of semantic
    aspects of the text, there is dispute whether phenomenal processing is necessary
    (e.g., Perfetti and McCuthen 1982; Wagner and Targerson 1987). In learning to
    read phenomenology plays an important role (Wagner and Targerson 1987) as well
    as Lukatera et al. 2004). Accordingly, silent reading is seen as special case
    of oral reading where one component, overt speech, does not occur.


    Reading is a social process which encompasses both the reader and the writer of
    the text who engage in a cultural context. It is a dialogue with the writer, a
    kind of cooperation which we see, not in principle, differ from dialogue between
    people (for a different view, see Kravchenko this volume). From far being interaction
    between people, dialogue can be seen as a process of generating shared mean'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'ing as we concurrently orient to each other. In reading the author is not physically
    present, but in spite of this, participates in the generation of meaning. Just
    as if the other was present, the reader can pose questions to a text and, strangely,
    find answers. The text permits cooperation between the writer and the reader which
    can result, among other things, in the creation of new thoughts and ideas.


    # Notes


    +   * We would like to thank Stephen J. Cowley for many helpful suggestions and
    corrections during the preparation of the manuscript. We also thank three anonymous
    reviewers for their useful comments.


    +   1. It should be pointed out that, according to the theory of the organism-environment
    system, behaviour (such as learning) is recognition of the whole organism-environment
    system. Psychological concepts (such as perception) describe different aspects
    of the dynamics of organisation in the organism-environment system (Järvlehto
    2000).


    +   2. Parafoveal vision means the possibility of using textual information that
    is projected to the parafoveal region of the retina.


    +   3. For technical reasons, the results reported in the study above (Järvlehto
    et al. 2008) the accuracy of measurement of FSI was 40 milliseconds.


    +   4. It is not known how our results depend on specific features of the Finnish
    language (e.g., complexity of morphosyntax), but comparable eye-view span was
    reported by e.g., Levin (1979) for English. Levin, however, did not measure temporal
    parameters, such as FSI.


    +   5. Taken together these results could be indications of ‘prosody of looking’,
    i.e., rhythm of action related to the generation of meaning.


    +   6. As pointed out in the Introduction, a related measure is the EVS, but it
    has been applied only for spatial measurements, and it offers no possibility for
    determination of the time course of the reading process. Another related method
    is the presentation of single words or short sentences and measuring the voice
    reaction time, but this measure has the disadvantage of bad ecological validity.


    +   7. There are, however, no systematic comparisons for different languages.


