  md: '# Semiotic cognition and the logic of culture 127


    Once children understand the concept of a false belief or the mind''s ability
    to incorrect the world, they realize that beliefs are mental representations and
    hence distinguish between mind and world. This comprehension often happens between
    the ages of 3 and 5 years. This awareness has been tested in non primates and
    stems from the assumption that along with the difference between mind and world
    comes an understanding of the sources of knowledge and the representation of beliefs
    by others (Gazzaniga et al. 1998:547, italics mine).


    Our identity as human beings is thus a process in which we continuously have to
    invest energy. It consists of a set of more or less stable memories (images, stories,
    ideas—both internal and external),¹ a changing present, as well as the process
    in which the memories are used to deal with change. Self-consciousness, which
    it does seem, as Douglas Hofstadter (2007:101f) assumes, ‘strange loops’. On the
    contrary, I would say: as individuals, or as groups, we are no different from
    the rest of the cultural world we inhabit: we exist as a set of memories and as
    a process in which these memories are used to deal with a dynamic environment.
    I am, and we are, in the ‘making’. Viewing the self as a process rather than an
    object becomes more natural (Noble 2006). The self is always a constructed self
    as well as a remembered self, or, a self ‘under construction’.


    Self-consciousness, both individual and collective, is thus a form of recursion—not
    formal, but semiotic recursion. Whereas in formal recursion a form consists of
    elements that repeat that form (as in a triangle consisting of three smaller triangles,
    each of which again consists of three smaller triangles, etc.), in semiotic recursion
    the process of representation (‘about’) is about itself. This is what we call
    reflexivity, meta-representation, or meta-cognition. Moreover, this meta-cognitive
    process is again remembered, which gives us a strong feeling of being, and having
    been, alive (cf. Metzinger 2003:325f). This very basic form of dealing with difference
    in a self-referential or meta-cognitive way lies at the basis of a number of cultural
    domains. The arts, religion, and philosophy are important forms in modern and
    contemporary culture. Whereas with art we reflect our life through concrete images,
    sounds, and stories (cf Donald 2006), in religion and philosophy, we do so through
    more abstract conceptualizations.¹


    | Meta-semiosis | accommodation | assimilation |

    | --- | --- | --- |

    | concrete / particular | Self-perception | Mimesis; the arts |

    | abstract / general | Philosophy; theory | Myth; religion; ideology |


    **Figure 2.** The four stages of meta-semiosis. The arrow indicates the temporal
    sequence. The concepts ‘accommodation’ and ‘assimilation’ refer to the ‘direction’
    of the cognitive process.'
