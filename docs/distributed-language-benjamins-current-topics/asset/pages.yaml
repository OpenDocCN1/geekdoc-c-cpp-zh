  md: '# Insightful thinking: Cognitive dynamics and material artifacts


    Alongside events ''in the head'', material artifacts can influence action and
    perception. Indeed, Noël (2004) shows that this applies to vision. Given the two
    visual streams (and integrated neural processes) seeing depends on acts of looking.
    For Noë “What we perceive is determined by what we are ready to do (or what we
