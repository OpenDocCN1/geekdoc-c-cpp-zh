  md: '# Symbols as constraints: Dynamics and self-organization in language 177


    reflects on the functional division of the intricate social coordination that
    we call language. In other words, the phenomenological units into which structure
    is realizedized do not necessarily match the division into functional units that
    stem from how language controls and is maintained at different levels and time-scales.


    The view of language as a means of interaction, regulation, and coordination points
    to structural points that are quite different from those of the positionality
    of the world, of learning biases, and of vertical (intergenerational) transmission.
    In a seminal work on dyadic interaction in the first days of a child’s life, Trevartin
    (1979) showed how prosodic features of language tune the baby to social stimulation,
    and just as importantly, how the baby’s prosodic behavior from a parent. Language
    serves as a means of seeking information. Building on this work, Cowley (2004)
    shows how primary coordination can shape the motivational systems that help mother
    and infant to coordinate emotionally and then cognitively. Such studies show important
    things. First, the units subjected to evolutionary pressures might be quite different
    from “words”. Among others, they depend on prosodic contours and the timing of
    exchange. Second, variables that may be a functional contribution to socially
    coordinated action in a given environment are better candidates for structuring
    language than say, the purely perceptual variables, accessible to phenomenal experience,
    seemingly used to categorize the world. To use language “correctly” in early interaction,
    a child needs to sensitize to these patterns and, in some way, to distinguish
    them. These are complex, obvious, dynamical variables pertaining to the interaction
    with the world that need to be conveyed in a purpose to coordinate.


    Research on pragmatic functions of linguistic forms is pursued within functional
    approaches to language, linguistic anthropology, and discourse analysis. In their
    book Interaction and Grammar, Schegloff and colleagues write:


    > [O]nce we register language figures in the actual, practical activities of the
    people and societies, and that how the language is configured more than incidentally
    related to their involvement in those activities, it is readily apparent that
    at the very least, attention must be paid to the relationship between activity,
    action, and the orderly deployment of language called grammar (Schegloff-off,
    Ochs, and Thompson 1996:21).


    A few pages later, they added:


    > [The] interaction matrix of grammar requires a different understanding of what
    should enter into a linguistic description and/or a different model of linguistic
    structure (Schegloff et al. 1996:24).


    Numerous examples are adduced to show how syntax and prosody so co-regulate mutual
