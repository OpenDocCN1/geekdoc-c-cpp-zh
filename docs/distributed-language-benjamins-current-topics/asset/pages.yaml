  md: '# Sune Vork Steffensen


    (1943:44-55). Stability is said to be a feature of the content plane that is warranted
    by a “translation” of the differing expressions into the same (Mentalese or Neural)
    content. Opposing this, both distributed (e.g. in Love, op.cit.) and extended
    (Clark, 2006, 2008) approaches reject any “translation theory of language” (Clark,
    2006:304). However, whereas Clark attributes a stability to language (in itself),
    those in the distributed movement trace this to human phenomenon sustained by
    social institutions (abets, dictionaries/grammars, religious and scientific traditions,
    etc.). First, it is simply a fact that many modalities of language — speaking
    and writing — share no single (abstract) materiality (cf. Kravchenko, 2007, this
    vol.). Second, the materiality of language is not either the alphabet or phonological
    equivalent; it is highly variable. In Love’s words


    The linguistic sign, spoken written or manifest in any medium, is not an object,
    or a permanent property of an object. It has no fixed or determine semantic unit.
    It becomes a sign and when used as such, and its significance is a function of
    that use. [...] When it comes to treating a language as a consistently identifiable
    set of recurrent ‘sames’, the problem is that there are indefinitely dimensions
    in which one might be deemed the same as, or different from, another. (Love, 2004:531,
    541)


    Clark fails to understand that forms of variability here his notion of material
    stability, Clark invokes an alleged capacity to recognize the same words:


    > Of course, there is plenty of variability [i.e. in “the actual sound streams
    and inscriptions”] too, but we are usually quite well able to recognize, for example,
    the same word in different fonts and as uttered by different speakers, and that
    is all the stability I need. (Clark 2004:723)


    Clark’s argument conflates relational stability with objective stability. While
    we certainly perceive what we call the ‘sames’, this cannot ground a scientific
    explanation of how we speak or act. There is a parallel with human colour (Giere,
    2006): we can normally emphas a colour as the ‘same’, even under different circumstances
    of lightness and darkness. This is neither objectively we see the ‘same’ electromagnetic
    waves, nor objectively we have the ‘same’ experience. Visual systems adapt to
    various degrees of ambient light and by doing, stabilize a relation between organism
    and environment. In this instance, one cannot deduct from the fact that we behave
    as though two varieties are “the same colour” to the conclusion that these are
    the same, materially or by other means. Nor, of course, can one conclude that
    brains (or minds) represent discrete colour categories that correspond to what
    we see.'
