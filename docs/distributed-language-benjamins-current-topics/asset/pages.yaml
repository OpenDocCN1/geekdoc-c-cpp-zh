  md: '# Semiotic cognition and the logic of culture


    subsystems.21 Rather, the duality posited here is taken to be inherent to human
    cognition. Although culture certainly is a fact of human biology, what makes it
    interesting is the fact that is out of biology, in this case, emerges a form of
    cognition that became free — at least to a certain extent — of the laws of biology.
    This was achieved, by adding a new dimension to these laws, namely the dimension
    of the semiotic.22 The approach is deeply and truly Darwinian, in the sense that
    it applies Darwin''s perspective where it can, and should be applied, and uses
    it to explain how and why a non-Darwin evolutionary system, though nested in biological
    evolution and fulfilling the same goals, could emerge. (Neo-)Darwinism is fruitful,
    but only up to a certain point. Once semiosis arises, the laws of development
    change. Instead of ''BSR = Variation + Selective Retention'', the logic of the
    semiotic process, involving perception, imagination, conceptualization, and analysis
    will determine the course of human evolution.23 Whereas retention may continue
    to function as it does in animal life, cultural variation is not blind, but informed
    by semiosis and driven by semiotic strategies.24


