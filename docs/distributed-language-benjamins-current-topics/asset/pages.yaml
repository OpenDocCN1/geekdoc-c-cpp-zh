    Shakespeare’s theatre can be seen as a hybrid system, where textual fidelity is
    mapped onto a strong residue of originality (Marcus 1996; Wemann 2000). We have
    seen, verbatim recall is a product of literate culture, and it exists only within
    the context of the "pursuit of interests which involve a strong concern for verbatim
    fidelity" (Rubin 1984:433). The early modern theatre is a good example of an institution,
    as the interest of the Master of the Revels in fidelity to the written script
    suggests. But we need to place this demand within its historical context. The
    ideal might be to "speak more than is set down", but in reality, given the demands
    of performing up to six different players, a framework for "fluent forgetting"
    (Trouble 2005:150) must have been necessary. For Shakespeare, expert practice
    did not consist so much in extent fidelity to the written text, but to the cognitive
    act of improvising within a strongly controlled framework. In the representations
    of amateur practice and professional practice he presents in his plays, amateurs
    are marked by their lack of fluency and their over-riding concern with getting
    the speech word-for-word. The excessive attention to the verbal dimension of the
    tasks rob them of the attention necessary to cope with the unexpected. The key
    to "remembering" your lines is never to give the appearance of forgetting — that
    is, never to stop. Amateur represented always stop; any interruption disrupts
    the brittle cognitive system precariously in place, as witnessed by the representations
    of failed amateur performances in Shakespeare’s plays. Shakespeare stages many
    examples of failed performances, the well-known of which is the woeful enactment
    of Pyramus and Theseby by inexperienced working that concludes A Midsummer Night’s
