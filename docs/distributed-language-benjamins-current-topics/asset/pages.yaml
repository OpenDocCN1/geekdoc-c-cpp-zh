    In psycholinguistics and developmental psychology, many researchers are rethinking
    the nature of linguistic symbols. Mainstream researchers in language development
    are increasingly emphasizing the interactional context of languageactivity, and
    thus, reconsider work by functionally oriented theorists of the 50s and 60s (e.g.,
