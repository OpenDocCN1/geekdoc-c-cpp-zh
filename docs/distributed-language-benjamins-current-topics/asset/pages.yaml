  md: '# Actualizing semiotic affordances in a material world 85


    While there is strong evidence for qualitative differences in the perception of
    objects as signals vs. non-signals on the level of neuro-dynamics, in what follows,
    we extend the investigation to another index of participants'' (inter)subjective
    experiences of such scenes. In short, we elicited verbal constructs of depicted
    scenes to investigate meaning-constructing attitudes to signals and non-signals.
    We predicted the perceptual differences found in the fMRI-study would alter how
    people construe image descriptions in different conditions. Further, a more qualitative
    style approach was expected to facilitate detailed studies of how social norms
    and attitudes shape meaning.


    The study focuses on two central hypotheses. The first is categorical:


    +   - there will be fundamental differences in how people categorize signals vs.
    non-signals.


    The second is semantic:


    +   - different types of signals will elicit different meaning-pursuing attitudes.


    Informed by the brain imaging study, we also expected the degree of originality
    of expressive practices to predict variance in the meaning attributed to the signals.


    # 2.1. The experiments


    The experiment was based on verbal constructs by twenty healthy participants (10
    females/males, mean age 26 ± 3 (STD)) who described visual scenes featuring various
    object configurations. Of these, only some were expected to afford the intersubjective
    exploration sketched above. Building on the hypotheses, we aimed, first, to ascertain
    whether the conceptually distinguished between first-person subjective (non-communicative)
    and second-person intersubjective (communicative) experiences was manifest in
    oral reports of the participants'' comprehension of scenes. Second, we aimed to
    identify trends and normative patterns in the meaning-constructing strategies
    applied in interpreting material signals with varying degrees of conventionality.


    Some view the construction of material signals as part of a percever’s (intersjective)
    phenomenal experience which lies beyond experimental reach. However following
    Gallagher (2003), we systematically investigated participants'' experiences of
    object scenes using verbal, phenomenological reports. The task was formulated
    with an ‘open’ instruction (‘describe the stimuli and how you understand them*’)
    that has been shown to motivate free descriptions that, without establishing strong
    interpretive biases, involve more than the listing of depicted objects. As shown
    below, the procedure gave a rich data set suited to both qualitative and quantitative
    analyses.'
