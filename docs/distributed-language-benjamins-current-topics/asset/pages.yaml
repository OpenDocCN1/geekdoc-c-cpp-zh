    # ORGANISM-ENVIRONMENT SYSTEM


    Parvainen et al. 2006. Indeed, if an inscription on the page completes organisation,
    event-related potentials following the stimulus presentation (or fixation of the
    eyes to an inscription) cannot be indicators of sensory processing of the stimulus.
    Rather, they reflect completion of integrated anticipatory organisation and thus
    the transition from one to another. Much of what is conceptualised as stimulus
    ''processing'' occurs before looking at the page. The ''processing'' has been
    carried out before using the page as a ''trigger'' to completion of the action,
    or in oral reading, to whatating it is.


    Linear and hierarchical models of reading conflate psychological and neurophysiological
    concepts. Since they begin by describing operations ''necessary'' to a reading
    task, they are bound to ignore the temporal dynamics of the nervous system. Indeed,
    it is traditional to present the task components in boxes whose contents are fixed
    by how peripheral processing enables us to ''decode'' the stimulus. For theoretical
    reasons, the nervous system is said to follow this logic. There is, no reason
    for the neural activity to follow the temporal order of hypothetical psychological
    operations. The posted stimulus ''input'' may differ from neural processes following
    the stimulation of the receptors. As we read, do not have to wait for events in
    the environment. Indeed, the task structure itself sets off anticipatory neural
    processes before actual performance. Not surprisingly, then, systems form for
    dealing with the action results. The reader is not an empty'
