  md: '# The role of anticipation in reading


    # 4.2 Neural models of anticipation


    In contrast to neural information-processing models, the theory of the organism-environment
    system posits that the nervous system is organised together with bodily elements
    and environmental constituents to obtain action results (Järhilehto1998b). According
    to this theory, there is nothing for neurons decode firing. Rather, like other
    cells, neurons seek to maintain their metabolism. When this is disturbed they
    fire, and by so doing, influence neurons that form complex neural nets. By using
    neurotransmitters, the net can influence the muscles and, as a result, restore
    its metabolic state by cessation of firing. If what results is of no value, the
    neuron dies. In the nervous system, this happens all the time. Neuron firing is
    therefore not ‘information processing’


    Neurons are living cells organised metabolic systems that connect with other neurons.
    They cannot perform psychological ‘functions’ (like perception or reading). No
    neural network can analyse features of a written text, undertake mental operations,
    or build models or representations. Rather, they enable the organism and environment
    to use dynamics in a single functioning system. While reading does not happen
    in the brain, the brain is, of course, important for the reading process. However
    reading does not happen in, but in a larger system consisting of the organism
    and environment as well as the whole context where the reading occurs. The agent
    of the reading process is not a neuron or the brain, a person who cannot be defined
    by physiological concepts.


    The organism-environment system features an anticipatory neural system as is sketched
    in Figure 4. On this view, it is important that sensory receptors or receptor
    matrices are not literally ‘receptive’. Rather, they create the environmental
    connections that support the formation of the whole organism-environment system.
    inferences on receptors are of special importance. This is because, as Järhilehto
    (1999) shows in detail, they create reception matrices for the selective use of
    constituents (such as inscriptions of the text on paper). Without this, the system
    could not achieve its action results. Similarly, muscles are different organs
    that also contain afferents (‘muscle afferents’ in Figure 4) whose significance
    appears in the interplay with receptors. It is because muscles and receptors have
    a similar structure (afferent and innervation), that, together, they define parts
    of the whole organism-environment system to achieve action results (e.g., understanding
    of the text). Perception and action are not separate sensory and motor processes,
    but two aspects of the same coin, of an integrated whole. Thus reading is a sensory
    as well as a motor process.


    We cannot afford to ignore such claims when we use changes in brain activity as
    the basis for measuring the time course of reading (Sereno and Rayner 2003);'
