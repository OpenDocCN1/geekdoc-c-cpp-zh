  md: '# 2. Difference


    Entia non sunt multiplicanda praeter necessitate


    From a methodological point of view culture corresponding to the view is that
    the behavioristic approach described in the previous section may seem sound enough.
    If not necessary, we should avoid proposing a separate concept of ''meaning''
    in dealing with humans. This has, for the definition of human culture. Thus, human
    culture becomes the set(s) of human patterns of (re)action. And again, nothing
    may seem to be wrong with that. As all other organisms, we react upon our environment—we
    like or dislike, cherish or fear situations, and we act according to genetically
    or socially acquired patterns.


    A definition of culture corresponding to this point of view is of Richerson and
    Boyd (2005), who define culture as "information capable of affecting individuals''
    behavior that they acquire from other members of their species through teaching,
    imitation, and other forms of social transmission" (Ibid: 5; the definition is
    also quoted by Mesoudi, Whiten, and Laland 2006). If we rephrase the definition,
    it is that information affecting the individual''s behavior acquired from other
    members of the species, then it is culture. ''Culture'' is thus a synonym for
    ''learned behavior''—the kind of definition a primatologist like Frans De Waal
    (2001) would endorse—as it means that many animals have culture too. Apparently,
    the way in which the information, acquired in a social context, affects an individual''s
    behavior is either irrelevant or self-evident. The problem with this definition,
    and with the underlying theory, is that some forms of culture can be learned,
    culture as cannot. One can learn a language, but cannot learn to be linguistic.
    One can learn a culture, but one cannot learn to be cultural. Humans learn a culture
    because they are cultural animals. A theory of culture as learned behavior fails
    to explain the two related peculiarities of human culture: interpretation and
    creativity.


    There is something humans seem to do a little differently—not always, but often—with
    respect to, if not all, other organisms. Something in their patterns of reaction,
    in the way they use their memory, contrasts with what we find elsewhere in the
    biological world. It is a small difference that humans only recognize situations
    and on the basis of matching patterns of behavior but, strangely, may recognize
    a situation or event.4 This, it will be argued, results in human culture. In our
    terms, humans experience an absence of meaning. This awareness of absence, or
    difference (in relation to the acquired patterns of behavior), even seems to be
    basic cognition: what we recognize is not, is never identical with the patterns
    used to recognize. We do not live in, and reality do not coincide with, our representations.
    Humans'
