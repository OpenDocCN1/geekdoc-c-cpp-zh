    ence and knowledge" (Donald 1991: 309). Once we are skilled in writing, we can

    ''dump'' the cognitive load onto material artifacts and, later, use them to interact

    with our cognitive selves. While languaging is *embodied* and *distributed*, writing-

    sentences, texts) establishes cultural artifacts. Unlike speech, this impact on

