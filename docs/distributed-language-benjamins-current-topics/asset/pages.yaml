  md: '# 4. The cheap necklace problem


    The cheap necklace problem (henceforth CNP) requires a participant to construct
    a necklace. In the experimental setting, he or she is presented with four chains,
    each consisting of three links (Figure 1). The goal is to connect all four chains
    to form a closed necklace. In each step of the process, there are costs. To complete
    the task successfully, one must spend more than 15 cents where it costs cents
    to open a link and three cents to close it up. The problem demands insight because
    participants must do something that is not intuitively obvious. Specifically,
    to make a bigger chain, one of the smaller chains must be broken. Then, one should
    use these three links to connect the remaining three chains, B to C, C to D, and
    D to B, at a cost of 9 cents in total. Putting these together, 6 cents to open
    the three links plus 9 cents to close these links, 15 cents exactly.


    The choice of CNP as a paradigm for exploring problem solving offers advantages.
    Not only is it an exemplary, and difficult, insight problem (Silva 1971) it has
    been used extensively by researchers such as Wickbergen (1974), Metcalfe (1986a,
    1986b), Metcalfe and Wiebe (1987), Gilhooley and Murphy (2005), and Gilhooley,
    Fioratou, and Henrietty (2010). Unlike many insight problems, it has a clearly
    defined initial state and a visualisable goal state. Further, it is a transformation
    problem (Greeno 1978) whose solution requires a sequence of operations. Crucially,
    as Simon (1978) noted, most of what we know about problem solving and learning
    is due to analysis of behavior by people who solve transformation problems.


    | Initial State | Goal State |

    |---|---|

    | A | |

    | B | |

    | C | |

    | D | |


    You are given four sets of chain links (A, B, C, and D), as shown in the Initial
    State. Each set is composed of 3 links which are closed at the beginning of the
    problem. It costs 2 cents to open a link and 3 cents to close a link. Your goal
    is to form a closed necklace, as shown in the Goal State, using sets A, B, C,
    and D, at a cost of no more than 15 cents.


    Figure 1. The cheap necklace problem in its original form (adapted from Fioratou
