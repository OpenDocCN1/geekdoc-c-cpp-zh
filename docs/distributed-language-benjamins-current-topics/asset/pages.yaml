    # Coding procedure I: categorical resolutions


    To capture fundamental differences in verbal construal of the object-scenes, three
    experimenters coded the reports using a predefined coding scheme based on variables:
    a) communication; b) semantics/social meaning; c) addresser; d) addressee; non-communicative
    action/activity (see Table 1). To achieve a high level of reliability, the scheme
    was designed around easily recognizable, explicit lexical items. Verbal language
    is a flexible means of interpersonal meaning making, and explicit lexicalization
    is only one of a series of parameters that could be used in this regard. However,
    in priority of methodological reliability, we chose this conservative strategy
    that gave us a stringent and objective mode of investigation.


    Codes by the three experimenters were summarized in a weighted fashion for each
    stimulus image and each participant. Each description of an image was rated in
    relation to the variables ranging from none (0%), to one (33%), or two (66%) or
    three experimenters (100%). In words, a 100% score would be given if all three
    coders assigned the variable (e.g. communication) to an image'
