    In ecological approaches to the activity of conversing, the focus is on the physical
    and the pragmatic (Hodges 2007a): What activities occur as or two more people
    converse with each other in a specific physical setting, and how are those activities
    coordinated and directed over time? Speaking and listening are seen as cooperative
