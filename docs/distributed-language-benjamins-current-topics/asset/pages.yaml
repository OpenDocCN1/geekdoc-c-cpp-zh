  md: '# Symbols as constraints: Dynamics and self-organization in language 175


    Physical symbols can be thought as constructing a cognitive niche (Clark 2006).
    Given Pattee''s view of symbols, however, this is not to be explained by our skills
    in referring to (or representing) objects. Rather, linguistic function, in the
    first place, to constrain interaction dynamics. In the language niche brings new
    ways of coordinating action and shapes individual cognition. While Clark (2006)
    correctly notes that the representational functions of symbols give a role to
    the self-regulating power of self-directed speech, inter-individual communication
    is likely to be primary. Indeed, if language has a representational aspect, this
    is presumably subordinated to the coordinative function of language. This is possible
    because ongoing action is coordinated without shared referents for symbols (if
    referents are objective entities; Galantucci 2005). If language functions as social
    coordination achieved by sharing, linking (co-dividing) cognition produced in
    social practice (Hutchins 1995), then communication need not depend on negotiating
    “sameness of meaning”. In coordinated action, it often matters little meanings
    (viz. external references or mental representations) differ. Further, there are
    also situations where coordination depends on being differences in individual,
    psychological “meanings”. For example, we expect a fireman’s concept and action
    programs that relate to the word ‘fire’ to differ from the welder’s.


    Linguistic on-line communication is more than a matter of establishing reference
    (for example, by conveying intentions of a speaker vis-à-vis reference with the
    goal to shape intentions of a hearer vis-à-vis reference). However, it may also
    be much less. In communication, reference can be established by any means that
    gives enough ‘sameness’ for co-action. Indeed, this is the value of exploiting
    symbols which are ambiguous and underspecified. Linguistic forms, therefore, do
    little on their own. They function to control interpersonal dynamics in ways that
    exploit the current situational context. Once we take this view of ‘symbol’ seriously,
    we recognize that communication does not happen because of how we use language.
    Rather directs and constraints coordination, both on-line and in its evolution,
    enabling us to use extant forms of communication.


    While simulations often define ‘communicative success’ in terms of meaning mapped
    between hear and speaker, other criteria could be used. If they are focused on
    the results of coordinated action, emergent structure might be traced to features
    other than the (usually arbitrarily constructed) external world. At least in part,
    it might reflect on, in a given environment, we structure co-action. After all,
    the only gauge of communicative success is behavioral and emotional coordination.
    It is by no means obvious that these types of coordination depend on the sameness
    of reference (or even connotation).'
