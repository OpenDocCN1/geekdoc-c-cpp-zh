  md: '# 3.0 Data analysis


    Our data coding was informed by Content Analysis (Neuenendorf, 2002). The procedure
    depends on a priori identification of variables that are associated with predetermined
    hypotheses. Raw data (e.g. participants'' verbal construals) can then be coded
    in relation to predetermined variables. Once this is done, the coded material
    can be summarized and tested for differences in distribution conditions. In this
    study, two such analyses captured different aspects of image descriptions. In
    addition, we used qualitative semantic analyses to identify subtleties in the
    participants'' explorations of the scenes.


    The first coding procedure aimed to assess categorical intuitions (signal vs.
    non-signal) in relation to images from each of three stimulus conditions. We predicted
    this would be reflected in the distribution of specific lexical items in verbal
    reports. Accordingly, we sought communication- and meaning-related terms and discursive
    markers (e.g. references to addresse and addsee relations) of the kind that appear
    in the representative examples below. We describe a control (Figure 1g) and an
    experimental scene (Figure 1c) respectively:


    > Oh, it looks like your washing when you''re on holidays at a cabin or somewhere
    in Sweden. I can definitely see some pretty polka dot underwear. All looks very
    charming and idyllic.


    > You are in a forest and there is an arrow drawn in white chalk, points to the
    right, so you''re probably not supposed to go up the small path that is straight
    ahead (...)


    Although the constructs target static scenes in identical experimental settings,
    the participants construct what they see quite differently. The verbal construal
    of the control scene (cf. stimulus image Figure 1g) is apparently not intersubject
    contextualization. The participant''s sense-making relates what is depicted to
    be private, experiential associations and preferences. In this sense, it is episodic
    or unmotivated by any appeal to intentional compositional or manipulative intention
    of another agent. In contrast, the interpretive attitude manifested in the second
    example (in the description of Figure 1c), is regulated by the recognized ostensive
    quality of the items depicted. Properties of the scene are seen as constructed
    for someone else, profiling a communicative context for perceptual exploration.
    Unlike the episodic sample, this is intersubjective. The depicted items are attributed
    with imperative, instructional semantic meanings. These are reflected, for example,
    in wordings "pointing to the right..." or the modal, deontic "you''re probably
    not supposed to...". The first coding procedure (see below) will focus on on the
    contrast between episodic and intersubjective construals.'
