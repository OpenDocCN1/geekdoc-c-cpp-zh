- img_proc: true
  md: '# Symbols as constraints: Dynamics and self-organization in language 179


    and being shaped by) the dynamics that takes place in higher level interpersonal
    scales. On this view both levels will exert pressures to stabilize structures
    in evolution by processes of selection and self-organization. Importantly, many
    processes that shape language are not accessible to individual consciousness.
    Indeed, the phenomenology of language is likely to be subservient to dynamics
    at the level of inter-individual coordination.


    The above account does not explain what marks natural language from nature''s
    other symbolic processes. It is, however, clear that language contrasts with other
    symbolic processes of information transfer that characterize living beings. This
    is only a beginning to describe natural language as a system of symbols that constrain
    the dynamics of development and interactions. Maynard Smith, and Szathmary (1999:16–18)
    claim that five major qualitative changes in the way of storage and transmission
    of information had to take place in the evolution from an adaptive-self-reconstructing
    unicellular organization to a society organized through language. The issue of
    the specificity of natural language with respect to other information storing
    and transmitting systems is the next step in linking Pattee''s cognitive and linguistic
    theories. In the area of cognitive functioning, the task has already been undertaken
    by Pattee (1982, 1997) and others (see, e.g., Cariani 2001).


    One aspect of what makes language special is clear. We have descriptive rules.
    While lacking explanatory value in the larger scale of things, these *rules* do
    capture systematicities in linguistic signals. As a result, identified, they can
    perform many functions. Given cognitive systems that excel in extracting statistical
    regularities, they can be used to scaffold learning. Children notice and use systematicities,
    and in this sense, the ''rules'' that shape their knowledge (see e.g., Saffron,
    Aslin, and Newport 1996). As a result, the approach can show new light on statistical
    models of language learning, and construction learning (Goldberg 2006), assigning
    them to a stabilizing role in the overall dynamics. Being able to treat language
    as a phenomenon in itself, being able to talk about it and — apparently— identifying
    its elements on some level, undoubtedly transforms the way language is used (see
    Cooley’s “taking the stance” e.g., 2006, 2007, 2011, and Loves (2004) “second-order”
    constructs). However, even if acquiring rules as permitted什么样的 is a learning strategy,
    language remains a biological information transmission system that sustains a
    living organization. It exploits a “basic,” “primitive” relation between symbols
    and dynamics. Resorting to this primary relationship is indispensable for reasons.
    First, without grasping it, we could not understand how language originated. Second,
    no matter how much the present shape and function of language depends on self-reflecting
    agents and second-order constructs, its grounding lies in the dynamical forces
    that sustain it as a symbol system. These forces have never broken free to become
    an abstract object.'
