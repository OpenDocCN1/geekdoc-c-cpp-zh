  md: '# Bert Hodges


    The fractal pattern is global: It is as large as the sample measured, so if we
    collected more data, we would discover even larger, longer patterns than those
    observed previously. Instead of reducing variability, increased precision of measurement
    reveals more variability (Van Orden, Kello, and Holden, 2010).


    The fractal pattern is collective: it emerges over time through interactions among
    an countless large number of activities/components, which are linked in a network
    of interdependencies. The dynamics are *interaction-dominant*; the phenomena come
    into existence in a specific space-time configuration, but do not exist before
    or after any of the component systems (Van Orden, Kello, and Holden, 2010). The
    skill, knowledge, or ability demonstrated cannot be located in a brain, a body,
    a set of instructions, a set of cultural practices, an experimental set, or an
    evolutionary history. All of these and more may participate, but in the *integrity*
    of collective action they can generate the phenomena. Because of the uniqueness
    and integrity of the configurations, phenomena cannot be predicted from component
    measurements, nor can they be in a way that separates the influence of various
    participating components.


    The fractal pattern is paradoxical: The phenomenon emerges from the repetition
    of a single, "identical" set of movements (e.g., saying the word), yet the result
    is a pattern of increasing diversity. The diversity is not random; rather, there
    are correlations across scales. *These long-range correlations suggest that human
    actions are like the wave-like pattern pattern of quantum physics:* If electron
    is fed through a thin slit and a screen leaving a mark, over time a bulls-eye
    type pattern (concentric bands of light and dark) will emerge (Van Orden 2007).
    Human actions seem to be generated by "not simply interacting components but *interdependent
    components*" (Van Orden and Kloos 2003:165). Actions that occur on the scale of
    0.2 sec show dependencies on other activities that are on the order of 11,000
    (Van Orden, Holden, and Turkey 2005). Interdependence implies that each part reflects
    something of the whole in its behavior.


    The interdependence of fractal patterns suggests that human performances, linguistic
    and otherwise, are exquisitely context-sensitive, playing out on all scales simultaneously.
    Just is as true for quantum dynamical systems, human actions are marked by context-sensitive,
    global interdependence, where the measurement activity itself is one of the contexts
    that constrains the performance. Like other aspects of context, measurement is
    in principle, an essential co-author of action. It is a crucial system interacting
    with other interdependent systems, revealing their joint actions. The fundamentally
    social, distributed character of action, cognition, and skill is thus highlighted
    (Kloos and Van Orden, 2009; Van Orden, Kello, and Holden, 2010).'
