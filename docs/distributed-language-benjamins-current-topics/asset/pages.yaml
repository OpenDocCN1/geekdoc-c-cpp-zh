    We examined the relation between reading performance and FSI. This was done by
    examining the relation between FSI, reading duration, and the subject''s reading
    experience (measured by the number of books claimed to be read per year). We found
    positive correlation between FSI and reading duration (r=.519, p<.01, n=33, Pearson).
    Strikingly, subjects with more reading experience (n=17) had significantly shorter
    FSIs than those who read (n=16); on average, the difference was 46 ms (difference
    significant at p<.01; t=3.789, df=1443). Differences were most marked in the middle
    of sentences (Figure 3). In relating to eye movement parameters, we found that
    people with more reading experience used fewer fixations and larger saccades.
    These differences too more pronounced within sentences and with mid-line items.


    # 3.3 FSI: Implications for reading


    It is misguide to idealise reading as a linear analysis. There is no evidence
    for the view that it is a process of neural compression driven by fixations on
    data strings. Far from being descriptions of data decoding, information-processing
    models are flawed by unacknowledged theoretical assumptions. This establishes
    the importance of the FSI. It provides a means of obtaining data about normal
    reading that opens up the study of contextual aspects of the reading cycle. It
    contrasts with approaches based on measuring separate parameters of reading activity
    (such as duration or number of fixations).


    The fixation-speech interval is an authentic measure of a person''s reading performance.
    Our results show that FSI captures, not mechanical (speech) characteristics of
    the reading process, but by the rhythm of reading (sentence structure) and reading
    experience. By connecting FSI measures with analysis of eye tracking, we can throw
    new light on the time course of events in the reading process. In the future,
    moreover, the approach might be combined with electrophysiological or hemodynamic
    measures of brain activity.'
