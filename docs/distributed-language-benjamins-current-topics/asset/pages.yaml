  md: 'Beyond Clark''s mono-directional extension of the mind. For this reason, presenting
    the fifth claim, less attention is given to the extended mind hypothesis. Indeed,
    seeking a fuller understanding of how language shapes human ecology, invocation
    of material symbols has little to offer. Rather, the idea of an extended ecology
    combines Clark''s extended mind hypothesis with Richard Dawkins'' theory of extended
    phenotypes. As worked out in an illuminating paper by Dennis Waters (in press),
    the extended phenotype can be used to develop the distributed perspective on language.


    Classic examples of extended phenotypes are spiders'' webs and beavers'' dams.
    A web is a "temporary extension of her body, a huge extension of the effective
    catchment area of her predatory organs" (Dawkins, 1982:1992; quoted in Waters,
    in press). Unlike the spider''s web, the beavers'' dam (which is also mentioned
    by Clark, 2008:616f.) is "not a direct metabolic product" (Waters, in press).
    Further, unlike the dam, we "outlast[s] the beavers that built it and continue[s]
    to function for succeeding generations and productions" (ibid.). The examples
    give us an apt metaphor for understanding how language functions in an extended
    ecology. Language extends the individual human''s capacities for perception and
    action: like the spider, we can rely on second-hand perception (cf. Gibson, 1966:26)
    and action at a distance. If I hear a warning call ("fire!"), I might be able
    to act at a distance. Likewise, if someone senses immediate danger: "call the
    fire brigade!" Like the spider, we depend on exteriorising, the exteriorised air
    is not metabolically produced (but metabolically modulated). This means that we
    do not depend on our tactile pick-up of information, which limits the distance
    at which our extended actions and perceptions function. Rather, while the spider''s
    phenotypical extension is self-sustained, we depend on consensus to respect our
    bodily dynamics. Were this the full story, then we would be in no better position
    than vervet monkeys (another featured example of Waters'', in press) who can perform
    alarm-response by calling of only three distinct calls. However, as human beings
    who have a language stance, we have a vast inventarium of developed socio-cultural
    resources at our disposal. In this respect, we are more like beavers than spiders:
    we can take advantage of our ancestors'' experially developed ways of coping with
    their everyday existence. We normally rely on our experiences as they are compressed
    in verbal patterns: we trustfully rely on the "wet paint" sign, allowing our behaviour
    to be shaped by the arduous lessons of our forefathers. As pointed out by Clark,
