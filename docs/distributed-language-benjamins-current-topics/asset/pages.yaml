  md: '# Ecological pragmatics 155


    not. It partially occludes ecological relationships that provide the resources
    for acknowledging dependencies and obligations that make our actions possible.
    Skilled activities, from juggling balls to “juggling family and career”, seem
    to balance on the edge of laws and rules (Hodges 1995:6–7), since the very existence
    of these skills depends on the intention to realize values. The juggling inherent
    in speaking and listening also lives on the edge. Beek, Turkey, and Schmidt (1992:91)
    have argued that biological action systems are “to a considerable extent ‘frustrated’
    … subject simultaneously to very many different physical requirements that they
    cannot possibly satisfy fully”. This is precisely the heterarchical nature of
    values. Conversing with others always yields a kind of suffering: as we engage
    in conversations over time, we come to realize that no matter how hard we work,
    we can be completely clear, coherent, comprehensive and complex at all. This frustration
    is painful, but paradoxically, it is also the basis for hope. Because of dialogical
    arrays, the long-range correlations we embody, we are able to share a world that
    is larger than any one of us can see. Dialogue acts as our con-science (i.e.,
    consciousness) and allows us to engage in joint actions that negotiate the demands
    of existence.


    Only in appreciating the opacity of persons, in actually caring for them as persons,
    is it possible for a dialogical array to function as a substantive horizon, and
    for it to be relatively transparent medium for the prospects and history beyond
    the horizon. If we engage in the indirectness of pragmatics will it possible to
    be careful of caring for the ecosystem that sustains, obligates, and informs us.
    Dialogical arrays reveal metaphorically. The reality that is nearer is used to
    probe the reality that lies further, beyond the horizon. If we have the humility
    to submit to the dialogical array, and the confidence to risk being answer to
    the other (Bakhtin 1986), we will have the hope necessary to trust language as
    a medium of perception and as a mode of action.


    # Note


    +   * An earlier version of portions of this chapter was presented at the Symposium
    on Language dynamics and the phenomenology of individual experience at Agder University
    College, Grimsand, Norway, May, 2007, at the kind of Paul Thibault. My thanks
    to Reuben Baron, Stephen Cowley, Damian DiMauro, Timo Jarvilehto, Alex Kravchenko,
    James Martin, and Guy Van Orden for comments and suggestions on earlier versions
    of this paper, as well as to Stein Bräten, Lynne Cameron, Barbara Johnstone, Jem
    Lemke, Per Linell, Derek Melser, and other symposium participants. Special thanks
    to Joanna Rączeszek-Leonardi, Sune Steffensen, and Christian Tylén for their careful
    reviews. Support from Initiative and Faculty Development grants of Gordon College
    is gratefully acknowledged.'
