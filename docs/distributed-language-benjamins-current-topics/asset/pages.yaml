  md: '# Stephen J. Cowley


    the functional system co-ordinate with objects such that, on occasion, insight
    arises. By analogy, it is through active engagement with documents, programs,
    books and carvings that they come ‘alive’. As human sense-making is constrained
    by objects and/or wonders. Remarkably, Tylén al (this volume) apply a similar
    to logic objects. Building on fMRI studies of how brains activate when experimental
    participants look at images that show various arrangements of everyday items (e.g.
    chairs), they find their findings onto verbal reports. In comparing descriptions
    of ‘signal’ images with ones depicting scenes, they find that, in the former case,
    people offer other-oriented descriptions. Their intersubjective reports evoke
    collective values. While the examples are aesthetic, the same logic may well apply
    to axiological questions.


    Continuing the cultural theme, Tribble (this volume) reconsiders Elizabethan/Jacobean
    performances of Shakespeare’s plays. Enacting a performance was more important
    than reiterating verbal (or coded) content. Company sharers, together with hired
    men, used material resources to improvise. Unlike others who remain true to a
    text, they recreated what they imagined. Performing as distributed cognitive systems,
    linked verbal patterns, gestures, metrical patterns in a public space. Given how
    Shakespeare’s work was performed, his writing shows collective influence. Certainly,
    collectivity illuminates feats like 6 plays in the same period. Next, Van Heusden
    (this volume) turns to intra-cranial resources. On his double processing hypothesis
    we develop internal signs based on perceiving differences. Though human memories
    never correspond to events, they stabilize reality and the mimetic semiosis as
    a form of semiotic cognition, van Heusden''s view contrasts with that of the other
    contributors.


    The final papers develop ecological themes. Rejecting rules or value-free norms,
    Hodges (this volume) presents language as a caring system. It augments our perceptual
    and actionable powers by realizing values that connect an individual with a collective
    domain. This ecologically special and shapes human modes of being. Next, Rązaszek-Leonardi
    (this volume) addresses how language can be both symbolic and dynamic. Using biometrics,
    she suggests that, just as living systems, no symbol can be abstracted from the
