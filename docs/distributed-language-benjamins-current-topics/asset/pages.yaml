  md: 'edict encouragement and approval from purveyors of socially approved values
    and norms. Professional educators too have their own personal values and preferences
    which play out in multiple domains giving rise to similar, though contending goals.
    A human individual, whose linguistic behavior is influenced by the educational
    domain of interactions, comes under pressure to build specific interpretive strategies
    based on numerous contextual parameters. It is necessary to judge, in relation
    to his consensual domain, whether his linguistic behavior has been ‘approved’
    by those who have respective authority. Equally, he must decide whether or not
    to use the same model as in the domain of family/home interactions. As a result,
    when interacting in the domain of written texts he is to structure his linguistic
    behavior (interpretation of texts) with reference to how he interprets the physical
    context — which has nothing to do with the text to be interpreted by definition.
    Graphic markings, which resemble code symbols, make interpretation possible across
    different uses in time and space. Since this is the most relevant function of
    writing, graphic images are often (mistakenly) seen as linguistic signs. This
    failure to draw ontological/experiential distinction between speech as local and
    temporal, and written text as non-local and temporal, lays the ground for functional
    failure in linguistic behavior (both reading and writing). In dealing with written
    texts, it leads to communicative dysfunction (Kravchenko 2009b).


    A striking example of communicative dysfunction on the part of a writer would
    be a notice attached to an office door, such as:


    +   (2) Be back in 20 minutes.


    By creating this text his author enters the domain of specific linguistic interactions
    by identifying graphic markings with signs of natural language that might serve
    in the consensual domain of interactions. Thus the author of the notice strips
    his linguistic behavior of its ability to exert orientational influence for the
    simple reason that, in these circumstances, there is no consensual domain. No
    reader can establish a common point of reference, it is necessary to guess whether
    one will have to wait 5, 10, or all of the 20 minutes (granted that the notice
    is true to his word). Of course, this interpretation of the situation assumes
    that the writer is not cognitivelylinguistically sophisticated. It is also possible
    that whoever wrote it realized fully well what he was doing. The sign may also
    be used, for example, to provide cover for absence from the workplace.


