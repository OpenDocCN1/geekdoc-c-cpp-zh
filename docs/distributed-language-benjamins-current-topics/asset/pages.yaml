    Pattee (1972, 1987, 1997) finds two functional reasons for not describing systems
    in terms of physical, time-dependent, universal laws. The first is that of control.
    During morphogenesis this permits selective control of the rate of protein synthesis
    and, by extension, the ontogenetic formation of functional structures (morphology).
    The second process is measurement. This is a selection process which depends on
    choosing a multitude of dynamical processes. The result, which occurs at a particular
    moment, is symbolic. Indeed, since according to Pattee, symbols can only arise
    through measurement, the processes are functionally connected.³ It is because
    the constraints must carry (be remembered) across situations where the symbols
    must be physically instantiated. This ensures that when measurements give efficient
    control of structures and behaviors in an environment results are preserved. Physical
    structures which necessitate description in terms of symbols are the basis for
    the displacement of measurement and control processes.


    The DNA of a cell exemplifies the physical realization of a structure that has
    symbolic function, i.e., the symbolic mode of a dynamical system. Its two descriptions,
    1) as symbols and 2) in terms of physical laws, are in Patlee''s theirs disjoint
    but complementary (Pattee 1996:262–263). Since Pattee emphasizes the necessity
    of the two modes of description, which represents a type of duality: however we
    should treat it a non-Cartesian duality: neither can function independently of
    the other. It would, therefore, be impossible to rely solely on the symbolic description
    to formulate either the rules of construction (in the case of DNA) or information
    processing (in the case of the “symbolic mind” of classic cognitive science).
    The claim about the fundamental role of symbols in living organisms makes Pattee
    approach consonant with approaches in biosemiotics that the relation of meaning
    (there what happens between symbols and dynamics) is a primitive element of the
    description of living organisms (see, e.g., Barbieri 2007 or Favareau 2007). Emphasis
    on the co-presence of the descriptions in living systems has profound consequences
    for Pattee''s concepts of symbol and meaning. Thus do not give detailed specifications
    of natural dynamics but, rather, constrain what happens. Neither contain detailed
    programs for the actions nor give blueprints for structures that they build. Just
    like a cell''s DNA, a symbol serves to harness dynamics that are already there.
    By definition, symbols function as “hierarchical constraints which harness matter
