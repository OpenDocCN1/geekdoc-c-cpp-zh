  md: 'However, besides the categorical distinction between communicative and non-communicative
    object configurations, we show how social contextualizations of the objects regulate
    participants'' interpretative attitudes. From great variability in participants''
    sense-making approaches to images of the control condition, these align in interesting
    ways participants approach images of the experimental conditions. We speculate
    that these alignment effects are due to an orientation of shared norms for such
    expressive practices (not incomparable to the idea of top-top interactions, Roepstorf
    & Frith, 2004). Our findings suggest that our engagement with objects and properties
    of the material environment as mediating intersubjective meaning should be considered
    in continuation of other human expressive behaviors as verbal language and gesture.
    Unlike verbal utterances, some object configurations motivate the activation of
    situated affordances that embody meaning. This process entails responsive sensitivity
    to dynamic matter and attunement to regulating norms that guide construction.


