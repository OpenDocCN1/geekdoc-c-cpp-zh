  md: 'the items. Those who take a global view and disregard compositional details,
    note the everyday scenery of the parking lot. In such cases, the artistic construal
    is less likely than one who focuses on a symbolic, "practical joke".


    The example then complements the general idea put forth in the introduction in
    interesting ways: the recognition of purposeful ostensive qualities of the composition
    increase sensitivity to the meaning potentials of the contextualized material
    structures (Tylén, 2007); By attent to available intersubjective contextualizations
    and norms, the perceiver actualizes semiotic affordances. To the extent that the
    object configuration relies on less conventional modes of expression, this actual
    process becomes less regulated and potentially more polysemous.


    # 5.0 Conclusion


    In this study we examined a special kind of social sense-making activity manifest
    in how we come to perceive novel configurations of everyday objects as mediating
    communicative interaction. This happens when configurations are experienced as
    arranged or manifested in striking and purposeful ways that afford special style
    of exploration. Expanding upon a recent brain image study (Tylén et al., 2009),
    we conducted an experiment comparing participants'' casual comprehension of a
    series of images belonging to three conditions: conventional material signals,
    unconventional material signals and object configurations without any conspicuous
    communicative relevance. Analyses of participants'' oral constructs show they
    consistently pick up on certain ostensive qualities in compositional details of
    the experimental (and not the control) conditions and approach object configurations
    as ''acts of signaling.'' This shift in perceptual attitude is manifested in significantly
    more explicit references to communication and related terms as well as by references
    to discursive roles (addresser and addisee) in descriptions of experimental reality
    to control scenes. Rather than a ''private'' mode of perception structured by
    episodic experience, for a ''public'' mode of perception sense-making; compositional
    properties of these scenes and properties of the material environment are actualized
    as sources of intersubjective meaning-making. These results are consistent with
    behavioral studies of how ostensive cues affect infant comprehension of object
    manipulations (Gergely et al., 2007; Senju & Csiba, 2008; Senju et al., 2008),
    and by neuro-cognitive findings (using very similar stimuli) showing that only
    the objectsignals elicit enhanced neural activity in meaning related brain regions
    like Broca''s area of the inferior frontal cortex (Tylén et al, 2009).'
