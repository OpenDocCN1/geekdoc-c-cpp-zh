    # 3. The social dimension of languaging as human niche construction


    CLAIM 3: Language gains its cognitive power from, not how individual cognizers
    handle it, but from how they adapt to socially moulded niches.


    Niche construction is “the process by which animals build physical structures
    that transform problem spaces with aid (or sometimes impede) thinking and reasoning
    about some target domain or domains” (Clark, 2008:62). Classical examples are
    the structures made by beavers, bees, and termites. But human beings also exploit
    their environment in this way, and Clark features certain examples, especially
    Tribble''s (2005) study of how scenic structures of the Elizabeth theatre assisted
    the actors in remembering plots and lines (see also Tribble, this vol.). Unlike
    artifacts and actions that facilitate thinking are called epistemic artifacts
    and epistemic actions (cf. Kirsh and Maglio 1994; Kirsh 1995), respectively, and
    point to the looping interaction between brain, body, and world, showing that
    “inner-outer boundary is both analytically unhelpful and computationally far less
    significant than one might have pre-theoretically supposed” (Clark, 2008:73).


    Interestingly, Clark investigates these structures in Chapter 4, World, Incorporated
    (61-82), i.e. after having presented language in Chapter 3 (Material Symbols).
    Had Clark reversed the order of these chapters, he might have asked whether language
    enriches the niche as material structures and epistemic artifacts? Rather than
    priori assuming that language scaffolds cognition, we can ask how language (strictly,
    stabilized patterns of languaging in social contexts) influences the human ecological
    niche. This question is the topic of the current section.


    Just as beavers “collectively build structures (i.e. dams) that persist over their
    own lifetime” (61), phenomenologically stabilized patterns of languaging persist
    beyond an individual lifetime. What doesn''t work communicatively is selected
    out the evolutionary history of languaging, not blindly, but as a result of behavior
    that emerges from doing things with other people. Therefore, far from considering
    in material systems vis-à-vis the individual cognizer, linguistic phenomena shape,
    and are shaped by, a much larger community of individuals moulded in and by human
    sociality. However, while a beaver is material, human languaging draws on both
    material properties and phenomenological experience: not only are we moved by
    the movements of the other, but after early infancy, we come to have utterances
    as wordings, or in Cowley''s terms, to take a'
