  md: 'We founded the Distributed Language Group (DLG) whose first meeting at Sydney
    Sussex College gave rise to papers (see, Cowley, 2007b) to inform the current
    focus on dynamics. However, before turning to their multi-scalar complexity, I
    sketch how language is ecological, dialogical and non-local.


    # 4. Language: ecological, dialogical and non-local


    Whereas disembodied views place language in either the mind or in society, the
    distributed perspective treats language as part of the ecology. It arises as social
    events link body with the physical environment and cultural traditions. Language
    is therefore neither localized within a person (or a body) nor property of the
    environment. This ecological perspective challenges all organism-centred models.
    It asserts that, “in any functional sense organism and environment are inseparable
    and form only one system” (Järilehto, 1998:329). Rather than separate language
    from artifacts and actions, a history of body co-ordination gives us the necessary
    skills. As we go about our lives we encounter and others whose lives are deeply
    affected by linguistic resources. Language is active in which words play a part.
    The umbrella definition permits us to connect concepts that include ‘languaging’
    (Maturana, 1998; Kravchenko, 2006), ‘utter-activity’ (Cowley, 2094, 2009b; Thibault,
    2011), ‘first-order language’ (Love, 2004), ‘dialogue’ (Linell, 2009), ‘colloquy’
    (Jennings and Thompson, in press) and ‘embodied, embodied language use’ (Fowler,
    2010).


    In denying that individuals produce and process utterance-types, coordination
    is traced to use of ecological resources. As we engage with language, we dream,
    think, use text and telephones, computers and so on. In recognising this diversity,
    the study of language becomes ecological (see, Hodges, 2007; Hodges and Fowler,
    2010; Thibault, 2011; Cowley, 2011). More specifically, emphasis falls on results
    from continuous activity by Organism-Environment Systems (see, Jarilehto, 1998;
    2009). On this view, the concepts of language, action and perception can also
    be the same events. To read, is to perceive and, necessarily, to construct what
    one sees. In dialogue, as we speak, dynamics shape shaping, feeling and thinking.
    Even writing depends on monitoring the results of movements in real time and by
    means of editing. As part of action and, given imagination (or consciousness),
    language becomes part of silent thought; it is is gradually insinuated into reverberated
    phonetic gestures are connected with both windings and modes of life. Utterance-activity
    arises as we make and track phonetic gestures (Fowler, 2010) that prompt us to
    hear utterance-types. Using different time-scales, which linguistic evokes'
