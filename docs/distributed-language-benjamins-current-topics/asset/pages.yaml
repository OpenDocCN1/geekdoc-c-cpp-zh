  md: '# 2. From language to languaging


    Claim 2: Language is irreducibly bound up with real-time metabolic activity (e.g.
    voice dynamics, gaze and task-oriented modes of action).


    Clark''s assertion that language has a “material stability” is contradicted by
    experimental phonetics (cf. Port and Leary 2005; Port 2010). Linguistic vocalizations
    are so diverse that we must question any theory attributes “material stability”
    to language. By way of illustration, Port (2010) invites us to consider a single
    speaker’s pronunciation of the syllables [di] and [du] (as in Dee and Dew).⁵ He
    suggests that, as literates, we believe that these consist of the same consonantal
    onset and two different vowels. In fact, as Port demonstrates,


    They sound to us like they have the same initial “sound,” but do not have anything
    that is a physical invariant. This situation is not rare, but is actually the
    norm wherever you look in speech. (Port, 2010:49)


    Port continues:


    The conclusion I have drawn from attempts over the last half of century to find
    physical correlates of units like phonemes is that obviously do not have invariant
    physical correlates. Languages work anyway despite the fact that speakers have
    idiosyncratic auditory systems as well as idiosyncratic speech articulation. (Port,
    2010:43f).


    Clark finds victim of what Per Linell the written language biases in linguistics
    (Linell 2005), i.e., the view that language structurally – phonologically, morphologically,
    and syntactically – like an alphabet where smaller buildingblocks are composed
    to construct larger blocks. Since, phonetically, this is false, it is unwarranted
    to rely on ‘internal’ linguistic units. In Port’s terms, “linguistic memory does
    not extract an abstract, context-free, non-overlapping invariant for each consonant
    and vowel” (Port, 2010:48).


    In a distributed view, this line of argument leads to the insight that the stability
    we experience is not based on an individual’s (representational) skills, but on
    our ability to make and what Fowler terms “phonetic gestures” (cf. Fowler and
    Rosenberg, 1991; Thibault 2011). This ability emerges through “education of attention”
    (Gibson, 1966): in interactions with caregivers, infants attend to specific patterns
    of activities, and in doing so they learn to take a language stance (Cowley, 2007b;
    2011). Indeed, without stance-taking, people would be unable to control speech
    by choosing what to say, just as they would lack a phenomenological experience
    of apparent linguistic stability. What we perceive as materialy stable in language
    is deeply influenced by sociocultural norms (cf. Linell, 2009; Cowley and Zheng,
    2011).'
