  - 3.1 (问题背景)。令 V 为结构化词表集，Aₓ 为 V 上的公理集，它们用形式语言 L 阐述。问题上下文 C = ⟨I, Cₓ, Aₓ⟩ 是一个元组，由上下文标签
    I、特定语境的概念 Cₓ ⊑ C、特定语境的角色 Rₓ ⊑ R 以及特定语境的约束和 Aₓ ⊑ Aₓ 组成，用于生成一个语境化的本体。
- - '###'
  - 3.2 (语境化本体模块)。给定本体 O = ⟨T, A⟩ 和问题上下文 C = ⟨I, Cₓ, Rₓ, Aₓ⟩。本体 O' = ⟨T', A'⟩ 是 O
    的语境化本体，定义为 O' ⊑ O，其中术语 T' ⊑ T 和公理断言 A' ⊑ A 是处理概念 C'（使得 C' ⊑ C）、角色 R' ⊑ R（使得 R'
    ⊑ R）以及个体 I' ⊑ I 的公理；将特定语境的约束 A'ₓ ⊑ A'ₓ 应用于 O'。
