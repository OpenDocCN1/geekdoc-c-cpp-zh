  - 减少模块的总数。尽管模块总数远未达到 Koala 和 Mereology 2^25 的理论上限，但它仍然太大，无法单独检查每个模块，无法让本体用户定期进行操作。因此，我们尝试了两种方法将总数减少到更少“有趣”的模块。
