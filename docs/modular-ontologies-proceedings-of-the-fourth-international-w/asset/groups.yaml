    Extracting and Merging Contextualised Modular Ontologies under the supervision
    of Raza Abidi. His research interests include (i) Ontology Modularisation, (ii)
    Ontology Reconciliation of Merging, and (iii) Ontology Debugging. He is a Assistant
    at the University of Manchester. His research interests are focused on formal
    logic, description logics, reasoning optimization, and, and ontologies.


