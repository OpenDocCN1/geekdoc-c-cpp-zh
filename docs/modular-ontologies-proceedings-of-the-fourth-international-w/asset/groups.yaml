    ## 问题空间


    搜索与救援（USAR）活动在非结构化环境中进行。当一个环境的完整性因自然灾害（如地震、喷发等）或人为事件（如炸弹或建筑坍塌）而改变时，该环境即是非结构化的。由于此类现场存在许多风险，大多数时间内操作员在远程现场进行操作，只能通过机器人接口获取适当的状况感知或人机感知。环境的复杂性以及远程机器人控制导致了高认知负荷的评估。


    USAR 操作建模涉及对两个方面的理解：如何表征非结构化环境，以及与搜索救援工作流相关的主要要求。Murphy [17] 以及 Chatterjee 和 Matsuno
    [7] 关于 USAR 任务、环境和操作员要求的两项研究影响了我们的分析。


    ## 2.1. USAR 室内环境表征


    根据 Murphy 的观点，救援环境分为三个不同的区域。热区（hot zone）是实际灾区，可以通过空隙进入。温区（warm zone）是救援人员在进入热区之前准备的地方。最后，冷区（cold
    zone）是指挥总部所在地。USAREnv 只关注热区。


    表征和描述非结构化的室内环境非常困难。先验信息（如项目计划）部分有用，因为环境状态已经改变。大多数典型的地标（例如房间或走廊）可能不再重要。需要一种不同的分类，且必须考虑到
    USAR 活动的特殊特征。一个现场可以分为若干区域（或分区）。其中一些可以通过开口进入，而另一些仅可观察到，甚至被完全覆盖或淹没。每个区域都应该用对机器人部署和人类响应者都有用的信息进行描述。这种描述是一组区域条件。救援现场区域的特征与结构化环境完全不同。区域条件的示例可以是：


    光照、杂乱程度、毒性水平、移动难度、通信水平等。对所有不稳定或受损的物体、突出的结构元件、气体或电力泄漏进行制图也是重要的。


    G. Randelli 和 D. Nardi / 将本体最佳实践与设计模式引入机器人领域 71


    ## 2.2. USAR 活动要求


    为救援任务部署机器人配置仍然是一个非标准化的过程，不如说是由 SAR 专家执行的即时活动。在最开始，由于安全问题，人类人员无法进入现场。因此，部署机器人产生初步评估，并在远程现场进行控制。这个过程是迭代的：每当获取新信息时，它就会与之前的信息整合，针对更窄的区域精细化和专门评估，并选择更合适的机器人配置。当某些区域被宣布为安全时，人类救援队可以与机器人一起部署，以便在现场进行响应并进一步增加信息的详细级别。US
    工作流由五个主要活动组成。该分析基于 Chatterjee 和 Matsuno [7] 的工作。


    - 观察与分析。获取有关状况的相关信息是定义后续任务的第一步。深入来说，根据 Drury 等人 [10]，获取适当的人机感知和态势感知涉及几个方面：受控的机器人、其邻近环境、其他操作员、机器人团队以及任务目标。一个重要方面是衡量与特定区域相关的风险程度；这需要评估物体和所有结构元件的稳定完整性。上一次迭代提供的反馈与旧数据整合。


    - 任务识别。根据特定任务的完成情况，引出子任务或定义新任务。任务的示例包括：映射、探索、寻找受害者、递送物体、离开现场等。


    - 资源管理。以当前状况评估和要完成的任务作为输入，分配资源，包括机器人、硬件和软件设备、现场人员（如果允许进入）。在救援专家和机器人专家之间选择正确的资源。资源可能不可用，应该订购并交付，随之产生的延迟必须考虑内。资源选择基于几个方面：机器人限制、能力、与人类或其他设备的交互、环境条件等。


    - 操作执行。在此阶段，一个或多个操作员负责控制和监控每个机器人；例如，设置其速度或自主模式，选择特定的探索策略等。由于主要目标是寻找幸存者，操作员必须控制机器人以评估检测到的人是否还活着。如果检测到的人还活着，收集一些关于其健康状况的信息是非常重要的。这些数据将有助于医生和救援人员决定如何救援该人员以及她需要的医疗护理。


    72 Randelli 和 D. Nardi / 将本体最佳实践与设计模式引入机器人领域


    - 性能评估。活动环的结束需要评估所采用的配置，针对特定的区域和任务。这将为迭代过程提供反馈。


    ## 3. USAREnv


    ### 3.1. 能力问题（Competency Questions）


    对救援环境和 USAR 活动的分析可以识别出若干能力问题。能力问题是定义本体范围的一种方法，因为知识库应该包含足够回答这些问题的信息。我们在这里列出了针对我们问题的能力问题列表。这并不是详尽的，因为我们认为本体建模应该是一个涉及专家社区的协作迭代过程。尽管如此，我们认为
    USAREnv 提供了足够相关的概念集，以便机器人团队进行整合。问题被分为四组：现场、区域、环境要素和人员。它们的识别决定了 USAREnv 的模型定义。


    ### 3.2. USAREnv 模型


    USAREnv 定义的主要概念概述如图 1 所示。“环境”（environment）一词已被许多本体采用，从地理或生物学视角对其处理。由于我们的观点更具操作性并与特定任务相关，我们倾向于采用“现场”（site）一词。


    现场具有某些属性：


    +- 灾害原因（地震、喷发、爆炸、火灾、洪水、滑坡、风暴、其他类型的灾害）；

    +- 是否为公共现场，这影响估计的人数；

    +- 全球定位，以便使用无人机或卫星获取航空图像。


    现场被分解为区域（或分区）。每个区域由若干区域条件表征。它们代表每个区域的固有特征，或者由某些包含的元素决定。在任何情况下，每个区域条件的要求都是为了区域相对于相邻区域的独特表征。任何不符合此要求的区域都是偶然属性（accidental
    property）。偶然属性像条件一样描述区域的一个特定方面，但它们不对区域检测做出贡献。这种区分允许将符号仅分组为区域条件，而在任务执行期间使用偶然属性作为额外信息。一些关于感知锚定的支持这种方法。Coradeschi
    和 Saffiotti [8] 区分了匹配属性和动作属性，而 Bonarini 等人 [4] 区分了实质属性和偶然属性。


