    # G. Randelli and D. Nardi / Introducing Ontology Best Practices and Design Patterns
    into Robotics 77


    Task Force (OEP) defined the n-ary relations design pattern to extend OWL language
    and overcome this limitation [18]. Being a logical pattern, it is language dependent,
    but context-independent, hence there is no ontology implementation that can be
    imported and reused. In USAREnv this pattern is useful to model the adjacency
    problem concern-


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_96_0.png)


    Figure 2. 2D example of adjacent areas. An area (A) can be adjacent to multiple
    areas on the same side, and an area (C) can be adjacent to another area from different
    sides.


    ing areas (see Figure 2). In particular, our competency questions are the following:


    +   1. an area is identified by six sides (top, bottom, left, right, front, back);

    2. an area can be adjacent to different areas on the same side;

    3. an area can be adjacent to the same area on different sides;

    4. given an area, any adjacent area can or cannot be accessible from the given
    one.


    These competency questions address a relation between four individuals: a source
    area, a destination area, an adjacency side, and an accessibility condition (see
    Figure 3). The n-


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_96_1.png)


    Figure 3. Entity-relationship diagram about the problem of area adjacency. The
    Crow’s foot notation shows how an area can have multiple adjacent areas on the
    same side. On the converse, every adjacent area can be adjacent to another area
    on multiple sides.


    ary relations design pattern models this problem through reification, that is
    representing the relation with a class, whose individuals are instances of the
    relation itself. Additional'
