    (CP). With contrast with LPs, a CP is an ontology itself, and can be easily imported
    or reused or extended. Presutti and Gangemi [19] introduce the concept of content
    ontology design patterns, showing their creation and usage. Blomqvist et al. [2]
    evaluated content ontology design patterns through experiments, in order to identify
    their benefits, as well as the needs to foster their reuse. Some known CPs are
    available online at their project OntologyDesignPatterns.


    ODaps developers belonging to the robotic community, but not expert in ontology
    engineering, to develop robotic ontologies with less effort, reusing existing
    ontologies, even general purposes, and adopting validated solutions for well known
    problems. This approach fosters the development of high quality ontologies, which
    can be reused and shared with other devices or humans, enhancing a pervasive deployment
    of robots in many scenarios of everyday life.


    ## Problem space


    USAR activities are conducted in unstructured environments. An environment is
    unstructured when its integrity is altered by a natural disaster (e.g. earthquake,
    eruptions, and so on) to an artificial event, such as a bomb or a building collapse.
    Because of the many risks within such a site, most of time operators act from
    a remote site, and can acquire a proper situation or human-robot awareness only
    via robotic interfaces. The complexity of the environment, as well as the remote
    robot control, contributes to a high cognitive demanding assessment.


    USAR operations modelling the understanding of two aspects: how to characterize
    an unstructured environment, and what are the main requirements associated with
    the search and rescue workflow. Two studies concerning USAR tasks, environments
    and operator requirements, conducted by Murphy [17], and Chatterjee and Matsuno
    [7], influenced our analysis.


    ## 2.1. USAR Indoor Environment Characterization


    According to Murphy, a rescue environment is decomposed into three different zones.
    The hot zone is the actual disaster area, accessible through some voids. The warm
    zone is the place where rescue personnel prepares before entering the hot zone.
    Finally, the cold zone is where the command headquarters is set. USAREnv focuses
    only on the hot zone.


    It is very hard to characterize and describe an unstructured indoor environment.
    A priori information, such as project plans, are only partially useful, because
    the environment status is altered. Most of the typical landmarks, for example
    rooms or corridors, may not be significant. A different classification is necessary,
    and it must take into account the peculiar characteristics of USAR activities.
    A site can be divided into areas (or zones). Some of them are accessible through
    openings, while others are only observable, or even completely covered or submerged.
    Every area should be described with useful information for both robot deployment
    and human responders. This description is a set of area conditions. What characterizes
    an area within a rescue site is completely different from a structured environment.
    Examples of area conditions can be:


    lighting, cluttering, toxicity level, mobility hardness, communications level,
    and so on. It is also important to map all the unstable or damaged objects, the
    protruding structural elements, gas or electric leaks.


    G. Randelli and D. Nardi / Introducing Ontology Best Practices and Design Patterns
    in Robotics 71


    ## 2.2. USAR Activities Requirements


    Deploying the robotic configuration for rescue missions is still a non standardized
    process, rather an ad-hoc activity performed by SAR experts. At the very beginning,
    access to the site is precluded for human personnel, due to safety issues. Hence,
    robots are deployed to produce a preliminary assessment, controlled from a remote
    site. This process is iterative: every time new information is acquired, it is
    integrated with the previous one, the assessment is refined and specialized for
    narrower areas, and more suitable robot configurations are selected. When some
    area is declared as safe, a human rescue team can be deployed with robots to have
    on site responders and further increase the information detail level. US workflow
    consists of five main activities. This analysis is based on the work by Chaterjee
    and Matsuno [7].


    - Observation and analysis. Acquiring information relative to the situation is
    the first step defining the next tasks. In depth, acquiring a proper human-robot
    awareness and situation awareness, according to Drury et al. [10], involves several
    aspects: the controlled robot, its nearby environment, other operators, the robot
    team, and the mission goal. An important aspect is to measure the risk degree
    associated to a specific area; this requires to assess the stability and integrity
    of physical objects and all the structural elements. The feedback provided by
    the previous iteration is integrated with the old data.


    - Task identification. According to the accomplishment of a specific task, sub-tasks
    are evinced, or a new task is defined. Some examples of tasks are: mapping, exploration,
    search for victims, delivering objects, leaving a place, and so on.


    - Resource Management. Given as input the present situation assessment, and the
    tasks to accomplish, resources are allocated, in terms of robots, hardware and
    software equipments, on-site personnel (if allowed to enter). Selecting the right
    resources among rescue and robotic experts. The resource could not be available
    and should be ordered and delivered, with a consequent delay that must be taken
    into account. Resource selection is based on several aspects: robot constraints,
    capabilities, interaction with humans or other devices, environmental conditions,
    and so on.


    - Operation execution. During this phase, one or more operators are in charge
    of controlling and monitoring each robot; for example, setting its speed or an
    autonomy mode, selecting a specific exploration strategy, and so on. Since the
    main goal is to look for survivors, the operator must control the robot to assess
    whether a detected person is still alive or not. If the detected person is still
    alive, it is important to collect some information about her healthy status. These
    data would be useful for doctors and rescuers to decide how to rescue the person
    and the medical cares she needs.


    72 Randelli and D. Nardi / Introducing Ontology Best Practices and Design Patterns
    into Robotics


    - Performance evaluation. The closure of the activity loop requires to evaluate
    the adopted robot configuration, with respect the specific area and tasks. This
    will provide feedback to the iterative process.


    ## 3. USAREnv


    ### 3.1. Competency Questions


    The analysis of rescue environments and of USAR activities allows to identify
    several competency questions. Competency questions is a method to define the ontology
    scope, since the knowledge base should contain enough information at answer these
    questions. We evin and report here a list of competency questions for our problem.
    It is not exhaustive, since we believe that the modelling of an ontology should
    be a collaborative and iterative process, involving a community of experts. Nevertheless
    we argue that USAREnv provides a sufficiently relevant concept set, so that robot
    teams can integrate it. The questions are collected in four different groups:
    site, areas, environmental elements, and people. Their identification determines
    the model definition of USAREnv.


    ### 3.2. USAREnv Model


    An overview of the main concepts defined in USAREnv is reported in Figure 1. The
    term "environment" has already been adopted in many ontologies, addressing it
    from a geographical or biological perspective. Since our point of view is more
    operational and related to a specific kind of mission, we prefer to adopt the
    term site.


    A site has some attributes:


    +- disaster causes (quake, eruption, explosion, fire, flood, landslide, storm,
    other types of disaster);

    +- whether it is a public or private site, which influences the estimated amount
    of people inside;

    +- worldwide localization, to acquire aerial images using UAVs or satellites for
    ample.


    A site is decomposed into areas (or zones). Each area is characterized by several
    area conditions. They represent intrinsic characteristics of every zone, or they
    are determined by some contained element. In both cases, a requirement for every
    area condition is to contribute to a unique characterization of area with respect
    to its adjacent areas. Any area that does not satisfy this requirement is an accidental
    property. Accident properties, like conditions, describe a particular aspect of
    area, but they do not contribute to its detection. This distinction allows to
    group symbols only to area conditions, while using accidental properties as further
    information during task execution. Several works about perceptual anchoring this
    method. Coradeschi and Saffiotti [8] distinguish between matching and action properties,
    while Bonarini et al. [4] differentiate between substantial and accidental properties.


    We have identified a list of relevant areas, reported in Table 1, partially based
    on the work of Chatterjee and Matsuno [7]. Most of these characterize areas in
    order to deploy the right configuration of robots. They can be inferred by-

