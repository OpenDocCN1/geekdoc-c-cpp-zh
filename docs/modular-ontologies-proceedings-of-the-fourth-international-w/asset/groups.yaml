    OWL 概念如 owl:intersectionOf 和 owl:unionOf 允许使用（原子或复杂的）概念定义复杂概念。对于我们的目的，当需要提取某个概念或其定义时，本体提取必须限定在所需的概念，而不是它们更泛的概念（见
    3.3）。在示例 4.1 中，:C5 定义为 :C2 和 :C3 的并，其中 :C5 是 :C2 的更泛的概念，用户并不感兴趣。尽管，对于选取的概念 C2，处理
