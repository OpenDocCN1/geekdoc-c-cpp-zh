    以及 $Sig^{\Sigma}$ 中的 $\Sigma$，使得 $\Phi^{\mu_1}(\Lambda_1) \cup \Phi^{\mu_2}(\Lambda_2)
    \to \Phi^{\Sigma}(\Sigma)$ 且所有本体 $O_1 \in Sen^{\Lambda_1}(\Lambda_1)$ 和 $O_2 \in
