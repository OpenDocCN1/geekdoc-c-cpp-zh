  - '[PAGE 41]


    number of real MSSig for M, the size of the smallest MSSig for M, and the size
    of M.


    The cohesion of M measures how strongly the terms in M are held together, as indicated
    by the number of seed signatures for M. More precisely, the cohesion of M is defined
    to be the ratio r/s. The pulling power of M measures how many terms are needed
    in an MSSig to “pull” all terms that we find. We define the pulling power of M
    to be the ratio r/s.


    As a first draft, we define the weight of a module M to be the product of its
    cohesion and pulling power: w = r/s. We computed the weight of 3660 modules of
    Koala. The 11 heaviest modules and their differences yield a partition of the
    whole ontology into 10 parts, each which consists of terms that putatively form
    a topic (subjects included): Animal; Person and isWorking; Student; Person; Koala
    and Marsupial; TasmanianDev; Quokka; Habitat; Degree; Gender. These topics reflect
    the core parts of the ontology. Those axioms that do not occur among the heaviest
    modules tend to be that we would call less important for the ontology, in RainForest
    The first 11 modules cover almost all of Koala’s logical axioms (39 out of 42),
    and all axioms are covered by the 4th-heav module on. The first 19 heaviest modules
    are also genuine.


    The next step will be to refine this measure and apply it to more ontologies.
    We cannot expect to modularise ontologies bigger than Koala, we will need to find
    ways to extract heavy-weight modules separately.


    # 5. Discussion and outlook


    The fundamental conclusion is clear: the number of modules, even when we restrict
    our attention to genuine modules, is exponential in the size of the ontology for
    real ontologies. Our most reasonable estimates of the total number of modules
    in small to medium ontologies (i.e., over 100 axioms) show that full modularization
    is practically impossible. As we are computing based modules, which tend to be
    larger than conservative extension based modules, our results give us a lower
    bound on the number of modules.


    It is, of course, possible that there are principled ways to reduce the target
    number of modules. We could use a coarser approximation, though that would be
    hard to justify on logical grounds. Attempts to use “less minimal” modules or
    to heuristically merge modules have exhibited bad behavior, with a strong tendency
    to collapse to very few modules that comprise most of the ontology.


    We believe that observation is robust, even with the failure of our experiments
    on Tambis and miniTambis to uncover exceptional behavior. As we said in Section
    4, our expectation is that a longer timeout will reveal the problematic behavior.


    Furthermore, we observe that these ontologies have a large number of unsatisfiable
    concepts, with large justifications for them, and comparatively long axioms with
    large signatures. Each module for such a concept contains at least one justification⁶;
    modules for these ontologies tend to be large, which decreases the overall number
    of modules. Similarly, large axioms with large signatures tend to the chances
    of interaction between terms as well as increasing the signature size of modules,
    in,


    > We have strong reason to believe that a locality-based module, due to being
    depleting [19], always contains all justifications for each entailment within
    its extended signature.'
  - '[PAGE 42]


    # C. del Vescovo et al. / The Modular Structure of an Ontology: An Empirical Study
    23


    turn, for large numbers of non-minimal seed signatures. However, these facts do
    not indicate a difference in kind between Tambis and miniTambis and other ontologies
    examined, such as University, or even Koala. Koala and University have unsatisfied
    concepts. The justifications for the unsatisfiable concepts in Koala have a size
    of 5 axioms, whereas University tops out at 9, with most being below 6. miniTambis
    and Tambis''s justifications have a max size of 13 axioms, with a large percentage
    over 6. If our hypothesis about the role of justifications is correct, then it
    seems likely that the exponential break is merely delayed. Thus it is still possible,
    and we believe probable, that an exponential behavior is present but only visible
    with a sufficiently higher timeout. Furthermore, the large size of justifications
    in Tambis and miniTambis is a bit artificial as it is dependent on the unsatisfiability.
    These ontologies have large chains of “dependent” unsatisfiabilities [14] which
    increase the size of justifications along the chain. When the unsatisfiabilities
    are resolved, those concepts will no longer have those lengthy justifications
    as part of all of their modules.


    These considerations suggest that, in general, the ratio between genuine and fake
    modules can be seen as a measure of axiomatic richness, indicating how much the
    axioms in the ontology connect terms: the fewer of its modules, the more “mutually
    touching” its terms.


    Attempting at estimating the module number statistically were unhelpful too. We
    could randomly draw a small number of seed signatures, compute their modules and
    use that to estimate the number of all modules. We convinced ourselves using elementary
    stochastics that we cannot get a confident estimate by sampling only a small portion
    of all seed signatures. See [8] for details.


    While the outcome of the experiments is discouraging from the point of view of
    the complete modularization in order to analyze the ontology, it suggests several
    interesting lines of future work. First, we have already seen several features
    of ontologies that correlate with a large or small number of modules. However,
    except for the phenomenon in Merology, we do not have a verified explanation.
    Thus, for example, we need to get a precise picture of the relationship between
    justificatory and modular structure. Second, even if we cannot compute all modules,
    we may be able to compute a better approximation of their number. Given that signature
    sampling did not seem to help, to explore sources of module number increase or
    reduction, as the shape of the inferred concept hierarchy and patterns of axioms.
    Methodologically, it seems that artificial ontologies should be used, e.g., for
    confirmation of the relationship between justificatory structure and module number.
    Third, our preliminary experiments at computing heavy ontologies are promising:
    our weights seem to capture the cohesion and pulling power of a module, and the
    resulting heavy modules seem to correlate nicely with topics. We are currently
    investigating whether it is possible to compute all heavy modules without computing
    all modules, and also looking into a suitable notion of blocks of modules. The
    latter concept is closely related to fake and genuine modules, which we are also
    investigating in more detail.


