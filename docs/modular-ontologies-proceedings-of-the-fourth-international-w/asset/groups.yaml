    many unrelated terms, generally yield many modules, it would be harder to justify
    the hypothesis that real-world ontologies tend to have significantly than exponentially
    many modules if we used arbitrary, coherent subsets.


    We have therefore chosen to select each subset for a randomly generated signature—although
    we are aware that such subsets are more than necessary because ontologies are
    not normally developed modularly. But this is not a problem: it can only cause
    us to understand the number of modules.


