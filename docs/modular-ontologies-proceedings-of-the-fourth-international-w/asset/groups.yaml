    命题 3.9。对于任何关于查询基底 η 的二元框架 G = (μ₁, μ₂)，若存在共变态 L₂ → Q 且 G 在布尔算子下是闭的，则若 G 具有弱插值，则
    G 在并合下是稳健的。


    定理 3.10。如果任何关于查询基底 1FOL : FOL → FOL 的二元框架 G = (μ₁, μ₂) 在词汇扩展、并合、替换下都是稳健的。


    以下命题展示了对于关于查询基底 μ : Q → G 的任何框架 μ : Q → G，插值与在并合下的稳健性之间的相关性。


    命题 3.11。令 Q 是一个具有否定元的机构，令 μ : Q → G 是一个关于查询基底 μ : Q → G 的框架，使得 (μ,ρ) 在并合下是稳健的。那么
    Q 具有弱插值。


    推论 3.2。令 Q 是一阶逻辑任意片段的且在布尔算子下闭的机构，令 μ : Q → FOL 是一个关于查询基底 μ : Q → FOL 的框架，使得 μ
    在可能的无限本体的并合下是稳健的。那么 Q 具有弱插值。


    ## 4. 结论


    我们提出了一种本体的功能化方法，专注于作为提供查询答案的本体。使用机构（institutions）和机构共变态（institution comorphisms）允许我们以一种独立语言的方式处理异构本体。我们的框架概念捕捉了查询可能提交给不同形式编写的本体的情况，并允许我们泛化来自
    [16] 的结果稳健性。


    我们未来的工作将侧重于使用框架进一步研究描述逻辑的属性。特别是，我们希望关注签名中包含个体的描述逻辑。我们想要研究给定一个机构 I 如何生成其在签名中包含个体的对应机构
    I''，以及它们之间是什么关系（态射和共变态）。这允许我们考虑查询实例数据的问题，即向带有存储类和关系的 ABox 的本体提交查询。


