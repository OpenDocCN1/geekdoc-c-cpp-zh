    ## 1. 引言


    本体 [3] 是语义网的骨干，因为它们通过共享概念及其关系提供了对领域进行建模的形式化结构。语义网研究的一个关键方面是知识建模，这通过开发领域特定本体来实现。因此，本体作为各种活动的基础表示，例如基于网络的信息共享、检索、调解、阐述和决策支持。知识建模人员（或本体本体工程师）以多种方式开发本体——即：通过抽象领域概念和关系来开发新本体，向现有本体中添加新概念，或者对齐/合并多个本体以实现专门的本体。


    对于成熟的领域——如医学、遗传学和商业——研究人员的通用做法是利用大规模领域本体，以系统地选择一个代表当前任务的概念子集或专门的本体模块。本体模块在在定的抽象层次上，对源本体的选定元素提供集中的表示，同时提供与当前问题语境相关的操作处理和知识约束。


