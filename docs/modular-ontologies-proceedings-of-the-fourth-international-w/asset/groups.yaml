    Areas contain two disjoint classes of entities: *environmental elements* (physical
    objects) and *people*. USARE characterizes people as either survivors or victims
    (we are not considering the personnel within the site). Every person can be associated
    with body parts. Collecting information about survivor health status is considered
    in our ontology. In particular, to help doctors and rescue personnel, it is possible
    to state whether a survivor is injured and whether she can move, since this determines
    the rescue method to adopt. While the robot is close to the person, it can also
    monitor her body temperature.


    Concerning the environmental elements, USARE splits them into gases, liquids,
    or solids. This keeps the ontology general, in order to import important ontologies
    about objects. Solids are further decomposed into structural elements or obstacles.
    This difference is relevant, since obstacles contribute to increase clustering.
    However, concerning the robot mobility, even protruding structural elements can
    be a problem. Environmental elements themselves are characterized by some attributes
    (e.g. stability, integrity, radioactivity, and so on). These attributes help operators
    to understand critical situations. As an example, the detection of unstable objects
    prevents the risk to let human rescuers go inside a dangerous area, and forecasts
    a probable collapse. Finally, it is worth mentioning that detecting specific objects
    is relevant, as they are considered new landmarks for robot localization and navigation,
    or to give hints to human rescuers inside the environment.


    ## 4. Adopting ontology best practices in USAEnv


    USAREnv implementation is characterized by three design choices:


    - 1. adopting standard representation formalisms;

    - 2. reusing existing ontologies and, in particular, general purpose ontologies,
    to foster modularity;

    - 3. promoting an agile implementation through ontology design patterns.


    ### 4.1. Adopted formalism


    As already stated, the goal of USAEnv is to support rescue missions with semantic
    knowledge, which can be exploited by operators to improve their situation assessment,
    by robots to enhance their autonomous skills, as well as by hardware devices (e.g.
    RFIDs, PCs, and so on). One of our goals is to provide a standard representation,
    which fosters sharing and reuse among so different agents. For this reason, we
    have chosen OWL for USAEnv ontology representation.


    USAREnv uses the DL_ALCHO(D) and belongs to OWL2 DL family. The drawback of such
    an expressive ontology is that OWL2 DL complexity is NEXPTIMEwith respect to taxonomy
    and data complexity. However, robotic ontologies have small datasets compared
    to other ontologies, hence in most of the cases this complexity is affordable.


    USAREnv has been implemented through well known and available tools, such as Protege.


    ### 4.2. Modularity


    With the aim of lowering the development effort and reusing existing ontologies,
    our approach is to exploit modularity. The benefits are manifold: every component
    can be assigned to a different person, enhancing a collaborative design. To support
    collaborative ontology modeling, Protégé has released Collaborative Protege, as
    well as its web-based interface WebProtége. Another advantage is that each module
    of the ontology covers a specific problem domain, solvable via ontology design
    patterns, or importing existing ontologies. Finally, the implementation of a component
    realizes a standalone ontology fragment design pattern and can be published and
    reused.


