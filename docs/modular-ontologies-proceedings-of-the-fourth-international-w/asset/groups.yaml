    # G. Randelli and D. Nardi / Introducing Ontology Best Practices and Design Patterns
    into Robotics


    properties provide binary links to each argument of the relation. Applying the
    pattern to our case, the relation isAdjacent becomes the class isAdjacentRelation,
    while the four individuals belong to three classes and one datatype, and are related
    to isAdjacentRelation by four functional properties (see Figure 4).


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_97_0.png)


    Applying observation CP. As opposed to logical patterns, CPs are language independent
    (since they do not affect any language constraint), but content dependent. A consequence,
    CPs are standalone ontology fragments, defined by Gangemi and available on the
    OntologyDesignPatterns.org project, deals with the following competency questions:


    +   * What objects have been observed?

    * What are the parameters under which this object was observed?

    * When an object has been observed an object?


    USAREnv has a fundamental observation activity: victim detection. Our competency
    questions are the following:


    +   * What survivors have been detected?

    * What parts of a specific survivor have been detected?

    * When a given person/body part has been detected?


    In our case, the pattern domain has a broader matching than the problem domain,
    as the observation CP competency questions are more generic. Hence, applying this
    CP implies to import and specialize it, as described by Gangemi [11]. The observation
    class is specialized in VictimDetection, while HumanBody specializes Parameter.
    The involved classes are given in Figure 5.


    > http://www.ontologydesignpatterns.org/cp/owl/observation.owl'
