    # # The modular structure of an ontology: an empirical study¹


    Chiara DEL VESCOVO, Bijan PARSIA, Uli SATTLER and Thomas SCHNEIDER

    School of Computer Science, University of Manchester. UK

    {delvescc, bparsia, sattler, we}@cs.man.ac.uk


    Abstract Efficient extracting a module from a given ontology that captures the
    ontology’s knowledge about a set of specified terms is a well-understood task.
    This task can be based, for instance, on locality-based modules.

    in contrast, extracting modules of an ontology is computationally difficult because
    there can be exponentially many. However, it is reasonable to assume that by revealing
    the modular structure of an ontology, we can obtain information about its topology,
    connectedness, structure, superfluous parts, or agreement between actual and intended
    modeling. Furthermore, incremental reasoning makes use of a number of, although
    not all, possible, modules of an ontology.

    We report on experiments to estimate the number of modules of real-life ontologies.
    We also evaluate the modular structure of ontologies that we succeeded to fully
    modularize. In evaluation, we look at the number and sizes of the modules, as
    well as the relation between module size and number of signatures that lead to
    the module. Chances are that the understanding we report about small ontologies
    can be applied to all ontologies.


    **Keywords.** Ontologies, description logics, module extraction, syntactic locality,
    ontology comprehension


    # ## 1. Introduction


    **Why modularize an ontology?** In software engineering, modularly structured
    systems are desirable, all other things being equal. Given a well-designed modular
    program, it is generally easier to process, modify, and analyze it and to reuse
    parts by exploiting the modular structure. As a result, support for modules (or
    components), classes, objects, packages, aspects) is a commonplace feature in
    programming languages.


    Ontologies are conceptual artifacts akin to programs, and in notable examples,
    can get large as complex as complex, which suggests that exploiting modularity
    might be fruitful, and research into modularity for ontologies has been an active
    area for ontology engineering. Recently, a lot of effort has gone into developing
    logically sensible modules, which offer strong logical guarantees for intuitive
    modular properties. One such guarantee is guaranteed coverage and means that the
    module captures all the ontology’s knowledge about a given set of (signatures)—a
    kind of dependency


