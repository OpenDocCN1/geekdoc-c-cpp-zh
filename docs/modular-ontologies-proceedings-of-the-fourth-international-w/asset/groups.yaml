    Definition 4 A module $M$ is called fake if there exist modules $M_1, \dots, M_n$
    such that $M = M_1 \cup \dots \cup M_n$ and the set $\{M_1, \dots, M_n\}$ is $M$-almost
    pairwise disjoint. Otherwise $M$ is called genuine.


    In particular, if a module is fake, then it consists of disjoint modules whose
    signatures are almost pairwise disjoint. For example, in Koala, we have a fake
    module about habitat that consists of a rainforest and a dryforest submodule,
    which only overlap in the term habitat and do not share any other terms and no
    axioms. Fake modules are uninteresting because being fake means that different
    signatures of the $M$ do not interact with each other. Given that often the overall
    number of modules appears to grow exponentially with the size of the subontology,
    a natural question arises is whether this is caused by the fact that there are
    exponentially many fake modules.


    # 3. Description of the experiments


    **Ontologies.** We performed the experiments on several existing ontologies that
    we consider to be well designed and sufficiently diverse. “Well designed” means
    that these ontologies cover a specific domain to a certain level of detail; they
    are axiomatically rich, for example, they do not connect via atomic subsumptions,
    which would make module extraction rather uninteresting because the terms in the
    signature of a module would hardly cause other terms to be included in the module.
    We concentrate on well-designed ontologies because we want to understand their
    structure. “Axiom” means that these ontologies have different sizes, expressivities,
    ratios of axiom and numbers, and cover different domains.


    We also selected some ontologies which have had successful and insightful full
    modularization by other techniques (in particular, Koala and OWL-S). Unfortunately,
    we had to restrict our attention to small ontologies for practical reasons. However,
    the selection constitutes a set of ontologies which are commonly discussed in
    ontology engineering circles and for which people have strong instincts about
    their modular structure.


    Figure 1 gives an overview; most of these ontologies can be found in the TONES
    repository.


    **Full modularization.** Let $O$ be the ontology to be modularized. Our goal is
    to find all modules of $O$, i.e., to compute $(\sigma\text{-mod}(\Sigma) \mid
    \Sigma \in O)$. In order to keep track of the seeds signatures, we seek an algorithm
    which given $O$ as input, returns a representation of all pairs $(\Sigma, M)$
    where $\Sigma \subseteq O$ and $M = \sigma\text{-mod}(\Sigma)$.


    The most naive approach is to traverse through all seeds $\Sigma$, extract the
    corresponding module and add it to the unity. Since there are exponentially many
    seeds signatures—this is not feasible—for Koala, 2 runs of the easiest test is
    unrealistic. Fortunately we have good reasons to believe that there are significantly
    fewer modules than seed signatures in realistic ontologies: Proposition 3 says
    that, the locality-based module $M = \sigma\text{-mod}(\Sigma)$, every seed $\Sigma''$
    extends $\Sigma$ and is a subset of $\Sigma \cup M$ yields the same module, $M$.
    Second, if even two signatures $\Sigma$ and $\Sigma''$ are not in relationship,
    the properties of modules for $\Sigma$ and $\Sigma''$ can still coincide.


