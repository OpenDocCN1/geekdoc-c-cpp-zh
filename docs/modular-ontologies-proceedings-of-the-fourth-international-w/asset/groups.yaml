    Now we study correlations of different types of. The following proposition shows
    that weak interpolation in G implies robustness under vocabulary extension.


    Proposition 3.6. Let G = (μ₁, μ₂) be a binary framework over query basis η : Q
    → G, with η conservative and such that for every signature Σ in Sig, is surjective.
    Moreover, let there be a comorphism ρ : L₂ → Q such that μ₂ = ρ; then G is robust
    under vocabulary extension.


    The following can be understood as a partial converse of Proposition 3.6.


    Proposition 3.7. If 1G : G → G over query basis 1G is robust under vocabulary
    extension, then G has weak interpolation.


    Further results require institutions that have Boolean operators:


    Definition 3.8. An institution I is closed under Boolean operators if for every
    ϕ, ψ ∈ Sen(Σ) there are Σ sentences ¬ϕ and ∧ ψ such that for every Σ-model M,
    the following:


    ```

    M ⊨ ϕ M ⊨ ψ iff M ⊨ ϕ ∧ ψ

    M ⊨ ¬ϕ M ⊨ ¬ψ iff M ⊨ ¬ϕ.

    ```


    The following proposition shows a correlation between robustness under joints
    of G and interpolation.


    Proposition 3.9. For any binary framework G = (μ₁, μ₂) over query basis η, s.t.
    there is a comorphism L₂ → Q and G is closed under Boolean operators, if G has
    weak interpolation, then G is robust under joins.


    Theorem 3.10. If any binary framework G = (μ₁, μ₂) over query basis 1FOL : FOL
    → FOL is robust under vocabulary extensions, joins, replacement.


    The following proposition shows a correlation between interpolation and robustness
    under joins for any framework μ : Q → G over query basis μ : Q → G.


    Proposition 3.11. Let Q be an institution with negation, and let μ : Q → G be
    a framework over query basis μ : Q → G, such that (μ,ρ) is robust under joins.
    Then Q has weak interpolation.


    Corollary 3.2. Let Q be an institution of any fragment of first-order logic closed
    under Boolean operators, let μ : Q → FOL be a framework over query basis μ : Q
    → FOL, such that μ is robust under joins for possibly infinite ontologies. Then
    Q has weak interpolation.


    ## 4. Conclusions


    We have proposed a functional approach to ontologies that focusses on ontologies
    as providing answers to queries. Using institutions and institution comorphisms
    allows us to address heterogeneous ontologies in a language-independent way. Our
    notion of framework captures the situation where queries may be posed to ontologies
    written in different formalisms, and also allows us to generalise the robustness
    of results from [16].


    Our future work will focus on using frameworks for further investigation of properties
    of description logics. In particular we would like to turn our attention to description
    logics with individuals in their signatures. We want to investigate how given
    an institution I can generate its counterpart I'' with individuals in its signature
    and what are the relations between them (morphisms and comorphisms). This allows
    us to consider the problem of querying the instance data, i.e., posting queries
    to ontology with an ABox that stores classes and relations.


