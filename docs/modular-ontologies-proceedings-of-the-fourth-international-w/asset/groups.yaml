    relations are the standard notions of satisfaction in $\mathcal{EL}$ and FOL.
    It is straightforward to see that the satisfaction condition holds for both these
    institutions.


    The satisfaction relation may be extended to a relation of consequence. If $E$
    is a set of $\Sigma$-sentences and $e$ is a $\Sigma$-sentence, we write $E \models_{\Sigma}
    e$ to mean that every $\Sigma$-model satisfies every sentence in $E$ satisfies
    $e$. In $\mathcal{EL}$, such a set of sentences is called a Tbox, and we shall
    refer to such a set as an ontology.


    An institution is *inclusive* if the category of signatures has ''inclusion morphisms'',
    with unions and intersections, and these inclusions are preserved when extended
    to sentences. To present this formally we first have to define the notion of *inclusive*
    category.


    **Definition 1.2** (Inclusive category). An inclusive category $\mathcal{C}$ is
    a category with a broad subcategory inclusive of inclusions, having finite intersections
    and unions, that for every pair of objects $A, B$, the union in $I$ is a pushout
    in $\mathcal{C}$ of their intersection in $I$. A functor between two inclusive
    categories is an *inclusive functor* (or preserves inclusions) iff it takes inclusions
    in the source category to inclusions in the target category.


    **Definition 1.3**. An *inclusive institution* is an institution with its category
    of signatures and its Sen functor, in other words the category of signatures is
    equipped with an inclusion system such that $\Sigma \hookrightarrow \Sigma''$
    implies $Sen(\Sigma) \subseteq Sen(\Sigma'')$.


    Because of this requirement, we will usually omit inclusions. For example, if
    $\iota : \Sigma \hookrightarrow \Sigma''$, we will simply write $E$ instead of
    $Sen(\iota)(E)$, when $E$ is to be considered a set of $\Sigma''$-sentences.


    For an illustration of inclusive institutions, we may refer to $\mathcal{EL}$
    and FOL, where the inclusions, unions, etc., are doneewise; for example, an inclusion
    $(P, R) \hookrightarrow (P'', R'')$ of a set of per inclusions $P \hookrightarrow
    P''$ and $R \hookrightarrow R''$, and $(P_1, R_1) \cup (P_2, R_2) = \dots$ (omitted
    due to image cut).


