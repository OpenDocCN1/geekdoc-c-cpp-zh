    # Introducing ontology best practices and design patterns into robotics: USAREEnv


    Gabriele RANDELLI ᵃ,¹ and Daniele NARDI ᵃᵇ


    ᵃ Department of Computer and System Sciences

    Sapienza University of Rome

    Ariosto 25, 00185 Rome, Italy


    **Abstract.** Systems with knowledge representation and reasoning functionality
    are common within the robotics community. Nevertheless, most of the proposed architectures
    are ad-hoc implementations, with lack of modularity, standardization and data
    that cannot be reused or shared among different users. We feel that the Semantic
    Web effort over the past years in promoting standard representations and ontology
    practices should be adopted by the robotic community, to foster the design of
    more effective and reusable systems, adapted for non-expert users in everyday
    life. In this paper, we investigate how to integrate ontology best practices and
    standard representations into the robotic system design, modelling an ontology
    for a real application field: urban search and rescue robots. We also discuss
    the benefits of this methodology for robotic systems, as well as presenting some
    effective design guidelines.


    *Keywords.* ontologies, search and rescue robots, unstructured environments, ontology
    design patterns


    # Introduction


    In the robotics community, some systems start to adopt some of high-level knowledge
    to accomplish their tasks. In fact, most of the robotic deliberative architectures
    plan the actions according to some goals and a given outcome, which requires the
    capability to represent their knowledge and to reason on it. Nevertheless, knowledge
    representation and reasoning modules are very often realized as specialized components,
    without symbolic representation or without any effective design methodology. As
    a consequence of this approach only robotic experts can control them, and it is
    very difficult to understand their functionality and use them.


    On the other hand, the Semantic Web community has promulgated some well-known
    standards in knowledge representation formalisms, inference mechanisms and query
    languages, as the Web Ontology Language (OWL). Even more, many software engineering
    methodologies have been applied to ontology representations, in order to produce
    effective and high-quality ontology models.


    > ¹Corresponding Author: Gabriele Randelli, Department of Computer and System
    Sciences. Via Ariosto 25, 00185 Rome, Italy; Email: randelli@di.unroma.it.*


    Our contribution attempts to revamp the robotic community with standards and best
    practices established in the Semantic Web community, for several reasons. First
    of all, standard languages allow semantic knowledge sharing among different entities:
    humans, robots, and hardware devices, for example in smart environments or symbiotic
    systems. Best practices foster ontology reuse and sharing in the robotic community,
    and allow for an agile modelling process. Finally, symbolic representations are
    more comfortable for humans, improving their situation awareness when controlling
    robots, and adding further information with respect to raw numerical representations.


    We validate the use of ontology patterns presenting a modular ontology for unstructured
    environments for urban search and rescue activities: USAEnv. Urban search and
    rescue (USAR) involves the location, extrication, and medical stabilization of
    victims trapped in confined spaces. It consists of deploying a team of robots
    to explore an unknown disaster environment, meanwhile looking for survivors. Among
    all the possible tasks, it is one of the most demanding, for robots and humans,
    because the environment is unstructured, raising two major challenges: robot mobility
    and situation awareness.


    The remainder of this paper is structured as follows. In Section 1, we present
    the state of the art of ontology representations adopted in robotics and rescue,
    as well as introducing standard representations and ontology design patterns,
    while in Section 2 we characterize our application field: USAR indoor environments
    and search and rescue (SAR) activities. In Section 3 we describe USAEnv ontology
    model, while in Section 4 we describe how best practices can be adopted in robotics,
    applying them to USAEnv. Finally, in Section 5 we provide some remarks and future
    work about USAEnv and the use of best practices in the robotic community.


    # Related work


    **Semantic knowledge in robotics.** Many robotic systems exploit some of semantic
    knowledge, but it is often hard-coded in their implementation. This greatly reduces
    the possibility to reuse this knowledge and to exploit any inference mechanism.
    In fact, according to Hertzberg and Saffotti [12], semantic knowledge in robotics
    is characterized by the need for an explicit representation and the need for grounding
    the symbols used in this representation in the real world. However, still few
    approaches adopt a symbolic declarative language. Modayil and Kuipers [16] propose
    an unsupervised learning method based on allocentric occupancy grids to build
    and indent an ontology, but without an explicit symbolic representation. On the
    other hand, Louti et al. [14] validate how a knowledge representation and reasoning
    system (KRR) can improve anchoring and human-robot interaction tasks. Moreover,
    they adopt a general purpose upper level ontology. DOLCE (A Descriptive Ontology
    for Linguistic and Cognitive Engineering).


    Semantic information enhances both autonomous systems and human-robot activities.
    The first aspect has been analyzed by Calisi et al. [6], through the definition
    of a robotic context-based architecture that improves the robot performance in
    typical tasks: navigation, mapping and exploration. On the other hand, semantic
    knowledge improves human-robot interaction, in particular in fields where the
    presence of humans is fundamental, because symbolic representations are more manageable
    with respect to numerical ones, and lower the cognitive fatigue of users whilst
    performing a task. However, few works are based on standard representation formalisms.
    Considering this latter aspect, the complexity of Semantic Web has developed standard
    languages for ontology, such as RDFS (Description Format Schema) [5], or the Ontology
    Language (OWL) [13]. Web standards can improve knowledge sharing and cooperation
    between robots and humans, an essential aspect to deploy robots in heterogeneous
    and symbiotic systems.


    **Ontologies for urban search and rescue.** Urban search and rescue (USAR) activities
    are characterized by an intrinsic hardness, hence the presence of humans is fundamental,
    it is still unrealistic to deploy fully robots in hazardous environments. Ontology
    representations can help classify these environments, increasing the efficiency
    of robotic tasks related to search and rescue. Typically, ontology modelling is
    a collaborative and standardization process that involves several experts from
    different communities: research, industry, and so on. The National Institute of
    Standards and Technology³ fosters the standardization of industrial technologies,
    and has a leading role in the promotion of rescue ontologies. Schlenoff and Messina
    define a sketch of ontology concerning robots and their capabilities [20]. However,
    their work does not address environments, which is a complementary aspect. Matsuno
    identify the main characteristics about robots and rescue scenarios [7], through
    the analysis of USAR activities. Their aim is to support human decision in deploying
    robots and selecting equipment for a specific disaster scenario. Nevertheless,
    their work consists of a set of guidelines, rather than a real implementation.


    **Ontology design patterns.** The use of standard formalisms is a first step towards
    efficient knowledge sharing and reuse. From the software development point of
    view, an ontology is an artifact that addresses some competency questions to accomplish
    a goal. In order to enhance their modelling and engineering, ontologies can benefit
    from well known software engineering techniques, for example the application of
    ontology design patterns (ODP). Svátek [21] introduces ontology design patterns,
    comparing them with software design patterns (SDP), Blomqvist and Sandkuhl propose
    their classification into five areas: application, architecture, design, semantic,
    and syntactic patterns [3]. Ontology design patterns solve common modeling problems,
    which appear in different domains. On one hand, they can be considered as best
    practices, on the other hand, they provide solutions to overcome specific language
    constraints (e.g. OWL does not support n-ary relations). In both cases, they are
    logical patterns and context-independent. Angaruren et al. [1] introduce logical
    ODPs (LOP), defining the basic steps for their creation, application and documentation.
    They also realized an Ontology Design Pattern Public Catalog⁴ where some ODPs
    are available. Some ODPs are content-dependent and resolve specific domain problems,
    hence they are known as content ontology design patterns.


    > ³http://www.nist.gov

    ⁴http://www.gong.manchester.ac.uk/odp/html/index.html

