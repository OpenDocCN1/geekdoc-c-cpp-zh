    JIE BAO is a research associate at the Tetherless World Constellation, Rensselaer
    Polytechnic Institute. He has authored more than 40 papers in journals and peer-reviewed
    conferences and workshops. He has served on Organizing Committees or Programming
    Committees of more than 20 international conferences and workshops, including
    ISWC, IJCAI, ASWC and AAAI Symposium. He is a member of the OWL Working Group
    at W3C. His current interests include semantic wikis, modular ontologies, description
    logics, privacy policy and web-scale computing.


    http://www.cs.rpi.edu/~baojie

    baojie@cs.rpi.edu


    SIMON COLTON is a Senior Lecturer in the Department of Computing at Imperial London.
    He is an AI researcher who leads the Computational Creativity group http://www.doc.ic.ac.uk/~ccg,
    where the focus of study is on building software takes care of responsibility
    in arts and science projects, with applications to graphic design, discovery in
    pure mathematics, video game design and the visual arts.


    http://www.doc.ic.ac.uk/~sgc

    sgc@doc.ic.ac.uk


    GÖKHAN COSKUN is a Research Assistant in the Corporate Semantic Web working group
