    # 6. Conclusion


    Extracting ontology modules from source ontologies is viable for supporting specialized
    utilization and scope re-reconciliation of ontologies. We presented our approach
    for ontology module extraction, where the concepts (and roles) are pertinent for
    a target ontology are extracted, and then can be reused or reconciled with other
    extracted concepts and relationships. We demonstrated the application of our approach
    in healthcare domain, where (i) contextualized ontology modules are extracted
    from three different prostate cancer pathways based on the given-context therapeutic-decision-support,
    and (ii) a networked ontology module is generated by merging contextualized ontology
    modules under domain-specific and context-specific axioms. Future work includes
    (a) detecting and resolving inconsistencies in the networked ontology, (b) consistent
    matching of contextualized ontology modules based on given domain-specific and
    context-specific axioms, and (c) validation and verification of the networked
    ontology. Some of our initial efforts were reported in [7].


