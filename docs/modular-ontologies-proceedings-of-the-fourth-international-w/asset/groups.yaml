    the application domain. The domain-specific events are modeled as domain classes
    of the domain ontology and have relationships with other classes of other domain
    ontologies. They can have object or data type properties. For example to describe
    the above example about the stock price change, an event class for this event
    can be named "stockpriceChange". Each instance of this class is identified by
    a URI and is related with a rdf:type predicate to this class.


    # CEP Upper-Level Ontology Modules


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_106_0.png)


    Figure 1. Modular Top Level Ontologies


    The reasons for modular top ontologies for CEP are the same general reasons for
    ontology and database modularization like, scalability, complexity management,
    understandability, context-awareness, personalization and reuse [32]. By means
    of modular ontologies, the event processing system can achieve better scalability
    for data querying, reasoning on ontologies, evolution and maintenance. Different
    ontology languages with different levels of expressiveness and limitations might
    be proposed for the description of CEP ontologies. A trade-off between the reasoning
    expressiveness and the cost of the reasoning, specially performance and real time
    processing of events can be observed.'
