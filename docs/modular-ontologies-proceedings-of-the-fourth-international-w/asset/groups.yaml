    ## 2. $\Sigma$-entailment and Inseparability in Frameworks


    In this part we focus on the fundamental notions of logic-based modularity; $\Sigma$-entailment,
    $\Sigma$-entailability in query language, and $\Sigma$-conservative extension.
    This section details the results presented by Konev et al. in [16]. Our goal is
    to present these notions in an institutional setting, and thus independently of
    particular ontology or query languages. To achieve this we introduce the notion
    of a framework, which allows us to study entailment even if an ontology differs
    from a query language.


    **Definition 2.1.** A query basis is an inclusive morphism $\eta : \mathcal{Q}
    \to \mathcal{G}$.


    A framework over a query basis $\eta : \mathcal{Q} \to \mathcal{G}$ is an inclusive
    morphism $\mu : \mathcal{L} \to \mathcal{G}$. We call $\mathcal{L}$ the ontology,
    $\mathcal{G}$ the global language, and $\mathcal{Q}$ the query language of the
    framework.


    Given a framework $\mu : \mathcal{L} \to \mathcal{G}$ over a query basis $\eta$,
    and $\Lambda$ a $Sig^\mu$-signature, we have that $O \subseteq Sen^\mu(\Lambda)$
    is a $\Lambda$-ontology.


    The intuition behind this construct is that given an ontology and query represented
    in two institutions, $\mathcal{L}$ and $\mathcal{Q}$ respectively, we choose a
    global institution $\mathcal{G}$ s.t. there are comorphisms $\mathcal{L} \to \mathcal{G}$
    and $\mathcal{Q} \to \mathcal{G}$. Using these comorphisms we can translate the
    ontology and the query into $\mathcal{G}$, then we can check whether the query
    is a consequence of the ontology.


    We allow more than one framework over a query basis. Figure 1 is a graphical representation
    of frameworks $\mu_1$ and $\mu_2$ over query basis $\eta$.


    ![](img/a1ab54b0915908cfe20ac887a02d94e_78.png)


    Figure 1. Frameworks $\mu_1$ over query basis This situation might arise, for
    example, if we wanted to merge two ontologies written in different languages.
    Framework allows us to address the issue of entailment, or *consequence*, between
    ontologies and queries that are written in different languages.


    **Definition 2.2.** Let $\mu:\mathcal{L} \to \mathcal{G}$ be a framework over
    $\eta$, and $O$ be a $\Lambda$-ontology for $\mu$ and $\varphi \in Sen^\Lambda(\Sigma)$
    be a query, with $\Sigma$ in $Sig^\Lambda$. We say that $\varphi$ is a *consequence*
    of $O$ wrt $\eta$ (written $O \vdash_\eta^\Lambda \varphi$) iff


    $$\alpha_\mu^\Lambda(O) = \Phi_{\mu(\Lambda \cup \Sigma)}(\Sigma) \alpha_\eta^\Lambda(\varphi).$$


    This says that in a framework $\mu$ a query $\varphi$ is a consequence of an ontology
    $O$ iff $O$ translated along $\mu$ into $\mathcal{G}$, in $\mathcal{G}$, with
    respect to union of signatures $\Lambda$ and $\Sigma$, a translation of $\varphi$
    along $\eta$. A very similar notion was introduced by Scholemmer and Kalogi [26]
    as the notion of ontology-based consequence with the difference that they fix
    the global institution to FOL.


    For any institution $G$, the identity $id_G:\mathcal{G} \to \mathcal{G}$ is a
    query basis, and also provides a framework over itself, which is just the institution
    $G$, and the notion of consequence in a framework generalizes entailment in a
    fixed institution.


    **Proposition 2.3.** For any framework $l_G:\mathcal{G} \to \mathcal{G}$ over
    query basis $l_G:\mathcal{G} \to \mathcal{G}$, consequence in the framework is
    just consequence in $G$; i.e. $O \vdash_\Sigma^\Lambda \varphi$ iff $\varphi$
    for any $\Lambda$-ontology $O$ and $\Sigma$-sentence.


    **Proposition 2.4.** For any framework $\mu:\mathcal{L} \to \mathcal{G}$ over
    query basis $\mu$ itself, then for any $\Lambda$-ontology $O$ for $\mu$, and $\varphi
    \in Sen^\Lambda(\Lambda'')$ we have


    $O \vdash_{\Lambda \cup \Lambda''}^\Lambda \varphi$ implies $O \vdash_{\Lambda''}^\Lambda
    \varphi$.


    Moreover, if $\beta^\mu$ is surjective on models, then the converse implication
    also holds.


    Because $\mathcal{EL}$ and FOL-models are essentially the same (see Section 1),
    we have


    **Corollary 2.5.** *As comorphism $ef : \mathcal{EL} \to FOL$ has surjective $\beta^{ef}$,
    we have that for every $\mathcal{EL}$-signatures $\Lambda, \Lambda''$ and any
    $\Lambda''$-ontology $O$ for $ef$, and $\varphi \in Sen^{\mathcal{EL}}(\Lambda'')$:*


    $$O_{\Lambda''}^{\mathcal{EL}} \quad \text{iff} \quad O_{\Lambda''}^{\Lambda''}
    \varphi.$$


    Moving to a richer global language preserves consequences:


    **Lemma 2.6.** *For framework $\mu$ over query language $\eta : Q \to \mathcal{G}$,
    if we have a comorphism $\lambda : \mathcal{G} \to \mathcal{G}''$, there is a
    framework $\mu'' = \mu$ over query language $\eta'' = \eta; \lambda$, and we have:*


    $$O_{\mu}^{\eta} \varphi \quad \text{implies} \quad O_{\mu}^{\eta''} \varphi.$$


    for any $\Lambda$-ontology for $\mu$ and any query $\varphi \in Sen^\mu(\Sigma)$,
    with $\Sigma \in Sig^\mu$. Moreover, if $\beta^\lambda$ is surjective, then the
    converse implication also holds.


    The notion of $\Sigma$-entailment is basic to studies of description logics in
    the literature for [16–18, 23, 24]. Closely related notions are *inseparability*
    and *conservative extension*. We present these notions in the framework setting.


    Very often we are interested in comparing ontologies within different languages
    (frameworks) over a given query base. That is, we have two frameworks $\mu_1 :
    \mathcal{L}_1 \to \mathcal{G}$ and $\mu_2 : \mathcal{L}_2 \to \mathcal{G}$; which
    we shall refer to as a binary framework $(\mu_1, \mu_2)$.


    **Definition 2.7** ($\Sigma$-entailment and inseparability). For query base $\eta$
    and frameworks $\mu_1, \mu_2$ over $\eta$, $\Lambda_1$-ontology $O_1$ and $\Lambda_2$-ontology
    $O_2$ for $\mu_2$, we say that


    - $O_1$ $\Sigma$-entails $\varphi \in Sen^{\mu_1}(\Sigma)$ if $O_2^{\eta} \varphi
    \quad \text{implies} \quad O_1^{\eta} \varphi$.


    - $O_1$ and $O_2$ are $\Sigma$-separable wrt $\eta$, if $O_1 \approx^\eta O_2$,
    iff $O_1 \subseteq^\Sigma O_2 \quad \text{and} \quad O_2 \subseteq^\Sigma O_1$.


    - $O_2$ is a $\Sigma$-conservative extension of $O_1$ wrt $\eta$ iff $O_2 \subseteq
    \alpha_{\Lambda_1}^\eta(O_1) \supseteq \alpha_{\Lambda_1}^\eta(O_1)$ and $O_2$
    are $\Sigma$-inseparable wrt $\eta$.


    - $O_2$ is a conservative extension of $O_1$ wrt $\eta$ iff $O_2$ is a $\Sigma$-conservative
    extension of $O_1$ wrt $\eta$ for all $\Sigma \in |Sig|$ such that $\varphi^\eta(\Sigma)
    \subseteq \varphi^{\mu_1}(\Lambda_1)$.


    The terminology ''$\Sigma$-inseparability'' is taken from [16], and says that
    two ontologies are *equivalent* in the sense that they entail exactly the same
    consequences of the signature $\Sigma$. Indeed, for any query $\eta$ and signature
    $\Sigma$ in $Q$, the relation $\approx_\Sigma^\eta$ wrt $\eta$ is an equivalence
    relation.


    In the situation of the previous Definition, we say that $\varphi$ separates $O_1$
    and $O_2$ iff $O_1 \approx^\eta \varphi$ or $O_2 \approx^\eta \varphi$ or vice
    versa.


    If an ontology can be translated directly into the query language, then entailment
    can be reduced to showing that each sentence in one ontology is a consequence
