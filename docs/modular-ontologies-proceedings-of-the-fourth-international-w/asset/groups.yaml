    performing a task. However, few works are based on standard representation formalisms.
    Considering this latter aspect, the complexity of Semantic Web has developed standard
    languages for ontology, such as RDFS (Description Format Schema) [5], or the Ontology
    Language (OWL) [13]. Web standards can improve knowledge sharing and cooperation
    between robots and humans, an essential aspect to deploy robots in heterogeneous
    and symbiotic systems.


    Ontologies for urban search and rescue scenarios. Urban search and rescue (USAR)
    activities are characterized by an intrinsic hardness, hence the presence of humans
    is fundamental, it is still unrealistic to deploy fully autonomous robots in hazardous
    environments. Ontology representations can help classify these environments, improving
    the decision process to deploy robots, and can increase the efficiency of robotic
    tasks related to search and rescue. Typically, ontology modelling is a collaborative
    and standardization process that involves several experts from different communities:
    research, industry, and so on. The National Institute of Standards and Technology³
    fosters the standardization of industrial technologies, and has a leading role
    in the promotion of rescue ontologies. Schlenoff and Messina define a sketch of
    ontology concerning robots and their capabilities [20]. However, their work does
    not address environments, which is a complementary aspect, with capabilities..
    and Matsuno identify the main characteristics about robots and rescue scenarios
    [7], through the analysis of USAR activities. Their aim is to support human decision
    in deploying robots and selecting equipment for a specific disaster scenario.
    Nevertheless, their work consists of a set of guidelines, rather than a real implementation.
    In particular, to our knowledge, no ontology has been yet realized for rescue
    environments.


    Ontology design patterns. The use of standard formalisms is a first step towards
    efficient knowledge sharing and reuse. From the software development point of
    view, an ontology is an artifact that addresses some competency questions to accomplish
    a goal. In order to enhance their modelling and engineering, and ontologies can
    benefit from well known software engineering techniques, for example the application
    of ontology design patterns (ODP). Svátek [21] introduces ontology design patterns,
    comparing them with software design patterns (SDP), Blomqvist and Sandkuhl propose
    their classification into five areas: application, architecture, design, semantic,
    and syntactic patterns [3]. Ontology design patterns solve common modeling problems,
    which appear in different domains. On one hand, they can be considered as best
    practices, on the other hand, they provide solutions to overcome specific language
    constraints (e.g. OWL does not support n-ary relations). In both cases, they are
    logical patterns and context-independent. Angaruren et al. [1] introduce logical
    ODPs (LOP), defining the basic steps for their creation, application and documentation.
    They also realized an Ontology Design Pattern Public Catalog⁴ where some ODPs
    are available. Some ODPs are content-dependent and resolve specific domain problems,
    hence they are known as content ontology design patterns


