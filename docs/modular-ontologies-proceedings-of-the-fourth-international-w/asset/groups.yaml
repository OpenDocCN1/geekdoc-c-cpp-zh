  - '[PAGE 95]


    # 76 Randell and D. Nardi / Introducing Ontology Best Practices and Design Patterns
    into Robotics


    A preliminary version of USAREnv has been designed as a monolithic ontology, but
    it has been subsequently divided into four modules. The extraction process is
    based on the module extraction algorithm proposed by Doran et al. [9]. USAREnv
    modules are the following:


    +   - sites.owl, which describes rescue sites, their overall conditions (e.g.
    weather, location, and so on), and divides them into areas, with specific area
    conditions, which can be further extended;

    - landmarks.owl, that is a collection of objects, as well as their attributes,
    that are relevant to identify during rescue missions, in order to improve robot
    localization, to detect dangerous conditions, to acquire a semantic map of the
    environment, to provide natural feedback to operators;

    - people.owl contains a human body description in terms of body parts that can
    be detected by robots through computer vision and machine learning techniques;

    - spatial.owl, which includes spatial relations between adjacent areas, as well
    as accessibility from one area to another.


    USAREnv imports DOLCE+Dns OWL (DUL)², which is the combination and simplification
    of DOLCE Lite-Purpose Libraries and Descriptions (DnS) on ontology. We decided
    to import the whole ontology, instead of copying and pasting only the relevant
    fragments, because it is lightweight and sufficiently scalable, and we consider
    this as a trade-off with the impossibility in OWL to partially import ontologies.
    Even more, DUL has almost the same expressivity of DOLCE+Dns.


    We designed USAREnv itself as a module of a higher-level robotic ontology. In
    fact, it only deals with unstructured environments, from a strictly robotic and
    rescue perspective. However, it could be easily considered a module and integrated
    in different composite ontologies. For example, as already stated in Section 2,
    the robot deployment requires the matching of the available robotic platforms
    with the environment conditions. Here, USAREnv should be coupled with a robotic
    ontology describing robot structures and equipment. Furthermore, it could be integrated
    with ontologies for structured environments, to provide a comprehensive environment
    ontology for robots.


    # 4.3. The role of ontology design patterns


    USAREnv solves modelling issues through ontology design patterns:


    +   - people and their body parts (PartOf of content ODP);

    - areas, adjacent areas, adjacency sites, and area accessibility (N-ary relations
    logical ODP);

    - survivor detection, detected body parts, detection time (Observation content
    ODP).


    We report two case of study: the application of a logical ODP (LP) and of a content
    ODP (CP).


    Applying “n-ary relations” LP. OWL supports only binary relationships (in OWL
    they are called properties). Nevertheless, in many scenarios it is common to deal
    with relations that link more than two individuals. The W3C Ontology Engineering
    and Patterns


    > ⁷http://ontologydesignpatterns.org/ont/dul/DUL.owl'
