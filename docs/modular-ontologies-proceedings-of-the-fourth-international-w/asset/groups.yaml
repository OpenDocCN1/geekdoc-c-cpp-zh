    # 将本体论最佳实践与设计模式引入机器人领域：USAREEnv


    Gabriele RANDELLI ᵃ，¹ 和 Daniele NARDI ᵃᵇ


    ᵃ 计算机与系统科学系

    罗马萨皮恩大学

    Ariosto 25, 00185 Rome, Italy


    **摘要。** 具有知识表示和推理功能的系统在机器人社区中十分常见。然而，大多数提出的架构都是即兴的（ad-hoc）实现，缺乏模块化、标准化，且数据无法在不同用户之间复用或共享。我们认为，语义网（Semantic
    Web）近年来在推广标准表示和本体论实践方面的努力应该被机器人社区采纳，以促进更有效、可复用的系统设计，并适应日常生活中非专家用户的使用。在本文中，我们研究了如何将本体论最佳实践和标准表示集成到机器人系统设计中，针对一个真实应用领域——城市搜索与救援机器人进行本体论建模。我们还讨论了该方法对机器人系统的益处，并介绍了一些有效的设计指南。


    *关键词。* 本体论、搜索与救援机器人、非结构化环境、本体论设计模式


    # 引言


    在机器人社区中，一些系统开始采用某些高级知识来完成其任务。事实上，大多数机器人决策式架构根据某些目标和给定的结果规划行动，这需要表示其知识并对其进行推理的能力。然而，知识表示和推理模块通常被实现为专门的组件，缺乏符号表示，或缺乏任何有效的设计方法。由于这种方法，只有机器人专家才能控制它们，而想要理解它们的功能并使用它们则非常困难。


    另一方面，语义网社区在知识表示形式化、推理机制和查询语言方面颁布了一些广为人知的标准，例如网络本体语言（OWL）。不仅如此，许多软件工程方法也被应用于本体表示，以产生高效且高质量的本体论模型。


    > ¹ 通讯作者：Gabriele Randelli，计算机与系统科学系。Via Ariosto 25, 00185 Rome, Italy; 邮箱：randelli@di.unroma.it.*


    我们的贡献尝试通过语义网社区建立的标准最佳实践来重新机器人社区，原因有几：首先，标准语言允许不同实体之间进行语义知识共享：例如人类、机器人和硬件设备，在智能环境或共生系统中。最佳实践促进了机器人社区的本体复用和共享，并允许敏捷的建模过程。最后，符号表示对人类来说更舒适，提高了他们在控制机器人时的情境感知能力，并相对于原始数值表示增加了更多信息。


    我们通过展示一个用于城市搜索与救援活动的非结构化环境模块化本体USAEnv验证了本体模式的使用。城市搜索与救援（USAR）涉及对受困狭窄空间的受害者进行定位、营救和医疗稳定。它包括部署机器人小组探索未知的灾难环境，同时寻找幸存者。在所有可能的任务中，这对机器人和人类来说都是要求最高的任务之一，因为环境是非结构化的，带来了两个主要挑战：机器人的移动性和情境感知。


    本文的其余部分结构如下：第1节中，我们介绍了机器人和救援领域所采用的本体表示现状，并介绍了标准表示和本体论设计模式；第2节中，我们界定了我们的应用领域：USAR室内环境和搜索与救援（SAR）活动。第3节描述了USAEnv本体模型；第4节描述了如何在机器人领域采纳最佳实践，并将其应用于USAEnv。最后，在第5节中，我们对USAEnv以及在机器人社区中使用最佳实践提供了一些说明和未来工作。


    # 相关工作


    **机器人领域的语义知识。** 许多机器人系统利用某些语义知识，但这些知识通常硬编码在它们的实现中。这大大减少了复用这些知识以及利用任何推理机制的可能性。事实上，根据Hertzberg和Saffotti
    [12]，机器人领域的语义知识的特征是需要显式表示，以及需要将该表示中的符号锚定到现实世界。然而，仍有少数方法采用符号声明语言。Modayil和Kuipers
    [16] 提出了一种基于地心占据网格的无监督学习方法来构建和识别一个本体论，但没有显式的符号表示。另一方面，Louti等人 [14] 验证了知识表示和推理系统（KRR）如何改进锚定和人机交互任务。此外，他们采用了通用的上层本体——DOLCE（一种用于语言和认知工程的描述性本体）。


    语义信息增强了自主系统和人机活动。第一个方面由Calisi等人 [6] 通过分析，通过定义一种基于机器人上下文的架构，提高了机器人在典型任务（导航、制图和探索）中的性能。另一方面，语义知识改进了人机交互，特别是在人类存在至关重要的领域，因为符号表示相对于数值表示更易于管理，并降低了用户在执行任务时的认知疲劳。然而，很少的工作基于标准表示形式化。考虑后一点，语义网的复杂性开发了用于本体的标准语言，如RDFS（描述格式模式）[5]或本体语言（OWL）[13]。网络标准可以改进机器人与人类之间的知识共享和合作，这是在异构和共生系统中部署机器人的关键方面。


    **城市搜索与救援的本体论。** 城市搜索与救援（USAR）活动具有内在的困难，因此人类的存在至关重要，在危险环境中部署完全机器人仍然是不现实的。本体表示可以帮助分类这些环境，提高与搜索与救援相关的机器人任务效率。通常，本体建模是一个协作和标准化的过程，涉及来自不同社区（研究、工业等）的多个专家。美国国家标准与技术研究院³
    促进了工业技术的标准化，并在推动救援本体论方面发挥着领先作用。Schlenoff和Messina定义了一个关于机器人及其能力的本体论草图 [20]。然而，他们的工作没有涉及环境，这是一个补充方面。Matsuno通过分析USAR活动确定了关于机器人和救援场景的主要特征
    [7]。他们的目标是支持人类在特定灾难场景中部署机器人和选择设备的决策。尽管如此，他们的工作是一组指南，而不是真正的实现。


    **本体论设计模式。** 使用标准形式是迈向高效知识共享和复用的第一步。从软件开发的角度来看，本体论是一个解决某些胜任能力问题以实现某的构制品。为了增强其建模和工程水平，本体论可以受益于著名的软件工程技术，例如本体论设计模式（ODP）的应用。Svátek
    [21] 引入了本体论设计模式，将其与软件设计模式（SDP）进行比较；Blomqvist和Sandkuhl建议将其分为五个领域：应用、架构、设计、语义和语法模式
    [3]。本体论设计模式解决了出现在不同领域中的常见建模问题。一方面，它们可以被视为最佳实践；另一方面，它们提供了克服特定语言限制的解决方案（例如，OWL不支持n元关系）。在在这两种情况下，它们都是逻辑模式且与上下文无关的。Angaruren等人
    [1] 引入了逻辑本体设计模式（LOP），定义了其创建、应用和文档化的基本步骤。他们还实现了一个本体论设计模式公共目录⁴，其中提供了一些ODP。某些ODP依赖于内容并解决特定的领域问题，因此它们被称为内容依赖型本体论设计模式。


