    # Ontology Modularity, Information Flow, and Interaction-Situated Semantics


    Extended Abstract


    Marco SCHORLEMMER a,1


    ^1 Artificial Intelligence Research Institute (IIIA), CSIC, Spain


    ## Modularity in Software and Knowledge Engineering


    Originally, software applications, databases, and expert systems were designed
    and constructed by a reduced group of software or knowledge engineers, which had
    overall control of the entire life cycle of IT artifacts. This time has gone long
    as software and knowledge engineering practice has shifted from the implementation
    of custom-made stand-alone systems to component-based engineering; databases are
    gradually deployed in distributed architectures and subsequently federated; and
    knowledge-based systems are built by reusing more and previously constructed knowledge
    bases and inference engines. Moreover, the distributed nature of IT systems has
    experienced a dramatic explosion with the arrival and general use of the Internet.
    The World Wide Web, and its ambitious extension, the Semantic Web, has brought
    an unprecedented global distribution of information in form of hypertext documents,
    online databases, open-source code, terminological repositories, web services,
    blogs, etc., which continually challenge the traditional role of IT in our society.


    As a consequence, modularity has become a necessity for any large-scale engineering
    task. But, although modularity has been thoroughly studied in software and knowledge
    engineering, the composition and interaction of IT components at the level of
    distribution of the Web is still at its infancy, and we are just grasping the
    scope of this endeavor: Successful IT interoperability beyond basic syntactic
    communication is very hard, and our era''s basic commodity around which all IT
    technology is evolving, namely information, is not yet well understood. The focus
    of the problem with understanding is what we need with we can reveal, expose and
    communicate the semantic aspect of information. As of today, component-based software
    engineering is a difficult task, still of cutting-edge research in computer science;
    putting together different databases has proved to be successful only for closed
    environments under very strong assumptions; the same holds for distributed artificial
    intelligence applications and interaction in multi-agent systems. While we were
    staying on entirely syntactic issues, it has been relatively easy to achieve component
    interoperability. But as soon as we tried to deal with the semantic aspect of
    information, looking for "intelligent" management of the information available
    on the Semantic Web, interoperability has not been an easy task.


    ## Ontologies and the Semantic Web


    The Semantic Web was envisioned, at the turn of the century, as a way of “bringing
    the World Wide Web to its full potential” [12], as an extension of the Web “in
    which information is given well-defined meaning, better enabling computers and
    people to work in cooperation” [7]. One of the basic components destined to play
    a crucial role in this effort were ontologies: documents or files that formally
    define vocabularies of terms and the relations among these terms.


    According to this vision, the activity of the World Wide Web Consortium (W3C)
    centred around the specification of recommendations for structuring the data on
    the web using logic-based representation formalisms that would provide a well-defined
    model-theoretic semantics for carrying out inferences and drawing conclusions
    about these data. The proponents of Semantic Web made clear that “the computer
    does not truly ‘understand’ any of this information, but that it will be to ‘manipulate
    the terms much more effectively in ways that are useful and meaningful to the
    human user.” [7]


    This view of cooperation on the Web takes “well-defined meaning” by means of ontologies
    as a prerequisite for successful interaction. By adopting this stance


    ## Distributed Reasoning


    When moving from stand-alone knowledge components such as ontologies to distributed
    modular artifacts reasoning is performed locally on each module or context. Essential
    for this sort of distributed reasoning is to know when inferences carried out
    in the context of one module safely be over to the contexts of other modules,
    as this allows for the combination and integration of various ontology modules
    into a distributed system. Such distributed reasoning leads to a generalised notion
    of logical consequence that lies at the heart of any semantic alignment or ontology
    modularisation. In the last decade have been many different proposals to extend
    logical consequence to a distributed setting. Some examples that have been relevant
    for ontology modularity have been local model semantic and multi-context systems
    [13], first-order and description logics [14,8], E-connections [22], package-based
    description logics [4].

