    - C 的超类角色也被提取：

    ```

    ?0 usr:selected C. rdfs:Class. rdfs:subClassOf ?C = ?0 sbont:extract

    ```

    - 角色范围：提取角色的范围概念：


    ### 3.3. 从超概念继承角色


    对于选取的概念 C ∈ Cs，我们的方法并不提取超概念的公理和断言，而是提取继承的规则。为了考虑这一步的原理，考虑我们从 O1 提取的本体模块。用户感兴趣的是特殊概念
    C2，而不是它的超概念 C1。由于 :C2 ⊑ :C1，因此 :P1 是 C2 的继承角色。然而，我们使用 Euler 内置的元组将超概念（如 :C1）替换为选取概念（如
    :C2）的唯一 RDF 空节点 (:t8)。节 3.8 和 3.7 描述了此类 RDF 空节点的构造。在示例 4.1 中，_:t8 是 :C1 的空节点，并通过
    rdfs:subClassOf _:t8 与 C2 连接。由于我们对超概念的处理方法，限制了扩展。


