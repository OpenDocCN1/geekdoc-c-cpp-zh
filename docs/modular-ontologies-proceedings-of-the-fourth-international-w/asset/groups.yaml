    ## 2.1. Semantic Enabled Complex Event Processing


    Our initial ideas about the semantic event processing are described in [35,34].
    We propose a declarative knowledge representation methodology for CEP that integrates
    the domain and application specific ontologies for events, processes, states,
    actions, and other concepts that relate to change over time. Specific domain,
    task and application ontologies need to be dynamically connected and integrated
    into the respective processing applications, which also leads to a modular integration
    approach for these ontologies. Capturing domain-specific events and generating
    complex reactions based on them is a fundamental challenge. Knowledge about event
    types and their hierarchies i.e. specialization, generalization, or other forms
    of relations between events can be useful.


    Event knowledge bases represent complex event data models which link to existing
    semantic domain knowledge such as domain vocabies/ontologies and existing domain
    data. Semantic inference is used to infer relations between events such as e.g.
    transitivity or equality between event types and their properties. Temporal and
    spatial reasoning on events can be done based on their data properties, e.g. a
    time ontology describing temporal quantities. One might define that in a supermarket,
    theft alarm is the same as fire alarm. Knowledge representation goes beyond event
    types and their hierarchies, more interesting are the relationships of events
    to other non-event concepts that specify more complex events and reactions. The
    other is that one defines in the case of a theft alarm only staff members who
    had special security courses should be informed about the alarm. In this example,
    we have non-event concepts such as person, education, and course.


    Using semantics of events is one of the promising approaches for detection of
    realworld complex events. Knowledge about event types and their hierarchies i.e.
    specialization, generalization, or other forms of relations between events can
    be useful. Semantic (meta) models of events can improve the quality of event processing
    by using event data with ontologies and rules (knowledge bases). Event knowledge
    bases represent complex event data models which link to existing semantic domain
    knowledge such as domain vocabular / ontologies and existing domain data. Semantic
    inference is used to infer relations between events such as e.g. transitivity
    or equality between event types and their properties. Temporal and spatial reasoning
    on events can be done based on their data properties, e.g. a time ontology describing
    temporal quantities. We are currently working on the realization of this kind
    of knowledge-based or Semantic CEP (SCEP) approach.


    Our research aims to develop a knowledge representation methodology for CEP which
    integrates the domain and application specific ontologies for events, processes,
    states, actions, and other concepts that relate to change over time. Specific
    domain, task and application ontologies need to be dynamically connected and integrated
    into the respective event processing applications, which also leads to a modular
    integration approach for these ontologies. Capturing domain-specific events and
    generating complex reactions based on them is a fundamental challenge.


    Modern declarative rules based especially on logics (formal) representation of
    events in combination with ontologies/(business) vocabularies, can enable the
    evolution from pure event processing systems into semantically rich "intelligent"
    reactive systems. The work done in ontologies, logic programming, temporal logic,
    logics, event/action logics enables more expressive representation of complex
    events and actions and their semantic processing. Intelligent CEP, where the CEP
    technology works in tandem with the rules technologies + ontologies, offers the
    hope and promise of efficiently detecting relevant situations of interest from
    huge amounts of events and at the same time provides the required expressiveness
    to describe higher-level logic such as business rules policies and reactive work-flows
    used e.g. for agile Semantic Business Management.


    ## 2.2. Use Cases for SCEP


    Semantic event processing have different use cases as:


    - Business Activity Monitoring (BAM),

    - Fraud Detection,

    - Smart Offices/Cities,

    - Healthcare (Smart Hospitals),

    - Logistics and Cargo,

    - Information Dissemination,

    - Event-driven Adaptive Systems,

    - Supply Chain Management.


    In all of these cases, semantic CEP can improve the quality of event processing,
    because it profits of using semantics of events in combination with the existing
    knowledge about other concepts in the target application domain. The profits of
    adding logical background knowledge to the area of event processing is the same
    as data processing.


    ## 3. Reusing of Existing Ontologies


    During the last two decades the interest in using ontologies has increased. According
    to the last few years this trend was mainly driven by the vision of the Semantic
    Web. Defined as a problem-relevant, explicit and formal specification of a shared
    conceptualization, the importance of ontologies lies in the deep problem and domain
    analysis to create them. Because a good analysis clarifies the structure of the
    domain knowledge [6]. But a good analysis as only one part of the ontology creation
    process is a very cumbersome and time-consuming activity. In order to provide
    some structural guidance for the ontology creation process some engineering methodologies
    have been proposed (e.g. Methontology[9], On-To-Knowledge, and NeON). In most
    methodologies ontology reuse is recommended, because it is expected to reduce
    engineering costs by avoiding re-building existing conceptual models. After part
    reducing costs, reusing ontologies increases interoperability from the viewpoint
    of the Semantic Web, where ontologies are considered as shared knowledge [3,2].


    Even most of these approaches mention the reuse of existing ontologies as possible
    starting point, none of them describe detail how to discover and analyse candidate
    ontologies. This is very important, because reusing ontologies presumes availability
    of already existing ontologies and discovery of potential candidates for the particular-use
    case. In this regard online ontology on Ontolingua and OntSelect libraries are
    available and search engines like Swoogle¹ and Watson² have been already developed
    in the context of the Semantic Web. Although the problem of discovering potential
    ontologies has been mostly solved, there is still an issue on selecting appropriate
    ontologies as well as understanding and analyzing the discovered ontologies.


    The idea of upper-level ontologies as the Suggested Merged Ontology (SUMO) is
    to provide a common basis for ontology modules and to allow a bus to connect different
    modules. The reuse of upper-level ontologies is important to ensure interoperability
    between different modules. The description of general concepts which are needed
    in all ontology modules. For the sake of clarity, an upper-level ontology does
    not say anything about the relation between modules. It is a self-contained ontology
    providing the semantic model of the foundational notions. The other ontology modules
    are importing the upper-level ontology as a whole and can be seen as refinements
    targeting a specific task, application or domain


    ## 4. Related Works on Event Ontologies


    Ontologies play an important key role in SCEP. They should be the conceptualization
    of the application domain to allow reasoning on events and other non-event concepts.
    A number of different event ontologies for modeling of events and their relationships
    have been proposed. Shaw R. et al. provide a comparison [31] of existing ontologies
    with an analysis based on their main constituent properties like type, time, space,
    partition, causality and composition. Table 1 lists the existing ontologies for
    representing events. Each of these ontologies are developed for different purposes
    and use cases, e.g. Event ontology [38] is developed to describe events in conjunction
    with other music-related ontologies. Each of the event ontologies are to describe
    events in different application domains, like historical events in museums, digital
    libraries, semantic events, agent-based system, etc. They describe some of the
    concepts of events, and in other aspects based on the target application area.
    To the best of our knowledge the existing ontologies are specially developed and
    used for complex event detection and processing or for the conceptualization of
    complex event processing in general.


    The existing ontologies are described in different ontology languages, Resource
    Description Framework Schema (RDFS) and different levels of Web Ontology Language
    (OWL). Different ontology languages with levels of expressiveness and limitations
    might be proposed for the description of event processing ontologies. A trade-off
    between the reasoning expressiveness and the cost of the reasoning, specially
    performance and real time processing of events can be observed. The level of expressiveness
    of the ontology language and reasoning on events should be defined depending on
    the use of the semantic event processing.


