    between ontologies consisting of axioms is hardly useful. Whereas in the functional
    approach two ontologies are indistinguishable with respect to some vocabulary
    $\Sigma$ if they are inseparable wrt the query language over $\Sigma$, regardless
    of what the axioms are and what formalisms these. One of the benefits of this
    is that big ontology can freely use a part which has the same consequences relative
    to the vocabulary of interest: we say that this part of an ontology can ‘function
    independently’. Similarly, we can freely replace different ontologies with each
    other if they are indistinguishable in the functional approach. In [16], Konev
    et studied inseparability for a variety of description logics, and proposed robustness
    properties, which were able to relate to standard properties through modularisation,
    as interpolation properties. Our goal in this paper is to generalise their results
