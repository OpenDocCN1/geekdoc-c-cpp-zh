    ## 5.2. MLD 的分析


    MLD 是一种间接测量，表示在最佳情况下，本体模块中本地符号之间可能存在的强和中度依赖的最大数量。MLD 捕捉其特征的实体是本体模块。对于 MLD 而言，属性是本地符号之间强和中度依赖的最大数量，单位是根据定义
    7 基于本体模块本地符号数量定义的组件，标度类型是区间型。


    - * 属性有效性：本体模块代表一组本地和外部符号，这些符号之间可以存在强依赖和中度依赖。可以观察到，实体（本体模块）拥有该属性（强和中度本地依赖的最大数量）。


    - * 单位有效性：定义 7 给出了 MLD 单位的精确定义。该属性通过本体模块中所有本地依赖的数量来衡量。


    - * 工具有效性：MLD 的工具具有基于理论的模型，考虑了具有 $n$ 个成员的集合成员之间存在的 $n\times(n-1)$ 关系。假设强或中度依赖是本地本体符号之间的二元关系，且
    $n$ 为本体模块中本地符号的数量，则本地符号之间最多存在 $n\times(n-1)$ 个本地依赖。只要本地符号的数量被正确测量，该工具就是有效的。


    - * 协议有效性：定义 7 为测量 MLD 提供了一种句一致且无歧的机制。计算协议不存在计数错误。


