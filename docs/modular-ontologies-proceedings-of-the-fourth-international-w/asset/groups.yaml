    | 通信质量 | 机器人之间以及机器人与远程操作员之间的通信对于从场景获取反馈并控制场景至关重要。在缺乏通信的情况下，机器人必须自主执行活动。 | 低、高
    |

    | 地面条件 | 地面区域是适用于轮式或履带式地面机器人的。在有地面的情况下，评估其状况非常重要，以便部署最佳的运动方法。 | 无地面、易、普通、难 |

    | 光照 | 光照影响基于摄像头的识别方法的使用，以及提供给操作员的视频流质量。可以通过在机器人上安装灯光来改进。 | 低、高 |

    | 磁场水平 | 高磁场的存在会改变传感器，例如指南针。 | 低、高 |

    | 放射性水平 | 辐射水平对人类人员安全至关重要。在高水平情况下，救援人员必须穿防辐射服。高辐射水平通常由放射性物体的存在引起，因此机器人应配备将它们移到现场外的工具，如抓取器。
    | 低、高 |

    | 温度 | 高温可能是爆炸或火灾的结果，并意味着易燃气体或液体的存在。在高温情况下，救援人员必须穿防燃服。如果不耐热，机器人也无法部署。 | 低、中、高
    |


    $AccessSides(a_i, a_j) = \{l_{ij}^{\omega_i} \in AdjSides(a_i, a_j), l_{ij}^{\omega_i}
    \text{ is accessible}\}$


    区域包含两个不交的实体类：*环境元素*（物理对象）和*人员*。USARE 将人员分类为幸存者或受害者（我们不考虑现场的人员）。每个人都可以与身体部位相关。我们的本体中考虑了收集有关幸存者健康状况的信息。特别是，为了帮助医生和救援人员，可以说明幸存者是否受伤以及是否能够移动，因为这决定了采用的救援方法。当机器人靠近人员时，还可以监测其体温。


    关于环境元素，USARE 将其分为气体、液体或固体。这保持了本体的通用性，以便导入关于对象的重要本体。固体进一步分解为结构元素或障碍物。这种区别是相关的，因为障碍物有助于聚类。然而，关于机器人移动性，环境元素本身具有某些属性（例如稳定性、完整性、放射性等）。这些属性有助于操作员理解这些状况。例如，发现不稳定物体可以防止救援人员进入危险区域，并预测可能发生的坍塌。最后，值得提到检测特定物体是相关的，因为它们是机器人定位和导航的地标，或者为环境内的救援人员提供提示。


    ## 4 在 USAEnv 中采用本体最佳实践


    USAEnv 的实现具有三个设计选择：


    - 1. 采用标准表示形式；

    - 2. 重用现有本体，特别是通用本体，以促进模块化；

    - 3. 通过本体设计模式促进敏捷实现。


    ### 4.1. 采用的形式


    正如前所述，USAEnv 的目标是使用语义知识支持救援任务，操作员可以利用这些知识评估状况，机器人可以利用增强自主技能，硬件设备（例如 RFID、PC 等）也是如此。因此，我们的目标之一是提供标准的表示，促进不同代理之间的共享和重用。


    USAEnv 使用 DL_ALCHO(D)，属于 OWL2 DL 家族。这种高表达本体的缺点是 OWL2 DL 在分类法和数据复杂度方面是 NEXPTIME。然而，与其他本体相比，机器人本体的数据较少，因此在大多数情况下这种复杂度是可以接受的。


    USAEnv 是通过已知且可用的工具（如 Protege）实现的。


    ### 4.2. 模块化


    为了降低开发工作并重用现有本体，我们的方法是利用模块化。其优点是多方面的：每个组件都可以分配给不同的人，增强协作设计。为了支持协作本体建模，Protégé
    发布了 Collaborative Protege 以及其基于 Web 的界面 WebProtége。另一个优势是本体的每个模块都覆盖一个特定的问题领域，可以通过本体设计模式解决或导入现有本体来解决。最后，组件的实现实现了一个独立的本体片段设计模式，并可以发布和重用。


    > 6http://protege.stanford.org/


