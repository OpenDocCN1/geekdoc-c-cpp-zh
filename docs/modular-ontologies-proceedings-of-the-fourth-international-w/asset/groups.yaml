- md: "\n# Invited Speakers\n\nSimon Colton Imperial College London, UK\nMarco Schorlemmer\
    \ Artificial Intelligence Research Institute, Barcelona, Spain\n\n# Acknowledgements\n\
    \nWe acknowledge generous financial support from the DFG-funded Research Center\
    \ on Spatial Cognition (SFB/TR 8) situated at the Universities of Bremen & Freiburg,\
    \ Germany. We would like to thank the PC members and the additional reviewers\
    \ for their timely reviewing work and our invited speakers, Simon Colton and Marco\
    \ Schorlemmer, for delivering keynote presentations at the workshop. We would\
    \ also like to thank the team at IOS Press, in particular Anne Marie de Rover,\
    \ Carry Koolbergen, and Maarten Fröhlich. Last but not least we would like to\
    \ thank the FOIS conference for hosting the WoMO workshop, in particular the local\
    \ organiser Michael Gruninger for his support.\n\nOliver Kutz\nJoana Hois\nJie\
    \ Bao\nBernardo Cuenca Grau\n\n# Contents\n\nPreface\nOliver Kutz, Joana Hois,\
    \ Jie Bao and Bernardo Cuenca Grau v \n\nTowards Ontology Use, Re-Use and Abuse\
    \ in a Computational Creativity Collective\nSimon Colton 1\n\nOntology Modularity,\
    \ Information Flow, and Interaction-Situated Semantics\nMarco Schorlemmer 5\n\n\
    The Modular Structure of an Ontology: An Empirical Study\nChiara del Vescovo,\
    \ Bijan Parsia, Uli Sattler and Thomas Schneider 11\n\nExtracting and Merging\
    \ Contextualized Ontology Modules\nSajjad Hussain and Syed Sibite Raza Abidi 25\n\
    \nA Metric Suite for Evaluating Cohesion and Coupling in Modular Ontologies\n\
    Faezeh Ensan and Weichang Du 41\n\nTowards a Functional Approach to Modular Ontologies\
    \ Using Institutions\nDaniel Pokrywczyński and Grant Malcolm 53\n\nIntroducing\
    \ Ontology: Best Practices and Design Patterns into Robotics: USAREnv\nGabriele\
    \ Randelli and Daniele Nardi 67\n\nModular Upper-Level Ontologies for Semantic\
    \ Complex Event Processing\nKia Teymourian, Gökhan Coskun and Adrian Paschke 81\n\
    \nSubject Index 95\n\nAuthor Index 97\n\n# Modular Ontologies\n\nO. Kutz et al.\
    \ (Eds.)\nIOS Press, 2010\n2010 The authors and IOS Press. All rights reserved.\n\
    doi:10.3233/978-1-60750-544-0-1\n\n# Towards Ontology Use, Re-use and Abuse\n\
    in a Computational Creativity Collective\n\nA Position Statement\n\nSimon COLTON\n\
    Computational Creativity Group\nDepartment of Computing, Imperial College, London\n\
    http://www.doc.ic.ac.uk/ccg\n\nComputational creativity is broadly defined as\
    \ the study of building software which exhibits behaviour that would be deemed\
    \ creatively exhibited by a person. In more practical terms, we investigate how\
    \ to engineer software that takes some of the creative responsibility in arts\
    \ and science projects which produce culturally interesting artefacts such as\
    \ poems, theorems, paintings, melodies, etc. To this end, there are numerous examples\
    \ of creative software being employed in musical composition, visual arts, pure\
    \ mathematics, natural language generation, scientific discovery, video game design,\
    \ and many more areas of discourse. Moreover, the computational creativity community\
    \ is beginning to come to consensus on some of the thorny questions that have\
    \ arisen, such as: When AI processes are suited to generative applications; how\
    \ can we measure levels of creativity in software; and what roles can software\
    \ play in creative acts? Our contributions to computational creativity research\
    \ have revolved around our two pieces of research software: the HR system [2]\
    \ and The Painting Pool (www.paintingfool.com). The former is mathematical theory\
    \ formation software which can start with the bare minimum about a domain of pure\
    \ mathematics, and end with a rich theory of conjectures, theorems and proofs.\
    \ The latter is an automated painter we hope hope one day be taken seriously as\
    \ a creative artist in its own world.\n\nThe majority of software developed by\
    \ computational creativity researchers – including ours – is given knowledge only\
    \ about its specific area of application. For instance, our HR system is given\
    \ enough background information about domains of pure mathematics to enable it\
    \ to invent concepts in those particular domains, but is not given wider mathematical\
    \ knowledge and is certainly not provided with information outside the sphere\
    \ of pure mathematics. This is largely acceptable in domains where there are objective\
    \ measures of value with which we can assess the artefacts produced by the creative\
    \ systems. However, we argue in [3] that in certain domains (not notably the visual\
    \ arts), the creativity and intelligence of the creator is taken into account\
    \ when assessing the value of the artefacts that he/she produces. In particular,\
    \ in such domains, the cultural awareness of the artist may well be questioned\
    \ when people assess value of their work. In these situations, there is much need\
    \ for the kind of knowledge stored in ontologies, where creative software can\
    \ use these knowledge to enhance its intelligence, in order to produce more interesting\
    \ and culturally valuable artefacts.\n\n# S. Colton / Towards Ontology Use, Re-Use\
    \ and Abuse in a Computational Creativity Collective\n\nwe argue, in addition\
    \ to the use of such ontologies, we will also need to re-use the knowledge in\
    \ ontology for situations that it was not conceived for, and also to abuse the\
    \ ontologies, by using them for rather imaginative purposes.\n\nWe are currently\
    \ engaged in a project to build a computational creativity collective of software,\
    \ knowledge and resources (www.doc.ic.ac.uk/ccg/collective). The purpose of the\
    \ collective will be to bring together software which is able to generate different\
    \ types of artefacts (e.g., poems, pictures, melodies, theorems, etc.) in such\
    \ a way that the output from one process becomes the stimulus for another process.\
    \ In this way, we hope to show that such software – when used in combinations\
    \ – can produce culturally relevant and scientific artefacts of real value to\
    \ various communities. There will be (at least) four arms to the collective. The\
    \ first arm will contain the generative and analytical algorithms for producing\
    \ artefacts. Currently, the collective has more than 100 processes involving image\
    \ and text manipulation, and the retrieval of web material. In addition, it has\
    \ more than 50 mashups which combine two or more of these processes. For instance,\
    \ one mashup in the collective retrieves the most current tweets from a twitter\
    \ user, extracts keywords from the tweet, finds images from Google Images which\
    \ match the keywords, and puts the images together into a visual Collage. This\
    \ kind of text-to-art mashup follows from the project described in [6]. the second\
    \ arm of the collective will be a set of reasoning methods which are freely combine\
    \ the processes in the collective. The first instantiation of a combined reasoning\
    \ process will be based on global workspace architectures, in particular, the\
    \ work described in [11]. The third arm of the collective will be source materials\
    \ (images, sounds, music, text, etc.) which can be accessed by the processes in\
    \ the production of the artefacts. Naturally, any artefacts which are produced\
    \ by the collective will be added to this source material.\n\nThe final arm of\
    \ the collective will be a knowledge base of information which can be queried\
    \ by processes in the collective, and a set of techniques for querying, combining\
    \ and possibly abusing the knowledge base in order to add intelligence and imagination\
    \ to the ways in the collective operate. We envisage the use of ontologies to\
    \ represent the information in the knowledge base, and we hope that the creative\
    \ usage of ontologies will lead to interesting developments in the theory of modular\
    \ ontology design. Researchers interested in computational creativity are already\
    \ turning to ontologies to test their methods, and as sources of information.\
    \ For instance, the work of Veale et al. investigates analogous reasoning for\
    \ ontology construction in [9], and they regularly use ontologies such as WordNet\
    \ in creative fashions, e.g., for the creation of neologisms [8]. We can also\
    \ claim that the automated theory formation routine in HR is a method for ontology\
    \ construction, whereby the concepts in the ontology are invented by the software.\
    \ A example of ontology construction methods might be found in conceptual blending\
    \ [5], which is also regularly used in creativity settings, for instance in the\
    \ projects described in [7]. We envisage that these kinds of knowledge generation\
    \ engines will form an important part of the way in which the collective is used\
    \ for creative artefact generation.\n"
