    For example, suppose two groups of ontology designers independently refine an
    ontology $O \subseteq \Sen(\mathcal{A})$ by creating their own set of axioms,
    $O_1 \subseteq \Sen(\mathcal{A}_1)$ and $O_2 \subseteq \Sen(\mathcal{A}_2)$. Both
    teams seek to ensure that their ontologies are conservative extensions of $O$.
    Assume that these groups decide to merge their ontologies at some point, they
    would like $U_{O_1} \cup U_{O_2}$ to be a conservative extension of $O$, but the
    fact that $O_1$ and $O_2$ are conservative extensions of $O$ is not sufficient
    to guarantee $O^*$. Robustness under joins and the above proposition provide a
    sufficient condition.


    Robustness under replacement. This allows merging of existing ontologies to be
    re-used in new applications. For instance, assume that a group of ontology designers
    is developing an ontology which is specified using terminology over $\Sigma$.
    We know that there is another ontology $O''$, which already defines members of
    $\Sigma$, so instead of creating this part from scratch they would prefer to use
    $O''$. However, instead of importing all of $O''$, it would be more efficient
    to use a $\Sigma$-model $O_\Sigma$. If the framework $\mathcal{F}$ for answering
    queries is robust under replacement then when $O_\Sigma \equiv_{\Sigma} O''$,
    it follows that $O \cup O_\Sigma \equiv_{\Sigma} O \cup O''$. Therefore $O_\Sigma$
    still gives the consequence.


    Robustness properties are closely related to Craig Interpolation properties, which
    can be formulated in a variety of ways in an institutional setting; Deaconescu
    [8] for an overview, the basic situation involves a commuting square of signature
    morphisms $E_1 \subseteq \Sen(\Sigma_1)$ and $E_2 \subseteq \Sen(\Sigma_2)$ such
    that


