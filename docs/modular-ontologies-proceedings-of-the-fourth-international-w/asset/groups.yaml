    \n我们报告了估计真实世界本体论模块数量的实验。我们还评估了我们完全模块化的本体论的模块化结构。在评估中，我们查看了模块的数量和大小，以及模块大小与导致模块的签名数量之间的关系。我们报告的关于小规模本体论的理解可能适用于所有本体论。\n\
    \n**关键词。** 本体论、描述逻辑、模块提取、句法局部性、本体论理解\n\n## 1. 引言\n\n**为什么要对本体论进行模块化？** 在软件工程中，在其他条件均等的情况下，模块化结构的系统是理想的。给定一个设计良好的模块化程序，通常更容易对其进行处理、修改和分析，并利用模块化结构来重用部分。因此，对模块（或组件、类、对象、包、切面）的支持是编程语言中的常见特性。\n\
    \n本体论是类似于程序的概念产物，在著名的示例中，它们可能变得像复杂的系统一样复杂，这表明利用模块化可能会很有成效，而本体论模块化的研究一直是本体论工程的一个活跃领域。近期，大量的精力投入到开发逻辑上合理的模块中，这些模块为直观的模块属性提供了强有力的逻辑保证。其中一种保证是保证覆盖，意味着该模块捕获了本体论关于给定一组（签名）的所有知识——一种隔离\n\
