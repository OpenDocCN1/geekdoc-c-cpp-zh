    \text{ 推出 } O_1 \overset{\eta}{=}^{\Sigma} \cup O_2$。


    - *替换*：在框架 $\mu : L \to G$ 中，如果对于 $Sig^{\Lambda_1}$ 中的所有签名 $\Lambda_1$，$Sig^{\Lambda_2}$
    中的 $\Lambda_2$，$Sig^{\Lambda}$ 中的 $\Lambda$ 以及 $Sig^{\Sigma}$ 中的 $\Sigma$，使得 $\Phi^{\mu_1}(\Lambda_1)
    \cup \Phi^{\mu_2}(\Lambda_2)) \to \Phi^{\Sigma}(\Sigma)$，对于所有本体 $O_1 \in Sen^{\Lambda_1}(\Lambda_1)$，$O_2
    \in Sen^{\Lambda_2}(\Lambda_2)$，$O \in Sen^{\Lambda}(\Lambda)$，满足：$O_1 \overset{\eta}{=}^{\Lambda_1}
    \text{ 推出 } O \cup O_2 \overset{\eta}{=}^{\Sigma}$。


    我们简要讨论这三种类型健壮性背后的直觉。


    词汇扩展健壮性允许我们使用 $O_1$ 或 $O_2$ 中不存在的新符号扩展签名 $\Sigma$，这种扩展不会影响 $O_1$ 和 $O_2$ 的 $\Sigma$-可分性。


    并运算健壮性。我们将使用一个典型的例子来展示这种健壮性。首先引入一个关于并运算健壮性的命题：


    ## 题 2. 对于关于 $\mu$ 的二元框架 $(\mu_1, \mu_2)$，其在并运算下是健壮的，对于 $\mu$ 的 $\Lambda$-本体以及
    $O_i$ 的 $\Lambda_i$-本体（对于 $i=1, 2$），


    $$\mu^{\mu_1}(\Lambda) \cap \mu^{\mu_2}(\Lambda) \rightarrow \mu^{\mu}(\Lambda),$$


    如果 $\alpha_{\lambda_1}^{\alpha}(O_1) \cup \alpha_{\lambda_2}^{\alpha}(O_2)$ 是
    $\alpha_{\lambda}^{\alpha}(O)$ 的保守扩展。


    例如，假设两个本体设计小组独立地通过创建自己的公理集 $O_1 \subseteq Sen(\mathcal{A}_1)$ 和 $O_2 \subseteq
    Sen(\mathcal{A}_2)$ 来完善本体 $O$。两个团队都确保他们的本体是 $O$ 的保守扩展。假设这些小组在某点决定合并本体，他们希望 $U_{O_1}
    \cup U_{O_2}$ 是 $O$ 的保守扩展，但 $O_1$ 和 $O_2$ 是 $O$ 的保守扩展这一事实并不足以保证 $O$。并运算健壮性和上述命题提供了充分条件。


    替换健壮性。这允许在新的应用中重用现有本体。例如，假设一组本体设计者正在使用 $\Sigma$ 开发本体。我们知道另一个已经定义了 $\Sigma$ 成员的本体
    $O''$，因此与其从头开始，不如使用 $\Sigma$-模型 $O_\Sigma$。如果用于查询的框架 $\mathcal{F}$ 在替换下是健壮的，那么当
    $O_\Sigma \equiv_{\Sigma} O''$ 时，得出 $O \cup O_\Sigma \equiv_{\Sigma} O''$。因此 $O_\Sigma$
    仍然有效。


    健性性质与 Craig 插值性质密切相关，在机构设置可以通过多种方式公式化；概述，基本情况涉及签名交换图 $E_1 \subseteq Sen(\Sigma_1)$
    和 $E_2 \subseteq Sen(\Sigma_2)$，使得


    ![](img/a1ab5b0915908cfe20ac887a02d94e_81_0.png)


    图 2 签名交换图。


    $\sigma''_1(E_1) \models_{\Sigma} \sigma''_2(E_2)$。Craig 插值说存在一个*插值元*；即一个 $\Sigma$-句子集
    $E$，使得 $E_1 \models_{\Sigma_1} \sigma_1(E)$ 且 $\sigma_2(E) \models_{\Sigma_2}
    E$。如果该性质对于所有此类集合都成立，我们称该图具有 *CIP*。然而，在许多情况下这是一个很强的要求。通过考虑某些交换图可以获得较弱的概念。经典 CIP（我们称为弱插值）具有
    $\Sigma - \Sigma_1 \cap \Sigma_2$ 和 $\Sigma'' = \Sigma_1 \cup \Sigma_2$。通常要求上箭头属于态射类
    $L$，左箭头属于类 $R$，从而给出一个 $(L, R)$-CIP 的概念。此类类的示例可能是：包含、主观态射等，如果每个图都是 CIP，且该图的上箭头在
    L 中而左箭头在 R 中，那么我们可以说机构是 $(L, R)$-CIP。


    Aguier 和 Barbier 引入了态射的保守性概念，并证明保守态射保持 CIP。


    ## 定义 3.3. *令 I 为机构。令 $\sigma : \Sigma \to \Sigma''$ 为签名态射，令 $O \in Sen(\Sigma'')$。我们定义
    $O_\sigma = \{\phi \in Sen(\Sigma) \mid O \sqsubseteq_\sigma \sigma(\phi)\}$。*


    机构 $\mu : I \to I''$ 是保守的，当对于每个签名态射 $\sigma : \Sigma \to \Sigma''$ 和 $I$ 中的每个句子集
    $O \in Sen(\Sigma'')$ 都满足：


    ```

    $$\mu_{AS(O)}(O) \rightleftharpoons (\sigma(O))\varphi(\sigma)$$

    ```


    对于保守的 $\mu$，它表明如果 $I$ 中的交换图通过 $\mu$ 映射到 $I''$ 中具有 CIP 的图，那么 $S$ 具有 CIP。


    以下引理指出，如果图 3 中的图在全局机构中具有 CIP，则框架具有某种保守性质：


    ```

    $$\Phi^{\mu}(\Lambda) \cup \Phi^{\mu}(\Sigma) \xrightarrow[1]{\mu} \Phi^{\mu''}(\Lambda)
    \cup \Phi^{\mu''}(\Sigma)$$

    $$\downarrow l$$

    $$\downarrow l$$

    $$\Phi^{\mu}(\Lambda) \cup \Phi^{\mu}(\Sigma) \xleftarrow[1]{\mu''} \Phi^{\mu''}(\Lambda)
    \cup \Phi^{\mu''}(\Sigma)$$

    ```


    图 3 交换图。


