  mdcn: "\n\nM 的真实 MSSig 数量、M 的最小 MSSig 大小，以及 M 的大小。\n\nM 的凝聚力（cohesion）衡量了 M 中的术语相互紧结在一起的紧密程度，这通过\
    \ M 的种子签名（seed signatures）数量来体现。更准确地说，M 的凝聚力定义为比率 r/s。M 的拉力（pulling power）衡量了在一个\
    \ MSSig 中需要多少术语才能“拉出”我们找到的所有术语。我们将 M 的拉力定义为比率 r/s。\n\n作为初稿，我们将模块 M 的权重定义为其凝聚力与拉力的乘积：w\
    \ = r/s。我们计算了 Koala 中 3660 个模块的权重。最重的 11 个模块及其差异将整个本体论划分为 10 个部分，每个部分由假定构成一个主题的术语（包括主体）：动物；人与正在工作；学生；人；考拉与有袋类动物；塔斯马尼亚开发者；岩澳鼠；栖息地；学位；性别。这些主题反映了本体论的核心部分。那些未在最重模块中出现的公理（axioms）倾向于我们认为对本体论不重要的部分。在\
    \ RainForest 中，前 11 个模块涵盖了 Koala 所有的逻辑公理（42 个中的 39 个），且所有公理从第 4 个重模块开始被覆盖。前 19\
    \ 个最重模块也是真实的。\n\n下一步将是完善这一衡量标准并将其应用于更多本体论。我们无法期望比 Koala 更大的本体论模块化，我们需要找到单独提取权重模块的方法。\n\
    \n# 5. 讨论与展望\n\n基本结论显而易见：对于真实的本体论，即使我们将注意力限制真实模块（genuine modules），模块的数量随本体论的大小呈指数级增长。我们对中小型本体论（即超过\
    \ 100 个公理）模块总数的最合理估计表明，完全模块化在实践是不可能的。由于我们是基于模块进行计算，这些模块往往比基于保守扩展的模块更大，我们的结果为模块数量提供了一个下限。\n\
    \n当然，可能存在原则性的方法来减少目标模块数量。可以使用更粗糙的近似方法，尽管在逻辑上很难证明合理。尝试使用“非最小”模块或通过启发式合并模块已表现出糟糕的行为，它们强烈倾向于坍缩为少数几个包含本体论大部分内容的模块。\n\
    \n我们相信这种观察是稳健的，即使我们在 Tambis 和 miniTambis 上的实验未能发现异常行为。正如我们在第 4 节所说，我们预计更长的超时将揭示问题行为。\n\
    \n此外，我们观察到这些本体论具有大量的不可满足概念（unsatisfiable concepts），它们具有庞大的解释（justifications），以及具有大签名（signatures）的较长公理。此类概念的每个模块至少包含一个解释\
    \ ⁶；这些本体论的模块往往很大，这减少了模块的总数。同样，具有大签名的公理倾向于增加术语之间的交互机会，并增加模块的签名大小。\n\n> 我们有充分理由相信，基于局部性的模块由于是耗尽的\
    \ [19]，始终包含其扩展签名内每个推理的所有解释。\n\n从而导致产生大量的非最小种子签名。然而，这些事实并没有表明 Tambis、miniTambis\
    \ 与研究的其他本体论（如 University 甚至 Koala）之间存在本质上的区别。Koala 和 University 都有未满足概念。Koala\
    \ 中不可满足概念的解释大小为 5 个公理，而 University 最高为 9 个，大多数在 6 个以下。miniTambis 和 Tambis 的解释最大大小为\
    \ 13 个公理，很大比例超过 6 个。如果我们关于解释作用的假设是正确的，那么指数级增长似乎仅仅被延迟了。因此，仍然可能（且我们认为很有可能）存在指数行为，但只有在足够高的超时下才可见。此外，Tambis\
    \ 和 miniTambis 中解释的大型有一点人为的成分，因为它依赖于不可满足性。这些本体论具有长长的“依赖性”不可满足性链 [14]，这增加了沿链解释的大小。当这些不可满足性被解决时，这些概念将不再拥有这些长解释作为其所有模块的一部分。\n\
    \n这些考虑表明，通常，真实模块与伪模块（fake modules）之间的比例可以被视为公理丰富性的衡量标准，指示了本体论中的公理连接术语的程度：模块越少，其术语的“相互接触”就越多。\n\
    \n尝试从统计学上估计模块数量也没有帮助。我们可以随机抽取少量种子签名，计算它们的模块并用此估计所有模块的数量。我们通过基础随机论说服自己，仅通过对所有种子签名的一小部分进行采样无法获得可靠估计。详见\
    \ [8]。\n\n虽然实验结果从分析本体论的完全模块化的角度来看令人沮丧，但它揭示了未来工作的几个有趣方向。首先，我们已经看到了一些与模块数量多寡相关的本体论特征。然而，除了整体论（Merology）中的现象外，我们还没有经过验证的解释。因此，例如，我们需要获得解释结构与模块结构之间关系的精确描述。其次，即使我们无法计算所有模块，我们也可能计算出其数量的更好近似。考虑到签名采样似乎没有帮助，应探索模块数量增加或减少的来源，例如推理层次的形状和公理模式。在方法上，应该使用人工本体论，例如确认解释结构与模块数量之间的关系。第三，我们在计算重模块方面的初步实验是有前景的：我们的权重似乎捕捉到了模块的凝聚力和拉力，生成的重模块似乎与主题良好地对应。我们目前正在研究是否可以在不计算所有模块的情况下计算所有重模块，并研究合适的“块”（blocks）概念。后者与伪模块和真实模块密切相关，我们也在更详细地研究它们。\n\
