    \in C^{\mathcal{I}}$ and an ABox axiom $R(x,y)$ iff $(x^{\mathcal{I}}, y^{\mathcal{I}})
    \in R^{\mathcal{I}}$. An interpretation $\mathcal{I}$ of a knowledge base $\Psi$
    if it satisfies every TBox axiom and ABox axiom of $\Psi$. A concept $C$ is satisfiable
    if $C^{\mathcal{I}} \neq \emptyset$. A knowledge base is consistent if it has
    a model that satisfies all concepts and rules. An inclusion or assertion axiom
    $\alpha$ is implied by a knowledge base $\Psi$ and denoted by $\Psi \models \alpha$
    iff there exist a model for $\Psi$ that satisfies $\alpha$.


