    ## Proposition 2.8. Given a framework $L \xrightarrow{\mu}$ over a query basis
    $Q \xrightarrow{\eta}$ $G$ with a comorph $L \xrightarrow{\varphi} G$, $\mu =
    \rho; \eta$, and $\Lambda$-ontologies $O_1$ and $O_2$, we have:


    ```

    $O_1 \overset{\varphi}{=}^{\Lambda} \quad O_2 \text{ iff} \ O_1 \overset{\varphi}{=}^{\Lambda}
    \varphi, \text{ for all } \varphi \in \alpha^{\Lambda}(O_2).$.

    ```


    ## 3. Robustness Properties and the Craig Interpolation Property


    In this section we consider how ontologies may be combined. If we have frameworks
    $\mu_1$ and $\mu_2$ over the same query basis $\eta$, then a $\Lambda_1$-ontology
    $O_1$ for $\mu_1$ can be combined with a $\Lambda_2$-ontology $O_2$ for $\mu_2$
    by using the union of $\mu_1(O_1)$ and $\mu_2(O_2)$ in $G$, even if the ontology
    languages of $\mu_1$ and $\mu_2$ are different. This justifies using a notation
    for ontologies, so we can write for, $O_1 \cup O_2 \overset{\eta}{=}^G$.


    In the previous section, we studied some properties of $\approx^{\eta}$, but we
    are mainly interested in determining what robustness properties has, i.e., how
    safely ontologies can be combined. We introduce three types of robustness properties
    in the framework setting.


    ## Definition 3.1. For any binary framework $\hat{\mu} = (\mu_1, \mu_2)$ we say
    that $\hat{\mu}$ is robust under:


    - * vocabulary extension for all signatures $\Lambda_1$ in $Sig^{\Lambda_1}$,
    $\Lambda_2$ in $Sig^{\Lambda_2}$, $\Sigma, \Sigma''$ in $Sig^{\Sigma}$, s.t. $\Sigma
    \to \Sigma''$ and $\Phi^{\Sigma''}(\Phi^{\mu_1}(\Lambda_1) \cup \Phi^{\mu_2}(\Lambda_2))
    \to \Phi^{\Sigma}(\Sigma)$, for all ontologies $O_1 \in Sen^{\Lambda_1}(\Lambda_1)$
    and $O_2 \in Sen^{\Lambda_2}(\Lambda_2)$ the following holds $O_1 \overset{\eta}{=}^{\Lambda_1}
    \text{ implies} \ O_2 \overset{\eta}{=}^{\Lambda_2}$.


    - * joins for all signatures $\Lambda_1$ in $Sig^{\Lambda_1}$, $\Lambda_2$ in
    $Sig^{\Lambda_2}$ and $\Sigma$ in $Sig^{\Sigma}$, s.t. $\Phi^{\mu_1}(\Lambda_1)
    \cup \Phi^{\mu_2}(\Lambda_2) \to \Phi^{\Sigma}(\Sigma)$ and all ontologies $O_1
    \in Sen^{\Lambda_1}(\Lambda_1)$ and $O_2 \in Sen^{\Lambda_2}(\Lambda_2)$, the
    following holds for $i=1, 2$: $O_i \overset{\eta}{=}^{\Lambda_i} \text{ implies}
    \ O_1 \overset{\eta}{=}^{\Sigma} \cup O_2$.


    - * replacement in framework $\mu : L \to G$ if for all signatures $\Lambda_1$
    in $Sig^{\Lambda_1}$, $\Lambda_2$ in $Sig^{\Lambda_2}$, $\Lambda$ in $Sig^{\Lambda}$
    and $\Sigma$ in $Sig^{\Sigma}$, s.t. $\Phi^{\mu_1}(\Lambda_1) \cup \Phi^{\mu_2}(\Lambda_2))
    \to \Phi^{\Sigma}(\Sigma)$, for all ontologies $O_1 \in Sen^{\Lambda_1}(\Lambda_1)$,
    $O_2 \in Sen^{\Lambda_2}(\Lambda_2)$, $O \in Sen^{\Lambda}(\Lambda)$, the following
    holds: $O_1 \overset{\eta}{=}^{\Lambda_1} \text{ implies} \ O \cup O_2 \overset{\eta}{=}^{\Sigma}
    O$.


    We briefly discuss the intuitions behind those three types of robustness.


    Robustness under vocabulary extension allows us to extend signature $\Sigma$ with
    fresh symbols, which do not occur in $O_1$ nor $O_2$ and this extension has no
    impact on $\Sigma$-inseparability of $O_1$ and $O_2$.


    Robustness under joins. We will use a typical example to present the importance
    of this type of robustness. First we introduce a proposition which is a consequence
    of robustness under joins:


    ## Proposition 2. For a binary framework $(\mu_1, \mu_2)$ over $\mu$ which is
    robust under joins, a $\Lambda$-ontology for $\mu$, and $\Lambda_i$-ontologies
    for $O_i$ (for $i=1, 2$),


    $$\mu^{\mu_1}(\Lambda) \cap \mu^{\mu_2}(\Lambda) \rightarrow \mu^{\mu}(\Lambda),$$


    if $\alpha_{\lambda_1}^{\alpha}(O_1) \cup \alpha_{\lambda_2}^{\alpha}(O_2)$ is
    a conservative extension of $\alpha_{\lambda_i}^{\alpha}(O)$.


    For example, suppose two groups of ontology designers independently refine an
    ontology $O \subseteq Sen(\mathcal{A})$ by creating their own set of axioms, $O_1
    \subseteq Sen(\mathcal{A}_1)$ and $O_2 \subseteq Sen(\mathcal{A}_2)$. Both teams
    seek to ensure that their ontologies are conservative extensions of $O$. Assume
    that these groups decide to merge their ontologies at some point, they would like
    $U_{O_1} \cup U_{O_2}$ to be a conservative extension of $O$, but the fact that
    $O_1$ and $O_2$ are conservative extensions of $O$ is not sufficient to guarantee
    $O$. Robustness under joins and the above proposition provide a sufficient condition.


    Robustness under replacement. This allows merging of existing ontologies to be
    re-used in new applications. For instance, assume that a group of ontology designers
    is developing an ontology using terminology over $\Sigma$. We know there is another
    ontology $O''$ which already defines members of $\Sigma$, so instead of creating
    this from scratch they would prefer to use $O''$. However, instead of importing
    all of $O''$, it would be more efficient to use a $\Sigma$-model $O_\Sigma$. If
    the framework $\mathcal{F}$ for answering queries is robust under replacement
    then when $O_\Sigma \equiv_{\Sigma} O''$, it follows that $O \cup O_\Sigma \equiv_{\Sigma}
    O''$. Therefore $O_\Sigma$ still gives the consequence.


    Robustness properties are closely related to Craig Interpolation properties, which
    can be formulated in a variety of ways in an institutional setting; for an overview,
    the basic situation involves a commuting square of signature morphisms $E_1 \subseteq
    Sen(\Sigma_1)$ and $E_2 \subseteq Sen(\Sigma_2)$ such that


    ![](img/a1ab5b0915908cfe20ac887a02d94e_81_0.png)


    Figure 2. Commuting square of signature morphisms.


    $\sigma''_1(E_1) \models_{\Sigma} \sigma''_2(E_2)$. Craig Interpolation says there
    is an *interpolant*; i.e., a set $E$ of $\Sigma$-sentences such that $E_1 \models_{\Sigma_1}
    \sigma_1(E)$ and $\sigma_2(E) \models_{\Sigma_2} E$. If this property holds for
    all such sets, we say the square has *CIP*. However, this is a strong requirement
    that is not met in many instances. Weaker notions may be obtained by considering
    certain classes of commuting squares. Classical CIP (which we call weak interpolation)
    has $\Sigma - \Sigma_1 \cap \Sigma_2$ and $\Sigma'' = \Sigma_1 \cup \Sigma_2$.
    Generally, requires the top arrow to belong to a class $L$ of morphisms, and the
    left arrow to belong to a class $R$, giving a notion of $(L, R)$-CIP. Examples
    of such classes might be: inclusions, subjective morphisms, etc., and we can say
    an institution $(L, R)$-CIP if every square is CIP, provided the top arrow of
    the square is in L and the left arrow in R.


    Aguier and Barbier introduce a notion of conservativity for morphisms, and show
    that conservative morphisms preserve CIP.


    ## Definition 3.3. *Let I be an institution. Let $\sigma : \Sigma \to \Sigma''$
    be a signature morphism and let $O \in Sen(\Sigma'')$. We define $O_\sigma = \{\phi
    \in Sen(\Sigma) \mid O \sqsubseteq_\sigma \sigma(\phi)\}$.*


    An institution $\mu : I \to I''$ is conservative if every signature morphism $\sigma
    : \Sigma \to \Sigma''$ and every set of sentences $O \in Sen(\Sigma'')$ in $I$
    satisfy:


    ```

    $$\mu_{AS(O)}(O) \rightleftharpoons (\sigma(O))\varphi(\sigma)$$

    ```


    For $\mu$ conservative, it shows that if a commuting square in $I$ is mapped by
    $\mu$ to a square in $I''$ that has CIP, then $S$ has CIP.


    The following Lemma states that if the square in Figure 3 has CIP in the global
    institution, then the framework has a kind of conservativity property:


    ```

    $$\Phi^{\mu}(\Lambda) \cup \Phi^{\mu}(\Sigma) \xrightarrow[1]{\mu} \Phi^{\mu''}(\Lambda)
    \cup \Phi^{\mu''}(\Sigma)$$

    $$\downarrow l$$

    $$\downarrow l$$

    $$\Phi^{\mu}(\Lambda) \cup \Phi^{\mu}(\Sigma) \xleftarrow[1]{\mu''} \Phi^{\mu''}(\Lambda)
    \cup \Phi^{\mu''}(\Sigma)$$

    ```


    Figure 3. Commuting square.

