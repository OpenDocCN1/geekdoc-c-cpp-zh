    lighting, cluttering, toxicity level, mobility hardness, communications level,
    and so on. It is also important to map all the unstable or damaged objects, the
    protruding structural elements, gas or electric leaks.


    # 2.2. USAR Activities Requirements


    Deploying the robotic configuration for rescue missions is still a non standardized
    process, rather an ad-hoc activity performed by SAR experts. At the very beginning,
    access to the site is precluded for human personnel, due to safety issues. Hence,
    robots are deployed to produce a preliminary assessment, controlled from a remote
    site. This process is iterative: every time new information is acquired, it is
    integrated with the previous one, the assessment is refined and specialized for
    narrower areas, and more suitable robot configurations are selected. When some
    area is declared as safe, a human rescue team can be deployed with robots to have
    on site responders and further increase the information detail level. US workflow
    consists of five main activities. This analysis is based on the work by Chaterjee
    and Matsuno [7].


    Observation and analysis. Acquiring information relative to the situation is the
    first step defining the next tasks. In depth, acquiring a proper human-robot awareness
    and situation awareness, according to Drury et al. [10], involves several aspects:
    the controlled robot, its nearby environment, other operators, the robot team,
    and the mission goal. An important aspect is to measure the risk degree associated
    to a specific area; this requires to assess the stability and integrity of physical
    objects and all the structural elements. The feedback provided by the previous
    iteration is integrated with the old data.


    Task identification. According to the accomplishment of a specific task, sub-tasks
    are evinced, or a new task is defined. Some examples of tasks are: mapping, exploration,
    search for victims, delivering objects, leaving a place, and so on.


    Resource Management. Given as input the present situation assessment, and the
    tasks to accomplish, resources are allocated, in terms of robots, hardware and
    software equipments, on-site personnel (if allowed to enter). Selecting the right
    resources among rescue and robotic experts. The resource could not be available
    and should be ordered and delivered, with a consequent delay that must be taken
    into account. Resource selection is based on several aspects: robot constraints,
    capabilities, interaction with humans or other devices, environmental conditions,
    and so on.


    Operation execution. During this phase, one or more operators are in charge of
    controlling and monitoring each robot; for example, setting its speed or an autonomy
    mode, selecting a specific exploration strategy, and so on. Since the main goal
    is to look for survivors, the operator must control the robot to assess whether
    a detected person is still alive or not. If the detected person is still alive,
    it is important to collect some information about her healthy status. These data
    would be useful for doctors and rescuers to decide how to rescue the person and
    the medical cares she needs.'
