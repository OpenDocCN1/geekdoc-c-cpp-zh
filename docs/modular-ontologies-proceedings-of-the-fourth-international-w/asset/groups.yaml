    提取上下文化本体模块的理由是，使用大型本体会导致为专门问题所需的知识模型引入无关概念，这不仅会产生非预期的解释从而扩展模型的推论闭包，还会损害知识模型的效率、复杂性和细粒度。因此，为了解决大型领域中的专门化问题，需要提取一个能够提供源本体一致片段的本体模块。


    基于结构的本体模块提取 [10,13,9,8,14] 通常由特定的问题语境引导，导致从多个提取的本体模块中对概念进行选择、适应、对齐或合并 [5]。然而，挑战在于确保合并后的本体模块不会导致：(i)
    领域概念化的差异，(ii) 逻辑冲突以及(iii) 根据语境对概念及其角色的不准确实现；这些问题会导致本体模块变得不一致 [6]。在这种情况下，确保提取的本体模块在语义上一致是至关重要的。上下文化本体模块处理其原始本体模型的片段，并提供(i)
    对其本体概念的具体解释；以及(ii) 针对当前问题语境的程序化知识的实现细节。


