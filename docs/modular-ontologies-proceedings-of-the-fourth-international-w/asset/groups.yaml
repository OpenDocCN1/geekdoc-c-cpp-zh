    situation-individuals. They have a fixed context such as time allocation (date),
    location, participant, etc. They are not repeatable and temporally connected.
    Situation-descriptions contain content and temporal properties to situation-individuals.
    They describe the dating of situation by mapping into the time. Situation-descriptions
    connect situation type with validity intervals. Situations are defined with time
