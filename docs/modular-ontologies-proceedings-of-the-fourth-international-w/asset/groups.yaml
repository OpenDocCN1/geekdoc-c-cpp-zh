    # Extracting and Merging Contextualized Ontology Modules


    Sajjad HUSSAIN 1 and Syed Bibte Raza ABIDI


    NICHE Research Group, Faculty of Computer Science, Dominion University, Canada


    Abstract. Ontology module extraction, from a large ontology, leads to the generation
    of a specialized knowledge module that is pertinent to specific problems. Extending
    ontology module extraction methods tends to either render a too generalized or
    a restricted ontology module at times does not capture the entire semantics of
    the source ontology. We present an ontology module extraction method that extracts
    an extracted ontology module while extending the semantics of the concepts and
    their relationships in the ontology module. Our approach features the following
    tenets (i) identifying the user-selected concepts that are pertinent for the problem-context
    at hand; (ii) extracting the user-selected concepts, roles and their individuals;
    and (iii) extracting other concepts, roles and individuals that are structurally-connected
    with the user-selected concepts. We apply our ontology module extraction method
    in the Healthcare domain, and demonstrate (a) extraction of ontology modules from
    three prostate cancer pathway ontologies; and (b) merging of extracted ontology
    modules to generate a comprehensive therapeutic work-flow knowledge for prostate
    cancer care management.


    Keywords. Ontology Modularization, Ontology Reconciliation and Merging


    ## 1. Introduction


    Ontologies [3] serve as the backbone for the Semantic Web as they provide formal
    structure to model a domain along shared concepts and their relationships. A key
    aspect of Semantic Web research is knowledge modeling that is pursued by developing
    a domain-specific ontology. The ontology, then, serves as the foundational representation
    for a variety of activities, such as web-based information sharing, retrieval,
    mediation, elaboration, and decision support. Knowledge modelers, or ontology
    engineers, develop ontologies in a variety of ways—i.e. developing a new ontology
    by abstracting domain concepts and relations, adding new concepts to an existing
    ontology or aligning/merging multiple ontologies to realize a specialized ontology.


    For mature domains—such as medicine, genetics and business—the common practice
    of researchers is to leverage large-scale domain ontologies in order to systematically
    select a sub-set of concepts or a specialized ontology module that is representative
    of the task at hand. An ontology module presents a focused representation, at
    a desired level of abstraction, selected elements of the source ontology whilst
    offering the operational processing and knowledge constraints pertaining to the
    problem-context at hand. The rationale for extracting contextualized ontology
    modules is that working with the larger ontologies leads to the introduction of
    irrelevant concepts to the required knowledge model for a specialized problem,
    which in turn not only extends the deductive closure of the model with undesired
    interpretations but also compromises the efficiency, complexity and granularity
    of the knowledge model. Therefore, for solving specialized problem in large domains
    there is need to extract an ontology module that offers a consistent fragment
    of the source ontology.


    Structure-based ontology module extraction [10,13,9,8,14] is usually guided by
    a particular problem-context that leads to the selection, adaptation, reconciliation,
    or merging of concepts from multiple extracted ontology modules [5]. However,
    the challenge is to ensure that a merged ontology module does not lead to (i)
    differences in domain conceptualization, (ii) logical contradictions, and (iii)
    inaccurate realizations of the concepts and their roles as per context; these
    issues render the ontology module to become inconsistent [6]. In this case, it
    is important that the extracted ontology module is semantically consistent. A
    contextualized ontology module deals with a fragment of its original ontology
    model, and provides (i) specific interpretation of its ontology concepts; and
    (ii) implementation details of its procedural knowledge for the problem-context
    at hand.


    In this paper, we explore the problem of ontology module extraction and present
    a structure-based method for extracting contextualized ontology modules using
    N3 rules [4]. Based on the complete inference rules for RDF(S) and OWL in [15],
    we extract an ontology module—that comprises of axioms and assertions for user-selected
    concepts and their structurally connected concepts, roles and individuals—from
    its source ontology. Although our extraction rules can be used by various Semantic
    reasoning engines, we use Euler inference engine [11] to infer interpretations
    beyond ontology-rich ontology model. In this way, we argue that our approach extends
    the semantics of the ontology module compared to the offered by existing ontology
    extraction approaches [10,8,13,9] (see Section 4). We have applied our ontology
    extraction method for the problem of knowledge morphing [2] in the healthcare
    domain, where we extract and merge ontology modules, from three prostate pathway
    ontologies [1], for the context of therapeutic decision support. Furthermore,
    we provide a comparison of our approach with few existing ontology extraction
    approaches.


    ## 2. Structure-based Ontology Module Extraction: Overview and Approaches


    For structure-based module extraction, a source ontology is considered as an un-directed
    graph, and an extracted ontology module is a sub-graph that describes the knowledge
    about the selected concepts for the context [10,13,9,8,14]. One of the initial
    attempts at ontology module extraction is the Materialized Ontology View Extraction
    (MOVE) process [10], where an ontology module is extracted based on the Requirements
    Consistency Optimization Scheme (RCOS) and Semantic Completeness Optimization
    Scheme (SCOS). Given a source ontology, MOVE allows to label both concepts and
    roles as selected or un-selected. For a selected role R, based on RCOS criteria,
    MOVE extracts (i) concept axioms for R; (ii) role assertions for R and the concept
    axioms for concepts that are associated with R; and so on. SCOS is to preserve
    their roles. For a selected concept, based on SCOS criteria (a) super-concepts
    of C must be extracted; (ii) roles of C must be extracted; and (iii) other concepts,
    roles and individuals that are structurally-connected with the user-selected concepts
    must be extracted.


