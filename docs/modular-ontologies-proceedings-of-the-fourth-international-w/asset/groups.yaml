    (SFB/TR 8) at the University of Bremen, Germany. He is a developer of the spatial
    module for the ''Generalized Upper Model'', a linguistic ontology, and works on
    combining formal models of space with spatial language. His research activities
    are focused on modular ontologies of space in different domains and applications
