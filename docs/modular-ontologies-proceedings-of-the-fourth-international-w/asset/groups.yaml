    ## 2.1. 语义增强型复杂事件处理


    我们关于语义事件处理的最初想法描述在 [35,34]。我们提出了一种用于 CEP（复杂事件处理）的声明式知识表示方法，该方法整合了针对事件、过程、状态、动作以及其他随变化的概念的领域和应用特定本体。特定的领域、任务和应用本体需要动态地连接并集成到相应的事件处理应用程序中，这也导致了这些本体的模块化集成方法。捕获特定领域的事件并据此生成复杂反应是一项基础挑战。关于事件类型及其层次结构（即特化、泛化或事件之间或其他形式的关系）的知识是有用的。


    事件知识库代表了复杂的事件数据模型，这些模型链接到现有的语义领域知识（如领域词汇表/本体）和现有领域数据。语义推理用于推断事件之间的关系，例如事件类型及其属性之间的传递性或相等性。可以根据事件的数据属性对事件进行时空推理，例如描述时间量的时间本体。人们可能会定义在超市中，盗窃报警等同于火灾报警。知识表示超越了事件类型及其层次结构，更有趣的是事件与其他非事件概念之间的关系，这些概念指明了更复杂的事件和反应。另一点是，在盗窃报警的情况下，只有参加过特殊安全课程的员工才应该被通知。在这个例子中，我们拥有人员、教育和课程等非事件概念。


    使用事件语义是检测现实世界复杂事件的一种极具前景的方法。关于事件类型及其层次结构（即特化、泛化或事件之间或其他形式的关系）的知识是有用的。事件的语义（元）模型通过将事件数据结合本体和规则（知识库），提高事件处理的质量。事件知识库代表了复杂的事件数据模型，这些模型链接到现有的语义领域知识（如领域词汇表/本体）和现有领域数据。语义推理用于推断事件之间的关系，例如事件类型及其属性之间的传递性或相等性。可以根据事件的数据属性对事件进行时空推理，例如描述时间量的时间本体。我们目前正致力于这种基于知识或语义
    CEP (SCEP) 方法的实现。


    我们的研究旨在开发一种用于 CEP 的知识表示方法，该方法整合了针对事件、过程、状态、动作以及其他随变化的概念的领域和应用特定本体。特定的领域、任务和应用本体需要动态地连接并集成到相应的事件处理应用程序中，这也导致了这些本体的模块化集成方法。捕获特定领域的事件并据此生成复杂反应是一项基础挑战。


    现代声明式规则特别是基于逻辑（形式化）事件表示，结合本体/（业务）词汇表，能够使系统从纯事件处理系统演变为语义丰富的“智能”响应式系统。在本体、逻辑编程、时间逻辑、逻辑、事件/动作逻辑方面进行的工作，使得复杂事件和动作及其语义处理具有更具表达力的表示。智能
    CEP（即 CEP 技术与规则技术 + 本体协同工作）为从从海量事件中高效检测感兴趣的相关情况提供了希望和可能，同时为描述高级逻辑（如业务规则策略和响应式工作流，例如用于敏捷语义业务管理）提供了所需的表达力。


    ## 2.2. SCEP 的用例


    语义事件处理有不同的用例，例如：


    - 业务活动监控 (BAM)

    - 欺诈检测

    - 智能办公室/城市

    - 医疗保健（智能医院）

    - 物流与货物

    - 信息发布

    - 事件驱动自适应系统

    - 供应链管理


    在所有这些情况下，语义 CEP 都能提高事件处理的质量，因为它受益于将事件语义与目标应用领域中其他概念的现有知识相结合。事件处理领域添加逻辑背景知识的收益与数据处理是相同的。


    ## 3. 现有本体的重用


    在过去的二十里，人们对使用本体兴趣日益增加。根据过去几年，这一趋势主要由语义网（Semantic Web）的愿景驱动。本体被定义为与问题相关的、显式的且形式的共享概念化规范，其重要性在于创建它们时进行的深层次问题和领域分析。因为良好的分析可以阐明领域知识的结构
    [6]。但由于分析仅是本体创建过程的一部分，良好的分析是一项非常繁琐且耗时的活动。为了给本体创建过程提供一些结构指导，人们提出了一些工程方法论（例如 Methontology[9]、On-To-Knowledge
    和 NeON）。在大多数方法论中，都推荐重用本体，因为预计通过避免重新构建现有概念模型可以降低工程成本。在降低成本后，从语义网的角度来看，重用本体增加了互操作性，其中本体被视为共享知识
    [3,2]。


    即使这些方法中的大多数也提到了重用现有本体作为可能的起点，但没有一个方法详细描述如何发现和分析候选本体。这非常重要，因为重用本体假设了已存在本体的可用性以及针对特定用例潜在候选者的发现。在这方面，Ontolingua
    上的在线本体和 OntSelect 库是可用的，像 Swoogle¹ 和 Watson² 这样的搜索引擎已经在语义网背景下开发出来。虽然发现潜在本体的问题已基本解决，但在选择合适的本体以及分析发现的本体方面仍然存在问题。


    上层本体（如建议合并本体 SUMO）的想法是为本体模块提供一个共同基础并允许连接不同模块。重用本体本体对于确保不同模块之间的互操作性至关重要。它描述了所有模块所需的通用概念。为了清晰起见，上层本体对于模块之间的关系没有任何说明。它是一个自包含的本体，提供了基础概念的语义模型。其他本体模块导入整个上层本体，并被视为针对特定任务、应用或领域的细化。


    ## 4. 事件本体的相关工作


    本体在 SCEP 中起着关键作用。它们应该是应用领域的概念化，以便于对事件和其他非事件概念进行推理。已经提出了许多用于事件及其关系建模的不同事件本体。Shaw
    R 等人对现有本体进行了比较 [31]，基于其主要组成属性（如类型、时间、空间、分区、因果关系和组合关系）。表 1 列出了表示事件的现有本体。这些本体中的每一个都是为了不同的目的和用例开发的，例如事件本体
    [38]是为了与其他音乐相关的本体一起描述事件。每个事件本体用于描述不同应用领域的事件，如博物馆中的历史事件、数字图书馆、语义事件、基于代理的系统等。它们描述了事件的一些概念以及基于目标应用领域的方面。据我们所知，现有本体专门用于开发和用于复杂事件检测与处理，或用于通用复杂事件处理的概念化。


    现有本体使用不同的本体语言描述，资源描述框架架构 (RDFS) 和不同层级的 Web 本体语言 (OWL)。为了描述事件处理本体，可能会提出具有不同表达能力和局限性的不同本体语言。推理表达能力与推理成本（特别是事件的性能和实时处理）之间的权衡是可以观察到的。本体语言的表达能力水平和对事件的推理应根据语义事件处理的使用来定义。'
