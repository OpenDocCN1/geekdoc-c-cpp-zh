    PC 本体论（PC-H、PC-C 和 PC-W）花费了时间。未来，我们计划优化顺序以改进推理并降低我们提取方法的复杂性。


    ## 3.5. 合并上下文化的本体论


    基于三个上下文化本体论模块（即 PC-H、PC-C 和 PC-W）之间预定义的对应关系（即 C1 的下文），在类之间发现了对齐，包括治疗、随访、频率、间隔持续时间和医生的属性和实例。根据识别出的对齐，C1（即治疗决策支持）上下文公理提取的上下文化模块被合并，以在对齐的
