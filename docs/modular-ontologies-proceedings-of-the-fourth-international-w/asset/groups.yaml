    ## 5.2. Analysis of MLD


    MLD is an indirect measure of the most number of strong and moderate dependencies
    that can exist between local symbols in an ontology module in the best case. The
    entities MLD capture their characteristics are ontology modules. For MLD, attribute
    is the most number of strong and moderate dependencies between local symbols,
    unit is a component that is defined based on the number of local symbols of ontology
    modules according to defined Definition 7 and scale type is interval.


    - * attribute validity: Ontology modules represent a set of local and external
    symbols that can have strong and moderate dependencies on each other. Observably,
    the entity (ontology module) possesses the attribute (the most number of strong
    and moderate local dependencies).


