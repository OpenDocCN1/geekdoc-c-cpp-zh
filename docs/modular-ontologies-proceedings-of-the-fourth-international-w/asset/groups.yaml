    of Computer Science, Dalhousie University. He is doing his PhD in the area of
    Extracting and Merging Contextualised Modular Ontologies under the supervision
    of Raza Abidi. His research interests include (i) Ontology Modularisation, (ii)
    Ontology Reconciliation of Merging, and (iii) Ontology Debugging. He is involved
    in a number of research projects at NICHE and acknowledged as a developer in the
    developers team of the Euler reasoning engine.


