    to a different $\perp$-module, which contains the axiom $C_i \subseteq B$ if if
    $C_i$ is in this set. For $T_n$, $\perp$ and dCE-based modules, we can add $B$
    to each of these subsets and argue in the same way. This example taxonomy has
