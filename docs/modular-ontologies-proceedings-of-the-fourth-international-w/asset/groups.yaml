    # 本体论模块化、信息流与交互情境语义


    扩展摘要


    Marco SCHORLEMMER a,1


    ^1 人工智能研究学院 (IIIA), CSIC, 西班牙


    ## 软件与知识工程中的模块化


    最初，软件应用程序、数据库和专家系统是由少数软件或知识工程师设计和构建的，他们对 IT 产品的整个生命周期有整体控制权。这种时代已经过去很久了，因为软件和知识工程的实践已从实现定制的立立系统转向基于组件的工程；数据库逐渐部署在分布式架构中并随后进行联邦化；知识系统通过重用更多且之前构建的知识库和推理引擎来构建。此外，IT
    系统的分布式性质随着互联网的到来和普及普及经历了剧性的爆炸。万维网及其雄心勃勃的扩展——语义网，带来了以超文本文档、在线数据库、开源代码、术语库、Web 服务、博客等形式存在的、前所未有的全球性信息分发，这不断挑战着
    IT 在我们社会中的传统角色。


    因此，模块化已成为任何大规模工程任务的必要条件。但是，尽管模块化在软件和知识工程中得到了充分研究，但在 Web 分布层面上 IT 组件的组合和交互仍处于起步阶段，我们刚刚开始掌握这一努力的范围：超越基本语法通信的成功
    IT 互操作性非常困难，而且我们这个时代围绕所有 IT 技术演进的基础商品——信息，尚未被很好地理解。理解问题的焦点在于我们如何需要揭示、暴露和通信信息的语义方面。到目前，基于组件的软件工程是一项困难的任务，仍处于计算机科学的前沿；将不同的数据库结合被证明仅在强假设的封闭环境中是成功的；分布式人工智能应用和系统交互也是如此。当我们停留在语法问题上时，实现互操作性相对容易。但当我们尝试处理信息的语义方面，寻求语义网上可用信息的“智能”管理时，互操作性就不是一项容易的任务。


    ## 本体论与语义网


    语义网在世纪末被构想为一种“充分发挥万维网潜力”[12] 的方法，作为 Web 的扩展，“其中信息被赋予了定义的含义，使计算机和人类能够更好地协作”[7]。在这项工作中，注定发挥关键作用的基础组件之一是本体论：定义术语词以及术语之间关系的文档或文件。


    根据这一愿景，万维网联盟 (W3C) 的活动围绕着使用逻辑表示形式对 Web 数据进行结构化的建议展开，这些形式为执行推理和得出这些数据的结论提供了定义的模型论语义。语义网的支持者明确表示，“计算机并没有真正‘理解’这些任何信息，但它将以对人类用户有用且意义的方式更有效地操纵这些术语。”[7]


    这种对 Web 协作的观点将通过本体论获得的“定义的含义”视为成功交互的前提。通过采取这种立场


    ## 分布式推理


    从本体论等立立知识组件转向分布式模块化产物时，推理是在每个模块或语境中本地执行的。这种分布式推理的关键在于知道在在一个语境下进行的推理何时可以安全地扩展到其他模块的语境，因为这允许将各种本体论模块组合并集成到分布式系统中。这种分布式推理导致了逻辑的通用概念，它是任何语义对齐或本体模块化的核心。在过去的十年中出现了许多将逻辑后果扩展到分布式环境的不同建议。与本体模块化相关的示例包括本地模型语义和多语境系统
    [13]、一阶逻辑和描述逻辑 [14,8]、E-connections [22] 以及基于包的描述逻辑 [4]。


