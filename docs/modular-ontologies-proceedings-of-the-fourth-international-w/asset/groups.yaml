    # 90 K. Teymrian / 用于语义复杂事件处理的模块化上层本体论


    （有效性区间）。它们可以重复，且其有效性区间可能连续。情境描述的类型基于情境个体之间的差异（个体的分类），并基于情境时间结构上的差异（单调性、同质性）。此外，还提出了不同的情境本体论⁶


    代理、动作与过程模块：提出了动作本体论⁷用于表示关于动作的知识，这些本体论可以泛化为上层动作本体论模块。


    提出了几种代理本体论，如 [21] 或多智能体系统领域的 [37]，用以概念化代理的行为。代理可以被视为一个执行者（actor），类似于 [14] 的执行者本体论也并行存在。执行者可以是人类也可以是机器。


    在业务过程管理领域提出了如 COBRA [28] 等过程本体论，它们包含了其他时间或事件本体论。在语义网服务和业务过程执行领域可以找到其他过程本体论 [25]。基于这些现有的本体论构建一个用于过程描述的上层本体论。


    # 7. 重用 CEP 本体论模块


    重用性是将复杂系统分解为模块的主要优势之一，因此也是模块化本体论的关键论点。与其为每个用例单独创建特定的本体论，以灵活方式重用模块的能力非常重要。这种假设承认了模块以及它们如何被连接和协同使用。以往关于本体论合并、匹配和对齐的研究表明，在不需要人工干预的情况下自动完成这些工作的技术是不现实的。特别是当存在基于不同语言、设计模式、粒度等的异构模块时。事实上，在需要时知道如何连接模块是必要的。出于这个原因，我们主张需要一种本体论来描述这些模块之间如何相互链接。为了避免误解，需要强调的是，桥接本体论（bridge
    ontology）并不是另一个上层本体论。它更像是一种元信息，描述如何组合不同的本体论模块。


    为了使用上述上层 CEP 本体论模块，我们开发了如图 2 所示的连接器本体论。该本体论是连接已开发模块的桥接本体论。根据案例需求，针对不同的模块组合开发多种桥接本体论。例如，在业务活动监控（BAM）中，只有事件、时间和过程模块可能是有用的，而像空间模块这样的其他模块则不应导入。


    # 8. 讨论与展望


    我们展示了关于开发复杂事件处理上层本体论模块的工作，这些模块被用于不同的用例。研究了一些现有的本体论，以发现它们的共同部分以构建轻量级本体论模块。


    > ⁶情境本体论如 http://www.loa-cnr.it/ontologies/ExtendedDns.owl

    > ⁷动作本体论如 http://ontology.hmc.edu/C-Map/Action.html


    # CEP 桥接本体论


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_110_0.png)


    图 2. 事件处理桥接本体论


    我们描述了围绕事件概念发现本体论模块的语义方法，并利用新闻式问题寻找事件的事实方面。每个模块的主要概念也以简短的形式描述。


    未来，我们将在选定的用例中对这些模块进行使用测试，以研究它们的可靠性。我们将利用这些使用测试来评估本体论模块并提高其实现的的质量。


    # 9. 致谢


    本工作部分由德国联邦教育与研究部（BMBF）资助的“InnoProfile-企业语义网”项目以及 BMBF 的新德国联邦州-创业地区创新计划提供支持。


