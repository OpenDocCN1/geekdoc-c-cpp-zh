    to a different $\perp$-module, which contains the axiom $C_i \subseteq B$ if $C_i$
    is in this set. For $T_n$, $\perp$ and dCE-based modules, we can add $B$ to each
    of these subsets and argue in the same way. This example taxonomy has only linearly
    many generic modules—all $\{C_i \subseteq B\}$. However, if we add the axiom $B
    \subseteq A$ to $T_n$, we obtain an ontology having an exponential number of generic
    modules. Every module $M_J := \mathcal{M}(T, A\Sigma_J)$ is generic, where $J$
    is a multi-index in the set $\{1, \dots, n\}$ and $\Sigma_J$ is the set of concepts
    with indexes belonging to $J$. A relaxation of the generic definition does not
    help because we can replace the axiom $B \subseteq A$ with a longer chain or even
    more complex inclusion structure.


    Other paths lead to exponentially many generic modules include atomic disjointness
    axioms involving simple existential restrictions and conjunctions. For example,
    the taxonomy family $T_n = T_0 \cup \{D_i \subseteq C_i \mid 1 \le i \le n\}$,
    where each $T_i^n$ has only $n+1$ generic modules, each nonempty subset of the
    $n$ paths in the inclusion hierarchy includes thus the most specific module. As
    we add axioms $\{C_i, \neg C_j \mid 1 \le i < j \le n\}$ or $\{C_i \sqsubseteq
