- md: "\n# 76 Randelli and D. Nardi / Introducing Ontology Best Practices and Design\
    \ Patterns into Robotics\n\nA preliminary version of USAREnv has been designed\
    \ as a monolithic ontology, but it has been subsequently divided into four modules.\
    \ The extraction process is based on the module extraction algorithm proposed\
    \ by Doran et al. [9]. USAREnv modules are the following:\n\n- sites.owl, which\
    \ describes rescue sites, their overall conditions (e.g. weather, location, and\
    \ so on), and divides them into areas, with specific area conditions, which can\
    \ be further extended;\n- landmarks.owl, that is a collection of objects, as well\
    \ as their attributes, that are relevant to identify during rescue missions, in\
    \ order to improve robot localization, to detect dangerous conditions, to acquire\
    \ a semantic map of the environment, to provide natural feedback to operators;\n\
    - people.owl contains a human body description in terms of body parts that can\
    \ be detected by robots through computer vision and machine learning techniques;\n\
    - spatial.owl, which includes spatial relations between adjacent areas, as well\
    \ as accessibility from one area to another.\n\nUSAREnv imports DOLCE+Dns OWL\
    \ (DUL)², which is the combination and simplification of DOLCE Lite-Purpose Libraries\
    \ and Descriptions (DnS) on ontology. We decided to import the whole ontology,\
    \ instead of copying and pasting only the relevant fragments, because it is lightweight\
    \ and sufficiently scalable, and we consider this as a trade-off with the impossibility\
    \ in OWL to partially import ontologies. Even more, DUL has almost the same expressivity\
    \ of DOLCE+Dns.\n\nWe designed USAREnv itself as a module of a higher-level robotic\
    \ ontology. In fact, it only deals with unstructured environments, from a strictly\
    \ robotic and rescue perspective. However, it could be easily considered a module\
    \ and integrated in different composite ontologies. For example, as already stated\
    \ in Section 2, the robot deployment requires the matching of the available robotic\
    \ platforms with the environment conditions. Here, USAREnv should be coupled with\
    \ a robotic ontology describing structures and equipment. Furthermore, it could\
    \ be integrated with ontologies for structured environments, to provide a comprehensive\
    \ ontology for robots.\n\n## 4.3 The role of ontology design patterns\n\nApplying\
    \ “n-ary relations” LP. OWL supports only binary relationships (in OWL they are\
    \ called properties). Nevertheless, in many scenarios it is common to deal with\
    \ relations that link more than two individuals. The W3C Ontology Engineering\
    \ Task Force (OEF) defined the n-ary relations design pattern to extend OWL and\
    \ overcome this limitation [8]. Being a logical pattern, it is language dependent,\
    \ but context-independent, hence there is no implementation that can be imported\
    \ and reused. In USAREnv this pattern is useful to model the adjacency concern-\n\
    \n![](img/aab54b0915908cfe20ac887a02d4e_96.png)\nFigure 2. Example of adjacent\
    \ areas. An area (A) can be adjacent to multiple areas on the same side, and an\
    \ area (C) can be adjacent to another area from different sides (see Figure 2).\
    \ In particular, our competency questions are the following:\n\n1. an area is\
    \ identified by six sides (top, bottom, left, right, front, back);\n2. an area\
    \ can be adjacent to different areas on the same side;\n3. an area can be adjacent\
    \ to the same area on different sides;\n4. given an area, any adjacent area can\
    \ or cannot be accessible from the one.\n\nThese competency questions address\
    \ a relation between four individuals: a source area, a destination area, an adjacency\
    \ side, and an accessibility condition (see Figure 3).\n\n![](img/aab54b0915908cfe20ac887a02d4e_96.png)\n\
    Figure 3. Entity-relationship diagram about the problem of area adjacency. The\
    \ Crow’s foot notation shows how an area can have multiple adjacent areas on the\
    \ same side. On the converse, every adjacent area can be adjacent to another area\
    \ on multiple sides. Theary relations design pattern models this problem through\
    \ reification, that is representing the relation with a class, whose individuals\
    \ are instances of the relation itself. Properties provide binary links to each\
    \ argument of the relation.\n\nUSAREnv solves issues through ontology design patterns:\n\
    \n- people and their body parts (PartOf ODP);\n- areas, adjacent areas, adjacency\
    \ sites, and area accessibility (N-ary relations ODP);\n- survivor detection,\
    \ detected body parts, detection time (Observation ODP).\n\nWe report two cases:\
    \ the application of a logical DP (LP) and a content DP (CP). Applying the pattern\
    \ to our case, the relation Adjacent becomes the class isAdjacentRelation, while\
    \ the four individuals belong to three classes and one datatype, and are related\
    \ to isAdjacentRelation by four functional properties (see Figure 4).\n\n![](img/aab54b0915908cfe20ac887a02d4e_97.png)\n\
    \nApplying observation CP. As opposed to logical patterns, CPs are language independent\
    \ (since they do not affect any language constraint), but content dependent. A\
    \ consequence, CPs are standalone ontology fragments, defined by Gangemi and available\
    \ on the OntologyDesignPatterns.org project, deals with the following competency\
    \ questions:\n\n- What objects have been observed?\n- What are the parameters\
    \ under which this object was observed?\n- When an object has been observed?\n\
    \nUSAREnv has a fundamental observation activity: victim detection. Our competency\
    \ questions are the following:\n\n- What survivors have been detected?\n- What\
    \ parts of a specific survivor have been detected?\n- When a given person/body\
    \ part has been detected?\n\nIn our case, the pattern domain has a broader matching\
    \ than the problem domain, as the observation CP competency questions are more\
    \ generic. Hence, applying this CP implies to import and specialize it, as described\
    \ by Gangemi [11]. The observation class is specialized in VictimDetection, while\
    \ HumanBody specializes Parameter. The involved classes are given in Figure 5.\n\
    \n![](img/aab54b0915908cfe20ac887a02d4e_98.png)\nFigure 5. Participating classes\
    \ in the observation CP.\n\n## 5. Conclusions and further work\n\nIn this paper,\
    \ we introduced the use of ontology design patterns and best practices into our\
    \ rescue robotics project, through the design of an ontology for a robotic application\
    \ field: urban search and rescue. In fact, USAREnv describes unstructured environments,\
    \ to improve human-robot interaction awareness during US missions.\n\nThe adopted\
    \ representation formalism, OWL, fosters ontology reuse and sharing. This is relevant\
    \ to both developers, who can extend and modify the ontology, and end users. In\
    \ fact, USAREnv can be shared among different users: rescue personnel, robots,\
    \ hardware devices in smart or symbolic environments. Best practices lower the\
    \ modelling effort; furthermore, they produce high-quality artifacts that allow\
    \ to reuse and share specific modules of the ontology.\n\nUSAREnv is still at\
    \ a preliminary stage. Keeping in mind the advantage of ontology reuse, in particular\
    \ general ontologies, our future work is to model spatial relationships importing\
    \ USAREnv fragments of upper-level ontologies that cover this aspect: for example,\
    \ DOLCE or BFO. Furthermore, we aim at exposing patterns of USAREnv as standalone\
    \ content ontology design patterns, in order to motivate the robotic and rescue\
    \ community to reuse them. Our aim is to integrate USAREnv into our robot interface\
    \ for rescue activities and to evaluate its effectiveness through intensive experiments,\
    \ for example during RoboCup competitions.\n\n References\n\n[1] ARANGUEN, M.\
    \ E., ANTEZA, E., KUIPER, M., and STEVENS, R. Ontology design patterns for bio-ontologies:\
    \ a case study on the cell cycle ontology. BMC Bioinformatics 9, Suppl 5 (2008),\
    \ S1.\n[2] BLOOMIST, E., GAMGEMI, A., and PRESUTTI, V. Experiments on pattern-based\
    \ ontology design. In K-CAP 2009 (2009), ACM.\n[3] BLOOMIST, E., and SANDUKHL,\
    \ K. Patterns in ontology engineering: Classification of ontology patterns. In\
    \ *Proc. of ICEIS 2005*.\n"
  mdcn: "\n\n# 76 Randelli 和 D. Nardi / 将本体最佳实践与设计模式引入机器人领域\n\nUSAREnv 的初步版本被设计为一个单体式本体，但随后它被划分为四个模块。其提取过程基于\
    \ Doran 等人 [9] 提出的模块提取算法。USAREnv 模块如下：\n\n- sites.owl：描述救援现场、其整体状况（例如天气、位置等），并将其划分为不同的区域，附带特定的区域条件，这些区域可以被进一步扩展；\n\
    - landmarks.owl：是一个对象集合以及它们的属性，这些属性在救援任务中对于识别至关重要，旨在改进机器人定位、检测危险状况、获取环境的语义地图，并为操作员提供自然反馈；\n\
    - people.owl：包含了从人体部位角度描述的人体描述，这些部位可以通过计算机视觉和机器学习技术被机器人检测；\n- spatial.owl：包含了相邻区域之间的空间关系，以及从一个区域到另一个区域的通达性。\n\
    \nUSAREnv 导入了 DOLCE+Dns OWL (DUL)²，它是 DOLCE Lite-Purpose 库与描述 (DnS) 在本体论上的结合与简化。我们决定导入整个本体，而不是仅复制粘贴相关的片段，因为它是轻量级且具有足够的扩展性，我们认为这是一种由于\
    \ OWL 无法部分导入本体的局限性而权衡。此外，DUL 具有与 DOLCE+Dns 几乎相同的表达能力。\n\n我们将 USAREnv 本身设计为更高级别机器人本体的一个模块。事实上，从严格的机器人和救援角度来看，它只处理非结构化环境。然而，它可以很容易被视为一个模块并集成到不同的复合本体中。例如，如第2\
    \ 节所述，机器人部署需要将可用机器人平台与环境条件进行匹配。在这里，USAREnv 需要与描述结构和设备的机器人本体耦合。此外，它还可以与结构化环境的本体集成，为机器人提供一个全面的本体。\n\
    \n## 4.3 本体设计模式的作用\n\n应用“n 元关系”逻辑模式（LP）。OWL 只支持二元关系（在 OWL 中被称为属性）。尽管如此，在许多场景中，处理连接两个以上个体的关系是十分常见的。W3C\
    \ 本体工程工作组 (OEF) 定义了 n 元关系设计模式，以扩展 OWL 并克服这一局限性 [8]。作为一种逻辑模式，它是依赖语言的，但与上下文无关，因此没有可以被导入和复用的实现方案。在\
    \ USAREnv 中，这种模式对于建模相邻性非常有用——\n\n![](img/aab54b0915908cfe20ac887a02d4e_96.png)\n\
    图 2。相邻区域的示例。一个区域 (A) 可以与同一侧的多个区域相邻，一个区域 (C) 可以从不同侧与另一个区域相邻（见图 2）。特别是，我们的胜任力问题如下：\n\
    \n1. 一个区域由六个面（顶、底、左、右、前、后）识别；\n2. 一个区域可以与同一侧的不同区域相邻；\n3. 一个区域可以从不同侧与同一个区域相邻；\n\
    4. 给定一个区域，任何相邻区域可以或不可以从该区域可通达。\n\n这些胜任力问题涉及四个个体体之间的关系：源区域、目标区域、相邻侧面和通达性条件（见图 3）。\n\
    \n![](img/aab54b0915908cfe20ac887a02d4e_96.png)\n图 3. 关于区域相邻问题的实体关系图。乌鸦足符号显示了一个区域同一侧如何具有多个相邻区域。相反，每个相邻区域都可以从多个侧与另一个区域相邻。n\
    \ 元关系设计模式通过具象化（reification）对这个问题进行建模，即用一个类来表示关系，该类的个体是关系本身的实例。属性为关系的每个参数提供了二元链接。\n\
    \nUSAREnv 通过本体设计模式解决问题：\n\n- 人类及其身体部位（PartOf ODP）；\n- 区域、相邻区域、相邻位点和区域通达性（N 元关系\
    \ ODP）；\n- 幸存者检测、被检测的身体部位、检测时间（Observation ODP）。\n\n我们报告了两个案例：逻辑 DP (LP) 和内容 DP\
    \ (CP) 的应用。将模式应用到我们的案例中，关系 Adjacent 变为类 isAdjacentRelation，而这四个个体属于三个类和一个数据类型，并通过四个功能性属性与\
    \ isAdjacentRelation 相关联（见图 4）。\n\n![](img/aab54b0915908cfe20ac887a02d4e_97.png)\n\
    \n应用观测 CP。与逻辑模式相反，CP 是语言无关的（因为它们不影响任何语言限制），但依赖于内容。因此，CP 是由 Gangemi 定义并在 OntologyDesignPatterns.org\
    \ 项目上提供的独立本体片段，它们处理以下胜任力问题：\n\n- 观察到了哪些对象？\n- 在什么参数下观察到了该对象？\n- 何时观察到了某个对象？\n\n\
    USAREnv 有一项基础的观测活动：幸存者检测。我们的胜任力问题如下：\n\n- 检测到了哪些幸存者？\n- 检测到了特定幸存者的哪些部分？\n- 何时检测到了给定的人/身体部位？\n\
    \n在我们的案例中，模式领域比问题领域具有更广泛的匹配，因为观测 CP 的胜任力问题更加通用。因此，应用此 CP 意味着像 Gangemi [11] 描述那样对其导入并专门化。Observation\
    \ 类被专门化为 Victim，而 HumanBody 专门化 Parameter。涉及的类见图 5。\n\n![](img/aab54b0915908cfe20ac887a02d4e_98.png)\n\
    图 5。观测 CP 中的参与类。\n\n## 5 结论与后续工作\n\n在本文中，我们通过为机器人搜索与救援应用领域设计本体，将本体设计模式和最佳实践引入到我们的救援机器人项目中。事实上，USAREnv\
    \ 描述了非结构化环境，以提高救援任务期间的人机交互感知。\n\n采用的表示形式 OWL 促进了本体的复用和共享。这对于可以扩展和修改本体的开发者以及终端用户都是相关的。事实上，USAREnv可以在不同用户之间共享：救援人员、机器人、智能或符号环境中的硬件设备。最佳实践减少了建模工作；此外，它们产生的高质量制品允许复用特定的本体模块。\n\
    \nUSAREnv 仍处于初步阶段。考虑到本体复用的优势，特别是通用本体，我们未来的工作是通过导入上层本体的片段来建模空间关系：例如 DOLCE 或 BFO。此外，我们的目标是将\
    \ USAREnv 的模式作为独立的内容本体设计模式开放，以便机器人和救援社区复用它们。我们的目标是将 USAREnv 集成到我们的机器人界面中，并通过密集实验（例如在\
    \ RoboCup 比赛期间）评估其有效性。\n\n References\n\n[1] ARANGUEN, M. E., ANTEZA, E., KUIPER,\
    \ M., and STEVENS, R. Ontology design patterns for bio-ontologies: a case study\
    \ on the cell cycle ontology. BMC Bioinformatics 9, Suppl 5 (2008), S1.\n[2] BLOOMIST,\
    \ E., GAMGEMI, A., and PRESUTTI, V. Experiments on pattern-based ontology design.\
    \ In K-CAP 2009 (2009), ACM.\n[3] BLOOMIST, E., and SANDUKHL, K. Patterns in ontology\
    \ engineering: Classification of ontology patterns. In *Proc. of ICEIS 2005*.\n\
    \n"
