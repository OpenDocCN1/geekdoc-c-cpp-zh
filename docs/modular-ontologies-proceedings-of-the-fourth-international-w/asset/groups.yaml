    module based on the competency of the modules are collected. We tried to keep
    the modules very simple and lightweight, because of the reasons of reducing their
    complexity and increasing the reusability. From the existing relevant ontologies
    the most important and relevant concepts and attributes are extracted for each
    ontology module. For example the agent ontology module the existing actor or agent
    ontologies are used to extract the concepts and assertions.


    +   * Step-Five: Design of module linking and importing: We tried to define the
    future potential interfaces of ontology modules so that they have minimum connectivity
    to each others, i.e. they can be connected from only one or two concepts to each
    other. A connecting ontology should use these minimum connection points to import
    the modules for building an ontology and extend it based on use requirements.
    This can increase the understandability and the chance of reuse of ontology modules.


    We identified the following ontology modules which can be defined in form of upper-level
    modules for the area of semantic event processing:


    **Event Ontology**: An event ontology module should contain the highest concepts
    about the events like type. The event type can be utilized to connect the knowledge
    about the event type to the happened event instance. The subclasses of event type
    can specialize the event and represent the answer of the question “What happened?”.
    The event can have several subclasses in a isa hierarchy.


    **Time Ontology**: Time is the most important attribute of events. In some of
    the application domains only the stamp of the event capturing is considered, in
    others the start and end of time event, a time interval (time window), or in some
    the duration of event. Different time ontologies [17], [40], [39] are proposed.
    A upper-level ontology module should contain only the main concepts and common
    part of these ontologies which can be meaningful and reasonable.


    **Spatial Ontology Module**: Also different spatial ontologies like place Ontologies
    [18], geo information⁵ or place ontologies for the Semantic Web [1],[20] are proposed.
    From some of the existing geo ontologies are proposed to be used in Geographic
    Information Systems (GIS) which can improve the quality of this system by adding
    geo or geospatial information, e.g. for increasing the interoperability between
    different geo systems.


    The geo ontologies describe the two dimension view of place, in a space ontology
    this conceptualization can be extended to a three dimension view. Space ontologies
    are also proposed for the description of a place in 3D format.


    **Situation Ontology Module**: We distinguish between situations and complex events.
    Situ situation is initiated or terminated by one or more (complex) events, i.e.
    complex event+ holds a validity interval. In our ontology, situations are discrete
    situation-individuals. They have a fixed context such as time allocation (date),
    location, participant, etc. They are not repeatable and temporally connected.
    Situation-descriptions contain content and temporal properties to situation-individuals.
    They describe the dating of situation by mapping into the time. Situation-descriptions
    connect situation type with validity intervals. Situations are defined with time
    argument. They might have several time alloca-


