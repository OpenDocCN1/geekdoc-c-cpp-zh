    # 贡献概述


    WoMO 2010 的受邀演讲者探讨了与本体模块化（modularity）相关的通用且有些不常规的问题。


    SIMON COLTON 在其演讲《面向计算创造力集体的本体使用、重用与滥用》中，描述了计算创造力（Computational Creativity）项目，特别是了将自动化构建和类比推理等技术用于本体工程的可能性，以及本体模块化将如何通过集体进行更具创造性的推理并在其中发挥作用。


    在题为《本体模块化、信息流与交互情境化语义》的第二场受邀演讲中，MARCO SCHORLEMMER 勾勒了模块化的图景，并讨论了由 Jon Barwise
    和 Jerry Seligman 引入的通道理论与信息流在本体模块化和意义协商方面的作用，这是一个有趣的话题。


    WoMO 2010 的贡献论文涵盖了广泛的主题，从数学基础到对模块化的实证评估、模块的提取与合并，以及在复杂事件处理和机器人等领域的应用。


    DEL VESCO、PARSIA、SATTLER 和 SCHNEIDER 的论文《本体的模块化结构：一项实证研究》，基于基于局部性的模块（locality-based
    modules）的概念，对该问题以及提取真实本体所有模块的可行性进行了实证分析。他们特别讨论了通过这种方式揭示本体结构在多大程度上允许获取其主题性、连接性、结构、冗余部分或实际建模与预期建模之间一致性的信息。


    HUSSAIN ABIDI 在《提取与合并情境化本体模块》中介绍了一种提取本体模块的方法。该提取基于用户定义的选择，该选择指出了本体中与模块提取相关的部分和构造。该方法特别适用于医疗保健领域。


    在《评估模块化本体内聚性与耦合性的指标套件》中，ENSAN 和 DU 为模块化本体的评估问题提供了另一个视角。他们引入了用于衡量本体内聚性（cohesion）和耦合性（coupling）的语义指标。这些指标的计算基于对局部符号与模块的局部符号及外部符号之间关系/相关性（relativeness）和依赖关系的分析。特别是作者使用了“Kitchenham”指标验证框架来检查他们提出的指标。


    POKRYWCZYNSKI 和 MALCOL 延续了在工程中使用机构（institutions）抽象框架的传统。在《利用机构走向模块化本体的功能化方法》中，他们提出了一种通用的框架概念，无论使用何种形式，该框架都允许将本体语言和查询语言翻译成一种全局语言。然后他们泛化了异构情况下的稳健性（robustness）和保守性（conservativity）概念及其对模块化的作用。


    在《将本体最佳实践和设计模式引入机器人技术：USARE》中，RANDELLI 和 NARDI 展示了一种用于城市搜索与救援活动背景下非结构化环境的本体。其他信息外，该本体规定了灾害案例、站点类型和位置。作者进一步分析了本体设计模式的使用以及现有本体的重用，以提供敏捷实现并集成到不同的语境中。


    复杂事件处理领域的本体开发可以特别受益于模块化，正如 TYMOURIAN 和 PASCHKE 在《用于语义复杂事件处理的模块化上层本体》中所述的。他们区分了复杂事件的不同特征和依赖关系，并引入了几个层级本体模块来分别指定这些特征。这些上层本体模块可以为开发单个事件本体提供指南。


    # 本卷贡献者


    RAZA ABIDI 是达尔豪斯大学（Dalhousie University）计算机学院计算机科学教授兼健康信息学主任。他的研究专注于语义网、Web 服务以及用于临床决策支持的医疗保健知识管理。他领导
    NICHE 研究小组，小组由 20 名跨学科研究人员组成。他已发表 150 多篇研究论文，指导了 50 多名研究生。


    http://www.cs.dal.ca/~sraza

    sraza@cs.dal.ca


    JIE BAO 是伦斯理工学院（Rensselaer Polytechnic Institute）Tless World Constellation 的研究员。他撰写了
    100 多篇文章。


    http://www.cs.dal.ca/~sraza

    sraza@cs.dal.ca


    （注：此处原文邮箱与链接似乎有重复错误，翻译时保持原样）


    http://www.cs.dal.ca/~sraza

    sraza@cs.dal.ca


    SIMON COLTON 是伦敦帝国理工学院（Imperial College）计算系的高级讲师。他领导计算创造力（Computational Creativity）小组，http://www.imperial.ac.uk/~cc


    GÖKHAN COSKUN 是德国柏林自由大学（Freie Universität Berlin）语义网小组的研究助理。他的研究兴趣包括本体的网络结构。


    http://gokhan.coskun.org

    coskun@inf.fu-berlin


    BERNANDO CUENCA GRAU 是牛津大学（University Oxford）的皇家学会研究员。他目前的研究活动专注于支持本体工程关键任务的新推理，如本体合并、设计和维护。他参与了
    Web 本体语言（OWL）2扩展的设计。他在 IJCAI、KR 和 WWW 等主要会议上发表了许多关于本体逻辑基础和模块提取的论文。


    http://web.comlab.ox.uk/people/Bernardo.CuencaGrau

    berg@comlab.ox.uk


    WEANG DU 是加拿大新布兰瑞克大学计算机学院教授。他在1991年在维多利亚大学获得计算机科学博士。他的研究兴趣包括语义网、知识工程、软件工程、编程语言、互联网计算和移动计算。


    http://www.cs.unb.ca/~wdu

    wdu@unb.ca


    FAZEEH ENSAN 于 2006 年 5 月加入加拿大新布兰瑞克大学计算机学院成为博士生。在加入之前，她在马什哈德费尔多斯基大学（Ferdoski University
    of Mashhad）完成了两年硕士学位，此前她在特黑兰大学工程学院获得计算机工程学士学位。她的研究专注于知识工程的方面。语义网、本体开发、模态和信念缓解。


    http://v37s3b4h7dn47s37hg1br4h7rs7n3du7s8nu.unbf.ca/~m4742/

    faezeh.ensan@unb.ca


