    # Extracting and Merging Contextualized Ontology Modules


    Sajjad HUSSAIN 1 and Syed Bibte Raza ABIDI


    NICHE Research Group, Faculty of Computer Science, Dominion University, Canada


    Abstract. Ontology module extraction, from a large ontology, leads to the generation
    of a specialized knowledge module that is pertinent to specific problems. Extending
    ontology module extraction methods tends to either render a too generalized or
    a restricted ontology module or at times does not capture the entire semantics
    of the source ontology. We present an ontology module extraction method that extracts
    an extracted ontology module while extending the semantics of the concepts and
    their relationships in the ontology module. Our approach features the following
    tenets (i) identifying the user-selected concepts that are pertinent for the problem-context
    at hand; (ii) extracting the user-selected concepts, roles and their individuals;
    and (iii) extracting other concepts, roles and individuals that are structurally-connected
    with the user-selected concepts. We apply our ontology module extraction method
    in the Healthcare domain, and demonstrate (a) extraction of ontology modules from
    three prostate cancer pathway ontologies; and (b) merging of extracted ontology
    modules to generate a comprehensive therapeutic work-flow knowledge for prostate
    cancer care management.


    Keywords. Ontology Modularization, Ontology Reconciliation and Merging


    ## 1. Introduction


    Ontologies [3] serve as the backbone for the Semantic Web as they provide formal
    structure to model a domain along shared concepts and their relationships. A key
    aspect of Semantic Web research is knowledge modeling that is pursued by developing
    a domain-specific ontology. The ontology, then, serves as the foundational representation
    for a variety of activities, such as web-based information sharing, retrieval,
    mediation, elaboration, and decision support. Knowledge modelers, or ontology
    engineers, develop ontologies in a variety of ways—i.e. developing a new ontology
    by abstracting domain concepts and relations, adding new concepts to an existing
    ontology or aligning/merging multiple ontologies to realize a specialized ontology.


    For mature domains—such as medicine, genetics and business—the common practice
