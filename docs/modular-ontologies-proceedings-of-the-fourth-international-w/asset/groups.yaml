    # Ontologies and the Semantic Web


    The Semantic Web was envisioned, at the turn of the century, as a way of “bringing
    the World Wide Web to its full potential” [12], as an extension of the Web “in
    which information is given well-defined meaning, better enabling computers and
    people to work in cooperation” [7]. One of the basic components destined to play
    a crucial role in this effort were ontologies: documents or files that formally
    define vocabularies of terms and the relations among these terms.


    According to this vision, the activity of the World Wide Web Consortium (W3C)
    centred around the specification of recommendations for structuring the data on
    the web using logic-based representation formalisms that would provide a well-defined
    model-theoretic semantics for carrying out inferences and drawing conclusions
    about these data. The proponents of Semantic Web made clear that “the computer
    does not truly ‘understand’ any of this information, but that it will be to ‘manipulate
    the terms much more effectively in ways that are useful and meaningful to the
    human user.” [7]


    This view of cooperation on the Web takes “well-defined meaning” by means of ontologies
    as a prerequisite for successful interaction. By adopting this stance


    # Distributed Reasoning


    When moving form stand-alone knowledge components such as ontologies to distributed
    modular artifacts reasoning is performed locally on each module or context. Essential
    for this sort of distributed reasoning is to know when inferences carried out
    in the context of one module safely be passed over to the contexts of other modules,
    as this allows for the combination and integration of various ontology modules
    into a distributed system. Such distributed reasoning leads to a generalised notion
    of logical consequence that lies at the heart of any semantic alignment or ontology
    modularisation. In the last decade have been many different proposals to extend
    logical consequence to a distributed setting. Some examples that have been relevant
    for ontology modularity have been local model semantic and multi-context systems
    [13], first-order and description logics [14,8], E-connections [22], package-based
    description logics [4],'
