    # Modular Ontologies


    Preface


    Oliver Kutz, Joana Hois, Jie Bao, Bernardo Cuenca Grau


    Modularity is a central theme in ontology engineering. The ability to decompose
    ontologies into smaller, manageable modules can improve reusability, maintenance,
    and scalability. However, the challenges of defining modular boundaries, ensuring
    consistency across modules, and managing dependencies remain significant.


    This workshop presents recent research on various aspects of modular ontologies.
    It covers theoretical foundations, algorithmic approaches, and practical applications.
    The goal is to bring together researchers to discuss the current state-of-the-art
    and identify future directions for the field.


    The topics covered by WoMO include, but are not limited to:


    ## What is Modularity?


    - kinds of modules and their properties

    - modules vs. contexts

    - granularity of representation


    ## Logical/Foundational Studies:


    - robustness properties such as conservativity

    - modular languages (e.g., DDL, E-DL)

    - reconciling inconsistencies across modules

    - formal structuring


    ## Algorithmic Approaches:


    - distributed reasoning

    - modularization and module extraction

    - sharing and reusing, linking and importing

    - evaluation of modularization

    - complexity of reasoning


    ## Application Areas:


    - modularity in the Semantic Web

    - Life Sciences, Ambient Intelligence, e-Business, robotics

    - selective information sharing, hiding

    - collaborative ontology development


    The WoMO 2010 workshop follows a series of successful events that have been an
    excellent venue for practitioners and researchers to discuss latest work and current
    problems. It is intended to consolidate cutting-edge approaches that tackle the
    problem of ontological modularity and bring together researchers from different
    disciplines to study the problem of modularity in ontologies at a fundamental
    level, develop design tools for distributed ontology engineering, and apply modularity
    in different use cases and application scenarios. Previous editions of WoMO were:


    WoMO 2006 The 1st workshop on modular ontologies, co-located with ESWC 2006, Athens,
    Georgia, USA. Invited speakers were Alex Borgida (Rutgers) and Frank Wolver (Liverpool).
    The web site is at http://www.cild.iasate.aachen.de/events/womo.html and the proceedings
    are at http://sunsite.informatik.rwth-aachen.de/Publications/CEUR-WS/232


    WoMO 2007 The 2nd workshop, co-located with K-CAP 2007, Whistler BC, Canada. The
    invited speaker was Ken Barker (Texas at Austin). The web site is at webrum.uni-mannheim.de/math/lski/WoMO07
    and the proceedings are at http://sunsite.informatik.rwth-aachen.de/Publications/CEUR-WS/Vol-315


    WoMR 2008 The 3rd workshop in the series, co-located with ESWC 2008, Tenerife,
    Spain, entitled ''Ontologies: Reasoning and Modularity'' had a special emphasis
    on reasoning methods. The web site is at http://dm.fbk.eu/worm08 and the proceedings
    at http://sunsite.informatik.rwth-aachen.de/Publications/CEUR-WS/Vol-348

