    ## 5. Upper-Level Ontology Modules for CEP


    We propose that event processing domain should be described by a modular and layered
    ontology model which can be reused in different application areas. Figure 1 shows
    the upper-level ontology modules for event processing domain, which can capture
    every general top concepts such as event, situation, process, temporal, spatial,
    action, agent concepts. Event ontology includes the core concepts and attributes
    of event and connection between modules can be realized with e.g. ε-connection[16],
    Distributed Logics[4]. A temporal ontology captures all of the concepts related
    to the happening time of the event and can be seen as time ontology. The spatio
    ontology includes the concepts related to the geological information of the events
    and answers questions like, where the event did happen, or where locations are
    related to the event.


    We claim that besides a general top ontology, also specific domain-ontology and
    task/application ontologies are needed. For example, to describe an event about
    "stock quote price change" different attributes are needed than describing an
    event about "a state change of a Web service". It would not be a complete approach
    which covers all application domains. Events can have different relationships
    to each other in different domains but a simple hierarchical relationship between
    events is not satisfying.


    Other specific, task and application ontologies are sub-ontologies of the common
    top ontologies. They represent more concrete specialized concepts for the application
    domain. The domain-specific events are modeled as domain classes of the domain
    ontology and have relationships with other classes of other domain ontologies.
    They can have object or data type properties. For example to describe the above
    example about the stock price change, an event class for this event can be named
    "stockpriceChange". Each instance of this class is identified by a URI and is
    related with a rdf:type predicate to this class.


    ## CEP Upper-Level Ontology Modules


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_106_0.png)


    Figure 1. Modular Top Level Ontologies


    The reasons for modular top ontologies for CEP are the same general reasons for
    ontology and database modularization like, scalability, complexity management,
    understandability, context-awareness, personalization and reuse [32]. By means
    of modular ontologies, the event processing system can achieve better scalability
    for data querying, reasoning on ontologies, evolution and maintenance. Different
    ontology languages with different levels of expressiveness and limitations might
    be proposed for the description of CEP ontologies. A trade-off between the reasoning
    expressiveness and the cost of the reasoning, specially performance and real time
    processing of events can be observed.


    Because of this trade-off, the level of expressiveness of the ontology language
    and reasoning on events should be defined based on the target use case of the
    SCEP.


    ## 6. Module Discovery and Development.


    We used a semantic-driven strategy [33] for our work on event modularization.
    We tried to extract relevant fragments of ontologies with special meanings and
    found modules which make sense for the final users [15] in different use cases
    of SCEP. For the module discovery and development, we followed the following steps:


    - *Step-One: Investigation of existing ontologies*: We investigated the existing
    event ontologies which are specified in the other research fields. We observed
    that each of these ontologies are developed for different use cases, and based
    on the target use case define different concepts. Comparing the existing ontologies,
    we can find a common set of concepts and attributes which are defined in several
    existing ontologies e.g. the conceptualization of events. It is clear that a common
    set of concept cannot fit the needs of different applications for event attributes.
    It seems impossible to develop a single event ontology which can fit to all the
    requirements of different applications. However, it is possible to identify the
    core aspects of events like: type, place references, time (period or moment),
    etc. It can also be observed that the same concepts are represented in different
    ontologies with different attributes.


    - *Step-Two: Ask questions about the factual aspects of events*: Our second step
    was to ask questions about the domain of events. We found the following journalistic
    questions about events very interesting to extract the most important factual
    aspects of events.


    - * What happened?

    - * When it happened?

    - * Where did it happen?

    - * Who is involved? Who reported it?

    - * Why did it happen?

    - * How did it happen?

    - * What else can be said about the event?


    The answers for each of these questions can define one of the important aspects
    around events. These answers can be represented in different ontologies, because
    they are general aspects which can be defined in stand ontology modules, like
    time, place, space, action, process, etc.


    - *Step-Three: Define competency of module*: After asking competency question
    about the application domain of event processing, the sphere of competence for
    the area each of the ontology modules could be identified. The competency of each
    of the ontology module could be specified, e.g. actor ontology module the task
    to.


    - *Step-Four: Collection of most common concepts*: We started to find the most
    important concepts and assertions. From existing ontologies, the most important
    concepts are collected.


    - *Step-Five: Design of module linking and importing*: We tried to define the
    potential interfaces of modules that can be connected to each other. This can
    increase the understandability and chance of reuse.


    We identified the following ontology modules which can be defined in form of upper-level:


    **Event Ontology**: An event ontology module should contain the highest concepts
    about events like type. The event type can be utilized to connect the knowledge
    about the event event instance. The subclasses of event type can specialize the
    event and represent the answer of “What happened?”.


    **Time Ontology**: Time is the most important attribute of events. In some of
    the application domains only the stamp of the event is considered, in others the
    start and end of time, a time interval (time window), or in some the duration
    of event. Different time ontologies [17], [40], [39] are proposed. A upper-level
    ontology module should contain only the main concepts and common part of these
    ontologies which can be meaningful and reasonable.


    **Spatial Ontology Module**: Also different spatial ontologies like place Ontologies
    [18], geo information or place ontologies for the Semantic Web [1],[20] are proposed.
    From some of the existing ontologies are proposed to be used in Geographic Information
    Systems (GIS) which can improve the quality of this system by adding geo or geospatial
    information, e.g. for increasing the interoperability between different geo systems.
    The geo ontologies describe the two dimension view of place, in a space ontology
    this conceptualization can be extended to a three dimension view. Space ontologies
    are also proposed for the description of a place in 3D format.


    **Situation Ontology Module**: We distinguish between situations and complex events.
    Situ situation is initiated or terminated by one or more (complex) events, i.e.
