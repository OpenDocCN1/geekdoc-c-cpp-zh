    In this part we focus on the fundamental notions of logic-based modularity; $\Sigma$-entailment,
    $\Sigma$-entailwability r query language, and $\Sigma$-conservative extension.
    This section details the results presented by Konev et al in [16]. Our goal is
    to present these notions in an institutional setting, and thus independently of
    particular ontology or query languages. To achieve this we introduce the notion
    of a framework, which allows us to study entailment even if an ontology differs
    from a query language.


    **Definition 2.1.** A query basis is an inclusive morphism $\eta : \mathcal{Q}
    \to \mathcal{G}$.


    A framework over a query basis $\eta : \mathcal{Q} \to \mathcal{G}$ is an inclusive
    morphism $\mu : \mathcal{L} \to \mathcal{G}$. We call $\mathcal{L}$ the ontology,
    $\mathcal{G}$ the global language, and $\mathcal{Q}$ the query language of the
