    # 迈向计算创造力集体中的本体论使用、重用与滥用\n\n一种立场声明\n\nSimon COLTON\n计算创造力小组\n伦敦帝国学院计算机系\nhttp://www.doc.ic.ac.uk/ccg\n\
    \n计算创造力广义上定义为研究构建能够表现出被认为具有创造性行为的软件。从更实用的角度来说，我们研究如何工程软件，使其在艺术和科学项目中承担某些创作责任，并产生在文化上有趣的艺术产物，如诗歌、定理、绘画、旋律等。为此，有大量创造性软件的示例被应用于音乐作曲、视觉艺术、纯数学、自然语言生成、科学发现、视频游戏设计等许多话语领域。此外，计算创造力社区开始对出现的一些棘手问题达成共识，例如：AI\
    \ 过程何时适用于生成性应用；我们如何衡量软件的创造力水平；以及软件在创作活动中可以扮演什么角色？我们对计算创造力研究的贡献围绕着我们的两件研究软件展开：HR\
    \ 系统 [2] 和绘画池 (www.paintingfool.com)。前者是数学理论形成软件，它可以从关于纯数学领域的最少信息开始，最后形成一个丰富的猜想、定理和证明的理论。后者是一个自动画家，我们希望它有一天能在其自己的世界里被作为一种独立的创造性艺术家而认真对待。\n\
    \n计算创造力研究人员开发的大多数软件（包括我们的）仅被赋予其特定应用领域的知识。例如，我们的 HR 系统被赋予了纯数学领域的足够背景信息，使其能够在这些特定领域中发明概念，但没有被赋予更广泛的数学知识，也绝没有提供纯数学领域之外的信息。在那些具有客观价值衡量标准、我们可以借此评估创造系统所产物的领域，这在很大程度上是可以接受的。然而，我们在\
    \ [3] 中认为，在某些领域（特别是视觉艺术），在评估创作者所产生产物的价值时，创作者的创造力和智能是被考虑的。特别是在这些领域中，当人们评估作品的价值时，艺术家的文化意识可能会受到质疑。在这些情况下，非常需要本体论中存储的那种知识，创造性软件可以使用这些知识来增强其智能，从而产生更有趣且更具文化价值的产物。\n\
    \n# S. Colton / 迈向计算创造力集体中的本体论使用、重用与滥用\n\n我们认为，除了使用此类本体外，我们还需要为了并非设计初衷的情况重用本体中的知识，并且通过将其用于极具想象力的目的来“滥用”这些本体。\n\
    \n我们目前正致力于构建一个由软件、知识和资源的计算创造力集体（www.doc.ic.ac.uk/ccg/collective）。该集体的目的是汇集能够生成不同类型产物（例如诗歌、图片、旋律、定理等）的软件，使得一个过程的输出成为另一个过程的刺激。通过这种方式，我们希望证明这种软件在组合使用时，可以为各种社区产生具有真实价值的文化和科学产物。该集体将分为（至少）四个部分。第一部分将包含产生产物的生成和分析算法。目前，该集体拥有超过\
    \ 100 个涉及图像和文本处理以及网络材料检索的过程。此外，它还有 50 多种组合两个或多个过程的混合模式。例如，集体中的一个混合模式获取某个 Twitter\
    \ 用户的最新推文，从推文中提取关键词，从 Google 图片中找到匹配关键词的图片，并将这些图片组合成视觉拼贴。这种从文本到艺术的混合源于 [6] 中描述的项目。集体的第二部分将是一组推理方法，用于自由组合集体中的过程。组合过程的首次实例化将基于全局工作空间架构，特别是\
    \ [11] 中描述的工作。集体的第三部分将是源素材（图像、声音、音乐、文本等），产物生产中的过程可以访问这些素材。自然地，集体产生的任何产物都将添加到这些源素材中。\n\
    \n集体的最后一部分将是一个知识库，集体中的过程可以对其查询，以及一组用于查询、组合并可能“滥用”知识库的技术，以便为集体的运作方式增加智能和想象力。我们预见到使用本体论来表示知识库中的信息，并希望本体的创造性使用为模块化本体设计理论带来有趣的进展。对计算创造力感兴趣的研究人员已经开始转向本体，以测试他们的方法并作为信息来源。例如，Veale\
    \ 等人的工作在 [9] 中研究了用于本体构建的类比推理，他们经常以创造性的方式使用 WordNet 等本体，例如用于创造新词 [8]。我们也可以声称，HR\
    \ 中的自动理论形成程序是一种本体构建方法，其中本体中的概念是由软件发明的。本体构建方法的一个示例可以在 [5] 中的概念融合中找到，这种方法也经常被用于创造性设定环境，例如在\
    \ [7] 中描述的项目中。我们预见到这类知识生成引擎将成为集体用于创造性产物生成方式的重要组成部分。\n\n"
