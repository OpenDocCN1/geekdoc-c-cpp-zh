    # Modular Upper-Level Ontologies for Semantic Complex Event Processing


    Kia TEYMOURIAN, Gökhan COSKUN and Adrian PASCHKE

    Freie Universität Berlin

    Institut für Computer Science

    Königin-Luise-Str. 24/26, 14195 Berlin Germany


    Event-driven systems are highly depending on the quality of detection and processing
    of events. Many of complex real-world events cannot be processed by the existing
    event processing systems because they are too complex to be understood and processed
    by the systems. Complex events can be inferred from raw primitive events based
    on their sequence and semantics. Using ontological knowledge about events and
    their relationship to other non-event concepts can improve the quality of event
    processing in this paper, we discuss the merits and problems of ontology developing
    and using in the area of event processing and propose modular upper-level ontologies
    for semantic enabled complex event processing. We discuss how the modularity is
    required and how these ontologies should be built up based on ontology engineering
    aspects to be able to address scalability, expressiveness and reuse.


    Keywords: Modular Ontologies, Complex Event Processing, Semantic Event Processing,
    Semantic Technology.


    # # 1. Introduction


    The reality in many business organizations is that some of the important events
    cannot be used in process management, because they are not detected from the work-flow
    data and the decision makers could not be informed about them. Detection of events
    is one of the critical factors for the event-driven systems and business process
    management. Semantic models of events can improve the quality of event processing
    by using event meta-data in combination with ontologies and rules (knowledge bases).
    The success of the Semantic Web research community in building standards and tools
    for semantic technologies such as formalized vocabularies/ontologies and declarative
    rules, are opening novel research and application areas. One of these promising
    application areas is event processing.


    Previously, we proposed in [35,34] a new approach for the Semantic enabled Complex
    Event Processing (SCEP). We claim that semantic models of events can improve the
    quality of event processing using event data in combination with ontologies and
    rules (knowledge bases). Ontologies play an important key role in the SCEP, because
    they are the conceptualization of the application domain and they allow reasoning
    on events in combination with other non-event concepts. We claim that the application
    domain of'
