    # 一用于评估模块化本体中内聚性与耦合的指标套件


    Faezeh ENSAN 和 Weichang DU

    新不伦瑞克大学计算机科学系

    Frederic, NB, Canada


    **摘要。**

    在本文，我们提出了一组用于衡量模块化本体中内聚性和耦合性的语义指标。为了定义这些指标，我们考虑了模块化本体论的语义而非其语法。基于语义的定义，本体论评估同时考虑了显式断言的知识以及从显式表示的知识推导出的隐含知识。我们基于
    Kitchenham 指标验证框架对所引入的指标进行了验证。


    ## 1. 引言


    近年来，语义网技术和本体论已越来越多地应用于现实世界的问题和领域。到目前为止，人们已经提出了许多用于本体论开发与管理的技术、框架和方法 [6,5]，以及关于本体论语言的各种建议
    [16,12]。OWL-DL [16] 是本体论语言的一种，被广泛用于表示本体论。OWL-DL 基于描述逻辑（DLs），描述逻辑为定义和形式化本体论语言提供了坚实的基础。


    对于描述一个话语域，本体论的各种设计都是想象的。一种可能的本体论设计是单体设计，即该领域的所有捕获概念、角色、公理和断言都汇到一个单体本体论中，例如在 OWL-DL
    本体论的情况下位于单个 OWL 文件中。设计本体论的另一种方法是模块化方法，即该领域由一组本体论（称为模块化本体论）描述，每个本体论都是话语域的一个子域。领域的子域之间可能存在依赖关系。因此，它们对应的本体论模块无法独立表示。本体论模块可能需要引用其他模块的符号。OWL-DL
    具有“import”功能，可以用于集成不同的本体论模块，并允许它们引用来自其他模块的系统。使用 import 功能，本体论模块会导入其他模块的知识库。模块化
    DSL [3]、E-connections [14]、P-DL [1] 和 IBF [7] 为定义和集成本体论模块提供了替代方法。这些形式化为描述逻辑语法和语义提供了新的扩展，以便使对本体论方法的自动化推理变得可行。


    本体论作为语义网应用的基本构建块，应当通过适当的测量进行评估。一套清晰的本体论评估指标和测量方法使得为不同的应用选择本体论更加准确。它还通过提供良好的本体论应该是什么样的指南，增强了本体论设计和开发的过程。以模块化方式开发本体论日益增长的需求，凸显了对评估模块化本体的测量和指标日益增长的需求。迄为止，还没有引入广泛接受的测量方法来评估模块化本体。


    内聚性和耦合是用于评估模块化本体的两个重要标准。内聚性是指本体论模块的统一性，耦合是指本体论模块之间存在的相互依赖关系。模块化本体的高内聚、低耦合可以带来更好的可理解性、可重用性和演化性。


    文献中有少数提案研究了本体论的内聚性和耦合概念。在 [20] 中，通过结构化指标（如叶节点类的数量和平均深度）研究了本体论的内聚性。在 [17] 中，研究了本体论的耦合性。在
    [15] 中，引入了一组指标：分区数量 (NOP)、不一致子集数量 (NMIS) 和公理平均值 (AVAI)。在本文中，我们提出了一组用于衡量模块化本体中内聚性和耦合性的语义指标。为了定义这些指标，我们考虑了模块化本体论的语义而非其语法。基于语义的定义，本体论评估同时考虑了显式断言的知识以及从显式表示的知识推导出的隐含知识。我们基于
    Kitchenham 指标验证框架对所引入的指标进行了验证。


    ## 2. 背景


    ### 2.1 基于描述逻辑的本体论


    本体论可以定义为 $\Psi = (\mathcal{T}, \mathcal{A})$，其中 $\mathcal{T}$ 是术语库（TBox），$\mathcal{A}$
    是断言库（ABox）。本体论的签名 $Sig(\Psi)$ 包括概念 $\mathcal{C}$、角色 $\mathcal{R}$ 和个体 $\mathcal{I}$。TBox
    $\mathcal{T}$ 包含关于概念和角色的公理，而 ABox $\mathcal{A}$ 包含关于个体的断言。解释 $I = (\Delta^\mathcal{I},
    \cdot^\mathcal{I})$ 由非空域 $\Delta^\mathcal{I}$ 和解释函数 $\cdot^\mathcal{I}$ 组成。对于概念
    $C \in \mathcal{C}$，$C^\mathcal{I} \subseteq \Delta^\mathcal{I}$。对于角色 $R \in \mathcal{R}$，$R^\mathcal{I}
    \subseteq \Delta^\mathcal{I} \times \Delta^\mathcal{I}$。对于个体 $a \in \mathcal{I}$，$a^\mathcal{I}
    \in \Delta^\mathcal{I}$。如果存在一个解释满足所有公理，则该本体论是满足的。如果知识库有一个满足所有概念的模型，则它是一致的。一个包含或断言
    $\alpha$ 被知识库 $\Psi$ 蕴，表示为 $\Psi \models \alpha$。


    ### 2.2 测量验证框架


    为了验证内聚性和耦合的指标，我们使用了 [13] 中引入的框架。根据该框架，对于测量，应该指定实体、属性、单位和尺度。实体是被测量特征的对象。属性是实体可以拥有的属性，并通过测量正式地捕获。单位决定了如何测量属性，尺度可以是名、序序或比例。


    为了验证测量，我们确认属性有效性、单位有效性、工具有效性和协议有效性。属性有效性涉及实体是否拥有该属性。单位有效性意味着引入的单位能够适当测量相应的属性。工具用于获取属性的测量值。工具有效性涉及对属性的建模是否有效以及工具是否经过适当校准。最后，协议有效性处理所用测量协议是否明确且不存在重复计数等问题。


