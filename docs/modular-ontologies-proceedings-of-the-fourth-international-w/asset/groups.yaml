    # 模块化本体


    序言


    Oliver Kutz, Joana Hois, Jie Bao, Bernardo Cuenca Grau


    模块化是本体工程中的核心主题。将本体分解为更小、易管理的模块的能力可以提高重用性、维护性和扩展性。然而，定义模块边界、确保模块间的一性以及管理依赖关系仍然是挑战。


    本研讨会展示了关于模块本体各个方面的最新研究。它涵盖了理论基础、算法方法和实际应用。其目标是聚集研究人员讨论当前的技术水平并确定领域的未来方向。


    WoMO 涵盖的主题包括但不限于：


    ## 什么是模块化？


    - 模块的种类及其属性

    - 模块与上下文

    - 表示的粒度


    ## 逻辑/基础研究：


    - 鲁棒性属性，如保守性

    - 模块语言（例如 DDL, E-DL）

    - 协调模块间的冲突

    - 形式化


    ## 算法方法：


    - 分布式推理

    - 模块化与模块提取

    - 共享与重用、链接与导入

    - 模块化的评估

    - 推理复杂度


    ## 应用领域：


    - 语义网中的模块化

    - 生命科学、环境智能、电子商务、机器人

    - 选择性共享

    - 协作本体开发


    WoMO 2010 研讨会延续了一系列作为从业者和研究人员讨论最新工作和当前问题的良好平台。它旨在整合解决本体模块化问题的方法，并汇来自不同领域的研究人员，从基础层面研究本体模块化问题，为分布式本体工程设计工具，并在不同的用例和应用场景中应用模块化。往届
    WoMO 活动包括：


    WoMO 2006 第一次模块本体研讨会，与 ESWC 2006 在美国佐治亚州雅典举行。受邀演讲者为 Alex Borgida（罗格斯大学）和 Frank
    Wolver（利物浦大学）。网站为 http://www.cild.iasate.aachen.de/events/womo.html，论文集位于 http://sunsite.informatik.rwth-aachen.de/Publications/CEUR-WS/232


    WoMO 2007 第二次研讨会，与 K-CAP 2007 在加拿大惠斯勒举行。受邀演讲者为 Ken Barker（德克萨斯大学奥斯汀）。网站为 webrum.uni-mannheim.de/math/lski/WoMO07，论文集位于
    http://sunsite.informatik.rwth-aachen.de/Publications/CEUR-WS/Vol-315


