    \ ε-connection[16]、分布式逻辑[4] 实现。时间本体论捕捉了所有与事件发生时间相关的概念，可以被视为时间本体论。空间本体论包含了与事件的地质信息相关的概念，并回答诸如事件发生在哪里，或哪些位置与事件相关的问题。\n\
    \n我们主张，除了通用的顶级本体外，还需要特定的领域本体和任务/应用本体。例如，描述一个关于“股票报价变化”的事件，所需的属性与描述一个关于“Web 服务状态变化”的事件所需的属性不同。一个涵盖所有应用领域的方法将是不完整的。事件在不同领域中可以彼此之间有不同的关系，但事件之间简单的层级关系是不够的。\n\
    \n其他特定的、任务和应用本体是通用顶级本体的子本体。它们代表了应用领域中更具体的专门化概念。领域特定事件被建模为领域本体的领域类（domain classes），并与其他领域本体的其他类具有关系。它们可以拥有对象类型或数据类型属性。例如，为了描述上述股票价格变化的例子，可以为该事件的一个事件类命名为\
    \ \"stockpriceChange\"。该类的每个实例都由一个 URI 标识，并通过 rdf:type 谓词与该类相关。\n\n## CEP 上层本体模块\n\
    \n![](img/a1ab54b0915908c6fe20ac887a02d94e_106_0.png)\n\n图1. 模块化顶级本体\n\n为 CEP\
    \ 采用模块化顶级本体的原因与本体和数据库模块化的通用原因相同，例如：可扩展性、复杂性管理、可理解性、上下文感知、个性化和重用 [32]。通过模块化本体，事件处理系统可以在数据查询、本体推理、演化和维护方面实现更好的可扩展性。对于\
    \ CEP 本体论的描述，可能会提出具有不同表达能力和局限性的不同本体语言。在推理表达能力与推理成本（特别是事件的性能和实时处理）之间可以观察到权衡（trade-off）。\n\
    \n正由于这种权衡，本体语言的表达水平以及对事件的推理，应该基于 SCEP 的目标用例来定义。\n\n## 6. 模块发现与开发。\n\n我们在事件模块化工作中使用了一种语义驱动的策略\
    \ [33]。我们尝试提取具有特殊含义的本体相关片段，并在 SCEP 的不同用例中找到对最终用户 [15] 有意义的模块。对于模块的发现和开发，我们遵循了以下步骤：\n\
    \n- *第一步：现有本体的调查*：我们调查了在其他研究领域中指定的现有事件本体。我们观察到这些本体中的每一个都是为了不同的用例而开发的，并根据目标用例定义了不同的概念。通过比较现有本体，我们可以找到一组在多个现有本体中定义的通用概念和属性，例如事件的概念化。显然，一组通用概念无法满足不同应用对事件属性的需求。要开发一个能够适应所有不同应用要求的单一事件本体似乎是不可能的。然而，识别事件的核心方面是可能的，例如：类型、地点引用、时间（时期或时刻）等。同样可以观察到，相同的概念在不同的本体中以不同的属性被表示出来。\n\
    \n- *第二步：关于事件的事实性方面提问*：我们的第二步是针对事件的事实性方面进行提问。我们发现针对事件领域提出以下实实性问题是非常有趣的：\n  - 发生了什么？\n\
    \  - 它是什么时候发生的？\n  - 事件发生在哪里？\n  - 谁参与了？谁是谁报告的？\n  - 事件为什么发生？\n  - 它是是如何发生的？\n\
    \  - 关于事件还可以说什么？\n\n这些问题的答案可以定义事件周围的重要方面。这些答案可以在不同的本体中表示，因为它们被定义在本体模块中，如时间、空间、动作、过程等。\n\
    \n- *第三步：定义模块的需求*：在对事件处理领域提出能力需求（competency）问题后，可以确定本体模块的能力范围。例如本体模块的任务。\n\n-\
    \ *第四步：常用概念的收集*：我们开始寻找最重要的概念和断言。从现有本体中收集了最重要的概念。\n\n- *第五步：模块的链接与导入*：我们尝试定义可以相互连接的模块潜在接口。这可以增加可理解性和重用率。\n\
    \n我们识别了以下以上层形式定义的本体模块：\n\n**事件本体论**：事件本体论应该包含关于事件最高概念，如类型。事件类型可以用于连接关于事件的知识。事件类型的子类可以特化事件并代表“发生了什么？”的答案。\n\
    \n**时间本体论**：时间是事件最重要的属性。在某些应用领域中，只考虑事件的时间戳；在另一些领域中考虑开始和结束时间、时间间隔（时间窗口），或者在某些领域考虑持续时间。存在不同的时间本体论\
    \ [17], [40], [39]。上层本体模块应该只包含这些本体的主要概念和共同部分，这些部分是有意义且合理的。\n\n**空间本体论**：还存在不同的空间本体论，如地点本体\
    \ [18]、地理信息或用于语义网的地点本体 [1],[20]。建议将现有本体用于地理信息系统 (GIS)，通过添加地理或地理空间信息来提高该系统的质量，例如增加不同地理系统之间的互操作性。地理本体描述了地点的二维视图，在空间本体中，这种概念化可以扩展到三维视图。空间本体论还用于描述三维格式的地。\n\
    \n**情境本体模块**：我们区分了情境和复杂事件。情境由一个或多个（复杂）事件启动或终止，即复杂事件持有有效区间。在我们的本体中，情境是离散的情境实例。它们具有固定的上下文，如时间分配（日期）、地点、参与者等。它们不可重复的且在时间上是连接的。\n\
    \n"
