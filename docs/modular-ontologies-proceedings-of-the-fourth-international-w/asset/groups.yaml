    # 3. Evaluation of Ontology Modules


    In this section, we first clarify our intention of the notions of ontology modules.
    Substantially, we give precise definitions for metrics for evaluating ontology
    modules.


    Up until now, ontology modules and modular ontologies have been defined differently
    in the literature [18,9,11]. The basic notion in which most defining coincides
    is that ontology modules have references to external symbols from other ontologies.
    More formally, ontology modules are DL knowledge bases whose signature consists
    of two disjoint sets of local and external entities. External symbols are the
    labels of all ontology modules. For M as an ontology module, Sig(M) ≡ Loc(M) ∪
    Ext(M). This definition is inclusive for ordinary ontologies that are developed
    based on the monolithic approach. Accordingly, monolithic ontologies whose set
    of external symbols are empty.


    In the following, we present a precise definition for numerical metrics that measure
    ontology modules. Since the definition of ontology modules includes cases where
    ontologies are developed monolithically, the following definition can also be
    used for defining metrics for evaluating monolithic ontologies. For defining ontology
    metrics, we follow the approach that is employed in [4] for defining software
    metrics for object oriented designs.


    > Definition 1. Let {M1,...,Mn} be a set of ontology modules that describe a domain
    of discourse. Further, assume R be a binary relation on these ontology modules
    that corresponds to a specific perspective for measuring ontology metrics. Further,
    let {q1,...,qn} be a set of numbers and S be a binary relation on these numbers,
    such as < or ≤. A numerical metric μ maps a tuple of ontology modules and the
    relationship between them ({M1,...,Mn}, R) to a set of numbers and a binary relation
    on numbers ((q1,...,qn), S).


    As an explanatory example, assume there are three ontology modules M1, M2 and
    M3. Further the reusability perspective that R(M1,M2) means that M1 is more readable
    than M2. Consider three arbitrary numbers q1 = 10, q2 = 5 and the relation S on
    these numbers are ‘less-than’ or ‘<’. μ is a numerical metric that assigns M1
    to q1, M2 to q2, M3 to q3 and R to S. Based on, since q3 < q2 < q1, M3 is more
    reusable than M2 and M2 is more reusable than M1.


    For introducing a numerical metric for measuring ontology modules, it should show
    how the corresponding numbers are produced for each ontology module and how the
    relation between numbers (S) corresponds to the relationship between ontology
    modules from a specific perspective (R).


    **Example 1.** Different ontology modules are in different level of understandability.
    Hence there is a relationship R between ontology modules from the understandability
    perspective that R(M1, M2) means ontology module M1 is more understandable than
    M2. As a simple example for numerical metrics, assume the size of ontology modules
    is defined for measuring ontology modules from the understandability perspective.
    The justification is that ontology modules with smaller size represent more focused
    portion of the domain of discourse and can be understood more smoothly. i.e.,
    for ontology module M, Size(M) = |Sig(M)|. For ontology modules M1, Size(M1) are
    numbers on which the relationship S as ''less-than-equal'' (≤) can be defined.
    The numerical metric assigns to each ontology module a number. The relationship
    S that exists between these numbers corresponds to the relationship R between
    ontology modules.


    # 4. A Set of Metrics for Evaluating Ontology Modules


    In this section, we provide method for measuring cohesion and coupling in ontology
    modules. Cohesion in an ontology module is concerned with how ''related'' and
    ''dependent'' concepts and roles it contains. Coupling means ''related'' and ''dependent''
    its concepts and roles to the external symbols from foreign ontology modules.
    For better explanation, consider the following three ontology modules:


    - M1 = {A, B}, A and B are local concepts

    - M2 = {A ⊆ B}, A and B are local concepts

    - M3 = {A ⊆ B}, A is a local concept and B is an external concept form ontology
    module, M3


    In this example, the first situation, A and B are two unrelated concepts that
    are collocated in the ontology module M1. They may be diverse piece of information
    that describe unrelated subjects. Hence, Ontology module M1 is not highly cohesive.
    In the second situation, A is defined as a subclass of B and A and B are strongly
    related to each other. Here, ontology module M2 is highly cohesive, i.e. it describes
    a related sub-domain of discourse. In the third situation, A is dependent on B
    which is an external symbol from the foreign ontology module M3. Hence, the more
    the dependencies exist between local symbols and external symbols from foreign
    ontology modules, the more it is coupled.


    In the following, in order to precise the cohesion and coupling, we provide formal
    definitions for cohesion and coupling in modules.


