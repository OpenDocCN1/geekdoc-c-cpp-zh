    Definition 4. For ontology module M:


    $SDepLoc(M) = \{(P,Q) \mid P \in Loc(M), Q \in SDep_{M}(P) \text{ and } Q \in
    Loc(O)\}$

    $SDepExt(M) = \{(P,Q) \mid P \in Loc(M), Q \in SDep_{M}(P) \text{ and } Q \in
    Ext(O)\}$

    $MDepLoc(M) = \{(P,Q) \mid P \in Loc(M), Q \in SDep_{M}(P) \text{ and } Q \in
    Loc(O)\}$

    $MDepExt(M) = \{(P,Q) \mid P \in Loc(M), Q \in SDep_{M}(P) \text{ and } Q \in
    Ext(O)\}$


    Based on the dependency of sets, we introduce two metrics for measuring cohesion
    and two metrics for measuring coupling of ontology modules.


    Definition 5. For an ontology module M, NSLD and NMLD are two metrics for measuring
    its cohesion and are defined as follows:


    NSLD is the Number of Strong Local Dependencies which exist between local symbols
    of an ontology module. $NSLD(M) = |SDepLoc(M)|$, i.e., the size of the SDepLoc
    set for ontology module M.


    NMLD is the Number of Local Dependencies which exist between local symbols of
    an ontology module. $NMLD(M) = |MDepLoc(M)|$, i.e., the size of the MDepLoc set
    for ontology module M.


    NSLD and NMLD are numerical metrics that assigns numbers to ontology modules according
    to Definition 5. There is a ''greater-equal-than'',''$\ge$'' relationship between
    the numbers which have been assigned to ontology modules. This relationship associates
    with cohesion of ontology modules which itself associates with understandability,
    reusability, evolvability and reasoning performance perspectives. The larger values
    that are assigned by NSLD and NMLD to ontology modules, the more cohesive the
    ontology modules.


    Definition 6 introduces two metrics for measuring coupling.


    Definition 6. For an ontology module M, NSED and NMED are two metrics for measuring
    its coupling and are defined as follows:


    NSED is the Number of Strong External Dependencies which exist between local symbols
    of an ontology module. $NSED(M) = |SDepExt(M)|, i.e., the size of the SDepExt
    set for ontology module M.


    NMED is the Number of Moderate External Dependencies which exist between local
    symbols of an ontology module. $NMED(M) = |MDepExt(M)|$, i.e., the size of the
    MDepExt set for ontology module M.


    NSED and NMED are numerical metrics that assigns numbers to ontology modules according
    to Definition 6. There is a ''less-equal-than'',''$\le$'' relationship between
    the numbers which have been assigned to ontology modules. This relationship associates
    with coupling of ontology modules which itself associates with understandability,
    reusability, evolvability and reasoning performance perspectives. The lower values
    that are assigned by these metrics to ontology modules, the less coupled the ontology
    modules.


