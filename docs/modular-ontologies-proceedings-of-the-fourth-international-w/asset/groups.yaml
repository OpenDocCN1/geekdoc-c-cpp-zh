    logics in a systematic way: the notion of *comorphism* specifies how a ''weaker''
    logic can be ''embedded'' in a ''richer'' logic.


    **Definition 1.4**. A comorphism $\mu : \mathcal{I} \to \mathcal{I}''$ consists
    of:


    - a functor $\mu : Sig^{\mathcal{I}} \to Sig^{\mathcal{I}''}$

    - a natural transformation $\alpha^\mu : Sen^{\mathcal{I}} \to Sen^{\mathcal{I}''}$
    (i.e., a family of functions $\alpha^\mu : Sen(\Sigma) \to Sen(\mu(\Sigma))$)

    - a natural transformation $\beta^\mu : Mod^{\mathcal{I}} \to Mod^{\mathcal{I}''}$
