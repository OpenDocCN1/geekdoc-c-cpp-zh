    广泛使用的符号系统。并不是某一种语言或符号系统比其他任何都要“优”，但对于特定的领域或应用，某一个系统可能比其他的更合适。在任何情况下，为本体选择特定的符号系统都会限制其可能的使用范围。很有可能，用相同语言编写的本体或其组成部分只能被整合到用相同语言编写的其他本体中；或者为了合并两个或多个现有的本体，可能需要将其中一种翻译成另一种语言。


    即使在同一种语言中，不同的本体也可能使用不同的词汇。例如，如果主要本体的用户群体使用不同的自然语言，且这些概念和角色名称来自自然语言，就会发生这种情况。同样，这使得本体难以共同使用。为了解决这个问题，我们必须在词汇之间找到对应关系，例如
    [10]。


    另一个问题源于本体必须是显式的要求。在本体中显式地呈现所有所需信息可能是不方便，甚至是不可能的。许多用于编写本体的语言是逻辑，其语义提供了一种概念概念，从而提供了隐含信息。为了获得这些信息，必须对本体进行查询：以推导出或推理本体陈述中隐含的内容。我们可能希望获得导出的层次结构，或者使用本体访问实例数据（例如，如基于本体的数据访问
    [6] 中）。显然，当查询和本体用同一种语言编写时，获取查询结果可能是最好的；如果它们不是，则本体或查询可能需要翻译成另一种语言。


    当然，上述问题可能会同时出现，因此我们可能有两个用不同形式化表示的本体（或一个本体和一个查询），它们的词汇源自不同的自然语言。在某种意义上，那些开发和使用本体的人可能面临着类似于巴别塔建造者所面临的问题。人们已经花费了大量工作在大量的本体中收集了大量的知识。但这些本体通常用不同的语言表述，并使用不同的词汇，在许多情况下，我们无法使用它们。


    作为解决这些问题的核心，我们对本体的本质提出了一个新观点。与标准方法不同，我们的关注重点不在于本体是如何构建的，或者使用了什么形式化来构建它们，而在于我们使用它们的方式。我们希望将本体与其功能等同。我们将本体抽象地视为一个“黑箱”，它对关于某些感兴趣词汇的查询提供答案。我们称之为功能方法。Leques
    等人 [5] 和 [22] 也为知识表示提出过类似的方法。他们的功能性工作特征是确定可以被叙述或询问的内容，而不考虑用于表示知识的结构。这是设计和实现一个名为
    Krypton 的知识表示系统的基础。


    识别本体的功能对于模块化和应用同样重要。在本体开发中，它允许重用现有的本体，并在开发大规模本体时将工作分配给独立的设计师小组。在本体应用中，模块化允许仅对本体的相关部分进行推理，从而提高效率。


    # D. Krywczyński 和 G. Malcolm / 迈向模块化本体的功能性方法


    说一个本体的某部分是一个模块，意味着该部分可以独立地运行。因此，我们必须设定本体（及其部分）运行的语境。也就是说，我们必须固定一种将用于回答查询的语言。这允许我们说，两个本体在一种固定的语言中是等价的，如果它们对该固定词汇上的所有查询都给出相同的答案。对于本体的模块，如果在一个固定的语言中，该模块和整个本体对固定词汇上的所有查询都给出相同的答案，我们就说它具有独立运行的功能。


    这些直觉体现在“不可拆分性”的概念中，该概念联系了两个在固定语言上对所有查询给出相同答案的本体。在标准方法中，两个本体是不可区分的当且仅当它们具有相同的公理。但正如
    [25] 中观察到的，计算由公理组成的本体之间的语法差异几乎没有用处。而在功能方法中，如果两个本体对于关于词汇 $\Sigma$ 的查询语言来说是不可拆分的，那么它们在关于某些词汇
    $\Sigma$ 时是不可区分的，无论公理是什么，形式化方法又是什么。这样做的好处之一是，大型本体可以自由使用一个与感兴趣词汇具有相同结果的部分：我们说本体的这部分可以“独立运行”。同样，如果不同的本体在功能方法中是不可区分的，我们就可以自由相互替换。在
    [16] 中，Konev 等人研究了各种描述逻辑的不可拆分性，并提出了鲁健性属性，这些属性能够通过模块化与标准属性（如插值属性）联系起来。本文的目标是以一种方式泛化他们的结果，使其尽可能地独立于表达本体的特定形式化方法。


    许多本体语言之间的关系是广为人知的，在它们之间进行翻译或将它们嵌入其他语言通常是直接的。当然，将一个特定本体翻译成另一个本体的细节需要根据情况处理。在本文中，我们引入了一个框架，以捕捉“全局”本体语言的签名，并能以更通用、更抽象的方式翻译“查询”语言。为了这一点，我们使用了机构（institutions），这是
    Goguen 和 Burstall [11, 13] 引入的，用于系统地处理具有模型论语义的逻辑。逻辑可以表示为实例 [9]，包括许多用于指定本体的逻辑 [21]。这样做的好处是允许对语言之间的翻译进行系统处理，最近的研究已将其应用于对齐
    [17, 19] 等问题。在一个框架内，可以捕捉通用的后果概念。我们的主要目标是研究如何在抽象层面组合本体。通常，如果本体不一致，可能会导致不理想的结果。第
    3 节泛化了鲁健性属性 [16]。


