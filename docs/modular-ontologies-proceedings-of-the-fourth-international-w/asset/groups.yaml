    # A Metric Suite for Evaluating Cohesion and Coupling in Modular Ontologies


    Faezeh ENSAN and Weichang DU

    Faculty of Computer Science, University of New Brunswick,

    Frederic, NB, Canada


    **Abstract.**

    In this paper, we present a set of semantic metrics for measuring cohesion and
    coupling in modular ontologies. For defining these metrics, we consider the semantics
    of modular ontologies instead of their syntax. Based on the semantic-based definitions,
    both explicitly asserted knowledge and the implied knowledge that is derived from
    the explicitly represented knowledge are considered for ontology evaluation. We
    validate the introduced metrics based on the Kitchenham metric validation framework.


    ## 1. Introduction


    Semantic Web techniques and ontologies have been increasingly applied to real-world
    problems and domains in the recent years. So far, numerous techniques, frameworks
    and methodologies for ontology development and management [6,5] and various proposals
    for ontology languages [16,12] have been proposed. OWL-DL [16] is an instance
    of ontology languages which is being widely used for representing ontologies.
    OWL-DL is based on Description Logics (DLs) that provide a strong basis for defining
    and formalizing ontology languages.


    For describing a domain of discourse, different designs are imaginable for ontologies.
    One possible ontology is the monolithic design, i.e., all captured concepts, roles,
    axioms, and assertions of the domain are gathered in a monolithic ontology, e.g.,
    in a single OWL file in the case of OWL-DL ontologies. Another approach for designing
    ontologies is a modular approach, i.e., the domain is described by a set of ontologies,
    called as modular ontologies, each of which is a sub-domain of discourse. Sub-domains
    of a domain may have dependencies to each others. Hence, their corresponding ontology
    modules cannot be represented independently. An ontology module may need to refer
    to symbols of other modules. OWL-DL has an ''import'' feature that can be used
    for integrating different ontology modules and allowing them to have references
    to external systems from other modules. Using the import feature, an ontology
    module imports the whole knowledge base of the others. Modular DSL [3], E-connections
    [14], P-DL [1] and IBF [7] provide alternative ways for defining and integrating
    ontology modules. These formalisms provide new extensions to describing logic
    syntax and semantics in order to make automated reasoning over ontology methods
    feasible.


    The quality of ontologies, as the basic building blocks of Semantic Web applications,
    should be assessed through appropriate measurements. A clear set of metrics and
    measurements for ontology evaluation makes the selection of ontologies for different
    applications more accurate. It also enhances the process of ontology design and
    development by providing guidelines of how should a good ontology look like. The
    emerging desire for developing ontologies in a modular manner highlights the growing
    need for measures and metrics for evaluating modular ontologies. As yet, no widely
    accepted measurements have been introduced for assessing modular ontologies.


    Cohesion and coupling are two important measures that can be employed for evaluating
    modular ontologies. Cohesion refers to the uniformity of an ontology module and
    coupling refers to the interdependencies that exists between ontology modules.
    High cohesion and low-coupling in modular ontologies lead to better understandability,
    reusability and evolvability.


    There are a few proposals in the literature that investigate the notions of cohesion
    and coupling for ontologies. In [20], the cohesion of an ontology is investigated
    through structural metrics such as the number of leaf classes and average depth.
    In [17], the coupling of an ontology is investigated. In [15], a set of metrics
    are introduced: Number of Partitions (NOP), Number of Inconsistent Subsets (NMIS)
    and Average Value of Axioms (AVAI). In this paper, we present a set of semantic
    metrics for measuring cohesion and coupling in modular ontologies. For defining
    these metrics, we consider the semantics of modular ontologies instead of their
    syntax. Based on the semantic-based definitions, both explicitly asserted knowledge
    and the implied knowledge that is derived from the explicitly represented knowledge
    are considered for ontology evaluation. We validate the introduced metrics based
    on the Kitchenham metric validation framework.


    ## 2. Background


    ### 2.1. DL-Based Ontologies


    An ontology can be defined as $\Psi = (\mathcal{T}, \mathcal{A})$, where $\mathcal{T}$
    is TBox (terminology) and $\mathcal{A}$ is ABox (assertions). The signature of
    the ontology $Sig(\Psi)$ includes a set of concepts $\mathcal{C}$, roles $\mathcal{R}$,
    and individuals $\mathcal{I}$. The TBox $\mathcal{T}$ contains axioms about concepts
    and roles, while the ABox $\mathcal{A}$ contains assertions about individuals.
    An interpretation $\mathcal{I} = (\Delta^\mathcal{I}, \cdot^\mathcal{I})$ consists
    of a non-empty domain $\Delta^\mathcal{I}$ and an interpretation function $\cdot^\mathcal{I}$.
    For a concept $C \in \mathcal{C}$, $C^\mathcal{I} \subseteq \Delta^\mathcal{I}$.
    For a role $R \in \mathcal{R}$, $R^\mathcal{I} \subseteq \Delta^\mathcal{I} \times
    \Delta^\mathcal{I}$. For an individual $a \in \mathcal{I}$, $a^\mathcal{I} \in
    \Delta^\mathcal{I}$. An ontology is satisfiable if there exists an interpretation
    that satisfies all axioms. A knowledge base is consistent if it has a model that
    satisfies all concepts. An inclusion or assertion $\alpha$ is implied by a knowledge
    base $\Psi$, denoted by $\Psi \models \alpha$.


    ### 2.2. Measurement Validation Framework


    In order to validate the set of metrics for cohesion and coupling, we use the
    validation framework introduced in [13]. According to this framework, for a measurement,
    entities, attributes, units and scale should be specified. Entities are the objects
    whose characteristics are captured by measurements. Attributes are the properties
    that entities can have, and are formally captured by measurements. Units determine
    how an attribute should be measured and scale types can be nominal, ordinal, or
    ratio.


    A measurement can be indirect, i.e., it is obtained from equations based on other
    measurements. Attributes can be multidimensional, i.e., they are derived from
    other attributes.


