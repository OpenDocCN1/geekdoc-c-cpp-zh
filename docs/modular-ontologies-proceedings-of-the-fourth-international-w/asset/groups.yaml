    # M. Schollemmer / 本体论模块化、信息流与交互情境语义 7


    以及集成的分布式描述逻辑 [27] 等。它们的区别在于对本体论建模不同侧面的侧重点不同，而非源于任何根本的逻辑差异。实际上，这些形式体系是建立在对一阶逻辑的经典塔斯基（Tarskian）语义的扩展基础之上的（尽管在机构理论中，与逻辑无关的方法也得到了提倡和探索
    [15,24,23]）。这并不意外，因为一阶逻辑因其表达能力、自然的推演系统以及基于集合的直观模型论具有特殊地位，而且其相关的逻辑构成了当前 Web Web
    本体论表示语言标准的基础。


    ## 本体论模块化与信息流


    然而，我们将在一个更通用的框架内观察本体论模块化和分布式推理，将其视为分布式信息系统中发生的信息流的一种种特定实例。为此，我们将展示如何通过通道理论（channel
    theory）来描述本体论模块化和分布式推理。通道理论是由 Barwise 和 Selig [6] 提出的关于信息流的数学理论，它最初源于哲学和计算语言学领域，借鉴了
    Dretske 对知识信息流分析 [10] 以及 Barwise 和 Perry 的情境理论 [5] 的哲学基础。作为对任何分布式系统中信息流的抽象解释，通道理论也被探索用于许多与本体论模块化和分布式推理相关的问题的理论基础，例如：信息流框架
    [20]、本体映射与基于本体论的语义集成 [17,19]、通用信息集成 [15]、情境推理 [9] 以及系统性后果 [21]。


    从这个更通用的角度看本体论模块化和分布式推理，有利于对分布式推理的构成要素形成一种抽象且统一的观点，使我们能够超越经典的塔斯基语义，并将分布式推理应用于对语义的其他理解上，例如情境定性的语义
    [1]。


    ## 意义与交互


    我们认为，通过关注本体论和本体对齐来计算独立术语的语义对应关系（基于经典的塔斯基语义），分布式推理问题仅得到了部分解决。由海德格尔和伽达默发起的现代诠释学已经表明，语言是在背景中被倾听的，而解释并不独立于解释者。因此，意义总是在解释者赋予其用法或言语的目的、预期和承诺的语境中重新创造。意义最终上是取决于交互的，并且相对于隐含的背景，这种背景是无法完全去语境化的。


    尽管如此，目前先进的本体对齐系统通常在交互之前计算语义对齐 [11]。这导致了若干几个缺点：一方面，它限制了交互的动态性和开放性，因为具有预先对齐本体的代理可能会参与交互中；另一方面，它将语义排除在交互语境之外。语义对应是以独立于交互的方式建立的。


    但某些术语的意义往往具有特定的交互性。例如，在拍卖语境下，西班牙语的 "remate" 与英语表达 "winning bid"得价）之间存在的语义相似性，如果我们仅依赖基于语法的或结构的匹配技术，甚至依赖字典和同义词表等外部来源，是很难建立的。西班牙语术语
    "remate" 可能有许多含义，其中没有一个含义能暗示其作为“得价”的意义。它的意义是在拍卖过程中发生的特定交互时刻被说出时产生的。


    ## 语义对齐作为维特根斯坦式的语言游戏


    我们通过将交互在本体论上优先于意义，来研究软件代理如何根据其通信基础建立各自术语之间的语义关系。通过维特根斯坦的语言游戏 [26]，每个代理说出的这些术语的意义实际上在交互中*使用*它们，在某些方面可以被看作是一个简单的语言游戏。我们假设遵循某些交互模型或协议（游戏规则），根据这些规则，它们被允许在交互状态下发表某些言语。这些言语以言语行为的形式存在，其内容是游戏语言（例如
    "remate" 或 "winning bid"）。当一个代理听到它无法理解的言语时，它根据对交互的观点在可能的选项中进行猜测，假设所有代理都处于相同或兼容的交互状态。


    代理赋予某个术语的“意义”，即是它认为的术语言语行为结果的交互状态转换。正如语言游戏一样，对词汇意义的猜测将避免会导致通信的崩溃：交互没有按照每个代理交互模型所预测的方向进行。如果代理能够对接口进行通信，它们就会意识到这种崩溃。


    在我们基于 [2] 的模型中，代理并行地遵循它们自己的交互协议以及一种对齐协议。这种对齐协议被视为执行实际通信的协议：任何通信行为都会失效，并在元层面上有一个有效的对应。此外，代理被赋予了执行实际匹配的对齐机制。当触发兼容的交互状态转换时，由于许多交互得以完成并被认为是语义相关的，兼容性意味着交互对于每个代理朝着相同的方向进行——尽管它们的交互观点（即它们自身的交互模型）可能比实际发生的交互更具限制。


    从理论角度来看，我们将模型建立在通道理论之上，因为它模拟了分布式系统中发生的信息流。8 M. Schollemmer / 本体论模块化、信息流与交互情境语义


    另一方面，它将语义排除在交互语境之外。语义对应是以独立于交互的方式建立的。


    但某些术语的意义往往具有特定的交互性。例如，在拍卖语境下，西班牙语的 "remate" 与英语表达 "winning bid" 之间的语义相似性，如果我们仅依赖基于语法的或结构的匹配技术，甚至依赖字典和同义词表等外部来源，是很难建立的。西班牙语术语
    "remate" 可能有许多含义，其中没有一个含义能暗示其作为“得价”的意义。它的意义是在拍卖过程中发生的特定交互时刻被说出时产生的。


    同样，交互观点（即它们自身的交互模型）可能比实际发生的交互更具限制。


