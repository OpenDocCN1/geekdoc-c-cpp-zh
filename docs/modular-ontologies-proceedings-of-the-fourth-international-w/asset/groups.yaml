    \ rights reserved.\ndoi:10.3233/978-1-60750-544-0-81\n\n# Modular Upper-Level\
    \ Ontologies for Semantic Complex Event Processing\n\nKia TEYMOURIAN, Gökhan COSKUN\
    \ and Adrian PASCHKE\nFreie Universität Berlin\nInstitut für Computer Science\n\
    Königin-Luise-Str. 24/26, 14195 Berlin Germany\n\nEvent-driven systems are highly\
    \ depending on the quality of detection and processing of events. Many of complex\
    \ real-world events cannot be processed by the existing event processing systems\
    \ because they are too complex to be understood and processed by the systems.\
    \ Complex events can be inferred from raw primitive events based on their sequence\
    \ and semantics. Using ontological knowledge about events and their relationship\
    \ to other non-event concepts can improve the quality of event processing in this\
    \ paper, we discuss the merits and problems of ontology developing and using in\
    \ the area of event processing and propose modular upper-level ontologies for\
    \ semantic enabled complex event processing. We discuss how the modularity is\
    \ required and how these ontologies should be built up based on ontology engineering\
    \ aspects to be able to address scalability, expressiveness and reuse.\n\nKeywords:\
    \ Modular Ontologies, Complex Event Processing, Semantic Event Processing, Semantic\
    \ Technology.\n\n## 1. Introduction\n\nThe reality in many business organizations\
    \ is that some of the important events cannot be used in process management, because\
    \ they are not detected from the work-flow data and the decision makers could\
    \ not be informed about them. Detection of events is one of the critical factors\
    \ for the event-driven systems and business process management. Semantic models\
    \ of events can improve the quality of event processing by using event meta-data\
    \ in combination with ontologies and rules (knowledge bases). The success of the\
    \ Semantic Web research community in building standards and tools for semantic\
    \ technologies such as formalized vocabularies/ontologies and declarative rules,\
    \ are opening novel research and application areas. One of these promising application\
    \ areas is event processing.\n\nPreviously, we proposed in [35,34] a new approach\
    \ for the Semantic enabled Complex Event Processing (SCEP). We claim that semantic\
    \ models of events can improve the quality of event processing using event data\
    \ in combination with ontologies and rules (knowledge bases). Ontologies play\
    \ important key role in SCEP, because they are the conceptualization of events\
    \ in combination with other non-event concepts.\n\n82 K. Tymourian et al. / Modular\
    \ Upper-Level Ontologies for Semantic Complex Event Processing\n\ncomplex event\
    \ processing can be conceptualized by modular ontology, because of the fact that\
    \ events have some common and general attributes, e.g. temporal and spatial attributes.\
    \ This makes modular upper-level ontologies attractive for describing event areas.\
    \ The main motivation for modular ontologies are scalability, complexity management,\
    \ understandability, context-awareness and reuse.\n\nThis paper makes two contributions.\
    \ First, we present a practical use case scenario for modularization which is\
    \ the semantic event processing, and discuss why it is needed to have modular\
    \ ontologies. Second, we describe our steps for discovering modules by comparing\
    \ the existing application areas. \n\nIn sections 4 and 5, we present the state-of-the-art\
    \ in the area of event ontologies and describe the most important and general\
    \ attributes of events which can be gathered inside some upper-level ontologies.\
    \ In section 6, our methodologies for ontology discovery and development are described.\
    \ Finally, we describe how this ontology modules can be connected and used in\
    \ different cases.\n\n## 2. Complex Event Processing\n\nAn event is anything that\
    \ happens. Real-world occurrences can be defined as events that are happening\
    \ over space and time [13,24]. An event instance is a semantic object containing\
    \ data describing the event. Events can be a compound of events that build the\
    \ complex events.\n\nAn event pattern is a template that matches certain sets\
    \ of events [23]. Event filters are constructive views of event sources such as\
    \ an event cloud or event stream\n"
