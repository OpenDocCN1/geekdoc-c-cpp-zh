    D. Pokrywczyński and G. Malcolm Towards a Functional Approach to Modular Ontologies
    65


    # 4. Conclusions


    We have proposed a functional approach to ontologies that focusses on ontologies
    as providing answers to queries. Using institutions and institution comorphisms
    allows us to address heterogeneous ontologies in a language-independent way. Our
    notion of framework captures the situation where queries may be posed to ontologies
    written in different formalisms, and also allows us to generalise the robustness
    of results from [16].


    Our future work will focus on using frameworks for further investigation of properties
    of description logics. In particular we would like to turn our attention to description
    logics with individuals in their signatures. We want to investigate how given
    an institution I can generate its counterpart I'' with individuals in its signature
    and what are the relations between them (morphisms and comorphisms). This allows
    us to consider the problem of querying the instance data, i.e. posting queries
    to ontology with an ABox that stores classes and relations.


