    # Towards Ontology Use, Re-use and Abuse

    in a Computational Creativity Collective


    A Position Statement


    Simon COLTON

    Computational Creativity Group

    Department of Computing, Imperial College, London

    http://www.doc.ic.ac.uk/ccg


    Computational creativity is broadly defined as the study of building software
    which exhibits behaviour that would be deemed creatively exhibited by a person.
    In more practical terms, we investigate how to engineer software that takes some
    of the creative responsibility in arts and science projects which produce culturally
    interesting artefacts such as poems, theorems, paintings, melodies, etc. To this
    end, there are numerous examples of creative software being employed in musical
    composition, visual arts, pure mathematics, natural language generation, scientific
    discovery, video game design, and many more areas of discourse. Moreover, the
    computational creativity community is beginning to come to consensus on some of
    the thorny questions that have arisen, such as: When AI processes are suited to
    generative applications; how can we measure levels of creativity in software;
    and what roles can software play in creative acts? Our contributions to computational
    creativity research have revolved around our two pieces of research software:
    the HR system [2] and The Painting Pool (www.paintingfool.com). The former is
    mathematical theory formation software which can start with the bare minimum about
    a domain of pure mathematics, and end with a rich theory of conjectures, theorems
    and proofs. The latter is an automated painter we hope hope one day be taken seriously
    as a creative artist in its own world.


    The majority of software developed by computational creativity researchers – including
    ours – is given knowledge only about its specific area of application. For instance,
    our HR system is given enough background information about domains of pure mathematics
    to enable it to invent concepts in those particular domains, but is not given
    wider mathematical knowledge and is certainly not provided with information outside
    the sphere of pure mathematics. This is largely acceptable in domains where there
    are objective measures of value with which we can assess the artefacts produced
    by the creative systems. However, we argue in [3] that in certain domains (not
    notably the visual arts), the creativity and intelligence of the creator is taken
    into account when assessing the value of the artefacts that he/she produces. In
    particular, in such domains, the cultural awareness of the artist may well be
    questioned when people assess value of their work. In these situations, there
    is much need for the kind of knowledge stored in ontologies, where creative software
    can use these knowledge to enhance its intelligence, in order to produce more
    interesting and culturally valuable artefacts.'
