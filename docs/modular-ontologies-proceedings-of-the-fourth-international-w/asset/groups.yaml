    # M. Schollemmer / Ontology Modularity, Information Flow, and Interaction-Situated
    Semantics 7


    and integrated distributed description logics [27], to name a few. Their difference
    lies in the varying emphases on different aspects of ontological modelling rather
    than on any fundamental logical dissimilarity. Actually, these formalisms are
    built upon extensions of the classical Tarskian semantics of semantics to first-order
    logic (although logic-independent approaches in the theory of institutions have
    also been advocated and explored [15,24,23]). This is not surprising as first-order
    logic has a special status due to its expressive power, its natural deductive
    systems, and its intuitive model theory based on sets, and logics of it form the
    foundation of current web standards for ontology representation languages.


    # Ontology Modularity and Information Flow


    We shall look, however, at ontology modularity and distributed reasoning in the
    scope of a more general framework, as a particular instance of the flow of information
    that occurs in a distributed information system. For this we shall show how ontology
    modularity and distributed reasoning can be described in channel theory, a mathematical
    theory of information flow put forward by Barwise and Selig [6], and which originally
    arose in the circles of philosophy and computational linguistics, drawing from
    the philosophical underpinnings of Dretske''s analysis of knowledge information
    flow [10] and of Barwise and Perry''s situations [5]. As an abstract account for
    the flow of information in any distributed system, channel theory has also been
    explored as a theoretical foundation for many issues related to ontology modularity
    and distributed reasoning, as the The Information Flow Framework [20], ontology
    mapping and ontology-based semantic integration [17,19], general information integration
    [15], contextual reasoning [9], and system consequence [21].


    Looking at ontology modularity and distributed reasoning from this more general
    angle favours an abstract and unifying view of what counts for distributed reasoning,
    allowing us to go beyond a classical Tarskian semantics and to apply distributed
    reasoning on other understandings of semantics, as for instance-situated semantics
    [1].


    # Meaning and Interaction


    We argue that by computing semantic correspondences of separate terminologies
    focusing on ontologies and ontology alignment based on a classical Tarskian semantics,
    the problem of distributed reasoning is only partially addressed. Modern hermutics,
    initiated by Heidegger and Gadamer, have shown that language is listened to in
    a background, and that interpretation is not independent of the interpreter. Meaning,
    thus, is always re-created in the context of purposes, expectations, and commitments
    the interpreter attaches to its usage or utterance. Meaning is ultimately interaction-dependent
    and relative to an implicit background, which cannot be fully de-contextualized.


    Despite that, current state-of-the-art ontology alignment systems, compute semantic
    alignments generally prior to interaction [11]. This yields several drawbacks.
    On the one hand, it limits the dynamism and openness of the interaction, as agents
    with previously aligned ontologies may participate in an interaction. On the other
    hand, it keeps'
  - '[PAGE 27]


    # 8 M. Schorlemmer / Ontology Modularity, Information Flow, and Interaction-Situated
    Semantics


    semantics out of the context of the interaction. Semantic correspondences are
    established in an interaction-independent fashion.


    But the meaning of certain terms is often very interaction-specific. For example,
    the semantic similarity that exists, in the context of an auction, between the
    Spanish "remate" and the English expression "winning bid" is difficult to establish
    if we are left to rely solely on syntactic-based or structural matching techniques,
    or even on external sources such as dictionaries and thesauri. The Spanish term
    "remate" may have many different senses, and none of them hint at its meaning
    as "winning bid". Its meaning arises when uttered at a particular moment of the
    interaction happening during an auction.


    # Semantic Alignment as a Wittgensteinian Language Game


    We investigate how software agents establish the semantic relationships between
    their respective terminologies on the grounds of their communication by taking
    interaction ontologically prior to meaning. With Wittgenstein''s language games
    [26], the meaning of those terms uttered by each agent actually make *use* of
    them in the interaction, in some respect, can be seen as a simple language game.
    We assume follow certain interaction models, or protocols (the game rules), according
    to which they are allowed to make certain utterances at interaction states. These
    utterances are in the form of illocutionary speech acts whose content are the
    words of the game language (such as "remate" or "winning bid"). When an agent
    listens to an utterance content does not understand, so does it have to guess
    among the possible alternatives regarding its own view of the interaction, assuming
    that all agents are in the same or compatible interaction state.


    The "meaning" an agent attaches to a term, then, is the interaction state transition
    it thinks is the result from the term''s utterance in a speech act, according
    to the agent''s view of the interaction and of the current interaction state.
    As with a language game, the guesses of what the meanings of the words are will
    inevitably lead to a breakdown of the communication: the interaction has not progressed
    in the direction foreseen by the interaction models of each agent. Agents are
    aware of such a breakdown if they are capable of communicating about the interfaces.


    In our model, which builds upon [2], agents follow their own interaction protocol
    and also an alignment protocol in parallel. This alignment protocol is seen as
    a protocol through which the actual communication is carried out: any communication
    act becomes ineffective and has an effective counterpart to the meta-level. In
    addition, agents are endowed with an alignment mechanism used to perform the actual
    matching. Matching elements are reinforced as many interactions are completed
    and deemed semantically related if they trigger compatible interaction state transitions,
    where compatibility means that the interaction progresses in the same direction
    for each agent — although their interaction views (that is, their own interaction
    models) may be more constrained than the interaction that is actually happening.


    From a theoretical point of view, we have based our model on channel theory because-it
    models the flow of information occurring in distributed systems by the con-


