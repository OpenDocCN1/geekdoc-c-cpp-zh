    Euler 推理引擎 [11] 来推理丰富本体模型之外的解释。通过这种方式，我们认为与现有的本体提取方法 [10,8,13,9] 相比，我们的方法扩展了本体模块的语义（见第4节）。我们将本体提取方法应用于医疗领域的知识形变
    [2] 问题，从三个前列腺通路本体 [1] 中提取并合并本体模块，用于治疗决策支持语境。此外，我们提供了我们的方法与少数现有本体提取方法的对比分析。


    ## 2. 基于结构的本体模块提取：概述与方法


