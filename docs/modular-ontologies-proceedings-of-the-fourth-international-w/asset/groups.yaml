    JOANA JOIS 是德国不莱梅大学空间认知研究中心（SFB/TR 8）的助理研究。她是语言学本体“广义上层模型”（Generalized Upper Model）空间模块的开发者，致力于将空间的形式模型与空间语言相结合。她的研究活动重点是不同领域和应用中的模块化空间本体，以及具有不同类型不确定性的本体。


    http://www.informatik.uni-bremen.de/~joana

    joana@informatik.uni-bremen.de


    SAJJAD HUSSIAN 是达尔豪斯大学计算机科学学院 NICHE 研究小组的活跃研究成员。他正在 Raza Abidi 的指导下，攻读“提取与合并上下文化模块化本体”领域的博士学位。他的研究兴趣包括：(i)
    本体论模块化，(ii) 合并的本体对齐，以及 (iii) 本体论调试。他参与了 NICHE 的多个研究项目，并被认为是 Euler 推理引擎开发团队的开发者。


    http://www.cs.dal.ca/~hussain

    hussain@cs.dal.ca


    OLIVER KUTZ 是德国不莱梅大学空间认知研究中心（SFB/TR 8）的博士后研究员。他在空间逻辑、模态逻辑和描述逻辑、对应语义，以及本体的结构化与异构性方面发表了广泛论文。他共同设计了作为网络本体语言
    OWL 2 基础的 SROIQ 逻辑，以及用于模块化本体设计的 E-connections 技术，是 2009 年成立的“本体本体及其应用国际协会”（IAOA）的创始成员。


    http://www.informatik.uni-bremen.de/~okutz

    okutz@informatik.uni.bremen.de


    GRANT MALCOLM 是英国利物浦大学计算机科学系的讲师，在该校他担任逻辑与计算小组的成员。他的主要研究兴趣在于代数规范领域。他的工作涉及隐藏代数、并发系统、计算机病毒学、本体论、代数语义学以及生物系统建模。


    http://www.csc.liv.ac.uk/~grant/

    grant@liverpool.ac.uk


    DANIELE NARDI 是罗马萨皮雅大学信息与统计学系的正教授。教育背景：1981年毕业于都灵理工学院获得电子工程学学位，1984年毕业于罗马萨皮雅大学获得计算机与系统工程硕士。研究兴趣：人工智能、认知机器人、搜索与救援机器人。“IJCAI-91
    出版奖”和“Intelligenza Artificiale 1993”奖的获得者。RoboCup 联合会信托人。“认知机器人团队”研究实验室负责人。


    http://www.dis.unroma.it/~nardi

    nardi@webbo


    BIJAN PARSIA 是英国曼彻斯特大学计算机学院的讲师，在该校他是信息管理小组（IMG）的成员。他发表了关于使用描述逻辑进行本体工程的多个方面，包括解释、模块化、推理优化、可视化以及不确定性的表示。


    http://www.cs.man.ac.uk/~bparsia/

    bparsia@cs.man.ac.uk


    ADRIAN PASCHKE 是柏林自由大学（FUB）的正教授，企业语义网小组（AG-CSW）的负责人。他是信息技术转移中心（CITT）有限公司的研究总监、加拿大
    RuleML 公司的董事，以及柏林语义技术学院（STI Berlin）的副局长。他是 RuleML 网络标准化倡议的指导主席、RuleML 技术小组联合主席、事件处理技术小组的创始成员、OMG
    投票成员以及多个 W3C 小组的成员，例如 W3C 规则交换格式（W3C RIF）工作组（他在该小组担任编辑）。


    http://www.inf.fu-berlin.de/groups/ag-csw

    paschke@inf.fu.berlin.de


