    # S. Hussain & S.S.R. Abidi / 提取与合并上下文化的本体论模块 37


    临床任务，即 (a) 会诊任务；(b) 非会诊任务；(c) 转诊任务以及 (d) 随访任务（以概念的形式表示）。这些任务由其他概念支持，例如医生、决策标准、频率、间隔持续时间、检查、患者病情严重程度、测试结果和治疗。这些本体论中总共有
    90 个概念、69 条规则和 288 个个体。


    ## 5.2. 提取上下文化的本体论模块


    为了建立关于前列腺癌（PC）路径治疗和医生可用性的集成知识，我们考虑了治疗决策支持：


    ```

    C1 = therapeutic-decision-support, {pc-calgary:Clinician, pc-halifax:Clinician,
    pc-winnipeg:Clinician, pc-calgary:Treatment, pc-halifax:Treatment, pc-winnipeg:Treatment},

    {?X pc-calgary:Clinician} => ?X pc-halifax:Clinician),

    {?X pc-calgary:Treatment} -> ?X pc-winnipeg:Followup)

    ```


    C1 由其唯一的 `therapeutic-decision-support` 标注，并由其上下文公理（context-axioms）描述。在 C1 中，上下文公理描述了特定上下文的知识，如
    (i) 加加利医生实现为哈利法医生，(ii) 加加利治疗可以视为温尼湖随访。对于治疗决策支持 C1，用户对提取的模块感兴趣，这些模块描述了 (i) 治疗、(ii)
    它们的持续时间、(iii) 它们的随访、(iv) 它们的设置以及 (v) 相关的从业人员。根据兴趣，治疗和医生被标记为概念。根据用户选择的概念，还提取了结构上连接的规则和个体。提取的本体论模块
    PC-H、PC-C 和 PC-W 通过了概念完整性验证。在 PC-H、PC-C 和 PC-W 中提取的概念（包括它们的断言）是：随访、频率、间隔持续时间和医生。


    ![](img/a1ab54b0915908cfe2088a2d94e_56_0.png)


    图 2 来自 PC 路径的上下文化本体论模块


