  md: 'notations that are widely used. It is not the case that one language or notation
    is ‘better’ than all others, but one may be found more appropriate than others
    for a particular domain or application. In any case, choosing a particular notation
    for ontology restricts the use that may be made of. Most likely, an ontology,
    or its component parts, written in the same language; may be incorporated only
    into other ontologies that are written in the same language; or to combine two
    or more existing ontologies, it may be necessary to translate one of them into
    another language.


    Even within one language, different ontologies may use different vocabularies.
    For instance, this may happen if groups of primary ontology users use different
    natural languages and this concept and role names are from natural languages.
    Again, this makes ontologies difficult to use together. To overcome it we have
    to find a correspondence between the vocabularies, e.g. [10].


    Another problem stems from the requirement that ontology be explicit. It may not
    be convenient, or even possible, to present all the required information explicitly
    in an ontology. Many of the languages used to write ontologies are logics, whose
    semantics provide a notion of conception that provides implicit information. To
    obtain this, it is necessary to query an ontology: to deduce or infer what is
    implicit in the ontology’s statement. We may wish to obtain the induced hierarchy,
    or to access instance data using the ontology (e.g., as in Ontology-Based Data
    Access [6]). Obviously a query may be best obtained when the query and the ontology
    are written in the same language if; if they are not, then the ontology or the
    query may need to be translated into another language.


    Of course a combination of the above problems may appear, so we may have two ontologies
    (or an ontology and a query) expressed in different formalisms, with their vocabularies
    coming from different natural languages. In some sense, those who are developing
    and using ontologies may face problems similar to those the builders of the Tower
    of Babel had. A great amount of work has been spent gathering a great amount of
    knowledge in a vast number of ontologies. But these ontologies are often formulated
    in different languages and use different vocabularies and in many cases we are
    unable to use them.


    As the core of a solution to these problems we propose a fresh view on how ontologies
    are. Contrary to the standard approach our focus is not how the ontologies are
    built or what formalisms are used to construct them, but on the way we can use
    them. We want to identify an ontology with its function. We adopt an abstract
    view of an ontology as a black box providing answers to queries about some vocabulary
    of interest. We call this the functional approach. A similar approach has been
    proposed for knowledge representation by Leques et al. [5] and [22]. Their functional
    work is characterized by determining what it can be told or asked, without taking
    into account the structures used to represent knowledge. This was the foundation
    for designing and implementing a knowledge-representation system called Krypton.


    Identifying the function of ontologies is also important for modularity and application.
    In ontology development, it allows for re-use of existing ontologies and also
    for distributing work among independent groups of designers when developing a
    large-scale ontology. In ontology application, modularity allows reasoning over
    only the relevant part of ontology, thus increasing efficiency.'
