    turn, for large numbers of non-minimal seed signatures. However, these facts do
    not indicate a difference in kind between Tambis and miniTambis and other ontologies
    examined, such as University, or even Koala. Koala and University have unsatisfied
    concepts. The justifications for the unsatisfiable concepts in Koala have a size
    of 5 axioms, whereas University tops out at 9, with most being below 6. miniTambis
    and Tambis''s justifications have a max size of 13 axioms, with a large percentage
    over 6. If our hypothesis about the role of justifications is correct, then it
    seems likely that the exponential break is merely delayed. Thus it is still possible,
    and we believe probable, that an exponential behavior is present but only visible
    with a sufficiently higher timeout. Furthermore, the large size of justifications
    in Tambis and miniTambis is a bit artificial as it is dependent on the unsatisfiability.
    These ontologies have large chains of “dependent” unsatisfiabilities [14] which
    increase the size of justifications along the chain. When the unsatisfiabilities
    are resolved, those concepts will no longer have those lengthy justifications
    as part of all of their modules.


    These considerations suggest that, in general, the ratio between genuine and fake
    modules can be seen as a measure of axiomatic richness, indicating how much the
    axioms in the ontology connect terms: the fewer of its modules, the more “mutually
    touching” its terms.


    Attempting at estimating the module number statistically were unhelpful too. We
    could randomly draw a small number of seed signatures, compute their modules and
    use that to estimate the number of all modules. We convinced ourselves using elementary
    stochastics that we cannot get a confident estimate by sampling only a small portion
    of all seed signatures. See [8] for details.


    While the outcome of the experiments is discouraging from the point of view of
    the complete modularization in order to analyze the ontology, it suggests several
    interesting lines of future work. First, we have already seen several features
    of ontologies that correlate with a large or small number of modules. However,
    except for the phenomenon in Merology, we do not have a verified explanation.
    Thus, for example, we need to get a precise picture of the relationship between
    justificatory and modular structure. Second, even if we cannot compute all modules,
    we may be able to compute a better approximation of their number. Given that signature
    sampling did not seem to help, to explore sources of module number increase or
    reduction, as the shape of the inferred concept hierarchy and patterns of axioms.
    Methodologically, it seems that artificial ontologies should be used, e.g., for
    confirmation of the relationship between justificatory structure and module number.
    Third, our preliminary experiments at computing heavy ontologies are promising:
    our weights seem to capture the cohesion and pulling power of a module, and the
    resulting heavy modules seem to correlate nicely with topics. We are currently
    investigating whether it is possible to compute all heavy modules without computing
    all modules, and also looking into a suitable notion of blocks of modules. The
    latter concept is closely related to fake and genuine modules, which we are also
    investigating in more detail.


