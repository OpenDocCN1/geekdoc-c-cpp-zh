    # 5. Upper-Level Ontology Modules for CEP


    We propose that event processing domain should be described by a modular and layered
    ontology model which can be reused in different application areas. Figure 1 shows
    the upper-level ontology modules for event processing domain, which can capture
    every general top concepts such as event, situation, process, temporal, spatial,
    action, agent concepts. Event ontology includes the core concepts and attributes
    of event and connection between modules can be realized with e.g. ε-connection[16],
    Distributed Logics[4]. A temporal ontology captures all of the concepts related
    to the happening time of the event and can be seen as time ontology. The spatio
    ontology includes the concepts related to the geological information of the events
    and answers questions like, where the event did happen, or where locations are
    related to the event.


    We claim that besides a general top ontology, also specific domain-ontology and
    task/application ontologies are needed. For example, to describe an event about
    "stock quote price change" different attributes are needed than describing an
    event about "a state change of a Web service". It would not be a complete approach
    which covers all application domains. Events can have different relationships
    to each other in different domains but a simple hierarchical relationship between
    events is not satisfying.


    Other specific, task and application ontologies are sub-ontologies of the common
    top ontologies. They represent more concrete specialized concepts for'
