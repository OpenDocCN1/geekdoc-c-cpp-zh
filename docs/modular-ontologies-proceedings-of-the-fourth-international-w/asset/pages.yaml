  pgno: 45
- img_proc: true
  md: 'S. Hussain & S.S.R. Abidi / Extracting and Merging Contextualized Ontology
    Modules


    concepts that are associated with R; and so on. SCOS is to preserve their semantic
    completeness. For a selected concept C, based on SCOS criteria (a) the super-concepts
    of C and their associated roles must be selected; the sub-concepts of C and their
    associated roles must be selected; the roles in C that require a minimum cardinality
    greater than zero, and their role assertions must be selected. It may be noted
    that when the MOVE approach is applied to a connected graph (of an ontology),
    where there exists a path between every two nodes, by the SCOS criteria the extracted
    sub-graph can potentially result in extracting of the graph itself (the whole
    ontology). A more restricted approach compared to MOVE is reported in Seidenberg
    et al., [13], where (i) with SCOS criteria (a)-(c) all super-concepts, sub-concepts
    and restrictions of C are extracted; (ii) their roles and individual are extracted;
    however (iii) sibling of C and sub-property axioms of the extracted roles must
    be extracted. It also restricts the depth-limits of the extracted concept hierarchy
    up to the defined boundary concepts. Notably, Noy et al. [9] propose an extraction
    of ontology by traversing structure, and also restrict expansion of the extracted
    graph by defining boundary concepts. Further restricted extraction is described
    by Miao et al. [8] that extracts ontologies from multiple RDF(S) ontologies. It
    only finds a restricted sub-graph that is induced by the set of selected nodes
    (concepts)-it extracts the selected nodes (concepts, roles, and individuals),
    and does not extract any further concepts, roles and individuals to the selected
    nodes.


    In our approach, we deal with the SCOS criterion differently than the existing
    MOVE and other approaches [10,13,9]. The key feature of our approach is that for
    a given target concept C we restrict the recursive selection of the super-concepts
    of C (as practiced by MOVE) in order to avoid the unnecessary selection of the
    siblings and super-concepts of C that results in the sub-graph to include concepts
    that are not relevant. However for semantic completeness of C and its sub-concepts,
    the super-concepts of C are replaced by blank-nodes, and the roles of C are now
    described with C (extracted blank-nodes). This way, avoids is over-generalized
    by the undesired inclusion of higher levels of concepts that may extend all the
    way to owl:Thing. Furthermore, we improve on the restricted ontology method extraction
    by Miao et al. [8], extending our approach to both RDF(S) and OWL ontologies,
    where our ontology extraction method is applied on the closure of RDF(S) and OWL
    ontologies under their inference rules [15]. For example, for the concept C3 owl:intersectionOf
    (:C1 :C2), based on the OWL inference rules, additional axioms :C3 rdfs:subClassOf
    :C1 and :C3 rdfs:subClassOf :C2 are inferred- provide additional RDF(S) semantics
    for ontologies :C1, :C2 and :C3.


    # 3. Extracting Contextualized Ontology Modules via N3 Rules


    Ontologies and contexts are used to model a domain with different views. Ontologies
    define a shared model that provides a global perspective, whereas contexts are
    used to realize a local aspect of a domain. Contextualizing an ontology deals
    with an adaptation of its ontology method to support a local view [12]. A contextualized
    ontology (module) deals with adaptation of its ontology method to support a local
    view, and provides (i) specific interpretation of its ontology concepts; and (ii)
    implementation of its procedural knowledge that can be applied in a particular
    context [12].'
