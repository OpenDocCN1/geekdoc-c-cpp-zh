    # ## 2. Complex Event Processing


    An event is anything that happens. Real-world occurrences can be defined as events
    that are happening over space and time [13,24]. An event instance is a semantic
    object containing data describing the event. Events can be a compound of events
    that build the complex events. Complex Event Processing (CEP) is about the detection
    of complex events from a cloud of events which are partially ordered by matching
    complex event patterns against event instance sequences. Streams of events are
    processed in one or more event processes to detect the complex events based on
    their time, sequence, senses and semantics. Complex events can be composed or
    derived from other events called its members. Detection of complex events is required
    to be able to define and trigger to the complex events.


    An event pattern is a template that matches certain sets of events [23]. Event
    filters are constructive views of event sources such as an event cloud or event
    stream


    A survey and requirements analysis about the event processing methods is provided
    in [27]. The existing methods for event processing can be categorized into two
    main categories, logic-based approaches and non-logic-based approaches. Based
    on these mechanisms several research prototypes are implemented for complex event
    processing. Some of the event processing approaches are based on the formalizations
    as Finite State Automata [12], Event-Graph [5] or Petri Nets [11]. One of the
    logic-based approaches is introduced in [26] which proposes a homogeneous reaction
    rule for complex event processing, is a combinational approach of event and action
    processing, formal-'
