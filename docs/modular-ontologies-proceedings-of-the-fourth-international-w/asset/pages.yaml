    the tutorial ontology Koala, consisting of 62 logical axioms, is partitioned into
    one A-module animals and three B-modules about genders, degrees and habitats.


    It has also been shown in [7] that certain combinations of these parts would still
    be the whole ontology. In general, partitions were observed to be too coarse;
    sometimes extraction seemed well structured. Furthermore, the robustness properties
    of the parts (e.g., under vocabulary extension) are not as well-understood as
    those of locality-based modules. However, partitions share efficient computability
    with locality-based modules.


    Another approach to GetStruct is described in [2]. It employs the local ModOnt,
    which aims at providing support for working with ontology modules that is similar
    to, and borrows intuitions from, software modules. This approach is logic-based
    and posteriori, to the best of our knowledge, has not examined whether such modules
    provide coverage in the absolute sense. Furthermore, ModOnt does not aim at obtaining
    all modules from an ontology.


    Another procedure for partitioning an ontology is described in [20]. However,
    this method only takes the concept hierarchy of the ontology into account and
    can therefore not provide the strong logical guarantee of coverage.


    Among the a-posteriori approaches to GetOne, provide some logical guarantees such
    as coverage, and others do not. The latter are not of interest for this paper.
    The former are usually restricted to DLS of low expressivity, when considering
    conservative extensions—which underlie tractable. Prominent examples are the ontology
    extraction feature of CEL [23] and the system MES [15]. However, we are at an
    approach that covers DLS up to OWL 2.


    There are a number of logic-based approaches to modularity that function a-priori,
    the modules of an ontology to be specified in advance features that are added
    to the underlying (description) logic and whose semantics are well-defined. These
    approaches often support distributed reasoning; they include C-OWL [22], &-connections
    [17], Distributed Description Logs [3], and Package-Based Description Logs [1].
    In these cases, we may need to understand the modular structure of the syntactically
    defined parts. Furthermore, with imposed structure, it is not always clear that
    structure is correct. Decisions on modular structure have to be taken early to
    avoid misunderstandings. Examples were reported in [7], where user attempts to
    capture the modular structure of their ontology by separating the axioms into
    separate files were totally at all analyzed structure.


    # Overview of the experiments and results.


    In the following, we will report on experiments performed to extract all modules
    from several ontologies as a first solution for GetAll We have considered three
    notions of modules based on syntactic locality—they all provide coverage, but
    differ in the size of the modules and in other useful properties of modules, see
    [19—]—and extracted modules for all subsets of the terms in the respective ontology.
    At this stage, we are mainly interested in module numbers rather than sizes or
    interrelations; the main concern is whether the suspected combinatorial explosion
    occurs. In order to test the latter, we have sampled subsets of each ontology
    and performed a full modularization on each subontology, measuring the relation
    between module number and subontology size for each ontology. We have also tried
    different approaches to reduce the number of modules to the most “interesting”


    ones.'
