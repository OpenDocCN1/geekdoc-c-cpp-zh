    # 6. Conclusion


    In this paper, we proposed a set of metrics for evaluating cohesion and coupling
    of ontologies in modular designs. Through these metrics, we are able to compare
    different ontology modules. We provide theoretical validation for the represented
    metrics.


    For future work, we intend to investigate the association between some attributes
    of modular ontologies such reasoning performance and cohesion and coupling metrics.
    We intend to investigate the cohesion and coupling metrics of modular ontologies
    that are developed based on modular formalisms as IBF and analyze the reasoning
    performance over different modular ontologies with different values for the metrics.


