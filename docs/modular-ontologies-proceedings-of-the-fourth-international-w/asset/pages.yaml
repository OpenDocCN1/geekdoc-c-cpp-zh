    It should be noted, however, that there are very simple families of ontologies
    that already have exponentially many generic modules, i.e., in the worst case,
    an exponential number of modules cannot be evoked. For instance, each axiom of
    the $T_n = \{C_i \subseteq B \mid 1 \le i \le n\}$ has exponentially many (locality
    and dCE-based) modules: each subset of $\{C_1, \dots, C_n\}$ with a seed leads
    to a different $\perp$-module, which contains the axiom $C_i \subseteq B$ if if
    $C_i$ is in this set. For $T_n$, $\perp$ and dCE-based modules, we can add $B$
    to each of these subsets and argue in the same way. This example taxonomy has
    only linearly many generic modules—all $\{C_i \subseteq B\}$. However, if we add
    the axiom $B \subseteq A$ to $T_n$, we obtain an ontology having an exponential
    number of generic modules. Every module $M_J := \mathcal{M}(T, A\Sigma_J)$ is
    generic, where $J$ is a multi-index in the set $\{1, \dots, n\}$ and $\Sigma_J$
    is the set of concepts with indexes belonging to $J$. A relaxation of the generic
    definition does not help because we can replace the axiom $B \subseteq A$ with
    a longer chain or even more complex inclusion structure.


    Other paths lead to exponentially many generic modules include atomic disjointness
    axioms involving simple existential restrictions and conjunctions. For example,
    the taxonomy family $T_n = T_0 \cup \{D_i \subseteq C_i \mid 1 \le i \le n\}$,
    where each $T_i^n$ has only $n+1$ generic modules, each nonempty subset of the
    $n$ paths in the inclusion hierarchy includes thus the most specific module. As
    we add axioms $\{C_i, \neg C_j \mid 1 \le i < j \le n\}$ or $\{C_i \sqsubseteq
    R_{ij} D_j, D_i \sqsubseteq R_{ij} D_j \mid 1 \le i < j \le n\}$ or $\{C_i \cap
    X_{ij}, D_j \cap Y_{ij}\}$, all of combinations become generic modules.


    On the other hand, there are ontologies of arbitrary size that have exactly one
    module, for instance those that consist of non-local axioms or tautologies. Finally,
    each ontology that consists of only atomic subsumption axioms which form a linear
    order $T$- and $\perp$-modules (each prefix or suffix of that) and quadratically
    many $\perp$- and dCE-based modules), while the worst case number of modules is
    high, it is not analytically impossible that real ontologies would have a reasonable
    number of modules. Unfortunately, empirically, as discussed in Section 4, this
    does not seem to be the case.


    Since a module can have several seeds, we represent a module as a pair consisting
    of $M$ and the set $S$ of all minimal seeds $\Sigma$ for which $M$ is a module.
    Whenever a new seed signature $\Sigma''$ is to be computed, first check whether
    $\Sigma''$ satisfies $\Sigma'' \subseteq \Sigma'' \subseteqsubseteq \Sigma$ for
    some already extracted module $\mathcal{M}$ and some associated minimal seed $\Sigma$.
    If this is not the case, the module $\mathcal{M}'' = x-mod(\Sigma'', \O)$'
