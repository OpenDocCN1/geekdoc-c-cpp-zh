    # ## 5. Conclusions and further work


    In this paper, we introduced the use of ontology design patterns and best practices
    into our rescue robotics project, through the design of an ontology for a robotic
    application field: urban search and rescue. In fact, USAEnv describes unstructured
    indoor environments, to improve human-robot interaction awareness during US missions.

    The adopted representation formalism, OWL, fosters ontology reuse and sharing.
    This is relevant to both developers, who can extend and modify the ontology, and
    end users. In fact, USAEnv can be shared among different users: rescue personnel,
    robots, hardware devices in smart or symbolic environments. Best practices lower
    the modelling effort; furthermore, they produce high-quality artifacts that allow
    to reuse and share specific modules of the ontology.


    USAEnv is still at a preliminary stage. Keeping in mind the advantage of ontology
    reuse, in particular general ontologies, our future work is to model spatial relationships
    importing USAEnv fragments of upper-level ontologies that cover this aspect: for
    example, DOLCE or BFO. Furthermore, we aim at exposing patterns of USAEnv as standalone
    content ontology design patterns, in order to motivate the robotic and rescue
    community to reuse them. Our aim is to integrate USAEnv into our robot interface
    for rescue activities and to evaluate its effectiveness through intensive experiments,
    for example during RoboCup competitions.


