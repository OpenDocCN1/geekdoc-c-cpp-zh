    # 5. Experiment and Results: Extracting and Merging Contextualized Ontology Modules
    for Prostate Cancer Management


    In this experiment, we demonstrate the context-driven merging of three location-specific
    prostate cancer (PC) clinical pathway ontologies to generate a comprehensive therapeutic
    PC work-flow knowledge for the problem-context therapeutic decision-support. Each
    PC ontology stipulates the care processes based on tasks, treatments, actors and
    resources pertinent to local conditions. The objective of this experiment is to
    generate-a more comprehensive PC ontology, whereby one can suggest alternative
    treatments or extensions over one location based on knowledge contained in other
    PCologies. For instance, if location L1 is prescribing I1 for condition C, and
    location L2 is prescribing I2 for condition C'', where conditions C and C'' are
    similar to each other, then one can only satisfy clinical pragmatics, that condition
    C (or C'') can be treated by therapies I1 and I2. Likewise, if location L3 has
    no information about how to handle condition C (or C''), the same inference can
    be applied to suggest interventions I1 and I2.


    In order to fulfill the desired-problem (i.e. therapeutic decision support), we
    demonstrate the context-driven merging of three location-specific PC ontologies
    by first (i) extracting contextualized PC ontology modules based on the given
    problem-context; and (ii) generating a networked PC ontology by merging contextualized
    ontology modules under domain-specific and context-specific axioms to obtain a
    comprehensive work-flow knowledge for the problem-context therapeutic decision
    support.


    # 5.1. Prostate Cancer Pathway Ontologies


    We used three Prostate Cancer (PC) ontologies that describe PC clinical pathways,
    namely (i) PC Halifax Pathway (denoted as :PC-H); (ii) PC Calgary Pathway (denoted
    as :PC-C); and (iii) PC Winnipeg Pathway (denoted as :PC-W). Each PC ontology
    is defined using RDF(S) and OWL classes, with several major types of'
