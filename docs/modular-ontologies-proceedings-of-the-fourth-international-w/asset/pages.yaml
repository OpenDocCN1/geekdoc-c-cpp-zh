  md: '# S. Colton / Towards Ontology Use, Re-Use and Abuse in a Computational Creativity
    Collective


    We adhere to the maxim that Good Art Makes You Think, as espoused in [4]. Unfortunately,
    the majority of artworks generated entirely by computer are rather decorative
    in nature, hence we are unlikely to be as culturally important works. In contrast,
    we aim for the artefacts produced by the collective to designed to encourage the
    consumer to engage their mental faculties when interpreting the pieces. For instance,
    in the work described in [6], entirely independently of any input from ourselves,
    the software downloaded a news story about the war in Afghanistan from The Guardian''s
    newspaper''s website, and in response, produced a collage of paintings involving
    a bomber plane, a family and a girl in ethnic headwear, which forces the viewer
    to think about the issues raised in the news story. This highlights a rather direct
    in which computer generated art can make people think. There are a number of other
    ways in which this can be achieved, through metaphor, disguise, shock, humour,
    satire, etc. Each of these methods will need information about how the world fits
    together, in order to produce a coherent artefact to the consumers. This is where
    we envision the usage of ontological knowledge bases to be paramount in order
    for the software in the collective to appreciate the nature of the artefacts it
    produces.


    We also believe that the abuse of ontologies will be fruitful for creative purposes.
    In particular, we are interested in using ontologies in the exact way how they
    are normally used: in create rather than resolve ambiguity and to suggest how
    the world does work; rather than explain how it does. Ambiguity is an essential
    part of the artistic process, where artefacts are designed to be interpreted in
    many different ways by different people often often cannot be too literal (naive)
    in conception. The fact that a piece of art is interpreted in very different ways
    by different people adds much to the value of the artwork. We believe that looking
    at how ontologies have been designed to minimise ambiguity may help guide artefact
    consumers to — eventually interpret artworks in appropriate and enlightening ways.
    In addition, we envision working in ways to which we use common knowledge, and
    possibly more focused knowledge, to determine what is true, can be, and what is
    entirely fantastic, via the analysis of ontologies of real world knowledge. Such
    imaginative behaviour is central to creative processes in people and computers.
    We plan to further research the possibilities for the productive use of ontologies
    to make our creative software culturally aware; the productive re-use of ontologies
    for new domains, in the pursuit of analogical reasoning, the construction of metaphors,
    etc.; and the productive abuse of ontologies for imaginative and playful purposes.
    To this end, we look forward to working closely with the various communities working
    in ontology design.


