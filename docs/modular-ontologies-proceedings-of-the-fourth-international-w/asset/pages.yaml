    # 3.5. Dealing with Concept Axioms for Extracted Concepts


    For an extracted concept C in ontology module O'', it is deemed required to extract
    all others that are structurally-connected through the axioms of C–so that the
    complete semantics of C is still preserved in O''. Concept axioms, by which C
    can be structurally-connected with other concepts, are Sub-concept, Equivalent-class,
    Complement-of and Restriction. Extraction of concepts that are structurally-connected
    with C through its concept axioms, is done by the following N3 rules:


    Sub-concept: The sub-concepts of a C are also extracted in O'':


    ```

    {?7 sbot:extract ?7C ; a rdfs:subClassOf ?7S.} => =

    {?7 sbot:extract ?7S}, where rdfs:subClassOf a owl:TransitiveProperty.

    ```


    Equivalent-class: The equivalent concepts C are also extracted in O'':


    ```

    {?7 sbot:extract ?7C ; owl:equivalentClass ?7S.} => {?7 sbot:extract ?7S},\ where
    owl:equivalentClass a owl:SymmetricProperty, owl:TransitiveProperty.

    ```


    Complement-of: The concepts that are complement with C are also extracted in O'':


    ```

    {?7 sbot:extract ?7C ; owl:complementOf ?7S.} => {?7 sbot:extract ?7S}.

    ```


    Restriction: The concepts that impose restrictions on C are also extracted in
    O'':


    ```

    {?7 sbot:extract ?7C ; a rdfs:subClassOf ?R.

    R R a owl:Restriction} => {?7 sbot:extract ?7R}.

    ```


    # 3.6. Dealing with Role Axioms for Extracted Roles


    Role axioms, by which an extracted role P be structurally-connected with other
    roles, are Sub-property, Equivalent-property and Inverse-property. Similarly to
    the approach-concept axioms of C, extraction of roles that are structurally-connected
    with P, through its role, is done by the following N3 rules:


    Sub-property: Implicitly done by the rule Sub-concept (see Section 3.2 and 3.5).


    Equivalent-property: The equivalent roles of P are also extracted in O'':


    ```

    {?7 sbot:extract ?7P ; owl:equivalentProperty ?7P} => =

    {?7 usr:selected ?7P}.

    ```


    Inverse-property: The inverse roles of P are also extracted in O'':'
