  md: '# D. Krywczyński and G. Malcolm / Towards a Functional Approach to Modular
    Ontologies


    To say that some part of an ontology is a module means that this part may function
    independently. Therefore we have to set the context in which the ontology (and
    its part) are function. That is, we have to fix a language that will be used to
    answer queries. This allows us to say that two ontologies are equivalent in a
    fixed language they give the same answers to all queries over a fixed vocabulary.
    For a module of an ontology, we say that it functions independently if in a fixed
    language both the module and the entire ontology give the same answers to all
    queries over a fixed vocabulary.


    These intuutions are reflected in the concept of inseparability, which relates
    two ontologies that give the same answers to all queries over a fixed language.
    In the standard approach two ontologies are indistinguishable if and only if they
    have the same axioms. But as observed in [25] computing the syntactic difference
    between ontologies consisting of axioms is hardly useful. Whereas in the functional
    approach two ontologies are indistinguishable with respect to some vocabulary
    Σ if they are inseparable wrt the query language over Σ, regardless of what the
    axioms are and what formalisms these. One of the benefits of this is that big
    ontology can freely use a part which has the same consequences relative to the
    vocabulary of interest: we say that this part of an ontology can ‘function independently’.
    Similarly, we can freely replace different ontologies with each other if they
    are indistinguishable in the functional approach. In [16], Konev et studied inseparability
    for a variety of description logics, and proposed robustness properties, which
    were able to relate to standard properties through modularisation, as interpolation
    properties. Our goal in this paper is to generalise their results in a way that
    is independent, as far as possible, from the particular formalisms in which ontologies
    are expressed.


    The relationships between many ontology languages are well understood, and translating
    between them, or embedding them into other languages, is often straightforward.
    Of course, the details of how one particular ontology is translated into another
    are necessary ad hoc. In this paper, we introduce a framework that captures the
    signature of a ‘global’ ontology language and a ‘query’ language can be translated,
    in a more general and abstract way. To do this, we use institutions, which were
    introduced by Goguen and Burstall [11, 13] to treat logics with model-theoretic
    semantics in a systematic way. A great logics can be represented as instances
    [9], including many logics for specifying ontologies [21]. An advantage of this
    is that also allow a systematic treatment of translation between languages, and
    recent research has applied this to problems such as alignment and integration
    [17,19,20.26,29]. Within a framework, it is possible to capture a general notion
    of consequence, whereby an ontology answers a query, when both are translated
    into the global language. This in turn gives rise to a language-independent notion
    of inseparability. Frameworks and inseparability are introduced in Section 2,
    together with some useful results that allow us to work with this general of consequence.


    Our main goal is to study how ontologies may be combined at an abstract level.
    In general, combining ontologies may lead to undesirable results, if the ontologies
    are not, in some sense, consistent with each other. Section 3 generalises the
    robustness properties of [16], and relates these to interpolation properties.'
