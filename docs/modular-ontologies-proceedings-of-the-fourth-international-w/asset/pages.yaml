    # 2.2. Measurement Validation Framework


    In order to validate the set of metrics for measuring ontology cohesion and coupling,
    we use the validation framework which is introduced in [13]. According to this
    framework, for a measurement, entities, attributes, units and scale should be
    specified. Entities are the objects whose characteristics are captured by measurements.
    Attributes are the properties that entities can be, and are formally captured
    by measurements. Units determine how an attribute should be measured and scale
    types are implied by units and can be nominal, ordinal, or ratio.


    A measurement can be indirect, i.e., it is obtained from equation that is based
    on other measurements. Attributes can be multidimensional, i.e., they are derived
    from other attributes. This type of attributes should be measured through compound
    units. Compound units are the units which are constructed from a set of base units.


    For validating a measurement, we confirm attribute validity, unit validity, instrument
    validity and protocol validity. Attribute validity concerns whether the attribute
    is possessed by the entity which is measured through a measurement. Unit validity
    means whether the introduced unit for a measurement can appropriately measures
    the corresponding attribute. Instrument is used for obtaining measured value for
    attributes. Instrument can be theory-based, i.e., the instrument is based on a
    model which how the attribute, which is going to be measured by the instrument,
    becomes apparent in the entity. Instrument validity is concerned with whether
    the modeling for an attribute is valid and the instrument is properly calibrated.
    Finally, protocol validity deals with whether the protocol used for measuring
    is unambiguous and does not have problems such as double counting.


