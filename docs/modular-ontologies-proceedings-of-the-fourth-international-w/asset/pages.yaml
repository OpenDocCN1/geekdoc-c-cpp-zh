    # 2. Preliminaries


    Underlying description logics. We assume the reader to be familiar with OWL and
    the underlying description logics (DLs) [11,10]. We consider an ontology to be
    a finite set of axioms, which are of the form C ⊑ D or C ≡ D, where C, D are (possibly
    complex) concepts, R ��subseteq S, where R, S are (possibly inverse) roles. Since
    we are interested in the logical part of an ontology, we disregard non-logical
    axioms. However, it is easy to addmathfrak and annotation axioms in respect once
    the logical part of a module has been extracted. This is included in the publicly
    available implementation of locality-based module extraction in the OWL API.


    Let Ne be a set of names, and Nr a set of role names. A signature Σ is a set of
    terms, i.e., Σ ⊊ Ne ∪ Nr. We can think of Σ specifying a topic of interest. Axioms
    that only use terms from Σ can be thought of as “on-topic”, and all axioms as
    “off-topic”. For instance, if Σ = {Animal, Duck, Grass, eats}, then Duck Grass
    is on-topic, while Duck Bird is off-topic.


    Conservative extensions and locality. Conservative extensions (CEs) capture the
    above desencapsulation of knowledge. They are defined as follows.


    +   1. O is a deductive conservative extension (Σ-DE) of M w.r.t. L if for all
    G axioms over L ⊆ S, it holds that M ⊢ α if and only if O⊢ α.

    2. M is a dCE-based module for set of O if O is a Σ-DE of M w.r.t. L.


    Unfortunately, CEs are hard or impossible to decide for many DLs, since [9,16,19].
    Therefore, approximations have been developed. We focus on syntactic locality
    (here for short: locality). Locality-based modules can be efficiently computed
    and provide coverage, that they capture all the relevant entailments, but not
    necessarily only for DL SHIQ, it is straightforward to extend it to SHIQ(D) (see
    5.12), and the implementation of locality-based module extraction in the OWL API.
    We use the notion of locality from [19].


    Definition 2 An axiom α is called syntactic (T-local) w.r.t. signature Σ if it
    is of the form C ⊑ C, C ⊑ C⁺, R ⊑ R(R ⊑ Rᵀ), or Trans(R), where C is an arbitrary
    concept, R is an arbitrary role name. R ⊑ Σ(R ⊑ Σ), and C⁺ and Cᵀ are from Bot(Σ)
    and Top(Σ) as defined in Table 1 (a) (Table 1 (b)).


    It has been shown in [5] that M �⊆ O and all axioms in O \ M being L-local or
    all axioms w.r.t. Σ M is sufficient for O to be a Σ-DE of M.


