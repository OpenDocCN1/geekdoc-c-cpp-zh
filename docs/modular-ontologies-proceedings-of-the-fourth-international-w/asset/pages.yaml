    # ## Problem space


    USAR activities are conducted in unstructured environments. An environment is
    unstructured when its integrity is altered by a natural disaster (e.g. earthquake,
    eruptions, and so on) to an artificial event, such as a bomb or a building collapse.
    Because of the many risks within such a site, most of time operators act from
    a remote site, and can acquire a proper situation or human-robot awareness only
    via robotic interfaces. The complexity of the environment, as well as the remote
    robot control, contributes to a high cognitive demanding assessment.


    USAR operations modelling the understanding of two aspects: how to characterize
    an unstructured environment, and what are the main requirements associated with
    the search and rescue workflow. Two studies concerning USAR tasks, environments
    and operator requirements, conducted by Murphy [17], and Chatterjee and Matsuno
    [7], influenced our analysis.


    # ## 2.1. USAR Indoor Environment Characterization


    According to Murphy, a rescue environment is decomposed into three different zones.
    The hot zone is the actual disaster area, accessible through some voids. The warm
    zone is the place where rescue personnel prepares before entering the hot zone.
    Finally, the cold zone is where the command headquarters is set. USAREnv focuses
    only on the hot zone.


    It is very hard to characterize and describe an unstructured indoor environment.
    A priori information, such as project plans, are only partially useful, because
    the environment status is altered. Most of the typical landmarks, for example
    rooms or corridors, may not be significant. A different classification is necessary,
    and it must take into account the peculiar characteristics of USAR activities.
    A site can be divided into areas (or zones). Some of them are accessible through
    openings, while others are only observable, or even completely covered or submerged.
    Every area should be described with useful information for both robot deployment
    and human responders. This description is a set of area conditions. What characterizes
    an area within a rescue site is completely different from a structured environment.
    Examples of area conditions can be:


