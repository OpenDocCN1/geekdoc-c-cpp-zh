    \ for representing ontologies. OWL-DL is\nbased on Descriptionics (DLs) that provide\
    \ strong basis for defining and formalizing\nontology languages.\nFor describing\
    \ a domain of discourse, different designs are imaginable for ont-\ngies. One\
    \ possible ontology is the monolithic design, i.e., all captured concepts,\nroles,\
    \ axioms, and assertions of the domain are gathered in a monolithic ontology,\
    \ e.g., in\na single OWL file in the case of OWL-DL ontologies. Another approach\
    \ for designing\ntologies is a modular approach, i.e., the domain is described\
    \ by a set of ontologies,\ncalled as modular ontologies, each of which is a sub-domain\
    \ of discourse. Sub-\ndains of a domain may have dependencies to each others.\
    \ Hence, their correspond-\ning ontology modules cannot be represented independently.\
    \ An ontology module may\need to refer to symbols of other modules. OWL-DL has\
    \ an 'import' feature that can\nbe used for integrating different ontology modules\
    \ and allowing them to have references\nto external systems from other modules.\
