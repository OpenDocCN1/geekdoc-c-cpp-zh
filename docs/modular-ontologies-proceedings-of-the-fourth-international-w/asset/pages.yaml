  md: 'isolation This guarantee is provided by modules based on conservative extensions,
    but also by efficiently computable approximations, as locality-based modules.


    The task of extracting one module given a signature, which we call GetOne in this
    section, is well understood and starting to be deployed in standard ontology development
    environments, as Protege 4 and online. The extraction of locality-based modules
    has already been used effectively in the field for ontology reuse [13] as well
    as a subservice for incremental reasoning [4].


    While GetOne is an important and useful service, it, itself, tells us about the
    modular structure of the ontology as a whole. The modular structure is determined
    by the set of all modules and their inter-relations, or at least a suitable subset
    thereof. We call the task of a-posteriori determining the modular structure of
    an ontology GetStruct, and in order to determine that, investigate here the GetAll
    of extracting all modules. While GetOne is well-understood and computationally
    cheap, GetAll has hardly been examined for module notions with strong logical
    guarantees, with the work described in [7] being a promising exception. GetOne
    also requires the user to know in advance the right set of terms to input to the
    extractor: we call this a signature for the module and note that one module can
    have several signatures. Since there are non-obvious relations between the final
    signature of a module and its seed signature, users are often unsure how to generate
    a proper request and confused by the results. If they have access to the overall
    modular structure of the ontology determined by GetAll, they could use it to guide
    their extraction choices. In general, supported by the experience described in
    [7], we believe that, by revealing the modular structure of an ontology, we can
    obtain information about its topicality, connectedness, structure, superfluous
    parts, or agreement between actual and intended meaning. Our use-cases include:
    for ontology engineers, the module relative to some terms corresponds to the intuitive
    “knowledge encapsulation” about that term; for end users, the possibility of supporting
    the understanding of what the ontology deals with, and the topic they want to
    focus on is placed within the ontology.


    In the worst case, the number of all modules of an ontology is exponential in
    the number of terms or axioms in the ontology, in fact the minimum of these numbers.
    Hence, it is possibly the case that ontologies have too many modules to extract
    all of them, even with optimized extraction methodology. Even with polynom many
    modules, there may be too many for direct user inspection. Then, some other form
    of analysis would have to be designed.


    In this paper, we report on experiments to obtain or estimate this and to evaluate
    the modular structure of an ontology where we succeeded to compute it.


    Related work. One solution to GetStruct is described in [7,6] via partitions related
    to E-. The resulting modules are disjoint, and this technique is of limited application—when
    it succeeds, it divides an ontology into three kinds of modules: (A) whose import
    vocabulary from others, (B) whose vocabulary is imported, and (C) isolated parts.
    In experiments and user experience, the number of parts extracted were quite low
    and often usedfully for user understanding. For instance,


