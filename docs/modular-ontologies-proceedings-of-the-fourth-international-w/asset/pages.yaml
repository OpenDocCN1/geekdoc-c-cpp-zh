    # 5.2. Extracting Contextualized Ontology Modules


    To establish an integrated knowledge about the treatments and clinician availability
    for the PC pathways, we consider a problem-context therapeutic decision support:


    ```

    C21 =<therapeutic-decision-support, {pc-calgary:Clinician, pc-halifax:Clinician,
    pc-winnipeg:Clinician, pc-calgary:Treatment, pc-halifax:Treatment, pc-winnipeg:Treatment},
    0,

    {?X a pc-calgary:Clinician} => ?X a pc-halifax:Clinician),

    {?X a pc-calgary:Treatment} -> ?X a pc-winnipeg:Followup)

    ```


    C21 is annotated by its unique label therapeutic-decision-support and described
    by its context-axioms. In C21, context-axioms describe context-specific knowledge,
    as (i) Calgary-Clinicians are to be realized as Halifax-Clinicians and (ii) Calgary-Treatments
    can be viewed as Winnipeg-Followups. For therapeutic decision support context
    C21, the user is interested in such extracted ontology modules that describes
    only (i) the treatments, (ii) their durations, (iii) their follow-ups, (iv) their
    care-settings, and (v) the practitioners involved for them. Based on user interest,
    two Treatment and Clinician were labelled as concepts. Given the user-selected
    concepts, their structurally-connected concepts, rules and individuals were also
    extracted. The extracted ontology modules OPC-H <c OPC-H, OPC-C <c OPC-C and OPC-W
    <c OPC-W were validated for conceptual consistency and completeness. Concepts
    (including their axioms and assertions) that were extracted in OPC-H, OPC-C and
    OPC-W are Followup, Frequency, Interval Duration, and Clinician.


