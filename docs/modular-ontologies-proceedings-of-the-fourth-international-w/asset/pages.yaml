  md: '# Overview of Contributions


    The invited speakers for WoMO 2010 addressed rather general and somewhat unconventional
    issues related to modularity in ontologies.


    SIMON COLTON, in his talk “Towards Ontology Use, Re-use and Abuse in a Computational
    Creativity Collective”, described the Computational Creativity project, and in
    particular, possibilities for using techniques such as automated formation and
    analogical reasoning for ontological engineering, and how ontological modularity
    will have a role in more creative reasoning via the collective.


    In the second invited talk, titled “Ontology Modularity, Information Flow, and
    Interaction-Situated Semantics”, MARCO SCHORLEMMER sketched the landscape of modularity
    and discussed the interesting topic of the role of channel theory and information
    flow, as introduced by Jon Barwise and Jerry Seligman, with respect to ontological
    modularity and meaning negotiation.


    The contributed papers of WoMO 2010 covered a wide range of topics, from mathematical
    foundations, to empirical evaluations of modularity, extraction and merging of
    modules, as well as applications in areas as complex event processing and robotics.


    The paper by DEL VESCO, PARSIA, SATTLER, AND SCHNEIDER, “The modular structure
    of an ontology: an empirical study”, gives an empirical analysis of the problem
    and the feasibility of extracting all modules of real-life ontologies, based on
    the concept of locality-based modules. They in particular discuss what extent
    revealing the structure of an ontology in this way allows to obtain information
    about its topicality, connectedness, structure, superfluous parts, or agreement
    between actual and intended modelling.


    HUSSAIN ABIDI present a method for extracting ontology modules in “Extracting
    and Merging Contextualized Ontology Modules”. The extraction is based on a user-defined
    selection, which indicates those parts and constructs of an ontology that are
    relevant for the module extraction. The method is particularly applicable to the
    healthcare domain.


    In a Metric Suite for Evaluating Cohesion and Coupling in Modular Ontologies”,
    ENSAN AND DU give another perspective on the evaluation problem on modular ontologies.
    They introduce semantic metrics for measuring cohesion and coupling in ontologies.
    The calculation of these metrics is based on analysing relativeness and dependencies
    between local symbols and local and external symbols of modules. In particular,
    the authors use the “Kitchenham” metric validation framework in order to examine
    their presented metrics.


    POKRYWCZYNSKI AND MALCOL continue a tradition to use the abstract framework of
    institutions in engineering. In “Towards a Functional Approach to Modular Ontologies
    using Institutions”, they propose a general notion of framework that, irrespective
    of the formalisms being used, allows a global language into which both an ontology
    language and a query language can be translated. They then generalisations notions
    of robustness and conservativity in the heterogeneous case and their role for
    modularity.'
