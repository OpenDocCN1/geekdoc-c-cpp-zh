  md: '# Towards a Functional Approach to Modular Ontologies using Institutions


    Daniel POKRYCZYŃSKI a,1 and Grant MALCOLM a

    Department of Computer Science, University of Liverpool, UK


    Abstract. We propose a functional view of ontologies that emphasises their role
    in determining answers to queries, irrespective of the formalism in which they
    are written. A notion of framework is introduced that captures the situation of
    a global language into which both an ontology language and a query language can
    be translated, in an abstract way. We then generalise existing notions of robustness
    from the literature, and relate these interpolation properties that support modularisation
    of ontologies.


    Keywords. Ontologies, modularity, integration, institutions, interpolation


    # Introduction


    In what we might term the standard approach, an ontology is a communicative, essential
    syntactic artefact. Gruber''s definition [15], ''an ontology is an explicit specification
    of a conceptualization'', is often elaborated to maintain explicitness of ontologies
    while also capturing their semantic use in sharing information. For example, Studer
    et al. [27] combine Gruber''s definition with that of Forst [4], giving what has
    become a standard definition: ''an ontology is a formal, explicit specification
    of a shared conceptualization''. This emphasis on sharing information is also
    present, for example, in Uschol and Grüninger''s [28] statement that an ontology
    is ''used to refer to the shared understanding of some domain of interest''.


    In the standard approach, the function of an ontology is to state, explicitly,
    a conceptualisation. However, as well as reading and writing ontologies, in practice
    one wants to use existing ontologies, to browse their induced concept hierarchy,
    or to access data, or perhaps to create a new ontology that extends either entire
    ontology or manageably small fragment of one. Or perhaps one may want to test
    whether one ontology is in some way consistent with another, or provides the same
    information regarding some subset of concepts. Using ontologies in these ways
    may raise some problems.


    One problem stems from the requirement that ontologies be formal. It obviously
    requires a precise language, and a large number of languages have been developed
    specifically for writing ontologies. The majority of these are formal languages,
    though there are also a number of graphical


