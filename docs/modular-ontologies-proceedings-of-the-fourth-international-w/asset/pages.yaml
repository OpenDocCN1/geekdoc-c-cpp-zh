    and axiomatic assertions are defined based on a structured vocabulary V = ⟨C,
    R⟩, comprised of concepts C and roles R. Taxonomy (concept axioms and roles axioms)
    T are of the form C ⊑ (D ⊑ S) or C ≡ (D ⊑ S) such that D, C ⊑ C, S �� R. For a
