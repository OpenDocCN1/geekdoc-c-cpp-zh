    # 6. Module Discovery and Development.


    We used a semantic-driven strategy [33] for our work on event modularization.
    We tried to extract relevant fragments of ontologies with special meanings and
    found modules which make sense for the final users [15] in different use cases
    of SCEP. For the module discovery and development, we followed the following steps:


    +   * Step-One: Investigation of existing ontologies: We investigated the existing
    event ontologies which are specified in the other research fields. We observed
    that each of these ontologies are developed for different use cases, and based
    on the target use case define different concepts. Comparing the existing ontologies,
    we can find a common set of concepts and attributes which are defined in several
    existing ontologies e.g. the conceptualization of events. It is clear that a common
    set of concept cannot fit the needs of different applications for event attributes.
    It seems impossible to develop a single event ontology which can fit to all the
    requirements of different applications. However, it is possible to identify the
    core aspects of events like: type, place references, time (period or moment),
    etc. It can also be observed that the same concepts are represented in different
    ontologies with different attributes.


    +   * Step-Two: Ask questions about the factual aspects of events: Our second
    step was to ask questions about the domain of events. We found the following journalistic
    questions about events very interesting to extract the most important factual
    aspects of events.


    +   * What happened?

    * When it happened?

    * Where did it happen?

    * Who is involved? Who reported it?

    * Why did it happen?

    * How did it happen?

    * What else can be said about the event?


    The answers for each of these questions can define one of the important aspects
    around events. These answers can be represented in different ontologies, because
    they are general aspects which can be defined in stand ontology modules, like
