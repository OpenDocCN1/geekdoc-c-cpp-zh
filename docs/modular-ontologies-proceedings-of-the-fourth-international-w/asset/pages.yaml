  md: 'The quality of ontologies, as the basic building blocks of Semantic Web applications,
    should be assessed through appropriate measurements. A clear set of metrics and
    measurements for ontology evaluation makes the selection of ontologies for different
    applications more accurate. It also enhances the process of ontology design and
    development by providing of guidelines of how should a good ontology look like.
    The emerging desire for developing ontologies in a modular manner highlights the
    growing need for measures and metrics for evaluating modular ontologies. As yet,
    no widely accepted measurements have been introduced for assessing modular ontologies.


    Cohesion and coupling are two important measures that can be employed for evaluating
    modular ontologies. Cohesion refers to the uniformity of an ontology module and
    coupling refers to the interdependencies that exists between ontology modules.
    High cohesion and low-coupling in modular ontologies lead to better understandability,
    reusability and evolvability.


    There are a few proposals in the literature that investigate the notions of cohesion
    and coupling for ontologies. In [20], the cohesion of an ontology is investigated
    through structural metrics such as the number of leaf classes and average depth
    of inheritance. In [17], coupling of an ontology is measured by counting the number
    of external classes that are used for defining classes and properties in the ontology,
    the number of references to external classes and the number of includes at the
    top of the ontology file. In [15] a set of metrics are introduced for measuring
    cohesion of ontologies. These metrics are: Number of Ontology Partitions (NOP),
    Number of Minimally Inconsistent Subsets (NMIS) and Average Value of Axiom Inconsistencies
    (AVAI). These metrics are obtained based on the semantic of a given ontology,
    rather than its syntax. The focus of these metrics is mostly on inconsistencies
    that may be induced by ontology axioms in a changing and dynamic context.


    In this paper we are introducing cohesion and coupling metrics for evaluating
    DL-based modular ontologies. For defining cohesion and coupling metrics, we provide
    definitions for dependencies and relations between local symbols of ontologies
    (as a basis for cohesion) and between their local and external symbols (as a basis
    for coupling), considering the semantic of ontologies. In view of the fact that
    the local and external dependencies between symbols, either explicitly asserted
    or not, will be taken into account for the sake of assessment and measurement.
    We also present the theoretical validation of the metrics based on the Kitchenham
    [13] metric validation framework.'
