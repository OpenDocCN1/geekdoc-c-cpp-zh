  md: 'cessing and knowledge constraints pertaining to the problem-context at hand.
    The rationale for extracting contextualized ontology modules is that working with
    the larger ontologies leads to the introduction of irrelevant concepts to the
    required knowledge model for a specialized problem, which in turn not only extends
    the deductive closure of the model undesired interpretations but also compromises
    the efficiency, complexity and granularity of the knowledge model. Therefore,
    for solving specialized problem in large domains there is need to extract an ontology
    module that offers a consistent fragment of the source ontology.


    Structure-based ontology module extraction [10,13,9,8,14] is usually guided by
    a particular problem-context that leads to the selection, adaptation, reconciliation,
    or merging of concepts from multiple extracted ontology modules [5]. However,
    the challenge is to ensure that a merged ontology module does not lead to (i)
    differences in domain conceptualization, (ii) logical contradictions, and (iii)
    inaccurate realizations of the concepts and their roles as per context, these
    issues render the ontology module to become inconsistent [6]. In this case, it
    is important that the extracted ontology module is semantically consistent. A
    contextualized ontology module deals with a fragment of its original ontology
    model, and provides (i) specific interpretation of its ontology concepts; and
    (ii) implementation details of its procedural knowledge for the problem-context
    at hand.


    In this paper, we explore the problem of ontology module extraction and present
    a structure-based method for extracting contextualized ontology modules using
    N3 rules [4]. Based on the complete inference rules for RDF(S) and OWL in [15],
    we extract an ontology module—that comprises of axioms and assertions for user-selected
    concepts and their structurally connected concepts, roles and individuals—from
    its source ontology. Although our extraction rules can be used by various Semantic
    reasoning engines, we use Euler inference engine [11] to infer interpretations
    beyond ontology-rich ontology model. In this way, we argue that our approach extends
    the semantics of the ontology module compared to the offered by existing ontology
    extraction approaches [10,8,13,9] (see Section 4). We have applied our ontology
    extraction method for the problem of knowledge morphing [2] in the healthcare
    domain, where we extract and merge ontology modules, from three prostate pathway
    ontologies [1], for the context of therapeutic decision support. Furthermore,
    we provide a comparison of our approach with few existing ontology extraction
    approaches.


    # 2. Structure-based Ontology Module Extraction: Overview and Approaches


    For structure-based module extraction, a source ontology is considered as an un-directed
    graph, and an extracted ontology module is a sub-graph that describes the knowledge
    about the selected concepts for the context [10,13,9,8,14]. One of the initial
    attempts at ontology module extraction is the Materialized Ontology View Extraction
    (MOVE) process [10], where an ontology module is extracted based on the Requirements
    Consistency Optimization Scheme (RCOS) and Semantic Completeness Optimization
    Scheme (SCOS). Given a source ontology, MOVE allows to label both concepts and
    roles as selected or un-selected. For a selected role R, based on RCOS criteria,
    MOVE extracts (i) concept axioms for R; (ii) role assertions for R and the concept
    axioms for'
