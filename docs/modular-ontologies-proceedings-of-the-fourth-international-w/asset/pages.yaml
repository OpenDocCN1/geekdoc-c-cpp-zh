  md: 'viii


    In “Introducing ontology best practices and design patterns into robotics: USARE”,
    RANDELLI AND NARDI present an ontology for unstructured environments in the context
    of urban search and rescue activities. Among other information, the ontology specifies
    disaster cases, site types, and localisations. The authors further analyse the
    use of ontology design patterns and the re-use of existing ontologies to provide
    an agile implementation and the integration into different contexts.


    The development of ontologies in the field of complex event processing can benefit
    particularly from modularity, as TYMOURIAN and PASCHKE argue in “Modular Upper-Level
    Ontologies for Semantic Complex Event Processing”. They distinguish different
    characteristics and dependencies of complex events and introduce several level
    ontology modules to specify these characteristics respectively. These upper level
    ontology modules can then provide a guideline for developing individual event
    ontologies.


