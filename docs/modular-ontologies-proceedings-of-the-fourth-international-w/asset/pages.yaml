    Event Processing 91


    # CEP Bridge Ontology


    ![](img/a1ab54b0915908c6fe20ac887a02d94e_110_0.png)


    Figure 2. Event Processing Bridge Ontology


    investigated to discover their common part for building lightweight ontology modules.
    We described our semantic method for discovering ontology modules around the concept
    of events, and used the journalistic questions to find the factual aspects of
    events. The main concepts of each modules are also described in short form.


    In the future, we will work on usage tests of these modules in some of the selected
    use cases to investigate their reliability. We will use these usage tests to evaluate
    the ontology modules and improve the quality of their implementation.


