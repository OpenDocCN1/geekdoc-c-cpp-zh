    defined by the form of C(a) or R(b, c) such as C ⊑ R, R ⊑ a, b, c ⊑ I. The semantics
    of an ontology is defined by an interpretation that provides mapping for (i) ontology
    individuals, (ii) ontology concepts and (iii) ontology roles as (a) elements of
    the domain, (b) subsets of the domain and (c) binary relations on the domain,
    respectively. A model of an ontology is an interpretation, under which all ontology
    axioms are satisfied. An ontology is called consistent if there exists a model
    for it. An ontology that has no model is called inconsistent ontology [6].


