  md: '# # Preface


    Oliver KUTZ, Joana HOIS, Jie BAO, and Bernardo CUENCA GRAU


    #  Modularity Ontologies


    Modularity, in its different shapes and forms, remains one of the central research
    topics in ontology engineering. An already huge and ever-growing number of ontologies
    can be found on the Internet. These ontologies vary dramatically in terms of subject
    matter, levels of specification and detail, (intended) purpose and (actual) application.
    Not only is it difficult to determine and define interrelations between distributed
    ontologies, with contributions from different sources covering different parts
    of a single domain, is it challenging to reconcile (potentially inconsistent)
    ontologies each of covering a particular aspect of the same domain, to extract
    relevant parts of an ontology, or to re-combine, in various ways, small ontologies
    to form new, larger ones.


    Still catching up with 40 years of research in software engineering, ontology
    modularity is envisaged to allow mechanisms for easy and flexible release, generalization,
    structuring, maintenance, design patterns, and comprehension. Applied to ontology
    engineering, modularity is central not only to reduce the complexity of understanding
    ontologies, but also in maintaining, querying and reasoning over modules. Distinctions
    between modules can be drawn on the basis of structural, semantic, or functional
    aspects, which can also be composed of ontologies or to indicate links between
    ontologies.


    In particular, reuse and sharing of information and resources across ontologies
    depend on purpose-dependent, logically versatile. These purposes include ''tight''
    logical integration of different ontologies (whole or in part), ''loose'' association
    and information exchange, the detection of overlapping parts, traversing through
    different ontologies, alignment of vocabularies, module extraction possibly respecting
    privacy concerns and hiding of information, etc. Another important aspect of modularity
    in ontology is the problem of evaluating the quality of single modules or of the
    achieved modularization of an ontology. Again, such evaluations are based on various
    (semantic or syntactic) criteria and employ a variety of statistical/heuristic
    or logical methods.


    Recent research on ontology methodology has produced substantial results and approaches
    towards foundations of modularity, techniques of modularisation and modular developments,
    distributed reasoning and empirical evaluations, providing a foundation for further
    research and development. Since there has been growing interest in the modularisation
    of ontologies, modular development of ontologies, and information exchange across
    different modular ontologies. In real life, however, integration problems are
    still mostly tackled in an ad-hoc manner, with no clear notion of what to expect
    from the resulting ontological structure. The adoption of ad hoc methods for combining
    ontologies often leads to unintended consequences, even if the individual ontologies
    to be integrated are widely tested and understood.'
