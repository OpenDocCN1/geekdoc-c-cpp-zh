    # 2. Background


    # 2.1. DL-Based Ontologies


    An ontology (a DL knowledge base) can be defined as $\Psi = (\mathcal{T}, \mathcal{A})$,
    where $\mathcal{T}$ denotes TBox and comprises a set of general inclusion axioms
    $\Psi$ and $\mathcal{A}$ for ABox and comprise a set of instance axioms. The signature
    of an ontology $\Psi$, which is defined as $Sig(\Psi)$, is defined as a set of
    all concept names $(\mathcal{C}_N)$ and role names $(\mathcal{R}_N)$ which are
