  md: '# S. Colton / Towards Ontology Use, Re-Use and Abuse in a Computational Creativity
    Collective


    we argue, in addition to the use of such ontologies, we will also need to re-use
    the knowledge in ontology for situations that it was not conceived for, and also
    to abuse the ontologies, by using them for rather imaginative purposes.


    We are currently engaged in a project to build a computational creativity collective
    of software, knowledge and resources (www.doc.ic.ac.uk/ccg/collective). The purpose
    of the collective will be to bring together software which is able to generate
    different types of artefacts (e.g., poems, pictures, melodies, theorems, etc.)
    in such a way that the output from one process becomes the stimulus for another
    process. In this way, we hope to show that such software – when used in combinations
    – can produce culturally relevant and scientific artefacts of real value to various
    communities. There will be (at least) four arms to the collective. The first arm
    will contain the generative and analytical algorithms for producing artefacts.
    Currently, the collective has more than 100 processes involving image and text
    manipulation, and the retrieval of web material. In addition, it has more than
    50 mashups which combine two or more of these processes. For instance, one mashup
    in the collective retrieves the most current tweets from a twitter user, extracts
    keywords from the tweet, finds images from Google Images which match the keywords,
    and puts the images together into a visual Collage. This kind of text-to-art mashup
    follows from the project described in [6]. the second arm of the collective will
    be a set of reasoning methods which are freely combine the processes in the collective
    automatically. The first instantiation of a combined reasoning process will be
    based on global workspace architectures, in particular, the work described in
    [11]. The third arm of the collective will be source materials (images, sounds,
    music, text, etc.) which can be accessed by the processes in the production of
    the artefacts. Naturally, any artefacts which are produced by the collective will
    be added to this source material.


    The final arm of the collective will be a knowledge base of information which
    can be queried by processes in the collective, and a set of techniques for querying,
    combining and possibly abusing the knowledge base in order to add intelligence
    and imagination to the ways in the collective operate. We envisage the use of
    ontologies to represent the information in the knowledge base, and we hope that
    the creative usage of ontologies will lead to interesting developments in the
    theory of modular ontology design. Researchers interested in computational creativity
    are already turning to ontologies to test their methods, and as sources of information.
    For instance, the work of Veale et al. investigates analogous reasoning for ontology
    construction in [9], and they regularly use ontologies such as WordNet in creative
    fashions, e.g., for the creation of neologisms [8]. We can also claim that the
    automated theory formation routine in HR is a method for ontology construction,
    whereby the concepts in the ontology are invented by the software. A example of
    ontology construction methods might be found in conceptual blending [5], which
    is also regularly used in creativity settings, for instance in the projects described
    in [7]. We envisage that these kinds of knowledge generation engines will form
    an important part of the way in which the collective is used for creative artefact
    generation.'
