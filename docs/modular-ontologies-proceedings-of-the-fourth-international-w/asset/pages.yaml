    # 7. Reusing CEP Ontology Modules


    Reusability is one of the main advantages of decomposing complex systems into
    modules and therefore a key argument for modular ontologies. Instead of creating
    specific ontologies for each use separately, the ability to reuse modules in a
    flexible manner is very important. This presumedge acknowledges the modules and
    how they can be connected and used concertedly. Previous research on ontology
    merging, matching and alignment have pointed out, that it is not realistic to
    use techniques which can do this automatically without the need for human input.
    Especially, if there are heterogeneous modules, which are based on different languages,
    design patterns, granularities etc. In fact, it is necessary to know how to connect
    modules, when they are needed. For reason, we advocate, that an ontology is necessary,
    which describes the modules can be linked to each other. In order to avoid misunderstandings
    it is important to underline that a bridge ontology is not another upper-level
    ontology. It is more a kind of meta-information, describing how to combine different
    ontology modules.


    For the use of the above upper-level CEP ontology modules, we developed a connector
    ontology as shown in Figure 2. This ontology is a bridge ontology for linking
    the developed modules. Based on the case requirements, several bridge ontologies
    might be developed for different combinations of modules. For example, in the
    business activity monitoring (BAM) use only the event, time and process modules
    might be interesting and other modules like space module should not be imported.


