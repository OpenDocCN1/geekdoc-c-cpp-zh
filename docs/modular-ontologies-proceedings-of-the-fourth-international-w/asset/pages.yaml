    \n# 1. Introduction\n\nSemantic Web techniques and ontologies have been increasingly\
    \ applied to real-world\nproblems and domains in the recent years. So far, numerous\
    \ techniques, frameworks and\nmethodologies for ontology development and management\
    \ [6,5] and various proposals\nfor ontology languages [16,12] have been proposed.\
