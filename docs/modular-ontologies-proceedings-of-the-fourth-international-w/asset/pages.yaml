    # Introduction


    In the robotics community, some systems start to adopt some of high-level knowledge

    to accomplish their tasks. In fact, most of the robotic deliberative architectures
    plan

    the actions according to some goals and a given outcome, which requires the capability

    to represent their knowledge and to reason on it. Nevertheless, knowledge representation

    and reasoning modules are very often realized as specialized components, without

    y symbolic representation or without any effective design methodology. As a consequence

    of this approach only robotic experts can control them, and it is very difficult
    to

    thend their functionality and use them.


    On the other hand, the Semantic Web community has promulgated some well known

    standards in knowledge representation formalisms, inference mechanisms and query
    languagges, as the Web Ontology Language (OWL). Even more, many software engineering

    methodologies have been applied to ontology representations, in order to produceneffective
    and high-quality ontology models.


