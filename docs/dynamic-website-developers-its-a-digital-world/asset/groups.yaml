    **hyperlink**–an electronic element that provides access between pieces of information.
    The information can be accessed by clicking a computer mouse on the hyperlink.


    **hypertext**–a computer system that allows users to access information connected
    to what is on screen.


    **mobile**–capable of moving or being moved.'
  - '[PAGE 34]


    network–a system of computers connected by communications lines.


    online–connected to the internet.


    optimization–the act, process, or method of making something as functional or
    effective as possible.


    social media–forms of electronic communication that allow people to create online
    communities to share information, ideas, and messages. Facebook, Instagram, and
    Snapchat are examples of social media.


    software–the written programs used to operate a computer.


    specialize–to pursue one type of work, called a specialty.


    technology (tehk-NAH-juh-jee)–machinery and equipment developed for practical
    purposes using scientific principles and engineering.


    version–a different form or type of an original.'
