    # WEBSITES AROUND THE WORLD


    **It''s Sunday afternoon and you''ve got homework to do.**


    You need to start a report about a world event. You log on to the internet to
    look for information.


    You find a digital database filled with photos and news stories. You watch YouTube
    video about the event. You take a virtual tour of a display at a national museum.
    You also find a few books in your library''s **online** catalog and put them on
    hold. When you''re done, you play a few online games.


    You can do all of these things and much more using websites. There''s not much
    you can''t do online, from learning to play an instrument to reading the news.
    Web developers are the people who create programs and **applications** for the
    World Wide Web. They are always thinking about new ways to make websites that
    look great, are easy to use, and have lots of cool features.'
