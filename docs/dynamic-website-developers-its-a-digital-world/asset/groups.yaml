    # CHAPTER 2

    MARKUP AND SCRIPTING


    **Front-end developers use three main languages.


    These are HTML, CSS, and JavaScript. *HTML* stands for “Hypertext Markup Language.”
    HTML **code** tells a web browser what type of content something is. This includes
    text, **hyperlinks**, and images.


    CSS and JavaScript work with HTML to determine how websites look. CSS code determines
    what websites’ content looks like. With CSS, developers program the colors, buttons,
    fonts, and more. CSS also lets make websites adapt to different devices and screen
    sizes. JavaScript is for programming interactive elements, such as a log-in pages
    or forms.


    Web programming in HTML, CSS, and JavaScript is called client-side scripting.
    These programs run in the users’ web browsers. Websites also need to connect to
    servers to find or organize information. Back-end web developers build these elements
    using server-side scripting.'
  - '[PAGE 14]


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_14_0.png)


    The programming language Python was created by Dutch computer programmer Guido
    van Rossum. He named the language after the comedy show Monty Python''s Flying
    Circus


    JavaScript can also be used for server-side scripting. Perl, Python, and PHP are
    other server-side scripting languages. Server-side **code** runs on servers that
    contain databases of information and images. Programs such as SQL and Oracle manage
    the databases. Server-side scripts determine how information is transferred between
    servers and web **browsers**.'
