  md: '# WEBSITES AROUND THE WORLD


    **It''s Sunday afternoon and you''ve got homework to do.**


    You need to start a report about a world event. You log on to the internet to
    look for information.


    You find a digital database filled with photos and news stories. You watch YouTube
    video about the event. You take a virtual tour of a display at a national museum.
    You also find a few books in your library''s **online** catalog and put them on
    hold. When you''re done, you play a few online games.


    You can do all of these things and much more using websites. There''s not much
    you can''t do online, from learning to play an instrument to reading the news.
    Web developers are the people who create programs and **applications** for the
    World Wide Web. They are always thinking about new ways to make websites that
    look great, are easy to use, and have lots of cool features.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# # CHAPTER 1

    # FABULOUS FEATURES AND FUNCTIONS


    Web developers write the computer programs that make websites work. There are
    two main types of website development. These are front-end development and back-end
    development. A developer may do both types. Or he or she may specialize in one
    or the other.


    The front end of a website is what users see and experience on the site. This
    includes what colors different elements are, where buttons are on the page, and
    more. Front-end web developers often work with web designers. The designers decide
    how websites should look. Then the developers build websites.


    The back end of a website is how the different features work. This includes forms,
    shopping carts, search engines, and more. A back-end developer writes the software
    for these functions. He or she makes sure the website works properly for the users.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Web developers like solving problems and building things. Most web developers
    have a degree in computer science. They take classes in web design and internet
    security. They also learn about different computer languages, such as HTML, JavaScript,
    and C++. Website developers keep learning throughout their careers as technology
    changes frequently. They need to keep up with new advancements.


    > Web development is a growing field. Experts think web developer jobs will increase
    by 13 percent from 2016 to 2026. This is much faster than other fields!


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_10_0.png)'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# CHAPTER 2

    GETTING DOWN TO BUSINESS


    **Web developers create websites for different kinds of people and companies.**
    Some companies need websites that promote products and services. Others need websites
    that describe who they are and what they do. It’s the web developer’s job to present
    the company’s information **online**. It needs to be nice to look at, be easy
    to use, and work well.


    Before a web developer starts building a website, he or she works with the web
    designer to gather information. They need to know who will be using the site.
    How old are they? What interests do they have? This information will guide how
    the website looks.


    The web developer also needs to know how the website will be used. Will people
    use it to shop online? Should it play videos? Is it a gaming site? The developer
    thinks about everything a person will be able to do on the website.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '![](img/4e1e2e1c341e3e88a5e966628ca97171_12_0.png)


    Web developers plan websites patiently and pay attention to tiny details.


    Once the design of the website is determined, the developer creates a wireframe
    of the website. This shows how the content and images will be laid out. He or
    she plans how to build every detail of the design. Then the developer begins building
    the site. To build a website a developer uses a combination of markup languages
    and scripts.


    9'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CHAPTER 2

    MARKUP AND SCRIPTING


    **Front-end developers use three main languages.


    These are HTML, CSS, and JavaScript. *HTML* stands for “Hypertext Markup Language.”
    HTML **code** tells a web browser what type of content something is. This includes
    text, **hyperlinks**, and images.


    CSS and JavaScript work with HTML to determine how websites look. CSS code determines
    what websites’ content looks like. With CSS, developers program the colors, buttons,
    fonts, and more. CSS also lets make websites adapt to different devices and screen
    sizes. JavaScript is for programming interactive elements, such as a log-in pages
    or forms.


    Web programming in HTML, CSS, and JavaScript is called client-side scripting.
    These programs run in the users’ web browsers. Websites also need to connect to
    servers to find or organize information. Back-end web developers build these elements
    using server-side scripting.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '![](img/4e1e2e1c341e3e88a5e966628ca97171_14_0.png)


    The programming language Python was created by Dutch computer programmer Guido
    van Rossum. He named the language after the comedy show Monty Python''s Flying
    Circus


    JavaScript can also be used for server-side scripting. Perl, Python, and PHP are
    other server-side scripting languages. Server-side **code** runs on servers that
    contain databases of information and images. Programs such as SQL and Oracle manage
    the databases. Server-side scripts determine how information is transferred between
    servers and web **browsers**.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# CHAPTER 4

    WONDERFUL WORKPLACES


    **Today, most companies have at least one website.**


    They work with one or more web developers to build and maintain their website.
    Companies of all types and sizes hire web developers.


    Some companies are very large. They have thousands of people working for them
    all over the world. Web developers at these companies are often part of a team.
    The team members work together to make decisions about the company’s websites.
    Each team member then works on his or her part. This could include creating **graphics**,
    fixing bugs, or writing **code**.


    A smaller company may work with just one web developer. This person is in charge
    of building and maintaining the company’s website. He or she works with others
    in the company to decide what features the website should have.


    Not every company hires web developers directly. Instead they work with companies
    whose business is developing'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'websites. So, working at a web development company is another type of workplace
    for web developers.


    Some web developers don''t work at companies. These developers are freelancers
    who run their own businesses. They develop websites for many different clients.
    Sometimes a freelancer may work for a company just on a specific web development
    project. Some people, such as bloggers or celebrities, hire web developers to
    build their personal websites.


    > About one in six web developers are self-employed. Many self-employed or freelance
    developers work from their homes.


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# # CHAPTER 5

    # BACK IN TIME


    **Today there are many career paths for website developers.** But website developing
    has only existed for about 25 years. The internet was invented in the 1970s, but
    it was not available to the public at first. There were no websites. The internet
    was mainly used by the government and universities to transfer data.


    In 1989, British computer scientist Tim Berners-Lee got the idea for the World
    Wide Web (the web). He was Berners-Lee used a NeXTcube computer for the first
    web server.


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_17_0.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '![](img/4e1e2e1c341e3e88a5e966628ca97171_18_0.png)


    working at a laboratory known as CERN. Berners-Lee wanted researchers at the lab
    to be able to share documents with each other on the internet. He created Hypertext
    Transfer Protocol (HTTP). This allowed people to find documents connected by hyperlinks.


    15'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Over the next year, Berners-Lee invented HTML and programmed the first web
    server and web **browser**. The web launched at CERN in December 1990. On the
    first website, Berners-Lee provided information about how to use the web.


    > CERN was established in 1954. It is located near Geneva, Switzerland, on the
    border between France and Switzerland.


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The web became available outside CERN on August 6, 1991. That’s when Berners-Lee
    posted a message in several newsgroups. This message explained his web project.
    It also said how to use HTML to create web pages and transfer them from servers
    to computers.


    On April 30, 1993, CERN made HTML source code available to the general public.
    Anyone in the world could use it to create websites and share information in the
    internet. Soon, computer scientists began building websites and ”web developer”
    became an official job title.


    # THE WEB VS.

    INTERNET


    The web and the internet are often thought to be the same thing, but they are
    not. The internet is a collection of computers that form interconnected networks.
    The web is a system used to find information on the internet. It consists of web
    pages. Web pages are documents that are connected by hyperlinks. People use web
    browsers to view web pages on the web.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 6

    BOOMING BUSINESS


    Once the web went public, programmers quickly figured out new ways to design and
    create websites.


    Within a few years, websites had progressed beyond text-only pages. They could
    include images and graphics.


    In 1993, the web browser Mosaic made the web popular among the general public.
    There were other web browsers, but they looked boring and uninviting. Mosaic had
    color photos, bookmarks, and more that attracted people to this new way of finding
    and sharing information.


    In 1995, software developer Brendan Eich invented JavaScript. Web developers could
    now add features such as motion and pop-ups to websites. In 1996, David Siegel
    published the book Creating Killer Web Sites. It was the first step-by-step guide
    for designing and building websites.


    In 1998, two major events changed web development and design. First, CSS was improved.
    CSS had been created in 1994,'
  merge: -1
  pgno: 21
- img_proc: true
  md: '> Sergey Brin (left) and Larry Page (right) developed Google while they were
    students at Stanford University in California.


    but it was difficult to use at first. The problems were fixed and in 1998, it
    began to be widely used. Then later that year, computer scientists Larry Page
    and Sergey Brin launched the Google search engine. Google changed the way people
    searched the web. But this was only the beginning. Website development continued
    to grow and change.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 9

    GOING MOBILE


    **In the late 1990s and early 2000s, advancements in website development were
    mainly driven by better computers.** New computers came out that were faster and
    more powerful. They could run more complicated websites.


    Then in 2007, Apple released the iPhone. This opened up a whole new world for
    web developers. Websites designed for computers often didn’t work well on mobile
    devices. The sites didn’t look good on small screens.


    In 2008, web developer Nathan Smith came up with the 960 grid system. It divided
    the screen into columns. This made sketching, designing, and coding websites easier.
    The 960 grid system soon became the standard for most web developers.


    Web designer Ethan Marcotte expanded on Smith’s grid system to improve mobile
    websites. At the time, web developers had to build two versions of each website.
    One was for desktop'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'computers and the other for mobile devices. In 2010, Marcotte wrote an article
    describing a solution to this problem.


    Marcotte''s article explained how to make content formatted in a grid display
    differently on different devices. Marcotte called his idea responsive web design.
    It greatly simplified the work of developing websites for multiple devices.


    > Responsive design uses grids and layouts to adjust resolution, image size, and
    script functions to the device''s screen.


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_24_0.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# CHAPTER 8

    FINDING SUCCESS


    **The most successful web developers do a lot more than just computer programming.**
    These days, many people can learn the basic skills needed to create web pages.
    A good web developer also needs to understand human interactions. This means knowing
    how people will use a site and what they want from it. When a site is useful and
    easy to navigate, people have a better user experience. They will be more likely
    to come back to the site again.


    Successful web developers are good at explaining their ideas. This is helpful
    when working with clients or coworkers. Developers need to say clearly why a website
    should have certain features or look a certain way. Developers also need to listen
    to others'' ideas too.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# DIGITAL SPOTLIGHT FACEBOOK


    Mark Zuckerberg and several friends came up with the idea for Facebook. They were
    all students at Harvard University in Massachusetts. They created a website where
    students could post information and photos.


    The website launched on February 4, 2004. It was called The Facebook and at first
    was only available to other Harvard students. The website showed a photo of the
    students who signed up and listed their contact information. Later that year,
    Zuckerberg made The Facebook interactive. Students could message each other through
    the site. And they could post comments on one another''s entries.


    By the time Facebook became available to the general public in 2006, it also included
    an application programming interface (API). This allowed other programmers to
    develop apps that worked within Facebook. This revolutionized social media. Today,
    Facebook has more than two billion active monthly users.


    ![](img/4e1e2e1c341e3e88a5e966628ca97171_26_0.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# CHAPTER 9

    SEARCH ENGINE OPTIMIZATION


    Having a good website is an important part of any business. But a company can''t
    just launch a website and hope it gets noticed. It''s too easy for a website to
    get lost among the millions of other websites on the web. Having a website won''t
    do any good if people can''t find and visit it.


    Most possible customers use search engines such as Google, Bing, or Yahoo. For
    example, someone planning a hiking trip might search for “hiking boots.\. The
    search engine shows a list of websites featuring hiking boots. Often, the searcher
    will only visit the first few sites on the list. So, it''s better for a business
    that sells hiking boots to be at the top of the list.


    Web developers help their clients'' websites appear high on search engine lists.
    This is called search engine optimization (SEO). How a developer builds a website
    affects its SEO ranking. Websites that load slowly tend to have low rankings.
    Elements such as large images can make websites slow.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'People can use software or apps to track their SEO ranking and website traffic.
    One popular tracking service is Google Analytics.


    Websites that only work well on one or two types of devices also have low rankings.
    Web developers try to build strong, fast websites for computers and mobile devices.
    This ensures that their websites will have high SEO rankings.


    25'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# CHAPTER 10

    TARGETING TRENDS


    SEO is just one element that is making websites more complicated to design and
    build. The web is always changing and growing. Web developers need to be able
    to keep up with the latest trends so they can build better websites.


    Virtual reality (VR) is an emerging trend in website development. VR creates an
    artificial setting that users can move around in and interact with. Developers
    are working on ways to include VR on websites. One idea is to use VR to connect
    people online so they can interact and even play games.


    Another trend is the Internet of Things (IoT). It is the ability of objects such
    as household appliances, music systems, and cars to connect online. This includes
    refrigerators that tell you when you need to buy more milk. And some cars, such
    as Teslas, can receive software updates directly from the manufacturer. Web developers
    need to be able to build sites that can exchange information with devices that
    are on the IoT.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/4e1e2e1c341e3e88a5e966628ca97171_30_0.png)


    > When there are safety issues with a Tesla car, the car can receive an update
    that fixes the problem!


    Web developers are always faced with new challenges. **Technology** changes so
    quickly that it is impossible to know what the future holds for the web. One thing
    is sure, though. Website developers will help shape the way people communicate,
    make decisions, and perform daily tasks.'
  merge: -1
