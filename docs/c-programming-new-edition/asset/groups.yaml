    \ 在第 6 行声明，其下标变量也已声明 存储平均值和成绩总和的变量在第 7 行声明为 float，因为它们可以包含小数点 for 循环在第 8 行启动，用户输入的成绩将存储在数组中。\
    \ 第 11 行接受用户输入的成绩。\n\n第二个 for 循环可见于第 13 行。此 for 循环用于添加用户输入的所有值。加法过程发生在第 14 行。这和下一行被称为程序的逻辑。在此，第一个\
    \ for 循环取数组中 [0]th 位置的值并将其与 sum 相加，其当前值为 0，如初始化所示，并将其存储在变量 add 中。当这完成时，add 假设提交给它的新值并且旧值丢失。在下一次迭代中\
    \ I 的值\n\n递增并获得 1st 位置的值，并且将其添加到已经具有计算数字的‘add’中，并且此加值附加到 add，后者丢失了先前的值。\n\n上述过程重复直到条件不满足。总和然后除以元素数量，在第\
    \ 15 行表示。并在随后的输出语句第 16 行中显示。\n\n## 4.8. 内存中的数组\n\n你必须对声明、初始化和检索数组的细节了如指掌。但在内存中会发生什么？元素是按串行顺序存储还是随机存储？为了解答上述疑问，考虑一个例子：\n\
    \n```\nint sal[5];\n```\n\n当做出这样的声明时，内存中会发生什么活动？到现在你必须知道上述语句的作用。该语句表示要创建一个数组变量，它是整数数据类型，数组可以容纳\
    \ 5 个元素。在内存中将保留 10 字节，因为每个整数将长 2 字节。直到数组用一些数字初始化，此数组将托管一些无关的数字。一旦数组被初始化，元素以连续的方式存储。\n\
    \n看下面的表格表示：\n\n2012 2014 2016 2018 2020 10 20 30–40 50\n\n在上面的表中，你可以看到用户输入的数字以连续模式注册，并且每个元素占用\
    \ 2 字节。这正是它在计算机内存中的表示方式。元素位置下方的数字是该位置的地址，每个元素在内存中都有其唯一的地址，通过该地址进行标识（图 4.1）。\n\n\
    ![](img/c948b22e3869eae71cd653f0917e0009_71_0.png)\n\n图 4.1. 内存中的数组。\n\n## 4.9.\
    \ 多维数组\n\n到目前为止，主要关注的重点是一维数组。现在你进入模糊的领域。这句话可以争论，因为多维数组的定义模式类似于一维数组。唯一的差异在于多维数组需要为每个下标单独的方括号。也就是说，如果一维数组有一对方括号，二维数组将有两个对的方括号，三维数组有三个对的方括号，以此类推。\n\
    \n二维数组 二维数组可以被视为数组下的数组。如前所述，二维数组将有两个对的方括号。描述可以解释如下。\n\n```\nData_type array_name\
    \ [expression1] [expression2];\n```\n\n二维数组通常被称为矩阵。表达式一和二是在二维数组中持有的下标。因此，在上述表达式中，一将指定行，表达式，二将指定列，它们表示与每个下标关联的数组元素数量。\n\
    \n因此如果声明指出：\n\n```\nint arr[4][2]\n```\n\n它意味着一个名为 arr 的二维数组是整数类型并且有四行两列。其表示将如下：列号\
    \ 0 列号 1 行号 0 1000 10 行号 1 2000 20 行号 2 3000 30 行号 3 4000 40。因此元素 arr[0][0] 将为\
    \ 1000，元素 arr [3][2] 将为 30。其余数字可以通过查看上表来计算。在内存中，元素以顺序模式放置，使得 [0][0] 中的元素首先，后跟\
    \ [0][1] 中的元素，后跟 [1][0] 中的元素，以此类推。这里，每个整数元素也将占用两个字节。\n\n初始化 2 维数组 初始化二维数组等同于初始化一维数组。\n\
    \n```\nint sal[4][2]={{1000,10}, {2000,20}, {3000,30} {4000,40}}\n```\n\n"
