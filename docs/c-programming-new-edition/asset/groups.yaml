    # 9.1. INTRODUCTION


    After learning about data structures part one it’s time to meet the twin brother
    of the data structures. The second saga of data structures deals with the details
    of representing a list of elements of a data structure. All through your journey
    in this session you find that some parts of the session bear striking resemblance
    to the arrays.


    The entire session concentrates on ways of juggling with a list of numbers. The
    concepts to be narrowed down here are the fundamental building blocks for programming
    a list of numbers in any language. You will be startled to know that this logic
    holds water even for most of the high level languages. You may feel that these
    concepts could have been brought to light at an earlier stage but to appreciate
    the effectiveness of this version of the data structures a thorough knowledge
    of arrays and pointers is always advisable.


    # 9.2. LINKED LISTS


    To explain the concepts of linked lists an amalgamated reference of the arrays
    and pointers has to be made. The reason why linked lists are so important and
    are given a priority is due to the fact that they result in both the effective
    and efficient use of computer storage and also computer time. The concept that
    is going to be dealt with here is similar to the arrays except that in arrays
    only application side was discussed in detail and internal representation was
    dealt to a very minimal extent. Here you will be provided with extensive amount
    of information about internal happenings of the arrays using linked lists as the
    medium.


    A linked lists can be compared with a train. As in a train the different compartments
    are hooked to each other in the similar way a linked list has a series of elements
    which are connected to each other. Each element in a list is called a node and
    it has an address by which it is recognized. The linked lists are of three different
    types depending on the arrangement of the nodes.


    +   - Singly linked list

    +   - Doubly linked list

    +   - Circular linked list


    The singly and doubly linked lists can be clubbed into a group called the linear
    linked lists in which the elements are arranged in a serial and contiguous fashion.
    The intricacies of these 2 types of linked lists will be dealt with as the session
    progresses.'
