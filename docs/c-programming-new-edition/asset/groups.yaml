    \ Sort\n\n基数排序可以被声明为最有效的排序方法之一。它通常适用于两位数字，但概念即使对于三位数字也适用，尽管这里处理的示例仅使用两位数字。\n\n\
    这种排序技术版本非常简单，涉及将每个元素分为两部分。右侧数字或十位上的数字称为最高有效位（MSD），个位上的数字称为最低有效位（LSD）。例如：在数字 40\
    \ 中，LSD 和 MSD 划分为如下：\n\nMSD: 4 LSD: 0\n\n整个排序过程是基于对 LSD 和 MSD 进行排序。整个基数排序过程是两步程序，其中第一步的排序基于\
    \ lsd，第二步的排序基于 msd。\n\n![](img/c948b22e3869eae71cd653f0917e0009_169_0.png)\n\n\
    考虑元素列表：\n\n40, 45, 61, 72, 67, 89, 98, 50, 57\n\n为了对元素进行排序，基数排序涉及一组从 0 到 9 编号的口袋。\n\
    \n这些口袋可以接受其 lsd 等于相应口袋编号的数字。\n\n例如 0 号口袋只能容纳以 0 结尾的元素。同样，口袋号 5 容纳 lsd 为 5 的元素，每个口袋每次遍历只能容纳一个元素\
    \ Step I 在第一步中，列表被遍历，元素根据其 lsd 放置在口袋中。\n\n一旦元素被放置在其相应口袋中，如果遇到另一个具有相同 lsd 的元素，则在扫描完剩余列表之前会被忽略。对列表进行一次扫描称为一次遍历。\n\
    \n例如在上述列表中，你有两个元素 40 和 50，其 lsd 为 0。在第一次遍历中，只有 40 被放置在 0 号口袋中，因为它最先遇到。50 在第二次遍历中被放置在\
    \ 0 号口袋中。\n\n因此在第一步完成后，元素可以表示如下： P\n\n0 40 50 1 61 2 72 3 4 5 45 6 7 67 57 8 9\n\
    \n现在基于该排列，准备一个新列表如下：\n\n40, 50, 61, 72, 45, 67, 57\n\n你会注意到在准备列表时，第二次遍历中的元素会滑到第一次遍历的元素旁边。\n\
    \n这个元素列表现在被用作第二步的燃料。\n\nStep II 与 Step I 类似，只是变化在于这些元素是根据 msd 进入其相应口袋的。 0 1 2\
    \ 3 4 40 45 5 50 57 6 61 67 7 72 8 9. 因此新的有序列表可以表示如下：\n\n40, 45, 50, 57, 61, 67,\
    \ 72.\n\n在处理了各种排序技术之后，很难判断哪种技术是最优越的。虽然有些使用起来容易，但可能并不真正有效。\n\n给定键集的某些属性在确定应使用哪种排序技术时起着重要作用。这些属性是键的数量、大小、分布和顺序。经常决定在某种情况下哪种方法最合适。\n\
    \n## 9.11. SEARCHING TECHNIQUES\n\n到目前为止你使用的技术有助于以不同方式排列元素。现在列表已排序和排列，是检索时间。你现在将体验到的搜索技术允许你从列表中找出你选择的某个元素。所选元素与列表中的元素进行比较，如果找到完全匹配，则元素被检索并显示一条消息。\n\
    \n搜索过程可以以不同方式进行，但最流行的方法将被采用并剖析。 C 提供了两种主要且不复杂的搜索元素的方法。\n\n- 1. **Linear Search\
    \ Method:** 线性方法是一种相当直接的检索元素的方法。这通常被认为是在无序元素列表中搜索的最简单技术。\n  \n  在以下版本中，列表逐个元素扫描以检索要检索的元素。当找到适当的匹配时，会显示一条消息。\n\
    \n- 2. **Binary Search Method:** 这是访问元素列表的另一种相对简单的方法。需要记住的一个重要点是，二分搜索只有在元素列表是有序且按升序排列时才可能。这可以通过在会话早期部分可用的任何排序技术来实现。\n\
    \n一旦列表对齐，二分搜索操作就可以进行。这种方法为列表的第一个和最后一个元素分配下界和上界。之后通过求 lb 和 ub 的平均值找到列表的中点。例如，如果列表包含\
    \ 7 个元素，则中点将为 4 Midpoint=lb+ub/2。考虑下面的元素列表并假设要检索的元素是 91。 40, 55, 61, 71, 81, 91,\
    \ 100。一旦找到中点，要搜索的元素与中点位置处的元素进行比较。\n\n在这种情况下，中点位置的元素是 71。元素 71 与要查找的元素 91 进行比较，但由于元素配置不同，检查该元素是大于还是小于中点。\n\
    \n如果元素小于中点，则其余搜索在中点左侧的元素中进行，因为所有这些元素都小于中点。如果数字大于中点，则比较在中点右侧的元素进行。\n\n在你的情况下，由于元素大于中点，后一种情况将是关注点。确定元素较大后，中点后的元素被分配下界的位置，但上界保持不变。在相反的情况下，如果元素小于元素，则中点前的元素被设为上界，但这里并非如此。\n\
    \n现在你有了上述情况下的新下界，找到新 lb 和 ub 的中点。因此，在这种情况下它将是 6 (5+7/2)。新的中点现在与要搜索的元素进行比较。由于找到完全匹配，会显示一条消息，表明搜索完成并且找到了所需元素。\n\
    \n如果仍未找到匹配，则继续上述方法直到命中目标。\n\n### 9.11.1. Practical Approaches\n\n- **Practical\
