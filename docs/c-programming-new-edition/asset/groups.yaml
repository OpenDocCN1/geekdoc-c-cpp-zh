    \ `^` | `_` | `[` | `:` | `.` | `?` | `&` | `_` | `]` | `'` |\n\n## 1.9. C 中的关键字\n\
    \nC 中的关键字是一组预定义词，其功能已向编译器表达，并且每当被调用时它们都会以极大的舒适度完成其任务。记住关键字不能用于除其定义以外的任何功能，甚至不能作为变量名。如果你违背这种行为准则，它将导致为关键字赋予新的含义，而计算机不允许这样做。\n\
    \nC 中有 32 个关键字，在程序的各个点使用以推动语言的熟练程度。下面描述符是一个表，包含所有关键字，供你快速参考。\n\n详细描述将在需要时给出。\n\
    \n| Keywords in C |\n|---|\n| auto | double | int | struct |\n| break | else |\
    \ long | switch |\n| case | enum | register | typedef |\n| char | extern | return\
    \ | union |\n| const | float | short | unsigned |\n| continue | for | signed |\
    \ void |\n| default | goto | sizeof | volatile |\n| do | if | static | while |\n\
    \n## 1.10. 运算符的层次结构\n\n你一生都在根据其权力和效率对人和事物进行优先排序。好吧，C 也不例外于这一传统，并将其运算符沉降到三个不同的优先级区域。\n\
    \n简而言之，如果一个等式中有许多运算符，C 会决定哪个运算先执行，然后是下一个。例如，表达式 `4 * x − 5 * y` 对应于 `(4x) − (5y)`\
    \ 还是 `4(x − 5y)`？为了解决这些疑问，必须对下面列出的运算层次结构有深刻的了解。\n\n| Priority | Operators |\n\
    |---:|---|\n| First | `*`, `/`, `%` |\n| Second | `+`, `−` |\n| Third | `=` |\n\
    \n## 1.11. 应该做和不应该做\n\n要在 C 中编程受益，必须在某些规定下玩游戏，否则可能会被罚红牌。也就是说，必须安全地玩游戏以确保更好的结果。因此，要与\
    \ C 合作，必须牢记所设定的界限。下面列出了一些编程 C 时有帮助的应该做和不应该做。\n\n- **Do’s:**\n  - 主函数是第一个函数，并且对所有程序都是强制性的。\n\
