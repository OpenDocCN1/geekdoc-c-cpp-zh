    # 关于作者


    ![](img/c948b22e3869eae71cd653f0917e0009_5_0.png)


    曼莫汉·辛格博士，现任印度中央邦博帕尔IES工程技术学院计算机科学与工程系教授。此前，他在多所工程学院拥有超过12年的教学经验，包括印多尔的Chameli
    Devi Group of Institution和A.P.J.阿卜杜勒·卡拉姆大学。他的学历包括计算机工程硕士、计算机科学与工程博士。他的研究包括数据挖掘、人工智能、数据科学。他在知名国际期刊、国际国内会议上发表论文25余篇，拥有9项专利（5项已公开，4项已注册）。他在计算机科学领域出版了10余部著作。他完成了一个DST资助项目。


    拉胡尔·夏尔马先生，现任古吉拉特邦瓦多达拉帕鲁尔大学帕鲁尔理工学院计算机科学与工程系助理教授。此前，他在多所工程学院拥有超过6年的教学经验，包括印多尔的Chameli
    Devi Group of Institution和A.P.J.阿卜杜勒·卡拉姆大学。他在印多尔（中央邦）帕特尔科学技术学院获得计算机科学与工程学士学位（B.E.，CSE），并在印多尔（中央邦）DAVV的SCSIT学院获得网络管理与信息安全硕士学位（M.Tech，NM&IS）。目前正在中央邦博帕尔的拉宾德拉纳特·泰戈尔大学攻读计算机科学与工程博士学位。他的研究包括计算机网络、网络安全、密码学、数据挖掘和Web编程。他在知名国际期刊、国际国内会议上发表13篇研究论文，拥有6项专利（3项已公开，3项已注册）。他还在2015年通过了GATE（CSE）资格考试。他在计算机科学与工程领域出版了9余部著作。


    **尼拉吉·库马尔·拉索尔博士**是一位卓有成就的专业人士，现任印度中央邦阿马尔坎塔克英迪拉·甘地国家部落大学（IGNTU——一所中央大学）计算机科学系副教授兼系主任。他于2021年3月担任副教授，随后于2022年5月出任系主任。在加入IGNTU之前，尼拉吉博士曾在多所著名院校积累了超过十三年的丰富教学经验，包括中央邦印多尔的Sri
    G.S.科学与技术学院、中央邦古纳的杰伊皮大学工程与技术学院以及拉贾斯坦邦的莫迪技术学院。此外，他还曾在计算机科学公司（CSC）担任软件工程师，从IT行业获得了宝贵的见解。尼拉吉博士拥有计算机科学博士学位，专攻网格计算，于2014年获得旁遮普塔帕尔大学博士学位。他还在同一所大学于2008年获得计算机工程硕士学位，并于2006年获得拉贾斯坦大学计算机科学与工程学士学位。他的专业领域和研究兴趣包括并行与分布式计算、网格计算、云计算、大数据、物联网、数据库管理系统（DBMS）和数据结构。尼拉吉博士为该领域做出了重大贡献，拥有72篇出版物，其中包括16篇SCI论文、7项专利和7部著作，发表于知名的国际/SCI期刊和会议。作为一位受人尊敬的学者，尼拉吉博士已成功指导了七篇硕士论文和两篇博士论文，目前还有多个研究项目正在他的指导下进行。他对研究和教育的奉献使他在学术界赢得了可嘉的声誉。


    **乌尔米拉·S·索尼博士**，现任印度中央邦博帕尔SAM全球大学工程与技术学院教授。她在多家机构拥有超过18年的教学经验，目前在同一机构担任IQAC主任一职。她拥有超过10年的研究经验。她获得了位于贾尔冈的北马哈拉施特拉大学电子与通信工程学士学位（B.E.），以及恰蒂斯加尔邦比莱的恰蒂斯加尔·斯瓦米·维韦卡南达技术大学（CSVTU）仪器仪表与控制专业硕士学位（M.Tech）。她还在比莱的CSVTU获得了电子与通信工程博士学位。她的研究领域侧重于智能电网、微电网、可再生能源、无线通信和物联网。她在各种知名期刊和会议上发表了超过25篇研究论文，并拥有6项外观设计专利。她在认证方面拥有丰富经验，作为专家为多所大学提供NBA和NAAC准备工作方面的服务、指导和支持。


