    \ e3.esal, e3.eno);\n}\n```\n\n在上面的程序中，你可以看到结构体成员是在结构体内部声明的，而结构体变量，即 e1、e2、e3，是在结构体外部使用关键字\
    \ struct 和结构体名称声明的。结构体成员的值是从用户那里请求来的，并通过 scanf 接受。\n\n通过使用结构体变量和结构体成员（两者之间用点号（.）分隔）将值打印回来。\n\
    \n## 8.5. 结构体数组\n\n在上面的程序中，你已经熟悉了使用结构体的 C 程序中的各种内容。上面的程序很完美，因为它接收了 3 个值并显示回来，但如果值的数量增加到\
    \ 100，那么你可能需要使用 100 个结构体变量，从 b1、b2、...、b100，但 C 语言是如此慷慨，它总是为繁琐的问题提供替代方案。\n\n在这种紧急情况下，结构体请求数组立即行动。也就是说，结构体变量可以声明为数组，从而高效地使用大量变量。声明结构体数组的过程与数组类似。在方括号之前，有三个东西：关键字\
    \ struct、结构体名称和数组名称。因此，员工数组可以如下声明：\n\n```c\nstruct employee e[100];\n```\n\n现在为你呈现一个示例程序，它将涵盖使用数组时结构体中需要理解的所有方面。\n\
    \n```c\n#include<stdio.h>\n\nstruct emp\n{\n    char ename[15];\n    int esal;\n\
    \    int eno;\n};\n\nstruct emp e[3];\n\nvoid main()\n{\n    int i;\n    for(i=0;i<=2;i++)\n\
