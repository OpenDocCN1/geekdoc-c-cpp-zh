  mdcn: "\n\n`for` 语句诱惑着许多对上述任何一种控制结构都已熟练的程序员。`for` 语句执行了三种功能，而此前这些功能需要在三条独立的语句中编写。它们是：\n\
    \n- 初始化\n- 条件\n- 递增\n\n`for` 语句的一般格式为：\n\n```text\nfor(initialize; condition;\
    \ increment)\n    execute this statement;\n```\n\n`Initialize`：此表达式将特定变量初始化为设定值，例如，`x\
    \ = 0;` 或 `x = 1;`\n\n`Condition`：此表达式为语句的执行设置条件，例如，`x < 9;` 或 `x <= 9;`\n\n`Increment`：此表达式在每次条件满足前递增循环，例如，`x++`\n\
    \n在这三个表达式之间必须存在分号。\n\n**Example 3.1:**\n\n```c\n/* program to display numbers\
    \ from 0 to 10 */\n#include<stdio.h>\nvoid main()\n{\n    int i;\n    for(i=0;\
    \ i<=10; i++)\n    {\n        printf(\"%d\", i);\n    }\n}\n```\n\n以上是一个简单的程序，用于显示\
    \ 0 到 10 的数字。第 5 行看到变量 `i` 的声明，其类型为 `int`。第 6 行是我们需要集中注意的地方，因为 `for` 语句从这里开始。正如你所见，变量\
    \ `i` 被初始化为 0，`i` 的条件被提及，并且 `i` 的递增都在单个 `for` 语句中完成。当编写此语句时，`i` 被初始化为 0，条件被设定为它必须小于或等于\
    \ 10，并且在执行下面的语句时每次都递增 `i`。第 8 行是输出语句，每当条件满足时就会执行。\n\n### 3.5. THE WHILE LOOP\n\
    \n现在我们对循环是什么有一个清晰的概述，我们可以逐一拆解不同的循环概念的复杂性，首先从 `while` 开始。与 `if` 语句相比，我们可以断言只有当条件为真时所需语句才会被执行；否则执行其他语句，但在\
    \ `while` 中，直到特定条件变为真，所需语句才会被执行。只要回忆一下前面提到的例子：直到我们的条件得到满足，罢工才会继续。这个概念将通过以下示例变得清晰：\n\
    \n```c\n#include<stdio.h>\nvoid main()\n{\n    int i=1;\n    while (i<=20)\n \
    \   {\n        printf(\"%d\", i);\n        i++;\n    }\n}\n```\n\n由于你已经了解前几行，我们关注的重点将是循环结构。第一个循环语句，即第\
    \ 4 行，是初始化语句，即它将变量设置为循环开始的特定值。Count 是变量，其初始值为 0。第 5 行是循环开始的地方。`while` 语句和条件也在这里提及。这里陈述的条件是直到\
    \ count 的值变为 10，才执行下面的语句。第 7 行是可执行语句，即直到条件满足，语句才会被执行。最后一个语句，即第 8 行，是一个新且重要的语句。使用它，我们递增循环；我们让编译器再次执行一次循环结构。每当编译器遇到此语句时，它就会被提醒它需要再次遍历循环一次。这是在条件满足之前完成的。\n\
    \n### 3.6. THE DO WHILE STATEMENTS\n\n在 `do while` 中，要执行的语句是在条件满足之前编写的。也就是说，只有当其后的条件得到满足时，特定的循环才会被执行。其格式可以如下表示：\n\
    \n```text\ndo\n    this statement;\nwhile (this condition is true);\n```\n\n`do`\
    \ 和 `while` 之间可以有多个语句。以上示例可以在这里处理：\n\n```c\n/* program to display numbers from\
    \ 0 to 10 */\n#include<stdio.h>\nvoid main()\n{\n    int i=0;\n    do\n    {\n\
    \        printf(\"%d\", i++);\n    }\n    while(i<=10);\n}\n```\n\n这里除了交换语句之外，唯一的区别是变量的递增是在\
    \ `printf` 内部完成的。由于我们已经了解前几个语句，我们将继续到第 5 行，在那里像在之前的示例中一样进行初始化。这里变量 `i` 被初始化为 0\
    \ 的值。来到第 6 行，`do` 语句在这里给出，后面跟着要执行的语句。`do` 语句以大括号开头。可执行语句是第 8 行的语句，即 `printf` 语句。需要注意的重要一点是递增语句包含在\
    \ `printf` 语句内。这后面跟着条件语句，即第 10 行，在那里检查条件。这里的条件是 `i` 的值应小于或等于 10。直到此条件得到满足，编译器才需要执行条件上面的语句。\n\
    \n### 3.7. THE BREAK STATEMENTS\n\n`break` 是 C 编程中一个有效的语句，因为它可用于在不满足条件的情况下退出循环。也就是说，`break`\
    \ 通知控制，一旦遇到此语句，它应停止循环过程并跳转到循环后出现的第一个语句。在此，循环至少被处理一次，这意味着条件被评估并且语句至少被执行一次。\n\n\
    ```c\n#include<stdio.h>\n```\n\n```text\nstatement;\nstatement;\nbreak;\ncase\
    \ expression:\nstatement;\nbreak;\ndefault:\nstatement;\n}\n```\n\n让我们分解上述格式并研究不同的部分。第一个语句是\
    \ `switch` 语句，后面跟着一对括号，其中给出单词 \"choice\"。它接受用户所做的选择。case 只能用整数或字符命名，其他任何东西都不行（甚至不是浮点数）。\n\
    \n- **Example 3.2:**\n  - case 1\n  - case 2\n  - case 3 or\n  - case a\n  - case\
    \ b\n  - case c\n\n根据用户所做的选择，该特定 case 中的可执行语句被激活。接下来要讨论的是 \"case\"。在其中每个 case\
    \ 中，指定要执行的操作。每个 case 都有特定的一组要执行的语句。每当选择特定 case 时，case 中的语句就会被执行。\n\n`break` 已经讨论过，但在\
    \ `switch` 语句中，`break` 的效率最好地体现出来。你已经注意到 `break` 语句被用在每个 case 的末尾。这是因为它通知控制，一旦\
    \ case 被执行，控制不应再继续进行。\n\n`default` 在用户输入的选项与给定的 case 不匹配时接管。当与任何给定的 case 都找不到匹配时，`default`\
    \ 中的语句将被执行。\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    char c;\n    printf(\"\
    Enter the alphabet: \");\n    scanf(\"%c\", &c);\n    switch(c)\n    {\n     \
    \   case 'a':\n            printf(\"A is a vowel\");\n            break;\n   \
    \     case 'e':\n            printf(\"E is a vowel\");\n            break;\n \
    \       case 'i':\n            printf(\"I is a vowel\");\n            break;\n\
    \        case 'o':\n            printf(\"O is a vowel\");\n            break;\n\
    \        case 'u':\n            printf(\"U is a vowel\");\n            break;\n\
    \        default:\n            printf(\"Is a consonant\");\n    }\n}\n```\n\n\
    ### 3.10. THE GOTO STATEMENT\n\n顾名思义，`goto` 语句通过将控制重新分配到程序的另一部分来逆转程序执行的正常进展。`goto`\
    \ 旁边写着一个标识符（任何字符名称），它告诉控制它应该停靠在程序后面标识符所在的位置。你应该在希望控制跳转到的位置写上相同的标识符名称。\n\n一旦控制跳转到标识符，它就会执行标识符下面的语句。标识符也称为标签。它后面应跟一个冒号（`:`）。然而\
    \ `goto` 语句似乎很有用，但 `goto` 在编程中通常不被偏爱，因为它可能毁掉程序员的生活。\n\n一般格式如下：\n\n```text\ngoto\
    \ identifier name;\n```\n\n标识符可以在 `goto` 语句之后以以下方式放置在程序的任何位置：\n\n```text\nidentifier\
    \ name:\nexecutable statements;\n```\n\n```c\n/* program using the goto */\n#include<stdio.h>\n\
    main()\n{\n    int i;\n    printf(\"enter the number\");\n    scanf(\"%d\", &i);\n\
    \    if(i==5)\n        goto rep;\n    printf(\"hello\");\n    rep:\n    printf(\"\
    bye\");\n}\n```\n\n在此程序中，一旦用户输入 `i` 的值并被计算机接受，条件即第 8 行就会被检查。如果条件，即值等于 5，变为真，则第\
    \ 9 行的 `goto` 语句被执行，控制被传递到 `rep`，即第 11 行，并且由此语句被执行，即单词 `bye` 将被显示。如果条件不满足，控制会忽略\
    \ `goto` 语句并执行第 10 行和第 12 行的语句，即 `Hello` 和 `Bye` 都将被显示。\n\n### 3.11. TERNARY OPERATORS\n\
    \n在详细阐述了会话之后，还有一个小细节需要照顾。这被称为三元运算符，或它也被称为条件运算符。换句话说，可以称之为带风格的 `if else` 语句。它是一个非常简洁修改的\
    \ `if else`，可以这样说。\n\n一般格式如下：\n\n"
