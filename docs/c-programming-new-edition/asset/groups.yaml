    \ 155\n\n### 9.1. 引言\n\n在学习完数据结构第一部分之后，是时候认识数据结构的孪生兄弟了。数据结构的第二篇章涉及如何表示数据结构的元素列表。在本课程的整个旅程中，你会发现本课程的某些部分与数组有惊人的相似之处。\n\
    \n整个课程集中于处理数字列表的方法。这里需要细化的概念是编程任何语言中数字列表的基础构建块。你会惊讶地知道，这一逻辑即使对于大多数高级语言也同样适用。你可能会觉得这些概念本可以在更早的阶段提出，但为了欣赏这种版本的数据结构的效率，彻底掌握数组和指针的知识始终是明智的。\n\
    \n### 9.2. 链表\n\n要解释链表的概念，必须对数组和指针进行综合参考。链表之所以如此重要并被优先考虑，是因为它们既能有效又高效地使用计算机存储和计算机时间。这里要讨论的概念与数组相似，只是数组中只详细讨论了应用层面，而内部表示则讨论得非常少。在这里，你将获得关于数组内部运作的大量信息，链表作为媒介。\n\
    \n链表可以与火车相比较。正如火车中不同的车厢相互连接一样，链表也有一系列相互连接的元素。列表中的每个元素称为节点，它有一个地址来识别它。链表根据节点的排列方式分为三种不同类型。\n\
    \n- 单链表\n- 双链表\n- 循环链表\n\n单链表和双链表可以归为线性链表组，其中元素以串行和连续的方式排列。随着课程的进展，这两种链表的复杂性将被讨论。\n\
    \n### 9.3. 单链表\n\n在理解单链表的具体细节之前，至关重要的是对节点有一个扎实的理解，节点是列表的基本构建块。\n\n正如之前所述，列表的基本部分是节点。它有两个元素；第一个称为\
    \ info，第二个称为 connection Node.Info Link。节点的 info 部分包含有关节点的信息，即节点中存储的是哪个数字或哪个字符。\n\
    \n节点的 link 部分包含下一个节点的地址。如前几节所述，每当值存储在内存中时，它都会存储在特定地址。因此，在一个有四个节点或元素的单链表中，第二个节点的地址存储在第一个节点的\
    \ link 区域中，第三个节点的地址存储在第二个节点的 link 区域中，以此类推（图 9.1）。\n\n你可能会想知道第 4 个节点的 link 区域会包含什么。第\
    \ 4 个 link 区域包含一个空字符，表示链接的结束。（如果你记得，字符串也是以同样的方式终止的。）\n\n![](img/c948b22e3869eae71cd653f0917e0009_151_0.png)\n\
    \n**图 9.1.** 单链表。\n\n因此列表可以表示如下：\n\n| 地址 | Info | Link |\n|---|---|---|\n| 2008\
    \ | A | 2010 |\n| 2010 | B | 2012 |\n| 2012 | C | 2014 |\n| 2014 | D | Null |\n\
    \n链表中的元素可以使用指向列表第一个元素的头指针进行遍历。此头指针可用于从左到右遍历列表的元素，并且只能在此方向上遍历元素。\n\n随机访问是非法的，即你不能直接访问列表的第\
    \ 2 个或第 3 个元素。你知道持有另一个元素的地址的被称为指针。因此，link 也可以称为指针，因为它指向列表中的下一个元素。\n\n现在你对单链表有了清晰的认识，你将看到如何在该链表上执行插入和删除操作。\n\
    \n**插入**\n\n单链表中的插入操作可以在单链表中的三个不同位置执行。\n\n- 在列表的开头。\n- 在列表的末尾。\n- 在两个节点之间。\n\n\
    如果要在列表开头插入新节点，则新节点的 link 区域被赋予第一个节点的地址。然后头指针被设为指向新的第一个元素。由于它包含旧第一个元素的地址，因此在新节点和列表的其余部分之间创建了一个链接。\n\
    \nA 2010 2008 A 2008 B 2012 A 2014 2010 2012 NEW\n\n可以在列表中间的两个节点之间执行插入操作。例如，如果要在列表的第\
    \ 2 个和第 3 个节点之间插入一个新节点，则首先将头指针遍历到第 2 个节点。将要插入的新节点的地址分配给第 2 节点的 link 区域，并将新节点的\
    \ link 区域分配第 3 节点的地址。因此，第 2 个和第 3 个节点之间的链接被打破并插入新节点。\n\n![](img/c948b22e3869eae71cd653f0917e0009_152_0.png)\n\
    \nA 2008 B 2016 C 2014 In X 2012 2016\n\n要将节点插入列表末尾，头指针被遍历到最后一个节点，包含 null 的 link\
    \ 区域被重新分配以保存新节点的地址，并且新节点在其 link 区域中被分配空字符。插入过程先于插入位置的搜索。搜索涉及定位要在其后插入新项目的节点。\n\n\
    插入的一般算法如下：\n\n- 1. **算法开始：** 如果列表为空或新节点在头节点之前，则， 将新节点插入为头节点， 否则如果新节点在最后一个节点之后，则，\
    \ 将新节点插入为末尾节点， 否则将新节点插入到列表主体中。结束。\n\n- 2. **删除操作：** 删除操作也包括 3 个阶段，但操作程序与插入完全不同。\n\
