  mdcn: "\n\n其中包含类似的函数 printf(), scanf()，它们可被任意多个程序调用。\n\n## 5.2. 函数的优势\n\n你上面所略读的内容，只是对函数及其所执行操作的一个大致了解。下面列出的是函数为程序员提供的几个优点；程序员通常使用函数，并发现编程的痛苦（如果有的话）得到了缓解。程序员可以充分利用下述优势，并获得实现函数的丰厚回报。\n\
    \n程序员可以识别出在程序各个部分中重复执行的操作，将其编写为函数，并在需要时从程序的各个部分调用该函数。这种方法避免了代码重复。无需在程序的不同部分重复相同的代码，只需编写一次函数并从程序的不同部分调用它，从而减小可执行文件大小并减少代码冗余，使代码易于维护。\n\
    \n在像 Unix 这样的多任务系统中，程序消耗的内存与其运行速度之间存在直接关系。你通常会看到，占用大量内存的大型程序运行缓慢。\n\n将程序分解为子程序可以让你的程序具有结构。你可以将任务划分为多个子任务，为每个子任务开发一个函数，并将它们集成到一个程序中。一旦一个函数编写完成并经过全面测试，程序员就可以预期它能顺利地与其他程序模块配合。\n\
    \n一旦函数编写、测试并确认符合预期，就可以将其加载到库中，并用于完全不同的应用程序。这种方法鼓励代码复用。\n\n## 5.3. 声明函数\n\n读完关于函数的序言后，你一定急切地期待着开始并进入正题。不再让你等待，现在就从声明一个函数开始，它是函数结构中的基本砖块之一。\n\
    \n这个例子将有助于消除你心中的疑虑。为了保持简单，不包含任何参数。\n\n```c\n#include<stdio.h>\nmain()\n{\n   \
    \ tips();\n    /* caller */\n    printf(\"\\n Success is about hanging on after\
    \ others have let go\");\n}\ntips()\n/* called */\n{\n    printf(\"\\nWhen you\
    \ reach the end of the rope tie a knot & hang on\");\n}\n```\n\n上述程序是一个简单的例子，帮助你初步了解实际情况。在这个程序中，在\
    \ main 函数之后，名为 tips 的函数被调用。一旦发生这种情况，控制权就会传递到定义 tips 函数的地方。\n\n控制权到达被调用函数后，它会执行该函数中的语句，然后返回到调用函数，并执行其后的语句。因此，上述程序的输出将是：\n\
    \n当你走到绳子的尽头时，打个结，坚持下去。当别人放手时，成功在于坚持。\n\n## 5.4. 调用函数\n\n刚才详细解释了声明函数的复杂性，但如果你只是声明一个函数而不调用它，那有什么用呢？因此，现在你将处理调用\
    \ C 函数的过程。你已经定义了函数，但如何让编译器执行函数定义中的代码呢？很简单，只需调用它。所谓调用，就是你给出某种指示，或者更准确地说，是一种箭头标志，请求编译器转向，并从指定的位置继续执行。\n\
    \n对于这些问题，你应该了解 C 语言武器库中存在的不同类型的变量。变量类型包括：局部变量和全局变量。\n\n### 局部变量\n\n你很清楚 main 是一个函数，你可以在其中声明任意数量的变量。那么，如果一条规则适用于一个函数，为什么不能适用于其他函数呢？当然可以。\n\
    \n你可以在任何函数中声明任意大小和类型的变量。因此，在函数内部声明的变量称为局部变量，它们在函数内有效并可使用。这些变量的生命周期仅限于函数内部。这正如程序中某个特定变量的值不可能对所有程序都存在一样。\n\
    \n任何破坏规则的尝试都会导致错误。但有时你可能需要从另一个函数访问该变量，C 语言也考虑到了这一点。可以通过参数传递从其他函数导入值。但在传递参数时，应注意传递相同数量的变量和相同的类型。因此，实际参数会被复制一份并传递给形式参数。这一切对程序员来说都是额外的负担和麻烦。此外，多个函数需要共享信息，这会导致参数的一再传递，影响程序的性能。如果在子函数中修改变量的值，不会影响主函数中该变量的值。\n\
    \n### 全局变量\n\n在你可以指责 C 语言在某些领域效率低下之前，它提出了一个替代方案。减少上述问题的替代方法是全局声明变量。在第一次会议/章节中，你已经看到了全局声明的例子。全局变量也称为外部变量，与仅限于拥有它们的函数的局部变量不同，全局变量可以在程序的任何地方使用。全局变量在\
    \ main 之外声明，即在程序开始之前声明，其值在整个程序中有效。全局变量的存储位于 C 编译器为此特定目的预留的固定内存区域中。\n\n当程序中的许多函数使用相同的数据时，全局声明的有效性就能体现出来。将变量定义为全局变量尤其有利，因为它的值可被所有其他函数使用。但这其中唯一的风险因素是，如果某个函数操作或修改了全局变量，那么同时使用该变量的任何其他函数都会得到修改后的值。因此，考虑到上述影响，必须明智地选择使用全局变量。\n\
    \n## 5.6. 向函数传递参数\n\n你之前已经了解了参数和参数传递的知识，但如果你觉得概念不清楚，那么本节的这一部分将帮你理清。在这里，你不仅会清楚什么是参数，还会熟悉基于所传递参数的不同函数类型。\n\
    \n在函数中传递参数的概念使其更易于使用，原因是参数充当了调用函数与被调用函数之间的通信媒介。你可能没有意识到，在处理大量的 printf 和 scanf\
    \ 函数时，你已经使用了参数。在括号内指定的内容被视为参数。基于传递给它们的参数，函数类型如下所列：\n\n-   不接受参数且不返回任何值的函数。\n-\
    \   接受参数但不返回任何值的函数。\n-   接受参数并返回值的函数。\n\n以上每种类型都将逐一讨论，这样你就能不仅仅是概览 C 语言武器库中可用的函数类型。不接收参数且不返回值的函数。对于这种类型的函数，调用函数和被调用函数都不接受任何参数。\n\
    \n这里发生的是，当调用一个函数时，控制权直接跳转到被调用函数，并执行被调用函数中指定的语句。在被调用函数中的语句执行后，控制权返回到主程序。\n\n示例：\n\
    \n```c\nmain()\n{\n    mus();\n}\n\nmus()\n{\n    printf(\"My Honey\");\n}\n```\n\
    \n"
