    completed program actually does. Program design charts outline the specific steps
    used in the program to produce the desired results. The types of testing done,
    the data used, as well as the errors found are typically recorded in separate
    documentation. Details on how to operate a program are presented in an operator’s
    manual. Maintenance documentation is record of the changes made to the program
    and a detailed explanation of those changes.


    The type of documentations kept depends on each programming department’s various
    requirements.


    Keeping in mind that each step of the program development process should be properly
    documented, let’s take a look at each of the size steps.'
