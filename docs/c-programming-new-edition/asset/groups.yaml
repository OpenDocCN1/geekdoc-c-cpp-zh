    在熟悉了 C 编程的基础知识以及该做和不该做的事项之后，我想是我们该继续前进，挖掘让 C 如此主导的原因了。可以说最后两次课程只是预告片，而冰山剩余的部分从这里开始。然后有人可能会问，在第一课学习这么多有什么乐趣，以及我们什么时候才开始实践。你现在就开始实践了。本课程涉及
    C 使用其工具来控制程序运行的情况，或者说它指导其语句在特定情况下如何行动。


    ## 3.1. 为什么需要控制语句？


    嗯，这是一个有趣的问题。有人可能会问，既然 C 是一种如此全能的语言，拥有如此多的特性和规范，为什么还需要引入单独的控制语句呢。嗯，这很难说，但正如前面课程中提到的，由于
    C 执行了如此多不同的功能，它需要一种管理体系来指示计算机何时执行何种功能。控制语句充当经理。你会被不同控制语句处理的函数数量所惊讶。


    例如，在一个程序中，你可能有一个语句需要执行乘法运算，下一条需要执行加法运算，下一行之后可能有一个语句希望自己重复 8 次，而另一个语句可能希望自己被跳过并在稍后处理。


    所有这些条件都由控制语句管理。你在上一课中已经瞥见了不同类型的控制语句，现在是深入其中的时候了。你在上一课中看到了控制语句的广泛分类，这里是它们所拥有的各种细分，用图表表示。


    Control Statement  Sequence  Decision  Loop  Case  if  ifelse  while  dowhile  switch  goto  for


    顺序控制结构是基本且不复杂的控制语句之一。想法非常简单。在顺序控制指令中，待执行的语句以串行方式一个接一个地执行。


    C 编译器首先执行第一行，然后依次移动到下一行，整个程序都是以这种方式执行的。例如，如果第一个语句要求计算机执行数学运算，那么当编译器遇到该语句时，它会计算该运算并将答案存储在内存中，然后才进入下一行。决定！决定！决定！在任何地方任何时间做这件事都是困难的。之所以这是我们生活中最困难的活动，是因为在做出决定之前，无论对错，都必须权衡利弊，然后才能做出决定。


    ![](img/c948b22e3869eae71cd653f0917e0009_51_0.png)


    在遇到特定决策时，并没有即时公式或现成的决策可以采用。但 C 有。C 使用这些选项来应对特定情况。满足条件后即可得到结果。决策控制指令可在 C 中使用以下语句实现
    The if statement The if else statement The conditional operators 现在让我们理解每个语句背后的概念（图
    3.1）。


    ## 3.2. IF 语句


    if 语句对跟随其后的特定条件做出反应。除非 if 后的条件得到满足，否则其后的语句将不会被执行。这就像一个人说“如果我被支付 100 卢比，那么工作就会由我完成。”


    在上面的例子中可以注意到，如果该人被支付 100 卢比（即条件为真），那么工作才会被他完成，否则工作就不会被他完成（条件为假）。这里的条件是支付 100 卢比，如果条件为真则要执行的语句是，工作被完成。由于计算机无法辨别我们用普通英语写的内容，我们必须以计算机可理解的形式编写。一般格式如下所示：


    if (此条件为真)


    执行此语句；现在有人可能会问为什么只有单词 if 而不是其他单词。嗯，关键字 if 所做的是通知编译器其后跟随的是决策控制指令，如果括号中的条件为真，则执行其后的语句，但如果条件不满足，则不执行任何语句。


    条件必须在括号内指定。为什么？因为一旦写下语句，括号跟随 if，编译器就会识别出这是一个条件，需要检查其真假。这是通过 C 的关系运算符（<, >, <=,
    >=, ==, !=）完成的。


    使用这些关系运算符，我们可以比较两个值是否相等，或一个是否大于另一个，或一个是否小于另一个，等等。 x== y x 等于 y x!= y x 不等于 y x
    < y x 小于 y x > y x 大于 y x <= y x 小于或等于 y x >=y x 大于或等于 y 使用 if 的多条语句 上面解释的例子对于
    if 之后的一条语句来说是好的。


    但如果我们想在 if 之后执行多条语句，我们可以吗？以上面的例子我们可以解释说那个人说“如果我被支付 100 卢比，工作就会由我完成，我会定期工作，我会在
    5 天内完成工作。”这里仅凭一个条件顺序执行了三个动作，即第一个动作是工作正在进行，第二个动作是该人会定期来，第三个是工作将在 5 天内完成。


    现在出现了用 C 编写的问题。格式与上面解释的类似，只是稍有增加，即语句必须一个写在另一个下面，并且所有语句都必须用一对大括号括起来。一般格式看起来像这样：


    if (此条件为真)


    {


    执行此语句；


    执行此语句；


    由用户输入并根据其数据类型存储在 Line 10 是条件检查语句，其中给定的条件被评估。这里比较两个数字并检查哪个更大。如果 a 的值大于 b，则执行第 11
    行的输出函数并显示。


    类似地，如果 b 的值大于 a，则执行第 13 行的输出函数并显示。嵌套 if else 在我们进入下一个概念之前，if 结构有一个小特性，有助于我们有效编程决策控制结构。简单来说，就是在
    if else 中使用 if else。这就像你有两个同心圆，一个圆被包围在外圆内。


    编译时首先检查外部 if 条件是否有效，如果为真则执行该语句，但如果为假则检查内部 if else 条件。也就是说，代替一个语句包含一个 if else。如果为真则执行该语句，但如果为假则执行最后一个
    else 语句。嵌套 if else 的格式如下。在我们真正涉足复杂的各种循环语句之前，让我们先探究循环的更广泛方面。循环可以描绘为不断发生的事件循环。


    例如，工人说罢工将继续进行直到我们的要求得到满足。以上意味着一个过程将继续进行直到满足条件。一旦条件满足，循环就终止。但在 C 编程中，它并没有看起来那么字面化。为了执行一次特定的迭代，必须分派一组语句，但幸运的是在
    C 中，与其他语言相比，这些语句仅限于适量的语句。


    有三种方法可以编码循环语句，并且可以有效地完成 For, While, Do while。


    ## 3.4. FOR 语句


    for 在 C 编程世界掀起了一场叛乱。闻到 for 味道的程序员对其他品种视而不见。他们在 for 中找到了如此多的慰藉，以至于他们认为其余的只配暖棚。但是什么让
    for 在大众中如此受欢迎？一个单一的循环语句。for 的特别之处在于，整个循环结构在之前的尝试中用了三行，现在被压缩成了一个孤立的语句。太棒了，不是吗？这就是
    for


