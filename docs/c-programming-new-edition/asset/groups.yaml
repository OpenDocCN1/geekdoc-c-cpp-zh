    # 9.10.1. Radix Sort


    The radix sort can be declared as the most efficient sorting methods available.
    It is generally applicable for 2 digit numbers but the concept holds good even
    for 3 digit numbers though the examples dealt with here are only using two digit
    numbers.


    This version of the sorting technique is pretty simple and involves in dividing
    every element into two parts. The right digit or the digit in the tens place is
    called most significant digit (MSD) and digit in the units place is called least
    significant digit (LSD). Example: in the number 40 the LSD and the MSD are demarcated
    as follows:


    MSD: 4 LSD: 0


    The whole sorting process is carried out on the basis of sorting the LSD and MSD.
    The whole radix sort process is two step procedure where the sorting in the first
    step is based on lsd and sorting in second is based on msd.


    ![](img/c948b22e3869eae71cd653f0917e0009_169_0.png)


