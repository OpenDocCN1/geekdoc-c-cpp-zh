    # 7.1. Comment-Statement


    The comment statement helps you to identify the purpose of the program. A comment
    statement can be used anywhere in the program whenever the need arises for a particular
    statement to be explained or if some information about the statement has to be
    referenced later.


    A comment statement opens with a slash followed by an asterix (/*) and ends with
    an asterix followed by a slash (*/). The compiler ignores the comments and these
    types of comments have no effect on the program.


