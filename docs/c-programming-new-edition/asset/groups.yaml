    在上一节或章节中，你已经了解了 C 语言的基础知识。在本节中，你将处理构成 C 语言核心的关键问题。正是这些问题支撑起了 C 语言这座坚固的堡垒。


    ## 2.1. 基本数据类型


    C 语言博大精深，支持多种不同类型的数据，每种数据在内存中都以不同的方式表示。内存中的数据可以是整数类型、字符类型或带小数点的整数类型。每当程序中用到整数或字符时，计算机必须能够识别在内存中的何处存储它。试想一下，如果字符被存储到了整数的位置，那会引起怎样的混乱。为了避免这种情况，这里只包含了基本数据类型及其内存需求。为了更好地理解
    C 语言编程的基础知识，下面以表格形式展示了基本数据类型。


    ### 2.1.1. 数据、描述、内存范围


    int 整数 2 字节 −32768 到 +32768，%d、%i；char 字符 1 字节 0 到 255，%c、%s；float 带小数的数字 4 字节
    1.0E-37 到 1.0E+37，%f；double 带大范围小数的数字 8 字节 2.2E-308 到 2.2E+308。既然数据类型已经以一种非常易于理解的方式呈现，你可以逐一查看每种数据类型。int
    这种数据类型仅用于存储整数，不能处理分数或带小数的数字（图 2.1）。


    | 类型 | 字节 | 取值范围 |

    |---|---:|---|

    | int | 2 或 4 | -32,768 到 32,767 |

    | unsigned int | 2 或 4 | 0 到 65,535 |

    | signed int | 2 或 4 | -32,767 到 32,767 |

    | short int | 2 | -32,767 到 32,767 |

    | unsigned short int | 2 | 0 到 65,535 |

    | signed short int | 2 | -32,767 到 32,767 |

    | long int | 4 | -2,147,483,647 到 2,147,483,647 |

    | signed long int | 4 | -2,147,483,647 到 2,147,483,647 |

    | unsigned long int | 4 | 0 到 4,294,967,294 |


    **图 2.1.** C 语言编程中的数据类型。


    int 能处理的数字范围为 −32,768 到 +32,768。在大多数计算机上，int 需要 2 字节内存。char 数据类型用于存储单个字符或字母，只需要
    1 字节内存。大多数编译器允许 char 数据类型的范围为 0 到 255。float 数据类型用于保存浮点数，简单来说，就是用于存储带小数的数字（例如 67.25）。float
    需要 4 字节存储空间，小数精度为 6 位。double 数据类型也用于保存浮点数。区别在于精度和存储空间。double 提供更高的精度，约 15 位数字，编译器需要
    8 字节来存储 double。float 可表示的取值范围分别是 2.2E-308 和 2.2E+308。


    ## 2.2. 用于基本数据类型的限定符


    你已经了解了基本数据类型是什么。简化地说，限定符可以看作是基本数据类型的“类固醇”，也就是说它们是增强剂。通过使用这些限定符，可以增强数据类型的效率，扩展基本数据类型的使用范围，使其更加灵活和适应性强，能够精确、准确地应对各种情况。


    添加到数据类型上的限定符有 LONG、SHORT、SIGNED 和 UNSIGNED。要将任何数据类型变为限定符，需要将限定符的名称放在数据类型之前。


    long 限定符，顾名思义，会扩展其前缀数据类型的取值范围。它只能应用于 int 和 double 数据类型，可将取值范围从 −2,147,483,647
    扩展到最大 2,147,483,647。long int 需要比普通 int 更多的内存，因此占用 4 字节存储空间。要使整数成为 long 限定符，只需在其前面加上
    long。


    short 这个限定符最有趣，因为如果普通 int 与 long 具有相同的内存大小（即 4 字节），那么 short 将有 2 字节；但如果 int 有
    2 字节内存，那么 short 将有相同的内存，即 2 字节。


    使用 signed 数据限定符后，该数据类型可以容纳正数和负数。当变量是有符号时，其正负范围与常规 int 相同。默认情况下，int 是有符号数据类型。


    unsigned 限定符主要用于 int，并且它具有与普通 int 相同的内存需求，即 2 字节。所以，你可能会问，两者之间的区别在哪里？区别在于它所提供的范围。这个限定符所拥有的范围是普通
    int 的两倍。具体来说，unsigned int 的范围从 0 到 65,535。


    现在可能困扰你的另一个疑问是 unsigned 和 long 之间的区别。一个需要牢记的重要事实是，与 long 不同，unsigned int 不能存储负数。unsigned
    int 可以应用于其他 int 限定符，例如 unsigned short int 和 unsigned long int。


    ## 2.3. C 语言中的变量


    假设你有一些钱，想把它存放在一个安全的地方。你能想到的最好的地方就是银行，你把钱存在你的账户里，账户有一个 ID 号码。因此，每当你想取钱时，只需出示该 ID，银行工作人员就能确认你的钱在那个特定账户中。


    类似地，你有一个数字，需要把它存放在某个安全的地方，以便在需要时可以检索和使用。在这里，你把它存储在内存中（银行）。好，那么你已经把数字存储到内存中了。但是存储在哪里呢？之所以会产生这样的疑问，是因为内存非常广阔，一个小数字可以存储在任意位置。为了确定它存储在哪里，你可以为这个位置命名（账户），这个名字就叫做变量名（账户
