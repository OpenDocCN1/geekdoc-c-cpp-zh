    \n### 初始化成员\n\n一旦声明了新的结构体数据类型，就可以根据程序员的需求定义该类型的变量。例如，可以声明结构体变量 e1、e2、e3 为 struct\
    \ employee 类型，如下所示：\n\n```c\nstruct employee e1, e2, e3;\n```\n\n现在问题来了：你在哪里声明上述语句？这可以在结构体的右花括号之后，以以下几种不同的方式完成。\n\
    \n```c\n};\n/* closing brace */\n\nstruct employee e1, e2, e3;\n```\nOR\n```c\n\
