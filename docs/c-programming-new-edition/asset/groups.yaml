    \ 17 行。现在你已经有了装载了值的两个矩阵，这两个矩阵需要相加并插入到第三个空数组中。为了完成这一壮举，再次召唤 for 循环，并且它们必须出现在用于相加的公式之前。这些\
    \ for 循环在第 22 行和第 24 行提到。第 26 行给出了程序的逻辑。一旦值被相加并插入到第三个数组中，该数组就需要被显示，输出语句在第 34 行解释，借助第\
    \ 32 行和第 34 行的 for 语句。最后的 printf 语句带有“\\n”使结果以矩阵格式出现。\n\n你一定在想为什么程序中会充斥着大量的打开和关闭大括号。当程序中包含多个\
    \ for 循环时就会指定大括号。这表明跟随 for 循环之后的大括号内的语句仅特定于该特定 for 循环。\n\n## 三维数组\n\n三维数组与二维数组相似。不同之处在于它多了一对方括号，用来定义矩阵的表数。\n\
    \n因此，三维数组的声明如下：\n\n## 4.10. 字符数组\n\n这是数组的又一卓越特性，它将 C 的光辉提升到无尽的高度。到目前为止你只处理过整数数组，但这并不意味着数组的边界仅限于\
    \ int。C 如此灵活，以至于它也扩展到字符。它意味着数组也可以使用字符形成。这样的字符数组被称为字符串。字符串是一组按特定顺序排列的字符。\n\n通过一个示例来看一下字符数组中的初始化过程：\n\
    \n```c\nchar name[10] = \"MyDharm\";\n```\n\n在上面的例子中，name 是一个数组，其元素容纳能力为 10，并且它保存一个名为\
    \ \"MyDharm\" 的字符串。第一个元素存储在数组 name 的 [0] 位。也就是说，字母 ‘M’ 将存储在 [0] 位，‘y’ 将在 [1] 位，以此类推直到\
    \ [9]。\n\n可能会产生疑问，既然数组只能容纳 10 个值，却只输入了 7 个，剩下的会怎样？这里，由于只容纳了 7 个值，第 8 个值将是一个空字符(\\\
    0)，它表示字符串的结束。如果数组索引中有空位，这个空字符会自动放置在字符串的末尾。\n\n在从用户处获取输入时，除非伴随特定的格式说明符，否则两个字符之间不能存在空白。为了容纳上述特性特征，初始化应该动态进行。\n\
    \n### 动态字符初始化\n\n你已经在本节早期处理过动态初始化的方法。只是为了刷新你的记忆，变量的初始化是通过用户通过动态初始化完成的，即初始化不是在程序中完成的，并且值在每次编译程序时都会刷新。\n\
    \n这个简单的例子解释了上述内容：\n\n```c\n/* program to accept characters from the user in an\
    \ array*/\n#include<stdio.h>\nmain()\n{\nchar cap[10];\nprintf(\"Enter the capital\
    \ of your country\");\nscanf(\"%s\",cap);\nprintf(\"%s is the capital of your\
    \ country\",cap);\n}\n```\n\n从第 5 行开始，因为前面的行必须很容易解读。第 5 行是数组的动态初始化发生的地方。它指示编译器创建一个可以容纳\
    \ 10 个字符类型元素的数组。第 7 行根据第 6 行的显示语句接受用户输入的字符串。第 8 行从数组中检索存储的字符串并将其显示回屏幕。\n\n字符数组动态初始化的另一个特性是它便于在字符串的字符之间包含空白。这可以通过以下方式更改\
    \ scanf 语句中的格式说明符来实现：\n\n```c\nscanf(\"%[^\\n]\", arrayname);\n```\n\n如果未指定上述语句，并且甚至尝试在字符串中插入空白，则字符串中存在的字符之后的内容将被无情地终止。编译器拒绝承认空白之后的任何字符。\n\
    \n## 4.11. 数组溢出\n\n如果对 C 有任何批评，那也只能在这方面。数组溢出可以简单地理解为越界。用 C 的术语来说，当声明了一个特定大小的数组时，只能向该数组中插入那么多元素。\n\
    \n如果超过了该大小限制，就会形成错误，导致程序运行不规则，并且 C 传统上不检查数组溢出。例如，如果你声明一个数组如 sal[10] 并输入 12 个元素，则会执行非法操作，导致无法弥补的损失。不仅插入，而且访问未声明大小的元素也是非法操作。\n\
    \n事情不会在错误发生后就停止，程序可能会变得一团糟。这完全取决于被覆盖的那些变量的重要性以及它们在程序中后续的使用位置。瑕疵的结果可能会立即震惊你，也可能在程序的进程中逐渐显现。这种\n\
    \n处理了二维和三维数组。字符数组和数组的边界检查构成了本节的结尾部分。\n\n## 再次回顾：\n\n### 填空：\n\n- 1. 两个或多个数组组合在一起称为\
    \ ________ 数组。\n- 2. 数组元素索引始终从 ________ 开始。\n- 3. 数组中的元素以 ________ 方式存储。\n- 4.\
    \ 在三维数组中，三个方括号中的两个代表行和列，第三个代表 ________。\n- 5. 数组的初始化是使用 ________ 控制结构完成的。\n\n\
    ### 判断正误：\n\n- 1. 随着数组维度的增加，方括号的数量会增加。\n- 2. 静态初始化是在数组声明时完成的。\n- 3. 在从用户处获取输入时，两个字符之间可以存在空白。\n\
    - 4. 下标值可以为负数。\n- 5. 下标值可以超出范围。\n\n### 一句话回答：\n\n- 1. 什么是数组？\n- 2. 数组有哪些不同类型？\n\
    - 3. C 中数组初始化有哪些不同类型？\n\n## 5.1. 函数简介\n\n你即将提升你在 C 的又一羽毛上的技能，如果只用大约半页的介绍就会剥夺它的优点。之所以如此强调，是因为如果你认为数组无与伦比，那么函数的影子就会让数组望尘莫及，这并不是夸张，因为数组是一个概念，但函数是它自己的传奇，有着可追溯的优点。它就像吹笛人吹奏的长笛，丘比特的军械库，没有它就无法执行规定的操作。\n\
    \n根本无法想象在没有函数的情况下编写 C 程序。这是不可能的。一旦你采用函数，你就会意识到你从像函数这样的真朋友那里获得的安慰程度，因为它简化了你的工作。它执行你命令它执行的任务。它类似于雇佣特定的人做特定的工作。\n\
    \n例如你依靠电工修复烧坏的保险丝或木匠安装厨房橱柜。同样，函数以完美无瑕的精度执行分配给它们的任务。它像贝多芬的现场音乐会一样优雅完美。\n\n### 函数是如何执行的？\n\
    \nC 中的函数通常在程序执行过程中需要执行特定指令集不止一次时使用。假设一段特定的代码找出 8 年级学生的平均成绩。稍后还需要找出 10 年级的平均成绩。\n\
    \n没有必要再次编写相同的代码。这就像重新发明轮子。代码可以写成一个函数，并且每次只需更改值即可使用。\n\n如何完成这一壮举是当代码写在函数中时（如何做到这一点稍后讨论），该特定函数可以通过在程序中的任何位置提及函数名后跟括号来调用，例如，sub()。这被称为调用函数。采用函数被证明是额外的资产，因为函数易于编码和理解，除了更容易调试。也就是说，由于函数的简单紧凑性质，很容易找出错误，并且错误更明显。\n\
    \n此外，包含函数的程序更容易维护，因为如果需要修改，则限制在某些函数中。如果你认为这太多了，听听这个。函数可以存放在一个库中\n"
