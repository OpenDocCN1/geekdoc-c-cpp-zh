  mdcn: "\n\n## 4.4. 数组声明\n\n术语声明到现在应该对你很熟悉了。正如你在之前的声明尝试中所做的那样，这里你声明一个数组，即编译器应该知道要创建什么类型的数组以及你希望它的类型和大小是什么。此外，当进行此声明时，它会指定给内存，已声明的空间量必须保留为储备以容纳该数组的元素。一般格式如下。\n\
    \nint sal [15]。int 如你所知指定了数据类型给编译器，而“sal”是赋予数组的变量名。直到现在一切都应该很熟悉。 [15] 是需要品味的部分。数字\
    \ 15 表示需要容纳 16 个 int 类型的值，并且它们都以 sal 的名义存在。方括号 [] 表示计算机遇到了数组声明。随着数组维度的增加，方括号的数量也会增加。也就是说，二维数组将有两个对的方括号，三维数组有三个对的方括号，以此类推。\n\
    \n## 4.5. 数组初始化\n\n声明数组的初始步骤已完成。你已为其命名变量并声明了其大小，但到目前为止数组是空的。它就像一个没有书的书包。同样，变量的声明已完成，但必须向其中传递一些值。你可能熟悉初始化普通变量，但如何初始化一个数组，其中一个数组变量中必须初始化多个值。输入数组数据：现在你已通过指定名称和大小声明了一个数组，你可以尝试探索数组中每个元素的个性，也就是说数组中每个元素是如何寻址的。\n\
    \n数组元素索引始终从 0 开始。Number[0] 第 1 个元素 Number[1] 第 2 个元素 Number[2] 第 3 个元素 Number[3]\
    \ 第 4 个元素 这意味着 [0] 将保存第一个值，[1] 保存第二个，[2] 保存第三个 & 以此类推。如果你想访问数组“sal”的第四个元素，你必须写\
    \ sal [3]。你可以用下标替换数字，比如 i、a、x 等。因此，数组 sal 将写为：Sal [i] 变量 i 并非特定于任何元素，但可以一次引用数组中的各种元素。\n\
    \n```\nfor (i=0; i<=14;i++)\n{\nprintf(\"enter sal\");\n```\n\n```\nscanf(\"%d,\
    \ &sal[i]);\n}\n```\n\n为了输入数据，你使用了一个 for 循环，通过它用户输入的元素数量被放置在数组中。当用户为 sal 输入第一个值时，它存储在\
    \ [0] 位置，然后使用 i++ 增加元素的位置，如果输入任何下一个元素，它将被放置在该位置，即 [1]。同样的过程一直持续到第 15 个元素输入后，条件不满足，循环被打破。上述初始化过程称为动态初始化，但这并不是初始化可以采用的唯一方式。\n\
    \n为了实现这一目标，C 描述了两种不同的方法：\n\n- i. 静态初始化；和\n- ii. 动态初始化。\n\n## 4.6. 从数组访问数据\n\n\
    你已通过先初始化然后读入数组来将数据存储在数组中。如何取出它们以便使用它们。再次 for 循环出现在画面中并卸载所有元素，而不是像第一次那样加载。你已在名为\
    \ sal 的数组中输入了 15 个元素。假设你想找到数组中所有元素的总和。按照下面给出的步骤操作。\n\n```\nsum =0;\n/* temporary\
    \ variable */\nfor(i=0;i<=14;i++)\nsum=sum+sal[i];\n/* value of sal[i]added to\
    \ sum*/ printf(\"sum=%f\",sum);\n```\n\nfor 从 [0] 开始卸载每个元素。第一次，[0] 位置的元素占据 [i]\
    \ 的位置，当它与 0 相加时，其值进入 sum。接下来，[1]st 位置的元素替换 [0]th 位置的元素，它被加到已经有计算值的 sum 上并形成新的\
    \ sum。这一直持续到位置 14 的元素进入 i，最后打印出具有所有加总值之和的和。\n\n## 4.7. 使用数组的简单程序\n\n```\n/*array\
    \ program to find average marks of 5 students */\n#include<stdio.h>\n\nmain()\n\
    {\n    int i;\n    int mar[5];\n    float avg,add=0;\n    for(i=0;i<=4;i++)\n\
