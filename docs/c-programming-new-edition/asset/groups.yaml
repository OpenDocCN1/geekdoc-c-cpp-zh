    these issues you should be aware of the different kinds of variables that exist
    in C’s arsenal. The types of variables being the: Local Variables Global Variables
    Local Variables You are aware of the fact that main is a function and you can
    declare any number of variables within it. So, if a rule holds good for one function
    why cant it for other functions? It definitely can.


    You can declare a variable inside any function belonging to any size and type.
    Thus, variables declared inside a function are called local variables and are
    valid and can be used within that function. The life of these variables exists
    until they are within the function. It is same, as the value of a particular variable
    in a program cannot exist for all the programs.


    Any attempt to break the rules will result in an error. But sometimes you might
    need to access the variable from another function, well C takes care of this too.
    The values can be imported from other functions by passing them in parameters.
    But with passing parameters care should be taken that the same number of variables
    and the same type are being passed. Thus, a copy of the actual parameters is made
    and passed to the formal parameters. All this is an extra burden and is cumbersome
    for the programmer. Beside this, several functions are required to share information,
    which results in transmission and re-transmission of parameters, which affect
    the performance of the program. The value in the variables if altered in a sub-function
    does not affect the value is the main function.


    Global Variable Before you can accuse C of being inefficient in certain areas
    it pops up with an alternative. The alternative for reducing the afore mentioned
    problem is declaring the variables globally. You were given an example of the
    global declarations in the first session. The global variables are otherwise called
    external variables and unlike the local variables which are confined only to the
    function which has them, the global variables can be used anywhere in the program.
    The global variables are declared outside the main, i.e., before beginning the
    program and the values hold good throughout the program. The storage for global
    variables is in a fixed region of memory set aside for this specific purpose by
    the C compiler.


    The effectiveness of declaring globally can be felt when many functions in a program
    use the same data. Defining a variable as global is particularly advantageous
    because its value is made available to all other functions. But the only risk
    factor involved in this is that if any function manipulates or alters the global
    variable then any other function using the same variable at the same time gets
    the altered value. So, the choice of using global variables has to be made judiciously
    considering the above implication.'
