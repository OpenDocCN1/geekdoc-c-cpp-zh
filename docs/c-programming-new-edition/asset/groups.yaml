    \ 应该做和不应该做 | 62 |\n| 4.13. 总结 | 62 |\n\n### 4.1. 数组简介\n\n在之前的课程中，你已经接触到使用变量在内存中存储特定数字或字符的各种方法。要实现这一功能，需要一个变量，如果使用\
    \ 4 个数字，就需要 4 个变量。现在如果要存储 10 个数字呢？有人可能会说完全可能，但如果要存储 134 个数字并在需要时随时检索，这是否仍然可能？\n\
    \n有了数组就可以。你可能会问为什么一开始不使用数组？你需要对数据类型及其行为有基本的理解才能学习数组。此外，数组的概念依赖于其他数据类型，这些数据类型旨在在一个变量中存储大量数字。无法想象为单个数字创建数组并浪费内存中整块空间。这就像买了一打书，最终只用一本，其余的都扔进垃圾桶。\n\
    \n因此，数组可以定义为相似元素的集合。在此上下文中，只有当所有元素都是同一数据类型时才能形成元素数组，即它们全部都是整数或字符或浮点数，但不能存在一个容纳这些数据类型混合的数组。\n\
    \n### 4.2. 数组的优点\n\n数组的使用对任何专业编程都至关重要。数组只是让程序员的生活变得轻松一些。乍一看，它免除了程序员必须为变量命名负担的烦恼。它们遵循老式的插槽架原则。数组是一个保存多个数据的单一变量。每个数据都通过其槽号引用。例如，如果你想存储一组项目，你只需将变量命名为“item”，然后通过引用\
    \ item(1)、item(2)、item(3) 等来存储数据。这听起来很简单，但使用数组可以完成的工作量是值得称赞的。\n\n为了更好地了解数组的优点，请考虑一个简单示例：\n\
    \n```c\nmain()\n{\n    int a;\n    a = 2;\n    a = 4;\n    printf(\"a=%d\", a);\n\
    }\n```\n\n显示的值显然是 4，因为一旦给已有值的变量赋予另一个值，先前的值就会丢失。由此得出的推论是，没有数组，变量无法存储多个值。元素排列在数组后，任何位置的任何元素都可以轻松检索。使用数组，英文句子可以用你所说的字符数组存储，也称为字符串。\n\
    \n### 4.3. 数组的类型\n\n在你深入使用数组的实质之前，如果对数组的分类有更多了解，了解它们分为多少种类型及其功能，对你不会有任何坏处。首先，数组大致分为两大不同类型：单维数组和多维数组。上述数组的这些分支的复杂性将在本节后面以详尽的方式处理。这里讨论的内容将纯粹是形式上的。\n\
    \n**单维数组：** 单维数组顾名思义，只处理一系列相似元素。也就是说，你只能有一行元素，单维数组的大小取决于程序员。\n\n基本上，单维数组便于在一个变量中容纳许多相似元素。关于这一点将在后续章节中详细讨论，之后你将对单维数组有清晰的认识。\n\
    \n**多维数组：** 多维数组是两个或多个数组组合在一起。\n\n它们可以是二维类型或三维类型或更多，但你可以将研究限制在二维和三维数组上。二维数组的一个例子是矩阵，因为与矩阵一样，二维数组有两个索引，一个表示行元素，另一个表示列元素。三维数组有所不同，因为第一个索引列出了二维数组的表数。剩下的两个索引与二维数组相似，因为一个用于行，另一个用于列。\n\
    \n"
