    \ C 程序以小写书写。所有关键字都必须小写。\n- C 程序中的所有语句都以分号结束。\n\n这些是解决 C 程序时必须保持的基本理念。\n\n现在你已经熟悉了游戏规则，你可以认真对待你的业务，并查看一个基本的\
