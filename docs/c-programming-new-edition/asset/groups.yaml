    \n```c\nstruct employee\n{\n    char ename[10];\n    float esal;\n    int eno;\n\
    };\n\nstruct employee e1 = {\"Johnny\", 500.00, 101};\nstruct employee e2 = {\"\
    Davis\", 1000.00, 102};\n```\n\n如果你对这种初始化方式不满意，另一种方式是借助 scanf() 向用户请求输入。这种类型将在后面处理。\n\
    \n### 访问成员\n\n既然你已经声明并初始化了结构体变量，现在是时候看看如何访问这些变量，以便在程序中使用它们（图8.1）。\n\n![](img/c948b22e3869eae71cd653f0917e0009_137_0.png)\n\
    \n**图8.1.** 声明和访问结构体。\n\n在数组中，你使用下标来访问元素。这里，你使用点号（.）来访问数据。假设你想要第二个员工的薪水，那么可以写成如下方式：`e2.esal`。其中\
    \ e2 称为结构体变量，esal 称为成员。\n\n结构体变量和结构体成员之间必须存在一个点号。\n\n## 8.4. 结构体的内部表示\n\n既然在声明、初始化和访问结构体时发生了这么多事情，那么所有的变量和值实际上存储在内存中的什么位置呢？结构体的所有元素，无论数量或类型如何，都存储在连续的内存位置中，分配给数据类型的字节数与之前相同。第一个员工“Johnny”的详细信息的内部表示可能如下所示，他的薪水为\
    \ 500.00，员工 ID 为 101，还有一些附加的数值，存储在连续的内存位置中：\n\n内存布局：\n\n| 变量 | 值 | 内存地址 |\n|---|---|---|\n\
    | E | 'E' | 0x1000 |\n| 姓名 | \"Johnny\" | 0x1001 |\n| 薪水 | 500.00 | 0x1008 |\n\
