    \ `--`）。你可能又在想两个加号或两个减号有什么作用。好吧，当自增运算符前缀于保存整数的变量时，它会使数字的值增加一。\n\n同样，自减运算符会使值减少一。简单来说：\n\
    \n- **示例 2.5：** 如果你给整数 `a` 分配值 3，那么写 `++a` 就相当于写成 `a = a + 1`。因此，`a` 的修改后值为 4。同样，`--a`\
    \ 意味着 `a = a - 1`，其修改后值为 2。另一个值得提及的运算符是 `sizeof` 运算符。如名称所示，每当此运算符前缀于操作数时，就会返回操作数以字节为单位的大小。\n\
    \n假设 `x` 是整数，`y` 是浮点数，那么 `x` 和 `y` 的大小可以按如下方式确定：\n\n```c\n#include<stdio.h>\n\
    void main()\n{\n    int x;\n    float y;\n    printf(\"integer: %d\", sizeof x);\n\
    \    printf(\"float: %d\", sizeof y);\n}\n```\n"
