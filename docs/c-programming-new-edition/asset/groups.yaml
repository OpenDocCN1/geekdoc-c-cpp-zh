    \ your mind.\\n \");\n}\n```\n\n当上面的程序编译并执行时，输出显示如下：C Through your mind. 如果在凝视上面的程序后你感到头脑发晕，没有理由担心，因为帮助即将到来。你现在将分解上面的程序并仔细研究每个部分，从第一行开始。\n\
    \n### 7.1. 注释语句\n\n注释语句帮助你识别程序的目的。注释语句可以在程序中的任何地方使用，每当需要对特定语句进行解释或如果需要稍后引用有关该语句的信息时。\n\
    \n注释语句以斜杠后跟星号 (`/*`) 开头，以星号后跟斜杠 (`*/`) 结束。编译器忽略注释，并且这种类型的注释对程序没有影响。\n\n`#include<stdio.h>`\
    \ 语句是一个必须出现在每个 C 程序中的陈词滥调语句，但它不是强制性的。程序可以在没有此语句的情况下执行，但被认为是一种良好的编程实践来附加此语句。\n\n\
    `main()` 函数：主函数是每个 C 程序都必须的原初函数。整个 C 程序都写在这个主函数内。稍后本书将讨论更多关于函数的内容。\n\n一对括号始终跟在\
    \ `main` 关键字之后。大括号打开和关闭程序的代码。在打开和关闭大括号之间是整个复合语句。一旦应用了闭合大括号，它就表示 C 程序的结束。\n\n输出函数：C\
    \ 中使用的格式化输出函数是 `printf()`。此函数的目的在于显示用户所需输出。为此，所需字符写在引号内。\n\n例如，`printf(\"Welcome\
    \ in Dr. Dharm’s World \\n\");` 上述函数插入 C 程序中时，会显示引号内的消息。引号内的消息按原样显示，并且不会对程序产生任何影响。`\\\
    n` 使光标跳到下一行。`printf` 语句的另一个功能是它可以用来要求用户输入程序将用于计算的数据。\n\n假设需要相加两个数字，并且两个值需要通过键盘从用户请求。然后对两个值的请求以以下方式进行：\n\
    \n例如，`printf(\"enter the value for x:\");`\n\n`printf(\"enter the value for y:\"\
    );`\n\n输入的值随后以稍后在会话中讨论的方式被计算机接受。\n\n语句终止符：分号促进了 C 编程中语句的终止。这向计算机表明语句已结束，此后的任何内容都不应被考虑。每个复合语句的末尾必须有分号。\n\
    \n## 1.8. C 中的字符集\n\nC 中的字符集具有众多创新和革命性的解决方案。字符表示用于表示信息的任何字母、数字或特殊符号。你都熟悉字母（A 到\
