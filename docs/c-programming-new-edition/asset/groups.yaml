  mdcn: "\n事情会变得相当繁琐，尤其是当你意识到除了这些细节之外，你还想存储诸如他的地址、电话号码、驾照号码等信息时。\n\n即使使用数组，这些事也会变得繁琐，因为需要声明那么多数组，除此之外还得声明一大堆\
