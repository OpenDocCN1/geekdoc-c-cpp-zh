    \n通过在一个结构体中声明这三个变量，只需使用结构体的下标，就可以任意次地访问这些变量。指针、数组以及其他结构体也可以作为元素引入到已定义的结构体中。结构体内部的各个元素，也就是在结构体中声明的\
    \ int、char 等，被称为该结构体的成员。一旦声明了结构体，就可以在程序内对其进行访问和处理。\n\n除此之外，结构体也将触角伸向了 C 语言的其他方面，与函数、数组和指针紧密关联。本节的后续部分将详细展开更多细节，一旦你全面了解了这些概念，你就会欣赏结构体的妙处。\n\
    \n## 8.3. 声明和访问结构体\n\n在了解了结构体的优点和定义之后，现在你将学习如何声明一个结构体。如前所述，结构体是一种数据类型，与其他数据类型一样，它也是一个关键字，写作“struct”。它必须被赋予一个名称，称为“标签（tag）”或简称结构体名称，在其下方列出不同的成员。\n\
    \n这些成员不过是指明了数据类型的变量。一般格式如下：\n\n```c\nstruct tag\n{\n    datatype variable name;\n\
    \    datatype variable name;\n};\n```\n\n下面给出一个示例：\n\n```c\nstruct employee\n\
    {\n    int eno;\n    char ename;\n    float esal;\n};\n```\n\n从上面的例子可以看到，关键字 struct\
