    to left direction. These shortcomings can be overcome by using the doubly linked
    list. This is just a slight modification of the singly linked list. The mode of
    the doubly linked list has an extra link area on its left side. Thus, it would
    look like this. Link info Link You have already been apprised that the right link
    area contains the address of the next element. In a similar way the left link
    area contains the address of the predecessor node.


    A list containing this type of node is called a doubly linked list or a two way
    chain. Null A &B Null A &B Null A &B Null A &B Thus the left link of the left
    most node and right link of the right most node will contain a null. In a way
    similar to the singly linked list even the doubly linked list has a head pointer
