    # 9.9.1. Order


    All through this session you have been mastering the tricks of inserting and deleting
    elements in various types of data structures. Newer methods were applied and various
    practices were examined. In all this frenzied rush of piling long lists of numbers
    the sorting of numbers was ignored. Only when the elements are sorted and arranged
    can they be presented.


    You will now deal with the various methods of sorting the arranged elements. You
    will be surprised to find that ‘C’ supports so many methods and it can execute
    them eloquently and effectively. The sorting method that will be dealt with in
    this session give a representative sample of the most popular techniques used.


    Sorting methods taken up here, vary in their degree of intensity. Where a couple
    of methods are trivial on the other hand complex yet efficient sorting techniques
    have also gained entry into the session. Before getting acquainted with the various
    sorting operations, let us be clear what sorting exactly is. Sorting is a process
    of arranging the records of a table or the elements of a list in some sequential
    order according to a particular criterion.'
