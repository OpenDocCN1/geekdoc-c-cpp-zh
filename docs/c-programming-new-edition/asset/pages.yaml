  md: "# 9.11. SEARCHING TECHNIQUES\n\nThe techniques used by you till now were helpful\
    \ in arranging elements in different ways and means. Now that the list is sorted\
    \ and arranged it is retrieval time. The searching techniques that you will now\
    \ experience allows you to dig out an element of your choice from the list. The\
    \ element of your choice is compared with the elements of the list and if a perfect\
    \ match is found then the element is retrieved and a message is displayed.\n\n\
    The searching process can be done in different ways but the most popular will\
    \ be taken up and dissected. C allows two major and uncomplicated means of searching\
    \ elements.\n\n+   1. **Linear Search Method:** The linear method is a fairly\
    \ straightforward method of retrieving elements. This is often considered the\
    \ simplest technique for searching an unordered list of elements.\n+   \n+   In\
    \ the following version the list is scanned element by element for the element\
    \ to be retrieved. When an appropriate match is found a message is displayed.\n\
    \n+   2. **Binary Search Method:** This is another relatively simple method of\
    \ accessing a list of elements. An important point to be kept in mind that the\
    \ binary search is possible only if the list of elements is ordered and in an\
    \ ascending manner. This can be achieved by applying any of the sorting technique\
    \ available in the early part of the session.\n\nOnce the list is aligned the\
    \ binary search operation can proceed. this method the list is assigned a lower\
    \ bound and an upper bound to the 1st and the last element. After this is done\
    \ the midpoint of the list is found by finding the average of the lb and the ub.\
    \ For example, if the list contains 7 elements then the midpoint will be 4 Midpoint=lb+ub/2.\
    \ Consider the list of elements below and say the element to be retrieved is 91.\
    \ 40, 55, 61, 71, 81, 91, 100. Once the midpoint is found the element to be searched\
    \ is compared with the element present in the position of the midpoint.\n\nIn\
    \ this case the element present at the midpoint is 71. The element 71 is compared\
    \ with the sought after element which is 91 but since the elements differ in configuration\
    \ the element is checked if it is greater than or less than the midpoint.\n\n\
    If the element is less than the midpoint the rest of the searching takes place\
    \ with the elements on the left side of the midpoint since all those elements"
