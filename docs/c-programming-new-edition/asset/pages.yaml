- pgno: 6
  md: '**Dr. Neeraj Kumar Rathore** is an accomplished professional holding the position
    of Associate Professor and serving as the Head of the Department of Computer Science
    at Indira Gandhi National Tribal University (IGNTU-A Central University), located
    in Amarkantak, Madhya Pradesh, India. He assumed his role as an Associate Professor
    in March 2021 and subsequently took on the responsibility of Department Head in
    May 2022. Prior to joining IGNTU, Dr. Neeraj accumulated extensive teaching experience
    of more than thirteen years at prestigious institutions such as Sri G.S. Institute
    of Technology & Science in Indore, Madhya Pradesh, Jaypee University of Engineering
    & Technology in Guna, Madhya Pradesh, and Modi Institute of Technology in Rajasthan.
    Additionally, he gained valuable insights from the IT Industry, having worked
    as a Software Engineer at Computer Sciences Corporation (CSC). Dr. Neeraj holds
    a Ph.D. in Computer Science, specializing in Grid Computing, which he earned in
    2014 from Thapar University, Punjab. He also holds an M.E. in Computer Engineering,
    obtained in 2008 from the same university, and a B.E. in Computer Science and
    Engineering, which he achieved in 2006 from Rajasthan University, Rajasthan. His
    areas of expertise and research interests encompass Parallel and Distributed Computing,
    Grid Computing, Cloud Computing, Big Data, IoT, DBMS, and Data Structures. Dr.
    Neeraj has contributed significantly to the field, with a remarkable portfolio
    of 72 publications, including 16 SCI Papers, 7 Patents, and 7 Books in prestigious
    International/SCI Journals and Conferences. As an esteemed academician, Dr. Neeraj
    has successfully supervised seven Master’s theses and two Ph.D., with several
    ongoing research projects under his guidance. His dedication to research and education
    has earned him a commendable reputation in the academic community.


    **Dr. Urmila S Soni**, working as a Professor in the faculty of Engineering &
    technology, at the SAM Global University, Bhopal, MP, India. She is having more
    than 18 years of teaching experience in various institutions and currently handling
    the position of Director-IQAC in the same organization. She is having more than
    10 years of research experience. She completed B.E. from Electronics & Telecommunication
    Engineering from North Maharashtra University Jalgaon, & M.Tech specialization
    in Instrumentation & Control from Chhattisgarh Swami Vivekananda Technical University,(CSVTU)
    Bhilai , Chhattisgarh. She also awarded PhD in Electronics & Telecommunication
    Engineering from the CSVTU, Bhilai. Her research area focuses on Smart Grid, Micro
    Grid, Renewable Energy, Wireless Communication & Internet of Things. She has published
    more than 25 research papers in various journals of repute and conferences and
    having 6 design patents. She is having rich experience in accreditation and giving
    her services, guidance and support to various universities for NBA & NAAC preparation
    as an expert.'
