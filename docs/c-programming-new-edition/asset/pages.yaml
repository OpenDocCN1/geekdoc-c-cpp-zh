    ```

    /* Finding out the simple interest */

    main()

    {

    variable declaration (p, n, r)

    accept values for p, n, r from the user

    calculate a value for si

    display the computed value of si

    }

    ```


    The above script is a rough outlay of what has to be done about the given problem.
    But a program cannot be formulated on this basis and thus a detailed representation
    of the above statements is essential. A detailed pseudo code can be scripted as
    shown in the next page:


    ```

    /*finding out the simple interest*/

    void main()

    {

    /* declare p, n, r, sum, si as floating-point variables*/

    /* request a value for p and read its value*/

    /*request a value for n and read its value*/

    /* request a value for r and read its value*/

    /* calculate sum= p*n*r */

    /* calculate si= sum/100 */ /* display the value in si */

    }

    ```


    The a before mentioned pseudo code is a detailed description of what are the different
    steps involved in finding the simple interest. The above is a logic and can be
    implemented in various languages according to their syntax.


