    An insertion operation can be performed on the middle of the list in between two
    nodes. For example if a new node has to be inserted in between the 2nd and 3rd
    nodes in a list then as a first step the head pointer is traversed till the 2nd
    node. The address of the new node to the inserted is assigned to the link area
    of the 2nd node and the link area of the new node is assigned the address of the
    3rd node. Thus, a link is broken between the 2nd and 3rd node and new node is
    inserted.


    ![](img/c948b22e3869eae71cd653f0917e0009_152_0.png)


    A 2008 B 2016 C 2014 In X 2012 2016


    For a node to be inserted at the end of the list the head pointer is traversed
    till the last node and the link area which contains null is reassigned to hold
    the address of the new node and the new node is assigned the null character in
