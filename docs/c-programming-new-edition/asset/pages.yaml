    # 5.2. ADVANTAGES OF FUNCTIONS


    What you have skimmed through above, is just a general idea of the functions and
    the kind of operations they perform. Listed below are a few of the merits the
    functions offer to the programmer and more often than not the programmers comply
    with the functions and find that the pains of programming if any, are alleviated.
    A programmer can exploit the below mentioned advantages to the fullest and reap
    the rich rewards of implementing functions.


    A programmer can identify whatever actions are performed repeatedly in various
    parts of the program, write them as a function and call the function from various
    parts of the program, wherever needed. This approach avoids code duplication.
    Instead of duplicating the same code in different parts of the program, you just
    write the function once and call it from different parts of the program, thus
    reducing the executable file size and redundancy of code, making the maintenance
    of code easy.


    In multitasking systems like Unix, there is a direct relationship between the
    amount of memory a program consumes and the speed with which it runs. You will,
    in general find that large programs which demand a lot of memory, are sluggish.


    Breaking down your program into subroutines lends your program a structure. You
    can divide you task into multiple sub-tasks, develop a function for each sub-task,
    and integrate them into a single program. Once a function is written and completely
    tested, a programmer can expect it to smoothly fit in with the rest of the program
    modules.


    Once a function is written, tested, and found to be working as per the expectations,
    the function can be loaded into a library, and can be used in an altogether different
    application. This approach encourages code reusability.


