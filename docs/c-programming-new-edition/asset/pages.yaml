  md: '```c

    int *p(int 1);

    ```


    Indicates a function that accepts an integer argument, and returns a pointer to
    an integer. On the other hand, the declaration:


    ```c

    int (*p) (int a);

    ```


    Indicates a pointer to a function that accepts an integer argument and returns
    an integer. In this last declaration, the first pair of parentheses is used for
    nesting, and the second pair is used to indicate a function. The interpretation
    of more complex declaration can be increasingly troublesome.


    For example, consider the declaration.


    ```c

    int* (*p) (int (*a)[]);

    ```


    In this declaration, (*p) (....) indicates a pointer to a function. Hence, int
    *(*p) (....) indicates a pointer to a function that returns a pointer to an integer.
    Within the last pair of parentheses (the function’s argument specification), (*a)
    [] indicates a pointer to an array. Therefore, int (*a) [] represents a pointer
    to an array of integers.


    Putting the pieces together, (*p) (int (*a) []) represents a pointer to a function
    whose argument is a pointer to an array of integers. And finally, the entire declaration.


    ```c

    int *(*p) (int (*a) []);

    ```


    Represents a pointer to a function that accepts a pointer to an array of integers
    as an argument, and returns a pointer to an integer. Remember that a left parentheses
    immediately following an identifier name indicates that the identifier represents
    a function. Similarly, a left square bracket immediately following an identifier
    name indicates that the identifier represents an array. Parentheses that identify
    functions and square brackets that identify arrays have a higher precedence than
    the unary indirection operator, Therefore, additional parentheses are required
    when declaring a pointer to a function or a pointer to an array.


