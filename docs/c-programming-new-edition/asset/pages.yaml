- pgno: 20
  md: "+   ii. Flowcharts are no longer completely standardized tools. The newer structured\
    \ programming techniques have necessitated changes in the traditional format of\
    \ a flowchart.\n+   \n+   iii. It is sometimes difficult for a businessperson\
    \ or user to understand the logic depicted in a flowchart.\n\nTo compensate for\
    \ some of the shortcomings of program flowcharting, a new tool has been introduced\
    \ that is specifically designed to depict the logic flow of a structured program.\
    \ This tool is called pseudocode.\n\nAs indicated, pseudocode has been designed\
    \ specifically as method for facilitating the representation of logic in a structured\
    \ program. No symbols are used, just words as with flowcharts, the pseudocode\
    \ need not indicate all the processing details; abbreviations are permissible.\n\
    \nUsing a flow-chart, it is possible, although somewhat cumbersome, to indicate\
    \ a logical control sequence that is executed until a given condition exists.\
    \ The following symbol is used to perform a routine until a condition met.\n\n\
    ![](img/c948b22e3869eae71cd653f0917e0009_20_0.png)\n\nHowever, such a sequence\
    \ is more easily specified using pseudocode.\n\nThe term “pseudocode” indicates\
    \ that the technique is a code, similar to that used in a program. The term “pseudo”\
    \ implies that, although this is a code similar to that used in a program, it\
    \ is merely a representation of a code and not a language itself.\n\n**4. Program\
    \ Development Process:** There are numerous ways to complete the tasks in any\
    \ process. Some methods are more efficient and effective than others. For example,\
    \ if you want to dig a swimming pool in your backyard, you could get out your\
    \ spade and start digging, or you could use heavy, mechanical equipment designed\
    \ for the task. Both methods would get the job done, but the second method is\
    \ more efficient and effective. The same principle applies to programming.\n\n\
    The program development process is a recommended series of steps to"
  merge: -1
  img_proc: true
- pgno: 21
  md: 'follow when developing a program. It consists of the following six steps:


    +   - Define the problem;

    +   - Design the algorithm;

    +   - Code the program;

    +   - Test and debug the program;

    +   - Implement the program and train users; and

    +   - Maintain and upgrade the program.


    This list does not include documentation as a separate step; however, documentation
    is an important requirement throughout all the steps, each of which will be examined
    below. Although each step is presented as a separate and distinct process, they
    are all related; in actual practice, there may not be a clear separation between
    the steps. Let’s address the topic common to all the steps of the program development
    process documentation.


    # 5. The Importance of Documentation:


    **i. Documentation** is the text or graphics that provides specific instructions
    about, or records the purpose or function of, a particular step or instruction
    in a program. Each step throughout the programming process should be documented.
    Documentation is sometimes done as an after thought rather than as an ongoing
    integral part of the project. Approached in this manner, it can become an overwhelming
    burden of paperwork. If documentation guidelines are established and followed
    from the beginning of a project, the process will take less time and effort in
    the long run.


    There are two good reasons to document the program development process. First,
    documentation leaves a clear record for someone else to understand what was done.
    This record is extremely important in a business environment because it is likely
    that the person who later corrects an error or modifies the program will not be
    the same person who originally designed or coded it.


    Second, documenting the steps as they are developed forces a reexamination of
    the actions taken problems might be discovered early enough to avoid costly alterations
    later. Documentation is important even if you are programming just for your own
    use.


    For documentation to be of value, it must be clear and concise, and it must be
    available to those who need it. Many organizations maintain a library where copies
    of all documentation are accessible to authorized personnel.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Several types of documentation are kept during the course of the program development
    process. Here are a few:


    +   - Program specifications;

    +   - Program description;

    +   - Program design charts (flowcharts, pseudocode, etc.);

    +   - Description of testing done and errors found;

    +   - An operator’s manual (user’s guide);

    +   - Maintenance documentation.


    Program specifications describe what the program is intended to accomplish: they
    help the programmer design the program. The program description details what the
    completed program actually does. Program design charts outline the specific steps
    used in the program to produce the desired results. The types of testing done,
    the data used, as well as the errors found are typically recorded in separate
    documentation. Details on how to operate a program are presented in an operator’s
    manual. Maintenance documentation is record of the changes made to the program
    and a detailed explanation of those changes.


    The type of documentations kept depends on each programming department’s various
    requirements.


    Keeping in mind that each step of the program development process should be properly
    documented, let’s take a look at each of the size steps.'
  merge: -1
  img_proc: true
