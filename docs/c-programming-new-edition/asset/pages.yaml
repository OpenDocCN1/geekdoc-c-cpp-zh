    +   - **Preprocessor Directives:** These lines begin with # and are used to include
    libraries and perform other pre-processing tasks.

    +   - **main():** This is the main function where program execution begins.

    +   - **Declarations:** This is where you declare variables and functions that
    will be used in your program.

    +   - **Statements:** These are the executable statements that perform the actual
    work of your program.

    +   - **return 0;:** This line is used to exit the program with a status code
    of 0, indicating successful execution.


