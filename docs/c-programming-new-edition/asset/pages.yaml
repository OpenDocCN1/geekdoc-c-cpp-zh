    has an extra pointer which dons the role of the head pointer and it is used for
    traversing the list from right to left. The left head pointer points at the first
    element of the list and right the last element.


    Thus pictorially it can be represented as follows: A B C L The insertion and deletion
    operations can be performed on a doubly linked list with much more efficacy and
