  md: "# Move that turtle!\n\nNow you're ready to write the function that gets your\
    \ turtle moving. The last bit of the code will be a `while` loop that sets the\
    \ turtle off drawing mutant rainbows!\n\n# 10 Mutant line\n\nAdd this code below\
    \ the code you typed in Step 9, and above the code you typed in Step 5. This function\
    \ makes the turtle turn and move forwards in a new direction, drawing a single\
    \ line of random colour as it goes. Your main program will use it over and over\
    \ again to draw mutant rainbows. If the turtle strays beyond the limits you set\
    \ in Step 9, this function will bring it back.\n\nMove along now, please!\n\n\
    ![](img/1bd24ab186f69fb18194b4174ca15178_103_0.png)\n\n# How it works\n\nThe code\
    \ calls the `inside_window()` function to see if the turtle is within the window\
    \ limits. If it is, the turtle turns right by a random amount between 0 degrees\
    \ (doesn't turn at all) and 180 degrees (faces the opposite direction), then moves\
    \ off again. If it has gone too far from the limit, it moves backwards.\n\nThe\
    \ different colours the pen can use are stored in a list.\n\nUse a backslash character\
    \ if you need to split a long line of code over two lines.\n\n```\n```python\n\
    return inside\n\ndef move_turtle(line_length):\n    pen_colors = ['red', 'orange',\
    \ 'yellow', 'green',\n                  'blue', 'purple']\n    t.pencolor(random.choice(pen_colors))\n\
    \    if inside_window():\n        angle = random.randint(0, 180)\n        t.right(angle)\n\
    \        t.forward(line_length)\n    else:\n        t.backward(line_length)\n\n\
    \    line_length *= get_line_length()\n```\n```\n\nThe pen chooses a colour at\
    \ random.\n\nThis chooses a random angle between 0 and 180 degrees.\n\nThe turtle\
    \ moves forwards in `line_length` steps.\n\nThis checks if the turtle is inside\
    \ the set limits.\n\nThe turtle turns right by the random angle.\n\nIf the turtle\
