- pgno: 168
  md: '# How it works


    This project uses Tkinter to create the shapes. Tkinter''s mainloop() function
    schedules a function that you''ll create to show the next shape. The random module''s
    shuffle() function makes sure the shapes always appear in a different order. The
    "q" and "p" keys are bound (linked) to a snap() function, so that each time one
    of these keys is pressed, it updates the relevant player''s score.


    ▷ Snap flowchart


    The program runs for as long as there are still shapes left to be revealed. It
    reacts to the key presses of the players when they think they see a snap. When
    there are no more shapes left, the winner is declared and the game ends.


    # EXPERT TIPS


    Sleep


    Computers work a lot faster than you can. Sometimes this causes problems. If you
    tell a computer to show a shape to the user and then hide it again, without a
    break, the computer does it so quickly that the person won''t see the shape. To
    fix this, Snap uses the time module''s sleep() function, which pauses the program
    for a set number of seconds: time.sleep(1), for example, puts the program to sleep
    for 1 second before it runs the next line of code.


    ![](img/1bd24ab186f69fb18194b4174ca15178_168_0.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Getting started


    First you need to import the relevant modules and create a graphical user interface
    (GUI). Then you need to create a canvas to draw the shapes on.


    ![](img/1bd24ab186f69fb18194b4174ca15178_169_0.png)


    +   1. **Create a new file**

    +      Open IDLE. Create a new file and save it as “snap.py”.


    +   2. **Add modules**

    +      First import the random and time modules, and parts of Tkinter. Time lets
    you create a delay so that the player is able to read a “SNAP!” or “WRONG!” message
    before the next shape is shown. HIDDEN lets you hide each shape until you want
    to show it with NORMAL – otherwise all the shapes will appear on the screen at
    the start of the game.


    You’ll shuffle the shapes using the random module.


    ```

    ```python

    import random

    import time

    from tkinter import Tk, Canvas, HIDDEN, NORMAL

    ```

    ```


    Use Tkinter to create the GUI.


    +   3. **Set up the GUI**

    +      Now type the code shown here to create a Tkinter window (also called a
    root widget) with the title ‘Snap’. Run the code to check it. The window may be
    hidden behind the other windows on the desktop.


    ```

    ```python

    from tkinter import Tk, Canvas, HIDDEN, NORMAL


    root = Tk()

    root.title(''Snap'')

    ```

    ```


    +   4. **Create the canvas**

    +      Type this line to create the canvas – the blank space on which the shapes
    will appear.


    ```

    ```python

    root.title(''Snap'')

    c = Canvas(root, width=400, height=400)

    ```

    ```


    # Making the shapes


    The next stage is to create the coloured shapes using functions from Tkinter’s
    Canvas widget. You’ll draw circles, squares, and rectangles, each in four different
    colours.


    ![](img/1bd24ab186f69fb18194b4174ca15178_169_1.png)


    +   5. **Make a store for the shapes**

    +      You need to make a list so that you can store all the shapes somewhere.
    Add this line at the bottom of your file.


    ```

    ```python

    c = Canvas(root, width=400, height=400)

    shapes = []

    ```

    ```'
