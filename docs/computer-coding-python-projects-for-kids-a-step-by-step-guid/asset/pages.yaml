- pgno: 113
  md: "# ### 8 Open the text file\n\nThis next bit of code will open the file called\
    \ events.txt so the program can read it. Type in this line underneath your code\
    \ from Step 7.\n\n```\n~~~python\ndef get_events():\n    list_events = []\n  \
    \  with open('events.txt') as file:\n~~~\n```\n\nThis line opens the text file.\n\
    \n# ### 9 Start a loop\n\nNow add a for loop to bring information from the text\
    \ file into your program. The loop will be run for every line in the events.txt\
    \ file.\n\n```\n~~~python\ndef get_events():\n    list_events = []\n    with open('events.txt')\
    \ as file:\n        for line in file:\n~~~\n```\n\nRun the loop for each line\
    \ in the text file.\n\n# ### 10 Remove the invisible character\n\nWhen you typed\
    \ information into the text file in Step 1, you pressed the enter/return key at\
    \ the end of each line. This added an invisible “newline” character at the end\
    \ of every line. Although you can’t see this character, Python can. Add this line\
    \ of code, which tells Python to ignore these invisible characters when it reads\
    \ the text file.\n\n```\n~~~python\nwith open('events.txt') as file:\n    for\
    \ line in file:\n        line = line.rstrip('\\n')\n~~~\n```\n\nRemove the newline\
    \ character from each line.\n\nThe newline character is represented as ('\\n')\
    \ in Python.\n\n# ### 11 Store the event details\n\nAt this point, the variable\
    \ called line holds the information about each event as a string, such as Halloween,31/10/2017.\
    \ Use the split() command to chop this string into two parts. The parts before\
    \ and after the comma will become separate items that you can store in a list\
    \ called current_event. Add this line after your code in Step 10.\n\n```\n~~~python\n\
    for line in file:\n    line = line.rstrip('\\n')\n    current_event = line.split(',')\n\
    ~~~\n```\n\nSplit each event into two parts at the comma.\n\n# ## EXPERT TIPS\n\
    \n# ## Datetime module\n\nPython’s **datetime** module is very useful if you want\
    \ to do calculations involving dates and time. For example, do you know what day\
    \ of the week you were born on? Try typing this into the Python shell to find\
    \ out.\n\nType your birthday in this format: year, month, day.\n\n```\n~~~python\n\
    >>> from datetime import *\n>>> print(date(2007, 12, 4).weekday())\n1\n~~~\n```\n\
    \nThis number represents the day of the week, where Monday is 0 and Sunday is\
    \ 6. So 4 December 2007 was a Tuesday."
