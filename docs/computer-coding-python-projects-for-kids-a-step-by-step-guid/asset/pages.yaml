  md: '# ### max()


    The max() function selects the maximum value from the parameters you give it.
    Hit the enter/return key to see the value on the screen. This function takes multiple
    parameters, which must be separated by commas.


    ```

    ```

    >>> max(10, 16, 30, 21, 25, 28)

    30

    ```

    ```


    The maximum value is the highest number in the brackets.


    Always separate multiple parameters with commas.


    # ### min()


    The min() function does the opposite of max(). It selects the minimum value from
    the parameters you put inside its brackets. Experiment for yourself with the max()
    and min() functions.


    ```

    ```

    >>> min(10, 16, 30, 21, 25, 28)

    10

    ```

    ```


    When you hit the enter/return key, the code shows you the lowest number.


    # ## Another way of calling


    Some of the different types of data we''ve come across so far, such as integers,
    strings, and lists, have their own functions. These functions must be called in
    a special way. You type the data or the name of the variable holding the data,
    followed by a dot, the function''s name, and finally brackets. Test out these
    code snippets in the shell.


    Don''t forget the dot.


    Empty brackets mean that no parameters are needed.


    ```

    ```

    >>> ''bang''.upper()

    ''BANG''

    ```

    ```


    This is the new string, all in capitals.


    ![](img/1bd24ab186f69fb18194b4174ca15178_44_0.png)


    The function has two parameters.


    ```

    ```

    >>> message = ''Python makes me happy''

    >>> message.replace(''happy'', '':D'')

    ''Python makes me :D''

    ```

    ```


    The new string replaces happy with :D.


    # ### upper()


    The upper() function takes an existing string and returns a new string in which
    all the lower-case characters are changed to upper-case (capitals).


    ```

    ```

    >>> countdown = [1, 2, 3]

    >>> countdown.reverse()

    >>> print(countdown)

    [3, 2, 1]

    ```

    ```


    The list of numbers stored in the variable


    The list is now reversed.


    # ### reverse()


    Use this function when you want to reverse the order of the items in a list. Here
    it''s used to reverse a list of numbers stored in the variable countdown. Instead
    of printing the list as [1, 2, 3], the function makes it print [3, 2, 1].


    # ### replace()


    Two parameters are needed for this function: the first is the part of a string
    you want to replace, while the second is the string you want to put in its place.
    The function returns a new string with the replacements made.'
