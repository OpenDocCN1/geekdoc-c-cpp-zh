  md: "# 10 Shuffle the shapes\n\nTo ensure that the shapes don't appear in the same\
    \ order each time, you need to shuffle them - just like you would do with a pack\
    \ of cards. The shuffle() function in random can do this for you. Insert this\
    \ line after c.pack().\n\n```\n```python\nrandom.shuffle(shapes)\n```\n```\n\n\
    # Getting ready\n\nIn the next part of the build, you'll set up several variables\
    \ and write a few bits of code that get the game ready for playing. However, it\
    \ won't work until we add the functions in the last stage.\n\n> **EXPERT TIPS**\n\
    > \n> ### Nothing really matters\n> \n> Coders often need to set up variables\
    \ with a starting value of zero, such as the scores in this game. But how do you\
    \ do this if a variable holds a string rather than a number? The answer is to\
    \ use a pair of quote marks with nothing between them. Some variables, however,\
    \ don't have an obvious default value such as 0 or an empty string. In that case,\
    \ you can use the word \"None\", as we do below.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_172_0.png)\n\
    \n# 11 Set up variables\n\nYou'll need variables to keep track of various things\
    \ while the program is running, including the current shape, the previous and\
    \ current colour, and the two players' scores.\n\nNeither player has any points\
    \ at the start, so the value of both is set to 0.\n\n```\n```python\nrandom.shuffle(shapes)\n\
    \nshape = None\nprevious_color = ''\ncurrent_color = ''\nplayer1_score = 0\nplayer2_score\
    \ = 0\n```\n```\n\nThe shape variable has no value yet.\n\nThe color variables\
    \ hold an empty string.\n\n# 12 Add a delay\n\nNow add a line to create a 3-second\
    \ delay before the first shape appears. This gives the player time to find the\
    \ Tkinter window in case it's hidden behind other windows on the desktop. You'll\
    \ create the next_shape() function later, in Steps 16 and 17.\n\n```\n```python\n\
    player2_score = 0\n\nroot.after(3000, next_shape)\n```\n```\n\nThe program waits\
    \ for 3,000 milliseconds, or 3 seconds before showing the next shape."
