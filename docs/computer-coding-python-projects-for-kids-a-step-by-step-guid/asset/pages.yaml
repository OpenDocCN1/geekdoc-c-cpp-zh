  md: "# ## Block a multiple snap\n\nNext add the following line to the snap() function\
    \ to set the value of previous_color to the empty string ('') after a correct\
    \ snap. Now if a player presses their key again before the next shape is shown,\
    \ they will lose a point. This is because '' will never be equal to the current\
    \ colour, except before the first shape is shown.\n\n> There's nothing I don't\
    \ know about multiple snaps!\n\n```\n```python\nshape = c.create_text(200, 200,\
    \ text='SNAP! You scored 1 point!')\nprevious_color = ''\n```\n```\n\n# ## Prevent\
    \ early snaps\n\nSince previous_color and current_color are equal at the beginning\
    \ of the game, players can still cheat by pressing their key before the first\
    \ shape appears. To solve this, set the two variables to different strings at\
    \ the start. Change their values to 'a' and 'b'.\n\n```\n```python\nprevious_color\
    \ = 'a'\ncurrent_color = 'b'\n```\n```\n\n> Starting with different strings means\
    \ that a snap can't be made until the shapes appear on the screen.\n\n# ## Change\
    \ the messages\n\nIf both players press their keys at almost the same time, it\
    \ might be confusing as to who has scored or lost a point. To fix this, you can\
    \ change the messages that are displayed when players attempt a snap.\n\n> Don't\
