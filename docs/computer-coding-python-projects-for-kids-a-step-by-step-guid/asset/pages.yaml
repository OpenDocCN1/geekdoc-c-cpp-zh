  md: '# LINGO


    # # Integers and floats


    In coding, whole numbers are called integers, while numbers with a decimal point
    in them are known as floats. Programs usually count things using integers. Floats
    are more often used for measurements.


    ![](img/1bd24ab186f69fb18194b4174ca15178_24_0.png)


    # ## Using numbers


    Variables can be used to store numbers and do sums. You can use them with symbols
    to do calculations, just like you do in maths. Some of these symbols will be familiar,
    but watch out for the symbols meaning "multiply" and "divide" – they''re slightly
    different from the ones you use in class.


    | Symbol | Meaning |

    | --- | --- |

    | + | add |

    | - | subtract |

    | * | multiply |

    | / | divide |


    Some of the Python maths symbols


    +   1. **A simple calculation**

    +      Type this code in a shell window. It uses numbers stored in two variables,
    named x and y, to carry out a simple multiplication. Hit the enter/return key
    to get the answer.


    ```

    >>> x = 6

    >>> y = x + 7

    >>> print(y)

    42

    ```


    Create a new variable, x, and give it the value 6.


    Multiply x by 7 and store the result in y.


    Print the value of y.


    The result of the calculation


