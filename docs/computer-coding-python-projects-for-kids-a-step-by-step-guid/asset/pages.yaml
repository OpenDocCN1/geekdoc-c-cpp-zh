  md: '# Password Picker


    Passwords stop other people from accessing our computers, personal emails, and
    website login details. In this project, you’ll build a tool that makes secure,
    memorable passwords to help keep your private information safe.


    # Password tips


    A good password is easy to remember but hard for a person or a password cracker
    to guess.


    A name is easy to remember, but it wouldn’t be difficult to guess.


    This password looks complicated, but it could take a cracker less than 2 seconds
    to guess.


    This password could take a hacker over 1,000 years to crack, but it’s hardly memorable.


    This is secure but easy to remember. Just think of two tired dinosaurs going to
    bed! It could take a cracker over a million years to guess this password correctly.


    ![](img/1bd24ab186f69fb18194b4174ca15178_51_0.png)


    Alice


    Fym5


    GH7pqZ2!?


    Sleepydinosaur?


    ![](img/1bd24ab186f69fb18194b4174ca15178_51_1.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_51_2.png)


    # What happens


    Password Picker will enable you to create strong passwords by combining words,
    numbers, and characters. When you run the program, it will create a new password
    and show it on the screen. You can ask it to keep creating new passwords until
    you find one you like.


    # Password cracker


    A cracker is a program used by hackers to guess passwords. Some crackers can make
    millions of guesses every second. A cracker usually starts by guessing commonly
    used words and names. An unusual password made up of several different parts will
    help protect against crackers.'
