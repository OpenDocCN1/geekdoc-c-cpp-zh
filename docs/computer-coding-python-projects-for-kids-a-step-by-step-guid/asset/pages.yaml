- pgno: 160
  md: "# # Main loop\n\nYour turtles are now set up and ready to go. Let's write the\
    \ code that makes the game come to life.\n\n# ## 6 Placeholder functions\n\nYou\
    \ can put off defining a function until later by using the pass keyword. Under\
    \ the code for the turtles, add the following placeholder functions for functions\
    \ that you'll fill with code in later steps.\n\n```\ndef outside_window():\n \
    \   pass\n\ndef game_over():\n    pass\n\ndef display_score(current_score):\n\
    \    pass\n\ndef place_leaf():\n    pass\n```\n\nTo get a basic version of the\
    \ program running sooner, you can use placeholders for functions that you'll finish\
    \ coding later.\n\n# ### EXPERT TIPS\n\n# ### Pass\n\nIn Python, if you're not\
    \ yet sure what code you want inside a function, you can just type in the pass\
    \ keyword and then come back to it later. It's a bit like passing on a question\
    \ in a quiz.\n\n# ## 7 Game starter\n\nAfter the four placeholder functions comes\
    \ the start_game() function, which sets up some variables and prepares the screen\
    \ before the main animation loop begins. You'll add the code for the main loop,\
    \ which forms the rest of this function, in the next step.\n\nThe turtle stretches\
    \ into a caterpillar shape.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_160_0.png)\n\
    \n```\ndef start_game():\n    global game_started\n    if game_started:\n    \
    \    return\n    game_started = True\n\n    score = 0\n    text_turtle.clear()\n\
    \n    caterpillar_speed = 2\n    caterpillar_length = 3\n    caterpillar.shapesize(1,\
    \ caterpillar_length, 1)\n    caterpillar.showturtle()\n    display_score(score)\n\
    \    place_leaf()\n```\n\nIf the game has already started, the return command\
    \ makes the function quit so it doesn't run a second time.\n\nClear the text from\
    \ the screen.\n\nThis line places the first leaf on the screen."
  merge: -1
  img_proc: true
- pgno: 161
  md: "# 8 Get moving\n\nThe main loop moves the caterpillar forwards slightly, before\
    \ performing two checks. It first checks if the caterpillar has reached the leaf.\
    \ If the leaf has been eaten, the score increases, a new leaf gets drawn, and\
    \ the caterpillar gets longer and faster. The loop then checks if the caterpillar\
    \ has left the window - if so, the game's over. Add the main loop below the code\
    \ you typed in Step 7.\n\n> > The very hungry what? No, I've never heard of him!\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_161_0.png)\n\n```\n~~~python\nplace_leaf()\n\
    \nwhile True:\n    caterpillar.forward(caterpillar_speed)\n    if caterpillar.distance(leaf)\
    \ < 20:\n        place_leaf()\n        caterpillar_length = caterpillar_length\
    \ + 1\n        caterpillar.shapeSize(1, caterpillar_length, 1)\n        caterpillar_speed\
    \ = caterpillar_speed + 1\n        score = score + 10\n        display_score(score)\n\
    \    if outside_window():\n        game_over()\n        break\n~~~\n```\n\nThe\
    \ caterpillar eats the leaf when it's less than 20 pixels away.\n\nThe current\
    \ leaf has been eaten, so add a new leaf.\n\nThis will make the caterpillar grow\
    \ longer.\n\n# 9 Bind and listen\n\nNow put these lines below the function you've\
    \ just created. The onkey() function binds the space-bar to start_game(), so you\
    \ can delay the start until the player presses space. The listen() function allows\
    \ the program to receive signals from the keyboard.\n\n```\n~~~python\nt.onkey(start_game,\
    \ 'space')\nt.listen()\nt.mainloop()\n~~~\n```\n\nWhen you press the space-bar,\
    \ the game begins.\n\n# 10 Test your code\n\n> > My caterpillar crawled off the\
    \ screen and into the garden!\n\nRun the program. If your code is correct, you\
    \ should see the caterpillar moving after you press the space-bar. Eventually,\
    \ it should crawl off the screen. If the program doesn't work, check your code\
    \ carefully for bugs.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_161_1.png)"
  merge: -1
