  md: "# Scramble the message!\n\nNow that you’ve got your interface working, it’s\
    \ time to write the code that will encrypt and then decrypt your secret message.\n\
    \n+   **8. Is it even?**\n+   \n+   You need to create a function to tell the\
    \ program whether or not there’s an even number of characters in your message.\
    \ The function will use the modulo operator (%) to check if it can divide the\
    \ number by 2 without leaving a remainder. If it can (True), then the number’s\
    \ even. Add this function under the code you typed in Step 2.\n\n```\n```python\n\
    def is_even(number):\n    return number % 2 == 0\n```\n```\n\nPass the True or\
    \ False value back to the code.\n\nThis will be True if the number is even.\n\n\
    +   **9. Get the even letters**\n+   \n+   In this step, you’ll make a function\
    \ that takes a message and produces a list containing all the even-numbered letters.\
    \ The function uses a for loop with a range that goes from 0 to len(message),\
    \ so that it checks all the letters in the string. Add this function under the\
    \ code in Step 8.\n\n```\n```python\ndef get_even_letters(message):\n    even_letters\
    \ = []\n    for counter in range(0, len(message)):\n        if is_even(counter):\n\
    \            even_letters.append(message[counter])\n    return even_letters\n\
    ```\n```\n\nMake a list variable to store the even letters.\n\nLoop through every\
    \ letter in the message.\n\nIf this is a letter in an even position, Python adds\
    \ it to the end of the list of letters.\n\nPass the list of letters back to the\
    \ code that called this function.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_134_0.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_134_1.png)\n\n![](img/1bd24ab186f69fb18194b4174ca15178_134_2.png)"
