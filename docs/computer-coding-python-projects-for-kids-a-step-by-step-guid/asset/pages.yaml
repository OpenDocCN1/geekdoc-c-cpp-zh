- pgno: 189
  md: '# Egg Catcher


    This game will test your concentration and the speed of your reflexes. Don’t crack
    under pressure – just catch as many eggs as you can to get a high score. Challenge
    your friends to see who is the champion egg catcher!


    # What happens


    Move the catcher along the bottom of the screen to catch each egg before it touches
    the ground. When you scoop up an egg you score points, but if you drop an egg
    you lose a life. Beware: the more eggs you catch, the more frequently new eggs
    appear at the top of the screen and the faster they fall. Lose all three lives
    and the game ends.


    You score 10 points for catching each egg.


    ![](img/1bd24ab186f69fb18194b4174ca15178_189_0.png)


    Move the catcher to and fro by pressing the left and right arrow keys.


    # EXPERT TIPS


    # Timing


    The timing of the action on the screen is important. At first, a new egg is only
    added every 4 seconds, otherwise there would be too many eggs. Initially, the
    eggs move down a little every half second. If the interval was smaller, the game
    would be too hard. The program checks for a catch once every tenth of a second
    – any slower, and it might miss it. As the player scores more points, the speed
    and number of the eggs increases to make the game more challenging.'
