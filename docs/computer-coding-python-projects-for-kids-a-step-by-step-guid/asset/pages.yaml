- pgno: 193
  md: "# 5 Set up the eggs\n\nNow make some variables to store the colours, width,\
    \ and height of the eggs. You’ll also need variables for the score, the speed\
    \ of the falling eggs, and the interval between new eggs appearing on the screen.\
    \ The amount they are changed by is determined by the `difficulty_factor` – a\
    \ lower value for this variable actually makes the game harder.\n\n```\n```python\n\
    c.pack()\n\ncolor_cycle = cycle(['light blue', 'light green', 'light pink', 'light\
    \ yellow', 'light cyan'])\negg_width = 45\negg_height = 55\negg_score = 10\negg_speed\
    \ = 500\negg_interval = 4000\ndifficulty_factor = 0.95\n```\n```\n\nThe `cycle()`\
    \ function allows you to use each colour in turn.\n\nYou score 10 points for catching\
    \ an egg.\n\nA new egg appears every 4,000 milliseconds (4 seconds).\n\nThis is\
    \ how much the speed and interval change after each catch (closer to 1 is easier).\n\
    \n# 6 Set up the catcher\n\nNext add the variables for the catcher. As well as\
    \ variables for its colour and size, there are four variables that store the catcher’s\
    \ starting position. The values for these are calculated using the sizes of the\
    \ canvas and the catcher. Once these have been calculated, they are used to create\
    \ the arc that the game uses for the catcher.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_193_0.png)\n\
    \nDon’t forget to save your work.\n\n```\n```python\ndifficulty_factor = 0.95\n\
    \ncatcher_color = 'blue'\ncatcher_width = 100\ncatcher_height = 100\ncatcher_start_x\
    \ = canvas_width / 2 - catcher_width / 2\ncatcher_start_y = canvas_height - catcher_height\
    \ - 20\ncatcher_start_x2 = catcher_start_x + catcher_width\ncatcher_start_y2 =\
    \ catcher_start_y + catcher_height\n\ncatcher = c.create_arc(catcher_start_x,\
    \ catcher_start_y,\n                       catcher_start_x2, catcher_start_y2,\
    \ start=200, extent=140,\n                       style='arc', outline=catcher_color,\
    \ width=3)\n```\n```\n\nThis is the height of the circle that is used to draw\
    \ the arc.\n\nThese lines make the catcher start near the bottom of the canvas,\
    \ in the centre of the window.\n\nStart drawing at 200 degrees on the circle.\n\
    \nDraw for 140 degrees.\n\nDraw the catcher."
