  md: "# Blinking pet\n\nYour Screen Pet looks cute, but it's not doing anything!\
    \ Let's write some code to get it blinking. You'll need to create two functions:\
    \ one to open and shut the eyes, the other to tell them how long to stay open\
    \ and shut for.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_145_0.png)\n\nTo blink,\
    \ the eyes fill with sky blue and the pupils disappear.\n\n# 1 Open and close\
    \ the eyes\n\nCreate this function, toggle_eyes(), at the top of your file, under\
    \ the first line of code. It makes the eyes look closed by hiding the pupils and\
    \ filling the eyes with the same colour as the body. It also switches the eyes\
    \ between being open and closed.\n\nFirst the code checks the eyes' current colour:\
    \ white is open, blue is closed.\n\nThis line sets the eyes' new_color to the\
    \ opposite value.\n\n```\nfrom tkinter import HIDDEN, NORMAL, Tk, Canvas\n\ndef\
    \ toggle_eyes():\n    current_color = c.itemcget(eye_left, 'fill')\n    new_color\
    \ = c.body_color if current_color == 'white' else 'white'\n    current_state =\
    \ c.itemcget(pupil_left, 'state')\n    new_state = NORMAL if current_state ==\
    \ HIDDEN else HIDDEN\n    c.itemconfigure(pupil_left, state=new_state)\n    c.itemconfigure(pupil_right,\
    \ state=new_state)\n    c.itemconfigure(eye_left, fill=new_color)\n    c.itemconfigure(eye_right,\
    \ fill=new_color)\n```\n\nNow the code checks if the current state of the pupils\
    \ is NORMAL (visible) or HIDDEN (not visible).\n\nThese lines change the visibility\
    \ of the pupils.\n\nThis line sets the pupils' new_state to the opposite value.\n\
    \nThese lines change the eyes' fill colour.\n\n# LINGO\n\n# Toggling\n\nSwitching\
    \ between two states is known as \"toggling\". So you \"toggle\" the lights in\
    \ your house when you switch them on and off. The blinking code switches, or toggles,\
    \ between Screen Pet's eyes being open and closed. If the eyes are closed when\
    \ you run it, they'll change to being open. If they're open, they'll change to\
    \ being closed.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_145_1.png)"
  merge: -1
  img_proc: true
- pgno: 146
  md: "# ### 8 Realistic blinking\n\nThe eyes need to close only briefly and stay\
    \ open for a while between blinks. Add this function, `blink()`, under the code\
    \ you typed in Step 7. It blinks the eyes for a quarter of a second (250 milliseconds),\
    \ then finishes with a command that tells `mainloop()` to call it again after\
    \ 3 seconds (3,000 milliseconds).\n\n```\n```python\nc.itemconfigure(eye_right,\
    \ fill=new_color)\n\ndef blink():\n    toggle_eyes()\n    root.after(250, toggle_eyes)\n\
    \    root.after(3000, blink)\n\nroot = Tk()\n```\n```\n\nClose the eyes.\n\nWait\
    \ 250 milliseconds, then open the eyes.\n\nWait 3,000 milliseconds, then blink\
    \ again.\n\n# ### 9 Animate!\n\nPut this line in the main part of your program,\
    \ just above the last line. Now run the program. Your pet will come to life after\
    \ 1 second (1,000 milliseconds) and sit there blinking until you close the window.\n\
    \n```\n```python\nroot.after(1000, blink)\nroot.mainloop()\n```\n```\n\nWait 1,000\
    \ milliseconds, then start blinking.\n\n# ## Changing moods\n\nScreen Pet looks\
    \ quite happy just now, with its little smile, but let's cheer it up even more.\
    \ We'll give it a bigger, beaming smile and bright, rosy cheeks.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_146_0.png)\n\
    \n# ### 10 Make a happy face\n\nAdd this code to the part of the program that\
    \ draws Screen Pet, after the line that creates the \"normal\" mouth. As well\
    \ as a happy mouth and pink cheeks, it also draws a sad mouth. They will all remain\
    \ hidden for now.\n\nCreate a happy mouth.\n\nCreate a sad mouth.\n\n```\n```python\n\
    mouth_normal = c.create_line(170, 250, 200, 272, 230, 250, smooth=1, width=2,\
    \ state=NORMAL)\nmouth_happy = c.create_line(170, 250, 200, 282, 230, 250, smooth=1,\
    \ width=2, state=HIDDEN)\nmouth_sad = c.create_line(170, 250, 200, 232, 230, 250,\
    \ smooth=1, width=2, state=HIDDEN)\n\ncheek_left = c.create_oval(70, 180, 120,\
    \ 230, outline='pink', fill='pink', state=HIDDEN)\ncheek_right = c.create_oval(280,\
    \ 180, 330, 230, outline='pink', fill='pink', state=HIDDEN)\n\nc.pack()\n```\n\
    ```\n\nThese lines create pink, blushing cheeks."
  merge: -1
  img_proc: true
- pgno: 147
  md: "# ### 11. Show the happy face\n\nNext, create a function called `show_happy()`\
    \ to reveal the happy expression when you move the mouse pointer over Screen Pet\
    \ as if you were stroking it. Type this code beneath the `blink()` function you\
    \ added in Step 8.\n\n# ### LINGO\n#### Event handler\n\nThe function `show_happy()`\
    \ is an event handler. This means it's only called when a particular event happens,\
    \ so that it can deal with it. In your code, stroking your pet calls `show_happy()`.\
    \ In real life, you might call a “mop the floor” function to handle a “spill drink”\
    \ event!\n\n![](img/1bd24ab186f69fb18194b4174ca15178_147_0.png)\n\nThe if line\
    \ checks to see if the mouse pointer is over the pet.\n\n```\n~~~python\nroot.after(3000,\
    \ blink)\n\ndef show_happy(event):\n    # event.x and event.y are the coordinates\
    \ of the mouse-pointer.\n    if (20 <= event.x <= 350) and (20 <= event.y <= 350):\n\
    \        c.itemconfigure(cheek_left, state=NORMAL)   # Show the pink cheeks.\n\
    \        c.itemconfigure(cheek_right, state=NORMAL)\n        c.itemconfigure(mouth_happy,\
    \ state=NORMAL)  # Show the happy mouth.\n        c.itemconfigure(mouth_normal,\
    \ state=HIDDEN) # Hide the normal mouth.\n        c.itemconfigure(mouth_sad, state=HIDDEN)\
    \    # Hide the sad mouth.\n    return\n~~~\n```\n\n# ### EXPERT TIPS\n#### Focus\n\
    \nTkinter won't be able to spot you moving the mouse-pointer over the window to\
    \ stroke Screen Pet unless the window is “in focus”. You can get it in focus by\
    \ clicking once anywhere in the window.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_147_1.png)\n\
    \n# ### 12. Happy moves\n\nWhen the program starts, Screen Pet blinks without\
    \ you doing anything. But to get it to look happy when it's being stroked, you\
    \ need to tell it what event to look out for. Tkinter calls the mouse-pointer\
    \ moving over its window a `<Motion>` event. You need to link this to the handler\
    \ function by using Tkinter's `bind()` command. Add this line to the main part\
    \ of your program. Then run the code and stroke the pet to try it out.\n\n```\n\
    ~~~python\nc.pack()\n\nc.bind('<Motion>', show_happy)  # This command links the\
    \ moving mouse-pointer to the happy face.\n\nroot.after(1000, blink)\nroot.mainloop()\n\
    ~~~\n```"
  merge: -1
  img_proc: true
- pgno: 148
  md: "# 13 Hide the happy face\n\nYou only want Screen Pet to look really happy when\
    \ you’re actually stroking it. Add a new function, `hide_happy()`, below the code\
    \ for `show_happy()`. This new code will set Screen Pet’s expression back to normal.\n\
    \n```\n```python\ndef hide_happy(event):\n    c.itemconfigure(cheek_left, state=HIDDEN)\n\
    \    c.itemconfigure(cheek_right, state=HIDDEN)\n    c.itemconfigure(mouth_happy,\
    \ state=HIDDEN)\n    c.itemconfigure(mouth_normal, state=NORMAL)\n    c.itemconfigure(mouth_sad,\
    \ state=HIDDEN)\n    return\n```\n```\n\nHide the pink cheeks.\n\nHide the happy\
    \ mouth.\n\nShow the normal mouth.\n\nHide the sad mouth.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_148_0.png)\n\
    \n# 14 Call the function\n\nType this line to call `hide_happy()` when the mouse-pointer\
    \ leaves the window. It links Tkinter’s `<Leave>` event to `hide_happy()`. Now\
    \ test your code.\n\n```\n```python\nc.bind('<Motion>', show_happy)\nc.bind('<Leave>',\
    \ hide_happy)\n\nroot.after(1000, blink)\n```\n```\n\n# What a cheek!\n\nSo far,\
    \ your pet has been very well behaved. Let’s give it a cheeky personality! You\
    \ can add some code that will make Screen Pet stick its tongue out and cross its\
    \ eyes when you tickle it by double-clicking on it.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_148_1.png)\n\
    \n# 15 Draw the tongue\n\nAdd these lines to the code that draws Screen Pet, under\
    \ the line that creates the sad mouth. The program will draw the tongue in two\
    \ parts, a rectangle and an oval.\n\n```\n```python\nmouth_sad = c.create_line(170,\
    \ 250, 200, 232, 230, 250, smooth=1, width=2, state=HIDDEN)\n\ntongue_main = c.create_rectangle(170,\
    \ 250, 230, 290, outline='red', fill='red', state=HIDDEN)\ntongue_tip = c.create_oval(170,\
    \ 285, 230, 300, outline='red', fill='red', state=HIDDEN)\n\ncheek_left = c.create_oval(70,\
    \ 180, 120, 230, outline='pink', fill='pink', state=HIDDEN)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 149
  md: "# Set up flags\n\nAdd two flag variables to the code to keep track of whether\
    \ Screen Pet’s eyes are crossed or its tongue is out. Type them just above the\
    \ line that tells Screen Pet to start blinking, which you added to the main part\
    \ of the code in Step 9.\n\n```\n```python\nc.eyes_crossed = False\nc.tongue_out\
    \ = False\n\nroot.after(1000, blink)\n```\n```\n\nThese are the flag variables\
    \ for the pupils and the tongue.\n\n# Expert tips — Using flag variables\n\nFlag\
    \ variables help you keep track of something in your program that can be in one\
    \ of two states. When you change the state, you update the flag. The “Engaged\
    \ / Vacant” sign on a toilet door is a flag – you set it to “Engaged” when you\
    \ lock the door and back to “Vacant” when you unlock it.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_149_0.png)\n\
    \n# Toggle the tongue\n\nThis function toggles Screen Pet’s tongue between being\
    \ out and in. Put the code shown below above the show_happy() function that you\
    \ created in Step 11.\n\n```\n```python\ndef toggle_tongue():\n    if not c.tongue_out:\n\
