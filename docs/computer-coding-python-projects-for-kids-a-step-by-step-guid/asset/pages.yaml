- pgno: 110
  md: '# # How it works


    The program learns about the important events by reading information from a text
    file – this is called “file input”. The text file contains the name and date of
    each event. The code calculates the number of days from today until each event
    using Python’s datetime module. It displays the results in a window created by
    Python’s Tkinter module.


    # ## Using Tkinter


    The Tkinter module is a set of tools that Python programmers use for displaying
    graphics and getting input from users. Instead of showing output in the shell,
    Tkinter can display results in a separate window that you’re able to design and
    style yourself.


    ![](img/1bd24ab186f69fb18194b4174ca15178_110_0.png)


    # ### LINGO


    # ## Graphical user interface


    A GUI (graphical user interface) is the visible part of a program you interact
    with, such as the system of icons and menus on a smartphone. Python’s Tkinter
    module allows you to build a GUI by using what we call widgets – packages of ready-made
    code that create pop-up windows, buttons, sliders, menus and so on.


    ![](img/1bd24ab186f69fb18194b4174ca15178_110_1.png)


    A smartphone GUI uses icons to show how strong the WiFi signal is and how much
    power the battery has.


    # # Countdown Calendar flowchart


    In this project, the list of important events is created separately from the code
    as a text file. The program begins by reading in all the events from this file.
    Once all the days have been calculated and displayed, the program ends.


    ![](img/1bd24ab186f69fb18194b4174ca15178_110_2.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Making and reading the text file


    All the information for your Countdown Calendar must be stored in a text file.
    You can create it using IDLE.


    ![](img/1bd24ab186f69fb18194b4174ca15178_111_0.png)


    # Create a new file


    Open a new IDLE file, then type in a few upcoming events that are important to
    you. Put each event on a separate line and type a comma between the event and
    its date. Make sure there is no space between the comma and the event date.


    Example contents of `events.txt`:


    ```text

    Halloween,31/10/17

    Spanish Test,01/12/17

    School Trip,20/02/18

    My Birthday,11/01/18

    ```


    Type the date as day/month/year.


    The name of the event comes first.


    ![](img/1bd24ab186f69fb18194b4174ca15178_111_1.png)


    # Save it as a text file


    Next save the file as a text file. Click the File menu, choose Save As, and call
    the file “events.txt”. Now you’re ready to start coding the Python program.


    ![](img/1bd24ab186f69fb18194b4174ca15178_111_2.png)


    # Open a new Python file


    You now need to create a new file for the code. Save it as “countdown_calendar.py”
    and make sure it’s in the same folder as your “events.txt” file.


    ![](img/1bd24ab186f69fb18194b4174ca15178_111_3.png)


    # Set up the modules


    This project needs two modules: `Tkinter` and `datetime`. Tkinter will be used
    to build a simple GUI, while datetime will make it easy to do calculations using
    dates. Import them by typing these two lines at the top of your new program.


    ```

    ```python

    from tkinter import Tk, Canvas

    from datetime import date, datetime

    ```

    ```


    Import the Tkinter and datetime modules.


    ![](img/1bd24ab186f69fb18194b4174ca15178_111_4.png)'
