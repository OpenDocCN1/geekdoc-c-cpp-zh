  md: "# Hacks and tweaks\n\nYou could adapt this game in many ways. You can show\
    \ the number of moves taken to finish the game, so the player can try and beat\
    \ their own score or challenge their friends. You could also add more symbols\
    \ to make the game harder.\n\n# Show the number of moves\n\nAt the moment, the\
    \ player has no way of knowing how well they’ve done or if they’ve done any better\
    \ than their friends. How can we make the game more competitive? Let’s add a variable\
    \ to count how many turns a player takes to finish the game. Then players can\
    \ compete to see who gets the lowest score.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_186_0.png)\n\
    \n+   1. **Add a new module**\n+   \n+   You need to import Tkinter’s messagebox\
    \ widget to display the number of moves at the end of the game. In the import\
    \ line, add the word `messagebox` after `DISABLED`.\n\n```\nfrom tkinter import\
    \ Tk, Button, DISABLED, messagebox\n```\n\n+   2. **Make new variables**\n+  \
    \ \n+   You’ll have to make two extra variables for this hack. One variable will\
    \ keep track of the number of moves the player makes, while the other will remember\
    \ how many pairs they’ve found. Give them both a starting value of 0. Put these\
    \ lines below the variable `previousY`.\n\n```\npreviousY = 0\nmoves = 0\npairs\
    \ = 0\n```\n\nThe player hasn’t made any moves yet, or found any pairs, so the\
    \ values are 0.\n\n+   3. **Declare them global**\n+   \n+   The moves and pairs\
    \ variables are global variables, and they’ll need to be changed by the `show_symbol()`\
    \ function. Let `show_symbol()` know this by putting these two lines near the\
    \ top of the function.\n\n```\ndef show_symbol(x, y):\n    global first\n    global\
    \ previousX, previousY\n    global moves\n    global pairs\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: "# 4 Count the moves\n\nA move is two button presses (one matching attempt).\
    \ So you only need to add 1 to the `moves` variable when the `show_symbol()` function\
    \ is called for the first or the second button press—not for both. Let’s do it\
    \ for the first button press. Change the `show_symbol()` function to look like\
    \ this.\n\n```\n```python\nif first:\n    previousX = x\n    previousY = y\n \
    \   first = false\n    moves = moves + 1\n```\n```\n\n# 5 Display a message\n\n\
    Now add the following code near the bottom of the `show_symbol()` function. It\
    \ will track the matched pairs and show a message box at the end of the game telling\
    \ the player how many moves they took. When the player clicks the box’s OK button,\
    \ the code calls the `close_window()` function, which we’ll add next.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_187_0.png)\n\
    \n```\n```python\nbuttons[x, y]['command'] = DISABLED\npairs = pairs + 1\nif pairs\
    \ == len(buttons)/2:\n    messagebox.showinfo('Matching', 'Number of moves: '\
    \ +\n                        str(moves), command=close_window)\n```\n```\n\nAdd\
    \ 1 to the number of pairs found.\n\nThis line displays a box showing the number\
    \ of moves.\n\nIf all the pairs have been found, run the code under this line.\n\
    \n# △ How it works\n\nThere are 12 pairs of symbols, so you could simply have\
    \ typed `pairs == 12` in the hack. However, your code is smarter than this. It\
    \ calculates the number of pairs by using `pairs = len(buttons)/2`. This allows\
    \ you to add more buttons to the game without having to update this bit of code.\n\
    \n# 6 Close the window\n\nFinally, you need to create a `close_window()` function,\
    \ to make the program exit the game when the player clicks the OK button on the\
    \ “Number of moves” message box. Add this code under the line that imports the\
    \ modules.\n\n```\n```python\ndef close_window(self):\n    root.destroy()\n```\n\
    ```\n\nThis command closes the window."
