- pgno: 196
  md: "# 10 Oops – egg drop!\n\nNext add the egg_dropped() function after move_eggs().\
    \ When an egg is dropped, it is removed from the list of eggs and then deleted\
    \ from the canvas. A life is deducted using the lose_a_life() function, which\
    \ you'll create in Step 11. If losing a life means there are no lives left, the\
    \ \"Game Over!\" message is shown.\n\nIf no lives are left, tell the player that\
    \ the game is over.\n\n```\n    root.after(egg_speed, move_eggs)\n\n    def egg_dropped(egg):\n\
    \        eggs.remove(egg)  # The egg is removed from the eggs list.\n        c.delete(egg)\
    \  # The egg disappears from the canvas.\n        lose_a_life()  # This line calls\
    \ the lose_a_life() function.\n        if lives_remaining == 0:\n            messagebox.showinfo('Game\
    \ Over!', 'Final Score: ' + str(score))\n            root.destroy()  # The game\
    \ ends.\n```\n\n# 11 Lose a life\n\nLosing a life simply involves subtracting\
    \ a life from the lives_remaining variable and then displaying the new value on\
    \ the screen. Add these lines after the egg_dropped() function.\n\n```\n    root.destroy()\n\
    \n    def lose_a_life():\n        global lives_remaining  # This variable needs\
    \ to be global, as the function will modify it.\n        lives_remaining -= 1\
    \  # The player loses a life.\n        c.itemconfigure(lives_text, text='Lives:\
    \ ' + str(lives_remaining))  # This line updates the text that shows the remaining\
    \ lives.\n```\n\n# 12 Check for a catch\n\nNow add the check_catch() function.\
    \ An egg is caught if it's inside the arc of the catcher. To find out if you've\
    \ made a catch, the for loop gets the coordinates of each egg and compares them\
    \ with the catcher's coordinates. If there's a match, the egg is caught. Then\
    \ it's deleted from the list, removed from the screen, and the score is increased.\n\
    \n```\n    c.itemconfigure(lives_text, text='Lives: ' + str(lives_remaining))\n\
    \n    def check_catch():\n        (catcher_x, catcher_y, catcher_x2, catcher_y2)\
    \ = c.coords(catcher)  # Get the coordinates of the catcher.\n        for egg\
    \ in eggs:\n            (egg_x, egg_y, egg_x2, egg_y2) = c.coords(egg)  # Get\
    \ the coordinates of the eggs.\n            if catcher_x < egg_x and egg_x2 <\
    \ catcher_x2 and catcher_y2 - egg_y2 < 40:  # Is the egg inside the catcher horizontally\
    \ and vertically?\n                eggs.remove(egg)\n                c.delete(egg)\n\
    \                increase_score(egg_score)  # Increase the score by 10 points.\n\
    \        root.after(100, check_catch)  # Call this function again after 100 milliseconds\
    \ (one-tenth of a second).\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "# 13 Increase the score\n\nFirst the score is increased by the value of the\
    \ points parameter. Next the new speed and interval of the eggs are calculated\
    \ by multiplying their values by the difficulty factor. Finally, the text on the\
    \ screen is updated with the new score. Add this new function beneath check_catch().\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_197_0.png)\n\n```\n~~~python\nroot.after(100,\
    \ check_catch)\n\ndef increase_score(points):\n    global score, egg_speed, egg_interval\n\
    \    score += points\n    egg_speed = int(egg_speed * difficulty_factor)\n   \
    \ egg_interval = int(egg_interval * difficulty_factor)\n    c.itemconfigure(score_text,\
    \ text='Score: ' + str(score))\n~~~\n```\n\nAdd to the player's score.\n\nThis\
    \ line updates the text that shows the score.\n\n# ## Catch those eggs!\n\nNow\
    \ you've got all the shapes and functions needed for the game, all that's left\
    \ to add are the controls for the egg catcher and the commands that start the\
    \ game.\n\n# ### 14 Set up the controls\n\nThe move_left() and move_right() functions\
    \ use the coordinates of the catcher to make sure it isn't about to leave the\
    \ screen. If there's still space to move to, the catcher shifts horizontally by\
    \ 20 pixels. These two functions are linked to the left and right arrow keys on\
    \ the keyboard using the bind() function. The focus_set() function allows the\
    \ program to detect the key presses. Add the new functions beneath the increase_score()\
    \ function.\n\n```\n~~~python\nc.itemconfigure(score_text, text='Score: ' +\n\
    \                str(score))\n\ndef move_left(event):\n    (x1, y1, x2, y2) =\
    \ c.coords(catcher)\n    if x1 > 0:\n        c.move(catcher, -20, 0)\n\ndef move_right(event):\n\
    \    (x1, y1, x2, y2) = c.coords(catcher)\n    if x2 < canvas_width:\n       \
    \ c.move(catcher, 20, 0)\n\nc.bind('<Left>', move_left)\nc.bind('<Right>', move_right)\n\
    c.focus_set()\n~~~\n```\n\nHas the catcher reached the left-hand wall?\n\nIf not,\
    \ move the catcher left.\n\nHas the catcher reached the right-hand wall?\n\nIf\
    \ not, move the catcher right.\n\nThese lines call the functions when the keys\
    \ are pressed."
  merge: -1
