  md: "# ▷ One branch\n\nThe simplest branching command is an `if` statement. It only\
    \ has one branch, which the computer takes if the condition is True. This program\
    \ asks the user to say if it’s dark outside. If it is, the program pretends that\
    \ the computer is going to sleep! If it’s not dark, `is_dark == 'y'` is False,\
    \ so the “Goodnight!” message isn’t displayed.\n\nThis line asks the user to reply\
    \ “y” (yes) or “n” (no).\n\n```\nis_dark = input('Is it dark outside? y/n')\n\n\
    if is_dark == 'y':\n    print('Goodnight! Zzzzzzzzzzzzz....')\n```\n\nCondition\n\
    \nThis branch is taken if the condition is true.\n\nThe code shows this message\
    \ in the shell window.\n\n# ▷ Two branches\n\nDo you want a program to do one\
    \ thing if a condition’s True and another thing if it’s False? If so, you need\
    \ a command with two branches, called an `if-else` statement. This program asks\
    \ if the user has tentacles. If they answer “Yes”, it decides they must be an\
    \ octopus! If they answer “No”, it decides they’re human. Each decision prints\
    \ a different message.\n\nThis line asks for input from the user.\n\nCondition\n\
    \n```\ntentacles = input('Do you have tentacles? (y/n)')\nif tentacles == 'y':\n\
    \    print('I never knew octopuses could type!')\nelse:\n    print('Greetings,\
    \ human!')\n```\n\nThis block runs if the condition is True.\n\nThis block runs\
    \ if the condition is False.\n\n# ▷ Multiple branches\n\nWhen there are more than\
    \ two possible paths, the statement `elif` (short for “else-if”) comes in handy.\
    \ This program asks the user to type in the weather forecast: either “rain”, “snow”,\
    \ or “sun”. It then chooses one of three branches and weather conditions.\n\n\
    ```\nweather = input('What is the forecast for today? (rain/snow/sun)')\n\nif\
    \ weather == 'rain':\n    print('Remember your umbrella!')\nelif weather == 'snow':\n\
    \    print('Remember your woolly gloves!')\nelse:\n    print('Remember your sunglasses!')\n\
    ```\n\nFirst condition\n\nThis block runs if the first condition is True.\n\n\
    Second condition\n\nThis block runs if the second condition is True.\n\nThis block\
    \ runs if both conditions are false.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_30_0.png)\n\
    \n# △ How it works\n\nAn `elif` statement must always come after `if` and before\
    \ `else`. In this code, `elif` checks for snow only when the condition set by\
    \ the `if` statement is False. You could insert additional `elif` statements to\
    \ check for more types of weather."
  merge: -1
