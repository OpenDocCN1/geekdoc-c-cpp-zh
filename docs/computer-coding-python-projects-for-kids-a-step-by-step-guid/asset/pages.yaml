- pgno: 173
  md: "+   13. **React to snaps**\n+   \n+   Next add these two lines to your code.\
    \ The `bind()` function tells the GUI to listen for the “q” or “p” key being pressed,\
    \ and to call the `snap()` function each time it happens. You’ll create the `snap()`\
    \ function later.\n\n```\n    root.after(3000, next_shape)\n    c.bind('q', snap)\n\
    \    c.bind('p', snap)\n```\n\n+   14. **Send key presses to the GUI**\n+   \n\
    +   The `focus_set()` function tells the key presses to go to the canvas. The\
    \ GUI wouldn't react to “q” and “p” being pressed without this function being\
    \ called. Type this line below the `bind()` function calls.\n\n```\n    c.bind('q',\
    \ snap)\n    c.bind('p', snap)\n    c.focus_set()\n```\n\n+   15. **Start the\
    \ main loop**\n+   \n+   Add this line right at the end of your file. Once we\
    \ add the `next_shape()` and `snap()` functions, the main loop will update the\
    \ GUI with the next shape and listen for key presses.\n\n```\n    c.focus_set()\n\
    \    root.mainloop()\n```\n\n# EXPERT TIPS\n\n# Local and global variables\n\n\
    Variables can either be local or global. A local variable exists only inside a\
    \ particular function, which means the rest of the program can't use it. A variable\
    \ created in the main program, outside of a function, is called global and can\
    \ be used in any part of the code. However, if you want to use a function to assign\
    \ a new value to a global variable, you need to add the keyword `global` before\
    \ the variable's name when you type it in the function. This is what we do in\
    \ Step 16.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_173_0.png)\n\n# Coding\
    \ the functions\n\nThe last stage is to create two functions; one to show the\
    \ next shape, and another to handle snaps. Type them at the top of your program,\
    \ just below the import statements.\n\n+   16. **Create the function**\n+   \n\
    +   The `next_shape()` function shows the coloured shapes one after another, like\
    \ cards being dealt. Start defining the function by typing the code below. It\
    \ labels some of your variables as global (see box, left) and updates `previous_color`.\n\
    \nUsing the `global` keyword ensures that changes to the variables are seen throughout\
    \ the program.\n\n```\n    def next_shape():\n        global shape\n        global\
    \ previous_color\n        global current_color\n\n        previous_color = current_color\n\
    ```\n\nThis line sets `previous_color` to `current_color` before the code gets\
    \ the next shape."
