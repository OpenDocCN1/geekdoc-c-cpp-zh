- pgno: 67
  md: "# Add a new loop\n\nTo make the clue the correct length once the secret word\
    \ has been selected, use this simple loop. It counts how many letters are in the\
    \ word and adds a question mark for each letter.\n\n```\n```python\nclue = []\n\
    index = 0\nwhile index < len(secret_word):\n    clue.append('?')\n    index =\
    \ index + 1\n```\n```\n\nThe append() function simply adds an item to the end\
    \ of the list.\n\n# Make the ending smarter\n\nAt the moment, the game doesn’t\
    \ end until you type out the word in full. Let’s make the code smarter so the\
    \ game ends when you guess the last letter.\n\n# Make another variable\n\nFirst\
    \ create a variable to keep count of how many letters are unknown. Add this code\
    \ above the update_clue function.\n\n```\n```python\nunknown_letters = len(secret_word)\n\
    ```\n```\n\nAt first all the letters are unknown.\n\n# Edit function\n\nNext change\
    \ the update_clue() function as shown below. Each time the player guesses a letter\
    \ correctly, the program will now take away the number of times that letter appears\
    \ in the secret word from unknown_letters.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_67_0.png)\n\
    \n```\n```python\ndef update_clue(guessed_letter, secret_word, clue, unknown_letters):\n\
    \    index = 0\n    while index < len(secret_word):\n        if guessed_letter\
    \ == secret_word[index]:\n            clue[index] = guessed_letter\n         \
    \   unknown_letters = unknown_letters - 1\n        index = index + 1\n\n    return\
    \ unknown_letters\n```\n```\n\nAdd this new parameter to the update_clue function.\n\
    \nThe code subtracts 1 from unknown_letters each time a guessed letter appears\
    \ in the word.\n\nThis line makes the function return the number of unknown letters."
  merge: -1
  img_proc: true
