- pgno: 71
  md: '# Robot Builder


    Creating graphics in Python is easy. Python’s turtle module lets you move a robot
    “turtle” around the screen, drawing pictures with a pen as it goes. In this project,
    you’ll program the turtle to build more robots – or at least pictures of robots!


    # What happens


    When you run the program, Python’s turtle sets off, scuttling around the screen
    as it draws a friendly robot. Watch as it assembles the robot piece by piece,
    using different colours.


    ![](img/1bd24ab186f69fb18194b4174ca15178_71_0.png)


    Python Turtle Graphics


    ![](img/1bd24ab186f69fb18194b4174ca15178_71_1.png)


    You can change the robot’s colour scheme to whatever you fancy.


    Customize your robot by altering the size of the rectangles that make up its body
    parts.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# How it works


    You’ll start by writing a function that draws rectangles. Then you’ll put the
    rectangles together to build the robot. You can change the size and colour of
    the rectangles by altering the parameters you pass to the function. So you can
    have long, thin blocks for the legs, square ones for the eyes, and so on.


    # ▽ Don’t call me turtle!


    Be careful never to name any of your turtle programs “turtle.py”. If you do that,
    Python will get really confused and give you lots of error messages.


    ![](img/1bd24ab186f69fb18194b4174ca15178_72_0.png)


    # ▽ Drawing with the turtle


    The turtle module allows you to control a pen-carrying robot turtle. By giving
    the turtle instructions on how it should move around the screen, you can draw
    different pictures and designs. You can also tell the turtle when to put the pen
    down and start drawing, or when to pull it up so it can move to a different part
    of the screen without leaving an untidy trail.


    The turtle moves forward 100 pixels, turns left 90 degrees, then moves forwards
    50 pixels.


    ```

    ```python

    t.forward(100)

    t.left(90)

    t.forward(50)

    ```

    ```


    ![](img/1bd24ab186f69fb18194b4174ca15178_72_1.png)


    # ▽ Robot Builder flowchart


    The flowchart shows how the code for this project fits together. First the program
    sets the background colour and how fast the turtle moves. Then it draws the robot
    one part at a time, starting from its feet and moving up to its head.


    ![](img/1bd24ab186f69fb18194b4174ca15178_72_2.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: "# Drawing rectangles\n\nLet's begin by importing the turtle module and using\
    \ it to create a function that draws rectangles.\n\n+   1. **Create a new file**\n\
    +   \n+      Open IDLE and create a new file. Save it as “robot_builder.py”.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_73_0.png)\n\n+   2. **Import the Turtle\
    \ module**\n+   \n+      Type this line at the top of your program. The command\
    \ `import turtle as t` lets you use functions from the turtle module without having\
    \ to type “turtle” in full each time. It's like calling someone whose name is\
    \ Benjamin “Ben” for short.\n\n```\n~~~python\nimport turtle as t\n~~~\n```\n\n\
    This gives the Turtle module the nickname “t”.\n\n+   3. **Create a rectangle\
    \ function**\n+   \n+      Now make the function to draw the blocks that you're\
    \ going to use to build your robot. The function has three parameters: the length\
    \ of the horizontal side; the length of the vertical side; and color. You'll use\
    \ a loop that draws one horizontal side and one vertical side each time it runs,\
    \ and you'll make it run twice. Put this rectangle function under the code you\
    \ added in Step 2.\n\n```\n~~~python\ndef rectangle(horizontal, vertical, color):\n\
    \    t.pendown()\n    t.pensize(1)\n    t.color(color)\n    t.begin_fill()\n \
    \   for counter in range(1, 3):\n        t.forward(horizontal)\n        t.right(90)\n\
    \        t.forward(vertical)\n        t.right(90)\n    t.end_fill()\n    t.penup()\n\
    ~~~\n```\n\nPut the turtle's pen down to start drawing.\n\nUsing `range(1, 3)`\
    \ makes the loop run twice.\n\nPull the turtle's pen back up to stop drawing.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_73_1.png)\n\nThis block draws the rectangle.\n\
    \nThe turtle draws the sides in the order shown here.\n\n# EXPERT TIPS\n\n# Turtle\
    \ mode\n\nYou'll be using the turtle in its standard mode. This means the turtle\
    \ starts off facing the right side of the screen. If you set the heading (another\
    \ word for direction) to 0, it will face right. Setting the heading to 90 makes\
    \ it point to the top of the screen, 180 points it to the left, and 270 makes\
    \ it point to the bottom of the screen.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_73_2.png)\n\
    \nThe turtle normally looks like an arrowhead. This line changes it to a turtle\
    \ shape.\n\n```\n~~~python\nt.shape('turtle')\nt.setheading(0)\nt.forward(80)\n\
    ~~~\n```"
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Turtle speed


    You can control how fast the turtle draws by using the `t.speed()` command to
    set its speed to one of these values: “slowest,” “slow,” “normal,” “fast,” and
    “fastest.”


    ![](img/1bd24ab186f69fb18194b4174ca15178_74_0.png)


    # Set the background


    Next get the turtle ready to start drawing, and set the background colour of the
    window. You need the turtle to start with its pen up so that it doesn’t draw lines
    until you want it to. It will only begin to draw when it reaches the robot’s feet
    (Step 5). Type the following code under the code you added in Step 3.


    Pull the turtle’s pen up.


    Set the turtle’s speed to slow.


    ```

    ```python

    t.penup()

    t.speed(''slow'')

    t.bgcolor(''Dodger blue'')

    ```

    ```


    Make the background of the window “Dodger blue”.


    # Building the robot


    Now you’re ready to start building the robot. You’re going to make it piece by
    piece, starting with the feet and working your way up. The whole robot will be
    made using rectangles of different sizes and colours, each drawn from a different
    starting point in the Turtle window.


    ![](img/1bd24ab186f69fb18194b4174ca15178_74_1.png)


    # Draw the feet


    You need to move the turtle to where you want to start drawing the first foot,
    and then use your rectangle function to draw it. You’ll need to do the same for
    the second foot. Type these lines under the code you added in Step 4, then run
    the program to see your robot’s feet appear.


    This comment indicates which part of the robot you’re drawing.


    Move the turtle to position x = -100, y = -150.


    Use the rectangle function to draw a blue rectangle 50 wide and 20 high.


    ```

    ```python

    # feet

    t.goto(-100, -150)

    rectangle(50, 20, ''blue'')

    t.goto(-30, -150)

    rectangle(50, 20, ''blue'')

    ```

    ```


    # Comments


    You’ll notice that there are several lines in this program that start with a `#`
    symbol. The words following the `#` are a comment, added to make the code easier
    for users to read and understand. Python knows that it should ignore them.'
