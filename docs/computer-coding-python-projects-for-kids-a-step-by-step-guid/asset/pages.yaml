  md: "# # Syntax errors\n\nWhen you get a syntax error message, it's a hint that\
    \ you've typed something incorrectly. Perhaps your fingers slipped and hit a wrong\
    \ letter? Don't worry – these are the easiest errors to fix. Check through your\
    \ code carefully and try to spot what went wrong.\n\n# ### Things to look out\
    \ for\n\nAre you missing a bracket or quotation mark? Do your pairs of brackets\
    \ and quotation marks match? Have you made a spelling mistake? All these things\
    \ can cause syntax errors.\n\nThe closing bracket is missing – it needs another\
    \ curved bracket here.\n\n```\n```python\ninput('What is your name?')\n```\n```\n\
    \nThe first quotation mark is missing. It needs to be a single quote to match.\n\
    \n```\n```python\nprint('It is your turn')\n```\n```\n\nThis is a spelling mistake\
    \ – it should be short_shots.\n\n```\n```python\ntotal_score = (long_shots * 3)\
    \ + (short_shots * 2)\n```\n```\n\n# # Indentation errors\n\nPython uses indentation\
    \ to understand where blocks of code start and stop. An indentation error means\
    \ something is wrong with the way you've structured the code. Remember: if a line\
    \ of code ends with a colon (:), the next line must be indented. Press the space\
    \ bar four times to manually indent a line.\n\n# ### Indent each new block\n\n\
    In your Python programs, you'll often have one block of code within another block,\
