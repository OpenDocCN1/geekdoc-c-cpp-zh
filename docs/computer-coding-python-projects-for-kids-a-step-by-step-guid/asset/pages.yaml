- pgno: 183
  md: "# Bring on the buttons!\n\nIn the next stage you'll make the buttons and add\
    \ them to the GUI. Then you'll create a function called `show_symbol()` to control\
    \ what happens when a player clicks on the buttons.\n\n# Build the grid\n\nThe\
    \ grid will consist of 24 buttons arranged into four rows of six. To lay out the\
    \ grid, you'll use nested loops. The outer `x` loop will work from left to right\
    \ across the six columns, while the inner `y` loop will work from top to bottom\
    \ down each column. Once the loops have run, each button will have been given\
    \ a pair of x and y coordinates that set its position on the grid. Put this block\
    \ of code after the shuffle command.\n\n# EXPERT TIPS — Button\n\nTkinter has\
    \ a built-in widget called `Button`, which we use to create the GUI buttons. You\
    \ can pass different parameters to it. The ones we need are `command`, `width`,\
    \ and `height`. The `command` parameter tells the program what to do when a button\
    \ is pressed. This is a function call. In our program, it calls a lambda function.\
    \ The `width` and `height` parameters are used to set the size of the button.\n\
    \n```\n```python\nrandom.shuffle(symbols)\n\nfor x in range(6):\n    for y in\
    \ range(4):\n        button = Button(command=lambda x=x, y=y: show_symbol(x, y),\n\
    \                        width=3, height=3)\n        button.grid(column=x, row=y)\n\
    \        buttons[x, y] = button\n        button_symbols[x, y] = symbols.pop()\n\
    ```\n```\n\nThese are nested loops.\n\nThis line creates each button and sets\
    \ its size and action when pressed.\n\nThe button is placed on the GUI.\n\nUse\
    \ a backslash character if you need to split a long line of code over two lines.\n\
    \nThis line saves each button in the buttons dictionary.\n\nThe button's symbol\
    \ is set by this line.\n\n# How it works\n\nEach time the loop runs, the lambda\
    \ function saves the current button's x and y values (the row and column it's\
    \ in). When this button is pressed, it calls the `show_symbol()` function (which\
    \ you'll create later) that saves the symbol, so the function knows which button\
    \ has been pressed and which symbol to reveal.\n\n> And now for the big reveal...\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_183_0.png)"
