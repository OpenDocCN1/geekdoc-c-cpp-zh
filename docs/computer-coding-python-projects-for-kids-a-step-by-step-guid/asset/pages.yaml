- pgno: 129
  md: '# Secret Messages


    Swap messages with your friends using the art of cryptography – changing the text
    of a message so that people who don’t know your secret methods can’t understand
    it!


    # What happens


    The program will ask you if you want to create a secret message or reveal what
    a secret message says. It will then ask you to type in the message. If you choose
    to make a secret message, your message will be turned into what looks like total
    gibberish. But if you choose to reveal a message, nonsense will be turned into
    text you can read!


    # Cryptography


    The word ‘cryptography’ comes from the ancient Greek words for “hidden” and “writing”.
    People have been using this technique to send secret messages for nearly 4,000
    years. Here are some special terms used in cryptography:


    +   - **Cipher** – a set of instructions for altering a message to hide its meaning.

    +   - **Encrypt** – to hide the secret message.

    +   - **Decrypt** – to reveal the secret message.

    +   - **Ciphertext** – the message after it has been encrypted.

    +   - **Plaintext** – the message before it has been encrypted.


    ![](img/1bd24ab186f69fb18194b4174ca15178_129_0.png)


    **Share the code**

    If you share your Python code with a friend, you’ll be able to pass secret messages
    to each other.


    ![](img/1bd24ab186f69fb18194b4174ca15178_129_1.png)


    > “Let’s put this message in to scramble it.”


    > “I can’t understand a word of this...”'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# How it works


    The program rearranges the order of letters in the message so that it can''t be
    understood. It does this by working out which letters are in even or odd positions.
    Then it swaps the position of each pair of letters in the message, starting with
    the first two, then the next two, and so on. The program also makes encrypted
    messages readable again by switching the letters back to where they started.


    > I''ve mixed up all my letters.


    In Python (which counts in a weird way, starting from 0), the first letter in
    the word is in an even position.


    | s | e | c | r | e | t |

    |---|---|---|---|---|---|

    | e | s | r | c | e | t |


    | e | s | r | c | e | t |

    |---|---|---|---|---|---|

    | s | e | c | r | e | t |


    # Encryption


    When you run the code on your message, the program swaps each pair of letters,
    scrambling the meaning.


    # Decryption


    When you or a friend decrypt the message, the program swaps the letters back to
    their original positions.


    # Message decryptor


    > I''ll put this message through the decryptor to unscramble it!


    > It makes perfect sense now. What a brilliant machine!


    Message in


    Message out'
