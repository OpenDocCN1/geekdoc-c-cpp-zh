  md: "# ## 5 Get drawing\n\nTo draw your pet, add these instructions above the last\
    \ two lines of code. There's a separate command for each body part. The numbers,\
    \ called coordinates, tell Tkinter what to draw and where to draw it.\n\nStoring\
    \ the body colour in the variable c.body_color means you don't have to keep typing\
    \ in 'SkyBlue1'.\n\n```\n```python\nc.configure(bg='dark blue', highlightthickness=0)\n\
    c.body_color = 'SkyBlue1'\n\nbody = c.create_oval(35, 20, 365, 350, outline=c.body_color,\
    \ fill=c.body_color)\near_left = c.create_polygon(75, 80, 75, 10, 165, 70, outline=c.body_color,\
    \ fill=c.body_color)\near_right = c.create_polygon(255, 45, 325, 10, 320, 70,\
    \ outline=c.body_color, \\\n                             fill=c.body_color)\n\
    foot_left = c.create_oval(65, 320, 145, 360, outline=c.body_color, fill=c.body_color)\n\
    foot_right = c.create_oval(250, 320, 330, 360, outline=c.body_color, fill=c.body_color)\n\
    \neye_left = c.create_oval(130, 110, 160, 170, outline='black', fill='white')\n\
    pupil_left = c.create_oval(140, 145, 150, 155, outline='black', fill='black')\n\
    eye_right = c.create_oval(230, 110, 260, 170, outline='black', fill='white')\n\
    pupil_right = c.create_oval(240, 145, 250, 155, outline='black', fill='black')\n\
    \nmouth_normal = c.create_line(170, 250, 200, 272, 230, 250, smooth=1, width=2,\
    \ state=NORMAL)\n\nc.pack()\n```\n```\n\nIn the code, 'left' and 'right' refer\
    \ to the left and right of the window as you look at it.\n\nThese pairs of coordinates\
    \ define the start, mid-point, and end of the mouth.\n\nThe mouth is a smooth\
    \ line, 2 pixels wide.\n\n# ## Expert Tips\n\n# ### Tkinter coordinates\n\nThe\
    \ drawing instructions use x and y coordinates. In Tkinter, the x coordinates\
    \ start at 0 on the left and increase as you move across the window, until they\
    \ reach 400 on the far right. The y coordinates start at 0 at the top. They get\
    \ bigger as you move down, until they reach 400 at the bottom.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_144_0.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_144_1.png)\n\n# ## 6 Run it again\n\
    \nRun the program again and you should see Screen Pet sitting in the middle of\
