- pgno: 33
  md: "# How it works\n\nThe loop condition in Ahmed's program is `answer == 'y'`.\
    \ This means that the user wants to add a hippo. In the body of the loop we add\
    \ one to the number of hippos balanced, then ask the user if they want to add\
    \ another. If they answer by typing 'y' (for yes), the loop condition is True\
    \ so we go round the loop again. If they answer 'n' (no), the loop condition is\
    \ False and the program leaves the loop.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_33_0.png)\n\
    \n# Infinite loops\n\nSometimes you may want a `while` loop to keep going for\
    \ as long as the program is running. This kind of loop is called an infinite loop.\
    \ Lots of video-game programs use an infinite loop known as a main loop.\n\nThere\
    \ is no False option to escape the loop.\n\n```\n~~~python\n>>> while True:\n\
    \        print('This is an infinite loop!')\n~~~\n```\n\n# EXPERT TIPS\n\n# Stopping\
    \ the loop\n\nIf you don't want an infinite loop, it's important to make sure\
    \ that the body of a `while` loop does something that could make the loop condition\
    \ False. But don't worry—if you accidentally code an infinite loop, you can escape\
    \ from it by pressing the C key while holding down the Ctrl (control) key. You\
    \ may have to press Ctrl-C several times before you quit the loop.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_33_1.png)\n\
    \n# Into infinity\n\nYou make an infinite loop by setting the loop condition to\
    \ a constant value: True. Because this value never changes, the loop will never\
    \ exit. Try this `while` loop in the shell. It has no False option, so the loop\
    \ will print \"This is an infinite loop!\" nonstop until you quit the program.\n\
    \n# Escaping infinity\n\nYou can deliberately use an infinite loop to get input\
    \ from the user. (This annoying) program asks if the user is bored. As long as\
    \ they type 'n', it keeps asking the question. If they get fed up and type 'y',\
    \ it tells them they're rude and uses the `break` command to leave the loop!\n\
    \nThe True condition is that the user is not bored yet ('n').\n\n```\n~~~python\n\
    >>> while True:\n        answer = input('Are you bored yet? (y/n)')\n        if\
    \ answer == 'y':\n            print('How rude!')\n            break\n~~~\n```\n\
    \nThe False condition ('y') triggers the break command."
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Loops inside loops\n\nCan the body of a loop have another loop within it?\
    \ Yes! This is called a nested loop. It’s like Russian dolls, where each doll\
    \ fits inside a larger doll. In a nested loop, an inner loop runs inside an outer\
    \ loop.\n\n> > I like Russian dolls — but they’re always so full of themselves!\n\
    \nThe loop variable of the outer loop is `hooray_counter`.\n\n# EXPERT TIPS —\
    \ Indent the body\n\nThe code in the body of a loop should be indented four spaces.\
    \ If it isn’t, Python will show an error message and the code won’t run. With\
    \ nested loops (one loop inside another), the body of the inner loop must be indented\
    \ an extra four spaces. Python automatically indents new lines in loops, but you\
    \ should always check that each line is indented by the correct number of spaces.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_34_0.png)\n\n# One loop inside another\n\
    \nIn this example, Emma has changed her “Keep Out” program into a “Three Cheers”\
    \ program that prints “Hip, Hip, Hooray!” three times. Because each cheer includes\
    \ the word “Hip” twice, she uses a nested loop to print it.\n\n```\n```python\n\
    for hooray_counter in range(1, 4):\n    for hip_counter in range(1, 3):\n    \
    \    print('Hip')\n    print('Hooray!')\n```\n```\n\nThe body of the outer loop\
    \ is indented 4 spaces.\n\nThe loop variable of the inner loop is `hip_counter`.\n\
    \nThe body of the inner loop is indented another 4 spaces.\n\nhooray_counter =\
    \ 1\n\nHip\nHip\nHooray!\n\nhooray_counter = 2\n\nHip\nHip\nHooray!\n\nhooray_counter\
    \ = 3\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhip_counter\
    \ = 1\nhip_counter = 2\n\nhip_counter = 1\nhip_counter = 2\n\n# How it works\n\
    \nThe whole of the inner for loop is inside the body of the outer for loop. Each\
    \ time we do one repeat of the outer loop, we have to do two repeats of the inner\
    \ loop. This means the body of the outer loop is run three times in total, but\
    \ the body of the inner loop is run six times."
  merge: -1
  img_proc: true
