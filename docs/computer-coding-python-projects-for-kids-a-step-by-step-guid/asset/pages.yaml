- pgno: 175
  md: "# 18 Is it a snap?\n\nTo complete the game, create your last function: `snap()`.\
    \ This function will check which player has hit their key and whether the snap\
    \ is valid (correct). It will then update the scores and show a message. Add this\
    \ code beneath the `next_shape()` function.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_175_0.png)\n\
    \nDon’t forget to save your work.\n\n```\n```python\ndef snap(event):\n    global\
    \ shape\n    global player1_score\n    global player2_score\n    valid = False\n\
    \n    c.delete(shape)\n\n    if previous_color == current_color:\n        valid\
    \ = True\n\n    if valid:\n        if event.char == 'q':\n            player1_score\
    \ = player1_score + 1\n        else:\n            player2_score = player2_score\
    \ + 1\n        shape = c.create_text(200, 200, text='SNAP! You score 1 point!')\n\
    \    else:\n        if event.char == 'q':\n            player1_score = player1_score\
    \ - 1\n        else:\n            player2_score = player2_score - 1\n        shape\
    \ = c.create_text(200, 200, text='WRONG! You lose 1 point!')\n    c.pack()\n \
    \   root.update_idletasks()\n    time.sleep(1)\n```\n```\n\nLabel these variables\
    \ as global so the function can change them.\n\nCheck if it’s a valid snap (if\
    \ the colour of the previous shape matches the colour of the current shape).\n\
    \nIf the snap is valid, check which player snapped and add 1 to their score.\n\
    \nThis line shows a message when a player makes a valid snap.\n\nOtherwise (else),\
    \ take away one point from the player that snapped.\n\nThis line shows a message\
    \ when a player snaps at the wrong time.\n\nThis line forces the program to update\
    \ the GUI with the snap message immediately.\n\nWait 1 second while players read\
    \ the message.\n\n# 19 Test your code\n\nNow run the program to check it works.\
    \ Remember you need to click on the Tkinter window before it will respond to the\
    \ “q” and “p” keys."
