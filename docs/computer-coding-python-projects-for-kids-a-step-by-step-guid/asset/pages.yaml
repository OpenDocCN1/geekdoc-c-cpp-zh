- pgno: 162
  md: "# Filling in the blanks\n\nIt’s time to replace pass in the placeholder functions\
    \ with actual code. After adding the code for each function, run the game to see\
    \ what difference it makes.\n\n# Stay inside\n\nFill the `outside_window()` function\
    \ with this code. First it calculates the position of each of the walls. Then\
    \ it asks the caterpillar for its current position. By comparing the caterpillar’s\
    \ coordinates with the coordinates of the walls, it can tell whether the caterpillar\
    \ has left the window. Run the program to check the function works – the caterpillar\
    \ should stop when it reaches the edge.\n\n```\n```python\ndef outside_window():\n\
    \    left_wall = -t.window_width() / 2\n    right_wall = t.window_width() / 2\n\
    \    top_wall = t.window_height() / 2\n    bottom_wall = -t.window_height() /\
    \ 2\n    (x, y) = caterpillar.pos()\n    outside = \\\n        x< left_wall or\
    \ \\\n        x> right_wall or \\\n        y< bottom_wall or \\\n        y> top_wall\n\
    \    return outside\n```\n```\n\n> This function returns two values (a “tuple”).\n\
    \n> If any of the four conditions above is True, then outside is True.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_162_0.png)\n\
    \n# How it works\n\nThe centre of the window has the coordinates (0, 0). Since\
    \ the window is 400 wide, the right wall is half the width from the centre, which\
    \ is 200. The code gets the left wall’s position by subtracting half the width\
    \ from 0. In other words, 0 - 200, which is -200. It finds the position of the\
    \ top and bottom walls by a similar method.\n\n# GAME OVER!\n\nNow you know when\
    \ the caterpillar has left the screen, display a message to tell the player the\
    \ game has ended. Fill in the `game_over()` function with this code. When called,\
    \ the function will hide the caterpillar and leaf, and write “GAME OVER!” on the\
    \ screen.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_162_1.png)\n\n```\n```python\n\
    def game_over():\n    caterpillar.color('yellow')\n    leaf.color('yellow')\n\
    \    t.penup()\n    t.hideturtle()\n    t.write('GAME OVER!', align='center',\
    \ font=('Arial', 30, 'normal'))\n```\n```\n\n> The text should be centred (Python\
    \ uses the US spelling “center”)."
  merge: -1
  img_proc: true
- pgno: 163
  md: "# 13 Show the score\n\nThe function `display_score()` instructs the score turtle\
    \ to rewrite the score, putting the latest total on the screen. This function\
    \ is called whenever the caterpillar reaches a leaf.\n\n```\n```python\ndef display_score(current_score):\n\
    \    score_turtle.clear()\n    score_turtle.penup()\n    x = (t.window_width()\
    \ / 2) - 50\n    y = (t.window_height() / 2) - 50\n    score_turtle.setpos(x,\
    \ y)\n    score_turtle.write(str(current_score), align='right', \\\n         \
    \              font=('Arial', 40, 'bold'))\n```\n```\n\n50 pixels from the right\n\
    \n50 pixels from the top\n\n# 14 A new leaf\n\nWhen a leaf is reached, the function\
    \ `place_leaf()` is called to move the leaf to a new, random location. It chooses\
    \ two random numbers between −200 and 200. These numbers become the x and y coordinates\
    \ for the next leaf.\n\n```\n```python\ndef place_leaf():\n    leaf.ht()\n   \
    \ leaf.setx(random.randint(-200, 200))\n    leaf.sety(random.randint(-200, 200))\n\
    \    leaf.st()\n```\n```\n\n`ht` is short for hideturtle.\n\nChooses random coordinates\
    \ to move the leaf.\n\n`st` is short for showturtle.\n\n# 15 Turning the caterpillar\n\
    \nNext, to connect the keyboard keys to the caterpillar, add four new direction\
    \ functions after the `start_game()` function. To make this game a little trickier,\
    \ the caterpillar can only make 90-degree turns. As a result, each function first\
    \ checks to see which way the caterpillar is moving before altering its course.\
    \ If the caterpillar is going the wrong way, the function uses `setheading()`\
    \ to make it face the right direction.\n\n```\n```python\ngame_over()\n    break\n\
    \ndef move_up():\n    if caterpillar.heading() == 0 or caterpillar.heading() ==\
    \ 180:\n        caterpillar.setheading(90)\n\ndef move_down():\n    if caterpillar.heading()\
    \ == 0 or caterpillar.heading() == 180:\n        caterpillar.setheading(270)\n\
    \ndef move_left():\n    if caterpillar.heading() == 90 or caterpillar.heading()\
    \ == 270:\n        caterpillar.setheading(180)\n\ndef move_right():\n    if caterpillar.heading()\
    \ == 90 or caterpillar.heading() == 270:\n        caterpillar.setheading(0)\n\
    ```\n```\n\nCheck if the caterpillar is heading left or right.\n\nA heading of\
    \ 270 sends the caterpillar down the screen."
  merge: -1
  img_proc: true
- pgno: 164
  md: "+   **16 Listening for presses**\n+   Finally, use `onkey()` to link the direction\
    \ functions to the keyboard keys. Add these lines after the `onkey()` call you\
    \ made in Step 9. With the steering code in place, the game’s complete. Have fun\
    \ playing and finding out your highest score!\n\n```\nt.onkey(start_game, 'space')\n\
    t.onkey(move_up, 'Up')\nt.onkey(move_right, 'Right')\nt.onkey(move_down, 'Down')\n\
    t.onkey(move_left, 'Left')\nt.listen()\n```\n\n> Call the `move_up` function when\
    \ the “up” key is pressed.\n\n# Hacks and tweaks\n\n**Now that your caterpillar\
