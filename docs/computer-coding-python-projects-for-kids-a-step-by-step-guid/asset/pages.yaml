  md: '# # Matchmaker


    How good is your memory? Put it to the

    test in this fun game where you have to find

    pairs of matching symbols. See how quickly

    you can find all 12 matching pairs!


    # ## What happens


    When you run the program, it opens a window showing

    a grid of buttons. Click on them in pairs to reveal the hidden

    symbols. If two symbols are the same, you’ve found a match

    and the symbols remain visible on the screen. Otherwise, the

    two buttons are reset. Try to remember the location of each

    hidden symbol to quickly find all the pairs.


    ![](img/1bd24ab186f69fb18194b4174ca15178_179_0.png)


    > > Have you got

    > > a good memory?


    > > I can''t remember!


    The grid shows 24

    buttons arranged

    into four rows of six.


    ![](img/1bd24ab186f69fb18194b4174ca15178_179_1.png)


    Click on a button

    to reveal a symbol.


    There are only two

    of each symbol.


    GUI window

    The grid window

    is a graphical user

    interface (GUI)

    created by Python''s

    Tkinter module.


    If you make a wrong match,

    the symbols are hidden again.


    Matching symbols are

    left showing on the grid.'
