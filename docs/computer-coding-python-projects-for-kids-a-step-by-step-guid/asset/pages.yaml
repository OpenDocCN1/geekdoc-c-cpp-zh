- pgno: 21
  md: "# # Your first program\n\nNow that you’ve installed Python and IDLE, it’s time\
    \ to write your first program in Python. Follow these steps to create a simple\
    \ program that greets the user with a cheery message.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_21_0.png)\n\
    \n# ## How it works\n\nThe program first displays the message “Hello, World!”\
    \ and then asks your name. Once you’ve typed in your name, it says hello again,\
    \ but this time it includes your name in the greeting. The program uses something\
    \ called a variable to remember your name. A variable is used in coding to store\
    \ information.\n\n# ### 1. Launch IDLE\n\nA shell window appears when you start\
    \ IDLE. Ignore it and click on File in the IDLE menu. Choose New File to create\
    \ an empty editor window where you can write your program.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_21_1.png)\n\
    \n# ### Hello World flowchart\n\nProgrammers use diagrams called flowcharts to\
    \ plan their programs and to show how each step is shown in a box, with an arrow\
    \ leading to the next step. Sometimes the steps are questions and have more than\
    \ one arrow leading onwards, depending on the answer to the question.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_21_2.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_21_3.png)\n\n# ### 2. Type the first\
    \ line\n\nIn the editor window, type this line of text. The word ‘print’ is a\
    \ Python instruction that tells the computer to display something on the screen,\
    \ such as the words “Hello, World!”\n\n```\n    print('Hello, World!')\n```\n\n\
    # ### 3. Save your file\n\nBefore you can run the code, you must save it. Go to\
    \ the File menu and choose Save.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_21_4.png)"
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Save the file\n\nA pop-up box will appear. Type in a name for your program,\
    \ such as “helloworld.py”, and click Save.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_22_0.png)\n\
    \n# PY files\n\nPython programs usually have a name ending with “.py”, which makes\
    \ them easy to recognize. When you save a program, Python automatically adds “.py”\
    \ at the end, so you don’t need to type it in.\n\n# Check it works\n\nNow run\
    \ the first line of the program to see if it works. Open the Run menu and choose\
    \ Run Module. You should see the message “Hello, World!” in the shell window.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_22_1.png)\n\n```\n```text\n>>> \nHello,\
    \ World!\n>>>\n```\n```\n\nThe message will appear in the shell.\n\n# Fix mistakes\n\
    \nIf the code isn’t working, stay calm! Every programmer makes mistakes, and finding\
    \ these “bugs” is vital if you want to become an expert at coding. Go back and\
    \ check your code for typing errors. Did you include the brackets? Did you spell\
    \ the word “print” correctly? Fix any mistakes, then try running the code again.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_22_2.png)\n\n# EXPERT TIPS\n\n# Keyboard\
    \ shortcut\n\nA handy shortcut to run a program from the editor window is simply\
    \ to press F5 on your keyboard. This is a lot quicker than selecting “Run” and\
    \ then “Run Module”.\n\n# Add more lines\n\nGo back to the editor window and add\
    \ two more lines to your script. Now the middle line asks for your name and then\
    \ stores it in a variable. The last line uses your name to print a new greeting.\
    \ You can change it to a different greeting if you prefer -- as polite or as rude\
    \ as you like!\n\n```\n```python\nprint('Hello, World!')\nperson = input('What\
    \ is your name?')\nprint('Hello,', person)\n```\n```\n\nThis line asks for the\
    \ user’s name and stores it in a variable called “person.”\n\n```\n```text\nHello,\
    \ World!\nWhat is your name?Josh\nHello, Josh\n```\n```\n\nUser’s name\n\n# Final\
    \ task\n\nRun the code again to check it. When you type in your name and hit the\
    \ enter/return key, the shell should show a personalized message. Congratulations\
    \ on completing your first Python program! You’ve taken your first steps towards\
    \ becoming a powerful programmer."
  merge: -1
  img_proc: true
- pgno: 23
  md: "# Variables\n\nIf you want to write useful code, you’ll need to be able to\
    \ store and label pieces of information. That’s what variables do. Variables are\
    \ great for all sorts of things – from tracking your score in a game to performing\
    \ calculations and holding lists of items.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_23_0.png)\n\
    \n△ **Storage box**\nA variable is like a box with a name label. You can store\
    \ data in the box and then use the name to find the data again when you need to\
    \ use it.\n\n# How to create a variable\n\nA variable needs a name. Think of a\
    \ name that will remind you what’s inside the variable. Then decide what you want\
    \ to store in the variable. This is the variable’s value. Type the name, followed\
    \ by an equals sign, followed by the value. We call this “assigning a value” to\
    \ the variable.\n\n+   1. **Assign a value**\n+      In the shell window, type\
    \ this line of code to create the variable age and assign a value to it. Use your\
    \ own age if you want.\n+   \n+   2. **Print the value**\n+      Now type the\
    \ line of code shown on the right into the shell window. Hit the enter/return\
    \ key to see what happens.\n\n```\n```text\n>>> age = 12\n```\n```\n\nThis value\
    \ will be stored in the variable.\n\nThis is the variable’s name.\n\n```\n```text\n\
    >>> print(age)\n12\n```\n```\n\nThe value of age\n\nThe print() function prints\
    \ the value of the variable between the brackets.\n\n# EXPERT TIPS\nNaming variables\n\
    \nChoosing good names for your variables will make your program easier to understand.\
    \ For example, a variable tracking a player’s lives in a game could be called\
    \ `lives_remaining`, rather than just `lives` or `l`. Variable names can contain\
    \ letters, numbers, and underscores, but they should begin with a letter. Follow\
    \ the rules shown here and you won’t go wrong.\n\n+   **Dos and don’ts**\n+  \
    \ - Start the variable’s name with a letter.\n+   - Any letter or number can be\
