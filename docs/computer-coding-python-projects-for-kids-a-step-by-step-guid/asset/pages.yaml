  md: "# The main code\n\nThe main part of the code is a loop that gets a letter from\
    \ the player and checks if it’s in the secret word. If it is, the code uses a\
    \ function to update the clue. You’ll make that function, then create the main\
    \ loop.\n\n# Is the letter in the secret word?\n\nIf the guessed letter is in\
    \ the secret word, you must update the clue. To do this, you’ll use a function\
    \ called `update_clue()`. The function has three parameters: the letter being\
    \ guessed, the secret word, and the clue. Add this code after the `guessed_word_correctly`\
    \ variable.\n\n# How it works\n\nThe function contains a while loop that works\
    \ through the secret word one letter at a time, checking whether each letter matches\
    \ the guessed letter. The index variable keeps count of the current letter as\
    \ the program scans through the word.\n\nIf a letter matches, the program inserts\
    \ it into the clue, using `index` to find the right position in the list of question\
    \ marks.\n\n```\n```python\nguessed_word_correctly = False\n\ndef update_clue(guessed_letter,\
    \ secret_word, clue):\n    index = 0\n    while index < len(secret_word):\n  \
    \      if guessed_letter == secret_word[index]:\n            clue[index] = guessed_letter\n\
    \        index = index + 1\n```\n```\n\n`len()` returns how many letters are in\
    \ a word — in this case, five.\n\nAdd 1 to the index value.\n\n# Guess a letter\
    \ or word\n\nYour program should keep asking the user to guess a letter or the\
    \ whole word until they either get the correct answer or run out of lives. This\
    \ is what the main loop does. Add this code below the `update_clue()` function.\n\
    \nThis shows the clue and how many lives the player has left.\n\nIf the guessed\
    \ letter is in the secret word, the clue is updated.\n\nIf the guess is incorrect\
    \ (`else`), the number of lives is reduced by 1.\n\n```\n```python\nindex = index\
    \ + 1\n\nwhile lives > 0:\n    print(clue)\n    print('Lives left: ' + heart_symbol\
    \ * lives)\n    guess = input('Guess a letter or the whole word: ')\n\n    if\
    \ guess == secret_word:\n        guessed_word_correctly = True\n        break\n\
    \n    if guess in secret_word:\n        update_clue(guess, secret_word, clue)\n\
    \    else:\n        print('Incorrect. You lose a life')\n        lives = lives\
    \ - 1\n```\n```\n\nThe loop keeps running while there are lives left.\n\nThis\
    \ gets the guessed letter or word from the player.\n\nWhen the word is guessed\
    \ correctly, this line breaks the loop."
