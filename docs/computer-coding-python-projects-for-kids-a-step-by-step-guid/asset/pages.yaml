  md: "# ### 3 Create a caterpillar turtle\n\nNow create the turtle that will become\
    \ your caterpillar. Add the code shown here. It creates the turtle and sets its\
    \ colour, shape, and speed. The function caterpillar.penup() disables the turtle's\
    \ pen, allowing you to move the turtle around the screen without drawing a line\
    \ along the way.\n\n```\n~~~python\ncaterpillar = t.Turtle()\ncaterpillar.shape('square')\n\
    caterpillar.color('red')\ncaterpillar.speed(0)\ncaterpillar.penup()\ncaterpillar.hideturtle()\n\
    ~~~\n```\n\nCreate a new turtle\nfor the caterpillar.\n\nWe don't want the\nturtle\
    \ to move before\nthe game starts.\n\nThis command\nhides the turtle.\n\n# ###\
    \ 4 Create a leaf turtle\n\nBelow the code for Step 3, type these lines to set\
    \ up the second turtle, which will draw the leaves. The code uses a list of six\
    \ coordinate pairs to draw a leaf shape. Once you tell the turtle about this shape,\
    \ it can reuse the details to draw more leaves. A call to hideturtle here makes\
    \ this turtle invisible on the screen.\n\n```\n~~~python\nleaf = t.Turtle()\n\
    leaf_shape = ((0, 0), (14, 2), (18, 6), (20, 20), \\\n              (6, 18), (2,\
    \ 14))\nt.register_shape('leaf', leaf_shape)\nleaf.shape('leaf')\nleaf.color('green')\n\
    leaf.penup()\nleaf.hideturtle()\nleaf.speed(0)\n~~~\n```\n\nThis turtle will\n\
    draw the leaves.\n\nThe coordinates\nfor leaf shape\n\nUse a backslash character\n\
    if you need to split a long\nline of code over two lines.\n\nThis line tells the\
    \ turtle\nabout the leaf shape.\n\n# ### 5 Add some text\n\nNow set up two more\
    \ turtles to add text to the game. One will display a message before the action\
    \ starts, telling players to press space-bar to begin. The other will write the\
    \ score in the corner of the window. Add these lines after the leaf turtle code.\n\
    \n```\n~~~python\ngame_started = False\ntext_turtle = t.Turtle()\ntext_turtle.write('Press\
    \ SPACE to start', align='center', \\\n                  font=('Arial', 16, 'bold'))\n\
    text_turtle.hideturtle()\nscore_turtle = t.Turtle()\nscore_turtle.hideturtle()\n\
    score_turtle.speed(0)\n~~~\n```\n\nYou'll need to know later\nif the game has\
    \ started.\n\nThis line draws some\ntext on the screen.\n\nThis hides the turtle\n\
    but not the text.\n\nAdd a turtle to\nwrite the score.\n\nThe turtle needs to\
    \ stay where it\nis, so that it can update the score."
