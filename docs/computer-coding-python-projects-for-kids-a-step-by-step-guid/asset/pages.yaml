  md: '# # Draw your Screen Pet


    Let''s get started. First you need to create the window where your Screen Pet
    will live. Then you''ll write some code to draw the pet on the screen.


    # ## 1 Create a new file


    Open IDLE. Go to the File menu and select New File, then save the file as "screen_pet.py".


    # ## 2 Add the Tkinter module


    You need to import parts of Python''s Tkinter module at the start of your program.
    Type this code to bring in Tkinter and open a window where your Screen Pet will
    live.


    This line imports the parts of the Tkinter module that you''ll need in this project.


    This line starts Tkinter and opens a window.


    > > Keep still while I paint you!


    ![](img/1bd24ab186f69fb18194b4174ca15178_143_0.png)


    ```

    ```python

    from tkinter import HIDDEN, NORMAL, Tk, Canvas

    root = Tk()

    ```

    ```


    # ## 3 Make a new canvas


    In the window, make a dark blue canvas called "c", on which you''ll draw your
    pet. Add this code after the line that opens the Tkinter window. These four lines
    of new code are the start of the main part of your program.


    Any commands that start with c_ relate to the canvas.


    The canvas will be 400 pixels wide and 400 pixels high.


    The background colour will be dark blue.


    This command arranges things within the Tkinter window.


    This line starts the function that looks out for input events, such as mouse-clicks.


    ```

    ```python

    from tkinter import HIDDEN, NORMAL, Tk, Canvas

    root = Tk()

    c = Canvas(root, width=400, height=400)

    c.configure(bg=''dark blue'', highlightthickness=0)

    c.pack()

    root.mainloop()

    ```

    ```


    # ## 4 Run it


    Now try running the program. What do you notice? The code should just show a plain,
    dark-blue window. It looks a bit dull and empty at the moment - what you need
    is a pet!


    ![](img/1bd24ab186f69fb18194b4174ca15178_143_1.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_143_2.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_143_3.png)


    Don''t forget to save your work.'
