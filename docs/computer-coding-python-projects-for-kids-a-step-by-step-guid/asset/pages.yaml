- pgno: 114
  md: "# REMEMBER\n\n# List positions\n\nWhen Python numbers the items in a list,\
    \ it starts from 0. So the first item in your `current_event` list, “Halloween”,\
    \ is in position 0, while the second item, “31/10/2017”, is in position 1. That’s\
    \ why the code turns `current_event[1]` into a date.\n\n> Sorry! You are not on\
    \ the list.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_114_0.png)\n\n# 12 Using\
    \ datetime\n\nThe event Halloween is stored in `current_event` as a list containing\
    \ two items: “Halloween” and “31/10/2017”. Use the `datetime` module to convert\
    \ the second item in the list (in position 1) from a string into a form that Python\
    \ can understand as a date. Add these lines of code at the bottom of the function.\n\
    \n```\n```python\ncurrent_event = line.split(',')\nevent_date = datetime.strptime(current_event[1],\
    \ '%d/%m/%y').date()\ncurrent_event[1] = event_date\n```\n```\n\nTurns the second\
    \ item in the list from a string into a date.\n\nSet the second item in the list\
    \ to be the date of the event.\n\n# 13 Add the event to the list\n\nNow the `current_event`\
    \ list holds two things: the name of the event (as a string) and the date of the\
    \ event. Add `current_event` to the list of events. Here’s the whole code for\
    \ the `get_events()` function.\n\n```\n```python\ndef get_events():\n    list_events\
    \ = []\n    with open('events.txt') as file:\n        for line in file:\n    \
    \        line = line.strip('\\n')\n            current_event = line.split(',')\n\
    \            event_date = datetime.strptime(current_event[1], '%d/%m/%y').date()\n\
    \            current_event[1] = event_date\n            list_events.append(current_event)\n\
    \    return list_events\n```\n```\n\nAfter this line is run, the program loops\
    \ back to read the next line from the file.\n\nAfter all the lines have been read,\
    \ the function hands over the complete list of events to the program."
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Setting the countdown\n\nIn the next stage of building Countdown Calendar\
    \ you’ll create a function to count the number of days between today and your\
    \ important events. You’ll also write the code to display the events on the Tkinter\
    \ canvas.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_115_0.png)\n\n> 20 days\
    \ to Christmas!\n\nThe function is given two dates.\n\n**14 Count the days**\n\
    Create a function to count the number of days between two dates. The date time\
    \ module makes this easy, as it can add dates together or subtract one from another.\
    \ Type the code shown here below your `get_events()` function. It will store the\
    \ number of days as a string in the variable `time_between`.\n\n```\n```python\n\
    def days_between_dates(date1, date2):\n    time_between = str(date1 - date2)\n\
    ```\n```\n\nThis variable stores the result as a string.\n\nThe dates are subtracted\
    \ to give the number of days between them.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_115_1.png)\n\
    \n> Oops! I’ve snipped the string!\n\n**15 Split the string**\nIf Halloween is\
    \ 27 days away, the string stored in `time_between` would look like this: `'27\
    \ days, 0:00:00'` (the zeros refer to hours, minutes and seconds). Only the number\
    \ at the beginning of the string is important, so you can use the `split()` command\
    \ again to get to the part you need. Type the code highlighted below after the\
    \ code in Step 14. It turns the string into a list of three items: `'27'`, `'days'`,\
    \ `'0:00:00'`. The list is stored in `number_of_days`.\n\n```\n```python\ndef\
    \ days_between_dates(date1, date2):\n    time_between = str(date1 - date2)\n \
    \   number_of_days = time_between.split(' ')\n```\n```\n\nThis time the string\
    \ is split at each blank space.\n\n**16 Return the number of days**\nTo finish\
    \ off this function, you just need to return the value stored in position 0 of\
    \ the list. In the case of Halloween, that’s 27. Add this line of code to the\
    \ end of the function.\n\n```\n```python\ndef days_between_dates(date1, date2):\n\
    \    time_between = str(date1 - date2)\n    number_of_days = time_between.split('\
    \ ')\n    return number_of_days[0]\n```\n```\n\nThe number of days between the\
    \ dates is held at position 0 in the list."
  merge: -1
  img_proc: true
