  md: '# Installing Python


    All the projects in this book use Python 3, so make sure you download the correct
    version from the website. Follow the instructions that match your computer.


    # Python on Windows


    Before you install Python 3 on a Windows PC, find out if it uses the 32-bit or
    64-bit version of Windows. Click “Start,” right-click “Computer,” and left-click
    “Properties”. Then choose “System” if the option appears.


    # LINGO — IDLE


    IDLE (short for Integrated Development Environment) is a free app that you get
    when you install Python. Designed for beginners, IDLE includes a basic text editor
    that allows you to write and edit Python code.


    +   1. **Go to the python website**\n   Type the address below into your web browser
    to go to the Python website. Then click on “Downloads” to open the download page.\n   -
    https://www.python.org/


    +   2. **Download Python**\n   Click on the latest version of Python for Windows,
    beginning with the number 3. The installer file will download automatically. Of
    the different installer options, select “executable installer”.\n   - Python 3.6.0a4
    · 2016-08-15\n     - Windows x86 executable installer\n     - Windows x86-64 executable
    installer


    +   If you have a 32-bit version of Windows, use this installer. If you have a
    64-bit version of Windows, use this installer.


    +   3. **Run the installer**\n   Double-click the installer file to install Python.
    Choose “install for all users” and click “next” at each prompt, without changing
    the default settings.


    ![](img/1bd24ab186f69fb18194b4174ca15178_15_0.png)


    +   4. **Open IDLE**\n   When the installation is finished, check that it was
    successful by opening the IDLE program. Go to the “Start” menu, choose “All Apps”,
    then select “IDLE”. A window like the one below should open up.


    ![](img/1bd24ab186f69fb18194b4174ca15178_15_1.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_15_2.png)


    ```

