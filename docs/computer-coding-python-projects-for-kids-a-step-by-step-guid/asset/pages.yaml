- pgno: 89
  md: '# # Starry Night


    Fill your screen with beautiful stars! This project uses Python''s turtle module
    to draw star shapes. Random numbers scatter the stars over the screen and vary
    their colour, size, and shape.


    # ## What happens


    First a night-time sky is drawn, then a single star appears in the sky. As the
    program continues, the sky begins to fill with more and more stars in a wide range
    of different styles. The longer you leave the program running, the more fantastic
    and colourful the sky becomes.


    # ### EXPERT TIPS


    # ## Making colours


    Pictures and graphics on a computer screen are made up of tiny dots called pixels,
    which can give out red, green, and blue light. By mixing these colours together
    you can make any colour imaginable. In this project, the colour of each star is
    stored as three numbers. The numbers represent the amounts of red, green, and
    blue light that are combined to give the final colour.


    ![](img/1bd24ab186f69fb18194b4174ca15178_89_0.png)


    A new Turtle Graphics window opens when you run the program.


    The turtle draws the stars one by one.


    Python Turtle Graphics


    ![](img/1bd24ab186f69fb18194b4174ca15178_89_1.png)'
  merge: -1
  img_proc: true
