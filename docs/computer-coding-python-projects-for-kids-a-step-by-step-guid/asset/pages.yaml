  md: '# 5 Make some variables


    Under the code for Step 3, add the variables that the program needs, and create
    a dictionary to store the buttons in. For each attempt at a match, you need to
    remember whether it’s the first or second symbol in the match. You also need to
    keep track of the first button press so you can compare it with the second button
    press.


    ```

    root.resizable(width=False, height=False)\n\nbuttons = {}\nfirst = True\npreviousX
    = 0\npreviousY = 0

    ```


    This is the dictionary.\n\nThis variable is used to check if the symbol is the
    first in the match.\n\nThese two variables keep track of the last button pressed.


    # 6 Add the symbols


    Next type the code below to add the symbols the game will use. As in the Nine
    Lives project, the program uses Unicode characters. There are 12 pairs, making
    24 in total. Add this code under the variables added in Step 5.


    ![](img/1bd24ab186f69fb18194b4174ca15178_182_0.png)


    ```

    previousY = 0\n\nbutton_symbols = {}\nsymbols = [u''\\u2702'', u''\\u2702'', u''\\u2705'',
    u''\\u2705'', u''\\u2708'', u''\\u2708'',\n           u''\\u2709'', u''\\u2709'',
    u''\\u270A'', u''\\u270A'', u''\\u270B'', u''\\u270B'',\n           u''\\u270C'',
    u''\\u270C'', u''\\u270F'', u''\\u270F'', u''\\u2712'', u''\\u2712'',\n           u''\\u2714'',
    u''\\u2714'', u''\\u2716'', u''\\u2716'', u''\\u2728'', u''\\u2728'']

    ```


    The symbol for each button is stored in this dictionary.\n\nThis list stores the
    12 pairs of symbols that will be used in the game.


    # 7 Shuffle the symbols


    You don’t want the symbols to appear in the same place every time. After several
    games, the player would remember their positions and would be able to match them
    all at first attempt, every time. To prevent this, you need to shuffle the symbols
    before each game starts. Add this line after the list of symbols.


    ```

