- pgno: 18
  md: "# The editor window\n\nThe shell can’t save your code, so when you close the\
    \ shell window the code you typed is lost forever. That’s why you should use IDLE’s\
    \ editor window when you work on a project. This window lets you save your code.\
    \ It also has built-in tools to help you write your programs and to trouble-shoot\
    \ any errors.\n\n# The editor window\n\nTo open the editor window in IDLE, click\
    \ on the File menu at the top and choose New File. An empty editor window will\
    \ then appear. You’ll use the editor window to write and run programs for the\
    \ projects in this book.\n\nYou type the code in here. This program prints a list\
    \ that tells you which numbers are even and which ones are odd.\n\nThe name of\
    \ the file is shown here.\n\nYou can run your programs from this menu.\n\nThe\
    \ menu bar for the editor window is different to the one for the shell.\n\n```\n\
    ```python\nfor counter in range(10):\n    if ((counter % 2) == 0):\n        print(counter)\n\
    \        print('is even')\n    else:\n        print(counter)\n        print('is\
    \ odd')\n```\n```\n\nAnything you tell Python to print gets displayed in the shell\
    \ window.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_18_0.png)\n\n# Colours in\
    \ the code\n\nIDLE automatically colours the text to highlight different parts\
    \ of the code. The colours make it easier to understand the code, and they’re\
    \ useful when you’re trying to spot mistakes.\n\n| Symbol | Meaning |\n|---|---|\n\
    | Symbols and names | Most code text is coloured black. |\n| Keywords | Certain\
    \ words, such as “if” and “else”, are special words that Python uses. They are\
    \ called keywords and are shown in orange. |\n| Output | Any text produced when\
    \ a program runs is blue. |\n| Built-in commands | Python commands, such as “print”,\
    \ are shown in purple. |\n| Errors | Python uses red to alert you to any errors\
    \ in your code. |\n| Text in quotes | Text in quote marks is green. A green bracket\
    \ around text shows you’re missing a quote mark. |"
