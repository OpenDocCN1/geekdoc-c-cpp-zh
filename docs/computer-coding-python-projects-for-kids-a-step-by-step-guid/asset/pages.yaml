  md: '# # Modules


    Modules are bundles of ready-made code that help you deal with common coding challenges.
    Modules provide the less exciting bits of code, letting you focus on the fun stuff.
    Also, because modules are used by a lot of people, they are likely to work well
    and be free of bugs.


