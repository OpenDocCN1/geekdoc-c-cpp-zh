- pgno: 157
  md: '# Caterpillar


    If all this coding has worked up your appetite, you''re not alone – the star of
    this project is a hungry caterpillar. Using Python''s turtle module, you''ll find
    out how to animate game characters and control them on screen with the keyboard.


    ![](img/1bd24ab186f69fb18194b4174ca15178_157_0.png)


    > Maybe it''s time you turned over a new leaf!


    # What happens


    You use the four arrow keys to steer a caterpillar around the screen and make
    it "eat" leaves. Each leaf gives you a point, but it also makes the caterpillar
    bigger and faster, making the game harder. Keep the caterpillar inside the game
    window, or it''s game over!


    ![](img/1bd24ab186f69fb18194b4174ca15178_157_1.png)


    Python Turtle Graphics


    20


    Your score is displayed in the top-right corner of the game window.


    The leaf disappears when eaten, and a new leaf then appears elsewhere.


    To start the game, the player has to click on the screen first and then press
    the space-bar.


    # ◁ Increasing difficulty


    The more leaves the caterpillar eats, the harder the game becomes. As the caterpillar
    gets longer and faster, your reactions have to speed up too, otherwise your caterpillar
    will zoom off the screen.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Writing SQL Queries


    A query is a question you ask the database. SQL (Structured Query Language) is
    used to retrieve data from databases. The most common command is SELECT.


    +   - SELECT: retrieves data from one or more tables

    +   - FROM: specifies the table(s) to query

    +   - WHERE: filters records based on conditions

    +   - ORDER BY: sorts the result set


    ```

    ```sql

    SELECT first_name, last_name

    FROM employees

    WHERE department = ''Engineering''

    ORDER BY last_name;

    ```

    ```


    Note: Always use semicolons at the end of SQL statements. Use single quotes for
    string literals. Be mindful of NULL values in WHERE clauses.'
