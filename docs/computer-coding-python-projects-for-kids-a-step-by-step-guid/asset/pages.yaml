    +   2. **Add the modules**

    +      Import the string and random modules from the Python library. Type these
    two lines at the top of your file, so you can use the modules later.

    +   3. **Welcome the user**

    +      First create a message to welcome the user to the program.


    ```

    import random

    import string

    ```


    The string module lets you do useful things with strings, like splitting them
    apart or changing the way they appear.


    This line shows a message to welcome the user.


    ```

    import random

    import string


    print(''Welcome to Password Picker!'')

    ```'
