- pgno: 170
  md: "# 6 Create the circles\n\nTo draw a circle, use the Canvas widget's create_oval()\
    \ function. Type the following code below the shapes list. It creates four circles\
    \ of the same size — one each in black, red, green, and blue — and adds them to\
    \ the shapes list.\n\nSet the state to HIDDEN so that the shape doesn't appear\
    \ on the screen when the program starts.\nIt has to wait its turn.\n\nThese are\
    \ the (x0, y0) coordinates (see box).\n\nThese are the (x1, y1) coordinates (see\
    \ box).\n\n![](img/1bd24ab186f69fb18194b4174ca15178_170_0.png)\n\nDon't forget\
    \ to save your work.\n\n```\n    shapes = []\n\n    circle = c.create_oval(35,\
    \ 20, 365, 350, outline='black', fill='black', state=HIDDEN)\n    shapes.append(circle)\n\
    \    circle = c.create_oval(35, 20, 365, 350, outline='red', fill='red', state=HIDDEN)\n\
    \    shapes.append(circle)\n    circle = c.create_oval(35, 20, 365, 350, outline='green',\
    \ fill='green', state=HIDDEN)\n    shapes.append(circle)\n    circle = c.create_oval(35,\
    \ 20, 365, 350, outline='blue', fill='blue', state=HIDDEN)\n    shapes.append(circle)\n\
    \    c.pack()\n```\n\nThis line puts the shapes onto the canvas. Without it, none\
    \ of the shapes would be displayed.\n\nThe circle's colour is determined by outline\
    \ and fill.\n\n# EXPERT TIPS\n\n# Create ovals\n\nThe create_oval() function draws\
    \ an oval as if it's inside an invisible box. The four numbers within the brackets\
    \ decide the position of the circles on the screen. They are the coordinates of\
    \ two opposite corners of the box. The greater the difference between the two\
    \ pairs of numbers, the bigger the circle.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_170_1.png)\n\
    \nThe first pair of numbers (x0, y0) shows the position of the box's top-left\
    \ corner.\n\n(x0, y0)\n\n(x1, y1) shows the position of the bottom-right corner.\n\
    \n(x1, y1)\n\n# 7 Show the circles\n\nTry running the program. Do you see any\
    \ shapes? Remember that you set their states to HIDDEN. Change one shape's state\
    \ to NORMAL and run the code again. You should now be able to see that shape on\
    \ the screen. Be careful not to set more than one shape to NORMAL. If you do,\
    \ they'll all show at once, drawn one on top of the other.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_170_2.png)\n\
    \n> I tried blowing bubbles, but I've blown circles!"
