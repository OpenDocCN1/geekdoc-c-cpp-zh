  md: "# Add “fake” letters\n\nAnother way to encrypt messages is to insert random\
    \ letters between each pair of letters. So the word “secret” might become “stegciraelta”\
    \ or “shevcarieste”. Just as in the “Reverse after swapping” hack, you’ll need\
    \ two different functions — one to encrypt and one to decrypt.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_139_0.png)\n\
    \n+   1. **Add another module**\n+   \n+   Import the `choice()` function from\
    \ the random module. This will let you choose the fake letters from a list of\
    \ letters. Type this line near the top of your file, under the command to import\
    \ the Tkinter functions.\n\n```\nfrom tkinter import messagebox, simpledialog,\
    \ Tk\nfrom random import choice\n```\n\n+   2. **Encrypt**\n+   \n+   To encrypt\
    \ the message, you need to set up a list of fake letters to insert between the\
    \ real ones. The code shown below will loop through the message, adding one real\
    \ letter and one fake letter to the `encrypted_list` each time round.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_139_1.png)\n\
    \n```\ndef encrypt(message):\n    encrypted_list = []\n    fake_letters = ['a',\
    \ 'b', 'c', 'd', 'e', 'f', 'g', 'i', 'r', 's', 't', 'u', 'v']\n    for counter\
    \ in range(0, len(message)):\n        encrypted_list.append(message[counter])\n\
    \        encrypted_list.append(choice(fake_letters))\n    new_message = ''.join(encrypted_list)\n\
    \    return new_message\n```\n\nAdd fake letters between real letters.\n\nAdd\
    \ a letter from the message to `encrypted_list`.\n\nAdd a fake letter to `encrypted_list`.\n\
    \nJoin the letters in `encrypted_list` into a string."
  merge: -1
  img_proc: true
- pgno: 140
  md: "# Decrypt\n\nDecrypting the message is quite easy. In the encrypted version\
    \ of your message, all the letters in even positions are letters from the original\
    \ message. So you can use the `get_even_letters()` function to get them.\n\n>\
    \ Decrypting letters is easy.\n\n```\ndef decrypt(message):\n    even_letters\
    \ = get_even_letters(message)\n    new_message = ''.join(even_letters)\n    return\
    \ new_message\n```\n\nGet the original message's letters.\n\nJoin the letters\
    \ in `even_letters` into a string.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_140_0.png)\n\
    \n# Use the new functions\n\nNow you need to update the infinite loop section\
    \ of your program to use the new `encrypt()` and `decrypt()` functions, instead\
    \ of `swap_letters()`. To do this, make these changes to your code.\n\n> I must\
    \ update my infinite loop!\n\n```\nwhile True:\n    task = get_task()\n    if\
    \ task == 'encrypt':\n        message = get_message()\n        encrypted = encrypt(message)\n\
    \        messagebox.showinfo('Ciphertext of the secret message is:', encrypted)\n\
    \    elif task == 'decrypt':\n        message = get_message()\n        decrypted\
    \ = decrypt(message)\n        messagebox.showinfo('Plaintext of the secret message\
    \ is:', decrypted)\n    else:\n        break\nroot.mainloop()\n```\n\nThe new\
    \ `encrypt()` function replaces `swap_letters()`.\n\nThe new `decrypt()` function\
    \ replaces `swap_letters()`.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_140_1.png)\n\
    \n# Multi-encryption\n\nTo make things even more complex, you can modify your\
    \ code so that it combines all the different hacks and tweaks from this section.\
    \ For example, it could add fake letters, swap the letters, and then reverse them!\n\
    \n> My secret codes are safer now!\n\n![](img/1bd24ab186f69fb18194b4174ca15178_140_2.png)"
