- pgno: 83
  md: "# # How it works\n\nIn this project, you'll use the turtle module and a clever\
    \ looping technique to layer circles on top of each other in a spiral pattern.\
    \ Every time a circle is drawn, the program slightly increases the parameters\
    \ of the circle-drawing code. Each new circle is different from the last one drawn,\
    \ making the pattern more interesting.\n\n# ### Kaleido-spiral flowchart\n\nThe\
    \ program sets some values that stay the same throughout, such as the turtle's\
    \ speed, and then starts looping. The loop chooses a new pen colour, draws a circle,\
    \ turns and moves the turtle, and then repeats itself. It stops when you quit\
    \ the program.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_83_0.png)\n\n# ## EXPERT\
    \ TIPS\n\n# ## Cycling\n\nTo make the patterns colourful, this project uses a\
    \ function called cycle() from the itertools module. The cycle() function allows\
    \ you to cycle through a list of different colours over and over again. This makes\
    \ it easy to use a different pen colour for each circle.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_83_1.png)\n\
    \n# # Get drawing!\n\nThe first thing you'll draw on the screen is a simple circle.\
    \ Next you'll repeat this circle, but with a slight change. Finally, you'll tweak\
    \ the code to make the pattern more colourful and interesting.\n\n+   1. **Create\
    \ a new file**\n+   \n+      Open IDLE and create a new file.\n+      Save it\
    \ as \"kaleido-spiral.py\".\n\n+   2. **Import turtle**\n+   \n+      First you\
    \ need to import the turtle module. This will be the main module you use. Type\
    \ this line at the top of the program.\n\n```\nimport turtle\n```\n\nLoads the\
    \ entire turtle module"
  merge: -1
  img_proc: true
- pgno: 84
  md: "# 3 Set up the turtle\n\nThe code shown here calls functions in the `turtle`\
    \ module to set the background colour, as well as the turtle’s speed and size.\n\
    \n```\n```python\nimport turtle\n\nturtle.bgcolor('black')\nturtle.speed('fast')\n\
    turtle.pensize(4)\n```\n```\n\nBackground colour\n\nThe turtle’s speed\n\nThe\
    \ thickness of the turtle’s trail\n\n# 4 Choose the pen colour, draw a circle\n\
    \nNext set the colour of the turtle’s trail and test the code by drawing a circle.\
    \ Add these two lines to the end of your code and run the program.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_84_0.png)\n\
    \n```\n```python\nimport turtle\n\nturtle.bgcolor('black')\nturtle.speed('fast')\n\
    turtle.pensize(4)\n\nturtle.pencolor('red')\nturtle.circle(30)\n```\n```\n\nPen\
    \ colour\n\nThis tells the turtle to draw a circle.\n\n# 5 Draw more circles\n\
    \nYou should now see a single circle, but we need lots more. Here comes the clever\
    \ bit. Put the commands to draw a red circle inside a function, but add a line\
    \ so that the function calls itself. This trick, known as recursion, makes the\
    \ function repeat. Remember, functions need to be defined before they’re used,\
    \ so you’ll need to move the function above the line where it’s called.\n\n```\n\
    ```python\nimport turtle\n\ndef draw_circle(size):\n    turtle.pencolor('red')\n\
    \    turtle.circle(size)\n    draw_circle(size)\n\nturtle.bgcolor('black')\nturtle.speed('fast')\n\
    turtle.pensize(4)\ndraw_circle(30)\n```\n```\n\nThis line uses the size parameter.\n\
    \nThe function calls itself, which makes it repeat endlessly.\n\nThis line calls\
    \ the function for the first time.\n\n> “Hello, is that the function?”\n\n![](img/1bd24ab186f69fb18194b4174ca15178_84_1.png)"
  merge: -1
