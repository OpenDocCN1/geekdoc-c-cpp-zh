- pgno: 85
  md: "# EXPERT TIPS\n\n# Recursion\n\nWhen a function calls itself, this is known\
    \ as recursion. It's another way of making a loop in your program. In most uses\
    \ of recursion, the parameters of the function change each time the function is\
    \ called. In Kaleido-spiral, for example, the size, angle, and position of the\
    \ circle change whenever the function calls itself.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_85_0.png)\n\
    \n# 6. Test your code\n\nRun the program. You would see the turtle drawing the\
    \ same circle over and over again. Don't worry - you'll fix that in the next step.\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_85_1.png)\n\n# 7. Change the colour,\
    \ increase the size\n\nTo create more exciting patterns, make these changes to\
    \ the code to increase the size of the circle and change its colour. This code\
    \ uses the cycle() function, which takes a list of values as its parameter and\
    \ returns a special type of list that you can cycle through endlessly using the\
    \ next() function. Run the code again.\n\n```\n    import turtle\n    from itertools\
    \ import cycle\n\n    colors = cycle(['red', 'orange', 'yellow', 'green', 'blue',\
    \ 'purple'])\n\n    def draw_circle(size):\n        turtle.pencolor(next(colors))\n\
