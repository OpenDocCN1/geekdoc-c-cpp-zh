    \ 度（面向相反方向）之间的随机角度，然后再次移动。如果它离边界太远，就会向后移动。\n\n画笔可以使用的不同颜色存储在一个列表中。\n\n如果需要将长代码行拆成两行，请使用反斜杠字符。\n\
