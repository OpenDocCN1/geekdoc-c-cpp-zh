    # Password Picker flowchart


    The program randomly selects each of the password’s four parts, puts them together,
    and displays the password in the shell window. If you want another password, it
    repeats those steps again. If you don’t, the program ends.


    +   - Start

    +   - Choose a random adjective

    +   - Choose a random noun

    +   - Choose a random number between 0 and 100

    +   - Choose a random punctuation character

    +   - Create the secure password

    +   - Display the secure password

    +   - Want another password?

    +     - Y: Repeat the password-generation steps

    +     - N: End


    # How it works


    This project will show you how to use Python’s random module. The program uses
    random choices from groups of adjectives, nouns, numbers, and punctuation characters
    to assemble each password. You’ll soon be making crazy, hard-to-forget passwords,
