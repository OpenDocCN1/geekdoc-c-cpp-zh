    \n- **3. 创建一个矩形函数**\n\n现在创建用于绘制搭建机器人所用方块的函数。这个函数有三个参数：水平边的长度、垂直边的长度和颜色。你将使用一个循环，每次运行时绘制一条水平边和一条垂直边，并让它运行两次。把这个矩形函数放在第\
    \ 2 步添加的代码下面。\n\n```python\ndef rectangle(horizontal, vertical, color):\n    t.pendown()\n\
    \    t.pensize(1)\n    t.color(color)\n    t.begin_fill()\n    for counter in\
    \ range(1, 3):\n        t.forward(horizontal)\n        t.right(90)\n        t.forward(vertical)\n\
    \        t.right(90)\n    t.end_fill()\n    t.penup()\n```\n\n落下海龟的画笔以开始绘制。\n\n\
    使用 `range(1, 3)` 让循环运行两次。\n\n抬起海龟的画笔以停止绘制。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_73_1.png)\n\
    \n这个代码块绘制矩形。\n\n海龟按照这里显示的顺序绘制各条边。\n\n### 专家提示\n\n**海龟模式**\n\n你将使用海龟的标准模式。这意味着海龟一开始面向屏幕右侧。如果你把朝向（heading，方向的另一种说法）设为\
    \ 0，它就会面向右侧。将朝向设为 90 会让它指向屏幕顶部，180 指向左侧，270 则让它指向屏幕底部。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_73_2.png)\n\
    \n海龟通常看起来像一个箭头。这一行把它变成海龟形状。\n\n```python\nt.shape('turtle')\nt.setheading(0)\n\
    t.forward(80)\n```\n\n"
