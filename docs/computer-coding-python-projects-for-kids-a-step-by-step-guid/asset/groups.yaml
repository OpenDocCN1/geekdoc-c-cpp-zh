  mdcn: "\n## 变异彩虹\n\n### 会发生什么\n\n程序会要求你选择海龟绘制的线条长度和粗细。然后，海龟会在屏幕上快速移动，一边移动一边绘制彩色线条，直到你停止程序。它形成的图案类型会因线条的长度和粗细而变化。\n\
