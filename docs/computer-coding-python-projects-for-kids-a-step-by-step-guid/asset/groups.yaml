    \n**DANIEL McCAFFERTY** 拥有思克莱德大学计算机科学学位。他曾在从银行到广播等行业的各种规模公司担任软件工程师。Daniel 与妻子和女儿住在格拉斯哥，在教导年轻人编程之余，他喜欢骑自行车和与家人共度时光。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_4_5.png)\n\n**DR JON WOODCOCK** 在牛津大学学习物理，并在伦敦大学学习计算天体物理学。他自八岁起就是一名热衷编程的编程者，曾为从单芯片微控制器到世界级超级计算机的各种计算机编写程序。他是\
    \ DK 畅销书 *《儿童计算机编程游戏》* 的作者，并撰写或参与编写了另外六本 DK 编程书。\n\n## Python 中的 5 个游戏\n\n- 158\
    \ 毛毛虫\n- 168 拍牌游戏\n- 180 配对游戏\n- 190 接蛋游戏\n\n## 6 参考资料\n\n- 202 项目参考\n- 220 词汇表\n\
    - 222 索引\n- 224 致谢\n\n![](img/1bd24ab186f69fb18194b4174ca15178_6_0.png)\n\n##\
    \ 前言\n\n我们生活在一个数字世界，计算机几乎是我们所做一切的一部分。不久前，计算机还是主要放在书桌上的笨重、嘈杂的机器，但现在它们已是隐藏在手机、汽车、电视甚至手表里的微小、安静的设备。我们用它们工作、玩游戏、看电影、购物，并与朋友和家人保持联系。\n\
    \n如今的计算机使用起来非常简单，任何人都能操作。但知道如何编写让它们运行的代码的人并没有那么多。成为编程者可以让你掀开引擎盖，看看计算机真正如何工作。稍加练习，你就能构建自己的应用、编写自己的游戏，或者只是摆弄别人的程序，并定制自己的巧妙作品。\n\
    \n编程不仅是一种令人上瘾的爱好，也是一项在世界各地需求量巨大的技能。学会编程，无论你的人生走向哪里，无论你对科学、艺术、音乐、体育还是商业感兴趣，都会让你受益匪浅。\n\
    \n如今，你可以学习数百种编程语言，从像 Scratch™ 这样简单的拖放式语言，到像 JavaScript® 这样的网页编程语言。本书基于 Python®，这是世界上使用最广泛的编程语言之一。Python\
    \ 同样受学生和专业人士欢迎，易于上手，同时又强大而多用途。无论你是初学者，还是从 Scratch 这样的简单语言进阶而来，它都是一门很适合学习的语言。\n\
    \n学习编程的最好方式就是投入进去，本书正是这样设计的。只需按照编号步骤操作，你很快就能构建应用、游戏、图形和谜题。如果学得开心，学习编程会更容易，所以我们尽量让这些项目尽可能有趣。\n\
    \n如果你是编程新手，请从头开始，逐步学习。如果你不能理解每一个细节，不用担心——没关系。你构建的项目越多，你就会变得越好。如果你的程序第一次运行不成功，也不要担心。即使是专业人士也必须调试他们的作品。\n\
    \n完成每个项目后，书中都有关于如何调整和改编它的提示。欢迎尝试你自己的改造。只需一点想象力和技巧，编程者能取得的成就就没有极限。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_8_0.png)\n\
    \nCAROL VORDERMAN\n\n![](img/1bd24ab186f69fb18194b4174ca15178_8_1.png)\n\n## 从\
    \ Python 开始\n\n![](img/1bd24ab186f69fb18194b4174ca15178_10_0.png)\n\n## 任何人都能编程\n\
    \n要成为编程者，你只需学习一些基本规则和命令，然后就可以开始编写适合自己技能和兴趣的程序。例如，如果你喜欢科学，你可以制作一个根据实验结果绘制图表的应用。或者你可以运用自己的艺术技能，为自己的电子游戏设计一个外星世界。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_12_0.png)\n\n### 逻辑思考\n\n编程者需要逻辑清晰、细致谨慎，才能写出好的代码。如果指令不准确，或者步骤顺序错误，程序就无法正常运行。要逐步思考，确保事情按逻辑顺序发生——毕竟，你不会先穿长裤再穿内裤，对吧！\n\
    \n### 注重细节\n\n如果你擅长找不同谜题，你很可能成为一名出色的编程者。编程中的一项重要技能是发现代码中的错误。这些错误被称为 bug，即使很小的\
    \ bug 也可能造成大问题。眼尖的编程者能找出拼写错误，以及指令逻辑或顺序上的问题。调试程序可能很棘手，但从错误中学习是提升编程能力的好方法。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_12_1.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_12_2.png)\n\n### 术语\n\n### Bug\n\n\
    Bug 是代码中的错误，会使程序出现意外行为。它们之所以叫这个名字，是因为早期计算机有时会因昆虫卡在电路里而出故障！\n\n![](img/1bd24ab186f69fb18194b4174ca15178_12_3.png)\n\
    \n### 开始编程\n\n编程听起来可能令人生畏，但学会如何编程其实很容易。秘诀就是投入进去。本书旨在通过引导你完成简单项目来教你如何编程。只需按照编号步骤操作，你很快就能创建游戏、应用和数字艺术。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_12_4.png)\n\n"
