    左前臂


    ### 9 绘制脖子


    该给你的机器人加上脖子了。将以下绘制脖子的命令输入到你在第 8 步添加的代码下方。


    ```python

    # neck

    t.goto(-50, 120)

    rectangle(15, 20, ''grey'')

    ```


    ### 10 绘制头部


    哎呀——你画了一个没有头的机器人！为了给你可怜的机器人一个头，将以下命令输入到你在第 9 步添加的代码下方。


    ```python

    # head

    t.goto(-85, 170)

    rectangle(80, 50, ''red'')

    ```


    别忘了保存你的工作。


    ![](img/1bd24ab186f69fb18194b4174ca15178_76_0.png)


    ### 11 绘制眼睛


    让我们给机器人加上眼睛，这样它就能看到自己要往哪里走。为此，你要绘制一个大的白色矩形，里面有两个较小的正方形（作为瞳孔）。你不需要编写新函数来绘制正方形，因为正方形就是所有边等长的矩形。将以下命令插入到你在第
    10 步添加的代码下方。


    ```python

    # eyes

    t.goto(-60, 160)

    rectangle(30, 10, ''white'')

    t.goto(-55, 155)

    rectangle(5, 5, ''black'')

    t.goto(-40, 155)

    rectangle(5, 5, ''black'')

    ```


    绘制眼睛的白色部分。


    绘制左瞳孔。


    绘制右瞳孔。


    ![](img/1bd24ab186f69fb18194b4174ca15178_77_0.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_77_1.png)


    > 我有眼睛，但还是总是撞到东西！


    ![](img/1bd24ab186f69fb18194b4174ca15178_77_2.png)


    ### 12 绘制嘴巴


    现在给机器人加一张嘴。将以下命令输入到你在第 11 步添加的代码下方。


    ```python

    # mouth

    t.goto(-65, 135)

    rectangle(40, 5, ''black'')

    ```


    ### 13 隐藏海龟


    最后，隐藏海龟，这样它坐在机器人脸上就不会显得奇怪。将这一行输入到你在第 12 步添加的代码之后。运行程序，看看整个机器人被构建出来。


    ```python

    t.hideturtle()

    ```


    这会使海龟不可见。


    > 我需要休假！


    > 我喜欢看这些机器人被建造出来！


    ![](img/1bd24ab186f69fb18194b4174ca15178_77_3.png)


    ## 技巧与调整


    现在你的项目已经运行起来了，这里有一些修改代码的想法，以便你可以自定义自己构建的机器人。


    ### 更改颜色


    你创建的机器人已经相当色彩丰富，但绝对还有改进空间。你可以更改代码，构建一个与你房间或你最喜欢的足球队球衣颜色相匹配的机器人，或者创建一个完全多彩的机器人！右侧是一些海龟能识别的颜色。


    - 草坪绿（Lawn Green）

    - 贝壳色（Seashell）

    - 蓝色（Blue）

    - 紫色（Purple）

    - 浅蓝色（Light Blue）

    - 黄色（Yellow）

    - 金菊色（Goldenrod）

    - 亮粉色（Hot Pink）

    - 蓟色（Thistle）


    ![](img/1bd24ab186f69fb18194b4174ca15178_78_0.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_78_1.png)


    ### 更改面部


    你可以通过重新排列机器人的五官来改变它脸上的表情。要给它画出歪斜的眼睛和嘴巴，请使用右侧的代码。


    ![](img/1bd24ab186f69fb18194b4174ca15178_78_2.png)


    ```python

    # eyes

    t.goto(-60, 160)

    rectangle(30, 10, ''white'')

    t.goto(-60, 160)

    rectangle(5, 5, ''black'')

    t.goto(-45, 155)

    rectangle(5, 5, ''black'')


    # mouth

    t.goto(-65, 135)

    t.right(5)

    rectangle(40, 5, ''black'')

    ```


    这一行将左瞳孔向下移动。


    这一行移动机器人的右瞳孔，使它看起来像在翻白眼。


    海龟稍微向右转，这使嘴巴倾斜。


    ### 2 添加手臂


    接下来，将你原先在注释行 `# arms` 和注释行 `# neck` 之间的代码替换为这里显示的代码。它使用 arm 函数绘制三条手臂。


    ```python

    # arms

    t.goto(-90, 85)

    t.setheading(180)

    arm(''light blue'')


    t.goto(-90, 20)

    t.setheading(180)

    arm(''purple'')


    t.goto(10, 85)

    t.setheading(0)

    arm(''goldenrod'')

    ```


    让海龟指向机器人的右侧（窗口的左边缘）。


    使用 arm 函数绘制一条浅蓝色手臂。


    让海龟指向机器人的左侧（窗口的右边缘）。


    ### 移动手臂


    既然你可以一次绘制整条手臂，就可以改变它的位置，让机器人看起来像在挠头，或者可能在跳高地舞！为此，使用 `setheading()` 函数改变海龟开始绘制手臂时面向的方向。


    ```python

    # arms

    t.goto(-90, 80)

    t.setheading(135)

    arm(''hot pink'')


    t.goto(10, 80)

    t.setheading(315)

    arm(''hot pink'')

    ```


    让海龟指向窗口的左上角。


    使用 arm 函数在右侧绘制一条手臂。


    让海龟指向窗口的右下角。


    使用 arm 函数在左侧绘制一条手臂。


    ## 专家提示


    ### 反复试验


    当你设计机器人或为现有机器人添加新功能时，可能需要反复试验才能把东西调整到完全符合你的想法。如果你在 `t.speed(''slowest'')` 这一行之后添加
    `print(t.window_width())` 和 `print(t.window_height())` 这两行，Python 会在 shell 中显示海龟窗口的高度和宽度。然后，在方格纸上标出同样大小的网格，帮助你算出每个身体部位的坐标。


    ![](img/1bd24ab186f69fb18194b4174ca15178_80_0.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_80_1.png)


    > “能请你跳下一支舞吗？”


    ![](img/1bd24ab186f69fb18194b4174ca15178_82_0.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_82_1.png)


    > 它们都是杰作！


    ![](img/1bd24ab186f69fb18194b4174ca15178_82_2.png)


    海龟从屏幕中心开始绘制。


    ## 可调整的程序


    你让 Kaleido-spiral 运行的时间越长，屏幕上的图案就越复杂。通过更改绘制圆形的函数的参数，你可以创造出更令人难以置信的图案。


