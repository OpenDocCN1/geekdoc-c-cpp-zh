    # Glossary


    **ASCII** — “American Standard Code for Information Interchange” — a code used
    for storing text characters as binary code.


    **Boolean expression** — A statement that is either True or False, leading to
    two possible outcomes.


    **branch** — A point in a program where two different options are available to
    choose from.


    **bug** — An error in a program’s code that makes it behave in an unexpected way.


    **call** — To use a function in a program.


    **comment** — A text note added by a programmer to a program that makes the code
    easier to understand and is ignored by the program when it runs.


    **condition** — A “True or False” statement used to make a decision in a program.
    See also *Boolean expression*.


    **constant** — A fixed value that can’t be changed.


    **coordinates** — A pair of numbers that pinpoint an exact location. Usually written
    as (x, y).


    **data** — Information, such as text, symbols, and numerical values.


    **dictionary** — A collection of data items stored in pairs, such as countries
    and their capital cities.


    **debug** — To look for and correct errors in a program.


    **encryption** — A way of encoding data so that only certain people can read or
    access it.


    **event** — Something a computer program can react to, such as a key being pressed
    or the mouse being clicked.


    **file** — A collection of data stored with a name.


    **flag variable** — A variable that can have two states, such as True and False.


    **float** — A number with a decimal point in it.


    **flowchart** — A diagram that shows a program as a sequence of steps and decisions.


    **function** — Code that carries out a specific task, working like a program within
    a program. Also called a procedure, subprogram, or subroutine.


    **global variable** — A variable that works throughout every part of a program.
    See also *local variable*.


    **graphics** — Visual elements on a screen that are not text, such as pictures,
    icons, and symbols.


    **GUI** — The GUI, or graphical user interface, is the name for the buttons and
    windows that make up the part of the program you can see and interact with.


    **hack** — An ingenious change to code that makes it do something new or simplifies
    it. (Also, accessing a computer without permission.)


    **hacker** — A person who breaks into a computer system. “White hat” hackers work
    for computer security companies and look for problems in order to fix them. “Black
    hat” hackers break into computer systems to cause harm or to make profit from
    them.


    **indent** — When a block of code is placed further to the right than the previous
    block. An indent is usually four spaces. Every line in a particular block of code
    must be indented by the same amount.


    **index number** — A number given to an item in a list. In Python, the index number
    of the first item will be 0, the second item 1, and so on.


    **input** — Data that is entered into a computer. Keyboards, mice, and microphones
    can be used to input data.


    **integer** — A whole number. An integer does not contain a decimal point and
    is not written as a fraction.'
