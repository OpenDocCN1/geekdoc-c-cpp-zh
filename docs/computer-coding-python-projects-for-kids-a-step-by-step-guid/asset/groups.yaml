  mdcn: "\n\n## 循环往复\n\n计算机非常擅长毫无怨言地执行枯燥的任务。程序员做不到，但他们很擅长让计算机替他们做重复性的工作——通过使用循环。循环会一遍又一遍地运行同一段代码。循环有几种不同的类型。\n\
    \n### for 循环\n\n当你知道自己希望一段代码运行多少次时，可以使用 for 循环。在下面的例子中，艾玛编写了一个程序来制作她房门上的标牌。它会打印“艾玛的房间——请勿入内！！！”十次。你可以在\
    \ shell 中亲自试试她的代码。（输入代码并按回车后，按退格键删除缩进，然后再按一次回车。）\n\n```python\n>>> for counter\
    \ in range(1, 11):\n...     print('Emma\\'s Room - Keep Out!!!')\n```\n\n- 这是循环变量。\n\
    - 循环运行 10 次。\n- 循环体中的命令缩进 4 个空格。\n- 被重复执行的那一行称为循环体。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_31_0.png)\n\
    \n#### 循环变量\n\n循环变量用来记录到目前为止我们循环了多少次。第一次循环时，它等于 `range(1, 11)` 所指定列表中的第一个数字；第二次循环时，它等于列表中的第二个数字，依此类推。当我们用完了列表中的所有数字后，循环就停止了。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_31_1.png)\n\n![](img/1bd24ab186f69fb18194b4174ca15178_31_2.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_31_3.png)\n\n#### 专家提示：range\n\n在 Python\
    \ 代码中，单词“range”后面跟着括号中的两个数字，表示“从第一个数字开始，一直到比第二个数字小一的全部数字”。因此 `range(1, 4)` 表示数字\
    \ 1、2 和 3——但不包括 4。在艾玛的“请勿入内”程序中，`range(1, 11)` 表示数字 1、2、3、4、5、6、7、8、9 和 10。\n\n\
    #### 专家提示：转义字符（\\\\）\n\n艾玛房间（Emma's Room）中的反斜杠告诉 Python 忽略那个撇号，这样它就不会被视为结束整个字符串的引号。像这样使用的反斜杠称为转义字符。它告诉\
    \ Python 在判断这一行是否合理或包含错误时，不要计算下一个字符。\n\n> “我走啦！”\n\n> “我能看见未来，而未来完全是循环往复的！”\n\n\
    ### while 循环\n\n如果你不知道想重复代码多少次，那该怎么办？你需要一个水晶球，或者某种预知未来的方法吗？不，没关系！你可以使用 while 循环。\n\
    \n#### 循环条件\n\nwhile 循环没有设置为某个值范围的循环变量，而是有一个循环条件。这是一个布尔表达式，其值要么是 True，要么是 False。这有点像迪斯科舞厅门口的保安问你有没有门票。如果有（True），就直接去舞池；如果没有（False），保安就不会让你进去。在编程中，如果循环条件不为\
    \ True，你就进不了循环！\n\n> 今天这里有迪斯科！\n\n> 你进不来——你的循环条件不是 True！\n\n#### 平衡表演\n\n在下面的例子中，艾哈迈德编写了一个程序，用来记录他的杂技河马表演团中有多少只河马叠在一起搭成了高塔。请通读这段代码，看看你是否能弄明白它是如何工作的。\n\
    \n- 这个变量存储问题的答案：“再加一只河马吗？”\n- 这个变量存储河马的数量。\n- 循环条件\n- 这一行显示一条消息，展示叠在一起保持平衡的河马总数。\n\
    - 艾哈迈德的回答成为 `answer` 的新值。\n\n```python\n>>> hippos = 0\n>>> answer = 'y'\n>>>\
    \ while answer == 'y':\n...     hippos = hippos + 1\n...     print(str(hippos)\
    \ + ' balancing hippos!')\n...     answer = input('Add another hippo? (y/n)')\n\
    ```\n\n- 将叠放的河马数量加一。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_32_0.png)\n\n\
    ![](img/1bd24ab186f69fb18194b4174ca15178_32_1.png)\n\n![](img/1bd24ab186f69fb18194b4174ca15178_32_2.png)\n\
    \n#### 工作原理\n\n艾哈迈德程序中的循环条件是 `answer == 'y'`。这表示用户想要再添加一只河马。在循环体中，我们将叠放河马的数量加一，然后询问用户是否还想再加一只。如果他们输入“y”（表示“是”）来回答，循环条件即为\
    \ True，于是我们再次循环。如果他们输入“n”（表示“否”），循环条件即为 False，程序就会离开循环。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_33_0.png)\n\
    \n### 无限循环\n\n有时你可能希望 `while` 循环在程序运行的整个过程中一直持续下去。这种循环称为无限循环。很多视频游戏程序都会使用一种称为主循环的无限循环。\n\
    \n- 没有 False 选项可以跳出循环。\n\n```python\n>>> while True:\n...     print('This is an\
    \ infinite loop!')\n```\n\n#### 专家提示：停止循环\n\n如果你不想要无限循环，那么务必确保 `while` 循环的循环体做了某些可能使循环条件变为\
    \ False 的操作。但别担心——如果你不小心编写了一个无限循环，可以通过按住 Ctrl（控制）键的同时按 C 键来跳出循环。你可能需要按好几次 Ctrl-C\
    \ 才能退出循环。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_33_1.png)\n\n#### 进入无限\n\
    \n你只需将循环条件设置为一个常量值：True，就能创建一个无限循环。因为这个值永远不会改变，所以循环永远不会退出。请在 shell 中试试这个 `while`\
    \ 循环。它没有 False 选项，因此循环会不停地打印“This is an infinite loop!”，直到你退出程序。\n\n#### 逃离无限\n\
    \n你可以故意使用无限循环来获取用户输入。这个烦人的程序会询问用户是否觉得无聊。只要用户输入“n”，它就会一直问下去。如果用户受够了并输入“y”，它就会告诉用户很无礼，然后使用\
    \ `break` 命令离开循环！\n\n- True 条件表示用户还没觉得无聊（“n”）。\n\n```python\n>>> while True:\n\
    ...     answer = input('Are you bored yet? (y/n)')\n...     if answer == 'y':\n\
    ...         print('How rude!')\n...         break\n```\n\n- False 条件（“y”）会触发 break\
    \ 命令。\n\n### 循环中的循环\n\n循环体内还可以包含另一个循环吗？可以！这称为嵌套循环。这就像俄罗斯套娃，每个娃娃都套在一个更大的娃娃里面。在嵌套循环中，内层循环运行在外层循环内部。\n\
    \n> 我喜欢俄罗斯套娃——但它们总是那么自以为是！\n\n外层循环的循环变量是 `hooray_counter`。\n\n#### 专家提示——缩进循环体\n\
    \n循环体中的代码应缩进四个空格。如果没有缩进，Python 会显示错误信息，代码将无法运行。对于嵌套循环（一个循环在另一个循环内部），内层循环的循环体必须额外缩进四个空格。Python\
    \ 会自动缩进循环中的新行，但你应始终检查每一行是否缩进了正确的空格数。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_34_0.png)\n\
    \n#### 循环套循环\n\n在下面的例子中，艾玛把她的“请勿入内”程序改成了“三呼万岁”程序，它会打印三次“Hip, Hip, Hooray!”。由于每次欢呼都包含两次“Hip”，她使用了一个嵌套循环来打印它。\n\
    \n```python\nfor hooray_counter in range(1, 4):\n    for hip_counter in range(1,\
    \ 3):\n        print('Hip')\n    print('Hooray!')\n```\n\n- 外层循环的循环体缩进 4 个空格。\n\
    - 内层循环的循环变量是 `hip_counter`。\n- 内层循环的循环体再缩进 4 个空格。\n\n```text\nhooray_counter =\
    \ 1\n\nHip\nHip\nHooray!\n\nhooray_counter = 2\n\nHip\nHip\nHooray!\n\nhooray_counter\
    \ = 3\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhip_counter\
    \ = 1\nhip_counter = 2\n\nhip_counter = 1\nhip_counter = 2\n```\n\n#### 工作原理\n\
    \n整个内层 for 循环都位于外层 for 循环的循环体内。每执行一次外层循环，就必须执行两次内层循环。这意味着外层循环的循环体总共运行三次，而内层循环的循环体运行六次。\n\
    \n"
