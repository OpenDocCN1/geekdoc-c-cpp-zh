    ![](img/1bd24ab186f69fb18194b4174ca15178_4_0.png)


    **CAROL VORDERMAN MBE** is one of Britain''s best-loved TV presenters and is renowned
    for her mathematical skills. She has hosted numerous TV shows on science and technology,
    from *Tomorrow''s World* to *How 2*, and was co-host of Channel 4''s *Countdown*
    for 26 years. A Cambridge University engineering graduate, she has a passion for
    communicating science and technology and has a keen interest in coding.


    ![](img/1bd24ab186f69fb18194b4174ca15178_4_1.png)


    **CRAIG STEELE** is a specialist in Computing Science education. He is Project
    Manager for CoderDojo Scotland, which runs free coding clubs for young people.
    Craig has previously worked for the Raspberry Pi Foundation, Glasgow Science Centre,
    and the BBC micro:bit project. Craig''s first computer was a ZX Spectrum.


    ![](img/1bd24ab186f69fb18194b4174ca15178_4_2.png)


    **DR CLAIRE QUIGLEY** studied Computing Science at Glasgow University, where she
    obtained a BSc and PhD. She has worked in the Computer Laboratory at Cambridge
    University and Glasgow Science Centre, and is currently working on a project to
    develop a music and technology resource for primary schools in Edinburgh. She
    is a mentor at CoderDojo Scotland.


    ![](img/1bd24ab186f69fb18194b4174ca15178_4_3.png)


    **DR MARTIN GOODFELLOW** has a PhD in computer science and experience of teaching
    coding up to university level. He has developed educational content and workshops
    for CoderDojo Scotland, Skills Development Scotland, Glasgow Life, and Highlands
    and Islands Enterprises, and has consulted on digital content for the BBC. He
    is currently the Scottish Ambassador for National Coding Week.


    ![](img/1bd24ab186f69fb18194b4174ca15178_4_4.png)


    **DANIEL McCAFFERTY** holds a degree in Computer Science from the University of
    Strathclyde. He has worked as a software engineer for companies big and small
    in industries from banking to broadcasting. Daniel lives in Glasgow with his wife
    and daughter and when not teaching young people to code, he enjoys cycling and
    spending time with family.


    ![](img/1bd24ab186f69fb18194b4174ca15178_4_5.png)


    **DR JON WOODCOCK** studied physics at Oxford University and computational astrophysics
    at the University of London. An avid coder since the age of eight, he has programmed
    all kinds of computers from single-chip microcontrollers to world-class supercomputers.
    He is author of DK''s best-selling *Computer Coding Games for Kids* and has written
    or contributed to six other DK coding books.'
