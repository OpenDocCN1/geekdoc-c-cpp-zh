    # ## How it works


    Once the background is created, the eggs gradually move down the screen, which
    creates the illusion that they are falling. Using loops, the code continually
    checks the coordinates of the eggs to see if any have hit the bottom or been caught
    in the catcher. When an egg is caught or dropped, it is deleted and the program
    adjusts the score or the number of remaining lives.


    ![](img/1bd24ab186f69fb18194b4174ca15178_191_0.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_191_1.png)


    △ **Egg Catcher flowchart**


    There are three different loops in this game: one to create new eggs, another
    to check if the catcher has caught an egg, and a third to move the eggs and check
    for eggs touching the bottom. Each of the three loops repeats at a different speed.'
