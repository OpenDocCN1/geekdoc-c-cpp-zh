  mdcn: "\n## 秘密信息\n\n运用密码学的技巧与朋友交换消息——改变消息中的文字，让不知道你秘密方法的人无法理解它！\n\n### 会发生什么\n\n\
    程序会询问你是想创建一条秘密消息，还是揭示一条秘密消息的内容。然后它会要求你输入消息。如果你选择创建秘密消息，你的消息会变成看起来完全像乱码的东西。但如果你选择揭示消息，无意义的乱码就会变回你能读懂的文本！\n\
    \n### 密码学\n\n“cryptography”这个词来自古希腊语中表示“隐藏”和“书写”的词语。近 4000 年来，人们一直使用这种技术来发送秘密消息。以下是密码学中使用的一些特殊术语：\n\
    \n- **密码算法**——一组改变消息以隐藏其含义的指令。\n- **加密**——隐藏秘密消息。\n- **解密**——揭示秘密消息。\n- **密文**——加密之后的消息。\n\
    - **明文**——加密之前的消息。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_129_0.png)\n\n\
    **分享代码**\n\n如果你把自己的 Python 代码分享给朋友，你们就能互相传递秘密消息了。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_129_1.png)\n\
    \n> “我们把这条消息放进去打乱吧。”\n\n> “我一个字都看不懂……”\n\n### 工作原理\n\n程序会重新排列消息中字母的顺序，使其无法被理解。它通过判断哪些字母处于偶数或奇数位置来做到这一点。然后它交换消息中每一对字母的位置，从最前面的两个字母开始，接着是接下来的两个，依此类推。程序还会通过把字母换回它们最初的位置，让加密后的消息重新变得可读。\n\
    \n> 我把所有字母都打乱了。\n\n在 Python 中（它以一种奇怪的方式计数，从 0 开始），单词中的第一个字母处于偶数位置。\n\n| s | e\
    \ | c | r | e | t |\n|---|---|---|---|---|---|\n| e | s | r | c | e | t |\n\n\
    | e | s | r | c | e | t |\n|---|---|---|---|---|---|\n| s | e | c | r | e | t\
    \ |\n\n### 加密\n\n当你对自己的消息运行代码时，程序会交换每一对字母，从而打乱其含义。\n\n### 解密\n\n当你或朋友解密消息时，程序会把字母换回原来的位置。\n\
    \n### 消息解密器\n\n> 我会把这条消息放进解密器里还原！\n\n> 现在完全说得通了。多棒的机器啊！\n\n输入消息\n\n输出消息\n\n##\
    \ ◁ 秘密信息流程图\n\n程序使用一个无限循环，询问用户是想加密还是解密。用户的选择决定程序接下来走哪条路径。对话框从用户那里获取文本，而信息框向他们显示加密和解密后的消息。如果用户输入除“encrypt”或“decrypt”以外的任何内容，程序就会结束。\n\
    \n开始\n\n用户选择要做什么\n\n加密、解密，还是其他？\n\n加密\n\n获取要加密的秘密消息\n\n加密消息\n\n显示加密后的消息\n\n解密\n\
    \n获取要解密的秘密消息\n\n解密消息\n\n显示解密后的消息\n\n用户输入除“encrypt”或“decrypt”以外的任何内容\n\n收到！\n\n\
