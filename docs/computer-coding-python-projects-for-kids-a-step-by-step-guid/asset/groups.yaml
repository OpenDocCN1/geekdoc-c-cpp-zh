    \ 'Patrick']\n```\n\n列表中的条目必须用逗号分隔。\n\n这个列表存储在变量 planets_players 中。\n\n### 3 从列表中获取条目\n\
    \n一旦你的数据存入列表，处理起来就非常方便。要从列表中取出一个条目，先输入列表名，然后在方括号内加上该条目的位置。注意：Python 是从 0 而不是 1\
    \ 开始对列表条目计数的。现在试着从你的队伍列表中取出不同玩家的名字。第一个玩家位于位置 0，而最后一个玩家位于位置 5。\n\n```python\n>>>\
    \ rockets_players[0]\n'Rory'\n>>> planets_players[5]\n'Patrick'\n```\n\n这行代码从位置\
    \ 0 获取列表中的第一个条目。\n\n这行代码从位置 5 获取列表中的最后一个条目。\n\n按回车键即可取出该条目。\n\n## 菠萝与斑马\n\n让我们在\
    \ shell 中试一个例子。我们可以使用变量 `pineapples` 和 `zebras` 来表示有 5 个菠萝和 2 只斑马。请在 shell 中输入这些行。\n\
    \n```python\n>>> pineapples = 5\n>>> zebras = 2\n```\n\n这个变量存储菠萝的数量。\n\n这个变量存储斑马的数量。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_28_0.png)\n\n### 进行比较\n\n现在试着输入以下代码行来比较这两个变量的值。每输完一行，按回车键，Python\
    \ 会告诉你这些语句是 True 还是 False。\n\n菠萝的数量大于斑马的数量。\n\n```python\n>>> pineapples > zebras\n\
    True\n```\n\n```python\n>>> zebras < pineapples\nTrue\n```\n\n斑马的数量小于菠萝的数量。\n\n\
    菠萝的数量和斑马的数量不相等。\n\n```python\n>>> pineapples != zebras\nTrue\n```\n\n**术语**\n\n\
    ### 布尔表达式\n\n使用逻辑运算符对变量和值进行判断的语句，总会给出一个布尔值，例如 True 或 False。因此，这些语句被称为布尔表达式。我们所有关于菠萝和斑马的判断语句都是布尔表达式。\n\
    \n变量\n\n逻辑运算符\n\n```python\n>>> pineapples != zebras\nTrue\n```\n\n布尔值\n\n变量\n\
    \n### 多重比较\n\n你可以使用 `and` 和 `or` 组合多个比较。如果使用 `and`，比较的两个部分都必须正确，语句才是 True。如果使用\
    \ `or`，只需要有一部分正确即可。\n\n```python\n>>> (pineapples == 3) and (zebras == 2)\nFalse\n\
    ```\n\n其中一部分（pineapples == 3）不正确，因此语句为 False。\n\n```python\n>>> (pineapples ==\
    \ 3) or (zebras == 2)\nTrue\n```\n\n有一部分正确（zebras == 2），因此语句为 True。\n\n## 乘坐过山车\n\
    \n主题公园的告示牌上写着：必须年满 8 岁且身高超过 1.4 米才能乘坐过山车。米娅 10 岁，身高 1.5 米。让我们用 shell 检查她是否能乘坐。输入以下代码行，为米娅的年龄和身高创建变量并赋予正确的值。将乘坐过山车的规则写成布尔表达式，然后按回车键。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_29_0.png)\n\n这两行给变量赋值。\n\n```python\n\
    >>> age = 10\n>>> height = 1.5\n>>> (age > 8) and (height > 1.4)\nTrue\n```\n\n\
    这是一个布尔表达式，表示“年龄大于 8 岁且身高超过 1.4 米”。\n\n米娅可以乘坐过山车！\n\n### 分支\n\n计算机经常需要决定运行程序中的哪些部分。这是因为大多数程序设计为在不同情况下执行不同的操作。程序的路径如同一棵路径树，分叉出旁路，每条通向不同的地方。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_29_1.png)\n\n**术语**\n\n### 条件\n\n条件是一种布尔表达式（一种\
    \ True 或 False 的比较），可帮助计算机在到达代码分支时决定走哪条路径。\n\n#### 上学还是去公园？\n\n想象一下，你必须根据“今天是工作日吗？”这个问题的答案来决定每天走哪条路。如果是工作日，就走去学校的路；如果不是，就走去公园的路。在\
    \ Python 中，程序的不同路径通向不同的代码块。一个代码块可以是一条语句或多条语句，它们都缩进四个空格。计算机使用一种叫作条件的测试来判断接下来应运行哪些代码块。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_29_2.png)\n\n#### 单分支\n\n最简单的分支命令是\
    \ `if` 语句。它只有一个分支，当条件为 True 时，计算机就会走这个分支。这个程序询问用户外面是否天黑。如果答案是“是”，程序就假装计算机要睡觉了！如果外面不黑，`is_dark\
    \ == 'y'` 为 False，因此不会显示 “Goodnight!” 消息。\n\n这一行要求用户回答 “y”（是）或 “n”（否）。\n\n```python\n\
    is_dark = input('Is it dark outside? y/n')\n\nif is_dark == 'y':\n    print('Goodnight!\
    \ Zzzzzzzzzzzzz....')\n```\n\n条件\n\n如果条件为真，则走此分支。\n\n该代码会在 shell 窗口中显示这条消息。\n\n\
    #### 双分支\n\n你是否希望程序在条件为 True 时做一件事，在条件为 False 时做另一件事？如果是这样，你需要一个具有两个分支的命令，称为 `if-else`\
    \ 语句。这个程序询问用户是否有触手。如果回答“是”，它就判断用户一定是一只章鱼！如果回答“否”，它就判断用户是人类。每次判断都会打印不同的消息。\n\n\
    这一行要求用户输入。\n\n条件\n\n```python\ntentacles = input('Do you have tentacles? (y/n)')\n\
    if tentacles == 'y':\n    print('I never knew octopuses could type!')\nelse:\n\
    \    print('Greetings, human!')\n```\n\n如果条件为 True，则运行此代码块。\n\n如果条件为 False，则运行此代码块。\n\
    \n#### 多分支\n\n当可能的路径多于两条时，`elif` 语句（“else-if”的缩写）就派上用场了。这个程序要求用户输入天气预报：“rain”“snow”或“sun”。然后它会从三个分支和天气条件中选择一个。\n\
    \n```python\nweather = input('What is the forecast for today? (rain/snow/sun)')\n\
    \nif weather == 'rain':\n    print('Remember your umbrella!')\nelif weather ==\
    \ 'snow':\n    print('Remember your woolly gloves!')\nelse:\n    print('Remember\
    \ your sunglasses!')\n```\n\n第一个条件\n\n如果第一个条件为 True，则运行此代码块。\n\n第二个条件\n\n如果第二个条件为\
