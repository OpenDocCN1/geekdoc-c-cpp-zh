    \n这会让海龟变成绿色。\n\n这将背景设置为黑色。\n\n这会设置海龟的速度。\n\n这会将画笔宽度设置为用户的选择。\n\n### 让海龟动起来！\n\n\
    现在你可以编写让海龟动起来的函数了。最后一段代码将是一个 `while` 循环，让海龟开始绘制变异彩虹！\n\n### 10 变异线条\n\n将这段代码添加到你在第\
