    \n```python\ndef display_score(current_score):\n    score_turtle.clear()\n   \
    \ score_turtle.penup()\n    x = (t.window_width() / 2) - 50\n    y = (t.window_height()\
    \ / 2) - 50\n    score_turtle.setpos(x, y)\n    score_turtle.write(str(current_score),\
    \ align='right', \\\n                       font=('Arial', 40, 'bold'))\n```\n\
    \n距右侧 50 像素\n\n距顶部 50 像素\n\n### 14 新叶子\n\n当吃到一片叶子后，会调用 `place_leaf()` 函数将叶子移动到新的随机位置。它会在\
