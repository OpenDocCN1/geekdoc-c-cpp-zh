    # # Modules


    Modules are bundles of ready-made code that help you deal with common coding challenges.
    Modules provide the less exciting bits of code, letting you focus on the fun stuff.
    Also, because modules are used by a lot of people, they are likely to work well
    and be free of bugs.


    # ## Built-in modules


    There are lots of useful modules included with Python. This collection of modules
    is known as the Standard Library. Here are some interesting modules from the library
    that you might want to experiment with.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_0.png)


    # ### datetime


    This module lets you work with dates. You can get today''s date, or work out how
    long it is until a special day.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_1.png)


    # ### statistics


    Use statistics to calculate averages or find the most common value in a list of
    numbers. It''s handy if you need to work out an average score in a game.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_2.png)


    # ### random


    You used this module to make random selections in Password Picker. It''s great
    for adding an element of chance to a game or program.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_3.png)


    # ### webbrowser


    You can control the computer''s web browser with this module, allowing you to
    open web pages directly from your code.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_4.png)


    # ### socket


    The socket module allows programs to communicate across networks and the Internet.
    It could be used to create an online game.


    ![](img/1bd24ab186f69fb18194b4174ca15178_57_5.png)'
  - '[PAGE 58]


    # # Using a module


    To use a module in your code, you have to tell Python that you would like to include
    it. You instruct Python which modules to include using import statements. There
    are a few different ways that you can do this, depending on what you need from
    the module.


    ![](img/1bd24ab186f69fb18194b4174ca15178_58_0.png)


    # ### ▷ import ...


    Typing the keyword import allows you to use all the contents of a module. However,
    you need to put the module''s name before any function you use. This code imports
    all the webbrowser module and uses its open() function to open the Python website
    in the computer''s browser.


    ```

    ```python

    >>> import webbrowser

    >>> webbrowser.open(''https://docs.python.org/3/library/'')

    ```

    ```


    This line imports the whole webbrowser module.


    The name of the module comes before the function.


    # ### ▷ from ... import ...


    If you only want to use a particular part of a module, you can import just that
    part by adding the from keyword. Now you can just use the function name on its
    own. This code imports the random module''s choice() function. The function picks
    a random item from any list you give it.


    Only the choice function is imported from the random module.


    ```

    ```python

    >>> from random import choice

    >>> direction = choice([''N'', ''S'', ''E'', ''W''])

    >>> print(direction)

    W

    ```

    ```


    No module name is needed.


    The code prints a random direction.


    # ### ▷ from ... import ... as ...


    Sometimes you may want to change the name of an imported module or function, perhaps
    because you''ve already used that name or maybe it isn''t clear enough. To do
    this, use the as keyword followed by the new name. In the example shown here,
    the time() function, which we''ve renamed time_now(), gives us the current time.
    The time given is the exact number of seconds since 00:00 on 1 January 1970 -
    a date used by most computers as the start of their clock.


    This line imports and renames the time() function.


    ```

    ```python

    >>> from time import time as time_now

    >>> now = time_now()

    >>> print(now)

    1478092571.003539

    ```

    ```


    This variable uses the function''s new name.


    The number of seconds since 00:00 on 1 January 1970


    > > You''re exactly

    > > 1478092571.003539

    > > seconds late!


    ![](img/1bd24ab186f69fb18194b4174ca15178_58_1.png)'
