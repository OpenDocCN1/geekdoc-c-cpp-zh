    # Installing Python


    All the projects in this book use Python 3, so make sure you download the correct
    version from the website. Follow the instructions that match your computer.


    # Python on Windows


    Before you install Python 3 on a Windows PC, find out if it uses the 32-bit or
    64-bit version of Windows. Click “Start,” right-click “Computer,” and left-click
    “Properties”. Then choose “System” if the option appears.


    # LINGO — IDLE


    IDLE (short for Integrated Development Environment) is a free app that you get
    when you install Python. Designed for beginners, IDLE includes a basic text editor
    that allows you to write and edit Python code.


    +   1. **Go to the python website**\n   Type the address below into your web browser
    to go to the Python website. Then click on “Downloads” to open the download page.\n   -
    https://www.python.org/


