    \n这些行告诉程序这些变量是全局变量。\n\n这些行显示符号。\n\n如果是第一轮，代码会通过存储 x 和 y 坐标来记住这次按钮按下。\n\n第二轮。这一行包含一项检查，防止玩家通过连续两次按下同一个按钮来作弊！\n\
    \n如果符号不匹配……\n\n如果符号匹配……\n\n等待 0.5 秒，让玩家有时间看清符号，然后将它们隐藏。\n\n禁用这对匹配的按钮，这样玩家就不能再次按下它们。\n\
    \n这一行让函数为下一次尝试的第一次按钮按下做好准备。\n\n### 工作原理\n\n这个函数通过将按钮的文本标签改为我们随机分配给它的 Unicode 字符来显示按钮的符号。我们使用\
    \ `update_idletasks()` 告诉 Tkinter 立即显示这个符号。如果是第一轮，我们只需将按钮的坐标存储在变量中。如果是第二轮，我们需要检查玩家是否试图通过连续两次按下同一个按钮来作弊。如果玩家没有这样做，我们就检查符号是否匹配。如果符号不匹配，我们通过将文本设置为空字符串来隐藏它们；如果匹配，我们让它们保持显示，但禁用按钮。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_185_0.png)\n\n> 我们对配对可是很认真的！\n\n##\
    \ 改造与优化\n\n你可以通过多种方式改编这个游戏。你可以显示完成游戏所花费的移动次数，这样玩家就可以尝试打破自己的分数，或挑战朋友。你还可以添加更多符号，让游戏更难。\n\
    \n### 显示移动次数\n\n目前，玩家无法知道自己表现得多好，或者是否比朋友做得更好。我们怎样才能让游戏更有竞争性呢？让我们添加一个变量，用来统计玩家完成游戏需要多少轮。然后玩家们就可以竞争，看谁获得最低分。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_186_0.png)\n\n- 1. **添加一个新模块**\n\n\
    \  你需要导入 Tkinter 的 messagebox 组件，以便在游戏结束时显示移动次数。在导入行中，将 `messagebox` 这个词添加到 `DISABLED`\
    \ 之后。\n\n```python\nfrom tkinter import Tk, Button, DISABLED, messagebox\n```\n\
    \n- 2. **创建新变量**\n\n  你需要为这个改造创建两个额外变量。一个变量将记录玩家进行的移动次数，另一个变量将记住他们已找到多少对。将两者的起始值都设为\
    \ 0。将这些行放在变量 `previousY` 下面。\n\n```python\npreviousY = 0\nmoves = 0\npairs = 0\n\
    ```\n\n玩家还没有进行任何移动，也没有找到任何配对，所以值为 0。\n\n- 3. **将它们声明为全局变量**\n\n  moves 和 pairs\
    \ 变量是全局变量，并且它们需要由 `show_symbol()` 函数修改。将这两行放在函数顶部附近，让 `show_symbol()` 知道这一点。\n\
    \n```python\ndef show_symbol(x, y):\n    global first\n    global previousX, previousY\n\
    \    global moves\n    global pairs\n```\n\n- 4. **统计移动次数**\n\n  一次移动是两次按钮按下（一次配对尝试）。因此，你只需要在第一次或第二次按钮按下调用\
    \ `show_symbol()` 函数时，将 `moves` 变量加 1——而不是两次都加。让我们在第一次按钮按下时进行。将 `show_symbol()`\
    \ 函数改成这样。\n\n```python\nif first:\n    previousX = x\n    previousY = y\n    first\
    \ = False\n    moves = moves + 1\n```\n\n- 5. **显示消息**\n\n  现在将以下代码添加到 `show_symbol()`\
    \ 函数底部附近。它将跟踪匹配的配对，并在游戏结束时显示一个消息框，告诉玩家他们用了多少次移动。当玩家点击消息框的“确定”按钮时，代码会调用 `close_window()`\
    \ 函数，我们接下来会添加它。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_187_0.png)\n\n```python\n\
    buttons[x, y]['state'] = DISABLED\npairs = pairs + 1\nif pairs == len(buttons)/2:\n\
    \    messagebox.showinfo('Matching', 'Number of moves: ' +\n                 \
    \       str(moves), command=close_window)\n```\n\n将找到的配对数量加 1。\n\n这一行显示一个消息框，显示移动次数。\n\
    \n如果所有配对都已找到，就运行这一行下面的代码。\n\n**工作原理**\n\n共有 12 对符号，所以你本可以直接在这个改造中写 `pairs == 12`。不过，你的代码比这更聪明。它使用\
    \ `pairs == len(buttons)/2` 来计算配对数量。这样，你就可以向游戏中添加更多按钮，而无需更新这段代码。\n\n- 6. **关闭窗口**\n\
    \n  最后，你需要创建一个 `close_window()` 函数，使程序在玩家点击“移动次数”消息框上的“确定”按钮时退出游戏。将这段代码添加到导入模块的那一行下面。\n\
    \n```python\ndef close_window(self):\n    root.destroy()\n```\n\n这条命令会关闭窗口。\n\n\
    ### 添加更多按钮\n\n让我们通过向游戏中添加更多按钮和符号，来真正挑战玩家的记忆力。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_188_0.png)\n\
    \n我觉得它可以再加几个按钮！\n\n**1 额外符号**\n\n首先，你需要向符号列表中添加更多配对。将下面这一行加入代码。\n\n| 符号 | Unicode\
    \ | 符号 | Unicode | 符号 | Unicode |\n|---|---|---|---|---|---|\n| ✳ | U+2733 | ✴\
    \ | U+2734 | ❄ | U+2744 |\n\n```python\nsymbols = [u'\\u2702', u'\\u2702', u'\\\
    u2705', u'\\u2705', u'\\u2708', u'\\u2708',\n           u'\\u2709', u'\\u2709',\
    \ u'\\u270A', u'\\u270A', u'\\u270B', u'\\u270B',\n           u'\\u270C', u'\\\
    u270C', u'\\u270F', u'\\u270F', u'\\u2712', u'\\u2712',\n           u'\\u2714',\
    \ u'\\u2714', u'\\u2716', u'\\u2716', u'\\u2728', u'\\u2728',\n           u'\\\
    u2733', u'\\u2733', u'\\u2734', u'\\u2734', u'\\u2744', u'\\u2744']\n```\n\n将这三对新符号添加到列表末尾。\n\
    \n**2 额外按钮**\n\n现在添加额外一行按钮。\n要做到这一点，你只需要将嵌套循环中的 y 范围从 4 改为 5，如右图所示。\n\n```python\n\
