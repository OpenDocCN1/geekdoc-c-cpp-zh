    \n## 趣味应用\n\n![](img/1bd24ab186f69fb18194b4174ca15178_108_0.png)\n\n## 工作原理\n\n\
    该程序通过从文本文件中读取信息来获知重要事件——这称为“文件输入”。文本文件包含每个事件的名称和日期。代码使用 Python 的 `datetime` 模块计算从今天到每个事件的天数。它会在由\
    \ Python 的 Tkinter 模块创建的窗口中显示结果。\n\n### 使用 Tkinter\n\nTkinter 模块是一组工具，Python 程序员用它来显示图形并获取用户输入。Tkinter\
    \ 可以在单独的窗口中显示结果，而不是在 shell 中显示输出；你可以自行设计和设置该窗口的样式。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_110_0.png)\n\
    \n### 术语\n\n**图形用户界面**\n\nGUI（图形用户界面）是程序中你可以与之交互的可见部分，例如智能手机上的图标和菜单系统。Python 的\
    \ Tkinter 模块允许你使用所谓的控件（widgets）来构建 GUI——控件是创建弹出窗口、按钮、滑块、菜单等的现成代码包。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_110_1.png)\n\
    \n智能手机 GUI 使用图标来显示 WiFi 信号的强弱以及电池电量的多少。\n\n## 倒计时日历流程图\n\n在这个项目中，重要事件列表作为文本文件与代码分开创建。程序首先从该文件中读取所有事件。一旦所有天数都已计算并显示，程序就会结束。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_110_2.png)\n\n## 创建并读取文本文件\n\n倒计时日历的所有信息都必须存储在文本文件中。你可以使用\
    \ IDLE 创建它。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_111_0.png)\n\n### 创建新文件\n\
    \n打开一个新的 IDLE 文件，然后输入几个对你来说重要的即将发生的事件。将每个事件放在单独的一行，并在事件与其日期之间输入一个逗号。确保逗号和事件日期之间没有空格。\n\
    \n`events.txt` 的示例内容：\n\n```text\nHalloween,31/10/17\nSpanish Test,01/12/17\n\
    School Trip,20/02/18\nMy Birthday,11/01/18\n```\n\n日期请按 日/月/年 的格式输入。\n\n事件名称放在前面。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_111_1.png)\n\n### 将其保存为文本文件\n\n接下来，将文件保存为文本文件。单击“文件”菜单，选择“另存为”，并将文件命名为“events.txt”。现在你可以开始编写\
    \ Python 程序了。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_111_2.png)\n\n### 打开一个新的\
    \ Python 文件\n\n现在你需要为代码创建一个新文件。将其保存为“countdown_calendar.py”，并确保它与你的“events.txt”文件位于同一文件夹中。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_111_3.png)\n\n### 设置模块\n\n这个项目需要两个模块：`Tkinter`\
    \ 和 `datetime`。Tkinter 将用于构建一个简单的 GUI，而 datetime 将让使用日期进行计算变得容易。在新程序顶部输入以下两行来导入它们。\n\
    \n```python\nfrom tkinter import Tk, Canvas\nfrom datetime import date, datetime\n\
    ```\n\n导入 Tkinter 和 datetime 模块。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_111_4.png)\n\
    \n"
