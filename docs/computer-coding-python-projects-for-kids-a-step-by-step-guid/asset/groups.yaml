  - '[PAGE 129]


    # Secret Messages


    Swap messages with your friends using the art of cryptography – changing the text
    of a message so that people who don’t know your secret methods can’t understand
    it!


    # What happens


    The program will ask you if you want to create a secret message or reveal what
    a secret message says. It will then ask you to type in the message. If you choose
    to make a secret message, your message will be turned into what looks like total
    gibberish. But if you choose to reveal a message, nonsense will be turned into
    text you can read!


    # Cryptography


    The word ‘cryptography’ comes from the ancient Greek words for “hidden” and “writing”.
    People have been using this technique to send secret messages for nearly 4,000
    years. Here are some special terms used in cryptography:


    +   - **Cipher** – a set of instructions for altering a message to hide its meaning.

    +   - **Encrypt** – to hide the secret message.

    +   - **Decrypt** – to reveal the secret message.

    +   - **Ciphertext** – the message after it has been encrypted.

    +   - **Plaintext** – the message before it has been encrypted.


    ![](img/1bd24ab186f69fb18194b4174ca15178_129_0.png)


    **Share the code**

    If you share your Python code with a friend, you’ll be able to pass secret messages
    to each other.


