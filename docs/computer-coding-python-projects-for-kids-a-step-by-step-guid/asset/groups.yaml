  - "[PAGE 94]\n\n# Starry sky\n\nThe next steps will wrap up your star as a Python\
    \ function. You’ll then be able to use that function to draw a sky that’s teeming\
    \ with stars.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_94_0.png)\n\nThe `draw_star()`\
    \ function uses five parameters to define the shape, size, colour, and position\
    \ of the star.\n\n# 9. Create the star function\n\nEdit the code as shown here.\
    \ It replaces nearly all of your existing code with a new version. The large block\
    \ wraps up all the star-drawing instructions and keeps them neatly together as\
    \ a function. You can now use this function to draw a star in your main code with\
    \ a single line of Python, `draw_star()`.\n\n```\n```python\nimport turtle as\
    \ t\n\ndef draw_star(points, size, col, x, y):\n    t.penup()\n    t.goto(x, y)\n\
    \    t.pendown()\n    angle = 180 - (180 / points)\n    t.color(col)\n    t.begin_fill()\n\
    \    for i in range(points):\n        t.forward(size)\n        t.right(angle)\n\
    \    t.end_fill()\n\n# Main code\nt.Screen().bgcolor('dark blue')\ndraw_star(5,\
    \ 50, 'yellow', 0, 0)\n```\n```\n\nThe x and y coordinates set the position of\
    \ the star on the screen.\n\nThis sets the background colour to dark blue.\n\n\
    This “comment” line starting with a hash symbol (#) isn’t part of the code run\
    \ by Python. It’s like a label to help you understand the program.\n\nThis line\
    \ calls (runs) the function.\n\nThe turtle draws a yellow, five-pointed star,\
    \ size 50, in the centre of the window.\n\n# 10. Run the project\n\nThe turtle\
    \ should draw a single yellow star on a blue background.\n\n![](img/1bd24ab186f69fb18194b4174ca15178_94_1.png)\n\
    \n# Comments\n\nProgrammers often put comments in their code to remind them what\
    \ different parts of a program do or to explain a tricky part of a project. A\
    \ comment must start with a #. Python ignores anything you type on the same line\
    \ after the # and doesn’t treat it as part of the code. Writing comments in your\
    \ own projects (such as the line # Main code shown above) can be really helpful\
    \ when you go back to look at a program after leaving it for a while."
