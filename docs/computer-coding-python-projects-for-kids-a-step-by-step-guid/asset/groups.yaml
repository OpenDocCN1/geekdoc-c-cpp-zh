    # Name errors


    A name error message appears if your code uses the name of a variable or function
    that hasn’t yet been created. To avoid this, always define your variables and
    functions before you write code to use them. It’s good practice to define all
    your functions at the top of your program.


    # Name errors


    A name error in this code stops Python from displaying the message “I live in
    Moscow”. You need to create the variable **hometown** first, before you use the
    **print()** function.


    The `print()` instruction needs to come after the variable.


    ```

    ```python

    print(''I live in '' + hometown)

    hometown = ''Moscow''

    ```

