  mdcn: "\n\n## 认识 Python\n\nPython 是世界上最受欢迎的计算机编程语言之一。它于 20 世纪 90 年代首次发布，如今被用于构建数以百万计的应用、游戏和网站。\n\
    \n**术语**\n\n### Python\n\nPython 并非以蛇的种类命名。它实际上是以一个名为“蒙提·派森的飞行马戏团”的英国喜剧团体命名的。Python\
    \ 的创造者吉多·范罗苏姆是该团体的忠实粉丝，也很喜欢他们古怪的幽默。Python 程序员经常在代码中使用该团体的笑话和名言，以示致敬。\n\n### 为什么选择\
    \ Python？\n\nPython 是入门计算机编程的绝佳语言。许多学校和大学都用它来教授编程。以下是 Python 如此有用的一些原因。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_13_0.png)\n\
    \n> 它易于阅读和编写！\n\n### 易于阅读和编写\n\nPython 是一种基于文本的计算机编程语言。你使用英语单词、标点字符、符号和数字的组合来编写指令。这使得\
    \ Python 代码简单易读、易写、易懂。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_13_1.png)\n\
    \n### 处处可用\n\nPython 是可移植的。这意味着你可以在许多不同的计算机上编写和运行 Python 代码。相同的 Python 代码可在 PC、Mac、Linux\
    \ 机器和 Raspberry Pi 计算机上运行。这些程序在每台机器上的行为都相同。\n\n### 自带电池\n\n程序员说 Python“自带电池”。这是因为它附带了立即开始编程所需的一切。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_13_2.png)\n\n![](img/1bd24ab186f69fb18194b4174ca15178_13_3.png)\n\
    \n### 便捷工具\n\nPython 内置了大量有用的工具和预编程代码，你可以在自己的程序中使用它们。这被称为标准库。使用这些工具可以让你更轻松、更快捷地构建自己的程序。\n\
    \n### 出色的支持\n\nPython 拥有编写良好的文档。它包含入门指南、用于查询各项含义的参考部分，以及大量示例代码。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_13_4.png)\n\
    \n## Python 在实际应用中\n\nPython 不仅仅是教育工具。它是一个如此强大的程序，被用于商业、医学、科学和媒体领域中许多有趣而激动人心的任务。它甚至可以用来控制你家里的灯光和供暖。\n\
    \n### 专家提示\n\n### 解释器\n\n有些编程语言使用解释器。解释器是一种可以将一种编程语言翻译成另一种编程语言的程序。每次运行 Python\
    \ 程序时，解释器都会把每一行 Python 代码翻译成计算机能够理解的特殊代码，即机器码。\n\n### 网络爬取\n\nPython 在互联网上被广泛使用。Google\
    \ 搜索引擎的部分内容是用 Python 编写的。YouTube 的许多部分也是使用 Python 代码构建的。\n\n> 我是一个无比强大的程序！\n\n\
    ![](img/1bd24ab186f69fb18194b4174ca15178_14_0.png)\n\n> Python？这可是一门严肃的生意！\n\n\
    ![](img/1bd24ab186f69fb18194b4174ca15178_14_1.png)\n\n### 严肃业务\n\nPython 帮助银行跟踪其账户中的资金，也帮助大型连锁商店为所售商品定价。\n\
    \n> 别担心，这不会很疼——疼不了多少！\n\n![](img/1bd24ab186f69fb18194b4174ca15178_14_2.png)\n\n\
    ### 医学奇迹\n\nPython 可用于为机器人编程，以执行高难度手术。由 Python 编程的机器人外科医生可以比人类外科医生工作得更快，而且更准确，更不容易出错。\n\
    \n> 我们一直在等你！\n\n![](img/1bd24ab186f69fb18194b4174ca15178_14_3.png)\n\n### 超越地球\n\
    \n软件工程师使用 Python 为 NASA 的任务控制中心创建工具。这些工具帮助机组人员为每次任务做准备，并监控任务的进展。\n\n> 开拍！\n\n\
    ![](img/1bd24ab186f69fb18194b4174ca15178_14_4.png)\n\n### 在电影中\n\n迪士尼使用 Python\
    \ 将动画制作过程中重复性的部分自动化。动画师不必一遍又一遍地执行相同步骤，而是使用 Python 程序自动重复这些步骤。这节省了工作量，缩短了制作一部电影所需的时间。\n\
    \n## 安装 Python\n\n本书中的所有项目都使用 Python 3，因此请务必从网站下载正确的版本。请按照与你的计算机相匹配的说明进行操作。\n\n\
    ### 在 Windows 上安装 Python\n\n在 Windows PC 上安装 Python 3 之前，请先确认它使用的是 32 位还是 64 位版本的\
    \ Windows。单击“开始”，右键单击“计算机”，然后左键单击“属性”。如果出现“系统”选项，请选择它。\n\n### 术语 — IDLE\n\nIDLE（Integrated\
    \ Development Environment 的缩写，即集成开发环境）是安装 Python 时附带的一款免费应用。IDLE 专为初学者设计，包含一个基本的文本编辑器，可让你编写和编辑\
    \ Python 代码。\n\n1. **访问 Python 网站**  \n   在 Web 浏览器中输入下面的地址，进入 Python 网站。然后单击“Downloads”打开下载页面。\n\
    \   - https://www.python.org/\n\n2. **下载 Python**  \n   单击适用于 Windows 的最新 Python\
    \ 版本（版本号以数字 3 开头）。安装程序文件将自动下载。在不同的安装程序选项中，选择“executable installer”。\n   - Python\
    \ 3.6.0a4 · 2016-08-15\n     - Windows x86 executable installer\n     - Windows\
    \ x86-64 executable installer\n\n   如果你使用的是 32 位版本的 Windows，请使用此安装程序。如果你使用的是 64\
    \ 位版本的 Windows，请使用此安装程序。\n\n3. **运行安装程序**  \n   双击安装程序文件以安装 Python。选择“为所有用户安装”，并在每个提示处单击“下一步”，不要更改默认设置。\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_15_0.png)\n\n4. **打开 IDLE**  \n   安装完成后，打开\
    \ IDLE 程序以检查安装是否成功。转到“开始”菜单，选择“所有应用”，然后选择“IDLE”。应该会打开一个类似下图的窗口。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_15_1.png)\n\
    \n![](img/1bd24ab186f69fb18194b4174ca15178_15_2.png)\n\n```text\nPython 3.6.0a4\
    \ (v3.6.0a4:017cf260936b, Aug 15 2016, 00:45:10) [MSC v.1900 32 bit (Intel)] on\
    \ win32\nType \"copyright\", \"credits\" or \"license()\" for more information.\n\
    >>>\n```\n\n## 编辑器窗口\n\nShell 无法保存你的代码，因此当你关闭 Shell 窗口时，你输入的代码将永久丢失。这就是为什么在处理项目时应该使用\
    \ IDLE 的编辑器窗口。这个窗口可以让你保存代码。它还内置了一些工具，帮助你编写程序并排查错误。\n\n### 编辑器窗口\n\n要在 IDLE 中打开编辑器窗口，请单击顶部的“File”菜单并选择“New\
    \ File”。随后会出现一个空白的编辑器窗口。你将使用编辑器窗口来编写和运行本书中的项目程序。\n\n你在这里输入代码。这个程序会打印一个列表，告诉你哪些数字是偶数，哪些是奇数。\n\
    \n文件名显示在这里。\n\n你可以从这个菜单运行程序。\n\n编辑器窗口的菜单栏与 Shell 的菜单栏不同。\n\n```python\nfor counter\
    \ in range(10):\n    if ((counter % 2) == 0):\n        print(counter)\n      \
    \  print('is even')\n    else:\n        print(counter)\n        print('is odd')\n\
    ```\n\n你让 Python 打印的任何内容都会显示在 Shell 窗口中。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_18_0.png)\n\
    \n### 代码中的颜色\n\nIDLE 会自动为文本着色，以突出显示代码的不同部分。这些颜色让你更容易理解代码，而且在试图找出错误时很有用。\n\n| 符号\
    \ | 含义 |\n|---|---|\n| 符号和名称 | 大多数代码文本为黑色。 |\n| 关键字 | 某些单词（例如“if”和“else”）是 Python\
    \ 使用的特殊单词。它们被称为关键字，并以橙色显示。 |\n| 输出 | 程序运行时产生的任何文本都是蓝色。 |\n| 内置命令 | Python 命令（例如“print”）以紫色显示。\
    \ |\n| 错误 | Python 使用红色提醒你代码中的任何错误。 |\n| 引号中的文本 | 引号中的文本为绿色。文本周围出现绿色括号表示你缺少一个引号。\
    \ |\n\n"
