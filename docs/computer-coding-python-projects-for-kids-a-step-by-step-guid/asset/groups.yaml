    # Type errors


    A type error isn’t a typing error – it means your code has muddled up one type
    of data with another type, such as confusing numbers with strings. It’s like trying
    to bake a cake in your fridge – it won’t work, because the fridge isn’t meant
    for baking! If you ask Python to do something impossible, don’t be surprised if
    it won’t cooperate!


    ```

    ```python

    budget = ''Fifty'' * ''Five''

    ```

    ```


    You can multiply two numbers in Python, but you can’t do multiplication with strings.


    ```

    ```python

    hot_day = ''20 degrees'' > 15

    ```

    ```


    Python can’t check to see if a string is greater than a number, as they are different
    data types.


    ```

    ```python

    list = [''a'',''b'',''c'']

    find_biggest_number(list)

    ```

    ```


    This function is expecting you to give it a list of numbers, but you’ve given
    it a list of letters instead!


    # Examples of type errors


    Type errors occur when you ask Python to do something that doesn’t make sense
    to it, such as multiplying two strings, comparing two completely different types
    of data, or telling it to find a number in a list of letters.


