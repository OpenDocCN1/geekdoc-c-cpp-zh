  - '[PAGE 13]


    # # Meet Python


    Python is one of the most popular computer programming languages in the world.
    It was first released in the 1990s and is now used to build millions of apps,
    games, and websites.


    **LINGO**


    # ### Python


    Python isn''t named after the type of snake. It''s actually named after a British
    comedy group called "Monty Python''s Flying Circus". The creator of Python, Guido
    van Rossum, was a big fan of the group and their quirky humour. Python programmers
    often use the group''s jokes and famous quotes in their code as a tribute.


    # ## Why Python?


    Python is a great language for getting started with computer programming. Many
    schools and universities use it to teach coding. Here are some of the reasons
    that Python''s so useful.


    ![](img/1bd24ab186f69fb18194b4174ca15178_13_0.png)


    > > It''s easy to read and write!


    # ### Easy to read and write


    Python is a text-based computer programming language. You write the instructions
    using a mixture of English words, punctuation characters, symbols, and numbers.
    This makes Python code simple to read, write, and understand.


    ![](img/1bd24ab186f69fb18194b4174ca15178_13_1.png)


    # ### Works everywhere


    Python is portable. This means you can write and run Python code on lots of different
    computers. The same Python code will work on PCs, Macs, Linux machines, and Raspberry
    Pi computers. The programs behave the same way on each machine.


    # ### Batteries included


    Programmers say Python has "batteries included". This is because it comes with
    everything you need to get coding straight away.


    ![](img/1bd24ab186f69fb18194b4174ca15178_13_2.png)


    ![](img/1bd24ab186f69fb18194b4174ca15178_13_3.png)


    # ### Handy tools


    Python is packed with lots of useful tools and preprogrammed code that you can
    use in your programs. This is called the Standard Library. Using these tools makes
    it easier and quicker for you to build your own programs.


    # ### Great support


    Python has well-written documentation. It has a guide to getting started, a reference
    section for looking up what things mean, and a bunch of example code.


    ![](img/1bd24ab186f69fb18194b4174ca15178_13_4.png)'
  - '[PAGE 14]


    # Python in action


    Python isn''t just an educational tool. It''s such a powerful program it''s used
    for many interesting and exciting tasks in business, medicine, science, and the
    media. It can even be used to control the lights and heating in your home.


    # EXPERT TIPS


    # The interpreter


    Some programming languages use an interpreter. The interpreter is a program that
    can translate from one programming language into another. Every time you run a
    Python program, the interpreter translates each line of Python code into a special
    code that the computer can understand, known as machine code.


    # Crawling the web


    Python is widely used on the Internet. Parts of Google''s search engine are written
    in Python. Much of YouTube is also built using Python code.


    > > I''m a mighty powerful program!


    ![](img/1bd24ab186f69fb18194b4174ca15178_14_0.png)


    > > Python? It''s a serious business!


    ![](img/1bd24ab186f69fb18194b4174ca15178_14_1.png)


    # Serious business


    Python helps banks to keep track of the money in their accounts, and big store
    chains to set the prices of the goods they sell.


    > > Don''t worry, this won''t hurt - much!


    ![](img/1bd24ab186f69fb18194b4174ca15178_14_2.png)


    # Medical marvels


    Python can be used to program robots to perform tricky operations. A Python-programmed
    robot surgeon can work more quickly than a human one, and be more accurate and
    less likely to make errors.


    > > We''ve been expecting you!


    ![](img/1bd24ab186f69fb18194b4174ca15178_14_3.png)


    # Out of this world


    Software engineers used Python to create tools for NASA''s Mission Control Centre.
    These tools help the crew prepare for and monitor the progress of each mission.


    > > Action!


    ![](img/1bd24ab186f69fb18194b4174ca15178_14_4.png)


    # In the movies


    Disney uses Python to automate repetitive parts of the animation process. Rather
    than animators carrying out the same steps over and over, they use a Python program
    to repeat the steps automatically. This saves work, shortening the time it takes
    to make a film.'
