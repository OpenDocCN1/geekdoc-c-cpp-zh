    - **分支（branch）** — 程序中存在两个不同选项可供选择的点。\n- **缺陷（bug）** — 程序代码中的错误，会导致程序以意外的方式运行。\n\
    - **调用（call）** — 在程序中使用某个函数。\n- **注释（comment）** — 程序员添加到程序中的文本说明，使代码更易理解，程序运行时会被忽略。\n\
    - **条件（condition）** — 用于在程序中做出决策的“真或假”语句。参见*布尔表达式*。\n- **常量（constant）** — 无法改变的固定值。\n\
    - **坐标（coordinates）** — 一对用来准确确定位置的数字，通常写作 (x, y)。\n- **数据（data）** — 信息，例如文本、符号和数值。\n\
    - **字典（dictionary）** — 以成对形式存储的数据项集合，例如国家及其首都。\n- **调试（debug）** — 查找并纠正程序中的错误。\n\
    - **加密（encryption）** — 对数据进行编码，使得只有特定人员才能读取或访问。\n- **事件（event）** — 计算机程序可以对其作出反应的事情，例如按键被按下或鼠标被点击。\n\
    - **文件（file）** — 以名称存储的数据集合。\n- **标志变量（flag variable）** — 可以具有两种状态的变量，例如真（True）和假（False）。\n\
    - **浮点数（float）** — 含有小数点的数字。\n- **流程图（flowchart）** — 以一系列步骤和决策来展示程序的图表。\n- **函数（function）**\
    \ — 执行特定任务的代码，就像一个程序中的小程序。也称为过程、子程序或子例程。\n- **全局变量（global variable）** — 在程序的每个部分都起作用的变量。参见*局部变量*。\n\
    - **图形（graphics）** — 屏幕上非文本的可视元素，例如图片、图标和符号。\n- **图形用户界面（GUI）** — 图形用户界面（GUI）指由按钮和窗口等构成、你可以看到并与之交互的程序部分。\n\
    - **巧妙修改（hack）** — 对代码的一种巧妙改动，使其实现新功能或得到简化。（也可指未经许可访问计算机。）\n- **黑客（hacker）** —\
    \ 侵入计算机系统的人。“白帽”黑客受雇于计算机安全公司，寻找问题以便修复。“黑帽”黑客侵入计算机系统以造成损害或从中牟利。\n- **缩进（indent）**\
    \ — 当一个代码块比前一个代码块更靠右放置时，即为缩进。缩进通常为四个空格。特定代码块中的每一行都必须缩进相同的量。\n- **索引号（index number）**\
    \ — 分配给列表中某个项目的编号。在 Python 中，第一个项目的索引号为 0，第二个为 1，依此类推。\n- **输入（input）** — 输入到计算机中的数据。键盘、鼠标和麦克风可用于输入数据。\n\
    - **整数（integer）** — 整数。整数不包含小数点，也不以分数形式书写。\n- **界面（interface）** — 用户与软件或硬件交互的方式。参见\
    \ GUI。\n- **库（library）** — 可在其他项目中复用的函数集合。\n- **列表（list）** — 按编号顺序存储的一组项目。\n-\
    \ **局部变量（local variable）** — 仅在程序的有限部分（如函数）内起作用的变量。参见全局变量。\n- **循环（loop）** — 程序中重复执行的部分，无需多次键入相同的代码。\n\
    - **模块（module）** — 一个预先编写好的代码包，可以导入到 Python 程序中，从而提供许多有用的函数。\n- **嵌套循环（nested\
    \ loop）** — 位于另一个循环内部的循环。\n- **操作系统（OS）** — 控制计算机一切活动的程序，例如 Windows、macOS 或 Linux。\n\
    - **运算符（operator）** — 执行特定功能的符号，例如 \"+\"（加法）或 \"–\"（减法）。\n- **输出（output）** — 由计算机程序产生并供用户查看的数据。\n\
    - **参数（parameter）** — 提供给函数的值。参数的值由调用该函数的代码行指定。\n- **像素（pixels）** — 构成数字图像的微小圆点。\n\
    - **程序（program）** — 计算机为完成任务而执行的一组指令。\n- **编程语言（programming language）** — 用于向计算机发出指令的语言。\n\
    - **Python** — 一种由吉多·范罗苏姆创建的流行编程语言，非常适合初学者学习。\n- **随机（random）** — 计算机程序中的一种函数，允许产生不可预测的结果，在创建游戏时很有用。\n\
    - **递归（recursion）** — 通过让函数调用自身来创建循环。\n- **返回值（return value）** — 函数被调用（运行）后传回的变量或数据。\n\
    - **运行（run）** — 使程序启动的命令。\n- **软件（software）** — 在计算机上运行并控制其工作方式的程序。\n- **语句（statement）**\
    \ — 编程语言可以被分解成的最小完整指令。\n- **字符串（string）** — 一系列字符。字符串可以包含数字、字母或符号，例如冒号。\n- **语法（syntax）**\
    \ — 决定代码必须如何编写才能正常工作的规则。\n- **切换（toggle）** — 在两种不同设置之间进行切换。\n- **元组（tuple）** —\
    \ 由逗号分隔并用括号括起来的项目列表。元组与列表类似，不同之处在于元组创建后无法更改。\n- **海龟绘图（turtle graphics）** — 一个\
    \ Python 模块，通过让机器海龟在屏幕上移动来绘制图形。\n- **Unicode（统一码）** — 计算机用来表示数千种符号和文本字符的通用编码。\n\
    - **变量（variable）** — 在程序中存储可变数据的地方，例如玩家的得分。变量有名称和值。\n- **控件（widget）** — Tkinter\
    \ 图形用户界面（GUI）中执行特定功能的部分，例如按钮或菜单。\n"
