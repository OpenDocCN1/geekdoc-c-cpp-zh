    \   bottom_wall = -t.window_height() / 2\n    (x, y) = caterpillar.pos()\n   \
    \ outside = \\\n        x < left_wall or \\\n        x > right_wall or \\\n  \
    \      y < bottom_wall or \\\n        y > top_wall\n    return outside\n```\n\n\
    > 这个函数返回两个值（一个“元组”）。\n\n> 如果上述四个条件中的任何一个为 True，则 outside 为 True。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_162_0.png)\n\
    \n### 工作原理\n\n窗口中心的坐标是 (0, 0)。由于窗口宽 400，右墙距离中心为宽度的一半，即 200。代码通过从 0 减去宽度的一半来得到左墙的位置，也就是\
    \ 0 - 200，即 -200。用类似的方法可以求出上墙和下墙的位置。\n\n### 游戏结束！\n\n现在你知道了毛毛虫何时离开屏幕，接下来显示一条消息，告知玩家游戏已结束。用以下代码填充\
    \ `game_over()` 函数。该函数被调用时，会隐藏毛毛虫和叶子，并在屏幕上写出 “GAME OVER!”。\n\n![](img/1bd24ab186f69fb18194b4174ca15178_162_1.png)\n\
