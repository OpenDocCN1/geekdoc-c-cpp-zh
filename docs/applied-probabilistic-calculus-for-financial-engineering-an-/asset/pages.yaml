    # Using the Variance of Residuals from a Factor Model


    If the investor is using a factor model to compute the views, one may use the
    variance of the residuals from the model to drive the variance of the return estimates.
    The general expression for a factor model of returns is


    r = \sum_{i=1}^{n} \beta_i f_i + \varepsilon  (3.88)


    +   - r is the return of the asset,

    +   - \beta_i is the factor loading for factor (i),

    +   - f_i is the return owing to factor (i), and

    +   - \varepsilon is an independent normally distributed residual.


    The general expression for the variance of the return from a factor model is


    V(r) = B V(F) B^T + V(\varepsilon)  (3.89)


    +   - B is the factor loading matrix, and

    +   - F is the vector of returns owing to the various factors.


    Given Equation (3.88), and the assumption that \varepsilon is independent and
    normally distributed, one may calculate the variance of \varepsilon directly as
    part of the regression. While the regression might yield a full covariance matrix,
    the mixing model will be more robust if only the diagonal elements are used.


    Beach and Orlov (2006) describe their work using GARCH style factor models to
    generate their views for use with the Black–Littman model. They generated the
    precision of the views using the GARCH models.


    # Using the Idzorek Method


    Idzorek (2005) describes a method for specifying the confidence in the view in
    terms of a percentage move of the weights on the interval from 0% to 100% confidence.
    We will look at Idzorek’s algorithm in the section on extensions.


