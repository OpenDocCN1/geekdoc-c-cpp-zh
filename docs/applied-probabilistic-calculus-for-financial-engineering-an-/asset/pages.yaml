  md: "# Description\n\nProduces an amortization table for paying off a loan while\
    \ also solving for either the number of payments, loan amount, or the payment\
    \ amount. In the amortization table, the payment amount, interest paid, principal\
    \ paid, and balance of the loan are given for each period. If n ends up not being\
    \ a whole number, outputs for the balloon payment, drop payment, and last regular\
    \ payment are provided. The total interest paid, and total amount paid is also\
    \ given. It can also plot the percentage of each payment toward interest versus\
    \ period.\n\n# Usage\n\n```\namort.table(Loan=NA, n=NA, pmt=NA, i=0.025,\n   \
    \ ic=1, pf=1, plot=TRUE)\n```\n\n# Arguments\n\n+   Loan loan amount\n+   n the\
    \ number of payments/periods\n+   pmt value of level payments\n+   i nominal interest\
    \ rate convertible ic times per year\n+   ic interest conversion frequency per\
    \ year\n+   pf the payment frequency- number of payments per year\n+   plot tells\
    \ whether or not to plot the percentage of each payment toward interest vs.period\n\
    \n# Details\n\nEffective Rate of Interest: eff.i = [1 + (i/ic)]^ic - 1\nj = (1\
    \ + eff.i)^(1/pf) - 1\nLoan = pmt * a_nj\nBalance at the end of period t: B_t\
    \ = pmt * a_{n-t}j\nInterest paid at the end of period t: i_t = B_{t-1}*\nPrincipal\
    \ paid at the end of period t: p_t = pmt - i_t\nTotal Paid = pmt * n\nTotal Interest\
    \ Paid = pmt * n - Loan\nIf n = n* + k where n* is an integer and 0 < k < 1:\n\
    Last regular payment (at period n*) = pmt * s_{k/j}\nDrop payment (at period n*\
    \ + 1) = Loan * (1 + j)^{n*+1} - pmt * s_{n* j}\nBalloon payment (at period n*)\
    \ = Loan * (1 + j)^{n*} - pmt * a_{n*j} + pmt"
