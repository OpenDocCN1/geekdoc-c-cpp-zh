  md: '5 Use the data in Table A below. Assume a person is initially HIV-negative.
    If the probability of getting infected per act is p, then the probability of not
    getting infected per act is (1 − p).


    The probability of not getting infected after two consecutive acts is (1 − p)²,
    and the probability of not getting infected after three consecutive acts is (1
    − p)³. Therefore, the probability of not getting infected after n consecutive
    acts is (1 − p)ⁿ, and the probability of getting infected after n consecutive
    acts is 1 − (1 − p)ⁿ.


    For the nonblood transfusion transmission probability (per act risk) in Table
    A, calculate the risk of being infected after one year (365 days) if one carries
    out the needle sharing injection drug use (IDU) once daily for one year.


    Do these cumulative risks seem reasonable? Why? Why not?


    # Table A


    Estimated per-act risk (transmission probability) for acquisition of HIV, by exposure
    route to an infected source. Source: CDC


    | Exposure route | Risk per 10,000 exposures |

    |---|---|

    | Blood Transfusion (BT) | 9,000 |

    | Needle-sharing Injection-Drug Use (IDU) | 67 |


    Solution:


    ```

    > p <- 67/10000

    > p

    [1] 0.0067

    > q <- (1 - p)

    > q

    [1] 0.9933

    > q365 <- q^365

    > q365

    [1] 0.08597238

    > p365 <- 1 - q365

