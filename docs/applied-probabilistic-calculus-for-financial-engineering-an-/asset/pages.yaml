  md: 'This proof examines all the terms in the PDF of each distribution that depends
    on $E(r)$, neglecting the other terms as they have no dependence on $E(r)$ and
    thus are constant with respect to $E(r)$.


    Starting with the prior distribution, one derives an expression proportional to
    the value of the PDF:


    $$P(A) \propto N(x, S/n) \tag{3.138}$$ with $n$ samples from the population.


    So $\tilde{\xi}(x)$ from the PDF of $P(A)$ satisfies $\sum$:

    $$\tilde{\xi}(x) \propto \exp\left[(S/n)^{-1}\{E(r)-x\}^2\right] \tag{3.139}$$


    Next, consider the PDF for the conditional distribution:


    $$P(B|A) \propto N(\mu, \Sigma) \tag{3.140}$$


    So $\tilde{\xi}(\mu|x)$ from the PDF of $P(B|A)$ satisfies

    $$\tilde{\xi}(\mu|x) \propto \exp\left[\Sigma^{-1}\{E(r)-\mu\}^2\right] \tag{3.141}$$


    Substituting (3.139) and (3.141) into (3.75) from the text,

    $$r \sim N(\mu, \Sigma) \tag{3.75}$$


    one has an expression which the PDF of the posterior distribution will satisfy.

    $$\tilde{\xi}(\mu|x) \propto \exp\left[-\Sigma^{-1}\{E(r)-\mu\}^2 + (S/n)^{-1}\{E(r)-x\}^2\right]
    \tag{3.142}$$ or

    $$\tilde{\xi}(\mu|x) \propto \exp(-\Phi) \tag{3.143}$$


    Considering only the quantity in the exponent and simplifying

    $$\Phi = \left[\Sigma^{-1}\{E(r)-\mu\}^2 + (S/n)^{-1}\{E(r)-x\}^2\right] \tag{3.144a}$$


    $$= \left[\Sigma^{-1}\{E(r)^2 - 2E(r)\mu + \mu^2\} + (S/n)^{-1}\{E(r)^2 - 2E(r)x
    + x^2\}\right] \tag{3.144b}$$


    $$= E(r)^2\left[\Sigma^{-1} + (S/n)^{-1}\right] - 2E(r)\left[\mu\Sigma^{-1} +
    x(S/n)^{-1}\right] + \Sigma^{-1}\mu^2 + (S/n)^{-1}x^2 \tag{3.144c}$$


    introduce a new term $y$, where

    $$y = \{\mu\Sigma^{-1} + x(S/n)^{-1}\} / \{\Sigma^{-1} + (S/n)^{-1}\} \tag{3.145}$$


    and then substitute in the second term:

    $$\Phi = E(r)^2\left[\Sigma^{-1} + (S/n)^{-1}\right] - 2E(r)\left[\mu\Sigma^{-1}
    + x(S/n)^{-1}\right] + \Sigma^{-1}\mu^2 + (S/n)^{-1}x^2 \tag{3.146}$$


    Then add

    $$0 = y^2\left[\Sigma^{-1} + (S/n)^{-1}\right] - \left[\mu\Sigma^{-1} + x(S/n)^{-1}\right]^2
    \left[\Sigma^{-1} + (S/n)^{-1}\right]^{-1} \tag{3.147}$$'
