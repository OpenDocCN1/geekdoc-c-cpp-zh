    # 3.2.6 The Mutual Fund Separation Theorem


    Until this point, it has been shown that the efficient portfolios are combinations
    of two classes of assets:


    +   i) Tangency portfolios

    +    ii) Risk-free assets, such as T-Bill


    Hence, applying (3.56) and (3.57b):


    μ_p = r_f + x_A (μ_A − r_f)  (3.56)

    σ_p = x_A σ_A  (3.57a)


    one may write the expected return and standard deviation of any efficient portfolios:


    μ_p^e = r_f + x_T (μ_T − r_f)  (3.62)

    σ_p^e = x_T σ_T  (3.57b)


    where


    +   x_T represents the fraction of investments in the tangency portfolio,

    +   (1 − x_T) represents the fraction of wealth invested in risk-free assets (e.g.,
    T-Bills), and

    +   μ_T and σ_T represent, respectively, the expected return and standard deviation
    of the tangency portfolio.


    This result is called the Mutual Fund Separation Theorem.


    **Remarks:**


    +   1) The Tangency Portfolio may be considered as a mutual fund of two risky
    assets—in which the shares of the two risky assets are determined by the tangency
    portfolio weights: x_1^T and x_2^T determined from (3.60a) and (3.60b), and the
    T-Bills may be considered as a mutual fund of risk-free assets.

    +   2) The exact combination of the tangency portfolio and the T-Bills will be
    dependent on the risk preference of the investor: If the investor is highly risk-averse,
    then this investor may choose a portfolio with low volatility, namely, a portfolio
    with very small weight in the tangency portfolio together with a very large weight
    in the T-Bills! Clearly, this option will produce a portfolio with an expected
    return close to the risk-free rate, and a variance that is nearly zero! On the
    other hand, if the investor can tolerate a large amount risk, then the preferred
    portfolio will have high expected return regardless of the volatility.'
