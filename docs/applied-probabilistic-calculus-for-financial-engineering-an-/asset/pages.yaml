  img_proc: true
- pgno: 432
  md: 'c) At a more sophisticated level is financial modeling, also known as quantitative
    finance, which is, in reality, mathematical modeling. A general distinctions are
    made among the following:


    +   - Quantitative Financial Management: Models of the financial situation of
    a large, complex firm

    +   - Quantitative Asset Pricing: Models of the returns of different stocks

    +   - Financial Engineering: Models of the price or returns of derivative securities


    These problems are generally probabilistic/stochastic and continuous in nature,
    and models here require complex algorithms, entailing finance. Modellers are generally
    referred to as "quants" (quantitative analysts), and typically have advanced academic
    degrees such as Master of Quantitative Finance, Master of Computational Finance,
    or Master of Financial Engineering. Not a few are at the Ph.D. level in quantitative
    disciplines such as mathematics, statistics, physics, engineering, computer science,
    operations research, and so on.


    Alternatively, or in addition to their quantitative background, they complete
    a finance masters with a quantitative orientation.


    # 6.4.3 Portfolio Optimization by the Black-Litterman Approach Using R


    # The Black-Litterman Model


    The goals of the Black-Litterman model were


    +   - to create a systematic method of specifying a portfolio, and then

    +   - to incorporate the views of the analyst/portfolio manager into the estimation
    of market parameters.


    Let,


    A = {a₁, a₂, a₃, ..., aₙ}


    be a set of random variables representing the returns of n assets. In the BL model,
    the joint distribution of A is taken to be multivariate normal, that is,


    A ~ N(μ, Σ)


    The model then considers incorporating an analyst''s views into the estimation
    of the market mean μ. If one considers


    +   - μ to be a random variable which is itself normally distributed, and that

    +   - its dispersion is proportional to that of the market,


    then


    μ ~ N(π, τΣ)


    where π is some parameter that may be determined by the analyst by some established
    procedure. On this point, Black and Litterman proposed (based on'
