    The following numerical examples are selected, all being typical representations
    of the geometric Brownian motion (GBM) model and the random walk model:


    # Worked Example 2-1 in R:


    BM: Brownian motion, Brownian bridge, geometric Brownian motion, and arithmetic
    Brownian motion simulators


    # Description


    The (S3) generic function for simulation of Brownian motion, Brownian bridge,
    geometric Brownian motion, and arithmetic Brownian motion.


    # Usage


    ```

    BM(N, . . . )

    BB(N, . . . )

    GBM(N, . . . )

    ABM(N, . . . )

    ```'
