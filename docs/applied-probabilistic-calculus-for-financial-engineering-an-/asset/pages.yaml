- pgno: 136
  md: 'smaller amount of return. When Markowitz introduced the efficient frontier,
    it was a seminal contribution to financial engineering science: One of its greatest
    contributions was its clear demonstration of the power of diversification.


    Markowitz''s theory relies on the claim that investors tend to choose, either
    purposely or inadvertently, portfolios that generate the largest possible returns
    with the least amount of risk. In other words, they seek out portfolios on the
    efficient frontier!


    It should not be unaware that there is no one efficient frontier because individual
    investors as well as portfolio managers can and do edit the number and characteristics
    of the assets in the investing universe to conform to their own personal specific
    needs. For example, one individual investor may require the portfolio to have
    a minimum dividend yield, or another client may rule out investments in ideologically
    (e.g., politically, ethically, ethnically, or religiously) nonpreferred industries.
    Thus, only the remaining assets are included in the efficient frontier calculations.


