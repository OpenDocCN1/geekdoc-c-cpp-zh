  md: 'the equilibrium. If the Canonical Reference Model is used and set Ω proportional
    to τ Σ, then the return estimate will not depend on the value of τ, but the posterior
    covariance of returns will depend on the proper calibration of τ.


    # Calibration of τ


    Some empirical ways to select and calibrate the value of τ will be considered:


    The first method to calibrate τ relies on basic statistics: When estimating the
    mean of a distribution, the uncertainty (variance) of the mean estimate will be
    proportional to the inverse of the sample sizes. Given that one is estimating
    the covariance matrix from historical data, then


    +   - τ = 1/T      The maximum-likelihood estimator

    +   - τ = 1/(T − k)  The best quadratic unbiased estimator


    where T = the number of samples and k = the number of assets.


    While there are other estimators, usually the first definition above is used.
    Given that one usually aims for a number of samples around 60 (viz., 5 years of
    12 monthly samples), τ is on the order of 0.02 (1/60 = 0.01666 . . .). This is
    consistent with several of the papers that indicate they used values of τ on the
    range of (0.025, 0.05).


    The most intuitively easy way to calibrate τ is as part of a confidence interval
    for the prior mean estimates. One may illustrate this concept with a simple example:
    Consider the scenario where τ = 0.05, and one considers only a single asset with
    a prior estimate of 7% as the excess return and 15% as the known standard deviation
    of returns about the mean. If one uses a confidence interval of (1%, 5%) with
    68% confidence, one keeps the ratio of View Precision to Prior Precision fixed
    between the two scenarios, one with τ = 0.05 and one with τ = 1. In the first
    scenario, even though one uses a seemingly small τ = 0.05, the prior estimate
    has relatively low precision based on the width of the confidence interval, and
    thus the posterior estimate will be heavily weighted toward the view. In the second
    scenario with τ = 1, the prior confidence interval is so wide as to make the prior
    estimate close to worthless. In order to keep the posterior estimate the same
    across scenarios, the view estimate also has a wide confidence interval indicating
    the investor is really not confident in any of their estimates!


