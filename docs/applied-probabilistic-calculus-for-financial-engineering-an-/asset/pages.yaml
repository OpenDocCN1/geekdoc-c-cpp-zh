- pgno: 431
  md: '# 6.4.2 Portfolio Optimization by Special Numerical Methods


    Numerical financial modeling is the building of an abstract representation or
    model of a real-world financial situation. This is a mathematical model for representing
    the performance of a financial asset or portfolio of an investment. Financial
    modeling is applicable to different areas of finance, including the following:


    +   - Accounting and corporate finance applications

    +   - Quantitative finance applications.


    Financial modeling may mean an exercise in either asset pricing or corporate finance,
    of a quantitative nature. It is concerned with the modeling of a set of hypotheses
    about the behavior of markets or agents into numerical predictions. For example,
    a corporation’s decisions about investments (the corporation will invest 25% of
    assets) or investment returns (returns on Stock X will be 20% higher than the
    market’s returns).


    In investment banking, corporate finance, and so on, financial modeling is largely
    synonymous with financial statement forecasting. This usually involves the preparation
    of detailed company-specific models used for decision-making purposes and financial
    analysis.


    Applications of financial modeling include:


    +   - Financial statement analysis

    +   - Business valuation

    +   - Management decision making

    +   - Capital budgeting

    +   - Cost of capital calculations

    +   - Project finance

    +   - Mergers and acquisitions

    +   - Analyst buy/sell recommendations


    These models are built around financial statements; calculations and outputs are
    monthly, quarterly, or annual. The inputs take the form of “assumptions,” where
    the analyst specifies the values that will apply in each period for the following:


    +   a) External/global variables (exchange rates, tax percentage, etc.; may be
    considered as the model parameters), and for internal variables (wages, costs,
    etc.) Correspondingly, both characteristics are reflected (at least implicitly)
    in the mathematical form of these models: first, the models are in discrete time;
    second, they are deterministic.

    +   b) In many instances, such calculations are spreadsheet based, each institution
    having its own internal ground rules.'
