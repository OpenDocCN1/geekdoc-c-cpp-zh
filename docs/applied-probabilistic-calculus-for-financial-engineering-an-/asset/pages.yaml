  md: '# 1.4.3 Characteristic Properties of Mean-Variance Optimization (MVO)


    The following are the characteristic properties of the methodology of MVO:


    +   a) It does not take into account "fat-tailed" asset class return distributions,
    which matches most real-world historical asset class returns. For example, consider
    the monthly total returns of the S&P 500 Index, dating back to 1926: There are
    1,025 months between January 1926 and May 2011. The monthly arithmetic mean and
    standard deviation of the S&P 500 Index over this time period are 0.943 and 5.528%,
    respectively. For a normal distribution, the return that is three standard deviations
    away from the mean is −15.64%, calculated as (0.943%−3×5.528%).


    In a standard normal distribution, 68.27% of the data values are within one standard
    deviation from the mean, 95.45% within two standard deviations, and 99.73% within
    three standard deviations: Figure 1.4


    This implies that there is a 0.13% probability that returns would be three standard
    deviations below the mean, where 0.13% is calculated as (100% − 99.73%)/2.


    In other words, the normal distribution estimates that there is a 0.13% probability
    of returning less than −15.64%, which means that only 1.3 months out of those
    1,025 months between January 1926 and May 2011 are expected to have returns below
    −15.64%, where 1.3 months is arrived at by multiplying the 0.13% probability by
    1,025 months of return data.


    However, when examining historical data during this period, there are 10 months
    where this occurs, which is


    10 months / 1.3 months = 7.69 times


    or almost 8 times more than the model prediction!


    ![](img/551ca8853d2ba8528201e7a57e5006b4_30_0.png)


    Figure 1.4 A standard normal distribution.'
