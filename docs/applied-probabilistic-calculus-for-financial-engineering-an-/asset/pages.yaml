  md: "In the financial literature, several parametric forms of u(·) are commonly\
    \ used. The most common one is the constant relative risk aversion (CRRA) utility\
    \ function, which may be expressed as:\n\nu(x) = { [θ/(θ−1)] x^{(θ−1)/θ}, θ >\
    \ 0, θ ≠ 1\n        { ln(x),               θ = 1\n\n(5.3)\n\nwhere θ is the risk\
    \ tolerance parameter.\n\nOwing to its analytical simplicity and its ability to\
    \ represent a wide range of opinions toward risk with a single parameter, the\
    \ CRRA utility function is used not only in single-period models, but also in\
    \ multiperiod models.\n\nLet I_t denote the random amount of income in period\
    \ t, the expected utility of the sequence of incomes from periods 0 to T in these\
    \ models is\n\nEU = Σ_{t=0}^T d_t [θ/(θ−1)] E[ I_t^{(θ−1)/θ} ]\n\n(5.4)\n\nwhere\
    \ d_t is the discount factor for period t. However, the parameter θ does have\
    \ a role in the calculation of utility even if there is no uncertainty – because,\
    \ in a multiperiod context, θ plays the following two roles:\n\n+   1) The investor's\
    \ risk tolerance parameter\n+   2) The investor's elasticity of intertemporal\
    \ substitution (EOIS) preference parameter.\n\nIt was pointed out by Epstein and\
    \ Zin that there is no reason that the risk tolerance parameter and the EOIS parameter\
    \ are equal. The reason for setting them equal is mathematical expediency. By\
    \ recursively nesting the certainty equivalence function inside of the intertemporal\
    \ utility function, Epstein and Zin formulated expected utility that makes these\
    \ distinct parameters:\n\nV_t = [ I_t^{1-γ} + (d_{t+1}/d_t) CE_t[ V_{t+1} ]^{1-γ/η}\
    \ ]^{1/(1-γ)}  (5.5)\n\nwhere\n\nV_t is the utility of the stream of income, starting\
    \ at time t (measured in the same unit as income), and\n\nη is the investor's\
    \ elasticity of intertemporal substitution preference parameter.\n\nOn the certainty\
    \ equivalent operator, the t subscript denotes that it is conditional on what\
    \ is known at time t.\n\nThe utility function generalizes the recursive expected\
    \ utility maximization problem formulated by Lucas (1978), whereas gamma is derived\
    \ from a measure of the utility of a given set of simulated income paths. Here,\
    \ one may formulate a utility function with the same EOIS and risk parameters\
    \ as the Epstein–Zin utility"
