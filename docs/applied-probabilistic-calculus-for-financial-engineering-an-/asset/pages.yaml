    # Details


    This function computes the estimated centroid vector from a single complete sort
    using the analytical approximation as described in Almgren and Chriss, Portfolios
    from Sorts. The centroid is estimated and then scaled such that it is on a scale
    similar to the asset returns. By default, the centroid vector is scaled according
    to the median of the asset mean returns.


    # Value


    The estimated first moments based on ranking views


    # See Also


    centroid.complete.mc centroid.sectors centroid.sign centroid.buckets


