    # 2.3.1 A Probabilistic Model for the Stock Market


    In a stock market that reflects a realistic probabilistic characteristic, the
    stock price $X_t$ at any time $t$, may be considered as one having both


    +   i) a Browning motion term $\sigma_t dW_t$ and

    +    ii) a Newtonian characteristic term based upon $dt$: $\mu_t(X_t, t) dt$,


    so that the infinitesimal change of $X$ may be represented by


    $dX_t = \sigma_t dW_t + \mu_t(X_t, t) dt$

    (2.16)


    in which


    +   a) the drift $\mu_t$ can depend on the time $t$,

    +    b) the drift $\mu_t$ can depend on the value of $X$ and $W_t$ up to time
    $t$, and

    +    c) the noisiness or volatility, $\sigma_t$, of the process $X$ can depend
    on the history of the process.


    This approach, however, does provide a practical (though not universal) definition
    of a probabilistic process (sometimes known as a stochastic process).


    # 2.3.2 Probabilistic Processes for the Stock Market Entities


    A probabilistic process $X$ is a continuous process such that


    $X_t = X_0 + \int_{0}^{t} \sigma_s dW_s + \int_{0}^{t} \mu_s ds$

    (2.17)


    in which $\sigma$ and $\mu$ are random processes such that $\int_{0}^{t} \sigma_s^2
    + |\mu_s| ds$ is finite for all times $t$, with probability 1. The differential
    form of Equation (2.17) is


    $dX_t = \sigma_t dW_t + \mu_t dt$

    (2.18)'
