    # 4.4 Using R in Data Analysis in Financial Engineering


    In financial investigations, after preparing the collected data sets (as discussed
    in Section 3.1) to undertake financial analysis, the first step is to enter the
    data sets into the R environment. Once the data sets are placed within the R environment,
    analysis will process the data to obtain results leading to creditable conclusions,
    and likely recommendations for definitive courses of actions to improve pertinent
    aspects of public and personal data. Several methods for data set entry will be
    examined.


    # 4.4.1 Entering Data at the R Command Prompt


    Data Frames and Data sets: For many financial investigators, the terms data frame
    and data set may be used interchangeably.


    Data sets: In many applications, a complete data set contain several data frames,
    including the real data that have been collected.


    Data Frames: Rules for data frames are similar to those for arrays and matrices,
    introduced earlier. However, data frames are more complicated than arrays. In
    an array, if just one cell is a character, then all the columns will be characters.
    On the other hand, a data frame can consist of the following:


    +   - A column of "IDnumber," which is numeric

    +   - A column of "Name," which is character.'
  merge: -1
  img_proc: true
