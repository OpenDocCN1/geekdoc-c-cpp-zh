    # chartSeries Create Financial Charts


    # Description


    Charting tool to create standard financial charts gives a time series like object.
    Serves as the base function for future technical analysis additions. Possible
    chart styles include candles, matches (1 pixel candles), bars, and lines. Chart
    may have white or black background.


    reChart allows for dynamic changes to the chart without having to respecify the
    full chart parameters.


    # Usage


    ```

    chartSeries(x, type = c("auto",

    "candlesticks", "matchsticks",

    "bars","line"), subset = NULL,

    show.grid = TRUE, name = NULL,

    time.scale = NULL,

    log.scale = FALSE, TA = ''addVo()'',

    TAsep='';'', line.type = "1",

    bar.type = "ohlc",

    theme = chartTheme("black"),

    layout = NA,

    major.ticks=''auto'', minor.ticks=TRUE,

    yrange=NULL,

    plot=TRUE,

    up.col,dn.col,color.vol

    = TRUE, multi.col = FALSE, ...)

    reChart(type = c("auto", "candlesticks",

    "matchsticks","bars","line"),

    subset = NULL,

    show.grid = TRUE,

    chartSeries 23

    name = NULL,

    time.scale = NULL,

    line.type = "1",

    bar.type = "ohlc",

    ```'
