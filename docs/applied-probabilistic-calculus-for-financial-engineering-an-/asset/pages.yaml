  md: '# Investment Results of the XYZ–LPL (Linsco (1968) and Private Ledger (1973))


    is illustrated as follows:


    LPL Financial Holdings (commonly referred to as LPL Financial) is the largest
    independent broker-dealer in the United States. The company has more than 14,000
    financial advisors, over $500 billion in advisory and brokerage assets, and generated
    approximately $4.3 billion in annual revenue for the 2015 fiscal year. LPL Financial
    was formed in 1989 through the merger of two brokerage firms – Linsco (established
    in 1968) and Private Ledger (established in 1973) – and has since expanded its
    number of independent financial advisors both organically and through acquisitions.
    LPL Financial has main offices in Boston, Charlotte, and San Diego. Approximately
    3500 employees support financial institutions, advisors, and technology, custody,
    and clearing service subscribers with enabling technology, comprehensive clearing
    and compliance services, practice management programs and training, and independent
    research.


    LPL Financial advisors help clients with a number of financial services, including
    equities, bonds, mutual funds, annuities, insurance, and fee-based programs. LPL
    Financial does not develop its own investment products, enabling the firm''s investment
    professionals to offer financial advice free from broker/dealer-inspired conflicts
    of interest.


    Revenue: US$4.37 billion (2014)

    Headquarters: 75 State Street, Boston, MA, USA

    Traded as: NASDAQ: LPLA (https://en.wikipedia.org/wiki/LPL_Financial)


    Over the past 10 years, the Smiths'' received, on a monthly basis, a net income
    of $10,947.03. Thus, annually, the income has been


    $10,947.02 × 12 = $131,364.36.


    And, the total income for the past 10 years has been


    $131,364.36 × 10 = $1,313,643.60.


    Illustrated hereunder in Figure 1.3 is a snapshot of one of the four investment
    accounts of the Smiths''. Note the following special features of this portfolio:


    +   1) The green area represents the investment amount: As portions of the capital
    were being periodically withdrawn (to satisfy U.S.A. Federal Regulations), the
    actual investment amount decreases in time. This loss has been more than made
    up by the blue area!

    +   2) The blue area is the portfolio value of the account.


    This showed that, as steady income is being generated, the portfolio value grows
    more than the amounts continually withdrawn – periodically and regularly.


    Clearly, the goals of the investment have been achieved!'
