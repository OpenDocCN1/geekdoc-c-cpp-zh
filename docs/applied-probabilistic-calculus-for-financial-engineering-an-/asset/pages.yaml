- pgno: 198
  md: 'Compare this formula with (3.113) for the variance of the posterior mean estimate:


    M = τΣ - τΣP^T (P τΣ P^T + Ω)^{-1} P τΣ  (3.117)


    Intuition indicates that the updated posterior estimate of the mean will be more
    precise (viz., lower variance) than the prior estimate, thus one would like the
    posterior (conditional) variance to always be less than the prior variance. The
    Black–Litterman posterior variance achieves this goal and arrives at the well-known
    result of Bayesian analysis in the case of unknown mean and known precision. As
    a result, it seems one should prefer these results over Qian and Gorman.


    # Directions for the Future


    Future directions for this research include reproducing the results from the original
    papers: Black and Literman (1991) and Black and Literman (1992). These results
    have the additional complication of including currency returns and partial hedging.


    Future work should include more information on process and a synthesized model
    containing the best elements from the various authors. A full example from the
    CAPM equilibrium, through the views to the final optimized weights would be useful,
    and a worked example of the two-factor model from Krishnan and Mains (2005) would
    also be useful. Meucci (2006, 2008) provides further extensions to the Black–Litterman
    model for nonnormal views and views on parameters other than return. This allowed
    one to apply the Black–Litterman model to new areas such as alternative investments
    or derivatives pricing. His methods are based on simulation and do not provide
    a closed-form solution.


    # An Asset Allocation Process Using the Black–Litterman Model


    When used as part of an asset allocation process, the Black–Litterman model provided
    for estimates that lead to more stable and more diversified portfolios than estimates
    derived from historical returns when used with unconstrained mean-variance optimization.
    Owing to this significant property, an investor using mean-variance optimization
    is less likely to require artificial constraints to get a portfolio without extreme
    weights. Unfortunately, this model requires a broad variety of data, some of which
    may not be readily available!


    +   - First, the investor needs to identify their investable universe and find
    the market capitalization of each asset. Then, they need to estimate a covariance
    matrix for the excess returns of the assets. This is most often done using historical
    data for an appropriate time window: Both Literman (2003) and Bevan and Winkelmann
    (1998) provided details on the process used to compute covariance matrices at
    Goldman Sachs.

    +   - In the literature, monthly covariance matrices are most commonly estimated
    from 60 months of historical excess returns.'
