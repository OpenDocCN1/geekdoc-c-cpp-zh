  md: 'In a data frame:


    +   a) each variable can have long variable descriptions and

    +   b) a factor can have "levels" or value levels.


    These properties can be transferred from the original data set in other software
    formats (such as SPS, Stata, etc.). They can also be created in R.


    # 4.4.1.1 Creating a Data Frame for R Computation Using the EXCEL Spreadsheet
    (on a Windows Platform)


    As an example, using a typical set of real case control epidemiologic research
    data, consider the data set in Table B, from a clinical trial to evaluate the
    efficacy of maintenance chemotherapy for case subjects with acute myelogenous
