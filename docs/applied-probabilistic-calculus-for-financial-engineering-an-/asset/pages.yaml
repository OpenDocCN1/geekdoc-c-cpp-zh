  md: "reference model used the prior variance of returns for the posterior, they\
    \ did not need any derivation of the variance. One may apply a variant of their\
    \ measure to the Canonical Reference Model as well. They proposed the use of the\
    \ squared Mahalanobis distance of the posterior returns from the prior returns.\
    \ This includes τ as to match the Canonical Reference Model, but their work did\
    \ not include τ as they used the Alternative Reference Model:\n\n$$M(q) = (\\\
    mu_{BL} - \\mu)(\\tau\\Sigma)^{-1}(\\mu_{BL} - \\mu)$$  \n(3.154)\n\nIt is essentially\
    \ measuring the distance from the prior, μ, to the estimated returns, μ_BL, normalized\
    \ by the uncertainty in the estimate. One may use the covariance matrix of the\
    \ prior distribution as the uncertainty. The squared Mahalanobis distance is distributed\
    \ as χ²(q) where q is the number of assets. This may easily be used in a hypothesis\
    \ test. Thus, the probability of this event occurring can be computed as\n\n$$P(q)\
    \ = 1 - F(M(q))$$  \n(3.155)\n\nwhere F(M(q)) is the CDF of the chi-square distribution\
    \ of M(q) with n degrees of freedom.\n\nFinally, to identify which views contribute\
    \ most highly to the distance away from the equilibrium, one may also compute\
    \ sensitivities of the probability to each view. Use the chain rule to calculate\
    \ the partial derivatives\n\n$$\\partial P(q)/\\partial q = \\partial P/\\partial\
    \ M \\, \\partial M/\\partial(\\mu_{BL}) \\, \\partial \\mu_{BL}/\\partial q$$\
    \  \n(3.156)\n\n$$\\partial P(q)/\\partial q = -f(M)[2(\\mu_{BL} - \\mu)][(P\\\
    tau\\Sigma P + \\Omega)^{-1}P]$$  \n(3.157)\n\nwhere f(M) is the PDF of the chi-square\
    \ distribution with n degrees of freedom for M(q). Note that this measure is very\
    \ similar to (3.151) Theil's measure of compatibility between the prior and the\
    \ views.\n\nAn example in their paper resulted in an initial probability of 94%\
    \ that the posterior is consistent with the prior. They specified that their investor\
    \ desires this probability to be no less than 95% (a commonly used confidence\
    \ level in hypothesis testing), and thus they would adjust their views to bring\
    \ the probability in line. Given that they also computed sensitivities, their\
    \ investor can identify what views are providing the largest marginal increase\
    \ in their measure and the investor may then adjust these views. These sensitivities\
    \ are especially useful since some views may actually be pulling the posterior\
    \ toward the prior, and the investor could strengthen these views or weaken views\
    \ that pull the posterior away from the prior. The last point may seem nonintuitive.\
    \ Given that the views are indirectly coupled by the covariance matrix, one would\
    \ expect that the views only push the posterior distribution away from the prior.\
    \ However, because the views can be conflicting, either directly or via the correlations,\
    \ any individual view may have a net impact pushing the posterior closer to the\
    \ prior, or pushing it further away."
