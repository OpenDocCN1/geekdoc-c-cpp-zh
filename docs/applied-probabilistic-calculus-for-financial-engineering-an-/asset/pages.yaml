    # 3.3 The Black–Litterman Model


    With the foregoing discussions of the development of the study of asset allocation
    in terms of Markowitz''s Modern Portfolio Theory of the mean-variance approach
    to asset allocation and portfolio optimization, this may well be the suitable
    point of departure to go from the Markowitz model on to the Black–Litterman model.


    Asset allocation is the continuing decision facing an investor who must decide
    on the optimum allocation of the assets in the portfolio across a few (say up
    to 20) asset classes. For example, a globally invested mutual fund must select
    the proportions of the total investment for allocation to each major country or
    global financial region.


    It is true that the Modern Portfolio Theory (the mean-variance approach of Markowitz)
    may provide a plausible solution to this problem once the expected returns and
    covariances of the assets are available. Thus, while Modern Portfolio Theory is
    an important theoretical approach, its application does encounter a serious problem:
    Although the covariances of a few assets may be adequately estimated, it is difficult
    to ascertain (with reasonable estimates) of the Expected Returns!


    The Black–Litterman approach resolves this problem by the following:


    +   - Not requiring the use of input estimates of expected return.'
