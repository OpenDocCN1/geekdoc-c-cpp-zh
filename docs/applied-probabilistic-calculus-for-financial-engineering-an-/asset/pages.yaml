    # Solutions to Exercise 3: The Black–Scholes Equation


    3. For the Black–Scholes equation (RE-3.1),


    Let


    C = E f(S/E)                                    (RE-3.5)


    for some function f, then


    C/E = f(S/E)                                    (RE-3.6)


    Apply the change of variables stated in (RE-3.5) to reduce the Black–Scholes equation
    (RE-3.1) to its simpler form:


    ∂C/∂t + 1/2 σ² E² ∂²C/∂E² - r E ∂C/∂E = 0      (RE-3.7)


    which is (RE-3.2).'
  merge: -1
  img_proc: true
- pgno: 253
  md: '**Proof:**


    Since $C = Ef(S/E)$, from (RE-3.5),


    $$\begin{aligned}

    \frac{\partial C}{\partial E} &= \frac{\partial}{\partial E}[Ef(S/E)] \\

    &= f(S/E) + E\frac{\partial f(S/E)}{\partial E} \\

    &= f(S/E)\cdot 1 + E\cdot S\left(-\frac{1}{E^2}\right)\frac{\partial f}{\partial
    E} \\

    &= f(S/E) - (S/E)f''(S/E)

    \end{aligned}$$


    therefore, upon substituting for $f(S/E)$ from (RE-3.6):


    $$\frac{\partial C}{\partial E} = C/E - (S/E)F''(S/E) \tag{RE-3.8}$$


    Again, since $C = Ef(S/E)$, from (RE-3.4),


    $$\begin{aligned}

    \frac{\partial C}{\partial S} &= \frac{\partial}{\partial S}[C] \\

    &= \frac{\partial}{\partial S}[Ef(S/E)] \\

    &= E\frac{\partial}{\partial S}[f(S/E)] \\

    &= E(1/E)\frac{\partial}{\partial S}[f(S/E)] \\

    &= (1)f''(S/E) \\

    &= f''(S/E)

    \end{aligned}$$


    Therefore,


    $$\frac{\partial C}{\partial S} = f''(S/E) \tag{RE-3.9}$$


    or


    $$\frac{\partial C}{\partial S} = f''(S/E) = f''$$


    Hence,


    $$S\frac{\partial C}{\partial S} = Sf''(S/E) = Sf''$$


    Again, from (RE-3.5),


    $$C = Ef(S/E)$$


    Therefore,


    $$\begin{aligned}

    \frac{\partial C}{\partial S} &= \frac{\partial}{\partial S}[Ef(S/E)] \\

    &= (1/E)\frac{\partial}{\partial S}[Ef(S/E)] \\

    &= \frac{\partial}{\partial S}(Ef(S/E)] \\

    &= f''(S/E)

    \end{aligned} \tag{RE-3.10}$$'
  merge: -1
  img_proc: true
- pgno: 254
  md: "Therefore,\n\n$$E\\partial/\\partial E(C)=\\partial/\\partial E[Ef(S/E)]$$\n\
    \nupon substituting for C from (RE-3.5).\n\nAlso, from (RE-3.8),\n\n$$\\partial\
    \ C/\\partial E = C/E - (S/E)F(S/E)$$  (RE-3.11)\n\nHence,\n\n$$\\partial C/\\\
    partial E = \\partial/\\partial E[Ef(S/E)]$$\n\n$$= f(S/E)$$  (RE-3.12)\n\nNow,\n\
    \n$$E\\partial C/\\partial E = E[C/E - (S/E)F(S/E)],\\text{ from(RE-3.11)}$$ \n\
    $$= C - SF(S/E)$$\n$$= C - S\\partial C/\\partial S,\\text{ from(RE-3.10)}$$\n\
    \nHence,\n\n$$S\\partial C/\\partial S = C = E\\partial C/\\partial E$$  (RE-3.13)\n\
    \nwhich is an important intermediate result.\n\nSimilarly, it may be shown that\n\
    \n$$S^2\\partial^2 C/\\partial S^2 = E^2\\partial^2 C/\\partial E^2$$  (RE-3.14)\n\
    \nwhich is a final result that may be readily obtained as follows:\n\nSince $S\\\
    partial C/\\partial S = C - E\\partial C/\\partial E$, from (RE-3.13)\n\n$$\\\
    partial C/\\partial S = C/S - (E/S)\\partial C/\\partial E$$\n\nand\n\n$$\\partial^2\
    \ C/\\partial S^2 = \\partial/\\partial S\\{C/S - (E/S)\\partial C/\\partial E\\\
    }$$\n$$= \\partial/\\partial S\\{C/S\\} - \\partial/\\partial S\\{(E/S)(\\partial\
    \ C/\\partial E)\\}$$\n$$= -(C/S^2) + (E/S^2)(\\partial C/\\partial E)$$\n\nnamely,\n\
    \n$$S^2\\partial^2 C/\\partial S^2 = -C + E(\\partial C/\\partial E)$$  (RE-3.15)\n\
    \nMoreover, since\n\n$$\\partial C/\\partial E = F(S/E),\\text{ from (RE-3.12)}$$\
    \ \n$$E\\partial C/\\partial E = EF(S/E) = C,\\text{ from (RE-3.5)}$$"
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Therefore,


    ∂C/∂E = C/E  (RE-3.16)


    and


    (∂²C/∂E²) = ∂/∂E[∂C/∂E]


    by definition


    = ∂/∂E[C/E], from(RE-3.16)


    = -(C/E²) + (1/E)∂C/∂E


    by the differentiation of a quotient rule


    or


    E²(∂²C/∂E²) = -C + E(∂C/∂E)  (RE-3.17)


    Combining (RE-3.15) and (RE-3.17), one finally obtains (RE-3.14), as required.


    And now, upon substituting for the terms S²∂²C/∂S² and S∂C/∂S, from (RE-3.14)
    and (RE-3.13), respectively, into the Black–Scholes equation (RE-3.1), the result
    is


    ∂C/∂t + 1/2 σ² S² ∂²C/∂S² + r S ∂C/∂S - r C = 0  (RE-3.1)


    namely,


    ∂C/∂t + 1/2 σ² (S² ∂²C/∂S²) + r(S∂C/∂S) - r C = 0


    namely,


    ∂C/∂t + 1/2 σ² (E² ∂²C/∂E²) + r(C - E∂C/∂E) - r C = 0


    namely,


    ∂C/∂t + 1/2 σ² (E² ∂²C/∂E²) - r E ∂C/∂E = 0  (RE-3.2)


    which is (RE-3.7), as required.'
