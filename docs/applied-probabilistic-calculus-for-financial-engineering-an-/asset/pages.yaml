- pgno: 178
  md: '+   - When the investor is 100% confident in their views, then α will be 0.

    +   - When they are totally uncertain, then α will be ∞.


    Note that (3.124) is exact, it is identical to Equation (3.122) and the Ω used
    by He and Litterman (1999) because it is a 1 × 1 matrix. This allows one to find
    a closed-form solution to the problem of Ω for Idzorek’s confidence.


    First one substitutes (3.119)


    $$\Pi = \Pi + [1/(1 + \alpha)][P^{-1}Q - \Pi] \tag{3.119}$$


    into

    $$\underline{\Pi} = \delta\Sigma \underline{w}, \tag{3.83}$$


    or

    $$\underline{w} = \Pi(\delta\Sigma)^{-1}$$


    yielding

    $$\underline{w} = \{\Pi + [1/(1 + \alpha)][P^{-1}Q - \Pi]\}(\delta\Sigma)^{-1}
    \tag{3.125}$$


    Now one may solve (3.125) at the boundary conditions for α:

    $$\lim_{\alpha\to\infty} w_{mkt} = \Pi(\delta\Sigma)^{-1} \tag{3.126}$$

    $$\lim_{\alpha\to0} w_{100} = P^{-1}Q(\delta\Sigma)^{-1} \tag{3.127}$$'
