    $df_t = \mu_t \, dt$

    (2.14)


    where $\mu_t$ is the slope or drift scaling function.


    From this simple beginning, one may consider all other possible Newtonian functions.
    A likely possibility is one in which the drift $\mu_t$ may depend on the existing
