- pgno: 78
  md: '# 3.2 Modern Theories of Portfolio Optimization


    In making investment decisions in asset allocation, the modern portfolio theory
    focuses on potential return in relation to the concomitant potential risk. The
    strategy is to select and then evaluate individual investments (securities, bonds,
    funds, derivatives, commodities, etc.) as part of an overall portfolio rather
    than solely for their own strengths or weaknesses as an investment.


    Asset allocation is therefore a primary tactic—because it allows investors to
    create portfolios—to obtain the strongest possible return without assuming a greater
    level of risk than they would like to bear!


    Another critical feature of an acceptable portfolio theory is that investors must
    be rewarded, in terms of realizing a greater return, for assuming greater risk.
    Otherwise, there would be little motivation and incentive to make investments
    that might result in a loss of principal!


    With such preconditions, two outstanding theories of portfolio allocation are
    presented herein:


    +   1) The Markowitz model

    +   2) The Black–Litterman model


    There are numerous modifications/improvements for these “standard bearers” that
    maintain a fruitful area in research and development in mathematical finance and
    financial engineering. In this chapter, these two approaches will be presented,
    followed by the more favored modifications of these theories!


    # 3.2.1 The Markowitz Model of Modern Portfolio Theory (MPT)


    **Modern Portfolio Theory** Modern portfolio theory, or mean variance analysis,
    is a mathematical model for building a portfolio of financial assets such that
    the expected return is maximized for a given level of risk, defined as the variance.
    Its key feature is as follows:


    > > “The risks of the asset and the return of profits should not be assessed by
    themselves, but by how it contributes to an overall risk and return of the portfolio.”


    # 3.2.1.1 Risk and Expected Return


    The MPT assumes that investors are risk-averse, meaning that given the two portfolios
    that offer the same expected return, investors will prefer the less risky one:
    Thus, an investor will take on increased risk only if compensated by higher expected
    returns. Conversely, an investor who wants higher expected returns must accept
    more risk.'
