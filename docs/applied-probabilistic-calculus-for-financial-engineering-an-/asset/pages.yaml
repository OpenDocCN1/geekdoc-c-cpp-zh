  md: 'Idzorek (2005) presents a means to calibrate the confidence or variance of
    the investors views in a simple and straightforward method.


    Next is a section on measures of extremity or quality of views. Fusai and Meucci
    (2003) proposed a way to measure how consistent a posterior estimate of the mean
    is with regard to the prior, or some other estimate. Braga and Natale (2007) described
    how to use Tracking Error to measure the distance from the equilibrium to the
    posterior portfolio. Also included are additional original work on using relative
    entropy to measure quality of the views.


    Finally, larger extensions to the model such as Krishnan and Mains (2006) present
    a method to incorporate additional factors into the model. Qian and Gorman (2001)
    presented a method to integrate views on the covariance matrix as well as views
    on the returns.


    # Idzorek’s Extension


    Idzorek’s apparent goal was to reduce the complexity of the Black–Litterman model
    for nonquantitative investors. He achieved this by allowing the investor to specify
    the investors’ confidence in the views as a percentage (0–100%) where the confidence
    measures the change in weight of the posterior from the prior estimate (0%) to
    the conditional estimate (100%). This linear relation is shown in Equation (3.123):


    confidence = ( w − w_nkt ) / ( w_100 − w_nkt )  (3.123)


    where

    w_100 is the weight of the asset under 100% certainty in the view,

    w_nkt is the weight of the asset under no views, and

    w is the weight of the asset under the specified view.


    Also provided was a method to back out the value of ω required to generate the
    proper tilt (change in weights from prior to posterior) for each view. These values
    may then be combined to form Ω, and the model is used to compute posterior estimates.


    Idzorek includes τ in the formulas, but because of the use of the Alternative
    Reference Model and his formula (3.123), there is no need to use τ with the Idzorek
    method.


    The paper discussed solving for ω using a least-squares method. One may actually
    solve this analytically. The next section will provide a derivation of the formulas
    required for this solution.


    First one may use the following form of the uncertainty of the views. Idzorek
    includes τ in this formula, but he uses the Alternative Reference Model so that
    one may drop τ from the formulation of his method:


    Ω = α P Σ P^T  (3.124)


    where α, the coefficient of uncertainty, is a scalar quantity in the interval
    [0, ∞].'
