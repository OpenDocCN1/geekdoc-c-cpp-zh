    # An Example of Idzorek''s Extension


    Idzorek described the steps required to implement his extension in his paper,
    but did not provide a complete worked example. Here, one will work through the
    example from where Idzorek left off! Idzorek''s example includes three views:


    +   - International Development Equity will have absolute excess return of 5.25%,
    Confidence 25.0%.

    +   - International Bonds will outperform U.S. bonds by 25 bps, Confidence 50.0%.

    +   - U.S. Growth Equity will outperform U.S. Value Equity by 2%, Confidence 65.0%.


    Idzorek defined the steps that include calculations of w100 and then the calculation
    of ω for each view given the desired change in the weights. From the previous
    section, one noted that one only need to take the investor''s confidence for each
    view, plug it into (3.131), and calculate the value of alpha. Then one plugs α,
    P, and Σ into Equation (3.124) and compute the value of ω for each view. At this
    point, one may assemble the Ω matrix and proceed to solve for the posterior returns
    using (3.104) or (3.105).


    In presenting this example, the results for each view will be shown including
    w_mkt and w_100 in order to make the working of the extension more transparent.
    Tables 3.8–3.10 show the results for a single view.


    Then one may use the freshly computed values for the Ω matrix with all views specified
    together and arrive at the final result shown in Table 3.11 blending all three
    views together.


