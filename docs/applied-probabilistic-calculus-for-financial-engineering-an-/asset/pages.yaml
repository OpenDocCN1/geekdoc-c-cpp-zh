    \ \\beta_1 x_{1j} + \\beta_2 x_{2j} + \\beta_3 x_{3j} + \\cdots + \\beta_p x_{pj}\
    \ + e_j \\dots \\quad (4.5)$\n\nwhere $y_j$ is a typical value from one of the\
    \ subpopulations of $Y$ values, and the $\\beta_i$ values are the regression coefficients.\n\
    \n$x_{1j}, x_{2j}, x_{3j}, \\dots, x_{pj}$ are, respectively, particular values\
    \ of the independent variables $X_1, X_2, X_3, \\dots, X_p$, and $e_j$ is a random\
    \ variable with mean 0 and variance $\\sigma^2$, the common variance of the subpopulation\
    \ of $Y$ values. Generally, $e_j$ is assumed normal and independently distributed.\n\
    \nWhen Equation (4.1) consists of one dependent variable and two independent variables,\
    \ the model becomes\n\n$y_j = \\beta_0 + \\beta_1 x_{1j} + \\beta_2 x_{2j} + e_j\
    \ \\dots \\quad (4.6)$\n\nA plane in three-dimensional space may be fitted to\
    \ the data points. For models containing more than two variables, it is a hyperplane.\n\
    \nLet $f_i = \\beta_0 + \\beta_1 x_{1i} + \\beta_2 x_{2i}$\n\nNow, $e_i = y_i\
    \ - f_i$, forming a vector.\n\nIf $y$ is the mean of the observed data,\n\nnamely,\
    \ $\\bar{y} = (1/n)\\sum y_i$, for $i = 1,2,3,\\dots,n$\n\nthen the variability\
    \ of the data set may be measured using three sums of squares (proportional to\
    \ the variance of the data):\n\n+   1) The Total Sum of Squares (proportional\
    \ to the variance of the data):\n+   \n+   $SS_{total} = \\sum (y_i - \\bar{y})^2\
    \ \\quad (4.7)$\n+   \n+   2) The Regression Sum of Squares:\n+   \n+   $SS_{reg}\
    \ = \\sum (f_i - \\bar{y})^2 \\quad (4.8)$\n+   \n+   3) The Sum of Squares of\
    \ Residuals:\n+   \n+   $SS_{res} = \\sum (y_i - f_i)^2 = \\sum e_i^2 \\quad (4.9)$\n\
    \nThe most general definition of the coefficient of multiple determination is\n\
    \n$R^2_{y.12\\ldots n} \\equiv 1 - \\left(SS_{res}/SS_{total}\\right) \\quad (4.10)$\n\
    \nThe parameter of interest in this model is the coefficient of multiple determination,\
    \ $R^2_{y|1,2,3,\\dots,n}$, obtained by dividing the explained sum of squares\
    \ by the total sum of squares:\n\n$R^2_{y.12\\ldots n} = \\sum (y_i - f_i)^2 /\
    \ \\sum (y_i - \\bar{y})^2 = SSR/SSE \\quad (4.11)$"
