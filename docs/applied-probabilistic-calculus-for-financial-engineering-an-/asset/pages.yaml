- pgno: 204
  md: "A general problem in using Bayes' theory is to identify an intuitive and tractable\
    \ prior distribution. One of the core assumptions of the Black-Litterman model\
    \ (and Mean-Variance optimization) is that asset returns are normally distributed.\
    \ For that reason, one confines to the case of normally distributed conditional\
    \ and prior distributions. Given that the inputs are normal distributions, it\
    \ follows that the posterior will also be normally distributed. When the prior\
    \ distribution and the posterior have the same structure, the prior is known as\
    \ a conjugate prior.\n\nGiven interest, there is nothing to keep us from building\
    \ variants of the Black-Litterman model using different distributions; however,\
    \ the normal distribution is generally the most straightforward.\n\nAnother core\
    \ assumption of the Black-Litterman model is that the variance of the prior and\
    \ the conditional distributions about the actual mean are known, but the actual\
    \ mean is not known. This case, known as \"Unknown Mean and Known Variance,\"\
    \ is well documented in the Bayesian literature. This matches the model that Theil\
    \ uses where one has an uncertain estimate of the mean, but know the variance.\n\
    \nRemarks: The significant distributions are defined here below:\n\n+   1) The\
    \ prior distribution\n+   \n+   \\(P(A) \\sim N(x, S/n)\\)  (3.131)\n+   \n+ \
    \  where \\(S\\) is the sample variance of the distribution about the mean, with\
    \ \\(n\\) samples, then \\(S/n\\) is the variance of the estimate of \\(x\\) about\
    \ the mean.\n+   \n+   The conditional distribution\n+   \n+   \\(P(B|A) \\sim\
    \ N(\\mu, \\Omega)\\)  (3.132)\n+   \n+   where \\(\\Omega\\) is the uncertainty\
    \ in the estimate \\(\\mu\\) of the mean, it is not the variance of the distribution\
    \ about the mean.\n+   \n+   2) Then the posterior distribution is specified by\n\
    +   \n+   \\(P(A|B) \\sim N\\{[\\Omega^{-1}\\mu + nS^{-1}x][\\Omega^{-1} + nS^{-1}]^{-1},\
    \ (\\Omega^{-1} + nS^{-1})^{-1}\\}\\)  (3.133)\n+   \n+   3) The variance term\
    \ in (3.133) is the variance of the estimated mean about the actual mean. In Bayesian\
    \ statistics, the inverse of the variance is known as the precision. One may describe\
    \ the posterior mean as the weighted mean of the prior and conditional means,\
    \ where the weighting factor is the respective precision.\n+   \n+   4) Furthermore,\
    \ the posterior precision is the sum of the prior and conditional precision. Equation\
    \ (3.133) requires that the precision of the prior and conditional be noninfinite,\
    \ and that the sum is nonzero. Infinite precision corresponds to a variance of\
    \ 0, or absolute confidence."
  merge: -1
  img_proc: true
- pgno: 205
  md: '5) Zero precision corresponds to infinite variance, or total uncertainty. As
    a first check on the formulas, one may test the boundary conditions to see if
    they agree with one''s intuition. If one examines (3.133) in the absence of a
    conditional distribution, it should collapse into the prior distribution.


    ~N([nS^{-1}]x[nS^{-1}]^{-1}, (nS^{-1})^{-1})  (3.134)


    ~N(x, S/n)  (3.135)


    As one may see in Equation (3.133), it does indeed collapse to the prior distribution.
    Another important scenario is the case of 100% certainty of the conditional distribution,
    where S_r or some portion of it is 0, and thus S is not invertible. One may transform
    the returns and variance from formula (3.133) into a form more easy to work within
    the 100% certainty case.


    P(A|B) ~ N(x + (S/n)[Ω + S/n]^{-1}[μ - x], [(S/n) - (S/n)(Ω + S/n)^{-1}(S/n)])  (3.136)


    This transformation relies on the result that


    (A^{-1} + B^{-1})^{-1} = A - A(A + B)^{-1}A  (3.137)


    It is easy to see that when S is 0 (viz., 100% confidence in the views), the posterior
    variance will be 0. If Ω is positive infinity (the confidence in the views is
    0%), the posterior variance will be (S/n).


    Later, one will revisit Equations (3.133) and (3.136) where one transforms these
    basic equations into the various parts of the Black–Litterman model. Equation
    (3.122) contains derivations of the alternative Black–Litterman formulas from
