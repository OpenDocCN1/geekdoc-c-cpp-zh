  md: '# Efficient Frontiers


    Different combinations of assets may produce different levels of return. The Efficient
    Frontier represents the best of these combinations, that is, those that produce
    the maximum expected return for a given level of risk. The efficient frontier
    is the basis for modern portfolio theory.


    # Example of Efficient Frontiers


    Markowitz, in 1952 (see Figure 3.23), published a formal portfolio selection model
    in The Journal of Finance. He continued to develop and publish research on the
    subject over the next 20 years, eventually winning the 1990 Nobel Memorial Prize
    in Economic Science for his work on the efficient frontier and other contributions
    to modern portfolio theory. According to Markowitz, for every point on the efficient
    frontier, there is at least one portfolio that can be constructed from all available
    investments that has the expected risk and return corresponding to that point.
    An example is given here: Notice that the efficient frontier allows investors
    to understand how an expected returns of a portfolio vary with the amount of risk
    taken.


    An important part of the efficient frontier is the relationship that the invested
    assets have with one another. Some assets'' prices move in the same direction
    under similar circumstances, while others move in opposite directions. The more
    out of step that the assets in the portfolio are (i.e., the lower their covariance),
    the smaller the risk (standard deviation) of the portfolio that combines them.
    The efficient frontier is curved because there is a diminishing marginal return
    to risk. Each unit of risk added to a portfolio gains a smaller and


    ![](img/551ca8853d2ba8528201e7a57e5006b4_135_0.png)


    Figure 3.23 The efficient frontier according to Markowitz (1952).'
