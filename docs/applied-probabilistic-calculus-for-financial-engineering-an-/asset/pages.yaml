- pgno: 82
  md: 'Thus, in the absence of a risk-free asset, an investor may achieve any desired
    efficient portfolio even if all that is available is a pair of efficient mutual
    funds:


    +   1) If the location of the desired portfolio on the frontier is between the
    locations of the two mutual funds, then both mutual funds may be held in positive
    quantities.

    +   2) If the desired portfolio is outside the range spanned by the two mutual
    funds, then one of the mutual funds must be sold short (held in negative quantity)
    while the size of the investment in the other mutual fund must be greater than
    the amount available for investment (the excess being funded by the borrowing
    from the other fund).


    # 3.2.1.5 Risk-Free Asset and the Capital Allocation Line


    A risk-free asset is the asset that pays a risk-free rate. In practice, short-term
    government securities (such as U.S. Treasury Bills) are considered a risk-free
    asset, because they pay a fixed rate of interest and have exceptionally low default
    risks (none, in the United States, so far!). The risk-free asset has zero variance
    in returns (being risk-free). It is also uncorrelated with any other asset (by
    definition, since its variance is zero).


    As a result, when it is combined with any other asset or portfolio of assets,
    the change in return is linearly related to the change in risk as the proportions
    in the combination vary.


    # 3.2.1.6 The Sharpe Ratio


    In mathematical finance, the Sharpe Ratio (or the Sharpe Index, or the Sharpe
    Measure, or the Reward-to-Variability Ratio) is an index for examining the performance
    (or risk premium) per unit of deviation in an investment asset or a trading strategy,
    typically referred to as risk (and is a deviation risk measure). It is named after
    W.F. Sharpe (recipient of the 1990 Nobel Memorial Prize in Economic Sciences).


    In application, the Sharpe Ratio is similar to the Information Ratio; whereas
    the Sharpe Ratio is the excess return of an asset over the return of a risk-free
    asset divided by the variability or standard deviation of returns, the Information
    Ratio is the active return to the most relevant benchmark index divided by the
    standard deviation of the active return.


    # 3.2.1.7 The Capital Allocation Line (CAL)


    When a risk-free asset is included, the half-line shown in Figure 3.2 becomes
    the new efficient frontier: It is tangent to the hyperbola at the pure risky portfolio
    with the highest Sharpe Ratio. Its vertical intercept represents a portfolio with
    100% of holdings in the risk-free asset; the tangency with the hyperbola'
