    CRAN checks: BLCOP results


    # Downloads:


    Run the following example in the R domain:


    ```

    optimalPortfolios

    ```


    *Calculates Optimal Portfolios under Prior and Posterior Distributions*


    # Description


    These are wrapper functions that calculate optimal portfolios under the prior
    and posterior return distributions. optimalPortfolios works with a user-supplied
    optimization function, although simple Markowitz minimum-risk optimization is
    done with solve.QP from quadprog if none is supplied.


    optimalPortfolios.fPort is a generic utility function that calculates optimal
    portfolios using routines from the fPortfolio package.


    # Usage


    ```

    optimalPortfolios(result, optimizer = .optimalWeights.simpleMV,

    ..., doPlot = TRUE, beside = TRUE)

    optimalPortfolios.fPort(result, spec = NULL,

    constraints = "LongOnly",

    optimizer = "minriskPortfolio",

    inputData = NULL,

    numSimulations = BLCOptions("numSimulations"))

    ```


    # Arguments


    result An object of class BL.Result.


    optimiser For optimalPortfolios, an optimization function. It should take as arguments
    a vector of means and a variance–covariance matrix, and should return a vector
    of optimal weights. For optimalPortfolios, the name of a fPortfolio function that
    performs portfolio optimization.'
