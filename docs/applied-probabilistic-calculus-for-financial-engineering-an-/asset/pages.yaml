    # Bivariate Normal Distribution


    Under the correlation model, the bivariates X and Y vary together in a joint distribution,
    which, if this joint distribution is a normal distribution, is called a bivariate
    normal distribution, from which inferences may be made based on the results of
    sampling properly from the population. If the joint distribution is known to be
    non-normal, or if the form is unknown, inferential procedures are invalid. The
    following assumptions must hold for inferences about the population to be valid
    when sampling from a bivariate distribution:


    +   i) For each value of X, there is a normally distributed subpopulation of Y
    values.

    +   ii) For each value of Y, there is a normally distributed subpopulation of
    X values.

    +   iii) The joint distribution of X and Y is a normal distribution called the
    bivariate normal distribution.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'iv) The subpopulation of Y values have the same variance.


    v) The sub-population of X values have the same variance.


    Two random variables X and Y are said to be jointly normal if they can be expressed
    in the form


    X = aU + bV  (4.1)

    Y = cU + dV  (4.2)


    where U and V are independent normal random variables.


    If X and Y are jointly normal, then any linear combination

    Z = s1 X + s2 Y  (4.3)

    has a normal distribution. The reason is that if one has X = aU + bV and Y = cU
    + dV for some independent normal random variables U and V, then


    Z = s1(aU + bV) + s2(cU + dV)  (4.4)

    = (a s1 + c s2)U + (b s1 + d s2)V


    Thus, Z is the sum of the independent normal variables (a s1 + c s2)U and (b s1
    + d s2)V, and is therefore normal.


    A very important property of jointly normal random variables is that zero correlation
    implies independence.


    # Zero Correlation Implies Independence


    If two random variables X and Y are jointly normal and are uncorrelated, then
    they are independent.


    (This property can be verified using multivariate transforms)


    # Multivariate Data Analysis


    The following are the two similar, but distinct, approaches used for multivariate
    data analysis:


    +   1) The Multiple Linear Regression Analysis: Assuming that a linear relationship
    exists between some variable Y, call the dependent variable, and n independent
    variables, X1, X2, X3, ..., Xn, which are called explanatory or predictor variables
    because of their use.


    The following are the assumptions underlying multiple regression model analysis:


    +   a) The Xi are nonrandom fixed variables indicating that any inferences drawn
    from sample data apply only to the set of X values observed, but not to larger
    collections of X. Under this regression model, correlation analysis is not meaningful.

    +   b) For each set of Xi values, there is a subpopulation of Y values. Usually,
    one assumes that these Y values are normally distributed.

    +   c) The variances of Y are all equal.

    +   d) The Y values are independent of the different selected set of X values.'
  merge: -1
  img_proc: true
