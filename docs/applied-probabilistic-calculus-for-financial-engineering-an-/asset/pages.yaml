  md: 'Now set up a portfolio long one option, V, and short an amount (∂V/∂S) stock.
    Note from above that this portfolio is hedged. The value of this portfolio, π,
    is

    π = V − (∂V/∂S)S   (3.242)


    The change dπ in the value of this portfolio over a small time interval dt is
    given by

    dπ = dV − (∂V/∂S)dS   (3.243)


    Now substituting Equations (3.241) and (3.210):

    dS/S = μdt + σdB   (3.210)

    into Equation (3.243) for dV and dS one obtains

    dπ = σSdB(∂V/∂S)dB + {μS(∂V/∂S)+(∂V/∂t)+½σ²S²(∂²V/∂S²)}dt − (∂V/∂S)(μSdt + σSdB)   (3.244)


    This simplifies to

    dπ = {(∂V/∂t)+(½)σ²S²(∂²V/∂S²)}dt   (3.245)


    It is important to note that this portfolio is completely risk-free because it
    does not contain the random Brownian motion term. Since this portfolio contains
    no risk it must earn the same as other short-term risk-free securities. If it
    earned more than this, arbitrageurs could make a profit by shorting the risk-free
    securities and using the proceeds to buy this portfolio. If the portfolio earned
    less arbitrageurs could make a riskless profit by shorting the portfolio and buying
    the risk-free securities. It follows for a riskless portfolio that

    dπ = rπdt   (3.246)


    where r is the risk-free interest rate. Substituting for dπ and π from (3.245)
    and (3.242) yields

    {(∂V/∂t)+(1/2)σ²S²(∂²V/∂S²)}dt = r{V − S(∂V/∂S)}dt   (3.247)


    Further simplification yields the Black–Scholes differential equation:

    ∂V/∂t + (1/2)σ²S²(∂²V/∂S²) + rS(∂V/∂S) − rV = 0   (3.248)


    # Solution for a European Call


    To solve the Black–Scholes equation, consider final and boundary conditions, or
    else the partial differential equation does not have a unique solution. As an
    illustration, a European call, C(S, t), will be solved given the exercise price
    E and the expiry date T.

    The final condition at time t = T may be derived from the definition of a call
    option. If at expiration S > E the call option will be worth S − E because the
    buyer of the option can buy the stock for E and immediately sell it for S. If
    at expiration S < E the option will not be exercised and it will expire worthless.
