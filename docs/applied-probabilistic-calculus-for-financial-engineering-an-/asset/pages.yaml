  md: 'Next, the problem remains to obtain an analytically tractable way to express
    and calculate the posterior variance under 100% certainty.


    The alternative formula for the posterior variance derived from (3.106) using
    the Woodbury Matrix Identity is


    $M = \tau\Sigma - \tau\Sigma P^{T} (P \tau\Sigma P^{T} + \Omega)^{-1} P \tau\Sigma$  (3.113)


    If $\Omega \to 0$ (total confidence in views, and every asset is in at least one
    view), then (3.113) may be simplified to


    $M = \tau\Sigma - \tau\Sigma P^{T} (P \tau\Sigma P^{T} + 0)^{-1} P \tau\Sigma$

    $= \tau\Sigma - \tau\Sigma P^{T} (P \tau\Sigma P^{T})^{-1} P \tau\Sigma$

    $= \tau\Sigma - \tau\Sigma P^{T} (P^{T})^{-1}$

    $= \tau\Sigma - \tau\Sigma$


    namely,


    $M = 0$  (3.114)


    And if the investor is not confident in the views, $\Omega \to \infty$, then (3.113)
    can be reduced to


    $M = \tau\Sigma - \tau\Sigma P^{T} (P \tau\Sigma P^{T} + \infty)^{-1} P \tau\Sigma$

    $= \tau\Sigma - 0$


    namely,


    $M = \tau\Sigma$  (3.115)


    # Alternative Reference Model


    Consider now the most common alternative reference model used with the Black–Litterman
    estimation model: It is the one used in Satchell and Scowcroft (2000), and in
    the work of Meucci prior to his introduction of “Beyond Black–Litterman”;


    $E(r) \sim N(\mu, \Sigma)$  (3.116)


    In this reference model, $\mu$ is normally distributed with variance $\Sigma$.
    One may estimate $\mu$, but $\mu$ is not considered a random variable. This is
    commonly described as having a $\tau = 1$, but more precisely one is making a
    point estimate and thus have eliminated $\tau$ as a parameter. In this model,
    $\Omega$ becomes the covariance of the returns to the views around the unknown
    mean return, just as $\Sigma$ is the covariance of the prior return about its
    mean. Given that one is now using point estimates, the posterior is now a point
    estimate and one no longer needs to be concerned about posterior covariance of
    the estimate. In this model, one does not have a posterior precision to use downstream
    in one''s portfolio selection model.'
