  md: 'It is not easy to measure the overall potential benefits from efficient financial
    planning: For a given portfolio, a specific investment decision may be analyzed
    in terms of two fundamental components, generally called alpha α and beta β:


    +   - α is the luck/skill-based residual component associated with the various
    approaches of active financial management – such as security selection, tactical
    asset allocation, and so on

    +   - β is the systematic risk exposures of the portfolio – normally achieved
    via asset allocation.


    α and β are at the heart of traditional performance analysis. However, they are
    only two of many important financial planning decisions, such as savings and withdrawal
    strategies, which can have a substantial impact on the retirement outcome for
    an investor.


    # 5.2.1 Going Beyond α and β


    The notions of α and β (in particular α) have long challenged financial advisors
    and their clients:


    +   - α allows a financial advisor to demonstrate (and potentially quantify) the
    excess returns generated, which can help justify fees.

    +   - On the other hand, β (systematic risk exposures) helps to explain the risk
    factors of a portfolio to the market, that is, the asset allocation.


    However, another concept gamma γ is designed to measure the value added achieved
    by an investor from making more sophisticated financial planning decisions. This
    value may be measured by calculating the certainty equivalent utility-adjusted
    retirement income across different scenarios. The Greek letter gamma, γ, is a
    widely used parameter in some areas of finance, such as in the trading of derivatives
    and in risk management.


    # 5.2.2 γ Factors


    The potential value, or gamma, γ, may be obtained from making five different “intelligent”
    financial planning decisions during retirement. A potential retiree has a number
    of risks, some of which are unique to retirement planning and are not serious
    concerns during accumulation. These five different factors are as follows:


    +   1. Asset Location and Withdrawal Sourcing: Tax-efficient investing for a retiree
    may be considered in terms of both “asset location” and intelligent withdrawal
    sequencing from accounts that differ in tax status. Asset location is defined
    as locating assets in the most tax-efficient account type. For example, it generally
    makes sense to place less tax-efficient assets (i.e., the'
