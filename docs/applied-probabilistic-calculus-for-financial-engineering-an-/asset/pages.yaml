    # 2.2 Mathematical Modeling in Financial Engineering


    # 2.2.1 A Discrete Model versus a Continuous Model


    In general, a discrete model calls for analysis and solutions using finite difference
    techniques, whereas a continuous model, using partial and total derivatives, leads
    to a financial theory consisting of systems of partial differential equations,
    with total and partial derivatives. Such systems of differential equations benefit
    from the vast reservoir of support from the well-developed field of systems of
    total and partial differential equations.'
