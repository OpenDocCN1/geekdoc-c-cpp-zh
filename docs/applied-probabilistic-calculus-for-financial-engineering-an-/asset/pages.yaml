  md: 'Then one may use the chain rule to decompose the sensitivity of TEV to the
    views:


    ∂TEV/∂q = (∂TEV/∂w_actv)(∂w_actv/∂q) (3.176)


    Solving for the first term of (3.176) directly,


    ∂TEV/∂w_actv = ∂/∂w_actv [√(w_actv^T Σ_w_actv)] (3.177)


    Let x = w_actv^T Σ_w_actv, then applying the chain rule to solve for the first
    term of (3.176):


    (∂TEV/∂w_actv) = (∂TEV/∂x)(∂x/∂w_actv) = [1/{2√(w_actv^T Σ_w_actv)}][2Σ_w_actv]
    = Σ_w_actv / √(w_actv^T Σ_w_actv) (3.178)


    And similarly solve for the second term of (3.176):


    (∂w_actv/∂q) = ∂[w - w_actv]/∂q = ∂(Σ²)⁻¹E(r) - (Σ) Π / ∂q = Σ⁻¹[∂E(r) - Π)/∂q]
    = (Σ²)⁻¹[∂{τΣP^T [(PτΣP^T)+Ω]⁻¹[Q - ΠΠ]/∂Q] = (Σ²)⁻¹ΣP^T[(PτΣP^T)+Ω]⁻¹ = (1/δ)P^T[(PΣP^T)+(Ω/τ)]⁻¹
    (3.179)


    This result differs somewhat from that found in the Braga and Natale (2007) paper
    because the form of the Black–Litt... model is used that requires less matrix
    inversions. The sensitivities equation is


    ∂TEV/∂q = {Σ_w_actv / √(w_actv^T Σ_w_actv)} (1/δ)P^T[(PΣP^T)+(Ω/τ)]⁻¹ (3.180)'
