    of $\mu_p$ versus $\sigma_p$ resembles a parabola lying on its side (actually,
    it is one side of a hyperbola). Assuming that investors prefer portfolios with
    the highest expected return $\mu_p$ for a given level of risk $\sigma_p$:


    +   - Combinations that are in the *upper left corner* are the best portfolios.

    +   - Combinations that are in the *lower right corner* are the worst portfolios.


    Notice that the portfolio at the bottom of the parabola has the smallest variance
    among all feasible portfolios. Thus, this portfolio is called the *Global Minimum-Variance
    portfolio*.


    For a given level of risk, portfolios with the highest expected return are colored
    green in Figure 3.6. These are known as efficient portfolios.


    Inefficient portfolios are such that there is another feasible portfolio that
    has the same risk ($\sigma_p$) but a higher expected return ($\mu_p$)—they are
    colored red in Figure 3.6. Thus, Figure 3.6 shows that the inefficient portfolios
    are the feasible portfolios that lie below the global minimum-variance portfolio,
    and the efficient portfolios are those that lie above the global minimum-variance
    portfolio.


    # 3.2.4.1 The Global Minimum-Variance Portfolio


    Using elementary calculus, finding the global minimum-variance portfolio is a
    simple exercise in calculus. This constrained optimization may be defined as

    $\displaystyle \min_{x_A, x_B} \{\sigma_p^2 = x_A^2 \sigma_A^2 + x_B^2 \sigma_B^2
    + 2 x_A x_B \sigma_{AB}\},\quad \text{such that } x_A + x_B = 1$


    This is a constrained optimization problem and may be solved in the following
    two ways:


    *First Method:* The *method of substitution*—using the constraint relationship
    to substitute one of the two variables $(x_A, x_B)$ to transform the constrained
    optimization problem (in two variables) into an unconstrained optimization problem
    in only one variable. Thus, substituting, from $x_A + x_B = 1$, by inserting $x_B
    = 1 - x_A$ into the formula for $\sigma_p^2$ reduces the optimization problem
    to

    $\displaystyle \min_{x_A} \{\sigma_p^2 = x_A^2 \sigma_A^2 + (1 - x_A)^2 \sigma_B^2
    + 2 x_A (1 - x_A) \sigma_{AB}\}\tag{3.36}$


    The condition for a local stationary point in the expression in (3.36) is that

    $\displaystyle \frac{d(\sigma_p^2)}{dx_A} = 0\tag{3.37}$'
