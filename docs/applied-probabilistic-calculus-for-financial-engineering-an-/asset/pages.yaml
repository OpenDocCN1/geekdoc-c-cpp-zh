- pgno: 193
  md: 'Fusai and Meucci’s Consistency measure ranged from 98.38 to 99.98% confident,
    indicating that the posterior estimates was generally highly consistent with the
    prior. Fusai and Meucci present that an investor may have a requirement that the
    confidence level be 5%. In light of these results, that would seem to be a fairly
    large value. The sensitivities of the Consistency measure scale with the measure,
    and for low values of the measure the sensitivities are very low.


    The λ’s changed with the confidence of the views and generally indicated that
    much of the information in the posterior originated with the prior. It moved intuitively
    with the changes in confidence level.


    Across the two scenarios, the TEV decreased by 61 bps, but against a starting
    point of 8.28%, it still indicates large active weights. It is not clear what
    a realistic threshold for the TEV is in this case, but these values are likely
    toward the upper limit that would be tolerated. Note that between the two scenarios,
    the sensitivity to the first view dropped by 50%, which is consistent with the
    change in confidence that we applied.


    In analyzing these various measures of the tilt caused by the views, the TEV of
    the weights measures the impact of the views and the optimization process, which
    one may consider as the final outputs. If the investor is concerned about limits
    on TEV, they could be easily added as constraints on the optimization process.


    He and Litterman’s Lambda measures the weight of the view on the posterior weights,
    but only in the case of an unconstrained optimization. This makes it suitable
    for measuring impact and being a part of the process, but it cannot be used as
    a constraint in the optimization process. Theil’s compatibility measure and Fusai
    and Meucci’s consistency measure the posterior distribution, including the returns
    and the covariance matrix: the former in view space, the latter in asset space.


    # **Active Management and the Black–Litterman Model**


    Active Management refers to the case when the investor is managing an overlay
    portfolio on top of a 100% invested passive benchmark portfolio. In this case,
    one is only interested in the overlay and not in the benchmark, so one starts
    with a prior distribution with 0 active weights and 0 expected excess returns
    over the benchmark. All returns and views input to the model are relative to the
    equilibrium benchmark returns rather than to the risk-free rate. The weights are
    for the active portfolio, so the weights should always sum to 0.


    Herold (2003) discusses the application of the Black–Litterman model to the problem
    of Active Management. He introduces a measure Φ, which is He and Litterman’s λ_A
    modified for Active Management. When one uses the Black–Litterman model for Active
    Management versus a passive benchmark portfolio, then the equilibrium weights
    (w_eq) are 0, and thus the equilibrium returns (Π) are also 0.'
