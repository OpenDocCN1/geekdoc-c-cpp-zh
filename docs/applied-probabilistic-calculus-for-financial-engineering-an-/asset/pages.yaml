  md: 'function that may be evaluated without recursion. This may be achieved by reversing
    the order of the nesting of intertemporal and risk components of utility. Thus,
    for each simulated income path, one may calculate its utility-equivalent constant
    income level based on the EOIS parameter, which is denoted as II. That is, for
    a given simulated income path, II is the constant amount of income with the same
    utility as the actual income path. This is given by


    II = ( (∑_{i=0}^{T} q_i (1+ρ)^{-i} I_i^{1-γ}) / (∑_{i=0}^{T} q_i (1+ρ)^{-i}) )^{1/(1-γ)}  (5.6)


    where

    I_t is the level of income in year t

    q_t is the probability of surviving to at least year t

    r is the last year for which q_t > 0

    ρ is the investor''s subjective discount rate (so that d_t in (5.5) is q_t(1+ρ)^{-t})


    Note that while (5.6) contains two preference parameters (ρ and γ) that describe
    how the investor feels about having income to consume at different points in time,
    it does not show how the investor feels about risk. As was discussed already,
    one treats the elasticity of intertemporal substitution as a parameter distinct
    from the risk tolerance parameter. One may introduce the risk tolerance parameter
    next by treating the entire path as unknown and evaluating expected utility.


    One may measure expected utility using the CRRA utility function with its risk
    tolerance parameter θ that we introduced in (5.3).


    EU = ∑_{i=1}^{M} p_i \frac{θ}{θ-1} (II_i)^{θ-1}  (5.7)


    where

    M is the number of paths

    The subscript i denotes which of M paths is being referred to

    p_i is the probability of path i occurring which is set to 1/M


    One may define Y as the constant value for II that yields this level of expected
    utility. This is the certainty equivalent of the stochastic utility-adjusted income
    II, and Y is given by


    Y = [∑_{i=1}^{M} p_i (II_i)^{θ-1}]^{1/(θ-1)}  (5.8)


    One may now define the gamma γ of a given strategy or a set of decisions as


    Gamma(strategy) = [Y(strategy) − Y(benchmark)] / Y(benchmark)  (5.9)'
