  md: 'Now that one has defined the Ito integral of simple processes, one may define
    the Ito integrals of other processes. It may be shown that if a general predictable
    process satisfies certain conditions, the general process is a limit in probability
    of simple predictable processes discussed earlier. The Ito integral of general
    predictable processes is defined as a limit of integrals of simple processes.
    If $X(t)$ is a predictable process such that


    $\displaystyle \int_{0}^{T} X^{2}(t)\,dt < \infty \tag{3.225}$


    then the Ito integral


    $\displaystyle \int_{0}^{T} X(t)\,dB(t)$


    is defined and satisfies the above four properties.


    For example, to undertake the integral


    $\displaystyle \int_{0}^{T} B(t)\,dB(t)$


    one may let $0 = t_{0} < t_{1} < t_{2} < \cdots < t_{n} = T$ be a partition of
    $[0, T]$, then


    $e^{n}(t) = \sum_{i=0}^{n-1} B(t_{i}) I_{[t_{i},t_{i+1})}(t) \tag{3.226}$


    Then, for any $n$, $e^{n}(t)$ is a simple process. One may take a sequence of
    the partitions such that $\max_{i}(t_{i+1} - t_{i}) \to 0$ as $n \to \infty$.
    The Ito integral of this simple function is given by


    $\displaystyle \int_{0}^{T} e^{n}(t)\,dB(t) = \sum_{i=0}^{n-1} B(t_{i})\big[ B(t_{i+1})
    - B(t_{i}) \big] \tag{3.227}$


    One may show that this sequence of integrals converges in probability and identify
    the limit. Adding and subtracting $B^{2}(t_{i+1})$, one obtains


    $B(t_{i})\big[ B(t_{i+1}) - B(t_{i}) \big] = \frac{1}{2}\Big[ B^{2}(t_{i+1}) -
    B^{2}(t_{i}) - \{ B(t_{i+1}) - B(t_{i}) \}^{2} \Big] \tag{3.228}$


    and


    $\displaystyle \int_{0}^{T} e^{n}(t)\,dB(t) = \frac{1}{2}\sum_{i=0}^{n-1}\big[
    B^{2}(t_{i+1}) - B^{2}(t_{i}) \big] - \frac{1}{2}\sum_{i=0}^{n-1}\big\{ B(t_{i+1})
    - B(t_{i}) \big\}^{2} \tag{3.229}$'
