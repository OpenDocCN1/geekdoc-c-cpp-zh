    # 5.4 Variable Risk Preference Bias


    It appears that there is a growing body of evidence of time-varying risk aversion.


    Using a unique data set with daily responses to a risk tolerance questionnaire
    from participants in a defined contribution plan, one finds significant evidence
    that


    +   a) risk aversion is time-varying, and that

    +   b) changes in risk aversion are primarily related to changes in investor expectations
    instead of historical market returns.


    Time-varying risk aversion has important implications for the demand for risky
    assets if investors reduce demand for stocks when valuations are most attractive.


    +   - One may note a statistically significant relation between time-varying risk
    aversion and net equity mutual fund flows, or a variable risk preference bias.

    +   - One may also find that net equity flows for more sophisticated investors,
