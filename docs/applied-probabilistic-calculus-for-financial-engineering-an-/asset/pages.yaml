  md: 'The variance is the expectation of (3.125) squared.


    E[(\hat{\beta} - \beta)^2]

    = [x\Phi^{-1}x^T + \rho\Omega^{-1}p^T]^{-1}[x\Phi^{-1}u^T + \rho\Omega^{-1}v^T]^2
    \tag{3.126}

    = [x\Phi^{-1}x^T + \rho\Omega^{-1}p^T]^{-2}

    [x\Phi^{-1}u^T u\Phi^{-1}x^T + \rho\Omega^{-1}v^T v\Omega^{-1}p^T + x\Phi^{-1}u^T
    v\Omega^{-1}p^T + \rho\Omega^{-1}v^T u\Phi^{-1}x^T] \tag{3.127}


    From the foregoing assumptions that E[uu^T]=Φ, E[vv^T]=Ω, and E(uv^T)=0—because
    u and v are independent variables, taking the expectations one sees the cross-terms
    are 0, so that (3.126) becomes


    E[(\hat{\beta} - \beta)^2]

    = [x\Phi^{-1}x^T + \rho\Omega^{-1}p^T]^{-2}

    [[(x\Phi^{-1}\Phi\Phi^{-1}x^T) + \rho\Omega^{-1}p^T]^{-2}[x\Phi^{-1}\Phi\Phi^{-1}x^T
    + (p\Omega^{-1}\Omega\Omega^{-1}) + 0 + 0] \tag{3.128a}

    = [x\Phi^{-1}x^T + \rho\Omega^{-1}p^T]^{-2}

    [x\Phi^{-1}\Phi\Phi^{-1}x^T + \rho\Omega^{-1}p^T]^{-2}[x\Phi^{-1}x^T + \rho\Omega^{-1}p^T]
    \tag{3.128b}


    And for the Black-Litterman model, x is the identity matrix and Φ = τΣ. Upon making
    these substitutions, the result is


    E[(\hat{\beta} - \beta)^2] = [(τΣ)^{-1} + ρΩ^{-1}p^T]^{-1} \tag{3.129}


    # 3.6.1.2 Derivation Using Bayes'' Theory


    This derivation provides an overview of the relevant portion of Bayes'' theory
    in order to create a common vocabulary that may be used in analyzing the Black-Litterman
    model from a Bayesian viewpoint.


    # Introduction to Bayes'' Theory Bayes'' theory states


    P(A|B) = P(B|A)P(A)/P(B) \tag{3.130}

    in which


    P(A|B) is the conditional (or joint) probability of A, given B, it is also known
    as the posterior distribution.

    P(B|A) is the conditional probability of B given A, it is also known as the sampling
    distribution. Call this the conditional distribution.

    P(A) is the probability of A, also known as the prior distribution. Call this
    the prior distribution.

    P(B) is the probability of B, it is also known as the normalizing constant.


    When applying this formula and solving for the posterior distribution, the normalizing
    constant will disappear into the constants of integration; so from this point
    on, it may be ignored.'
