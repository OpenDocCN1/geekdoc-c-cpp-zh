- pgno: 53
  md: '**Solution:**


    Since $X_t = \exp(W_t)$,


    $dX_t = d[\exp(W_t)]$  by direct substitution

    $= \exp(W_t) dW_t + \tfrac12 \exp(W_t) dt$  by the Ito Lemma

    $= X_t dW_t + \tfrac12 X_t dt$  by direct substitution


    # Worked Example 2.2


    On the differential of the product of a nonvolatile process and a stochastic process:
    If $B_t$ is a nonvolatile process and $X_t$ is a stochastic process, then the
    differential of the product $B_t X_t$ is


    $$d(B_t X_t) = B_t dX_t + X_t dB_t$$


    **Solution:**


    Two approaches may be used:


    # *First Method:*


    Applying the product rule in the differential of a functions two variables, the
    result is


    $$\frac{d(B_t X_t)}{dt} = B_t \frac{dX_t}{dt} + X_t \frac{dB_t}{dt} = \frac{(B_t
    dX_t + X_t dB_t)}{dt}$$


    $$\therefore d(B_t X_t) = B_t dX_t + X_t dB_t$$


    as required.


    # *Second Method:*


    Applying the Ito Lemma first, and then simplifying the results:

    Since $X_t$ is a probabilistic (stochastic) process: $dX_t = \sigma_t dW_t + \mu_t
    dt$, and since $B_t$ is a nonvolatile process: $dB_t = B_t dt$


    Moreover, since

    $$(B_t + X_t)^2 \equiv B_t^2 + 2 B_t X_t + X_t^2$$

    one obtains

    $$B_t X_t \equiv \tfrac12[(B_t + X_t)^2 - B_t^2 - X_t^2]$$


    hence,

    $$d(B_t X_t) \equiv d\{\tfrac12[(B_t + X_t)^2 - B_t^2 - X_t^2]\}

    = \tfrac12 d[(B_t + X_t)^2 - B_t^2 - X_t^2]

    = \tfrac12 d(B_t + X_t)^2 - \tfrac12 dB_t^2 - \tfrac12 dX_t^2

    = (B_t + X_t) d(B_t + X_t) - B_t dB_t - X_t dX_t$$'
