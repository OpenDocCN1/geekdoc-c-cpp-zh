    # Conclusion


    Note that in the derivation of the Black–Scholes differential equation, it was
    never restricted to a specific type of derivative security when trying to find
    the price for until the boundary conditions are specified for a European call.
    This means that a person can use the Black–Scholes differential equation to solve
    for the price of any type of option—by changing the boundary conditions only.

