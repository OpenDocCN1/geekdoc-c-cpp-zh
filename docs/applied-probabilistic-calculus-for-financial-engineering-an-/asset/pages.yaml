- pgno: 26
  md: '![](img/551ca8853d2ba8528201e7a57e5006b4_26_0.png)


    Figure 1.2 Chicago Board of Options Exchange (CBOE) Volatility Index.


    For example, consider the Chicago Board of Options Exchange (CBOE) index:


    CBOE Volatility Index®: Chicago Board Options Exchange index (symbol: VIX®) is
    the index that shows the market''s expectation of 30-day volatility. It is constructed
    using the implied volatilities of a wide range of S&P 500 index options. This
    volatility is meant to be forward looking, is calculated from both calls and puts,
    and is a widely used measure of market risk, often referred to as the "investor
    fear gauge."


    The VIX volatility methodology is the property of CBOE, which is not affiliated
    with Janus.


    Clearly, Figure 1.2 reflects the dynamic nature of a typical stock market over
    the past 20 years. One wonders if a rational financial engineering approach may
    be developed to sustain the two objectives at hand simultaneously:


    +   1) To maintain a steady level of investment

    +   2) To produce a steady income for the investors


    The remainder of this book will provide rational approaches to achieve these joint
    goals.


    # 1.3.2 Ongoing Results of the XYZ–LPL Investment of the Account of Mr. and Mrs.
    Smith


    Let us first examine the results of this investment opportunity, as seen over
    the past 10 years approximately.'
