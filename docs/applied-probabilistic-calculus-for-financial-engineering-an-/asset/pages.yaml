- pgno: 393
  md: 'majority of total return comes from dividends that are taxed as ordinary income),
    such as bonds, in retirement accounts (e.g., IRAs or 401(k)s) and more tax-efficient
    assets (i.e., the majority of total return comes from capital gains taxed at rates
    less than ordinary income), such as stocks, in taxable accounts. When thinking
    about withdrawal sequencing, it is prudent to withdraw monies from taxable accounts
    first and more tax-efficient accounts (e.g., IRAs or 401(k)s) later.


    +   2) *Total Wealth Asset Allocation:* Most techniques used for determining the
    asset allocation for a client are often relatively subjective and focus primarily
    on risk preference (i.e., an investor’s aversion to risk) and ignore risk capacity
    (i.e., an investor’s ability to assume risk). In practice, however, it is often
    believed that asset allocation should be based on a combination of risk preference
    and risk capacity, although primarily risk capacity. One determines an investor’s
    risk capacity by evaluating the total wealth of the client, which is a combination
    of human capital (an investor’s future potential savings) and financial capital.
    One may either use the market portfolio as the target aggregate asset allocation
    for each investor (as suggested by the Capital Asset Pricing Model) or build an
    investor-specific asset allocation that incorporates an investor’s risk preferences.
    In both approaches, the financial assets are invested, subject to certain constraints,
    in order to achieve an optimal asset allocation that takes both human and financial
    capital into account.


    +   3) *Annuity Allocation:* Among retirees, one of the greatest fears is outliving
    one’s savings! For example, a study by Allianz Life has shown that more retirees
    feared outliving their resources (61%) versus death (39%). Annuities allow a retiree
    to hedge against longevity risk and can, therefore, improve the overall efficiency
    of a retiree’s portfolio. The contribution of an annuity within a total portfolio
    framework, (benefit, risk, and cost) should be considered before determining the
    appropriate amount and annuity type.


    +   4) *Dynamic Withdrawal Strategy:* Most retirement research has focused on
    static withdrawal strategies where the annual withdrawal during retirement is
    based on the initial account balance at retirement, increased annually for inflation.
    For example, a “5% withdrawal rate” would really mean a retiree may take a 5%
    withdrawal of the initial portfolio value and continue withdrawing that amount
    each year, adjusted for inflation. If the initial portfolio value was $2 million,
    and the withdrawal rate was 5%, the retiree would be expected to generate 5% of
    $2 million, or $100,000, in the first year. If inflation during the first year
    was 3%, the actual cash flow amount in the second year (in nominal terms) would
    be $103,000 (= $100,000 × 1.03). Using this approach the withdrawal amount is
    based entirely on the initial income target, and is not updated based on market
    performance or expected investor longevity.'
