    # 4.2 Beginning R


    R is an open-source, freely available, integrated software environment for data
    manipulation, computation, analysis, and graphical display.


    The R environment consists of the following:


    +   - A data handling and storage facility

    +   - Operators for computations on arrays and matrices

    +   - A collection of tools for data analysis

    +   - Graphical capabilities for analysis and display

    +   - An efficient and continuing developing programming algebra-like programming
    language that consists of loops, conditionals, user-defined functions, and input
    and output capabilities.


    The term "environment" is used to show that it is indeed a planned and coherent
    system.


    # R and Statistics


    R was initially written by Robert Gentleman and Ross Ihaka of the Statistics Department
    of the University of Auckland, New Zealand, in 1997. Since then there has been
    the R-development core group of about 20 people with write access to the R source
    code.'
