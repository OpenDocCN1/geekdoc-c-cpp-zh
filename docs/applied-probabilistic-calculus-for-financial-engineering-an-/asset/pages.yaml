    # 3.2.5.2 The Tangency Portfolio


    Next, one may proceed to expand the foregoing analysis by considering portfolios
    consisting of asset A, asset B, and risk-free asset (say, T-Bills). For this case,
    the efficient set will also be given by (3.51):


    μ_B = {(μ_B − r_f)/σ_B} σ_B + r_f   (3.51)


    namely, a straight line in the (μ_p, σ_p) space with intercept r_f. For this efficient
    set, its slope is the maximum Sharpe Ratio, namely, it is tangential to the efficient
    set consisting of only the two risky assets: A and B.


    Tangent Portfolios are portfolios of stocks and bonds designed for long-term investors.
    To find the Tangent Portfolios, one may start by asking how much one would be
    prepared to lose in a worst-case scenario without dropping out of the market:
    20%? 25%? or 33%? Once the maximum loss level is chosen, the Tangent Portfolios
    will try to deliver a high rate of return for that level of risk.


    There is a human temptation to invest on the basis of the BLASH (Buy-High-And-Sell-Low)
    route! Thus, most investors tend to take on large amounts of risk during good
    times (Buy High), and then sell out during bad times (Sell Low)—ruining their
    returns in the process. The Tangent Portfolios are designed to let the investor
    do well enough during both good and bad times to keep one in the markets throughout.
    This allows the investor reap the long-term benefits from investing in stocks
    and bonds with a simple, low-maintenance solution.


    Figure 3.22, same as Figure 3.1, illustrates the Efficient Frontier. The hyperbola
    is sometimes referred to as the Markowitz Bullet, and is the efficient frontier
    if no risk-free asset is available. With a risk-free asset, the straight line
    is the efficient frontier.


