- pgno: 400
  md: 'An investor is said to be the following:


    +   - **Risk-averse (or risk-avoiding):** If the investor would accept a certain
    payment (*certainty equivalent*) of less than $100,000 (e.g., $80,000), rather
    than taking the gamble and possibly receiving nothing.

    +   - **Risk-neutral:** If the investor is indifferent between the bet and a certain
    $100,000 payment.

    +   - **Risk-seeking:** If the investor would accept the bet even when the guaranteed
    payment is more than $100,000 (e.g., $120,000).


    The average payoff of the gamble, called its *expected value*, is $100,000. The
    dollar amount that the individual would accept instead of the bet is called the
    *certainty equivalent*, and the difference between the expected value and the
    certainty equivalent is called the *risk premium*, that is,


    risk premium = expected value − certainty equivalent (5.15)


    For risk-averse individuals, the risk premium is *positive*, for risk-neutral
    persons it is *zero*, and for risk-loving individuals their risk premium becomes
    *negative*.


    # 5.3.1.2 Expected Utility Theory


    In expected utility theory, a person (including an investor) has a utility function
    *u(x)*, where *x* represents the value that he might receive in money or goods
    (in the above example *x* could be 0 or 100).


    Time does not come into this consideration, so inflation does not appear. (The
    utility function *u(x)* is defined only up to positive linear affine transformation
    – in other words, a constant offset could be adjusted (added) to the value of
    *u(x)* for all *x*, and/or *u(x)* could be multiplied by a positive constant factor,
    without affecting the conclusions.)


    An agent possesses risk aversion if and only if the utility function is *concave*.
    For instance *u(0)* could be 0, *u(100)* might be 10, *u(60)* might be 7, and
    for comparison *u(50)* might be 6.


    The expected utility of the above bet (with a 50% chance of receiving 100 and
    a 50% chance of receiving 0) is

    E(u) = [u(0) + u(100)]/2 (5.16)

    and if the person has the utility function with u(0)=0, u(50)=6, and u(100)=10,
    then the expected utility of the bet equals 5, which is the same as the known
    utility of the amount 40. Hence, the certainty equivalent is 40.

    The risk premium is ($50 − $40)=$10, or in proportional terms

    ($50 − $40)/$40 = $10/$40 = 1/4 (5.17)

    or 25%, where $50 is the expected value of the risky bet

    (1/2)(0) + (1/2)(100) = 0 + 50 = 50'
