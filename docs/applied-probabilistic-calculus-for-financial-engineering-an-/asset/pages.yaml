- pgno: 300
  md: "In finance, a straddle refers to *two* transactions that share the *same* security,\
    \ with positions that offset one another. One holds long risk, the other short.\
    \ Thus, it involves the purchase or sale of particular option derivatives that\
    \ allow the holder to profit based on how much the price of the underlying security\
    \ moves, regardless of the direction of price movement.\n\nA straddle involves\
    \ buying a call and put with same strike price and expiration date:\n\n+   i)\
    \ If the stock price is close to the strike price at expiration of the options,\
    \ the straddle leads to a loss.\n+   \n+   ii) However, if there is a sufficiently\
    \ large move in either direction, a significant profit will result.\n\n*A straddle\
    \ is appropriate when an investor is expecting a large move in a stock price but\
    \ does not know in which direction the move will be.*\n\nThe purchase of particular\
    \ option derivatives is known as a *long straddle*, while the sale of the option\
    \ derivatives is known as a *short straddle*.\n\nA *long straddle* buys both a\
    \ call option and a put option on some stock, interest rate, index, or other underlying.\
    \ The two options are bought at the *same* strike price and expire at the *same*\
    \ time. The owner of a long straddle makes a profit if the underlying price moves\
    \ a long way from the strike price, either above or below. Thus, an investor may\
    \ take a long straddle position if he thinks the market is highly volatile, but\
    \ does not know in which direction it is going to move. This position is a limited\
    \ risk, since the most a purchaser may lose is the cost of both options. At the\
    \ same time, there is unlimited profit potential.\n\nFor example, company ABC\
    \ is set to release its quarterly financial results in 2 weeks. An investor believes\
    \ that the release of these results will cause a large movement in the price of\
    \ the ABC’s stock, but does not know whether the price will go up or down. The\
    \ investor may enter into a long straddle, where one gets a profit no matter which\
    \ way the price of ABC stock moves, if the price changes enough either way:\n\n\
    +   - If the price goes up enough, the investor may use the option and ignores\
    \ the put option.\n+   - If the price goes down, the investor uses the put option\
    \ and ignores the call option.\n+   - If the price does not change enough, he\
    \ loses money, up to the total amount paid for the two options.\n\nThus, the risk\
    \ is limited by the total premium paid for the options, as opposed to the short\
    \ straddle where the risk is virtually unlimited.\n\n+   - If the stock is sufficiently\
    \ volatile and option duration is long, the investor could profit from both options.\
    \ This would require the stock to move both below the put option’s strike price\
    \ and above the call option’s strike price at different times before the option\
    \ expiration date."
  merge: -1
  img_proc: true
- pgno: 301
  md: 'A short straddle is a nondirectional option trading strategy that involves
    simultaneously selling a put and a call of the same underlying security, strike
    price, and expiration date. The profit is limited to the premium received from
    the sale of put and call. The risk is virtually unlimited as large moves of the
    underlying security''s price either up or down will cause losses proportional
    to the magnitude of the price move. A maximum profit upon expiration is achieved
    if the underlying security trades exactly at the strike price of the straddle.
    Thus, both puts and calls comprising the straddle expire worthless allowing straddle
    owner to keep full credit received as their profit. This strategy is also called
    “nondirectional” because the short straddle profits when the underlying security
    changes little in price before the expiration of the straddle. The short straddle
    may be classified as a credit spread because the sale of the short straddle results
    in a credit of the premiums of the put and call.


    (A risk for holder of a short straddle position is unlimited due to the sale of
    the call and the put options that expose the investor to unlimited losses (on
    the call) or losses limited to the strike price (on the put), whereas maximum
    profit is limited to the premium gained by the initial sale of the options.)


    An example of a Straddle Financial Investment, using R: In CRAN, the package,
    FinancialMath: Financial Mathematics for Actuaries provides a numerical example
    for assessing a Straddle investment, using the Black–Scholes equation for estimating
    the call and put prices:


    ```

    traddle.bls


    Straddle Spread - Black Scholes

    ```


    # Description


    Gives a table and graphical representation of the payoff and profit of a long
    or short straddle for a range of future stock prices. Uses the Black–Scholes equation
    for estimating the call and put prices.


    # Usage


    ```

    straddle.bls(S, K, r, t, sd, position, plot=TRUE/FALSE)

    ```


    # Arguments


    | Argument | Description |

    |---|---|

    | S | spot price at time 0 |

    | K | strike price of the put and call |

    | r | continuously compounded yearly risk free rate |

    | t | time of expiration (in years) |

    | sd | standard deviation of the stock ( a measure of its volatility) |

    | position | either buyer or seller of option ("long" or "short") |

    | plot | specifying whether or not to plot the payoff and profit |'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Details


    ```

    Stock price at time t = Sₜ

    For Sₜ ≤ K1: payoff = K1 - Sₜ

    For K1 < Sₜ ≤ K2: payoff = 0

    For Sₜ > K2: payoff = Sₜ - K2

    profit = payoff - (price_K1 + price_K2) * er*t

    For Sₜ ≤ K: payoff = Sₜ - K

    For Sₜ > K: payoff = K - Sₜ

    Profit = Payoff + (price_call + price_put) * er*t

    ```


    # Value


    A list of two components.


    Payoff A data frame of different payoffs and profits for given stock prices.

    Premiums A matrix of the premiums for the call and put options, and the net cost.


    # See Also


    +   - option.put

    +   - option.call

    +   - strangle.bls


