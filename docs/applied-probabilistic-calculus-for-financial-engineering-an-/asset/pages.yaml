  md: 'For those assets where the investor has absolute views, the variance of the
    posterior estimate will be zero. For all other assets, the posterior variance
    will be nonzero.


    ε ~ N[0, Σ − (ΣP^T)(Σ_v)^{−1}(PΣ)]  (3.204)


    where


    Σ_v = PΣP^T  (3.205)


    Var(ε) = Σ − (ΣP^T)(PΣP^T)^{−1}(PΣ)  (3.206)


    M = τΣ − τΣP^T(PτΣP^T + Ω)^{−1}PτΣ  (3.113)


    setting Ω = 0 and removing τ:


    M = Σ − ΣP^T(PΣP^T)^{−1}PΣ  (3.114)


    In order to get Qian and Gorman''s equation (3.207), one needs to reintroduce
    the covariance of the views, Ω, but rather than mixing the covariances as is done
    in the Black–Litterman model, one may rely on the lack of correlation and just
    add the two variance terms. One takes the variance of the conditional from (3.85).


    P(B|A) ~ N(P^{−1}Q, [P^T Ω^{−1} P]^{−1})  (3.85)


    Var(ε) = Σ − (ΣP^T)(PΣP^T)^{−1}(ΣP^T) + (P^T Ω^{−1} P)^{−1}  (3.115a)


    Var(ε) = Σ + (ΣP^T)(PΣP^T)^{−1}(ΣP^T) + (ΣP^T)(P^T Ω^{−1} P)^{−1}Ω(PΣP^T)^{−1}(PΣ)  (3.115b)


    Var(ε) = Σ + (ΣP^T)(PΣP^T)^{−1}(Ω)(PΣP^T)^{−1} − (PΣP^T)^{−1}(ΣP^T)  (3.115c)


    Note that (3.115c) exactly matches (3.207):


    Σ = Σ + (ΣP^T)(Σ_v^{−1} Σ_V Σ_v^{−1} − Σ_v^{−1})(PΣ)  (3.207)


    where Σ_v = PΣP^T and Σ_V = Ω


    Upon substituting these into (3.207), the result is Σ = Σ + (ΣP^T)[(PΣP^T)^{−1}Ω(PΣP^T)^{−1}
    − (PΣP^T)^{−1}](PΣ)  (3.116)


    Qian and Gorman demonstrated a conditional covariance that is not derived from
    Theil''s mixed estimation nor from Bayesian updating. Its behavior may increase
    the variance of the posterior versus the prior in the event that the view variance
    is larger than the prior variance. They described this as allowing the investor
    to have a view on the variance, and they do not suggest that Ω needs to be diagonal.
    In this model the conditional covariance is proportional to the investor''s views
    on variance, but the blending process is not clear.'
