  md: '$t=T$, the value of the option is known for certain to be the payoff:


    $$C(S,T)=\max(S-E,0) \tag{3.249}$$


    This is the final condition for the differential equation.


    In order to find boundary conditions, one considers the value of $C$ when $S=0$
    and as $S\to\infty$. If $S=0$, then it is easy to see from (3.210) that $dS=0$,
    and therefore $S$ will never change. If at expiry $S=0$, from (3.249) the payoff
    must be 0. Consequently, when $S=0$ one has


    $$C(0,T)=0 \tag{3.250}$$


    Now when $S\to\infty$, it becomes more and more likely the option will be exercised
    and the payoff will be $(S-E)$. The exercise price becomes less and less important
    as $S\to\infty$, so the value of the option is equivalent to


    $$C(S,T)\approx S\text{ as }S\to\infty \tag{3.251}$$


    In order to solve the Black–Scholes equation, one needs to transform the equation
    into an equation one can work with. The first step is to eliminate the $S$ and
    $S^2$ terms in (3.248) (16). To do this, consider the change of variables:


    $$S=Ee^x \tag{3.252}$$


    $$t=T-\left(\frac{\tau}{1/2\sigma^2}\right) \tag{3.253}$$


    $$V=Ev(x,\tau) \tag{3.254}$$


    Using the chain rule from Calculus for transforming partial derivatives for functions
    of two variables, we have


    $$\frac{\partial V}{\partial S}=\left(\frac{\partial V}{\partial x}\right)\left(\frac{\partial
    x}{\partial S}\right)+\left(\frac{\partial V}{\partial \tau}\right)\left(\frac{\partial
    \tau}{\partial S}\right) \tag{3.255}$$


    $$\frac{\partial V}{\partial t}=\left(\frac{\partial V}{\partial x}\right)\left(\frac{\partial
    x}{\partial t}\right)+\left(\frac{\partial V}{\partial \tau}\right)\left(\frac{\partial
    \tau}{\partial t}\right). \tag{3.256}$$


    Looking at (3.252)–(3.254), it may be shown that


    $$\frac{\partial\tau}{\partial t}=-\frac{1}{2}\sigma^2,\quad \frac{\partial x}{\partial
    t}=0,\quad \frac{\partial x}{\partial S}=1/S,\quad \frac{\partial\tau}{\partial
    S}=0 \tag{3.257}$$


    Plugging these into (3.255) and (3.256) yields


    $$\frac{\partial V}{\partial S}=\left(E/S\right)\frac{\partial V}{\partial x}
    \tag{3.258}$$


    $$\frac{\partial V}{\partial t}=-(1/2)\sigma^2(E\frac{\partial V}{\partial\tau})
    \tag{3.259}$$


    $$\frac{\partial^2 V}{\partial S^2}=\left(E/S^2\right)\frac{\partial^2 V}{\partial
    x^2}-\left(E/S^2\right)\left(\frac{\partial V}{\partial x}\right) \tag{3.260}$$


    Substituting (3.255)–(3.260) into the Black–Scholes partial differential equation
    gives the differential equation:


    $$\frac{\partial V}{\partial t}=\frac{\partial^2 V}{\partial x^2}+(k-1)\frac{\partial
    V}{\partial x}-kv \tag{3.261}$$


    where


    $$k=\left[r/(1/2\sigma^2)\right] \tag{3.262}$$'
