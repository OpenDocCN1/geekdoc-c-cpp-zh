- pgno: 369
  md: "# Adjust Open, High, Low, Close Prices For Splits and Dividends\n\n# Description\n\
    \nAdjust all columns of an OHLC object for split and dividend.\n\n# Usage\n\n\
    ```\nadjustOHLC(x,\n    adjust = c(\"split\",\"dividend\"),\n    use.Adjusted\
    \ = FALSE,\n    ratio = NULL,\n    symbol.name=deparse(substitute(x)))\n```\n\n\
    # Arguments\n\n| Argument | Description |\n|---|---|\n| x | An OHLC object |\n\
    | adjust | adjust by split, dividend, or both (default) |\n| use.Adjusted | use\
    \ the 'Adjusted' column in Yahoo! data to adjust |\n| ratio | ratio to adjust\
    \ with, bypassing internal calculations |\n| symbol.name | used if x is not named\
    \ the same as the symbol adjusting |\n\n# Details\n\nThis function calculates\
    \ the adjusted Open, High, Low, and Close prices according to split and dividend\
    \ information.\n\nThere are three methods available to calculate the new OHLC\
    \ object prices. By default, getSplits and getDividends are called to retrieve\
    \ the respective information. These may dispatch to custom methods following the\
    \ \".\" methodology used by quantmod dispatch. See getSymbols for information\
    \ related to extending quantmod. This information is passed to adjRatios from\
    \ the TTR package, and the resulting ratio calculations are used to adjust to\
    \ observed historical prices. This is the most precise way to adjust a series.\n\
    \nThe second method works only on standard Yahoo! data containing an explicit\
    \ Adjusted column.\n\nA final method allows for one to pass a ratio into the function\
    \ directly.\n\nAll methods proceed as follows:\n\n+   1) New columns are derived\
    \ by taking the ratio of adjusted value to original Close, and multiplying by\
    \ the difference of the respective column and the original Close.\n+   2) This\
    \ is then added to the modified Close column to arrive at the remaining \"adjusted\"\
    \ Open, High, Low column values. If no adjustment is needed, the function returns\
    \ the original data unaltered."
  merge: -1
  img_proc: true
- pgno: 370
  md: "# Value\n\nAn object of the original class, with prices adjusted for splits\
    \ and dividends.\n\n# Warning\n\nUsing use.Adjusted = TRUE will be less precise\
    \ than the method that employs actual split and dividend information. This is\
    \ due to loss of precision from Yahoo! using Adjusted columns of only two decimal\
    \ places. The advantage is that this can be run offline, and for short series\
    \ or those with few adjustments the loss of precision will be small.\n\nThe resulting\
    \ precision loss will be from row observation to row observation, as the calculation\
    \ will be exact for intraday values.\n\n# Author(s)\n\nJeffrey A. Ryan\n\n# References\n\
    \nYahoo Finance http://finance.yahoo.com\n\n# See Also\n\ngetSymbols.yahoo getSplits\
    \ getDividends\n\n# Examples\n\n```\ngetSymbols(\"AAPL\", from=\"1990-01-01\"\
    ,\n    src=\"yahoo\")\nhead(AAPL)\nhead(AAPL.a <- adjustOHLC(AAPL))\nhead(AAPL.uA\
    \ <- adjustOHLC(AAPL,\n    use.Adjusted=TRUE))\n# intraday adjustments are precise\
    \ across all\n# methods\n# an example with Open to Close (OpCl)\nhead(cbind(OpCl(AAPL),\
    \ OpCl(AAPL.a),\n    OpCl(AAPL.uA)))\n# Close to Close changes may lose precision\n\
    head(cbind(ClCl(AAPL), ClCl(AAPL.a),\n    ClCl(AAPL.uA)))\n## End\n```\n\n# In\
    \ the R domain:\n\n```\n> \n> install.packages(\"quantmod\")\nInstalling package\
    \ into 'C:/Users/Bert/Documents/R/win-library/3.2'\n```"
