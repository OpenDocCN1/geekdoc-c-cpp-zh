  md: "their TEV results. One advantage of the TEV is that most investors are familiar\
    \ with it, and so they will have some intuition as to what it represents. The\
    \ consistency metric introduced by Fusai and Meucci (2003) will not be as familiar\
    \ to investors.\n\n# Metrics Introduced in Herold (2003)\n\nThis diagnostic concept\
    \ may be applied to portfolio models in order to validate the outputs. One of\
    \ these diagnostics is the correlation between views as one diagnostic that may\
    \ be used to determine how the updated portfolio may perform. By examining the\
    \ correlation matrix of the views, P Σ P^T, one may determine how correlated the\
    \ views are. If the views are highly correlated, then one may expect all views\
    \ to contribute to the performance if they are correct, and underperformance if\
    \ they are incorrect. If the views are not highly correlated, then one may expect\
    \ a diversified contribution to performance.\n\nAs an example, if one uses the\
    \ He and Litterman's data and their two views, one calculated this measure as\n\
    \nPΣP^T = [0.0213  0.0020]\n      = [0.0020  0.0170]\n\nThe off-diagonal elements\
    \ (0.0020 and 0.0020) are one order of magnitude smaller than the on-diagonal\
    \ elements (0.0213 and 0.0170). This difference indicates that the views are not\
    \ strongly correlated. This is consistent with He and Litterman's specification\
    \ of the two views on mutually exclusive sets of assets that are loosely correlated.\n\
    \nHerold (2003) also discussed the marginal contribution to tracking error by\
    \ view. This is the same metric computed by Braga and Natale, although he proposed\
    \ deriving the formula for its calculation from the Alternative Reference Model\
    \ version of He and Litterman's Λ_A.\n\nHerold (2003) considers the case of Active\
    \ Management, which meant that the Black–Litterman model was applied to an active\
    \ management overlay on some portfolio. The prior distribution in this case corresponds\
    \ to w_eq = 0. The posterior weights were the overlay weights. He uses the Alternative\
    \ Reference Model and computed a quantity Φ, which is the active management version\
    \ of Λ_A,\n\n```\nΛ_A = (Ω^{-1} Q / δ) - A^{-1} P Σ w_eq - A^{-1} P Σ P^T (Ω^{-1}\
    \ Q / δ)    (3.184)\nbut w_eq = 0, so\nΦ = (Ω^{-1} Q / δ) - A^{-1} P Σ P^T (Ω^{-1}\
    \ Q / δ)    (3.185)\nwhere\nw_actv = P^T Φ    (3.186)\n```"
