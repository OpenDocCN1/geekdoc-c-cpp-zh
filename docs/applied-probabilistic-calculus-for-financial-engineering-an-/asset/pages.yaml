- pgno: 59
  md: '# ## Default S3 method:


    ```

    BM(N=100,M=1,x0=0,t0=0,T=1,Dt, . . . )

    ```


    # ## Default S3 method:


    ```

    BB(N=100,M=1,x0=0,y=1,t0=0,T=1,Dt, . . . )

    ```


    # ## Default S3 method:


    ```

    GBM(N=100,M=1,x0=1,t0=0,T=1,Dt,theta=1,sigma=1, . . . )

    ```


    # ## Default S3 method:


    ```

    ABM(N=100,M=1,x0=0,t0=0,T=1,Dt,theta=1,sigma=1, . . . )

    ```


    # Arguments


    | Argument | Description |

    |---|---|

    | N | Number of simulation steps. |

    | M | Number of trajectories. |

    | x0 | Initial value of the process at time t0. |

    | Y | Terminal value of the process at time T of the BB. |

    | t0 | Initial time. |

    | T | Final time. |

    | Dt | Time step of the simulation (discretization). If it is missing a default
    Δt = (T − t0) / N |

    | theta | The interest rate of the ABM and GBM. |

    | sigma | The volatility of the ABM and GBM. |

    | ... | Further arguments for (nondefault) methods. |


    # Details


    The function BM returns a trajectory of the standard Brownian motion (Wiener process)
    in the time interval [t0, T]. Indeed, for W(dt) it holds true that


    W(dt) → W(dt) − W(0) → N(0, dt)


    where N(0, 1) is normal distribution Normal.


    The function BB returns a trajectory of the Brownian bridge starting at x0 at
    time t0 and ending at y at time T; that is, the diffusion process solution of
    stochastic differential equation:


    dX_t = {(y − X_t)/(T − t)} dt + dW_t'
