- pgno: 332
  md: '# (B) How to Reduce Paying Total Interest and Save Money Overall!


    Part (A) shows that by making 360 equal monthly payments of about $2,812, the
    total interest of the loan (after 3 years) amounted to $1.243184e+04 or $12,431.84.
    By paying $5,000.00, namely, ($5,000.00 – $2,812.00) = $2,188 more per monthly
    payment, the following computation in R shows the concomitant benefit!


    ```

    > amort.table(Loan=1000000, pmt=5000,

    + i=0.025, pf=12, plot=TRUE)

