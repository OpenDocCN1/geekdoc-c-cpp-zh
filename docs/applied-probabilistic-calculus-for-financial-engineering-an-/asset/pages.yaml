- pgno: 416
  md: '# 4 An exercise in financial modeling for assets allocation.


    # The GARCH Process and the CRAN Package tseries


    # The generalized autoregressive conditional heteroskedasticity process


    The generalized autoregressive conditional heteroskedasticity (GARCH) process
    is an econometric term developed in 1982 by Robert F. Engle, an economist and
    the 2003 winner of the Nobel Memorial Prize for Economics, to describe an approach
    to estimate volatility in financial markets. There are several forms of GARCH
    modeling. The GARCH process is often preferred by financial modeling professionals
    because it provides a more real-world context than other forms when trying to
    predict the prices and rates of financial instruments.


    The general process for a GARCH model involves three steps:


    +   1) The first is to estimate a best-fitting autoregressive model.

    +   2) The second is to compute autocorrelations of the error term.

    +   3) The third is to test for significance.


    GARCH models are used by financial professionals in several areas, including trading,
    investing, hedging, and dealing. Two other widely used approaches to estimate
    and predict financial volatility are as follows:


    +   - The classic historical volatility (VolSD) method

    +   - The exponentially weighted moving average volatility (VolEWMA) method.


    # The GARCH Process


    GARCH models help to describe financial markets in which volatility can change,
    becoming more volatile during periods of financial crises or world events and
    less volatile during periods of relatively calm and steady economic growth. On
    a plot of returns, for example, stock returns may look relatively uniform for
    the years leading up to a financial crisis such as the one in 2007. In the time
    period following the onset of a crisis, however, returns may swing wildly from
    negative to positive territory. Moreover, the increased volatility may be predictive
    of volatility going forward. Volatility may then return to levels resembling that
    of precrisis levels or be more uniform going forward. A simple regression model
    does not account for this variation in volatility exhibited in financial markets
    and is not representative of the "black swan" events that occur more than one
    would predict.


    # GARCH Models for Asset Returns


    GARCH processes differ from homoskedastic models, which assume constant volatility
    and are used in basic ordinary least squares (OLS) analysis. OLS aims to minimize
    the deviations between data points and a regression line to fit those points.
    With asset returns, volatility seems to vary during certain periods of time and
    depends on past variance, making a homoskedastic model not optimal or suitable.'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'GARCH processes, being autoregressive, depend on past squared observations
    and past variances to model for current variance. They are widely used in finance
    owing to their effectiveness in modeling asset returns and inflation. A GARCH
    process aims to minimize errors in forecasting by accounting for errors in prior
    forecasting, enhancing the accuracy of ongoing predictions.


    More on the GARCH Process: http://www.investopedia.com/terms/generalizedautoregressiveconditionalheteroskedasticity.asp#ixzz4XwGOV3MI


    And now consider a CRAN package based on GARCH:


