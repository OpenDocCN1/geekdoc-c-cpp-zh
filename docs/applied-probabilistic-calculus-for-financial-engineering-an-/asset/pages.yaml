    decimals of π.


    +   - A Deterministic Model versus a Probabilistic Model

    +   - A Combined Deterministic and Probabilistic Model


    # 2.5.1.2 Other Models for Simulating Random Walk Systems Using R


    The following are the two, among many, efficient models for simulating random
    walk systems that have been found to be useful in financial engineering and econometric
    data modeling:


    +   1) The Cox–Ingersoll–Ross (CIR) model

    +   2) The Chan–Karoly– Longstaff–Sanders (CKLS) model


    The CIR model is generally used to describe the evolution of interest rates. It
    is a type of "one-factor model" (aka a short rate model) as it models interest
    rate movements as driven by only one source of market risk. The model may be used
    in the valuation of interest rate derivatives. It was introduced in 1985 by J.C.
    Cox, J.E. Ingersoll, and S.A. Ross. The CIR model assumes that the instantaneous
    interest rate follows the stochastic (probabilistic) differential equation. The
    CIR is an ergodic process, and possesses a stationary distribution.


    The CKLS models belong to a class of parametric stochastic differential equations
    widely used in many finance applications, in particular to model interest rates
    or asset prices. This model nests a class of asset pricing models such as the
    CIR. This flexibility of the CKLS model spawns many empirical applications.'
