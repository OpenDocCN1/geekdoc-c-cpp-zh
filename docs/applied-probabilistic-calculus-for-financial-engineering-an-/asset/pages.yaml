    # 3.2.4 Management of Portfolios Consisting of Two Risky Assets


    In the management of portfolios consisting of two risky assets, the approach may
    begin by constructing portfolios that are mean-variance efficient, using the following
    distribution of asset returns and the investors’ behavior:


    +   1. All returns are

    +      a) covariance stationary,

    +      b) ergodic, and

    +      c) jointly normally distributed over the investment horizon.


    This implies that means, variances, and covariances of returns are constant over
    the investment horizon and completely characterize the joint distribution of returns.


    +   1) Investors know the values of asset return means, variances, and covariances.

    +   2) Investors are only concerned about the portfolio expected return and portfolio
    variance. Investors prefer portfolios with high expected return but not portfolios
    with high return variance.


    With the above assumptions, it is possible to characterize the set of efficient
    portfolios, that is, those portfolios that have the highest expected return for
    a given level of risk as measured by portfolio variance. These portfolios are
    the investors’ most likely choice.


    For a numerical example of the management of portfolios consisting of two risky
    assets, use the data set in Table 3.2.


    # Example 3.5 Portfolios Consisting of Two Risky Assets


