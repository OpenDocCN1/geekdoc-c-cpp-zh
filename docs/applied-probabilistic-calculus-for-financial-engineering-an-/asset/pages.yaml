  md: '# 6


    # Financial Risk Modeling and Portfolio Optimization Using R


    # 6.1 Introduction to the Optimization Process


    # 6.1.1 Classical Optimization Approach in Mathematics


    Generally, an optimization process may be represented in the following way:


    Given: a function f: A → R from some set A to the set of all real numbers R.


    To find:


    +   a) "Maximization". An element x₀ in A such that f(x₀) ≥ f(x), for all x in
    A, or

    +   b) "Minimization". An element x₀ in A such that f(x₀) ≤ f(x), for all x in
    A.


    Such a formulation is called an optimization problem or a mathematical programming
    problem. Many theoretical as well as real-world problems may be modeled in this
    general approach, for example:


    +   • A is some subset of the Euclidean space Rⁿ, often specified by a set of
    constraints, equalities, or inequalities that the members of a have to satisfy.

    +   • A feasible solution that minimizes (or maximizes) the objective function
    is called an optimal solution.


    # 6.1.1 Global and Local Optimal Values


    A real-valued function f defined on a domain X has a global (or absolute) maximum
    point at x₁ if and only if f(x₁) ≥ f(x), for all x in X.


    Similarly, the function has a global (or absolute) minimum point at x₂ if and
    only if f(x₂) ≤ f(x), for all x in X.


    The value of the function at a maximum point is called the maximum value of the
    function, and the value of the function at a minimum point is called the minimum
    value of the function.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# Remarks:


    +   - If the domain X is a metric space, then f is said to have a local (or relative)
    maximum point at the point x* if there exists some ε > 0 such that f(x*) ≥ f(x),
    for all x in X within a distance ε of x*.

    +   - Similarly, the function has a local (or relative) minimum point at x* if
    f(x*) ≤ f(x), for all x in X within a distance ε of x*.

    +   - A similar definition can be used when X is a topological space, since the
    definition just given can be re-expressed in terms of neighborhoods. Note that
    a global maximum point is always a local maximum point, and similarly for minimum
    points.

    +   - In both the global and local cases, the concept of a strict extremum can
    be defined. For example, x* is a strict global maximum point if, for all x in
    X with x ≠ x*, one has f(x*) > f(x), and x* is a strict local maximum point if
    there exists some ε > 0 such that, for all x in X within distance ε of x* with
    x ≠ x*, one has f(x*) > f(x).

    +   - A point is a strict global maximum point if and only if it is the unique
    global maximum point, and similarly for minimum points.

    +   - Conventional optimization problems are usually stated in terms of minimization.
    Generally, unless both the objective function and the feasible region are convex
    in a minimization problem, there may be several local minima.


    +   - If the domain X is a metric space, then f is said to have a local (or relative)
    maximum point at the point x* if there exists some ε > 0 such that f(x*) ≥ f(x),
    for all x in X within distance ε of x*.

    +   - Similarly, the function has a local minimum point at x* if f(x*) ≤ f(x),
    for all x in X within distance ε of x*.


    # 6.1.1.2 Graphical Illustrations of Global and Local Optimal Value


    The foregoing concepts of global and local maximum or minimum are illustrated
    in Figure 6.1.


    # 6.1.2 Locating Functional Maxima and Minima


    +   - Finding global maxima and minima is the aim of mathematical optimization.
    If a function is continuous on a closed interval, then by the extreme value theorem
    global maxima and minima exist.

    +   - Also, a global maximum (or minimum) must either be a local maximum (or minimum)
    in the interior of the domain or must lie on the boundary of the domain. Hence,
    an approach for finding a global maximum (or minimum) is to examine all the local
    maxima (or minima) in the interior, and also look at'
