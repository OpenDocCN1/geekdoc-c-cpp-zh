    # 3.2.4.3 Introduction to Portfolio Optimization


    For the efficient set of portfolios as described in Figure 3.6, the critical question
    will be


    > "Which portfolio should an investor choose? And why?"


    Of the efficient portfolios, investors will select the one that closely supports
    their risk preferences. In general, risk-averse investors will prefer a portfolio
    that has low risk, namely, low volatility, and will prefer a portfolio close to
    the global minimum-variance portfolio.


    On the other hand, risk-tolerant investors will ignore volatility and seek portfolios
    with high expected returns. These investors will choose portfolios with large
    amounts of asset A that may involve short-selling asset B.


    # 3.2.5 Attractive Portfolios with Risk-Free Assets


    In Section 3.1.4, an efficient set of portfolios in the absence of a risk-free
    asset was constructed. Now consider what happens when a risk-free asset is being
    introduced.'
