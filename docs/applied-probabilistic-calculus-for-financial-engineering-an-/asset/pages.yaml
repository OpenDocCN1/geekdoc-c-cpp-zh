    dC = (∂f/∂t)dt + (∂f/∂S)adt + (∂f/∂S)bvw(dt)^{1/2}

    + 1/2 (∂²f/∂S²)(adt + bvw(dt)^{1/2})²

    + (∂²f/∂S∂t)(adt + bvw(dt)^{1/2})(dt) + 1/2 (∂²f/∂t²)(dt)²

    + higher order terms

    (2.31)


    With the expansion of the squared term and the product term the result is


    dC = (∂f/∂t)dt + (∂f/∂S)adt + (∂f/∂S)bvw(dt)^{1/2}

    + 1/2 (∂²f/∂S²)(a²(dt)² + 2abvw(dt)^{3/2} + b²v²w²dt)

    + (∂f/∂S∂t)(a(dt)² + bvw(dt)^{3/2}) + 1/2 (∂²f/∂t²)(dt)²

    + higher order terms

    (2.32)


    Taking into account the infinitesimal nature of dt so that dt to any power higher
    than unity vanishes, namely, all the terms in red in Equation (2.32) vanish, so
    that Equation (2.32) may be reduced to


    dC = (∂f/∂t)dt + (∂f/∂S)adt + (∂f/∂S)bvw(dt)^{1/2}

    + 1/2 (∂²f/∂S²)(b²v²w²dt)

    (2.33)


    Now, the expected value of w² is unity, hence the expected value of dC is


    [∂f/∂t + (∂f/∂S)a + 1/2 (∂²f/∂S²)b²]dt

    (2.34)


    This, (2.32), is the deterministic component of dC.


    The probabilistic, or stochastic, component is the term that depends upon dz,
    which in (2.31) is represented as vw(dt)^{1/2}. Therefore, the probabilistic,
    or stochastic, component is

    [(∂f/∂S)b]dz

    (2.35)


    In the foregoing derivation, it would seem that there is an additional stochastic
    term that arises from the random deviations of w² from its expected value of 1;
    that is, the additional term

    1/2 (∂²f/∂S²)(b²v²w²dt)

    (2.36)


    However, the variance of this additional term is proportional to (dt)³, whereas
    the variance of the stochastic term given in Equation (2.33) is proportional to
    (dt). Thus the stochastic term given in Equation (2.34) vanishes in comparison
    with the stochastic term given in Equation (2.33).


    # Worked Example 2.1


    If X_t = exp(W_t), what is dX_t?'
