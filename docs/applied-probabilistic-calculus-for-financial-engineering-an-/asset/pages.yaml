    Now, U, being a convex function, will have a single global maxima. If one maximizes
    the utility with no constraints, then there is a closed-form solution. The exact
    solution may be found by taking the first derivative of (3.81) with respect to
    the weight w and setting it to zero:


    dU/dw = Π - δ Σ w = 0  (3.82)


    Solving (3.82) for Π (the vector of excess returns) yields:

    Π = δ Σ w  (3.83)

