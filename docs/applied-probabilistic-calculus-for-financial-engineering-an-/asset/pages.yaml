    # 6.4.4  More Worked Examples of Portfolio Optimization Using R


    # 6.4.4.1  Worked Examples of Portfolio Optimization – No. 1 Portfolio Optimization
    by `PerformanceAnalytics` in CRAN


    The R package `PerformanceAnalytics`, is a collection of econometric functions
    for performance and risk analysis, designed to analyze nonnormal return streams
    in asset allocation and portfolio optimization. It is mostly tested on return
    data, rather than on price, but most functions will work with irregular return
    data as well, and increasing numbers of functions will work with price data where
    possible.


    `PortfolioAnalytics-package`


    # Numeric Methods for Optimization of Portfolios


    **Description**  `PortfolioAnalytics` is an R package providing numerical solutions
    for portfolio problems with complex constraints and objective sets. The goal of
    the package is to aid practitioners and researchers in solving portfolio optimization
    problems with complex constraints and objectives that mirror real-world applications.


    One of the goals of the packages is to provide a common interface to specify constraints
    and objectives that can be solved by any supported solver (i.e.,'
  merge: -1
