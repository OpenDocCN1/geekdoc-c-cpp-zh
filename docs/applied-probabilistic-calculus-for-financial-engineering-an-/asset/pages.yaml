- pgno: 199
  md: '+   - If the actual asset return itself cannot be used, then an appropriate
    proxy can be used, for example, S&P 500 Index for U.S. Domestic Large Cap equities.
    The return on a short-term sovereign bond, for example, U.S. 4- or 13-week treasury
    bill, would suffice for most U.S. investor''s risk-free rate.

    +   - When applied to the asset allocation problem, finding the market capitalization
    information for liquid asset classes might be a challenge for an individual investor,
    but likely presents little obstacle for an institutional investor because of their
    access to index information from the various providers.

    +   - Given the limited availability of market capitalization data for illiquid
    asset classes, for example, real estate, private equity, commodities, even institutional
    investors might have a difficult time piecing together adequate market capitalization
    information.

    +   - Return data for these same asset classes can also be complicated by delays,
    smoothing, and inconsistencies in reporting.

    +   - Further complicating the problem is the question of how to deal with hedge
    funds or absolute return managers. The question of whether they should be considered
    a separate asset class calls for further research!

    +   - Next, the investor needs to quantify their views so that they can be applied
    and new return estimates computed. The views can be derived from quantitative
    or qualitative processes, and can be complete or incomplete, or even conflicting.

    +   - Finally, the outputs from the model need to be fed into a portfolio selection
    model to generate the efficient frontier, and an efficient portfolio selected.

    +   - Bevan and Winkelmann (1999) provided a description of their asset allocation
    process (for international fixed income) and how they use the Black-Litterman
    model within that process. This includes their approaches to calibrating the model
    and information on how they compute the covariance matrices. The standard Black-Litterman
    model does not provide direct sensitivity of the prior to market factors besides
    the asset returns. It is fairly simple to extend the Black-Litterman model to
    use a multifactor model for the prior distribution. Krishnan and Mains (2005)
    have provided extensions to the model that allow adding additional cross-asset
    factors that are not priced in the market.

    +   - Examples of such factors are a recession, or credit, market factor. Their
    approach is general and could be applied to other factors if desired. Most of
    the Black-Litterman literature reports results using the closed-form solution
    for unconstrained mean variance optimization. They also tend to use non-extreme
    views in their examples.

    +   - As part of an investment process, it is reasonable to conclude that some
    constraints would be applied at least in terms of restricting short selling and
    limiting concentration in asset classes. Lack of a budget constraint is also consistent
    with a Bayesian investor who may not wish to be 100% invested in the market due
    to uncertainty about their beliefs in the market.'
