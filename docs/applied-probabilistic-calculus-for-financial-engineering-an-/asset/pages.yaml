    \ unlikely indeed!\n```\n\n# Some Remarks on Expected Shortfall\n\n+   - **Expected\
    \ shortfall (ES)** is a risk measure – a concept used in the field of financial\
    \ risk measurement to evaluate the market risk, or credit risk, of a portfolio.\n\
    +   \n+     The “expected shortfall at q% level” is the expected return on the\
    \ portfolio in the worst q% of cases. ES is an alternative to Value at Risk that\
    \ is more sensitive to the shape of the tail of the loss distribution.\n+   -\
    \ Expected shortfall is also called\n+     a) Conditional Value at Risk (CVaR),\n\
    +     b) Average Value at Risk (AVaR), and\n+     c) Expected Tail Loss (ETL).\n\
    +   - ES estimates the risk of an investment in a conservative way, focusing on\
    \ the less profitable outcomes. A value of q ES often used in practice is 5%.\n\
    +   - Expected shortfall is a coherent, as well as a spectral, measure of financial\
    \ portfolio risk. It requires a quantile-level, q and is defined to be the expected\
