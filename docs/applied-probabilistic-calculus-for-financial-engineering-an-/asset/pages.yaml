  md: '# Review Questions and Exercises


    1 Contrast the following three classical theories of portfolio allocation using


    +   - i) The Markowitz model,

    +   - ii) The Black–Litterman model, and

    +   - iii) Capital asset pricing model (CAPM)


    in terms of the following aspects of these models:


    +   - a The assumptions of each model

    +   - b The advantages and disadvantages of these assumptions


    2 With respect to the Black–Litterman model for assets allocation and portfolio
    optimization,


    +   - a state and discuss the basic assumptions and the strengths and weaknesses
    of this model;

    +   - b state and discuss available improvements suggested for this model.


    3 The Black–Scholes equation, and boundary conditions, for a European option call
    is


    ∂C/∂t + ½σ²S²∂²C/∂S² + rS∂C/∂S − rC = 0 (RE-3.1)


    where

    C = the value of the call = C(S, t),

    S = the fixed Strike price,

    t = time,

    r = the risk-free interest rate,

    and

    σ = the volatility of the underlying asset.


    Equation (RE-3.1) is a rather complicated second-order partial differential equation
    (pde).

    It may be somewhat simplified, as follows:

    If S is fixed and E is variable, show the European option price. C = C(E, t) also
    satisfies the following partial differential equation:


    ∂C/∂t + ½σ²E²∂²C/∂E² − rE∂C/∂E = 0 (RE-3.2)'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# As an Example:\n\nIn the analysis of a pde, often useful solutions may be\
    \ found by judicial changes of variables. A typical case is the classical heat/mass\
    \ diffusion equation, solvable by the method of Separation of Variables:\n\n∂u/∂t\
    \ = c² ∂²u/∂x²  (RE-3.3)\n\nwith boundary conditions:\n\nu(0, t) = 0 = u(L, t),\
    \ ∀t\n u(x, 0) = f(x), ∀t = 0\n\nand an initial condition: u(x, 0)=f(x), a given\
    \ function of x.\n\nAn elementary approach is to assume the separable of the independent\
    \ variables: x and t, so that one may write\n\nu(x, t) = X(x) T(t)  (RE-3.4)\n\
    \nand obtain, after some elementary steps, the final solution:\n\nu(x, t) = Σ_{n=0}^∞\
    \ B_n sin(nπ/l x) exp(-n² π² c² t / l²)\n\nwhere\n\nB_n = (2/l) ∫_0^l f(x) sin(nπ/l\
    \ x) dx, ∀ positive integers n\n\n# 4 The CRAN package BLCOP—implementing the\
    \ Black–Litterman approach to Assets Allocation and Portfolio Optimization:\n\n\
    # BLCOP: Black–Litterman and Copula Opinion Pooling Frameworks\n\nAn implementation\
    \ of the Black–Litterman model and Atilio Meucci’s copula opinion pooling framework.\n\
    \n| Version | 0.3.1 |\n| Depends | methods, MASS, quadprog |\n| Imports | RUnit\
    \ (≥ 0.4.22), timeSeries, fBasics, fMultivar, fPortfolio (≥3011.81) |\n| Suggests\
    \ | sn, corpcor, mnormt |\n| Published | 2015-02-04 |\n| Author | Francisco Gochez,\
    \ Richard Chandler-Mant, Suchen Jin, Jinjing Xie |\n| Maintainer | Ava Yang <ayang\
    \ at mango-solutions.com> |"
  merge: -1
  img_proc: true
