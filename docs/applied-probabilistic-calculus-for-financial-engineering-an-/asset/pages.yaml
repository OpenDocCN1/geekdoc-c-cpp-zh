    # 5.2.3 The Mortality Model


    Mortality may be modeled using the “Gompertz law of mortality”:


    > The probability of a person dying increases at a relatively constant exponential
    rate as age increases.


    Here, one may use the formulation of Gompertz law for mortality – for which the
    Milesky–Robinson form of this law is the probability of survival to age t ≤115
    conditional on a life at age a, is given by


    $q_t = \exp\{\exp\{(a - m)/b\}[1 - \exp\{(t - a)/b\}]\}$ (5.10)


    where

    m is the modal lifespan

    b is the dispersion coefficient.


    One may use the Gompertz parameters that are fitted to the discrete, “Annuity
    2000 Basic Table,” mortality table using the following procedure: the probability
    of having at least one member of a married couple surviving to age t is


    $q_t = q_t^{\text{Male}} + q_t^{\text{Female}} - q_t^{\text{Male}} q_t^{\text{Female}}$
    (5.11)


    Using this table, which contains the mortality rates per 1,000 persons (for males
    and females), ages 5–115, in Equation (5.12) – in which Mort$_t^{\text{Gender}}$
    denotes the mortality rate for a person of the given age t and gender – one may
    compute the survival rates for persons of ages 65 to 115 for each gender, as follows:


    $q_t^{\text{Gender}} = \begin{cases} 1,\ t = 65 \\ q_{t-1}^{\text{Gender}} \{1
    - (\text{Mort}_t^{\text{Gender}} / 1000)\},\ t > 65 \end{cases}$ (5.12)


    From this model, one may calculate the probability of a person, of a given gender,
    dying at age t > 65


    $p_t^{\text{Gender}} = q_{t-1}^{\text{Gender}} - q_t^{\text{Gender}}$ (5.13)


    For a given gender, the age which reaches its maximum value is the modal age for
