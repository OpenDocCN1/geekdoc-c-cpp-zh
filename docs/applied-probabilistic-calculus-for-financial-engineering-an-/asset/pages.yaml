- pgno: 471
  md: 'package is to aid practitioners and researchers in solving portfolio optimization
    problems with complex constraints and objectives that reflect real-world applications.


    One of the goals of this package is to provide a common interface to specify constraints
    and objectives that can be solved by any supported optimization method. The supported
    optimization methods include the following:


    +   - Random portfolios

    +   - Differential evolution

    +   - Particle swarm optimization

    +   - Generalized simulated annealing

    +   - Linear and quadratic programming routines


    The solver can be specified with the optimize-method argument in `optimize.portfolio`
    and `optimize.portfolio.rebalancing`. The optimize-method argument must be one
    of `random`, `DEoptim`, `pso`, `GenSA`, `ROI`, `quadprog`, `glpk`, or performed
    with the differential evolution optimizer.


    This package `PortfolioAnalytics` allows one to obtain a numerical portfolio solution
    for rather complex constraints or objective functions. For risk measure, one may
    use a function that returns the specific risk measure as the objective function.


    The numerical optimization is performed either with the differential evolution
    optimizer contained in the package `DEoptim` (see Worked Example No. 2) or by
    means of randomly generated portfolios satisfying the given constraints.


    # Selected Example:


    From the `PortfolioAnalytics`-package


    # Numeric methods for optimization of portfolios


    | ac.ranking | Asset Ranking |

    | Description | Compute the first moment from a single complete sort |

    | Usage | `ac.ranking(R, order, ...)` |


    # Arguments


    | R | xts object of asset returns |

    | order | a vector of indexes of the relative ranking of expected asset returns
    in ascending order. For example, `order = c(2, 3, 1, 4)` means that the expected
    returns of `R[,2] < R[,3] < R[,1] < R[,4]`. |

    | ... | any other passthrough parameters |


    # Details


    This function computes the estimated centroid vector from a single complete sort
    using the analytical approximation as described in Almgren and Chriss, Portfolios'
