    # Argument


    what  The type of what gives the type of data to be read.


    The supported types are logical, integer, numeric, complex, character, raw, and
    list. If what is a list, it is assumed that the lines of the data file are records
    each containing length (what) items (fields) and the list components should have
    elements that are one of the first six types listed or NULL.


    The what argument describes the tokens that scan() should expect in the input
    file.


    For a detailed description of this function, execute


    ```

    > ?scan

    ```


    The methodology of applying scan() is similar to c(), as described in Section
    4.4.1.4, except that it does not matter the numbers are being entered on different
    lines, it will still be a vector.


    +   - Use scan() when accessing data from a file that has an irregular or a complex
    structure.

    +   - Use scan() to read individual tokens and use the argument what to describe
    the stream of tokens in the file.

    +   - scan() converts tokens into data, and then assemble the data into records.

    +   - Use scan() along with readLines(), especially when one attempts to read
    an unorthodox file format. Together, these two functions will likely result in
    a successful processing of the individual lines and tokens of the file!


    The function readLines() reads lines from a file, and returns them to a list of
    character strings:


    ```

    > lines <- readLines("input.text")

    ```


    One may limit the number of lines to be read, per pass, by using the n parameter
    that gives the maximum number of lines to be read:


    ```

    > lines <- readLines("input.text", n=5)

    > # read 5 lines and stop

    ```'
