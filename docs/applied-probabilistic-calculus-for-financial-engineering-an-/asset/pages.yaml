    # 3.2.7 Analyses and Interpretation of Efficient Portfolios


    For a given risk level, efficient portfolios have high expected returns—as measured
    by portfolio standard deviations. Thus, for those portfolios that yield expected
    returns above the T-Bill rates, the efficient portfolios may also be characterized
    as those that have minimum risks for a given target expected return—as measured
    by the portfolio standard deviation.


    # Example 3.15 Assets Allocation for Efficient Portfolios


    An investor has the choice of investing $1,000,000 in a risk-free asset A or a
    risky asset B:


    +   - The risky asset B will either halve or double, with equal probability:

    +     $2,000,000 (DOUBLED !)

    +     /

    +     $1,000,000

    +     \

    +     $50,000 (HALVED !)

    +   - The risk-free asset A will yield a certain return of 3% p.a., namely, $1,030,000.

    +   - How should one decide which, and how much, of these assets to build the
    portfolio?


    To analyze the portfolio allocation challenge, the following steps (known as Modern
    Portfolio Theory—this approach has its origin in Mean-Variance Portfolio Analysis—developed
    by Harry Markowitz in the 1960s, and is considered as the first step in the development
    of modern financial engineering) may be taken:


    +   - The critical issue in this asset allocation problem is to answer the question:
    “How much of one’s wealth should be invested in each asset so as to maximize the
    overall gain?”

    +   - Prior to the time that the mean-variance analysis of Markowitz became known,
    an investment advisor would be expected to provide advice like “If one is young,
    one should be putting money into a couple of good growth stocks, maybe even into
    a few small stocks. For now it is the time to take risks.'
