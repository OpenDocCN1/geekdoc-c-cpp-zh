  md: '# Preface


    *The Financial Challenges and Experience of a Typical Retiring Couple – Mr. and
    Mrs. Smith (not their real name)*


    About 10 years ago, after a lifetime of steady work for some 40 years, Mr. John
    A. Smith and Mrs. Mary B. Smith of California were preparing for a life of active
    retirement, including extensive traveling worldwide. To take care of their future
    financial needs, they had decided to obtain the services of a local professional
    financial engineering and investment management company – XYZ (fictitious) – of
    California that conducts its transactions through a large national financial engineering
    corporation: LPL (Linsco – 1968 and Private Ledger – 1973).


    To that end, Mr. and Mrs. Smith invested a sum of approximately $2,000,000 from
    their life savings, with the following twin goals:


    +   i) The preservation of their capital of $2 M

    +    ii) Receiving a regular net monthly cash income of at least $10,000 from
    XYZ


    Thus, if the original capital of $2 M were to be preserved (approximately unchanged),
    as well as to maintain a steady withdrawal of $10,000 per month, the average annual
    return of the investment of the $2 M will have to be on the order of (10,000 ×
    12)/2,000,000 = 0.06, or 6%.


    The financial services management typically charges fees on the order of 1.5%.
    Thus, a rough estimate that the financial management should achieve would be on
    the order of 6% + 1.5%, or 7.5%.


    How does a service such as XYZ/LPL achieve such a goal? Approximately 10 years
    after their retirement, on Tuesday, November 15, 2016, the financial markets closed
    at


    | Item | Value |

    |------|-------|

    | Dow (DJIA) | 18,923.06/+54.03/+0.29% |

    | Nasdaq | 5,275.62/+57.22/+1.10% |

    | S&P 500 | 2,180.39/+16.19/+ 0.75% |

    | Gold | $1,229.00 per oz +0.37% |'
