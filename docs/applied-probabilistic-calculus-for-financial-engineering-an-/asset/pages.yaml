    # 5.2 Classical Assets Allocation Approaches


    *Asset allocation* is the undertaking of an investment strategy in order to balance
    risk versus reward by adjusting the percentage of each asset in an investment
    portfolio according to the investor''s risk tolerance, goals, and investment time
    frame.


