    # 1.4.1 Modern Portfolio Theory (MPT)


    In MPT, it is assumed that investors are *risk averse*, namely, if there exist
    two portfolios that offer the same expected return, rational investors will prefer
    the less risky one. Thus, an investor will accept increased risk only if compensated
    by higher expected returns. Conversely, an investor who wants higher expected
    returns must accept more risk. That is,


    increased risks ⇔ higher expected returns.


    (1.1)


    # 1.4.2 Asset Allocation and Portfolio Volatility


    It is reasonable to assume that a *rational* investor will not invest in a portfolio
    if there exists another available portfolio with a more favorable profile. Portfolio
    return is the proportion-weighted combination of the constituent assets’ returns.


    **Asset Allocation** Asset allocation is the process of organizing investments
    among different kinds of asset categories, such as stocks, bonds, derivatives,
    cash, and real estate, in order to accommodate and achieve a practical combination
    of risks and returns, that is consistent with an investor’s specific goals. Usually,
    the process involves portfolio optimization, which consists of three general steps:


    +   - **Step I:** The investor specifies asset classes and models forward-looking
    assumptions for each asset classes’ return and risk as well as movements among
    the asset classes. For a scenario-based approach, returns are simulated based
    on all the forward-looking assumptions.

    +   - **Step II:** One arrives at an optimization algorithm in which allocations
    to different asset classes are set. These allocations are known as the asset mix.

    +   - **Step III:** The asset mix return and wealth forecasts are projected over
    various investment probabilities, and scenarios predict and demonstrate the potential
    outcomes. Thus, an investor may inspect an estimate of what the portfolio value
    would be (say) 2 years into the future if its returns were in the bottom 10% of
    the projected range during this period. Mean-variance optimization (MVO) is commonly
    used for creating efficient asset allocation strategies. But MVO has its limitations
    – illustrated herein as follows.'
