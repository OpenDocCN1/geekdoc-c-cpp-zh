    in the area of risk management by students and practitioners alike. As he claims,
    MATLAB indeed might have been the most suitable language when he originally wrote
    the functions, but, with growing popularity of R, it is not entirely valid. As
    ''Dowd''s'' code was not intended to be error-free and were mainly for reference,
    some functions in this package have inherited those errors. An attempt will be
    made in future releases to identify and correct them.'
