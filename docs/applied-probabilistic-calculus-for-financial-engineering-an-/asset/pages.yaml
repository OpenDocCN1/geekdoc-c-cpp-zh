    \  # Check!\n# END OF THIS PRACTICE SESSION!\n```\n\n# 4.2.2 The R Environment\
    \ – This is Important!\n\nGetting through the First Session in Section 4.2.1 shows:\n\
    \nTechnically, R is an expression language with a simple syntax, which is almost\
    \ self-explanatory. It is case sensitive, so x and X are different symbols and\
    \ refer to different variables. All alphanumeric symbols are allowed, plus '.'\
    \ and '_', with the restriction that a name must start with '.' or a letter, and\
    \ if it starts with '.' the second character must not be a digit. The command\
    \ prompt > indicates when R is ready for input.\n\nThis is where one types commands\
    \ to be processed by R, which will happen when one hits the ENTER key. Commands\
    \ consist of either expressions or assignments. When an expression is given as\
    \ a command, it is immediately evaluated, printed, and the value is discarded.\
    \ An assignment evaluates an expression and passes the value to a variable – but\
    \ the value is not automatically printed. To print the computed value, simple\
    \ enter the variable again at the next command. Commands are separated either\
    \ by a new line, or separated by a semicolon (';'). Several elementary commands\
    \ may be grouped together into one compound expression by braces ('{' and '}').\n\
    \nComments, starting with a hashmark/number sign ('#'), may be put almost anywhere:\
    \ everything to the end of the line following this sign is a comment. Comments\
    \ may not be used in an argument list of a function definition or inside strings.\
    \ If a command is not complete at the end of a line, R will give a different prompt,\
    \ a '+' sign, by default.\n\nOn the second and subsequent lines, continue to read\
    \ input until the command is completed syntactically. The result of a command\
    \ is printed to the output device: If the result is an array, such as a vector\
    \ or a matrix, then the"
