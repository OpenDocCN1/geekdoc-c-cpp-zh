    +   - Use a confidence interval

    +   - Use the variance of residuals in a factor model

    +   - Use Idzorek’s method to specify the confidence along the weight dimension


    # Proportional to the Variance of the Prior


    Assume that the variance of the views will be proportional to the variance of
    the asset returns, just as the variance of the prior distribution is. Both He
    and Litterman (1999) and Meucci (2006) use this method, although they use it differently.
    He and Litterman (1999) expressed the variance of the views as follows:


    ω_ij = τ(P Σ P^T), ∀ i = j   (3.86a)

    = 0, ∀ i ≠ j


    Or


    Ω = diag[ τ(P Σ P^T) ]   (3.86b)


    This specification of the variance, or uncertainty, of the views essentially equally
    weights the investor’s views and the market equilibrium weights. By including
    τ in the expression, the posterior estimate of the returns becomes independent
    of τ as well.


