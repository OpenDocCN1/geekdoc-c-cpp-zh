  md: 'This new test statistic ξ in (3.148) is distributed as χ²(q), where q is the
    number of views. It is the square of the Mahalanobis distance of the posterior
    return estimate versus the posterior covariance of the estimate. One may use this
    test statistic to determine if the views are consistent with the prior by means
    of a standard confidence test:


    P(q) = 1 − F{ξ(q)}  (3.149)


    where F(ξ) is the CDF of the χ²(q) distribution.


    One may also calculate the sensitivities of this measure to the views using the
    chain rule:


    ∂P/∂q = (∂P/∂ξ)(∂ξ/∂q)  (3.150)


    Substituting the various terms,


    ∂P/∂q = −f(ξ){2[(Ω + PΣPᵀ)⁻¹(Q − PI)]ᵀ}  (3.151)


    where f(ξ) is the PDF of the χ²(q) distribution.


    # The Theil Measure of the Source of Posterior Information


    Theil (1963) describes a measure that may be used to determine the contribution
    to the posterior precision of the prior and the views. This measure was called
    θ sums to 1 across all sources, and conveniently also sums across the views if
    one measures the contribution of each view.


    The measure for the contribution to posterior precision from the prior is


    θ_prior = (1/n) tr{(Σ⁻¹)[(Σ⁻¹) + Pᵀ Ω⁻¹ P]⁻¹}  (3.152)


    where n is the number of assets. Equation (3.153) can be used for all views by
    using the full matrices P and Ω. For a single view i, use the relevant slices
    of P and Ω:


    θ_i = (1/n) tr[(P_iᵀ Ω_i⁻¹ P_i)[(Σ⁻¹)⁻¹ + Pᵀ Ω⁻¹ P]⁻¹]  (3.153)


    Equations (3.152) and (3.153) provide the equations one may use to compute the
    contribution toward the posterior precision from both the prior and the views.
    One may use this diagnostic to identify if the relative contributions match the
    intuitive view on this proportion.


    # Fusai and Meucci''s Measure of Consistency


    Next consider the work of Fusai and Meucci (2003). In their paper they present
    a way to quantify the statistical difference between the posterior return estimates
    and the prior estimates. This provided a way to calibrate the uncertainty of the
    views and ensured that the prior posterior estimates are not extreme when viewed
    in the context of the prior equilibrium estimates.'
