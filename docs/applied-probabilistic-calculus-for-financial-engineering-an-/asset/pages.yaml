    # Arbitrage


    The arbitrage pricing theory is a fundamental theories in the world of finance.
    Tise theory states that two otherwise identical assets cannot sell at different
    prices. This means that there are no opportunities to make an instantaneous risk-free
    profit. Here one is assuming that the risk-free rate to be that of a bank account
    or a government bond, such as a Treasury bill.


    To illustrate the application of arbitrage, consider a simple example of a stock
    that is traded in the U.S. and in London. In the U.S. the price of the stock is
    $200 and the asset sells for £150 in London, while the exchange rate is $1.50
    per pound, £. A person could make an instantaneous profit by simultaneously buying
    1,000 shares of stock in New York and selling them in London. An instantaneous
    profit of


    1,000* {($1.50*150) – $200} = $25,000


    is realized without risk!


    # Hedging


    In financial investments, it appears that traders are attracted to three classes
    of derivative securities: speculators, arbitrageurs, and hedgers:


    +   1) Speculators take long or short positions in derivatives to increase their
    exposure to the market, betting that the underlying asset will go up or go down.

    +   2) Arbitrageurs find mispriced securities and instantaneously lock in a profit
    by adopting certain trading strategies.

    +   3) Hedgers who take positions in derivative securities opposite those taken
    in the underlying asset in order to help manage risk.


    For example, consider an investor who owns 100 shares of Apple which is currently
    priced $100. The person is concerned that the stock might decline sharply in the
    next two months. The person could buy put options on Apple to sell 100 shares
    at a price of $80. The person would pay the price of the options, but this would
    ensure that he could sell the stock for $80 at expiration if the stock declines
    sharply. One very important hedging strategy is delta hedging. The delta, Δ, of
    the option is defined as the change of the option price V = V(S, t) with respect
    to the change in the price S of the underlying asset, at time t. In other words,
    delta is the first derivative of the option price with respect to the stock price:


    Δ = ∂V / ∂S

    (3.209)


