- pgno: 85
  md: 'expected return (i.e., discount rate) for an asset in a market, given the risk-free
    rate available to investors and the risk of the market as a whole.


    The CAPM is usually expressed as follows:


    E(R_i) = R_f + β_i [E(R_m) - R_f]  (3.12)


    where β is the asset sensitivity to a change in the overall market, and is usually
    found via correlations on historical data, noting that


    +   - a) β > 1: signifying more than average “riskiness” for the asset’s contribution
    to overall portfolio risk;

    +   - b) β < 1: signifying a lower than average risk contribution to the portfolio
    risk.

    +   - c) [E(R_m) − R_f] is the market premium, the expected excess return of the
    market portfolio’s expected return over the risk-free rate.


    The above conclusions may be established as follows:


    +   - i) The initial risks of the portfolio m = w_m² σ_m² When an additional risky
    asset a is added to the market portfolio m, the incremental impact on risk and
    expected return follows from the formulas for a two-asset portfolio. The results
    may then be used to derive the asset-appropriate discount rate as follows:

    +   - ii) The market portfolio’s risk = {w_m² σ_m² + w_a² σ_a² + 2 w_m w_a ρ_am
    σ_a σ_m} Hence, the risk added to the portfolio = [w_a² σ_a² + 2 w_m w_a ρ_am
    σ_a σ_m] but the weight of the asset will be relatively low, namely, w_a² ≈ 0,
    hence w_a² σ_a² ≈ 0, so that the additional risk ≈ 2 w_m w_a ρ_am σ_a σ_m.

    +   - iii) Since the market portfolio’s expected return = (w_m E(R_m) + [w_a E(R_a)]),
    the additional expected return = [w_a E(R_a)].

    +   - iv) On the other hand, if an asset a is accurately priced, the improvement
    in its risk-to-expected return ratio obtained by adding it to the market portfolio
    m will at least match the gains of spending that money on an increased stake in
    the market portfolio. The assumption here is that the investor will buy the asset
    with funds borrowed at the risk-free rate R_f. This is reasonable if


    E(R_a) > R_f  (3.13)


    Hence, [w_a(E(R_a) - R_f)] / {2 w_m w_a ρ_am σ_a σ_m} = [w_a(E(R_m) - R_f)] /
    [2 w_m w_a ρ_m σ_m σ_m]  (3.14) that is, [E(R_a)] = R_f + [E(R_m) - R_f] * [ρ_am
    σ_a σ_m] / [σ_m σ_m]  (3.15) or [E(R_a)] = R_f + [E(R_m) - R_f] * [σ_am] / [σ_mm]  (3.16)'
