    The arguments of these R functions are:


    A list of variables: currently these should be numerals or character vectors or
    a list containing such vectors.


    Modes The modes to be used for the variables.

    Names The names to be used for the variables.

    data A list of numeric and/or character vectors.

    modes A list of length up to that of data giving the modes of (some of) the variables.
    list() is allowed.


    The function data.entry() edits an existing object, saving the changes to the
    original object name.


    However, the function edit() edits an existing object but not saving the changes
    to the original object name so that one must assign it to an object name (even
    if it is the original name). To enter a vector, one needs to initialize a vector
    and then use the function data.entry(). For example:


    Start by entering the R environment, and set


    ```

    > x <- c(2, 4, 6, 8, 10)

    > # X is initially defined as an array of 5 elements.

    > x # Just checking - to make sure!

    [1] 2 4 6 8 10 # x is indeed set to be an array of 5 elements

    >

    > data.entry(x) # Entering the Data Editor:

    > # The Data Editor window pops up, and looking at the first

    > # column: it is now named "x", with the first 5 rows (all on first

    > # column) filled, respectively, by the numbers 2, 4, 6, 8, 10

    > # One can now edit this dataset by, say, changing all the

    > # entries to 2, then closing the Data Editor window, and

    > # returning to the R console window:

    > x

    [1] 2 2 2 2 2 # x is indeed changed!

    > # Thus one can change the entries for x via the Data Editor,

    > # and save the changes.

    ```


    When using the functions data.entry(x) and edit() for data entry, there are a
    number of limitations:


    +   i) Arrays and nontabular lists cannot be entered using a spreadsheet editor.

    +   ii) When using the function edit() to create a new data frame, one must assign
    an object name in order to save the data frame.'
