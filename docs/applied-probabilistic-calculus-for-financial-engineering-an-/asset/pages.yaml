    # Additional Work


    Consider efforts to reproduce results from some of the major research papers on
    the Black–Litterman model.


    Of the major papers on the Black–Litterman model, there are two that would be
    very useful to reproduce:


    +   1. Satchell and Scowcroft (2000)

    +   2. Black and Litterman (1992)


    Satchell and Scowcroft (2000) did not provide enough data in their paper to reproduce
    their results. They have several examples, one with 11 countries equity returns
    plus currency returns, and one with 15 countries. They did not provide the covariance
    matrix for either example, and so their analysis cannot be reproduced. It would
    be interesting to confirm that they use the Alternative Reference Model by reproducing
    their results.


    Black and Litterman (1992) did provide what seems to be all the inputs to their
    analysis, although they chose a nontrivial example, including partially hedged
    equity and bond returns. This requires the application of some constraints to
    the reverse optimization process that have been formulated. It should be useful
    to continue this work with the goal of verifying the details of the Black–Litterman
    implementation used in Black and Litterman (1992).


    # Extensions to the Black–Litterman Model


    This section covers the extensions to the Black–Litterman model proposed in Idzorek
    (2005), Fusai and Meucci (2003), Krishnan and Mains (2006), and Qian and Gorman
    (2001).'
