  md: 'where:

    Σ (y_i − f_i)² = the explained variation

    = the original observed values from the calculated Y values

    = the sum of squared deviation of the calculated values from the mean of the observed
    Y values, or

    = the sum of squares due to regression (SSR)

    Σ (y_i − y)² = the unexplained variation

    = the sum of squared deviations of the original observations from the calculated
    values

    = the sum of squares about regression, or

    = the error sum of squares (SSE)


    The total variation is the sum of squared deviations of each observation of Y
    from the mean of the observations:

    Σ(y_i − y)² = Σ(y_i − f_i)² + Σ(f_i − y)² … (4.12)

    namely,

    SST = SSR + SSE (4.13)

    or

    total sum of squares = explained(regression)sum of squares

    + unexplained(error)sum squares + … (4.14)


    The Multiple Correlation Model Analysis – The object of this approach is to gain
    insight into the strength of the relationship between variables.

    The multiple regression correlation model analysis equation is

    y_j = β₀ + β₁x₁j + β₂x₂j + β₃x₃j + … + βₙxₙj + e_j + … (4.15)

    where y_j is a typical value from one of the subpopulations of Y values, the β_i
    are the regression coefficients, x₁j, x₂j, x₃j, …, xₙj are, respectively, particular
    known values of the random variables X₁, X₂, X₃, …, Xₙ, and e_j is a random variable
    with mean 0 and variance σ², the common variance of the subpopulation of Y values.
    Generally, e_j is assumed normal and independently distributed.


    This model is similar to model Equation (4.5), with the following important distinction:

    in Equation (4.5), the x_i are nonrandom variables, but

    in Equation (4.9), the x_i are random variables.

    That is, in the correlation model, Equation (4.9), there is a joint distribution
    of Y and the X_i that is called a multivariate distribution.'
