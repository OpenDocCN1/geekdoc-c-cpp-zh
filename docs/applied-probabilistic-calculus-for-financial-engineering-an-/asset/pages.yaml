- pgno: 23
  md: '# 1


    # Introduction to Financial Engineering


    # 1.1 What Is Financial Engineering?


    In today''s understanding and everyday usage, *financial engineering* is a multidisciplinary
    field in finance, and in theoretical and practical economics involving financial
    theory, the tools of applied mathematics and statistics, the methodologies of
    engineering, and the practice of computer programming. It also involves the application
    of technical methods, especially in mathematical and computational finance in
    the practice of financial investment and management.


    However, despite its name, financial engineering does *not* belong to any of the
    traditional engineering fields even though many financial engineers may have engineering
    backgrounds. Some universities offer a postgraduate degree in the field of financial
    engineering requiring applicants to have a background in engineering. In the United
    States, ABET (the Accreditation Board for Engineering and Technology) does *not*
    accredit financial engineering degrees. In the United States, financial engineering
    programs are accredited by the International Association of Quantitative Finance.


    Financial engineering uses tools from economics, mathematics, statistics, and
    computer science. Broadly speaking, one who uses technical tools in finance may
    be called a financial engineer: for example, a statistician in a bank or a computer
    programmer in a government economic bureau. However, most practitioners restrict
    this term to someone educated in the full range of tools of modern finance and
    whose work is informed by financial theory. It may be restricted to cover only
    those originating new financial products and strategies. Financial engineering
    plays a critical role in the customer-driven derivatives business that includes
    quantitative modeling and programming, trading, and risk managing derivative products
    in compliance with applicable legal regulations.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A broader term that covers anyone using mathematics for practical financial
    investment purposes is “Quant”, which includes financial engineers.


    # 1.2 The Meaning of the Title of This Book


    The wide use of the open-source computer software R testifies to its versatility
    and its concomitant increasing popularity, bearing in mind that the ubiquitous
    application of R is most probably due to its suitability for personal mobile-friendly
    desktop/laptop/panel/tablet/device computer usage. The Venn diagram that follows
    illustrates the interactional relationship in this context. Three subjects enunciated
    in this book are as follows:


    +   1) *Applied probabilistic calculus* (APC)

    +   2) *Assets allocation and portfolio optimization in financial engineering*
    (AAPOFE)

    +   3) *The computer language* (R)


    The concomitant relationship may be graphically illustrated by the mutually intersecting
    relationships in the following Venn diagram, APC ∩ AAPOFE ∩ R.


    Thus, this book is concerned with the distinctive subjects of importance and relevance
    within these areas of interest, including Applied Probabilistic Calculus and Assets
    Allocation and Portfolio Optimization in Financial Engineering, namely, APC ∩
    FE, to be followed by critical areas of the computational and numerical aspects
    of Applied Probabilistic Calculus for (Assets Allocation and Portfolio Optimization
    in) Financial Engineering: An Introduction Using R, namely, APC ∩ FE ∩ R. This
    is represented by the “red” area in Figure 1.1, being the common area of mutual
    intersection of the three areas of special interest.


    ![](img/551ca8853d2ba8528201e7a57e5006b4_24_0.png)


    Figure 1.1 Applied Probabilistic Calculus for Financial Engineering: An Introduction
    Using R namely, APC ∩ FE ∩ R.'
