  md: 'the gradients are zeros), *it is implicitly assumed that these minima do exist!*
    However, in probabilistic calculus, such minima, or even such turning points,
    may not exist or may not be readily located. Heuristic approaches may be called
    upon to locate any existing and available minima.


    Some useful heuristic methodology in locating minima, and the corresponding R
    programs for minimization are discussed in the following sections.


    # ### 6.2.1  The Evolutionary Algorithms (EA)


    Optimization algorithms inspired by the process of natural selection have been
    in use since the 1950s, and are often referred to as evolutionary algorithms.
    The genetic algorithm is one such method, and was invented by Holland in the 1960s.
    Genetic algorithms apply logical operations, usually on bit strings of fixed or
    variable lengths, in order to perform crossover, mutation, and selection on a
    population. Following successive generations, the members of the population are
    more likely to be a minimum of an objective function. Genetic algorithms have
    shown to be useful heuristic methods for global optimization, in particular for
    combinatorial optimization problems. Evolution strategies are another variety
    of evolutionary algorithm. Genetic algorithms apply logical operations, usually
    on bit strings of fixed or variable length, in order to perform crossover, mutation,
    and selection on a population. Following successive generations, the members of
    the population are more likely to represent a minimum of an objective function.


    Genetic algorithms are useful heuristic methods for global optimization, in particular
    for combinatorial optimization problems.


    # ### 6.2.2  The Differential Evolution (DE) Algorithm


    Another useful approach in portfolio optimization, particularly in assessing the
    equal risk contributions to the portfolio, is the differential evolution (DE)
    algorithm, introduced by Storn and Ulrich (1997), with its application demonstrated
    by Price, et al. (2006). It is considered to be a genetic algorithm, and is a
    derivative-free global optimizer.


    The `DEoptim` implementation of DE was motivated by the objective of extending
    the set of algorithms available for global optimization in the R language and
    environment for statistical computing (R Development Core Team 2009). R enables
    rapid prototyping of objective functions, access to a wide array of tools for
    statistical modeling, and ability to generate customized plots of results with
    ease (which in many situations makes use of R preferable over the use of programs
    in languages like Java, MS Visual C++, Fortran 90, or Pascal). `DEoptim` is available
    at http://CRAN.R-project.org/package=DEoptim.'
