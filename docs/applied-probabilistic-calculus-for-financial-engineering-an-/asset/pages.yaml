- pgno: 455
  md: 'optimization method). Currently, supported optimization methods include the
    following:


    +   - Random portfolios

    +   - Differential evolution

    +   - Particle swarm optimization

    +   - Generalized simulated annealing

    +   - Linear and quadratic programming routines


    The solver can be specified with the optimize_method argument in optimize.portfolio
    and optimize.portfolio.rebalancing. The optimize_method argument must be one of
    random, DEoptim, pso, GenSA, ROI, quadprog, glpk, or symphony. Additional information
    on random portfolios is provided further. The differential evolution algorithm
    is implemented via the DEoptim package, the particle swarm optimization algorithm
    via the pso package, the generalized simulated annealing via the GenSA package,
    and linear and quadratic programming are implemented via the ROI package that
    acts as an interface to the Rglpk, Rsymphony.


