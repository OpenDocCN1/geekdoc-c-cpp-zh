  md: 'not contradict the prior estimates. Theil (1971) described a method of performing
    a hypothesis test to verify that the views are compatible with the prior. That
    work is being extended to measure compatibility of the posterior and the prior.
    Fusai and Meucci (2003) described a method for testing the compatibility of the
    posterior and prior when using the alternative reference model. He and Litterman
    (1999) and Braga and Natale (2007) described measures that may be used to measure
    the distance between two distributions, or the amount of tilt between the prior
    and the posterior. These measures did not lend themselves to hypothesis testing,
    but they may be used as constraints on the optimization process. He and Litterman
    (1999) define a metric, Λ, which measured the tilt induced in the posterior by
    each view. Braga and Natale (2007) used Tracking Error Volatility (TEV) to measure
    the distance from the prior to the posterior.


    # Theil’s Measure of Compatibility Between the Views and the Prior


    Theil (1971) described this as testing the compatibility of the views with the
    prior information. Given the linear mixed estimation model, one has the prior
    (3.132) and the conditional (3.133):


    xβ = π + u

    (3.132)


    pβ = q + v

    (3.133)


    The mixed estimation model defines u as a random vector with mean 0 and covariance
    Σ_u, and v as a random vector with mean 0 and covariance Ω.


    The approach being taken here is very similar to the approach taken when analyzing
    a prediction from a linear regression. One has two estimates of the views, the
    conditional estimate of the view and the posterior estimate of the returns.


    One may define the posterior estimate as β_. One may measure the estimation error
    between the prior and the views as


    ζ = (xβ_ - μ) = x(β_ - β) + u

    (3.134)


    The vector ζ has mean 0 and variance V(ζ). One shall form one’s own hypothesis
    test using the formulation


    ξ = E(ζ) V(ζ)^{-1} E(ζ)

    (3.135)


    The quantity ξ is known as the Mahalanobis distance (multidimensional analog of
    the z-score) and is distributed as χ²(n). In order to use this form, one needs
    to solve for the E(ζ) and V(ζ).


    If one considers only the information in the views, the estimator of β is


    β_ = (P^T Ω^{-1} P)^{-1} P^T Ω^{-1} Q

    (3.136)


    Note that since P is not required to be a matrix of full rank, one might not be
    able to evaluate this formula as written. One works in return space here (as'
