    Currently, charts displays standard style OHLC charts familiar in financial applications
    or line charts not passing OHLC data. Works with objects having explicit time-series
    properties.


    Line charts are created with close data, or from single column time series. The
    subset argument can be used to specify a particular area of the series to view.
    The underlying series is left intact to allow for TA functions to use the full
    data set. Additionally, it is possible to use syntax borrowed from the first and
    last functions, for example, "last 4 months."


    TA allows for the inclusion of a variety of chart overlays and technical indicators.
    A full list is available from addTA. The default TA argument is addVo() - which
    adds volume, if available, to the chart being drawn. theme requires an object
    of class chart.theme, created by a call to chartTheme. This function can be used
    to modify the look of the resulting chart. See chart.theme for details. line.type
    and bar.type allow further fine tuning of chart styles to user tastes. multi.col
    implements a color coding scheme used in some charting applications, and follows
    the following rules:


    +   - grey => Op[t] < Cl[t] and Op[t] < Cl[t-1]

    +   - white => Op[t] < Cl[t] and Op[t] > Cl[t-1]

    +   - red => Op[t] > Cl[t] and Op[t] < Cl[t-1]

    +   - black => Op[t] > Cl[t] and Op[t] > Cl[t-1]


    reChart takes any number of arguments from the original chart call and redraws
    the chart with the updated parameters. One item of note: If multiple'
