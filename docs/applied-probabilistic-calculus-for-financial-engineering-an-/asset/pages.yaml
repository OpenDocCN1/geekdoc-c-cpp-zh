    # 1.8 Some Less Commendable Stock Investment Approaches


    In financial trading and investment environment today in which computerization
    and specialized mathematical algorithms can and do play significant roles, some
    investment agencies, as well as individual investors, have found it almost irresistible
    to wander into and along these paths. Two such well-known paths are day trading
    and algorithmic trading. It should not escape once attention that serious investors
    should be aware of the high chances for losses in these, and similar, “get rich
    quick” schemes. For the sake of completeness, one should mention two such well-known
    schemes:


    +   1) Day trading

    +   2) Algorithmic trading


    The following are brief description of these schemes.


    # 1.8.1 Day Trading


    *Day trading* is the speculation in stocks, bonds, options, currencies, and future
    contracts and other securities, by buying and selling financial instruments within
    the *same* trading day. Once, day trading was an activity exclusive to professional
    speculators and financial companies. The common use of “buying on margin” (using
    borrowed funds) greatly increases gains and losses, such that substantial gains
    or losses may occur in a very short period of time.


    # 1.8.2 Algorithmic Trading


    *Algorithmic trading* is a method of placing a large order by sending small portions
    of the order out to the market over time. It is an automated method of executing
    an order using automated preprogrammed trading instructions providing preset instructions
    accounting for variables such as price, volume, and time. It claims to be a way
    to minimize the costs, market impacts, and risks in the execution of an order
    – thus eliminating human intervention and decisions in the process.'
