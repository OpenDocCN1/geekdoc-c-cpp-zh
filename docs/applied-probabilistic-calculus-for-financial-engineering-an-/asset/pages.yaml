  md: '`plot.type = "storepop"` results in a plot of stored populations (which are
    only available if these have been saved by setting the control argument of DEoptim()
    appropriately). Storing intermediate populations allows us to examine the progress
    of the optimization in detail. A summary method also exists and returns the best
    parameter vector, the best value of the objective function, the number of generations
    optimization ran, and the number of times the objective function was evaluated.


    # Note


    DE is a search heuristic introduced by Storn and Price (1997). Its remarkable
    performance as a global optimization algorithm on continuous numerical minimization
    problems has been extensively explored. DE belongs to the class of genetic algorithms
    that use biology-inspired operations of crossover, mutation, and selection on
    a population in order to minimize an objective function over the course of successive
    generations. As with other evolutionary algorithms, DE solves optimization problems
    by evolving a population of candidate solutions using alteration and selection
    operators. DE uses floating-point instead of bit string encoding of population
    members, and arithmetic operations instead of logical operations in mutation.
    DE is particularly well suited to find the global optimum of a real-valued function
    of real-valued parameters, and does not require that the function be either continuous
    or differentiable.


    Let NP denote the number of parameter vectors (members) x ∈ R^k in the population.
    In order to create the initial generation, NP guesses for the optimal value of
    the parameter vector are made, either using random values between lower and upper
    bounds (defined by the user) or using values given by the user. Each generation
    involves creation of a new population from the current population members. This
    is accomplished using differential mutation of the population members. An initial
    mutant parameter vector v_i is created by choosing three members of the population,
    x_{r0}, x_{r1}, and x_{r2}, at random. Then v_i is generated as


    v_i = x_{r0} + F(x_{r1} - x_{r2})


    where F is the differential weighting factor, effective values for which are typically
    between 0 and 1. After the first mutation operation, mutation is continued until
    d mutations have been made, with a crossover probability CR ∈ [0, 1]. The crossover
    probability CR controls the fraction of the parameter values that are copied from
    the mutant. If an element of the trial parameter vector is found to violate the
    bounds after mutation and crossover, it is reset in such a way that the bounds
    are respected (with the specific protocol depending on the implementation). Then,
    the objective function values associated with the children are determined. If
    a trial vector has equal or lower objective function value than the previous vector,
    it replaces the previous vector in the population;'
