  md: "Rewriting Equation (3.105):\n\n$\\Pi = \\Pi + \\tau\\Sigma P^{T}\\left[(P\\\
    tau\\Sigma P^{T})+\\Omega\\right]^{-1}[Q-P\\Pi]$  (3.105)\n\nnoting that one may\
    \ move around the $\\tau$ term:\n\n$\\Pi = \\Pi + \\tau\\Sigma P^{T}\\left[(P\\\
    tau\\Sigma P^{T})+\\left(\\frac{\\Omega}{\\tau}\\right)\\right]^{-1}[Q-P\\Pi]$\
    \  (3.106)\n\nNow it is seen that $\\tau$ only appears in one term in this formula.\
    \ Because the Alternative Reference Model does not include updating the covariance\
    \ of the estimates, this is the only formula. Given that the investor is deciding\
    \ both $\\Omega$ and $\\tau$ to control the blending of the prior and their views,\
    \ one may eliminate one of the terms. Since $\\tau$ is a single term for all views\
    \ and $\\Omega$ has a separate element for each view, one shall keep $\\Omega$.\
    \ One may then rewrite the posterior estimate of the mean as follows:\n\n$\\Pi\
    \ = \\Pi + \\Sigma P^{T}\\left[(P\\Sigma P^{T})+\\Omega\\right]^{-1}[Q-P\\Pi]$\
    \  (3.107)\n\nThe primary artifacts of this new reference model are as follows:\n\
    \n+   i) $\\tau$ is gone.  \n+   ii) The investor’s portfolio weights in the absence\
    \ of views equal the equilibrium portfolio weights.  \n+   iii) Finally, at implementation\
    \ time, there is no need or use of (3.106) or (3.107).\n\n**Remark:**\n\n+   1)\
    \ None of the authors prior to Meucci (2008), except for Black and Litterman (1992)\
    \ and He and Litterman (1999), make any mention of the details of the Canonical\
    \ Reference Model or of the fact that different authors actually use quite different\
    \ reference models.  \n+   2) In the Canonical Reference Model, the updated posterior\
    \ covariance of the unknown mean about the estimate will be smaller than the covariance\
    \ of either the prior or conditional estimates, indicating that the addition of\
    \ more information will reduce the uncertainty of the model. The variance of the\
    \ returns from (3.107) will never be less than the prior variance of returns.\
    \ This matches the intuition as adding more information should reduce the uncertainty\
    \ of the estimates.  \n+   3) Since there is some uncertainty in this value ($M$),\
    \ (3.107) provides a better estimator of the variance of returns than the prior\
    \ variance of returns.\n\n**Impact of $\\tau$**  For the users of the Black–Litterman\
    \ model, the meaning and impact of the parameter $\\tau$ may cause confusion.\
    \ Investors using the Canonical Reference Model use $\\tau$ and that it does have\
    \ a very precise meaning in the model. An author who selects an essentially random\
    \ value for $\\tau$ probably does not using the Canonical Reference Model, but\
    \ instead uses the Alternative Reference Model."
