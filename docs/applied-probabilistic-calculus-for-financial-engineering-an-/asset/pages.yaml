    # Straddle in the Black-Scholes Model


    What is a Straddle? A straddle, also known as disambiguation, is a type of financial
    investment strategy involving simultaneously both the put and call of a given
    stock, to provide additional opportunities for profiting (with the concomitant
    risk for losing!).'
