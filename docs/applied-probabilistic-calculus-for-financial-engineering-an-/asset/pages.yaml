- pgno: 260
  md: 'Magnetic recordings allow for both reading and writing capabilities. This method
    may be used in areas where data security is important. The largest application
    for this type of data capture is the PIN number found on automatic bank cards.
    A computer keyboard is one of the best known input (or data entry) devices in
    current use. In the past, people performed data entry using punch cards or paper
    tape.


    Some modern examples of data input devices are


    +   - optical mark reader

    +   - bar code reader

    +   - scanner used in desktop publishing

    +   - light pen

    +   - trackball

    +   - mouse


    Once data have been entered into a computer database, the next step is ensuring
    that all of the responses are accurate. This method is known as data editing.


    # Data Editing


    Data should be edited before being presented as information. This action ensures
    that the information provided is accurate, complete, and consistent. There are
    two levels of data editing – micro- and macroediting. Microediting corrects the
    data at the record level. This process detects errors in data through checks of
    the individual data records. The intent at this point is to determine the consistency
    of the data and correct the individual data records. Macroediting also detects
    errors in data, but does this through the analysis of aggregate data (totals).
    The data are compared with data from other surveys, administrative files, or earlier
    versions of the same data. This process determines the compatibility of data.


    # Imputations


    Editing is of little value to the overall improvement of the actual survey results,
    if no corrective action is taken when items fail to follow the rules set out during
    the editing process. When all of the data have been edited using the applied rules
    and a file is found to have missing data, then imputation is usually done as a
    separate step. Nonresponse and invalid data definitely impact the quality of the
    survey results. Imputation resolves the problems of missing, invalid, or incomplete
    responses identified during editing, as well as any editing errors that might
    have occurred. At this stage, all of the data are screened for errors because
    respondents are not the only ones capable of making mistakes; errors can also
    occur during coding and editing.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Some other types of imputation methods include the following:


    +   - Hot deck uses other records as "donors" in order to answer the question
    (or set of questions) that needs imputation.

    +   - Substitution relies on the availability of comparable data. Imputed data
    can be extracted from the respondent''s record from a previous cycle of the survey,
    or the imputed data can be taken from the respondent''s alternative source file
    (e.g., administrative files or other survey files for the same respondent).

    +   - Estimator uses information from other questions or from other answers (from
    the current cycle or a previous cycle), and through mathematical operations derives
    a plausible value for the missing or incorrect field.

    +   - Cold deck makes use of a fixed set of values, which covers all of the data
    items. These values can be constructed with the use of historical data, subject
    matter expertise, and so on.

    +   - The donor can also be found through a method called nearest neighbor imputation.
    In this case, some sort of criteria must be developed to determine which responding
    unit is "most like" the unit with the missing value in accordance with the predetermined
    characteristics. The closest unit to the missing value is then used as the donor.


    Imputation methods can be performed automatically, manually, or in combination.


    # Data Quality


    +   - Quality assurance

    +   - Quality control

    +   - Quality management in statistical agencies


    Quality is an essential element at all levels of processing. To ensure the quality
    of a product or service in survey development activities, both quality assurance
    and quality control methods are used.


    # Quality Assurance


    Quality assurance refers to all planned activities necessary in providing confidence
    that a product or service will satisfy its purpose and the users'' needs. In the
    context of survey conducting activities, this can take place at any of the major
    stages of survey development: planning, design, implementation, processing, evaluation,
    and dissemination.


    This approach anticipates problems prior to their unexpected occurrences, and
    uses all available information to generate improvements. It is not restricted
    to any specific quality, the planning stage, and is all-encompassing in its activities
    standards. It is applicable mostly at the planning stage, and is all-encompassing
    in its activities.


    # Quality Control


    Quality control is a regulatory procedure through which one may measure quality,
    with preset standards, and then act on any differences.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Examples of this include controlling the quality of the coding operation, the
    quality of the survey interviewing, and the quality of the data capture.


    Quality control responds to observed problems, using ongoing measurements to make
    decisions on the processes or products. It requires a prespecified quality for
    comparability. It is applicable mostly at the processing stage following a set
    procedure that is a subset of quality assurance.


    # Quality Management in Statistical Agencies


    The quality of the data must be defined and assured in the context of being “fit
    for use,” which will depend on the intended function of the data and the fundamental
    characteristics of quality. It also depends on the users’ expectations of what
    is considered to be useful information.


    There is no standard definition among statistical agencies for the term "official
    Statistics." There is a generally accepted, but evolving, range of quality issues
    underlying the concept of "fitness for use". These elements of quality need to
    be considered and balanced in the design and implementation of an agency''s statistical
    program.


    The following is a list of the elements of quality:


    +   - Relevance

    +   - Accuracy

    +   - Timeliness

    +   - Accessibility

    +   - Interpretability

    +   - Coherence


    These elements of quality tend to overlap. Just as there is no single measure
    of accuracy, there is no effective statistical model for bringing together all
    these characteristics of quality into a single indicator. Also, except in simple
    or one-dimensional cases, there is no general statistical model for determining
    whether one particular set of quality characteristics provides higher overall
    quality than another.


    # Producing Results


    After editing, data may be processed further to produce a desired output. The
    computer software used to process the data will depend on the form of output required.
    Software applications for word processing, desktop publishing, graphics (including
    graphing and drawing), programming, databases, and spreadsheets are commonly used.
    The following are some examples of ways that software can produce data:


    +   - *Spreadsheets* are programs that automatically add columns and rows of figures,
    calculate means, and perform statistical analyses.

    +   - *Databases* are electronic filing cabinets. They systematically store data
    for easy access, and produce summaries, aggregates, or reports.

    +   - *Specialized programs* can be developed to edit, clean, impute, and process
    the final tabular output.'
  merge: -1
  img_proc: true
