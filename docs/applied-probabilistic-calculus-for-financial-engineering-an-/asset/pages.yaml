- pgno: 81
  md: 'risk versus expected-return space, and the collection of all such possible
    portfolios defines a characteristic region in this space.


    The left boundary of this region is a hyperbola, and the upper edge of this region
    is the efficient frontier in the absence of a risk-free asset (called “the Markowitz
    Bullet”). Combinations along this upper edge represent portfolios (including no
    holdings of the risk-free asset) for which there is lowest risk for a given level
    of expected return. Equivalently, a portfolio lying on the efficient frontier
    represents the combination offering the best possible expected return for the
    given risk level. The tangent to the hyperbola at the tangency point indicates
    the best possible Capital Allocation Line (CAL).


    In the description and mathematical development of the MPT, matrices are generally
    preferred for calculations of the efficient frontier.


    # Remarks:


    In matrix form, for a given “risk tolerance” q ∈ (0, ∞), the efficient frontier
    may be obtained by minimizing the following expression:


    w^T Σ w - q R^T w  (3.10)


    Here


    +   1) w is a vector of portfolio weights and Σ_i w_i =1. (The weights may be
    negative, which means investors can short a security.)

    +   2) Σ is the covariance matrix for the returns on the assets in the portfolio.

    +   3) q ≥ 0 is a risk tolerance factor, where 0 results in the portfolio with
    minimal risk and ∞ results in the portfolio infinitely far out on the frontier
    with both expected return and risk unbounded.

    +   4) R is a vector of expected return.

    +   5) w^T Σ w is the variance of portfolio return.

    +   6) R^T w is the expected return on the portfolio.


    The above optimization finds the point on the frontier at which the inverse of
    the slope of the frontier would be q if portfolio return variance instead of standard
    deviation were plotted horizontally. The frontier is parametric on q.


    # 3.2.1.4 The Two Mutual Fund Theorem


    An important result of the above analysis is the Two Mutual Fund Theorem that
    states:


    > “Any portfolio on the efficient frontier may be generated by using a combination
    of any two given portfolios on the frontier; the latter two given portfolios are
    the ‘mutual funds’ in the theorem’s name.”'
