    $$f(x,y)=f(a+\alpha t,\ b+\beta t)\equiv F(t)\tag{2.7}$$


    is a composite function of $t$ having continuous derivatives of order $n$. Thus,
    $F(t)$ may be represented by the Maclaurin formula:


    $$F(t)=F(0)+F''(0)t+\{F''''(0)/2!\}t^{2}+\cdots+\{F^{(n)}(\theta t)/n!\}t^{n},\quad
    0<\theta<t\tag{2.8}$$


    The successive derivatives of $F(t)$ may be computed from Equation (2.7) and by
    the *chain rule* for differentiating composite functions:


    If $u=f(x,y)$, then


    $$du/dt=(\partial u/\partial x)(dx/dt)+(\partial u/\partial y)(dy/dt)\tag{2.9}$$


    Thus,


    $$\begin{aligned}F''(t)&=f_x(x,y)(dx/dt)+f_y(x,y)(dy/dt)\\&=f_x(x,y)\alpha+f_y(x,y)\beta\end{aligned}\tag{2.10}$$


    where in the last step, one recalls Equation (2.6).


    Similarly,


    $$\begin{aligned}F''''(t)&=[f_{xx}(x,y)\alpha+f_{xy}(x,y)\beta](dx/dt)+[f_{yx}(x,y)\alpha+f_{yy}(x,y)\beta](dy/dt)\\&=f_{xx}(x,y)\alpha^{2}+2f_{xy}(x,y)\alpha\beta+f_{yy}(x,y)\beta^{2}\end{aligned}$$


    and


    $$\begin{aligned}F^{(n)}(t)&=(\partial^{n}f/\partial x^{n})\alpha^{n}+C_{n,1}(\partial^{n}f/\partial
    x^{n-1}\partial y)\alpha^{n-1}\beta+\cdots\\&+C_{n,n-1}(\partial^{n}f/\partial
    x\partial y^{n-1})\alpha+\partial^{n}f/\partial y^{n}\beta^{n}\end{aligned}$$


    where $C_{n,r}\equiv n!/[r!(n-r)!]$ are the binomial coefficients.


    From Equation (2.6), it is seen that $t=0$ corresponds to the point: $x=a, y=b$,
    so that


    $$\begin{aligned}F(0)&=f(a,b)\\F''(0)&=f_x(a,b)\alpha+f_y(a,b)\beta\\F''''(0)&=f_{xx}(a,b)\alpha^{2}+2f_{xy}(a,b)\alpha\beta+f_{yy}(a,b)\beta^{2}\end{aligned}$$


    and so on.


    Substituting these values in Equation (2.8) gives


    $$\begin{aligned}f(x,y)&=f(a,b)+[f_x(a,b)\alpha+f_y(a,b)\beta]t\\&+(1/2!)[f_{xx}(a,b)\alpha^{2}+2f_{xy}(a,b)\alpha\beta+f_{yy}(a,b)\beta^{2}]+\cdots+R_n\tag{2.11}\end{aligned}$$


    where $R_n=\{F^{(n)}(\theta t)/n!\}\;t^{n},\;0<\theta<1$.'
