  md: 'The initial condition $C(S,T)=\max(S-E,0)$ is transformed into


    $$v(x,0)=\max(e^{x}-1,0)\tag{3.263}$$


    Now we apply another change of variable and let


    $$v=e^{(\alpha x+\beta \tau)}u(x,\tau)\tag{3.264}$$


    Then by simple differentiation, one has


    $$\frac{\partial V}{\partial \tau}=\beta e^{(\alpha x+\beta \tau)}u+e^{(\alpha
    x+\beta \tau)}\frac{\partial u}{\partial \tau}\tag{3.265}$$


    $$\frac{\partial V}{\partial x}=\alpha e^{\alpha x+\beta \tau}u+e^{\alpha x+\beta
    \tau}\frac{\partial u}{\partial x}\tag{3.266}$$


    $$\frac{\partial^{2}v}{\partial x^{2}}=\alpha\left(\alpha e^{\alpha x+\beta \tau}u+e^{\alpha
    x+\beta \tau}\frac{\partial u}{\partial x}\right)+\alpha e^{\alpha x+\beta \tau}\frac{\partial
    u}{\partial x}+e^{\alpha x+\beta \tau}\frac{\partial^{2}u}{\partial x^{2}}\tag{3.267}$$


    Substituting these partials into (3.261) yields


    $$\beta u+\frac{\partial u}{\partial \tau}=\sigma^{2}u+2\alpha\frac{\partial u}{\partial
    x}+\frac{\partial^{2}u}{\partial x^{2}}+(k-1)(\alpha u+\frac{\partial u}{\partial
    x})-ku\tag{3.268}$$


    We may eliminate the $u$ terms and the $\partial u/\partial x$ terms by carefully
    choosing values of $\alpha$ and $\beta$ such that


    $$\beta=\alpha^{2}+(k-1)\alpha-k\tag{3.269}$$


    and


    $$2\alpha+k-1=0\tag{3.270}$$


    One may then rearrange these equations, so they can be written


    $$\alpha=-\tfrac12(k-1)\quad\text{and}\quad\beta=-\tfrac14(k+1)^{2}\tag{3.271}$$


    We now have the transformation from $v$ to $u$ to be


    $$v=\exp\!\left[-\tfrac12(k-1)x-\tfrac14(k+1)^{2}\tau\right]u(x,\tau)\tag{3.272}$$


    resulting in the simple diffusion equation


    $$\frac{du}{d\tau}=\sigma^{2}\frac{d^{2}u}{dx^{2}},\quad\text{for}\quad-\infty<x<\infty,\
    \tau>0.\tag{3.273}$$


    The initial condition has now been changed as well to


    $$u_{0}(x)=u(x,0)=\max\!\left(e^{\tfrac12(k+1)x}-e^{\tfrac12(k-1)x},0\right)\tag{3.274}$$


    The solution to the simple diffusion equation obtained above is well known to
    be


    $$u(x,\tau)=\left[1/\sqrt{2\pi}\right]\int_{-\infty}^{\infty}u_{0}(s)\exp\!\left[-(x-s)^{2}/4\tau\right]ds\tag{3.275}$$'
