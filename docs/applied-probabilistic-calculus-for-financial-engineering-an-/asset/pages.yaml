  md: 'Theil''s Mixed Estimation model starts from a linear model for the parameters
    to be estimated. One may use Equation (3.77) from the reference model as a starting
    point. A simple linear model is shown below:


    xβ = π + u

    (3.90)


    where

    π is the n×1 vector of equilibrium returns for the assets,

    x is the n×n matrix in which are the factor loadings for the model,

    β is the n×1 vector of unknown means for the asset return process, and

    u is an n×1 matrix of residuals from the regression where

    E(u) = 0, V(u) = E(u''u) = Φ


    The Black–Litterman model uses a very simple linear model, the expected return
    for each asset is modeled by a single factor that has a coefficient of 1. Thus,
    x is the identity matrix. Since β and u are independent and x is constant, one
    may model the variance of π as follows:


    V(π) = x'' V(β|x) + V(u)

    (3.91)


    which may be simplified to


    V(π) = Σ + Φ

    (3.92)


    where

    Σ is the historical covariance matrix of asset returns as used earlier.

    Φ is the covariance of residuals or of the estimate about the actual mean.


    This approach connects with (3.78) in the reference model:

    Σ_r = Σ + Σ_e

    (3.78)

    which shows that the proper relationship between the variances is (Σ_r ≥ Σ, Σ_e).
    The total variance of the estimated return is the sum of the variance of the actual
    return process plus the variance of the estimate of the mean. This relationship
    will be revisited at a later stage.


    Next, consider some additional information that one would like to combine with
    the prior. This information may be considered as a subjective view or may be derived
    from statistical data. It may also consider it to be incomplete, meaning that
    one might not have an estimate for each asset return.


    pβ = q + v

    (3.93)


    where

    q is the k×1 vector of returns for the views.

    p is the k×n matrix mapping the views onto the assets,'
