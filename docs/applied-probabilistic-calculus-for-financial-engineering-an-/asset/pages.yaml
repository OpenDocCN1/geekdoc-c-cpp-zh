  md: '![](img/551ca8853d2ba8528201e7a57e5006b4_287_0.png)


    Figure 4.14 An x-y plot for > plot (weight, height, pch=8).


    For example, to change the plotting symbol, one may use the keyword pch (for "plotting
    character") in the following R command:


    ```

    > plot (weight, height, pch=8)

    > # Outputting: Figure 4.14.

    ```


    Note that the output is the same as that shown in Figure 4.13, except that the
    points are marked with little "8-point stars", corresponding to plotting character
    pch = 8.


    In the documentation for pch, a total of 26 options are available, providing different
    plotting characteristics for points in R graphics. They are shown in Figure 4.15.


    The parameter BMI was chosen in order that this value should be independent of
    a person''s height, thus expressing as a single number or index indicative of
    whether a case subject is overweight, and by what relative amount. Of course,
    one may plot "height" as the abscissa (namely, the horizontal "x-axis") and "weight"
    as the ordinate (namely, the vertical "y-axis"), as follows:


    ```

    > plot (height, weight, pch=8) # Outputting: Figure 4.16.

    ```


    Since a normal BMI is between 18.5 and 25, averaging (18.5 + 25)/2 = 21.75. For
    this BMI value, the weight of a typical "normal" person would be (21.75 × height²).
    Thus, one can superimpose a line of "expected" weights at BMI = 21.75 on Figure
    4.16. This line may be accomplished in the R environment by the following code
    segments:


    ```

    > ht <- c(1.79, 1.64, 1.73)

    > lines (ht, 21.75*ht^2) # Outputting: Figure 4.17.

    ```


    ![](img/551ca8853d2ba8528201e7a57e5006b4_287_1.png)


    Figure 4.15 Plotting symbols in R: pch = n, n = 0, 1, 2, . . . , 25.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/551ca8853d2ba8528201e7a57e5006b4_288_0.png)


    Figure 4.16 An x-y plot for > plot (height, weight, pch = 8).


    In the last plot, a new variable for heights (ht) was defined instead of the original
    (height) because


    +   i) The relation between height and weight is a quadratic one, and hence nonlinear.
    Although it may not be obvious on the plot, it is preferable to use points that
    are spread evenly along the x-axis than to rely on the distribution of the original
    data.

    +   ii) As the values of height are not sorted, the line segments would not connect
