- pgno: 281
  md: "# 4.3 R as a Calculator\n\n# 4.3.1 Mathematical Operations Using R\n\nTo learn\
    \ to do statistical analysis and computations, one may start by considering the\
    \ R programming language as a simple calculator.\n\nStart from here: just enter\
    \ an arithmetic expression, press the <Enter> key, and the answer from the machine\
    \ is found in the next line\n\n```\n> \n> 2 + 3\n[1] 5\n>\n```\n\nOK! What about\
    \ other calculations? Such as: 13 - 7, 3 x 5, 12 /4, 7^2, √2, e^3, e^x, ln 5 =\
    \ loge5, (4 + √3)(4 - √3), (4 + i√3)(4 - i√3), ... and so on. Just try:\n\n```\n\
    > \n> 13 - 7\n[1] 6\n> 3*5\n[1] 15\n> 12/4\n[1] 3\n> 7^2\n[1] 49\n> sqrt(2)\n\
    [1] 1.414214\n> \n> exp(3)\n[1] 20.08554\n> \n> exp(1i*pi)  [i is used for the\
    \ complex number i = √-1.]\n[1] -1-0i  [This is just the famous Euler’s Identity\
    \ equation: e^{iπ}+1 = 0.]\n> log(5)\n[1] 1.609438\n> (4 + sqrt(3))*(4 - sqrt(3))\n\
    [1] 13\n[Checking: (4+√3)(4-√3)=42-(√3)2=16-3=13 (Checked!)]\n> (4+1i*sqrt(3))*(4-1i*sqrt(3))\n\
    [1] 19+0i [Checking: (4+1i√3)(4-1i√3)=42-(i√3)2=16-(-3)=19 (Checked!)]\n```"
  merge: -1
  img_proc: true
- pgno: 282
  md: "*Remark:* The [1] in front of the computed result is R's way of outputting\
    \ numbers. It becomes useful when the result is a long vector. The number N in\
    \ the brackets [N] is the index of the first number on that line. For example,\
    \ if one generated 23 random numbers from a normal distribution\n\n```\n```\n\
    > \n> x <- rnorm(23)\n> x\n[1] -0.5561324 0.2478934 -0.8243522 1.0697415 1.5681899\n\
    [6] -0.3396776 -0.7356282 0.7781117 1.2822569 -0.5413498\n[11] 0.3348587 -0.6711245\
    \ -0.7789205 -1.1138432 -1.9582234\n[16] -0.3193033 -0.1942829 0.4973501 -1.5363843\
    \ -0.3729301\n[21] 0.5741554 -0.4651683 -0.2317168\n> \n```\n```\n\n*Remark:*\
    \ After the random numbers have been generated, there is no output until one calls\
    \ for x, namely, x has become a vector with 23 elements, call that a 23-vector.\
    \ The [11] on the third line of the output indicates that 0.3348587 is the 11th\
    \ element in the 23-vector x. The numbers of outputs per line depends on the length\
    \ of each element as well as the width of the page.\n\n# 4.3.2 Assignment of Values\
    \ in R and Computations Using Vectors and Matrices\n\nR is designed to be a dynamically\
    \ typed language, namely, at any time one may change the data type of any variable.\
    \ For example, one can first set x to be numeric as has been done so far, say\
    \ x=7; next one may set x to be a vector, say x=c(1, 2, 3, 4); then again one\
    \ may set x to a word object, such as \"Hi!\". Just watch the following R environment:\n\
    \n```\n```\n> \n> x <- 7\n> x\n[1] 7\n> x <- c(1, 2, 3, 4) # x is assigned to\
    \ be a 4-vector.\n> \n[1] 1 2 3 4\n> x <- c(\"Hi!\") # x is assigned to be a character\
    \ string.\n> x\n[1] \"Hi!\"\n> x <- c(\"Greetings & Salutations!\")\n> x\n[1]\
    \ \"Greetings & Salutations!\"\n```\n```"
