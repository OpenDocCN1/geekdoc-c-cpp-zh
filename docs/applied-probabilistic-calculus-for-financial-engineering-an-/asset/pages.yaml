  md: '# 3.6.2.3 On Implementing the Black-Litterman Model


    Given the following inputs:


    +   - **w** Equilibrium weights for each asset class; derived from capitalization-weighted
    CAPM Market portfolio

    +   - **Σ** Matrix of covariances between the asset classes; can be computed from
    historical data

    +   - **rf** Risk-free rate for base currency

    +   - **δ** The risk aversion coefficient of the market portfolio; this may be
    assumed, or can be computed if one knows the return and standard deviation of
    the market portfolio

    +   - **τ** A measure of uncertainty of the equilibrium variance; usually set
    to a small number on the order of 0.025–0.050.


    First, one uses reverse optimization to compute the vector of equilibrium returns,
    Π, using Equation (3.163):


    Π = δΣw


    (3.163)


    Then one formulates the investors views, and specify P, Ω, and Q. Given k views
    and n assets, then P is a k × n matrix where each row sums to 0 (relative view)
    or 1 (absolute view). Q is a k × 1 vector of the excess returns for each view.
    Ω is a diagonal k × k matrix of the variance of the views, or the confidence in
    the views. To start with, most authors call for the values of ω_i to be set equal
    to p_i^T Σ p_i (where p is the row from P for the specific view).


    Next, assuming one is uncertain in all the views, one applies the Black–Litterman
    “master formula” to compute the posterior estimate of the returns using (3.164):


    Π̂ = Π + τΣ P^T [ (P τ Σ P^T) + Ω ]^{-1} (Q - P Π)


    (3.164)


    One calculates the posterior variance using (3.165):


    M = τΣ - τΣ P^T [ (P τ Σ P^T) + Ω ]^{-1} P τ Σ


    (3.165)


    Closely followed by the computation of the sample variance from (3.166):


    Σ_p = Σ + M


    (3.166)


    And now one may calculate the portfolio weights for the optimal portfolio on the
    unconstrained efficient frontier from (3.167):


    ŵ = Π̂ (δ Σ_p)^{-1}


    (3.167)'
