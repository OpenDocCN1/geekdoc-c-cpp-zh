- pgno: 495
  md: 'otherwise the previous vector remains. Variations of this scheme have also
    been proposed.


    Intuitively, the effect of the scheme is that the shape of the distribution of
    the population in the search space is converging with respect to size and direction
    toward areas with high fitness. The closer the population gets to the global optimum,
    the more the distribution will shrink and, therefore, reinforce the generation
    of smaller difference vectors.


    As a general advice regarding the choice of NP, F, and CR, Storn et al. (2006)
    state the following:


    > Set the number of parents NP to 10 times the number of parameters, select differential
    weighting factor F = 0.8 and crossover constant CR = 0.9. Make sure that you initialize
    your parameter vectors by exploiting their full numerical range, that is, if a
    parameter is allowed to exhibit values in the range [−100, 100], it is a good
    idea to pick the initial values from this range instead of unnecessarily restricting
    diversity. If you experience misconvergence in the optimization process you usually
    have to increase the value for NP, but often you only have to adjust F to be a
    little lower or higher than 0.8. If you increase NP and simultaneously lower F
    a little, convergence is more likely to occur but generally takes longer, that
    is, DE is getting more robust (there is always a convergence speed/robustness
    trade-off).


    DE is much more sensitive to the choice of F than it is to the choice of CR. CR
    is more like a fine tuning element. High values of CR, like CR = 1, give faster
    convergence if convergence occurs. Sometimes, however, you have to go down as
    much as CR = 0 to make DE robust enough for a particular problem. For more details
    on the DE strategy, we refer the reader to Storn and Price (1997) and Price et
    al. (2006).


