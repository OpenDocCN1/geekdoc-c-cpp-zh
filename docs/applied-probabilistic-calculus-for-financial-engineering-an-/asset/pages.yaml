- pgno: 359
  md: '# ## Papers


    The AI scholar is a scientist — standing on the shoulders of giants, yet often
    isolated by the sheer volume of literature. This page collects papers that have
    shaped our understanding — and a few that challenge it.


    # ### Foundations


    +   - Attention Is All You Need (2017) — Vaswani et al. Introduces the Transformer
    architecture, the backbone of modern LLMs.

    +   - BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding
    (2018) — Devlin et al. Establishes bidirectional pre-training for NLP.

    +   - GPT-2: Language Models are Unsupervised Multitask Learners (2018) — Radford
    et al. Demonstrates zero-shot task transfer at scale.


    # ### Recent Highlights


    +   - Chain-of-Thought Prompting Elicits Reasoning in Large Language Models (2022)
    — Wei et al. Shows intermediate reasoning steps improve performance.

    +   - Tree of Thoughts: Deliberate Problem Solving with Large Language Models
    (2023) — Yao et al. Extends CoT with search over multiple reasoning paths.

    +   - LIMA: Less Is More for Alignment (2023) — Zhou et al. Suggests that high-quality
    data, not scale, drives alignment.


    > > "A paper is not just a PDF — it is a conversation across time."


    ![](img/551ca8853d2ba8528201e7a57e5006b4_359_0.png)'
