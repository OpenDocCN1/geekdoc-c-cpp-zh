    Braga and Natale and Tracking Error Volatility (TEV) Braga and Natale (2007) proposed
    the use of tracking error between the posterior and prior portfolios as a measure
    of distance from the prior. Tracking error is commonly used by investors to measure
    risk versus a benchmark, and may be used as an investment constraint. Since it
    is commonly used, most investors have an intuitive understanding and a level of
    comfort with TEV.


    Tracking Error Volatility (TEV) is here defined as


    TEV = √[(w_actv^T Σ w_actv)], where w_actv = w̅ - w_r,  (3.173)


    and where


    +   w_actv is the active weights or active portfolio,

    +   w̅ is the weight in the investor''s portfolio,

    +   w_r is the weight in the reference portfolio, and

    +   Σ is the covariance matrix of returns.


    Moreover, the formula derived for tracking error sensitivities is as follows:
    Given that


    TEV = f(w_actv)  (3.174)


    and one may further refine


    w_actv = g(q)  (3.175)


    where q represents the views.'
