  md: 'represented as a function of S and t. The B in dB denotes Brownian motion,
    which will be described in the next section. It is important to note that μ and
    σ may be estimated for individual stocks using statistical analysis of historical
    prices. It is important that μ and σ are functions of S and t. Combining this
    information together, one obtains the stochastic differential equation


    $dS/S = \mu dt + \sigma dB$  (3.210)


    Notice that if the volatility σ is zero the model implies


    $dS/S = \mu dt$  (3.211)


    When μ is constant this equation can be solved so that


    $S = S_0 e^{\mu t}$  (3.212)


    where S is the price of the stock at t and S₀ is the price of the stock at t =
    0. This equation shows that when the variance of an asset is zero, the asset grows
    at a continuously compounded rate of μ per unit of time.


    # Brownian Motion


    The term Brownian motion, which was originally used as a model for stock price
    movements in 1900 by L. Bachelier [Klebaner, 1998], is a stochastic process B(t)
    characterized by the following three properties:


    +   1. Normal Increments: B(t) − B(s) has a normal distribution with mean 0 and
    variance (t − s). Thus, if s = 0 so that B(t) − B(0) has normal distribution with
    mean 0 and variance (t − 0) = t.

    +   2. Independence of Increments: B(t) − B(s) is independent of the past.

    +   3. Continuity of Paths: B(t), t > 0 are continuous functions of t.


    These three properties alone define Brownian motion, but they also show why Brownian
    motion is used to model stock prices. Property (2) shows stock price changes will
    be independent of past price movements. This was an important assumption made
    in this stock price model.


    An occurrence of Brownian motion from time 0 to T is called a path of the process
    on the interval [0, T]. There are five important properties of Brownian motion
    paths. The path B(t), 0 < t < T


    +   1. is a continuous function of t,

    +   2. is not monotonic on any interval, no matter how small the interval is,

    +   3. is not differentiable at any point,

    +   4. has infinite variation on any interval no matter how small it is,

    +   5. has quadratic variation on [0,t] equal to t, for any t.


    Together, Properties (1) and (3) state that although Brownian motion paths are
    continuous, the ΔB(t) over interval Δt is much larger than Δt as Δt → 0. Properties
    (4) and (5) show the distinction between functions of Brownian motion and normal,
