    # 3.8 Some Worked Examples


    # Worked Examples I Measuring VaR (Value-at-Risk)—American Options


    **Risk Management:** Since the pioneering work of Markowitz in the 1950s, the
    theory and practice of risk management have developed to be a subfield of the
    theory of finance, attracting specialists from many applied mathematical, physical
    science and engineering fields—bringing with them enormous contributions made
    by quantitative disciplines, including mathematics, statistics, and computer science.
    Important principles of risk management have also come from the fields of accounting
    (including auditing, valuation, and management control), management (including
    audit, management control, and valuation), the theory of organization (organizational
    behavior), and law (pervading aspects of risk management). Thus, in risk management,
    while the foundation may be qualitative, the approach is heavily quantitative—much
    like the practice of engineering!


