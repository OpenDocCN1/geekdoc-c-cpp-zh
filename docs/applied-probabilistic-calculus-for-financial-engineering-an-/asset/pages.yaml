- pgno: 493
  md: 'It is important to emphasize that the result of `DEoptim` is a random variable,
    that is, different results may be obtained when the algorithm is run repeatedly
    with the same settings. Hence, the user should set the random seed if they want
    to reproduce the results, for example, by setting `set.seed(1234)` before the
    call of `DEoptim`.


    `DEoptim` relies on repeated evaluation of the objective function in order to
    move the population toward a global minimum. Users interested in making `DEoptim`
    run as fast as possible should consider using the package in parallel mode (so
    that all CPUs available are used), and also ensure that the evaluation of the
    objective function is as efficient as possible (e.g., by using vectorization in
    pure R code, or writing parts of the objective function in a lower level language
    like C or Fortran).


    Further details and examples of the R package `DEoptim` can be found in Mullen
    et al. (2011) and Ardia et al. (2011a, 2011b) or look at the package''s vignette
    by typing `vignette("DEoptim")`. Also, an illustration of the package usage for
    a high-dimensional nonlinear portfolio optimization problem is available by typing
    `vignette("DEoptimPortfolioOptimization")`.


    Please cite the package in publications. Use `citation("DEoptim")`.


    # Value


    The output of the function `DEoptim` is a member of the S3 class `DEoptim`. More
    precisely, this is a list (of length 2) containing the following elements: `optim`,
    a list containing the following elements:


    +   - **bestmem**: the best set of parameters found.

    +   - **bestval**: the value of fn corresponding to bestmem.

    +   - **nfeval**: number of function evaluations.

    +   - **iter**: number of procedure iterations.


    member, a list containing the following elements:


    +   - **lower**: the lower boundary.

    +   - **upper**: the upper boundary.

    +   - **bestvalit**: the best value of fn at each iteration.

    +   - **bestmemit**: the best member at each iteration.

    +   - **pop**: the population generated at the last iteration.

    +   - **storepop**: a list containing the intermediate populations.


