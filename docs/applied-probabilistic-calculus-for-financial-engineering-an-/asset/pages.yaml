  img_proc: true
- pgno: 111
  md: 'A risk-free asset is equivalent to default-free pure discount bond that matures
    at the end of the assumed investment period. The risk-free rate r_f may be represented
    by the nominal return on a low-risk bond. For example, if the investment period
    is 1 month, then the risk-free asset is a 30-day U.S. Treasury bill (T-bill),
    and the risk-free rate is the nominal rate of return on the T-bill. (The "default-free"
    assumption of U.S. national debt has been questioned owing to the possible, and
    probable, inability of the U.S. Congress to address the long-term debt problems
    of the U.S. government.)


    If the portfolio holding of the risk-free assets is positive, then it is equivalent
    to "lending money" at the risk-free rate. If the portfolio holding is negative,
    at "risk-free" rates, then one is "borrowing money that is risk-free!"


    # 3.2.5.1 An Attractive Portfolio with a Risk-Free Asset


    Consider an arbitrary portfolio with asset B, one may examine the consequences
    if one should introduce a risk-free asset (say, a T-Bill) into this portfolio.


    Now the risk-free rate is constant (fixed) over the investment portfolio that
    has the following properties:


    μ_f = E[r_f] = r_f  (3.45a)

    var(r_f) = 0  (3.45b)

    cov(R_B, r_f) = 0  (3.45c)

    Then, within this portfolio,


    +   - let the proportion of the investment in asset B = x_B,

    +   - then the proportion of the investment in T-Bills = (1 - x_B)


    and hence the return of this portfolio is

    R_p = Return owing to the asset B + return owing to the risk-free T-Bills = R_B
    x_B.

    Hence, the portfolio return is given by

    R_p = Return from the asset B + return from the risk – free asset

    = x_B R_B + (1 - x_B) r_f

    = r_f + (R_B - r_f) x_B  (3.46)


    The term (R_B - r_f) is the Excess Return over the T-Bills return on asset B.

    Hence, the Expected Return of the portfolio is

    μ_p = r_f + (E[R_B] - r_f) x_B  (3.47)

    = r_f + (μ_B - r_f) x_B


    In (3.47), the factor (μ_B - r_f) is the Expected Excess Return or Risk Premium
    on asset B.'
