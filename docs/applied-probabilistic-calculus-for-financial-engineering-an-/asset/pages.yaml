  md: '# Worked Examples


    # Worked Example 1: The Black–Litterman (B-L) Asset Allocation Model


    # Overview


    Combining information from two sources to create an estimate of expected returns:


    Source 1: What does the current market tell us about the expected excess returns?


    Implied excess equilibrium returns


    Source 2: What views does the investment manager have about particular stocks,
    sectors, asset classes, or country?


    The BL model combines these different sources to produce estimates of excess returns.


    # Combining Predicted and Implied Returns:


    E(r - r_f) = [(τS)^{-1} + P^T Ω^{-1} P]^{-1} [(τS)^{-1} Π + P^T Ω^{-1} Q]


    # Basic Notation


    +   - τ: A scalar (assume τ = 1).

    +   - S: Variance–covariance matrix for all assets under consideration

    +   - Ω: Uncertainty surrounding your views

    +   - Π: Implied excess returns

    +   - Q: Views on expected excess returns for some or all assets

    +   - P: Link matrix identifying which assets you have views about


    # Understanding the Formula


    Splitting into two sections for better understanding, consider the second section
    first:


    | (τS)^{-1} | Π+ | P^T Ω^{-1} | Q |

    | ↓ | ↓ | ↓ | ↓ |

    | Measures of Confidence | Implied Excess Returns | Confidence | Our Views |'
  merge: -1
