    # Assets Allocation


    For a given amount of initial liquid asset, totaling T₀, the task at hand is that
    one will fully invest *all* this amount in the two stocks A and B. The investment
    problem is the asset allocation decision: how much to allocate in asset A and
    how much in asset B?


    *Let x_A be the fraction of T₀ to be invested in stock A and x_B be the fraction
    of T₀ to be invested in stock B.*


    The values of x_A and x_B may be positive, zero, or negative:


    +   - Positive values imply *long* positions, in the *purchase*, of the asset.

    +   - Negative values imply *short* positions, in the *sales*, of the asset.

    +   - Zero values imply *no* positions in the asset.


    As all the wealth is invested in these two assets, it follows that


    x_A + x_B = 1


    (3.22)


    Thus, if asset A is "shorted," then the proceeds of the short sale will be used
    to buy more of asset B and vice versa. (To "short" an asset, one borrows the asset,
    usually from a broker, and then sells it: and the proceeds from the short sale
    are usually kept on account with a broker—often there may be some restrictions
    that prevent the use of these funds for the purchase of other assets. The short
    position is closed out when the asset is repurchased, and then returned to original
    owner. Should the asset drops in value, then a gain is made on the short sale;
    and if the asset increases in value, then a loss occurred!) Hence, the investment
    problem is *to ascertain the values of x_A and x_B in such a way that the overall
    profit of the investment will always be maximized!*


    The present investment in the two stocks forms a portfolio, and the shares of
    A and B are the portfolio shares or weights.


    In this example, the return on the portfolio, R_p, over the following month is
    a random variable, given by


    R_p = x_A R_A + x_B R_B


    (3.23)


    that is, a weighted average or linear combination of the random variables R_A
    and R_B. Moreover, as both R_A and R_B are assumed to be normally distributed,
    it'
