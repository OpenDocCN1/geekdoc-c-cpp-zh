    # 4.4.2 The Function list() and the Construction of data.frame() in R


    # The Function list()


    A list in R consists of an ordered collection of objects – its components, which
    may be of any modes or types. For examples, a list may consist of a matrix, a
    numeric vector, a complex vector, a logical value, a character array, a function,
    and so on. Thus, some simple way to create a list would be


    Example 1: It is as easy as "1, 2, 3"!


    ```

    > x <- 1

    > y <- 2

    > z <- 3

    > list1 <- list(x, y, z) # Forming a simple list

    > list1 # Outputting:

    [[1]]

    [1] 1

    [[2]]

    [1] 2

    [[3]]

    [1] 3

    ```


    Moreover, the components are always numbered, and may be referred to as such.
    Thus, if my.special.list is the name of a list with four components, they may
    be referred to, individually, as


    my.special.list[[1]], my.special.list[[2]],

    my.special.list[[3]], and my.special.list[[4]].


    ```

    If one defines my.special.list as:

    > my.special.list <- list(name="John", wife="Mary",

    + number.of.children=3, children.age=c(2, 4, 6))

    then

    > my.special.list[[1]] # Outputting:

    [1] "John"

    > my.special.list[[2]]

    [1] "Mary"

    > my.special.list[[3]]

    ```'
