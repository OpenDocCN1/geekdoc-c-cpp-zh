  md: 'combination of holdings of the risk-free asset and the tangency portfolio is
    known as the "One Mutual Fund Theorem," in which the mutual fund referred to is
    the tangency portfolio.


    # 3.2.1.8 Asset Pricing


    Up to this point, the analysis describes the optimal behavior of an individual
    investor. Asset pricing theory depends on this analysis in the following way:


    Since each investor holds the risky assets in identical proportions to each other,
    namely, in the proportions given by the tangency portfolio, in market equilibrium
    the risky assets’ prices, and therefore their expected returns, will adjust so
    that the ratios in the tangency portfolio are the same as the ratios in which
    the risky assets are supplied to the market. Thus, relative supplies will equal
    relative demands:


    > Modern Portfolio Theory derives the required expected return for a correctly
    priced asset in this context.


    # 3.2.1.9 Specific and Systematic Risks


    +   - Specific risks are the risks associated with individual assets. Within a
    portfolio, these risks may be reduced through diversification, namely, canceling
    out each other. Specific risk is also called diversifiable, unique, unsystematic,
    or idiosyncratic risk.

    +   - Systematic risks, namely, portfolio risks or market risks are risks common
    to all securities—except for selling short. Systematic risk cannot be diversified
    away within one market. Within the market portfolio, asset-specific risk may be
    diversified away to the extent possible. Systematic risks are, therefore, equated
    with the risks of the market portfolio.


    Since a security will be purchased only if it improves the risk-expected return
    characteristics of the market portfolio, the relevant measure of the risk of a
    security is the risk it adds to the market portfolio, and not its risk in isolation.
    In this context, the volatility of the asset and its correlation with the market
    portfolio are historically observed and are, therefore, available for consideration.


    Systematic risks within one market can be managed through a strategy of using
    both long and short positions within one portfolio, creating a "market-neutral"
    portfolio. Market-neutral portfolios will have a correlation of zero.


    # 3.2.2 Capital Asset Pricing Model (CAPM)


    For a given asset allocation, the return depends on the price and total amount
    paid for the asset. The goal of the investment is that the price paid should ensure
    that the market portfolio’s risk-return characteristics improve when the asset
    is added to it. The CAPM is an approach that derives the theoretical required'
