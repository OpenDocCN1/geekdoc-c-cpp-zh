    V([u]) = E([u][u]′) = [Φ 0]

    ([v]) ([v]′) [0 Ω]   (3.95)


    One can then apply the generalized least-squares procedure, which leads to the
    estimating of β̂ as


    β̂ = (x′p′)[Φ 0]⁻¹[x]⁻¹[x′p′][Φ 0]⁻¹[π]

    = ( [0 Ω][p] )   [0 Ω][q]   (3.96)


    This may be rewritten without the matrix notation as


    β̂ = [x′Φ⁻¹x + p′Ω⁻¹p]⁻¹[x′Φ⁻¹π + p′Ω⁻¹q]   (3.97)


    For the Black-Litterman model that is a single factor per asset, one may drop
    the variable x as it is the identity matrix. If one preferred using a multifactor
    model for the equilibrium, then x would be the equilibrium factor loading matrix.


    β̂ = [Φ⁻¹ + p′Ω⁻¹p][Φ⁻¹π + p′Ω⁻¹q]   (3.98)


    This new β̂ is the weighted average of the estimates, where the weighting factor
    is the precision of the estimates. The precision is the inverse of the variance.
    The posterior estimate β̂ is also the best linear unbiased estimate given the
    data, and has the property that it minimizes the variance of the residual.


    Given a new β̂, one should also have an updated expectation for the variance of
    the residual.


    If one were using a factor model for the prior, then one should keep x, the factor
    weightings, in the equation. This would result in a multifactor model, where all
    the factors will be priced into the equilibrium.


