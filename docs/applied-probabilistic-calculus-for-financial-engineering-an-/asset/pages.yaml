  md: "4) The crossover probability CR controls the fraction of the parameter values\
    \ that are copied from the mutant. CR approximates (but does not exactly represent)\
    \ the probability that a parameter value will be inherited from the mutant, since\
    \ at least one mutation always occurs. Mutation is applied in this way to each\
    \ member of the population.\n\n5) If an element v_j of the parameter vector is\
    \ found to exceed the bounds after mutation and crossover, it is reset, where\
    \ j is to index a parameter vector.\n\n6) When using `DEoptim`\n\nif v_j > upper_j,\
    \ it is reset as v_j = upper_j - rand * (upper_j - lower_j) and\nif v_j < lower_j,\
    \ it is reset as v_j = lower_j + rand * (upper_j - lower_j).\n\nThis guarantees\
    \ that candidate population members found to violate the bounds are set some random\
    \ amount away from them, in such a way that the bounds are guaranteed to be satisfied.\
    \ Then the objective function values associated with the children v are determined.\n\
    \n7) If a trial vector v_i,g has equal or lower objective function value than\
    \ the vector x_i,g then v_i,g replaces x_i,g in the population; otherwise x_i,g\
    \ remains.\n\n8) The algorithm automatically terminates after some set number\
    \ of generations, or after the objective function value associated with the best\
    \ member has been reduced below some preset threshold, or if it is unable to reduce\
    \ the best member by a certain value over a specified number of iterations.\n\n\
    9) Applying the R code DEoptim in portfolio optimisation\n\n# Remarks:\n\na) At\
    \ present, there are two versions of R codes for DE on the Comprehensive R Archive\
    \ Network (CRAN):\n\n+   1) **DEoptim**: Global Optimization by Differential Evolution\
    \ – By implementing the differential evolution algorithm for global optimization\
    \ of a real-valued function of a real-valued parameter vector: published on September\
    \ 7, 2015, by D. Ardia, K. Mullen, B. Peterson, J. Ulrich, and K. Boudt.\n+  \
    \ \n+   2) **DEoptimR**: Differential Evolution Optimization in Pure R – An implementation\
    \ n of a variant of the differential evolution stochastic algorithm for global\
    \ optimization of nonlinear programming problems: published on July 1, 2016, by\
    \ E. L. T. Conceicao and M. Maechler.\n\nb) For the DEoptim code\n\n|  |  |\n\
    |---|---|\n| Version: | 2.2-3 |\n| : | foreach, iterators |\n| Published: | 2015-01-09\
    \ |"
