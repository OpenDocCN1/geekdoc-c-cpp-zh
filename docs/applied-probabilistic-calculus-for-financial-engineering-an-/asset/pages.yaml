    the characteristics among the different types of portfolios should be considered,
    for example:


    +   A) The assets in financial portfolios are, for practical purposes, continuously
    divisible while portfolios of projects are “lumpy.” Thus, for example, while one
    may compute that the optimal portfolio position for four stocks is, say, 45, 26,
    20, and 9%, the optimal position for a project portfolio may not allow us to simply
    change the amount spent on a project. Projects may be all or nothing or, at least,
    have logical units that cannot be separated. Thus, a portfolio optimization method
    would have to take the discrete nature of projects into account.


    +   B) Assets of financial portfolios are liquid: They may be assessed or reassessed
    at any point in time. However, opportunities for starting new projects may be
    limited and may occur in limited time windows. Projects that have already been
    initiated may not be abandoned without the loss of the *sunk costs* (i.e., there
    may be little or no salvage value of a partly complete project).


    Neither of these factors necessarily eliminate the possibility of using MPT for
    such portfolios. However, they require the need to run the optimization with an
    additional set of mathematically expressed constraints that would not normally
    apply to financial portfolios. Furthermore, some of the simplest elements of MPT
    are applicable to virtually any kind of portfolio. The concept of ascertaining
    the risk tolerance of an investor by documenting the quantity of risk that is
    acceptable for a given return may be applied to a variety of decision analysis
    problems. MPT uses historical variance as a measure of risk, but portfolios of
    assets like major projects generally do not have a well-defined “historical variance.”
    In such cases, the MPT investment boundary may be expressed in more general terms
    like “the chance of an ROI (Return-On-Investment) less than cost of capital,”
    or “the chance of losing more than half of the investment.” Thus, when the risk
    is expressed in terms of uncertainty about forecasts, and possible losses, then
    the concept of MPT may be transferable to various types of investment.


