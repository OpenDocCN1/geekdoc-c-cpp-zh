  md: 'developing what has become known as the Black–Scholes model. In 1997, the importance
    of their model was recognized worldwide when Myron Scholes and Robert Merton received
    the Nobel Prize for Economic Sciences. (Fisher Black passed away in 1995, or he
    would have also received the award [Hull, 2000]). The Black–Scholes model displayed
    the importance that mathematics plays in the field of finance. It also led to
    the growth and success of the new field of mathematical finance or financial engineering.


    Here, the Black–Scholes partial differential equation will be derived, and then
    it will be used to solve the equation for a European call option. First, one will
    discuss basic financial terms, such as stock and option, and review the arbitrage
    pricing theory. One will then derive a model for the movement of a stock, which
    will include a random component: Brownian motion. Then, one will discuss some
    basic concepts of stochastic calculus that will be applied to a stock model. From
    this model, one will derive the Black–Scholes partial differential equation, and
    it will be used, with boundary conditions for a European call option to solve
    the equation.


    # Definitions


    Financial assets are claims on certain issuers, such as the federal government
    or a corporation, such as Apple, or Microsoft. Financial assets also include real
    assets such as real estate, but one will be primarily concerned with common stock.
    Common stock represents an ownership in a corporation. Anyone who buys a financial
    asset in hopes that it will increase in value has taken a long position. A person
    who sells a stock before he owns it hoping that it decreases in value is said
    to be short an asset. People who take short positions borrow the asset from large
    financial institutions, sell the asset, and buy the asset back at a later time.


    A derivative is a financial instrument whose value depends on the value of other
    basic assets, such as common stock. In recent years, derivatives have become increasingly
    complex and important in the world of finance. Many individuals and corporations
    use derivatives to hedge against risk. Here, the derivative asset that will be
    most interested in is a European call option. A call option gives the owner the
    right to buy the underlying asset on a certain date for a certain price. The specified
    price is known as the exercise or strike price and will be denoted by E. The specified
    date is known as the expiration date or day until maturity. European options can
    be exercised only on the expiration date itself. Another common option is a put
    option, which gives the owner the right to sell the underlying asset on a certain
    date for a certain price.


    For example, consider a November European call option contract on Microsoft with
    strike price $70. When the contract expires in November, if the price of Microsoft
    stock is $72 the owner will exercise the option and realize a profit of $2. He
    will buy the stock for $70 from the seller of the option and immediately'
