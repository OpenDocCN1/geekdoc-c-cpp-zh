    Otherwise, their Consistency Measure and its use is the same for both reference
    models.


    **He and Litterman Lambda**  He and Litterman (1999) used a measure, $\Lambda$,
    to measure the impact of each view on the posterior. They defined the Black–Litterman
    unconstrained posterior portfolio as a blend of the equilibrium portfolio (prior)
    and a contribution from each view; that contribution is measured by $\Lambda$.


    Deriving the formula for $\Lambda$, one will start with (3.86b) and substitute
    in the various values from the posterior distribution


    $$w=(\Sigma)^{-1}\Pi \tag{3.86b}$$


    and also substitute the return for $\Pi$:


    $$w=\frac{1}{\delta}\Sigma^{-1}M^{-1}\left[(\tau\Sigma)^{-1}\Pi+P^T\Omega^{-1}Q\right]
    \tag{3.159}$$


    The covariance term will first be simplified:


    $$\Sigma^{-1}M^{-1}=(\Sigma+M^{-1})^{-1}M^{-1} \tag{3.160a}$$


    $$\Sigma^{-1}M^{-1}=(\Sigma M+I)^{-1} \tag{3.160b}$$


    $$\Sigma^{-1}M^{-1}=\Sigma^{-1}(\Sigma^{-1}+M)^{-1} \tag{3.160c}$$


    $$\Sigma^{-1}M^{-1}=\Sigma^{-1}\left[\Sigma^{-1}+(\tau\Sigma)^{-1}+P^T\Omega^{-1}P\right]^{-1}
    \tag{3.160d}$$


    $$\Sigma^{-1}M^{-1}=\Sigma^{-1}\left[\left\{\frac{1+\tau}{\tau}\right\}\Sigma^{-1}+P\Omega^{-1}P^T\right]^{-1}
    \tag{3.160e}$$


    $$\Sigma^{-1}M^{-1}=(P^T\Sigma P)^{-1}\left[\left\{(1+\tau)(P^T\Sigma P)^{-1}+\tau\Omega^{-1}\right\}^{-1}\right]^{-1}
    \tag{3.160f}$$


    $$\Sigma^{-1}M^{-1}(P^T\Sigma P)^{-1}=\left[\left\{\frac{P^T\Sigma P}{1+\tau}\right\}-\left\{\frac{P^T\Sigma
    P}{1+\tau}\right\}\left\{\frac{\Omega}{\tau}+\frac{P^T\Sigma P}{1+\tau}\right\}\right]
    \tag{3.160g}$$


    $$\Sigma^{-1}M^{-1}=\left\{\frac{\tau}{1+\tau}\right\}\left[I-\left\{\frac{P^T\Sigma
    P}{1+\tau}\right\}\left\{\frac{\Omega}{\tau}+\frac{P^T\Sigma P}{1+\tau}\right\}^{-1}\right]
    \tag{3.160h}$$


    Then, one may define


    $$\Lambda=\left[\frac{\Omega}{\tau}+\left\{\frac{P^T\Sigma P}{1+\tau}\right\}\right]
    \tag{3.161}$$'
