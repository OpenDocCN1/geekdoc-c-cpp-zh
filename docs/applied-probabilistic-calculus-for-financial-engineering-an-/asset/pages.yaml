  md: "# Description\n\nEstimates the price of an American Put, using the binomial\
    \ approach.\n\n# Usage\n\n```\nAmericanPutPriceBinomial(stockPrice, strike, r,\
    \ sigma, maturity, numberSteps)\n```\n\n# Arguments\n\n+   - `stockPrice` Stock\
    \ price of underlying stock\n+   - `strike` Strike price of the option\n+   -\
    \ `r` Risk-free rate\n+   - `sigma` Volatility of the underlying stock and is\
    \ an annualized term\n+   - `maturity` The term to maturity of the option in days\n\
    +   - `numberSteps` The number of time steps in the binomial tree\n\n# Value\n\
    \nBinomial American put price\n\n# Author(s)\n\nDinesh Acharya\n\n# Examples\n\
    \n```\n# Estimates the price of an American Put\nAmericanPutPriceBinomial(27.2,\
    \ 25, .03, .2, 60, 30)\n```\n\nIn the R domain:\n\n```\n> \n> # Estimates the\
    \ price of an American Put\n> AmericanPutPriceBinomial(27.2, 25, .03, .2, 60,\
    \ 30)\n> # Outputting:\n[1] 0.1413597\n> # The ES (Expected Shortfall) of this\
    \ American Put Option\nis 0.1413597.\n> \n>\n```"
