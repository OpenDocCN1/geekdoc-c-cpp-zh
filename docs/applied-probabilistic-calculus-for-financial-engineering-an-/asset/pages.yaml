    # Example 3.10 Portfolios Consisting of Two Risky Assets


    If two risky assets, A and B, are included in a portfolio, one should take into
    account the expected returns, variances, and covariance (or correlation) between
    the returns of these two assets. Compared with the previous case, in which one
    of the two assets was risk-free, the differences occur in the formulation of the
    portfolio variance. The appropriate formulation of the variance, in terms of risks
    and correlations, takes the form:


    σ_AB² = var₁₋₂ = x_A² σ_A² + 2 x_A x_B σ_AB σ_A σ_B + x_B² σ_B² (3.54)


    for which σ_AB is the correlation coefficient between the returns of the two assets
    A and B.


    # To Combine Two Perfectly Positively Correlated Risky Assets


    If the two returns are perfectly positively correlated, then σ_AB = 1, and (3.54)
    becomes


    σ_AB² = x_A² σ_A² + 2 x_A x_B (1) σ_A σ_B + x_B² σ_B² = x_A² σ_A² + 2 x_A x_B
    σ_A σ_B + x_B² σ_B² … (which is a perfect square!) = (x_A σ_A + x_B σ_B)²


    so that s_p = σ_AB = |√(σ_AB²)| = |√(x_A σ_A + x_B σ_B)²| = |(x_A σ_A + x_B σ_B)|
    (3.55)


    # Remarks:


    +   1) The notation |f(x)| denotes the absolute value of the enclosed expression
    f(x).

    +   2) Since neither σ_A nor σ_B is negative, when both x_A and x_B are nonnegative,
    the expression (x_A σ_A + x_B σ_B) in (3.55) will be nonnegative, and the absolute
    value of s_p is understood implicitly. However, if one of the two x-values is
    sufficiently negative, then the absolute value of s_p should be used explicitly.'
