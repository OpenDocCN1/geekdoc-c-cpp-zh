- pgno: 377
  md: 'The subset argument can be used to specify a particular area of the series
    to view. The underlying series is left intact to allow for TA functions to use
    the full data set. Additionally, it is possible to use syntax borrowed from the
    first and last functions, for example, “last 4 months.”


    TA allows for the inclusion of a variety of chart overlays and technical indicators.
    A full list is available from `addTA`. The default TA argument is `addVo()` –
    which adds volume, if available, to the chart being drawn.


    `theme` requires an object of class `chart.theme`, created by a call to `chartTheme`.
    This function can be used to modify the look of the resulting chart. See `chart.theme`
    for details. `line.type` and `bar.type` allow further fine tuning of chart styles
    to user tastes. `multi.col` implements a color coding scheme used in some charting
    applications, and follows the following rules:


    +   - `grey` => Op[t] < Cl[t] and Op[t] < Cl[t-1]

    +   - `white` => Op[t] < Cl[t] and Op[t] > Cl[t-1]

    +   - `red` => Op[t] > Cl[t] and Op[t] < Cl[t-1]

    +   - `black` => Op[t] > Cl[t] and Op[t] > Cl[t-1]


    `reChart` takes any number of arguments from the original chart call and redraws
    the chart with the updated parameters. One item of note: if multiple color bars/candles
    are desired, it is necessary to respecify the theme argument. Additionally, it
    is not possible to change TA parameters at present. This must be done with `addTA`/`dropTA`/`swapTA`/`moveTA`
    commands.


    # Value


    Returns a standard chart plus volume, if available, suitably scaled.


    If `plot=FALSE` a `chob` object will be returned.


    # Note


    Most details can be fine-tuned within the function, though the code does a reasonable
    job of scaling and labeling axes for the user. The current implementation maintains
    a record of actions carried out for any particular chart. This is used to recreate
    the original when adding new indicator. A list of applied TA actions is available
    with a call to `listTA`. This list can be assigned to a variable and used in new
    chart calls to recreate a set of technical indicators. It is also possible to
    force all future charts to use the same indicators by calling `setTA`. Additional
    motivation to add outlined candles to allow for scaling and advanced color coding
    is owed to Josh Ulrich, as are the base functions (from TTR) for the yet to be
    released technical analysis charting code.'
