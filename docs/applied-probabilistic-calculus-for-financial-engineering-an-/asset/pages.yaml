  md: 'prior distribution variance. The impact of this equation was highlighted in
    the results shown in He and Litterman (1999), in which the investor''s weights
    sum to less than 1 if they have no views. Idzorek (2005) and most other authors
    do not compute a new posterior variance, but instead use the known input variance
    of the returns about the mean.


    If the investor has only partial views, that is, views on a subset of the assets,
    then by using a posterior estimate of the variance, one will tilt the posterior
    weights toward assets with lower variance (higher precision of the estimated mean)
    and away from assets with higher variance (lower precision of the estimated mean).
    Thus, the existence of the views and the updated covariance will tilt the optimizer
    toward using or not using those assets. This tilt will not be very large if one
    is working with a small value of τ, but it will be measurable.


    Since one often builds the known covariance matrix of returns, Σ, from historical
    data one may use methods from basic statistics to compute τ, as τ Σ is analogous
    to the standard error. One may also estimate τ based on one''s confidence in the
    prior distribution. Note that both of these techniques provide some intuition
    for selecting a value of τ that is closer to 0 than to 1. Black and Litterman
    (1992), He and Litterman (1999), and Idzorek (2005) all indicate that in their
    calculations, they used small values of τ on the order of 0.025–0.050.


    Satchell and Scowcroft (2000) state that many investors use a τ, around 1, which
    has no intuitive connection to the data, and in fact shows that their paper uses
    the Alternative Reference Model.


    One may check the results by testing if the results match one''s intuition at
    the boundary conditions.


    Given (3.105), let Ω → 0 and show that the return under 100% certainty of the
    views is


    Π̂ = Π + ΣPᵀ[PΣPᵀ]⁻¹[Q − PΠ]  (3.110)


    Hence, under 100% certainty of the views, the estimated return is insensitive
    to the value of τ used.


    Also, if P is invertible, which means that one has offered a view on every asset,
    then


    Π̂ = P⁻¹Q  (3.111)


    If the investor is not sure about the views, Ω → ∞, then (3.105) reduces to


    Π̂ = Π  (3.112)


    Thus, seeking an analytical path to calculate the posterior variance under 100%
    certainty of the views is still a challenge!


    (This is shown in Table 4 and mentioned on page 11 of He and Litterman (1999).)'
