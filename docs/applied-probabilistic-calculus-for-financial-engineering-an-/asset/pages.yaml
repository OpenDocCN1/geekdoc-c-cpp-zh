- pgno: 428
  md: 'The financial markets are ever-changing with new challenges constantly presenting
    themselves. The reactions to these challenges are not always rational, but they
    are often volatile. For years, the investment community has championed a "buy
    and hold" strategy, which suggests that over the long term volatility is just
    noise and returns will be positive. At Crystal Cove Advisors one could not disagree
    more! The buy and hold philosophy has serious flaws in practice. It fails to account
    for the behavioral nature of the financial markets and the emotional reactions
    that follow. The majority of investment mistakes are made when an investor sees
    significant loss of principal, this stress turns "buy and hold" into "buy high
    and sell low" – thus becoming victims of the BLASH (buy low and sell high) theory."
    Crystal Cove Advisors recognizes the difficulties that negative market cycles
    present; thus one should place the focus on risk and employ tactical strategies
    that place capital preservation as the top priority.


    At Crystal Cove Advisors, a three-step process is used, specific to each client:


    +   1. Portfolio Analysis to determine risk tolerance and current exposure

    +   2. Portfolio Construction to establish allocation parameters and stress testing

    +   3. Portfolio Management to implement and adjust risk exposure as market cycles
    change.


    The goal of Crystal Cove Advisors is a service that provides the following:


    +   i. An asset allocation and portfolio optimization wealth-advising platform

    +    ii. Financial confidence to all clients so they can be totally free to focus
    on life and family.


    # Disclosures to All Clients


    *No strategy assures success, or can guarantee protection against loss. Tactical
    allocation may involve more frequent buying and selling of assets that can lead
    to higher transaction costs. Investors are advised to consider the tax consequences
    of moving positions more frequently.*


