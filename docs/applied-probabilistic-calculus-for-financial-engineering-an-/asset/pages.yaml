  md: 'equilibrium their weights in the market portfolio will be determined by the
    market capitalization of the various assets. On the efficient frontier, the CAPM
    market portfolio has the maximum Sharpe Ratio of any portfolio. Here, the Sharpe
    Ratio is the excess return divided by the excess risk, (r − r_f)/σ.


    The investor may also invest in a risk-free asset. This risk-free asset has essentially
    a fixed positive return for the time period over which the investor is concerned.
    It is generally similar to the sovereign bond yield curve for the investors’ local
    currency—such as the U.S. Government Treasury Bills. Depending on how the asset
    allocation decision will be framed, this risk-free asset can range from a 4-week
    Treasury Bill (1-month horizon) to a 20-year inflation protected bond.


    The CAPM market portfolio contains all investable assets that makes it difficult
    to specify. Since the system is in equilibrium, all submarkets must also be in
    equilibrium and any submarket chosen is part of the global equilibrium. While
    this permits one to reverse optimize the excess returns from the market capitalization
    and the covariance matrix, forward optimization from this point to identify the
    investors optimal portfolio within CAPM is difficult since one does not have information
    for the entire market portfolio. In general, this is not actually the question
    investors are asking, usually most investors select an investable universe and
    search for the optimal asset allocation within the universe. Thus, the theoretical
    problem with the market portfolio may be initially ignored.


    # The Capital Market Line


    The Capital Market Line is a line through the risk-free rate and the CAPM market
    portfolio. The Two Fund Separation Theorem, closely related to the CAPM, states
    that all investors should hold portfolios on the Capital Market Line. Any portfolio
    on the Capital Market Line dominates all portfolios on the Efficient Frontier,
    the CAPM market portfolio being the only point on the Efficient Frontier and on
    the Capital Market Line. Depending on one’s risk aversion, an investor will hold
    arbitrary fractions of their investment in the risk-free asset and/or the CAPM
    market portfolio. Figure 3.20 shows the relationship between the Efficient Frontier
    and the Capital Market Line.


    To start the market portfolio, one may choose to start with a set of weights that
    are all greater than zero and naturally sum to 1. The market portfolio only includes
    risky assets, because by definition investors are rewarded only for taking on
    systematic risk. Thus, in the CAPM, the risk-free assets with β = 0 will not be
    in the market portfolio. At a later stage, one will see that the Bayesian investor
    may invest in the risk-free asset based on their confidence in their return estimates.
    The problem may be constrained by asserting that the covariance matrix of the
    returns, Σ, is known. In fact, this covariance matrix may be estimated from historical
    return data. It is often calculated from higher frequency data and then scaled
    up to the time frame required for the asset allocation problem.'
