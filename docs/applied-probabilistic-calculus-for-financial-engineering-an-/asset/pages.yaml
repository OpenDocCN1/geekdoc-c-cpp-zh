    +     i) local maximum and local minimum

    +     ii) global maximum and global minimum of the portfolio function.

    +   b How may each of these values be determined?


    # 2 Optimization methodologies in probabilistic calculus for financial engineering


    This subject encompasses a very wide field of applied mathematics – as different
    approaches may measure risks that may not be robust, other measures include the
    CVAR (conditional value at risk). Other approaches often consider portfolio optimization
    in two stages: optimizing weights of asset classes to hold and optimizing weights
    of assets within the same asset class. An example of the former would be selecting
    the proportions in bonds versus stocks, while an example of the latter would be
    choosing the proportions of the stock subportfolio placed in stocks A, B, C, .
    . . , Z. Bonds and shares have different financial characteristics. These important
    differences call for diversification of optimization approaches for different
    classes of investments. With this introduction in mind, write an outline to form
    a practical optimization methodology for a portfolio which is invested in the
    following portfolio that consists of each of the following assets:


    +   1 Cash (including cash loans from financial institutions)

    +   2 Termed fixed interest deposits

    +   3 Portfolio of mixed equities of stocks and high-yield corporate bonds in
    the United States

    +   4 Same as (3), but with extensions to overseas financial products

    +   5 Private companies in the construction of retirement homes for special markets,
    such as the retiring "Baby Boomers"

    +   6 Cash income producing real estates: private and commercial

    +   7 Noncash income producing real estates: private and commercial

    +   8 Commodities and precious metals

    +   9 Collectibles

    +   10 American, European, and Asian options


    # 3 The following paper, available on the Internet, provides a number of models
    for global optimization:


    +   1 The standard Markowitz model

    +   2 A model with risk-free asset (Tobin model)

    +   3 A multiobjective model for portfolio optimization

    +   4 A model based on Minkowski absolute metric of risk estimation

    +   5 A model based on Minkowski semia bsolute metric of risk estimation

    +   6 A model based on Chebyshev metric of risk estimation (maxmin and minimax
    models)

    +   7 The Sharpe model with fractional criteria'
