    # ### 4.1  Data and Data Processing


    *Data* are facts or figures from which conclusions can be drawn. When the data
    have been recorded, classified, organized, related, or interpreted within a framework
    so that meaning emerges, they become *information*. There are several steps involved
    in turning data into information, and these steps are known as *data processing*.
    This section describes data processing and how computers perform these steps efficiently
    and effectively.


    It will be indicated that many of these processing activities may be undertaken
    using `R` programming, or performed in an `R` environment with the aid of available
    `R` packages – where `R` functions and data sets are stored.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 4.1.1 Introduction


    # 4.1.1.1 Coding


    # 4.1.1.1.1 Automated coding systems


    The simplified flowchart shows how raw data are transformed into information:


    Data → Collection → Processing → Information


    Data processing takes place once all of the relevant data have been collected.
    They are gathered from various sources and entered into a computer where they
    can be processed to produce information – the output.


    Data processing includes the following steps:


    +   - Data coding

    +   - Data capture

    +   - Editing

    +   - Imputation

    +   - Quality control

    +   - Producing results


    Data Coding First, before raw data can be entered into a computer, they must be
    coded. To do this, survey responses must be labeled, usually with simple, numerical
    codes. This may be done by the interviewer in the field or by an office employee.
    The data coding step is important because it makes data entry and data processing
    easier.


    Surveys have two types of questions – closed questions and open questions. The
    responses to these questions affect the type of coding performed.


    A closed question means that only a fixed number of predetermined survey responses
    are permitted. These responses will have already been coded.


    The following question, in a survey on sporting activities, is an example of a
    closed question:


    To what degree is sport important in providing you with the following benefits?


    +   1) Very important

    +   2) Somewhat important

    +   3) Not important


    An open question implies that any response is allowed, making subsequent coding
    more difficult. In order to code an open question, the processor must sample a
    number of responses, and then design a code structure that includes all possible
    answers.


    The following code structure is an example of an open question:


    What sports do you participate in?

    Specify (28 characters)________________________'
  merge: -1
  img_proc: true
