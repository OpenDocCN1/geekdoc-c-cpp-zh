  md: 'represented as


    $$Y(t) = Y(0) + \int_{0}^{t} \mu(s) ds + \int_{0}^{t} \sigma(s) dB(s) \tag{3.236}$$


    More generally, if $Y$ is an Ito process represented above, then it has a stochastic
    differential on $[0, T]$ given by


    $$dY(t) = \mu(t) dt + \sigma(t) dB(t) \tag{3.237}$$


    for $0 \le t \le T$. The function $\mu$ is often called the drift coefficient
    and the function $\sigma$ is called the diffusion coefficient—terms inherited
    from studies in mass and energy transfers in areas within classical physics and
    engineering.


    One last important case to consider is for functions of the form $f(X(t), t)$.
    If $f(x, t)$ is a twice continuously differentiable function in $x$, as well as
    continuously differentiable in $t$, and $X(t)$ represents an Ito process, then


    $$df[x(t), t] = (\partial f / \partial x)(X(t), t) dX(t) + (\partial f / \partial
    t)(X(t), t) dt + (1/2) \sigma^2 (X(t), t) (\partial^2 f / \partial x^2)(X(t),
    t) dt \tag{3.238}$$


    This case of Ito''s formula may be used to compute the Black–Scholes partial differential
    equation in the next section.


    # Derivation of the Black–Scholes Equation


    Here, the price of a derivative security, $V(S, t)$, will be derived. The model
    for a stock derived previously satisfies an Ito process defined in (3.237).


    $$dY(t) = \mu(t) dt + \sigma(t) dB(t) \tag{3.237}$$


    Therefore, one may let the function $V(S, t)$ be twice differentiable in $S$ and
    differentiable in $t$. Applying (3.238) one has


    $$dV(S, t) = (\partial V / \partial S) dS + (\partial V / \partial t) dt + (1/2)
    \sigma^2 S^2 (\partial^2 V / \partial S^2) dt \tag{3.239}$$


    Substituting into (3.239) for $dS$ with (3.210), one has


    $$dS/S = \mu dt + \sigma dB \tag{3.210}$$


    $$dV(S, t) = (\partial V / \partial S)(\mu S dt + \sigma S dB) + (\partial V /
    \partial t) dt + (1/2) \sigma^2 S^2 (\partial^2 V / \partial S^2) dt \tag{3.240}$$


    This simplifies to


    $$dV(S, t) = \sigma S dB (\partial V / \partial S) + \{\mu S (\partial V / \partial
    S) + (\partial V / \partial t) + (1/2) \sigma^2 S^2 (\partial^2 V / \partial S^2)\}
    dt \tag{3.241}$$'
