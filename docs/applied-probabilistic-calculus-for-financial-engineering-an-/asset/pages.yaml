  md: '# Examples from CRAN:


    Use the following two examples, in R, to illustrate the use of the aforementioned
    approach in portfolio optimization:


    # DEoptim Differential Evolution Optimization


    # Description


    Performs evolutionary global optimization via the differential evolution algorithm.


    # Usage


    ```

    DEoptim(fn, lower, upper, control = DEoptim.control(), ..., fnMap=NULL)

    ```


    # Arguments


    fn the function to be optimized (minimized). The function should have as its first
    argument the vector of real-valued parameters to optimize, and return a scalar
    real result. NA and NaN values are not allowed.


    lower, upper two vectors specifying scalar real lower and upper bounds on each
    parameter to be optimized, so that the i-th element of lower and upper applies
    to the ith parameter. The implementation searches between lower and upper for
    the global optimum (minimum) of fn.


    control a list of control parameters; see DEoptim.control. fnMap an optional function
    that will be run after each population is created, but before the population is
    passed to the objective function. This allows the user to impose integer/cardinality
    constraints. ... further arguments to be passed to fn.


    # Details


    DEoptim performs optimization (minimization) of fn. The control argument is a
    list; see the help file for DEoptim.control for details.


    The R implementation of DE, DEoptim, was first published on the Comprehensive
    R Archive Network (CRAN) in 2005 by David Ardia. Early versions were written in
    pure R. Since version 2.0-0 (published on CRAN in 2009), the package has relied
    on an interface to a C implementation of DE, which is significantly faster on
    most problems as compared to the implementation in'
