    \ MyNewEventType(hello);\n\nYou can also use anonymous methods and lambda expressions\
    \ to add delegates to an event:\nMyNewEvent += (string param) =>\n\n```\n{\n \
    \ MessageBox.Show(\"Goodbye \" + param);\n  return 2;\n}\n```\n\nTo raise the\
    \ event, we simply call it as if it was a delegate:\nMyNewEvent(\"New Event\"\
    );\n\n# Invoking Events\n\nThis is slightly subtle than it looks because, for\
    \ a default event with no custom accessor functions, the compiler changes the\
    \ reference to the event to a reference to the private instance of the delegate.\
    \ This allows you to call the delegate using the name of the event, but if you\
    \ have defined custom accessor functions they no longer work.\n\nYou can use Invoke\
    \ if you want to, but notice that an event restricts the invocation of its delegate\
    \ to the object in which it is declared. In other words, an object cannot raise\
    \ another object's event.\n\nThe new event object has all the methods of a delegate\
    \ and can more or less as if it was a delegate. In particular, you can use BeginInvoke\
    \ to fire an event asynchronously on a threadpool. If you are concerned about\
    \ using threadpool threads, you could create a thread manually and run the delegate\
    \ using it. By default an event delegate is called synchronously and this means\
    \ that the code that raises the event is stalled until the event processing is\
    \ complete.\n\nAre asynchronous events a good idea? If you want to write a responsive\
    \ program, then yes they are, but you need to understand the problems that can\
    \ arise in a multithreaded approach. Even if you don't explicitly use of a multithreaded\
    \ approach, you have to allow for the possibility that your code will be used\
    \ in this way. Objects running on different threads can, and do, add event handlers\
    \ to the event - events are multithreaded."
