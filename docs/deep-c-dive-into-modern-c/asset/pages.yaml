  pgno: 303
- img_proc: true
  md: "save its state to disk. Not all COM objects implement IPersistFile, or any\
    \ other standard interface, but when they do it's worth making use of them. In\
    \ this case the TaskScheduler object implements both IUnknown and IPersistFile\
    \ and we can use this to save the new task that we have just created.\n\nMost\
    \ of the standard COM Interfaces are defined in: System.Runtime.InteropServices.ComTypes;\n\
    \nYou can find older definitions in the UCOM namespace.\n\nAdding a:\n\nusing\
    \ System.Runtime.InteropServices.ComTypes;\nallows us to write:\n\nIPersistFile\
    \ PFile = itask as IPersistFile;\nPFile.Save(null, true);\n\nThat is, we to the\
    \ predefined interface type IPersistFile and then use its Save method to create\
    \ an unscheduled task in the default machine's scheduler.\n\n# Inheritance and\
    \ Interfaces\n\nYou can continue with this approach to expanding the facilities\
    \ that you have access to in .NET. Mostly it's a matter of pasting and editing\
    \ the IDL definitions. However, you have to be sure to take account of interface\
    \ inheritance. For example, if you plan to implement the ITask interface, its\
    \ IDL starts:\n\n```\ninterface ITask;\n    local,\n    object,\n    uuid(148BD524-A2AB-11CE-B11F-00AA00530503),\n\
    \    pointer_default(unique)\n```\n\n```\ninterface ITask : ScheduledWorkItem{\n\
    \    // Properties that correspond to parameters of CreateProcess:\n    HRESULT\
    \ SetApplicationName([in] LPCWSTR pwszApplicationName);\n```\n\nThe inclusion\
    \ of interface ITask : ScheduledWorkItem means that ITask inherits from ScheduledWorkItem.\
    \ For interfaces, inheritance is particularly simple. All that happens is that\
    \ the vtable starts off with all of the items in ScheduledWorkItem and then the\
    \ new functions in ITask."
  merge: -1
  pgno: 304
- img_proc: true
  md: "Thus the first function in our .NET Interface definition isn't SetApplicationName,\
    \ but CreateTrigger, the first function in IScheduledWorkItem:\n\n```\ninterface\
    \ IScheduledWorkItem;\n[\n  local,\n  object,\n  uuid(a6b952f0-a4b1-11d0-997d-00aa006887ec),\n\
    \  pointer_default(unique)\n]\\interface IScheduledWorkItem : IUnknown\n{\n  //\
    \ Methods concerning scheduling:\n  HRESULT CreateTrigger(\n    [out] WORD * piNewTrigger,\n\
    \    [out] ITaskTrigger ** ppTrigger);\n```\n\nThat is, COM interfaces really\
    \ do implement inheritance as concatenations of vtables. For some reason the fact\
    \ that one inherits from another is often overlooked in the documentation and\
    \ a careful look at the IDL file is usually a good idea.\n\n# Signature Problems\n\
    \nThe fact that COM Interop is clever enough to intercept the HRESULT return value,\
    \ decode it and trigger an exception if it is an error code is usually a good\
    \ thing. However, sometimes methods return status information in HRESULT, even\
    \ though they shouldn't. For example, in the old Outlook Express COM API defined\
    \ in msoeapi.idl and msoeapi.h which are both in the Platform SDK includes - the\
    \ GetFirstFolder and GetNextFolder functions in the IStore namespace return an\
    \ HRESULT of 0 if they have retrieved a sub-folder and 1 if there are no more\
    \ sub-folders. To process this we have to add the [PreserveSig] attribute, which\
    \ forces the COM Interop mechanism to interfere with HRESULT:\n\n```\n[PreserveSig]\n\
    Int32 GetFirstSubFolder(\n[In, MarshalAs(UnmanagedType.4)] Int32 dwFolderId,\n\
    [Out, MarshalAs(UnmanagedType.Struct)] out FOLDERPROPS pProps,\n[Out, MarshalAs(UnmanagedType.4)]\
    \ out Int32 phEnum;\n```\n\n```\n[PreserveSig]\nInt32 GetNextSubFolder(\n[In,\
    \ MarshalAs(UnmanagedType.4)] Int32 hEnum,\n[Out, MarshalAs(UnmanagedType.Struct)]\
    \ out _FOLDERPROPS pProps;\n```"
  merge: -1
  pgno: 305
- img_proc: true
  md: 'Now you can test the HRESULT return value to see if there is a folder to process,
    but notice that you now also need to test it for more general error conditions
    and throw your own exceptions to signal the problem. An interesting trap waiting
    for the innocent programmer is that if you leave off the [PreserveSig] then everything
    works, but the return value is always set to zero by COM Interop.


    # Postlude


    Using COM from C# is easy as long as it just works. Troubleshooting requires a
    lot of deep knowledge about COM and about the way it is actually implemented and
    used. In most cases you can make it work as long as the implementation doesn''t
    deviate too far from the basics.'
