  md: 'Once again you can test this assertion using a MessageBox:

    ASCII[] attrs=(ASCII[]) typeof(MyClass).GetCustomAttributes(

    type(ASCII), false);

    MessageBox.Show(attrs[0].MoreData);


    where you will discover that the public string MoreData has indeed been set

    to "SomeData" by the attribute.


    You should now be able to see the general principle:


    +   - Any unnamed parameters used in the attribute are passed to the

    constructor in the order in which they are given.


    +   - Any named parameters are used as initialization statements after the

    instance has been constructed.


    Notice that all of the unnamed parameters have to come before the

    parameters. For example, an attribute passed as:

    [Attribute(a,b,c,...,name1=A,name2=B...)]


    results in:

    MyAttribute MyInstance= new MyAttribute(a,b,c,...);

    MyInstance.name1=

    MyInstance.name2=B;


    when the GetCustomAttributes method is used.

    Notice also that named parameters are optional, if they are not supplied then

    the corresponding variable is left uninitialized.


    It is also important to know that the type of parameter you can use is limited

    to the majority of the simple types, i.e. int, long, float, string. System.Type.

    object, a publicly accessible enum and a one-dimensional array of any

    allowable type.


    You might think that you can pass any object you can pass anything, but

    this isn''t the case. There is an additional condition that restricts parameters
    to

    constants of the appropriate type. So, while you can have:


    ```

    [ASCII("Hello Method",MyObject=1)]

    ```


    and even:


    ```

    [ASCII("Hello Method",MyObject="Hello")]

    ```


    you can''t have:


    ```

    [ASCII("Hello Method", MyObject=new object())]]

    ```


    or anything like it.'
