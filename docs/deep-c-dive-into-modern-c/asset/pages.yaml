  md: '# Chapter 3


    # Value & Reference


    Value and reference are a fundamental division in the way C# treats data. It is
    important that you understand the differences and most importantly when to use
    a struct and when to use a class. These aren''t just differences in efficiency,
    they affect the semantics too.


    # Value and Reference


    As already discussed, see Chapter 2, C# is an object-oriented, strongly typed
    language. The "object-oriented" part of the definition simply means that, in principle
    at least, everything is derived from the object class. However, all object-oriented
    languages suffer from the need to treat some types of very simple values as something
    other objects. The reason for this is most efficiency – do you really want to
    wrap a simple integer value in all the machinery needed to implement a full class?
    But there is also a fundamental difference in the way programmers think about
    simple data types and class types. C# tackles this distinction in a very reasonable
    way that combines efficiency, a natural approach and an object-oriented outlook.


    # Pointers Become References


    C# defines two different types of variable, value and reference.


    (There is also a pointer type which acts much like an untyped reference, but this
    needs special treatment - see Chapter 28)


    A value usually corresponds to the simplest of data types, it is an int or a float,
    and the data is stored on the stack or within the code itself. The amount of storage
    is used by a value type depends on its exact type.


    On the other hand reference type is essentially a sophisticated pointer to the
    actual data and always takes the same amount, usually eight bytes, of storage.
    A reference type is also stored on the stack but the object that it "points" at
    is allocated on the heap. You will notice the use of the terms "point" and "pointer"
    in connection with reference types and this isn''t strictly correct if it is easier
    to say reference and references.'
