  md: 'You can also chain axis methods, just as you can chain standard LINQ

    methods. For example:


    ```

    var q=root.Element("Name").Attributes();

    ```


    finds the first element that matches “Name” and then returns a sequence of its

    attributes, if any.


    Some things are much easier to do with axis methods, which are designed to

    work with a tree structure, and some are easier using standard LINQ queries,

    which are designed to work with flat collections. Sometimes a combination of

    two works even better. For example:


    ```

    var q = from E in root.Elements()

    where (E.Element("First")!=null

    select E;

    ```


    selects all the elements that have at least one “First” child element. Again,

    as deep value is returned, you get the subtree below any node that

    as a “First” child node.


    Once start to follow the relentless logic of IEnumerable and its LINQ

    methods becomes also fun to try and work out the most “interesting” way

    of obtaining a result. Not necessarily good programming practice, but a good

    way to master the techniques.


    # Select and The Projection


    The select part of a LINQ expression normally works as a projection operator

    that “reduces” the size of the data structure returned by a query. For example,

    it can be used to select which “columns” are returned from a SQL query

    which otherwise would return a complete record. So, the query:


    ```

    var q = from E in root.Elements()

    where E.Name == "Name"

    select E;

    ```


    returns a deep copy in the sense that the XElement corresponding to Name

    brings with it an entire subtree.


    Suppose you want a “shallow” copy, i.e. just the node and its value. In

    this case we can project the XElement to a string that contains all of the XText

    in the subtree:


    ```

    var q = from E in root.Elements()

    where E.Name == "Name"

    select E.Value;

    ```


    However, projection can also be used to create a larger or completely different

    type using the data returned by the query. For example, you could perform a

    LINQ to SQL query to return some values and package them up into an

    XML tree.'
