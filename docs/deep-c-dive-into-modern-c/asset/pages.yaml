  md: 'Notice while this is rather more foolproof than using the basic Monitor methods,
    a thread that doesn''t play the rules and simply accesses the resource will spoil
    everything. The point is that you cant enforce locking, just hope that everyone
    remembers to use it.


    There are other methods that are sometimes useful. For example, the TryEnter method
    will attempt to acquire a lock, after waiting for a specified time, but will allow
    the thread to continue if the lock cannot be acquired. Clearly in this case you
    need to test the return value, a Boolean, to see if the lock has been acquired
    and do something different if it hasn''t.


    The wait method will allow the thread that currently has the lock to free it and
    allow other threads to acquire it while it waits for a signal from another thread
    before attempting to acquire the lock again. Another thread, one that currently
    has the lock, can signal the next waiting thread, (or to all waiting threads)
    to try to acquire the lock by using the pulse or pulseall method. To understand
    how this might be used, consider a thread that processes a buffer that is filled
    by another thread. The processing thread can call wait it has finished processing
    the buffer and allow the filling thread to access it. As soon as the filling thread
    has finished its work, it can use pulse to tell the processing thread to acquire
    the lock and start work again. The clever part is that this mechanism generalizes
    to multiple work-creating and work-consuming threads and they can all queue in
    an orderly fashion to access the resource wait and pulse.


    # Deadlock


    There are other problems with locking and the most celebrated is perhaps the deadlock
    condition. Simply put, if thread A locks one resource and thread B locks two everything
    is fine unless thread A wants a lock on resource before it can complete and if
    thread B needs a lock on resource before it can complete. The result is that both
    threads spend forever waiting for the other to finish and release the resource.
    This is deadlock and it can occur in more complicated ways than this simple "A
    waits for B waits for A" situation. It is possible to create a deadlock ring of
    dependency by having A wait for B, which waits for C, which waits for D which
    is waiting for A.


    There isn''t much you can do about deadlock except to be aware of it and design
    your access strategies with more than one lock at a time but this can try to avoid
    locking on more than one lock at a time can slow things down to unacceptable levels
    as threads have to wait while another thread acquires an oversized lock on resources,
    some of which it isn''t actually using. A better strategy is to attempt to acquire
    all of the locks that a thread needs to'
