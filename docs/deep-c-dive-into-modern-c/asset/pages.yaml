    ```\n\nor equivalently:\n\n```\nMyHelloDelegateType MyHelloDelegate1 = Hello;\n\
    ```\n\nCalling the function via the delegate is just a matter of using its name:\n\
    MyHelloDelegate1();\n\nYou can see that we have invented three names:\n\n+   -\
    \ MyHelloDelegateType - the delegate type\n- Hello - the method name\n- MyHelloDelegate1\
    \ - the wrapper instance\n\nThis is fine if you are going to create multiple instances\
    \ of the type and wrap\nmultiple functions, but in most cases the type, the delegate\
    \ and the method\nare more or less a single entity. That is, you create a delegate\
    \ because\nwant to use a method as if it was an object and often this is a one-off\n\
    requirement.\n\n# Anonymous methods\n\nThe idea of an anonymous method allows\
    \ you to fuse the identity of the\ndelegate with the function it wraps. The syntax\
    \ is easy, you simply use the\ndelegate keyword to stand in for the name of the\
