  md: "Positional patterns are very similar to property patterns, but they allow you\
    \ to test on fields in tuples (see Chapter 4) or anything that has a Deconstruct\
    \ method that will return a tuple, for example:\n\n```\nint A = 1;\nint B = 2;\n\
    int C = 3;\nint myResult = (A,B,C) switch\n{\n  (1,2,3) => expression,\n  (>1,_,_)\
    \ => expression,\n};\n```\n\nThe first pattern matches A==1, B==2 and C==3. The\
    \ second pattern matches A>1, B is any value and C==0. The underscore is used\
    \ as a discarded pattern which matches anything. Also notice that, (A,B,C) is\
    \ a tuple and can be replaced by any object that has a Deconstruct method that\
    \ will give you a tuple.\n\nThe var pattern has nothing to do with type apart\
    \ from allowing you to declare a variable of the same type as the run type of\
    \ the expression. In most cases this means matching on the case guard. For example\n\
    \n```\nint A = 1;\nint B = 2;\nint C = 3;\nint myResult = (A, B, C) switch\n{\n\
    \  var myVar when A > B => myVar.A,\n  var myVar when A < B => myVar.A\n};\n```\n\
    \nIn this case myVar is the same type as the expression that being tested, i.e.\
    \ a tuple, and the case guard picks out what to do with it.\n\nFinally, you can\
    \ combine patterns using and, and not to combine patterns in obvious ways.\n\n\
    Pattern matching is a new and powerful way to use of type in its widest sense\
    \ to determine the flow of control. It is type safe in that type declarations\
    \ are used to detect when a pattern is unworkable or when you are trying to use\
    \ a type as if it was another type. Pattern matching doesn't give you much in\
    \ the way of new abilities, but it gives you the opportunity to write very dense\
    \ and incomprehensible code. What seems neat and compact when you write it can\
    \ feel cryptic when you reread it."
