  md: "When the loop ends the local version of the variable goes out of scope, but\
    \ the captured copy of i lives on the delegates and it has the value 10. That\
    \ is we capture the very last value of i and all of the delegates share it.\n\n\
    Examples of closure can become more complicated than this for simple loop and\
    \ you find yourself using such constructions you probably should reconsider and\
    \ find a clearer expression of what you are trying to do. However, the principle\
    \ is simple enough; the compiler creates a hidden class wrapper for all of the\
    \ variables in scope when the delegates are created. If a variable is recreated\
    \ each time the delegate is created, then each delegate will capture a new copy.\
    \ For example:\n\n```\nMyHelloDelegateType[1] Count = new MyHelloDelegateType[10];\n\
    for(int i = 0;i<10;i++) {\n    int j = i;\n    Count[i] = delegate() {\n     \
    \   MessageBox.Show(j.ToString());\n    };\n}\n```\n\nIn this case the variable\
    \ j is recreated each time through the loop and each delegate captures its own\
    \ copy. If you now calling each delegate in turn you will find that it now displays\
