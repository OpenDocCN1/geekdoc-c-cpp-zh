- img_proc: true
  md: 'In this way each method gets access to its local variables while it is running,
    without any need to keep track of where they are. The stack is also used to store
    parameters and return values passed between methods in a fairly obvious way.


    | Free space | | Method 2 finishes and resets the top of stack |

    |---|---|---|n| Top of Stack | Active | |

    | Method 2 stack frame | Method 1 calls Method 2 which results in a new stack
    frame | Top of Stack | |

    | Method 1 stack frame | | Method 1 stack frame | Active |


    The stack in action


    The stack works well for storing all manner of data that is created and destroyed
    following the pattern of method calls, but for global data and for large or complex
    data we need something else.

    The alternative is the "heap": This is a very descriptive name for an area of
    memory that is set aside for the purpose of storing global data. When a global
    object is created, by the use of new in C#, an area of the heap is allocated enough
    to store it at its initial size and a reference to its location is returned -
    often to be stored in a local variable on the stack. However, unlike variables
    which are created and destroyed with the method they belong to, there is no clear
    signal that a global object is finished with. It doesn''t necessarily become redundant
    when the local variable that it initially went out of scope there could be many
    variables referencing it. To deal with this problem a system-wide garbage collector
    is provided, which keeps track of what is stored on the heap and how many references
    there to each item. When an object on the heap has no references to it then it
    is deallocated and the memory is recovered.

    This general of heap management, but in practice there are many subtle problems.
    For example, as the heap is used and released, it slowly becomes fragmented into
    small blocks of heap in using separating blocks of free space. The solution is
    to make the garbage collector consolidate memory every now and again.'
