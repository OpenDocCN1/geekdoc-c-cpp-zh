    to control the format of the conversion and this makes it more flexible than the
    cast syntax.


    # Convert


    So the next question is – are there conversion methods? The answer is yes, but
    you have to use the Convert class. So while you can''t write:

    MyInt = MyLong.ToInt32();


    you can write:

    MyInt = Convert.ToInt32(MyLong);


    Unlike the simple cast, the method throws an exception if the long is too big
    to fit into the int.


    If you want to convert a single or a double to an int then things are even more
    confusing as there are two ways which give different answers:

    double MyDouble = 2.6;

    MyInt = (int)MyDouble;

    MyInt = Convert.ToInt32(MyDouble);


    The cast truncates to 2 but if you want to control of the ToInt32 ranges to give
    3.

    Of course, if you want to control of type conversion you can always use the Math
    class as in:

    Math.Round(MyDouble);

    Math.Truncate(MyDouble);


    and there are overloaded methods that will give you control of how the rounding
    is to be performed. Notice, however, that neither method actually performs a type
    conversion so you will still need a cast as:


    MyInt = (int) Math.Round(MyDouble);

    MyInt = (int) Math.Truncate(MyDouble);


    Of course you could also use Convert.'
