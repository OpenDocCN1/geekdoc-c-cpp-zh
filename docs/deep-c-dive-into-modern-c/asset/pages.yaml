  md: '# IDispatch


    An IDispatch interface is a special type of IUnknown interface that includes methods
    that allow other methods to be called by name at runtime. To call a vtable in
    a simple IUnknown interface all you need to know is where in the vtable the function
    pointer is. So, for example, to call Method you would need to know that is the
    sixth method defined in MyInterface and so its pointer is in vtable[5], given
    that the first function pointer is in vtable[0] and points at QueryInterface.


    Using IDispatch you can call the function by name. You simply use the GetIDOfNames
    method and then the Invoke method of the IDispatch interface. You can think of
    this as equivalent to the .NET reflection mechanism that allows late binding.
    In the case of COM, the IDispatch interface was mostly used by other software
    tools to allow the programmer to access interfaces without the bother of learning
    COM. IDispatch allows you to use an ActiveX object or automation facility from
    a script without worrying about COM. The important point here is that this is
    still what .NET uses when it constructs a wrapper for a COM object. Indeed most
    of the COM Interop IJW facilities only “Just Work” when the COM object has an
    IDispatch interface and there are great many that only support the pure IUnknown
    interface.


    # IDL


    We also need to know a little about IDL, Interface Definition Language, which
    is used to describe the type of an Interface. It allows the COM designer to specify
    GUIDS for classes and interfaces, interface names, method names, method signatures,
    how parameters are passed and even general data types to be used in conjunction
    with the COM object. You can think of IDL as a general purpose type description
    language.


    Most COM objects have an IDL file associated with them, but they don''t have to.
    You can find the IDL files corresponding to the COM objects that implement parts
    of the Windows API in the Platform SDK which you can download from the Microsoft
    website. IDL files aren''t actually used by a programming language but are converted
    into either C/C++ header files or into “type libraries” by the IDL compiler, MIDL.


    A type library is what you need if you are going to try to use a COM object in
    IJW mode. This is what the .NET system uses to create class wrappers for the COM
    object, but as already explained, it only works if the object supports IDispatch.
    In practice, even an IDispatch interface isn''t a guarantee automatic wrapping
    will be possible – it has to be OLE Automation compatible and use nothing out
    of the ordinary for it to be 100% successful.'
