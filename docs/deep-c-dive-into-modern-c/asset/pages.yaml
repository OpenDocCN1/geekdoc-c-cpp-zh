  md: '# The Cast System


    Now that we have looked in detail at casting, you can begin to see what it is
    really all about. Casting is really to do with introducing a little organized
    freedom into the type system so object-oriented programming is more flexible.
    That is, the primary purpose of a cast is to change the type of an object, not
    to change its representation. Without this facility there are a lot of things
    that would be much more difficult to do.


    It is argue that casting really shouldn''t be involved in an active type conversion
    because it confuses the issue. If you want to be "pure" it might be better to
    implement all active type conversion as methods. To demonstrate how confusing
    this can be, consider the following example where an object downcast to an int
    (this is also an example of explicit boxing):


    ```

    object MyAnything;

    int MyIntA = 3;

    MyAnything = MyIntA;

    ```


    To convert back an int (to undo the int) all you have to use is a simple cast:


    ```

    int MyIntB = (int) MyAnything;

    ```


    This works, but what about:

    MyLong = (long) MyAnything;


    This looks as if it is the same sort of cast, but it doesn''t work because it
    is attempting two sorts of type conversion in one go. You can''t downcast Anything
    to an int and perform the active widening conversion needed to go from an int
    to a long in one. The reason is that the boxed int can only be unboxed to an int
    and not to another type. The correct way to do it is the rather ugly:


    ```

    MyLong = (long) (int) MyAnything;

    ```


    The first downcast/unboxing and then the explicit widening cast are needed to
    make it work.


    # Variance and Casting


    You may not have noticed, but the role of input and output parameters forces on
    a particular type of behavior when it comes to casting. This is usually called
    "variance" and is something that is generally introduced as part of generics.
    However variance is also part of casting.


    To see the difference between input and output three classes, MyClassA, MyClassB
    and MyClassC, where MyClassC inherits from MyClassB which inherits from MyClassA.


    Now consider a function that has MyClassB as its input parameter:

    myFunction(MyClassB parameter)'
