  md: '# Postlude


    Inheritance for code reuse really does need to be multiple inheritance, but it
    is a difficult tool to work with due to the diamond problem among others. C#''s
    single single inheritance is tempered by the use of interfaces which, despite
    having default methods, don''t help much with code reuse. What they do is is to
    allow type safety with multiple inheritance but without the need to worry about
    selecting between multiple inherited implementations. The use of interfaces as
    types makes the type hierarchy less of a strict hierarchy.'
