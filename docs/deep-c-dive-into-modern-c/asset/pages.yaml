  md: '# Chapter 18


    # The Parallel For


    So far in our exploration of asynchronous code we have considered parallel execution
    without necessarily executing anything at the same time. Today’s processors, however,
    have multiple cores and this means that it is possible to actually run threads
    in parallel and hopefully speed things up. Asynchronous code is mostly about keeping
    the UI responsive by dividing the processor''s attention between servicing the
    UI and doing useful work. True parallelism has the attraction of speeding up the
    useful work and is attractive even without considering the responsiveness of the
    UI.


    .NET parallel extensions are great. They are easy to use and provide a huge package
    – but, and this is a big but, parallel programming is not easy. If it was we would
    be using all over the place and the parallel extensions would be nothing new.


    Making parallel code easier to use is an important development, but making it
    easier means you can use it without realizing what you are getting into. By being
    easy to use, Parallel for encourages programmers who might never consider additional
    threads to their code simply because it promises to get the job done faster. Unless
    we find a way of making parallel code both easy and safe then you are still going
    to have to take care.


    # Parallel Race Condition


    While we have looked at the problems of sharing resources in earlier chapters
    which applies to all asynchronous and true parallel methods, there is an addition
    problem with true parallel algorithms. Simply trying to turn a sequential algorithm
    into a parallel one introduces the possibility that the algorithm will interact
    with itself in ways that aren’t entirely obvious.


    Parallelism is easy if you restrict your attention to completely unrelated tasks.
    If you have task A which has nothing to do with task B, then you can simply say
    to a processor “get on with task A” and to another processor “get on with task
    B”. For example, if you have a shopping list then you can tear it in two and give
    one to shopper A and one to shopper B and tell them both to do the'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'shopping at the same time. When they meet up at the checkout there is no problem
    and the shopping is done in half the time.


    Things start to go wrong when the tasks are interrelated. For example, if the
    top half of the list says "buy bread" and the bottom half says "if you bought
    some bread some jam", there are problems. Now when you tear the list into two
    and the halves to shopper A and B what you get at the checkout varies - sometimes
    you get bread and no jam, sometimes bread and jam, and rarely notices it''s put
    back when shopper picks up a loaf, but at the last minute it puts back without
    getting another.


    If the list is processed by a single shopper buying things in the order the list
    specifies, there is no problem. As soon as you split the list then another you
    get depends on how the two tasks interact. Of course this is just another manifestation
    of the shared resource problem and the race conditions that can arise when it''s
    not clear what order will happen. What is new is that we now have the extra concern
    of how you split a sequential algorithm into portions that is safe to execute
    in parallel. Until recently this is a problem the average programmer could avoid
    by not trying to write parallel programs, but now C# has the Parallel. For construction
    it is very easy to convert a sequential algorithm into a parallel one without
    a moment''s extra thought.


    # The Parallel For In Action


    The Parallel.For loop makes it easy that you can start parallel programming in
    a few minutes - no threads, no tasks, nothing at all that looks any different
    from normal programming. When you get a little deeper you discover that you have
    to things lock shared resources and so on, problems can arise much earlier and
    at a much basic level if you haven''t thought about the consequences of implementing
    something in parallel.


    To see parallel programming in action start a new C# project and add: using System.Threading;
    System.Threading.Tasks;


    System.Threading is the original threading library and System.Threading.Tasks
    is where the newer parallel features live.'
