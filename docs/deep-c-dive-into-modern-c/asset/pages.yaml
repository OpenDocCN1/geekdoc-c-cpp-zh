  md: "As the compiler will try and infer the types in the call:\nmyObject.myMethod(\"\
    Hello\");\n\nthis looks as if it works and looks like it might be using the class\
    \ type parameter. This is a common error.\n\nYou can specify the type at the class\
    \ level and at the method level.\n\nNow we come to the big restriction inherent\
    \ in using a generic. As the type parameter is unknown at the time of declaring\
    \ the class, interface or function, you can't use any of its methods other than\
    \ the ones supported by object. So, for example, if you were to write:\n\n```\n\
    static T add<T>(T a, T b)\n{\n    return a+b;\n```\n\nthe result is an error message\
    \ saying the system can't work out what a+b is for type T. That is, when you are\
    \ writing a generic, <T> is the same as object. In this sense this is unreasonable\
    \ as, without knowing what T is, how can the system determine at compile time\
    \ how to implement the + operator? In this sense working with simple generics\
    \ is no better than working with the base type as a way of creating generic algorithms.\n\
    \n# Generic Inheritance\n\nYou can include a base class and interfaces within\
    \ the class definition and these can also be generic. That is, apart from the\
    \ use of the type parameter, the class declaration is standard. The same is true\
    \ for a generic interface. However, things are a little more complicated due to\
    \ the need to provide values for the type parameters you use in inherited classes\
    \ and interfaces. For example, if you create a generic interface:\n\n```\npublic\
    \ interface IMyInterfaceA<T>\n{\n    void MyMethod(T a)\n}\n```\n\nthen you would\
    \ inherit it in a generic class using:\n\n```\nclass MyClassA<T>: IMyInterfaceA<T>\n\
    {\n    public void MyMethod(T a)\n    {\n        throw new NotImplementedException();\n\
    \    }\n}\n```"
