  md: "At this point, given our earlier examples, it would appear easy to take over\
    \ the marshaling of the pointer to the struct and do it manually. For example,\
    \ what could be wrong with changing the declaration to:\n[DllImport(\"avifile32.dll\"\
    )\nextern static int AVIFileCreateStream(\n IntPtr pfile,\n IntPtr pavi,\n IntPtr\
    \ lParam);\n\nHowever, if you try to use it by passing the address of the pinned\
    \ struct:\nGHandle handle = GHandle.Alloc(Info, GCHandleType.Pinned);\nresult\
    \ = AVIFileCreateStream(file, ref pStream, handle.AddROFPinnedObject());\nhandle.Free();\n\
    \nThere is a run-time error:\n\n![](img/db5ebed54e0277237ef80cdc7d78ec05_341_0.png)\n\
    \nThe reason is that while you are indeed passing a pointer to the start of the\
    \ struct, that is in managed memory and unmanaged memory cannot access it without\
    \ generating a protection error.\n\nWhat we are forgetting is that standard marshaling\
    \ does much more for us than generate addresses use pointers. The default marshaling\
    \ for all parameters by ref also makes a copy of the entire data in unmanaged\
    \ memory before deriving a pointer. It copies the unmanaged memory back to the\
    \ managed type when the function ends.\n\nIt isn't difficult, and is indeed quite\
    \ useful, to write a function that does the same job as default marshaling:\n\
    private IntPtr MarshalToPointer(object data)\n{\n IntPtr buf = Marshal.AllocHGlobal(Marshal.SizeOf(data));\n\
    \ Marshal.StructureToPtr(data, buf, false);\n return buf;\n}"
