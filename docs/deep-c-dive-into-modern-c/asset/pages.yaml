- img_proc: true
  md: 'Downcasting works in the same way, but it isn''t always safe. Its type safety
    depends on the class being referenced actually being of the correct type, and
    it is again like a narrowing cast for value types but the analogy is not exact.
    For example, after:


    ```

    MyClassA myA = (MyClassA) new MyClassB();

    ```


    it is obvious that myA is actually referencing a MyClassB object, the rules of
    strong typing means that you can only use the methods defined in MyClassA. Suppose
    you know that myA is referencing a MyClassB object and want to use its methods,
    by what can can you do? The answer is you can downcast to MyClassB as in:


    ```

    MyClassB myB = (MyClassB) myA;

    ```


    and you can use myB as if it referenced a MyClassB object – because that is what
    it is.


    If you want to avoid involving another variable and just want to use MyClassB
    methods, you can write the cast as:


    ```

    ((ClassB)myA).MethodB();

    ```


    The extra parentheses are necessary because of the precedence of the operations.
    You can also make use of the as operator:


    ```

    (myA as MyClassB).MethodB();

    ```


    A downcast is not always safe. If myA turns out to be a type that isn''t a MyClassB
    object or derive from MyClassB then a run-time error occurs.


    # Generic Algorithms


    Having made clear what up- and downcasting are, why do we need them? What downcasting
    allows you to do is exactly what is to use a reference to a class without really
    knowing what it is. The most extreme example of downcasting is to use an object
    reference for any class you want to work with, for example:


    ```

    object MyAnything = new MyClassB();

    ((ClassB)MyAnything).methodB();

    ```


    Why might this be useful?


    The answer is that you can write code that will work with any type using nothing
    but object references. In short, you can write generic algorithms.'
