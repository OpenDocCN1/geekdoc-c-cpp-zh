  md: "```\nobject myObject = new MyClassA();\nint myResult = myObject switch\n{\n\
    \    MyClassB myB => myB.method(),\n    MyClassA myA => myA.method(),\n    int\
    \ myInt => myInt\n};\nConsole.WriteLine(myResult);\n```\n\nThis automatically\
    \ casts the myObject to the correct type in the declared variable.\n\nPattern\
    \ matching is more sophisticated than this suggests. In addition to type and declaration\
    \ patterns, you can also use constant and relational patterns to perform simple\
    \ tests, for example:\n\n```\nint myObject = 10;\nstring myResult = myObject switch\n\
    {\n    0 => \"zero\",\n    >0 => \"positive\",\n    => \"negative\"\n};\nConsole.WriteLine(myResult);\n\
    ```\n\nThe first pattern matches the 0, the second tests a relation and the final\
    \ pattern is the discard pattern which matches anything. As switch expressions\
    \ return to a result, one of the matches has to succeed and the simplest way is\
    \ to include a discard pattern at the end, which always matches and ensures that\
    \ the entire switch returns a result.\n\nPerhaps the most sophisticated patterns\
    \ are the property and positional patterns. The property pattern allows you to\
    \ test individual properties in an object. The properties are specified as a comma-separated\
    \ list in curly brackets, for example:\n\n```\nint myResult = myObject switch\n\
    {\n    MyClassB {property: >5} => expression,\n    ..\n```\n\nThis only matches\
    \ if myObject.property is greater than 5. Notice that this is type safe as myObject\
    \ is of type MyClassB and the compiler checks that it has property. You can nest\
    \ the pattern in the sense that if property is an object you can test its properties\
    \ and so on.\n\n```\nMyClassB {property: {A:0,B:>5}} => expression,\n```\n\nThis\
    \ matches if myObject.property.A is 0 and myObject.property.B is greater than\
    \ 5."
