  md: '# # Chapter 1

    Why C#?


    C# is a logical modern language that has so many advantages that it is difficult
    to know where to begin – but if you are reading this book probably don''t need
    much convincing. Even so it is worth knowing where the language came from, how
    it developed and where it stands in the world today, if only to make the case
    to other programmers less-informed.


    # ## The Politics


    The language first appeared around 2000 as part of .NET, which was Microsoft''s
    effort to modernize programming under Windows. It was the first major alternative
    to using C++, a very low-level language by comparison, and Visual Basic. Visual
    Basic 6 was, and still is, well-thought of by many but it was a language that
    had grown rather than designed. C# was intended to provide a middle ground for
    programmers not wanting the intricacies of C++ nor the limitations of Visual Basic
    6. At the same time a direct replacement for Visual Basic 6, Visual Basic .NET,
    was introduced but it satisfied no one-by being unlike its predecessor and not
    as logical or clean a language as C#.


    This was a time when Microsoft put effort into providing a programming environment
    that was special to Windows in order to attract programmers. The strategy worked,
    but internal divisions within Microsoft and the turmoil of Windows 8 and Windows
    Phone led to Microsoft supporting languages from other sources and the loss of
    the idea that Windows needed its own homegrown language.


    As a result in 2015 C# was open-sourced and adapted to work on any system, including
    Linux – the enemy of Windows. Much progress was lost to convert the .NET system
    to a fully cross-platform, but today we have a modern version of the language
    that will run on more than just Windows. It has to be admitted that there are
    still areas of C# use where the available libraries make it "Windows-specific".
    For example, if you want to develop a good user interface then WPF (Windows Presentation
    Foundation) is a good choice, but it only runs under Windows. There are efforts
    to build cross-platform replacements for these facilities, but many think that
    these will always be second best to the Windows programming environment.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'At the time of writing .NET and C# are alive and well and have a secure future,
    partly because Microsoft is not backing them as hard as it once did. The existence
    of a wider open source community is a reassurance that the C# programmer is no
    longer at the mercy of the volatile decisions of a company with a profit motive
    and lack of a wider vision.


    Today C# is a language of the computer world but still with a Windows legacy.


    # What Is C#?


    In its original incarnation C# was a more logical and hence easier to use C++,
    heavily influenced by Java. It was designed by Anders Hejlsberg who already had
    a series of successful language implementations to his credit. To date, C# is
    arguably his crowning achievement. The language implemented many of the concerns
    important at the time that were missing, or only partially implemented, in C++
    and Java.


    The key idea was that C# should be an object-oriented language – everything is
    an object – and it strongly typed so that checking can detect simple errors at
    compile time. Its implementation was also important in achieving these goals.
    Rather than use the Java Virtual Machine (JVM) or compile to native code, C# compiled
    to the .NET intermediate language (IL) and was run in a managed way which ensured
    that memory could not be corrupted by overflows or orphaned objects. All of this
    takes work and, as a result, C# programs are not as fast nor memory efficient
    as, say, the same program written in C, but they are in much simpler fact.


    Early versions of any language afford to be poor and stick to their founding principles,
    but over time they tend to accumulate additional “nice” features. So it is with
    C#. At first the additions were intended to make up for omissions in the early
    versions. Many of these features were introduced with the benefit of seeing how
    they were done in other languages and so tended to be more complete. For example,
    version 2 introduced generics, complete with covariance and contravariance to
    make type-safe programming more flexible. Facilities were improved to make them
    easier to use and more logical. For example, C# does not implement functions as
    objects, usually expressed as “functions are not first class objects in C#” so
    it provided a way to wrap a function in an object – a delegate – which is more
    or less the equivalent of the Java SAM (Single Abstract Method). Later it introduced
    anonymous methods and finally lambda functions to make functions easier to pass
    to other functions.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Other additions to the language have been influenced by external trends. In
    particular “functional programming” features have been added but always with an
    eye to type safety. For example, iterators, dynamic types, tuples, deconstruction,
    pattern matching and so on. This is enough to make some programmers that C# is
    no longer a simple object-oriented, strongly typed language, but something more
    mixed with respect to programming paradigms. However, the backbone of C# is still
    its original approach.


    How would C# be described today?


    C# is an object-oriented, strongly typed language with many of the features and
    facilities of other popular modern languages. Its primary development paradigm
    is object-oriented programming with conveniences imported from other approaches.
    It is multi-platform, but there is still a strong bias towards Windows development
    for desktop applications.


    # What Is C# For?


    Should you use C# for a new project?


    If you are creating anything running under Windows, as a desktop app or as a server,
    then C# is an excellent choice. It has library support for many Windows-only features
    that making sophisticated applications much easier. You also get the possibility
    of running the application cross-platform, but if you used Windows-specific libraries
    you will have to find alternatives.


    At the moment, Windows Forms and WPF, the two Windows GUI libraries, are not available
    for non-Windows systems and finding alternatives isn''t easy. One possible is
    Avalonia, an open source XAML-based GUI that works on Windows, Mac and Linux,
    with optional paid support. It is very similar to WPF, which was code-named Avalon
    before its release, but not directly compatible and there is no drag-and-drop
    editor. If you are able to restrict your attention to console applications then
    things are much simpler.


    The alternative is to use ASP.NET which is a cross-platform web development system.
    This allows you to create applications using HTML/CSS/JavaScript as their front
    ends. These are truly cross-platform, as long as you don''t use of any OS-specific
    libraries or facilities. The only problem is that they run in a browser and don''t
    look native in any sense. You can hide the fact that the application is running
    in a browser by using a Web View component or a host like Electron which allows
    the application to render HTML.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'If you are interested in cross-platform mobile development then there is MAUI
    (Multi-platform App UI). This is a project that brings Mono/Xamarin together with
    .NET. You can use it to create applications for Android, iOS, macOS and Windows.
    The only problem is that Linux is not supported, but there are efforts to add
    this to the open source project.


    It is clear that the cross-platform uses of C# are still developing.


    # Working With C#


    Although this isn''t a book about project development, it is worth saying that
    the all-important development environment for C# is still Visual Studio, but this
    only runs under Windows. It is the development environment of choice for C# programmers
    as it supports a wide range of project types and has drag-and-drop editors for
    both Windows and WPF. If you want a quick-start, easy-to-use, IDE then this is
    your best choice. Perhaps its only downside is that it supports so many projects
    that it can be confusing.


    If you are looking for a cross-platform solution then the similarly named Visual
    Studio Code is a good choice, but compared to Visual Studio it doesn''t offer
    very much. With the addition of the C# extension you have a good code editor,
    but you have to manage the project structure yourself and there are no drag-and-drop
    editors and few features that allow you to configure a project. Beyond these two
    Microsoft offerings there are a number of possibilities, each with their own drawbacks.
    Jetbrains has Rider which has a 30-day free trial, but again no UI editors. Eclipse
    has a plug for C#, but its features are limited. Finally there is Xamarin''s Visual
    Studio for the Mac which is good, but its future isn''t clear.


    # A Brief History Of C#


    There is no real need to know the history of C# unless you are forced to work
    on legacy code. If you are starting a new project, or one that can be modified
    to work with current versions, then you should use the latest version of C# and
    the .NET framework. You can mostly ignore the difficulties of converting between
    Microsoft''s version of .NET and the open source version, which used to be called
    .NET Core. Simply use the latest version of the .NET framework unless you are
    forced to use an earlier version.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'For interest and to help anyone working with legacy code, here''s a timeline
    of major C# versions:


    +   * 2002 - Version 1.0

    nA very basic version of the language. It has all of the basic data structures,
    events and delegates.


    +   * 2006 - Version 2.0

    nThe most important feature added was generics. It is also when nullable types
    were introduced.


    +   * 2007 - Version 3.0

    This when LINQ and lambda expressions were introduced along extension methods
    and anonymous types. This is the point at which C# started to add functional programming
    features.


    +   * 2010 - Version 4.0

    This introduced minor additions including named arguments and improved interop.
    The inclusion of functional programming ideas continued with the ability to declare
    a variable as dynamic.


    +   * 2012 - Version 5.0

    Async and await were new in this version and at last provided a simple, clean
    approach to writing asynchronous code.


    +   * 2015 - Version 6.0

    Some minor additions including string interpolation.


    +   * 2017 - Version 7.0

    More functional features were added including tuples and deconstruction and pattern
    matching.


    +   * 2019 - Version 8.0

    Updated to make use of .NET Core, the open-source version of the .NET framework.
    It also introduced default interfaces, methods and extensions to pattern matching.


    +   * 2020 - Version 9.0 2020

    Full supporting for .NET, the new name for .NET Core. The only major addition
    was the record type.'
