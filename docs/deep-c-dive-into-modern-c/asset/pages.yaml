  md: "# Covariance and Contravariance\n\nThis is one of the most complicated of the\
    \ generic topics and is made more complicated by the use of some advanced sounding\
    \ terminology. However, it isn't as difficult as many explanations and examples\
    \ would have you believe. Even so, many users, even designers of generic classes,\
    \ don't have to understand what is going on at first. So come back and read this\
    \ when you need to and once you have a good grasp of inheritance.\n\nThe first\
    \ thing to understand is this idea that inputs behave differently than outputs.\n\
    \nWe have already looked at this idea in the context of the inheritance hierarchy,\
    \ but it becomes particularly important once we introduce generics.\n\nIf you\
    \ recall, derived classes are \"bigger\" than base classes because they have everything\
    \ that the base class, and possibly some additional methods and properties. You\
    \ can think of this as defining a partial order on the classes. So, if B is derived\
    \ from base A you can write A>B, indicating that A is higher in the hierarchy\
    \ than B, even though B potentially has actually more methods than A. This is\
    \ confusing, but it is widely used.\n\nThis is the Liskov Substitution principle,\
    \ and it is more of an ideal than a principle or a practical reality. In the real\
    \ world it is very easy to construct derived classes that override methods in\
    \ such a way that they cannot use in place of their base. The Liskov Substitution\
    \ principle can't be a law of nature. Instead it is something you have to work\
    \ at ensuring true. You can extend the idea and say that any entity B can be used\
    \ anywhere A can satisfies A>B, even if A isn't in any proper sense a base for\
    \ B.\n\nNow consider the following:\n\n```\nMyClassB Function1(MyClassA a) {\n\
    \    do something with a MyClassA\n    create myObject instance of MyClassB\n\
    \    return myObject}\n```\n\nYou can see that the function is associated with\
    \ two types – MyClassA is its input type and MyClassB is its output type.\n\n\
    Let's focus on the input type. Consider two functions that you assume knowing\
    \ nothing beyond the declarations:\n\n```\nvoid Function1(MyClassA a)\nand:\n\
    void Function2(MyClassB b)\n```\n\nand ask yourself you can pass in a MyClassB\
    \ into Function1? The answer is yes because, whatever the function does, the properties\
    \ it uses are all present for MyClassB. Now ask if you can pass in a MyClassA\
    \ into Function2? The"
