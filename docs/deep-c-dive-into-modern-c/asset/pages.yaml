  md: 'and you get to the point where you need to load a new resource and this is
    a time-consuming action, then there are two approaches, blocking synchronous and
    non-blocking asynchronous. Blocking synchronous simply causes the thread doing
    the work to pause until the resource is loaded:


    +   work with resources

    request new resource

    wait(until resource loaded)

    continue with processing


    This has the advantage of simplicity and you can clearly see what is happening,
    but if the processing thread is also processing events then all event handling
    stops at the wait. This is a common problem that can be partly alleviated by constructs
    such as DoEvents which sends the thread off to process events while waiting:


    +   work with resources

    request new resource

    Do Until (resource loaded)

    DoEvents


    +   Loop

    continue with processing


    This approach has many problems - the biggest being reentrancy, i.e. what if an
    event that occurs as the result of DoEvents restarts the entire method over again.
    The second approach, non-blocking asynchronous, is to use an event to trigger
    the resumption of the processing when the resource has loaded, for example:


    +   work with resources

    setup "resource loaded" event handler

    request new resource

    end method


    When the method ends, the thread can continue to process events and, when the
    resource is loaded, the assigned event handler is invoked and processing continues.


    The problem with this is that the event handler has to be written elsewhere and
    it''s self-contained and doesn''t share access to any of the resources of the
    original processing method. That is, the logic of the program says:


    +   do actions A

    load new resource

    do actions B

    end AB'
