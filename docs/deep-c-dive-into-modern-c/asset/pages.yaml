  md: '# Chapter 22


    # Regular Expressions


    If you think regular expressions are trivial and boring, you''ve not seen the
    whole picture. Here we reveal that in .NET they are amazingly powerful and not
    to be missed.


    Regular expressions are addictive. Playing with these compressed and cryptic patterns
    is better than solving a Sudoku. If you are wondering what this is all about because


    # Regular Fundamentals


    The idea of a regular expression starts with the idea of specifying a grammar
    for a particular set of strings. All you have to do is find a pattern that matches
    all of the strings you are interested in and use the pattern. The simplest sort
    of pattern is the string literal that matches itself. So, for example, if you
    want to process ISBN numbers you might well want to match the string "ISBN:" which
    is its own regular expression in the sense that the pattern "ISBN:" will match
    exactly one string that is exactly "ISBN:". To actually use this have to first
    create a Regex object with the regular expression built into it:


    ```

    Regex ex1 = new Regex(\@ISBN:");

    ```


    The use of @ at the start of the string is optional, but it does make it easier
    as we can avoid the use of / the escape character. Recall that strings starting
    with @ are represented "as is" without any additional processing or conversion
    by C#.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'To evaluate the regular expression we need one of the methods offered by the
    Regex object. The most obvious to start with is the Match method which applies
    the expression to a specified string and returns a Match object which in turn
    contains a range of useful properties and methods that let track the operation
    of applying the regular expression to the string. For example, if there was a
    match Success property it would be set to true:


    ```

    MessageBox.Show(

    ex1.Match(\@ISBN:978-1871962406").Success.ToString());

    ```


    The Index property gives the position of the match in the search string:


    ```

    ex1.Match(\@ISBN:978-1871962406\).ToString();

    ```


    which in this case returns 0 to indicate that the match is at the start of the
    string.


    To return the actual match in the target string you can use the ToString method.
    Of course, here the result is going to be identical to the regular expression,
    but in general this isn''t the case. Notice that the Match method returns the
    first match to the regular expression and you can use the NextMatch method which
    returns another Match object.


    # Pattern Matching


    If this is all there do regular expressions they wouldn''t be very interesting.
    The reason they are so useful is that you can specify patterns that spell out
    the regulars in a type of data. For example, following "ISBN:\d" we expect to
    find a digit – any digit. This can be expressed as "ISBN:\d where \d is character
    class indicator which means "a digit".


    If you try out you will discover that you don''t get a match with the example
    string because there is a space before the colon. However: ISBN:\s\d"


    does match as \s means "any white-space character" and:


    ```

    Regex ex1 = new Regex(\@ISBN:\s\d\)

    MessageBox.Show(ex1.Match(\@ISBN:978-1871962406\).ToString());

    ```


    displays "ISBN: 9".


    You can look up the available character set indicators in the documentation. The
    most useful are:


    +   * (a single dot) matches any character.

    * \d digit

    * \s white-space

    * \w any "word" character including digits'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'There is also the convention that capital letters match the inverse set of

    characters:


    +   * \D any non-digit

    * \S any non-white space

    * \W any non-word character


    The inverse sets can behave unexpectedly unless you are very clear about

    what they mean. For example, \D matches white space and hence

    @"ISBN:\\D\d" matches ISBN: 9.


    You can make up your own group character by listing the list of

    characters between square brackets. So, for example, [0-9] is the same as \d.

    ating a character is also possible and [^0-9] matches anything but

    digits and is the same as \W.


    There are also characters that refer to Unicode but these are obvious

    enough in use not to need additional explanation.


    # Anchors


    As well as characters and character sets you can also use location matches or

    anors. For example, the ^ (caret) only matches the start of the string. For

    example, @"ISBN:\ will match only if the string starts with ISBN and

    does''t match if the same substring occurs anywhere else. The most useful

    anors are:


    +   * ^ start of string

    * $ end of string

    * \b word boundary, i.e. between a \w and \W

    * \B anywhere but a word boundary


    So for, example, @"\\u0024d*" specifies a string consisting of nothing but digits.

    Compare this to @"\\u0024d*" would also accept a null string.


    One subtle point only emerges when you consider strings with line breaks.

    in case, by the ^ and the $ match only the very start and end of the

    string. If you want to match line beginnings and endings you have to

    specify the m option either by setting the RegexOptions.Multiline parameter

    in the method call or by including \m in the regular expression. It''s also worth

    knowing about the \G anchor which matches only the point where the

    previous match ended. It is only useful when used with the NextMatch

    method, but then it makes all matches contiguous.'
  merge: -1
