  md: '# Preface


    C# is a well-established language and, with its new open-source incarnation it
    has renewed vigor and a long-term future. It is now possible to treat C# as a
    single modern language with the ability to work cross-platform. It has gone from
    being a one-OS, i.e. Windows, language to something that works with Windows, Linux,
    Mac OS and more. However, it still has many features that make it an ideal choice
    for Windows development.


    This book is what might be called a "deep dive" into various topics that are important
    or central to the language. Some of the dives are not deep as others – not all
    topics harbor the same degree of deepness and how deep you find something depends
    on how much you know. If you are a C# super-expert, you might think that we are
    just getting our feet wet. However, my intention is to explain the topics at a
    level that will suit the majority of C# programmers. Not everything will be new
    to any given reader, but I hope that the motivation behind key concepts, which
    is so often ignored in the documentation, is new and thought-provoking.


    Most of the chapters start off in the shallows and work their way towards deeper
    water. Each chapter is largely self-contained and does entail some repetition
    and unfortunately there is still the need for some forward and backward references.
    If you encounter something that it is assumed you know about, but you don''t,
    look it up – none of the assumed ideas are deep.


    While you can read the chapters in almost any order, there is a progression of
    ideas within each section. This book is not a cookbook, a language introduction
    or a reference, it is a general reader for the interested programmer. It is also
    focused on language aspects of C# and far less so on the technologies using ASPNET,
    WPF or any of the framework libraries. These are comparatively easy when you have
    touched bottom with C#.


    My thanks are due to my ever-digent editors, Sue Gee and Kay Ewbank, for spotting
    errors and suggesting improvements.


    Mike James

    September 2021'
