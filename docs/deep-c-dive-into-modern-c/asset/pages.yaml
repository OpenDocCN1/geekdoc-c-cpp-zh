  md: "The as operator is an alternative way of writing a cast but with the difference\n\
    that if it fails the reference is null. For example:\nMyClassB MyB = Anything\
    \ as MyClassB;\n throws an exception but you have to make sure that you don't\
    \ end up\nusing a null reference because it didn't actually work.\n\nNotice that\
    \ you can use to write a cast method call neatly:\n(Anything as ClassB).MethodB()\n\
    \nbut that you will generate a run-time error if the cast fails and MethodB\n\
    does't exist. To avoid this you use the null conditional operator:\n(Anything\
    \ as ClassB)?.MethodB()\n\nNow the result is a null if the method call fails.\n\
    \nAlways as in place of explicit casting.\n\n# Overriding and Abstract Class\n\
