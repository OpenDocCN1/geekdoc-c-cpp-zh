- img_proc: true
  md: "The same algorithm used with a Parallel.For is much trickier. Consider:\nParallel.For(0,\
    \ size, i => {\n  data[i] = 1;\n  if (data[new Random().Next(i)] == 0.0)\n   \
    \ flag = false;\n});\n\nIn this case the order in which the elements are processed\
    \ isn't guaranteed and in most cases there will be an element that hasn't been\
    \ processed and the result is usually flag = false. However, notice that the actual\
    \ situation is much worse than simply getting a different answer. It is possible\
    \ that the order of evaluation will be that all of the tested elements are non-zero\
    \ and in this case the result will, very occasionally, flag = true and the outcome\
    \ isn't even predictable – it's a race condition and makes it non-deterministic.\
    \ The result of the program can vary every time you run it until its outcome is\
    \ random.\n\n# # No Fix!\n\nThe random nature of a program plagued by a race condition\
    \ is often put down to an intermittent hardware fault, but notice that there is\
    \ no easy remedy for this problem. It isn't a problem due to locking or the use\
    \ of shared resource or any other fixable problem. The algorithm that you are\
    \ trying to implement needs the data in a particular order and a parallel implementation\
    \ doesn't promise to evaluate in any particular order which means that the algorithm\
    \ is inherently not parallel. You might be able to re-cast the algorithm in form\
    \ that is suitable for parallel implementation but as stands it doesn't work.\n\
    \nThis order of evaluation is false, the reason why you only get a forward implementation\
    \ of Parallel.For, i.e. 1,2,3 4... and not a reverse of a loop, i.e. ...4,3,2,1.\
    \ As the order of evaluation isn't fixed, it would be a nonsense to tell you it\
    \ reverses in order. Any algorithm that requires a loop with a particular order\
    \ is inherently parallel.\n\nThe only type of Parallel.For that is free of this\
    \ problem is one that doesn't manipulate the index, i.e. all expressions are indexed\
    \ by i, not i+1 and i-3, etc.\n\nNotice that this doesn't mean that the Parallel.For\
    \ is useless or even primitive. It is choosing how to partition the loop, creating\
    \ the threads necessary, running the partitions one per thread and making sure\
    \ that everything waits until the final thread completes the task. If you were\
    \ to implement it from scratch you would need to generate a lot of code. This\
    \ is a great simplification"
