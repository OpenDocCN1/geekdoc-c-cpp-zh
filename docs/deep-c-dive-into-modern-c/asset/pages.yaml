  md: '# Postlude


    Inheritance is a powerful idea and it can be misused more easily than used to
    good effect. The problems usually arise when inheritance chains are long and ad
    hoc, but long inheritance chains are usually an indication that either the principles
    of object design are not being used or that the situation is truly complex.


    Your choices are either to attempt to control inheritance piecemeal with access
    modifiers or forbid it using sealed. If you choose not to use inheritance then
    you need to be aware that the alternatives, containment or extension methods,
    that you are almost certain to be attracted to, carry your own problems and increase
    your workload. Whatever you do, make sure you understand the technology you opt
    for.'
