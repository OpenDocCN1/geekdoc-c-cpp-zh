  md: '# Beyond Plain .NET Objects


    How the method invocation or property access is handled depends on the type of
    object that the dynamic type references. You might think that the only possibility
    is the plain old .NET object, but part of the reason for introducing dynamic is
    to make externally derived objects easier to work with.


    In the case of a standard .NET object, reflection is used to dispatch the operation.
    This is more sophisticated than you might imagine because any dynamic objects
    passed as parameters are resolved using reflection and then the resulting signature
    combined with reflection is used to make the call to the appropriate method. Moving
    beyond .NET objects, a new class of dynamic objects can customize how they behave
    by implementing the IDynamicObject interface. This case the task of working out
    which method or property is needed handed off to the object to work out using
    any method that suits. This is the key to building truly dynamic objects that
    respond in sophisticated ways.


    A big variety of dynamic types comes when you start to think about C#''s relationship
    with external and non-native objects, COM objects in particular. In this case
    a dynamic type is resolved using the COM IDispatch interface and in this means
    you can use COM objects "raw", without a Primary Interop Assembly (PIA). As many
    COM objects make extensive use of the variant type, which can store any number
    of standard types, being able to use dynamic types in place of variants is a big
    simplification. For example, consider the standard difficulty encountered in using
    the Office object model:


    ```

    (Excel.Cells[1,1]).value= "some string"

    ```


    The cast has to be included because the PIA uses object types to represent variants.
    Using dynamic types in place of objects makes it possible to dispense with the
    case and allow the runtime system to work out what is legal:


    ```

    excel.Cells[1,1].Value= "some string"

    ```


    Not using the PIA and drawing the COM interface raw also means that you can hope
    to achieve a more efficient and lightweight program.


    There are other enhancements to the way COM objects are dealt with that go together
    to make the whole thing easier to use. For example, COM objects often pass parameters
    using pointers which result in the use of ref parameters in the corresponding
    C# methods. This can force you to create temporary variables to avoid any changes
    to a variable that you regard as logically passed by value. No compiler will do
    the job for you by converting the value parameter to a temporary copy and passing
    by reference. The overall result is pass-by semantics for parameters that are
    passed as pointers.'
