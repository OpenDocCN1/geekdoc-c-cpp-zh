  md: '# Type Conversion


    The simplest use of a cast is to convert from one numeric type to another and
    this is where active representation conversion first enters the picture. When
    the cast is safe from the point of view of representation then the compiler will
    do the job implicit for you.


    For example:


    ```

    int MyInt;

    long MyLong;

    MyLong = MyInt;

    ```


    is fine as the compiler can always store a 32-bit integer in a 64-bit integer.


    This is an example of a “widening” cast in the sense that the conversion is from
    a smaller or narrower type to a bigger or wider type. “bigger” and “smaller” refer
    both to the amount of memory the data takes to store also, and more abstractly,
    the range of data that they can store. A narrower type can, in principle, be represented
    by a wider type but usually only a sub-range of a wider type can be represented
    by a narrower type. The terminology is commonly used but not precise.


    The key idea is that:


    A wider data type can always be used in place of a narrower data type because
    it can represent everything the narrower type.


    As in this case the required conversion is from a narrower to a wider type the
    compiler assumes that you intend to write:


    ```

    MyLong = (long)MyInt;

    ```


    However, if the implied cast could unsafe then the compiler insists that you write
    out your intentions explicitly. For example, for a wider to a narrower cast:


    ```

    MyInt = MyLong;

    ```


    the compiler will, quite, generate a compile-time error because you can’t always
    convert a64-bit integer into a 32-bit integer.


    The fact that you can’t always do it doesn’t mean that it is always wrong. If
    you really mean it then you can write:


    ```

    MyInt = (int)MyLong;

    ```


    and the compiler will perform the type conversion by generating the necessary
    IL (intermediate language) to convert a 32-bit integer into a 64-bit integer.
    Notice that there is no natural way to do this conversion and in practice C# simply
    moves the low 32 bits of the long value into the int.'
