  md: "# Structs From Streams\n\nA fairly common requirement is to read a struct,\
    \ possibly written using some other language, into a C# struct. For example, suppose\
    \ you need to read in a bitmap file which starts with a file header, followed\
    \ by a bitmap header and then the bitmap header structure is easy to translate:\n\
    \n```\n[StructLayout(LayoutKind.Sequential,Pack = 1)]\npublic struct BITMAPFILEHEADER\
    \ {\n    public Int16 bfType;\n    public Int32 bfSize;\n    public Int16 bfReserved1;\n\
    \    public Int16 bfReserved2;\n    public Int32 bfOffBits;\n}\n```\n\nA function\
    \ that will read any structure available as a stream and return a struct can be\
    \ written without the need for generics:\n\n```\npublic object ReadStruct(FileStream\
    \ fs, Type t) {\n    byte[] buffer = new byte[Marshal.SizeOf(t)];\n    fs.Read(buffer,0,Marshal.SizeOf(t));\n\
    \    GCHandle handle = GCHandle.Alloc(buffer,GCHandleType.Pinned);\n    Object\
    \ temp = Marshal.PtrToStructure(handle.AddrOfPinnedObject(), t);\n    handle.Free();\n\
    \    return temp;\n}\n```\n\nYou should recognize the use of the GCHandle object\
    \ to enable the data to be transferred. The new feature is the use of a Type object\
    \ to specify the type of the struct being read in. Unfortunately there is no way\
    \ to use this to return an object of the specified type and so we need to use\
    \ a cast when calling the function, as in:\n\n```\nFileStream fs = new FileStream(\"\
    c:\\1.bmp\", FileMode.Open, FileAccess.Read);\nBITMAPFILEHEADER bmFH=ReadStruct(fs,\
    \ typeof(BITMAPFILEHEADER));\n```"
