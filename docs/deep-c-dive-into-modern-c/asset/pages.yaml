  md: 'The first parameter specification of all extensions has the same form. The
    this MyClassA part, indicates the type that the method is added to and the actual
    parameter, myinstance, is set to a reference to the instance of MyClassA that
    the method has been invoked on. That is, myinstance can be used in this regular
    class method and hence it gives access to all the members of the class.


    To use the extension you simply invoke the method as if it was a regular method
    defined as part of the class:

    MyClassA myobj2 = new MyClassA();

    obj2.MyExtension();


    At this point looks as if the extension method is exactly the solution we have
    been looking for. It allows you to add methods to classes that have been sealed
    and provides a way of extending the .NET class library and fundamental types such
    as int or string. However, there are some restrictions on how an extension method
    works and behaves.

    The first restriction is that an extension method only has access to the public
    private or protected members. In particular, an extension method is no more privileged
    than any code that extends to the class. In addition you can''t override a class
    by an extension method. If you attempt to give an extension method the same name
    and signature as a class method then the class method is always used in preference.
    Notice that no warning is given of the name conflict. This means that extension
    methods really only able to extend the behavior of a class and not modify it.
    This makes extension safer than inheritance and overriding.


    Extension methods are, however, inherited. If you create a MyClassB inherits from
    MyClassA then will have all of the extension methods of MyClassA. This inheritance
    is not virtual and hence polymorphism is not supported. The availability of an
    extension method depends on the declared type of a reference and not on the type
    of the instance it actually references. This means that extension calls are early
    bound and type checked at compile time.


    For example, if MyClassB inherits from MyClassA and both declare an extension
    method MyExtension then MyClassA will use its version and MyClassB its version.
    Notice there is no need to use new or override to redefine extension methods in
    derived classes. The rule is that the extension method used by a class is the
    one that matches its type most accurately. For example:

    MyClassA myobj1;

    obj1= new MyClassB();

    obj1.MyExtension();

    results in the extension method for MyClassA being called, even though the reference
    is to an instance of MyClassB.'
