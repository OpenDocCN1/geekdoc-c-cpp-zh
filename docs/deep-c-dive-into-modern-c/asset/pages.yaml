  md: "The difference between the two types of behavior is usually expressed as value\
    \ semantics versus reference semantics, i.e. is the variable value or a reference\
    \ to the value. The advice is that structs should be used for simple data types\
    \ where value assignment seems natural and classes should be used for more advanced\
    \ types where reference assignment is natural.\n\nIf you want to use a class to\
    \ store data C# has a predefined record class that makes it particularly easy,\
    \ but a record is still a class and reference semantics apply.\n\n#  Arrays\n\n\
    Value semantics also has another spin-off when it comes to arrays and indeed other\
    \ complex data types. When you create an array you always use something closer\
    \ to reference-type semantics as in:\n\n```\nint[] a = new int[10];\n```\n\nThis\
    \ creates 10 in a contiguous block of memory and this is very efficient. Now consider:\n\
    \n```\nPointR[] b = new PointR[10];\n```\n\nThis creates a contiguous block of\
    \ 10 reference variables of type PointR all referencing nothing at all. That is,\
    \ all you have created an array of references to null.\n\nTo finish the array\
    \ construction you have to use something like:\n\n```\nfor(int i = 0;i<b.length;i++){\n\
    \  b[i] = new PointR();\n}\n```\n\nThis, course, is not as efficient as the 10\
    \ objects are created on the heap and have to be memory managed, but all object-oriented\
    \ languages suffer from this type of problem. The good news is that C# treats\
    \ arrays created using structs in the same way as simple types, i.e. using value\
    \ semantics.\n\n```\nPointV[] c = new PointV[10];\n```\n\nimmediately creates\
    \ an array of 10 PointV objects in a contiguous block of memory.\n\nAs long as\
    \ you keep thinking of value types and reference types as being or or less the\
    \ same, except reference types don't automatically create the object they reference,\
    \ you should follow and things should seem simple."
