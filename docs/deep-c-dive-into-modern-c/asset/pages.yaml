  md: "# Arrays and Generic Actions\n\nThe idea of a generic action may seem to be\
    \ ad-hoc, but it is useful enough to have its way into the framework. Before generics\
    \ were introduced, the Array.Sort function was implemented using interfaces and\
    \ how this works is also worth knowing.\n\nThe C# array sort function can sort\
    \ any array type because it accepts a definition of an order relation between\
    \ objects. To define the order relation used in the sort you need to implement\
    \ an object with an IComparator interface. This defines a Compare method that\
    \ returns -1, 0, or 1 depending on the result of the compare – less than, equal\
    \ or greater than respectively:\n\n```\nprivate class MyCompare : IComparator\n\
    {\n    int IComparator.Compare(Object x, Object y)\n    {\n```\n\nThe problem\
    \ now is that we have to do the comparison between x and y but this is difficult\
    \ without knowing what types they are.\n\nThe simplest solution is to cast the\
    \ type that is stored in the array and then use the type's CompareTo method:\n\
    \n```\nprivate class MyCompare : IComparator\n{\n    int IComparator.Compare(Object\
    \ x, Object y)\n    {\n        return ((int)y).CompareTo((int)x);\n    }\n}\n\
    ```\n\nOf course, this is to use \"the object as a reference to anything\" approach\
    \ to writing type neutral functions. This is really only useful if you are working\
    \ with your own classes and can implement your own CompareTo method. Notice that\
    \ this suggests that we need an implementation of IComparator for each type we\
    \ want to sort the routine with.\n\nWith a suitable sort we can sort the array\
    \ into descending order: Array.Sort(A, new MyCompare());\n\nThe wider point being\
    \ made is that without using generics is the only way you can be. You need an\
    \ interface to define the form of the function to be used and you have to cast\
    \ to actually do the work that makes use of the nature of the objects actually\
    \ being passed. This clearly isn't type safe at compile as the casts cannot be\
    \ checked, but it can be made safe at run time by adding code to make sure the\
    \ objects are of a type you can work with."
