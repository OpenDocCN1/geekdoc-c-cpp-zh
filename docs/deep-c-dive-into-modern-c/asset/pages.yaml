  md: '# Just Enough COM


    The idea of a COM object is very simple. It''s essentially a C++ class with some
    public virtual methods that you can call. In theory, it doesn''t have to be implemented
    in C++, but that''s the language that the technology was based on. A virtual method
    is simply a function that you can access via a pointer, like a virtual method
    in C# it is late-bound and a COM object organizes these pointers into functions
    into an array called vtable. At a slightly higher-level we can view this vtable
    as an interface, i.e a collection of functions defined type and signature. It''s
    important to notice that the type/signature aspects of an interface aren''t part
    of its run-time implementation – it really is just an array of function pointers
    and you could use it to call one of the functions with any parameters you care
    to supply. Of course, if you don''t supply the parameters, nothing works and the
    whole crashes.


    COM formalizes the interface to allow you to write code that “discovers” what
    an object supports at run. The idea is that all COM objects offer a basic interface
    called IUnknown which has three methods, QueryInterface, AddRef and Release. AddRef
    and Release just increment and decrement a counter so that the COM object knows
    when it still has users you can most ignore.


    The QueryInterface method is much more useful in that it will return a pointer
    to any other interfaces the object supports. Rather than using a name to specify
    the interface you want to find, you specify its IID (Interface ID), that is the
    Guid (Globally Unique Identifier) that was allocated to the COM object stored
    in the registry when it was installed. Indeed, the COM object is identified by
    any GUID in the registry known as its clsid (Class ID).


    Thus far the story is simple. To use a COM object you first create an instance
    of it using the standard API function CoCreateInstance. You pass the clsid of
    the COM object and it passes back a pointer to the object''s IUnknown interface.
    You then pass the IUnknown QueryInterface the IID of the interface you want to
    find and it passes back a pointer to it. You also need to know that every interface
    “inherits” from IUnknown and so every vtable starts off with the entire vtable
    for the base interface before the pointers to any functions.


    Interfaces based on IUnknown are very simple. In fact, they are so simple that
    COM needed more infrastructure to cope with the real world. A wide range of additional
    technologies have been added to the basic IUnknown mechanism to make using COM
    “automatic”, in particular IDDispatch interfaces and IDL.


    296'
