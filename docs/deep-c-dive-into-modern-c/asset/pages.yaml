- img_proc: true
  md: 'An input parameter is something that is going to be worked on by the method
    assuming that it is a MyClassB object and so it could be substituted by a derived
    class, i.e. a bigger object such as a MyClassC object for example.


    Now you can downcast the MyClassB parameter and call the function with anything
    derived from MyClassC, but you cannot use MyClassA because it might not have all
    the methods of a MyClassB object. This ability to accept a bigger object but not
    a smaller one, ie you can only downcast the parameter, is often referred to as
    "contravariance"


    Consider the situation with respect to a return value of type MyClassB, MyClassB
    myFunction();


    In this case the calling program receives a MyClassB object as the result and
    can safely use it as a MyClassA object by upcasting from the result, but clearly
    you can''t use it as a MyClassC object by downcasting. That is, the return parameter
    can be safely upcast to a smaller object and this in turn is referred to as "covariance"


    That is if the input and output are of type MyClassB then


    +   - an input parameter can be downcast

    - an input parameter can be upcast


    or

    output input

    MyClassA  MyClassB  MyClassC


    So in the current input parameters are contravariant, output parameters are covariant
    and in/out parameters are invariant because they can''t be safely cast in either
    direction at all. The reason for this terminology and the idea is explained in
    more detail in Chapter 10.


    # Postulate


    When you realize how confused the use of casting is in C# and most modern languages
    you can''t help but be unhappy about it. If you want to put some into your use
    of casting then it only for passive type conversions and for any active type conversion
    that involves manipulation of the representation of a type. If your real purpose
    is to provide active type conversion for your classes, then see the Converter
    class and the IConvertible interface in the C# documentation.


    Keep in mind that generics provide a good way of avoiding the use of casts, but
    that there are times when casting provides a more powerful solution to the same
    problem.'
