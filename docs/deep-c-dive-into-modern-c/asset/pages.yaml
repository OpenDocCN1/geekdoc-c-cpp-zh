  md: '# # Chapter 26


    # # Bit Manipulation


    Is C# a high-level or a low-level language? It doesn''t really matter. All languages
    are low-level when you are thinking in terms of bits, and sometimes you just can''t
    avoid thinking in bits.


    There are all sorts of reasons why any language needs to get down to the actual
    bits that make up any real program. Often it is forced on the programmer by the
    need to use legacy data or to work with raw data generated by another program
    or hardware device. In principle you can avoid it by introducing abstractions
    such as sets and so on, but at the end of the day it is usually simpler and more
    direct to work with the data as it is actually represented inside the machine.


    This is often regrettable but mostly true.


    Sooner or later you are going to have to solve a problem that comes down to working
    with the bit patterns that represent a variable''s value.


    So how should a high-level language handle such low-level work?


    In the case of C# one important consideration is the need to stay in the realm
    of managed code. Of course, it is possible to descend to almost any level you
    are happy with "unsafe" and PInvoke, but ideally C# should provide bit operations
    that are safe because they are part of managed code.


    What is interesting about C# is that you can conclude that it isn''t very good
    at low-bit manipulation until you discover the BitConverter class and a few other,
    reasonably well-hidden, facilities.'
  merge: -1
