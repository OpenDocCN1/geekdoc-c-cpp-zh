  md: '# Chapter 7


    # Controlling Inheritance


    Inheritance, both class and interface, is a great idea, but it is a powerful technique
    that can be misused. C# provides the tools to keep inheritance under control or
    to turn it off completely if you want to.


    # Class As The Unit Of Software


    If you create a class the code you have implemented is a template for many instances
    of the class you care to create. This is software reuse in action and you benefit
    from it whenever you use any class library.


    Inheritance is a cornerstone of the object-oriented method but not everyone is
    of the opinion that it is a good idea. See it as a contrived and a dangerous approach
    to building software. The problem is that if you modify a base class how can be
    sure the change doesn''t break the derived classes in ways that are complex and
    difficult to fix? This is sometimes expressed by referring to the “coupling” classes.
    For a good design, classes should be loosely coupled, i.e. have a low dependency
    on each other’s working, and clearly inheritance involves very tight coupling
    between the base and derived classes. However, the nature of this coupling is
    very precise and not really in the same category as classes that just happen to
    use each other’s internal workings.


    As a result of these views, inheritance is often treated with caution, if not
    downright avoidance. Many programmers believe that inheritance is difficult to
    control and that there are better ways to work. Interface inheritance, introduced
    in the previous chapter, is one such method – where a class inherits an interface
    which the programmer has to implement.'
  merge: -1
