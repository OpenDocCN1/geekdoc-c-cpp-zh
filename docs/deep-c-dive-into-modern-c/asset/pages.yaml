  md: '# What Can An Interface Do?


    In modern C# an interface can include definitions of:


    +   * Constants

    * Operators

    * Static constructors

    * Nested types

    * Static fields

    * Methods

    * Properties

    * Indexers

    * Events


    None of these member declarations typically contain a body being just a declaration
    ready to be implemented by the inheriting class. As already discussed, beginning
    with C# 8.0, an interface may declare a body as a default implementation although
    these are not inherited by the class and so don''t really complicate the overall
    picture.


    This is a long list of things that can be in an interface and the question of
    what is left out and why?


    The key idea is that an interface cannot contain anything that would determine
    the state of an instance. This comes down to not allowing instance fields, either
    directly or indirectly. As the documentation says, static fields are permitted
    but instance fields are not. As it also points out this seems a contradiction
    as properties are allowed, but if you look into a little further, even auto-implemented
    properties might look like if they are implemented, they aren''t. That is:


    ```

    public string Name {get; set};

    ```


    doesn''t implement a property complete with backing field - it is up to the class
    to implement it. It simply states that an inheriting class has to have a read/write
    Name property.


    What is the theoretical justification for not allowing instance entities? The
    answer is that an interface should only provide a definition of what entities
    the class should implement and not an implementation of those entities. Allowing
    instance variables would be breaking this idea by fixing the data types, and here
    representation, used. This seems to be a weak justification given the range of
    entities that can be represented and the introduction of default methods. A better
    reason is that it is better to use properties with get/set and backing variables
    than simple fields - which is of course what you should do if you need an interface
    with properties. Alternatively, you could use an abstract class if you can live
    with the limitations of single inheritance.


    Currently C# interfaces are at their best when used as as simply as possible.'
