  md: '# Chapter 11


    # Anonymous & Dynamic Typing


    Strong typing is a key idea in C#, but over time new features have been introduced
    to make the language as easy to use as other, less strongly-typed languages. As
    always, the way that C# has done this is to try to preserve type safety at all
    times. For example, dynamic typing in C# isn''t the same as in other languages
    and we need to look at it in some detail. But before we look at dynamic we need
    to take a look at a related feature with which it is often confused - anonymous
    typing.


    First, recall that in early C# you always had to determine the type of the result
    of an expression and use an appropriate type or supertype to store it and this
    determination had to be made compile time. That is, C# was a statically-typed
    language. Even now, the compiler always looks at an expression, determines the
    type of the expression and makes sure that this is compatible with the "assignment"
    variable. What has been relaxed is a variable to have a fixed and unvarying type.


    # Anonymous Typing


    The most type-free statement you could write in C# 2.0 and earlier was something
    like:


    ```

    object x = MyFunc();

    ```


    which worked no matter type MyFunc returned. However, you couldn''t do anything
    with the object unless you cast it to a more appropriate type. That is, in most
    object-oriented languages the topmost class in the hierarchy, usually called object,
    can be used as a reference to any subclass and in this sense it is a way to make
    the language less type-dependent.


    In C# 3.0 the anonymous type was introduced as an alternative to using object
    and the potential confusion began. An anonymous type is strongly and statically
    typed in that the compiler works out its type at compile time and then applies
    all the usual strong typing rules. The only complication is if the type implied
    by the code doesn''t actually exist as a named type the compiler will also generate
    a suitable name and type.'
