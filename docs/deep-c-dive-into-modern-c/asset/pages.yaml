  md: '# Expression Lambdas


    A statement lambda can have a mix of expressions and statements. However, there
    is a particularly simple form of the lambda that is very common in other languages,
    the "expression lambda" which has only a single expression as its body and simply
    returns the result of the expression:


    ```

    (parameters) => expression

    ```


    For example:


    ```

    x => x;

    ```


    is an expression lambda that takes x and squares it. Notice that if there is only
    one parameter parentheses are optional and you never need curly brackets. Expression
    lambdas are ideal for passing short chunks of code, Boolean conditionals for example,
    to other methods, which is what they were designed for.


    The one problem with expression lambdas is that they can look more complicated
    than they are by the inclusion of comparison operators. For example, the confusing
    looking:


    ```

    x => x <= 10;

    ```


    defines a lambda expression returns true if x is smaller than or equal to 10 and
    false otherwise, even though it looks like an expression for crushing x between
    itself and 10.


    Expression lambdas are used extensively in the framework classes where the standard
    delegate types often make this easier. For example, the Array type has a static
    Find method which accepts an array and a predicate and returns the first element
    that makes the predicate. For example:


    ```

    int i=Array.Find<int>(MyIntArray, x => x>0);

    ```


    returns the first element in MyIntArray that is positive.


    **In short, expression lambdas are ideal for passing simple functions into methods.**


    Since C# 6.0 can also be used to define a method, for example:


    ```

    public int square(int x) => x * x;

    ```


    You can use the same syntax to define a getter-only property:


    ```

    public int total => t1 + t2;

    ```


    When you use the total expression is evaluated to provide the value.


    Slightly more esoteric is the use of a lambda in an indexer:


    ```

    public MyClass this[int i] => myArray[i];

    ```'
