  md: "IEnumerable object - which is a more important observation than you might think.\
    \ To make use of the extension methods you need to add: using System.Linq.\n\n\
    To get started, let's look at the Where extension method. If you look at its definition\
    \ you will discover that it is:\n\n```\npublic static IEnumerable<T> Where<T>(this,\
    \ IEnumerable<T> source, Func<T, bool> predicate)\n```\n\nIgnore this for the\
    \ moment because it's part of every extension method. The parameter, source, is\
    \ an IEnumerable that will be \"scanned\" for all of the entities that return\
    \ true. The predicate is just a generic delegate that \"wraps\" a function that\
    \ accepts a single input parameter of the first specified type and returns a result\
    \ of the second specified type. In this case predicate can be seen as a single\
    \ parameter of type T and return a Boolean result. If we are going to use Where\
    \ the first thing we need is a suitable predicate. This can be created in many\
    \ ways, but to keep the explanation simple let's do it the old-fashioned, but\
    \ rather long-winding, and of first defining a suitable function and\n\nFirst\
    \ define the function:\n\n```\nbool MyTest(int i)\n{\n  return i > 250;\n}\n```\n\
    \nThis simply tests to see if the value is greater than 250 and returns true if\
    \ and false otherwise. To make use of this we have to first wrap it in a delegate:\n\
    \n```\nFunc<int, bool> MyDelegate = new Func<int, bool>(MyTest);\n```\n\nNext\
    \ we create the data collection as before:\n\n```\nTestCollection col = new TestCollection(5);\n\
    ```\n\nAnd finally use the Method with the delegate we have defined: IEnumerable<int>\
    \ q = col.Where<int>(MyDelegate);\n\nIf you try this nothing happens. This is\
    \ because LINQ queries are nearly always lazy-evaluated, that is the operation\
    \ of enumerating and extracting the entities smaller than 250 is only performed\
    \ when it is required.\n\nIn practice evaluation is triggered by calling the generic\
    \ GetEnumerator method, usually within a foreach loop."
