  md: "If you want to force it to work then use:\n\n```\nInt16 a;\nunchecked { a =\
    \ (Int16)0xFFFF; }\n```\n\nwhere the variable declaration has now to be separate\
    \ otherwise it would only\ndefined within the scope of the unchecked. To avoid\
    \ this, use unsigned\ntypes as in:\n\n```\nUInt16 a = 0xFFFF;\nUInt16 c = (UInt16)(a\
    \ << 16);\n```\n\nYou could argue that using unsigned types is the best way to\
    \ represent\npatterns, but it is necessary to perform bit manipulation on other\
    \ data\ntypes simply because this is the object of the exercise.\n\nYou can use\
    \ combinations of shifts and logical operators to create other types\nof shift\
    \ inclining bit rotates. For example, a rotate left is fairly easy to\ncreate:\n\
    \n```\nUInt16 RotateLeft(UInt16 data, int n) {\nInt16 mask;\nunchecked(mask=(Int16)0x8000);\n\
    mask = (Int16)mask >> (n-1));\nString s = mask.ToString(\"X\");\nUInt16 top =\
    \ (UInt16)(data & mask);\ntop = (UInt16)(top >> (16 - n));\ndata = (UInt16)(data\
    \ << n);\ndata = (UInt16)(data | top);\nreturn data;\n}\n```\n\nThis works by\
    \ creating a mask with the top n bits set to 1 by using\nanarithmetic shift. We\
    \ must use the mask to extract the top n bits which shift\nright to become the\
    \ bottom bits. Finally the shift left by n is performed and\nwhat were the top\
    \ n bits are stored in a more compressed form by combining\nexpressions, but the\
    \ important question of how efficient this is could only be\nswered by benchmarking\
    \ against alternative methods, such as performing a\nrepeated shift and high to\
    \ low transfer.\n\n# BitConverter\n\nOne of the most common reasons for having\
    \ to resort to bit manipulation is\n you have a raw stream of bytes and need to\
    \ turn them into structured\ndata. The logical operations don't work for non-integral\
    \ types, this is\nsome of a problem if you want to convert bytes into floats,\
    \ say. It is even\not particularly easy to convert bytes into integral types.\
    \ That is, the problem\ny that most often have to solve is that you have a stream\
    \ of bytes and\ngroups of bytes represent either floating point or integer values\
    \ and you need\nto convert the stream into those."
