- img_proc: true
  md: 'Generic constraints are the great hope for turning generics into something
    really useful. In practice, they often fail to make things simple, or even possible,
    because of the nature of the inheritance hierarchy. In many ways generic constraints
    are just another way of using a base type to process derived types and they suffer
    from all the same problems.


    All of the constraints are generally "upper bounds" on the inheritance hierarchy,
    but some are more specific. You can follow the type parameter with a where type
    specifier:


    ```

    <T> where T: constraint list

    ```


    If there are multiple type parameters then use one per parameter: <T,U> where
    T: constraint list where U: constraint list The constraint can be any of:


    | Type | Has to be |

    |---|--|

    | struct | a non-nullable value type |

    | class | a reference type |

    | notnull | non-nullable |

    | unmanaged | an unmanaged type-free |

    | new() | a parameter constructor |

    | baseclass | baseclass or a derived type |

    | interface | the interface itself or an implementation of it |

    | U | another type parameter, or a derived type |


    You can apply multiple constraints by using a comma separated list.


    It is worth pointing out that adding a constraint has two purposes. The first
    is that the compiler will generate an error message if you use a type that doesn''t
    satisfy the constraint. The second is that you can use the methods of the type
    implied by the constraint within the generic code.


    The most commonly used constraint is the name of a base class. In this case the
    type parameter has to be either the specified base class or a class derived from
    it. This allows the compiler to infer that an object described can have any of
    the methods of the base class and so these can be used in the generic.'
  merge: -1
