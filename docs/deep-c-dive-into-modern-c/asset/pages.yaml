    \ doesn't have to inherit any implementation details from\nyInterface. That is,\
    \ if you try to create a MyClass object without doing\nanything about IInterface:\n\
    \n```\nMyClassObject = new MyClass();\n```\n\nyou will see a compile-time error.\n\
