  md: '# Postlude


    Inheritance is simple when you restrict it to code reuse. Unless, that is, you
    allow overriding existing methods as well as adding new methods. If you allow
    overriding then you have to make a choice about which version of the method is
    called – early or late binding. This is a complication that can be difficult to
    understand and even more difficult to keep under control. This complication is
    entirely due to enforcing strong typing. In a language that doesn''t assign a
    type to variables, only to objects, typing, then the only possibility is late
    binding.


    Today inheritance is only partly about code reuse and abstract classes can be
    used to ensure that derived classes have a particular set of methods. This allows
    us to implement, rather than inherit the implementations of, those methods.'
