  md: 'Using multiple threads properly is a very difficult and subtle task and not
    to be undertaken lightly. So while it is good that .NET facilitates their use,
    it should not be taken as an encouragement to proliferate threads without some
    careful thought. Here we explore how multi-threading works and more importantly,
    how it can go very wrong. In particular, we take a look at some of the more obscure
    ways in which threading can become part of your program via Invoke and the background
    worker class, but first some


    # # Starting A Thread


    There is more than one way that you can enter the world of multi-threaded programs.
    Some of them are so simple that you might not even notice the transition. For
    example, when you employ an asynchronous call using BeginInvoke you separate a
    thread to run the method without having to do anything else. However, no matter
    how you create a new thread, the same considerations apply.


    There are two ways of explicitly using a thread in your program. The first is
    to use one of the existing threads in the thread pool. This has the advantage
    that you don''t have the overhead of actually creating a new thread, but the number
    of threads available for use in the thread pool is limited. In general, you should
    only use a thread-pool thread for tasks that are short and release the thread
    back to the pool as soon as possible. The same concerns apply to using a thread-pool
    thread as one you create yourself.


    As long as the task that you want the thread to do is sufficiently long-lived
    then you do not need to use the Thread class in System.Threading.


    ```

    The Thread constructor accepts either a ThreadStart or a ParameterizedThreadStart
    delegate which wraps the method that will be executed by the new thread. For example,
    suppose we have a method like:

    public void Count(

    for (int i = 0; i < 9999; i++) MessageBox.Show("Thread " + i.ToString());

    }

    ```


    then this can be run as a new thread using:

    Thread Ti=new Thread(new ThreadStart(Count));


    This creates the new thread object but doesn''t actually start the thread running.
    To do this we have to use the Thread method:

    T1.Start();'
