- img_proc: true
  md: 'Notice that the this keyword can nearly always be used to make clear that the
    version of something to be used is the class''s own version and base can be used
    to indicate that the, possibly hidden, base class''s version should be used. In
    most cases you don''t have to use this and base because the compiler can work
    out what you mean, but it is a good idea to be explicit whenever clarity warrants
    it.


    # Changing Types - Casting


    As we already know, inheritance results in a type hierarchy of base classes and
    derived classes. We also know, see Chapter 2, that it is assumed that any derived
    class can stand for its base classes, i.e. the classes it inherits. This is such
    an established idea that we don''t think twice about the way that a variable can
    be used to reference any object of its type or derived from its type. So, in:


    ```

    Class MyClassA{};

    Class MyB:MyClassA{};

    ```


    MyB inherits from MyClassA. Following with:


    ```

    MyClassA MyA;

    MyClassB MyB;

    MyA = new MyClassB();

    ```


    you can see that you can use a reference to a base class to reference a derived
    class without any change in syntax.


    This is called downcasting because the variable is supposed to reference a class
    higher up in the hierarchy but it actually references an object lower in the hierarchy.


    It is also true that a variable of a derived type can reference a base type, but
    in this case we do need some extra syntax. For example:


    ```

    MyB = (MyClassB) MyA;

    ```


    In this case we need an explicit typecast expression, or just cast, to indicate
    the conversion, i.e. (MyClassB). Typecasts are simply types in front of a variable
    and they have the effect of changing the type of the object for the duration of
    the expression.


    This is usually upcasting because the variable is supposed to reference a class
    lower in the hierarchy than the object being assigned to it.'
