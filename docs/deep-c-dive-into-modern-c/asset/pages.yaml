  md: '# Nullable Value Types


    Value types, by their very nature, aren''t nullable. However, this raises the
    question of how to test for an exceptional value that indicates that the variable
    doesn''t hold a legal value. In many cases you can use a default value, or some
    value that shouldn''t occur as a signal that a value type doesn''t currently have
    a valid value. For example:


    ```

    int count = -1;

    ```


    can be used to indicate that count doesn''t hold a valid value. Such values are
    called "flags" or "sentinels" and finding a value that can work is often difficult.
    For example, if count was a temperature reading then -1 could well occur. C# lets
    define nullable value types to provide an indication of something exceptional
    needing to use a value of the type. The way that works conceptually is that the
    value is extended to a struct that has a field used to indicate null. This means
    nullable value types are not quite as efficient non-nullable value types.


    The syntax for nullable value types is the same as the new syntax for nullable
    reference types – you put ? after the type. For example:


    ```

    int? a;

    ```


    is a nullable int and you can assign null to it:


    ```

    a = null;

    ```


    and you can test that it is null using:


    ```

    if(a == null){ . . . }

    ```


    Nullable value types also work with the non coalescing operators ?? and =?. You
    can assign a nullable type to a non-nullable but if the nullable is null an exception
    occurs. Operators produce null if any null except for the comparison operators
    which produce false unless they are null.


    We also have two methods that make working with nullable value types easier. HasValue
    is true if the nullable type is not null i.e. if it has a value. The value of
    the type it is if it is not null and throws an exception otherwise. However rather
    than:


    ```

    b = 0;

    if(a.HasValue)b = a.Value;

    ```


    it is probably better to write:


    ```

    b = a?? 0

    ```'
