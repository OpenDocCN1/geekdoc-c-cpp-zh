  md: '# Greedy and Lazy Quantifiers


    We now have the problem that it isn''t unreasonable for an ISBN to be written
    as ISBN:9 or ISBN: 9 with perhaps even more than one space after the colon. We
    clearly need a way to specify the number of repeats that are allowed in a matching
    string. To do this we make use of "quantifiers" following the specification to
    be repeated. The commonly used quantifiers are:


    +   * zero or more

    * one or more

    * zero or one

    * {n} exactly n times

    * {n,} n or more times

    * {n,m} at least n at most m


    In many ways this is the point at which regular expression starts to become interesting
    and inevitably more complicated. You could even say that the use of * and + is
    what makes a regular expression into a regular grammar in the wider technical
    sense. Simple examples not hard to find. For example: @ISBN:\s*d


    matches ISBN: followed by any number of white-space characters none at all followed
    by a digit. Similarly,

    @ISBN?\s*d


    Quantifiers are away by an optional colon, any number of white-space characters
    including none, followed by a digit. But here there is a subtlety that often goes
    unnoticed. By default, quantifiers are "greedy", that they match as many entities
    as they can, even when the regular expression provides a better match a little
    before. To illustrate this by the simplest example, suppose you need a regular
    expression to parse some HTML tags:


    ```

    <div>hello</div>

    ```


    If you want to match a pair of opening and closing tags you might well try the
    following regular expression:

    which seems to say "the string starts with <div> then any number including zero
    of other characters followed by </div>". If you try this on the example above
    you will find that it matches:


    ```

    Regex ex2 = new Regex(""

    ```


    ```

    MessageBox.Show(ex2.Match("<div>hello</div>").ToString());

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'However, if you try it out against the string:

    <div>hello</div><div>world</div>

    as as in:


    ```

    MessageBox.Show(ex2.Match("<div>hello</div><div>world</div>").ToString());"

    ```


    you will discover that the match is to the entire string.

    That is, the final </div> in the regular expression matched to the final

    </div> in the string, even though there is an earlier occurrence of the same substring.
    This is because the quantifiers are greedy and attempt to find the longest possible
    match. So why in this case * matches everything including the first <div>? Why
    doesn''t it match the final </div>? Because if it did the regular expression would
    fail to match anything because there would be no closing </div>. What happens
    if the quantifiers continue to match until the regular expression fails, then
    the regular engine backtracks in an effort to find a match. Notice that all of
    the standard quantifiers are greedy and will match more than you might expect
    based on what follows in the regular expression.


    If you don''t want greedy quantifiers the solution is to use "lazy" quantifiers
    which are formed by following the standard quantifiers by a question mark. To
    see this in action, change the previous regular expression to read:

    Regex ex2 = new Regex("<div>.*??</div>");


    With this change in place the result of matching to:

    <div>hello</div><div></div>


    is just the first pair of <div> brackets, that is <div>hello</div></div>. Notice
    that all of the quantifiers, including 7?, have a lazy version and you can write
    ?? to mean a lazy "zero or one" occurrence.


    The distinction between greedy and lazy quantifiers is perhaps the biggest reason
    for a reasonably well-tested regular expression to go wrong when used against
    a wider range of example strings. Always remember that a standard greedy quantifier
    will match as many times as possible while still allowing the regular expression
    to match, and its lazy version will match as few as possible times to make the
    regular expression match.'
  merge: -1
