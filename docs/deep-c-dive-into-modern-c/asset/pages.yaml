    \nYou can assign the default value to any type using:\ndefault(type);\n\nor, where\
    \ the compiler can work out the type, just:\ndefault;\n\nThe default operator\
    \ or literal is very useful when used with generics, see Chapter 9. For a simple\
    \ value the default is produced by the default constructor and this is the value\
    \ produced by a bit pattern of all zeros, in other words, zero cast to the appropriate\
    \ type. For a reference type the default is the value null which means that the\
    \ variable isn’t referencing any object.\n\nSometimes variables are automatically\
    \ initialized to their default value and sometimes they aren't. The rules for\
    \ automatic initialization of variables seem strange at first. Any local variable\
    \ in a method is not automatically initialized and if you try and use it you will\
    \ see a compiler error telling you that you are trying to use an uninitialized\
    \ variable. However, if the variable is a property of a class then it is initialized,\
    \ as are the elements of an array. So if you write:\n\n```\nint i;\nConsole.WriteLine(i);\n\
    ```\n\nin a method then you will see a compile-time error message, but if you\
    \ write:\nclass MyClassA {\n    int i;\n    public void的是(T x)\n        Console.WriteLine(i);\n\
    }\n\neverything works as the variable is automatically initialized. The difference\
    \ comes down to:\n\nvariables allocated on the heap are initialized and variables\
    \ allocated on the stack aren’t."
