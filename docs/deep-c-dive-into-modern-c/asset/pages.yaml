    \ += s + Environment.NewLine;\n    }\n}\n```\n\nThe for loop of each thread now\
    \ just calls addtext2 without worrying about invoke or the UI thread:\naddtext2(i.ToString());\n\
    \nThat is, the new addtext2 method works out if it should have been invoked rather\
    \ than called and, if it needs to be invoked, wraps itself as a delegate and uses\
    \ invoke to run on itself on the UI thread.\n\nIf you want to give the UI thread\
    \ time to process events then it's a good idea to add:\nApplication.DoEvents();nafter\
    \ updating the text box, but only if you are working with Windows Forms because\
    \ WPF uses a very different dispatch system and doesn't support anything like\
    \ a DoEvents method.\n\n# Asynchronous calls\n\nThe BeginInvoke/EndInvoke methods\
    \ of running a delegate on the thread that created the control are also available\
    \ to run any delegate on a thread from the thread pool.\n\nAll you have to do\
    \ is wrap the method in a delegate and use the delegate class's implementation\
    \ of BeginInvoke/EndInvoke."
