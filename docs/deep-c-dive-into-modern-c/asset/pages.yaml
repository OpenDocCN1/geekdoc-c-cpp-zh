  md: "So, apart from the use of virtual methods, see later, all binding in C# is\
    \ early binding and only the declared type of a variable can influence what a\
    \ program does. As we will see, dynamic typing promotes the determination of type\
    \ to something that can determine what happens at run time beyond the use of virtual.\n\
    \n# Type and Flow of Control - Polymorphism\n\nThe second big use of type to determine\
    \ the flow of control is polymorphism. The basic idea is that every class defines\
    \ methods that work with that class, even if they share the same name with other\
    \ classes.\n\nFor example, suppose we had a non-object-oriented sort function.\
    \ Then we would in practice a number of such functions for each type that we wanted\
    \ to sort, SortInt, SortDouble, SortMyClass and so on. Each function would accept\
    \ a list of items of the appropriate type. If you wanted to sort a list of integers\
    \ you would have to write:\n\n```\nSortInt(IntList);\n```\n\nThe main motivation\
    \ for introducing objects is to associate operations with the data that they operate\
    \ on. In an object-oriented world there would be just one sort function but it\
    \ would be defined as part of the class that it sorted instances of.\n\nFor example:\n\
    \n```\nclass ListOfMyClass{\n    MyClass[] sort() { ... sort algorithm ...};\n\
    }\n```\n\nNow you can write:\n\n```\nListOfMyClass list = definition of a list\
    \ of MyClass instances\nlist.sort();\n```\n\nIt looks as though we got rid of\
    \ parameters, but of course we haven't as list is passed to the sort method as\
    \ the default parameter. This is how objects work – the instance, the receiver,\
    \ is passed to methods as a default parameter and:\n\n```\nlist.sort();\n```\n\
    \nis best thought of as:\n\n```\nsort(list);\n```\n\nYou can say that this is\
    \ all there is to objects...\n\nThis simple change means that objects use the\
    \ method, i.e. function, that is appropriate to their type – obvious but this\
    \ is generally called polymorphism and it is often said to be one of the pillars\
    \ of object-oriented programming."
  merge: -1
