    # Postlude


    Threads are the key to keeping an application''s UI responsive and they are also
    the way to make servers able to deal with multiple clients at the same time. They
    are important but difficult to get right. You can use raw threads in C#, but task
    objects are so much easier and safer. Even so you have to be on the lookout for
