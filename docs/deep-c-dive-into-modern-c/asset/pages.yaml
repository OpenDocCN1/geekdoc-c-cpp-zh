  md: "There are a range of different forms of pattern that can be used, but the two\
    \ that are most relevant to type safety are the type and declaration patterns.\
    \ The type pattern is seemingly simple - specify a type that the run time type\
    \ of the expression has to match. For example:\n\n```\nobject myObject = new ClassA();\n\
    int myResult=myObject switch\n{\n    ClassB => 1,\n    ClassA => 2,\n    int =>\
    \ 3\n}\n```\n\nIn this case the result is 2 as myObject is a ClassA. This looks\
    \ simple, but there are a number of things to be aware of. The first is if ClassB\
    \ is derived from ClassA then you cannot test it for ClassA first. That is:\n\n\
    ```\nClassA => 1,\nClassB => 2,\n```\n\nwill give a compile error. The reason\
    \ is that testing for ClassA matches all derived classes and testing for ClassB\
    \ after it can never work. The second thing to note is that myObject is of type\
    \ object to allow it to be all types tested. The compiler will use strong typing\
    \ to match conditions that could never happen.\n\n```\nClassA myObject = new ClassA();\n\
    int myResult = myObject switch\n{\n    ClassB => 1,\n    ClassA => 2,\n    int\
    \ => 3\n}\n```\n\nConsole.WriteLine(myResult);\ngives a compile time error because\
    \ you cannot set myObject to be an int. Thus pattern matching is implemented in\
    \ a type-safe way.\n\nWhat if you want to call methodName on ClassA and ClassB?\
    \ You can't this without casting (Chapter 8), for example:\n\n```\nint myResult=myObject\
    \ switch\n{\n    ClassB =>=((ClassB)myObject).method(),\n    ClassA => ((ClassA)myObject).method(),\n\
    \    int => 3\n}\n```\n\nThis \"find a type - use a type\" action is so common\
    \ that there is a pattern that implements it directly – the declaration pattern.\
    \ This allows you to declare a new variable for the expression to be cast to,\
    \ for example:"
