- img_proc: true
  md: 'For example:


    ```

    XAttribute Attl = new XAttribute("Epoch",1900);

    root.Add(Attl);

    ```


    adds an Attribute Epoch "1900" to the Attributes collection. The XML

    generated reads:

    <Record Epoch = "1900"> ...<Record>


    You can achieve the same result using the function method of constructing

    XML tree:


    ```

    XElement root = new XElement("Record",

    new XAttribute("Epoch", 1900),

    new XElement("Name",

    new XElement("First", "Mike",

    new XElement("Second"),

    new XElement("Address"));

    ```


    # # The Constructor Rules


    What the constructor or the Add method does with an object you supply to it

    dep on the object''s type. The rules are:


    +   - if''s null, nothing happens

    - if''s descended from XNode then it is added to the Nodes collection

    - if it''s an Attribute then it is added to the Attributes collection

    - if it''s a string then it is converted to XText and added to Nodes


    Less obvious behavior is that if you supply an object that implements

    IEnumerable then it is enumerated and the resulting objects are treated

    according to the rules, and if Add is anything that can''t be handled

    by the rules it is converted to a String and to an XText object and added

    to Nodes. IIEnumerable behavior is very handy because it means you can

    add a collection of objects in one step.


    # # Manipulating The Tree


    Constructing a tree is usually just the beginning of the problem. You usually\want
    to process, i.e. examine and change, the tree as a result. As an XElement

    tree is dynamic this is fairly easy. You can of course Add to add additional\lements
    of any kind and there are also remove methods – RemoveNode

    and RemoveAttribute. These simply remove the object that they belong to

    the parent''s collection. For example:


    ```

    root.Add(child4);

    child4.Remove();

    ```


    This adds child4 to the node collection of root and then removes it.'
