  md: "from the global heap. After this everything is achieved using memory transfer\
    \ functions such as StructToPtr or Copy, for example:\npublic static byte[] RawSerialize(object\
    \ anything)\n\n```\n{\n    int rawsize = Marshal.SizeOf(anything);\n    IntPtr\
    \ buffer = Marshal.AllocHGlobal(rawsize);\n    Marshal.StructureToPtr(anything,buffer,\
    \ false);\n    byte[] rawdata = new byte[rawsize];\nMarshal.Copy(buffer, rawdata,\
    \ 0, rawsize);\n    Marshal.FreeHGlobal(buffer);\n    return rawdata;\n}\n```\n\
    \nIn fact, there is no need to do so much moving as it is fairly easy to move\
    \ the bytes in the struct directly to the byte array without the need for an intermediate\
    \ buffer.\n\nThe key to this generally useful technique is the GCHandle object.\
    \ This will return a garbage collection handle to any managed data type. If you\
    \ ask for a \"pinned\" handle then the handle's AddOfPinnedObject method to retrieve\
    \ its starting address. You can ensure the object is not moved by the garbage\
    \ collector and For example the RawSerialize method can be rewritten:\npublic\
    \ static byte[] RawSerialize(object anything)\n\n```\n{\n    int rawsize = Marshal.SizeOf(anything);\n\
    \    byte[] rawdata = new byte[rawsize];\n    GCHandle handle = GCHandle.Alloc(rawdata,GCHandleType.Pinned);\n\
    \    Marshal.StructureToPtr(anything,\n        handle.AddrOfPinnedObject(),\n\
