    # Invoke


    The mechanism embodied in Invoke is a fairly general way of transferring calls
    to methods from one thread to another. There are two versions, one for a delegate
    with no parameters, Invoke(delegate), and another for parameters packed into an
    object array, Invoke(delegate,object[]) where delegate can return an object which
    packages a return value if the delegate has one or null otherwise. The delegate
    is placed on the UI thread''s dispatcher''s queue and is processed along with
    other events that might have occurred. The best way to think about this is to
    imagine that the delegate is an event handler that is invoked on the UI thread
    when its turn comes around. Also notice that Invoke is a thread-safe method that
    every control has just for its purpose.


    Basically the idea is that the T1 and T2 threads in our example ask the UI thread
    to run a method which achieves the desired result using Invoke. To do this we
    first need a new delegate:


    ```

    delegate void Delegate_addtext(string s);

    ```


    There are a number of ways of creating the delegate instance and using anonymous
    methods is one way:


    ```

    public void CountUp()

    {

    Delegate_addtext addtext = delegate(string s)

    {

    TextBox1.Text+= s+Environment.NewLine;

    for (int i = 0; i < 99; i++)addtext(i.ToString());

    }

    ```'
