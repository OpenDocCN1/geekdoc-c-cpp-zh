  md: 'Notice casting only works in this way for numeric data. A beginner might suspect
    if:


    MyInt = (int)MyLong;

    works then so should:


    String=(string)MyInt;

    but course it doesn''t. something we could argue for a long time. If you are going
    to use casting to perform a change of representation for numeric values, why not
    for strings and other data-based objects? Instead, for most active type conversions,
    you have to use a method:

    string String=MyInt.ToString();


