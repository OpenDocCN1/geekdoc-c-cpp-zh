    \nYou have to be careful about using the pointer to the struct and not the pointer\
    \ to the pointer:\n\nFinally we can free all of the unmanaged memory we used:\n\
    Marshal.FreeHGlobal(lstruct);\nMarshal.FreeHGlobal(lstruct);\nMarshal.FreeHGlobal(lphandle);\n\
    \nAll this might seem complicated. Using pointers-to-pointers is never an easy\
    \ thing to do and it is one of the reasons that C# makes sure that when you use\
    \ pointers you mark the code as unsafe. However, you might like to contemplate\
    \ how safe sort of juggling is - and all without an unsafe block in sight. On\
    \ the other hand the general principles are very simple. When you pass anything\
    \ by ref to an API it has to be copied to unmanaged memory and the address of\
    \ this memory is passed to the function. Normally default marshaling takes care\
    \ of this and you can ignore it, but it still happens. If you need to go beyond\
    \ what is provided by the marshaling attributes then you have to perform this\
    \ copying explicitly.\n\n# Postlude\n\nThe layout of data in memory is something\
    \ you can generally ignore unless you need to interface with the outside world.\
    \ Mostly thing go simply, but what is easy or natural in languages such as C and\
    \ C++ is regarded as undesirable at best and often unsafe at worst. With some\
    \ general techniques of working with memory and pointers, however, you can interface\
    \ to almost anything."
