- img_proc: true
  md: "Of course, there are a few slightly hidden details in these examples which\
    \ are obvious to experts, but often confuse the beginner. The first is that the\
    \ method being wrapped is still a method belonging to some object and not a \"\
    disembodied\" function. When the delegate is used to wrap the method method has\
    \ to be accessible from wherever the delegate is being declared. In the example\
    \ above there is the implicit assumption that all of the code is defined within\
    \ the same class.\n\nA more elaborate and complete example would create the hello\
    \ method within a new class:\n\n```\npublic class Greetings {\n    public int\
    \ hello(int param) {\n        MessageBox.Show(\"Hello delegate World\"+ param.ToString());\n\
    \        return (++param);\n    }\n}\n```\n\nand then within the class that wants\
    \ to make use of the method you can use of the delegate type to wrap the method\
    \ instance:\n\n```\ndelegate int HelloType(int param);\nprivate void button1_Click(object\
    \ sender, EventArgs e) {\n    Greetings g = new Greetings();\n    HelloType HelloInst\
    \ = new HelloType(g.hello);\n    int i = HelloInst(2);\n}\n```\n\nAnother subtle\
    \ point is that Invoke will run the same thread to the delegate and in this case\
    \ you need to be aware of any potential \"cross-threading\" problems that might\
    \ arise. This also means that the invocation is synchronous and the calling code\
    \ will wait until the delegate returns. You can invoke the delegate asynchronously\
    \ using a thread from a thread pool BeginInvoke or you could create a thread manually\
    \ to run the delegate.\n\nTo summarize:\nto wrap a method belonging to an instance\
    \ of a class you have to first define a new delegate type with a specific signature\
    \ and return type, then you wrap the method in an instance of the delegate type."
