    \ build an expression tree that corresponds to a multiline method in this way.\
    \ That is, you can only automatically convert a single line expression lambda\
    \ to an expression tree, but you can build more complex expression trees using\
    \ the Expression static methods.\n\n# Closure?\n\nYou will often hear JavaScript\
    \ and functional programmers talking about “closure” and now you can join in because\
    \ C# also has “closure” in the form of the variable capture that anonymous methods\
    \ and lambdas use. Consider the following code:\n\n```\nint i = 0;\nMyHelloDelegateType1\
    \ Hello2 = () =>\n{\n    i++;\n    MessageBox.Show(i.ToString());\n};\nHello2();\n\
    Hello2();\nHello2();\nMessageBox.Show(i.ToString());\n```\n\nThere is nothing\
    \ really surprising here - the lambda has access to all of the variables that\
    \ are in scope when it was defined. So every time you call Hello2, the local variable\
    \ i is incremented. What is surprising is that this works even if the local variable\
    \ has gone out of scope and destroyed as far as the rest of the program is concerned.\
    \ When you declare a lambda, or an anonymous method, a bond is created between\
    \ it and all of the variables that are in scope when is is defined and this bond\
    \ continues beyond the lifetime of the variables.\n\nUsually the way that a function\
    \ outlives the variables it was defined alongside is that it is referenced by\
    \ a longer-lived variable or returned as the result of a method."
