  md: 'An interface is like abstract class but it doesn''t fit into the usual class
    and type hierarchy. The intended use of an interface is to ensure that all classes
    inherit from it have the methods that it declares. If a class doesn''t implement
    all of the interface methods exactly then the class doesn''t compile. You can
    think of it as a template for a class and its use is to ensure that classes present
    a uniform and enforced set of methods that can be used with confidence by other
    objects. Used in this way it is a central part of most modern programming methodologies.


    The interface is a promise that the class has a set of methods and hence it is
    about type safety and not code reuse.


    # Multiple Inheritance


    One big difference, and the important difference, between class and Interface
    inheritance is that interfaces support multiple inheritance.


    You can make a class implement two interface specifications using: public class
    MyClass:IMyInterface1,IMyInterface2


    This looks like multiple inheritance. However, as nothing but the method definitions
    are inherited, it''s nearly so dangerous or, of course, as useful. Some other
    factors worth knowing about interfaces are that a struct can inherit an Interface
    and an Interface can inherit from other interfaces. Of course, an Interface that
    inherits from another set of interfaces doesn''t have to implement anything and
    it simply serves to extend or add to the base interfaces. When an interface is
    inherited you have implement all of the methods defined in all of the interfaces.


    So why is "dangerous" to inherit multiple classes, is it safer to inherit multiple
    interfaces? The problem with inheriting from more than one class is that you run
    the risk of inheriting a method and its implementation more once, the so-called
    "diamond problem". To be exact, the problem is whether there are multiple inherited
    implementations or a method which is used when the method is called on the derived
    class. Different languages solve the problem in different ways, but essentially
    you can insist that the users implement any defined methods or you need some rule
    that selects which method is used. C# solves the problem by not allowing multiple
    class inheritance, only multiple inheritance. In this case all that is inherited
    the definition so you have to implement it and implementing it means that there
    is no conflict. This form of interface inheritance is the same as having class
    multiple inheritance, but insists that any method clash is resolved by implementing
    the method.


    This account is only correct if interfaces don''t provide their own implementation
    and in modern C# they can. This is a topic we need to return to, but first we
    need to look at how interfaces are used as types.'
