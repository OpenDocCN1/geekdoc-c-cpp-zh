  md: 'For example, you can combine the two Add methods into a single call:

    child1.Add(child2,child3);


    The reason this works is due to an overload of Add not mentioned in the

    documentation:


    ```

    public void Add(params object[] content);

    ```


    You can, of course, construct a list of child objects to insert into multiple

    in of XElement you want to.


    Another style of XML tree construction is based on the use of the XElement

    constructor. One overloaded version allows you to specify the contents of an

    XElement. To create an XElement with two children you would use:


    ```

    XElement root = new XElement("Record",

    new XElement("Name",

    new XElement("Address"));

    ```


    You can continue this nested construction for any level you require. For

    example, the following creates the same XML tree we had earlier:


    ```

    XElement root = new XElement("Record",

    new XElement("Name",

    new XElement("First",

    new XElement("Second"),

    new XElement("Address"));

    ```


    This is generally referred to as "functional construction" and if you format it

    correctly then it looks like it is constructing and it has the advantage

    at you can pass it directly to any method that makes use of it. Of

    c, this style of construction you don''t get variables to keep track of

    each node, but in most cases you don''t need them.


    # Converting XML To XElement Trees


    There are two additional easy ways of converting XML into an XElement

    the static Load and Parse methods. Load will take a file specification as a

    URI or as a XmlReader and parse the stream into an

    XElement tree. The Parse method does the same, but by accepting a string of

    XML tags. For example, to construct the XML tree given earlier:


    ```

    string xml = ""

    <Name>

    <First />

    <Second />

    </Name>

    <Address />

    </Record>";

    XElement root= XElement.Parse(XML);

    ```'
