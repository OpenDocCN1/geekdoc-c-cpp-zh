  md: '# Chapter 4


    # Structs & Classes


    Most languages have something like the C# struct – they may call it something
    different, often a “record”, but the idea is the same. A struct is a collection
    of different data types with each data type beginning identified as a “field”
    – similar to a name and address card or record. C# has structs that play a deeper
    role in the language being more classes than the simple data structures they are
    in other languages.


    # Structs Are Value Types


    Although value types are often introduced as “simple” types such as int or float,
    all value types are really just examples of struct which is generally thought
    of as a more complicated type with multiple values as fields.


    The simple value types are structs, but they are also treated differently to avoid
    the overheads a genuine string brings with it to make sure that your program runs
    efficiently. The fact that an int is a struct really only has an impact on your
    programs because means that int inherits a set of simple standard methods from
    object. For example, it is perfectly OK to write:


    ```

    int a;

    string b = a.ToString();

    ```


    In fact, int is an alias for the System.Int32 struct and you could write:

    System.Int32 a;


    in place of ait, but it is not to. We will return to the issue of simple data
    types as objects later in this chapter because there is a little more to it.


    It is reasonable to say that the most important division in the C# type system
    is the split into classes and structs (both descended from object). And the really
    big difference between the two is that class is a reference type whereas struct
    is a value type.'
