  md: 'You can call Find to test for equality (of reference) between any two objects
    of any almost any type. The "almost" is necessary because there is a problem with
    value types not being automatically boxed to objects, see the previous chapter.
    If you keep away from simple value types then the function works as written.


    For example:


    ```

    MyClassA myA1 = new MyClassA();

    MyClassA myA2 = new MyClassA();

    MyClassA myA3 = new MyClassA();

    ```


    ```

    MyClassA[] classes = {myA1, myA2, myA3};

    ```


    ```

    Boolean result = Find<MyClassA>(classes, new MyClassA());

    Console.WriteLine(result);

    ```


    prints false. Notice that the equals method tests for equality of value but equality
    of reference. That is, our function tests to see if the element of the array represents
    the same object. This is not the test of equality you might want when comparing
    objects, but it is all that is possible if you restrict your attention to object.


    Notice that the actual type passed to the function has redefined the equals method
    to be more appropriate to the type, it will only be called if the method is virtual
    and the derived classes override.


    As explained in the previous chapter, if you have a base type that has all of
    the properties you need to use then you can write a function that accepts the
    base class and use casting to make the function accept any derived type. The problem
    here is working out what the actual type of something passed as an object really
    is. The limited range of methods available for the top of the type hierarchy,
    and the difficulty of determining the actual type are also problems that will
    encounter with generics and not just casting.


    Generics is a purpose-built solution for writing general algorithms that work
    on a range of types in a type-safe way. However, it is worth pointing out that
    generics doesn''t offer much more than working with variables reference object
    and often imposes restrictions which have to be overcome to implement what you
    want. It is not the perfect solution to implementing type-free algorithms.'
  merge: -1
