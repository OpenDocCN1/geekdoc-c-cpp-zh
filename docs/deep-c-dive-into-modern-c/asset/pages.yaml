- img_proc: true
  md: "The point constructor has to create a delegate, in this case called doInvoke,\
    \ that it can run on its thread to get the method that is being invoked run on\
    \ thread T:\n\n```\npublic Point()\n{\n    ThreadStart.WaitInvoke = delegate ()\n\
    \    {\n        do {\n            autoEvent.WaitOne();\n            d.DynamicInvoke(null);\n\
    \        } while (true);\n    };\n```\n\nNotice that doInvoke is designed to be\
    \ run on thread T and not the current thread. What happens in the doInvoke is\
    \ that the thread is immediately suspended, waiting to woken up by another thread\
    \ setting the AutoResetEvent object. That is, the thread that is going to be used\
    \ to Invoke the method is suspended to wait for a method to run. When this happens\
    \ we assume that there is a delegate stored in _d ready to be invoked. We have\
    \ to use DynamicInvoke because we have no idea what the form of the delegate actually\
    \ is and hence it has to be bound. The DynamicInvoke method simply runs the delegate\
    \ on the current thread, i.e. it is like a dynamic call to the method that the\
    \ delegate wraps. The rest of the constructor creates the AutoResetEvent in an\
    \ unset state and then creates and starts the thread T, giving it the doInvoke\
    \ delegate to run:\n\n```\nautoEvent = new AutoResetEvent(false);\nT = new Thread(doInvoke);\n\
    T.Start();\n```\n\nYou can now see how this is all going to work, but how it fits\
    \ together is intricate. We start a new thread running our doInvoke which simply\
    \ waits for the AutoResetEvent to be set before running the delegate in _d. The\
    \ doInvoke delegate only ever runs on thread T and most of the time it is suspended\
    \ and waiting to be woken up. When it is woken up it runs whatever delegate it\
    \ finds in _d and then goes back to sleep again."
