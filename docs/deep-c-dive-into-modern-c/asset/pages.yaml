  md: '# Syntactic Sugar


    So far the LINQ query example given above doesn''t look a great deal like any
    other LINQ example you will find in the documentation and the reason is that it
    doesn''t use any of the syntactic sugar introduced to make LINQ look more like
    SQL and to make it generally easier to use. Now the time has come to add such
    touches and package it all.


    The first simplification is that we can use a lambda expression to create the
    predicate method. This makes it possible to do away with the separate function
    and write something that looks like a condition as a parameter to most of the
    extension methods. If you recall from Chapter 14, a lambda expression is a function
    without a name that returns a single value and can be assigned directly to a delegate.


    ```

    Func<int, bool> bool = i => i > 250;

    ```


    creates a delegate that can be used in the call to Where as in the previous example.
    However, where the method has a parameter of type Func(int, bool), we can do the
    job directly without the need to create an explicit delegate:


    ```

    IEnumerable<int> q = col.Where(i => i > 250);

    ```


    With this simple query the query is beginning to look a lot more like SQL. We
    can also get one better. It is up to .NET language to choose to provide a linguistic
    wrapper for the LINQ system and they can do however they like. In practice, there
    is a lot of sense in using something close to a dialect of SQL. C# and both wrap
    LINQ with SQL-like instructions. For example, our simple query can be written:


    ```

    IEnumerable<int> q = from i in col where i > 250 select i;

    ```


    This is compiled to the same set of method given earlier and is completely equivalent.


    You can even make it slightly simpler by allowing the compiler to work out the
    type of q from the return result of the methods, i.e. use an anonymous type:


    ```

    var q = from i in col where i > 250 select i;

    ```


    Now you can see why these features were introduced to C#.


    In general, a LINQ query always starts with:

    from variable in Enumerable object


    This specifies the object to be used in the query and the parameter to be passed
    to all of the methods, "range" variable. Then there''s a choice of possible clauses
    which correspond to each of the extension methods and, when used, cause them to
    be called with the parameters and predicates'
  merge: -1
