    \ when a DLL function but there are a few new features. Let's look at a real example\
    \ and implement the definition of the ITaskScheduler interface. The IDL file defines\
    \ this as:\n\n```\ninterface ITaskScheduler : IUnknown\n```\n\n```\n // Methods:\n\
