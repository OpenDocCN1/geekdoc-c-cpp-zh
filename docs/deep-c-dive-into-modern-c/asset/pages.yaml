  md: '# Back References


    What can you use captures for? The answer is two-fold – more sophisticated regular
    expressions and replacements. Let''s start with their use in building more sophisticated
    expressions. Using the default numbering system described above you can refer
    to a previous capture in the regular expression. That is, if you \n where n is
    the number of a capture group the expression will specify that value of the capture
    group. It''s easy once you have seen it.


    Consider the task of checking that html tags occurs in the correct opening and
    closing pairs. That is, if you find a <div> tag the next closing tag to the right
    should be a </div>. You can already write a regular expression to detect this
    condition but captures and back references make it much easier. If you start the
    regular expression with a subprocess that captures the string within the brackets
    then you can check that the same word occurs within the closing bracket using
    a back reference to the capture group:


    ```

    Regex ex2= new Regex(`<<div>>\1")

    ```


    Notice the \1 in the final part of the expression tells the regular expression
    to retrieve the match of the first capture group. If you try this you will find
    that it matches <div><div> but not <div><pr>, say.


    You could have done the same thing without using a back reference but it''s easy
    to extend the expression to copy with additional tags. For example:


    ```

    Regex ex2= new Regex(`<div|pr|span|script>\</1")

    ```


    matches correctly div, pr, span and script tags. If you are still not convinced
    of the power of capture and back reference writing a regular expression that detects
    repeats without using them.


    The solution using a back reference is also trivial:


    ```

    Regex ex2= new Regex(`\b(\w+)\s+\1\b")

    ```


    The first part of the expression simply matches a word by the following process
    – start at word boundary, capture as many word characters as you can, then allow
    one or more white space characters. Finally check to see if the next word is the
    same as the capture. The only tricky bit is remembering to put the word boundary
    at the end. Without it you will match substrings that repeat in "the theory".


    As well as anonymous captures, you can also create named captures using (?name=regex)
    or (?name''). You can then refer to the capture by using the syntax \<name> or
    \''name''. Using a named capture our previous duplicate regular expression is
    @"\b(?<word>\w+)\s+\<word>\b"'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'If you need to process named captures outside of a regular expression, i.e.
    using the Capture classes, then you still have to use capture numbers and need
    to know that named captures are numbered left to right and outer to inner after
    the unnamed captures have been numbered.


    If you need to group items together but don''t want to make use of a capture you
    can use (?regex). This works exactly as it would without the ?:; but the bracket
    is left out of the list of capture groups. This can improve the efficiency of
    a regular expression, but isn''t usually an issue.


    # Reduction


    In many cases all you are doing is trying to reduce the capture count for name2
    and in this case you can leave out any reference to name1. This sounds complicated
    but in practice it isn''t too difficult. For example, let''s write an expression
    that matches any number of A followed by the same number of Bs:


    ```

    Regex ex3 = new Regex("^(?<COUNT>A)*(?<COUNT>B)+");

    ```


    This works, up to a point, in that it matches an equal number of A and Bs starting
    from the beginning of the string, but it doesn''t reject a string like AABB, which
    simply matches AABB.


    Each time the first capture group hits an A adds a capture to the capture set,
    so in case there are two captures when the second capture group hits the first
    B. This reduces A''s capture set to 1 and then to zero when the second B is encountered
    which causes the match to backtrack to the second B when the third B is encountered
    and the match succeeds.


    To make the entire match fail we also have to include the condition that should
    be at the end of the string:


    ```

    Regex ex3 = new Regex("^(?<COUNT>A)*(?<COUNT>B)+\$");

    ```


    This fails on AABB, but it matches AABB because in the case the second capture
    group doesn''t fail before we reach the end of the string.


    We really need a test that amounts to "at the end of the string/count capture
    group should be null". To do this we need some sort of conditional test on the
    capture and .NET provides this:


    ```

    (?name)regex1|regex2

    ```


    will use regex1 if the capture is non-empty and regex2 if it is empty. In fact
    this conditional is even more general in that name can be a general regular expression.
    You can leave regex2 out if you want "if...then" rather than an "if...then...else".'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'With our new expression is:


    Regex ex3 = new Regex("@^(?<COUNT>A)+(?<COUNT>-B)+(?<COUNT\^).$");


    The ^ doesn''t match any character and so it forces the match to fail if the

    capture group isn''t empty.


    A more symmetrical if...then...else form of the same expression is:


    ```

    Regex ex3 = new Regex("@^(?<COUNT>A)+(?<COUNT>-B)+

    (?<COUNT>\|(?=\$))");"

    ```


    In this case the else part of the conditional asserts that we are at the end of

    the string.


    # Replacements


    So far we have created regular expressions with the idea that we can use them

    to test that a string meets a specification or to extract a substring. These are

    two conventional uses of regular expressions. However, you can also use

    to perform some very complicated string editing and rearrangements.

    The key to this is the notion that you can use the captures as part of the

    specified replacement string. The only problem is that the substitution strings

    use a slightly different syntax to a regular expression. The Replace method:

    ex1.Replace(input,substitution)


    simply takes every match of the associated regular expression and performs

    t substitution substitution. Notice that it performs the substitution on every

    match and the result returned is the entire string with the substitutions.


    There are other versions of the Replace method but they all work in more or

    less the same way. For example, if we define the regular expression:

    Regex ex1 = new Regex("@(ISBN|ISBN-13)");


    and apply the following replacement:

    MessageBox.Show(ex1.Replace("ISBN: 978-871962406, "ISBN-13"));


    then the ISBN will be replaced by ISBN-13. Notice that an ISBN-13 prefix

    will also be replaced by ISBN-13 so making all ISBN strings consistent. Also

    nice that if there are multiple ISBNs within the string they will be

    matched and replaced. There are versions of the method that allows you to

    restrict the number of matches that are replaced.


    This is easy to follow and well as long as you have defined

    your expression precisely enough. More sophisticated is the use of

    capture groups within the substitution string. You can use "$n" to refer to

    capture group n or "${name}" to refer to a capture group by name. There are a

    range of other substitution strings but these are fairly obvious in use.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'As an example of how this works consider the problem of converting a US format
    date, mm/dd/yyyy, to a UK/European format date, dd/mm/yyyy. First we need a regular
    expression to match the US format:


    ```

    Regex ex1 = new Regex("(?<month>\d{1,2})/(?<day>\d{1,2})/(?<year)");

    ```


    This isn''t a particularly regular expression, but we have allowed one or two
    digits for the month and day numbers but insisted on four for the year number.
    You can write a more interesting and flexible regular expression for use with
    real data. Notice that we have three named capture groups corresponding to month,
    day and year. To create a European-style date all we have to do assemble the capture
    groups in the correct order in a substitution string:


    ```

    MessageBox.Show(ex1.Replace("@", "10/2/2008", "${day}/${month}/${year}")"));

    ```


    This substitutes the day, month and year capture groups in place of the entire
    matched string, i.e. the original date.


    # Postlude


    Regular expressions are addictive in a way that can ultimately be unproductive.
    It isn''t worth spending days crafting a single regular expression that matches
    all variations on a string when building one or two simpler alternatives and using
    a wider range of string operations would do the job as well, if not as neatly.
    Resist the temptation to write regular expressions with strings that you only
    understand and always make sure you test them with strings outside the range of
    inputs that you consider – greedy matching and backtracking often result in the
    acceptance of a wider range of strings than was originally intended. If you take
    care, regular expressions are a very powerful way of processing and transforming
    text without the need to move to a complete syntax analysis package.'
  merge: -1
