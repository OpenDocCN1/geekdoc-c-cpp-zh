    Dynamic typing seems to be mostly harmless and it does improve the way that you
    can write code that relies on determining type at run time rather than compile
    time. It is a big change in philosophy, but it doesn''t go as far as introducing
    a truly dynamic approach to type. Even if you regard it as an attempt to work
    with other systems that are less strict about type, it is still a change that
    makes C# less pure and more ad-hoc.'
