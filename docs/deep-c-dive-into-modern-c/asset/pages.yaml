    Where<int>(MyDelegate2);\n```\n\nIf you look up the range of extension methods\
    \ provided you will see it's very easy to build complicated queries and as it's\
    \ also easy to add your own extension methods to make LINQ capable of whatever\
    \ query you want it to."
