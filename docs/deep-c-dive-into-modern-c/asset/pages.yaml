    \ Notice that this means that\nYou don't have to create a separate method that\
    \ has a life of its own that you\nthen wrap in the delegate. It also saves giving\
    \ to the method a name.\n\nFor example, we can create an instance of MyHelloDelegateType:\n\
    \n```\nMyHelloDelegateType MyHelloDelegate1 = delegate(){\n    MessageBox.Show(\"\
    Hello From a Delegate\");\n};\n```\n\n```\nMyHelloDelegate1();\n```"
