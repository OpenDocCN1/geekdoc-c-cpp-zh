  md: "All delegates multicast delegates, but for efficiency reasons an invocation\
    \ list is only created if there is more than one method encapsulated. That is,\
    \ a delegate that encapsulates a single method stores this method in its Method\
    \ and Target properties and has a null invocation list.\n\nTo summarize:\n\n#\
    \ In C# the delegate keyword creates an instance not of the Delegate class but\
    \ of the MulticastDelegate class.\n\nThat is, in C# an instance of a delegate\
    \ type is always an instance of a MulticastDelegate which extends the basic Delegate\
    \ class to include an invocation list which can store multiple methods.\n\n# Multicast\
    \ In Action\n\nThe easiest way to follow this confusing situation is to try it\
    \ all out. First we need two methods with the same signature that we can encapsulate\
    \ in a suitable delegate:\n\n```\npublic int hello(string param)\n{\n    MessageBox.Show(\"\
    Hello \"+param);\n    return 1;\n}\n```\n\n```\npublic int goodbye(string param)\n\
    {\n    MessageBox.Show(\"Goodbye \" + param);\n    return 2;\n}\n```\n\nA suitable\
    \ delegate type is just:\n\ndelegate int getType(string param)\nNow we can create\
    \ an instance of MulticastDelegate encapsulating two methods:\n\n```\ngreetDoGreet\
    \ = hello;\nDoGreet += goodbye;\n```\n\nThe += operator is overloaded to add a\
    \ method to the invocation list and this should be familiar to you if you have\
    \ hand-coded events.\n\nInvoking the delegate is just the same if it has one or\
    \ multiple methods:\nint= DoGreet(\"delegates\");\n\nIf the invocation list contains\
    \ multiple methods then these are called in the order they were added. The final\
    \ method to be called returns a value. That is, in this case the hello method\
    \ is called with its parameter set to \"delegates\" then goodbye is called with\
    \ the same parameter. Only goodbye is allowed to return a result and hence i is\
    \ set to 2."
