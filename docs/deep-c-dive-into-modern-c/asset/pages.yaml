  md: "# Generic Properties\n\nYou can define generic properties using the same syntax:\n\
    \n```\nclass MyClassA<T>\n{\n    public T MyProperty { get; set; }\n}\n```\n\n\
    This works because assignment is defined for any type and hence the default get\
    \ and set work:\nMyClassA<int> myObject = new MyClassA<int>();\nmyObject.MyProperty\
    \ = 42;\nConsole.WriteLine(myObject.MyProperty);\n\nThe problems begin when you\
    \ try to make the get or set process the value as this requires you to restrict\
    \ your operations to works with object or to find the type and cast. To manually\
    \ implement the get and set, complete with backing variable you would use:\n\n\
    ```\nclass MyClassA<T>\n{\n    private T _value;\n    public T MyProperty\n  \
    \  {\n        get\n        {\n            return _value;\n        }\n        set\n\
    \        {\n            _value = value;\n        }\n    }\n}\n```\n\n# Supplying\
    \ Generic Actions\n\nSo how can generics implement useful if you cannot apply\
    \ any type-specific actions to generic entities?\n\nOne very general answer is\
    \ to use specific implementations of a generic function type that performs the\
    \ operation you require on those specific types. For example, you can't use a+b\
    \ when the types are unknown unless you go to a lot of trouble casting. Alternatively\
    \ you can define a generic function that has the appropriate signature and then\
    \ implement a version for each type you want to work with."
  merge: -1
