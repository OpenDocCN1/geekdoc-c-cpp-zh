  md: "# Chapter 6\n\n# Interfaces & Multiple Inheritance\n\nIn the previous chapter\
    \ we discovered that code reuse is no longer the main concern of object-oriented\
    \ programming – type safety is. With this in mind the idea of an interface becomes\
    \ very obvious as a way of ensuring type safety and even allowing a form of multiple\
    \ inheritance.\n\nOne problem with C#'s implementation of the interface idea is\
    \ that, while it started out simple and with a single clear objective, over time\
    \ features have been added which make it more confusing. When to use an interface\
    \ is no longer clear as it was as now an interface is much more like an abstract\
    \ class. Many of the extensions to the basic interface idea introduced practically\
    \ useful, but theoretically muddled. The concept of interface has slowly been\
    \ drifting back toward that class, but with seemingly arbitrary restrictions on\
    \ what you can do. It can be confusing, but there is reason behind it all.\n\n\
    # The Basic Interface\n\nSuperficially an interface is like a class in that it\
    \ can be inherited. The C# syntax is even very similar. For example, to define\
    \ an interface with a single method you would write:\n\n```\npublic interface\
    \ IMyInterface\n{\n    void myMethod(int value);\n}\n```\n\nAn interface can only\
    \ define methods, properties, indexers and events, but not raw fields, and in\
    \ its purest form it contains no implementation of any of these. IMyInterface\
    \ looks like a class and indeed it can be inherited."
