  md: "For example, if you want to provide a custom add and remove accessor, then\
    \ you need to code the event something like:\n\n```\nprivate MyNewEventType _MyNewEvent;\n\
    public event MyNewEventType MyNewEvent\n{\n    add\n    {\n        lock(this)\n\
    \        {\n            _MyNewEvent += value;\n        }\n    }\n    remove\n\
    \    {\n        lock(this)\n        {\n            _MyNewEvent -= value;\n   \
    \     }\n    }\n}\n```\n\nNotice that you need to use a lock to stop other threads\
    \ from updating the delegate while you are in the middle of doing so. Locking\
    \ on the current object, i.e. this isn't a good idea because other threads might\
    \ try to acquire a lock on some other resource using it, so producing unnecessary\
    \ waiting for locks to be released. Notice that you now have to provide a private\
    \ member variable to store the delegate. You can't use MyNewEvent because using\
    \ += on it would trigger the accessor functions in an infinite recursion.\n\n\
    As the compiler has now what you have called this internal private variable, you\
    \ can no longer raise the event using the event's name. The standard solution\
    \ is to provide an \"On\" method something like:\n\n```\nprivate void OnMyNewEvent(string\
    \ param)\n{\n    if (_MyNewEvent != null)\n    {\n        _MyNewEvent(param);\n\
    \    }\n}\n```\n\nFollowing this pattern means always calling the \"On\" method\
    \ to raise the event.\n\nThis is the pattern used automatically for all built-in\
    \ events within the .NET Framework. Notice, however, that it isn't threadsafe\
    \ because you could check that the invocation list isn't null and start the call\
    \ when another thread takes over and changes the invocation list. Again, a correct\
    \ solution is to obtain a lock before processing the invocation list.\n\nIn short,\
    \ events are inherently multithreaded and as such are dangerous."
