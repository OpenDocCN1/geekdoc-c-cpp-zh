- img_proc: true
  md: '# References Revisited


    As discussed in Chapter 3, in C# we make use of references all the time in the
    form of variables that have been assigned any reference type. For example, if
    you create an instance of a class then the instance variable is not an object
    but a reference to an object of the appropriate type. That is, after:


    ```

    MyClass AnyObject = new MyClass();

    ```


    MyObject is a reference to an instance of MyClass. In practice it contains the
    address of the instance, as already explained, you shouldn''t rely on this form
    of implementation. You can think of MyObject as a sort of "safe pointer". It is
    safe because you cannot do anything with it. You cannot manipulate a reference
    so that it points at some other object unless you assign a new reference to it:


    ```

    MyObject2 = MyObject;

    ```


    This stores a reference in MyObject2 to the same object as MyObject references.
    A raw pointer works in this way but in this case it is a lower concept and you
    are encouraged to think about the assignment as assigning pointers rather than
    anything to do with value reference semantics.


    The difference between a reference and a value basically comes down to assignment
    semantics - does assignment produce a copy of the referenced data/object? If it
    does we have value semantics. If it doesn''t we have reference semantics. What
    gets duplicated in an assignment is the pointer/reference not the object.


    You can argue, and it is a good argument, that all assignment is value assignment
    and the value of a reference variable is just a reference just as the value of
    a pointer is the address it stores.


    **That is the key difference isn''t the value assignment works but what is being
    assigned and this is an abstraction from a pointer to a reference.**


    Many of the subtleties of reference semantics are simply a consequence of admitting
    that a reference is nothing more than a pointer and the value of a pointer is
    something that acts like an address.


    # Pointers In C#


    Pointers in C# are a generalization of the reference type to include pointer arithmetic.
    In other words, a reference that you can do arithmetic with is a pointer. They
    are so dangerous that they have to be quarantined within your code. First the
    entire project has to be marked as unsafe by using the Project Properties to set
    the "Build, Allow Unsafe Code" flag. Then any use of pointers has to be enclosed
    in an unsafe{} block to mark it out even more clearly.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'You cannot create a pointer to anything you care to point at, only to a restricted
    subset of types that have a simpler way of using memory, so making pointer use
    slightly less tricky. Essentially you can only create a pointer to any simple
    value type, e.g. int, float, char, to enum, to another pointer or to a struct
    that doesn''t contain other managed types. So you can''t have a pointer to an
    object, or to a delegate or to reference. This is restrictive and basically amounts
    not allowing pointers to anything that is created on the heap or subject to dynamic
    memory management. However, you can have a pointer to a struct that contains simple
    value types and you can create pointers to arrays of simple value types. This
    is generally enough to work with legacy implementations of data structures or
    to work with binary data structures that have been received over the network or
    from a file. You can also create pointers functions using the delegate* type.


    You can also have a pointer of type void, i.e. a pointer to an unknown type, but
    to be of any use in pointer arithmetic you you need to cast a void pointer to
    a pointer of type. To declare a pointer C# uses the C++ -like syntax* variable;
    where * is the dereferencing or direction operator and is generally used in conjunction
    with the address-of operator &, which as its name suggests, returns the address
    of a variable.


    For example:


    ```

    int* pMyInt;

    int MyInt;

    pMyInt = &MyInt;

    ```


    creates a pointer to an integer, i.e. pMyInt and stores the address of the integer
    MyInt in the pointer.


    The first important thing to note is that a pointer does not inherit from an object
    and so are no methods associated with it and no boxing and unboxing. For example,
    you can use a ToString() method to display the value of a pointer. What you can
    do, however, is to use a cast to convert a pointer to a more usual data type.
    So, to display the contents of the pointer you would use something like:


    ```

    MessageBox.Show((int)pMyInt).ToString());

    ```


    Of course, this assumes that the current implementation of it is large enough
    to contain a pointer, i.e. a machine address. Notice that this is not dereferencing
    the pointer, but showing you the pointer''s contents. Also that the way that machine
    represents an address comes into consideration and this is a reflection of the
    fact that pointers are low-level construct.


    348'
