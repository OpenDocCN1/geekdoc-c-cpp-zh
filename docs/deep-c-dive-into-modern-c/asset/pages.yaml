  md: "# Type and Flow of Control - Signatures\n\nNotice that early binding makes\
    \ things more efficient. This applies to assignment, method parameters and return\
    \ types, all of which can be compiled in and not dynamically determined at run\
    \ time. This mostly applies to types derived from classes, structs or interfaces\
    \ but it also applies to functions. The type of a function depends on its signature\
    \ – the types of its parameters. Notice its return type isn't used.\n\nType determination\
    \ can also affect the flow of control in a program, but static typing and early\
    \ binding can only determine it at compile time. For example, consider the two\
    \ overloaded methods defined within some object:\n\n```\npublic string methodName(int\
    \ i){\n    return \"Integer\";n}\npublic string methodName(double f){\n    return\
    \ \"Double\"\n}\n```\n\nThen, when you write:\nMyObject.method(X);\n\nwhich method\
    \ is called depends on the type of X. If X is an int, and if it is a double, the\
    \ second method is called.\n\nYou may be well used to the idea that overloaded\
    \ methods are called according to signature, but you might not have realized how\
    \ important this makes the determination of type as part of the flow of control\
    \ in your program.\n\nThe method call methodName(X) being resolved according to\
    \ the signature of the call might be thought to be expressed by the equivalent\
    \ code:\n\n```\nMyClass MyObject = new MyClass();\nint X = 1;\n{\n    MyObject.methodInt(X);\n\
    } else if (X is double)\n{\n    MyObject.methodDouble(X);\n}\n```\n\nbut notice\
    \ that this code actually determines the type of X at run time, compile time.\
    \ If X had in fact changed to a double before the if, methodNameDouble would be\
    \ called. This is how it is done in late binding or dynamic typing."
