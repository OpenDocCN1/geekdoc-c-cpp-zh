  md: 'A simple example will make this clear.


    First we need a root node:

    XElement root = new XElement("Record");


    The string is automatically converted to an XName object and this is used to set
    the Name property of the new XElement. An XName is used instead of a simple string
    because XML names have some additional behavior because of namespaces, which we
    return later.


    Now we have a root for our tree let''s create a leaf node:

    XElement child1 = new XElement("Name");


    and hang off the tree:

    root.Add(child1);


    If you place a text box on a form you can see the XML that the tree represents
    using:

    textBox1.Text = root.ToString();


    What you will see is:

    <Record>

    <Name />

    </Record>


    You can carry on in the same way to build up a tree of any complexity like. For
    example:

    XElement root=new XElement("Record")

    XElement child1=new XElement("Name")

    root.Add(child1)

    XElement child2=new XElement("First")

    XElement child3=new XElement("Second")

    child1.Add(child2)

    child1.Add(child3)

    XElement child4=new XElement("Address")

    root.Add(child4);


    creates the following XML:

    <Record>

    <Name>

    <First />

    <Second />

    </Name>

    <Address />

    </Record>


    The idea of nesting XElement within another is fairly obvious, but there are neater
    ways of achieving the same result.'
