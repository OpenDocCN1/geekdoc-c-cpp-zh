- img_proc: true
  md: 'simply ask yourself if it is possible to determine compile time that a run-error
    is extremely unlikely on the basis of the types in use.


    The strong typing bookkeeping allows derived types to be used in place of the
    base type simply because they have all of the properties of the base type.


    Why is compile-time checking so important?


    If you make a error that isn''t detected at compile time, it will most probably
    be detected at run time with a run-time exception. The reason that it is only
    detected is a matter of coverage. A syntactically correct program can cause a
    run-time error, but only if the inputs to the program cause it to exercise that
    part of the program where the error is located. You may run the program and never
    trigger the error, only for your first user to encounter it because they use the
    program differently to you. If you could guarantee to find all run-time errors
    on the first run there would be little difference between compile-time and run-detection.
    This is the problem of "coverage".


    It is often claimed that strong typing helps with entering the correct code in
    the first place some sort of intelligent prompting. This is sometimes true, but
    it is often used to make up for poor documentation and the same facility can be
    implemented without enforcing strong typing, or typing of any sort. The point
    is that the sort of errors that strong typing and type safety detect are very
    trivial - they have to be detected at compile time. really does come down to determining
    that the object being used has the properties and methods you actually use.


    Type safety is a very limited form of safety.


    # Static Typing and Binding


    Even with strong typing we have a choice of how to implement it. We can opt to
    have a variable declared just once as one particular type that persists for the
    entire life of the program. That is, following:


    ```

    string a;

    ```


    you can be sure that wherever you see a in the program it references a string.
    Of course, things are not quite simple as local variables can reuse the same name
    in another part of the program and may well be a variable called that references
    something that isn''t a string. However, with these scope and lifetime issues
    taken into account, we can be sure that when a occurs in the program with its
    original meaning, i.e. it is in scope, then it is a string.'
