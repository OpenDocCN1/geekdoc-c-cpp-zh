  md: '# Parameters, Type and Function Safety


    One of the biggest attractions of using strong typing is its ability to seemingly
    make functions easier and safer to use. Strong typing stops you from trying to
    use methods and properties that clearly aren''t available on the objects you are
    working with. The strange thing about this idea is that if you are writing the
    code then presumably know what methods are available on the object you are using
    – so why is strong typing so well thought of?


    The answer is that strong typing can help you move all of the uncertainty about
    objects and what they support to the boundaries of your code. Consider for a moment
    a function defined without information:


    ```

    add(a,b){return a+b}

    ```


    The meaning of the function is clear, but what is the type of a, b and the return
    value? Clearly the intention of the, perhaps naive, programmer is that an operation
    “+" works for a and b and the result is also presumably the same type or at least
    an obvious type. You can see that the function definition represents a sort of
    boundary between the code in the function and the outside world of code that will
