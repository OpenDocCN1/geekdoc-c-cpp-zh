    \      Console.WriteLine(\"implemented A\");\n    }\n}\n```\n\nIMyInterface myObject\
    \ = new MyClassA();\nConsole.WriteLine(myObject.method());\n\nYou can see that\
    \ IInterface is just a single method, myMethod, which is implemented by MyClassA.\
    \ In the main program, notice that myObject is declared to be of type IInterface\
    \ and is made to reference an object of type MyClassA. You can use myObject to\
