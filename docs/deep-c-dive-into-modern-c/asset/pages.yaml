  md: "# Alternative to Structs – Record\n\nJust as struct has a value alternative,\
    \ there is a reference alternative in the form of the record class. This is another\
    \ way to group together data fields. We declare a record using the record keyword\
    \ in place of class.\n\nA record is primarily about defining data fields. You\
    \ can do this in a number of ways. The simplest record declaration is:\n\n```\n\
    public record Staff(string name, int age);\n```\n\nAfter this, you can define\
    \ an instance using:\nStaff me = new Staff(\"mike\",18);\n\nIn this case the record\
    \ has immutable fields and after initialization you can only read the fields.\
    \ That is:\n\n```\nme.age += 1;\n\nme.age=me.age+1;\n```\n\nYou can define properties\
    \ in the body of the definition:\npublic record Staff\n\n```\n{\n    public string\
    \ name { get; init; }\n    public int age { get; set; }\n}\n```\n\nThe new init\
    \ accessor is like set but it can only be used to set the value once. Once init\
    \ gives you an immutable record. You can use set to produce a mutable record and\
    \ you can use init in class-based properties. You can also use set in place of\
    \ init to create a mutable record. After this:\n\n```\nme.age = 18;\nme.name =\
    \ \"Mike\";\n```\n\nis fine, after this you can change age, but not name.\nYou\
    \ can mix the two styles of definition:\npublic record Staff(string name,int age)\n\
    \n```\n{\n    public string name { get; init; } = name;\n    public int age {\
    \ get; set; } = age;\n}\n```\n\nThis is all good in the sense that it is a neater\
    \ syntax for creating-oriented classes, but what else does it provide?"
  merge: -1
  pgno: 60
- img_proc: true
  md: 'The first is a value semantics test of equality. Two records are regarded as
    the same if their fields are of the same type and currently have the same values.
    This is achieved by the compiler auto-generating an override for the comparison
    methods – a record is still a reference type.


    The compiler also generates an improved ToString method, which displays the record
    in a more readable format. For example:


    ```

    Console.WriteLine(me);

    ```


    produces:

    Staff { name = Mike, age = 19 }


    While this is not good enough for presentation, it can be handy for debugging.

    A generated deconstruct method can also be used to transfer fields to local variables.

    For example:


    ```

    string name;

    int age;

    me.Deconstruct(out name, out age);

    ```


    Another useful feature is that a record can play a restricted role in inheritance.
    A record can inherit from another record but classes and records can''t inherit.
    Adding inheritance to a record is most likely an avoidable complication.


    The big advantage of the record type is that it can be made immutable. The problem
    with using immutable data is that when you want to change something you have to
    make a copy. A copy method is automatically defined by the with expression, introduced
    for exactly this purpose and easier to use:

    Staff you = me { name = "harry" };


    This creates a copy of the record with the name changed to harry. With this expression
    creates a completely new copy of the record then uses the object initializer to
    change any fields mentioned and then sets the variable to refer to the new object.
    You can only change properties that have an init or set assessor. Notice that:


    ```

    me = me with { age = 21 };

    ```


    is perfectly legal but now references a completely new object with the age field
    set to 21.'
