    C# didn''t take the option of making functions objects, instead it opted to use
    a wrapper class – the delegate – to convert functions into objects. Over time,
    this idea has been developed to allow more and more functionality until finally
    reach the pinnacle of the easy-to-use function, the lambda complete with closure.'
