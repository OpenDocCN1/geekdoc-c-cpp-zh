- img_proc: true
  md: 'The indirection operator returns the values stored at the address that a pointer
    is pointing at. For example:


    ```

    MessageBox.Show((*pMyInt).ToString());

    ```


    displays the current contents of MyInt, i.e. the value of whatever pMyInt is pointing
    at. That is, *pMyInt is an int.


    The indirection operator and the address of the operator really are inverse of
    one another. That is:


    ```

    MessageBox.Show((*pMyInt).ToString());

    ```


    just displays the content of MyInt.

    A pointer can be null and nulling the ind operator in this case generates an exception.
    Obviously it makes no sense to use indirection on a void pointer - what would
    the data type of the result be? However, you can always cast a pointer and use
    indirection.


    Notice that this process can produce complete nonsense. For example:


    ```

    void* MyData = &MyInt;

    MessageBox.Show((double*)pMyData).ToString());

    ```


    This sets a pointer to an integer, specifically a 32-bit integer, then casts it
    to a double pointer, i. double*, and finally uses the indirection operator to
    return the value so pointed at. If you try this out you will find that, it is
    mostly nonsense because the original int was only 4 bytes of storage and the double
    is 8 bytes.


    Where did the additional 4 bytes come from? The answer is that you succeeded in
    reading data from a neighboring memory location, one that you would normally not
    be able to access. Of course, reading from a memory location that you don''t understand
    is fairly safe, but who knows what effect writing to such a location is going
    to have?


    This is the basic mechanism that malware uses to escape the confines of managed
    code or more simply to access memory it has no right to access and the reason
    pointers are considered unsafe. For example:


    ```

    int MyInt2 = 0;

    int MyInt = 1234;

    void* MyData = &MyInt;

    *(double*)pMyData = 123456.789;

    MessageBox.Show(MyInt2.ToString());

    ```


    You might be surprised to discover that the value of MyInt2 has changed and is
    no longer 0, even though it isn''t assigned a new value within the program. The
    simple explanation is that MyInt2 is allocated storage alongside MyInt and when
    we assign an 8-byte value to MyInt the extra four bytes overwrite'
