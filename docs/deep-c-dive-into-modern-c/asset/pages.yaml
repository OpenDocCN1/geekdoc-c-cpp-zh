  md: '# Chapter 10

    Advanced Generics


    A better title for this chapter would be “Evolving Generics” because the whole
    idea is still being developed. Trying to find a way of writing generic algorithms,
    i.e. ones that work for a range of types, isn''t a simple problem if you want
    type safety. Recall that type safety requires you to be certain that the type
    you are working with is correct for the operations you are using at compile time.
    We have already discovered that basic generics are a type safe way of creating
    algorithms that require almost nothing from your working type, so much that it
    is equivalent to working with object and not using any casts. The question to
    be is answered by how we can extend generics to make it more flexible while allowing
    the widest range of types to be covered.


    As it stands, generics achieves type safety by being very restrictive. This said
    it should be noted that it allows a great standard generic algorithms to be implemented,
    and when supplemented by generic actions, anything is possible. However, as it
    stands it doesn''t even capture the freedoms that the basic hierarchical typing
    rules allow. In generics <> can be any type and hence to type safe we have no
    choice but to treat it as it was object. By applying some additional conditions
    on <>, we can assume more about the type and this is where generic constraints
    enter the picture.


    Once we have a generic facility that is sophisticated we also have to consider
    how this affects the whole type system and, in particular, what is type safe and
    this is where variance has to be considered.


    # Generic Constraints


    The problem is when we use a type parameter like T can be any type. This is the
    advantage of generics, but it means if we want to use any operations on a particular
    type we have to implement specific functions that work with the type.


    The reason we can''t call specific methods on a generic is that the compiler has
    no idea what the type is at run time. We can relax this by applying generic constraints
    to the type parameter which limits what sort of types are allowable. Knowing that
    the type parameter must be a particular type, or a subtype of that type, we can
    allow methods to be used, secure in the knowledge that the methods will exist
    at run time.'
  merge: -1
