    \    }\n}\n```\n\nThis looks promising as a way of implementing method directly\
    \ on class MyClassA by delegation, but if you change the name of myMethodA in\
    \ the class to myMethod you will find that there is a stack overflow:\n\n```\n\
    public int myMethod()\n{\n    return((this as IInterfaceA).myMethod());\n}\n```\n\
