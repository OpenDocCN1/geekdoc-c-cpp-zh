  md: '# Raw IUnknown


    At this point we have the COM object, and implicitly, its IUnknown interface.
    However, .NET doesn''t expect you to use the object''s IUnknown interface and
    therefore doesn''t provide an easy way to do it. For other interfaces the COM
    Interop makes it very easy - in fact all you have to do cast the object to a suitable
    interface type and COM Interop after calling QueryInterface and wrapping the returned
    interface pointer. This is certainly the way you should use COM in .NET, as a
    demonstration of how you can use a COM interface let''s explore IUnknown.


    The first thing to say is that .NET provides methods that you can use to work
    with IUnknown, but they aren''t entirely satisfactory. Again, it''s important
    to note that this isn''t the way you would use a typical COM interface. The Marshal
    static object has a great many methods that can be used in the conversion of managed
    and unmanaged types. In this case there are four methods of direct relevance:
    GetUnknownForObject, which returns a pointer to a pointer of the object''s IUnknown
    interface; QueryInterface, which returns a pointer to a specified interface; AddRef,
    which increments the use count; and Release decrements the use count. All of them
    use the IntPtr type to specify and return pointers to interfaces.


    All will become clear with a simple example. First get a pointer to the IUnknown
    interface for the scheduler:


    ```

    IntPtr pUnknown = Marshal.GetUnknownForObject(pSched);

    ```


    Now we use AddRef and Release as a demonstration that it works:


    ```

    Int32 count1 = Marshal.AddRef(pUnknown);

    Int32 count2 = Marshal.Release(pUnknown);

    ```


    Finally, to show how a pointer to another interface would be retrieved, we use
    QueryInterface to get a pointer to the ITaskScheduler interface with its IID from
    the IDL file:


    ```

    IntPtr pSched;

    Guid IIdSched = new Guid("14B80527-A2AB-11CE-B1FF-00AA05305303");

    Int32 result = Marshal.QueryInterface(pUnknown, out pSched);

    ```


    When this method returns we a pointer to the ITaskScheduler interface pointer.


    This is all well but how can we do the methods in an interface given that all
    we have a pointer to the interface pointer? There might be a way to cast such
    a pointer into an interface wrapper type, but I can''t find one! One possible
    solution is to access the vtable directly as a pointer array and then cast each
    pointer to a function to a suitable delegate. Despite my best efforts I''ve only
    had limited success with this approach in C# - it''s probably something to do
    with the calling convention it tends to fail when there are parameters.


