- img_proc: true
  md: "Upcasting may be legal but what does it mean?\n\nThe only sense that:\n\nMyB\
    \ = (MyClassB) MyA;\n\ncan possibly make if MyA actually references an object\
    \ of type MyClassB i.e. it has been downcast earlier. Only then can we use of\
    \ methods that are only defined on a type MyClassB object. That is:\n\nMyB = (MyClassB)\
    \ MyA;\nMyB.Method();\n\nonly works if the object we are using, i.e. what MyA\
    \ references, really is a type MyClassB object. If it isn't then we are trying\
    \ to call a method that do not exist and the result is a run-time error.\n\nYou\
    \ can see that upcasting isn't type safe as you cannot easily work out whether\
    \ what is being cast of the correct type. For example:\n\n```\nRandom R = new\
    \ Random();\nMyClassB myObject;\nif (R.NextDouble() > 0.5)\n{\n    myObject =\
    \ new MyClassB();\n}\nelse\n{\n    myObject = (MyClassB) new MyClassA();\n}\n\
    Console.WriteLine(myObject.property);\n```\n\nThis program generates no compile-time\
    \ errors or warnings, but 50% of the time it fails trying to cast an object of\
    \ type MyClassA to a type MyClassB doesn't work. In this case the random input\
    \ is a stand-in for a variability injected into the program by the rest of the\
    \ world in real program.\n\n# Is and And\n\nThere are two operators that can help\
    \ avoid run-time exceptions when casting. The operator can be used to test the\
    \ type of the reference before applying a cast. For example:\n\n```\nif (MyAnything\
    \ is MyClassB)\n{\n    MyClassB MyB = (MyClassB)MyAnything;\n};\n```\n\nThis is\
    \ the basic form of the is as well as a type it can also test for a more general\
    \ pattern – see Pattern Matching in Chapter 2."
