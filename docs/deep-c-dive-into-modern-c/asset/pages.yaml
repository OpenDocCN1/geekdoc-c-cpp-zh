  md: '# Other Books by Mike James


    ### Programmer''s Python:

    ### Everything is an Object

    Mike James

    ISBN: 978-1871962581


    This book sets set out to explain the deeper logic in the approach that Python
    3 takes to classes and objects. The subject is roughly speaking everything to
    do with the way Python implements objects. That is, in order of sophistication,
    metaclass; class; object; attribute; and all of the other facilities such as functions,
    methods and the many "magic methods" that Python uses to make it all work.


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_366_0.png)


    This is a fairly advanced book in the sense that you are expected to know basic
    Python. However, it tries to explain the ideas using the simplest examples possible.
    As long as you can write a Python program, and you have an idea what object-oriented
    programming is, all should be


    ### JavaScript Gems:

    ### The Amazing Parts

    Mike James

    ISBN: 978-1871962420


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_366_1.png)


    Here we have a collection of twenty gems about features that have their advantages
    and disadvantages over their counterparts in other languages.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# # The Programmer''s Guide To Theory:

    Great ideas explained


    Mike James

    ISBN: 978-1871962437


    Computer science, deserves to be better known even among non-computer scientists.
    The reason is simpel it is full of profound thoughts and ideas. It contains some
    paradoxes that reveal the limits of human knowledge. It provides ways to reason
    about information and randomness that are understandable without the need to resort
    to abstract method.


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_367_0.png)


    This is not an academic textbook, but could be the precursor to reading an academic
    textbook.


    # # The Programmer''s Guide To Kotlin

    Second Edition


    Mike James

    ISBN: 978-1871962703


    Kotlin experienced a surge of popularity when Google made it a first-class language
    for Android development and gradually has found its way into many domains as an
    object-oriented language that is fun and flexible in its approach. It is an interesting
    language because it is 100% runtime compatible with Java while being easier to
    use. Using Kotlin will make programming simpler and your programs better, and
    this is why you need to learn Kotlin.


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_367_1.png)


    This book introduces Kotlin to programmers. You don''t have to be an expert in
    Java or any other language, but you do need to know the basics of programming
    and using objects. As all languages Kotlin has some subtle areas where an understanding
    of how things works makes all difference and this second edition pay close attention
    to these gotchas and has a completely new chapter on Coroutines, which is perhaps
    the Kotlin feature with the most pitfalls and the least documentation. After reading
    this book all is made clear and workable.'
  merge: -1
