- img_proc: true
  md: 'If this sounds a lot like an invitation to return to copy-and-paste inheritance
    you wouldn''t be far from the truth. The whole point of interface inheritance
    is that it isn''t inheritance at all – it stops the propagation of changes down
    a chain of derived classes. Each class that implements the interface has the same
    set of methods and this is useful, especially when writing generic methods, but
    there is still the problem of maintaining multiple implementations of each interface
    to contend with. Interface inheritance is about type safety not code reuse.


    Similarly, delegation, where a class is extended by wrapped in an outer class,
    has its advantages, but brings with it duplication of code and a partial reinstatement
    of the inheritance chain. That is, if the contained class is changed then the
    containing class can break. C# almost has a simple mechanism for delegation if
    interface default methods really are default methods.


    # Encapsulation


    If you want to extend and make use of code that has already been written, you
    have to accept the fact that change to the base code can result in the derived
    code not working. Basically the problem is in finding ways of controlling inheritance
    and the current situation is confused and difficult. There are some simple ideas,
    as dividing the workings of a class into external and internal and making sure
    that only the external details are available for use – the principle of encapsulation
    – but this doesn''t specify what should be inherited.


    Are the internal workings of a class fair for reuse in a derived class?


    The best answer is, “sometimes”. There are cases where the internal workings are
    important enough to the functioning of the class that not allowing derived classes
    would defeat the point of inheritance. There are also cases where an internal
    facility shouldn''t be reused by inheritance – but it is very difficult to find
    convincing examples that aren''t just poor design or coding. Even more draconian
    the idea that inheritance should be prohibited completely – an easy option in
    C#. Finally finding ways of disabling inheritance we have the idea of the extension
    method, which was introduced in C# 3.0 to allow class reuse and extension without
    inheritance. Extension methods are so easy to use and so attractive that they
    are often used to make up for the inability to reread the workings of a class
    via inheritance inheritance.


    When reading the practicalities of inheritance control you need to keep in mind
    that there are many strong opinions about how things should be done, but very
    little theoretical or practical evidence that this is indeed the'
