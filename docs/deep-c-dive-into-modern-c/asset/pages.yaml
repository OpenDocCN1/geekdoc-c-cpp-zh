  md: "# Simple Value Types\n\nYou might be surprised that if you try:\nstring[] test\
    \ = { \"A\", \"B\", \"C\" };\nBoolean result = Find(test, \"B\");\n\nYou will\
    \ find that the answer is true.\nIf you think about this for a moment it is an\
    \ incorrect result if you believe that the literal \"B\" is a different string\
    \ object to the \"B\" stored in the array. This behavior is because the C# compiler\
    \ goes to lengths to avoid storing the same string literal than once. A compiler\
    \ optimization, called \"interning\", checks to see if the string already exists\
    \ and if it reuses it and hence the equality of reference. Notice that this is\
    \ a compiler optimization and not part of the language definition, and certainly\
    \ nothing to do with the type hierarchy, so the result you get depend on the compiler\
    \ you use. This is a good reason to be very careful when using reference equality\
    \ on anything but classes.\n\n# Basic Generics\n\nThe basic idea of generics is\
    \ very simple – it extends the idea of a parameter to include specifying type.\
    \ That is, it allows type parameters in class, interface and method definitions.\
    \ To make use of such generic declarations you have to supply real types for the\
    \ type parameters at the time they are used.\n\nA type parameter is defined by\
    \ being enclosed in < > used as brackets and can be used anywhere a type specification\
    \ can be used – class, interface, functions, etc. So, for example, the function\
    \ to find an element in an array can be re-written as a generic function with\
    \ the use of a single type\n\n```\nBoolean Find<T>(T[] a, T Target)\n{\n    Boolean\
    \ result = false;\n    foreach (T in a)\n    {\n        if (x.Equals(Target))\n\
    \        {\n            result = true;\n            break;\n        }\n    }\n\
    \    return result;\n```"
  merge: -1
