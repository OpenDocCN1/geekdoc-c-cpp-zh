  md: "You can explore the expression tree using its methods and properties. For example:\n\
    Console.WriteLine(Extree.Body);\nConsole.WriteLine(Extree.Parameters[0]);\nConsole.WriteLine(Extree.ReturnType);\n\
    \nresults in:\n(x * x)\nSystem.Int32\n\nYou can apply the method in an expression\
    \ tree using the Compile method. For example:\nFunc<int, int> MyNewDelegate =\
    \ Extree.Compile();\nint result=MyNewDelegate(3);\n\nstores the expression lambda\
    \ in MyNewDelegate and then uses it. You can also create and use the delegate\
    \ on the fly:\nint result=Extree.Compile(3);\n\n# An Expression Tree From Scratch\n\
    \nNow that we have taken an expression lambda and converted it to an expression\
    \ tree and then taken the expression tree converted it back to the lambda, all\
    \ that is left is to build the expression tree from scratch. If you think about\
    \ how complex a method can be, you can see that this is an equally complex topic.\
    \ Most of the methods that you need to generate an expression from scratch are\
    \ provided by the Expression static class and its methods.\n\nAs a simple example\
    \ of how this works, let's square the squaring lambda from scratch. We first need\
    \ to define the parameter:\nParameterExpression param = Expression.Parameter(typeof(int),\
    \ \"x\");\n\nThe parameter name \"x\" is used only in debugging and system messages.\
    \ Next we need to define the body of the lambda and this is where things can get\
    \ complicated:\nExpression square = Expression.Multiply(param, param);\nThe Multiply\
    \ method takes a left-hand side expression and a right-hand side expression and\
    \ multiplies them together. In this case we multiply the parameter by itself.\
    \ Now we can build the expression tree:\n\nExpression<Func<int, int>> Extree =\
    \ \nExpression.Lambda<Func<int, int>>(square, param);"
