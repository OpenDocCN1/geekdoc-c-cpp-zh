  md: 'You could then ask why C# supports inheritance at all if every class has inheritance
    turned off? Indeed, as already discussed, many programmers are of the opinion
    that inheritance is not the best way to use code. Interface inheritance and composition,
    for example, are design alternatives to inheritance that are simpler to manage.


    It is also argued that allowing classes that are in the framework to be extending
    is unwise and hence bugs that would bring the entire system into disrepair. The
    effort to create classes that can be safely extended by inheritance in a manner
    that stops the inperienced from from damage is just too much. Far better to have
    a library of code that can be used in a narrow, well-defined, with a high degree
    of confidence that the code does exactly what it claims to.


    Another reason for sealing a class is that it permits the compiler to perform
    optimizations by making all of the methods non-virtual. As there can be no derived
    classes all method calls can be made early bound and this is type safe and more
    efficient.


    So using sealed as a default option is easy, safe and rewarding to the class implementer,
    but not much as the class consumer.


    On the other hand if the code doesn''t do what you want, it isn''t quite complete,
    adding some additional methods and properties would make it just right then to
    do whatever the class is sealed is annoying. The only solutions to the problem
    involve a lot of work. You can recreate the code for the base class and then extend
    it – a task that is relatively easy if you have the source code of the base class.
    Even if you are able to implement a copy-and-paste version of source code inheritance,
    you have made the system more error-prone by being there two copies of essentially
    the same code.


    # # The Static Class


    There is also another variation on class that cannot be inherited – the static
    class. Classes have static constructors as well as instance constructors. All
    you have to put static in front of the constructor definition and it is used to
    initialize any static fields the class may have. If you also create a private
    constructor for the class then no instances can be created and you have a pure
    static class – the ultimate singleton object which cannot be instantiated nor
    inherited.'
