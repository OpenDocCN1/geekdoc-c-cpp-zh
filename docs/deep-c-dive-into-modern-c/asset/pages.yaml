- img_proc: true
  md: '# Structs versus Classes


    Structs are so important and versatile that, before moving on, it is worth saying
    a few words that compares and contrasts them to classes while we are on the topic.


    As you might expect of a value type, structs do not support inheritance – they
    inherit from objects, but that''s the end of the inheritance hierarchy. They do
    support interfaces, however, more of which is in Chapter 6. Also a struct can
    have methods, properties and constructors, but it can''t have a destructor. Its
    do default, i.e. parameter-less, constructor can''t be changed and always initializes
    all its fields to the default value of θ for a value type and to null for a reference
    type. You can add your explicit constructor to initialize fields to specific values.
    Surprisingly, although you can create a struct without the use of new, you can
    write:


    ```

    PointV = new PointV();

    ```


    It is important to realize that this way of creating a struct is no different
    from the point of view of value or reference semantics - a struct is always a
    value type.


    There is a difference, however, and that is that the use of new calls the struct''s
    default constructor which sets each field of the struct to its default value.
    If you don''t use new then the fields are treated as undefined and the compiler
    displays an error message if you try to make use of any of the fields before they
    have been assigned to.


    # Simple Types


    The simple data types, int, char, etc are clearly value types, but conceptually
    at least they are also examples of structs. Most of the time you can ignore this
    fact and just treat them as numbers or characters, but they do have methods. For
    example, int is just an alias for the System.Int32 struct which inherits from
    object and so it has a ToString method:


    ```

    int a;

    string b = a.ToString();

    ```


    Each simple type also has methods of its own and even static methods.


    ```

    int I = int.MaxValue;

    ```


    Of course, you can''t inherit from a simple type and they have other special features
    such as being literals of the same type, e.g. 10, 233.34 and so on.'
  merge: -1
