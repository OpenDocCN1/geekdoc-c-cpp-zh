  md: '# Upcasting and Downcasting


    We have already encountered the ideas of upcasting and downcasting, but it is
    worth going over again briefly in the light of casting in general.


    Originally casting may have been about changing data representation, but today
    it is mostly about changing the type label on a variable, not the active conversion
    of representations. You can view its involvement with data format conversion of
    value types as an accident due to the need for some consistency. Indeed, C# modeled
    its casting in C++ + just at the point where C++ was attempting to put its house
    in order by adding some constructs that removed the need to use casts as int


    Casting acquired its meaning when we moved to strongly typed object languages
    that supported inheritance. This gives rise to an inheritance hierarchy which
    is natural to interpret as a type hierarchy. There is a sense in which a base
    class is smaller than a derived class in the way that an int is "smaller" than
    a long. You can use a long anywhere that an int can be used simply because a long
    can represent every number than an int.


    This notion of "x can be used anywhere y can" generalizes to the wider hierarchy
    only in this case x is "derived class" and y is "base class".


    That is, as we have seen in previous chapters:


    ```

    class MyClass;

    class MyClassB : MyClass;

    ```


    then


    ```

    MyClassA myA = new MyClassB();

    ```


    is valid and myA can be treated as if it was referencing an object of type

    MyClassB even though it is actually referencing an object of type MyClassB.

    as MyClassB has all the methods and properties of MyClassA this is always safe
    to do and so the cast is automatic – this is like a widening cast for value types
    but the analogy is far from perfect. If you want to look more like a cast, you
    can write:


    ```

    MyClassA myA = (MyClassA) new MyClassB();

    ```


    If you try this, however you will most likely find that there is a warning that

    a cast is unnecessary but it does make it clear that a MyClassB is being treated

    as MyClassA object, an upcast, just as an int is treated as a long in the earlier
    example.'
