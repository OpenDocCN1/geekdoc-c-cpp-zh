  md: "For example, a suitable callback delegate that can clean up both of the threads\n\
    is:\n\n```\nAsyncCallback C = delegate(IAsyncResult ar)\n{\n    asyncTask T =\
    \ (AsyncTask)ar.AsyncState;\n    T.EndInvoke(ar);\n};\n```\n\nTo make this work\
    \ we need to call the asynchronous delegates, passing both\nt callback and the\
    \ delegate itself as the ar parameter:\n\nIAsyncResult R1 = T1.BeginInvoke(C,\
    \ T1)\nIAsyncResult R2 = T2.BeginInvoke(C, T2);\n\nWith this change it all works\
    \ as advertised.\n\n# The Invoke Pattern\n\nYou might be wondering why Invoke\
    \ is used to run UI objects on the UI\nthread. Why not simply use one thread to\
    \ synchronize access to each control so\nthat just one thread can be updating\
    \ the control at a time? As long as each\nthread completes before the next one\
    \ starts there is no danger of leaving the\ncontrol in a strange, half-completed,\
    \ state.\n\nThe reason for adopting the invoke approach is simply that the UI\
    \ thread\naccesses controls as when it needs to and it is not going to play by\
    \ the\nrules as any threads that you create and this means that you can't limit\n\
    access to controls to just one thread using locks, the UI thread will simply\n\
    ignore them. For locks to work, all of the threads trying to access the resource\n\
    have honor the locking mechanism. Any thread that doesn't play by the\nrules simply\
    \ makes a mess of the whole enterprise.\n\nThe Invoke, however, can be implemented\
    \ as to force threads to\nbehave when they access an object. The object can test\
    \ to see which\nthread is accessing and it throw an exception if it isn't the\
    \ thread that created\nit - forcing the access to it via an Invoke.\n\nThis Invoke\
    \ pattern is useful enough for us to know how to use it in\nour own classes. Simply\
    \ put, how to give a class an Invoke method that\nallows a thread to run a delegate\
    \ on a thread of the class's choice?\n\nThe full answer is quite complicated and\
    \ involves implementing the\nISynchronizeInvoke interface which includes Invoke,\
    \ BeginInvoke,\nEndInvoke and Invoke.required.\n\nAll controls define the ISynchronizeInvoke\
    \ interface and these are the\nmethods we have been using in this chapter. For\
    \ simplicity let's restrict\nourselves to just an implementation of Invoke and\
    \ also assume that any\ndelegates to be so invoked have no parameters. The extension\
    \ to parameters"
  merge: -1
