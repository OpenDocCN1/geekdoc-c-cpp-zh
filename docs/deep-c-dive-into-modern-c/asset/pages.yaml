    \ use of the usual LIN extension methods, although this isn't the most common\
    \ way of explaining how LINQ to XML works.\nFor example, assuming we have an XML\
    \ tree something like:\n\n```\n<Record>\n  <First />\n  <Second />\n</Name>\n\
    \  <Address />\n</Record>\n```"
