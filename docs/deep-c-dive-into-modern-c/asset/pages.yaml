  md: '# Overriding – Virtual and Late Binding


    At first sight, overriding a method seems easy and simple and the possibility
    that there could be any complications seems unlikely. However, there are complications
    and C# facilities which allow you to say how to handle these complications. In
    particular it provides both late and early binding options for overriding. In
    this section we look at late binding.


    If you have a class that inherits from a base class and an inherited method doesn''t
    do the job it needs to in its new class, then override it with a new method. The
    base class carries on using its original method and the derived class uses its
    new method - what could go wrong?


    The first thing to notice is that if you use the derived class as a base class
    for another class it is the new method and not the original base class method
    that is inherited. That is, once a method is overridden in a class the version
    is passed down to other classes - it replaces the base class method in the inheritance
    hierarchy. This is something what you want and sometimes not. The only reasonable
    solution is to override the method again to get the behavior you want While use
    base.myMethod() to call the method in the immediate base class, you cannot use
    expressions like base.myMethod() to call methods in an earlier base class.


    The biggest complication in overriding is what to do about casting. As explained
    earlier, we can use a variable of a base type to reference an object of a derived
    type – a downcast. This causes ambiguity over which method to call if an inherited
    method has been overridden.


    For example, we have seen in earlier chapters that if MyClass inherits myMethod
    from MyClass and overrides it:


    ```

    MyClass MyA;

    MyClass MyB;

    MyB = new MyClass();

    MyA = MyB;

    MyA.myMethod();

    ```


    which version of myMethod is used?


    Novice programmers expect to get MyClassB''s version of the method, i.e. the new
    one and the one that belongs to the instance being used, but they would be wrong.
    By default you get MyClass''A version of the method, i.e. the reference variable''s
    type determines which version of the method is actually called.


    As explained more in Chapter 11 this is an example of early binding, i.e. the
    method used to call the call at compile time and it has to be determined by the
    type of the variable not the type of the object the variable references at run
    time.'
