  md: '# Delegate Patterns


    Why would you use a delegate rather than just calling method?


    The answer, explained in the introduction, is simply that a delegate can be passed
    as a parameter to another method, so determining what method is called at run
    time. More widely a delegate can be used anywhere an object, which means you can
    have references to a delegate and data structures of delegates as arrays. In functional
    programming terms, a delegate converts a method or a function into a "first-class
    object" i.e. one that can be used like any other object.


    There are two well-known patterns that demand the use of a delegate. The first
    is the "callback" or notification method which is supplied to an object for it
    to call with intermediate or final results of its working. In course, this instance
    is usually run on a separate thread and the method provides some asynchronous
    communication between the caller and the called thread. The second is event handling.
    A delegate can be set up within called when an event occurs. If you think carefully
    you will see that there is little difference between the callback and the event
    pattern. In both cases a delegate is called when some condition occurs – a buffer
    is full, the user has clicked a button, an error condition has been detected etc.
    However, while events are based on delegates they add an additional structure,
    an add and remove accessor similar to a property. A third, slightly less common,
    pattern involves creating a new thread of execution.


    # Signatures and Methods


    At this point it is worth making clear that the delegate''s signature always determines
    how the method that the delegate wraps is called. That is, you always have to
    invoke the delegate with the parameter types specified and the delegate returns
    the type specified. However, it is possible to create instances of the delegate
    that encapsulate methods that don''t have exactly the specified signature.


    To summarize:


    +   A delegate type''s signature specifies how the delegate is invoked – i.e.
    the parameters and return type are always given by the delegate''s signature.


    +   A delegate type''s signature specifies what sort of methods an instance of
    the type can encapsulate.'
