    \ classes allow the definition of an inheritance chain\nadds more implementation\
    \ code at each step. The role of an abstract class\nis to represent the most abstract\
    \ object in the hierarchy, perhaps so\nthat implementations of the methods it\
    \ defines wouldn't be useful but would\nbe for derived classes."
