  md: '# Chapter 19


    # The LINQ Principle


    Language-Integrated Query (LINQ) isn''t just for SQL; it''s for languages. It
    is worth finding out how LINQ works at the most basic level and how it can be
    useful as a general language construct, even if you aren''t using a database.
    LINQ may look like SQL, but this just a convenience so that LINQ can be used by
    people too lazy to learn new syntax.


    You need to think of LINQ as an attempt to bring “querying” type operations into
    the mainstream of the .NET language of your choice. LINQ isn''t really about database,
    this just happens to be a really good use of it. It''s a general purpose and extensible
    approach to working with structured data. In a more general setting you can think
    of it as yet another aspect of the way functional programming is making its way
    into .NET.


    A query is basically an operation where you specify a subset of the data that
    you actually want to work with. In many ways you can think of “querying” as the
    point where software creation becomes complicated and the real world enters the
    design problem. Simple data is messy, usually not organized in a way that suits
    the task is always more difficult and fragile than you could possibly imagine.
    LINQ can''t do anything about the inherent complexity of querying data, but it
    does deliver it in a uniform and integrated format.


    The key is that LINQ is a set of classes and methods that will work with any class
    as a data source as long as it implements the IEnumerable<T> interface. As, in
    a sense, this is the foundation on which the rest of LINQ is built, it is a good
    place to start. In fact, it is probably a good idea to take one step further back
    and look at the whole idea of enumerators.


    # Implementing An Enumerator


    The basic idea of an enumerator is to supply each item in a collection of data
    items one-by-one and usually in no specified order. In .NET an enumerator is a
    class that provides a number of methods in addition to the basic one-by-one enumeration
    of the items.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'To be specific an enumerator has to supply:


    +   * Reset – initializes the enumeration so that it starts over again

    * Current – returns the current item

    * MoveNext – updates the index to the next item


    Of course, this all implies that there is a numeric index before the current item
    which starts off at -1 to indicate that it "points" before the start of the collection.
    Calling Current repeatedly is allowed, but if the index is invalid then you are
    supposed to throw an exception. MoveNext returns true if the result is a valid
    index and false if the resulting index isn''t pointing to a valid item. Put together
    these three methods make up the IEnumerator interface and any class that supports
    enumeration does so by implementing this interface.


    You don''t have to use a separate class to implement IEnumerator, you can do the
    job in the same class that implements the inner workings of the data collection
    if that''s convenient. It is more usual to create the enumerator as a separate
    class and write a constructor that creates an instance of the enumerator ready
    to use.


    # # A Simple Enumerator


    To see the simplest possible example of an enumerator, let''s create everything
    in a single class. Our example is also going to be a little strange with regard
    to data collection in that no collection of data ever exists. Instead when the
    collection is instantiated the constructor is supplied with the size of the collection
    and from on a random number generator is used each time a data item is required.
    This is clearly not very useful for anything other than testing, hence the name
    of the class:


    ```

    class TestCollection:Enumerator

    ```


    Generating data also has the advantage that the example doesn''t use any of the
    existing collection data types which all supply enumerators and hence tend to
    confuse the issue. TestCollection doesn''t make use of anything pre-built in the
    .NET framework to implement its enumerator.


    To make it work you need to add:


    ```

    using System.Collections;

    ```'
