  md: "100% of both cores. In this itself might not exactly be a thing, as our parallel\
    \ loop is a bit of a processor hog, but these are the sort of simple decisions\
    \ that have to be made.\n\nThe bottom line is that the Parallel For is very easy\
    \ to use and produces a real gain in performance. It provides a lot for very little\
    \ effort. However, it comes with its own set of generators. We have seen that\
    \ it has apparently converted a loop that takes 6 seconds to one that takes 3\
    \ seconds, which doubling the machine's speed for free. However, unless you realize\
    \ this isn't magic then there could be problems.\n\nYou can't just convert any\
    \ loop for a Parallel.For and expect everything to work - it only works if the\
    \ loop is essentially a set of independent operations. This sounds easy, but it\
    \ can be difficult to spot because parallel implementation can render everything\
    \ you have come to expect simply wrong.\n\n# Accessing Earlier Results\n\nTo show\
    \ this in action let's implement the equivalent of the bread and jam shopping\
    \ list. It is a truth drummed into every programmer by experience that if you\
    \ have a for going in the positive direction then it is often perfectly safe to\
    \ access the results of earlier iterations.\n\nThat is, if you have reached index\
    \ in the loop it is OK to look at the result of index-1, or index-2 and so on,\
    \ but this isn't the case in a Parallel.For.\n\nChange the simple for loop to:\n\
    \n```\nbool flag = true;\nfor (int i = 0; i < size; i++){\n  data[i] = 1;\n  if\
    \ (data[new Random().Next(i)] == 0.0)\n    flag = false;\n}\n```\n\nMessageBox.Show(flag.ToString());\n\
    \nThe second statement in the loop checks to see if an earlier element in the\
    \ array is zero. The method Random().Next(i) generates a random integer in the\
    \ range 0 to less than i. As the loop progresses from data[0] to data[i] then\
    \ when you reach data[i] all elements up to data[0] have been set to a non-zero\
    \ value i.e. 1. That is, if you run this loop are guaranteed to see flag = true."
