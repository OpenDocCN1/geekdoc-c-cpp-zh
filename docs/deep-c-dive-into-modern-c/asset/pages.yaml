- img_proc: true
  md: 'At some point the work of the program has to be split off into another thread
    and then the problem changes from keeping the UI thread free enough to be responsive
    to getting changes to the UI implemented at all. This problem is caused by the
    very simple fact that the UI code is single-threaded and not thread safe. What
    this means is while it is fine for the UI thread to make any changes to the UI
    it isn''t OK for other threads to interact directly with the UI controls. A non-UI
    thread can''t simply print its results to a TextBox. Accessing the UI from a non-UI
    thread is generally called cross-threading and the invoke pattern is a good solution
    to the problem.


    # The Workings of Async - The Dispatch Queue


    A typical machine will have many threads of execution all managed by the operating
    system. This is how a machine can seem to be doing more than one thing at a time.
    If the machine actually has cores then it can really be doing more than one thing
    at a time because each core can run a thread of execution at the same time. Making
    use of multiple threads in a reliable and bug-free way is difficult - so difficult
    in many cases it is a good idea to confine programs to just one thread.


    A C# program has one default thread of execution – the User Interface, or UI.
    The reason it is generally called the UI thread is that its purpose in life is
    to look after the User Interface. The UI simply responds to events generated by
    the UI. An event is generally something that happens as a result of what the user
    does. For example, when the user clicks a button, a click event is generated.


    What happens is that the dispatcher maintains a queue of requests generated by
    UI events. Any event that occurs adds a record to the end of the queue with details
    of what code should run as a response to the event. The UI thread takes a request
    from the front of the queue and runs the code associated with the event. When
    the event completes the UI thread returns to the queue and deals with another
    request.


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_205_0.png)'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Notice that, once the UI thread starts to execute an event handler, it usually
    runs to completion before it moves to deal with another event from the head of
    the queue. In this sense a simple event handler blocks the UI thread and renders
    the UI frozen until it releases the UI thread to move on to another event handler.


    This continues until the queue is empty and all of the events have been dealt
    with. The UI thread then just waits for an event to occur.


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_206_0.png)


    You can see that this means that the user generates events and your program responds
    to them as quickly as possible and in the order in which they occur, but not necessarily
    at once.


    If you have understood this simple dispatcher mechanism you should be able to
    understand a great deal of otherwise strange behavior. For example, if you write
    an event handler that takes a long time to complete the user interface will appear
    to freeze because the UI thread cannot process any more events.


    In fact for a responsive UI what you really need is for the thread to be idle
    most of the time waiting for an event to occur. Whenever you are actually making
    use of the UI thread within an event handler then the user interface is frozen.


    The ideal C# single-threaded program does nothing but wait for a UI event. The
    big problem is that the UI is single-threaded and the only thread you have to
    do any work is the UI thread, you to find ways of using it that don''t make the
    user interface freeze up.


    As outlined in the previous chapter, C# in common with almost all modern languages
    have the ability to run more than just the UI thread, but it is worth pointing
    out that any thread can have its own event queue and can work in the same way
    as the UI. It is also tempting to think that the solution to the problem is to
    allow multiple threads to work with the UI so that it doesn''t freeze if there
    is a lot of work to do. The problem is that writing reliable multi-threaded programs
    is difficult. This is the reason most UIs are single-threaded.'
