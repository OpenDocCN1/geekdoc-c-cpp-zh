- img_proc: true
  md: '# Chapter 5


    # Inheritance


    Inheritance is a simple idea, until you try to make use of it. What''s a virtual

    method? How do you use override and new? It''s tricky when you look at the

    details. There are also all of the philosophical issues about what makes good

    maintainable code. In this chapter we look at the basics of inheritance and

    the subtle corners of the idea.


    # Simple Inheritance


    C#s inheritance mechanisms are particularly clean and easy, but let''s make

    sure that we know how they work.


    The fundamental class declaration in C# takes the form:


    ```

    class name: baseclass

    ```


    If you don''t specify a base class then the default class called object is used.

    Only a class can inherit and only from another class - structs always inherit

    object and can''t be used to create new structs or classes by inheritance.

    If you want to create a class that can''t be used as a base class for a new class

    then apply the sealed modifier to the start of the class definition - see

    Chapter 7.


    Note that C# only allows single inheritance, by contrast to C++ and

    Python, is something some of a relief! If you think C+''s ability to create

    classes from more than one base class is a good idea then you haven''t seen

    some of the stranger things that can happen when this powerful facility gets

    out of hand. The preferred approach to multiple inheritance is to make use of

    interfaces which define the type of what is to be inherited without supplying

    an implementation. There is no doubt that single inheritance is safer and can

    do everything that multiple inheritance can if you are prepared to approach it

    in the right way and do some additional work.'
  merge: -1
