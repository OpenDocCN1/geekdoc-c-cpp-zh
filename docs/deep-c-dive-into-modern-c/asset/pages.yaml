- img_proc: true
  md: "specified. Finally, every LINQ query expression has to end with a select. The\
    \ select is easy to use, but often not easy to understand how it is implemented.\
    \ The idea is that select performs a projection or transformation on the basic\
    \ data item used in the query. That is, it takes a data type and projects it to\
    \ a \"smaller\" subtype. This deserves a deeper explanation.\n\n# Custom Select\n\
    \nThe nature of the select depends on the nature of the data item. For example,\
    \ if the item takes the form of a row then a select can pick out individual columns.\
    \ If the data item is an array then it can select individual elements.\n\nYou\
    \ can see that selecting part of the data item could be a complex operation. It\
    \ helps greatly to know how LINQ works in terms of extension methods in understanding\
    \ what it does and how to make use of it. For example the definition of one method\
    \ is:\n\n```\npublic static IEnumerable<TResult> Select<TSource, TResult>n   \
    \ this IEnumerable<TSource> source,\n    Func<TSource, TResult> selector)\n```\n\
    \nYou can clearly see that you have to specify a source type and a result type\
    \ and a function that does the conversion between the two types.\n\nWhen you write\
    \ a C# query expression Select all you do specify the transformation function\
    \ and let the compiler work out the types of the source and result data. For example:\n\
    \n```\nvar q = from i in col\n    where i > 250\n    select i2;\n```\n\nThe final\
    \ select creates a function:\n\n```\nFunc<int, int> MySelect<i->i2;\n```\n\nand\
    \ passes the call to the Select method, as a lambda expression:\nvar q = col.Where<int>(i\
    \ => i > 250).Select<int,int>(i=>i2);\n\nA little thought reveals that this mechanism\
    \ is more sophisticated than it looks. For example, you can call methods defined\
    \ in the source data type to perform more complicated data transformations such\
    \ as:\n\n```\nvar q2 = col.Where<int>(i => i > 250).\nSelect<int,string>(i=>i.ToString());\n\
    ```\n\n```\nforeach (string o in q2)\n{\n    MessageBox.Show(o);\n}\n```\n\nOf\
    \ course, you can add custom methods to the class that do much more bynway of\
    \ conversion and manipulation."
