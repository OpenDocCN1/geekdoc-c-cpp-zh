  md: 'The Action delegate is a set of delegates like:


    ```

    Action()\nAction<T1>()

    Action<T1,T2>()

    ```


    so on and the Func delegate is a set of delegates like:


    ```

    Func<TResult>

    Func<T1, TResult>

    Func<T1, T2, TResult>

    ```


    so on. They provide delegates suitable for functions with a different

    number of parameters and a return type. Task has constructors for Action(),

    Func<TResult>, Action<object> and Func<object, TResult>. That is that you

    have one or no parameters and a result or no result.


    The previous example using functions A and B can be written

    using Tasks as:


    ```

    Action AA = new Action(A);

    Task T1 = new Task(AA);

    Action AB = new Action(B);

    Task T2 = new Task(AB);

    T1.Start();

    T2.Start();

    T1.Wait();

    T2.Wait();

    textBox1.Text = count.ToString();

    ```


    Notice that we use Wait to halt the current thread until the Task is complete.

    This isn''t the shortest way to write this code, but it shows the stages of

    dendecreating the delegate, then the Task and starting it running.


    The simplest version is probably:


    ```

    Task T1 = Task.Run(A);

    Task T2 = Task.Run(B);

    Task.WaitAll(new Task[] { T1, T2 });

    textBox1.Text = count.ToString();

    ```


    The Run method takes a function of the correct type, creates a Task and runs

    it. The WaitAll method waits for all of the Task objects in the array to finish.

    The existence of Wait, WaitAll and WaitAny are good reasons for preferring

    tasks to threads. There is also When, WhenAll, WhenAny which run a Task when

    the specified tasks ends. Notice that the When methods provide an easy way to

    chain Tasks so that one starts when one ends.


    If you want to pass parameters to the Task you can use the alternative

    constructor and an object:


    ```

    Task(Action,object)

    Task<TResult>(Func<TResult>,object)

    ```


