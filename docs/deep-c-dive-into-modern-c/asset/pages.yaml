  md: '# # Chapter 13


    # ## Multicast Delegates


    Multicast delegates are useful in their own right, but they also form the basis
    on which the C# event system is built. In this chapter we take a close look at
    how they work and how to use them. For example, did you know you could add and
    subtract delegates?


    A Delegate is a class that wraps a method so that it can be used in more sophisticated
    ways, such as being passed as a parameter to another method. But delegates are
    also ways of making lists of methods that can be called in sequence when the delegate
    is invoked. Now that you know how delegates work, it''s time to look at the multicast
    delegate and their relationship to events.


    # ### Multicast


    If you look at the documentation you find a Delegate class and a class derived
    from, MulticastDelegate. In theory, the Delegate class can encapsulate a single
    method and the MulticastDelegate maintains a list of methods and so can encapsulate
    more than one method. In practice, this isn''t true. Early on the development
    of C# it was decided that Delegate and MulticastDelegate should do the same job
    and be merged. However, merging them would have created too many problems, so
    Delegate was left as the base class for MulticastDelegate, but the two are essentially
    identical.


    At this point you might imagine that you would never use the Delegate class, but
    in fact it is still returned by methods that expect to return a single method
    encapsulated by a Delegate. It also used to be the case if you created a delegate
    which returned void then it was encapsulated by a MulticastDelegate, but if it
    returned a result then a Delegate was used. This distinction was made because
    of the difficult of determining which method''s return value was actually returned
    in a multicast invocation. However, this was solved by simply encapsulating all
    methods using MulticastDelegate and, in a multicast situation, the last method
    called is the only one that returns a result.'
