  md: '# Chapter 2


    # Strong Typing


    C# is a language that started out in the style of Java with strong typing and
    very little extra. Over time it has added features in a careful and thoughtful
    way to include things that you might not associate with a strongly typed, "traditional"
    object-oriented language. For this is what makes C# special. Today C# has late
    binding with dynamic typing. This provides the modern C# with idioms that previously
    would have been out of the question. Dynamic typing goes directly against the
    static strong typing that is supposed to catch many errors at compile time that
    otherwise would appear at runtime.


    The worry is that by introducing such loose practice C# become a mess by adopting
    models that go against its birthright of strict typing and object-oriented procedural
    code. What is interesting is the way that C# combines the best of both worlds
    - but if you see you.


    # Strong Typing and Type Safety


    Strong typing, which is a guiding principle for C#, is also the facto for most
    languages. The exceptions, Python and JavaScript, for example, suffer much criticism
    for not being strongly typed and they are also subject to maintainers who slowly
    try to convert them into strongly typed languages in one way or another. As already
    mentioned, C# has been moving in the opposite direction. Starting out with nothing
    but strong types it has been adding features that attempt to make it easy to use
    as some of the dynamically typed languages. However, every modification to C#
    has tried to preserve its strong typing and type-safe approach. It is still a
    guiding principle and it is important to understand what it is about and what
    its advantages and disadvantages are.


    The first problem we have to overcome is that not everyone is very clear about
    "strong typing" means. So the first thing to investigate is the nature of strong
    typing.'
