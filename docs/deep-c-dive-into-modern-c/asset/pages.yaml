    We clearly have the conclusion that


    MyClassA > MyClassB


    implies:


    MyFunction1(MyClassA a)<MyFunction2(MyClassB a)


    This is called contravariance and, in general, we say if A>B means that G(A)<G(B)
    where G is a type that involves the classes A and B, then the relationship is
    contravariant.


    Put in even simpler language, if you construct a new type involving then it is
    contravariant if the construction reverses the “use in place of” relationship.
    Inputs are relationship contravariant for the reasons outlined above. In physics
    and mathematics inputs are generally contravariant and this is where the nomenclature
    comes from.


    Now consider the same argument for output. Consider:


    MyClassA MyFunction1()


    and:


    MyClassB MyFunction2()


    For MyFunction1 the return type is MyClassA and MyFunction2 returns a MyClassB.
    If you use a call to MyFunction1 in some of your code you can safely replace the
    call by one to MyFunction2. The reason is, of course MyFunction2 returns a MyClassB,
    which has everything MyClassA has and your code will continue to work. However,
    if you use MyFunction2 in your code you are assuming that you get a MyClassB as
    a result and you cannot replace it by a call to MyFunction1, which only returns
    a MyClassA, which might not have methods you.


    This means that MyFunction1>MyFunction2 because MyFunction2 can be used anywhere
    MyFunction1 can. In this case we have


    MyClassA > MyClassB


    implies


    MyClassA MyFunction1() > MyClassB MyFunction2().


    This is an example of covariance and in simple terms means if you construct a
    new type involving an existing type, then it is contravariant if the construction
    follows the same “use in place of” relationship. In general, outputs are covariant.
    As in the case of contravariance, the terminology comes from physics and mathematics
    where outputs are generally covariant.'
