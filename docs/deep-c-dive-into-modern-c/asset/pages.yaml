- img_proc: true
  md: '# Chapter 17


    # Async Wait


    The async/await asynchronous programming facilities in .NET solve one of its longstanding
    problems - how to write an elegant application that uses the UI correctly. But
    to avoid problems you still need to understand both the problem and the solution.


    As we have seen in the previous chapter, one of the biggest problems facing any
    Windows Forms, WPF or MAUI programmer is that you can''t use the UI thread to
    do much work. If you do, the result is an unresponsive application. The proper
    solution is to use a new thread to do all of the heavy computation and leave the
    UI thread free to do on what it is supposed to deal, with user events. However,
    the computation usually has to provide evidence that it has done something and
    this means it has to interact with the UI components.


    As well known, UI components are not thread-safe- hence the rule that the thread
    created a component can access it. You can optionally turn this rule off and allow
    the worker thread to access the UI, but this isn''t a good idea. The correct way,
    as described in the previous chapter, to allow the worker thread to access the
    UI is to use the Invoke method in the worker thread to ask the UI thread to run
    a delegate that does the update using data provided by the worker thread. This
    may be the correct way, but it results in very messy code and given it is a common
    requirement, we could do with a simpler way of implementing two or more threads
    working with the UI and where this async and await come into the picture.


    The Invoke method allows a worker thread to run code on the UI thread. This has
    the advantage of allowing the worker thread to interact with the UI thread when
    it has something to say. The UI thread is not blocked waiting for the worker thread
    to complete or have an intermediate result. The async/await method turns this
    approach on its head and allows the UI thread to run code on another thread in
    an organized way that doesn''t block the UI thread. The problem is once the UI
    thread starts a worker thread it somehow has to deal with any result it returns.'
  merge: -1
  pgno: 218
- img_proc: true
  md: "Without async/await the only option is to either block the UI thread while\
    \ the worker thread does its thing or supply a callback that the worker thread\
    \ can wake up on the UI thread to process the result. The async/await mechanism\
    \ does the same thing, but much more elegantly. It allows the UI thread to be\
    \ freed to get on with processing events until the worker thread completes when\
    \ the UI thread will seem to continue from where it left off. It’s “I’ll comeback\
    \ to you when you are ready” mechanism.\n\n# Hands-On Example\n\nStart a new Windows\
    \ Forms project and place two text boxes and one button - the button will start\
    \ the process off and the text boxes will record its progress. The example given\
    \ will work perfectly with WPF with only changes to the controls and your names.\n\
    \nFirst let’s look at the problem that we are trying to solve. The Button’s click\
    \ event handler calls a method that does its of work:\n\n```\nprivate void button1_Click(object\
    \ sender, EventArgs e)\n{\n    textBox.Text = \"Click Started\";\n    DoWork();\n\
    \    textBox2.Text = \"Click Finished\";\n}\n```\n\nYou can see that the first\
    \ two text boxes are changed to show what is happening. For the purpose of this\
    \ example, DoWork can be simulated by a routine that just loops and keeps its\
    \ thread occupied. You get the same overall result for the purpose of deWork can\
    \ simply waits for an I/O operation to complete - the important point is that\
    \ as written it keeps the attention of the UI thread until it is complete. That\
    \ is: \n\n```\nvoid DoWork()\n{\n    for (int i = 0; i < 10; i++)\n    {\n   \
    \     Thread.Sleep(500);\n    }\n}\n```\n\nkeeps the UI thread busy for 5 seconds\
    \ and to use Thread.Sleep you also have to add:\nSystem.Threading.\n\nWhat do\
    \ you think you see if you run this program? If you aren’t familiar with the way\
    \ that single-threaded UI works with a dispatcher, you might think that you see\
    \ Click Started appear and then, after 5 seconds, Click Finished. What actually\
    \ happens is that you see both messages appear after the 5"
  merge: -1
  pgno: 219
- img_proc: true
  md: "seconds are up, during which time the UI is frozen. The reason for this behavior\
    \ is simply that the UI is frozen from the moment the DoWork method is called\
    \ and this is usually before the \"Click Started\" text has been rendered to the\
    \ display. This is exactly the reason you don't want any intensive computation\
    \ on the UI thread - in you really don't want any computation on the UI thread\
    \ at all! The ideal UI thread is idle for most of the time, ready to respond to\
    \ the user's input.\n\n# Async and Await\n\nNow we can look at how to implement\
    \ this property using async and await. The first thing is to know that any method\
    \ that you put async in front of an asynchronous method, which means it can be\
    \ started and stopped rather than just run from first to last instruction. We\
    \ could create a new method and mark it as asynchronous, but to keep the example\
    \ as much like the synchronous method described above we can simply change the\
    \ click event handler into an asynchronous method:\n\n```\nprivate async void\
    \ button1_Click(object sender, EventArgs e)\n{\n    textBox1.Text = \"Click Started\"\
    \n    await DoWork();\n    textBox2.Text = \"Click Finished\"\n}\n```\n\nIf you\
    \ do this the compiler will complain that you have an asynchronous method without\
    \ any awaits and so it will run as a synchronous method anyway. To take advantage\
    \ of the asynchronous nature of the new event handler we have to await the completion\
    \ of the DoWork method. However, if you write:\n\n```\nprivate async void button1_Click(object\
    \ sender, EventArgs e)\n{\n    textBox1.Text = \"Click Started\"\n    await DoWork();\n\
    \    textBox2.Text = \"Click Finished\"\n}\n```\n\nthe compiler will complain\
    \ that you can't await a method that returns a void. Any method that you preface\
    \ with await has return a Task or a Task<T> object where T is the type you would\
    \ normally return. In this case nothing is returned unless we use a simple Task\
    \ object.\n\nThe next question is what Task object do we actually return? The\
    \ answer is that we have to create a Task that runs the worker code on a different\
    \ thread. This how the UI thread can be released to do some other work and where\
    \ the multi-threading comes into the picture. The awaited function generally creates\
    \ a Task which does the work on another thread and this it"
  merge: -1
  pgno: 220
- img_proc: true
  md: "returns at once for the awaiting code. Notice that this means that the UI is\
    \ blocked for all the time it takes to get to the return of the Task and clearly\
    \ this needs to be minimized as much as possible. When the awaited function returns,\
    \ the UI thread is free to get on with whatever events need to be processed. When\
    \ the Task is finished the UI thread continues from the await. In this sense the\
    \ code that comes after the await is much like like a callback.\n\nThere are a\
    \ number of possible ways of creating a Task to do the job, but the simplest is\
    \ the Task.Run method that will take a delegate or a lambda expression and run\
    \ it using the thread pool.\n\nSo the new DoWork() is:\n\n```\nTask DoWork()\\\
    {\n    return Task.Run(() =>\n{\n        for (int i = 0; i < 10; i++)\n      \
    \      Thread.Sleep(500);\n    }\n});\n```\n\nYou could use a delegate or an anonymous\
    \ method to define the code to run, but a lambda expression is so much easier.\
    \ This completes the conversion of the synchronous implementation to asynchronous.\n\
    \nNow what do you expect to see if you run the program? The answer is what you\
    \ see what you would expect to see by a naive reading of the original program.\
    \ That is, first you see Click Started appear, then there is a 5-second wait and\
    \ Click Finished.\n\nThis looks as if the DoWork method has been run in a blocking\
    \ synchronous way, but no. The first showed what happens if DoWork is run in a\
    \ blocking synchronous way and this is different! If you look at the program more\
    \ carefully you will also notice that the UI is responsive between the two messages\
    \ appearing and we have solved the problem of unresponsive UI.\n\n# Inner Workings\n\
    \nSo what is happening? Let's take a detailed look. At this point I have to say\
    \ that the purpose of constructs such as async and await is to hide the details\
    \ of what is going on behind the scenes, but it still helps have a rough idea\
    \ of what is happening."
  merge: -1
  pgno: 221
- img_proc: true
  md: 'What happens when the user clicks the Button is that the event is added to
    the dispatcher''s queue and the UI thread eventually gets round to processing
    it. This takes the UI thread to the button1_Click event handler and the UI thread
    updates textBox1. This doesn''t result in the change being rendered at this point,
    however.


    Next the UI starts to execute the DoWork method but in this case it is executed
    via an async await method it doesn''t happen in the usual way. The UI thread creates
    the Task with the lambda expression that does all the work and returns to the
    event handler.


    At this point what happens next might surprise. When the UI thread returns from
    DoWork event handler also executes a return and the UI thread goes back to the
    dispatcher to deal with any events that need dealing with. That is, the await
    frees the UI thread and pushes the event handler into an inactive, waiting, state.
    If you know the yield command in Ruby, JavaScript and so on you will recognize
    this as just an operation.


    Of course, all the UI is dealing with events and getting on with other stuff,
    the instructions in the Task that was returned by DoWork are being obeyed by the
    worker thread and 5 seconds later the Task completes.


    At this point the need for the UI thread to return to the event handler is added
    to the dispatcher''s queue and starts executing the event handler from where it
    left it - i.e. just after the `\uawait`. You might recognize this as a "continuation",
    a construct found in other languages such as Ruby, Haskell and Scheme.


    At this point the "Click Finished" message is executed and after this the event
    handler finishes in the usual way and once again the UI thread can return to the
    dispatcher queue for more things to do.


    The await causes the UI thread to return to the calling code, the dispatcher in
    this case, and then it causes the UI thread to pick up where it left off when
    the `Task` completes, a continuation.


    This may sound complicated and it is even more complicated if you inquire a little
    deeper into how it is all achieved. In particular the state of the event handler
    has to be saved when the await is obeyed and restored when the event handler resumes.
    But from the programmer''s point of view it looks as if the `\await` has run the
    task in DoWork while letting the UI thread get with other things and then has
    called the UI thread back to finish the event handler once the Task is complete.'
  merge: -1
  pgno: 222
- img_proc: true
  md: "Notice that all of the code in the event handler and DoWork is run on the UI\
    \ thread - only the lambda expression in DoWork is run on a different thread.\
    \ To make the point even more forcibly that await simplifies things compare the\
    \ two versions and their flow of control:\n\n```\nprivate async void button1_Click(object\
    \ sender, EventArgs e)\n{\n    textBox.Text = \"Click Started\";\n    DoWork();\n\
    \    textBox.Text = \"Click Finished\";\n}\n```\n\nThis looks as if it should\
    \ display the first message, do something for 5 seconds and then display the second\
    \ message, but course it doesn't. Adding the await command makes it do exactly\
    \ that:\n\n```\nprivate async void button1_Click(object sender, EventArgs e)\n\
    {\n    textBox.Text = \"Click Started\";\n    await DoWork();\n    textBox.Text\
    \ = \"Click Finished\";\n}\n```\n\nIn the second case the apparent flow of control\
    \ through the event handler coincides with what it appears to be.\n\n# Pitfalls\
    \ and Dangers\n\nIf you have used the DoEvents command in Visual Basic or some\
    \ other eventhandling construct in other languages, you might see that this is\
    \ a very similar mechanism in that it allows the UI thread to process the Dispatch\
    \ queue, but notice that this is more sophisticated in that another thread is\
    \ used to do the work.\n\nJust as there were dangers in using DoEvents and similar\
    \ constructs, there are even more dangers in using async/await. For example, as\
    \ the UI stays responsive, the user can click the button more than once and create\
    \ multiple tasks. Usually this is not a good idea and so the event handler usually\
    \ disables the button while the task is running:\n\n```\nprivate async void button1_Click(object\
    \ sender, EventArgs e)\n{\n    button1.IsEnabled = false;\n    await DoWork();\n\
    \    button1.IsEnabled = true;\n}\n```\n\nIf you try writing this simple idea\
    \ using threads and callbacks you will see just how neat the async/await pattern\
    \ is."
  merge: -1
  pgno: 223
- img_proc: true
  md: "This example just gets us started because it raises a few questions of its\
    \ own. In particular, we still have the problem of allowing the worker code to\
    \ update the UI. The key factor is that the event handler can update the UI each\
    \ time it is restarted so we could use an approach where the work is broken into\
    \ chunks which return to the event handler for an update, for example:\n\n```\n\
    private async void Click(object sender, EventArgs e)\n{\n    button1.IsEnabled\
    \ = false;\n    await DoWork();\n    textBox1.Text = \"First work done\";\n  \
    \  await DoWork();\n    textBox2.Text = \"second work done\";\n    button1.IsEnabled\
    \ = true;\n}\n```\n\nIn this case happens that DoWork runs for 5 seconds and then\
    \ summons the UI thread back to continue the event handler from where it left\
    \ off. This results in the First work done being displayed. Then the second await\
    \ lets the UI thread get on processing the Dispatcher queue, only to be called\
    \ back to continue from where it left off 5 seconds later. Hence we see the second\
    \ work done update message.\n\nYou could break work down into chunks like this,\
    \ even put the chunks into a loop, say to automate the process:\n\n```\nprivate\
    \ async void Click(object sender, EventArgs e)\n{\n    button1.IsEnabled = false;\n\
    \    for (int i = 0; i < 5; i++)\n    {\n        await DoWork();\n        textBox1.Text\
    \ = \"Chunk \"+i.ToString();\n    }\n    button1.IsEnabled = true;\n}\n```\n\n\
    However, if all you want to report the progress of a longer computation via the\
    \ UI, then there is an alternative way of doing the job by passing in a method\
    \ that can be called on the UI thread by the worker.\n\n# Getting Results\n\n\
    An even more important issue, however, is how the worker thread can return a result.\
    \ For simplicity all of the examples so far have returned void, but in real life\
    \ the worker usually returns some value, usually a complex object. Getting results\
    \ back turns to be remarkably easy."
