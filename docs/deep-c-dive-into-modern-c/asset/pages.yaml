  md: '# Outline Of This Book


    This book is not a C# primer or a reference guide and you are expected already
    to know the basics of C# and have some idea of programming practices, in particular
    object orientation. The book is a look at some of the deeper ideas in the language.
    Hence it isnt complete and is more an exploration of the more interesting topics.
    Each section and chapter is relatively self-contained even when this results in
    some slight repetition and cross references.


    It is divided into six sections


    +   I. Strong Typing &; Type Safety

    This is really the core philosophy of C# and yet it is rarely explained or discussed.
    In this section we look at what strong typing is and how it makes type safety
    possible. Along the way we look at the differences between value and reference
    specifically class and struct. Inheritance is also a key part of type - without
    type safety would be irrelevant and so we need to be sure it is fully understood
    along with multiple inheritance is implemented using interfaces.


    +   II. Casting &; Generics

    The problem with strong typing is that it limits how easy it is to do some things.
    The first solution to the problem is casting – stating the type of an object to
    override typing. A more sophisticated solution is to use generics and finally
    to allow dynamic typing.


    +   III. Functions

    C# didn''t take the option of making functions objects, instead it opted to use
    a wrapper class – the delegate – to convert functions into objects. Over this
    idea has been developed to allow more and more functionality until we finally
    reach the pinnacle of the easy-to-use function - the lambda complete with closure.


    +   IV. Async

    C# isn''t a naturally asynchronous language in the sense that it isn''t wedded
    to any particular UI framework, but it still needs to use asynchronous operations.
    The first approach to the problem was to use threads, then the task parallel library
    came along and finally the oh-so-easy to use async and await.'
