  md: '# Delegate Basics


    What is initially confusing is that to create a delegate you first have to create
    a type and then create an instance of the type. That is, a delegate is a userdefined
    reference type that encapsulates a method. Consider, for example, how to encapsulate
    the simple example method:


    All this does is display the current value of param1 and then return an incremented
    value.


    First, we need to define a delegate that matches its signature, including the
    return type:


    ```

    delegate int HelloType(int param);

    ```


    This delegate defines the methods that it can encapsulate. Notice that it is only
    the function''s signature and return type that specifies the delegate type. The
    HelloType delegate can wrap any function that has the specified signature and
    return.


    Next, we have to create an instance of the type and supply it with the hello method
    to encapsulate:


    ```

    HelloType HelloInst = new HelloType(hello);

    ```


    If you prefer you can use the overloaded assignment operator:

    HelloType HelloInst = hello;


    to create an instance.


    Now we can run the original hello method by calling it directly in the usual way:

    int i = hello(2);


    or using the delegate''s invoke method:

    int i = HelloInst.Invoke(2);


    or by calling the delegate instance as if it was the hello method:

    int i = HelloInst(2);


    This last form is just a convenience as it implicitly uses the Invoke method.

    Notice that the default use of the Invoke makes the delegate instance look like
    a function object. That is HelloInst is an object but HelloInst(2) looks like
    a function call.'
