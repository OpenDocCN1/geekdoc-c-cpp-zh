    instruction:

    root.SetElementValue("Tel","123");


    will set an existing Element child of root with XName "Tel" to a value of "123"
    or if such a Element doesn''t exist it will first create a new instance.


    There is some apparently odd behavior in that the value "123" is applied between
    a new pair of tags <Tel>123</Tel> but it is also appended to root''s Value property
    as if it was new text located between <root></root>. The reason for this is that
    if the Value property is the concatenation of all the Text objects contained within
    its opening and closing tags. This makes the Value property less than helpful.
    Notice that if you add some additional text in the form of a string it is simply
    added to any existing Text object as a concatenation. If you firstly explicitly
    create Text objects and add these when you get new child objects, which seems
    reasonable behavior.


    The SetAttributeValue works in the same way but on the Attribute collection. For
    example:

    root.SetAttributeValue("Epoch", "2000");


    updates or if an Epoch attribute. As an attribute generally has only one value,
    its Value property is much useful.


    Two other useful methods are AddBeforeSelf and AddAfterSelf which, as their names
    suggest, allow the adding of elements above and below the current element in the
    tree.


    There are lots of other methods that modify the tree structure, but they are all
    fairly obvious and no surprises, check the documentation for details.


    # Values


    XML is a standard format for data and just occasionally we need to actually access
    the data. As already mentioned, if an Element has a single Text child then you
    can access this data as a string using the Value property. However, if it has
    multiple Text child objects, perhaps contained within other Element child objects,
    the Value property contains a concatenation of these strings. This makes processing
    data contained within tags a matter of navigating down to the Element object which
    corresponds to the last pair of tags that enclose the question. Again, as already
    mentioned, XAttributes are easier to deal with in this sense they always correspond
    to a single name/value pair. In this case the Value property always contains the
    data we are interested in. For simplicity the following examples will deal with
    XAttributes, but the same methods work with'
