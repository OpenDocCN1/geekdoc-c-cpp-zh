- img_proc: true
  md: '# Variable Type and Object Type


    As we have already seen, when you create an instance of a class you first create
    a reference variable of the correct type. For example:


    ```

    class MyClassA {};nMyClassA MyA;

    ```


    doesn''t create an instance of MyClassA - only a reference variable capable of
    pointing to an object of type MyClassA. You have to be careful how you phrase
    such ''pointing to an object'' C# doesn''t have pointers as.


    After declaring a reference variable you can set it to point to, or reference,
    a new instance of the class using:


    ```

    MyA = new MyClassA();

    or putting this together:

    ```


    ```

    MyClassA MyA = new MyClassA();

    ```


    Notice that there are two things going on here – the type of the variable making
    the reference and the type of the object it references. In a simple world these
    would always be the same.


    If you create a class that inherits from MyClassA:


    ```

    Class MyClassB:MyClassA;

    ```


    then any instance of MyClassB starts out with all the methods defined in the definition
    of MyClassA. What inheritance is all about - code reuse. If MyClassA has a show
    method then now does MyClassB and without having to write a single line of code.


    Notice that this means that MyClassB has two types of method - those that are
    defined as part of MyClassA and that are defined within it.


    If you simply use the inherited methods of MyClassB you can simply use them as
    if they were "native" to MyClassB.


    For example:


    ```

    MyClassB MyB = new MyClassB();

    MyB.show();

    ```


    results in the show method defined in MyClassA being called.


    There is one small complication - if the methods of class MyClassB need to call
    the methods defined in class MyClassA? One of the advantages of single inheritance
    is that if you want to call the base''s methods you can do with a single keyword
    base because you don''t have to specify which base class is to use as there is
    only one. For example, if MyClassB inherits a method "show" from MyClassA then
    MyClassB can call the method using:


    ```

    base.show();

    ```


    In practice you can omit base as long as there is no ambiguity, i.e. if MyClassB
    doesn''t have a show method.'
