  md: "# Casting and Overriding\n\nYou need to be aware that considerations of virtual\
    \ versus non-virtual inheritance also come into play with both up- and downcasting.\
    \ If a method is defined to be virtual then it is late bound. If a method isn't\
    \ virtual, or if the override uses the new modifier, then it is early bound.\n\
    \nForcasting the way that this has already been described in Chapter 5. If ClassB\
    \ inherits MyMethod from ClassA and overrides it then:\n\n```\nClassA myA = new\
    \ ClassB();\nmyA.Method();\n```\n\nwill call the method defined on ClassB if it\
    \ was declared virtual and the method defined on ClassA if it wasn't declared\
    \ virtual or if new was used in the ClassB override.\n\nThe same considerations\
    \ apply to downcasting, but things are a little bit more complicated because,\
    \ as already mentioned, a downcast usually involves an earlier upcast. The downcast\
    \ is always early bound, but any upcast is late bound depending on how the methods\
    \ are declared. An example should make this clear.\n\nSuppose we have three classes\
    \ which form an inheritance chain and each of the methods is non-virtual and hence\
    \ early bound:\n\n```\nclass ClassA {\n    public void MyMethod() {\n        Console.WriteLine(\"\
    A\");\n    }\n}\nclass ClassB : ClassA {\n    public void MyMethod() {\n     \
    \   Console.WriteLine(\"B\");\n    }\n}\nclass ClassC : ClassB {\n    public void\
    \ MyMethod() {\n        Console.WriteLine(\"C\");\n    }\n}\n```\n\nNow we can\
    \ implement a downcast:\n\n```\nClassA myA = (ClassA) new ClassC();\n((ClassB)\
    \ myA).MyMethod();\n```"
