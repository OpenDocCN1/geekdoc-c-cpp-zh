  md: "# Chapter 20\n\n# XML\n\nC# has some really easy-to-use facilities for creating\
    \ and editing XML,\neXtensible Markup Language. Many of these facilities were\
    \ introduced to\nmake LINQ to XML work better, but you can make use of them in\
    \ more\ngeneral situations. There always was good XML support in .NET, but LINQ\n\
    adds a set of classes that makes it easier to work with XML, particularly\nyou're\
    \ not an XML specialist.\n\nThere are a number of standard protocols and ways\
    \ of working with XML,\nXpath, SAX, DOM and so on. All of them are good but they\
    \ all focus on\nspecific particular aspect of XML and a particular way of getting\
    \ the job done.\nLINQ's version of XML goes “back to basics”.\n\nEven if you're\
    \ not interested in working with XML, looking at how LINQ\nhandles a more complicated\
    \ data structure, a tree in this case, is instructive\na lot to teach you about\
    \ how the LINQ is designed, how it works and\nhow you might extend it to other\
    \ data structures. In this chapter we look at\nhow to construct the tree structure\
    \ that XML is all about and in the next we\nlook at how to use such structures\
    \ with LINQ.\n\n# Tag Rules and Tree Structure\n\nThe core of XML is the tag as\
    \ an opening tag, e.g. <Record> and a closing\ntag, e.g. </Record>. The rules\
    \ for XML are simple – tags occur, almost always,\nin matched pairs and you nest\
    \ tags as they were brackets. The only\nexception to the matched pairs rule is\
    \ a tag that is its own closing tag, as in\n</Record> which opens and closes the\
    \ tag in one go. This is, of course\nsimilar to HTML.\n\nIt's not difficult to\
    \ show that you can use tags to build a general tree structure\n all you need\
    \ to represent it in a program is a class that has a collection of\nitself as\
    \ a property. This is exactly how the xNode class, and the more useful\nxElement\
    \ descended from via xContainer, operate. The important point is\nthat xElement\
    \ has a Nodes collection which can be used to store an element's\nchild elements."
