  md: '# Blitable Types, In, Out and Pinning


    The term "blit" means that the representation of the managed and unmanaged types
    are the same. You can "blit", i.e. copy, the bit pattern of a blitable data type
    as a block and simply start it at its new location. If this is possible marshaling
    is very easy because all that is involved in a block copy and perhaps creating
    a pointer to pass to the unmanaged function. Of all the basic .NET data types,
    .NET uses the same representation for numeric values and pointers. Also all arrays
    are blitable.


    At this point you might be hard pressed to imagine a non-blitable type. A good
    example is almost any date and time representation. These tend to differ in their
    layout in memory and marshaling involves rearranging the data. If you think for
    a moment it should be clear that all of these non-blitable types are essentially
    formatted data or structs, see Chapter 27.


    If a blitable parameter is passed by value then it is copied to the unmanaged
    stack without modification. A reference type is also passed by value, but as a
    pointer - what? If the managed code references a blitable we have the option of
    not making a copy or making a copy and adjusting the pointer to the new copy.
    If no copy is made the original data is pinned in place and cannot be moved by
    the system so that the unmanaged code does not lose track of its data. Pinning
    is usually automatic, but there are occasions when you need to use it to make
    sure that a block of data isn''t moved while you are working with it. When data
    is not-pinned, it is copied, then you have the option of asking the system to
    make a copy of the data when the unmanaged code has finished for the managed code
    to work with. Usually the system works out but you can control what happens when
    using the In and Out attributes. Any parameter marked as Out is only copied from
    the managed code to the unmanaged. Any parameter marked as In is only copied from
    the unmanaged code. Using both In and Out allows two way copying. Notice that
    the system uses In for any reference type and Out for a parameter. StringBuilder
    is an exception to this rule and is passed as [In, Out]. So, for example, the
    previous StringBuilder buffer example could be declared as:


    ```

    static extern void GetText(IntPtr hWnd, [In, Out]StringBuilder lpString, int nMaxCount);

    ```'
