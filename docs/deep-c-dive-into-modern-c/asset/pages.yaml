    # Using PInvoke


    Getting a PInvoke function declaration right can often be difficult due to subtleties
    in the way that managed and unmanaged types can be used. However, once you have
    a declaration that works using it is often very easy and obvious. Clearly there
    is scope for sharing interop declarations and this is what the PInvoke.NET wiki
    sets up to do. If you visit https://www.invoke.net will find an extensive collection
    of declarations relating to a wide range of APIs. At this point you might think
    "why learning about interop - why not just use the declarations?" The answer is
    that many of the declarations often need tweaks to make them work in your particular
    situation and this requires understanding. In addition, there are some functions
    that haven''t been converted yet and you might need to modify one of the existing
    declarations. There is also the small matter that you can create declarations
    which allows your custom .NET code to be called by unmanaged programs and these
    won''t be in any predefined catalogs.'
