  md: '# # Chapter 25


    # # Custom Attributes


    Attributes don''t really seem to be necessary as part of a programming language.
    After all why "decorate" code with attributes when you can achieve the same results
    by more direct routes? In nearly all cases an attribute is an excuse for not implementing
    a property that does the same job. However, attributes provide a useful extension
    to the standard language syntax and a way of adding features after the event and
    without having to extensively rework the classes that attributes are applied to
    as exemplified by the interop facilities that we''ve looked at earlier chapters.
    In this context attributes are a natural way to apply modifiers to default behavior.
    In other words, the classes you apply attributes to don''t necessarily need to
    know anything you apply. In this sense attributes have been likened to "code patching"
    brought-to-date.


    **You can use an attribute to add a behavior without modifying the core code and
    you can take this behavior just as easily.**


    C# has supported andfully employed attributes for some time, but there is still
    a great deal of confusion when custom attributes might or not be useful.


    # # Runtime Metadata


    .NET is an item of data associated with a programming construct that is stored
    in the assembly and can be accessed by the use of reflection. Some confusion is
    caused by the fact that some built-in attributes additionally affect the way that
    the compiler sees to work. In the main is not something that most attributes,
    and certainly not custom attributes, do. Essentially a custom attribute is a "code
    comment" that gets compiled into code, as metadata, and which other code, including
    your own, can retrieve and act on.


    This is the standard explanation of an attribute, but the attribute mechanism
    has more to offer. When you retrieve an instance of a class that represents the
    attribute is created. Understanding how this mechanism works means you can think
    about exactly how attributes might be useful and how things can go wrong.'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'There is a sense in which an attribute can always be replaced by a property.
    For example, you might mark a class as using ASCII encoding for its text and hence
    implement [ASCII] attribute. Any other class that makes use of a class marked
    would have to inspect it to discover that it was ASCII and then arrange to treat
    it correctly.


    It should be fairly obvious that an alternative is to use an ASCII property set
    to true or false to indicate the same information. Notice that the two approaches
    have some similarities and some differences:


    +   - Any client that uses the class to implement retrieving the attribute or
    the property and act accordingly, that is, nothing is enforced in either approach.

    - A property can be set at compile time and be changed at run time. An attribute
    on the other hand is set at compile time and generally isn''t changed at run time.

    - A property is associated with instances of a class but an attribute can be associated
    with many different entities, including classes, methods, parameters and so on.


    # Attributes don''t change and can be associated with a range of entities


    This seems to sum up the situation, but notice that with such a flexible implementation
    you can always change the ways things work. This is the standard and most appropriate
    way of working with attributes.


    # Implementing a Custom Attribute


    Implementing a custom attribute such as [ASCII], mentioned in the previous section,
    is fairly easy as long as you don''t read into it more than there is. All you
    have to do is create a class that inherits from Attribute:


    ```

    public class ASCIIattribute : Attribute

    {}

    ```


    It is usual to use a name of the form xAttribute and if you do the system treat
    the names X and xAttribute as the same. Unfortunately if you do declare the class
    following this convention, e.g. ASCIIattribute, then IntelliSense prompts with
    the full name.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '```

    Personally I''d rather keep attribute names short and meaningful so I prefer:

    public class ASCII : Attribute

    {

    Now you can apply the attribute to any class as in:

    [ASCII]

    public class MyClass

    {}

    ```


    Of course, nothing happens if you do this as there is no attribute behavior worth
    worrying about, but it is legal syntax – now to give it some semantics.


    # Attribute Semantics


    The key to understanding what is going on here is to realize that the attribute
    class you have defined is instantiated when anything queries the custom attributes
    of MyClass. To query custom attributes we use the GetCustomAttributes static method
    of the Attribute class:

    Attribute.GetCustomAttributes(t)


    This returns an array containing an instance of each attribute class corresponding
    to the attributes that have been applied to the specified type t. Notice that
    this returns an array containing one instance of every attribute applied to t.
    For example, the instruction:


    ```

    Attribute[] attrs = Attribute.GetCustomAttributes(typeof(MyClass));

    returns an array, in this case, a single element attrs[] which contains an instance
    of ASCII. A class to ASCII is all you need to make use of the instance.

    ```


    This way of retrieving attributes is the one you often encounter in examples of
    attribute. However, in many situations there is an alternative which is arguably
    better. In most cases you don''t want to retrieve all the attributes applied to
    an entity because you are writing code which is going to handle one attribute
    type, i.e. the custom attribute you are currently implementing.


    There is a fairly easy way to retrieve specific attributes from the type to which
    they are applied using the GetCustomAttributes method of the Type object to return
    attributes of a specified type.'
  merge: -1
  pgno: 310
- img_proc: true
  md: "For example, to retrieve any ASCII attributes applied to MyClass you would\
    \ use:\nobject[] attrs = typeof(MyClass).\nGetCustomAttributes(typeof(ASCII),\
    \ false);\n\nThis returns an array of objects that can be cast to the attribute\
    \ type you are looking for. The final Boolean parameter determines if the instance's\
    \ inheritance chain is searched for attributes - false restricts us to only directly\
    \ applied attributes.\n\nIf you want to make things easier you can perform the\
    \ cast on the returned array:\nASCII[] attrs = (ASCII([])) typeof(MyClass).\n\
    GetCustomAttributes(typeof(ASCII), false);\n\nThis always works because only attributes\
    \ of ASCII type will be returned or a null reference which can also be cast to\
    \ ASCII.\n\n# The Attribute Constructor\n\nCurrently the instance of the attribute's\
    \ class isn't doing a lot of good as the class has no methods, and more importantly,\
    \ no properties. There are two ways of providing it with properties. The first\
    \ is to provide a constructor with parameters. For example, if we change the ASCII\
    \ class definition to:\n\n```\npublic class ASCII : Attribute\n{\n    public string\
    \ MyData;\n    public ASCII(string MyDataIn)\n    {\n        MyData = MyDataIn;\n\
    \    }\n}\n```\n\nwe can pass some data to the class by applying the attribute\
    \ as:\n[ASCII(\"Hello Attribute World\")\npublic class MyClass\n{}\n\nNow when\
    \ the GetCustomAttributes method is called it returns a single instance of the\
    \ ASCII class with MyData set to Hello Attribute World.\n\nIn other words, calling\
    \ the GetCustomAttributes method has resulted in the class constructor being used\
    \ with the data provided by the ASCII attribute."
