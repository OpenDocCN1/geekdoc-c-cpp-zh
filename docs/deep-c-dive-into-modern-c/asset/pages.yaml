  md: "# Type and Flow of Control – Pattern Matching\n\nPerhaps the ultimate expression\
    \ of type affecting flow of control is in pattern matching. This idea is popular\
    \ in functional programming where its key idea seems to be allowing conditionals\
    \ to test a much wider range of things than simple value relationships. Pattern\
    \ matching is a relatively recent introduction to C# and it is still evolving.\
    \ Some are of the opinion that, as you could already do most of what it offers\
    \ using existing features, it really isn't a good addition to the language.\n\n\
    You can use a pattern with the is or switch expressions. The former is simple:\n\
    \nand it is true if the expression matches the pattern.\n\nFor more complex scenarios\
    \ the switch expression is:\n\n```\ntest expression switch {\n    pattern case\
    \ guard => expression,\n    pattern case guard => expression,\n    ...}\n```\n\
    \nwhere the value of the switch expression is the expression corresponding to\
    \ the first pattern that the test expression matches. If the pattern doesn't select\
    \ the entity you want precisely enough you can add a case guard, which is a general\
    \ logical expression that has to be true for the match to succeed.\n\nThe switch\
    \ expression is very similar to the familiar switch statement:\n\n```\n{\n   \
    \ pattern:\n        actions;\n        break;\n    pattern:\n        actions;\n\
    \        break;\n    default:\n        default actions;\n}\n```\n\nbut it only\
    \ evaluates a single expression as its \"case\" and the range of conditions that\
    \ can be tested is limited. The switch statement can only use constant patterns\
    \ and type patterns whereas the switch expression can use all of the possible\
    \ patterns."
