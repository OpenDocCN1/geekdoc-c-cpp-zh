- img_proc: true
  md: "The <T> at the start declares the type parameter. You don't have to use T as\
    \ the name of the type parameter and you can have as many type parameters as you\
    \ like. Within the function definition, the type parameter is just used as T without\
    \ angle brackets. Following this we can call the generic function:\n\n```\nMyClassA\
    \ my1 = new MyClassA();\nMyClassA my2 = new MyClassA();\nMyClassA my3 = new MyClassA();\n\
    MyClassA[] classes = { my1, my2, my3 };\n```\n\nBoolean result = new MyClassA<class>(classes,\
    \ my2);\nConsole.WriteLine(result);\n\nwhich will not matter what the array is.\
    \ This time it also works with int types as no conversion to another type is involved.\n\
    Class, delegate and interface generic declarations work in the same way – add\
    \ a type parameter in angle brackets at the start of the declaration and use the\
    \ parameter if it was a type in the body of the declaration. For example:\n\n\
    ```\nclass MyClass<T>\n{\n    public void methodName(T a)\n    {\n        Console.WriteLine(a);\n\
    \    }\n}\n```\n\ndeclares a class with a single type parameter and a method that\
    \ accepts a single parameter of that type. You would use this class in the obvious\
    \ way:\nMyClassA<string> myObject = new MyClassA<string>();\nhObject.method(\"\
    Hello Generic World\");\nNotice that this is different to:\n\n```\nclass MyClass<T>\n\
    {\n    public void methodName<T>(T a)\n    {\n        Console.WriteLine(a);\n\
    \    }\n}\n```\n\nwhere in this case the <T> in the function definition isn't\
    \ the same as the <T> in the class definition. You can call this method with its\
    \ own type parameter:\nMyClassA<string> myObject = new MyClassA<string>();\nhObject.method<int>(42);"
