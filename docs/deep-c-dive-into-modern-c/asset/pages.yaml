  md: "If the XML you try to load or parse is syntactically incorrect it then you\
    \ will have handle the resulting exception.\n\nIf you want to go the other way\
    \ by using Parse then there is a Save method and you can specify options on the\
    \ Save and the ToString methods that control some aspects of formatting.\n\n#\
    \ Content\n\nNow you can see how to build an XElement, but what about content?\
    \ A tree of XML tags isn't usually the whole story. The main data payload in XML\
    \ is supposed to be anything you put between opening and closing tags. In the\
    \ XElement tree any text between tags is stored as an XText node in the collection,\
    \ i.e it is just another type of child node. As you can add XText nodes using\
    \ all of the methods described earlier – if you try to add string object as a\
    \ child then the methods simplify to an XText object and add it to the collection\
    \ of nodes. For example:\n\n```\nXElement root = new\nXElement(\"Record\",\"Address\
    \ Record\")\nnew XElement(\"Name\")\n    new XElement(\"First\",\"Mike\")\n  \
    \  new XElement(\"Second\")\n    new XElement(\"Address\")\n```\n\nThis adds Address\
    \ Record and Mike as text between the specified tags. It is also worth knowing\
    \ that if an XElement object has only a single XText child then this is its string\
    \ Value property.\n\n# Attributes\n\nText between the tags isn't the only sort\
    \ of data carried by XML. You can also specify any number of value pairs within\
    \ the tags themselves as attributes. Attributes are supposed to be used as \"\
    metadata\", i.e they describe the nature of the data between the tags - formatting,\
    \ time, context - and within the XElement tree they are stored as XAttribute objects\
    \ within the Attributes collection. The reason for this is that if you enumerate\
    \ the tree you will list each of the tags and text between them but not the attributes.\
    \ Once you have found a tag, an XElement object, you can enumerate its attributes.\
    \ Viewed in this way it should be clear that the main distinction between attributes\
    \ and other nodes is that attributes are not part of the tree structure, but are\
    \ simply stored at each node of the tree.\n\nThe rule that you have to keep in\
    \ mind is that if you add an XAttribute object to an XElement then it will automatically\
    \ be added to the Attributes collection."
