  md: "For example, a generic delegate with the correct signature for an addition\n\
    function is:\n\n```\npublic delegate T Addmethod<T> (T x,T y)\n```\n\nthis simply\
    \ says Addmethod is a delegate that accepts two parameters of\ntype T and returns\
    \ a value of T. Using this we can now define a generic\naddition function:\n\n\
    ```\npublic T Add<T>(T a, T b, Addmethod<T> add {\n  T c = add(a, b);\n  return\
    \ c;\n```\n\nNotice that the third parameter is a function that takes two parameters\
    \ of type\nand returns a T. All of this is fine as no knowledge of the type T\
    \ is used in\nthis - works for any type. Now we just need to call Add with the\
    \ correct\nparameters, integers say. To do this we need a function that adds two\
    \ integers\ntogether to pass as the third parameter:\n\n```\nint Addints(int x,\
    \ int y) {\n  return x + y;\n```\n\nNotice that the function you pass is not generic\
    \ - it has a definite type, even\nat compile time.\n\nNow we can call Add:\nConsole.WriteLine(Add<int>(2,3,\
    \ Addints));\n\nThis works and the only downside is that you need to define a\
    \ function that\nhas the correct signature for each of the types that want to\
    \ use e.g.\nAddfloat, AddDouble, AddString, AddMyClass, and so on. This sounds\
    \ almost\nas bad as having to write complete functions for each type, which is\
    \ what we\nhave to do if not using generics. In practice it's so bad\nbecause\
    \ usually the specific functions perform such actions as\ncomparing two objects\
    \ or \"adding\" them and the full generic routine is much\nlarger. In short, generic\
    \ allows you to implement complex type-\ndependent parts of the program into strongly-typed\
    \ functions.\n\nIt is something of a chore to have the type specific operation\
    \ in a\ndelegate each time you want to use the generic method, but lambda\nexpressions\
    \ make it less painful as you can create the action on the fly:\nConsole.WriteLine(Add<int>(2,3,\
    \ (a, b) => a+b));\n\nNotice there is no need to specify the type of a and b or\
    \ the return type\nthey can be deduced from the generic function definition."
