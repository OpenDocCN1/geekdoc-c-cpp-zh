  md: "# Being Explicit\n\nIf you really want to specify the space allocated to any\
    \ particular field you can use Explicit. For example:\n\n```\n[StructLayout(LayoutKind.Explicit)]\n\
    public struct struct1{\n    [FieldOffset(0)]\n    public byte a; // 1 byte\n \
    \   [FieldOffset(1)]\n    public int b; // 4 bytes\n    [FieldOffset(5)]\n   \
    \ public short c;// // 2 bytes\n    [FieldOffset(7)]\n    public byte d; // 1\
    \ byte\n}\n```\n\nproduces an 8-byte struct without any padding bytes. In this\
    \ sense it is equivalent to Pack = 1, which is much simpler to use. However, Explicit\
    \ really gives you complete control should you need it. For example:\n\n```\n\
    [StructLayout(LayoutKind.Explicit)]\npublic struct struct1{\n    [FieldOffset(0)]\n\
    \    public byte a; // 1 byte\n    [FieldOffset(1)]\n    public int b; // 4 bytes\n\
    \    [FieldOffset(10)]\n    public short c;// // 2 bytes\n    [FieldOffset(14)]\n\
    \    public byte d; // 1 byte\n}\n```\n\nproduces a 16-byte struct with extra\
    \ bytes following the b field.\nA common use of an Explicit layout is to provide\
    \ fixed length buffers for use in DLL calls, for example. You cannot simply declare\
    \ a fixed-size array within a struct because initializing fields isn't permitted.\
    \ That is:\n\n```\npublic struct struct1{\n    public byte a;\n    public int\
    \ b;\n    byte[] buffer = new byte[10];\n    public short c;\n    public byte\
    \ d;\n}\n```\n\ngenerates an error."
  merge: -1
  pgno: 333
- img_proc: true
  md: "If you want a 10-byte buffer one way of doing it is:\n\n```\n[StructLayout(LayoutKind.Explicit)]\n\
    public struct struct1\n{\n    [FieldOffset(0)]\n    public byte a;\n    [FieldOffset(1)]\n\
    \    public int b;\n    [FieldOffset(5)]\n    public short c;\n    [FieldOffset(8)]\n\
    \    public byte[] buffer;\n    [FieldOffset(18)]\n    public byte d;\n}\n```\n\
    \nThis leaves a block of 10 bytes for the buffer at the end of the struct.\nThere\
    \ are a number of interesting points in this declaration. The first is why you\
    \ use an offset of 8? The reason is that you can't start an array on an odd address\
    \ boundary. If you use 7 you will see a run-time error informing you that the\
    \ struct cannot be loaded because of an alignment problem. This is important because\
    \ it means you can cause problems by using Explicit if you don't know what you\
    \ are doing.\n\nThe second is that the entire struct has additional bytes added\
    \ to the end of bringing its size to a multiple of 8 bytes. The compiler still\
    \ gets involved with memory allocation. In practice, of course, any external structure\
    \ that you are trying to convert to a C# struct should be correctly aligned and\
    \ the problem shouldn't arise.\n\nIt is worth noting that you can refer to the\
    \ 10-byte buffer using the array name, as in buffer[1] etc., because C# thinks\
    \ that the buffer is unassigned. As you can't use the array and it causes an alignment\
    \ problem, a much better way to declare the struct is:\n\n```\n[StructLayout(LayoutKind.Explicit)]\n\
    public struct struct1\n{\n    [FieldOffset(0)]\n    public byte a; // 1 byte\n\
    \    [FieldOffset(1)]\n    public int b; // 4 bytes\n    [FieldOffset(5)]\n  \
    \  public short c; // 2 bytes\n    [FieldOffset(7)]\n    public byte[] buffer;\n\
    \    [FieldOffset(18)]\n    public byte d; // 1 byte\n}\n```"
