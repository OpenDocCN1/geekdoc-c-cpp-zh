  md: "To return a type T simply change the Task to Task<T> and return a T at the\
    \ end of the code run on the worker thread. For example, to return an int from\
    \ DoWork you would write:\n\n```\nTask<int> DoWork() {\n    return TaskEx.Run(()\
    \ => {\n        for (int i = 0; i < 10; i++) {\n            Thread.Sleep(500);\n\
    \            return 500;\n        }\n    });\n}\n```\n\nwhere the code run on\
    \ the new thread returns 500 just to show that it works. In the asynchronous method\
    \ we call the new DoWork in the obvious way:\n\n```\nint result=await DoWork();\n\
    TextBlock1.Text = result.ToString();\n```\n\nNotice that there are a few points\
    \ of confusion.\n\nThe return type of DoWork is stated as Task<int> it actually\
    \ seems to return an int to the calling routine. Also there now appear to be two\
    \ returns in DoWork, the one that returns the Task<int> and the one that returns\
    \ the int, but of these are in separate functions run on different threads. If\
    \ you have followed how all of this works this should seem understandable, if\
    \ potentially confusing.\n\nThe key idea is that the awaited function should return\
    \ a Task as soon as possible and the Task runs on its own thread, while the UI\
    \ thread gets on with running the UI, and eventually returns the final result.\n\
    \n# Postlude\n\nThis is a brief introduction to the ideas of async and await.\
    \ There are also lots of other facilities such as a cancellation mechanism, a\
    \ progress reporting mechanism and so on that make the whole even more flexible.\
    \ There is no single more important change to the way that asynchronous code is\
    \ written than the introduction of async and await."
