  md: 'As you can see the basic COM mechanism is simple, but it has been elaborated
    to a point where it can seem very complicated. When you add to the fact that COM
    programmers often found “inventive” ways of creating COM objects and interfaces
    then things become even difficult. There is also the fact that COM programmers
    use different styles to write their IDL files and to implement their COM interfaces.
    Reading through some IDL files quickly raises the question “how many ways does
    a COM programmer need to define a 32-word” DWORD, HRESULT, ULONG, HWIND, Reserved,
    Flag and so on, all just mean Int32.


    There are also generations of Windows to take into account. You will find FARPOINTER
    used as a data type in the days when pointers were mostly 16-bit and a 32-bit
    pointer was the exception. You also have the problem of ANSI 8-bit versus UNICODE
    16-bit character data and the large number of different ways there are of representing
    sophisticated data types such as strings, arrays and structures. It adds up to
    a very threatening mess for any programmer to tackle the Unknown and it''s a good
    example of how an initially good idea allowed to run wild. What you need to keep
    in mind is that the Unknown interface is essentially simple and if you proceed
    step-by-step you can get it working.


