  md: "The simplest way of checking that the delegate has finished is to use EndInvoke\
    \ to test the IAsyncResult object returned by the BeginInvoke. EndInvoke simply\
    \ blocks until the delegate has finished. So, for example, you could use something\
    \ like:\n\n```\nIAsyncResult dtext = BeginInvoke(addtext,\n    new object[] {\
    \ i.ToString() });\n    ..get on some other work\n    ..when wait ready for addtext\
    \ to end\n```\n\n# Self Invoke\n\nAlthough this demonstrates the basic invoke\
