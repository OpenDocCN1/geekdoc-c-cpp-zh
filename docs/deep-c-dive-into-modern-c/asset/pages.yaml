  md: '# Postlude


    Structs are value types, but classes are reference types and never the twain shall
    meet. Well at least you should keep them well apart in your mind because they
    behave differently and they are for very different purposes. C#''s structs are
    more sophisticated than the same idea implemented in other languages and, partly
    to make up for this, we have two alternatives – the tuple and the record. Both
    are useful, but it is possible to become excessively addicted to the tuple as
    a way of temporarily packaging data into a single entity that can be passed around.'
