  md: "Notice that you come to this conclusion without any mention of generics.\n\
    However, by the same reasoning if you have a pair of generic functions:\n\n```\n\
    T1 MyFunction1<T1>(T1 a);\n```\n\nand:\n\n```\nT2 MyFunction2<T2>(T2 a);\n```\n\
    \nthen if:\n\n```\nT1>T2\n```\n\nwe have:\n\n```\nMyFunction1<MyFunction2\n```\n\
    \nwith regard to parameter type and:\n\n```\nMyFunction1>MyFunction\n```\n\nwith\
    \ regard to the output type.\n\nGeneric functions are contravariant in input types\
    \ and covariant in output types.\n\n# General Variance\n\nNow that we have looked\
    \ at the way that a change to a function affects its type, we can generalize the\
    \ idea of covariance and contravariance to any situation, not just where functions\
    \ are involved. Suppose we have two types, A and B, and we have a modification,\
    \ or transformation, G that we can make of them to get new types, G(A) and G(B).\n\
    \n+   - If G is a covariant transformation we have A-B implies G(A)>G(B).\n  Outputs\
    \ are covariant.\n\n+   - If G is a contravariant transformation we have A>B implies\
    \ G(A)<G(B).\n  Inputs are contravariant.\n\n+   - is also possible that neither\
    \ relationship applies. That is, A-B doesn't imply anything about the relationship\
    \ between G(A) and G(B). In this case G is referred to as invariant, which isn't\
    \ a good name.\n\nIn our example we have two transformations G1, which converted\
    \ the input parameter - a contravariant transform, and G2, which converted the\
    \ input into the return result - a covariant transform.\n\nIt can be very difficult\
    \ to keep all of this in your head when reasoning about particular data types,\
    \ arrays for example, but eventually you get to use it.\nWhy is this of important?\
    \ On one level it is you can quite happily reason about what you can access and\
    \ what you might not be to access as you write code at a very basic and simple\
    \ level. However, the ideas of covariance and contravariance is an automatic way\
    \ of determining what is or is not type safe and the compiler can flag errors\
    \ based on these behaviors."
