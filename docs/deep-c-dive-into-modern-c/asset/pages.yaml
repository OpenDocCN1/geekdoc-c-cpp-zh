  md: "You can make use of the type to extend generic functions can do casting. The\
    \ only problem is that the compiler will not let you cast T to anything other\
    \ than object. However, once you have cast it to object you can cast it to anything\
    \ you want. There is a sense in which the refusal to cast T to anything other\
    \ than object is a way to make sure that you really know what you are doing, for\
    \ example:\n\n```\nclass MyClass<T> {\n    public T add(T a, T b) {\n        Console.WriteLine(typeof(T).Name);\n\
    \        if (typeof(T).Name == \"Int32\") {\n            return (T)object)((int)(object)a\
    \ + (int)(object)b);\n        }\n        return default(T);\n    }\n}\n```\n\n\
    You can see that we test for the actual type of T and then cast to int to use\
    \ the addition operator.\n\nReturning generic types is something of a problem\
    \ as you can create an instance of the type when you don't know it and is similarly\
    \ you can't initialize a variable without knowing its type and this is one of\
    \ the problems that default solves.\n\nThis is also an ideal use of pattern matching,\
    \ see Chapter 2:\n\n```\nclass MyClass<T> {\n    public T add(T a, T b) {\n  \
    \      T result = default(T) switch {\n            int => (T)object)((int)(object)a\
    \ + (int)(object)b,\n            => default(T)\n        }\n        return result;\n\
    \    }\n}\n```\n\nNotice the default(T) to create a temporary object of type T\
    \ so that the switch can cast it and return a default value of type T. This is\
    \ a standard approach to testing generic type specifications in switch statements.\n\
    \nThere is no suggestion that this is a good way to program using generics. The\
    \ purpose is to make sure that you understand the type of a generic parameter\
    \ is not erased and you can work with it. It also reveals the way generics are\
    \ essentially a way to work with any type."
