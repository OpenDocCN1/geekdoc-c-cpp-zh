  md: 'If we want to avoid the cast then we need to create a generic method. This
    is just a matter of introducing a type parameter <T> and then using it throughout
    the method as if it was the type of the struct:


    ```

    public T ReadStruct <T>(FileStream fs)

    ```


    ```

    byte[] buffer = new byte[Marshal.SizeOf(typeof( T))];

    fs.Read(buffer,0,Marshal.SizeOf(typeof(T)));

    GCHandle handle = GCHandle.Alloc(buffer,GCHandleType.Pinned);

    T temp = (T)Marshal.PtrToStructure(handle.AddrOfPinnedObject(), sizeof(T));

    handle.Free();

    return temp;

    ```


    Notice that we now have to cast the object returned by PtrToStructure to the type
    rather than in the method call, which becomes:

    BITMAPHEADER bmpFH = ReadStruct<BITMAPHEADER>(fs);


    It is interesting to contemplate how much better the generic method is than the
    method that needs the explicit cast.


    # Manual Marshaling


    Marshaling works so well most of the time there is a tendency to forget that is
    doing anything at all. However, as soon as you hit something slightly out of the
    ordinary, you might be surprised at what happens when it stops working. For example,
    some API calls need you to pass a pointer to a pointer to struct by reference
    ref. This might lead you to believe that a simple modification will allow you
    to pass a pointer to pointer, but things are more complicated than you might expect.
    Let''s look at this one step at a time.


    In the AVIFileCreateStream API the last two parameters are passed as pointers
    to IntPtr and a struct respectively:


    ```

    [DllImport("avif32.dll")

    extern static int AVIFileCreateStream(IntPtr pFile, ref IntPtr pavi, ref AVISTREAMINFO
    lParam);

    ```


    To use this API call would use:

    result = AVIFileCreateStream(pFile, pStream, ref Sinfo);'
