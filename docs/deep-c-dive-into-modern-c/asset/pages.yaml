  md: '# Using Anonymous Methods


    So what are anonymous methods good for? They certainly save one level of naming
    confusion, but in some cases they can remove the need for any new names at all.
    For example, consider the Find method of the Array object defined as:


    ```

    public static T Find<T> (T[]) array, Predicate<T> match

    ```


    The delegate is defined as:


    ```

    public delegate bool Predicate<T> (T obj)

    ```


    Without anonymous methods you would have to define a Predicate method, wrap in
    a delegate and pass it to the Find method.


    With anonymous method it can be as simple as:


    ```

    int result = Array.Find(A, delegate (int x) return (x < 0));

    ```


    In short, anonymous methods are good for short functions that you want to use
    “at once”, often as a parameter within a method call. However, in modern C# lambdas
    provide a simpler way of doing the same job and more. They work in the same way
    as anonymous methods and provide a neater way of writing the code.


    # Statement Esoterics


    Lambdas sound esoteric; the name comes from lambda calculus which is important
    in computer science. You don''t need to worry about theory because lambdas solve
    a very practical problem.


    There are two slight variations on the basic idea of a lambda - statement and
    expression lambdas. A statement lambda can have a mix of expressions and statements
    whereas an expression lambda has only a single expression as its body and simply
    returns the result of the expression.


    It makes sense to start by looking at statement lambdas because these are simply
    a more concise way of writing an anonymous method and return to expression lambdas
    later.


    The basic syntax of a statement lambda is:


    ```

    (comma separated parameters)=> semicolon terminated statement list;

    ```


    The => symbol can be read as “becomes” to indicate that the parameters are transformed
    into the actions.'
