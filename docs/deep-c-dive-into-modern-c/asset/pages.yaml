- img_proc: true
  md: 'The idea is that instead of using a pair of parameters to return the result
    – not a good idea – we create a struct that holds all the results and return it.
    You can argue that a struct to hold the max and min is a reasonable expression
    of the relationship, but if it is a one-off, defining a struct is overkill. This
    is where tuples come in.


    A tuple, a value type, is a group of data types and it doesn''t have to be formally
    defined and can be created on the fly. You have to provide the type of each element,
    but this is all:


    ```

    (double, double) result = (0.0, 100.0);

    return result;

    ```


    You can avoid having to specify the types that make up a tuple by using dynamic
    typing, see Chapter 11.


    You can also name the fields if you want to:


    ```

    (double min, double max) result = (0.0,100.0);

    return result;

    ```


    If you don''t give them, they are called item1, item2 and so on.


    You can access the fields in the usual way:


    ```

    result.item2


    or:

    result.max

    ```


    You can also use a similar syntax for “deconstruction” to separate the fields
    into variables. For example:


    ```

    (double min, double max) = result;

    ```


    separates the tuple into two variables, min and max.

    Tuples only have a small number of predefined methods supplied and you can''t
    define new methods. You can also test tuples for equality or inequality and all
    that matters is that they have fields of the same type or that can be converted
    into that type and have the same values. The field names are irrelevant in a comparison.


    Tuples are also mutable i.e. you can assign new values to the fields and they
    can be nested. For example:


    ```

    (1,2,(3,4))

    ```


    is a tuple with three elements, the third being tuple with two elements.

    Tuples are very useful as lightweight structs, but notice that you can use dynamic
    typing in the form of anonymous types to do almost the same thing, see Chapter
    11.'
