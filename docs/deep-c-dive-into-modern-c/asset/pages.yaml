  md: "The third and final method is to use custom marshaling. Many C# programmers\
    \ don't realize that marshaling isn't just about the way that the system types\
    \ data for passing to DLLs but instead is an active process that copies and transforms\
    \ the managed data. For example, if you choose to pass a reference to an array\
    \ of typed elements you can ask for it to be marshaled as a value array and the\
    \ system will convert it into a fixed length buffer, and back to a managed array,\
    \ without any extra effort on your.\n\nIn this case we have to add the MarshalAs\
    \ attribute (see Chapter 24), specify the type and size of the arrays:\n\n```\n\
    [StructLayout(LayoutKind.Sequential,Pack = 1)]\npublic struct DISPLAY DEVICE CharSet\
    \ = Unicode\n{\n    public int cb;\n    [MarshalAs(UnmanagedType.ByValArray,SizeConst=32)]\n\
    \    public char[] DeviceName;\n    [MarshalAs(UnmanagedType.ByValArray,SizeConst=128)]\n\
    \    public char[] String;\n    public int StateFlags;\n    [MarshalAs(UnmanagedType.ByValArray,SizeConst\
    \ = 128)]\n    public char[] ObjectID;\n    [MarshalAs(UnmanagedType.ByValArray,SizeConst\
    \ = 128)]\n    public char[] DeviceKey;\n}\n```\n\nWhat happens in this case is\
    \ that, when you call the DLL, the fields are marshaled by creating unmanaged\
    \ buffers of the correct size within the copy of the struct that is be passed\
    \ to the DLL function. When the function returns, the unmanaged buffers are converted\
    \ into managed arrays and the field variables are set to refer them. As a result\
    \ when the function is complete you will discover that the struct has char arrays\
    \ of the correct size containing the data.\n\nClearly, as far as calling a DLL\
    \ is concerned, the custom marshal is the best option as it produces safe code,\
    \ although using PInvoke to call a DLL isn't really safe in any reasonable sense\
    \ of the word.\n\n# #izing Structs\n\nNow that we have looked at the complicated\
    \ question of how to control the memory layout of a struct, it is time to discover\
    \ how to get by the bytes that make up a struct, i.e. how we serialize a struct?\n\
    \nWhile there are many ways of doing this job, the most commonly encountered uses\
    \ Marshal.AllocHGlobal an unmanaged buffer"
