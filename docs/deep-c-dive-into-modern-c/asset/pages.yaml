- img_proc: true
  md: "Simple types are structs in spirit only as the compiler takes care to make\
    \ sure that they are implemented in an efficient manner. Notice that, as with\
    \ a struct, you can opt to create a simple type using the new keyword. This doesn't\
    \ have any effect other than to call the type's default constructor which results\
    \ in it being initialized to its default value. So, for example:\n\n```\nint I;\n\
    int j;\nI = j;\nresults in a compiler error because j isn't defined. However:\n\
    ```\n\n```\nint I;\nint j = new int();\nI = j;\nworks perfectly because j is initialized\
    \ to 0 by its constructor.\n```\n\n# Value or Reference - Decide Early, Don't\
    \ Change\n\nYou should now understand the difference between a value and a reference\
    \ type, but when to use one in preference to another? In cases this question is\
    \ simply about using a class or a struct. The answer is nearly always that you\
    \ should prefer a value type when the purpose is to store data and a reference\
    \ type when some behavior has to be implemented. Wherever you choose, you need\
    \ to be aware of the potential for trouble that any attempt at changing a value\
    \ type to a reference type can produce. For example, suppose we initially design\
    \ a program using a struct:\n\n```\npublic struct MyStruct\n{\n    public int\
    \ x;\n}\n```\n\nWe might well use a method to do some computation involving a\
    \ private instance of this struct:\n\n```\nprivate MyStruct MyData = new MyStruct();\n\
    public MyStruct doSum()\n{\n    return MyData;\n}\n```\n\nIn this case no computation\
    \ is performed - the struct is simply returned. Now if some other part of your\
    \ program uses this method it might go on and perform further manipulations on\
    \ the returned value:\n\n```\nMyStruct a = doSum();\na.x = 10;\n```\n\nIn this\
    \ case everything works as you would expect. The struct is treated using value\
    \ semantics and the doSum returns a complete copy of the struct to create a completely\
    \ separate entity in a. This means that storing 10 in the x field doesn't alter\
    \ the value stored in MyData."
