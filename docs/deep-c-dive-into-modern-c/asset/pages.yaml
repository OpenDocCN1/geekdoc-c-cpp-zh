  md: "For example:\n\n```\npublic interface IMyInterface {\n    int myMethod() {\n\
    \        return 42;\n    }\n}\n```\n\nIn this case the interface has a single\
    \ fully-defined method. Now we can create a class that inherits this interface:\n\
    \n```\nclass MyClassA:IMyInterface {\n}\n```\n\nAfter this you will not be prompted\
    \ to implement the interface. You are only prompted to implement the interface\
    \ if it has declarations without implementation. If you think that myMethod is\
    \ a “default” method then you may expect:\n\n```\nMyClassA myWeb = new MyClassA();\n\
    Console.WriteLine(myObject.myMethod());\n```\n\nto work. It doesn't.\nA default\
    \ method is not a member of the class that inherits an interface, it is a member\
    \ of the interface type and you have to use it as if it was an explicit implementation,\
    \ see the previous section. This means that if you want to call the method you\
    \ need to use something like:\n\n```\nIMyInterface myWeb = new MyClassA();\nConsole.WriteLine(myObject.myMethod());\n\
    ```\n\nor, using a cast, see Chapter 8:\n\n```\nMyClassA myWeb = ((IMyInterface)myObject).myMethod();\n\
    ```\n\nor, using a safe cast:\n\n```\nMyClassA myWeb = new MyClassA();\nConsole.WriteLine((myObject\
    \ as IMyInterface).myMethod());\n```\n\nNotice that there is no question of having\
    \ to override the default method in the class as it doesn't inherit it. You can\
    \ simply provide an implementation that is used if you try to call the method\
    \ via the class:\n\n```\nclass MyClassA:IMyInterface {\n    public int myMethod()\
    \ {\n        return 43;\n    }\n}\n```"
