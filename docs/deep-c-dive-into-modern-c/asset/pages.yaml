  md: "# Chapter 9\nGenerics\n\nGenerics are an essential part of any modern language.\
    \ C# has generics that are easy to understand, but using them can be more taxing.\n\
    \n# Why Generics?\n\nWe start programming not really worrying too much about type\
    \ and then it becomes central to everything we do. Everything has a type and when\
    \ you write code it works with a specific set of types. However, some algorithms\
    \ are the same as what type they work with. For example, a sorting algorithm doesn't\
    \ really care what it is as long as it has a way to decide if one element is bigger\
    \ than another. Yet in a strongly-typed language you have to write a sort routine\
    \ for each type you want to sort. Of course, this isn't what happens. If you want\
    \ to do something in a type-independent way then you can give up strong typing\
    \ and work with object upcasting.\n\nWe have already seen that this has problems\
    \ in an earlier chapter where we discovered that an array of value types cannot\
    \ be cast to an array of objects due to the cost of conversion. Even bigger problem\
    \ is that object has very few methods and generally you can't do much. For example,\
    \ object doesn't have a compare method so writing a generic sort function using\
    \ upcasting isn not going to work.\n\nAs object does have Equal's method we can\
    \ write a Find function which will return true if a target is in an array of almost\
    \ any type:\nFind(object a, object Target)\n\n```\n{\n  Boolean result = false;\n\
    \  foreach (x.Equals(Target))\n    {\n      result = true;\n      break;\n   \
    \ }\n  return result;\n}\n```"
  merge: -1
