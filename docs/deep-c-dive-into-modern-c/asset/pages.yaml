  md: '# Lifetimes


    It is often said that an important difference between value and reference types
    is their life cycle. In fact, both types of variable have exactly the same behavior
    with respect to when they are created and destroyed. That is, a value or reference
    type is destroyed as soon as the variable is clearly no longer accessible, i.e.
    goes out of scope. This means, for example, that a variable defined in a method
    is destroyed soon as the function terminates. It is this behavior that makes locals
    variables truly local to the method or block that they were declared. Notice that
    there can be exceptions to this rule as static variables which are not destroyed
    until the application terminates. However, it is true to say that the vast majority
    of variables behave in this way.


    What is different between value and reference types is what happens to their data
    when in the case of a value type variable, the variable and its data are one and
    the same so when a value type variable is destroyed so is its data. However, a
    reference type variable only contains a reference to its data and while the variable
    and the reference it contains is destroyed, the object that it references isn''t.


    This is the source of the statement that value and reference variables have different
    lifetimes. They don''t but the data associated with them can have.

    Obviously we can''t leave unwanted objects on the heap forever and this is where
    the system garbage collector comes in. This is a service that periodically scans
    the heap looking for objects that no longer have any references to them. An object
    with no references to it is clearly no longer required and using this fact the
    garbage collector eventually gets round to clearing the heap.


    Notice that difference in lifetime is entirely due to the way that things are
    stored. The value and reference variables are stored on the stack and this is
    naturally self-managing in the sense that when a method returns, all of its locals
    variables are destroyed by the adjustment of the stack pointer. Anything stored
    on the heap has no such natural cleaning process and we have to implement a garbage
    collection system to determine when they are no longer required and when they
    should be removed.


    How and when to tidy the heap is entirely matter of efficiency. Garbage collect
    too often and you use processor power when the is plenty of heap waiting to be
    used. Garbage collect too little and you risk bringing the application to a halt
    while the garbage collector has to overtime freeing memory by deleting objects
    and consolidating free space.'
