- img_proc: true
  md: 'Pointers are variables that generally contain the raw address of another variable.
    This is a very low-level concept and can cause all sorts of problems and bad practices
    because it leads to uncontrolled access to the machine''s entire memory.


    A reference type is a way of providing the same behavior, but in a controlled
    or managed way. Put simply:


    references are safe - pointers are not!


    However, despite all the reservations, thinking about a reference as a sort of
    typed pointer does help understand how everything works and thinking about references,
    preferably some sort of abstract pointer which has nothing to do with an "address",
    is recommended - just not admit to it in polite company!


    Before we move on it is vital that you are 100% clear that you know what stack
    and heap storage is.


    # Heap and Stack


    If you do know about heap and stack then skip to the next section.


    When you declare a new variable the compiler is to generate code that allocates
    sufficient memory to store the data it is to hold.


    The whole subject of memory allocation is a complicated and interesting one, but
    every programmer should know the two very general approaches - the stack and the
    heap.


    Stack-based memory is a natural match for the way that variables are allocated
    and created by a program constructed as a set of nested method or function calls,
    which most are. What happens is that when a method is called on the top of the
    stack - creating its-called stack frame. While the method executes it has access
    to only its local variables, i.e its entire environment is limited to the data
    on the stack frame. Exceptions to this local-only rule are global variables and
    objects but these are allocated on the heap. If the method calls another method
    then the new method creates its stack frame on the top of the stack. In this way
    each new method can allocate its own local variables in this portion of the memory
    allocated to the stack.


    The beauty of stack allocation is that to implement garbage disposal all that
    has to happen when each method terminates it simply clears the stack of its stack
    frame, i.e. it adjusts the stack pointer to point to the end of its stack frame,
    returning the memory to use. Of course, when a method ends, control returns to
    the method that it called and it finds the stack in just the state it needs to
    access its own local variables.'
