  md: 'over the DIY version and Parallel.For is well using. But at the end of the
    day you are still using separate threads to run different portions of the for
    and as such all of the usual problems arise and it is up to you to keep them under
    control.


    A simple-minded approach is to restrict the use of Parallel.For to tasks that
    are truly isolated from one another and never do anything adventurous, but that
    would simply be missing an opportunity. There are algorithms that can be implemented
    using a Parallel.For, but they need some attention to resource sharing in the
    same way that a raw threads solution would. It is worth mentioning that the Parallel.ForEach
    loop suffers from the same problems and so does Parallel.Invoke, which runs an
    array of Action delegates possibly in parallel.


    # Postlude


    Making concurrency easier is a good thing, but with it comes the usual set of
    new difficulties that we always encounter when multiple threads of execution are
    employed. The real danger is that, unless you know better, you can be led into
    believing that somehow the new features solve the old problems – they don''t.'
