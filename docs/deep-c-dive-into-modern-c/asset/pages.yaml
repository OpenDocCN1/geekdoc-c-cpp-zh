  md: "and to the other \"invoke\" methods isn't easy, but it is a lot easier after\
    \ you have seen the example. The class that implements the Invoke is a simple\
    \ implementation of Point with two properties, x and y:\n\n```\npublic class Point\n\
    {\n    public int x;\n    public int y;\n}\n```\n\nWe could store the details\
    \ of the thread that created an instance of the Point class, but for this example\
    \ it's easier to create a new thread to act as a \"point worker thread\":\n\n\
    Private Thread T;\n\nthat is, T is the one used to run any delegates that are\
    \ invoked on the point instance.\n\nIf we wanted to use the thread that created\
    \ the point instance to run the delegate we would have to add code to store the\
    \ thread's identity and use it to run the delegate. In this case we can keep the\
    \ thread ready to go because it is dedicated to doing nothing but socalled the\
    \ instance of the Point class.\n\nWe need a member variable to hold the delegate\
    \ to be invoked and an AutoResetEvent to start when it has a delegate to invoke\
    \ and to stop when there is nothing to do:\n\n```\nDelegate d;\nstatic AutoResetEvent\
    \ autoEvent;\n```\n\nWe could have the thread's Suspend and Resume methods to\
    \ start and stop the thread, but these are marked as obsolete .NET 3.5 and AutoResetEvent\
    \ is now the correct way to control a thread. It can be used as a lock or a signal\
    \ between threads. Threads can wait on an instance of AutoResetEvent using its\
    \ WaitOne method. The instance can be initially set or unset, when it is set,\
    \ one thread is waiting on it it will be started and the instance is reset. The\
    \ instance can be set again by calling its Set method.\n\nYou can see that AutoResetEvent\
    \ allows a set of threads to wait for a signal, i.e. Being called, and only one\
    \ will start at a time."
