    # Postlude


    Do we really need generics? In an object-oriented language with strong typing

    t answer, surprisingly, is “no”. Generics as generally implemented don''t

    give you much over and above using a base class as the type of a parameter or

    a return value coupled with a careful, run-time checked, use of casting.


    Generics go some way to detecting errors at compile time, but they do so by

    limiting what you can do at run time. This is sometimes a good trade-off, but

    the complexities introduced by generics are a high price to pay. Generics can

    make your programs easier to understand and more robust, but only if you

    put some effort into keeping their simple and clear.


    There are many situations where your first choice might be to use generics –

    y second choice might be better.'
