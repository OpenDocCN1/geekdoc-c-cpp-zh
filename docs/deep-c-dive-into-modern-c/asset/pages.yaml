    \ to work out when you need a pointer or a pointer to a pointer and so on.\n\n\
    # # Pointers, Arrays and Fixed\n\nThere is a very close relationship between pointers\
    \ and arrays, indeed we could say that pointers in languages such as C and C++\
    \ were introduced just that it was possible to find any address. In principle\
    \ the address of the first element of an array can be used to find any element\
    \ of an array, but things are a little more complicated. For example:\n\n```\n\
    int[] MyArray = new int[10];\nfor (int i = 0; i < 10; i++) MyArray[i] = i;\np*\
    \ pMyArray = &MyArray[0];\nMessageBox.Show((pMyArray).ToString());\n```\n\nshould\
    \ create a pointer to the first element of the array, but if you fix the array,\
    \ you will discover that you simply get an error to the effect that you take the\
    \ address of an unspecified expression. The reason is that while MyArray[0] is\
    \ just an integer variable, the compiler knows that the array is a managed object\
    \ and can be moved at any time. If you were to take the address of an array and\
    \ then it moved, the address would be useless and the pointer would end up pointing\
    \ to some other location. You can see the danger in a pointer pointing at what\
    \ you thought was pointing at.\n\nTo make a meaningful array address you have\
    \ to use the fixed keyword:\nfixed(pointer declaration){\n    instructions to\
    \ be carried\n    out data is fixed\n}\n\nThe fixed construction tells the compiler\
    \ that the array or any data type in the pointer declaration should not change\
    \ its location until the end of the fixed block. In other words, within the fixed\
    \ block it is safe to use the pointer. For example:\n\n```\nfixed (int* pMyArray=\
    \ &MyArray[0]);\nMessageBox.Show((*pMyArray).ToString());\n```\n\nwill work and\
    \ display the contents of the first element of the array."
  merge: -1
  pgno: 350
- img_proc: true
  md: "You can also use the array name as a shorthand for &Array[0] as in:\nfixed\
    \ (int* pMyArray= MyArray){\n    MessageBox.Show((*pMyArray).ToString());\n}\n\
    \nNotice that the pointer declared in the fixed statement goes out of scope when\
    \ it ends, so you can't use pMyArray unless the array is fixed.\n\n# Pointer Arithmetic\n\
    \nIf you want to access other array elements then simply use pointer arithmetic\
    \ as in:\nfixed (int* pMyArray= MyArray){\n    MessageBox.Show((*pMyArray+5).ToString());\n\
    }\n\nwhich displays MyArray[5]. Notice that this is rather subtle than you might\
    \ think as adding 5 to the address of the start of the array actually adds 5 times\
    \ the size of a single integer element. That is, the arithmetic operators have\
    \ been overloaded to work in units of the size of the data type being pointed\
    \ to. There is a sizeof operator which returns the size of the data type and this\
    \ is used to work out what to add to a pointer. That is, pointer+5 is translated\
    \ to:\n\npointer+5*sizeof(pointertype)\n\nSo, pointer+n doesn't mean \"add n to\
    \ the address of the pointer\", \"move on n elements in the array\".\n\nTo complete\
    \ the connection between arrays and pointers as a shortcut to dereferencing and\
    \ pointer arithmetic. That is,\npointer[5] is a synonym for *pointer+5:\n\nfixed\
    \ (int* pMyArray = &MyArray[0]){\n    MessageBox.Show(pMyArray[5].ToString());\n\
    }\n\nThere is a restriction on the use of the fixed pointer in that it cannot\
    \ be modified within the fixed statement. This isn't a problem as you can make\
    \ a copy of it:\n\nfixed (int* pMyArray = MyArray){\n    int* pptemp = pMyArray;\n\
    \    MessageBox.Show((*ptemp).ToString());\\n}\n\nwhich displays the contents\
    \ of MyArray[1]."
  merge: -1
  pgno: 351
- img_proc: true
  md: "This sort of pointer manipulator works with multi-dimensional arrays, for example:\n\
    int[,] MyArray = new int[10,10];\nfixed (*pArray = &MyArray[0,0]) {\n  for (int\
    \ i = 0; i < 100; i++) {\n    *(pArray + i) = i;\n  }\n}\n\nThis initializes a\
    \ two-dimensional array by accessing it as a linear block of memory. Of course,\
    \ the order in which the array is initialized depends on how it is stored in memory\
    \ and I leave it to you breakpoint the example and discover if it is stored in\
    \ row or column order. It is this sort of trick, i.e. accessing a 2-D array as\
    \ if it was a 1-D structure, that made, and still makes, pointers so attractive,\
    \ to some developers.\n\nNotice that you can initialize multiple pointers within\
    \ a fixed statement as long as they are all of the same type. To initialize multiple\
    \ pointers of different types you have to use nested fixed statements, for each\
    \ type.\n\n# Structs\n\nIt is time to turn our attention to structs and pointers\
    \ to structs. You might well imagine that if an array is something you have to\
    \ fix before using pointers to it you would certainly have to fix a struct in\
    \ the same way. You don't have to because a struct is a value type and allocated\
    \ on the stack. You can use:\n\n```\npublic struct MyStructType{\n  public int\
    \ x;\n  public int y;\n}\nMyStruct MyStruct=new MyStruct();\nMyStruct* pStruct\
    \ = &MyStruct;\n```\n\nNow, how do you access a field using a pointer? You can\
    \ use the fairly obvious:\n(*pStruct).x = 1;\n\nThat is, dereference the pointer\
    \ and use the dot selector. However, in a homage to the C++ usage you can also\
    \ write:\npMyStruct->y = 2;\nMessageBox.Show(pMyStruct->x.ToString());\n\nHere\
    \ the -> dereferences the pointer and selects the field in a single step."
  merge: -1
  pgno: 352
- img_proc: true
  md: "# Strings\n\nIt is usually said that you can't have a pointer to a string because\
    \ a string is a managed object, but just like an array, you can fix a string and\
    \ then you can initialize a char pointer to the first character in the string.\
    \ For example:\n\n```\nstring MyString = \"Hello pointer world\";\nfixed (char*\
    \ pMyString = MyString());\nMessageBox.Show((pMyString + 6)).ToString());\n}\n\
    ```\n\ncreates a string in the usual way, fixes it obtains a char pointer to its\
    \ first char. Then we can perform pointer arithmetic to access the sixth character\
    \ in the string.\n\n# Memory Allocation\n\nAs well as working with value types\
    \ you can create your own primitive data types using the stack. The statement\
    \ stackalloc type[n] allocates enough stack to store n copies of the stated data\
    \ type and returns a pointer to the start of the allocation. You don't need to\
    \ fix the storage as the stack isn't moved or garbage collected while the variables\
    \ are in scope. You also don't have to remember to allocate the memory because\
    \ the stack is automatically cleaned up when the variables go out of scope, usually\
    \ when the method that declared them returns. For example:\n\n```\nint* pMyArray\
    \ = stackalloc int[100];\npMyArray[10] = 34;\nMessageBox.Show(pMyArray[10].ToString());\n\
    ```\n\nallocates 100 integers, 400 bytes, on the stack and uses the pointer to\
    \ store 34 in the first bytes starting at the 40th byte and then displays this\
    \ value.\n\nNotice that the use of the array indexing makes this look exactly\
    \ like allocating and using a standard array. However, the block of memory really\
    \ is just a block of memory that you can do what you like. For example:\n\n```\n\
    public struct MyStruct{\n    int x;\n    int y;\n};\nMyStruct* pMyDataBlock =\
    \ stackalloc MyStruct[1];\npMyDataBlock->x = 34;\n```\n\nallocates on the stack,\
    \ but this is really just sizeof(MyStruct) which happens to be two integers, i.e.\
    \ 8 bytes.\n\nWe can use the pointer to the structure in the usual way to set\
    \ or access a field. That is, we can treat it as a struct, but if we want to just\
    \ treat it as a block of 8 bytes and use it as some other data structure."
  merge: -1
  pgno: 353
- img_proc: true
  md: 'For example, if you want to treat the data as an array of int you can by casting
    the pointer:

    *((int*)pMyDataBlock) = 36;


    This expression is a little difficult to follow so simpler multi-step version
    is:

    int* pMyArray = (int*)pMyDataBlock;

    pMyArray[0] = 36;


    This casts to int uses array indexing to access the first element of the array,
    which is the same as the x field of the struct. Notice that this correspondence
    depends on the way the struct is organized in memory and currently declared –
    see also Chapter 27.


    A range of attributes can be applied to the compiler to use particular memory
    layouts for a struct, see Chapter 27, but even then you are making use of details
    of implementation that could change and make your program invalid.


    # Function Pointers


    Most of the time delegates are sufficient as a way of passing functions around
    in a program, you can also use a pointer to a function. You create a pointer to
    the function in the way you would expect using the address operator, but you also
    have to specify the parameter and return types:


    delegate<int,void> pFunc=&myFunction;


    The need for the parameter and return types to be specified is mainly to resolve
    any problems with function overloading.


    Having specified a pointer to void myFunction(int), you can call myFunction(int)
    using pFunc(42). Note that no dereference is needed because when you call a function
    the address is automatically used. You pass a function pointer as a parameter.
    For example:


    ```

    void myFunction(delegate<int,void> myParam{

    myParam(42);

    ```


    and use of it as:


    ```

    myFunction(pFunc);

    ```


    Notice that myFunction can only be called in an unsafe context as it has an unsafe
    parameter. You can also use a calling convention specifier, but only managed or
    unmanaged can be any Cdecl, Stdcall, Thiscall and Fastcall. You cannot perform
    pointer arithmetic on a function pointer.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Postlude


    You might be excited to learn all about pointers but, as you might have detected,
    they are not really a good idea. C and C++ programmers moving to C# tend to think
    in terms of pointers and hence like the facility, but in practice you almost never
    need them. If you need to do a quick conversion of a C/C++ program that uses pointers
    then it might be acceptable to use C# pointers to get things moving, but it should
    be considered a stopgap measure until you can implement the ideas without pointers.


    About the only time pointers might be necessary is in making use of API calls
    within the PInvoke subsystem. Even here there are usually alternatives and often
    passing by reference solves even pointer-to-pointer problems. Things do get more
    difficult when you need to pass a pointer to a block of memory and in this case
    you might have to use a fixed array or allocate memory on the stack and pass it
    directly to the API call. In most cases you don''t need to use pointers when implementing
    an algorithm in C# from scratch'
  merge: -1
  pgno: 355
