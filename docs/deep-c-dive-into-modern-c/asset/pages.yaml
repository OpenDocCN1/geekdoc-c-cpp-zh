  md: '# I Strong Typing & Type Safety


    # Prelude


    This is really the core philosophy of C# and yet it is rarely explained or discussed.
    In this section we look at what strong typing is and how it makes type safety
    possible. Along the way we look at the differences between value and reference
    and specifically class and struct. Inheritance is also a key part of type - without
    it type safety would be irrelevant - and so we need to be sure that it fully is
    understood. After that we see how multiple inheritance is implemented using interfaces.'
