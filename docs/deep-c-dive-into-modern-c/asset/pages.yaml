- img_proc: true
  md: 'Notice that the encapsulated method can be a static or an instance method.
    That is, the method can belong to an instance of the class or it can be a static
    "class method".


    The delegate''s Target property stores the instance and the Method property stores
    the method that the delegate encapsulates. This is how a delegate "knows" what
    method to call. If the delegate encapsulates a static method then the Target is
    null, i.e. there is no instance. To encapsulate a method on a specific object
    you simply have to qualify the method name with the object''s name, for example
    this.hello or MyObject.hello.


    # Covariance and Contravariance Revisited


    In the simplest case a method''s signature and return type have to match the signature
    of the delegate type that encapsulates it. However, there is more flexibility
    in how a method can match a delegate signature. In the documentation this is called
    covariance and contravariance, just to make it sound sophisticated. We have already
    made this idea twice before, in chapters 8 and 10, but it is worth seeing how
    it works for delegates.


    Put simple covariance allows the method to return a sub-class or derived type
    of the return type defined in the delegate. Assume for the moment that MyClassA
    is the base class and MyClassB is the derived class, that is:


    ```

    public class MyClassA {}

    public class MyClassB : MyClassA {};

    ```


    If you define the delegate type:

    delegate MyClassA HelloType(MyClassB param);


    then clearly a method returning MyClassA matches the signature. However, by covariance,
    does any method returning a type that inherits from MyClassA, such as MyClassB.
    That is, you can use HelloType with a function like:

    MyClassB myFunc1(MyClassB param);

    HelloType myDelegate = new HelloType(myFunc1);


    So the delegate type can encapsulate a method that returns a MyClassB. Following
    the rule that the delegate signature determines its invocation, the return type
    is always treated as MyClassA. If the method returns a derived type, MyClassB
    say, you have to use a cast to work with the result as a MyClassB object, for
    example:

    MyClassB myResult = (MyClassB)myDelegate(myB);


    Contravariance allows the method to have parameters that are base types of the
    types specified in the delegate that encapsulates it. That is, if you define the
    delegate type:

    delegate MyClassA HelloType(MyClassB param);'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'then a method that has a parameter that is a base class for MyClassB, such
    as MyClassA, matches the signature. For example:

    MyClassB myFunc2(MyClassA param);

    HelloTypeDelegate = new HelloType(myFunc2);

    is perfectly acceptable.


    Once again, you can only invoke the delegate by passing a MyClassB object:

    MyClassARes= myDelegate(my);

    but this works because the method that the delegate invokes can treat as a more
    primitive type, i.e. as a MyClassA object, which is what it wants to work with.


    # Generic Delegates


    To confuse matters even more, or should be that to confer furtherance and power,
    you can also create generic delegate types. Put simply, you can create any generic
    type within a delegate definition. For example:

    delegate int HelloType<T>(T param);


    creates a delegate with a generic parameter.


    To use the delegate<int> you have to provide the type information. For example:

    HelloType<int> = new HelloType<int>(hello);


    where Hello is a method which returns an int and has a single parameter. You can
    also use the shorter:

    HelloType<int> HelloInst = hello;


    Before you start to invent ways of creating generic delegates for every purpose,
    I should warn you that in main, generic delegates should only be used within generic
    classes. In this context they provide a way to create delegate instances that
    “fit in” with the functioning of the entire delegate class. For example, you might
    create a delegate as a notification or event method which can be customized to
    work with the same data types as the rest of the generic class.


    # Postlude


    Delegates are a central part of the .NET framework, but since .NET 2.0 it has
    been possible to save some typing and avoid unnecessary names by using anonymous,
    as opposed to named, methods. However as of .NET 3.5 anonymous methods have been
    overshadowed by lambda expressions. In both cases you can simply treat the new
    facilities as easier ways of defining a delegate. Anonymous methods are covered
    in depth in Chapter 14 together with lambda expressions. Also of interest is the
    way anonymous methods and lambda expressions enforce the adoption of closure,
    which is also discussed in that chapter.'
