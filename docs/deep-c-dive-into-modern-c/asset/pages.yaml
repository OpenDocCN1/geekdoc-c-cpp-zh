  md: "This will return an instance of MyClass stored in myarray[i] when you use an\
    \ index on an instance of the class you are defining. For a short, but unrealistic,\
    \ example we define the class:\n\n```\nclass MyArray\n{\n    private string[]\
    \ myarray= { \"test0\", \"test1\" };\n    public string this[int i]=myarray[i];\n\
    }\n```\n\nNow we can create an instance and use the indexer:\nmyArrayArrayObject\
    \ = new myArray();\nMessageBox.Show(myArrayArrayObject[0]);\n\n# Expression Trees\n\
    \nAn expression lambda is also special because it can be converted to an expression\
    \ tree. What is an expression tree? Put simply an expression tree is just an object\
    \ which contains all of the information contained in the lambda. It is a representation\
    \ of the function in data.\n\nWhy would you want to create an expression tree?\
    \ An expression tree can be stored or transmitted to another system where it can\
    \ be implemented at a later time or remotely. You can think of an expression tree\
    \ as a data exchange format for a lambda, but they also allow you to create lambdas\
    \ dynamically. You can create an expression tree without using a lambda and then\
    \ use it to create the method that corresponds to the lambda. That is, the expression\
    \ tree is one way of dynamically generating a method.\n\nThe main reason that\
    \ expression trees were introduced was that so LINQ, which makes heavy use of\
    \ expression lambdas, could turn a query into data structure and send this 'over\
    \ the wire' to a remote server, but there are lots of alternative and innovative\
    \ uses.\n\nTo see expression trees in action, let's take a simple expression lambda\
    \ and convert it into an Expression object. When an expression lambda is assigned\
    \ to an Expression variable it is automatically converted to an expression tree,\
    \ for example:\n\n```\nExpression<Func<int, int>> ExTree = (x) => x *;\n```\n\n\
    Notice that you have to specify the delegate type that the Expression object is\
    \ going to represent, in this case Func<int, int>. Following this instruction\
    \ ExTree contains a data representation of the expression lambda."
