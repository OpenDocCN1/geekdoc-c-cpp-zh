  md: "All that is missing is the invoke method that does the setting of the delegate\\\
    and the waking up of the thread:\n\n```\npublic void invoke(Delegate d)\n{\n \
    \   d = d;\n    autoEvent.Set();\n    do\n{\n        Application.DoEvents();\n\
    \    }while (T.ThreadState == ThreadState.Running);\n}\n```\n\nThe invoke method\
    \ simply stores the delegate to be invoked and signals,\nusing autoEvent, that\
    \ thread T should start running. As invoke is blocking, it\nenthen enters a loop\
    \ to wait for the invoked delegate to complete and thread T\nsuspend itself again.\n\
    \nYou can see that to implement BeginInvoke as a non-blocking invoke all you\n\
    have to do is return immediately.\n\nThat's all there is to invoke implementation\
    \ in the Point class. All we\need now is some code to try it out and this is very\
    \ easy. First we create a\npoint instance:\n\n```\npoint p = new Point();\n```\n\
    \nWe also need a delegate to invoke:\n\n```\nasyncTask update = delegate()\n{\n\
    \    p.x = 10;\n    p.y = 20;\n}\n```\n\nFinally we invoke it:\np.invoke(update);\n\
    \nWhen the invoke returns, the x and y properties of the Point object are\nset\
    \ to 10 and 20 – and this has been done by T running the\nupdate delegate.\n\n\
    The extension of these ideas to delegates that pass parameters is easy enough\n\
    – just an object array as in the case of the standard Invoke. The extension\n\
    to non-blocking invokes is more complicated because you have to allow for\nthe\
    \ possibility that multiple delegates will be queued for execution. Yes, you\n\
    need to use a queue to store all of the pending delegates. This complicates\n\
    matters because you have to control access to the queue and arrange for\nthread\
    \ T to empty the queue each time it is woken up. It is more complicated\nin the\
    \ details, but the principles are the same."
