  md: "protect a particular resource and accidentally use it to protect another, completely\
    \ unconnected, resource. This would result in a thread accessing resource one,\
    \ unnecessarily blocking all access to resource two.\n\nIn many ways it is better\
    \ to create an object specifically to be used to lock a particular resource and\
    \ include the name of the resource in the name of the lock. Do not make the common\
    \ mistake of using a string or a value object to lock because there are pitfalls\
    \ in using both. The string might well end up being shared during time it unboxed\
    \ each time was used, nullifying the effect of the lock.\n\nAnother potential\
