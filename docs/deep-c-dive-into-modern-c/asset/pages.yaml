    \ of the random number generator, something to store the size of the collection\
    \ and, of course, an index to the current position in the collection:\n\n```\n\
    {\n    private Random rnd;\n    private int Size;\n    private int loc = -1;\n\
    ```\n\nWe need the constructor to set everything up ready for the collection to\
    \ be enumerated:\n\n```\npublic TestCollection(int s)\n```\n\n```\n{\n    rnd\
    \ = new Random();\n    Size = s;\n}\n```\n\nNow we have to implement the methods\
    \ of the IEnumerator interface. The reset method is simply:\n\n```\nvoid IEnumerator.Reset()\n\
    {\n    this.loc = -1;\n}\n```\n\nYou don't really need the this, but it helps\
    \ to emphasize the fact that the enumerator works with the instance.\n\nThe Current\
    \ method takes the form of a read-only property:\n\n```\nobject IEnumerator.Current\n\
