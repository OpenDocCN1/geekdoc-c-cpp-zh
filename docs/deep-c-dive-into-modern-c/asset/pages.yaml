    ```

    IntPtr hwnd = GetForegroundWindow();

    StringBuilder Buff = new StringBuilder(200);

    GetWindowText(hwnd, Buff, 100);

    textBox1.Text = Buff.ToString();

    }

    ```


    Notice that StringBuilder uses UTF16 so each character takes two bytes and–-it
    can be larger than the string it currently holds. For this reason it is safe to
    use 200 as the number of bytes in the buffer.


    Exactly what type of string you need and what character encoding is a big

    problem and one that has no easy solution


    # Array Buffers


    You can use StringBuilder as a mutable buffer, but often this confuses the

    issue with encodings. A simple solution is to use an array.

    You can marshal a standard C# array into a C-style array pointer using

    LPArray. For example, in the previous example an alternative declaration is:


    ```

    [DllImport("User32.dll", CharSet = CharSet.Unicode)]

    static extern void GetWindowText(IntPtr hwnd,

    MarshalAs(UnmanagedType.LPArray) byte[] array,

    it nMaxCount);

    ```


    To use this version of GetWindowText we need an array of the correct

    type:


    ```

    IntPtr hwnd = GetForegroundWindow();

    byte[] Buff = new byte[100];

    GetWindowText(hwnd, Buff, 100);

    textBox1.Text = Encoding.Unicode.GetString(Buff);

    ```


    Notice also to display the result we have to convert the raw bytes to

    a string using the appropriate encoding. This is the extra work entailed if the

    buffer is text and not just bytes. Also notice that you can modify

    how you define an imported function so that it works with the type of

    managed data you want to work with.'
