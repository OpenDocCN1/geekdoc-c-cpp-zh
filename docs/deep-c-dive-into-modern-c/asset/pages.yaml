  md: 'XElement objects. You could just assign a new value to the Value property,
    but it is usually easier to use the setValue method because this performs automatic
    type conversions. For example:

    XAttribute Att1 =new XAttribute("Epoch",2000);

    Att1.Value = "2000";


    works and sets the attribute to a string "2000".


    However:

    Att1.Value = 2000;


    generates a run-time error because you need an explicit conversion, such as:

    Att1.Value = 2000.ToString();


    The good news is that:

    Att1.SetValue(2000);


    works without the need for an explicit conversion, as one does:

    Att1.SetValue(DateTime.Now);


    Going the other way is almost as easy, but you do have to use an explicit cast\and
    don''t need to use Value. For example:

    DateTime T = Att1.Value;


    doesn''t work, neither does:

    DateTime T = (DateTime) Att1.Value;

    but, perhaps surprisingly:

    DateTime T = (DateTime) Att1;


    You can cast an XAttribute to any numeric, bool, DateTime, TimeSpan and Guid.
    You can also cast to nullable versions of each of these data types, which can
    make handling missing data easier.


    # Converting To Real XML


    There is more to XML than a node tree. You can add many of the XML "decorations"
    by wrapping the root XElement node in an XDocument object. This can have only
    one XElement object as the root, but also a XDeclaration, a single XDocumentType
    and any number of XProcessingInstruction and XComment objects. As you can easily
    work out, each of these objects adds a corresponding "meta" tag to the XML that
    the XDocument represents. There are various, very reasonable, rules about when
    declarations are emitted, default declarations, and other bookkeeping concerns,
    which are all very obvious.'
