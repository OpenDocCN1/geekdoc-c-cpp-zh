  md: '# Chapter 24


    # COM


    Using COM objects from .NET can be a difficult subject and where it interop becomes
    most confusing. The reason is not just that it is poorly documented, but the range
    of implementation styles of COM objects is so great that it''s confusing. You
    might think at this stage “if it''s so difficult bother?” The answer is that,
    despite the fact that .NET makes it obsolete, COM is deeply embedded in the existing
    Windows technology. First generation Windows API technology was based on the DLL,
    as a function library – these functions you can use via PInvoke as described in
    the previous chapter. Second generation Windows used the same basic idea, but
    collected the functions together into COM interfaces. Microsoft has .NET classes
    that wrap much of the API, but there is still a great deal that is untouched.
    Then course there are the legacy COM objects that we created in an effort to take
    advantage of object-oriented code reuse. It looks as if COM and the humble DLL
    is going to be with us for a while yet.


    IJW (It Works) is perhaps the aspect of COM Inter that Microsoft likes to emphasize.
    The idea is that you add a reference to a COM object and the system imports it
    for you by automatically creating a class wrapper for it. It has to be said that
    this is ideal and you should always try importing a COM object by adding a reference
    to the file it is stored in before resorting to the techniques described in this
    article. The big problem with IJW is that if It Doesn''t Work (i.e. IDJW) then
    you are really dumped into a great unknown territory, and as key COM interface
    is named IUnknown, perhaps that should be “great IUnknown territory”.


    The supplied documentation on manually creating wrappers is poor. What has been
    provided is spread out under a range of different topic headings and seems to
    have a strange reluctance to simply tell you what it is all about. If you study
    the few supplied examples and try to match them to documentation, it is still
    very difficult to discover exactly what is going on. Really understand you need
    to know a little about how COM works and some of the variations on the basic theme
    that you encounter in real life.'
