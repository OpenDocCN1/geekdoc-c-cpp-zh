- img_proc: true
  md: "To access the 10-byte field you have to use pointer arithmetic on buffer, see\
    \ the next chapter, which is of course considered “unsafe”.\n\nTo allocate a fixed\
    \ number of bytes to the last field in a struct you can use the Size=field in\
    \ the StructLayout as:\n\n```\n[StructLayout(LayoutKind.Explicit,Size= 64)]\n\
    ```\n\nAfter C# 2.0, which permitted fixed arrays within structs, the above construction\
    \ is unnecessary, but it is still used in practice.\n\nIt is worth noting that\
    \ fixed arrays essentially use the same mechanism, i.e. fixed size allocation\
    \ and pointers, hence this is unsafe. If you need the fixed size buffers within\
    \ a pointer to a DLL then probably the best method is to use explicit marshaling\
    \ for the arrays, which is considered “safe”. Let’s take a look at all three methods\
    \ in use.\n\n# Calling the API\n\nAs an example of using structs with layout requirements\
