  md: '# # Chapter 14


    # # Anonymous Methods, Lambdas & Closures


    Anonymous methods were introduced in .NET 2.0 and, while they sound something
    designed to implement "dirty" shortcuts, they were a welcome addition to C#. In
    modern C# they have been superseded by lambda expressions, but there is one thing
    that an anonymous method can do that a lambda can''t they are still worth knowing
    about. In addition, statement lambdas are just a slightly different syntax for
    anonymous methods so they are the foundations upon which lambdas are built.


    The big problem with anonymous methods is figuring out what the problem is that
    they are designed to solve. So let''s take a look at what they are for. On one
    level anonymous methods are just about making delegates easier to create. Let''s
    briefly recap the stages of creating a delegate, which we''ve already covered
    in Chapter 12.


    # # Too Many Names


    The steps to create and use a delegate are:


    +   - Create the delegate type which specifies the signature and return type.

    - Write the method that you want the delegate to "wrap".

    - Instantiate the delegate type created in step 1 and use it to wrap the method.


    What all this means is that you have to invent multiple names for what in most
    cases are ideas:


    +   - the delegate type - MyDelegateType

    - the method to be wrapped - MyMethod

    - the instance doing the wrapping - MyDelegate'
