  md: 'Strong typing is all about trying to detect a particular error at compile time.

    The error in question is calling a method, or using a property, of an object that
    it doesn''t have. That is, strong typing will flag an error at compile time if
    myObject.myMethod(); isn''t possible because myObject doesn''t have a myMethod.
    A type is defined by a bundle of properties and methods and when you claim that
    a variable is referencing a particular type the system assumes that the type has
    exactly those properties and methods. So, when you write:


    ```

    MyClass myObject=new MyClass();

    ```


    myObject is assumed to have all of the properties and methods of MyClass.

    If, after this, you write:


    ```

    myObject.myMethod()

    ```


    then the compiler can check that MyClass defines a function called methodName
    at compile time and refuse to let the program run if it doesn''t.


    **Strong typing is a bookkeeping method of making sure that you only use what
    you declare you have implemented.**


    What this means is that every variable has an assigned type, provided by its class
    definition, and can only reference an object that has been created from that type
    definition. Of course, and you are probably so familiar with this idea that you
    don''t notice it, we generally allow derived classes to stand in for a base class,
    or more generally class that is lower in the inheritance chain.


    So we are accustomed to the idea that there is nothing wrong with:


    ```

    MyClassA myObject;

    ```


    ```

    myObjectB = myObjectB;

    ```


    as long as myObjectB inherited MyClass somewhere in its inheritance chain.


    Why is this permitted? The reason is that we can assume that any method or property
    that MyClassA is present in myObject. This is sometimes expressed as the Liskov
    Substitution Principle which is informally *anywhere* you can use a base class
    you can use a derived class. Of course, this is nonsense as the derived class
    can override methods in the base class and if these are used in place of the base
    class then things can go wrong.


    The Liskov principle is only true if we work to make it true. In particular, it
    is only true by default the language specifies early binding, more of this later.
    This leads to the idea of being "type safe". An instruction is type safe if it
    is possible to use type to check at compile time that it will not cause a runtime-error.
    If you want to determine that some feature of any language is type safe'
