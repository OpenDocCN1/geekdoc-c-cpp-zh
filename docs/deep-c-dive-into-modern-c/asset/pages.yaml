  md: 'One identifier fewer might not seem much of a victory, but now we can recast
    the code to express the fact that the delegate type is really about the signature
    and the delegate instance is about what actually happens by renaming the delegate
    "Hello", i.e. the name that we probably would have assigned the method:


    ```

    MyHelloDelegateType Hello = delegate(){

    MessageBox.Show("Hello From a Delegate");

    };

    ```


    Hello();


    You can specify parameters in the function definition by treating the keyword
    delegate as it was the function''s name, for example:


    ```

    MyHelloDelegate2 Hello2 = delegate(string Msg){

    MessageBox.Show(Msg);

    };

    ```


    However, for this work we need to define another delegate type that matches the
    new signature:


    ```

    delegate void MyHelloDelegateType2(string String);

    ```


    Notice that the identifier used as the parameter in the type definition doesn''t
    carry any meaning – it''s just there for the syntax.


    Perhaps the C-style signature specification:


    ```

    delegate void MyHelloDelegateType2(string string);

    ```


    would be better, but this doesn''t work in C#.


    With the type defined we can now call the delegate in the usual way:

    Hello2("delegate 2");


    The situation is a little more complicated than this simple example suggests.
    In fact, the anonymous method doesn''t have to match the signature of the delegate
    type exactly. As long as the delegate type has no parameters then the anonymous
    method can be defined with no parameters. For example, the following is perfectly
    legal, even though the delegate type specifies a single string:


    ```

    MyHelloDelegateType2 Hello3 = delegate() {

    MessageBox.Show("Default message!");

    };

    ```


    However, you still have to call the delegate with the correct signature:

    Hello3("dummy");


    The parameter supplied is simply thrown away. You can see why this approach doesn''t
    work with out parameters. If there is an out parameter defined, where would the
    return value come from?'
