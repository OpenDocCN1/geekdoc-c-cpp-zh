- img_proc: true
  md: 'Some of the simplicity of using a MulticastDelegate comes from the overloading
    of the += and -= operators, but there are other, perhaps surprising, ways that
    you can work with invocation lists. For example, you can create a delegate that
    has the combined invocation list of other delegates using the += operator:


    ```

    greet DelA = hello;

    greet DelB = goodbye;

    greetType DelC;

    DelC = DelA + DelB;

    ```


    In this case DelC encapsulates the methods of DelA and DelB. Similarly, the operator
    removes one delegate''s invocation list from another. For example:

    DelC = DelC - DelA;


    removes all of the delegates in the invocation list of DelA from DelC.


    It is also worth knowing that there are static methods defined on the Delegate
    class such as Combine and Remove which can be used to manipulate arrays of delegates
    as well as pairs of delegates.


    # Events


    A common misconception is that .NET events are just multicast delegates. This
    is mostly true but an event has some additional added infrastructure. Notice that
    we are discussing .NET events not WPF''s routed events which are much more sophisticated.


    An event is a multicast delegate with the addition of two accessor functions,
    add and remove, that take over the adding and removal of delegates from the invocation
    list. Most of the time you can ignore the existence of the accessor functions
    as the system will default implementations for you, and the += and -= operators
    are overloaded and call these default accessor functions, you can use an event
    as if it was a simple delegate.


    The basic idea is that a class can provide an event that any clients can subscribe
    by adding delegates to the invocation list of the event''s multicast delegate.
    The event can only be “raised” by the class that owns the event and this results
    in each delegate in the invocation list being called.


    Events are mostly generated automatically by Visual Studio, but to really understand
    what is going on you can''t do better than implement a custom event manually.
    First we need a suitable delegate type:


    ```

    public delegate int MyEventType(string param);

    ```'
