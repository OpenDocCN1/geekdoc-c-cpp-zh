  md: "# Late or Early?\n\nWhenever you change something in a language, no matter\
    \ how small or innocent the change is, the ripples spread out and reach parts\
    \ of the language that you might never have guessed. For example, with dynamic\
    \ typing binding is the rule, even if the method in use isn't virtual. Consider\
    \ the following class with two overloaded versions of the same method:\n\n```\n\
    public class MyClassA{\n    public string MyMethod(int i){\n        return \"\
    Integer\";\n    }\n    public string MyMethod(double f){\n        return \"Double\"\
    ;\n    }\n}\n```\n\nIf we now call the method but with a random type, i.e. the\
    \ type of the object is selected randomly, something that was impossible to do\
    \ before the introduction of dynamic, as in:\n\n```\nRandom R = new Random();\n\
    MyClassA MyObject = new MyClassA();\ndynamic i;\nif(R.NextDouble()<.5){\n    i=1;\n\
    }else{\n    i=1.0;\n}\nstring result=MyObject.MyMethod(i);\n```\n\nthen which\
    \ MyMethod is actually called at run time according to the type of i which is\
    \ discovered using reflection. If i is a double then MyMethod(double f) is called\
    \ and if it is an int then MyMethod(int i) is called.\n\nThis should be the behavior\
    \ you expect from your understanding of the way that dynamic types work, but notice\
    \ this that the late binding is being used in a situation where you might have\
    \ expected the usual early binding. That is, it fits into the principle that what\
    \ should happen should be the same as if the type of the dynamic variable was\
    \ known at compile time."
