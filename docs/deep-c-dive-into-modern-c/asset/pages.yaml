    # Task – The .NET Way To Thread


    Using threads as described so far is the low-level, yet surprisingly portable,
    way of implementing asynchronous code. Just about every language and every operating
    system has form of threading, but .NET has a higher-level implementation of asynchronous
    code that is built on top of threads, the Task. A Task is a class that represents
    an operation that will run on a separate thread. Threads are taken from the collection
    of already constructed threads waiting to be used – the thread pool. This speeds
    up as creating threads is a slow process.


    There are two task-related classes, Task and Task<TResult> – the first doesn''t
    return a result and the second returns a result of the specified type. Already
    we have something extra to the basic thread as threads you need to provide code
    to extract results from them.


    There are a number of different Task and Task<TResult> constructors but the simplest
    are Task(Action) and Task<TResult>(Func<TResult>) which create Task objects based
    on the Action or Func delegates.'
