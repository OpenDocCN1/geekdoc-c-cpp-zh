  md: '# Basic Operations


    The basic bit manipulation operations that are provided can be confusing because
    of the availability of similar operators specialized to Boolean data types.


    The bitwise operations are:


    | AND | & |

    |---|---|

    | OR | | |

    | XOR (Exclusive Or) | ^ |

    | NOT | ~ |


    All these work on integer data types and return the corresponding bitwise operation.
    For example:


    computes NOT(a) AND b.

    It is also worth introducing the "x" format specifier as used in 0xF0 to enter
    a hexadecimal number. They don''t work on floating point types or custom types
    unless you go to the trouble of overloading the operators. They work on Booleans,
    however, and return true or false according to the usual rules of the truth table.


    There are also three logical operators that only work with Boolean:


    | AND | && |

    |---|---|

    | OR | || |

    | NOT | ! |


    These only work with Boolean variables and return the true or false results as
    the bitwise operators. The && and || operators are special because they are "lazy"
    evaluation operators. If you write:


    ```

    bool x = false, y = true;

    bool w = x & y;

    bool v = x && y;

    ```


    then w and v will have the same value. However, in the case of && the y variable
    will not be used at all the fact that x is false means that the entire result
    has to be false no matter what other variables have. In general, x&& only evaluates
    y if x is true and x|| only evaluates y if x is false. This is not a question
    of efficiency, allows for the possibility that'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'evaluating y when the condition was already determined by x would cause an

    error of some Sort. For example:


    ```

    a = 0;

    if (a != 0 & (b / a) < .1) { };

    ```


    throws an exception because it attempts to perform the illegal divide by zero,

    whereas:


    ```

    a = 0;

    if (a != 0 && (b / a) < .1) { };

    ```


    doesn''t the lazy evaluation avoids trying to divide when a is 0.


    In addition to the bitwise logical operators C# also has left- and right-shift

    operator. For example, a = a >>; shifts the contents bits to the right

    a and a = <<; shifts the contents bits to the left. You can consider a

    left-shift to be an integer multiplied by two and a right-shift to be a multiply
    by

    to. If the data type being shifted is a signed 32- or 64-bit type then an

    arithmetic right-shift is performed, i.e new high-order bits are set to the sign

    bit. If the data type is an unsigned 32- or 64-bit type then a logical right shift

    is performed, ie a zero is shifted into the high location.


    If you want to perform logical shift on a signed type you can simply use an

    explicit cast. For example:


    ```

    int a = -1;

    int b = a >> 8;

    ```


    performs an arithmetic shift right, but:


    ```

    int c = (int) ((uint) a >> 8);

    ```


    performs a logical shift right, ie shifts in zeros from the right.


    All of the logical operators and the shifts with 32- or 64-bit data types.

    In the case of the simple logical operations 16- and 8-bit data is automatically

    converted to 32-bit types and you need to use an explicit cast to recover the

    original data type, for example:


    ```

    byte a = 0xFF, b=0xF0;

    byte c = (byte) (a & b);

    ```


    Things are just as simple with shifts, for example what is the result of:


    ```

    Int16 a = 0xFF;

    Int16 c = (Int16)((int)a << 8);

    ```


    You will discover a problem with signed types. If you attempt to assign a hex
    value

    that represents a negative number, for example:


    ```

    Int16 a = (Int16)0xFFFF;

    ```


    you''ll find it doesn''t work.'
