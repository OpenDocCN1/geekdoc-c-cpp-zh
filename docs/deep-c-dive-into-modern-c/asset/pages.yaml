    \ = Math.Pow(new Random().NextDouble(), 0.6);\n}\nMessageBox.Show(\"done \" +\
    \ sw.Elapsed.TotalMilliseconds.ToString());\nsw.Reset();\n```\n\nThe simplest\
    \ way is arithmetic on a random of data. The Stopwatch class, which can record\
    \ time accurately across multiple threads, is used to time how long the loop takes\
    \ and to make use of this very useful class you need to add is:\nusing System.Diagnostics;\n\
    \nWe can turn this loop into a parallel loop very easily. The Parallel static\
    \ class has a For method which accepts the start and end value for the loop and\
    \ a delegate to execute. In the general command is\nParallel.For(start, end, delegate);\n\
    \nThe loop is run from start to end-1 and must run in the forward direction, that\
    \ is smaller to bigger index values. There are variations on the Parallel.ForEach\
    \ command, including parameters to control the parallel iteration and a Parallel.ForEach,\
    \ and the problem that we are about to encounter can happen with all of them.\n\
    \n```\nThe simplest way to provide the delegate is to use a lambda expression\
    \ and the following example will execute the code for values of i from 0 to size-1.\n\
    int size = 1000000;\ndouble[] data = new double[size];\nStopwatch sw = new Stopwatch();\n\
    sw.Start();\nParallel.For(0, size, i => {\n    data[i] = Math.Pow(new Random().NextDouble(),\
    \ 0.6);\n});\nsw.Stop();\nMessageBox.Show(\"done \" + sw.Elapsed.TotalMilliseconds.ToString());\n\
    sw.Reset();\n```\n\nThis works and the results are impressive. On a dual-core\
    \ machine the simple loop takes around 4000ms and the parallel loop takes 2500ms,\
    \ which isn't quite half but still represents a worthy speed up. If you use the\
    \ Task Manager or the diagnostic tools to monitor CPU usage, you will see that\
    \ the simple loop uses 100% of the cores while the parallel loop uses"
