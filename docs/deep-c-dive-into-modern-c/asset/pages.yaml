  md: '# Access Modifiers


    As you can''t do much with object-oriented programming without mastering access
    modifiers you probably know about them already. However, it is still worth gathering
    the basic ideas here. There are four access modifiers you can use to control which
    classes have access to properties and methods of another class:


    +   - public – access is allowed by any code, no matter what class or assembly
    it belongs to

    - internal – as public, but restricted to code in the same assembly

    - protected – access is allowed by code in the same class or a derived class

    - private – as protected, but restricted to code in the same class. This is the
    default.


    There is also the combined modifier:


    +   - protected internal – access is allowed to any code in the same assembly
    or by any derived class in another assembly.


    It is important to realize that private and protected can be decompiled just easily
    as a public method and reflection (when the code is running with full trust) can
    be used to call a private or protected method from any code. This confusion between
    security and design is a general problem in considering any mechanism of inheritance
    control. It is tempting to always deny access to any code that you somehow feel
    is proprietary and belongs to you, even if it actually doesn''t succeed in denying
    access and only makes it more difficult to get further value from your work.


    This is all there is to know about basic access modifiers, together with the simple
    fact that no derived class can have a freer access modifier than its base class.
    This wasn''t the case what was supposed to be private could become public via
    a derived class.


    As for encapsulation is concerned, the use of the modifiers is simple enough.
    Any property or method that is part of the class''s interface with the outside
    world should be declared public. Public types can be accessed by the outside world
    and by classes derived from the class that they are declared in. Any internal
    mechanism that is strictly to be hidden from the outside world should be declared
    either protected or private.'
