- img_proc: true
  md: 'MyInt2. This is clearly dangerous, unexpected and usually unwanted behavior
    and, as already mentioned but it cannot be said so often, results in code that
    is "unsafe".


    One very common use of pointers is to get at the internals of a data type. For
    example, suppose you want to retrieve the four bytes that make up a 32-bit integer:


    ```

    int MyInt = 123456789;

    ```


    We can always use a void pointer to get the address of any variable:


    ```

    void* MyPointer;

    MyPointer = &MyInt;

    ```


    Then we can cast it to a pointer to any of the standard types and use pointer
    arithmetic, in this case it to a byte which is converted to a char:


    ```

    byte* pMyByte = (byte)*pMyPointer;

    char MyChar = (char)*(pMyByte + 3);

    MessageBox.Show(MyChar.ToString());

    ```


    The reason we dont go directly to a char pointer is a char that is two bytes in
    size and we are converting a 4-byte int to ASCII byte characters rather than Unicode
    2-byte characters.


    In most cases there managed ways of gaining access to the internal structure of
    the data types using either the Convert or BitConverter classes. In this case
    the GetBytes method of the BitConverter can be used to convert the int to a byte
    array and then any of the bytes can be converted to a char using the Convert class:


    ```

    Byte[] Bytes=BitConverter.GetBytes(MyInt);

    MyChar = Convert.ToChar(Bytes[3]);

    ```


    As long as there is a GetBytes method that will convert the data type into a byte
    array, you don''t need to use pointers.


    # Multiple Indirection


    If you think you have got the idea of indirection then it''s time to put you to
    the test. The real mark of a pointer expert is being able to handle double, treble,
    and more, indirection.


    For example:


    ```

    int** ppMyInt;

    int* pMyInt;

    int MyInt=1234;

    pMyInt = &MyInt;

    ppMyInt = &pMyInt;

    MessageBox.Show(**ppMyInt).ToString());

    ```'
