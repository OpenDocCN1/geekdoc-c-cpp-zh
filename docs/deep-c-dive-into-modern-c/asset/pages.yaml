  md: '# Advanced Capture


    There are other capture group constructs, but these are far less useful and, because
    they are even more subtle, have a reputation for introducing bugs. The balancing
    group is, however, worth knowing as it gives you the power to balance brackets
    and other constructs, but first we need to know a few of the less common groupings,
    the assertions. There are four of these and the final three are fairly obvious
    variations on the first. They all serve to impose a condition on the match without
    affecting what is captured, they have zero-width in the jargon:


    +   - `(?=regex)` - zero-width positive lookahead continues the match only if
    the regex matches on the immediate right of the current position but does not
    capture the regex or backtrack if it fails. For example, `\w+(=\d)` only matches
    a word ending in a digit, but the digit is not included in the match. In this
    case, it matches Paris9 but returns Paris as capture 0. In other words, you can
    use it to assert a pattern that must follow a matched subexpression.


    +   - `(!regex)` zero-width negative lookahead works like the positive lookahead
    assertion, but the regex has to fail to match on the immediate right. `\w+(?!\d)`
    only matches a word that doesn''t have a trailing digit.


    +   - `(?<=regex)` Zero-width positive lookbehind works like the positive lookahead
    assertion, but the regex has to match on the immediate left. For example, `(?<=\d)\w+`
    only matches a word that has a leading digit.


    +   - `(!regex)` Zero-width negative lookbehind assertion. The negation of the
    Zero-width positive lookbehind assertion. For example, `(?<!\d)\w+` only matches
    a word that doesn''t have a leading digit.


    Now that we have seen the assertions we can move on to consider the balancing
    group: `(?name1-name2>regex)`


    which works by deleting the current capture from name2 and storing everything
    since the last capture in the capture collection for name1. If there is no current
    capture for name2 backtracking occurs and, if this doesn''t succeed, the expression
    fails.'
  merge: -1
