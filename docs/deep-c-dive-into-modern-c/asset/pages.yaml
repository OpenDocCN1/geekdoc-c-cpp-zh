  md: "# More Selection\n\nUnderstanding how the query expression is converted into\
    \ calls to the query extension methods greatly clarifies how LINQ works and what\
    \ you can do with it. If you want to stay with a clear design you should always\
    \ use Select as a \"projection operator\". That is, it should reduce the data\
    \ item to something that is a subset of itself. For example, if the data item\
    \ is a struct then the select should specify which fields are to be extracted\
    \ and returned in a \"smaller\" struct. This is a common and interesting task\
    \ so let's look at another simple example. First we need a class or struct to\
    \ hold the data:\n\n```\npublic struct Contact {\n    public string name { get;\
    \ set; }\n    public string address { get; set; }\n    public int phone { get;\
    \ set; }\n}\n```\n\nThe default properties implementations are just enough to\
    \ allow us to initialize a List of such structs directly:\n\n```\nList<Contact>\
    \ AddressBook= new List<Contact>(){\nnew Contact(){\n    name=\"mike\",\n    address1=\"\
    Anywhere\",\n    phone=123,\n}new Contact(){\n    name=\"Ian\",\n    address1=\"\
    Anywhere2\",\n    phone=124,\n}new Contact(){\n    name=\"John\",\n    address1=\"\
    Anywhere3\",\n    phone=125\n};\n```\n\nAs List supports Enumerator can now move\
    \ immediately using LINQ to query it. To extract a single field, say name, you\
    \ would use a query like:\n\n```\nvar q = from N in AddressBook select N.name;\n\
    foreach(var n in q) {\n    MessageBox.Show(n);\n}\n```\n\nNotice the use of var\
    \ to avoid having to state the data type. If you don't want to use an anonymous\
    \ type you can replace var with string.\n\nIt is easy to see how this translates\
    \ to the call to the extension method which has to return just the single field\
    \ as a string, but how do you return"
  merge: -1
