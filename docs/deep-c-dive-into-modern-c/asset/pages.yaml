  md: 'Finally we can resort to atomic operations - ones that cannot be interrupted
    by a change of thread. That is, once started an atomic operation will complete
    without yielding to another thread. In general, which operations are atomic defined
    by the hardware, so this isn''t a particularly stable multi-platform solution.
    However, it is one of the easiest approaches to thread safety.


    # Atomic Operations and Volatility


    Before moving onto more sophisticated ideas, let''s consider some of the issues
    of low-level data access. The .NET CLR guarantees that all native integer operations
    are atomic in the sense that they cannot be interrupted by a task swap in mid
    operation. This avoids the problem of a variable being changed by another thread
    in the middle of an operation resulting in invalid or inconsistent data.


    The problem with this definition is that the native integer size varies according
    to machine type. So


    ```

    Interlocked.Increment(ref count);

    ```


    will add one to count without any risk that the process will be interrupted by
    another thread using a similarlocked operation. Notice that it potentially be
    interrupted by standard non-interlocked operations. For this approach to work,
    all of the threads have to use nothing but interlocked operations to access shared
    resources. The advantage of Interlocked is simplicity and its disadvantage is
    that it is limited to the methods provided. In most cases, it is much better to
    use a lock based on a Monitor, as described later.


    If you do the increment in function A and B to use:


    ```

    Interlocked.Increment(ref count);

    ```


    in the previous example you will find that the result is always 20000000 as no
    increments are ever interrupted.


    There is another strange problem associated with the way a variable changes its
    state or not, referred to as volatility. During a non-atomic operation a variable
    might change its state due to another thread. However, it is possible the compiler
    and/or machine architecture may make the assumption that a variable cannot change
    if the thread doesn''t change. This allows variables to be cached in fast memory,
    but the cached copy may not reflect the true value of the variable stored in main
    memory. In practice, this problem doesn''t happen at all but you can declare a
    variable volatile if you need the compiler to check that it hasn''t been changed
    by another thread. In practice it usually isn''t necessary to use volatile as,
    once again, if you use a lock it performs a volatile read at the start and a volatile
    at the end making everything is up-to-date.'
