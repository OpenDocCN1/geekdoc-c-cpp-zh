  md: '# Grouping and Alternation


    This is easy enough but about:


    ```

    @ISBN: |ISBN-13:\s*d

    ```


    At first glance this seems to match either ISBN: or ISBN-13: followed by any number
    of white space characters and a single digit – but it doesnt. The operator has
    the lowest priority and the alternative matches are everything the left and everything
    to the right, i.e. ISBN-13: or ISBN:\s*d. To match the white space and digit in
    both forms of the ISBN prefix we would have write:


    ```

    @ISBN:\s*d|ISBN-13:\s*d

    ```


    Clearly avoid repeating everything that is common on either side of the alternation
    operator is going to make things difficult and this is where grouping between
    parentheses is treated as a single unit, a subexpression, and grouping has a higher
    priority than the alternation operator. So, for example:


    ```

    @(ISBN: |ISBN-13)\s*d

    ```


    matches either form of the ISBN prefix followed by any number of white space characters
    and a single digit because the brackets limit the range of the alternation operator
    to the substrings to the left and right within the bracket.

    The greedy/lazy situation also applies to the alternation operator. For example,
    suppose you try to match the perfectly ungrouped expression, without the colon,
    @(ISBN |ISBN-13"). In this case first, ISBN, will match even if the string is
    ISBN-13. It doesn''t matter that the second expression is a "better". No amount
    of grouping will help with this problem because the shorter match will be tried
    and succeed first. The solution is to swap to the order of the subexpressions
    that the longer comes first or to include something that marks the end of the
    target string. In this case for example, if we add the colon then to the ISBN:
    subexpression cannot match the ISBN-13: string.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Capture Groups


    Now that we have explored grouping it is time to introduce the most sophisticated
    and useful aspect of regular expressions, the idea of “capture”. You may think
    that brackets are just about grouping together items that should be matched as
    a group, but there is more. A subexpression, something between brackets, is said
    to be “captured” if it matches, and captured expressions are remembered by the
    engine during the match. Notice that a capture can occur before the entire expression
    has finished matching—indeed a capture can occur even if the entire expression
    eventually fails to match at all.


    The .NET regular expression classes makes captures available via the capture property
    and the CaptureCollection. Each capture group, i.e. each subexpression surrounded
    by brackets, can be associated with one or more captured string. To be clear,
    the expression:


    ```

    @(<div>)

    ```


