  md: '# VI Unsafe & Interop


    Type safety and managed code is a big advantage, but there usually comes a time
    when you have to talk to legacy unmanaged code, often the operating system. To
    make this possible, C# provides the interop subsystem which, in the form of PInvoke
    (Platform Invocation Services), can be used to call operating system functions
    in DLLs or Linux libraries. If you are working under Windows then you can also
    interface to COM objects, which are still very important. Finally there is unsafe
    code, which allows you use pointers and manage memory directly.


    Prelude'
