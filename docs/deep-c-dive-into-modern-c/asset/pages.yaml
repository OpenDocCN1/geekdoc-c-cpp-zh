  md: '# V. Data - LINQ, XML, Regular Expressions


    All programming languages need to work with C# has some of the best data features
    around. LINQ is a general-purpose data query language built right into the core
    of C#. It provides a way to work with XML that is unique. In addition, C#''s regular
    expressions are more powerful than you might expect.


    # VI. Unsafe & Interop


    Type safety and managed code is a big advantage, but there usually comes a time
    when you have to talk to legacy unmanaged code, often the operating system. To
    make this possible, C# provides the interop subsystem and, in the form of P/Invoke
    (Platform Invocation Services), this can be used to call operating system functions
    in DLLs or Linux libraries. If you are working under Windows then you can also
    interface to COM objects, which are still very important. Finally there is unsafe
    code which uses pointers and manage memory directly.


    # Postlude


    C# is a modern, general-purpose language and it still has an edge when it comes
    to Windows programming. Its status as a cross-platform language is as good as
    any and improving all the time. If you can, it is worth using Visual Studio under
    Windows for program development as it provides the best environment for C# that
    .NET is currently available. While there are many legacy versions of C# and the
    .NET framework, simply use the latest for new projects.'
