    # Interfaces As Parameters


    In the simple COM model the only interfaces are returned via QueryInterface and
    a suitable IID. However, COM programmers didn''t keep to this simple model as
    they found more or less essential to write other interface functions that returned
    pointers, sometimes with the IID but without one. Consider for a moment NewWorkItem:


