  md: '# # Chapter 23

    # Interop


    All .NET code is managed code. What this means is that objects are garbage collected
    and code cannot accidentally overrun limits and read and write areas it isn''t
    supposed to, although see Pointers later on. In an ideal world all code could
    be managed, although not everyone would agree with this statement. There are lots
    of examples of important unmanaged code – all major operating systems for example
    are unmanaged. If you want to call an operating system function from C# then you
    need to use interop, specifically Invoke, Platform Invoke, to allow managed code
    to call an unmanaged function.


    Pinvoke has a long history of use under Windows but it also works, with some restrictions
    on Linux. Under Windows we also have many facilities implemented as COM objects
    and to use COM objects from managed code we need a slightly different flavor of
    interop and this is described in the next chapter. In both cases the big problem
    is converting the data from its representation in C# to the external representation
    used by the unmanaged code, usually C/C++. This is called "marshalling" and it
    is handled by applying attributes to the declaration of the external functions.


    Marshaling works in both directions when you are writing managed code you can
    use unmanaged functions and vice versa. In this account we focus on using unmanaged
    functions from managed code because this is the common requirement. However, the
    same ideas apply if you are trying to write a function in C# that can be called
    by other languages.


    # ## Basic PInvoke


    The whole of interop is governed by the use of attributes which modify how the
    definition of an external function is interpreted by the system. This use of attributes
    is a good demonstration of how useful they can be and they are the subject of
    Chapter 25. The most important attribute is DllImport which, despite its name,
    will import functions from a range of different library types including DLLs and
    Linux .SO.'
  merge: -1
  pgno: 282
- img_proc: true
  md: "For example, for Windows [DllImport(\"mylib\")]will look for mylib.exe or mylib.dll.\
    \ For Linux it looks for mylib.so, mylib.so, mylib and mylibyl. For Mac OS the\
    \ extension is .dylib. Notice that you can specify the library in more detail\
    \ including path and extension to make sure you get the library you want.\n\n\
    There are also ways of loading a library at runtime dynamically. For example,\
    \ under Windows you can use the GetSystemMetrics OS function which is stored in\
    \ user32.dll using System.Runtime.InteropServices;\n\n```\n[DllImport(\"user32.dll\"\
    )\nstatic extern int GetSystemMetrics(int smIndex);\n\nprivate void button1_Click(object\
    \ sender, EventArgs e)\n{\n    TextBox.Text = GetSystemMetrics(0).ToString();\n\
    }\n```\n\nNotice that the function is marked extern you cannot follow the declaration\
    \ by a function body. In addition the function has to be declared static.\n\n\
    Once you have the declaration you can use the function as if it was a managed\
    \ function within your program. However, you need to keep in mind that you call\
    \ it the interop system converts the parameters to an unmanaged data representation\
    \ and converts the result back to a managed representation. For this is simple\
    \ that you can rely on the system to do the job by default. A very simple Linux\
    \ example is:\n\n```\n[DllImport(\"libc.so.6\")\nstatic private extern int getpid();\n\
    ```\n\n```\nint pid = getpid();\n```\n\nThe main problem is finding the function\
    \ and the library file it is stored in and then working out the parameters are.\
    \ For more sophisticated functions you also have to customize the marshaling from\
    \ managed to unmanaged data.\n\n# Custom Marshaling\n\nOne of the big problems\
    \ in using interop is controlling the way parameters are marshaled. Often you\
    \ can simply ignore the problem and allow default marshaling to do the conversion\
    \ without having to think about it. For anything more complicated you need to\
    \ use custom marshaling."
