  md: "# # Chapter 27\n\n# ## Advanced Structs\n\nStructs are a fundamental data type\
    \ in C# and most other modern programming languages. In C# structs are the value\
    \ type equivalents of classes, which are reference types. In general, structs\
    \ can have methods as well as properties and, with the exception of inheritance,\
    \ they can be used in the same way as a class. Structs cannot inherit from another\
    \ struct or another class. struct and concentrate on it as a data type, i.e. we\
    \ are going to focus on the struct as a data structure.\n\nData structures are\
    \ inherently simple, but you might be surprised by how fast things can become\
    \ more complicated. The problems mostly arise when you have to work with structures\
    \ created in other languages, either saved and reloaded, sent over the wire or\
    \ when calling native functions that are not part of C# or .NET.\n\nYou need to\
    \ have a rough idea of how to call an API function using PInvoke and what marshaling\
    \ is all about, which was covered in Chapter 25. Many of the techniques described\
    \ in this chapter can be extended to any data type.\n\n# ## Layout\n\nIn many\
    \ situations you can simply declare and use a struct without worrying about how\
    \ it is implemented and specifically how its fields are laid out in memory. However,\
    \ if you have to provide structs for consumption by other programs, or use \"\
    foreign\" structs, then memory layout matters. What do you think the size of the\
    \ following struct?\n\n```\npublic struct struct {\n    public byte a;      //\
    \ 1 byte\n    public int b;       // 4 bytes\n    public short c;     // 2 bytes\n\
    \    public byte d;      // 1 byte\n}\n```\n\nA reasonable answer is 8 bytes,\
    \ this being the sum of the field sizes."
  merge: -1
  pgno: 330
- img_proc: true
  md: "If you actually investigate the size of the struct using:\nint size = Marshal.SizeOf(test);\n\
    \nyou will discover, in most cases, that the struct takes 12 bytes. The reason\
    \ is that most CPUs work best with data stored in sizes larger than a single byte\
    \ and aligned on particular address boundaries. Pentium-derived CPUs like their\
    \ data in 16-byte chunks like data to be aligned on address boundaries that are\
    \ the same as the data. So, for example, a 4-byte integer should be aligned on\
    \ a 4-byte address boundary, i.e. the address should be of the form 4n-i. The\
    \ exact details aren't important, you just need to be aware that such considerations\
    \ will modify the layout from what you might expect.\n\nWhat is important is the\
    \ compiler will use \"padding\" bytes to align the data within a struct. You can\
    \ control the padding explicitly, but notice that some processors throw an exception\
    \ if you use data that isn't aligned. To control the layout of a struct you need\
    \ to use InteropServices;\nso add:\n\n```\nusing System.Runtime.InteropServices;\n\
    ```\n\n```\nThe struct is controlled by a StructLayout attribute. For example:\n\
    [StructLayout(LayoutKind.Sequential)]\npublic struct struct1\n{\n    public byte\
    \ a;      // 1 byte\n    public int b;       // 4 bytes\n    public short c; \
    \    // 2 bytes\n    public byte d;      // 1 byte\n}\n```\n\nforces the compiler\
    \ to assign the struct sequentially as listed in the definition, which is what\
    \ it does by default.\n\nOther values of LayoutKind are Auto, which lets the compiler\
    \ determine the layout, and Explicit, which lets the programmer specify the size\
    \ of each field. Explicit is often used to create sequential layouts with no packing,\
    \ but in most cases it is simpler to use the Pack field. This tells the compiler\
    \ how to size and align the data that makes up the fields. For example, if you\
    \ specify Pack = 1 then the struct will be organized so that each field is on\
    \ a byte boundary and can be read a byte at a time, i.e. no packing is necessary.\
    \ If you change the definition of the struct to:\n\n```\n[StructLayout(LayoutKind.Sequential,\
    \ Pack = 1)]\npublic struct struct1\n```\n\nyou will discover that it is now 8\
    \ bytes in size, which corresponds to the fields laid out in memory sequentially\
    \ with no packing bytes. This is what you need to work with most of the structures\
    \ defined in the Windows API and in C/C++."
  merge: -1
  pgno: 331
- img_proc: true
  md: 'In most cases you don''t need to use other values of Pack, but if you set Pack
    = 2 then you will find that the size of the struct is now 10 bytes because a byte
    is added to each of the byte fields to make the entire struct readable in 2-byte
    chunks. If you set Pack = 4 then the size increases to 12 bytes to allow the entire
    struct to be read in blocks of 4 bytes. After this nothing changes because the
    pack size is ignored once it is equal or larger to the alignment used for the
    CPU, which is 8 bytes for the Intel architecture.

    The layout of the struct for different pack sizes can be seen in below:


    | byte | byte | byte |

    |---|---|---|

    | int | | |

    | | int | |

    | short | short | |

    | byte | byte | int |

    | Pack=1 | | short |

    | 8 bytes | Pack=2 | byte |

    | | 10 bytes | Pack=4 |

    | | | 12 bytes |


    It is also worth mentioning that you can modify how a struct is packed by simply
    reordering its fields. For example, by changing the field ordering to:

    public struct struct1


    ```

    public byte b; // 1 byte

    public byte d; // 1 byte

    public short c; // 2 bytes

    public int b; // 4 bytes

    ```



    The struct doesn''t need packing and occupies just 8 bytes without the need for
    any intervention.'
