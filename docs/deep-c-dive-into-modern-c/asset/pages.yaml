  md: "A lambda shares all its characteristics with anonymous methods. For example,\
    \ to define the Hello anonymous method earlier listed using a statement lambda\
    \ you would write something like:\n\n```\ndelegate int HelloType(int param);\n\
    HelloType HelloInst = (int param1) => {\n    MessageBox.Show(\"Hello delegate\
    \ World\" + param1.ToString());\n    return ++param1;\n}\n```\n\nThe idea is that\
    \ you are still creating an anonymous method, but the body of the method is now\
    \ defined using a slightly different syntax. Once the lambda is encapsulated by\
    \ the delegate instance everything works in the same way. Note there is nothing\
    \ special about the name param1 - you can call parameters whatever you want.\n\
    \nThere are some tricks that you can use with statement lambdas to make the method\
    \ definition even more concise and flexible. The first is that the compiler can\
    \ deduce the type of the parameters from the delegate type. Essentially the lambda\
    \ has to have the same number of parameters as the delegate and the return type,\
    \ if any, it has to be implicitly convertible to the return type.\n\nThus the\
    \ previous lambda can be written:\n\n```\nHelloType HelloInst = (param1) => {\n\
    \    MessageBox.Show(\"Hello delegate World\" + param1.ToString());\n    return\
    \ ++param1;\n}\n```\n\nYou can also leave out the brackets if the lambda has only\
    \ one parameter:\n\n```\nHelloType HelloInst = param1 => {\n    MessageBox.Show(\"\
    Hello delegate World\" + param1.ToString());\n    return ++param1;\n}\n```\n\n\
    and you can use empty brackets () if there are no parameters at all.\n\n```\n\
    HelloType HelloInst = () => {\n    MessageBox.Show(\"Hello delegate World\");\n\
    \    return 0;\n}\n```\n\nYou can use a lambda anywhere you would use an anonymous\
    \ method and they are most often used as parameters as an easy way to pass a function\
    \ to a method."
