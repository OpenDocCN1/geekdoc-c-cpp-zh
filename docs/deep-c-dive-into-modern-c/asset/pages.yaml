- img_proc: true
  md: 'This is static typing and the alternative is dynamic typing where a variable
    can be declared to be a different type or more usually can acquire a new type
    implicitly by being assigned to that type. In this approach you can even dispense
    with the idea that a variable has a type as it can clearly be made to reference
    anything you like.


    C# uses mostly, static typing. This may seem like a small decision but actually
    has far reaching consequences for the language. In particular static typing makes
    early binding the natural choice. The idea of binding is confusing and generally
    poorly defined. It is basically about when a variable acquires its reference or,
    more accurately, when its reference is determined. For simple cases early binding,
    i.e. binding at compile time, is not only obvious, it is the only option. For
    example, if you write:


    ```

    a="Hello World";

    ```


    It is very obvious that a is a string and it references a string literal and this
    is determined at compile time. The variable a is early-bound to its reference.

    It seems as if late binding is a silly idea - why would you put off binding to
    its reference? Consider the case where we have two classes MyClassA and MyClassB
    derived from it. Both have a myWeb method, but MyClassB has overridden it and
    provides its own version of the method.

    Consider what happens in:


    ```

    MyClassA myObject;

    myObject=anObject;

    myObject.method();

    ```


    where anObject is either a MyClassA or a MyClassB. This is perfectly legal and
    type safe as MyClassA and MyClassB have a myWeb attribute. However, it raises
    the question of which of the versions of the method should be called?

    If you use early binding then myObject.method should be bound at compile time
    to this is the variable''s declared type. If you use late binding then it could
    be either of the versions depending on what anObject is at run.


    Early binding only depends on the declared type of the variable. Late binding
    depends on the type of the object referenced at run time.


    Notice that only the early binding strictly satisfies the Liskov principle as
    only it guarantees that the method used is always the same, independent of the
    actual type of the object.


    In C# early binding is the default but you can opt for late binding, see Virtual
    Functions in Chapter 4.'
