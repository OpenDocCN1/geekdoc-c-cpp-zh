- img_proc: true
  md: "multiple fields? The problem is that you don't have a data type, i.e. a struct,\
    \ that holds a subset of fields. You could define a suitable struct, but the standard\
    \ solution is to create a new anonymous type on the fly:\n\n```\nvar q = from\
    \ N in AddressBook select new { N.name, N.phone };nforeach ( var n )\n{\n    MessageBox.Show(n.name.ToString\
    \ + n.phone.ToString());\n}\n```\n\nYou can see that these \"dynamic\" facilities\
    \ are required to make LINQ look simple.\n\n# Postlude\n\nBasically we have been\
    \ looking at LINQ to objects, but the same principles apply to all the other implementations\
    \ - LINQ to SQL, XML and ADO, for example. You should now be in a position to\
    \ see how these work, even if you still need a data source that LINQ doesn't support.\
    \ What is even more impressive is if you have a data source that LINQ doesn't\
    \ support, you should be able to add it by implementing IEnumerable.\n\nLINQ is\
    \ such a powerful and compact way of working with data that many suggest it should\
    \ be used in place of alternative methods of processing. In other words, use a\
    \ LINQ expression in favor of a foreach loop whenever possible."
