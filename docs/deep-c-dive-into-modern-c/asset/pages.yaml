  md: 'Function A adds one count in a loop and function B does the same. These are
    as two independent threads and the main thread waits until they have completed
    before using the Join method. If you run this program then you will discover that
    the final value of count isn''t predictable because it depends on when the two
    threads get to count. This is not thread-safe coding because the result changes
    each time you run it—it is subject to race conditions where both tasks update
    the variable at the same time and the result depends on which arrived at first.
    In particular consider what happened if function A is updating the counter and
    reads 42 but is interrupted by function B who also reads 42. They both add one
    to get 43 and store the result back in count which now holds 43 when it should
    hold 44 as there have been two updates.


    In a deeper sense it''s not thread safe because access to the global resource,
    i.e. count, isn''t controlled. In this case the increment is such a fast operation
    that the chance of being interrupted is low, but given enough updates the effect
    can be seen.


    This is the sort of problem that thread-safe code is designed to avoid. Notice
    that, as sort of threading error can have a low probability of occurring, it''s
    possible for it to go unnoticed for many, many runs of the program and look to
    all intents and purposes like some of random hardware failure. This is what makes
    multi-threaded programs very difficult to debug.


    # Ensuring Thread Safety


    There are three general approaches to making code thread safe, the first of which
    is to write reentrant code. If you only use local variables stored on the stack
    then restarting the function with another thread automatically saves the state
    of any original invocation. Restricting storage to the stack isn''t always easy,
    so .NET provides thread-local storage which ensures that each thread has its own
    copy of any variables it used. Reentrant code is a good approach if you need a
    function that can be used by multiple threads to do a task, but it forbids any
    sharing of resources which would render the code non-reentrant.


    A more general approach is to use access control which works by allowing only
    one thread to access a resource at a time. There are lots of facilities provided
    within .NET to allow you implement mutual exclusion and more complicated access
    methods. The big problem with access control is knowing when a resource is in
    use by a thread and when it is free. Access control also brings with it problems
    connected with what happens when a thread wants to use a resource which is locked.'
