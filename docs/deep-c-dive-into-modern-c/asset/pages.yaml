  md: '# Using Reentrant Code


    Reentrant code can be executed concurrently because each time it is run essentially
    a new copy of everything it uses is automatically created. Reentrancy is the key
    idea in functional programming where it is the norm, but in most languages you
    have to put in some work to achieve it. In C# you can create a reentrant function
    in a number of ways, but essentially you have to avoid using global non-constant
    data.


    To convert your example functions to be reentrant all we have to do is remove
    the use of the global variable. Once defined as local to each function, the variables
    are allocated on the stack and hence local to each thread has its own stack. Of
    course, this means that the two functions cannot interact with each other, but
    this is in the nature of reentrant functions.


    Consider the possibility that a class wants to be reentrant, i.e. have nothing
    but reentrant methods. This is fine as it doesn''t make use of global or static
    variables. A static variable is just a special case of global variable, i.e. it''s
    global to all instances of the class. If you want your class to be reentrant then
    you have no choice but to use thread-local storage. The simplest way of doing
    this is to use the [ThreadStatic] attribute. For example, to make the public count
    variable in the previous example thread-local, simply have to change its declaration
    to:


    ```

    [ThreadStatic] static public int count;

    ```


    Notice that now it is also a static variable shared by all instances of the class,
    but it''s shared by different threads executing methods in the same or different
    instances of the class. Now if you run this program you will see Θ as each thread
    increments its own copy of count and the main UI has its own copy which remains
    at Θ as it doesn''t increment it. Thread-local storage isn''t shared, which is
    the whole point of using.


    The [ThreadStatic] attribute is the most efficient way of creating thread-local
    storage. You can also do it the hard way using named or unnamed data slots, but
    you need to keep in mind that these are less efficient and only slightly more
    useful. In this case you have to allocate the storage yourself and use special
    storage and retrieval functions. The details are straightforward and documented
    under Thread.AllocateDataSlot and associated methods. Now it''s time to move on
    to a bigger and more important topic, exclusion.'
