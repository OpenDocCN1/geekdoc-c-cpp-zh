  md: "Polymorphism is often described as \"if-less\" computing because instead of\
    \ having to write something like:\n\n```\nif ( MyObject is MyClass)\n{\n  sortA(MyObject);\n\
    }\\else if (X is MyClass)\n{\n  sortB(MyObject);\n}\n```\n\nyou can simply write:\n\
    MyObject.sort();\n\nand expect the object-oriented mechanism to pick the correct\
    \ method. To be more precise, if MyObject is MyClassA it calls the sort defined\
    \ in that class and if MyObject is MyClassB it calls the sort defined in that\
    \ class. Notice that, as C# is statically typed, this isn't quite as impressive\
    \ as it looks the decision is made at compile time. That is, the equivalent code\
    \ is more like:\n\n```\nMyClassB MyObject:\nsortB(MyObject);\n```\n\nNo ifs were\
    \ eliminated in this procedure as the correct function to call was perfectly clear\
    \ and unchanging.\nPolymorphism is really only impressive if late binding is involved.\
    \ For example, if we now assume that MyClassB is derived from MyClassA we can\
    \ write:\n\n```\nMyClassA myObject;\nmyObject.method();\n```\n\nIf early binding\
    \ is used then this is compiled into a call to methodName defined in MyClassA,\
