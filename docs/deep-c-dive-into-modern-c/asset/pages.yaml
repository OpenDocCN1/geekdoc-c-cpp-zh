- img_proc: true
  md: "Now consider the seemingly small change from a struct to a class:\npublic class\
    \ MyClass\n\n```\n{\n  public int x;\n}\n```\n\nThe change to the private variable\
    \ and the method are easy enough:\nprivate MyClass MyData = new MyClass();\npublic\
    \ MyClass MyData doSum()\n\n```\n{\n  return MyData;\n}\n```\n\nHowever, if the\
    \ client performs the same manipulation:\nMyClass a = doSum();\na.x = 10;\n\n\
    the result is very different. Now the object passed as the result is treated as\
    \ a reference type and subject to reference semantics. This means that doSum passes\
    \ a reference back to the, supposedly protected, Mydata object. Now when we store\
    \ 10 in the x field, it is the field in the Mydata object which is changed.\n\n\
    Clearly changing from a value type to a reference type and vice versa is a potentially\
    \ deep structural change to a program because it changes value semantics into\
    \ reference semantics.\n\n# # Alternative to Structs | Tuple\n\nStructs are often\
    \ used to simply group items of data together sometimes this grouping has little\
    \ logical sense. For example, if you have a method which returns the maximum and\
    \ minimum then you might well write something like:\n\n```\npublic struct MaxMin\n\
    {\n  public double Max;\n  public double Min;\n}\n```\n\n```\nMaxMin FindMaxMin(double[]\
    \ list){\n  MaxMin result = new MaxMin();\n  result.Min = 0.0;\n  result.Max =\
    \ 100.0;\n  return result;\n}\n```"
