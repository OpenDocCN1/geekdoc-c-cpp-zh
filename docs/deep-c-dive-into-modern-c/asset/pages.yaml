  md: 'similar. The marshaling logic is restricted to what reasonable. In many cases
    this means that you don''t have to select a marshaling type because there is only
    one choice. For example, you cannot marshal a standard 32-bit int to anything
    other than I4. Of course, there is nothing stopping you from casting or converting
