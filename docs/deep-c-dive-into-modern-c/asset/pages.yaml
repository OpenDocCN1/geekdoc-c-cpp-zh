- img_proc: true
  md: 'This is where the BitConverter class becomes important. It is intended to help
    you serialize an object to bytes and back again but this doesn''t stop us using
    it for other purposes. The BitConverter has a GetBytes method that will convert
    any of the standard data type into a byte array and a specific ToType method that
    converts the same byte array back into the appropriate data type. So, example:


    ```

    double a=1.234;

    byte[] data;

    data=BitConverter.GetBytes(a);

    ```


    returns an 8-byte array containing the bits that were stored in the 8-byte double.
    double b = BitConverter.ToDouble(data);


    There are also two alternative forms of the ToType method that let you specify
    the location in the array of the data which is very useful when processing byte
    streams. The BitConverter class allows you to generate and reconstruct data from
    byte streams, but it also gives you the opportunity to perform logical operations
    on a range of data types as a byte array and then restore the result.


    It is important to realize that BitConverter is "little endian" which is something
    that not-Intel programmers don''t take for granted. For example, what value is
    stored in IntVal after this:


    ```

    byte[] IntVal={0x00,0x01};

    Int16 x = BitConverter.ToInt16(IntVal, 0);

    ```


    If you think the answer is 1 you are working in big endian format, i.e. the high-order
    byte comes first, but the answer on Intel-based machines is 256 because they are
    little endian and take the first byte as the low-order byte. Usually this isn''t
    a problem once you know about, but it can result in some messy byte switching
    if you are trying to work with little endian data.


    # String Problems


    There is one other problem using BitConverter and strings.

    What do you think is stored in s in this case?


    ```

    byte[] data={(byte)''A'', (''byte)''B'', (''byte)''C''};

    String s = BitConverter.ToString(data);

    ```


    You might think that it would be "ABC" but the answer is "41-53-4A", i.e. a string
    representation of the hexadecimal values stored in the byte array.'
