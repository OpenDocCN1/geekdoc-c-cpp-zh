  md: 'Namespaces are also fairly simple and deserve a simple example. All XNames
    are created by default with an empty namespace. There are lots of ways of adding
    a namespace specifier, but the most useful is via the XNamespace class. For example,
    to add a namespace to a name you could use:

    XNamespace ns = "http://www.i-programmer.info";

    XName fullname = ns + "Root";


    Notice that an XName has LocalName, NameSpace, and NameSpaceName properties to
    allow you to work more creatively with XML names. Also, remember that all strings
    that you use in XElement, XAttribute etc names are automatically converted to
    XName objects. If you use a namespace then you have to explicitly include it when
    creating each element of the tree and you have to use it when searching for elements
    with specific names.


    # Postlude


    XML is still a good choice for encoding data and C# makes it very easy to use.
    If you are tempted by formats such as JSON, just remember how much more sophisticated
    XML is.'
