    # Arrays of Value Types


    The earlier example of a sorting method brings us to an interesting problem in
    casting isn''t much discussed. This isn''t a theoretical point but a practical
    decision made to make the language more efficient. When it happens it can leave
    you puzzled for some time.


    You might think that previous example of sorting objects would work with:


    ```

    int[] testdata = new int[] { 1, 2, 3 };

