  md: 'MyClass recompiles the code they will be greeted with a warning that lets them
    know about the change. They can then either add new or override appropriate.


    To Summarize


    +   - For binding there is no need to add anything to the base class declaration
    of the method and the overriding method should be declared new. Early binding
    occurs even if the base class method is declared virtual.


    +   - For late binding the base class method should be declared virtual and the
    overriding method has to be declared override.


    # Late or Early


    The C# handling of overriding might seem over-complex. Many other languages simply
    make late binding the default. This is simple, but doesn''t give you any flexibility.


    So which should you use, early or late binding? The first thing to say is that
    if you don''t use downcasts, you might think that you are safe from considerations
    of when binding happens. This is true, just because you don''t use downcasts now
    doesn''t mean that you or someone else won''t write code that uses your classes
    in this way.


    There is also an issue of efficiency. Early binding means that the compiler can
    generate code that has the reference to the method fully determined. Late involves
    determining which method to call at run time and takes more time. Efficiency is
    the reason that early binding was used in C++ and probably it is the default in
    C#, but this should be of no consideration in a modern system unless you are calling
    a huge number of times.


    From a purist standpoint, early binding is to be preferred as it is the only option
    that fits well with the mantra that anywhere you can use a base class you can
    use a derived class. The problem here is that this is less useful in the real
    world. For instance, it doesn''t allow polymorphism to be implemented. The method
    depends on the type of the variable and not the type of the referenced object
    and so the same method is always called. When you add to the fact that any of
    overriding tends to weaken the same mantra of "derived classes can be used anywhere
    a base class" then you have to admit that things are not clear-cut. Some methods
    are better early and some late bound. The key is that the subset of inherited
    methods in the derived class has to work properly in the environment of the base
    class and this might need early binding or it might need late binding.'
