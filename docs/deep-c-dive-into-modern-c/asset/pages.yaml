  md: "# Dynamic Typing\n\nThe other end of the spectrum from static typing is dynamic\
    \ typing. In true dynamic typing a variable really can change its type at run\
    \ time. This doesn't have to be the abandonment of type checking, just a move\
    \ to type checking at run rather than compile time. C# hasn't quite adopted the\
    \ \"duck typing\" approach that makes languages such as JavaScript, Ruby and Python\
    \ so easy to use, it is still attempting to play within the strong typing rules\
    \ it started out with.\n\nThe best way of thinking about dynamic type is as a\
    \ sort of formal way to use a general object type which allows you to access the\
    \ methods and properties of the actual data type in use without the need to cast.\
    \ For example, suppose we have a class:\n\n```\npublic MyClass {\n    public int\
    \ MyProperty;\n    public int MyMethod() {\n        return I;\n    }\n```\n\n\
    If we now create an instance using an object reference type:\nobject AnyObject\
    \ = new MyClass();\n\nthen trying to access any of the methods or properties of\
    \ the object will fail for obvious reasons - an object type doesn't have the methods\
    \ and properties of a MyClass type. However, if you use a cast to MyClass then\
    \ you can access all the properties and methods as AnyObject was of type MyClass.\
    \ That is: ((MyObject).MyMethod());\nworks perfectly.\n\nIn this sense using object\
    \ and casting has long been the C# programmer's way of implementing dynamic typing.\
    \ In this sense dynamic typing is nothing new to the language. However, you must\
    \ have the thought, \"why do I need to cast the object to the correct type - either\
    \ the method works or doesn't work at run-time\". Apart from making it easier\
    \ to discover the programmer's intention, the cost does absolutely nothing to\
    \ protect you from an error at compile time - any problems only apparent at run\
    \ time.\n\nWith the dynamic type introduced in C# 4.0, which only resolves to\
    \ a method or property at run time, you can indeed \"drop the cast\". The above\
    \ code in C# can be written:\n\n```\ndynamic AnyObject = new MyClass();\nAnyObject.MyMethod();\n\
    ```"
