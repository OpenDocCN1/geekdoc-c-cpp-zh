    Console.WriteLine(( myObject as IInterfaceA).myMethod());\n```\n\nThe first WriteLine\
    \ calls the default method and the second calls the interface version of the method.\n\
    \nAt the moment in C# you can't easily use a default interface method as a default\
    \ for a class of the same name. This was part of the original intent and the proposal\
    \ was to extend the meaning of base to include an inherited interface, so that\
    \ the default method could be called from an inheriting class, but this causes\
    \ problems similar to the diamond problem. You can call a default method within\
