    # Covariant and Contravariant Generics


    What else is a generic declaration or that transformation from a type T to another
    type G(T)? For example Array<T> converts an Int into Array<Int>.


    Next come to the question of whether an array, considered as a transformation
    on the type of its element, is covariant, contravariant or invariant. After all,
    it has to be one of three. Put in its most practical terms, given that int is
    a derived class of object, int[] could be a derived class of object[], which would
    make it covariant. Alternatively, the array could be a superclass of object[],
    which would make it contravariant, or it could have no relationship with object[],
    which would make it invariant.


    As already said, you have to answer this question, even if you don''t use the
    academic-sounding terms from category theory and physics. In Java and most other
    languages, including C#, arrays are covariant. This works when array use fits
    in with the data that outputs are covariant. For example, consider this code,
    which is perfectly acceptable as arrays are treated as covariant:


    ```

    object[] a;

    string[] b = { "A", "B", "C" };

    a = b;

    ```


    This assignment is safe as long as you use the variable a to access the array
    and not anything new in it. In this, a[i] is treated as object and you can use
    any of the methods that object has, and the underlying int certainly has these.
    However, if you assign object to a then things are potentially more risky. You
    can assign any object you like as all objects are derived from object. This leaves
    out int array in something of a potential mess.'
