- img_proc: true
  md: "That is, anonymous typing is still early binding in action and everything that\
    \ happens is fixed at compile time.\n\nLet's start off with the simplest anonymous\
    \ type. For example, given the function:\n\n```\npublic int MyFunc() {\n    return\
    \ 1;\n}\n```\n\nthe statement:\n\n```\nvar x = MyFunc();\n```\n\nallows the compiler\
    \ to deduce that the variable must be an int. So after this you can use:\n\n```\n\
    x = 2;\n```\n\nHowever, the statements:\n\n```\nstring i;\nni = x;\n```\n\nwill\
    \ still result in a compile-type error as x is an int and i is a string. Anonymous\
    \ types are still strongly typed at run time and their type is deduced at compile\
    \ time, i.e. they are static types that the compiler infers from the code.\n\n\
    A slightly more complicated situation is where the type is created \"on the fly\"\
    :\n\n```\nvar x = new {\n    name = \"Mike\",\n    Address = \"AnyTown\"\n}\n\
    ```\n\nIn this case the new type doesn't have a name and so the compiler creates\
    \ one something along the lines of \"AnonymousType#1\".\n\nNow you can use statements\
    \ like:\n\n```\nstring i;\ni = x.name;\n```\n\nas, not only the type of the structure\
    \ been determined, so has the type of each of its fields.\n\nA subtle point that\
    \ is important not to miss is that an anonymous type created in this way is read-only\
    \ so you can't assign to any of its fields and any attempts to do so will be picked\
    \ up by the compiler. Notice that this is different from the behavior when the\
    \ inferred type already exists, unless otherwise restricted to read-only."
