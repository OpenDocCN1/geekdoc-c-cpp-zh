    \n# Avoiding Race Conditions\n\nWe often use the term \"thread safe\" without\
    \ really bothering to define what it actually means, as if using it enough would\
    \ make its meaning obvious. Basically a block of code, or an object, is thread\
    \ safe if it works correctly and as desired if multiple threads use of it at the\
    \ same time. Most of the code you won't encounter thread safe and most of the\
    \ objects in the .NET class library and, of course, your code in. The important\
    \ thing to realize is that in general code isn't thread safe unless you take steps\
    \ to make it so.\n\nWhat exactly is the problem? There is the obvious confusion\
    \ caused by threads sharing the same data. For example, if a method has another\
    \ thread starting the same method might well zero that counter and leave it in\
    \ a state that is not as the first thread left it. For example, consider the following:\n\
    \n```\npublic int count = 0;\npublic void A()\n{\n    for (int i = 0; i < 10000000;\
