- img_proc: true
  md: "# Inherited Constructors\n\nA special case of using the methods of the base\
    \ class is the inherited constructor. A constructor is a function that creates\
    \ the class and optionally initializes it. Beginners are often worried by the\
    \ idea that the constructor has to “create” the class and they think there is\
    \ something they have to do to make it happen. In practice you don't have to do\
    \ anything to create an instance of the class. The system does it all for you\
    \ and the constructor returns a reference to a new object with all of the properties\
    \ class defines initialized to their default values. However, if you want properties\
    \ to be initialized to something then you might have to write some code in the\
    \ constructor.\n\nIf you want to provide different types of initialization then\
    \ you can define a number of alternative constructors, each with its own unique\
    \ signature. Which constructor is used is determined by the signature of the class.\
    \ All classes have one constructor with no parameters, either explicitly defined\
    \ or automatically generated, which is used as the default constructor in situations\
    \ you don't explicitly specify a constructor.\n\nIf a class inherits from another\
    \ class then the base class constructor is automatically called before the class's\
    \ own default constructor. If the base class also inherits from another class\
    \ its constructor is called first and so on until we reach the first class in\
    \ the inheritance chain.\n\nIf a class defines an explicit constructor and inherits\
    \ from another class, the explicit constructor must call one of the base class's\
    \ constructors. If the base class only has constructors that use parameters, the\
    \ child class has to call one of them using the base keyword.\n\nFor example,\
    \ suppose MyClassA has a constructor of the form:\nMyClassA(int n)\nthen call\
    \ it you would write:\n\n```\nclass MyClassB:MyClassA\n{\n    public MyClassB:base(7)\n\
    \    {\n        rest of constructor\n    }\n}\n```\n\nIn this case the MyClassB\
    \ constructor calls the MyClassA(int n) constructor as MyClassA(7) before continuing\
    \ with its own instructions."
