  md: "# Protected versus Private\n\nThe problem is when when you should protect and\
    \ when private? The answer is often based on the question – do you want a programmer\
    \ working on a class derived from your class to have access to its inner workings?\
    \ This is a difficult question. Why would you refuse the use of a method, say\
    \ to the \"end user\" of a class but not to a programmer who is creating a new\
    \ class from your class? You might feel that a programmer who is capable of creating\
    \ a new class is more technically capable of treating your method correctly, but\
    \ this assumption may be unfounded. In most cases the reason you make a resource\
    \ protected is because you, the implementer of the class, wants to derive classes\
    \ from it. After all, if you don't trust yourself to use resources, who can trust?\
    \ However, if you do this, notice that you also allow other programmers to do\
    \ the same. It is also practically unreasonable to extend this privilege to the\
    \ grounds that you can be trusted. In a few months' time, the code in question\
    \ may look like alien to you as it does to another programmer.\n\nThe decision\
    \ about which code should be protected and which private should really relate\
    \ to the code and not the coder. Public methods should define the external world's\
    \ view of the class - they should define the way the class is used. In the same,\
    \ private and protected methods should define the inner workings of the class.\
    \ They are the resources that the class uses to get the job done. To decide which\
    \ should be private and which protected the important question is which of the\
    \ methods are general tools that a derived class might also need to use as part\
    \ of its extended implementation. In most cases any resource that a base class\
    \ uses is probably needed by a class that extends it and so protected is most\
    \ appropriate – even if private is the default.\n\nA simple example should make\
    \ the situation clearer especially with reference to inheritance. Consider the\
    \ class:\n\n```\npublic class MyClassA{\n    public void myMethod(){\n       \
    \ Console.WriteLine(\"Method1\");\n    }\n}\n```"
