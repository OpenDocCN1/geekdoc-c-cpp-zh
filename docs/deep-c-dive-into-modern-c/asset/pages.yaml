  md: 'It looks as if there are two definitions of the type parameter T but there
    is only

    one. When you use <T> sometimes it is a definition of the parameter and

    sometimes it is a use of the parameter. When you write:

    MyClassA<int>{


    the type parameter T has the value int and the effective class declaration is:

    class MyClassA<int>: IMyInterfaceA<int>

    {}


    You don''t have to use T and:

    class MyClassA<T1>: IMyInterfaceA<T1>


    works just as well.

    If you want the inherited interface or class to have a different type then you

    use:

    class MyClassA<T1,T2>: IMyInterfaceA<T2>

    and now creating an instance is something like:

    MyClassA<int,double> myA = new MyClassA<int,double>();


    ![](img/db5ebed54e0277237ef80cdc7d78ec05_123_0.png)


    You can specify a type in the class definition:

    class MyClassA<T>: IMyInterfaceA<double>

    and in this case IMyInterface is set to double no matter what T is.


    # Run Time Type


    Some languages, for example, implement generics by using “type

    erasure”. This essentially converts anything passed as a generic type to the

    most general type – object in the case of C#. The idea is that generics

    compiled to the implementation you would create by casting everything to

    object and then forgetting what the original type was.


    C# doesn''t do this, i.e. it doesn''t use type erasure. What this means is that

    anything passed as a generic type retains its type and you can use this at

    run time. What happens is when you use a generic type <T> in a

    definition, the compiler treats it as an unknown type and restricts method

    calls to the properties of object, but at run time the type is exactly as it would

    been if generics had not been used. For example, in C# you can write:

    tof(T).Name


    and see the name of the type the type parameter has been set to. This doesn''t

    work in languages that use type erasure.'
  merge: -1
