- img_proc: true
  md: "For example, we can construct two delegates that do the same tasks as threads\n\
    T1 and T2 defined earlier:\n\n```\ndelegate void AsyncTask();\nasyncTask T1 =\
    \ delegate()\n{\n    for (int i = 0; i < 999; i++)\n    addText2(i.ToString());\n\
    }\n```\n\n```\nasyncTask T2 = delegate()\n{\n    for (int i = 999; i > 0; i--)\n\
    \    addText2(i.ToString());\n}\n```\n\nWhere addText2 is defined before and uses\
    \ Invoke to run something on the UI thread.\n\nWe can use the delegate Invoke\
    \ method to run them synchronously, that is on the same thread that they created,\
    \ the UI thread.\n\n+   T1.Invoke();\nT2.Invoke();\n\nIn this case T1 completes\
    \ before T2 begins. To run them on separate threads, i.e. asynchronously, we change\
    \ Invoke to BeginInvoke:\n\n+   IAsyncResult R1 = T1.BeginInvoke(null, null);\n\
    IAsyncResult R2 = T2.BeginInvoke(null, null);\nT1.EndInvoke(R1);\nT2.EndInvoke(R2);\n\
    \nThe EndInvoke methods simply wait for the delegates to finish.\n\nIf you try\
    \ this out you will discover it doesn't work. All that happens is that the entire\
    \ program hangs at the first EndInvoke – see if you can work out why before reading\
    \ on.\n\nThe reason is that when a thread calls addText2 this switches execution\
    \ to the UI thread, but the UI is blocked waiting for the tasks to end and doesn't\
    \ process the delegate!\n\nThis is a good example of deadlock – two threads, the\
    \ UI and either of T1 or T2, waiting for each other to do something blocked by\
    \ the other. The solution is simple – don’t block the UI thread. Unfortunately,\
    \ the simplest way of not blocking the UI thread is to use a callback method to\
    \ clean up when the thread has finished and this is not always simple."
  merge: -1
