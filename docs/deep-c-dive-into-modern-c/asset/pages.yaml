  md: "particularly the use of a pointer to a pointer and probably not worth trying\
    \ to translate, but in fact the .NET Framework can handle it with ease. The translation\
    \ is:\n\n```\nvoid NewWorkItem(\n    [In, MarshalAs(UnmanagedType.LPWStr)] String\
    \ pws2TaskName,\n    [ref] Guid rscid,\n    [ref] Guid riid,\n    [Out, MarshalAs(UnmanagedType.IUnknown)]\
    \ out object ppk);\n```\n\nThe string is marshaled in earlier functions and the\
    \ Framework knows how to deal with converting the Guid to the string of bytes\
    \ which the function needs. What is more surprising is that the Framework also\
    \ implements the marshaling of the returned interface into an object wrapper.\
    \ To use this we simply need the Clsid of the Task object:\n\n```\nGuid CTask\
    \ = new Guid(0x148BD520, 0xA2AB, 0x11CE, 0xB1, 0x1F, 0xAA, 0x00, 0x05, 0x03);\n\
    ```\n\nand the IID of the ITask interface:\n\n```\nGuid ITask = new Guid(0x148BD524,\
    \ 0xA2AB, 0x11CE, 0xB1, 0x1F, 0xAA, 0x00, 0x05, 0x03);\n```\n\nNext we use this\
    \ to create a new Task object and its associated interface:\nobject itask;\nITaskScd.NewWorkItem(\"\
    Test\", ref CTask, ref ITask, out itask);\n\nTo make use of the ITask interface\
    \ we have to cast it to a .NET ITask interface type and this means we have to\
    \ define another interface. This isn't difficult, but in this case we can also\
    \ cast it to one of the standard interfaces that many COM objects support.\n\n\
    It's worth noting that CTask is a COM class in its own right and can be created\
    \ complete with its Unknown interface using any of the three methods described,\
    \ for example:\n\n```\n[ComImport, Guid(\"148BD520-A2AB-11CE-B11F-00AA00530503\"\
    ))\nclass CTask();\n```\n\nAfter this you can create CTask objects using new and\
    \ cast them to ITask interfaces.\n\n# Standard COM Interfaces\n\nAs COM developed\
    \ there was a need to define standard interfaces that do common tasks in a uniform\
    \ way. For example, many COM objects need to save their state and rather expect\
    \ the user to create a custom routine the IPersist interface and its derived interfaces\
    \ were introduced so that the user could simply save the COM object"
