  md: "If you examine the code and remember that this is a static language, you can\
    \ see that myMethodInt is always called - there is no possibility of anything\
    \ else happening because X is always an int once it has been declared to be an\
    \ int.\n\nIn this sense the whole if statement and testing is completely unnecessary\
    \ and you might as write:\n\n```\nint X = 1;\nMyObject.myMethodInt(X);\n```\n\n\
    In a statically typed language there is no variable that can change the type it\
    \ is assigned when it is declared. Thus static typing makes early binding possible\
    \ for function overloading. However, even static typing is a little subtle than\
    \ this. The extra complexity comes, once again, from the idea that any type that\
    \ derives from another type should be usable in place of the parent type. That\
    \ is, if I declare a class as:\n\n```\npublic class ClassB:ClassA {\n  '\n}\n\
    ```\n\nthen, as already discussed, ClassB can be used in place of ClassA and generally\
    \ treated as if it was of type ClassA. For example, a method like:\npublic string\
    \ myMethod(ClassA obj) {\n  return \"ClassA\";\n}\n\ncan be called with a parameter\
    \ of type ClassA or ClassB. From, the point of view of method signatures, derived\
    \ classes act like their parent classes. So what if we overload myMethod with\
    \ a specific version for ClassB?\n\n```\npublic string myMethod(ClassB o) {\n\
    \  return \"ClassB\";\n}\n```\n\nNow if I call myMethod with a parameter of type\
    \ ClassB, which method will be called? The answer is, surprisingly the one with\
    \ the signature that matches the parameter most closely. In this case the version\
    \ of myMethod with the ClassB parameter is called.\n\nThis is a general principle:\n\
    \nthe method with the signature that most closely matches the types used is the\
    \ one used.\n\nAlthough this use of derived types in method calls is a little\
    \ more complicated, notice that it uses the declared type of each variable and\
    \ not what the variable actually references. Again, static typing simplifies the\
    \ task. Consider what a late binding version of the \"closest match\" algorithm\
    \ would require."
