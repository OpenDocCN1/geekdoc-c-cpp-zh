    # String Marshalling


    Strings are a particular problem because there are so many encodings and representations.
    Most system functions either UnmanagedType.LPStr or UnmanagedType.LPWStr, both
    of which are passed as pointers to a null terminated "C-style" string, the former
    using ANSI and the latter using Unicode characters. For functions implemented
    in "higher-level" situations such as COM, a UnmanagedType.Bstr type is appropriate
    which has its length the first character. For example, the MessageBox system function
    either uses by or two-byte characters and so LPStr or LPWStr is appropriate depending
    on whether or are not using Unicode, which can be determined by the CharSet option:


    ```

    [DllImport("User32.dll", CharSet=CharSet.Unicode)

    public static extern IntPtr MessageBox(

    int hwnd,

    [MarshalAs(UnmanagedType.LPStr)] String text,

    [MarshalAs(UnmanagedType.LPWStr)] String caption,

    uint type);

    ```


    and you can call it something like:

    MessageBox(0, "Hello Invoke World", "PInvoke", 0);


    Notice that the marshaling is more active than you might expect. The managed string
    is copied to an area of memory, a null is added to the end and a pointer is passed
    to the unmanaged function.


    Strings are immutable so any changes made by the unmanaged function have no effect
    on the managed string.


    StringBuilder is mutable and changes are allowed, but you can only use LPTStr,
    and LPWStr. What this means is that it can be used to accept character data from
    unmanaged functions as a parameter. For example, the GetWindowsText function uses
    a C-style string to return the Window text:


    ```

    int GetWindowText(HWND hwnd, LPTStr lpString, int nMaxCount);

    ```


    The lpString buffer has be a fixed size as given by nMaxCount.'
