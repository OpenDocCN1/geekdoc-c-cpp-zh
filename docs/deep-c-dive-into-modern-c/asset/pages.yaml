- img_proc: true
  md: "# Using Attributes\n\nIt is very difficult to find a convincing practical example\
    \ that uses attributes that is general enough to convey the principles and ideas.\
    \ If you look at the way attributes are used in C# and in the Framework you will\
    \ soon discover that they have a limited application without extending the way\
    \ that they behave to affect the compiler. Of course, using custom attributes\
    \ you can't do this.\n\nSome built-in attributes give you a good idea of what\
    \ they are good at without extra tricks. For example, the whole PInvoke and COM\
    \ Interop marshaling of parameters is a perfect example. You apply marshaling\
    \ tags to the parameters of external methods you want to call and when you use\
    \ managed data into the Framework/CLR uses these attributes to decide how to transform\
    \ and vice versa.\n\nWhat makes this good use of attributes is that the marshaling\
    \ has to be at the class level and once applied isn't going to be changed at the\
    \ instance level. Moreover, the code that processes the instances can keep all\
    \ of the mechanisms that load and respond to the attributes hidden from view.\
    \ As far as the user of the attributes is concerned it's a matter of applying\
    \ the attribute, then ignoring it in all the code they write, but when you use\
    \ some machinery the attribute makes work correctly.\n\nConsider for a moment\
    \ the problem of assigning a format to the fields of a struct using a new attribute,\
    \ Formattable. Such a facility reveals quite a lot about the difficulties inherent\
    \ in doing a ” job using attributes. The idea is simple, the implementation quickly\
    \ becomes complicated. First we need a new attribute:\n\n```\n[AttributeUsage(AttributeTargets.Field,\
    \ AllowMultiple = false, Inherited = false)]\npublic class Formattable : Attribute\n\
    {\n    public string format;\n    public Formattable(string _format)\n{\n    \
    \    format = _format;\n    }\n}\n```\n\nThere is nothing new here, but it is\
    \ worth saying that it would be better to implement the format string as a get/set\
    \ property."
  merge: -1
  pgno: 318
- img_proc: true
  md: "This attribute can now be applied to any field in any struct or class. Notice\
    \ that you can restrict its application to, say, a field in a struct rather than\
    \ a class.\n\nNow that we have an attribute we can apply it:\n\nHere we have a\
    \ simple struct with two int fields one of which, will hold a currency value and\
    \ hence is tagged with the Formatable attribute set to Money.\n\nImmediately we\
    \ have a problem in that the user can enter any string they care into the new\
    \ attribute, not just the few we want to allow. One way of restricting the input\
    \ is to define an enum, for example: public enum FormatType(Money, Percentage);\n\
    \nWith this enum the attribute definition changes to:\n\n```\n[AttributeUsage(AttributeTargets.Field,\
    \ AllowMultiple = false, Inherited = false)]\npublic class Formatable : Attribute\n\
    {\n    public FormatType format;\n    public Formatable(FormatType _format)\n\
