  md: '# # Chapter 16


    # ## The Invoke Pattern


    All of the well-known UI frameworks are single-threaded. The reason is that, when
    multi-threaded UIs have been attempted before, things didn''t work out too well.
    A single-threaded UI means that only one control in the UI can be updated at any
    given time and update is fully completed before another control can begin its
    update. Such single-threaded UIs are event-driven to make it look as if different
    parts of the UI were being updated at the same time. An event occurs and the appropriate
    event handler is called. This performs an update and runs to completion and then
    another event is handled. All happens so fast that it looks as if changes are
    occurring to multiple elements and at the same time.


    For Windows Forms and WPF things are a little more complicated as there isn''t
    a single UI thread in the traditional sense. Instead, each control that is created
    can only be accessed by the thread that created it. In practice, this usually
    means the main thread, which is generally used to create all of the controls,
    is the only thread that can work with the UI and so it becomes the facto UI thread.
    Of course, you can think more complex strategies created by different threads,
    but even this restricts each component to its own UI thread.


    When you first start to build apps there is a tendency to simply accept what the
    IDE creates as a project template and start coding. The problem is that in many
    cases the template is for a single-threaded UI and any code you create is run
    on the UI thread. This isn''t a good idea, but it generally works – at first.
    Later, when the program grows and starts to do significant amounts of work on
    the UI thread, the user notices that the UI is slowing down, becoming choppy and
    generally not providing a good experience. The reason is that the UI thread is
    being used to do which has nothing to do with maintaining the UI. Instead of sitting
    idle, waiting for the next event, the thread is actively engaged in accessing
    data, preparing graphics or calculating the 10000th digit of pi.'
  merge: -1
