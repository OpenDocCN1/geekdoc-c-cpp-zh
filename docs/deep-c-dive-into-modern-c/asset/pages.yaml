  md: 'You can mix dynamic and anonymous as in:


    ```

    dynamic MyObject = new MyClass();

    var i = MyObject.Method();

    ```


    and the compiler correctly works out that i should be an int, suggesting that
    it isn''t completely blind to the type stored in MyObject. Notice that as dynamic
    is a valid type name it is perfectly possible that an anonymous type will resolve
    to dynamic.


    You can swap from dynamic to fully static by simply making appropriate assignments.
    For example:


    ```

    dynamic j = 1;

    int i = j;

    ```


    first creates a dynamic variable, an int, which is then converted to a strongly-typed
    int. You can also force a conversion using a cast but, as always, if it can''t
    be the result is a run-time exception.


    Notice that dynamic really is dynamic in the sense that the determination of its
    type at run time is not a one-off. A dynamic type can change its type as many
    times as necessary, for example:


    ```

    dynamic i;

    i = 1;

    i = i + 1;

    i = "mike";

    i = i + 1;

    ```


    When 1 is assigned to i it becomes an int, and i+1 is an integer expression which
    evaluates to 2. Assigning the string "mike" to i changes its run-time type to
    string and new i+1 concatenates the string "1", which is implicitly cast from
    an int to give "mike".


    Notice that there is nothing new going on here as everything works just as if
    the variable i was first declared as an int and then declared as a string. Of
    course, you can''t change the type of a static type at compile time and this is
    what is new.


    The guiding principle that has been used in implementing the dynamic type is that
    what happens should correspond to what happens if the dynamic type was known at
    compile rather than run time. To work out how a dynamic type behaves imagine that
    you know its at compile time and what happens in this case should be what happens
    to the dynamic type.'
