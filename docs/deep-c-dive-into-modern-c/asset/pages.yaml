  md: 'is a query that returns all of the attributes set on the root object. Once
    you have constructed the query, you can step through it in the usual way using
    a foreach loop.


    The axis methods allow the user to specify some simple filtering conditions that
    often mean you don''t need to use a full LINQ query at all. Some axis methods
    are so specific that they return a single element. For example, FirstNode and
    LastNode return the first and last node respectively. Similarly Element("name")
    returns the first matching element which should be contrasted with Elements("name")
    which returns all child elements that match.


    As well as working with sequences of elements that go "down" the tree can work
    up to the top most level using the Ancestors method. For example:


    ```

    var q = root.LastNode.Ancestors();

    ```


    returns a collection of all of the elements in the tree by, reversely, starting
    at the last node and extracting all of its ancestors.


    # Subtrees


    What about querying subtrees? This is very easy and almost doesn''t need any thought.
    All you have to do is find the node that is the root of the subtree and use its
    Descendants method. For example:


    ```

    var q=root.Element("name").Descendants();

    ```


    returns all of the child nodes below the XElement in the tree, i.e. First and
    Second in our earlier example. Notice that Descendants is "recursive" in the sense
    that it returns all of the child nodes of the first node specified, then the child
    nodes of each of those and so on. In the order which the child nodes are returned
    is described as "document order", i.e. the order in which the tags appear when
    the XML is listed down a page.


    If you use a LINQ query to return an element you automatically gets its "deep"
    value - all of the child nodes it contains. Because of this, the query:


    ```

    var q2 = from E in root.Elements()

    where E.Name == "Name"

    select E;

    ```


    returns a subtree starting at the XElement "Name". It is slightly different from
    the previous example because it includes the "Name" node and not just the subtree
    below it.'
