  md: '# Chapter 12


    # Delegates


    Delegates are C#''s original way of allowing you to work with functions as if
    they were first-class objects. The aim may be simple, but the need to define a
    type and then an instance of the type can be confusing. Let''s see if we can make
    it all seem logical.


    Delegates are at the core of a number of different .NET facilities, events in
    particular. It''s long been a truism that the way to get done is to delegate,
    but what are C# delegates all about? First we have to understand the nature of
    the problem delegates designed to solve.


    # First-Class Functions


    In many languages functions are treated in the same ways as objects. In JavaScript,
    for example, functions are objects. This is often expressed by saying the functions
    are first-class objects or they are first-class functions.


    Why should this matter? The simple answer is that times you want to pass a function
    as an argument to a method call. There are other things you might want to do with
    a first-class function, including having a reference to it or having an argument
    of such functions, but if we concentrate on the most common usage, passing functions
    to methods, then we have the key idea. For example, suppose you have a sorting
    routine, you might want to pass in a function that determines what A>B means,
    return true if A is greater than B and false otherwise, where A and B are objects
    of some type.


    This seems like a reasonable thing to do, but in C# and other object-oriented
    languages there are no "disembodied" functions. All functions are methods that
    belong to some class or instance of a class. This make things a little more complicated
    because you cannot simply create a function called myorder and pass it into a
    method because myorder has to be a method of some class or object.'
