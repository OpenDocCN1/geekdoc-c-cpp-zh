    HL7 also develops and maintains the standard for structure and encoding of the
    Clinical Architecture (CDA). CDA Version 2 was released in 2005 and forms the
    basis for creating documents such as the Clinical Care Report (CCR) to be discussed.
    As its name implies, a CDA document is intended for electronic interchange of
    clinical documents which may be part of a patient EHR. The CDA standard is XML
    based, follows Version 3 of HL7 RIM and HL7 V3 data types. Because of their standardization
    and XML basis, CDA documents can be sent via email, a variety of common used attachments,
    and other transport methods such as ftp. Although the standard, and a minimal
    set of XML metadata is required, there are increasingly semantically sophisticated
    levels of CDA implementation all institutions to participate in their use while
    transition to standardized EHRs. For example, a CDA document can contain information
    in no XML formats as pdf and Word documents. This flexibility complicates the
    data extraction process for the CHCD team but is viewed as necessary to keep the
    project moving forward.


    A CDA document can contain a variety of information about a patient. The information
    most likely to be relevant for the CHCD includes information about a patient’s
    condition upon admission and discharge, results of physical examination and diagnostic
    tests, and details of treatments and response to treatment. In February 2011 HL7
    announced the March release of a “greenCDA” Implementation Guide, a simplified
    XML for CDA templates. According to the press release, this release was part of
    the ongoing effort to encourage and support the use of EHRs as required by U.S.
    Federal Healthcare reform legislation (“Meaningful Use of Electronic Health Records”).
    Pilot sites are encouraged to use the new greenCDA; as they are created they will
    become part of the data entries accessed by the CHCD team. Additional information
    on this project and other rapidly evolving standardization projects can be found
    in links in the Appendix.


    One of the most implementations of the CDA architecture is the Continuity of Care
    Document (CCD), which applies CDA standards to existing Clinical Care Records
