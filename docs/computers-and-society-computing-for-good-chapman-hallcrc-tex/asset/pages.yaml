  md: '# Chapter seven: Following your passion means forming your own business 237


    A major selling point of many mobile devices and the iPod touch in particular,
    is that they are able to present material to support different learning styles.
    What is a learning style? Simply put, it is the way or ways that someone is most
    comfortable learning. Everyone has the ability to learn using all of their senses,
    unless they are profoundly affected in some way, such as through deafness or blindness.
    Some people are visually oriented; others more auditory, or kinesthetic. Some
    people are more comfortable with abstraction, some with concreteness. Computing
    students are'
