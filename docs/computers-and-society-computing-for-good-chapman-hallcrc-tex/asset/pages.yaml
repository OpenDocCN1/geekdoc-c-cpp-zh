    # 1.14 Future and global effects of the Andean project


    Several projects in other countries were modeled after the Andean project. In
    Brazil, the CIC model of Community Centric Empowerment implemented in an enormous
    sprawling slum in Belo Horizonte. Logan Muller helped the project that was aimed
    at reducing the social, digital, and economic divide between the rich and the
    slum dwellers. Currently, Logan is working on a project in Thailand to build a
    digital repository so indigenous populations can archive traditions and languages
    threatened by assimilation and other global forces. He emphasizes that although
    the setting is different, the skills that only a computer scientist can bring
    to these projects, as discussed in the last section, are the same.


    Several years after the official termination of the project, reports sent via
    e-mail from local villagers and Roberto Vargas to the original Peruvian and New
    Zealand project managers, indicated the computer systems continue to be used extensively
    by the majority of the villagers and enthusiasm with ongoing support from the
    ISP and from OSIPTEL as project continues to be highly. Locally trained people
    continue to maintain the equipment with ongoing support from the ISP and from
    OSIPTEL as needed. Thus, it appears that one of the key goals of the project,
    to create a culturally integrated self-sustaining Internet-based poverty alleviation
    project has been accomplished (Figure 1.19).


    The best subjective assessment of the Andean project comes from Elsa Huaman Clemente,
    who says (in English):


    > The project was successful because the model really matches people''s tradition
