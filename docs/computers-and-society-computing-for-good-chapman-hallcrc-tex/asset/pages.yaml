  md: '# 2.11 Data storage redundancy and a design to respond to system failure


    It should be clear by now that the digital images are duplicated and stored in
    multiple locations almost from the moment they leave the equipment that created
    them. One of the issues that plague vendor systems, which hospital personnel spoke
    of with great frustration, is the cascading problems that occur if part of the
    system goes down. This is the human side of our prior discussion about how a downed
    server in a-VNA system could cost hundreds of thousands of dollars in direct and
    indirect costs. The frustration caused by a downed system ran up and down the
    hierarchy of administrators to patients.


    These issues were critical points in the early discussions of system specifications
    between CHOP and Acuo Technologies. As a result, only was the Redundant Data Center
    created to hold a duplicate set of image data, but it was designed with a system
    that would automatically kick in any part of the primary system go down. Within
    minutes of failure detection, the VNA system switches over from the Main Data
    Center to the Redundant Data Center and uses it for all input and retrieval requests.
    Any new data that comes while the Main Data Center is being brought back is not
    only stored, but specially queued that as soon as the Main Center comes up, data
    is routed over, restoring full redundancy. Ideally, the users (care providers,
    radiologists) are none wiser from their perspective noting changes. Computing
    personnel at CHOP and Acuo are automatically informed of the failure and system
    changeover in order for them to evaluate the situation and decide if any additional
    investigation and corrective action is warranted. See Figure 2.12 for additional
    detail.


