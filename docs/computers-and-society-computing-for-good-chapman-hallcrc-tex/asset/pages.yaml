    # 7.5 Mobile devices support how people learn effectively


    Mobile devices support the well established research on effective teaching and
    learning while providing one way to address a difficult fiscal environment in
    the schools. A seminal publication by the National Research Council called “How
    People Learn” points to the importance of several items: Transfer, Collaborative
    Learning, Problem Based Learning, and Situated Learning.


    Transfer refers to when a student successfully applies learning from one experience
    to another context and can rapidly learn new information. “Near transfer” occurs
    most often, when the experiences are in some way and mirror real life experience.
    For example, if a student uses an iPod touch to learn in the classroom, they are
    more likely to feel comfortable picking up another mobile device (pick any from
    the list above) and starting it in class or at home. This transfer occurs because
    the student has become comfortable with the look and feel of the hardware, the
    use of a touch screen, and the user interfaces are specifically designed for mobile
    devices.


    Situated Learning takes place when the tools and the activities match, i.e., there
    is a good fit. For example, if a student uses an iPod touch to access multimedia
    based educational software, such as the DevelopEase app “Global Roots” to learn
    language and geography, they are using a device that intentionally leverages multimedia,
    and software that makes the most of that capability. The result is that the student
    is much more comfortable overall with the learning experience and the desired
    outcomes are more likely to “stick.”


    Problem Based Learning is just what it sounds like. Asking students to solve problems
    in order to learn, rather than memorize or be able to work through an application
    via loopholes, results in deeper learning. Critics of educational software often
    point to poorly disguised games'
