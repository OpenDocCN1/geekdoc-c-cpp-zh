    # # When following your passion

    means forming your own business


    #  7.0 Introduction


    Sometimes a life-changing event causes someone to alter the direction

    of their career and start their own business. That is what this chapter is

    about. A computer scientist was inspired by events in her personal life to

    branch out on her own and create a company. She had an idea for applica-

    development on mobile devices; no one else created the soft-

    ware had in mind. She recognized a market niche for her apps and

