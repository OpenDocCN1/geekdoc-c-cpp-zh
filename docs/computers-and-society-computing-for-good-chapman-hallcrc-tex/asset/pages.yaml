    # 4.4 Tracking turtles by satellite to learn how they behave


    Inevitably, there will be disagreements about who should take responsibility for
    decisions such as whether and how to limit harvesting of turtles. Sea turtles
    “belong” to no one. They do not respect international boundaries and regularly
    cross thousands of miles of ocean instinctive migratory patterns. It is important
    to know as much as possible about where sea turtles go and what they do, so the
    STC can bolster its attempts to generate worldwide awareness, and hold governments
    and industry accountable for their actions when sea turtles are negatively impacted.


    It is fun (for some people at least) to contemplate swimming alongside a sea turtle
    and following it on its migration. Unfortunately, that is not practical. Therefore,
    the STC utilizes satellite tracking transmitter tags to the shells of turtles.
    The tags have been specially designed for use on sea turtles and are harmless
    (Figure 4.5). The transmitter has an embedded id code that transmits data to orbiting
    satellites maintained by the Argos Satellite System (see Appendix for links about
    transmitter tags and Argos Inc.). When three or four satellites receive data from
    one transmitter, the latitude and longitude of the turtle can be determined. In
