    # 5.1 Data is needed for pediatric practice recommendations


    Best practices in specialty subpopulations of seriously ill patients are not well
    understood for several reasons. First, although many of these conditions are increasingly
    common across the population of newborns, they are spread out across many institutions
    and thus often relatively rare in any one hospital and to any one neonatologist.
    Second, there are many organizations in the process of gathering and computerizing
    data for purposes of analysis, but the volume of data and variety of pre-existing
    terminology and code sets is often overwhelming. This leads organizations to choose
    a focus area or limit the type of data collected. Third, computer scientists and
    medical informatics personnel are just starting to combine forces to create useful
    repositories for data gathering and analysis. Advances in database technology
    and methods of storing and retrieving large data sets are available that not a
    few years ago.


    Within a physician''s office or hospital setting data is already gathered. For
    example, virtually all newborns in the United States and other developed countries
    undergo a battery of tests to determine their health and set a baseline for later
    development. There are commonly accepted procedures and tests each of which gathers
    a wealth of data. Still, there is a need to gather extensive holistic data on
    specific subpopulations and conditions such as babies with congenital anomalies
    and metabolic diseases.'
