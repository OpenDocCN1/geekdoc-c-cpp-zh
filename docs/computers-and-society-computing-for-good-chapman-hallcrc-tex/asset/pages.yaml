    # 7.4.1 iPod touch


    The iPod touch is the latest and most sophisticated of the iPod line which started
    out as a simple device to play music. There are still variations of the iPod including
    the iPod shuffle, the iPod nano, and the iPod classic. The first two iPods are
    still oriented towards users who want highly portable music players. The iPod
    shuffle is the most basic device, although it can play music, audiobooks and podcasts.
    The iPod adds the capability to store and display photographs, play the radio,
    and also includes a few capabilities that appeal to the slightly more demanding
    “exercise with music” enthusiast. Unlike the shuffle, the nano has a screen. Both
    the iPod nano and the shuffle are very small so the user can walk, run, and be
    bent aware what they carry. The iPod classic is somewhat larger because its primary
    selling point is that it contains vastly more storage than either the shuffle
    or the nano. However the classic is still very portable and designed to store
    and play music, video, and photographs.


    The iPod touch is the most sophisticated of the iPods and serves not only as a
    portable multimedia device, but as a bridge to the more expensive and sophisticated
    products in the Apple “i” line (iPad, iPad and iPhone). In addition to music,
    video, and photographic capability, the iPod touch is designed to run true software
    applications from games to productivity. Providing high quality screen resolution,
    while maintaining the portability advantages of the previous iPads, is a critical
    technical requirement. Although new models are likely to come out as you read
    this, at the time of writing, the current iPod touch was 4.4” x 2.3” x .28” (111.0
    mm x 58.9 mm x 7.2 mm) and weighed 3.56 ounces (101 grams). The iPod touch almost
    looks like a small computer as it can accommodate a flash drive, wireless capability,
