    web server each time the Abstractor requests a page. Most of the common browsers
    are supported: Internet Explorer 6 or above, Firefox, Safari, Opera, and versions
    formatted for display on the iPhone and iPad. Javascript needs to be enabled.
    In response to a page request the application server downloads appropriate Javascript
    to the browser and the page is reconstructed for the Abstractor to see. The code
    for performing physical page construction from Javascript commands is built into
    the browser.


