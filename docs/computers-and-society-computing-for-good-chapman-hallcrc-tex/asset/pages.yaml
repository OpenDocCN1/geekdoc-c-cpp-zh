    from one another. CHCA has since grown from 2 to 150 employees. Their primary
    goal is to bring value to “Owner hospitals” (i.e., Alliance members) through a
    wide range of products and services. The CHCA strategic vision is “Better Performance.
    Together.”


    One area of focus is supporting quality performance improvement. CHCA provides
    or facilitates training on new technology and data and provides an organized venue
    for hospitals to share knowledge with each other. CHCA facilitates collaboration
    among hospitals and shared best practices on a variety of patient care and business
    functions. They have a research and development group focused on development of
    “eMeasures” and setting national guidelines for pediatric quality in alignment
    with national guidelines. In addition to activities hospitals employees participate
