  md: '# Computer Science


    Computers and Society: Computing for Good contains in-depth case studies with
    extensive, thought-provoking end-of-chapter questions and is appropriate for a
    wide variety of undergraduate and graduate majors in areas such as computer engineering,
    computer science, computer information science, information technology, health
    information science, business management, and political science as well as many
    other majors. The complex nature of the case studies allows them to be used in
    a stand-alone social and professional issues course, a capstone issues course
    or as individual case studies that may be woven into a variety of computing or
    business courses.


    Kacmaczyk’s book contains a unique and fresh look at how people from a variety
    of disciplines use computing and how the use of computing impacts these individuals
    as well as society.


    Kacmaczyk’s book should be a ‘must have’ book for all college or university libraries.


    > - Carol L. Sprading, PhD


    Associate Professor, Northwest Missouri State University, Maryville, Missouri


    Because computer scientists make decisions every day that have societal context
    and influence, an understanding of society and computing together can be integrated
    into computer science education. Showing what you can do with your computing degree,
    Computers and Society: Computing for Good uses concrete examples and case studies
    to highlight the positive work of computing professionals and organizations around
    the world.


    Each chapter profiles a corporation, non-profit organization, or entrepreneur
    involved in computing-centric activities that clearly benefit society or the environment,
    including cultural adaptation in a developing country, cutting-edge medicine and
    healthcare, educational innovation, endangered species work, and help for overseas
    voters. The coverage of computing topics spans social to high-performance computing.
    The diversity of people and activities in these profiles gives a broad vision
    of what you can accomplish after graduation.


    Encouraging you to engage actively and critically with the material, the book
    offers a wealth of exercises and activities at the end of each chapter. Questions
    of varying difficulty help you apply the material to yourself or your surroundings
    and to think critically about the material from the perspective of a future computing
    professional. The text also incorporates individual projects, team projects, short
    projects, and semester-long projects. Other ancillary resources are available
    on a supplementary web page.


