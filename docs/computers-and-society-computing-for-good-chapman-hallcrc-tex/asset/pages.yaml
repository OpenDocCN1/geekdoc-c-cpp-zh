  md: '# Computers and society: Computing for good


    Although we did not discuss it in this chapter, there is an entire research branch
    at CHOP that may find the VNA useful. A wealth of data is technically now easily
    accessible. This data can be mined and examined to aid in the study of diseases,
    genetic conditions, and other pediatric concerns. For example, digital imaging
    is a growing technique used in cancer research. (For a very informative and fun
    book on the subject, see the Resources section Appendix E at the end of this chapter.)
    Important privacy issues will have to be navigated before data mining takes place,
    but some researchers at CHOP are already using the possibilities to enhance their
    cutting edge research. Terabytes of patient data spanning sits across the street.
    Chapter 5 discusses a nationwide project to develop a medical database system
    for this type of complex research and analysis.


    Chris already has many related project plans he is working on or considering.
    One project plan will extend access to the VNA to other hospitals and clinics.
    Not all institutions have the resources (personnel, equipment or financial) to
    install their own Vendor Neutral Archive. Thus there is a significant opportunity
    to expand access to cutting edge medical care by working mutually beneficial arrangements
    with smaller hospitals, rural clinics, and doctors in other countries. A second
    project is to interface the VNA management of digital imaging with existing systems
    that manage other data as electronic medical records and financial systems. A
    third project comes from a realization that there is always a need to improve
    the performance of existing computing technology to take advantage of advances
    in areas such as cloud computing and high bandwidth data streaming. Chris is making
    preliminary investigations into how these technologies can be leveraged. Yet other
    ideas for projects stem from advances in computing that include not only the artificial
    neural networks mentioned earlier, but also natural language processing systems,
    high performance architectures and improved approaches to secure data transmission.
    These are just some of Chris Tomlinson''s thoughts. Clearly, there are wide-open
    opportunities for future computing professionals to make a tangible difference
    in providing quality healthcare.


    Perhaps a larger challenge for Chris is strategically evaluating all of his ideas
    and deciding which one can move forward with immediately, which are feasible in
    the not distant future, and have to be laid aside. As an executive with many ideas
    and many responsibilities it is no doubt challenging to make the “yes” and “no”
    decisions about implementing so many projects. However, the immediate future is
    clear: expand the VNA to other “ologies” and demonstrate enterprise wide benefits
    for more and more of CHOP, and move into sharing the VNA with other institutions
    that cannot go it alone. If everything continues to go as well as it has so far,
    these projects will have an ever wider positive impact on hospital function and
    patient care. That has been the bottom line from the beginning,'
