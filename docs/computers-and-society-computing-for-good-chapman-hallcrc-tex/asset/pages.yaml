    data and those who want to expose and exploit it, consider the following examples
    (courtesy of Alec Yasinsac, an experienced member of Internet voting projects,
    who we will introduce shortly):


    Example 1.


    The number of outcomes in computer programs is exponential with the number of
    decisions the program must make. That means if a program makes n decisions and
    each decision has m possible outcomes, the number of possible decision pathways
    through the program is mn.

    To illustrate the complexity a voting system handles is with let''s take an oversimplified
    example, and focus on one of the most basic decisions that a voting system program
    may have to make, (ignoring issues of user interface, data management, security
    and privacy): the proper recording of each user''s choices:


    +   (a) If there are 4 contests on a ballot and if on average there are 3 possible
    selections in each contest, then there are 3⁴ different selection combinations.
    That is a total of 81 different paths through the program.

    (b) If there are 15 contests on a ballot and if on average there are 3 possible
    different selection combinations in each contest, then there are 3¹⁵ possible.
    That yields 14,348,907 (over fourteen million) different program paths.

    (c) If there happen to be 4 selection options on average for those same 15 contests,
    the number goes up to 1,073,741,824 (over a billion).


    See how accurate data recording and storage can become? Consider that in some
    states, particularly in the western United States, ballot measures (voting for
    an issue rather than a person or party) can run into the dozens as this has a
    common grassroots approach for presenting new ideas to the citizenry.

    Why is this so important? There are many implications of this dramatic complexity
    parameter, but one impact that is easy to understand that it is virtually impossible
    to test every possible code path. An expert scientist optimizes him or her test
    cases and uses those most likely to find errors. As complexity grows, so does
    risk of an error and the difficulty of detecting that error. Even under the unlikely
    scenario that supercomputers were assigned to all voting systems so that temporal
