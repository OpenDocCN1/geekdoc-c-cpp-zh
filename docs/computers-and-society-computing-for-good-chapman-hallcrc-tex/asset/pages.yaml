    learn new languages quickly, write tight efficient code, and adhere to

    ing standards created by others. Multimedia coursework is very

    important for developing engaging applications on portable devices, as

    are principles of User Interface design.


    Other skills you need address the business side of entrepreneurship.

    The more coursework you can take spanning everything from sales and

    marketing to accounting, the better. It also helps if you have experience

    making formal presentations—any opportunity you can find to make

    present, take it. Even if you eventually delegate some of these

