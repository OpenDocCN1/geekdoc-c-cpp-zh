    # 7.11.1 Financial considerations


    Finances are one of the trickiest areas for any entrepreneur to navigate. Few
    computer scientists have any formal training in the world of corporate finance.
    As a result, many companies flounder because they do not anticipate the scope
    of the costs. The would-be business owner knows they need to hire a financial
    professional or professionals to handle the complex world of corporate finance
    and taxes. But, beyond that, it is often a surprise to discover how expensive
    start-up costs are. There are large and small expenditures for resources and the
    costs add up fast. Costs include flyers and brochures, training materials, purchase
    of basic equipment, such as copy or fax machines, setting up an office, hiring
    outside of professionals such as an accountant or financial planner. It takes
    time to put all the pieces in place and work towards a positive income. Depending
    upon whether a business aims to stay small, medium sized, or work towards becoming
    an international entity, business strategies and paths will vary. However, there
    are several typical funding/financial stages that most organizations progress
    through. Advice aimed at entrepreneurs emphasize the importance of paying attention
    to particular issues at each stage. Here is a summary of the early stages of funding
    and what each stage supports. Keep in mind that terms will vary and the boundaries
    are not clear-cut as labels might imply:


    Start-Up Financing (cash flow is often negative throughout this stage)


    +   - Initial Small Capitalization (for DevelopEase, the first software application
    and expenses required to develop it)


    +   - Early Product or Service Development & Advertising Funding (for DevelopEase,
    getting the word out to its first potential clients)


    Mid-Stage Financing (ideally cash flow becomes positive somewhere in this stage)


    +   - Clients/customers and product/services exist and are starting to grow (for
    DevelopEase, educational applications, workshops, consulting)


    +   - Clients/customers growing and expansion of marketing activities


    +   - Funding to support delegation of activities (for DevelopEase, an example
    is hiring software contractors to assist with app development)'
