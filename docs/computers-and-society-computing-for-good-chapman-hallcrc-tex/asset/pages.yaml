    to misrepresent or damage a particular hospital or patient or be used for other
    malicious purposes. Aside from ethical considerations which dictated him to out-think
    and out-architect these threats, U.S. Federal HIPAA (Health Insurance Portability
    and Accountability Act) regulations are very strict about maintaining confidentiality
    of medical information. Any medical provider, institution or organization that
    violates HIPAA regulations will find itself in very trouble.


    We have discussed some of the security in place along the communication path between
