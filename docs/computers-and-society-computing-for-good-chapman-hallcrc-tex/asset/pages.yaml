  md: 'Chapter six: Protecting lives using the results of earthquake modeling 225


    # 6.6 Education outreach efforts


    Economic, political, and social decisions about earthquake risk reduction and
    emergency response must be made in spite of an incomplete understanding of earthquake
    behavior. Unfortunately, human nature ignores or puts off addressing overwhelming
    problems. Thus, aside from the technical challenges, there is an immediate social
    challenge: how to address public perception, preparedness, and behavior when an
    inevitable earthquake occurs. The people who work with and at SCEC are not only
    fascinated with their work, but also feel an ethical obligation to put their results
    to use for the public good. To succeed at effective outreach you must not have
    only excellent scientific skills but excellent communication and public presentation
    skills. We need to enjoy the challenge of translating complex scientific and computational
    information into different formats for different constituencies. This is where
    a technical writing or making public presentations of your software engineering
    projects would be useful experiences to have.


    For starters, there are common myths about earthquakes SCEC would like to dispel.
    Some myths appear relatively harmless or even amusing. For some, people believe
    earthquakes are more likely to happen in the morning, or that California is going
    to fall into the ocean. These myths are relatively harmless, but others are definitely
    not: many people believe the safest thing to do in an earthquake is to run outdoors
    is one of the worst things to do; other people believe they are in no danger of
    being injured by building codes and so do not need to take any protective action.
    People respond to visuals—how do you effectively present a complex simulation
    or computational model to a non-technical audience?


    Myths about safety and other topics are important reason why SCEC and its partners
    in the Earthquake Country Alliance created The Great California ShakeOut in 2008.
    This statewide activity is the largest and most visible of SCEC’s effective efforts
    “get the word out” about earthquake preparedness. A voluntary educational drill,
    the ShakeOut engages public and private organizations as well as practice of what
    to do when an earthquake happens (question: do you know what to do?). Initially
    a Southern California activity, public demand has expanded it the entire state—approximately
    6.9 million participants took part in 2009, and 79 million in 2010. People from
    K-12 schools, colleges and universities, businesses, government and medical agencies,
    community organizations, and individuals. Surveys reported that the drill spurred
    many participants to go beyond a single day’s activity and to develop supplemental
    activities, both beforehand and afterwards. The same reports, along with interviews,
    reported that people learned a lot and felt better to prepare and protect themselves.'
