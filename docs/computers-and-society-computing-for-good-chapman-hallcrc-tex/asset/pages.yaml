  md: '# Chapter five: Best practice recommendations in children’s medical care


    # ELECTRONIC HEALTH RECORDS

    AND HEALTHCARE REFORM


    Healthcare Reform—The AMERICAN RECOVERY ACT


    Although many organizations were already hard at work addressing the need to better
    leverage computer science in medicine, Federal Health Care Reform Legislation
    in the United States has added incentive and imperative. Interoperability is more
    important than ever. This legislation is often discussed in terms of cost savings
    and efficiency. Significant media coverage of federal and state health care reforms
    has occurred since the Obama administration signed the American Recovery and Reinvestment
    Act on February 17, 2009. There is lot of public and congressional pressure to
    produce “results” and rigorous assessment of those results. Thus the organizations
    working to utilize computer science to establish and disseminate best practices
    are in the spotlight and under pressure.


    Division A VIII, part of the overall financial allocation decrees of the American
    Recovery Act, states:

    $400,000,000 shall be available for comparative effectiveness to be allocated...
    the funding appropriated in this paragraph shall... encourage the development
    and use of clinical registries, clinical data networks, and other forms of electronic
    health data that can be used to generate or obtain outcomes data...


    Division A Title XIII (“Health Information Technology”) continues funding allocation
    for health care reform. This section includes a provision for $200,000,000 to
    the Director of the National Institutes of Standards and Technology ...for continued
    work on advancing health care information enterprise integration through activities
    such as technical standards analysis and establishment of testing infrastructure...
    and ...$300,000,000 to support regional or sub-national efforts toward health
    information exchange...


    Division B dives deeply into details of health care reform with a focus on electronic
    health records, standards and interoperability. Many of the Division B Titles
    go into great detail about how EHRs shall be implemented. Title XIII Subtitle
    A first introduces the term “Meaningful Use” which is then used throughout the
    legislation.'
