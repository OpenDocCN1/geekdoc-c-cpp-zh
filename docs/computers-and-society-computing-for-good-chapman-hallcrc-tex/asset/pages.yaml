    # 7.11.2 Task delegation


    Task delegation of major activities is often a challenge for an entrepreneur because
    it is hard to get everything done themselves. As any student placed for the first
    time on a project knows, it is not humanly possible to carry through a very complex
    project all alone. Successful entrepreneurs (and technical team members) consider
    carefully how to draw upon the expertise of others, how delegate tasks will vary
    depending upon the project and required knowledge and skills. Nonetheless, there
    is more to delegating tasks than just locating people with certain technical terms
    on their resume. The software engineering student knows how important just understanding
    of purpose and goals are, and how person-ality match is a make or break


    Margaret was particularly concerned that the developers she contracted not only
    have the prior experience (or ability to learn the skills) to create iPod touch
    applications, but that they share her vision and passion for the mission of the
    business. Thus, she mined her contacts and network to locate programmers she knew
    and trusted. Knowing her employees already, it was easier to convey her requirements
    and concerns, and place a higher level of trust in her people. Although Margaret
    maintains close day to day contact with her developers, her task is eased because
    she is careful in her selection of personnel.'
