    keeping those populations in check. When sponge growth is kept in check by hawksbills
    Meryg, they can reproduce out of control and effectively suffocate the coral.
    In a domain effect, the loss of coral reef then also affects the fishing industry,
    the tourist industry, and other industries tied directly or indirectly to the
