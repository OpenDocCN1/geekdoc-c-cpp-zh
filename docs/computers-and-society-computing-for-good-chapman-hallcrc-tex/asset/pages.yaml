    # 1.7 Non-traditional specification development in the Andes


    With the requirements gathering, this stage of the project did not follow a traditional
    document and contract driven model. Nonetheless, it followed the basic principles
    behind good specifications development, i.e., that the specification must describe
    “what” the system must do, based upon the requirements; the “what” then will lead
    to the “how.”


    In this case, the “what” had pretty much risen to the surface based upon the carefully
    explored needs of all stakeholders. However, the initial impetus for the project
    was to assist the potato farmers and alpaca owners, in reviewing the requirements,
    it had become crystal clear the “what” included educational, health, and psychological
    needs—that is if all of the system (townspeople) were to be served and the population
    was to be helped to systematically reduce their poverty levels.


    The outside stakeholders, New Zealand AID, OSIPTEL and the CIP were satisfied
    as long as visible progress was being made. They all recognized the process would
    need to be a slow one if it were to succeed for the long term.'
