  md: '# Chapter six: Protecting lives using the results of earthquake modeling


    SCEC is also preparing to perform petascale simulations using the CyberShake platform.
    They plan to increase the scope of the simulations from Southern California to
    the entire state, and to push the simulations to include higher frequency ground
    motions. This will increase the simulation size by a factor of 300, requiring
    petascale machines, new architectures, and new tools.


    The computing challenges involved in running a simulation increase dramatically.
    With this level of scaling, computer science expertise is needed to address particularly
    difficult issues of memory distribution and partitioning, data storage, load balancing,
    message passing and communication. To complicate matters, experiments involving
    petascale computing are generally spread across many institutions, as supercomputers
    in San Diego and Texas. As the number and variety of architectural configurations
    increases, the likelihood of having to port applications across them increases.
    Porting must be accomplished so that it is transparent to the system and does
    not compromise quality and timeliness of simulation production.


    # 6.9 Concluding thoughts


    Remember Helene and François? In a very real way, both were lucky they were not
    harmed by their earthquake experiences. Helene and their supervisor did not inflict
    the wrong thing when an earthquake occurred, as would many uninformed people.
    François did nothing wrong at all; he was in the wrong place at the wrong time
    when there was no societal or technical infrastructure to warn him and his cohorts
    about the imminent natural disaster. Luck should not be the main factor that keeps
    people alive and unharmed.


    There are some things neither earth science nor all the computing power in the
    world may ever be to accomplish, as providing predictions of initial earthquake
    occurrence and location accurate to the day or even year. On the other hand, it
    is currently possible to predict with significant accuracy (to the day) some information
    about aftershocks. These successful predictions protect life and property. With
    this in mind, the collaborative work of SCEC and affiliated researchers are methodically
    and determined working every day to alter the balance towards protecting people
    through effective use of technology and educational outreach. The equally determined
    and dedicated work of computer scientists specializing in high performance computing
    optimization and application continue to supply the tools, skills, and theory
    needed to create the simulations'
