    # BRIEF HISTORY OF EDUCATIONAL GAMES AND SOFTWARE


    Educational software has existed at as long as the personal computer. Many of
    these programs started off as slightly enhanced games, because computer games
    have existed as long as any computer has existed. One of the earliest to run on
    a handheld platform was the Mattel Football game which debuted in 1977. Football
    was designed to promote social interaction because two people could play the game
    on the same device. This social aspect was one reason why the game was successful.
    Also widely successful as a handheld game platform. Nintendo arrived on the scene
    in the 1980s and as widely successful. Neither Football nor the Nintendo were
    marketed as educational.


    Two types of educational applications on handheld devices appeared in the 1980s
    and each was criticized by many educators. The first type of software, known colloquially
    as “edutainment,” was primarily a game that threw in some exercises for the player
    to solve. This type of software still exists today'
