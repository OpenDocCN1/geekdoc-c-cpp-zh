  md: 'between weeks 37-41. A premature birth is defined as one that occurs before
    week 37, and anything before 31 weeks and 6 days is considered severely preterm.
    The term ''micro-premmie'' applies to any baby weighing below 1000 grams (approx.
    2lbs, 3oz). Ann and Timothy were at the low end of the spectrum. The earlier the
    birth takes place, the greater a level of intervention is required to provide
    the child not only with a chance of survival, but of a positive long term outcome.



    Fetal development occurs in a fairly well known process, with each day, week,
    and month adding to the formation of complex interconnected systems. Premature
    babies are susceptible to a wide array of problems because they are born before
    their internal systems had the opportunity to fully develop. Some problems can
    be short term, and some can last a lifetime. Many problems fall somewhere between.



    Let''s focus on the third trimester, because babies born at or before 26 weeks
    (months) rarely survive. During the third trimester, a baby acquires its immune
    system from the mother. So, babies born at 26 weeks, as Ann and Timothy, lack
    an immune system, and are at high risk of acquiring all manner of pathogens. In
    addition, there are simply too many parts of their bodies that are underdeveloped
    and unable to survive in the outside world. Ann and Timothy had multiple surgeries
    and other interventions in their first year of life, yet have developed a complex
    set of cognitive and motor skills difficulties that are the likely result of interrupted
    brain development. Computing technology is helping us understand this development
    through the use of computing based digital imaging tests that allow researchers
    and care providers to provide to non-invasively watch the development of the entire
    body. Computing has contributed significantly to what we know about the development
    of the fetal brain and what happens when normal development is interrupted.



    During the last two months before birth (months 8 and 9), the neocortex section
    of the brain really kicks into gear, rapidly producing and pruning neurons. Only
    mammals have a neo-cortex. This section of the brain controls sensation, perception,
    and their interaction with general cognitive functions that are associate with
    higher order animals. Development proceeds in a well-known order: first the sensory
    and motor functions, then spatial orientation and attention mechanisms, and finally,
    the ability to perform complex pattern processing.



    Neurons with their connecting axons and dendrites are the mechanism the brain
    uses to communicate. Think of many cells connected to each other by a system of
    complex electrochemical transmitting cables. Messages pass along the neurons and
    lead to thinking, decision making, and memory. This accelerated growth and pruning
    continues after birth,'
