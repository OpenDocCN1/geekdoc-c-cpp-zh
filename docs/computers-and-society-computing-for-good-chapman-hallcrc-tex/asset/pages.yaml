  md: '# 6.2 Scientific computing is at the heart of earthquake science


    It is much easier for people to understand visual images than large batches of
    numerical data. Modeling and simulation are a hallmark of scientific computing;
    a well designed model can communicate to scientists and lay people alike what
    pages of dense technical text cannot. Creating the best user interface is a software
    engineering/user interface task. Models of earthquake systems and simulations
    of their behavior can be developed before, during, and after fault rupture. These
    models should provide large scale manipulation and display and be examinable from
    many perspectives—rotated, sliced, resized, and adjusted at will.


    Every area of computer science studies and curriculum has its place: knowledge
    of hardware down to the machine code level; thorough understanding of hardware—firmware
    interfaces and optimization, the guts of operating systems, programming languages
    and algorithms, databases, networking. None of these areas of computing can be
    analyzed and implemented alone. Each must be considered in conjunction with the
    others in order maximize system performance. If you, a computer scientist, want
    to create earthquake models you must have skills in all these areas. You must
    understand how complex computing interactions take place from the very low level
    all the way up to high level coded applications.


    For example, think about the hardware and firmware requirements for such systems;
    no contemporary stand-alone desktop computer could even begin to handle the level
    of computational power required. In fact few supercomputers can handle the terabytes
    of data that are often collected. Enormous computational power is needed. Highly
    tuned analytical programs that take the fullest advantage of existing hardware
    components are also needed. Incredible storage capacity and the ability to rapidly
    retrieve data are critical. If you want to work in scientific modeling you should,
    if at all possible, take coursework in probability and statistics, algorithmic
    theory and distributed computing techniques.


    Distributed computing is currently the most advanced way scientists handle data
    volume and system loads at the level needed to create and execute dynamic 4-D
    earthquake simulations. Thus, depth knowledge of multiple operating system interaction
    and optimization of task distribution, on a variety of hardware platforms, is
    also vital. Virtually every area a future computer scientist studies is relevant;
    if it hasn''t been mentioned yet, that does not mean it is not applicable.'
