    and analysis. Jackie Evans, as CHNC Chair, will be at the helm arranging the logistics
    to pull everything together. This is just the beginning. The consortium is tangible-
    one step closer to their goal of using aggregated clinical data to reveal best
    practices in superbly neonatal care.


    # 5.20 Final thoughts from the system architect


    Although he is always looking for ways to improve security, David Naas is proudest
    of the existing level of security and stability he has built into the CHND. He
    is also proud of the fact that this framework permits developers to use the system
    over and on different projects they learn. Saving time on ramp up of a development
    team is important when development schedules are tight – as usually are. In addition,
    maintenance time (and costs) is reduced by working with a reusable architecture.
    In a related vein, David continues to push for standardization in his projects
    including: the use of Javascript, well known components and technologies such
    as the SOAP protocol, .NET ASP pages and possibly the use of encrypted HL7 for
    data transport.'
