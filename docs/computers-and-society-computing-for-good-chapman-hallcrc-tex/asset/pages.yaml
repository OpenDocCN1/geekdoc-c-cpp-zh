    section) does a magnificent job of laying out, in aggregate, common curricular
    approaches to influencing social issues into the curriculum of computing programs.
    I owe a debt of thanks to the work of this group in the section that follows and
    refer you to this document as an excellent reference work.


    There are five ACM curricular documents for undergraduate level programs: computer
    science, information technology, information systems, software engineering and
    computer engineering. Societal topics are identified in each of these curricular
    guidelines as both core and elective material. The curricular guidelines can be
    downloaded from the ACM website (http://www.acm.org/education/curricula-recommendations).
