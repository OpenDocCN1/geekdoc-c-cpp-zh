  md: '# Chapter five: Best practice recommendations in children''s medical care 199


    In reflecting back on Phase 1, David talks about the challenges of architecting
    any large project such as the CHND. Having obtained a bachelor''s degree in computer
    information systems and then worked over 20 years in industry and for the federal
    government he has experienced many projects. The challenges he cites may familiar
    if you have worked on a capstone project with a live client or any other project
    where many diverse stakeholders were involved. For example, a great deal of time
    on the CHND project was spent clarifying and synthesizing requirements from the
    Consortium members and later from the Abstractors. Many people from many hospitals
    were involved so there were challenges of institutional and geographic differences
    in addition to the usual challenges building effort. This was a particularly complex
    project running on a very tight schedule and additional information was constantly
    being discovered.


    Learning and then identifying the data fields on this project was also a challenge
    because of different diagnostic terminology standards and the codes that were
    initially ambiguous and had to be verified manually. Resolving these ambiguities
    could entail reworking sections of the architecture and sending him back to re
    that his understanding and implementation were still appropriate for the needs
    of everyone who use the system.


    There were the inevitable resource constraints to be addressed: software or hardware
    that had to be purchased and the ramp up to implement and learn them. David makes
    a point of saying that the physicians in the medical field very understanding
    of all the challenges he faced and the occasional delays that resulted from them.


    To the student who is interested in working on intricate development projects
    in the medical field David says the most important piece of advice he can give:
    is willing to change. Plain and simple. Things will change and you have to be
    ready to change with them. He has learned that the architect and developer must
    be able to change their mindset and let go of approaches that have outlived their
    usefulness. For example, in the not too distant the browser of choice for a majority
    of users encountered was Internet Explorer. Now however, users including those
    at CHCA hospitals are likely to use multiple browsers and devices. A well architected
    system must be able to support all of these and not try to restrict the user to
    a narrow set or version. In terms of specific advice about browsers he says: test
    your code in multiple browsers! Don''t assume that it looks fine in one or two
    browsers that it will look fine in all the others. Do the checks and prove it!


    Second, David emphasizes to the student that they should always be ready for deadlines
    that are “realistic.” This issue does not vanish once you leave the environment
    of a college or university. There will always be pressures to cut corners, and
    these should be resisted because they will'
