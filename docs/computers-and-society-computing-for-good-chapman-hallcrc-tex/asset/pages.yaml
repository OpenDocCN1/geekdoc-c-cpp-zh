    # Improving patient care with digital image management


    # 2.0 Introduction


    This chapter is about how the Radiology Department at a leading children''s hospital
    overhauled the system it uses to store and manage digital images. State of the
    art advances in digital imaging technology required an equally scale of the art
    computing system. The complex installation and data migration occurred because
    a computing professional with experience in the medical industry and a unique
    vision decided to make change happen on an enterprise scale. The Radiology Department
    was intended to be the first of many imaging departments to make a similar overhaul
    if all went well. Tight teamwork with a technology provider specializing in medical
    archiving solutions enabled the project to succeed. Care providers perform their
    jobs with a focus on patients and the new image management system enhances rather
    than interferes with their work. There is a focus on these technologies in support
    of the care of preterm infants and thus the chapter includes material explaining
    the unique medical challenges faced by severely pre-term babies.


