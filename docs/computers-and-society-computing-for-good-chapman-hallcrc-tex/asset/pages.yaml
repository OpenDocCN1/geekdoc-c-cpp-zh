    # # Protecting lives using thenresults of earthquake modeling


    ## 6.0 Introduction


    Earthquakes can be highly destructive to lives and property. This chapter profiles
    an organization of scientists using cutting edge supercomputer technology to create
    detailed earthquake models and simulations. These models are used to predict earthquake
    behavior, work towards public risk reduction and improve emergency response activities
    during earthquake. Located in one of the most famous earthquake-prone areas of
    the world (Los Angeles, California), the scientists perform rigorous physics based
    computations used by other scientists, government agencies, insurance companies,
    and many other people. The scientific team displays their data using colorful
    2-4 dimensional maps and graphs, easily interpreted by a reasonably well educated
    non-earth science audience. In addition, they are involved in extensive public
    outreach and education activities including school children as a primary target.


    Earthquake prediction is never going to be a "solved problem." We will never be
    able to state with 100% assurance when an earthquake will occur, where it will
    occur and how strong it will be. However, scientific computing and increased leverage
    of grid technologies are increasing the reliability of what can be predicted:
    how an earthquake will behave in some geographic area, when aftershocks are likely
    to occur, and where the chances of an earthquake along long fault are higher.
    This information is critical for preparing populations around the world: from
    heavily populated areas such as Southern California and to rural areas such as
    Indonesia.


    Scientific computing demands a vast array of computer science skills. Many of
    these are detailed in the chapter, but few of the most important include a solid
    understanding of high performance computing, parallel networks, vast multi-core
    systems, and scientifically oriented programming languages such as Fortran. It
    probably does not need to be said, but a solid mathematics and physics background
    is prerequisite.


    Aside from the myriad technical skills, you need a strong ability to deal with
    complexity and multiple, sometimes contradictory, variables. Choices have to be
    made about what data to include or exclude in a model'
