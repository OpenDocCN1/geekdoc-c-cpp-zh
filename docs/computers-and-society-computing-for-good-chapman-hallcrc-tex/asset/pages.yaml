    dangerous), some eggs will not hatch, and some eggs will be discovered and broken
    open by natural predators. These destroyed eggs spread nutrients into the usually
    nutrient beach dunes helping various plants and grasses to grow. Scientific papers
    have studied these nutrient exchanges and established their beneficial role in
    maintaining healthy beach ecosystems. Female turtles used to arrive thousands
    at a time on hundreds of beaches, but this is no longer true anywhere in the world.
    The effects can be seen on beaches that no longer support the diversity of life
    they did in the past.


    On the other hand, obtaining factual data about sea turtles and their effects
    on the environment and economy in many other areas are very complicated. The data
    must be defensible enough to be believed by the public, governments and policy
    makers. Equally complicated is the goal to present the data as useful information
    that will influence attitudes towards implementing and enforcing sea turtle protection
    measures.


    Sea turtles have been in such severe decline over 100 years that there is no benchmark
    which to assess “healthy” populations or their effect on maintaining “healthy”
    species. It is also not possible to conduct controlled experiments that show definitively
    what the loss of sea turtles does to the environment and ultimately the life of
    human beings. There are intriguing hints of what sort of problems can arise however.
    For example, leatherbacks like Kawana primarily eat jellyfish, which keeps the
    jellyfish population in check. There are anecdotal stories from fishermen'
