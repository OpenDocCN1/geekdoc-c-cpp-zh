    # 3.5 Security and privacy: Critical technical challenges for Internet voting


    Clearly, computer security and data privacy are the two most important areas of
    computing for an Internet voting project. That voting is a private matter and
    no one should have access to individual votes on any issue or candidate.


    In addition to the items just mentioned, there are potential problems shared with
    traditional domestic voting. For example, how can the system prevent or least
    minimize coercion by people who want to subvert the democratic process? Recently,
    this issue gained a lot of press when Iraq and Afghanistan began to stabilize
    and establish democratically elected governments. Since then, other countries
    have experienced social upheavals and the issue of how to guarantee fair and free
    elections has a constant challenge. Another example of a critical problem is:
    how can an Internet voting system be designed to guarantee anonymity? With as
    pure paper the identity of the voter needs to be verified, but their selections
    must be secure and forever anonymous. How can an electronic system be designed
    to prevent a hacker from breaking in and discovering who voted for? How can the
    tracking of votes be prevented along with the danger of having their votes changed?


    Why is a “guarantee” of correctness on the Internet so difficult? The Internet
    was originally designed by the U.S. Department of Defense for a select number
    of trusted sites for the purpose of guaranteeing communications in the event of
    a national emergency such as a nuclear attack. Therefore, redundancy of data was
    the primary concern, not security of data. If Washington, D.C., was attacked,
    multiple copies of sensitive data would be accessible in repositories across the
    country. This legacy lives on, as the Internet has grown into a global network
    of diverse systems connected with everything from telephone lines to satellites,
    connecting state-of-the-art supercomputers to 25-year-old legacyframes. As a result,
    it seems we can communicate with almost anyone anywhere and because of built in
    redundancy systems, data almost always gets through—unless someone intentionally
    interferes with our efforts. And therein lies the problem. There will be people
    who try to steal or exploit, data that is not “theirs.” Although not unique to
    electronic voting systems, the vulnerabilities of the Internet brought added attention
    to this old problem.'
