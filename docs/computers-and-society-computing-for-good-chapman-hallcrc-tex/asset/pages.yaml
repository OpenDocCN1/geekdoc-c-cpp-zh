    It is appropriate to bring up the different use within the medical community of
    the terms Electronic Health Record and Electronic Medical Record. Although the
    general public tends to use the terms interchangeably, or simply refer to the
    latter term, when it comes to data management there is an important distinction.
    An Electronic Medical Record (EMR) is a subset of Electronic Health Record (EHR).
    An EMR refers to the record developed in a medical facility for you example. The
    EMR is the record of the information related to each of your visits and is typically
    arranged by “encounter” to use the term preferred by care providers. Conversely,
    an EHR contains all the data in an EMR as well as more information about you that
    may be gathered from other sources, especially when that data is transferred between
    facilities. Therefore, in the discussion of the CHND project EHR is the term used.
    Another term, Personal Health Record (PHR) sometimes crops up; this refers to
    records kept by the patient or in the case of children their family. Sometimes
    PHRs contain very useful information that has not been captured by other sources.
