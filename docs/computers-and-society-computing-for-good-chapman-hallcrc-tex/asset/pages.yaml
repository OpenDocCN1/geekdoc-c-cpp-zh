    (SDO) in healthcare informatics. HL7, shorthand for Health Level Seven, was created
    in 1987. According to its website (www.hl7.org) “is the global authority on standards
    for interoperability of health technology with members in 55 countries. HL7’s
    vision is to create the best and most widely used standards in healthcare"


    It is interesting from a computing perspective to note that the name HL7 comes
    from the 7th layer of the OSI model: the Application Layer. You may recall from
    an Operating System class that the Application Layer addresses data definitions
    and communications protocols.


    As of summer 2011, HL7 Version 3 was developed HL7 V3 (for) uses an Object Oriented
    model to guide standards development. This Model is known as the Reference Information
    Model (RIM). According to the HL7 Development Framework Document, “The RIM…provides
    an explicit representation of the semantic and lexical connections that exist
    between the information carried in the fields of HL7 messages”. Another way, RIM
    provides a mechanism to map standard reference terminology for an application
    to a standard model. From point forward, data from the application can be understood
    by other healthcare applications that also follow the RIM model.


    RIM is made of OO Classes with attributes, data types and relationships. Any design
    model for a new or updated specification is expected to derive its own OO Classes
    from those in the RIM. Specification model components, such as structure diagrams
    and use cases, are represented with the UML syntax. HL7 is highly complex (resources
    are provided at the end of the chapter) as it is designed to be applicable to
    all areas of healthcare informatics. Like its highly successful and widely adopted
    predecessor HL7 V2, HL7 V3 is intended to be highly flexible and adaptable while
