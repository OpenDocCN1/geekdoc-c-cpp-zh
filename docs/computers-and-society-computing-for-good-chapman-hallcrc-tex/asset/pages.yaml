    # Appendix B: Brief description ofnselected digital imaging tests


    **Computed Tomography (CT)**: Can be invasive (when carried out with use of a
    contrast dye) or non invasive radiographic procedure. Radiation exposure is considered
    minimal. A brain CT can produce a 360 degree view of the brain in 1 degree increments.


    **Endoscopy**: Visualization of the intestinal tract including esophagus, stomach,
    duodenum, using a lighted scope. Computer virtual endoscopy is a CT scan of the
    colon. A new development is the use of a wireless video-endoscope to perform these
    procedures.


    **VCUG (Voiding Cyst-Urethrogram)** and **Fluoroscopy**: A VCUG examines the bladder
    and urethra areas. It is performed using Fluoroscopy, an X-ray technique that
    produces moving images. Contrast dye causes the areas of interest to show more
    clearly. Radiation exposure is considered high.


    **Magnetic Resonance Imaging (MRI)**: Depicts more subtle details than a CT scan.
    Radio waves are sent to the patient, who is enveloped in a magnetic field. An
    image is created by interaction of body tissue with the radio waves in the magnetic
    field.'
