    All species of sea turtles are in severe danger of extinction. Hazards around.
    Some turtles are prized for their meat, or for soup; some are prized for their
    beautiful shells (turtle shell jewelry) used to be all rage until international
    treaties squashed the legal (but not illegal) trade; some are coveted for aphrodisacs.
    Other turtles are sickened by pollution from sewage and agricultural runoff; some
    are killed by ingesting pollutants as plastics (they look like tasty jellyfish)
    and blows of crude oil mixed with edible plants and animals. Thousands of turtles
    are killed as the by-catch of modern commercial fishing methods.


    Why do these deaths matter? Aesthetic issues aside, there is a very practical
    answer: turtles are a “canary in the coal mine” of marine species, or more formally
    referred to, a “keystone species.” Sea turtles are near the top of a complex marine
    food chain and their demise has a destructive ripple effect on many other animal
    and plant species and even upon some terrestrial environments. How do “prove”
    these consequences beyond all doubt? You cannot. An ongoing challenge for the
    ST is to gather and effectively disseminate scientific data.


