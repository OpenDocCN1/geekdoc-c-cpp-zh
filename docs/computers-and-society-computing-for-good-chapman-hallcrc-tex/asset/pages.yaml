  md: '# CHAPMAN & HALL/CRC

    TEXTBOOKS IN COMPUTING


    Series Editors


    # John Impaglizzo

    Andrew McGettrick


    Professor Emeritus, Hofstra University

    Department of Computer and Information Sciences University of Strathclyde


    # Aims and Scope


    This series covers traditional areas of computing, as well as related areas, such
    as software engineering, artificial intelligence, computer engineering, information
    systems, and information technology. The series will accommodate textbooks for
    undergraduate and graduate students, generally adhering to worldwide curriculum
    standards from professional societies. The editors wish to encourage new and imaginative
    ideas and proposals, and are keen to help and encourage new authors. The editors
    welcome proposals that: provide groundbreaking and imaginative perspectives on
    aspects of computing; present topics in a new and exciting context; open up opportunities
    for emerging areas, such as multi-media, security, and mobile systems; capture
    new developments and applications in emerging fields of computing; and address
    topics that provide support for computing, such as mathematics, statistics, life
    and physical sciences, and business.


    # Published Titles


    Pascal Hitzler, Markus Krötzsch, and Sebastian Rudolph,

    Foundations of Semantic Web Technologies


    Uvais Qidwai and C.H. Chen, Digital Image Processing: An Algorithmic Approach
    with MATLAB®


    Henrik Bærbak Christensen, Flexible, Reliable Software: Using Patterns and Agile
    Development


    John S. Conery, Explorations in Computing: An Introduction to Computer Science


    Lisa C. Kaczmarczyk, Computers and Society: Computing for Good'
