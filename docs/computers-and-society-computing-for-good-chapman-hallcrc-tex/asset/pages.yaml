    As you can see, the technical challenges of designing and building the networks
    were created by the challenges of culture and geography. A system that would be
    simple in an urban location, or even a rural location closer to sea level, became
    a highly complex task when all contextual factors were taken into consideration.


    # 1.6 Confirming the accuracy of the requirements with all stakeholders


    A traditional approach would be to draw up itemization of the requirements just
    listed, and show it to all stakeholders for initial approval. Then formal paperwork
    would be generated, and signed by selective representatives of the major stakeholders.
    Clearly, that approach would not work for this project. Even if most of the villagers
    could read and write, such an approach would fly in the face of culturally established
    methods of consensus decision making.


    Thus, Ruben, Logan, and their task force recruits spent many days revisiting the
    social groups that were discovered earlier in each community, repeating what they
    believed they had heard and having it either confirmed or changed (Figure 1.7).
    Many more long and involved meetings took place so that everyone could say their
    and reach agreement. Another benefit of this inventory of social groups was that
    the visits represented additional ways to get the word about the opportunities
    of the project as it progressed. The villagers also action, meeting among in town
    meetings and council gatherings to further discuss their needs and seek consensus
    between visits by the project leaders.


    No formal requirements documents were created, signed, or archived. This was absolutely
    necessary in order to function within the villages'' cultural system. The project
    managers took virtually no notes during meetings. In private, they wrote meticulous
    notes about what they learned, and compared experiences among themselves as they
    visited with different groups. Primarily however, the project managers learned
    to work in an oral tradition. Agreements and changes'
