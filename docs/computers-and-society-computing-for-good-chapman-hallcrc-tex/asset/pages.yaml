  md: '# Introduction


    This book came into existence because of the intersection of personal passions
    and practical observations. The passions are both mine and those of the people
    profiled in these chapters. The practical observations, made over many years teaching
    both traditional and interdisciplinary computer science courses, I take responsibility
    for.


    Courses designated as “computers and society” courses have often been designed
    for the freshman level or for a general audience. These courses serve a purpose.
    However, by placing these courses at that level and toward an audience, some people
    have questioned whether or not societal topics constitute “real computer science.”
    After all, if there is no “technical meat” to it, is it computer science? I don’t
    want to get drawn into a definitive debate; many others are working on that one.
    My point is: The tendency in some camps to dismiss lower division coursework in
    computers and society as “not real computer science” leads to a self-reinforcing
    pattern where students and faculty alike give little attention to a critical aspect
    of computer science education. Every decision a computer scientist makes has a
    societal context and influence; for ethical reasons if nothing, this understanding
    must be integrated into computer science education. Supporting evidence is needed
    and supportive materials are needed. Therefore a book on computing and science
    targeted at a higher level audience is needed—a book with “technical meat” in
    it. A book that will hopefully convince the fence sitters, that computer and science
    belongs in a computer science curriculum and it should be taught by computing
    faculty.


    From here I will use the word “computing” frequently. This choice is intentional
    and strategic. I want to make it clear that the above argument applies not only
    to computer science, but information systems, computer engineering, software engineering,
    and other flavors of “computing” degree programs. In addition, I want to acknowledge
    that outside the United States the term “computing” is often preferred over the
    term “computer science.”


    My primary goal in writing this book is to address two issues. First, there is
    an increasing emphasis in computing curricular guidelines'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'xii


    Introduction


    inclusion of more “computers and society” material. Incorporation and presentation
    of this material vary widely depending upon the institution and program, but discussion
    is showing up more and more at conferences such as SIGCSE (the primary computer
    science education conference) and its sister conferences around the globe. Accrediting
    agencies as ABET have paid increased attention to societal issues in recent years.
    Departments are responding to industry calls for students with well-rounded educations
    and an understanding of how their technical decisions affect the world around
    them.


    However, there has been a tendency for “computers and society” coursework to be
    translated as meaning “ethics.” There is nothing wrong with a study of ethical
    making in computing; in fact, ethical considerations are important and appear
    throughout this book. But placing a primary focus on ethics generally leads to
    discussions of how things wrong. We are not doing our students (or the general
    public) any favors by sending the message that societal issues in computing are
    all examples of the negative effects and damage caused by computer software and
    systems. Formal exposure to societal issues in the curriculum should not start
    with (and end with) negative consequences and how they can be avoided. We need
    to incorporate in our curricula a clear message that computers and computing systems
    can be powerful engines for creating social benefits.


    Again unfortunately, there is a dearth of books that provide concrete examples
    highlighting the positive work computing professionals are doing in the world;
    people can emulate, use models and inspiration. This book provides case studies
    of real people, real organizations, computing professionals making a living pursuing
    dreams of making the world a better place.


    Each chapter is a profile of a group or organization doing something centric that
    is clearly good for society or the environment. The profiles include corporations,
    nonprofit organizations, and entrepreneurs. The coverage of computing topics spans
    the curriculum, from social networking to high performance computing. The application
    domain areas include cultural adaptation in a developing country, cutting edge
    medicine and healthcare, educational innovation, endangered species work, earth
    sciences, and voting. The diversity of people and activities presented in these
    profiles will give students a broader vision of what they can do with their computing
    degree.

    nThe second goal of this book is to target undergraduate computing students. Typically,
    societal issues are dealt with in one of two ways (if they are directly addressed
    at all) in the curriculum: through a general education or first year course with
    little technical knowledge, or as part of a final year capstone project. In the
    first case, the course may be taught by faculty from another department,'
  merge: -1
