    digestible form for a non technical audience. Satellite tracking technology has
    increased what little we know about turtle migrations and their interactions with
    humans. Yet even when informative data is well substantiated, getting the word
    out to diverse and widespread stakeholders is extremely difficult.


    The plight of sea turtles and their importance to society is an excellent example
    of how difficult it is to tackle high stake, global environmental issues. Often,
    nonprofit organizations take the lead in addressing low profile cases such as
    sea turtle conservation because they feel passionately about the subject. They
    work under difficult circumstances, facing daunting resource constraints. Fortunately,
    some nonprofit organizations such as the Sea Turtle Conservancy (STC) have discovered
    they can harness a variety of computing technologies and make huge gains in raising
    awareness and driving change.


    Founded in 1959, the Sea Turtle Conservancy, formerly known as the Caribbean Conservation
    Corporation, is the oldest sea turtle conservation organization in the world.
    Their mission statement says:


    > "It is the mission of the Sea Turtle Conservancy to ensure the survival of sea
    turtles within the wider Caribbean basin and Atlantic through research education,
    training, advocacy and protection of natural habitats upon which they depend"
    [emphasis added].


    Based in Gainesville, Florida, the STC has a permanent worldwide staff of less
    than 20. They work to protect many types of sea turtles, specifically focusing
    on those that range from the Mid-Atlantic seaboard of the United States down through
    the Gulf of Mexico to Costa Rica Panama, Bermuda and all areas in between. Turtles
    are highly migratory, regularly swimming outside this range, which makes it difficult
    to keep track of them. The technical problems the STC faces fall into two categories:
    Data Gathering and Digesting, and Getting the Word Out.


    # 4.2 The challenge of gathering data and digesting it


    Some consequences of sea turtle decline are fairly well established. Sea turtles
    are unique in that they play a role in maintaining the balance of marine ecosystems
    and beach ecosystems. Every few years, female turtles of all species crawl out
    onto land to lay multiple clutches of eggs. They bury their eggs in the sand to
    incubate for several weeks. Percentage of eggs produce tiny baby turtles that
    dig out and scramble in hoards for the ocean. Figure 4.2 shows a baby leatherback,
    approximately 3” long, moments after it emerged from a nest. Even without the
    presence of people (stealing turtles, capturing turtles, making beaches inaccessible
    or'
