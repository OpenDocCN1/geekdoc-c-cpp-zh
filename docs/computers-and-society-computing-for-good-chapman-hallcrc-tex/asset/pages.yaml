  md: 'able to converse on the full range of technical and non technical aspects of
    your business. You do not want to fall prey to a classic problem: a great technology
    idea fails because of insufficient understanding of business fundamentals.


    Some computer scientists know early on they want to be an entrepreneur. Others
    discover it later in their career. Whether you want to form your own company with
    many employees or you want to work solo as a consultant, or something in between,
    this chapter will give you a flavor of what the experience is like.


    # Vignette


    Margaret Ellis was a professional systems engineer when one of her children became
    very ill and despite the best medical services available, was left with permanent
    cognitive and motor disabilities. Suddenly, Margaret, an actively involved parent,
    was thrown into a new world of how to ensure the best education for her child.
    She wanted her daughter to have an inclusive education as much as possible—to
    experience and be able to interact with them without feeling “different.” In educational
    software she did not see what she felt was needed to help her daughter. She realized
    the K-12 schools in general could benefit from creative educational applications.
    But any introduction and use of the technology and applications had to be well
    executed from both pedagogical and technical standpoint. Someone needed to tackle
    this problem. The question for Margaret became: what to do?


    # 7.1 Discovering the potential of the iPod in education


    It was late August 2009. Her daughter was 7 years old. Margaret was working part
    time caring for her daughter. Margaret’s husband, Matt, had recently ordered a
    Macintosh computer that came with an iPod touch for a promotional incentive. Another
    family member gave her a gift card to iTunes so she could purchase applications
    (commonly referred to as “apps”) for the iPod. Fully focused on the care of her
    daughter Margaret started poring over the educational software available through
    the Apple Store and other companies. She bought a few apps to try out.'
