    For example, all incidences of Healthcare-Associated Infections (HAI) are reported
    to the CDC. In the past term was used Hospital Acquired Infection, but with the
    increasing use of outpatient clinics and non traditional settings for medical
    care, especially in rural environments, the generic term reflects the incident
    more accurately. An HAI is an infection that appears within a few hours, generally
    48 hours, of admission to a medical unit and where there is evidence that incubation
    occurred during that time. Infections that appear after a patient is discharged
    may have been acquired during certain circumstances the patient stay in the facility.
    There are different types of HAIs such as bloodstream infections, pneumonia and
    urinary tract infections and they can be acquired in many ways. Consider just
    how many bacteria, viruses and fungi are inevitably present even in the most diligent
    hospital (Figure 5.5a). As of 2002 the available approximately 1.7 million HAIs
    occurred in the United States, resulting in 99,000 deaths. The CDC reported in
    2009 that overall direct medical costs of HAIs ranged from $28 billion–$45 billion.
    The rate of infection and associated deaths are higher in susceptible populations
    such as the very old and the immune compromised. When this data first became available
    to the medical community, it spurred investigation into why incidences of HAI
    infections were sometimes and what could be done to lower them.


    Pursuing this example further, hospital intensive care units (ICUs) are by nature
    going to be at risk for a high number of infections. Large numbers of seriously
    ill people constantly arrive and leave, with their family and others to support
    them. Many doctors, nurses and staff work in close proximity to save a patient''s
    life. ICUs are thus a logical target for trying to reduce the occurrence of HAIs.
    Many excellent measures were put into place to reduce acquiring and transmitting
    infections. But it was not always clear which practices would be most effective
    in the greatest number of settings. In one classic study, the application of a
    substance was used in a hospital ICU to identify where personnel were moving around
    and what they came in contact with. This substance is invisible under normal lights
    but when viewed under infrared lighting, appearing everywhere that people have
    touched a surface. Surprising discoveries of just how many medical personnel were
    touching objects and surfaces provided insight into how contaminants may creep
