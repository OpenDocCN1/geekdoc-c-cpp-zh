  md: '# 7.12 The challenges of introducing new software into the public schools


    In spite of demonstrably meeting state mandated curricular standards, there were
    other hurdles for DevelopEase to address to gain acceptance of its apps in schools.
    These issues are best understood by first looking at the challenges faced by classroom
    teachers. The United States (and many other countries as well) educational model
    is based on the philosophy that all deserve equal opportunity for educational
    achievement. Put into practice, this belief promotes a goal of providing equal
    access to all students regardless of the challenges they face. In the ideal scenario,
    every child will receive a comprehensive yet personalized academic education benefiting
    from the social interaction of participating with a classroom of peers.


    In promoting social and educational equality of opportunity, a highly diverse
    pool of students often shares the same classroom. Student diversity may manifest
    itself economically, through interests and aptitudes, background preparation,
    familial support, and learning styles. Not only, but as teachers and parents well
    know, children develop at different rates. For example, there can be wide developmental
    differences between an 8-year-old born in January and an 8-year-old born the following
    November. Yet, they may be in the same classroom. To complete matters further,
    attention at kindergarten (approximately 5 age) used to be full kindergarten,
    whereas some states or counties require half day, and kindergarten remains optional.
    All of these factors mean that any one teacher has be very flexible and creative,
    and competent in many content fields and the pedagogical techniques appropriate
    for his or her age group.


    Politics and prevailing federal policy affect teachers as well. Public schools
    in the United States (as elsewhere) are subject to changes in political decisions
    about funding priorities and resource allocation. In decades, there has been a
    shift in several significant directions. First, funding for public education across
    the United States has decreased, resulting in larger class sizes. As class size
    increase, diversity factors inevitably become more challenging. According to one
    middle school teacher, there are formal researches that report student ratios
    for different age groups, the pressures of reduced budgets often take precedence
    over the size. One elementary school teacher said he had read a study concluding
    that in a primary classroom (in the United States approximately ages 5-11) every
    1 student over a total of 24 students adds a work load equivalent of 6 students.
    These numbers were particularly meaningful for him because in the 20 years he
    has taught, enrollments have risen from approximately 22 students in his classes
    to almost double that number. For this teacher, the difference in class atmosphere'
