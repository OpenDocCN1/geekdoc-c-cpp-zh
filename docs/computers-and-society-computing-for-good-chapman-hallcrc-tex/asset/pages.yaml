    # 3.11 Design and architecture of Okaloosa voting project


    All critical data and processes were to be tightly controlled. Remote voting kiosk
    stations were set up in hotels close to U.S. Air Force Bases in three countries:
    the United Kingdom, Germany and Japan (Figure 3.4). Specially trained election
    workers were flown in to administer them. In each hotel, there were two laptops:
    a Voting Terminal and an Authentication Terminal (Figure 3.5). The terminals were
    connected to an off server in Spain using VPN encryption (“Shared Central Data
    Center” in the diagram). There was no direct connection between the laptops. The
    central server in Spain was housed in a secure data center. This facility provided
    robust physical and electronic security: the server room was under continuous
    video surveillance and could only be accessed by authorized personnel with biometric
    security passes. The data center had high bandwidth connections to many telecommunication
    services. The network infrastructure within the data center consisted of multiple
    levels of firewalls, filtering communications ports and other communications security
    measures to protect the voting systems from infiltration by malicious traffic.
    In addition, all the external connections to the central server operated over
    VPNs with SSL/TLS (Secure Socket Layer/Transport Layer Security), providing an
    additional layer of protection from hacking attempts.


    The Authentication Terminal, running a Windows operating system, was used by the
    trained election workers to authenticate the identity of the voter. Authentication
    was accomplished through a connection to an Oracle database sitting on a server
    in Okaloosa County, Florida which'
