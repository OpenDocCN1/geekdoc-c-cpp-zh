    # 5.10 The application flow layer: A level below


    In this section we discuss what is happening just under the hood when an Abstractor
    such as Christine is working at her computer entering medical information into
    the CHND. Abstractors are not aware that servers exist, where they are located,
    or how they communicate—nor they want to know these details. However, technically
    there is a lot going on.


    There are 4 servers, all located on premises at CHCA headquarters: a web server,
    mail server, data server and application server. The mail and data servers are
    physical and the web and application servers are virtual. The mail server is used
    exclusively for e-mail and cannot contact the other servers. This separation prevents
    any e-mail message or attachment from intentionally or inadvertently accessing
    medical data. The data server contains the SQL database and can only be accessed
    via the application server. The web server is the only server to communicate with
    the client (i.e., the Abstractor and their browser). The Abstractor as client
    is prevented from having any direct access to the application server. The web
    and application servers are kept physically separate, adding another layer of
    security to the system.


