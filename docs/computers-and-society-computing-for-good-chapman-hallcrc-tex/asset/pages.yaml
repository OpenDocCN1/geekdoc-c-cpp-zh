  md: '# Chapter one: Poverty alleviation in the remote Peruvian Andes


    # 1.1 Systemic poverty and health problems in the villages


    Peru ranges from sea level to over 15,000 feet (4,572 meters) high in the Andes.
    Many people live high in the mountains, far apart from one another, little known
    to the outside world. One of the 24 Peruvian regions is called Huancavelica, and
    is located in the central southern region of the Andes. Here you will find the
    town of Daniel Hernandez. One hundred and eleven farming communities, with an
    approximate population of 108,000 people, are spread thinly across almost impassable
    peaks, valleys, breathtaking cliff drop-offs, and steep slopes. Impassable, that
    is, to modern western society. Roads Pavement? Ruts and bumps enough to knock
    out every ball joint loose and guaranteed to slam your head into the roof if you
    aren''t bout secured to the seat and short of stature. Little grows here; the
    primary crops are potato, maize and barley, depending on these altitudes and therefore
    are the primary source of many products, from food, to clothing, to transport,
    and material for sale in the cities far below (Figure 1.1).


    Globalization has brought serious problems to the people of the Andes. For example,
    there are rich minerals, including gold, in the mountains. The byproducts of corporate
    gold mining include toxic chemicals that end up in the streams and air pollution
    from large smokestacks. Drinking water can become polluted without the villagers''
    knowledge. Soft drink companies place billboard advertisements for soda and snack
    food along traveled routes and in the small towns. Soft drinks are not only expensive
    for a people that live primarily on a barter economy, but contribute to malnutrition
    and other health problems, including previously non-existent dental problems.
    Finally, unscrupulous traders, who appear unannounced, have taken advantage of
    the people''s lack of knowledge of ever changing market demand, and often have
    paid minimally for products they then re-sell for much higher prices in the city.
    These developments have disrupted the delicate balance of life for the Andean
    dwellers.'
