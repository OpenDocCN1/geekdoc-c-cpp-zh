    Computers and society: Computing for good


    can watch for the nuances of each and study why something "works" or not. By actively
    contributing (i.e., posting) you will learn what can happen when people engage
    in conversation online. Some media may not be appropriate in certain situations
    and you should know why. It is also helpful if you are interested in portable
    computing devices because more and more people expect to access online resources
    from so called "non-traditional" hardware.


    It is worth noting that if you work in a for-profit organization, the skillful
    use of social media is rapidly becoming a skill that differentiates technical
    people in marketing, sales, training and other areas. If you are interested in
    how to make the most of technology without large outlays of funding, if you go
    for it if you are interested in working for an environmental cause or nonprofit
    organization, this chapter provides insight into how you as a computer scientist
    can make a career doing so. The opportunities are vast because social media does,
    if used properly, is engage an audience.


    # Vignette


    Merygo was a mature hawksbill turtle on September 6, 2004 when she left Panama
    with a location transmitter attached harmlessly to her shell. Although small by
    sea turtle standards (hawksbills) only grow to about 30 inches [88 cm] and weight
    of at most 165 lbs [75kg], Merygo had laid approximately 130 eggs in a nest on
    the beach, for as many five nights into the nesting season. Job done, she set
    off into the Caribbean Sea to rest for a few years at her feeding grounds on a
    distant coral reef. Unfortunately Merygo never arrived at her reef. She was caught
    by people and eaten a mere two weeks later. Her stunning multi-color shell may
    have been sold, in spite of international bans on the sale of sea shells and products
    made from them.


    Leatherback turtles like Kawana are enormous (up to 1,200 lbs/544 kg), fast, powerful,
    can dive as as whales (over 3,000 ft/1,100 meters) and they love to eat jellyfish.
    Unfortunately, their size can be their undoing as happened with Kawana. She was
    close to shore, getting ready to nest in July 2005, when she became caught in
    a fisherman''s gillnet, and was held underwater until she drowned. Although there
    has been great international pressure to modify commercial fishing gear to prevent'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'accidentally catching sea turtles, thousands are still caught each year and
    die. The problem is particularly acute for the largest turtles because "turtleclud
    devices" have escape hatches that the large turtles cannot fit through. There
    are other kinds of fishing gear that have no escape mechanism at all. Leatherbacks,
    like all sea turtles, are on the international endangered species list and face
    real danger of extinction.


    # 4.1 Limited resources and a seemingly limitless mission


    Neither the general population nor many policy makers understand just how important
    sea turtles are to worldwide ecosystems and healthy economies. In some cases this
    lack of knowledge is due to the incredible complexity of an animal that roams
    the globe from the arctic to the tropics, regularly disappearing for several years
    at a time (Figure 4.1). It is virtually impossible to isolate cause and effect
    in the way many people would like. On the other hand, modern technology has brought
    a better understanding of important aspects of the role sea turtles play in maintaining
    environmental and societal balance. Computer assisted modeling helps scientists
    render complicated information into


