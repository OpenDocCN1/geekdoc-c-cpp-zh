    audience is primarily the public education system and students with dis-

    abilities. Therefore the profile includes relevant information on learning

    theories and introducing technology and services to the classroom.


    This is a natural candidate for the last profile in this book.

    After all the organizations and groups we have discussed, it is impor-

    tant to include entrepreneurship as a viable option for computer scientists.

    There is a stronger business orientation in this profile than in any other.

    It takes drive and determination to start a business, but with proper plan-

    ing it can be done.


