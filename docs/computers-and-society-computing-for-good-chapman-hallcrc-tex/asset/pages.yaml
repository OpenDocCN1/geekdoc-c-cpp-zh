    management. This pair of guidelines is intended to help states implement health
    information interoperability, electronic health records and technology infrastructure
    to support them. This act is known as “Meaningful Use—The Final Rule.”


    # Meaningful Use—The Final Rule


    The development of Stage 1 of the Meaningful Use guidelines and regulations underwent
    a period of public comment and adjustment. Extremely complex to the non medical
    professionals, an attempt is made here to discuss those parts of the Rule that
    affect the CHND project. There are many additional detailed documents, some of
    which are listed in the Appendix, if you wish to delve into the legislation.


    Stage 1 was finalized July 28, 2010 and published in the Federal Register. The
    regulations apply to Medicare Eligible Hospitals and may apply to individual care
    providers (i.e., doctors) in certain well defined circumstances. Registration
    (i.e., signing up) by care providers and hospitals began in January 2011, and
    incentive payments are available to those participate with expectation of receiving
    an incentive payment. The last year a hospital or provider may initiate participation
    with expectation of receiving an incentive payment is 2016. After 2021 the regulations
    apply but incentives will cease to be available.


    There are many specific objectives for Stage 1 of Meaningful Use. These take one
    year after the care provider or hospital officially registers that it is beginning
    compliance with the regulations. Those that affect the CHND project are requirements
    for computerization within a certified EHR of high percentages of diagnoses in
    ICD-9 or SNOMED format. Prescriptions, medication lists, allergy lists, a variety
    of demographic information, clinical summaries and additional information are
    required and will provide the holistic information the CHND needs. One possible
    drawback is that some of the requirements for Stage 1 apply only to patients over
    a certain age; in some cases age 2, in other cases age 13. These data will only
    indirectly affect assessment of neonatal best'
