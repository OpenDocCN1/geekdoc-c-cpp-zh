    Seismic Hazard Analysis and thus risk reduction are achieved in great part by
    improving the accuracy of probability estimates: Gigabytes, or even terabytes
    of data need to be analyzed, including regional and local variations, both natural
    and human climate, and the myriad data about ground type, masses, their tilt,
    terrain, rock type, depth of each of these, specific fault and tectonic plate
    characteristics.


    Risk analysis takes into account the above data. Digging deeper (pun intended),
    risk analysis and thus reduction may also require data on building types and locations,
    seasonal and weather possibilities, economic and cost data, even political factors!
    Successful rapid emergency response relies on part about the earthquake itself,
    including location of the epicenter (location of the earth directly above the
    underground origin of the earthquake), focal depth (how deep the origin is), magnitude
    (how much energy is released by the rupture), and recordings of seismic waves
    at many locations. This is a classic computing problem of large scale data analysis:
    selecting and applying the “best” constraints, knowing that the model you develop
