  md: '# Computers and society: Computing for good


    come back to bite you. He points in particular to keeping code reviews in the
    schedule, keeping them tight and thorough, and in checking others'' work whether
    people are your peers or subordinates. Keep an eye on adhering to standards even
    if it takes time up front. Make sure your code is maintainable; it must work well
    and be written. When things change, as they will, you will regret having cut corners.
    On one painful former project David remembers spending 5 to 6 months fixing code
    other people had written because problems were not headed early.


    Third, David says it is all too easy for basic requirements to not be locked down
    and make clear to everyone. This can result in situations such as the one described
    in this chapter the perspective of the Abstractors was left out of early conversation.
    At the time that particular event was discovered, David was “knee deep in another
    project” and had to make the time to hammer out new code without letting his other
    project suffer.


    Fourth, David points out that when you get to the level of having input on new
    hires, as the hiring manager or as a part of a hiring committee, it makes a big
    difference to hire technical people who have a formal computer science background.
    His experience has taught him that a formal education in computing provides an
    understanding of software design principles and the importance of the full range
    of product development (not just courting code) that developers from other backgrounds
    often lack. Computer graduates also learn faster, are informed about efficiency
    issues and the best approaches, and can handle testing, planning and requirements.
    In other words, a computing graduate brings them with the broad as well as deep
    background necessary for developing solid systems and being able to step into
    unexpected rules on short notice. David always looks for new hires that have both
    experience and a computer science educational background.


    Although senior level people in an organization may or not have a highly technical
    background it is extremely helpful to involve them in the key elements of system
    design and development. During these conversations standardization options can
    be discussed as resource allocation—before it becomes critical—and time frames
    for development that fit both client and organizational goals.


    Fifth, don''t be afraid to experiment. There is always a risk taking on new technology
    but you would not sit around waiting to be trained—for it.


    Finally, don''t approach implementation and design choices because they are “cool.”
