  md: '# Chapter six: Protecting lives using the results of earthquake modeling


    must be made about how most rapidly analyze rupture data as it appears and as
    it changes, make virtually instantaneous decisions about what the data means and
    then select an optimal routing of that information to the locations that need
    it. Simultaneously, maps must be developed to reflect the occurrence of the earthquake
    and the progress of seismic waves; these models must be immediately interpretable
    so those receiving them can take the appropriate protective actions. Emergency
    response teams, fire protection, media outlets, local government are just some
