  md: '# Computers and society: Computing for good


    elsewhere. That server can be located in an environment where it can be managed
    using established methods for protecting extremely sensitive data. Voter authentication
    is a process already taking place in traditional voting venues.


    Some of the challenges of developing an EMS have to do with the distributed and
    flexible nature of state procedures. We mentioned this earlier in the chapter,
    but it is worth reiterating: there is no “one way” for a voting system to operate
    that every state and county will agree upon. This variation has very little to
    do with voting. States are allowed flexibility in how they implement Federal programs
    for the reason that each state has its own local conditions (population demographics,
    geography, etc.) to accommodate.


    On a more technical level, standardization of data formats is a challenging problem,
    although again, a problem not unique to voting software. In fact, you will see
    this problem crop over and again throughout the profiles in this book. As society
    moves rapidly into computerized large amounts of data, proprietary systems often
    make it difficult to extract and merge it with other data. There are several EMS
    vendors with well established “clients” around the world. It is expensive to extract
    data from one system into another or to upgrade to versions of a system.


    Why is data extraction from one system to another or upgrading EMS software important
    for voting? Doesn’t each election happen once? As a computer scientist, you have
    the tools to think about this problem and see if you can figure it out.


    There are always tricky issues when science and public policy interact. Computing
    is particularly complicated because the field is so new, and technology changes
    so quickly. By the time consensus is reached on a contentious issue, the point
    may be moot. The technical issues alone for Internet voting are complex, but often
    come down to one issue discussed earlier in this chapter: risk assessment, and
    what degree of risk is tolerable in order to achieve a societal right guaranteed
    by the Constitution? In some cases entrenched opinion from holding a philosophical
    stance whether or not the Internet can ever be an acceptable medium for any voters,
    overseas or otherwise. Proponents argue it is only a matter of time until Internet
    voting becomes reality, also that the subject is a matter of morals, and we must
    address the problem of overseas voting head. However, must decide for yourself.


