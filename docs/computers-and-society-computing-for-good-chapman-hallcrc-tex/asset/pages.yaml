  md: '# SNOMED-CT


    The most widely used medical clinical terminology set is SNOMED-CT, shorthand
    for Systemized Nomenclature of Medicine—Clinical Terms. Often referred to simply
    as SNOMED, the terminology set was created from a merger of previously existing
    terminology sets in the United States and Great Britain. Currently SNOMED is maintained
    and promoted by the nonprofit International Health Terminology Standard Development
    Organization (IHTSDO); they are focused on providing “safe and effective health
    interchange” across the global medical community. Over time, SNOMED has expanded
    and evolved into a hierarchical concept, terminology and relationship based structure
    that covers virtually all areas of medicine. SNOMED graphical diagrams provide
    a visualization of the relationships between concepts.


    Refer to Figure 5.8, an example of the relationships for the concept “Asthma.”
    This diagrammatic layout of concepts and relationships should be familiar if you
    have studied database-based design. Each node in the concept design contains a
    unique name and numeric identifier (e.g., Concept: “Asthma,” Identifier “195967001”).
    Other concepts that have a relationship to Asthma have their own nodes (e.g.,
    “Asthmatic Bronchitis,” Identifier “405944004”). Asthma “May be” Asthmatic Bronchitis,
    whereas Asthmatic “Is a” Asthma. Not shown here, concept nodes also contain alternate
    (synonym) identification information. Often these synonyms are more commonly used
    terms which may or not be unique (e.g., Heart attack is a more commonly used term
    for “Myocardial Infarction”). At a deeper level of detail, there are tags to identify
    categories and subcategories for the concept, and data fields and identifiers
    that are machine readable as well as human readable. The Appendix provides resources
    for locating full information on the structure of SNOMED-CT standard.


