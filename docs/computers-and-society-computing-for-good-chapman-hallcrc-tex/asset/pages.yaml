- img_proc: true
  md: '# Computers and society: Computing for good


    Grids are very common in scientific computing. Typically there are multiple cores
    within each computer. Different topologies can be used to create a grid, however
    there are common issues that have to be dealt with the grid scales to include
    more and more processing power.


    There is the question of how many processes to create. Too few and processing
    may slow down, too many and processing may slow down (can you think why this would
    be?). Processes must be distributed in a balanced way. Balanced does not necessarily
    “equal.” (Why?) Load balancing is a major concern; process distribution has to
    respond virtually instantaneously to change in computational ability. Processes
    may run next to one another on a single node. This can create overhead among the
    nodes and has to be kept to a minimum. How will data be decomposed and distributed
    for processing across the grid? Domains and sub-domains are created based upon
    analyses of the computational tasks that have to take place. Buffers are placed
    strategically for use when processes produce data that must be handed off to another
    process. The size, location and time holding data has to be carefully calculated.
    When not to buffer...


    Nodes will communicate among one another and within themselves between internal
    processes. Only data messages are passed and can be a significant source of latency
    and bandwidth problems if not handled strategically. The goal is to reduce communication
    overload a system and degrade transfer rates. Messages may be aggregated into
    buffers to reduce latency, however, as data buffering, decisions must be made
    as to how to arrange communication calls and aggregation. Some communication must
    go through immediately; some must wait for another to occur. When you synchronize,
    when not to synchronize...


    The computer science goal is to maximize performance across the grid network taking
    into account of all the variables in the context of the type of modeling and simulation
    being created. Get it wrong and your grid will not scale. In fact, if you get
    it wrong and increase your demands on the system, your system will degrade more
    and more rapidly. Definitely a task for computer scientists with both broad and
    deep understanding of all aspects of parallel system design.'
  merge: -1
  pgno: 246
