    a hospital and user only receives PII information that originated with their facility.


    Validation refers to the verification of credentials at the level not seen when
    we discussed field data and page level tracking and when data is submitted for
    a final Write to the database.


    Additional system security is accomplished by placing a firewall between the web
    and application servers. This accomplishes the task of separating the servers
    and ensuring that secure messaging takes place established ports between them.
    Both the front end server and the back application server will grow (i.e., add
    new servers) as use and data volume expands. Currently the load on the system
    is low because only a small number of hospitals are working with the database.
    However, as the CHND is more widely distributed, additional virtual servers can
