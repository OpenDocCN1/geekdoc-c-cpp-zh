    local and global earthquake phenomena have important commonalities. SCEC serves
    as an umbrella organization to help interested scientists and researchers around
    the world come together for the advancement of earthquake science. Southern California
    and its famous fault zones are a natural laboratory within which researchers participate
    collaborate and share information. By forming partnerships and collaborations,
    SCEC works towards a goal of creating a more accurate generic understanding of
    earthquake phenomena.


    The second item of the SCEC mission reflects their belief that applying principles
    of physics is key to developing accurate models and simulations of earthquake
    phenomena. Until recently, physics has not been fully utilized in earthquake systems
    science. Incorporating physics into model and simulation development, SCEC hopes
    to capture and model greater amounts and details of variables than has previously
    been possible. These data help answer puzzling questions as why and how earthquakes
    are amplified in sedimentary basins and why shaking sometimes off in unexpected
    directions.


    Helping society prepare for and reduce their risk from earthquakes is a large
    part of SCEC’s mission as reflected in the third item of their mission statement.
