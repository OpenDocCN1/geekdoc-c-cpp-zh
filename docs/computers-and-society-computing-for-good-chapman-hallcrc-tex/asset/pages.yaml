  md: '# Computers and society: Computing for good


    Earthquakes occur most often along faults, which are places where there is a break
    in the earth''s crust. There are different kinds of faults, but what they all
    have in common is that they occur when two blocks of the crust are moving one
    another in some way. The amount of movement of the blocks is known as the slip
    rate, but usually the blocks are locked together in a location somewhere along
    the fault. Stress on the fault increases and increases until it has been released
    so one block of crust can catch up with the movement of other. This release is
    often sudden and violent, sending shock waves through the earth. The behaviors
    of earthquakes are dynamic and emergent: continuous, unexpected, and with many
    interacting variables. Data continually moves out from the scientists'' feet (pun
    intended). To complicate matters, a fault often exists as part of a larger system
    of faults that are interconnected, or geographically close to one another. When
    one fault slips the release of stress in the rock spreads rapidly in many directions,
    and triggers additional earthquakes on other faults.


    To protect people and society in general from the dangers of earthquakes two of
    needs have to be addressed simultaneously: Practical Needs and Theoretical Science.
