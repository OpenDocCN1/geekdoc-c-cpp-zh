    # 5.12 The rationale for the architectural framework


    The architecture of a system, as defined by Martin Fowler (link in Appendix) can
    be thought of as the “core elements of the system, the pieces that are difficult
    to change. A foundation on which the rest can be built.” David Naas, lead developer
    and architect for this project, took this to his heart as he designed and implemented
    the architecture for the CHND. For many important reasons including ease of use,
    backwards browser compatibility and most important of all security, the software
    and hardware aside from the terminal Abstractor sat in front of had to reside
    at the CHCA in Kansas City. Fortunately, David had a road tested system to form
    the framework for this project.


    David Naas and built an earlier version of this system (in his spare time) years
    ago. He has used it as a base framework for many applications and domains. His
    architectural philosophy was to create a system for the long term. Thus, in creating
    a reusable architecture he created a generic group of classes, such as a group
    of utilities for encryption of user names, and for reading, writing, and updating
    data. When a project such as the CHND comes along the application specific modules
    are created and layered on top of this framework. The developers had to concentrate
    on the business use of the project. The only adjustment David had to make to his
    framework for the CHND was the addition of a few modules to validate specific
    data unique to this highly sensitive and protected information.


    David chose SQL Server 2008 as the underlying database product in part because
    the CHCA had extensive experience implementing it on other projects for their
    member hospitals. He knew well for them. A second reason for selecting SQL Server
    2008 was that it interfaces with the Microsoft .NET framework. Standards of communication
    between SQL Server, .NET and web browsers are well understood and widely implemented
    in many fields medicine. SQL Server 2008 supports objects and relations between
    objects, and it supports XML data structure and secure message passing . These
    features become important for anticipating future data requirements from medical
    terminology standardization. Medical standards and their models (see sidelines
    on HL7 and SNOMED-CT) use an object-based ontology. As EHR software vendors increasingly
    these standards database implementations such as the CHND may need to incorporate
    their structure. If that happens, David believes the CHND will be relatively easy
    to modify.


    David designed the user interface following a well known web design pattern known
    as the Model View Presenter (MVP). More specifically, he followed a sub-pattern
    called as the Supervisor Controller–MVC for short.'
