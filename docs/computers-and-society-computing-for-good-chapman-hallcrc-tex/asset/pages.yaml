- img_proc: true
  md: '# Computers and society: Computing for good


    probably quite familiar with this: Some thrive in a lecture environment, others
    prefer to read a book, and others just want to get their hands on the computer.
    These are examples of auditory, visual, and kinetic learning style preferences.
    According to the latest research, learning style preferences are at least partially
    in origin. Many "inventory instruments" have been created to assess people on
    dimensions of learning style preferences. A few of the more well inventories are
    listed in the Appendix.


    Learning style inventory results have sometimes misunderstood and interpreted
    in order to "label" or "categorize" people. It is critically important to emphasize
    that learning styles are "preferences" and not fixed traits. Although learning
    styles are likely to be genetically based to some extent, genetics is not fully
    deterministic. Research shows that early accuration may emphasize learning style
    over another. Starting at a young age, children adapt to succeed in their prevailing
    home and societal environments. Just because a person has preference for visual
    learning (e.g., reading) does not mean that they are unable to learn in an auditory
    environment (e.g., lecture). The more that teaching and learning address multiple
    learning style preferences, the easier it is to help students learn effectively
    and to enjoy learning.


    This is where the iPod touch comes in and one its potential in educational settings
    caught Margaret''s attention (Figure 7.1). Unlike a traditional book, lecture,
    or lab, a mobile device such as the iPod touch is inherently visual; it is inherently
    kinesthetic, it is designed to deliver high quality sound. With the growing sophistication
    of iPod devices, and their siblings, the iPad and iPhone, Margaret recognized
    that a well designed educational application could leverage many learning styles
    at once or be customized to emphasize one or another. In addition, through the
    family of Apple “i” mobile devices, decision makers choose the device that fits
    their users, their budget, and other needs and constraints.


    Before she knew, Margaret had “a ton of ideas.” She looked at what was currently
    being done in schools and therapy sessions and thought “we can do even better.”
    She began asking questions and looking for someone to take this cause. It had
    to be someone who was technically savvy, who understood pre-school and elementary
    education, pedagogical experience, and ideally, knowledge of the challenges of
    children with disabilities. Where was that person? That was the question she asked
    herself over and as she spoke with teachers, parents, therapists, friends, and
    professional colleagues. At some point it dawned on “it was ME! I have these skills!
    It’s ME!” The stage was set for becoming a software entrepreneur and business
    owner.'
