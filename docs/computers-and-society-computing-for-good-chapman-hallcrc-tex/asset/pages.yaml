  md: 'Chapter two: Improving patient care with digital image management


    # 2.15 Implementation: Migration and Go-Live


    Migration of legacy data into VNA is a highly structured process. All studies
    are considered for migration unless a specific reason is discovered not to. Therefore,
    a first task is to identify the studies that have already been migrated onto the
    VNA and exclude them from scheduled migration. For example, a user might access
    data from the VNA system through an ad hoc query/retrieval request. If they edit
    data that there is an inconsistency with the duplicate version on the legacy system.
    As older version is then migrated, it would override the newer, edited version.
    As another example, there may be data that is not going to be migrated at all.
    CHOP decided for the time they were not going to migrate any non-DICOM data because
    much of it was not non-standardized and inaccess locked up in the legacy vendor
    system.


    The second important step was described above: the data audit. Data audit is an
    example of the stages of the VNA project overlap. The process of data audit can
    be placed under both "VNA Implementation" and "Migration" because the initial
    investigation and discovery of type and volume of data take before any migration
    begins, the actual cleansing of any dirty image takes place automatically during
    migration when the software is processing the data "inline" and re-routes it from
    the legacy system.


    A migration schedule for CHOP was created with a goal of moving as quickly as
    possible, while not interfering with hospital routines (by overwhelming shared
    bandwidth for example) or compromising process integrity. CHOP scheduled migration
    to occur 24 hours a day 7 days a week; however, during the daytime migration was
    slowed to half speed so other activities affecting the MAS, such as enterprise
    backup processes, would not be impacted.


    Once the migration process was begun with little human intervention. Data was
    moved from the old to new system. During the migration, each image was moved separately,
    which is another way of saying that the migration occurs at the image level, as
    opposed to the data audit which takes place at the study level. Each image was
    checked dynamically by a data cleansing routine to determine if it fit the predetermined
    standards-based criteria for being clean. If the image and its metadata passed
    it was sent directly to the IBM GMAS. If it failed the "test" it was referred
    off to a part of the ACO system called a Tag Mapper to be cleaned and then sent
