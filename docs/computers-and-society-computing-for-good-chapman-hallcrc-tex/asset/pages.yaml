    of data points. Initially focused on west coast United States cities, the lessons
    learned be applied to many other cities around the world that are constructing
    high rise buildings.


    None of these successful outcomes could have happened without the contributions
    of computer scientists and computer science''s improvements in high performance
    computing. From the PC to the Supercomputer, to distributed clusters and dense
    grids, each advance in computing software and hardware allowed SCEC to implement
    and test its theories about earthquakes. Computer scientists and earthquake scientists
    push their mutual boundaries in tandem. As computer scientists push the boundaries
    of scientific computing and further, earthquake scientists can produce ever more
    detailed and immediately useful results. Conversely, the pressing needs of earthquake
    scientists push the imagination and creativity of computer scientists to look
    for new ways to effectively optimize multi-dimensional simulations on ever larger
    computing platforms.


