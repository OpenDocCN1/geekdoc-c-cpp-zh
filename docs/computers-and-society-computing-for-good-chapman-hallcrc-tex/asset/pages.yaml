  md: '# chapter four


    # # Social networking and computer modeling aid sea turtles


    # ## 4.0 Introduction


    This chapter is about how the oldest turtle conservation organization in the world
    is leveraging online communication media to reach out to its stakeholders, expand
    its activities and increase its overall public presence. In addition to having
    several well crafted websites, they strategically implement Facebook pages, a
    blog, YouTube videos and Twitter to reach audiences as diverse as young children,
    government officials and the general public. Not only do they know their media,
    they have a reputation for backing up their presentations with solid research
    data. Therefore, this chapter also includes a discussion of how computational
    models can be used to present complex information, containing many “unknowns,”
    in visual formats that are very easy to interpret. Working with limited staff
    and resources, the organization is using technology to build a community of active
    supporters and increase their effectiveness for the sea turtle cause.


    There are some unique characteristics of this chapter. For example, social networking
    are not always taken seriously as a tool for improving “the bottom line.” Computing
    disciplines in particular have sometimes overlooked the relevance of social networking
    for a professional computer scientist. This chapter profile demonstrates just
    how false perception can be. Like any technology, social networking media can
    be used well or poorly. In any case, a comprehensive strategy integrating the
    various social media in alignment with the environmental goals of the organization
    proves extremely powerful.


    With computer science skills you can understand how to leverage age media. Perhaps
    the most obvious and important skill is understanding user interface (UI) design.
    Online interfaces differ from media to audience to which you would be effective.
    One size does not fit all. In addition to coursework in UIs, graphics and multimedia
    classes are also helpful so that you have available at your fingertips the latest
    tools—and know how to use them properly.


    If you are not already well versed in social networking tools you need to become.
    As an active and alert user of blogs, Facebook (etc.) you'
