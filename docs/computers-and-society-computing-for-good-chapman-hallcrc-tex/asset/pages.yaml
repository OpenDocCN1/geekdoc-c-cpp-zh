  md: '# Chapter two: Improving patient care with digital image management


    As might be expected, the PACS vendors were not initially very excited about the
    VNA project. They were losing their position as the sole providers of computing
    systems for the management of medical digital images. However, when it became
    clear that not only was CHOP ahead with this project but other hospitals around
    the country were likely to follow, they found a way to leverage the situation
    to their benefit. Now they are able to advertise themselves as providing expertise
    in the development and cost of PACS and Enterprise Viewers that are being used
    in this new state of the art approach to image management.


    CHOP hospital administration is pleased with the project. Critically important
    from their perspective, investment in the project has paid off financially. According
    to Chris Tomlinson, CHOP has saved $3 million in five years. These are hard figures
    and projections, because the costs associated with maintenance and upgrade of
    the previous single vendor systems over fixed time periods were known, and the
    costs for the VNA system for the same period were also known. Thus, it was possible
    to make a direct comparison of cost savings. Future cost savings will be equally
    quantifiable for each “ology” that comes on board.


