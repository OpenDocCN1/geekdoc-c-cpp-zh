    The criteria for hospital membership in the CHNC reflect the focus of the partnership''s
    patient population. These criteria include the following, which will be explained
    after they are listed (Figure 5.1):


    +   - Having a Level IIIC neonatal care unit in a freestanding children''s hospital
    offering cardiothoracic surgical services and ECMO for patients admitted to their
    institution

    - At least 25 beds in the NICU

    - At least 400 annual patient admissions to the NICU

    - More than 50% outborn deliveries


    What does this mean?

    A freestanding children''s hospital is a hospital that treats solely pediatric
    patients and not a hospital that admits both children and adults. As described
    in the opening vignette, neonatal care unit is a unit within a hospital that specializes
    in treating critically ill newborn children. There are several levels of neonatal
    care units, providing an increasingly complex range of services. They are identified
    by the American Academy of Pediatrics (AAP) as Levels I, II or III. A Level III
    unit provides the most comprehensive and sophisticated levels of care and often
    has the few doctors in a region who are familiar with rare subspecialties. The
    most challenging patient cases are sent to children''s hospitals with Level III
    units. Typically these patients are extremely premature babies, or full term newborns
    who'
