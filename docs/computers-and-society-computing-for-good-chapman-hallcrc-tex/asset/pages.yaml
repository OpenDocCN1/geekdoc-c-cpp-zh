    # 4.9 A blog on the scene


    The word "blog" is short for the term "web log" but no one uses that term anymore.
    In the early days of blogging, it was common to see the word written as "blog"
    to indicate the short circuited phrase. Some early "blogs suffered from being
    nothing more than forums for bored people to talk about whatever came into their
    head—in essence the private journal for the whole world to read. As you might
    expect, since nothing on the Internet goes away forever (you can delete it, but
    that doesn''t mean it''s still archived in many places for the creative or accidental
    search to stumble upon), there were some embarrassing moments for bloggers.


    However, when used properly, a blog can generate an enormous fan for the blogger.
    It is well known in marketing and public relations circles that blogs are a great
    tool for community building. In fact, many organizations that workshops on how
    to effectively promote yourself or your organization strongly suggest that a blog
    is the first thing to create—perhaps even before a website. A blog allows the
    poster to write thought-provoking, informative, stimulating ideas and ask the
    world to engage in conversation with her and each other. An effective blogger
    posts blogs regularly and responds to audience comments. If the blogger is particularly
    effective, their blog will go viral and be picked up by news services and other
    online writers, who will then do much of the work for them of getting the word
    out and engaging the community. A blog is seen by a mass audience as not only
    engaging but as an authority on a subject, marketing efforts take on a life of
    their own.


    The Sea Turtle Conservancy started its blog as "Notes from the field," so people
    could follow the work they were doing in Tortugero, Costa Rica. Tortugero is not
    the only sea turtle nesting site the STC worked with, but it is still a central
    location for much of their conservation efforts in the Caribbean region. University
    students intern every summer, professional researchers work every year, and there
    is a STC-established public museum near the town. Tortugero was also one of the
    first places where the STC worked directly with a local population to develop
    sustainable alternatives to capturing and eating sea turtles and their eggs. There
    is a very interesting blog post about Tortugero and the origins of the STC listed
    in the Appendix if you want historical perspective on the sea turtle conservation
    movement in this part of the world.'
