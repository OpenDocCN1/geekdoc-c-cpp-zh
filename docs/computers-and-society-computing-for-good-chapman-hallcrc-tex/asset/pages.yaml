    The VON uses incidence of comorbidities as quality measures. There are several
    related definitions for comorbidity The common thread is that comorbid refers
    to two or more illness conditions that may exist in addition to an original diagnosis
    of disease.


    For example, Necrotizing Enterocolitis (NE) is a common comorbidity in premature
    infants or severely ill newborns. According to the National Institutes of Health,
    NE is the death of intestinal tissue. NE often occurs in a hospital setting but
    the cause is not clear. In addition to premature infants, those at high risk of
    NE include infants who are fed formula, infants in a nursery where an outbreak
    of NE has occurred and infants who have received blood exchange transfusions.
    VON maintains data on the occurrence of NE in a given birth weight range and demographic.
    Statistical information of this type is very beneficial because it provides an
    aggregate view of the occurrence of the medical condition.


    However, there are some factors that the VON has not designed to keep track of.
    The VON does not collect detailed information on newborns with congenital anomalies
    or metabolic disorders. This challenge manifests itself when statistics on occurrences
    of comorbidities are applied at the level of individual hospitals. The overall
    incidence rate of a condition as NE will naturally appear at children''s hospitals
    with advanced care (e.g., Level III) units. These statistics can incorrectly imply
    the hospitals have a problem. This perception is often misleading. Many cases
    of severe comorbidities appear at hospitals that have one of the lower levels
    of NICU. These hospitals transfer their most severe cases to medical centers that
    specialize in these conditions raising their incidence statistics. Without more
    detailed statistical information it can be difficult to evaluate the truth or
    falsity of individual hospital statistics, but to know what initiatives can reduce
    the rate of these rare conditions.


