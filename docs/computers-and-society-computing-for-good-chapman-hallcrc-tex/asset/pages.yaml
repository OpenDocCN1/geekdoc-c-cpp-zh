    # The changes as viewed by stakeholders


    So far, the radiologists who use the PACS Viewer are pleased with the results
    for several reasons. First, they are able to continue with the GUI they are most
    comfortable with. Second, they can choose which viewers they want to use because
    their viewers plug into the VNA system. The data migration process occurred without
    their having to aware of it. Studies were always available whether they had been
    migrated or not. Fourth, image and associated data retrieval has sped up noticeably,
    and they continue to have a rich tool of applications to work with.


    Non-diagnosticians, including physicians and other direct care providers who use
    the Enterprise Viewer, are similarly pleased. In addition to the reasons listed
    for the diagnosticians, they are pleased because they can look at images of patients
    through multiple images simultaneously or succession. They can access any other
    hospital computing systems they could previously access.


    Patients and their families are not consciously aware of all these changes, but
    they benefit from a more efficient system of working with doctors who in turn
    have more complete information obtained more rapidly. Grace, the mother with the
    pretty twins that we introduced at the start of this chapter, comes from a non-technical
    background (she is a social worker with interest in computing) but nonetheless
    has very positive comments about the digital imaging systems. She has to schedule
    frequent doctor visits for Ann and Timothy, squeezing them in constant therapy
    appointments and errands. The children are now toddlers and very active. Grace
    is often exhausted. Even so, she notices and is very pleased with what the physicians
    are able to show her online:


