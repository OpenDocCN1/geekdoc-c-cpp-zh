    # WHAT IS AUTISM AND WHAT ARE AUTISM SPECTRUM DISORDERS?


    The official definition of “An Autistic Disorder” used in the United States is
    found in the Diagnostic and Statistical Manual of Mental Disorders (the current
    volume is 4, with a Text Revision, hence the common acronym DSM-IV-TR). Britain
    uses a similar description. According to strict terminology, there is no “Autism”
    but a range of conditions known as Autism Spectrum Disorders (ASDs). They are
    listed as a sub-category of Pervasive Developmental Disorders (PDDs). There are
    competing viewpoints about what the causes of autism are and in some cases how
    it should be medically categorized and treated. Controversy can be heated between
    groups sharing a common goal of helping people with autism. Our discussion is
    agreed to adhere as closely as possible to the most widely accepted basic information.


    Two forms of ASDs are clearly genetic in origin: Rett Syndrome, which primarily
    affects females (one out of 10,000-15,000 females with ASD) and Childhood Disintegrative
    Disorder which primarily affects males (less than 2 out of 100,000 males with
    autism are generally believed by the research community to have a genetic origin,
    or to be the result of trauma or infection during early fetal development. Little
    is known about the causes of more common forms of ASDs. More is known about successful
    treatments than about causes. Currently, the treatments for autism include early
    identification and intense interventions at home and at school. Significant work
    is underway to improve scientific knowledge about the causes of autism.'
