    After an earthquake has passed, Seismic Hazard Analysis continues, incorporating
    information about the strength and distribution of strong motion, minute details
    of the aftershocks and the identification of areas that may be at short term risk
    of another event. Each iteration of this analysis cycle improves probabilities
    and predictions.


    To further matters, some aspects of earthquake behavior are almost universally
    accepted, while other aspects of earthquake behavior are supported by competing
    theories and seemingly contradictory data. Interactions between the factors discussed
    above (e.g., terrain, magnitude,) can be highly non-linear and scaling models
    and simulations to realistic proportions require immense resources and highly
    precise calculations. Thus, the choices of what data to model, how to model it,
    and what computing technology is most appropriate are not always clear.


    # EARTHQUAKE SCIENCE HAS SOME

    THINGS IN COMMON WITH AI


    Oddly enough, the progress of earthquake science has an interesting parallel with
    artificial intelligence. Forty years ago, in both fields, scientists felt that
    “answers” were just around the corner. Earthquake researchers believed short-term,
    event-specific earthquake prediction was imminent. Artificial intelligence researchers
    believed the creation of truly intelligent machines was imminent. Neither prediction
    has proven correct, and for very similar reasons. In both fields, the complexity
    of a natural system (the planet earth, the human mind) has proven far more intractable
    and immune to understanding than expected. Central to both earthquake and artificial
    intelligence research are the emergent behaviors that cause unpredictable results;
    modeling them and creating realistic simulations of them have become an elusive
    challenge. It is unclear if or when we will ever fully resolve these issues.'
