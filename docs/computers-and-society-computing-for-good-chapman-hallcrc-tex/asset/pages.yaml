- img_proc: true
  md: '# Introduction


    xiii


    lacks technical “meat” and reinforces the message that societal issues in computing
    are not a central part of “real computer science.” In the second case, students
    may receive an in-depth client project experience but do not learn about the breadth
    of opportunities available to them after graduation. This book addresses these
    issues by providing both breadth and depth of material, clearly placing it in
    the domain of the computing curriculum. By providing examples of professional
    opportunities where students can use their computing education to make the world
    a better place, this book demonstrates that no matter what area of computing and
    society interests them, there is a professional passion for them.


    Each chapter assumes technical knowledge in one or more areas of computing. Depending
    upon the focus of a computing program and the background of the students, some
    parts of the book may appear relatively easy to grasp and other parts quite challenging.
    Reviewers of early versions of this manuscript confirmed; their comments concerning
    the level of difficulty and appropriate placement of a course using this material
    directly reflected their own students background. However, as intended I set out
    to write this book, there was agreement that this is not a book for students who
    lack a computing background. The material in these profiles balances the expectation
    that students have exposure to topics covered in the first few years of a computing
    curriculum with programs vary, and therefore some technical explanations are needed.


    For students with less technical preparation, sufficient information is given
    such that the upper division should be able to follow the conversation well. For
    the student who has greater technical preparation or is interested in additional
    depth, sidebars are liberally spread throughout each chapter. This pedagogical
    technique allows the student who wants additional material to have it, and the
    student who does not want or need material to skip over it. If the reader decides
    to skip every single chapter the primary technical and societal objectives of
    each chapter will still be met.


    # Layout of the book


    Each chapter begins with a short introduction for the student. This introduction
    provides an overview of the profile topic (technical and societal), the main home
    points, and the computing skills needed for a project such as the one they are
    about to read. Next, the introduction provides a similar short discussion of the
    relevant non-technical skills and interests students would bring to professional
    work in this area. The intent of this section is to orient the student by providing
    her or him with a profile context and an answer to this question: “What can I
    do with the information I am about to read?”'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    The end of each chapter has an exercises and activities section with questions
    designed to encourage the student engage actively and critically with the material
    in the chapter. None of the questions involve rote memorization or regurgitation
    of material. They vary in difficulty, share a common approach of asking the students
    to stretch their thinking, apply the material to themselves or their surroundings,
    and think critically about the material from the perspective of a future computing
    professional. The exercises and activities section includes not only relatively
    straightforward questions, but a variety of projects suitable with greater or
    lesser preparation. Pedagogical projects include individual projects, team projects,
    short projects and projects that could easily become term projects. The instructor
    has choices and can select the question(s) that fit best with how they decide
    to integrate the chapter material into their courses. supplemental sidebars are
    likewise varied; some contain general interest, some are moderately technical,
    some are highly technical; a few are tangential but provoking.


    Chapter 1 showcases a successful poverty alleviation project that takes place
    in the Peruvian Andes. In some ways this is a “classic” case study, the most people
    assume I am talking about when I investigate socially beneficial uses of computing.
    For this reason I placed it first in the book. However, there is an important
    twist to this story, which is not the one I placed. To ensure a successful outcome
    the computer scientists had to use highly unusual methods of software engineering—unusual
    to that is them. The most critical factor in the success of this project was not
    technical. Success relied on their adapting to the culture and customs of the
    local population alien this felt.


    Chapter 2 is the first of two chapters about computing and healthcare. Science-oriented
    students consider a career in medicine; this appears particularly true for women
    and other underrepresented groups. As luck would have it, the intersection of
    computing and medicine is an exploding field with endless exciting professional
    opportunities for students. This chapter delivers to digital image management
    and storage, and how a visionary hospital administrator partnered with a high
    tech team to overhaul a system that no longer served needs. This is cutting-edge
    material in this profile about data access in very large scale complex projects,
    and challenges in electronic standards development. This project shows teamwork
    at its best, ensuring that internationally renowned hospital completed a year-long
    system overhaul compromising patient care.


    Chapter 3 is by far the most controversial chapter. This came as a surprise, but
    caused me to appreciate the project and the people who saw it through even more.
    The topic is Internet voting. The technical issues revolve around security of
    highly sensitive data (how people vote in an election). It will become clear to
    the reader that difficult choices have to'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    xv



    nbe made when designing network security projects. Philosophical differences drive
    the debate on Internet voting among computer scientists. This project demonstrates
    that Internet voting can be implemented well and enable American citizens to vote
    who previously had difficulty voting. Computing students reading this chapter
    will be challenged to form their own technical opinions about how and when to
    use the Internet for routing highly sensitive data.


    Chapter 4 tackles a so-called "soft topic"—the skillful use of social media and
    social networking. In this profile we meet a nonprofit organization that leverages
    social media to advance the cause of protecting endangered sea turtles. This chapter
    demonstrates that it takes solid computing skills to use the entire range of social
    media effectively, in areas such as user interface design and creating data-driven
    descriptive models. One of the curricular attractions to me this profile is that
    it debunks any perception that working as a user of social networking cannot be
    "real computer science."


    Chapter 5 is the second profile on computing and medicine. This project is quite
    different from the profile about digital imaging. A team of physicians works closely
    with a children''s healthcare company to develop a database for collecting, tracking
    and analyzing data on rare conditions in newborns. Their mutual goal is to aggregate
    information for best practice recommendations. This chapter, more than any other,
    discusses the daily challenges of running a highly complex software project on
    a very tight deadline. The computer scientists on this interdisciplinary team
    were willing (in fact asked asked me if they) could share information about "lessons
    learned." As an added bonus to students interested in the medical field, this
