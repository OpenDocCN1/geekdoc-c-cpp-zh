  md: '# Chapter five: Best practice recommendations in children''s medical care


    a wide array of special therapies and medications to treat this condition.


    The diaphragm is a muscle important for breathing that separates the chest from
    the abdomen. A baby with diaphragmatic hernia has a birth defect where there is
    a hole in the diaphragm muscle. The contents of the abdomen, like the intestines,
    stomach or liver, may rise into the chest and prevent proper growth of the lungs.
    At one point in time it was common practice to perform surgery immediately after
    repair the hole in the diaphragm (sometimes with a patch) and return the abdominal
    organs to their proper place. Advances in medical knowledge indicate immediate
    surgery may not always be the best practice because of complications seen in babies
    with diaphragmatic hernia. For example, problems with lung development and elevated
    blood pressure in the lungs are common in this population and may result in an
    affected baby requiring a procedure called ECMO (Extracorporeal Membrane Oxygenation)
    which is pumped out of the body through catheters in the neck, allowing gas exchange
    to occur in a machine while bypassing the baby''s heart and lungs. ECMO is very
    invasive, physically traumatic and may be associated with serious complications.
    Surgical repair of the diaphragm is also traumatic, making the decision about
    what procedures to perform more difficult. If a baby''s lungs collapse or severe
    elevation of blood pressure in the lungs occurs, an already life threatening situation
    becomes even worse. On the other hand, a misplaced bowel due to an unrepaired
    diaphragm may interfere with other critical bodily functions.


    Thus pediatric surgeons prefer to perform the diaphragmatic hernia repair while
    the baby is on ECMO, some prefer to perform the surgery shortly after removing
    a baby from ECMO and some prefer to wait a period of time after removal in hopes
    that the lungs will be stronger. There is no one right answer because so many
    variables affect the short and long term outcomes. Each surgical option has its
    risks as well as benefits. Surgeons and neonatologists rely upon their training
    and personal'
