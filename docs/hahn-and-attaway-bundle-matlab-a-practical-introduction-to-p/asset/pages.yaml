  md: '>> help sym/int


    For example, to find the indefinite integral of the function f(x) = 3x² - 1:


    ```

    >> syms x

    >> int(3*x^2 - 1)

    ans =

    x^3-x

    ```


    Instead, to find the definite integral of this function from x = 2 to x = 4:


    ```

    >> int(3*x^2 - 1, 2, 4)

    ans =

    54

    ```


    Limits can be found using the limit function; for example, for the difference
    equation described previously:


    ```

    >> syms x h

    >> f

    f = @ (x) x .^3 + 2 .x*.^2 - 4 .* x + 3

    >> limit((f(x+h)-f(x))/h,0)

    ans =\3*x^2-4+4*x

    ```


    To differentiate, instead of the anonymous function we write it symbolically:


    ```

    >> syms x f

    >> f = x^3 + 2*x^2 - 4*x

    >> diff(f)

    ans =

    3*x^2-4+4*x

    ```


