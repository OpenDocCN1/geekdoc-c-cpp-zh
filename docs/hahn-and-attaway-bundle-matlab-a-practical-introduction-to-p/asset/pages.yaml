  md: '# Selection Statements


    # KEY WORDS


    +   - selection statement

    - branching statement

    - condition

    - Boolean expression

    - relational expression

    - logical expression


    +   - action

    - temporary variable

    - logical true

    - logical false

    - relational operator

    - logical operator


    +   - truth table

    - nesting if-else statement

    - cascading if-else statement

    - is function


    # CONTENTS


    +   3.1 Relational Expressions .............. 80


    +   3.2 The If Statement .............. 82


    +   3.3 The If-Else Statement .............. 87


    +   3.4 Nested If-Else Statement ........ 88


    +   3.5 The Switch Statement .............. 93


    +   3.6 The Function .............. 96


    +   3.7 Is Functions in MATLAB .............. 98


    So far, in the scripts and functions we''ve seen, every statement was executed
    in sequence. That is not always desired, and in this section we will see how to
    make choices as to whether statements are executed or not, and how to choose between
    among them. The statements that accomplish this are called *selection* or *branching*
    statements.


    The MATLAB software has two basic statements that allow: the *if* statement and
    the *switch* statement. The if statement has optional *else* and *elseif* clauses
    for branching. The *if* statement uses expressions that are logically true or
    false. These expressions use relational and logical operators. MATLAB also has
    functions that ask whether something is true or false; these functions will be
    covered at the end of this chapter.'
  merge: -1
