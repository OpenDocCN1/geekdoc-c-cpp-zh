  md: '# 3.1 RELATIONAL EXPRESSIONS


    Conditions in if statements use expressions that are conceptually, or logically,
    either true or false. These expressions are called relational expressions, or
    some-Boolean or logical expressions. These expressions can use both relational
    operators, which relate two expressions of compatible types, and logical operators,
    which operate on logical operands.


    The relational operators in MATLAB are:


    | Operator | Meaning |

    |---|---|n| > | greater than |

    | < | less than |

    | >= | greater than or equals |

    | <= | less than or equals |

    | == | equality |

    | ~= | inequality |


    All concepts should be familiar, although the operators used may be different
    from those used in other programming languages, or in mathematics classes. In
    particular, it is important to note that the operator for equality is consecutive
    signs, not a single equal sign (recall that the single equal sign is the assignment
    operator).


    For numerical operands, the use of these operators is straightforward. For example,
    3 < 5 means "3 less than 5," which is conceptually a true expression. However,
    in MATLAB, as in many programming languages, logical true is represented by the
    integer 1, and logical false is represented by the integer 0. So, the expression
    3 < 5 actually has the value 1 in MATLAB. Displaying the result of expressions
    like this in the Command Window demonstrates the values of expressions.


    ```

    >> 3 < 5

    ans =

    1

    >> 9 < 2

    ans =

    0

    ```


    However, in the Workspace Window, the value shown for the result of these expressions
    would be true or false. The type of the result is logical.


    Mathematical operations could be performed on the resulting 1 or 0.


    ```

    >> 5 < 7

    ans =

    1

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: '```

    >> ans + 3

    ans =

    4

    ```


    Comparing characters, for example ''a'' < ''c'', is also possible. Characters
    are compared using their ASCII equivalent values. So, ''a'' < ''c'' is conceptually
    a true expression, because the character ''a'' comes before the character ''c''.


    ```

    >> ''a'' < ''c''

    ans =

    1

    ```


    The logical operators are:


    | Operator | Meaning |

    |---|---|

    | || | or for scalars |

    | && | and for scalars |


    All logical operators operate on logical or Boolean operands. The **not** operator
    is a unary operator; the others are. The **not** operator will take a Boolean
    expression, which is conceptually true or false, and give the opposite value.
    For example, ~(3 < 5) is conceptually false since (3 < 5) is true. The **or**
    operator operates two Boolean expressions as operands. The result is true if either
    of the operands are true, and false only if both operands are true. The **and**
    operator also operates on two Boolean operands. The result of an **and** expression
    is true only if both operands are true; it is false if either or both are false.


    In addition to these logical operators, MATLAB has a function *xor*, which is
    the exclusive or function. It returns logical if one (and only one) of the arguments
    is true. For example, in the following only the first argument is true, the result
    is true:


    ```

    >> xor(3 < 5, ''a'' > ''c'')nans =

    1

    ```


    In this example, both arguments are true so the result is false:


    ```

    >> xor(3 < 5, ''a'' < ''c'')\ans =

    0

    ```


    The logical values of true and false in variables x and y, the *truth table* Table
    3.1) shows how the logical operators work for all combinations. Note that the
    logical operators are commutative (e.g., x || y is the same as y || x).'
