  md: '# SUMMARY


    # Common Pitfalls


    +   - Not matching up arguments in a function call with the input arguments in
    a function header

    - Not having enough variables in an assignment statement to store all the values
    returned by a function through the output arguments

    - Attempting to call a function that does not return a value from an assignment
    statement, or from an output statement

    - Not using the same name for the function and the file in which it is stored

    - Not thoroughly testing functions for all possible inputs and outputs

    - Forgetting that persistent variables are updated every time the function in
    which they are declared is called, whether from a script or the Command Window


    # Programming Style Guidelines


    +   - If a function is calculating one or more values, return these value(s) from
    the function by assigning them to output variable(s).

    - Give the function and the file in which it is stored the same name.

    - Function headers and calls must correspond. The number of arguments passed to
    a function must be the same as the number of input arguments in the function header.
    If the function returns values, the number of variables in the left-hand side
    of an assignment statement should match the number of output arguments returned
    by the function.

    - If arguments are passed to the function in the function call, do not replace
    these values by using input in the function itself.

    - Functions that calculate and return value(s) will not normally also print them.

    - Functions should not normally be longer than one page in length.

    - Do not declare variables in the Command Window and use them in a script, or
    vice versa.

    - Pass all values to be used in functions to input arguments in the functions.

    - When writing large programs with many functions, start with the main program
    script and use function stubs, filling in one function at a time while debugging.'
