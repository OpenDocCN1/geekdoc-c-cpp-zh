  md: "# 3.3 THE IF-ELSE STATEMENT\n\nThe if statement chooses whether an action is\
    \ executed or not. Choosing between two actions, or choosing from several actions,\
    \ is accomplished using if-else, nested if, and switch statements.\n\nThe if-else\
    \ statement is used to choose between two statements, or sets of state-ments.\
    \ The general form is:\n\n```\nif condition\n    action1\nelse\n    action2\n\
    ```\n\nFirst, the condition is evaluated. If it is conceptually true, then the\
    \ set of statements designated action1 is executed, and that is for the if-else\
    \ statement. Instead the condition is conceptually false, the second set of statements\
    \ designated action2 is executed, and that's it. The first set of statements is\
    \ called the action of the if clause; it will be executed if the expression is\
    \ true. The second set of statements is called the action of the else clause;\
    \ it will be executed if the expression is false. One of these actions, and only\
    \ one, will be executed—which depends on the value of the condition.\n\nFor example,\
    \ to determine and print whether or not a random number in the range 0 to 1 is\
    \ less than 0.5, an if-else statement could be used:\n\n```\nif rand < 0.5\n \
    \   disp('It was less than .5!')\nelse\n    disp('It was not less than .5!')\n\
    ```\n\nOne application of an if-else statement is to check for errors in the inputs\
    \ to a script. For example, an earlier script prompted the user for a radius,\
    \ and then used to calculate the area of a circle. However, it did not check to\
    \ make sure that the radius was valid (e.g., a positive number). Here is a modified\
    \ script that checks the radius:\n\n# PRACTICE 3.3\n\nWrite a script printsindegorrad\
    \ for an angle:\n\n+   - Prompt the user for an angle.\n- Prompt the user for\
    \ (r)adians or (d)egrees, with radians as default.\n- Use the sin function to\
