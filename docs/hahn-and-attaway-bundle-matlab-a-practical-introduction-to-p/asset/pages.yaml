    to the function, as it is a cell array with the plot type names. The function
    generates the Figure Window using the cell array with the plot type names. It
    creates a handle for each using the **str2func** function.


    ```

    plotwithcell.m

    function plotwithcell(y, rca)

    % Shows different plot types, passed as a cell array

    lenrca = length(rca)

    for i = 1:lenrca

