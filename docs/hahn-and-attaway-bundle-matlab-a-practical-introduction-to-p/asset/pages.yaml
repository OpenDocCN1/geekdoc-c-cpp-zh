    # 1.2.1 Initializing, Incrementing, and Decrementing


    Frequently, values of variables change. Putting the first or initial value in
    a variable is called *initializing* the variable.


    Adding to a variable is called *incrementing*. For example, the statement *mynum
    = mynum + 1* increments the variable *mynum* by 1.


    # QUICK QUESTION!


    How can 1 be subtracted from the value of a variable called *num*?

    Answer: num = num - 1;

    This is called *decrementing* the variable.


