  md: "```\nfunction outmat = multtable (rows, columns)\n% Creates a matrix which\
    \ is a multiplication table\n\n% Preallocate the matrix\noutmat = zeros(rows,columns);\n\
    for i = 1:rows\n  for j = 1:columns\n    outmat(i,j) = i * j;\n  end\nend\n```\n\
    \nIn this example, the matrix has three rows and five columns:\n\n```\n>> multtable(3,5)\n\
    ans =\n  1  2  3  4  5\n  2  4  6  8 10\n  3  6  9 12 15\n```\n\nNotice that this\
    \ is a function that returns a matrix; it does not print anything. It preallocates\
    \ the matrix to zeros, and then replaces each element. Since the number of rows\
    \ and columns are equal, the for loops work. The outer loop loops over the rows,\
    \ and the inner loops over the columns. The action of the nested loop calculates\
    \ i*j for all values of i and j. First, when i has the value 1, it iterates through\
    \ the values 1 through 5, so we first calculating 1*1, then 1*2, then 1*3, then\
    \ 1*4, and finally 1*5. These are the values in the first row (first in (1,1),\
    \ (1,2), then (1,3), (1,4), and (1,5)). Then, when i has the value 2, the elements\
    \ in the second row of the output are calculated, as j iterates through the values\
    \ from 1 through 5. Finally, when i has the value 3, the values in the third row\
    \ are calculated (3*1, 3*2, 3*3, 3*4, and 3*5).\n\nThis function could be used\
    \ in a script that prompts the user for the number of rows and columns, calls\
    \ this to return a multiplication table, and writes the resulting matrix to a\
    \ file:\n\n```\ncreatemulttab.m\n% Prompt the user for rows and columns\n% create\
    \ a multiplication table to store in\n% a file mymulttable.dat\n```\n\n(Continued)"
