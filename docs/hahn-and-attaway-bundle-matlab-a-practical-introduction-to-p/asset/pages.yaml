    # 14.2 COMPLEX NUMBERS


    A complex number is generally written in the form

    z = a + bi


    where a is the real part of the z, b is the imaginary part of z, and i is √1.
    This is the way mathematicians usually write a complex number, and in engineering
    it is often written as a + bj, where j is √1. A complex number is purely imaginary
    if it is of the form z = bi (in other words, if a is 0).


    We have seen that in MATLAB both i and j are built-in functions √1 (so they can
    be thought of as built-in constants). Complex numbers can be created using i or
    j, for example, 5 + 2i or 3 - 4j. The multiplication operator is not required
    between the value of the imaginary part and the constant i or j.


    # QUICK QUESTION!


    Is the value of the expression 3i the same as 3 i?

    Answer: It depends on whether i has been used as a variable name or not. If i
    has been used as a variable (for example, an iterator in a for loop), then the
    expression 3 *i will use the defined value for the variable, and will not be a
    complex number. Therefore, it is a good idea when working with complex numbers
    to use il or ij rather than just i or j. The expressions il and ij always result
    in a complex number, regardless of whether i or j have been used as a variable.


    ```

    >> i = 5;

    >> i

    i =\5

    ans =

    0 + 1.0000i

    ```


    MATLAB also has a function complex that will return a complex number. It receives
    two numbers, the real and imaginary parts in order, or just one number, which
    would be the real part (so the imaginary part would be 0). Here are some examples
    of creating complex numbers in MATLAB:'
