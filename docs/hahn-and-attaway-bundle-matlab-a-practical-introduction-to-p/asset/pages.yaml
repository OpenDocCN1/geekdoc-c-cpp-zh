  md: '# 2.7 USER-DEFINED FUNCTIONS THAT RETURN A SINGLE VALUE


    We have already seen the use of many functions in MATLAB. We have used many built-in
    functions as sin, fix, abs, double, and so on. In this section, user-defined functions
    will be introduced. These are functions that the programmer defines, and then
    uses, in either the Command Window or in a script.


    Functions return different types of results. For now, we will concentrate on the
    kind of function that calculates and returns a single result, much like built-in
    functions such as sin and abs. Other types of functions will be introduced in
    Chapter 5.


    First, let us review of what we already know about functions, including the use
    of built-in functions. Although the use of these functions is straightforward
    by now, explanations will be given in detail here in order to compare and contrast
    the use of user-defined functions.


    The length function is an example of a built-in function that calculates a single
    value; it returns the length of a vector. As an example,


    ```

    length(vec)

    ```


    is an expression; it represents the number of elements in the vector vec. This
    expression could be used in the Command Window or in a script. Typically, the
    value returned from this expression might be assigned to a variable:


    ```

    >> vec = 1:3:10;

    >> lv = length(vec)

    lv =

    4

    ```


    Alternatively, the length of the vector can be printed


    ```

    >> fprintf(''The length of the vector is %d\n'', length(vec))

    The length of the vector is 4

    ```


    The call to the length function consists of the name of the function, followed
    by the argument in parentheses. This function takes the argument, and returns
    a result. What happens when the call to the function is encountered is control
    is passed to the function itself (in other words, the function begins executing).
    The argument(s) are also passed to the function. The function executes its statements
    and does whatever (the actual contents of the built-in functions are not generally
    known or seen by the programmer) in order to determine the number of elements
    in the vector. Since the function is calculating a single value, this result is
    returned, and it becomes the value of the expression. Control is also passed back
    to the expression that called it in the first'
