  md: 'find the sum and/product of the elements in a vector, regardless of what those
    values might be. For example, we will write a function to sum all the elements
    in a vector.


    # The Programming Concept


    The vector is passed as an argument to the function. The function loops through
    all the elements of the vector, from 1 to the length of the vector, to add all
    to the running sum.


    ```

    myvecsum.m

    function outarg = myvecsum(vec)

    % This function sums the elements in a vector

    outarg = 0;

    for i = 1:length(vec)

    outarg = outarg + vec(i);

    end

    ```


    Any vector could be passed to this function; for example, just specifying values
    in square brackets:


    ```

    >> myvecsum([5 9 4])

    ans =

    18

    ```


