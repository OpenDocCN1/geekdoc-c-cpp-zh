    # 11.2.2 Gauss, Gauss-Jordan Elimination


    For $2 \times 2$ systems of equations, there are well-defined, simple solution
    methods. However, for larger systems of equations, finding solutions is frequently
    not as straightforward.


    Two related methods of solving systems of linear equations will be described here:
    Gauss elimination, and Gauss-Jordan elimination. They are both based on the observation
    that systems of equations are equivalent if they have the same solution. Also,
    performing simple operations on the rows of a matrix, called Elementary Row Operations
    (EROs), result in equivalent systems. These fall into three categories:


    +   1. Replacement: replace a row by adding to it (or subtracting from it) a multiple
    of another row. For a given row $r_i$, it is written as

    $$r_i \leftarrow S_i \rightarrow r_i$$


    Now when replacing row $r_i$, nothing is multiplied by it. Instead, $r_i$ is multiplied
    by a scalar $s$ (which could be a fraction) and is added to or subtracted from
    row $r_i$.


    +   2. Interchanging rows: for example interchanging rows $r_i$ and $r_j$ are
    written as

    $$r_i \leftrightarrow r_j$$


    +   3. Scaling: changes a row by multiplying it by a nonzero scalar $sr_i \rightarrow
    r_i$


    For example, for the matrix:


    | 4 | 2 | 3 |

    | 1 | 4 | 0 |

    | 2 | 5 | 3 |


    An example of interchanging rows would be $r_1 \leftrightarrow r_2$, which would
    yield:


    | 2 | 5 | 3 |

    | 1 | 4 | 0 |

    | 4 | 2 | 3 |


    Now, starting with this matrix, an example of scaling would be: $2r_2 \rightarrow
    r_2$, which means all elements in row 2 are multiplied by 2. This yields:


    | 2 | 5 | 3 |

    | 1 | 4 | 0 |

    | 4 | 2 | 3 |'
