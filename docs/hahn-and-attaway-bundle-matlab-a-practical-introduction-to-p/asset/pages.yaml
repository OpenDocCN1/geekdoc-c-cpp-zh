    \ repeat the prompt until the user finally enters a positive number.\n\n```\n\
    readenum.m\n\n# Loop until the user enters a positive number\ninputnum=input('Enter\
    \ a positive number: ')\nwhile inputnum < 0\n    inputnum = input('Invalid! Enter\
