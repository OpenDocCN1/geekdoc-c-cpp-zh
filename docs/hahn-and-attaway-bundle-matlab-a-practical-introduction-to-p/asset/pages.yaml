    #  12.4 INDEXING


    Indexing is an alternative to sorting a vector. With indexing, the vector is left
    in its original order. An index vector is used to point to the values in the original
    vector in the desired order.


    For example, for a vector of exam grades:


    | 1 | 2 | 3 | 4 | 5 | 6 |

    | 85 | 70 | 100 | 95 | 80 | 91 |


    In ascending order, the lowest grade is element 2, the next lowest is element
    5, and so on. The index vector *grade_index* gives this order:


    | 1 | 2 | 3 | 4 | 5 | 6 |

    | 2 | 5 | 1 | 6 | 4 | 3 |


    The index vector is used as the indices for the original vector. To get *grades*
    in ascending order, the indices used are *grades(2)*, *grades(5)*, and so on.
    Using the indexvector to accomplish this, *grades(grade_index(1))* would be the
    lowest grade, 70, and *grades(grade_index(2))* would be the second lowest grade.
    In general, *grades(grade_index(i))* would be the $i^{th}$ lowest grade.


    To create these in MATLAB:


    ```

    >> grades = [85 70 100 95 80 91];

    >> grade_index = [2 5 1 6 4 3];

    >> grades(grade_index)

    ans =

    70 80 85 91 95 100

    ```'
