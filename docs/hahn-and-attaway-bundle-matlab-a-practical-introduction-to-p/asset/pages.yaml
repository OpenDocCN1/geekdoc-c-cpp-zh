  md: 'method. It is much more efficient, if the size is known ahead of time, to preallocate-the
    array. For cell arrays, this is done with the cell function. For example, to preallocate
    a variable mycellmat to be a 2 × 2 cell array, the cell function would be called
    as follows:


    ```

    >> mycellmat = cell(2,2)

    mycellmat = [] [] []

    ```


    Note that this is a function call so the arguments to the function are in parentheses.
    This creates a matrix in which all the elements are empty vectors. Then, each
    element can be replaced by the desired value. How to refer to each element in
    order to accomplish this will be explained next.


    # 7.1.1.1 Referring to and Displaying Cell Array Elements and Attributes


    Just as with the other vectors we have seen so far, we refer to individual elements
    of cell arrays. The only difference is that curly braces are used for scripts.
    For example, this refers to the second element of the cell array cellrowvec:


    ```

    >> cellrowvec(2)

    ans = a

    ```


    Row and column indices are used to refer to an element in a matrix (again using
    curly braces), for example:


    ```

    >> cellmat(1,1)

    ans = 23

    ```


    Values can be assigned to cell array elements. For example, after preallocating
    the variable mycellmat in the previous section, the elements can be initialized:


    ```

    >> mycellmat(1,1) = 23

    mycellmat = [] []

    ```


    When an element of a cell array is itself a data structure, only the type of the
    element is displayed when the cell array contents are shown. For example, in the
    cell arrays just created, the vector is shown as just 1 × 5 double. Referring
    to that element specifically would display its contents, for example:


    ```

    >> cellmat(2,1)

    ans = 1 3 5 7 9

    ```'
