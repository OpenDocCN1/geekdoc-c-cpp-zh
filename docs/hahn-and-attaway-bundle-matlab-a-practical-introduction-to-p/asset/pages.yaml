  md: 'use of anonymous functions reduces the number of M-files necessary for a program.
    Anonymous functions can be created in the Command Window or in any script. The
    syntax for an anonymous function is:


    ```

    fnhandle = @ (arguments) functionbody

    ```


    where fnhandle stores the function handle; it is essentially a way of referring
    to the function. The handle is assigned to this name using the @ operator. The
    arguments, in parentheses, correspond to the argument(s) that are passed to the
    function, just like any other kind of function. The functionbody is the body of
    the function, which is any valid MATLAB expression. For example, here is an anonymous
    function that calculates and returns the area of a circle:


    ```

    >> cirarea = @ (radius) pi * radius ^2;

    ```


    The function handle name is cirarea. One argument is passed to the input radius.
    The body of the function is the expression * radius.^2. The ^ operator is used
    so that a vector of radius can be passed to the function.


    The function is then called using the handle and passing arguments to it. The
    function call using the function handle looks just like a function call using
    a function name:


    ```

    >> cirarea(4)

    ans =

    50.2655

    >> cirarea(1:4)

    ans =\3.1416 12.5664 28.2743 50.2655

    ```


    Unlike functions stored in M-files, if no argument is passed to an anonymous function,
    the parentheses must still be in the function definition and in the function call.
    For example, here is an anonymous function that prints a random number with two
    decimal places, as well as a call to this function:


    ```

    >> prtan = @ () fprintf(''.2f\f\n'',rand);

    >> prtan()

    0.95

    ```


    Typing the name of the function handle will display its contents, which is the
    function definition.


    ```

    >> prtan

    prtan =

    () fprintf(''.2f\f\n'',rand).

    ```'
