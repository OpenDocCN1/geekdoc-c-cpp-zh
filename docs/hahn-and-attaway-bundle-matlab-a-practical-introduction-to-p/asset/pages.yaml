    # 1.2 VARIABLES AND ASSIGNMENT STATEMENTS


    In order to store a value in a MATLAB session, or in a program, a variable is
    used. The Workspace Window shows variables that have been created. One easy to
    create a variable is to use an assignment statement. The format of an assignment
    statement is


    ```

    variablename = expression

    ```


    The variable is always on the left, followed by the assignment operator, = (unlike
    in mathematics, the single equal sign does not mean equality), followed by an
    expression. The expression is evaluated and then value is stored in the variable.
    For example, this is the way it would appear in the Command Window:


    ```

    > mynum = 6

    mynum =

    6

    ```


    Here, the user (the person working in MATLAB) typed mynum = 6 at the prompt, and
    MATLAB stored the integer 6 in the variable called mynum, and then displayed the
    result followed by the prompt again. Since the equal sign is the assignment operator,
    and does not mean equality, the statement should be read as “mynum gets the value
    of 6” (not “mynum equals 6”).


    Note that the variable name must always be on the left, and the expression on
    the right. An error will occur if these are reversed.


    ```

    >> 6 = mynum

    ??? 6 = mynum

    |

    Error: The expression to the left of the equals sign is not

    a valid target for an assignment.

    >>

    ```


    Putting a semicolon at the end of a statement suppresses the output. For example,'
  merge: -1
