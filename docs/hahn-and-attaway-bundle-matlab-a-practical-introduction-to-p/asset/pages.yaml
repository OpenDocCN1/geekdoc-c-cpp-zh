    #  12.6 Polar Form


    Any complex number z = a + bi can be thought of as a point (a,b) or vector in
    a complex plane in which the horizontal axis is the real part of z, and the vertical
    axis is the imaginary part of z. So, a and b are the Cartesian and rectangular
    coordinates. Since a vector can be represented by its rectangular or polar coordinates,
    a complex number can also be given by its polar coordinates r and θ, where r is
    the magnitude of the vector and θ is an angle.


    To convert from the polar coordinates to the rectangular coordinates:


    ```

    a = r cos θ

    b = r sin θ

    ```


    To convert from the rectangular to the polar coordinates:


    ```

    r=|z| = \sqrt{a^2+b^2}

    r = arctan(b/a)

    ```


    So, a complex number z = a + bi can be written as r cos θ + (r sin θ)i, or


    ```

    z = r (cos θ + i sin θ)

    ```


    Since ew = cos θ + i sin θ, a complex number can also be written as z = re^{iw}.
    In MATLAB, r can be found using the abs function, and there is a special built-in
    function to find θ, called angle.


    ```

    >> zl = 3 + 4i;

    r = abs(zl)

    r = 5

    >> theta = angle(zl)

    theta = 0.9273

    >> r*exp(i*theta)

    ans = 3.0000 + 4.0000i

    ```


