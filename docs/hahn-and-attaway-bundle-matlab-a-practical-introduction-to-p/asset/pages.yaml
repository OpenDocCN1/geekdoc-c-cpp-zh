    # 6.2.6 Finding, Replacing, and Separating Strings


    There are several functions that find and replace strings, or parts of strings,
    within other strings and functions that separate strings into substrings.


    The function findstr receives two strings as input. It finds all occurrences of
    the shorter string within the longer, and returns the subscripts of the beginning
    of the occurrences. The order of the strings does not matter with findstr; it
    will always find the string within the longer, whichever that is. The shorter
    string can consist of one character, or any number of characters. If there is
    more than one occurrence of the shorter string within the longer one, findstr
    returns a vector with all indices. Note that what is returned is the index of
    the beginning of the shorter string.


    ```

    >> findstr(''abcd'', ''d'')

    =

    4

    ```


    ```

    >> findstr(''d'', ''abcd'')

    =

    4

    ```


    ```

    >> findstr(''abcd'', ''bc'')

    =

    2

    ```


    ```

    >> findstr(''abcdeabcdded'', ''d'')

    =

