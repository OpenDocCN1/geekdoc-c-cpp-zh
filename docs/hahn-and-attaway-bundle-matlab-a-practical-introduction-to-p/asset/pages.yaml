  md: '# 1.3 Expressions


    To call function, the name of the function is given by the argument(s) that are
    passed to the function in parentheses. Most functions then return value(s). For
    example, to find the absolute value of -4, the following expression was entered:


    ```

    >> abs(-4)

    ```


    which is a call function to the function abs. The number in the parentheses, the
    -4, is the argument. The value 4 was then returned as a result.


    # QUICK QUESTION!


    What would happen if you use the name of a function, for example sin, as a variable
    name?


    Answer:

    This is allowed in MATLAB, but then could not be used as the built-in function,
    until the variable is cleared. For example, try the following sequence:


    ```

    >> sin(3.1)

    ans

    0.0416

    >> sin = 45

    sin =

    45

    >> sin(3.1)

    ```


    ??? Subscript indices must be real positive integers or logical:

    >> who


    Your variables are:

    sin

    >> clear sin

    >> who

    Your variables are:

    ans

    >> sin(3.1)

    ans =

    0.0416


    In addition to the trigonometric functions, the elfun help topic also has some
    rounding and remainder functions that are very useful. Some of these include fix,
    floor, ceil, round, rem, and sign.


    The rem function returns the remainder from a division; for example 5 goes into
    13 with a remainder of 3, so the result of this expression is 3:


    ```

    >> rem(13,5)

    ans =

    3

    ```


    # QUICK QUESTION!


    What would happen if you reversed the order by mistake, and typed the following:


    ```

    rem(5,13)

    ```


    Answer:

    The rem function is an example of a function that has two arguments passed to
    it first. In this case, the second argument, 13, goes into 5 zero times with a
    remainder of 5, so 5 would be returned as a result.'
