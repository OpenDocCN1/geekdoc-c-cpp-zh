    # QUICK QUESTION!


    Let''s say that we want to create a vector of increasing values from mymin to
    mymax. We will write a function createvec that will receive two input arguments,
    mymin and mymax, and will return a value from mymin to mymax in steps of 1. First,
    we would make sure that the value of mymin is less than the value of mymax before
    creating the vector. How would we accomplish this?


    Answer: To exchange values, a temporary variable is required. For example, let''s
    say we have two variables a and b storing the values:


    If that does, then the value of a (3), is lost! Instead, we need to assign the
    value of a to temporary variable so that the value is not lost. The algorithm
    would be:


    +   - Assign the value of a to temp

    - Assign the value of b to a

    - Assign the value of temp to b


    a = 3;

    b = 5;


    temp = a;

    a = b;

    a=

    5

    temp = temp;

    b=

    3


    To exchange values, we could not assign the value of b to a, as:


    a = b;


    Now, for the function: An if statement is used to determine whether not the exchange
    is necessary.


    ```

    createvec.m

    function outvec = createvec(mymin, mymax)

    % Create a vector that iterates from mymin to mymax


    % If the minimum isn''t smaller than the maximum,

    % exchange the values using a temporary variable

    if mymin > mymax

    temp = mymin;

    mymin = mymax;

    mymax = temp;

    end


    % Use the colon operator to create the vector

    outvec = mymin:mymax;

    ```


