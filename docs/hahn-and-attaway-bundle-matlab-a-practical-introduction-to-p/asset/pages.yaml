    \ using fopen first, and should be closed fclose after the data has been read.\
    \ However, no loop is required; they will read the entire file automatically but\
    \ into a data structure.\n\nWe will concentrate on the fgetl function, which reads\
    \ strings from a file one at a time. The fgetl function affords more control over\
    \ the data than input functions. The fgetl function reads one line of data from\
    \ a file into a string; string functions can then be used to manipulate the data.\
    \ Since fgetl reads only one line, it must be placed in a loop that keeps going\
    \ until the end of the file is reached. The function feof returns logical true\
    \ if the file has been reached. The function call feof(fid) would return logical\
    \ true if the end of the file has been reached for the file identified by fid,\
    \ or logical false if not. A general algorithm for reading from a file into strings\
    \ would be:\n\n+   - Attempt to open the file; check to make sure the file was\
    \ successful.\n\n+   - If opened, loop until the end of the file is reached. For\
    \ each line in the file,\n\n+   - read it into a string\n\n+   - manipulate the\
    \ data\n\n+   - Attempt to close the file; check to make sure the file was successful.\n\
    \nThe generic code to accomplish this is:\n\n```\nfid = fopen('filename');\nif\
    \ fid == -1\n    disp('File open not successful')\nelse\n    while feof(fid) ==\
