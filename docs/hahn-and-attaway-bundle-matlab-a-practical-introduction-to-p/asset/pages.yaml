    # 4.1.1.2 Preallocating a Vector


    There are essentially two programming methods that could be used to simulate the
    cumsum function. One method is to start with an empty vector and concatenate each
    running sum to the vector. Extending a vector, however, is very inefficient. A
    better method is to preallocate the vector to the correct size and then change
    the value of each element to successive running sums. Both will be shown here.


    In the following function, the output argument is initialized to the empty vector
    []. Then, every time the element in the vector is added to the running sum, this
    sum is appended to the vector.


    ```

    myveccsum.m

    function outvec = myveccsum(vec)

    % This function mimics cumsum for a vector

    outvec = [];

    runsum = 1:length(vec)

    for i

    runsum = runsum + vec(i);

    outvec = [outvec runsum];


    ```


    Here is an example of calling the function:


    ```

    >> myveccsum([5 9 4])

    ans =

    5 14 18

    ```'
