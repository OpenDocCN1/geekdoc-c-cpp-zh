    # 6.2.1 Concatenation


    String concatenation means to join strings together. Of, since strings are just
    vectors of characters, the method of concatenating vectors works for strings,
    also. For example, to create one string from two strings, it is possible to join
    them by putting them in square brackets:


    ```

    >> first = ''Bird'';n>> last = ''house'';

    >> [first last]

    ans =

    Birdhouse

    ```


    The function strcat does this also horizontally, meaning that it creates longer
    string from the inputs.'
