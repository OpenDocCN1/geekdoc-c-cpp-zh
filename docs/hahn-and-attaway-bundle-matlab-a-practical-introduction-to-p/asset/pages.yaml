    ```


    As seen in Figure 13.2, this draws a reasonably thick grey line for the sin function.
    As, the handle will be as long as the Figure Window is not closed. Some of the
    properties of this object are:


    ```

    >> get(hl)

    Color = [0.5 0.5 0.5]

    erraseMode = normal

    LineStyle = -

    ```'
