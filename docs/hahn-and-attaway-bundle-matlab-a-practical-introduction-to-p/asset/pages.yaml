    # 1.3.3 Built-In Functions and Help


    There are many, built-in functions in MATLAB.

    The **help** command can be used to find out what

    functions MATLAB has, and also how to use them. For

    example, typing **help** at the prompt in the Command

    Window will show a list of help topics, which are


    groups of related functions. This is a very long list; which are most elementary

    topics are in the beginning.


    For example, one of these is listed as *matlab*elfun it includes the elementary

    math functions. Another of the first help topics is *matlab*ops*, which shows

    t operators that can be used in expressions.


    To see a list of the functions contained within a particular help topic, type
    **help**

    followed by the name of the topic. For example:


    ```

    >> help elfun

    ```


    will show a list of the elementary math functions. It is a very long list, and
    is

    broken into trigonometric (for which the default is radians, but there are equiv-

    ental functions that use degrees), exponential, complex, and rounding

    and remainder functions.


    To find out what a particular function does and how to call it, type **help**
