  md: "# 5.1 MORE TYPES OF USER-DEFINED FUNCTIONS\n\nWe have already seen how to write\
    \ a user-defined function, stored in an M-file, that calculates and returns one\
    \ value. This is just one type of function. It is also possible for a function\
    \ to return multiple values, and it is possible for a function to return nothing.\
    \ We will categorize functions as follows:\n\n+   - Functions that calculate and\
    \ return one value\n- Functions that calculate and return more than one value\n\
    - Functions that just accomplish a task, such as printing, without returning any\
    \ values\n\nSo, although many functions calculate and return values, some do not.\
    \ Some functions instead accomplish a task. Regardless of what kind of function\
    \ it is, all functions must be defined, and all functions consist of the header\
    \ and the body. The function must be called in order for it to be utilized. Categorizing\
    \ the functions is somewhat arbitrary, but there are differences between these\
    \ three types of functions, including the format of the function headers and also\
    \ the way in which the functions are called.\n\nIn general, any function in MATLAB\
    \ consists of\n\n+   - The function **header** (the first line); this has:\n \
    \ - the reserved word **function**\n  - (if the function **returns** values, the\
    \ name(s) of the output argument) followed by the assignment operator =\n  - the\
    \ name of the function (*Important*: this should be the same as the name of the\
    \ M-file in which this function is stored in order to avoid confusion)\n  - the\
    \ input arguments in parentheses, if there are any (separated by commas if there\
    \ is more than one)\n- A comment that describes what the function does (this is\
    \ printed if **help is used**)\n- The body of the function, which includes all\
    \ statements, assigning values to all output arguments if there are any\n\n# 5.1.1\
    \ Functions that Return More than One Value\n\nFunctions that return one value\
    \ have one output argument, as we have seen in Section 2.7. Functions that return\
    \ more than one value must have more than one output argument in the function\
    \ header, in square brackets. That means that in the body of the function, values\
    \ must be assigned to all"
  merge: -1
  pgno: 182
