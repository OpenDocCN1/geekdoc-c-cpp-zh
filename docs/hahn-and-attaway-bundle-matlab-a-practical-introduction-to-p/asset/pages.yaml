  md: '# 2.6 Introduction to File Input/Output (Load and Save) 59


    be very useful in creating plots. For example, the following script graphically
    displays the difference between the sin and cos functions:


    ```

    sinncos.m

    % This script plots sin(x) and cos(x) in the same Figure

    % Window for values of x ranging from 0 to 2*pi

    clf

    x = 0: 2*pi/40: 2*pi;

    y = sin(x);

    plot(x,y,''ro'');

    hold on

    y = cos(x);

    plot(x,y,''b+'');

    legend(''sin'', ''cos'')

    title(''sin and cos on one graph'')

    ```


    The script creates an x vector, iterating through all the values from 0 to 2π/40
    gives enough points to get a good graph. It then finds the sine of each x value,
