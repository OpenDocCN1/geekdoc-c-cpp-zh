    # SUMMARY


    Common Pitfalls


    +   - Trying to use parentheses rather than curly braces for a cell array


    +   - Forgetting to index into a vector using parentheses or referring to a field
    of a structure using the dot operator


    Programming Style Guidelines


    +   - Use arrays when values are the same type and represent in some sense the
    same thing.


    +   - Use cell arrays or structures when the values are logically related but
    not the same type or the same thing.


    +   - Use cell arrays rather than character matrices when storing strings of different
    lengths.'
