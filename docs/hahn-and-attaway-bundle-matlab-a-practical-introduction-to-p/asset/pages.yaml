  md: '# 1.2 Variables and Assignment Statements


    +   - The name must begin with a letter of the alphabet. After that, the name
    can contain letters, digits, and the underscore character (e.g., value_1), but
    it cannot have a space.


    +   - There is a limit to the length of the name; the built-in function lengthmax
    tells how many characters this is.


    +   - MATLAB is case-sensitive. That means that there is a difference between
    upper- and lowercase letters. So, variables called mynum, MYNUM, and Mynum are
    all different.


    +   - There are certain words called reserved words that cannot be used as variable
    names.


    +   - Names of built-in functions can be, but should not, be used as variable
    names.


    Additionally, variable names should always be mnemonic, which means they should
    make some sense. For example, if the variable is storing the radius of a circle,
    a name like “radius” would make sense; “x” probably wouldn’t.


    The Workspace Window shows the variables that have been created in the current
    Command Window and their values.


    The following commands relate to variables:


    +   - who shows variables that have been defined in this Command Window (this
    just shows the names of the variables)


    +   - whos shows variables that have been defined in the Command Window (this
    shows more information on the variables, similar to what is in the Workspace Window)


    +   - clear clears all variables so they no longer exist


    +   - clearvariablename clears out a particular variable


    If nothing appears when who or whos is entered, that means there aren’t any variables!
    For example, in the beginning of a MATLAB session, variables could be created
    and then selectively cleared (remember that the semicolon suppresses output):


    ```

    >> who

    >> mynum = 3;

    >> mynum + 5;


    >> who

    Your variables are:

    ans mynum

    \>> clear mynum

    ```'
