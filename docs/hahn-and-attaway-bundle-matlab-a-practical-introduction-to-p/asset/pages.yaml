    # 2.7.1 Function Definitions


    There are different ways to organize scripts and functions, but for now every
    function that we write will be stored in a separate M-file, which is why they
    are commonly called M-functions.


    A function in MATLAB returns a single result consists of


    +   - The function header (the first line); this has

    - the reserved word function

    - since the function returns a result, the name of the output argument followed
    by the assignment operator =

    - the name of the function (Important): This should be the same as the name of
    the M-file in which this function is stored to avoid confusion

    - the input arguments in parentheses; these correspond to the arguments that are
    passed to the function call


    +   - A comment that describes what the function does (this is printed if used)

    - The body of the function, which includes all statements and eventually must
    assign a value to the output argument


    The general form of a function definition for a function that calculates and returns
    one value looks like this:


    ```

    functionname.m

    function outputargument = functionname(input arguments)

    % Comment describing the function

    Statements here; these must include assigning a value to

    the output argument

    ```


    For example, the following is a function called calcarea, which calculates and
    returns the area of a circle; it is stored in a file called calcarea.m.


    ```

    calcarea.m

    function area = calcarea(rad)

    % This function calculates the area of a circle

    area = pi * rad * rad;

    ```'
