  md: '# 7.2 Structures


    # 7.2 STRUCTURES


    Structures are data structures that group together values that are logically related
    in what are called fields of the structure. An advantage of structures is that
    the fields are named, which helps to make clear what the values are are stored
    in the structure. Structure variables are not arrays. They do not have elements,
    so it is not possible to loop through their values in a structure.


    PRACTICE 7.1

    Write an expression that would display a random element from a cell array (without
    assuming that the number of elements in the cell array is known).

    Create two cell arrays and try the expression on them to make sure that it is
    correct.

    For more practice, write a function that will receive one cell array as argument
    and will display a random element from it.


    # 7.2.1 Creating and Modifying Structure Variables


    Creating structure variables can be accomplished by simply storing values in fields
    using assignment statements, or by using the struct function.


    The first example that will be used is that local Computer Super Mart wants to
    store information on the software packages it sells. For every one, they will
    store:


    +   * The item number

    * The cost to the store

    * The price to the customer

    * A code indicating the type of software


    An individual structure variable for one software package might look like this:


    | item_no | cost | price | code |

    | --- | --- | --- | --- |

    | 123 | 19.99 | 39.95 | ''g'' |


    The name of the structure variable is package, it has four fields item_no, cost,
    price, and code.


    One way to initialize a structure variable is to use the struct function, which
    preallocates the structure. The field names are passed to the struct in quotes,
    following each one with the value for that field:


    ```

    >> package = struct(''item_no'',123,''cost'',19.99,\n''price'',39.95,''code'',''g'')

    package =

    item_no: 123

    cost: 19.9900

    price: 39.9500

    code: ''g''

    ```


    ![](img/0dc331dc1ec8e322a2340be844751b63_249_0.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Typing the name of the structure variable will display the names and contents
    of all fields:


    ```

    >> package

    package =

    item_no: 123

    cost: 19.9900

    price: 39.9500

    code: ''g''

    ```


    Notice that in the Workspace Window, the variable package is listed as a $1 \times
    1$ struct. MATLAB, since it is written to work with arrays, assumes the array
    format. Just as a single number is treated as a $1 \times 1$ double, a single
    structure is treated as a $1 \times 1$ struct. Later in this chapter we will see
    how to work more gen-eral with vectors of structs.


    An alternative method of creating this structure, which is not as efficient, involves
    using the dot operator to refer to fields within the structure. The name of the
    structure variable is followed by a dot, or period, and then the name of the field
    within that structure. Assignment statements can be used to assign values to the
    fields.


    ```

    >> package.item_no = 123;

    >> package.cost = 19;

    >> package.price = 39.95;

    >> package.code = ''g'';

    ```


    By using the dot operator in the first assignment statement, a structure variable
    is created with the field item_no. The next three assignment statements add more
    fields to the structure variable.


    Adding a field to a structure later is accomplished as easily as earlier, by using
    an assignment statement.


    An entire structure variable can be assigned to another. This would make sense,
    for example, if the two structures had values in common. Here, the values from
    one structure are copied into another and then two fields are selectively changed.


    ```

    >> unpack = package;

    >> unpack.item_no = 111;

    >> unpack.price = 34.95

    unpack =

    item_no: 111

    cost: 19.9900

    price: 34.9500

    code: ''g''

    ```'
