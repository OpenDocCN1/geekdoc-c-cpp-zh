  md: '# CHAPTER 1 Introduction to MATLAB


    MATLAB® is a very powerful software package that has many built-tools for solving
    problems and graphical illustrations. The simplest method for using the MATLAB
    product is interactive; an expression is entered by the user and MATLAB immediately
    responds with a result. It is also possible to write programs in MATLAB, which
    are essentially groups of commands that are executed sequentially.


    This chapter will focus on the basics, including many operators and built-in functions
    that can be used in interactive expressions. Means of storing values, including
    vectors and matrices, will also be introduced.


    # 1.1 GETTING INTO MATLAB


    MATLAB is a mathematical and graphical software package; it has numerical, graphical,
    and programming capabilities. It has built-in functions to do many operations,
    and there are toolboxes that can be added to augment these functions (e.g., for
    signal processing). There are versions available for different hardware platforms,
    and there are both professional and student editions.


    When the MATLAB software is started, a window is opened: the main part is the
    Command Window (see Figure 1.1). In the Command Window, there is a statement that
    says:


    In the Command Window, you should see:


    ```

    >>

    ```


    ```

    >> is called the prompt. In the Student Edition, the prompt appears as:

    EDU>>

    ```


    In the Command Window, MATLAB can be used interactively. At the prompt, any MATLAB
    command or expression can be entered, and MATLAB will immediately respond with
    the result.


    It is also possible to write programs in MATLAB, which are contained in script
    files or M-files. Programs will be introduced in Chapter 2.


    There are several commands that can serve as an introduction to MATLAB and allow
    you to get:


    +   - info will display contact information for the product

    - demo has demos of several options in MATLAB

    - help will explain any command; help help will explain how help works

    - helpbrowser opens a Help Window'
  merge: -1
  pgno: 24
