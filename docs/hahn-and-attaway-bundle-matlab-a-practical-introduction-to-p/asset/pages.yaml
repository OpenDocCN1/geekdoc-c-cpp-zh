  md: '# 11.2 Matrix Solutions to Systems of Linear Algebraic Equations


    So, the solution is x1 = 4; -2x2 = 2 or x2 = -1.


    Here is an example of a 3 × 3 system:


    ```

    x1 + 3x2 = 1

    2x1 + x2 + 3x3 = 6

    x1 + 2x2 + 3x3 = 3

    ```


    In matrix form, the augmented matrix [A|b] is


    ```

    [1 3 0 1]

    [2 1 3 3]

    [4 2 3 3]

    ```


    Forward substitution (done systematically by first getting a 0 in the a21 position,
    then a31, and finally a32):


    ```

    [1 3 0 1]

    [2 1 3 6] r2-2r1→r2 [0 -5 3 4]

    [4 2 3 3] r4-4r1→r3 [0 -10 3 -3]

    ```


    ```

    [1 3 0 1]

    r3-2r2→r3 [0 -5 3 4]

    [0 0 -3 -9]

    ```


    For the Gauss method, this is followed by back-substitution:


    ```

    -3x3 = -9

    x3 = 3

    -5x2 + 3(3) = 4

    -5x2 = -5

    x2 = 1

    x1 + 3(1) = 1

    x1 = -2

    ```


    For the Gauss-Jordan method, this is followed by back elimination:


    ```

    [1 3 0 1]

    [0 -5 3 4] r2-r1→r2 [0 -5 3 4]

    [0 0 -3 -9] [0 0 -3 -9]

    ```


    ```

    [1 0 0 -2]

    r1+1/5r2→r1 [0 -5 0 -5]

    [0 0 -3 -9] [0 0 -3 -9]

    ```'
