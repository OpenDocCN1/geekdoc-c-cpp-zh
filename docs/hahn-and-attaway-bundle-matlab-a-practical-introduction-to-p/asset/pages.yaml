    # 14.2.2 Adding and Subtracting Complex Numbers


    For two complex numbers z1 = a + bi and z2 = c + di,


    ```

    z1 + z2 = (a + c) + (b + d)i

    z1 - z2 = (a - c) + (b - d)i

