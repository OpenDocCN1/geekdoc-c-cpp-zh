    7.1 Cell Arrays........224

    7.2 Structures .........229


    **Data structures** are variables that store more than one value. In order for
    it to make sense more than one value in a variable, the values should some-how
    logically related. There are many kinds of data structures. We have already been
    working with one kind, arrays (e.g., vectors and matrices). An array is a data
    structure in which all the values are logically related in that they are of the
    same type, and represent in some sense the same thing. So far, has been true for
    the vectors and matrices that we have used.


    *A cell array* is a kind of data structure that stores values of different types.
    Cell arrays can be vectors or matrices; the different values are stored in the
    elements of array. One common use of a cell array is to store strings of different
    lengths.


    **Structures** are data structures that group together values that are logically
    related, but are not the same thing and not necessarily the same type. The different-values
    are stored in separate *fields* of the structure.


    One of structures is to set up a *database* of information. For example, for a
    class professor might want to store information for every student in the class:
    the student''s name, university ID number, grades on all assignments and quizzes,
    and so'
