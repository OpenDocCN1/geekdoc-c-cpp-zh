  md: 'As an example, we will write a function in MATLAB to add two complex numbers
    together and return the resulting complex number.


    # The Programming Concept


    In most cases, to add two complex numbers together you would have to separate
    the real and imaginary parts, and add them to return your result.


    ```

    addcomp.m

    function outc = addcomp(z1, z2)

    % Adds two complex numbers and returns the result

    % Adds the real and imaginary parts separately

    realpart = real(z1) + real(z2);

    imagpart = imag(z1) + imag(z2);

    outc = realpart + imagpart * i;


    >> addcomp(3+4i, 2-3j)

    ans =

    5.0000 + 1.0000i

    ```


    # The Efficient Method


    MATLAB will automatically do this in order to add two complex numbers together
    (subtract).


    ```

    addcomp2.m

    function outc = addcomp2(z1,z2)

    % Adds two complex numbers and returns the result

    outc = z1 + z2;


    >> addcomp2(3+4i, 2-3j)

    ans =

    5.0000 + 1.0000i

    ```


    # 14.2.3 Multiplying Complex Numbers


    For two complex numbers z1 = a + bi and z2 = c + di,


    ```

    z1 * z2 = (a + bi) * (c + di)

    = a*c + a*di + c*bi + bi*di

    = a*c + a*di + c*bi - b*d

    = (a*c - b*d) + (a*d + c*b)i

    ```'
