  md: '# 1.3 Expressions


    For integers, there are many integer types (e.g., int8, int16, int32, and int64).
    The numbers in the names represent the number of bits used to store values of
    that type. For example, the type int8 uses eight bits altogether to store the
    integer and its sign. Since one bit is used for the sign, seven bits are used
    to store the actual number. Each bit stores the number in binary (0''s or 1''s),
    and 0 is also a possible value, which means 2^7 - 1 or 127 is the largest number
    that can be stored. The range of values for int8 is actually from -128 to +127.
    This range can be found for any type by passing the name of the type as a string
    (which means in single quotes) to the functions intmin and intmax. For example:


    ```

    >> intmin(''int8'')

    ans=

    -128

    >> intmax(''int8'')

    ans=

    127

    ```


    The larger the number in the type name, the larger the number that can be stored
    in it. We will for the most part use the type int32 when an integer is required.


    The type char is used to store single characters (e.g., ''x'') or strings, which
    are sequences of characters (e.g., ''cat''). Both characters and strings are enclosed
    in single quotes.


    The type logical is used to store true/false values.


    If any variables have been created in the Command Window, they can be seen in
    the Workspace Window. In that window, for every variable, the variable name, value,
    and class (which is essentially its type) can be seen. Other attributes of variables
    can also be seen in the Workspace Window. Which attributes are visible by default
    depends on the version of MATLAB. However, when the Workspace Window is chosen,
    clicking View allows the user to choose which attributes will be displayed.


    By default, numbers are stored as the type double in MATLAB. There are, however,
    many functions that convert values from one type to another. The names of these
    functions are the same as the names of the types just shown. They can be used
    as functions to convert a value to that type. This is called casting to a different
    type, or type casting. For example, to convert a value from the type double, which
    is the default, to the type int32, the function int32 would be used. Typing the
    following assignment


    ```

    >> val = 6+3

    ```'
