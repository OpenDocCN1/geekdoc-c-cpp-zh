  md: "# 3.4 Nested If-Else Statements\n\n```\nif x < -1\n  y = 1;\nend\nif x > -1\
    \ && x < 2\n  y = x^2;\nend\nif x > 2\n  y = 4;\nend\n```\n\nSince the three possibilities\
    \ are mutually exclusive, the value of y can be determined by using three separate\
    \ if statements. However, this is not very efficient: all three Boolean expressions\
    \ must be evaluated, regardless of the range in which x falls. For example, if\
    \ x is less than -1, the first expression is true and 1 would be assigned to y.\
    \ However, the two expressions in the next two if statements are still evaluated.\
    \ Instead of writing it this, the expressions can be nested so that the statement\
    \ ends when an expression is found to be true:\n\n```\nif x < -1\n  y = 1;\nelse\n\
    \  % If we are here, x must be > -1\n  % Use an if-else statement to choose\n\
    \  % between the two remaining ranges\n  if x > -1 && x < 2\n    y = x^2;\n  else\n\
    \    % No need to check\n    % If we are here, x must be > 2\n    y = 4;\nend\n\
    ```\n\nUsing a nested if-else to choose from the three possibilities, not all\
    \ conditions must be tested as they were in the previous example. In case, if\
    \ x is less than -1, the statement to assign 1 to y is executed, and the if-else\
    \ statement is completed with no other conditions. However, if x is not less than\
    \ -1, the else clause is executed. If the else clause is executed, then we already\
    \ know that x is greater than equal to -1 so that part does not need to be tested.\
    \ Instead, there are only two remaining possibilities: either x is less or equal\
    \ to 2, or it is greater than 2. An if-else statement is used to choose between\
    \ those two possibilities. So, the action of the else clause was another if-else\
    \ statement. Although it is long, this is one if-else, nested if-else statement.\
    \ The actions are indented to show the structure."
