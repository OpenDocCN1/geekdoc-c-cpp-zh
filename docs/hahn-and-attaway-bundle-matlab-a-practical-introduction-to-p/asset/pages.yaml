  md: '# 9.2.1 Function Functions


    One reason for using function handles is be able to pass functions to other functions—these
    are called function functions.


    For example, let''s say we have a function that creates an x vector. The y vector
    is created by evaluating a function at each of the x points, and then these points
    are plotted.


    ```

    fnfnexamp.m

    function fnnexamp(funh)

    % Example of a function function. The handle of a function

    % is passed and that function of x is plotted

    x = 1..25;

    y = funh(x);

    plot(x,y,''o'')

    ```


    # FIGURE 9.1

    Plot of sin created by passing handle of function to.


    What we want is be able to pass a function to be the value of fun, like sin, cos,
    tan, and so on. It doesn''t work to just pass the name of the function:


    ```

    >> fnnexamp(sin)

    ??? Error using --> sin

    Not enough input arguments.

    ```


    ![](img/0dc331dc1ec8e322a2340be844751b63_296_0.png)


    Instead, we have to pass the handle of the function:


    ```

    >> fnnexamp(@sin)

    ```


    which creates the y vector as sin(x) and then brings the up plot as seen in Figure
    9.1.


    Passing the handle of the cos function would graph inside of sine:


    ```

    >> fnnexamp(@cos)

    ```


    We could also pass the handle of any user-defined or anonymous function to the
    fnnexamp function.


    # QUICK QUESTION!


    How could you write a function to accomplish essentially the same thing, but by
    passing the name of the function as a string?


    Answer: Pass the name of the function as a string to the function, and then use
    eval to evaluate the function.


    (Continued)'
