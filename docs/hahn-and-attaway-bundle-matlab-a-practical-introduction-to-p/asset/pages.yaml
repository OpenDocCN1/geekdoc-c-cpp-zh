    # SUMMARY


    # Common Pitfalls


    +   - Misspelling a filename, which causes a file open to be unsuccessful

    - Using a lower level file I/O function, when load and save could be used

    - Forgetting that fscant reads columnwise into a matrix—so every line in the

    file is read into a column in the resulting matrix

    - Forgetting that fscant converts characters to their ASCII equivalents

    - Forgetting that textscan reads into a cell array (so curly braces are necessary

    to index)

    - Forgetting to use the permission string ''a'' for appending to a file (which

    means the data already in the file would be lost!)


    # Programming Style Guidelines


    +   - Use load when the file contains the same kind of data on every line and
    in

    t same format on every line.

    - Always close files that were opened.

    - Always check to make sure that files were opened and closed successfully.

    - Make sure that all data is read from a file; for example, use a conditional

    loop until the end of the file is reached rather than using a for

    loop.

    - Be careful to use the correct formatting string when using fscant or

    textscan.

    - Store groups of related variables in separate MAT-files.'
