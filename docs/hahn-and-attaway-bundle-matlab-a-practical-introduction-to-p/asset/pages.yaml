  md: "# 12.5 Searching\n\nbinsearch.m\n\n```\nfunction outind = binsearch(vec, key)\n\
    % This function implements a binary search\nlow = 1;\nhigh = length(vec);\noutind\
    \ = -1;\nwhile low <= high && outind == -1\n    mid = floor((low + high)/2);\n\
    \    if vec(mid) == key\n        outind = mid;\n    else key < vec(mid)\n    \
    \    high = mid - 1;\n    else\n        low = mid + 1;\n    end\nend\n```\n\n\
    Here are examples of calling this function:\n\n```\n>> vec = randint(1,7, [1 30])\n\
    vec =\n    2 11 25 1 5 6 7\n>> svec = sort(vec)\nsvec =\n    1 2 5 5 6 7 11 25\n\
    >> binsearch(svec, 4)\nans =\n    -1\n>> binsearch(svec, 25)\nans =\n    7\n>>\
    \ binsearch(svec, 5)\nans =\n    3\n```\n\nThe binary search can also be implemented\
    \ as a recursive function. The following recursive function also implements this\
    \ binary search algorithm. The function receives four arguments: a sorted vector,\
    \ a key to search for, and the values"
  merge: -1
  pgno: 405
- img_proc: true
  md: "of low and high (which, to begin, will be 1 and the length of the vector).\
    \ It will return -1 if the key is not in the vector, or the index of the element\
    \ in which it is found. The base cases in the algorithm are when low > high, which\
    \ means the key is not in the vector, or when it is found. Otherwise, the general\
    \ case is to adjust the range and call the binary search function again.\n\n```\n\
    function out = recbinsearch(vec, key, low, high)\n% Recursive binary search function\n\
    \ mid = floor((low + high)/2);\nif low > high\n    out = -1;\nelseif vec(mid)\
    \ == key\n    out = mid;\nelseif key < vec(mid)\n    out = recbinsearch(vec, key,\
    \ low, mid-1);\nelse\n    out = recbinsearch(vec, key, mid+1, high);\nend\n```\n\
    \nHere are examples of calling this function:\n\n```\n>> recbinsearch(svec, 5,\
    \ 1,length(svec))\nans =\n3\n>> recbinsearch(svec, 25, 1,length(svec))\nans =\n\
    7\n>> recbinsearch(svec, 4, 1,length(svec))\nans =\n-1\n```\n\n# SUMMARY\n\nCommon\
    \ Pitfalls\n\n+   - Forgetting that max and min return the index of only the first\
