    # 7.1.2  Storing Strings in Cell Arrays


    One good application of a cell array is to store strings of different lengths.
    Since cell arrays can store different types of values in the elements, means strings
    of different lengths can be stored in the elements.


    ```

    >> names = (''Sue'', ''Cathy'', ''Xavier'')

    names = {''Sue'', ''Cathy'', ''Xavier''}

    ```'
