    # 10.1.1 Matrix of Plots


    Another function that is very useful with any type of plot subplot, which creates
    a matrix of plots in the current Figure Window. Three arguments are passed to
    it in the form subplot(r,c,n), where r and c are the dimensions of the matrix
    and n is the number of the particular plot within this matrix. The plots are numbered
    rowwise in the upper left corner. In many cases, it is useful to create a subplot
    in a for loop so the loop variable iterates through the 1 through n. When the
    subplot function is called in a loop, the first two arguments will be the same
    since you give the dimensions of the matrix. The third argument will iterate through
    the numbers assigned to the elements of the matrix. The subplot function is called,
    it makes the active plot; then, any plot function can be used complete with axis
    labeling, titles, and such within that element.


    ![](img/0dc331dc1ec8e322a2340be844751b63_318_0.png)


    For example, the following subplot shows the difference, in Figure Window, using
    10 points and 20 points to plot sin(x) between 0 and 2π. The subplot function
    creates a 1x2 row vector of plots in the Figure Window, so that the two plots
    are shown side-by-side. The loop i iterates through the values 1 and 2. The first
    time through the loop, when i has the value 1, or 10 points are used, and the
    value of the subplot function is 1. The second time through the loop, 20 points
    are used and the second argument is 2. Note sprintf is used to print how many
    points were used in the plot titles. The resulting Figure with both plots is shown
    in Figure 10.1.


    ```

    %demonstrates subplot using a for loop

    for i = 1:2

    x = linspace(0.2*pi,10*i);

    y = sin(x);


    ```


