    # Programming Style Guidelines


    +   Use indentation to show the structure of a script or function. In particular,
    the actions in an if statement should be indented.


    +   When the else clause isn''t needed, use an if statement rather than an if-else.
    For example,

    if unit == ''i''

    len = len * 2.54;

    else

    len = len; % this does nothing to skip it

    end


    Instead, just use:

    if unit == ''i''

    len = len * 2.54;

    end


    +   Do not put unnecessary conditions on else or elseif clauses. For example,
    the following prints one thing if the value of a variable number is equal to 5,
    and something else if it is not.


    ```

    if number == 5

    disp(''It is a 5'')

    else number == 5

    disp(''It is not a 5'')

