    Notice that although this is a string variable, the quotes are not shown. However,
    they are shown in the Workspace Window.


    If the user enters other spaces or tabs before the Enter key, they are ignored
    and an empty string is stored in the variable:


    ```

    mychar = input(''Enter a character: ''

    ```'
