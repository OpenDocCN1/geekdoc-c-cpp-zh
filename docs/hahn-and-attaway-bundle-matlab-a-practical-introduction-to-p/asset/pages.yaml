  md: "```\ncase caseexp2\naction2\ncase caseexp3\naction3\n% etc: there can be many\
    \ of these\notherwise\nactionn\nend\n```\n\nThe **switch** statement starts with\
    \ the reserved word **switch**, and ends with the reserved word **end**. The *switch\\\
    _expression* is compared, in sequence, to the case expressions (caseexp1, caseexp2,\
    \ etc.). If the value of the *switch\\_expression* matches caseexp1, then action1\
    \ is executed and the **switch** statement ends. If the value matches caseexp3,\
    \ then action3 is executed, and in general if the value matches caseepi, where\
    \ i can be any integer from 1 to n, then action is executed. If the value of the\
    \ *switch\\_expression* does not match any of the case expressions, the action\
    \ after the word **otherwise** is executed.\n\nFor the previous example, the **switch**\
    \ statement can be used as follows:\n\n```\nswitchgrade.m\nfunction grade = switchletgrade(quiz)\n\
