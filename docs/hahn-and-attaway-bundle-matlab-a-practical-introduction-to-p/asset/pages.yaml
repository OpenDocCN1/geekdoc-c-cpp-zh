  md: '# 9.5 Recursive Functions


    When the function is first called, 3 is not equal to 1, the statement


    ```

    facn = n * fact(n-1);

    is executed will attempt to assign the value of 3 * fact(2) to facn, but this
    expression cannot be evaluated and therefore a value cannot be assigned because
    first the value of fact(2) must be found. Thus, the assignment statement has been
    interrupted by a recursive call to the fact. The call to the function fact(2)
    results in an attempt to assign 2 * fact(1), but again this expression cannot
    be evaluated. Next, the call to the function fact(1) results in a complete execution
    of an assignment statement since it assigns just 1. Once the base case has been
    reached, the assignment statements that were interrupted can be evaluated, in
    the reverse order.

    ```


    Calling this function yields the same result as the built-in factorial function:


    ```

    >> fact(5)

    ans =

    120

    >> factorial(5)

    ans =

    120

    ```


    The recursive factorial is a very common example of a recursive function. It is
    somewhat of a lame example, however, since recursion is not necessary to find
    a factorial; a for loop can be used as well in programming (or, of course, the
    built-in function in MATLAB).


