  md: "# Summary 69\n\nFor example, for a cylinder with a radius of 32 inches and\
    \ a height of 73 inches, and a cost per square foot of the material of $4.50,\
    \ the calculation would be given by the following algorithm:\n\n+   - Calculate\
    \ the surface area SA = 2 * π * 32 * 73 + 2 * π * 32 * 32 squared\n- Calculate\
    \ the SA in square feet = SA/144\n- Calculate the total cost = SA in square feet\
    \ * cost per square foot\n\nThe function includes local variables to store the\
    \ intermediate results.\n\n```\ncylcost.m\nfunction outcost = cylcost(radius,\
    \ height, cost)\n% Calculates the cost of constructing a closed\n% cylinder\n\
    % The radius and height are in inches\n% The cost is per square foot\n% Calculate\
    \ surface area in square inches\nsurf_area = 2 * pi * radius * height + 2 * pi\
    \ * radius ^ 2;\n% Convert surface area in square feet and round up\nsurf_asf\
    \ = ceil(surf_area/144);\n% Calculate cost\noutcost = surf_asf * cost;\n```\n\n\
    Here are examples of calling the function:\n\n```\n>> cylcost(32,73,4.50)\nans\
