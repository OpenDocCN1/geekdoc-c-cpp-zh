    # 1.3 EXPRESSIONS


    Expressions can be created using values, variables that have already been created,
    operators, built-in functions, and parentheses. For numbers, these can include
    operators such as multiplication, and functions such as trigonometric functions.
    An example of such an expression would be:


    ```

    >> 2 * sin(1.4)

    ans =

    n1.9709

    ```


    # 1.3.1 The Format Function and Ellipsis


    The default in MATLAB is to display numbers with four decimal places, as already
    shown. The format command can be used to specify the output format of expressions.
    This are many options, including making the format short (the default) or long.
    For example, changing the format to long will result in 15 decimal places. This
    will remain in until the format is changed back to short, as demonstrated with
    an expression and with the built-in value for pi.


    ```

    >> format long

    >> 2 * sin(1.4)

    ans =

    1.970899459976920

    ```


    ```

    >> pi

    ans =

    3.141592653589793

    ```


    ```

    >> format short

    >> 2 * sin(1.4)

    ans =

    1.9709

    ```


    ```

    >> pi

    ans =

    3.1416

    ```


    The format command can also be used to control the spacing between the MATLAB
    command or expression and the result; it can be either loose (the default) or
    compact.'
