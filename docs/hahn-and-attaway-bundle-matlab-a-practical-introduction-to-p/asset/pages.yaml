  md: "However, instead of creating the index vector manually as shown here, the procedure\
    \ to initialize the index vector is to use a sort function. the algorithm is:\n\
    \n+   Initialize the values in the index vector to be the indices 1, 2, 3, ....\n\
    \n+   Use any sort algorithm, but compare the elements in the original vector\
    \ using index vector to index into it (e.g., using grades(grade_index(i))) as\
    \ shown earlier.\n\n+   When the sort algorithm calls for exchanging values, exchange\
    \ the elements in the index vector, not in the original vector.\n\nHere is a function\
    \ that implements this algorithm:\n\n```\ncreateind.m\nfunction indvec = createind(vec)\n\
    %This function creates index vector in ascending order\n\n Initialize the index\
    \ vector\nlen = length(vec);\nindvec = 1:len;\nfor i = 1:len-1\nlow = i;\nfor\
    \ j=i+1:len\n    % Compare values in the original vector\n    if vec(indvec(j))\
    \ < vec(indvec(low))\n        low = j;\nend\nend\n% Exchange elements in the index\
    \ vector\ntemp = indvec(i);\nindvec(i) = indvec(low);\nindvec(low) = temp;\nend\n\
    ```\n\nFor example, for the grades just given:\n>> clear grade_index\n>> grade_index\
    \ = createind(grades)\ngrade_index =\n\n2 5 1 6 4 3"
