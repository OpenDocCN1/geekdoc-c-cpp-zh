    or calculate the sum $1 + 2 + 3 + \dots + n$.


    In order to do this, we need to add each value to a running *sum*. We keep adding
    to it. First the sum has to be initialized to 0, then in this case it will be
    1 (0 + 1), then 3 (0 + 1 + 2), then 6 (0 + 1 + 2 + 3), and so forth.


    In function to calculate the sum, we need a loop or iterator variable *i*, as
    before, and also variable to store the running sum. In this case we will use the
    output argument *sum* as the running sum. Every time the loop, the next value
    of *i* is added to the value of *sum*. This function will return the result, which
    is the sum of all integers from 1 to the input argument *n* stored in the output
    argument *sum*.


    ```

    sum_1_to_n.m

    function sum = sum_1_to_n(n)

    % This function returns the sum of

    % integers from 1 to n

    sum = 0;

    for i = 1:n

    sum = sum + i;

    end

    ```


