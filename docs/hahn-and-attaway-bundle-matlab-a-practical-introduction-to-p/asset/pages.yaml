  md: '# 2.5 Scripts to Produce and Customize Simple Plots


    # 2.5.2 Simple Related Plot Functions


    Other functions that are useful in customizing plots are clf, figure, hold, legend,
    and grid. Brief descriptions of these functions are given here; help to find out
    about them:


    +   clf clears the Window by removing everything from it.


    +   figure creates a new, empty Figure Window when called without any arguments.
    Calling it figure(n) where n is an integer is a way of creating and maintaining
    multiple Figure Windows, and of referring to each individually.


    +   hold is a toggle that freezes the current graph in the Figure Window, so that
    new plots will be superimposed on the current one. Just hold by itself is a toggle,
    so calling this once turns the hold on, and then the next time turns it off. Alternatively,
    the commands hold on and hold off


    +   legend displays strings passed to it in a legend box in the Figure Window,
    in order of the plots in the Figure Window.


    +   grid displays grid lines on a graph. By itself, it is a toggle that turns
    the grid lines on and off. Alternatively, the commands grid on and grid off can
    be used.


    Also, there are many plot types. We will see more in Chapter 10, but another simple
    plot type is a bar chart.


    For example, the following script creates two separate Figure Windows. First,
    it clears the Figure Window. Then, it creates an x vector and two y vectors (y1
    and y2). In the first Figure Window, it plots the y1 values using a bar chart.
    In the second Figure Window, it plots the y2 values as black lines, puts hold
    on so that the next graph will be superimposed, and plots the y2 values as black
    o s. It also puts a legend on this graph and uses a grid. Labels and titles are
    omitted in this case since it is generic data.


    ```

    plotfigs.m

    % This creates 2 different plots, in 2 different

    % Figure Windows, to demonstrate some plot features

    clf

    x = 1:5; % Not necessary

    y1 = [2 11 6 9 3];

    y2 = [4 5 8 6 2];

    % Put a bar chart in Figure 1

    (Continued)

    ```'
