  md: '# 11.3 Symbolic Mathematics


    ### 11.3.1 Symbolic Variables and Expressions

    111.3.1 Symbolic Variables and Expressions

    MATLAB has a type called sym for symbolic variables and expressions; these work
    with strings. For example, to create a symbolic variable a and perform the work
    with strings. The addition just described, first a symbolic variable would be
    created by passing the string ''a'' to the sym function:


    ```

    >> a = sym(''a'');

    >> a+a

    ```


    Symbolic variables can also store expressions. For example, the variables b and
    c store expressions:


    ```

    >> b = sym(''x^2'');

    >> c = sym(''x^4'');

    ```


    All basic mathematical operations can be performed on symbolic variables and expressions
    (e.g., add, subtract, multiply, divide, raise to a power, etc.).

    Here are some examples:


    ```

    >> c/b

    ans =

    x^2

    ```


    ```

    >> b^3

    ans =

    x^6

    ```


    ```

    >> c*b

    ans =

    x^6

    >> b + sym(''4*x^2'');

    ans =

    5*x^2

    ```


    It can be seen from the last example that MATLAB will collect terms in these expressions,
    adding the x^2 and 4x^2 to result in 5x^2.


    The following creates a symbolic expression by passing a string, but the terms
    are not automatically collected:


    ```

    >> sym(''z^3 + 2*z^3'');

    ans =

    z^3 + 2*z^3

    ```


    If, on the other hand, z is a symbolic variable to begin with, quotes are not
    needed around the expression, and the terms are automatically collected:'
