    # 13.3 IMAGE PROCESSING


    Images are represented as grids, or matrices, of elements (called pixels). In
    MATLAB an image is typically represented as a matrix in which each element corresponds
    to a pixel in the image. There are two basic ways that the color for that pixel
    can be represented:


    +   - True color, or RGB, in which the three color components are stored (red,
    green, and blue, in that order).


    +   - Index into a colormap: the value stored is an integer that refers to a row
    in a matrix called a colormap. The colormap stores the red, green, and blue components
    in three separate columns.


    For an image that has m x n pixels, the true color matrix would be a three-dimensional
    matrix with the size m x n x 3. The first two dimensions represent the coordinates
    of the pixel. The third index is the color component; (:,1) is the red, (:,2)
    is the green, and (:,3) is the blue component.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# 13.3 Image Processing 401


    The indexed representation instead would be an $m \times n$ matrix of integers,
    each of which is an index into a colormap matrix that has the size $p \times 3$
    (where $p$ is the number of colors available in that particular colormap). Each
    row in the colormap has three numbers representing one color: first the red, then
    green, blue components, as we have seen before. For example,


    ```

    [1 0 0] is red

    [0 1 0] is green

    [0 0 1] is blue

    etc.

    ```


    MATLAB has several built-in colormaps that are named; the reference page on **colormap**
    displays them. Calling the function **colormap** without any arguments will return
    the current colormap, which by default is one *jet*.


    The following stores the current colormap in a variable *map*, gets the size of
    the matrix (which will be the number of rows in this matrix, or in other words
    the number of colors, by 3 columns), and displays the first five rows in this
    colormap. If the current colormap is the default *jet*, this will be the result:


    ```

    >> map = colormap;

    >> [r c] = size(map)

    r =

    64

    c =

    3

    >> map(1:5,:)

    ans =

    0    0    0.5625

    0    0    0.6250

    0    0    0.6875

    0    0    0.7500

    0    0    0.8125

    ```


    This shows that there are 64 rows, or 64 colors, in or other words, in this particular
    colormap. It also shows that the first five colors are shades of blue.


    The format of calling the **image** function is:


    ```

    image(mat)

    ```


    where *mat* is a matrix that represents the colors in an $m \times n$ image ($m
    \times n$ pixels in the image). If the matrix has the size $m \times n$, then
    each element is an index into the current colormap.'
