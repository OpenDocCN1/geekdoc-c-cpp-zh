  md: "# 4.4.5.1 Error-Checking for Integers\n\nSince MATLAB uses the type double\
    \ by default for all values, to check that the user has entered an integer, the\
    \ program has to convert the input to an integer type (e.g., int32) and then check\
    \ whether that is equal to the original input. The following examples illustrate\
    \ the concept.\n\nIf the variable num is a real number, converting it to the type\
    \ int32 will round it, so the result is not the same as the original value.\n\n\
    ```\n>> num = 3.3;\n>> inum = int32(num)\ninum =\n3\n>> num == inum\nans =\n0\n\
    ```\n\nIf, on the other hand, the value of the variable num is an integer, converting\
    \ it to an integer type will not change the value.\n\n```\n>> num = 4;\n>> inum\
    \ = int32(num)\ninum =\n4\n>> num == inum\nans =\n1\n```\n\nThe following script\
    \ uses this idea to error-check for integer data; it loops until the user correctly\
    \ enters an integer.\n\n```\nreadoneint.m\n% Error-check until the user enters\
    \ an integer\ninputnum = input('Enter an integer: ');\nnum2 = int32(inputnum)\n\
    while num2 ~= inputnum\n    inputnum = input('Invalid! Enter an integer: ');\n\
    \    num2 = int32(inputnum)\nend\nprintf('Thanks, you entered a %d \\n',inputnum)\n\
    ```\n\nHere are examples of running this script:\n\n```\n>> readoneint\nEnter\
    \ an integer: 9.5\n```"
