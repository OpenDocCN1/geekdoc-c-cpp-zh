    # SUMMARY


    # Common Pitfalls


    +   - Trying to pass the name of a function to a function; instead, the function
    handle must be passed


    +   - Thinking that nargin is the number of elements in varargin (it is not necessarily;
    it is the total number of input arguments)


    +   - Forgetting the base case for a recursive function


    # Programming Style Guidelines


    +   - Use anonymous functions whenever the function body consists of a simple
    expression.


    +   - Store related anonymous functions in one MAT-file.


    +   - If inputs and outputs will always be passed to/from a function, use standard
    input arguments/output arguments for them. Use varargin and varargout only when
    it is not known ahead of time whether other input/output arguments will be needed.


    +   - Use iteration instead of recursion when possible.


    | MATLAB Functions and Commands | |

    | str2func | feval | nargin | end (for functions) |

    | func2str | varargin | nargout | |

    | fplot | varargout |'
