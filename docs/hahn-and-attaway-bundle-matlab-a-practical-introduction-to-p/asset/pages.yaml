  md: '# CHAPTER 11 Solving Systems of Linear Algebraic Equations


    Now, putting it back in matrix equation form:


    ```

    $$\begin{bmatrix} 1 & 2 \ 0 & -2 \end{bmatrix} \begin{bmatrix} x_1 \ x_2 \end{bmatrix}
    = \begin{bmatrix} 2 \ 2 \end{bmatrix}$

    ```


    says that the second equation is $-2x_2 = 2$ so $x_2 = -1$. Plugging into the
    first equation:


    $x_1 + 2(-1) = 2$, so $x_1 = 4$.


    This is called back-substitution.


    # 11.2.2.2 Gauss-Jordan


    The Gauss-Jordan elimination method starts the same way that instead of back-substitution,
    the Gauss elimination method does, but then instead consists of:


    +   - Creating the augmented matrix [A b]


    +   - Forward elimination by applying EROs to get an upper triangular form


    +   - Back elimination to a diagonal form which yields the solution


    For a $2 \times 2$ system, this would yield


    ```

    $$\begin{bmatrix} a_{11} & a_{12} & b_1 \ a_{21} & a_{22} & b_2 \end{bmatrix}
    \to \begin{bmatrix} a''_{11} & 0 & b''_1 \ 0 & a''_{22} & b''_2 \end{bmatrix}$

    ```


    and for a $3 \times 3$ system,


    Notice that the resulting diagonal form does not include the right-most column.


    Example for the $2 \times 2$ system, forward elimination yielded the matrix:


    ```

    $$\begin{bmatrix} 1 & 2 \ 0 & -2 \end{bmatrix}$

    ```


    Now, to continue with back elimination, we need a 0 in the $a_{12}$ position.


    ```

    $$\begin{bmatrix} 1 & 2 \ 0 & -2 \end{bmatrix} r_1 + r_2 \to r_1 \ \begin{bmatrix}
    1 & 0 \ 0 & -2 \end{bmatrix}$

    ```'
