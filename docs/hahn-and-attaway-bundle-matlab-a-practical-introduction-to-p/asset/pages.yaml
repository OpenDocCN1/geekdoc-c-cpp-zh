  md: 'Nesting if-else statements in this way can be used to choose from among three,
    four, five, six, or more options—the possibilities are practically endless!


    This is actually an example of a particular kind of nested if-else called a cascading-else
    statement. In this type of nested if-else statement, the conditions and actions
    cascade in a stair-like pattern.


    # The Elif Clause


    # The Programming Concept


    In most programming languages, choosing from multiple options means using nested
    if-else statements. However, MATLAB has another method of accomplishing this,
    using the elseif clause.


    # The Efficient Method


    To choose from among more than two actions, the elseif clause is used. For example,
    if there are n choices (where n > 3 in this example), the following general form
    would be used:


    ```

    if condition1

    action1

    elseif condition2

    action2

    elseif condition3

    action3

    % etc: there can be many of these

    else

    action % the nth action

    end

    ```


    The actions of the if, elseif, and else clauses are naturally bracketed by the
    reserved words if, elseif, else, and end.

    For example, the previous example could be written using the elseif clause rather
    than nesting if-else statements:


    ```

    if x < -1

    y = 1;

    elseif x > -1 && x < 2

    y = x^2;

    else

    y = 4;

    end

    ```


    So, there are three ways of accomplishing this task: using three separate statements,
    using nested if-else statements, and using an if statement with elseif clauses,
    which is the simplest.'
  merge: -1
  pgno: 110
