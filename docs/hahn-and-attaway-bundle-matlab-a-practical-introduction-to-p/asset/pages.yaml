  md: '# CHAPTER 12 Basic Statistics, Searching, and Sorting


    To implement this, we will use variables *low* and *high* to specify the range
    of values to search. To begin, the value of *low* will be 1, and the value of
    *high* will be the length of the vector. The variable *mid* will be the index
    of the element in the middle of the range from *low* to *high*. If the key is
    not found at *mid*, there are two possible ways to adjust the range. If the key
    is less than the value at *mid*, we change *high* to *mid - 1*. If the key is
    greater than the value at *mid*, we change *low* to *mid + 1*.


    An example is to search for the key of 91 in the vector


    | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---|---|---|---|--|

    | 70 | 80 | 85 | 91 | 95 | 100 |


    The following table shows what will happen in each iteration of this search algorithm.


    | Iteration | Low | High | Mid | Found? | Action |

    |---|---|---|---|---|---|n| 1 | 1 | 6 | 3 | No | Move low to mid + 1 |

    | 2 | 4 | 6 | 5 | No | Move high to mid – 1 |

    | 3 | 4 | 4 | 4 | Yes | Done! Index is mid |


    The key was found in the fourth element of the vector.


    Another example: search for the key of 82:


    | Iteration | Low | High | Mid | Found? | Action |

    |---|---|---|---|---|---|n| 1 | 1 | 6 | 3 | No | Move high to mid – 1 |

    | 2 | 1 | 2 | 1 | No | Move low to mid + 1 |

    | 3 | 2 | 2 | 2 | No | Move low to mid + 1 |

    | 4 | 3 | 2 | → this ends it! | |


    The value of *low* cannot be greater than *high*; this means the key is not in
    the vector. So, the algorithm *repeats* until either the key is found or until
    *low > high*, which means the key is not there.


    The following function implements this binary search algorithm. The function receives
    two arguments: the sorted vector, and a key (alternatively, the function could
    sort the vector). The values of *low* and *high* are initialized to the first
    and last indices in the vector. The output argument *out* is initialized to −1,
    which is the value that the function will return if the key is not found. The
    function loops until either *low* is greater than *high*, or until the key is
    found.'
  merge: -1
  pgno: 404
