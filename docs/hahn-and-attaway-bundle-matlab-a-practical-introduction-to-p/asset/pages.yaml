  md: '```

    >> res = 9 - 2;

    >>

    ```


    This would assign the result of the expression on the right side, the value 7,
    to the variable res; it doesn''t show that result. Instead, another prompt appears
    immediately. However, at this point in the Workspace Window the variables mynum
    and res can be seen.


    Note: In the remainder of the text, the prompt that appears after the result will
    not be shown.


    The spaces in a statement or expression do not affect the result, but make it
    easier to read. The following statement that has no spaces would accomplish exactly
    the same thing as the previous statement:


    ```

    >> res = 9-2;

    ```


    MATLAB uses a default variable name ans if an expression is typed at the prompt
    and is not assigned to a variable. For example, the result of the expression 6
    + 3 is stored in the variable ans:


    ```

    >> 6 + 3

    ans =

    9

    ```


    This default variable is reused just when an expression is typed at the prompt.


    A short-cut for retyping commands is to press the up-arrow ↑, which will go back
    to the previously typed command(s). For example, if you decided to assign the
    result of the expression 6 + 3 to the variable res instead of using the default
    ans, you could press the up-arrow and then the left-arrow to modify the command
    rather than retyping the whole statement:


    ```

    >> res = 6 + 3

    res =

    9

    ```


    This is very useful, if a long expression is entered with an error, and you want
    to go back to correct it.


    To change a variable, another assignment statement can be used that assigns the
    value of a different expression to it. Consider, for example, the following sequence
    of statements:


    ```

    >> mynum = 3

    mynum =

    3

    >> mynum = 4 + 2

    mynum =

    6

    ```'
