    # 11.1.5 Vector Operations


    Since vectors are just cases of matrices, the matrix operations described earlier
    (addition, subtraction, scalar multiplication, multiplication, transpose) work
    on vectors as well, as long as the dimensions are correct.


    For vectors, we have already seen that the transpose of a row vector is a column
    vector, and the transpose of a column vector is a row vector.


    To multiply vectors, they must have the same number of elements, but one must
    be a row vector and the other a column vector. For example, for a column vector
    c and row r:


