  md: '# 406 CHAPTER 13 Sights and Sounds


    ```

    >> get(f)

    Color = [0.8 0.8 0.8]

    Colormap = [(64 by 3) double array]

    Position = [360 502 560 420]

    Units = pixels

    Children = []

    Visible = on

    ```


    The position vector specifies [left bottom height]. The first two numbers, the
    left and bottom, are the distance that the lower left-hand corner of the figure
    box is from the lower left of the monitor screen (from the first and then from
    the bottom). The last two are the width and height of the figure itself. All these
    are in the default units of pixels.


    The Visible property on means that the Figure Window can be seen. When creating
    a GUI, however the normal procedure is to create the parent Figure Window and
    make it invisible. Then, all user interfaces are added to it, and properties are
    set. When everything has been completed, the GUI is made visible.


    Most user interfaces are created using uontrol. The Style property defines the
    type of object, as a string. For example, ''text'' is the Style of a static box,
    which is normally used as a label for other objects in the GUI, or for instructions.


    The following example creates a GUI that consists of a static box in a Figure
    Window. The figure is first created but made invisible. The color is white, and
    it is given a position. Storing the handle of this figure in a variable allows
    the script to refer to it later on, to set properties, for example. The uontrol
    function is used to create a text box, position (the vector specifies the left
    bottom height) within the Figure Window itself), and put a string in it. Note
    that the position is within the Figure Window, not within the screen. A name is
    put on top of the figure. The movegui function moves the figure to the center
    of the screen. Finally, when everything has been completed, the GUI is made visible.
    The end is at the end of the function because in the next examples, we will have
    nested functions that require end statements.


    ```

    simple_gui.m

    function simple_gui

    % This is a simple GUI that just has a static text box


    % Create the GUI but make it invisible for now

    % it is being initialized

    f = figure(''Visible'',''off'',''color'',''white'',''Position'',[300, 400, 450,
    250]);

    ```


    (Continued)'
