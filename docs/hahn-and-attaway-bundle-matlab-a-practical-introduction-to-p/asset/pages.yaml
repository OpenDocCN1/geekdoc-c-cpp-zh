  md: 'or calculate the product 1 * 2 * 3 * 4 * ... * n, which is called the factorial

    , written n!


    # The Programming Concept


    In order to do this, the basic algorithm is similar to finding a sum, except we

    need to multiply each value of the loop to a running product.

    diffrence is that while a running variable is initialized to 0, a running

    product variable must be initialized to 1. This is so that the first time the
    value is

    multiplied by it, it does not change the original value.


    ```

    myfact.m

    function runprod = myfact (n)

    % This function returns the product of

    % integers from 1 to n, or n!

    runprod = 1;

    for i = 1:n

    runprod = runprod * i;

    ```


    Any positive integer argument could be passed to this function, and it will

    calculate the factorial of that number. For example, if 5 is passed, the function

    will calculate and return 1 * 2 * 3 * 4 * 5, or 120:


