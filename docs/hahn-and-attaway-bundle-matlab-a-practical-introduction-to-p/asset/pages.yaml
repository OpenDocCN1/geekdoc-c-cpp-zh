    # 8.3 USING MAT-FILES FOR VARIABLES


    In addition to the file types, MATLAB has functions that allow reading and saving
    variables from files. These files are called MAT-files (because the extension
    on the file name is .mat), and they store the names and contents of variables.
    Variables can be written to MAT-files, append to, and read from them.


    **Note:** MAT-files are very different from the data files that we have worked
    so far. Rather than just storing data, MAT-files store variable names and values.


    # 8.3.1 Writing Variables to a File


    The **save** command can be used to write variables to a file, or append variables
    to a MAT-file. By default, the **save** function writes to a MAT-file. It can
    either save the entire workspace (all variables that have been created), or a
    subset of the workspace (including, for example, just one variable). The **save**
    function will save the file in the current directory, so it is important to set
    that correctly.


    To save all workspace variables in a file, the command is:


    ```

    save filename

    ```


    The .mat extension is added automatically to the file. The contents of the file
    can be displayed using **who** with the -file qualifier:


    ```

    who -file filename

    ```


