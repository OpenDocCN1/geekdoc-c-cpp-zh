    # 1.5.5 Using Functions with Vectors and Matrices


    Since MATLAB is written to work with vectors and matrices, an entire vector or
    matrix can be passed as an argument to a function. MATLAB will evaluate the function
    on every element, and return as a vector or matrix with the same dimensions as
    the original. For example, we could pass the following vector, vec, to the **abs**
    function in order to get the absolute value of every element.


    ```

    >> vec = -3:4

    vec =

    -3 -2 -1 0 1 2 3

    ```


    ```

    >> abs(vec)

    ans =

    3 2 1 0 1 2 3

    ```


    The original vector **vec** has eight elements, and since the **abs** function
    is evaluated for every element, the resulting vector also has eight elements.


    This would also be the case for matrices:


    ```

    >> mat = randint(2,3,[-5,5])

    mat =

    -5 -1 0

    3 5 -1

    ```


    ```

    >> abs(mat)

    ans =

    5 1 0

    3 5 -1

    ```


    We will see much more on operations and functions of arrays (vectors and matrices)
    in Chapters 4 and 11.


