  md: '# 14.1 Fitting Curves to Data


    be derived here; the derivations can be found in the MATLAB help browser by doing
    a search for "least squares".


    This is implemented as a function mylinfit that receives two vectors x and y,
    and returns the values of m and b. This is the same algorithm used by the polyfit
    function for a degree 1 polynomial, so it returns the same values.


    ```

    mylinfit.m

    function [m,b] = mylinfit(x,y)

    % least squares regression for a straight line

    n = length(x); % Assume y has same length

    numerator = n * sum(x * y) - sum(x)*sum(y);

    denom = n * sum(x .^ 2) - (sum(x))^2;

    m = numerator/denom;

    b = mean(y) m*mean(x);


    >> x = [-1 1 2];

    >> y = [-1 0 3];

    >> [m b] = mylinfit(x,y)

    m=

    1.2143

    b=

    -0.1429

    >> polyfit(x,y,1)

    ans=

    1.2143 -0.1429

    ```


    The least squares fits the sum of the squares of the differences between the actual
    data and the data predicted by the line. The “best” straight line in this case
    has been determined to be y = 1.2143x - 0.1429.


    If we did not know that was the best line, we might instead guess that the best
    line fits is the data line y = x. The plot is in Figure 14.5.


    This straight line goes through one of the points, splits the other two points,
    in that one is one unit below the line and the other is one above the line. So,
    it seems as though the data fits well. However, we will compare this line to the
    line found by polyfit and the function mylinfit.


    > FIGURE 14.5

    The line y = x and three data points.


    ![](img/0dc331dc1ec8e322a2340be844751b63_447_0.png)'
