  md: '# Advanced File Input and Output


    # KEY WORDS


    +   - file input and output open the file

    - file types close the file

    - lower level file I/O file identifier

    - function end of the file


    # CONTENTS


    +   8.1 Lower Level File I/O Functions ......... 254

    8.2 Writing and Reading Spreadsheet Files ......... 264

    8.3 Using MAT-Files for Variables ......... 266


    This chapter extends the input and output concepts that were introduced in Chapter
    2. In that chapter, we saw how to read values by the user using the input function,
    and also the output functions disp and fprintf, which display information in windows
    on the screen. For file input and output (file I/O), we used the load and save
    functions, which can read from a data file into a matrix, and write from a matrix
    to a data file. We also saw that there are three different operations that can
    be performed on files: reading files, writing to files (implying work to the beginning
    of a file), and appending to a file (writing to the end of a file).


    There are many different file types, which use different filename extensions.
    For far, using load and save, we have worked with files in the ASCII format, which
    typically use either the extension .dat or .txt. The load command works only if
    there are the same number of values in each line and the values are the same type,
    so that the data can be stored in a matrix; the save command writes only from
    a matrix to a file if data is to be written or to be read in a different format,
    lower level file I/O functions must be used.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'The MATLAB* software has functions that can read and write data from different
    file types such as spreadsheets; typically Excel spreadsheets have the filename
    extension .xls. It also has its own binary file type, which uses the extension
    .mat. These are usually called MAT-files, and can be used to store variables that
    have been created in MATLAB.


    In this chapter, we will introduce lower file input and output functions, as well
    as functions that work with different file types.


    # 8.1 LOWER LEVEL FILE I/O FUNCTIONS


    When reading from a data file, the load function works as long as the data in
    the file is “regular”—in other words, the kind of data on every line and in the
    format on every line—so that it can be read into a matrix. Data files are not
    always set up in this manner. When it is not possible to use load, MATLAB has
    what are called lower level file input functions that can be used. The file must
    be opened first, which involves creating the file and positioning an indicator
    at the beginning of the file. When the reading has been completed, the file must
    be closed.


    Similarly, the save function can write matrices to a file, but if the output is
    not a simple matrix there are lower level functions to write to files. Again,
    the file must be opened first and closed when the writing has been completed.


    The steps involved are:


    +   * Open the file.

    * Read from the file, write to the file, or append to the file.

    * Close the file.


    First, the steps involved in opening and closing the file will be described. Several
    functions perform the middle step of reading from or writing to the file will
    be described subsequently.


    # 8.1.1 Opening and Closing a File


    Files are opened with the fopen function. By default, the fopen function opens
    a file for reading. If another mode is desired, a permission string is used to
    specify which mode (e.g., writing or appending). The fopen function returns -1
    if it is not successful in opening the file, or an integer value, which becomes
    the file identifier if it is successful. This file identifier is then used to
    refer to the file when calling other I/O functions. The general form is:


    ```

    fid = fopen(''filename'', ''permission string'');

    ```


    The permission strings include:'
