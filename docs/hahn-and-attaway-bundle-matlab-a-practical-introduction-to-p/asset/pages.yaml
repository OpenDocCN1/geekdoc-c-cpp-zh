  md: '# 5.4.1 Persistent Variables


    Normally, when a function stops executing, the local variables from function are
    cleared. That means every time a function is called, memory is allocated and used
    while the function is executing, but released when it ends. With variables that
    are declared as persistent variables, however, the value is not cleared the next
    time the function is called, the variable still exists and retains its former
    value.


    The following program demonstrates this. The script calls a function func1, which
    initializes a variable count to 0, increments it, and prints the value. Every
    time the function is called, the variable is created, initialized to 0, changed
    to 1, and then cleared when the function exits. The script calls a function func2,
    which first declares a persistent variable count. If the variable has not yet
    been initialized, which will be the first time the function is called, it is initialized
    to 0. Then, like the first function, the variable is incremented and the value
    is printed. With the second function, however, when the function exits, the variable
    remains with its value, so the next time the function is called the variable is
    incremented again.


    ```

    persist.m

    % This script demonstrates persistent variables

    % The first function has a variable count

    fprintf(''This is what happens with a normal variable:\n'')

    func1

    func1

    % The second fn has a persistent variable count

    fprintf(''\nThis is what happens with a persistent variable:\n'')

    func2

    func2

    ```


    ```

    func1.m

    function func

    % This function increments a variable count

    count = 0;

    count = count + 1;

    fprintf(''The value of count is %d\n'',count)

    ```'
