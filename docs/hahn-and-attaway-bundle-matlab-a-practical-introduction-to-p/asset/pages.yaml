  md: '# 1.4 Characters and Encoding


    not a number. The most common character encoding is the American Standard Code
    for Information Interchange, ASCII. Standard ASCII has 128 characters, which have
    equivalent values from 0 to 127. The first 32 (integer values 0 through 31) are
    nonprinting characters. The letters of the alphabet are in order, which means
    ''a'' comes before ''b'', then ''c'' and so forth.


    The numeric functions can be used to convert a character to its equivalent numeric
    value (e.g., double will convert a int32 to an integer value using 32 bits). For
    example, to convert the character ''a'' to its numeric equivalent, the following
    statement could be:


    ```

    >> numequiv = double(''a'')

    numequiv =

    97

    ```


    This stores the double 97 in the variable numequiv, which shows that the character
    ''a'' is the ninety-eight character in the character encoding (since the equivalent
    numbers begin at 0). It doesn''t matter what type is used to convert ''a'', for
    example:


    ```

    >> numequiv = int32(''a'')

