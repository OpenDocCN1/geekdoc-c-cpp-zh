    all the elements in a vector in order to do something with each. In this case,
    we are adding every element to the vector to a running sum, which is stored in
    the output argument *outarg*. Notice that the loop variable, *i*, is used as the
    index into the vector. The first time through the loop, when *i* has value 1,
