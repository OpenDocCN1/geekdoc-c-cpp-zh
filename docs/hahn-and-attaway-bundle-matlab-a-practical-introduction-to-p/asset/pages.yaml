    With symbolic math, MATLAB works by default with rational numbers, meaning results
    are kept in fractional forms. For example, performing the expression 1/3 + 1/2
    would normally result in a double value:


    ```

    >> 1/3 + 1/2

    ans =

    0.8333

    ```


    However, by making the expression symbolic, the result is symbolic also. Any numeric
    function (e.g., double) could change that:


    ```

    >> sym(1/3 + 1/2)

    ans =

    5/6

    >> double(ans)

    ans =

    0.8333

    ```


    The numden function will return separately the numerator and denominator of a
    symbolic expression:


    ```

    >> sym(1/3 + 1/2)

    ans =

    5/6

    >> [n, d] = numden(ans)

    n =

    5

    d =\6

    ```


    ```

    >> [n, d] = numden((x^3 + x^2)/x)

    n =

    x^2*(x+1)

    d =\1

    ```


