  md: 'Another GUI object that can be created a slider. The slider object has a numerical
    value, and can be controlled by either clicking the arrows to move the value up
    or down, or by sliding the bar with the mouse. By default the numerical value
    ranges from 0 to 1, but these values can be modified using the Min and Max properties.


    The function `gui_slider` creates a Window with a slider that has a minimum value
    of 0 and a maximum value of 5. It uses text boxes to show the minimum and maximum
    values, and also the current value of the slider.


    ```

    gui_slider.m

    function gui_slider

    % This is a GUI with a slider

    f = figure(''Visible'', ...

    ''off'',.color'',''white'',.Position'', ...

    [360, 500, 300,300]);

    % Minimum and maximum values for slider

    minval = 0;

    maxval = 5;

    % Create the slider object

    slan = uicontrol(''Style'',''slider''.''Position'', ...

    [80,170,100,50], ...

    ''Min'', minval, ''Max'', maxval,''Callback'', @callbackfn);

    % Text boxes to show the minimum and maximum values

    hminintext = uicontrol(''Style'',''.text'',''BackgroundColor'',''white'', ...

    ''Position'', [40,175,30,30], ''String'', num2str(minval));

    hmtext = uicontrol(''Style'', ...

    ''text'',''BackgroundColor'',''white'', ...

    ''Position'', [190,175,30,30], ''String'', num2str(maxval));

    % Text box to show the current value (off for now)

    hstext = uicontrol(''Style'',''.text'',''BackgroundColor'',''white'', ...

    ''Position'', [120,100,40,40],''Visible'', ''off'');

    set(f,''Name'',''Slider Example'')

    movegui(f,''Visible'',.on'');

    % Call back function displays the current slider value

    (Continued)

    ```'
