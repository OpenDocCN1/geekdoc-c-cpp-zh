  md: '# 322 CHAPTER 11 Solving Systems of Linear Algebraic Equations


    +   - Using a matrix representation

    - Using the solve function (which is part of Symbolic Math Toolbox™) and vector
    operations


    In this chapter, we will first investigate matrix and vector operations and then
    use these to solve linear algebraic equations. Symbolic mathematics means doing
    mathematics on symbols. Some of the symbolic math functions, which are in Symbolic
    Math Toolbox in MATLAB, will also be introduced, including the solve function
    for solving equations.


    # 11.1 MATRIX DEFINITIONS


    As we have already seen, a matrix can be thought of as a table of values in which
    there are rows and columns. The general form of a matrix A (which is written as
    [A]) is shown here:


    ```

    A = \begin{bmatrix} a_{11} & a_{12} & \dots & a_{1n} \ a_{21} & a_{22} & \dots
    & a_{2n} \ \vdots & \vdots & \ddots & \vdots \ a_{m1} & a_{m2} & \dots & a_{mn}
    \end{bmatrix} = a_{ij} \ i=1,\dots,m; \ j=1,\dots,n

    ```


    This matrix has m rows and columns, so the size is m × n.


    A vector is a special case of a matrix, in which one of the dimensions (either
    m or n) is 1. A row vector is a 1 × n matrix. A column vector is an m × 1 matrix.
    A scalar is a special case of a matrix in which both m and n are 1, so it is a
    single value or a 1 × 1 matrix.


    # 11.1.1 Matrix Properties


    In this section we will define to equal some special properties of matrices.


    Two matrices are equal to each other only if all corresponding elements are equal
    to each other. In order for this to be true, their sizes must be the same as well.
    The definition is [A] = [B] if $a_{ij} = b_{ij}$ for all $i, j$.


    # The Programming Concept


    To test whether two matrices are equal to each other or not, both matrices are
    passed to a function that will return 1 for logical true if they are the same
    or 0 for logical false not (or if they are not the same size). To write our function,
    a flag is first set to 1, for logical. If the two matrices are not the same size,
    the flag is set to 0 for false. Otherwise, using a nested loop, each element in
    the first matrix argument mata is compared to the'
