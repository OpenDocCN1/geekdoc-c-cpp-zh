    & ... & a_{2n} \ a_{31} & a_{32} & a_{33} & ... & a_{3n} \ \vdots & \vdots & \vdots
    & \vdots & \vdots \ a_{m1} & a_{m2} & a_{m3} & ... & a_{mn} \end{bmatrix} = \begin{bmatrix}
    x_1 \ x_2 \ x_3 \ \vdots \ x_m \end{bmatrix}$

    ```


    **Solution set** is the set of all possible solutions to the system of equations
    (all sets of values for the unknowns solves the equations). All of linear equations
    have either:


    +   * No solutions

    * One solution

    * Infinitely many solutions


    One of the main concepts of the subject of **linear algebra** is the different
    methods of solving (or attempting to solve!) systems of linear algebraic equations.
    MATLAB has many functions that assist in this process.


    Once the system of equations has been written in matrix form, what we want is
    to solve the equation Ax = b for x. To do this, we need to isolate x on one side
    of the equation. If we were working with scalars, we would divide both sides of
    the equation by x. In fact, with MATLAB we use the **divided into** operator to
    do this. However, most languages do not work with matrices, so we instead multiply
    both sides of the equation by the inverse of the coefficient matrix A:


    ```

    $A^{-1}Ax = A^{-1}b$

    ```


    Then, multiplying a matrix by its inverse results in the identity matrix I, and
    because multiplying any matrix by I results in the original matrix, we have:


    ```

    $Ix = A^{-1}b$

    ```


    or


    ```

    $x = A^{-1}b$

    ```


    This means that the column vector of unknown x is found as the inverse of matrix
    A multiplied by the column vector b. So, if we can find the inverse of A, we can
    solve for the unknown in x.


    For example, consider the following three equations with three unknowns $x_1$,
    $x_2$ and $x_3$:


    ```

    $4x_1 - 2x_2 + 1x_3 = 7$

    1x_1 + 1x_2 + 5x_3 = 10$

    2x_1 + 3x_2 - 1x_3 = 2$$

    ```'
