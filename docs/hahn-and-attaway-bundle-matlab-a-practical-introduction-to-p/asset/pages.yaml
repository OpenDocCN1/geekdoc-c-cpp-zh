    # 10.6.2 Plotting File Data


    It is necessary to read data from a file and plot. Normally, this entails knowing
    the format of the file. For example, let us assume that a company has two divisions
    A and B. A file named ''ab06'' has four lines in it (we will assume this), with
    the sales figures (in millions) for the two divisions for each quarter of the
    year 2006. For example, the file might look like this (the format will be exactly
    like this):


    ```

    A5.2B6.4

    A3.2B5.5

    A4.B4.3

    A4.5B2.2

    ```


    The following script reads the data and plots in one Figure Window the data as
    bar charts. The script prints an error message if the file open is not successful
    or if the file close was not successful. The axis command is used to focus the
    x-axis to range from 0 to 3 and the y-axis from 0 to 8, which will result in the
    axes shown here. The numbers 1 and 2 would show on the x-axis rather than the
    labels A and B by default. The set function changes the TickLabel property to
    use the strings in the cell array as labels on the tick marks on the x-axis; gca
    returns the handle to the axes in the current figure (it stands for ''get current
    axes'')


    ![](img/0dc331dc1ec8e322a2340be844751b63_329_0.png)


