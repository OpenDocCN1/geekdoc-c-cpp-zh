  md: '# 3.2 The If Statement


    A condition is a relational expression that is conceptually, or logically, either
    true or false. The action is a statement, or a group of statements, that will
    be executed if the condition is true. When the if statement is executed, the first
    condition is evaluated. If the value of the condition is true, the action will
    be executed, and if not, the action will not be executed. The action can be any
    number of statements until the reserved word end; the action is naturally bracketed
    by the reserved words if and end. (Note: This is different from the end that is
    used as an index into a vector or matrix.)


    # PRACTICE 3.1


    Think about what would be produced by the following expressions, and then type
    to verify your answers.


    ```

    4 > 3 + 1

    ''e'' == ''d'' + 1

    3 < 9 - 2

    (3 < 9) - 2

    4 == 3 + 1 && ''d'' > ''c''

    3 >= 2 || ''x'' = ''y''

    xor(3) >= 2, ''x'' = ''y''

    xor(3) >= 2, ''x'' ~ ''y''

    ```


    For example, the following if statement checks whether the value of a variable
    is negative. If it is, the value is changed to a positive number by using the
    absolute value function; otherwise nothing is changed.


    ```

    if num < 0

    num = abs(num)

    end

    ```


    If statements can be entered in the Command Window, although they generally make
    more sense in scripts or functions. In the Command Window, the if statement would
    be entered, then the Enter key, the action, the Enter key, and finally end and
    Enter; the results will immediately follow. For example, the previous if statement
    is shown twice here. Notice, that the output from the assignment is not suppressed,
    so the result of the action will be shown if the action is executed and the first
    time of the variable is negative so the action is executed and the variable is
    modified, in the second case the variable is positive so the action is skipped.


    ```

    >> num = -4;

    >> num < 0

    num = abs(num)

    end

    num = =

    4

    >> num = 5;

    >> num < 0

    num = abs(num)

    end

    >>

    ```'
