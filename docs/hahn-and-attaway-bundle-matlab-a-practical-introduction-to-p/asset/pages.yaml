    # 11.2.1 Solving 2 × 2 Systems of Equations


    Although this seem easy in MATLAB, in general finding solutions to systems of
    equations is not. Systems that are 2 × 2 are, however, fairly straightforward,
    and there are several methods of solution for these systems which MATLAB has built-in
    functions.


    Consider the 2 × 2 system of equations:


    x₁ + 2x₂ = 2

    2x₁ + x₂ = 6


