    The function rmfield removes a field from a structure. It returns a new structure
    with the field removed, but does not modify the original structure (unless the
    returned structure is assigned to variable). For example, the following would
    remove the code field from the newpack structure, but store the resulting structure
    in the default variable ans. The value of newpack remains unchanged.


    ```

    >> rmfield(newpack, ''code'')

