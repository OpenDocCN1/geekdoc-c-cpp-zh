    # 4.4 WHILE LOOPS


    The while statement is used as the conditional loop in MATLAB; it is used

    to repeat an action when ahead of time its not known how many times the action

    will be repeated. The general form of the while statement is:


    ```

    while condition

    action

    end

    ```


    The action, which consists of any number of statement(s), is executed as long

    as the condition is true. The condition must eventually become false to avoid

    an infinite loop. If this happens, Ctrl-C will exit the loop.


    The why works is that first the condition is evaluated. If it logically true,
    the

    action is executed. So, to begin with it is just like an if statement. However,
    at

    point the condition is evaluated again. If it is still true, the action is executed

    again. Then, the action is... eventually, this has to stop! Eventually the

    action has to change something in the condition so it becomes false.


    As an example of a conditional loop, we will write a function that will find the

    factorial that is greater than the input argument hig. Previously, we wrote a
    function

    to calculate a particular factorial. For example, to calculate 5! we found the

    product 1 * 2 * 3 * 4 * 5. In that case a for loop was used, since it was known
    that

    the loop would be repeated five times. Now we do not know how many times the

    loop will be repeated. The basic algorithm is to have two variables, one iterates'
