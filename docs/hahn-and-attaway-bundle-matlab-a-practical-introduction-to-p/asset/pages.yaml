    # 2.6.2 Appending Data to a Data File


    Once a text file exists, data can be appended to it. The format is the same as
    previously, with the addition of the qualifier -append. For example, creates a
    new random matrix and appends it to the file created:


    ```

    >> mymat = rand(3,3)

    mymat =

    ```


    ```

    0.9218 0.4057 0.4103

    0.7382 0.9355 0.8936

    0.1763 0.9169 0.0579

    ```


    ```

    >> save testfile.dat mymat -ascii -append

    ```


    This results in the file testfile.dat containing


    ```

    0.4565 0.8214 0.6154

    0.0185 0.4447 0.7919

    0.9218 0.4057 0.4103

    0.7382 0.9355 0.8936

    0.1763 0.9169 0.0579

    ```


    Note: Although technically any size matrix could be appended to this data file,
    in order to read it back into a matrix later there would have to be the same number
    of values on every row.


    # 2.6.3 Reading from a File


    Once a file has been created (previously), it can be read into a variable. If
    it is a data file, the load function will read from the file filename (e.g., the
    extension be dat) and create a matrix with the same name as the file. For example,
    if the data file testfile.dat had been created as shown in the previous section,
    this would read it from:


    ```

    >> clear

    >> load testfile.dat

    >> who

