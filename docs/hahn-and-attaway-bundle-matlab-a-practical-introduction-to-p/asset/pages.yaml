    # 1.3.4 Constants


    Variables are used to store values that can change, or are not known ahead of
    time. Most languages also have the capacity to store constants, which are values
    ahead of time, and cannot possibly change. An example of a constant value would
    be pi, or π, which is 3.14159.... In MATLAB, there are functions that return some
    of these constant values. Some of include:


    | pi | 3,14159... |

    | i | √1 |

    | j | √1 |

    | inf | infinity |

    | NaN | stands for "not a number"; e.g., the result of 0/0 |


    # QUICK QUESTION!


    There is no built-in constant for e(2.718), so how can that value be obtained
    in MATLAB?

    Answer:

    The exponential function exp, is equivalent to exp(1).


    ```

    >> exp(1)

    ans =

    2.7183

    ```


    # 1.3.5 Types


    Every expression, variable, has a type associated with it. MATLAB supports many
    types of values, which are called classes. A class is essentially a combination
    of a type and the operations that can be performed on that type. For example,
    there are types different kinds of numbers.


    For float or real numbers, or in other words with a decimal place (e.g., 5.3),
    there are two basic types: single and double. The name of the type double is short
    for double precision; it stores larger numbers than single. MATLAB uses a floating
    point representation for these numbers.'
