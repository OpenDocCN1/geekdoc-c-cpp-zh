    Also, polyval can be used to extrapolate beyond the given data points, for example,
    to estimate the temperature at 1 P.M.:


    ```

    >> polyval(coeffs,1)

    ans =

    54.6000

    ```


    The better the curve fit, the more exact this interpolated and extrapolated values
    will be.


