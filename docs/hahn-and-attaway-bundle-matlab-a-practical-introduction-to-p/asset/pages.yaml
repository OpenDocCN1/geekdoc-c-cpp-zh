    True color matrices are another way to represent images. True matrices are three-dimensional
    matrices. The first two coordinates are the coordinates of the pixel. The third
    index is the color component; (1) is the red, (2) is the green, and (3) is the
    blue. Each element in the matrix is of type uint8, which is unsigned integer using
    8 bits. With 8 bits, 2 (or 256) values can be stored and the range of values is
    0 to 255. The minimum value, 0, represents the darkest hue available all 0s results
    in a black pixel. The maximum value, 255, represents the brightest hue. For example,
    if the values for a given pixel coordinates px and py (px,py,1) is 255, (px,py,2)
    is 0 and (px,py,3) is 0 then that pixel will be red.


