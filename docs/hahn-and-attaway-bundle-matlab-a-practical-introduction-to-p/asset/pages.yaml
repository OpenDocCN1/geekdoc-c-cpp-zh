    # 10.1.2 Plot and bar


    Besides **plot** and **bar**, there are other plot types such as *histograms*,
    *stem plots*, *area plots* and *pie charts*, as well as other functions that customize
    graphs.


    Described in this section are some of the other plotting functions. The functions
    **bar, area, and and stem** essentially play the same data as the **plot function**,
    The **bar function** draws a bar chart (as we have seen before), **bar** draws
    a horizontal bar chart, **area** draws the plot as a continuous curve and fills
    in under the curve that is created, and **stem** draws a stem plot.


    For example, the following script creates a Figure Window that uses a 2 x 2 **subplot**
    to demonstrate these four plots using the x and y points (see Figure 10.2).


    ```

    subplottypes.m

    % Subplot to show plot types

    x = 1:6;

    y = [33 11 5 9 22 30];

    subplot(2,2,1)

    bar(x,y)

    title(''bar'')

    subplot(2,2,2)

    bar(x,y)

    title(''bar'')

    ```


