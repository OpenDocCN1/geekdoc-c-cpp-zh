  md: '# CHAPTER 4 Looping


    through the values 1, 2, 3, and so on, and one that stores the factorial of the
    iterator at each step. We start with 1, and 1 factorial, which is 1. Then, we
    check the factorial. If it is not greater than high, the iterator variable will
    then increment to 2, and find factorial (2). If this is not greater than high,
    the iterator will then increment to 3, and the function will find factorial (6).
    This continues until we get the first factorial that is greater than high. So,
    the process of incrementing a variable and finding its factorial is repeated until
    we get the first value greater than high. This is implemented using a while loop:


    ```

    factctigh.m

    function facgt = factctigh(high)

    % Finds the first factorial > high

    i=0;

    fac=1;

    while fac <= high

    ni=i+1;

    fac = fac * i;

    end

    facgt = fac;

    ```


    Here is an example of calling function, passing 5000 for the value of the input
    argument high.


    ```

    >> factctigh(5000)

    ans = 5040

    ```


    The iterator variable i is initialized to 0, and the running product variable
    fac, which will store the factorial of each value of i, is initialized to 1. The
    first time the while loop is executed, the condition is true: 1 is less than or
    equal to 5000. So, the action of the loop is executed, which is to increment i
    to 1 and fac to 1 (1 * 1). After the execution of the loop, the condition is evaluated
    again. Since it will still be true, the action is executed: i is incremented to
    2, and fac will get the value 2 (1 * 2). The value 2 is still <= 5000, so the
    action will be executed again: i will be incremented to 3, and fac will get the
    value 6 (2 * 3). This continues until the first value of fac is found that is
    greater than 5000. As soon as fac gets to this value, the condition will be false
    and the while loop will end. At that point the factorial is assigned to the output
    argument, which returns the value.


    The reason that i is initialized to 0 rather than 1 is that the first time the
    loop action is executed, i becomes 1 and fac we have 1 and 1!, which is 1.


    Notice that the output of all assignment statements is suppressed in the function.'
