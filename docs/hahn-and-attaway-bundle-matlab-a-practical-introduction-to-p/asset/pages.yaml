  md: '# Preface


    MOTIVATION

    The purpose of this book is to teach basic programming concepts and skills needed
    for basic problem solving, all using MATLAB® as the vehicle. MATLAB is a powerful
    software package that has built-in functions to accomplish a diverse range of
    tasks, from mathematical operations to three-dimensional imaging. Additionally,
    MATLAB has a complete set of programming constructs that allows users to customize
    programs to their own specifications.


    There are many books that introduce MATLAB. There are two basic flavors of these
    books: those that demonstrate the use of the built-in functions in MATLAB, with
    a chapter or two on some programming concepts, and those that cover only the programming
    constructs without mentioning any of the built-in functions that make MATLAB efficient
    to use. Someone who learns the built-in functions will be well-prepared to use
    MATLAB, but would not understand basic programming concepts. Person then would
    not be able to learn a language such as C++ or Java without taking another introductory
    course, or reading another book, on the programming concepts. Conversely, anyone
    who learns only programming concepts (using any language) would tend to write
    highly inefficient code using control statements to solve problems, realizing
    in many cases that are not necessary in MATLAB.


    This book instead takes a hybrid approach, introducing both the programming and
    the efficient uses. The challenge for students is that it is nearly impossible
    to predict whether they will fail to know programming concepts later on or whether
    a software package as MATLAB will suffice for their careers. Therefore, the best
    approach for beginning students is to give them both—the programming concepts
    and the efficient built-in functions. Since MATLAB is very easy to use, it is
    a perfect platform for this approach to teaching programming and problem solving.


    Since programming concepts are critically important to this book, emphasis is
    not placed on the time-saving features that evolve with every new MATLAB release.
    For example, in current versions of MATLAB statistics on variables are'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'available readily in the Workspace window. This is not shown in any detail
    in the book, since whether this feature is available depends on the version of
    the software, and because of the desire to explain the concepts in the book.


    # KEY FEATURES


    # Side-by-Side Programming Concepts and Built-In Functions


    The most important, and unique, feature of this book is that it teaches concepts
    and the use of the built-in functions in MATLAB side. It starts with basic programming
    concepts such as variables, assignments, input/output, selection, and loop statements.
    Throughout the rest of the book, often a problem will be introduced and then solved
    using the “programming concept” and also using the “efficient method.”


    # Systematic Approach


    Another key feature is that the book takes a very systematic, step-by-step approach,
    building on concepts throughout the book. It is tempting to show built-in functions
    or features early on with a note that says “we will do this later.” This book
    does not that; all functions are covered before they are used in examples. Additionally,
    basic programming concepts will be explained carefully and systematically. Very
    basic concepts such as calculating a sum, counting in a conditional loop, and
    error-checking are not found in many texts but will be covered here.


    # File Input/Output


    Many applications in engineering and the sciences involve manipulating large data
    sets that are stored in external files. Most MATLAB texts at least mention the
    save and load, and in some cases also of the lower file input/output functions.
    Since file input and output is fundamental to so many applications, this book
    will cover several low-level file input/output functions, as well as reading from
    writing to spreadsheet files. Later chapters will also deal with audio and image
    files. These file input/output concepts are introduced gradually: first load and
    save in Chapter 2, then lower level functions in Chapter 8, and finally sound
    and images in Chapter 13.


    # User-Defined Functions


    User-defined functions are a very important programming concept, and many times
    the nuances and differences between types of functions, function calls versus
    function headers, and so on, can be very confusing to beginning programmers. Therefore
    these concepts are introduced gradually. First, arguably'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'the easiest type of functions to understand, those that calculate and return
    one single value, are demonstrated in Chapter 2. Later, functions that return
    no multiple values are introduced in Chapter 5. Finally, advanced function features
    are shown in Chapter 9.


    # Advanced Programming Concepts


    In addition to the basics, some advanced programming concepts as string manipulation,
    recursion, anonymous functions, and variable number of arguments to functions
    are covered. Sorting, and indexing are also addressed. All these are approached
    systematically; for example, cell arrays are covered before they are used in file
    input functions and as labels on pie charts


    # Problem-Solving Tools


    In addition to the programming concepts, some basic mathematics necessary for
    solving many problems will be introduced. These will include statistical functions,
    solving of linear algebraic equations, and fitting curves to data. The use of
    complex numbers and calculus (integration and differentiation) will also be introduced.
    The basic math will be explained and the built-in functions in MATLAB to perform
    these tasks will be described.


    # Plots, Imaging, and GUIs


    Simple two-dimensional plots are introduced very early in the book (Chapter 2)
    so that plot examples can be used throughout. Chapter 10 shows many plot types,
    and customizing plots and how the graphics properties are handled in MATLAB. This
    chapter makes use of strings and cell arrays to customize labels. Also, there
    is an introduction to image processing and the basics to understand programming
    Graphical User Interfaces (GUIs) in Chapter 13.


    # LAYOUT OF TEXT


    This text is divided into two parts: Part I covers the programming constructs
    and demonstrates the programming versus efficient use of built-in functions to
    solve problems. Part II covers some applications, including plotting, image processing,
    and mathematics needed in basic problem solving. The first four chapters cover
    the basics in MATLAB and in programming, and are all prerequisites for the rest
    of the book. After that, many chapters in the applications section can be introduced
    when desired, to produce a customized flow of topics in the. This is true to an
    extent, although the order of the chapters has been chosen carefully to ensure
    that the coverage is systematic.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# PART I: PROGRAMMING AND PROBLEM SOLVING USING MATLAB


    Chapter 1: Introduction to MATLAB covers expressions, operators, characters, variables,
    and assignment statements. Scalars, vectors, and matrices are introduced, as many
    built-in functions that manipulate them.


    Chapter 2: Introduction to MATLAB Programming introduces the idea of algorithms
    and scripts. This includes simple input and output, and commenting. Scripts are
    then used to create and customize plots, and to file input and output. Finally,
    the concept of a user-defined function is introduced with just the type of function
    that calculates and returns a single value.


    Chapter 3: Selection Statements introduces relational expressions and their use
    in if statements, with else and elseif clauses. The switch statement is also demonstrated,
    as is the concept of choosing from a menu. Also, functions that return true or
    false are introduced.


    Chapter 4: Looping introduces the concepts of counted and conditional loops. Many
    common applications such as summing, counting, and error-checking are covered.
    Nested loops and combining loops are systematically introduced. In this chapter,
    the idea of vectorizing code is introduced, which essentially rewriting code that
    uses loops to more efficiently make use of built-in functions, and the fact that
    operations be done on vectors and matrices in MATLAB.


    Concepts explained in the first four chapters are assumed throughout the rest
    of the book.


    Chapter 5: MATLAB Programs covers more on scripts and user-defined functions.
    User-defined functions that return more than one value as well as those that do
    not return anything are introduced. The concept of a program in MATLAB that consists
    of a script that calls user-defined functions is demonstrated with examples. A
    longer menu-driven program is shown as a reference, but could be omitted. Subfunctions
    and scope of variables are also introduced, as are debugging techniques.


    The concept of a program is used throughout the rest of the book.


    Chapter 6: String Manipulation covers many built-in string manipulation functions
    as well as converting string and number types. Several examples include using
    strings in plot labels and input prompts.


    Chapter 7: Data Structures introduces two main data structures: cell arrays and
    structures. Once basic structures are covered, more complicated data structures
    such as nested structures and vectors of structures are also introduced. Cell
    arrays are used in several applications in later chapters,'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'such as file input in Chapter 8, variable number of function arguments in Chapter
    9, and plot labels in Chapter 10, and therefore are considered important and are
    covered first.


    **Chapter 8: Advanced File Input and Output** covers lower level input/output
    statements that require opening and closing the file. Functions that can read
    the entire file at once as well as those that require reading one at a time are
    demonstrated. Additionally, reading from and writing to spreadsheet files and
    .mat files store MATLAB variables are introduced. Cell arrays and string functions
    are used extensively in this chapter.


    **Chapter 9: Advanced Functions** covers more advanced features and types of functions,
    such as anonymous functions, nested functions, and recursive functions. Function
    handles, and their use with anonymous functions and function handles are introduced.
    The concept of having a variable number of input and output arguments to a function
    is introduced; this is implemented using cell arrays. String functions also are
    used in examples in this chapter.


    # PART II: APPLICATIONS


    **Chapter 10: MATLAB Plots** continues with more on the plot functions introduced
    in Chapter 2. Different plot types such as pie charts are introduced, as are customizing
    plots using cell arrays and string functions. The notion of handle graphics is
    covered, and some graphics properties as line width and color are introduced.
    Applications that involve reading data from files and plotting using cell arrays
    and string functions.


    **Chapter 11: Solving Systems of Linear Algebraic Equations** introduces the two
    basic methods that can be used in MATLAB to solve these systems of equations:
    using a matrix representation, and using symbolic mathematics. First, matrix and
    vector operations and matrix definitions are described. This section can be covered
    at any point after Chapter 4. Then, matrix solutions using the Gauss-Jordan and
    Gauss-Jordan elimination methods are described. Finally, some Symbolic Math Toolbox
    functions are shown including those that solve equations. This method returns
    a structure as a result.


    **Chapter 12: Basic Statistics, Searching, and Sorting** starts with some of the
    built-in statistical and set operations in MATLAB. Since some of these require
    a sorted data set, methods of sorting are described. Finally, the concepts of
    indexing into a vector and searching a vector are introduced. Sorting a vector
    of structures and indexing into a vector of structures are described, but these
    sections can be omitted if desired. A recursive binary search function can also
    be omitted.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Chapter 13: Sights and Sounds builds on some handle graphics material from
    Chapter 10. It also briefly discusses sound files, and introduces image processing.
    An introduction to programming GUIs is also given. Nested functions are used in
    the GUI examples. A patch function uses a structure.


    Chapter 14: Advanced Mathematics covers three basic topics: curve fitting, complex
    numbers, and integration and differentiation in calculus. Symbolic expressions
    are used in several sections in this chapter.


    # PEDAGOGICAL FEATURES


    There are several pedagogical tools that are used throughout this book that are
    intended to make it easier to learn.


    First, the book takes a conversational tone with sections called "Quick Question!"
    These are designed to stimulate thought about the material that has been covered.
    The question is posed, and then the answer is given. It will be most beneficial
    if you think about the question before reading the answer! In any case, they should
    not be skipped over the answers often contain very useful information.


    "Practice!" problems are given throughout the chapters. These are very simple
    problems that drill the material just covered.


    When some problems are introduced, they are solved using both "The Programming
    Concept" and "The Efficient Method." This facilitates understanding the efficient
    ways of using MATLAB, and also the programming concepts used in these efficient
    functions and operators.


    The End of Chapter Summary contains, where applicable, several sections:


    +   - Common Pitfalls: A list of common mistakes that are made, and how to avoid
    them.


    +   - Programming Style Guidelines: In order to encourage "good" programs, which
    others can actually understand, the programming chapters will have guidelines
    that will make programs easier to read and therefore easier to work with and modify.


    +   - Key Terms: A list of the key terms covered in the chapter, in sequence.


    +   - MATLAB Functions and Commands: A list of the MATLAB built-in functions and
