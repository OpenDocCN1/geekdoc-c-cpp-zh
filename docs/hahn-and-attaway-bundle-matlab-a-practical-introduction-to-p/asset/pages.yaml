- img_proc: true
  md: '# 14.1.1 Polynomials


    Simple curves are *polynomials* of different *degrees*, or *orders*. The degree
    is the integer of the highest exponent in the expression. For example,


    +   - A straight line is a first order (or degree 1) polynomial of the form $ax
    + b$, or more explicitly $ax^1 + b$.

    - A quadratic is a second order (or degree 2) polynomial of the form $ax^2 + bx
    + c$.

    - A cubic (degree 3) is of the form $ax^3 + bx^2 + cx + d$.


    MATLAB represents a polynomial as a row vector of coefficients. For example, the
    polynomial $x^3 + 2x^2 - 4x + 3$ would be represented by the vector $[1 2 -4 3]$.


    The polynomial $2x^4 - x^5$ would be represented by $[2 0 -1 0 5]$; notice the
    zero terms for $x^3$ and $x^1$.


    There are built-in functions **sym2poly** and **poly2sym** convert from symbolic
    expressions to polynomial vectors and vice versa, for example:


    ```

    >> myp = [1

    ```


    The **roots** function in MATLAB can be used to find the roots of an equation
    represented by a polynomial. For example, for the mathematical function (Note:
    this is a mathematical expression, not MATLAB!),


    $f(x) = 4x^3 - 2x^2 - 8x + 3$


    to solve the equation $f(x) = 0$:


    ```

    >> roots([4 -2 -8 3])

    ans =

    1.3660

    1.5000

    0.3660

    ```'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'The function polyval will evaluate a polynomial at x, the form is polyval(p,x).

    For example, the polynomial -2x^2 + x + 4 is evaluated at x = 3, which yields

    -2 * 9 + 3 + 4, or -11:


    ```

    >> p = [-2 1 4];

    >> polyval(p,3)

    ans =

    -11

    ```


    The argument x can be a vector, for example:


    ```

    >> polyval(p,1:3)

    ans =

    3 -2 -11

    >> polyval(p, [5 7])

    ans =

    -41 -87

    ```


    # 14.1.2 Curve Fitting


    Data is basically either discrete or continuous. In many applications, data is
    sampled, for example:


    +   - The temperature recorded every hour

    - The speed of a car recorded every one-tenth of a mile

    - The mass of a radioactive material recorded every second as it decays

    - Audio from a sound wave as it is converted to a digital audio file


    > FIGURE 14.1

    Plot of temperatures sampled every hour.


    This gives data the form of (x,y) points, which then could be plotted. For example,
    let''s say the temperature recorded every afternoon from 2 to 6 P.M.; the vectors
    might be:


    ```

    >> x = 2:6;

    >> y = [65 67 72 71 63];

    ```


    and then the plot might show Figure 14.1.


    # 14.1.3 Interpolation and Extrapolation


    In many cases, it is desired to estimate values other than at the sampled data
    points. For example, we might want to estimate what the temperature was at


    ![](img/0dc331dc1ec8e322a2340be844751b63_443_0.png)'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# 424 CHAPTER 14 Advanced Mathematics


    2:30 P.M., or 1 P.M. Interpolation is estimating the values between recorded data
    points. Extrapolation is estimating outside the bounds of the recorded data. One
    way to do this is to fit a curve to the data, and use this for the estimates.
    Curve fitting is finding the curve that “best fits” data.


    Simple curves are polynomials of different degrees as described Before. Curve
    fitting finds the best polynomials to fit the data—for example, a quadratic polynomial
    in the form ax² + bx + c, it means finding the values of a, b and c that yield
    the best fit. Finding the best straight line that goes through data would mean
    finding the values of a and b in the equation ax + b.


    MATLAB has a function to do this, called polyfit. Polyfit finds the coefficients
    of the polynomial of the specified degree that best fits the data using a least
    squares algorithm. There are three arguments passed to function: the vectors that
    represent the data, and the degree of the desired polynomial. For example, to
    fit a straight line (degree 1) through the previous data points, one would call
    the polyfit function


    ```

    >> polyfit(x,y,1)

    ans =

    0.0000 67.6000

    ```


    which says that the best straight line is of the form 0x + 67.6.


    Figure 14.2

    Sampled temperatures with straight line fit.


    However, from the plot (seen in Figure 14.2), it looks like a quadratic would
    be a much better fit. Following this would create the vectors and then fit a polynomial
    of degree 2 which through the data points, storing the values in a vector called
    coeffs.


    ![](img/0dc331dc1ec8e322a2340be844751b63_444_0.png)


    ```

    >> x = 2:6

    >> y = [65 67 72 71 63]

    >> coeffs = polyfit(x,y,2)

    coeffs =

    -1.8571 14.8571 41.6000

    ```


    This says that MATLAB has determined the best quadratic that these data points
    are -1.8571x² + 14.8571x + 41.6. So, the variable coeffs stores a vector that
    represents this polynomial.


    The function polyval can be used to evaluate the polynomial at specified values.
    For example, we could evaluate every value in x:


    ```

    >> curve = polyval(coeffs,x)

    curve =

    63.8857 69.4571 71.3143 69.4571 63.8857

    ```


    *'
