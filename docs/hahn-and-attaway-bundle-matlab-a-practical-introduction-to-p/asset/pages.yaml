  md: '# String Manipulation


    # KEY WORDS


    +   - string

    - substring

    - control character

    - whitespace character

    - leading blank

    - trailing blank

    - vectors of characters

    - empty string

    - string concatenation

    - delimiter

    - token


    # CONTENTS


    +   6.1 Creating String Variables............... 198

    6.2 Operations on Strings............... 200

    6.3 The is Functions for Strings............... 214

    6.4 Converting Between String and Number Types ...... 215


    A string in the MATLAB software consists of any number of characters and is contained
    in single quotes. Actually, strings are treated as vectors in which every element
    is a single character, which means that many operations and functions that we
    have already worked with strings. MATLAB also has many built-in functions that
    are written specifically to manipulate strings. In some cases, strings contain
    numbers, and it is useful to convert strings to numbers and vice versa; MATLAB
    has functions to do this, also.


    There are many applications for using strings, in fields that are predominantly
    numerical. For example, when data files contains combinations of numbers and characters,
    it is often necessary to read each line from the file as a string, break the string
    into pieces, and convert the parts that contain numbers to string variables that
    can be used in computations. In this chapter the string manipulation techniques
    necessary for this will be introduced, and in Chapter 8 applications in file input/output
    will be demonstrated.'
