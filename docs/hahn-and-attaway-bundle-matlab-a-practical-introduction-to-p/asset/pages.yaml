  md: '# CHAPTER 2 Introduction to MATLAB Programming


    A radius of a circle is passed to the function to the input argument rad; the
    function calculates the area of this circle and stores it in the output argument
    area. In the function header, we have the reserved word function, the output argument
    area followed by the assignment operator =, then the input argument of the function
    (the same as name of the M-file), and then the input argument rad, which is the
    radius. Since there is an output argument in the function header, somewhere in
    the function we must assign a value to this output argument. This is how a value
    is returned from the function. In this case, the function is simple and all we
    have to do is assign to the output area the value of the built-in constant pi
    multiplied by the square of the input argument rad.


    The function can be displayed in the Command Window using the type calcarea


    ```

    >> calcarea

    function area = calcarea(rad)

    % This function calculates the area of a circle

    area = pi * rad * rad;

    ```


