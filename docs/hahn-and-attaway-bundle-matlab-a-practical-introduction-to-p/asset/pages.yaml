  md: '# 13.4 INTRODUCTION TO GRAPHICAL USER INTERFACES


    Graphical user interfaces, or GUIs, are essentially objects that allow users to
    have input using graphical interfaces such as push buttons, sliders, radio buttons,
    toggle buttons, pop-up menus, and so forth. GUIs are examples of object-oriented
    programming in which there is a hierarchy. For example, the parent may be a Figure
    and its children would be objects such as push buttons and text boxes.


    ![](img/0dc331dc1ec8e322a2340be844751b63_425_0.png)


    The user interface object can be a **figure, upanel**, or **ubuttroup**. A **figure**
    is a Window created by the **figure function**. A **upanel** is a means of grouping
    together interface objects (the ui stands for user interface). A **ubuttroup**
    is a means of grouping together buttons (both radio buttons and toggle buttons).


    FIGURE 13.17nImage dimmed by manipulating the matrix.


    In MATLAB there are two methods for creating GUIs: writing the GUI from scratch,
    or using the built-in Graphical User Interface Development Environment (GUIDE).
    GUIDE allows you to graphically lay out the GUI, and then MATLAB generates the
    code for it. However, in order to understand and modify this code, it is important
    to understand the underlying programming concepts. Therefore, this section will
    concentrate on the programming methodology.


    FIGURE 13.18nPlacement of **figure** within the screen.


    A Figure Window is the parent of any GUI. Just calling the **figure function**
    will bring up a blank Figure Window. Assigning the handle of this Figure Window
    to a variable and then using the **get function** to set the default properties.
    These properties, such as the color of the window, its position on the screen,
    and so forth can be changed using the **set function** or when calling the **figure**
    function to begin with. For example:


    ```

    >> f = figure;

    ```


    brings up a grey box near the top of the screen as seen in Figure 13.18.

    Some of its properties are excerpted here:'
  merge: -1
