  md: '# 2.2 MATLAB Scripts


    Once the script has been executed, you may find that you want to make changes
    to it (especially if there are errors!). To edit an existing file, there are several
    methods to open it. The easiest are:


    +   - Click File, then Open, click the name of the file.

    - Click the Current Directory tab (if it is not already shown), then double-click
    the name of the file.


    # 2.2.1 Documentation


    It is very important that all scripts are **documented** well, so that people
    can understand what the script does and how it accomplishes. One way of documenting
    a script is to put **comments** in it. In MATLAB, a comment is anything from a
    % to the end of that particular line. Comments are completely ignored when the
    script is executed. To put a comment, simply type the % symbol at the beginning
    of a line, or select the lines and click Text and Comment and the Editor will
    put them in the % symbols for you.


    For example, the previous script to calculate the area of a circle could be modified
    to have comments:


    ```

    script1b.m

    % This program calculates the area of a circle

    % First the radius is assigned

    radius = 5

    % The area is calculated based on the radius

    area = pi * (radius^2)

    ```


    The first comment at the beginning of the script describes what the script does.
    Then, throughout the script, comments describe different parts of the script (not
    usually a comment for every line, however!). Comments don''t affect what a script
    does, so the output from script will be the same as the previous version.


    The **help** command in MATLAB works with scripts as with built-in functions.
    The first block of comments (defined as contiguous lines at the beginning) will
    be displayed. For example, for script1b:


    ```

    >> help script1b

    This program calculates the area of a circle

    ```


    The reason that a blank line was inserted in the script between the first two
    comments is that otherwise both would have been interpreted as one contiguous
    comment, and both lines would have been displayed with **help**. The very first
    comment line is called the H1 line; it is what the function **lookfor** searches
    through.'
