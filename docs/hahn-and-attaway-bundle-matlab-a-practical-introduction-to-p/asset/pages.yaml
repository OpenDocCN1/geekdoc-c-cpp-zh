  md: '# 5.1 More Types of User-Defined Functions


    output arguments listed in the function header. The general form of a function
    definition for a function that calculates and returns more than one value looks
    like this:


    ```

    functionname.m

    function [output arguments] = functionname(input arguments)

    % Comment describing the function

    Statements here; these must include assigning values to\all of the output arguments
    listed in the header

    ```


    In the vector of output arguments, the output argument names are separated by
    commas,


    For example, here is a function that calculates two values, both the area and
    the circumference of a circle; this is stored in a file called ''arearc.m'':


    ```

    arearc.m

    function [area, circ] = arearcirc(rad)

    % This function calculates the area and

    % the circumference of a circle

    area = pi * rad * rad;

    circ = 2 * pi * rad;

    ```


    Since this function is calculating two values, there are two output arguments
    in the function header (area and circ), which are placed in square brackets [
    ]. Therefore, in the body of the function, rows and numbers have to be assigned
    to both. Since the function is returning two values, it is important to capture
    and store them in separate variables when the function is called, just as both
    the number of rows and the number of columns would be captured from the size function.
    In this case, the first value returned, which is the area of the circle, is stored
    in a variable a and the second value returned is stored in a variable c.


    ```

    >> [a c] = arearcirc(4)

    a = 50.2655

    c = 25.1327

    ```


    If this is not done, only the first value returned is retained; in this case,
    the area:


    ```

    >> disp(arearcirc(4))

    50.2655

    ```'
  merge: -1
