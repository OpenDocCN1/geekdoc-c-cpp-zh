  md: '# 10.3 Three-Dimensional Plots


    which shows the plot by first showing the point (x(1),y(1)), and moving on to
    the point (x(2),y(2)), and so on, leaving a trail (like a comet!) of all the previous
    points.


    ```

    >> comet(x,y)

    ```


    The end result looks the same as plot(x,y).


    Another way of animating is to use the built-in function movie, which displays
    recorded movies. The frames are captured in a loop using the built-in function
    getframe, and are stored in a matrix. For example, the following script animates
    the sin function. The axis is used so that MATLAB will use the same set of axes
    for all frames, and then the min and max on the data vectors x and y allow to
    see all points. It displays the movie in the for loop and then again when the
    movie function is called.


    ```

    sinmovie.m

    % Shows a movie of the sin function

    clear

    x = -2*pi: 1/5 : 2*pi;

    y = sin(x);

    n = length(x);

    for i = 1:n

    plot(x(i),y(i),''r*'')

    axis([min(x)-1 max(x)+1 min(y)-1 max(y)+1])

    M(i) = getframe;

    end

    movie(M)

    ```


    # 10.3 THREE-DIMENSIONAL PLOTS


    MATLAB has many functions that will display three-dimensional plots. Most of these
    functions have the same name as the two-dimensional plot function with a 3 at
    the end. For example, the three-dimensional line plot function is called plot3.
    Other functions include bar3, pie3, and stem3.


    Vectors representing x, y, and z coordinates are passed to the plot3 and stem
    functions. These functions show the points in three-dimensional space. Clicking
    on the 3D icon and then in the plot allows the user to rotate view from different
    angles. Also, using the grid function makes it easier to visualize, as seen in
    Figure 10.8.'
