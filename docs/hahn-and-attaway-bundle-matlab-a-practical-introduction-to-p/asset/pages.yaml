    MATLAB has several other functions that let you read and play or audio files.
    In audio files, data for each audio channel is stored. There are several audio
    format that are used in industry, on different computer platforms. Audio files
    with the extension .au were developed by Sun Microsystems, and are typically used
    with Java and UNIX, whereas Windows PCs typically use .wav files that were developed
    by Microsoft.


    MATLAB has functions reread that will read a .wav file, wavrecord that will write
    a sound file, and wavplay that will play one. The default frequency for these
    functions is 11025 Hz.


    For .au files, there are functions ahead to read and auwrite to write in this
    format.


    # 13.2 INTRODUCTION TO HANDLE GRAPHICS


    With Handle Graphics, all figures consist of different objects, each of which
    is assigned a handle. The object handle is a unique real number that is used to
    refer to the object.


    # 13.2.1 Graphics Objects and Their Properties


    Objects graphics primitives such as lines and text, as well as the axes used to
    orient the objects. The objects are organized hierarchically, and there are properties
    associated with each object. This is the basis of object-oriented programming:
    objects are organized hierarchically (e.g., a parent comes before its children
    (in the hierarchy) and this hierarchy has ramifications in terms of the properties;
    generally children inherit properties from the parents. The hierarchy in MATLAB
    can be seen in the Help, “Organization of Graphics Objects.” In this, it can be
    seen that the organiz-ation includes'
