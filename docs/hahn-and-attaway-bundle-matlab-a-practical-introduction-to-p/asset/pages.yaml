    Notice that the rest of the string includes the blank space delimiter.


    By default, the delimiter for the token is a whitespace character (meaning that
    the token is defined as everything up to the blank space), but alternate delimiters
    can be defined. The format


    ```

    [token rest] = strtok(string, delimiters)

    ```


    returns a token that is the beginning of the string, up to the first character
    contained within the delimiters, and also the rest of the string. In the following
    example, the delimiter is the character '' ''.


    ```

    >> [word rest] = strtok(sentence, '''')

    word =

    He

    rest =

    llo there

    ```


    Leading delimiter characters are ignored, whether it is the default whitespace
    or a specified delimiter. For example, the leading blanks are ignored here:


    ```

    >> [firstpart lastpart] = strtok('' materials science'')

    firstpart =

    materials

    lastpart =

    science

    ```


