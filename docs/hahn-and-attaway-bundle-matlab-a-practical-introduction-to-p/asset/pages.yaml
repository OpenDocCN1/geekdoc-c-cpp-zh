  md: '# 14.1 Fitting Curves to Data


    This results in y values for each point in the x vector, and stores them in a
    vector called curve. Putting all this together, the script called polytemp creates
    the x and y vectors, fits a second order polynomial through these points, and
    plots both the points and the curve on the same figure.


    polytemp.m


    ```

    Demonstrates curve fitting

    x= 2:6;

    y=[65 67 72 71 63];

    coeffs = polyfit(x,y,2);

    curve = polyval(coeffs,x)

    plot(x,y,''ro'',curve)

    xlabel(''Time'')

    ylabel(''Temperatures'')

    title(''Temperatures one afternoon'')

    axis([1 7 60 75])

