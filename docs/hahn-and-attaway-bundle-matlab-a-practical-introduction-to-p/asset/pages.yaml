  md: 'Within a given precedence level, the expressions are evaluated from left to
    right

    (this is called the *associativity*).


    **Nested parentheses** are parentheses inside others, the **inner parentheses**
    is evaluated first. For example, in the expression `5 - (6 * (4 + 2))`,

    first the addition is performed, then the multiplication, and finally the subtrac-

    tner to -31. Parentheses can also be used simply to make an expression

    clear. For example, in the expression `((4 +3 * 5))-1)` the parentheses

    are not necessary, but are used to show the order in which the expression will

    evaluated.


    For the operators that have been covered so far, the following is precedence

