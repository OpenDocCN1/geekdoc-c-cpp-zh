    In Chapter 2, we introduced the use of the function plot in the MATLAB® software
    to get simple, two-dimensional plots of x and y points represented by two vectors,
    x and y. We have also seen some functions that allow customization of these plots.
    In this chapter we will explore other types of plots, ways of customizing plots,
    and some applications that combine plotting with functions and file input. Additionally,
    animation, three-dimensional plots, and graphics properties will be introduced.


    # 10.1 PLOT FUNCTIONS


    So far, we have used plot to create two-dimensional plots and bar to create charts.
    We have seen how to create the Figure Window using clf, and how to create and
    name Figure Windows using figure. Labeling plots has been accomplished using xlabel,
    yabel, title, and legend, and we have also seen how to customize the strings passed
    to these functions using sprint. The axis function changes the axes from the defaults
    that would be taken from the data'
