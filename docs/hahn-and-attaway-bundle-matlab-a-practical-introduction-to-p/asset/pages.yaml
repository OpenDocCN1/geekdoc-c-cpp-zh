    \ Here are examples of this script:\n\n# 4.4.5 Error-Checking User Input in a\
    \ While Loop\n\nIn most applications, when the user is prompted to enter something,\
    \ there is a valid range of values. If the user enters an incorrect value, rather\
    \ than having the program carry on with an incorrect value, or just printing an\
    \ error message, the program should repeat the prompt, reading the value, and\
    \ checking it, until the user enters a value that is in the correct range. This\
    \ is a very common application of a conditional loop, looping until the user correctly\
    \ enters a value in a positive number. This is called error-checking.\n\n```\n\
    >> aveposnum\nEnter a positive number: -5\nNo positive numbers to average.\naveposnum\n\
    Enter a positive number: 8\nEnter a positive number: 3\nEnter a positive number:\
