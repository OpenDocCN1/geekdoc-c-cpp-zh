    # 5.5.4 Function Stubs


    Another common debugging technique, which is used when a script main program calls
    many functions, is to use function stubs. A function stub is a placeholder, used
    so that the script will work even though that particular function hasn''t been
    written. For example, a programmer might start with a script main program consists
    of calls to three function to accomplish all the tasks.


    ```

    mainfile.m

    % This program gets values for x and y, and% calculates and prints z

    [x, y] = getvals;

    z = calcz(x,y);

    printall(x,y,z);

    ```


    The three functions have not yet been written, however, so function stubs are
    put in place so that the script can be executed and tested. The function stubs
    consist of the proper function headers, followed by a simulation of what the function
    will eventually do (e.g., it puts arbitrary values in for the output arguments).


    ```

    getvals.m

    function [x. y] = getvals

    x = 33;

    y = 11;

    ```


    ```

    calcz.m

    function z = calcz(x,y)

    z = 2.2;

    ```


    ```

    printall.m

    function printall(x,y,z)

    disp(''Something'');

    ```


    Then, the functions can be written and debugged one at a time. It is much easier
    to write a working program using this method than to attempt to write everything
    at once—then, when errors occur, it is not always easy to determine where the
    problem is!'
