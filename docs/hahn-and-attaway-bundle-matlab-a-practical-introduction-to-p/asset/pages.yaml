    \n# 12.5 SEARCHING\n\nSearching looking for a value (a key) in a list or in a\
    \ vector. We have already seen that MATLAB is a function, find, will return the\
    \ indices in an array that meets a criterion. To examine the programming methodologies,\
    \ we will in this section examine two search algorithms:\n\n+   - sequential search\n\
    - binary search\n\n# 12.5.1 Sequential Search\n\nA sequential search is accomplished\
    \ by looping through the vector element-wise starting from the beginning, looking\
    \ for the key. Normally the index of the element in which the key is found is\
    \ what is returned. For example, here is a function that will search a vector\
    \ for a key and return the index 0 if the key is not found:\n\n```\nseqsearch.m\n\
    function index = seqsearch(vec, key)\n% Implements a sequential search through\
    \ a\n% vector looking for a key; returns the index\nlen = length(vec);\nindex\
    \ = 0;\nfor i = 1:len\n  if vec(i) == key\n    index = i;\nend\nend\n```"
