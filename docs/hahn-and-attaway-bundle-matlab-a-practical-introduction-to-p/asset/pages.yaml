    The function strep finds all occurrences of a substring within a string, and replaces
    them with a new substring. The order of the arguments matters. The format is:


    ```

    strep(string, oldsubstring, newsubstring)

    ```


    The following example replaces all occurrences of the substring ''e'' with the
    substring ''x'':


    ```

    >> strep(''abcdeabcd'', ''e'', ''x'')

    ans =

    abdxabdx

    ```


    All strings can be any length, and the lengths of the old and new substrings do
    not to be the same.


    In addition to the string functions find and replace, there is a function that
    separates a string into two substrings. The strtok function breaks a string into
    pieces; it can be called several ways. The function receives one string as an
    input argument. It looks for the delimiter, which is a character or set of characters
    that acts as a separator within the string. By default, the delimiter is any whitespace
    character. The function returns a token, which is the beginning of the string,
    up to (not including) the first delimiter. It also returns the rest of the string,
    which includes the delimiter. Assigning the returned values to a vector of variables
    will capture both of them. This format is:


    ```

    [token rest] = strtok(string)

    ```


    where token and rest are variable names. For example:


    ```

    >> sentencel = ''Hello there''

    sencel =

    Hello there

    >> [word rest] = strtok(sentencel)

    word =

    Hello

    ```'
