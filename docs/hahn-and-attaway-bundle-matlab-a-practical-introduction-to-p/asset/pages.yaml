  md: '# Advanced Mathematics


    # KEY WORDS


    # CONTENTS


    +   - curve fitting | interpolation | imaginary part

    - best fit | extrapolation | purely imaginary

    - polynomial | least squares | complex conjugate

    - degree | regression | magnitude

    - order | complex plane

    - data sampling | real part


    +   14.1 Fitting Curves to Data .............. 421

    14.2 Complex Numbers .............. 429

    14.3 Calculus: Integration and Differentiation......... 435


    In this chapter, some more advanced mathematics and the related built-in functions
    in the MATLAB® software will be introduced. In many applications data is sampled,
    which results in discrete data points. But we often want to fit a curve to the
    data. Curve fitting is finding the curve that best fits the data. This chapter
    will first explore curves which are simple polynomials, to data. Other topics
    include complex numbers and a brief introduction to differentiation and integration
    in calculus.


    # 14.1 FITTING CURVES TO DATA


    MATLAB has several curve-fitting functions, and additionally Curve Fitting Toolbox™
    has many of these functions. Some of the simplest curves are polynomials of different
    degrees, which is what will be described in this section.'
  merge: -1
