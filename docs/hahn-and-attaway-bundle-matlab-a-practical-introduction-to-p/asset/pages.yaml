    # 9.4 NESTED FUNCTIONS


    Just as we have seen that loops can be nested, meaning one inside of another,
    functions can be nested. The terminology for nested functions is that an outer
    function can have within it inner functions. When functions are nested, every
    function must have an end statement (much like loops). The general format of a
    nested function is as follows:


    ```

    outer function header

    body of outer function

    inner function header

    body of inner function

    end % inner function

    more body of outer function

    end % outer function

    ```'
