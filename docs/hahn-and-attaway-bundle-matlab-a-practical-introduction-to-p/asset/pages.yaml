    # ## SUMMARY


    # Common Pitfalls


    +   - Putting arguments to strfind in incorrect order (the order matters for strbuf
    but not for findstr).


    +   - Confusing sprintf and fprintf. The syntax is the same, but sprintf creates
    a string whereas fprintf prints.


    +   - Trying to create a vector of strings with varying lengths (the easiest way
    is to use strcat or char, which will pad with extra blanks automatically).


    +   - Forgetting when using strtok, the second argument returned (the rest of
    the string) contains the delimiter.


    +   - When breaking a string into pieces, forgetting to convert the strings to
    actual numbers that can be used in calculations.


    # ## Programming Style Guidelines


    +   - Trailing blanks from strings stored in matrices before using.


    +   - Make sure the correct string comparison function is used; for example, strcmpi
    ignoring case is desired.


