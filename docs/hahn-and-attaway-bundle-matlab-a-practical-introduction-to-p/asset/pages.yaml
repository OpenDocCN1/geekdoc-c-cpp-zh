    13.1 Sound Files .....393

    13.2 Introduction to Handle Graphics............395

    13.3 Image Processing .........400

    13.4 Introduction to Graphical User Interfaces............405


    The MATLAB® product has functions that manipulate audio or sound files and also
    images. This chapter will start with a brief introduction to some of the sound
    processing functions. We have seen that MATLAB uses Handle Graphics® in its figures.
    Some of the core objects used to create figures will be explored. Image processing
    functions will be introduced, and the two basic methods for representing color
    in images will be explained. Finally, this chapter will introduce the topic of
    Graphical User Interfaces from a programming standpoint.


    # 13.1 SOUND FILES


    A sound signal is an example of a continuous signal that is sampled to result
    in a discrete signal. In this case, sound waves traveling through the air are
    recorded as a set of measurements that can then be used to reconstruct the'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# 394 CHAPTER 13 Sights and Sounds


    original sound signal as closely as possible. The sampling rate or sampling frequency
    is the number of samples taken per time unit, for example second. Sound signals
    are usually measured in Hertz (Hz).


    In MATLAB, the discrete sound signal is represented by a vector, and the frequency
    is measured in Hertz. MATLAB has several MAT-files that store, for various sounds,
    the signal vector in a variable y and the frequency in a variable Fs. These MAT-files
    include chirp, gong, laughter, splat, train, and handler. There is a built-in
    function, that will send a sound signal to an output device such as speakers.
    The function call


    ```

    >> sound(y, Fs)

    ```


    will play the sound represented by the vector y at the frequency Fs. For example,
    to hear a gong, load the variables from the MAT-file and then play the sound using
    the sound function:


    ```

    >> load gong

    ```


    ```

    >> sound(y, Fs)

    ```


    ![](img/0dc331dc1ec8e322a2340be844751b63_414_0.png)


    Sound is actually a wave; the amplitudes are what are stored in the sound signal
    variable.y. These are supposed to be in the range from -1 to 1. The plot function
    can be used to display the data. For example, the following script creates a subplot
    that displays the signals from chirp and from train, as seen in Figure 13.1.


    Figure 13.1

    Amplitudes from chirp and train.


    ```

    chirptrain.m

    % Display the sound signals from chirp and train

    load chirp

    subplot(2,1,1)

    plot(y)

    title(''Chirp'')

    load train

    subplot(2,1,2)

    plot(y)

    title(''Train'')

    ```'
