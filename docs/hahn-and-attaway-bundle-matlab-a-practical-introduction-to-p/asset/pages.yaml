  md: "elements. The function nargin returns the number of input arguments that were\
    \ passed to the function, and the function nargout determines how many output\
    \ arguments are expected to be returned from a function.\n\n# 9.3.1 Variable Number\
    \ of Input Arguments\n\nFor example, the following function areafor has a variable\
    \ number of input arguments, either 1 or 2. The name of the function stands for\
    \ \"area, feet or inches\". If only one argument is passed to the function, it\
    \ represents the radius in feet. If two arguments are passed, the second can be\
    \ a character 'i' indicating that the result should be in inches (for any other\
    \ character, the default of feet is assumed). The function uses the built-in varargin,\
    \ which stores as a cell array any number of input arguments. The function nargin\
    \ returns the number of input arguments that were passed to the function. In this\
    \ case, the first argument passed is it stored in the first element of varargin.\
    \ If a second argument is passed (if nargin is 2), it is to specify the units.\n\
    \n```\nareafori.m\nfunction area = areafori(varargin)\n% Calculates and returns\
    \ the area of a circle in feet\n% The radius is passed, and potentially the unit\
    \ of\n% inches is also passed, in which case the result will be\n% given in inches\
    \ instead of feet\nn = nargin; % number of input arguments\nradius = varargin(1);\
    \ % Given in feet by default\nif n == 2\n    unit = varargin(2);\n    if inches\
    \ is specified, convert the radius\n    if unit == 'i'\n        radius = radius\
