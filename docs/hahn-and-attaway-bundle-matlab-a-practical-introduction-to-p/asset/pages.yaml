    Input statements read values from the default or standard input device. In most
    systems, the default input device is the keyboard, so the input statement reads
    values that have been entered by the user, or the person who is running the script.
    In order to let the user know how or she is supposed to enter, the script must
    first prompt the user for the specified values.


    The simplest input function in MATLAB is called input. The input function is used
    in an assignment statement. To call it, a string is passed, which is the prompt
    that will appear on the screen, and whatever type there will be stored in the
    variable name on the left of the colon and: To make it easier to read the prompt,
    put a colon and then a space after a prompt. For example,


    ```

    rad = input(''Enter the radius: '')

    Enter the radius: 5

    rad =

