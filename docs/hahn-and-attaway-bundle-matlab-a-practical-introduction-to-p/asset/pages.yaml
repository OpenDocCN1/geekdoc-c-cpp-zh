    Matrix multiplication does not mean multiplying by term; it is not an array operation.
    Matrix multiplication has a very specific meaning. First of all, in order to multiply
    matrix A by a matrix B to result in a matrix C, the number of columns of A must
    be the same as the rows of B. If the matrix A has dimensions m × n, then matrix
    B must have dimensions n × something; we call it p. We say that the inner dimensions
    must be the same. the resulting matrix C has the same number of rows as A and
    the same number of columns as B (in other orders, the outer dimensions m × p).
    In mathematical notation, [A]ₘn=[C]ₘₚ. This defines only the size of C.


    The elements of the matrix C are defined as the sum of products elements in the
    rows of A and columns of B, or in other ways


    ```

    C_{ij} = ∑_{k=1}^n a_{ik}b_{kj}.

    ```


    In the following example, A is 2 ×3 and B is 3 ×4 so C will be 2 × 4. The elements
    in C are obtained using the summation described earlier. The first row of C is
    obtained using the first row of A and in succession the columns of B. For example,
    C(1,1) is 3 * 1 * 8 * 4 * 0 or 35. C(1,2) is 3 * 2 * 8 * 5 * 0 * 2 or 46.


    ```

    [ 3 8 0 ] [ 35 46 17 19 ]

    [ 1 2 5 ] [  4  5  1  2 ]

    [ 0 2 3 ] [  9 22 20  5 ]

    ```


    # The Programming Concept


    In order to multiply two matrices together, three nested for loops are required.
    The two outer loops iterate through the rows and columns of C, which is m × p.
    For each element in C, the inner loop sums a_{ik} b_{kj} for values of k from
    1 through n. Here is a script that will accomplish this:


    ```

    mymatult.m

    % This script demonstrates matrix multiplication

    A = [ 3 8 0; 1 2 5 ];

    B = [ 1 2 3 1; 4 5 1 2; 0 2 3 0 ];

    [m n] = size(A);


    (Continued)

    ```'
