- img_proc: true
  md: "# 12.5 Searching\n\nHere are two examples of calling this function:\n\n```\n\
    >> values = [85 70 100 95 80 91];\n>> key = 95;\n>> seqsearch(values, key)\nans\
    \ =\n4\n>> seqsearch(values, 35)\n```\n\nThis also assumes that the key is found\
    \ only in one element in the vector. Also, although it works, it is not a very\
    \ efficient algorithm. If the vector is large, and the key is found in the beginning,\
    \ this loops through the rest of the vector. An improved version would loop until\
    \ the key is found or the entire vector has been searched. A while loop is used\
    \ rather than a for loop; there are two parts to the condition.\n\n```\nsmartseqsearch.m\n\
    function index = smartseqsearch(vec, key)\n% Smart sequential search; searches\
    \ a vector\n% for a key ends when it is found\n% Returns the index or 0 if not\
    \ found\nlen = length(vec);\nindex = 0;\ni = 1;\nwhile i < len && vec(i) ~= key\n\
    \  i = i + 1;\nif vec(i) == key\n  index = i;\n\n```\n\n# 12.5.2 Binary Search\n\
    \nThe binary search assumes that the vector has been sorted. The algorithm is\
    \ similar to the way it works when looking for a name in a phone directory (which\
    \ is sorted alphabetically). To find the value of a key, look at the element in\
    \ the middle.\n\n+   - If that is the key, the index has been found.\n- If it\
    \ is not the key, decide whether to search the elements before or after this location\
    \ and adjust the range of values in which the search is taking place and start\
    \ this process again."
