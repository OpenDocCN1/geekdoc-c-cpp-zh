- img_proc: true
  md: 'In this chapter, we will introduce the simplest MATLAB® programs, called scripts.
    Examples of scripts that customize simple plots will illustrate the concept. Input
    will be introduced, both from files and from the user. Output, to files and to
    the screen, will also be introduced. Finally, user-defined functions that calculate
    and return values will be described. These topics serve as an introduction to
    programming, which will be explored further in Chapter 5.


    # 2.1 ALGORITHMS


    Before writing any computer program, it is useful to first outline the steps that
    will be necessary. An algorithm is the sequence of steps needed to solve a problem.
    In a modular approach to programming, the problem solution is broken into separate
    steps, and each step is further refined until the resulting steps are small enough
    to be manageable tasks. This is the top-down design approach.


    As a simple example, consider the problem of calculating the area of a circle.
    First, is necessary to determine what information is needed to solve the problem,
    which in this case is the radius of the circle. Next, given the radius of the
    circle, the area of the circle would be calculated. Last, once the area has been
    calculated, it has to be displayed in some way. So, the basic algorithm is:


    +   - Get the input: the radius

    - Calculate the result: the area

    - Display the output


    Even with an algorithm this simple, it is possible to refine each of the steps
    further. When a program is written to implement this algorithm, the steps would
    be:


    +   - Where does the input come from? Two possible choices would be from an external
    file on a disk, or from the user (the person who is running the program), who
    enters the number by typing it to the keyboard. For every system, one of these
    will be the default input device (which means, if not specified otherwise, this
    is where the input comes from). If the user is supposed to enter the radius, the
    user has to be told to type it (and, in what units). Telling the user what to
    enter is called prompting. So, the input step actually becomes two: prompt the
    user to enter a radius, and then read it into the program.

    - To calculate the area, the formula is needed. In this case, the area of the
    circle is π multiplied by the radius squared. So, that means the value of π is
    needed in the program, which is an example of a constant.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '3. Where does the output go? Two possibilities are (1) to an external file,
    or (2) to a window on the screen. Depending on the system, one of them will be
    the default output device. When displaying the output from the program, it should
    always be as informative as possible. In other words, instead of printing the
    area (just the number), it should be printed in a nice sentence format. Also,
    to make the output even more clear, the input should be printed. For example,
    the output might be the sentence: "For a circle with a radius of 1 inch, the area
    is 3.1416 inches squared."


    For most programs, the basic algorithm consists of the three steps just outlined:


    +   1. Get the input(s).


    +   2. Calculate the result(s).


    +   3. Display the result(s).


    As can be seen here, the simplest problem solutions can then be further refined.


    # 2.2 MATLAB SCRIPTS


    Once a problem has been analyzed, and the algorithm for its solution has been
    written and refined, the algorithm then is translated into a particular programming
    language. A computer program is a sequence of instructions, in a given language,
    that accomplishes a task. To execute or run, a program is to have the computer
    analyze these instructions.


    High-level languages have English-like commands and functions, as "print this"
    or "if x < 5 do something". The computer, however, can interpret commands only
    written in its machine language. Programs that are written in highlevel languages
    must be translated into machine language before the computer can actually execute
    the sequence of instructions in the program. A program that translates from a
    high-level language to an executable file is called a compiler. The original program
    is called the source code, and the resulting executable program is called the
    object code.


    By contrast, an interpreter goes through the code-by-line, executing each command
    as it goes. MATLAB uses either what are de facto script files or M-files (the
    reason for this is the extension on the filename is .m). These script files are
    interpreted, then compiled. Therefore, the correct terminology is that these are
    scripts, and not programs. However, the terms are somewhat loosely used by many
    people, and the documentation in MATLAB itself refers to scripts as programs.
    In this book, we will reserve the use of the word "program" to mean a set of scripts
    and functions, as described later in this chapter and then in more detail in Chapter
    5.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'A script is a sequence of MATLAB instructions that is stored in a file and
    saved.

    The contents of a script can be displayed in the Command Window using the type
    command. The script can be executed, or run, by simply entering the name of the
    file (without the .m extension).


    To create a script, click File, then New, then M-file. A new window will appear
    called the Editor. To create a new script, simply type the sequence of statements
    (notice that line numbers appear on the left).


    When finished, save the file using File and then Save. Make sure the extension
    .m is on the filename (this should be the default). The rules for filenames are
    the same as for variables (they must start with a letter, and after that there
    can be letters, digits, or the underscore,). By default, scripts will be saved
    in the Work Directory. If you want to save the file in a different directory,
    the Current Directory can be changed.


    For example, we will now create a script script1.m that calculates the area of
    a circle. It assigns a value for the radius, and calculates the area based on
    that radius.


    In this text, scripts will be displayed in a box with the name on top.


    ```

    script1.m

    radius = 5

    area = pi * (radius^2)

    ```


    In the Command Window, the contents of the script can be displayed, and the script
    can be executed. The type command shows the contents of the file named script1
    (notice that the .m is not included):


    ```

    >> type script1

    radius = 5

    area = pi * (radius^2)

    ```


    There are two ways to view a script once it has been written: either in the Editor
    Window to view it, or use the type command as shown here to display it in the
    Command Window.


    To actually run or execute the script, the name of the file is entered at the
    prompt (again, without the .m). When executed, the results of the two assignment
    statements are displayed, since the output was not suppressed for either statement.


    ```

    >> script1

    radius =

    5

    area =

    78.5398

    ```'
