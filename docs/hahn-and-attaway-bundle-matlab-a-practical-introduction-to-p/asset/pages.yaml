  md: '# 438 CHAPTER 14 Advanced Mathematics


    which shows that the derivative is the polynomial 3x^2 + 4x - 4. The function
    polyval can then be used to find the derivative for certain values of x; for example
    for x = 1, 2, and 3:


    ```

    >> polyval(diffp, 1:3)

    ans =

    3      16     35

    ```


    The derivative can be written as the line


    ```

    f''(x) = lim_{h→0} (f(x+h)-f(x))/h

    ```


    and can be approximated by a difference equation.

    MATLAB has a built-in function, diff, which returns the differences between consecutive
    elements in a vector. For example,


    ```

    >> diff([4 7 15 32])

    ans =

    3      8      17

    ```


    For a function y = f(x) where x is a vector, the values of f''(x) can be approximated
    as diff(y) divided by diff(x). For example, the previous equation can be written
    as an anonymous function.


    ```

    >> f = @(x) x .^ 3 + 2 .* x .^ 2 - 4 .* x + 3;

    >> x = 1:3;

    >> y = f(x)

    y =

    2      11     36

    >> diff(y)

    ans =

    9      25

    >> diff(x)

    ans =

    1      1

    >> diff(y) ./ diff(x)

    ans =

    9      25

    ```


