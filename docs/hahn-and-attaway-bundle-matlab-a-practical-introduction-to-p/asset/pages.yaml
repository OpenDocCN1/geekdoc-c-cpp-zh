    # 14.3 CALCULUS: INTEGRATION AND DIFFERENTATION


    The integral of a function f(x) between the limits given by x=a and x=b is written
    as

    \int_a^b f(x)dx


    and is defined as the area under the curve f(x) from a to b, as long as the function
    is on the x-axis. Numerical integration techniques approximate this.


    # 14.3.1 Trapezoidal Rule


    One simple method of approximating the area under a curve is to draw a straight
    line from f(a) to f(b) and calculate the area of the resulting trapezoid as


    ```

    (b-a)\frac{f(a)+f(b)}{2}

    ```


    In MATLAB, this could be implemented as a function.


    ![](img/0dc331dc1ec8e322a2340be844751b63_455_0.png)'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# The Programming Concept


    Here is a function to which the function handle and limits a and b are passed:


    ```

    trapint.m\function int = trapint(fnh, a, b)

    % approximates area under a curve using a

    % trapezoid

    int = (b-a) * (fnh(a) + fnh(b))/2;

    ```


    To call it, for example, for the function f(x) = 3x^2 - 1, an anonymous function
    is defined and its handle is passed to the trapint function.


    ```

    >> f = @(x) 3 .* x .^2 - 1;

    approxim = trapint(f, 2, 4)

    approxim =

    58

    ```


    # The Efficient Method


    MATLAB has a built-in function trap that will implement the trapezoidal rule.
    Vectors with the values of x and y = f(x) are passed to it. For example, using
    the anonymous function just defined:


    ```

    >> x = [2 4];

    >> y = f(x);

    >> trapz(x,y)

    ans =

    58

    ```


    An improvement on this is to divide the range from a to b into n intervals, apply
    the trapezoidal rule to each interval, and sum them. For example, the preceding,
    if there are two intervals, you would draw a straight line from f(a) to f((a+b)/2),
    and then from f((a+b)/2) to f(b).


    # The Programming Concept


    Here is a modification of the previous function to which the function handle,
    limits, and the number of intervals are passed:


    ```

    trapintn.m\function intsum = trapintn(fnh, lowrange,highrange, n)

    % implements trapezoidal rule using n intervals

    intsum = 0;

    increm = (highrange - lowrange)/n;

    ```


    (Continued)'
