    # 11.3.2 Simplification Functions


    There are several functions that work with expressions, and simplify the terms.
    Not all expressions can be simplified, but the simplify function does whatever
    it can simplify expressions, including gathering like terms. For example:


    ```

    >> x = sym(''x'');

    >> myexpr = cos(x)^2 + sin(x)^2

    myexpr =

    cos(x)^2+sin(x)^2

    >> simplify(myexpr)

    ans =

    1

    ```


    The functions collect, expand, and factor work with polynomial expressions. The
    collect function collects coefficients, for example,


    ```

    >> x = sym(''x'');

    >> collect(x^2 + 4*x^3 + 3*x^3)

    ans =

    4*x^2+4*x^3

    ```


    The expand function will multiply out terms, and factor will do the reverse:


    ```

    >> expand((x+2)*(x-1))

    ans =

    x^2+x-2

    >> factor(ans)

    ans =

    x+2)*(x-1)

    ```


    The subs function will substitute a value for a symbolic variable in an expression.
    For example,'
  merge: -1
