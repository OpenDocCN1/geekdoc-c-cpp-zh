    However, that is only the formatting character allowed in the prompt input. A
    field width can also be included in the placeholder in printf, which specifies
    how many characters total are to be used in printing. For example, %5d would indicate
    a field width of 5 for an integer and %10s indicate a width of 10 for a string.
    For floats, the number of decimal places can also be specified; for example, %6.2f
    means a field width of 6 (including the decimal point and decimal places) with
    two decimal places. For floats, just the number of decimal places can also be
    specified; for example, %3f indicates three decimal places.


