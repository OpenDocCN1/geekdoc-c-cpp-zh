  md: '# 9.2 Uses of Function Handles


    ```

    fnstrfn.m

    function fnstrfn(funstr)

    % A function name is passed as an argument to this

    % function; it evaluates and plots the function of x

    x = 1..25:6;

    y = eval(strcat(funstr,''.x''));

    plot(x,y,''bo'')

    ```


    In this case, the string ''x'' has to be concatenated to the name of the string
    to result in the string, for example, ''sin(x)''; and then that is evaluated as
    a function using **eval**. This would be called by passing a string to the function,
    for example:


    ```

    >> fnstrfn(''sin'')

    ```


    This would create the same plot as shown in the previous example.


    Another way of doing this is to use the built-in function **str2func** that will
    convert a string to a function handle:


    ```

    fnstrfn2.m

    function fnstrfn2(funstr)

    % A function name is passed as an argument to this

    % function; it converts this to a function handle and

    % then plots the function of x

    x = 1..25:6;

    funh = str2func(funstr);

    y = funh(x);

    plot(x,y,''bo'')

    ```


    This also would be called by passing a string to the function, and again would
    create the same plot:


    ```

    >> fnstrfn2(''sin'')

    ```


    There is also a function **funcstr** that will convert a function handle to a
    string. This could be used to put the name of the function in the plot in Figure
    9.1 (either in the title or on the y-axis label).


    Although these methods also work, it seems simpler and cleaner to just pass the
    function handle to the function.'
