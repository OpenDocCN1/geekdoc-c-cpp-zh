    - the call back function must be specified since the user''s entry of a string
    necessitates a response (the function handle of the nested function is used).

    - Make the GUI visible so the user can see the instruction and type a string.

    - When the string is entered, the call back function callback is called. Note
    that in the function header, there are two input arguments, source and eventdata.
