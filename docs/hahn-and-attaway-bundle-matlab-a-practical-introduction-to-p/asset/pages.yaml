    Recursion occurs when something is defined in terms of itself. In programming,
    a recursive function is a function that calls itself. Recursion is used very commonly
    in programming, although many simple examples (including some in this section)
    are not very efficient and can be replaced by iterative methods (loops, or vectorized
    code in MATLAB). Nontrivial examples go beyond the scope of this book, so the
    concept of recursion is simply introduced here.


    The example used will be of a factorial. Normally, the factorial of an integer
    n is defined iteratively:


    ```

    n! = 1 * 2 * 3 ... * n

    ```


    For example, 4! = 1 * 2 * 3 * 4, or 24.


    Another, recursive, definition of is:


    ```

    n! = n * (n - 1)!      general case

    1! = 1                base case

    ```


    This recursion is because a factorial is defined in terms of another factorial.
    There are two parts to any recursive definition: the general (or inductive) case,
    and the base case. We say that the factorial of n is defined as n multiplied by
    the factorial of (n - 1), but the base case is that the factorial of 1 is just
    1. The base case stops the recursion.


    For example,


    ```

    3! = 3 * 2!

    2! = 2 * 1!

    1! = 1

    = 6

    ```


    The way this works is that 3! is defined in terms of another factorial, as 3 *
    2!. This expression cannot yet be evaluated, because first we have to find out
    the value of 2!. So, in trying to evaluate the expression 3 * 2!, we are interrupted
    by the recursive definition. According to the definition, 2! is 2 * 1!. Again,
    the expression 2 * 1! cannot yet be evaluated because we have to find the value
    of 1!. According to the definition, 1! is 1. Since we now know what 1! is, we
    can continue with the expression that was just being evaluated; now we know'
  merge: -1
  pgno: 307
- img_proc: true
  md: "2 * 1! is 2 * 1, or 2. So, now we can finish the previous expression was being\
    \ evaluated; now we know that 3 * 2! is 3 * 2, or 6.\n\nThis is the way recursion\
    \ always works. With recursion, the expressions are put on hold with the interruption\
    \ of the general case of the recursive definition. This keeps happening until\
    \ finally the base case of the recursive definition applies. This finally stops\
    \ the recursion, and then the expressions that were put on hold are evaluated\
    \ in the reverse order. In this case, first evaluation of 2 * 1! was completed,\
    \ and then 3 * 2!\n\nThere must always be a base case to end the recursion, and\
    \ the base case must be reached at some point. Otherwise, infinite recursion would\
    \ occur (theoretically, although MATLAB will stop the recursion eventually).\n\
    \nWe have already seen the built-in function in MATLAB to calculate factorials,\
    \ called factorial and we have seen how to implement the iterative definition\
    \ using a running product. Now we will instead a recursive function called fact.\
    \ The function will return an integer, which for simplicity we assume is a positive\
    \ integer, and will calculate n! using the recursive definition given:\n\n```\n\
    fact.m\nfunction facn = fact(n)\n% This function recursively finds n!\nif n ==\
    \ 1\n    facn = 1;\nelse\n    facn = n * fact(n-1);\nend\n```\n\nThe function\
    \ calculates one value, using an if-else statement to choose the base and general\
    \ cases. If the value passed to the function is 1, the function returns 1 since\
    \ 1! is equal to 1. Otherwise, the general case applies. According to the definition,\
    \ the factorial of n, which is this function is calculating, is defined as n multiplied\
    \ by the factorial of (n-1). So, the function assigns n * fact(n-1) to the output\
    \ argument.\n\nHow does this work? Exactly the way the example was sketched for\
    \ 3! Let's trace what would happen if the integer 3 is passed to the function:\n\
    \n```\nfact(3) tries to assign 3 * fact(2)\n    fact(2) tries to assign 2 * fact(1)\n\
    \        fact(1) assigns 1\n    fact(2) assigns 2\nfact(3) assigns 6\n```"
