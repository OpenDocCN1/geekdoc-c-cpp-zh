    # 13.2.1.1 Core Objects


    The Core Objects in MATLAB are the very basic primitives. A description can be
    found under the MATLAB Help: Under the Contents tab, click Handle Graphics Objects,
    and then Core Graphics Objects. The core objects include:


    +   - line

    - text

    - rectangle

    - patch

    - image


    These are all built-in functions; help can be used to find out how each function
    is used.


    One core graphics object is a line, which is what the plot function produces.
    Here is an example of creating a line object, modifying some properties, and saving
    the handle in a variable hl:


    ```

    >> x = -2*pi; 1/5 : 2*pi;

