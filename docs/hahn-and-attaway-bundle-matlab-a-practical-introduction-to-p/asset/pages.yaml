    # 6.4 CONVERTING BETWEEN STRING AND NUMBER TYPES


    MATLAB has several functions that convert numbers to strings in which each character
    element is a separate digit, and vice versa. (Note: these are different from the
    functions char, double, etc., which convert characters to ASCII equivalents and
    versa.)


    To convert numbers to strings, MATLAB has the functions int2str for integers and
    num2str for reals (which also work with integers). The function int2str would,
    for example, the integer 4 to the string ''4''.


    ```

    >> rani = randi(1,1,50)

