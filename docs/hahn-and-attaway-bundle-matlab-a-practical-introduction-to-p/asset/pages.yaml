    the equation of a straight line by writing each in the form y = mx + b (by changing
    x1 and x2 to y):


    x + 2y = 2          →  2y = -x + 2      →  y = -0.5x + 1

    2x + y = 6          →  2y = -2x + 6      →  y = -x + 3


