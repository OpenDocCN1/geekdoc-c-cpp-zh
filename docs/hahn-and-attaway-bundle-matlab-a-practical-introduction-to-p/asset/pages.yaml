    ans =

    2

    ```


    The variable rani is a scalar that stores one number, whereas s1 is a string that
    stores two characters, ''3'' and ''8''.


    Even though the result of the first two assignments is 38, notice that the indentation
    in the Command Window is for the number and the string.


    The num2str function, which converts reals, can be called in several ways. If
    only the real number is passed to the num2str function, it will create a string
    that has four decimal places, which is the default in MATLAB for displaying real
    numbers. The precision can also be specified (which is the number of digits),
    and format strings can also be passed, as shown:


    ```

    >> str2 = num2str(3.456789)

