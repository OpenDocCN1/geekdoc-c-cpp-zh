    # Programming Style Guidelines


    +   - Especially for longer scripts and functions, start by writing an algorithm,


    +   - Use comments to document scripts and functions:


    +   - a block of contiguous comments at the top to describe a script


    +   - a block of contiguous comments under the function header for functions


    +   - comments throughout any M-file (script or function) to describe each section


    +   - Make sure that the H1 comment line has useful information.


    +   - Use mnemonic identifier names (names that make sense, e.g., radius instead
    of xyz) for variable names and for filenames.


    +   - Make all output easy to read and informative.


    +   - Put a newline at the end of every string printed by fprintf so the prompt
    appears on the line below.


    +   - Put informative labels on the x- and y-axes and a title on all plots.


    +   - Keep functions short; normally not longer than one page in length.


    +   - Suppress the output from all assignment statements in a function.


    +   - Functions that return a value do not normally print the value; it should
    simply be returned by the function.


