  md: '# PRACTICE 2.3


    # 2.5 SCRIPTS TO PRODUCE AND CUSTOMIZE SIMPLE PLOTS


    Write a script to prompt the user for a character and a number, and print the
    character in a field-width of 4 and the number left-justified in a field width
    of 5 with two decimal places. Test this by entering numbers with varying widths.


    MATLAB has many graphing capabilities. In many cases, customizing plots is desired
    and this is easiest to accomplish by creating a script rather than typing a command
    in the Command Window. For reason, simple plots and how to customize them are
    introduced in this chapter on MATLAB programming.


    Typing help will display the help topics that contain graph functions, including
    graph2d and graph3. Typing help graph2d would display some of the two-dimensional
    graph functions, as well as functions to manipulate the axes and to put labels
    and titles on the graphs.


    # 2.5.1 The Plot Function


    For now, we will start with a very simple graph of one point. To do this, first
    values are given for the x and y coordinates of the point in separate variables.
    The point is then plotted using a red*. The plot is then customized by specifying
    the minimum and maximum values on the first-x and then y-axis. Labels on the x-axis,
    the y-axis, and the graph itself using function xlabel, yabel, and title. All
    this can be done from use a script. The following shows the contents of the script
    plotonepoint that accomplishes this. The x-coordinate represents the time of day
    (e.g., 11 am) and the y-coordinate represents the temperature in degrees Fahrenheit
    at time:


    ```

    plotonepoint.m


    % This is a really simple plot of just one point!


    % Create coordinate variables and plot a red ''*''

    x = 11;

    y = 48;

    plot(x,y,''r*'')

    % Change the axes and label them

    axis([9 12 35 55])

    xlabel(''Time'')

    ylabel(''Temperature'')

    % Put a title on the plot

    title(''Time and Temp'')

    ```'
