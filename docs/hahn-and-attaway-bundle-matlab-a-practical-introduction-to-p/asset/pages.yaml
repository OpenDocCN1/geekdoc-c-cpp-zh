    # 2.6.3.1 Example: Load from a File and Plot the Data


    As an example, a file called timetemp.dat stores two lines of data. The first
    line is the time of day, and the second line is the recorded temperature at each
    time. The first value of 0 for the time represents midnight. For example, the
    contents of the file might be:


    FIGURE 2.5

    Plot of temperature data from a file.


    The following script loads the data from the file into a matrix it separates the
    matrix into vectors for the time and temperature, and then plots the data using
    black + symbols.


    ```

    timetempprob.m

    % This reads time and temperature data for an afternoon

    % from a file and plots the data

    load timetemp.dat

    % The times are in the first row, temps in the second row

    time = timetemp(1,:);

    temp = timetemp(2,:);

    % Plot the data and label the plot

    plot(time,temp,''k+'')

    xlabel(''Time'')

    ylabel(''Temperature'')

    title(''Temperatures one afternoon'')

    ```


    Running the script produces the plot seen in Figure 2.5.


    Notice that it is difficult to see the point at time 0 since it falls on the y-axis.

    The axis function can be used to change the axes from the defaults here.'
