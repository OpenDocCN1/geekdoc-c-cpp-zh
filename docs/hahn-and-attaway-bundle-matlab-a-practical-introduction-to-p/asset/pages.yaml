    >> first = ''Bird'';

    >> last = ''house'';

    >> strcat(first,last);

    ans =

    Birdhouse

    ```


    There is a difference between these methods of concatenating, however, if there
    are leading or trailing blanks in the strings. The method of using the square
    brackets will concatenate the strings, including all leading and trailing blanks.


    ```

