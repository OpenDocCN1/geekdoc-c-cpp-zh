    A matrix is a **diagonal matrix** if all values that are not on the diagonal are
    0. The numbers on the diagonal, do not have to be nonzero although they frequently
    are. Mathematically, this is written as $a_{ij} = 0$ for $i \neq j$. Here is an
    example of a diagonal matrix.


    ```

    $$\begin{bmatrix} 4 & 0 & 0 \ 0 & 9 & 0 \ 0 & 0 & 5 \\end{bmatrix}$

    ```


    # The Efficient Method


    The `diag` function can be used to take a vector of length $n$ and create an $n
    \times n$ square diagonal matrix with the values from the vector on the diagonal:


    ```

    >> v=1:4;

    >> diag(v)

    ans =

    ```


    ```

    $$\begin{bmatrix} 1 & 0 & 0 & 0 \ 0 & 2 & 0 & 0 \ 0 & 0 & 3 & 0 \ 0 & 0 & 0 &
    4 \\end{bmatrix}$

    ```


    A matrix is an **identity matrix**, [1], if $a_{ij} = 1$ for $i == j$ and $a_{ij}
    = 0$ for $i \neq j$. In other words, all the numbers on the diagonal are 1 and
    all others are 0. This is a $3 \times 3$ identity matrix:


    ```

    $$\begin{bmatrix} 1 & 0 & 0 \ 0 & 1 & 0 \ 0 & 0 & 1 \\end{bmatrix}$

    ```


