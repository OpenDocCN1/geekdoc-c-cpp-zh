  md: '# 6.1 CREATING STRING VARIABLES


    A string consists of any number of characters (including, possibly, none). These
    are examples of strings:


    ```

    ''

    x''

    ''cat''

    ''Hello there''

    ''123''

    ```


    A substring is a subset or part of a string. For example, ''there'' is a substring
    within the string ''Hello there''.


    Characters include letters of the alphabet, digits, punctuation marks, white space,
    and control characters. Control characters are characters that cannot be printed,
    but accomplish a task (such as a backspace or tab). Whitespace characters include
    the space, tab, newline (which moves the cursor to the next line), and carriage
    return (which moves the cursor to the current line). Leading blanks are blank
    spaces at the beginning of a string, for example, ''hello'', and trailing blanks
    are blank spaces at the end of a string.


    There are several ways that string variables can be created. One is using assign-ment
    statements:


    ```

    word = ''cat'';

    ```


    Another method is to read into a string variable. Recall that to read into a string
    using the input function, the second argument ''s'' must be included:


    ```

    strvar = input(''Enter a string: '', ''s'')

    Enter a string: xyzabc

    strvar = xyzabc

    ```


    If leading or trailing blanks are typed by the user, they will be stored in the
    string. For example, the following the user enters four blanks and then ''xyz'':


    ```

    s = input(''Enter a string: '', ''s'')

    Enter a string: xyz

    s = xyz

    ```


