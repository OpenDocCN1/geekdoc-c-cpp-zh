    # 2.5.1 Image Conversions


    As can be deduced from the previous account, one type of image can be converted
    to another type. This implies that RGB type can be converted to inverse, to grayscale,
    and finally to binary. Not all of these conversions are usually reversible. For
    instance, conversion to binary image is irreversible because the information related
    to individual grayscale values is lost owing to thresholding. Similarly, RGB can
    be converted to grayscale, but the process can be reversed if the color map is
    also saved for the reverse transformation. Figure 2.9(a) represents these conversions
    in the form of a small block diagram. Although there are MATLAB functions written
    next to the connecting arrows representing which function would do this transformation,
    the logical flow can be implemented in any programming environment by employing
    the appropriate specialized function from that programming environment. Similar
    types of conversions also exist for converting color spaces from RGB to YC_bC_r,
    HSV, and YIQ; this is summarized in Figure 2.9(b).


    # 2.6 MATLAB CODE


    As stated earlier, image processing begins with image acquisition. MATLAB is equipped
    with an acquisition toolbox called IMAQ, and has useful functions to acquire images
    from a Windows-recognized camera or other video source. In fact, only a handful
    number of statements is sufficient to do this using a simple webcam. This procedure
    is now described.


    First, the video source is associated with a local variable by using the function
    videoinput(). The parameter for this function is the name of the video'
