- pgno: 178
  md: '# Edge Detection


    # 9.1 INTRODUCTION


    THE BIGGEST GROUP of processing operators exists for a class of images called
    the binary image. This is especially true for machine vision applications, where
    most of the color- and texture-related information is not of much use. In these
    applications, only certain areas of interest are isolated to be processed for
    further stages of processing. However, conversion to binary images is one of the
    essential preprocessing steps needed in machine vision processing. As discussed
    in Chapter 2, Section 2.5, a grayscale image can be converted to a binary image
    by thresholding the grayscale levels into two levels only: black and white. The
    next important information to be extracted from a grayscale image is related to
    the edges present in the image.


    An edge can be defined as “a sudden change of intensity in an image.” In binary
    images, an edge corresponds to a sudden change in intensity level from 1 to 0,
    and vice versa. This, essentially, represents high-frequency components in the
    image and, thus, extracting them would involve some procedure to extract high
    frequencies from the image. Hence, edge detection is fundamentally a high-pass
    operation with thresholding added to it. This implies that once high-frequency
    components (i.e., edges) are found, they are thresholded to logic 1 in the image
    while all other pixels are set to zero. Too many edges represent a “rough” image,
    while too few would correspond to a relatively “smoother” image. The following
    sections discuss some of the common techniques used for edge detection.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_179_0.png)


    FIGURE 9.1 Sobel convolution kernels, Gx (left) and Gy (middle), and image segment
    (right) to be operated on with Equation 9.1.


    # ## 9.2 THE SOBEL OPERATOR


    The Sobel operator performs a 2D spatial gradient measurement on an image and
    emphasizes regions of high spatial frequency that correspond to edges. Typically,
    it is used to find the approximate absolute gradient magnitude at each point in
    an input grayscale image. The operator consists of a pair of 3 x 3 convolution
    kernels, as shown in Figure 9.1. One kernel is simply the other rotated by 90°.
    Assuming an image segment of the same dimensions as that of the Sobel kernel (as
    shown in Figure 9.1), the result of convolution will be


    ```

    |G| = |(f_1 + 2f_2 + f_3) - (f_7 + 2f_8 + f_9)| + |(f_1 + 2f_4 + f_7) - (f_3 +
    2f_6 + f_9)| (9.1)

    ```


    These kernels are designed to respond maximally to edges running vertically and
    horizontally relative to the pixel grid, one kernel for each of the two perpendicular
    orientations. The kernels can be applied separately to the input image to produce
    separate measurements of the gradient component in each orientation (call these
    Gx and Gy). These can then be combined together to find the absolute magnitude
    of the gradient at each point and the orientation of that gradient. The gradient
    magnitude is given by


    ```

    |G| = \sqrt{G_x^2 + G_y^2}. (9.2)

    ```


    Typically, an approximate magnitude is computed for faster calculations using


    ```

    |G| = |G_x| + |G_y|. (9.3)

    ```'
  merge: -1
  img_proc: true
