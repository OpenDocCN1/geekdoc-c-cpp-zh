  md: '![](img/fc093ca9cc8a631842aa559a749dca54_111_0.png)


    # FIGURE 5.2 (Continued)


    of this mother wavelet. Wavelet analysis can be used to divide the information
    of an image into approximation and detail subsignals. The approximation subsignal
    shows the general trend of pixel values, and three detail subsignals show the
    vertical, horizontal, and diagonal details or changes in the image. If these details
    are very small, then they can be set to zero without significantly changing the
    image. This is the key to using the wavelet transform in applications such as
    image filtering and image compression.


    The 2D discrete wavelet transform, F(u,v) of an image f(m,n) is given by.


    ```

    F(a,b_1,a_2,b_2) = \sum_{m=0}^{M-1} \sum_{n=0}^{N-1} f(m,n) \frac{1}{\sqrt{b_1
    b_2}} \psi \left( \frac{m-a_1}{b_1}, \frac{n-a_2}{b_2} \right), (5.6)

    ```


    where $\frac{1}{\sqrt{b_1 b_2}} \psi(\frac{m-a_1}{b_1}, \frac{n-a_2}{b_2})$ represents
    a specific type of wavelet with scaling and shifting in x and y axes as $(a_1,
    b_1)$ and $(a_2, b_2)$, respectively. There have been many designs related to
    newer and better mother wavelets. These mother wavelets differ in energy compaction
    capability. However, the following are some of the most commonly used wavelets
    in image processing:


    +   - "haar": Haar wavelet

    +   - "db": Daubechies wavelets'
