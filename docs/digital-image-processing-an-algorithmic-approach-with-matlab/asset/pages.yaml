  md: '![](img/fc093ca9cc8a631842aa559a749dca54_185_0.png)


    FIGURE 9.6 Sobel edge detection kernel with eight different orientations to be
    used with the compass edge detector.


    Various kernels can be used for this operation. The whole set of n kernels is
    produced by taking one of the main standard kernels and rotating its coefficients
    circularly. Each of the resulting kernels is sensitive to an edge orientation
    ranging from 0° to 360° – Δ in steps of Δ, where 0° corresponds to a vertical
    edge, and so on.


    The compass edge detector is an appropriate way to estimate both the magnitude
    and orientation of an edge. Although differential gradient edge detection needs
    a rather time-consuming calculation to estimate the orientation from the magnitudes
    in the x- and y-directions, the compass edge detection obtains the orientation
    directly from the kernel with the maximum response. On the other hand, the compass
    operator needs n convolutions for each pixel, whereas the gradient operator needs
    only 2. As an example, the Sobel operator has been shown in Figure 9.6 with eight
    different orientations to cover various directional edges, while Figure 9.7 shows
    some of the commonly used kernels.


