- pgno: 150
  md: 'When the PSF can be measured from the image itself, for example, as the blurred
    image of a single star, a single fluorescent bead, or a single dust particle,
    it can be conveniently used for deconvolution. In other cases, it may be possible
    to estimate it from independent knowledge.


    Frequency filters are also commonly used in image reconstruction. Here, the aim
    is to remove the effects of a nonideal imaging system by multiplying the image
    in the Fourier space with an appropriate function. The easiest method, called
    inverse filtering, is to divide the image in the Fourier space by the optical
    transfer function (OTF). We illustrate this deconvolution, using Figures 7.3 and
    7.4.


    # 7.3 DECONVOLUTION


    Deconvolution is the reverse (at least theoretically) of convolution. When the
    degradation due to blur is to be removed, the process is not as simple as filtering
    out the noise. Because the blurring of the image is essentially a convolution
    of the clean image with the PSF of the blur, the principal procedure in any restoration
    scheme is finding out an inverse procedure to cancel out the effect of the blur
    PSF. This is also called deconvolution, or inverse filtering. Given the image
    model of Equation 7.1 without noise, then


    $g = h \otimes f \Leftrightarrow G = HF, \quad (7.2)$


    where, G, H, and F are the Fourier transforms for g, h, and f, respectively. Therefore,
    by inverse filtering or a deconvolution operation, the original image can be retrieved
    as follows:


    $F = D^{-1}G \Leftrightarrow f = (\mathfrak{F}^{-1}h^{-1}) \otimes g, \quad (7.3)$


    where $\mathfrak{F}^{-1}$ represents the inverse Fourier transform. This seemingly
    simple problem is not so simple in reality. In many practical cases, it is useless
    or even impossible to apply it as given by Equations 7.2 and 7.3. This is because
    the PSF is usually unknown and often zero over wide ranges. Hence, $h^{-1}$ will
    be infinite in this case.


    If additive noise is considered for the inverse filtering problem, then the end
    result will be similar to Equation 7.3 but with an additional term, $h^{-1}\eta$.
    This means that even if H is nonzero, the noise will be amplified by a constant
    factor of $h^{-1}$. In effect, the signal-to-noise ratio in this case is not improved
    but stays the same because noise and the degraded system are amplified by the
    same factor.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'There are three situations with respect to the blurring function and its know-how:


    White box problem: When h is precisely known


    Gray box problem: When partial information is available about h


    Black box problem: When nothing is known about the blurring function


    When the blurring function h(m,n) is not accurately known, it must be estimated
    prior to inverse filtering. Because the attempt is to deconvolve the degraded
    image g(m,n) without any prior knowledge of the cause that is producing the degradation,
    such a procedure is also called blind deconvolution, as it is blind to the source
    of the degradation.


    In MATLAB®, three main types of deconvolution algorithms have been implemented.
    This is by no means an exhaustive list, and newer methods keep popping up in the
    literature from time to time. The chief methods are


    +   1. Lucy-Richardson Method

    +   2. Wiener method

    +   3. Blind method


    The algorithms related to these methods are presented in Section 7.4. Figure 7.3
    shows the results of using the Lucy-Richardson, Wiener, and blind deconvolution
    methods on the car2.jpg image. Specifically, for blind deconvolution, two initial
    blurring functions were tested. The first is a random matrix of size 5 x 5, and
    the second is the same blurring function that caused the blurring in the first
    place.


    The same example is repeated in Figure 7.4 for the motion blur case, with motion
    affecting a neighborhood of 15 pixels and at 45°.


    In general, these algorithms either use a known (or somewhat known) blurring function
    or try to estimate one iteratively. Usually, they rely on second-order statics
    or H2 norms for their convergence. Optimal H2 filters (or Kalman filters) are
    suitable solutions to the filtering and estimation problem when the power spectral
    density of the noise is precisely known.


    In general least-squares estimation problems, one minimizes the integral of the
    power spectral density estimation error. This minimization of the average error
    power or error variance might result in a relatively large error power in some
    frequency range. In many practical situations, however,'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_152_0.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_152_1.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_152_2.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_152_3.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_152_4.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_152_5.png)


    FIGURE 7.3 Results of deconvolution with out-of-focus blur. (a) original image.
    (b) blurred image. (c) deconvolved image with Lucy-Richardson method. (d) deconvolved
    image with Wiener method. (e) deconvolved image with blind method using random
    initial blurring function. (f) deconvolved image with blind method using the same
    initial blurring function.


    there is significant uncertainty in the power spectral density of the noise. An
    appropriate criterion, as argued by Zames, is the H-infinity norm of the estimation
    error spectrum. This H-infinity problem based on the minimization of the magnitude
    of the estimation error spectrum rather than the average power leads to better
    filters compared to other solutions. The H-infinity optimization scheme leads
    to improved performance of the deconvolution process over existing least-squares
    or H2-based solutions, thus leading to enhanced defect impulse response and thereby
    improving the defect identification.


    Given a linear time-invariant (LTI) system with input f(t), output g(t), and a
    transfer function H(s), the H-infinity norm is expressed in time domain as


    ```

    \| H \|^2 = \max_{\|g\|_2 \le 1} \left\{ \frac{\| g \|_2}{\| f \|_2} \right\}
    = \max_{\|f\|_2 \le 1} \left\{ \frac{\sum g^2(k)}{\sum f^2(k)} \right\}. (7.4)

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_153_0.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_153_1.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_153_2.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_153_3.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_153_4.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_153_5.png)


    FIGURE 7.4 Results of deconvolution with motion blur. (a) Original image, (b)
    blurred image, (c) deconvolved image with Lucy-Richardson method, (d) deconvolved
    image with Wiener method, (e) deconvolved image with blind method using random
    initial blurring function, (f) deconvolved image with blind method using the same
    initial blurring function.


    Therefore, the \(H_\infty\) norm is interpreted as the maximum energy gain of
    the system for all finite energy signals. In the frequency domain, the \(H_\infty\)
    norm is expressed as


    ```

    \(\|H\|_\infty = \max_\omega |H(j\omega)|, \quad (7.5)\)

    ```


    that is, it is the largest peak of the frequency response magnitude.


    Once the input-output model is formulated in the form of a transfer function,
    it can be related to an autoregressive moving average (ARMA) process as follows:


    ```

    \(D(z^{-1})g(k) = N(z^{-1})f(k) + n(k), \quad (7.6)\)

    ```


    where \(g(k)\) is the output of the process, \(f(k)\) is the input to the process,
