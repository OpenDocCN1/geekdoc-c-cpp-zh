    # 9.5 THE COMPASS OPERATOR (EDGE TEMPLATE MATCHING)


    This operator usually outputs two images, one estimating the local edge gradient
    magnitude and the other estimating the edge orientation of the input image. The
    source image is convolved with a set of convolution kernels, each of which is
    sensitive to edges in a different orientation. For each pixel, the local edge
    gradient magnitude is estimated with the maximum response of all of these kernels
    at this pixel location:


    ```

    |G| = max(|G_i|, i = 1 to n),

    ```


    where G_i is the response of the kernel i at the particular pixel position and
    n is the total number of convolution kernels. The local edge orientation is estimated
    with the orientation of the kernel that yields the maximum response.'
