- pgno: 146
  md: '# Image Restoration and Blind Deconvolution


    # 7.1 INTRODUCTION


    IMAGE ENHANCEMENT, IN GENERAL, covers all aspects of improving image quality for
    visual purposes. This includes


    +   1. Noise removal

    +   2. Contrast stretching

    +   3. Histogram equalization

    +   4. Filtering

    +   5. Restoration through deconvolution


    All convolution-related topics have been covered in earlier chapters except image
    restoration and the underlying mathematics of deconvolution; these will be discussed
    in this chapter.


    Images are produced in order to record or display useful information. No image
    information is perfect because of inherent physical and technological limitations.
    With the ever-increasing demand for improvement in the quality of digital images,
    there is a need to correct errors caused by the imaging system. These errors have
    many causes, including the hardware; insertion of additive or multiplicative noise
    by both human and'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'other sources; and blurring of the image by linear motion of the imaging equipment
    or misalignment, causing defocusing.


    One of the most intriguing questions in image processing is the problem of recovering
    the desired or perfect image from a degraded version. The amount of lost information
    that can be recovered from the blurred version of an image depends on the extent
    of degradation. This sets a bound on the performance of the image restoration
    algorithm.


    In order to solve the image restoration problem, mathematical models are required
    for real-world processes involved in image generation, formation, and recording.
    It may be argued that the ultimate objective of a restoration scheme is the inverse
    manipulation of the degraded model into the original nondegraded model. If this
    task is performed based on certain statistical knowledge, known beforehand, about
    the degradation process, the medium, and the noise, the procedure is called a
    priori restoration. On the other hand, this information may not be available with
    a high degree of fidelity. In that case, blind restoration or blind deconvolution
    methodologies are adopted.


    # 7.2 IMAGE REPRESENTATION


    In order to understand the functioning of certain restoration techniques, the
    morphology of the target image and the degradation in it should be understood
    first. The general notation for digital images is to consider them as matrices
    represented in x and y coordinates. Thus, an image of interest f(m,n) is a matrix
    of m x n order that is the result of 2D sampling of the real image. However, the
    image model f(m,n) is not the observed image because of the distortion present
    in the imaging system. A general imaging system block diagram is shown in Figure
    7.1.


    Hence, the observed image g(m,n) is given by


    g(m,n) = f(m,n) \circledast h(m,n) + \eta(m,n), (7.1)


    ![](img/fc093ca9cc8a631842aa559a749dca54_147_0.png)


    FIGURE 7.1 Imaging system and its block diagram.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'where h(m,n) represents the degradation model, and ⊗ represents the 2D convolution
    operation. The additive term η(m,n) represents the noise added to the degraded
    image, further increasing the distortion of image. The blurring function in the
    main block is a function of the pixel coordinates m and n, and a parameter list
    θ. This list depends on the type of representation used for the blurring function.
    For instance, for a Gaussian function, the parameter list only comprises two parameters,
    mean and variance, and so on. In some applications, noise can also be considered
    multiplicative, in which case the restoration problem is more difficult than in
    the additive noise case. The function h(m,n) is also called the point spread function
    (PSF) in the image processing literature, and depends on the type of distortion
    or degradation.


    The degradation h(m,n) can be convolved with the clean image because of several
    factors. Among them, the most prominent are hardware misalignment, malfunction,
    human errors, and electronic noise. In nearly any practical situation, a device
    of finite spatial extent records an image. As a result, not all the data that
    is needed to model the real object is available.


    Convolution in the Fourier domain is identical in result to that in the spatial
    domain, in which a kernel of values (a blur function) is applied to every pixel
    in the image. In Fourier space, this simply involves multiplying the transform
    of the blur function with the transform of the image, pixel by pixel. In many
    cases, it will be easier to construct the kernel as an image rather than as a
    set of numerical values. This is particularly true when the kernel is not symmetrical.
    Sometimes, the blur function can be measured directly by acquiring an image of
    a point (e.g., a star in astronomical images). Some examples of such convolutions
    are shown applied to the car image in Figure 7.2.


    This also implies that it is possible to remove blur from a blurred image by dividing
    by the transform of the blur, and this process is called deconvolution. It deconvolves
    the main image using the content of the image previously designated. Deconvolution
    is typically used to remove blur from an image due to out-of-focus optics or motion
    while capturing the image with a camera. There are other applications in which
    deconvolution can be employed, to remove specific blurring function. In general,
    when deconvolving such blurs, one image is the blurred image and a second image
    is used that contains information related to the PSF of the blur only. By using
    this second image in the same format as that of the blurred image, it facilitates
    the algorithmic procedures in terms of speed and memory requirements.


    Figure 7.2 shows what it means to perform deconvolution. The car2.jpg image has
    first been convolved with two different types of blur or PSFs and'
  merge: -1
  img_proc: true
