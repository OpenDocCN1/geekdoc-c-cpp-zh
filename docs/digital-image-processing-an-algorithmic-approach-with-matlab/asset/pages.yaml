  md: '# Image Acquisition, Types, and File I/O


    # 2.1 IMAGE ACQUISITION


    Image processing begins with the image; hence, image acquisition is the first
    key step to investigate. Both the hardware and software used for acquisition can
    appear quite different, depending on the type of image source and interface. This
    can vary from video cameras with appropriate frame grabbers (either on a card
    internal to the computer or an external device connected to it by a parallel or
    serial interface), to digital cameras with their own serial or SCSI interfaces,
    to slide or flatbed scanners usually with an SCSI or USB interface. Connecting
    to this hardware properly and installing the appropriate software drivers is sometimes
    confusing, particularly under Windows. The following is an abridged list of common
    sources for image acquisition:


    +   - Real-world 3D objects are converted into digital images

    +     - Cameras (CCD, CID, CMOS)

    +     - Infrared cameras

    +     - Ultrasounds

    +     - X-rays and radiography

    +     - Magnetic resonance imaging (MRI)

    +     - Satellite imagers

    +   - Scanners'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 2.1.1 Cameras


    The cameras and recording media available for modern digital image processing
    applications are changing at a significant pace. Various types of technologies
    are available in the market, such as charge-coupled device (CCD), charge injection
    device (CID), and complementary metal oxide semiconductor (CMOS) cameras. The
    techniques that are used to characterize the basic type of CCD camera remain “universal”
    and can be transparently applied to other technologies. The basic principle of
    any charge-based camera is the emission of charges proportional to the incident
    light on these cells from the photosensitive elements or cells present in the
    main imaging hardware.


    Whereas regular cameras generate images based on the photoemissions of sensors
    in the camera, infrared cameras exploit similar behavior of thermal cells; hence,
    they can detect “heat waves” within certain temperature ranges and convert them
    into electrical signals, which are then displayed as images. If the same principle
    is modified with radiation sensors, then a camera would detect the radioactive
    emissions and generate the equivalent electrical signals. This constitutes the
    basis of generation of digital x-rays and other radiographic images. All of these
    cameras are still direct imaging methods, in which the image is obtained directly
    from the source object without any mapping or transformation of the data space.
    Figure 2.1 shows some of the commonly used cameras for various applications.


    However, ultrasonic and MRI images are not obtained so easily. They have to go
    through massive mapping and transformation operations before they can be seen.
    A typical ultrasonic image is based on the reflections of sound waves from the
    nonhomogeneities in its path. These reflections are recoded with precise time-of-flight
    (ToF) information related to the arrival of this reflection at the sensor. One
    such waveform in 1D is called A-scan. If the ultrasonic transceiver is now shifted
    and a new reflection is obtained, then this will be another A-scan. This procedure
    is repeated for the whole area to be imaged, and a huge data cube is obtained.
    Taking slices out of this cube perpendicular to the direction of the input ultrasonic
    pulse, and assigning normalized values to the various points present in the slice
    will appear as the cross-sectional image of the data cube and is called C-scan.
    Figure 2.2 shows the typical ultrasonic scanning principle and the resulting image
    as used in ultrasonic nondestructive testing of metals.'
  merge: -1
  img_proc: true
