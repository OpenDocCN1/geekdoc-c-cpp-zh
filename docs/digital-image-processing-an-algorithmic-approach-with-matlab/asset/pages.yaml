- pgno: 60
  md: '+   - Color spaces are interchangeable in MATLAB from RGB to HSV or YCbCr.
    Other specialized formats are also provided in the toolbox, to which the image
    can be converted from RGB.

    +   - An RGB image is composed of three layers corresponding to the red, green,
    and blue intensities in the image. A simple procedure has been outlined to view
    these color layers separately.

    +   - Indexed images are specialized images used within MATLAB only, and can be
    employed for better storage utilization.

    +   - Index images can also be used to limit the number of color levels by specifying
    them.

    +   - The grayscale image is the most commonly used image form for most image
    processing algorithms.

    +   - Grayscale images can have any value between 0 and 255 for unsigned integer
    representation.

    +   - Binary images are formed by thresholding the grayscale image such that any
    value below this threshold becomes 0 and other values become 1.

    +   - For certain operations, it is helpful to convert an image to a different
    image type. For example, if you want to filter a color image that is stored as
    an indexed image, you should first convert it to RGB format. When you apply the
    filter to the RGB image, MATLAB filters the intensity values in the image, as
    appropriate. If you attempt to filter the indexed image, MATLAB simply applies
    the filter to the indices in the indexed image matrix, and the results might not
    be meaningful.

    +   - The following table lists all the image conversion functions in the Image
    Processing Toolbox.


    | Function | Description |

    |---|---|

    | dither | Create a binary image from a grayscale intensity image by dithering;
    create an indexed image from a grayscale intensity image |

    | gray2ind | Create an indexed image from a grayscale intensity image |

    | im2bw | Create a binary image from an intensity image, indexed image, or RGB
    image, based on a luminance threshold |

    | ind2gray | Create a grayscale intensity image from an indexed image |

    | ind2rgb | Create an RGB image from an indexed image |

    | rgb2gray | Create a grayscale intensity image from an RGB image |

    | rgb2ind | Create an indexed image from an RGB image |'
