- pgno: 236
  md: '# Image Classification and Segmentation


    # 12.1 INTRODUCTION


    CLASSIFICATION, IN GENERAL, REFERS TO CLUSTERING OR GROUPING DATA ITEMS INTO SIMILAR
    SETS. THIS INFORMATION IS OFTEN USEFUL IN THE ANALYSIS STEP FOR ANY SIGNAL/DATA
    PROCESSING SYSTEM. IMAGE CLASSIFICATION IS SIMILAR TO GENERAL DATA CLASSIFICATION,
    BUT IT MAY BE DIFFERENT DEPENDING ON THE APPLICATION IN WHICH IT IS USED. FOR
    INSTANCE, IN A SATELLITE IMAGE, IT MIGHT BE REQUIRED TO ISOLATE THE FIELDS FROM
    ROADS OR PLAINS FROM LOCALITIES. THIS INFORMATION MAY BE NEEDED FOR VISUAL INSPECTION
    FOR PLANNING PURPOSE ONLY AND, HENCE, IT WOULD BE SUFFICIENT TO REDRAW THESE ARTIFACTS
    IN VARIOUS COLORS REPRESENTING EACH CLASS WITH A DIFFERENT BUT MEANINGFUL COLOR.
    ON THE OTHER HAND, THE SAME INFORMATION MAY BE NEEDED BY AN UNMANNED AIRPLANE
    TO CARRY OUT A CERTAIN MILITARY MISSION, FOR WHICH PURPOSE A KNOWLEDGE OF THE
    CENTERS OR CERTAIN COORDINATES ON THESE CLASSES WOULD BE NEEDED RATHER THAN COLORED
    REPRESENTATIONS. ACCORDINGLY, THE TASK OF IMAGE CLASSIFICATION BECOMES MORE COMPLICATED.


    A HUMAN ANALYST ATTEMPTING TO CLASSIFY FEATURES IN AN IMAGE USES THE ELEMENTS
    OF VISUAL INTERPRETATION TO IDENTIFY HOMOGENEOUS GROUPS OF PIXELS THAT REPRESENT
    VARIOUS FEATURES FOR THE CLASSES OF INTEREST. DIGITAL IMAGE CLASSIFICATION USES
    THE SPECTRAL INFORMATION REPRESENTED BY DIGITAL NUMBERS IN ONE OR MORE SPATIAL
    OR SPECTRAL BANDS, AND ATTEMPTS TO CLASSIFY EACH INDIVIDUAL PIXEL BASED ON THIS
    INFORMATION. THE RESULTING CLASSIFIED IMAGE'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'comprises a mosaic of pixels, each of which belongs to a particular class,
    and is essentially a thematic “map” of the original image.

    When talking about classes, we need to distinguish between information classes
    and spatial/spectral classes. Information classes are those categories of interest
    that the analyst is actually trying to identify in the imagery, such as different
    kinds of crops, different forest types or tree species, different geologic units
    or rock types, etc. Spatial/spectral classes are groups of pixels that are uniform
    (or near-similar) with respect to their brightness values in the different spectral
    channels of the data. The objective is to match these classes in the data to the
    information classes of interest. Rarely is there a simple one-to-one match between
    these two types of classes. Rather, unique spatial/spectral classes may appear
    that do not necessarily correspond to any information class of particular use
    or interest to the analyst. It is the analyst’s job to decide on the utility of
    the different classes and their correspondence to useful information.


    Common classification procedures can be broken down into two broad subdivisions,
    based on the method used.


    # 12.1.1 Supervised Classification


    In this classification method, the analyst identifies in the imagery homogeneous
    representative samples of the different surface cover types (information classes)
    of interest. These samples are referred to as training areas. The selection of
    appropriate training areas is based on the analyst’s familiarity with the geographical
    area and their knowledge of the actual surface cover types present in the image.
    Thus, the analyst is “supervising” the categorization of a set of specific classes.
    The numerical information in all spectral bands for the pixels comprising these
    areas are used to “train” the computer to recognize spectrally similar areas for
    each class. The computer uses a special program or algorithm (of which there are
    several variations) to determine the numerical “signatures” for each training
    class. Once the computer has determined the signatures for each class, each pixel
    in the image is compared to these signatures and labeled as the class it most
    closely “resembles” digitally.


    # 12.1.2 Unsupervised Classification


    This method in essence reverses the supervised classification process. Spatial/spectral
    classes are grouped first, based solely on the numerical information in the data,
    and are then matched by the analyst to'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'information classes (if possible). Programs, called clustering algorithms,
    are used to determine the natural (statistical) groupings or structures in the
    data. Usually, the analyst specifies how many groups or classes are to be looked
    for in the data. In addition to specifying the desired number of classes, the
    analyst may also specify parameters related to the separation distance among the
    clusters and the variation within each cluster. The final result of this iterative
    clustering process may result in some clusters that the analyst will want to subsequently
    combine, or clusters that should be broken down further, each of these requiring
    a further application of the clustering algorithm. Thus, unsupervised classification
    is not completely without human intervention. However, unlike a supervised classification,
    it does not start with a predetermined set of classes.


    # 12.2 GENERAL IDEA OF CLASSIFICATION


    Classification includes a broad range of decision-theoretic approaches to the
    identification of images (or parts thereof). All classification algorithms are
    based on the assumption that the image in question depicts one or more features
    (e.g. geometric parts in the case of a manufacturing classification system, or
    spectral regions in the case of remote sensing) and that each of these features
    belongs to one of several distinct and exclusive classes. The classes may be specified
    a priori by an analyst (as in supervised classification) or automatically clustered
    (i.e., as in unsupervised classification) into sets of prototype classes, where
    the analyst merely specifies the number of desired categories. (Classification
    and segmentation have closely related objectives, as the former is another form
    of component labeling that can result in segmentation of various features in a
    scene.)


    Image classification analyzes the numerical properties of various image features
    and organizes data into categories. Classification algorithms typically employ
    two phases of processing: training and testing. In the initial training phase,
    characteristic properties of typical image features are isolated and, based on
    these, a unique description of each classification category, that is, training
    class, is created. In the subsequent testing phase, these feature-space partitions
    are used to classify image features.


    The description of training classes is an extremely important component of the
    classification process. In supervised classification, statistical processes (i.e.,
    based on an a priori knowledge of probability distribution functions) or distribution-free
    processes can be used to extract class descriptors. Unsupervised classification
    relies on clustering algorithms to automatically'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'segment the training data into prototype classes. In either case, the motivating
    criteria for constructing training classes are that they are


    +   - Independent: A change in the description of one training class should not
    change the value of another.

    +   - Discriminatory: Different image features should have significantly different
    descriptions.

    +   - Reliable: All image features within a training group should share the common
    definitive descriptions of that group.


    # 12.3 COMMON INTENSITY-CONNECTED PIXEL: NAÏVE CLASSIFIER


    Connected components labeling scans an image and groups its pixels into components
    based on pixel connectivity; that is, all pixels in a connected component share
    similar pixel intensity values and are in some way connected with each other.
    Once all groups have been determined, each pixel is labeled with a gray level
    or a color (color labeling) according to the component it was assigned to. Extracting
    and labeling of various disjoint and connected components in an image is central
    to many automated image analysis applications.


    +   - If all four neighbors are 0, assign a new label to p, else

    +   - if only one neighbor has V = {1}, assign its label to p, else

    +   - if more than one neighbor has V = {1}, assign one of the labels to p and
    make a note of the equivalences.


    After completing the scan, the equivalent label pairs are sorted into equivalence
    classes and a unique label is assigned to each class. As a final step, a second
    scan is made of the image, during which each label is replaced by the label assigned
    to its equivalence classes. For display, the labels might be different gray levels
    or colors.


    As the first example of such a procedure, consider Figure 12.1. The figure shows
    the RGB image of the horses with sky, land, water, and the horses as the four
    main classes visible in the image. A very naïve method of classification would
    be to use the grayscale ranges that represent these classes. Obviously, this is
    not a very good classifier because different gray shades will be found for different
    objects not related to each other.'
  merge: -1
  img_proc: true
