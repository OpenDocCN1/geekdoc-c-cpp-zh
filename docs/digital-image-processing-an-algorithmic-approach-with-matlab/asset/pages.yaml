  md: 'smoother image in the spatial domain, whereas attenuating low frequencies enhance
    the edges. This is based on the property of the Fourier transform whereby convolution
    in the spatial domain becomes multiplication in the frequency domain, thus reducing
    the computation required for the filtering process by two thirds. The transformation
    and inverse transformations can be done as independent processes at the two ends
    of the process block. The general idea is as follows:


    ```

    G(u,v) = F(u,v)H(u,v),

    \Leftrightarrow

    g(m,n) \Leftrightarrow G(u,v),

    (6.4)

    ```


    where g(m,n) is the resulting image, f(m,n) is the original image, and h(m,n)
    is the filter kernel in the spatial domain. Correspondingly, G(u,v), F(u,v), and
    H(u,v) are the frequency domain representations of the same. All frequency filters
    can also be implemented in the spatial domain and, if there exists a simple kernel
    for the desired filter effect, it is computationally less expensive to perform
    the filtering in the spatial domain. Frequency filtering is more appropriate if
    no straightforward kernel can be found in the spatial domain, and may also be
    more efficient.


    In contrast to the frequency domain, it is possible to implement non-linear filters
    in the spatial domain. In this case, the summations in the convolution function
    are replaced with some kind of nonlinear operator:


    ```

    G(u,v) = O_{u,v}[F(u,v)H(u,v)],

    (6.5)

    ```


    where O_{u,v} represents a nonlinear operation on the frequency space. The nonlinear
    function could be a specific shape filter, say Gaussian, or it may be some type
    of masking operation, or some algorithmic steps for iterative selection of values
    in an image.


    The form of the filter function determines the effects of the operator. There
    are basically three different kinds of filters: low-pass, high-pass, and bandpass
    filters. A low-pass filter attenuates high frequencies and leaves low frequencies
    unchanged. The result in the spatial domain is equivalent to that of a smoothing
    filter as the blocked high frequencies correspond to sharp intensity changes,
    that is, to the fine-scale details and noise in the spatial domain image. A high-pass
    filter, on the other hand, yields edge enhancement or edge detection in the spatial
    domain, because edges contain many high frequencies. Areas of rather constant'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'gray level consist of mainly low frequencies and are therefore suppressed.
    A bandpass filter attenuates very low and very high frequencies, but retains a
    middle range band of frequencies. Bandpass filtering can be used to enhance edges
    (suppressing low frequencies) while reducing the noise at the same time (attenuating
    high frequencies).


    The most simple low-pass filter is the ideal low-pass filter. It suppresses all
    frequencies higher than the cutoff frequency f0 and leaves smaller frequencies
    unchanged. Essentially, it is like a masking operation where a circle of all 1s
    is ANDed with the Fourier-transformed image. However, such a sharp cutoff causes
    the ringing effect when the image is reverse-transformed into the spatial domain.
    A better approach is to use a gradual cutoff shape such as a Gaussian mask. Figure
    6.7 shows these filter masks and their effects.


    Figure 6.8 is a repetition of Figure 6.7 for a salt-and-pepper noise-corrupted
    image.


    The same principles apply to high-pass filters. We obtain a high-pass filter function
    by inverting the corresponding low-pass filter; for example, an ideal high-pass
    filter blocks all frequencies smaller than f0 and leaves the others unchanged.


    Bandpass filters are a combination of both low-pass and high-pass filters. They
    attenuate all frequencies smaller than frequency f0 and higher than frequency
    f1, whereas the frequencies between the two cutoffs remain in the resulting output
    image. We obtain the filter function of a bandpass filter by multiplying the filter
    functions of a low-pass and of a high-pass filter in the frequency domain, where
    the cutoff frequency of the low-pass filter is higher than that of the high-pass
    filter.


    # 6.4 ALGORITHMIC ACCOUNT


    The algorithmic descriptions of the various types of filters discussed earlier
    are given in the following subsections, divided according to the generic algorithms
    and not the specific filter type.


    # 6.4.1 Spatial Filtering (Convolution Based)


