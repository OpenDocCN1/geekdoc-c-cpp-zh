    # ## 2.2 IMAGE TYPES AND FILE I/O


    Once an image is acquired by the imaging system, it can be read into the computer''s
    memory as a matrix. However, how this image is actually treated in the secondary
    storage medium varies with type of images and information content. Based on the
    storage types or file I/O standards, the most commonly used imaging formats in
    the Windows environment are as follows:


    +   1. Bitmap (.bmp)

    +   2. Joint Photographic Experts Group (.jpg)

    +   3. Graphics Interchange Format (.gif)

    +   4. Tagged Image File Format (.tif)'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'There are several other formats such as Windows Meta File (.wmf), Portable
    Network Graphics (.png), Postscript (.ps), Encapsulated Postscript (.eps), Extended
    Meta File (.emf), etc. However, the four types listed earlier are the most commonly
    used types and will be used in this book for several examples with MATLAB® files.
    Reading any of these types requires the function imread(), which will be discussed
    further in Section 2.5.


    # 2.2.1 Bitmap Format


    The BMP file format is the standard for a Windows 3.0 or later environment. It
    may use compression, although usually it does not compress the images, and is
    (by itself) not capable of storing animation. The image data itself can either
    contain pointers to entries in a color table or literal RGB values (this is explained
    later in this chapter).


    # 2.2.2 JPEG Format


    JPEG is actually a standardized algorithm (not an image type!) to compress natural
    images such as .bmp files or .tiff files. The details of this format will be discussed
    in Chapter 8; however, it will suffice here to state that this algorithm converts
    the natural pixels of the image using mathematical transformations and redefines
    the bit allocation and association structure in the image.


    # 2.2.3 GIF Format


    GIF, the brainchild of CompuServe Inc., was specifically developed for images
    on the Internet. It defines a protocol intended for online transmission and interchange
    of raster graphic data in a way that is independent of the hardware used in their
    creation or display. A GIF data stream is a sequence of protocol blocks and subblocks
    representing a collection of graphics. These blocks are connected through relational
    flags. GIF files are relatively easy to work with but cannot be used for high-precision
    color because only 8 bits are used to encode colors. Colors are encoded using
    local or global color tables and a built-in LZW compression algorithm. This compression
    algorithm is patented technology, and is currently owned by Unisys Corporation.
    This format encodes multiple images within a single file with embedded details
    of image locations on the screen, interlaced'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'display, delay time between adjacent image frames, background color, and transition
    information.


    # 2.2.4 TIFF Format


    The TIFF format is controlled by a specification jointly written by Aldus Corporation
    and Microsoft. The format was designed to incorporate various formats with a futuristic
    vision. It is a complicated and platform-independent format made up of three unique
    data structures: Image File Header (IFH), Image File Directory (IFD), and Directory
    Entry (DE). The format is very similar to BMP, at least in terms of storage and
    usage.


    Any of these formats can also be used for writing an image from MATLAB workspace
    to the secondary storage. The function imwrite() is used for this purpose and
    will be further discussed in Section 2.5.


    # 2.3 BASICS OF COLOR IMAGES


    Similar to several other achievements in the areas of science and engineering
    that were inspired by nature, image processing takes its inspiration from the
    best imaging system in nature, the human eye. The photo-sensitive area of the
    eye is called the retina, which contains two types of light-sensitive cells called
    rods and cones (according to their shapes). Rods are responsible for producing
    the sensation of light intensity as well as perception of boundaries and edges
    in a view scene. The cones are responsible for color perception. These are of
    three types and are commonly called S-, L-, and M-type cells. The responses of
    the cone cells were experimentally recorded in the late 1970s, based on the maximum
    excitation of the cells with respect to a particular frequency of the incident
    light. Light of variable frequency would represent a particular color for a particular
    frequency. The responses of the three cone cells were found to be maximum for
    420, 534, and 564 nm, respectively. These wavelengths (and consequently, the frequencies)
    correspond to blue, green, and red colors, respectively. Hence, it was discovered
    that human color perception is based on a triad of fundamental colors, RGB, which
    has since remained the most fundamental color model used in digital image processing.
    Figure 2.4 shows the human eye and the sensory cells along with the sensitivity
    curves for the RGB model.


    This forms the basis of the most fundamental color model system called the RGB
    (Red, Green, Blue). In fact, once an image is loaded into'
