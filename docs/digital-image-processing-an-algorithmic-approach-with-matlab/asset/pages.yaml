    Image subtraction is used both as a substep in complicated image processing sequences,
    and also as an important operation in its own right. Two examples of the usage
    of this operator follow.


    A common use is to subtract background variations in illumination from a scene
    so that the foreground objects in it may be more easily analyzed. Figure 3.6(a)
