- pgno: 113
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_113_0.png)


    FIGURE 5.3 Basic principle of wavelet transformation.


    be kept in order to perfectly reconstruct the signal. More specifically, this
    means that upsampling can be used to remove every second sample. The scale has
    now been doubled. The resolution has also been changed; the filtering made the
    frequency resolution better, but reduced the time resolution.


    The approximation subsignal can then be put through a filter bank, and this is
    repeated until the required level of decomposition has been reached. These ideas
    are shown in Figure 5.3.


    At every level, four subimages are obtained: the approximation, the vertical detail,
    the horizontal detail, and the diagonal detail. Wavelet analysis has revealed
    how the image changes vertically, horizontally, and diagonally. This process can
    be further repeated for the approximate subsignal for many levels until a certain
    set of criteria is met, which depends on the application. With each decomposition,
    a new approximation is obtained that is much smaller in size. The decomposition
    pattern for images is shown in Figure 5.4.


    Figure 5.5 shows a typical example of application of decomposition with the wavelet
