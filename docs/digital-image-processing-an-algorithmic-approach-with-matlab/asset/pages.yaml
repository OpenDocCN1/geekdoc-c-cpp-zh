  md: '# About the Authors


    Uvais Qidwai received his Ph.D. from the University of Massachusetts-Dartmouth
    in 2001, where he studied in the electrical and computer engineering department.
    He taught in the electrical engineering and computer science department at Tulane
    University, in New Orleans, as an assistant professor, and was in charge of the
    robotics lab from June 2001 to June 2005. He joined the computer science and engineering
    department, Qatar University, in the Fall of 2005 as an assistant professor. His
    present interests in research include robotics, image enhancement and understanding
    for machine vision applications, fuzzy computations, signal processing and interfacing,
    expert system for testing pipelines, and intelligent algorithms for medical informatics.
    He has participated in several government- and industry-funded projects in the
    United States, Saudi Arabia, Qatar, and Pakistan, and has published over 55 papers
    in reputable journals and conference proceedings. His most recent research is
    related to target tracking in real-time video streams for sports medicine, robotic
    vision applications for autonomous service robots, and development of new data
    filters using imaging techniques.


    C. H. Chen received his Ph.D. in electrical engineering from Purdue University
    in 1965. He has been a faculty member with the University of Massachusetts-Dartmouth
    since 1968 where he is now chancellor professor. He has taught the digital image
    processing course since 1975. Dr. Chen was the associate editor of IEEE Transactions
    on Acoustics, Speech, and Signal Processing from 1982 to 1986, and associate editor
    on information processing for remote sensing of IEEE Transactions on Geoscience
    and Remote Sensing 1985 to 2000. He is an IEEE fellow (1988), life fellow (2003),
    and also a fellow of the International Association of Pattern Recognition (IAPR
    1996). Currently, he is an associate editor of the International'
