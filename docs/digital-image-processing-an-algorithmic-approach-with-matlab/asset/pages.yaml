    # 2.4 OTHER COLOR SPACES


    MATLAB''s Image Processing Toolbox includes functions that you can use to convert
    RGB data to several common device-dependent color spaces, and vice versa.


    # 2.4.1 YIQ Color Space


    The National Television System Committee (NTSC) defines a color space as YIQ.
    This color space is used in televisions in the United States. One of the main
    advantages of this format is that grayscale information is separated from color
    data; therefore, having three components—luminance (Y), hue (I), and saturation
    (Q)—enables the same signal to be used for both color and black-and-white sets.
    Luminance represents grayscale information, whereas the last two components make
    up chrominance (color information). The YIQ model is related to the RGB color
    cube as follows:


    ```

    [ Y ]   [ 0.299  0.587  0.144 ] [ R ]

    [ I ] = [ 0.596 -0.275 -0.321 ] [ G ] .   (2.1)

    [ Q ]   [ 0.212 -0.528  0.311 ] [ B ]


    [ R ]   [ 0.9736  0.9873  0.5682 ] [ Y ]

    [ G ] = [ 0.9675 -0.2385 -0.6941 ] [ I ] .   (2.2)

    [ B ]   [ 0.9789 -1.0779  1.6497 ] [ Q ]

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 2.4.2 YC_bC_r Color Space


    The YC_bC_r color space is widely used for digital video. In this format, luminance
    information is stored as a single component (Y), and chrominance information is
    stored as two color-difference components (C_b and C_r). C_b represents the difference
    between the blue component and a reference value. C_r represents the difference
    between the red component and a reference value. This format is used in JPEG compression
    of images as well. This color space is related to the RGB model according to the
    following set of equations:


    ```

    Y'' = K_r \times R'' + (1 - K_r - K_b) \times G'' + K_b \times B'',

    C_b = \frac{1}{2} \times \frac{B'' - Y''}{1 - K_b},

    C_r = \frac{1}{2} \times \frac{R'' - Y''}{1 - K_r}.

    (2.3)

    ```


    Per TV standard ITU-R BT.601 (formerly known as CCIR 601), the value of K_b is
    0.114 and of K_r is 0.299.


    # 2.4.3 HSV Color Space


    The HSV color space (hue, saturation, value) is often used by people who select
    colors (e.g., of paints or inks) from a color wheel or palette, because it corresponds
    better to how people experience color than the RGB color space does. As hue varies
    from 0 to 1.0, the corresponding colors vary from red through yellow, green, cyan,
    blue, magenta, and back to red, so


    ![](img/fc093ca9cc8a631842aa559a749dca54_51_0.png)


    FIGURE 2.6 (See color insert following Page 204.) Illustration of the HSV color
    space.'
  merge: -1
  img_proc: true
