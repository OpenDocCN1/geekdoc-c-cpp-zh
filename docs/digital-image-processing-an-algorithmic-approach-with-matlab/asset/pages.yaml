  md: '# # Soft Computing in Image Processing


    # ## 15.1 INTRODUCTION


    FOR THE PAST THREE decades, there have been two major groups of researchers in
    the field of algorithmic development for real systems; the first group believes
    that such development can only be done by using conventional mathematical and
    probabilistic techniques, whereas the second group emphasizes that there are other
    methods of applying mathematical knowledge that need not be that restrictive in
    terms of boundaries and samples. Soft computing differs from conventional (hard)
    computing in that, unlike hard computing, it is tolerant of imprecision, uncertainty,
    partial truth, and approximation. In effect, the role model for soft computing
    is the human mind. Certainly, the way our brain works is different from the way
    a microprocessor works because our brain can get an intuitive “feel” of things
    rather than exact measured values, and its estimates are perceptive rather than
    numeric. Hence, the guiding principle of soft computing is this: Exploit the tolerance
    for imprecision, uncertainty, partial truth, and approximation to achieve tractability,
    robustness, and low solution cost. The basic ideas underlying soft computing in
    its current incarnation have links to many earlier influences, with Zadeh’s 1965
    paper on fuzzy sets holding a pioneering position. In fact, for many years, soft
    computing was being'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'referred to as fuzzy logic as well. However, the set has grown since, and now
    the principal constituents of soft computing are


    +   - Fuzzy systems

    +   - Neural networks

    +     - Preceotron-based

    +     - Radial basis functions

    +     - Self-organizing maps

    +   - Evolutionary computation

    +     - Evolutionary algorithms

    +     - Genetic algorithms

    +   - Harmony search

    +   - Swarm intelligence

    +   - Machine learning

    +   - Chaos theory


    What is important to note is that soft computing is not an amalgam of various
    techniques; rather, it is a partnership in which each of the components contributes
    a distinct methodology to address problems in its domain. This notion has an important
    consequence: in many cases, a problem can be solved most effectively by using
    a combination of the constituent techniques rather than exclusively by any single
    technique. A striking example of a particularly effective combination is what
    has come to be known as neuro-fuzzy systems. Such systems are becoming increasingly
    visible as consumer products, ranging from air conditioners and washing machines
    to photocopiers and camcorders.


    Soft computing attempts to study, model, and analyze very complex phenomena, those
    for which more conventional methods have not yielded low-cost, analytic, and complete
    solutions. Earlier computational approaches could model and precisely analyze
    only relatively simple systems. More complex systems arising in biology, medicine,
    the humanities, management sciences, and similar fields often remained intractable
    to conventional mathematical and analytical methods.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 15.2 FUZZY LOGIC IN IMAGE PROCESSING


    This chapter presents only fuzzy logic and its applications in the image processing
    domain because it would be impossible to cover all the soft computing constituent
    technologies in this book. One added advantage of working with fuzzy logic is
    its simplicity and the ease with which the underlying concepts can be understood.
    This will be explained in the following sections using two examples related to
    image classification and image filtering.


    Fuzzy set theory is the extension of conventional (crisp) set theory. It handles
    the concept of partial truth [truth values between 1 (completely true) and 0 (completely
    false)]. It was introduced by Prof. Lotfi A. Zadeh of the University of California
    at Berkeley in 1965 as a mean of modeling the vagueness and ambiguity in complex
    systems. Since then, it has been used in increasingly diversified applications
    covering almost every discipline in science and technology.


    The application of fuzzy logic to image processing can be explained in light of
    the actual working mechanism of the logic itself, as shown in Figure 15.1. The
    system shown in Figure 15.1 requires expert knowledge related to the image and
    must undergo necessary processing before it can be incorporated as an embedded
    part of the rule base or other functionalities of fuzzy logic. For instance, knowledge
    of changing light intensity in an irregularly illuminated image, imparted to the
    system by the user, will


    ![](img/fc093ca9cc8a631842aa559a749dca54_286_0.png)


    FIGURE 15.1 Functional block diagram for a fuzzy image processing system.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'be used to modify the membership function in the RUN mode so that it may be
    adjusted/adapted to the desired thresholds. This can be utilized as an adaptive
    edge detector.


    Similarly, for uneven blurring, expert knowledge will identify the type of blur
    on the fly, and membership functions as well as the rule base can be modified
    accordingly. Yet another example could be a binary image converter. For instance,
    one may want to define a set of gray levels that share the property “dark.” In
    classical set theory, a threshold has to be determined, say, the gray level 100.
    All gray levels between 0 and 100 are elements of this set, whereas the others
    do not belong to the set [Figure 15.2(a)]. But darkness is a matter of degree.
    So, a fuzzy set can model this property much better. To define this set, one also
    needs two thresholds, say, gray levels 50 and 150. All gray levels that are less
    than 50 are full members of the set, whereas all gray levels that are greater
    than 150 are not the members of the set. The gray levels between 50 and 150, however,
    have a partial membership in the set as shown in Figure 15.2(b). Figure 15.2(c)
    depicts this idea with respect to the functionality diagram for fuzzy logic.


    # 15.2.1 Why Fuzzy Image Processing?


    Before proceeding further to actual examples, it would be appropriate to answer
    a legitimate question at this point. “Why should one use fuzzy techniques in image
    processing?” There are many reasons, the most important of which are the following:


    +   Fuzzy techniques are powerful tools for knowledge representation and processing.


    +   Fuzzy techniques can manage vagueness and ambiguity efficiently.


    In many image processing applications, one has to use expert knowledge to overcome
    difficulties such as object recognition, scene analysis, etc. Fuzzy set theory
    and fuzzy logic offer us powerful tools to represent and process human knowledge
    in the form of fuzzy if–then rules. On the other side, many difficulties in image
    processing arise because the data/tasks/results are uncertain. This uncertainty,
    however, is not always due to randomness but to ambiguity and vagueness. Beside
    randomness, which can be managed by probability theory, one can identify three
    other types of imperfection in routine image processing:'
