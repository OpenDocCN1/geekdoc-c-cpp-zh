  md: 'that there are actually red values both at 0 and 1.0. As saturation varies
    from 0 to 1.0, the corresponding colors (hues) vary from unsaturated (shades of
    gray) to fully saturated (no white component). As value, or brightness, varies
    from 0 to 1.0, the corresponding colors become increasingly brighter. Figure 2.6
