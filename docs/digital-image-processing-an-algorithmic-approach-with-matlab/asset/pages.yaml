    +   - "cmor": Complex Morlet wavelets


    The inverse wavelet transform is used to reconstruct the function from its wavelet
    representation. This is represented as follows:


    \( f(m,n) = \sum_{a_1=0}^{A_1-1} \sum_{b_1=0}^{A_1-1} \sum_{a_2=0}^{A_2-1} \sum_{b_2=0}^{B_2-1}
    F(a, b_1, a_2, b_2) \frac{1}{\sqrt{b_1 b_2}} \psi^{(1)} \left( \frac{m-a_1}{b_1},
    \frac{n-a_2}{b_2} \right). \quad (5.7) \)


    Discrete wavelet analysis is usually computed using the concept of filter banks.
    Filters of different cutoff frequencies analyze the signal at different scales.
    Resolution is changed by the filtering, the scale is changed by upsampling and
    downsampling. If a signal is put through two filters:


    +   1. High-pass filter—High-frequency information is retained, low-frequency
    information is lost.

    +   2. Low-pass filter—Low-frequency information is retained, high-frequency information
    is lost.


    Then the signal is effectively decomposed into two parts, a detailed part (high-frequency),
    and an approximation part (low-frequency). The sub-signal produced from the low
    filter will have a high frequency equal to half that of the original. According
    to Nyquist sampling, this change in frequency range means that only half of the
    original samples need to'
  merge: -1
