    The main problems were the inconsistent shadows of the balloons and the light
    glare on their surface, as well as lighting-related background changes.


    Though it may seem simple, there are actually several subtraction steps to go
    through in order to achieve good results. The technique works well for a static
    environment with single or very few moving objects (including the target). Changes
    in background will cause the bloblike noise. In all of the following algorithms,
    this noise is removed at the end of the algorithm as a postprocessing procedure.
    This has been done here by using the morphological operations (discussed in Chapter
    10).


    The first step is, as described earlier, to take the current frame and subtract
    it from the reference background. The difference yields the foreground objects
    but also some noise, because the reference background is never static; it always
    changes somewhat over time, as mentioned earlier. One can also apply an M × M
    averaging filter in order to reduce this noise. The absolute difference between
    the current frame and the background frame is defined by


    G₁(m,n,k) = (1/M²) | Σₚ₌₁^(M-1) Σ_q₌₁^(M-1) F(p,q,k) - B(p,q,k) |, (13.1)


    where F(p,q,k) is the current frame (kth frame) and B(p,q,k) is the background.
    After converting the difference image to a binary image, the changes that have
    occurred will be highlighted in white against a solid black background. An example
    of this can be seen in Figure 13.2.'
