    # 13.3.1 Artifacts


    Artifacts often appear in the basic difference images described earlier as dots
    or groups of dots (bloblike noise). This is due to unwanted changes and movements
    in the images and acquisition, such as:


    +   - Sudden changes in camera positions due to a gust of air or other vibratory
    motion

    +   - Small background changes due to shadows or lighting fluctuations

    +   - Changes in the foreground not due to the target''s movement, including multiple
    moving objects


    Artifacts might be interpreted as moving objects that do not belong to the background
    environment, even though they should be considered part of a reference environment.
    These problems occur when using only one static reference frame because the reference
    frame is never updated to include such changes to the background. The best way
    to avoid this would be to update the reference image over time using adaptive
    methods, but that is'
  merge: -1
