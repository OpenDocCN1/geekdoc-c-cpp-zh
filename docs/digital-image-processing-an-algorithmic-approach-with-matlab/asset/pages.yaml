    # 10.6 THINNING


    Thinning is a morphological operation that is used to remove selected foreground
    pixels from binary images, somewhat like erosion or opening. It can be used for
    several applications, but that is particularly useful for skeletonization. In
    this mode, it is commonly used to tidy up the output of edge detectors by reducing
