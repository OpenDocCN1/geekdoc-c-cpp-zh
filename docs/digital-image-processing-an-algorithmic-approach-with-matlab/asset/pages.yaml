  md: 'dark spots in images will disappear as they are “filled in” to the surrounding
    intensity value. Small, bright spots will become larger spots. The effect is most
    marked at places in the image where the intensity changes rapidly, and regions
    of fairly uniform intensity will be largely unchanged except at their edges.


    # 10.3 EROSION


    Erosion is the opposite of dilation. The basic effect of the operator on a binary
    image is to erode away the boundaries of regions of foreground pixels (i.e., white
    pixels, typically). Thus, areas of foreground pixels shrink in size, and holes
    within those areas become larger. The effect of this operation is to remove any
    foreground pixel that is not completely surrounded by other white pixels (assuming
    8-connectedness). Such pixels must lie at the edges of white regions, and so the
    practical upshot is that foreground regions shrink (and holes inside a region
    grow). The strel for the erosion operation is also a 3 x 3 matrix of 1s, but the
    action taken is the reverse of the one for dilation. The effect of application
    of the erosion operator is shown in Figure 10.3.


    # 10.4 OPENING


    The basic effect of an opening is somewhat similar to erosion in that it tends
    to remove some of the foreground (bright) pixels from the edges of regions of
    foreground pixels. However, in general, it is less destructive than erosion. An
    opening is simply defined as an erosion followed by a dilation using the same
    strel for both operations. The opening operator therefore requires two inputs:
    an image to be opened and a strel.


    Although erosion can be used to eliminate small clumps of undesirable foreground
    pixels, for example, speckle noise, quite effectively, it has the big disadvantage
    that it will affect all regions of foreground pixels indiscriminately. Opening
    gets around this by performing both an erosion and a dilation on the image. The
    effect of opening can be quite easily visualized. Imagine taking the strel and
    sliding it around inside each foreground region, without changing its orientation.
    All pixels that can be covered by the structuring element with the structuring
    element being entirely within the foreground region will be preserved. However,
    all foreground pixels that cannot be reached by the strel without parts of it
    moving out of the foreground region will be eroded away. After the opening operation
    has been carried out, the new boundaries of foreground regions will all be such
    that the strel fits inside them, and so further'
