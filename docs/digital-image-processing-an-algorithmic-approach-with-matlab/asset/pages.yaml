    # 2.7 SUMMARY OF IMAGE TYPES AND NUMERIC CLASSES


    In this chapter, the following important points have been covered:


    +   - Image processing begins with image acquisition, which can be done from a
    number of sources such as cameras, ultrasonic images, MRI, and radiographs. The
    image quality and characteristics depend on the imaging system and its application.

    +   - IMAQ toolbox provides very easy procedures to acquire images or video streams
    from the connected hardware.

    +   - Images in MATLAB can be one of the following types: RGB, index, grayscale,
    binary, etc.'
