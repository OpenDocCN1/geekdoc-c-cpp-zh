    # 5.4 HOUGH TRANSFORM


    The conventional Hough transform can be commonly used for the detection of regular
    curves such as lines, circles, ellipses, etc. Despite its domain restrictions,
    the conventional Hough transform has many applications. Its main advantage is
    that it is tolerant of gaps in feature boundary descriptions and is relatively
    unaffected by image noise. The fundamental idea of the Hough transform is based
    on the polar coordinate representation of the line. If a line exists in the image,
    it will be in accordance with a polar equation given by


    ```

    \(\rho = m \cos \theta + n \sin \theta, \quad (5.8)\)

    ```


    where \(\rho\) is the length of a normal vector from the origin to this line and
    \(\theta\) is the orientation of \(\rho\) with respect to the x-axis. For any
    point \((m,n)\) on this line, \(r\) and \(\theta\) are constant. Hence, for every
    \((m,n)\) coordinate pair on the line, there exists a value of \(\theta\) and
    \(\rho\) that is an entirely different manifestation of the image. Many people
    when encountering the Hough transform think that it is a fancy edge detector,
    but it goes beyond that by providing the connectivity information of the lines
    as well. For instance, in the case of a rectangular shape, there are four lines
    in which case the lines of one pair start at the common point and then meet the
    corresponding lines'
