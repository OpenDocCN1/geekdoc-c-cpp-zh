    ![](img/fc093ca9cc8a631842aa559a749dca54_220_1.png)


    FIGURE 11.2 Watermarking and recovery: (a) Watermarking process, (b) its inverse
    process.


    Figure 11.3 shows the results of application of a simple binary watermark to an
    RGB image and its recovery. Note the modifications made to the RGB image by the
    watermark, which are prominent on the top side of the watermarked image, as well
    as the absolute difference calculated in Figure 11.3(d).


    # 11.4 PROBLEMS ASSOCIATED WITH WATERMARKING


    The idea of watermarking seems to be very nice and robust at first glance; however,
    it runs into a set of constraints and implementation issues that limit the robustness
    of the technique. The difficulty of inserting a robust watermark is that it may
    be possible for an unauthorized user to remove the watermark through ignorance
    or, more likely, by intention. Suppose we take an image, Figure 11.4, and embed
    a watermark in it. A watermark must modify the information contained in the original
    image, so we know that pixels within the image must be changed. This change is
    the watermark itself and identifies the owner. If the watermark is visible, then
    it can be removed by filtering so that there are no noticeable distortions. This
    imposes the requirement that a robust watermark should be invisible. Figure 11.4
    shows the effect of adding Gaussian noise to the system, which causes pixel information
    to be modified, but recovery is still possible because the information was not
    distorted to a great extent.'
  merge: -1
  img_proc: true
