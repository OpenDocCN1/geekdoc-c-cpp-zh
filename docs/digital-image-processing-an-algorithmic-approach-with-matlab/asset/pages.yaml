  md: '# Introduction to Image Processing and the MATLAB® Environment


    # 1.1 INTRODUCTION


    THIS CHAPTER BRIEFLY INTRODUCES the scope of image processing. Modern digital
    technology has made it possible to manipulate multi-dimensional signals with systems
    that range from simple digital circuits to advanced parallel computers. The goal
    of this manipulation can be divided into three main categories and several subcategories:


    +   - Image processing

    +   - Image input and output

    +   - Image adjustments (brightness, contrast, colors, etc.)

    +   - Image enhancement

    +   - Image filtering

    +   - Image transformations

    +   - Image compression

    +   - Watermarking and encryption'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - Image analysis

    +       - Image statistics

    +       - Binary operations

    +       - Region of interest operations

    +   - Image understanding

    +       - Image classification

    +       - Image registration

    +       - Image clustering

    +       - Target identification and tracking


    We will focus on the fundamental concepts of the main categories to the extent
    needed by most engineering curricula requirements. Occasionally, advanced topics
    as well as open areas of research will be pointed out. Further, we will restrict
    ourselves to two-dimensional (2D) image processing, although most of the concepts
    and techniques that are to be described can be extended easily to three or more
    dimensions.


    # 1.1.1 What Is an Image?


    A digital image is a 2D signal in essence, and is the digital version of the 2D
    manifestation of the real-world 3D scene. Although the words picture and image
    are quite synonymous, we will make the useful distinction that “picture” is the
    analog version of “image.” An image is a function of two real variables, for example,
    a(x,y) with a as the amplitude (e.g., brightness) of the image at the real coordinate
    position (x,y). An image may be considered to contain subimages, which are sometimes
    referred to as regions or regions of interest (ROIs). The amplitudes of a given
    image will almost always be either real numbers or integers. The latter is usually
    the result of a quantization process that converts a continuous range (say, between
    0 and 100%) to a discrete number of levels.


    # 1.2 DIGITAL IMAGE DEFINITIONS: THEORETICAL ACCOUNT


    A digital image a[m,n] described in a 2D discrete space is derived from an analog
    image a(x,y) in a 2D continuous space through a sampling process that is frequently
    referred to as digitization. Each sample of the image is'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'called a pixel (derived somewhere down the line from picture element). The
    manner in which sampling has been performed can affect the size and details present
    in the image. Some of these effects of digitization are shown in Figure 1.1.


    The 2-D continuous image a(x,y) is divided into N rows and M columns. The intersection
    of a row and a column is termed a pixel. The value assigned to the integer coordinates
    [m,n] with {m= 0, 1, 2, ..., M-1} and {n= 0, 1, 2, ..., N-1} is a[m,n]. In fact,
    in most cases a(x,y), which we might consider to be the physical signal that impinges
    on the face of a 2-D sensor, is actually a function of many variables, including
    depth (z), color (λ), and time (t).


    Images can be of various sizes; however, there are standard values for the various
    parameters encountered in digital image processing. These values occur due to
    the hardware constraints caused by the imaging source and/or by certain standards
    of imaging protocols being used. For instance, some typical dimensions of images
    are 256 × 256, 640 × 480, etc. Similarly, the grayscale values of each pixel,
    G, are also subjected to the constraints imposed by quantizing hardware that converts
    the analog picture value into its digital equivalent. Again, there can be several
    possibilities for the range of these values, but frequently we see that it depends
    on the number of bits being used to represent each value. For several algorithmic
    reasons, the number of bits is constrained to be a power of 2, that is, G = 2^B,
    where B is the number of bits in the binary representation of the brightness levels.
    When B > 1, we speak of a gray-level image; when B = 1, we speak of a binary image.
    In a binary image, there are just two gray levels, which can be referred to, for
    example, as “black” and “white” or “0” and “1.” This notion is further facilitated
    by digital circuits that handle these values or by the use of certain algorithms
    such as the (fast) Fourier transform.


    In Figure 1.1, images in (b), (c), and (e) have the same size as the original.
    The only difference is that the number of pixels being skipped (and replaced with
    zeros) is different: 10-, 2-, and 5- pixel spacing, respectively. Obviously, the
    larger the spacing, the more information is lost, and combining the actual sampled
    points will result in a smaller image, as shown in the images in (d) and (f).
    One more observation on pixel loss can be made through the images in (d) and (f),
    where the original image is much more distorted for larger sampling spacing. The
    effects shown in Figure 1.1 can also be defined in technical terms: spatial resolution,
    which describes the level of detail an image holds within its physical dimensions.
    Essentially, this means the number of detail elements (or pixels) present in the
    rows'
