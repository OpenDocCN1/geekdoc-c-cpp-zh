- pgno: 252
  md: '# # Image-Based Object Tracking


    # ## 13.1 INTRODUCTION


    Automated segmentation and tracking are two fundamental and, at the same time,
    highly challenging tasks in image analysis. Application areas are numerous: medical
    and biomedical image processing, industrial image analysis, earth sciences, geographical
    information services, forestry services, to name a few. Today''s satellite-based
    military applications also make use of these techniques for surveillance and knowing
    the whereabouts of a particular target. Several image segmentation and tracking
    methods have been proposed, and these have evolved greatly over the past few decades
    for several applications. Given an application, for a beginner, choosing appropriate
    segmentation or tracking methods from among several dozens of the available techniques
    could be a truly overwhelming task.


    # ## 13.2 METHODOLOGIES


    To be able to track moving objects in a video sequence, two processing steps are
    needed:


    +   1. Localization of the target

    +   2. Estimation of the change in position of the target'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Essentially, the problem is then to trace the object''s movements throughout
    the sequence. This has been done in a number of ways by various researchers employing
    different methods. This chapter focuses on some of the basic techniques that can
    be utilized, and upon which more complicated algorithms and techniques can be
    built.


    Looking at the tracking problem from an image processing perspective, there are
    certain issues that any technique must resolve in order to perform the desired
    functionality. These primarily include the following:


    +   1. Background variations

    +   2. Noise

    +   3. Changing shape or color of the target

    +   4. Multiple objects of the same shape or color


    In this chapter, four methods are outlined for a simple experimental sequence
    of images. The sequence comprises one to three different-colored balloons being
    flown (with hand blows only) within viewfinder range of a fixed digital camcorder.
    The balloons appear in the video sequence with variable sizes owing to perspective
    motion. A major problem is shadows appearing in the scene because of a light source
    above the viewing area. The techniques presented here were capable of detecting
    the targeted balloon quite successfully for most of the frames in the sequence.
    Some of the sample frames are shown in the respective figures, as well as being
    presented in the MATLAB® code. The methods employed suffered severely in their
    precision due to shadows as well as background shading variations (which introduced
    the bloblike noise in the images). The main conclusion drawn from the findings
    is that a particular simple technique may work within a certain limited scenario
    only. For an advanced application, a combination of various techniques, or even
    superior techniques, must be used.


    The four techniques presented here are


    +   1. Background subtraction

    +   2. Temporal frames differences

    +   3. Cross-correlation method

    +   4. Color-based segmented tracking'
  merge: -1
