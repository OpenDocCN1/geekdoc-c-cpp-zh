    # 15.2.3. Fuzzy Denoising


    A gray-tone image taken of a real scene will contain inherent ambiguities due
    to light dispersion on the physical surfaces. The neighboring pixels may have
    very different intensity values and yet represent the same surface region. In
    this book, a fuzzy set theoretic approach to representing, processing, and quantitatively
    evaluating the ambiguity in gray-tone images is presented. The gray-tone digital
    image is mapped into a two-dimensional array of singletons called a fuzzy image.
    The value of each fuzzy singleton reflects the degree to which the intensity of
    the corresponding pixel'
  merge: -1
  img_proc: true
- pgno: 293
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_293_0.png)


    FIGURE 15.5 Example of fuzzy denoising. (a) Original RGB Image, (b) grayscale
    version of (a), (c) noisy image in 0 mean unit variance Gaussian noise, (d) filtered
    image.


    is similar to the neighboring pixel intensities. The inherent ambiguity in the
    surface information can be modified by performing a variety of fuzzy mathematical
    operations on the singletons. Once the fuzzy image processing operations are complete,
    the modified fuzzy image can be converted back to a gray-tone image representation.
    The ambiguity associated with the processed fuzzy image is quantitatively evaluated
    by measuring the uncertainty present both before and after processing.


    In previous chapters, certain types of image filters designed to remove noise
    were presented. Figure 15.5 shows the application of a fuzzy inference system
    (ANFIS) to remove noise from a supervised image. The implication is that a less
    noisy version of this image is used as a training set to fine-tune the membership
    functions to allocate new pixel values based on knowledge of the crude version
    of the image. This approach actually extracted a noise-free image from a highly
    noisy image.'
  merge: -1
