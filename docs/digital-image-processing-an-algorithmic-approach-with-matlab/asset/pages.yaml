    # 12.4 NEAREST NEIGHBOR CLASSIFIER


    A convenient way of building a parametric description of the kind mentioned in
    the previous section is by using a feature vector \([\theta_1, \theta_2, \cdots,
    \theta_n]\), where \(n\) is the number of attributes that describe each image
    feature and training class. This representation allows us to consider each image
    feature as occupying a point, and each training class as occupying a subspace
    (i.e., a representative point surrounded by some spread, or deviation) within
    the \(n\)-dimensional classification'
  merge: -1
