- pgno: 162
  md: '# # Image Compression


    # ## 8.1 INTRODUCTION


    EACH PIXEL IN AN IMAGE is represented by a certain number of bits (as supported
    by the system). It is interesting to calculate how much memory is needed to store
    such an image. For example, consider the image sjb.bmp, which is an RGB image
    of dimensions 340 x 470 and requires 468K bytes for its representation and storage
    in this form. This number is obtained through the calculation (340 x 470 x 3)/1024.
    Since most Windows systems consider the byte to be 8 bits long, each RGB triad
    requires 3 bytes for its representation. As such, the storage requirements for
    RGB images are three times those for grayscale images. However, the foregoing
    image requires only 12K bytes when it is stored as a JPEG image! This is the domain
    of image compression, in which the intent is to design algorithmic techniques
    that can reduce the storage requirements of the image and, at the same time, retain
    the image information content. There are several aspects of image properties that
    can be exploited in the process of compression. Distinctively, the interpixel
    information variation is only significant at edges of any type, whereas most of
    the image information content remains a slowly changing variable. Similarly, the
    fact that our eyes are less sensitive to color changes and are much more sensitive
    to intensity variations indicates that color space can be compromised more than
    grayscale intensity space. Representation of color space differently can also
    help in reducing the image size for storage. It should be noted that compression
    is realized only when the image is stored on the disk. Once it is loaded in memory,
    the image occupies all the required RAM locations according to the size and color
    requirements for the original BMP-type structure.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "Compressing an image is significantly different from compressing raw binary\
    \ data. Of course, general-purpose compression programs can be used to compress\
    \ images, but the result is less than optimal. This is because images have certain\
    \ statistical properties that can be exploited by encoders specifically designed\
    \ for them. Also, some of the finer details in the image can be sacrificed for\
    \ the sake of saving a little more bandwidth or storage space. This also means\
    \ that lossy compression techniques can be used in this area. Lossless compression\
    \ deals with compressing data in such a way that an exact replica of the original\
    \ data is obtained upon decompression. This is the case when binary data such\
    \ as executables, documents, etc., are compressed. They need to be reproduced\
    \ exactly when decompressed. On the other hand, images need not be reproduced\
    \ exactly. An approximation of the original image is enough for most purposes,\
    \ as long as the error between the original and the compressed image is tolerable.\n\
    \nIn this chapter, we will take a close look at compressing grayscale images.\
    \ The algorithms explained can be easily extended to color images, either by processing\
    \ each of the color planes separately, or by transforming the image from RGB representation\
    \ to other convenient representations such as YUV or YC_Cr, in which processing\
    \ is much easier.\n\n# 8.2 IMAGE COMPRESSION–DECOMPRESSION STEPS\n\nThe usual\
    \ steps involved in compressing an image are\n\n+   1. **Specification**: This\
    \ implies specifying the rate (bits available) and distortion (tolerable error)\
    \ parameters for the target image.\n+   \n+   2. **Classification**: This implies\
    \ dividing the image data into various classes, based on their importance. Usually,\
    \ some type of compression transform is utilized in this step to associate the\
    \ important features with the most important class of information to be kept in\
    \ the process of compression.\n+   \n+   3. **Bit allocation**: This implies dividing\
    \ the available bit budget among these classes such that the distortion is a minimum.\n\
    +   \n+   4. **Quantization**: This refers to quantizing each class separately\
    \ using the bit allocation information derived in step 3.\n+   \n+   5. **Encoding**:\
    \ This corresponds to encoding each class separately using an entropy coder and\
    \ write to the file."
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Most of the image compression techniques work on these steps. However, there
    are exceptions, as well those that are designed for specific applications. One
    example is the fractal image compression technique, where possible self-similarity
    within the image is identified and used to reduce the amount of data required
    to reproduce the image. Traditionally, these methods have been time consuming,
    but some latest methods promise to speed up the process.


    Decompressing or reconstructing the image from the compressed data is usually
    a faster process than compression. The steps involved are


    +   1. **Decoding:** Read in the quantized data from the file, using an entropy
    decoder (reverse of step 5).


    +   2. **Dequantizing:** This refers to normalizing the quantized values (reverse
    of steps 4 and 3). This also includes any padding or addition of missing values
    due to the quantization process.


    +   3. **Rebuilding:** This involves the inverse transform or inverse classification
    of the normalized data into image pixels, essentially rebuilding the image (reverse
    of step 2).


    # 8.2.1 Error Metrics


    The fundamental question of how compression techniques can be compared is quantitatively
    answered by using two error metrics: the mean square error (MSE) and the peak
    signal-to-noise ratio (PSNR). The MSE is the cumulative squared error between
    the compressed and the original image, whereas the PSNR is a measure of the peak
    error. The mathematical formulae for the two are


    ```

    MSE = \frac{1}{M \times N} \sum_{m=1}^{M} \sum_{n=1}^{N} [f(m,n) - g(m,n)]^2,
    \quad (8.1)

    ```


    ```

    PSNR = 20 \times \log_{10} \left( \frac{255}{\sqrt{MSE}} \right), \quad (8.2)

    ```


    where $f(m,n)$ is the original image, $g(m,n)$ is the approximated version (which
    is actually the decompressed image), and $M,N$ are the dimensions of the images.
    A lower value for MSE means less error, and as is seen from the inverse relation
    between the MSE and PSNR, this translates to a high'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'value of PSNR. Logically, a higher value of PSNR is good because it means that
    the ratio of signal to noise is higher. Here, the signal is the original image,
    and the noise is the error in reconstruction.


    # 8.3 CLASSIFYING IMAGE DATA


    In this step, usually the image is represented as a two-dimensional array of coefficients,
    where each coefficient represents the brightness level at that point. From a high-level
    perspective, one cannot differentiate between coefficients as more important ones
    and lesser important ones. But it is intuitively possible to do so. Most natural
    images have smooth color variations, with the fine details being represented as
    sharp edges between the smooth variations. Technically, the smooth variations
    in color can be termed low-frequency variations and the sharp variations, high-frequency
    variations.


    The low-frequency components (smooth variations) constitute the base of an image,
    and the high-frequency components (the edges that give the detail) add upon them
    to refine the image, thereby giving a detailed image. Hence, the smooth variations
    require more importance than the details.


    Separating the smooth variations and details of the image can be done in many
    ways. Two well-known image transforms used for this purpose are the discrete cosine
    transform (DCT) and the discrete wavelet transform (DWT). The DCT is discussed
    in the next section, and the DWT was discussed in Chapter 5.


    # 8.3.1 Discrete Cosine Transform


    Another sinusoidal transform (i.e., transform with sinusoidal base functions)
    related to the DFT is the DCT. For an N × N image, the DCT is given by


    ```

    F(p,q) = \frac{1}{4} \Psi(p) \Psi(q) \sum_{m=0}^{N-1} \sum_{n=0}^{N-1} f(m,n)
    \cos\left(\frac{(2m+1)p\pi}{2N}\right) \cos\left(\frac{(2n+1)q\pi}{2N}\right)

    (8.3)

    ```


    where f(m,n) is the original image in the spatial domain with indices m and n,
    F(p,q) is the transformed image with indices p and q, and the transformation coefficient
    multipliers are given by Ψ and ξ, which are defined as


    ```

    \Psi(p) = \begin{cases} \frac{1}{\sqrt{2}} & \text{for } p=0 \\ 1 & \text{otherwise}
    \end{cases}

    (8.4)

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: "\\(\\xi(q) = \\begin{cases} \\frac{1}{\\sqrt{2}} & \\text{for } q=0 \\\\ 1\
    \ & \\text{otherwise} \\end{cases} \\quad (8.5)\\)\n\nThe main advantages of the\
    \ DCT are that it yields a real-valued output image and that it is a fast transform.\
    \ After performing a DCT, it is possible to throw away the coefficients that encode\
    \ those frequency components that the human eye is not very sensitive to. Thus,\
    \ the amount of data can be reduced, without seriously affecting the way an image\
    \ looks to the human eye. The inverse transform for Equation 8.3 is given by\n\
    \n\\(f(m,n) = \\frac{1}{4} \\sum_{p=0}^{N-1} \\sum_{q=0}^{N-1} \\psi(p)\\xi(q)\
    \ F(p,q) \\cos\\left(\\frac{(2m+1)p\\pi}{2N}\\right) \\cos\\left(\\frac{(2n+1)q\\\
    pi}{2N}\\right). \\quad (8.6)\\)\n\nThe definition of the coefficient multipliers\
    \ remains the same as in Equations 8.4 and 8.5. Figure 8.1 shows the application\
    \ of DCT and inverse DCT to the cameraman image.\n\n# 8.4 BIT ALLOCATION\n\nThe\
    \ first step in compressing an image is to segregate the image data into different\
    \ classes. Depending on the importance of the data it contains, each class is\
    \ allocated a portion of the total bit budget such that the compressed image has\
    \ the minimum possible distortion. This procedure is called bit allocation.\n\n\
    The rate-distortion theory is often used for solving the problem of allocating\
    \ bits to a set of classes, or for bit-rate control in general. The theory aims\
    \ at reducing the distortion for a given target bit rate by optimally allocating\
    \ bits to the various classes of data. One approach to solving the problem of\
    \ optimal bit allocation is through using the rate-distortion theory explained\
    \ as follows:\n\n+   1. Initially, all classes are allocated a predefined maximum\
    \ number of bits.\n+   \n+   2. For each class, one bit is reduced from its quota\
    \ of allocated bits, and the distortion due to the reduction of that one bit is\
    \ calculated."
