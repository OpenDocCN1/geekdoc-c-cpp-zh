    # 9.8 THE UNSHARP FILTER


    The unsharp filter is a simple sharpening operator that derives its name from
    the fact that it enhances edges (and other high-frequency components in an image)
    via a procedure that subtracts an unsharp, or smoothed, version of an image from
    the original image. The unsharp filtering technique is commonly used in the photographic
    and printing industries for crisping edges.'
