    # 8.6 ENTROPY CODING


    After the data has been quantized into a finite set of values, it can be encoded
    using an entropy coder to give additional compression. By entropy, we mean the
    amount of information present in the data, and an entropy coder encodes the given
    set of symbols with the minimum number of bits required to represent them. Two
    of the most popular entropy coding schemes are Huffman coding and arithmetic coding.
    These techniques allocate variable-length codes for specific symbols (coefficient
    values in our case) in a set of values to be encoded. This saves even more space
    in terms of storage, thus adding to the compression.


    # 8.7 JPEG COMPRESSION


    Technically speaking, JPEG is not a file format at all; it is a compression method
    that is used in file formats such as TIFF and BMP, and the filename extension
    is .jpg or .jpeg. JPEG (pronounced “jay-peg”) gets its name from the committee
    that designed it, the Joint Photographic Experts Group. The key phrase here is
    photographic experts; this group was formed especially to design a better means
    of storing photographic and other photorealistic images. True color (24-bit color)
    was almost a given, so they concentrated on coming up with a good compression
    methodology. JPEG uses 24-bit'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'color for RGB images. You can also save standard grayscale images (8 bits per
    pixel), extended grayscale images (12 bits per pixel), and CMYK images for four-color
    printers (32-bit color). The advantage of JPEG over GIF and most other methods
    is this: It provides true color while compressing image files more than the lossless
    compression methods. The disadvantage is, of course, that it must use a lossy
    compression method to do that, so some image data is lost, but not as much as
    when you reduce a photorealistic image to 256 colors.


    # 8.7.1 JPEG''s Algorithm


    The JPEG method is based on the fact that humans are much more aware of small
    changes in brightness (luminance) than to small changes in color or large changes
    in color or brightness. So most JPEG generators start by converting the color
    data from RGB to a system that identifies the brightness of each pixel. One such
    system is known as HSL (Hue-Saturation-Luminance). A few other systems can also
    be used with JPEG such as HSV (Hue-Saturation-Value) and YC₁C₂, where Y is the
    luminance scale and C₁ and C₂ are color scales. Once the conversion is made, the
    first data reduction takes place in a process called subsampling. The brightness
    scale is left alone, while half of the other two scales are eliminated by replacing
    two neighboring pixels with a single value representing their average. This reduces
    the entire image to two-thirds of its original size with no noticeable loss in
    quality, because the most important information—the brightness of each pixel—is
    still intact.


    Some programs average the color scales both vertically and horizontally, thus
    eliminating three-fourths of the values and reducing the entire image to one-half
    its original size.


    The next steps work on 8-by-8 blocks in the image. In a series of DCT and quantization
    steps, the changes in brightness and color within each block are identified and
    rounded off. The amount of rounding increases with the size of the change, thus
    giving more weight to the smaller changes. For example, a change of 3 might be
    rounded up to 5, whereas a change of 75 might be rounded up to 100.


    The result of the previous steps is to produce a set of values that still describes
    the image data, although not as accurately as before, and that contains many identical
    values because of the rounding process. All those identical values can now be
    greatly compressed via a standard, legally unencumbered lossless compression technique.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Because JPEG trades accuracy for compression, the more the file is compressed,
    the more quality is lost. Three factors affect the quality of the JPEG image:


    +   - The amount of data removed during subsampling (one-third or one-half of
    the file).

    +   - How aggressively the data is rounded during quantization.

    +   - The accuracy of the JPEG viewer in reversing the compression process while
    expanding the image for display. There are a lot of calculations involved, and
    some viewers trade accuracy for speed.


