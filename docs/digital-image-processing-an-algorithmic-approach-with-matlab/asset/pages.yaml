- pgno: 327
  md: 'Eschewing heavy mathematics and lengthy programming details, Digital Image
    Processing: An Algorithmic Approach with MATLAB® presents an easy methodology
    for learning the fundamentals of image processing. The book applies the algorithms
    using MATLAB®, without bogging down readers with syntactic and debugging issues.


    Each chapter is divided into three sections. The first section presents theoretical
    topics in a very simple and basic style with generic language and mathematics.
    The second section explains the theoretical concepts using flowcharts to streamline
    the concepts and to form a foundation for readers to code in any programming language.
    The final section supplies MATLAB codes for reproducing the figures presented
    in the chapter.


    # Features


    +   - Contains easy explanations of theoretical concepts, avoiding heavy mathematics
    wherever possible

    +   - Provides MATLAB codes that allow readers to generate the same images found
    in the book

    +   - Covers both standard and advanced topics, such as face recognition and soft
    computing

    +   - Presents algorithms as simple flowcharts that can be coded in any programming
    environment

    +   - Includes algorithmic accounts of the techniques

    +   - Describes practical examples and potential applications

    +   - Offers ancillary resources on the book’s Web site


    This text equips readers with an essential understanding of digital image processing.
    It will also help them comprehend more advanced topics and sophisticated mathematical
    material.'
  merge: -1
  img_proc: true
