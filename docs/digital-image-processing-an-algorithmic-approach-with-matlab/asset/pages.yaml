    +   - The wavelet transform''s function is similar to that of the Fourier transform,
    but it changes the view window from a large window to a smaller one; this is called
    scaling.

    +   - The scaling decomposition helps to better isolate frequency components compared
    to the Fourier transform.

    +   - Unlike simple sine/cosine basis functions of the Fourier transform, the
    wavelet transforms use specialized basis functions called mother wavelets.

    +   - There are a number of these mother wavelets in use for various applications.

    +   - Wavelet transforms are primarily used for noise removal and compression
    applications.

    +   - The Hough transform is a classical technique, and is computationally expensive.

    +   - It can provide information related to the connectivity of edges, which can
    be used for shape identification.


