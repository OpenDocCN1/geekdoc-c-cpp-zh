- pgno: 143
  md: '# 6.6 SUMMARY


    +   - Filtering is the operation of removing certain frequency components from
    an image.

    +   - Image filters can work directly in the spatial domain as well as in the
    frequency domain.

    +   - In the spatial domain, the filter can be thought of as a small M × N matrix,
    called kernel or mask, that is convolved with the source image.

    +   - In such a convolution operation, a small neighborhood in the image (proportional
    to the kernel) is operated on, and a new pixel value is obtained as the corresponding
    center pixel of the neighborhood.

    +   - For the case of boundaries, additional rows and columns are added that are
    either replicas of the outer rows and columns or just zeros (zero padding).

    +   - The spatial filters can also be based on checking certain constraints within
    the neighborhood, so that outlier values can be smoothed out. Conservative and
    median filtering are two such filters.

    +   - The images can also be processed in the frequency domain. Here, a specific
    mask is needed to remove or allow certain areas of the frequency spectrum.

    +   - Noise is usually the higher frequency aspect of the image and can be removed
    by the low-pass filter mask, which is usually some type of circular and zero-centered
    mask.

    +   - However, removing the noise frequencies also removes with them some useful
    high-frequency components such as edges in the image, thus producing a blurred
    image.

    +   - Careful selection of the mask and its application can achieve a compromise
    solution in which noise removal and edge conservation are optimized.


