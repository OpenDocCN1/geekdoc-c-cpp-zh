  md: '+   - "sym": Symlets

    +   - "coif": Coiflets

    +   - "bior": Biorthogonal wavelets

    +   - "rbio": Reverse biorthogonal wavelets

    +   - "meyr": Meyer wavelet

    +   - "dmeyr": Discrete Meyer wavelet

    +   - "gaus": Gaussian wavelets

    +   - "mexh": Mexican hat wavelet

    +   - "morl": Morlet wavelet

