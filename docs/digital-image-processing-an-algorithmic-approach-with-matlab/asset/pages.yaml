    # 13.5 CORRELATION-BASED TRACKING


    This method is primarily a shape-based technique and can work equally well with
    both RGB as well as grayscale images. Cross-correlation is a standard method of
    estimating the degree to which two images are correlated. Consider two images
    x(m,n) and y(m,n), where n = 0, 1, 2, ..., N-1. The cross-correlation r at delay
    δ is defined as


    ```

    \rho_{xy}(m,n,p,q) = E[x(m,n)y(m+p,n+q)] = \sum_{p=0}^{M} \sum_{q=0}^{N} x(m,n)y(m+p,n+q).

    (13.3)

    ```'
