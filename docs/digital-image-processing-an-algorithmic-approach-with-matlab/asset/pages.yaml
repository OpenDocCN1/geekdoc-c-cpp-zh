  md: '+   - The third approach is only related to the shape of the object to be tracked
    and deals with correlation of the target image. Here, the target''s subimage is
    correlated with the new frame''s image, and it gives a high correlation value
    when the object is matched anywhere in the image.

    +   - This method is usually used with shape-based target tracking irrespective
    of the grayscale values or colors.

    +   - The fourth method is based on detecting a specific color to be classified.

    +   - The classification is repeated in each frame and, hence, the same colored
    object is tracked.

    +   - A lot of postprocessing is usually needed to precisely isolate the targets
    from the clutter of artifacts resulting from the difference or correlation operations.

    +   - The postprocessing usually includes median filtering and morphological operations.


