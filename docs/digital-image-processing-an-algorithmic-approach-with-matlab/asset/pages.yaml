- pgno: 257
  md: 'beyond the scope of this book. Thus, to reduce the impact of these artifacts,
    we need to subtract more than once between the frames. These subtractions must
    also be made in different ways so that we can accommodate the different kinds
    of artifacts presented earlier.


    # 13.4 TEMPORAL DIFFERENCE BETWEEN FRAMES


    The temporal difference between frames calculates the difference between subsequent
    frames. This is because if an object belonging to the background has been moved,
    it will be visible in every background difference image at the same position until
    it moves again. However, if we take the difference between, let us say, the current
    frame and the preceding one, where the moved chair first appears in its new position,
    the result will be zero. Therefore, temporal differences are not very sensitive
    to background changes, but they can often pose problems when detecting inner parts
    of moving objects. Therefore, the object can appear to be hollow in the temporal
    difference image. The temporal difference between frames is calculated by taking
    the difference of a neighborhood of M × M pixels and then the absolute value of
    the result:


    ```

    \( G_z(m,n,k) = \frac{1}{M^2} \left| \sum_{p=1}^{M-1} \sum_{q=1}^{M-1} F(p,q,k)
    - B(p,q,k-1) \right| \) (13.2)

    ```


    The image \( G_z \) is calculated for both the current frame together with the
    previous frame as well as the next frame together with the current frame. Figure
    13.3 shows the application of the temporal difference methodology to the selected
    image sequence. Some postprocessing has been employed in this case, which removes
    the spurious noise with median filtering and enhances the connected pixels with
    a combination of dilation and erosion operations.


    Although the target has been missed in frame 3 owing to postprocessing, the localization
    in the adjacent frames is sufficient information for the machine vision system
    to follow the target.


    # 13.4.1 Gradient Difference


    There are always small changes in illumination and small movements between the
    frames. These changes affect the subtractions and cause artifacts, even though
    they are hard for the human eye to see. The gradient of an image, on the other
    hand, is not so sensitive to time-varying illumination changes. Performing a gradient
    difference on our image sequences'
