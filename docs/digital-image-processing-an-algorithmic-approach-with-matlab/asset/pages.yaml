- pgno: 160
  md: '+   If the blurring function is partially known, the problem is called a gray
    box problem.


    +   If the blurring function is completely unknown, the problem is called a black
    box problem.


    +   The usual methods of deconvolution rely on the availability of the information
    related to the blurring function.


    +   These methods usually rely on the application of the inverse of the Fourier
    transform of the blurring function to the Fourier transform of the blurred image.


    +   Blind deconvolution is performed when there is a black box problem in hand.


    +   Here, usually an initial estimate of the true image as well as the blurring
    function are picked up randomly and iteratively evolved to the blurred image,
    which then gives a better estimate of the blurring function.


    +   After this, the usual frequency domain deconvolution can be applied to get
    the estimate of the true image.


    +   Deconvolution is not a very simple process, and usually the visual quality
    cannot match the true image. However, a lot of improvement can be obtained.


