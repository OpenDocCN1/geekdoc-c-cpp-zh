    NOT operator. Each pixel in the input binary image having a logical 1 (often referred
    to as foreground) has a logical 0 (associated with the background in the output
    image) and vice versa. Hence, applying logical NOT to a binary image changes its
    polarity. The logical NOT can also be used for a grayscale image, in which case
