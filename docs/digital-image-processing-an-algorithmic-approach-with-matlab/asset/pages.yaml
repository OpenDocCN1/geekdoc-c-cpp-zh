- pgno: 103
  md: '# 4.8 SUMMARY


    +   - Images can be modified using a series of affine transforms.

    +   - These transform are categorized as translation, rotation, and scaling transforms,
    or TRS.

    +   - The translation operation reassigns the coordinate values, essentially moving
    some part of the image to a different place.

    +   - The rotation operation rotates the image or part of the image by a desired
    angle, either clockwise or counterclockwise.

    +   - Integer approximation is performed for the resulting fractional pixels for
    proper image display.

    +   - The scaling operation is used in the zooming in or zooming out operation,
    where image size is changed in such a way that either some pixels are removed
    (zooming out) or new pixels are added (zooming in).

    +   - Pixels can be removed based on some predefined selection procedure or through
    replacement of a neighborhood with an equivalent statistical measure.

    +   - The logical transforms can be used to mask out a particular portion of the
    image to perform a specific operation.

    +   - Logical inversion of the image is equivalent to the photographic negative
    of that image.

    +   - Logical AND, NAND, OR, NOR, XOR, and XNOR operators can perform various
    localized selections or maskings on an image by suitably selected masking images.

    +   - Noise in the image is the addition of random values to the image.

    +   - Although physically there are many types of image noise, the algorithmic
    versions usually rely on Gaussian and salt-and-pepper noise to simulate natural
    phenomena.

    +   - Blurring refers to other distortions in the image such as motion blur, out
    of focus, atmospheric effects, etc.

    +   - Algorithmically speaking, blur is another 2D matrix (usually much smaller
    than the source image) that is then convolved with the image to produce the blurring
    effect.'
  merge: -1
  img_proc: true
