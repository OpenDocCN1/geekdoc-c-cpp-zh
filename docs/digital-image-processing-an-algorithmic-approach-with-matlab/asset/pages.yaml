    # 10.2 DILATION


    The basic effect of the dilation operator on a binary image is to gradually enlarge
    the boundaries of regions of foreground pixels (i.e., white pixels, typically).
    Thus, areas of foreground pixels grow in size while holes within those regions
    become smaller. Assume that X is the set of Euclidean coordinates corresponding
    to the input binary image, and that K is the set of coordinates for the strel;
    let K_x denote the translation of K so that its origin is at x. Then, the dilation
    of X by K is simply the set of all points x such that the intersection of K_x
    with X is nonempty. The strel is a 3 × 3 matrix of all ones for the dilation operation.
    The mathematical definition of grayscale dilation is identical except for the
    way in which the set of coordinates associated with the input image is derived.
    In addition, these coordinates are 3D rather than 2D.


    To compute the dilation of a binary input image by this structuring element, we
    consider each of the background pixels in the input image in turn. For each background
    pixel (which we will call the input pixel), we superimpose the structuring element
    on top of the input image so that the origin of the structuring element coincides
    with the input pixel position. If at least one pixel in the structuring element
    coincides with a foreground pixel in the image underneath, the input pixel is
    set to the foreground value. If all the corresponding pixels in the image are
    background, however, the input pixel is left at the background value.


    Figure 10.2 shows the effect of application of the dilation operation. The image
    in Figure 10.2(a) shows the sample image from Figure 10.1(b) with the dilation
    operator applied thrice, while the image segment shows the effect after a single
    application of the operator. This anomaly was decided upon experimentally because
