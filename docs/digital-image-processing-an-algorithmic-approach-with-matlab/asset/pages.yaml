  md: 'One of the major problems with the median filter is that it is relatively expensive
    and complex to compute. To find the median, it is necessary to sort all the values
    in the neighborhood in numerical order, and this is relatively slow, even with
    fast sorting algorithms such as quicksort.


    # 6.2.4 Gaussian Smoothing


    The Gaussian smoothing operator is a 2D convolution operator that is used to “blur”
    images and remove detail and noise. In this sense, it is similar to the mean filter,
    but it uses a different kernel that represents the shape of a Gaussian (“bell-shaped”)
    hump. The Gaussian distribution in 2D has the form:


    ```

    $$h(m,n) = \frac{1}{2\pi\sigma^2} e^{\frac{\{(m-m_0)^2+(n-n_0)^2\}}{2\sigma^2}}$$

    ```


    This distribution is shown in Figure 6.1(c). The idea of Gaussian smoothing is
    to use this 2D distribution as a point spread function, and this is achieved by
    convolving the kernel with the image under process. Because the image is stored
    as a collection of discrete pixels, we need to produce a discrete approximation
    to the Gaussian function before we can perform the convolution. In theory, the
    Gaussian distribution is nonzero everywhere, which would require an infinitely
    large convolution kernel, but in practice, it is effectively zero more than about
    three standard deviations from the mean, and so we can truncate the kernel at
    this point. Figure 6.1(d) shows a suitable integer-valued convolution kernel that
    approximates a 2D Gaussian with a $\sigma$ of 1.0. Once a suitable kernel has
    been calculated, Gaussian smoothing can be performed using standard convolution
    methods.


    The effect of Gaussian smoothing is to blur an image, in a similar fashion to
    the mean filter. The degree of smoothing is determined by the standard deviation
    of the Gaussian. Figure 6.4 shows an example of the application of Gaussian filtering.


    # 6.2.5 Conservative Smoothing


    This type of smoothing is conservative in terms of not modifying the pixels blindly.
    As such, there are two conditions to be tested before a replacement is made. First,
    a neighborhood is selected around the pixel under study. Typically, an eight-neighbor
    region is selected (i.e., all eight pixels around the underlying pixel). The minimum
    and maximum values'
  merge: -1
  img_proc: true
