- pgno: 274
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_274_0.png)


    # FIGURE 14.1 Various techniques used in face recognition.


    as by concatenating each row or column of the image). Despite this high-dimensional
    embedding, the natural constraints of the physical world (and the imaging process)
    dictate that the data will, in fact, lie in a lower dimensional (though possibly
    disjoint) manifold. The primary goal of the subspace analysis is to identify,
    represent, and parameterize this manifold in accordance with some optimality criteria.


    Let X = {x1, x2, ..., xN} represent an n x N data matrix, where xi is a face vector
    of dimension n, concatenated from a p x q face image, where n = p x q. Here, n
    represents the total number of pixels in the face image, and N is the number of
    different face images in the training set. The mean vector of the training images,
    μ = Σxi, is subtracted from each image vector.


    # 14.3.1 Linear (Subspace) Analysis


    Three classical linear appearance-based classifiers, PCA, ICA, and LDA, are commonly
    used for face recognition, once the image is represented in its vector space.
    Each classifier has its own representation (basis vectors) of a high-dimensional
    face vector space based on different statistical viewpoints. By projecting the
    face vector to the basis vectors, the projection coefficients are used as the
    feature representation of each face image. The matching score between the test
    face image and the training prototype is calculated (e.g., as the cosine value
    of the angle) between their coefficients vectors. The larger the matching score,
    the better the match.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'All three representations can be considered a linear transformation from the
    original image vector to a projection feature vector, that is,


    $$Y = W^T X,$$ (14.1)


    where $Y$ is the $d \times N$ feature vector matrix, $d$ is the dimension of the
    feature vector, and $W$ is the transformation matrix.


    # 14.3.2 Principal Components Analysis


    In this chapter, only the PCA technique is presented for face recognition. The
    PCA technique finds the vectors that best account for the distribution of face
    images within the entire image space. These vectors define the subspace of face
    images, and the subspace is called _face space_. All faces in the training set
    are projected onto the face space to find a set of weights that describes the
    contribution of each vector in the face space. Identifying a test image requires
    the projection of the test image onto the face space to obtain the corresponding
    set of weights. By comparing the weights of the test image with the set of weights
    of the faces in the training set, the face in the test image can be identified.


    The key procedure in PCA is based on the Karhunen–Loève transformation. If the
    image elements are considered to be random variables, the image may be seen as
    a sample of a stochastic process. The PCA basis vectors are defined as the eigenvectors
    of the scatter matrix $S_P$.


    $$S_T = \sum_{i=1}^N (x_i - \mu)(x_i - \mu)^T.$$ (14.2)


    The transformation matrix $W_{PCA}$ is composed of the eigenvectors corresponding
    to the $d$ largest eigenvalues.


    After applying the projection, the input vector (face) in an $n$-dimensional space
    is reduced to a feature vector in a $d$-dimensional subspace. For most applications,
    the eigenvectors corresponding to very small eigen values are considered to be
    noise, and are not taken into account during identification. Several extensions
    of PCA are developed, such as modular eigenspaces and probabilistic subspaces.


