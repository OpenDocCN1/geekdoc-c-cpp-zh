    calculated by first sorting all the pixel values from the surrounding neighborhood
    in numerical order and then replacing the pixel being considered with the middle
    pixel value. (If the neighborhood under consideration contains an even number
    of pixels, the average of the two middle pixel values is used.) Figure 6.1(b)
    illustrates an example of the median filter. It can be seen with a little calculation
