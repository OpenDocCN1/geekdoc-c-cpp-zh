    By calculating the median value of a neighborhood rather than the mean, the median
    filter has two main advantages over the mean filter:


    +   - The median is a more robust average than the mean, and so a single very
    unrepresentative pixel in a neighborhood will not affect the median value significantly.


    +   - Because the median value must actually be the value of one of the pixels
