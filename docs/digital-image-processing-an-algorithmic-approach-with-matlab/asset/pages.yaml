  md: '# 3.6 SUMMARY


    +   - Arithmetic operators can operate on images in much the same way as matrices,
    except for a few considerations (Section 3.1).

    +   - Image arithmetic works in a pixel-by-pixel manner for two images of the
    same size (Section 3.2).

    +   - The other form of image arithmetic is to apply a scalar over the image matrix
    (Section 3.2).

    +   - The fundamental arithmetic operators are addition, subtraction, multiplication,
    and division (Sections 3.3.1–3.3.5).

    +   - For n-tuple images, the operation takes place for each pixel with the corresponding
    pixel in the same size (Section 3.3.3).

    +   - Addition is used to change the intensity of pixels, merging images, adding
    content to an image, etc. (Sections 3.3.1–3.3.5).

    +   - Subtraction can be used for target detection, background removal, interframe
    differentials, and removing artifacts from an image (Sections 3.3.1–3.3.5).

    +   - Multiplication and division can be used for scaling and normalizing applications
    to make the image more visually appealing (Sections 3.3.1–3.3.5).

    +   - A linear combination of images is also possible and is used to merge images
    to produce newer images (Sections 3.3.1–3.3.5).

    +   - Overshoots and undershoots in terms of pixel values are usually dealt with
    through truncation (Section 3.3.3).


    # 3.7 EXERCISES


