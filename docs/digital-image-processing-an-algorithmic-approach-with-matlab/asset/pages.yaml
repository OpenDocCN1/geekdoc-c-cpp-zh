  md: '# 1.4.1 Why MATLAB for Image Processing


    As explained earlier, an image is just a set of values organized in the form of
    a matrix. Because MATLAB is optimal for matrix operations, it makes a lot of sense
    to use MATLAB for image-related operations. For most of the processing needs,
    we will be using MATLAB''s Image Processing Toolbox (images). Other than real-time
    acquisition of images, this toolbox has all the necessary tools to perform various
    geometric, arithmetic, logical, as well as other higher level transformations
    on the images. The toolbox is also capable of handling both color and grayscale
    images. However, most of the image processing is focused on grayscale images.
    Even for the color images, the processing is done on the converted image, which
    is obtained by mapping the RGB color space into grayscale space. These concepts
    will be discussed in detail in Chapter 2.


    Although structural compatibility is a great motivation to use MATLAB for image
    processing, there are several other reasons for doing so. Most researchers in
    the area of image processing use MATLAB as their main platform for software implementation,
    which thus gives a common language to compare different algorithms and designs.
    Also, the speeds of various algorithms may also be compared on a common platform,
    which would be difficult if different people were using different programming
    languages that vary considerably in terms of speed of operations. Another interesting
    reason to use MATLAB, most interesting to those engineering students who do not
    like a lot of coding, is the brevity of code in MATLAB. Table 1.1 compares some
    examples of basic operations in MATLAB and C as a reference. One can imagine from
    the comparison how dramatic the difference will be for complex operations such
    as convolution, filtering, and matrix inversion. Convolution is the heart of almost
    all the filtering and time and frequency domain transformations in image processing,
    and must be done as fast as possible. The MATLAB function conv() is also one of
    the well-kept secrets of MathWorks and is the heart of these operations. The function
    has been optimized for the matrix operations and, hence, operations in MATLAB
    become faster and more efficient than coding in other languages.


    Of course, there is a limit to the usefulness of MATLAB. Although it is wonderful
    for algorithmic testing, it is not very suitable for real-time imaging applications
    due to the slowness of processing. This slowness comes from more levels of compilation
    and interpretation compared to the other languages, as well as from iterative
    procedures where loops are used frequently in real-world'
