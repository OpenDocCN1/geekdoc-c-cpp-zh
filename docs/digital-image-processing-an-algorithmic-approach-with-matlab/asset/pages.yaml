  md: '# 13.3 BACKGROUND SUBTRACTION


    Background subtraction basically means removing the moving objects from the background
    of an image. The method makes use of two or more frames, one of which is a reference
    frame consisting of only the background environment. The reference frame is then
    subtracted from the other frames, so that if the environment is static—that is,
    nothing has been changed in the image—the difference will be zero. However, if
    something has changed in the video sequence, the difference between the reference
    frame and the other frames will not be zero. Given a nonzero difference, a change,
    which can be an object or any other moving artifact, has been detected. The sample
    reference image and moving objects in the foreground are shown in Figure 13.1.
    The image in Figure 13.1(a) shows


    ![](img/fc093ca9cc8a631842aa559a749dca54_254_0.png)


    ![](img/fc093ca9cc8a631842aa559a749dca54_254_1.png)


