  md: '# 3.5 CODING EXAMPLES


    In this section, the various arithmetic operators discussed so far will be explained
    with examples of codes in MATLAB® using its Image Processing Toolbox. The given
    examples are related to color images and, hence, the 3-tuple treatment is performed
    on the images. Once read inside the computer, the images are in unsigned integer
    format of 8 bits (uint8) and, hence, the toolbox functions are used for converting
    the types and taking care of truncation, etc.


    In the following examples, some of the sample images are used for convenience
    in presenting the main point. Although simple, these images do correspond well
    with the real-world scenario and can be transparently applied in that case.


    # 3.5.1 Image Addition


    Consider the following code:


    ```

    P = imread(''sml1.jpg'') ;

    imshow(P)

    Q = imread(''sml2.jpg'') ;

    figure ; imshow(Q)

    R = imadd(P,Q) ;

    figure ; imshow(R)

    figure ; imshow(R+100)

    ```


    The resulting images are shown in Figure 3.4.


    Whereas Figures 3.4(a), (b), and (c) deal with the foregoing code, the fourth
    image represents scalar addition, in which case 100 is added to the resulting
    image of Figure 3.4(c) to get the image shown in Figure 3.4(d). Obviously, simple
    addition may not necessarily produce the desired results, and probably more complex
    operators need to be built to suit the application. You can also use addition
    to brighten an image by adding a constant value to each pixel. For example, the
    following code brightens an RGB image, and the results are shown in Figure 3.5.


    ```

    P = imread(''peppers.png'') ;

    Rs = imadd(P, 100) ;

    figure ; imshow(P) ;

    figure ; imshow(Rs) ;

    ```'
