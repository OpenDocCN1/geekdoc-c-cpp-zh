  md: 'is the Hough transformation for straight lines. When viewed in Hough parameter
    space, points that are collinear in the Cartesian image space become readily apparent
    as they yield curves which intersect at a common (\(\rho,\theta\)) point.


    Mapping back from Hough transform space (i.e., de-Houghing) into Cartesian space
    yields a set of line descriptions of the image subject.


    Note also that the lines generated by the Hough transform are infinite in length.
    If we wish to identify the actual line segments that generated the transform parameters,
    further analysis of the transformed image is required in order to see which portions
