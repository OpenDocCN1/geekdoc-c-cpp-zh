    # 4.4 NOISE IN IMAGES


    In a machine vision system, images acquired through modern sensors may be contaminated
    by a variety of noise sources. This phenomenon is not very visible for the usual
    photographic cameras due to a very stable electronics environment and very short
    imaging paths, which are not the usual conditions in the machine vision system
    or in extreme applications such as military, satellite, and highly noisy vibrating
    environments in the industry. Noise refers to the stochastic variations in the
    image pixel values. In most of the'
