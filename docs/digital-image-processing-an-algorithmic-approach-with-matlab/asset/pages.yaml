    # 9.4 THE CANNY OPERATOR


    The Canny operator was designed to be an optimal edge detector satisfying particular
    criteria. It takes as input a grayscale image, and produces as output an image
    showing the positions of tracked intensity discontinuities. The operator works
    in a multistage process. First, the image is smoothed by Gaussian convolution.
    Then a simple 2D first derivative operator is applied to the smoothed image to
    highlight regions of the image with high first-spatial derivatives. Edges give
    rise to ridges in the gradient magnitude image. The algorithm then tracks along
    the top of these ridges and sets to zero all pixels that are not actually on the
    ridge top so as to give a thin line in the output, a process known as nonmaximal
    suppression. The tracking process exhibits hysteresis controlled by two thresholds:
    T1 and T2, with T1 > T2. Tracking can only begin at a point on a ridge higher
    than T1. Tracking then continues in both directions out from that point until
    the height of the ridge falls below T2. This hysteresis helps to ensure that noisy
    edges are not broken up into multiple edge fragments.


    Increasing the width of the Gaussian kernel reduces the detector''s sensitivity
    to noise at the expense of losing some of the finer detail in the image. The localization
    error in the detected edges also increases slightly as the Gaussian width is increased.
    Usually, the upper tracking threshold can be set quite high, and the lower threshold
    quite low for good results. Setting'
