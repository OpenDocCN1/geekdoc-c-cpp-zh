    ![](img/fc093ca9cc8a631842aa559a749dca54_254_3.png)


    FIGURE 13.1 Sample frames obtained from the video sequence. (a) Background image,
    (b) one target only, (c) two objects with one being the target, (d) three objects
    with one being the target.'
