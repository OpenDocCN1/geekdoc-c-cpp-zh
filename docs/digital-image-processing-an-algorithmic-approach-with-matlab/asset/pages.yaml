- pgno: 69
  md: 'region of interest (ROI) applications. Subtraction can result in negative values
    for certain pixels. When this occurs with unsigned data types, the negative values
    are truncated to zero (0), which is displayed as black.


    Multiplying an image by a constant, referred to as scaling, is a common image
    processing operation. When used with a scaling factor greater than 1, scaling
    brightens an image; a factor less than 1 darkens an image. Scaling generally produces
    a much more natural brightening/darkening effect than simply adding an offset
    to the pixels since it preserves the relative contrast of the image better. Multiplication
    of unsigned integer values in images very often results in overflow. The usual
    rules for truncation are applied in these cases, too.


    Image division (also called rationing), like image subtraction, can be used to
    detect changes in two images. However, instead of giving the absolute change for
    each pixel, division gives the fractional change, or ratio, between corresponding
    pixel values. Division can also be used in the opposite manner as multiplication,
    so that division by a number less than 1 would result in the same effect as that
    of multiplication with a number larger than 1. However, one important application
    of division would be to normalize the pixel values based on the maximum value.
    In fact, a combination of normalization, subtraction of the minimum value as offset
    and, finally, multiplication with a desired scalar to scale the normalized shifted
    pixels to the printing ranges on the screen is very useful for image display on
    the screen. In any comprehensive image processing system, especially an image
    enhancement system in order to display the resulting images with relative brightness
    values, scaling must be done for better and more realistic visualization.


    # 3.4.3 Image Blending and Linear Combinations


    To some extent, the four operators defined so far are considered to be the fundamental
    image processing arithmetic operators. Although one may argue as to whether addition
    and multiplication are fundamental operators, ultimately it depends on the hardware
    implementation, in which one operator may be given preference over the other in
    terms of optimality of implementation. In any case, you can use these basic image
    arithmetic functions in combination to perform a series of operations. For example,
    to calculate the average of two images, the basic equation


    ```

    R(i,j) = \frac{P(i,j) + Q(i,j)}{2}, \quad (3.11)

    ```'
