  md: '# 15.5 SUMMARY


    +   - Soft computing represents the nonconventional approach to solving engineering
    problems related to modeling, estimation, and pattern recognition.

    +   - In general, the domain of soft computing encompasses fuzzy logic, neural
    networks, genetic and evolutionary algorithms, swarm intelligence, chaos theory,
    and similar techniques.

    +   - Soft computing can be applied to image processing for specific tasks.

    +   - Fuzzy logic has been presented in this chapter with applications to image
    classification and denoising.

    +   - For classification, a fuzzy c-means clustering algorithm has been used.

    +   - For denoising, a fuzzy inference system is used with a reference image for
    approximating the input image pixels.

    +   - MATLAB''s Fuzzy Logic Toolbox is used to implement the algorithms.

    +   - Along the same lines, neural networks can also be used for the same two
    applications.

    +   - Other methodologies of soft computing could also be used. However, which
    approach would be better would depend on the nature of the problem.

    +   - Usually, the better approach is a hybrid technique, in order to make use
    of the best features of each method.


