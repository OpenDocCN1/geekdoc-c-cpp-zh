- pgno: 89
  md: 'imaging applications where photo imaging is of concern, charge-coupled device
    (CCD) cameras are used, where photons produce electrons that are commonly referred
    to as photoelectrons. Nevertheless, most of the observations outlined in the following
    sections are about noise and its various sources in CCD imaging but hold equally
    well for other imaging modalities.


    # 4.4.1 Photon Noise


    When the physical signal that we observe is based on light, then the quantum nature
    of light plays a significant role. A single photon at \(\lambda = 500\) nm carries
    an energy of \(E = h\nu = hc/\lambda = 3.97 \times 10^{-19}\) J. The noise problem
    arises from the fundamental statistical nature of photon production. We cannot
    assume that in a given pixel for two consecutive but independent observation intervals
    of length \(T\), the same number of photons will be counted. The probability distribution
    for \(p\) photons in an observation window of length \(T\) seconds is known to
    be of the Poisson type:


    \(P(p|\sigma,T)=\frac{(\sigma T)^p e^{-\sigma T}}{p!}, \quad (4.2)\)


    where \(\sigma\) is the intensity parameter measured in photons per second. It
    is critical to understand that even if there were no other noise sources in the
    imaging chain, the statistical fluctuations associated with photon counting over
    a finite time interval \(T\) would still lead to a finite signal-to-noise ratio
    (SNR). For very bright signals, where \(\sigma T\) exceeds \(10^5\), the noise
    fluctuations due to photon statistics can be ignored if the sensor has a sufficiently
    high saturation level.


    # 4.4.2 Thermal Noise


    An additional stochastic source of electrons in a CCD camera is thermal energy.
    Electrons can become increasingly agitated and consequently freed from the CCD
    material itself through thermal vibration and then, if trapped in the CCD well,
    can be indistinguishable from “true” photoelectrons. By cooling the CCD chip,
    it is possible to significantly reduce the number of thermal electrons that give
    rise to thermal noise, or *dark current*. The probability distribution of thermal
    electrons is also a Poisson process, where the rate parameter, \(\tau\), is an
    increasing function of temperature:


    \(P(p|\tau,T)=\frac{(\tau T)^p e^{-\tau T}}{p!}. \quad (4.3)\)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# ### 4.4.3 On-Chip Electronic Noise


    This noise originates in the process of reading the signal from the sensor, in
    this case through the field effect transistor (FET) of a CCD chip. The general
    form of the power spectral density of readout noise is


    \( S(f) \propto \begin{cases} (2\pi f)^{-\beta} & f < f_{min} \\ k & f_{min} <
    f < f_{max} \\ (2\pi f)^{-\alpha} & f > f_{max} \end{cases}, \quad \beta > 0 \quad
    \alpha > 0 \quad (4.4) \)


    where \(\alpha, \beta,\) and \(k\) are constants and \(f\) is the frequency at
    which the signal is transferred from the CCD chip to the subsequent circuits.


    # ### 4.4.4 KTC Noise


    Noise associated with the gate capacitor of an FET is termed KTC noise and can
    be nonnegligible. The output RMS value of this noise voltage is given by


    \( n_{KTC} = \sqrt{\frac{kT}{C}}, \quad (4.5) \)


    where \(C\) is the FET gate switch capacitance, \(k\) is Boltzmann''s constant,
    and \(T\) is the absolute temperature of the CCD chip measured in K. Proper electronic
    design that makes use, for example, of correlated double sampling and dual-slope
    integration can almost completely eliminate KTC noise.


    # ### 4.4.5 Amplifier Noise


    The standard model for this type of noise is additive, Gaussian, and independent
    of the signal. In modern well-designed electronics, amplifier noise is generally
    negligible. The most common exception to this is in color cameras where more amplification
    is used in the blue color channel than in the green channel or red channel, leading
    to more noise in the blue channel.


    # ### 4.4.6 Quantization Noise


    Quantization noise is inherent in the amplitude quantization process and occurs
    in the analog-to-digital converter, ADC. The noise is additive and independent
    of the signal when the number of grayscale levels is usually more than the 16
    levels corresponding to a 4-bit representation.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Quantization noise can usually be ignored as the total SNR of a complete system
    is typically dominated by the smallest SNR. In CCD cameras, this is photon noise.


    # 4.5 DISTORTIONS IN IMAGES


    A more pertinent problem in the photography scenario is that of distortion, commonly
    called blur. It is treated as a particular point spread function (PSF) that is
    convolved with the image. As the name suggests, the PSF is a type of a kernel
    that arises from one point and spreads out in a fading manner. The blurring of
    images is basically a continuous process; the PSF can also be presented in a continuous
    manner. The PSF can be represented as h(m,n,ψ), where ψ represents the severity
    function of blur PSF. A PSF cannot take any arbitrary value. However, due to the
    physics of the underlying imaging system, both f(m,n) and g(m,n) cannot be negative.
    As a consequence, the PSFs need to be nonnegative and real-valued.


    In addition to this, the imperfections in an image formation system normally act
    as passive operations on the data; that is, they do not absorb or generate energy.
    Consequently, all energy arising from a specific point in the original image should
    be preserved, yielding


    ![](img/fc093ca9cc8a631842aa559a749dca54_91_0.png)


    or in discrete form,


    ![](img/fc093ca9cc8a631842aa559a749dca54_91_1.png)


    where m and n are the indices of an image pixel. Four commonly used blur PSFs
    are presented next.


    # 4.5.1 Linear Motion Blur


    Many types of motion blurs can be distinguished, all of which are due to relative
    motion between the recording device and the object. This can be'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'in the form of translation, a rotation, a sudden change of scale, or some combination
    of these. Translation, which is the most significant source of motion blur, can
    be described as follows.


    When the object translates at a constant velocity V at an angle of \(\phi\) radians
    with the horizontal axis during the exposure interval [0,T], the PSF is given
    by


    \(h(m,n;L,\phi)=\left\{\begin{array}{ c c }

    \frac{1}{L}, & \text{if } \sqrt{m^2+n^2} \le L/2 \text{ and } m/n=-\tan\phi, \\
    \\

    0, & \text{otherwise}

    \end{array}\right.\) (4.8)


    where \(L = VT\) is the length of motion. The PSF is space invariant. However,
    if only part of the image is subjected to the translational motion, the overall
    distortion is spatially variant.


    # 4.5.2 Uniform Out-of-Focus Blur


    When a camera on a 2D imaging plane images a 3D object, some parts of the object
    are in focus whereas other parts are not. For a circular aperture-imaging device,
    the image of any portion of the object is in the form of a circular disk known
    as _circle of confusion_ (CoC). The degree of defocus (diameter of the CoC) depends
    on the focal length _F_ and the aperture number _k_ of the lens, and the distance
    _P_ between camera and object. If the camera is focused sharply at an object at
    distance _S_, the diameter of the CoC, denoted by _C_(_P_), is given as


    \(C(P)=\left\{\begin{array}{ c c }

    \frac{FS}{k(S-F)}-\frac{F^2S}{kP(S-F)}+\frac{F}{k} & \text{for } S<P<\infty \\
    \\

    \frac{-FS}{k(S-F)}+\frac{F^2S}{kP(S-F)}+\frac{F}{k} & \text{for } F<P<S

    \end{array}\right.\) (4.9)


    The PSF of this uniform out-of-focus blur with a radius of _R_ = _C_(_P_)/2 is
    then given by


    \(h(m,n;R)=\left\{\begin{array}{ c c }

    \frac{1}{\pi R^2}, & \text{if } \sqrt{m^2+n^2} \le R \\ \\

    0, & \text{elsewhere}

    \end{array}\right.\) (4.10)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 4.5.3 Atmospheric Turbulence Blur


    Atmospheric turbulence is a severe limitation for remote sensing and aerial imaging
    systems. Though this blur is manifested due to several factors, for a long-term
    exposure case, the blur PSF can be approximated as a Gaussian function as follows


    $$h(m,n;\sigma_G) = C \exp \left\{ - \frac{m^2 + n^2}{2\sigma_G^2} \right\}, \quad
    (4.11)$$


    where $\sigma_G$ represents the severity of the blur and $C$ is a constant, selected
    in such a way that the PSF satisfies its necessary conditions.


    # 4.5.4 Scatter Blur


    This blur occurs for specialized systems in which the incident imaging quanta
    are reflected by the system structure or other incident quanta. This phenomenon
    is more prominent in the case of x-ray and ultrasonic imaging. For such cases,
    the PSF is defined as follows:


    $$h(m,n;\beta_m) = \frac{C}{\left[ \beta_m^2 + (m^2 + n^2) \right]^{\frac{5}{2}}},
    \quad (4.12)$$


    where $\beta_m$ determines the sensitivity of the blur, and is a function of the
    distance between the radiated object and the detector.


    # 4.6 ALGORITHMIC ACCOUNT


    All of the aforementioned anomalies in images are essentially mathematical operations
    that, in general, take place at pixel level. However, these may expand into a
    group of interconnected pixels, as in the case of the scaling operation or the
    blurring process, where a whole neighborhood is affected by the operation. The
    following section covers some of the algorithmic aspects of these operations.


    # 4.6.1 Affine Operations


    Any of the three affine operators mentioned earlier can be used as matrix operations
    very easily in MATLAB®. However, for any other programming environment, these
    would be achieved through the use of nested loops with equations as shown in Table
    4.1. Translation is probably the easiest of all because it only involves a reassignment
    of coordinate values.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The rotation algorithm, unlike the translation algorithm, can produce coordinates
    (x_k,y_j) that are not integers. In order to generate the intensity of the pixels
    at each integer position, different heuristics (or resampling techniques) may
    be employed. For example, two common methods include the following:


    +   - Allow the intensity level at each integer pixel position to assume the value
    of the nearest noninteger neighbor (x_k,y_j).

    +   - Calculate the intensity level at each integer pixel position based on a
    weighted average of the n nearest noninteger values. The weighting is proportional
    to the distance or pixel overlap of the nearby projections.


    The latter method produces better results, but increases the computation time
    of the algorithm.


    Scaling is probably the most complicated and involved operation of the TRS operators.
    Scaling compresses or expands an image along the coordinate directions. As different
    techniques can be used to subsample and zoom, each is discussed in turn.


    Figure 4.3 shows four possibilities of scaling.


    Figure 4.3(a) illustrates the two methods of subsampling. In the first, one pixel
    value within a local neighborhood is chosen (perhaps randomly) to be representative
    of its surroundings. (This method is computationally simple, but can lead to poor
    results if the sampling neighborhoods are too large.) In the figure, in the neighborhood
    of 2 x 2,


    ![](img/fc093ca9cc8a631842aa559a749dca54_94_0.png)


