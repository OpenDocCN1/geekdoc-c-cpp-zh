- pgno: 56
  md: 'adapter in the Windows system. If this information is not available, then the
    default adapter winvideo can be used. This adapter will automatically be directed
    to the video source understood by Windows. More information about this particular
    device can be obtained through the function imaqhwinfo().


    Once the device is configured, the image can be previewed using the preview()
    function to create a typical “viewfinder” window. The actual image can be acquired
    directly into a local variable using the function getsnapshot(). Multiple snapshots
    can be used by employing standard looping techniques. The function delete() helps
    in freeing some memory once the acquisition is done. The following is a typical
    code snippet for acquiring an image:


    ```

    x = videoinput(''winvideo'',1);

    imaqhwinfo(x)

    preview(x)

    y = getsnapshot(x);

    imshow(y)

    delete(x)

    ```


