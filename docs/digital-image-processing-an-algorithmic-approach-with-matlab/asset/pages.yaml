    # 14.4 PROCESS DETAILS


    The process by which the recognition results are obtained must be well understood.
    As has been said, PCA computes the basis of a space, which is represented by its
    training vectors. The basis vectors computed by PCA are in the direction of the
    largest variance of the training vectors. These basis vectors are computed by
    solution of an eigen problem and, as such, the basis vectors are eigenvectors.
    Figure 14.3 shows the same figure as in Figure 14.2 but in its eigenface form.


    These eigenvectors are defined in the image space. They can be viewed as images,
    and, indeed, look like faces. Hence, they are usually referred to as eigenfaces.
    The first eigenface is the average face; and the rest of the eigenfaces represent
    variations from this average face. The first eigenface is a good face filter:
    each face multiplied pixel by pixel (inner product) with this average face yields
    a number close to one; with nonface images, the'
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_278_0.png)


    # FIGURE 14.3 Each image of Figure 14.2 in its eigenspace representation.


    inner product is much less than one. The direction of the largest variation (from
    the average) of the training vectors is described by the second eigenface. The
    direction of the second-largest variation (from the average) of the training vectors
    is described by the third eigenface, and so on.


    Each eigenface can be viewed as a feature. When a particular face is projected
    onto the face space, its vector (made up of its weight values with respect to
    each eigenface) into the face space describes the importance of each of those
    features in the face. Figure 14.4 schematically what PCA does. It takes the training
    faces as input and yields the eigenfaces as output. Obviously, the first step
    of any experiment is to compute the eigenfaces. Once this is done, the identification
    or categorization process can begin.


