  md: 'is normally only applied to binary images, and produces another binary image
    as output.


    The thinning operation is calculated by translating the origin of the structuring
    element to each possible pixel position in the image, and at each such position,
    comparing it with the underlying image pixels. If the foreground and background
    pixels in the structuring element exactly match foreground and background pixels
    in the image, then the image pixel underneath the origin of the structuring element
    is set to background (zero). Otherwise, it is left unchanged. Note that the strel
    must always have a one or a blank at its origin if it is to have any effect.


    The choice of strel determines under what situations a foreground pixel will be
    set to background and, hence, it determines the application for the thinning operation.


    We have described the effects of a single pass of a thinning operation over the
    image. In fact, the operator is normally applied repeatedly until it causes no
    further changes to the image (i.e., until convergence). Alternatively, in some
    applications, for example, pruning, the operations may only be applied for a limited
    number of iterations.


    Consider all pixels on the boundaries of foreground regions (i.e., foreground
    points that have at least one background neighbor). Delete any such point that
    has more than one foreground neighbor, as long as doing so does not locally disconnect
    (i.e., split into two) the region containing that pixel. Iterate until convergence.
    This procedure erodes away the boundaries of foreground objects as much as possible,
    but does not affect pixels at the ends of lines. Figure 10.6 shows some of the
    commonly used strels for thinning.


    Figure 10.7 shows the application of the thinning operator to the sample image.


