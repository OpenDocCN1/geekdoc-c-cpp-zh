  md: '# # Affine and Logical Operations, Distortions, and Noise in Images


    # ## 4.1 INTRODUCTION


    I N MANY IMAGING SYSTEMS, detected images are subject to geometric distortion
    introduced by perspective irregularities in which the position of the camera with
    respect to the scene alters the apparent dimensions of the scene geometry. Applying
    an affine transformation to a uniformly distorted image can correct for a range
    of perspective distortions by transforming the measurements from the ideal coordinates
    to those actually used. Similarly, there are situations related to masking out
    certain areas of an image. This is done through logical operations that act on
    the image in a pixel-by-pixel manner and inhibit or manifest certain values depending
    on the operation. In this chapter, these two types of operations are explored
    in detail so that the reader can prepare for the advanced operations where these
    two operations will be used repeatedly to perform a higher level task.


    # ## 4.2 AFFINE OPERATIONS


    An affine operation or transformation is an important class of linear 2D geometric
    transformations that maps variables [e.g., pixel intensity values located at position
    (x_i,y_i) in an input image] into new variables [e.g., (x_j,y_j) in an output
    image] by applying a linear combination of translation,'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'rotation, scaling, and/or shearing (i.e., nonuniform scaling in some directions)
    operations. Usually referred to as TRS operators, these affine operators are extensions
    of the linear operator with an added bias. This greatly helps a machine vision
    system to correct for perspective errors; that is, an object may appear different
    if it is not straight but tilted slightly. The affine operations can correct for
    the perspective errors by rotating, shifting, and scaling certain portions of
    the image.


    The general affine operation is commonly written in homogeneous coordinates as
    follows:


    ```

    \(\left[ \begin{matrix} x_2 \\ y_2 \end{matrix} \right] = A \left[ \begin{matrix}
    x_1 \\ y_1 \end{matrix} \right] + B .\) (4.1)

    ```


    The TRS operations are summarized in Table 4.1. Several different affine transformations
    are often combined to produce a resultant transformation. The order in which the
    transformations occur is significant because a translation followed by a rotation
    is not necessarily equivalent to the converse.


    Figure 4.1 depicts some of the affine operations on a sample image. In these images,
    the original image (a) goes through the TRS transforms. In Figure 4.1(b), the
    image appears shuffled because each of its quarter portions has been shifted (translated)
    to the location of another portion. For instance, portions 1 and 4 are swapped
    while 2 and 3 are swapped. The swapping is done through adding or subtracting
    the appropriate displacement from or to each pixel of the portion. Figure 4.1(c)
    shows the rotation by 45° (counterclockwise rotation). The resulting black portions
    are zero-padding regions to keep the overall image rectangular or square in shape.
    It is interesting to note that the image size increases due to this operation.
    For this particular case, the size increases from 480 x 640 x 3 to 793 x 793 x
    3. If an equal rotation is performed in the opposite direction, the image will
    appear straight but the size will increase to 1125 x 1125 x 3. The last image
    in Figure 4.1 shows the effect of scaling, where the image size reduces to its
    quarter by replacing each group of a1 x a2 pixels with its average value. This
    can be clearly seen through the size of the resulting image as well as the blurriness
    produced by this operation.


    Most implementations of the affine operator allow the user to define a transformation
    by specifying where three (or less) coordinate pairs from the input image (x1,
    y1) remap in the output image (x2, y2). Once the'
