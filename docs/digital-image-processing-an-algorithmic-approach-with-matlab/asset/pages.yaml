- pgno: 290
  md: 'of new segmentation techniques. The following list is a brief overview of different
    fuzzy approaches to image segmentation:


    **Fuzzy clustering algorithms:** Fuzzy clustering is the oldest fuzzy approach
    to image segmentation. Algorithms such as fuzzy c-means and probabilistic c-means
    can be used to build clusters (segments). The class membership of pixels can be
    interpreted as similarity or compatibility with an ideal object or a certain property.


    **Fuzzy rule-based approach:** If image features are interpreted as linguistic
    variables, one can use fuzzy if-then rules to segment the image into different
    regions. A simple fuzzy segmentation rule may appear ~ as follows:


    IF the pixel is dark


    AND its neighborhood is also dark AND homogeneous


    THEN it belongs to the background.


    **Measures of fuzziness and image information:** Measures of fuzziness (e.g.,
    fuzzy entropy) and image information (e.g., fuzzy divergence) can be also used
    in segmentation and thresholding tasks that are commonly deployed in image processing
    algorithms.


    **Fuzzy geometry:** Fuzzy geometrical measures such as fuzzy compactness and index
    of area coverage can be used to measure the geometrical fuzziness of different
    regions of an image. The optimization of these measures (e.g., minimization of
    fuzzy compactness regarding the cross-over point of membership function) can be
    applied to make fuzzy and/or crisp pixel classifications.


    # 15.2.2.1 Fuzzy C-Means Clustering


    In this book, we have utilized the well-known fuzzy c-means clustering (FCMC)
    algorithm to reduce errors in GPS readings by mapping proximity of data points
    from GPS into its cluster centers. Furthermore, a dual-GPS receiving system is
    utilized that helps in reducing the error even further, because the actual position
    coordinate will now be the average of the most prominent cluster centers from
    the two sensors along the vehicle''s axis. The hardware was interfaced with LabView
    7.1 for all the sensors, GPS'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'receivers, and control actuators. FCMC was implemented in MATLAB® 6.5 and was
    incorporated with the LabView files.


    FCMC is a data-clustering technique in which each data point belongs to a cluster
    to some degree that is specified by a membership grade. This technique was originally
    introduced by Jim Bezdek in 1981 as an improvement on earlier clustering methods.
    It provides a method of grouping data points that populate some multidimensional
    space into a specific number of different clusters.


    A fuzzy c-partition of X is defined by a (c×n) matrix U = {u_ik}, where u_ik =
    u_k(x_i) is the degree of membership of x_i in the ith cluster u_i and { u_i,x
    -> [0,1] }. The following properties must be true:


    ```

    u_{ik} \in [0,1], \quad \forall i,k,

    \sum_k u_{ik} = 1, \quad \forall k,

    0 < \sum_i u_{ik} < n, \quad \forall i,

    ```


    Because of this distribution of membership among the c fuzzy clusters, fuzzy c-partition
    provides much more information about the structure in each data cluster than does
    hard c-partition. Then, to solve the following problem:


    ```

    minimize J_m(U,V) = \sum_i \sum_k u_{ik}^m d^2(x_k, V_i),

    ```


    with respect to U = {u_ik}, a fuzzy c-partition of n unlabeled data sets X = {x_1,
    ..., x_n}, and to V, a set of c fuzzy cluster centers V = {V_1, ..., V_c}, the
    parameter m > 1 is used as the fuzziness index. If m = 1, the algorithm is reduced
    to the hard c-means algorithm. The necessary conditions for the minimizer (U,V)
    of J_m(U,V) are defined as


    ```

    u_{ik} = \frac{1}{\sum_{j=1}^c \left( \frac{d(x_k, V_i)}{d(x_k, V_j)} \right)^{\frac{2}{(m-1)}}},

    ```


    ```

    V_i = \frac{\sum_{k=1}^n (u_{ik})^m x_k}{\sum_{k=1}^n (u_{ik})^m},

    ```


    where $d^2(x_i, V_i) = ||x_k - V_i||^2$ is the distance from $x_k$ to the cluster
    center $V_i$,'
