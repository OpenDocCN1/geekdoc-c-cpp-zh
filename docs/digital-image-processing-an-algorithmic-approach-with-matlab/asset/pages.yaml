    # 11.4.1 Attacks on Watermarks


    There are several kinds of malicious attacks that result in partial or even total
    destruction of the embedded identification key and for which more advanced watermarking
    schemes should be employed. Trickier attacks involve rotations of the image, warping,
    and scaling of the image. Also possible is a cropping attack, which removes rows
    and columns from the image to form a new shape. The difficulty with this attack
    is that it affects the synchronization of the image. In order to detect a watermark,
    there needs to be some form of comparison of the signal against a benchmark. If
    the signal is close enough to the expected form, then the watermark is detected.
    However, if synchronization is lost, then the watermark will not be detected.
    These attacks can be classified as follows:


    +   **Active attacks:** Here, the hacker tries deliberately to remove the watermark
    or simply make it undetectable. This is a big issue in copyright protection, fingerprinting,
    or copy control, for example.


    +   **Passive attacks:** In this attack, the attacker does not try to remove the
    watermark but simply attempts to determine if a given mark is present. As the
    reader will understand, protection against passive attacks is of the utmost importance
    in covert communications, where even knowledge of the presence of a watermark
    is often more than one wants to grant.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '**Collusion attacks:** In collusive attacks, the goal of the hacker is the
    same as in active attacks but the method is slightly different. In order to remove
    the watermark, the hacker uses several copies of the same data, each containing
    a different watermark, to construct a new copy without any watermark. This is
    a problem in fingerprinting applications (e.g., in the film industry) but is not
    widespread, because the attacker must have access to multiple copies of the same
    data and the number needed can be critical.


    **Forgery attacks:** This is probably the main concern in data authentication.
    In forgery attacks, the hacker aims at embedding a new, valid watermark rather
    than removing one. By doing so, the hacker can modify the protected data as he
    wants, and then reimplant a new key to replace the original key, thus making the
    corrupted image to appear genuine.


    # 11.4.2 What Can Be Done?


    Each attack is dealt with by a different approach, and the development of a robust
    technique for image processing remains an open problem. However, some of the commonly
    used methods are now listed briefly.


    **Redundant watermarks:** Here, the watermark is encoded into more than one known
    place in the target image. This can be used against cropping and noise attacks.


    **Multiple watermarks:** This implies embedding more than one watermark in the
    image at known positions. If the positions and sizes of the watermarks are selected
    in such a way that they can cover both even and odd number spaces, then a compression
    attack can be countered.


    **Symmetric watermarks:** The binary watermark must be selected as a symmetric
    image so that the rotation of the image will affect this watermark significantly.
    The positioning of such a watermark will also be important to counter a rotation
    attack.


    **Transformed watermarks:** Instead of a simple image being embedded in the transformed
    image, a transformed version of this watermark will distribute the information
    within the whole image more uniformly and, thus, the image can be made more robust
    to certain attacks.


    **Nonlinear mapping:** Instead of using simple linear or affine mapping, advanced
    mappings can be utilized, making it more difficult for an attacker to isolate
    the watermark.'
  merge: -1
  img_proc: true
