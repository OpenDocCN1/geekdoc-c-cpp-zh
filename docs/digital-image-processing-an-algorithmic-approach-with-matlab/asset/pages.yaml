    # 5.7 SUMMARY


    +   Image transforms decompose an image into a data space where characteristics
    that are otherwise not visible in the original image can be manifested.


    +   Usually, the transformation is bidirectional, and the original image can be
    restored using the inverse transformation.


    +   The Fourier transform is a very well-established technique in mathematics
    and is useful in describing a signal in terms of its frequency components.


    +   In an image, the frequency components are related to both the height and width
    of the image.


    +   Any sudden change in the grayscale values represents high-frequency components.


    +   Consistent gradients or constant grayscale values are related to low-frequency
    components.'
