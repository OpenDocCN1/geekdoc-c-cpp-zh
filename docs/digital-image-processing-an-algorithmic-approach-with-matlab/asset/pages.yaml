    # 9.11 SUMMARY


    +   - Edges in an image are defined as the sudden changes in the intensity levels
    from dark to light, and vice versa.

    +   - Edge detection is a key operation in many machine vision and automation
    systems because this information could extract the objects of interest as well
    as regions of particular importance from an image.

    +   - Being spatially high-frequency components, the edge detection strategies
    usually correspond to high-pass filtering of the image to allow these high-frequency
    components to pass to the next stage.

    +   - Because typical filter implementation in images is through convolution kernels,
    the edge detectors are also similar in nature.

    +   - Almost all of these kernels calculate two submatrices with horizontal and
    vertical edges enhanced, respectively. Then, an overall edge plane is calculated
    for which a binary thresholding is performed to produce the edges.

    +   - Commonly used edge detectors are Sobel, Prewitt, Robert, Robinson, LoG,
    zero-crossing, and Kirsch operators.

    +   - Because each of the aforementioned operators is designed for a particular
    direction, a combinational technique is used in the compass edge detector method.

    +   - In this technique, any standard operator is rotated for K directional orientations,
    and the image is convolved for each of them. The maximum of these convolutions
    are stored as final edges.'
  merge: -1
  img_proc: true
