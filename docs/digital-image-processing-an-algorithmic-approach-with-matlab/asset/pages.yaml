    A more accurate approach is to perform some kind of interpolation to estimate
    the position of the zero crossing to subpixel precision.


    All edges detected by the zero-crossing detector are in the form of closed curves
    in the same way that contour lines on a map are always closed. The only exception
    to this is where the curve goes off the edge of the image.


    Because the LoG filter is calculating a second derivative of the image, it is
    quite susceptible to noise, particularly if the standard deviation of the smoothing
    Gaussian is small. Thus, it is common to see lots of spurious edges detected away
    from any obvious edges. One solution to this is to increase the smoothing of the
    Gaussian to preserve only strong edges. Another is to look at the gradient of
    the LoG at the zero crossing (i.e., the third derivative of the original image)
    and only keep zero crossings where this is above a certain threshold. This will
    tend to retain only the stronger edges, but it is sensitive to noise, because
    the third derivative will greatly amplify any high-frequency noise in the image.
    Figure 9.10 shows the implementation of zero-crossing and LoG operators for edge
    detection.


