- pgno: 106
  md: '# Image Transforms


    # 5.1 INTRODUCTION


    IMAGE TRANSFORMS REFER TO the mathematical mapping of image pixels from the spatial
    domain to some other domain where certain other characteristics of the image can
    be seen in a better manner. An analogy to this is the spectrum of a signal in
    the 1D case. In the time domain, we cannot readily see the frequency components,
    but mapping the signal to its spectrum reveals the details about these components
    (frequency and amplitude). The basic principle behind any transform is to decompose
    a signal (or image) into certain components using some type of magnifying-glass
    function called the kernel or basis function. As such, for images, this basic
    principle can be written as follows:


    ```

    F(a,b) = \sum_m \sum_n f(m,n)\psi(m,n,a,b). (5.1)

    ```


    Several types of such transforms are available for images, such as the following:


    +   - Fourier transform

    +   - Wavelet transform

    +   - Hough transform

    +   - Discrete cosine transform (discussed in Chapter 8)'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'However, in this chapter, the emphasis is on the first three transforms in
    this list. Other types of transforms will be discussed when their applications
    are encountered during the course of the discussion.


    # 5.2 DISCRETE FOURIER TRANSFORM (DFT) IN 2D


    The Fourier transform is an important image processing tool that is used to decompose
    an image into its sine and cosine components. The output of the transformation
    represents the image in the Fourier, or frequency, domain, and the input image
    is the spatial domain equivalent. In the Fourier domain image, each point represents
    a particular two-dimensional frequency component.


    The DFT is the sampled Fourier transform and therefore does not contain all frequencies
    forming an image, but only a set of samples that is large enough to fully describe
    the spatial domain image. The number of frequencies corresponds to the number
    of pixels in the spatial domain image; that is, the images in the spatial and
    Fourier domains are of the same size. For an image of size M x N, the two-dimensional
    DFT is given by


    ```

    F(u,v) = \frac{1}{N^2} \sum_{m=0}^{M-1} \sum_{n=0}^{N-1} f(m,n)e^{-j2\pi(\frac{um}{M}
    + \frac{vn}{N})}, \quad (5.2)

    ```


    where f(m,n) is the image in the spatial domain and the exponential term is the
    basis function corresponding to each point F(u,v) in the Fourier space. The equation
    can be interpreted as follows: the value of each point F(u,v) is obtained by multiplying
    the spatial image by the corresponding basis function and summing the result.


    The basis functions are sine and cosine waves with increasing frequencies; that
    is, F(0,0) represents the DC component of the image, which corresponds to the
    average brightness, and F(N-1, N-1) represents the highest frequency.


    An inverse transformation is also possible and is given by


    ```

    f(m,n) = \frac{1}{N^2} \sum_{u=0}^{M-1} \sum_{v=0}^{N-1} F(u,v)e^{j2\pi(\frac{um}{M}
    + \frac{vn}{N})}. \quad (5.3)

    ```


    The ordinary one-dimensional DFT has MN complexity. This can be reduced to M log2
    N or N log2 M (whichever is smaller) if we employ the fast Fourier transform (FFT)
    to compute the one-dimensional DFTs. This is a significant improvement, in particular,
    for large images. There are'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'various forms of the FFT, and most of them restrict the size of the input image
    that may be transformed, often to N = 2^n, where n is an integer. The mathematical
    details are well described in the literature.


    The Fourier transform produces a complex number-valued output image that can be
    displayed with two images, either with the real and imaginary part or with the
    magnitude and phase. In image processing, often only the magnitude of the Fourier
    transform is displayed, as it contains most of the information of the geometric
    structure of the spatial domain image. However, if we want to retransform the
    Fourier image into the correct spatial domain after some processing in the frequency
    domain, we must make sure to preserve both magnitude and phase of the Fourier
    image.


    The Fourier transform is used if we want to access the geometric characteristics
    of a spatial domain image. Because the image is in the Fourier domain is decomposed
    into its sinusoidal components, it is easy to examine or process certain frequencies
    of the image, thus influencing the geometric structure in the spatial domain.


    In most implementations, the Fourier image is shifted in such a way that the DC
    value (i.e., the image mean), F(0,0), is displayed in the center of the image.
    The farther away from the center an image point is, the higher is its corresponding
    frequency. Figure 5.1 shows an example of application of the Fourier transform
    to images.


    It can be seen that the R, G, and B layers are not providing more information
    than any single layer; therefore, it is always advisable for Fourier transform
    applications to work with grayscale images. Figure 5.2 shows the effect of changes
    in orientation of the original image.


    # 5.3 WAVELET TRANSFORMS


    Unlike the Fourier transform, in which the basis functions cover the entire signal
    range with frequency variation only, the wavelet transform performs better decomposition
    of a signal into its components because in this case, the basis functions vary
    in both frequency range (called scale) and spatial range. High-frequency basis
    covers a smaller area, whereas low-frequency basis covers a larger area. This
    transform is more appropriate for nonstationary signals and provides nonuniform
    partitions of frequency and spatial ranges.


    In Fourier analysis, a signal is broken up into sine and cosine waves of different
    frequencies, and it effectively rewrites a signal in terms of different sine and
    cosine waves. Wavelet analysis does a similar thing: It takes a mother wavelet,
    and the signal is translated into shifted and scaled versions'
  merge: -1
  img_proc: true
