    imaging and atmospheric imaging for remote sensing applications. However, in the
    remaining types, a spotted noise is added and is usually called salt-and-pepper
    noise. The name is appropriate because it only changes the intensity at random
    places to either a very bright (salt) or a very dark (pepper) pixel.


