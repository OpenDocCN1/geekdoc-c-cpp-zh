    # 5.5 ALGORITHMIC ACCOUNT


    The aforementioned transforms have different implementations as algorithms. The
    following is a very generalized account of how these transforms can be implemented
    as general recursive procedures.


    # 5.5.1 Fourier Transform


    Referring to Equations 5.2 and 5.3, the recursive nature of the algorithm is quite
    obvious. First, the frequency range has to be defined to which a spatial image
    has to be mapped. Then, essentially, it is a matter of four nested loops to produce
    the final result. The same is true for the inverse transformation. This is shown
    in Figure 5.7.


    # 5.5.2 Wavelet Transform


    The wavelet transform is implemented quite differently as filter banks. Because
    breaking the image into halves is equivalent to downsampling by 2, first in rows
    and then in columns, the main implementation requires only a low-pass filter,
    a high-pass filter, and a downsampler. The actual DSP-type implementation is shown
    in Figure 5.8.


    # 5.5.3 Hough Transform


    It is easy to implement the Hough transform with three nested loops and for known
    edges. Therefore, it is usually advisable to do a simple Sobel- or Canny-type
    edge detection based on thresholding before applying the transform. These operators
    will be discussed in Chapter 9. Figure 5.9'
