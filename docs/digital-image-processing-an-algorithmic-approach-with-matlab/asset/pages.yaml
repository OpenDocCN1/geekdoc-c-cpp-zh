- pgno: 216
  md: '# # Image Encryption and Watermarking


    # ## 11.1 INTRODUCTION


    DURING THE LAST TWO DECADES, the issue of enhancing privacy in transmitted data
    has attracted the attention of many researchers from different fields, and many
    complementary methods have been suggested in order to improve privacy. As more
    and more information is being transferred electronically, the issue of interest
    here is that if someone accesses all of the data, he or she has the potential
    to copy it and retransmit it to unauthorized parties. This is because of the nature
    of digital data, which is easily reproducible. Usually, this topic is covered
    together with image encryption, cryptography, or watermarking. The focus in this
    chapter is on the watermarking technique. This technique does not distort the
    image but embeds some hidden information, which is like a secret signature that
    can be accessed by authorized users before copying it or retransmitting it. Watermarking
    was first used for copyright protection, but applications of watermarking have
    recently been expanded to content verification, authentication, covert communications,
    and information retrieval.


    In some cases, the watermarking is done in such a way that the actual image is
    distorted in one way or the other. This could vary from including a specific text
    or logo appearing on the image or distortion to the extent that the actual image
    just does not appear the same way. Which of these'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'is to be used in a particular situation depends on the level of security being
    imposed on the image data. If the data is confidential and cannot be allowed to
    be viewed by unauthorized users, it should be encrypted in such a way that the
    shape of the image is distorted beyond simple reconstruction logic. Thus, only
    authorized users can reverse the process, by applying the decoding procedures
    (inverse of the encoding technique used in that particular scenario). There are
    many techniques used in this context, and several of them cannot be fully revealed
    because of their applications in the defense sector.


    On the other hand, when the intent is just to have a signature in the image so
    that if and when this image is reproduced by unauthorized users, then image encryption
    can be utilized. Failure to decode the embedded signature at any point would prove
    that the user was unauthorized, because an authorized user will be able to remove
    the embedded signature. There are different types of encryption techniques available
    in the literature, but watermarking alone is discussed in this chapter. Again,
    only a conceptual guideline is provided in this chapter due to the sensitive nature
    of the technique.


    # 11.2 WATERMARKING METHODOLOGY


    Digital watermarking is a method that has received a lot of attention in the past
    few years. A digital watermark can be described as a visible, or preferably invisible,
    identification code that is permanently embedded in the data. It remains present
    within the data after any decryption process. A general definition of watermarking
    is: “Hiding a secret message or information within an ordinary message and its
    extraction at the destination.”


    Watermarking is complementary to encryption, as it allows some protection of the
    data after decryption. As we know, the encryption procedure aims at protecting
    the image (or other kind of data) during its transmission. Once decrypted, the
    image is not protected anymore. By adding a watermark, we confer a certain degree
    of protection on the image (or on the information that it contains) even after
    the decryption process has taken place. The goal is to embed some information
    in the image without affecting its visual content. In the copyright protection
    context, watermarking is used to add a key in the multimedia data that authenticates
    the legal copyright holder, and that cannot be manipulated'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'or removed without changing the data in a way that negates any commercial value.


    The rapid expansion of the Internet in the past years has rapidly increased the
    public availability of digital data such as audio, images, and video. The problem
    of protecting multimedia information is becoming more and more important, and
    many copyright owners are concerned about illegal duplication of their data or
    work. The manner in which a user accesses the information differs, perhaps through
    secure hardware, and this allows one form of copyright protection. An example
    of this form of security is a DVD player. Instead, watermarking works by hiding
    data within an image, so that an unauthorized user will retransmit this hidden
    information, or watermark. Such a scenario is shown in Figure 11.1.


    As can be seen, if Mr. B tries to resend this information without authorization,
    then Mr. A can prove the origin of the data. This type of watermark, known as
    a robust watermark, remains with the data as long as the data is still recognizable.
    If Mr. B degrades the data to such an extent that it becomes meaningless, then
    it is not reasonable to expect the watermark to still be obtainable. On the other
    hand, if Mr. B is an authorized user but not an authorized distributor, he should
    also receive the key to de-watermark the image before using or he should receive
    the dewatermarked image.


    ![](img/fc093ca9cc8a631842aa559a749dca54_218_0.png)


    FIGURE 11.1 (See color insert following Page 204). Concept of watermarking.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 11.3 BASIC PRINCIPLE OF WATERMARKING


    Because digital watermarking is a technique that allows for the secret embedding
    of information in host data, an image watermarking scheme should at least meet
    the following requirements:


    +   * **Transparency:** The embedded watermark should be perceptually invisible


    +   * **Robustness:** The embedded watermark should not be erased by any attack
    that maintains an acceptable host image quality.


    The trade-off between transparency and robustness is one of the most important
    issues in image watermarking. In terms of the embedding domain, watermarking algorithms
    are mainly divided into two groups: spatial domain methods, which embed the data
    by directly modifying the pixel values of the original image, and transform domain
    methods, which embed the data by modulating the transform domain coefficients.
    The most commonly used transforms for digital watermarking are the DFT (discrete
    Fourier transform), DCT (discrete cosine transform), and DWT (discrete wavelet
    transform). In general, spatial domain methods have good computing performance,
    and transform domain methods have high robustness. In terms of the extracting
    scheme, watermarking algorithms are also divided into two groups: blind and nonblind
    watermarking. In nonblind watermarking, the original image is necessary for the
    watermark extraction, whereas in blind watermarking, the original image is not
    needed for watermark extraction.


    Figure 11.2(a) shows the actual procedure needed to perform the watermarking operation.
    The mapping block F* = F + gW represents a linear mapping method of merging the
    watermark binary image into the RGB or grayscale images. The relationship can
    be modified as needed. Also, the location where mapping will be applied can be
    technique dependent. For instance, with the DCT- and DFT-type transforms, the
    most significant coefficients can be sorted out in the same number as those of
    the pixels in the watermark, and then the mapping can be applied. In the case
    of the DWT, a different approach is utilized in which the watermark may be embedded
    in one of the components, etc. The recovery process is quite straightforward as
    well, and is shown in Figure 11.2(b). Basically, the reverse mapping is performed
    in the same place where mapping was performed in the first phase.'
  merge: -1
  img_proc: true
