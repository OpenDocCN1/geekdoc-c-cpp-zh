    (b) filtered image for (a); (c) noisy image with salt-and-pepper noise; (d) filtered
    image for (c).


    from this neighborhood are found, and the center pixel value is compared against
    these limiting values. If the value of the center pixel is above the maximum,
    it is set to the maximum value; if it is less than the minimum, it is set to the
    minimum value, else it is left as it is. Due to this selective replacement strategy,
    the chances of removing the outlier values, and consequently the speckle and salt-and-pepper
    noise, can be eliminated. Figure 6.5 shows this design strategy.


    Figure 6.6 shows an example of the application of this filter. The effects can
    be fine-tuned by choosing a bigger neighborhood and experimenting with various
    signal-to-noise ratios as well as with different types of noise.


