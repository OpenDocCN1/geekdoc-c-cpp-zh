    This is a classical regularization algorithm that introduces additional information
    about the problem in order to obtain a well-behaved inverse. Basically, the procedure
    tries to make the convolution model Equation 7.1 a well-posed system, which can
    be described as one that is uniquely solvable and is such that the solution depends
    in a continuous way on the data. Also, if'
