- pgno: 62
  md: '# Image Arithmetic


    # 3.1 INTRODUCTION


    ONCE IMAGES ARE INSIDE the computer system, or more specifically, once they are
    read inside a program, the images are nothing but matrices. Hence, all the operations
    that can be applied to matrices should theoretically be applicable to the images
    as well. However, that is not entirely true. Some of the matrix-arithmetic operators
    can be applied to image matrices, whereas other operators do not have any meaning
    in image processing. At the same time, the image matrices have certain special
    operators that are specific to images and that are not usually found in the matrix-arithmetic
    world. Image arithmetic is the implementation of standard arithmetic operations,
    such as addition, subtraction, multiplication, and division, for images. Image
    arithmetic has many uses in image processing, both as a preliminary step in more
    complex operations and by itself.


    This chapter covers some of the most commonly used operations applied to digital
    images. The differences from matrix arithmetic will be pointed out at the appropriate
    places in the discussion.


    # 3.2 OPERATOR BASICS


    Image arithmetic operators operate on either two images of exactly the same size
    or an image and a number. Essentially, it corresponds to two matrices of the same
    order or a matrix and a scalar. For the first case, the operation is performed
    on a pixel-by-pixel basis where each pixel corresponds to one of the elements
    in the matrices. For the second case, the scalar number is operated over the entire
    matrix on each element, that is, all the pixels. The two behaviors are shown in
    Figure 3.1.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/fc093ca9cc8a631842aa559a749dca54_63_0.png)


    FIGURE 3.1 Two modes of image arithmetic operations. (a) Pixel-by-pixel operation
    between two images of same size, (b) scalar operation on an image.


    # 3.3 THEORETICAL TREATMENT


    Usually, the following image operators are used as the building blocks for complex
    processing:


    +   1. Image addition

    +   2. Image subtraction

    +   3. Image multiplication

    +   4. Image division

    +   5. Image blending


    The following sections will discuss these operators theoretically.


    # 3.3.1 Pixel Addition


    This operator takes as input two images of the same size and produces as output
    a third image of the same size as the first two, in which each pixel value is
    the sum of the values of the corresponding pixel from each of the two input images.
    The same strategy can be applied to more than two images as a continuation of
    the same operation. A scalar variant of the operator also exists, in which a specified
    constant number is added to'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'every pixel. The addition of two images is performed straightforwardly in a
    single pass. The output pixel values are given by


    R(m,n) = P(m,n) + Q(m,n), (3.1)


    where P, Q, and R represent the image matrices of the same size, and m and n represent
    the mth and nth pixels.


    Alternatively, if it is simply desired to add a constant value C to a single image,
    then:


    R(m,n) = P(m,n) + C. (3.2)


    If each pixel value corresponds to an n-tuple instead of a number (for instance,
    the color image would have each pixel as a vector of three values corresponding
    to red, blue, and green components), then such pixels are operated on by addition
    at each corresponding vector element to produce the output value.


    The results of addition can easily grow beyond the maximum value that the pixel
    bit resolution will allow. For 8-bit representation of pixels, the addition of
    two pixels with values of 200 each would result in 400, which is higher than the
    maximum representable number with 8 bits, 255. The overflowing pixel values are
    usually set to the maximum allowed value, an effect known as saturation.


    # 3.3.2 Pixel Subtraction


    The pixel subtraction operator takes two images as input and produces as output
    a third image whose pixel values are simply those of the first image minus the
    corresponding pixel values from the second image. It is also often possible to
    just use a single image as input and subtract a constant value from all the pixels.
    Some versions of the operator will output the absolute difference between pixel
    values rather than the signed output. The subtraction of two images is performed
    straightforwardly in a single pass. The output pixel values are given by


    R(m,n) = P(m,n) - Q(m,n). (3.3)


    Or if the operator computes absolute differences between the two input images,
    then:


    R(m,n) = |P(m,n) - Q(m,n)|. (3.4)


    Or if it is simply desired to subtract a constant value C from a single image,
    then:


    R(m,n) = P(m,n) - C. (3.5)'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'If each pixel value corresponds to an $n$-tuple instead of a number (for instance,
    the color image would have each pixel as a vector of three values corresponding
    to red, blue, and green components), then such pixels are operated on by subtraction
    at each corresponding vector element to produce the output value.


    If the operator calculates absolute differences and the two input images use the
    same pixel value type, then it is impossible for the output pixel values to be
    outside the range that may be represented by the input pixel type, and so this
    problem does not arise. This is one good reason to use absolute differences.


    # 3.3.3 Pixel Multiplication and Scaling


    Although images are treated as matrices, image multiplication does not follow
    the matrix multiplication rule. This implies that instead of having the number
    of columns of the first matrix be the same as the number of rows the second matrix,
    image multiplication requires the two images to be of the same size. Similar to
    other image arithmetic operators, multiplication comes in two forms. The first
    form takes two input images and produces an output image in which the pixel values
    are just those of the first image, multiplied by the values of the corresponding
    values in the second image. The second form takes a single input image and produces
    output in which each pixel value is multiplied by a specified constant. This latter
    form is probably more widely used and is generally called scaling. The multiplication
    of two images is performed in the obvious way in a single pass using the formula:


    ```

    R(m,n) = P(m,n) \times Q(m,n). (3.6)

    ```


    Scaling by a constant is performed using


    ```

    R(m,n) = P(m,n) \times C. (3.7)

    ```


    Note that the constant is often a floating-point number, and may be less than
    one, which will reduce the image intensities. It may even be negative if the image
    format supports that.


    If each pixel value corresponds to an $n$-tuple instead of a number (for instance,
    the color image would have each pixel as a vector of three values corresponding
    to red, blue, and green components), such pixels are operated on by multiplication
    at each corresponding vector element to produce the output value. If the output
    values are calculated to be larger than the maximum allowed pixel value, then
    they are usually truncated at that maximum value. The same is also true for values
    less than the minimum allowed pixel values, in which case the truncation is done
    at the minimum value.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# ### 3.3.4 Pixel Division


    The image division operator normally takes two images as input and produces a
    third image whose pixel values are the pixel values of the first image divided
    by the corresponding pixel values of the second image. Many implementations can
    also be used with just a single input image, in which case every pixel value in
    that image is divided by a specified constant.


    The division of two images is performed in the obvious way, in a single pass using
    the formula:


    ```

    R(m,n) = P(m,n) / Q(m,n). (3.8)

    ```


    Division by a constant is performed using


    ```

    R(m,n) = P(m,n) / C. (3.9)

    ```


    If each pixel value corresponds to an n-tuple instead of a number (for instance,
    the color image would have each pixel as a vector of three values corresponding
    to red, blue, and green components, such pixels are operated on by division at
    each corresponding vector element to produce the output value.


    The division operator may only implement integer division, or it may also be able
    to handle floating-point division. If only integer division is performed, then
    results are typically rounded down to the next lowest integer for output. The
    ability to use images with pixel value types other than 8-bit integers comes in
    very handy when doing division.


    # ### 3.3.5 Blending


    This operator produces a blend of two input images of the same size by combining
    scalar multiplication and image addition. Similar to pixel addition, the value
    of each pixel in the output image is a linear combination of the corresponding
    pixel values in the input images. The coefficients of the linear combination are
    user specified, and they define the ratio by which the images must be scaled before
    combining them. These proportions are applied such that the output pixel values
    do not exceed the maximum pixel value. The resulting image is calculated using
    the following formula:


    ```

    R(m,n) = C x P(m,n) + (1-C) x Q(m,n). (3.10)

    ```


    P and Q are the two input images. C is the blending ratio, which determines the
    influence of each input image in the output. C can either be a constant factor
    for all pixels in the image or can be determined for each'
  merge: -1
  img_proc: true
