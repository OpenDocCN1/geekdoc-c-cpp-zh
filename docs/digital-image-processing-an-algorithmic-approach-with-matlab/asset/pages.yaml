- pgno: 306
  md: '# # Glossary


    # ## GLOSSARY OF SELECTED TECHNICAL TERMS


    **Binary images:** Binary images are images whose pixels have only two possible
    intensity values. They are normally displayed as black and white. Numerically,
    the two values are often 0 for black, and either 1 or 255 for white. Binary images
    are often produced by thresholding a grayscale or color image in order to separate
    an object in the image from the background. The color of the object (usually white)
    is referred to as the *foreground color*. The rest (usually black) is referred
    to as the *background color*. However, depending on the image that is to be thresholded,
    this *polarity* might be inverted, in which case the object is displayed with
    0 and the background with a nonzero value.


    **Bit:** An acronym for a binary digit. It is the smallest unit of information
    that can be represented. A bit may be in one of two states, on or off, represented
    by a zero or a one.


    **Bit map:** A representation of graphics or characters by individual pixels arranged
    in rows and columns. Black and white require 1 bit, while high-definition color
    requires up to 32 bits.


    **Brightness:** Magnitude of the response produced in the eye by light.


    **Byte:** A group of eight bits of digital data.


    **Color images:** It is possible to construct (almost) all visible colors by combining
    the three primary colors, red, green, and blue (RGB), because the human eye has
    only three different color receptors, each of which is sensitive to one of the
    three colors. Full RGB color requires that the intensities of the three color
    components be specified for each and every pixel. It is common for each component
    intensity to be stored as an 8-bit integer, and so each pixel'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'requires 24 bits to completely and accurately specify its color. If this is
    done, the image is known as a 24-bit color image.


    # **Color depth:** The number of color values that can be assigned to a single
    pixel in an image. Also known as bit depth, color depth can range from 1 bit (black
    and white) to 32 bits (over 16.7 million colors).


    # **Color quantization:** Color quantization is applied when the color information
    of an image is to be reduced. The most common case is when a 24-bit color image
    is transformed into an 8-bit color image.


    # **Contrast:** The difference between highlights and shadows in a photographic
    image. The larger the difference in density, the greater the contrast.


    # **Contrast stretching:** Improving the contrast of images by digital processing.
    The original range of digital values is expanded to utilize the full contrast
    range of the recording film or display device.


    # **Convolution:** Convolution is a simple mathematical operation that is fundamental
    to many common image processing operators. Convolution provides a way of “multiplying
    together” two arrays of numbers, generally of different sizes, but of the same
    dimensionality, to produce a third array of numbers of the same dimensionality.
    This can be used in image processing to implement operators whose output pixel
    values are simple linear combinations of certain input pixel values. The convolution
    is performed by sliding the kernel over the image, generally starting at the top-left
    corner, so as to move the kernel through all the positions where the kernel fits
    entirely within the boundaries of the image. (Note that implementations differ
    in what they do at the edges of images, as explained later.) Each kernel position
    corresponds to a single output pixel, the value of which is calculated by multiplying
    together the kernel value and the underlying image pixel value for each of the
    cells in the kernel, and then adding all these numbers together.


    # **Correlation:** A mathematical measure of the similarity between images or
    areas within an image. Pattern matching or correlation of an X-by-Y array size
    template to an image of the same size produces a scalar number, the percentage
    of match. Typically, the template is walked through a larger array to find the
    highest match.


    # **Digital watermark:** A unique identifier embedded in a file to deter piracy
    and prove file ownership and quality.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '**Dilation:** A morphological operation that moves a probe or structuring element
    of a particular shape over the image, pixel by pixel. When an object boundary
    is contacted by the probe, a pixel is preserved in the output image. The effect
    is to “grow” the objects.


    **Distance metrics:** It is often useful in image processing to be able to calculate
    the distance between two pixels in an image, but this is not as straightforward
    as it seems. The presence of the pixel often makes several so-called _distance
    metrics_ possible, which often give different answers for the distance between
    the same pair of points. The three most important ones are the following:


    +   1. Euclidean distance—The straight line distance between two pixels at coordinates
    (x1,y1) and (x2,y2); the Euclidean distance is given by \(\sqrt{(x_2 - x_1)^2
    + (y_2 - y_1)^2}\).

    +   2. City block distance—Also known as the Manhattan distance. This metric assumes
    that in going from one pixel to the other, it is only possible to travel directly
    along pixel grid lines. Diagonal moves are not allowed. Therefore, the city block
    distance is given by \(|x_2 - x_1| + |y_2 - y_1|\).

    +   3. Chessboard distance—This metric assumes that you can make moves on the
    pixel grid as well as diagonally with equivalent distance. This means that the
    metric is given by (\(|x_2 - x_1| + |y_2 - y_1|\)).


    **Dithering:** Dithering is an image display technique that is useful for overcoming
    limited display resources. The word _dither_ refers to a random or semirandom
    perturbation of the pixel values.


    **Edge:** A change in pixel values exceeding some threshold amount. Edges represent
    borders between regions on an object or in a scene.


    **Edge detection:** The ability to determine the edge of an object.


    **Edge enhancement:** The process of identifying edges or high frequencies within
    digital images.


    **Erosion:** The converse of the morphology dilation operator. A morphological
    operation that moves a probe or structuring element of a particular shape over
    the image, pixel by pixel. When the probe fits inside an object boundary, a pixel
    is preserved in the output image. The effect is to “shrink” or “erode” objects
    as they appear'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'in the output image. Any shape smaller than the probe (i.e., noise) disappears.


    # Fast Fourier transform


    Produces a new image that represents the frequency domain content of the spatial
    or time domain image information. Data is represented as a series of sinusoidal
    waves.


    # Frame grabber


    This device is used to convert analog signals to digital signals; used in digital
    imaging.


    # Grayscale images


    A grayscale (or gray-level) image is one in which the only colors are shades of
    gray. The reason for differentiating such images from any other type of color
    image is that less information needs to be provided for each pixel. In fact, a
    “gray” color is one in which the red, green, and blue components all have equal
    intensity in RGB space, and so it is only necessary to specify a single intensity
    value for each pixel, as opposed to the three intensities needed to specify each
    pixel in a full-color image. Often, the grayscale intensity is stored as an 8-bit
    integer, giving 256 possible different shades of gray, from black to white. If
    the levels are evenly spaced, then the difference between successive gray levels
    is significantly better than the gray-level resolving power of the human eye.


    # High-pass filter


    Allows detailed high-frequency image information to pass while attenuating low-frequency,
    slow-changing data. Opposite of low-pass filter.


    # Histogram


    A graphical representation of the frequency of occurrence of each intensity or
    range of intensities (gray levels) of pixels in an image. The height represents
    the number of observations occurring in each interval.


    # Histogram equalization


    Modification of the histogram to evenly distribute a narrow range of image grayscale
    values across the entire available range.


    # Hue


    The attribute of a color that differentiates it from gray of the same brilliance
    and that allows it to be classed as blue, green, red, or intermediate shades of
    these colors.


    # Image


    Projection of an object or scene onto a plane (i.e., screen or image sensor).


    # Image analysis


    The process of extracting features or attributes from an image based on properties
    of the image; evaluation of an image based on its features; for decision making.


    # Image capture/acquisition


    The process of acquiring an image of a part or scene from sensor irradiation to
    acquisition of a digital image.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'Image distortion: A situation in which the image is not exactly true to scale
    with the object scale.


    Image enhancement: Image processing operations that improve the visibility of
    image detail and features. Usually performed either automatically by software
    or manually by a user through an interactive application. Any one or a group of
    operations that improves the detectability of the targets or categories. These
    operations include, but are not limited to, contrast improvement, edge enhancement,
    spatial filtering, noise suppression, image smoothing, and image sharpening.


    Image filter: A mathematical operation performed on a digital image at every pixel
    value to transform the image in some desired way.


    Image processing: Conversion of an image into another image in order to highlight
    or identify certain properties of the image.


    Image resampling: A technique for geometric correction in digital image processing.
    Through a process of interpolation, the output pixel values are derived as functions
    of the input pixel values combined with the computed distortion. Nearest neighbor,
    bilinear interpolation, and cubic convolution are commonly used resampling techniques.


    Kernel: A kernel is (usually) a small matrix of numbers that is used in image
    convolutions. Different-sized kernels containing different patterns of numbers
    give rise to different results under convolution. The word kernel is also commonly
    used as a synonym for structuring element, which is a similar object used in mathematical
    morphology.


    Masking: A mask is a binary image consisting of both zero and nonzero values.
    If a mask is applied to another binary or to a grayscale image of the same size,
    all pixels that are zero in the mask are set to zero in the output image. All
    other pixels remain unchanged. Masking can be implemented using either pixel multiplication
    or logical AND, the latter in general being faster. Masking is often used to restrict
    a point or arithmetic operator to an area defined by the mask. We can, for example,
    accomplish this by first masking the desired area in the input image and processing
    it with the operator, then masking the original input image with the inverted
    mask to obtain the unprocessed area of the image and, finally, recombining the
    two partial images using image addition. In some image processing packages, a
    mask can directly be defined as an optional input to a'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'point operator, so that the operator is automatically applied only to the pixels
    defined by the mask.


    **Mean squared error:** The mean squared error is a measure of performance of
    a point estimator. It measures the average squared difference between the estimator
    and the parameter. For an unbiased estimator, the mean squared error is equal
    to the variance of the estimator.


    **Median:** In a population or a sample, the median is the value that has just
    as many values above it as below it. If there are an even number of values, the
    median is the average of the two middle values. The median is a measure of central
    tendency. The median can also be defined as the 50th percentile. For symmetrical
    distributions, the median coincides with the mean and the center of the distribution.
    For this reason, the median of a sample is often used as an estimator of the center
    of the distribution. If the distribution has heavier tails than the normal distribution,
    then the sample median is usually a more precise estimator of the distribution
    center than is the sample mean.


    **Median filter:** A method of image smoothing that replaces each pixel value
    with the median grayscale value of its immediate neighbors.


    **Mode:** The mode is a value that occurs with the greatest frequency in a population
    or a sample. It could be considered as the single value most typical of all the
    values.


    **Morphology:** Group of mathematical operations based on manipulation and recognition
    of shapes. The study of shapes and the methods used to transform or describe shapes
    of objects. Also called mathematical morphology. Operations may be performed on
    either binary or grayscale images. -


    **Noise:** Random or repetitive events that obscure or interfere with the desired
    information.


    **Noisy image:** An image with many pixels of different intensities. An untuned
    TV picture produces a very noisy or random image. (Note that sound has nothing
    to do with a noisy image.)


    **Normal distribution:** The normal distribution is a probability density that
    is bell-shaped, symmetrical, and single-peaked. The mean, median, and mode coincide
    and lie at the center of the distribution. The two tails extend indefinitely and
    never touch the x-axis (asymptotic to the x-axis). A normal distribution is fully
    specified by two parameters: the mean and the standard deviation.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '**Pattern recognition:** A process of decision making in which a new input
    is recognized as a member of a given class by a comparison of its attributes with
    the already known pattern of common attributes or members of that class.


    **Picture element (pixel):** In a digitized image, this is the area on the ground
    represented by each digital value. Because the analog signal from the detector
    of a scanner may be sampled at any desired interval, the picture element may be
    smaller that the ground resolution cell of the detector. Commonly abbreviated
    as pixel.


    **Principal components analysis:** The purpose of principal components analysis
    is to derive a small number of linear combinations (principal components) of a
    set of variables that retain as much of the information in the original variables
    as possible. This technique is often used when there are large numbers of variables,
    and you wish to reduce them to a smaller number of variable combinations by combining
    similar variables (ones that contain much the same information). Principal components
    are linear combinations of variables that retain maximal amount of information
    about the variables. The term “maximal amount of information” here means the best
    least-squares fit, or, in other words, maximal ability to explain variance of
    the original data.


    **Resolution:** The ability to distinguish closely spaced objects on an image
    or photograph. Commonly expressed as the spacing, in line pairs per unit distance,
    of the most closely spaced lines that can be distinguished.


    **RGB:** Acronym for red-green-blue. A model for describing colors that are produced
    by emitting light, as on a video monitor, rather than by absorbing it, as with
    ink on paper. The three kinds of cone cells in the eye respond to red, green,
    and blue light, respectively, so percentages of these additive primary colors
    can be mixed to get the appearance of any desired color.


    **Segmentation:** The process of dividing a scene into a number of individual
    objects or contiguous regions, differentiating them from each other and the image
    background.


    **Template:** An artificial model of an object or a region or feature within an
    object.


    **Template matching:** A form of correlation used to find out how well two images
    match.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '**Texture:** The degree of smoothness of an object surface. Texture affects
    light reflection, and is made more visible by shadows formed by its vertical structures.


    **Thresholding:** The process of converting a grayscale image into a binary image.
    If the pixel''s value is above the threshold, it is converted to white. If it
    is below the threshold, the pixel value is converted to black.'
  merge: -1
  img_proc: true
