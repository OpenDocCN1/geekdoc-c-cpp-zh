- pgno: 177
  md: "The only time two function declarations will clash is if they have identical\
    \ argument lists, which is a logically ambiguous situation. Note that the const\
    \ modifier does make a difference in the argument list:\n\n```\nint foo(int);\
    \        // ok\nint foo(const int);  // ok\n\nint i = 5;\nint j = foo(i);    \
    \  // int foo(int) called\nint k = foo(5);      // int foo(const int) called\n\
    ```\n\n# Name Mangling\n\nHow does an overloaded function know what to do? It\
    \ performs one operation on one kind of data, but another operation on a different\
    \ kind. Overloading is like the joke about the famous scientist who insisted that\
    \ the thermos bottle was the greatest invention of all time. Why? It's a miracle\
    \ device. It keeps hot things hot, but cold things cold. How does it know?\n\n\
    When a C++ module is compiled, the compiler generates function names that include\
    \ an encoding of the function's argument types. This process is called name mangling\
    \ and makes overloaded functions possible. In C++, the function name that is in\
    \ the source code is different from the function name generated by the C++ system.\n\
    \nIn C, if you make the function call:\n\n```\nvoid foo(int);\n\nint main() {\n\
    \    foo(5);\n    return 0;\n}\n```\n\na compiler might generate an assembler-language\
    \ call :\n\n```\ncall _foo\n```"
