  md: '# Constant Pointer


    To declare a pointer itself to be a constant, rather than the thing being pointed
    to, *const is used:


    ```

    syntax: <type> *const cp;

    ```


    Here, cp is a constant pointer to an object of type <type>. For example:


    ```

    char *const cp = "Haley";

    ```


    defines a constant pointer, or more specifically a constant pointer to a character,
    i.e., a read-only pointer to memory. We say that cp is a constant pointer to characters.
    The constant pointer cp always points to the same piece of memory and therefore
    must be initialized at the point of declaration:


    ```

    cp = "Haley" // error

    ```


    Although a constant pointer cannot be modified, the object to which it points
    can be:


    ```

    cp[3] = ''x''; // ok

    *cp = ''x''; // ok

    ```


    Here we are only modifying the characters cp addresses.


    Another example:


    ```

    int errNum; // possible error states of program

    int *const curErr = &errNum; // constant pointer

    ```


    In the declarations above, curErr is a constant pointer to an object of type int.
    Therefore we can modify the value of the object curErr addresses:'
