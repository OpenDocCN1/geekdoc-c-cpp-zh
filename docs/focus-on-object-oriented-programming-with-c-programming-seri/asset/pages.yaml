  md: "We can solve this problem by overloading the assignment operator, =. We use\
    \ a declaration of the form:\n\n```\nAlpha& operator=(const Alpha&);\n```\n\n\
    So let's now add an overloaded assignment operator function to the Alpha class:\n\
    \n```\nclass Alpha {\nprivate:\n    char *buf;\n    int i;\n    double d;\npublic:\n\
    \    // appropriate constructors etc.\n    Alpha& operator=(const Alpha&);\n};\n\
    ```\n\nThe overloaded assignment operator specifies a constant reference parameter\
    \ of type Alpha. The parameter refers to the object being copied.\n\nReturning\
    \ a reference to the assigned-to object allows users to write code like:\n\n```\n\
    Alpha x, y;\nx = y = Alpha(num);    // note that assignment is right associative\n\
    ```\n\n# Assigning Alpha Objects\n\nAssigning one Alpha object to another requires\
    \ several steps:\n\n+   - freeing the memory belonging to the pointer being obliterated\n\
    +   - allocating memory to contain a copy of the source string pointer\n+   -\
    \ making that memory contain a copy of the string\n+   - copy all other data members\n\
    \nSuch an operation might look like this:"
