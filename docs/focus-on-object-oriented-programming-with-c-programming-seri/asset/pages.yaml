- pgno: 52
  md: "setiosflags(flaglist)\nSets the formatting flags in flaglist, where flaglist\
    \ is a sequence of one or more 1-bit flags, separated with the I symbol: flag1\
    \ | flag2 | flag3\n\nHere are a few of the formatting flags available:\n\n+  \
    \ • ios::showpoint - displays decimal point and trailing zeros, even in a number\
    \ with no fractional part\n+   • ios::fixed - displays real values in fixed-point\
    \ form, avoiding exponential format\n+   • ios::scientific - displays real value\
    \ in floating-point form\n+   • ios::left - displays values left-justified within\
    \ a field\n+   • ios::right - displays values right justified within a field\n\
    \nNote that at this point we do not need to know what the ios class is, or the\
    \ reasons for the exact syntax used. To illustrate the use of format manipulators,\
    \ type in, compile and execute the following program:\n\n```\n// iol.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main( {\n    float x, y;\n    x = 8.0\
    \ / 3.0;\n    y = 9.0 / 3.0;\n    cout << \"<<\" << x << \">\" << endl;\n    cout\
    \ << \"<<\" << y << \">\" << endl;\n    return 0;\n}\n```\n\nWhile the default\
    \ format depends on the particular C++ implementation, the output displayed by\
    \ these statements might appear as:\n\n(2.666667)\n(3)"
  merge: -1
