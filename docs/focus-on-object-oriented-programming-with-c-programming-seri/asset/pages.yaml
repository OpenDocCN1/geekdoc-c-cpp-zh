- pgno: 234
  md: "# Returning References\n\nThere are numerous reasons for functions to return\
    \ references:\n\nThe first common use for functions to return references is for\
    \ assignment operators:\n\n```\nclass Alpha {\n    public:\n        Alpha& operator*=(const\
    \ Alpha&) {\n            ...\n            ...\n            return *this;\n   \
    \     }\n};\n```\n\nThe usual practice is for such operators to return *this as\
    \ a reference. This makes it possible to chain assignments:\n\n```\nAlpha a1,\
    \ a2, a3, a4;\n...\n...\na1 = a2 = a3 = a4;\n```\n\nThis is also possible if operator\
    \ = returned an Alpha instead of an Alpha&:\n\n```\nclass Alpha {\n    public:\n\
    \        Alpha operator*=(const Alpha&) {\n            ...\n            ...\n\
    \            return *this;\n        }\n};\n```\n\nBut doing this would not be\
    \ a good idea. Such an assignment operator would always form a copy of the object\
    \ being assigned, even though that copy would eventually be thrown away."
  merge: -1
  img_proc: true
- pgno: 235
  md: "The second common use for functions that return references is to allow member\
    \ function calls to be chained easily.\n\nConsider a class Text whose objects\
    \ represent strings of text. Such objects might have an associated font, size,\
    \ etc.\n\n```\nclass Text {\npublic:\n    Text(const Strings&);\n    Text& setSize(int);\n\
    \    Text& setFont(const String&);\n};\n```\n\nIf the setSize() and setFont()\
    \ members each return *this as a reference, that allows expressions such as:\n\
