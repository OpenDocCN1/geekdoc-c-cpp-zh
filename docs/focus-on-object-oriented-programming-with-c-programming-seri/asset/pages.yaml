- pgno: 320
  md: "| General Window Class |\n      /               \\\n| Text Window |   | Bit-Mapped\
    \ Graphics Window |\n      |               |\n| Text Editor |   | Drawing Program\
    \ |\n\nThis is all single inheritance because all derived classes possess only\
    \ one parent each. Note that there is no set limit on the number of classes that\
    \ may be derived from one another.\n\nSo inheritance allows you to collect related\
    \ classes into a hierarchy with the classes at the top serving as abstractions\
    \ for those below. This implies that a derived class is a specialization of its\
    \ parent class, i.e., the derived class \"is a\" type of base class, but with\
    \ more detail added. For this reason, the relationship between a derived class\
    \ and its base class is called an is-a relationship.\n\nThe base class remains\
    \ unchanged by this process of inheritance regardless of the number of classes\
    \ that are derived from it. Therefore a derived class is always at least as big\
    \ as its parent class so that an instance of the derived class always contains\
    \ all of the members of its parent class.\n\nNote that you cannot subtract or\
    \ remove anything from a parent class. However, accessing the inherited members\
    \ is a different matter we'll look at later, i.e., just because you happen to\
    \ derive a class does not mean that you are automatically granted complete and\
    \ unlimited access privileges to the members of the base class."
