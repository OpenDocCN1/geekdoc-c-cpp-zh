  md: "# Calling a Static Member Function\n\nYou can call a static member function\
    \ in two ways:\n\n```\n// word9.h\n\n#ifndef _WORD9_H\n#define _WORD9_H\n\nclass\
    \ Word {\n    private:\n        char *buf;\n        static int wordCount;\n  \
    \  public:\n        Word(char *s);\n        static int getCount();\n};\n\n#endif\n\
    ```\n\n```\n// word9.cpp\n\n#include <string.h>\n#include \"word9.h\"\n\nint Word::wordCount\
    \ = 0;\n\nWord::Word(char *s) {\n    buf = strdup(s);\n    wordCount++;\n}\n\n\
    int Word::getCount() {\n    return wordCount;\n}\n```\n\n```\n// word9drv.cpp\n\
    \n#include <iostream>\n#include \"word9.h\"\n\nint main() {\n    Word w1(\"Red\"\
    );\n    Word w2(\"White\");\n    Word w3(\"Blue\");\n\n    cout << w1.getCount()\
    \ << endl;\n    cout << Word::getCount() << endl;\n    return 0;\n}\n```"
