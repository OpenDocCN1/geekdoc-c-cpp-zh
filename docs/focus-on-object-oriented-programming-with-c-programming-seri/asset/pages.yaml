- pgno: 198
  md: "C++ allows you to surmount these problems in an elegant fashion. You can define\
    \ a member function as `static`! This meaning is close to the one for `static`\
    \ data members, i.e., the function is for the whole class and not just one object\
    \ of the class.\n\nThe key is that the `this` pointer is not secretly passed into\
    \ a `static` member function. Thus you don't get the extra overhead. However,\
    \ you also cannot access anything but `static` data members and `static` member\
    \ functions.\n\nSince a function is a member of the class, its name is hidden\
    \ inside the scope of the class and will not collide with global names. In addition,\
    \ you have the notational convenience of associating the name of the class, so\
    \ it's more obvious what the function is supposed to do and that it may be affected\
    \ by changes in the class.\n\n```\n```cpp\n// word8.h\n\n#ifndef WORD8_H\n#define\
    \ WORD8_H\n\nclass Word {\n   private:\n      char *buf;\n      static int wordCount;\n\
    \n   public:\n      Word(char *s);\n      static int getCount();\n};\n\n#endif\n\
    \n// word8.cpp\n\n#include <string.h>\n#include \"word8.h\"\n\nint Word::wordCount\
    \ = 0;\n\nWord::Word(char *s) {\n   buf = strdup(s);\n   wordCount++;\n}\n\nint\
    \ Word::getCount() {\n   return wordCount;\n}\n```\n```"
  merge: -1
  img_proc: true
