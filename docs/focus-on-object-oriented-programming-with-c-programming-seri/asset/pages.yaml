  md: "# Virtual Function Mechanism\n\nIt is easier to understand how the compiler\
    \ locates virtual functions at runtime by considering the data structures involved\
    \ and the memory layout used with class objects using virtual functions. Let's\
    \ do an experiment and look at the sizes of some objects:\n\n```\nclass Alpha\
    \ {\nprivate:\n    int i;\npublic:\n    void foo() {}\n    void faa() {}\n};\n\
    \nclass Beta {\nprivate:\n    int i;\npublic:\n    virtual void foo() {}\n   \
    \ void faa() {}\n};\n\nclass Gamma {\nprivate:\n    int i;\npublic:\n    virtual\
    \ void foo() {}\n    virtual void faa() {}\n};\n\nint main() {\n    Alpha a;\n\
    \    Beta b;\n    Gamma g;\n\n    cout << sizeof(Alpha) << endl; // 4\n    cout\
    \ << sizeof(Beta) << endl; // 8\n    cout << sizeof(Gamma) << endl; // 8\n\n \
    \   cout << sizeof(a) << endl; // 4\n    cout << sizeof(b) << endl; // 8\n   \
    \ cout << sizeof(g) << endl; // 8\n\n    void *voidPointer;\n    cout << sizeof(voidPointer);\
    \ // 4\n    return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "Looking at the size of various classes and objects, we find a difference in\
    \ size when one or more of the functions are virtual. Whenever a class has one\
    \ or more virtual functions, the sizeof() that class is increased by 4 bytes or\
    \ one pointer size. This extra pointer data member that has secretly been inserted\
    \ into the class by the compiler is called the vpointer or vptr.\n\nThe vptr contains\
    \ the address of an array of function pointers called the vtable. The vtable contains\
    \ the addresses of (pointers to) all the functions that have been declared virtual\
    \ in the class or in any inherited class. Every object of a class containing a\
    \ virtual function is provided with a vptr to the vtable for the class.\n\n# Let's\
    \ take another look at our Gamma class:\n\n```\nclass Gamma {\nprivate:\n    int\
    \ i;\npublic:\n    virtual void foo() {}\n    virtual void faa() {}\n};\n```\n\
    \n# Here is a picture of what the data structures look like:\n\n![](img/adb3588dc0dfe9f607c1d417be6bb240_411_0.png)\n\
    \nWhen an object is created, the appropriate vtable address is inserted into the\
    \ objects vptr. The vptr is initialized to the starting address of the vtable\
    \ in the constructor, so there's no chance of making a virtual function call before\
    \ the vptr has been initialized. This is accomplished by secret code inserted\
    \ into the constructor by the compiler. Note that if a vptr wasn't initialized,\
    \ you'd have a disaster the first time you made a function call. This is one essential\
    \ reason why the compiler automatically creates a default constructor if you don't\
    \ explicitly create any constructors. One job of the generated default constructor\
    \ is to initialize the vptr."
  merge: -1
  img_proc: true
- pgno: 412
  md: "When you make a call to a virtual function, the compiler doesn't execute a\
    \ normal function call that is an absolute call to some address. This would be\
    \ early or static binding that is what a C compiler always does. We don't want\
    \ that here! Instead, after the compiler performs the usual type checking for\
    \ a function call, the compiler inserts a special bit of code that says:\n\n+\
    \   go to the address pointed to by the vptr\n\n+   index into this array by x\
    \ places and call that function\n\nSo the exact function call is determined at\
    \ runtime by which vtable address is in the vptr. Note that the order of functions\
    \ in the vtable is crucial since the compiler calls the function by indexing into\
    \ the table. Therefore, all the vtables must have the same order of functions.\
    \ This fixed index remains associated with the particular virtual function throughout\
    \ the inheritance hierarchy. Fortunately, this is all taken care of for us by\
    \ the compiler!\n\nKeep in mind that each derived class has its own vtable. For\
    \ each derived class, the vtable of the base class is duplicated and if a virtual\
    \ function is redefined in the derived class, then its address replaces the address\
    \ of the corresponding function from the base class. Any new virtual functions\
    \ defined in the derived class are appended to the end of the vtable. For example,\
    \ shown below is a base class with three virtual functions declared:\n\n```\n\
    class Base {\n private:\n int i;\n public:\n virtual void foo();\n virtual void\
    \ faa();\n virtual void laa();\n};\n```"
  merge: -1
  img_proc: true
- pgno: 413
  md: "The internal data structures that get created are shown below:\n\nBase class\
    \ object                   Base vtable\n+---+                               +---+\n\
    | i | -------------------> 0        | &foo() -------> Base::foo()\n+---+     \
    \                          +---+\n| vptr ----------------> 1          | &faa()\
    \ -------> Base::faa()\n+---+                               +---+\n          \
    \                          2   | &laa() -------> Base::laa()\n               \
    \                         +---+\n\nA derived class is declared as follows:\n\n\
    ```\nclass Derived : public Base {\n  public:\n    virtual void faa();\n    virtual\
    \ void taa();\n};\n```\n\nIts internal data structures are shown below:\n\nDerived\
    \ class object                Derived vtable\n+---+                          \
    \     +---+\n| i | -------------------> 0        | &foo() -------> Base::foo()\n\
    +---+                               +---+\n| vptr ----------------> 1        \
    \  | &faa() -------> Derived::faa()\n+---+                               +---+\n\
    \                                    2   | &laa() -------> Base::laa()\n     \
    \                                   +---+\n                                  \
    \  3   | &taa() -------> Derived::taa()\n                                    \
    \    +---+"
  merge: -1
  img_proc: true
- pgno: 414
  md: 'So each time you derive a new class, the compiler creates a new `vtable` for
    that derived class. There are three possibilities that can occur in a derived
    class:


    +   • The derived class can inherit the virtual function declared within the base
    class. The address of that virtual function is copied into the associated slot
    in the derived class''s virtual table.


    +   • The derived class can override the virtual function declared within the
    base class with one of its own virtual functions. In this case, the address of
    derived class''s virtual function is placed within the associated slot.


    +   • The derived class can introduce a new virtual function not present in the
    base class. In this case, the virtual table is increased in size one slot and
    the address of the virtual function is placed within that slot. Note that there''s
    always a virtual function address in every slot of the virtual table.


    The virtual function calling scheme is as follows:


    +   • A pointer to the object''s `vtable` is retrieved from `vptr`.


    +   • Remember that the index of each virtual function in the `vtable` is a constant
    value for each `vtable` in the class hierarchy established at compile time. Therefore,
    the `vtable` pointer will be offset by the index of the virtual function in question


    +   • The `vtable` contains an entry (a pointer) to the desired virtual function.


    +   • The retrieved function pointer is dereferenced and the function call is
    made.


    Thus, given the following declaration:


    ```

    Base *bptr = new Derived;

    ```


    the compiler would translate the statement:


    ```

    bptr->faa();

    ```'
  merge: -1
  img_proc: true
