- pgno: 409
  md: 'Because the destructors are now declared to be `virtual`, calls to them are
    linked at runtime, and the object itself determines which destructor should be
    called! Therefore, the `Derived` destructor is called which then implicitly invokes
    the `Base` class destructor! Therefore, the entire two strings are deleted.


    Rule: If you allocate memory in a Base class, you should make the destructor virtual.


    Note, that virtual destructors violate the rule that states that virtual functions
    must have the same name and destructors obviously do not have the same name because
    they are based upon their respective class names. Therefore the compiler takes
    this into account and simply ignores the name of the destructor.'
