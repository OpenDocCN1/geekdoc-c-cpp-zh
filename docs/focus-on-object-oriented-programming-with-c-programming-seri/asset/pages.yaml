  md: '```

    String& operator=(const char*);

    ```


    # String Concatenation


    The next step in the process of overloading functions for the `String` class is
    to add two `String`s together. For our purposes, we will assume that this implies
    a `String` concatenation operation. Since addition typically involves the binary
    `+` operator, it seems natural to overload it for the `String` class. There are,
    however, some design considerations to be made here.


    First, should the function be a member or a friend? The better choice would be
    to use a friend function. This has the advantage of allowing the left-hand argument
    to be a string literal (type `char*`) or a character (type `char`) so that an
    implicit type conversion can occur. In addition, if you coded it as a member function,
    then one of the `String` instances would have to be the invoking instance, and
    the other would have to be the explicit argument. This doesn''t make sense because
    the arguments in an add operation are, in essence, equal. Therefore, both of them
    should be explicit arguments, thereby implying a friend function.


    Second, should the function literally emulate what `strcat()` does and modify
    the first argument? In this case the better answer would be no, because normally
    an add operation implies that neither argument is modified. Instead, they are
    simply combined to produce a brand new object. Here is one way to do it.


    ```

    friend String operator+(const String&, const String&);

    ```


    Note that the return type of the function is a `String` object by value. A reference
    cannot be used because you should never make an alias to a local (automatic) object,
    which is what the result of the function really is. Also, this gives us a chance
    to use the constructor taking an `int`.


    You can also overload the `operator+()` four more times in order to achieve an
    exact match under all possible concatenation circumstances.


    ```

    friend String operator+(const String&, const char*);

    friend String operator+(const char*, const String&);

    friend String operator+(const String&, char);

    friend String operator+(char, const String&);

    ```'
