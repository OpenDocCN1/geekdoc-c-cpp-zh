  md: "# Initialization of Static Data Member\n\nSince all the objects of a class\
    \ have access to the static member, who is responsible for reserving storage and\
    \ initializing it? You cannot do it in every constructor since every object created\
    \ would then reinitialize the static member. There is a special way to create\
    \ and initialize static data members. You must create a definition outside of\
    \ all functions:\n\n```\n// word4.h\n\n#ifndef _WORD4_H\n#define _WORD4_H\n\n\
    class Word {\nprivate:\n    char *buf;\n    static int wordCount;\npublic:\n \
    \   Word(char *s);\n};\n\n#endif\n\n// word4.cpp\n#include <string.h>\n#include\
    \ \"word4.h\"\n\nint Word::wordCount = 0;\n\nWord::Word(char *s) {\n    buf =\
    \ strdup(s);\n    wordCount++;\n}\n```\n\nThis looks somewhat unusual because\
    \ you must not only give the variable name, but also its class using the scope\
