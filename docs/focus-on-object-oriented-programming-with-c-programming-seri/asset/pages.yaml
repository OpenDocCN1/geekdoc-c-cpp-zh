  md: "Now, what could be the problem with duplicate pointers addressing the same\
    \ locations in memory?\n\nDeleting one of those pointers, perhaps within a destructor,\
    \ might cause the other pointer to address this freed memory (a dangling pointer).\
    \ Worse yet, deleting the same space more than once in a class destructor might\
    \ corrupt the heap!\n\nC++ provides two mechanisms for ensuring that classes with\
    \ pointer members are copied and assigned safely:\n\n+   - memberwise initialization\n\
    +   - memberwise assignment\n\nTo create a complete copy of an `Alpha` object,\
    \ we must define a constructor for the `Alpha` class that takes an `Alpha` reference\
    \ as an argument, i.e., a constructor that can create a copy of an `Alpha` object,\
    \ a copy constructor:\n\n```\nAlpha::Alpha(const Alpha& a) {\n    length = a.length;\n\
    \    buf = new char[length + 1];\n    strcpy(buf, a.buf);\n}\n```\n\nNote that\
    \ the copy constructor allocates room for the null-terminating string `buf` and\
    \ copies into it the string that was passed to it as an argument.\n\nWhen the\
    \ copy constructor is used, you get a complete copy of the `Alpha` object:\n\n\
    ![](img/adb3588dc0dfe9f607c1d417be6bb240_299_0.png)"
