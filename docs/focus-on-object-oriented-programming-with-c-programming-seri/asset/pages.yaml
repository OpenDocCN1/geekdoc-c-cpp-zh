  md: 'provide a copy constructor for any class that includes dynamically allocated
    members.


    So a copy constructor is a member function of a class that is executed to create
    an object of that class. Because such a constructor is usually written as taking
    a single argument of type reference to the class of which it is a member, it is
    usually referred to as:


    ```

    X(X&) (pronounced X of X ref)

    ```


    Our `Alpha` copy constructor tells how to construct an `Alpha` object with an
    initial value that is a copy of some other `Alpha`:


    ```

    Alpha(const Alpha&);

    ```


    So initializations are always expressed as copy constructors that are capable
    of creating a new object as a replica of an existing object.


    Initializations are always accomplished through constructors. A class of this
    kind will usually have at least three constructors:


    +   • default constructor - `Alpha::Alpha()`, that determines what value to give
    to an `Alpha` object that is not explicitly initialized


    +   • conversion constructor – a constructor from some other type such as `char*`
    to make it possible to put values into `Alpha` objects that do not originate from
    other `Alpha` objects


    +   • copy constructor, `Alpha::Alpha(const Alpha&)`, that tells how to construct
    an `Alpha` object with an initial value that is a copy of some other `Alpha` object.'
