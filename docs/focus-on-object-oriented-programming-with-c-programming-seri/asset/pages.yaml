- pgno: 336
  md: 'Note that the `Laborer` class operates identically to the `Employee` class
    since it contains no additional data or functions. It may seem that the `Laborer`
    class is unnecessary, but by making it a separate class we emphasize that all
    classes are derived from the same source, `Employee`.


    Another reason for creating an apparently empty `Laborer` class concerns the issues
    of maintenance. In the future, if we decide to modify the `Laborer` class, we
    would not need to change the specifier for `Employee`.


    Classes used only for deriving other classes, i.e. `Employee`, are sometimes called
    _abstract classes_, meaning that no actual instances (objects) of this class are
    created. The term abstract has a more precise definition connected with polymorphism
    and virtual functions that we''ll come across later.


    # Levels of Inheritance


    Classes can be derived from classes that are themselves derived classes. Consider
    the class hierarchy below:


    ```

    class A {

    };


    class B : public A {

    };


    class C : public B {

    };

    ```


    Here, class B is derived from class A, and class C is derived from class B. This
    process can be extended to an arbitrary number of levels.


    In this way, we can extend our `Employee` class program to add a special kind
