- pgno: 16
  md: "# Implementation of dtob() Function\n\n```\n#include <BigInt.h>\nBigInt *dtob(char\
    \ *d) {\n    BigInt *t, *ten;\n    t = itob(0);\n    ten = itob(10);\n    while(*d)\
    \ {\n        BigInt *u;\n        u = itob(*d++ - '0');\n        bmult(t, ten,\
    \ t);\n        badd(t, u, t);\n        bfree(u);\n    }\n    bfree(ten);\n   \
    \ return t;\n}\n```\n\n# C Program Using BigInt Library\n\n```\n#include <BigInt.h>\n\
    BigInt *dtob(char *d);\nint main(void) {\n    BigInt *a, *b, *c, *t;\n    a =\
    \ dtob(\"12345678901234\");\n    b = dtob(\"24680135792356\");\n    c = itob(0);\n\
    \    t = itob(300);\n    badd(a, b, c);\n    badd(c, t, c);\n    bout(c);\n  \
    \  printf(\"\\n\");\n    bfree(a);\n    bfree(b);\n    bfree(c);\n    bfree(t);\n\
    }\n```"
