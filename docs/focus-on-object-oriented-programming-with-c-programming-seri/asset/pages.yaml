    \ dy) const { x += dx; y += dy; }\n};\n```\n\nA const member function defined\
    \ outside the class body must specify the const keyword in both its declaration\
    \ and definition:\n\n```\nclass Point {\nprivate:\n    int x, y;\npublic:\n  \
    \  Point(int a, int b) { x = a; y = b; }\n    int xPos() const;\n    int yPos()\
    \ const;\n    void move(int dx, int dy) { x += dx; y += dy; }\n};\n\nint Point::xPos()\
    \ const { return x; }\nint Point::yPos() const { return y; }\n```\n\nYou must\
    \ also be careful when calling other functions inside a constant member function.\
    \ These other functions cannot be allowed to modify any of the data members. The\
    \ compiler ensures that when inside a constant member function, each data member\
