  md: 'The International Olympic Committee needs your help. The computer program that
    figures out who won races based on the timing data from each lane needs to be
    rewritten in object-oriented style. You have been selected for the job. Fortunately
    (or perhaps not), some of the preliminary design work has been done, and the main
    program that inputs the data and prints it out has already been written. Your
    job is to write two C++ classes, `Competitor` and `Ranker`, both declaration (.h)
    and implementation (.cpp), to store information on each competitor in a race and
    to rank these competitors from lowest to highest finishing time. This code should
    be divided into four files: `competitor.h`, `competitor.cpp`, `ranker.h`, and
    `ranker.cpp`.


    Objects of the `Competitor` class are initialized with the person''s name and
    lane assignment, specified as a character string and an integer. The person''s
    name should be copied into the `Competitor` object''s own memory; that is, don''t
    just record the pointer that was passed in. Note that there should be no predefined
    size for the person''s name. Also note that you should not use any C++ predefined
    `String` class for this lab. Since the person''s time is not known at the outset,
    this value is set with a separate member function called `setTime()`, which accepts
    a double floating-point value. There should also be member functions to retrieve
    the name, lane, and time, as well as a member function to print out the object
    as a single line of text. Finishing times should be output to one decimal place.
    Finally, don''t forget to have the class destructor deallocate any storage when
    an object of this class goes out of scope.


    Objects of the `Ranker` class are initialized with the number of items (`Competitor`
    objects) to be ranked. Pointers to `Competitor` objects are passed to an `addList()`
    member function one by one. If a `NULL` pointer is passed in, or if the total
    number of objects passed in exceeds the pre-defined number of items, `addList()`
    should return 0; otherwise, it returns the total number of `Competitor` objects
    passed in. Items are retrieved (but not removed) from the list using two member
    functions: `getLane()` and `getFinish()`. Each accepts an integer from 1 to the
    number of items in the list. `getLane()` returns a pointer to the `Competitor`
    object in the specified lane, while `getFinish()` returns a pointer to the competitor
    who finished at the specified position (first, second, etc.). Finally, when a
    `Ranker` object is destroyed, it frees any memory that it allocated for itself,
    but it does not delete the memory for the `Competitor` objects (since it has no
    way of knowing how these were created).'
