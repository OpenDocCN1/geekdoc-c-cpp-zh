- pgno: 179
  md: "```\nint main() {\n    button b;\n    b.push();\n}\n```\n\nHere, the call to\
    \ push() generates the assembly-language call:\n\n```\ncall ?push@button@@QAEXXZ\n\
    ```\n\nThis shows that name encoding also puts class member function names inside\
    \ their own scope, so even if a class member function has the same name and argument\
    \ list as a global function or a member function from another class, there will\
    \ be no name clash.\n\n# Overloading Member Functions\n\nWe can also overload\
    \ member functions:\n\n```\nclass Point {\nprivate:\n    int x, y;\npublic:\n\
    \    void set(int xp, int yp) {\n        x = xp;\n        y = yp;\n    }\n   \
    \ void set(Point p) {\n        x = p.x;\n        y = p.y;\n    }\n};\n```\n\n\
    We can call these two member functions as follows:\n\n```\nint main() {\n    Point\
    \ p, q;\n    p.set(42, 14);\n    q.set(p);\n}\n```"
