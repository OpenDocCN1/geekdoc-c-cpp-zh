  md: "# Container Relationships\n\nUp to now, the only type of data members within\
    \ a class have been mostly primitive types: `int`, `float`, `char`, etc. But there\
    \ is nothing that forbids us from having a class definition that contains an instance\
    \ of some other class.\n\nThe relationship between a class and an instance of\
    \ another class is called a container relationship, because one class literally\
    \ contains an instance of the other class. In object-oriented programming terminology,\
    \ this is also referred to as a has-a relationship, because the containing class\
    \ has-a(n) instance of the other class.\n\nConsider the following program:\n\n\
    ```\n// contain1.cpp\n#include <iostream>\n#include <string.h>\nusing namespace\
    \ std;\nclass String {\n    private:\n    char *buf;\n    public:\n    String()\
    \ {\n        cout << \"String default constructor\" << endl;\n        buf = new\
    \ char[strlen(\"Shari\")+1];\n        strcpy(buf, \"Shari\");\n    }\n    String(char\
    \ *s) {\n        cout << \"String one arg constructor\" << endl;\n        buf\
    \ = new char[strlen(s)+1];\n        strcpy(buf, s);\n    }\n    ~String() {\n\
    \        delete [] buf;\n    }\n    void printString() {\n        cout << buf\
    \ << endl;\n    }\n};\n```"
