  md: 'Finally, it might be useful to create and initialize a `String` object with
    a repeated character `int` number of times.


    ```

    String (char, int);

    ```


    # Destructor Function


    When the `String` object goes out of scope, the destructor function must release
    the space on the heap. Otherwise, we will have a severe case of "memory leakage".


    ```

    ~String();

    ```


    # Assigning One String Instance To Another String Instance


    Another function that we need in the `String` class is one that can assign one
    `String` instance to another instance (every C programmers dream!). In order to
    do this successfully, you must overload the assignment operator for the `String`
    class. Why is this necessary since the compiler automatically supplies a default
    assignment operator that is used to copy all of the data members? For much the
    same reason that we had to write an explicit copy constructor, i.e., without one
    the address in the pointer would get copied into the corresponding pointer data
    member of the receiving instance and, as a result, the pointer would then be pointing
    to the same space on the heap. This could cause trouble when the destructor function
    attempts to release this space. Therefore, the default assignment operator that
    the compiler supplies in this situation obviously is not good enough and therefore
    needs to be overloaded. Remember, this must be done as a binary member function.


    ```

    String& operator=(const String&);

    ```


    # Implicit Type Conversion


    In addition to assigning one `String` instance to another `String` instance, it
    makes sense to have the capability to assign a string literal (`char*`) to a `String`
    instance.'
