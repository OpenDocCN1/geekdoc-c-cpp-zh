  md: "```\nclass base {\npublic:\n    int num;\n};\n\nclass X : public virtual Base\
    \ {};\nclass Y : public virtual Base {};\n\nclass Z : public X, public Y {\npublic:\n\
    \    int getNum ( return num; )\n};\n```\n\nNote that we no longer need to use\
