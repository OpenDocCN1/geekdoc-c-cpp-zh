    \ function in the Base class, and optionally in the derived classes.\n\n```\n\
    // virtual3.cpp\n#include <iostream>\nusing namespace std;\nclass Base {\n  public:\n\
    \    virtual void show() { cout << \"Base\" << endl; }\n};\nclass Derived1 : public\
    \ Base {\n  public:\n    virtual void show() { cout << \"Derived1\" << endl; }\n\
    };\nclass Derived2 : public Base {\n  public:\n    virtual void show() { cout\
    \ << \"Derived2\" << endl; }\n};\n```"
