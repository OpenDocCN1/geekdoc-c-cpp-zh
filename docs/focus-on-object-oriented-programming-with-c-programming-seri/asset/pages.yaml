    \ a, int b);\nint main() {\n    int x = 5, y = 3, z;\n    z = max(x, y);\n   \
    \ cout << z;\n}\ninline int max(int a, int b) {\n    if (a > b)\n        return\
    \ a;\n    else\n        return b;\n}\n```\n\nWe use inline functions the same\
    \ way we use normal functions. The source code calls a max() function from within\
    \ main(). However, in the compiled code the max() function is not called. Instead,\
    \ the compiler inserts the functions statements directly into the program effectively\
    \ compiling the function call as if it had been written:\n\n```\nif (x > y)\n\
    \    z = x;\nelse\n    z = y;\n```\n\nYou can also declare a member function within\
    \ its class and define it elsewhere as inline, or you can both declare and define\
    \ a member function within its class, in which case it is automatically an inline\
    \ function."
