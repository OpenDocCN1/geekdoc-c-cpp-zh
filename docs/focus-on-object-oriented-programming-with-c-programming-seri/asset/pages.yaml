- pgno: 17
  md: '# # Analysis of C Programs


    Although the problem of adding big integers is conceptually similar to that of
    adding small integers, the two C programs are very different. In the 2nd example,
    we become so involved in the details of programming with BigInts that we lose
    sight of the essence of the problem we''re trying to solve, making the program
    difficult to write and understand.


    # ## Procedural Programming Details


    What details does the procedural programming model force us to deal with in the
    2nd program?


    +   - Initialize `BigInts` in separate statements, such as `c = itob(0);`. Failing
    to do this in `main()` is a frequent source of error.

    +   - Handle temporary variables, such as the variable `t` in `main()`.

    +   - Convert small integers to `BigInts`, as in `t = itob(300);` in `main()`.

    +   - Use functions with distinctive names, like `badd()` and `bmult()`, instead
    of the traditional arithmetic operators.

    +   - Manage storage, as in the calls to `bfree()` in `main()`.


    # ## C++ is not Magic


    Code to perform operations on big integers and to handle the details of:


    +   - initialization

    +   - temporary variables

    +   - type conversions

    +   - storage management

    +   - etc.


    must still be written.


    The important difference is that in C++, we can package this code as an ADT such
    that the programmer who codes the ADT, the provider, handles the complexities,
    while those who use the ADT, the clients, find it as convenient to use as a built-in
    data type.'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# # C++ Code Using Data Abstraction\n\nUsing C++ and making the big integer\
    \ software an ADT called BigInt instead of using a procedure library has a dramatic\
    \ effect on writing a program to solve our problem:\n\n```\n```cpp\n#include \"\
    BigInt.h\"\n\nint main() {\n    BigInt a = \"12345678901234\";\n    BigInt b =\
    \ \"24680135792356\";\n    BigInt c;\n\n    c = a + b + 300;\n    c.print();\n\
    }\n```\n```\n\nNotice how similar the 1st C program is to this C++ program which\
    \ performs a similar calculation using BigInts instead of ints. Obviously, the\
    \ C++ version is more compact and easier to understand than its C counterpart\
    \ in the 2nd C program.\n\n# ## Analyze C++ Program\n\n```\n```cpp\n#include \"\
    BigInt.h\"\n\nint main() {\n    BigInt a = \"12345678901234\";\n    BigInt b =\
    \ \"24680135792356\";\n    BigInt c;\n\n    c = a + b + 300;\n    c.print();\n\
    }\n```\n```\n\nThe first 3 statements in main() declare three type BigInt variables\
    \ a, b, c. The compiler needs to know:\n\n+   - how to create them\n+   - how\
    \ much space to allocate for them\n+   - how to initialize them"
