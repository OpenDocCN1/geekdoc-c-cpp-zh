- pgno: 238
  md: "Although returning by reference would save the time spent in copying the object,\
    \ you cannot return a reference to String s because s is a temporary object that\
    \ exists only within the function addString() and is destroyed when the function\
    \ returns. Note: because a reference is like a pointer, you cannot return a reference\
    \ to anything that is temporary!! You should never return a reference to a local\
    \ variable because the local variable will disappear as soon as the function returns\
    \ and the reference will lead nowhere. This is called a dangling reference. Be\
    \ sure that if you do return a reference, it refers to an object that will still\
    \ be around after the function returns.\n\nNote that there is nothing wrong with\
    \ returning a formal parameter as a reference provided that the formal parameter\
    \ is itself a reference. For example:\n\n```\n// don't do this\nint& foo(int x)\
    \ {\n    return x;\n}\n\n// but this is OK\nint& foo(int& x) {\n    return x;\n\
    }\n```\n\nHere the parameter x is just an alternate name for something that existed\
    \ before foo() was called and will presumably still exist after foo() has returned.\n\
    \nThere would have been no problem returning a reference to a global or static\
    \ variable or to a formal parameter that is itself a reference."
