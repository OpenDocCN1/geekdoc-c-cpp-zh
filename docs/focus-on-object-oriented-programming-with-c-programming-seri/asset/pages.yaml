    \ inches = in; }\n\tDistance operator+(Distance d);\n};\n\nDistance Distance::operator+(Distance\
    \ d) {\n\tint ft = feet + d.feet;\n\tfloat inches = inches + d.inches;\n\tif (in\
    \ >= 12.0) {\n\t\tin -= 12.0;\n\t\t++ft;\n\t}\n\treturn Distance(ft, in);\n}\n\
    ```\n\nWhen the compiler sees an expression like:\n\n```\nd3 = d1 + d2;\n```\n\
    \nit realizes it must use the `Distance` member function `operator+()`. But what\
    \ does this function use as its argument, `d1` or `d2`? And why doesn't it need\
    \ two arguments, since two numbers are added?\n\nThe argument on the left side\
    \ of the operator, `d1`, is the object that really calls the operator member function.\
    \ The object on the right side of the operator, `d2`, must be furnished as an\
    \ argument to the operator.\n\nIn the `operator+()` function, data members left\
    \ of the operand are accessed directly as feet and inches, since this is the object\
    \ which really called the member function. The right operand is accessed as the\
    \ function's argument, as `d2.feet` and `d2.inches`.\n\nNote: Overloaded operators\
    \ always require one less argument than the number of operands. This is true since\
    \ one operand is the object that called the member function. That is also why\
    \ unary operators require no arguments."
