  md: "# Output Formats\n\nLet's take a look at output formats. Type in, compile and\
    \ execute the following C++ program that calculates an employee's salary:\n\n\
    ```\n// employ1.cpp\n\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    double hours, rate, salary;\n\n    cout << \"Enter the hours worked:\
    \ \";\n    cin >> hours;\n    cout << \"Enter the pay rate: \";\n    cin >> rate;\n\
    \n    if (hours <= 40.0)\n        salary = hours * rate;\n    else\n        salary\
    \ = (40 * rate) + (hours - 40.0) * rate * 1.5;\n\n    cout << \"Hours worked =\
    \ \" << hours << endl;\n    cout << \" Hourly rate = \" << rate << endl;\n   \
    \ cout << \" Salary = \" << salary << endl;\n\n    return 0;\n}\n```\n\nThe output\
    \ produced by the preceding program:\n\nEnter the hours worked: 52.5\nEnter the\
    \ pay rate: 12.75\nHours worked = 52.5\nHourly rate = 12.75\nSalary = 749.062\n\
    \nis not really satisfactory because the float values are displayed with a precision\
    \ that is not suitable for monetary values. This can be remedied by inserting\
    \ format manipulators from the header file <iomanip> as items in the output list.\
    \ These format manipulators, when inserted into an output list, specify the appearance\
    \ (or format) of the output. A few manipulators are shown below:\n\n+   setw(width)\n\
    +   Displays the next value in a field with the specified width (1 is the default).\
    \ Affects only the next item to be displayed.\n\n+   setprecision(precision)\n\
    +   Displays values with the specified precision (6 is a common default)"
