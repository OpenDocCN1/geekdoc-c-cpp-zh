  md: '# Constructors Lab (Bar Codes)


    Prior to 2009 the bar code on the envelope used by the U.S. Postal Service represented
    a five (or more) digit zip code using a format called POSTNET. The bar code consists
    of long and short bars as shown below:


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_144_0.png)


    For this program we will represent the bar code as a string of digits. The digit
    1 represents a long bar, and the digit 0 represents a short bar. Therefore, the
    bar code shown above would be represented in our program as:


    ```

    110100101000101011000010011

    ```


    The first and last digits of the bar code are always 1. Removing these leave 25
    digits. If these 25 digits are split into groups of five digits each then we have:


    ```

    10100 10100 01010 11000 01001

    ```


    Next, consider each group of five digits. There will always be exactly two 1''s
    in each group of digits. Each digit stands for a number. From left to right the
    digits encode the values 7, 4, 2, 1, and 0. Multiply the corresponding value with
    the digit and compute the sum to get the final encoded digit for the zip code.
    The table below shows the encoding for 10100.


    | Bar Code Digits | 1 | 0 | 1 | 0 | 0 |

    |---|---|---|---|---|---|

    | Value | 7 | 4 | 2 | 1 | 0 |

    | Product of Digit x Value | 7 | 0 | 2 | 0 | 0 |


    Zip Code Digit = 7 + 0 + 2 + 0 + 0 = 9


    Repeat this for each group of five digits and concatenate to get the complete
    zip code. Note that there is one special value. If the sum of a group of five
    digits is 11, then this represents the digit 0 (this is necessary because with
    two 1''s per group it is not possible to represent zero). The zip code for the
    sample bar code'
