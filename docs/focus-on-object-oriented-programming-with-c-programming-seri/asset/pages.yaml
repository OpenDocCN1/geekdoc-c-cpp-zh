  md: "# Selecting Friend or Member Functions\n\nIn many situations you get equivalent\
    \ results by using either a friend function or a member function when you overload\
    \ an operator. A friend function simply contains an extra argument. The friend\
    \ function must have both objects passed to it, while the member function only\
    \ needs a single argument. However, sometimes friend functions are too convenient\
    \ to avoid. One example is when friends are used to increase the versatility of\
    \ overloaded operators.\n\nFor example, the program below shows a limitation in\
    \ the use of overloaded operators when friends are not used:\n\n```\n#include\
    \ <iostream.h>\n\nclass Distance {\n   private:\n      int feet;\n      float\
    \ inches;\n\n   public:\n      Distance() {       // default constructor\n   \
    \      feet = 0;\n         inches = 0.0;\n      }\n      Distance(float ffeet)\
    \ {   // conversion constructor\n         feet = int(ffeet);   // feet is integer\
    \ part\n         inches = 12 * (ffeet - feet); // inches is what's left\n    \
    \  }\n      Distance(int ft, float in) {\n         feet = ft;\n         inches\
    \ = in;\n      }\n      void showdist() {\n         cout << feet << \"\\'-\" <<\
    \ inches << \"\\\"\\n\";\n      }\n      Distance operator+(Distance d);\n};\n\
    \nDistance Distance::operator+(Distance d) {\n   int ft = feet + d.feet;\n   float\
    \ in = inches + d.inches;\n   if (in >= 12.0) {\n      in -= 12.0;\n      ++ft;\n\
    \   }\n   return Distance(ft, in);\n}\n```"
  merge: -1
