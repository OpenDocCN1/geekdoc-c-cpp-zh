- pgno: 444
  md: "We can instantiate Stack objects as follows:\n\n```\n```cpp\nint main() {\n\
    \    Stack <char> sc(100); // declares an object sc which is a stack\n       \
    \                   // that stores up to 100 character values\n    Stack <int>\
    \ si(200); // declares an object si which is a stack\n                       \
    \  // that stores up to 200 integer values\n    Stack <char*> sp(300); // declares\
    \ an object sp which is a stack\n                           // that stores up\
    \ to 300 char* values\n    Stack <string> ss(400); // declares an object ss which\
    \ is a stack\n                            // that stores up to 400 String values\n\
    \    return 0;\n}\n```\n```\n\nExcept for the special syntax of its name, Stack\
    \ <char> works exactly as if\nchar had been built into the definition. This is\
    \ the same for the instantiations of\nall the Stack objects. Note that this mechanism\
    \ saves our rewriting class\ndeclarations when the only variation would be type\
    \ declarations.\n\nThe principle motivation for the addition of templates to C++\
    \ is their support for\ngeneral-purpose collection classes. Not only can stacks\
    \ of integers and\ncharacters be created, but stacks of floats, stacks of strings,\
    \ etc, can be created.\nWe can create stacks of any user-defined type!\n\n```\n\
    ```cpp\n// Record Class Example - record1.cpp\n\nclass String { };\n\ntemplate\
    \ <class K, class D>\nclass Record {\n    private:\n        K key;\n        D\
    \ data;\n    public:\n        Record() { }\n        Record(K kx, D dx) {\n   \
    \         key = kx;\n            data = dx;\n        }\n        K getkey() { return\
    \ key; }\n        D getdata() { return data; }\n};\n```\n```"
