- pgno: 365
  md: '# Inheritance Lab (String Class)


    One of the most popular classes to define in C++ is the one that emulates a string
    literal in C. The reason is that a string is not a built-in type in C, and yet
    it is used all the time. Thus, to perform the various manipulations on strings,
    you must call upon functions in the library string.h that perform operations such
    as copy, duplicate, compare, etc. In C++, this need is obviated by the use of
    function and operator overloading. In order to represent the state of a String
    object, you will use two data members:


    +   - the length, length, of the string as an int

    +   - a pointer, buf, to the string literal of type char*


    A pointer to a character (char*) is used instead of a fixed-length character array
    so that memory can be allocated at run-time (via the operator new) and, therefore,
    have no restrictions placed upon the length of the string (too big or too small).
    The length field is not strictly mandatory since it can always be obtained from
    the string pointer via the strlen() function. However, it''s probably a good idea
    to have it to avoid repeated calls to strlen().


    # Overloaded Constructor Functions


    The creation of each String instance involves allocation of space on the heap,
    copying the string literal, and setting the length data member accordingly. Because
    there are many different ways in which a String object can be initialized, the
    constructor functions for the String class must be overloaded to accommodate all
    of the various situations.


    First, if a String object is created with no explicit initialization, then the
    default constructor (the one that can be called with no actual arguments) will
    be called. It makes sense that we should have the invoking instance point to an
    empty string literal whose length is zero.


    ```

    String();

    ```'
