    \ 'A');\n    Record <int, String> r3;\n    return 0;\n}\n```\n\nRemember, members\
    \ defined outside the template class definition need to be templates themselves.\
    \ Class scope identifiers must contain template arguments:\n\n```\ntemplate <class\
    \ K, class D>\nRecord<K, D>::Record(K kx, D dx) {\n    key = kx;\n    data = dx;\n\
    }\n\n// record2.cpp\nclass String {};\n\ntemplate <class K, class D>\nclass Record\
    \ {\nprivate:\n    K key;\n    D data;\npublic:\n    Record() {}\n    Record(K\
    \ kx, D dx);\n    K getkey() { return key; }\n    D getdata() { return data; }\n\
    };\n\ntemplate <class K, class D>\nRecord<K, D>::Record(K kx, D dx) {\n    key\
    \ = kx;\n    data = dx;\n}\n\nint main() {\n    Record <int, float> r1;\n    Record\
    \ <long, char> r2(50000, 'A');\n    Record <int, String> r3;\n    return 0;\n\
    }\n```"
