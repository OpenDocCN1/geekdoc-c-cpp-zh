- pgno: 175
  md: '# Function Overloading


    Suppose you want to create a `print()` function and you want to give it various
    types of arguments:


    ```

    char, char*, int, double

    ```


    In C, you might come up with something like this:


    ```

    void print(int);

    void printChar(char);

    void printString(char*);

    void printDouble(double);

    ```


    Although it''s the same concept, printing, you must create a different name for
    each implementation of the concept. Not only must you create these names, you
    must explain them to the user of your library.


    Now suppose the user has mastered this group of print functions and then decides
    to use another library that has a way to print an `Elevator` object:


    ```

    void print(struct Elevator);

    ```


    If the function declarations are all made in the same file, the C compiler will
    give an error message about a type mismatch in the redeclaration of `print()`.
    If the colliding declarations are not made in the same file, the C compiler will
    not catch the error. However, the linker will detect a multiple definition error.


    To solve the problem of name collisions between libraries in C, library authors
    must not only create function with different names to differentiate the type of
    arguments, but libraries must also be differentiated from one another:


    ```

    void abcLibPrint(int);

    void abcLibPrintChar(char);

    void abcLibPrintString(char*);

    void abcLibPrintDouble(double);

    void defLibPrint(struct Elevator);

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'In C++, multiple functions may have the same name as long as all the functions
    have distinct argument lists. In this way, the same abstract operation can be
    implemented on different argument types without concocting artificial names to
    differentiate the functions. In C++ we can therefore create the following functions:


    ```

    void print(int);

    void print(char);

    void print(char*);

    void print(double);

    void print(struct Elevator);

    ```


    The functions are overloaded, because, though named the same, they perform multiple
    jobs. The function name is overloaded because it can be interpreted in more than
    one way. The concept of printing is the same for all the functions, but its use
    is different!


    *Overloaded functions must have a different number of arguments or different types
    of arguments, or both.*


    ```

    void print(int);

    void print(int, int);

    void print(int, float);

    ```


    Note that each of the functions must have different argument lists, even if the
    difference is just in the ordering of the lists:


    ```

    void print(float, char*);

    void print(char*, float);

    ```


    Overloaded function can have any return value, but two overloaded functions cannot
    differ by only their return value:


    ```

    void print(float);      // invalid

    int print(float);       // invalid

    ```'
