  md: '# Dynamic Memory Allocation


    Like the `malloc()` function in C, the C++ keyword `new` is used to allocate contiguous
    memory at execution time. In its simplest form, we use the keyword `new` followed
    by whatever type of data you want to allocate.


    ```

    char *p = new char; // allocates a single char

    int *p = new int; // allocates an int

    double *p = new double; // allocates a single double

    ```


    Unlike `malloc()`, you no longer need to use the `sizeof` keyword to specify the
    exact number of bytes needed. Instead, you merely specify a particular type, either
    fundamental or user-defined. The fact that different types occupy different amounts
    of storage is handled automatically by the compiler.


    When allocating an object of type T with the `new` operator, a first argument
    of `sizeof(T)` is automatically supplied to this function. If `operator new()`
    cannot allocate the requested amount of heap space, it returns a pointer whose
    value is zero. If `operator new()` successfully allocates storage on the heap,
    then it returns the address of this space which is converted to a pointer to the
    type being allocated.


    Because it''s so important to be able to initialize variables and objects in C++,
    fundamental types allocated from the heap via `new` can be initialized with some
    value by enclosing the value within parentheses immediately after the type name.


    ```

    char *p = new char (''A''); // allocates a single char

    int *p = new int(65); // allocates an int

    double *p = new double(5.2); // allocates a single double

    ```


    # Memory Allocation for an Array of a Fundamental Type


    To allocate memory for an array of some fundamental type, we use the keyword `new`,
    the type name, and the number of array elements enclosed within square brackets.
    This number can be either a constant or some expression whose value'
