- pgno: 223
  md: '# # Reference Variables


    We know how to create pointers as aliases that address other variables:


    ```

    ```cpp

    int num = 5;

    int *p = &num;

    ```

    ```


    declares an int variable num initialized to 5 and an int pointer p to the address
    of num.


    ```

    ```cpp

    cout << num << *p << endl; // 5 5

    ```

    ```


    To use a pointer''s addressed value requires dereferencing the pointer leading
    to many asterisks that could confuse code. C++ offers an alternative to pointer
    aliases called references. There are three main uses for references:


    +   * as variables

    +   * as function parameters

    +   * as function results


    # ## Reference Variables


    A reference variable in C++ is simply an alias for another variable. An alias
    is just another name for another variable. This means that whenever an alias is
    used, the action is really taking place on the variable to which the alias refers.


    For example:


    ```

    ```cpp

    int num = 5;

    int& val = num;

    ```

    ```


    This sets up a reference variable val and assigns it to the existing variable
    num. We say that val is a reference to an int. A reference variable contains the
    address of another variable, like a pointer. So val has the address of num.


    At this point, the referenced location has two names associated with it: num and
    val.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '```

    cout << num << val << endl; // 5 5

    ```


    Because both variables point to the same location in memory, they are in fact
    the same variable and therefore output the same value. Note that unlike pointers,
    reference variables are automatically dereferenced when they are used. There is
    therefore no need for the asterisk *.


    ```

    ++num;

    cout << num << val << endl; // 6 6

    +val;

    cout << num << val << endl; // 7 7

    ```


    Any assignment made to num is reflected through val and any assignment made to
    val is reflected through num. Any operation on val has precisely the same effect
    as an operation on num.


    ```

    int z = 100;

    val = z;

    cout << num << val << endl; // 100 100

    ```


    This does not cause val to refer to z since the compiler always dereferences the
    address for you. The above code will copy the value of z into num.


    Note: Once a reference variable is initialized to some existing value, it cannot
    be changed or reassigned to some other variables as long as the reference variable
    remains in scope. However, the value the reference variable points to can always
    change.


    # Rule of References


    When a reference variable is created, it must always be initialized with the name
    of some other existing variable. That means that references must be initialized
    in their declarations:


    ```

    int& iref; // error

    ```'
