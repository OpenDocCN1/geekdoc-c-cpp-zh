  md: "Note that only one explicit argument is needed because the `this` pointer is\
    \ provided.\n\n# Another String Example\n\nSuppose we have a `String` class that\
    \ represents strings of different lengths and we wish to provide bounds-checking\
    \ for array subscripting operations on the strings.\n\nIn our example, we'll support\
    \ strings that are statically allocated and can hold a maximum of 255 characters:\n\
    \n```\n#include <iostream>\nusing namespace std;\nconst int SIZE = 255;\nint main()\
    \ {\n    String255 a(10);\n    char c;\n    a[5] = 17;       // a.operator[](5)\
    \ = 17;\n    c = a[7];        // c = a.operator[](7);\n    c = a[26];       //\
    \ c = a.operator[](26); error\n    return 0;\n}\nclass String255 {\n    private:\n\
    \        char buf[SIZE];      // maximum size\n        int size;            //\
    \ actual size\n    public:\n        String255(int num) { size = num; }\n     \
    \   char& operator[](int i);\n};\nchar& String255::operator[](int i) {\n    if\
    \ (i < 0 || i >= SIZE) {\n        cout << \"subscript out of bounds\" << endl;\n\
    \        exit(1);\n    }\n    else\n        return buf[i];       // the normal\
    \ [] operator used here\n}\n```"
