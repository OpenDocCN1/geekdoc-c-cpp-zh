    ,\" << p.yPos() << endl;\n    p.move(1, 1);\n    cout << p.xPos() << \",\" <<\
    \ p.yPos() << endl;\n}\n```\n\nWe've declared p to be a constant Point object.\
    \ However, the compiler will complain that we are calling the move() function.\
    \ Why? Because p was declared as a constant and therefore cannot be modified!\n\
    \nBut the compiler will also complain that we are calling the Point member functions\
    \ xPos() and yPos(). Why? Since xPos() and yPos() don't actually change any numbers,\
    \ we should be able to use them. Unfortunately the compiler won't let us. The\
    \ compiler can't tell if the functions might be modifying the members x and y\
    \ of object p which would be illegal since p is a constant.\n\nHow can we get\
    \ around this problem? We can declare xPos() and yPos() to be constant member\
    \ functions. A member function is declared constant by attaching the keyword const\
    \ after the function arguments, but before the function body:\n\n```\nclass Point\
    \ {\nprivate:\n    int x, y;\npublic:\n    Point(int a, int b)    { x = a; y =\
    \ b; }\n    int xPos() const       { return x; }\n    int yPos() const       {\
    \ return y; }\n    void move(int dx, int dy) { x += dx; y += dy; }\n};\n```\n\n\
    By placing the const keyword before a function body, we are stating that this\
    \ function is guaranteed not to modify any data members of the class. The compiler\
    \ will then allow us to call the function even if the function is for an object\
    \ declared as a constant. The only member functions that can be called from a\
    \ constant object are constant member functions. Therefore, p.xPos() and p.yPos()\
    \ can be called, but not p.move()."
