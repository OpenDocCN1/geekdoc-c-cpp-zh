    \ * 2 = 106\n\nIn C++, const has all the benefits of using the preprocessor. There\
    \ is no situation where it is better to use #define for variable substitution.\
    \ You always get much better benefits from using const.\n\n# const Variables\n\
    \nActually, the const identifier is a C++ innovation adopted by ANSI C. Declaring\
    \ a variable to be a const in effect makes the variable read-only. It may be assigned\
    \ an initial value, but other statements cannot change it."
