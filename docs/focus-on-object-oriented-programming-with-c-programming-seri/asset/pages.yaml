- pgno: 308
  md: "# Here's the Fix\n\nWe must check for assigning something to itself as a special\
    \ case and do nothing at all if the check succeeds:\n\n```\nAlpha& Alpha::operator=(const\
    \ Alpha& a) {\n    if (this != &a) { // or if (*this != a)\n        delete []\
    \ buf;\n        buf = new char[strlen(a.buf) + 1];\n        strcpy(buf, a.buf);\n\
    \        i = a.i;\n        d = a.d;\n        return *this;\n    }\n}\n```\n\n\
    The if statement compares the this pointer to the address of the a reference parameter.\
    \ It then catches an accidental assignment of the same object to itself. Similar\
    \ precautions are not necessary for copy constructors. Why not?\n\nNote that we\
    \ cannot declare operator=() outside of a class. It must be declared as a member\
    \ function and cannot be a friend function.\n\n# Copying of Objects\n\nSo in order\
    \ to control copying of objects of a class X, it is generally necessary to define\
    \ 4 things:\n\n+   * a default constructor X::X() to establish a default value\
    \ for X objects\n+   * a copy constructor X::X(const X&) to control initialization\
    \ and argument passing and return\n+   * a destructor X::~X()\n+   * the overloaded\
    \ assignment operator, X& X::operator=(const X&)\n\nNote that the argument to\
    \ the assignment operator is an X& and not an X. This is to forestall copying\
    \ the object again on its way to being assigned."
