  md: "# One Argument Constructor\n\nLet's now modify the `Counter` class to allow\
    \ us to initialize its value to anything we want:\n\n```\n#include <iostream>\n\
    using namespace std;\nclass Counter {\nprivate:\n    int count;\npublic:\n   \
    \ Counter(int num) { count = num; }\n    void incCount() { ++count; }\n    int\
    \ getCount() { return count; }\n};\nint main() {\n    Counter c1(10);\n    c1.incCount();\n\
    \    cout << c1.getCount() << endl;\n    // Note that c1(10); is not a call to\
    \ a function named c1().\n    // Instead it calls the constructor Counter() with\
    \ the\n    // specified arguments.\n    Counter c2 = 20;\n    c2.incCount();\n\
    \    cout << c2.getCount() << endl;\n    // Here is another way for constructor\
    \ to be called.\n    // If a constructor has a single argument, one-arg constructor,\n\
    \    // we don't have to use the function call syntax. We can use the\n    //\
    \ = operator for initialization.\n    Counter c3 = Counter(30);\n    c3.incCount();\n\
    \    cout << c3.getCount() << endl;\n    return 0;\n}\n```\n\nOutput:\n11\n21\n\
    31\n\nIn this last example, the constructor is called explicitly and initializes\
    \ c3. Although you can't specify a return value, a constructor, in a sense, does\
    \ have one. It returns a reference to the object being created."
