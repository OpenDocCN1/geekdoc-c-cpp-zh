  md: "# Virtual Destructors\n\nDestructors can be virtual, as well as member functions,\
    \ but not constructors. A virtual destructor is typically used when one class\
    \ needs to delete objects of a derived class that are addressed by pointers to\
    \ a base class.\n\nExample without using virtual destructors:\n\n```\n// vdtor1.cpp\n\
    \n#include <iostream>\n#include <string.h>\n\nusing namespace std;\n\nclass Base\
    \ {\n  private:\n    char *buf1;\n\n  public:\n    Base(const char * s) {\n  \
    \    cout << \"Base 1 arg constructor\" << endl;\n      buf1 = new char[strlen(s)\
    \ + 1];\n      strcpy(buf1, s);\n    }\n\n    ~Base() {\n      cout << \"Base\
    \ destructor\" << endl;\n      delete [] buf1;\n    }\n};\n\nclass Derived : public\
    \ Base {\n  private:\n    char *buf2;\n\n  public:\n    Derived(const char *s1,\
    \ const char *s2) : Base(s1) {\n      cout << \"Derived 2 arg constructor \" <<\
    \ endl;\n      buf2 = new char[strlen(s2) + 1];\n      strcpy(buf2, s2);\n   \
    \ }\n\n    ~Derived() {\n      cout << \"Derived destructor\" << endl;\n     \
    \ delete [] buf2;\n    }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 407
  md: "```\nint main() {\n    Base *pbase = new Derived(\"Haley\", \"Laurel\");\n\
    \    delete pbase;\n    return 0;\n}\n```\n\nThe Base class constructor allocates\
    \ storage for a string and stores the new string in buf1. The Base class destructor\
    \ is set up to delete this storage and return it to the heap when an object of\
    \ type base goes out of scope.\n\nLikewise, the Derived class constructor calls\
    \ the Base class constructor, passing one string to the Base class and then allocates\
    \ storage for a string and stores the new string in buf2. The Derived class destructor\
    \ is also set up to delete this storage and return it to the heap when an object\
    \ of type Derived goes out of scope. When a Derived object goes out of scope it's\
    \ important that both strings be deleted.\n\nSuppose you declare a pointer to\
    \ Base but assign it the address of a Derived object. That's OK since a Base class\
    \ pointer may address an object of that class or of any Derived class. This is\
    \ shown below:\n\n```\nint main() {\n    Base* pBase = new Derived (\"Haley\"\
    , \"Laurel\");\n    delete pBase;\n    return 0;\n}\noutput:\nBase destructor\n\
    ```\n\nNote that the Derived destructor is not called! Why? Because pBase is a\
    \ pointer to the Base class and therefore the Base class destructor is linked\
    \ to the call, i.e., only Base class destructor is available at compile time.\
    \ This is static binding."
