  md: "# Scope Resolution Operator\n\nThe scope resolution operator ( :: ) is a new\
    \ C++ operator and has the highest precedence of any operator. It's used for differentiating\
    \ a local variable from a global variable. For example:\n\n```\nint a = 1    \
    \             // external\n\nvoid foo() {\n    int a = 2;            // OK, but\
    \ hides external a\n    int b = a;            // b initialized to 2\n    int c\
    \ = ::a;          // c initialized to 1 (accesses external a\n               \
    \           // this is unavailable in C)\n    {                     // opens block\n\
    \        int a = 3;        // hides a local to foo()\n        int d = ::a;   \
    \   // is d initialized to 3 or 2 or 1??\n                          // answer\
    \ is 1\n                          // the outer local a is inaccessible\n    }\
    \                     // doesn't go one scope up, but to the top\n}\n```\n\nSo\
    \ the unary form of the scope resolution operator is used to uncover or access\
    \ a name that is at external scope and has been hidden by local or class scope.\
    \ The scope resolution operator also has a binary form that is used to disambiguate\
    \ names that are reused within classes. Its use is vital with inheritance.\n\n\
    ```\nClass Widgets {\n    public:\n        void foo();\n};\n\nclass Gizmos {\n\
    \    public:\n        void foo();\n};\n\nvoid Widgets::foo() {\n    -----\n}\n\
    \nvoid Gizmos::foo() {\n    -----\n}\n```"
  merge: -1
