- pgno: 319
  md: '# Derivation


    C++ implements inheritance through the mechanism of derivation. A derived class
    is derived from a base class and inherits all the data members and member functions
    of the base class.


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_319_0.png)


    +   Many classes might be derived from a single base class.


    +   A derived class may itself be a base class from which additional classes are
    derived.


    Thus, we can build up a class hierarchy where each class can serve as a parent
    or root for a new set of classes.'
  merge: -1
