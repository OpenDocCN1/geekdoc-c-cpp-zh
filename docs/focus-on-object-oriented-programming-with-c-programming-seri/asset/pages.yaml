  md: "# Constructor Initializer List\n\nOne of the easiest ways to improve a C++\
    \ program's efficiency is to specify an appropriate base class constructor function\
    \ in the colon list of a derived class constructor function. What happens without\
    \ a constructor initialization list?\n\n+   To initialize an object of a particular\
    \ class, your program calls the appropriate constructor for that class.\n\n+ \
    \  To initialize a derived class's base object, your program implicitly calls\
    \ the appropriate base class constructor function.\n\nUnfortunately, that implicit\
    \ call to the base class constructor function makes it easy to initialize the\
    \ base class's data members twice! See the example below:\n\n```\n// shape1.cpp\n\
    \n#include <iostream>\n\nuses namespace std;\n\nclass Shape {\n  private:\n  \
    \  int color;\n    int sideCount;\n  public:\n    Shape() {\n      cout << \"\
    Shape default constructor\" << endl;\n      SetColor(0);\n      SetSideCount(0);\n\
    \    }\n    Shape(int c, int sc) {\n      cout << \"Shape 2 arg constructor\"\
    \ << endl;\n      SetColor(c);\n      SetSideCount(sc);\n    }\n\n    void display()\
    \ {\n      cout << \"color = \" << color << endl;\n      cout << \"sides = \"\
    \ << sideCount << endl;\n    }\n\n    void SetColor(int c) {\n      cout << \"\
    set color to \" << c << endl;\n      color = c;\n    }\n\n    void SetSideCount(int\
    \ sc) {\n      cout << \"set side count to \" << sc << endl;\n      sideCount\
    \ = sc;\n    }\n};\n```"
  merge: -1
  img_proc: true
