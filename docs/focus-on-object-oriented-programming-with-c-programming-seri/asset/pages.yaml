- pgno: 119
  md: 'Note that you can only have one destructor per class and the destructor has
    no return value. Destructors have no arguments because it''s assumed that there''s
    only one way to destroy an object. Therefore destructors cannot be overloaded.


    The destructor is automatically called when an object goes out of scope or is
    deleted. Like the constructor, the destructor calls are not made by you but by
    the compiler.


    The destructor in the `Elevator` class will cause both elevators to move to the
    ground floor when the program shuts down.


    Actually, the most common use of destructors is to deallocate memory that was
    allocated for the object by the constructor.


    So with constructors and destructors, we can create objects with proper initialization
    and destroy them with proper cleanup. That means we can avoid a whole class of
    errors.


    # String Class Example


    There are some problems with strings as normally used in C and C++. For one thing,
    we can''t use this perfectly reasonable looking expression to assign one string
    to another:


    ```

    s1 = s2;

    ```


    On the other hand, if we define our own string type, using a C++ class, we can
    use just such assignment statements. In fact, many other string operations can
    be simplified as well, but we''ll have to wait until we''ve learned about overloaded
    operators.


    For a vision of possibilities, we''ll create a `String` class, one with limited
    functionality.'
