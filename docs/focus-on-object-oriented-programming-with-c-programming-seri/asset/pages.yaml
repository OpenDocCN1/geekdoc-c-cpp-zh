    # Do classes waste memory?


    We have probably given the impression that each object created from a class contains
    separate copies of that class''s data and member functions. This might be a good
    first guess, since it emphasizes that objects are complete self-contained entities
    designed using the class specifier.


    However, things are not quite so simple. It''s true that each object has its own
    separate data items. But all objects in a given class use the same member functions
    which are created and placed in memory only once when they are defined by the
    class specifier.


    The data items, on the other hand, will hold different values. So there must be
    a separate instance of each member data in each object. Space for data is therefore
    created in memory when each object is instantiated or defined.'
