  md: "```\n```cpp\n// word6drv.cpp\n#include <iostream>\n#include \"word6.h\"\n\n\
    using namespace std;\n\nint main() {\n    Word w1(\"Red\");\n    cout << w1.getCount()\
    \ << endl;\n    return 0;\n}\n\n// word6 output\n1\n```\n```\n\nHowever, when\
    \ you call getCount(), you must then call it for an object, i.e., send a getCount()\
    \ message to a particular object and this, the address of the object, will be\
    \ secretly passed to the member function.\n\nWhile the extra overhead of the this\
    \ pointer may not be a problem, there are some cases where the reduction in the\
    \ efficiency is unacceptable. This is true not only for functions which only access\
    \ static data members, but for any action which acts for the class as a whole\
    \ and doesn't need to access members of a particular object.\n\nWe can eliminate\
    \ the extra overhead of passing in the this pointer by making the getCount() function\
    \ a friend function:\n\n```\n```cpp\n// word7.h\n\n#ifndef _WORD7_H\n#define _WORD7_H\n\
    \nclass Word {\n    private:\n        char *buf;\n        static int wordCount;\n\
    \    public:\n        Word(char *s);\n        friend int getCount();\n};\n\n#endif\n\
    ```\n```"
