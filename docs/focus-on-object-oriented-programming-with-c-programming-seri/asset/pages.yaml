  md: "```\n```cpp\n// hide2.cpp\nclass Base {\npublic:\n    void foo(char *ptr) {\
    \ cout << ptr; }\n};\nclass Derived : public Base {\npublic:\n    void foo(double\
    \ n) { cout << '\\n' }\n};\nint main() {\n    Derived d;\n    d.foo(\"A\");  \
    \      // error - cannot convert char * to double\n    d.Base::foo(\"A\");  //\
    \ ok\n    return 0;\n}\n```\n```\n\n# Compiler Lookup Rules\n\nUsing derived instances\
    \ to access member functions without the base class name and scope resolution\
    \ operator, the compiler resolves the address by asking:\n\n+   • Does the member\
    \ function have scope in the derived class? If so, use it. If not, generate a\
    \ compilation error.\n\n+   • Does the member function have scope in the parent\
    \ class? If so, use it. If not, generate a compilation error.\n\n+   • Does the\
    \ member function have scope higher up in the hierarchy? If so, use it. If not,\
    \ generate a compilation error.\n\nNote that functions with the same name at file\
    \ scope are not considered.\n\nSimilarly, a function in a derived class resolves\
    \ the address of a data member by asking:\n\n+   • Does the data member have scope\
    \ in the function class itself? If so, use it. If not, generate a compilation\
    \ error.\n\n+   • Does the data member have derived class scope? If so, use it.\
    \ If not, generate a compilation error."
