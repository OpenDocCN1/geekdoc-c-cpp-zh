    ```

    * (bptr->vptr) [1] ();

    ```


    We can interpret this statement as follows:


    +   * vptr is a pointer in the Derived object that points to the Derived class''s
    virtual table


    +   * bptr->vptr is the address of the Derived class''s virtual table


    +   * (bptr->vptr) [1] is the second entry in the Derived class''s virtual table
    which contains the address of the virtual function Derived::faa().


    +   * * (bptr->vptr) [1] () dereferences the pointer to the function and invokes
    the function Derived::faa().'
