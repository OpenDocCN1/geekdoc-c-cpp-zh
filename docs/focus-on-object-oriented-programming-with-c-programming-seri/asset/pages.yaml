- pgno: 404
  md: "The code below shows the declarations of the `Portal` abstract base class,\
    \ along with the `Window` and `Door` derived classes:\n\n```\n// portal.cpp\n\n\
    class Portal {\npublic:\n    enum portalState {opened, closed, locked};\n\nprivate:\n\
    \    portalState state;\n    int xPos, yPos, width, height;\n\npublic:\n    virtual\
    \ void open() = 0;\n    virtual void close() = 0;\n    virtual void lock() = 0;\n\
    \    void getState() const;\n    void getXpos() const;\n    void getYpos() const;\n\
    \    int getHeight() const;\n    int getWidth() const;\n};\n\nclass Window : public\
    \ Portal {\npublic:\n    virtual void open();\n    virtual void close();\n   \
    \ virtual void lock();\n};\n\nclass Door : public Portal {\npublic:\n    virtual\
    \ void open();\n    virtual void close();\n    virtual void lock();\n};\n```\n\
    \nNotice how this allows `Window` and `Door` objects to be stereotyped. They can\
    \ both be referred to as `Portals`. While this is an incomplete description of\
    \ both objects, it is nonetheless accurate and useful.\n\nThis ability to stereotype\
    \ an object is a powerful design tool. It allows us to bundle all the common aspects\
    \ of a set of objects together into an abstract class. That's why we say: “An\
    \ abstract class provides a common public interface for the entire class hierarchy.”"
  merge: -1
  img_proc: true
- pgno: 405
  md: "The efficiency that we gained is obvious.\n\n+   - Several of the Portal functions\
    \ can be reused\n+   - The declarations for Window and Door are terse and understandable\
    \ in terms of the functionality of Portal\n+   - Both Window and Door can be stereotyped\
    \ as a Portal when convenient.\n\nFor example:\n\n```\nfor (i = 0; i < max; ++i)\n\
    \    portallist[i] -> open();\n```\n\nClearly this method for opening all Windows\
    \ and Doors is superior to handling each type separately. As the application matures,\
    \ more types of Portals will probably be added. But since the code deals with\
    \ all types of Portals, it will not have to change. Thus, the polymorphic behavior\
    \ of the abstract class Portal provides a more maintainable and robust design!\n\
    \nNote that forcing Window and Door to inherit from Portal is not necessary to\
    \ the proper functioning of the application. The application could be designed\
    \ without the abstract class. However, creating the abstract Portal class results\
    \ in a superior design that promotes polymorphism and code reuse."
