    # Derived Class Constructors


    There''s a potential glitch in our program. What if we want to initialize a CountDn
    object to a value? Can the one-arg constructor in Counter be used? No it cannot!


    Although the compiler will substitute a default constructor from the base class,
    it draws the line at more complex constructors. Therefore we must write a new
    set of constructors for the derived class:


    ```

    class CountDn : public Counter {

    public:

    CountDn() : Counter() {}

    CountDn(int c) : Counter(c) {}

    CountDn operator--() {

    --count;

    return *this;

    }

    };


    int main() {

    CountDn c1, c2(100);

    return 0;

    }

    ```


    Here,


    ```

    CountDn() : Counter() {}

    ```


    causes the CountDn default constructor to call the Counter default constructor
    in the base class and


    ```

    CountDn(int c) : Counter(c)

    ```


    causes the CountDn one-arg constructor to call the Counter one-arg constructor
    in the base class.'
