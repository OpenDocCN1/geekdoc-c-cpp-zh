  md: "# Overloading the Insertion << and Extraction >> Operators\n\nNormally, input\
    \ and output streams handle only simple data types (int, long, float, double,\
    \ char*, etc). By overloading the iostream input and output stream operators (>>,\
    \ <<) you can easily add your own classes to the data types that I/O stream statements\
    \ are designed to use.\n\nFor example, we can treat I/O for user-defined data\
    \ types in the same way as built-in data types. This is a powerful feature of\
    \ C++. It lets you say:\n\n```\nMyClass foo;\n------ cout << foo;\n```\n\nThe\
    \ operator<<() function has already been overloaded for the iostream class, but\
    \ you can easily overload it for your new class. Let's overload the insertion\
    \ and extraction operators for the Distance class.\n\n```\nclass Distance {\n\
    private:\n    int feet;\n    float inches;\npublic:\n    Distance() { feet = 0;\
    \ inches = 0; }\n    Distance(int ft, float in) {\n        feet = ft;\n      \
    \  inches = in;\n    }\n    friend istream& operator>>(istream& is, Distance&\
    \ d);\n    friend ostream& operator<<(ostream& os, const Distance& d);\n};\n\n\
    istream& operator>>(istream& is, Distance& d) {\n    cout << \"Enter feet: \"\
    ; is >> d.feet;\n    cout << \"Enter inches: \"; is >> d.inches;\n    return is;\n\
    }\n\nostream& operator<<(ostream& os, const Distance& d) {\n    os << d.feet <<\
    \ \"\\'\" << d.inches << \"\\'\";\n    return os;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: "```\nint main() {\n    Distance d1, d2;\n    cout << \"Enter two Distance values:\
    \ \";\n    cin >> d1 >> d2;\n    Distance d3(11, 6.25);\n    cout << \"d1 = \"\
    \ << d1 << endl;\n    cout << \"d2 = \" << d2 << endl;\n    cout << \"d3 = \"\
    \ << d3 << endl;\n    return 0;\n}\n```\n\nThis program asks for two distance\
    \ values from the user, and then prints out these values and another value that\
    \ was initialized in the program. Note that arguments are passed by reference\
    \ for efficiency.\n\nThe input and output operators require, respectively, an\
    \ istream and ostream object as their left operand. Both return the object upon\
    \ which they operate. This allows successive input or output operators to be concatenated.\n\
    \nFor example:\n\n```\n((((( cout << \"d1 = \" << d1) << \"d2 = \") << d2) <<\
    \ endl);\n```\n\nHere, each parenthetical sub-expression returns the ostream object\
    \ cout which becomes the left operand of the next outermost expression.\n\nBecause\
    \ the design of iostreams, an overloaded operator<<() or operator>>() function\
    \ must be a friend function and it must take arguments of an istream object (either\
    \ istream or ostream, depending on the operator) followed by an object of your\
    \ user-defined type. The function must return the same stream object as it takes\
    \ as an argument.\n\nNote, it's important that the stream object be passed into\
    \ and out of the function so you can have expressions of the form:\n\n```\ncout\
    \ << obj1 << obj2;\n```\n\nIn effect, each object is passed to the stream and\
    \ then the stream is passed down the line."
