    # Pointers to Base and Derived Class Instances


    As we''ve already seen, pointers to base and derived class instances can be declared
    just like any other type of pointer. In terms of assignment, you can always assign
    a derived class pointer into a base class pointer, because then the base class
    pointer will be pointing (only) to the base class portion of the derived object.


    +   A base class pointer can always point to a base class instance,


    +   A derived class pointer can always point to a derived class instance.


    When a pointer of type Base or Derived class is used to call a member function,
    and the function has been defined in both the base and derived classes, there
    is no ambiguity as to which version of the function will be called. The governing
    factor here is the type of the pointer itself.


    ```

    Class Base {

    public:

    void print() { cout << "Base class print()" << endl; }

    };


    class Derived : public Base {

    public:

    void print() { cout << "Derived class print()" << endl; }

    };


    int main() {

    Base* pBase = new Base; // base class instance and pointer

    Derived* pDerived = new Derived; // derived class instance & pointer


    pBase->print(); // calls Base::print()

    pDerived->print(); // calls Derived::print()

    pDerived->Base::print(); // calls Base::print()

    delete pBase;

    delete pDerived;

    return 0;

    }


    output:

    Base class print

    Derived class print

    Base class print

    ```'
