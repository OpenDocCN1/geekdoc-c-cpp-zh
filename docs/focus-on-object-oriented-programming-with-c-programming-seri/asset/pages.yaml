    \    ...\n    ostream& operator<<(ostream&);\n    ...\n};\n```\n\nThe left operand\
    \ of every member function is an object or pointer to an object of its class.\
    \ This is why the member function instance of the output operator declares only\
    \ the one `ostream` object. A call of this instance takes the following form:\n\
    \n```\nd << cout;\n```\n\nIt would be very confusing both to the programmer and\
    \ the human readers of the program to provide this instance. Therefore it's better\
    \ to use friend functions."
