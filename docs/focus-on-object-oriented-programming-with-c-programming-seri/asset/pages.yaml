  md: "# Capturing Program Output\n\nWhen you submit your computer lab assignments,\
    \ it will be necessary to include a file that contains the output generated by\
    \ your program. While you might be tempted to simply copy and paste the output\
    \ that appears on the screen into a file, often output generated from your programs\
    \ cannot all fit on the screen and usually gets scrolled off the screen. Please\
    \ follow the instructions below to capture the output of your program into a file\
    \ called `csis.txt`:\n\n+   • Include the header file for the `fstream` library\
    \ in all `.cpp` source code that generates output to the file:\n+   \n+   ```\n\
    +   #include <fstream>\n+   ```\n\n+   • Include the following global declaration\
    \ (after `using namespace std;`) to your `.cpp` source code that contains the\
    \ `main()` function:\n+   \n+   ```\n+   ofstream csis;\n+   ```\n\n+   • Include\
    \ the following global declaration (after `using namespace std;`) in all `.cpp`\
    \ source code, other than the file that contains `main()`, that generates output:\n\
    +   \n+   ```\n+   extern ofstream csis;\n+   ```\n\n+   • Add the following statement\
    \ to `main()` after your variable declarations. It will open the `csis.txt` file\
    \ to capture your output.\n+   \n+   ```\n+   csis.open(\"csis.txt\");\n+   ```"
  merge: -1
  img_proc: true
