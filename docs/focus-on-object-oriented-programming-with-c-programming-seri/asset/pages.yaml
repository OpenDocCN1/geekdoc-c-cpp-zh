  md: "# Overloading the Comparison == Operator\n\nWe can also explore the use of\
    \ overloaded relational operators to create a comparison operator == to be used\
    \ with our String class to compare two String objects. The function returns true\
    \ if the String objects are the same and false is they're different.\n\n```\n\
    #include <iostream.h>\n#include <iomanip.h>\n#include <string.h>\n\nconst int\
    \ SIZE = 100;\n\nusing namespace std;\n\nclass String {\n    private:\n      \
    \  char buf[SIZE];\n    public:\n        String() { buf[0] = '\\0'; }\n      \
    \  String(char s[]) { strcpy(buf, s); }\n        void getString() { cin.get(buf,\
    \ SIZE); }\n        void display() { cout << buf; }\n        String operator+(String\
    \ s);\n        int operator==(String s);\n};\n\nString String::operator+(String\
    \ s) {\n    if (strlen(buf) + strlen(s.buf) < SIZE) {\n        String temp;\n\
    \        strcpy(temp.buf, buf);\n        strcat(temp.buf, s.buf);\n        return\
    \ temp;\n    }\n    else\n        return String(); // returns NULL String\n}\n\
    \nint String::operator==(String s) {\n    return !strcmp(buf, s.buf);\n}\n\nint\
    \ main() {\n    String s1, s2 = \"YES\";\n    cout << \"Enter YES / NO: \";\n\
    \    s1.getString();\n    if (s2 == s1)\n        cout << \"You typed YES.\" <<\
    \ endl;\n    return 0;\n}\n```"
