- pgno: 207
  md: "# This Pointer\n\nAt this point you might be wondering how member functions\
    \ are implemented in C++. Consider the following class:\n\n```\nclass Alpha {\n\
    \    private:\n        int a, b, c;\n    public:\n        void foo(int x, int\
    \ y, int z);\n};\n\nint main() {\n    Alpha a1, a2;\n    :\n    :\n}\n```\n\n\
    An ordinary member function is invoked as:\n\n```\na1.foo(i, j, k);\na2.foo(i,\
    \ j, k);\n```\n\nThe code for the member function is kept within the class Alpha.\
    \ When foo() is invoked by object a1, the member function foo() operates on the\
    \ private data of object a1. Likewise, when foo() is invoked by object a2, the\
    \ member function foo() operates on the private data of object a2. How does the\
    \ member function know what object it's dealing with, and which private data to\
    \ manipulate?\n\nLet's explore the invocation of the member function foo():\n\n\
    ```\na1.foo(i, j, k);\n```\n\nHow many arguments are passed to the function? The\
    \ answer may surprise you. It is 7!\n\n+   * The explicit argument list contains\
    \ 3 arguments: i, j, k."
  merge: -1
  img_proc: true
- pgno: 208
  md: "+   • The implicit argument list contains 3 arguments consisting of the member\
    \ data of the object: a, b, c.\n\n+   • There is one additional implicit argument\
    \ called the `this` pointer, which is a pointer to the object from which the member\
    \ function is invoked.\n\nC++ automatically declares a local variable named `this`\
    \ in every (non-static) member function of a class and initializes it to point\
    \ to the instance (or object) of the class to which the member function was applied.\n\
    \nSo the `this` pointer is implicitly passed as a hidden parameter to every non-static\
    \ member function in a class and has the same type as a declared pointer to the\
    \ class. Actually, we'll see that the implicit arguments can be thought of as\
    \ a list of arguments accessible through the `this` pointer.\n\nSo member functions\
    \ of every object have access to the `this` pointer which points to (or contains\
    \ the address of) the object itself. Therefore, any member function can find out\
    \ the address of the object of which it is a member.\n\n```\nclass Alpha {\n \
    \   private:\n        int a, b, c;\n    public:\n        void foo(int x, int y,\
    \ int z);\n        void display() { cout << this; }\n};\nint main() {\n    Alpha\
    \ a1, a2;\n    a1.display();\n    a2.display();\n    :\n}\n```\n\nSo when you\
    \ call a member function, it comes into scope with the value of `this` set to\
    \ the address of the object for which it was called. The `this` pointer can be\
    \ treated like any other pointer to an object, and can thus be used to access\
    \ the data in the object it points to."
  merge: -1
  img_proc: true
- pgno: 209
  md: "```\nclass Alpha {\n    private:\n        int a, b, c;\n    public:\n     \
    \   void foo(int x, int y, int z) {\n            this->a = x;\n            this->b\
    \ = y;\n            this->c = z;\n            cout << this->a << this->b << this->c;\n\
    \        }\n        void display() {\n            cout << this;\n        }\n};\n\
    int main() {\n    Alpha al, a2;\n    al.foo(2, 4, 6);\n    a2.foo(1, 3, 5);\n\
    \    :\n    :\n}\n```\n\nNote that the syntax works but there is no reason for\
    \ it except to show that `this` does indeed point to the object. The `this` pointer\
    \ is actually the reason that we can refer to member data as `a`, `b`, `c` instead\
    \ of `al.a`, `al.b`, `al.c` in our objects. The compiler adds the `this` prefix\
    \ to all member data and functions.\n\nNote the following distinctions:\n\n+ \
    \  - this refers to the address of the object being pointed at\n\n+   - this->memberData\
    \ refers to a member data of the object which called the member function\n\n+\
    \   - *this refers to the actual object and, depending on context, can be an lvalue\
    \ or an rvalue"
  merge: -1
