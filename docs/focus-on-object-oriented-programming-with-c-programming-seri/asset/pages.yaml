- pgno: 297
  md: 'Note that these assignment statements are for illustration purposes only.

    Because the class data members are private, these statements do not compile.

    Memberwise initialization of a new class object occurs in three contexts:


    +   when an object is used to initialize a newly constructed object, i.e., as
    part of a declaration


    +   when passing an object to a function by value


    +   when a function returns a class object


    If any of these actions cause a pointer data member to be duplicated, a serious
    bug might arise!


    Let''s redefine class Alpha to include a pointer data member:


    ```

    #include <string.h>

    class Alpha {

    private:

    char *buf;

    int length;

    public:

    Alpha(); // default constructor

    Alpha(char *); // constructor accepts null-terminated

    // character

    // array and creates an Alpha object from it

    ~Alpha();

    };

    Alpha::Alpha() {

    length = 100;

    buf = new char[length + 1];

    buf[0] = ''\0'';

    }

    Alpha::Alpha(char *s) {

    length = strlen(s);

    buf = new char[length + 1];

    strcpy(buf, s);

    }

    Alpha::~Alpha() {

    delete [] buf;

    }

    ```'
