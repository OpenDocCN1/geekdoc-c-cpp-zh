  md: "compiler writer. This is one step on the path to creating our own data types,\
    \ as we'll see later.\n\n# Destructors\n\nBut we need destructors too because\
    \ once we finish with an object, we might want to do some cleanup.\n\nIf we continue\
    \ with our Elevator class example, cleanup might involve bring all our elevators\
    \ back to floor zero when we shut down the elevator system. That's what a destructor\
    \ can do!\n\nA destructor is represented as a class name with a tilde (~) in front\
    \ of it. The definition of the destructor is just like the other member functions.\
    \ Here's what it looks like:\n\n```\nclass Elevator {\nprivate:\n    int floorSelected;\n\
    \    int floorNumber;\npublic:\n    Elevator() {\n        floorSelected = 0;\n\
    \        floorNumber = 0;\n    }\n    Elevator(int selected, int number) {\n \
    \       floorSelected = selected;\n        floorNumber = number;\n    }\n    ~Elevator()\
    \ {\n        floorSelected = 0;\n        go();\n    }\n    void selectFloor(int\
    \ floor) {\n        floorSelected = floor;\n    }\n    void go() {\n    }\n};\n\
    \nint main() {\n    Elevator a;\n    Elevator b(7, 2);\n    a.selectFloor(7);\n\
    \    a.go();\n    return 0;\n}\n```"
