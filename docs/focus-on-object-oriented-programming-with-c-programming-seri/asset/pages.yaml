  md: "# # Default Arguments\n\nIn C, if a function requires two arguments, both arguments\
    \ must be passed when the function is called. For example, suppose we have a function\
    \ to position the cursor (which has an x and y location on the screen), within\
    \ a window:\n\n```\n```cpp\nvoid move(int a, int b) {\n    int x, y;\n    x =\
    \ a;\n    y = b;\n    :\n}\n```\n```\n\nWhenever you want to position the cursor\
    \ at the home position (0, 0), you would call the move() function and pass it\
    \ the zero values:\n\n```\n```cpp\nmove(0, 0);\n```\n```\n\nBecause it is common\
    \ to reposition the cursor to the home position, which is always (0, 0), C++ allows\
    \ us to provide default argument values as follows:\n\n```\n```cpp\nvoid move(int\
    \ a = 0, int b = 0) {\n    int x, y;\n    x = a;\n    y = b;\n    :\n}\n```\n\
    ```\n\nThis function can be called in 3 ways:\n\n```\n```cpp\nmove(35, 70);  \
    \  // position cursor at (35, 70)\nmove(10);        // position cursor at (10,\
    \ 0)\nmove();          // position cursor at (0, 0)\n```\n```"
