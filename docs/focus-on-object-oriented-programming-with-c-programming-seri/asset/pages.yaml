- pgno: 295
  md: '# Introduction to Assignment & Initialization


    The C++ compiler is always busy on our behalf, doing things we can''t be bothered
    to do. If we take charge, it will defer to our judgment. Otherwise, it will do
    things its own way! Two important examples of this process are the assignment
    operator and the copy constructor.


    We''ve used the assignment operator many times, probably without thinking too
    much about it. For example, suppose `d1` and `d2` are two `Distance` objects.
    Unless you tell the compiler otherwise, the statement:


    ```

    d2 = d1;

    ```


    will cause the compiler to copy the data from `d1`, member-by-member, into `d2`.
    This is the default activation of the assignment operator, `=`.


    We''re also familiar with initializing variables. Initializing an object with
    another object, such as:


    ```

    Distance d2(d1);

    ```


    causes a similar action. The compiler creates a new object, `d2`, and copies the
    data from `d1`, member-by-member, into `d2`. This is the default action of the
    copy constructor.


    Both of these activities are provided, free of charge, by the compiler. If member-by-member
    copying is what you want, you need take no further action. However, if you want
    assignment or initialization to do something more complex, then you can override
    these default functions.'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Memberwise Initialization\n\nWhen an object is used to initialize a new object\
    \ of a class, C++ copies each data member from the existing object to the new\
    \ one. For example, a simple class is shown below with no pointer data members:\n\
    \n```\nclass Alpha {\n    private:\n        int i;\n        double d;\n    public:\n\
    \        Alpha() { i = 0; d = 0.0; }\n        Alpha(int ii, double dd) { i = ii;\
    \ d = dd; }\n};\n```\n\nNote that in practice, Alpha needs other member functions\
    \ to access its private data members i and d, but this example simply illustrates\
    \ how object copying works.\n\nWe can now declare Alpha objects a1 and a2 as follows:\n\
    \n```\nAlpha a1;\nAlpha a2(100, 3.14159);\n```\n\nWe can also use an existing\
    \ Alpha object such as a2 to initialize a new object a3:\n\n```\nAlpha a3(a2);\n\
    ```\n\nThis copies a2 to a3 by performing a memberwise initialization of a2's\
    \ data members. That is, a2's data members are copied one by one to a3's data\
    \ members as though we had written:\n\n```\nAlpha a3;\nA3.i = a2.i;\nA3.d = a2.d;\n\
    ```"
  merge: -1
