  md: "# Overloading Unary Operators\n\nLet's start off by overloading a unary operator.\
    \ Unary operators act on only one operand (++, --, -).\n\nWe'll look at the Counter\
    \ class we previously defined. Objects of that class were incremented by calling\
    \ a member function:\n\n```\nc1.incCount();\n```\n\nThat did the job, but the\
    \ listing would have been more readable if we could have used the increment operator\
    \ ++ and simply said:\n\n```\n++c1;\n```\n\nHere's our newest version of the Counter\
    \ class, rewritten to use an overloaded increment variable:\n\n```\nclass Counter\
    \ {\n   private:\n      int count;\n   public:\n      Counter() { count = 0; }\n\
    \      int getCount() { return count; }\n      void operator++() { ++count; }\n\
    };\n\nint main() {\n   Counter c1, c2;\n   cout << \"c1 = \" << c1.getCount()\
    \ << endl;\n   cout << \"c2 = \" << c2.getCount() << endl;\n   ++c1;\n   ++c2;\n\
    \   cout << \"c1 = \" << c1.getCount() << endl;\n   cout << \"c2 = \" << c2.getCount()\
    \ << endl;\n   return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 245
  md: 'The keyword `operator` is used to overload the `++` operator in the class.
    The overloaded `++` operator function is made up of four components:


    +   - return type: void

    +   - keyword operator: operator

    +   - operator to be overloaded: ++

    +   - argument list in parentheses: ()


    The compiler calls this member function whenever the `++` operator is encountered,
    provided the operand is of type `Counter`.


    Note: as seen before, the compiler distinguishes between overloaded functions
    by the type and number of their arguments. Similarly, the compiler distinguishes
    between overloaded operators by the types of their operands.


    In `main()`, the `++` operator is applied to a specific object as shown. Yet,
    `operator++()` takes no arguments. So what does this operator increment? It increments
    the count data member in the object `c1`, the object which used the operator `++`.
    Since member functions can always access the particular object for which they''ve
    been called, this operator requires no arguments.


    The `operator++()` function has a subtle defect which you''ll see if you to execute
    this statement:


    ```

    c1 = ++c2;

    ```


    The compiler will complain. Why?


    We''ve defined the `++` operator to have a return type of `void` in the `operator++()`
    function. But in the statement:


    ```

    c1 = ++c2;

    ```


    the function is asked to return a value of type `Counter`. The compiler is being
    asked to return whatever value `c2` has after being operated on by the `++` operator,
    and then assign this value to `c1`. So we can''t use our `++` operator to increment
    `Counter` objects in expressions.'
