- pgno: 442
  md: "The `template <class T>` prefix to the otherwise ordinary class declaration\
    \ specifies that a template that requires a type argument is being declared. This\
    \ defines a class template that is a specification of how to make a family of\
    \ related classes. In this case, the vector template specifies how the vector\
    \ classes can be made for individual element types.\n\nVectors of specified types\
    \ can now be defined and used:\n\n```\n```cpp\nint main() {\n    Vector <int>\
    \    v1(100);    // generate a vector of 100 ints\n    Vector <char>   v2(200);\
    \    // generate a vector of 200 chars\n    Vector <char*>  v3(300);    // generate\
    \ a vector of 300 char *\n    Vector <String> v4(400);    // generate a vector\
    \ of 400 objects\n                                // of the String class\n   \
    \ Vector <Distance> v5(500);  // generate a vector of 500 objects\n          \
    \                      // of the Distance class\n\n    return 0;\n}\n```\n```\n\
    \nNote that there is no run-time overhead compared with a class where all types\
    \ involved are specified directly.\n\n# Class Template for the Stack Class\n\n\
    ```\n```cpp\n// stack1.cpp\n\ntemplate <class T>\nclass Stack {\n    private:\n\
    \        int size;\n        int top;\n        T *s;\n    public:\n        Stack(int\
    \ max = 100);\n        ~Stack();\n        void push(T);\n        T pop();\n  \
    \      T Top();\n        int empty();\n        int full();\n        void clear();\n\
    };\n```\n```"
