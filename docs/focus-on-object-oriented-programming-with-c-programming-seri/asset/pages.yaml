- pgno: 134
  md: '# Pointer Traps


    Pointer variables give the programmer great flexibility, but they can lead to
    difficult to find and correct errors in your programs. We will examine the common
    problems and give hints about how to avoid them.


    Let''s assume the following type and variable declarations:


    ```

    int *first = NULL;

    int *second;

    int *third;

    int num = 4;

    ```


    We also assume that the following code has been executed:


    ```

    second = new int;

    *second = 2;

    ```


    # Dereferencing NULL


    It is an error to dereference NULL. This is the safest error to make, since the
    system will usually catch the error at run time.


    ```

    cout << *first << endl;      // Error, first is NULL

    ```


    It is just as much a problem to dereference NULL with the -> operator in the case
    that your type is a pointer to a class or struct. A NULL pointer does not point
    to anything. Dereferencing obtains the thing the pointer points to.


    # Dangling Pointer


    It is an error to dereference a pointer that has not been correctly given a value.
    This error will probably cause an eventual crash, but usually after running incorrectly
    for a while.


    ```

    cout << *third << endl;      // Error, third has no value

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Interestingly, something will be printed most likely. If third happens to have
    a value that looks to the running program like a valid pointer we will get the
    contents of a few memory locations interpreted as an `int`, independently of what
    they actually contain.


    It is far worse to say:


    ```

    ```cpp

    *third = 3; // Serious error - changing a random memory location

    ```

    ```


    A pointer can get a valid value by assigning it `NULL`, or another pointer known
    to be valid. You can assign it the result of calling operator `new`. You can also
    get a valid pointer using the "address of" operator `&`.


    ```

    ```cpp

    third = NULL; // second was valid, so third is also valid

    third = second; // OK, but see Losing Cells, below

    third = new int; // Third points to fixed. *third IS fixed (alias)

    third = &fixed;

    ```

    ```


    # ## Aliasing Problems


    Having more than one name for the same cell can add flexibility to our programs,
    but there are some dangers. For example, after executing:


    ```

    ```cpp

    third = new int;

    ```

    ```


    we will eventually want to execute:


    ```

    ```cpp

    delete third;

    ```

    ```


    to reclaim the storage that `third` occupies. However it is an error to delete
    a cell not allocated with `new`:


    ```

    ```cpp

    third = &fixed;

    delete third; // Error, third does not point to the free store

    ```

    ```'
