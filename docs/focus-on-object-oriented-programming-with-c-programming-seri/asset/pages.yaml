- pgno: 19
  md: 'The 1st and 2nd statements are similar. They initialize the BigInt variables
    a and b with big integer constants written as character strings containing only
    digits so the C++ compiler must be able to convert character strings into BigInts.
    The 4th statement is most complicated. It adds a and b and the integer constant
    300 and stores the result in c. The C++ compiler:


    +   - needs to be able to create a temporary BigInt variable to hold the sum of
    a and b


    +   - must then convert the int constant 300 into a BigInt and add this to the
    temporary variable


    +   - must assign this temporary BigInt variable to c


    The 5th statement is a call to a special kind of function available in C++ known
    as a member function that sends the contents of BigInt variable c to standard
    output.


    Even though the body of main() contains no more statements, the compiler is not
    finished yet. It must also destroy the BigInt variables a, b, and c and any BigInt
    temporary variables it may have created along the way before leaving a function
    such as main().


    # What the C++ Compiler Must Do With BigInts


    +   - create new instances of BigInt variables


    +   - convert character strings and integers to BigInts


    +   - initialize the value of one BigInt with that of another BigInt


    +   - assign the value of one BigInt to another


    +   - add two BigInts together


    +   - print BigInts


    +   - destroy BigInts when they are no longer needed'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Specifications & Implementations


    Where does the C++ compiler obtain this know-how? From the BigInt.h file which
    is included in the first line of the program. This file contains the specification
    of the BigInt ADT.


    Specification - contains the information that programs that use an ADT, the client,
    need to have to be successfully compiled (bigint.h).


    Implementation - another file that contains most of the details of how the ADT
    works (BigInt.cpp).


    In our example, BigInt.c is compiled separately and the object code produced from
    it is linked with the program that uses the ADT. The specification and implementation
    of an ADT are combined with the source code of a client program to produce an
    executable program.


    # Separate Compilation


    We separate the code for an ADT into a specification part and an implementation
    part to hide the implementation details from the client. We can then change the
    implementation details and be confident that the client programs will continue
    to work correctly after they are relinked with the modified object code.


    This is useful when a team of programmers work on a large software project. Once
    they agree on the specification for the ADTs they need, each team member can implement
    one or more of them independently of the rest of the team. A well designed ADT
    also hides its complexity in its implementation, making it as easy as possible
    for clients to use.


    # ADT''s and Programming Languages


    Most other programming languages currently in widespread use make it difficult
    to practice data abstraction well. This is because data abstraction requires special
    language features not available in those languages.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Encapsulation


    While it is possible to hide implementation details in almost any programming
    language, C++ explicitly supports it by providing mechanisms to prevent clients
    from accessing data and operations that are supposed to be hidden.


    The provider of a C++ ADT can specify private data and private operations, so
    that if a client program attempts to use them, the C++ compiler issues an error
    message. This enforcement of the separation between specification and implementation
    is called encapsulation.


    Encapsulation is an extremely important feature because without it we must rely
    on clients to cooperate by observing the separation between the specification
    and the implementation. Experience tells us that this is not practical, particularly
    on large software projects involving more than a few programmers. Somebody inevitably
    forgets the rules or succumbs to the temptation to use an implementation-dependent
    optimization, and the guarantee of being able to change an implementation without
    causing client problems to malfunction is gone.


    # Overview of C++ Support for Data Abstraction


    C++ provides the class declaration for defining ADTs. A C++ class is similar to
    a C struct, but it allows you to associate both variables and functions with the
    name of a data type.


    The variables and functions that belong to a class are called members. You can
    make a member either public or private. Any program can use the public members
    of a class. But only other member functions of the same class can use its private
    members.


    You can practice encapsulation in C++ by declaring classes with all member variables
    private, so that the clients can access or modify them only as permitted by the
    class''s public member functions.


    # Function Name Overloading


    Unlike C, C++ requires you to specify the number any type of all of a functions
    arguments. You can then use the same function name for more than one function
    as long as the number and/or type of the function arguments are distinctive. This
    is called function name overloading. Function name overloading eliminates the
    need to use different function names when you wish to perform the same operation
    on different data types.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Operator Overloading


    Operator overloading enables you to give new meanings to most of the C++ operators
    when you use them on instances of ADTs. Note that we used operator overloading
    to define the meaning of + when applied to BigInts in the C++ example.


    # Constructors


    C++ classes may have two special kinds of member functions: constructors and destructors.
    Constructors create new instances of ADTs (classes) and are responsible for initializing
    them correctly. Since C++ automatically uses a constructor to initialize any instances
    of ADTs required by client programs, this feature eliminates this common programming
    error.


    C++ can also use constructors to automatically perform type conversions. For example,
    if we define a constructor for the BigInt ADT that has an argument of type int,
    C++ will use a constructor automatically whenever it needs to convert a variable
    of type int to a BigInt.


    # Destructors


    Destructors destroy instances of ADTs. We can use destructors together with constructors
    to hide the details of managing storage for ADTs from client programs.'
