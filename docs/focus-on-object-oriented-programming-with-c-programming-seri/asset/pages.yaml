  md: '# Abstract Base Class Example


    Consider two classes, Window and Door:


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_401_0.png)


    At first glance these classes may not seem to have anything to do with each other.
    But both share some interesting common features:


    +   - They are both holes in the wall.

    +   - They both have particular locations and sizes with respect to the wall

    +   - They both may exist in one of 3 states: open, closed, locked

    +   - They can be sent similar messages: open, close, lock


    The code below shows the declarations of the two classes:'
  merge: -1
  img_proc: true
- pgno: 402
  md: "```\n// window.cpp\n\nclass Window {\npublic:\n    enum windowState {opened,\
    \ closed, locked};\nprivate:\n    windowState state;\n    int xPos, yPos, width,\
    \ height;\npublic:\n    void open();\n    void close();\n    void lock();\n  \
    \  void getState() const;\n    void getXPos() const;\n    void getYPos() const;\n\
    \    int getHeight() const;\n    int getWidth() const;\n};\n\nclass Door {\npublic:\n\
    \    enum doorState {opened, closed, locked};\nprivate:\n    doorState state;\n\
    \    int xPos, yPos, width, height;\npublic:\n    void open();\n    void close();\n\
    \    void lock();\n    void getState() const;\n    void getXPos() const;\n   \
    \ void getYPos() const;\n    int getHeight() const;\n    int getWidth() const;\n\
    };\n```\n\nThese two classes are horribly redundant and cry for some form of unification.\
    \ That unification is supplied by creating an abstract base class. We can describe\
    \ both classes as inheriting from a common abstract class, Portal, which contains\
    \ all the common features of their interface."
