- pgno: 116
  md: "In our example, Counter() returns a reference to an object created and is initialized\
    \ with the arguments specified.\n\nObjects created by calling a constructor aren't\
    \ given a name. However, a name is assigned to the object when the assignment\
    \ for c3 executes.\n\n# Overloading Constructors\n\nYou can even have more than\
    \ one constructor for a class. Suppose you wanted to use both the default constructor\
    \ (initializes to 0), along with a constructor that allows you to initialize the\
    \ counter to any value you wish.\n\nIncluding both constructors in the class declaration\
    \ is called overloaded constructors. Overloaded constructors allow us to provide\
    \ several versions of a constructor for a single class. Each constructor can have\
    \ a different number and type of arguments. This is useful for objects that have\
    \ more than one kind of external representation. For example, we might want to\
    \ initialize a Time object using just seconds or we might want to use month, day,\
    \ year, hour, minute, second.\n\n```\n#include <iostream>\n\nusing namespace std;\n\
    \nclass Counter {\n    private:\n        int count;\n    public:\n        Counter()\
    \ { count = 0; }\n        Counter(int num) { count = num; }\n        void incCount()\
    \ { ++count; }\n        int getCount() { return count; }\n};\n\nint main() {\n\
    \    Counter c1;\n    Counter c2(10);\n\n    cout << c1.getCount() << endl;\n\
    \    cout << c2.getCount() << endl;\n    return 0;\n}\n\nOutput:\n0\n10\n```"
  merge: -1
  img_proc: true
