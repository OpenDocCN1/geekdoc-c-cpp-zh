- pgno: 162
  md: '# Pointer to const


    "Prefixing" a declaration of a pointer with `const` makes the object pointed to,
    but not the pointer, a constant.


    ```

    syntax: const <type> *pc;

    ```


    Here, pc points to a constant value of type <type>. For example:


    ```

    const char *pc = "Haley";

    ```


    defines a pointer to a constant, or more specifically, a pointer to a character
    constant, i.e., a pointer to read-only memory. These types of declarations are
    actually better read right to left to get the meaning: pc is a pointer to chars
    that are constant. In other words, pc is a pointer to a constant object of type
    char and therefore the value of the object addressed by pc cannot be modified
    through pc:


    ```

    pc[3] = ''x''; // error

    *pc = ''x''; // error

    ```


    Each of the examples above are invalid because the character that pc addresses
    cannot be changed. But, pc itself is not a constant and therefore pc can be changed
    to address a different variable of type char as seen below:


    ```

    pc = "Samantha"; // ok

    ```


    Here, pc is being changed to address another character.


    Declaring something as a pointer to const is a statement about the pointer, not
    about the space being pointed to. The compiler will not ensure that the data being
    pointed at will not change. It ensures only that it will not change through that
    pointer. The pointed at object can still be changed by some other means. So by
    declaring a pointer to const, you are declaring that the pointer cannot be used
    to change the pointed-at object.'
  merge: -1
  img_proc: true
