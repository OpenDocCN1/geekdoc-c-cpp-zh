    will not change; only the elements will be copied. If the sizes of objects being
    assigned don''t match, an error message should be printed, and the program should
    simulate a halt.


    +   • Two IntArray objects can be compared using the == and != operators. If the
    arrays have the same number of elements and each of the corresponding elements
    match, the objects are equal and the comparison operator (==) should return a
    non-zero value, even if their indices are different. Comparing IntArray objects
    with different number of elements is legal, and the result is always zero. The
    != operator should return zero whenever == would return non-zero, and vice versa.


    +   • Class IntArray should also overload the operators below. An error should
    be generated if the arrays are of a different size.


    | Operator | Description |

    |---|---|

    | [] | - allows index range checking |

    | + | - allows the sum of two arrays to be assigned to a third array |

    | += | - allows the sum of two arrays to be assigned to the first array |

    | << | - allows the contents of an array to be output |


