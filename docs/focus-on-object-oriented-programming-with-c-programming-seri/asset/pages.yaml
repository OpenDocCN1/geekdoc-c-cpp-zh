  md: "Each call to operator << therefore passes on its left argument as its result\
    \ which becomes the left argument of the next call to operator <<.\nThe statement\
    \ is really interpreted as:\n\n```\n(((cout << \"x = \") << x) << \", y = \")\
    \ << y) << endl;\n```\n\nIt's important for operator << to return an ostream&\
    \ so that several uses of it can be chained together. So for it to work, the value\
    \ of cout << x must be a reference to cout!\n\nReferences become even more important\
    \ for input. Without them, it would be impossible for:\n\n```\ncin >> x;\n```\n\
    \nto change the value of x.\n\nFor this reason, the right argument of operator\
    \ >> is always a reference.\n\nUsually the functions we've seen tell us what value\
    \ will be returned. But now, by allowing a function to return a reference, the\
    \ function is allowed to be the target of an assignment, i.e., used as an lvalue\
    \ (on the left-hand side of an = sign).\n\nHere's a trivial example:\n\n```\n\
    int& foo(int &x) {\n    return x;\n}\n```\n\nThis function simply returns a reference\
    \ to its argument. We can now write:\n\n```\nint a;\nfoo(a) = 7;   // sets a to\
