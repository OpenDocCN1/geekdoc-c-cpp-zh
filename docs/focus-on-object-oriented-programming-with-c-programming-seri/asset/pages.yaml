- pgno: 426
  md: '# Introduction to Multiple Inheritance


    So far, derived and base classes have been related by single inheritance. Multiple
    inheritance describes a more complex relationship in which a single class inherits
    the data members and member functions from more than one base class.


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_426_0.png)


    To derive a new class from multiple base classes, we simply list the base class
    names after the new derived class:


    ```

    class D : public A, public B, public C {

    };

    ```


    Here, class D inherits from classes A, B, and C.


    The basic need for multiple inheritance occurs because in C++ it''s possible to
    grow inheritance hierarchies from scratch. This means you may purchase a class
    library from vendor A and one from vendor B, each with its own inheritance tree.
    Because you may want to mix the characteristics of two or more independent class
    hierarchies, you need to be able to inherit from more than one class at a time.


    | Class 1 | + | Class 2 | = | Derived Class 3 |

    |---|---|---|---|---|

    | Boat | + | Plane | = | SeaPlane |

    | Date | + | Time | = | DateTime |

    | Painter | + | Artist | = | PortraitPainter |

    | Text Window | + | Scrollable Window | = | ScrollableTextWindow |'
  merge: -1
  img_proc: true
- pgno: 427
  md: "In multiple inheritance, a derived class receives all the inheritable properties\
    \ from all of the listed base classes. If a name conflict occurs, such as the\
    \ same name appearing in more than one base class (i.e., two base classes declaring\
    \ a member function or data member with the same name), and the name is not overridden\
    \ in a derived class, it's use would be an error, even if members are private\
    \ or have different sets of parameters.\n\nThe fix would be to use the scope resolution\
    \ operator to specify which member you intend to use:\n\n```\nclass A {\npublic:\n\
    \    int a;\n    void foo();\n};\n\nclass B {\nprivate:\n    int a;\n    void\
    \ foo(int);\n};\n\nclass C : public A, public B {\n};\n\nint main() {\n    C myObj;\n\
    \n    myObj.foo();        // error - ambiguous\n    myObj.foo(5);       // error\
    \ - ambiguous\n    myObj.a = 3;        // error - ambiguous\n    myObj.A::foo();\
    \     // OK\n    myObj.A::a = 3;     // OK\n    return 0;\n}\n```"
  merge: -1
