  md: "# Counter Class\n\nPreviously we defined a `Counter` class that included a\
    \ general purpose counter variable, `count`, that could be:\n\n+   - initialized\
    \ to 0 with the default constructor\n+   - initialized to some other value with\
    \ an one-arg constructor\n+   - incremented with the ++ operator\n+   - returned\
    \ with the getCount() operator\n\nThe class is shown below:\n\n```\nclass Counter\
    \ {\n  private:\n    int count;\n  public:\n    Counter() { count = 0; }\n   \
    \ Counter(int c) { count = c; }\n    int getCount() { return count; }\n    Counter\
    \ operator++() {\n      ++count;\n      return *this;\n    }\n};\n```\n\nSuppose\
    \ we've worked long and hard to make the `Counter` class operate just the way\
    \ we want and we're pleased with the results, except for one thing. We really\
    \ need a way to decrement the count. Perhaps we're counting people entering a\
    \ bank and we want to increment the count when they come in and decrement the\
    \ count when they go out. So the count represents the number of people in the\
    \ bank at any moment.\n\nWe could insert a decrement routine directly into the\
    \ source code of the `Counter` class, but there are several reasons why we might\
    \ not want to do this:\n\n+   - The `Counter` class works very well and has undergone\
    \ many hours of testing and debugging. (While this is an exaggeration in this\
    \ case, it might be true in a larger and more complex class.)\n+   - If we start\
    \ fooling around with the source code for `Counter`, the testing process will\
    \ need to be carried out again and we may foul something up and spend hours debugging\
    \ code that worked fine before we modified it."
