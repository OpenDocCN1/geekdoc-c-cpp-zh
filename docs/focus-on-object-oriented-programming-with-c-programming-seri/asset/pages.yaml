- pgno: 190
  md: "```\n// word2.cpp\n\n#include <string.h>\n#include \"word2.h\"\n\nWord::Word(char\
    \ *s) {\n    buf = strdup(s);\n    wordCount++;\n}\n```\n\nThe name wordCount\
    \ is no longer global and the data is protected so only members of the class Word\
    \ can read or modify it. However, it doesn't produce the desired effect because\
    \ storage for wordCount is different for each object. C++ solves these problems\
    \ by adding yet another meaning to the keyword static.\n\nIn C, static has two\
    \ meanings:\n\n+   - When used to define a variable outside all functions, it\
    \ means the variable has internal linkage, i.e., the variable can only be accessed\
    \ within the file in which it is declared. If the same variable is defined as\
    \ static or global within another file, there will be no clash and different storage\
    \ will be reserved for both variables.\n\n+   - The second meaning for static\
    \ in C occurs when it is used to define local variables in a function. A static\
    \ variable is not an automatic or local variable. It is not created on the stack\
    \ but instead in a special static data area. This means that its value is held,\
    \ i.e. static, between calls to the function.\n\nIn C++, a static data member\
    \ inside a class is similar to this second definition. A static data member is\
    \ kept in the static data area and there is only one variable allocated for all\
    \ the objects in a class. Each object in the class shares the same variable. This\
    \ is exactly what we need for class Word:"
  merge: -1
  img_proc: true
- pgno: 191
  md: "```\n// word3.h\n#ifndef WORD3_H\n#define WORD3_H\nclass Word {\nprivate:\n\
    \    char *buf;\n    static int wordCount;\npublic:\n    Word(char *s);\n};\n\
    #endif\n// word3.cpp\n#include <string.h>\n#include \"word3.h\"\nWord::Word(char\
    \ *s) {\n    buf = strdup(s);\n    wordCount++;\n}\n```\n\nSo it's not 100% correct\
    \ to say that each object contains its own separate data. If a data item in a\
    \ class is defined as static, then only one such item in a class is created for\
    \ the entire class, no matter how many objects of the same class must share a\
    \ common item of information. There is only one instance of a static data member\
    \ of a class and it is in scope whenever the class is in scope, i.e., whenever\
    \ the class definition is accessible. So a static data member is a single shared\
    \ variable accessible to all objects of its class. It acts as a global variable\
    \ for its class.\n\nThere are two advantages of a static data member over the\
    \ use of a global variable:\n\n+   Information hiding can be enforced. A static\
    \ member can be made non-public; a global variable cannot.\n\n+   A static member\
    \ is not entered into the program's global name space, thus removing the possibility\
    \ of an accidental conflict of names."
