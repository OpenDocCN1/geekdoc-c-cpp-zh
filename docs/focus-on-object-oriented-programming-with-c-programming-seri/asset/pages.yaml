  md: '# Function Overloading & Default Arguments Homework


    We''ve seen how C++ lets us create functions that can be called in different ways.
    We can create a single function name for a concept, and implement that name in
    many convenient ways. This means we have less to teach the end user, and the code
    is more readable. C++ supports this feature in two ways:


    Function overloading allows us to create more than one function with the same
    name, as long as all the functions have distinct argument lists. Function overloading
    also prevents name clashes when using multiple libraries. Here are some overloaded
    examples of functions:


    ```

    void foo(int);

    void foo(int, char);

    void foo(double);

    ```


    Default arguments are used with a single function when you want some of the arguments
    to be automatically inserted by the compiler instead of writing them all out yourself,
    every time you call the function. Here''s a function with default arguments:


    ```

    int foo(float f, float f2 = 1.1, char x = ''i'');

    ```


    You can declare a function more than once, but you may only give default arguments
    once. Only trailing arguments may be given default values, and once you start
    giving default values, all the rest of the arguments in the list must have defaults.


    1. Name encoding schemes vary from compiler to compiler, and they are up to the
    implementer of the compiler. In addition, encoded names are not intended to be
    used directly by the programmer (which would mean, for instance, that an encoding
    scheme might legitimately be changed by a compiler vendor, which would require
    recompilation of all code but no other changes.) See if you can find out what
    encoded names will be generated by the compiler for the file array5.cpp.'
