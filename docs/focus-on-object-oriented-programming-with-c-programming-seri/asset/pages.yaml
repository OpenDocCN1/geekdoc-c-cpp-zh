    \ able to mimic the C style\n// aggregate initializer: int a[3] = { 1, 2, 3 };\n\
    \nIntArray e(c);        // e is a copy of c\n\nb = a;                // b holds\
    \ copy of a's elements,\n                      // but indices run from -3 to 6\n\
    \nw = a + b;            // sum two arrays into third array\n\nw += a;        \
    \       // sum two arrays into first array\n\na[10] = 1;            // Runtime\
    \ error: illegal index\n                      // Print diagnostic and halt.\n\n\
    b = c;                // Runtime error: lengths different\n                  \
    \    // Print diagnostic and simulate\nhalt.\n\nif (a == d)           // Elements\
    \ compared.\n                      // No run-time error\n    cout << \"TRUE\"\
    \ << endl;   // if lengths don't match. != also\n                      // works.\n\
    else\n    cout << \"FALSE\" << endl;\n}\n```\n\nIt's up to you to define the `IntArray`\
    \ class, but it should fulfill the following requirements:\n\n+   • An `IntArray`\
    \ object may be declared in any of four ways:\n\n+   1) With a single integer\
    \ giving the number of elements, in which case the indices will run from 0 to\
    \ one less than the number of elements.\n\n+   2) With two integers, which will\
    \ be taken as the lower and upper indices. It is an error for the first index\
    \ to be greater than the second index, but having both indices the same specifies\
    \ a valid, single element array.\n\n+   3) With no integers, which creates a ten-element\
    \ array whose indices run from 0 to 9.\n\n+   4) With another object of type `IntArray`.\
    \ The new object will be a copy of the old one, with each entry and the index\
    \ range duplicated."
