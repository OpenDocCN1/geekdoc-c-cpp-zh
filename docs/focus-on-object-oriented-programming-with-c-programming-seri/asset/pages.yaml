- pgno: 307
  md: "```\nAlpha& Alpha::operator=(const Alpha& a) {\n    delete [] buf;\n    buf\
    \ = new char[strlen(a.buf) + 1];\n    strcpy(buf, a.buf);\n    i = a.i;\n    d\
    \ = a.d;\n    return *this;\n}\n```\n\nWe return *this to go along with the usual\
    \ C++ convention that an assignment should return a reference to its left-hand\
    \ side.\n\nHowever, this code has a serious bug. Try and find it before you read\
    \ on.\n\n...\n\nIt fails if you try to assign an object to itself:\n\n```\na =\
    \ a;\n```\n\nTo fix this bug, we need a conditional statement in the code to guard\
    \ against:\n\n```\nString s;\ns = s;\n```\n\nWithout this test, an assignment\
    \ of an Alpha object to itself would delete the data member buf of that Alpha\
    \ object and then try to copy the just-deleted data.\n\nOnce we are sure that\
    \ we are dealing with two different objects, the assignment operator (unlike the\
    \ copy constructor) should release any resources that held the old value. After\
    \ that, the assignment operator usually does the same thing as the copy constructor,\
    \ except that the assignment operator returns a value."
