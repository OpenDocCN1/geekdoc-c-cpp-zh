- pgno: 111
  md: "# Introduction to Constructors and Destructors\n\nThe concept of creating new\
    \ data types and designing new data types is the foundation of C++. What constructors\
    \ do is make sure objects are properly initialized. In C, you're probably used\
    \ to doing that initialization yourself. What that means though is that you actually\
    \ have to remember to do the initializing.\n\nWhen we first looked at types, we\
    \ used an example of an elevator:\n\n```\n```cpp\nclass Elevator {\nprivate:\n\
    \    int floorSelected;\n    int floorNumber;\npublic:\n    void initialize();\n\
    \    void selectFloor(int floor);\n    void go();\n};\n```\n```\n\nThe initialize\
    \ function sets the initial value of the floor selected and the current floor\
    \ number:\n\n```\n```cpp\nvoid Elevator::initialize() {\n    floorSelected = 0;\n\
    \    floorNumber = 0;\n}\n```\n```\n\nIn C, when you define a variable of a built-in\
    \ type, you expect the initial value to be garbage. So you must always initialize\
    \ it before you use it. However, if we forget to initialize an int, the garbage\
    \ value it contains will still be a legitimate int value, and similarly for the\
    \ other built-in types.\n\nIf we do not call the `Elevator::initialize()` function,\
    \ however, the initial state of the elevator will probably not be legitimate:\n\
    \n```\n```\nFloor # 1001, -47\n```\n```\n\nForgetting an initialization is even\
    \ more critical if the class contains pointers."
  merge: -1
  img_proc: true
- pgno: 112
  md: "When creating user-defined types, then, it is essential to be able to ensure\
    \ proper initialization. C++ has a feature to ensure proper initialization, the\
    \ constructor. The constructor is a special member function which has the same\
    \ name as the class. If we changed the Elevator::initialize() function to a constructor,\
    \ it would look like this:\n\n```\nclass Elevator {\nprivate:\n    int floorSelected;\n\
    \    int floorNumber;\npublic:\n    Elevator();\n    void selectFloor(int floor);\n\
    \    void go();\n};\n```\n\nNote that a constructor has the same name as the class\
    \ and has no return value (this is different than a void return value).\n\nDefining\
    \ a constructor follows the same rules as other member functions:\n\n```\nElevator::Elevator()\
    \ {\n    floorSelected = 0;\n    floorNumber = 0;\n}\n```\n\nThe constructor is\
    \ guaranteed to be called automatically for each object of a class when it is\
    \ created. In fact, initialization now occurs at the point of definition of the\
    \ object, before the programmer can even access the object.\n\n```\nint main()\
    \ {\n    Elevator e;\n    e.selectFloor(7);\n    e.go();\n    return 0;\n}\n```\n\
    \nSince the constructor is automatically called, we can guarantee proper initialization\
    \ of variables. This eliminates a large source of errors and ensures that the\
    \ object is in a stable state when it's created."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Default Constructors\n\nA constructor with no arguments is called the *default\
    \ constructor*.\n\n```\nElevator::Elevator();\n```\n\nIf no constructor is written\
    \ for the class, the compiler will supply one that does nothing. However, usually\
    \ the class design overrides the compiler's default constructor by supplying an\
    \ explicit default constructor. If a constructor is defined for a class, and is\
    \ not a default constructor, the default constructor supplied by the compiler\
    \ ceases to exist.\n\nIt's no accident that constructor functions have exactly\
    \ the same name as the class of which they are members. This is how the compiler\
    \ knows that they are constructors.\n\nNote that there's no return type with constructors.\
    \ Why? Since the constructor is automatically called by the system when an object\
    \ is defined, there's no program to return anything to. Therefore, a return value\
    \ wouldn't make any sense.\n\n# Constructor Example\n\n```\n#include <iostream>\n\
    using namespace std;\n\nclass Counter {\n private:\n  int count;\n public:\n \
    \ Counter() { count = 0; }\n  void incCount() { ++count; }\n  int getCount() {\
    \ return count; }\n};\n\nint main() {\n Counter c1, c2;\n\n cout << \"c1 = \"\
    \ << c1.getCount() << endl;\n cout << \"c2 = \" << c2.getCount() << endl;\n c1.incCount();\n\
    \ c2.incCount();\n c2.incCount();\n\n cout << \"c1 = \" << c1.getCount() << endl;\n\
    \ cout << \"c2 = \" << c2.getCount() << endl;\n return 0;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: "When an object of type `Counter` is first created, we want its count to be\
    \ initialized to 0. We could provide a `setCount()` function to do this and call\
    \ it with an argument of 0, or we could provide a `zeroCount()` function which\
    \ would always set count to 0. However, such functions would need to be executed\
    \ every time we created a `Counter` object:\n\n```\nCounter c1;\nc1.zeroCount();\n\
    ```\n\nTo prove the constructor does its job, let's modify the class:\n\n```\n\
    #include <iostream>\nusing namespace std;\nclass Counter {\nprivate:\n    int\
    \ count;\npublic:\n    Counter()\n    { count = 0; cout << \"I'm here. \" << endl;\
    \ }\n    void incCount() { ++count; }\n    int getCount() { return count; }\n\
    };\nint main() {\n    Counter c1, c2;\n    cout << \"c1 = \" << c1.getCount()\
    \ << endl;\n    cout << \"c2 = \" << c2.getCount() << endl;\n    c1.incCount();\n\
    \    c2.incCount();\n    c2.incCount();\n    cout << \"c1 = \" << c1.getCount()\
    \ << endl;\n    cout << \"c2 = \" << c2.getCount() << endl;\n    return 0;\n}\n\
    Output:\nI'm here.\nI'm here.\nc1 = 0;\nc2 = 0;\nc1 = 1;\nc2 = 2;\n```"
