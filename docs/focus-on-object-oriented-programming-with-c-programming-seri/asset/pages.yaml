- pgno: 241
  md: '# Introduction to Operator Overloading


    Operator overloading is one of the most exciting features of object-oriented programming.
    It can transform complex, obscure programs into intuitively obvious ones. For
    example, a statement like:


    ```

    d3.addObjects(d1, d2);

    ```


    can be changed to the much more readable:


    ```

    d3 = d1 + d2;

    ```


    The term operator overloading refers to giving the normal C++ operators additional
    meanings when they are applied to user-defined types. We''re already familiar
    with operator overloading:


    ```

    c = a + b;

    ```


    When you use the plus sign with int values, one specific set of machine language
    instructions is involved. When used with float values, a completely different
    set of machine language instructions is invoked. Attempting to apply + and = when
    a, b, c are objects of a user-defined class will cause complaints from the compiler.
    However, this statement would become legal with operator overloading. In effect,
    operator overloading gives us the opportunity to redefine the C++ language.


    You can overload the following operators:


    | arithmetic | +, -, *, /, % |

    | logical | &&, ||, ! |

    | bitwise | &, |, ~, ^, <<, >> |

    | comparison | <, >, <=, >= |'
  merge: -1
  img_proc: true
- pgno: 242
  md: '| equality | ==, != |

    | assignment | =, +=, -=, *=, /=, %=, &=, |=, ^=, <<=, >>= |

    | comma | , |

    | increment & decrement | ++, -- |

    | subscript | [] |

    | function call | () |

    | class pointer | -> |

    | member pointer selector | ->* |

    | free store allocator | new |

    | recycling | delete |


    You cannot overload these operators:


    | member | . |

    | member object selector | .* |

    | ternary conditional | ?: |

    | sizeof | sizeof |

    | scope resolution | :: |


    Note the following:


    +   • You can only overload existing operators. That is, you cannot design new
    operators, tempting as it may be:


    ```

    :=, <>, |x|, **

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - You cannot change operator precedence.

    +   - You cannot change the arity of an operator.

    +     - no postfix !

    +     - no binary ~

    +     - no unary ^

    +   - You cannot define a new action for an intrinsic operator for a native C++
    data type. That is, you cannot change the way the + operator works on two `int`s.

    +   - Overloaded operators may not have default arguments.


    To overload an operator, you define a function for the compiler to call when that
    operator is used with the appropriate data types. Whenever the compiler sees those
    data types used with the operator, it calls the function.'
