- pgno: 443
  md: "```\ntemplate <class T>\nStack<T>::Stack(int max) {\n    size = max;\n    top\
    \ = -1;\n    s = new T[size];\n}\n\ntemplate <class T>\nStack<T>::~Stack() {\n\
    \    delete [] s;\n}\n\ntemplate <class T>\nvoid Stack<T>::push(T d) {\n    s[++top]\
    \ = d;\n}\n\ntemplate <class T>\nT Stack<T>::pop() {\n    return s[top--];\n}\n\
    \ntemplate <class T>\nT Stack<T>::top() {\n    return s[top];\n}\n\ntemplate <class\
    \ T>\nint Stack<T>::empty() {\n    return top == -1;\n}\n\ntemplate <class T>\n\
    int Stack<T>::full() {\n    return top == size-1;\n}\n\ntemplate <class T>\nvoid\
    \ Stack<T>::clear() {\n    top = -1;\n}\n```\n\nThe Stack class template defines\
    \ a family of classes when the Stack template is used to declare an object. Note\
    \ that a type must be supplied to occupy the place of the dummy type T in the\
    \ template declaration."
