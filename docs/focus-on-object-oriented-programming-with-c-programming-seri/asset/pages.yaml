- pgno: 15
  md: '# BigInt Library Function Prototypes


    ```

    BigInt *itob(int n);

    ```


    creates a new BigInt initialized to the value of the (small) integer n, and returns

    a pointer to this newly created BigInt


    ```

    void badd(BigInt *a, BigInt *b, BigInt *c);

    ```


    adds the BigInts pointed to by a and b and returns their sum in the BigInt

    pointed to by c


    ```

    void bmult(BigInt *a, BigInt *b, BigInt *c);

    ```


    multiplies the BigInts pointed to by a and b and returns their product in the

    BigInt pointed to by c


    ```

    void bout(BigInt *a);

    ```


    prints the BigInt pointed to by a


    ```

    void bfree(BigInt *a);

    ```


    frees the BigInt pointed to by a


    # Convert Big Integer Constant to BigInt


    To use the BigInt library to solve our problem, we must write a function to

    convert an integer constant into a BigInt since the library does not provide a

    way to do this.


    The function prototype:


    ```

    BigInt *dtob(char *d);

    ```


    takes a big integer written as a character string constant, and converts it into
    a

    BigInt one digit at a time.'
  merge: -1
