- pgno: 327
  md: '# Protected Access Specifier


    +   • Member functions of a class can access both private and public members.


    +   • Objects of a class can access only public members.


    +   • Private members are private.


    This is all we need to know if we don''t use inheritance. With inheritance, there
    are new possibilities. The question that concerns us at the moment is this:


    Can member functions of the derived class access data members of the base class?
    For example, can `operator--()` in `CountDn` access `count` in `Counter`?


    The answer is that member functions can access members of the base class if the
    members are `public` or `protected`. They can''t access `private` members.


    We don''t want to make `count` `public` since that would allow it to be accessed
    by any function anywhere in the program and eliminate the advantages of data-hiding.
    A `protected` member, on the other hand, can be accessed by member functions in
    its own class, or in any class derived from its own class. It can''t be accessed
    from functions outside the class, such as `main()` which is just what we want!


    So a `protected` class member is a cross between a `private` and a `public` member.


    +   • Like `private` members, `protected` members are accessible only to other
    class member functions. Outside of the class, `protected` members are invisible.


    +   • Like `public` members, `protected` members are inherited by the derived
    class and are accessible to member functions in the derived class.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Keep the following rules in mind when deciding whether to make members `private`,
    `protected`, or `public`:


    +   * A `private` member is accessible only to members of the class in which the
    `private` member is declared.

    +   * A `protected` member is accessible to members of its own class and to any
    members in a derived class.

    +   * A `public` member is accessible to the class''s own members, to a derived
    class''s members, and to all other users of the class.


    | Access Specifier | Accessible From Own Class | Accessible From Derived Class
    | Accessible From Objects Outside Class |

    |---|---|---|---|

    | private | yes | no | no |

    | protected | yes | yes | no |

    | public | yes | yes | yes |


    The moral is that if you are writing a class that you suspect might be used, at
    any point in the future, as a base class for other classes, then any data that
    the derived class might need to access should be made `protected` rather than
    `private`. This ensures that the class is "inheritance ready", to adapt a phrase
    from TV set advertising.


    Note that inheritance doesn''t work in reverse. The base class and its objects
    don''t know anything about any classes derived from the base class. For instance,
    in the declaration:


    ```

    Counter c;

    ```


    object `c` cannot use the `operator--()` function defined in `CountDn`. If you
    want a counter that you can decrement, it must be of class `CountDn` and not class
    `Counter`.'
  merge: -1
  img_proc: true
