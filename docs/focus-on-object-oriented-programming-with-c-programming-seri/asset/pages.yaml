- pgno: 161
  md: '# For example:


    ```

    const int w = 10; // declares w as a read-only variable


    int x = w; // legal - just accessing constant w


    w = 25; // illegal - cannot change value to const w


    const y = 5; // legal - can omit the int keyword


    const int z; // illegal - const must be initialized when defined

    ```


    The reason to declare an object of a built-in type as `const` is so the compiler
    will ensure that it isn''t changed. You can also tell the compiler that an object
    of a user-defined type is a `const`, although it isn''t stored in the symbol table.
    Storage is actually allocated for the object! More on this later.


    # const and Pointers (just get a feel for this part)


    Some C++ constructs frequently seem to be the source of confusion. One is the
    use of `const` with pointers. Sometimes it isn''t clear whether the item referenced,
    the pointer, or both, are constant. We''ll take a look at:


    +   * pointers to constants

    +   * constant pointers

    +   * constant pointers to constants


    When using a pointer, two things are involved:


    +   * the pointer itself

    +   * the object pointed to


    Either can be declared as `const` and therefore cannot be assigned to. In a pointer
    declaration, the position of `const` indicates whether it is the pointer or the
    object being pointed to that cannot be changed.'
