    +   • you can also change the meaning of existing functions by redefining them
    so they have a different behavior for your new class


    You don''t even need the source code for the member function definitions, just
    the header files containing the class definitions which must always be available
    to use the class in any case. This means you can inherit from any vendors class
    library, whether they provide source code or not!!'
