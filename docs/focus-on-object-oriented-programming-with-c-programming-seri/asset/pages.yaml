    We''ll assume that addSpace() is a friend function to the Alpha class and, therefore,
    has access to the private data members of Alpha objects. The purpose of addSpace()
    is to add a space to the end of the private data member buf in the Alpha object
    passed as a formal parameter. Now suppose we execute the following code:


    ```

    Alpha a("Hello");

    AddSpace(a);

    ```


    To implement the call to addSpace(), the C++ compiler has to make a copy of the
    Alpha object a on the stack:


    # Original instance of Alpha object a:


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_298_0.png)


    # Copy of Alpha object a on the stack:


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_298_1.png)


    Note that both the copy (str.buf) and the original private member (a.buf) point
    to the same null-terminated string because the character pointers are identical!!'
