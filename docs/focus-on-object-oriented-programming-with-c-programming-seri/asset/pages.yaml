    \ have been 1 for all three objects, instead of 3.\n\n# Another Example\n\nSuppose\
    \ an object needed to know how many other objects of its class there were in the\
    \ program. For example, in a road-racing game, a race car might want to know how\
    \ many other cars were still in the race. In this case a static variable count\
    \ could be included as a member of the class:\n\n+   - all objects would have\
    \ access to this variable\n+   - it would be the same variable for all of the\
    \ objects\n+   - each object would all see the same count variable\n\nEach object\
    \ has access to the information in the static data member so you can use the static\
    \ data members to allow objects to communicate with each other. So static data\
    \ members can be thought of as a way to communicate among objects of a class."
