  md: 'As with other dynamic objects, we should delete dynamic class object arrays
    after we are done using them. However, deleting such an array leads to a problem.
    Due to the C and C++ inability to distinguish between pointers and arrays, programs
    must use a special form of delete ([]) to ensure that when deleting a dynamic
    array of class objects any destructor for those objects is properly called.


    If we had simply written:


    ```

    delete eptr;

    ```


    the compiler would not know whether eptr addresses a single Elevator class object
    or an array of Elevator class objects. To inform the compiler that eptr addresses
    an array, we add empty brackets to delete:


    ```

    delete [] eptr;

    ```


    This ensures that the class destructor is called for each object in the array.
    Note that older compilers required the following:


    ```

    delete [5] eptr;

    ```


    Our next example also creates a dynamic array of class objects on the heap. This
    time, however, not only is an array of pointers created on the heap, but the Elevator
    objects that the pointers point to are also created on the heap.'
