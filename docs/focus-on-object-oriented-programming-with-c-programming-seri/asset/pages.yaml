  md: "# String Variables and Constants\n\nConsider the following C++ program:\n\n\
    ```\n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 50;\n\
    int main() {\n    char buf[MAX];\n    cout << \"Enter a string: \";\n    cin >>\
    \ buf;\n    cout << \"You entered: \" << buf;\n}\n```\n```\n\nWhat happens if\
    \ the user enters a string that is longer than the array used to hold it? Simple.\
    \ We overwrite memory. So how do we avoid buffer overflow? We can tell the >>\
    \ operator to limit the number of characters it places in the array:\n\n```\n\
    ```cpp\n#include <iostream>\n#include <iomanip>\nusing namespace std;\nconst int\
    \ MAX = 50;\nint main() {\n    char buf[MAX];\n    cout << \"Enter a string: \"\
    ;\n    cin >> setw(MAX) >> buf;\n    cout << \"You entered: \" << buf;\n}\n```\n\
    ```\n\nThe program uses the setw() manipulator to specify the maximum number of\
    \ characters the input buffer can accept. The user may type more characters, but\
    \ the >> operator won't insert them into the array. Actually, one character fewer\
    \ than the number specified is inserted, so there is room in the buffer for the\
    \ terminating null character.\n\nNote: The extraction operator (>>) considers\
    \ a space to be a terminating character. Thus a string is delimited by a space\
    \ and anything typed after a space is thrown away."
