  md: "# # Overloading the Assignment Operator\n\nThe situation for the overloaded\
    \ assignment operator in a derived class works in a fashion similar to that of\
    \ the overloaded copy constructor. When you need to write an overloaded `operator=()`\
    \ function in a derived class, it is your responsibility to make an explicit call\
    \ to the overloaded `operator=()` function in the base class.\n\nUnlike overloading\
    \ a copy constructor function, you have complete control over when this call is\
    \ made, although it makes sense to do it immediately so that the base portion\
    \ of the derived object gets its data members assigned first, followed by the\
    \ derived portion.\n\nRemember, if the base class does not have an overloaded\
    \ assignment operator, the compiler will supply one (that we may not like).\n\n\
    ```\n```cpp\n// assign.cpp\n\n#include <iostream>\n\nuses namespace std;\n\nclass\
    \ Base {\n    protected:\n        int bnum;\n    public:\n        Base(int x=0)\
    \ : bnum(x) {\n            cout << \"base constructor\" << endl;\n        }\n\
    \        Base(const Base& b) : bnum(b.bnum) {\n            cout << \"base copy\
    \ constructor\" << endl;\n        }\n\n        Base& operator=(const Base& b)\
    \ {\n            cout << \"base operator=()\" << endl;\n            if (&b !=\
    \ this) {\n                bnum = b.bnum;\n            }\n            return *this;\n\
    \        }\n\n        ~Base() {\n            cout << \"base destructor\" << endl;\n\
    \        }\n\n        int getBnum() const {\n            return bnum;\n      \
    \  }\n};\n```\n```"
