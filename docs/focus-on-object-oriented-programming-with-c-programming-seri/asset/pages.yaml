  md: '# Class Hierarchies


    In the examples so far, inheritance has been used to add functionality to an existing
    class. Let''s look at an example where inheritance is used for a different purpose,
    as part of the original design of a program.


    Our example models a database of employees of a widget company. In this company,
    there are three kinds of employees:


    +   - Managers – manage other employees

    +   - Scientists - perform research to develop better widgets

    +   - Laborers - operate the dangerous widget-stamping presses.


    The database stores a name and an employee id number for all employees, no matter
    what category they are.


    +   - For Managers, it also stores their title and golf club dues.

    +   - For Scientists it stores the number of scholarly articles they have published.

    +   - Laborers need no additional data beyond their names and id numbers.


    So our program design will start with a base class Employee that handles the employee''s
    last name and id number. From this class, three other classes will be derived:
    Manager, Scientist, and Laborer.


    ![](img/adb3588dc0dfe9f607c1d417be6bb240_334_0.png)


    The Manager and Scientist classes contain additional information about these categories
    of Employee as well as member functions to handle this information.'
