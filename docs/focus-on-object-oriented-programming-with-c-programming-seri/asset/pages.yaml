- pgno: 53
  md: "Note the following:\n\n+   - The default precision is 6, so that (up to) six\
    \ positions are provided to hold the digits after the decimal point.\n+   - The\
    \ value of x is displayed in a field whose (default) width is 1, and C++ automatically\
    \ widens fields that are too small to the minimum width required to display the\
    \ value.\n+   - By default, the flag ios::showpoint is not set, so that neither\
    \ the decimal point nor the fractional values of y are displayed.\n\nUsing the\
    \ setiosflags() manipulator to set the ios::showpoint flag will cause the decimal\
    \ point and trailing zeros of y to be displayed, and using it to set the ios::fixed\
    \ flag will ensure that values are displayed in fixed-point (rather than floating-point)\
    \ form. Type in, compile, and execute the following program:\n\n```\n// io2.cpp\n\
    \n#include <iostream>\n#include <iomanip>\n\nusing namespace std;\n\nint main()\
    \ {\n\tfloat x, y;\n\n\tx = 8.0 / 3.0;\n\ty = 9.0 / 3.0;\n\tcout << setiosflags(ios::showpoint\
    \ | ios::fixed);\n\tcout << \"(\" << x << \")\" << endl;\n\tcout << \"(\" << y\
    \ << \")\" << endl;\n}\n```\n\nIt's output will appear as follows:\n\n```\n(2.666667)\n\
    (3.000000)\n```\n\nSuppose we wish to alter the precision to display only three\
    \ decimal places. We can insert the setprecision() stream manipulator or we can\
    \ use the precision() member function. A call to either sets the precision for\
    \ all subsequent output operations until the next precision setting call."
