  md: "# Another example:\n\n```\nint array[100]; // static storage\n\nint& getItem(int\
    \ index) {\n    return array[index];\n}\n\nint main() {\n    getItem(4) = 5; //\
    \ not allowed in C\n    return 0;\n}\n```\n\nThe function call is now an lvalue\
    \ and array[4] is now = 5. Function getItem() will tell you at which location\
    \ a value will be assigned. For example, function getItem() returns a reference\
    \ to the element of the array index and sets it to 5.\n\nJust as passing arguments\
    \ by reference prevents unnecessary copying to the stack, you can return an object\
    \ by reference to avoid copying the returned object.\n\nCheck what happens when\
    \ you return an object by value. For example, suppose you return a String object\
    \ from a function addString() that returns the concatenation of two strings:\n\
    \n```\nString addString(const String& s1) {\n    String s;\n    // append s1 and\
    \ s2 to a\n    ...\n    return s;\n}\n```\n\nIn this case, the return statement\
    \ has to copy the String s to an area of memory provided by the calling program.\
    \ To do so properly, the return statement will call a special constructor, the\
    \ copy constructor, which can create and initialize a new instance of an object\
    \ from an existing one. After creating the copy, return calls the destructor of\
    \ the String class to destroy String s before returning to the calling program.\
    \ This is a good example of work done behind the scenes by the C++ compiler."
  merge: -1
