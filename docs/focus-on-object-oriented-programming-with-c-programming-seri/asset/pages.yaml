- pgno: 313
  md: "# Here's the output produced:\n\n```\nString default constructor\nEmployee\
    \ two arg constructor\nString one arg constructor\nSally\n123\n```\n\nWhy the\
    \ strange output? Why the extra call to the `String` default constructor?\n\n\
    Well, here's a C++ rule: By default, before the body of the a constructor is executed,\
    \ if the class contains a data member which is itself a class object, its default\
    \ constructor will automatically be called first.\n\nSo when an `Employee` object\
    \ is created, the name member will first be initialized using the default `String`\
    \ constructor, and then its value will be changed by the assignment in the body\
    \ of the `Employee` constructor. This is two operations when one would have sufficed!\
    \ Very inefficient!\n\nTherefore, when a data member of a class is itself a class\
    \ object, we must be careful or else we'll invoke the object's default constructor\
    \ when it's not needed. The constructor will produce the correct results, but\
    \ it is slower than it needs to be. Thus, for reasons of efficiency, we must use\
    \ the constructor initializer list to initialize member variables. The constructor\
    \ initializer list can override this default behavior.\n\nBelow we explicitly\
    \ initialize the name data member with the correct value by using the constructor\
    \ initializer list:\n\n```\nEmployee() : name(\"Haley\"), id(108) {\n    cout\
    \ << \"Employee default constructor\" << endl;\n}\n\nEmployee(char *s, int num)\
    \ : name(s), id(num) {\n    cout << \"Employee two arg constructor\" << endl;\n\
    }\n```\n\nWhen you write a constructor definition, stop after the ( ) that encloses\
    \ the formal argument list, supply a colon followed by a list of initializers,\
    \ and see how many of the members of the class can be initialized using this constructor\
    \ initializer syntax. Note that each initializer consists of a data member name\
    \ and an argument list that specifies the arguments to the constructor for that\
    \ member."
