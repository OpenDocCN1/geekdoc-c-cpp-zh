    \ its argument type:\n\n```\n```cpp\nvoid random(const int *num) {\n    // can't\
    \ really change num here\n}\n```\n```\n\nThis prevents random() from changing\
    \ the value of the coordinate.\n\nThe same rule about calling other functions\
    \ inside constant functions applies to calling other member functions. A constant\
    \ member function can only call other constant member functions. It can't call\
    \ standard member functions since they might update the object's data.\n\nNote\
    \ that you could find a clever way to get around the restrictions for constant\
    \ member functions by using clever programming techniques! You could use type\
    \ casts and pointers to trick the compiler into letting you change the constants.\
    \ There is no guarantee that a constant member function won't change the data\
    \ members. C++ doesn't always stop you from violating the rules. It only prevents\
    \ accidental misuse.\n\nAlso note that constructors and destructors are not required\
    \ to be declared const in order to be applied to constant class objects."
