  md: "An alternate approach to dynamically create an array of class objects on the\
    \ heap is as follows:\n\n```\n// e4.cpp\n//-------------------------------------\n\
    #include <iostream>\n#include \"elevator.h\"\n\nusing namespace std;\n\nint main()\
    \ {\n   Elevator *eptr;\n\n   eptr = new Elevator[5];\n   for (int i = 0; i <\
    \ 5; i++)\n      cout << eptr[i].getFloor() << endl;\n   delete [] eptr;\n}\n\
    ```\n\nAs shown in the diagram below, the only storage that is allocated on the\
    \ stack is the storage for the pointer to the Elevator array. Storage for the\
    \ array itself (i.e., storage for each Elevator object) is allocated on the heap.\n\
    \n| | created on stack | created on heap |\n|---|---|---|\n| | eptr=====> | 0\
    \ | Elevator object | |\n| | | 1 | Elevator object | |\n| | | 2 | Elevator object\
    \ | |\n| | | 3 | Elevator object | |\n| | | 4 | Elevator object | |\n\nIn the\
    \ above program, note that we use the direct component selector (.) operator rather\
    \ than the indirect component selector (->) operator to access the member functions.\
    \ This is due to the fact that we do not have an array of pointers to class objects\
    \ this time, but rather the class objects themselves are contained within the\
    \ array."
