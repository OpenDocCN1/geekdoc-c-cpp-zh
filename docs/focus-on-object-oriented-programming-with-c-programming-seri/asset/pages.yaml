- pgno: 25
  md: '+   - A legal C program is a legal C++ program except when the C program:

    +     - uses C++ keywords as identifiers

    +     - depends on certain C type conversion rules that are different in C++


    +   - Control structures (for, while, do, if, if else, switch, etc.) all work
    as before and cannot be extended


    +   - Operators (+, -, +=, ++, --, etc.) all work as before with the same precedence.
    However, operators can now be extended to work on new types (structs / classes).


    +   - Still have global declarations and library declarations in .h files and
    implementation code in .cpp files, but levels of abstraction now tend to be separated
    into different source files,

    +   i.e., might have TimeDate.h declaration and TimeDate.cpp for implementation
    of functions, then Postmark.h and Postmark.cpp files that use TimeDate class


    +   - main() as the program start point


    +   - Still use { and } to delimit blocks


    +   - Same primitive data types


