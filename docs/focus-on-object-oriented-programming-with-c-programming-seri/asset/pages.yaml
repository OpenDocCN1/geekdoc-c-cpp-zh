    in the same program:


    +   - + operator for `String` objects

    +   - + operator for `Distance` objects


    and C++ would still know how to interpret the + operator for each context. The
    compiler would select the correct function to carry out the “addition” based on
    the type of operand (either `Distance` or `String`).'
