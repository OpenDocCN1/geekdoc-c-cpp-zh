  md: '# Casting from Derived into Base


    Casting from a derived class instance, pointer, or reference, into a base class
    object of the same type presents no problem to the compiler. We''ve seen previously
    how a reference-to-derived in the derived class copy constructor was passed into
    the base class copy constructor and received as a reference-to-base.


    Since a derived class instance always contains a base class instance, when the
    cast occurs the compiler simply ignores the derived class portion of the instance
    that is being used, pointer at, or referred to. For example:


    ```

    Derived d(1, 2);

    ```


    creates an object of the derived class.


    ```

    Base b = d;

    ```


    creates an object of the base class. Here, however, a derived instance is used
    to initialize a base instance. Object b now only contains the Base class portion
    of object d.


    ```

    Base *pbase = new Derived;

    ```


    In this example, new Derived returns a pointer to a Derived object and is used
    to initialize a pointer to a Base object. In other words, a pointer to Derived
    is used to initialize a pointer to Base. So pBase "sees" only the Base class portion
    of the Derived object on the heap.


    Remember, since a Derived class instance always contains a Base class instance,
    when the cast occurs, the compiler simply ignores the Derived class portion of
    the instance that is being pointed at.


    # Casting from Base into Derived


    On the other hand, if you attempt to cast from a base class instance, pointer,
    or reference into a derived class object of the same type, the compiler will complain'
