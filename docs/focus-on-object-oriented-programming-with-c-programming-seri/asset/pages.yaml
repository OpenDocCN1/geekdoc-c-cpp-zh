- pgno: 9
  md: '# Data Abstraction


    Data abstraction is the programming technique of inventing new data types that
    are well suited to an application, thereby making it easier to program. It is
    a powerful, general-purpose technique that can result in:


    +   - Shorter programs

    +   - More readable programs

    +   - More flexible programs


    # A Motivation


    Assume we are programming in C:


    first contains a first name, such as Haley


    last contains a last name, such as Laurel


    We want to make fullname contain a first and last name separated by a period,
    such as haley.laurel


    # Release 1


    ```

    char *first, *last;

    char fullname[32];


    strcpy(fullname, first);

    strcat(fullname, ".");

    strcat(fullname, last);

    ```


    See if you can figure out why Release 1 crashes before reading further.


    # Why Release 1 Crashes


    A user crashed Release 1 by using a fullname longer than 32 characters.'
  merge: -1
  img_proc: true
