- pgno: 441
  md: "# Class Templates\n\nYou already know how classes can help you reuse code and\
    \ recycle your code for more efficient programming. Templates raise the level\
    \ of abstraction one level and enable you to automatically create individual classes\
    \ that work with different types of data.\n\nTemplate classes are even more powerful\
    \ than template functions! You can use a template to create one class definition\
    \ to describe a class that works with integers, a class that works with characters,\
    \ and a class that works with floats, all within one class definition and without\
    \ writing any new code.\n\nA class template specifies how individual classes can\
    \ be constructed, much as a class declaration specifies how individual objects\
    \ can be constructed.\n\nFor example, a user typically needs a vector of elements\
    \ of some type unknown to the writer of the vector class. Therefore the vector\
    \ class should be expressed in such a way that it takes the element type as an\
    \ argument.\n\n```\n// vector01.cpp\n\nvoid error(char *);\n\nclass String {};\n\
    class Distance {};\n\ntemplate <class T>\nclass Vector {\n    private:\n     \
    \   T *v;\n        int size;\n    public:\n        Vector(int s) {\n         \
    \   if (s <= 0)\n                error(\"Bad vector size.\");\n            size\
    \ = s;\n            v = new T[size]; // allocate an array of s T's\n        }\n\
    \        ~Vector() { delete [] v; }\n        int getsize() { return size; }\n\
    \        T& operator[](int i) { return v[i]; }\n};\n```"
