  md: '# Overloading the Increment and Decrement Operators


    In C, the operators ++ (increment by 1) and -- (decrement by 1) are unique in
    that they may appear on either side of the variable to which they apply. If the
    operator appears on the left, it implies prefix notation while on the right it
    implies postfix notation.


    In older C++ compilers, the distinction between prefix and postfix notation for
    user-defined types was lost. That is, for the String class and an instance called
    s, the expressions s++ and ++s cannot be distinguished from each other because
    the compiler will generate exactly the same code for each one. However with more
    modern compilers, any postfix usage automatically generates an extra argument
    consisting of an integer 0. The actual value of this integer, of course, is meaningless,
    so that a formal argument name does not need to be written when the function is
    defined. Nevertheless, this extra argument allows both prefix and postfix versions
    of the operator to be present.


    | Signature | Description |

    | :--- | :--- |

    | `String& operator++();` | `// prefix form - add 1 to each character // in the
    string literal pointed at by // buf and return the resulting String` |

    | `String& operator--();` | `// prefix form - subtract 1 from each character in
    the string literal // pointed at by buf and return the resulting String` |

    | `String operator++(int);` | `// postfix form - add 1 to each character // in
    the string literal pointed at by // buf and return the original String` |

    | `String operator--(int);` | `// postfix form - subtract 1 from each character
    in the string literal // pointed at by buf and return the // original String`
    |


    # Return String Length


    It will be useful in this exercise to define a function to return the length of
    the string literal pointed to by buf (excluding the null character).


    ```

    int getLength();

    ```'
