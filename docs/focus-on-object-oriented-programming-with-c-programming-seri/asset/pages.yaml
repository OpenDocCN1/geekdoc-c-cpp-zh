- pgno: 429
  md: "# Virtual Base Classes\n\nWhen using multiple inheritance, a base class may\
    \ not be specified more than once in a derived class: This declaration is therefore\
    \ not legal:\n\n```\nclass Base (){};\nclass Derived : public Base, public Base());\n\
    ```\n\nHowever, a base class can legally be indirectly passed to the derived class\
    \ more than once:\n\n```\nclass X : public Base {\npublic:\n    int num;\n   \
    \ void getNum();\n};\n\nclass Y : public Base {\npublic:\n    int num;\n    void\
    \ getNum();\n};\n\nclass Z : public X, public Y {\npublic:\n    int num;\n   \
    \ void getNum() { return num; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 430
  md: "![](img/adb3588dc0dfe9f607c1d417be6bb240_430_0.png)\n\nNote that the above\
    \ inheritance tree is shown with the same `Base` class appearing twice. In this\
    \ case, each object of class `Z` will have two sub-objects of class `Base`, each\
    \ with its own data!\n\nAlso note that the function `getNum()` is now ambiguous.\
    \ The compiler doesn't know which `num` is being referred to! The scope resolution\
    \ operator must therefore be applied to the function:\n\n```\nint Z::getNum()\
    \ {\n    return X::num;\n}\n```\n\nHaving multiple copies of the same base class\
    \ in an instance hierarchy is not only confusing, it wastes storage! The solution\
    \ is to declare the base class `virtual`. This forces the compiler to allow only\
    \ one copy of a given base class in the declaration of a derived class:"
