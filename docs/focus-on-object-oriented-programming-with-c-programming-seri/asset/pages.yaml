  md: "# C Structs\n\nConventional C programming techniques often make programmers\
    \ work harder than necessary. For instance, consider how you might represent the\
    \ date and time, a typical task that most programs need to do.\n\nIn C, you could\
    \ declare a struct like:\n\n```\nstruct Time {\n    int month;\n    int day;\n\
    \    int year;\n    int hour;\n    int min;\n    int sec;\n};\n```\n\nThe members\
    \ of the Time struct store the component values of a single date and time.\n\n\
    Given this struct, you can declare a Time variable such as:\n\n```\nstruct Time\
    \ appt;\n```\n\nand you can assign values to appt's members with statements such\
    \ as:\n\n```\nappt.month = 9;\nappt.day = 23;\nappt.year = 2012;\nappt.hour =\
    \ 8;\nappt.min = 30;\nappt.sec = 0;\n```"
