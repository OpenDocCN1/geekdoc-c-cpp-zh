- pgno: 225
  md: 'Unlike a pointer that can be declared in an uninitialized state, or set to
    NULL if the pointer does not address valid data, a reference must always refer
    to an object. There is no equivalent of a NULL pointer for a reference.


    References do not have to be pre-initialized in four special cases:


    +   - when declared extern

    +   - when used as function arguments

    +   - when used as function return types

    +   - in class declarations


    Some examples:


    ```

    int&    - reference to an int

    int*&   - reference to a pointer to an int


    int a[10];

    int& last = a[9]; // last is an alias for a[9];

    ```


    Often the reason for giving an object a name is that it doesn''t already have
    one. This example attaches the name last to the last element of the array a. One
    might do this if one were about to use a[9] several times. Using a reference would
    save program text and might save computation time as well.


    # Reference to a Reference


    If a reference variable is an alias for another reference variable, it really
    refers to the variable for which the first reference variable is as alias. For
    example, the two reference variables are aliases for the same variable in memory.


    ```

    int num1 = 1;

    int& num2 = num1; // num2 is an alias for num1

    int& num3 = num2; // num3 is an alias for num2 which

    // really means that num3 is an

    // alias for num1

    ```


    # Address of a Reference Variable


    We can show that reference variables are not separate entities in memory with
    their own addresses. If you take the address of a reference variable, all you
    will get is the address of the variable for which it is an alias.'
