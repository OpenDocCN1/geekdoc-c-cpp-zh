- pgno: 62
  md: "# Data Types and Data Protection\n\n# Types = Structs + Functions\n\nWe're\
    \ going to take a look at how C++ implements new data types and makes use of data\
    \ protection.\n\n# C Structs\n\nSuppose we want to build a system consisting of\
    \ several elevators. In C, we typically attack the problem by creating a `struct`\
    \ to hold data about each elevator:\n\n```\nstruct elevator {\n    int floorSelected;\n\
    \    int floorNumber;\n};\n```\n\nA structure is created which holds all the information\
    \ we want to remember about each elevator. To create a variable, we use the `struct`\
    \ keyword along with the structure name:\n\n```\nstruct elevator e;\n```\n\nor,\
    \ we can use the `typedef` identifier and say:\n\n```\ntypedef struct elevator\
    \ Elevator;\nElevator e;\n```\n\nThe second example acts more like a built-in\
    \ data type.\n\n# Pointers to C Structs as Function Arguments\n\nWhen we create\
    \ a function to act upon the `struct`, we must pass as an argument to the function\
    \ a pointer to the `struct`."
  merge: -1
  img_proc: true
- pgno: 63
  md: "The function below initializes the fields of the `struct`:\n\n```\nvoid initialize\
    \ (Elevator *e) {\n  e->floorSelected = 0;\n  e->floorNumber = 0;\n}\n```\n\n\
    We create another function to select the floor:\n\n```\nvoid selectFloor(Elevator\
    \ *e, int floor) {\n  e->floorSelected = floor;\n}\n```\n\nWe can see that everywhere\
    \ we want to use the `Elevator` structure, we must dereference a pointer. We are\
    \ forced to use pointers rather than passing the `Elevator` struct by value because\
    \ we are modifying variables outside the scope of the function. Passing the `Elevator`\
    \ struct by value would simply make a local variable!\n\n# C++ Structs\n\nLet's\
    \ see how we might solve the same problem in C++.\n\nWe know that a type has characteristics\
    \ and behavior. C++ implements a type as an extended `struct` that contains function\
    \ declarations as well as data declarations. Collectively, these are called members:\n\
    \n+   - function members\n+   - data members\n\nData members represent the state\
    \ (characteristics) of the variable, and function members represent the operations\
    \ (behavior) that can be performed on the data members."
  merge: -1
  img_proc: true
- pgno: 64
  md: "```\n#include <iostream>\nusing namespace std;\n#define FLOORS 10\nstruct Elevator\
    \ {\n    int floorSelected;\n    int floorNumber;\n    void initialize();\n  \
    \  void selectFloor(int floor);\n    void go();\n};\n```\n\n# Member Function\
    \ Declarations\n\nIn C++, all member functions must be declared with full prototypes,\
    \ i.e., all the argument types must be declared before the function can be called.\n\
    \n+   - Functions are declared inside a `struct`.\n\n+   - The scope of these\
    \ member functions is the scope of the `struct`.\n\n+   - These are not global\
    \ names.\n\n# Scope Resolution Operator\n\nWhen defining member functions, we\
    \ must tell the compiler that the function is associated with a particular type\
    \ using the scope resolution operator (::).\n\n```\nvoid Elevator::initialize()\
    \ {\n    floorSelected = 0;\n    floorNumber = 0;\n};\n```\n\nSince the member\
    \ function is in the scope of a `struct`, it has access to the other members of\
    \ the `struct`. Therefore, no pointers are necessary to access and modify the\
    \ data members of the `struct`!"
  merge: -1
  img_proc: true
- pgno: 65
  md: "```\nint main() {\n    Elevator e;\n    e.initialize();\n    e.selectFloor();\n\
    \    e.go();\n}\n```\n\nDefining a variable of a user-defined type is just like\
    \ defining a variable of a built-in type. However, we did not have to create a\
    \ typedef as we did in C.\n\nWhen calling a member function, we must specify an\
    \ object. Calling a member function or sending a message to an object is just\
    \ like selecting a data member of a struct. Since the user doesn't have to pass\
    \ the address of the variable into a function, member function calls are easier\
    \ and cleaner to use.\n\n# Data Protection\n\nSo we've seen how a type is represented\
    \ in C++ by extending a struct to include functions as well as data. But if a\
    \ program still has direct access to all the members in a struct, the data is\
    \ unprotected, and programmers can get into it and mess things up.\n\nThere are\
    \ three reasons why we need to protect the data:\n\n+   1. Sometimes modifying\
    \ one data element may require modification of another to maintain the integrity\
    \ of the object. If you can deny programmers access to certain data elements,\
    \ that forces them to use member functions which you can design to preserve object\
    \ integrity.\n\n+   2. In a `struct`, where all members may be modified, it can\
    \ be difficult for programmers to know which interface they're supposed to use.\
    \ By denying access to some of the members within a `struct`, they could only\
    \ use members that are part of the public interface.\n\n+   3. It helps you isolate\
    \ bugs. Say a programmer makes an incorrect modification to a data member and\
    \ suddenly you have an error somewhere in your system. If all the members are\
    \ public, that error could be coming from anywhere. But if some of those members\
    \ are private, you know the problem must be coming from functions that have permission\
    \ to access data."
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Access Specifiers\n\nSo how does C++ address these security issues? C++ adds\
    \ three new keywords to provide data protection, called access specifiers:\n\n\
    public: means that members declared after this point are accessible by everyone.\
    \ Public members are like members of C structs. C++ structs default to public\
    \ access.\n\nprivate: means that all members declared after this point are only\
    \ accessible to other members of the object. Other programmers cannot access private\
    \ members so they are safe from accidental changes and are not part of the public\
    \ interface to the type. C++ classes default to private access.\n\nprotected:\
    \ members, like private members, are not accessible by other programmers and can\
    \ only be modified by other members of the type. However, member functions in\
    \ derived types, a subject we'll cover later, can access protected members of\
    \ the base type.\n\n# Data Protection Example\n\nLet's see how we can use access\
    \ specifiers to increase the integrity of the Elevator type from before:\n\n```\n\
    struct Elevator {\n    private:\n        int floorSelected;\n        int floorNumber;\n\
    \    public:\n        void initialize();\n        void selectFloor(int floor);\n\
    \        void go();\n};\n```\n\nNow, the only way to modify the private data elements\
    \ is through the public interface. For example,\n\n```\nint main() {\n    Elevator\
    \ e;\n    e.floorSelected = 12;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "is now an invalid statement. The compiler will generate an error message. The\
    \ data member floorSelected is now a private data member and can only be accessed\
    \ within the scope of the Elevator struct.\n\n# # Restricted Access to Member\
    \ Functions\n\nMember functions can also have restricted access as shown below:\n\
    \n```\n```cpp\nstruct Coordinates {\n    private:\n        int c1, c2, c3;\n \
    \       void translate(int, int, int);\n    public:\n        void move (int, int,\
    \ int);\n};\n```\n```\n\nHere we can assume that the member function move() calls\
    \ the translate() member function, since programmers using the objects cannot.\n\
    \nSo we've seen why we need to protect the data and functions within types and\
    \ how the keywords public, private and protected can help us do that. This will\
    \ lead us into a discussion of the class."
