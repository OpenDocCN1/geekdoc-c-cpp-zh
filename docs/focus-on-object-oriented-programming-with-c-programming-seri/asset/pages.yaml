  md: "# Static Data Members\n\nIt is sometimes necessary that all the objects of\
    \ a particular class have access to the same variable. This may be some condition\
    \ flag or counter related to the class that changes dynamically in the course\
    \ of a program.\n\nFor example, perhaps a count is needed of how many objects\
    \ of a class exist at any one point in a program. Sometimes it is simply more\
    \ efficient to provide one variable for all the objects of one class rather than\
    \ having each object maintain its own copy. This variable may be a pointer to\
    \ an error-handling routine for that class or a pointer to the heap for the class.\n\
    \nFor these cases, a static data member can provide a solution. A static data\
    \ member allows you to share information among objects of the class without revealing\
    \ it to the rest of the world, such as a global class variable.\n\nFor example,\
    \ say that I have a basket of apples, and there is a variable that defines ripeness.\
    \ Now when an apple reaches a certain state, we'll say that it has gone bad. Once\
    \ this happens, all the other apples should know about it so they can also go\
    \ bad. In this case, one bad apple really does spoil the whole bunch.\n\nSuppose\
    \ you want an object which holds a single word. Then you can turn a text file\
    \ into a group of these objects. Also suppose you want any word to be able to\
    \ know how many total word objects there are. For example:\n\n```\n// word1.h\n\
    \n#ifndef _WORD1_H\n#define _WORD1_H\n\nclass Word {\nprivate:\n    char *buf;\n\
    public:\n    Word(char *s);\n};\n\n#endif\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n// word1.cpp\n\n#include <string.h>\n#include \"word1.h\"\n\nint wordCount\
    \ = 0;              // global variable\n\nWord::Word(char *s) {\n    buf = strdup(s);\n\
    \    wordCount++;                // increment global variable\n}\n```\n\nNow,\
    \ any word object can access `wordCount` to find out how many words there are.\
    \ But there are two problems with this approach:\n\n+   - Since `wordCount` is\
    \ global, anyone can modify it. There is no safety.\n+   - `wordCount` is in the\
    \ global name space, which means if you bring in some other library which uses\
    \ the same name, there will be a clash.\n\nYou may think to solve this problem\
    \ by bringing `wordCount` inside class Word as follows:\n\n```\n// word2.h\n\n\
    #ifndef WORD2_H\n#define __WORD2_H\n\nclass Word {\nprivate:\n    char *buf;\n\
    \    int wordCount;\npublic:\n    Word(char *s);\n};\n\n#endif\n```"
