    \ I am \" << age << \" today!\" << endl;\n}\n```\n\n# Input / Output\n\nThe iostream\
    \ header file automatically defines variables (objects) called cout and cin.\n\
    \ncout is a predefined object that accepts all data bound for the standard output\
    \ stream (monitor).\n\ncin is also a predefined object which corresponds to the\
    \ standard input stream (keyboard).\n\nTo send data to the standard input stream,\
    \ we use the << operator (which is the bitwise shift operator in C). This operator\
    \ is overloaded in C++ to give it a new meaning when the operator is used with\
    \ an object of a particular type. When used with iostream objects, << means send\
    \ to.\n\nNote that cout and the << operator know how to treat an integer and a\
    \ string differently. If a string is sent, it is treated as text. If an integer\
    \ is sent, it is treated as a number. This may seem obvious, but it's another\
    \ example of operator overloading, a key feature of C++."
