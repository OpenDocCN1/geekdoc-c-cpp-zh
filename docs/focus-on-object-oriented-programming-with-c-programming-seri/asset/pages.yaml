  md: "# Virtual Functions\n\n# Accessing Member Functions\n\nLet's see what happens\
    \ when a base class and derived classes all have functions with the same name,\
    \ and we access these functions using pointers, but without virtual functions.\
    \ Given the following class:\n\n```\nclass Base {\n protected:\n int value;\n\
    \ public:\n Base( int x ) { value = x; }\n int getValue() { return value; }\n\
    \ };\n```\n\nWe can now declare and use a Base class object:\n\n```\nint main()\
    \ {\n Base b(10);\n cout << \"value = \" << b.getValue() << endl;\n return 0;\n\
    \ }\n```\n\nThe above code generates the output:\n\nvalue = 10\n\nWe will now\
    \ derive a class from Base that multiplies the Base class value by a specified\
    \ amount:\n\n```\nclass Derived : public Base {\n protected:\n int mult;\n public:\n\
    \ Derived( int x, int y ) : Base(x), mult(y) { }\n int getValue() { return value\
    \ * mult; }\n };\n```"
