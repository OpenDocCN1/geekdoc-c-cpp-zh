  trans: "\n\n![](img/cover00115.jpeg)\n\n# JavaScript 快速面试题\n\n**版权声明**\n\n所有权利保留。未经出版者\
    \ Sandeep Kumar Patel 书面许可，不得以任何形式或通过任何电子或机械手段（包括信息存储和检索系统）复制本书的任何部分，但文章或评论中的简短引用除外。\n\
    \n书中使用的所有品牌名称和产品名称均为其各自所有者的商标、注册商标或商品名。我与书中的任何产品或供应商均无关联。\n\n**由 Sandeep Kumar\
    \ Patel 出版**。\n\n## 目录\n\n快速 JavaScript 面试题目录\n* 第 1 章 继承\n* 第 2 章 关于事件的问题\n*\
    \ 第 3 章 闭包\n* 第 5 章 关于 DOM 的问题\n* 第 6 章 Date 对象\n* 第 7 章则表达式\n* 第 8 章 关于 Canvas\
    \ API 的问题\n* 第 9 章 Geo Location API\n* 第 10 章 Web Workers\n* 第 11 章 Local Storage\n\
    * 第 12 章 File API\n* 第 13 章 Web RTC\n* 第 14 章 Drag & Drop API\n* 第 15 章 App Cache\
    \ API\n* 第 16 章 Server Sent Events\n* 第 17 章 关于作者的其他杂问题\n* 最后一件事...\n\n## 第 1\
    \ 章 继承\n\n### Q. 如何创建类？\n\n**答案**\n\nJavaScript 没有类定义。为了在 JavaScript 中模拟类，可以使用函数来声明类。\n\
    \n**示例：**\n\n让我们在 JavaScript 中创建一个学生类，接受两个参数 `name` 和 `roll` 作为属性。代码如下：\n\n```javascript\n\
    function Student(name,roll){ \n    this.name = name;\n    this.roll = roll; \n\
    }\n```\n\n### Q. 如何创建对象？\n\n**答案**\n\n可以使用两种方式创建 JavaScript 对象：\n\n**使用 `new`\
    \ 关键字：**\n\n要从上面的学生类创建一个学生对象，我们可以使用 `new` 关键字调用 `Student` 函数。\n\n```javascript\n\
    var student1 = new Student('sandeep’,2)\n```\n\n**匿名对象：**\n\n可以使用包含属性名和值对的大括号对来创建匿名对象。\n\
    \n```javascript\nVar rose = {‘color’: ’red’}\n```\n\n### Q. 如何声明私有成员和公共成员？\n\n\
    私有成员使用 `var` 关键字和构造函数声明。\n\n```javascript\nfunction Student(name,roll){ \n   \
    \ var id= ABCD123;\n    this.name = name;\n    this.roll = roll;\n}\n```\n\n当创建一个\
    \ `Student` 对象时，属性 `name` 和 `roll` 可以通过点运算符访问，但 `id` 将无法被访问，因为它表现得像私有成员，并在调用时返回\
    \ `undefined`。\n\n![](img/image00050.jpeg)\n\n上面的 chrome 控制台显示创建了一个 `student1`\
    \ 对象。`name` 属性是可以访问的，因为在调用 `student1.name` 时显示了 sandeep。因此，`name` 是学生对象的公共属性。但\
    \ `id` 属性无法访问，在调用 `student1.id` 时返回 `undefined`。这显示 `id` 是 `student1` 对象中的私有属性。\n\
    \n### Q. 什么是原型（prototype）属性？\n\n通过使用 `Prototype`，我们可以向现有对象添加`新成员`。每个 JavaScript\
    \ 对象内部都拥有这个属性。初始时它是一个`空`对象。\n\n**示例：**\n\n```javascript\nfunction Student(name,roll){\n\
    \    this.name = name;\n    this.roll = roll;\n}\n\nvar student1 = new Student('sangeeta',30);\
    \ \nStudent.prototype.mark = 100; \n```\n\n查看下面的 chrome 控制台以查看原型的使用。\n\n![](img/image00051.jpeg)\n\
    \n初始时 `student1` 对象只有两个属性 `name` 和 `roll`。通过原型，学生对象被添加了一个新属性 `mark`，其值为 `100`。现在控制台显示\
    \ `mark` 属性也被添加到了现有的 `student1` 对象中。\n\n### Q. 什么是构造函数（constructor）属性？\n\n**答案**\n\
    \n对象的构造函数属性维护着对其创建函数的引用。\n\n**示例：**\n\n让我们通过创建一个学生对象并调用其构造函数属性来查看示例。\n\n```javascript\n\
    function Student(name, mark){\n    this.name=name;\n    this.mark =mark;\n}\n\n\
    var student1 = new Student('sandeep',123); \nconsole.log(student1.constructor);\n\
    ```\n\n查看以下截图以获取 chrome 控制台中的上述代码。控制台日志打印了 `student1` 对象引用的函数。\n\n![](img/image00052.jpeg)\n\
    \n### Q. 如何调用其他类的方法？\n\n**答案**\n\n使用 `call()` 和 `apply()` 方法，我们可以从不同的上下文使用方法到当前上下文。这对于代码的重用和上下文绑定非常有帮助。\n\
    \n`call()`：它用于在给定特定 `this` 值的情况下调用函数，并逐个提供参数。\n\n`apply()`：它用于在给定特定 `this` 值的情况下调用函数，并以数组形式提供参数。\n\
    \n下面的代码有两个函数 `getTypeOfNumber()` 和 `getTypeOfAllNumber()`。这些函数的详情见下方。`getTypeOfNumber`：该方法接受单个数字作为参数，并返回偶数（Even）或奇数（Odd）。\n\
    \n`getTypeOfAllNumber`：该方法接受数字数组作为参数，并返回一个包含偶数或奇数的数组。\n\n```javascript\nvar MyNumber\
    \ = {\n    getTypeOfNumber : function(number){\n        return number % 2 ===\
    \ 0 ? \"Even\" : \"Odd\";\n    },\n    getTypeOfAllNumber : function(numbers){\n\
    \        var result = [];\n        for(var i=0; i<numbers.length; i++){\n    \
    \        result.push(numbers[i] % 2 === 0 ? \"Even\" : \"Odd\");\n        }\n\
    \        return result;\n    }\n};\nconsole.log(MyNumber.getTypeOfNumber(10));\n\
    console.log(MyNumber.getTypeOfAllNumber([10,15,20]));\n```\n*(注：由于原文代码块不完整，此处翻译时根据逻辑补全了部分代码结构以保持文档可读性)*\n\
    \n"
- fmt: "\nDifferential Inheritance is a common prototype-oriented model that uses\
    \ the concept that most objects are derived from other, more generic objects,\
    \ and only differ in a few small aspects. Each object maintains a reference to\
    \ its prototype and a table of properties that are different.\n\n### Q. What is\
    \ `Object.create()` method do?\n\nANSWER\n\nECMAScript 5.1 has this method in\
    \ its specification. This method can be used to create a new object with given\
    \ prototype object and properties. The syntax of this method is listed below.\n\
    \n`Object.create(proto[, propertiesObject])`\n\n**Example:**\n\nBelow code has\
    \ a `Student` class function with `name` property and the prototype object has\
    \ a method `getStudentName()` which return the name of the student. A new `student1`\
    \ object has been creates using `Object.create()` method by passing the prototype\
    \ object of `Student` with value of the `name` as `sandeep`. Then the `getStudentName()`\
    \ method is called on `student1` object and logged in the console.\n\n```javascript\n\
    function Student(name) {\n  this.name = name;\n}\n\nStudent.prototype = {\n  getStudentName:\
    \ function() {\n    return \"Name of Student is :\" + this.name;\n  }\n};\n\n\
    var student1 = Object.create(Student.prototype);\nstudent1.name = \"Sandeep\"\
    ;\n\nconsole.log(student1.getStudentName());\n```\n\nThe following screenshot\
    \ shows the output of the above code in the developer console.\n\n![](Images/image00059.jpeg)\n\
    \n### Q. Write a polyfill for `Object.create()` method if it is not present in\
    \ the browser?\n\nANSWER\n\nECMAScript 5.1 has this method in its specification.\
    \ If the browser is old then `Object.create()` method is not present. To resolve\
    \ this we need to write a polyfill. Below code shows the polyfill for `Object.create()`\
    \ method.\n\n```javascript\n//check if create method is present inside Object\n\
    if (typeof Object.create != 'function') {\n  //define the create method\n  Object.create\
    \ = (function() {\n    var Object = function() {};\n    return function(prototype)\
    \ {\n      if (arguments.length > 1) {\n        throw Error('Second argument not\
    \ supported');\n      }\n      if (typeof prototype != 'object') {\n        throw\
    \ TypeError('Argument must be an object');\n      }\n      Object.prototype =\
    \ prototype;\n      var result = new Object();\n      Object.prototype = null;\n\
    \      return result;\n    };\n  })();\n}\n```\n\nThe above code checks if the\
    \ `create()` method is already present inside the `Object` using `if` condition\
    \ and comparing its type to `function`. If this condition true it means the `create()`\
    \ method is not present. Then the polyfill code block gets executes and assigns\
    \ the empty object to `Object.create` property.\n\n### Q. What is the purpose\
    \ of `Object.defineProperties()` method? ANSWER\n\nECMAScript 5.1 provides `Object.defineProperties()`\
    \ method to create new properties to a defined object. It provides many configuration\
    \ options to initialize these members. Below code shows the use of this method.\n\
    \n```javascript\nfunction Student(name) {\n  this.name = name;\n}\n\nvar student1\
    \ = Object.create(Student.prototype),\nproperties = {\n  \"subject\": {\n    value:\
    \ \"Computer\",\n    writable: true,\n    enumerable:true\n  },\n  \"marks\":\
    \ {\n    value: 0,\n    writable: false,\n    enumerable:true\n  }\n};\n\nObject.defineProperties(student1,\
    \ properties);\n\nstudent1.name = \"Sandeep\";\nstudent1.subject =\"Mathematics\"\
    ;\nstudent1.marks=75;\nconsole.log(student1);\n```\n\nIn the above code a `student1`\
    \ object created using `Object.create()` method. Then some new properties like\
    \ `subject` and `marks` are added to this object. The `enumerable` option decided\
    \ whether the property can be enumerated as own property. The `writable` property\
    \ decides whether the property is modifiable or not. The `value` property takes\
    \ the default value of the property. Below screenshot shows the output of the\
    \ above code in the developer console.\n\n![](Images/image00060.jpeg)\n\n### Q.\
    \ How can you distinguish scope and context in JavaScript? ANSWER\n\nScope pertains\
    \ to the visibility of variables and context refers to the object to which a method\
    \ belongs and can be changed by using `call` or `applies`.\n\n### Q. What are\
    \ two ways in which the variable can be assigned to an empty object?\n\nANSWER\n\
    \nWhen creating a new empty object, you can instantiate the `Object()` constructor\
    \ or you can simply create an empty object literal. In either case, you can then\
    \ add properties to the new object. The syntax of creating empty object is listed\
    \ below.\n\n```javascript\nvar aEmptyObject= new Object();\nvar aEmptyObject =\
    \ {};\n```\n\n## Chapter 2 Questions on Event\n\n### Q. How Event works?\n\nANSWER\n\
    \nEvent propagation follows two phases **capturing** and **bubbling** phase.\n\
    \n![](Images/image00061.jpeg)\n\n**Capturing Phase:**\n\nIn this phase, event\
    \ first makes its way downwards from the `DOCUMENT` to the `target` element by\
    \ passing all inner elements.\n\n**Bubbling Phase:**\n\nIn this phase event makes\
    \ its way back upwards from the `target` element to `DOCUMENT` by passing all\
    \ outer wrapped elements.\n\n### Q. How to attach event to an element?\n\nANSWER\n\
    \nAccording to DOM Level 2 Event Specification an event can be attached to an\
    \ element using `addEventListener()` method using `three` arguments.\n\n**Syntax**:\n\
    \n`<element>.addEventListener(<eventname>,<eventcallback>,<booleanphase>)`\n\n\
    **eventname:**\n\nRepresents type of event as String parameter. For Example `click`,\
    \ `mouseover`, `mouseout` etc.\n\n**eventcallback**:\n\nThis represents the callback\
    \ function to be called for the event to be handled.\n\n**booleanphase:**\n\n\
    This represents the phase of the event where the listener is attached. A FALSE\
    \ value represents the bubbling phase and a TRUE value represents the capturing\
    \ phase.\n\n**Example:**\n\n```javascript\nA click event listener is added to\
    \ the document which alerts a message when click.\ndocument.addEventListener('click',\
    \ function () { alert(\"Insider Event\"); },false);\n```\n\n### Q. How to attach\
    \ event prior to IE9 version? ANSWER\n\nIn IE an event can be attached to an element\
    \ using `attachEvent()` method. Only For bubbling phase a listener can be added.\n\
    \n**Syntax:**\n\n`<element>.attachEvent(<eventname>,<eventcallback>)`\n\n**Example:**\n\
    \nA click event listener is added to the document which alerts a message when\
    \ click. Below screenshot shows adding a click event in IE 10.\n\n![](Images/image00062.jpeg)\n\
    \nExcept IE, the other browser added by `addEventListener()` method. Below screenshot\
    \ shows the demonstration this method in Firebug.\n\n![](Images/image00063.jpeg)\n\
    \n### Q. How to remove event listener? ANSWER\n\nAccording to DOM Level 2 Event\
    \ Specification an Event Listener can be removed using `removeEventListener()`\
    \ method. For IE `detachEvent()` method must be used.\n\nThe following screenshot\
    \ shows detaching click event handler from document for IE.\n\n![](Images/image00064.jpeg)\n\
    \nThe following screenshot shows removing click event handler from document for\
    \ Firefox browser.\n\n![](Images/image00065.jpeg)\n\n### Q. How setTimeOut() and\
    \ clearTimeOut() function works? ANSWER\n\nThe `setTimeout()` method calls a function\
    \ or evaluates an expression once after a specified number of milliseconds. `clearTimeOut()`\
    \ method stop the execution of the function specified in the `setTimeout()` method.\n\
    \n**Syntax:**\n\n`var timeOut = setTimeout(function,milliseconds,lang) clearTimeout(timeOut)`\n\
    \nBelow code shows the demonstration of these time out methods.\n\n```javascript\n\
    var timeOutHandler= function(){\n  console.log(\"inside Time Now \", new Date().getSeconds());\
    \ \n  clearTimeOut(timeOut)\n}\n\nconsole.log(\"Time Now \", new Date().getSeconds());\
    \ \nvar timeOut = setTimeout(timeOutHandler,4000);\n```\n\nBelow screenshot show\
    \ the execution of the `timeOutHandler()` method after 4 seconds.\n\n![](Images/image00066.jpeg)\n\
    \n### Q. How setInterval() and clearInterval() function works? ANSWER\n\nThe `setInterval()`\
    \ method calls a function or evaluates an expression in specified interval of\
    \ milliseconds. `clearInterval()` method stop the execution of the function specified\
    \ in the `setInterval()` method.\n\n**Syntax:**\n\n`var timeInterval = setInterval(function,\
    \ milliseconds) clearInterval(timeInterval)`\n\nBelow code demonstrate these interval\
    \ handlers.\n\n```javascript\nvar counter = 0,\ntimeIntervaltHandler= function(){\n\
    ```\n"
