    \ Kumar Patel**.\n\n## Table of Contents\n\nQuick JavaScript Interview Questions\
    \ Table of Contents\n* Chapter 1 Inheritance\n* Chapter 2 Questions on Event\n\
    * Chapter 3 Closure\n* Chapter 5 Questions on DOM\n* Chapter 6 Date Object\n*\
    \ Chapter 7 Regular Expression\n* Chapter 8 Questions on Canvas API\n* Chapter\
    \ 9 Geo Location API\n* Chapter 10 Web Workers\n* Chapter 11 Local Storage\n*\
    \ Chapter 12 File API\n* Chapter 13 Web RTC\n* Chapter 14 Drag & Drop API\n* Chapter\
    \ 15 App Cache API\n* Chapter 16 Server Sent Events\n* Chapter 17 Miscellaneous\
    \ Questions About The Author\n* One Last Thing...\n\n## Chapter 1 Inheritance\n\
    \n### Q. How to create a class?\n\n**ANSWER**\n\nJavaScript does not have a class\
    \ definition. To mimic classes in JavaScript functions can be used to declare\
    \ a class.\n\n**Example**:\n\nLet’s create a student class in JavaScript which\
    \ takes two parameters `name` and `roll` as property. The code will look like\
    \ below,\n\n```javascript\nfunction Student(name,roll){ \n    this.name = name;\n\
    \    this.roll = roll; \n}\n```\n\n### Q. How to create an object?\n\n**ANSWER**\n\
    \nAn object in JavaScript can be created using two ways:\n\n**New Keyword:**\n\
    \nTo create a student object from the above student class we can call the `Student`\
    \ function using `new` keyword.\n\n```javascript\nvar student1 = new Student('sandeep’,2)\n\
    ```\n\n**Anonymous Object:**\n\nAnonymous objects can be created using pair of\
    \ curly braces containing property name and value pairs.\n\n```javascript\nVar\
    \ rose = {‘color’: ’red’}\n```\n\n### Q. How to declare a private and a public\
    \ member?\n\nPrivate members are declared using `var` keyword and constructor\
    \ function.\n\n```javascript\nfunction Student(name,roll){ \n    var id= ABCD123;\n\
    \    this.name = name;\n    this.roll = roll;\n}\n```\n\nWhen a `Student` object\
    \ will be created the propertied `name` and `roll` will be accessible using dot\
    \ operator but `id` will not be accessible as it behaves as a private member and\
    \ return `undefined` on call.\n\n![](Images/image00050.jpeg)\n\nThe above chrome\
    \ console is showing a `student1` object is created.`name` property is accessible\
    \ as it is showing sandeep on `student1.name` call. So `name` is a public property\
    \ for the student object. But `id` property is not accessible and returned `undefined`\
    \ on `student1.id` call. This shows `id` is a private property in `student1` object.\n\
    \n### Q. What is prototype property?\n\nBy Using `Prototype` we can add `new members`\
    \ to an existing object. Every JavaScript object has this property internally.\
    \ Initially it is an `empty` object.\n\n**Example:**\n\n```javascript\nfunction\
    \ Student(name,roll){\n    this.name = name;\n    this.roll = roll;\n}\n\nvar\
    \ student1 = new Student('sangeeta',30); \nStudent.prototype.mark = 100; \n```\n\
    \nCheckout the below chrome console for the use of protype.\n\n![](Images/image00051.jpeg)\n\
    \nInitially the `student1` object has only two properties `name` and `roll`. By\
    \ using prototype a new property `mark` has been added to student object with\
    \ a value of `100`.Now the console shows that the `mark` property is also added\
    \ to the existing `student1` object.\n\n### Q. What is constructor property?\n\
    \n**ANSWER**\n\nConstructor property of an object maintains a reference to its\
    \ creator function.\n\n**Example**:\n\nLet us checkout an example by creating\
    \ a student object and calling the constructor property on it.\n\n```javascript\n\
    function Student(name, mark){\n    this.name=name;\n    this.mark =mark;\n}\n\n\
    var student1 = new Student('sandeep',123); \nconsole.log(student1.constructor);\n\
    ```\n\nCheckout the following screen shot for above code in chrome console. The\
    \ console log is printing the referenced function by `student1` object.\n\n![](Images/image00052.jpeg)\n\
    \n### Q. How to call other class methods?\n\n**ANSWER**\n\nUsing `call()` and\
    \ `apply()` method we can use methods from different context to the current context.\
    \ It is really helpful in reusability of code and context binding.\n\n`call()`\
    \ : It is used to calls a function with a given `this` value and arguments provided\
    \ individually.\n\n`apply()`: It is used to call a function with a given `this`\
    \ value and arguments provided as an array.\n\nBelow code has two function `getTypeOfNumber()`\
    \ and `getTypeOfAllNumber().`. The details pf these functions are below. `getTypeOfNumber`\
    \ : This method takes single number as parameter and return the type either Even\
    \ or Odd.\n\n`getTypeOfAllNumber` : This method takes array of numbers as parameter\
    \ and return the types in an array with Even or Odd.\n\n```javascript\nvar MyNumber\
    \ = {\n    getTypeOfNumber : function(number){\n        var type = (number % 2\
    \ === 0) ? \"Even\" : \"Odd\"; return type;\n    },\n    getTypeOfAllNumber :\
    \ function (){\n        var result = [],i=0;\n        for (; i < arguments.length;\
    \ i++){\n            var type = MyNumber.getTypeOfNumber.call(null,arguments[i]);\n\
    \            result.push(type)\n        }\n        return result;\n    }\n};\n\
    \nvar typeOfNumber = MyNumber.getTypeOfNumber.call(null,21); \nconsole.log(typeOfNumber)\n\
    \nvar typeOfAllNumber = MyNumber.getTypeOfAllNumber.apply(null,[2,4,5,7 8,21])\n\
    console.log(typeOfAllNumber) \n```\n\nBelow screenshot shows output of the above\
    \ code Firebug console.\n\n![](Images/image00053.jpeg)\n\n### Q. Explain method\
    \ overriding with an Example?\n\n**ANSWER**\n\nWe can override any inbuilt method\
    \ of JavaScript by declaring its definition again. The existing definition is\
    \ accessible to override by the `prototype` property. Consider the below example,\
    \ `split()` is an built-in method for a string object .Its default behaviour to\
    \ break the specified string to an array and is a member function of `String`\
    \ class. But we have overridden its definition using its prototype property.\n\
    \nBelow screenshot shows the inbuilt behaviour of `split()` method. It has divided\
    \ the string into an array of element.\n\n![](Images/image00054.jpeg)The following\
    \ screenshot shows the new overridden definition of `split()` method. It is now\
    \ normally returns string “I am overriden”.\n\n![](Images/image00055.jpeg)\n\n\
    ### Q. How to inherit from a class?\n\n**ANSWER**\n\nInheritance can be achieved\
    \ in JavaScript using `prototype` property.\n\n![](Images/image00056.jpeg)We need\
    \ to follow 2 steps to create an inheritance\n\n**Step1:**\n\nChild class prototype\
    \ should point to parent class object.\n\n`<ChildClassName>.prototype = new <ParentClass>();`\n\
    \n**Step2:**\n\nReset the child class prototype constructor to point self.\n\n\
    `<ChildClassName>.prototype.constructor=<ChildClassName>`\n\n**Example:**\n\n\
    Below example shows `inputFields` class as a child class of `Student` class. As\
    \ the method `showMyType()` is available for ScienceStudent object.\n\n```javascript\n\
    function Student(name){\n    this.name=name;\n}\n\nStudent.prototype.sayMyType\
    \ = function(){\n    console.log(\"I am student type\")\n}\n\nfunction ScienceStudent(name){\n\
    }\n\ninputFields.prototype = new Student();\n\ninputFields.prototype.constructor\
    \ = ScienceStudent;\n\nvar student2 = new ScienceStudent('sangeeta');\n\nconsole.log(student2.sayMyType());\
    \ \n```\n\nCheck out the below screen shot for the output of the above code in\
    \ the developer console.\n\n![](Images/image00057.jpeg)\n\nTo test the type of\
    \ an object belongs to a class or not `instanceOf` can be used. This returns a\
    \ Boolean value, **TRUE** for an object belongs to a class or else **FALSE**.\
    \ Check the below screen shot for the test of `student2` object using `instanceOf`.\n\
    \n![](Images/image00058.jpeg)\n\n### Q. What is differential inheritance?\n\n\
    **ANSWER**\n"
