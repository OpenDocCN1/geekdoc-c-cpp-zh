    \ to programmatically update the cache.\n\n## **Chapter 16 Server Sent Events**\n\
    \nQ. What is Server Side Events (SSE)?\n\n**ANSWER**\n\nHTML5 provides server\
    \ side events feature by which a web page gets the update from the server automatically.\
    \ A great example of this feature is Facebook notification or Google + updates.\n\
    \nQ. What is the content type of the server sent response? **ANSWER**\n\nThe content\
    \ type of the server response is “**text/event-stream**” for the “**Content-Type**”\
    \ header.\n\nQ. How to create an event source for listening to server updates?\
    \ **ANSWER**\n\nAn event source can be created by instantiating the object of\
    \ **EventSource** class with a server path. The syntax for creating an event source\
    \ is listed below.\n\nvar source = new EventSource(“<URL to Server>”);\n\nQ. What\
    \ are the event types is fired by an EventSource? **ANSWER**\n\nAn EventSource\
    \ fires 3 different events. Callback methods can be attached to the source for\
    \ listening to these events. These event types are listed below.\n\n**onopen**\
    \ : This event is fired when the server open the connection to the browser.\n\n\
    **onmessage**: This event is fired when server produces the new output to the\
    \ stream.\n\n**onerror**: This event is fired when an error occurs by some means.\n\
    \nQ. How to close an event stream?\n\n**ANSWER**\n\nThe event stream can be closed\
    \ using **close()** method.\n\nQ. What is the format of event stream?\n\n**ANSWER**\n\
    \nThe event stream is a simple stream of text data, which must be encoded using\
    \ **UTF-8**. Each message is separated by a pair of newline characters. A colon\
    \ as the first character of a line is, in essence, a comment, and is ignored.\n\
    \n## **Chapter 17 Miscellaneous Questions**\n\nQ. What is strict mode?\n\n**ANSWER**\n\
    \nStrict mode is a new directive in new ECMA 5 JavaScript specification. It is\
    \ used for secure JavaScript coding. It eliminates some JavaScript silent errors\
    \ by changing them to throw errors.\n\nThe syntax of writing strict mode is below\
    \ expression.\n\n“use strict”\n\nBelow code shows the use of strict mode inside\
    \ a function.\n\n function sayHello(){\n\n\"use strict\";\n\nmyName = \"Sandeep\"\
    ; \n\n}\n\nsayHello();"
