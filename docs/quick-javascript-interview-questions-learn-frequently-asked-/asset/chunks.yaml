  trans: "\n\n差异继承（Differential Inheritance）是一种常见的面向原型模型，它认为大多数对象都派自其他更通用的对象，且仅在少数细微方面有所不同。每个对象都维护对其原型的引用以及一个不同属性的表。\n\
    \n### Q. `Object.create()` 方法的作用是什么？\n\n答：\n\nECMAScript 5.1 在其规范中包含了此方法。该方法可用于根据指定的原型对象和属性创建一个新对象。该方法的语法列如下：\n\
    \n`Object.create(proto[, propertiesObject])`\n\n**示例：**\n\n以下代码包含一个具有 `name` 属性的\
    \ `Student` 类函数，且原型对象拥有一个 `getStudentName()` 方法，该方法返回学生的名字。使用 `Object.create()`\
    \ 方法通过传递 `Student` 的原型对象并将 `name` 的值设为 `sandeep`，创建了一个新的 `student1` 对象。然后并在 `student1`\
    \ 对象上调用了 `getStudentName()` 方法并在控制台中打印输出。\n\n```javascript\nfunction Student(name)\
    \ {\n  this.name = name;\n}\n\nStudent.prototype = {\n  getStudentName: function()\
    \ {\n    return \"Name of Student is :\" + this.name;\n  }\n};\n\nvar student1\
    \ = Object.create(Student.prototype);\nstudent1.name = \"Sandeep\";\n\nconsole.log(student1.getStudentName());\n\
    ```\n\n下面的截图显示了上述代码在开发者控制台中的输出。\n\n![](img/image00059.jpeg)\n\n### Q. 如果浏览器不存在\
    \ `Object.create()` 方法，请为其编写一个 polyfill（填充函数）？\n\n答：\n\nECMAScript 5.1 规范中有此方法。如果浏览器较旧，则不存在\
    \ `Object.create()` 方法。为了解决这个问题，我们需要编写一个 polyfill。以下代码展示了 `Object.create()` 方法的\
    \ polyfill。\n\n```javascript\n//检查内部是否存在 create 方法\nif (typeof Object.create !=\
    \ 'function') {\n  //定义 create 方法\n  Object.create = (function() {\n    var Object\
    \ = function() {};\n    return function(prototype) {\n      if (arguments.length\
    \ > 1) {\n        throw Error('Second argument not supported');\n      }\n   \
    \   if (typeof prototype != 'object') {\n        throw TypeError('Argument must\
    \ be an object');\n      }\n      Object.prototype = prototype;\n      var result\
    \ = new Object();\n      Object.prototype = null;\n      return result;\n    };\n\
    \  })();\n}\n```\n\n上述代码通过 `if` 条件判断其类型是否为 `function` 来检查 `Object` 内部是否已存在 `create()`\
    \ 方法。如果该条件成立，则意味着不存在 `create()` 方法。然后执行 polyfill 代码块并将空对象赋值给 `Object.create` 属性。\n\
    \n### Q. `Object.defineProperties()` 方法的目的是什么？ 答\n\nECMAScript 5.1 提供了 `Object.defineProperties()`\
    \ 方法来为定义对象创建新属性。它提供了许多配置选项来初始化这些成员。以下代码展示了该方法的用法。\n\n```javascript\nfunction Student(name)\
    \ {\n  this.name = name;\n}\n\nvar student1 = Object.create(Student.prototype),\n\
    properties = {\n  \"subject\": {\n    value: \"Computer\",\n    writable: true,\n\
    \    enumerable:true\n  },\n  \"marks\": {\n    value: 0,\n    writable: false,\n\
    \    enumerable:true\n  }\n};\n\nObject.defineProperties(student1, properties);\n\
    \nstudent1.name = \"Sandeep\";\nstudent1.subject =\"Mathematics\";\nstudent1.marks=75;\n\
    console.log(student1);\n```\n\n在上述代码中，使用 `Object.create()` 方法创建了一个 `student1`\
    \ 对象。然后向该对象添加了一些如 `subject` 和 `marks` 的新属性。`enumerable` 决定了属性是否可以作为自身属性被枚举。`writable`\
    \ 属性决定了属性是否可修改。`value` 属性获取属性的默认值。下面的截图显示了上述代码在开发者控制台中的输出。\n\n![](img/image00060.jpeg)\n\
    \n### Q. 如何在 JavaScript 中区分作用域（scope）和上下文（context）？ 答\n\n作用域涉及变量的可见性，而上下文指的是方法所属的对象，并且可以使用\
    \ `call` 或 `applies` 进行更改。\n\n### Q. 有哪两种方法可以将变量赋值给空对象？\n\n答：\n\n创建新的空对象时，你可以实例化\
    \ `Object()` 构造函数，也可以简单地创建一个空对象字面量。在任何情况下，你随后都可以向新对象添加属性。创建空对象的语法列如下：\n\n```javascript\n\
    var aEmptyObject= new Object();\nvar aEmptyObject = {};\n```\n\n## 第 2 章关于事件的问题\n\
    \n### Q. 事件是如何工作的？\n\n答：\n\n事件传播遵循两个阶段：**捕获**阶段和**冒泡**阶段。\n\n![](img/image00061.jpeg)\n\
    \n**捕获阶段：**\n\n在此阶段，事件首先从 `DOCUMENT` 向下传递到 `target` 元素，并经过所有内部元素。\n\n**冒泡阶段：**\n\
    \n在此阶段，事件从 `target` 元素向上返回 `DOCUMENT`，并经过所有外层包裹元素。\n\n### Q. 如何向元素绑定事件？\n\n答：\n\
    \n根据 DOM Level 2 事件规范，可以使用 `addEventListener()` 方法通过 `三个` 参数将事件绑定到元素上。\n\n**语法**：\n\
    \n`<element>.addEventListener(<eventname>,<eventcallback>,<booleanphase>)`\n\n\
    **eventname**：用字符串表示事件类型，例如 `click`、`mouseover`、`mouseout` 等。\n\n**eventcallback**：这代表要调用的回调函数。\n\
    \n**booleanphase**：这代表处理事件的阶段。FALSE 值代表冒泡阶段，TRUE 值代表捕获阶段。\n\n**示例**：\n\n```javascript\n\
    为文档添加事件监听器，点击时弹出消息。\ndocument.addEventListener('click', function () { alert(\"\
    Insider Event\"); },false);\n```\n\n### Q. 在 IE 版本中如何向元素绑定事件？ 答\n\n在 IE 中，可以使用\
    \ `attachEvent()` 方法向元素绑定事件。仅在冒泡阶段可以添加监听器。\n\n**语法**：\n\n`<element>.attachEvent(<eventname>,<eventcallback>)`\n\
    \n**示例**：\n\n为文档添加事件监听器，点击时弹出消息。下面的截图显示了在 IE 中添加。\n\n![](img/image00062.jpeg)\n\
    \n除了 IE，其他浏览器通过 `addEventListener()` 方法添加。下面的截图显示了在 Firefox 中使用该方法。\n\n![](img/image00063.jpeg)\n\
    \n### Q. 如何移除事件监听器？ 答\n\n根据 DOM Level 2 事件规范，可以使用 `removeEventListener()` 方法移除事件监听器。对于\
    \ IE，必须使用 `detachEvent()` 方法。\n\n下面的截图显示了在 IE 中解离点击事件处理器。\n\n![](img/image00064.jpeg)\n\
    \n下面的截图显示了在 Firefox 浏览器中移除点击事件处理器。\n\n![](img/image00065.jpeg)\n\n### Q. `setTimeout()`\
    \ 和 `clearTimeOut()` 函数是如何工作的？ 答\n\n`setTimeout()` 方法在指定的毫秒数后调用一次函数或评估表达式。`clearTimeOut()`\
    \ 方法停止在 `setTimeout()` 方法中指定的函数执行。\n\n**语法**：\n\n`var timeOut = setTimeout(function,milliseconds)\
    \ clearTimeout(timeOut)`\n\n以下代码展示了这些超时方法的演示。\n\n```javascript\nvar timeOutHandler=\
    \ function(){\n  console.log(\"inside Time Now \", new Date().getSeconds()); \n\
