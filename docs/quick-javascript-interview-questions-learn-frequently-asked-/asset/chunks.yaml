    \ 计算乘法结果，结果渲染在浏览器中。前述代码的输出如对应的截图所示。\n\n![](img/image00092.jpeg)\n\n## Q. 如何在 web\
    \ worker 中处理错误？\n\n**答案**\n\n我们可以在 web worker 中使用 `throw` 关键字抛出错误。可以将回调方法附加到 `error`\
    \ 事件上，以处理生成的错误。`positiveNoSqaureWorkerDemo.html` 文件包含一个只接受正数作为输入的 worker。如果传递了负数，它将抛出错误。该文件的代码内容如下。\n\
    \n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"\
    UTF-8\">\n\n<title>Web Worker 错误处理器示例</title>\n\n</head>\n\n<body>\n\n<h1 id=\"\
    resultContainer\"></h1>\n\n<input type=\"number\" id=\"number1\" value=\"-4\"\
    \ placeholder=\"输入数字\"> <button id=\"squareResult\">平方</button>\n\n<script id=\"\
    squareWorker\" type=\"javascript/worker\">\n\nself.addEventListener(\"message\"\
    ,function(event){\n\nvar requestData = event.data,\n\nnumber1 = requestData.number1,\n\
    \nsquareResult = 0;\n\nif(number1>0) {\n\nsquareResult = number1 * number1\n\n\
    self.postMessage({result:squareResult});\n\n} else{\n\n// 负数抛出错误\n\nthrow \"It\
    \ is a negative number.Please supply a positive number.\"; }\n\n});\n\n</script>\n\
    \n<script>\n\nvar *textContent* = document.querySelector('#squareWorker').textContent,\n\
    \n*workerBlob* = new Blob([*textContent*]),\n\n*workerURL* = window.URL.createObjectURL(*workerBlob*),\n\
    \n*squareWorker* = new Worker(*workerURL*),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"),\n\n*squareResult* = document.getElementById(\"squareResult\"\
    ),\n\n*number1* = document.getElementById(\"number1\");\n\n*squareResult*.addEventListener(\"\
    click\", function () {\n\n*squareWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10)\n\
    \n});\n\n*squareWorker*.addEventListener(\"message\", function (workerEvent) {\n\
    \nvar responseData = workerEvent.data,\n\nresult = responseData.result;\n\n*resultContainer*.innerText\
    \ = \"Result: \" + result;\n\n});\n\n*squareWorker*.addEventListener('error',\
    \ function(workerEvent){\n\n*resultContainer*.innerText = \"Error: \" + workerEvent.message;\
    \ }, false);\n\n</script>\n\n<body>\n\n</html> Q. 如何在 web worker 中导入外部脚本？演示一个示例？\n\
    \n**答案**\n\n要在 worker 内部导入外部脚本，我们需要使用 `importScripts()` 方法并以文件名作为参数。为了演示导入，我们创建了三个文件：`greatest-script.js`、`numberWorker.js`\
    \ 和 `numberWorkerDemo.html`。下图显示了这些文件。\n\n![](img/image0093.jpeg)\n\n`greatest-script.js`\
    \ 是我们需要导入到 web worker 的外部脚本。它有一个方法 `findGreatestNumber()` 用于找出两个数字中较大的一个。以下代码是\
    \ `greatest-script.js` 文件的内容。\n\n```javascript\nvar findGreatestNumber = function(number1,number2){\n\
    \nreturn number1>number2 ? number1 : number2;\n\n};\n```\n\n`numberWorker.js`\
    \ 文件包含了在 worker 内部导入外部脚本的回调方法。以下代码是 `numberWorker.js` 文件的内容。\n\n```javascript\n\
    self.addEventListener(\"message\",function(event){\n\nimportScripts('greatest-script.js');\
    \ var responseData = event.data, \n\nnumber1 = requestData.number1,\n\nnumber2\
    \ = requestData.number2,\n\ngreatestNumber = findGreatestNumber(number1,number2);\
    \ self.postMessage({result:greatestNumber});\n\n});\n```\n\n`numberWorkerDemo.html`\
    \ 文件包含了实例化数字 worker 并响应消息的代码。以下代码是 `numberWorkerDemo.html` 文件的内容。\n\n```html\n\
    <!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"UTF-8\">\n\
    \n<title>Time Web Worker 示例</title>\n\n</head>\n\n<body>\n\n<h1 id=\"resultContainer\"\
    ></h1>\n\n<input type=\"number\" id=\"number1\" value=\"7\" placeholder=\"输入第一个数字\"\
    > <input type=\"number\" id=\"number2\" value=\"9\" placeholder=\"输入第二个数字\">\n\
    \n<button id=\"greatButton\">寻找最大数字</button>\n\n<script>\n\nvar *numberWorker*\
    \ = new Worker(\"numberWorker.js\"), *resultContainer* = document.getElementById(\"\
    resultContainer\"), *greatButton* = document.getElementById(\"greatButton\"),\n\
    \n*number1* = document.getElementById(\"number1\"),\n\n*number2* = document.getElementById(\"\
    number2\");\n\n*greatButton*.addEventListener(\"click\", function () {\n\n*numberWorker*.postMessage({\n\
    \nnumber1:parseInt(*number1*.value,10),\n\nnumber2: parseInt(*number2*.value,10)\n\
    \n});\n\n});\n\n*numberWorker*.addEventListener(\"message\", function (workerEvent)\
    \ {\n\nvar responseData = workerEvent.data,\n\nresult = responseData.result;\n\
    \n*resultContainer*.innerText = \"Result: \" + result;\n\n});\n\n</script>\n\n\
    <body>\n\n</html>\n\n"
