    \ `drawImage()` 方法在画布内部从 URL 加载 PNG 图像。\n\n```html\n<html>\n<body>\n<canvas id=\"\
    myCanvas\"></canvas>\n<script>\nvar canvas = document.getElementById(\"myCanvas\"\
    ), context = canvas.getContext(\"2d\"),\nimg = new Image();\nimg.src = \"http://www.gravatar.com/avatar/4205261332ff131e971b48db31dcb528.png\"\
    ;\nimg.onload = function() {\ncontext.drawImage(img, 10, 10);\n};\n</script>\n\
    </body>\n</</html>\n```\n\n下面的截图显示了 Gravatar 图像在 HTML5 画布元素内部绘制。此绘制是使用 2d 上文完成的。\n\
    \n![](img/image00087.jpeg)\n\n## Q. drawImage() 方法的不同重载签名分别有哪些？\n\n**答案**\n\n\
    `drawImage()` 方法有 3 种不同的签名，列如下：\n\n- `drawImage(img, x, y)`：此方法将图像置于画布上的 `<x,\
    \ y>` 坐标。\n- `drawImage(img, x, y, width, height)`：此方法将图像置于画布上的 `<x, y>` 坐标，并带有指定的\
    \ `height`。\n- `drawImage(img, sx, sy, swidth, sheight, x, y, width, height)`：此方法裁剪起始点为\
    \ `<sx, sy>`、高度为 `sheight` 宽度为 `swidth` 的图像，并将其置于 `<x, y>` 坐标，带有指定的 `height` 和\
    \ `width`。\n\n## 第 9 章 Geo Location API\n\n### Q. 什么是 Geo Location API？\n\n**答案**\n\
    \nGeo Location API 将用户的位置发布到网络。由于隐私原因，它需要用户的权限。Geo location API 存在于 `navigator.geolocation`\
    \ 对象中。\n\n### Q. 如何判断浏览器是否支持 Geo Location API？\n\n**答案**\n\n可以通过判断 navigator 对象内部\
    \ `geolocation` 对象的真值来确定浏览器是否支持 Geo location API。以下代码包含一个函数，它根据 navigator 内部是否存在\
    \ geolocation 对象返回 true 或 false 布尔值。\n\n```javascript\nfunction isGeoLocationSupported(){\n\
    var flag = navigator.geolocation ? true : false; return flag;\n}\n\nvar isSupported\
    \ = isGeoLocationSupported(); if(isSupported){\nconsole.log(navigator.geolocation);\n\
    }else{\nconsole.log(\"Geo Location API not supprted\"); } \n```\n\n接下来的截图显示了上述代码的输出，因为\
    \ navigator API 中存在 geolocation 对象。![](img/image00088.jpeg)\n\n## 第 10 章 Web Workers\n\
    \n### Q. 什么是 Web Worker？\n\n**答案**\n\nWeb Workers 是 HTML5 的新功能，用于在 Web 应用中实现 JavaScript\
    \ 执行的并发。Web worker 是在浏览器后台运行的 JavaScript 文件，不会影响页面性能。这有助于解决长期以来存在的“无响应脚本警告框”问题。通常，这些工作可以用于大量的计算任务。\n\
    \n### Q. 如何检测浏览器是否支持 Web Worker？\n\n**答案**\n\n我们可以通过验证 window 对象中是否存在 `Worker`\
    \ 属性来检查浏览器对 Web Worker 的支持。检查 Web Worker 支持的代码如下：\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<title>Web Worker</title>\n</head>\n<body> \n<script>\n\
    var isWorkerSupported = window.Worker ? true : false; console.log(\"Is Web Worker\
    \ Supported: \"+isWorkerSupported);\n</script>\n</body>\n</</html>\n```\n\n在之前的代码中，变量\
    \ `isWorkerSupported` 可以根据 window 对象内部是否存在 `Worker` 属性包含 TRUE 或 FALSE 值。接下来的截图显示了上述代码在\
    \ chrome 控制台中的输出。\n\n![](img/image00089.jpeg)\n\n### Q. 什么是专用工作（dedicated worker）？\n\
    \n**答案**\n\n专用工作只能由调用脚本访问。可以使用 `worker` 构造函数创建专用工作。创建新的专用 worker 的语法列如下：\n\n```javascript\n\
    var aDedicatedWorker = new Worker(\"script.js\")\n```\n\n`Worker` 对象内部的参数将作为 worker\
    \ 运行的 JavaScript 文件。\n\n### Q. 什么是共享工作（shared worker）？\n\n**答案**\n\n共享工作可以被多个脚本访问。共享工作可以被相同源的多个窗口、iframe\
    \ 访问。创建新的共享 worker 的语法如下：\n\n```javascript\nvar aSharedWorker = new SharedWorker(\"\
    script.js\")\n```\n\n### Q. 开发一个显示时间的专用 worker？\n\n**答案**\n\n在 `dateWorker.js`\
    \ 文件中创建时间 worker，我们可以在 `dateWorker.html` 文件中调用此 worker。下面的代码展示了 `dateWorker.js`\
    \ 文件的内容，它每秒监听消息并发布当前时间。\n\n```javascript\nself.addEventListener(\"message\",function(event){\
    \ setInterval(function(){\nvar time = new Date();\nself.postMessage({\nhour :time.getHours(),\n\
    minute: time.getMinutes(),\nsecond: time.getSeconds() \n},1000);\n});\n```\n\n\
    下面的代码展示了 `dateWorker.html` 的内容，包含了 worker 的实例化以及对 worker 响应的监听。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Time\
    \ Worker Demo</title>\n</head>\n<body>\n<h1 id=\"resultContainer\"></h1>\n<button\
    \ id=\"timeButton\">Get Time</button>\n<script>\nvar dateWorker = new Worker(\"\
    dateWorker.js\"),\nresultContainer = document.getElementById(\"resultContainer\"\
    ), timeButton = document.getElementById(\"timeButton\");\n\ntimeButton.addEventListener(\"\
    click\",function(){\ndateWorker.postMessage(null);\n});\n\ndateWorker.addEventListener(\"\
    message\",function(workerEvent){ var responseData = workerEvent.data,\nhour =\
    \ responseData.hour,\nminute = responseData.minute,\nsecond = responseData.second;\n\
    \nresultContainer.innerText = \"HOUR: \"+hour +\n\" MINUTE: \" +minute +\" SECOND:\
    \ \"+second; });\n</script>\n</body>\n</html>\n```\n\n接下来的截图显示了上述代码的输出，小时、分钟和秒是从\
    \ worker 响应中显示的。\n\n![](img/image0090.jpeg)\n\n### 开发一个计算数字平方的专用 worker？\n\n**答案**\n\
    \n平方 worker 的定义存在 `doSquareWorker.js` 文件中，它监听消息并生成数字的平方。平方 worker 在 `squareWorkerDemo.html`\
    \ 文件中实例化，它监听平方 worker 的响应并在浏览器中打印。`doSquareWorker.js` 文件的代码内容如下。\n\n```javascript\n\
    self.addEventListener(\"message\",function(event){\nvar inputData = event.data,\n\
    inputNumber = parseInt(inputData.number,10),\nsquareResult = Math.pow(inputNumber,2);\
    \ \n\nself.postMessage({result:squareResult});\n});\n```\n\n`squareWorkerDemo.html`\
    \ 文件具有以下代码。\n\n```html\n<!DOCTYPE html>\n<html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"UTF-8\">\n```\n"
