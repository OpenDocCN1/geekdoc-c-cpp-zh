    \ 文件的代码如下。\n\n```javascript\nself.addEventListener(\"connect\", function (event)\
    \ {\n\nvar port = event.ports[0];\n\nport.addEventListener(\"message\", function\
    \ (event) {\n\nvar requestData = event.data,\n\ninputString = requestData.string,\n\
    \nstringLength = inputString.length;\n\nport .postMessage({result:stringLength});\n\
    \n}, false);\n\nport.start(); \n\n}, false);\n```\n\n`lengthWorkerDemo.html` 文件包含了实例化共享线程并在浏览器中渲染响应的代码。`lengthWorkerDemo.html`\
    \ 文件的内容内容所示：\n\n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n<\
    \ meta charset=\"UTF-8\">\n\n<title>Shared Web Worker Demo</title> </head>\n\n\
    <body> \n\n<h1 id=\"resultContainer\"></h1>\n\n<input type=\"text\" id=\"inputString\"\
    \ value=\"Hello\" placeholder=\"Enter a string\"> <button id=\"lengthButton\"\
    >Get Length</button>\n\n<script>\n\nvar lengthWorker = new SharedWorker(\"calculateLengthWorker.js\"\
    ), resultContainer = document.getElementById(\"resultContainer\"), lengthButton\
    \ = document.getElementById(\"lengthButton\"), inputString = document.getElementById(\"\
    inputString\");\n\nlengthButton .addEventListener(\"click\", function () {\n\n\
    resultContainer.innerText = \"\";\n\nlengthWorker.port.postMessage({\n\nstring\
    \ :inputString.value\n\n});\n\n});\n\n//启动线程\n\nlengthWorker.port.start();\n\n\
    //线程的成功处理程序\n\nlengthWorker.port.addEventListener(\"message\", function (workerEvent)\
    \ {\n\nvar responseData = workerEvent.data,\n\nresult = responseData.result;\n\
    \nresultContainer.innerText = \"Result: \" + result;\n\n});\n\n</script>\n\n</body>\n\
    \n</</html> \n```\n\n上述代码的输出显示如下截图所示，展示了输入字符串的长度。\n\n![](img/image00096.jpeg)\n\
    \n## 第 11 章 本地存储 (Local Storage)\n\n### Q. 什么是本地存储？\n\n**答案**\n\nHTML5 提供了一项在终端用户浏览器中本地存储数据的功能。数据以键值对的形式存储在浏览器中。与\
    \ cookie 不同，它的平均空间为 5 MB。这种存储分为两种类型：`sessionStorage` 和 `localStorage`。\n\n`localStorage`：它存储没有过期日期的数据。`sessionStorage`：它存储带有过期日期的数据。\n\
    \n### Q. 哪一个是主存储接口？\n\n**答案**\n\n`window.Storage()` 是实现 `localStorage` 和 `sessionStorage`\
    \ 的主接口。该接口的定义如下。\n\n```javascript\ninterface Storage {\n\nreadonly attribute unsigned\
    \ long length;\n\nDOMString? key(unsigned long index);\n\ngetter DOMString? getItem(DOMString\
    \ key);\n\nsetter creator void setItem(DOMString key, DOMString value); deleter\
    \ void removeItem(DOMString key);\n\nvoid clear();\n\n}\n```\n\n上述代码的详情如下：\n\n\
    `setItem(key,value)`：此方法使用`key-value`对在存储中存储值。\n\n`getItem(key)`：此方法使用键检索存储的对象。\n\
    \n`removeItem(key)`：此方法根据键删除存储的项。\n\n`clear()`：从存储中删除所有项。`length`：此属性返回存储的长度，即存储器内部元素的数量。\n\
    \n`key(position)`：此方法返回给定数字位置处值对应的键。\n\n### Q. 如何在本地存储中存储和检索对象？**答案**\n\n本地存储提供了\
    \ `setItem()` 和 `getItem()` 方法来从存储中存储和检索对象。`setItem(key, value)` 方法接受 2 个输入参数来存储对象。`getItem(key)`\
    \ 方法使用键作为输入参数检索值。以下代码显示了在“myName”键中存储字符串“Sandeep Kumar”，然后检索该字符串并将其放在 HTML 元素中。\n\
    \n```html\n<!DOCTYPE html>\n\n<html>\n\n <body>\n\n<div id=\"resultContainer\"\
    >\n\n</div> \n\n<script>\n\nvar container =\n\ndocument.getElementById(\"resultContainer\"\
    );\n\nlocalStorage.setItem(\"myName\", \"Sandeep Kumar\"); container.innerHTML\
    \ = localStorage.getItem(\"myName\"); </script>\n\n</body>\n\n</</html>\n```\n\
    \n下面的截图显示了 Chrome 开发者工具的存储预览，它将上述对象作为键值对进行持有。\n\n![](img/image00097.jpeg)\n\n\
    ### Q. 如何为本地存储绑定事件？\n\n**答案**\n\n当本地存储对象被修改时，会触发一个存储事件（storage event）。可以使用 `addEventListener()`\
    \ 在 window 对象上附加回调方法。\n\n**注意：** 当在存储对象上调用 `setItem()`、`removeItem()` 和 `clear()`\
    \ 方法时，必须触发存储事件（触发事件的页面除外）。\n\n简单来说，存储事件会在与相同源相关的每个标签页中触发。以下代码包含一个回调方法。\n\n```html\n\
    <!DOCTYPE html>\n\n<html>\n\n<body>\n\n<div id=\"resultContainer\"></div>\n\n\
    <button onclick=\"update()\">点击我</button>\n\n<script>\n\nvar container =\n\ndocument.getElementById(\"\
    resultContainer\"),\n\nmethodStorageEvent = function(event){ container.innerHTML\
    \ = \"事件触发\"+localStorage.getItem(\"myName\") };\n\ncounter = 1,\n\nupdate = function(){\n\
    \nlocalStorage.setItem(\"myName\", ++counter); container.innerHTML = localStorage.getItem(\"\
    myName\") ;\n\n};\n\nwindow.addEventListener(\"storage\",\n\nmethodStorageEvent,false)\n\
    \n</script>\n\n</body>\n\n</</html>\n```\n\n下面的截图演示了如何触发存储事件以及访问同一页面的其他标签页接收存储事件并更新其内容。\n\
    \n![](img/image00098.jpeg)\n\n## 第 12 章 File API\n\n### Q. 什么是 HTML5 File API？\n\
    \n**答案**\n\nHTML5 提供了一种在浏览器内部处理文件的新 API。该 API 提供了处理文件的 File、FileList 和 Blob 数据类型。它提供了\
    \ FileReader 接口来异步读取文件。\n\n### Q. FileReader 提供了哪些异步读取方法？\n\n**答案**\n\nFileReader\
    \  4 种不同的方法来处理加载的文件。这些异步方法列如下：\n\n`readAsBinaryString(Blob | File)`：读取目标文件并将其保存为范围\
    \ 0-255 的二进制字符串。\n\n`readAsText(Blob | File, opt_encoding)`：读取目标文件并将其保存为 UTF-8\
    \ 文件。\n\n`readAsDataURL(Blob | File)`：读取目标文件并返回包含 base64 ascii 字符串的数据 URL。`readAsArrayBuffer(Blob\
    \ | File)`：读取目标文件并将其保存在数组缓冲区（array buffer）中。\n\n### Q. JavaScript 中的 Blob 对象是什么？\n\
    \n**答案**\n\nBlob 对象代表数据的字节序列。Blob 对象的 IDL（接口定义语法）如下：\n\n```javascript\ninterface\
    \ Blob {\n\nreadonly attribute unsigned long long size; readonly attribute DOMString\
    \ type; Blob slice(optional [Clamp] long long start,\n\noptional [Clamp] long\
    \ long end, optional DOMString contentType); void close();\n\n};\n```\n\n"
- fmt: "\nThe details of the method and properties are as follows:\n\n- `slice method`:\
    \ The `slice` method returns a new `Blob` object with bytes ranging from the optional\
    \ start parameter up to but not including the optional end parameter, and with\
    \ a type attribute that is the value of the optional `contentType` parameter.\n\
    - `close method`: The `close` method must permanently neuter the original `Blob`\
    \ object. This is an irreversible and nonidempotent operation; once a `Blob` has\
    \ been neutered, it cannot be used again; dereferencing a `Blob` URL bound to\
    \ a `Blob` object on which `close` has been called results in a network error.\
    \ A neutered `Blob` must have a size of 0.\n- `size property`: It returns the\
    \ size of the `Blob` object in bytes.\n- `type property`: It returns the type\
    \ of the content that the `Blob` object holds.\n\n### Q. How to create a Blob\
    \ Object?\n\n### ANSWER\n\nA blob object can be created using `new` keyword with\
    \ `Blob` constructor. A `Blob` constructor takes the following parameters:\n\n\
    - `Blob part sequence`: This can be either `ArrayBuffer`, `ArrayBufferView`, `Blob`\
    \ and `DOMString`.\n- `Blob property bag`: It takes one parameter representing\
    \ type of the ASCII-encoded string in lower case representing the media type of\
    \ the `Blob`.\n\nThe following code shows an example of creating `Blob` using\
    \ `new` keyword:\n\n```javascript\nvar a = new Blob();\n\nvar b = new Blob([\"\
    foobarbazetcetc\" + \"birdiebirdieboo\"], {type: \"text/plain;charset=UTF-8\"\
    });\n```\n\n### Q. What are readable states for a Blob object?\n\n### ANSWER\n\
    \nA `Blob` must have a readability state, which is one of `OPENED` or `CLOSED`.\n\
    \nA `Blob` that refers to a byte sequence, including one of 0 bytes, is said to\
    \ be in the `OPENED` readability state.\n\nA `Blob` is said to be closed if its\
    \ `close` method has been called. A `Blob` that is closed is said to be in the\
    \ `CLOSED` readability state.\n\n### Q. What are different states of FileReader?\n\
    \n### ANSWER\n\nThe `FileReader` object can be in one of 3 states. The `readyState`\
    \ attribute, on getting, must return the current state, which must be one of the\
    \ following values:\n\n- `EMPTY`: The `FileReader` object has been constructed,\
    \ and there are no pending reads. None of the read methods have been called. This\
    \ is the default state of a newly minted `FileReader` object, until one of the\
    \ read methods have been called on it.\n- `LOADING`: A `File` or `Blob` is being\
    \ read. One of the read methods is being processed, and no error has occurred\
    \ during the read.\n- `DONE`: The entire `File` or `Blob` has been read into memory,\
    \ OR a file error occurred during read, OR the read was aborted using `abort()`.\
    \ The `FileReader` is no longer reading a `File` or `Blob`. If `readyState` is\
    \ set to `DONE` it means at least one of the read methods have been called on\
    \ this `FileReader`.\n\n## Chapter 13 Web RTC\n\n### Q. What is Web RTC?\n\n###\
    \ ANSWER\n\nWeb RTC provides the capability to browsers for real time communication\
    \ without any additional plugin installed. It involves audio, video and other\
    \ type of data streaming among the browser with their native capability.\n\n###\
    \ Q. What is the API implemented by Web RTC?\n\n### ANSWER\n\nWeb RTC implements\
    \ three different API. These interfaces are listed below.\n\n- `MediaStream`:\
    \ This represents a synchronized media stream using camera and microphone.\n-\
    \ `RTCPeerConnection`: This interface is responsible for stable connection between\
    \ peer browser during real time communication.\n- `RTCDataChannel`: This interface\
    \ is responsible for other type of data communication between peer browser. For\
    \ example the remote desktop sharing using browser.\n\n### Q . What is MediaStream?\n\
    \n### ANSWER\n\nMediaStream basically represents the stream captured by Camera\
    \ and microphone. Each `MediaStream` has an input which captures the stream. This\
    \ `MediaStream` can be accessed using `navigator.getUserMedia()` method.\n\n###\
    \ Q . What are the input parameters to `getUserMedia()` method? \n\n### ANSWER\n\
    \nThe `getUserMedia()` method takes 3 parameters as input. These parameters are\
    \ as follows:\n\n1. Constraint Object similar to a configuration object.\n2. Success\
    \ Callback Method.\n3. Error Callback Method.\n\n### Q. What are MediaStreamTracks?\n\
    \n### ANSWER\n\nThe `MediaStream` returned by `getUserMedia()` has 2 useful methods\
    \ `getAudioTracks()` and `getVideoTracks()`. Both of these methods returns an\
    \ array of `MediaStreamTracks`.\n\n### Q . What are the protocols used by Web\
    \ RTC for communication?\n\n### ANSWER\n\nWeb RTC uses 2 different protocols for\
    \ communication. These 2 protocols are listed as follows.\n\n- `DTLS`: Datagram\
    \ Transport Layer Security.\n- `SRTP`: Secure Real-time Transport Protocol.\n\n\
    ### Q . How to view the statistics of an in progress Web RTC session in Chrome\
    \ browser?\n\n### ANSWER\n\nWe can view the detail statistics and charts of an\
    \ ongoing Web RTC session in chrome browser by using `chrome://webrtc-internals/`\
    \ in chrome browser.\n\n### Q . What are the different event handlers for a channel?\n\
    \n### ANSWER\n\nA channel has 4 different event handlers. These event handlers\
    \ are as follows.\n\n- `onopen`: Executed when the connection is established.\n\
    - `onerror`: Executed if there is an error creating the connection.\n- `onmessage`:\
    \ When you receive a message, this method will execute\n- `onclose`: Executed\
    \ if the other peer closes the connection.\n\n### Q . What is a signal channel?\n\
    \n### ANSWER\n\nWebRTC can’t create connections without some sort of server in\
    \ the middle. We call this the Signal Channel.\n\n### Q . What is an ICE technique?\n\
    \n### ANSWER\n\nInteractive Connectivity Establishment (ICE) is a technique used\
    \ in computer networking involving network address translators (NATs) in Internet\
    \ applications of Voice over Internet Protocol (VoIP), peer-to-peer communications,\
    \ video, instant messaging and other interactive media.\n\n### Q. What is an ICE\
    \ Candidate?\n\n### ANSWER\n\nWhile communication peers must exchange information\
    \ about the network connection. This is known as an ICE candidate.\n\n### Q .\
    \ What are the server side functionalities needed by the Web RTC?\n\n### ANSWER\n\
    \nWeb RTC requires following functionalities from server side to create a peers.\n\
    \n1. User discovery and communication.\n2. Signaling.\n3. NAT/firewall traversal.\n\
    4. Relay servers in case peer-to-peer communication fails.\n\n### Q. What is STUN\
    \ protocol?\n\n### ANSWER\n\nSTUN (Session Traversal Utilities for NAT) is a standardized\
    \ set of methods and a network protocol to allow an end host to discover its IP\
    \ address if it is located behind a NAT.\n\n## Chapter 14 Drag & Drop API\n\n\
    ### Q. How to make content draggable inside the browser?\n\n### ANSWER\n\nHTML5\
    \ provides drag and drop feature. An element can be made draggable by setting\
    \ its draggable property to true. Check the below code having 2 buttons.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Draggable Element</title>\n</head>\n<body>\n\
    <button draggable=\"true\">Draggable Button</button> <button>Normal Button</button>\n\
    </body>\n</html>\n```\n\nBelow screenshot shows both these buttons. The draggable\
    \ button is movable while the normal button is fixed in its position.\n\n![](Images/image0099.jpeg)\n\
    \n### Q. What happens when drag starts for an element?\n\n### ANSWER\n\nThere\
    \ are 3 important key points to note when a drag starts. These key points are\
    \ as follows.\n\n- `Drag Data`: It represent the type of data that will be transferred\
    \ while dragging.\n- `Drag Feedback`: This represents image which appears beside\
    \ the mouse pointer during the drag operation.\n- `Drag Effect`: This represents\
    \ the type of drag happens to element. It can be 3 types and listed below:\n \
    \   - `copy`: This effect indicates that the data being dragged will be copied\
    \ from its present location to the drop location.\n    - `move`: This effect indicates\
    \ that the data being dragged will be moved from its original position to drop\
    \ location.\n    - `link`: This effect indicates that some form of relationship\
    \ or connection will be created between the source and drop locations.\n\n###\
    \ Q. What are the Drag and drop events?\n\n### ANSWER\n\nThere are 7 different\
    \ drag and drop events that can be attached with a callback method programmatically.\n"
