    \n**答案**\n\n使用带有参数 `'2d'` 的 `getContext()` 方法可以创建画布上下文。\n\n该上下文方法是 `CanvasRenderingContext2D`\
    \ 对象的一种类型。以下代码展示了简单的 2d 上文的创建，并打印了对象的构造函数。\n\n```html\n<html>\n<body>\n<canvas\
