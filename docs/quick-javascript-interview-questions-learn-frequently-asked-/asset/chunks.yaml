    ## 第 3 章 闭包 (Closure)\n\n**Q. 什么是闭包？**\n\n**答案**\n\n闭包是一个可以访问外部包装函数变量的内部函数。它具有三个不同的作用域访问：\n\
    \n- **作用域：** 它可以访问自身作用域中的属性。\n- **包装函数作用域：** 它可以访问其闭包函数中的属性。\n- **全局作用域：** 它可以访问全局作用域（即\
    \ window 作用域）中的属性。\n\n**示例：**\n\n尽管 `prop1` 属于外部函数的作用域，但内部函数仍然可以访问 `prop1`。\n\n\
    ```javascript\nfunction myOuterFunction(){ \n    var prop1 = 5;\n    return function\
    \ innerFunction(){\n        return prop1;\n    }\n}\n\nvar res = myOuterFunction();\
    \ console.log(res.name);\nconsole.log(res());\n```\n\n下面的截图显示了上述代码在控制台中的输出。\n\
    ![](img/image00068.jpeg)\n\n**Q. 请举闭包概念的实际应用示例。答案**\n\n在网页开发中，开发者更频繁地使用闭包。最常见的场景是我们需要某种工厂，它返回一个带有不同值的函数对象，该对象可以供应用程序使用。\n\
    \n**示例：**\n\n以下代码有一个名为 `backgroundColorFactory` 的颜色工厂，它返回一个带有输入颜色的函数。使用此工厂，我们创建了\
    \ `greenBackground` 和 `blueBackground` 函数对象，并将它们绑定到两个按钮上。当用户点击这些按钮时，body 的背景颜色将变为目标颜色。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n <head>\n<meta charset=\"utf-8\">\n<title>闭包实际示例</title>\n\
    </head>\n<body>\n<button id=\"greenButton\">绿色背景</button> <button id=\"blueButton\"\
    >蓝色背景</button> <script>\nvar backgroundColorFactory = function(color) { \n   \
    \ return function() {\n        document.body.style.background = color; \n    }\n\
    };\n\nvar greenBackground = backgroundColorFactory('green'); \nvar blueBackground\
    \ = backgroundColorFactory('blue');\n\ndocument.getElementById('greenButton').onclick\
    \ = greenBackground;\ndocument.getElementById('blueButton').onclick = blueBackground;\n\
    </script>\n</</body> \n</</html>\n```\n\n上述代码的输出列在下面的截图。\n![](img/image00069.jpeg)\n\
    \n**Q. 如何使用闭包模拟私有数据？答案**\n\n以下代码演示了私有变量 `_name` 的声明。这意味着我们可以使用 `new` 关键字通过 `Student`\
    \ 构造函数为 `_name` 赋值。\n\n```javascript\nfunction Student(name) { \n    var _name\
    \ = name;\n    this.getName = function() { \n        return _name;\n    };\n}\n\
    \nvar student1 = new Student(\"Sandeep\"); \nstudent1._name = \"John\";\nconsole.log(student1.getName());\n\
    ```\n\n上述代码的细节如下：\n- 创建了一个 `Student` 对象 `student1`，其 `_name` 值为 `Sandeep`。\n-\
    \ 将新值 `John` 赋值给 `_name`，但 `getName()` 方法在控制台中打印 `Sandeep`。这证明 `_name` 是私有的。\n\
    \n下面的截图显示了 Chrome 控制台中中上述代码的输出。\n![](img/image00070.jpeg)\n\n## 第 4 章 关于 JSON\
    \ 的问题\n\n**Q. 什么是 JSON？**\n\n**答案**\n\nJSON 文本格式在语法上与创建 JavaScript 对象的代码相同。JSON\
    \ 只是 JS 对象字面量表示法的子集，但除了看起来相似外，它们没有任何共同点。JSON 用于数据交换格式，类似于 XML。JSON 构建在两种结构之上：\n\
    \n1. 键值对的集合。在各种语言中，这实现为对象、记录、结构体、字典、哈希表、键值列表或关联数组。\n2. 值的有序列表。在大多数语言中，这实现为数组、向量、列表或序列。\n\
    \n**Q. 为什么 Google 在其 JSON 响应前面加上 `while(1);`？答案**\n\n这是为了防止 JSON 劫持。这是为了确保其他网站无法进行恶意操作窃取数据。通过替换数组构造函数并通过\
    \ `<script>` 标签包含此 JSON URL，恶意的第三方网站可以从 JSON 响应中窃取数据。在开头放置 `while(1);`，脚本将会崩溃。另一方面，使用\
    \ `XHR` 和独立 JSON 解析器的同站请求可以轻松忽略 `while(1);` 前缀。\n\n**Q. 什么是 JSONP？答案**\n\nJSONP\
    \ 代表 “JSON with Padding”（带填充的 JSON）。它的意思是带填充的 JSON。\n\n**示例：**\n\n```javascript\n\
    function paddingFunction(data){\n    console.log(data)\n}\n\nvar script = document.createElement('script');\n\
    script.src = '//abcdurl?callback=paddingFunction'\ndocument.getElementsByTagName('head')[0].appendChild(script);\n\
    ```\n\n**Q. 为什么用 JSON 而不是 XML？答案**\n\n以下点是 JSON 优于 XML 的理由：\n- 与 XML 相比，JSON 更小、更快、更轻量。\n\
    - JSON 更容易映射到面向对象的系统中。\n- JSON 和 XML 都使用 Unicode，因此支持国际化。\n\n**Q. JSON 的 MIME\
    \ 类型是什么？答案**\n\nJSON 的 MIME 类型是 `application/json`。\n\n**Q. JSON 支持哪些数据类型？答案**\n\
    \nJSON 支持的数据类型有数字、字符串、布尔、数组、对象、null。以下代码显示了一个包含不同类型的 JSON 对象：\n\n```json\n { name:\"\
    Sandeep\",\nscore:65,\nisPassed: true,\nsubject: [\"Computer\", \"Algebra\"],\n\
    address: { city:\"Bangalore\", \"country\":\"India\"}, \nemail: null \n}\n```\n\
    \n**Q. `JSON.stringify()` 方法的作用是什么？答案**\n\n`JSON.stringify()` 将对象转换为 JSON 文本并存储在字符串中。下面的截图显示了\
    \ `stringify()` 方法的使用：\n![](img/image00072.jpeg)\n\n**Q. `JSON.parse()` 方法的作用是什么？答案**\n\
    \n`JSON.parse()` 将字符串解析为 JSON，并可选地对产生的值进行转换。下面的截图显示了使用 `JSON.parse()` 方法将 student1\
    \ JSON 字符串转换为 JSON 对象。\n![](img/image00073.jpeg)\n\n"
