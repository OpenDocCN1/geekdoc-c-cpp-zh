    \ to define an inline web worker? Demonstrate an inline worker for multiplying\
    \ 2 numbers?\n\n**ANSWER**\n\nAn inline web worker can be defined inside a HTML\
    \ markup using `<script>` tag with `type` attribute having value `javascript/worker`.\
    \ **Syntax:**\n\n```html\n<script type=\"javascript/worker\">\n\n//JavaScript\
    \ Code for defining a worker\n\n</script>\n```\n\n**Example:**\n\nThe `inlineWorkerDemo.html`\
    \ file contains the code for defining multiplication worker which listens to the\
    \ messages and calculates the multiplication and post the response. The listener\
    \ to the multiply worker extracts the result and renders in the browser. The following\
    \ code shows the content of `inlineWorkerDemo.html` file.\n\n```html\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"UTF-8\">\n\n<title>Inline\
    \ Web Worker Demo</title>\n\n</head>\n\n<body>\n\n<h1 id=\"resultContainer\"></h1>\n\
    \n<input type=\"number\" id=\"number1\" value=\"8\" placeholder=\"Enter first\
    \ number\"> <input type=\"number\" id=\"number2\" value=\"10\" placeholder=\"\
    Enter second number\">\n\n<button id=\"multiplyButton\">Multiply</button>\n\n\
    <script id=\"multiplyWorker\" type=\"javascript/worker\">\n\nself.addEventListener(\"\
    message\",function(event){\n\nvar requestData = event.data,\n\nnumber1 = requestData.number1,\n\
    \nnumber2 = requestData.number2,\n\nmultiplyResult = number1 * number2;\n\nself.postMessage({result:multiplyResult});\n\
    \n});\n\n</script>\n\n<script>\n\nvar *textContent* = document.querySelector('#multiplyWorker').textContent,\
    \ *workerBlob* = new Blob([*textContent*]),\n\n*workerURL* = window.URL.createObjectURL(*workerBlob*),\
    \ *multiplyWorker* = new Worker(*workerURL*),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"), *multiplyButton* = document.getElementById(\"multiplyButton\"\
    ), *number1* = document.getElementById(\"number1\"),\n\n*number2* = document.getElementById(\"\
    number2\");\n\n*multiplyButton*.addEventListener(\"click\", function () {\n\n\
    *multiplyWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10),\n\nnumber2:\
    \ parseInt(*number2*.value,10)\n\n});\n\n});\n\n*multiplyWorker*.addEventListener(\"\
    message\", function (workerEvent) {\n\nvar responseData = workerEvent.data,\n\n\
    result = responseData.result;\n\n*resultContainer*.innerText = \"Result: \" +\
    \ result;\n\n});\n\n</script>\n\n</body>\n\n</html> User can input two numbers\
    \ in the text box and press the multiply button. The multiply worker calculate\
    \ the multiplication and result is rendered in the browser. The outputs of the\
    \ preceding code are rendered as following screenshot.\n\n![](Images/image00092.jpeg)\n\
    \n## Q. How to handle error in web worker?\n\n**ANSWER**\n\nWe can throw error\
    \ using `throw` keyword from the web worker. A callback method can be attached\
    \ to the `error` event to handle the generated error. The `positiveNoSqaureWorkerDemo.html`\
    \ file contains a worker which takes only positive number as input. If a negative\
    \ number is passed it throws an error. The code content of this file is as follows.\n\
    \n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"\
    UTF-8\">\n\n<title>Web Worker Error Handler Demo</title>\n\n</head>\n\n<body>\n\
    \n<h1 id=\"resultContainer\"></h1>\n\n<input type=\"number\" id=\"number1\" value=\"\
    -4\" placeholder=\"Enter a number\"> <button id=\"squareResult\">Square</button>\n\
    \n<script id=\"squareWorker\" type=\"javascript/worker\">\n\nself.addEventListener(\"\
    message\",function(event){\n\nvar requestData = event.data,\n\nnumber1 = requestData.number1,\n\
    \nsquareResult = 0;\n\nif(number1>0) {\n\nsquareResult = number1 * number1\n\n\
    self.postMessage({result:squareResult});\n\n} else{\n\n//For negative number throw\
    \ error\n\nthrow \"It is a negative number.Please supply a positive number.\"\
    ; }\n\n});\n\n</script>\n\n<script>\n\nvar *textContent* = document.querySelector('#squareWorker').textContent,\n\
    \n*workerBlob* = new Blob([*textContent*]),\n\n*workerURL* = window.URL.createObjectURL(*workerBlob*),\n\
    \n*squareWorker* = new Worker(*workerURL*),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"),\n\n*squareResult* = document.getElementById(\"squareResult\"\
    ),\n\n*number1* = document.getElementById(\"number1\");\n\n*squareResult*.addEventListener(\"\
    click\", function () {\n\n*squareWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10)\n\
    \n});\n\n});\n\n*squareWorker*.addEventListener(\"message\", function (workerEvent)\
    \ {\n\nvar responseData = workerEvent.data,\n\nresult = responseData.result;\n\
    \n*resultContainer*.innerText = \"Result: \" + result;\n\n});\n\n*squareWorker*.addEventListener('error',\
    \ function(workerEvent){ *resultContainer*.innerText = \"Error: \" + workerEvent.message;\
    \ }, false);\n\n</script>\n\n</body>\n\n</html> The output of the preceding code\
    \ is rendered as following screenshot.\n\n![](Images/image00093.jpeg)\n\n## Q.\
    \ How to import an external script in web worker? Demonstrate it with example?\n\
    \n**ANSWER**\n\nTo import external script inside worker we need to use `importScripts()`\
    \ method with a file name as input parameter. To demonstrate import script we\
    \ have created 3 files `greatest-number-script.js`, `numberWorker.js`,\n\n`numberWorkerDemo.html`\
    \ file. The following screenshot shows these files.\n\n![](Images/image00094.jpeg)\n\
    \nThe `greatest-number-script.js` is the external script that we need to import\
    \ to our web worker. It has a single method `findGreatestNumber()` to find out\
    \ bigger number among two supplied numbers. The following code shows the content\
    \ of `greatest-number-script.js` file.\n\n```javascript\nvar findGreatestNumber\
    \ = function(number1,number2){\n\nreturn number1>number2 ? number1 : number2;\n\
    \n};\n```\n\nThe `numberWorker.js` file contains the code for importing the external\
    \ script inside the web worker listener callback method. The following code shows\
    \ the content of `numberWorker.js` file.\n\n```javascript\nself.addEventListener(\"\
    message\",function(event){\n\nvar numberWorker = self.importScripts('greatest-number-script.js');\
    \ var responseData = event.data, \n\nnumber1 = requestData.number1,\n\nnumber2\
    \ = requestData.number2,\n\ngreatestNumber = findGreatestNumber(number1,number2);\
    \ self.postMessage({result:greatestNumber});\n\n});\n```\n\nThe `numberWorkerDemo.html`\
    \ file contains the code for instantiating the number web worker and listening\
    \ to response message. The following code shows the content of `numberWorkerDemo.html`\
    \ file.\n\n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta\
    \ charset=\"UTF-8\">\n\n<title>Time Web Worker Demo</title>\n\n</head>\n\n<body>\n\
    \n<h1 id=\"resultContainer\"></h1>\n\n<input type=\"number\" id=\"number1\" value=\"\
    7\" placeholder=\"Enter first number\"> <input type=\"number\" id=\"number2\"\
    \ value=\"9\" placeholder=\"Enter second number\">\n\n<button id=\"greatButton\"\
    >Find Greatest Number</button>\n\n<script>\n\nvar *numberWorker* = new Worker(\"\
    numberWorker.js\"), *resultContainer* = document.getElementById(\"resultContainer\"\
    ), *greatButton* = document.getElementById(\"greatButton\"),\n\n*number1* = document.getElementById(\"\
    number1\"),\n\n*number2*=document.getElementById(\"number2\");\n\n*greatButton*.addEventListener(\"\
    click\", function () {\n\n*numberWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10),\n\
    \nnumber2: parseInt(*number2*.value,10)\n\n});\n\n});\n\n*numberWorker*.addEventListener(\"\
    message\", function (workerEvent) {\n\nvar responseData = workerEvent.data,\n\n\
    result = responseData.result;\n\n*resultContainer*.innerText = \"Result: \" +\
    \ result;\n\n});\n\n</script>\n\n</body>\n\n</html>\n"
