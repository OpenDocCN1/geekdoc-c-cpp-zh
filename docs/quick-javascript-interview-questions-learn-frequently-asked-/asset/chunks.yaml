    \n### Q. Create a shared worker to calculate the length of a string? **ANSWER**\n\
    \nThe `calculateLengthWorker.js` contains the code for listening messages and\
    \ calculates the length of input string. The shared worker listens to message\
    \ in a port by listening to connect event. The code for `calculateLengthWorker.js`\
    \ file is as follows.\n\n```javascript\nself.addEventListener(\"connect\", function\
    \ (event) {\n\nvar port = event.ports[0];\n\nport.addEventListener(\"message\"\
    , function (event) {\n\nvar requestData = event.data,\n\ninputString = requestData.string,\n\
    \nstringLength = inputString.length;\n\nport .postMessage({result:stringLength});\n\
    \n}, false);\n\nport.start(); \n\n}, false);\n```\n\nThe `lengthWorkerDemo.html`\
    \ file contains the code for instantiating the shared worker and rendering the\
    \ response in browser. The code content of `lengthWorkerDemo.html` file are listed\
    \ as follows.\n\n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n\
    < meta charset=\"UTF-8\">\n\n<title>Shared Web Worker Demo</title> </head>\n\n\
    <body> \n\n<h1 id=\"resultContainer\"></h1>\n\n<input type=\"text\" id=\"inputString\"\
    \ value=\"Hello\" placeholder=\"Enter a string\"> <button id=\"lengthButton\"\
    >Get Length</button>\n\n<script>\n\nvar lengthWorker = new SharedWorker(\"calculateLengthWorker.js\"\
    ), resultContainer = document.getElementById(\"resultContainer\"), lengthButton\
    \ = document.getElementById(\"lengthButton\"), inputString = document.getElementById(\"\
    inputString\");\n\nlengthButton .addEventListener(\"click\", function () {\n\n\
    resultContainer.innerText = \"\";\n\nlengthWorker.port.postMessage({\n\nstring\
    \ :inputString.value\n\n});\n\n});\n\n//start the worker\n\nlengthWorker.port.start();\n\
    \n//Success Handler for the worker\n\nlengthWorker.port.addEventListener(\"message\"\
    , function (workerEvent) {\n\nvar responseData = workerEvent.data,\n\nresult =\
    \ responseData.result;\n\nresultContainer.innerText = \"Result: \" + result;\n\
    \n});\n\n</script>\n\n</body>\n\n</</html> \n```\n\nThe output of the preceding\
    \ code is rendered as following screenshot displaying length of the input string.\n\
    \n![](Images/image00096.jpeg)\n\n## Chapter 11 Local Storage\n\n### Q. What is\
    \ local storage?\n\n**ANSWER**\n\nHTML5 provides a feature to store data locally\
    \ in end user’s browser. Data is stored in the browser as key-value pair. Unlike\
    \ cookie it has average space of 5 MB. This storage comes in 2 different type\
    \ `sessionStorage` and `localStorage`.\n\n`localStorage`: it stores data with\
    \ no expiration date. `sessionStorage` : it stores data with an expiration date.\n\
    \n### Q. Which one is the main Storage interface?\n\n**ANSWER**\n\n`window.Storage()`\
    \ is the main interface from where the `localStorage` and `sessionStorage` are\
    \ implemented. This interface has the below definition.\n\n```javascript\ninterface\
    \ Storage {\n\nreadonly attribute unsigned long length;\n\nDOMString? key(unsigned\
    \ long index);\n\ngetter DOMString? getItem(DOMString key);\n\nsetter creator\
    \ void setItem(DOMString key, DOMString value); deleter void removeItem(DOMString\
    \ key);\n\nvoid clear();\n\n}\n```\n\nThe details of the above code are as follows:\n\
    \n`setItem(key,value)`: this methods stored the value in storage using `key-value`\
    \ pair.\n\n`getItem(key)`: this method retrieves the stored object using the key.\n\
    \n`removeItem(key)`: this methods removes the stored item based on the key.\n\n\
    `clear()`: Deletes all the items from the storage. `length`: this property returns\
    \ the length of the storage, no of elements inside the storage.\n\n`key(position)`:\
    \ this method returns the key for the value in the given numeric position. \n\n\
    ### Q. How to store and retrieve an object in local storage? **ANSWER**\n\nLocal\
    \ storage provides `setItem()` and `getItem()` for storing and retrieving an object\
    \ from the storage. `setItem(key, value)` method takes 2 input parameter to store\
    \ the object. The `getItem(key)` method retrieves the value using key as input\
    \ parameter. Below code shows the storing “Sandeep Kumar” string in “myName” key\
    \ and then retrieves this string place it in a HTML element.\n\n```html\n<!DOCTYPE\
    \ html>\n\n<html>\n\n <body>\n\n<div id=\"resultContainer\">\n\n</div> \n\n<script>\n\
    \nvar container =\n\ndocument.getElementById(\"resultContainer\");\n\nlocalStorage.setItem(\"\
    myName\", \"Sandeep Kumar\"); container.innerHTML = localStorage.getItem(\"myName\"\
    ); </script>\n\n</body>\n\n</</html>\n```\n\nBelow screenshot shows the chrome\
    \ developer storage preview which holds the above object as key and value pair.\n\
    \n![](Images/image00097.jpeg)\n\n### Q. How to attach an event to a local storage?\n\
    \n**ANSWER**\n\nWhen local storage objects get modified a storage event is fired.\
    \ A callback method can be attached to window object using `addEventListener()`\
    \ or `addEventListener()`.\n\n**NOTE:** When `setItem()`, `removeItem()`, and\
    \ `clear()` methods are called on Storage object a storage event must be fired\
    \ except the one that updated.\n\nIn simple sentence, a storage event is fired\
    \ on every tab associated with the same origin. Below code has a callback method.\n\
    \n```html\n<!DOCTYPE html>\n\n<html>\n\n<body>\n\n<div id=\"resultContainer\"\
    ></div>\n\n<button onclick=\"update()\">Click Me</button>\n\n<script>\n\nvar container\
    \ =\n\ndocument.getElementById(\"resultContainer\"),\n\nmethodStorageEvent = function(event){\
    \ container.innerHTML = \"EventFired\"+localStorage.getItem(\"myName\") };\n\n\
    counter = 1,\n\nupdate = function(){\n\nlocalStorage.setItem(\"myName\", ++counter);\
    \ container.innerHTML = localStorage.getItem(\"myName\") ;\n\n};\n\nwindow.addEventListener(\"\
    storage\",\n\nmethodStorageEvent,false)\n\n</script>\n\n</body>\n\n</</html>\n\
    ```\n\nBelow screenshot demonstrates how the storage event is fired and the other\
    \ tabs accessing the same page receives the storage event and update their content.\n\
    \n![](Images/image00098.jpeg)\n\n## Chapter 12 File API\n\n### Q. What is HTML5\
    \ File API?\n\n**ANSWER**\n\nHTML5 provides new API to work with files inside\
    \ a browser. This API provides `File`, `FileList` and `Blob` data type to work\
    \ with files. It provide `FileReader` interface to read files asynchronously.\n\
    \n### Q. What are the methods provided by FileReader for asynchronous read?\n\n\
    **ANSWER**\n\nFileReader provides 4 different methods to work with loaded files.\
    \ These asynchronous methods are listed as follows.\n\n`readAsBinaryString(Blob\
    \ | File)`: Reads the target file and save it to binary string containing integer\
    \ of range 0-255.\n\n`readAsText(Blob | File, opt_encoding)`: Reads the target\
    \ file and save it as UTF-8 text file.\n\n`readAsDataURL(Blob | File)`: Reads\
    \ the target file and returns a data URL containing base64 ascii string. `readAsArrayBuffer(Blob\
    \ | File)`: Reads the target file and save it in a array buffer.\n\n### Q. What\
    \ is Blob object in javascript?\n\n**ANSWER**\n\nA blob object refers to a sequence\
    \ of bytes representing data. The IDL(Interface Definition Syntax) for Blob object\
    \ is as follows:\n\n```javascript\ninterface Blob {\n\nreadonly attribute unsigned\
    \ long long size; readonly attribute DOMString type; Blob slice(optional [Clamp]\
    \ long long start,\n\noptional [Clamp] long long end, optional DOMString contentType);\
    \ void close();\n\n};\n```\n"
