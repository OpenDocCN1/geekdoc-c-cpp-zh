  trans: "\n\n`Dragstart`: 当开始拖拽时，在元素上触发该事件。`Dragenter`: 在拖拽过程中，当鼠标进入元素时触发该事件。\n\n\
    `Dragover`: 在拖拽过程中，当鼠标在元素上移动时触发该事件。\n\n`Dragleave`: 在拖拽过程中，当鼠标离开元素时触发该事件。\n\n\
    `Drop`: 当拖拽操作结束时，在发生投放的元素上触发 drop 事件。\n\n`Dragend`: 当拖拽操作完成后，无论成功与否，拖拽源都会接收 `dragend`\
    \ 事件。\n\n### Q. 什么是 `dataTransfer` 属性？\n\n**答案**\n\n`dataTransfer` 对象存储了拖拽操作中发送的数据。`dataTransfer`\
    \ 在 `dragstart` 事件中设置，并在 `drop` 事件中进行读取/处理。在 `dataTransfer` 对象中设置值的语法如下。\n\n```javascript\n\
    event.dataTransfer.setData(format, data)\n```\n\n上述语法将将对象的内容设置为作为参数传递的 mime 类型和数据负载。\n\
    \n### Q. 开发一个示例来将元素从一个地方拖动到另一个地方？\n\n**答案**\n\n为了演示拖放，我们创建了一个具有圆边框和红色背景的 div 元素。我们将拖动这个元素并将其放入容器中。以下代码显示了拖放示例。\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<style>\n#ball{\nwidth:50px;\nheight:50px;\n\
    background: red; border-radius: 100%; \n}\n#dropZone {\nwidth:200px;\nheight:100px;\n\
    padding:10px;\nborder:1px solid #aaaaaa;\n}\n</style>\n</head>\n<body>\n\n<div\
    \ id=\"dropZone\" ondrop=\"drop(event)\" ondragover=\"allowDrop(event)\">\n</div>\n\
    <br>\n<div id=\"ball\" draggable=\"true\" ondragstart=\"drag(event)\"></div>\n\
    <script>\nfunction allowDrop(ev) {\nev.preventDefault();\n}\n\nfunction drag(ev)\
    \ {\nev.dataTransfer.setData(\"text\", ev.target.id);\n}\n\nfunction drop(ev)\
    \ {\nev.preventDefault();\nvar data = ev.dataTransfer.getData(\"text\");\nev.target.appendChild(document.getElementById(data));\n\
    }\n</script>\n</body>\n</html>\n```\n\n代码的输出在拖拽前如下截图所示，此时两个元素都在它们的原始位置。\n\n![](img/image00100.jpeg)\n\
    \n代码的输出在将可拖拽元素拖放到容器后，如下截图所示。\n\n![](img/image00101.jpeg)\n\n## 第 15 章 App Cache\
    \ API（应用缓存 API）\n\n### Q. 什么是 app cache？在 Web 应用中使用 app cache API 有什么好处？\n\n**答案**\n\
    \nApp cache API 是 HTML5 提供的一个新功能。该 API 使得 Web 应用可以在没有互联网连接的情况下运行。该 API 最重要的优点列如下：\n\
    \n- **速度**：像所有其他缓存一样，它提高了访问页面内容的速度。\n- **离线浏览**：由于可以在没有互联网的情况下访问，它提高了程序的可用性。\n\
    - **减少负载**：由于内容和数据现在缓存在浏览器中，减轻了服务器的应用程序负载。\n- **较少的网络调用**：由于大多数可重用内容都存在 app cache\
    \ 中，这减少了对服务器的网络调用。\n\n### Q. 如何在 html 文件中启用应用缓存？\n\n**答案**\n\n要在 HTML 文件中启用应用缓存，我们需要在\
    \ `<HTML>` 元素中包含 `manifest` 属性，其中包含 `appcache` 文件名。在 HTML 文件中声明应用缓存的语法如下。\n\n\
    ```html\n<!DOCTYPE HTML>\n<html manifest=\"filename.appcache\"> </html>\n```\n\
    \n### Q. appcache 文件的媒体类型是什么？\n\n**答案**\n\n清单文件需要 `text/cache-manifest` 媒体类型。\n\
    \n### Q. manifest 文件的三个不同部分是什么？\n\n**答案**\n\nmanifest 文件有 3 个不同的部分。这 3 个部分如下：\n\
    \n ** **CACHE MANIFEST**：在此标题下的文件在首次下载后将被缓存。\n- **NETWORK**：在此标题下的文件需要连接到服务器，且永远不会被缓存。\n\
    - **FALLBACK**：在此标题下的文件指定了当页面无法访问时的备用页面。\n\n### Q. 什么是 NETWORK 部分？\n\n**答案**\n\
    \nNETWORK 是 manifest 文件中的部分之一。NETWORK 部分中列出的文件名永远不会在本地缓存。以下代码显示了 NETWORK 部分的示例。\n\
    \n```text\nNETWORK: login.html\n```\n\n### Q. 什么是 FALLBACK 部分？\n\n**答案**\n\nFALLBACK\
    \ 是 manifest 文件中的部分之一。在此部分中，我们可以指定应用程序离线时调用的文件名。以下代码显示了 FALLBACK 部分的示例。\n\n```text\n\
    FALLBACK:\n/html/ /offline.html\n```\n\n### Q. 什么是 CACHE MANIFEST 部分？\n\n**答案**\n\
    \nCACHE MANIFEST 是 manifest 文件中的部分之一。在此部分提到的文件名将被缓存在本地。以下代码显示了 CACHE MANIFEST\
    \ 部分的示例。\n\n```text\n/style.css\n/favicon.gif /app.js\n```\n\n### Q. 如何在浏览器中查看\
    \ appcache 详情？\n\n**答案**\n\n通过以下链接在浏览器中查看缓存大小、时间等：`chrome://appcache-internals/`。\n\
    \n以下截图显示了缓存。\n\n![](img/image0102.jpeg)\n\n### Q. 如何检测浏览器支持 appcache？\n\n**答案**\n\
    \n通过检查 `window` 对象中是否存在 `applicationCache` 来检测 appcache。以下截图显示了 applicationCache\
    \ 对象。\n\n![](img/image0103.jpeg)\n\n### Q. 如何手动更新 appcache？\n\n**答案**\n\n通过强制刷新浏览器来更新缓存。我们也可以调用\
    \ `refreshCache()` 方法程序化更新。\n\n## 第 16 章 Server Sent Events（服务器发送事件）\n\n### Q.\
    \ 什么是服务器发送事件 (SSE)?\n\n**答案**\n\nHTML5 提供了服务器发送事件功能，网页可以自动获取更新。该功能的很好的例子是 Facebook\
    \ 通知或 Google 更新。\n\n### Q. 服务器响应的类型类型是什么？\n\n**答案**\n\n服务器响应的内容类型是 `Content-Type`\
    \ 头部 `text/event-stream`。\n\n### Q. 如何创建监听服务器更新的事件源？\n\n**答案**\n\n可以通过带有服务器路径实例化\
    \ `EventSource` 类来创建事件源。创建事件源的语法如下。\n\n```javascript\nvar source = new EventSource(\"\
    <URL>\");\n```\n\n### Q. EventSource 触发哪些事件类型？\n\n**答案**\n\nEventSource 触发 3 不同的事件。可以将回调方法附加到源上。这些事件类型如下：\n\
    \n- `onopen`：当服务器向浏览器打开连接时触发此事件。\n- `onmessage`：当服务器向流产生新输出时触发此事件。\n- `onerror`：当发生某种错误时触发此事件。\n\
    \n### Q. 如何关闭事件流？\n\n**答案**\n\n可以使用 `close()` 方法关闭事件流。\n\n### Q. 事件流的格式是什么？\n\n\
    **答案**\n\n事件流是简单的文本数据流，必须使用 `UTF-8` 编码。每条消息由一对换行符分隔。行首字符为冒号的本质上是注释，会被忽略。\n\n"
- fmt: "\nThe following screenshot shows the error produces by using an undeclared\
    \ variable inside the `sayHello()` method.\n\n![](Images/image00104.jpeg)\n\n\
    ### Q. List out some of the conditions that are not allowed in strict mode?\n\n\
    **ANSWER**\n\nFind the list of the conditions that are not allowed in ECMA5 strict\
    \ mode in below:\n\n- Using a variable without declaring is not allowed. Deleting\
    \ a variable, a function, or an argument is not allowed.\n- Defining a property\
    \ more than once is not allowed. Duplicating a parameter name is not allowed.\n\
    - Octal numeric literals and escape characters are not allowed.\n- Writing to\
    \ a read-only property is not allowed. Deleting an undeletable property is not\
    \ allowed.\n- The string `\"eval\"` cannot be used as a variable. The string `\"\
    arguments\"` cannot be used as a variable. The `with` statement is not allowed.\n\
    - Future reserved keywords are not allowed.\n\n### Q. What is the output of `0.1+0.2`\
    \ produces in the console and why? **ANSWER**\n\nJavaScript math library follows\
    \ IEEE 754 standards for math. IEEE 754 standards use 64 bit representation for\
    \ a floating point number. This causes a problem while evaluating the `0.1 + 0.2`\
    \ expression. Below screenshot shows the Firebug console for this expression.\n\
    \n![](Images/image00105.jpeg)\n\nJavaScript internally converts the `0.1` to 16\
    \ precision which becomes `0.1000000000000000` and then `0.2` gets added and becomes\
    \ `0.30000000000000004`. Below screenshot shows this demonstration in JavaScript\
    \ code.\n\n![](Images/image00106.jpeg)\n\n### Q. How to resolve the issue `0.1+0.2\
    \ = 0.30000000000000004` and produce `0.1+0.2 = 03`? **ANSWER**\n\nThis issue\
    \ can be resolved by using `toFixed(1)` method to this expression. `toFixed()`\
    \ method converts a number to the specified decimal points. Below screenshot shows\
    \ the use of `toFixed()` method to produce the correct output which is `0.3`.\n\
    \n![](Images/image00107.jpeg)\n\n### Q. What will be the output of the below code\
    \ and why?\n\n```javascript\n(function(){\n\n  var a = b = 3;\n\n})();\n\nconsole.log(typeof\
    \ a);\nconsole.log(typeof b);\n```\n\n**ANSWER**\n\nThe above code will print\
    \ `undefined` and `Number` in the console. Below screenshot shows the output of\
    \ the above code in the Firebug console.\n\n![](Images/image00108.jpeg)\n\nJavaScript\
    \ treats the above code as below screenshot. From the below code it is clear that\
    \ variable `a` is in local scope of the function and be is treated as `this.b`.\
    \ The current reference `this` represents the `window` object.\n\n![](Images/image00109.jpeg)\n\
    \n### Q. What will be the output of the below code and why? `console.log(1+2+4);`\
    \ **ANSWER**\n\nThe output of the above code is `7` as the parameters are all\
    \ numbers. Below screenshot shows the output of the above code in a chrome console.\n\
    \n![](Images/image00110.jpeg)\n\n### Q. Explain Hoisting in JavaScript? **ANSWER**\n\
    \nHoisting is JavaScript's default behavior of moving declarations to the top.\
    \ In other words, a variable can be used before it has been declared. Let’s understand\
    \ hoisting using these following examples.\n\n**Example 1:**\n\nThe following\
    \ code has a `display()` method which prints the value of `a` in the console.\n\
    \n```javascript\nfunction display(){ \n  console.log(a);\n}\ndisplay();\n```\n\
    \nThe output of the preceding code will be a `reference` error as we have not\
    \ defined the variable. The following screenshot shows the output of the preceding\
    \ code.\n\n![](Images/image00111.jpeg)\n\n**Example 2:**\n\nThe following code\
    \ has a `display()` method which prints the value of `a` in the console.\n\n```javascript\n\
    function display(){\n  var a;\n  console.log(\"Output: \"+a); \n}\ndisplay();\n\
    ```\n\nThe output of the preceding code will be `undefined` as we have defined\
    \ the variable but not assigned any value. The following screenshot shows the\
    \ output of the preceding code.\n\n![](Images/image00112.jpeg)\n\n**Example 3:**\n\
    \nThe following code has a `display()` method which prints the value of `a` in\
    \ the console.\n\n```javascript\nfunction display(){\n  console.log(\"Output:\
    \ \"+a);\n  var a; \n}\ndisplay();\n```\n\nThe output of the preceding code will\
    \ be `undefined` as we have defined the variable but not assigned any value. Example\
    \ 2 and Example 3 has same output. It means the variable declaration is moved\
    \ to the top. The following screenshot shows the output of the preceding code.\n\
    \n![](Images/image00113.jpeg)\n\n## About The Author\n\n![](Images/image00114.jpeg)\n\
    \nSandeep Kumar Patel is a senior web developer and founder of `www.tutorialsavvy.com`,\
    \ a widely-read programming blog since 2012. He has more than five years of experience\
    \ in object-oriented JavaScript and JSON-based web applications development. He\
    \ is GATE-2005 Information Technology (IT) qualified and has a Master’s degree\
    \ from VIT University, Vellore.\n\n**You can know more about him from his:**\n\
    \n- LinkedIn profile (`http://www.linkedin.com/in/techblogger`).\n- He has received\
    \ the Dzone Most Valuable Blogger (MVB) award for technical publications related\
    \ to web technologies. His article can be viewed at `http://www.dzone.com/users/sandeepgiet`.\n\
    - He has also received the Java Code Geek (JCG) badge for a technical article\
    \ published in JCG. His article can be viewed at `http://www.javacodegeeks.com/author/sandeep-kumar-patel/`.\n\
    - Author of “Instant GSON” for Packt publication, `http://www.packtpub.com/create-json-data-java-objectsimplement-with-gson-library/book`.\n\
    \nQuestions or comments? E-mail me at `sandeeppateltech@gmail.com` or find me\
    \ on the following social networks:\n\n- Facebook Page: `http://www.facebook.com/SandeepTechTutorials`\n\
    - Tutorial Blog: `http://www.tutorialsavvy.com`\n"
