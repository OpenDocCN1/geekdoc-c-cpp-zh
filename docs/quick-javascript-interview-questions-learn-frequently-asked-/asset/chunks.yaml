    \ `start` 参数开始，但不包含可选的 `end` 参数，其 `type` 属性值为可选 `contentType` 参数的值。\n- `close\
    \ method`: `close` 方法必须永久地使原始 `Blob` 对象失效。这是一个不可逆且非幂等的操作；一旦 `Blob` 失效，就无法再次使用；对已调用\
    \ `close` 方法的 `Blob` 对象绑定的 `Blob` URL 进行解引用（dereference）将导致网络错误。失效的 `Blob` 大小必须为\
    \ 0。\n- `size property`: 它返回 `Blob` 对象以字节为单位的大小。\n- `type property`: 它返回 `Blob`\
    \ 对象所持有的内容的类型。\n\n### Q. 如何创建 Blob 对象？\n\n### 答\n\n可以使用 `new` 关键字配合 `Blob` 构造函数来创建一个\
    \ blob 对象。`Blob` 构造函数接受以下参数：\n\n- `Blob part sequence`: 这可以是 `ArrayBuffer`、`ArrayBufferView`、`Blob`\
    \ 或 `DOMString`。\n- `Blob property bag`: 它接受一个参数，代表小写的 ASCII 编码字符串，表示 `Blob` 的媒体类型。\n\
    \n以下代码展示了使用 `new` 关键字创建 `Blob` 的示例：\n\n```javascript\nvar a = new Blob();\n\n\
    var b = new Blob([\"foobarbazetcetc\" + \"birdiebirdieboo\"], {type: \"text/plain;charset=UTF-8\"\
    });\n```\n\n### Q. Blob 对象的可读状态有哪些？\n\n### 答\n\n`Blob` 必须有一个可读状态，该状态为 `OPENED`\
    \ 或 `CLOSED` 之一。\n\n引用字节序列（包括 0 字节）的 `Blob` 被认为处于 `OPENED` 可读状态。\n\n如果调用了其 `close`\
    \ 方法，则认为该 `Blob` 已关闭。关闭的 `Blob` 被认为处于 `CLOSED` 可读状态。\n\n### Q. FileReader 的不同状态有哪些？\n\
    \n### 答\n\n`FileReader` 对象可以处于 3 状态之一。`readyState` 属性在获取时必须返回当前状态，该状态必须是以下值之一：\n\
    \n- `EMPTY`: `FileReader` 对象已构造，且没有待处理的读取。没有任何读取方法被调用过。这是新创建的 `FileReader` 对象的默认状态，直到在其上调用了其中一个读取方法为止。\n\
    - `LOADING`: 正在读取 `File` 或 `Blob`。其中一个读取方法正在处理中，且在读取过程中没有发生错误。\n- `DONE`: 整个 `File`\
    \ 或 `Blob` 已读取到内存，或者在读取期间发生了文件错误，或者使用 `abort()` 取消了读取。`FileReader` 不再读取 `File`\
    \ 或 `Blob`。如果 `readyState` 设置为 `DONE`，意味着对此 `FileReader` 至少调用过一次读取方法。\n\n## 第\
    \ 13 章 Web RTC\n\n### Q. 什么是 Web RTC？\n\n### 答\n\nWeb RTC 为浏览器提供了在无需安装任何额外插件的情况下进行实时通信的能力。它涉及浏览器之间通过原生能力进行的音频、视频和其他类型的数据流。\n\
    \n### Q. Web RTC 实现了哪些 API？\n\n### 答\n\nWeb RTC 实现了三个不同的 API。这些接口列如下：\n\n- `MediaStream`:\
    \ 它代表使用摄像头和麦克风的同步媒体流。\n- `RTCPeerConnection`: 该接口负责实时通信期间对等浏览器之间的稳定连接。\n- `RTCDataChannel`:\
    \ 该接口负责对等浏览器之间其他类型的数据通信。例如使用浏览器的远程桌面共享。\n\n### Q . 什么是 MediaStream？\n\n### 答\n\
    \nMediaStream 基本上代表了由摄像头和麦克风捕获的流。每个 `MediaStream` 都有一个捕捉流的输入。此 `MediaStream` 可以通过\
    \ `navigator.getUserMedia()` 方法访问。\n\n### Q . `getUserMedia()` 方法的输入参数有哪些？ \n\n\
    ### 答\n\n`getUserMedia()` 方法接受 3 个参数作为输入。这些参数如下：\n\n1. 类似于配置对象的约束对象。\n2. 成功回调方法。\n\
    3. 错误回调方法。\n\n### Q. 什么是 MediaStreamTracks？\n\n### 答\n\n`getUserMedia()` 返回的 `MediaStream`\
    \ 有两个实用的方法 `getAudioTracks()` 和 `getVideoTracks()`。这两个方法都返回一个 `MediaStreamTracks`\
    \ 数组。\n\n### Q . Web RTC 通信使用了哪些协议？\n\n### 答\n\nWeb RTC 使用 2 个不同的协议进行通信。这 2 个协议列如下：\n\
    \n- `DTLS`: 数据 agram 传输层安全协议。\n- `SRTP`: 安全实时传输协议。\n\n### Q . 如何在 Chrome 浏览器中查看进行中的\
    \ Web RTC 会话的统计信息？\n\n### 答\n\n我们可以通过在 Chrome 浏览器中使用 `chrome://webrtc-internals/`\
    \ 查看正在进行的 Web RTC 会话的详细统计数据和图表。\n\n### Q . 通道的不同事件处理器有哪些？\n\n### 答\n\n一个通道有 4\
    \ 个不同的事件处理器。这些事件处理器如下：\n\n- `onopen`: 在连接建立时执行。\n- `onerror`: 如果创建连接时发生错误则执行。\n\
    - `onmessage`: 当收到消息时，执行此方法。\n- `onclose`: 如果对方关闭连接则执行。\n\n### Q . 什么是信令通道（signal\
    \ channel）？\n\n### 答\n\n没有某些服务器，WebRTC 无法建立连接。我们称之为信令通道。\n\n### Q . 什么是 ICE 技术？\n\
    \n### 答\n\n交互连接建立 (ICE) 是一种涉及网络地址转换器 (NATs) 网络技术，用于互联网协议语音 (VoIP)、视频、即时消息和其他交互媒体。\n\
    \n### Q. 什么是 ICE 候选（Candidate）？\n\n### 答\n\n通信期间 peers 必须交换有关网络连接的信息。这被称为 ICE\
    \ 候选。\n\n### Q . Web RTC 需要哪些服务器端功能？\n\n### 答\n\nWeb RTC 需要服务器端功能来创建 peers：\n\n\
    1. 用户发现和通信。\n2. 信令。\n3. NAT/防火墙穿透。\n4. 对等通信失败时的中继服务器。\n\n### Q. 什么是 STUN 协议？\n\
    \n### 答\n\nSTUN (NAT 穿透工具) 是一套标准的方法和网络协议，允许位于 NAT 后的终端主机发现自己的 IP 地址。\n\n## 第 14\
    \ 章 拖放 API\n\n### Q. 如何让浏览器中的内容可拖拽？\n\n### 答\n\nHTML5 提供了拖放功能。通过将 `draggable`\
    \ 属性设置为 `true` 可以使元素变为可拖拽。查看带有两个按钮的代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>可拖拽元素</title>\n</head>\n<body>\n<button draggable=\"true\">可拖拽按钮</button>\
    \ <button>普通按钮</button>\n</body>\n</html>\n```\n\n下方截图显示了这两个按钮。可拖拽按钮是可以移动的，而普通按钮固定在位置上。\n\
    \n![](img/image0099.jpeg)\n\n### Q. 元素拖拽时发生了什么？\n\n### 答\n\n拖拽开始时有 3 个需要注意的关键点。这些关键点如下：\n\
    \n- `Drag Data`: 代表拖拽时传输的数据类型。\n- `Drag Feedback`: 代表拖拽操作期间鼠标指针旁边的图像。\n- `Drag\
    \ Effect`: 代表元素发生的拖拽类型。它可以是 3 类型并列如下：\n    - `copy`: 此效果表示正在拖拽的数据将从当前位置复制到目标位置。\n\
    \    - `move`: 此效果表示正在拖拽的数据将从原始位置移动到目标位置。\n    - `link`: 此效果表示源和目标位置之间将创建某种形式的关系或连接。\n\
    \n### Q. 哪些是拖放事件？\n\n### 答\n\n有 7 个不同的拖放事件，可以通过编程方法附加回调方法。\n\n"
- fmt: "\n`Dragstart`: it is fired on an element when a drag is started. `Dragenter`:\
    \ it is fired when the mouse enters an element while a drag is occurring.\n\n\
    `Dragover`: This event is fired as the mouse is moving over an element when a\
    \ drag is occurring.\n\n`Dragleave`: This event is fired when the mouse leaves\
    \ an element while a drag is occurring.\n\n`Drop`: The drop event is fired on\
    \ the element where the drop occurred at the end of the drag operation.\n\n`Dragend`:\
    \ The source of the drag will receive a `dragend` event when the drag operation\
    \ is complete, whether it was successful or not. \n\n### Q. What is a `dataTransfer`\
    \ property?\n\n**ANSWER**\n\n`dataTransfer` object holds the piece of data sent\
    \ in a drag action. `dataTransfer` is set in the `dragstart` event and read/handled\
    \ in the `drop` event. The syntax for setting value in `dataTransfer` object is\
    \ as follows.\n\n```javascript\nevent.dataTransfer.setData(format, data)\n```\n\
    \nThe above syntax will set the object's content to the mime type and data payload\
    \ passed as arguments.\n\n### Q. Develop an example to drag and drop an element\
    \ from one place to another?\n\n**ANSWER**\n\nTo demonstrate drag and drop we\
    \ have created div element with rounded border and background color red. We will\
    \ drag this element and drop it in a container. The following code shows the drag\
    \ and drop example.\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<style>\n#ball{\n\
    width:50px;\nheight:50px;\nbackground: red; border-radius: 100%; \n}\n#dropZone\
    \ {\nwidth:200px;\nheight:100px;\npadding:10px;\nborder:1px solid #aaaaaa;\n}\n\
    </style>\n</head>\n<body>\n\n<div id=\"dropZone\" ondrop=\"drop(event)\" ondragover=\"\
    allowDrop(event)\">\n</div>\n<br>\n<div id=\"ball\" draggable=\"true\" ondragstart=\"\
    drag(event)\"></div>\n<script>\nfunction allowDrop(ev) {\nev.preventDefault();\n\
    }\n\nfunction drag(ev) {\nev.dataTransfer.setData(\"text\", ev.target.id);\n}\n\
    \nfunction drop(ev) {\nev.preventDefault();\nvar data = ev.dataTransfer.getData(\"\
    text\");\nev.target.appendChild(document.getElementById(data));\n}\n</script>\n\
    </body>\n</html>\n```\n\nThe output of the code looks like following screenshot\
    \ before dragging with both the element are in there original position.\n\n![](Images/image00100.jpeg)\n\
    \nThe output of the code looks like following screenshot after dragging and dropping\
    \ the draggable element to the container.\n\n![](Images/image00101.jpeg)\n\n##\
    \ Chapter 15 App Cache API\n\n### Q. What is app cache? What are the benefits\
    \ of using app cache API in a web application?\n\n**ANSWER**\n\nApp cache API\
    \ is the new feature provided by the HTML5. This API power up a web application\
    \ working without an internet connection. The most important benefits by this\
    \ API are listed below:\n\n- **Speed**: Like all other cache it increases the\
    \ speed of accessing the page content.\n- **Offline browsing**: It increases the\
    \ usability of application as it can be accessed without internet.\n- **Reduced\
    \ load**: As the content and data is now cache in the browser the load of the\
    \ application is reduced form the server. \n- **Few network calls**: As most of\
    \ reusable content is present in app cache it this reduces the no of network call\
    \ to the server.\n\n### Q. How to enable application cache in an html file?\n\n\
    **ANSWER**\n\nTo enable application cache in a HTML file we need to have `manifest`\
    \ attribute in `<HTML>` element containing the name of the `appcache` file. The\
    \ syntax of declaring application cache in HTML file is as follows.\n\n```html\n\
    <!DOCTYPE HTML>\n<html manifest=\"filename.appcache\"> </html>\n```\n\n### Q.\
    \ What is the media type of appcache file?\n\n**ANSWER**\n\nA manifest file needs\
    \ to have `text/cache-manifest` media type.\n\n### Q. What are the 3 different\
    \ section of manifest file?\n\n**ANSWER**\n\nA manifest file has 3 different sections.\
    \ These 3 different sections are as follows.\n\n- **CACHE MANIFEST**: Files listed\
    \ under this header will be cached after they are downloaded for the first time.\n\
    - **NETWORK**: Files listed under this header require a connection to the server,\
    \ and will never be cached.\n- **FALLBACK**: Files listed under this header specifies\
    \ fallback pages if a page is inaccessible.\n\n### Q. What is NETWORK section?\n\
    \n**ANSWER**\n\nNETWORK is one of the sections in manifest file. The file name\
    \ listed in the NETWORK section is never cached locally. The following code shows\
    \ a sample of NETWORK section.\n\n```text\nNETWORK: login.html\n```\n\n### Q.\
    \ What is FALLBACK section?\n\n**ANSWER**\n\nFALLBACK is one of the sections in\
    \ manifest file. In this section we can mention the file name which will be called\
    \ when application is offline. The following code shows a sample of FALLBACK section.\n\
    \n```text\nFALLBACK:\n/html/ /offline.html\n```\n\n### Q. What is CACHE MANIFEST\
    \ section?\n\n**ANSWER**\n\nCACHE MANIFEST is one of the sections in manifest\
    \ file. The file names mentioned in this section is cached locally. The following\
    \ code shows a sample of CACHE MANIFEST section.\n\n```text\n/style.css\n/favicon.gif\
    \ /app.js\n```\n\n### Q. How to view app cache detail in chrome browser?\n\n**ANSWER**\n\
    \nWe can view the app cache content like what it is caching, size and time etc.\
    \ using the following link in chrome browser.\n\n`chrome://appcache-internals/`.\n\
    \nThe following screenshot shows the appcache internal for my browser.\n\n![](Images/image00102.jpeg)\n\
    \n### Q. How to detect the support of browser for appcache? **ANSWER**\n\nWe can\
    \ detect the support of appcache by checking the existence of `applicationCache`\
    \ in `window` object. We can use javascript if statement which checks the truth\
    \ value of `window.applicationCache` object. The following screenshot shows the\
    \ chrome console detecting applicationCache object.\n\n![](Images/image00103.jpeg)\n\
    \n### Q. How to update the appcache manually?\n\n**ANSWER**\n\nWe can update the\
    \ cache by doing hard reload to the browser. We can also call `swapCache()` method\
    \ to programmatically update the cache.\n\n## Chapter 16 Server Sent Events\n\n\
    ### Q. What is Server Side Events (SSE)?\n\n**ANSWER**\n\nHTML5 provides server\
    \ side events feature by which a web page gets the update from the server automatically.\
    \ A great example of this feature is Facebook notification or Google updates.\n\
    \n### Q. What is the content type of server response? **ANSWER**\n\nThe content\
    \ type of the server response is `text/event-stream` for the `Content-Type` header.\n\
    \n### Q. How to create an event source for listening to server updates? **ANSWER**\n\
    \nAn event source can be created by instantiating the object of `EventSource`\
    \ class with a server path. The syntax for creating an event source is below.\n\
    \n```javascript\nvar source = new EventSource(\"<URL to Server>\");\n```\n\n###\
    \ Q. What are the event types is fired by an EventSource? **ANSWER**\n\nAn EventSource\
    \ fires 3 different events. Callback methods can be attached to the source for\
    \ listening to these events. These event types are listed below.\n\n- `onopen`:\
    \ This event is fired when the server open the connection to the browser.\n- `onmessage`:\
    \ This event is fired when server produces the new output to the stream.\n- `onerror`:\
    \ This event is fired when an error occurs by some means.\n\n### Q. How to close\
    \ an event stream?\n\n**ANSWER**\n\nThe event stream can be closed using `close()`\
    \ method.\n\n### Q. What is the format of event stream?\n\n**ANSWER**\n\nThe event\
    \ stream is a simple stream of text data, which must be encoded using `UTF-8`.\
    \ Each message is separated by a pair of newline characters. A colon as the first\
    \ character of a line is, in essence, a comment, and is ignored.\n\n## Chapter\
    \ 17 Miscellaneous Questions\n\n### Q. What is strict mode?\n\n**ANSWER**\n\n\
    Strict mode is a new directive in new ECMA 5 JavaScript specification. It is used\
    \ for secure JavaScript coding. It eliminates some JavaScript silent errors by\
    \ changing them to throw errors.\n\nThe syntax of writing strict mode is below\
    \ expression.\n\n```javascript\n\"use strict\"\n```\n\nBelow code shows the use\
    \ of strict mode inside a function.\n\n```javascript\nfunction sayHello(){\n\"\
    use strict\";\nmyName = \"Sandeep\"; \n}\n\nsayHello();\n```\n"
