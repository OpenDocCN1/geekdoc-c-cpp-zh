  trans: "\n\n下面的截图显示了在 `sayHello()` 方法内部使用未声明变量产生的错误。\n\n![](img/image00104.jpeg)\n\
    \n### Q. 请列出在严格模式（strict mode）下不允许的条件？\n\n**答案**\n\n下文是 ECMA5 严格模式下不允许的条件列表：\n\
    \n- 不允许在不声明变量的情况下使用变量。不允许删除变量、函数或参数。\n- 不允许重复定义属性。不允许出现重复的参数名。\n- 不允许使用八进制数字字面量和转义字符。\n\
    - 不允许向只读属性写入。不允许删除不可删除的属性。\n- 字符串 `\"eval\"` 不能作为变量名。字符串 `\"arguments\"` 不能作为变量名。不允许使用\
    \ `with` 语句。\n- 不允许使用未来保留的关键字。\n\n### Q. `0.1+0.2` 在控制台中的输出结果是什么？为什么？**答案**\n\n\
    JavaScript 数学库遵循 IEEE 754 标准进行数学计算。IEEE 754 标准使用 64 位表示浮点数。这在评估 `0.1 + 0.2` 表达式时产生了一个问题。下面的截图显示了该表达式的\
    \ Firebug 控制台。\n\n![](img/image00105.jpeg)\n\nJavaScript 内部将 `0.1` 转换为 16 位精度，变为\
    \ `0.1000000000000000`，然后加上 `0.2` 变为 `0.30000000000000004`。下面的截图显示了 JavaScript\
    \ 代码中的这一演示。\n\n![](img/image00106.jpeg)\n\n### Q. 如何解决 `0.1+0.2 = 0.30000000000000004`\
    \ 问题并产生 `0.1+0.2 = 0.3`？**答案**\n\n这个问题可以通过对该表达式使用 `toFixed(1)` 方法来解决。`toFixed()`\
    \ 方法将数字转换为指定的小数位数。下面的截图显示了如何使用 `toFixed()` 方法产生正确的输出 `0.3`。\n\n![](img/image00107.jpeg)\n\
    \n### Q. 下面代码的输出是什么？为什么？\n\n```javascript\n(function(){\n\n  var a = b = 3;\n\n\
    })();\n\nconsole.log(typeof a);\nconsole.log(typeof b);\n```\n\n**答案**\n\n上述代码会在控制台打印\
    \ `undefined` 和 `Number`。下面的截图显示了上述代码在 Firebug 控制台中的输出。\n\n![](img/image00108.jpeg)\n\
    \nJavaScript 将上述代码处理如下图所示。从代码中可以清楚，变量 `a` 在函数的局部作用域内，而 `b` 被视为 `this.b`。当前的引用\
    \ `this` 代表 `window` 对象。\n\n![](img/image00109.jpeg)\n\n### Q. 下面代码的输出是什么？为什么？`console.log(1+2+4);`\
    \ **答案**\n\n由于所有参数都是数字，上述代码的输出是 `7`。下面的截图显示了上述代码在 chrome 控制台中的输出。\n\n![](img/image00110.jpeg)\n\
    \n### Q. 解释 JavaScript 中的变量提升（Hoisting）？**答案**\n\n提升是 JavaScript 将声明移动到顶部的默认行为。换句话说，可以在变量声明之前使用它。让我们通过以下示例来理解提升。\n\
    \n**示例 1：**\n\n以下代码包含一个 `display()` 方法，它在控制台打印 `a` 的值。\n\n```javascript\nfunction\
    \ display(){ \n  console.log(a);\n}\ndisplay();\n```\n\n上述代码的输出将是一个 `reference`\
    \ （引用错误），因为我们没有定义该变量。下面的截图显示了上述代码的输出。\n\n![](img/image00111.jpeg)\n\n**示例 2：**\n\
    \n以下代码包含一个 `display()` 方法，它在控制台打印 `a` 的值。\n\n```javascript\nfunction display(){\n\
    \  var a;\n  console.log(\"Output: \"+a); \n}\ndisplay();\n```\n\n上述代码的输出将是 `undefined`，因为我们定义了变量但没有分配任何值。下面的截图显示了上述代码的输出。\n\
    \n![](img/image00112.jpeg)\n\n**示例 3：**\n\n以下代码包含一个 `display()` 方法，它在控制台打印 `a`\
    \ 的值。\n\n```javascript\nfunction display(){\n  console.log(\"Output: \"+a);\n\
    \  var a; \n}\ndisplay();\n```\n\n上述代码的输出将是 `undefined`，因为我们定义了变量但没有分配任何值。示例 2\
    \ 和示例 3 的输出相同。这意味着变量声明被移动到了顶部。下面的截图显示了上述代码的输出。\n\n![](img/image00113.jpeg)\n\n\
