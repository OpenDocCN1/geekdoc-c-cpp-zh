  md: "# 100 . Counting Words in a String\n\n```\nc code\n#include <stdio.h>\n\nint\
    \ countWords (char str []) {\n    int count = 0;\n    int inWord = 0;\n    for\
    \ (int i = 0; str[i] != '\\0'; i++) {\n        if (str[i] == ' ' || str[i] ==\
    \ '\\n' || str[i] == '\\t') {\n            inWord = 0;\n        } else if (inWord\
    \ == 0) {\n            inWord = 1;\n            count++;\n        }\n    }\n \
    \   return count;\n}\n\nint main () {\n    char text[] = \"This is an example\
    \ sentence.\";\n    printf(\"Number of words in the string : %d\\n\", countWords\
    \ (text));\n    return 0;\n}\n```"
