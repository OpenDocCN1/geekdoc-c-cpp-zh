    \nwhile 循环可以相互嵌套以执行多层重复。\n\n示例：C 中的嵌套 while 循环\n\n```c code\n#include <stdio.h>\n\
    \nint main() {\n    int i = 1,j;\n    while (i <= 3) {\n        j = 1;\n     \
