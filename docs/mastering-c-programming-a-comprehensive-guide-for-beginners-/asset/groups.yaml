    - \"r+\": 读写模式。打开文件用于读取和写入。\n- \"w+\": 读写模式。打开文件用于读取和写入。如果文件不存在，则创建一个新文件。\n- \"\
    a+\": 读写追加模式。在文件的末尾打开文件用于读取和写入。如果文件不存在，则创建一个新文件。\n\n示例：以不同模式打开文件\n\n```c\n#include\
    \ <stdio.h>\n\nint main() {\n    FILE *readFile, *writeFile, *appendFile;\n\n\
    \    readFile = fopen(\"example.txt\", \"r\"); // 读取模式\n    writeFile = fopen(\"\
    output.txt\", \"w\"); // 写入模式\n    appendFile = fopen(\"data.txt\", \"a\"); //\
    \ 追加模式\n\n    // 文件打开失败时的错误处理\n\n    fclose(readFile);\n    fclose(writeFile);\n\
