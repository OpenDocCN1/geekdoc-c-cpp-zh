    }\n```\n\n- condition：代表要检查的条件。如果条件求值为真（非零），则执行 while 循环内部的代码块。如果条件为假（零），循环终止，程序移动到循环后的下一个语句。\n\
    \n# 2 . 使用 while 循环：\n\n示例：在 C 中使用 while 循环\n\n```c code\n#include <stdio.h>\n\
    \nint main() {\n    int count = 1;\n\n    while ( count <= 5 ) {\n        printf(\"\
