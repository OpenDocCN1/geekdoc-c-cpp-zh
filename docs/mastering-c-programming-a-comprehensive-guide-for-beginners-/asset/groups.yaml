- md: "\nFiles in C are used to store data permanently on secondary storage devices\
    \ like hard drives, SSDs, etc. File handling involves operations like opening,\
    \ reading, writing, closing, and manipulating files.\n\n## Example: Opening and\
    \ Closing a File\n\n```c\n#include <stdio.h>\n\nint main() {\nFILE * filePointer;\
    \ // File pointer declaration\n\nfilePointer = fopen(\"example.txt\", \"w\");\
    \ // Opening a file in write mode\nif (filePointer == NULL) {\n    printf(\"Error\
    \ opening the file. \\n\");\n    return 1;\n}\n\nfclose(filePointer); // Closing\
    \ the file\n\nreturn 0;\n}\n```\n\nExplanation: Opens a file named \"example.txt\"\
    \ in write mode and closes it using fclose().\n\n## 2. File Modes in C:\n\nFile\
    \ Modes in C:\n\n- \"r\": Read mode. Opens a file for reading.\n- \"w\": Write\
    \ mode. Opens a file for writing. If the file doesn't exist, it creates a new\
    \ file. If the file exists, it truncates it to zero length.\n- \"a\": Append mode.\
    \ Opens a file for writing at the end of the file. If the file doesn't exist,\
    \ it creates a new file.\n- \"r+\": Read and Write mode. Opens a file for both\
    \ reading and writing.\n- \"w+\": Read and Write mode. Opens a file for reading\
    \ and writing. If the file doesn't exist, it creates a new file.\n- \"a+\": Read\
    \ and Append mode. Opens a file for reading and writing at the end of the file.\
    \ If the file doesn't exist, it creates a new file.\n\nExample: Opening a File\
    \ in Different Modes\n\n```c\n#include <stdio.h>\n\nint main() {\n    FILE *readFile,\
    \ *writeFile, *appendFile;\n\n    readFile = fopen(\"example.txt\", \"r\"); //\
    \ Read mode\n    writeFile = fopen(\"output.txt\", \"w\"); // Write mode\n   \
    \ appendFile = fopen(\"data.txt\", \"a\"); // Append mode\n\n    // Error handling\
    \ if file opening fails\n\n    fclose(readFile);\n    fclose(writeFile);\n   \
    \ fclose(appendFile);\n\n    return 0;\n}\n```\n\n**Explanation**: Opens files\
    \ \"example.txt\" in read mode, \"output.txt\" in write mode, and \"data.txt\"\
    \ in append mode.\n\n## 3. File Operations in C:\n\n**Basic File Operations**:\n\
    \n- fopen(): Opens a file.\n- fclose(): Closes a file.\n- fputc(): Writes a character\
    \ to a file.\n- fputs(): Writes a string to a file.\n- getc(): Reads a character\
    \ from a file.\n- gets(): Reads a line from a file.\n- fprintf(): Writes formatted\
    \ output to a file.\n- sscanf(): Reads formatted input from a file.\n- rewind():\
    \ Sets file position to the beginning.\n\n**Example: File Operations for Writing\
    \ and Reading**\n\n```c\n#include <stdio.h>\n\nint main() {\n    FILE * filePointer;\n\
    \    char data [50] = \" Hello, C File Handling ! \";\n\n    filePointer = fopen(\"\
    example.txt\", \"w\"); // Open file in write mode\n    if (filePointer == NULL)\
    \ {\n        printf(\"Error opening the file. \\n\");\n        return 1;\n   \
    \ }\n\n    fputs(data, filePointer); // Write data to file\n    fclose(filePointer);\
    \ // Close the file\n\n    filePointer = fopen(\"example.txt\", \"r\"); // Open\
    \ file in read mode\n    if (filePointer == NULL) {\n        printf(\"Error opening\
    \ the file. \\n\");\n        return 1;\n    }\n\n    char readData[100];\n   \
    \ fgets(readData, 100, filePointer); // Read data from file\n    printf(\"Data\
    \ from file : %s\\n\", readData);\n\n    fclose(filePointer); // Close the file\n\
    \n    return 0;\n}\n```\n\n- **Explanation**: Writes data to \"example.txt\" using\
    \ fputs() and reads it using fgets() to display the content.\n\n## 4. File Position\
    \ Indicator:\n\nFile Position Indicator:\n\nThe file position indicator keeps\
    \ track of the current position within a file. Functions like fseek() and ftell()\
    \ manipulate and retrieve the file position.\n\nExample: File Position Indicator\
    \ Operations\n\n```c\n#include <stdio.h>\n\nint main () {\n    FILE * filePointer;\n\
    \    filePointer = fopen(\"example.txt\", \"r\"); // Open file in read mode\n\n\
    \    fseek(filePointer, 0, SEEK_END); // Move file pointer to end\n    long fileSize\
    \ = ftell(filePointer); // Get file size\n    printf(\"File size: %ld bytes\\\
    n\", fileSize);\n\n    fclose(filePointer); // Close the file\n\n    return 0;\n\
    }\n```\n\n- **Explanation**: Determines the size of \"example.txt\" by moving\
    \ the file pointer to the end and retrieving the position.\n\n## 5. Error Handling\
    \ in File Operations:\n\nError Handling in File Operations:\n\nFile operations\
    \ may fail due to various reasons like file not found, permission issues, etc.\
    \ Checking for errors using feof() and handling errors using perror() is crucial.\n\
    \nExample: Error Handling in File Operations\n\n```c\n#include <stdio.h>\n\nint\
    \ main () {\n    FILE *filePointer;\n    filePointer = fopen(\"nonexistent.txt\"\
    , \"r\"); // Open a non-existing file\n\n    if (filePointer == NULL) {\n    \
    \    perror(\"Error opening the file\");\n        return 1;\n    }\n\n    fclose(filePointer);\n\
    \    return 0;\n}\n```\n"
  mdcn: "\n\nC 语言中的文件用于在硬盘、SSD 等次级存储设备上持久化地存储数据。文件处理涉及打开、读取、写入、关闭和操作文件等操作。\n\n## 示例：打开和关闭文件\n\
    \n```c\n#include <stdio.h>\n\nint main() {\nFILE * filePointer; // 文件指针声明\n\n\
