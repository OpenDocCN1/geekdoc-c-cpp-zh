    # Declaration in C Functions


    Function declaration in C programming informs the compiler about the existence
    of a function, its name, return type, and parameters before the function''s actual
    implementation . This guide aims to cover various aspects of declaration, its
    syntax, significance, and practical examples .


    # 1 . Introduction to Function Declaration :


    What is Function Declaration?


    Function declaration is a statement that informs the compiler about a function''s
    name, return type, and parameters . It provides a prototype or signature of the
    function before its actual implementation .


    Example : Function Declaration Syntax


    ```

    c code

    // Function declaration ( Prototype )

    returnType functionName ( parameter1_type parameter1, parameter2_type parameter2,
    ... ) ;

    ```


