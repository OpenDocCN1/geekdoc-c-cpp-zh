    ```c\n#include <stdio.h>\n\n// Function declaration\nvoid greet() {\n    printf(\"\
    Hello, world! \\n\");\n}\n\nint main() {\n    // Function call\n    greet();\n\
    \n    return 0;\n}\n```\n\n- Explanation : The greet() function prints \"Hello,\
    \ world!\" when called.\n\n## 2 . Function Declaration and Definition :\n\nFunction\
    \ Declaration vs Definition :\n\n- Declaration : Informs the compiler about the\
