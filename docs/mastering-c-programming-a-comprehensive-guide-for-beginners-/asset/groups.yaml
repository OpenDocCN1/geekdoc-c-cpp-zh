    ，以写入模式打开 \"output.txt\"，并以追加模式打开 \"data.txt\"。\n\n## 3. C 语言中的文件操作：\n\n**基础文件操作**：\n\
    \n- fopen(): 打开文件。\n- fclose(): 关闭文件。\n- fputc(): 向文件写入一个字符。\n- fputs(): 向文件写入一个字符串。\n\
    - getc(): 从文件中读取一个字符。\n- gets(): 从文件中读取一行。\n- fprintf(): 向文件写入格式化输出。\n- sscanf():\
    \ 从文件中读取格式化输入。\n- rewind(): 将文件位置重置到开头。\n\n**示例：写入和读取的文件操作**\n\n```c\n#include\
    \ <stdio.h>\n\nint main() {\n    FILE * filePointer;\n    char data [50] = \"\
    \ Hello, C File Handling ! \";\n\n    filePointer = fopen(\"example.txt\", \"\
    w\"); // 以写入模式打开文件\n    if (filePointer == NULL) {\n        printf(\"Error opening\
    \ the file. \\n\");\n        return 1;\n    }\n\n    fputs(data, filePointer);\
    \ // 将数据写入文件\n    fclose(filePointer); // 关闭文件\n\n    filePointer = fopen(\"example.txt\"\
    , \"r\"); // 以读取模式打开文件\n    if (filePointer == NULL) {\n        printf(\"Error\
    \ opening the file. \\n\");\n        return 1;\n    }\n\n    char readData[100];\n\
    \    fgets(readData, 100, filePointer); // 从文件读取数据\n    printf(\"Data from file\
    \ : %s\\n\", readData);\n\n    fclose(filePointer); // 关闭文件\n\n    return 0;\n\
    }\n```\n\n- **解释**：使用 fputs() 将数据写入 \"example.txt\"，并使用 fgets() 读取它以显示内容。\n\n\
    ## 4. 文件位置指示：\n\n文件位置指示：\n\n文件位置指示用于跟踪文件内的当前位置。fseek() 和 ftell() 等函数用于操作和获取文件位置。\n\
    \n示例：文件位置指示操作\n\n```c\n#include <stdio.h>\n\nint main () {\n    FILE * filePointer;\n\
