  \ 重新生成 aclocal.m4 文件。\n\n   你需要来自 GNU automake 1.9（或更高版本）的 aclocal 来执行此操作。\n\n \
  \  然后运行 'autoconf' 重新生成 configure 文件。\n\n➐ 你还需要 config.guess 和 config.sub，从 http://savannah.gnu.org/\
  \ \n   'config' 项目的 CVS 获取它们。获取它们的命令是\n\n   $ wget 'http://savannah.gnu.org/cgi-bin/viewcvs/*checkout*/config/config/\n\
  \   config.guess'\n\n   $ wget 'http://savannah.gnu.org/cgi-bin/viewcvs/*checkout*/config/config/\n\
  \   config.sub'\n\n➑ 你可能还想将便利头文件 gettext.h\n   从 /usr/share/gettext 目录拷贝到你的包中。\n\
  \n   它是 <libintl.h> 的封装器，实现了 configure --disable-nls\n   选项。\n\n   按回车键确认之前的 6 段内容。\n\
  \n   [ENTER]\n\n   $\n```\n\n`gettextize` 做的第一件事是在需要时在我们的项目目录的根目录下创建一个 `po` 子目录（在\
  \ ➊ 处）。这将是存放所有 NLS 相关文件的地方，并由一个针对 NLS 特定的 makefile 进行维护和管理，这个 makefile 也是由 `gettextize`\
  \ 提供的，正如你在输出的前几行中第三条 `Copying file` 信息中所看到的那样。\n\n从你系统的 `gettext` 安装文件夹拷贝文件到 `po`\
  \ 目录后，它会更新根目录下的 `Makefile.am` 文件和 `configure.ac`（在 ➋ 处）。Listing 12-4 和 12-5 显示了它对这些文件做的更改。\n\
  \n```\nbin_PROGRAMS = src/gt\n\nsrc_gt_SOURCES = src/gt.c src/gettext.h\n\nsrc_gt_CPPFLAGS\
  \ = -DLOCALE_DIR=\\\"$(localedir)\\\"\n\nSUBDIRS = po\n\nACLOCAL_AMFLAGS = -I m4\n\
  \nEXTRA_DIST = config.rpath\n```\n*Listing 12-4:* Makefile.am: gettextize 对此文件的更改\n\
  \n顶层 Makefile.am 文件添加（或更新）了一个 `SUBDIRS` 变量，以便 po/Makefile 能被 make 处理，并添加了 `AC_LOCAL_AMFLAGS`\
  \ 以支持 m4 目录。最后，`gettextize` 确保了 config.rpath 被分发。**注意**\n添加 `ACLOCAL_AMFLAGS = -I\
  \ m4` 在较新版本的 Automake 中不再需要，因为 gettextize 已经透明地处理了这一点。\n\n```\n#               \
  \                *- Autoconf -*-\n\n# 使用 autoconf 处理此文件以生成 configure 脚本。\n\n--snip--\n\
  \n# 检查函数。\n\nAC_CHECK_FUNCS([setlocale])\n\nAC_CONFIG_FILES([Makefile])\n\nAC_OUTPUT\n\
  ```\n*Listing 12-5:* configure.ac: gettextize 对此文件的更改\n\n`gettext` 对 `configure.ac`\
  \ 做的唯一更改是将 po/Makefile 添加到 `AC_CONFIG_FILES` 列表中。一个敏锐的读者会注意到结尾的 `.in` 并可能认为 `gettextize`\
  \ 犯了错。回看 `gettextize` 的输出，我们在 ➌ 处看到它要求我们在 `configure.ac` 中添加一个宏 `AM_GNU_GETTEXT([external])`。考虑到它刚刚编辑了\
  \ `configure.ac`，这可能看起来很奇怪。显示的文本对这一点并不明确，但事实是，以前是按需添加整个 `gettext` 运行时。这一行只是告诉我们不打算使用这种内部\
  \ `gettext` 库，我们应该通过调用该宏的外部选项来指示，这样 configure 就会去项目外部寻找。客观上，使用内部 `gettext` 版本已不再被推荐——主要是因为\
  \ gettext 现在集成到了 libc 中。如果你使用的是带有 GNU 工具的其他类型的系统，你应该安装 `gettext` 包以便可以使用该外部版本。\n\
  \n当我添加这个宏时，注意到 `autoreconf` 报错说在使用 `AM_GNU_GETTEXT` 但没有使用 `AM_GETTEXT_VERSION`，后者指示构建系统与项目兼容的\
  \ `gettext` 版本。我也添加了这个宏，版本值与我系统上 `gettext --version` 的输出相对应。我可以使用较低的版本值以允许项目在其他可能较旧的系统上编译，但我必须进行一些研究以确保我使用的所有选项在所选版本中都是有效的。\n\
  \n[Listing 12-6] 显示了 `configure.ac` 中的此添加。\n\n```\n--snip--\n\n# 检查程序。\n\nAC_PROG_CC\n\
  \nAM_GNU_GETTEXT_VERSION([0.19.7])\n\nAM_GNU_GETTEXT([external])\n\n# 检查库。\n\n--snip--\n\
  ```\n*Listing 12-6:* configure.ac: 添加 AM_GNU_GETTEXT\n\n\n\n\nListing 12-7 显示此文件的精简版本——我删除了注释以便更容易查看功能内容，但注释非常详细且确实有用，因此请检查完整文件。\n\
  \n```\nDOMAIN = $(PACKAGE)\n\nsubdir = po\n\ntop_builddir = ..\n\nXGETTEXT_OPTIONS\
  \ = --keyword=_ --keyword=N_\n\nCOPYRIGHT_HOLDER = John Calcote\n\nPACKAGE_GNU =\
  \ no\n\nMSGID_BUGS_ADDRESS = gt-bugs@example.org\n\nEXTRA_LOCALE_CATEGORIES =\n\n\
  USE_MSGCTXT = no\n\nMSGMERGE_OPTIONS =\n\nMSGINIT_OPTIONS =\n\nPO_DEPENDS_ON_POT\
  \ = no\n\nDIST_DEPENDS_ON_UPDATE_PO = yes\n```\n\n*Listing 12-7:* `po/Makevars.template`:\
  \ *控制 NLS 构建的变量列表*\n\n高亮了对 gt 版本的该文件所做的更改。如你所见，默认值大多没有问题。我将版权所有者从默认的自由软件基金（Free\
  \ Software Foundation）进行了更改。我还标出 gt 不是一个 GNU 软件包——这里默认是空的，这告诉 `gettext` 在运行时尝试自行识别。\n\
  \n我为 `MSGID_BUGS_ADDRESS` 指定了一个值，这是生成的 `*.pot` 文件中的一个值。由 `po` 目录下的 Makefile 生成的值将是你在此处指定的电子邮件地址（或网页链接）。最后，我将\
  \ `PO_DEPENDS_ON_POT` 设置为 `no`，因为否则每当 `gt.pot` 文件发生微小变化时，所有特定区域的 `*.po` 文件都会重新生成，我宁愿在创建发行版时才为项目生成\
  \ `*.po` 文件。这是一个基于个人喜好的任意决定；如果你愿意，也可以将其保持为默认值 `yes`。\n\n在 ➎ 处，我们看到向 `po/POTFILES.in`\
  \ 添加一些文本的请求。这是 Automake 的要求，即所有源文件必须在 Makefile 中指定。我们被要求添加所有由 `xgettext` 处理以提取消息的源文件。文件可以每行添加一个，如果需要，此文件中可以使用以井号（##）开头的注释。Listing\
  \ 12-8 高亮了我向 gt 版本的 `po/POTFILES.in` 中添加的内容。\n\n```\n# 包含可翻译字符串的源文件列表。\n\nsrc/gt.c\n\
  ```\n\n*Listing 12-8:* `po/POTFILES.in`: *对该文件生成版本进行的更改*\n\n`po/POTFILES.in` 中列出的文件应相对于项目根目录。\n\
  \n➏ 和 ➐ 处列出的步骤在较版本的 Autotools 中已不再需要。当你执行 `configure` 脚本时，如果它会自动运行 `aclocal` 并为你重新构建。`config.sub`\
  \ 和 `config.guess` 文件现在根据 `gettext` 宏的使用由 `autoreconf` 自动安装。遗憾的是，`autoreconf` 安装的是与\
  \ Autoconf 一带的文件版本；它们可能已经过时，因此查找并安装最新版本的建议仍然有效。如果你需要，可以使用提供的 `wget` 命令从 GNU Savannah\
  \ 的 `config` 仓库获取这些文件的最新版本。如果 `gettext` 使用 `autoreconf` 安装的版本无法识别你的平台，你就知道自己需要了。在完成这些步骤后，确保至少运行一次\
  \ `autoreconf -i`。\n\n➑ 处复制并使用 `gettext.h` 的请求是可选的，但很有帮助，因为它启用了 `gettext` Autoconf\
  \ 宏添加的 `configure` 脚本选项，允许用户在从发行存档构建时禁用 NLS 处理。我将 `/usr/share/gettext/gettext.h`\
  \ 拷贝到 gt 的 `src` 目录，并将其添加到 `Makefile.am` 中 gt 程序的源列表中，如 Listing 12-9 所示。\n\n```\n\
  bin_PROGRAMS = src/gt\n\nsrc_gt_SOURCES = src/gt.c src/gettext.h\n\n--snip--\n```\n\
  \n*Listing 12-9:* `Makefile.am`: *将 `src/gettext.h` 添加到 `src_gt_SOURCES`*\n\n让我们在这些更改后尝试构建：\n\
  \n```\n$ autoreconf -i\n\nCopying file ABOUT-NLS\n\nCopying file config.rpath\n\n\
  Creating directory m4\n\nCopying file m4/codeset.m4\n\nCopying file m4/extern-inline.m4\n\
  \nCopying file m4/fcntl-o.m4\n\n--snip--\n\nCopying file po/insert-header.sin\n\n\
  Copying file po/quot.sed\n\nCopying file po/remove-potcdate.sin\n\nconfigure.ac:12:\
  \ installing './compile'\n\nconfigure.ac:13: installing './config.guess'\n\nconfigure.ac:13:\
  \ installing './config.sub'\n\nconfigure.ac:6: installing './install-sh'\n\nconfigure.ac:6:\
  \ installing './missing'\n\nMakefile.am: installing './depcomp'\n$\n\n$ ./configure\n\
  \nchecking for a BSD-compatible install... /usr/bin/install -c\n\nchecking whether\
  \ build environment is sane... yes\n\nchecking for a thread\n```\n\n**注意**\n\n某些边缘情况可能会导致\
  \ `autoreconf` 写入的文件被视为“本地修改”，这在没有 `-f` 或 `--force` 标志的情况下会产生错误。我建议你先使用 `-i` 进行尝试。如果你收到关于\
  \ ABOUT-NLS 被本地修改的错误，请带有 `-f` 标志重新执行。\n\n#### 应该提交什么？\n\n我们向 gt 项目添加了许多新文件。在第 172\
  \ 页 的“关于实用脚本”中，我告诉了关于应该提交到源码仓库的哲学，即从仓库检出项目的人应该承担维护者或开发者的角色，而不是用户。用户从发行存档构建，但维护者和开发者使用不同的工具。因此，从仓库检出源码的人应该愿意\
  \ Autotools。\n\n\n\n现在是时候考虑你应该将这些新文件中的哪些提交到 gt 的仓库了。按照我的哲学，我只会提交那些实际上是项目资产的文件。任何在\
  \ Autotools 引导过程中（通过 `autoreconf -i`）可以很容易重新生成或从其他源复制的文件都应该排除在外。\n\n`gettextize`\
  \ 工具会运行一个名为 `autopoint` 的程序，对于启用了 NLS 的项目，它的作用就像 `autoreconf -i` 对于 Autotools 项目的作用，根据需要将文件复制到项目目录结构中。我们之前在\
  \ `configure.ac` 中添加的 `AM_GETTEXT_*` 宏确保了相应的 `*.m4` 文件被添加到 `m4` 目录，相应的 NLS 文件被添加到\
  \ `po` 目录，并且（如果你使用的是内部版本的 `gettext` 库）将 `gettext` 源码和构建文件被添加到 `intl` 目录。事实上，`autopoint`\
  \ 是是 `auto-po-intl-m4` 这个短语的一种缩写。较新版本的 `autoreconf` 已经感知到了 `autopoint`，如果你发现你有一个启用了\
  \ NLS 的项目，它们会为你执行它，但前提是你必须向 `autoreconf` 提供了 `-i` 选项，因为 `autopoint` 只会安装缺失的文件，而文件安装是\
  \ `-i` 选项的功能。\n\n由于 `autopoint` 会在你的 `po` 目录中安装所有需要的非资产文件，你只需要在该目录中提交你修改过的文件，包括\
  \ `POTFILES.in`、`Makevars`、`ChangeLog`，当然还有你的 `*.po` 文件。你不需要提交 `*.pot` 文件，因为如果 `po/Makefile`\
  \ 缺失，它将从你的源代码重新生成它。你不需要提交你的 `*.mo` 文件，因为这些文件在安装时直接从 `*.po` 文件生成。除非你修改了 `ABOUT-NLS`\
  \ 文件，否则你不需要它。除了你自己编写并添加的宏文件外，你不需要 `m4` 目录中的任何任何内容。你将需要提交 `src/gettext.h` 文件，因为你是手动从系统的\
  \ `gettext` 安装目录复制了该文件。\n\n这使得我们在 gt 的目录结构中留下了以下文件：\n\n```\n$ tree --charset=ascii\n\
  \n.\n\n|-- AUTHORS\n|-- ChangeLog\n|-- configure.ac\n|-- COPYING\n|-- INSTALL\n\
  |-- Makefile.am\n|-- NEWS\n|-- po\n|    |-- ChangeLog\n|    |-- Makevars\n|    `--\
  \ POTFILES.in\n|-- README\n`-- src\n    |-- gettext.h\n    `-- gt.c\n\n2 directories,\
  \ 13 files\n\n$\n```\n\n### 添加语言\n\n让我们添加我们的法语 `*.po` 文件：\n\nGit tag 12.2\n\n```\n\
  2$ cd po\n\n$ msginit --locale fr_FR.utf8\n\n--snip--\n\n$ echo \"\n\nfr\" >>LINGUAS\n\
  $\n```\n\n虽然我们运行了 `msginit`，但不需要指定输入和输出文件。相反，`msginit` 会自动发现并使用当前目录下的所有 `*.pot`\
  \ 文件作为输入文件，并根据指定的语言自动命名输出的 `*.po` 文件。我们唯一需要的选项是 `--locale` 选项，用于指定生成 `*.po` 文件的目标区域设置（locale）。\n\
  \n**注意**\n\n这次我没有使用 `--no-translator` 选项，因为当我运行 `msginit` 时，我是在扮演目标语言翻译者的角色。也就是说，为特定的区域设置或语言运行\
  \ `msginit` 的人应该应该是该语言的翻译者。因此，那个人也应该愿意为翻译提供联系信息，当他们以这种方式运行 `msginit` 时，他们可以在交互式提示符处输入他们的电子邮件地址。\n\
  \n我们还需要在 `po` 目录下的一个名为 `LINGUAS` 的文件中添加所有支持的语言（这个新文件也应该提交）。这告诉构建系统支持哪些语言。实际上 `po`\
  \ 目录中的语言可能比我们目前支持的语言要多。`LINGUAS` 文件中的语言是那些在我们运行 `make install` 时会生成并安装 `*.mo` 文件的语言。`LINGUAS`\
  \ 的格式相当宽松；你只需要在语言之间留某种空白符即可。如果你愿意，也可以使用以 `#` 开头的注释。\n\n你现在会在 `po` 目录中找到一个名为 `fr.po`\
  \ 的文件。当然，它仍然必须由一个精通两种语言的人来翻译。翻译后的内容应该类似于列表 12-10 那样。我更新了我的，通俗地说，填满了所有的空白。\n\n```\n\
  # gt 包的法语翻译。\n\n# Copyright (C) 2019 John Calcote\n\n# 本文件的分发遵循与 gt 包相同的许可证。\n\n\
  # John Calcote <john.calcote@gmail.com>, 2019.\n\n#\n\nmsgid \"\"\nmsgstr \"\"\n\
  \"Project-Id-Version: gt 1.0\\n\"\n\"Report-Msgid-Bugs-To: gt-bugs@example.org\\\
  n\"\n\"POT-Creation-Date: 2019-07-02 01:17-0600\\n\"\n\"PO-Revision: 2019-07-02\
  \ 01:17-0600\\n\"\n\"Translator: John Calcote\\n\"\n\"Language-Team: French\\n\"\
  \n\"MIME-Version: 1.0\\n\"\n\"Content-Type: text/plain; charset=UTF-8\\n\"\n\"Content-Transfer-Encoding:\
  \ 8bit\\n\"\n\"Language: fr\\n\"\n\"Plurals: n=2; plural=(n==1 ? 0 : 1);\\n\"\n\n\
  msgid \"Hello, world!\"\nmsgstr \"Bonjour le monde!\"\n```\n\n### 安装语言\n\n安装语言文件的操作与运行标准的\
  \ `install` 没有区别：\n\n```\n$ sudo make install\n\n--snip--\n\nMaking install in po\n\
  \n--snip--\n\n$\n```\n\n在 `src` 目录中测试程序并不简单，但也不难。你需要安装到本地前缀，例如 `$PWD/root`：\n\n\
  ```\n$ ./configure --prefix=$PWD/root\n\n--snip--\n\n$ make\n\n--snip--\n\n$ make\
  \ install\n\n--snip--\n\n$ cd root/bin\n\n$ ./gt\n\nHello, world!\n\n$ LANGUAGE=french\
  \ ./gt\n\nBonjour le monde!\n\n$\n```\n\n为什么这有效？因为我们将基于 `prefix` 的区域目录传递给了 `gt.c`。因此，你使用的\
  \ `prefix` 告诉了程序 NLS 文件在哪里。\n\n**注意**\n\n不要尝试使用 `DESTDIR` 变量。`prefix` 仍然设置为 `/usr/local`，但\
  \ `install` 目标会将所有内容放入 `$(DESTDIR)/$(prefix)`。区域目录仅基于 `prefix`，这欺骗了软件让其认为安装在了 `$(prefix)`。\n\
  \n### 手动 make 目标\n\n`gettext` Makefile 提供了一些可以从 `po` 目录手动使用的目标。如果你想手动更新其中一个 *.pot*\
  \ 文件，可以运行 `make domain.update-pot`，其中 `domain` 是你在代码中调用 `textdomain` 和 `bindtextdomain`\
  \ 时指定的 NLS 域名名称。\n\n如果你想使用 `msgmerge` 手动更新翻译后的语言文件（这会将 *.pot* 文件中的新消息合并到特定语言的 *.po*\
  \ 文件中），可以运行 `make update-po`。这将更新 `LINGUAS` 中指定的所有 `*.po` 文件。\n\n### 总结\n\n在本章中，我仅仅对为项目添加\
  \ NLS 支持这一主题进行了初步介绍。\n\n\n\n\n我漏掉了什么？嗯，例如，`gettext` 工具中有几十种选项可以帮助本地化人员为程序构建语言文件，使软件能够合理地显示消息。\n\
  \n另一个例子是在 C 语言的一个典型的 `printf` 语句中，你可能会提供一个英文的格式字符串，例如“There are %d files in the\
  \ '%s' directory.”在这个例中，`%d` 和 `%s` 分别是计数和目录名的占位符，但在德语中，翻译后的字符串会变成类似“Im verzeichnis\
  \ '%s' befinden sich %d dateien.” 即使是不懂德语的程序员也能看出问题所在——格式说明符的顺序发生了变化。当然，一种解决方案是使用\
  \ `printf` 新新的位置格式说明符。\n\n还有几十个其他你想要考虑的问题；*GNU gettext 工具手册*（*GNU gettext Utilities\
  \ Manual*）是一个很好的入门处。\n\n# 13\n\n## 使用 GNULIB 获得最大可移植性\n\n*世界上任何东西都不是由两个人创造的。不存在完美的合作，无论是在艺术、音乐、诗歌、数学还是哲学。一旦创作的奇迹发生，群体就可以构建并扩展它，但群体从未发明过任何东西。*\n\
  \n— 约翰·斯坦因贝克，《乐甸之缘》\n\n![Image](img/common.jpg)\n\n你知道过去 10 年左右一直在使用的那些酷的脚本语言吗——Python、PHP、Perl、JavaScript、Ruby\
  \ 等？这些语言（甚至包括像 Java 这样的编译语言）最酷的功能之一，就是能够通过 `pip` 和 `maven` 等工具，从 PEAR、RubyGems、CPAN\
  \ 和 Maven Central 等仓库访问社区提供的库功能。\n\n你难道不希望在 C 和 C++ 中也能做那样的事情吗？你可以在 C 语言中通过 *GNU\
  \ 可移植性库（Gnulib）*^(1) 及其伴随的命令行工具 `gnulib-tool` 来获得这种体验。Gnulib 是一个源代码库，旨在实现广泛的可移植性，甚至支持\
  \ Windows 等平台，它同时使用了基于原生和基于 Cygwin 的编译（尽管 Gnulib 在 Cygwin 上的测试次数略多于原生 Windows 编译）。\n\
  \nGnulib 中字面上有成百千计的可移植实用程序函数，它们的设计目标只有一个——到许多不同平台的可移植性。本章将介绍如何开始使用 Gnulib 以及如何最大限地利用它的优势。\n\
  \n### 许可证注意事项\n\n在我继续之前，我应该提到，Gnulib 的大部分源代码采用 GPLv3+ 或 LGPLv3+ 许可。然而，部分 Gnulib\
  \ 源代码采用 LGPLv2+ 许可，这可能会让这些功能变得更容易被接受。可以合理地用于库的 Gnulib 函数受 LGPLv2+ 或 LGPLv3+ 许可；其他所有内容均受\
  \ GPLv3+ 许可或某种类似于“LGPLv3+ 和 GPLv2”的混合许可（这最终与 GPLv2 的兼容性高于 LGPLv2）。如果这让你感到困扰，那么你可能想跳过这一章，但在完全抛弃\
  \ Gnulib 之前，请考虑检查你想要使用的功能的许可证，看看你的项目是否可以适应它。\n\n由于 Gnulib 以源代码格式分发，并设计为以该格式整合到应用程序和库中，使用\
  \ Gnulib 意味着将 GPL 和 LGPL 源代码直接整合到你的源码中。至少，这意味着你需要使用 GPL 和 LGPL 许可对你的部分代码进行授权。这可能解释了为什么\
  \ Gnulib 并不流行，除了其他 GNU 包的维护者之外。\n\n相反，如果你正在编写一个已经获得 GPL 许可的开源程序，或者一个已经使用 LGPL 的开源库，那么你的项目就是\
  \ Gnulib 的完美选择。请继续下读。\n\n### 入门\n\n如所述，Gnulib 以源代码格式分发。虽然你始终可以去 Savannah git 仓库在线浏览并下载单个文件，但直接将\
  \ Gnulib 仓库克（clone）到本地主机的工作区域要简单得多。Gnulib 仓库在仓库根目录下提供了 `gnulib-tool` 工具，你可以用它将所需的源模块（连同伴随的\
  \ Autoconf 宏和构建脚本）直接复制到你的项目项目中。\n\n`gnulib-tool` 工具可以直接从仓库根目录运行。为了方便访问，可以在你的 `PATH`\
  \ 某处为该程序创建一个软链接；然后你就可以从项目目录运行 `gnulib-tool`，将 Gnulib 模块添加到你的项目基于 Autotools 的项目了：\n\
  \n```\n$ git clone https://git.savannah.gnu.org/git/gnulib.git\n\n--snip--\n\n$\
  \ ln -s $PWD/gnulib/gnulib-tool $HOME/bin/gnulib-tool\n\n$\n```\n\n这就是为了在你系统上以最有效的方式让\
  \ Gnulib 可用所需的所有。\n\n**注意**\n\n*上游 Gnulib 项目并不发布版本，而是简单地将更改和错误修复直接合并到主分支（master）。本章中的编程示例是使用\
  \ Savannah Gnulib git 仓库中提交值为 `f876e0946c730fbd7848cf185fc0dcc712e13e69` 的 Gnulib\
  \ 源代码编写的。如果你在编译本章代码时遇到困难，可能是因为自本书编写后 Gnulib 的源代码发生了变化。请尝试回退到该提交.*\n\n### 将 Gnulib\
  \ 模块添加到项目\n\n为了帮助你理解如何使用 Gnulib，让我们创建一个程序。我们将从创建一个实用的项目开始。\n\n**注意**\n\n该项目的源码位于\
  \ `https://github.com/NSP-Autools/b64/`\n\nGit 标签: 13.0\n\n```\n$ mkdir -p b64/src\n\
  \n$ cd b64\n\n$\n```\n\n编辑 `src/b64.c` 并添加 列表 13-1 所示的内容。\n\n```c\n#include \"config.h\"\
  \n\n#include <stdio.h>\n\nint main(void)\n\n{\n\n    printf(\"b64 - convert data\
  \ to and from strings.\\n\");\n\n    return 0;\n\n}\n```*列表 13-1*: src/b64.c: 驱动程序的初始内容\n\
  \n现在运行 `autoscan` 来提供 `configure.ac` 文件，将新的 `configure.scan` 重命名为 `configure.ac`，然后为我们的项目创建一个\
  \ `Makefile.am`。\n\n由于我们不是创建一个交叉项目，我们还需要在 `configure.ac` 的 `AM_INIT_AUTOMAKE` 参数列表中添加标准的\
  \ GNU （但你完全可以在 `configure.ac` 中添加 `foreign` 以避免手动这样做）：\n\n```\n$ autoscan\n\n$ mv\
  \ configure.scan configure.ac\n\n$ echo \"bin_PROGRAMS = src/b64\n\nsrc_b64_SOURCES\
  \ = src/b64.c\" >Makefile.am\n\n$ touch README AUTHORS ChangeLog\n\n$\n```\n\n编辑新的\
  \ `configure.ac` 文件并进行 列表 13-2 所示的更改。\n\n```\n#                               -*-\
  \ Autoconf -*-\n\n# 使用 autoconf 处理此文件以生成 configure 脚本。\n\nAC_PREREQ([2.69])\n\n\
  AC_INIT([b64], [1.0], [b 64-bugs@example.org])\n\nAM_INIT_AUTOMAKE([subdir-objects])\n\
  \nAC_CONFIG_SRCDIR([src/b64.c])\n\nAC_CONFIG_HEADERS([config.h])\n\nAC_CONFIG_MACRO_DIRS([m4])\n\
  \n--snip--\n\nAC_CONFIG_FILES([Makefile])\n\nAC_OUTPUT\n```\n\n*列表 13-2*: configure.ac:\
  \ 自动生成的 configure.ac 需要的更改\n\n我在 `AM_INIT_AUTOMAKE` 宏中添加了 `subdir-objects` 选项，作为创建非递归\
  \ Automake 构建系统的一部分。我还添加了 `AC_CONFIG_MACRO_DIRS` 宏以保持整洁。^(2)\n\n此时，我们应该能够运行 `autoreconf\
  \ -i`，然后运行 `configure` 和 `make` 来构建项目：\n\n\n\n\n\n```\n$ autoreconf -i\n\naclocal:\
  \ warning: couldn't open directory 'm4': No such file or directory\n\nconfigure.ac:12:\
  \ installing './compile'\n\nconfigure.ac:6: installing './install-sh'\n\nconfigure.ac:6:\
  \ installing './missing'\n\nMakefile.am: installing './INSTALL'\n\nMakefile.am:\
  \ installing './COPYING' using GNU General Public License v3 file\n\nMakefile.am:\
  \     Consider adding the COPYING file to the version control system\n\nfor your\
  \ code, to avoid questions about which license your\nproject uses\n\nMakefile.am:\
  \ installing './depcomp'\n$\n\n$ ./configure && make\n\nchecking for a BSD-compatible\
  \ install... /usr/bin/install -c\n\nchecking whether build environment is sane...\
  \ yes\n\nchecking for a thread-safe mkdir -p... /bin/mkdir -p\n--snip--\n\nconfig.status:\
  \ creating Makefile\n\nconfig.status: creating config.h\n\nconfig.status: executing\
  \ depfiles commands\nmake  all-am\n\nmake[1]: Entering directory '/.../b64'\n\n\
  depbase=`echo src/b64.o | sed 's|[^/]*$|.deps/&|;s|\\.o$||'`;\\\ngcc -DHAVE_CONFIG_H\
  \ -I.         -g -O2 -MT src/b64.o -MD -MP -MF $depbase.Tpo -c\n-o src/b64.o src/b64.c\
  \ &&\\\nmv -f $depbase.Tpo $depbase.Po\ngcc    -g -O2 -o src/b64 src/b64.o\nmake[1]:\
  \   Leaving directory '/.../b64'\n$\n\n$ src/b64\n$ b64 - convert data to and from\
  \ base64 strings.\n$\n```\n\n我们现在准备好为此项目添加 Gnulib 功能了。我们需要完成的第一件事是使用 `gnulib-tool`\
  \ 将 `base64` 模块导入到我们的项目中。假设你已经正确地克隆了 Gnulib git 项目，并为 `gnulib-tool` 添加了一个软链接到你 `PATH`\
  \ 路径中的某个目录（如果该目录在你的 `PATH` 中，可能是 `$HOME/bin`），请在 `b64` 项目目录结构的根目录下执行以下命令：\n\nGit\
  \ tag 13.1\n\n```\n$ gnulib-tool --import base64\n\nModule list with included dependencies\
  \ (已缩进):\n    absolute-header\n  base64\n    extensions\n    extern-inline\n   \
  \ include_next\n    memchr\n    snippet/arg-nonnull\n    snippet/c++defs\n    snippet/warn-on-use\n\
  \    stdbool\n    stddef\n    string\n\nFile list:\n  lib/arg-nonnull.h\n  lib/base64.c\n\
  \  lib/base64.h\n  --snip--\n  m4/string_h.m4\n  m4/warn-on-use.m4\n  m4/wchar_t.m4\n\
  Creating directory ./lib\nCreating directory ./m4\nCopying file lib/arg-nonnull.h\n\
  Copying file lib/base64.c\nCopying file lib/base64.h\n--snip--\nCopying file m4/string_h.m4\n\
  Copying file m4/warn-on-use.m4\nCopying file m4/wchar_t.m4\nCreating lib/Makefile.am\n\
  Creating m4/gnulib-cache.m4\nCreating m4/gnulib-comp.m4\nCreating ./lib/.gitignore\n\
  Creating ./m4/.gitignore\nFinished.\n```\n\n你可能需要为以下 `.h` 文件添加 `#include` 指令。\n\n\
  `#include \"base64.h\"`\n\n不要忘记：\n- 在 `./configure.ac` 的 `AC_CONFIG_FILES` 中添加 `\"\
  lib/Makefile\"`，\n- 在 `Makefile.am` 的 `SUBDIRS` 中提及 `\"lib\"`，\n- 在 `Makefile.am`\
  \ 的 `ACLOCAL_AMFLAGS` 中提及 `-I m4`，\n- 在 `Makefile.am` 的 `EXTRA_DIST` 中提及 `\"m4/gnulib-cache.m4\"\
  `，\n- 在 `./configure.ac` 中紧接 `AC_PROG_CC` 调用 `gl_EARLY`，\n- 在 `./configure.ac` 中调用\
  \ `gl_INIT`。\n\n此控制示例中省略的列表在使用具有许多其他 Gnulib 模块依赖的模块可能会可能会长。`base64` 模块直接依赖于 `stdbool`\
  \ 和 `memchr` 模块；然而，依赖列表显示了额外的传递依赖。在决定使用某个模块之前，你可以通过查看 `gnu.org` 上 `MODULES` 页面上的依赖列表，或阅读你克隆的\
  \ Gnulib 仓库中的 `modules/base64` 文件来查看它的直接依赖。\n\n`base64` 模块所需的某些传递依赖包括设计用于使 base64\
  \ 在各种平台上具有更好可移植性的模块。例如，`string` 模块提供了对系统 `string.h` 头文件的封装，它提供了额外的常用字符串功能，或修复了某些平台上的错误。\n\
  \n你可以从输出中可以看到了两个目录——`m4` 和 `lib`，然后一些支持的 M4 宏文件被添加到 `m4` 目录，一些源文件和构建文件被添加到 `lib`\
  \ 目录。\n\n### 注意\n\n如果你在 git 仓库中工作，`gnulib-tool` 会在 `m4` 和 `lib` 中添加 `.gitignore`\
  \ 文件，这样在你运行 `git add` 时就不会将它们包含进去。\n\n```\n--snip--\n\n# 检查程序。\nAC_PROG_CC\n\n#\
  \ 检查库。\ngl_EARLY\n\n# 初始化 Gnulib。\ngl_INIT\n\n# 检查类型定义、结构和编译器特性。\n# 检查库函数。\nAC_CONFIG_FILES([Makefile\
  \ lib/Makefile])\n\nAC_OUTPUT\n```\n列表 13-3*: configure.ac。更改所需的。。\n\n```\nACLOCAL_AMFLAGS\
  \ = -I m4\nEXTRA_DIST = m4/gnulib-cache.m4\nSUBDIRS = lib\nbin_PROGRAMS = src/b64\n\
  src_b64_SOURCES = src/b64.c\n```\n列表 13-4*: Makefile.am。更改所需的。\n\n在进行这些更改后，你的项目应该可以继续构建。我们需要运行\
  \ `autoreconf -i` 以包含为添加的 Gnulib 宏所需的额外文件。\n\n当我们导入 `base64` 模块时，`gnulib-tool` 的输出表明我们可能需要为\
  \ `base64.h` 添加包含指令。目前我们不需要这样的指令，因为我们的代码实际上没有使用 base64 的任何功能。我们即将改变这一点，但每个模块都有自己的包含指令，所以我现在要向你展示的步骤与\
  \ `base64` 模块相关。其他模块会有类似的步骤，但它们将取决于你选择的模块。每个模块的文档都会告诉你如何访问公共接口——即包含哪些头文件。\n\n虽然文档关于这一点并不十分，但你实际上不需要在项目中链接任何特定的库，因为\
  \ `lib/Makefile.am` 文件会构建所有导入模块的文件，并将生成的对象添加到名为 `libgnu.a` 的静态库。这是 Gnulib 库的自定义版本，只包含你引入的模块。由于\
  \ Gnulib 是源代码库，因此在 `lib` 目录中构建的文件之外，使用 Gnulib 功能的项目不需要二进制文件。因此，链接到 Gnulib 功能的过程对于所有\
  \ Gnulib 模块都是相同的。\n\n让我们将 base64 的功能添加到我们的项目中，看看实际使用该模块涉及哪些内容。按照 [列表 13-5] 中的突出显示部分对你的\
  \ `src/b64.c` 文件进行更改。\n\n\n\n\n```c\n#include \"config.h\"\n\n#include <stdio.h>\n\
  \n#include <stdlib.h>\n\n#include <string.h>\n\n#include <stdbool.h>\n\n#include\
  \ <errno.h>\n\n#include <unistd.h>\n\n#include \"base64.h\"\n\n#define BUF_GROW\
  \ 1024\n\nstatic void exit_with_help(int status)\n{\n    printf(\"b64 – 将数据转换为或从\
  \ base64 (默认: )\\n\");\n    printf(\"Usage: b64 [options]\\n\");\n    printf(\"\
  Options:\\n\");\n    printf(\"  -d   将 stdin base64 解到 stdout。\\n\");\n    printf(\"\
  \  -h   打印此帮助屏幕并退出。\\n\");\n    exit(status);\n}\n\nstatic char *read_input(FILE\
  \ *f, size_t *psize)\n{\n    int c;\n    size_t insize, sz = 0;\n    char *bp =\
  \ NULL, *cp = NULL, *ep = NULL;\n    while ((c = fgetc(f)) != EOF)\n    {\n    \
  \    if (cp >= ep)\n        {\n            size_t nsz = sz == 0 ? BUF_GROW : sz\
  \ * 2;\n            char *np = realloc(bp, nsz);\n            if (np == NULL)\n\
  \            {\n                perror(\"readin realloc\");\n                exit(1);\n\
  \            }\n            cp = np + (cp - bp);\n            bp = np;\n       \
  \     ep = np + nsz;\n            sz = nsz;\n        }\n        *cp++ = (char) c;\n\
  \    }\n    *psize = cp - bp;\n    return bp;\n}\n\nstatic int encode(FILE *f)\n\
  {\n    size_t insize;\n    char *outbuf, *inbuf = read_input(f, &insize);\n    size_t\
  \ outsize = base64_encode_alloc(inbuf, insize, &outbuf);\n    if (outbuf == NULL)\n\
  \    {\n        if (outsize == 0 && insize != 0)\n        {\n            fprintf(stderr,\
  \ \"encode: input too long\\n\");\n            return 1;\n        }\n        fprintf(stderr,\
  \ \"encode: allocation failure\\n\");\n    }\n    fwrite(outbuf, outsize, 1, stdout);\n\
  \    free(inbuf);\n    free(outbuf);\n    return 0;\n}\n\nstatic int decode(FILE\
  \ *f)\n{\n    size_t outsize, insize;\n    char *outbuf, *inbuf = read_input(f,\
  \ &insize);\n    bool ok = base64_decode_alloc(inbuf, insize, &outbuf, &outsize);\n\
  \    if (!ok)\n    {\n        fprintf(stderr, \"decode: input not base64\\n\");\n\
  \        return 1;\n    }\n    if (outbuf == NULL)\n    {\n        fprintf(stderr,\
  \ \"decode: allocation failure\\n\");\n        return 1;\n    }\n    fwrite(outbuf,\
  \ outsize, 1, stdout);\n    free(inbuf);\n    free(outbuf);\n    return 0;\n}\n\n\
  int main(int argc, char *argv[])\n{\n    int c;\n    bool tob64 = true;\n    while\
  \ ((c = getopt(argc, argv, \"dh\")) != -1)\n    {\n        switch (c)\n        {\n\
  \            case 'd':\n                tob64 = false;\n                break;\n\
  \            case 'h':\n            default:                exit_with_help(c ==\
  \ 'h' ? 0 : 1);\n        }\n    }\n    return tob64 ? encode(stdin) : decode(stdin);\n\
  }\n```\n\n*Listing 13-5*: `src/b64.c`: *为了整合 base64 功能而进行的修改*\n\n我在 Listing 13-5\
  \ 中提供了整个文件，因为原始代码只剩下几行了。该程序被设计用作 Unix 过滤器，从 `stdin` 读取输入数据并将输出数据写入 `stdout`。若要读入或写入文件，只需使用命令行重定向即可。\n\
  \n我应该提到关于该程序的几个值得注意的点。首先，它在 `read_input` 函数中使用了缓冲区增长算法。这段代码的大部分可以替换为对另一个 Gnulib\
  \ 模块函数 `x2nrealloc` 的调用。关于这种方法的使用，在线文档非常稀少，甚至没有提到它的存在——这可能是因为 `xalloc` 接口以各种形式存在了多年。你可以在\
  \ Gnulib 源码的 `lib` 目录下找到 `xalloc.h` 头文件。那里有很长的注释，包含了许多函数的示例用法，包括 `x2nrealloc` 函数。\n\
  \n使用 `xalloc` 功能来满足你所有的内存分配需求的另一个优势是，它的分配函数会自动检查 `NULL` 返回值，并在内存分配失败时带有适当的错误消息终止你的程序。如果你希望对中止过程有更多控制权，可以在代码中添加一个名为\
  \ `xalloc_die` 的函数（无参数，无返回值），如果它存在，`xalloc` 函数将会调用它。你可以利用这个钩子在程序退出前执行任何必要的清理工作。为什么不让你自己决定是否退出呢？内存耗尽了——你该怎么办？\n\
  \n最后，b64 过滤器并不是为处理流式数据设计的。\n\n\n\n\n\n假设你已经完成了一天的工作，并想让工作区域保持在一个整洁的状态。你输入 `git clean\
  \ -xfd` 并删除了所有未暂存（staged）或已提交的内容。第二天你回来后，输入 `autoreconf -i`，接着执行 `configure && make`，但你发现项目无法构建；`m4`\
  \ 和 `lib` 目录中缺少了一些文件，而这些文件在昨天似乎还非常重要。事实上，你发现，只剩下 `m4/gnulib-cache.m4` 文件，它像一个微妙的提醒，提醒过你你的项目曾与\
  \ Gnulib 有过任何关系。\n\n巧的是，那个 `gnulib-cache.m4` 文件就是你真正需要的。它告诉 `gnulib-tool` 你导入了哪些模块。要重新找回所有内容，请带有\
  \ `--update` 选项执行 `gnulib-tool`。这会导致 `gnulib-tool` 将所有相关 Gnulib 文件的当前版本重新复制回你的项目中。\n\
  \n### 注意\n\n在 `gnulib-tool` 中使用 `--update` 选项不会从远程仓库更新你的 Gnulib 工作区域。相反，它仅根据当前存在于\
  \ Gnulib 工作区域中的文件，更新你的项目对 Gnulib 模块的使用。如果你真的想使用某组特定过去的 Gnulib 模块，可以检出过去 Gnulib 仓库的某个版本，然后运行\
  \ `gnulib-tool --update` 以从你的 Gnulib 工作区域拉取当前的文件集。\n\n`--update` 选项也可以用于在你用 `git`\
  \ 更新了 Gnulib 工作区域后，复制更新版本的文件。\n\n为了帮助你现在在使用 Gnulib 的项目中使用运行 `gnulib-tool --update`，Gnulib\
  \ 手册建议创建一个 `bootstrap.sh` 脚本（并将其标记为可执行），其中至少包含 列表 13-7 所示的行。\n\nGit tag 13.3\n\n\
  ```\n#!/bin/sh\n\ngnulib-tool --update\n\nautoreconf -i\n```\n\n*列表 13-7*: `bootstrap.sh`:\
  \ 适用于 b64 的项目引导脚本\n\n如果 `autoreconf` 足够聪明，能注意到你使用了 Gnulib 模块并直接为你调用 `gnulib-tool\
  \ --update`，那就太好了。我怀疑这在 `Autoconf` 未来版本的特性特性列表上。然而，目前，你需要在将项目仓库克隆到新的工作区域，或者在要求 `git`\
  \ 让你的当前工作区域恢复纯净后，记住运行此命令来拉取 Gnulib 文件。\n\n### 总结\n\n在本章中，我讨论了如何将 Gnulib 模块添加到你基于\
  \ Autotools 的项目中。我相信我已经让你领略了足够的 Gnulib 的精髓，足以激发你对这一资源的兴趣。一旦你掌握了基础知识，Gnulib 手册写得很好，易于理解（尽管离完全的文档还有一点距离）。\n\
  \n下一步是你前往 Gnulib 模块页面，浏览你可以使用的功能。模块的头文件和源代码也可以从该页面查看，并在仓库的 `modules` 和 `lib` 目录中查看。请随时查看它们。\n\
  \n维护者总是需要文档方面的帮助。一旦你使用了某个模块并对其了熟悉，看看它的文档是否需要更新，并考虑成为一名贡献者。你可以将 Gnulib 邮件列表^(5) 作为资源，既用于你对使用\
  \ Gnulib 可能产生的疑问，也用于文档和源代码的补丁。^(6)\n\n## 14\n\n## FLAIM: 一个 AUTOTOOLS 示例\n\n*阿伯叔叔说\
  \ . . . 一个抓着猫尾巴要把猫带回家的人，正在获得对他永远有用的知识*。\n\n—马克·吐温因，《汤姆·索亚亚游记》\n\n![图像](img/common.jpg)\n\
  \n到本书为止，我带你快速浏览了 `Autoconf`、`Automake` 和 `Libtool` 的主要功能，以及其他与 Autotools 配合良好的工具的旋风之旅。我已尽力用一种不仅易于消化而且易于记忆的方式解释了它们——特别是如果你有时间和意愿亲自跟进我的示例的话。我一直认为，任何形式的学习都无法比拟实践中发生的学习。\n\
  \n在本章和下一章中，我们将通过研究我使用的过程来继续学习 AutoTools，该过程涉及我将一个现有的、真实的开源项目从复杂的硬编码 Makefile 转换为完整的\
  \ GNU Autotools 构建系统。我在这些章节中提供的示例说明了我在转换过程中必须做出的决策，以及 Autotools 功能的一些具体用法，其中包含一些我在之前的章节中尚未介绍过的。这两章将通过提供真实问题的真实解决方案，完成我们对\
  \ Autotools 的学习。\n\n我选择转换的项目名为 `FLAIM`，代表 `FLexible Adaptable Information Management`（灵活自适应信息管理）。\n\
  \n### 什么是 FLAIM？\n\nFLAIM 是一个用 C++ 编写的高度可扩展数据库管理库，构建在其自名为 `FLAIM` 工具包的自定义轻级移植性层之上。某些读者可能认出\
  \ FLAIM 是 Novell^(1) eDirectory 和 Novell GroupWise 使用的数据库。FLAIM 起于 20 世纪 80 年代的\
  \ WordPerfect，并在 1994 年 Novell/Perfect 合并期间成为了 Novell 的软件组合。Novell eDirectory 使用了\
  \ FLAIM 的分支版本来管理目录。Novell 在 2006 年以通用通用公共许可证 (LGPL) 第 2 版^(2) 将 FLAIM 源代码作为开源项目发布。FLAIM\
  \ 项目目前由 SourceForge.net 托管，它是 25 年开发和强化的成果。^(3)\n\n### 为什么选择 FLAIM？\n\n虽然 FLAIM\
  \ 远非主流 OSS 项目，但它具有许多特性，使其成为将项目转换为 autotools 的完美示例。首先，FLAIM 目前使用一个包含 2000 多行脚本的硬编码\
  \ Makefile 构建。FLAIM Makefile 包含许多 GNU Make 特有的构造，因此只能使用 GNU Make 处理此文件。独立的（但几乎相同的）makefile\
  \ 用于构建 `flaim`、`xflaim` 和 `flaimsql` 数据库库，以及 FLAIM 工具包 (`ftk`)，以及 Linux、各种 Unix、Windows\
  \ 和 NetWare 上的实用程序和示例程序。\n\n现有的 FLAIM 构建系统针对多种 Unix，包括 AIX、Solaris 和 HP-UX，以及 Apple\
  \ 的 macOS。它还针对这些系统上的多个编译器。这些特性使得 FLAIM 成为此示例转换项目的理想选择，因为我可以向你展示如何在新的 `configure.ac`\
  \ 文件中处理操作系统和工具集的差异。现有的 FLAIM 构建系统还包含了许多标准 Automake 目标，例如分发 tar 包。此外，它还提供了构建二进制安装包的规则，以及用于构建和安装\
  \ RPM 包系统的 RPM。它甚至提供了构建 Doxygen^(4) 描述文件的目标，然后使用这些文件构建源码文档。我将花几段向你展示如何在 Automake\
  \ 提供的基础设施中添加此类目标。\n\nFL toolkit 是第三方项目可以独立整合和使用的移植性库。我们可以利用该工具包演示 Autoconf 管理独立子项目作为项目可选子目录的能力。如果用户已经在他们的构建机器上安装了\
  \ FLAIM 工具包，可以使用安装的版本，或者可选地使用本地副本覆盖它。另一方面，如果没有安装工具包，则默认将使用本地的子目录副本。\n\n\n\n\nFLAIM\
  \ 项目还提供了用于构建 Java 和 C# 语言绑定的代码，因此我将深入研究这些深奥的领域。我不会详细介绍如何构建 Java 或 C# 应用程序，但我将介绍如何编写\
  \ `Makefile.am` 文件，以同时生成 Java 和 C# 程序以及语言绑定库。\n\nFLAIM 项目很好地利用了单元测试。这些测试被构建为独立的程序，在不需要命令行选项的情况下即可运行，因此我可以轻松向你展示如何使用\
  \ Automake 的简易测试框架，将真实世界中的单元测试添加到新的 FLAIM Autotools 构建系统中。\n\nFLAIM 项目及其原始构建系统采用了相当于模块化的目录布局，这使其转换为\
  \ Autotools 模块化构建系统变得相当简单。只需对目录树进行一次简单的 `diff` 工具扫描就足够了。\n\n### 后勤与准备工作\n\n当本书的第一版于\
  \ 2010 年出版时，FLAIM 刚刚作为一个开源项目在 [SourceForge.net](http://SourceForge.net) 发布，并使用 Subversion\
  \ 管理其源代码仓库。从那时起，FLAIM 项目在很大程度上处于不活跃状态。据我所知，没有人正在活跃地使用该代码库。由于我是源代码唯一的剩余维护者，我为 FLAIM\
  \ 建立了一个 GitHub 仓库，专门用于本书第二版的第 14 章 和第 15 章。你可以在 GitHub 上 FLAIM 项目下的 NSP-Autotools\
  \ 区域找到该仓库.^(5)。我已经更新了本章的信息，使其符合 FLAIM 在 git 仓库中的存储情况。\n\n本章的源代码仓库风格与之前的章节略有不同。我对\
  \ FLAIM [SourceForge.net](http://SourceForge.net) 项目所做的原始 Autotools 构建系统更改被埋没在几十个不相关的更改之下，并与它们混杂在一起。与其花费几个小时来分离这些更改，以便为你提供\
  \ FLAIM 代码库的准确修改前后快照，我简单地选择了将最终的 FLAIM 代码及其 Autotools 构建系统提交到 GitHub 项目中.^(6)。\n\
  \n不要为 FLAIM 目前的活跃状态感到气馁——它继续提供各种机会，让你在真实项目中学习 Autotools 构建系统技术。\n\n### 初探\n\n首先让我说明的是，将\
  \ FLAIM 从 GNU makefiles 转换为 Autotools 构建系统并不是一项轻易的任务。我花了几周时间，其中大部分时间花在了确定具体要构建什么以及如何构建——换句话说，就是分析旧的构建系统。我的时间还有很大一部分花在了转换位于\
  \ Autotools 功能边缘的部分。例如，我在转换构建 C# 语言绑定的构建系统规则上花费的时间，比转换构建核心 C++ 库规则的时间要*得多*。\n\n\
  此转换项目的第一步是分析 FLAIM 现有的目录结构和构建系统。哪些组件是实际构建的？哪些组件依赖于其他组件？单个组件是否可以独立地构建、分发和使用？这类组件级关系很重要，因为它们通常决定了你将如何布局项目目录结构。\n\
  \nFLAIM 项目实际上是其仓库中一个大伞项目下的几个小项目。有三个独立且不同的数据库产品：`flaim`、`xflaim` 和 `flaimsql`。`flaim`\
  \ 子项目是 eDirectory 和 GroupWise 使用的原始 FLAIM 数据库库。`xflaim` 项目是为 Novell 内部项目开发的层次级 XML\
  \ 数据库；它针对面向路径的、基于节点的访问进行了优化。`flaimsql` 项目是 FLAIM 数据库之上的 SQL 层。它被作为一个独立的库编写，以优化用于\
  \ SQL 访问的低层 FLAIM API。这个项目是一个实验，坦率地说，还没有完全完成（但是可以编译的）。\n\n要点在于，这三个数据库库都是独立的且互不相关的，没有库间依赖关系。由于它们可以很容易地独立使用，它们实际上可以作为单独的分发版本发布。你可以将每一个视为一个独立的开源项目。因此，这将成为我的主要目标之一：允许\
  \ FLAIM 开源项目被轻松拆分为更小的开源项目，这些项目可以相互独立管理。\n\nFLAIM 工具包也是一个独立项目。虽然它专门为 FLAIM 数据库库定制，仅提供数据库管理系统（DBMS）所需的系统服务抽象，但它不依赖自身任何内容，因此它可以轻松地作为其他项目移植性的基础，而不会拖入任何必要的数据库负担。^(7)\n\
  \n原始 FLAIM 项目在仓库中的布局如下：\n\n```\n$ tree -d --charset=ascii FLAIM\n\nFLAIM\n\n|--\
  \ flaim\n\n|   |-- debian\n\n|   |-- docs\n\n|   |-- sample\n\n|   |-- src\n\n|\
  \   `-- util\n\n|-- ftk\n\n|   |-- debian\n\n|   |-- src\n\n|   `-- util\n\n|--\
  \ sql\n|   `-- src\n\n--snip--\n\n`-- xflaim\n\n    |-- csharp\n    --snip--\n\n\
  \    |-- java\n    --snip--\n\n    |-- sample\n    --snip--\n\n    |-- src\n   \
  \ `-- util\n--snip--\n```\n\n完整的树结构相当宽，在某些地方较深，包含了由旧构建系统构建的重要工具、测试和其他此类二进制文件。在深入这个层级结构的过程中某个时刻，我不得不停下来考虑转换那些额外的工具或层是否值得。（如果我没有这样做，本章的长度将翻倍，但用性减半。）为此，我决定转换以下元素：\n\
  \n*   数据库库\n*   单元测试和接口测试\n*   位于各个 `util` 目录中的工具和其他此类高级程序\n*   位于 `xflaim` 库中的\
  \ Java 和 C# 语言绑定\n\n我还将转换 C# 单元测试，但不会涉及 Java 单元测试，因为我已经在使用 Automake 的 `JAVA` 主要转换\
  \ Java 语言绑定。由于 Automake 对 C# 没有任何帮助，我必须自己提供一切，因此将转换整个 C# 代码库。这将为编写完全不支持的 Automake\
  \ 产品类提供示例。\n\n### 开始\n\n正如前面提到的，我的第一个真正的设计决策是如何组织原始 FLAIM 项目的子项目。事实证明，现有的布局几乎是完美的。我在顶层\
  \ `flaim` 目录下（位于仓库根目录下方）创建了一个主 `configure.ac` 文件。这个顶层的 `configure.ac` 文件作为四个底层项目（`ftk`、`flaim`、`flaimsql`\
  \ 和 `xflaim`）的 Autoconf 控制文件。\n\n我管理数据库库对工具包的依赖关系的方法是将将其视为由 make 变量 `FTKINC` 和 `FTKLIB`\
  \ 定义的纯外部依赖。我条件地定义了这些变量，指向不同的来源，包括已安装的库以及用户指定的配置脚本选项中的位置。\n\n\n\n\n```\n$ tree -d\
  \ --charset=ascii FLAIM\n\nFLAIM                           configure.ac (flaim-projects)\n\
  \n|-- flaim                       configure.ac (flaim)\n|   |-- debian\n|   |--\
  \ docs\n|   |-- sample\n|   |-- src\n|   `-- util\n|-- ftk                     \
  \    configure.ac (ftk)\n|   |-- debian\n|   |-- src\n|   `-- util\n|-- sql    \
  \                     configure.ac (flaimsql)\n|   `-- src\n--snip--\n`-- xflaim\
  \                      configure.ac (xflaim)\n    |-- csharp\n    --snip--\n   \
  \ |-- java\n    --snip--\n    |-- sample\n    --snip--\n    |-- src\n    `-- util\n\
  --snip--\n```\n\n我的下个任务是创建这些 `configure.ac` 文件。顶层的文件非常简单，所以我手动创建了它。项目特定的文件要复杂得多，因此我让\
  \ `autoscan` 工具为我完成了大部分工作。显示列表 14-1 显示了顶层的 `configure.ac` 文件。\n\n```\n #       \
  \                                        -*- Autoconf -*-\n\n   # Process this file\
  \ with autoconf to produce a configure script.\n\n   AC_PREREQ([2.69])\n\n➊ AC_INIT([flaim-projects],\
  \ [1.0])\n\n➋ AM_INIT_AUTOMAKE([-Wall -Werror foreign])\n\n➌ AM_PROG_AR\n\n➍ LT_PREREQ([2.4])\n\
  \n   LT_INIT([dlopen])\n\n➎ AC_CONFIG_MACRO_DIRS([m4])\n\n➏ AC_CONFIG_SUBDIRS([ftk\
  \ flaim sql xflaim])\n\n   AC_CONFIG_FILES([Makefile])\n   AC_OUTPUT\n```\n\n*列表\
  \ 14-1*: `configure.ac`: *伞型项目的 Autoconf 输入文件*\n\n这个 `configure.ac` 文件短小而简单，因为它没有做什么；但尽管如此，这里包含一些新而重要的概念。我在\
  \ ➊ 处发明了 `flaim-projects` 这个名字和版本号 `1.0`。除非项目目录结构发生了非常剧烈的变化，或者维护者决定发布一个完整的子项目包，否则这些不太可能改变。\n\
  \n**注意**\n\n*对于你自己的项目，可以考虑使用 `AC_INIT` 宏的可选第三参数。你可以在这里添加电子邮件或网络地址，以指示用户可以在哪里提交错误报告。该参数的内容会显示在\
  \ `configure` 输出中。*\n\n像这样的伞型项目最重要的方面是 ➏ 处的 `AC_CONFIG_SUBDIRS` 宏，我在书中还没有介绍它。该参数是一个由空格分隔的待构建子项目列表，其中每个子项目本身都是一个完整的、符合\
  \ `GCS` 标准的项目。以下是该宏的原型：\n\n```\nAC_CONFIG_SUBDIRS(dir1[ dir2 ... dirN])\n```\n\n\
  它允许维护者建立一个项目层级，这与 Automake `SUBDIRS` 为单个项目内的 Automake 配置目录层级的方式非常相似。\n\n由于四个子项目包含了所有的实际构建功能，此\
  \ `configure.ac` 文件仅作为控制文件，按照在宏参数中给出的顺序将所有指定的配置选项传递给每个子项目。FLAIM 工具项目必须首先构建，因为其他项目都依赖于它。\n\
  \n### 伞型项目中的 Automake\n\nAutomake 通常要求在顶层项目目录下存在几个文本文件，包括 `AUTHORS`、`COPYING`、`INSTALL`、`NEWS`、`README`\
  \ 和 `ChangeLog` 文件。如果在伞型项目中不需要处理这些文件就太好了。实现这一目标的方法之一就是不在伞型项目中使用 Automake。我要么必须为该目录编写自己的\
  \ `Makefile.in` 模板，要么只使用一次 Automake 生成一个 `Makefile.in` 模板，然后将其作为项目的一部分提交到仓库，连同由\
  \ `automake --add-missing`（或 `autoreconf -i`）添加的 `install-sh` 和 `missing` 脚本。一旦这些文件到位，就可以从主\
  \ `configure.ac` 文件移除 `AM_INIT_AUTOMAKE`。\n\n另一个选项是保留 Automake，并简单地在 `AM_INIT_AUTOMAKE`\
  \ 宏的可选参数中使用 `foreign` （我在 ➋ 处就是这样做）。该参数包含一个由空格分隔的选项字符串，告诉 Automake 如何代替特定的 Automake\
  \ 命令行选项来运行。当 `automake` 解析 `configure.ac` 文件时，它会记录这些选项并像它们是从命令行传递的一样启用它们。`foreign`\
  \ 选项告诉 Automake 项目将不会完全遵循 GNU 标准，因此 Automake 将不需要通常的 GNU 项目文本文件。\n\n我选择了两种方法中的后者，因为我可能在某时刻想要更改子项目列表，而且我不想手动调整生成的\
  \ `Makefile.in` 模板。我在此列表中传递了 `-Wall` 和 `-Werror` 选项，这些选项表示 Automake 应该启用所有 Automake\
  \ 特有的警告并将它们报告为错误。这些选项与用户的编译环境无关——仅与 Automake 处理有关。\n\n### 为什么要添加 Libtool 宏？\n\n\
  为什么在 ➍ 处包含那些昂贵的 Libtool 宏？嗯，尽管我没有对 Libtool 做任何事情，但 `autoreconf` 通过检查父目录，发现 ftk 实际上是一个更大项目的子项目。这是为了减少安装到多项目包中的脚本副本。如果我不在伞型项目中使用\
  \ `LT_INIT`，我将无法在子项目中成功运行 `autoreconf`。\n\n### 添加宏子目录\n\n`AC_CONFIG_MACRO_DIRS`\
  \ 宏在 ➎ 处指示了 `aclocal` 实用程序查找所有项目特定 M4 文件的目录名称。以下是原型：\n\n```\nAC_CONFIG_MACRO_DIRS(macro-dir)\n\
  ```\n\n此目录中的 `.m4` 宏文件最终通过 `aclocal` 生成的 `aclocal.m4` 文件中的 `m4_include` 语句引用，`autoconf`\
  \ 会读取该文件。该宏将原始的 `acinclude.m4` 文件替换为包含单个宏或一组宏的目录，每个宏都在自己的 `.m4` 文件中。我通过 `AC_CONFIG_MACRO_DIRS`\
  \ 的参数指示添加到 `aclocal.m4` 的本地宏文件都在名为 `m4` 的子目录下。作为奖励，当执行 `autoreconf -i`，以及当它执行带有相应\
  \ `add-missing` 选项的所需的 Autotools 时，这些工具会注意到 `configure.ac` 中该宏的使用，并将任何缺失的系统宏文件添加到\
  \ `m4` 目录。\n\n我在这里选择使用 `AC_CONFIG_MACRO_DIRS` 的原因是，如果你没有以这种方式启用宏目录选项，Libtool 将不会将其额外的宏文件添加到项目中。相反，它会抱怨你应该自己将这些文件添加到\
  \ `acinclude.m4`。\n\n\n\n\n\n关于这个宏的最后一点是：如果你在 Autoconf 手册中查找它，是找不到的——至少目前还没有，因为它不是\
  \ Autoconf 宏，而是一个 Automake 宏。它以 `AC_` 为前，是因为从初就打算让 Autoconf 的未来版本接纳这个宏。它比其单数的前身更具功能性（该前身*确实*在\
  \ Autoconf 手册中有记录），但直到 Automake 出现之前，并不需要该功能。事实上，根据我相当可靠的来源（预发布版的 Autoconf `ChangeLog`），我获知当\
  \ Autoconf 2.70 发布时，所有权将发生转移。\n\n我们在这里还没有涵盖的唯一项目是 ➌ 处的 `AM_PROG_AR` 宏。这是一个较新的 Automake\
  \ 宏。本书的第一版没有使用它。当我更新 Autotools 工具时，`autoreconf` 突然抱怨我需要它，于是我添加了它，抱怨就消失了。Autoconf\
  \ 手册简单地说，如果你想使用具有特殊接口的归档器（`ar`）（例如 Microsoft 库），就需要它。事实是，这里真正的抱怨者是 Libtool，它似乎习惯于抱怨没有包含它认为你应该使用的其他\
  \ Autotools 功能。我添加它是为了消除这个警告。\n\n### 顶层 Makefile.am 文件\n\n关于该伞型项目（umbrella project），另一个需要涵盖的点是顶层的\
  \ `Makefile.am` 文件，如列表 14-2 所示。\n\n```\n➊ ACLOCAL_AMFLAGS = -I m4\n\n➋ EXTRA_DIST\
  \ = README.W32 tools win32\n\n➌ SUBDIRS = ftk flaim sql xflaim\n\n➍ rpms srcrpm:\n\
  \n          for dir in $(SUBDIRS); do \\\n            (cd $$dir && $(MAKE) $(AM_MAKEFLAGS)\
  \ $@) || exit 1; \\\n          done\n\n  .PHONY: rpms srcrpm\n```\n\n*列表 14-2：`Makefile.am`:伞型项目的\
  \ Automake 输入文件*\n\n根据 Automake 文档，➊ 处的 `ACLOCAL_AMFLAGS` 变量应该在任何 `configure.ac`\
  \ 文件中使用 `AC_CONFIG_MACRO_DIR`（单数）的项目的顶层 `Makefile.am` 文件中定义。此行指定的标志告诉 `acocal` 当它被\
  \ `Makefile.am` 中定义的规则执行时，应该去哪里查找宏文件。该选项的格式类似于 C 编译器命令行的包含（`-I`）指令；你也可以指定其他的 `acocal`\
  \ 命令行选项。\n\n在使用较旧的 `AC_CONFIG_MACRO_DIR` 宏子目录时，这个变量曾是强制要求的，但随着较新的 `AC_CONFIG_MACRO_DIRS`\
  \ 的出现，你不再需要这个变量了，因为它生成的代码允许 Automake 理解它应该向 `acocal` 传递哪些选项。遗憾的是，当 Libtool 在 `autoreconf`\
  \ 看到你在 `Makefile.am` 文件中使用了一个没有该变量的宏目录时，它总是忍不住跳出来插嘴。我希望当 Autoconf 接管这个新宏时（当然，是随着\
  \ Libtool 的后续发布版本），这种杂音将会消失。\n\nAutotools 在两个不相关的地方使用了这个变量。第一个是在生成的 make 规则中，用于从所有的输入源更新\
  \ `aclocal.m4` 文件。该规则及其支持的变量定义如列表 14-3 所示，这是从 Autotools 生成的 makefile 中复制的代码片段。\n\
  \n```\nACLOCAL_M4 = $(top_srcdir)/aclocal.m4\n\nACLOCAL=${SHELL} .../flaim-ch8-10/missing\
  \ --run aclocal-1.10\n\nACLOCAL_AMFLAGS = -I m4\n\n$(ACLOCAL_M4): $(am__aclocal_m4_deps)\n\
  \n        cd $(srcdir) && $(ACLOCAL) $(ACLOCAL_AMFLAGS)\n```\n\n*列表 14-3：用于从各种依赖项更新\
  \ `aclocal.m4` 的 make 规则和变量*\n\n`ACLOCAL_AMFLAGS` 的定义在执行 `autoreconf` 时也会被使用，它会扫描顶层\
  \ `Makefile.am` 文件查找此定义，并将值文本直接传递给命令行上的 `acocal`。请注意`autoreconf` 不对此字符串进行任何变量扩展，因此如果你在文中添加了\
  \ shell 或 make 变量引用，它们在 `autoreconf` 执行 `acocal` 时将不会被扩展。\n\n回到列表 14-2，我使用了 ➋ 处的\
  \ `EXTRA_DIST` 变量来确保几个额外的顶层文件被发布——这些文件和目录是 Windows 构建系统特定的。这对于伞型项目来说并不关键重要，因为我不打算在这一层创建发行版，但我喜欢保持完整。\n\
  \n➌ 处的 `SUBDIRS` 变量重复了 `configure.ac` 文件中 `AC_CONFIG_SUBDIRS` 宏的信息。我曾尝试创建一个 shell\
  \ 替换变量并用 `AC_SUBST` 导出它，但行不通——当我运行 `autoreconf` 时，我得到了一个错误，指示我应该在 `AC_CONFIG_SUBDIRS`\
  \ 宏参数中使用字面量。\n\n➍ 处的 `rpms` 和 `srcrpm` 目标允许最终用户构建 RPM 软件包。\n\n\n\n\n在此 `configure.scan`\
  \ 文件被修改并重命名后，生成的 `configure.ac` 文件包含了许多新结构，我将在接下来的几个章节中讨论它们。为了方便讨论，我将该文件分成了两部分，前半部分如列表\
  \ 14-5 所示。\n\n```\n #                                               -*- Autoconf\
  \ -*-\n\n   # Process this file with autoconf to produce a configure script.\n\n\
  \   AC_PREREQ([2.69])\n\n➊ AC_INIT([FLAIMTK],[1.2],[flaim-users@lists.sourceforge.net])\n\
  \n➋ AM_INIT_AUTOMAKE([-Wall -Werror])\n\n   AM_PROG_AR\n\n   LT_PREREQ([2.4])\n\n\
  \   LT_INIT([dlopen])\n\n➌ AC_LANG([C++])\n\n➍ AC_CONFIG_MACRO_DIRS([m4])\n\n➎ AC_CONFIG_SRCDIR([src/flaimtk.h])\n\
  \n   AC_CONFIG_HEADERS([config.h])\n\n   # Checks for programs.\n\n   AC_PROG_CXX\n\
  \n   AC_PROG_INSTALL\n\n   # Checks for optional programs.\n\n➏ FLM_PROG_TRY_DOXYGEN\n\
  \n   # Configure options: --enable-debug[=no].\n\n➐ AC_ARG_ENABLE([debug],\n\n \
  \    [AS_HELP_STRING([--enable-debug],\n       [enable debug code (default is no)])],\n\
  \     [debug=\"$withval\"], [debug=no])\n\n   # Configure option: --enable-openssl[=no].\n\
  \n   AC_ARG_ENABLE([openssl],\n\n     [AS_HELP_STRING([--enable-openssl],\n    \
  \   [enable the use of openssl (default is no)])],\n     [openssl=\"$withval\"],\
  \ [openssl=no])\n\n   # Create Automake conditional based on the DOXYGEN variable\n\
  \n➑ AM_CONDITIONAL([HAVE_DOXYGEN], [test -n \"$DOXYGEN\"])\n\n   #AM_COND_IF([HAVE_DOXYGEN],\
  \ [AC_CONFIG_FILES([docs/doxyfile])])\n\n➒ AS_IF([test -n \"$DOXYGEN\"], [AC_CONFIG_FILES([docs/doxyfile])])\n\
  \n--snip--\n```\n\n*列表 14-5*: `ftk/configure.ac`: *ftk 项目的* `configure.ac` *文件的前半部分*\n\
  \n在 ➊ 处，你会看到我为 `AC_INIT` 宏中留下的占位符替换了真实值。我在 ➋ 处添加了对 `AM_INIT_AUTOMAKE`、`LT_PREREQ`\
  \ 和 `LT_INIT` 的调用，并在 ➍ 处增加了对 `AC_CONFIG_MACRO_DIRS` 的调用（现在请先忽略 `AM_PROG_AR` 宏——我将在本章稍后解释它）。\n\
  \n### 注意\n\n这次我没有在 `AM_INIT_AUTOMAKE` 中使用 `foreign` 关键字。由于这是一个真实的开源项目，FLAIM 开发者们会（或至少应该）想要这些文件。我使用\
  \ `touch` 命令创建了 GNU 项目文本文件的空版本，^(11)，但 `autoreconf` 会添加的 `COPYING` 和 `INSTALL` 之外。\n\
  \n➌ 处的新结构是 `AC_LANG` 宏，它指示 Autoconf 在生成 configure 中的编译测试时应该使用的编程语言（以及相应的编译器）。我传递了\
  \ `C++` 作为参数，以便 Autoconf 将通过 `CXX` 变量使用 C++ 编译器编译这些测试，而不是通过 `CC` 变量使用默认的 C 编译器。随后删除了\
  \ `AC_PROG_CC` 宏调用，因为该项目的源代码完全是用 C++ 编写的。\n\n我在 ➎ 处更改了 `AC_CONFIG_SRCDIR` 文件参数，使其比\
  \ `autoscan` 随机选择的那个更有意义。\n\n➏ 处的 `FLM_PROG_TRY_DOXYGEN` 宏是我写的一个自定义宏。其原型如下：\n\n\
  ```\nFLM_PROG_TRY_DOXYGEN([quiet])\n```\n\n我将在第 16 章中介绍该宏的工作细节。现在，只需要知道它管理着名为 `DOXYGEN`\
  \ 的重要变量。如果该变量已经设置，此宏将什么都不做；如果变量未设置，它会在系统搜索路径中扫描 doxygen 程序，如果找到，则将变量设置为该程序名。当我们讨论\
  \ `xflaim` 项目时，我会解释 Autoconf 的重要变量。\n\n➐ 处，我使用 `AC_ARG_ENABLE` 为 configure 的命令行解析器添加了几个配置选项。当我们遇到其他使用这些宏所定义的变量的新结构时，将更完整地讨论这些调用的细节。\n\
  \n#### Automake 配置特性\n\nAutomake 提供了我在➑ 处使用的 `AM_CONDITIONAL` 宏；其原型如下：\n\n```\n\
  AM_CONDITIONAL(variable, condition)\n```\n\n`variable` 参数是一个 Automake 条件名称，你可以在你的\
  \ `Makefile.am` 文件中使用它来测试关联条件。`condition` 参数是一个 `shell condition`（shell 条件）——一段可以作为\
  \ shell if-then 语句中条件的 shell 脚本片段。事实上，这正是该宏在内部使用 `condition` 参数的方式，因此它必须格式化为适当的\
  \ if-then 语句 `condition` 表达式：\n\n```\nif condition; then\n```\n\n\n\n\n有了这段代码后，如果用户系统中没有安装\
  \ `doxygen`，`configure` 将完全不会处理 `docs` 目录下的 `doxyfile.in` 模板。\n\n### **注意**\n\n\
  此处不应包含 `docs/Makefile.in` 模板，因为 `dist` 目标必须在执行 `all` 和 `clean` 等构建目标期间，能够处理项目中的所有目录——无论它们是否是条件构建的。因此，你永远不要在\
  \ `configure.ac` 中有条件地处理 `Makefile.in` 模板。然而，你完全可以有条件地处理其他类型的模板。\n\n➒ 行之后的一行是使用\
  \ `M4sh` 实现相同功能的另一种方法——`M4sh` 是 Autoconf 内置的一个宏库，旨在使编写可的 Bourne shell 脚本变得更容易。以下是其原型：\n\
  \n```\nAS_IF(test1, [run-if-true], ..., [run-if-false])\n```\n\n在所示第二个和最后一个参数之间的可选、省略参数是\
  \ `test`N 和 `run-if-true` 参数对。根结底，这个宏的工作非常类似于具有用户指定数量 elif 条件的 if-then-elif... shell\
  \ 语句。\n\nListing 14-7 显示了 ftk 的 `configure.ac` 文件的后半部分。\n\n```\n --snip--\n\n  \
  \ # 为大文件配置，即使在 32 位环境下\n\n➊ AC_SYS_LARGEFILE\n\n   # 检查 pthreads\n\n➋ AX_PTHREAD(\n\
  \n     [AC_DEFINE([HAVE_PTHREAD], [1],\n\n       [如果你有 POSIX 线程库和头文件，则定义此.])\n \
  \    LIBS=\"$PTHREAD_LIBS $LIBS\"\n     CFLAGS=\"$CFLAGS $PTHREAD_CFLAGS\"\n   \
  \  CXXFLAGS=\"$CXXFLAGS $PTHREAD_CXXFLAGS\"])\n\n➌ # 检查库。\n\n   AC_SEARCH_LIBS([initscr],\
  \ [ncurses])\n\n   AC_CHECK_HEADER([curses.h],,[echo \"*** Error: curses.h not found\
  \ - install\n   curses devel package.\"; exit 1])\n\n   AC_CHECK_LIB([rt], [aio_suspend])\n\
  \n   AS_IF([test \"x$openssl\" = xyes],\n\n   ➍ [AC_DEFINE([FLM_OPENSSL], [1], [定义以使用\
  \ openssl])\n      AC_CHECK_LIB([ssl], [SSL_new])\n      AC_CHECK_LIB([crypto],\
  \ [CRYPTO_add])\n      AC_CHECK_LIB([dl], [dlopen])\n      AC_CHECK_LIB([z], [gzopen])])\n\
  \n➎ # 检查头文件。\n\n   AC_HEADER_RESOLV\n   AC_CHECK_HEADERS([arpa/inet.h fcntl.h limits.h\
  \ malloc.h netdb.h netinet/in.h\n   stddef.h stdlib.h string.h strings.h sys/mount.h\
  \ sys/param.h sys/socket.h sys/\n   statfs.h sys/statvfs.h sys/time.h sys/vfs.h\
  \ unistd.h utime.h])\n\n   # 检查 typedef、结构体和编译器特性。\n\n   AC_CHECK_HEADER_STDBOOL\n\
  \   AC_C_INLINE\n   AC_TYPE_INT32_T\n   AC_TYPE_MODE_T\n   AC_TYPE_PID_T\n   AC_TYPE_SIZE_T\n\
  \   AC_CHECK_MEMBERS([struct stat.st_blksize])\n   AC_TYPE_UINT16_T\n   AC_TYPE_UINT32_T\n\
  \   AC_TYPE_UINT8_T\n   # 检查库函数。\n\n   AC_FUNC_LSTAT_FOLLOW_SLASHED_SYMLINK\n  \
  \ AC_FUNC_MALLOC\n   AC_FUNC_MKTIME\n   AC_CHECK_FUNCS([atexit fdatasync ftruncate\
  \ getcwd gethostbyaddr gethostbyname\n   gethostname gethrtime gettimeofday inet_ntoa\
  \ localtime_r memmove memset mkdir\n   pstat_getdynamic realpath rmdir select socket\
  \ strchr strrchr strstr])\n\n   # 如果请求，则配置 DEBUG 源代码。\n\n➏ AS_IF([test \"x$debug\"\
  \ = xyes],\n     [AC_DEFINE([FLM_DEBUG], [1], [定义以启用 FLAIM 调试功能])])\n\n➐ --snip--\n\
  \n➑ AC_CONFIG_FILES([Makefile\n                      docs/Makefile\n           \
  \           obs/Makefile\n                      obs/flaimtk.spec\n             \
  \         src/Makefile\n                      util/Makefile\n                  \
  \    src/libflaimtk.pc])\n   AC_OUTPUT\n   # 修复损坏的 libtool\n   sed 's/link_all_deplibs=no/link_all_deplibs=yes/'\
  \ libtool >libtool.tmp && \\\n     mv libtool.tmp libtool\n➒ cat <<EOF\n     FLAIM\
  \ toolkit ($PACKAGE_NAME) version $PACKAGE_VERSION\n     Prefix.........: $prefix\n\
  \     Debug Build....: $debug\n     Using OpenSSL..: $openssl\n     C++ Compiler...:\
  \ $CXX $CXXFLAGS $CPPFLAGS\n     Linker.........: $LD $LDFLAGS $LIBS\n     Doxygen........:\
  \ ${DOXYGEN:-NONE}\n   EOF\n```\n\n*Listing 14-7*: ftk/configure.ac: ftk 项目 configure.ac\
  \ 文件的后半部分\n\n在 ➊，我调用了 `AC_SYS_LARGEFILE`。在存在多个线程的情况下，你必须配置许多标准库函数以线程安全的方式运行。你可以通过确保一个或多个预处理器定义可见来做到这一点。某些供应商为单线程和多线程程序提供完全不同的标准库。供应商认为（这是正确的）他们通过提供不同版本的标准库提供了帮助。在这种情况下，必须告诉链接器使用正确的运行时库。\n\
  \n不幸的是，每个供应商都以自己的方式处理多线程，从编译器选项到库名再到预处理器定义。但这个问题有一个合理的解决方案：GNU Autoconf Archive^(13)\
  \ 提供了一个名为 `AX_PTHREAD` 的宏，它可以检查编译器并提供各种平台的选项。\n\n#### **正确处理线程**\n\n在 ➋ 有另一个结构 `AX_PTHREAD`。在\
  \ Jupiter 项目中，我简单地将 upiter 程序与 `-lpthread` 标志链接。但坦率地说，这是使用 `pthreads` 的错误方法。\n\n\
  在存在多个线程的情况下，你必须在编译时配置许多标准库头文件。你可以通过确保在命令行上定义预处理器定义来做到。这些预处理器定义在编译器供应商之间并没有标准。在许多嵌入式系统中，因为添加线程安全性会降低性能。\n\
  \n这个宏的使用非常简单：\n\n```\nAX_PTHREAD(action-if-found[, action-if-not-found])\n```\n\n\
  它设置了几个环境变量，包括 `PTHREAD_CFLAGS`、`PTHREAD_CXXFLAGS` 和 `PTHREAD_LIBS`。由调用者通过在 `action-if-found`\
  \ 参数中添加 shell 代码来正确使用这些变量。如果你的项目所有代码都是多线程的，情况会更简单：你只需要将这些变量附加到（或内部消耗）标准的 `CFLAGS`、`CXXFLAGS`\
  \ 和 `LIBS` 变量即可。FLAIM 项目的代码库完全是多线程的，所以我选择了这样做。\n\n\n\n\n相反，该宏包含了一个长串已知的 `pthreads`\
  \ 编译器选项，生成的 `configure` 脚本会使用主机编译器依次使用这些选项中的每一个来编译一个小小的 `pthreads` 程序。被编译器识别并因此能够正确构建测试程序的标志被添加到\
  \ `PTHREAD_CFLAGS` 和 `PTHREAD_CXXFLAGS` 变量中。通过这种方式，即使在未来编译器选项发生重大变化时，`AX_PTHREAD`\
  \ 也有很大可能继续正常工作——而这*正是* Autoconf 的做法。\n\n## 获取恰当的库\n\n我删除了 Listing 14-7 中 ➌ 处每个 `AC_CHECK_LIB`\
  \ 宏调用的上方 `FIXME` 注释（参见位于第 378 页 的 Listing 14-4 ��）中的 `configure.scan`）。我曾开始将这些宏中的主要占位符替换为实际的库函数名，但随后我开始怀疑所有这些库是否真的必要。比起担心\
  \ `autoscan` 的能力，我更担心原始 `makefile` 的真实性。在手动硬编码的构建系统中，我偶尔注意到作者会从一个 `makefile` 复制粘贴一组库名到另一个，直到程序在没有缺失符号的情况下构建成功。^(14)\n\
  \n我没有盲目地延续这一趋势，而是选择简单地注释所有的所有的 `AC_CHECK_LIB` 调用，看看构建能进行到哪一步，并根据解决缺失符号的需求，逐个将它们加回来。除非你的项目真的消耗了数百个库，否则这只会额外花几分钟。我喜欢只链接项目项目必需的库；这可以加快链接过程，并且在坚持不懈的情况下，它提供了一种良好的项目级文档形式。\n\
  \n`configure.scan` 文件包含了 14 个这样的 `AC_CHECK_LIB` 调用。事实证明，我在 64 位 Linux 系统上使用的 FLAIM\
  \ 工具包仅需要其中三个——`pthread`、`ncurses` 和 `rt`——因此我删除了剩余的条目，并将 `ncurses` 和 `rt` 库中的占位符参数替换为真实函数。回想起来，我的策略似乎获得了丰厚的回报，因为我从\
  \ 14 个库减少到了 2 个。第三个库是 POSIX Thread (`pthreads`) 库，它是通过上一节讨论过的 `AX_PTHREAD` 宏添加的。\n\
  \n我还将 `ncurses` 的 `AC_CHECK_LIB` 调用转换为 `AC_SEARCH_LIBS`，因为我怀疑未来的 FLAIM 平台可能会使用不同的库名称来实现\
  \ `curses` 功能。我希望让构建系统在这些平台上能够搜索额外的库。`ncurses` 库在大多数平台上都是可选的库，因此我添加了 `AC_CHECK_HEADER`\
  \ 宏来检查 `curses.h`，在第三（第三）参数中显示消息，提示用户应该安装 `curses-development` 包，并带错误退出配置过程。这条规则是在配置期间早期发现问题，而不是在编译期间发现。\n\
  \n## 维护者定义的命令行选项\n\n接下来的四个库在 ➍ 处的一个 Autoconf 条件语句中进行检查。该语句基于终端用户对 `--enable-openssl`\
  \ 命令行参数的使用，由 `AC_ARG_ENABLE` 提供（参见 Listing 14-5 中第 379 页 的 ➐）。\n\n我在这里使用 `AS_IF`\
  \ 而不是 shell `if-then` 语句，因为如果条件语句内调用的任何宏需要额外的宏来展开，那么……我希望准备构建系统以便在这些平台上搜索额外的库。`ncurses`\
  \ 库在大多数平台上都是可选的库，因此我添加了 `AC_CHECK_HEADER` 宏来检查 `curses.h`，在 `action-if-not-found`（第三）参数中显示消息，提示用户应该安装\
  \ `curses-development` 包，并带错误退出配置过程。这条规则是在配置期间早期发现问题，而不是在编译期间发现。\n\n\n\n\n```\n\
  \ ACLOCAL_AMFLAGS = -I m4\n\n   EXTRA_DIST = GNUMakefile README.W32 debian netware\
  \ win32\n\n➊ if HAVE_DOXYGEN\n\n     DOXYDIR = docs\n\n   endif\n\n   SUBDIRS =\
  \ src util obs $(DOXYDIR)\n\n➋ doc_DATA = AUTHORS ChangeLog COPYING INSTALL NEWS\
  \ README\n\n   RPM = rpm\n\n➌ rpms srcrpm: dist\n\n          (cd obs && $(MAKE)\
  \ $(AM_MAKEFLAGS) $@) || exit 1\n\n           rpmarch=`$(RPM) --showrc | \\\n  \
  \           grep \"^build arch\" | sed 's/\\(.*: \\)\\(.*\\)/\\2/'`; \\\n      \
  \     test -z \"obs/$$rpmarch\" || \\\n             ( mv obs/$$rpmarch/* . && rm\
  \ -rf obs/$$rpmarch )\n\n           rm -rf obs/$(distdir)\n\n➍ #dist-hook:\n\n \
  \  #        rm -rf `find $(distdir) -name .svn`\n\n   .PHONY: srcrpm rpms\n```\n\
  \n*列表 14-8*: `ftk/Makefile.am`：*FLAIM 工具集顶层 makefile 的完整内容*\n\n在此文件中，你会找到常见的 `ACLOCAL_AMFLAGS`、`EXTRA_DIST`\
  \ 和 `SUBDIRS` 变量定义，但你也可以看到在 ➊ 处使用了 Automake 条件判断。`if` 语句允许我将另一个目录（`docs`）添加到 `SUBDIRS`\
  \ 列表中，但前提是当 doxygen 程序可用时（根据 `configure` 的结果）。我在这里使用了一个独立的变量（`DOXYDIR`），但 Automake\
  \ 条件判断也可以包裹一个使用 Automake `+=` 运算符直接将目录名（`doc`）追加到 `SUBDIRS` 变量的语句。\n\n**注意**\n\n\
  不要将 Automake 条件判断与 GNU Make 条件判断混淆，后者使用 `ifeq`、`ifneq`、`ifdef` 和 `ifndef` 关键字。如果你尝试在\
  \ `Makefile.am` 中使用 Automake 条件判断，而在 `configure.ac` 中没有对应的相应的 `AM_CONDITIONAL` 语句，`Automake`\
  \ 将对此报错。当此构造结构被正确使用时，Automake 会在 `make` 看到它之前将其转换为 `make` 能理解的内容。\n\n另一个新构造（至少在顶层\
  \ `Makefile.am` 文件中）是 ➋ 处对 `doc_DATA` 变量的使用。FLAIM 工具集在其顶层目录下提供了一些我希望安装的额外文档文件。通过在\
  \ `DATA` 主目标上使用 `doc` 前缀，我告诉 Automake 我希望这些文件作为数据文件安装到 `$(docdir)` 目录，该目录默认解析为 `$(prefix)*/share/doc*`\
  \ 目录。\n\n`DATA` 变量中提到的、对 Automake 而言没有特殊含义的文件不会被自动分发（即它们不会被添加到分发 tar 包中），因此你必须通过将它们添加到\
  \ `EXTRA_DIST` 变量列出的文件中来手动分发它们。\n\n**注意**\n\n我不需要在 `EXTRA_DIST` 中列出标准的 GNU 项目文本文件，因为它们总是自动分发的。然而，我必须在\
  \ `doc_DATA` 变量中提到这些文件，因为 Automake 对你想要安装哪些文件不作假设。\n\n我将对 ➌ 处 `RPM` 目标的讨论推到下一章。\n\
  \n### Automake -hook 和 -local 规则\n\nAutomake 识别两种类型的集成扩展，我将其称为 -local 目标和 -hook\
  \ 目标。Automake 识别并遵循以下标准目标的 -local 扩展：\n\n| all | install-data | installcheck |\n\
  | check | install-dvi | installdirs |\n| clean | install-exec | maintainer-clean\
  \ |\n| distclean | install-html | mostlyclean |\n| dvi | install-info | pdf |\n\
  | html | install-pdf | ps |\n| info | install-ps | uninstall |\n\n在你的 `Makefile.am`\
  \ 文件中对这些任何一个目标添加 `-local`，都会导致关联命令在标准目标执行**之前**执行。Automake 通过生成标准目标的规则，使 `-local`\
  \ 版本成为其依赖项之一（如果存在的话）来实现这一点。在第 404 页的“清理你的房间”中，我将通过一个 `clean-local` 目标展示这一概念的示例。\n\
  \n`-hook` 目标稍不同，它们在相应的标准目标执行**之后**执行。Automake 通过在标准目标命令列表的末尾添加另一个命令来实现。该命令仅在包含的\
  \ makefile 上执行 `$(MAKE)`，并将 `-hook` 目标作为命令行目标。因此，`-hook` 目标以递归的方式在标准目标命令结束时执行。\n\
  \n以下标准 Automake 目标支持 -hook 版本：\n\n| dist | install-data | uninstall |\n| distcheck\
  \ | install-exec | | |\n\nAutomake 会自动将所有现有 -local 和 -hook 目标添加到生成的 makefile 中的\
  \ `.PHONY` 规则中。\n\n在本书的第一版中，我在 `Makefile.am` 的 ➍ 处使用了 `dist-hook` 目标（现在已注释掉），在构建分发目录之后、make\
  \ 从其内容构建分发存档之前调整它。`rm` 命令删除了额外的文件和目录，这些文件是因为我将整个目录添加到 `EXTRA_DIST` 变量而成为分发目录的一部分。当你将目录名称添加到\
  \ `EXTRA_DIST`（在此例中为 `debian`、`netware` 和 `win32`）时，这些目录中的所有内容都会添加到分发中。\n\n```\n\
  ...\ndistdir: $(DISTFILES)\n        ... 将文件拷贝到 distdir\n        $(MAKE) $(AM_MAKEFLAGS)\
  \ top_distdir=\"$(top_distdir)\"\n            distdir=\"$(distdir)\" dist-hook\n\
  \        ... 修改 distdir 中文件的属性\n...\ndist-all: distdir\n        tardir=$(distdir)\
  \ && $(tar) | GZIP=$(GZIP_ENV) gzip -c\n          $(distdir).tar.gz\n        $(am__remove_distdir)\n\
  ...\n.PHONY: ...\ndist-hook:\nrm -rf `find $(distdir) -name .svn`\n```\n*列表 14-9*:\
  \ 定义 dist-hook 的结果\n\n*不要害怕深入生成的 makefile。虽然 make 命令中有大量的 shell 代码，但你通常感兴趣的是 Automake\
  \ 生成的规则，将其分离很容易。*\n\n### 设计 ftk/src/Makefile.am\n\n现在我需要为 FLAIM 工具集的 *src* 和 *utils*\
  \ 目录创建 `Makefile.am` 文件。在创建这些文件时，我想确保保留旧构建系统的所有功能。基本上，这包括：\n\n*   正确构建 ftk 共享库和静态库\n\
  *   正确指定所有安装文件的位置\n*   正确设置 ftk 共享库版本信息\n*   确保所有剩余的未使用文件进行分发\n*   确保使用了特定平台的编译器选项\n\
  \n列表 14-10 显示的模板涵盖了大部分这些点，因此我将将其用于所有的 FLAIM 库项目，并根据每个库的需求进行相应的增减。\n\n```\nEXTRA_DIST\
  \ = ...\nlib_LTLIBRARIES = ...\ninclude_HEADERS = ...\nxxxxx_la_SOURCES = ...\n\
  xxxxx_la_LDFLAGS = -version-info x:y:z\n```\n*列表 14-10*: src 和 utils 目录 Makefile.am\
  \ 的框架\n\n原始的 `GNUMakefile` 告诉我库命名为 `libftk.so`。这在 Linux 上是一个很糟糕的库名，因为大多数三字母库名已被占用。因此，我做了一个行政决定，并将\
  \ *ftk* 库重命名为 *flaimtk*。\n\n列表 14-11 显示了 `ftk/src/Makefile.am` 文件的大部分内容。\n\n\n\n\
  \n\n```\n➊ EXTRA_DIST = ftknlm.h\n\n➋ lib_LTLIBRARIES = libflaimtk.la\n\n➌ include_HEADERS\
  \ = flaimtk.h\n\n➍ pkgconfigdir = $(libdir)/pkgconfig\n\n   pkgconfig_DATA = libflaimtk.pc\n\
  \n➎ libflaimtk_la_SOURCES = \\\n   ftkarg.cpp \\\n   ftkbtree.cpp \\\n   ftkcmem.cpp\
  \ \\\n   ftkcoll.cpp \\\n   --snip--\n   ftksys.h \\\n   ftkunix.cpp \\\n   ftkwin.cpp\
  \ \\\n   ftkxml.cpp\n\n➏ libflaimtk_la_LDFLAGS = -version-info 0:0:0\n```\n\n*列表\
  \ 14-11*: ftk/src/Makefile.am: *整个文件内容，减去几十个源文件*\n\n我在 ➋ 处将 Libtool 库名称 `libflaimtk.la`\
  \ 添加到 `lib_LTLIBRARIES` 列表中，并将剩余宏在 列表 14-10 中的 `xxxxx` 部分更改 `libflaimtk`。我本可以手动输入所有源文件，但在阅读原始\
  \ Makefile 时，我注意到使用了 GNU make 函数宏 `$(wildcard src/*.cpp)` 根据 `src` 目录的内容构建了文件列表。这告诉我，`src`\
  \ 目录下的所有 `*.cpp` 文件都是库所需要的（或至少是被库所消耗）。为了将文件列表导入 `Makefile.am`，我使用了一个简单的 shell 命令将其连接到\
  \ `Makefile.am` 文件的末尾（假设我处于 `ftk/src` 目录中）：\n\n```\n$ printf '%s \\\\\\n' *.cpp\
  \ >> Makefile.am\n```\n\n这在 `ftk/src/Makefile.am` 的底部留下了一个单列的、反斜杠结尾的、字母排序的 `ftk/src`\
  \ 目录中所有 `*.cpp` 文件列表。\n\n**注意**\n\n不要忘记 `printf` 参数周围的单引号，这对于在生成列表时防止第一对反斜杠被 shell\
  \ 解释为转义字符是必要的。无论是否有引号，`printf` 都能正确理解并解释 `\\n` 字符。\n\n我将列表移动到 ➎ 处的 `libflaimtk_la_SOURCES`\
  \ 行下方，在等号后添加了一个反斜杠字符，并删除了最后一个文件后面的反斜杠。另一种格式化技术是每隔大约 70 个字符用反斜杠和换行符包裹一行，但我倾向于将每个文件单独放在一行，特别是在转换过程早期，这样我可以根据需要轻松从列表中提取文件或添加文件。将文件分行存放还可以让你在\
  \ pull request（拉取请求）审查和其他 diff 风格的输出时，源文件列表更容易比较。\n\n我必须手动检查 `src` 目录中的每个头文件，以确定它们在项目中的用途。只有四个头文件，事实证明，FLAIM\
  \ 工具包在 Unix 和 Linux 平台上*不* 使用的唯一头文件是 `ftknlm.h`，它是针对 NetWare 构建的。我将此文件添加了 ➊ 处的 `EXTRA_DIST`\
  \ 列表中以便分发；仅仅因为构建没有使用它，并不意味着用户想要或需要它。(19)\n\n（新重命名的）`flaimtk.h` 文件是唯一的公共头文件，因此我将其移动到\
  \ ➌ 处的 `include_HEADERS` 列表中。另外两个文件在库构建中内部使用，因此我将它们留在 `libflaimtk_la_SOURCES` 列表中。如果这是我自己的项目，我会将\
  \ `flaimtk.h` 移动到项目根目录下的 `include` 目录，但请记住，我这里的目标之一是限制对目录结构和的更改。移动此头文件是一个哲学决定，我决定将其留给维护者处理。(20)\n\
  \n最后，我在原始 Makefile 中注意到 `ftk` 库的最后一个版本发布了 4.0 的接口版本。但由于我将库名称从 `libftk` 更改为 `libflaimtk`，我将此值重置为\
  \ 0.0，因为这是一个不同的库。我在 ➏ 处 `libflaimtk_la_LDFLAGS` 变量中的 `-version-info` 选项将 `x:y:z`\
  \ 替换为 `0:0:0`。\n\n**注意**\n\n`0:0:0` 版本字符串是默认值，所以我可以完全删除参数并获得相同的结果。然而，包含它可以为新开发者提供未来如何更改接口版本的某些见解。\n\
  \n我在 ➍ 处增加了 `pkgconfigdir` 和 `pkgconfig_DATA` 变量，以为该项目提供安装 pkg-config 元数据文件的支持。更多关于\
  \ pkg-config 系统的信息，请参见第 10 章。\n\n### 继续到 ftk/util 目录\n\n为 `util` 目录正确设计 `Makefile.am`\
