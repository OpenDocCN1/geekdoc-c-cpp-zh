  \ `SUBDIRS` 变量的内容。当执行 `make all` 时，`SUBDIRS` 变量会条件地递归进入 `java` 和 `cs` 子目录。但当执行 `make\
  \ dist` 时，隐藏的 `DIST_SUBDIRS` 变量（由 Automake 根据 `SUBDIRS` 变量的*所有可能内容*创建）将引用所有有条件或无条件地附加到\
  \ `SUBDIRS` 的目录。\n\n### 注意\n*库接口版本信息是从原始 makefile 中提取的。*\n\n## 转向 xflaim/util 目录\n\
