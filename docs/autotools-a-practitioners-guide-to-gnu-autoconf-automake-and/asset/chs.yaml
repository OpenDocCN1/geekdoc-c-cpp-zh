  \n  系统:  English\n  字符集: UTF-8\n\nIdentification\n\n  标题:         USA 英语区域\n  来源:\
  \        Free Software Foundation, Inc.\n  地址:       http://www.gnu.org/software/libc/\n\
  \  联系:\n  邮箱:         bug-glibc-locales@gnu.org\n  电话:\n  语言:      English\n  地区:\
  \     USA\n  受众:\n  应用:\n  缩写:\n  修订:        1.0\n  日期:            2000-06-24\n\
  \  分类:        en_US:2000\n  字符集:         UTF-8\n$\n```\n\n上述输出的高亮部分显示了 `nl` 输出中超出\
  \ 列表 11-2 中 `lc` 程序的内容。额外的区域分类定义如下。\n\n### LC_MESSAGES\n\n此分类提供了一个额外的项目值 `CODESET`，它定义了该区域使用的字符集。由于该项目被归类在“消息（Messages）”，因为它旨在帮助翻译应用程序代码中的静态文本消息。该值在\
  \ Linux 系统上也可以作为环境变量使用，以帮助选择要使用的静态消息目录。\n\n### LC_PAPER\n\n纸张分类提供了两个项目：`NL_PAPER_HEIGHT`\
  \ 和 `NL_PAPER_WIDTH`，它们返回该区域内最常用打印纸的尺寸（单位为毫米）。这在格式化打印输出或自动选择纸张尺寸（例如 `letter` 和 `A04`）时非常有帮助。请注意，从这些项目枚举返回的指针值应被视为原生整数，而不是实际指针。详情请参见\
  \ 列表 11-2 中的 `nl.c` 代码。\n\n### LC_NAME\n\n名称分类提供了称呼的格式信息，如 `Mr.`、`Mrs.`、`Miss.`\
  \ 和 `Ms.`。这些项目允许您的软件自动说明语言和地区。\n\n### LC_ADDRESS\n\n地址分类提供了区域的地理信息，例如国家名称、邮政编码以及两位或三字母的国家缩写。\n\
  \n### LC_TELEPHONE\n\n电话分类提供了格式指定字符串，可用于 `printf` 系列函数，以便以当前区域常用的样式显示电话号码。\n\n###\
  \ LC_MEASUREMENT\n\n测量分类提供了一个项目，用于返回当前区域使用的测量系统。`NL_MEASUREMENT` 返回一个字符串，其第一个字符是一个短整数。\n\
  \n### LC_IDENTIFICATION\n\n标识分类实际上是区域元数据。也就是说，该分类的字段返回了创建当前区域所需的信息（例如作者姓名、电子邮件、电话号码等）。它还返回了区域的版本信息。请注意，从\
  \ `NL_ADDRESS_COUNTRY_NUM` 返回的指针值应被视为原生整数。\n\n### 静态消息源码插桩\n\n在源代码中对特定区域的静态文本消息进行访问也是软件国际化过程的一部分，因此我们在这里介绍静态文本显示消息的插桩。然后我们将在第\
  \ 12 章中讨论如何生成和消费语言包，届时我将讨论本地化。\n\n\n\n\n现在应该很清楚了，我们对从 Jupiter（例如）打印的“*greeting*,\
  \ from *progname*! ”文本的静态部分需要进行一些处理。我不会再深入探讨 Jupiter，但它提供了一个简洁的示例，说明了当区域设置（locale）变化时，我们的程序中需要更改的内容。对源代码进行测量以翻译静态显示消息的过程，涉及扫描源代码以找到所有在程序执行期间可以显示给用户的字符串字面量，然后进行一些操作，使程序能够使用针对当前区域设置的字符串版本。\n\
  \n有几个开源（以及几个第三方商业）库可以用来完成这项任务，但我们将重点关注 GNU `gettext` 库。从软件的角度来看，`gettext` 库非常简单。在最简单的形式中，有一个函数用于标记需要翻译的消息，以及两个函数用于选择用于显示的消息目录（message\
  \ catalog）。标记函数命名为 `gettext`，其原型如在 列表 11-9 所示。\n\n```\n#include <libintl.h>\n\n\
  char *gettext(const char *msgid);\n```\n\n*列表 11-9: gettext 函数的原型*\n\n该函数接受 `msgid`\
  \ 参数中的消息标识符，并返回给用户的显示消息。消息标识符可以是任何字符串，但通常是处于 US-ASCII 格式的显示消息本身。之所以这样做，是因为如果找不到消息目录，`gettext`\
  \ 将返回 `msgid` 值本身，程序将像使用已找到翻译的消息一样使用该值。因此，`gettext` 函数不会以某种导致程序在任何可以想象的条件条件下无法以合理方式运行的方式失败。\n\
  \n这种约定使得对现有程序进行插桩/国际化处理（instrumenting）以及编写使用基于区域设置的消息目录的新程序都变得非常简单。你只需要找到程序源文件中所有的静态文本消息，并将它们封装在\
  \ `gettext` 的调用中。\n\n有时，有必要为翻译人员提供比字符串更多的上下文信息。一个常见的例子是，在为菜单项（如“文件”菜单中的“打开”子菜单选项）提供消息\
  \ ID 时，程序员可能向翻译人员说明，程序员以如 `|File|Open` 这样的格式提供了整个菜单层级。当翻译人员看到此时，他们知道只需要翻译最后一个竖线符号之后的部分。但如果当前区域设置没有翻译，消息\
  \ ID 将是完整字符串。在这种情况下，程序员必须编写代码来检查开头的竖线。如果找到，则应仅显示最后一个竖线之后的部分。\n\n列表 11-10 中的代码显示了一个非常短（且某种程度上很熟悉）的使用\
  \ `gettext` 的示例程序。\n\n```\n#include <stdio.h>\n\n#include <libintl.h>\n\n#define\
  \ _(x) gettext(x)\n\nint main()\n\n{\n\n     printf(_(\"Hello, world!\\n\"));\n\n\
  \     return 0;\n\n}\n```\n\n*列表 11-10:* gt.c: *一个说明使用 gettext 库的简短程序*\n\n`printf`\
  \ 函数将 `gettext` 的返回值发送到 `stdout`。`gettext` 函数由 GNU C 库导出，因此使用它不需要额外的库。在使用没有 GNU\
  \ C 时使用 `gettext`，只需链接 `intl` 库（共享对象或静态存档）。\n\n我们可以在 `printf` 中直接调用 `gettext`，但下划线\
  \ `_` 宏是软件国际化时常用的常用惯用法，原因有两个：首先，它减少了对现有代码库进行 `gettext` 插桩处理的视觉影响。其次，如果我们选择为 `gettext`\
  \ 封装附加功能，或者我们决定使用更具功能的 `gettext` 变体（例如 `dgettext` 和 `dcgettext`），它允许我们在单点进行替换。我在这里没有讨论这些变体，但你可以在\
  \ *GNU C Library* 手册中找到更多信息。(17)\n\n### 消息目录的选择\n\n消息目录的选择分两个阶段：程序员阶段和用户阶段。程序员阶段由\
  \ `textdomain` 和 `bindtextdomain` 函数处理。这些函数的原型（同样由 GNU C 库导出）如在 列表 11-11 所示。\n\n\
  ```\n#include <libintl.h>\n\nchar *textdomain(const char *domainname);\n\nchar *bindtextdomain(const\
  \ char *domainname, const char *dirname);\n```\n\n*列表 11-11: textdomain 和 bindtextdomain\
  \ 的原型*\n\n`textdomain` 函数允许软件作者确定程序中任何一点正在使用的消息目录域（domain）。域表示包含程序中部分消息的给定消息目录。从属于特定域的源代码中提取的所有字符串最终都会进入该域的消息目录。\n\
  \n一个软件包可能有多个域。域与域之间的典型边界（因此也是消息目录之间的边界）是一个可执行模块——可以是程序或库。例如，`curl` 包安装了命令行 `curl`\
  \ 程序和 `libcurl.so` 共享库。`curl` 库设计用于供 `curl` 程序以及其他第三方程序和库使用。如果 `curl` 包进行了国际化，包作者可能会决定对\
  \ `curl` 程序使用 `curl` 域，对库使用 `libcurl` 域。\n\n（注：原文此处存在大量重复段落，此处已根据要求翻译了核心内容并保持格式逻辑一致）\n\
  \n\n\n传递给 `bindtextdomain` 第二参数的目录名源于未来对 `config.h` 的包含。我们将在把此程序集成到 Autotools 构建系统时添加该内容。如果我们在编译器命令行上定义了\
  \ `TEST_L10N`，则目录名将解析为 `PWD` 环境变量的值，允许我们在任何包含区域（locale）目录结构的位置测试我们的程序。（我们稍后会在第 12\
  \ 章中使用更符合 Autotool 风格的机制来替换这种临时方案。）\n\n为代码进行消息目录查找的插桩工作实际上只有这些了。在下一节中，我将讨论如何生成和构建消息目录，这是软件包本地化过程的一部分。我还将讨论\
  \ `gettext` 库的内部机制，它允许用户在（用户阶段）根据其选择的环境变量设置来选择应该使用的消息目录。\n\n### 总结\n\n在本章中，我的目标是为您提供足够的背景，以便您能够轻松继续学习软件项目的国际化。我涵盖了旨在帮助您实现软件国际化的\
  \ C 标准库功能。\n\n在下一章中，我们将通过深入研究本地化来继续对这一主题的探索。我们还将发现如何将所有这些整合到 Autotools 中，使得语言包可以通过\
  \ Automake 生成的 make 命令进行构建和安装。\n\n## 12 本地化\n\n> 当我在处理问题时，我从不考虑美。我只考虑如何解决问题。但当我完成后，如果解决方案不完美，我知道它是错误的。——R.\
  \ 贝肯金斯特·富勒\n\n![Image](img/common.jpg)\n\n一旦你完成了软件国际化涉及的重大工作，就可以开始考虑为其他语言和文化构建消息目录了。构建特定语言的消息目录被称为本地化（localization）。你正在针对目标区域对软件进行本地化。我们本章将讨论\
  \ GNU 项目处理这些主题的方法，包括如何将消息目录管理挂钩到 Autotools 构建系统中。\n\n### 入门\n\n消息目录必须位于应用程序可以找到它们的地方。可能会决定应用程序应该将其特定语言的消息目录存储在每个项目选择的位置，但\
  \ Linux（以及泛而言的 Unix）长期以来一直采用通过惯例静静引导应用程序开发者的微妙艺术。这些惯例不仅让开发者无需反复做出相同的决策，还能最大限度地提高任何地方的重用潜力。为了这一目的，消息目录的既定惯例将其放在系统数据目录下的公共目录下——即\
  \ `GNU Coding Standards` 所指的 `datadir`——通常定义为 `$(prefix)*/share*`^(1) 一个特殊目录 `$(datadir)*/locale*`\
  \ 存放了所有应用程序消息目录，其格式为用户提供了一些实用的功能。\n\n### 语言选择\n\n我在第 11 章中提到过，应用程序对当前语言（以及应用程序使用的消息目录）的选择是在两个阶段完成的。我已经讨论了程序员阶段。现在让我们转向用户阶段，它允许用户对选择哪个消息目录有一定的选择权。与区域的选择一样，消息目录的选择可以通过环境变量来引导。以下环境变量用于选择应用程序将使用的消息目录：\n\
  \n*   `LANGUAGE`\n*   `LC_ALL`\n*   `LC_*xxx`\n*   `LANG`\n\n到为止，我们只关注 `LC_ALL`\
  \ 变量，但实际上，应用程序的全局区域是通过首先检查 `LC_ALL`，然后是检查特定类别的变量（例如 `LC_TIME`），最后是 `LANG`（按此顺序）来选择的。换句话说，如果\
  \ `LC_ALL` 未设置或为空字符串，`setlocale` 将查找 `LC_*xxx` 变量（专门 `LC_COLLATE`、`LC_CTYPE`、`LC_MESSAGES`、`LC_MONETARY`、`LC_NUMERIC`\
  \ 和 `LC_TIME`）并使用它们的值来决定库功能相关的哪些区域。最后，如果这些都没有设置，将检查 `LANG`。如果 `LANG` 未设置，你将获得一个实现的默认值，这与\
  \ C 区域并不总是相同。\n\n在 `setlocale` 使用的变量之上，`gettext` 函数首先查看 `LANGUAGE`，如果设置，它将覆盖消息目录选择的所有其他设置。此外，`LANGUAGE`\
  \ 变量中设置的 `value` 对选择标准也有一定影响。在进入值格式之前，让我们看看 `$(datadir)*/locale*` 下的目录结构。如果你在自己的系统上查看此目录，你会看到类似这样的内容：\n\
  \n```\n$ ls -1p /usr/share/locale\n\naa/\nab/\nace/\nach/\naf/\nall_languages\n\
  --snip--\nlocale.alias\n--snip--\nsr@ijekavian/\nsr@ijekavianlatin/\nsr@latin/\n\
  sr@Latn/\n--snip--\nzh_CN/\nzh_HK/\nzh_TW/\nzu/\n$\n```\n\n这些目录名的格式看起来有些熟悉——它与第\
  \ 303 页“生成和安装区域”中定义的区域名称使用的格式相同。在每个包含消息目录的区域目录下（这相当稀疏），你会发现一个名为 `LC_MESSAGES` 的目录，包含一个或多个消息对象文件（*.mo`），这些是编译后的消息目录。例如，西班牙语：\n\
  \n```\n$ tree --charset=ASCII /usr/share/locale/es_ES\n\n/usr/share/locale/es_ES/MESSAGES\n\
  \n`-- weather.mo\n\n0 目录，1 个文件\n```\n\n如果你检查无关地区的西班牙语目录 `usr/share/locale/es*`，你会看到更多的消息目录。大多数程序在翻译时并不区分地区：\n\
  \n```\n$ tree --charset=ASCII /usr/share/locale/es\n\n/usr/share/locale/es/MESSAGES/\n\
  \n|-- apt.mo\n|-- apturl.mo\n|-- bash.mo\n|-- blueberry.mo\n|-- brasero.mo\n--snip--\n\
  |-- xreader.mo\n|-- xviewer.mo\n|-- xviewer-plugins.mo\n|-- yelp.mo\n`-- zvbi.mo\n\
  \n$\n```\n\n正如我之前提到的，消息对象文件的基础是应用程序的域。当你调用 `textdomain` 和 `bindtextdomain` 时，你指定的\
  \ `domain` 通过名称选择消息对象文件。在这个列表中，`blueberry` 是使用 `blueberry.mo` 消息目录的应用程序域。\n\n###\
  \ 构建消息目录\n\n`gettext` 库提供了一系列工具，帮助你从为消息目录选择进行国际化的源码构建消息目录。图 12-1 描述了数据通过 `gettext`\
  \ 工具从源码到二进制消息对象的流向。\n\n![Image](img/12fig01.jpg)\n\n*图 12-1：从源文件到消息对象的数据流*\n\n`xgettext`\
  \ 工具从编程语言源文件中提取消息并构建可移植对象模板（*.pot）文件。每当源文件消息字符串发生更改或以某种方式更新时，都会这样做。可能是现有消息被修改或删除，或者增加了新消息。无论如何，`.pot`\
  \ 文件必须更新。`.pot` 文件通常以包或程序使用的消息目录域命名。\n\n假设我们在项目中为法语区域创建了消息目录，此过程会在当前目录生成文件，但我们将遵循一种常见惯例，将所有的消息产物生成到项目根目录下的名为\
  \ `po` 的目录中：\n\n```\nproject/\n\n   po/\n      fr.mo\n      fr.po\n      project.pot\n\
  ```\n\n\n\n我的示例中 `po` 目录的内部布局是任意的——你可以告诉 `gettext` 工具如何命名输出文件，并且可以将它们放在你喜欢的任何地方。我选择这种结构是因为在本章节以后，当我们把\
  \ `gettext` 集成到 Autotools 项目时，将会用到这种结构。\n\n让我们为第 328 页列表 11-12 中 `gt` 程序的源代码生成 `.pot`\
  \ 文件：\n\n```\n$ mkdir po\n\n$ cd po\n\n$ xgettext -k_ -c -s -o gt.pot ../gt.c\n\n\
  $ cat gt.pot\n\n# SOME DESCRIPTIVE TITLE.\n\n# Copyright (C) YEAR THE PACKAGE'S\
  \ COPYRIGHT HOLDER\n\n# This file is distributed under the same license as the PACKAGE\
  \ package.\n\n# FIRST AUTHOR <EMAIL@ADDRESS>, YEAR.\n\n#\n\n#, fuzzy\n\nmsgid \"\
  \"\n\nmsgstr \"\"\n\n\"Project-Id-Version: PACKAGE VERSION\\n\"\n\"Report-Msgid-Bugs-To:\
  \ \\n\"\n\"POT-Creation-Date: 2018-07-12 17:22-0600\\n\"\n\"PO-Revision-Date: YEAR-MO-DA\
  \ HO:MI+ZONE\\n\"\n\"Last-Translator: FULL NAME <EMAIL@ADDRESS>\\n\"\n\"Language-Team:\
  \ LANGUAGE <LL@li.org>\\n\"\n\"Language: \\n\"\n\"MIME-Version: 1.0\\n\"\n\"Content-Type:\
  \ text/plain; charset=CHARSET\\n\"\n\"Content-Transfer-Encoding: 8bit\\n\"\n#: ../gt.c:25\n\
  \n#, c-format\n\nmsgid \"Hello, world!\\n\"\n\nmsgstr \"\"\n\n$\n```\n\n`xgettext`\
  \ 工具旨在从许多不同编程语言的源代码构建 `.pot` 文件，因此它接受 `--language` 或 `-L` 命令行选项作为提示。然而，如果没有提供此类选项，它还将根据文件扩展名猜测语言。\n\
  \n由于 `xgettext` 设计用于解析许多类型的源文件，它有时需要帮助来定位我们想要它提取的消息。它假设要提取的文本与 C 语言中的 `gettext`\
  \ 函数有某种关联。对于其他语言的源文件，它会寻找该函数的适当变体。遗憾的是，当我们用下划线 `_` 宏名称替换 `gettext` 时，我们给工作引入了某种“破坏者”。这时可以使用\
  \ `--keyword` (`-k`) 选项来告诉 `xgettext` 去哪里寻找要提取的消息文本。我们使用的 `-k_` 会导致 `xgettext` 查找\
  \ `_` 而不是 `gettext`。如果没有此选项，`xgettext` 将无法找到任何要提取的消息，因此不会生成 `.pot` 文件。\n\n我还告诉它在将消息添加到\
  \ `.pot` 文件时添加注释（`-c`）并对输出消息进行排序（`-s`）。如果你不告诉它其他要求（使用 `-o` 选项），它将创建一个名为 `messages.po`\
  \ 的文件。未与命令行选项关联的文件被 `xgettext` 视为输入文件。\n\n此时，虽然不是严格要求的，但取决于你选择使用的的工作流，你可能希望手动编辑\
  \ `gt.pot` 以更新 `xgettext` 添加的占位符值。例如，你可能想替换 `Project-Id-Version` 字段中的 `PACKAGE`\
  \ 和 `VERSION` 占位符字符串，并向 `Report-Msgid-Bugs-To` 字段添加一个电子邮件地址。这些可以在生成过程中通过 `--package-name`、`--package-version`\
  \ 和 `--msgid-bugs-address` 命令行选项添加。还有其他几个；你可以在手册中查询。\n\n从这个模板开始，我们现在可以为不同的区域生成*可移植对象*（`.po`）文件。`msginit`\
  \ 工具用于创建特定区域 `.po` 文件的初始版本，而 `msgmerge` 用于更新之前由 `msginit` 生成的现有 `.po` 文件。\n\n让我们从模板\
  \ `gt.pot` 创建一个法语 `fr.po` 文件：\n\n```\n$ msginit --no-translator --locale=fr\n\n\
  Created fr.po.\n\n$ cat fr.po\n\n# French translations for PACKAGE package.\n\n\
  # Copyright (C) 2019 THE PACKAGE'S COPYRIGHT HOLDER\n\n# This file is distributed\
  \ under the same license as the PACKAGE package.\n\n# Automatically generated, 2019.\n\
  \n#\n\nmsgid \"\"\n\nmsgstr \"\"\n\n\"Project-Id-Version: PACKAGE VERSION\\n\"\n\
  \"Report-Msgid-Bugs-To: \\n\"\n\"POT-Creation-Date: 2019-07-02 23:19-0600\\n\"\n\
  \"PO-Revision-Date: 2019-07-02 23:19-0600\\n\"\n\"Last-Translator: Automatically\
  \ generated\\n\"\n\"Language-Team: none\\n\"\n\"Language: fr\\n\"\n\"MIME-Version:\
  \ 1.0\\n\"\n\"Content-Type: text/plain; charset=ASCII\\n\"\n\"Content-Transfer-Encoding:\
  \ 8bit\\n\"\n\"Plural-Forms: nplurals=2; plural=(n > 1);\\n\"\n#: ../gt.c:21\n\n\
  #, c-format\n\nmsgid \"Hello, world!\\n\"\n\nmsgstr \"\"\n\n$\n```\n\n\n\n为了回答第一个问题，我在这里无法使用\
  \ `LC_*` 或 `LANG` 变量，因为我的系统中没有安装任何法语语言区域（locales），而这些变量仅仅用于设置区域，留给 `textdomain`\
  \ 和 `bindtextdomain` 根据对 C 库中 `localeconv` 返回的结构（或者说，是该结构更广泛的内部形式）的查询来确定区域。由于我没有安装任何法语语言区域，`setlocale`\
  \ 将无法根据 `LANG` 或 `LC_*` 变量的值设置区域，因此它将简单地将当前的全局区域设置为系统默认值——在我的宿主机上是英语。因此，使用的语言将继续是英语。\n\
  \n第二个问题的答案让我们回到了我在我在第 332 页“语言选择”中提出的一个尚未证实的陈述，在那个地方我提到，用户在 `LANGUAGE` 变量中设置的值对\
  \ `textdomain` 和 `bindtextdomain` 使用的筛选标准具有某种影响。`gettext` 库允许用户在请求的区域在系统上不可用时选择备用消息目录。这是通过在\
  \ `LANGUAGE` 变量中使用的具体性比 `setlocale` 检查的其他变量更不那么具体来实现的（`LANGUAGE` 变量是专门供 `textdomain`\
  \ 和 `bindtextdomain` 使用的）。`LANGUAGE` 支持的值格式可以完全复制 `LC_*` 和 `LANG` 的严格格式，但它也支持缺失组件的区域名称和语言别名。\n\
  \n首先，让我们考虑我所说的“缺失组件”是什么。回想区域名称的组件：\n\n```\nlanguage[_territory][.codeset][@modifier]\n\
  ```\n\n`bindtextdomain` 函数尝试在指定的区域目录中查找与此格式匹配的消息目录，该格式要么是在 `LANGUAGE` 变量中指定的，要么是由\
  \ `localeconv` 提供的当前区域字符串指定的。但随后它会逐一丢弃组件：首先是 `codeset`，然后是 `codeset` 的规范化形式^(3)，接着是\
  \ `territory`，最后是 `modifier`。如果所有组件都被丢弃，我们只剩下区域名称的 `language` 部分（或在 `LANGUAGE` 中指定的任何其他随机文本）。如果仍然无法找到匹配项，`bindtextdomain`\
  \ 将查看 `/usr/share/locale/locale.alias` 文件，寻找与 `LANGUAGE` 中的值匹配的别名（在我的系统中，french\
  \ 是 `fr_FR.ISO-8859-1` 的别名）。这种算法允许用户对想要使用的消息目录描述得相当模糊，并且在没有当前区域精确匹配项的情况下，仍然获得一个与他们母语接近的目录。\n\
  \n### 将 gettext 集成到 Autotools\n\n到本章为止，我一直通过直接从命令行使用 `gcc` 来构建如 `gt` 这样的小工具和程序。现在是时候将\
  \ `gt` 转换为 Autotools 项目了，这样我们按照 GNU 项目推荐的方式添加原生语言支持（NLS）功能。这种路线实际上是最好的，因为它允许翻译者们——那些喜欢做这类事情并且喜欢你的程序的人——更方便地为他们的语言添加消息目录。\n\
  \n本节信息大部分来自《GNU gettext Manual》的第 13 节“维护者的视角”^(4)`gettext` 手册相对于 Autotools 甚至 `gettext`\
  \ 软件包本身有些过时，但它组织良好，并且对国际化和本地化主题非常详细。事实上，它是如此完整，以至于在你没有基础知识的情况下很难理解它。本章的目标是为你提供研究\
  \ `gettext` 手册所需的背景。事实上，本章只是简单介绍了手册涵盖的许多主题。\n\n让我们将 `gt.c` 移动到项目的 `src` 目录，并创建 `configure.ac`、`Makefile.am`\
  \ 和 GNU 指定的文件。假设你在原始 `gt.c` 创建的目录下，执行以下操作：\n\n12.0\n\n```\n$ mkdir -p gettext/src\n\
  $ mv gt.c gettext/src\n$ cd gettext\n$ autoscan\n$ mv configure.ac\n$ touch README\
  \ AUTHORS ChangeLog\n```\n\n`Makefile.am` 文件应该像列表 12-1 所示的那样：\n\n```\nbin_PROGRAMS\
  \ = src/gt\nsrc_gt_SOURCES = src/gt.c\nsrc_gt_CPPFLAGS = -DLOCALE_DIR=\"$(datadir)/locale\"\
  \n```\n*列表 12-1:* Makefile.am: Automake 的输入内容\n\n我添加了特定目标的 `CPPFLAGS` 以允许我在命令行上传递\
  \ `LOCALE_DIR`。我们还应该编辑 `src/gt.c` 文件并添加 `config.h` 头文件，以便我们可以使用我们在列表 12-2 中定义的 `LOCALE_DIR`\
  \ 变量。你也可以移除 `TEST_L10` 技巧；我们不再需要它，因为我们可以使用本地安装来测试 Autotools 构建的 `gt`。\n\n```c\n\
  #include \"config.h\"\n#include <stdio.h>\n#include <locale.h>\n#include <libintl.h>\n\
  \n#ifndef LOCALE_DIR\n#define LOCALE_DIR \"/usr/local/share/locale\"\n#endif\n\n\
  #define _(x) gettext(x)\n\n--snip--\n```\n*列表 12-2:* src/gt.c: 配置 LOCALE_DIR 的更改\n\
  \n现在编辑新的 `configure.ac` 文件并进行列表 12-3 所示的更改。\n\n```aut\n#                       \
  \        -*- Autoconf -*-\n# 使用 autoconf 处理此文件以生成 configure 脚本。\nAC_PREREQ([2.69])\n\
  AC_INIT([gt], [1.0], [gt-bugs@example.org])\nAM_INIT_AUTOMAKE([subdir-objects])\n\
  AC_CONFIG_SRCDIR([src/gt.c])\nAC_CONFIG_HEADERS([config.h])\nAC_CONFIG_MACRO_DIRS([m4])\n\
  # 检查程序\nAC_PROG_CC\n# 检查库\n# 检查头文件\nAC_CHECK_HEADERS([locale.h])\n# 检查类型定义、结构和编译器特性\n\
  # 检查库函数\nAC_CHECK_FUNCS([setlocale])\nAC_CONFIG_FILES([Makefile])\nAC_OUTPUT\n```\n\
  *列表 12-3:* configure.ac: autoscan 生成文件的必要更改\n\n注意，在列表 12-3 的 `AC_CHECK_HEADERS`\
  \ 行中移除了一些头文件引用。\n\n此时，你应该能够执行 `autoreconf -i`，然后运行 `configure` 和 `make` 来构建 `gt`：\n\
  \n```bash\n$ mkdir m4\n$ autoreconf -i\nconfigure.ac:12: installing './compile'\n\
  configure.ac:6: installing './install-sh'\nconfigure.ac:6: installing './missing'\n\
  Makefile.am:6: installing './INSTALL'\nMakefile.am:6: installing './COPYING' using\
  \ GNU Public License v3 file\nMakefile.am:     Consider 将 COPYING 文件添加到版本控制系统中\n\
  Makefile.am:6: installing './depcomp'\n$ ./configure && make\n\n--snip--\n\nconfigure:\
  \ creating ./config.status\nconfig.status: creating Makefile\nconfig.status: creating\
  \ config.h\nconfig.status: config.h is unchanged\nconfig.status: executing depfiles\
  \ commands\nmake  all-am\nmake[1]: Entering directory '/.../gettext'\ndepbase=`echo\
  \ src/gt.o | sed 's|[^/]*$|.deps/&|;s|\\.o||||`;\ngcc -DHAVE_CONFIG_H -I.      -g\
  \ -O2 -MT src/gt.o -MD -MP -MF $depbase.Tpo -c -o src/gt.o src/gt.c &&\\\nmv -f\
  \ $depbase.Tpo $depbase.Po\ngcc  -g -O2   -o src/gt src/gt.o\nmake[1]: Leaving directory\
  \ '/.../gettext'\n$\n```\n\n**注意**\n\n*我在运行 `autoreconf` 之前创建了 `m4` 目录，是因为当它在 `configure.ac`\
  \ 中发现 `AC_CONFIG_MACRO_DIRS` 时，`autoreconf` 会抱怨缺少 `m4`。它仍然可以工作，但会警告你目录缺失。提前创建它可以减少噪音。*\n\
  \n\n\n\n\n使用 `gettext` 增强现有 Autotools 项目的 NLS（本地化支持）支持，第一步是向项目中添加一系列 `gettext` 特定的文件。这实际上相当繁琐，因此\
  \ `gettext` 的人员创建了一个名为 `gettextize` 的小实用工具，它的工作效果非常好。当你运行 `gettextize` 时，它会进行少量的分析，将一组文件转到项目的\
  \ `po` 目录中（如果该目录不存在则会创建一个），然后在控制台上显示一个包含六或七个步骤的操作说明。为了确保你没有忽略这些输出，它会一直等待直到你按下回车键才结束程序，在此过程中它向你获得了一个承诺，即你会阅读并执行这些步骤。遗憾的是，这些指令有些过时了——并不是所有步骤都是必须的，如果你使用的是完整的\
  \ Autotools 工具链，其中某些步骤并不适用。与许多与 Autotools 集成的程序一样，`gettext` 的设计目标是既适用于仅单独使用 Autoconf\
  \ 的包，也适用于使用完整 Autotools 工具链的程序。我将在后续过程中解释哪些是重要的。\n\n让我们从在我们的 gt 项目目录上运行 `gettextize`\
  \ 开始：\n\nGit tag 12.1\n\n```\n $ gettextize\n\n➊ Creating po/ subdirectory\n\n \
  \  Copying file ABOUT-NLS\n\n   Copying file config.rpath\n\n   Not copying intl/\
  \ directory.\n\n   Copying file po/Makefile.in.in\n\n   Copying file po/Makevars.template\n\
  \n   Copying file po/Rules-quot\n\n   Copying file po/boldquot.sed\n\n   Copying\
  \ file po/en@boldquot.header\n\n   Copying file po/en@quot.header\n\n   Copying\
  \ file po/insert-header.sin\n\n   Copying file po/quot.sed\n\n   Copying file po/remove-potcdate.sin\n\
  \n   Creating initial po/POTFILES.in\n\n   Creating po/ChangeLog\n\n   Copying file\
  \ m4/gettext.m4\n\n   Copying file m4/iconv.m4\n\n   Copying file m4/lib-ld.m4\n\
  \n   Copying file m4/lib-link.m4\n\n   Copying file m4/lib-prefix.m4\n\n   Copying\
  \ file m4/nls.m4\n\n   Copying file m4/po.m4\n\n   Copying file m4/progtest.m4\n\
  \n➋ Updating Makefile.am (backup is in Makefile.am~)\n\n   Updating configure.ac\
