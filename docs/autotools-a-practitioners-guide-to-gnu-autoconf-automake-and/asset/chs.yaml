  \ *xflaim 项目 util 目录的 Automake 输入文件*\n\n（注：由于原文文本在 Listing 14-15 处存在严重的字符重复和乱码，作为高级文档工程师，我识别出其逻辑错误。在翻译时，我保持了其结构，但仅对可读部分进行了逻辑化处理。）\n\
  \n\n\n最近，一些发行版厂商决定在他们的平台上利用这一特性是值得的。问题是，`Libtool` 的 TD（直接依赖）管理削减了使用 `ld`s（以及系统加载器）内部\
  \ TD 管理的感知优势——换句话说，它起到了阻碍作用。为了解决这个问题，这些厂商决定在他们的平台上发布一个修改过的 `Libtool` 版本，其中其 TD 管理功能被实际上禁用了。结果是，你现在必须在链接器（`libtool`）命令行上指定所有直接和间接库，或者修改你的构建系统以使用不可移植的本地\
  \ TD 管理链接器选项。\n\n由于原生 TD 管理在所有平台上都不受支持，而 `Libtool` 基于文本文件的方法是完全可移植的，因此在没有原生 TD 管理系统的系统上链接程序和库时，如果需要间接依赖，我们通常非常依赖\
  \ `Libtool` 来处理这些事务。当你使用一个“被发行版阉割过”的 `Libtool` 包来构建旨在利用 `Libtool` TD 管理特性的项目时，你的构建会在链接阶段直接因“missing\
  \ DSO”（缺少动态共享对象）消息而失败。^(28)\n\n`configure.ac` 中的 `sed` 命令在 `libtool` 脚本中搜索文本 `link_all_deplibs=no`\
  \ 并将其替换为 `link_all_deplibs=yes`。它出现了两次，`sed` 命令会替换这两个处。`AC_OUTPUT` 执行 `config.status`，它会在项目目录中生成\
  \ `libtool` 脚本，因此 `sed` 命令必须紧随 `AC_OUTPUT` 之后才能生效。\n\n**注意**\n\n使用这个 `sed` 命令并没有害，即使在没有出现该问题的系统上也是如此——`sed`\
  \ 只会在你的 `libtool` 脚本中找不到任何需要替换的内容。但请注意，如果你的包被使用内部 TD 管理的 Linux 发行版选中用于分发，他们可能会以“补丁掉”这类命令的方式分发你的包。\n\
  \n当然，另一种选择是完全放弃使用自动传递依赖管理，只需在构建每个程序或库时，直接在链接器命令行上指定你明知将需要的所有链接依赖即可。`Pkg-config`\
  \ 实际上已经在为你做了这些工作，所以如果你可以依赖 `pkg-config` 来处理所有的库管理需求，那么你的项目就不会受到此问题的影响。这可以在 `flaim`、`xflaim`\
  \ 和 `flaimsql` 项目中手动完成，通过将 `$(FTK_LTLIB)` 添加到 `LDADD` 变量中，例如列表 14-15 中的 ➊ 所示。\n\n\
  你可以尝试注释掉 `configure.ac` 中的 `sed` 命令然后重新构建项目。假设你正在一个 `Libtool` 已被修改的平台上构建，你的构建将在\
  \ `flaim` 和 `xflaim` 项目尝试仅链接到 `libflaim.la` 和 `libxflaim.la` 的实用程序时失败。要让它恢复工作，请像我之前提到的那样更新你的\
  \ `LDADD` 变量。\n\n### 标记目标 (Stamp Targets)\n\n在创建这个 Makefile 时，我遇到了另一个未预料到的小问题。至少有一个单元测试似乎要求执行测试的目录中存在某些\
  \ XML 数据文件。测试失败了，当我深入研究时，我发现它是在尝试打开这些文件时失败的。环顾四周后，我发现了 `xflaim/util/xmldata` 目录，其中包含几十个\
  \ XML 文件。\n\n我需要在运行单元测试之前，将这些文件复制到构建层次结构的 `xflaim/util` 目录。我知道前缀为 `check` 的产品会在执行\
  \ `TESTS` 之前构建，因此我想我可以在 ➋ 处的 `check_DATA PLV` 中列出这些文件。`check_DATA` 变量引用一个名为 `copy-xml-files.stamp`\
  \ 的文件，这是一个特殊类型的文件目标，称为 `stamp` target（标记目标）。它的作用是将一组未指定的文件或非基于文件的操作替换为一个单一的代表性文件。这个标记文件用于指示构建系统所有\
  \ XML 数据文件都已复制到 `util` 目录。`Automake` 经常在它生成的规则中使用标记文件。\n\n在 ➍ 处生成标记文件的规则还将 XML 数据文件复制到测试执行目录。`echo`\
  \ 语句简单地创建一个名为 `copy-xml-files.stamp` 的文件，其中包含一个单词：`Timestamp`。该文件可以包含任何内容（或者完全为空）。这里的关键点是该文件存在，并且与之关联的时间和日期。`make`\
  \ 工具使用这些信息来确定是否需要执行复制操作。在这种情况下，由于 `copy-xml-files.stamp` 没有依赖项，它的存在就向 `make` 表明操作已经完成。删除标记文件可以使\
  \ `make` 在下一次构建时执行复制操作。\n\n这是真正的基于文件的规则和伪目标（phony target）之间的一种混合体。伪目标总是执行的——它们不是真实的文件，因此\
  \ `make` 无法根据文件属性来判断是否应该执行相关操作。基于文件的规则的时间戳可以与其依赖列表进行比较，以确定它们是否应该重新执行。像这样的标记规则只有在标记文件缺失时才会执行，因为没有依赖项可以与目标的时间进行对比。^(29)\n\
