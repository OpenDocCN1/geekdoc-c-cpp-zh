  \n### 休息一下\n\n\n\n\n到目前为止，我已经向你展示了一个近乎完整的构建系统，它包含了 `GCS` 中列出的几乎所有功能。Jupiter 构建系统的这些功能都相当独立，且相对容易理解。手动实现最困难的功能是配置脚本。事实上，手动编写配置脚本的工作量，与使用\
  \ `Autoconf` 的简单性相比是如此耗费人力的，以至于我在 第 3 章 中完全跳过了手动硬编码的版本。\n\n尽管像我在这里这样使用 `Autoconf`\
  \ 非常简单，但大多数人并不会按照我向你展示的方式来创建构建系统。相反，他们尝试复制另一个项目的构建系统并对其进行微调，使其在自己的项目运行运行。稍后，当他们开始一个新项目时，他们会再次这样做。这可能会导致麻烦，因为他们复制的代码并不是为了他们现在正在尝试使用的方式而设计的。\n\
  \n我见过一些项目，其 `configure.ac` 文件包含了与其所属项目无关的垃圾信息。这些遗留部分来自某些遗留项目，但维护者对 `Autoconf` 的了解不足，无法正确移除所有多余文本。使用\
  \ `Autotools` 时，通常最好是从小开始并添加你需要的内容，而不是从另一个功能完整的构建系统的 `configure.ac` 开始，然后尝试将其精简到合适大小或通过其他方式修改以适应新项目。\n\
  \n我确定你觉得还有很多关于 `Autoconf` 的东西要学，你是正确的。我们本章的剩余部分将检查最重要的 `Autoconf` 宏，以及它们在 Jupiter\
  \ 项目背景下是如何使用的。但在那之前，让我们回头来看，是否可以使用 `Autoconf` 软件包附带的另一个工具来进一步简化 `Autoconf` 的启动过程。\n\
  \n### 使用 autoscan 进行更快速的启动\n\n创建一个（在大部分）完整的 `configure.ac` 文件最简单的方法是运行 `autoscan`\
  \ 工具，它是 `Autoconf` 软件包的一部分。该工具会检查项目目录的内容，并利用现有的 `makefiles` 和源文件生成 `configure.ac`\
  \ 文件的基础（`autoscan` 将其命名为 `configure.scan`）。\n\n让我们看看 `autoscan` 在 Jupiter 项目上的表现如何。首先，我将清理之前实验留下的产物，然后在\
  \ `jupiter` 目录下运行 `autoscan`。\n\n**注意**\n\n如果你正在使用随书的 git 仓库，可以简单地运行 `git clean\
  \ -df` 来删除所有当前未受 git 控制的文件和目录。如果你仍在构建目录，别忘记切换回父目录。\n\n请注意，我*并没有*删除我原始的 `configure.ac`\
  \ 文件——我只是让 `autoscan` 告诉我如何改进它。在不到一秒的时间，我在顶层目录下有了几个新文件：\n\n```\n $ cd ..\n\n   $\
  \ git clean -df\n\n   $ autoscan\n\n➊ configure.ac: warning: missing AC_CHECK_HEADERS([stdlib.h])\
  \ wanted by:\n\n     src/main.c:2\n\n   configure.ac: warning: missing AC_PREREQ\
  \ wanted by: autoscan\n\n   configure.ac: warning: missing AC_PROG_CC wanted by:\
  \ src/main.c\n\n   configure.ac: warning: missing AC_PROG_INSTALL wanted by: Makefile.in:18\n\
  \n   $\n\n   $ ls -1p\n   autom4te.cache/\n   autoscan.log\n\n   configure.ac\n\n\
  \   configure.scan\n\n   Makefile.in\n   src/\n\n   $\n```\n\n`autoscan` 工具检查项目目录层次结构并创建两个名为\
  \ `configure.scan` 和 `autoscan.log` 的文件。项目可能已经或尚未为 `Autotools` 准备好仪器——这并不重要，因为 `autoscan`\
  \ 显然是非破坏性的。它永远不会更改项目中的任何现有文件。\n\n`autoscan` 工具会为其在现有的 `configure.ac` 文件中发现的每个问题生成警告消息。在这个例中，`autoscan`\
  \ 注意到 `configure.ac` 应该使用 `Autoconf` 提供的 `AC_CHECK_HEADERS`、`AC_PREREQ`、`AC_PROG_CC`\
  \ 和 `AC_PROG_INSTALL` 宏。它是根据从现有的 `Makefile.in` 模板和 C 语言源文件中收集的信息做出的这些假设，正如你从 ➊ 开始的警告语句后的注释中所看到的。你可以随时通过通过检查\
  \ `autoscan.log` 文件来查看这些消息（甚至有更详细的信息）。\n\n**注意**\n\n你从 `autoscan` 收到的通知以及你的 `configure.ac`\
  \ 文件的内容可能与我的略有不同，取决于你安装的 `Autoconf` 版本。我在系统上安装了 2.69 版本的 `GNU Autoconf`（截至本文时的最新版本）。如果你的\
  \ `autoscan` 版本较旧（或更新），可能会看到一些细微差异。\n\n查看生成的 `configure.scan` 文件，我注意到 `autoscan`\
  \ 向此文件中添加的文本比我原始的 `configure.ac` 文件多。在检查它以确保我理解一切后，我发现对我来说最简单的方法是用 `configure.scan`\
  \ 覆盖 `configure.ac`，然后更改针对 Jupiter 的特定的几处信息：\n\n```\n$ mv configure.scan configure.ac\n\
  \n$ cat configure.ac\n\n#                               -*- Autoconf -*-\n\n# Process\
  \ this file with autoconf to produce a configure script.\n\nAC_PREREQ([2.69])\n\n\
  AC_INIT([Jupiter], [1.0], [jupiter-bugs@example.org])\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \nAC_CONFIG_HEADERS([config.h])\n\n# Checks for programs.\nAC_PROG_CC\n\nAC_PROG_INSTALL\n\
  \n# Checks for libraries.\nAC_CHECK_HEADERS([stdlib.h])\n\n# Checks for typedefs,\
  \ structures, and compiler characteristics.\n# Checks for library functions.\nAC_CONFIG_FILES([Makefile\
  \ src])\n\nAC_OUTPUT\n\n$\n```\n\n我的第一个修改涉及更改 `AC_INIT` 宏的参数，如 示例 4-11 所示。\n\nGit\
  \ tag 4.4\n\n```\n#                               -*- Autoconf -*-\n\n# Process\
  \ this file with autoconf to produce a configure script.\n\nAC_PREREQ([2.69])\n\n\
  AC_INIT([Jupiter], [1.0], [jupiter-bugs@example.org])\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \nAC_CONFIG_HEADERS([config.h])\n\n--snip--\n```\n\n*示例 4-11:* configure.ac: *调整\
  \ autoscan 生成的 AC_INIT 宏*\n\n`autoscan` 工具为你完成了大量工作。《GNU Autoconf 手册》^12) 指出你应该修改此文件以满足你的项目需求，但只有几个问题需要担心（除了与\
  \ `AC_INIT` 相关的问题）。我将逐一介绍这些问题，但首先，让我们处理一些管理细节。\n\n在讨论 `autoscan` 时，如果不提到 `autoupdate`\
  \ 就是我的过。如果你已经有一个工作良好的 `configure.ac` 文件，并且更新到了更高版本的 `Autoconf`，你可以运行 `autoupdate`\
  \ 以根据自旧版本以来更改或添加的构造更新你的现有文件。\n\n#### *经典的 bootstrap.sh 脚本*\n\n在 `autoreconf` 出现之前，维护者会传递一个短\
  \ shell 脚本，通常命名为 `autogen.sh` 或 `bootstrap.sh`，它会按顺序运行项目所需的所有 Autotools。该脚本的推荐名称是\
  \ `bootstrap.sh`，因为 Autogen 是另一个 GNU 项目的名字。“bootstrap.sh` 脚本可以非常复杂，但为了解决缺少 `install-sh`\
  \ 脚本的问题（见下文“Autoconf 中缺少的文件”），我只需在项目根目录下添加一个简单的 `bootstrap.sh` 脚本，如 示例 4-12 所示。\n\
  \nGit tag 4.5\n\n```\n #!/bin/sh\n\n   autoreconf --install\n\n➊ automake --add-missing\
  \ --copy >/dev/null 2>&1\n```\n\n*示例 4-12:* bootstrap.sh: *执行所需的 Autotools 的脚本*\n\
  \n\n\n\n`Automake --add-missing` 选项会将所需的缺失实用脚本复制到项目中，而 `--copy` 选项表示应进行真正的复制（否则，将创建指向\
  \ Automake 软件包安装时所在文件位置的符号链接）。\n\n**注意**\n\n*我们不需要看到执行 `automake` 时产生的警告，因此在为此脚本的第\
  \ ➊ 处的 `automake` 命令行中，我将 `stderr` 和 `stdout` 流重定向到了 `/dev/null`。在第 6 章中，我们将移除 `bootstrap.sh`\
  \ 并直接运行 `autoreconf --install`，但目前，这解决了我们的文件缺失问题。*\n\n# AUTOCONF 中缺失的必要文件\n\n当我第一次尝试对列表\
  \ 4-11 中的 `configure.ac` 文件执行 `autoreconf` 时，我发现了一个与在*不使用* Automake 的情况下使用 Autoconf\
  \ 相关的小问题。当我运行 `configure` 脚本时，它失败并报错：`configure: error: cannot find install-sh,\
  \ install.sh, or shtool in \".\" \"./..\" \"./../..\"`。\n\nAutoconf 的核心是可移植性，不幸的是，Unix\
  \ 安装工具的移植性并不尽如理想。从一个平台到另一个平台，安装功能的关键部分存在细微差异，这会导致问题，因此 Autotools 提供了一个名为 `install-sh`\
  \ 的 shell 脚本（弃用名称：`install.sh`）。该脚本作为系统自带安装工具的封装，掩盖了不同版本 `install` 之间的重要差异。\n\n\
  `autoscan` 注意到我在 `src/Makefile.in` 模板中使用了 `install` 程序，因此它生成了 `AC_PROG_INSTALL`\
  \ 宏的展开。但问题是，`configure` 无法在我的项目任何地方找到 `install-sh` 封装脚本。\n\n我推断缺失的文件是 Autoconf 软件包的一部分，只需要安装即可。我也知道\
  \ `autoreconf` 接受一个命令行选项，可以将此类缺失文件安装到项目目录。`autoreconf` 支持的 `--install (-i)` 选项旨在将工具特定的选项传递给它所调用的每个工具，以便安装缺失文件。然而，当我尝试这样做时，发现文件仍然缺失，因为\
  \ `autoconf` 不支持安装缺失文件的选项。\n\n我本可以从 Automake 安装目录手动拷贝 `install-sh`（通常为 `*/usr/(local/)share/automake-*`），但为了寻找更自动的解决方案，我尝试手动执行\
  \ `automake --add-missing --copy`。该命令生成了一系列警告，表明项目未针对 Automake 配置。然而，我现在可以看到 `install-sh`\
  \ 已被复制到我的项目根目录下，这正是我想要的。执行 `autoreconf --install` 并没有运行 `automake`，因为 `configure.ac`\
  \ 尚未针对 Automake 配置。\n\nAutoconf 应该带上 `install-sh`，因为它提供了一个需要它的宏，但这样 `autoconf` 就必须提供一个\
  \ `--add-missing` 命令行选项。尽管如此，这个问题实际上有一个非常显而见的解决方案。`install-sh` 并不是 Autoconf 生成的任何代码真正需要的。这怎么可能呢？Autoconf\
  \ 不生成任何 Makefile 结构——它只是将变量替换到你的 `Makefile.in` 模板中。因此，Autoconf 真的没有理由抱怨缺少 `install-sh`\
  \ 脚本。\n\n## 更新 Makefile.in\n\n让 `bootstrap.sh` 具有执行权限，然后执行它并看看结果是什么：\n\n```\n $\
  \ chmod +x bootstrap.sh\n\n   $ ./bootstrap.sh\n\n   $ ls -1p\n\n   autom4te.cache/\n\
  \n   bootstrap.sh\n\n➊ config.h.in\n\n   configure\n\n   configure.ac\n\n➋ install-sh\n\
  \n   Makefile.in\n\n   src/\n\n   $\n```\n\n我们从 ➊ 处的文件列表知道 `config.h.in` 已经创建，所以我们知道\
  \ `autoreconf` 执行了 `autoheader`。我们还在 ➋ 处看到了新的 `install-sh` 脚本，它是我们在 `bootstrap.sh`\
  \ 中执行 `automake` 时生成的。Autotools 提供的或生成的任何内容都应该复制到存档目录，以便与发布 tarball 包一起发布。因此，将在顶层\
  \ `Makefile.in` 模板的 `$(distdir)` 目标中为这两个文件添加 `cp` 命令。注意，我们不需要复制 `bootstrap.sh` 脚本，因为纯粹是一个维护者工具——用户永远不需要从\
  \ tarball 分发包中执行它。\n\n列表 4-13 展示了顶层 `Makefile.in` 模板中 `$(distdir)` 目标所需的更改。\n\n\
  Git tag 4.6\n\n```\n--snip--\n\n$(distdir): FORCE\n\n        mkdir -p $(distdir)/src\n\
  \n        cp $(srcdir)/configure.ac $(distdir)\n\n        cp $(srcdir)/configure\
  \ $(distdir)\n\n        cp $(srcdir)/config.h.in $(distdir)\n\n        cp $(srcdir)/install-sh\
  \ $(distdir)\n\n        cp $(srcdir)/Makefile.in $(distdir)\n\n        cp $(srcdir)/src/Makefile.in\
  \ $(distdir)/src\n\n        cp $(srcdir)/src/main.c $(distdir)/src\n\n--snip--\n\
  ```\n\n*列表 4-13:* `Makefile.in*: *分发存档所需的 Makefile.in*\n\n如果你开始认为这可能变成一个维护问题，那么你是正确的，`$(distdir)`\
  \ 目标很痛苦。幸运的是，`distcheck` 目标仍然存在——在选择包名和版本字符串时记住这一点。当我们在第 6 章讨论 Automake 时，我们将澄清其中的许多问题。\n\
  \n### 初始化与包信息\n\n现在让我们重新转回列表 4-11 中 `configure.ac` 文件的内容。第一部分包含 Autoconf 初始化宏。这些对于所有项目都是必须。让我们逐个考虑这些宏，因为它们都很重要。\n\
  \n### AC_PREREQ\n\n`AC_PREREQ` 宏简单定义了处理此 `configure.ac` 的早期 Autoconf 版本：\n\n```\n\
  AC_PREREQ(version)\n```\n\n*GNU Autoconf 手册*指出，`AC_PREREQ` 是可以在 `AC_INIT` 之前使用的宏。这是因为在使用任何其他宏之前确保使用足够新版本的\
  \ Autoconf 是好的。\n\n### AC_INIT\n\n`AC_INIT` 宏正如其名，初始化 Autoconf 系统。这里是它的原型，如 *GNU\
  \ Autoconf 手册*所示：^14\n\n```\nAC_INIT(package, version, [bug-report], [tarname],\
  \ [url])\n```\n\n它接受多五个参数（autoscan 只生成前三个参数）：*package*、*version*，以及可选的 *bug-report*、*tarname*\
  \ 和 *url*。*package* 参数旨在作为包名。当你执行 `make dist` 时，它将（以规范形式）作为 Automake 生成的发布发行 tarball\
  \ 名称的第一部分。\n\n**注意**\n\n*Autoconf 在 tarball 名称中使用包名的规范化形式，因此如果你愿意，可以在包名中使用大写字母。Automake\
  \ 生成的 tarball 默认命名为 tarname-version.tar.gz，但 *tarname* 被设置为 *package* 名称的规范化形式（小写，所有标点符号均转换为下划线）。在选择包名和版本字符串时记住这一点。*\n\
  \n可选的 `bug-report` 参数通常设置为电子邮件地址，但任何文本字符串都是有效的——接受项目错误报告的网页 URL 是一个常见的替代方案。为此创建了一个名为\
  \ `@PACKAGE_BUGREPORT@` 的 Autoconf 变量，该变量也被添加到 `config.h.in` 模板中作为 C 预处理器定义。这里的意图是你在代码中使用该变量，在适当的地方——可能当用户从应用程序请求帮助或版本信息时——展示错误报告的电子邮件地址或\
  \ URL。\n\n\n\n\n虽然 `version` 参数可以是你喜欢的任何内容，但有几个常用的 OSS（开源软件）惯例可以让你的工作变得简单一些。最常用的惯例是传递\
  \ `major.minor`（例如 1.2）。然而，并没有规定你不能使用 `major.minor.revision`，而且这种方法也没有错。生成的任何 `VERSION`\
  \ 变量（Autoconf、shell 或 make 的）都不会在任何地方被解析或分析——它们仅被用作各种位置替换文本的占位符。因此，如果你愿意，你甚至可以在此宏中添加非数字文本，例如\
  \ `0.15.alpha1`，这在有时是有用的。\n\n**注意**\n\n另一方面，`RPM` 包管理器确实会在乎你在版本字符串中放入了什么。出于 `RPM`\
  \ 的考虑，你可能希望将版本字符串文本限制为字母、数字和点——不要有连字符或下划线。\n\n可选的 `url` 参数应该是你的项目网站的 URL。它会显示在 `configure\
  \ --help` 输出的帮助文本。\n\nAutoconf 会根据 `AC_INIT` 的参数生成替换变量 `@PACKAGE_NAME@`、`@PACKAGE_VERSION@`、`@PACKAGE_TARNAME@`、`@PACKAGE_STRING@`（包名和版本信息的格式化拼接）、`@PACKAGE_BUGREPORT@`\
  \ 和 `@PACKAGE_URL@`。你可以在 `Makefile.in` 模板文件中使用其中任何一个或全部变量。\n\n### AC_CONFIG_SRCDIR\n\
  \n`AC_CONFIG_SRCDIR` 宏是一个健全性检查。它的目的是确保生成的 `configure` 脚本知道它正在执行的目录实际上是项目目录。\n\n\
  具体来说，`configure` 需要能够定位自己，因为它生成了会执行自身的代码，并且可能从远程目录执行。有无数种方法可以无意中欺骗 `configure` 让其找到另一个\
  \ `configure` 脚本。例如，用户可能会不小心给 `configure` 提供一个错误的 `--srcdir` 参数。`$0` shell 脚本参数最好也是不可靠的——它可能包含\
  \ shell 的名称而不是脚本名称，或者可能是 `configure` 在系统搜索路径中找到的，因此命令行上没有指定路径信息。\n\n`configure`\
  \ 脚本可能会尝试在当前目录或父目录中查找，但它仍然需要一种方法来验证它找到的 `configure` 脚本确实是自己。因此，`AC_CONFIG_SRCDIR`\
  \ 为 `configure` 提供了一个重要的提示，告诉它正在正确的地方。以下是 `AC_CONFIG_SRCDIR` 的原型：\n\n```\nAC_CONFIG_SRCDIR(unique-file-in-source-dir)\n\
  ```\n\n该参数可以是一个路径（相对于项目的 `configure` 脚本），指向任何你喜欢的源文件。你应该选择一个对你的项目是唯一的的文件，以尽可能地减少\
  \ `configure` 被误骗认为某个其他项目的配置文件是它自身的可能性。我通常尝试选择一个某种程度上代表项目的文件，例如以定义项目的功能命名的源文件。这样，万一我以后决定重组源代码，就不可能在重命名文件时丢失它。然而，在这种情况下，我们只有一个源文件\
  \ `main.c`，这使得遵循这一惯例有些困难。无论如何，如果 `autoconf` 和 `configure` 找不到该文件，它们都会通知和你。\n\n###\
  \ 实例化宏 (Instantiating Macros)\n\n在我们深入研究 `AC_CONFIG_HEADERS` 的细节之前，我想花一点时间介绍 Autoconf\
  \ 提供的文件生成框架。从高层角度来看，`configure.ac` 中发生了四件大事：\n\n* 初始化\n* 检查请求处理\n* 文件实例化请求处理\n*\
  \ `configure` 脚本的生成\n\n我们已经涵盖了初始化——这并没有什么复杂的，尽管还有几个你应该注意的宏。请查阅《GNU Autoconf Manual》以获取更多信息——例如查找\
  \ `AC_COPYRIGHT`。现在，让我们进入文件实例化部分。\n\n实际上，有四个所谓的“实例化宏”：`AC_CONFIG_FILES`、`AC_CONFIG_HEADERS`、`AC_CONFIG_COMMANDS`\
  \ 和 `AC_CONFIG_LINKS`。实例化宏接受一个标签或文件列表；`configure` 将从包含 Autoconf 替换变量的模板生成这些文件。\n\
  \n**注意**\n\n你可能需要在你的 `configure.scan` 版本中，将 `AC_CONFIG_HEADER`（单数）的名称更改为 `AC_CONFIG_HEADERS`（复数）。单数版本是该宏的旧名称，且旧宏的功能不如新宏。\n\
  \n这四个实例化宏具有一个有趣的共同签名。以下原型可以用于表示它们中的每一个，只需用适当的文本替换宏名中的 `XXX` 部分即可：\n\n```\nAC_CONFIG_XXXS(tag...,\
  \ [commands], [init-cmds])\n```\n\n对于这四个宏中的每一个，tag 参数 参数的形式为 `OUT`[:`INLIST]`，其中\
  \ `INLIST` 的形式为 `IN0`[:`IN1`:...:`INn]`。通常，你会看到只带一个参数对这些宏的调用，如下面的三个示例所示（注意这些示例代表的是宏的\
  \ `invocations`，而不是 `prototypes`，所以方括号实际上是 Autoconf 的引号，而不是可选参数的指示）：\n\n```\nAC_CONFIG_HEADERS([config.h])\n\
  ```\n\n在这个示例中，`config.h` 是 `OUT` 部分。`INLIST` 的默认值是 `OUT` 部分加上 `.in`。因此，换句话说，前面的调用等同于：\n\
  \n```\nAC_CONFIG_HEADERS([config.h:config.h.in])\n```\n\n这意味着 `config.status` 包含了从\
  \ `config.h.in` 生成 `config.h` 并替换所有 Autoconf 变量的代码。你可以在 `INLIST` 部分提供一组输入文件。在这种情况下，`INLIST`\
  \ 中的文件将被连接形成生成的 `OUT` 文件：\n\n```\nAC_CONFIG_HEADERS([config.h:cfg0:cfg1:cfg2])\n\
  ```\n\n在这里，config.status 将通过连接 `cfg0`、`cfg1` 和 `cfg2`（按此顺序），在替换所有 Autoconf 变量后生成\
  \ `config.h`。GNU Autoconf Manual 将整个 `OUT`[:`INLIST]` 结构称为 `tag`。为什么不直接叫它 `file`\
  \ 呢？因为此参数的主要目的是提供一种命令行目标——类似于 Makefile 目标。如果关联宏生成文件，它也可以作为文件名，如 `AC_CONFIG_HEADERS`、`AC_CONFIG_FILES`\
  \ 和 `AC_CONFIG_LINKS` 的情况。\n\n但 `AC_CONFIG_COMMANDS` 的独特之处在于它不生成任何文件。相反，它运行用户在宏参数中指定的任意\
  \ shell 代码。因此，与其根据其次要功能（生成文件）命名这个第一个参数，`GNU Autoconf Manual` 根据其主要用途更通泛地称其为命令行 `tag`——该标签可以在\
  \ `./config.status` 命令行上指定，方式如下：\n\n```\n$ ./config.status config.h\n```\n\n该命令将根据\
  \ `configure.ac` 中 `AC_CONFIG_HEADERS` 的宏调用重新生成 `config.h` 文件。它*只会*重新生成 `config.h`。\n\
  \n输入 `./config.status --help` 查看在执行 `./config.status` 时可以使用其他命令行选项：\n\n\n\n\n\n\
  ```\n $ ./config.status --help\n\n   `config.status` 根据当前配置从模板中实例化\n   文件和其他配置动作。除非文件和动作\n\
  \   被指定为 TAGs，否则默认所有内容都会被实例化。\n\n➊ 用: ./config.status [OPTION]... [TAG]...\n\n \
  \   -h, --help       打印此帮助信息并退出\n\n    -V, --version    打印版本号和配置设置，然后退出\n\n    \
  \ ➋ --config      打印配置，然后退出\n\n    -q, --quiet, --silent\n\n                   \
  \  不打印进度消息\n\n    -d, --debug      不删除临时文件\n\n        --recheck    在相同条件下通过重新配置来更新\
  \ config.status\n\n     ➌ --file=FILE[:TEMPLATE]\n\n                     实例化配置文件\
  \ FILE\n\n        --header=FILE[:TEMPLATE]\n\n                       实例化配置头文件 FILE\n\
  \n➍ 配置文件:\n\n   Makefile src/Makefile\n\n➎ 配置头文件:\n\n   config.h\n\n   向 <jupiter-bugs@example.org>\
  \ 报告错误。\n\n   $\n```\n\n注意，`config.status`提供了关于项目配置 `.status` 文件的自定义帮助信息。它列出了 ➍\
  \ 配置文件和 ➎ 配置头文件，我们可以在命令行中使用它们作为标签，正如在 ➊ 的用法中指定的 `[TAG]...` 中。在这种情况下，`config.status`\
  \ 将仅实例化指定的对象。对于命令，它将执行通过在 `AC_CONFIG_COMMANDS` 宏的关联扩展传递的标签所指定的命令集。\n\n这些宏中的每一个都可以在\
  \ `configure.ac` 文件中多次使用。结果是累积的，我们可以根据需要多次在 `configure.ac` 中使用 `AC_CONFIG_FILES`。同样重要的是，`config.status`\
  \ 支持 `--file=` 选项（见 ➌）。当你从命令行带有标签并调用 `config.status` 时，你可以使用的标签仅限于帮助文本中列出的可用配置文件、头文件、链接和命令。当你使用\
  \ `--file=` 选项执行 `config.status` 时，你是在告诉 `config.status` 生成一个尚未与 `configure.ac`\
  \ 中找到的任何实例化宏调用关联的新文件。该新文件是根据关联的模板，使用上次执行 `configure` 时确定的配置选项和检查结果生成的。例如，我可以以此方式执行\
  \ `config.status`（使用一个名为 `extra.in` 的虚拟模板）：\n\n```\n$ ./config.status --file=extra:extra.in\n\
  ```\n\n### NOTE\n\n默认模板名称是带有 `.in` 后缀的文件名，因此此调用可以在不使用选项中的 `*:extra.in` 部分的情况下完成。我在这里添加它是为了清晰起见。\n\
  \n最后，我想指出 `config.status` 的一个新功能——➋ 处的 `--config` 选项，它是随 Autoconf 2.65 版本添加的。使用此选项可以显示传递给命令行\
  \ `configure` 的显式配置选项。例如，假设我们这样调用了 `./configure`：\n\n```\n$ ./configure --prefix=$HOME\n\
  ```\n\n当你使用新的 `--config` 选项时，`./config.status` 显示如下：\n\n```\n$ ./config.status --config\n\
  \n'--prefix=/home/jcalcote'\n```\n\n### NOTE\n\n旧版本的 Autoconf 生成的 `config.status`\
  \ 脚本在使用 `--version` 选项时会显示此信息，但它是一大段文本的一部分。新的 `--config` 选项更容易找到并重用最初传递给 `configure`\
  \ 脚本的配置选项。\n\n现在让我们回到第 102 页底部的实例化宏签名上。我已经向你展示了 `tag...` 参数具有复杂的格式，但省略号表示它也代表多个由空格分隔的标签。你将在几乎所有的\
  \ `configure.ac` 文件中看到的格式如 列表 4-14 所示。\n\n```\nAC_CONFIG_FILES([Makefile\n\n   \
  \              src/Makefile\n\n                 lib/Makefile\n\n               \
  \  etc/proj.cfg])\n```\n\n*列表 4-14：在 AC_CONFIG_FILES 中指定多个标签（文件）*\n\n这里的每个项目都是一个标签规范，如果完整指定，它看起来将像\
  \ 列表 4-15 中的调用。\n\n```\nAC_CONFIG_FILES([Makefile:Makefile.in\n\n              \
  \   src/Makefile:src/Makefile.in\n\n                 lib/Makefile:lib/Makefile.in\n\
  \n                 etc/proj.cfg:etc/proj.cfg.in])\n```\n\n*列表 4-15：在 AC_CONFIG_FILES\
  \ 中完整指定多个标签*\n\n回到实例化宏的原型，有两个在这些宏中很少见使用的可选参数：`commands` 和 `init-cmds`。`commands`\
  \ 参数可能用于指定某些任意的 shell 代码，这些代码将由 `config.status` 在生成与标签关联的文件之前恰好执行。在用于生成生成的实例化宏中使用此功能是不寻常的。你几乎总是看到\
  \ `commands` 参数与 `AC_CONFIG_COMMANDS` 一起使用，因为该宏默认情况下不生成任何文件，因为如果没有要执行的命令，对该宏的调用基本上是没用的！在这种情况下，`tag`\
  \ 参数变成了一种告诉 `config .status` 执行特定一组 shell 命令的方式。\n\n`init-cmds` 参数在 `config .status`\
  \ 顶端初始化 shell 变量。\n\n\n\n\n\n*   `config.status` 脚本可能会生成与 `configure.ac` 中指定的任何标签都不关联的文件，在这种情况下，它将根据最后执行的一组检查来替换变量。\n\
  \n## 从模板生成头文件\n\n你现在可能已经得出了结论，`AC_CONFIG_HEADERS` 宏允许你指定一个或多个 `config.status` 应该从模板文件生成的头文件。配置头文件模板的格式非常特殊。列表\
  \ 4-17 提供了一个简短的示例。\n\n```\n/* 如果你有 unistd.h，则将其定义为 1。 */\n\n#undef HAVE_UNISTD_H\n\
  ```\n\n*列表 4-17：头文件模板的短示例*\n\n你可以像这样在头文件模板中放置多个语句，每行一个。当然，注释是可选的。让我们尝试另一个实验。创建一个如列表\
  \ 4-18 所示的新的 `configure.ac` 文件。同样，你应该在一个独立的目录中进行此操作。\n\n```\nAC_INIT([test], [1.0])\n\
  \nAC_CONFIG_HEADERS([config.h])\n\nAC_CHECK_HEADERS([unistd.h foobar.h])\n\nAC_OUTPUT\n\
  ```\n\n*列表 4-18：实验 #2—一个简单的 configure.ac 文件*\n\n创建一个名为 `config.h.in` 的模板头文件，其中包含列表\
  \ 4-19 中的两行内容。\n\n```\n#undef HAVE_UNISTD_H\n\n#undef HAVE_FOOBAR_H\n```\n\n*列表\
  \ 4-19：实验 #2 继续——一个简单的 config.h.in 文件*\n\n现在执行以下命令：\n\n```\n $ autoconf\n\n   $\
  \ ./configure\n\n   checking for gcc... gcc\n\n   --snip--\n\n➊ checking for unistd.h...\
  \ yes\n\n   checking for unistd.h... (cached) yes\n   checking foobar.h usability...\
  \ no\n   checking foobar.h presence... no\n\n➋ checking for foobar.h... no\n   configure:\
  \ creating ./config.status\n\n➌ config.status: creating config.h\n   $\n   $ cat\
  \ config.h\n   /* config.h.    Generated from config.h.in by configure.    */\n\
  \   #define HAVE_UNISTD_H 1\n\n➍ /* #undef HAVE_FOOBAR_H */\n   $\n```\n\n你可以从 ➌\
  \ 看到，`config.status` 根据我们写的简单 `config.h.in` 模板生成了 `config.h` 文件。该头文件的内容基于 `configure`\
  \ 执行的检查。由于由 `AC_CHECK_HEADERS([unistd.h foobar.h])` 生成的 shell 代码能够在系统包含目录中找到 `unistd.h`\
  \ 头文件（➊），因此相应的 `#undef` 语句被转换为 `#define` 语句。当然，在系统包含目录没有找到 `foobar.h` 头文件，正如你从 ➋\
  \ 处的 `./configure` 输出中也能看到的那样；因此，它的定义在模板中被留了注释，如 ➍ 所示。\n\n因此，你可能将列表 4-20 所示的类代码添加到项目适当的\
  \ C 语言源文件中。\n\n```\n#include \"config.h\"\n\n#if HAVE_UNISTD_H\n\n# include <unistd.h>\n\
  \n#endif\n\n#if HAVE_FOOBAR_H\n\n# include <foobar.h>\n\n#endif\n```\n\n*列表 4-20：在\
  \ C 语言源文件中使用生成的 CPP 定义*\n\n**注意**\n\n`unistd.h` 头文件现在已经非常标准了，因此实际上没有必要在 `AC_CONFIG_HEADERS`\
  \ 中检查它，但在此示例中，它作为一个我确定存在于我系统上的文件。\n\n## 使用 autoheader 生成包含文件模板\n\n手动维护 `config.h.in`\
  \ 模板比必要的要麻烦。`config.h.in` 的格式非常严格——例如，你不能在 `#undef` 行上有有任何开头或结尾空格，且你添加的 `#undef`\
  \ 行必须使用 `#undef` 而不是 `#define`，主要因为 `config.status` 只知道将 `#undef` 替换为 `#define`\
  \ 或注释掉包含 `#undef` 的行。\n\n你从 `config.h.in` 需要的大部分信息在 `configure.ac` 中可用。幸运的是，`autoheader`\
  \ 将根据 `configure.ac` 的内容为你生成一个格式正确的头文件模板，因此你通常不需要经常编写 `config.h.in` 模板。让我们回到命令行提示符进行最后的实验。这个很简单——只需删除实验\
  \ #2 中的 `config.h.in` 模板，然后运行 `autoheader` 接着运行 `autoconf`：\n\n```\n $ rm config.h.in\n\
  \n   $ autoheader\n\n   $ autoconf\n\n   $ ./configure\n\n   checking for gcc...\
  \ gcc\n   --snip--\n\n   checking for unistd.h... yes\n   checking for unistd.h...\
  \ (cached) yes\n   checking foobar.h usability... no\n   checking foobar.h presence...\
  \ no\n   checking for foobar.h... no\n   configure: creating ./config.status\n\n\
  \   config.status: creating config.h\n   $\n   ➊ $ cat config.h\n   /* config.h.\
  \    Generated from config.h.in by configure.    */\n   #define HAVE_UNISTD_H 1\n\
  \n   /* #undef HAVE_FOOBAR_H */\n   $\n```\n\n\n\n\n使用列表 4-21 中的 `configure.ac`\
  \ 文件，生成的 `configure` 脚本将创建一个 `config.h` 头文件，其中包含相应的定义，用于在编译时确定当前系统是否提供了 `dlfcn`\
  \ 接口。为了完成移植性检查，你可以将列表 4-22 中的代码添加到项目中使用动态加载器功能的源文件中。\n\n```\n #include \"config.h\"\
  \n\n➊ #if HAVE_DLFCN_H\n\n   # include <dlfcn.h>\n\n   #else\n\n   # error Sorry,\
  \ this code requires dlfcn.h.\n\n   #endif\n\n   --snip--\n\n➋ #if HAVE_DLFCN_H\n\
  \n       handle = dlopen(\"/usr/lib/libwhatever.so\", RTLD_NOW);\n\n   #endif\n\n\
  \   --snip--\n```\n\n*列表 4-22: 检查动态加载器功能的示例源文件*\n\n如果你已经有了包含了 `dlfcn.h` 的代码，autoscan\
  \ 会会在 `configure.ac` 中生成一行，调用 `AC_CHECK_HEADERS`，其参数列表包含 `dlfcn.h` 作为待检查的头文件之一。你作为维护者的工作是在\
  \ ➊ 和 ➋ 处将条件语句加到你的源代码中现有的 `dlfcn.h` 头文件包含处，以及对 `dlfcn` 接口函数的调用处。这是 Autoconf 移植性支持的核心。\n\
  \n**注意**\n\n如果你选择在包含检查失败时“报错（error out）”，那么在技术上你并不需要在代码周围使用预处理器条件判断，但这样做可以让读者清楚地看到源码的哪些部分受到了条件包含的影响。\n\
  \n你的项目可能倾向于使用动态加载器功能，但在必要时没有它也可以运行。也可能你的项目需要动态加载器，在这种情况下，如果缺少关键功能，你的构建过程应该带错误终止（如此代码所示）。通常情况下，这是一个可以接受的权宜之计，直到有人出现并为源码添加更特定于系统的动态加载器服务支持。\n\
  \n**注意**\n\n如果你必须通过错误退出，最好在配置时退出，而不是在编译时。通用的原则是尽早退出。\n\n如前所述，`HAVE_CONFIG_H` 是通过\
  \ Autoconf 替换变量 `@DEFS@` 传递给编译器命令行的定义字符串的一部分。在 autoheader 和 `AC_CONFIG_HEADERS`\
  \ 功能出现之前，Automake 将所有的编译器配置宏都添加到 `@DEFS@` 变量中。如果你在 `configure.ac` 中没有使用 `AC_CONFIG_HEADERS`，你仍然可以使用这种方法，但不建议这样做——主要因为大量的定义会导致非常非常长的编译器命令行。\n\
  \n### 暂时回到远程构建\n\n当我们结束本章时，你会发现我们已经绕了一了一圈。我们开始时，在讨论如何为 Jupiter 添加远程构建之前，先涵盖了一些预备信息。现在我们将暂时回到这个话题，因为我还没有介绍过如何让\
  \ C 语言预处理器正确地定位到由模板生成的 `config.h` 文件。\n\n由于该文件是从模板生成的，它在构建目录结构中的相对位置，将与其对应的模板文件\
  \ `config.h.in` 在源码目录结构中的位置相同。模板位于顶层 `source` 目录（除非你选择将其放在其他地方），因此生成的文件将位于顶层 `build`\
  \ 目录。嗯，这很简单——它始终位于生成的 `src/Makefile` 的上一级。\n\n在我们对头文件位置得出任何结论之前，让我们考虑头文件可能出现在项目的哪些位置。我们可能会在构建过程中在当前构建目录中生成它们。我们还可能将内部头文件添加到当前源码目录。我们知道顶层构建目录中有一个\
  \ `config.h` 文件。最后，我们还可能为我们的包提供的库接口头文件创建一个顶层 `include` 目录。这些不同的 `include` 目录的优先级顺序是什么？\n\
  \n我们在编译器命令行上放置 `include 指令`（`-I path` 选项）的顺序就是它们被搜索的顺序，因此该顺序应该基于哪些文件与当前正在编译的源文件相关。因此，编译器命令行应该首先包含当前构建目录（`.`）的\
  \ `-I path` 指令，接着是源码目录 `[$(srcdir)]`，然后是顶层构建目录（`..`），最后是我们项目的 `include` 目录（如果有的话）。我们通过在编译器命令行中添加\
  \ `-I path` 选项来强制这种排序，如列表 4-23 所示。\n\nGit tag 4.7\n\n```\n--snip--\n\njupiter: main.c\n\
  \n        $(CC) $(CPPFLAGS) $(CFLAGS) -I. -I$(srcdir) -I.. -o $@ \\\n\n        \
  \  $(srcdir)/main.c\n\n--snip--\n```\n\n*列表 4-23: src/Makefile.in: 添加正确的编译器包含指令*\n\
  \n现在我们知道了这一点，我们需要在第 92 页上创建的列表中为远程构建添加另一个经验之则：\n\n*   为当前构建目录、相关的源码目录添加预处理器命令。\n\
  \n### 总结\n\n在本章中，我们涵盖了功能性构建系统的大部分主要特性，包括编写 `configure.ac` 文件，通过它 Autoconf 生成 `configure`\
  \ 脚本。我们还涵盖了添加远程构建功能\n\n那么还有什么？很多！在下一章中，我将继续向你展示如何使用 Autoconf 在用户运行 make 之前测试系统功能。还将增强配置脚本，以便在我们完成后，用户将拥有更多选项并理解我们的包是如何构建的。\n\
  \n## 5 使用 Autoconf 的更多乐趣：配置用户选项\n\n希望不是确信某件事结果很好，而是确定无论结果如何某件事都是合理的。\n\n——Vclav\
  \ Havel*, 干扰\n\n![图像](img/common.jpg)\n\n在第 4 章中，我们讨论了 Autoconf 的精要——如何引导新现有项目以及如何理解\
  \ `configure.ac` 文件的一些基本方面。在本章中，我们涵盖了一些更复杂的 Autoconf 宏。我们将从讨论如何在模板文件（例如 `Makefile.in`）中替换自己的变量，以及如何在配置脚本内部定义自己的预处理器开始。在整个章节中，我们将通过添加重要的检查和测试继续开发\
  \ Jupiter 项目。我们将涵盖至关重要的 `AC_OUTPUT` 宏，并以讨论用户定义选项的应用作为结束。\n\n### 替换与定义\n\n我们将开始讨论\
  \ Autoconf 套件中最重要的三个宏：`AC_SUBST` 和 `AC_DEFINE`，以及后者的双胞胎 `AC_DEFINE_UNQUOTED`。\n\n\
  这些宏提供了配置过程与构建及执行过程之间通信的主要机制。替换到生成文件的值为构建过程提供配置信息，而预处理器变量中定义的值则在构建时为编译器以及运行时为构建的程序和库提供配置信息。因此，彻底熟悉\
  \ `AC_SUBST` 和 `AC_DEFINE` 是非常值得的。\n\n\n\n\n\n你可以使用 `AC_SUBST` 来扩展变量替换功能，该功能是 Autoconf\
  \ 中不可或缺的一部分。任何与变量替换相关的 Autoconf 宏最终都会调用此宏，从现有的 shell 变量创建替换变量。有时，shell 变量是从环境中继承的；其他情况下，高层宏在调用\
  \ `AC_SUBST` 之前会将 shell 变量作为其功能的一部分进行设置。该宏的签名非常简单（注意此原型中的方括号表示可选参数，而不是 Autoconf\
  \ 的引号）：\n\n```\nAC_SUBST(shell_var[, value])\n```\n\n**注意**\n\n如果在调用 M4 宏时选择省略任何末尾的可选参数，你也可以省略末尾的逗号。*但是，如果你省略了列表中间的任何参数，则必须提供逗号作为缺失参数的占位符。*\n\
  \n第一个参数 `shell_var` 代表一个 shell 变量，你希望将其值替换到由 `config.status` 从模板生成的所有文件中。可选的第二个参数是赋值给该变量的值。如果没有指定，将使用\
  \ shell 变量的当前值，无论它是继承的还是由之前的 shell 代码设置的。\n\n替换变量与 shell 变量同相同，但在模板文件中它会被 @ 符号（@）括起来。因此，名为\
  \ `my_var` 的 shell 变量将变成替换引用 `@my_var@`，你可以在任何模板文件中使用它。\n\n在 `configure.ac` 中对 `AC_SUBST`\
  \ 的调用不应该是有条件的；也就是说，它们不应该在条件性 shell 语句（如 if-then-else 结构）内部调用。当你仔细考虑 `AC_SUBST` 的目的时，其原因就变得清晰了：你已经已经在模板文件中硬编码了替换变量引用，因此你最好对每个变量都无条件地使用\
  \ `AC_SUBST`，否则你的输出文件将保留变量引用，而不是应该被替换的值。\n\n### AC_DEFINE\n\n`AC_DEFINE` 和 `AC_DEFINE_UNQUOTED`\
  \ 宏定义 C 预处理器宏，这些宏可以是简单宏或函数形式宏。它们要么定义在 `config.h.in` 模板中（如果你使用了 `AC_CONFIG_HEADERS`），要么在\
  \ `Makefile.in` 模板中（通过 `@DEFS@` 替换变量）传递给编译器命令行。回想一下，如果你没有自己写 `config.h.in`，autoheader\
  \ 会根据 `configure.ac` 文件对这些宏的调用写入写入。\n\n这两个宏名称实际上代表了四个不同的 Autoconf 宏。以下是它们的原型：\n\n\
  ```\nAC_DEFINE(variable, value[, description])\n\nAC_DEFINE(variable)\n\nAC_DEFINE_UNQUOTED(variable,\
  \ value[, description])\n\nAC_DEFINE_UNQUOTED(variable)\n```\n\n这些宏的普通版本和 UNQUOTED（取消引号）版本的区别在于，普通版本逐字地使用指定的值作为预处理器宏的值。而\
  \ UNQUOTED 版本会对 `value` 参数进行 shell 扩展，并使用结果作为预处理器宏的值。因此，如果该值包含你希望让 `configure` 扩展的\
  \ shell 变量，你就应该使用 `AC_DEFINE_UNQUOTED`。（在头文件中将 C 预处理器宏设置为一个未扩展的 shell 变量是没有意义的，因为\
  \ C 编译器或预处理器在编译源代码时都不知道该如何处理它。）\n\n单参数版本和多参数版本之间的区别在于预处理器宏的定义方式。单参数版本仅保证该宏在预处理器命名空间中被*定义*，而多参数版本确保该宏带有特定的值被定义。\n\
  \n可选的第三个参数 `description` 告诉 autoheader 为 `config.h.in` 模板中的该宏添加注释。（如果你不使用 autoheader，那么在这里传递描述是没有意义的——因此，它是可选的。）如果你想定义一个没有值的预处理器宏并提供\
  \ `description`，你应该使用这些宏的多参数版本，但将值参数留留。。另一个选项是使用 `AH_TEMPLATE`——这是一种 autoheader\
  \ 专用的宏——在给出了 `description` 但不需要 `value` 的情况下，它的作用与 `AC_DEFINE` 相同。\n\n### 检查编译器\n\
  \n`AC_PROG_CC` 宏确保用户的系统有一个可用的 C 语言编译器。以下是该宏的原型：\n\n```\nAC_PROG_CC([compiler-search-list])\n\
  ```\n\n如果你的代码需要特定类型或品牌的 C 编译器，可以在此参数中传递由空格分隔的程序名称列表。例如，如果你使用 `AC_PROG_CC([cc cl\
  \ gcc])`，该宏将展开为按顺序搜索 `cc`、`cl` 和 `gcc` 的 shell 代码。通常，会省略可选参数，允许宏找到用户系统上可用的最佳编译器选项。\n\
  \n你可能记得第 95 页的“使用 autoscan 更快地开始”，当 `autoscan` 注意到目录树中存在 C 源文件时，它会在 Jupiter 的 `configure.scan`\
  \ 文件中插入对此宏的无参数调用。列表 5-1 重现了生成的 `configure.scan` 文件的相关部分。\n\n```\n--snip--\n\n# Checks\
  \ for programs.\n\nAC_PROG_CC\n\nAC_PROG_INSTALL\n\n--snip--\n```\n\n*列表 5-1:* configure.scan:\
  \ *正在检查编译器和其他程序*\n\n**注意**\n\n如果 Jupiter 目录中的源文件以 `.cc`、`.cxx` 或 `.C` 结尾（都是 C++\
  \ 文件的常用扩展名），`autoscan` 将改为插入对 `AC_PROG_CXX` 的调用。\n\n`AC_PROG_CC` 宏会在系统搜索路径中查找 `gcc`，然后是\
  \ `cc`。如果找不到其中任何一个，它将查找其他编译器。当找到一个兼容的编译器时，该宏会将一个已知变量 `CC` 设置为程序的完整路径，并根据需要提供可移植性选项，除非用户已经在环境或\
  \ configure 命令行中设置了 `CC`。\n\n`AC_PROG_CC` 宏还定义了以下 Autoconf 替换变量，其中某些你可能识别出是*用户变量*（列在第\
  \ 71 页的表 3-2）：\n\n*   `@CC@`（编译器的完整路径）\n*   `@CFLAGS@`（例如，针对 `gcc` 的 `-g -O2`）\n\
  *   `@CPPFLAGS@`（默认为空）\n*   `@EXEEXT@`（例如，`*.exe*`）\n*   `@OBJEXT@`（例如，`.o`）\n\n\
  `AC_PROG_CC` 配置了这些替换变量，但如果你不在 `Makefile.in` 模板中使用它们，运行 `./configure` 就是在浪费时间。幸运的是，我们已经在\
  \ `Makefile.in` 模板中使用了它们，因为在 Jupiter 项目早期，我们把它们添加到了编译器命令行中，并为 `CFLAGS` 设置了一个默认值，允许用户在\
  \ make 命令行上覆盖它。\n\n剩下的工作是确保 `config.status` 为这些变量引用替换值。列表 5-2 显示了 `src` 目录 `Makefile.in`\
  \ 模板的相关部分以及实现这一目标所需的更改。\n\nGit tag 5.0\n\n```\n--snip--\n\n# VPATH 特定的替换变量\n\nsrcdir\
  \ = @srcdir@\n\nVPATH = @srcdir@\n\n# 工具特定的替换变量\n\nCC = @CC@\n\nCFLAGS = @CFLAGS@\n\
  \nCPPFLAGS = @CPPFLAGS@\n\nall: jupiter\n\njupiter: main.c\n\n        $(CC) $(CPPFLAGS)\
  \ $(CFLAGS) -I. -I$(srcdir) -I.. -o $@ $(srcdir)/main.c\n\n--snip--\n```\n\n*列表\
  \ 5-2:* src/Makefile.in: *使用 Autoconf 编译器和标志替换变量*\n\n\n\n\n\n紧接调用 `AC_PROG_CC` 之后（参见列表\
  \ 5-1）的是对 `AC_PROG_INSTALL` 的调用。所有的 `AC_PROG_*` 宏都会设置（然后使用 `AC_SUBST` 替换）指向已找到工具的各种环境变量。`AC_PROG_INSTALL`\
  \ 对安装工具执行相同的操作。要使用此检查，你需要在 `Makefile.in` 模板中使用关联的 Autoconf 替换变量，就像我们早之前使用 `@CC@`、`@CFLAGS@`\
  \ 和 `@CPPFLAGS@` 那样。列表 5-3 展示了这些变化。\n\nGit tag 5.1\n\n```\n--snip--\n\n# 工具特定的替换变量\n\
  \nCC = @CC@\n\nCFLAGS = @CFLAGS@\n\nCPPFLAGS = @CPPFLAGS@\n\nINSTALL = @INSTALL@\n\
  \nINSTALL_DATA = @INSTALL_DATA@\n\nINSTALL_PROGRAM = @INSTALL_PROGRAM@\n\nINSTALL_SCRIPT\
  \ = @INSTALL_SCRIPT@\n\n--snip--\n\ninstall:\n\n        $(INSTALL) -d $(DESTDIR)$(bindir)\n\
  \n        $(INSTALL_PROGRAM) -m 0755 jupiter $(DESTDIR)$(bindir)\n\n--snip--\n```\n\
  \n*列表 5-3:* `src/Makefile.in`: 在你的 Makefile.in 模板中替换安装工具*\n\n`@INSTALL@` 的值显然是找到的安装程序的路径。`@INSTALL_DATA@`\
  \ 的值是 `${INSTALL} -m 0644`。基于此，你可能会认为 `@INSTALL_PROGRAM@` 和 `@INSTALL_SCRIPT@` 的值会类似于\
  \ `${INSTALL} -m 0755`，但事实并非如此。这些值简单地设置为 `${INSTALL}`。(3)\n\n你可能还需要测试其他重要的工具程序，包括\
  \ `lex`、`yacc`、`sed` 和 `awk`。如果你的程序需要这些工具中的一个或多个，你可以添加 `AC_PROG_LEX`、`AC_PROG_YACC`、`AC_PROG_SED`\
  \ 或 `AC_PROG_AWK` 的调用。如果它在你的项目目录树中发现 `*.yy` 或 `*.ll` 扩展的文件，autoscan 将向 `configure.scan`\
  \ 中添加 `AC_PROG_YACC` 和 `AC_PROG_LEX` 的调用。\n\n你可以使用这些更专门的宏来检查大约十种不同的程序。如果程序检查失败，生成的\
  \ configure 脚本将失败并显示消息，指示无法找到所需的工具，并且在正确安装它之前无法继续构建。\n\n程序和编译器检查会使 autoconf 将特殊命名的变量替换到模板文件中。你可以在\
  \ GNU Autoconf 手册中找到每个宏对应的变量名称。你应该在 `Makefile.in` 模板的命令中使用这些 make 变量来调用它们所代表的工具。Autoconf\
  \ 宏将根据它们在用户系统上找到的已安装工具来设置这些变量的值，*如果用户尚未在环境中设置了它们的话*。\n\n这是 Autoconf 生成的 configure\
  \ 脚本的一个关键方面——用户*始终可以*在执行 configure 之前通过导出或设置适当的变量来覆盖 configure 对环境所做的任何操作。(4)\n\n\
  例如，如果用户选择使用安装在主目录中的特定版本的 bison 进行构建，他们可以输入以下命令以确保 `$(YACC)` 指向正确版本的 bison，并且 shell\
  \ 代码 `AC_PROG_YACC` 仅仅是替换了你 `Makefile.in` 模板中 `@YACC@` 的现有值：\n\n```\n$ cd jupiter\n\
  $ ./configure YACC=\"$HOME/bin/bison -y\"\n--snip--\n```\n\n注意\n\n将变量设置作为参数传递给 `configure`\
  \ 在功能上等同于在 shell 环境的命令行中为 `configure` 进程设置变量（例如，`YACC=\"$HOME/bin/bison -y\" ./configure`）。使用此示例中给出的语法的优势是，`config.status\
  \ --recheck` 随后可以跟踪该值，并使用最初给它的选项从 makefile 重新执行 `configure`。因此，你应该始终使用参数语法而非 shell\
  \ 语法来为 `configure` 设置变量。关于强制执行此语法的方法，请参阅 Autoconf 手书中关于 `AC_ARG_VAR` 的文档。要检查未被这些专门宏覆盖的程序是否存在，你可以使用通用的\
  \ `AC_CHECK_PROG` 宏或编写你自己的特殊用途宏（参见第 16 章](#ch16.xhtml)）。这里的要点是：\n\n- `AC_PROG_*`\
  \ 宏检查程序是否存在。\n- 如果它们找到了程序，就会创建一个替换变量。\n- 你应该在 `Makefile.in` 模板中使用这些替换变量来执行关联的工具。\n\
  \n### Autoconf 的一个常见问题\n\n我们应该借此机会解决新接触 Autools 的开发者经常遇到的一个特定问题。以下是 `AC_CHECK_PROG`\
  \ 的正式定义，你可以在 GNU Autoconf 手册中找到它：\n\n```\nAC_CHECK_PROG(variable, prog-to-check-for,\
  \ value-if-found,\n    [value-if-not-found], [path], [reject])\n```\n\n检查程序 `prog-to-check-for`\
  \ 是否在 `path` 中。如果找到了，则将 `variable` 设置为 `value-if-found`；如果未找到，则设为 `value-if-not-found`。如果给定了\
  \ `reject`（绝对路径），即使它是搜索路径中找到的第一个程序，也跳过；否则将 `variable` 设置为找到的路径的绝对路径。如果 `variable`\
  \ 已经设置，则什么都不做。调用 `AC_SUBST` 处理 `variable`。(5)\n\n描述相当晦涩，但仔细阅读后，你可以从中提取出以下内容：\n\n\
  - 如果 `prog-to-check-for` 在搜索路径中找到，则 `variable` 设置为 `value-if-found`；否则设置为 `value-if-not-found`。\n\
  - 如果指定了 `reject`（作为全路径），并且它是搜索路径中找到的第一个，则跳过它并继续搜索路径中的下一个程序。\n 如果 如果先发现了 `reject`，然后找到了另一个非\
  \ `reject` 的匹配，则将 `variable` 设置为第二个匹配项的绝对路径。\n- 如果用户已经在环境中设置了 `variable`，则保持原样（从而允许用户在运行\
  \ configure 前设置 `variable` 来覆盖检查）。\n- 对 `variable` 执行 `AC_SUBST` 以使其成为 Autoconf\
  \ 替换变量。\n\n初读这段描述时，似乎存在一个冲突：我们在第一项中看到，根据 `prog-to-check-for` 是否在搜索路径中找到，`variable`\
  \ 将设置为两个指定值之一。但在第三项中我们又看到，如果先发现了 `reject`，则 `variable` 将设置为某个程序的全路径。发现 `AC_CHECK_PROG`\
  \ 的真实功能就像阅读一段简单的 shell 脚本。虽然你可以参考 Autoconf `programs.m4` 宏文件中 `AC_CHECK_PROG` 的定义，但你离实际执行检查的\
  \ shell 代码有一层。直接查看 `AC_CHECK_PROG` 生成的脚本不是更好吗？我们将使用 Jupiter 的 `configure.ac` 文件来尝试这个概念。根据列表\
  \ 5-4 中突出显示的变化临时修改你的 `configure.ac` 文件。\n\n```\n--snip--\n\nAC_PREREQ(2.69)\n\n\
  AC_INIT([Jupiter], [1.0], [jupiter-bugs@example.org])\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \nAC_CONFIG_HEADER([config.h])\n\n# 检查程序。\n\nAC_PROG_CC\n\n_DEBUG_START_\n\nAC_CHECK_PROG([bash_var],\
  \ [bash], [yes], [no],, [/usr/sbin/bash])\n\n_DEBUG_END_\n\nAC_PROG_INSTALL\n\n\
  --snip--\n```\n\n*列表 5-4: 使用 AC_CHECK_PROG 的首次尝试*\n\n现在执行 autoconf，打开生成的 configure\
  \ 脚本并搜索 `_DEBUG_START_`。\n\n\n\n\n\n`_DEBUG_START_` 和 `_DEBUG_END_` 字符串被称为“栅栏边界”（picket\
  \ fences）。我将它们添加到 `configure.ac` 中，唯一的目的是为了帮助我找到 `AC_CHECK_PROG` 宏生成的 shell 代码的开头和结尾。我特意选择这些名称，是因为你不太可能在生成的\
  \ `configure` 脚本的其他地方找到它们。\n\nListing 5-5 显示了该宏生成的 `configure` 部分。\n\n```\n --snip--\n\
  \n   _DEBUG_START_\n\n➊ 提取 \"bash\" 的第一个单词，使其可以作为带参数的程序名。\n\n   set dummy bash;\
  \ ac_word=$2\n\n   { $as_echo \"$as_me:${as_lineno-$LINENO}: checking for $ac_word\"\
  \ >&5\n\n   $as_echo_n \"checking for $ac_word... \" >&6; }\n\n   if ${ac_cv_prog_bash_var+:}\
  \ false; then :\n\n     $as_echo_n \"(cached) \" >&6\n   else\n\n     if test -n\
  \ \"$bash_var\"; then\n     ac_cv_prog_bash_var=\"$bash_var\" # 让用户覆盖测试。\n   else\n\
  \n     ac_prog_rejected=no\n\n     as_save_IFS=$IFS; IFS=$PATH_SEPARATOR\n\n   \
  \  for as_dir in $PATH\n   do\n\n     IFS=$as_save_IFS\n     test -z \"$as_dir\"\
  \ && as_dir=.\n       for ac_exec_ext in '' $ac_executable_extensions; do\n    \
  \ if as_fn_executable_p \"$as_dir/$ac_word$ac_exec_ext\"; then\n\n     ➋ if test\
  \ \"$as_dir/$ac_word$ac_exec_ext\" = \"/usr/sbin/bash\"; then\n\n           ac_prog_rejected=yes\n\
  \           continue\n         fi\n        ac_cv_prog_bash_var=\"yes\"\n\n     \
  \   $as_echo \"$as_me:${as_lineno-$LINENO}: found $as_dir/$ac_word$ac_exec_ext\"\
  \n\n    >&5\n\n        break 2\n      fi\n    done\n      done\n\n  IFS=$as_save_IFS\n\
  \n➌ if test $ac_prog_rejected = yes; then\n\n    # 我们在路径中找到了无效程序，所以确保我们永远不使用它。\n\
  \n    set dummy $ac_cv_prog_bash_var\n\n    shift\n\n    if test $# != 0; then\n\
  \      # 我们从无效编译器中选了另一个编译器。\n      # 然而，它具有相同的文件名，如果我们将 bash_var 设置为仅文件名，\n    \
  \  # 那么无效程序会被优先选中；因此使用完整文件路径。\n      shift\n      ac_cv_prog_bash_var=\"$as_dir/$ac_word${1+'\
  \ '}$@\"\n    fi\n  fi\n\n    test -z \"$ac_cv_prog_bash_var\" && ac_cv_prog_bash_var=\"\
  no\"\n  fi\n  fi\n\n  bash_var=$ac_cv_prog_bash_var\n\n  if test -n \"$bash_var\"\
  ; then\n\n    { $as_echo \"$as_me:${as_lineno-$LINENO}: result: $bash_var\" >&5\n\
  \n  $as_echo \"$bash_var\" >&6; }\n\n  else\n\n       { $as_echo \"$as_me:${as_lineno-$LINENO}:\
  \ result: no\" >&5\n\n  $as_echo \"no\" >&6; }\n  fi\n\n  _DEBUG_END_\n\n  --snip--\n\
  ```\n\n*Listing 5-5: AC_CHECK_PROG 生成的 configure 部分*\n\n该 shell 脚本中 ➊ 处的起始注释是一个提示，表明\
  \ `AC_CHECK_PROG` 具有某些未文档的功能。显然，你可以在 `prog-to-check-for` 参数中与程序名一起传递参数。不久后，我们将查看你可能需要这样做的这种情况。\n\
  \n在脚本更靠后方的 ➋ 处，你可以看到 `reject` 参数被引入了其中，以便允许 `configure` 搜索工具的特定版本。从 ➌ 处的代码中，我们可以看到我们的\
  \ `bash_var` 变量可以有不同的值：如果在搜索路径中没有找到请求的程序，则为空为空；如果找到了，则为指定的程序；如果先发现了 `reject`，则为指定程序的完整路径。\n\
  \n你在何处使用 `reject` 呢？例如，在安装了专用 Sun 工具的 Solaris 系统上，默认的 C 编译器通常是 Solaris C 编译器。但某些软件可能要求使用\
  \ GNU C 编译器。作为维护者，我们不知道在用户的搜索路径中会找到哪个编译器。`AC_CHECK_PROG` 允许我们确保如果在搜索路径中先发现了另一个 C\
  \ 编译器，则使用路径完整的 `gcc`。\n\n正如我之前提到的，M4 宏能够感知参数是给定的、空的还是缺失的，并且它们会根据这些条件执行不同的操作。许多标准的\
  \ Autoconf 宏在编写时充分利用了空或未指定的可选参数，并在每种情况下生成完全不同的 shell 代码。Autoconf 宏还可能针对这些不同条件优化生成的\
  \ shell 代码。\n\n考虑到我们现在了解的这些，我们可能应该以如下方式调用 `AC_CHECK_PROG`：\n\n```\nAC_CHECK_PROG([bash_shell],[bash_shell],[/usr/sbin/bash])\n\
  ```\n\n如果未指定 `reject` 且在系统中找到了 `pthread`，则 `bash_shell` 将被设置为 `pthread`。如果在系统中没有找到\
  \ `pthread`，则 `bash_shell` 将被为空。相反，如果指定了 `reject` 且先发现了不想要的 `pthread`，则 `bash_shell`\
  \ 将被设置为完整路径。\n\n\n\n\n\n```c\n#include <stdio.h>\n\n#include <stdlib.h>\n\n#include\
  \ <pthread.h>\n\nstatic void * print_it(void * data)\n\n{\n    printf(\"Hello from\
  \ %s!\\n\", (const char *)data);\n\n    return 0;\n}\n\nint main(int argc, char\
  \ * argv[])\n{\n    pthread_t tid;\n    pthread_create(&tid, 0, print_it, argv[0]);\n\
  \    pthread_join(tid, 0);\n    return 0;\n}\n```\n\n*列表 5-6：* `src/main.c`: *在\
  \ Jupiter 项目源码中添加多线程支持*\n\n这显然是线程的一种荒谬用法；尽管如此，它*确实*是线程使用的典型形式。考虑一种假设的情况：后台线程正在执行某些长时间计算，而主线程在\
  \ `print_it` 工作时正在处理其他事情。在多处理器机器上，这种方式使用线程可以实际上让程序的吞吐量翻一倍。\n\n现在，我们需要一种方法来确定哪些库应该添加到编译器（链接器）的命令行中。如果我们没有使用\
  \ Autoconf，我们只需要在 Makefile 中将库添加到链接器命令行即可，如列表 5-7 所示。\n\n```\nprogram: main.c\n\n\
  \        $(CC) ... -lpthread ...\n```\n\n*列表 5-7：手动向编译器命令行添加 `pthread` 库**\n\n相反，我们将使用\
  \ Autoconf 提供的 `AC_SEARCH_LIBS` 宏，它是基础 `AC_CHECK_LIB` 宏的增强版本。`AC_SEARCH_LIBS` 宏允许我们在一组库中测试所需的功能。如果该功能存在于指定的库之一中，会将一个适当的命令行选项添加到\
  \ `@LIBS@` 替换变量中，然后我们会在 `Makefile.in` 模板的编译器（链接器）命令行中使用该变量。以下是自**GNU Autoconf 手册**中\
  \ `AC_SEARCH_LIBS` 的正式定义：\n\n```\nAC_SEARCH_LIBS(function, search-libs,\n\n    [action-if-found],\
  \ [action-if-not-found], [other-libraries])\n```\n\n如果定义 `function` 的库尚未可用，则搜索该库。这等于首先在不带任何库的情况下调用\
  \ `AC_LINK_IFELSE([AC_LANG_CALL([], [*function*])])`，然后对 `search-libs` 列出的每个库执行同样操作。\n\
  \n为第一个包含 `function` 的库向 `LIBS` 添加 `-llibrary` 并运行 `action-if-found`。如果未找到 `function`，则运行\
  \ `action-if-not-found`。\n\n如果与 `library` 链接导致未解析的符号，而这些符号可以通过链接额外的库来解决，则将这些库作为\
  \ `other-libraries` 参数给出并用空格分隔：例如 `-lXt -lX11`。否则，此宏无法检测到 `function`的存在，因为链接测试程序总是由于未解析的符号而失败。\n\
  \n测试结果缓存在 `ac_cv_search_function` 变量中。如果 `function` 已可用，则标记为无（none required），因为没有找到包含\
  \ `function` 的库；否则，标记为需要前置于 `LIBS` 的 `-llibrary` 选项。^(8)\n\n你能看出为什么生成的配置脚本如此巨大吗？当你向调用\
  \ `AC_SEARCH_LIBS` 传递特定函数时，链接器命令行参数会被添加到名为 `@LIBS@` 的替换变量中。这些参数确保你将链接到一个包含所传函数的库。如果第二个参数中列出了多个库（并用空格分隔），`configure`\
  \ 将确定这些库中哪些在用户的系统中是用的，并使用最合适的一个。\n\n列表 5-8 显示了如何在 Jupiter 的 `configure.ac` 文件中使用\
  \ `AC_SEARCH_LIBS` 来查找包含 `pthread_create` 函数的库。如果在 `pthread` 库中没有找到 `pthread_create`，`AC_SEARCH_LIBS`\
  \ 将不对 `@LIBS@` 变量添加任何内容。\n\n```\n--snip--\n\n# 检查库。\n\nAC_SEARCH_LIBS([pthread_create],\
  \ [pthread])\n\n--snip--\n```\n\n*列表 5-8：* `configure.ac`: *使用 AC_SEARCH_LIBS 检查系统上的\
  \ pthread 库*\n\n正如我们将在第 7 章中详细讨论的那样，库的命名模式在不同系统之间存在。例如，某些系统的库命名为 `libbasename.so`，而另一些系统使用\
  \ `libbasename.sa` 或 `libbasename.a`。基于 Cyg 的系统生成的名为 `cigbasename.dll` 的库。`AC_SEARCH_LIBS`\
  \ 通过使用编译器从 `basename` 计算库的实际名称（非常优雅地）解决了这一问题；它是通过尝试链接一个带有测试库中请求函数的小型测试程序来实现的。编译器命令行上仅传递\
  \ `-lbasename`——这是 Unix 编译器之间近乎通用的约定。\n\n我们必须再次修改 `src/Makefile.in` 以正确使用现在填充的 `@LIBS@`\
  \ 变量，如列表 5-9 所示。\n\n```\n--snip--\n\n# 特定工具的替换变量\n\nCC = @CC@\n\nLIBS = @LIBS@\n\
  \nCFLAGS = @CFLAGS@\n\nCPPFLAGS = @CPPFLAGS@\n\n--snip--\n\njupiter: main.c\n\n\
  \        $(CC) $(CFLAGS) $(CPPFLAGS) -I. -Isrcdir -o $@ $(srcdir) $(LIBS)\n\n--snip--\n\
  ```\n\n*列表 5-9：* `src/Makefile.in`: *使用 @LIBS@ 变量* **注意** 我将 `$(LIBS)` 放在源文件之后，是因为链接器关心顺序——我想让\
  \ `main.c` 主要的源文件。\n\n#### *这真的足够吗？*\n\n到为止，我们已经确保了构建系统在大多数系统中都能正确使用 `pthread`.^(9)\
  \ 如果我们的系统需要库，该库名称将被添加到 `@LIBS@` 并随后用于命令行。但我们还没有结束。\n\n这种系统*通常*运行良好，但在极端情况下仍然会失败。由于我们希望提供良好的用户体验，我们将\
  \ Jupiter 的构建系统提升到新的层次。在此过程中，我们需要做一个设计决策：如果配置未能找到 `pthread` 库，我们应该失败构建，还是不带多线程构建\
  \ jupiter？\n\n如果我们选择失败构建，用户会注意到，因为构建将带有错误消息停止（尽管信息可能并不友好——编译或链接过程将由于缺少头文件或未定义符号而失败）。相反，如果我们选择构建单线程版本的\
  \ jupiter，我们需要显示一条清晰的消息，说明程序是不带多线程构建的并解释原因。\n\n可能的问题是，某些用户的系统可能安装了 `pthread` 共享库，但没有\
  \ `pthread.h` 头文件——可能是因为安装了 `pthread` 可执行（共享库）包但没有开发包。共享库通常与静态库和头文件独立打包，而可执行文件是作为高级应用程序依赖链的一部分安装的，开发包通常由用户直接安装。^(10)\
  \ 因此，Autoconf 提供了测试库和头文件存在性的宏。我们可以使用 `AC_CHECK_HEADERS` 宏来确保特定头文件的存在。\n\nAutoconf\
  \ 检查非常详尽。它们通常不仅确保文件存在，还确保文件是正确的，因为它们允许你指定关于文件的断言，宏随后验证这些断言。`AC_CHECK_HEADERS` 宏并不只是扫描文件系统查找请求的头文件。像\
  \ `AC_SEARCH_LIBS` 一样，`AC_CHECK_HEADERS` 宏会构建一个相应语言的短测试程序并对其进行编译，以确保编译器既能找到又能使用该文件。\n\
  \n\n\n\n`AC_CHECK_HEADERS` 宏在*GNU Autoconf Manual*中的定义如下：\n\n```\nAC_CHECK_HEADERS(header-file...,\
  \ [action-if-found],\n\n    [action-if-not-found], [includes = 'AC_INCLUDES_DEFAULT'])\n\
  ```\n\n对于由空格分隔的参数列表中存在的每个定的系统头文件 `header-file`，将定义 `HAVE_*header-file`（全大写）。如果给出了\
  \ `action-if-found`，则在找到其中一个头文件时执行额外的 shell 代码。你可以给它赋值为 `break`，以便在首次匹配到项时跳出循环。如果给出了\
  \ `action-if-not-found`，则在未找到其中任一头文件时执行该代码。\n\n`includes` 的解释方式与 `AC_CHECK_HEADER`\
  \ 相同，用于选择在测试头文件之前提供的预处理器指令集。\n\n通常情况下，调用 `AC_CHECK_HEADERS` 时仅在第一个参数中传入所需的头文件列表。其余参数是可选的，且通常并不常用，因为该宏在没有这些参数的情况下也运行得很好。\n\
  \n我们将使用 `AC_CHECK_HEADERS` 为 `configure.ac` 添加对 `pthread.h` 头文件的检查。如你可能注意到的，`configure.ac`\
  \ 已经调用了 `AC_CHECK_HEADERS` 来查找 `stdlib.h`。`AC_CHECK_HEADERS` 接受文件名列表，因此我们将 `pthread.h`\
  \ 添加到列表中，用空格分隔文件名，如 [Listing 5-10] 所示。\n\nGit tag 5.3\n\n```\n--snip--\n\n# 检查头文件。\n\
  \nAC_CHECK_HEADERS([stdlib.h pthread.h])\n\n--snip--\n```\n\n*Listing 5-10:* `configure.ac`:\
  \ 在*AC_CHECK_HEADERS 宏*中*添加* `pthread.h`\n\n为了让尽可能的人可以使用此软件包，我们将使用双模式构建方法，这将允许我们为没有安装\
  \ `pthread` 库的用户提供至少*某种*形式的 jupiter 程序。为了实现这一目标，我们需要在 `src/main.c` 中添加一些条件预处理器语句，如\
  \ [Listing 5-11] 所示。\n\n```\n#include \"config.h\"\n\n#include <stdio.h>\n\n#include\
  \ <stdlib.h>\n\n#if HAVE_PTHREAD_H\n\n# include <pthread.h>\n\n#endif\n\nstatic\
  \ void * print_it(void * data)\n\n{\n\n    printf(\"Hello from %s!\\n\", (const\
  \ char *)data);\n\n    return 0;\n\n}\n\nint main(int argc, char * argv[])\n\n{\n\
  \n#if HAVE_PTHREAD_H\n\n    pthread_t tid;\n\n    pthread_create(&tid, 0, print_it,\
  \ argv[0]);\n\n    pthread_join(tid, 0);\n\n#else\n\n    print_it(argv[0]);\n\n\
  #endif\n\n    return 0;\n\n}\n```\n\n*Listing 5-11:* `src/main.c`: 根据 `pthread.h`\
  \ 的*存在性*添加条件代码*\n\n在此版本的 `main.c` 中，我们为头文件添加了条件检查。如果由 `AC_CHECK_HEADERS` 生成的 shell\
  \ 脚本找到了 `pthread.h` 头文件，则 `HAVE_PTHREAD_H` 宏将在用户的 `config.h` 文件中定义为值 `1`。如果 shell\
  \ 脚本没有找到头文件，则 `config.h` 中的原始 `#undef` 语句将保持注释状态。因为我们依赖于这些定义，所以还需要在 `main.c` 顶部包含\
  \ `config.h`。\n\n如果你选择不在 `configure.ac` 中使用 `AC_CONFIG_HEADERS` 宏，那么 `@DEFS@` 将包含由所有调用\
  \ `AC_DEFINE` 的宏生成的所有定义。在这个示例中，我们使用了 `AC_CONFIG_HEADERS`，因此 `config.h.in` 将包含这些定义中的大部分，而\
  \ `@DEFS@` 只包含 `HAVE_CONFIG_H`，我们实际上并没有使用它。`config.h.in` 模板方法显著缩短了编译器的命令行（同时也便于对模板进行快照拍摄，并为非\
  \ Autotools 平台进行手动修改）。[Listing 5-12] 显示了对 `src/Makefile.in` 模板所需的更改。\n\n```\n--snip--\n\
  \n# 与工具相关的替换变量\n\nCC = @CC@\n\nDEFS = @DEFS@\n\nLIBS = @LIBS@\n\nCFLAGS = @CFLAGS@\n\
  \nCPPFLAGS = @CPPFLAGS@\n\n--snip--\n\njupiter: main.c\n\n        $(CC) $(CFLAGS)\
  \ $(DEFS) $(CPPFLAGS) -I. -I$(srcdir) -I..\\\n\n          -o $@ $(srcdir)/main.c\
  \ $(LIBS)\n\n--snip--\n```\n\n*Listing 5-12:* `src/Makefile.in`: 在源码级 Makefile 中*添加对\
  \ @DEFS@ 的使用*\n\n**注意**\n\n*我将 `$(DEFS)` 添加在 `$(CPPFLAGS)` 之前，为最终用户提供了在命令行上覆盖我的任何策略决策的选项。****\n\
  \n现在我们已经有了条件构建 jupiter 程序所需的所有内容。如果用户的系统安装了 `pthread` 功能，用户将自动构建一个使用多线程执行的 jupiter\
  \ 版本；否则，他们将只能接受串行执行。剩下的工作是在 `configure.ac` 中添加代码，使得如果配置没有找到 `pthread` 库，它将构建一个串行执行的版本。现在考虑一种罕见情况：用户拥有头文件但没有库。例如，如果用户执行\
  \ `./configure` 时带有 `CPPFLAGS=-I/usr/include` 但未添加 `LDFLAGS=-L/usr/lib`，配置将显示头文件可用但库缺失。这种情况可以通过简单地跳过整个头文件检查来解决。[Listing\
  \ 5-13] 显示了 `configure.ac` 的所需更改。\n\nGit tag 5.4\n\n```\n--snip--\n\n# 检查库。\n\n\
  have_pthreads=no\n\nAC_SEARCH_LIBS([pthread_create], [pthread], [have_pthreads=yes])\n\
  \n# 检查头文件。\n\nAC_CHECK_HEADERS([stdlib.h])\n\nif test \"x${have_pthreads}\" = xyes;\
  \ then\n\n    AC_CHECK_HEADERS([pthread.h], [], [have_pthreads=no])\n\nfi\n\nif\
  \ test \"x${have_pthreads}\" = xno; then\n\n    AC_MSG_WARN([\n  --------------------------\n\
  \  在此系统中未找到线程。\n  正在构建单线程版本。\n  --------------------------])\n\nfi\n\n--snip--\n\
  ```\n\n*Listing 5-13:* `configure.ac`: 在配置期间添加指示线程不支持的代码\n\n现在，当我们运行 `./bootstrap.sh`\
  \ 和 `./configure` 时，我们将看到一些额外的输出（此处显示）：\n\n```\n$ ./bootstrap.sh\n\n$ ./configure\n\
  \nchecking for gcc... gcc\n\n--snip--\n\nchecking for library containing pthread_create...\
  \ -lpthread\n\n--snip--\n\nchecking for pthread.h usability... yes\n\nchecking for\
  \ pthread.h presence... yes\n\nchecking for pthread.h... yes\n\nconfigure: creating\
  \ ./config.status\n\nconfig.status: creating Makefile\n\nconfig.status: creating\
  \ src/Makefile\n\nconfig.status: creating config.h\n\n$\n```\n\n如果用户的系统缺少 `pthread.h`\
  \ 头文件，他们将看到不同的输出。为了测试模拟这种情况，可以使用涉及 Autoconf 缓存变量的技巧。通过预设代表 `pthread.h` 头文件存在的缓存变量为\
  \ no，我们可以欺骗配置使其不查找 `pthread.h`，因为它假设搜索已经完成。让我们尝试一下：\n\n```\n$ ./configure ac_cv_header_pthread_h=no\n\
  \nchecking for gcc... gcc\n\n--snip--\n\nchecking for library containing pthread_create...\
  \ -lpthread\n\n--snip--\n\nchecking for pthread.h... (cached) no\n\nconfigure: WARNING:\n\
  \n  --------------------------\n  在此系统中未找到线程。\n  正在构建单线程版本。\n  --------------------------\n\
  \nconfigure: creating ./config.status\n\nconfig.status: creating Makefile\n\nconfig.status:\
  \ creating src/Makefile\n\nconfig.status: creating config.h\n\n$\n```\n\n如果我们选择在未找到\
  \ `pthread.h` 头文件或 `pthread` 库时停止构建，那么源代码将更加简单；就不需要条件编译了。在这种情况下，我们可以将 `configure.ac`\
  \ 修改为像 [Listing 5-14] 所示。\n\n\n\n\n\n```bash\n--snip--\n\n# Checks for libraries.\n\
  \nhave_pthreads=no\n\nAC_SEARCH_LIBS([pthread_create], [pthread], [have_pthreads=yes])\n\
  \n# Checks for header files.\n\nAC_CHECK_HEADERS([stdlib.h])\n\nif test \"x${have_pthreads}\"\
  \ = xyes; then\n\n    AC_CHECK_HEADERS([pthread.h], [], [have_pthreads=no])\n\n\
  fi\n\nif test \"x${have_pthreads}\" = xno; then\n\n    AC_MSG_ERROR([\n\n  ------------------------------------------\n\
  \  The pthread library and header files are\n  required to build jupiter. Stopping...\n\
  \  Check 'config.log' for more information.\n  ------------------------------------------])\n\
  fi\n--snip--\n```\n\n列表 5-14: 如果未找到 `pthread` 库则构建失败\n\n**注意**\n\nAutoconf 宏会生成\
  \ shell 代码，用于检查系统特性是否存在并根据这些测试设置变量。然而，作为维护者，需要你向 `configure.ac` 中添加 shell 代码，根据生成的变量内容来做出功能性决策。\n\
  \n### 打印消息\n\n在前面的示例中，我们使用了几个 Autoconf 宏在配置期间向用户显示消息：`AC_MSG_WARN` 和 `AC_MSG_ERROR`。以下是\
  \ Autoconf 各种 `AC_MSG_*` 宏的原型：\n\n```\nAC_MSG_CHECKING(feature-description)\nAC_MSG_RESULT(result-description)\n\
  AC_MSG_NOTICE(message)\nAC_MSG_ERROR(error-description[, exit-status])\nAC_MSG_FAILURE(error-description[,\
  \ exit-status])\nAC_MSG_WARN(problem-description)\n```\n\n`AC_MSG_CHECKING` 和 `AC_MSG_RESULT`\
  \ 宏设计用于配合使用。`AC_MSG_CHECKING` 宏打印一行表示它正在检查某个特定特性，但它不会在该行末尾打印换车符。一旦在用户的机器上找到（或未找到）该特性，`AC_MSG_RESULT`\
  \ 宏会在行尾打印结果，随后打印换车符以完成由 `AC_MSG_CHECKING` 开始的行。`result-description` 文本在 `feature-description`\
  \ 消息的上下文中应该是通顺的。例如，`Looking for a C compiler...` 消息可能会以找到的编译器名称或以 `not found` 文本结束。\n\
  \n**注意**\n\n作为 `configure.ac` 的作者，你应该努力避免在这两个宏调用之间显示额外的文本，因为如果两组输出之间存在无关文本，用户将难以跟进。\n\
  \n`AC_MSG_NOTICE` 和 `AC_MSG_WARN` 宏只是向屏幕打印字符串。`AC_MSG_WARN` 的前缀文本是 `configure: WARNING:`，而\
  \ `AC_MSG_NOTICE` 的前缀仅为 `configure:`。\n\n\n\n`AC_MSG_ERROR` 和 `AC_MSG_FAILURE` 宏会生成错误消息、停止配置过程，并向\
  \ shell 返回错误代码。`AC_MSG_ERROR` 的前缀文本是 `configure: error:`。`AC_MSG_FAILURE` 宏会打印一条通知，指示错误发生的目录、用户指定的消息，然后是\
  \ `See 'config.log' for more details` 。这些宏的可选第二个参数（`exit-status`）允许维护者指定返回给 shell\
  \ 的特定状态码。默认值为 1。\n\n这些宏输出的文本消息显示在标准输出（stdout）并发送到 `config.log` 文件，因此使用这些宏而不是简单的使用\
  \ shell `echo` 或 `printf` 语句是非常重要的。\n\n在这些宏的第一个参数中提供多行文本，对于仅指示构建将在限制条件下继续的警告消息特别为重要。在大型配置过程的快速构建机器上，单行警告可能会一闪而过，用户甚至不会注意到。在\
  \ `configure` 因错误终止的情况下，这个问题就不那么，因为用户很容易在输出的末尾发现问题。\n\n### 支持可选特性和软件包\n\n我们讨论了处理\
  \ `pthread` 库存在与不存在的不同方法。但如果用户想在安装了 `pthread` 库的情况下构建一个 jupiter 的单线程版本呢？我们显然不想在\
  \ Jupiter 的 `README` 文件中添加注释告诉用户重命名他们的 `pthread` 库！我们也不希望用户使用我们的 Autoconf 缓存变量技巧。\n\
  \nAutoconf 提供了两个处理可选特性和外部软件包的宏：`AC_ARG_ENABLE` 和 `AC_ARG_WITH`。它们的原型如下：\n\n```\n\
  AC_ARG_WITH(package, help-string, [action-if-given], [action-if-not-given])\nAC_ARG_ENABLE(feature,\
  \ help-string, [action-if-given], [action-if-not-given])\n```\n\n正如许多 Autoconf 宏一样，这两个宏简单地用于设置一些环境变量：\n\
  \n`AC_ARG_WITH ${withval}` 和 `${with_package}`\n\n`AC_ARG_ENABLE ${enableval}` 和\
  \ `${enable_feature}`\n\n这些宏也可以用于更复杂的形式，其中环境变量被宏可选参数中的 shell 脚本使用。无论何种情况，生成的变量必须在\
  \ `configure.ac` 中使用，否则执行将毫无意义。\n\n这些宏被设计为向生成的配置脚本命令行中添加 `--enable-feature[yes|no]`（或\
  \ `--disable-feature`）和 `--with-package[=arg]`（或 `--without-package`），并在用户输入 `./configure\
  \ --help` 时提供帮助文本。如果用户提供了这些选项，宏将设置相应的环境变量。\n\nAC_ARG_WITH 控制项目对可选软件包的使用，而 AC_ARG_ENABLE\
  \ 控制可选特性的包含或排除。使用其中一个还是另一个的选择通常取决于对你所考虑软件的视角，有时这些宏提供了重叠的功能集。\n\n例如，在 Jupiter 项目中，可以合理地认为\
  \ Jupiter 对 `pthread` 的使用构成了外部软件包的使用，因此你应该使用 `AC_ARG_WITH`。然而，也可以说`异步处理`是通过 `AC_ARG_ENABLE`\
  \ 启用的软件特性。事实上，这两个说法都是正确的，使用哪种选项取决于你为你提供可选访问的特性或软件包的高层架构视角。`pthread` 库提供的不仅仅是创建线程函数——它还互斥和条件变量，这两者都可能被不创建线程的库包使用。如果项目提供一个需要在多线程过程中安全地运行的库，它可能会使用\
  \ `pthread` 库的互斥对象，但它可能永远不会创建线程。因此，用户可能选择禁用异步执行特性，但项目仍然需要链接到 `pthread` 库以访问互斥功能。\n\
  \n通常情况下，当用户需要在不同软件包或项目内部提供的实现之间选择时，你应该使用 `AC_ARG_WITH`。例如，如果 jupiter 有某些加密文件的原因，它可能被编写为使用内部加密算法或外部加密库。默认配置可能使用内部算法，但软件包允许用户通过命令行选项\
  \ `--with-libcrypto` 覆盖默认值。在涉及安全时，使用广泛理解的库非常有助于你的包获得社区信任。\n\n### 为特性选项编写代码\n\n\n\
  \n\n在决定使用 `AC_ARG_ENABLE` 后，我们如何默认启用或禁用 `async-exec` 功能呢？这两种情况在 `configure.ac` 中编码方式的差异仅限于帮助文本以及传递给\
  \ `action-if-not-given` 参数的 shell 脚本。帮助文本描述了可用选项和默认值，而 shell 脚本则指示了当用户*没有*指定该选项时我们希望发生什么。（当然，如果用户指定了它，我们就不需要假设任何事情了。）\n\
  \n假设我们决定异步执行是一个高风险或实验性的功能，我们希望默认禁用它。在这种情况下，我们可以将 列表 5-15 所示的代码添加到 `configure.ac`。\n\
  \n```\n--snip--\n\nAC_ARG_ENABLE([async-exec],\n\n    [  --enable-async-exec   \
  \  enableasync exec],\n\n    [async_exec=${enableval}], [async_exec=no])\n\n--snip--\n\
  ```\n*列表 5-15：默认禁用的功能*\n\n另一方面，如果我们认为异步执行是 Jupiter 的核心功能，我们可能应该默认启用它，如 列表 5-16 所示。\n\
  \n```\n--snip--\n\nAC_ARG_ENABLE([async-exec],\n\n    [  --disable-async-exec  \
  \  disableasync exec],\n\n    [async_exec=${enableval}], [async_exec=yes])\n\n--snip--\n\
  ```\n*列表 5-16：默认启用的功能*\n\n现在，问题是，我们是无论用户对该功能有何要求都检查库和头文件，还是只在 `async-exec` 功能启用时才检查它们？在这种情况下，这取决于喜好，因为我们只针对此功能使用了\
  \ `pthread` 库。（如果我们还为了非功能特定的原因使用它，那么无论什么情况下我们都必须检查它。）\n\n在即使功能被禁用也需要该库的情况下，我们会像前面的示例一样添加\
  \ `AC_ARG_ENABLE`，并额外调用 `AC_DEFINE` 来专门为该功能创建一个 `config.h` 定义。由于我们并不真的希望在库或头文件缺失的情况下启用该功能——即使用户特意请求了它——我们还会添加一些\
  \ shell 代码，在其中之一缺失时关闭该功能，如 列表 5-17 所示。\n\nGit tag 5.5\n\n```\n--snip--\n\n# 检查程序。\n\
  \nAC_PROG_CC\n\nAC_PROG_INSTALL\n\n# 检查头文件。\n\nAC_CHECK_HEADERS([stdlib.h])\n\n\
  # 检查命令行选项\n\nAC_ARG_ENABLE([async-exec],\n\n    [  --disable-async-exec    disable\
  \ async execution feature],\n\n    [async_exec=${enableval}], [async_exec=yes])\n\
  \nhave_pthreads=no\n\nAC_SEARCH_LIBS([pthread_create], [pthread], [have_pthreads=yes])\n\
  \nif test \"x${have_pthreads}\" = xyes; then\n\n    AC_CHECK_HEADERS([pthread.h],\
  \ [], [have_pthreads=no])\n\nfi\n\nif test \"x${have_pthreads}\" = xno; then\n\n\
  \ ➊ if test \"x${async_exec}\" = xyes; then\n\n        AC_MSG_WARN([\n  ------------------------------------------\n\
  \  在该系统上找不到 pthreads。\n  正在构建单线程版本。\n  ------------------------------------------])\n\
  \n    fi\n\n    async_exec=no\n\nfi\n\nif test \"x${async_exec}\" = xyes; then\n\
  \n    AC_DEFINE([ASYNC_EXEC], [1], [async execution enabled])\n\nfi\n\n# 检查库。\n\n\
  # 检查类型定义、结构和编译器特性。\n\n--snip--\n```\n*列表 5-17：* `configure.ac`: *在配置期间妥善管理可选功能*\n\
  \n我们正在将原始的库检查替换为新的命令行参数检查，这的额外好处是，可以在用户未指定偏好的默认情况下也检查该库。如你所见，现有的大部分代码是相同的，只是周围增加了一些额外的脚本以考虑用户的命令行选择。\n\
  \n**注意**\n\n*在 列表 5-17 中，某些地方似乎有多余的空格或任意缩进。这是刻意为之，因为这可以确保在运行 `configure` 时输出格式正确。我们稍后会在向工具箱添加更多宏时修复其中部分问题。*\n\
  \n注意在 ➊ 处，我还对 `async_exec` 变量是否为 `yes` 值增加了一个额外的测试，因为这段文字确实属于功能测试，而不是 `pthread`\
  \ 库测试。记住，我们正试图在测试 `pthread` 功能与测试 `async-exec` 功能本身的要求之间建立逻辑分离。\n\n当然，现在我们还必须修改\
  \ `src/main.c` 以使用新定义，如 列表 5-18 所示。\n\n```\n--snip--\n\n#if HAVE_PTHREAD_H\n\n#\
  \ include <pthread.h>\n\n#endif\n\nstatic void * print_it(void * data)\n{\n    printf(\"\
  Hello from %s!\\n\", (const char *)data);\n}\n\nint main(int argc, char *[])\n{\n\
  #if ASYNC_EXEC\n    pthread_t tid;\n    pthread_create(&tid, 0, print_it, argv[0]);\n\
  \    pthread_join(tid, 0);\n#else\n    print_it(argv[0]);\n#endif\n    return 0;\n\
  }\n```\n*列表 5-18：* `src/main.c`: *针对 async-exec 修改代码*\n\n为了确保只有在功能启用时才检查库和头文件，我们将\
  \ `async_exec` 的测试从仅包裹消息语句移动到包裹整个头文件和库的检查，正如 `HAVE_PTHREAD_H` 检查如 列表 19 所示。\n\n\
  Git tag 5.6\n\n```\n--snip--\n\n# 检查命令行选项。\n\nAC_ARG_ENABLE([async-exec],\n\n  [\
  \  --disable-async-exec    disable async execution feature],\n\n  [async_exec=${enableval}],\
  \ [async_exec=yes])\n\nif test \"x${async_exec}\" = xyes; then\n\n    have_pthreads=no\n\
  \n    AC_SEARCH_LIBS([pthread_create], [pthread], [have_pthreads=yes])\n\n    if\
  \ test \"x${have_pthreads}\" = xyes; then\n\n        AC_CHECK_HEADERS([pthread.h],\
  \ [], [have_pthreads=no])\n\n    fi\n\n    if test \"x${have_pthreads}\" = xno;\
  \ then\n\n        AC_MSG_WARN([\n  ------------------------------------------\n\
  \  在该系统上找不到 pthreads。\n  正在构建单线程版本。\n  ------------------------------------------])\n\
  \n        async_exec=no\n    fi\n\n    AC_DEFINE([ASYNC_EXEC], [1], [async execution\
  \ enabled])\n\nfi\n\nfi\n\n--snip--\n```\n*列表 5-19：* `configure.ac`: *仅在功能启用时检查库和头文件*\n\
  \n### 格式化帮助字符串\n\n我们将对 列表 5-17 中的 `AC_ARG_ENABLE` 使用进行最后一次修改。注意在第二个参数中，左括号和参数文本开始之间有两个空格。你还会注意到参数和描述之间的空格数取决于参数文本的长度，因为描述文本应该按照特定的列对齐给用户。\n\
  \n但是，如果 Autoconf 项目的维护者决定更改配置脚本帮助文本的格式呢？或者你修改了选项名称但忘记调整帮助文本的缩进呢？\n\n为了解决这些潜在问题，我们将转向一个名为\
  \ `AS_HELP_STRING` 的 Autoconf 辅助宏，其原型如下：\n\n```\nAS_HELP_STRING(left-hand-side,\
  \ right-hand-side,\n\n    [indent-column = '26'], [wrap-column = '79'])\n```\n\n\
  \n\n\n此宏的唯一目的是将关于在帮助文本的各个位置应嵌入的空格数量的知识抽象化。要使用它，请将 `AC_ARG_ENABLE` 中的第二个参数替换为 `AS_HELP_STRING`\
  \ 的调用，如 列表 5-20 所示。\n\nGit tag 5.7\n\n```\n--snip--\n\nAC_ARG_ENABLE([async-exec],\n\
  \n    [AS_HELP_STRING([--disable-async-exec],\n\n        [disable asynchronous execution\
  \ @<:@default: no@:>@])],\n\n    [async_exec=${enableval}], [async_exec=yes])\n\n\
  --snip--\n```\n\n*列表 5-20:* configure.ac: *使用 AS_HELP_STRING*\n\n**注意**\n\n*欲了解有关\
  \ 列表 5-20 中 `default: no` 周围奇怪字符序列的详情，请参阅 第 143 页 上的“四字字组（Quadrigraphs）”。*\n\n###\
  \ 检查类型和结构定义\n\n现在让我们考虑如何测试由系统或编译器提供的类型和结构定义。在编写跨平台网络软件时，你会很快学到，机器之间传输的数据需要以不依赖于特定\
  \ CPU 或操作系统架构的方式格式化。某些系统的原生整数大小为 32 位，而另一些系统为 64 位。某些系统在内存和磁盘上存储整数值是从低位字节到高位字节，而另一些系统则反之。\n\
  \n让我们考虑一个例子。当使用 C 语言结构来格式化网络消息时，你遇到的第一个障碍之一就是缺乏在不同平台之间具有相同的基本 C 语言类型。一个具有 32 位机器字宽的\
  \ CPU 可能会有一个具有 32 位 `int` 和 `unsigned` 类型的 C 编译器。C 语言中基本整数类型的大小由实现定义。这种设计是有刻意的，以便允许实现使用对每个平台最优的\
  \ `char`、`short`、`int` 和 `long` 的大小。\n\n虽然这种语言特性对于优化设计在单一平台上的软件非常有用，但在选择类型在平台*之间*移动数据时，它并没有什么帮助。为了解决这个问题，工程师们尝试了一切方法，从将网络数据作为字符串发送（如\
  \ XML 和 JSON）到发明自己的带尺寸类型。\n\n为了弥补语言的这一缺陷，C99 标准提供了带尺寸类型 `intN_t` 和 `uintN_t`，其中\
  \ `N` 可以是 8、16、32 或 64。遗憾的是，今天并不是所有的编译器都提供这些类型（并不意外的是，GNU C 长期一直处于前沿，通过包含 `stdint.h`\
  \ 头文件提供了带 C99 尺寸的类型）。\n\n为了在某种程度上减轻这种痛苦，Autoconf 提供了宏，用于判断用户平台上是否存在 C99 特定的标准类型，并在它们不存在时对其进行定义。例如，你可以向\
  \ `configure.ac` 添加对 `AC_TYPE_UINT16_T` 的调用，以确保 `uint16_t` 在你用户的平台上存在，要么作为 `stdint.h`\
  \ 中的系统定义，要么作为非标准但更通用的 `inttypes.h`，要么作为 `config.h` 中的 Autoconf 定义。\n\n编译器对这类基于整数的类型的测试通常由配置脚本编写，是一段\
  \ C 代码，看起来像 列表 5-21 所示的代码。\n\n```\nint main()\n\n{\n\n ➊ static int test_array[1\
  \ - 2 * !((uint16_t) -1 >> (16 - 1) == 1)];\n\n    test_array[0] = 0;\n\n    return\
  \ 0;\n\n}\n```\n\n*列表 5-21: 对 uint16_t 正确实现的编译器检查*\n\n你会注意到 列表 5-21 中的重要行位于 ➊，那里是\
  \ `test_array` 声明的地方。Autoconf 依赖于这样一个事实：如果你尝试定义一个大小为负的数组，所有 C 编译器都会生成错误。如果 `uint16_t`\
  \ 在此平台上恰好是 16 位无符号数据，否则数组的大小将是负数。\n\n同样注意，列表中的括号表达式是一个编译时表达式。（(14)）。是否可以使用更简单的语法来完成这一点无人知，但这段代码在\
  \ Autoconf 支持的所有编译器上都起了作用。只有在满足以下三个条件时，数组才以非负大小定义：\n\n* `uint16_t` 在包含的某个头文件中被定义。\n\
  * `uint16_t` 的大小恰好是 16 位。\n* `uint16_t` 在此平台上是无符号的。\n\n按照 列表 5-22 所示的模式使用由此宏提供的定义。即使在没有\
  \ `stdint.h` 或 `inttypes.h` 的系统上，如果系统头文件未提供它，Autoconf 也会向 `config.h` 添加代码定义 `uint16_t`，这样你就可以在程序中使用该类型。\n\
  \n```\n#include \"config.h\"\n\n#ifdef STDINT_H\n\n#include <stdint.h>\n\n#elif\
  \ ITTYPES_H\n\n#include <inttypes.h>\n\n#endif\n\n--snip--\n\nuint16_t x;\n\n```\n\
  \n*列表 5-22: 使用 uint16_t 的源代码*\n\nAutoconf 提供了几十种类型检查，如 `AC_TYPE_UINT16_T`，详见 *GNU\
  \ Autoconf* 第 5.9 节。此外，一种通用类型检查 `AC_CHECK_TYPES` 允许你指定所需的逗号分隔的头文件列表。\n\n**注意**\n\
  \n*这种列表（例如 `struct`）是用逗号分隔的。*\n\n这里是 `AC_CHECK_TYPES` 的正式定义：\n\n```\nAC_CHECK_TYPES(types,\
  \ [action-if-found])\n```\n\n如果你在最后一个参数中指定头文件列表，将通过 `AC_INCLUDES_DEFAULT` 宏在测试中使用默认值，如\
  \ 列表 5-23 所示。此列表首先包含头文件，然后是额外的头文件（这些通常需要默认值）。\n\n```\n#include <stdio.h>\n\n#ifdef\
  \ SYS_TYPES_H\n\n#include <sys/types.h>\n\n#endif\n\n#ifdef SYS_STAT_H\n\n#include\
  \ <sys/stat.h>\n\n#endif\n\n#ifdef STDC_HEADERS\n\n#include <stdlib.h>\n#include\
  \ <stddef.h>\n\n#else\n#ifdef STDLIB_H\n\n#include <stdlib.h>\n\n#endif\n#endif\n\
  \n#ifdef STRING_H\n\n#if !STDC_HEADERS && defined MEM_H\n\n#include <memory.h>\n\
  \n#endif\n#include <string.h>\n\n#endif\n\n#ifdef STRINGS_H\n\n#include <strings.h>\n\
  \n#endif\n\n#ifdef INTYPES_H\n\n#include <inttypes.h>\n\n#endif\n\n#ifdef STDINT_H\n\
  \n#include <stdint.h>\n\n#endif\n\n#ifdef UNISTD_H\n\n#include <unistd.h>\n\n#endif\n\
  ```\n\n*列表 5-23: AC_INCLUDES_DEFAULT 的定义，基于 Autoconf 2.69*\n\n如果你没有在最后一个参数中指定头文件列表，将通过\
  \ `AC_INCLUDES_DEFAULT` 宏在测试中使用默认值：\n\n```\nAC_CHECK_TYPES([struct doodah], [action-if-found],\
  \ [action-if-found],\n\n➊ AC_INCLUDES_DEFAULT\n\n   #include<doodah.h>\n\n   #include<doodahday.h>])\n\
  ```\n\n*列表 5-24: 在检查 struct doodah 时使用非默认的包含*\n\n### AC_OUTPUT 宏\n\n\n\n\n最后，我们来介绍\
  \ `AC_OUTPUT` 宏，它在 `configure` 内部会展开为 shell 代码，该代码根据之前宏展开时指定的数据来生成 `config.status`\
  \ 脚本。所有其他宏都必须在 `AC_OUTPUT` 展开之前使用，否则它们对你生成的 `configure` 脚本价值将无乎其微。（在 `AC_OUTPUT`\
  \ 之后可以在 `configure.ac` 中放置额外的 shell 脚本，但它不会影响由 `config.status` 执行的配置或文件生成。）\n\n\
  考虑在 `AC_OUTPUT` 之后添加 shell `echo` 或 `printf` 语句，以告诉用户构建系统是如何根据指定的命令行选项进行配置的。你也可以使用这些语句告诉用户\
  \ `make` 的其他有用目标。例如，我们可能会在 Jupiter 的 `configure.ac` 文件中于 `AC_OUTPUT` *之后* 添加代码，如\
  \ Listing 5-25 所示。\n\nGit tag 5.8\n\n```\n--snip--\n\nAC_OUTPUT\n\ncat << EOF\n\n\
  -------------------------------------------------\n\n${PACKAGE_NAME} Version ${PACKAGE_VERSION}\n\
  \nPrefix: '${prefix}'.\n\nCompiler: '${CC} ${CFLAGS} ${CPPFLAGS}'\n\nPackage features:\n\
  \n  Async Execution: ${async_exec}\n\nNow type 'make @<:@<target>@:>@'\n\n  where\
  \ the optional <target> is:\n\n    all                - build all binaries\n\n \
  \   install            - install everything\n\n--------------------------------------------------\n\
  \nEOF\n```\n\n\n\n\n我看到的关于 Autotools 的大部分抱怨最终与 `Automake` 有关。原因很简单：`Automake` 为构建系统提供了最高层次的抽象，并对使用它的项目施加了相当严谨的结构。`Automake`\
  \ 的语法非常简洁——事实上，它是极其精炼的，到了近乎刻的地步。一个 `Automake` 语句代表了大量的功能。但一旦你理解了它，就可以在短时间内运行一个相当完整、复杂且功能正确的构建系统——也就是说，只需要几分钟，而不是小时或几天。\n\
  \n在本章中，我将为你提供 `Automake` 内部工作机制的一些见解。有了这些见解，你不仅将对 `Automake` 能为你做什么感到熟悉，还会在其自动化不足的领域对其进行扩展。\n\
  \n### 进入正题\n\n让我们面对现实吧——编写正确的 makefile 通常很困难。正如俗所说，魔鬼在细节中。当我们继续改进 Jupiter 项目构建系统时，请考虑项目目录结构中文件的以下更改。让我们从清理工作区域开始。你可以使用\
  \ `make distclean`，或者如果你是从 GitHub 仓库工作区构建的，可以使用 `git clean` 命令的一种形式：\n\nGit tag\
  \ 6.0\n\n```\n $ git clean -xfd\n\n   --snip--\n\n➊ $ rm bootstrap.sh Makefile.in\
  \ src/Makefile.in\n\n➋ $ echo \"SUBDIRS = src\" > Makefile.am\n\n➌ $ echo \"bin_PROGRAMS\
  \ = jupiter\n\n   > jupiter_SOURCES = main.c\" > src/Makefile.am\n\n➍ $ touch NEWS\
  \ README AUTHORS ChangeLog\n\n   $ ls -1\n\n   AUTHORS\n\n   ChangeLog\n\n   configure.ac\n\
  \n   Makefile.am\n\n   NEWS\n   README\n   src\n\n   $\n```\n\n➊ 处的 `rm` 命令删除了我们手动编写的\
  \ `Makefile.in` 模板以及编写的 `bootstrap.sh` 脚本，该脚本是为了确保所有的支持脚本和文件都被复制到项目目录的根目录下。我们不再需要这个脚本了，因为我们正在将\
  \ Jupiter 升级到正真正的 `Automake`。（为了简洁，我在 ➋ 和 ➌ 处使用了 `echo` 语句写入新的 `Makefile.am` 文件；如果你愿意，可以使用文本编辑器。）\n\
  \n**注意**\n\n➌ 处的行尾有一个硬回车。shell 将在回车后继续接受输入，直到引号关闭。\n\n我在 ➍ 处使用 `touch` 命令在项目根目录下创建了新的空\
  \ `NEWS`、`README`、`AUTHORS` 和 `ChangeLog` 文件。（`INSTALL` 和 `COPYING` 文件是通过 `autoreconf\
  \ -i` 添加的。）这些文件是 `GCS` 对所有 GNU 项目的强制。。对于非 GNU 项目不是要求的，但它们已成为 OSS 世界中的某种制度；用户已经习惯了它们。\n\
  \n**注意**\n\n`GCS` 涵盖了这些文件的格式和内容。第 6.7 节和 6.8 节分别涵盖 `NEWS` 和 `ChangeLog` 文件，第 7.3\
  \ 节涵盖了 `README`、`INSTALL` 和 `COPYING` 文件。`AUTHORS` 文件是一个感谢贡献的人员列表（姓名和可选的电子邮件地址）。\n\
  \n维护 `ChangeLog` 文件可能有点痛苦——尤其是当你已经向仓库提交中添加过提交信息（commit messages）之后。为了简化过程，可以考虑在发布新版本之前，使用\
  \ shell 脚本将你的仓库日志抓取并填充到 `ChangeLog` 中。互联网上有现成的脚本；例如，`gnulib`（见第 13 章）提供了 `gitlog-to-changelog`\
  \ 脚本，可以在发布前将 git 仓库的日志信息导入 `ChangeLog`。\n\n### 在 configure.ac 中启用 Automake\n\n为了在构建系统中启用\
  \ `Automake`，我在 `configure.ac` 中添加了一行：在 `AC_INIT` 和 `AC_CONFIG_SRCDIR` 调用之间调用了 `AM_INIT_AUTOMAKE`，如列表\
  \ 6-1 所示。\n\n```\n#                                               *-* Autoconf -*-\n\
  \n# 使用 autoconf 处理此文件生成 configure 脚本。\n\nAC_PREREQ([2.69])\n\nAC_INIT([Jupiter],\
  \ [1.0], [jupiter-bugs@example.org])\n\nAM_INIT_AUTOMAKE\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \n--snip--\n```\n\n列表 6-1：在 `configure.ac` 中添加 Automake 功能\n\n如果你的项目已经用 Autoconf\
  \ 配置过，那么运行的 `configure.ac` 文件中，启用 `Automake` 只需要这一行。\n\n`AM_INIT_AUTOMAKE` 宏接受一个可选参数：一个由空格分隔的选项标签列表，这些标签可以传递给此宏以修改\
  \ `Automake` 的通用行为。有关每个选项的详细说明，请参见《GNU Automake Manual》的第 17 章。不过，我在这里将指出几个最有用的选项。\n\
  \ngnits, gnu, foreign\n\n这些选项设置了 `Automake` 的严格性检查。默认值是 `gnu`。`gnits` 选项让 `Automake`\
  \ 比现在还更加古板，而 `foreign` 选项则稍微放宽了限制——使用 `foreign` 时，你不需要通常的 `INSTALL`、`README` 和 `ChangeLog`\
  \ 文件。\n\ncheck-news\n\n`check-news` 选项会导致如果项目当前版本（来自 `configure.ac`）没有出现在 `NEWS`\
  \ 文件的前几行，`make dist` 将失败。\n\ndist-bzip2, dist-lzip, dist-xz, dist-shar, dist-zip,\
  \ dist-tar\n\n你可以使用 `dist-*` 选项来更改包类型。默认情况下，`make dist` 构建 `.tar.gz` 文件，但开发者通常想要分发\
  \ `.tar.xz`。这些选项使得更改变得非常简单。（即使没有 `dist-xz` 选项，你也可以通过 `make dist-xz` 覆盖默认，但使用选项更简单。）\n\
  \nreadme-alpha\n\n`readme-alpha` 选项在项目的 alpha 版本期间临时更改构建和发行行为。使用该选项会自动发行项目根目录下名为\
  \ `README-alpha` 的文件。该选项还会更改预期的版本方案。\n\n-W category, --warnings=category\n\n`-W\
  \ category` 和 `--warnings=category` 选项表示项目希望启用各种警告类的 `Automake`。可以使用多个此类选项。请参考《GNU\
  \ Automake Manual》查找有效类别列表。\n\nparallel-tests\n\n`parallel-tests` 功能允许并行执行检查，以便在执行检查目标时利用多处理器机器。\n\
  \nsubdir-objects\n\n当你打算引用其他目录的源码时，需要 `subdir-objects` 选项。使用该选项会导致 `Automake` 生成\
  \ make 命令，将对象和中间文件生成到源文件目录。有关此选项的更多信息，请参见第 175 页的“非递归 Automake”。\n\nversion\n\n\
  `version` 选项实际上是一个版本号占位符，代表该项目接受的 `Automake` 最低版本。例如，如果将 1.11 作为选项传递，如果 `Automake`\
  \ 的版本早于 1.11，在处理 `configure.ac` 时将失败。当你尝试使用仅存在后续版本 `Automake` 中的功能时，这非常有用。\n\n在有了新的\
  \ `Makefile.am` 文件并在 `configure.ac` 中启用了 `Automake` 后，让我们带上 `-i` 参数运行 `autoreconf`，以便为我们的项目添加\
  \ `Automake` 可能需要的任何新工具文件：\n\n\n\n\n\n```\n$ autoreconf -i\n\nconfigure.ac:11: installing\
  \ './compile'\n\nconfigure.ac:6: installing './install-sh'\n\nconfigure.ac:6: installing\
  \ './missing'\n\nMakefile.am: installing './INSTALL'\n\nMakefile.am: installing\
  \ './COPYING' using GNU General Public License v3 file\n\nMakefile.am:     Consider\
  \ adding the COPYING file to the version control system\n\nfor your code, to avoid\
  \ questions about which license your\n\nproject uses src/Makefile.am: installing\
  \ './depcomp'\n$\n\n$ ls -1p\n\naclocal.m4\n\nAUTHORS\nautom4te.cache/\nChangeLog\n\
  compile\nconfig.h.in\nconfigure\nconfigure.ac\nCOPYING\ndepcomp\nINSTALL\ninstall-sh\n\
  Makefile.am\nMakefile.in\nmissing\nNEWS\nREADME\nsrc/\n$\n```\n\n在 `configure.ac`\
  \ 中添加 `AM_INIT_AUTOMAKE` 宏会导致 `autoreconf -i` 现在执行 `automake -i`，这会包含几个额外的实用文件：`aclocal.m4`、`install-sh`、`compile`、`missing`\
  \ 和 `depcomp`。此外，Automake 现在会从 `Makefile.am` 生成 `Makefile.in`。\n\n我在第 2 章中提到过 `aclocal.m4`，在第\
  \ 4 章中提到过 `install-sh`。`missing` 脚本是一个小型实用辅助脚本，当命令行指定的工具不可用时，它会打印一条格式良好的消息。不需要更详细的信息；如果你感兴趣，可以在项目目录下执行\
  \ `./missing --help`。\n\n我们很快会讨论 `depcomp` 脚本，但我想在这里提一下 `compile` 脚本的作用。该脚本是对一些旧编译器的封装器，这些编译器不支持\
  \ `-c` 和 `-o` 命令行选项的并发使用。当你使用特定特定的标志时（我们稍后会讨论），Automake 必须生成代码，以便使用不同的标志对源文件进行多次编译。因此，它必须为每组使用的标志为对象文件命名不同的名称。`compile`\
  \ 脚本促进了这一过程。\n\nAutomake 还会添加默认的 `INSTALL` 和 `COPYING` 文本文件，其中包含专门针对 GNU 项目的样板文本。你可以根据需要为项目修改这些文件。我觉得默认的\
  \ `INSTALL` 文件文本对于与 Autotools 构建的项目相关的通用指令很有用，但我喜欢在将其提交到仓库之前，在文件的文件的开头添加一些项目特定的信息。Automake\
  \ 的 `-i` 选项不会覆盖项目中已有的这些文本文件，因此一旦由 `autoreconf -i` 添加了这些文件，你可以随时根据需要对默认文件进行修改。\n\n\
  `COPYING` 文件包含 GPL 的文本内容，它可能适用于你的项目，也可能不适用。如果你的项目根据 GPL 发布，只需保持文本不变即可。如果你根据其他许可证（如\
  \ BSD、MIT 或 Apache Commons 许可证）发布，请将默认文本替换为适用于该许可证的文本^(6)\n\n### 注意事项\n\n在新的检出的工作区域或新创建的项目，你只需要使用一次\
  \ `-i` 选项。一旦添加了缺失的实用文件，在将来调用 `autoreconf` 时，你可以省略 `-i` 选项，除非你在 `configure.ac` 中添加了某些宏，这可能会导致使用\
  \ `-i` 选项来添加更多缺失文件。\n\n上述命令创建了一个基于 Automake 的构建系统，它包含了我们在原始 `Makefile.in` 模板中编写的所有内容（测试功能是一个微小的例外，我们稍后会讲），但该系统根据\
  \ `GCS` 更加正确且功能完备。看一眼生成的 `Makefile.in` 模板就可以发现，Automake 为我们做了大量工作。生成的顶层 `Makefile.in`\
  \ 模板几乎有 24KB，而原始的手写 makefiles 只有几百字节长。\n\n一个 Automake 构建系统支持以下重要的 make 目标（派生自 Automake\
  \ 生成的 `Makefile`）：\n\n| all | check | clean | ctags |\n| dist | dist-bzip2 | dist-gzip\
  \ | dist-lzip |\n| dist-shar | dist-tarZ | dist-xz | dist-zip |\n| distcheck | distclean\
  \ | distdir | dvi |\n| html | info | install | install-data |\n| install-dvi | install-exec\
  \ | install-html | install-info |\n| install-pdf | install-ps | install-strip |\
  \ installcheck |\n| installdirs | maintainer-clean | mostlyclean | pdf |\n| ps |\
  \ tags | ininstall | |\n\n如你所见，这远超了我们在手写 `Makefile.in` 模板中能提供的功能。Automake 将这些基础功能写入每个使用它的项目中。\n\
  \n### 隐藏的优势：自动依赖跟踪\n\n在第 46 页的“依赖规则”中，我们讨论了 make 依赖规则。这些是我们在 Makefile 中定义的规则，以便\
  \ make 感知 C 语言源文件与包含的头文件之间的隐藏关系。Automake 付出了很大努力来确保你不需要为它理解的语言（如 C、C++ 和 Fortran）编写此类依赖规则。对于包含几个以上源文件的项目来说，这是一个重要的特性。\n\
  \n为几十个或上百个源文件手动编写依赖规则既乏味又容易出错。事实上，这是一个严重的问题，以至于编译器编写者通常提供了一种机制，让编译器根据其对源文件和语言的内部知识自动编写这些规则。GNU\
  \ 编译器等在命令行上支持一系列 -M 选项（`-M`、`-MM`、`-MF`、`-MG` 等）。这些选项告诉编译器为指定的源文件生成依赖规则。这些选项中最简单的是基础\
  \ `-M` 选项，它导致编译器在标准输出上生成规则并终止。该规则可以捕获到文件中，然后由 make 包含，以便依赖信息被纳入构建的有向图。\n\n但在原生编译器不提供依赖选项，或者它们与编译过程无法配合的情况下会发生什么？在这种情况下，Automake\
  \ 提供了一个名为 `depcomp` 的封装脚本，它执行两次编译器：一次用于依赖信息，再次编译源文件。当编译器缺少生成*任何*依赖信息的选项时，可以使用另一个工具递归确定哪些头文件影响给定文件。在这些选项都不存在的系统中，自动依赖生成将失败。\n\
  \n### 注意事项\n\n有关生成依赖的编译器选项的更详细描述，请参见第 529 页上的“项目 10：使用生成的代码”。有关 Automake 依赖管理的更多信息，请参\
  \ GNU Automake 手册的相关章节。\n\n现在是时候尝试一下了。和上一章节的构建系统一样，运行 `autoreconf`（由于我们之前运行过 `autoreconf\
  \ -i`，这是可选的，但无大碍），然后执行 `./configure` 和 `make`。\n\n\n\n\n如果你不尝试一下我们熟悉的其他几个 make 目标（targets），就无法真正体会\
  \ Automake 在此所做的工作。请亲自尝试运行 `install`、`dist` 和 `distcheck` 目标，以确保在删除了手动编写的 `Makefile.in`\
  \ 模板后，仍然拥有以前的所有功能。\n\n**注意**\n\n目前 `check` 目标是一个什么都不做的目标（do-nothing target），但在我们将测试项加回去之前，我们需要更详细地研究\
  \ Automake 的构造。当我们处理到那里时，你会发现它比我们最初编写的代码要简单得多。\n\n## Makefile.am 文件中究竟包含什么？\n\n\
  在第 4 章中，我们讨论了 Autoconf 如何接受一个散布了 M4 宏的 shell 脚本作为输入，然后生成宏完全展开后的相同 shell 脚本。同样，Automake\
  \ 接受一个散布了 Automake 命令的 makefile 作为输入。正如 Autoconf 的输入文件仅仅是增强后的 shell 脚本一样，Automake\
  \ `Makefile.am` 文件也不过带有额外 Automake 特有语法的标准 makefile。\n\nAutoconf 和 Automake 之间的一个显著区别是，Autoconf\
  \ 输出的文本只有输入文件中现有的 shell 脚本以及由嵌入 M4 宏展开产生的任何额外 shell 脚本。而 Automake 则假设所有的 makefile\
  \ 都应该包含一个最小的架构，用于支持 `GCS`，此外你指定的任何目标和变量。\n\n为了说明这一点，在 Jupiter 项目根目录下创建一个 `temp`\
  \ 目录，并在其中添加一个空的 `Makefile.am` 文件。接下来，使用文本编辑器将这个新的 `Makefile.am` 添加到项目的 `configure.ac`\
  \ 文件，并在顶层 `Makefile.am` 文件中引用它，如下：\n\n```\n $ mkdir temp\n\n   $ touch temp/Makefile.am\n\
  \n➊ $ echo \"SUBDIRS = src temp\" > Makefile.am\n\n   $ vi configure.ac\n\n   --snip--\n\
  \n   AC_CONFIG_FILES([Makefile\n\n                    src/Makefile\n\n         \
  \        ➋ temp/Makefile])\n\n   --snip--\n\n   $ autoreconf\n\n   $ ./configure\n\
  \n   --snip--\n\n   $ ls -1sh temp\n\n   total 24K\n\n➌ 12K Makefile\n\n   0 Makefile.am\n\
  \n➍ 12K Makefile.in\n\n   $\n```\n\n我在 ➊ 处使用 `echo` 语句重写了一个新的顶层 `Makefile.am` 文件，该文件的\
  \ `SUBDIRS` 同时引用了 `src` 和 `temp`。我使用文本编辑器将 `temp/Makefile` 添加到 Autoconf 从模板生成的 makefiles\
  \ 列表中（➋）。如你所示，每个 Automake 认为不可或的 makefile 中都生成了一量的支持代码。即使是空的 `Makefile.am` 文件也会生成一个\
  \ 12KB 的 `Makefile.in` 模板（➍），`configure` 由此生成一个大小相似的 `Makefile`（➌）。\n\n由于 make 实用在处理\
  \ makefile 时使用了一套相当严格的规则，因此 Automake 对你额外的 make 代码有了一定的裁量权。以下是一些具体细节：\n\n- `Makefile.am`\
  \ 文件中定义的 make 变量放置在生成的 `Makefile.in` 模板顶部，紧跟在任何 Automake 生成的变量定义之后。\n- `Makefile.am`\
  \ 文件中指定的 make 规则放置在生成的 `Makefile.in` 模板末尾，紧跟在任何 Automake 生成的规则之后。\n- 大多数由 `config.status`\
  \ 替换的 Autoconf 变量会被转换为 make 变量，并初始化为这些替换变量。\n\nmake 实用并不关心规则之间的相对位置，因为它在处理任何规则之前，会将每条规则都读取到内部数据库中。变量的处理也类似，只要它们在运行它们的规则之前定义即可。为了避免任何变量绑定问题，Automake\
  \ 按照它们在输入文件中定义的顺序将所有变量放置在输出文件的顶部。\n\n### 分析我们的新构建系统\n\n现在让我们看看我们在那两个简单的 `Makefile.am`\
  \ 文件中放入了什么，从顶层 `Makefile.am` 文件开始（见列表 6-2）。\n\n```\nSUBDIRS = src\n```\n\n*列表 6-2：*\
  \ Makefile.am：顶层 `Makefile.am` 文件仅包含一个子目录引用。\n\n这一行文本告诉 Automake 关于我们项目的几点信息：\n\n\
  - 除了此文件外，一个或多个子目录包含需要处理的 makefile。\n- 此空格分隔列表中的目录应按照指定的顺序进行处理。\n- 列表中的目录应对所有主要目标进行递归处理。\n\
  - 除非另有指定，否则列表中的目录应被视为项目的一部分。\n\n与大多数 Automake 构造一样，`SUBDIRS` 仅仅是一个对 Automake 有特殊含义的\
  \ make 变量。`SUBDIRS` 变量可以用于处理任意复杂的目录结构中的 `Makefile.am` 文件，且目录列表可以包含任何相对目录引用（不仅仅是直接子目录）。你可以说，当使用递归构建系统时，`SUBDIRS`\
  \ 就像是将项目目录层次中的 makefiles 结合在一起的胶水。\n\nAutomake 会生成递归 make 规则，这些规则会在 `SUBDIRS` 列表中指定的目录之后隐式地处理当前目录，但通常必要在列表中的某些或所有其他目录之前构建当前目录。你可以通过在\
  \ `SUBDIRS` 列表的任何地方使用点 `.` 当前目录来更改默认顺序。例如，为了在 `src` 目录之前构建顶层目录，你可以如下修改列表 6-2 中的\
  \ `SUBDIRS` 变量：\n\n```\nSUBDIRS = . src\n```\n\n现在转向 `src` 目录下的 `Makefile.am` 文件，见列表\
  \ 6-3。\n\n```\nbin_PROGRAMS = jupiter\n\njupiter_SOURCES = main.c\n```\n\n*列表 6-3：*\
  \ src/Makefile.am：该 Makefile.am 的初始版本包含两行。第一行是列表指定，第二行是源指定。\n\n#### 产品列表变量\n\n在\
  \ `Makefile.am` 文件中使用产品列表变量（PLV）来指定产品，这种变量（类似于 `SUBDIRS`）是对 Automake 有特殊含义的 make\
  \ 变量。以下模板显示了 PLV 的通用格式：\n\n```\n[modifier-list]prefix = product1 product2 ... productN\n\
  ```\n\n列表 6-3](#ch06.xhtml_ch06ex3) 中的 PLV 名称由两个部分组成：前缀（prefix）和主体（primary），用下划线分隔。变量的值是该\
  \ `Makefile.am` 文件生成的空格分隔的产品列表。\n\n### 安装位置前缀\n\n列表 6-3](#ch06.xhtml_ch06ex3) 产品列表变量中的\
  \ `bin` 部分是安装位置前缀的一个示例。`GCS` 定义了许多常见的安装位置，大多数列在表 3-1，位于第 65 页。然而，任何以 `dir` 结尾且值为文件位置的\
  \ make 变量都是有效的安装位置变量，并可以作为 PLV 前缀。\n\n通过省略变量名中的 `dir` 部分，可以在 PLV 前缀中引用安装位置变量。例如，在列表\
  \ 6-3](#ch06.xhtml_ch06ex3) 中，$(bindir)` 变量作为安装位置前缀时仅称为 `bin`。\n\nAutomake 还可以识别以特殊\
  \ `pkg` 前缀开头的四个安装位置变量：`pkglibdir`、`pkgincludedir`、`pkgdatadir` 和 `pkglibexecdir`。标准\
  \ `libdir`、`includedir`、`datadir` 和 `libexecdir` 变量的 pkg 版本表示列出的产品应该安装在以包命名的这些位置的子目录下。\n\
  \n\n\n\n由于 Automake 从所有以 `dir` 结尾的 make 变量推导出有效安装位置和前缀列表，因此你可以提供自己的 PLV 前缀以指向自定义安装位置。要将一组\
  \ XML 文件安装到系统数据目录下的 `xml` 目录中，你可以在 `Makefile.am` 文件中使用列表 6-4 中的代码。\n\n```\nxmldir\
  \ = $(datadir)/xml\n\nxml_DATA = file1.xml file2.xml file3.xml ...\n```\n\n*列表 6-4：指定自定义安装目录*\n\
  \n安装位置变量将包含默认值，这些值可以由 Automake 生成的 makefiles 定义，也可以由你在 `Makefile.am` 文件中定义，但用户始终可以在他们的\
  \ `configure` 或 `make` 命令行中重写这些默认值。如果你不想在特定构建过程中安装某些产品，可以在命令行上为安装位置变量指定一个空值；Automake\
  \ 生成的规则将确保目标为这些目录的产品不会被安装。例如，若只想为某个包安装文档和共享数据文件，你可以输入 `make bindir='' libdir=''\
  \ install.^(9)`\n\n#### 未与安装关联的前缀\n\n某些前缀与安装位置无关。例如，`noinst`、`check` 和 `EXTRA` 分别用于指示不安装的、仅用于测试的或可选的产品。以下是关于这三个前缀的更多信息：\n\
  \n#### noinst\n表示列出的产品应被构建但不被安装。例如，一个所谓的*便利性库*（convenience library）静态库可能会作为中间产物被构建，然后在构建过程的其他阶段被用于以构建最终产品。`noinst`\
  \ 前缀告诉 Automake 该产品不应被安装，并且只构建静态库。（毕竟，构建一个不会被安装的共享库是没有意义的。）\n\n#### check\n表示仅为了测试目的而构建的产品，因此不需要安装。在以\
  \ `check` 为前缀的 PLV 中列出的产品，只有在用户输入 `make check` 时才会被构建。\n\n#### EXTRA\n用于列出条件构建的程序。Automake\
  \ 要求所有源文件必须在 `Makefile.am` 文件中静态指定，而不是在构建过程中进行计算或推导，这样它就可以生成一个适用于任何可能命令行的 `Makefile.in`\
  \ 模板。然而，项目维护者可能会允许根据提供 `configure` 脚本的配置选项条件构建某些产品。如果产品列在由 `configure` 脚本生成的变量中，它们也应该列在\
  \ `Makefile.am` 文件中带有 `EXTRA` 前缀的 PLV 中。这一概念在列表 6-5 和 6-6 中进行了说明。\n\n```\nAC_INIT(...)\n\
  \n--snip--\n\noptional_programs=\n\nAC_SUBST([optional_programs])\n\n--snip--\n\n\
  if test \"x$(build_opt_prog)\" = xyes; then\n\n➊ optional_programs=$(optional_programs)\
  \ optprog\n\nfi\n\n--snip--\n```\n*列表 6-5：在 configure.ac 的 shell 变量中定义的条件构建程序*\n\
  \n```\n➋ EXTRA_PROGRAMS = optprog\n\n➌ bin_PROGRAMS = myprog $(optional_programs)\n\
  ```\n*列表 6-6：在 Makefile.am 中使用 EXTRA 前缀条件定义产品*\n\n在列表 6-5 的 ➊ 处，`optprog` 被追加到名为\
  \ `optional_programs` 的 Autoconf 替换变量中。列表 6-6 的 ➋ 处，`EXTRA_PROGRAMS` 变量将 `optprog`\
  \ 列为可能构建也可能不构建的产品，这取决于用户配置决定 ➌处的 `$(optional_programs)` 为空还是包含 `optprog`。\n\n虽然在\
  \ `configure.ac` 和 `Makefile.am` 中都指定 `optprog` 似乎是多余的，但 Automake 需要 `EXTRA_PROGRAMS`\
  \ 中的信息，因为它无法尝试解释 `configure.ac` 中定义的 `$(optional_programs)` 的可能值。因此，在此示例中将 `optprog`\
  \ 添加到 `EXTRA_PROGRAMS` 告诉 Automake 生成构建它的规则，即使在特定构建期间 `$(optional_programs)` 不包含\
  \ `optprog`。\n\n#### 主要产品 (Primaries)\n\n*主要产品*（Primaries）类似于产品类，它们代表构建系统可能生成的产品类型。主要产品定义了构建、测试、安装和执行某一类产品所需的步骤集。例如，程序和库使用不同的编译器和链接器命令构建，Java\
  \ 类需要虚拟机来执行它们，而 Python 程序则需要解释器。某些产品类（如脚本、数据和头文件）没有构建、测试或执行语义——只有安装语义。\n\n支持的主要产品列表定义了\
  \ Automake 构建系统可以自动构建的产品类集合。Automake 构建系统仍然可以构建其他产品类，但维护者必须在项目的 `Makefile.am` 文件中显式定义\
  \ make 规则。\n\n深入理解 Automake 主要产品是正确使用 Automake 的关键。当前支持的主要产品完整列表如下。\n\n### PROGRAMS\n\
  当在 PLV 中使用 `PROGRAMS` 主要产品时，Automake 生成 make 规则，使用编译器和链接器为列出的产品构建二进制可执行程序。\n\n###\
  \ LIBRARIES/LIBRARIES\n使用 `LIBRARIES` 主要产品会导致 Automake 生成使用系统编译器和库管理器构建静态存档（库）的规则。`LTLIBRARIES`\
  \ 主要产品执行相同的操作，但生成的规则还会构建 Libtool 共享库，并通过 libtool 脚本执行这些工具（以及链接器）。（我将在第 7 章和第 8 章中详细讨论\
  \ Libtool 包。）Automake 限制了 `LIBRARIES` 和 `LTLIBRARIES` 主要产品的安装位置：它们只能安装在 `$(libdir)`\
  \ 和 `$(pkgldir)`。\n\n### LISP\n`LISP` 主要产品设计用于管理 Emacs Lisp 程序的构建。因此，它期望引用 el 文件列表。你可以在\
  \ Automake 手册第 10.1 节找到有关该主要产品的详细信息。\n\n### PYTHON\nPython 是一种解释语言；python 解释器逐行将\
  \ Python 脚本转换为字节字节码并在转换时执行，因此（就像脚本一样）Python 源文件是可以执行的。使用 `PYTHON` 主要产品告诉 Automake\
  \ 生成规则，使用 `py-compile` 工具将 Python 源文件 (*.py）预编译为标准的（*.pyc）和优化的（*.pyo）字节版本。由于 Python\
  \ 源通常是解释性的，这种编译发生在安装时而不是构建时。\n\n#### JAVA\nJava 是虚拟机平台；使用 `JAVA` 主要产品告诉 Automake\
  \ 生成规则，使用 `javac` 编译器将 Java 源文件 (*.java）转换为 Java 类文件 (*.class)。虽然这个过程是正确的，但并不完整。Java\
  \ 程序（任何有意义的）通常包含多个类文件，并通常封装为 *.jar 或 *.war 文件，这两者都可能包含若干辅助文本文件。`JAVA` 主要产品是有用的，但仅是够用。（我将在“使用\
  \ Autotools 构建 Java 源”中讨论使用和扩展 `JAVA` 主要产品。）\n\n### SCRIPTS\n\n\n\n\n\n`Script`\
  \ 在此上下文中指的是任何解释执行的文本文件——无论是 shell、Perl、Python、Tcl/Tk、JavaScript、Ruby、PHP、Icon、Rexx\
  \ 还是其他。Automake 为 `SCRIPTS` 主项允许一组受限制的安装位置，包括 `$(bindir)`、`$(sbindir)`、`$(libexecdir)`\
  \ 和 `$(pkgdatadir)`。虽然 Automake 不生成构建脚本的规则，但它也不假设脚本是项目中的静态文件。脚本通常由 `Makefile.am`\
  \ 文件中的手写规则生成，有时通过使用 `sed` 或 `awk` 工具处理输入文件生成。由于由于原因，脚本不会自动分发。如果你在项目中有一个静态脚本，并希望\
  \ Automake 将其添加到分发归档中，你应该像第 161 页“PLV 和 PSV 饰符”中所讨论的那样，为 `SCRIPTS` 主项加上 `dist` 饰符。\n\
  \n## DATA\n\n在 PLV 中可以使用 `DATA` 主项安装任意数据文件。Automake 为 `DATA` 主项允许一组受限制的安装位置，包括 `$(datadir)`、`$(sysconfdir)`、`$(sharedstatedir)`、`$(localstatedir)`\
  \ 和 `$(pkgdatadir)`。数据文件不会自动分发，因此如果你的项目包含静态数据文件，请像第 161 页“PLV 和 PSV 饰符”中所讨论的那样，对\
  \ `DATA` 主项使用 `dist` 饰符。\n\n## HEADERS\n\n头文件是源文件的一种。如果不是因为某些头文件会被安装，它们可以简单地列在产品源码中。包含已安装库产品公共接口的头文件被安装到\
  \ `$(includedir)` 或由 `$(pkgincludedir)` 定义的特定包子目录，因此此类已安装头文件的最常见 PLV 变量是 `include_HEADERS`\
  \ 和 `pkginclude_HEADERS`。与其他源文件一样，头文件会自动分发。如果你有一个生成的头文件，请像第 161 页“PLV 和 PSV 饰符”中所讨论的那样，在\
  \ `HEADERS` 主项上使用 `nodist` 饰符。\n\n## MANS\n\n`Man pages` 是包含 troff 标记的 UTF-8 文本文件，用户在查看时由\
  \ `man` 命令对其进行渲染。可以使用 `man_MANS` 或 `man*N*_MANS` 产品列表变量安装 man 手页，其中 `N` 代表 0 到 9\
  \ 之间的单数字章节号，或者字母 `l`（用于数学库主题）或 `n`（用于 Tcl/Tk 主题）。`man_MANS` PLV 中的文件应具有数字扩展名，以指示它们所属的\
  \ man 章节，并指示指示目标目录。`man*N*_MANS` PLV 中的文件可以使用数字扩展名，也可以使用 `*.man` 扩展名，并在通过 `make\
  \ install` 安装时被重命名为相关的数字扩展名。项目 man 页默认不分发，因为 man 页通常是生成的，所以你应该像第 161 页“PLV 和 PSV\
  \ 饰符”中所讨论的那样使用 `dist` 饰符。\n\n## TEXINFOS\n\n涉及到 Linux 或 Unix 文档时，`Texinfo`(10) 是\
  \ GNU 项目的首选格式。`makeinfo` 工具接受 Texinfo 源文件（*.texinfo`、`*.txi` 或 `*.texi`）并渲染带有 Texinfo\
  \ 标记的 UTF-8 文本的 info 文件（`*.info`），`info` 工具将其渲染为格式化文本供用户。用于 Texinfo 源的最常见产品列表变量是\
  \ `info_TEXINFOS`。使用此 PLV 会导致 Automake 生成构建 `*.info`、`*.dvi`、`*.ps` 和 `*.html` 文档文件的规则。然而，只有\
  \ `*.info` 文件通过 `make all` 构建并通过 `make install` 安装。为了构建和安装其他类型的文件，你必须在 make 命令行上显式指定\
  \ `dvi`、`ps`、`pdf`、`html`、`install-dvi`、`install-ps`、`install-pdf` 和 `install-html`目标。由于许多\
  \ Linux 发行版默认未安装 `makeinfo` 工具，生成的 `*.info` 文件会自动添加到分发归档中，因此你的最终用户无需去寻找 makeinfo。\n\
  \n### 产品源变量\n\nListing 6-3 中的第二行是 Automake `product source variable`（PSV）的示例。PSV\
  \ 遵循以下模板：\n\n```\n[modifier-list]product_SOURCES = file1 file2 ... fileN\n```\n\n\
  像 PLV 一样，PSV 由多个部分组成：产品名称（在此情况下为 jupiter）和 `SOURCES` 标签。PSV 的值是一个由空格分隔的源文件列表，用于构建\
  \ `product`。Listing 6-3 第二行中 PSV 的值是用于构建 `jupiter` 程序所使用的源文件列表。最终，Automake 将这些文件添加到生成的\
  \ `Makefile.in` 模板中的各种 make 规则依赖列表和命令中。\n\nPSV 的产品标签中只允许出现 make 变量中允许的字符（字母、数字、@\
  \ 符号和下划线）。在 Listing 6-3 的第二行中，PSV 的产品值是用于构建 `jupiter` 程序的源文件列表。最终，Automake 将这些文件添加到生成的\
  \ `Makefile.in` 模板中的各种 make 规则依赖列表和命令中。\n\n只有 make 变量中允许的字符（字母、数字、@ 符号和下划线）才允许出现在\
  \ PSV 的产品标签中。如 Listing 6-7 所示，Automake 对 PLVs 中列出的产品名执行转换。\n\n```\n➊ lib_LIBRARIES\
  \ = libc.a\n\n➋ libc___a = ...\n```\n*Listing 6-7: 非法字符转换为下划线*\n\n在这里，Automake 将\
  \ ➊ libc++.a 转换为 ➋ libc___a（带有三个下划线），用于关联 PSV。\n\n### PLV 和 PSV 饰符\n\n之前定义的 PLV\
  \ 和 PSV 模板中的 modifier-list 部分包含一组可选饰符。以下类似 BNF 的规则定义了饰符列表的格式：\n\n```\nmodifier-list\
  \ = modifier_[modifier-list]\n```\n\n饰符改变其所属变量的正常行为。当前定义的饰符集包括 `dist`、`nodist`、`nobase`\
  \ 和 `notrans`。\n\n`dist` 饰符表示应该分发的文件（即在执行 `make dist` 时包含在软件包中）。例如，假设产品的某些源文件应该分发，某些则不应该，Listing\
  \ 6-8 所示的变量可能在 `Makefile.am` 文件中定义。\n\n```\ndist_myprog_SOURCES = file1.c file2.c\n\
  \nnodist_myprog_SOURCES = file3.c file4.c\n```\n*Listing 6-8: 在 Makefile.am 中使用\
  \ dist 和 nodist 饰符*\n\nAutomake 通常会从 HEADERS 列表中移除相对路径信息。`nobase` 饰符用于抑制 `Makefile.am`\
  \ 文件从子目录获取的安装头文件的路径移除。例如，查看 Listing 6-9 中的 PLV 定义。\n\n```\nnobase_pkginclude_HEADERS\
  \ = mylib.h sys/constants.h\n```\n*Listing 6-9: 在 Makefile.am 中使用 nobase PLV 饰符*\n\
  \n在这一行中可以看到 `mylib.h` 与 `Makefile.am` 位于同一目录，但 `constants.h` 位于 *sys* 子目录。通常，根据\
  \ pkginclude 安装位置前缀，两个文件都会安装到 `$(pkgincludedir)`。然而，由于使用了 `nobase` 饰符，Automake 将保留第二个文件路径的\
  \ `sys/` 部分用于安装，`constants.h` 将安装到 `$(pkgincludedir)/sys`。这对于希望在拷贝文件期间让安装目录结构与项目目录结构相同非常有用。\n\
  \n`notrans` 饰符可以用于那些在安装期间不需要转换名称的 man 页 PLV。（通常，Automake 会生成规则，在安装时将 man 页的扩展名从\
  \ *.man 重命名为 *.N*——其中 *N* 是 *0*、*1*、. . . , *9*、*l*、*n*——）\n\n\n\n\n\n你也可以使用 `EXTRA`\
  \ 前缀作为修饰。当与产品源变量（如 `jupiter_SOURCES`）配合使用时，`EXTRA` 指定与 `jupiter` 产品直接相关的额外源文件，如列表\
  \ 6-10 所示。\n\n```\nEXTRA_jupiter_SOURCES = possibly.c\n```\n\n*列表 6-10：在产品 SOURCES\
  \ 变量中使用 EXTRA 前缀*\n\n在这里，`possibly.c` 可能编译或不编译，取决于 `configure.ac` 中定义的某些条件。\n\n\
  ### 单元测试：支持 make check\n\n在第 3 章中，我们在 `src/Makefile` 中添加了代码，当用户执行 `check` 目标时执行\
  \ `jupiter` 程序并检查输出字符串是否正确。现在我们有足够的信息将检查目标测试添加回我们新的 Automake 构建系统中。为了方便后续讨论，我将 `check`\
  \ 目标的代码复制到列表 6-11 中。\n\n```\n--snip--\n\ncheck: all\n\n        ./jupiter | grep\
  \ \"Hello from .*jupiter!\"\n\n        @echo \"*** ALL TESTS PASSED ***\"\n\n--snip--\n\
  ```\n\n*列表 6-11：来自第 3 章的 check 目标*\n\n幸运的是，Automake 对单元测试有很好的支持。为了将我们的简单 grep 测试添加回新的\
  \ Automake 生成的构建系统，我们可以在 `src/Makefile.am` 的底部添加几行，如列表 6-12 所示。\n\nGit tag 6.1\n\
  \n```\n bin_PROGRAMS = jupiter\n\n   jupiter_SOURCES = main.c\n\n➊ check_SCRIPTS\
  \ = greptest.sh\n\n➋ TESTS = $(check_SCRIPTS)\n\n   greptest.sh:\n\n         echo\
  \ './jupiter | grep \"Hello from .*jupiter!\"' > greptest.sh\n\n         chmod +x\
  \ greptest.sh\n\n➌ CLEANFILES = greptest.sh\n```\n\n*列表 6-12：src/Makefile.am：支持\
  \ check 目标所需的额外代码*\n\n➊ 处的 `check_SCRIPTS` 行是一个 PLV，指向在构建时生成的脚本。由于前缀是 `check`，我们知道此行列出的脚本只有在用户输入\
  \ `make check` 时才会被构建。然而，我们必须提供构建该脚本的 `make` 规则，以及稍后执行 `clean` 目标时删除文件的规则。我们使用 ➌\
  \ 处的 `CLEANFILES` 变量来扩展 Automake 在 `make clean` 期间删除的文件列表。\n\n➋ 处的 `TESTS` 行是列表\
  \ 6-12 中最重要的的一行，因为它指示了当用户执行 `check` 目标时执行哪些目标。（由于 `check_SCRIPTS` 变量包含了这些目标的完整列表，我在这里直接引用了它，因为它本质上是一个\
  \ make 变量。）注意，在这种特定情况下，`check_SCRIPTS` 是多余的，因为 Automake 会生成规则来确保 `TESTS` 中列出的所有程序在执行测试之前都已经构建。然而，当在执行\
  \ `TESTS` 中列出的程序之前构建额外的辅助脚本或程序时，`check_*` PLV 就会变得重要。\n\n这里并不显而易见，但由于我们添加了第一个测试，我们需要在运行\
  \ `make check` 之前重新执行 `autoreconf -i` 以添加一个新的实用脚本：`test-driver`。你可以在 Automake 文档中找到明确说明必须这样做的地方，但让构建直接直接你缺少了什么，因此需要执行\
  \ `autoreconf (-i)` 会更简单。为了让你对这个过程有个感受，让我们先尝试在不运行 `autoreconf`：\n\n```\n$ make check\n\
  \nMaking check in src\n\nmake[1]: Entering directory '/.../jupiter/src'\n\n cd ..\
  \ && /bin/bash /.../jupiter/missing automake-1.15 --gnu src/Makefile\n\nparallel-tests:\
  \ error: required file './test-driver' not found\n\nparallel-tests:   'automake\
  \ --add-missing' can install 'test-driver'\n\nMakefile:255: recipe for target 'Makefile.in'\
  \ failed\n\nmake[1]: *** [Makefile.in] Error 1\n\nmake[1]: Leaving directory '/.../jupiter/src'\n\
  \nMakefile:352: recipe for target 'check-recursive' failed\n\nmake: *** [check-recursive]\
  \ Error 1\n\n$\n```\n\n现在让我们先运行 `autoreconf -i`：\n\n```\n$ autoreconf -i\n\nparallel-tests:\
  \ installing './test-driver'\n\n$\n\n$ make check\n\n/bin/bash ./config.status --recheck\n\
  \nrunning CONFIG_SHELL=/bin/bash /bin/bash ./configure --no-create --no-recursion\n\
  \nchecking for a BSD-compatible install... /usr/bin/install -c\n\nchecking whether\
  \ build environment is sane... yes\n\nchecking for a thread-safe mkdir -p... /bin/mkdir\
  \ -p\n\n--snip--\n\nMaking check in src\n\nmake[1]: Entering directory '/.../jupiter/src'\n\
  \nmake  greptest.sh\n\nmake[2]: Entering directory '/.../jupiter/src'\n\necho './jupiter\
  \ | grep \"Hello from .*jupiter!\"' > greptest.sh\n\nchmod +x greptest.sh\n\nmake[2]:\
  \ Leaving directory '/.../jupiter/src'\nmake  check-TESTS\n\nmake[2]: Entering directory\
  \ '/.../jupiter/src'\n\nmake[3]: Entering directory '/.../jupiter/src'\n\nparallel-tests:\
  \ running 1 test\n\nparallel-tests: 1 test passed\n\nmake[3]: Leaving directory\
  \ '/.../jupiter/src'\n\nmake[2]: Leaving directory '/.../jupiter/src'\nmake[1]:\
  \ Leaving directory '/.../jupiter/src'\n\n$\n```\n\n在运行 `autoreconf -i` 后（注意到 `test-driver`\
  \ 已安装），我们可以看到 `make check` 是成功的。\n\n### 使用便利库降低复杂性\n\nJupiter 软件非常简单，所以为了突出 Automake\
  \ 的某些功能，让我们扩展一下。*便利库*是一个仅在项目内部使用的静态库。我们首先通过在根目录执行以下命令添加库：\n\n```\n$ mkdir common\n\
  $ touch common/jupcommon.h\n$ cp src/main.c common/print.c\n$ touch common/Makefile.am\n\
  ```\n\n现在将 6-13 和 6-14 中的文本分别添加到 *common* 目录下的 *.h* 和 *.c* 文件中。\n\n```\nint print_routine(const\
  \ char * name);\n```\n\n*列表 6-13：common/jupcommon.h：该文件的初始版本*\n\n```c\n#include\
  \ \"config.h\"\n#include \"jupcommon.h\"\n\n#include <stdio.h>\n#include <stdlib.h>\n\
  \n#if HAVE_PTHREAD_H\n# include <pthread.h>\n#endif\n\nstatic void * print_it(void\
  \ * data)\n\n{\n    printf(\"Hello from %s!\\n\", (const char *)data);\n    return\
  \ 0;\n}\n\nint print_routine(const char * name)\n\n{\n\n#if ASYNC_EXEC\n    pthread_t\
  \ tid;\n    pthread_create(&tid, 0, print_it, (void*)name);\n    pthread_join(tid,\
  \ 0);\n\n#else\n    print_it(name);\n\n#endif\n\n    return 0;\n}\n```\n\n*列表 6-14：common/print.c：该文件的初始版本*\n\
  \n你可以看到，`print.c` 是 `main.c` 的副本，经过了一些细微修改（如列表 6-14 所示）。首先，我将 `main` 重命名为 `print_routine`，然后在包含\
  \ `config.h` 之后添加了对 `jupcommon.h` 头文件的包含。该头文件将 `print_routine` 的原型提供给 `src/main.c`，并在\
  \ `main` 中调用它。\n\n接下来，我们修改 `src/main.c`，如列表 6-15 所示，然后将列表 6-16 中的文本添加到 `common/Makefile.am`。\n\
  \n```c\n#include \"config.h\"\n#include \"jupcommon.h\"\n\nint main(int argc, char\
  \ * argv[])\n\n{\n    return print_routine(argv[0]);\n}\n```\n\n\n\n\n\n*Listing\
  \ 6-15:* `src/main.c`: *为了让 main 调用新库而进行的修改*\n\n**注意**\n\n*在 `src/main.c` 顶部包含 `config.h`\
  \ 似乎很奇怪，因为该源文件中似乎没有任何内容使用它。GCS 建议遵循标准做法，在所有源文件的顶部（在任何其他包含语句之前）包含 `config.h`，以防其他包含的头文件中的某些内容使用了\
  \ `config.h` 中的定义。我建议务必严格遵循这一惯做法。*\n\n```\nnoinst_LIBRARIES = libjupcommon.a\n\n\
  libjupcommon_a_SOURCES = jupcommon.h print.c\n```\n\n*Listing 6-16:* `common/Makefile.am`:\
  \ *该文件的初始版本*\n\n让我们来看这个新的 `Makefile.am` 文件。第一行指示该文件应该构建并安装哪些产品。`noinst` 前缀表示该库的设计初衷仅是为了方便使用\
  \ `common` 目录中的源代码。\n\n我们正在创建一个名为 `libjupcommon.a` 的静态库，也称为*归档 (archive)*。归档类似于只包含对象文件\
  \ (`.o`) 的 *.tar* 文件。它们不能像共享库那样被执行或加载到进程地址空间，但可以像对象文件一样被添加到链接器命令行中。链接器足够智能，能够意识到此类归档仅仅是对象文件的组。\n\
  \n**注意**\n\n*链接器命令行上显式指定的每个对象文件都添加到二进制产品中，但它们只会从归档中提取被链接代码中实际引用的对象文件。因此，如果你链接到一个包含\
  \ 97 个对象的文件的静态库，但你只直接或间接地调用了其中两个文件中的函数，那么只有这两个对象文件会被添加到你的程序中。相比之下，链接到 97 个原始对象文件会将这\
  \ 97 个文件全部添加到你的程序中，无论你是否使用了它们中的任何功能。*\n\nListing 6-16 中的第二行是一个产品源变量，包含了与该库相关的源文件列表。^(11)\n\
  \n#### 产品选项变量\n\n现在，我们需要向 `src/Makefile.am` 添加一些额外信息，以便生成的 `Makefile` 能找到我们添加到 `common`\
  \ 目录的新库和头文件。让我们向现有的 `Makefile.am` 文件再添加两行，如 Listing 6-17 所示。\n\n```\n bin_PROGRAMS\
  \ = jupiter\n\n   jupiter_SOURCES = main.c\n\n➊ jupiter_CPPFLAGS = -I$(top_srcdir)/common\n\
  \n➋ jupiter_LDADD = ../common/libjupcommon.a\n\n   --snip--\n```\n\n*Listing 6-17:*\
  \ `src/Makefile.am`: *向 `Makefile.am` 文件添加编译器和链接器指令*\n\n与 `jupiter_SOURCES` 变量类似，这两个新变量派生自程序名称。这些*产品选项变量\
  \ (POVs)* 用于为从源码构建产品的工具指定特定于产品的选项。\n\n➊ 处的 `jupiter_CPPFLAGS` 变量为为 `jupiter` 程序编译的所有源文件在编译器命令行中添加特定产品的\
  \ C 预处理器标志。`-I$(top_srcdir)/common` 指令告诉 C 预处理器在其查找头文件引用的位置列表中添加 `$(top_srcdir)*/common`。^(12)\n\
  \n➋ 处的 `jupiter_LDADD` 变量为 `jupiter` 程序的链接器命令行添加库。文件路径 `../common/libjupcommon.a`\
  \ 只是向链接器命令行添加了一个对象，以便该库中的代码成为最终程序的一部分。\n\n**注意**\n\n*你也可以用 `$(top_builddir)*` 代替\
  \ `../` 来引用该路径中 `common` 目录的位置。使用 `$(top_builddir)` 的额外优点是更容易将此 `Makefile.am` 文件移动到另一个位置，而无需修改它。*\n\
  \n将库添加到 `program_LDADD` 或 `library_LIBADD` 变量仅对于作为你自己的包的一部分构建的库是必要的。如果你与用户系统中已安装的库链接你的程序，在\
  \ `configure.ac` 中调用 `AC_CHECK_LIB` 或 `AC_SEARCH_LIBS` 将导致生成的配置脚本通过 `LIBS` 变量向链接器命令行添加适当的引用。\n\
  \nAutomake 支持的 POV 大多派生自第 71 页表 3-2 列出的标准用户变量子集。你可以在*GNU Autoconf Manual*中找到程序和库选项变量的完整列表，但这里有一些重要的变量。\n\
  \n`product_CPPFLAGS`\n\n使用 `product_CPPFLAGS` 向编译器命令行上的 C 或 C++ 预处理器传递标志。\n\n`product_CFLAGS`\n\
  \n使用 `product_CFLAGS` 向编译器命令行传递 C 编译器标志。\n\n`product_CXXFLAGS`\n\n使用 `product_CXXFLAGS`\
  \ 向编译器命令行传递 C++ 编译器标志。\n\n`product_LDFLAGS`\n\n使用 `product_LDFLAGS` 向链接器传递全局且与顺序无关的共享库和程序链接器配置标志和选项，包括\
  \ `-static`。\n\n`program_LDADD`\n\n使用 `program_LDADD` 向链接器命令行添加 Libtool 对象 (*.lo*)\
  \ 或库 (*.la*)。^(13)\n\n`library_LIBADD`\n\n使用 `library_LIBADD` 向命令行添加 Libtool 对象\
  \ (*.o*)。\n\n`ltlibrary_LIBADD`\n\n使用 `ltlibrary_LIBADD` 添加 Libtool 对象 (*.lo*) 或库\
  \ (*.la*)。\n\n#### 每 Makefile 选项变量\n\n你经常会在 `Makefile.am` 文件中使用 Automake 变量 `AM_CPPFLAGS`\
  \ 和 `AM_LDFLAGS`。这些标志的每 Makefile 形式用于维护者希望对 Makefile 文件中指定的所有产品应用相同标志集的情况。例如，如果你需要为\
  \ `Makefile.am` 中的所有产品设置一组预处理器标志，然后为某个特定产品（prog1）添加额外标志，你可以可以使用 Listing 6-18 所示的语句。\n\
  \n```\n AM_CFLAGS = ... some flags ...\n\n   --snip--\n\n➊ prog1_CFLAGS = $(AM_CFLAGS)\
  \ ... more flags ...\n\n   --snip--\n```\n\n\n\n\n\n接下来，我们需要编辑顶层 `Makefile.am` 文件中的\
  \ `SUBDIRS` 变量，以便包含我们刚刚添加的 `common` 目录。我们还需要将 `common` 目录中生成的新 Makefile 添加到 `configure.ac`\
  \ 中 `AC_CONFIG_FILES` 宏调用的从模板生成的文件列表中。这些更改已在列表 6-19 和列表 6-20 中所示。\n\n```\nSUBDIRS\
  \ = common src\n```\n\n*列表 6-19：* Makefile.am：*将 common 目录添加到 `SUBDIRS` 变量*\n\n\
  ```\n--snip--\n\nAC_CONFIG_FILES([Makefile\n\n                 common/Makefile\n\
  \n                 src/Makefile])\n\n--snip--\n```\n\n*列表 6-20：* configure.ac：*将*\
  \ `common/Makefile` *添加到 `AC_CONFIG_FILES` 宏*\n\n这是我们目前为止所做的最大范围更改，但由于我们正在重组整个应用程序，这看起来是合理的。让我们尝试一下更新后的构建系统。在\
  \ `autoreconf` 命令行中添加 `-i` 选项，以便在这些增强后安装可能需要的任何额外缺失文件。在经历了这么多更改后，我喜欢从干净的状态开始，因此从\
  \ `make distclean` 开始，或者如果你是从 git 仓库工作区运行，可以使用某种形式的 `git clean` 命令。\n\n```\n $ make\
  \ distclean\n\n   --snip--\n\n   $ autoreconf -i\n\n   configure.ac:11: installing\
  \ './compile'\n\n   configure.ac:6: installing './install-sh'\n\n   configure.ac:6:\
  \ installing './missing'\n\n   Makefile.am: installing './INSTALL'\n\n   Makefile.am:\
  \ installing './COPYING' using GNU General Public License v3 file\n\n   Makefile.am:\
  \     Consider adding the COPYING file to the version control\n   system\n\n   Makefile.am:\
  \     for your code, to avoid questions about which license your\n   project uses\n\
  \n➊ common/Makefile.am:1: error: library used but 'RANLIB' is undefined\n\n   common/Makefile.am:1:\
  \  The usual way to define 'RANLIB' is to add 'AC_PROG_\n   RANLIB'\n\n   common/Makefile.am:1:\
  \  to 'configure.ac' and run 'autoconf' again.\n\n   common/Makefile.am: installing\
  \ './depcomp'\n\n   parallel-tests: installing './test-driver'\n\n   autoreconf:\
  \ automake failed with exit status: 1\n\n   $\n```\n\n嗯，看起来我们还没有完全完成。由于我们向构建系统添加了新类型的实体——静态库，automake（通过\
  \ `autoreconf`）在 ➊ 处告诉我们，需要在 `configure.ac` 文件中添加一个新宏 `AC_PROG_RANLIB`。^(15)\n\n\
  如列表 6-21 所示，将此宏添加到 `configure.ac` 中。\n\n```\n--snip--\n\n# Checks for programs.\n\
  \nAC_PROG_CC\n\nAC_PROG_INSTALL\n\nAC_PROG_RANLIB\n\n--snip--\n```\n\n*列表 6-21：*\
  \ configure.ac：*添加 `AC_PROG_RANLIB`*\n\n最后，再次输入 `autoreconf -i`。添加 `-i` 确保如果我们在\
  \ `configure.ac` 中添加的新功能需要安装任何额外文件，`autoreconf` 将执行该操作。\n\n```\n$ autoreconf -i\n\
  \n$\n```\n\n没有更多抱怨了；一切正常。\n\n### 发行包包含什么？\n\nAutomake 通常会自动决定哪些内容应该包含在通过 `make dist`\
  \ 创建的发行中，因为它非常清楚每个文件在构建过程中的作用。为此，Automake 希望被告知用于构建产品的每个源文件，以及被安装的每个文件和产品。这自然意味着，所有文件必须在一个或多个\
  \ `PLV` 和 `PSV` 变量的某处被指定。^(16)\n\nAutomake 的 `EXTRA_DIST` 变量包含一个空格分隔的文件和目录列表，当执行\
  \ `dist` 目标时，这些内容应被添加到发布包中。例如：\n\n```\nEXTRA_DIST = windows\n```\n\n你可以使用 `EXTRA_DIST`\
  \ 变量向发布包中添加 Automake 不会自动添加的源目录——例如 Windows 特有的目录。\n\n**注意**\n\n*在这种情况下*，`windows`\
  \ 是一个目录而不是文件。Automake 会自动递归地将此目录中的每个文件添加到发布包中；这可能包括一些你并不想要放在那里的，例如隐藏的 `.svn` 或 `.CVS`\
  \ 状态目录。请参见第 389 页上的“Automake -hook and -local Rules”以解决这个问题。*\n\n关于工具脚本的说明\n\nAutotools\
  \ 在项目目录结构的根目录下添加了几个文件：`compile`、`depcomp`、`install-sh` 和 `missing`。由于 `configure`\
  \ 或生成的 `Makefiles` 在构建过程的各个点都会执行这些脚本，终端用户需要它们；然而，我们只能从 Autotools 获取它们，而且我们不希望要求用户安装\
  \ Autotools。因此，这些脚本会被添加到发布中。\n\n那么，是否将它们提交到版本控制？答案存在争议，但通常建议不要。任何发布维护者应该安装 Autotools。任何在工作区的维护者应该运行\
  \ `autoreconf -i`（可能结合 `--force` 选项](#ch06.xhtml_ch06fn_15））以确保他们拥有最新的工具。如果你将它们提交进去，随着时间的推移，它们可能会过时。我的这种观点也适用于配置脚本。有些人人认为将工具脚本提交到存储库是有益的，因为这确保了在没有安装\
  \ Autools 的情况下也能构建项目。然而，我的个人哲学是，开发者和维护者应该拥有这些工具。偶尔，终端用户需要从工作区构建项目。\n\n### 维护者模式\
  \ (Maintainer Mode)\n\n偶尔，发行源文件的时间戳会比用户系统的当前时间更新。无论原因如何，这种不一致会误导 make，使其认为每个源文件已过期并需要重新构建。结果是它将重新执行\
  \ Autotools 以更新配置脚本和 `Makefile.in` 模板。但作为维护者，我们并不真正期望用户安装 Autotools——或者至少不是我们在系统中安装的最新版本。\n\
  \n这就是 Automake 的*维护者模式*大显用场。默认情况下，Automake 在 Makefile 中添加规则，从维护者源文件（如 `Makefile.am`\
  \ 和 `configure.ac`）以及 Lex 和 Yacc 输入文件重新生成模板文件、配置脚本和源码。然而，我们可以在 `configure.ac` 中使用\
  \ Automake 的 `AM_MAINTAINER_MODE` 宏来禁用默认的维护者级 make 规则生成。\n\n对于希望保留这些规则以便在构建系统更改后正确更新的维护者，`AM_MAINTAINER_MODE`\
  \ 宏提供了一个配置脚本命令行选项（`--enable-maintainer-mode`），它告诉配置生成包含规则和命令的模板，这些规则会在必要时执行 Autotools。\n\
  \n\n\n\n\n维护者必须意识到在项目中使用 `AM_MAINTAINER_MODE` 的。在运行 `configure` 时，他们将需要使用此命令行选项，以生成完整的构建系统，这样当源代码被修改时，该系统能够正确重新构建由\
  \ Autotools 生成的文件。\n\n**注意**\n\n我还建议在项目的 `INSTALL` 或 `README` 文件中提到维护者模式的使用，这样终端用户在修改\
  \ Autotools 源码但发现没有效果时，就不会感到意外。\n\n尽管 Automake 的维护者模式有其优点，但你应该知道，有各种反对使用它的理由。大多数意见集中在一种观点上，即\
  \ `make` 规则永远不应该被刻意限制，因为这样做生成的构建系统在某些情况下总是会失败。然而，我要指出，较新版本的 Autotools 在缺少必要工具时，告知你发生了什么的情况方面做得好得多。事实上，这正是“缺失脚本（missing\
  \ script）”的作用。大多数工具的调用都封装在缺失脚本中，它会非常清楚地告诉你缺少了什么，以及在缺失时如何安装它。\n\n使用此宏的另一个重要考虑因素是，你现在将测试矩阵的行数增加了一倍，因为每个构建选项都有两种模式——一个假设已安装了\
  \ Autotools，另一个假设则相反。如果你决定使用该宏默认为你的终端用户禁用维护者模式，请记住这些点。\n\n### 消除噪声\n\n基于 Autotools\
  \ 的构建系统所产生的噪声一直是 Automake 邮件列表上争议最大的的话题之一。一派喜欢静默构建（quiet builds），这种构建只显示重要信息，例如警告和错误。另一派则认为，有价值的信息通常嵌入在这些所谓的“噪声”中，因此所有信息都是重要的，应该被显示。偶尔，会有新的\
  \ Autotools 开发者会发布一个关于如何减少 `make` 显示信息量的问题。这几乎会引发一场持续几天、涉及几十封邮件的热烈辩论。老手们只是对此付之一笑，并经常开玩笑说“又有人打开了开关”。\n\
  \n事实真相是，双方都有道理。GNU 项目的核心在于选项，因此 Automake 维护者增加了一项功能，允许你可选地为用户提供“静默规则（silent rules）”。Automake\
  \ Makefile 中的静默规则并不是真正的静默；它们只是比传统的 Automake 生成的规则噪小那么一点。\n\n### 静默规则不再显示整个编译器或链接器的命令行，而是显示一行简短的内容，指示工具以及该工具正在处理的文件名。`make`\
  \ 生成的输出仍然会显示，以便用户知道当前正在处理哪个目录和目标。以下是启用了静默规则的 Jupiter 构建输出（先执行 `make clean` 以确保确实构建了内容）：\n\
  \n```\n$ make clean\n\n--snip--\n\n$ configure --enable-silent-rules\n\n--snip--\n\
  \n$ make\n\nmake  all-recursive\n\nmake[1]: Entering directory '/.../jupiter'\n\n\
  Making all in common\n\nmake[2]: Entering directory '/.../jupiter/common'\n  CC\
  \       print.o\n\n  AR       libjupcommon.a\n\nar: `u' modifier ignored since `D`\
  \ is the default (see `U`)\n\nmake[2]: Leaving directory '/.../jupiter/common'\n\
  \nMaking all in src\n\nmake[2]: Entering directory '/.../jupiter/src'\n\n  CC  \
  \     jupiter-main.o\n\n  CCLD     jupiter\n\nmake[2]: Leaving directory '/.../jupiter/src'\n\
  \nmake[2]: Entering directory '/.../jupiter'\n\nmake[2]: Leaving directory '/.../jupiter'\n\
  \nmake[1]: Leaving directory '/.../jupiter'\n\n$\n```\n\n如你所示，使用静默规则对 Jupiter 并没有很大影响——Jupiter\
  \ 的构建系统花费大量时间在目录之间切换，而实际构建东西花费的时间很少。但在具有数百个源文件的项目中，你会看到长长的 `CC filename.o` 行列表，偶尔会有指示\
  \ `make` 正在切换目录或链接器正在构建产品——编译器警告往往会跳出来。例如，输出中的 `ar` 警告如果没有静默规则，就会被忽略掉。\n\n静默规则默认被禁用。若要在\
  \ Automake 生成的 `Makefile.am` 模板中默认启用静默规则，你可以在 `configure.ac` 中带有 `yes` 参数调用 `AM_SILENT_RULES`\
  \ 宏。\n\n任何情况下，用户始终可以在 `configure` 命令行上通过 `--enable-silent-rules` 或 `--disable-silent-rules`\
  \ 设置构建的默认详细程度。构建将根据配置的默认值以及用户在 `make` 命令行上是指定 `V=0` 还是 `V=1` 来处于“静默”模式或正常模式。\n\n\
  **注意**\n\n这两个 `configure` 选项都不是必需——静默规则的实际调用最终由生成的 makefile 中的 `V` 变量控制。`configure`\
  \ 选项仅设置了 `V` 的默认值。\n\n对于较小的项目，发现 Automake 的静默规则不如直接在 `make` 命令行上将 `stdout` 重定向到\
  \ `/dev/null` 那么用，方法如下：\n\n```\n$ make >/dev/null\n\nar: `u' modifier ignored since\
  \ `D` is the default (see `U`)\n\n$\n```\n\n正如此示例所示，警告和错误仍然显示在 `stderr` 上，通常包含足够的信息让你判断问题所在的位置（尽管在本例中不是）。在这种情况下，无警告的构建是真正静默的。你应该使用这种技术来定期清理源代码中的编译器警告。静默规则是有帮助的，因为警告在构建输出中会很醒目。\n\
  \n### 非递归 Automake\n\n现在我们已经将手写的 `Makefile.in` 模板更改为 Automake 的 `Makefile.am`，让我们来看看将此递归构建系统转换为非递归系统的过程。在之前的章节中，我们看到使用\
  \ `make` 的 `include` 指令对于将 Makefile 划分到各个区域是有用的。然而，使用 Automake 时，将所有内容放在顶层文件中更为简单，因为内容非常短，我们可以一眼看懂整个构建系统。如果需要进一步划分职责，一个简单的注释即可。\n\
  \n这里的关键与我们之前的版本一样，是像从顶层目录运行一样引用内容（再次，确实如此）。\n\n列表 6-22 包含了顶层 `Makefile.am` 的完整内容——这是在这个转换中唯一使用的文件。\n\
  \n```\n## 6.3\nnoinst_LIBRARIES = common/libjupcommon.a\n\ncommon_libjupcommon_a_SOURCES\
  \ = common/jupcommon.h common/print.c\n\nbin_PROGRAMS = src/jupiter\n\nsrc_jupiter_SOURCES\
  \ = src/main.c\n\nsrc_jupiter_CPPFLAGS = -I$(top_srcdir)/common\n\nsrc_jupiter_LDADD\
  \ = common/libjupcommon.a\n\ncheck_SCRIPTS = src/greptest.sh\n\nTESTS = $(check_SCRIPTS)\n\
  \nsrc/greptest.sh:\n        echo './src/jupiter | grep \"Hello from .*!\"' > src/greptest.sh\n\
  \        chmod +x src/greptest.sh\n\nCLEANFILES = src/greptest.sh\n```\n\n*列表 6-22:*\
  \ Makefile.am: *Jupiter 的非递归 Automake 实现*\n\n如你所见，我们将顶层 `Makefile.am` 文件中的 `SUBDIRS`\
  \ 变量替换为该变量引用的每个目录下的 `Makefile.am` 文件的完整内容。我们为每个输入对象和产品添加了适当的相对路径信息，以便从顶层目录访问源文件（它们实际上位于各自的子目录中），并确保产品出现在它们应该的位置（即使在不在源码树中构建时，也位于正确的对应目录下）。我标出了粘贴到顶层文件的每个子目录\
  \ `Makefile.am` 文件所做的更改。\n\n\n\n\n注意，在产品源变量前添加了 `common_` 或 `src_`，因为这些前缀现在已确实成为产品名称的一部分。最终，这些名称被用于创建\
  \ `make` 目标，而这些目标的定义很大程度上取决于它们的位置而非名称。通常情况下，位置是当前目录，因此目录部分被静默省略了。对于我们的非递归构建，产品现在生成在当前目录以外的位置，因此必须显式说明。与产品名称中的任何其他特殊字符一样，分隔目录的斜杠在\
  \ `PSVs` 中会变为下划线。\n\n我们还需要添加 `Automake` 选项，并从 `configure.ac` 中移除多余的 `Makefile` 引用，如列表\
  \ 6-23 所示。\n\n```autoconf\n#                                               -*- Autoconf\
  \ -*-\n\n# 使用 autoconf 处理此文件以生成一个 configure 脚本。\n\nAC_PREREQ([2.69])\n\nAC_INIT([Jupiter],\
  \ [1.0], [jupiter-bugs@example.org])\n\nAM_INIT_AUTOMAKE([subdir-objects])\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \nAC_CONFIG_HEADERS([config.h])\n\n--snip--\n\n# 检查库函数。\n\nAC_CONFIG_FILES([Makefile])\n\
  \nAC_OUTPUT\n\ncat << EOF\n\n--snip--\n```\n\n*列表 6-23:* `configure.ac`: *为非递归构建移除多余的\
  \ makefile 引用*\n\n`Automake` 的 `subdir-objects` 选项是必要的，它告诉 `Automake` 你打算访问源文件所在目录以外的其他目录中的文件。还需要声明你希望将对象和其他中间产品生成在与源文件相同的目录中（或在相应的树外构建对应目录）。此选项并非非递归构建所必需，而是适用于任何你可能需要在源文件目录之外构建一个或多个源文件的情况。如果你省略此选项，构建通常仍然可以工作，但你会看到两个效果：`autoreconf`（或\
  \ `automake`）会生成警告，指示你可能应该该选项，并且对象文件将留在错误的目录中。后者只有在你恰好在不同目录中有多个同名源文件实例时才会成为问题，在这种情况下，第二个对象文件将覆盖第一个，这很可能导致链接器在无法找到已被覆盖的第一个对象的符号时发生错误。\n\
  \n最后，我们可以简单地删除 `common` 和 `src` 目录下的 `Makefile.am` 文件：\n\n```bash\n$ rm common/Makefile.am\
  \ src/Makefile.am\n\n$\n```\n\n### 总结\n\n在本章中，我们讨论了如何通过一个已经为 `Autoconf` 进行插桩的项目，为\
  \ `Automake` 进行插桩。（新的项目通常会同时为 `Autoconf` 和 `Automake` 进行插桩。）\n\n我们涵盖了使用 `SUBDIRS`\
  \ 变量将 `Makefile.am` 文件连接在一起，以及围绕产品列表、产品源和产品选项变量的概念。除了产品列表变量外，我还讨论了 `Automake` 原语（primaries）——这是\
  \ `Automake` 的核心概念。最后，我讨论了使用 `EXTRA_DIST` 向分发包添加额外文件、使用 _AM_MAINTAINER_MODE` 宏以确保用户不需要安装\
  \ `Autotools`、转换为非递归的 `Automake` 构建系统，以及 `Automake` 静默规则的使用。\n\n通过这一切，我们用简短、简洁的\
  \ `Makefile.am` 文件替换了手写的 `Makefile.in` 模板，这些文件提供了多多的功能。我希望这次练习已经让你开始意识到 `Automake`\
  \ 而非手写 makefiles 的好处。\n\n在第 7 章和第 8 章中，我们将研究向 `Jupiter` 项目添加 `Libtool`。在第 9 章中，我们将通过深入\
  \ `Autoconf` 的可移植测试框架——autotest，完成对 `Autotools` 本身的介绍。然后，在第 10 章到第 13 章中，我们将暂时离开\
  \ `Autotools` 来处理一些重要的边缘话题，但我们将在第 14 章和第 15 章中回来，届将在探索 `Automake` 其他几个重要方面的同时，对一个真实世界的项目进行“Autotool\
  \ 化”。\n\n## 7 使用 LIBTOOL 构建库\n\n*岁月教给了许多日子永远不知道的事。*\n\n— 拉尔夫·华尔德·爱默生，《经验》*\n\n![图像](img/common.jpg)\n\
  \n在没有 GNU `Libtool` 帮助的情况下为多个平台构建共享库经历了太多的糟糕经历后，我得出了结论。首先，发明共享库概念的人应该加薪……并发笔奖金。其次，那个决定将共享库管理接口和命名约定留给实现的人应该被挨打。\n\
  \n`Libtool` 的存在本身就是这种情感之真实性的证言。`Libtool` 的存在只有一个原因——为想要以可移植方式创建和访问共享库的开发者提供一个标准的、抽象的接口。它同时抽象了共享库的构建过程以及用于在运行时动态加载和访问共享库的编程接口。\n\
  \n`Libtool` 包的概念是由 Gordon Matzigkeit 在 1996 年 3 月设计并完成初始实现的。在此之前，没有构建共享库的标准跨平台机制。`Autoconf`\
  \ 和 `Automake` 在构建跨平台项目方面表现良好——只要你不尝试构建共享库。然而，一旦你踏上这条路，你的代码和构建系统将充斥着用于共享库管理的条件结构。这是一项巨大的工程，因为正如我们将看到的，构建共享库在不同平台之间差异巨大。Thomas\
  \ Tanner 从 1998 年 11 月开始贡献共享库动态加载的跨平台抽象——ltdl。那之后的贡献者还包括 Alexandre Oliva、Ossama\
  \ Othman、Robert Boehne、Scott James Remnant、Peter O’Gorman 以及 Ralf Wildenh。目前，Libtool\
  \ 包由 Gary V. Vaughn（他自 1998 年以来一直为 Libtool 做出贡献）和 Bob Friesenhahn（他的优秀建议自 1998 年以来被采用）维护。\n\
  \n在讨论 `Libtool` 的正确用法之前，我将用几段文字介绍共享库的功能和特性，以便你理解我涵盖的内容范围。\n\n### 共享库的好处\n\n共享库提供了一种方便部署可重用功能包的方式。你可以在程序加载时自动（使用操作系统加载器）或通过应用程序本身的代码手动将共享库加载到进程地址空间中。应用程序从共享库绑定功能点是非常灵活的，开发者根据程序设计和最终用户的需求来决定。\n\
  \n程序可执行文件与定义为共享库的模块之间的接口必须设计得合理，因为共享库接口必须有良好的规范。这种严格的规范促进了良好的设计实践。当你使用共享库时，系统实际上在迫使你成为更好的程序员。\n\
  \n共享库可以（正如其名）在进程之间共享。这种共享是字面上的。共享库的代码段可以只加载到物理内存页中。这些相同的内存页可以同时映射到多个程序的进程地址空间中。当然，数据页对于每个进程来说是唯一的，但与共享库的代码段相比，全局数据段通常小得多。这才是真正的效率。\n\
  \n\n\n\n在程序升级期间，更新共享库是非常的。即使软件软件包的两个版本之间基础程序没有变化，只要新版本的接口没有发生变化，你就可以用新版本的共享库替换旧版本。如果接口*确实发生了*变化，同一个共享库的两个版本可能会共存在于同一个目录中，这是因为各种平台上共享库使用的版本控制方案（并由\
  \ `Libtool` 支持）允许一个库的多个版本在文件系统中具有不同的名称，但被操作系统的加载器视为同一个库。旧版本的程序将继续使用旧版本的库，而新版本的程序则可以自由使用较新的版本。\n\
  \n如果一个软件软件包指定了定义良好的插件接口，那么可以使用共享库来实现用户可配置的加载式功能。这意味着在程序发布后，可以获得额外的功能，而且如果你发布了一份描述你的插件接口规范的文档（或者第三方开发者足够聪明，能自己搞出来），第三方开发者甚至可以为你的程序添加功能。\n\
  \n这类系统有几个广为人知的例子。例如，Eclipse 几乎是一个纯插件框架。基础可执行文件支持除了定义良好的插件接口之外的内容。Eclipse 应用中的大部分功能都来自库函数。Eclipse\
  \ 用 Java 编写的，并使用 Java 类库和 `*.jar` 文件，但无论语言或平台如何，原理都是相同的。\n\n### 共享库如何工作\n\n遵循 POSIX\
  \ 标准的操作系统实现共享库的具体细节因平台而异，但总体思想是相同的。共享库提供了可执行代码块，操作系统可以将这些代码加载到程序的地址空间并执行。以下讨论适用于链接器在程序构建时解析的共享库引用，以及操作系统加载器在程序加载时解析的共享库引用。\n\
  \n虽然编译器产生的对象文件 `*.o` 包含可执行代码，但它们不能直接从命令行执行。这是因为它们是不完全的，包含了对外部实体（函数和全局数据项）的符号引用或*链接*，这些引用必须经过修复。这种修复是通过使用一个用于管理此类链接的工具，将包含此类引用的完整对象文件组合而成的。\n\
  \n### 加载时的动态链接\n\n在构建程序可执行镜像的过程中，链接器（正式称为*链接编辑器*）会维护一个符号表——包含函数入口和全局数据地址。在累积的对象代码体中引用的每个符号在链接器找到它时都会此表中。当定位符号定义时，链接器将表中的符号引用解析到代码中的地址。在链接过程结束时，所有包含被引用符号定义的对象文件（或简单称为*对象*）将被链接在一起，并成为程序可执行镜像的一部分。\n\
  \n静态库（也称为存档）中发现的未包含被引用符号定义的对象会被丢弃，但显式链接的对象即使不包含被引用的符号定义也会被添加到二进制镜像中。如果在分析完所有对象后，符号表中仍有未完成的引用，链接器将带有错误消息退出。如果成功，最终的可执行镜像可以由用户加载并执行。此时，该镜像是完全自给自足的，不依赖任何外部二进制代码。\n\
  \n假设所有未定义的引用在链接过程中都已解决，如果认为要链接的对象列表包含一个或多个共享库，链接器将从链接器命令行指定的所有*非共享*对象构建可执行镜像。这包括所有的单独对象文件（`*.o`）和包含静态库存档（`*.a`）中的所有对象。然而，链接器会在二进制镜像头部添加两个表。第一个是未完成的*外部引用表*——一个指向在链接过程中仅在共享库中找到的符号定义的引用表。第二个是*共享库表*，包含了发现未完成未定义引用的共享库名称和版本列表。\n\
  \n当操作系统加载器尝试加载程序时，它必须将外部引用表中的剩余未完成引用解析为从共享库表所示的共享库中导入的符号。如果加载器无法解析所有引用，就会发生加载错误，并带有操作系统错误消息终止进程。请注意，这些外部符号没有绑定到特定的共享库。只要它们在共享库表所搜索的任何库中被找到，就会被接受。\n\
  \n**注意**\n\n此过程与 Windows 操作系统加载器解析动态链接库（DLL）中符号的方式略有不同。在 Windows 上，链接器在程序构建时将特定符号绑定到特定命名的\
  \ DLL。\n\n使用浮空外部引用既有优点也有缺点。在某些操作系统上，未绑定的符号可以通过用户指定的库来。这意味着用户可以通过预加载一个包含相同符号的库，在运行时完全替换库（或库的一部分）。例如，在\
  \ BSD 和基于 Linux 的系统上，用户可以使用 `LD_PRELOAD` 环境变量将共享库注入进程地址空间。由于加载器在加载任何其他库之前加载这些库，因此加载器在尝试解析外部引用时会在预加载的库中定位符号。程序作者预期的库甚至不会被检查，因为这些库提供的符号已经由预加载的库解决了。\n\
  \n在下面的示例中，在包含 `LD_PRELOAD` 变量的环境中执行 Linux `df` 工具。该变量被设置为指向库的路径，该库包含一个与 C `malloc`\
  \ 接口兼容的堆管理器。这种技术可以用于调试程序中的内存问题。通过预加载自己的堆管理器，你可以在日志文件中捕获内存分配——例如为了调试内存块溢出。这种技术被常用的调试辅助工具如\
  \ *Valgrind* 包使用。\n\n在此处，在执行 `df` 程序的同一命令行上设置了 `LD_PRELOAD` 环境变量。这段 Shell 代码导致仅\
  \ df 子进程环境包含 `LD_PRELOAD` 变量，并被设置为指定的值：\n\n```$ LD_PRELOAD=$HOME/lib/libmymalloc.so\
  \ /bin/df\n\n--省略部分内容--\n\n$\n```\n\n不幸的是，浮空符号也可能导致问题。例如，两个库可能提供相同的符号名称，动态加载器可能会无意中将执行文件绑定到错误库的符号上。在最好的情况下，当向不匹配的函数传递错误的参数时，会导致程序崩溃。在最坏的情况下，这可能会带来安全风险，因为不匹配的函数可能被用于捕获程序传递的密码和安全凭据。\n\
  \nC 语言符号不包含参数信息，因此符号很可能会这样发生冲突。C++ 符号要安全一些，因为整个函数签名（返回类型除外）编码在符号名称中。然而，即使是 C++ 也无法免受黑客的影响，他们故意用自己的函数版本替换安全函数（当然，假设他们有访问你的运行时共享库搜索路径的权限）。\n\
  \n\n\n\n\n## 运行时的自动动态链接\n\n操作系统加载器也可以使用一种非常晚期的绑定形式，通常被称为 `lazy binding`（延迟绑定）。在这种情况下，程序头文件中的外部引用表条目被初始化，使得它们指向动态加载器内部的代码。\n\
  \n当程序首次调用 `lazy entry`（延迟条目）时，该调用会被路由到加载器，加载器随后会（可能）加载正确的共享库，确定函数的实际地址，重置跳转表中的入口，最后将处理器重定向到共享库函数（此时该函数已可用）。下一次发生这种情况的情况时，跳转表条目已经过正确初始化，程序将直接跳转到被调用的函数。这种方式非常高效，因为由于修复（fix-up）后的跳转开销并不大于普通的间接函数调用，而且初始加载和链接的成本被分摊到了进程生命周期内对该函数的多次调用中。^(3)\n\
  \n这种延迟绑定机制使得程序启动非常快，因为符号在需要之前不进行绑定的共享库，在应用程序首次引用它们之前甚至不会被加载。但请考虑一下——程序可能*永远*不会引用它们。这意味着它们可能永远不会被加载，从而节省了时间和空间。这种情况的一个很好的例子可能是通过共享库实现同义词功能的文字处理程序。你多久使用一次同义词？如果程序使用的是自动动态链接，很有可能在大多数文字处理会话中，包含同义词代码的共享库将永远不会被加载。\n\
  \n尽管这个系统看起来很完美，但可能存在问题。虽然使用自动运行时动态链接可以给你带来更快的加载速度、更好的性能和更高效的空间利用，但它也可能导致应用程序在没有任何警告的情况下突然终止。在加载器找不到请求的符号的情况下（可能是因为缺少所需的库），它除了终止进程外别无其他选择。\n\
  \n为什么不在程序加载时就确保所有符号都存在呢？因为如果加载器在加载时解析所有符号，那么它大可以在那个点同时填充跳转表条目。毕竟，它必须加载所有库来确保符号确实存在，因此这将完全违背了使用延迟绑定的目的。此外，即使加载器在程序首次启动时检查了所有外部引用，也没有什么能阻止人在程序运行期间、程序使用之前删除其中一个或多个库。^(4)\
  \ 因此，即使是预检查也白费了。\n\n这个故事的教训是世界上没有免费的午餐。如果你不想为更长的前置加载时间和更多的空间消耗支付保险费用（即使你可能永远并不真正需要它们），那么你可能不得不承担运行时符号缺失的代价，导致程序崩溃。\n\
  \n## 运行时的手动动态链接\n\n上述问题的一种可能解决方案是为系统加载器的部分工作承担个人责任。这样，当情况不尽意时，你对结果有更多的控制权。在同义词模块的案例中，如果无法加载同义词库或其未提供正确的符号，终止程序真的有必要吗？没必要——但操作系统加载器并不知道这一点。只有软件程序员才能做出此类判断。\n\
  \n当程序在运行时手动管理动态链接时，链接器完全被排除在方程之外，程序不会直接调用任何导出的共享库函数。相反，共享库函数通过函数指针被引用，这些指针由程序本身在运行时填充。\n\
  \n其工作原理如下：程序调用操作系统函数（`dlopen`）手动将一个共享库加载到自己的进程地址空间中。该函数返回一个 `handle`（句柄），这是一个代表已加载库的不透明值。程序随后调用另一个加载器函数（`dlsym`）从句柄所指的库导入符号。如果一切顺利，操作系统将从目标库中返回请求的函数或数据项的地址。程序随后可以通过此指针调用函数或访问全局数据项。\n\
  \n如果在此过程中发生任何错误——在库中未找到符号或未找到库——那么定义结果就变成了程序的责任，例如通过显示错误消息来指示程序未正确配置。在正文之前的文字处理程序示例中，一个显示同义词表不可用的简单对话框就完全足够了。\n\
  \n这种方法比自动动态运行时链接的工作方式要好一点；加载器除了终止外别无选择，而应用程序拥有更高层次的视角，可以更优雅地处理问题。当然，缺点是你作为程序员必须在你的应用程序代码中管理加载库和导入符号的过程。然而，这个过程并不十分困难，正如我在下一章将演示的那样。\n\
  \n## 使用 Libtool\n\n可以写整本书来介绍共享库的细节以及它们如何在各种系统上实现。你刚刚阅读的这篇简短入门应该足以满足我们的即时需求，因此我现在将转向你如何使用\
  \ Libtool 让包维护者的生活变得轻松一点。\n\nLibtool 项目旨在扩展 Automake，但你也可以在手动编写的 makefiles 中独立使用它。截至本文写作时，Libtool\
  \ 的最新版本以及我在此处示例中使用的版本是 2.4.6 版本。\n\n### 抽象构建过程\n\n首先，让我们看看 Libtool 如何在构建过程中提供帮助。Libtool\
  \ 了一个了一个脚本（`ltmain.sh`），在启用 Libtool 的项目中，`config.status` 会消耗该脚本。`config.status`\
  \ 脚本将配置结果和 `ltmain.sh` 脚本转换为一个自定义的 libtool 脚本，专门为你的项目定制。^(5) 你的项目 makefiles 然后使用这个\
  \ libtool 脚本来构建在 `LIBRARIES` 列表变量中列出的共享库。libtool 脚本实际上只是编译器、链接器和其他工具的一个精巧的包装器。你应该将\
  \ `ltmain.sh` 脚本放在分发存档中，作为你构建系统的一部分。Automake 生成的规则确保了这一点的正确执行。\n\nlibtool 脚本使构建系统的作者免受不同平台构建共享库的细微差别的影响。该脚本接受一组定义良好的选项，并转换为目标平台和工具集上相应的平台和链接器特定选项。因此，维护者不需要担心在每个平台上构建共享库的细节——他们只需要理解可用的\
  \ libtool 脚本选项。这些选项在*GNU Libtool Manual*中^(6)中有详细说明，我将在本章和下一章中介绍其中许多。\n\n在完全不支持共享库的系统上，libtool\
  \ 脚本使用相应的命令和选项来构建并链接静态存档库。此外，在使用 Libtool 时，维护者不必担心构建共享库与构建静态库之间的差异。你可以通过在启用 Libtool\
  \ 项目的配置命令行中使用 `--disable-shared` 选项来模拟在静态系统上构建你的包。该选项会导致 Libtool 假设目标系统无法构建共享库。\n\
  \n\n\n\n\n### 运行时的抽象\n\n你也可以使用 `Libtool` 来抽象操作系统提供的用于加载库和导入符号的编程接口。如果你曾经在 Linux\
  \ 系统上动态加载过库，那么你对标准的 POSIX 共享库 API 非常熟悉，包括 `dlopen`、`dlsym` 和 `dlclose` 函数。系统级共享库（通常简单称为\
  \ `dl`）提供了这些函数。这被翻译为名为 `libdl.so` 的二进制镜像文件（在某些不同库命名规范的系统上可能是类似的名称）。\n\n遗憾的是，并不是所有支持共享库的\
  \ Unix 系统都提供名为 `libdl.so` 的库或使用这些命名的函数。为了解决这些差异，`Libtool` 提供了一个名为 `ltdl` 的共享库，它导出一个整洁、可移植的库管理接口，该接口与\
  \ POSIX `dl` 接口非常相似。当然，使用这个库是可选的，但强烈建议使用，因为它提供的不仅仅是跨共享库平台的通用 API——它还为共享库平台与非共享库平台之间的手动动态链接提供了抽象。\n\
  \n*什么？！这怎么能行？！* 在不支持共享库的系统上，Libtool 实际上会在可执行文件中创建内部符号表，其中包含了你在其他共享库中（在支持共享库的系统中）会找到的所有符号。通过在这些平台上使用此类符号表，`lt_dlopen`\
  \ 和 `lt_dlsym` 函数可以让你的代码看起来像是在加载库和导入符号，而实际上，库加载函数仅仅是返回一个指向相应内部符号表的句柄，而导入函数仅返回已静态链接到程序本身中的代码地址。在这些系统上，项目的共享库代码被直接链接到通常在运行时加载它们的程序中。\n\
  \n## 安装 Libtool\n\n如果你想在开发软件包时使用最新版本的 `Libtool`，你可能会发现你要么手动下载、构建并安装它，要么从你的发行版提供者处查找更新的\
  \ `libtool` 包。\n\n下载、构建和安装 Libtool 实际上简单，正如你在这里看到的。然而，在执行这些步骤之前，你应该检查 GNU Libtool\
  \ 网站，以确保你获得的是最新的包。我在这里从第 1 章重现了这些基本步骤：\n\n```\n$ wget https://ftp.gnu.org/gnu/libtool/libtool-2.4.6.tar.gz\n\
  \n--snip--\n\n$ tar xzf libtool-2.4.6.tar.gz\n\n$ cd libtool-2.4.6\n\n$ ./configure\
  \ && make\n\n--snip--\n\n$ sudo make install\n\n--snip--\n```\n\n请注意，默认安装位置（与大多数\
  \ GNU 包一样）是 `/usr/local`。如果你希望将 Libtool 安装到 `/usr` 层次结构中，你需要在 configure 命令行上使用 `--prefix=/usr`\
  \ 选项。推荐的做法是将发行版提供的包安装到 `/usr` 层次结构，将用户构建的包安装到 `/usr/local` 树，但如果你正尝试让手动构建的 Libtool\
  \ 版本与发行版提供的 Autoconf 和 Automake 版本协同工作，你可能需要将 Libtool 安装到 `/usr` 层次结构。避免包间相互依赖问题的最简单方法是将三个包的构建构建版本都安装到\
  \ `/usr/local`，或者更好，安装到你家目录下的某个目录中，然后你可以将其添加到你的 `PATH` 中。\n\n## 为 Jupiter 添加共享库\n\
  \n现在我已经介绍了必要的背景信息，让我们来看看如何为 Jupiter 项目添加一个 Libtool 共享库。首先，让我们考虑我们可以使用共享库为 Jupiter\
  \ 添加哪些功能。也许我们想为用户提供一些他们自己的应用程序可以使用的库功能。或者，我们一个软件包中可能有多个应用程序需要共享相同的功能。共享库对于这两种场景都是极佳的工具，因为你可以重用代码并节省内存——共享代码所占内存的成本被摊到了多个项目内部和外部的应用程序上。\n\
  \n让我们为 Jupiter 添加一个提供 Jupiter 打印功能的共享库吧。我们可以通过让新的共享库调用 `libjupcommon.a` 静态库来实现。请记住，调用静态库中的例程与将被调用的例程的对象代码直接链接到调用程序具有相同的效果。被调用的例程最终成为调用二进制镜像（程序或共享库）不可或缺的一部分。\n\
  \n此外，我们还将从 Jupiter 项目提供一个公共头文件，这将允许外部应用程序调用此相同的功能。这使得其他应用程序能够以与 jupiter 程序相同的奇特方式显示内容。（如果我们正在\
  \ Jupiter 中做些某些实用的东西，那会酷得多，但你明白我的意思。）\n\n### 使用 LTLIBRARIES 主目标\n\nAutomake 内置了对\
  \ Libtool 的支持；提供 `LTLIBRARIES` 主目标的是 Automake 包，而不是 Libtool 包。Libtool 并不真正算是一个纯粹的\
  \ Automake 扩展，不如说是 Automake 的一个附加包，Automake 为这个特定的附加包提供了必要的 set。没有 Libtool，你就无法访问\
  \ Automake 的 `LTLIBRARIES` 主功能，因为使用该主目标会生成调用 `libtool` 脚本的 make 规则。\n\nLibtool 是单独分发的，而不是作为\
  \ Automake 的一部分，因为你可以独立于 Automake 非常高效地使用 Libtool。如果你想单独尝试 Libtool，我将推荐你参考 GNU Libtool\
  \ 手册；其开头章节描述了如何作为独立产品使用 libtool 脚本。这只需要修改你的 Makefile 命令，使得编译器、链接器和库生成器通过 libtool\
  \ 脚本进行调用，然后根据 Libtool 的要求修改某些命令行参数即可。\n\n### 公共包含目录\n\n名为 `include` 的项目子目录应该只包含公共头文件——即那些暴露项目公共接口的文件。我们现在要为\
  \ Jupiter 项目添加这样一个头文件，因此我们将在项目根目录下创建一个 `include` 目录。\n\n如果我们有多个共享库，我们就面临一个选择：是在每个库源目录中创建一个单独的\
  \ `include` 目录，还是添加一个单一的顶层 `include` 目录？我通常使用以下准则来决定：如果这些库被设计为一组协同工作，并且调用应用程序通常一起使用这些库，我就使用单一的顶层\
  \ `include` 目录。另一方面，如果这些库可以有效地独立使用，并且它们提供了相当独立的功能集，那么就在库自己的目录中提供各个 `include` 目录。\n\
  \n最终，这并不重要，因为这些库的头文件安装时的目录结构与它们在项目内部的结构完全不同。事实上，你应该确保不要在项目的两个不同的库中无意中使用相同的公共头文件名——如果你这样做，在安装这些文件时将会遇到问题。它们通常会集中在\
  \ `$(prefix)/include` 目录下，尽管你可以通过 `Makefile.am` 文件中的 `includedir` 变量或 `pkginclude`\
  \ 前缀来覆盖这个默认值。\n\n\n\n\n\n`includedir` 变量允许你通过定义 Automake 中 `$(includedir)` 变量的精确值，来指定头文件的安装位置，该变量的默认值为\
  \ `$(prefix)*/include*`。使用 `pkginclude` 前缀告诉 Automake，你希望将头文件放在由 `$(includedir)`\
  \ 指向的目录下的私有、特定包的目录中，该目录命名为 `$(includedir)*/*$(PACKAGE)`。\n\n我们还将为 Jupiter 的新共享库\
  \ `*libjupiter` 添加另一个根级目录（`*libjup`）。这些更改要求你先向顶层 `Makefile.am` 文件的 `SUBDIRS` 变量中添加对新目录的引用，然后在\
  \ `configure.ac` 中的 `AC_CONFIG_FILES` 宏中添加相应的 `Makefile` 引用。由于我们要对项目进行重大更改，最好在开始之前清理工作区域。然后，我们将创建目录，并向新的\
  \ `include` 目录中添加一个新的 `Makefile.am` 文件：\n\nGit tag 7.0\n\n```\n $ make maintainer-clean\n\
  \n   --snip--\n\n   $ mkdir libjup include\n\n➊ $ echo \"include_HEADERS = libjupiter.h\"\
  \ > include/Makefile.am\n\n   $\n```\n\n`include` 目录下的 `Makefile.am` 文件非常简单——它只包含一行，其中一个\
  \ Automake `HEADERS` 主目标（primary）引用了公共头文件 `libjupiter.h`。注意 ➊ 处，我们在该主目标上使用了 `include`\
  \ 前缀。你可能记得，这个前缀表示该主目标中指定的文件将安装到 `$(includedir)` 目录中（例如 `*/usr/(local/)include*`）。`HEADERS`\
  \ 主目标与 `DATA` 主目标类似，因为它们都指定了一组被简单视为数据并进行安装的文件，而不进行任何修改或预处理。唯一真正实质性的区别是，`HEADERS`\
  \ 主目标将可能的安装位置限制在符合头文件逻辑的路径内。\n\n`libjup/Makefile.am` 文件稍微复杂一些，包含四行而不是只有一行。该文件见列表\
  \ 7-1。\n\n```\n➊ lib_LTLIBRARIES = libjupiter.la\n\n➋ libjupiter_la_SOURCES = jup_print.c\n\
  \n➌ libjupiter_la_CPPFLAGS = -I$(top_srcdir)/include -I$(top_srcdir)/common\n\n\
  ➍ libjupiter_la_LIBADD = ../common/libjupcommon.a\n```\n\n*列表 7-1:* libjup/Makefile.am:\
  \ *该文件的初始版本*\n\n让我们逐行分析该文件。➊ 处的行是主目标规范，它包含了库的常用前缀：`lib`。该前缀引用的产品将安装在 `$(libdir)`\
  \ 目录中（我们也可以使用 `pkglib` 前缀来表示我们希望将库安装到 `$(libdir)*/jupiter*`）。在这里，我们使用了 `LTLIBRARIES`\
  \ 主目标而不是原始的 `LIBRARIES` 主目标。使用 `LTLIBRARIES` 告诉 Automake 生成使用 libtool 脚本的规则，而不是直接调用编译器（以及可能存在的库生成器）来生成产品。\n\
  \n➋ 处的行列出了用于生成第一个（也是唯一）产品的源文件。\n\n➌ 处的行指定了一组 C 预处理器标志，这些标志将用于编译器命令行，以便找到相关的共享库头文件。这些选项表示预处理器应该在顶层\
  \ `include` 和 `common` 目录中搜索源代码中引用的头文件。\n\n最后一行（➍ 处）指定了该产品的一组链接器选项。在这种情况下，我们指定 `libjupcommon.a`\
  \ 静态库应该被链接（即成为）`libjupiter.so` 共享库的一部分。\n\n**注意**\n\n*更有经验的 Autotools 库开发者会注意到这个\
  \ Makefile.am 文件中存在一个细微的缺陷。*这里有一个提示：它与将 Libtool 库链接到非 Libtool 库有关。这个概念对许多初学者来说是一个巨大的障碍，因此我编写了该文件的初始版本来说明这个错误。不过，不用担心——我们将在本章稍后通过逻辑方式解决这个问题时纠正这个缺陷。*\n\
  \n关于 `*_LIBADD` 变量，有一个重要的概念你应该努力完全理解：在同一个项目内部消耗但作为该项目一部分构建的库，应该在 `build` 目录层次结构中通过相对路径进行内部引用，使用父目录引用或\
  \ `$(top_builddir)` 变量。项目外部的库通常不需要显式引用，因为当项目的配置脚本在处理由 `AC_CHECK_LIB` 或 `AC_SEARCH_LIBS`\
  \ 宏生成的代码时，已经将这些库的适当 `-L` 和 `-l` 选项添加到 `$(LIBS)` 环境变量中了。\n\n接下来，我们将这些新目录挂钩到项目的构建系统中。为此，我们需要修改顶层的\
  \ `Makefile.am` 和 `configure.ac` 文件。这些更改分别如列表 7-2 和 7-3 所示。\n\n```\nSUBDIRS = common\
  \ include libjup src\n```\n\n*列表 7-2:* Makefile.am: *将 include 和 libjup 添加到 SUBDIRS\
  \ 变量*\n\n```\n #                               -*- Autoconf -*-\n\n   # 用 autoconf\
  \ 处理此文件以生成 configure \n\n   AC_PREREQ([2.69])\n\n   AC_INIT([Jupiter],[1.0],[jupiter-bugs@example.org])\n\
  \n   AM_INIT_AUTOMAKE\n\n➊ LT_EREQ([2.4.6])\n\n   LT_INIT([dlopen])\n\n   AC_CONFIG_SRCDIR([src/main.c])\n\
  \n   AC_CONFIG_HEADERS([config.h])\n\n   # 检查程序。\n\n   AC_PROG_CC\n\n➋ AC_PROG_INSTALL\n\
  \n   # 检查头文件。\n\n   AC_CHECK_HEADERS([stdlib.h])\n\n   --snip--\n\n   AC_CONFIG_FILES([Makefile\n\
  \n                    common/Makefile\n\n                 ➌/Makefile\n\n       \
  \             libjup/Makefile\n\n                    src/Makefile])\n\n   AC_OUTPUT\n\
  \n   --snip--\n```\n\n*列表 7-3:* configure.ac: *添加 include 和 libjup 目录的 Makefile*\n\
  \n\n\n\n\n此选项启用对 `dlopen` 支持的检查*GNU Libtool 手册*指出，如果程序包在 libtool 中使用了 `-dlopen`\
  \ 和 `-dlpreopen` 标志，则应该使用此选项；否则 libtool 将假设系统不支持 *dl-opening*。使用 `-dlopen` 或 `-dlpreopen`\
  \ 标志的理由只有一个：你打算在项目的源代码中运行时动态加载并导入共享库功能。此外，除非你打算使用 `ltdl` 库（而不是直接使用 `dl` 库）来管理运行时动态链接，否则这两个选项的作用微乎其微。因此，只有在你打算使用\
  \ `ltdl` 库时才应该使用此选项。\n\n### win32-dll\n\n如果你的库已通过 `__declspec(dllimport)` 和 `__declspec(dllexport)`\
  \ 正确地移植到 Windows DLL，请使用此选项。如果你的库正确使用了这些关键字来为 Windows DLL 导入和导出符号，而你又没有使用此选项，那么\
  \ Libtool 将仅在 Windows 上构建静态库。我们将在第 17 章中详细讨论这一主题。\n\n### aix-soname=aix|svr4|both\n\
  \n向 `configure` 命令行添加了 `--with-aix-soname` 标志。在 2.4.4 版本之前，Libtool 的行为始终假设 `aix-soname`\
  \ 被设置为 `aix`。如果你经常在 AIX 上构建共享库，你就能理解此选项的含义。如果你想了解更多信息，请阅读*GNU Libtool 手册*第 5.4.1\
  \ 节。\n\n### disable-fast-install\n\n此选项更改了 `LT_INIT` 的默认行为，在相关的系统上禁用快速安装的优化。快速安装概念的存在是因为未安装的程序和库可能需要从构建树内部执行（例如在\
  \ `make check`期间）。在某些系统上，安装位置会影响最终链接的二进制镜像，因此 Libtool 必须在执行 `make install` 时重新链接程序和库，或者在执行\
  \ `make check` 时重新链接程序和库。Libtool 默认选择为 `make check` 重新链接，允许原始二进制文件快速安装，而无需在 `make\
  \ install` 期间重新链接。用户可以根据平台支持，通过向 `configure` 指定 `--enable-fast-install` 来覆盖此默认设置。\n\
  \n### shared and disable-shared\n\n这两个选项更改了创建共享库的默认行为。`shared` 选项的作用是在 Libtool 知道如何创建共享库的所有系统上都作为默认行为。用户可以通过在\
  \ `configure` 命令行上指定 `--disable-shared` 或 `--enable-shared` 来覆盖默认的共享库生成行为。\n\n###\
  \ static and disable-static\n\n这两个选项更改了创建静态库的默认行为。`static` 选项的作用是在所有禁用共享库的系统以及大多数启用共享库的系统上都作为默认行为。如果启用了共享库，用户可以通过在\
  \ `configure` 命令行上指定 `--disable-static` 来覆盖此默认设置。Libtool 始终会在没有共享库的系统上生成静态库。因此，你不能（实际上无法）同时为\
  \ `LT_INIT` 使用 `disable-shared` 和 `disable-static` 参数，或同时为 `configure` 使用 `--disable-shared`\
  \ 和 `--disable-static` 命令行选项。（但请注意，你可以同时使用 `shared` 和 `static` 的 `LT_INIT` 选项，或者\
  \ `--enable-shared` 和 `--enable-static` 的命令行选项。）\n\n### pic-only and no-pic\n\n\
  这两个选项更改了创建和使用 PIC 对象代码的默认行为。用户可以通过在 `configure` 命令行上指定 `--without-pic` 或 `--with-pic`\
  \ 来覆盖这些选项设置的默认值。我将在第 200 页的“到底什么是 PIC”中讨论 PIC 对象代码的含义。\n\n既然我们已经完成了新库构建系统的设置，现在可以开始讨论源代码了。列表\
  \ 7-4 显示了 `libjup/Makefile.am` 第二行中引用的新 `jup_print.c` 源文件的内容。列表 7-5 显示了新的 `include/libjupiter.h`\
  \ 库头文件的内容。\n\n```c\n#include \"config.h\"\n#include \"libjupiter.h\"\n#include \"\
  jupcommon.h\"\n\nint jupiter_print(const char * name)\n{\n     return print_routine(name);\n\
  }\n```\n*列表 7-4:* `libjup/jup_print.c`: *共享库源文件的初始内容*\n\n```c\n#ifndef LIBJUPITER_H_INCLUDED\n\
  #define LIBJUPITER_H_INCLUDED\n\nint jupiter_print(const char * name);\n\n#endif\
  \ /* LIBJUPITER_H_INCLUDED */\n```\n*列表 7-5:* `include/libjupiter.h`: *共享库公共头文件的初始内容*\n\
  \n这引出了我们另一个通用的软件工程原则。我听过它有许多名称，但我最倾向于使用的是 *DRY 原则*——该缩写代表*不要重复自己 (don't repeat yourself)*。C\
  \ 函数原型非常有用，因为在正确使用时，它们能强制要求用户对函数的视图与包维护者的视图是一致的。我经常看到源文件没有包含相应的头文件。人们很容易在函数或原型中做一个微小的更改，然后在另一个地方没有重复它——除非你包含了公共头文件。这样做，编译器就能发现不一致之处。\n\
  \n我们还需要包含静态头文件（`jupcommon.h`），因为我们在库内部调用了它的函数。你可能也注意到我将 `config.h` 放在了开头，随后是公共头文件——这样做是有原因的。我在第\
  \ 6 章中提到，`config.h` 应该始终位于每个源文件的开头。通常情况下我会说公共头文件应该放在第一个，但公共头文件的编写方式使得其功能不会被 `config.h`\
  \ 修改，因此从技术上讲，头文件放在 `config.h` 之前还是之后并不重要。例如，在公共头文件中使用 `off_t` 这种取决于编译模式的类型会导致二进制接口\
  \ (ABI) 不仅在平台之间发生变化（这不一定是坏事），而且在同一平台上根据用户代码设置的编译环境发生变化（这不是件好事）。事实是，你应该编写公共头文件，使其不依赖于任何*可以*被\
  \ `config.h` 配置的内容。关于此主题更完整的论述，请参阅第 499 页的“项目 1：将私有细节从公共接口中排除”。\n\n通过将公共头文件放在源文件的开头（`config.h`\
  \ 之后），我们确保了该头文件的使用不依赖于项目内部任何内部头文件的定义。例如，假设公共头文件对内部头文件（如 `jupcommon.h`）定义的某些构造（如类型定义、结构体或预处理器定义）存在隐藏依赖。如果在\
  \ `jupcommon.h` 之后包含公共头文件，那么当编译器开始处理公共头文件时，这种依赖就会被隐藏，因为所需的构造已存在于*编译单元*（源文件加上所有包含的头文件）中了。\n\
  \n\n\n\n\n关于 Listing 7-5 的内容，我想最后再说明一点。预处理器条件结构通常被称为 `include guard`（包含保护符）。它是一种防止你的头文件在同一个编译单元内被无意中包含多次的机制。我在所有的头文件中都会例行使用\
  \ include guards，这是一种良好的做法。一个优秀的优化编译器（例如 `gcc`——具体是其预处理器）会识别头文件中的 include guards，并在同一个编译单元内后续的包含中完全跳过该文件。\n\
  \n由于公共头文件会被外部源代码使用，因此在这些头文件中毫无信不疑地使用 include guards 变得尤为关键。虽然你可以控制自己的代码库，但你无法控制你的库的用者所编写的代码。我在这里主张的是，假设你是你所认识的最优秀的程序员，而其他所有人的技能水平都略低于你。你可以通过不向任何人提及这一点来很好地做到，但在编写公共头文件时，你应该表现得像对待既定事实一样对待它。\n\
  \n接下来，我们将修改 Jupiter 应用程序的主函数，使其调用共享库而不是公共静态库。这些更改显示在 Listing 7-6 中。\n\n```\n#include\
  \ \"config.h\"\n\n#include \"libjupiter.h\"\n\nint main(int argc, char * argv[])\n\
  \n{\n\n    return jupiter_print(argv[0]);\n\n}\n```\n\n*Listing 7-6:* `src/main.c`:\
  \ *将 main 修改为调用共享库函数*\n\n在这里，我们将打印函数从静态库中找到 `print_routine` 更改为新共享库提供的 `jupiter_print`。我们还将顶部的包含的头文件从\
  \ `libjupcommon.h` 更改为 `libjupiter.h`。\n\n我对公共函数和头文件命名的选择是随机的，但基于提供一个清晰、合理且信息量丰富的公共接口的愿望。`libjupiter.h`\
  \ 这个名字非常清楚地表明该头文件指定了 `libjupiter.so` 的公共接口。我尝试为库接口函数命名，以明确它们是接口的一部分。你如何选择为你的公共接口成员命名——文件、函数、结构体、类型定义、预处理器定义、全局数据等——取决于你，但你应该考虑使用类似的哲学。记住，目标是提供极佳的端用户体验。直观的命名应该是你策略的重要组成部分。例如，为你的程序和库符号选择通用前缀是一种良好的通用做法。\n\
  \n最后，我们必须修改 `src/Makefile.am` 文件以使用我们新的共享库而不是 `libjupcommon.a` 静态库。这些更改显示在 Listing\
  \ 7-7 中。\n\n```\n bin_PROGRAMS = jupiter\n\n   jupiter_SOURCES = main.c\n\n➊ jupiter_CPPFLAGS\
  \ = -I$(top_srcdir)/include\n\n➋ jupiter_LDADD = ../libjup/libjupiter.la\n\n   --snip--\n\
  ```\n\n*Listing 7-7:* `src/Makefile.am`: *在 src 目录的 Makefile 中添加共享库引用*\n\n在这里，我们更改了\
  \ ➊ 处的 `jupiter_CPPFLAGS` 语句，使其指向新的顶层 `include` 目录而不是 `common` 目录。我们还更改了 ➋ 处的 `jupiter_LDADD`\
  \ 语句，使其指向新的 Libtool 共享库对象而不是 `libjupcommon.a` 静态库。其余保持不变。引用 Libtool 库的语法与引用旧的静态库相同——只是库的扩展名不同。Libtool\
  \ 库扩展名 `.la` 代表 *libtool archive*。\n\n让我们退一步考虑。我们真的需要此更改吗？当然不需要。jupiter 应用程序将继续按照我们最初编写的方式正常工作。将静态库的\
  \ `print_routine` 代码直接链接到应用程序中，与调用新的共享库程序（尽管它最终包含相同的代码）一样有效。事实上，调用共享库程序会有略微更多的开销，因为通过共享库跳转表调用时存在了一个额外的额外间接层。\n\
  \n在实际项目中，你可能实际上会保持原样。因为两个公共入口点 `main` 和 `jupiter_print` 都调用 `libjupcommon.a` 中完全相同的函数（`print_routine`），它们的功能是等等的。为什么要增加通过公共接口调用的微小开销呢？嗯，一个原因是你可以利用共享代码。通过使用共享库函数，你没有复制代码——无论是在磁盘上还是在内存中。这就是\
  \ DRY（不要重复）原则的应用。\n\n另一个原因是为了测试你为共享库用户提供的接口。如果你的项目代码完全按照你期望其他程序使用的方式使用你的共享库，你就能更快地发现公共接口中的错误。\n\
  \n在这种情况下，你现在可能考虑简单地将代码从静态库移动到共享库，从而完全消除对静态库的需求。然而，请你原谅我这个刻意的例子。在更复杂的项目中，我可能确实需要这种配置。公共代码通常聚集在静态库中，而且通常情况下，只有部分代码会在共享库中被重用。在这里将保持原样。\n\
