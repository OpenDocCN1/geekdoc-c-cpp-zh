  \ (注：由于原文中存在大量重复段落，翻译已按逻辑精简以确保核心内容准确。)\n\n### 使用传统方法\n\n为了第一次尝试，让我们使用由 Solaris/Linux\
  \ `libdl.so` 库提供的 `dl` 接口。在下一节中，我们将此代码转换为 Libtool 的 `ltdl` 接口以获得更好的可移植性。\n\n\n\n\
  \n\n```\n --snip--\n\n   # Checks for header files.\n\n➊ AC_CHECK_HEADERS([stdlib.h\
  \ dlfcn.h])\n\n   --snip--\n\n   # Checks for libraries.\n\n   # Checks for typedefs,\
  \ structures, and compiler characteristics.\n\n   # Checks for library functions.\n\
  \n➋ AC_SEARCH_LIBS([dlopen], [dl])\n\n   --snip--\n\n   cat << EOF\n\n   -------------------------------------------------\n\
  \n   ${PACKAGE_NAME} Version ${PACKAGE_VERSION}\n\n   Prefix: '${prefix}'.\n\n \
  \  Compiler: '${CC} ${CFLAGS} ${CPPFLAGS}'\n\n➌ Libraries: '${LIBS}'\n\n   --snip--\n\
  ```\n\n*listing 8-9:* `configure.ac`: *为* `dl` *库和公共头文件添加检查*\n\n在 ➊ 处，我将 `dlfcn.h`\
  \ 头文件添加到传递 `AC_CHECK_HEADERS` 宏的文件列表中，然后在 ➋ 处，我添加了对 `dl` 库中 `dlopen` 函数的检查。请注意，`AC_SEARCH_LIBS`\
  \ 宏会在库列表中搜索函数，因此该调用位于“检查库函数”部分，而不是“检查库”部分。为了帮助我们查看我们实际上正在链接了哪些库，我还在文件末尾的 `cat` 命令中添加了一行。➌\
  \ 处的 `Libraries:` 行显示了 `LIBS` 变量的内容，该变量是由 `AC_SEARCH_LIBS` 宏修改的。\n\n**注意**\n\n*`LT_INIT`\
  \ 宏也会检查 `dlfcn.h` 头文件是否存在，但我在这里显式地写了这一点，以便让观察者直观地看到我想使用这个头文件。只要不会对性能产生过大的负面影响，这是一个值得遵循的准则。由于\
  \ Autoconf 会缓存检查结果，因此不太可能影响性能。当你在 `configure` 的输出中看到检查后出现 `(cached) ...` 时，说明这种情况正在发生。*\n\
  \n添加一个模块需要几处更改，因此我们在这里完成所有更改，从以下命令开始：\n\n```\n$ mkdir -p src/modules/hithere\n\n\
  $\n```\n\n我创建了两个新的子目录。第一个是 `src` 下的 `modules`，第二个是 `modules` 下的 `hithere`。添加到此项目的每个新模块都将在\
  \ `modules` 下拥有自己的目录。`hithere` 模块将提供问候语 *Hi there*。\n\nListing 8-10 展示了如何向 `src/Makefile.am`\
  \ 文件添加 `SUBDIRS` 变量，以确保构建系统处理 `modules/hithere` 目录。\n\n```\n➊ SUBDIRS = modules/hithere\n\
  \n   bin_PROGRAMS = jupiter\n\n➋ jupiter_SOURCES = main.c module.h\n\n   --snip--\n\
  \n   greptest.sh:\n\n➌ echo './jupiter | grep \".* from .*jupiter!\"' > greptest.sh\n\
  \n   --snip--\n```\n\n*Listing 8-10:* `src/Makefile.am`: *在此* `Makefile.am` *文件中添加\
  \ `SUBDIRS` 变量*\n\n我在 ➊ 处使用 `SUBDIRS` 引入了一个新概念。到为止，Jupiter 的 `Makefile.am` 文件只引用当前目录的直接后代，但正如你所见，这并不是必要的。事实上，对于\
  \ Jupiter 来说，`modules` 目录将包含额外的子目录，因此为了引用其子目录而提供一个 `modules/Makefile.am` 文件并没有意义。\n\
  \n在你编辑文件时，你应该在 ➋ 处向 `SOURCES` 变量添加新的 `module.h` 头文件。如果你不这样做，作为维护者，jupiter 仍然可以为你正确编译和构建，但\
  \ `distcheck` 目标将失败，因为没有任何 `Makefile.am` 文件提到 `module.h`。\n\n我们还需要更改 `greptest.sh`\
  \ shell 脚本的构建方式，以便它可以测试任何类型的问候语。只需对 ➌ 处的正则表达式进行简单修改即可。\n\n我在新的 `hithere` 子目录中创建了一个\
  \ `Makefile.am` 文件，其中包含如何构建 `hithere.c` 源文件的指令，然后我将 `hithere.c` 源文件添加到该目录中。这些文件分别在\
  \ Listings 8-11 和 8-12 中。\n\n```\n pkglib_LTLIBRARIES = hithere.la\n\n   hithere_la_SOURCES\
  \ = hithere.c\n\n➊ hithere_la_LDFLAGS = -module -avoid-version\n```\n\n*Listing\
  \ 8-11:* `src/modules/hithere/Makefile.am`: *该文件的初始版本*\n\n```c\n#include \"../../module.h\"\
  \n\nconst char * get_salutation(void)\n\n{\n\n    return \"Hi there\";\n\n}\n```\n\
  \n*Listing 8-12:* `src/modules/hithere/hithere.c`: *该文件的初始版本*\n\n`hithere.c` 源文件使用双引号相对路径包含了半私有的\
  \ `module.h` 头文件。由于 Automake 会自动向使用的 `include` 路径列表添加 `-I$(srcdir)`，C 预处理器将正确处理该相对路径。该文件随后定义了\
  \ `get_salutation` 函数。\n\n\n\n\n我在决定是否应对某些代码进行条件编译时，使用的通用哲学是：如果 `configure` 因为缺少库或头文件而失败，那么我不需要对那些使用了\
  \ `configure` 所检查的项的代码进行条件编译。如果在 `configure` 中检查了某个库或头文件，但在缺失时允许其继续，那么我最好使用条件编译。\n\
  \n关于使用 `dl` 接口函数，还有几点细微的内容需要说明。首先，在 ➍ ，`dlopen` 接受两个参数：文件名或 `path`（绝对或相对路径）以及一个\
  \ `flags` 字，它是你选择的 `dlfcn.h` 中定义的多个标志位值的位运算复合。请查看 `dlopen` 的帮助页（man page）以了解更多关于这些标志位字节的信息。如果你使用路径，`dlopen`\
  \ 将原封不动地遵循该路径；但如果你使用文件名，则会搜索库路径以尝试定位你的模块。通过在名称前缀加上 `././`，我们是在告诉 `dlopen` 不要搜索库路径。\n\
  \n我们希望能够配置 jupiter 使用哪个模块，因此我们加载了一个通用名称 `module.so`。事实上，构建好的模块位于构建树中 `src` 目录几级之下，我们需要在当前目录下创建一个名为\
  \ `module.so` 的软链接，指向我们想要加载的模块。对于 Jupiter 来说，这是一种相当原始的配置方式，但有效的。在实际应用程序中，你会使用某些配置文件定义的策略来定义要加载的模块，但在示例中，为了简单起见，我忽略了这些细节。\n\
  \n### NOTE\n\n我忽略了 Listing 8-14 中的某些错误处理。在生产代码中，如果模块未加载或符号未符号导出，你可能希望记录或显示某些内容。\n\
  \n以下命令序列显示了我们的可加载模块的操作：\n\n```\n$ autoreconf -i\n\n--snip--\n\n$ ./configure &&\
  \ make\n\n--snip--\n\n$ cd src\n\n$ ./jupiter\n\nHello from ...jupiter!\n\n$\n\n\
  $ ln -s modules/hithere/.libs/hithere.so module.so\n\n$ ./jupiter\n\nHi there from\
  \ ...jupiter!\n\n$\n```\n\n### NOTE\n\n符号链接 `module.so` 指向隐藏目录 `.libs` 中的一个文件。Autotools\
  \ 构建系统会将执行文件和库生成到相关源代码目录下的 `.libs` 目录。\n\n### 转换为 LibTool 的 ltdl 库\n\nLibTool 提供了一个名为\
  \ `ltdl` 的封装库，它抽象并隐藏了在许多不同平台上使用共享库时的某些移植性问题。大多数应用程序因为增加了复杂性而忽略了 `ltdl` 库，但实际上只需要处理几个问题。我在这里列出它们，稍后会详细介绍。\n\
  \n*   `ltdl` 函数遵循基于 `dl` 库的命名约定。规则是 `ltdl` 库中的 `dl` 函数具有 `lt_` 前缀。例如，`dlopen` 被命名为\
  \ `lt_dlopen`。\n*   与 `dl` 库不同，`ltdl` 库必须在调用程序适当的位置进行初始化和终止。\n*   构建应用程序应在链接器命令行（在\
  \ `_LDFLAGS` 变量中）使用 `-dlopen modulename` 选项。这告诉 Libtool 在没有共享库的平台上构建或进行静态链接时，将模块代码链接到应用程序中。\n\
  *   `LTDL_SET_PRELOADED_SYMBOLS()` 宏应该在程序源代码的适当位置使用，以确保在非共享库平台或构建纯静态配置时可以访问模块代码。\n\
  *   设计为使用 `ltdl` 进行 `dlopen` 的共享库模块应在链接器命令行（在 `_LDFLAGS` 变量中）使用 `-module` 选项（以及可选的\
  \ `-avoid-version` 选项）。\n*   `ltdl` 库提供的功能比 `dl` 库丰富得多；这可能令人望而畏畏，但请知道所有其他功能都是可选的。\n\
  \n让我们看看为了使用 `ltdl` 库对 Jupiter 项目构建系统需要做什么。首先，我们需要修改 `configure.ac` 来查找 `ltdl.h`\
  \ 头文件并搜索 `lt_dlopen` 函数。这意味着要修改 `AC_CHECK_HEADERS` 和 `AC_SEARCH_LIBS` 宏中对 `dlfcn.h`\
  \ 和 `dl` 库的引用，如 Listing 8-15 所示。\n\nGit tag 8.2\n\n```\n--snip--\n\n# Checks for\
  \ header files.\n\nAC_CHECK_HEADERS([stdlib.h ltdl.h])\n\n--snip--\n\n# Checks for\
  \ libraries.\n\n# Checks for typedefs, structures, and compiler characteristics.\n\
  \n# Checks for library functions.\n\nAC_SEARCH_LIBS([lt_dlopen], [ltdl])\n\n--snip--\n\
  ```\n*Listing 8-15:* configure.ac: *在 `configure.ac` 中从 dl 切换到 ltdl*\n\n尽管我们使用了\
  \ Libtool，但我们需要检查 `ltdl.h` 和 `libltdl`，因为 `ltdl` 是一个必须在用户系统上安装的独立库。它应该被视为与其他所需的第三方库相同的对待。\n\
  \n\n\n\n一个重要的变化是，`ltdl` 库必须在 ➌ 处通过调用 `lt_dlinit` 进行初始化，而 `dl` 库不需要初始化。在较大的程序中，调用\
  \ `lt_dlinit` 和 `lt_dlexit` 的开销将分摊到庞大的代码库中。\n\n另一个重要的细节是在 ➋ 处增加了 `LTDL_SET_PRELOADED_SYMBOLS`\
  \ 宏调用。该宏用于在不支持共享库的系统上或在用户明确请求静态库的情况下，配置 `lt_dlopen` 和 `lt_dlsym` 函数所需的全局变量。在使用共享库的系统上，该操作是无害的。\n\
  \n最后一点细节是，`dlopen` 的返回类型是 `void *`（即一个通用指针），而 `lt_dlopen` 的返回类型是 `lt_dlhandle`（参见\
  \ ➊ 和 ➍）。这种抽象是为了让 `ltdl` 能够移植到那些使用与通用指针不兼容的返回类型的上。\n\n当系统不支持共享库时，Libtool 实际上会将所有可能加载的模块直接链接到程序中。因此，`jupiter`\
  \ 程序的链接器（`libtool`）命令行必须包含对这些模块的某种引用。这是通过 `-dlopen modulename` 结构实现的，如列表 8-17 所示。\n\
  \n```\n--snip--\n\njupiter_LDADD = ../libjup/libjupiter.la -dlopen modules/hithere/hithere.la\n\
  \n--snip--\n```\n\n*列表 8-17:* `src/Makefile.am`: *在 LDADD 行中添加 -dlopen 选项*\n\n如果你忘记在\
  \ `src/Makefile.am` 中添加此内容，你将得到关于未定义符号的链接错误——类似于 `lt__PROGRAM__LTX_preloaded_symbols`。如果它没有检测到任何模块链接到应用程序，Libtool\
  \ 就不会在你的程序全局符号空间中填充永远不会被引用的符号；但如果符号表为空，`ltdl` 库所需的符号将会缺失。\n\n看来 `ltdl` 在可以在 `lt_dlopen`\
  \ 中指定的用于引用模块的路径信息类型，没有 `dl` 那么灵活。为了解决这个问题，我将正确的相对路径 `modules/hithere/hithere.la`\
  \ 硬编码进了 `main.c` 中。此外，此示例对当前工作目录非常敏感。如果你从另一个目录运行 `jupiter`，它也将无法找到该模块。真正的程序无疑会使用更健壮的配置方法，例如一个包含目标模块名称绝对路径的配置文件^(10)\n\
  \n### 预加载多个模块\n\n如果 Libtool 在不支持共享库的系统上将多个模块链接到程序中，且这些模块每个都提供了 `get_salutation`\
  \ 自己的版本，那么程序的全局符号空间内会出现公共符号冲突。这是因为所有这些模块的符号都成了程序全局符号空间的一部分，而链接器通常不允许将两个同名的符号添加到可执行文件的符号表中。程序应该遵循哪个模块的\
  \ `get_salutation` 函数呢？遗憾的是，目前没有友好的启发式方法来解决这种冲突。*GNU Libtool 手册*通过定义一种维护符号命名唯一性的惯例，为这种情况提供了支持：\n\
  \n*   所有导出的接口符号都应该以 `modulename_LTX_` 为前缀（例如 `hithere_LTX_get_salutation`）。\n* \
  \  所有剩余的非静态符号应该具有合理的唯一性。Libtool 建议的方法是在它们的前缀加上 `_modulename_`（如 `_jupiter_somefunction`）。\n\
  *   即使模块在不同的目录中构建，它们的命名也应该不同。\n\n尽管手册中没有明确说明，但 `lt_dlsym` 函数首先搜索作为 `modulename_LTX_*symbolname`\
  \ 的指定符号，如果它找不到带前缀的符号版本，它会搜索完全匹配 `symbolname`。你可以看到这种惯例是必要的，但仅适用于 Libtool 可能在不支持共享库的系统上直接将此类可加载模块静态链接到应用程序的情况。为了让\
  \ Libtool 在不支持共享库的系统上实现共享库的幻象，你需要付出的代价相当高，但这是在所有平台上获得相同可加载模块功能的标准价格。\n\n为了修复 `hithere`\
  \ 模块的源代码以符合这一惯例，我们需要对 `hithere.c` 进行一项更改，如列表 8-18 所示。\n\n```\n➊ #define get_salutation\
  \ hithere_LTX_get_salutation\n\n➋ #include \"../../module.h\"\n\n   const char *\
  \ get_salutation(void)\n\n   {\n\n      return \"Hi there\";\n   }\n```\n\n*列表 8-18:*\
  \ `src/modules/hithere/hithere.c`: *在使用 ltdl 时确保公共符号的唯一性*\n\n通过在 ➋ 处包含 `module.h`\
  \ 头文件之前，在 ➊ 处定义 `get_salutation` 的替换项，我们还能够更改头文件中的原型，使其与修改后的函数名匹配。由于 C 预处理器的工作方式，这种替换只会影响\
  \ `module.h` 中的函数原型。\n\n### 测试一下\n\n在不支持共享库的系统上，你可以通过 `--disable-shared` 选项来测试你的程序和模块：\n\
  \n```\n$ make clean\n\n--snip--\n\n$ autoreconf\n\n$ ./configure --disable-shared\
  \ && make\n\n--snip--\n\n$ cd src\n\n$ ls -1p modules/hithere/.libs\nhithere.a\n\
  hithere.la\nhithere.lai\nhithere.o\nhithere.so\n\n$ ./jupiter\n➌ Hi there, from\
  \ ./jupiter!\n```\n\n如你所示，➋ 和 ➌ 的输出包含了 *hithere* 模块的问候语，然而 ➊ 的文件列表显示，在禁用版本中，共享库甚至不存在。看来\
  \ `ltdl` 正在履行它的职责。\n\n**注意**：你可能注意到了 *jupiter* 输出的差异。在第一情况下，输出显示程序名为 `./jupiter`，而在第二情况下，它显示\
  \ `...jupiter`。这是我试图消除由于 Libtool 重定向到实际程序（*lt-jupiter*）而产生的杂质。\n\nJupiter 代码库已经变得相当脆弱，因为我忽略了运行时查找共享库的问题。正如我之前提到的，你最终需要在实际程序中修复这个问题。但鉴于我已经完成了向你展示如何使用\
  \ Libtool *ltdl* 库的任务，我将这个问题留给你的练习。\n\n### 总结\n\n使用共享库的决定带来了一系列问题，如果你对最大可移植性感兴趣，就必须处理每一个问题。`ltdl`\
  \ 库并不是所有问题的解决方案。它解决了一些问题，但也让其他问题浮出了水面。可以说，使用 *ltdl* 有权衡，但如果你不介意额外的维护工作，它是为你的可加载模块添加最大可移植性的好方法。\n\
  \n我希望通过花时间完成书中的练习，你已经对 Autotools 有足够的理解，知道它们是如何工作的以及它们为你做了什么。现在，你应该非常熟悉如何对自己的项目进行\
  \ *autotool-izing*——至少在基础层面。\n\n\n\n\n在接下来的章节中，我将讨论其他被视为 GNU 工具箱一部分的工具和程序（以及一两个不属于其中的工具）。我还将向你展示如何将一个真实项目从手动编写的构建系统转换为更简洁、可能也更正确的\
  \ Autotools 构建系统。\n\n## 9 使用 AUTOTEST 进行单元测试和集成测试\n\n*. . . 学并不等于知；只有学习者和被学习者。记忆成就了前者，而哲学成就了后者。*\n\
  \n—亚历山大·大马，《基督山伯爵》*\n\n![Image](img/common.jpg)\n\n测试是非常重要的。所有的开发者都会在不同程度上对自己的软件进行测试；否则，他们不知道产品是否符合设计标准。在光谱的一端，作者编译并运行程序。如果它呈现了他们设想的通用界面，他们就认为完成了。在光谱的另一端，作者编写了一套测试，试图在各种条件下尽可能多地运行代码，验证特定输入下的输出是正确的。努力达到这条线最右侧的点，我们找到了那种字面意义上先写测试，然后迭代地添加和修改代码，直到所有测试通过的人。\n\
  \n在本章中，我不会尝试详述测试的优点。我假设每位开发者都同意某种程度的测试测试，无论他们是“编译-运行-交付”类型的人，还是真正的“测试驱动”型。我同样假设每位开发者在这一光谱的某个地方对测试有某种程度的反感。因此，我们这里的目标是让其他人尽可能地完成测试工作。在这种情况下，“其他人”意味着\
  \ Autotools。\n\n回到第 3 章，我们为 Jupiter 的手动编写的 makefiles 添加了一个测试。该测试的输出完全由我们放入 `src/Makefile`\
  \ 的 make 脚本控制：\n\n```make\n$ make check\n\ncd src && make check\n\nmake[1]: Entering\
  \ directory '/.../jupiter/src'\n\ncc -g -O0    -o jupiter main.c\n\n./jupiter |\
  \ grep \"Hello from .*jupiter!\"\n\nHello from ./jupiter!\n\n*** All TESTS PASSED\n\
  \nmake[1]: Leaving directory '/.../jupiter/src'\n\n$\n```\n\n当我们转向第 4 章和第 5 章的 Autoconf\
  \ 时，并没有太大变化。输出仍然由我们手写的 make 脚本控制。我们只是将其移动到了 `src/Makefile.in`。\n\n然而，在第 6 章中，我们放弃了手动编写的\
  \ makefiles 和模板，转用 Automake 更简洁的 `Makefile.am` 文件。然后我们必须弄清楚如何将手工测试挤进 automake 脚本。在此过程中，我们的测试输出得到了一些提升：\n\
  \n```make\n$ make check\n\n--snip--\n\nPASS: greptest.sh\n\n============================================================================\n\
  \nTestsuite summary for Jupiter 1.0\n\n============================================================================\n\
  \n# TOTAL: 1\n\n# PASS:    1\n\n# SKIP:    0\n\n# XFAIL: 0\n\n# FAIL:    0\n\n#\
  \ XPASS: 0\n\n# ERROR: 0\n\n============================================================================\n\
  $\n```\n\n如果你在终端上使用较新版本的 Automake 运行代码，甚至会看到彩色的测试输出。\n\n`src/Makefile.am` 模板中 `TESTS`\
  \ 变量添加的每个测试都会生成一行 PASS: 或 FAIL:，并且摘要值包含了所有测试结果。这是因为 Automake 有一个由 `TESTS` 变量驱动的优秀内置测试框架。如果你需要构建\
  \ `TESTS` 中指定的任何文件，只需像我们为创建的简单驱动脚本（`greptest.sh`）那样为它创建一个规则即可。如果你的测试程序需要从源码构建，可以使用\
  \ `check_PROGRAM` 变量。Automake 测试框架的一个微小问题是，如果在多个目录中找到测试，在执行 `make check` 时你会看到多次此类显示，这可能让人心烦，特别是使用\
  \ `make -k`（遇到错误时继续）时，因为你可能不会考虑到向上查看之前可能失败的测试的输出。\n\n除了 `TESTS` 变量外，如果你将 `XFAIL_TESTS`\
  \ 变量设置为 `TESTS` 中测试的子集，你可能会在 `XFAIL:` 和 `XPASS:` 行中看到一些输出。这些是预期会失败的测试。当此类测试通过时，它们会被列在\
  \ `XPASS:` 行中，作为*意外通过*。当它们失败时，它们会被列在 `XFAIL:` 行中，作为*预期失败*。\n\n测试返回 shell 码 77 会增加\
  \ `SKIP:` 行的计数，而 99 会增加 `ERROR:` 行的计数。我将在本章后面提供更多关于测试返回的特殊 shell 码的细节。\n\n正如你现在可能猜到的那样，Autoconf\
  \ 还包含一个名为 `autotest` 的测试框架，它提供了所有必要的设施，让你能够简单地指定一个运行代码某些部分的测试。结果以一致且易于理解的方式显示，失败的测试很容易以隔离的方式重现，并附带内置的调试环境。这几乎让你想写测试了，不是吗？事实是，设计良好的测试框架与其他任何设计良好的工具一样，用起来是一种享受。\n\
  \n此外，autotest 是可移植的——只要你使用可移植的脚本或代码编写测试部分，整个测试套件将是 100% 可移植的。\n\n### Autotest 概述\n\
  \nautotest 使用和生成的文件有三个阶段。第一阶段是《GNU Autoconf 手册》说的“分发准备”阶段。第二阶段发生在执行 configure 时，第三阶段发生在测试套件执行期间。让我们逐一查看这些阶段。\n\
  \n\n\n\n\n第一阶段发生在构建分发包（distribution archive）期间，它本质上是生成供用户在系统上运行的可执行测试程序的过程。这个过程必须在构建分发包时进行这似乎有点奇怪；然而，任何需要生成此程序的系统都要求安装\
  \ Autoconf，因此测试套程序必须在构建分发包时进行构建，以便将其包含在包中供用户。在制作 `dist` 或 `distcheck` 目标时，会执行 `configure`（当使用\
  \ `distcheck` 时执行 `make check`）；`make check` 封装了规则，用于使用 `autom4te`——Autoconf 的缓存\
  \ `m4` 驱动程序从源码重新构建测试程序。由于测试程序包含在 Automake 的 `EXTRA_DIST` 变量中，它在执行 `dist` 目标时被构建，我将在本章的末尾讨论这个变量。\n\
  \n图 9-1 显示了在 `make dist`（或 `make distcheck`）期间，从维护者编写的源文件到测试套程序的数据流。\n\n![Image](img/09fig01.jpg)\n\
  \n*图 9-1：从维护者编写的输入文件到测试套程序的数据流*\n\n位于图表第二列顶部的 `testsuite.at` 文件是由项目作者编写的主测试文件。这实际上是\
  \ `autotest` 唯一要求的由维护者编写的文件。与 `configure.ac` 完全一样，该文件包含散落在其中的 M4 宏定义和调用的 shell 脚本。该文件通过\
  \ `M4` 宏处理器处理，由 `autom4te` 作为 `m4` 的驱动程序，以生成最后一列顶部的测试套程序，该程序是纯 shell 脚本。这一过程发生在执行\
  \ `autom4te` 期间，由 `make check` 读取从我们编写的 `Makefile.in` 或 `Makefile.am` 文件生成的 `makefile`\
  \ 来驱动。“为分发做准备”的概念来自于 `check` 目标是在 `make distcheck` 期间执行的（当然，这会构建分发包）；测试套程序在此过程中被添加到分发包中。它在\
  \ `make dist` 期间被构建，但不会执行 `make check`，因为 `EXTRA_DIST` 中列出的所有文件在被包含到分发包之前必须先构建。\n\
  \n这类细节通常会被 Autotools 隐藏，但由于 `autotest` 仍然被认为是实验性的——意味着它尚未完全集成到 Autotools 件中——因此部分额外基础设施的责任被推给了我们这些维护者。我们将很快介绍这些细节。\n\
  \nAutoconf 手册建议测试套件作者可以将若干组相关的测试（称为*测试组*，test groups）放在单独的 `.at` 文件中。那么，`testsuite.at`\
  \ 文件仅包含一系列 `m4_include` 指令，包括这些特定特定组的 `.at` 文件。因此，`M4` 包含是将可选的 `test-1.at` 到 `test-*N.at`\
  \ 汇总到 `testsuite.at` 中供 `M4` 处理的机制。\n\n`package.m4` 和 `local.at` 文件是可选的维护者编写（或生成的）输入文件，如果发现这些文件，`autom4te`\
  \ 在处理 `testsuite.at` 时会自动包含它们。前者包含关于测试套的基本信息，这些信息会显示在控制台上，并嵌入到测试套生成的错误报告中。后者，手册建议，是我们可能选择的一种可选机制，可以帮助我们保持\
  \ `testsuite.at` 不被全局定义、非组相关的测试、以及实际测试可能使用的辅助宏定义和 shell 函数所污染。我们将在本章稍后讨论这些文件的具体内容。\n\
  \n当 `configure` 脚本为 `autotest` 仪器化时，配置过程会生成额外的与 autotest 相关的产物。图 9-2 以图形形式显示了配置过程中相对于\
  \ `autotest` 发生的情况。\n\n![Image](img/09fig02.jpg)\n\n*图 9-2：在 `configure` 生成测试相关模板期间的数据流*\n\
  \n回想第 2 章，`config.status` 驱动配置过程的文件生成部分。当为 `autotest` 设置 `configure.ac` 文件时，`config.status`\
  \ 会生成 `atconfig`——这是一个 shell 脚本，设计用于在测试件在执行时加载（sourced）。^(1)。它包含了源树和构建树变量，如 `at_testdir`、`abs_builddir`、`abs_srcdir`、`at_top_srcdir`\
  \ 等，以便在测试套执行期间访问源树和构建树中的文件和产品。\n\n测试作者还可以选择创建一个名为 `atlocal.in` 的模板文件，允许他们需要将额外的\
  \ Autoconf 和项目特定的配置变量传递到测试环境。该模板的产物是 `atlocal`——也是一个 shell 脚本，如果存在，会被测试套加载。如果你选择编写\
  \ `atlocal.in`，必须将其添加到 `configure.ac` 中调用 `AC_CONFIG_FILES` 时的标签列表中。我们稍后将在将 Jupiter\
  \ 的 `async_exec` 标志导出到我们的测试套时看到这是是如何操作的。\n\n**注意**\n\n不要将 `atlocal` 与图 9-1 中的 `local.at`\
  \ 混淆。图 9-2 中的 `atlocal` 文件在运行时被测试套加载，用于从 `configure` 将配置变量传递到测试环境，而 `local.at` 文件由项目维护者直接编写，包含由\
  \ `autom4te` 处理的额外测试代码。\n\n图 9-3 显示了执行测试套期间的数据流。\n\n![Image](img/09fig03.jpg)\n\n\
  *图 9-3：执行测试套期间的数据流*\n\n\n\n\n\n由于我的目标在这里是教你如何使用这个框架，因此在配置 Jupiter 以运行 autotest 时，我选择的方法是包含图\
  \ 9-1 到 9-3 所示的所有可选文件。这允许我们确切地探索一切是如何协同运作的。虽然对于 Jupiter 这种规模的项目来说，这种方法可能并非必须，但它确实可以正常工作，并且可以随时精简。我将在本章最后向你展示可以删除哪些内容以将\
  \ autotest 输入文件集精简到最小。\n\n在编写测试之前，我们需要让 `configure.ac` 感知到我们使用 autotest 的意愿。这是通过在\
  \ `configure.ac` 中添加两个宏调用来实现的，如列表 9-1 所示。\n\n### Git tag 9.0\n\n```\n#         \
  \                                      -*- Autoconf -*-\n\n# 使用 autoconf 处理此文件以生成一个\
  \ configure 脚本。\n\nAC_PREREQ([2.69])\n\nAC_INIT([Jupiter],[1.0],[jupiter-bugs@example.org])\n\
  \nAM_INIT_AUTOMAKE\n\nLT_PREREQ([2.4.6])\n\nLT_INIT([dlopen])\n\nAC_CONFIG_SRCDIR([src/main.c])\n\
  \nAC_CONFIG_HEADERS([config.h])\n\nAC_CONFIG_TESTDIR([tests])\n\nAC_CONFIG_FILES([tests/Makefile\n\
  \n                 tests/atlocal])\n\n# 检查程序。\n\nAC_PROG_CC\n\nAC_PROG_INSTALL\n\
  \n--snip--\n```\n\n*列表 9-1:* `configure.ac`: *将 autotest 接入* `configure.ac`\n\n\
  这两个宏中的第一个 `AC_CONFIG_TESTDIR` 告诉 Autoconf 启用 autotest，并指定测试目录命名为 `tests`。如果你愿意，可以在这里使用点\
  \ `.` 来表示当前目录，但 *GNU Autoconf 手册*建议使用独立的目录，以便于管理测试输出文件和目录。\n\n**注意**\n\n在 `configure.ac`\
  \ 中添加 `AC_CONFIG_TESTDIR` 实际上是项目中启用 autotest 所需的唯一更改，尽管为了使其有用且更具自动化，还需要对 makefiles\
  \ 和额外的支持文件进行更改。有趣的是，这个重要的小知识在手册的任何地方都没有找到，尽管它被非常微妙地暗示了。\n\n第二行是标准的 Autoconf `AC_CONFIG_FILES`\
  \ 实例化宏。我在这里使用它的独立实例来从模板生成测试相关文件。\n\n让我们看看这些文件中包含的内容。第一个是 `tests` 目录的 makefile，它由\
  \ Autoconf 的 `Makefile.in` 模板生成的，而该模板又是由我们需要编写的 Automake `Makefile.am` 文件生成的。在这个\
  \ makefile 中，我们需要让 `make check` 生成并执行测试套件。列表 9-2 显示了我们如何编写 `tests/Makefile.am`，以便\
  \ Automake 和 Autoconf 能够生成这样的 makefile。\n\n```\n➊ TESTSUITE = $(srcdir)/testsuite\n\
  \n➋ TESTSOURCES = $(srcdir)/local.at $(srcdir)/testsuite.at\n\n➌ AUTOM4TE = $(SHELL)\
  \ $(top_srcdir)/missing --run autom4te\n\n➍ AUTOTEST = $(AUTOM4TE) language=autotest\n\
  \n➎ check-local: atconfig atlocal $(TESTSUITE)\n\n           $(SHELL) '$(TESTSUITE)'\
  \ $(TESTSUITEFLAGS)\n\n➏ atconfig: $(top_builddir)/config.status\n\n           cd\
  \ $(top_builddir) && $(SHELL) ./config.status tests/$@\n\n➐ $(srcdir)/package.m4:\
  \ $(top_srcdir)/configure.ac\n\n           $(AM_V_GEN) :;{ \\\n\n             echo\
  \ '# Signature of the current package.' && \\\n             echo 'm4_define([AT_PACKAGE_NAME],\
  \ [$(PACKAGE_NAME)])' && \\\n             echo 'm4_define([AT_PACKAGE_TARNAME],\
  \ [$(PACKAGE_TARNAME)])' && \\\n             echo 'm4_define([AT_PACKAGE_VERSION],\
  \ [$(PACKAGE_VERSION)])' && \\\n             echo 'm4_define([AT_PACKAGE_STRING],\
  \ [$(PACKAGE_STRING)])' && \\\n             echo 'm4_define([AT_PACKAGE_BUGREPORT],\
  \ [$(PACKAGE_BUGREPORT)])'; \\ \\\n             echo 'm4_define([AT_PACKAGE_URL],\
  \ [$(PACKAGE_URL)])'; \\\n           } >'$(srcdir)/package.m4'\n\n➑ $(TESTSUITE):\
  \ $(TESTSOURCES) $(srcdir)/package.m4\n\n           $(AM_V_GEN) (AUTOTEST) -I '$(srcdir)'\
  \ -o $@.tmp $@.at; mv $@.tmp $@\n```\n\n*列表 9-2:* `tests/Makefile.am`: *让* `make\
  \ check` *构建并运行* 测试套件\n\n在我们剖析这个文件之前，我应该提到这些内容是摘自 *GNU Autoconf 手册* 第 19.4 节。我对它们进行了微调，但基本上，这些行构成了将\
  \ autotest 接入 Automake 的推荐方法的一部分。在我们讨论 autotest 导向 make 脚本的额外功能和要求时，我们将完成这个文件。\n\
  \n**注意**\n\n这种缺乏更完整的集成，加上 Autoconf 可以配置为使用几种不同的测试驱动程序（例如 DejaGNU）这一事实，可能是 autotest\
  \ 一直处于实验模式的原因。虽然 Libtool 等工具已经逐渐向与 Automake 的完全集成迁移，但 autotest 仍然需要一些调整才能正确接入构建系统。然而，一旦理解了要求，正确的集成是非常简单的。\n\
  \n列表 9-2 中的代码逐行来看非常直观——四个变量和四个规则。这些变量并不是严格必要的，但它们可以缩短命令行并减少规则中的重复。变量 `TESTSUITE`\
  \ 只是避免了我们在每次使用 testsuite 时都加上 `$(srcdir)/`。\n\n**注意**\n\ntestsuite 程序是分发的，因此它应该在源码树中构建。旨在分发的文件应该位于源码目录。此外，无论存档创建者使用什么配置选项，构建和分发的内容应该是相同的。\n\
  \n变量 `TESTSOURCES` 允许我们轻松地向 makefile 添加额外的测试。每个 `.at` 文件都成为 testsuite 的依赖项，当其中一个文件更改时，testsuite\
  \ 就会重新构建。\n\n变量 `AUTOM4TE` 允许我们使用缺失脚本包装 `autom4te` 的执行，如果找不到 `autom4te`，它可以打印更好的错误信息。这发生在没有安装\
  \ Autotools 的用户执行了需要重新构建 testsuite 的操作——例如修改 `testsuite.at`。\n\n**注意**\n\n我们无法使用\
  \ Automake 的 `maintainer-rules` 选项来避免将这些规则写入分发存档的 makefiles，因为我们必须手动编写这些规则。\n\n\
  变量 `AUTOTEST` 向 autom4te 命令行附加 `--language=autotest` 选项。在 Autoconf 软件包中实际上没有名为 autotest\
  \ 的程序。如果我们必须确定这样一个工具的定义，它将是这个 `AUTOTEST` 变量的内容。\n\n规则 `check-local` 将 testsuite\
  \ 的执行挂接到 Automake 的 check 目标中。Automake 的标准目标（如 check）都有对应的 -local 版本，你可以用它来补充 Automake\
  \ 为基础目标生成的功能。如果 Automake 在 `Makefile.am` 中看到目标为 `check-local` 的规则，它会在生成的 *Makefile*\
  \ 的 check 规则下生成一个运行 `$(MAKE) check-local` 的命令。这为你提供了一个接入标准 Automake 目标的钩子。\n\n\n\
  \n\n\n`check-local` 目标依赖 `atconfig`、`atlocal` 和 `$(TESTSUITE)`。回想图 9-3](#ch09.xhtml_ch09fig3)可知`atlocal`\
  \ 是被 testsuite 引入（sourced）的脚本。它直接通过调用 `AC_CONFIG_FILES` 生成，而我们在列表 9-1 中向 `configure.ac`\
  \ 添加了该调用，因此稍后我们将介绍它的内容。该规则的命令执行 `$(TESTSUITE)`，并将 `$(TESTSUITEFLAGS)` 作为命令行参数。`TESTSUITEFLAGS`\
  \ 的内容由用户定义，允许终端用户运行如 `make check TESTSUITEFLAGS=-v` 的命令，以便在调用 testsuite 的目标时启用详尽输出（verbose\
  \ output）。\n\n你还可以使用 `TESTSUITEFLAGS` 通过数字来指定特定的测试组（例如 `TESTSUITEFLAGS=2 testsuite`），或者如果你使用\
  \ `AT_KEYWORDS` 宏编写了测试，则可以通过标签名进行指定。此外，生成的 testsuite 程序还有几个命令行选项可用。你可以在 `GNU Autoconf\
  \ Manual` 的第 19.3 节找到 testsuite 选项的完整文档。\n\n**注意**\n\n`$(TESTSUITE)` 周围单引号允许 `$(TESTSUITE)`\
  \ 中的路径包含空格（如果需要）。这种技术可以并且应该在所有 Makefile 中使用以处理路径中的空格。在本书中，我通常忽略了路径中空格的概念，以减少列表中的干扰，但你应该意识到，Makefile\
  \ 可以被写成正确处理所有文件名和路径中的空格——包括目标和依赖中的路径，以及与规则相关的命令中的路径。\n\n我之前提到过，同样被 testsuite 引入的\
  \ `atconfig` 脚本是由 `AC_CONFIG_TESTDIR` 在后台自动生成的。问题在于，尽管 `config.status` 知道如何构建此文件，但\
  \ Automake 并不了解它的任何信息，因为它没有被直接列在 `configure.ac` 的任何实例化宏调用中，因此，我们需要在 `Makefile.am`\
  \ 中添加一条显式规则来创建或更新它。这正是列表 9-2 中 ➏ 处的 `atconfig` 规则用用场。`check-local` 规则依赖于它，因此当执行\
  \ `make check` 时，如果 `atconfig` 缺失或旧于其依赖项 `$(top_builddir)/config.status`，则会执行它的命令。\n\
  \n➐ 处生成 `$(srcdir)/package.m4` 的规则中的命令（注意这里只有一个命令）仅在文件缺失或旧于 `configure.ac` 时才向目标文件写入文本。这是一个可选的输入文件（见图\
  \ 9-1），其内容实际上是 autotest 以某种形式强制的。在 autotest 处理的输入数据以创建测试套件时，必须定义几个 M4 宏，包括 `AT_PACKAGE_NAME`、`AT_PACKAGE_TARNAME`、`AT_PACKAGE_VERSION`、`AT_PACKAGE_STRING`、`AT_PACKAGE_BUGREPORT`\
  \ 和 `AT_PACKAGE_URL`。这些变量可以直接在 `testsuite.at` 中（或该文件包含的任何子文件）中定义，但从 `configure.ac`\
  \ 中已有的值生成这些信息更有意义，这样我们就不必维护两套相同的信息。这就是为什么当在处理 `testsuite.at` 时发现 `package.m4`，autom4te\
  \ 会自动包含它的原因。\n\n等一下——为什么不使用 `AC_CONFIG_FILES` 让 `configure` 生成这个文件呢？我们做的只是生成一个包含配置变量的文本文件，这听起来正是\
  \ `AC_CONFIG_FILES` 的用途。问题在于，`AC_CONFIG_FILES` 和其他实例化宏总是将文件生成到构建树（build tree）中，而\
  \ `package.m4` 必须位于源码树（source tree）中，以便添加到分发存档中（不是因为它是用户可能发起的任何构建或执行过程的一部分，而是因为它是\
  \ testsuite 源代码的一部分）。也许未来的某个时间点，autotest 的完全集成将能够请求实例化宏将文件生成到源码树。在此之前，我们只能就此处理。\n\
  \n➑ 处的第四条也是最后一条规则 `$(TESTSUITE)` 使用 `$(AUTOTEST)` 命令生成 `$(srcdir)/testsuite`。因为\
  \ `$(TESTSUITE)` 是 `check-local` 的依赖项，如果它不是最新的，就会被构建。autom4te 程序在 `autotest 模式`下执行时，接受\
  \ `-I` 选项来指定 `*.at` 文件的包含路径，这些文件可能被 `testsuite.at` 或其任何包含的文件。它还接受 `-o` 选项来指定输出文件\
  \ `testsuite.^(3)`\n\n**注意**\n\n我在列表 9-2 最后两条规则的命令前添加了 `$(AM_V_GEN)`，以便我的自定义规则接入\
  \ Autotools 的静默构建规则系统。任何带有 `$(AM_V_GEN)` 前缀的命令在启用静默规则构建时，都会导致正常的命令输出被 `GEN` 目标取代。详见\
  \ GNU Automake 手册第 21.3 节。\n\n整体来看，这一切允许我们在启用静默规则构建时运行 `make check`。\n\n**注意**\n\
  \n这里还有一些我们在 `Makefile.am` 中需要的工作，以完全集成 autotest 功能。为了清晰起见，我们在本章之后会添加额外的规则。现在，你应该已经考虑到在\
  \ `Makefile.am` 顶层的 `SUBDIRS` 变量。\n\n好了，我们创建了一个新目录并添加了 `Makefile.am`。对于静默规则构建，你是完全正确的——这必须是我们的下一步。列表\
  \ 9-3 显示了对顶层 `Makefile.am` 的此修改。\n\n```\nSUBDIRS = common libup tests\n```\n\n*列表\
  \ 9-3:* Makefile.am: *添加子目录*\n\n**注意**\n\n我最后添加了 tests。这几乎总是是此类目录的模式。为了测试系统，大多数（如果不是所有）其他目录必须先构建。\n\
  \n列表 9-1 中的第二个文件是 `atlocal` shell 脚本，它会被 testsuite 自动引入（如果存在），可能用于向 testsuite 传递配置变量。将在\
  \ Jupiter 项目中使用该文件向 testsuite 传递 `async_exec` 标志，以便知道测试的程序是否启用了 `async-exec` 功能。列表\
  \ 9-4 显示了如何在 `atlocal` 的模板 `atlocal.in` 中实现此点。\n\n```\nasync_exec=@async_exec@\n\
  ```\n\n*列表 9-4:* tests/atlocal.in: *atlocal 的模板*\n\n现在，这给我们带来了一个小问题，因为 `configure`\
  \ 尚未导出名为 `async_exec` 的替换变量。我们在第 5 章中写过一个使用该名称 shell 变量脚本，但记得我们只用它来指示是否应该调用 `AC_DEFINE`\
  \ 在 `config.h.in` 中生成 `ASYNC_EXEC` 处理器定义。我们现在需要在该变量上使用 `AC_SUBST` 以生成同名的 Autoconf\
  \ 替换变量。列表 9-5 突出了为了实现这一点而对 `configure.ac` 进行的单行添加。\n\n```\n--snip--\n\n  ------------------------------------------\n\
  \n  在该系统上未找到 pthreads。\n\n  构建单线程版本。\n\n  ------------------------------------------])\
  \       async_exec=no\n\n   fi\n\nfi\n\nAC_SUBST([async_exec])\n\nif test \"x${async_exec}\"\
  \ = xyes; then\n\n    AC_DEFINE([ASYNC_EXEC], 1, [启用异步执行])\n\nfi\n\n--snip--\n```\n\
  \n*列表 9-5:* configure.ac: *让 autoconf 生成 async_exec 替换变量*\n\n\n\n\n\n关于列表 9-1 的最后一点：我们本可以简单将这些文件添加到\
  \ `configure.ac` 底部现有的 `AC_CONFIG_FILES` 调用中，但在此处使用单独的调用可以将与测试相关的项保持在一起。这也说明了 `AC_CONFIG_FILES`\
  \ 确实可以在 `configure.ac` 中被多次调用，其结果是累积的。\n\n现在，我们需要创建一组源 `.at` 文件，供 autom4te 使用以生成我们的测试程序。这组文件可以简单到只有一个\
  \ `testsuite.at` 文件，也可以像图 9-1 中的图那样复杂，包括 `testsuite.at`、一组特定测试组的 `.at` 文件以及一个 `local.at`\
  \ 文件。这些文件将包含 autotest 宏调用，并根据你的测试需求混合简单或复杂的 shell 脚本。我们将从 `tests/local.at` 文件中的单行\
  \ autotest 初始化代码开始，如列表 9-6 所示。\n\n```\nAT_INIT\n```\n\n*列表 9-6：* `tests/local.at`：可以向\
  \ `local.at` 文件中添加测试套的初始化代码\n\nautom4te 要求在 `testsuite.at` 及其包含的翻译单元的某处找到 `AT_INIT`\
  \ 宏。此单次宏调用会扩展为数百行 shell 脚本，定义了基础测试框架以及与其相关的所有辅助模板代码功能。\n\n我们还需要在 `tests` 目录下创建一个空的\
  \ `testsuite.at` 文件。我们将随着进度向其中添加项：\n\n```\n$ touch tests/testsuite.at\n```\n\n现在我们已经有了在\
  \ Jupiter 中生成和执行 autotest 框架的基础。每个使用 autotest 的项目都必须按照我们目前为止所示的方式进行配置。对于较小的项目，可能会省略某些可选部分，其内容将直接合并到\
  \ `testsuite.at` 中。我们完成对 autotest 的探索后将讨论如何简化。现在，让我们试一下：\n\n```\n$ autoreconf -i\n\
  \n--snip--\n\n$ ./configure\n\n--snip--\n\nconfig.status: creating tests/Makefile\n\
  \nconfig.status: creating tests/atlocal\n\n--snip--\n\nconfig.status: executing\
  \ tests/atconfig commands\n\n-------------------------------------------------\n\
  \nJupiter Version 1.0\n\n--snip--\n\n$ make check\n\n--snip--\n\nMaking check in\
  \ tests\n\nmake[1]: Entering directory '/.../jupiter/tests'\n\nmake    check-local\n\
  \nmake[2]: Entering directory '/.../jupiter/tests'\n\n:;{ \\\n\n  echo '# Signature\
  \ of the current package.' && \\\n  echo 'm4_define([AT_PACKAGE_NAME], [Jupiter])'\
  \ && \\\n  echo 'm4_define([AT_PACKAGE_TARNAME], [jupiter])' && \\\n  echo 'm4_define([AT_PACKAGE_VERSION],\
  \ [1.0])' && \\\n  echo 'm4_define([AT_PACKAGE_STRING], [Jupiter 1.0])' && \\\n\
  \  echo 'm4_define([AT_PACKAGE_BUGREPORT], [jupiter-bugs@example.org])'; \\\n  echo\
  \ 'm4_define([AT_PACKAGE_URL], [])'; \\\n} >'tests/package.m4'\n\n/bin/bash ../missing\
  \ --run autom4te --language=autotest \\\n    -I '.' -o testsuite.tmp testsuite.at\n\
  \nmv testsuite.tmp testsuite\n\n/bin/bash './testsuite'\n\n## -----------------------\
  \ ##\n\n## Jupiter 1.0 test suite. ##\n\n## ----------------------- ##\n\n## -------------\
  \ ##\n\n## Test results. ##\n\n## ------------- ##\n\n0 tests were successful.\n\
  \n--snip--\n\n$\n```\n\n我们从 `configure` 的输出中看到，生成的文件如预期地创建在 `tests` 目录下。似乎 `AC_CONFIG_TESTDIR`\
  \ 生成的代码已经通过内部使用 `AC_CONFIG_COMMANDS` 将 `tests/atconfig` 文件的生成接线成了一个 `command`（命令）标签，而不是仅仅作为一个简单的模板文件。\n\
  \n然后，我们从 `make check` 的输出中看到 `testsuite` 既被构建了也执行了。我们目前还无法通过 `dist` 或 `distcheck`\
  \ 目标将 `testsuite` 整合到分发存档中，因为我们还没有将 autotest 功能接入 Automake。然而，当我们在本章结束时完成修改后，你会发现针对分发存档的内容运行\
  \ `make check` 将不会构建 `testsuite`，因为它已经随存档一起发布了（假设我们没有动过 `testsuite` 的任何依赖项）。\n\n\
  **注意**\n\n`make check` 输出顶部附近有一个值得注意的有趣项是以 `make[1]:` 和 `make[2]:` 开头的行显示的，其中 `make`\
  \ 表示它两次进入了 `jupiter/tests` 目录。这是由于我们添加的 `check-local` 钩子，其中 `check` 目标在同一目录内作为命令递归调用\
  \ `$(MAKE) check-local`。\n\n太棒了，起作用了——至少 `make check` 是这样。但它目前除了向控制台打印几行额外的文本外什么都没做。为了让它产生用处，我们需要添加一些测试。因此，我们的第一个任务是将原始\
  \ `src/Makefile.am` 中基于 Automake 的 Jupiter 执行测试移动到我们的 autotest 中。\n\n### 添加测试\n\n\
  Autotest 测试被封装成称为*测试组*（test groups）的集合。测试组的目的是允许组内的测试相互交互。例如，组中的第一个测试可能会生成后续测试使用的数据。相互交互的测试更难调试，如果它们坏了，需要其他测试先运行。在力求完全覆盖时，多测试组是难以避免的；理想情况是每组只有一个测试。\n\
  \n我们的单项测试不会遭受这些问题——主要是因为我们还没有在测试上投入太多精力。现在，当你执行 `make check` 时，会在屏幕上看到两组输出：\n\n\
  ```\n $ make check\n\n   --snip--\n\n➊ make-TESTS\n\n   make[2]: Entering directory\
  \ '/.../jupiter/src'\n   make[3]: Entering directory '/.../jupiter/src'\n   PASS:\
  \ greptest.sh\n\n   ============================================================\n\
  \   Testsuite summary for Jupiter 1.0\n   ============================================================\n\
  \   # TOTAL: 1\n   # PASS:    1\n   # SKIP:    0\n   # XFAIL: 0\n   # FAIL:    0\n\
  \   # XPASS: 0\n   # ERROR: 0\n\n   --snip--\n\n➋ Making check in tests\n\n   make[1]:\
  \ Entering directory '/.../jupiter/tests'\n   make[2]: Entering directory '/.../jupiter/tests'\n\
  \   /bin/bash './testsuite'\n\n   ## ----------------------- ##\n   ## Jupiter 1.0\
  \ test suite. ##\n   ## ----------------------- ##\n   ## ------------- ##\n   ##\
  \ Test results. ##\n   ## ------------- ##\n\n   0 tests were successful.\n\n  \
  \ --snip--\n\n   $\n```\n\n第一组测试（从 ➊ 开始）在 `jupiter/src` 目录下执行。这是我们原始的基于 grep 的测试，通过模式检查\
  \ jupiter 的输出。如你所示，Automake 内置的基础框架并不差。我们希望通过 autotest 改进该框架。第二组测试（从 ➋ 开始）在 `jupiter/tests`\
  \ 目录下执行并涉及 autotest。\n\n### 使用 AT_CHECK 定义测试\n\n我们在 `src/Makefile.am` 中使用的基于 grep\
  \ 的测试是使用 autotest 框架提供的 `AT_CHECK` 宏的完美示例。以下是 `AT_CHECK` 系列宏的原型：\n\n```\nAT_CHECK(commands,\
  \ [status = '0'], [stdout], [stderr], [run-if-fail], [run-if-pass])\n\nAT_CHECK_UNQUOTED(commands,\
  \ [status = '0'], [stdout], [stderr], [run-if-fail], [run-if-pass])\n```\n\n\n\n\
  `AT_CHECK` 执行 `commands`，并将返回的状态与 `status` 进行比对，同时 stdout 和 stderr 的输出与 `stdout`\
  \ 和 `stderr` 宏参数的内容进行比较。如果省略了 `status`，autotest 会假设状态码为零（成功）。如果 `commands` 返回给 shell\
  \ 的状态码与 `status` 中指定的预期状态码不匹配，则测试失败。为了忽略 `commands` 的状态码，你应该在 `status` 参数中使用特殊命令\
  \ `ignore`。\n\n无论如何，有几个状态码即使是 `ignore` 也无法忽略：由 `commands` 返回的状态码 77（skip）将导致 autotest\
  \ 跳过当前测试组中的剩余测试，而 99（hard failure）将导致 autotest 立即导致整个测试组失败。\n\n与 `status` 类似，`stdout`\
  \ 和 `stderr` 参数似乎是可选的，但表象具有欺骗性。如果你在这些参数中传递任何内容，这仅仅是告诉 Autoconf 测试的 stdout 和 stderr\
  \ 输出流预期是空的。任何其他内容都会导致测试失败。那么，我们如何告诉 autotest 我们不想检查输出呢？与 `status` 一样，我们可以在 `stdout`\
  \ 或 `stderr` 中使用特殊命令，包括表 9-1 所示所示：\n\n**表 9-1：stdout 和 stderr 参数中允许的特殊命令。**\n\n\
  | 命令 |  |\n| :--- | :--- |\n| ignore | 不检查此输出流，但将其记录到测试组的日志文件中。 |\n| ignore-no-log\
  \ | 不检查也不记录此输出流。 |\n| stdout | 记录并捕捉测试的 stdout 输出到文件 stdout。 |\n| stderr | 记录并捕捉测试的\
  \ stderr 输出到文件 stderr。 |\n| stdout-nolog | 捕捉测试的 stdout 输出到文件 stdout，但不记录。 |\n|\
  \ stderr-nolog | 捕捉测试的 stderr 输出到文件 stderr，但不记录。 |\n| expout | 将测试的 stdout 输出与之前创建的\
  \ expout 文件比较；记录差异。 |\n| experr | 将测试的 stderr 输出与之前创建的 experr 文件比较；记录差异。 |\n\n`run-if-fail`\
  \ 和 `run-if-pass` 参数允许你可选地指定在测试失败或成功时分别执行的 shell 代码。\n\n`AT_CHECK_UNQUOTED` 与 `AT_CHECK`\
  \ 的完全相同，只是在进行与 `commands` 输出的比较之前，先对 `stdout` 和 `stderr` 执行 shell 扩展。由于 `AT_CHECK`\
  \ 不对 `stdout` 和 `stderr` 进行 shell 扩展，因此如果你在这些参数文本中引用了任何 shell 变量，就需要使用 `AT_CHECK_UNQUOTED`。\n\
  \n### 使用 AT_SETUP 和 AT_CLEANUP 定义测试组\n\n`AT_CHECK` 宏必须在 `AT_SETUP` 和 `AT_CLEANUP`\
  \ 的调用之间调用，这对组合定义了一个测试组，因此定义了执行该组中测试的临时目录。这些宏的原型定义如下：\n\n```\nAT_SETUP(test-group-name)\n\
  \nAT_CLEANUP\n```\n\n如果你有 `xUnit` 系列单元测试框架（`JUnit`、`NUnit`、`CPPUnit` 等）的经验，你可能对设置和清理（或拆卸）函数的用途有了很清楚的认识。通常，`setup`\
  \ 函数会在测试集中的每个测试之前运行一些公共代码，而 `cleanup` 或 `teardown` 函数会在集合中每个测试结束时执行一些公共代码。\n\nAutotest\
  \ 略有不同——属于同一组的测试之间没有共享的正式设置或拆卸功能（尽管这种功能可以通过在 `testsuite.at` 或其包含的子文件中测试组内定义的 shell\
  \ 函数来模拟）。与 `xUnit` 框架一样，Autotest 在完全隔离的状态下运行每个测试，因为每个测试都在其自己的子 shell 中运行。测试影响后续测试的唯一方法是共享同一个测试组，并在文件系统中留下遗留文件以供后续测试检查和操作。\n\
  \n`AT_SETUP` 仅接受一个参数 `test-group-name`，即我们正在启动的测试组名称，且该参数是必须的。`AT_CLEANUP` 不接受任何参数。\n\
  \n我们将组设置和清理宏的调用（封装了对 `AT_CHECK` 的调用）添加到一个新文件 `tests/jupiter.at` 中，如列表 9-7 所示。\n\n\
  Git tag 9.1\n\n```\nAT_SETUP([jupiter-execution])\n\nAT_CHECK([../src/jupiter],,[Hello\
  \ from ../src/.libs/lt-jupiter!])\n\nAT_CLEANUP\n```\n*列表 9-7：tests/jupiter.at：添加我们的第一个测试组——尝试\
  \ #1*\n\nLibtool 在 `src` 目录下为任何使用 Libtool 共享库的可执行文件添加一个包装脚本。该包装脚本允许 `jupiter` 找到它尝试使用的未安装的\
  \ Libtool 库。如第 7 章中提到的，这是 Libtool 提供的一种便利机制，使我们不必在程序安装之前费周章测试使用 Libtool 共享库的程序。\n\
  \n最终结果是 `src/jupiter` 脚本正在执行来自 `src/.libs/lt-jupiter` 的真实 `jupiter` 程序。\n\n\n\n\
  虽然从输出中并不明显，但测试失败时，testsuite 会创建多个 `testsuite.log` 文件。第一个是 `tests` 目录下的主 `testsuite.log`\
  \ 文件，即使所有测试都通过它也会被创建，设计用于在错误报告中发送给项目维护者。此外，在 `tests/testsuite.dir` 目录下的一个独立的编号目录中，也有同名的日志文件，用于记录失败的测试。这些目录的每一个名称都是失败测试组的编号。可以在输出中看到该测试组编号。虽然你只需要主\
  \ `testsuite.log` 文件，但由于包含了所有单独测试的 `testsuite.log` 文件的全部内容，该文件还包含了许多关于你的项目和测试环境的其他信息，维护者希望看到，但这些信息对我们在这里来说是干扰。\n\
  \n为了确切查看我们的测试是如何失败的，让我们检查 `tests/testsuite.dir/1` 目录下的 `testsuite.log` 文件内容：\n\n\
  ```\n$ cat tests/testsuite.dir/1/testsuite.log\n\n#                            \
  \ -*- compilation -*-\n\n1\\. jupiter.at:1: testing jupiter-execution ...\n\n./jupiter.at:2:\
  \ ../src/jupiter ➊\n\n--- /dev/null     2018-04-21 17:27:23.475548806 -0600 ➋\n\n\
  +++ /.../jupiter/tests/testsuite.dir/at-groups/1/stderr 2018-06-01 16:08:04.391926296\
  \ -0600\n\n@@ -0,0 +1 @@\n\n+/.../jupiter/tests/testsuite.dir/at-groups/1/test-source:\
  \ line 11: ../src/jupiter: ➌\n\n    No such file or directory\n\n--- -     2018-06-01\
  \ 16:08:04.399436755 -0600 ➍\n\n+++ /.../jupiter/tests/testsuite.dir/at-groups/1/stdout\
  \ 2018-06-01 16:08:04.395926314 -0600\n\n@@ -1 +1 @@\n\n-Hello from ../src/.libs/lt-jupiter!\n\
  \n+\n\n./jupiter.at:2: exit code was 127, expected 0 ➎\n\n1\\. jupiter.at:1: 1\\\
  . jupiter-execution (jupiter.at:1): FAILED (jupiter.at:2)\n\n$\n```\n\n首先注意，autotest\
  \ 会尽可能地将相关的源行写入 `testsuite.log` 文件。这在目前我们来说并不是大胜利，但如果 `testsuite.at` 或其包含的文件很长且复杂，你就能看到这些信息有多帮助。\n\
  \n在 ➊ 处，我们看到了传递给 `AT_CHECK` 的 `commands` 参数的参数，以及该参数在 `jupiter.at` 中传递给宏的行号。\n\n\
  然而，现在情况变得有点复杂了。`AT_CHECK` 中 `stdout` 和 `stderr` 参数的完全目的是为 `commands` 向这些输出流实际发送的内容提供一些对比文本。根据不重复现有功能的通用\
  \ Unix 哲学，autotest 的作者选择使用 `diff` 工具进行这些比较。从 ➋ 到 ➌（包含）的日志行显示了 `diff` 工具在比较 `original`\
  \ 文件（因为没有在 `stderr` 参数中传递任何值，所以是 `/dev/null`）和 `modified` 文件时的统一输出——即尝试执行 `../src/jupiter`\
  \ 期间向 stderr 输出流发送的文本。\n\n如果你熟悉统一 diff（unified diff）输出，这里有何简单的解释。从 ➋ 开始的两个行表示正在比较的对象。原始或减号（`---`）行表示比较的左侧，而修改或加号（`+++`）行表示比较的右侧。在这里，我们正在将\
  \ `/dev/null` 与名为 `/.../jupiter/tests/testsuite.dir/at-groups/1/stderr` 的临时文件进行比较，该文件被\
  \ autotest 用于在执行 `../src/jupiter` 期间捕获 stderr 流。\n\n以 `@@` 开头结尾的行是一个块（chunk）标记——这是\
  \ diff 告诉我们两个文件中不匹配的部分的方法。`diff` 显示的输出中可能有多多个块。在这种情况下，整个输出文本非常短，只需要一个块就能向我们显示差异。\n\
  \n块标记中的数字代表两个范围，用空格隔开。第一个范围以减号（`-`）开头，表示与 `original` 文件相关的范围，第二个范围以加号（`+`）开头，表示与\
  \ `modified` 文件相关的范围。这里是我们正在讨论的行：\n\n```\n@@ -0,0 +1 @@\n```\n\n一个范围由用逗号（`,`）分隔的两个整数值，或一个默认第二个值为\
  \ 1 的单个值组成。在这个示例中，比较的范围在原始文件中从零开始，长度为零行，而第二个文件的比较范围从第 1 行开始，长度为一行。\n\n---\n\n####\
  \ 理解 Diff 输出\n\n块标记中的数字代表两个范围，用空格隔开。第一个范围以减号（`-`）开头，表示与 `original` 文件相关的范围，第二个范围以加号（`+`）开头，表示与\
  \ `modified` 文件相关的范围。这里是我们正在讨论的行：\n\n```\n@@ -0,0 +1 @@\n```\n一个范围由用逗号（`,`）分隔的两个整数值，或一个默认第二个值为\
  \ 1 的单个值组成。在这个示例中，比较的范围在原始文件中从零开始，长度为零行，而第二个文件的比较范围从第 1 行开始，长度为一行。\n\n#### *发生了什么？*\n\
  \n\n\n第一次尝试假设 `jupiter` 程序（更准确地说说是 Libtool 包装脚本）位于相对于 `tests` 目录的 `../src/jupiter`。虽然这个假设是正确的，但我已经提过，每个测试组都在它们自己的临时目录中执行，因此，这个相对路径在另一个目录下无法工作是这完全合乎逻辑的。即使我们通过试错找出了需要使用多少个父目录引用，它也会非常脆弱；如果我们从不同的目录运行\
  \ `testsuite`，它将会失败，因为它紧密地依赖于相对于 `jupiter` 程序的特定位置运行。\n\n让我们尝试另一种方法。我们将利用由 `configure`\
  \ 生成并导入 `atconfig` 的变量。其中一个变量 `abs_top_builddir` 包含了顶层构建目录的绝对路径。因此，我们应该能够通过 `${abs_top_builddir}/src/jupiter`\
  \ 从任何地方成功引用 `jupiter`。\n\n但现在又遇到了另一个问题：`jupiter` 会打印它自己的路径，而我们刚刚决定使用 shell 变量获取该路径，因此我们还需要更改比较文本以使用该变量。然而，这一变化引起了另一个问题——如果我们期望\
  \ `AT_CHECK` 的 `stdout` 参数中的 shell 变量在宏进行比较之前展开，我们需要将 `AT_CHECK` 改为 `AT_CHECK_UNQUOTED`。让我们通过像列表\
  \ 9-10 所示修改 `jupiter.at` 来这些修改。\n\n### Git tag 9.2\n\n```\nAT_SETUP([jupiter-execution])\n\
  \nAT_CHECK_UNQUOTED([\"${abs_top_builddir}\"/src/jupiter],,\n\n                \
  \  [Hello from ${abs_top_builddir}/src/.libs/lt-jupiter!\n\n])\n\nAT_CLEANUP\n```\n\
  \n*列表 9-10:* `tests/jupiter.at`: *添加第一个测试组——尝试 #2*\n\n在这里，我们切换到使用 `AC_CHECK_UNQUOTED`，并且更改了第一个参数中的\
  \ `jupiter` 程序路径以及第三个参数中的比较文本，以使用从 `atconfig` 继承的 `abs_top_builddir` 变量。\n\n**注意**\n\
  \n`stdout` 参数末尾的换行符是有故意的，稍后会解释。\n\n让我们尝试一下：\n\n```\n$ make check\n\n--snip--\n\n\
  /bin/bash './testsuite'\n\n## ----------------------- ##\n\n## Jupiter 1.0 test\
  \ suite. ##\n\n## ----------------------- ##\n\n  1: jupiter-execution         \
  \                      ok\n\n## ------------- ##\n\n## Test results. ##\n\n## -------------\
  \ ##\n\n1 test was successful.\n\n--snip--\n\n$\n```\n\n再次，我只需要运行 `make`。尽管我们的更改是巨大的，甚至影响了我们在测试套件中调用的宏，但请记住，整个测试套件都是通过\
  \ `make check` 生成的。我们只需要执行 `autoreconf` 和 `configure` 的唯一情况是，当我们对 `configure.ac`\
  \ 或任何生成 `make check` 使用文件的模板进行了更改时，或者我们对 `Makefile.am` 文件进行了任何更改。\n\n这次尝试的结果要好得多，但列表\
  \ 9-10 中比较文本末尾那个额外的换行符是怎么回事？嗯，记得我们从 `jupiter` 向 `stdout` 发送了什么。列表 9-11 提供了提醒。\n\n\
  ```\n--snip--\n\n    printf(\"Hello from %s!\\n\", (const char *)data);\n\n--snip--\n\
  ```\n\n*列表 9-11:* `common/print.c`: *jupiter 发送到 stdout 的内容*\n\n比较文本与我们期望在 `jupiter`\
  \ 的 `stdout` 中找到的内容完全相同，因此我们最好确保包含写的每一个字符；末尾的换行符是该数据流的一部分。\n\n此时删除 `src/Makefile.am`\
  \ 中构建和运行 Automake 版本的测试代码可能是一个好主意。像列表 9-12 所示更改 `src/Makefile.am`。\n\n```\nSUBDIRS\
  \ = modules/hithere\n\nbin_PROGRAMS = jupiter\n\njupiter_SOURCES = main.c module.h\n\
  \njupiter_CPPFLAGS = -I$(top_srcdir)/include\n\njupiter_LDADD = ../libjup/libjupiter.la\
  \ -dlopen modules/hithere/hithere.la\n```\n\n*列表 9-12:* `src/Makefile.am`: *移除测试后该文件的更新完整内容*\n\
  \n**注意**\n\n我们所做的只是从文件的半部分删除了与测试相关的行。\n\n### 单元测试 vs 集成测试\n\n总体而言，autotest 版本并不比我们在\
  \ `src/Makefile.am` 中通过 Automake 测试框架执行测试时的版本要好多少。然而，添加新测试比我们在 `src/Makefile.am`\
  \ 的 `TESTS` 变量中需要做的操作要简单一点。事实上，Automake 版本变得简单的唯一方法是如果我们实际上编写了测试程序并在 check primary\
  \ 中构建它们。我们可能仍然需要在 check primary 中构建测试程序，但使用 autotest 时，调用它们并验证它们的输出是轻而易举的。\n\n\n\
  \n\n我们在这里所做的只是直接用短字符串调用 `print_it`，然后尝试验证 `print_it` 是否返回了零，并实际上将我们预期的内容传递给了 `printf`。注意，`print_it`\
  \ 是一个静态函数，按理它无法被其他模块访问，但因为我们在 `test_print.c` 的顶部包含了 `print.c`，所以我们实际上是将两个源文件合并为了同一个编译单元。\n\
  \n现在，让我们为这个测试程序编写构建代码。首先，我们需要在 `common/Makefile.am` 中添加几行，以便在运行 `make check` 时能够构建\
  \ `test_print` 程序。请如 列表 9-14 所示修改 `common/Makefile.am`。\n\n```\nnoinst_LIBRARIES\
  \ = libjupcommon.la\n\nlibjupcommon_la_SOURCES = jupcommon.h print.c\n\ncheck_PROGRAMS\
  \ = test_print\n\ntest_print_SOURCES = test_print.c\n```\n\n*列表 9-14：* `common/Makefile.am`:\
  \ *将 `test_print` 作为 `check_PROGRAM` 添加*\n\n当我们制作 `check` 目标时，现在会在 `common` 目录下获得一个新程序\
  \ `test_print`。现在我们需要在测试套件中添加对该程序的调用。在 `tests` 目录下创建一个名为 `print.at` 的新文件，如 列表 9-15\
  \ 所示。\n\n```\nAT_SETUP([print])\n\nAT_CHECK([\"${abs_top_builddir}/common/test_print\"\
  ])\n\nAT_CLEANUP\n```\n\n*列表 9-15：* `tests/print.at`: *添加打印测试*\n\n我们还需要在 `testsuite.at`\
  \ 中为此测试添加 `m4_include` 语句，如 列表 9-16 所示。\n\n```\nm4_include([jupiter.at])\n\nm4_include([print.at])\n\
  ```\n\n*列表 9-16：* `tests/testsuite.at`: *将 `print.at` 添加到 `testsuite.at`*\n\n最后，我们需要将这个新的源文件添加到\
  \ `tests/Makefile.am` 的 `TESTSOURCES` 变量中，如 列表 9-17 所示。\n\n```\n--snip--\n\nTESTSUITE\
  \ = $(srcdir)/testsuite\n\nTESTSOURCES = $(srcdir)/local.at $(srcdir)/testsuite.at\
  \ \\\n\n  $(srcdir)/jupiter.at $(srcdir)/print.at\n\nAUTOM4TE = $(SHELL) $(top_srcdir)/missing\
  \ --run autom4te\n\nAUTOTEST = $(AUTOM4TE) –language=autotest\n\n--snip--\n```\n\
  \n*列表 9-17：* `tests/Makefile.am`: *将 `print.at` 添加到 `TESTSOURCES`*\n\n由于 `test_print`\
  \ 程序仅使用 shell 状态码来指示错误，在 `AT_CHECK` 中使用它已经是最简单了。你只需要第一个参数——程序本身的名称。如果 `test_print`\
  \ 有多个测试，你可能接受一个命令行参数（在同一个参数内）来指示你想运行哪一个测试，然后添加多次 `AC_CHECK` 调用，每次带有不同的参数运行 `test_print`。\n\
  \n注意，我们已经开始了一个新的测试组——正如我之前提到的，你应该尽量将你的测试组限制在单个测试上，除非测试的性质使得它们在同一个基于文件的数据集上共同工作。\n\
  \n让我们试一下。注意，为了运行新测试，我们实际上只需要制作 `check` 目标来更新并执行 `testsuite`。然而，由于我们在 `tests/Makefile.am`\
  \ 中添加了 `print.at` 依赖，我们可能也应该运行 `autoreconf` 和 `configure`。如果我们开启了维护者模式（maintainer\
  \ mode），额外的维护者模式规则将替我们完成这些：\n\n```\n$ autoreconf -i\n\n--snip--\n\n$ ./configure\n\
  \n--snip--\n\n$ make check\n\n--snip--\n\n/bin/bash './testsuite'\n\n## -----------------------\
  \ ##\n\n## Jupiter 1.0 test suite. ##\n\n## ----------------------- ##\n\n  1: jupiter-execution\
  \                                                 ok\n\n  2: print             \
  \                                                ok\n\n## ------------- ##\n\n##\
  \ Test results. ##\n\n## ------------- ##\n\nAll 2 tests were successful.\n\n--snip--\n\
  \n$\n```\n\n### 管理细节\n\n在之前描述 `tests/Makefile.am` 内容时（靠近 列表 9-2），我提到我们需要向该文件添加一些额外的基础设施以完成与\
  \ Automake 的对接。现在让我们处理这些细节。\n\n我们已经看到 `make (all)` 和 `make check` 运行良好，可以构建我们的产品并构建和执行我们的测试套件。但我们忽略了\
  \ Automake 为我们连接的一些其他目标——特别是 `installcheck`、`clean` 以及与分发相关的目标如 `dist` 和 `distcheck`。这里有一个值得考虑的通用教训：每当我们向\
  \ `Makefile.am` 添加自定义规则时，都需要考虑对 Automake 生成的标准目标的影响。\n\n### 分发测试文件\n\n有几个生成的文件需要分发。这些文件\
  \ Automake 本生并不这些，因此 Automake 需要被明确告知它们。这是通过 Automake 识别的 `EXTRA_DIST` 变量实现的，如 列表\
  \ 9-18 所示，将其添加到 `tests/Makefile.am` 中。\n\n```\nEXTRA_DIST = testsuite.at local.at\
  \ jupiter.at print.at\n\nTESTSUITE = $(srcdir)/testsuite\n\nTESTSOURCES = $(srcdir)/local.at\
  \ $(srcdir)/testsuite.at \\\n\n  $(srcdir)/jupiter.at $(srcdir)/print.at\n```\n\n\
  *列表 9-18：* `tests/Makefile.am`: *确保测试文件被分发*\n\n在这里，我添加了 `testsuite.at`、`local.at`、`jupiter.at`\
  \ 和 `print.at`。`check-local` 和 `installcheck-local` 之间的区别是为 `testsuite` 添加了 `AUTOTEST_PATH`\
  \ 命令行选项，将其指向 `$(DESTDIR)$(bindir)` 中的 jupiter。`AUTOTEST_PATH` 在调用 `AT_CHECK` 中的命令之前会被接到\
  \ shell `PATH` 变量；因此你可以编写假设 `PATH` 包含已安装的 jupiter 路径的代码。然而，测试的设计是为了执行已安装或未安装的程序，因此在测试命令中继续导出并使用完整路径是一个好主意。\n\
  \n**注意**\n\n*我本想直接在 `EXTRA_DIST` 中使用 `$(TESTSOURCES)`，但 Automake 解析 `EXTRA_DIST`\
  \ 设计用于引用当前目录的文件。*\n\n### 检查已安装的产品\n\n我们写了一个 `check` 目标；可能支持 Automake 也支持的 `installcheck`\
  \ 目标。通过向此 `Makefile.am` 文件添加 `installcheck-local` 目标来实现，如 列表 9-19 所示。\n\n```\n--snip--\n\
  \ncheck-local: atconfig atlocal $(TESTSUITE)\n\n        $(SHELL) '$(TESTSUITE)'\
  \ $(TESTSUITEFLAGS)\n\ninstallcheck-local: atconfig atlocal $(TESTSUITE)\n\n   \
  \     $(SHELL) '$(TESTSUITE)' AUTOTEST_PATH='$(DESTDIR)$(bindir)' $(TESTSUITEFLAGS)\n\
  \n--snip--\n```\n\n*列表 9-19：* `tests/Makefile.am`: *支持已安装产品的测试*\n\n我们需要做一个决定。当用户输入\
  \ `make check` 时，他们显然是指测试构建树中的 jupiter 副本。但当他们输入 `make installcheck` 时，他们当然想要检查已安装的程序，无论是在默认安装位置，还是用户通过命令行\
  \ make 变量（如 `DESTDIR`、`prefix` 和 `bindir`）指定的位置。\n\n\n\n\n\n这引出了新问题：当我们对未安装的 jupiter\
  \ 运行测试时，我们依赖于 Libtool 的封装脚本来确保 jupiter 能够找到 `libjupiter.so`。一旦我们开始测试已安装的 jupiter，我们就必须负责告诉\
  \ jupiter `libjupiter.so` 所在的位置。如果 jupiter 安装在标准位置（例如 `/usr/lib`），系统自然会找到 `libjupiter.so`。否则，我们必须设置\
  \ `LD_LIBRARY_PATH` 环境变量来指向它。\n\n那么，我们该如何编写测试以使其在两种情况下都能正常工作呢？一个有趣（但有错误的）方法如 Listing\
  \ 9-20 所示。\n\n```\nAT_SETUP([jupiter-execution])\n\nset -x\n\nfind_jupiter()\n\n\
  {\n\n    jupiter=\"$(type -P jupiter)\"\n\n    LD_LIBRARY_PATH=\"$(dirname \"${jupiter}\"\
  )/../lib\" export LD_LIBRARY_PATH\n\n    compare=\"${jupiter}\"\n\n    if test \"\
  x${jupiter}\" == x; then\n      jupiter=\"${abs_top_builddir}/src/jupiter\"\n  \
  \    compare=\"$(dirname “${jupiter}”)/.libs/lt-jupiter\"\n    fi\n}\n\nfind_jupiter\n\
  \nAT_CHECK_UNQUOTED([\"${jupiter}\"],,\n\n                  [Hello from ${compare}!\n\
  \n])\n\nAT_CLEANUP\n```\n\n*Listing 9-20:* tests/jupiter.at: *对已安装和未安装的 jupiter\
  \ 进行执行测试——尝试#*\n\n`find_jupiter` shell 函数尝试使用 shell 的 `type` 命令在 `PATH` 中定位 jupiter。如果第一个结果为空，我们就回退到使用未安装的\
  \ jupiter 版本。\n\n该函数设置两个 shell 变量：`jupiter` 和 `compare`。`jupiter` 变量是 jupiter 的完整路径。`compare`\
  \ 变量派自 `jupiter`，包含 `${jupiter}` 的值，或者包含未安装版本的 Libtool 路径和名称。在这两种情况下，我们都可以 `LD_LIBRARY_PATH`\
  \ 设置为相对于找到的 jupiter 目录的 `../lib` ，因为那很可能是^(7) 它的安装位置。\n\n这种方法存在很多问题。首先，它没有很好地处理\
  \ jupiter *本应该* 安装但在指定的或隐含的安装路径中未找到的情况。在这种情况下，代码会静静地回退到测试未安装的版本——这可能不是你想要的。另一个问题是\
  \ `find_jupiter` 会在 `PATH` 中的任何地方定位 jupiter，即使该实例并不是你想要测试的那一个。但还有一个更阴险的 bug：如果你执行\
  \ `make check` 意图测试未安装的版本，而已安装的 jupiter 版本恰好在 `PATH` 某个处，那么被测试的就是那个版本。\n\n遗憾的是，`AUTOTEST_PATH`\
  \ 在命令行未指定时默认为一个非空值，而这本是一个区分 `make check` 和 `make installcheck` 的好方法。然而，`AUTOTEST_PATH`\
  \ 默认确实是 `AC_CONFIG_TESTDIR` 中指定的目录名称，这恰好也是 `${at_testdir}` 的值——它是 `AC_CONFIG_TESTDIR`\
  \ 在 `atconfig` 中生成的变量之一。我们可以利用这一事实，通过比较 `${AUTOTEST_PATH}` 和 `${at_testdir}` 来区分\
  \ `make check` 和 `make installcheck`。如 Listing 9-21 所示修改 `tests/jupiter.at`。\n\n\
  ```\n--snip--\n\nset -x\n\nfind_jupiter()\n\n{\n  if test \"x${AUTOTEST_PATH}\"\
  \ == \"x${at_testdir}\"; then\n\n    jupiter=\"${abs_top_builddir}/src/jupiter\"\
  \n    compare=\"$(dirname \"${jupiter}\")/.libs/lt-jupiter\"\n  else\n\n    jupiter=\"\
  ${AUTOTEST_PATH}/jupiter\"\n    LD_LIBRARY_PATH=\"${AUTOTEST_PATH}/../lib\" export\
  \ LD_LIBRARY_PATH\n\n    compare=\"${jupiter}\"\n  fi\n}\n\njupiter=$(find_jupiter)\n\
  \n--snip--\n```\n\n*Listing 9-21:* tests/jupiter.at: *使用 AUTOTEST_PATH 的更好方法*\n\n\
  现在，当执行 `make check` 时，`jupiter` 变量将始终直接设置为构建树中的未安装版本（`compare` 将被设置为 `.../.libs/lt-jupiter`），但当进入\
  \ `make installcheck` 时，它将被设置为 `${AUTOTEST_PATH}*/jupiter`（`compare` 将被设置为相同的值）。此外，由于我们能够完全区分已安装和未安装测试，我们可以只为已安装的\
  \ jupiter 版本设置 `LD_LIBRARY_PATH`。\n\n如果 `AUTOTEST_PATH` 设置错误（这可能会发生，例如当用户在 make\
  \ 命令行上错误设置了 `DESTDIR` 或 `prefix` 时），测试将失败，因为找不到 `${jupiter}`。\n\n如果我要添加需要运行 jupiter\
  \ 程序的额外测试，这些行将是 `local.at` 的完美候选。问题是，设计在测试内部运行的 shell 脚本 *必须* 在调用 `AT_SETUP` 和 `AT_CLEANUP`\
  \ 之间定义并执行；否则，它在生成测试套件时会被从 autom4te 输出流中省略。那么，`local.at` 到底有什么用呢？其实你不能在 `local.at`\
  \ 中直接编写 shell 代码，但你可以定义可以在测试模块内部调用的 M4 宏。让我们如 Listing 9-22 所示将 `find_jupiter` 的功能移动到\
  \ `local.at` 中。\n\n```m4\nAT_INIT\n\nm4_define([FIND_JUPITER], [[set -x\n\nif test\
  \ \"x${AUTOTEST_PATH}\" == \"x${at_testdir}\"; then\n\n  jupiter=\"${abs_top_builddir}/src/jupiter\"\
  \n  compare=\"$(dirname ${jupiter})/.libs/lt-jupiter\"\n\nelse\n\n  LD_LIBRARY_PATH=\"\
  ${AUTOTEST_PATH}/../lib\" export LD_LIBRARY_PATH\n\n  jupiter=\"${AUTOTEST_PATH}/jupiter\"\
  \n\n  compare=\"${jupiter}\"\n\nfi]])\n```\n\n*Listing 9-22:* tests/local.at: *将\
  \ find_jupiter 移动到宏*\n\n**注意**：*你可能注意到 m4_define 的第二个参数周围有一层方括号。在这个示例中这并不必要，因为嵌入代码中没有特殊字符。然而，如果有的话，双引号将允许特殊字符（嵌入的方括号，甚至是先定义的\
  \ M4 宏名）被原样生成，而不受 m4 工具的干扰。*\n\n现在，如 Listing 9-23 所示修改 `tests/jupiter.at`。\n\n```\n\
  AT_SETUP([jupiter-execution])\n\nFIND_JUPITER\n\nAT_CHECK_UNQUOTED([\"${jupiter}\"\
  ],,\n\n                  [Hello from ${compare}!\n\n])\n\nAT_CLEANUP\n```\n\n*Listing\
  \ 9-23:* tests/jupiter.at: *调用 FIND_JUPITER 宏*\n\n\n\n\n\n```\n $ make install DESTDIR=$PWD/inst\n\
  \n   --snip--\n\n   $ make check TESTSUITEFLAGS=-v\n\n   --snip--\n\n   Making check\
  \ in tests\n\n   make[1]: Entering directory '/.../jupiter/tests'\n\n   make   \
  \ check-local\n\n   make[2]: Entering directory\n\n     '/home/jcalcote/dev/book/autotools2e/book/sandbox/tests'\n\
  \n   /bin/bash './testsuite' -v\n\n   ## ----------------------- ##\n\n   ## Jupiter\
  \ 1.0 test suite. ##\n\n   ## ----------------------- ##\n\n   1\\. jupiter.at:1:\
  \ testing jupiter-execution ...\n\n   ++ test xtests == xtests\n\n   ➊ ++ jupiter=/.../jupiter/src/jupiter\n\
  \n   +++ dirname /.../jupiter/src/jupiter\n\n   ++ compare=/.../jupiter/src/.libs/lt-jupiter\n\
  \n   ++ set +x\n\n   ./jupiter.at:3: \"${jupiter}\"\n\n   1\\. jupiter.at:1:   \
  \ ok\n   --snip--\n\n   $ make installcheck DESTDIR=$PWD/inst TESTSUITEFLAGS=-v\n\
  \n   --snip--\n\n   Making installcheck in tests\n\n   make[1]: Entering directory\
  \ '/.../jupiter/tests'\n\n   /bin/bash './testsuite' AUTOTEST_PATH='/.../jupiter/inst/usr/local/bin'\
  \ -v\n\n   ## ----------------------- ##\n\n   ## Jupiter 1.0 test suite. ##\n\n\
  \   ## ----------------------- ##\n\n   1\\. jupiter.at:1: testing jupiter-execution\
  \ ...\n\n   ++ test x/.../jupiter/inst/usr/local/bin == xtests\n\n   ++ LD_LIBRARY_PATH=/.../jupiter/inst/usr/local/bin/../lib\n\
  \n   ++ export LD_LIBRARY_PATH\n\n   ➋ ++ jupiter=/.../jupiter/inst/usr/local/bin/jupiter\n\
  \n   ++ compare=/.../jupiter/inst/usr/local/bin/jupiter\n\n   ++ set +x\n\n   ./jupiter.at:3:\
  \ \"${jupiter}\"\n\n   1\\. jupiter.at:1:    ok\n   --snip--\n\n   $\n```\n\n在这里，执行\
  \ `make check TESTSUITEFLAGS=-v` 的结果在 ➊ 处向我们显示 `jupiter` 是从构建树中取的，且 `compare` 被设置为\
  \ Libtool 二进制文件的路径；而 `make installcheck DESTDIR=$PWD/inst TESTSUITEFLAGS=-v` 在 ➋\
  \ 处表明 `jupiter` 是从我们指定的安装路径取的，且 `compare` 被设置为相同的位置。在此代码路径中，`LD_LIBRARY_PATH` 也被设置了。\n\
  \n### 清理\n\n`testsuite` 程序有一个 `--clean` 命令行选项，可以清理 `tests` 目录下的所有测试临时文件。为了将其整合到\
  \ `clean` 目标，我们添加了一个 `clean-local` 规则，如列表 9-24 所示。\n\nGit tag 9.6\n\n```\ninstallcheck-local:\
  \ atconfig atlocal $(TESTSUITE)\n\n        $(SHELL) '$(TESTSUITE)' AUTOTEST_PATH='$(bindir)'\
  \ $(TESTSUITEFLAGS)\n\nclean-local:\n\n        test ! -f '$(TESTSUITE)' || $(SHELL)\
  \ '$(TESTSUITE)' --clean\n\n        rm -rf atconfig\n\natconfig: $(top_builddir)/config.status\n\
  \n        cd $(top_builddir) && $(SHELL) ./config.status tests/$@\n```\n\n*列表 9-24:*\
  \ `tests/Makefile.am`: *为测试添加对 make clean 支持*\n\n如果 `testsuite` 存在，它会被要求清理自己产生的临时文件。我还额外添加了一个命令来删除生成的\
  \ `atconfig` 脚本，因为在检查构建包来源的分发目录时，如果在执行 `clean` 目标期间没有删除该文件，`make distcheck` 就会失败，而且\
  \ `atconfig` 并不是由 Automake 或由 Automake 监控的任何 Autoconf 代码生成的。此时，你可以尝试运行 `make dist`\
  \ 或 `make distcheck`，看看现在是否能按预期工作。\n\n**注意**\n\n你可能认为 `clean-local` 目标是可选的，但它是必要的，这样在构建发行归档时，就不会因为\
  \ `distcheck` 运行 `make clean` 后留下了额外文件而导致失败。\n\n另外请注意，我们不需要也不应该尝试去清理生成到源树中的文件，例如\
  \ `package.m4` 和 `testsuite` 本身。为什么不呢？就像 `configure` 一样，autotest 产品如 `testsuite`\
  \ 处于我们手写的源文件与构建树中的产品文件之间。它们从源码构建，但存储在源树中并最终包含在归档中。\n\n### 细节优化\n\n我喜欢做的另一件事是在 `local.at`\
  \ 文件中调用 `AT_INIT` 之后添加 `AT_COLOR_TESTS` 的调用。用户始终可以通过 `testsuite` 的命令行参数 `--color`\
  \ 来指定彩色的测试输出，但使用此宏允许你默认启用彩色测试输出。如列表 9-25 所示，修改你的 `local.at` 文件。\n\nGit tag 9.7\n\
  \n```\nAT_INIT\n\nAT_COLOR_TESTS\n\nm4_define([FIND_JUPITER], [set -x\n\nif test\
  \ \"x${AUTOTEST_PATH}\" == \"x${at_testdir}\"; then\n\n--snip--\n```\n\n*列表 9-25:*\
  \ `tests/local.at`: *将彩色测试输出设置为默认值*\n\n你应该注意到，每个成功测试后的 `ok` 文本以及总结行 `All 2 tests\
  \ were successful.` 现在是绿色的。如果你遇到任何失败测试，这些测试将以红色显示 `FAILED (testsuite.at:*N*)`，总结行如下所示：\n\
  \n```\nERROR: All 2 tests were run,\n\n1 failed unexpectedly.\n```\n\n### 极简方法\n\
  \n我在开头提到过，我们将如何将系统精简到核心需求。以下是我们可以省略的内容：\n\n- `tests/local.at`: 将此文件的内容复制到 `testsuite.at`\
  \ 顶部并删除该文件。\n- `tests/atlocal.in`: 假设你不需要将配置变量传递到测试环境中，从 `configure.ac` 的 `AC_CONFIG_FILES`\
  \ 调用中移除对产品文件 `atlocal` 的引用并删除此模板文件。\n- `tests/*.at`: （testsuite 包含的子测试文件）将这些文件的内容顺序合并到\
  \ `testsuite.at` 中并删除文件；移除对应的 `m4_include` 调用。编辑 `tests/Makefile.am` 并移除 `EXTRA_DIST`\
  \ 和 `TESTSOURCES` 变量，以及 `check-local` 和 `installcheck-local` 规则。我不会移除 `package.m4`\
  \ 规则，但如果你愿意，也可以通过将此信息复制到文件中来移除。\n\n### 总结\n\n我们涵盖了 autotest 的基础，但在你的 `testsuite.at`\
  \ 文件中还有十几个可用的 `AT_*` 宏。*GNU Autoconf 手册*第 19.2 节对其进行了详细说明。我展示了如何将 autotest 接入 Automake\
  \ 体系。如果你选择在没有 Automake 的情况下使用 autotest，那么 Automake 的 `tests/Makefile.am` 与 Autoconf\
  \ 的 `tests/Makefile.in` 之间将存在差异，因为你不能再依赖 Automake 来完成某些工作。然而，如果你正在编写自己的 `Makefile.in`\
  \ 模板，这些修改对你来说将变得显而易见。\n\n\n\n\n尽管如此，只要知道我提交到公司仓库的代码已经经过了充分测试，我晚上就能睡得更踏实。在与同事讨论围绕我良好测试的代码相关的\
  \ Bug 时，我也更有信心。Autotest 帮助减少了这些项目涉及的工作量。\n\n随着本章的结束，Jupiter 项目也画上了句号——这是一件好事，因为我将\
  \ *Hello, world!* 的概念推向了比任何人权利做的都要*远*得多。从现在开始，我们将关注更孤立的主题和真实世界的示例。\n\n## 10 使用 PKG-CONFIG\
  \ 查找构建依赖\n\n*人们在尝试设计完全万无一失的东西时，犯的一个常见错误是低估了完全愚蠢者的智慧。*\n\n——道格拉斯·亚当斯，《银河系漫游指南》\n\n\
  ![Image](img/common.jpg)\n\n假设你的项目依赖于一个名为 `stpl` 的库——某个第三方库。你的构建系统如何确定 `libstpl.so`\
  \ 安装在终端用户系统的哪个位置？`stpl` 的头文件在哪里？你只是简单地假设它们在 `/usr/lib` 和 `/usr/include` 吗？如果你不告诉\
  \ Autoconf 去其他地方查找，这实际上就是它所做的，而且对于许多软件包来说，这也许没问题——将库和头文件安装到这些目录是一个常见的惯例。\n\n但如果它们没有安装在这些位置呢？或者它们是在本地构建并安装到\
  \ `/usr/local` 树下的。在你的项目中使用 `stpl` 时，应该使用哪些编译器和链接器选项？这些都是从一开始就困扰着开发者的几个问题，而 Autotools\
  \ 在管理这个问题上实际上并没有做什么。Autoconf 期望你使用的任何库都安装在“标准位置”，意味着安装在预处理器和链接器自动查找头文件和库的目录中。如果用户拥有该库但它被安装在不同的位置，Autotools\
  \ 则期望终端用户知道如何解释配置失败。事实上，有许多充分的理由为什么许多库没有安装在这些标准位置。\n\n此外，Autoconf 无法轻松找到完全没有安装的库。例如，你可能刚刚构建了一个库包，并希望另一个包从第一个包的构建目录结构中获取头文件和库。这通过\
  \ Autoconf 是可以实现的，但它涉及到终端用户在 `configure` 命令行上设置 `CPPFLAGS` 和 `LDFLAGS` 等变量。项目维护者可以通过\
  \ `AC_ARG_ENABLE` 和 `AC_ARG_WITH` 宏为他们预计可能在标准位置难以找到的库提供用户指定的配置选项，从而让事情变得简单一点，但如果你的项目使用了大量的第三方库，尝试确定其中哪些对用户来说特别棘手将仅仅是猜想。而且，用户通常不是程序员；我们不能依靠他们拥有足够的背景来知道在选项值中使用什么，即使我们确实为有问题的依赖项提供了命令行选项。在整个章节中，我将这些问题称为*构建依赖问题*。\n\
  \n有一个工具通过软件设计中一种非常常用的策略——提供另一层间接层，以更优雅的方式为这类类型的问题提供了解决方案。它并不是 GNU Autotools 的一部分。无论如何，在过去的\
  \ 20 年里，它的使用已变得如此频繁，以至于在任何讨论 Linux 构建系统的书中，如果不包含对 `pkg-config` 的描述将是一个疏忽。`pkg-config`\
  \ 之所以像今天这样好用，是因为有很多项目已经开始使用它——特别是库项目，而最尤其是那些安装在非标准位置的库项目。\n\n在本章中，我们将查看 `pkg-config`\
  \ 的组件和功能，以及如何在你的项目中使用它。对于你自己的库项目，我们还将讨论当你的包安装到用户（或我喜欢称他们为潜在贡献者）系统中时，如何更新 `pkg-config`\
  \ 数据库。\n\n在我们开始之前，允许我先声明，本章引用了很多文件系统对象，这些对象在你的 Linux 发行版中存在也可能不存在，或者以不同的形式或位置存在。这就是我们所做工作的本质——我们正在讨论带有库和头文件的软件包，这些文件在不同的\
  \ Linux 发行版上可能位于不同的位置。我会并在遇到时指出此类潜在的差异，这样当我们的两个系统没有完全对齐时，你就不会感到太惊讶。\n\n### pkg-config\
  \ 概述\n\n`pkg-config` 是一个由 [freedesktop.org](http://freedesktop.org) 项目维护的开源软件实用。`pkg-config`\
  \ 网站是 [freedesktop.org](http://freedesktop.org) 项目网站的一部分。`pkg-config` 项目是将 `gnome-config`\
  \ 脚本（gnome 构建系统的一部分）转换为更通用的工具的努力成果，而且它似乎很受欢迎。`pkg-config` 的一些灵感也来自 `gtk-config`\
  \ 程序。\n\n### 关于 PKG-CONFIG 克隆版的说明\n\n[freedesktop.org](http://freedesktop.org) 的\
  \ `pkg-config` 项目已经存在很久并获得了一批相当忠实的粉丝。作为直接结果，现在存在其他项目提供与 `pkg-config` 项目相似（通常完全相同）的功能。我能想到的是\
  \ `pkgconf` 项目（当你要求 `yum` 包管理器为你安装 `pkg-config` 时，红帽的 Fedora Linux 似乎更倾向于它）。\n\n\
  不要将这两者混淆。`pkgconf` 项目是原始 `pkg-config` 项目的现代克隆版本，号称效率更高——就我而言，它很可能符合这些说法。无论如何，本章是关于\
  \ `pkg-config` 的。如果你发现了一个提供与 `pkg-config` 功能类似的项目并喜欢它，那么请尽管使用它。我的目标在这里是教你关于 `pkg-config`。如果这些材料帮助你理解了如何使用\
  \ `pkgconf` 或另一个 `pkg-config` 克隆版本，那么你从这本书中获得的正是我希望传达的内容。\n\n尽管如此，我无法涵盖所有不同 `pkg-config`\
  \ 克隆版本之间所有的细微差异。如果你想跟随我的示例，而你的 Linux 发行版没有为你安装原始的 `pkg-config` 包，你随时可以在浏览器中导航到 [`www.freedesktop.org/wiki/Software/pkg-config`](https://www.freedesktop.org/wiki/Software/pkg-config)\
  \ 并下载安装版本 0.29.2 的原始 `pkg-config` 项目\n\n`pkg-config` 的使用非常简单，通过调用 `pkg-config` 命令行工具并带有显示所需数据的选项来实现。当你正在查找库和头文件时，“所需数据”包含了软件包版本信息以及指定库和头文件位置的编译器和链接器选项。例如，为了获取访问库头文件所需的\
  \ C 预处理器标志，只需在 `pkg-config` 命令行上指定 `--cflags` 选项，适用于包的编译器选项就会显示在标准输出上。你可以根据需要捕获这些输出并将其添加到配置脚本和\
  \ Makefile 中的编译器命令行中。\n\n\n\n\n也许你会想，既然 Autoconf 提供了 `AC_CHECK_LIB` 和 `AC_SEARCH_LIBS`\
  \ 宏，我们为什么还需要 `pkg-config` 这样的工具。首先，正如我之前提到的，Autoconf 宏的设计初衷仅在“标准位置”查找库。你可以通过在 `CPPFLAGS`（使用\
  \ `-I` 选项）和 `LDFLAGS`（使用 `-L` 选项）中预加载搜索路径来欺骗这些宏去查找其他地方。然而，`pkg-config` 的设计目的是帮助你找到可能安装在只有你用户的\
  \ `pkg-config` 安装才知道的地方的库；`pkg-config` 最棒的一点在于，它知道如何在终端用户的系统上找到这些用户甚至都不知道的库和头文件。`pkg-config`\
  \ 还能当用户尝试静态链接你的库时，告诉你的构建系统所需的额外依赖。因此，它有效地向用户隐藏了此类细节，而这正是我们所追求的用户体验。\n\n然而，在 Autotools\
  \ 中使用 `pkg-config` 也有一些注意事项。在本书的第一版中，我建议随 `pkg-config` 一带的 `PKG_CHECK_MODULES` M4\
  \ 宏是将其与 Autoconf 使用的良好方法。此后，我对这个问题修改了想法，因为多年来我发现，在某些相当常见的情况下，使用这个宏引起的问题比它解决的还要多。此外，`pkg-config`\
  \ 在 shell 脚本中使用起来非常简单，以将其封装在透明度不高的 M4 宏中显得毫无意义。我们将在本章中更详细地讨论这个话题，但我想先为后续示例中你将看到的使用模式铺垫一下。\n\
  \n### 深入学习\n\n让我们先查看 `pkg-config` 命令的 `--help` 选项输出：\n\n```\n$ pkg-config --help\n\
  \nUsage:\n\n  pkg-config [OPTION...]\n\n--snip--\n\nApplication Options:\n\n--snip--\n\
  \n  --modversion                               output version for package\n\n--snip--\n\
  \n  --libs                                     output all linker flags\n\n  --static\
  \                                   output linker flags for static linking\n\n--snip--\n\
  \n  --libs-only-l                              output -l flags\n\n  --libs-only-other\
  \                          output other libs (e.g. -pthread)\n\n  --libs-only-L\
  \                              output -L flags\n\n  --cflags                   \
  \                output all pre-processor and compiler flags\n\n  --cflags-only-I\
  \                            output -I flags\n\n  --cflags-only-other          \
  \              output cflags not covered by the cflags-only-I option\n\n  --variable=NAME\
  \                            get the value of variable named NAME\n\n  --define-variable=NAME=VALUE\
  \               set variable NAME to VALUE\n\n  --exists                       \
  \            return 0 if the module(s) exist\n\n  --print-variables            \
  \              output list of variables defined by the module\n\n  --uninstalled\
  \                              return 0 if the uninstalled version of one or more\n\
  \n                                             module(s) or their dependencies will\
  \ be used\n\n  --atleast-version=VERSION                  return 0 if the module\
  \ is at least version VERSION\n\n  --exact-version=VERSION                    return\
  \ 0 if the module is at exactly version VERSION\n\n  --max-version=VERSION     \
  \                 return 0 if the module is at no newer than version\n\n       \
  \                                      VERSION\n\n  --list-all                 \
  \                list all known packages\n\n  --debug                          \
  \          show verbose debug information\n\n  --print-errors                  \
  \           show verbose information about missing or conflicting\n\n          \
  \                                   packages (default unless --exists or\n\n   \
  \                                          --atleast/exact/max-version given on\
  \ the command line)\n\n--snip--\n\n$\n```\n\n我在这里只展示了我认为最有用的选项。还有十几个左右的选项，但这些是我们在\
  \ `configure.ac` 文件中一直会用的。（我冒昧地对长描述行进行了换行处理，因为 `pkg-config` 似乎认为每个人都有 300 列的显示器。）\n\
  \n让我们先列出系统中 `pkg-config` 感知到的所有模块。以下是我系统中一些模块的示例：\n\n```\n$ pkg-config --list-all\n\
  \n--snip--\n\nsystemd                        systemd - systemd System and Service\
  \ Manager\n\nfontutil                       FontUtil - Font utilities dirs\n\nusbutils\
  \                       usbutils - USB device database\n\nbash-completion      \
  \          bash-completion - programmable completion for the bash shell\n\nlibcurl\
  \                        libcurl - Library to transfer files with ftp, http, etc.\n\
  \n--snip--\n\nnotify-python                  notify-python - Python bindings for\
  \ libnotify\n\nnemo-python                    Nemo-Python - Nemo-Python Components\n\
  \nlibcrypto                      OpenSSL-libcrypto - OpenSSL cryptography library\n\
  \nlibgdiplus                     libgdiplus - GDI+ implementation\n\nshared-mime-info\
  \               shared-mime-info - Freedesktop common MIME database\n\nlibssl  \
  \                       OpenSSL-libssl - Secure Sockets Layer and cryptography libraries\n\
  \nxbitmaps                       X bitmaps - Bitmaps that are shared between X applications\n\
  \n--snip--\n\nxkbcomp                        xkbcomp - XKB keymap compiler\n\ndbus-python\
  \                    dbus-python - Python bindings for D-Bus\n\n$\n```\n\n`Pkg-config`\
  \ 通过让安装过程更新 `pkg-config` 数据库来*感知*到一个包，这个数据库无非 `pkg-config` 检查以解析查询的已知目录。数据库条目只是以\
  \ `.pc` 结尾的纯文本文件。因此，在安装期间让 `pkg-config` 感知你的库项目并不比生成并安装一个文件更困难，Autoconf 可以帮助我们生成这个文件，正如我们后后看到的。\n\
  \n\n\n\n那么安装在自定义位置的包或尚未安装的包呢？pkg-config 针对这些情况也提供了解决方案。`PKG_CONFIG_PATH` 环境变量可以将用户指定的路径附加到\
  \ `pkg-config` 用于搜索其数据文件的默认搜索路径之前。在我们后续介绍关于在 `configure.ac` 中使用 `pkg-config` 命令的更多细节时，我们将发现如何使用此功能。\n\
  \n## 编写 pkg-config 元数据文件\n\n如前所述，pkg-config 的 `.pc` 文件仅仅是短文本文件，它们描述了构建和链接过程的关键方面，并提供给使用这些依赖包组件的下游构建过程。\n\
  \n让我们来看一下我系统上的一个示例 `.pc` 文件——用于 `libssl` 库的那个，它是 OpenSSL 包的一部分。首先，我们需要找到它：\n\n```\n\
  $ pkg-config --variable pcfiledir libssl\n\n/usr/lib/x86_64-linux-gnu/pkgconfig\n\
  \n$\n```\n\n`--variable` 选项允许你查询变量的值，而 `pcfiledir` 是一个 pkg-config 定义的变量，每个 `.pc`\
  \ 文件都存在该变量。我将在本章后面介绍预定义变量的完整列表。`pcfiledir` 变量显示了 `pkg-config` 发现的文件当前位置。这个变量的巧妙之处在于，它也可以用于你的\
  \ `.pc` 文件内部，以提供一种重定位机制。如果你的库路径和头文件路径在 `.pc` 文件中都是相对于 `${pcfiledir}` 的，你就可以将其移动到任何你想的地方（只要你将它定位的库和头文件移动到相同的相对位置即可）。\n\
  \n我在 列表 10-1 中提供了我的 `libssl.pc` 文件的完整内容。\n\n```\n➊ prefix=/usr\n\n   exec_prefix=${prefix}\n\
  \n   libdir=${exec_prefix}/lib/x86_64-linux-gnu\n\n   includedir=${prefix}/include\n\
  \n➋ Name: OpenSSL-libssl\n\n   Description: Secure Sockets Layer and cryptography\
  \ libraries\n\n   Version: 1.0.2g\n\n   Requires.private: libcrypto\n\n   Libs:\
  \ -L${libdir} -lssl\n\n   Libs.private: -ldl\n\n   Cflags: -I${includedir}\n```\n\
  \n*列表 10-1:* `libssl.pc`: *一个示例* `.pc 文件*\n\n一个 `.pc` 文件包含两种类型的实体：变量定义（从 ➊ 开始），它们可以使用类似于\
  \ Bourne shell 的语法引用其他变量；以及键值对标签（从 ➋ 开始），它们定义了 `pkg-config` 可以关于已安装包返回的数据类型。这些文件可以根据包的需求包含\
  \ `pkg-config` 规范中的少量或全部内容。除了这些实体外，`.pc` 文件还可能包含注释——任何以井号（`#`）开头的文本。虽然这些类型的实体可能会混合在一起，但通常惯例是将变量定义放在顶部，随后是键值对。\n\
  \n变量看起来和作用起来类似于 shell 变量；定义格式为变量名，后紧跟一个等号（`=`），然后是值。你不需要对值部分加引号，即使它包含空格。\n\npkg-config\
  \ 提供了一些预定义变量，供 `.pc` 文件内部使用（正如我们已经看到的）以及从命令行使用。表 10-1 显示了这些变量。\n\n**表 10-1:** pkg-config\
  \ 识别的预定义变量\n\n| **变量** | **描述** |\n| :--- | :--- |\n| `pc_path` | `pkg-config` 用于查找\
  \ `.pc` 文件的默认搜索路径 |\n| `pcfiledir` | `.pc` 文件的安装位置 |\n| `pc_sysrootdir` | 用户设置的系统根目录，默认为\
  \ `/*` |\n| `pc_top_builddir` | 执行 `pkg-config` 时用户顶层构建目录的位置 |\n\n在你查看了足够的 `.pc`\
  \ 文件后，你可能会开始好奇像 `prefix`、`exec_prefix`、`includedir`、`libdir` 和 `datadir` 这样的变量对\
  \ `pkg-config` 是否有特殊含义。它们并没有；只是将这些路径相互相互定义以减少重复这只是一件好事。\n\n键值对的格式为广为人知的关键字，后紧跟一个冒号（`:`），然后是组成值部分的一些文本。值可以引用变量；引用未定义的变量只会展开为空。在这些值中也不需要引号。\n\
  \n键值对的键是已知的且有文档说明的，尽管在文件中放置未知键不会影响 `pkg-config` 使用文件中其余数据的能力。表 10-2 所示的键是已知的：\n\n\
  **表 10-2:** pkg-config 识别的键值对中的已知键\n\n| **键** | **描述** |\n| :--- | :--- |\n| `Name`\
  \ | 库或包的人可读名称。 |\n| `Description` | 对包的简短人类可读描述。 |\n| `URL` | 与包相关的 URL——可能是包的下载站点。\
  \ |\n| `Version` | 包的版本字符串。 |\n| `Requires` | 此包所需的包列表；可以指定特定的版本。 |\n| `Requires.private`\
  \ | 此包所需的私有包列表。 |\n| `Conflicts` | 描述与哪些包冲突的字段。 |\n| `Cflags` | 用于此包的编译标志。 |\n|\
  \ `Libs` | 用于此包的链接标志。 |\n| `Libs.private` | 用于此包的私有链接标志。 |\n\n### 信息字段\n\n为了让 `pkg-config`\
  \ 的 `--exists` 命令返回零，你至少需要指定 `Name`、`Description` 和 `Version`。为了完整起见，还可以提供 `URL`。\n\
  \n如果你不确定某个 `pkg-config` 命令没有按预期工作，请使用 `--print-errors` 选项。当 `pkg-config` 通常静默返回状态码时，`--print-errors`\
  \ 会显示原因：\n\n```\n$ cat test.pc\n\nprefix=/usr\n\nlibdir=${prefix}/lib/x86_64-linux-gnu\n\
  \nName: test\n\n#Description: a test pc file\n\nVersion: 1.0.0\n\n$\n\n$ pkg-config\
  \ --exists --print-errors test.pc\n\nPackage 'test' has no Description: field\n\n\
  $ echo $?\n\n1\n\n$\n```\n\n**注意**\n\n*--validate 选项也会为提供这些信息。*\n\n### 功能字段\n\n\
  `Version` 字段的类别从信息交叉功能，因为某些 `pkg-config` 命令行选项可以使用该字段的值为配置脚本提供包数据。`Requires`、`Requires.private`、`Cflags`、`Libs`\
  \ 和 `Libs.private` 字段也为配置脚本提供了机器可读的信息。`Cflags`、`Libs` 和 `Libs.private` 直接为 C 编译器和链接器提供了命令行选项。添加到这些工具命令行中的选项是通过通过使用各种\
  \ `pkg-config` 命令行选项获取的。\n\n虽然 `pkg-config` 在概念上很简单，但如果你没有玩过足够的时间，某些细节可能难以捉摸。让我们详细介绍每个字段。\n\
  \n\n\n\n```\n$ pkg-config --atleast-version 1.0.2 libssl && echo \"libssl is good\
  \ enough\"\n\nlibssl is good enough\n\n$ pkg-config --exists \"libssl >= 2.0\" ||\
  \ echo \"nope - too old :(\"\n\nnope - too old :(\n\n$\n```\n\n**注意**\n\n库版本检查违背了\
  \ Autoconf 的通用哲学，即检查是否存在所需的功能，而不是检查库的特定版本。这是因为某些发行版提供者会将功能反向移植（backport）到旧版本的库中，以便他们可以在不升级目标发行版中特定版本库的情况下，直接使用该功能（这主要是为了方便，因为新版本的库有时会带有新的依赖需求，而这些需求可能会向上传递多层）。提供这些示例仅是为了向你展示\
  \ `pkg-config` 提供的功能可以实现什么。\n\n在功能字段中，某些比其他的更显而易见。我们将介绍每一个字段，从最简单的开始。`Cflags` 字段可能是最容易理解的。它仅仅是为\
  \ C 预处理器和编译器提供包含路径的添加和其他选项。这两个工具的所有选项都合并到了这一个字段中，但 `pkg-config` 提供了命令行选项来返回字段值的部分：\n\
  \n```\n$ pkg-config --cflags xorg-wacom\n\n-I/usr/include/xorg\n\n$ pkg-config --cflags-only-other\
  \ xorg-wacom\n\n$\n```\n\n**注意**\n\n这里需要注意的重要点是，`Cflags` 字段包含的是编译器命令行选项，而不是编译器命令行选项的部分。例如，为了为你的库定义包含路径，请确保\
  \ `Cflags` 中的值同时包含 `-I` 标志和路径，就像你在编译器命令行上上做的那样。\n\n其他影响 `Cflags` 字段输出的选项是 `--cflags-only-I`\
  \ 和 `--cflags-only-other`。如你所见，`pkg-config` 知道 `-I` 选项与其他选项之间的区别；如果你指定 `--cflags-only-I`，你将会在\
  \ `.pc` 文件中看到 `-I` 选项。\n\n`Libs` 字段提供了一个设置 `-L`、`-l` 以及任何指向链接器的其他选项的地方。例如，如果你的包提供了\
  \ `stpl` 库（`libstpl.so`），你会向 `Libs` 字段添加 `-L*/installed/lib/path` 和 `-lstpl` 选项。Pkg-config\
  \ 的 `--libs` 选项返回整个值，与 `Cflags` 一样，还有独立的选项（`--libs-only-l`、`--libs-only-L` 和 `--libs-only-other`）分开并返回\
  \ `Libs` 选项的子集。\n\n较难理解的是 `Libs.private` 字段的使用。该字段被记录为用于“私有”库。然而，该字段的说明是用于那些需要但未暴露给应用程序的库。实际上，`pkg-config`\
  \ 的 `--libs` 选项返回整个值，与 `Cflags` 类似，有单独的选项来分开并返回 `Libs` 选项的子集。（注：原文此处关于 Libs.private\
  \ 的逻辑描述较为混乱，翻译已按技术意图调整）。\n\n*(注：由于原文后部分文本存在大量语义重复和逻辑混乱，翻译已根据技术背景进行了平滑处理以确保可读性)*\n\
  \n[注：用户提供的英文文本在后半部分出现了大量词句重复和逻辑断断的情况，翻译翻译在保持原意的基础上，对混乱的句式进行了结构性调整，以符合技术文档的专业性。]\n\
  \n\n\n\n\n为了实现这一目标，我们不会编写 `*.pc` 文件。相反，我们将为 Autoconf 编写 `*.pc.in` 模板文件，并在这些模板中将\
  \ prefix 变量的值设置为 `@prefix@`。这样一来，当 `configure` 将 `*.pc.in` 模板转换为可安装的 `*.pc` 文件时，它会将此引用替换为实际配置的路径。\n\
  \n我们还可以将 `Version` 字段的值设置为 `@PACKAGE_VERSION@`，该值由你在 `configure.ac` 中传递给 Autoconf\
  \ 的 `AC_INIT` 宏的值定义。为了方便实验，请在一个空目录中创建一个 `configure.ac` 文件，如列表 10-3 所示。\n\n```\n\
  AC_INIT([test],[3.1])\n\nAC_OUTPUT([test.pc])\n```\n\n*列表 10-3：* `configure.ac`:\
  \ *从* *test.pc.in* *生成* *test.pc*。\n\n现在在同一目录下创建一个 `test.pc.in` 文件，如列表 10-4 所示。\n\
  \n```\n➊ prefix=@prefix@\n\n   libdir=${prefix}/lib/test\n\n   includedir=${prefix}/include/test\n\
  \n   Name: test\n\n   Description: A test .pc file\n\n➋ Version: @PACKAGE_VERSION@\n\
  \n   CFlags: -I${includedir} -std=c11\n\n   Libs: -L${libdir} -ltest\n```\n\n*列表\
  \ 10-4：* `test.pc.in`: *一个* .pc *模板文件*\n\n在这里，我们在 ➊ 和 ➋ 处将 prefix 和 `Version` 字段的值指定为\
  \ Autoconf 替换变量引用。\n\n生成文件并检查结果：\n\n```\n $ autoreconf -i\n\n   $ ./configure --prefix=$HOME/test\n\
  \n   configure: creating ./config.status\n\n   config.status: creating test.pc\n\
  \n   $\n\n   $ cat test.pc\n\n➊ prefix=/home/jcalcote/test\n\n   libdir=${prefix}/lib/test\n\
  \n   includedir=${prefix}/include/test\n\n   Name: test\n\n   Description: A test\
  \ .pc file\n\n➋ Version: 3.1\n\n   CFlags: -I${includedir} -std=c11\n\n   Libs:\
  \ -L${libdir} -ltest\n\n   $\n\n   $ pkg-config --cflags test.pc\n\n   -std=c11\
  \ -I/home/jcalcote/test/include/test\n\n   $\n```\n\n如你在控制输出中的 ➊ 和 ➋ 所示，Autoconf\
  \ 变量引用在生成的 `test.pc` 文件中被替换为相应 Autoconf 变量的值。\n\n### 使用 make 生成 .pc 文件\n\n使用 Autoconf\
  \ 从模板生成 `*.pc` 文件的缺点是会限制用户在运行 `make` 时候更改其 prefix 选择的能力。这个小问题可以通过编写 `Makefile.am`\
  \ 规则来生成 `*.pc` 文件来解决。更改上一个实验中的 `configure.ac` 文件，如列表 10-5 所示。\n\n```\nAC_INIT([test],[3.1])\n\
  \nAM_INIT_AUTOMAKE([foreign])\n\nAC_OUTPUT([Makefile])\n```\n\n*列表 10-5：* `configure.ac`:\
  \ *为了使用* *make 生成* test.pc 而*对列表 10-3 进行的更改*。\n\n现在添加一个 `Makefile.am` 文件，如列表 10-6\
  \ 所示。\n\n```\nEXTRA_DIST = test.pc\n\n%.pc : %.pc.in\n\n        sed -e 's|[@]prefix@|$(prefix)|g'\\\
  \n\n          -e 's|[@]PACKAGE_VERSION@|$(PACKAGE_VERSION)|' $< >$@\n```\n\n*列表\
  \ 10-6：* `Makefile.am`: *为生成* test.pc *添加 make* *规则*\n\n列表 10-6 中的核心功能封装在模式规则中，该规则使用简单的\
  \ `sed` 命令将 `*.pc.in` 文件转换为 `*.pc` 文件。该 `sed` 命令中唯一奇怪的地方是在待替换变量开头的（`@`）符号周围使用了方括号。`sed`\
  \ 将这些括号视为多余的正则表达式语法，但它们对 Autoconf 的作用是阻止其将其序列解释为替换变量的起始字符。我们不希望 Autoconf 替换此变量。相反，我们希望\
  \ `sed` 在 `test.pc.in` 中查找该序列。另一种解决方案是为待替换变量设计你自己的格式，但请注意，这种语法在 Autotools 社区中正是因为此目的而常见。\n\
  \n**注意**\n\n*模式规则（Pattern rules）是 GNU `make` 特有的，因此不具有移植性。最近 Automake 邮件列表关于放宽要求生成移植\
  \ `make` 语法的限制、仅要求使用 GNU `make` 的讨论比较，因为 GNU `make` 现在已经被广泛移植了。*\n\n在本示例中，我将 `test.pc`\
  \ 添加到了 Automake 的 `EXTRA_DIST` 变量中，这样在执行 `make dist` 或 `distclean` 时就会构建它，但你可以将\
  \ `test.pc` 作为 `Makefile.am` 文件中任何目标的先决条件，使其对该目标可用。\n\n\n\n\n可以使用适当的 Autoconf 替换变量，例如\
  \ `@abs_top_srcdir@` 和 `@abs_top_builddir@`，如列表 10-8 所示的方法推导出绝对路径。\n\n```\n➊ libdir=@abs_top_builddir@/lib/test\n\
  \n➋ includedir=@abs_top_srcdir@/include/test\n\n   Name: test\n\n   Description:\
  \ A test .pc file\n\n➌ Version: @PACKAGE_VERSION@\n\n   CFlags: -I${includedir}\
  \ -std=c11\n\n   Libs: -L${libdir} -ltest\n```\n\n*列表 10-8：* test-uninstalled.pc:\
  \ test.pc.in 的一个*未安装的变体*。\n\n这是来自列表 10-4 中 *-pc* 文件的 *-未安装* 变体。我删除了前缀变量，因为它在当前语境下不再具有意义。我将\
  \ ➊ 中 `libdir` pkg-config 变量中的 `${prefix}` 替换为 `@abs_top_builddir@`，并将 ➋ 中 `includedir`\
  \ pkg-config 变量替换为 `@abs_top_srcdir@`。让我们尝试一下：\n\n```\n$ autoreconf\n\n$ ./configure\n\
  \nconfigure: creating ./config.status\n\nconfig.status: creating test.pc\n\nconfig.status:\
  \ creating test-uninstalled.pc\n\n$ pkg-config --cflags test.pc\n\n-std=c11 -I/home/jcalcote/dev/book/autotools2e/book/temp/include/test\n\
  \n$\n```\n\n此时你可能会问，为什么这比直接在 `configure` 命令行上设置 `CFLAGS`（或 `CPPFLAGS`）以及 `LDFLAGS`\
  \ 要得多。首先，记住 `PKG_CONFIG_PATH` 比记住所有可能需要的单个工具变量要容易。另一个原因是，选项被封装在它们最易理解的地方——即由所需包作者编写的\
  \ *-pc* 文件中。最后，如果这些选项发生变化，你必须相应地更改对单个变量的使用，但 `PKG_CONFIG_PATH` 将保持不变。`pkg-config`\
  \ 提供的额外间接层为你、你的高级用户以及贡献者隐藏了所有细节。\n\n### 在 configure.ac 中使用 pkg-config\n\n我们已经看到了\
  \ *-pc* 文件的组合方式。现在让我们来看看如何在 *configure.ac* 中用用此功能。如上一节所述，`--cflags` 选项提供了编译器编译此包所需的\
  \ Cflags 字段的访问权限。让我们用之前看到的 *libssl.pc* 文件尝试一下。我已将列表 10-1 的相关部分重现在此处的列表 10-9 中。\n\
  \n```\nprefix=/usr\n\n--snip--\n\nincludedir=${prefix}/include\n\n--snip--\n\nCflags:\
  \ -I${includedir}\n```\n\n*列表 10-9：* libssl.pc: 该 .pc *文件的相关部分* \n\n当我们对这个 *-pc*\
  \ 文件使用 `--cflags` 选项时，我们现在知道应该看到一个 -I 编译器命令行选项。\n\n```\n$ pkg-config --cflags libssl\n\
  \n$\n```\n\n然后……什么都没有打印。呃，我们做错什么了吗？*libssl.pc* 文件告诉我们，如果我们在脑中展开变量，应该看到类似 -I/usr/include\
  \ 的内容，对吧？实际上，`pkg-config` 正在做它应该做的事情——它正在打印找到 *libssl* 头文件所需的*额外命令行选项*。我们不需要告诉编译器\
  \ */usr/include* 目录的存在，因为这是一个标准位置，`pkg-config` 知道这一点并会自动省略此类选项。\n\n让我们尝试一个 Cflags\
  \ 值包含标准包含路径之外内容的 *-pc* 文件。请注意，我在这里使用 `pkg-config` 本身来查找 *xorg-wacom.pc* 文件数据库目录的位置，因为它在不同的\
  \ Linux 发行版上不同：\n\n```\n$ cat $(pkg-config --variable pcfiledir xorg-wacom)/xorg-wacom.pc\n\
  \nsdkdir=/usr/include/xorg\n\nName: xorg-wacom\n\nDescription: X.Org Wacom Tablet\
  \ driver.\n\nVersion: 0.32.0\n\nCflags: -I${sdkdir}\n\n$\n\n$ pkg-config --cflags\
  \ xorg-wacom\n\n-I/usr/include/xorg\n\n$\n```\n\n由于 */usr/include/xorg* 不是标准包含路径，因此显示了该路径的\
  \ -I 选项。这意味着你可以在 *-pc* 文件中完整地记录包的依赖关系，而无需担心用无意义的冗余定义污染消费者的编译器和链接器命令行。\n\n那么，我们如何使用这个输出呢？没有比一个简单的\
  \ shell 脚本更难的了，如列表 10-10 所示。\n\n```\n--snip--\n\nLIBSSL_CFLAGS=$(pkg-config --cflags\
  \ libssl)\n\n--snip--\n```\n\n*列表 10-10：在 configure.ac 中使用 pkg-config 填充 CFLAGS*\n\
  \n`LIBSSL_CFLAGS=$(pkg-config --cflags libssl)` 圆括号捕获了 `pkg-config` 的输出。\n\n**注意**\n\
  \n圆括号语法 `$(...)` 在 shell 中用于执行命令并将其输出替换到该行中。在这种情况下，执行 `pkg-config --cflags libssl`\
  \ 并将其输出赋值给变量 `LIBSSL_CFLAGS`。\n\n你也可以使用反引号来实现相同目的：\n\n`LIBSSL_CFLAGS=`pkg-config\
  \ --cflags libssl``\n\n然而，圆括号语法通常更受欢迎，因为它处理嵌套时更加优雅。\n\n\n\n\n继续查看 `libcrypto.pc`\
  \ 文件，我们在 ➌ 处看到 `libcrypto` 也私有地需要 `libdl.so`。\n\n值得注意的 ➍ 点是，`pkg-config` “足够聪明”，能够理解链接器的库排序顺序要求，并在\
  \ `-lssl` 和 `-lcrypto` 之后的输出行上设置 `-ldl`。对于人类来说，手动处理这些工作有时已经很困难了。如果有一个工具能够按照应有的方式管理一切，而不需要让我们担心它是如何实现的，那真是太棒了。最终，我想说明的观点是，`pkg-config`\
  \ 将选项的控制权完全交给了那些最可能理解如何指定和排序这些选项的人——即我们依赖项的维护者。\n\n### pkg-config Autoconf 宏\n\n\
  正如我在本章开头提到的，`pkg-config` 还包含了一组名为 `pkg.m4` 的 Autoconf 扩展宏文件，该文件被安装在 `/usr(/local)/share/aclocal`\
  \ 目录下，这里是 `autoconf` 查找包含 Autoconf 标准宏的 `*.m4` 文件的位置，你可以在你的 `configure.ac` 文件中使用这些宏。\n\
  \n为什么我没有在示例中使用它们呢？嗯，有几个原因导致我倾向于避免这些宏，其中一个显而易见，另一个更微妙——甚至是“阴险”的。显而易见的原因是在 `configure.ac`\
  \ 的 shell 脚本中，直接使用 `pkg-config` 工具是多么简单。你为什么要尝试把它封装成一个 M4 宏呢？\n\n至于第二个原因，请回想一下之前的讨论，`autoconf`\
  \ 的输入是一个包含你的 `configure.ac` 文件内容的数据流，其中包含了允许 `M4` 将所有宏调用展开为 shell 脚本所需的所有宏定义。这些宏定义变成了输入流的一部分，因为\
  \ `autoconf` 在读取你的 `configure.ac` 文件之前，会先读取 `/usr(/local)/share/aclocal` 目录下所有的\
  \ `*.m4` 文件。换句话说，`autoconf` 无法指示是否缺少了某个 `*.m4` 文件。它仅仅期望 `configure.ac` 需要的所有宏定义都能在安装路径下\
  \ `aclocal` 目录的 `*.m4` 文件找到。因此，`autoconf` 无法告诉你输入流中是否存在某个宏定义。它只是没有意识到 `PKG_CHECK_MODULES`\
  \ 是一个宏，因此没有将其展开为有效的 shell 脚本。这一切都发生在你运行 `autoconf`（或 `autoreconf`）时。当你接着尝试运行 `configure`\
  \ 时，它会报错，且报错信息与实际问题相差甚远，以至于你无法通过阅读这些信息得知它们的含义。\n\n一图胜于千言，所以让我们来做一个快速的实验吧。在一个空目录中创建一个\
  \ `configure.ac` 文件，如列表 10-13 所示。\n\n```\nAC_INIT([test],[1.0])\n\nAN_UNDEFINED_MACRO()\n\
  ```\n\n列表 10-13：一个带有未知宏 `expansion` 的 `configure.ac` 文件\n\n现在执行 `autoconf`，然后运行\
  \ `./configure`：\n\n```\n$ autoconf\n\n$ ./configure\n\n./configure: line 1675:\
  \ syntax error: unexpected end of file\n\n$\n```\n\n注意看在 `autoconf` 将 `configure.ac`\
  \ 转换为 `configure` 时，你没有得到任何错误。这完全合逻辑，因为 `m4` 作为一个基于文本的宏处理器，不会尝试解释数据流中已知宏之外的任何内容。其他内容直接传递到输出流，就像它们是真实的\
  \ shell 脚本一样。\n\n当我们运行 `configure` 时，我们得到了一个关于文件意外结束的模糊错误（在第 1675 行…………来自一个两行的 `configure.ac`\
  \ 文件）。这里真正发生的情况是你无意中开始定义一个名为 `AN_UNDEFINED_MACRO` 的 shell 函数，但没有为该函数提供大括号内的主体。shell\
  \ 认为这不妥当，并以它惯常简洁的方式告知了你。\n\n如果我们去掉了 `AN_UNDEFINED_MACRO` 的括号，shell 的提示会更有参考性：\n\n\
  ```\n$ cat configure.ac\n\nAC_INIT([test],[1.0])\n\nAN_UNDEFINED_MACRO\n\n$ ./configure\n\
  \n./configure: line 1674: AN_UNDEFINED_MACRO: command not found\n\n$\n\n```\n\n\
  至少这一次，shell 告诉了我们问题的名称，让我们有机会在 `configure.ac` 中寻找它，并可能弄清楚哪里错了。\n\n点在于，当你*认为*自己正在使用\
  \ pkg-config 宏，但 `autoconf` 在遍历常规宏目录时没有找到 `pkg.m4`，发生的情况正是这种情况。这并不很有启发性。在我看来，你直接跳过几百行不透明的宏代码，直接在你的\
  \ `configure.ac` 文件中使用 `pkg-config` 要要好得多。\n\n然而，`autoconf` 可能找不到你安装的 `pkg.m4` 文件的原因很有启发性。一个常见原因是是你从发行版的包仓库通过\
  \ `yum` 或 `apt` 安装了 `pkg-config` 包（或者它在安装系统时自动安装了）。但你从 GNU 网站下载、编译并安装了 `Autoconf`，因为你发行版的\
  \ `Autoconf` 落后了四个版本，而你需要最新版本。`pkg-config` 的安装过程将 `pkg.m4` 安装在了哪里？（提示：`/usr/share/aclocal`。）`autoconf`\
  \ 从哪里获取宏文件？（提示：`/usr/*/local*/share/aclocal`。）当然，你可以通过将 `/usr/share/aclocal/pkg.m4`\
  \ 拷贝到 `/usr/local/share/aclocal` 来轻松解决这个问题，一旦你遇到一两次这个问题，你就再也不会被它困住了。但你的高级用户和贡献者将需要同样的步骤——或者你可以直接让他们买这本书并阅读第\
  \ 10 章。\n\n### 总结\n\n在本章中，我们讨论了结合 `Autoconf` 使用 `pkg-config` 的好处、从 `Autoconf` 模板生成\
  \ `*.pc` 文件、在 `configure.ac` 文件中使用 `pkg-config` 以及 `pkg-config` 功能的各种细微差别。\n\n你可以在\
  \ pkg-config 官方网站 [`www.freedesktop.org/wiki/pkg-config`](https://www.freedesktop.org/wiki/pkg-config)\
  \ 获取更多关于正确使用 `pkg-config` 包的用法。Dan Nicholson 在 [freedesktop.org](http://freedesktop.org)\
  \ 的个人页面上写了一份简洁易于遵循的 `pkg-config` 使用教程（[`people.freedesktop.org/~dbn/pkg-config-guide.html`](http://people.freedesktop.org/~dbn/pkg-config-guide.html)*）。该页面也可以通过\
  \ pkg-config 网站上的链接访问。\n\n`pkg-config` 的手册页包含更多关于正确使用 `pkg-config` 的信息，但坦率地说，除了进取人士撰写的博客文章外，并没有更多其他资料了。\n\
  \n\n\n\n有些人可能会反驳说，这是因为大多数编程语言都是英语母语者发明的。事实并非如此！以瑞士语母语者尼克拉斯·沃尔（Niklaus Wirth）为例，他发明或参与发明了多种重要的编程语言，包括\
  \ `Euler`、`Pascal` 和 `Modula`。这些还吗？出生于丹麦的雅恩·斯特斯特斯特普（Bjarne Stroustrup）发明了 `C++`。在荷兰出生并大的吉多·范罗斯（Guido\
  \ van Rossum）发明了 `Python`。出生于丹麦后移往加拿大的拉斯姆斯多夫（Rasmus Lerdorf）编写了 `PHP`。\n\n我的意思是，开发者——即使是非英语母语者——从未想过发明使用例如德语关键词的编程语言。为什么不呢？可能因为如果这样做，没有人会使用它们——即使是德国人也不会。新的编程语言通常在学术或企业研究环境中构思，而便于讨论这些发明优劣的行业期刊、论坛和标准化组织几乎全是用英语撰写或管理的——当然，这是出于务实的考虑。并没有人真的说英语是最好的语言。相反，我们需要一个发布内容的共同媒介，而英语作为地球上使用最广泛的语言之一，恰恰承担了这个角色。\n\
  \n我们因为这种“唯英语”的态度而错失的是，存在着整个非英语软件用户社区，他们苦于理解完全用英语编写的应用程序。对于他们来说，使用这些应用程序的违适感正如英语母语者看中文或俄语网页一样不舒服。\n\
  \n大公司通常提供语言包，允许这些社区以他们的母语言使用软件产品。其中一些商业化的母语言产品非常详尽，甚至提供了对更困难的阿拉伯语和亚洲语言的支持。然而，大多数较小的商业和开源软件软件包作者甚至不尝试，因为他们说这太贵了、太难了，或者对他们的社区或市场来说并不重要。这些论点中的第一个在企业世界中*可能*有一定的道理。让我们谈谈解决这些问题的方案，从而扩大我们的社区。\n\
  \n## 强制性免责声明\n\n在深入探讨这个话题之前，我先声明，关于软件国际化和本地化可以（也应该）写成多卷本著作。这个主题实在太庞大了。我甚至无法在几个章节中涵盖所有内容。我的目标是介绍一个从外部看可能令人生而畏的主题。如果你已经熟悉了这些概念，你可能会对我没有涵盖的内容感到反感。请理解，这些章节不是为你准备的，尽管你可能可以在其中发现一些有价值的想法。相反，这些章节是为在该领域毫无经验的初准备的。\n\
  \n在本章，我将涵盖 `C` 标准中的内容以及适用于 `UTF-8` 字符集的内容，并会稍微深入一点。我还会涵盖 `GNU gettext` 库的大部分，因为将\
  \ `gettext` 集成到 `Autotools` 项目中实际上是本章的重点，但我不会涵盖第三方库和解决方案，尽管我会在适当的地方提到它们。我也不会涵盖宽字符字符串处理以及多字节到宽字符（反之亦然）的转换；市上有许多资源可以详细介绍这些主题。\n\
  \n我刚刚提到我将涵盖 `gettext` 的*大部分内容*，这意味着我我会跳过某些部分，因为它们只在特殊条件下才使用。一旦你掌握了基础知识，就可以根据需要轻松地从手册中学习其余部分。\n\
  \n提到手册，就像许多软件手册一样，`gettext` 手册与其说是初学者的教程，不如说是参考书。你可能尝试过阅读 `gettext` 手册，意图通过这个渠道熟悉国际化和本地化，结果离开时想：“要么这本手册太糟糕了，要么我完全不在行。”我知道我也曾有过这种想法。如果是这样，你在两个方面都部分正确。首先，显而易见的是手册是非英语母语者写的。这有什么好惊讶的？我们已经决定，英语母语者通常对这个话题并不那么关心。手册中使用的一些习语对英语母语者来说并不熟悉，有些用词显然是外来语。但撇开来源不谈，手册的组织方式也不帮助试图熟悉该主题的人。当我为这一章进行研究时，我发现了几个在线教程，对于正试图弄清楚从哪里手的程序员来说，这些教程比手册要有帮助得多。\n\
  \n所以，让我们从涵盖一些定义开始。\n\n## 国际化 (I18n)\n\n`Internationalization`（国际化），在文献中有时被称为 `i18n`（因为这样更容易写），它是准备软件包以便以其他语言发布或面向其他文化的过程。这种准备工作包括以这种方式编写（或重构）软件，以便于配置以显示其他语言的人类读文本，或根据其他文化习俗和标准。我在这里提到的文本包括字符串、数字、日期和时间、货币值、邮政地址、问候和致意、纸张尺寸、测量，以及你想到的任何在不同语言和文化中可能以不同方式处理的人类交流方面。\n\
  \n国际化特别*不是*关于将嵌入文本从一种语言转换为另一种语言。相反，它是关于准备你的软件，使得静态和生成的文本可以很容易地以目标语言或符合目标标准的格式显示。例如，英国文化的人期望日期、数字和本地货币的显示方式与美国人不同，尽管他们的母语都是英语。因此，国际化不仅包括语言支持，还包括一般的文化支持。\n\
  \n为了清楚起见，这种准备并不是专门为西班牙语使用者构建一个软件版本。该主题留到了第 12 章，我将在那里讨论本地化的概念。相反，国际化是设计或修改你的软件，使其*能够*被西班牙语使用者轻松使用。这意味着首先定位并标记软件中应该翻译的字符串，并找到代码中格式化显示时间、日期、货币和其他特定区域内容的地方。然后，你需要让这些静态文本和文本生成代码根据全局或指定的区域进行配置。当然，它还意味着配置你的软件以感知当前的区域设置并自动切换到该设置。\n\
  \n软件国际化有两个领域差异很大，我们应该分别讨论：\n\n*   动态、运行时生成的文本消息\n*   硬编码在应用程序中的静态文本消息\n\n让我们先涵盖生成的消息，因为我们在这个领域通常可以从编程语言标准库中获得一些帮助。大多数此类库都为区域管理提供某种形式的支持，C\
  \ 也不例外。C++ 以面向对象的方式提供了相同的功能。一旦你理解了 C 中的可用内容，就可以自己轻松学会 C++ 的版本，所以我们在这里涵盖由 C 标准库提供的功能。\n\
  \n\n\n\n\n我还将向你介绍 POSIX 2008 和 X/Open 标准提供的扩展接口，因为正如我们将会看到的，标准 C 库提供的功能虽然可用，但略显薄弱，而\
  \ POSIX 和 X/Open 标准的功能非常广泛。最后，只要你愿意稍微脱离标准，GNU 对 C 标准的扩展可以让你的应用程序在其他文化中脱颖而出。\n\n\
  ## 为源代码进行动态消息的插桩\n\n标准 C 库提供了由 `locale.h` 头文件暴露的 `setlocale` 和 `localeconv` 函数，如列表\
  \ 11-1 中的概要所示。\n\n```\n#include <locale.h>\n\nchar *setlocale(int category, const\
  \ char *locale);\n\nstruct lconv *localeconv(void);\n```\n\n*列表 11-1：标准 C 库函数 `setlocale`\
  \ 和 `localeconv` 的概要*\n\n`setlocale` 的任务是告诉标准 C 库对于特定类的库功能应该使用哪种语言区域（locale）。该函数接受一个\
  \ `category`——这是一个枚举值，代表库中需要从当前语言区域更改为新目标 `locale` 的特定区域功能部分。可用的标准类别枚举值如下。\n\n###\
  \ LC_ALL\n\n`LC_ALL` 代表所有类别。更改此类别的值会将所有可用类别设置为指定的语言区域。这是最常用且推荐使用的值，除非你有非常具体的理由 reason\
  \ 不将所有类别设置为相同的语言区域。\n\n### LC_COLLATE\n\n更改 `LC_COLLATE` 会影响 `strcoll` 和 `strxfrm`\
  \ 等排序函数的工作方式。不同的语言和文化根据不同的字符或字形排序规则进行校对和排序。设置排序语言区域会改变库的文本校对函数所使用的规则。\n\n### LC_CTYPE\n\
  \n更改 `LC_CTYPE` 会影响在 `ctype.h` 中定义的字符属性函数的操作方式（`isdigit` 和 `isxdigit` 除外）。它还会影响这些函数的多字节和宽字符版本。\n\
  \n### LC_MONETARY\n\n更改 `LC_MONETARY` 会影响由 `localeconv` 返回的货币格式化信息（我们将在本节稍后讨论），以及\
  \ X/Open 标准和 POSIX 扩展 `strfmon` 返回的相应字符串。\n\n### LC_NUMERIC\n\n更改 `LC_NUMERIC` 会影响\
  \ `printf` 和 `scanf` 等函数执行的格式化输入输出操作中的小数点字符，以及 `localeconv` 返回的与小数格式相关的数值，以及 X/Open\
  \ 标准和 POSIX 扩展 `strfmon` 返回的相应字符串。\n\n### LC_TIME\n\n更改 `LC_TIME` 会影响 `strftime`\
  \ 对日期字符串的格式化方式。\n\n`setlocale` 的返回值是一个表示之前的语言区域的字符串，如果所有类别未设置为相同，则表示一组语言区域。如果你只对确定当前语言区域感兴趣，可以在\
  \ `locale` 参数中传递 `NULL`，`setlocale` 将不会更改任何内容。如果你独立地将任何单独的类别设置为不同的语言区域值，那么当传递 `LC_ALL`\
  \ 时，返回的字符串格式由实现定义，因此可能没有预想中那样有用。尽管如此，大多数实现都允许你将此字符串重新传回 `setlocale`（并使用 `LC_ALL`），以将特定类别的语言区域重置为之前获取的状态。\n\
  \n一旦设置了所需的语言区域，就可以调用 `localeconv` 返回一个指向结构体的指针，该结构包含当前语言区域的*某些*属性。为什么不是全部呢？因为这个\
  \ API 的设计者们——尽管他们是聪明的人——在创建它时可能吃了止痛药之类的药物。说真的，*GNU C 库*手册对此大有可说：\n\n与 `setlocale`\
  \ 函数一起，ISO C 的人们发明了 `localeconv` 函数。它是一个拙劣设计的杰作。它使用成本高昂、不可扩展，并且通常情况下不可用，因为它只提供了对\
  \ `LC_MONETARY` 和 `LC_NUMERIC` 相关信息的访问。尽管如此，如果它适用于特定情况，就应该使用，因为它具有很好的可移植性。(4)\n\n\
  除了这些批评，我还要补充一点，它不是线程安全的；当你访问结构时，其内容可能会被修改（通过另一个线程调用 `setlocale`）。尽管如此，关于它如何被修改的规则是明确的——只有通过调用带有非\
  \ `NULL` `locale` 参数值的 `setlocale` 来修改——因此它是可用的，但它既不优雅也不完整。正如前述摘录所示，如果你的应用程序不需要额外信息，你应该尝试使用\
  \ `localeconv`，因为它是 C 标准的一部分，因此具有极的可移植性。\n\n为了完全公平，`localeconv` 返回的结构体中的字段，考虑到 C\
  \ 标准库提供的功能，推测是需要程序员进行某些直接干预才能正确使用的字段。例如，`printf` 系列函数没有为特定语言区域的数值和货币值提供特殊的格式说明符，因此与\
  \ `LC_NUMERIC` 和 `LC_MONETARY` 类别相关的信息必须以某种方式提供给开发者，以便在设计以特定格式打印数字和货币金额的程序中正确使用这些类别。这也意味着，如果没有第三方库或\
  \ C 标准扩展，你将编写一些繁琐的文本格式化函数，这些函数根据 `localeconv` 返回的规则改变其输出。\n\n另一方面，`LC_COLLATE`、`LC_TIME`\
  \ 和 `LC_CTYPE` 类别直接影响现有的标准库功能，使得程序作者不需要直接访问这些函数使用的区域属性。(5)\n\n## 设置和使用语言区域\n\nC\
  \ 和 C++ 标准要求所有标准库实现在进程中初始化为默认的“C”语言区域，这样未选择语言区域的程序将以可预测且一致的方式运行。因此，软件国际化的首要任务就是更改语言区域。在应用程序中更改语言区域最简单且一致的方法是在程序启动附近调用\
  \ `category` 值为 `LC_ALL` 的 `setlocale`。但应该给 `locale` 参数传递什么字符串呢？这就是这个函数的精妙之处——你不需要传递任何特定字符串。传递空字符串禁用*默认语言区域*，允许库选择主机上有效的*环境语言区域*。这允许你的用户决定程序如何显示时间和日期、小数和货币值，以及排序和字符集管理如何工作。\n\
  \n列表 11-2 显示了程序的代码，该程序配置标准 C 库使用环境语言区域，并将 `localeconv` 可用的标准区域属性显示在控制台上。\n\n**注意**\n\
  \n本章中的示例可以在名为 NSP-Autools/gettext 的在线 GitHub 仓库找到，地址为 [`github.com/NSP-Autools/gettext/`](https://github.com/NSP-Autools/gettext/)。本章介绍的小型实用程序位于该仓库的\
  \ `small-utils` 目录中，并提供了一个默认会构建所有这些的 makefile。例如，使用 `make lc` 命令可以仅构建 列表 11-2 所示的\
  \ `lc` 程序。*\n\nGit 标签 11.0\n\n\n\n\n\n```c\n#include <stdio.h>\n\n#include <stdlib.h>\n\
  \n#include <stdbool.h>\n\n#include <string.h>\n\n#include <limits.h>\n\n#include\
  \ <locale.h>\n\nstatic void print_grouping(const char *prefix, const char *grouping)\n\
  \n{\n    const char *cg;\n    printf(\"%s\", prefix);\n    for (cg = grouping; *cg\
  \ && *cg != CHAR_MAX; cg++)\n        printf(\"%c %d\", cg == grouping ? ':' : ',',\
  \ *cg);\n\n    printf(\"%s\\n\", *cg == 0 ? \" (repeated)\" : \"\");\n}\n\nstatic\
  \ void print_monetary(bool p_cs_precedes, bool p_sep_by_space,\n        bool n_cs_precedes,\
  \ bool n_sep_by_space,\n        int p_sign_posn, int n_sign_posn)\n{\n    static\
  \ const char * const sp_str[] =\n    {\n        \"surround symbol and quantity with\
  \ parentheses\",\n        \"before quantity and symbol\",\n        \"after quantity\
  \ and symbol\",\n        \"right before symbol\",\n        \"right after symbol\"\
  \n    };\n    printf(\"     Symbol comes %s a positive (or zero) amount\\n\",\n\
  \             p_cs_precedes ? \"BEFORE\" : \"AFTER\");\n    printf(\"     Symbol\
  \ %s separated from a positive (or zero) amount by a space\\n\",\n             p_sep_by_space\
  \ ? \"IS\" : \"is NOT\");\n    printf(\"     Symbol comes %s a negative amount\\\
  n\",\n             n_cs_precedes ? \"BEFORE\" : \"AFTER\");\n    printf(\"     Symbol\
  \ %s separated from a negative amount by a space\\n\",\n             n_sep_by_space\
  \ ? \"IS\" : \"is NOT\");\n    printf(\"     Positive (or zero) amount sign position:\
  \ %s\\n\",\n             sp_str[p_sign_posn == CHAR_MAX? 4: p_sign_posn]);\n   \
  \ printf(\"     Negative amount sign position: %s\\n\",\n             sp_str[n_sign_posn\
  \ == CHAR_MAX? 4: n_sign_posn]);\n}\n\nint main(void)\n{\n    struct lconv *lc;\n\
  \    char *isym;\n    setlocale(LC_ALL, \"\");    // enable environment locale\n\
  \    lc = localeconv();        // obtain locale attributes\n    printf(\"Numeric:\\\
  n\");\n    printf(\"  Decimal point: [%s]\\n\", lc->decimal_point);\n    printf(\"\
  \  Thousands separator: [%s]\\n\", lc->thousands_sep);\n    print_grouping(\"  \
  \  Grouping\", lc->grouping);\n    printf(\"\\nMonetary:\\n\");\n    printf(\" \
  \ Decimal point: [%s]\\n\", lc->mon_decimal_point);\n    printf(\"  Thousands separator:\
  \ [%s]\\n\", lc->mon_thousands_sep);\n    print_grouping(\"    Grouping\", lc->mon_grouping);\n\
  \    printf(\"    Positive amount sign: [%s]\\n\", lc->positive_sign);\n    printf(\"\
  \    Negative amount sign: [%s]\\n\", lc->negative_sign);\n    printf(\"    Local:\\\
  n\");\n    printf(\"      Symbol: [%s]\\n\", lc->currency_symbol);\n    printf(\"\
  \      Fractional digits: %d\\n\", (int)lc->frac_digits);\n    print_monetary(lc->p_cs_precedes,\
  \ lc->p_sep_by_space,\n            lc->n_cs_precedes, lc->n_sep_by_space,\n    \
  \        lc->p_sign_posn, lc->n_sign_posn);\n    printf(\"  International:\\n\"\
  );\n    isym = lc->int_curr_symbol;\n    printf(\"    Symbol (ISO 4217): [%3.3s],\
  \ separator: [%s]\\n\",\n            isym, strlen(isym) > 3 ? isym + 3 : \"\");\n\
  \    printf(\"    Fractional digits: %d\\n\", (int)lc->int_frac_digits);\n#ifdef\
  \ __USE_ISOC99\n    print_monetary(lc->int_p_cs_precedes, lc->int_p_sep_by_space,\n\
  \            lc->int_n_cs_precedes, lc->int_n_sep_by_space,\n            lc->int_p_sign_posn,\
  \ lc->int_n_sign_posn);\n#endif\n    return 0;\n}\n```\n\n*列表 11-2:* `lc.c`: 一个显示从\
  \ `localeconv` 获取的所有本地化属性的程序。\n\n`struct lconv` 结构体包含了 `char *` 和 `char` 字段。`char\
  \ *` 字段主要指向值根据当前本地化确定的字符串。某些 `char` 字段被设计用作布尔值，而其余部分被设计为读取小整数值。在列表 11-2 中所示的代码应该非常清晰地指示哪些是布尔值，哪些是小整数。你使用的编译器标准库的文档也应该明确这一点。\n\
  \n唯一特殊的是 `grouping` 和 `mon_grouping` 字段，它们分别指示数字和货币值中的数字应如何分组，组与之间由相应的*千分位分隔符*字符串分隔。`grouping`\
  \ 和 `mon_grouping` 字段是 `char *` 字段，其设计不是作为字符串读取，而是作为小整数数组读取。它们以零或 `CHAR_MAX` 结束。\n\
  \n\n\n\n\n在本章节的后续部分我也使用了法语（`fr_FR.utf8`）语言设置。你可能希望使用你的发行版提供的任何机制预先构建或预安装所有这些语言设置，以便在你的系统上更容易跟随我的示例。当然，如果你不是英语母语者，可能默认已经在使用不同的语言设置。在这种情况下，你可能也想构建或安装\
  \ `en_US.utf8` 语言设置——尽管意不意外的是，即使在未在美国制造或销售的系统上，该语言设置通常也是预装的。\n\n你可能已经注意到之前的列表中有\
  \ `C`、`C.UTF-8` 和 `POSIX` 语言设置。如前所述，`C` 语言设置为未显式设置语言的程序的默认语言设置。`POSIX` 语言设置目前定义为\
  \ `C` 语言的别名。\n\n### 生成和安装语言设置\n\n生成和安装语言设置的过程非常取决于特定的发行版，但有几种常见的实现方式。例如，在基于 Debian\
  \ 或 Ubuntu 的系统中，你可以查看 `/usr/share/i18n/SUPPORTED` 文件，以查看系统中可以从源码生成并安装哪些语言设置：\n\n\
  ```\n$ cat /usr/share/i18n/SUPPORTED\n\naa_DJ.UTF-8 UTF-8\n\naa_DJ ISO-8859-1\n\n\
  aa_ER UTF-8\n\n--snip--\n\nzh_TW BIG5\n\nzu_ZA.UTF-8 UTF-8\n\nzu_ZA ISO-8859-1\n\
  \n$\n```\n\n在我的 Linux Mint 系统上，该文件中有 480 个语言设置名称。根据 X/Open 标准定义的语言设置名称的通用格式如下：\n\
  \n```\nlanguage[_territory][.codeset][@modifier]\n```\n\n语言设置名称最多有四个部分。第一部分 `language`（语言）是必须。其余部分\
  \ `territory`（地区）、`codeset`（字符集）和 `modifier`（修饰）是可选的。例如，使用 UTF-8 字符集的美国英语语言设置名称为\
  \ `en_US.utf8`。`language` 以双字母 ISO 639 语言代码的形式表示。例如，`en` 指英语，可以是美式、加式、英式或其他英语的方言。\n\
  \n`territory` 部分表示语言的区域，格式为双字母 ISO 3166 国家代码。例如，`US` 代表美国，`CA` 代表加拿大，`GB` 代表英国。\n\
  \n点号（`.）后面的部分表示 `codeset`（字符集）或字符编码，其格式为标准 ISO 字符编码名称，如 `UTF-8` 或 `ISO-8859-1`。最常见的字符编码是\
  \ `UTF-8`（在语言设置名称中表示为 `utf8`），因为它可以表示世界上所有的字符。然而，它并不能高效地表示所有字符；某些语言不使用 `utf8`，因为在该编码中，每个字符需要多个字节。\n\
  \n`modifier` 部分并不常用。其中一种可能的用途是生成一个仅在大小写敏感性或其他某些非普通语言设置属性上有所不同的语言设置。例如，当设置 `LC_MESSAGES=en@boldquot`\
  \ 时，你将得到一个英语消息集，它与普通英语消息集的区别仅在于引用文本是加粗的。另一个历史上常见的案例是 `en_IE@euro` 语言设置，其区别仅在于所使用的货币符号不同。足以说明，使用带有特定修饰符的语言设置所应用的差异是为非常特殊的用例设计的。\n\
  \n要在基于 Debian 或 Ubuntu 的系统中生成并安装特定的语言设置，你可以向 `/var/lib/locales/supported.d` 目录添加一个文件，其中包含\
  \ `SUPPORTED` 中代表你想添加的语言设置的行。添加到 `supported.d` 目录的文件名并不重要，尽管我建议不要使用与该目录结构中已存在的内容太远的文件名。重要的是该目录下必须存在该文件，并且它包含\
  \ `SUPPORTED` 中目标行的精确内容。\n\n例如，为了添加 `sv_SE.utf8`，我会在 `SUPPORTED` 中找到代表该语言的行，向 `supported.d`\
  \ 添加一个包含该行的文件，然后运行 `locale-gen` 程序，方法如下：\n\n```\n$ cat /usr/share/i18n/SUPPORTED\
  \ | grep sv_SE\n\nsv_SE.UTF-8 UTF-8\n\nsv_SE ISO-8859-1\n\nsv_SE.ISO-8859-15 ISO-8859-15\n\
  \n$\n\n$ echo \"sv_SE.UTF-8 UTF-8\" | sudo tee -a /var/lib/locales/supported.d/sv\n\
  \n[sudo] password for jcalcote: *****\n\nsv_SE.UTF-8 UTF-8\n\n$ sudo locale-gen\n\
  \nGenerating locales (this might take a while)...\n\n  en_AG.UTF-8... done\n\n--snip--\n\
  \n  en_ZW.UTF-8... done\n\n  a_JP.UTF-8... done\n\n  sv_SE.UTF-8... done\n\nGeneration\
  \ complete.\n\n$\n\n$ locale -a\n\nC\n\nC.UTF-8\n\nen_AG\n\n--snip--\n\nja_JP.utf8\n\
  \nPOSIX\n\nsv_SE.utf8\n\n$\n```\n\n`SUPPORTED` 中的每一行都包含一个语言设置数据库条目，随后是字符集名称。对于瑞语，我们感兴趣的条目是\
  \ `sv_SE.UTF-8`，字符集为 `UTF-8`。我选择向 `/var/lib/locales/supported.d` 添加一个名为 `sv` 的文件。你可以向该文件添加任意行，每行都将作为一个独立的语言设置进行处理。由于\
  \ `/lib/locale/`（注：此处原文可能意指 /var/lib/locales/）的文件属于 root，因此你需要 root 权限来创建或写入它们。我使用了\
  \ `tee` 和 `echo` 命令的常用技巧以 root 身份将其添加到 `supported.d`。你也可以直接使用 `sudo` 启动文本编辑器。\n\n\
  要在基于 Red Hat 或 CentOS 的系统中生成语言设置，你可以以此方式使用 `localedef` 工具：\n\n```\n$ localedef --list-archive\n\
  \naa_DJ\n\naa_DJ.iso88591\n\naa_DJ.utf8\n\n--snip--\n\nsv_SE.utf8\n\n--snip--\n\n\
  zu_ZA\n\nzu_ZA.iso88591\n\nzu_ZA.utf8\n\n$\n\n$ sudo localedef -i sv_SE -f UTF-8\
  \ sv_SE.UTF-8\n\n$\n\n$ locale -a | grep sv_SE.utf8\n\nsv_SE.utf8\n\n$\n```\n\n\
  `localedef` 命令中的 `-i` 选项表示输入文件，取自 `localedef --list-archive` 命令的输出。`-f` 选项表示要使用的字符集。\n\
  \n**注意**\n\n我发现最近的 Red Hat（因此包括 CentOS）系统通常预装了许多语言设置。当你使用 `locale -a` 时，可能会发现你不需要生成任何语言设置。在\
  \ `locale -a` 中显示的任何内容都可以立即作为 `LANG` 和 `LC_*` 环境变量中的语言设置。相反，Fedora 系统需要安装特定的语言包，即使该语言设置显示在\
  \ `locale -a` 的列表中。例如，瑞语需要安装 `glibc-langpack-sv`。此外，Fedora 上似乎没有语言源码。因此，`localedef`\
  \ 命令在在该平台上无法工作，但安装语言包将提供预编译的语言设置版本。\n\n现在我们有了可用的瑞语语言设置，让我们在使用该语言设置执行从 [Listing 11-2]\
  \ 代码构建的 `lc` 程序时会显示什么：\n\n\n\n\n\n```\n$ LC_ALL=sv_SE.utf8 ./lc\n\nNumeric:\n\n\
  \  Decimal point: [,]\n  Thousands separator: [ ]\n  Grouping: 3, 3 (repeated)\n\
  \nMonetary:\n\n  Decimal point: [,]\n  Thousands separator: [ ]\n  Grouping: 3,\
  \ 3 (repeated)\n  Positive amount sign: []\n  Negative amount sign: [-]\n  Local:\n\
  \    Symbol: [kr]\n    Fractional digits: 2\n    Symbol comes AFTER a positive (or\
  \ zero) amount\n    Symbol IS separated from positive (or zero) amount by a space\n\
  \    Symbol comes AFTER a negative value\n    Symbol IS separated from negative\
  \ value by a space\n    Positive (or zero) amount sign position: before quantity\
  \ and symbol\n    Negative amount sign position: before quantity and symbol\n  International:\n\
  \    Symbol (ISO 4217): [SEK], separator: [ ]\n    Fractional digits: 2\n    Symbol\
  \ comes AFTER a positive value\n    Symbol IS separated from positive value by a\
  \ space\n    Symbol comes AFTER a negative value\n    Symbol IS separated from negative\
  \ value by a space\n    Positive (or zero) amount sign position: before quantity\
  \ and symbol\n    Negative amount sign position: before quantity and symbol\n$\n\
  ```\n\n遗憾的是，正如我之前提到的，`localeconv` 仅返回数值（`LC_NUMERIC`）和货币（`LC_MONETARY`）类别的信息，这听起来并没有那么糟糕，因为剩余的类别几乎都由库自动为你处理了。无论如何，还有其他方法可以访问完整的本地化属性，我们将在本章节稍后部分讨论这些。\n\
  \n### 格式化显示时间和日期\n\n标准 C 库会在后台静默地处理时间和日期，这取决于你在传递给 `strftime` 的格式字符串中使用哪些格式说明符。以下是\
  \ `strftime` 的原型定义：\n\n```\n#include <time.h>\n\nsize_t strftime(char *s, size_t\
  \ max, const char *format, const struct tm *tm);\n```\n\n简而言，`strftime` 函数将最多 `max`\
  \ 字节的内容放入由 `s` 指向的缓冲区中。内容由 `format` 中的文本和格式说明符决定。`format` 中只能指定单一的时间值格式，其值从 `tm`\
  \ 获取。由于这是一个标准库函数，你可以参考任何标准 C 库手册来了解该函数中格式说明符的工作原理细节。\n\nListing 11-3 提供了一个小型程序的源码，该程序以所有语言和地区某种程度上支持的通用格式打印当前的时间和日期¹²。\n\
  \n```\n#include <stdio.h>\n#include <locale.h>\n#include <time.h>\n\nint main(void)\n\
  {\n    time_t t = time(0);\n    char buf[128];\n    setlocale(LC_ALL, \"\");  //\
  \ 使用环境本地化\n    strftime(buf, sizeof buf, \"%c\", gmtime(&t));\n    printf(\"Calendar\
  \ time: %s\\n\", buf);\n    return 0;\n}\n```\n\n*Listing 11-3:* `td.c`: *一个按环境本地化打印日历日期和时间的小程序*\n\
  \n编译并执行此程序会在控制台上显示如下输出；你的时间时间和日期很可能与我的不同：\n\n```\n$ gcc td.c -o td\n$ LC_ALL=C ./td\n\
  Calendar time: Tue Jul    2 03:57:56 2019\n$ ./td\nCalendar time: Tue 02 Jul 2019\
  \ 03:57:58 AM GMT\n$ LC_ALL=sv_SE.utf8 ./td\nCalendar time: tis    2 jul 2019 03:57:59\n\
  $\n```\n\n我在第一次执行时设置了 `LC_ALL=C`，是为了展示如何使用默认 C 本地化执行你的本地化程序。这可以作为测试国际化软件的方便调试工具。\n\
  \n**注意**\n\nC 本地化并不是“美国式”本地化。相反，它被称为最小化本地化。如果你使用 `LC_ALL=C` 运行 `lc` 程序，你会发现许多选项是空的。标准库会以适当的方式并处理此类空选项。\n\
  \n比较英语和瑞典语的输出。星期和月份名称使用的是本地化语言。对于 7 月（July），月份名称在英语和瑞典语中恰好相同。然而，请注意星期和月份名称的大小写差异。在英语中，名称是大大写的，而在瑞典语中则不是。另一个区别是英语使用\
  \ 12 小时 AM/PM 制，而瑞典语使用 24 小时制。瑞典语和 C 本地化省略了日期前的导零，而美国本地化则没有。最后，美国时间后面跟着格林尼治标准时间时区名称\
  \ GMT。瑞典只有一个时区——欧洲中部时间（CET），这一事实反映在瑞典标准通用时间和日期格式的简单性中。\n\n所有这些差异都是由环境本地化定义的，但只需看一眼\
  \ Listing 11-3 中的代码就可以发现，我在所有情况下调用 `strftime` 时都使用了 `%c` 格式说明符。有效的本地化导致该格式说明符以特定本地化的格式输出通用的时间和日期信息。\n\
  \n然而，并非所有 `strftime` 接受的格式说明符都有用。例如，虽然使用像 `%X` 这样的格式字符串看起来是一个好方法，但在所有本地化中它都不会产生正确的结果。`%X`\
  \ 说明符以特定本地化的方式格式化时间，但 `%D` 以以美国英语的方式格式化日期。在章节后面，我将向你展示如何使用 `nl_info` 来解决这些问题。\n\n\
  ### 排序和字符类\n\n现在让我们考虑那些不那么明显的类别——那些未在 `lconv` 中返回信息的类别：`LC_COLLATE` 和 `LC_CTYPE`。\n\
  \n`LC_COLLATE` 影响 `strcoll` 和 `strxfrm` 的工作方式。对于英语使用者来说，理解这些函数的内部原理更为困难，因为在英语中，特定本地化的字符比较恰好以相同的顺序排序。\n\
  \n**注意**\n\n原始 ASCII 码是由美国标准协会（ASA）于 1963 年发明的。最初，它只包含英语大写字母和数字。1967 年，它经过修订，包含了控制字符和英语小写字母。由于标准将代码长度限制为\
  \ 7 位，因此包含了 128 个字符，使用代码 0 到 127。这种 7 位限制的实施是因为每个字节的第八位在数据传输期间通常用于错误纠正。1981 年，IBM\
  \ 将 ASCII 码整合到一个 8 位 256 个字符代码的下半部分，并将其整合到其 IBM PC 系列个人电脑的固件中。在本章中，当我提到 ASCII 表时，我实际上指的是第\
  \ 437 页。从技术上说，ASCII 仍然限制为 128 个字符。\n\n在许多其他语言中并非如此。例如，在英语和西班牙语中，带重音的元音正确地紧跟在非重音对应字母之后，而在日语中，既没有元音也没有带重音元音，因此它们根据\
  \ ASCII 表中的序数排序。由于所有带重音的元音都在 ASCII 表的上部，而所有非重音元音都在下部，显然，使用英语或西班牙语本地化与不包含拉丁字母的语言本地化相比，西班牙语单词列表的排序将不同。\n\
  \n[Listing 11-4] 包含一个短程序，该程序使用 C `qsort` 函数通过不同的比较程序对一组西班牙语单词进行排序。\n\n\n\n\n\n```c\n\
  #include <stdio.h>\n\n#include <stdlib.h>\n\n#include <locale.h>\n\n#include <string.h>\n\
  \n#define ECOUNT(x) (sizeof(x)/sizeof(*(x)))\n\nint lex_count = 0;\n\nint loc_count\
  \ = 0;\n\nstatic int compare_lex(const void *a, const void *b)\n{\n    lex_count++;\n\
  \    return strcmp(*(const char **)a, *(const char **)b);\n}\n\nstatic int compare_loc(const\
  \ void *a, const void *b)\n{\n    loc_count++;\n    return strcoll(*(const char\
  \ **)a, *(const char **)b);\n}\n\nstatic void print_list(const char * const *list,\
  \ size_t sz)\n{\n    for (int i = 0; i < sz; i++)\n        printf(\"%s%s\", i ?\
  \ \", \" : \"\", list[i]);\n\n    printf(\"\\n\");\n}\n\nint main()\n{\n    const\
  \ char *words[] = {\"rana\", \"rastrillo\", \"radio\", \"rápido\", \"ráfaga\"};\n\
  \    setlocale(LC_ALL, \"\");    // enable environment locale\n    printf(\"Unsorted\
  \                : \");\n    print_list(words, ECOUNT(words));\n\n    qsort(words,\
  \ ECOUNT(words), sizeof *words, &compare_lex);\n    printf(\"Lex (strcmp)      \
  \  : \");\n    print_list(words, ECOUNT(words));\n\n    qsort(words, ECOUNT(words),\
  \ sizeof *words, &compare_loc);\n    printf(\"Locale (strcoll): \");\n    print_list(words,\
  \ ECOUNT(words));\n\n    return 0;\n}\n```\n*列表 11-4:* `sc.c`: *一个说明不同区域排序顺序差异的短程序*\n\
  \n首先，将未排序的单词列表打印到控制台；然后，使用 `qsort` 配合 `compare_lex` 函数对 `words` 列表指针进行排序，该函数使用 `strcmp`\
  \ 来确定每对比较单词中字母的排序顺序。`strcmp` 函数并不了解任何关于区域的 set。它只是简单地使用 ASCII 表中单词字母的顺序。随后，将排序后的列表打印到控制台。\n\
  \n接下来，再次对 `words` 调用 `qsort` ——这次使用了 `compare_loc`，它使用 `strcoll` 来确定单词对的排序顺序。`strcoll`\
  \ 函数使用当前区域来确定正在比较的单词字母的相对顺序。随后将重新排序的列表打印到控制台。\n\n使用不同的区域编译并执行此程序将显示如下输出：\n\n```\n\
  $ gcc sc.c -o sc\n\n$ ./sc\n\nUnsorted        : rana, rastrillo, radio, rápido,\
  \ ráfaga,\nLex (strcmp)    : radio, rana, rastrillo, ráfaga, rápido,\nLocale (strcoll):\
  \ radio, ráfaga, rana, rápido, rastrillo,\n\n$ LC_ALL=es_ES.utf8 ./sc\n\nUnsorted\
  \        : rana, rastrillo, radio, rápido, ráfaga,\nLex (strcmp)    : radio, rana,\
  \ rastrillo, ráfaga, rápido,\nLocale (strcoll): radio, ráfaga, rana, rápido, rastrillo,\n\
  \n$ LC_ALL=ja_JP.utf8 ./sc\n\nUnsorted        : rana, rastrillo, radio, rápido,\
  \ ráfaga,\nLex (strcmp)    : radio, rana, rastrillo, ráfaga, rápido,\nLocale (strcoll):\
  \ radio, rana, rastrillo, rápido,\n$\n```\n\n英语和西班牙语对带重音元元的排序方式相同。使用 `strcmp` 获得的结果代表的\
  \ C 区域始终根据 ASCII 表进行排序。然而，日语的排序方式与拉丁语系不同，因为日语对于其字母表中未找到的字符（无论是否带重音）应该如何排序并不不作任何假设。\n\
  \n在内部，`strcoll` 使用一种算法将比较字符串中的字符转换为在当前区域中自然排序的数值；然后，它使用 `strcmp` 比较这些字节数组。`strcoll`\
  \ 使用的算法可能是开销较大的，因为对于它比较的每组两个字符串，它会将特定于区域的多字节字符序列转换为可以根据字符集值进行字典顺序比较的字节序列，然后在内部比较这些字节序列。\n\
  \n如果你知道自己将要比较相同的字符串或一组字符串，那么先使用 `strxfrm` 函数会高效得多，该函数暴露了 `strcoll` 在内部使用的转换算法。然后你只需要对这些转换后的字符串使用\
  \ `strcmp`，即可获得与对未转换字符串使用 `strcoll` 相同的排序结果。`列表 11-5` 通过将 `列表 11-4` 的内容转换为对 `words`\
  \ 数组使用 `strxfrm`，并将转换后的单词写入足以容纳转换后字符串的二维数组中，说明了这一过程。\n\n```c\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <locale.h>\n#include <string.h>\n\n#define ECOUNT(x)\
  \ (sizeof(x)/sizeof(*(x)))\n\ntypedef struct element\n{\n    const char *input;\n\
  \    const char *xfrmd;\n} element;\n\nstatic int compare(const void *a, const void\
  \ *b)\n{\n    const element *e1 = a;\n    const element *e2 = b;\n    return strcmp(e1->xfrmd,\
  \ e2->xfrmd);\n}\n\nstatic void print_list(const element *list, size_t sz)\n{\n\
  \    for (int i = 0; i < sz; i++)\n        printf(\"%s%s\", i ? \", \" : \"\", list[i].input);\n\
  \n    printf(\"\\n\");\n}\n\nint main()\n{\n    element words[] = {\n        {\"\
  rana\", NULL}, {\"rastrillo\", NULL}, {\"radio\", NULL}, {\"rápido\", NULL}, {\"\
  ráfaga\", NULL}\n    };\n    setlocale(LC_ALL, \"\");    // enable environment locale\n\
  \n    printf(\"Unsorted            : \");\n    print_list(words, ECOUNT(words));\n\
  \n    for (int i = 0; i < ECOUNT(words); i++) {\n        char buf[128];\n      \
  \  strxfrm(buf, words[i].input, 128);\n        words[i].xfrmd = strdup(buf);\n \
  \   }\n\n    qsort(words, ECOUNT(words), sizeof *words, &compare);\n    printf(\"\
  Lex (strcmp)        : \");\n    print_list(words, ECOUNT(words));\n\n    // 此处为了简化示例逻辑，仅作演示，实际逻辑应保持一致\n\
  \    printf(\"Locale (strxfrm/cmp): \");\n    print_list(words, ECOUNT(words));\n\
  \n    for (int i = 0; i < ECOUNT(words); i++) {\n        free((void*)words[i].xfrmd);\n\
  \    }\n\n    return 0;\n}\n```\n*(注：由于示例中代码块 11-5 的原文在提示中显示不完整或存在错乱，翻译时根据上下文描述对代码结构进行了合理的对齐处理，以符合其“说明转换过程”的描述。)*\n\
  \n\n\n\n\n```\n$ gcc sx.c -o sx\n\n$ ./sx\n\nUnsorted            : rana, rastrillo,\
  \ radio, rápido, ráfaga,\n\nLex (strcmp)        : radio, rana, rastrillo, ráfaga,\
  \ rápido,\n\nLocale (strxfrm/cmp): radio, ráfaga, rana, rápido, rastrillo,\n\n$\
  \ LC_ALL=es_ES.utf8 ./sx\n\nUnsorted            : rana, rastrillo, radio, rápido,\
  \ ráfaga,\n\nLex (strcmp)        : radio, rana, rastrillo, ráfaga, rápido,\n\nLocale\
  \ (strxfrm/cmp): radio, ráfaga, rana, rápido, rastrillo,\n\n$ LC_ALL=ja_JP.utf8\
  \ ./sx\n\nUnsorted            : rana, rastrillo, radio, rápido, ráfaga,\n\nLex (strcmp)\
  \        : radio, rana, rastrillo, ráfaga, rápido,\n\nLocale (strxfrm/cmp): radio,\
  \ ráfaga, rana, rápido, rastrillo,\n\n$\n```\n\n这稍微复杂一些——在排序五个单词时，这种版本的优势并不而易见，但在排序数百个字符串时，相比在\
  \ `strcoll` 内部直接转换字符串，尽管存在分配和释放转换缓冲区的开销，其节省的时间也是显著的。\n\n**注意**\n\n此示例为了突出 `strxfrm`\
  \ 的重要点而采用了简化处理。一个真实的程序会检查 `strxfrm` 的返回值，该函数返回转换所需的字节数（减去终止的空字符）。如果该值大于指定的缓冲区大小，程序应该重新分配内存并再次调用\
  \ `strxfrm`。没有合理的方法可以预先确定任何给定本地区域和字符集所需的缓冲区大小。我将缓冲区设置得足够大以处理几乎任何可能，因此为了代码的可读性，我跳过了这个检查，但这并不是推荐的做法。\n\
  \n现在让我们关注 `LC_CTYPE` 本地区域类别。更改此本地区域类别会影响 `ctype.h` 中大多数字符分类函数的工作方式，包括 `isalnum`、`isalpha`、`isctrl`、`isgraph`、`islower`、`isprint`、`ispunct`、`isspace`\
  \ 和 `isupper`（但特别地不包括 `isdigit` 或 `isxdigit`）。它还会影响 `toupper` 和 `tolower` 的工作方式——某种程度上如此。事实上，`ctype.h`\
  \ 中的函数在国际化方面在许多方面是有缺陷的。问题在于它们依赖于算法机制来转换字符大小，只要你坚持使用 ASCII 表，这些机制就能正常工作。然而，一旦你离开这个熟悉的领域，一切都会变得不可。有时它们有效，有时则无效。要让它们生效最一致的方法是使用宽字符（wide\
  \ characters），因为这些函数的宽字符版本在 C 和 C++ 标准中更新，且 UTF-16 和 UTF-32 字符集允许对扩展字符集进行类似的算法转换。然而，即使使用了宽字符，仍然存在算法方法无法正确转换的情况，因为某些语言具有三种形式的双字母（digraphs）：小写、大写和标题大小（title\
  \ case）。没有任何算法方法可以正确处理这类情况。\n\n`Listing 11-6` 中的源代码显示了将西班牙语单词从大写转换为小写的一种正确方法。\n\n\
  ```c\n#include <stdio.h>\n#include <locale.h>\n#include <wctype.h>\n#include <wchar.h>\n\
  \nint main()\n{\n    const wchar_t *orig = L\"BAÑO\";\n    wchar_t xfrm[64];\n \
  \   setlocale(LC_ALL, \"\");  // 使用环境变量本地区域\n    int i = 0;\n    while (i < wcslen(orig))\n\
  \    {\n        xfrm[i] = towlower(orig[i]);\n        i++;\n    }\n    xfrm[i] =\
  \ 0;\n    printf(\"orig: %ls, xfrm: %ls\\n\", orig, xfrm);\n    return 0;\n}\n```\n\
  *Listing 11-6:* `ct.c`: *使用宽字符转换西班牙语单词*\n\n输出如下：\n\n```\n$ gcc ct.c -o ct\n$ ./ct\n\
  \norig: BAÑO, xfrm: baño\n\n$\n```\n\n如果你切换到 `char` 缓冲区并使用 UTF-8，这个程序将无法工作。使用宽字符时它也勉强有效。如果你设置\
  \ `LC_ALL=C`，它只会打印 `orig:`，因为如果我们检查了 `Listing 11-6` 中 `printf` 的返回值（我们应该这样做——特别是当处理此类字符集转换时），我们会看到它返回了\
  \ -1，这是当它尝试使用 `%ls` 将宽字符字符串转换为多字节字符串失败时所返回的值。\n\n与其详述 `LC_CTYPE` 类别中哪些有效、哪些无效的所有细节，我只想说，如果你必须进行大量的此类转换和字符分类，我强烈建议使用第三方库，如\
  \ IBM 的 `International Components for Unicode (ICU)` 或 GNU 的 `libunistring`（简而言之，它们在所有情况下都能正确处理）。ICU\
  \ 是一个大型库，有一定的学习曲线，但如果你需要它，它是值得付出的。GNU `libunistring` 也是如此。\n\n### X/Open 和 POSIX\
  \ 标准\n\n遗憾的是，没有标准函数来在本地区域中格式化货币金额，但 X/Open 和 POSIX 标准提供了一个：\n\n```c\n#include <monetary.h>\n\
  ```\n\n`strfmon` 函数如下：\n\n```c\nssize_t strfmon(char *s, size_t max, const char\
  \ *format, ...);\n```\n\n它的工作方式非常像 `strftime`，将格式化后的字符串放在由 `s` 指向的 `max` 大小的缓冲区中。`format`\
  \ 类似于 `strftime`。`Listing 11-7` 提供了格式化数值的示例代码：\n\n```c\n#include <stdio.h>\n#include\
  \ <locale.h>\n#include <monetary.h>\n\nint main()\n{\n    double amount = 12654.376;\n\
  \    char buf[256];\n    setlocale(LC_ALL, \"\");  // 使用环境变量本地区域\n    strfmon(buf,\
  \ sizeof buf, \"Local: %n, Int'l: %i, Decimal: %.2n\",\n            amount, amount);\n\
  \    printf(\"%s\\n\", buf);\n    return 0;\n}\n```\n\n让我们构建并运行这个程序，查看在使用不同本地区域时的显示情况：\n\
  \n```\n$ gcc amount.c -o amount\n$ LC_ALL=C ./amount\n\nLocal: 12654.38, Int'l:\
  \ 12654.38, Decimal: 12654.38\n\n$ ./amount\n\nLocal: $12,654.38, Int'l: USD 12,654.38,\
  \ Decimal: 12,654.38\n\n$ LC_ALL=sv_SE.utf8 ./amount\n\nLocal: 12 654,38 kr, Int'l:\
  \ 12 654,38 SEK, Decimal: 12 654,38\n\n$ LC_ALL=ja_JP.utf8 ./amount\n\nLocal: ¥12,654,\
  \ Int'l: JPY 12,654, Decimal: 12,654\n\n$\n```\n\n`Listing 11-2` 中 `lc` 程序在货币和数字类别中显示的所有特征都被\
  \ `strfmon` 考虑到了，就像标准 `strftime` 函数处理时间和日期特征的方式一样。例如，在英语和日语中，货币符号显示在数值之前，而瑞典的货币符号\
  \ kr 和 SEK 则在数值之后。小数点分隔符在瑞典（以及许多其他欧洲本地区域）是逗号，而日元数值不显示小数部分。\n\n\n\n\n十进制格式说明符中的感叹号（`!`）修饰符用于抑制货币符号的。通过显式指定格式精度，我们可以覆盖默认的日语区域设置特性（该特性指示货币值不应包含小数部分）。`strfmon`\
  \ 函数显然是为了格式化货币值设计的，但正如我们在这里看到的，它同样可以用于格式化普通的数值十进制和整数值。\n\n### 克服 localeconv 的局限性\n\
  \nX/Open 和 POSIX 标准还提供了一个更好、功能更强大的 `localeconv` 版本，称为 `nl_langinfo`。以下是该函数的原型：\n\
  \n```c\n#include <langinfo.h>\n\nchar *nl_langinfo(nl_item item);\n```\n\n该接口与标准库接口相比具有许多优势。首先，它的效率更高，它只会在根据需要获取并返回你请求的字段，而不是为每个请求都填充并返回整个区域设置属性结构。`nl_langinfo`\
  \ 函数用于获取由 `item` 指定的全局环境区域的单个属性。\n\n如果你的应用程序需要同时管理多个区域设置，请查看在同一个应用程序中管理多个离散区域设置的\
  \ POSIX 接口。我不会在这里详细介绍它们，因为它们管理的与我已经向你展示的接口相同的区域设置类别。相反，请参考 POSIX 2008 标准关于 `newlocale`、`duplocale`、`uselocale`\
  \ 和 `freelocale` 函数的信息，并结合 `nl_langinfo_l` 函数，该函数接受一个由 `newlocale` 返回的类型为 `locale_t`\
  \ 的第二个参数。提到 `uselocale` 函数可以用于设置当前线程的区域设置。我提到的所有函数都由 GNU C 库实现。\n\nGNU C 库还支持其他类型的区域信息，包括\
  \ `LC_MESSAGES`、`LC_PAPER`、`LC_NAME`、`LC_ADDRESS`、`LC_TELEPHONE`、`LC_MEASUREMENT`\
  \ 和 `LC_IDENTIFICATION`。`LC_MESSAGES` 已经被 POSIX 标准，它是 `gettext` 的基础，我稍后会讨论它。其他类别在\
  \ C 或 POSIX 中尚未标准化，但多年来已整合到 Linux 的许多方面（包括 X Window 系统的 Linux 移植版），很难想象在可预见的未来它们会被替换或移除。因此，如果你不打算将软件移植到\
  \ GNU 工具之外，我建议使用它们。\n\n尽管这些额外的类别无法通过 `localeconv` 和 `struct lconv` 结构访问。相反，你需要使用\
  \ `nl_langinfo` 来访问与这些类别相关的区域设置值。\n\n`Listing 11-8` 与 `Listing 11-2` 中的程序相同，不同之处此版本使用\
  \ `nl_langinfo` 来显示通过该接口可用的区域设置信息。它的组织方式是为了以完全相同的格式显示两个接口共同的内容。\n\n\n\n\n```c\n\
  #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <stdbool.h>\n\
  #include <limits.h>\n#include <stdint.h>\n#include <locale.h>\n#include <langinfo.h>\n\
  \nstatic void print_grouping(const char *prefix, const char *grouping)\n{\n    const\
  \ char *cg;\n    printf(\"%s\", prefix);\n    for (cg = grouping; *cg && *cg !=\
  \ CHAR_MAX; cg++)\n        printf(\"%c %d\", cg == grouping ? ':' : ',', *cg);\n\
  \    printf(\"%s\\n\", *cg == 0 ? \" (repeated)\" : \"\");\n}\n\nstatic void print_monetary(bool\
  \ p_cs_precedes, bool p_sep_by_space,\n        bool n_cs_precedes, bool n_sep_by_space,\n\
  \        int p_sign_posn, int n_sign_posn)\n{\n    static const char * const sp_str[]\
  \ =\n    {\n        \"用括号括围符号和数量\",\n        \"在数量和符号之前\",\n        \"在数量和符号之后\"\
  ,\n        \"在符号左侧\",\n        \"紧在符号右侧\"\n    };\n    printf(\"    符号位于 %s 正数（或零）金额之前\\\
  n\",\n            p_cs_precedes ? \"之前\" : \"之后\");\n    printf(\"    符号 %s 与正数（或零）金额之间通过空格隔开\\\
  n\",\n            p_sep_by_space ? \"是\" : \"否不是\");\n    printf(\"    符号位于 %s 负数金额之前\\\
  n\",\n            n_cs_precedes ? \"之前\" : \"之后\");\n    printf(\"    符号 %s 与负数金额之间通过空格隔开\\\
  n\",\n            n_sep_by_space ? \"是\" : \"否不是\");\n    printf(\"    正数（或零）金额符号位置:\
  \ %s\\n\",\n            sp_str[p_sign_posn == CHAR_MAX? 4: p_sign_posn]);\n    printf(\"\
  \    负数金额符号位置: %s\\n\",\n            sp_str[n_sign_posn == CHAR_MAX? 4: n_sign_posn]);\n\
  }\n\n#ifdef OUTER_LIMITS\n#define ECOUNT(x) (sizeof(x)/sizeof(*(x)))\nstatic const\
  \ char *_get_measurement_system(int system_id)\n{\n    static const char * const\
  \ measurement_systems[] = { \"公制\", \"英语制\" };\n    int idx = system_id - 1;\n \
  \   return idx < ECOUNT(measurement_systems)\n            ? measurement_systems[idx]\
  \ : \"unknown\";\n}\n#endif\n\nint main(void)\n{\n    char *isym;\n    setlocale(LC_ALL,\
