  \nxflaim 的 `util` 目录稍微复杂一些。根据原始 makefile，它生成了几个实用程序以及一个供这些实用程序调用的便利库。\n\n要找出哪些源文件属于哪些实用程序以及哪些完全没有被使用要稍微困难一些。`xflaim/util`\
  \ 目录中的几个文件没有被任何实用程序使用。我们是否分发这些额外的源文件？我选择了分发它们，因为原始构建系统已经在分发它们了，将它们添加到 `EXTRA_DIST`\
  \ 列表中可以让后来的观察者清楚地看出它们没有被使用。\n\nListing 14-15 显示了 `xflaim/util/Makefile.am` 文件的部分；缺失的部分是冗的。\n\
