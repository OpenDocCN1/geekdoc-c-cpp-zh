  \ >/dev/null 2>&1\n\n   mv -f .deps/libjupiter_la-jup_print.Tpo .deps/libjupiter_la-jup_print.Plo\n\
  \n   /bin/bash ../libtool  --tag=CC   --mode=link gcc  -g -O2   -o libjupiter.la\n\
  \n   -rpath /usr/local/lib libjupiter_la-jup_print.lo ../common/libjupcommon.la\n\
  \n   -lpthread\n\n   libtool: link: gcc -shared  -fPIC -DPIC  .libs/libjupiter_la-jup_print.o\n\
  \n   -Wl,--whole-archive ../common/.libs/libjupcommon.a -Wl,--no-whole-archive\n\
  \n   -lpthread  -g -O2   -Wl,-soname -Wl,libjupiter.so.0 -o .libs/libjupiter.\n\n\
  \   so.0.0.0\n\n   libtool: link: (cd \".libs\" && rm -f \"libjupiter.so.0\" &&\
  \ ln -s \"libjupiter.\n\n   so.0.0.0\" \"libjupiter.so.0\")\n\n   libtool: link:\
  \ (cd \".libs\" && rm -f \"libjupiter.so\" && ln -s \"libjupiter.\n\n   so.0.0.0\"\
  \ \"libjupiter.so\")\n\n```\n\n\n\n\n\n与 Autotools 工具链中的其他软件包一样，`Libtool` 为你提供了大量的功能和灵活性。但正如你可能注意到的，这种程度的功能和灵活性是有代价的——复杂性。随着\
  \ `Libtool` 的加入，Jupiter 配置脚本的大小大幅增加，编译和链接我们项目所需的时间也随之增加。\n\n在下一章中，我们将继续讨论 `Libtool`，通过查看库版本问题以及\
  \ `Libtool` 针对手动动态运行时库管理所带来的移植性问题提出的解决方案。\n\n# 8 库接口版本与运行时动态链接\n\n他偶尔会偶然撞见真理，但会迅速站起来，并若无其事地继续匆忙向前。\n\
  \n——温斯顿·丘吉尔，引用自《不可阻挡的丘吉尔》\n\n![Image](img/common.jpg)\n\n在上一章中，我解释了动态加载共享库的概念。我还向你展示了为你的项目添加\
  \ `Libtool` 共享库功能和灵活性是多么简单，无论你的项目提供的是共享库、静态库、便利存档（archive）还是这些者的混合。我们仍然有两个需要涵盖的\
  \ `Libtool` 主要主题。第一个是库版本化，第二个涉及使用 `Libtool` 的 `ltdl` 库在项目中可移植地构建和消费动态加载的模块。\n\n\
  当我谈到库的版本时，我特指库的公共接口版本，但我需要在此语境下清晰地定义“接口（interface）”一词。`共享库接口`指的是共享库与外部世界连接的所有方面。除了库导出的函数和数据签名外，这些连接还包括文件和文件格式、网络连接和线缆数据格式、IPC（进程间通信）通道和协议等。在考虑是否为共享库分配新版本时，你应该仔细检查库与世界交互的所有方面，以确定某项更改是否会导致库从用户的角度来看表现得不同。\n\
  \n`Libtool` 隐藏共享库平台差异的尝试是如此构巧妙，以至于如果你一直使用 `Libtool` 构建共享库，你可能甚至没有平台之间共享库的版本化方式存在显著差异。\n\
  \n## 系统特定的版本化\n\n让我们查看共享库版本化在几个不同系统上是如何工作的，以便为 `Libtool` 的抽象提供背景信息。\n\n共享库版本化可以在内部或外部完成。`内部版本化`意味着库名称没有以任何方式反映其版本。因此，内部版本化意味着某种形式的可执行头信息为链接器提供了针对请求的`应用程序二进制接口\
  \ (ABI)` 的适当函数调用。这也意味着库的所有版本的所有函数调用都维护在同一个共享库文件中。`Libtool` 支持在平台要求时使用内部版本化，但它更倾向于使用外部版本化。在`外部版本化`中，版本信息直接指定在文件名中。\n\
  \n除了库级版本化（其中某个特定的版本号或字符串指向整个库接口）外，许多 Unix 系统还支持某种形式的导出或符号级版本化，其中共享库导出同一个函数或全局数据项的多个命名名或带编号的版本。虽然\
  \ `Libtool` 不阻碍在每个系统上使用此类导出级版本化方案，但它也没有为这些方案提供任何特定的移植性支持。因此，我不会对这个主题进行详细介绍。\n\n\
  ### Linux 和 Solaris 库版本化\n\n现代 Linux 的库版本化系统很大程度上借鉴了 Oracle 的 Solaris 操作系统第 9 版^(1)。这些系统使用一种外部库版本化，其中版本信息按照特定的模式或模板被编码在共享库文件名中。让我们看看典型\
  \ Linux 系统上 `/usr/lib/x86_64-linux-gnu` 目录的部分目录列表——特别是与相当典型的库 `libcurl` 关联的文件：\n\
  \n```\n $ ls -lr /usr/lib/x86_64-linux-gnu/libcurl*\n\n➊ -rw-r--r-- ... 947448 ...\
  \ libcurl.a\n\n   lrwxrwxrwx ...     19 ... libcurl-gnutls.so.3 -> libcurl-gnutls.so.4\n\
  \n   lrwxrwxrwx ...     23 ... libcurl-gnutls.so.4 -> libcurl-gnutls.so.4.4.0\n\n\
  \   -rw-r--r-- ... 444800 ... libcurl-gnutls.so.4.4.0\n\n   -rw-r--r-- ...    953\
  \ ... libcurl.la\n\n➋ lrwxrwxrwx ...     16 ... libcurl.so -> libcurl.so.4.4.0\n\
  \n   lrwxrwxrwx ...     12 ... libcurl.so.3 -> libcurl.so.4\n\n➌ lrwxrwxrwx ...\
  \     16 ... libcurl.so.4 -> libcurl.so.4.4.0\n\n➍ -rw-r--r-- ... 452992 ... libcurl.so.4.4.0\n\
  \n   $\n```\n\n**注意**\n\n此控制台目录列表的内容是针对我的系统的，它是基于 Debian 发行版的。如果你的发行版不是基于 Debian，你可能会看到略有不同的列表——甚至是显著不同。在这种情况下，不要尝试在你的系统上照做。相反，在阅读下面的描述时，只需遵循我这里的示例即可。重要的是概念，而不是文件名。\n\
  \nLinux 系统上的库名遵循标准格式：`libname.so.X.Y`。格式中的 `X.Y` 代表版本信息，其中 `X` 是主版本号（始终是数字），`Y`\
  \ 是次版本号（可能包含多个）。通用规则是 `X` 的更改代表库 ABI 的兼容更改，而 `Y` 的更改代表向兼容的修改，包括库的添加。\n\n通常，你会看到看起来像第三个数字的部分。例如，➍\
  \ 处的项代表实际的 `curl` 共享库 `libcurl.so.4.4.0`。在这个示例中，最后两个数字（4.0）实际上代表一个双部分版本号。次版本号中的此类额外数字有时被称为库的`补丁级别（patch\
  \ level）`^(2)\n\n➌ 处的 `libcurl.so.4` 项实际上是 `soname`，并且是一个指向二进制文件的软链接。soname 是消费程序和库内部引用的格式——即链接器在构建消费程序或库时会将此名称嵌入其中。软链接由\
  \ `ldconfig` 工具创建，该工具除了其他作用外还确保适当的 soname 可以找到已安装库的最新次版本。`ldconfig` 工具通常由 RPM 和\
  \ Debian 包的后安装脚本触发执行。因此，虽然 soname 不是由 `make install` 目标创建或安装的，但它通常由发行版安装包（因此由 Linux\
  \ 打软件包）创建。\n\n注意这种版本化方案允许不同主版本的多个 soname 以及不同主次版本的多个二进制文件共存在于同一个目录。\n\n库的包（以 `-dev`\
  \ 或 `-devel` 结尾）通常还会安装一个所谓的`链接器名称（linker name）`项（➋）。链接器名称是一个仅以 `.so` 结尾的软链接，通常指向\
  \ soname，但在某些情况下（例如本例），它可能直接引用二进制共享库。链接器名称是链接命令行中引用库的名称。开发库允许你在系统上运行链接到库最新版本的程序，但针对该库的旧版本进行开发，反之亦然。\n\
  \n\n\n\n➊ 处的项目指的是库的静态归档形式，在 Linux 和 Solaris 系统上其扩展名为 `*.a`。其余条目代表了为 `curl` 包特定目的生成的\
  \ `curl` 库的其他形式。\n\n多年来，`curl` 库已成为现代 Linux 系统的重要部分；系统安装的许多其他程序都在使用它，其中一些程序尚未升级到最新的主版本。维护者声称，主版本\
  \ 4 与主版本 3 兼容。因此，在安装了版本 4 的系统上，指向版本 3 的符号链接（sonames）会被重指向版本 4 的库。这并不一定是通用做法，但在这种情况下恰恰有效。\n\
  \n从这里开始，由于一系列复杂的外部和内部共享库版本控制技术，情况变得复杂。在这些并不直观的系统中，每一种的设计都是为了解决多年来在 Solaris 系统中发现的一些根本性问题。让我们来看其中几个。\n\
  \n## IBM AIX 库文件版本控制\n\n传统上，IBM 的 AIX 使用一种内部版本控制，将所有库代码存储在一个遵循 `libname.*a` 模式的单一归档文件中。该文件实际上可能包含静态和共享形式的代码，以及\
  \ 32 位和 64 位代码。在内部，所有共享库代码都存储在归档文件内的单个逻辑共享对象文件中，而静态库对象则作为独立的逻辑对象文件存储在归档中。\n\n我之所以说“传统上”，是因为较新版本的\
  \ AIX（包括所有 64 位版本）现在支持直接从物理 `*.so` 文件加载共享库代码的概念。\n\nLibtool 使用这两种方案在 AIX 上生成共享库代码。如果在命令行上指定了\
  \ AIX 的 `-brtl` 原生链接器标记，`Libtool` 将生成具有 `*.so` 扩展名的共享库。否则，它将按照旧的单文件方案生成组合库。\n\n\
  在 AIX 上使用 `*.so` 文件方案时，`Libtool` 按照 Linux/Solaris 的模式命名库命名，以便与这些更流行的平台保持某种一致性。然而，无论使用哪种共享库扩展，版本信息仍然没有存储在文件名中；它存储在库本身以及调用它的可执行文件内部。据我所知，`Libtool`\
  \ 确保创建了正确的内部结构，以反映共享库头文件中正确的版本信息。它是通过向原生链接器传递带有来自 `Libtool` 版本字符串的嵌入版本信息的适当标记来实现的。\n\
  \n大多数 Unix 系统上的可执行文件也支持嵌入式运行时库搜索路径的概念（在 AIX 上称为 `LIBPATH`），该路径通常指定了一组用冒号分隔的文件系统路径，用于搜索共享库依赖。你可以使用\
  \ `Libtool` 的 `-R` 命令行选项为程序和库指定库搜索路径。`Libtool` 会将此选项翻译为任何给定系统上相应的 GNU 或原生链接器选项。\n\
  \n我说可执行文件*通常*支持此选项，是因为在 AIX 上存在一些细微差别。如果 `LIBPATH` 中指定的所有目录都是真实的目录，一切都能按预期工作——即\
  \ `LIBPATH` 纯粹作为库搜索路径。然而，如果 `LIBPATH` 的第一段不是真实的文件系统节点，它将作为一个所谓的*加载器域（*loader domain*），这基本上是特定共享库的命名空间。因此，多个同名的共享库可以存储在同一个\
  \ AIX 归档（`*.a`）文件中，每个库（通过链接器选项）分配给不同的加载器域。与 `LIBPATH` 中指定的加载器域匹配的库将从归档中加载。如果你通过\
  \ `LIBPATH` 分配了一个加载器域，而它后来（偶然地）变成了真实的文件系统节点，就会产生糟糕的副作用。另一方面，你还可以在 `LIBPATH` 中指定一个搜索目录，该目录恰好匹配共享库中的某个加载器域。如果该目录随后被删除，你将无意中开始使用加载器域。正如你可以想象的，会导致奇怪的行为。AIX\
  \ 开发者通过确保加载器域字符串看起来完全不像文件系统路径，已经解决了大部分此类问题。\n\n在 AIX 系统上，所有代码（无论是静态还是共享的）都被编译为位置无关代码（PIC），因为\
  \ AIX 仅曾移植到 PowerPC 和 RS/6000 处理器上。这些处理器的架构只允许 PIC 代码，因此 AIX 编译器无法生成非 PIC 代码。\n\n\
  ### Microsoft DLL 版本控制\n\n考虑 Microsoft Windows 动态链接库（DLL），它们在字面意义上的一切都是共享库，并提供了完善的应用程序编程接口（API）。但遗憾的是，微软过去没有提供任何集成的\
  \ DLL 接口版本方案。结果，Windows 开发者经常将 DLL 版本问题（我确定是玩笑）称为“DLL 地狱（*DLL hell*）”。\n\n作为解决此问题的一种创可贴方法，Windows\
  \ 系统上的 DLL 可以安装到使用它们的程序所在的目录中。Windows 操作系统加载器总是尝试在搜索系统路径中的副本之前先使用本地副本。这缓解了部分问题，因为它允许你与需要它的包一起安装特定版本的库。虽然这是一个可以接受的解决方案，但它并不是一个好的解决方案，因为共享库的主要优势之一是它们是可以共享的——无论是在磁盘上还是在内存中。如果每个应用程序都有自己的一个不同版本的库副本，那么共享库的这种优势就丢失了——无论是在磁盘上还是在内存中。\n\
  \n自从年前引入这个部分解决方案以来，微软并没有怎么关注 DLL 共享问题。其原因包括对磁盘空间和内存成本的漫不关心，以及关于 Windows DLL 实现的技术问题。微软系统架构师没有生成位置无关代码，而是选择将\
  \ DLL 链接到特定的基地址，并在库镜像头的基表中列出所有的绝对地址引用。当 DLL 无法在预定的基地址加载时（因为与另一个 DLL 冲突），加载器会通过选择一个新基地址并更改基表中引用的代码段中所有的绝对地址来对\
  \ DLL 进行重基（*rebases*）。当 DLL 以这种方式进行重基时，它只能与恰好被重基到相同地址的进程共享。意外遇到这种情况的概率——特别是在具有许多\
  \ DLL 组件的应用程序中——是非常微小的。\n\n最近，微软发明了并存缓存（side-by-side cache，有时称为 SxS）的概念，它允许开发者将安装在系统位置的特定版本的\
  \ DLL 与一个唯一标识值（实际上是 GUID）关联。位置目录名称由 DLL 名称和版本标识符派生。针对 SxS 版本化库构建的应用程序在其可执行文件头文件中存储了元数据，指示了它们所需的特定版本的\
  \ DLL。如果较新的 OS 加载器在 SxS 缓存中找到了正确的版本，则加载该版本。根据 EXE 头文件元数据中的策略，加载器可以回到早期的查找本地副本和全局全局副本的方案。这比以前的解决方案是一个巨大的改进，并提供了一个非常灵活的版本控制系统。\n\
  \n\n\n\n\n并存缓存（side-by-side cache）有效地让 Windows DLL 架构向 Unix 管理共享库的方式迈进了一步。可以将 `SxS`\
  \ 视为库的系统安装位置——类似于 Unix 系统上的 `/usr/lib` 目录。此外，与 Unix 类似，多个版本的相同 `DLL` 可以并存安装在并存缓存中。\n\
  \n尽管存在这些相似之处，但由于 `DLLs` 使用的是重基址（rebasing）技术而非位置无关代码（PIC code），对于管理几十个共享库的应用程序来说，并存缓存仍然是一个相当温和的效率改进。`SxS`\
  \ 真正的目的是为了许多应用程序可能调用的系统库。这些库通常位于不同的地址，因此减少了冲突（并导致重基址）的概率，但并不能完全消除这种概率。\n\n共享库的整个基于基址（based-based\
  \ approach）的方法方法有一个主要的缺点：由于系统加载器在整个 32 位地址空间内遵循随机选择的基地址，程序地址空间可能会变得非常碎片化。幸运的是，64\
  \ 位寻址在这方面提供了巨大的帮助，因此你可能会发现并存缓存对于 64 位 Windows 系统（这已是现在的主流）在提高内存使用效率方面有效得多。\n\n###\
  \ HP-UX/AT&T SVR4 库版本控制\n\n惠普的 Unix 版本（自 HP-UX 10.0 版本起）增加了一种库级版本控制，这与 AT&T UNIX\
  \ System V Release 4 中使用的版本控制非常相似。对于我们的目的来说，你可以认为这两类系统的工作方式几乎相同。\n\n原生链接器寻找由带有 `.sl`\
  \ 扩展名的基名称指定的库。然而，使用库的程序和库包含了对该库**内部名称**（`internal name`）的引用。内部名称是由链接器命令行选项分配给库的，应该包含库的接口版本号。\n\
  \n实际的库仅以主接口版本号作为扩展名命名，并创建一个扩展名为 `.sl` 的软链接指向该库。因此，这些系统上的共享库将遵循此模式：\n\n```\nlibname.X\n\
  \nlibname.sl -> libname.X\n```\n\n我们唯一可以处理的版本信息是一个主版本号，它应该被用来用于指示从一个版本到下一个版本不后兼容的更改。由于不像\
  \ Linux 或 Solaris 那样有次版本号，我们无法保留特定接口版本的多个修订版本。唯一的选择是，如果进行了错误修复或向后兼容的增强（也就是说对接口进行了非侵入性的添加），则用更新后的版本零替换库的版本零。\n\
  \n然而，我们仍然可以并存安装多个主版本的库，并且 `Libtool` 充分利用了这些系统上的所有可用资源。\n\n### Libtool 库版本控制方案\n\n\
  `Libtool` 的作者们努力提供一种可以映射到任何 `Libtool` 平台所使用的任何方案的版本控制方案。`Libtool` 版本控制方案设计得足够灵活，可以与现有\
  \ `Libtool` 平台未来合理的更改、甚至与新的 `Libtool` 平台保持向前兼容性。\n\n尽管如此，它并非万能妙药。当 `Libtool` 扩展到新类型的共享库平台时，出现过（并且持续持续发生）需要进行严肃且细致评估的情况。没有人能精通所有系统，因此\
  \ `Libtool` 的开发人员严重依赖外部贡献，以创建从 `Libtool` 版本控制方案到新或可能成为 `Libtool` 平台方案的正确映射。\n\n\
  ### 库版本控制就是接口版本控制\n\n你应该有意识地避免将库版本号（无论是 `Libtool` 的还是特定平台的）视为产品的主版本（major）、次版本（minor）和修订版本（revision，也称为\
  \ `patch` 或 `micro`）值。事实上，这些值对于操作系统加载器具有非常具体的含义，必须为每个新库版本进行正确更新，以防混淆加载器。混淆的加载器可能会根据分配给库的错误版本信息加载错误的库版本。\n\
  \n几年前，我正与公司的企业版本控制委员会合作，为整个公司制定软件版本控制策略。委员会希望工程师确保整合到我们共享库名称中的版本号与公司的软件版本控制策略保持一致。我花了一整天的时间才说服了他们：共享库的版本与产品版本没有任何关系，也不应该由他们或任何其他人建立或强制这种关系。\n\
  \n原因如下：共享库上的版本号并不是真正的库版本，而是接口版本。我在这里指的**接口**（`interface`）是库向用户呈现的应用程序二进制接口（ABI），即另一个想要调用该接口所提供的函数的程序员。可执行程序具有单一的、定义良好的、标准的入口点（在\
  \ C 语言中通常称为 `main`）。但共享库有多个入口点，这些入口点通常没有以一种广泛理解的方式标准化。这使得判断库的特定版本是否与同一库的另一个版本接口兼容变得困难得多。\n\
  \n在 `Libtool` 的版本控制方案中，共享库被认为支持一系列接口版本，每个版本由一个唯一的整数值标识。如果接口的任何公开可见方面在公共发布之间发生变化，它就不再被视为同一个接口；因此它变成了一个新接口，由一个新的整数标识符标识。接口发生更改的库的每次公共发布只需获取下一个连续的接口版本号。在发布版本之间以向后兼容的方式发生更改的库被认为同时支持旧接口和新接口；例如，库的某个版本可能支持接口\
  \ 2 到 5。\n\n`Libtool` 库版本信息在 `libtool` 命令行上通过 `-version-info` 选项指定，如列表 8-1 所示。\n\
  \n```\nlibname_la_LDFLAGS = -version-info 0:0:0\n```\n\n*列表 8-1：在 Makefile.am 文件中设置共享库版本信息*\n\
  \nLibtool 开发者明智地选择了冒号而不是句号，以防止开发者试图将 Libtool 版本字符串值与各种平台上附加在共享库文件末尾的版本号直接关联。版本字符串中的三个值分别称为接口\
  \ `current`、`revision` 和 `age` 值。\n\n`current` 值代表当前的接口版本号。当接口自上次公共发布以来以某种公开可见的方式更改而必须声明新的接口版本时，该值就会发生变化。库中的第一个接口按照惯赋予版本号零。考虑一个共享库，开发者自上次公共发布以来，在该库暴露的函数集中增加了一个新函数。由于增加了一个函数，在该版本中接口不能认为是相同的。因此，它的\
  \ `current` 必须从零增加到一。\n\n\n\n\n\n`age` 值代表共享库支持的回溯版本数量。在数学术语中，该库被认为支持的接口范围从 `current\
  \ − age` 到 `current`。在我刚刚给出的示例中，库中添加了一个新函数，因此该版本的库提供的接口与上一个版本不同。然而，上一个版本仍然完全支持，因为旧的接口是当前接口的真子集。因此，`age`\
  \ 值也应该从 0 增加到 1。\n\n`revision` 值仅代表当前接口的序列修订版本。也就是说，如果在两次发布之间，库的接口没有进行任何可见的更改——例如可能只对内部函数进行了优化——那么库的名称应该以某种方式发生变化，即使仅仅是为了区分这两个版本。但\
  \ `current` 和 `age` 值都将保持相同，因为从用户的角度来看接口并没有发生变化。因此，`revision` 值会加 1，以反映这是相同接口的新发布这一事实。在上一个示例中，`revision`\
  \ 值将保持为 0，因为其他两个值中的一个或两个值已经增加了。\n\n为了简化共享库的发布过程，对于每个即将公发布的库新版本，都应该逐步遵循 Libtool 版本控制算法：\n\
  \n1. 为每个新的 Libtool 库从版本信息 0:0:0 开始。（如果简单地从传递给 libtool 脚本的链接器列表中省略 `-version-info`\
  \ 选项，将自动完成。）对于现有的库，从上一次公发布的 Libtool 版本信息开始。\n2. 如果库源代码自上次更新以来发生了任何变化，则增加 `revision`（`c*:*r*:*a*`\
  \ 变为 `c*:*r*+1:*a*`）。\n3. 如果自上次更新以来添加、删除或更改了任何导出函数或数据，则增加 `current`并将 `revision`\
  \ 设置为 0。\n4. 如果自上次公发布以来增加了任何导出函数或数据，增加 `age`。\n5. 如果自上次公发布以来删除了任何导出函数或数据，将 `age`\
  \ 设置为 0。\n\n记住这是一个算法；因此，它的设计是逐步执行，而不是直接跳到适用于你情况的步骤。例如，如果你自上次发布以来从库中删除了一个 API 函数，你不会直接跳到最后一步并将\
  \ `age` 设置为 0。相反，你应该遵循所有步骤直到到达最后一步，*然后*将 `age` 设置为 0。\n\n**注意**\n\n请记住只在软件公发布之前立即更新版本信息。频繁的更新是没有必要的，而且只会让\
  \ `current` 接口数字变得更快。\n\n让我们来看一个例子。假设这是某个库的第二次发布，而第一次发布使用了 0:0:0 的 `-version-info`\
  \ 字符串。在开发周期内，库接口添加了一个新函数，并删除了一个现有函数。该库新发布版本的版本信息字符串的影响如下：\n\n1. 从上一个版本信息开始：0:0:0。\n\
  2. 0:0:0 变为 0:1:0（库的源代码发生了变化）。\n3. 0:1:0 变为 1:0:0（库的接口被修改了）。\n4. 1:0:0 变为 1:0:1（添加了一个新函数）。\n\
  5. 1:0:1 变为 1:0:0（删除了一个旧函数）。\n\n现在应该清楚，Libtool 的 `current`、`revision` 和 `age` 值与\
  \ Linux 的主版本（major）、次版本（minor）和可选补丁级别（patch-level）值之间没有直接关系。相反，使用映射规则将一种方案中的值转换为另一种方案中的值。\n\
  \n回到之前的示例，其中库的第二次发布添加了一个函数并删除了一个函数，我们得到了新的 Libtool 版本字符串 1:0:0。版本字符串 1:0:0 表示该库与上一个版本不兼容（`age`\
  \ 为 0），因此 Linux 共享库文件将命名为 `lib`name.*so.1.0.0`。这看起来非常像 Libtool 版本字符串——但不要被误骗了。这种常见的巧合可能是\
  \ Libtool 版本抽象中最令人困惑的方面之一。\n\n让我们稍微修改一下示例，假设我们添加了一个库接口函数但没有删除任何内容。再次从原始版本信息 0:0:0\
  \ 开始并遵循算法：\n\n1. 从上一个版本信息开始：0:0:0。\n2. 0:0:0 变为 0:1:0（库的源代码发生了变化）。\n3. 0:1:0 变为\
  \ 1:0:0（库的接口被修改了）。\n4. 1:0:0 变为 1:0:1（添加了一个新函数）。\n5. 不适用（没有删除任何内容）。\n\n这次，我们得到了\
  \ Libtool 版本字符串 1:0:1，但生成的 Linux 或 Solaris 共享库文件名为 `lib`name.*so.0.1.0*。考虑一下，在主版本、次版本和补丁级别值面前，拥有非零的\
  \ `age` 值意味着什么。`age` 值为 1（如本例所示）意味着我们仍然支持主值为 0，因为该库的新版本与上一个版本兼容。共享库文件名中的次版本值从 0\
  \ 增加到 1，表示这是 `lib`name.*so.0* 的更新版本。补丁级别值保持为 0，因为该值表示特定修订版本的错误修复。\n\n一旦完全理解了 Libtool\
  \ 版本控制，你会发现即使是这种算法也没有涵盖所有的接口修改场景。例如，考虑你维护的一个共享库的版本信息为 0:0:0。现在假设你在下一次公发布中向接口添加了一个新函数。这第二次发布正确定义了\
  \ 1:0:1 的版本信息，因为该库同时支持接口版本 0 和 1。然而，在库的第三次发布之前，你意识到实际上并不需要那个新函数，所以你将其删除了。这是本次发布中对库接口进行的唯一可见的更改。算法本会将版本信息设置为\
  \ 2:0:0。但实际上，你只是删除了第二个接口，现在再次呈现原始接口。从技术上讲，该库将被正确配置为 0:1:0 版本信息字符串，因为它呈现了共享库接口版本\
  \ 0 的第二次发布。这个故事的寓意是，你需要完全理解 Libtool 版本控制的工作原理，然后根据这种理解来决定正确的下一个版本值应该是多少。\n\n\n\n\
  \n\n这类对库接口的更改非常复杂，以至于项目维护者往往会直接重命名库，从而完全规避库的版本问题。重命名库的一种极佳方法是使用 `Libtool` 的 `-release`\
  \ 标志。该标志会将一组独立的库版本信息添加到库的基本名称中，从操作系统加载器的角度来看，这实际上实际上是使其变成了一个完全全新的库。`-release` 标志的使用方式如\
  \ Listing 8-2 所示。\n\n```\nlibname_la_LDFLAGS = -release 2.9.0 -version-info 0:0:0\n\
  ```\n\n*Listing 8-2：在 Makefile.am 文件中设置共享库的发布信息。*\n\n在这个示例中，我在同一组 `Libtool` 标志中同时使用了\
  \ `-release` 和 `-version-info`，只是为了向你展示它们可以一起使用。你会注意到，这里的发布字符串被指定为系列由点分隔的值。在这种情况下，你的\
  \ Linux 或 Solaris 共享库的最终名称将是 `libname-2.9.0.so.0.0.0`。\n\n开发者选择使用发布字符串的另一个原因是为了在跨平台的库版本之间提供某种关联。正如之前所示，特定的\
  \ `Libtool` 版本信息字符串可能会在不同平台上产生不同的库名称，因为 `Libtool` 在不同平台上将版本信息映射到库名称的方式不同。发布信息在跨平台时保持稳定，但你应该仔细考虑如何在你的共享库中使用发布字符串和版本信息，因为你选择使用它们的方式将影响库的不同发布版本之间的二进制兼容性。无论这些字符串的值如何，如果两个版本的库具有不同的发布字符串，OS\
  \ 加载器将认为它们是不兼容的。\n\n## 使用 libltdl\n\n现在让我们来讨论 `Libtool` 的 `ltdl` 库。再次，我们需要为 `jupiter`\
  \ 项目添加一些功能，以说明这些概念。这里的目标是创建一个插件接口，`jupiter` 程序可以使用该接口根据终端用户的策略选择来修改输出。\n\n### 必要的结构\n\
  \n目前，`jupiter` 打印 *Hello from jupiter!*（实际上，此时打印出的名称更有可能是一个长而丑陋的路径，包含一些 Libtool\
  \ 目录垃圾和 `jupiter` 名称的某些变体，但现在假装它打印的是 `jupiter`。）我们要在 `common` 静态库方法 `print_routine`\
  \ 中添加一个名为 `salutation` 的额外参数。该参数也是字符指针类型，并将包含 `jupiter` 问候语中开头的单词或短语——即问候语。\n\n\
  Listing 8-3 和 8-4 指明了我们需要对 `common` 子目录下的文件进行的更改。\n\nGit tag 8.0\n\n```\n--snip--\n\
  \nstatic void * print_it(void * data)\n\n{\n\n    const char ** strings = data;\n\
  \n    printf(\"%s from %s!\\n\", strings[0], strings[1]);\n\n    return 0;\n}\n\n\
  int print_routine(const char * salutation, const char * name)\n\n{\n\n    const\
  \ char * strings[] = {salutation, name};\n\n#if ASYNC_EXEC\n\n    pthread_t tid;\n\
  \n    pthread_create(&tid, 0, print_it, strings);\n\n    pthread_join(tid, 0);\n\
  \n#else\n\n    print_it(strings);\n\n#endif\n\n    return 0;\n}\n```\n*Listing 8-3：common/print.c：在\
  \ print_routine 函数中添加问候语**\n\n```\nint print_routine(const char * salutation, const\
  \ char * name);\n```\n*Listing 8-4：common/jupcommon.h：在 print_routine 原型中添加问候语**\n\
  \nListing 8-5 和 8-6 显示了我们需要对 `libjup` 和 `include` 子目录下的文件进行的更改。\n\n```\n--snip--\n\
  \nint jupiter_print(const char * salutation, const char * name)\n\n{\n\n    print_routine(salutation,\
  \ name);\n\n}\n```\n*Listing 8-5：libjup/jup_print.c：在 jupiter_print 函数中添加问候语**\n\
  \n```\n--snip--\n\nint jupiter_print(const char * salutation, const char * name);\n\
  \n--snip--\n```\n*Listing 8-6：include/libjupiter.h：在 jupiter_print 原型中添加问候语**\n\n\
