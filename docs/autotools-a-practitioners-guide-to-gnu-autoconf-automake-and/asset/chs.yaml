  \ = checkdb.cpp\n\n   xflmrebuild_SOURCES = rebuild.cpp\n\n   xflmview_SOURCES =\
  \ \\\n    viewblk.cpp \\\n    view.cpp \\\n    --snip--\n\n    viewmenu.cpp \\\n\
  \    viewsrch.cpp\n\n   xflmdbshell_SOURCES = \\\n    domedit.h \\\n    fdomedt.cpp\
