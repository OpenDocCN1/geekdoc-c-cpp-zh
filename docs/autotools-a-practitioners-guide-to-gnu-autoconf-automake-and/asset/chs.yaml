  \ 项目 12：注意那些制表符！\n\n当我被要求对一本关于 Autotools 的书籍进行技术评审时，我相当怀疑。已经有几个在线教程和几本书向读者介绍了 GNU\
  \ `Autoconf`、`Automake` 和 `Libtool` 的用法。然而，其中许多文本在至少某些方面并不理想理想：它们要么是几年前编写的并开始显得过时，要么包含一些不准确之处，或者对于典型的初学者任务来说往往不完整。另一方面，这些程序的\
  \ GNU 手册非常庞大且技术性很强，因此可能会为学习 Autotools 带来巨大的准入门槛。\n\n**德国，波恩**\n\n**Eric Blake**\n\
  \n在过去的十年里，我经常在想，为什么我发现的唯一一本关于 GNU Autotools 的第三方书籍是 Gary Vaughan、Ben Elliston、Tom\
  \ Tromey 和 Ian Lance Taylor 写的 *GNU* *AUTOCONF*、*AUTOMAKE* 和 *LIBTOOL*，这本书被社区亲切地称为“山羊书”（*The\
  \ Goat Book*，名字是因为封面——一张山羊在做杂技动作的老式照片）。\n出版商曾告诉我，这种书根本没有市场。事实上，一位编辑曾告诉我，几年前他自己也尝试过说作者们写这本书，但失败了。他的作者们没有完成项目，而且出版商的市场分析显示，人们对这本书的兴趣非常小。出版商认为开源软件开发者倾向于鄙视书面文档。也许他们是对的。有趣的是，关于\
  \ Perl 这类 IT 工具的书籍卖得像 Perl 已经过时了一样——这在如今某种程度上是事实——但人们购买 Perl 书籍的数量仍然足以让他们的出版商感到满意。这一切解释了为什么为什么书架上有十本封面画着动物的\
  \ Perl 书籍，但针对开源软件开发者的书籍却几乎什么都没有。\n\n在 20 世纪 90 年代初，我在杨百大学攻读计算机科学学位的最后阶段。我上了一门高级计算机图形学课程，在那里我接触了\
  \ `C++` 和面向对象的编程范式。在接下来的几年里，我对 `C++` 产生了一种爱恨交织感情。那时我已经是一个相当不错的 `C` 语言程序员了，我认为我可以很容易地学会\
  \ `C++`，因为它的语法与 `C` 非常相似。我错得离谱！我与 `C++` 编译器的斗争次数比我愿意回忆的还要多。\n\n大多数包都是使用 `make` 工具构建的。输入\
  \ `make` 非常容易，但并不是问题。问题出现在由于用户系统和开发者系统之间某些意料之外的差异导致包构建失败时。于是，无处不在的 `configure` 脚本诞生了——它最初是一个简单的\
  \ shell 脚本，用于配置终端用户的环境，以便 `make` 能够在用户系统上成功找到所需的外部资源。手工编写的配置脚本很有帮助，但它们并不是最终答案。它们解决了约\
  \ 65% 由系统配置差异引起的问题——但要正确编写和维护它们简直是痛苦的。在多年里，人们进行了数十次迭代修改，直到该脚本在大多数人们关心的系统上正常运行。但整个过程显然需要升级。\n\
  \n此外，我想感谢 GNU Autotools 的作者和维护者。特别是 Ralf Wildenhues，他如此相信这个项目，以至于花费了数百小时个人时间进行技术评审。他的意见和见解对于将这本书从单纯的设想变为准确且实用的文本是无价的。\n\
  \n我还想感谢 Tony Mobily，他是 `Free Software Magazine` 的编辑总监。Tony 给了我第一次发表这些材料的机会。没有他的指导和方向，我永远不会将这个项目落实成纸质格式。我本应该在本书的第一版中就表达谢意，但令我非常尴尬的是，它被遗漏了。\n\
  \n**2019 年 9 月**\n\n### 谁应该读这本书\n\n`第 2 章`开始讨论软件开发者感兴趣的概念。它概述了被认为 `GNU Autotools`\
  \ 一部分的软件包的概况。本章描述了这些软件包之间的交互，以及每个软件包消耗和生成的文件。在每个情况下，图表描述了数据从手工编写输入到最终输出文件的流。\n\n\
  `第 6 章`从将 Jupiter 项目的 `Makefile.in` 模板转换为 Automake `Makefile.am` 文件开始。在这里，你会发现 Automake\
  \ 之于 makefiles 就像 Autoconf 之于配置脚本一样。本章以一种方式介绍了 Automake 的主要功能，使其在 Automake 新版本发布时不会过时。\n\
  \n第 10 章 讨论了查找编译时和链接时依赖的概念，以及在构建工具命令行中添加适当的引用用的。具体而言，本章引入了 `pkg-config`，它已成为 Linux\
  \ 软件开发的行业标准，为轻松查找和使用你的包所依赖的组件提供了框架。本章将向你展示如何使用 `pkg-config` *.pc* 文件来查找依赖项，以及如何通过为项目提供\
  \ `*.pc` 文件在沙盒环境中良好运行。\n\n第 17 章 讨论了使用 Autotools 构建设计在 Microsoft Windows 平台上运行的软件。将向你展示如何在\
  \ Linux 上为 Windows 进行交叉编译，以及如何安装和使用三个流行的基于 Windows 的 POSIX 平台——Cygwin、Msys2 和 MinGW——使用\
  \ GNU 工具（包括 Autotools）构建 Windows 软件。\n\n第 3 章 到 第 9 章 围绕 Jupiter 项目构建。第 14 章 和 第\
  \ 15 章 涵盖 FLAIM 项目。第 11 章 和 第 12 章 涵盖 gettext 项目，第 13 章](#ch13.xhtml) 涵盖 b64 项目。这些项目可以在\
  \ GitHub NSP-Autotools 站点找到，地址为 *[`github.com/NSP-Autotools`](https://github.com/NSP-Autotools)*。\n\
  \n本书包含数百个程序列表，大致分为两类：控制台示例和文件列表。控制台示例没有标题，用户输入部分采用**粗体**。\n$ alias\n\n\n对于与 Jupiter\
  \ 和 FLAIM 项目相关的列表，标题首先指定文件相对于项目根目录路径，然后对列表中的更改进行描述。\n\n\n![Image](img/common.jpg)\n\
  \n\n\nGit tag 3.5\n\n```\n--snip--\n\ndistcheck: $(distdir).tar.gz\n\n        gzip\
  \ -cd $(distdir).tar.gz | tar xvf -\n\n        cd $(distdir) && $(MAKE) all\n\n\
  \        cd $(distdir) && $(MAKE) clean\n\n        rm -rf $(distdir)\n\n       \
  \ @echo \"*** Package $(distdir).tar.gz is ready for distribution.\"\n\n--snip--\n\
  ```\n\n*Listing 3-18:* Makefile: 将 check 目标添加到 MAKE 命令\n\n### 安装产品\n\n我们已经达到了这种程度，对于构建项目来说，用户的体验应该是轻松的——甚至是愉快的。用户只需解压\
  \ tar 包，进入发行目录，然后输入 `make`。真的没有比这更简单的了。\n\n但我们仍然缺少一个功能——安装。对于 Jupiter 项目来说，这相当简单。只有一个程序，大多数用户会猜到为了安装它，应该将\
  \ `jupiter` 拷贝到 `/usr/bin` 或 `/usr/local/bin` 目录。然而，更复杂的项目可能会用户对放置二进制文件、库文件、头文件以及包括手册页（man\
  \ pages）、信息页（info pages）、PDF 文件以及通常与 GNU 项目关联的 `README`、`AUTHORS`、`NEWS`、`INSTALL`\
  \ 和 `COPYING` 文件感到困惑。\n\n我们不想让用户自己想这些，所以我们将创建一个 `install` 目标来管理构建后的放置位置。事实上，创建发行包可能不是一个固有的递归过程，但安装无疑是，因此我们将允许项目中的每个子目录管理自身组件的安装。为了做到这一点，我们需要修改顶层和\
  \ `src` 目录的 Makefile。修改顶层 Makefile 很容易：因为顶层目录下没有需要安装的产品，我们将按照通常的方式将责任传递给 `src/Makefile`。\n\
  \n\n\n\n```\n--snip--\n\ncheck: all\n\n        ./src/jupiter | grep \"Hello from\
  \ .*jupiter!\"\n\n        @echo \"*** All TESTS PASSED\"\n\ninstall:\n\n       \
  \ cp jupiter /usr/bin\n\n        chown root:root /usr/bin/jupiter\n\n        chmod\
  \ +x /usr/bin/jupiter\n\n--snip--\n\n.PHONY: all clean check install\n```\n\n*列表\
  \ 3-20:* `src/Makefile`: *实现 install 目标*\n\n在列表 3-19 所示的顶层 makefile 中，我将 `install`\
  \ 添加到了传递给 `src/Makefile` 的目标列表中。文件的安装由列表 3-20 所示的 `src` 级 makefile 处理。\n\n安装过程比简单的复制文件要复杂一点。如果文件被放在\
  \ `/usr/bin` 目录下，那么 `root` 应该拥有它，这样只有 `root` 才能删除或修改它。此外，`jupiter` 二进制文件应该被标记为可执行，因此我使用了\
  \ `chmod` 命令将文件模式设置为可执行。这可能是多余的，因为链接器确保了 `jupiter` 被创建为一个可执行文件，但某些类型的可执行产物并不是由链接器生成的——例如\
  \ shell 脚本。\n\n现在我们的用户只需要输入以下系列命令，Jupiter 项目就会在他们的平台上被构建、测试和安装，并带有正确的系统属性和所有权：\n\
  \n```\n$ gzip -cd jupiter-1.0.tar.gz | tar xf -\n\n$ cd jupiter-1.0\n\n$ make all\
  \ check\n\n--snip--\n\n$ sudo make install\n\nPassword: ******\n\n--snip--\n\n$\n\
  ```\n\n### 安装选择\n\n所有这些都很好，但在安装位置方面可以更灵活一些。某些用户可能对将 `jupiter` 安装到 `/usr/bin` 目录觉得可以。而另一些用户会问为什么不把它安装到\
  \ `/usr/local/bin` 目录——毕竟这是一种常见的惯例。我们可以将目标目录改为 `/usr/local/bin`，但这样用户可能会问为什么他们没有安装到自己主目录的选项。这正是引入一点命令行支持的灵活性的完美时机。\n\
  \n我们当前构建系统的另一个问题是，为了安装文件我们必须做很多工作。大多数 Unix 系统都提供了一个系统级程序（有时仅仅是一个 shell 脚本），称为 `install`，它允许用户指定正在安装文件的各种属性。正确使用该工具可以稍微简化\
  \ Jupiter 的安装工作，因此在我们在添加位置灵活性的同时，或许顺便也使用 `install` 工具。这些修改在列表 3-21 和 3-22 中。\n\n\
  Git tag 3.7\n\n```\n package = jupiter\n\n   version = 1.0\n\n   tarname = $(package)\n\
  \n   distdir = $(tarname)-$(version)\n\n   prefix=/usr/local\n\n➊ export prefix\n\
  \n   all clean check install jupiter:\n\n           cd src && $(MAKE) $@\n\n--snip--\n\
  ```\n*列表 3-21: Makefile: 添加 prefix 变量*\n\n```\n--snip--\n\ninstall:\n\n     ➋ install\
  \ -d $(prefix)/bin\n\n        install -m 0755 jupiter $(prefix)/bin\n\n--snip--\n\
  ```\n*列表 3-22:* `src/Makefile`: *在 install 目标中使用 prefix 变量*\n\n注意，我只在顶层 makefile\
  \ 中声明并赋值了 `prefix` 变量，但在 `src/Makefile` 中引用了它。我可以这样做是因为我在顶层 makefile 的 ➊ 处使用了 `export`\
  \ 修饰符——该修饰符将变量导出到 make 在 `src` 目录执行自身时生成的 shell 中。make 的这一功能允许我们在一个显眼的位置定义所有的用户变量——即顶层\
  \ makefile 的开头。\n\n**注意**\n\nGNU `make` 允许你在赋值行使用 `export` 关键字，但这种语法在 GNU `make`\
  \ 和其他版本的 `make` 之间并不移植。从技术上讲，POSIX 完全不支持使用 `export`，但大多数 `make` 实现都支持它。\n\n我现在将\
  \ `prefix` 变量声明为 `/usr/local`，这对于那些想要将 `jupiter` 安装在 `/usr/local/bin` 的人来说非常棒，但对于那些希望它在\
  \ `/usr/bin` 的人来说并不好。幸运的是，make 允许你以这种方式在命令行上定义 make 变量：\n\n```\n$ sudo make prefix=/usr\
  \ install\n\n--snip--\n```\n\n记住，命令行上定义的变量会覆盖 makefile 内部定义的变量（(22)）。因此，想要将 `jupiter`\
  \ 安装到 `/usr/bin` 目录的用户现在有了在 make 命令行指定此项的选项。\n\n有了这个系统，我们的用户可以将 `jupiter` 安装到他们选择的任何目录下的\
  \ `bin` 目录，包括他们主目录中的某个位置（对于那里不需要额外的权限）。这实际上是我们在列表 3-22 的 ➋ 处添加 `install -d $(prefix)/bin`\
  \ 命令的原因——该命令会在安装目录不存在时创建它。由于我们允许在命令行上定义 `prefix`，我们实际上不知道该位置是否存在（(23)）。\n\n```\n\
  $ make all\n\n$ make prefix=$usr install\n\n--snip--\n\n$ ls -1p\n\ninst/\n\n$ ls\
  \ -1p\n\nbin/\n\njupiter\n\n$\n\n### 卸载软件包\n\n如果用户不喜欢我们的软件包并想把它从系统中删除呢？这对于 Jupiter\
  \ 来说是一个常见的场景，因为它占用了 `bin` 目录。对于你的项目，列表 3-23 和 3-24 显示在两个 makefile 中增加了 uninstall\
  \ 目标。\n\nGit tag 3.8\n\n```\n--snip--\n\nall clean check install jupiter:\n\n  \
  \      cd src && $(MAKE) $@\n\n--snip--\n\n.PHONY: FORCE all clean check dist\n\
  ```\n*列表 3-23: Makefile: 在顶层 makefile 中添加 uninstall 目标*\n\n```\n--snip--\n\ninstall:\n\
  \n        install -d $(prefix)/bin\n\n        install -m 0755 jupiter $(prefix)/bin\n\
  \nuninstall:\n\n        rm -f $(prefix)/jupiter\n\n        -rmdir $(prefix)/bin\
  \ >/dev/null 2>&1\n\n--snip--\n\n.PHONY: all clean check install\n```\n*列表 3-24:*\
  \ `src/Makefile`: *在 src 级 makefile 中添加 uninstall 目标*\n\n与安装目标一样，该目标在用户使用系统前缀（如\
  \ `/usr` 或 `/usr/local`）时需要 root 级权限。在编写卸载目标时要非常小心；除非某个目录专门属于你的软件包，否则你不假设它是你创建的。如果你这样做了，你可能会删掉像\
  \ `/usr/bin` 这样的系统目录！\n\n另一方面，我们在安装目标中确实在目录不存在时创建了它，所以如果可能应该删除它。在这里，我们可以使用 `rmdir`\
  \ 命令，它的工作是删除空目录。即使该目录是系统目录如 `/usr/bin`，如果它是空的，删除它是安全的，但如果它不是，`rmdir` 将失败。考虑到命令失败会停止\
  \ make 进程，我们会在它前面加上一个连字符。而且我们并不不想看到这样的失败，所以我们将将其输出重定向到 `/dev/null`。\n\n\n\n\n我们在构建系统中需要维护的项列表正变得越来越难以控制。现在，当我们更改安装流程时，需要更新两个地方：`install`\
  \ 和 `uninstall` 目标。不幸的是，在我们编写自己的 Makefile 时，这已经是我们能期待的最优结果了，除非我们诉诸于复杂的 shell 脚本命令。但请坚持——在第\
  \ 6 章中，我将向你展示如何使用 GNU Automake 以更简单的方式重写这个 Makefile。\n\n### 测试 install 和 uninstall\n\
  \n现在，让我们为 `distcheck` 目标添加一些代码，以测试 `install` 和 `uninstall` 目标的功能。毕竟，这两个目标从我们的分发\
  \ tar 包中能够正常工作是非常重要的，因此在宣布 tar 包具有发布价值之前，我们应该在 `distcheck` 中测试它们。列表 3-25 展示了顶层 Makefile\
  \ 所需的更改。\n\nGit tag 3.9\n\n```\n--snip--\n\ndistcheck: $(distdir).tar.gz\n\n   \
  \     gzip -cd $(distdir).tar.gz | tar xvf -\n\n        cd $(distdir) && $(MAKE)\
  \ all\n\n        cd $(distdir) && $(MAKE) check\n\n        cd $(distdir) && $(MAKE)\
  \ prefix=$${PWD}/_inst install\n\n        cd $(distdir) && $(MAKE) prefix=$${PWD}/_inst\
  \ uninstall\n\n        cd $(distdir) && $(MAKE) clean\n\n        rm -rf $(distdir)\n\
  \n        @echo \"*** Package $(distdir).tar.gz is ready for distribution.\"\n\n\
  --snip--\n```\n\n*列表 3-25：Makefile：*为 install 和 uninstall 目标添加 distcheck 测试*\n\n\
  注意，我在 `$${PWD}` 变量引用上使用了双美元符号，以确保 make 将变量引用与命令行行的其余部分一起传递给 shell，而不是在执行命令之前内联展开它。我希望这个变量由\
  \ shell 进行解引用，而不是由 make 工具进行。^(24)\n\n我们在这里所做的测试是为了确保 `install` 和 `uninstall` 目标不会产生错误——但这不太可能，因为它们所做的只是文件安装到构建目录内的临时目录中。我们可以在\
  \ `make install` 命令之后立即添加一些代码来查找本应安装的产品，但这超出了我愿意做的范围。你会达到一个收益递减的平衡点，即执行检查的代码与安装代码一样复杂——在这种情况下，检查就变得毫无意义。\n\
  \n但我们还有其他可以做的事：我们可以编写一个大致通用的测试，来检查我们安装的所有内容是否都已正确删除。由于在安装之前阶段目录是空的，那么在卸载之后，它最好也处于类似的状态。列表\
  \ 3-26 显示了该测试的添加。\n\nGit tag 3.10\n\n```\n--snip--\n\ndistcheck: $(distdir).tar.gz\n\
  \n        gzip -cd $(distdir).tar.gz | tar xvf -\n\n        cd $(distdir) && $(MAKE)\
  \ all\n\n        cd $(distdir) && $(MAKE) check\n\n        cd $(distdir) && $(MAKE)\
  \ prefix=$${PWD}/_inst install\n\n        cd $(distdir) && $(MAKE) prefix=$${PWD}/_inst\
  \ uninstall\n\n     ➊ @remaining=\"`find $(distdir)/_inst -type f | wc -l`\"; \\\
  \n\n        if test \"$${remaining}\" -ne 0; then \\\n\n        ➋ echo \"*** $${remaining}\
  \ file(s) remaining in stage directory!\"; \\\n           exit 1; \\\n\n       \
  \ fi\n\n        cd $(distdir) && $(MAKE) clean\n\n        rm -rf $(distdir)\n\n\
  \        @echo \"*** Package $(distdir).tar.gz is ready for distribution.\"\n\n\
  --snip--\n```\n\n*列表 3-26：Makefile：*为卸载完成后的残留文件添加测试*\n\n该测试首先在 ➊ 处在一个名为 `remaining`\
  \ 的 shell 变量中生成一个数值，它代表我们使用的阶段目录中找到的普通文件数量。如果这个数字不为零，测试将在 ➋ 处向控制台打印消息，指示 `uninstall`\
  \ 命令留下了多少文件，然后带错误退出。提前退出会保持阶段目录完好，以便我们检查它并找到我们忘记卸载的哪些文件。\n\n**注意**\n\n*这段测试代码代表了将多个\
  \ shell 命令传递给单个 shell 的良好用例。我在这里必须这样做是为了确保 `remaining` 的值可以供 `if` 语句使用。当结束的 `if`\
  \ 不是由执行起始的 `if` 的同一个 shell 执行时，条件判断的工作效果并不好！*\n\n我不想在真的应该执行时通过打印嵌入的 `echo` 语句来惊运行，因此我在整个测试前加上了\
  \ 符号（`@`），这样 make 就不会将代码打印到 stdout。由于 make 将这五行代码视为单个命令，抑制 `echo` 语句打印的方法只有抑制整个命令的打印。\n\
  \n现在这个测试并不完美——完全不是。这段代码只检查普通文件。如果你的安装过程创建了任何软链接，这个测试将注意它们是否被遗留。安装期间构建的目录结构被特意保留在那里，因为检查代码不知道阶段目录内的子目录属于系统还是属于项目。`uninstall`\
  \ 规则的命令可以识别哪些目录是项目特定的并正确地删除它们，但我不想将项目特定的知识添加到 distcheck 测试中。\n\n### 文件系统标准\n\n到这里你可能在想我是从哪里得到这些名字的。如果某些\
  \ Unix 不使用 `/usr` 或 `/usr/local` 呢？首先，这是提供 `prefix` 变量的另一个原因——允许用户有一定的选择余。然而，如今大多数\
  \ Unix 类系统都尽可能地遵循*文件系统标准 (FHS)*。*FHS* 定义了许多标准位置，包括以下根级目录：\n\n| `/bin` | `/etc` |\
  \ `/home` |\n| `/opt` | `/sbin` | `/srv` |\n| `/tmp` | `/usr` | `/var` |\n\n这个列表绝不是详尽的。我只提到了与我们研究开源项目构建系统相关的目录。此外，*FHS*\
  \ 还定义了这些根级目录下的几个标准位置。例如，`/usr` 目录应该包含以下子目录：\n\n| `/usr/bin` | `/usr/include` | `/usr/lib`\
  \ |\n| `/usr/local` | `/usr/sbin` | `/usr/share` |\n| `/usr/src` | | |\n\n`/usr/local`\
  \ 目录应该包含与 `/usr` 目录非常类似的结构。`/usr/local` 目录提供了一个安装位置用于覆盖 `/usr` 目录结构中安装的相同软件包，因为系统软件更新通常会无区别地覆盖\
  \ `/usr` 中的软件。`/usr/local` 目录结构允许系统管理员决定在系统上使用哪个版本的软件包，因为 `/usr/local/bin` 可能会（且通常是）在\
  \ `/usr/bin` 之前添加到 `PATH` 中。设计 *FHS* 投入了大量的思考，而 GNU Autotools 充分利用了这种共识理解。\n\n*FHS*\
  \ 不仅定义了这些标准位置，还详细解释了它们的用途以及应该在其中存放什么类型的文件。总而言之，*FHS* 为你作为项目维护者留存了足够的活性和选择，让你的生活保持有趣，但又不至于让你怀疑自己是否将文件安装在了正确的位置。^(25)\n\
  \n### 支持标准目标和变量\n\n除了我已经提到的之外，*GNU 编码标准*还列了一些你应该在项目中支持的重要目标和变量——主要是因为你的用户会期望获得这些支持。\n\
  \n\n\n\n`GCS` 文档中的某些章节需要批判性地看待（除非你正在开发一个 GNU 赞助的项目）。例如，你可能并不在乎 `GCS` 第 5 章中关于 C\
  \ 源代码格式的建议。你的用户显然不在乎，所以你可以使用任何你喜欢的源代码格式风格。\n\n这并不是说第 5 章的所有内容对非 GNU 开源项目都一无用处。例如，“系统类型之间的可移植性”和“CPU\
  \ 之间的可移植性”小节为 C 源代码的可移植性提供了极佳的信息。此外，“国际化”小节也提供了一些关于使用 GNU 软件进行项目国际化的有用提示。我们将在本书的第\
  \ 11 章中详细讨论国际化。\n\n虽然 `GCS` 的第 6 章讨论了 GNU 风格的文档，但第 6 章的某些部分描述了项目中常见的各种顶级文本文件，例如\
  \ `AUTHORS`、`NEWS`、`INSTALL`、`README` 和 `ChangeLog` 文件。这些都是受良好良好的开源软件用户期望在任何知名项目中看到的信息。\n\
  \n`GCS` 文档中*真正*有用的信息从第 7 章“发布过程”开始。对于作为项目维护者的你来说，这一章非常关键，因为它定义了用户对你项目构建系统的预期。第 7\
  \ 章包含了软件包在源码级分发中提供的用户选项的事实标准。\n\n## 标准目标\n\n`GCS` 第 7 章的“配置应该如何工作”小节定义了配置过程，我在第\
  \ 77 页的“配置你的包”中简要介绍了这一内容。`GCS` 的“Makefile 约定”小节涵盖了用户在开源软件软件包中预期的所有标准目标和许多标准变量。`GCS`\
  \ 定义的标准目标包括：\n\n| all | install | install-html |\n| :--- | :--- | :--- |\n| install-dvi\
  \ | install-pdf | install-ps |\n| install-strip | uninstall | clean |\n| distclean\
  \ | mostlyclean | maintainer-clean |\n| TAGS | info | dvi |\n| html | pdf | ps |\n\
  | dist | check | installcheck |\n| installdirs | | |\n\n你不需要支持所有的目标，但你应该考虑支持对你的项目有意义的目标。例如，如果你构建并安装\
  \ HTML 页面，你可能应该考虑支持 `html` 和 `install-html` 目标。Autotools 项目支持这些及更多目标。某些目标对终端用户有用，而另一些则仅对项目维护者有用。\n\
  \n## 标准变量\n\n你应该根据需要支持的变量包括下表列出的变量。为了给终端用户提供灵活性，这些变量大部分是基于其中几个变量定义的，并且最终只取决于一个变量：`prefix`。由于缺乏更标准的名称，我将这些称为*前缀变量*。这些变量大部分可以被归类为指向标准位置的*安装目录变量*，但也有少数例外，例如\
  \ `srcdir`。\n\n这些变量旨在由 make 完全解析，因此它们是基于 make 变量定义的，使用圆括号而不是大括号。表 3-1 列出了这些前缀变量及其默认值。\n\
  \n**表 3-1：** 前缀变量及其默认值\n\n| **变量** | **默认值** |\n| :--- | :--- |\n| `prefix` | `/usr/local`\
  \ |\n| `exec_prefix` | `$(prefix)` |\n| `bindir` | `$(exec_prefix)/bin` |\n| `sbindir`\
  \ | `$(exec_prefix)/sbin` |\n| `libexecdir` | `$(exec_prefix)/libexec` |\n| `datarootdir`\
  \ | `$(prefix)/share` |\n| `datadir` | `$(datarootdir)` |\n| `sysconfdir` | `$(prefix)/etc`\
  \ |\n| `sharedstatedir` | `$(prefix)/com` |\n| `localstatedir` | `$(prefix)/var`\
  \ |\n| `includedir` | `$(prefix)/include` |\n| `oldincludedir` | `/usr/include`\
  \ |\n| `docdir` | `$(datarootdir)/doc/$(package)` |\n| `infodir` | `$(datarootdir)/info`\
  \ |\n| `htmldir` | `$(docdir)` |\n| dvidir | `$(docdir)` |\n| pdfdir | `$(docdir)`\
  \ |\n| psdir | `$(docdir)` |\n| libdir | `$(exec_prefix)/lib` |\n| lispdir | `$(datarootdir)/emacs/site-lisp`\
  \ |\n| localedir | `$(datarootdir)/locale` |\n| mandir | `$(datarootdir)/man` |\n\
  | man*N*dir | `$(mandir)/man*N* (*N* = 1..9)` |\n| manext | `.1` |\n| man*N*ext\
  \ | `.*N* (*N* = 1..9)` |\n| `srcdir` | 源码树对应的目录 |\n| Autotools 项目支持这些及更多变量，基于 Autotools\
  \ 的项目支持这些，根据需要。 |\n| man*N*dir | `$(mandir)/man*N* (*N* = 1..9)` |\n| manext | `.1`\
  \ |\n| man*N*ext | `.*N* (*N* = 1..9)` |\n\n*(注：由于原文文本在表格部分存在排版错乱，翻译时已根据逻辑进行了对齐和修正)*\n\
  \n**修正后的表格内容对应：**\n\n| **变量** | **默认值** |\n| :--- | :--- |\n| `prefix` | `/usr/local`\
  \ |\n| `exec_prefix` | `$(prefix)` |\n| `bindir` | `$(exec_prefix)/bin` |\n| `sbindir`\
  \ | `$(exec_prefix)/sbin` |\n| `libexecdir` | `$(exec_prefix)/libexec` |\n| `datarootdir`\
  \ | `$(prefix)/share` |\n| `datadir` | `$(datarootdir)` |\n| `sysconfdir` | `$(prefix)/etc`\
  \ |\n| `sharedstatedir` | `$(prefix)/com` |\n| `localstatedir` | `$(prefix)/var`\
  \ |\n| `includedir` | `$(prefix)/include` |\n| `oldincludedir` | `/usr/include`\
  \ |\n| `docdir` | `$(datarootdir)/doc/$(package)` |\n| `infodir` | `$(datarootdir)/info`\
  \ |\n| `htmldir` | `$(docdir)` |\n| `dvidir` | `$(docdir)` |\n| `pdfdir` | `$(docdir)`\
  \ |\n| `psdir` | `$(docdir)` |\n| `libdir` | `$(exec_prefix)/lib` |\n| `lispdir`\
  \ | `$(datarootdir)/emacs/site-lisp` |\n| `localedir` | `$(datarootdir)/locale`\
  \ |\n| `mandir` | `$(datarootdir)/man` |\n| `man*N*dir` | `$(mandir)/man*N* (*N*\
  \ = 1..9)` |\n| `manext` | `.1` |\n| `man*N*ext` | `.*N* (*N* = 1..9)` |\n| `srcdir`\
  \ | 源码树对应的目录 |\n\n即使我们只在 *Makefile* 中使用 `bindir`，我们也必须导出 `prefix`、`exec_prefix`\
  \ 和 `bindir`，因为 `bindir` 是基于 `exec_prefix` 定义的，而 `exec_prefix` 又是基于 `prefix` 定义的。当\
  \ make 运行命令时，它首先将 `bindir` 解析为 `$(exec_prefix)`，然后解析为 `$(prefix)`，最后解析为 `/usr/local/bin`。\n\
  \n### 添加位置变量\n\n为了支持我们在 Jupiter 中目前使用的变量，我们需要添加 `bindir` 变量以及它依赖的任何变量——在这种情况下是 `exec_prefix`。列表\
  \ 27 和 28 显示了如何在 Makefile 中这样做。\n\n```\nprefix = /usr/local\nexec_prefix = $(prefix)\n\
  bindir = $(exec_prefix)/bin\n\nexport prefix\nexport exec_prefix\nexport bindir\n\
  ```\n\n*列表 27：* Makefile: 添加 bindir 变量\n\n```\ninstall:\n        install -d $(bindir)\n\
  \        install -m 0755 jupiter $(bindir)\n\nuninstall:\n        rm -f $(bindir)\n\
  \        -rmdir $(bindir) >/dev/null 2>&1\n```\n\n*列表 28：* src/Makefile: 添加 bindir\
  \ 变量\n\n即使我们只在 *src/Makefile* 中使用 `bindir`，我们也必须导出 `prefix`、`exec_prefix` 和 `bindir`，因为\
  \ `bindir` 是基于 `exec_prefix` 定义的，而 `exec_prefix` 又是基于 `prefix` 定义的。当 make 运行命令时，它首先将\
  \ `bindir` 解析为 `$(exec_prefix)`，然后解析为 `$(prefix)`，最后解析为 `/usr/local/bin`。\n\n##\
  \ 让你的项目进入 Linux 发行版\n\n当 Linux 发行版采用你的软件包进行分发时，你的项目神奇地从几十个用户的领域跃迁到数万用户的领域——几乎在一夜之间。有些人甚至在不知道的情况下在使用你的软件。由于开源软件对开发者的一个巨大价值是获得免费帮助改进你的软件，这可以被视为一件好事——社区规模的剧增。\n\
  \n\n\n\n\n通过在你的构建系统中遵循 `GCS`，你消除了将项目包含在 Linux 发行版中的许多障碍。如果你的 tar 包（tarball）遵循所有常规惯例，发行版打包人员将立即知道如何处理它。这些打包人员通常会根据所需的功能以及对你软件包的印象，来决定是否将其包含在他们版本的\
  \ Linux 发行版中。由于他们在这个过程中拥有相当大的权力，因此取悦他们是明智的。\n\n`GCS` 的第 7 节包含一个关于支持**分阶段安装（`staged\
  \ installations`）**的小节。在你的构建系统中支持这一概念很容易，但如果你忽略了这一支持，它几乎会给打包人员带来麻烦。\n\n诸如红帽软件包管理器（`RPM`）之类的打包系统接受一个或多个\
  \ tar 包、一组补丁文件和一个规范文件。所谓的 `spec file` 描述了为特定系统构建和打包项目的过程。此外，它还定义了所有安装到目标安装目录结构中的产品。软件包管理器软件使用这些信息将你的包安装到临时目录，然后从该目录提取指定的产品，并将它们存储在包安装程序（例如\
  \ `rpm`）可以理解的特殊二进制归档中。\n\n为了支持分阶段安装，你只需要一个名为 `DESTDIR` 的变量，它作为你所有安装产品的某种“超级前缀”。为了向你演示如何操作，我将为\
  \ Jupiter 项目添加分阶段安装支持。这非常简单，只需要对 `src/Makefile` 进行四处更改即可。所需的更改在 Listing 3-29 中突出显示。\n\
  \n```\n--snip--\n\ninstall:\n\n        install -d $(DESTDIR)$(bindir)\n\n      \
  \  install -m 0755 jupiter $(DESTDIR)$(bindir)\n\nuninstall:\n\n        rm -f $(DESTDIR)$(bindir)/jupiter\n\
  \n        -rmdir $(DESTDIR)$(bindir) >/dev/null 2>&1\n\n--snip--\n```\n*列表 3-29：`src/Makefile`:\
  \ 添加分阶段构建功能*\n\n如你所见，我在引用安装路径的 `install` 和 `uninstall` 目标中的 `$(bindir)` 引用添加了 `$(DESTDIR)`\
  \ 前缀。你不需要为 `DESTDIR` 定义默认值，因为当它未定义定义时，它会展开为空字符串，这对它所附加的路径没有影响。\n\n**注意**\n\n不要在\
  \ `$(DESTDIR)` 之后添加斜杠，因为它通常是空的。前缀变量最终会解析为以斜杠开头的内容；因此，在 `$(DESTDIR)` 之后添加斜杠是多余的，在某些情况下可能会导致意想不到的副作用。\n\
  \n出于软件包管理器的考虑，我不需要在 `uninstall` 规则的 `rm` 命令中添加 `$(DESTDIR)`，因为软件包管理器并不关心你的包是如何卸载的。它们只安装你的包，以便从阶段目录中复制产品。要卸载阶段目录，软件包管理器只需删除它。诸如\
  \ `rpm` 等软件包管理器程序使用它们自己的规则从系统中删除产品，这些规则基于软件包管理器数据库，而不是你的 `uninstall` 目标。\n\n然而，为了对称和完整性，在\
  \ `uninstall` 中添加 `$(DESTDIR)` 也没有坏处。此外，为了 `distcheck` 目标的完整性，我们需要包含它，我们现在将修改该目标以利用我们的分阶段安装功能。此修改在\
  \ Listing 3-30 中所示。\n\n```\n--snip--\n\ndistcheck: $(distdir).tar.gz\n\n       \
  \ gzip -cd $(distdir).tar.gz | tar xvf -\n\n        cd $(distdir) && $(MAKE) all\n\
  \n        cd $(distdir) && $(MAKE) check\n\n        cd $(distdir) && $(MAKE) DESTDIR=$${PWD}/inst\
  \ install\n\n        cd $(distdir) && $(MAKE) DESTDIR=$${PWD}/inst uninstall\n\n\
  \        @remaining=\"`find $(distdir)/inst -type f | wc -l`\"; \\\n\n        if\
  \ test \"$${remaining}\" -ne 0; then \\\n\n          echo \"*** $${remaining} file(s)\
  \ remaining in stage directory!\"; \\\n          exit 1; \\\n\n        fi\n\n  \
  \      cd $(distdir) && $(MAKE) clean\n\n        rm -rf $(distdir)\n\n        @echo\
  \ \"*** Package $(distdir).tar.gz is ready for distribution.\"\n\n--snip--\n```\n\
  *列表 3-30：`Makefile`: 在 `distcheck` 目标中使用 `DESTDIR`*\n\n在 `install` 和 `uninstall`\
  \ 命令中将前缀更改 `DESTDIR` 允许我们能够正确测试完整的安装目录层次结构，正如我们很快看到的那样。\n\n此时，一个 `RPM` spec 文件可以提供以下文本作为\
  \ Jupiter 包的安装命令：\n\n```\n%install\n\nmake prefix=/usr DESTDIR=%BUILDROOT install\n\
  ```\n\n不要担心软件包管理器的文件格式。相反，专注于通过 `DESTDIR` 变量提供分阶段安装功能即可。\n\n你可能在奇怪为什么前缀变量不能提供这种功能。其一在于，系统级安装中的每个路径并不是相对于前缀变量定义的。例如，系统配置目录（`sysconfdir`）通常由打包人员定义为\
  \ `/etc`。你可以在 Table 3-1 中看到 `sysconfdir` 的默认定义是 `$(prefix)*/etc*`，因此唯一的方法是让 `$(prefix)`\
  \ 设置。\n\n### 构建阶段. 安装前缀覆盖\n\n在此处，我想稍微离题，解释一个关于前缀和其他变量的晦涩（或至少是不直观）的概念。在之前的示例中，我们在\
  \ make 命令行使用了前缀覆盖，如下：\n\n```\nmake prefix=/usr install\n```\n\n我想解决的问题是：`make all`\
  \ 和 `make install` 之间的前缀覆盖有什么区别？在我们的小示例 Makefile 中，我们避免了在与安装相关的任何目标中使用前缀，所以你现在可能不清楚在构建阶段是否有用。然而，前缀变量在构建阶段非常有用，可以在编译时将路径替换到源代码中，如\
  \ Listing 3-31 所示。\n\n```\nprogram: main.c\n\n       gcc -DCFGDIR=\"$(sysconfdir)\"\
  \ -o $@ main.c\n```\n*列表 3-31：编译时替换路径*\n\n在这个示例中，我们在命令行上定义了一个名为 `CFGDIR` 的预处理器变量供\
  \ `main.c` 使用。可能 `main.c` 中会有类似 Listing 3-32 所示的代码：\n\n```c\n#ifndef CFGDIR\n\n\
  #define CFGDIR \"/etc\"\n\n#endif\n\nconst char *cfgdir = CFGDIR;\n```\n*列表 3-32：编译时替换\
  \ CFGDIR*\n\n在代码的后续部分，你可能会使用 C 全局变量 `cfgdir` 来访问应用程序的配置文件。\n\nLinux 发行版打包人员通常在 RPM\
  \ spec 文件的构建和安装命令行中使用不同的前缀覆盖。在构建阶段，实际的目录通过命令硬编码到执行文件中，例如 Listing 3-33 所示的 `./configure`\
  \ 命令。\n\n```\n%build\n\n%setup\n\n./configure prefix=/usr sysconfdir=/etc\n\nmake\n\
  ```\n*列表 3-33：RPM spec 文件中构建树的部分*\n\n注意，我们必须显式指定 `sysconfdir`，因为正如我之前提到的，系统配置目录通常位于在前缀目录结构之外。软件包管理器将这些可执行文件安装到阶段目录，以便在构建二进制安装包时从它们的安装位置中复制它们。相应的安装命令可能类似于\
  \ Listing 3-34 所示。\n\n\n\n\n\n```\n%install\n\nmake DESTDIR=%BUILDROOT% install\n\
  ```\n\n*列表 3-34：RPM spec 文件的安装部分*\n\n在安装期间使用 `DESTDIR` 会临时覆盖*所有*安装前缀变量，这样你就不需要记住在配置期间重写了哪些变量。在使用列表\
  \ 3-33 所示的配置命令时，按照列表 3-34 所示的方式使用 `DESTDIR`，其效果与列表 3-35 中所示的代码相同。\n\n```\n%install\n\
  \nmake prefix=%BUILDROOT%/usr sysconfdir=%BUILDROOT%/etc install\n```\n\n*列表 3-35：在安装期间覆盖默认的\
  \ sysconfdir*\n\n**警告**\n\n*这里的关键点是我之前提到过的一个。千万不要在你的 Makefile 中将你的 `install` 目标写为编译全部或甚至部分产品。如果可能，安装功能应该仅限于复制文件。否则，如果你的用户使用了前缀覆盖，他们将无法访问你分阶段的安装功能。*\n\
  \n以此方式限制安装功能的另一个原因是，它允许用户将一组包安装到隔离的位置，然后创建指向正确位置中实际文件的符号链接。某些人喜欢在测试包时这样做，并想跟踪其所有的组件。（26）\n\
  \n最后一点：如果你正在将内容安装到系统目录层次结构中，你将需要*root* 权限。人们经常这样运行 `make install`：\n\n```\n$ sudo\
  \ make install\n```\n\n如果你的 `install` 目标依赖于你的构建目标，而你忽略了预先构建它们，make 会乐意地在安装之前构建你的程序——但所有本地副本都将归*root*\
  \ 所有。这种不便可以通过让 `make install` 由于缺少可安装的内容而失败，而不是在以*root* 身份运行时直接跳到构建阶段，来轻易地规避。\n\n\
  ### 用户变量\n\n`GCS` 定义了一组对用户来说是神圣的变量。这些变量应该被 GNU 构建系统*引用*，但绝不能被 GNU 构建系统*修改*。这些所谓的*用户变量*包括表\
  \ 3-2 中列出的 C 和 C++ 程序变量。\n\n**表 3-2：**某些用户变量及其用途\n\n| 变量 | 用途 |\n| :--- | :--- |\n\
  | CC | 指向系统 C 编译器 |\n| CFLAGS | 期望的 C 编译器标志 |\n| CXX | 指向系统 C++ 编译器的 |\n| CXXFLAGS\
  \ | 期望的 C++ 编译器标志 |\n| LDFLAGS | 期望的链接器标志 |\n| CPPFLAGS | 期望的 C/C++ 预处理器标志 |\n|\
  \ *--snip--* |  |\n\n此列表并非详尽，而且有趣的是，在 `GCS` 中找不到详尽的列表。事实上，这些变量的大部分来自 `make` 工具本身的文档。这些变量用在\
  \ `make` 工具的内置规则中——它们某种程度上是硬编码在 `make` 中的，因此它们实际上是由 `make` 定义的。你可以在《GNU Make 手册》的“隐式规则使用的变量”部分找到一个相当完整的程序名和标志变量列表。\n\
  \n注意，`make` 会根据常见的 Unix 工具名称为这些变量中的许多分配默认值。例如，`CC` 的默认值 `cc`，这（至少在 Linux 系统上）是指向\
  \ GCC C 编译器 (`gcc`) 的软链接。在其他系统中，`cc` 是指向系统自带编译器的软链接。因此，我们不需要将 `CC` 设置为 `gcc`，这是好事，因为非\
  \ Linux 平台可能没有安装 GCC。有时你可能想在 `make` 命令行上设置 `CC`，例如在使用 `clang` 等替代编译器时，或者使用 `ccache`\
  \ 工具缓存 `gcc` 结果以加快重新编译时。\n\n对于我们的目的，表 3-2 中所示的变量已经足够了，但对于更复杂的 makefile，你应该熟悉《GNU\
  \ Make 手册》中概述的更长列表。\n\n为了在我们的 makefile 中使用这些变量，我们只需将 `gcc` 替换为 `$(CC)`。我们对 `CFLAGS`\
  \ 和 `CPPFLAGS` 也进行同样的操作，尽管 `CPPFLAGS` 默认为空。`CFLAGS` 变量也没有默认值，但现在是添加一个值的好时机。我喜欢使用\
  \ `-g` 来构建带符号的对象，并使用 `-O0` 禁用调试构建的优化。`src/Makefile` 的更新如列表 3-36 所示。\n\nGit tag 3.14\n\
  \n```\n4CFLAGS = -g -O0\n\n--snip--\n\njupiter: main.c\n\n        $(CC) $(CPPFLAGS)\
  \ $(CFLAGS) -o $@ main.c\n\n--snip--\n```\n\n*列表 3-36：*src/Makefile: *添加适当的用户变量*\n\
  \n这种方法之所以有效，是因为 `make` 工具允许通过命令行选项来覆盖此类变量。例如，若要切换编译器并设置某些编译器命令行选项，用户只需输入以下：\n\n\
  ```\n$ make CC=ccache CFLAGS='-g -O2' CPPFLAGS=-Dtest\n```\n\n在这种情况下，我们的用户决定使用 `ccache`\
  \ 而不是 `gcc`，生成符号并使用二级优化优化代码。他们还决定通过 C 预处理器定义启用 test 选项。注意，这种 Bourne shell 语法是无效的：\n\
  \n```\n$ CC=ccache CFLAGS='-g -O2' CPPFLAGS=-Dtest make\n```\n\n原因在于我们仅仅在环境中设置了变量。记住，环境变量不会自动覆盖\
  \ makefile 中的变量。为了获得我们需要的功能，我们可以在 makefile 中使用 GNU 特有的语法，如列表 3-37 所示。\n\n```\n--snip--\n\
  \nCFLAGS ?= -g -O0\n\n--snip--\n```\n\n*列表 3-37：在 makefile 中使用 GNU 特有的查询赋值运算符*\n\
  \n### 非递归构建系统\n\n现在我们花了这么多时间为我们的项目创建了完美的构建系统，让我们来看看*更完美*的解决方案——非递归系统。我在本章开头提到过递归构建存在一个问题，我们将稍后讨论。\n\
  \n递归构建系统的根本问题在于，它们人为地引入了 make 直接图的缺陷——make 使用该图来确定什么依赖于什么以及何时需要重新构建。对于 Jupiter 来说，很少出问题，因为只有一个顶层\
  \ makefile 调用了单个子目录的 makefile，但让我们考虑一个更复杂的项目，其中多个模块嵌套任意深并以更复杂的方式相互依赖。\n\n对于单个 makefile，这一个\
  \ make 进程可以“观察大局”。也就是说，它可以看到并理解系统中的所有依赖关系，并创建一个 DAG（有向无环图），正确表示项目内部所有文件对象之间的相互依赖关系。有了多个\
  \ makefile，父 make 执行的每个子 make 进程只能看到依赖图的一部分。最终，这会导致 make 按错误的顺序构建产品，使得一个依赖于自身范围之外依赖项的产在这些依赖项更新之前就被构建了。\n\
  \n\n\n\n\n当你通过在 `make` 命令中添加 `-j` 来使用*并行* `make` 时，前述问题会变得更加复杂。`-j` 选项告诉 `make`\
  \ 检查其有向无环图（DAG），并找到 DAG 中某些部分互不依赖的地方，然后同时执行这些部分。在多处理器系统上，这可以极大加快大型项目的构建过程。然而，这从两个不同的角度引起了问题。首先，由于\
  \ `make` 无法看到全局，它可能会对哪些操作可以并行做出错误的假设。其次，对于顶层 `make` 来说，子级 `make` 进程都是独立的，可以并行运行，而我们显而易见这并非事实。对于一个甚至不依赖于递归与非递归构建系统差异的例子，请考虑以下命令行：\n\
  \n```\n$ make -j clean all\n```\n\n对于 `make` 而言，`clean` 和 `all` 彼此是 100% 独立的，因此\
  \ `make` 会很乐意地同时运行它们。即使是新手也能看出这种假设的问题。要点在于，`make` 并不理解 `clean` 和 `all` 之间的高层关系。这种关系只有\
  \ `makefile` 的作者才理解。在递归构建系统中，类似的阻碍 `make` 理解全局的障碍被人为引入了父子 `make` 调用的边界处。\n\n那么，将\
  \ Jupiter 的递归构建系统转换为非递归系统有多难？我们希望保持模块化，因此我们仍然希望每个目录中都有一个 `Makefile`，本质上管理该目录的任务。通过使用常用\
  \ `make` 的另一个功能——`include` 指令可以轻松实现这一点。`include` 指令允许我们将单一的父级 `makefile` 拆分为特定于目录的规则块，然后仅将这些片段包含在顶层\
  \ `makefile` 中。列表 3-38 显示了完整更新后的顶层 `makefile` 对应的样子。\n\n```\n package = jupiter\n\
  \n   version = 1.0\n\n   tarname = $(package)\n\n   distdir = $(tarname)-$(version)\n\
  \n   prefix = /usr/local\n\n   exec_prefix = $(prefix)\n\n   bindir = $(exec_prefix)/bin\n\
  \n➊ #export prefix\n\n   #export exec_prefix\n\n   #export bindir\n\n➋ all jupiter:\
  \ src/jupiter\n\n   dist: $(distdir).tar.gz\n\n   $(distdir).tar.gz: $(distdir)\n\
  \n           tar chof - $(distdir) | gzip -9 -c > $@\n\n           rm -rf $(distdir)\n\
  \n   $(distdir): FORCE\n\n           mkdir -p $(distdir)/src\n\n           cp Makefile\
  \ $(distdir)\n\n           cp src/Makefile $(distdir)/src\n\n           cp src/main.c\
  \ $(distdir)/src\n\n   distcheck: $(distdir).tar.gz\n\n           gzip -cd $(distdir).tar.gz\
  \ | tar xvf -\n\n           cd $(distdir) && $(MAKE) all\n\n           cd $(distdir)\
  \ && $(MAKE) check\n\n           cd $(distdir) && $(MAKE) DESTDIR=$${PWD}/_inst\
  \ install\n\n           cd $(distdir) && $(MAKE) DESTDIR=$${PWD}/_inst uninstall\n\
  \n           @remaining=\"`find $${PWD}/$(distdir)/_inst -type f | wc -l`\"; \\\n\
  \n           if test \"$${remaining}\" -ne 0; then \\\n\n             echo \"***\
  \ $${remaining} file(s) remaining in stage directory!\"; \\\n\n             exit\
  \ 1; \\\n\n           fi\n\n           cd $(distdir) && $(MAKE) clean\n\n      \
  \     rm -rf $(distdir)\n\n           @echo \"*** Package $(distdir).tar.gz is ready\
  \ for distribution.\"\n\n   FORCE:\n\n           -rm -f $(distdir).tar.gz >/dev/null\
  \ 2>&1\n\n           -rm -rf $(distdir) >/dev/null 2>&1\n\n➌ include src/Makefile\n\
  \n  .PHONY: FORCE all clean check dist distcheck install uninstall\n```\n\n*列表 3-38：*\
  \ Makefile: *顶层 makefile 的非递归版本*\n\n这里做了三处更改，但请注意，对这个 `makefile` 所做的的唯一真正重大的更改是将\
  \ ➋ 处执行递归的规则替换为单一的 `all`、`clean`、`check`、`install`、`uninstall` 规则以及一个显式的 `jupiter`\
  \ 目标。如果我们不在乎新的默认目标会变成 `dist`，或者说我们没有在此处添加 `all` 目标，那么这种替换本可以是简单的删除。我没有添加了一个映射到 `src/jupiter`\
  \ 的显式 `jupiter` 目标，以保持与旧系统的功能对。\n\n第二个更改是在 ➌ 处包含 `src` 级的 `makefile`。最后，我还注释掉了 ➊\
  \ 处的 `export` 语句，因为我们不再需要将变量导出到子级 `make` 进程；它们留作注释仅是为了说明。\n\n现在，让我们看看 `src` 级 `makefile`\
  \ 中发生了什么变化。完整的更新版本见列表 3-39 。\n\n```\nCFLAGS = -g -O0\n\nsrc/jupiter: src/main.c\n\
  \n        $(CC) $(CFLAGS) $(CPPFLAGS) -o $@ src/main.c\n\ncheck: all\n\n       \
  \         ./src/jupiter | grep \"Hello from .*jupiter!\"\n\n        @echo \"***\
  \ All TESTS PASSED\"\n\ninstall:\n\n        install -d $(DESTDIR)$(bindir)\n\n \
  \       install -m 0755 src/jupiter $(DESTDIR)$(bindir)\n\nuninstall:\n\n      \
  \  rm -f $(DESTDIR)$(bindir)\n\n        -rmdir -f $(DESTDIR) >/dev/null 2>&1\n\n\
  clean:\n\n        rm -f src/jupiter\n```\n\n*列表 39：* src/Makefile: *src 级 makefile\
  \ 的非递归版本*\n\n首先，删除了 `all` 目标。我们在这里不需要它，因为这个 `makefile` 并不打算被直接执行，而是被包含。因此，我们不需要默认目标。其次，对\
  \ `src` 目录的引用现在都是相对于父目录的路径。再次，这是因为 make 只从父目录执行一次。\n\n我们还删除了底部的 `.PHONY` 指令，因为它包含了父级中\
  \ `.PHONY` 指令的子集，使其变得冗余。简而言之，我们只是将这个 `makefile` 转换为包含在父级 `makefile` 中的片段，删除了冗余，并确保所有的文件引用现在都相对于父目录。我希望你能看出这些更改构成了简化。\n\
  \n直觉上看起来更复杂，但实际上更简单。\n\n这个 `makefile` 是我们递归系统更准确、更快的版本。我称“这个 makefile”，是因为这里实际上只有一个\
  \ makefile——包含的文件可以直接粘贴到包含点（如列表 3-38 中的 ➋ 处），就像在 C 语言源文件中包含头文件一样。\n\n非递归构建系统的一个明显缺点是，你不能进入\
  \ *src* 目录并运行 `make` 来构建与该目录相关的项目部分。相反，你需要进入父目录并运行 `make`，这会构建一切。但这也是一个虚假的顾虑，因为你一直都可以通过在\
  \ `make` 命令行中指定所需的目标来执行构建系统的任何部分。区别在于，现在被构建的确实是应该构建的，因为 `make` 理解你命令它构建的任何给定目标的完整依赖关系。\n\
  \n\n\n\n\n`GCS` 在第 7 节“配置应如何工作”小节中描述了配置过程。到目前为止，我们已经能够仅使用 makefiles 在 Jupiter 上完成我们想做的几乎所有操作，因此你可能会好奇配置的实际作用是什么。`GCS`\
  \ 该小节的开头部分回答了我们的问题：\n\n每个 GNU 发行版都应该包含一个名为 `configure` 的 shell 脚本。该脚本接收的参数描述了你想要为何种类型的机器和系统编译程序。`configure`\
  \ 脚本必须记录配置选项，以便它们影响编译。\n\n这里的描述是 GNU 软件包中 `configure` 脚本接口的规范。许多软件包使用 GNU Autoconf（见\
  \ Autoconf 的“引言”）和/或 GNU Automake（见 Automake 的“引言”）来实现它，但你并不非要使用这些工具。你可以以你喜欢的任何方式来实现它；例如，通过让\
  \ `configure` 成为一个完全不同的配置系统的封装器。\n\n`configure` 脚本运行的另一种方式是创建一个从标准名称（如 `config.h`）到所选系统配置文件的链接。如果你使用这种技术，发行版中*不应*包含名为\
  \ `config.h` 的文件。这样做是为了让人们在不先进行配置的情况下无法构建程序。\n\n`configure` 可以做的另一件事是编辑 `Makefile`。如果你这样做，发行版中*不应*包含名为\
  \ `Makefile` 的文件。相反，它应该包含一个 `Makefile.in` 文件，其中包含了用于编辑的输入。再次，这样做是为了让人们在不先进行配置的情况下无法构建程序。\n\
  \n因此，典型配置脚本的主要任务如下：\n\n*   从包含替换变量的模板生成文件。\n*   生成一个 C 语言头文件（`config.h`）供项目源代码包含。\n\
  *   为特定的 make 环境设置用户选项（调试标志等）。\n*   将各种软件包选项设置为环境变量。\n*   测试工具、库和头文件是否存在。\n\n对于复杂项目，配置脚本通常根据项目开发者维护的一个或多个模板生成项目\
  \ makefiles。这些模板以一种易于识别（并替换）的格式包含配置变量。配置脚本将这些变量替换为在配置过程中确定的值——这些值既可能来自用户指定的命令行选项，也可能来自对平台环境的详尽分析。这种分析涉及检查某些系统或软件包头文件及库是否存在、在各种文件系统路径中搜索所需的实用程序和工具，甚至运行专门设计的小程序以指示\
  \ shell、C 编译器或所需库的功能集。\n\n在过去，变量替换的首选工具一直是 `sed` 流编辑器。一个简单的 `sed` 命令就可以在单次文件扫描中，替换\
  \ makefile 模板中的所有配置变量。然而，Autoconf 2.62 及更高版本在这一过程中更倾向于使用 `awk` 而非 `sed`。如今，`awk`\
  \ 工具几乎和 `sed` 一样普及，它提供了更多功能，允许高效地替换许多变量。对于我们 Jupiter 项目而言，这两个工具中的任何一个都足够。\n\n###\
  \ 总结\n\n我们现在手动创建了一个完整的项目构建系统，但有一个重要的例外：我们没有根据 `GNU Coding Standards` 中指定的设计标准来设计\
  \ `configure` 脚本。我们可以这样做，但需要额外编写几十页文本才能构建出一个尽可能符合这些规范的脚本。尽管如此，`GCS` 指出了一些与 makefiles\
  \ 特别相关的关键构建特性是理想的。其中之一就是 vpath 构建的概念。这是一个重要的特性，只有通过实际编写一个按照 `GCS` 规范运行的配置脚本才能恰当地说明。\n\
  \n与其现在花费时间和精力做这件事，我希望直接跳转到第 4 节](#ch04.xhtml) 关于 Autoconf 的讨论，这将允许我们仅需两三行代码就能构建这些配置脚本之一。解决这些问题后，为\
  \ Jupiter 项目添加 vpath 构建和其他常见的 Autotools 特性将轻而易举。\n\n## 4 使用 AUTOCONF 配置你的项目\n\n\
  *我的朋友们来吧，寻求新世界还为时不晚。*\n\n—阿尔弗雷德·丁尼森勋，《奥德赛斯》*\n\n![图像](img/common.jpg)\n\nAutoconf\
  \ 项目历史悠久，始于 1992 年。当时 David McKenzie 在自由软件基金会志愿者期间，正寻找一种方法来简化创建复杂的配置脚本的过程，以支持当时每天不断增加到\
  \ GNU 项目的目标平台。与此同时，他正在马里兰大学大学帕克分校攻读计算机科学的学士学位。\n\n在 McKenzie 对 Autoconf 完成初步工作之后，他直到\
  \ 1996 年一直是该项目的强有力贡献者，随后 Ben Elliston 接手了项目的维护工作。从那时起，维护者和主要贡献者包括 Akim Demaille、Jim\
  \ Meyering、Alexandre Oliva、Tom Tromey、Lars J. Aas（`autom4te` 名称的发明者等）、Mo DeJong、Steven\
  \ G. Johnson、Matthew D. Langston、Paval Roskin 和 Paul Eggert（贡献者列表长得多——更多历史请见 Autoconf\
  \ 的 `AUTHORS` 文件）。\n\n今天的维护者 Eric Blake 从 2012 年开始对 Autoconf 进行大力贡献。从那时起他在红帽工作期间一直是该项目的维护者。由于\
  \ Automake 和 Libtool 本质上是原始 Autoconf 框架的附加组件，花时间关注在不使用 Automake 和 Libtool 的情况下使用\
  \ Autoconf 是很有用的。这能让你深入了解 Autoconf 的运作方式。\n\n在 Automake 出现之前，Autoconf 是单独使用的。事实上，许多旧项目从未从\
  \ Autoconf 迁移到完整的 Autotools 工具包。因此，在旧的开源项目中发现名为 `configure.in`（原始 Autoconf 命名规范）以及手工编写的\
  \ `Makefile.in` 模板并不罕见。\n\n在本章中，我将向你展示如何为项目添加 Autoconf 构建系统。我将在本章的大部分时间讨论 Autoconf\
  \ 的基本功能，并在第 5 节](#ch05.xhtml) 中更详细地介绍一些复杂的 Autoconf 宏的工作原理以及如何正确使用它们。在整个过程中，我们将继续使用\
  \ Jupiter 项目作为示例。\n\n### Autoconf 配置脚本\n\n`autoconf` 程序的输入是散布了宏调用的 Bourne 脚本。输入数据流还必须包含所有宏的定义——包括\
  \ Autoconf 提供的和你自己编写的。\n\nAutoconf 使用的宏语言称为 `M4`。（名字的意思是“M 加上 4 个字母”，或者就是 `Macro`\
  \ 这个词。）`m4` 工具是由 Brian Kernighan 和 Dennis Ritchie 在 1977 年编写的一种通用的宏语言处理器。\n\n虽然你可能对其并不熟悉，但在今天使用的每个\
  \ Unix 和 Linux 变体（以及其他系统）上都能找到某种形式的 `M4`。这种工具的无处不在是 Autoconf 使用它的主要原因，因为 Autoconf\
  \ 的原始设计目标是让它能够在所有系统上运行，而无需添加复杂的工具链和工具集。\n\n\n\n\n\nAutoconf 依赖于极少量的工具：一个 Bourne\
  \ shell、`M4` 和一个 Perl 解释器。它生成的配置脚本和 Makefile 则依赖于另一组工具，包括 Bourne shell、`grep`、`ls`\
  \ 以及 `sed` 或 `awk`。\n\n**注意**\n\n不要将 Autotools 的要求与它们生成的脚本和 Makefile 的要求混淆。Autotools\
  \ 是维护者使用的工具，而生成的脚本和 Makefile 是给终端用户使用的工具。我们可以合理地预期，开发系统上的安装功能水平会比终端用户系统更高。\n\n配置脚本（configuration\
  \ script）确保终端用户的构建环境已配置妥当以便构建你的项目。该脚本会检查已安装的工具、实用程序、库和头文件，还会检查这些资源中是否包含特定的功能。Autoconf\
  \ 与其他项目配置框架的区别在于，Autoconf 的测试还能确保这些资源可以被你的项目正确使用。你要明白，重要的不仅是用户的系统中系统中正确安装了 `libxyz.so`\
  \ 及其公共头文件，而且他们还拥有这些文件的兼容版本。Autoconf 对此类测试近乎“偏执”。它通过为每个功能编译并链接一个小型测试程序，确保终端用户的环境符合项目要求——如果你愿意的话，这是一个典型的例子，它在大规模上执行了你的项目源代码所做的事情。\n\
  \n难道不能通过在库路径中搜索文件名来确保安装了 `libxyz.2.1.0.so` 吗？这个问题的答案尚有争议。在某些情况下，库和工具会静默更新。有时，你的项目依赖的特定功能会以安全漏洞修复或库增强的形式添加，在这种情况下，供应商甚至不需要增加版本号。但是，除非你查看文件大小或调用库函数来确保其按预期工作，否则通常很难判断你拥有的是否\
  \ `2.1.0.r1` 版本还是 `2.1.0.r2` 版本。\n\n此外，供应商经常会将较新产品的漏洞修复和新功能回移植（backport）到旧平台，而不会增加版本号。因此，即使通过查看版本号，你也无法判断该库是否支持在该版本库发布后添加的功能。\n\
  \n然而，不依赖库版本号的最重要原因是，它们并不代表库的特定营销版本。正如我们将在第 8 章中讨论的那样，库的版本号表示特定平台上的二进制接口特性。这意味着对于同一功能集，库的版本号在平台之间可能不同。因此，你可能无法判断（除非编译并链接到该库）特定库是否具有你的项目所需的功能。\n\
  \n最后，还有几种重要情况，相同的功能由不同系统上完全不同的库提供。例如，你可能在一个系统上通过 `libtermcap` 找到光标操作功能，在另一个系统上通过\
  \ `libncurses`，而在另一个系统上则通过 `libcurses`。但了解所有这些特殊情况并不关重要，因为当你的项目因为此类差异无法在他们的系统上构建时，用户会告诉你的。\n\
  \n当报告此类错误时，你可以做什么？你可以使用 Autoconf 的 `AC_SEARCH_LIBS` 宏来对多个库的同一功能进行测试。只需将库添加到搜索列表中即可。由于这种修复如此简单，发现该问题的用户很可能会直接向你的\
  \ `configure.ac` 文件发送一个补丁（patch）。\n\n由于 Autoconf 的测试是用 shell 脚本编写的，因此对于测试的操作方式，你有很大的灵活性。你可以编写一个测试，仅检查用户系统中常规位置是否存在某个库或实用程序，但这跳过了\
  \ Autoconf 的一些最重要的特性。幸运的是，Autoconf 提供了几十符合 Autoconf 功能测试哲学的宏。你应该仔细研究并使用可用宏的列表，而不是编写自己的，因为它们被专门设计用于确保在最广泛的系统和平台上可以使用所需的功能。\n\
  \n### 最短的 configure.ac 文件\n\nAutoconf 的输入文件称为 `configure.ac`。最简单的 `configure.ac`\
  \ 文件只有两行，如列表 4-1 所示。\n\n```\nAC_INIT([Jupiter], [1.0])\n\nAC_OUTPUT\n```\n\n列表 4-1：最简单的\
  \ configure.ac 文件\n\n对于初学者 Autoconf 的人来说，这两行代码看起来像两个函数调用，也许是某种晦涩编程语言的语法。不要被它们的外表误导——这些是\
  \ M4 宏的调用。这些宏定义在随 autoconf 软件包分发的文件。例如，你可以在 Autoconf 安装目录下的 `general.m4` 文件中找到 `AC_INIT`\
  \ 的定义（通常位于 `*/usr/(local/)share/autoconf/autoconf*`）。`AC_OUTPUT` 定义在同一目录的 `status.m4`\
  \ 中。\n\n### 比较 M4 与 C 预处理器\n\nM4 宏在许多方面与 C 语言源文件中定义的 C 预处理器（CPP）宏相似。C 预处理器也是一个文本替换工具，这并不奇奇：M4\
  \ 和 C 预处理器都是 Kernighan 和 Ritchie 在同一时期设计并编写的。\n\nAutoconf 使用方括号包围宏参数作为引用机制。只有当宏调用的上下文可能导致歧义，且宏处理器可能会错误地解析该歧义（通常通常不通知你）时，才需要引用。我们将在第\
  \ 16 章中更详细地讨论 M4 引用。现在，只需为每个参数使用方括号，以确保生成预期的宏展开。\n\n与 CPP 宏一样，你可以定义 M4 宏来接受一组用括号括起来、逗号分隔的参数。在\
  \ CPP 中，宏使用预处理器指令定义：`#define *name(*args*) *expansion`，而在 M4 中，使用内置宏定义：`define(*name*,\
  \ *expansion*)`。另一个显著区别是，在 CPP 中，宏定义指定的参数是必须，而在 M4 中，参数化宏的参数是可选的，调用者可以简单地省略它们。如果没有传递参数，你也可以省略括号。传递给\
  \ M4 宏的额外参数会被简单忽略。最后，M4 不允许在宏调用的宏名称与左括号之间存在空格。\n\n### M4 宏的本质\n\n如果你用 C 语言编程了多年，你无疑遇到过几个来自低级黑暗区域的\
  \ C 预处理器宏。我指的是那些展开成一或两页 C 代码的真正邪恶的宏。它们本应该被写成 C 函数，但它们的作者要么过度担心性能，要么只是太得过了，现在轮到你来调试和维护它们了。但是，正如任何经验丰富的\
  \ C 程序员所说的那样，在本该使用函数的地方使用宏所获得的微小性能提升，并不抵消维护者在调试你那些奇技宏时所带来的麻烦。调试此类宏可能是一场噩梦，因为由宏生成的源代码通常无法从符号调试器中访问。\n\
  \n\n\n\n编写此类复杂的宏被 M4 程序员视为一种“宏的境界”——它们越复杂、功能越强大，就显得越“酷”。列表 4-1 中的两个 Autoconf 宏展开后一个包含近\
  \ 2,400 行 Bourne-shell 脚本的文件，总大小超过 70KB！但看它们的定义，你无法猜到这一点。它们都非常短——每个只有几十行。这种显而差异的原因很简单：它们是以模块化的方式编写的，每个宏都会展开其他几个宏，而这些宏又会展开更多的，以此类推。\n\
  \n与程序员被教导不要滥用 C 预处理器的原因一样，`M4` 的大量使用让那些试图理解 Autoconf 的人感到相当的挫败。这并不是说 Autoconf 不应该这样使用\
  \ `M4`；恰恰相反——这正是 `M4` 的用场。但确实有一种观点认为，由于前面提到的宏问题，`M4` 是 Autoconf 的一个糟糕选择。幸运的是，要有效使用\
  \ Autoconf 通常不需要深入理解随附的宏的内部工作机制。(6)\n\n## 执行 autoconf\n\n运行 Autoconf 非常简单：只需在与 `configure.ac`\
  \ 文件相同的目录下执行 `autoconf` 即可。虽然我可以为本章的每个示例都这样做，但我将使用 `autoreconf` 程序而不是 `autoconf`\
  \ 程序，因为运行 `autoreconf` 的效果与运行 `autoconf` 完全相同，不同之处在于当你开始为构建系统添加 Automake 和 Libtool\
  \ 功能时，`autoreconf` 也能执行正确的操作。也就是说，它将根据你的 `configure.ac` 文件的内容按正确的顺序执行所有的 Autotools\
  \ 工具。\n\n`autoreconf` 程序足够智能，能够按照你需要的顺序、使用你需要的选项，仅执行你需要的工具（稍后我会提到一个例外）。因此，运行 `autoreconf`\
  \ 是执行 Autotools 工具链推荐的方法。\n\n让我们首先将列表 4-1 中的简单 `configure.ac` 文件添加到项目目录中。顶层目录目前只包含一个\
  \ `Makefile` 和一个 `src` 目录，后者包含它自己的 `Makefile` 和一个 `main.c` 文件。一旦你将 `configure.ac`\
  \ 添加到顶层目录，运行 `autoreconf`：\n\nGit tag 4.0\n\n```\n$ autoreconf\n\n$\n\n$ ls -1p\n\
  \nautom4te.cache/\nconfigure\nconfigure.ac\nMakefile\nsrc/\n$\n```\n\n首先，注意 `autoreconf`\
  \ 默认静默运行。如果你想看到正在发生的操作，请使用 `-v` 或 `--verbose` 选项。如果你想让 `autoreconf` 也以详细模式执行 Autotools，请在命令行中添加\
  \ `-vv`。(7)\n\n接下来，注意 `autoconf` 创建了一个名为 `autom4te.cache` 的目录。这是 autom4te 缓存目录。该缓存加速了在\
  \ Autotools 工具链中连续执行工具时对 `configure.ac` 的访问。\n\n将 `configure.ac` 通过通过 `autoconf`\
  \ 的结果本质上是同一个文件（现在称为 `configure`），但所有的宏都已完全展开。你可以查看一下 `configure`，但如果你没有立即理解你看到的内容，不要太惊讶。`configure.ac`\
  \ 文件已经通过 `M4` 宏展开转换成一个包含数行复杂 Bourne shell 脚本的文本文件。\n\n## 执行 configure\n\n正如在第 77\
  \ 页 的“配置你的软件包”中所讨论的，*GNU 编码标准*指出，手写的 configure 脚本应该生成另一个名为 `config.status` 的脚本，其工作是从模板生成文件。意料之中，这正是你在\
  \ Autoconf 生成的配置脚本中找到的功能。该脚本有两个主要任务：\n\n*   执行请求的检查\n*   生成并调用 `config.status`\n\
  \n`configure` 执行的检查结果被写入 `config.status` 中，其方式允许它们被作为替换文本，用于模板文件（`Makefile.in`、`config.h.in`\
  \ 等）中的 Autoconf 替换变量。当你执行 `./configure` 时，它会告诉你正在创建 `config.status`。它还会创建一个名为 `config.log`\
  \ 的日志文件，该文件具有几个重要属性。让我们运行 `./configure`，然后看看我们的项目目录下有什么新变化：\n\n```\n$ ./configure\n\
  \nconfigure: creating ./config.status\n\n$\n\n$ ls -1p\n\nautom4te.cache/\nconfig.log\n\
  config.status\nconfigure\nconfigure.ac\nMakefile\nsrc/\n$\n```\n\n我们看到 `configure`\
  \ 确实生成了 `config.status` 和 `config.log`。`config.log` 文件包含以下信息：\n\n*   用于调用 `configure`\
  \ 的命令行（非常有用！）\n*   执行 `configure` 的平台信息\n*   `configure` 执行的核心测试信息\n*   `configure`\
  \ 中生成并随后调用 `config.status` 的行号\n\n在日志文件的此点，`config.status` 接管了日志信息的生成并添加了以下内容：\n\
  \n*   用于调用 `config.status` 的命令行\n\n在 `config.status` 从其模板生成所有文件后，它会退出并将控制权返回给 `configure`，然后\
  \ `configure` 在日志中追加以下信息：\n\n*   执行任务时使用的缓存变量 `config.status`\n*   可能在模板中替换的输出变量列表\n\
  *   `configure` 返回给 shell 的退出代码\n\n当你调试 configure 脚本及其相关的 `configure.ac` 文件时，这些信息是无价之宝。\n\
  \n为什么 `configure` 不直接执行它写入 `config.status` 的代码，而不是费尽精力生成第二个脚本只为了调用它呢？有几个很好的理由。首先，执行检查和生成文件的操作在概念上是不同的，`make`\
  \ 工具在将概念上不同的操作关联到单独的目标时工作效果最好。第二个原因是你可以单独执行 `config.status` 以从模板中重新生成输出文件，从而节省执行那些耗时检查的时间。最后，`config.status`\
  \ 的写入是为了记住最初在 configure 命令行使用的参数。因此，当 `make` 检测到它需要更新构建系统时，它可以调用 `config.status`\
  \ 来重新执行 `configure`，使用最初指定的命令行选项。\n\n## 执行 config.status\n\n现在你知道 `configure` 是如何工作的了，你可能想自己执行\
  \ `config.status`。这正是 Autoconf 设计师和 *GCS* 作者的初意，他们最初构思了这些设计目标。然而，将检查与模板处理分离更重要的原因是，当\
  \ `make` 确定模板比其 makefile 更新新时，makefile 规则可以使用 `config.status` 从模板重新生成 makefile。\n\
  \n与其调用 `configure` 执行不必要的检查（你的环境没有改变——只是模板文件变了），不如编写 makefile 规则指示输出文件依赖于其模板。这些规则的命令运行\
  \ `config.status`，并将规则的目标作为参数传递。例如，如果你修改了其中一个 `Makefile.in` 模板，`make` 会调用 `config.status`\
  \ 来重新生成相应的 `Makefile`，之后 `make` 会重新执行自己的原始命令行。(8)\n\n列表 4-2 显示了此类 `Makefile.in`\
  \ 模板的相关部分，包含了重新生成相应 `Makefile` 所需的规则。\n\n```\nMakefile: Makefile.in config.status\n\
  \n        ./config.status $@\n```\n\n*列表 4-2：模板发生变化时导致 make 重新生成 Makefile 的规则*\n\
  \n\n\n目标名为 `Makefile` 的规则是这里的触发器。该规则允许 `make` 在模板发生变化时从其模板重新生成源 Makefile。这是在执行用户指定的目标（或在未指定特定目标时执行默认目标）*之前*完成的。这一功能是内置在\
  \ `make` 中的——如果如果存在一个目标为 `Makefile` 的规则，`make` 总是优先评估该规则。\n\nListing 4-2 中的规则表明\
  \ `Makefile` 依赖于 `config.status` 以及 `Makefile.in`，因为如果 `configure` 更新了 `config.status`，它可能会以不同的方式生成\
  \ `Makefile`。可能是提供了不同的命令行选项，使得 `configure` 现在能够找到之前无法找到的库和头文件。在这种情况下，Autoconf 替换变量可能有不同的值。因此，如果\
  \ `Makefile.in` 或 `config.status` 更新了任何一个，都应该重新生成 `Makefile`。\n\n由于 `config.status`\
  \ 本身是一个生成文件，理所当然你可以编写这样一条规则在需要时重新生成该文件。扩展上一个例子，Listing 4-3 添加了当 `configure` 变化时重新构建\
  \ `config.status` 的所需代码。\n\n```\nMakefile: Makefile.in config.status\n\n       \
  \ ./config.status $@\n\nconfig.status: configure\n\n        ./config.status --recheck\n\
  ```\n\n*Listing 4-3: configure 变化时重新构建 config.status 的规则*\n\n由于 `config.status`\
  \ 是 `Makefile` 目标的依赖项，`make` 将查找目标为 `config.status` 的规则并在并在时运行其命令。\n\n### 添加一些实际功能\n\
  \n我之前建议过，你应该在 makefiles 中调用 `config.status` 来从模板生成这些 makefiles。Listing 4-4 显示了 `configure.ac`\
  \ 中实际实现此点的代码。它只是在 Listing 4-1 的两个原始行之间增加了一个单次宏调用。\n\nGit tag 4.1\n\n```\nAC_INIT([Jupiter],[1.0])\n\
  \nAC_CONFIG_FILES([Makefile src/Makefile])\n\nAC_OUTPUT\n```\n\n*Listing 4-4: configure.ac:\
  \ 使用 AC_CONFIG_FILES 宏*\n\n此代码假设为 `Makefile` 和 `src/Makefile` 存在模板，分别为 `Makefile.in`\
  \ 和 `src/Makefile.in`。这些模板文件看起来与其对应的 `Makefile` 文件完全相同，但有一个例外：任何我想要让 Autoconf 替换的文本都标记为\
  \ Autoconf 替换变量，并使用 `@*VARIABLE*@` 语法。要创建这些文件，只需将顶层和 `src` 目录下的现有 `Makefile` 文件重命名为\
  \ `Makefile.in` 即可。这是对项目进行 *autoconf-化* 时的常用做法：\n\n```\n$ mv Makefile Makefile.in\n\
  \n$ mv src/Makefile src/Makefile.in\n\n$\n```\n\n在完成这些更改后，我们现在实际上正在利用 Jupiter 中新的\
  \ `configure.ac` 文件来生成 makefiles。为了让它有用，让我们添加几个 Autoconf 替换变量来替换原始的默认值。在这些文件的顶部，我还在注释井标记之后添加了\
  \ Autoconf 替换变量 `@configure_input@`。Listing 4-5 显示了在 `Makefile` 中生成的注释文本。\n\nGit\
  \ tag 4.2\n\n```\n# Makefile. Generated from Makefile.in by configure.\n\n--snip--\n\
  ```\n\n*Listing 4-5: Makefile: 从 Autoconf @configure_input@ 变量生成的文本*\n\n我还将之前示例中的\
  \ makefile 重新生成规则添加到这些模板的每一个中，每个文件之间有细微的路径差异，以考虑到它们相对于构建目录中 `config.status` 和 `configure`\
  \ 的不同位置。Listings 4-6 和 4-7 突出了从 第 3 章 末尾附近的 `Makefile` 和 `src/Makefile` 最终递归版本中所需的更改。我们将在以后介绍\
  \ Automake 时考虑编写这些文件的非递归版本——在介绍 Automake 时，使用 Autoconf 配合手写的 `Makefile.in` 模板的过程几乎与我们在\
  \ 第 3 章 中使用 makefiles 进行的操作相同。\n\n```\n# @configure_input@\n\n# 包特定的特定的替换变量\n\n\
  package = @PACKAGE_NAME@\n\nversion = @PACKAGE_VERSION@\n\ntarname = @PACKAGE_TARNAME@\n\
  \ndistdir = $(tarname)-$(version)\n\n# 前缀特定的替换变量\n\nprefix = @prefix@\n\nexec_prefix\
  \ = @exec_prefix@\n\nbindir = @bindir@\n\nall clean check install uninstall jupiter:\n\
  \n        cd src && $(MAKE) $@\n\n--snip--\n\n$(distdir): FORCE\n\n        mkdir\
  \ -p $(distdir)/src\n\n        cp configure.ac $(distdir)\n\n        cp configure\
  \ $(distdir)\n\n        cp Makefile.in $(distdir)\n\n        cp src/Makefile.in\
  \ src/main.c $(distdir)/src\n\ndistcheck: $(distdir).tar.gz\n\n        gzip -cd\
  \ $(distdir).tar.gz | tar xvf -\n\n        cd $(distdir) && ./configure\n\n    \
  \    cd $(distdir) && $(MAKE) all\n\n        cd $(distdir) && $(MAKE) check\n\n\
  \        cd $(distdir) && $(MAKE) DESTDIR=${PWD}/_install install\n\n        cd\
  \ $(distdir) && $(MAKE) DESTDIR=${PWD}/_install uninstall\n\n        @remaining=\"\
  `find ${PWD}/$(distdir)/_inst -type f | wc -l`\"; \\\n\n        if test \"$${remaining}\"\
  \ -ne 0; then \\\n          echo \"*** $${remaining} file(s) 留在阶段目录中!\"; \\\n  \
  \        exit 1; \\\n\n        fi\n\n        cd $(distdir) && $(MAKE) clean\n\n\
  \        rm -rf $(distdir)\n\n        @echo \"*** Package $(distdir).tar.gz is ready\
  \ for distribution.\"\n\n--snip--\n\nFORCE:\n\n        rm -f $(distdir).tar.gz\n\
  \n        rm -rf $(distdir)\n\nMakefile: Makefile.in config.status\n\n        ./config.status\
  \ $@\n\nconfig.status: configure\n\n        ./config.status --recheck\n\n.PHONY:\
  \ FORCE all clean check\n```\n\n*Listing 4-6: Makefile.in: 第 3 章中 Makefile 的所需更改*\n\
  \n```\n# @configure_input@\n\n# 包特定的特定的替换变量\n\npackage = @PACKAGE_NAME@\n\nversion\
  \ = @PACKAGE_VERSION@\n\ntarname = @PACKAGE_TARNAME@\n\ndistdir = $(tarname)-$(version)\n\
  \n# 前缀特定的替换变量\n\nprefix = @prefix@\n\nexec_prefix = @exec_prefix@\n\nbindir = @bindir@\n\
  \nCFLAGS = -g -O0\n\n--snip--\n\nclean:\n\n        rm -f jupiter\n\nMakefile: Makefile.in\
  \ config.status\n\n        cd .. && ./config.status $@\n\n../config.status: ../configure\n\
  \n        cd .. && ./config.status --recheck\n\n.PHONY: FORCE all clean check\n\
  ```\n\n*Listing 4-7: src/Makefile.in: 第 3 章中 src/Makefile 的所需更改*\n\n\n\n\n\n## 从模板生成文件\n\
  \n请注意，你可以使用 `AC_CONFIG_FILES` 从同一目录下同名但带有 `.in` 扩展的文件生成任何文本文件。`.in` 扩展名是 `AC_CONFIG_FILES`\
  \ 的默认模板命名模式，但你可以覆盖这一默认行为。我稍后会详细介绍。\n\nAutoconf 会在生成的配置脚本中生成 `sed` 或 `awk` 表达式，然后该脚本将其复制到\
  \ `config.status`。`config.status` 脚本使用这些表达式对输入模板文件进行字符串替换。\n\n`sed` 和 `awk` 都是作用于文件流的文本处理工具。流编辑器（`sed`\
  \ 名称是短 `stream editor` 的缩写）的优势在于它可以在字节流中替换文本模式。因此，`sed` 和 `awk` 都可以对巨大的文件进行操作，因为它们不需要将整个输入文件加载到内存中即可处理。Autoconf\
  \ 根据各种宏定义的变量列表构建出 `config.status` 传递给 `sed` 或 `awk` 的表达式列表，其中许多宏我将在本章稍后的部分详细介绍。重要的是，要理解在生成输出文件时，Autoconf\
  \ 替换变量是模板文件中唯一被替换的项目。\n\n此时，只需少少努力，我就创建了一个基础的 `configure.ac` 文件。现在我可以执行 `autoreconf`，接着执行\
  \ `./configure` 然后是 `make`，以构建 Jupiter 项目。这个简单的三行 `configure.ac` 文件生成了一个功能完备的配置脚本，符合\
  \ `GCS` 对规范配置脚本的定义。\n\n生成的配置脚本运行各种系统检查，并生成一个 `config.status` 脚本，该脚本可以替换此构建系统中一组指定模板文件中的大量替换变量。在仅有的三行代码中就实现了如此多的功能。\n\
  \n### 添加 VPATH 构建功能\n\n在第 3 章的末尾，我提到我还没有涵盖一个重要的概念——vpath 构建（vpath builds）。`vpath\
  \ build` 是一种使用 make 结构（`VPATH`）在源代码目录以外的目录中配置和构建项目的方法。如果你需要执行以下任何任务，这一点非常重要：\n\n\
  * 维护一个独立的调试配置\n* 并排测试不同的配置\n* 在本地修改后保持源码目录整洁以便生成补丁差异（diff）\n* 从只读源码目录进行构建\n\n`VPATH`\
  \ 关键字是 `virtual search path`（虚拟搜索路径）的缩写。`VPATH` 语句包含由冒号分隔的列表，当无法相对于当前目录找到相对路径依赖时，会在这些位置查找。换句话说，当\
  \ `make` 无法相对于当前目录找到先决文件时，它会在 `VPATH` 语句中的每个路径中搜索该文件。\n\n使用 `VPATH` 为现有的 makefile\
  \ 添加远程构建功能非常简单。列表 4-8 展示了在 Makefile 中使用 `VPATH` 语句的示例。\n\n```\nVPATH = some/path:some/other/path:yet/another/path\n\
  \nprogram : src/main.c\n\n        $(CC) ...\n```\n\n*列表 4-8：在 Makefile 中使用 VPATH\
  \ 的示例*\n\n在这个（人为构造的）示例中，如果 `make` 在处理规则时无法在当前目录找到 `src/main.c`，它将查找 `some/path/src/main.c`，然后是\
  \ `some/other/path/src/main.c`，最后是 `yet/another/path/src/main.c`，最后抛出一个关于不知道如何制作\
  \ `src/main.c` 的错误信息。\n\n通过几次简单的修改，我们就可以在 Jupiter 中完全支持远程构建。列表 4-9 和 4-10 说明了项目两个\
  \ Makefile 所需的更改。\n\n```\n--snip--\n\n# 前缀特定的替换变量\n\nprefix = @prefix@\n\nexec_prefix\
  \ = @exec_prefix@\n\nbindir = @bindir@\n\n# VPATH 特定的替换变量\n\nsrcdir = @srcdir@\n\
  \nVPATH = @srcdir@\n\n--snip--\n\n$(distdir): FORCE\n\n        mkdir -p $(distdir)/src\n\
  \n        cp $(srcdir)/configure.ac $(distdir)\n\n        cp $(srcdir)/configure\
  \ $(distdir)\n\n        cp $(srcdir)/Makefile.in $(distdir)\n\n        cp $(srcdir)/src/Makefile.in\
  \ $(srcdir)/src/main.c $(distdir)/src\n\n--snip--\n```\n*列表 4-9：Makefile.in：为顶层\
  \ Makefile 添加 VPATH 构建能力*\n\n```\n--snip--\n\n# 前缀特定的替换变量\n\nprefix = @prefix@\n\
