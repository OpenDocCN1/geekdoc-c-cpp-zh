  \ Doxygen 调用了 `AM_CONDITIONAL`，类似于我在 ftk 项目中处理 Doxygen 的方式。这些宏被配置为：如果找不到这些工具，将生成警告消息，\
  \ xflaim 项目的相关部分将不会构建，但在任何情况下都会继续构建。\n\n#### *创建 xflaim/src/Makefile.am 文件*\n\n\n\
  \n\n我跳过了 `xflaim/Makefile.am` 文件，因为它几乎与 `ftk/Makefile.am` 完全相同。相反，我们将转向 `xflaim/src/Makefile.am`，这个文件我是遵循与\
  \ `ftk/src` 版本相同的的设计原则编写的。它看起来与对应的 ftk 对应版本非常相似，唯一的区别在于：根据原始构建系统的 makefile，Java\
  \ 原生接口 (JNI) 和 C# 原生语言绑定源码被编译并直接链接到 `xflaim` 共享库中。\n\n这种做法并不常见，而且它非常有用，因为消除了为这些语言专门构建额外库对象的需求。从本质上说，`xflaim`\
  \ 共享库导出了这些语言的原生接口，然后这些接口由相应的原生封装器（native wrappers）进行调用。\n\n我目前将忽略这些语言绑定，但稍后当我完成整个\
  \ xflaim 项目后，我将重新关注如何将它们正确地挂钩到库中。在除此异常外，Listing 14-14 所示的 `Makefile.am` 文件看起来与它的\
  \ ftk 对应版本几乎完全相同。\n\n```\nif HAVE_JAVA\n\n  JAVADIR = java\n\n  JNI_LIBADD = java/libxfjni.la\n\
  \nendif\n\nif HAVE_CSHARP\n\n  CSDIR = cs\n\n  CSI_LIBADD = cs/libxfcsi.la\n\nendif\n\
  \nSUBDIRS = $(JAVADIR) $(CSDIR)\n\npkgconfigdir = $(libdir)/pkgconfig\n\npkgconfig_DATA\
  \ = libxflaim.pc\n\nlib_LTLIBRARIES = libxflaim.la\n\ninclude_HEADERS = xflaim.h\n\
  \nlibxflaim_la_SOURCES = \\\n\n  btreeinfo.cpp \\\n  f_btpool.cpp \\\n  f_btpool.h\
  \ \\\n  --snip--\n\n  rfl.h \\\n  scache.cpp \\\n  translog.cpp\n\nlibxflaim_la_CPPFLAGS\
  \ = $(FTK_INCLUDE)\n\nlibxflaim_la_LIBADD = $(JNI_LIBADD) $(CSI_LIBADD) $(FTK_LTLIB)\n\
  \nlibxflaim_la_LDFLAGS = -version-info 3:2:0\n```\n*Listing 14-14*: `xflaim/src/Makefile.am`:\
