  \n我们似乎有一些错误需要修复。第一个感兴趣的点是，libtool 在 ➊ 处带有 `--mode=compile` 选项执行的，这导致 libtool 充当包装脚本，运行一个对标准\
  \ `gcc` 命令行进行了某种修改的版本。你可以看到这种影响。\n\n这里需要理解的核心概念是，libtool 可能会（通常也是）执行一组 shell 命令。➎\
  \ 处的行是另一个对 libtool 脚本的调用，这次使用了 `--mode=link` 选项。该选项生成一个以 `link` 模式执行编译器的调用，并传入 `Makefile.am`\
  \ 中指定的所有库和链接选项。\n\n在 ➏ 处，我们遇到了第一个问题——将共享库链接到静态库的可移植性警告。请注意这不是错误。如果不是我们之后会遇到额外的错误，库将无视此警告完成构建。在可移植性警告之后，libtool\
  \ 尝试将请求的对象链接成名为 `libjupiter.so.0.0.0` 的共享库。但在这里脚本遇到了真正的问题：在 ➐ 处，链接器错误表明，来自 `libjupcommon.a`（更具体说是\
  \ `print.o`）的 `x86_64` 对象重定向在创建共享对象无法无法，因为源文件（`print.c`）显然没有正确编译。链接器足够 ways 告诉我们修复此问题需要做什么（如示例所示）：我们需要使用\
  \ `-fPIC` 编译器选项编译源代码。\n\n现在，如果你遇到这个错误并且对 `-fPIC` 选项无所知，那么明智的做法是打开 `gcc` 的手册页进行学习，在盲目插入编译器和链接选项直到警告或错误消失之前（不幸，这是缺乏经验程序员的常见做法）。软件工程师应该理解构建系统中工具使用的每个命令行选项的含义和细微差别。否则，当构建完成后，他们并并不真正自己拥有了什么。它可能以预期的方式运行，但如果是那样，那是运气而非设计。优秀的工程师了解他们的工具，最好的学习方法是研究错误信息及其修复方法，直到完全理解问题，然后再继续。\n\
  \n#### *那么到底什么是 PIC？*\n\n\n\n\n当操作系统创建新的进程地址空间时，它们通常会将程序可执行镜像加载到相同的内存地址。这个“魔术地址”是特定于系统的。编译器和链接器理解这一点，并且它们知道任何给定系统上的魔术地址是什么。因此，当它们生成对函数调用或全局数据的内部引用时，它们可以将这些引用生成为绝对地址。如果你以某种方式将可执行文件加载到进程虚拟地址空间中的不同位置，它将无法正常工作，因为代码中的绝对地址将是不正确的。至少，当处理器在函数调用期间跳转到错误的位置时，程序将会崩溃。\n\
  \n请考虑一下图 7-1。假设我们有一个系统，其魔术可执行加载地址为 `0x10000000`；此图描述了该系统中两个进程地址空间。在左侧的进程中，可执行镜像被正确加载到地址\
  \ `0x10000000`。在代码的某处，`jmp` 指令告诉处理器跳转到绝对地址 `0x10001000`，在那里继续执行程序的另一个区域的指令。\n\n\
  ![Image](img/07fig01.jpg)\n\n*图 7-1：可执行镜像中的绝对寻*\n\n在右侧的进程中，程序被错误地加载到地址 `0x20000000`。当遇到同一个分支指令时，处理器会跳转到地址\
  \ `0x10001000`，因为该地址被硬编码在程序镜像中。这当然会导致失败——通常是由于灾难性的崩溃告终，但有时会产生更微妙且阴险的后果。\n\n程序镜像就是这样运行的。然而，当为特定类型的硬件（包括\
  \ AMD64）构建共享库时，编译器和链接器都预不知道库将加载到哪里。这是因为许多库可能会被加载到进程中，而它们的加载顺序取决于可执行文件的构建方式，而不是库本身。此外，谁能说哪个库拥有\
  \ A 位置，哪个库拥有 B 位置呢？事实是，库可以被加载到进程地址空间中加载时有任何地方。只有操作系统加载器知道它最终将位于何处——即便如此，它也只在库实际加载之前才知道。(12)\n\
  \n结果，共享库只能由一类称为 PIC 对象的特殊文件构建。`PIC` 是位置无关代码（position-independent code）的缩写，它意味着对象代码中的引用不是绝对的，而是相对的。当你在命令行中使用\
  \ `-fPIC` 选项时，编译器将在分支指令中使用效率稍低的相对寻址。这种位置无关的代码可以加载到任何地方。\n\n图 7-2 描绘了生成 PIC 对象时使用的相对寻址概念。使用相对寻址时，无论镜像加载到何处，地址都能正常工作，因为它们总是相对于当前指令指针进行编码的。在图\
  \ 7-2 中，图表显示共享库加载在与图 7-1 相同的地址上（即 `0x10000000` 和 `0x20000000`）。在两种情况下，在 `jmp` 指令中使用的美元符号代表当前指令指针\
  \ (IP)，因此 `$ + 0xC74` 告诉处理器应该跳转到比指令指针当前位置提前 `0xC74` 字节处的指令。\n\n![Image](img/07fig02.jpg)\n\
  \n*图 7-2：共享库镜像中的相对寻址*\n\n生成和使用位置无关代码有许多细微差别，你应该在使用它们之前熟悉所有这些细节，以便选择最适合你情况的选项。例如，GNU\
  \ C 编译器也支持 `-fpic` 选项（小写），它使用一种稍快但更受限的机制来生成可重定位对象代码。(13)\n\n### 修复 Jupiter PIC 问题\n\
  \n根据我们现在的理解，修复链接器错误的一种方法是为组成 `libjupcommon.a` 静态库的源文件在编译器命令行添加 `-fPIC` 选项。列表 7-8\
  \ 阐述了 `common/Makefile.am` 文件所需的更改。\n\n```\nnoinst_LIBRARIES = libjupcommon.a\n\n\
  libjupcommon_a_SOURCES = jupcommon.h print.c\n\nlibjupcommon_a_CFLAGS = -fPIC\n\
  ```\n\n*列表 7-8：common/Makefile.am：在静态库中生成 PIC 对象所需的更改*\n\n现在让我们重试构建：\n\n```bash\n\
  \ $ autoreconf\n\n   $ ./configure\n\n   --snip--\n\n   $ make\n\n   make    all-recursive\n\
  \n   make[1]: Entering directory '/.../jupiter'\n\n   Making all in common\n\n \
  \  make[2]: Entering directory '/.../jupiter/common'\n\n   gcc -DHAVE_CONFIG_H -I.\
  \ -I..        -fPIC -g -O2 -MT libjupcommon_a-print.o -MD\n\n   -MP -MF .deps/libjupcommon_a-print.Tpo\
  \ -c -o libjupcommon_a-print.o jupcommon.h print.c\n\n   gcc -fPIC -g -O2 -MT libjupcommon_a-print.o\
  \ -MD\n\n   -MP -MF .deps/libjupcommon_a-print.Tpo -c -o libjupcommon_a-print.o\
  \ jupcommon.h print.c\n```\n```\n\n\n\n\n解决这一移植性问题的方法是让 `Libtool` 同样生成静态库。`Libtool`\
  \ 将作为开发者包一部分安装的静态库与仅在项目内部使用的静态库区分开来。它将此类内部静态库称为 `convenience`（便利性）库，而是否生成便利库取决于在使用\
  \ `LTLIBRARIES` 主目标（primary）时所使用的前缀。如果使用了 `noinst` 前缀，那么 `Libtool` 就会认为我们想要一个便利库，因为生成一个永远不会被安装的共享库是没有意义的。因此，便利库始终作为非安装的静态归文件生成，除非它们被链接到项目内的其他代码，否则它们没有价值。\n\
  \n区分便利库和其他形式的静态库的原因是，便利库总是会被构建的，而已安装的静态库只有在 `configure` 命令行上指定了 `--enable-static`\
  \ 选项时才会构建——反之，如果没有指定 `--disable-static` 选项且默认库类型已设置为静态也是如此。将旧的静态库转换为较新的 `Libtool`\
  \ 便利库非常简单——我们只需要在主目标名称后添加 `LT`，并移除 `-fPIC` 选项和 `CFLAGS` 变量（因为该变量中没有使用其他选项）。注意我还将库的扩展名从\
  \ `*.a` 更改为 `*.la`。不要忘记更改 `SOURCES` 变量的前缀以反映库的新名称——`libjupcommon.la`。这些更改在 Listing\
  \ 7-9 和 7-10 中突出显示。\n\nGit tag 7.1\n\n```\nnoinst_LTLIBRARIES = libjupcommon.la\n\
  \nlibjupcommon_la_SOURCES = jupcommon.h print.c\n```\n\n*Listing 7-9:* common/Makefile.am:\
  \ *从静态库转换为 Libtool 静态库*\n\n```\nlib_LTLIBRARIES = libjupiter.la\n\nlibjupiter_la_SOURCES\
  \ = jup_print.c\n\nlibjupiter_la_CPPFLAGS = -I$(top_srcdir)/include -I$(top_srcdir)/common\n\
  \nlibjupiter_la_LIBADD = ../common/libjupcommon.la\n```\n\n*Listing 7-10:* libjup/Makefile.am:\
  \ *从静态库转换为 Libtool 静态库*\n\n现在当我们尝试构建时，得到的结果如下：\n\n```\n $ make\n\n   --snip--\n\n\
  \   Making all in libjup\n\n   make[2]: Entering directory '/.../jupiter/libjup'\n\
  \n➊ /bin/bash ../libtool   --tag=CC   --mode=compile gcc -DHAVE_CONFIG_H -I. -I..\n\
  \n   -I../include -I../common    -g -O2 -MT libjupiter_la-jup_print.lo -MD -MP -MF\n\
  \n   .deps/libjupiter_la-jup_print.Tpo -c -o libjupiter_la-jup_print.lo `test -f\n\
  \n   'jup_print.c' || echo './'`jup_print.c\n\n   libtool: compile:  gcc -DHAVE_CONFIG_H\
  \ -I. -I.. -I../include -I../common -g\n\n   -O2 -MT libjupiter_la-jup_print.lo\
  \ -MD -MP -MF .deps/libjupiter_la-jup_print.\n\n   Tpo -c jup_print.c  -fPIC -DPIC\
  \ -o .libs/libjupiter_la-jup_print.o\n\n   libtool: compile:  gcc -DHAVE_CONFIG_H\
