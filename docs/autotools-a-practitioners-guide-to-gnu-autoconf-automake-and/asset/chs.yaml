  \n要编译此代码，你需要在命令行中添加两个定义：`_GNU_SOURCE` 和 `OUTER_LIMITS`。第一个定义属于 GNU C 库，允许 `nl.c`\
  \ 访问扩展的国际货币字段，这些字段在 C99 标准之前并不属于 C 语言的一部分。第二个是我个人的发明，它允许你在不使用 GNU C 库提供的扩展分类的情况下构建该程序：\n\
  \n```bash\n$ gcc -D_GNU_SOURCE -DOUTER_LIMITS nl.c -o nl\n\n$ ./nl\n\nNumeric\n\n\
