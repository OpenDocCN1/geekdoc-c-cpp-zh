    # Streams in C++


    As you already know that a stream is a flow or a sequence of bytes through a system.
    It acts as an interface between an input or output device and a program. The following
    are the two types of streams:


    +   1. Input stream

    2. Output stream


    # Input stream


    A stream from which a program gets the input data is known as an input stream.
    An input stream can get the data from a keyboard or any other input or storage
    device. It acts as a source to the program because a program extracts the data
    from it, as shown in Figure 12-1.


    ![](img/84752854c60c73abd7e1344e8eba414b_471_0.png)


    In Figure 12-1, the data in the input stream comes from the input device and it
    is extracted by the program.


    # Output Stream


    A stream, which gets the data from a program is known as an output stream. Here,
    an output stream acts as a destination to the program, as shown in Figure 12-2.'
