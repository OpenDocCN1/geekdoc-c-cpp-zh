    # ## The Preprocessor


    A preprocessor is a program that makes some conversions such as macro substitutions,
    including header files, and so on in the source code before the compiler processes
    it. The preprocessor may also perform conditional conditional compilation.


    # THE PREPROCESSOR DIRECTIVES


    In the source code, the lines that begin with a pound sign (#) are known as preprocessor
    directives. These directives can be placed anywhere in the program, but usually
    they are placed at the beginning of the source code. These directives are not
    terminated with a semicolon because they are not part of the C++ language. The
    list of the preprocessor directives is discussed next.


