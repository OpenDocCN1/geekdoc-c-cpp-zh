  md: '# Chapter 10


    # Inheritance


    # LEARNING OBJECTIVES


    After completing this chapter, you will be able to:


    +   * Understand inheritance

    * Understand single inheritance

    * Understand multilevel inheritance

    * Understand multiple inheritance

    * Understand hierarchical inheritance

    * Understand hybrid inheritance

    * Understand virtual base classes


    # Introduction


    In this chapter, you will learn about reusability, an important feature of OOPs.
    Reusability provides a mechanism with which you can reuse something that already
    exists. This mechanism saves time because you do not need to create the same thing
    again and again. In C++, reusability is used in the case of classes. Once a class
    has been written and debugged, it can be used in several ways. In C++, reusability
    is created by creating a new class from an existing class by reusing its properties.
    The technique of creating a new class from an old one is known as inheritance
    or derivation. The new class is known as derived class or subclass and the old
    class (which is inherited) is known as base class. A derived class can inherit
    some or all the properties of a base class. A derived class can also add some
    properties on its own. The syntax for defining a derived class as follows:'
  merge: -1
