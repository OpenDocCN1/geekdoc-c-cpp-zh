  md: '# Chapter 13


    # Exception Handling


    # Learning Objectives


    After completing this chapter, you will be able to:


    +   - Understand exceptions and their types


    +   - Understand the concept of exception handling


    # INTRODUCTION


    During execution of a program, generally two types of errors are encountered.
    These are as follows:


    +   1. Logical errors


    +   2. Syntactical errors


    The logical errors are those errors that are encountered because of the improper
    understanding of the problems and their solutions. The syntactical errors are
    those errors that are encountered because of the improper understanding of the
    language syntax. These errors are detected and handled during the compilation
    time. But sometimes, during the program execution, some problems occur that are
    neither not syntactical. These errors are known as exceptions. An exception is
    a runtime error or an abnormal condition that terminates the program abnormally.
    C++ provides exception handling mechanism to manage these exceptions. In this
    chapter, you will learn about the concept of exception handling.'
  merge: -1
  pgno: 504
- img_proc: true
  md: '# EXCEPTION HANDLING


    The exceptions are divided into the following two categories:


    +   1. Synchronous

    2. Asynchronous


    The exceptions such as divided by zero, out of range, and so on are known as synchronous
    exceptions. These exceptions occur repeatedly at the same place in a program and
    with the same data each time the program is executed. The exceptions that occur
    because of the external hardware devices such as keyboard are known as asynchronous
    exceptions. These exceptions are beyond the control of the program. In C++, the
    exception handling mechanism is used to manage only the synchronous exceptions.


    You already know that the exception handling mechanism is used to manage the exceptions,
    so that a program can work normally. The exception handling mechanism is carried
    out in the following steps:


    +   1. In the first step, an exception is detected, or in other words, the statements
    due to which the program was terminated abnormally searched. This process is also
    known as hit the exception.


    +   2. After detection, the exception is thrown. This means information is sent
    to the system that an error has occurred. This process is also known as throw
    the exception.


    +   3. The thrown exception is caught by the block of code, which handles the
    exception. This process is also known as catch the exception.'
  merge: -1
  pgno: 505
- img_proc: true
