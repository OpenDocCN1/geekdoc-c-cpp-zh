    Consider a case when you try to allocate memory for a data type with the help
    of the new operator but you find that the available memory is insufficient to
    fill that allocation request. In such a case, an exception (run-time error) will
    be generated by the system. This is known as the bad_alloc exception. If this
    exception is not properly handled, your program will be terminated. The concept
