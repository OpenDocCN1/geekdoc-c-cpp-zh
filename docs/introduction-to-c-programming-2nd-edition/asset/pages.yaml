  md: '# Merging


    Merging means "to combine". This data structure operation is used when you want
    to combine or join two sorted lists. You can merge a list with another list in
    the following ways:


    +   a. The first way is to place the elements of a list (sorted) at the end of
    another list (sorted) and then apply a sorting method to sort the entire list.
    This method is time consuming.


    +   b. The second way is to always match the first element of both the lists and
    place the smaller element in the combined list one by one. When one list is empty,
    place all the remaining elements of the other list at the end of the combined
    list.


    The following example illustrates the concept of merging:


    Suppose there are two arrays. The first array A contains 5 elements, as follows:


    21, 45, 56, 78, 85


    The second array B contains 4 elements, as follows:


    34, 50, 67, 80


    Next, the first elements of both lists (21 and 34) are compared. After that the
    smaller element (21) is placed at the first position in the third array C. The
    array C contains the following element:'
