    # COMPILE TIME POLYMORPHISM, EARLY BINDING, OR STATIC BINDING


    When the required information to call a function is known to the compiler at the
    compile time, it is known as compile time polymorphism, early binding, or static
    binding. Early binding means that an object is bound to its function call at the
    compile time. Examples of early binding are overloaded function calls, overloaded
    operator calls, and so on. The main advantage of early binding is that it is efficient
    and fast because all the information required to make a call to a function is
    known by the compiler at the compile time.


    # RUN TIME POLYMORPHISM, LATE BINDING, OR DYNAMIC BINDING


    When the required information to call a function is known to the compiler at the
    execution time or runtime, it is known as run time polymorphism, late binding,
    or dynamic binding. This binding is in complete contrast to early binding. In
    this type of polymorphism, an appropriate member function is selected dynamically
    during the'
  merge: -1
  pgno: 454
- img_proc: true
  md: 'execution time. This type of polymorphism is accomplished by using virtual
    functions.


    # Virtual Functions


    A virtual function is a member function of the base class, which is overridden
    by the derived class. In the derived class, the entire body of the function declared
    in the base class is replaced with a new set of instructions and it performs different
    operations. A virtual function is declared in the base class with the help of
    the keyword The syntax for defining a virtual function is as follows:


    ```

    virtual return_type fun_name ( list of arguments)

    {

    body of the function;

    }

    ```


    The main difference between a virtual and a nonvirtual member function is that
    a nonvirtual member function is selected by the compiler at the compile time,
    whereas the virtual function is selected dynamically at the runtime or execution
    time.


