    # Fundamentals of Exception Handling Mechanism

    In C++, the exception handling mechanism is built upon the following three keywords:


    +   1. try

    2. throw

    3. catch


    The try block contains the statement or statements, which are monitored for the
    exception. The syntax for defining the try block is as follows:


    ```

    try

    {

    statement or statements;

    }

    ```


    When an exception is detected in the try block, it can be thrown by using the
    throw statement. The syntax for declaring the throw statement is as follows:


    throw exception_type;


    In this syntax, throw is a keyword and exception_type represents an exception.
    Whenever an exception occurs in the try block, as represented by it it is thrown
    with the help of the throw keyword. The throw statement is used in the try block
    as follows:'
