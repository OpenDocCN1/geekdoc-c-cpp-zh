    # OPERATOR PRECEDENCE


    The operator precedence determines the order of execution of operators by the
    compiler. An operator with a high precedence is used before an operator with a
    low precedence.


    For example:


    x=a+b*c


    In this example, the multiplication operator (*) has a higher precedence than
    the addition (+) and the assignment operators So, the value of the variable b
    is multiplied by the value of variable c and then the resultant value is added
    to the variable a (because the addition operator has a higher precedence than
    the assignment operator). Next, the resultant value of the expression (a+b*c)
    is assigned to the variable


    # OPERATOR ASSOCIATIVITY


    When two or more operators have the same precedence in an expression, the order
    in which the operation is performed is defined'
