    # THE FILE POINTERS


    The pointers that are associated with each file in the C++ file system are known
    as the file pointers. These pointers are used to move the cursor in between the
    contents of a file. The following are the two pointers that are associated with
    each file:


    +   1. Input pointer

    2. Output pointer


    The input pointer is used to perform the read operation. It can read the contents
    of a file from a specified location. Whenever a file is opened in the read mode,
    by default the input pointer is set at the start of the file, so that the read
    operation can begin from the start of the file. The input pointer is also known
    as the get pointer. The output pointer is used to perform the write operation.
    Whenever a file is opened in the write mode, the existing contents are deleted
    and the output pointer is set at the start of the file. This ensures that the
    write operation begins from the start of the file. To edit a file, you need to
    open it in the append mode. In this mode, the output pointer moves to the end
    of the file and the new data is added there. The output pointer is also known
    as the put pointer.'
