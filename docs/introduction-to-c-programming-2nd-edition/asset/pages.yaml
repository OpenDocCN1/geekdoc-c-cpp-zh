  md: 'Whenever you perform write operation on a file, the contents are not written
    directly but they are saved in a buffer (storage space). When the buffer is full,
    the contents are written on the specified file of the physical device such as
    hard disk, floppy disk, and so on. If you want to write the contents directly
    on the linked device, even if the buffer is not full, you can do so by using the
    flush( ) function. The syntax for the flush( ) function is as follows:


    ```

    stream_obj.flush();

    ```


    The flush( ) function is used during the write operation.


