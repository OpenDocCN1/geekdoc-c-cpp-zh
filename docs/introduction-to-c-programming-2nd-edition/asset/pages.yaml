    function continues to read characters from an input stream until n-1 characters
    have been extracted or the end of the file has been encountered.


    In this syntax (second type), the getline() function continues to read characters
    from an input stream until n-1 characters have been extracted, the end of the
    file has been encountered, or the delim character has been read. If the delim
    character is encountered, it is extracted but not stored in the array.


    For example:


    ```

    ------;

    ------;

    ifstream;

    in.open("C:\\demo4.txt");

    ------;

    ------;

    in.getline(arr, 10, ''i'');

    ------;

    ```


    In this example, the getline() function continues to read characters until 10
    characters are read, the end of the file is encountered, or the character i specified
    by the delimiter is encountered.


