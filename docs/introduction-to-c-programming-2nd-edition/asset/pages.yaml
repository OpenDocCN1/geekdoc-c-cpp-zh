    # Introduction


    In this chapter, you will learn about virtual functions and also about polymorphism,
    which is another feature of Object-Oriented Programming (OOP). Polymorphism means
    ''one name many forms''. The virtual function is a member function, which is declared
    or defined in the base class and again redefined in the derived class.


    # Polymorphism


    Polymorphism is a Greek term that consists of two words, poly and morph. Poly
    means many and morph forms. So, polymorphism means ''one name many forms''. The
    best example of polymorphism is overloading, which is already implemented during
    function and operator overloading. In overloading, you must have observed that
    more than one function with the same name is presented in a single program. In
    C++, polymorphism is of two'
