    You can place only one preprocessor directive in one line.


    # The #define Directive


    The #define defines an identifier and a replacement token. Whenever the #define
    directive is encountered in the source code, the replacement token will be substituted
    for all the subsequent occurrences of the identifier in the source code. The identifier
    is also known as the macro name and the process of substitution is known as macro
    replacement. The syntax is as follows:


    ```

    #define macro_name replacement_token

    ```


    For example, to use the word PI for the value you can write the following statement:


    ```

    #define PI 3.14159

    ```


    In this example, the word PI represents the macro name and the value 3.14159 represents
    the replacement token. The #define directive directs the preprocessor to replace
    the word PI with the specified value each time it is encountered in the source
    code.'
