    In pass1, the smallest element in the list is searched, which is 10. Next, it
    is interchanged with the first element (70). Now, the array A contains the following
    list:


    ```

    10, 30, 40, 70, 80, 20, 60, 50

    ```


    In pass2, the second smallest element is searched, which is 20. It is interchanged
    with the second element (30). After this pass, the first two elements are at their
    appropriate positions and in a sorted order. The array A now contains the following
    list:


    ```

    10, 20, 40, 70, 80, 30, 60, 50

    ```


    This process will be repeated until all the elements in the list are at their
    appropriate positions. This list is sorted in 7 passes. Finally, array A contains
    the following list:


    ```

    10, 20, 30, 40, 50, 60, 70, 80

    ```


