    # Binary search


    The binary search is a technique to search an element in a sorted array. This
    technique is used when the numbers of elements are in a large quantity. In this
    technique, at first the median of the list is found. Then, the desired value is
    compared with the value of the median. If the desired value is less than the value
    at the median, you will find the desired value in the list of elements that comes
    before the median. If the desired value is greater than the value at the median,
    you will find the desired value in the list of elements that comes after the median.
    The first half of the list is eliminated. This process is repeated until a suitable
    match is found or the list becomes empty. The complexity of this method is denoted
    as follows:


    C(n) = n

    For example, if a value is searched in a list of 10,000 elements, not more than
    13 comparisons are required.


