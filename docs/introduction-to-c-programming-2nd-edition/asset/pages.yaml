  md: 'The programs, during execution, may need to take decisions and repeat a particular
    block of code a number of times. C++ provides control structures or control statements
    that specify the order of the execution of the statements. The control structures
    control the flow of the execution in a program. The control structures are of
    three types:


    +   a. Sequential control structure

    b. Selection or Decision control structure

    c. Repetition, Iteration, or Loop control structure


    # SEQUENTIAL CONTROL STRUCTURE


    In a sequential control structure, the program statements are executed one after
    the other in the same order as they appear in the program. In all programming
    languages, the sequential control is used as the default control. All the programs
    that have been described in the earlier chapters are sequential.


    # SELECTION OR DECISION CONTROL STRUCTURE


    The selection or decision control structure is used to alter the flow of control
    in a program. The flow of control depends on the result of a particular condition
    applied to it. C++ supports three different types of selection control structures:


    +   a. if

    b. if-else

    c. switch


