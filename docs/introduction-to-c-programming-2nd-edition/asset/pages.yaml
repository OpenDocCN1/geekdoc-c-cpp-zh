    # Searching


    Searching means to look for a particular record or a set of records that satisfy
    a given condition or match a given key value. The search operation is performed
    in the following two ways:


    +   a. Linear search

    b. Binary search


    # Linear search


    The Linear search, also known as the sequential search, is one in which each record
    or node is searched in a data structure, one at a time. This process starts from
    the beginning of a particular data structure and continues till a match is found.
    This search method is applicable when the numbers of data elements or nodes in
    a particular data structure are less. This is because the time taken by this method
    is proportional to the number of comparisons. The complexity is used to measure
    the time and space used by an algorithm (which means steps to solve a particular
    problem). The complexity of this search method for a data structure with n elements
    is n/2. It is also denoted as C(n)=2. The best case is that in which only one
    comparison is made. The worst case is one in which no match is found and the search
    is done for n number times.


    For example, you have an array DEMO of 10 elements and you want to search a given
    value VALUE In a linear search, VALUE is compared with each element of DEMO one
    by one. At first DEMO[1] = VALUE is tested to see if the first element of the
    array DEMO is equal to the given value If it is equal, the search will be stopped.'
