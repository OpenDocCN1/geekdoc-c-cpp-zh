    # The for Loop


    The **for** loop is also a flow control structure that is used to execute a particular
    block of code for a specific number of times. The **for** loop is mostly used
    when you know the number of times the body of the loop will be executed. The **for**
    loop is easy to understand because all the control elements (initialization, condition,
    and increment or decrement) are placed together at one place. The syntax for the
    **for** loop is as follows:


    ```

    for(initialization; condition; increment or decrement)

    ```


    In this syntax, the **for** loop consists of three expressions: initialization,
    condition, and increment or decrement. These three expressions must be separated
    by using a semicolon (;).


    # Initialization Expression


    The initialization expression executes only once at the start of the loop. It
    is used to set the initial value of the loop control variable such as **int**


    # Condition Expression


    The condition expression is evaluated each time before the execution of the body
    of the loop. The execution of the body of the loop depends on the condition whether
    it is true or false. If the condition is true, the body of the loop will be executed.
    Otherwise, it will be skipped and the control will be transferred to the next
    instruction after the **for** loop.'
