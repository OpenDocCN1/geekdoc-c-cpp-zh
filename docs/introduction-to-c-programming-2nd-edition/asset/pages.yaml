    # Making the Private Members of a Base Class Inheritable


    In the earlier sections, you have seen that the private members of a base class
    cannot be inherited and are not directly available to the derived class. In case
    the private data needs to be inherited by a derived class, you can simply do it
    by modifying the visibility limit of a private member by making it public or


    When the visibility limit of private members of a base class is changed to the
    members are accessible by all the functions within the same class and also by
    the functions of the other classes. This method makes the members and this eliminates
    the feature of data hiding.


    Another way is to change the visibility limit of the private members of a base
    class by declaring them as protected members. This results in only a limited access
    to the members of a class. The protected members of a class are only accessed
    by the members of the same class and any class that is immediately derived from
    it. The syntax for defining protected members in the definition of a class is
    given next.'
