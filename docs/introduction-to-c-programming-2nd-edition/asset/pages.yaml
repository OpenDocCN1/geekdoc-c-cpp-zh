    b. Explicit type casting


    # IMPLICIT TYPE CASTING


    In implicit type casting, the conversion is done automatically by the compiler.
    In this type of conversion, a smaller data type is converted into a larger data
    type. For example, a float value can be converted into a double value because
    the size of the float value is 4 bytes and the size of the double value is 8 bytes.
    So, it is possible for a double variable to take a float value. No operator is
    required in an implicit conversion. This is done without any intervention of the
    programmer.


    # EXPLICIT TYPE CASTING


    In explicit type casting, the conversion is carried out between two incompatible
    types. For example, a float value can be converted into an integer value. This
    is done with the help of the (type) operator. The syntax for this operator is
    as follows:


    ```

    data_type var1 = (type) var2

    ```


    For example:

    int i = (int) 10.23


    In this example, the value (10.23) is converted into an integer value (10) and
    after that the resultant value (10) is assigned to the variable Here int is used
    as a (type) operator to convert the float value into an integer value.'
