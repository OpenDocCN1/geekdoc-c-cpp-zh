    \ keyword in the declaration statement. The characteristic of a static data member\
    \ is that only one copy is created for the entire class and all the objects share\
    \ the same copy. All the static data members are initialized to zero before the\
    \ creation of the first object. The syntax for declaring a static data member\
    \ is as follows:\n\n```\nclass class_name\n{\nstatic data_type var_name;//declaration\n\
    ----------\n        ;\n}\ndata_type class_name :: var_name;//definition\n```\n\
    \nIn this syntax, the declaration part contains a keyword which directs the compiler\
    \ that only one copy of the data member, specified by is created for the entire\
    \ class. When a static variable is declared inside the definition of a class,\
    \ no memory space is allocated to it and it cannot be used for the entire class.\
    \ So, to make it global and to provide enough memory space to it, it must be defined\
    \ outside the definition of a class with the help of the scope resolution operator\
    \ The static data member is defined outside the class in the same way as a function\
    \ is declared outside the definition of a class.\n\nYou can also assign an initial\
    \ value to a static data member in the definition. The syntax is as follows:"
