    # Pure Virtual Functions


    In the previous example, you have observed that the virtual member function of
    the base class is not overridden by the derived class. In such a case, the function
    defined in the base class is accessed. However, there may be a situation when
    the virtual function is not defined in the base class. In such a case, C++ supports
    the pure virtual function.


    A pure virtual function is a virtual function, which does not contain any definition
    within the base class. The syntax for declaring a pure virtual function is as
    follows:


    ```

    virtual return_type fun_name(list of arguments) =0;

    ```


    In the case of pure virtual function, when a derived class is not able to override
    the virtual member function of the base class, a compile-time error occurs.


