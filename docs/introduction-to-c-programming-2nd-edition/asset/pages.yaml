    # The Predefined Streams


    In C++, whenever a program starts its execution, there are some streams that are
    automatically included in the program. These streams are known as predefined streams.
    The following are the predefined streams in C++:


    +   1. cin

    2. cout

    3. cerr

    4. clog


    The cin is an input stream that is connected to an input device, which can be
    a keyboard, any other input device, or any storage device.


    The cout is an output stream that is connected to an output device, which can
    be a screen or any other output device.


    The cerr is an error output stream, which is used to write an unbuffered (not
    saved) output to the standard error device, which is usually a screen.'
