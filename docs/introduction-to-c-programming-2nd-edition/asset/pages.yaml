  md: 'Dynamic memory allocation means memory is allocated and deallocated (releasing
    the memory) at runtime when the program is being executed. The main advantage
    of dynamic memory allocation is that you can increase or decrease the size of
    the data structure at the execution time. There are two operators that are used
    for dynamic memory allocation. These are as follows:


    +   a. new


    +   b. delete


    # THE NEW OPERATOR


    The new operator is used to allocate the memory dynamically for a specified data
    type at runtime.

    You can define a pointer and request that the memory be allocated at the execution
    time. It returns a pointer that contains the starting address of that memory.
    The syntax for declaring the new operator is as follows:


    ```

    pointer_var = new type;

    ```


    In this expression, the pointer_var represents a pointer variable. This pointer
    variable is used to receive a pointer that contains the starting address, which
    is returned by the new operator.

    The type specifies the type of data, which is pointed by the pointer variable.


    For example:


    ```

    int *p1;

    p1= new int;

    ```'
