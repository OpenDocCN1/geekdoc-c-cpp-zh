  md: "```\nclass derived_class_name : access_specifier base_class_name\n{\n    data\
    \ members;\n    access_specifier:\n    member functions;\n};\n```\n\nIn this syntax,\
    \ the name of the derived class is represented by Here,\nthe colon (:) specifies\
    \ that the derived class represented by\n**derived_class_name** is derived from\
    \ the base class represented bynThe access_specifier specifies the visibility,\
    \ which indicates how the\ndata members and member functions of a base class can\
    \ be\naccessed by the objects of the derived class. An access specifier can\n\
    be **public** or if no access specifier is defined, it is **private** by default.\n\
    \nFor example:\n\n```\nclass derived_demo : public base_demo\n{\n    data members\
    \ of derived_demo;\n    public:\n    member functions of derived_demo;\n};\n```\n\
    \nIn this example, the base class **base_demo** is publicly inherited by\nt derived\
    \ class The public members of the base class can be\naccessed by the objects of\
    \ the derived class because they become\npublic to the derived class."
