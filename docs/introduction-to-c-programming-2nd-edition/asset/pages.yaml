    In this syntax, the ret_type specifies the type of data returned by the function.
    The fun_name specifies the name of the function, which is used as a reference
    in the program. The argument list receives the values that are passed when a function
    call is made in the program. The function declaration must be terminated by a
    semicolon (;).


    # Defining the Body of a Function


    The body contains the statements that are executed when a function call is made
    in the program. The function body specifies the behavior of the function. The
    syntax is as follows:


