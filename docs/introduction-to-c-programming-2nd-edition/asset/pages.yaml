  md: '# Chapter 1


    # Introduction to C++


    # LEARNING OBJECTIVES


    After completing this chapter, you will be able to:


    +   * Understand the concept of procedure-oriented programming

    * Understand the concept of object-oriented programming

    * Understand the features of object-oriented programming

    * Understand the fundamentals of C++

    * Understand the >>(extraction) and<<(insertion) operators


    # Introduction


    In early 1980s, a new programming language was developed by Bjarne Ststrup at
    Bell Laboratories, USA. This language, an extended version of C language, is known
    as C++. Apart from the features of the C language, C++ also has some additional
    features such as classes, objects, and so on. When C++ language was developed,
    it was known as ''C with classes''. In 1983, the name was changed to C++. The
    ++ sign specifies that it is an incremented version of the C language. This means
    that the code written in C can also be executed in the C++ environment. Basically,
    C++ was developed to eliminate some of the limitations of the C language and also
    to provide some new features to the user.


    In this chapter, you will know about procedure-oriented programming, key concepts
    of object-oriented programming, and also some C++ fundamentals.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Procedure-Oriented Programming


    Procedure-oriented programming (POP) is a programming technique in which a problem
    is divided into subparts. These subparts are solved by using different functions.
    In this type of programming technique, all the programs are developed around functions.
    These functions work on global data (data that can be accessed by all the members
    of a program) and can also manipulate it. In this type of programming technique,
    the primary focus is on the functions. For example, you may want to solve a problem
    that performs three different operations such as reading data from the user, processing
    the data, and printing the output. Three different functions are created to handle
    these operations, see Figure 1-1. This figure illustrates that all the three operations
    are performed by three different functions.


    ![](img/84752854c60c73abd7e1344e8eba414b_13_0.png)


    Figure 1-1 Representation of an POP


    In procedure-oriented programming, the data that can be accessed by all the functions
    is declared as global. Each function can also have its own local data.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'A major drawback of procedure-oriented programming is that the data is not
    treated as a critical element and can be manipulated by any of the functions.
    Another drawback is that you cannot solve the real world problems by using the
    procedure-oriented technique. As the size of the program increases, it becomes
    more complex and difficult to understand.


    # Object-Oriented Programming


    Object-oriented programming (OOP) developed to overcome the limitations of the
    procedure-oriented programming is an improved technique for developing the programs.
    In case of OOP, the data is treated as the most critical element and the primary
    focus is on the data and not on the procedures. In this technique, the data is
    grouped together with the functions that operate on it. A problem is divided into
    entities known as objects. Each object maintains its own copy of data and functions.
    The data cannot be accessed directly by the other objects of the program. It can
    only be accessed through a proper interface such as functions, as shown in Figure
    1-2.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/84752854c60c73abd7e1344e8eba414b_15_0.png)


    Figure 1-2 Representation of OOP


    # FEATURES OF OBJECT-ORIENTED PROGRAMMING


    There are certain features that have made object-oriented programming very popular.
    These features are as follows:


    +   1. Objects

    2. Classes

    3. Encapsulation

    4. Inheritance

    5. Polymorphism


    # Objects'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'In object-oriented programming, a problem is divided into certain basic entities
    called objects. The objects can be used to represent real life objects such as
    people, bank account, and so on. In this type of programming, all communication
    is carried out between the objects. When a program is executed, the objects interact
    with each other by sending messages. The objects contain the data and the functions
    that can be used to manipulate the data. Each object maintains its own copy of
    the data and methods, which can communicate with each other through a proper channel
    or interface.


    # Classes


    A class is a user-defined data type which is used to group the data and the functions
    together. These objects are the instances of a class. A class can also contain
    important members such as a constructor to create objects. The objects that belong
    to same class must have certain properties in common. For example, a table and
    a chair are the objects of the furniture class. Both the objects have certain
    properties in common. For example, both are made of wood and so on.


    # Encapsulation


    Encapsulation is a mechanism used for wrapping up the data along with the functions
    that can operate on the data directly. This mechanism is used to keep the data
    safe from outside interferences. It hides the internal data and only provides
    the external interface (functions) through which it can be accessed. Encapsulation
    also provides the concept of data hiding or information hiding so that it cannot
    be accessed directly.


    # Inheritance


    Different kinds of objects often have certain amount of properties in common with
    each other. Inheritance is the process by which one'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'object can acquire the properties of another object. This is called the reusability
    of code. In inheritance, whenever a new object is created, it can only define
    those properties that make it unique from the other objects. Inheritance supports
    the concept of the hierarchical classifications. For example, the fruit ''Apple''
    is a part of the class ''Fruits'', which is again a part of the class ''Food'',
    as shown in Figure 1-3.


    ![](img/84752854c60c73abd7e1344e8eba414b_17_0.png)


    **Figure 1-3** Hierarchical classification


    In the above figure, the two classes Fruits and Vegetables, apart from inheriting
    certain properties from the class Food, add some properties of their own. The
    classes Apple and Mango inherit the properties of the Fruits while the classes
    Cabbage and Carrot inherit the properties of the Vegetables class.


    # Polymorphism


    Polymorphism is another feature of object-oriented programming. Polymorphism is
    a Greek term that consists of two words, poly and morph. Poly means many and morph
    forms. So, polymorphism means ''one name many name forms''. In polymorphism, an
    operation shows different behaviors depending on the type of data used in it.
    In polymorphism, the internal structure (functioning) of the operation is different
    but the external interface (name) is the same. When an operator shows different
    behaviors in different contexts, it is known as operator overloading. When a single
    function'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'name is used to perform different operations, it is known as function overloading,
    as shown in Figure 1-4.


    ![](img/84752854c60c73abd7e1344e8eba414b_18_0.png)


    Figure 1-4 Polymorphism


    # Concept of c++


    In the C++ programming, you can write a sequence of commands called source file.
    A C++ source file normally carries the .CPP extension. This source file can be
    converted into a machine-language program. This conversion is called compiling
    and is done by the compiler. The machine code is combined with some setup and
    instructions and some standard library routines in a process known as linking.
    Together, compiling and linking are known as building. The resulting machine-executable
    files carry the extension .EXE in Windows.


    # Code::Blocks Environment


    Code::Blocks is an open-source platform IDE (integrated development environment)
    that supports multiple compilers. It comes in an easy-to-install, compressed executable
    file that is compatible with all versions of Windows, Macintosh, and Linux.'
