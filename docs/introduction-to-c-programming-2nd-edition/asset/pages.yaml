  md: '# Prefix Increment and Decrement Operators


    The prefix increment operator (++) increases the value of its operand by one.
    So, in prefix notations, the value of the operand is increased by one and then
    it is assigned to the variable on the left side. In these notations, the operator
    is used before the operand (++a). The syntax for using the prefix increment operator
    is as follows:


    ```

    var1 = ++var2

    ```


    In this syntax, the value of the var2 is increased by one and then it is assigned
    to prefix decrement operator (-) is the same as prefix increment operator, except
    that in the former the value of the operand is decremented by one.


    # Postfix Increment and Decrement Operators


    The postfix increment operator (++) also increases the value of its operand by
    one. In the postfix notations, the increment is done after the value of the operand
    is assigned to the variable on the left side. In these notations, the operator
    is used after the operand (a++).


    The syntax for using the postfix increment operator is as follows:


    ```

    var1 = var2++

    ```


    In this syntax, the value of the variable var2 is assigned to the variable Next,
    the value of the variable var2 is incremented by one. The following example illustrates
    the use of the increment operators.'
