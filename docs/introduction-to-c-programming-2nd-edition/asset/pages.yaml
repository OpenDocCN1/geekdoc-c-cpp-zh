    # DEFINING A POINTER


    A pointer is a variable that can hold the memory address of another variable.
    In other words, a pointer variable is used to access the value stored in another
    variable. Figure 5-3 provides the pictorial representation of a pointer.


    ![](img/84752854c60c73abd7e1344e8eba414b_209_0.png)


    Figure representation of a pointer


    In this figure, the values 1000 and 1005 represent the memory addresses. In this
    figure, the memory address 1000 points to another memory address 1005 and can
    access the value 5 stored in it.'
