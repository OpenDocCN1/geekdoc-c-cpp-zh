  \n![image](img/u07-077-9780443222191.jpg)\n\n我们可以这样调用该函数：\n\n![image](img/u07-078-9780443222191.jpg)\n\
  \n它将产生输出：\n\n![image](img/u07-079-9780443222191.jpg)\n\n可变参数模板通常使用递归实现。也就是说，我们处理第一个参数，然后用剩余参数再次调用该函数模板。这将通过调用函数的重载版本来结束，从而停止递归，该版本被称为基准情况（base\
  \ case）。这就是上一个示例中非模板化的 `printLine` 函数的作用。详细遍历该这一过程：\n\n* 1. 我们从初始调用开始：\n\n![image](img/u07-080-9780443222191.jpg)\n\
  \n* 2. 这导致第一个参数被输出，然后使用剩余参数递归地调用函数：\n\n![image](img/u07-081-9780443222191.jpg)\n\
  \n\n\n\n## 5. 破坏性变更 (Breaking Changes)\n\n以下 C++11 特性值得考虑，但可能会导致客户端破坏性变化：\n\n1.\
  \ **智能指针**：从原始 C 指针切换到智能指针将涉及使用不同的类型来表示指针。这可能要求你的客户端更改代码（除非他们是从你的源代码编译，并且已经修改代码以使用\
  \ C++11 的 `auto` 关键字来存储你的指针）。然而，使用智能指针带来的安全性收益是巨大的，因此非常值得考虑采用它们。\n\n2. **枚举类 (Enum\
  \ classes)**：枚举的大小可能与枚举类不同，因此在它们之间切换无法保证具有二进制兼容性。此外，你的客户端在引用其值时必须更改代码以包含枚举名称。在某些情况下，为了破坏\
  \ API 兼容性而迁移到枚举类可能并不值，但如果你正在添加新功能，则应该优先使用枚举类而不是传统的 C++03 枚举。\n\n3. **内联命名空间 (Inline\
  \ namespaces)**：这是在你的 API 中引入健壮版本控制的一种极方法。但是，如果你尝试向现有 API 中添加此功能，它将更改符号的名称修饰（name\
  \ mangling），从而破坏 ABI 兼容性。不过，如果你足够严谨，这仍然是可以保持源代码兼容性的。\n\n4. **Final 关键字**：在现有类上添加\
  \ `final` 修饰符可能不会破坏 ABI。但是，如果客户端已经编写了代码来重写 `final` 函数或继承自 `final` 类，那么他们的代码现在将因为你的新限制而无法编译。因此，这是你可以选择对现有\
  \ API 执行的操作，但你理应该先咨询你的客户端，查看他们的代码是否会损坏，并在发生损坏时了解他们的用例。\n\n5. **变参模板 (Variadic templates)**：如果你之前使用\
  \ `va_arg` 来实现对可变参数的支持，可以考虑使用变参模板来代替，以提供更高效且类型类型安全的解决方案。然而，尽管函数调用语法可以保持相同，但这两种方法在\
  \ ABI 上是不兼容的，因此如果你以二进制形式分发你的库，此此更改将破坏客户端的项目。\n\n## C++14 API 特性\n\nC++14 于 2014\
  \ 年 12 月发布，作为 C++11 的一个次版本更新。它主要包含了一些错误修复和渐进式改进，因此我在这里涵盖的特性列表没有 C++11 那么大。然而，对于你的\
  \ API 设计，有一些值得关注的新特性我们将讨论。\n\n截至 2012 年，C++ 标准委员会承诺按照每 3 年一次的定期计划发布 C++ 国际标准的更新。尽管如此，在最终发布日期正式确定之前，C++14\
  \ 在开发期间有时被称为 `C++1y`，就像 C++11 早期被被称为 `C++0x` 一样。\n\n### auto 返回类型\n\n回想 C++11 引入了后续返回类型（trailing\
  \ return type）函数样式，看起来如下：\n\n![image](img/u07-086-9780443222191.jpg)\n\nC++14 通过引入函数返回类型推导更进了一步。本质上，你不再需要在参数列表之后定义函数返回类型。相反，返回类型将根据函数体内定义的实际返回语句进行推导。因此，之前的函数签名可以简化为：\n\
  \n![image](img/u07-087-9780443222191.jpg)\n\n为了支持这种语法，函数体中的所有返回值必须是相同类型。例如，你不能让一个返回语句返回\
  \ `2` 而另一个返回语句返回 `6.0`，因为它们是不同的类型（分别为 `int` 和 `double`）。在显式声明返回类型的普通函数中，这不会报错，因为编译器可以执行到已知返回类型的隐式转换。\n\
  \n更重要的是，以此这样声明的函数可以进行前向，但编译器必须能够在使用它的编译单元中看到函数的实现，以便推导返回类型。例如，假设我们的 `Add` 函数声明在\
  \ `add.h` 头文件中，供 `client.cpp` 中的客户端代码使用：\n\n![image](img/u07-088-9780443222191.jpg)\n\
  \n这段代码将无法编译，因为编译器只看到了 `Add` 的前向声明。然而，客户端需要 `add.cpp` 中的实现。\n\n换句话说，从 API 设计的角度来看，它迫使你暴露实现细节。你应该避免在头文件中中使用它。你应该将其用于返回类型。\n\
  \n### 弃用属性 (The deprecated attribute)\n\n API 生命周期中的一个重要部分是能够弃用旧功能。在 C++14 之前，有特定于编译器的方法来实现这一点，但没有符合标准的解决方案。C++14\
  \ 通过引入 `deprecated` 属性解决了这个问题。你可以使用它来表示某些内容已弃用。你还可以提供一条将被包含在编译器警告中的消息。例如：\n\n![image](img/u07-089-9780443222191.jpg)\n\
  \n使用 `clang` 编译这段代码会产生以下输出：\n\n![image](img/u07-090-9780443222191.jpg)\n\n你可以在函数签名前使用\
  \ `deprecated`，无论它是自由函数、函数模板还是类方法。你也可以将其用于变量定义，以弃用你的 API 可能定义的常量。然而，目前无法用它来弃用整个类、`struct`\
  \ 或 `enum`。\n\n我将在后面的版本控制章节中详细介绍弃用和最终移除 API 功能。\n\n### 变量模板 (Variable templates)\n\
  \n在 C++03 中，你可以创建类和函数的模板版本。C++11 增加了对 `using` 关键字模板类型别名的支持，C++14 增加了变量的模板化。变量模板是根据一个或多个模板参数定义变量或静态数据成员的模板。通用语法为：\n\
  \n![image](img/u07-091-9780443222191.jpg)\n\n例如，我们可以为常量 `pi` 提供定义：\n\n![image](img/u07-092-9780443222191.jpg)\n\
  \n然后我们可以为不同类型实例化此变量模板，例如 `pi<float>` 和 `pi<double>`。这项技术的一个有趣方面是，我们可以使用模板特化为不同类型提供变量的自定义值。例如：\n\
  \n![image](img/u07-093-9780443222191.jpg)\n\n\n\n\n\n（在这些模板中，我使用了 `constexpr`，但使用\
  \ `const` 的 `std::string` 特化除外。这是因为你不能定义 `constexpr` 的 `std::string`，至少在 C++20 之前，或者如果你使用\
  \ `std::string_view` 则在 C++17 中。）\n\n这些定义的定义可以通过以下方式演示：\n\n![image](img/u07-094-9780443222191.jpg)\n\
  \n它将输出以下结果：\n\n![image](img/u07-095-9780443222191.jpg)\n\n因此，如果你引用 `pi<float>`，将获得特化后的值\
  \ 3.1415；如果你引用 `pi<std::string>`，将获得自描述性字符串“pi”。虽然这在抽象上很有趣，但引入变量模板支持的主要原因是 C++ 之前不允许模板声明变量。一种常见的变通方法是将变量封装在模板化的结构体或类中，例如：\n\
  \n![image](img/u07-096-9780443222191.jpg)\n\n然而，这意味着必须引用如 `Pi<float>::value` 这样的变量，而不是像现在使用变量模板那样直接使用\
  \ `pi<float>`。\n\n变量模板只能在全局（或命名空间）作用域内，或作为类的静态数据成员声明。它们对于定义常量最为有用，因此正如你在之前的示例中看到的那样，它们通常被声明为\
  \ `const` 或 `constexpr`。\n\n### 常量表达式改进\n\n在本章较早的 C++11 部分中，我介绍了使用 `constexpr` 在编译时评估变量的值或函数的结果。为了实现这一可行性，对函数体内部可以执行的操作实施了各种限制，以便能够在编译时进行求值。在\
  \ C++14 中，这组限制被放宽，允许常量表达式函数中包含更复杂的逻辑。具体来说，这些函数现在可以包含：\n\n1. 带有初始化器的声明，但 `static`\
  \ 或 `thread_local` 变量除外。\n2. 条件分支语句（例如 `if` 和 `switch`）。\n3. 循环语句（例如 `for` 和 `while`）。\n\
  4. 改变函数内定义对象值的表达式。\n\n例如，此函数由于使用了循环和局部变量，在 C++11 中无法编译。但它在 C++14 中可以编译：\n\n![image](img/u07-097-9780443222191.jpg)\n\
  \n因此，如果你在支持 C++14 或更高版本的环境中构建项目，你就可以更复杂的常量表达式函数，从而提供更多编译优化的机会。\n\n### 二进制字面量和数字分隔符\n\
  \nC++ 一直支持以不同的基数声明数值常量。当然有默认的 10 进制，以及使用 `0x` 前缀的十六进制（16 进制）常量（例如 `0xdeadbeef`）和使用\
  \ `0` 前缀的八进制（8 进制）常量（例如 `0172`）。C++14 引入了使用 `0b` 或 `0B` 前缀定义二进制（2 进制）数值字面量的能力。当你在定义更适合用二进制表示的\
  \ API 常量（例如位掩码）时，这可能有用。例如：\n\n![image](img/u07-098-9780443222191.jpg)\n\n另一个与数值字面量相关的\
  \ C++14 变化是引入了单引号字符作为整数和浮点字面量的数字分隔符。该引号字符对数字的解释没有影响，但它可以用于通过将值拆分成较小的部分来方便人类解析大数字，例如：\n\
  \n![image](img/u07-099-9780443222191.jpg)\n\n### 迁移到 C++14\n\n正如在本节引言中提到的，C++14\
  \ 相比 C++11 更新要小得多，主要关注细微改进和错误修复。\n\n影响 API 设计的主要 C++14 新功能是对弃用函数和常量的标准化支持。对于我们可以使用的来说，这是一个非常重要的功能，因为大多数长寿命\
  \ API 都需要在某个点通过设计更改来处理新功能、提供更通用的能力，甚至破坏后兼容性。引入此类 API 设计更改的最优雅方式是：\n\n1. 在你的 API\
  \ 中引入执行某些任务的新方法。\n2. 将执行任务的现有方法标记为弃用（deprecated）。\n3. 向所有客户端告知执行任务的新方法，以便他们相应地更改代码。\n\
  4. 一旦所有客户端都迁移到新方法，就可以安全地移除旧方法。\n\n将函数和常量标记为弃用的能力是 API 生命周期中的一个重要部分，当你需要时使用 `[[deprecated]]`\
  \ 属性。\n\n除了这些，我们还涵盖了一些其他影响 API 的 C++14 特，包括：\n\n1. 函数类型推导\n2. 变量模板：正如你所看到的，它们可以使用\
  \ `pi<float>` 而不是 `pi<float>::value`\n3. 常量表达式、二进制字面量和数字分隔符：如果你知道所有客户端都使用 C++14\
  \ 或更高版本可以使用。\n\n## C++17 特性\n\nC++17 标准在 2017 年发布，在其开发期间曾临时。该修订为核心语言增加了许多新功能，包括容器类\
  \ `std::optional`、`std::any` 和 `std::variant`。它还移除了一些旧特性，如 `auto_ptr`（由 `unique_ptr`\
  \ 替换）、`register` 关键字（在 C++11 中已弃用）以及异常规范（如 `void myFunc() throw(int)`）。在后续章节中，我将介绍你可以用于\
  \ API 的关键功能。\n\n### 内联变量\n\n在 C++03 中，如果你想声明一个全局或命名空间作用域常量，你可以尝试：\n\n![image](img/u07-100-9780443222191.jpg)\n\
  \n然而，这会导致包含该头文件的每个编译单元都创建一个变量的内部（即静态）链接副本，导致二进制文件包含多个副本并比预想的要大。避免此问题的标准方法是将变量声明为\
  \ `extern`，然后在 `.cpp` 文件中定义。例如：\n\n![image](img/u07-101-9780443222191.jpg)\n\n这解决了二进制大小问题，但它也有遗憾的缺点：客户端无法通过检查你的头文件查看常量的值，并且你必须跨文件拆分声明和定义。\n\
  \nC++17 通过引入内联变量的支持解决了这个问题。这允许全局或命名空间作用域的变量在头文件中声明为 `inline`。该头文件就可以包含在多个编译单元中，变量在每个编译单元中都具有外部链接，因此链接器将在链接时将所有变量实例合并为一个定义。因此，你可以在你的\
  \ API 常量中避免 `extern`，并直接在头文件中定义所有内容，例如：\n\n![image](img/u07-102-9780443222191.jpg)\n\
  \n你也可以将内联变量用于静态类数据成员。例如，如果你在 C++03 中创建一个类作用域的常量，那么你必须这样做：\n\n![image](img/u07-103-9780443222191.jpg)\n\
  \n\n\n\n你不能在头文件中提供静态数据成员的值。它必须在相关的 `.cpp` 文件中定义。但从 C++17 开始，你可以将静态数据成员声明为 `inline`，这允许你直接在头文件中提供变量的值，例如：\n\
  \n![image](img/u07-104-9780443222191.jpg)\n\n此外，任何 `static constexpr` 类数据成员也是隐式的\
  \ `inline` 变量。因此，你也可以写这样的代码：\n\n![image](img/u07-105-9780443222191.jpg)\n\n由于允许全局变量仅定义在你的头文件中，`inline`\
  \ 变量还可以让你更轻松地创建仅头文件的库。\n\n## 字符串视图 (String views)\n\n原始 C 语言支持以空字符结尾的字符指针或字符数组：例如\
  \ `const char *` 或 `char[]`。这些传递非常高效，因为它们只是指针，但你必须显式地管理这些字符串的内存，通常使用 `malloc()`\
  \ 和 `free()`。\n\nC++98 引入了 `std::string` 对象来存储文本字符串，并提供了各种成员函数来操作字符串。该对象会为你 care\
  \ 好内存管理，但通过值拷贝这些对象的代价可能更高，特别是对于大字符串。因此，通常做法是将 `std::string` 对象作为 `const` 引用传递函数，以避免拷贝字符串数据的开销。\n\
  \nC++17 引入了 `std::string_view` 类，它为只读字符串提供了支持，其传递的成本更低。这些字符串视图通常由两个数值实现：\n\n* 1.\
  \ 指向现有字符数组的指针，例如 `const char *`。\n* 2. 数组的大小，例如 `size_t`。\n\n字符数组本身不被 `string_view`\
  \ 拥有也不被 `string_view` 拷贝，因此你必须小心不要在底层字符数据被删除后使用 `string_view`。此外，与 `std::string`\
  \ 不同，`std::string_view` 可以持有空指针。而且，因为 `string_view` 保留了字符数组大小的特定记录，数组不需要持有终止的空字符。\n\
  \n`std::string_view` 的一个有用特性是它提供了从 `std::string` 和 `const char *` 类型的隐式转换。因此，很容易地向使用\
  \ string view 参数的函数传递不同类型的字符串。例如：\n\n![image](img/u07-106-9780443222191.jpg)\n\n\
  （通过值传递 `std::string_view` 对象是符合惯例的，因为它们拷贝很便宜，并且为编译器提供了更大的优化机会。）\n\n除了将 `std::string_view`\
  \ 用于函数参数外，你可能还会考虑为 `std::string` 数据成员返回一个 `std::string_view`，例如：\n\n![image](img/u07-107-9780443222191.jpg)\n\
  \n然而，字符串视图并不获取字符串数据的拷贝，因此如果客户端在对象被删除后保留了 `GetName()` 返回的字符串视图，其行为将是未定义的并可能导致崩溃。你可以将返回字符串视图认为等同于返回\
  \ `const` 引用或指针，我通常不建议这样做，因为我刚才提到的的生命周期问题，并且因为它返回了指向你私有实现细节的句柄。\n\n出于这些原因，我会避免从函数中返回\
  \ `std::string_view`。确实有方法让它安全（例如返回直到程序结束都存在的静态分配数据），但除非性能提升对你来说真的很重要，否则直接返回 `std::string`\
  \ 是更安全的。对于你的客户端来说，这也不那么意外，因为字符串视图没有提供同样丰富的方法。例如，它们没有 `c_str()` 函数，因为字符串数据可能不是以空结尾的。\n\
  \n同样，如果你没有在你的库中拥有底层的字符串数据，或者你不知道数据的生命周期，我也会避免在类数据成员中存储 `std::string_view`。这与在不知道内存何时会被删除时持有原始\
  \ C 指针是危险的理由是相同的。\n\n核心要点是，字符串视图是一种性能优化特性，在你决定将其暴露在 API 设计中之前，你应该完全理解它。将它们视为仅仅是\
  \ `const char *` 指针，并像对该类型那样做出相同的 API 设计决策是有帮助的。\n\n然而，`std::string_view` 还有另一个好处，它可以用于初始化常量表达式，这是你无法使用\
  \ `std::string` 完成的（至少在 C++20 之前），因为它不是字面量类型。例如，\n\n![image](img/u07-108-9780443222191.jpg)\n\
  \n在这些情况下，源数据是静态分配的并持续到程序结束。`std::string_view` 用于只读，但它可以指向任何子集。`remove_prefix()`\
  \ 方法增加指针并减少大小。\n\n## 可空 (Optional)\n\n有时你可能需要区分有值和无值。例如，如果你在读取一个值，你可能想知道一个值是否被定义。解决此问题的常见方法是使用\
  \ `bool` 来表示。\n\n编程语言中的一个常见问题是可选的概念：本质上，变量可以没有值。C++17 通过 `std::optional` 类引入了这一功能。这里有一个例子：\n\
  \n![image](img/u07-109-9780443222191.jpg)\n\n你可以对可选 执行的基本操作有：\n\n* 1. **创建：** 你可以创建一个空的可选，也可以创建一个带有值的可选。有多种方法可以实现，例如：\n\
  \n![image](img/u07-110-9780443222191.jpg)\n\n* 2. **设置/重置：** 你只需通过赋值对应类型的值来设置可选\
  \ 的值。你可以通过赋值 `std::nullopt` 或调用其 `reset()` 方法让可选不再持有值：即：\n\n![image](img/u07-111-9780443222191.jpg)\n\
  \n* 3. **检查值：** 你可以通过与 `std::nullopt` 比较或使用 `has_value()` 方法来检查可选是否持有值。例如，\n\n\n\
  \n\n**4. 访问值：** 如果你已经检查了可选值（optional）包含一个值，你可以使用 `*` 运算符或 `value()` 方法来访问该值。如果可选值包含一个对象，则你可以使用\
  \ `->` 运算符来访问对象的成员，例如：\n\n![image](img/u07-113-9780443222191.jpg)\n\n`optional`\
  \ 的通常实现方式是它所包含的值是作为可选对象本身的一部分被分配的。也就是说，它不包含一个动态分配的指针。然而，`std::optional` 的接口使用了 `*`\
  \ 和 `->` 运算符，这些运算符通常与指针类型相关。\n\n继续之前的配置文件示例，假设来自文件的设置以一个 `Settings` 对象的形式返回，并为每个设置值配有访问器。我们可以使用\
  \ `std::optional` 作为每个访问器的返回值，这样客户端就可以区分“配置文件中出现了某个值”与“文件中没有定义该值”。例如：\n\n![image](img/u07-114-9780443222191.jpg)\n\
  \n将 `optional` 作为函数的返回值也可以帮助你区分有效返回值和缺失返回值。例如，考虑一个返回某个项在较大集合中偏移偏移的函数：\n\n![image](img/u07-115-9780443222191.jpg)\n\
  \n在这种情况下，如果该项不在集合中，`GetIndex()` 函数可以返回 `std::nullopt`。这避免了引入一个你必须为客户端定义的特殊哨兵值（例如\
  \ `std::string::npos`）。\n\n在你的 API 设计中，`std::optional` 的一些可能用途包括：\n\n1. 区分值与值的缺失，例如知道用户是否为某个设置提供了覆盖值。\n\
  2. 返回某些计算的结果，在这些情况下，结果的缺失并不本质意味着错误，例如在集合中搜索某个项并处理该项未出现的情况。\n3. 允许对可能昂贵的资源进行懒加载，你可以传递一个\
  \ `optional` 并仅在需要时才用实际值对其进行实例化。\n4. 支持另一种表达可选函数参数的方法，特别是对于那些可选值是对象固有属性而不仅仅是函数签名的参数（例如，你可能希望将其通过多次函数调用并保留其可选性），或者你希望在函数体内计算参数的默认值（可能是因为复杂性，或者为了向你的\
  \ API 隐藏它）。\n\n对于你实际上想同时返回有效结果和某种错误代码或信息的情况，像 `std::pair` 或 `std::tuple` 这样的容器会更合适。例如：\n\
  \n![image](img/u07-116-9780443222191.jpg)\n\n或者，如果你使用的是 C++23，可以使用 `std::expected`\
  \ 类模板，我将在本章的后部分详细介绍它。\n\n### Any\n\nC++ 是一种静态类型类型语言，因此所有变量的类型必须在编译时已知。这允许编译器进行更多检查，并避免某些错误在运行时发生。然而，在某些情况下，你可能希望一个变量持有不同类型的值，或者你直到运行时才知道其类型。\n\
  \n例如，JSON 文件格式支持异构数组和字典，因此它们可以包含不同类型的对象。例如，这是一个有效的 JSON 字典：\n\n![image](img/u07-117-9780443222191.jpg)\n\
  \n这个字典有三个不同类型的值（string、int 和 bool）。然而在 C++ 中，你必须为 `std::vector` 或 `std::map` 容器使用特定类型。例如，`std::vector<int>`\
  \ 只能包含整数值而不能包含其他类型。因此，如果我们想将此 JSON 文件读取到 C++ 变量中，我们需要某种方法来定义一个可以持有任何类型变量作为值的 `std::map`。这正是\
  \ C++17 中新的 `std::any` 类型所做的：\n\n![image](img/u07-118-9780443222191.jpg)\n\n在 C++17\
  \ 之前，你可能使用 `void*` 作为持有任何类型的方法，但现在 `std::any` 提供了一种类型安全的方式来实现相同的功能。这对于许多应用有用，例如传递任意消息值、表示不同类型设置的值、实现脚本语言的某些特性，以及之前解析支持异构容器的数据文件的示例。\n\
  \n在 `std::any` 类型上可以执行的基本操作包括（假设假设名为 `anyVal` 的 `std::any` 变量）：\n\n1. `anyVal.has_value()`：检查对象是否持有一个值。\n\
  2. `anyVal.reset()`：销毁任何对象。\n3. `anyVal.type()`：返回包含对象的类型。\n4. `std::any_cast<T>(anyVal)`：对包含的对象进行类型安全的访问。如果对象不匹配则抛出异常。例如\n\
  \n![image](img/u07-119-9780443222191.jpg)\n\n使用 `std::any` 时需要注意的主要问题是它可能是用 `void`\
  \ 实现的，因为类型的最大大小在编译时无法未知。因此它涉及到根据你的用法进行动态分配。如果你有一个需要支持的小类型集合，那么使用 `std::variant`\
  \ 可能更高效，我将在接下来介绍它。\n\n### Variant\n\n`std::variant` 类模板在 C++17 中引入，作为联合体（union）类型的类型安全替代方案，它是一个任何时候只能持有其一个成员的对象，其大小由最大成员的大小决定。例如，在\
  \ C++98（和 C）中你可以定义一个联合体来持有多种类型。标准做法是将其与一个变量配对以跟踪当前持有的类型：即\n\n![image](img/u07-120-9780443222191.jpg)\n\
  \n使用联合体的缺点是你很容易引用一个与数据类型不匹配的成员。例如，给定之前的定义，你可以将 `mFloatValue` 设置为 `3.1415` 但仍然访问\
  \ `mIntValue`。这实际上会返回一个垃圾值。相反，现在你可以使用 variant 以更类型安全的方式表示相同的内容，如：\n\n![image](img/u07-121-9780443222191.jpg)\n\
  \n该 variant 可以持有 int、float 或 bool。例如\n\n![image](img/u07-122-9780443222191.jpg)\n\
  \n结合之前 `std::any` 部分的 JSON 文件示例，如果我们知道数据文件字典只会包含字符串、整数或布尔，我们可以用 `std::variant` 替换用于字典值的\
  \ `std::any`。这样做的好处之一是 `std::variant` 不在堆上动态分配分配其值：\n\n![image](img/u07-123-9780443222191.jpg)\n\
  \n在 variant 上可以执行的基本操作如下（对于名为 `varVal` 的 variant 变量）：\n\n1. `varVal.index()`：返回当前持有的替代方案的从零开始的索引。\n\
  2. `std::get<size_t>(varVal)`：返回偏移量处替代方案的值，例如对于指定的第一个类型返回 0。索引越界时抛出异常。\n3. `std::get<T>(varVal)`：返回给定类型替代方案的值，例如\
  \ `std::string`。如果该类型不在 variant 中则抛出异常。\n\n\n\n\n\n## 4. `std::holds_alternative<T>(varVal)`：检查当前存储的变体是否为给定的类型，例如\
  \ `std::string`。\n\n你也可以继承自 `std::variant`。如果你想扩展 `variant` 的功能，这可能会很有用，例如添加一些简单的访问器，或者通过定义\
  \ `<<` 运算符来添加对输出流的支持。例如：\n\n![image](img/u07-124-9780443222191.jpg)\n\n## 嵌套命名空间\n\
  \n正如我们已经看到的，命名空间（namespaces）的使用是 API 设计中的一项重要特性，可以确保你的符号不会与其他库中的符号冲突。命名空间可以嵌套，这是一个将你的符号名称划分为若干类的有用功能，例如：\n\
  \n![image](img/u07-125-9780443222191.jpg)\n\n在 C++17 中，你现在可以使用单个命名空间语句声明嵌套命名空间，例如：\n\
  \n![image](img/u07-126-9780443222191.jpg)\n\n这种语法不仅更加紧凑，还与你在 `using` 语句中引用嵌套命名空间的方式，或者使用完全限定名引用该命名空间中的符号的方式，提供了一种令人满意的对称性，例如：\n\
  \n![image](img/u07-127-9780443222191.jpg)\n\n利用嵌套命名空间通常会导致很长的复合名称，特别是在无法使用 `using`\
  \ 指令的头文件中。然而，你可以使用命名别名（namespace aliases）来生成更短的替代名称，以提高可读性并减少客户端必要的输入量。例如，\n\n![image](img/u07-128-9780443222191.jpg)\n\
  \n### 折叠表达式\n\n你可能在在本章前面的部分回过，C++11 引入了变长模板（variadic templates）的概念。这为可以接受不同类型数量参数的函数提供了类型安全的支持。正如我所指出的，这些通常是递归实现的，需要定义一个重载的基例情况函数来终止递归。例如，接下来的\
  \ C++11 代码允许你相乘任意数量的值：\n\n![image](img/u07-129-9780443222191.jpg)\n\nC++17 引入了一种名为折叠表达式（fold\
  \ expressions）的特性，它可以帮助我们进一步简化此类代码并避免使用递归。这允许你将二元运算符应用到参数包中的所有参数。例如，这里有一个使用乘法运算符的折叠表达式（周围的括号是必须的）：\n\
  \n![image](img/u07-130-9780443222191.jpg)\n\n对于一个带有四个参数的参数包，编译器将将其原地展开为：\n\n![image](img/u07-131-9780443222191.jpg)\n\
  \n这被称为一元左折叠（unary left fold）。还有一元右折叠（unary right fold）以及二元左折叠和二元右折叠。我在表 7.1 中定义了这四种折叠表达式类型的通用形式，并附带了一个假设带有四个参数和乘法运算符的展开示例。\n\
  \nTable 7.1\n\nC++17 引入的折叠表达式类型。\n\n| 名称 | 折叠表达式及展开示例 |\n| --- | --- |\n| 一元左折叠\
  \ | `(... op args)(((args[1] ∗ args[2]) ∗ args[3]) ∗ args[4])` |\n| 一元右折叠 | `(args\
  \ op ...)(args[1] ∗ (args[2] ∗ (args[3] ∗ args[4])))` |\n| 二元左折叠 | `(init op ...\
  \ op args)((((init ∗ args[1]) ∗ args[2]) ∗ args[3]) ∗ args[4])` |\n| 二元右折叠 | `(args\
  \ op ... op init)(args[1] ∗ (args[2] ∗ (args[3] ∗ (args[4] ∗ init))))` |\n\n通过这个\
  \ C++11 变长模板示例，我们可以使用折叠表达式来表示它，这允许我们移除基例重载函数并避免递归，如下：\n\n![image](img/u07-132-9780443222191.jpg)\n\
  \n我们还可以使用 C++14 简化这一点，从而消除需要（然而）：\n\n![image](img/u07-133-9780443222191.jpg)\n\n\
  当我们谈到这个话题时，值得注意的是 C++17 引入了逗号运算符，例如我们使用逗号运算符然后迭代：\n\n![image](img/u07-134-9780443222191.jpg)\n\
  \n在这个例子中，调用 `printTypes(1, true)` 将输出\n\n### 检查头文件的可用性\n\n你的库可能有可选依赖，即如果存在你可以利用的其他库，但如果不存在你的代码将忽略它们。例如，可能你的库依赖\
  \ `libz` 来压缩数据，但如果 `libz` 不可用，你的库仍然可以编译但不支持压缩功能。实现此点的传统方法是在代码中某些定义，例如：\n\n![image](img/u07-135-9780443222191.jpg)\n\
  \n然后你的客户端可以使用编译器选项（例如 `-DHAVE_ZLIB`）在库可用时设置定义。或者你可以使用某些配置脚本尝试查找库，如果找到，则更新你的编译行以包含定义。这使得编译你的代码变得复杂，因为客户端必须为环境指定正确的定义或运行某些配置脚本。\n\
  \nC++17 允许你的代码直接检查头文件是否可用（即 `#include` 语句是否成功），这可以极大地简化这种情况。这是通过 `__has_include`\
  \ 预处理指令实现的；例如：\n\n![image](img/u07-136-9780443222191.jpg)\n\n（在 `__has_include`\
  \ 中你可以同时使用 `\"header\"` 和 `<header>` 语法。）\n\n在此代码段中，`zlib.h` 头文件只有在编译器能够在头文件搜索路径中找到它时才会被。根据是否可以包含，代码还会设置或取消\
  \ `HAVE_ZLIB` 定义。\n\n\n\n\n\n如果你需要支持未使用支持 C++17（或更高版本）编译器的客户端，你仍然可以在该功能周围添加额外的预处理器检查来继续使用它。例如：\n\
  \n![image](img/u07-138-9780443222191.jpg)\n\n如果这段代码被不支持 `__has_include` 指令的 C++11\
  \ 编译器遇到，它将无法进入第一个 `#if` 块，从而取消 `HAVE_ZLIB` 的定义；而 C++17（或更高版本）编译器则会进入第一个 `#if`，然后检查\
  \ `zlib.h` 头文件是否存在。你也可以让非 C++17 的代码路径在 `HAVE_ZLIB` 被定义时尝试包含该头文件，以支持为那些旧版编译器使用编译器标志的传统方法。\n\
  \n### 字节类型\n\nC++17 引入了新的 `std::byte` 类型来表示单个内存字节的概念。以前，通常使用 `char` 或 `unsigned\
  \ char` 来访问原始内存，但这些类型意味着你正在处理字符数据，而且它们允许对它们进行算术操作。相比之下，`std::byte` 仅用于表示位集合，它只定义了位运算符，例如位移以及位与、位或、位异异。C++\
  \ 标准将 `std::byte` 定义为底层类型为 `unsigned char` 的 `enum class`。\n\n你可以使用 `std::byte`\
  \ 来传递不透明的内存块。这对于数据序列化或网络调用等应用可能非常有用，在这些场景中，你希望引用二进制数据而不是文本信息。例如，你可以使用 `std::vector<std::byte>`\
  \ 来持有连续的原始数据块，或者使用 `std::byte *` 表示指向原始内存的指针，而不是 `char *`（后者意味着指向文本字符的指针），例如：\n\n\
  ![image](img/u07-139-9780443222191.jpg)\n\n下面的代码展示了处理字节的各种方式：\n\n![image](img/u07-140-9780443222191.jpg)\n\
  \n（尽管在现代计算机上一个字节通常由 8 位组成，但不应这样假设。一些较旧的机器和专用芯片（如 DSP）可以使用由 `limits.h` 头文件中 `CHAR_BIT`\
  \ 定义的每字节不同的位数。）\n\n### maybe_unused 属性\n\nC++17 引入了一种新属性来抑制对未使用实体的编译器警告。`[[maybe_unused]]`\
  \ 属性可以应用于大多数类型，例如 `classes`、`structs`、`unions`、`typedefs` 和 `enums`，尽管公共 API 最常见的用途可能是函数参数，用于指示该参数在函数体内可能不会被使用。\n\
  \n该属性可以出现在函数声明（在 `.h` 文件中）和定义（在 `.cpp` 文件中）中。然而，我建议仅将此属性放在函数定义上，因为它涉及函数的实现细节，并且不影响客户端应该如何使用它。例如，\n\
  \n![image](img/u07-141-9780443222191.jpg)\n\n在这个示例中，如果 `Sum()` 函数体没有引用 `policy`\
  \ 参数，编译器将不会因为 `[[maybe_unused]]` 属性而发出警告。当然，在 C++17 之前，你还有其他几种方法可以相同的结果：\n\n1. \
  \ 在编译器命令行中添加标志来关闭对未使用函数参数的警告，例如用于 `clang` 和 `g++` 的 `-Wunused-parameter`。\n2.  在函数定义中省略参数名，例如：\n\
  \n![image](img/u07-142-9780443222191.jpg)\n\n3.  在函数体中添加一行 `(void)policy;` 来引用该参数但不对其进行任何操作。\n\
  \n`[[maybe_unused]]` 方法的优势是，它适用于参数在某些情况下可能被使用但在其他情况下可能不使用的代码。这种情况发生的一种方式是在函数体内部使用\
  \ `#ifdef` 预处理器语句，并且仅在预处理器块内部引用该参数。例如，\n\n![image](img/u07-143-9780443222191.jpg)\n\
  \n在这个示例中，如果 `HAVE_PARALLEL_SUPPORT` 未定义，编译器可能会生成警告。然而，如果标志已定义，则不会发出警告。在参数上添加 `[[maybe_unused]]`\
  \ 属性将抑制所有情况警告。\n\n### 迁移到 C++17\n\n如果你有一个现有的 API 并正在考虑迁移到 C++17，本节将提供一些有助于改进 API\
  \ 设计的功能。与之前的章节一样，我将这些分为不破坏兼容性的更改以及值得考虑但可能引入更改。\n\n#### 兼容性\n\n1.  **内联变量**：这些产生了更简洁的代码，是升级到\
  \ C++17 时采用的好特性。当然，extern 与 inline 符号的表示可能会不同。\n2.  **嵌套命名空间**：这是一个纯语法上的更改，与源代码兼容。我个人更喜欢不需要反复定义命名空间语句的简洁语法。\n\
  3.  **头文件检查**：使用 `__has_include` 可以帮助你的库编译更加健壮。\n\n#### 破坏性更改\n\n1.  **折叠表达式**：如果你没有使用折叠表达式来简化变变模板函数的签名，那么在函数实现中使用它们应该是源码兼容的。然而，折叠表达式允许你移除递归展开的基准函数，因此你的代码可能依赖该基准函数并在链接到你的新库时失败。\n\
  2.  **Optional, Any, Variant**：这些是非常用的新工具类，但如果你更改现有的 API 函数签名以使用它们，就会破坏后兼容性。当然，在新函数中使用它们是安全的。\n\
  \n## C++20 API 特性\n\nC++20 标准于 2020 年 12 月发布，取代了之前的 C++17 版本。此修订为语言引入了一些重大特性，包括对模块和协程的支持，我将在此深入介绍。\n\
  \n还有许多其他不直接影响 API 设计的更新，因此我们在这里不讨论它们，但它们仍然为语言提供了许多出色的补充，包括新的 Lambda 函数功能、关联容器的 `contains()`\
  \ 方法以及用于更简洁地引用枚举类标识符的 `using enum` 语法。\n\n此修订还移除并废弃了一些特性，例如移除了作为异常规范的 `throw()`，并废弃了\
  \ `volatile` 关键字的大部分用法。\n\n### 模块\n\n模块代表了 C++ 定义接口的一种根本性转变。在编写本书期间，该功能尚未被所有编译器的广泛支持，但随着支持和工具的改进，模块可能会成为定义\
  \ API 的更流行的方式。\n\n\n\n\n\n本书的核心理念之一是接口与实现的分物理分离。在 C++20 之前，实现这种分离的通用方法是在 `.h` 头文件中声明接口，并在\
  \ `.cpp` 源文件中编写实现。这种组织方式一直追溯到 C 语言，即使用 `.h` 和 `.c` 文件。这种方法的一个问题是，C++ 编译器会单独处理每个源文件，并使用预处理器递归地展开所有包含的头文件。这导致了大量的重复工作。即使使用了头文件保护（header\
  \ guards）或 `#pragma once` 语句来确保头文件只被展开一次，这些工作在编译器访问的每个源文件中都会重复进行。另一种解决方案是使用预编译头文件（precompiled\
  \ headers），尽管它们并没有标准定义，因此往往具有编译器特定性。\n\n模块（Modules）为这个问题提供了一个标准的解决方案。C++20 引入了两种主要类型的模块：\n\
  \n1. **命名模块（Named Modules）：** 它们消除了头文件的使用，并提供了在 `.cpp` 文件中分离接口和实现的方法。\n2. **头文件单元（Header\
  \ Units）：** 它们在头文件的使用和完全命名模块方法之间提供了桥梁和迁移策略。\n\n## 命名模块\n\n命名模块由一个或多个模块单元组成，其中模块单元简单来说是以模块声明形式开头的\
  \ `.cpp` 文件：\n\n![image](img/u07-144-9780443222191.jpg)\n\n其中一个模块单元将使用 `export`\
  \ 关键字导出模块名。这被称为**模块接口单元**。如果你将模块的实现分散在其他 `.cpp` 文件中，这些文件被称为**模块实现单元**。你希望在模块外部访问的符号必须使用\
  \ `export` 关键字显式导出。让我们来看一个示例：\n\n![image](img/u07-145-9780443222191.jpg)\n\n在这个示例中，我创建了一个名为\
  \ `MathModule` 的模块。我将接口（通常通常放在头文件中的内容）放在模块接口单元 `MathModule.cpp` 中，将实现放在模块实现单元 `MathModuleImpl.cpp`\
  \ 中（`clang` 要求接口单元文件使用 `.cppm` 扩展名）。该模块导出一个名为 `MathModule` 的命名空间，该命名空间导出了两个函数：`Square()`\
  \ 和 `Cube()`。\n\n关于这个示例，有几点需要注意：\n\n1. 你必须使用 `import` 关键字来访问模块，而不是 `#include`。\n\
  2. 不再有头文件。事实上，模块不能包含任何头文件，除非在一个可选的全局模块片段（global module fragment）中，且如果该片段存在，它必须位于模块声明之前。模块不产生宏。例如，使用\
  \ `import std` 不暴露标准库宏，如 `assert`、`errno`、`va_arg` 或 `INT_MAX`。\n3. 模块和命名空间是正交的概念。在这个示例中，我创建了一个与模块同名的命名空间，但这并不是强制要求的。当然，你也可以在全局范围内从模块导出符号。\n\
  4. 我显式地导出了我希望从模块访问的符号。任何没有标记 `export` 关键字的符号都无法在模块外部调用。这标准化了从编译单元导出符号的行为，而标准以前将此留给了实现（众周知，微软编译器的默认符号导出行为与\
  \ `gcc/clang` 不同）。\n5. 我使用 `import std` 将整个标准库作为模块引入，从而允许我访问 `std::cout`。我也可以使用\
  \ `import <iostream>` 甚至是 `#include <iostream>;`——换句话说，应用程序代码可以混合使用模块和头文件。\n\n还有其他功能可以让你管理模块的接口和实现部分。例如，你可以在模块接口单元中定义一个私有模块片段（private\
  \ module fragment），以提供不从文件中导出的定义。还有模块分区（module partitions）的概念，可用于将较大的模块拆分为较小的部分。你还可以选择性地只导出特定的符号，而不是将整个文件封装在一个单一导出作用域内。然而，我之前介绍的方法保持了简单，并在概念上映射了我们直到\
  \ C++20 之前一直组织接口和实现代码的方式。\n\n采用模块的优点包括：缩短编译时间（因为编译器不再需要向每个编译单元展开庞大的头文件树）以及更高的可靠性（因为导入模块的顺序不会影响它们的语义，因为模块不受其他导入的宏的影响）。不过，在采用模块时，有几个实际考虑需要注意。我将这些注意事项放在后面的“迁移到\
  \ C++20”章节中。\n\n## 头文件单元\n\n除了命名模块外，C++20 还引入了头文件单元（header units）的概念，以帮助过渡到模块。此功能允许你通过\
  \ `import \"header.h\"` 或 `import <header.h>` 语法将某些头文件作为模块导入。例如：\n\n![image](img/u07-146-9780443222191.jpg)\n\
  \n这段代码假设你已经将相关的 `MathHeader.cpp` 文件编译为二进制模块接口文件，以便编译器可以像访问普通命名模块一样访问它。\n\n就像命名模块一样，头文件单元不受其他头文件中宏的影响，但与命名模块不同，它们会暴露头文件中定义的任何宏。这意味着对于那些仍然依赖头文件中宏的情况非常有用。关键优势在于，你不需要移除头文件并重构你的项目来采用命名模块。\n\
  \n### 飞船运算符 (spaceship operator)\n\nC++ 允许你定义各种比较运算符来描述两个对象的比较结果。这些是 `==`、`!=`、`<`\
  \ 和 `>=`。这个列表在 C++20 中增加了飞船运算符。与其他返回 `bool` 的运算符不同，飞船运算符返回一个三向结果（负、零或正）。你可以认为这在概念上类似于\
  \ `strcmp` 函数。飞船运算符来源于该运算符使用的字符看起来像 ASCII Art：`<=>`。\n\n让我们从回顾原始比较运算符开始。我将使用一个持有数值的简单对象\
  \ `Magnitude`：\n\n![image](img/u07-147-9780443222191.jpg)\n\n尝试比较此类的对象将失败，因为没有定义比较运算符；即：\n\
  \n![image](img/u07-148-9780443222191.jpg)\n\n为了使此工作生效，我们需要为该类定义 `==` 运算符。以下是为类添加所有比较运算符的代码：\n\
  \n![image](img/u07-149-9780443222191.jpg)\n\n飞船运算符的处在于，只需提供飞船运算符的定义，就可以移除大部分或所有这些运算符定义。编译器将使用你的飞船运算符为所有其他运算符提供实现。编译器甚至为你生成飞船运算符的默认实现，因此类定义可以简化为：\n\
  \n![image](img/u07-150-9780443222191.jpg)\n\n现在这段代码可以编译并正常运行：\n\n![image](img/u07-151-9780443222191.jpg)\n\
  \n\n\n\n默认的太空船运算符（spaceship operator）实现将对你类中的每个数据成员进行逐成员比较。它首先比较任何基类成员，然后按照声明顺序比较非静态成员。例如，给定一个\
  \ `Vector` 类的定义：\n\n![image](img/u07-152-9780443222191.jpg)\n\n生成的实现将等同于以下代码：\n\n\
  ![image](img/u07-153-9780443222191.jpg)\n\n这种默认行为并不总是你所需要的，例如如果数据成员需要以不同的顺序进行比较，或者需要更复杂的比较算法。在这种情况下，你可以为太空船运算符提供自定义实现。这将要求你在不同的返回类型之间进行选择，以控制如何生成另外两个双向运算符。它们是：\n\
  \n- 1. `std::strong_ordering`：这种结果类型用于可以确定两个对象完全相等的情况（即，一个可以替换另一个）。这意味着每个数据成员都通过运算符进行了比较。该类型的可能值为有：\n\
  \    - a. `std::strong_ordering::less`\n    - b. `std::strong_ordering::equal`\n\
  \    - c. `std::strong_ordering::greater`\n- 2. `std::weak_ordering`：这种类型用于较弱的关系，在这种关系下你只能确定两个对象是否等价（equivalent）而不是相等（equal）。区别在于，等价的对象可能有无关的差异，而相等的对象是不可区分的。可能的弱序值为：\n\
  \    - a. `std::weak_ordering::less`\n    - b. `std::weak_ordering::equivalent`\n\
  \    - c. `std::weak_ordering::greater`\n- 3. `std::partial_ordering`：这种类型与弱序类似，但增加了一个特性，即可能存在无法相互比较的值，例如\
  \ `NaN` 浮点数。可能的偏序值为：\n    - a. `std::partial_ordering::less`\n    - b. `std::partial_ordering::equivalent`\n\
  \    - c. `std::partial_ordering::greater`\n    - d. `std::partial_ordering::unordered`\n\
  \n例如，假设对于我们的 `Vector` 类，我们希望比较运算符比较向量的模，其中模是每个元素平方之和的平方根：`sqrt(mX*mX + mY*mY)`。出于性能考虑，我们可以移除平方根运算符，因为我们只关心相对比较，而不关心绝对值。因此，我们可以这样实现我们的太空船运算符：\n\
  \n![image](img/u07-154-9780443222191.jpg)\n\n如果你提供了自定义的太空船运算符实现（而不是编译器的默认实现），那么为了让\
  \ `==` 和 `!=` 运算符工作，编译器将要求你实现 `==` 运算符。理由是，如果你需要为 `<=>` 提供自定义实现，那么你可能也需要为 `==` 提供自定义实现，因为使用\
  \ `<=>` 测试相等性可能效率低下。例如，在比较向量或字符串的相等性时，在遍历每个元素之前先检查长度是否相同会更高效。\n\n### 约束与概念\n\n关于\
  \ C++ 模板最常见的抱怨之一是编译器错误可能非常冗长且难以理解。这是因为错误通常触发在模板实现的深层，使得很难确定实际问题所在。C++20 引入了称为约束（constraints）和概念（concepts）的特性来改善这种状况。它们允许你为模板参数添加编译时约束，当客户端尝试以符合这些约束的方式使用模板时，允许编译器发出更有用的错误。\n\
  \n例如，让我们考虑一个返回两个值中最小值的简单函数模板：\n\n![image](img/u07-155-9780443222191.jpg)\n\n该函数有一个隐式约束，即比较的两个值的类型必须定义了小于运算符\
  \ `<`。如果你传递了一个不符合该预期的类型，你将得到编译错误，并且该错误很可能位于模板实现内部：\n\n![image](img/u07-156-9780443222191.jpg)\n\
  \n使用约束，我们现在可以增强函数模板声明，指定只有使用整数或浮点数参数调用该函数是有效的。这是通过新的 `requires` 关键字实现的，它接受一个编译常量表达式，例如：\n\
  \n![image](img/u07-157-9780443222191.jpg)\n\n现在，编译器将在函数的实际调用处生成错误信息，而不是在函数内部。`std::integral`\
  \ 和 `std::floating_point` 符号被称为称为概念。这里是 C++ 提供的内置概念列表：\n\n- `std::same_as`：类型与另一个相同。\n\
  - `std::derived_from`：类型派生自另一个。\n- `std::convertible_to`：类型隐式转换为另一个。\n- `std::common_reference_with`：两个类型具有共同引用。\n\
  - `std::common_with`：两个类型具有共同类型。\n- `std::integral`：类型是整数类型。\n- `std::signed_integral`：类型是有符号整数类型。\n\
  - `std::unsigned_integral`：类型是无符号整数类型。\n- `std::floating_point`：类型是浮点数类型。\n- `std::assignable_from`：类型可以从另一个赋值。\n\
  - `std::swappable`：类型可以交换（例如通过 `std::swap`）。\n- `std::swappable_with`：两个类型可以交换。\n\
  - `std::destructible`：类型对象可以析构。\n- `std::constructible_from`：类型可以使用给定的参数集初始化。\n\
  - `std::default_initializable`：类型对象可以默认构造。\n- `std::move_constructible`：类型对象可以移动构造。\n\
  - `std::copy_constructible`：类型对象可以拷贝和移动构造。\n- `std::equality_comparable`：`==` 和\
  \ `!=` 定义了等价关系。\n- `std::equality_comparable_with`：两个类型的 `==` 和 `!=` 定义了等价关系。\n\
  - `std::totally_ordered`：类型比较运算符定义了全序。\n- `std::totally_ordered_with`：两个类型的比较运算符定义了全序。\n\
  - `std::three_way_comparable`：`<=>` 产生一致的比较结果（在 `<compare>`）。\n- `std::three_way_comparable_with`：两个类型的\
  \ `<=>` 产生一致的比较结果（在 `<compare>`）。\n- `std::movable`：类型对象可以移动和交换。\n- `std::copyable`：类型对象可以拷贝、移动和交换。\n\
  - `std::semiregular`：类型对象可以拷贝、移动、交换并默认构造。\n- `std::regular`：同时满足 `semiregular` 和\
  \ `equality_comparable` 的类型。\n- `std::invocable`：可调用类型可以使用 `std::invoke` 用给定的参数类型调用。\n\
  - `std::regular_invocable`：可调用类型可以使用 `std::invoke` 且调用表达式保持相等性。\n- `std::predicate`：可调用类型是布尔谓词。\n\
  - `std::relation`：可调用类型是二元关系。\n\n\n\n33. `std::equivalence_relation`: 该关系施加等价关系。\n\
  34. `std::strict_weak_order`: 该关系施加严格弱序。\n\n除了这些内置概念外，你还可以使用 `concept` 关键字定义自己的概念。例如，继续我们之前的\
  \ `min()` 函数模板，我们可以引入一个新的概念，用于判断类型是否定义了 `<` 运算符，而不是将函数仅限制为整数和浮点类型。这可以这样实现：\n\n![image](img/u07-158-9780443222191.jpg)\n\
  \n我们现在可以使用自定义的概念来重新定义 `min()` 函数模板：\n\n![image](img/u07-159-9780443222191.jpg)\n\
  \n约束（Constraints）是向客户端提供更多关于你期望如何使用模板信息的极极方法。它们还允许编译器在客户端传递不符合这些预期的参数类型时，提供更有帮助的错误信息。你可以使用标准库中的内置概念来定义这些模板参数约束，或者编写自己的概念来更直接地表达你的约束要求。\n\
  \n### 简写函数模板\n\nC++ 中定义模板的语法可能非常冗长，有时甚至望而生畏。为了解决这个问题，C++20 引入了更简单的语法来表达模板。参考我们上一节中的\
  \ `min()` 函数模板：\n\n![image](img/u07-160-9780443222191.jpg)\n\n现在可以使用 `auto` 关键字以更简洁的方式表示，仅如下：\n\
  \n![image](img/u07-161-9780443222191.jpg)\n\n你还可以使用简写语法在参数列表中直接引用约束。例如，我们几节中受约束的函数模板看起来是：\n\
  \n![image](img/u07-162-9780443222191.jpg)\n\n这可以简化为简写形式：\n\n![image](img/u07-163-9780443222191.jpg)\n\
  \n尽管简写模板只是现有模板语法的简化，但并不是所有的模板功能都能通过简写形式表示。在某些情况下，你仍然需要使用原始的非写语法。例如：\n\n1. 在之前的 `min()`\
  \ 简写形式中，每个 `auto` 参数都可能是不同的类型。如果你想强制两个参数都应该是相同类型 `T`，那么你应该使用原始的非简写语法。\n2. 如果你想指定一个带有默认类型的模板参数，则应该使用非简写语法（例如\
  \ `template<typename T = void>`）。\n3. 如果你想使用变长模板参数包，那么这些也需要非简写形式（例如 `template<typename...\
  \ T>`）。\n\n### consteval 修饰符\n\nC++11 引入了 `constexpr` 修饰符，允许函数或变量用于常量表达式。在 C++20\
  \ 中，我们现在有了 `consteval` 修饰符，它用于声明“立即”函数（即必须在编译时产生常量的函数）。\n\n`constexpr` 和 `consteval`\
  \ 的区别在于，前者是对编译器的提示，尽可能在编译时求值函数，而 `consteval` 要求函数必须在编译时求值。如果无法做到，编译器将生成错误。此外，`constexpr`\
  \ 可以应用于函数和变量，而 `consteval` 只能应用于函数。这里有一个例子：\n\n![image](img/u07-164-9780443222191.jpg)\n\
  \n这个 `consteval` 函数可以在编译时求值，允许编译器插入常量结果而不是进行函数调用。这意味着的影响是编译后的对象代码不需要具有 `Deg2Rad`\
  \ 符号。因此，你可以将其视为一种使用纯 C++ 语法和完整类型检查来实现 C 预处理器函数宏功能的方法。换句话说，这个 `consteval` 函数可以替换如下的宏：\n\
  \n![image](img/u07-165-9780443222191.jpg)\n\n### constinit 修饰符\n\nC++20 引入的另一个相关修饰符是\
  \ `constinit`。它用于确保静态或线程存储变量在编译时初始化，以避免库加载时众为人知的静态初始化顺序问题。\n\n`constinit` 修饰符只能应用于变量（正如我刚才描述的那样，你可以使用\
  \ `consteval` 在编译时求值函数）。如果你尝试用无法在编译时求值的值初始化 `constinit` 变量，或者尝试在函数内部局部变量上使用它，将生成编译错误。让我们来看一个例子：\n\
  \n![image](img/u07-166-9780443222191.jpg)\n\n在这个例子中，我将 `PROJECT_NAME` 声明为 `constinit`，因此它将在编译时初始化，避免了库加载时任何潜在的静态初始化问题。为了实现这一点，`GetName()`\
  \ 函数必须声明为 `constexpr` 以指示它可以在编译时求值。\n\n### 迁移到 C++20\n\n如果你正考虑迁移你的 API 以支持 C++20，那么最值得考虑使用的特性可能是模块（modules）。模块为构建大型软件项目提供了多项实用功能，包括提高编译时间的潜力，以及导入模块时没有副作用。然而，也有几点需要注意：\n\
  \n1. 目前对模块的支持仍然有限。微软的 MSVC 编译器对模块提供了良好的支持，但 Xcode 附带的最新 clang 编译器尚不支持模块（尽管你可以通过\
  \ `brew install llvm` 安装支持模块的版本）。特别是，截至 2023 年，clang 文档将头文件支持描述为实验性。\n2. 表示模块的格式被留为编译器实现细节，这意味着它们在不同编译器之间不可移植，甚至可能在同一编译器的不同版本之间也不通用。\n\
  3. 模块的优势之一是提高编译性能的潜力，但我们还需要考虑如何将模块作为分发机制。对于二进制分发，今天你向客户端提供预编译库和头文件。如果你使用模块，那么你可能还需要打包预编译模块二进制文件（尽管只是模块接口单元，而不是实现单元）。\n\
  4. 模块必须按照特定顺序编译以正确处理依赖。如果模块 `A` 导入模块 `B`，则必须先编译模块 `B`，以便模块 `A` 可以访问其二进制模块接口。对于传统的头文件，C++\
  \ 编译器可以并行编译翻译单元来加快速度。这在模块中已不再可行。至少，任何并行化努力都需要受到模块依赖顺序的限制。\n5. 带二进制分发头文件的处是人类可以在文本编辑器中阅读它们。然而，二进制模块文件无法被解释。因此，我们要么依赖良好的文档生成工具，要么需要分发模块接口单元的源代码以便客户端知道如何使用你的\
  \ API（对于头文件单元，你可以像常一样共享头文件）。这提供了另一个将接口和实现分为不同模块单元的理由：这样如果你不想，就不需要共享实现代码。\n\n\n\n\
  推测随着模块的使用越来越广泛并趋于成熟，这些限制事项将随着时间得到解决。我期待在本书的未来修订中有机会更新此章节，以涵盖这些经验和改进。\n\n在考虑在 API\
  \ 中采纳的其他 C++20 特性方面，模板约束（template constraints）是一个极好的补充，它将为你的客户端改进模板错误信息，并更清晰地说明它们可以使用哪些类型作为模板参数。由于约束是编译时检查，你应该能够在不破坏二进制兼容性的情况下将它们添加到你的\
  \ API 中。虽然添加约束可能会导致客户端代码在以前可以运行的地方现在无法编译，但更有可能的情况是这些情况本身就是你接口的无效使用，在早期版本的 API 中同样无法通过编译。\n\
  \n使用简写函数语法（abbreviated function syntax）纯粹是一种风格选择。如果你喜欢更简洁的语法，请尽管使用。但请记住，某些模板特性是无法通过简写语法表达的。\n\
  \n`conststeval` 标识符是使用预处理函数类宏的类型安全替代方案，因此它是一个值得考虑的特性。然而，如果你将现有的非宏函数转换为 `consteval`\
  \ 函数，那么该符号将不再在你的库二进制文件中定义，从而破坏二进制兼容性。\n\n`constinit` 标识符可以帮助降低你的库代码加载时静态初始化的成本和风险，因此在可行的情况下它也值得采用。并不是所有的静态或线程存储变量定义都可以转换为使用\
  \ `constinit`，只有那些可以在编译时计算的变量。然而，使用此标识符应该是向后兼容的，因为它仅仅优化了在调用 `main()` 之前变量的初始化。\n\
  \n## C++23 API 特性\n\n在本书中我将涵盖的最新 C++ 修订版本是 `C++23`。在编写本文时，该版本尚未发布；但拟议的新特性集已经相当确立。\n\
  \n尽管 `C++23` 的早期工作组会议受到了 COVID-19 疫情的影响，但该标准的修订版中正在添加许多新特性，例如用于 `std::string` 和\
  \ `std::string_view` 的 `contains()` 函数、`std::optional` 额外的单态成员（如 `and_then()` 和\
  \ `or_else()`）以及 `#warning` 预处理器指令。随着 `std` 和 `std.compat` 命名模块的引入，标准库的模块支持也正在完善。\n\
  \n还有几个可能影响 API 设计的新特性，包括 `std::expected` 模板、多维下标运算符以及几个新的预处理器指令。我将在本章的最后几个章节中介绍这些新特性。\n\
  \n### 期望值 (Expected values)\n\n`std::expected` 类模板提供了一种返回有效对象或错误的方法。当你希望返回有效结果但又在发生错误时提供额外信息时，这作为函数的返回值非常有用。在这种情况下，通常使用整数或枚举来表示错误值。例如，这里有一个加载图像的函数，它可以返回图像数据或一个错误枚举：\n\
  \n![image](img/u07-167-9780443222191.jpg)\n\n该函数的调用者可以检查 `std::expected` 的 `has_value()`\
  \ 成员来查看它是否持有有效值。如果为真，可以使用 `value()` 访问该值；否则，可以使用 `error()` 访问错误。\n\n![image](img/u07-168-9780443222191.jpg)\n\
  \n你也可以使用指针的语法来检查它是否持有有效值，如下所示：\n\n![image](img/u07-169-9780443222191.jpg)\n\n客户端还可以使用\
  \ `std::expected` 的 `value_or()` 成员在出错时返回默认值。\n\n![image](img/u07-170-9780443222191.jpg)\n\
  \n在过去，你可能使用 `std::optional` 来表示某些，因此 `std::expected` 是更好的选择。\n\n### 多维下标运算符 (Multidimensional\
  \ subscript operator)\n\n`C++23` 允许你使用 `[]` 运算符访问多维数组，例如：\n\n![image](img/u07-171-9780443222191.jpg)\n\
  \n在许多领域多维数组非常有用，例如 2D 矩阵或 3D 坐标。例如：\n\n![image](img/u07-172-9780443222191.jpg)\n\
  \n这种新语法允许为数组访问使用可数量的索引。\n\n![image](img/u07-173-9780443222191.jpg)\n\n### 预处理器指令\
  \ (Preprocessor directives)\n\nC 预处理器提供了若干指令来支持头文件和源文件的条件编译。这些指令是 `#if`、`#else`、`#elif`\
  \ 和 `#endif`。还有 `#ifdef` 指令，它是编写 `#if defined()` 的另一种方式，以及 `#ifndef`，它是 `#if !defined()`\
  \ 的替代写法。\n\n然而，对于 `#elif` 指令没有等效的简写版本。这通常被认为是原始 C 语言的一个疏忽，并在 `C++23` 中通过引入以下指令解决了这个问题：\n\
  \n1. `#elifdef`：`#elif defined()` 的简写。\n2. `#elifndef`：`#elif !defined()` 的简写。\n\
  \n\n\n\n\nC++23 还引入了另一个预处理器指令：`#warning`，当客户端编译你的 API 时，它会提供一个编译时警告。许多编译器已经提供了此功能，但直到\
  \ C++23 它才正式成为标准的一部分。该功能是对 `#error` 指令的补充，后者会发出编译时错误。例如：\n\n![image](img/u07-178-9780443222191.jpg)\n\
  \nC++23 引入的另一个预处理器指令是 `#embed`。它为在可执行文件中包含二进制数据提供了一种标准方法。例如，这可以轻松地在代码中嵌入图像、视频或音频文件的二进制数据。虽然你通常倾向于在源文件中使用此功能，但你可以将其与\
  \ `constinit` 和 `inline` 等特性结合，定义一个内联变量，为 API 提供的某些资源提供原始二进制数据。例如：\n\n![image](img/u07-179-9780443222191.jpg)\n\
  \n`#embed` 指令将在编译时加载指定的文件，并将内容作为以逗号分隔的整数列表插入。因此，在预处理器阶段完成后，代码将展开为如下内容：\n\n![image](img/u07-180-9780443222191.jpg)\n\
  \n### 迁移到 C++23\n\n如果你计划将 API 的最低支持 C++ 版本移动到 C++23，那么添加对 `std::expected` 的支持提供了一种优雅的方法，用于从函数返回有效结果或带有有关错误的更多上下文的错误。然而，这无疑会破坏源码和二进制兼容性。\n\
  \n如果你的 API 天生处理多维量数据，那么你可能想要考虑添加对新下标运算符的支持。这将是你添加到 API 中的一项新功能，因此它不应该破坏现有代码。\n\n\
  最后，使用 `#warning` 和 `#error` 在客户端缺少某些必需或可选依赖项时，可以用于为他们提供编译时反馈。如果你更倾向于这种语法而不是更冗长的替代方案，也可以使用新的条件编译指令\
  \ `#elifdef` 和 `#elifndef`。尽管这两个新指令是在 C++23 中引入的，但标准鼓励编译器实现者将这些特性移植到旧的语言模式。正如之前提到的，`#warning`\
  \ 在 C++23 之前已经被许多编译器实现。因此，你可能在升级到 C++23 之前就可以在大多数编译器中利用这些特性。\n\n# 8: 性能\n\n## 摘要\n\
  \n本章涵盖了影响你的应用程序编程接口（API）性能的 C++ 特性。通常，你不应该为了实现高性能而扭曲你的 API；始终应该测量性能并针对实际瓶颈进行优化。本文解释了通过\
  \ `const` 引用传递参数以及减少 `#include` 依赖对性能的影响。还展示了幼稚的常量声明如何给类增加负担，以及为什么初始化列表是的。\n\n###\
  \ 关键字\n\n- `Consteval`\n- `Constexpr`\n- `Constinit`\n- `Copy on write`\n- `Extern`\n\
  - `Forward declaration`\n- `Include guard`\n- `Initialization list`\n- `Inline`\n\
  \n## 性能组件\n\nAPI 性能由几个组件组成。我将在后续的小节中考虑其中的每一个：\n\n### 1. 编译速度\n你的 API 对编译客户端程序所需时间的影响。这会影响用户的生产力。\n\
  \n### 2. 运行速度\n调用你的 API 方法的时间开销。如果你的方法必须被频繁调用，这非常重要。\n\n### 3. 运行内存开销\n调用你的 API\
  \ 方法的内存开销。如果你预计许多对象将被创建并保留在内存中，这非常重要。它还会影响 CPU 缓存性能。\n\n### 4. 库大小\n客户端必须链接到其应用程序的实现所需的对象代码大小。这会影响客户端应用程序的磁盘占用和内存占用总量。\n\
  \n### 5. 启动时间\n加载和初始化实现你 API 的动态库所需的时间。各种因素都会影响此，例如模板解析、绑定未解析符号、调用静态初始化器以及库路径搜索。\n\
  \n除了影响这些性能指标的特定 API 因素外，你当然应该调查你编译器的选项，查看是否有可以开启或关闭的标志来提升性能。例如，如果你不需要使用 `dynamic_cast`\
  \ 运算符，则关闭运行时类型信息是一个常见的决定（对于 GNU C++ 编译器使用 `-fno-rtti`）。\n\n\n\n\n关于性能优化，最重要的的教训之一是：你永远不要相信自己的直觉来判断代码实现中的哪些部分会很慢。你应该始终在真实场景中测量\
  \ API 的实际性能概况，然后将优化精力集中在影响最大的区域上。此此的一个推论是，你不需要从最高效的实现开始：先用最简单的方法实现，等一切运行正常后，再找出你的实现中哪些部分需要优化。\n\
  \n在皮克斯（Pixar），我们经常会让不同的团队负责某部电影特定功能的不同组件。例如，《汽车总动员》（Cars）中的驾驶系统涉及研发团队实现一个通用的仿真插件系统、GUI\
  \ 工程师为动画师提供直接操作控制，以及电影制作团队将所有内容集成到他们的工作流（pipeline）中的工作。然后，一旦所有软件都能正常运行并完成集成，我们就会召开“速度小组”会议，评估瓶颈所在，并将任务分配给相关的工程师，以确保整个系统符合特定的性能标准。\n\
  \n重要的点是始终要记住阿姆达尔定律（Amdahl's law）。该定律指出，优化系统单一部分所带来的整体性能提升，受限于改进部分被实际使用的时间比例。你可能会将\
  \ API 一部分的性能提升 10 倍，但如果客户端程序只有 1% 的时间在该段代码上，那么整体提升将减少到仅 0.1 倍（10 * 0.01）。\n\n##\
  \ 通过 const 引用传递输入参数\n\n在第 6 章 中，我建议优先使用 const 引用而非指针来传递输入参数（即不会被函数修改的参数），但对于输出参数，应该优先使用指针而非非\
  \ const 引用，以便向客户端明确声明其可变性。本节现在提供了一些额外的性能理由，以支持使用 const 引用将输入参数传递给函数。\n\n默认情况下，C++\
  \ 中的函数参数是“按值传递”的。这意味着传入函数的对象会被复制，然后在函数返回时该拷贝副本被销毁。因此，传入方法的原始对象永远无法被修改。然而，这涉及到调用对象的拷贝构造函数和析构函数的开销。相反，你应该传递对象的\
  \ const 引用。这样做的效果是只传递了对象的指针，同时确保了对象不会被方法修改：\n\n![image](img/u08-01-9780443222191.jpg)\n\
  \n此规则仅适用于对象。对于 `int`、`bool`、`float`、`double` 或 `char` 等内置类型类型，因为这些类型足够小，可以放入 CPU\
  \ 寄存器。此外，C++ 标准库的迭代器、智能指针和函数对象被设计为按值传递。但对于所有其他自定义类型，你应该倾向于引用或 const 引用。让我们来看一个具体的例子：\n\
  \n![image](img/u08-02-9780443222191.jpg)\n\n如果你假设 `SetObjectByValue()` 和 `SetObjectByConstReference()`\
  \ 方法都简单地将参数赋值给成员变量 `mObject`，那么当调用这些方法时，执行的操作序列如下：\n\n1. `SetObjectByValue(object)`\n\
  2. `std::string` 构造函数\n3. `MyObject` 拷贝构造函数\n4. `MyObject` 赋值运算符\n5. `MyObject`\
  \ 析构函数\n6. `std::string` 析构函数\n3. `SetObjectByConstReference(object)`\n4. `MyObject`\
  \ 赋值运算符\n\n如果 `MyObject` 派自某个基类，情况会变得糟糕，因为对于按值传递的情况，对象层次中每个基类的拷贝构造函数和析构函数也必须被调用。\n\
  \n避免按值传递参数的另一个原因是“对象切片问题”（`Meyers, 2005`）。该问题是指：如果一个方法接受基类参数（按值传递），而你传递了一个派生类，那么派生类的任何额外字段都会被切掉。这是因为按值传递的对象的大小在编译时被确定为基类的大小。通过\
  \ const 引用而非按值传递参数可以避免切片问题。\n\n## 最小化 #include 依赖\n\n编译大型项目所需的时间很大程度上取决于 `#include`\
  \ 文件的数量和深度。因此，减少构建时间的常用技术之一是尝试减少头文件中 `#include` 语句的数量。如你所知，在头文件周围加上包含符（include guards）是良好的做法，以避免在单个翻译单元的编译期间被多次展开。但还有其他因素可以考虑以改进构建时间。\n\
  \n### 避免“Winnebago”头文件\n\n某些 API 提供单个巨大的头文件，引入了该接口的所有类和全局定义。这对于客户端来说似乎是一种方便的做法。但它只会增加客户端代码与\
  \ API 之间的编译时耦合，意味着即使是最少的使用也必须引入所有符号。\n\n例如，标准的 Win32 头文件 `windows.h` 引入了超过 200,000\
  \ 行代码。每个包含该头文件的 `.cpp` 文件实际上增加了 4MB 需要加载的代码。同样，macOS 的头文件 `Cocoa.h` 扩展到了超过 100,000\
  \ 行代码。\n\n预编译头文件可以通过将这些大型包含文件预处理为更优的形式（例如 `.pch` 或 `.gch` 文件）来减轻这种负担。然而，一个更模块化、松耦合的解决方案是为\
  \ API 的每个组件提供一组较小的独立头文件。这样客户端可以选择仅 `#include` 他们使用的 API 子集的声明。这可能会导致客户端代码中的 `#include`\
  \ 列表变长，但结果减少了了代码必须引入的 API 总量。\n\n### 前置声明\n\n头文件 `A` 包含另一个头文件 `B` 以引入 `A` 中使用的类、函数、结构体、枚举或其他实体的声明。在对象编程中，常见的情况是头文件\
  \ `A` 希望从头文件 `B` 引入一个或多个类的声明。但在许多情况下，头文件 `A` 并不真正需要包含 `B`，只需为所需的类提供前置声明。在以下情况下可以使用前置声明：\n\
  \n- 不需要类的大小。如果你将类作为成员变量或派生自它，那么编译器将需要知道类的大小。\n- 你没有引用类的任何成员方法。这样做需要知道方法原型：其参数和返回类型。\n\
  - 你没有引用类的任何成员变量；但你已经知道永远不要将它们设为公共（或保护）。\n\n例如，如果头文件 `A` 仅通过指针或引用引用头文件 `B` 中的类名，可以使用前置声明：\n\
  \n\n\n然而，如果你更改了类 `A` 的定义，导致编译器需要知道类 `B` 的实际大小，那么你就包含类 `B` 的实际声明（即你必须 `#include`\
  \ 它的头文件）。例如，如果你在 `A` 内部存储了 `B` 的实际拷贝：\n\n![image](img/u08-04-9780443222191.jpg)\n\
  \n正如在“模式”章节中所提到的，你可以使用 pimpl 技巧来避免在头文件中将对象 `B` 定义为数据成员，从而在上述情况下避免了对 `B.h` 头文件的 `#include`\
  \ 需求。\n\n显然，在任何引用了该头文件中类的 `.cpp` 文件中，你都需要 `#include` 完整的头文件（例如，`A.cpp` 必须包含 `B.h`）。前向声明只是告诉编译器将该名称添加到其符号表中，并承诺在实际需要时提供完整的声明。\n\
  \n有一个有趣的一点是，如果你通过值传递将变量给方法或通过值返回它，前向声明是足够的（尽管你应该倾向于使用 `const` 引用而不是通过值传递参数）。你可能认为编译器此时需要知道类的大小，但只有实现该方法的代码以及调用它的客户端代码需要它。因此，下面的示例是完全合法的：\n\
  \n![image](img/u08-05-9780443222191.jpg)\n\n注意：通常只在你自己的代码中使用前向声明更安全。通过使用前向声明，你实际上是在你所省略的头文件中嵌入了关于符号如何声明的知识。例如，如果你对外部头文件使用前向声明，并且你的\
  \ API 被用于具有该头文件不同版本的环境中，那么该头文件中类的声明可能会被改为 `typedef`，或者该类可能会被改为模板类，这会破坏你的前向声明。这就是为什么你特别永远不要尝试前向声明\
  \ C++ 标准库对象的原因。例如，始终使用 `#include <string>`，永远不要尝试前向声明 `std::string`。\n\n值得注意的是这里标准库提供的\
  \ `<iosfwd>` 头文件。该头文件包含了输入/输出库的前向声明，这样你就不需要将完整的定义引入到你自己的头文件中。\n\n最后，头文件应该将其所有依赖项声明为前向声明或显式的\
  \ `#include` 语句。否则，在其他文件中包含该头文件可能会产生顺序依赖。这与减少 `#include` 语句数量的陈述相径离，但为了 API 的健壮性和优雅性，这是一个重要的例外。测试此点的好方法是确保一个只包含你的公共头文件的空\
  \ `.cpp` 文件可以无错误地编译。\n\n### 冗余的 #include guards\n\n减少解析过多包含文件开销的另一种方法是在包含点处添加冗余的预处理器保护（guards）。例如，如果你有一个名为\
  \ `bigfile.h` 的包含文件，如下所示：\n\n![image](img/u08-06-9780443222191.jpg)\n\n那么你可以通过这种方式从另一个头文件中包含此文件：\n\
  \n![image](img/u08-07-9780443222191.jpg)\n\n如果你已经包含了它，这就节省了无意义地打开和解析整个包含文件的代价。这看起来像是一个微不足道的优化，而且对于较小的包含层级来说确实如此。然而，如果你有一个具有许多包含文件的大型代码库，这种优化可以产生显著差异。早在\
  \ 1996 年，John Lakos 执行了多次实验，以证明这种优化在大型项目中可以激发的性能提升程度。其实验结果是惊人的（Lakos, 1996）。然而，由于这些结果源于\
  \ 20 世纪 90 年代中期，我设计了一个类似的实验在现代编译器上测试这种效果，结果与 Lakos 的结果契合良好。\n\n对于给定的数字 `N`，我生成了\
  \ `N` 个包含文件，每个文件都包含了其他 `N-1` 个包含文件。每个包含文件还包含大约 100 行类声明。我还生成了 `N` 个 `.cpp` 文件，其中每个\
  \ `.cpp` 文件只包含一个头文件。然后我记录了编译每个 `.cpp` 文件所需的时间。因此，这个实验选择了最坏情况的 `O(n²)` 包含结构，尽管它包含了运行编译器的时间\
  \ ![Equation](img/si1.png)。实验是针对一组使用了冗余包含保护的包含文件和一组未使用的包含文件进行的。下表 8.1 显示了在使用 GNU\
  \ 编译器下的实验平均结果。\n\n| N | 无保护 (s) | 有保护 (s) | 加倍率 |\n| --- | --- | --- | --- |\n|\
  \ 2 | 0.07 | 0.07 | 1.00 |\n| 4 | 0.15 | 0.14 | 1.07 |\n| 8 | 0.35 | 0.31 | 1.13\
  \ |\n| 16 | 0.98 | 0.76 | 1.29 |\n| 32 | 4.07 | 2.12 | 1.92 |\n| 64 | 25.90 | 6.82\
  \ | 3.80 |\n| 128 | 226.83 | 24.70 | 9.18 |\n\n通过对比，我在 Linux 下发现 `N=128` 时几乎没有影响，这可能是因为\
  \ GNU 磁盘缓存产生了更高效的环境。然而，你的 API 用户可能在使用广泛的平台，因此这种优化对他们可能产生巨大影响。即使只有 1.29 倍加速也能显著减少他们等待构建的时间。\n\
  \nHerb Sutter 建议不要使用冗余保护，部分原因是它们破坏了封装（Sutter and Alexandrescu, 2004）。我不支持破坏封装。你不应该跨库使用这种技术，或包含你不维护的头文件。仅在你的\
  \ API 内部使用。与所有优化一样，你应该测量性能。现代编译器在这一方面有所改进，尽管到 2024 年我仍然能测量出显著差异。\n\n这种技术已被许多大型 API\
  \ 用于实际收益。为了给出一个复古的例子，Commodore Amiga 平台使用了这种技术来提高 AmigaOS API 的性能。例如，这是 90 年代初 `intuition/screens.h`\
  \ 头文件的顶部所示：\n\n![image](img/u08-08-9780443222191.jpg)\n\n### 定义常量\n\n通常你想为你的 API\
  \ 定义几个公共常量。这是避免在客户端代码中充斥硬编码值的极佳技巧，例如最大值或默认字符串。例如，你可以在全局作用范围内以这种方式声明几个常量：\n\n![image](img/u08-09-9780443222191.jpg)\n\
  \n\n\n\n这里需要注意的问题是，只有内建类型的非常简单的常量会被你的 C++ 编译器内联。默认情况下，你以这种方式定义的任何变量都会导致编译器在包含该头文件的每个模块中都为该变量存储空间。在上一个用例中，这种情况会发生在\
  \ `float` 和 `string` 常量上。如果你声明了大量的常量，并且你的 API 头文件被包含在许多 `.cpp` 文件中，这可能会导致客户端的 `.o`\
  \ 对象文件和最终二进制文件的膨胀。解决方案是将常量声明为 `extern`：\n\n![image](img/u08-10-9780443222191.jpg)\n\
  \n然后在相应的 `.cpp` 文件中定义每个常量的值。通过这样，变量的空间只会被分配一次。这还具有额外的好处是从头文件中隐藏实际的常量值：毕竟，它们是实现细节。\n\
  \n实现此点的更好方法是如果你可以在类内部声明常量。那么你就可以将它们声明为 `static const`（这样它们就不会计入每个对象的内存大小）：\n\n![image](img/u08-11-9780443222191.jpg)\n\
  \n然后你可以在关联的 `.cpp` 文件中定义这些常量的值：\n\n![image](img/u08-12-9780443222191.jpg)\n\n你可能认为这是一个微不足道的优化，节省的空间空间忽略不微。然而，在\
  \ Linden Lab，我们决定清理 Second Life Viewer 源代码中的所有此类实例。最终效果是生成的文件大小显著减少了 10%。\n\n如果你正在使用\
  \ C++17（或更高版本）编译器，那么你应该利用 `inline` 变量来解决这个问题，这允许你简单地将常量及其值直接放在头文件中。\n\n在某些情况下，避免膨胀问题的另一个选项是使用\
  \ `enums` 作为变量的替代方案。或者，你也可以使用 getter 方法来返回常量值，例如：\n\n![image](img/u08-13-9780443222191.jpg)\n\
  \n### `constexpr`, `coneval` 和 `constinit` 关键字\n\n之前大多数选项的问题是，编译器无法无法在编译时评估 `const`\
  \ 表达式，因为实际值隐藏在 `.cpp` 文件中。例如，客户端将无法执行以下操作：\n\n![image](img/u08-14-9780443222191.jpg)\n\
  \n然而，`constexpr` 关键字从 C++11 开始引入，允许进行更激进的编译时优化。它可以用于指示你已知是常量的函数或变量，以便编译器可以进行更大的优化。例如，考虑这段代码：\n\
  \n![image](img/u08-15-9780443222191.jpg)\n\n根据 C++03 标准，这是非法的，因为编译器无法知道 `GetTableSize()`\
  \ 返回的值是一个编译时常量。但在 C++11 下，你可以告诉编译器情况是这样的：\n\n![image](img/u08-16-9780443222191.jpg)\n\
  \n`constexpr` 关键字也可以应用于变量。然而，将函数的标记标记为编译时常量为我们使用函数调用定义常量打开了大门，同时允许客户端在编译时使用该常量。例如：\n\
  \n![image](img/u08-17-9780443222191.jpg)\n\n正如我在《C++修订》中介绍过的，C++20 通过引入 `coneval`\
  \ 和 `constinit` 向标准添加了更多限定符。`coneval` 限定符允许函数用于常量表达式，并要求函数在编译时进行求值。`constinit` 限定符确保静态存储变量在编译时初始化，以避免加载时的初始化问题。以下是这些听音相似的关键字之间的快速总结：\n\
  \n1. `const` 声明对象或变量是不可变的（例如，该方法不更改任何数据，或者变量不能被修改）。\n2. `constexpr` 可以用于函数和变量，产生一个可以在编译时或运行时评估的常量表达式；`constexpr`\
  \ 函数和静态数据成员也是隐式的 `inline`。\n3. `coneval` 只能用于函数，并要求函数在编译时进行求值；`coneval` 隐含 `inline`。\n\
  4. `constinit` 仅用于可以在编译时初始化的静态存储变量。此外，你不能将 `constinit` 和 `constexpr` 同时使用。\n\n##\
  \ 初始化列表\n\nC++ 提供了初始化列表（Initialization lists）来方便你初始化成员变量。使用这种功能可以比在构造体内部初始化成员变量获得细微的性能提升。例如，与其写：\n\
  \n![image](img/u08-18-9780443222191.jpg)\n\n你也可以写：\n\n![image](img/u08-19-9780443222191.jpg)\n\
  \n成员变量在构造体执行之前被构造，因此在第一个示例中，`std::string` 构造函数会被调用，然后在构造体内部调用赋值运算符。然而，在第二个示例中，只调用了赋值运算符。\n\
  \n当然，从良好的 API 设计角度来看，你应该尽可能从头文件中隐藏实现细节。因此，最佳方法是在头文件中将类定义为：\n\n![image](img/u08-20-9780443222191.jpg)\n\
  \n然后在相应的 `.cpp` 文件中提供构造函数和初始化列表：\n\n![image](img/u08-21-9780443222191.jpg)\n\n在使用初始化列表时，需要注意以下几点：\n\
  \n* 1. 初始化列表中的变量顺序与它们在类中指定的顺序一致。\n* 2. 你不能在初始化列表中指定数组。然而，你可以指定 `std::vector`，这通常是更好的数据结构选择。\n\
  * 3. 如果你正在声明派生类，任何基类的默认构造函数将被隐式调用。你可以使用初始化列表调用非默认构造函数。如果指定了，对基类构造函数的调用必须出现在成员变量之前。\n\
  * 4. 如果你将任何成员变量声明为引用或 `const`，则必须通过初始化列表来初始化它们（以避免默认构造函数定义初始且唯一的值）。\n\n在 C++03 中，构造函数不能调用其他构造函数。然而，这一限制在\
  \ C++11 中被放宽，允许构造函数调用类中的其他构造函数。这允许你通过将一个构造函数的实现委托给另一个来避免在构造函数之间拷贝代码，如此例所示：\n\n![image](img/u08-22-9780443222191.jpg)\n\
  \n虽然可以使用带有默认参数的单构造构造函数来实现相同的效果，但这会将默认值硬编码到客户端的代码中。C++11 的语法允许你隐藏此值，因为你可以（并且应该）在\
  \ `.cpp` 文件中定义初始化列表。\n\n\n\n\n在现代 CPU 上，内存延迟可能是大型应用程序最大的性能关注点之一。这是因为虽然处理器的速度以每年约\
  \ 55% 的速度增长，但 DRAM 的访问时间增长速度仅为每年 7% 左右（Hennessy and Patterson, 2006）。这导致了所谓的“处理器与内存性能差距”，如图\
  \ 8.1 所示。\n\n由于这一趋势，内存开销现在是大多数程序执行时间的主要因素。事实上，缓存未命中（即访问主内存的成本）的已从 30 年前的几个 CPU 周期增加到现代架构上的\
  \ 400 多个周期，这进一步加剧了问题。其结果是，看似优雅且证明正确的算法可能会因为意料之外的缓存行为而在现实情况中表现糟糕（Albrecht, 2009）。因此，缓存未命中优化已成为近年来性能优化活动中一个至关重要的元素。\n\
  \n虽然本书的重点不是提供在存在缓存的情况下优化实现细节的技术，但你也可以采取一些与 API 相关的努力来提高数据缓存效率。一个关键技术是减小对象的大小：对象越小，潜在的更多的对象可以放入缓存。你可以通过几种方法减小对象的大小：\n\
  \n![image](img/f08-01-9780443222191.jpg)\n\n图 8.1 CPU 性能改进与内存改进之间不断扩大的差距。纵轴为对数刻度。改编自\
  \ Hennessy, J.L. and Patterson, D.A., 2006. Computer Architecture: A Quantitative\
  \ Approach, Fourth ed. Morgan Kaufmann, ISBN 0123704901\\. Copyright Morgan Kaufmann\
  \ Publishers.\n\n1. **按类型对成员变量进行分类。** 现代计算机一次访问一个字（word）。因此，你的 C++ 编译器会对某些数据成员进行对齐，使它们的内存地址落在字边界上。为了实现这一点，结构体中可能会添加一些未使用的填充字节。通过将所有相同类型的成员变量聚集在一起，你可以最大限度地减少由于这些填充字节丢失的内存。表\
  \ 8.2 提供了 Windows 平台上成员变量的示例图表。\n\n2. **使用位域。** 位域是成员变量的一种装饰器，用于指定该变量应该占据多少位（例如，`int:4`）。这对于将几个\
  \ `bool` 打包到单个字节中，或将另外两个数字挤进单个 `int` 的空间里特别有用。缺点是，使用不是 8 的倍数的位域大小通常会有性能损失，但如果内存是你最大的关注点，这可能是一个可以接受的代价。在实现性能优化时，你通常必须为了大小牺牲速度，或者反之。记住，当你怀疑某项功能的影响时，请测量真实世界的性能。\n\
  \n3. **使用联合体（unions）。** `union`（或 C++ 中的 `std::variant`）是一种数据成员共享相同内存的结构体。它可以允许多个不同不同使用的值共享同一区域，从而节省内存。联合体的大小是最大类型的大小。例如：\n\
  \n![image](img/u08-23-9780443222191.jpg)\n\n4. **在需要之前不要添加虚方法。** 我在第 2 章中建议此方法作为保持\
  \ API 最小完整的方法，但这样做也有性能上的考虑。一旦向类中添加了一个虚方法，该类就需要一个虚函数表（vtable）。每个类只需要分配一个 `vtable`\
  \ 副本，但你的对象的每个实例中都存有一个指向 `vtable` 的指针。这会给总大小增加一个指针的大小（通常 32 位系统为 4 字节，64 位系统为 8 字节）。\n\
  \n表 8.2 Windows 上 x86 下不同类型成员变量的典型对齐。\n\n| 类型 | 大小（字节） | 对齐（字节） |\n| --- | --- |\
  \ --- |\n| `bool` | 1 | 1 |\n| `char` | 1 | 1 |\n| `short int` | 2 | 2 |\n| `int`\
  \ | 4 | 4 |\n| `float` | 4 | 4 |\n| `double` | 8 | 8 |\n| 指针/引用 (32 位) | 4 | 4 |\n\
  | 指针/引用 (64 位) | 8 | 8 |\n\n这些大小可能随平台和处理器而异。\n\n5. **使用显式大小的类型。** 各种类型的大小可能根据平台、编译器以及你是在\
  \ 32 位还是 64 位架构上进行构建而不同。如果你想指定成员变量的精确大小，那么你应该使用一种专门强制执行此点的类型，而不是假设 `bool`、`short`\
  \ 或 `int` 等类型具有特定大小。从 C++11 开始，你可以使用 `cstdint` 头文件来访问各种固定宽整数类型，如 `int8_t`、`uint32_t`\
  \ 和 `int64_t`。\n\n让我们来看一个例子。以下结构体定义了烟花（fireworks）的各种信息。B9780443222191000052/main.assets/f08-01-9780443222191.jpgIMAGES/B9780443222191000052/main.assets/u08-23-9780443222191.jpgIMAGES/B9780443222191000052/main.assets/u08-24-9780443222191.jpgIMAGES/B9780443222191000052/main.assets/u08-25-9780443222191.jpgIMAGES/B9780443222191000052/main.assets/u08-26-9780443222191.jpgIMAGES/B9780443222191000052/main.assets/u08-27-9780443222191.jpg（由于原文中图片描述较乱，此处已根据上下文进行逻辑翻译）。\n\
  \n自 C++11 起，你可以使用 `cstdint` 头文件来访问各种固定宽整数类型，如 `int8_t`、`uint32_t` 和 `int64_t`。\n\
  \n以下结构体定义了烟花。它包含了颜色信息、关于烟花是否激活的标志，以及屏幕坐标。我将分别使用 `char` 和 `short` 类型来简化后续图表，但实际上你可以使用特定大小的类型如\
  \ `int8_t` 和 `uint16_t`：\n\n自 C++11 起，你可以使用 `cstdint` 头文件来访问各种固定宽整数类型，如 `int8_t`、`uint32_t`\
  \ 和 `int64_t`。\n\n这种特定情况下在 32 位计算机上占用 48 字节：即 `sizeof(Fireworks) == 48`。\n\n如果你简单地根据类型对成员变量进行分类并根据其进行排序（`bool`、`char`，然后\
  \ `int`），那么结构体的大小可以减少到 32 字节，减少了 33%。\n\n你仍然可以从结构体中挤出几个字节。然而，通过使用位域，你可以让每个 `bool`\
  \ 标志占据一个位而不是整个字节。这样做让结构体的大小缩小到 28 字节，减少了 42%。\n\n最后，你可以退一步考虑每个变量的实际大小需求，而不是简单地对所有整数值使用\
  \ `int`。这样做，你可能会决定 RGB 差异值只需要 1 字节，而屏幕坐标每个只需要 2 字节。我将分别使用 `char` 和 `short` 类型来简化后续图表，但实际上你可以使用特定大小的类型如\
  \ `int8_t` 和 `uint16_t`：\n\n此版本的结构体仅占用 16 字节，与原始未优化的 48 字节相比减少了 66%。仅仅通过重新排列成员变量并稍微考虑它们需要多大，这是一个巨大的内存节省。图\
  \ 8.2 向你展示了在这些四种配置中你的内存具体流向了哪里。\n\n\n\n在一个关于性能的章节中给出这样的建议可能看起来很奇怪：不要内联（inline）代码！然而，这首先是一本关于\
  \ API 的书，而在你的头文件中内联代码违反了 API 设计的黄金法则之一：不要暴露实现细节。这并不是说你永远不要内联代码。有时你的性能需求要求你这样做，但你应该在保持清醒并充分理解其影响的情况下进行，例如：\n\
  \n1. **暴露实现细节。** 正如我刚刚介绍的，在公共 API 头文件中避免内联的首要原因是，内联会导致你直接在头文件中暴露 API 方法的实现。我在第 2\
  \ 章中花了一个整个章节详细说明了为什么你不应该这样做。\n\n2. **嵌入在客户端应用程序中的代码。** API 头文件中的内联代码会被直接编译到客户端的应用程序中。这意味着每当你发布带有内联代码更改的新\
  \ API 版本时，客户端都必须重新编译他们的代码。他们不能简单地将新版本的共享库放到他们的安装目录中，并期望应用程序能够直接运行。换句话说，内联破坏了二进制兼容性。\n\
  \n3. **代码膨胀。** 过度的内联会显著增大对象文件和生成的二进制文件的大小。这当然是因为每个对内联方法的调用都会被该方法的所有操作所取代。这种较大的代码体积最终可能会导致更多的磁盘访问和虚拟内存页错误，从而降低性能。\n\
  \n4. **调试复杂化。** 许多调试器在处理内联代码时存在问题。这完全可以理解：在一个实际上不存在的函数中设置断点是很的！回避这些问题的常用方法是关闭调试代码的内联。\n\
  \n正如唐纳德·纳（Donald Knuth）著名的所言：“过早优化是万恶之根源” (Knuth, 1974)。\n\n尽管有这些缺点，仍然可能存在需要在 API\
  \ 的公共头文件中放入内联代码的情况。这样做的主要原因有两个：\n\n1. **性能。** 使用 getter 和 setter 方法封装对成员变量的访问，如果这些方法每秒被调用多次，可能会对你的代码产生性能影响。内联可以收回这些性能损失，同时允许你保留\
  \ getter/setter 方法（本书配套的源代码有一个简单的程序可以让你自己测试这一点）。然而，将函数标记为 `inline` 并不一定能带来性能提升。其一在于，这仅仅是给编译器的一个提示，可能会被忽略。某些请求可能被忽略的情况包括：在函数中使用循环、调用另一个内联函数或递归。即使编译器确实内联了该方法，生成的代码也可能更大或更小，运行可能更快或更慢，这取决于方法的原始大小、你\
  \ CPU 的指令缓存以及你的虚拟内存系统 (Cline et al., 1998)。内联对于小型、简单且频繁调用的函数效果最好。\n\n2. **模板。**\
  \ 你可能在头文件中也使用了模板，因此被迫内联模板的实现。然而，正如我在上一章关于 C++ 使用的章节中所提到的，你有时可以使用显式模板实例化来避免这种情况。\n\
  \n对于那些需要使用内联代码的情况，我将讨论其最佳做法。内联代码的一种方法是直接在类体中包含方法的实现，例如：\n\n![image](img/u08-28-9780443222191.jpg)\n\
  \n这完美地说明了在头文件中包含实现细节的顾虑：你的 API 的用户可以查看你的头文件，并准确地看到内联方法是如何实现的。在这个示例中，实现是简单的，但它很容易暴露出更多的复杂性。\n\
  \n另一种内联代码的方法是使用 C++ 的 `inline` 关键字。这种方法与之前的语法相比至少有一处改进，即它允许你在类体之外定义方法的代码。虽然代码仍在头文件中，但至少你没有用代码来混淆类声明：\n\
  \n![image](img/u08-29-9780443222191.jpg)\n\n一种更好的风格是将内联语句隐藏在单独的头文件中，该头文件的文件名指示其包含实现细节。这与我之前处理模板时建议的技术是相同的，并且被许多多个工业级\
  \ API（如 Boost 头文件）使用。Boost 使用“detail”子目录的约定来存放所有必须在头文件中暴露的私有细节，然后从公共头文件中 `#include`\
  \ 它们。例如：\n\n![image](img/u08-30-9780443222191.jpg)\n\nBoost 头文件通常使用“detail”命名空间的约定包含所有私有细节，例如\
  \ `boost::detail`。这是一个良好的实践。最后，我将说明本节是关于避免内联的。在 C++17 中，你也可以对外部链接进行定义。\n\n## 写复制（Copy\
  \ on write）\n\n节省内存的最佳方法之一是在需要时不分配任何内存。这是写复制（COW）技术的核心目标。这些技术通过允许所有客户端共享同一个资源，直到其中一个需要进行修改来实现。只有在那个点才会创建副本。因此名为写复制。其优势在于，如果资源从未被修改，就可以被共享。这与重量类模式有关，该模式描述了尽可能共享内存以减少消耗的对象\
  \ (Gamma et al., 1994)。\n\n![image](img/f08-22.jpg)\n\nFigure 8.2 类中成员变量的不同配置内存布局。Fireworks_A\
  \ 是未经优的版本，Fireworks_B 采用了类型聚类，Fireworks_C 使用位域压缩 bool 变量，而 Fireworks_D 使用了较小的整数类型。\n\
  \n![image](img/f08-03.jpg)\n\nFigure 8.3 写复制的说明：Object1 和 Object2 可以共享同一个资源，直到 Object2\
  \ 想要更改它，此时必须创建一个副本，以便更改不会影响 Object1 的状态。\n\n例如，多个存储相同文本的字符串对象可以共享同一个内存缓冲区。当其中一个字符串必须修改文本时，它会创建一个缓冲区的副本，以便修改不会影响其他字符串。图\
  \ 8.3 释了这一概念。大多数 C++ 标准库字符串实现使用写复制，因此按值传递它们非常廉价 (Stroustrup, 2000)。\n\n\n\n\n\n\
  多种方法实现写时复制（copy on write）。一种流行的方法是声明一个类模板，允许你创建指向由写时复制语义管理的对象的指针，就像你创建共享指针（shared\
  \ pointer）或弱指针（weak pointer）模板一样。该类通常包含一个标准的共享指针，用于跟踪底层对象的引用计数，并提供一个私有的 `Detach()`\
  \ 方法，用于修改对象的操作，这些操作需要从共享对象中分离（detach）并创建一个新副本。下面使用共享指针展示了这种实现方式。为了清晰起见，我在类声明内部使用了内联方法（inline\
  \ methods）来展示这一点。在实际应用中，理当然，你应该将这些内联定义隐藏在单独的头文件中，因为它们会模糊接口声明：\n\n![image](img/u08-31p1-9780443222191.jpg)\
  \ ![image](img/u08-31p2-9780443222191.jpg)\n\n该类随后可以这样使用：\n\n![image](img/u08-32-9780443222191.jpg)\n\
  \n在这个示例中，`string2` 指向与 `string1` 相同的对象，而 `string3` 指向该对象的副本，因为它需要修改它。正如我提到的，许多 `std::string`\
  \ 的实现本身就会使用写时复制语义。我只是用此作为一个方便的示例。\n\n在之前的 `CowPtr` 实现中，存在一个可以被利用的漏洞。用户可能会深入写时复制指针内部，并访问底层对象以持有对其数据的引用。随后，他们可以直接修改数据，从而影响所有共享该对象的\
  \ `CowPtr` 变量。例如：\n\n![image](img/u08-33-9780443222191.jpg)\n\n在这段代码中，用户获取了 `string1`\
  \ 底层 `std::string` 中某个字符的引用。在创建 `string2` 后（它与 `string1` 共享内存），用户直接更改了共享字符串中的第二个字符，导致\
  \ `string1` 和 `string2` 现在都等于“Spare Me”。\n\n避免这种误用的最佳方法是简单地不向客户端暴露 `CowPtr`。在大多数情况下，你不需要客户端知道你正在使用写时复制优化：毕竟这只是实现细节。相反，你可以使用\
  \ `CowPtr` 来声明你对象中的成员变量，而无需以任何方式改变你的公共 API。这在 Qt 库中被称为隐式共享（implicit sharing）。例如：\n\
  \n![image](img/u08-34-9780443222191.jpg)\n\n其中 `MyObject` 的实现可能如下：\n\n![image](img/u08-35-9780443222191.jpg)\n\
  \n通过这种方式，你的客户端可以使用 `MyObject` API，而无需知道它使用了写时复制，但在底层，对象会尽可能地共享内存，并实现更高效的拷贝和赋值操作：\n\
  \n![image](img/u08-36-9780443222191.jpg)\n\n在这个示例中，`obj1` 和 `obj2` 将共享同一个底层字符串对象，而\
  \ `obj3` 将包含它自己的副本，因为它修改了字符串。\n\n## 遍历元素\n\n对对象集合进行遍历是客户端代码中一项极其常见的任务，因此值得花些时间查看具有不同优缺的备替代策略。这样你就可以根据自己的\
  \ API 需求选择最佳解决方案。\n\n### 迭代器\n\nC++ 标准库处理此问题的方法是使用迭代器（iterators）。迭代器是能够遍历容器类中部分或全部元素的对象（Josuttis,\
  \ 1999）。迭代器指向容器中的单个元素，并提供了多种可用操作符，例如 `operator*` 返回当前元素，`operator->` 直接访问容器元素的成员，以及\
  \ `operator++` 向前移动到下一个元素。这种设计刻意地模仿了 C/C++ 中普通指针操作的接口。\n\n客户端随后可以使用每个容器类上的 `begin()`\
  \ 和 `end()` 方法来返回限定容器内所有元素的迭代器，或者它们可以使用各种标准库算法，这些算法返回返回所有元素集合内的迭代器，例如 `std::find()`、`std::lower_bound()`\
  \ 和 `std::upper_bound()`。接下来的代码段提供了一个使用标准库迭代器求和 `std::vector` 中所有值的简单示例：\n\n![image](img/u08-37-9780443222191.jpg)\n\
  \n这纯粹是一个说明性示例。如果你真的想计算容器中所有元素的总和，你应该优先使用标准库算法 `std::accumulate`。\n\n从 API 的角度来看，这里是你可能采用迭代器模型的原因：\n\
  \n1. 迭代器是一种大多数工程师已经熟悉的模式。因此，他们他们优先使用自增（`++it`）而不是后增（`it++`），以避免构造临时变量。\n2. 迭代器抽象适用于顺序数据结构（如数组或列表），也适用于复杂的数据结构（如集合和映射，它们通常实现为自平衡树（Josuttis,\
  \ 1999)）。\n3. 迭代器的实现可以非常高效，有时简单如指针。事实上，`std::vector` 迭代器在 Visual C++ 6 和 GNU C++\
  \ 3 中这样实现的（尽管现代标准库实现使用专门的迭代器类）。\n4. 迭代器可以遍历可能无法完全放入内存的海量数据集。例如，迭代器可以在需要时分页数据块，并释放之前处理过的块。当然，客户端也可以在任何点停止遍历，而无需访问每个元素。\n\
  5. 客户端可以创建多个迭代器来遍历相同的数据并同时使用这些迭代器。如果客户端希望在遍历时插入或删除元素，有既定的模式可以在保持迭代器完整性的这样做。\n\n\
  ### 随机访问\n\n迭代器允许客户端遍历容器中的每个元素。然而，你可能需要支持随机访问，例如访问数组或 vector 容器中的特定元素。支持随机访问的 C++\
  \ 标准库容器通过以下方式提供支持：\n\n- `[]` 操作符。旨在模拟 C/C++ 的数组索引语法。通常该运算符不做边界检查，因此可以变得非常高效。\n-\
  \ `at()` 方法。该方法要求检查所提供的索引是否超出范围，在这种情况下抛出异常。结果是这种方法可能比 `[]` 操作符慢。\n\n为了说明这些概念，上一节中的迭代器源码示例可以用\
  \ `[]` 操作符重写为：\n\n![image](img/u08-38-9780443222191.jpg)\n\n\n\n\n在性能方面，这两种方法本质上是等效的。显然，对于特定的平台和编译器，某种方法可能比另一种方法略微高效一些，但总的来说，它们涉及的开销是相当的。\n\
  \n如果你计划在你的 API 中添加随机访问功能，你应该努力采用之前的设计，以保持与标准库的一致性。然而，如果你的 API 不需要为底层数据提供随机访问，你应该倾向于使用迭代器模型而不是\
  \ `operator[]` 方法，这仅仅是因为迭代器能更清晰地表达用户的意图，并生成的客户端代码更加直观且一致。\n\n### 数组引用\n\n作为迭代器的替代方案，某些\
  \ API 使用了这种方法，即用户通过引用传递一个数组数据结构。API 然后将请求的元素填充该数组并将其返回给用户。Maya API 广泛使用了这种模式。Autodesk\
  \ Maya 是一种高端 3D 建模和动画系统，广泛应用于电影和游戏行业。该包包含了 C++ 和 Python API，提供了对场景中底层 2D 和 3D 数据的程序化访问。\n\
  \n作为这种模式的示例，`MfnDagNode::getAllPaths()` 方法用于返回 Maya 场景图中的一系列节点路径。这是通过引用传递一个 `MDagPathArray`\
  \ 对象实现的，该对象随后被填充了 `MDagPath` 引用。这种设计的原因（以及你可能在自己的 API 中偏好这种方法的原因）如下：\n\n1. 该方法的主要目的是性能。本质上，它是一种将图数据结构中一系列连接的节点折叠为顺序数组数据结构的方法。这提供了一个可以非常高效地迭代的数据结构，同时也让内存中相邻的元素彼此定位。结果是，这种数据结构可以更好地利用\
  \ CPU 缓存策略，而树结构中的单个节点可能会被碎片化地分布在进程的地址空间中。\n\n2. 如果客户端保留同一个数组以处理多次对 `getAllPaths()`\
  \ 的调用，这种技术将特别高效高效。此外，如果保留数组以支持对其元素进行多次迭代，那么填充数组的任何初始性能开销都可以得到补偿。\n\n3. 这种技术还提供了迭代器模型不具备的特定特性：对非连续元素的支持。也就是说，传统的迭代器无法处理元素的不同排序或从序列中跳过某些元素，而使用数组引用技术，你可以按任何顺序用任何子集填充数组。\n\
  \n这种概念在其他语言中也可见，例如 PHP 中的 `iterator_to_array()` 函数，它可以用于在某些情况下将迭代器转换为数组以便更快地遍历。\n\
  \n作为使用用户提供的数组的替代方案，你也可以返回一个对象的常量容器并依赖编译器的返回值优化（RVO）来避免数据拷贝。\n\n### 外部模板 (Extern\
  \ templates)\n\nC++03 中使用模板的一个问题是，编译器必须在实例化模板的每个编译单元中生成代码。大多数现代编译器会在链接时组装最终二进制文件时丢弃任何重复代码，但这仍然会导致编译时间增加和中间对象代码体积增大。\n\
  \nC++11 引入了 `extern templates` 的概念来改善这种状况。这允许你在编译单元中定义模板而不实例化。最终，这个特性不会影响你的公共接口，但它可以帮助你的客户端提高编译和链接性能。\n\
  \n例如，考虑在 `header.h` 文件中定义的这个类模板：\n\n![image](img/u08-39-9780443222191.jpg)\n\n该模板可以在多个编译单元中实例化。例如，这两个模块都为类型\
  \ `int` 实例化了模板的特化：\n\n![image](img/u08-40-9780443222191.jpg)\n\n在这种情况下，编译器将在 `module1.o`\
  \ 和 `module2.o` 目标文件中都为模板实例化生成代码。为了避免这种情况，你可以通过 `extern template` 防止在其中一个模块中实例化模板。例如，\n\
  \n![image](img/u08-41-9780443222191.jpg)\n\n通过此更改，编译器将不再为 `module2.o` 中的模板实例化生成代码。生成的库或可执行二进制文件在每种情况下都是相同的，但编译器可以做更少的工作，并产生更小的中间产物。\n\
  \n在使用 `extern templates` 时，你有责任确保模板至少在一个编译单元中被实例化；否则你将得到未定义符号的链接错误。\n\n## 性能分析\n\
  \n在本章关于性能的最后章节中，我将介绍一些工具和技术，帮助你测量系统的性能。大多数工具都旨在分析你的实现代码的性能，因此它们与你如何设计 API 没有直接关系。然而，这显然仍然产生高效\
  \ API 的重要部分，因此值得关注。\n\n我将考虑性能的几个不同方面：基于时间的性能、内存开销和多线程竞争。此外，虽然本章的前几节处理的是 C++ 的稳定特性，但随后的文本介绍了可能会随时间变化的软件产品。产品会产生、消失、所有权变更和重点转移。然而，我已努力在出版时尽可能使此列表是最新的。\n\
  \n### 基于时间的分析\n\n性能最传统的解释是你的代码执行操作需要多久。例如，如果你正在开发一个图像处理库，你的 `Sharpen()` 或 `RedEyeReduction()`\
  \ 方法在给定图像上运行需要多久？这里的含义是你，必须编写一些使用你 API 的示例或测试程序，这样你就可以对 API 的性能进行计时。如果你已经编写了此类程序，有几种形式的性能分析可以考虑：\n\
  \n- 内部插桩（In-house instrumentation）。你可以执行的最有针对性且最高效的性能分析是你自己编写的。每种软件都是不同的，因此你代码中对性能敏感的部分将特定于你的\
  \ API。因此，拥有一个快速的计时器类是极其有益的，它可以插入到代码的关键点以收集准确的计时信息。结果可以输出到文件中进行离线分析，或者你的客户端可以将计时器结果的可视化显示集成到他们的最终用户应用程序中。\n\
  \n- Second Life Viewer 通过其 `LLFastTimer` 类提供了这种能力。它通过在代码的关键部分插入 `LLFastTimer()`\
  \ 调用来实现，并使用可扩展的标签来标识正在分析的区域，例如 `LLFastTimer(RENDER_WATER)`。Second Life Viewer 本身提供了一个调试覆盖层显示，以实时查看计时器的累积结果。这种调试视图的示例见图\
  \ 8.4。\n\n![image](img/f08-04-9780443222191.jpg)\n\n\n\n\n## 2. 二进制插桩\n该技术通过添加记录每个函数调用详细信息的代码，来对程序或共享库进行插桩。运行插桩后的二进制文件可以为该会话创建函数调用的精确追踪（trace）。通过处理生成的数据，可以确定程序耗时最长的顶层调用堆栈。\n\
  \n这种方法的的一个缺点是，额外的插桩开销会显著减慢程序的执行速度，有时甚至会慢 10-100 倍，尽管相对性能应该会保持。最后，这种技术显然无法对二进制文件中未以符号形式呈现的函数（例如内联函数）进行计时。\n\
  \n## 3. 采样\n这涉及使用一个独立的程序对你的测试应用程序持续采样，以确定其程序计数器。这是一种低开销的统计技术，意味着它可能不会记录应用程序执行的每一个函数调用，但只要采样率足够高，它仍然可以告诉你应用程序在什么地方花费了大部分时间。\n\
  \n采样可以在系统级进行（例如，查看应用程序是否在系统调用上花费了大量时间，如是否是 I/O 密集型），也可以限定到应用程序中的函数。除了记录时间样本外，该技术还可以引用处理器事件的采样，例如缓存缺失、分支预测错误和\
  \ CPU 停顿。\n\n## 4. 计数器监控\n许多商用操作系统提供性能计数器，报告各种子系统（如处理器、内存、网络和磁盘）的性能情况。例如，微软提供了 `Performance\
  \ Counters API` 来访问 Windows 平台上的计数器数据。通过在应用程序运行时监控这些计数器，你可以确定系统瓶颈，并评估系统资源匮如何如何影响你\
  \ API 的性能。\n\n鉴于这些性能分析技术的分类，接下来的列表提供了本书出版时市场上的性能剖析工具的概览：\n\n1. **Intel VTune**:\
  \ 这是一个适用于 Microsoft Windows 和 Linux 平台的商用性能分析套件。它包含了二进制插桩功能（称为 `call graph`）、基于时间和事件的采样以及计数器监控等在内的多种工具。它还附带了广泛且强大的图形化工具，用于可视化生成的性能数据。\n\
  2. **gprof**: `GProf` 是 GNU 性能分析器。它使用二进制插桩来记录每个函数的调用次数和在函数内花费的时间。它与 GNU C++ 编译器集成，并通过\
  \ `-pg` 命令行选项激活。运行插桩后的二进制文件会在当前目录中创建一个数据文件，可以使用 `gprof` 程序（或 macOS 上的 `Saturn` 应用）进行分析。\n\
  3. **OProfile**: 这是一个用于 Linux 的开源性能工具。它是一个系统级的采样分析器，也可以利用硬件性能计数器。可以在函数或指令级生成剖析数据，该软件支持在源代码树上标记剖析信息。\n\
  4. **AMD CodeXL**: 这是一个由 AMD 提供的免费性能分析器，运行在 Windows 和 Linux 上。它基于 `OProfile`，并对分析和可视化\
  \ AMD 处理器的流水线阶段提供了特定支持。\n6. **Open SpeedShop**: 适用于 Linux 的开源性能测量工具，基于 SGI 的 `IRRIX\
  \ SpeedShop`，目前由 Krell 学院支持。`Open SpeedShop` 使用采样技术并支持硬件性能计数器。它提供了对并行和多线程程序的支持，还包含一个\
  \ Python 脚本 API。\n7. **Sysprof**: 这是一个用于 Linux 的开源性能分析器。它使用系统级采样技术，在你的应用程序运行时对整个\
  \ Linux 系统进行剖析。它提供了一个简单的用户界面来浏览生成的数据。\n8. **Callgrind**: `Callgrind` 是 Linux 和 macOS\
  \ 上 `valgrind` 插桩框架的一部分。它使用二进制插桩技术来收集特定程序运行的调用图和指令数据。可以使用单独的 `KCachegrind` 工具来可视化剖析数据。可选的缓存模拟器可用于分析内存访问行为。\n\
  9. **Apple Shark**: `Shark` 是由 Apple 编写的系统级采样分析器，作为其开发者工具的一部分免费提供。它还可以分析硬件和软件事件，例如缓存缺失和虚拟内存活动。`Shark`\
  \ 包含一个直观且易用的界面，用于浏览你 Apple 应用程序的热点。\n10. **DTrace**: `DTrace` 是一个独特且强大的追踪框架，可以实时监控应用程序。这是通过编写自定义追踪程序实现的，这些程序可以定义探针（probes）列表以及探针触发时执行的动作（actions）。探针包括打开文件、启动进程和执行特定行；动作可以分析运行时上下文（如调用堆栈）。Apple\
  \ 在 macOS 10.5 中加入了 `DTrace`，并附带了一个名为 `Instruments` 的 GUI。它在 FreeBSD 上也作为 `ktrace`\
  \ 提供。\n\n### 基于内存的分析\n\n正如我在本章早期提到的，内存性能可能与基于时间的性能一样重要。频繁分配和释放内存的算法，或者其内存分配特征无法良好映射到现代处理器缓存的算法，最终性能可能远低于预期。此外，像双重释放（double\
  \ freeing）或访问未分配内存等内存 bug 会损坏数据或导致崩溃，而内存泄漏会随时间累积，直到耗尽所有可用内存，使你的客户端应用程序性能降低到极其缓慢或导致其崩溃。\n\
  \n这些工具可以用于分析你 API 的内存性能并检测内存 bug：\n\n1. **UNICOM Systems PurifyPlus**: 这是一个商用内存调试器，使用二进制插桩检测\
  \ `C`/`C++` 程序中的内存访问错误。程序运行后，`Purify` 输出一个报告文件，可以通过图形化界面进行浏览。它包含一个可以在程序内部调用的 API。`Purify`\
  \ 适用于 `Solaris`、`Linux`、`AIX` 和 `Windows`。\n3. **Valgrind**: `Valgrind` 是用于 Linux\
  \ 和 macOS 的开源插桩框架，最初是一个内存分析工具。然而，它已演变为更通用的性能分析工具。它通过对可执行文件进行二进制插桩来工作，并在程序结束时输出文本报告。有多个前端\
  \ GUI 可浏览输出文件，例如 `Valkyrie` 和 `Alleyoop`。\n4. **Perforce TotalView MemoryScape**:\
  \ 适用于 Unix 和 macOS 平台的商用内存分析工具，不需要二进制插桩。它提供堆内存的实时图形视图，包括内存使用情况、分配边界越界和泄漏。它处理并行和多线程程序，并整合了一种脚本语言以进行批量测试。\n\
  5. **Parasoft Insure++**: 这是一个适用于 Windows、Linux、`Solaris`、`AIX` 和 `HP-UX` 的商用内存调试器。`Insure++`\
  \ 通过在编译行前加上 `insure` 程序在源码级别进行插桩。你甚至可以在 `__Insure_trap_error()` 中添加断点，以便调试器在检测到错误时停止。当然，还有一个\
  \ GUI 工具让你浏览检测到的内存错误。\n\n\n\n\n\n## 6. Synopsys Coverity\nCoverity 与我列出的其他工具不同。它是一个静态分析工具，这意味着它可以在不执行程序的情况下检查你的源代码。它将所有潜在的编码错误记录在数据库中，并为每个错误分配一个唯一的\
  \ ID，该 ID 在多次分析运行中保持稳定。它提供了一个 Web 界面来查看静态分析的结果。\n\n### 多线程分析\n我将在这里介绍的性能最后一个方面是多线程性能。编写高效的多线程代码是一项非常困难的任务，但幸运的是，有很多有很多工具可以帮助你发现代码中的逻辑线程错误（例如竞态条件或死锁），并对线程代码的性能进行分析，以找到并发瓶颈：\n\
  \n1. **Intel Inspector**: 这是一个适用于 32 位和 64 位 Windows 及 Linux 的商业线程分析工具。它可以用于发现逻辑线程线程错误，例如潜在的死锁。你可以将其作为命令行工具来输出文本报告，也可以使用随附的可视化\
  \ GUI，它会将潜在错误映射到源代码行。\n\n2. **Intel VTune**: VTune 的线程分析器组件允许你通过显示时间轴来可视化你的线程应用程序的行为，时间轴会显示你的线程正在做什么以及它们如何相互作用。这让你能够判断是否从代码中获得了最大的并发性。它可以在\
  \ Windows 和 Linux 上运行。\n\n3. **Intel Parallel Studio XE**: Intel 的 Parallel Studio\
  \ 提供了一套工具来支持多核系统上的并行应用程序，包括一个识别并行化候选函数的实用程序、Intel 线程构建块（Threading Building Blocks）、一个检测线程和内存错误的检查工具，以及一个用于并行应用程序的性能分析工具。\n\
  \n4. **ParaTools ThreadSpotter**: 允许你发现 Solaris、Linux 和 Windows 上多线程和 OpenMPI 应用程序中的性能问题。它可以识别程序使用处理器缓存内存的区域，在某些情况下，它可以建议重构代码的方法以更有效地利用缓存内存。\n\
  \n5. **Helgrind and DRD**: Helgrind 和 DRD 都是开源 Valgrind 插桩框架的模块。它们可以用于检测基于 `pthreads`\
  \ 的应用程序中的同步错误，包括对 `pthreads` API 的误用、死锁和竞态条件。它们可以在 Linux 和 macOS 上使用。\n\n# 9: 并发\n\
  \n## 摘要\n直到 C++11，标准才定义了代码在多线程环境中应该如何行为。随着该修订版的引入，现在可以在 C++ 中编写健壮的多线程代码，而无需诉诸于 `pthreads`\
  \ 或 `Boost` 等第三方库。本章涵盖了 C++ 提供的一些核心多线程功能。它随后解释了一些相关的术语，例如并发与并行、竞态条件、线程安全和重入性。文中介绍了用于初始化和同步数据的各种技术，以确保你的代码可以被多个线程安全地使用。本章最后介绍了在编写多线程代码时需要考虑的最佳实践，并对线程安全接口设计模式进行了介绍。\n\
  \n### 关键词\n并发；数据竞态；多线程；并行性；竞态条件；重入性；共享数据；无状态；同步；线程安全\n\n并发是将问题分解为独立执行的元素，然后将这些元素组合在一起以解决更大的问题。。这与并行性的概念不同，并行性关注的是同时执行多个操作。区别在于，并发算法可能在单个处理器或\
  \ 100 个处理器上正确运行，而并行程序是关于利用多个核心来同时执行任务的不同元素。\n\n并发通常通过多线程实现，其中单个进程可以拥有多个执行线程。多线程编程引入的一些复杂性包括线程之间的通信需求（例如通过消息传递或共享内存）以及对共享资源的访问管理（例如全局数据）。如果处理不当，你的代码可能会出现崩溃、死锁或资源饥饿等严重故障。\n\
  \n在本章中，我将涵盖 C++ 提供的一些核心多线程功能。然后我将解释一些相关的术语，例如竞态条件、线程安全和重入性。我还将查看初始化和同步数据的方法，以确保你的代码可以被多个线程安全地使用。最后，我将引入一组编写并发代码的最佳实践，并讨论线程安全接口设计模式，将其作为编写线程安全的面向对象代码的方法。\n\
  \n由于这是一本侧重于软件接口设计的书籍，我将不会深入探讨如何在 C++ 中编写健壮多线程代码的所有方面。市上有许多其他关注该焦点的优秀书籍（例如，Williams,\
  \ 2012）。）。相反，我将观察采用多线程模型如何影响你的应用程序接口（API）设计决策。尽管如此，这个主题确实需要深入你的实现代码一个层次，因为许多最终决定\
  \ API 线程安全的决策是在那里做出的，例如 `mutex locking`。\n\n### 使用 C++ 多线程\nC++98 和 C++03 标准没有规定在存在多个线程时代码应该如何行为。结果是，基于这些早期标准的编译器无法编写可移植的多线程代码。编写\
  \ C++03 代码时可能面临的问题包括可能会重排语句的优化编译器，以及可能会重排共享内存写入的多个处理器缓存。因此，开发者不得不依赖外部库（如 `pthreads`\
  \ 或 `Boost`）来让多线程程序正确运行。\n\n幸运的是，C++11 标准引入了对多线程的直接支持，一个定义了编译器如何访问内存的内存模型。这引入了原子加载和存储操作以及指定不同线程之间的操作应如何同步的内存访问设置。C++20\
  \ 修订版对该内存模型增加了一些量改进，特别是针对 Power 和 ARM CPU 以及 NVIDIA GPU。\n\n在语言级别，C++11 标准还强制了关于\
  \ `static` 关键字行为的保证。这是 C++ 中实现共享数据的一种典型方式，但直到 C++11，标准才要求静态对象的初始化必须是线程安全的。现在标准规定，只有一个线程可以进入静态对象的初始化，且编译器不能在其初始化周围引入任何死锁。\n\
  \n此外，C++11 引入了线程的特定概念以及处理线程的各种新原语，如信号量、互斥锁和条件变量。规范的编写者甚至以异步任务的形式添加了更高层次的概念，抽象了许多管理线程的细节。\n\
  \n标准还引入了 C++ 标准库实现在线程安全方面的最低要求。例如，数据容器在没有同步的情况下，不能将静态对象用于内部目的。然而，通常情况下，如果你预计有任何线程写入标准库数据容器，你应该添加自己的同步机制来保持它们的线程安全。\n\
  \n\n\n\n\n由于 C++11（及后续修订）添加了大量的线程特性，有几种不同类别的解决方案在不同的抽象层级运行。对于大多数项目，你可能不需要担心所有不同的层级。此列表提供了这些抽象层级的概述，从最低层到最高层：\n\
  \n1. **内存模型（Memory model）：** 标准引入了 `std::atomic` 模板，可用于跨多个线程原子性地访问数据，并带有 `std::memory_order`\
  \ 枚举，该枚举指定了原子操作内存访问的顺序。它还强制了 `static` 关键字的线程安全性，并通过 `thread_local` 关键字引入了线程局部静态存储。\n\
  \n2. **线程模型（Threading model）：** 引入了 `std::thread` 类来表示单个执行线程，以及相关的同步原语来帮助你协调多个线程之间的工作，例如\
  \ `std::mutex`、`std::lock_guard`、`std::condition_variable` 和 `std::init_once`。\n\
  \n3. **任务执行（Task execution）：** `std::async` 函数模板可用于异步执行一个函数，而无需担心协调多个线程的细节。异步函数的结果返回在\
  \ `std::future` 中，它提供了等待直到该未来获得有效结果的能力。\n\n4. **标准库容器和算法（Standard Library containers\
  \ and algorithms）：** C++ 标准定义了标准库容器类的基本线程安全保证。从 C++17 开始，算法集包含了可以利用多个处理器的并行变体，诸如\
  \ `std::copy`、`std::reverse` 和 `std::transform` 等函数。\n\n## 术语\n\n在深入探讨之前，我将解释一些你在尝试构建可以利用并发和并行性的接口时可能会遇到的术语。在本章的剩余部分中，我们将看看多线程编程如何影响你的\
  \ API 设计，以及如何构建健壮的线程安全并发接口。\n\n### 数据竞态与竞争条件（Data races and race conditions）\n\n\
  数据竞态（Data race）是指一个线程访问内存位置，而另一个线程正在向同一地址写入数据，导致未定义或不可预测的行为。这发生在代码尝试在没有任何同步的情况下访问某些共享数据时。因此，修复此类故障的标准方法是在数据访问周围添加适当的同步，或者使用保证原子执行的操作，以便在任何时候只有一个线程可以访问共享数据。\n\
  \n相比之下，竞争条件（Race condition）是一种语义缺陷，发生在事件的时间性或顺序影响了代码段的正确性时。竞争条件的经典示例是银行账户转账操作，例如：\n\
  \n![image](img/u09-01-9780443222191.jpg)\n\n在这个示例中，两个线程可能通过初始余额检查，但然后两个线程都从账户中取钱，可能导致余额为负。这是一个典型的“检查后执行（check-then-act）”竞争条件示例。在这种情况下，修复方法是通过在函数内部的所有代码周围引入同步，使整个函数以原子的方式运行。\n\
  \n竞争条件和数据竞态是两种完全不同的并发错误类型，两者都不是对方的子集。数据竞态关注对同一内存地址的访问，而竞争条件关注代码块的正确性。许多竞争条件可能由数据竞态引起，但在没有数据竞态的代码中也可能存在竞争条件。\n\
  \n### 线程安全（Thread safety）\n\n线程安全的 API 指其函数可以被多个线程同时调用，而不会产生意外的行为或故障（即不表现出任何数据竞态或竞争条件）。这种描述的另一种方式是：API\
  \ 访问共享资源的方式确保了在被多个线程同时执行时的安全性和正确性。\n\n确保线程安全通常没有单一的解决方案，因为实现这一点取决于你代码的特定特性以及调用你代码的客户端的使用模式。特别是竞争条件，将取决于你代码的语义以及某些代码块是否需要以原子的方式执行。因此，有时认为你的代码提供了三个基本层级的保证会更好：\n\
  \n1. **非线程安全（Not Thread-Safe）：** 当被多个线程同时访问时，该 API 不提供任何特定的正确性保证。大多数使用 C++98/C++03\
  \ 编写的代码都应该被视为非线程安全的，除非它们专门使用了诸如 `pthreads` 或 `Boost threads` 等线程库。\n\n2. **部分线程安全（Partially\
  \ Thread-Safe）：** 在以特定方式使用时，该 API 提供某些线程安全保证。例如，大多数 C++ 标准库容器都保证同时读取同一个对象是安全的，同时写入不同的对象也是安全的。但不支持直接对同一个对象进行同时写入，这需要客户端实现自己的同步机制来处理这些情况。我们将在本章稍后的部分看到一个示例。\n\
  \n3. **线程安全（Thread-Safe）：** API 承诺在被多个线程同时访问时，不会出现数据竞态和竞争条件。这需要开发者共同努力，确保对共享资源的所有访问都是安全的，并且需要以原子方式执行的操作也得以实现。\n\
  \n即使你的 API 提供了完全的线程安全，接口的客户端仍可能以向其代码中引入竞争条件的方式使用它。例如，考虑以下从 vector 末尾弹出一个元素的简单代码片段：\n\
  \n![image](img/u09-02-9780443222191.jpg)\n\n如果 vector 为空，`std::vector` 的 `pop_back()`\
  \ 方法产生未定义的行为（使用 clang 14 编译器，它会导致崩溃）。然而，在之前的代码片段中，两个线程可能都通过条件检查，如果 vector 只有一个元素，这将导致未定义的行为。最终，这段代码片段的作者需要在此代码块周围执行他们自己的锁定以确保线程安全。这就是为什么标准库容器类不被要求实现对其底层数据的锁定：因为容器类的用户通常需要在他们自己的代码层级实现锁定。\n\
  \n在 API 层面解决此问题的一种可能是容器类提供一个 `pop_back_if_empty()` 函数，将引入锁定的需要完全隐藏在 API 实现内部，而不暴露给客户端。然而，这可能意味着增加许多此类复合操作，这将迅速污染\
  \ API 并违反我们在“质量”章节中引入的最小完备原则。\n\n### 可重入性（Reentrancy）\n\n如果一个 API 调用可以在之前的调用完成之前安全地再次调用，则被认为是可重入的：例如，如果一个函数在执行过程的任何一点被中断，并在较早调用完成之前安全地重新进入。\n\
  \n这听起来与线程安全的定义相似，但关键区别在于，可重入性是一个源于现代多任务操作系统引入之前的术语，因此它指的是在单线程环境中重新进入函数的能力：例如，如果触发了系统中断，并且中断处理程序在程序函数正在执行时调用了该函数。\n\
  \n\n\n\n\n可重入函数（reentrant function）通常也是线程安全的，但这并不总是能保证：可重入函数可能不是线程安全的，而线程安全的函数可能不是重入的。例如，使用互斥锁（mutex\
  \ locking）可以使函数在多个线程存在时是安全的，但如果该函数在释放其互斥锁之前，在同一个线程内再次被调用，它将因为等待互斥锁释放而导致死锁。\n\n编写可重入函数的一些最佳实践：\n\
  \n* 1. 函数应该只对调用者提供的数据进行操作。\n* 2. 除非能保证原子访问，否则不应持有静态或全局非常量数据。\n* 3. 它不应返回任何静态或全局非常量数据的内存地址。\n\
  * 4. 它不能调用其他非重入函数。\n* 5. 应该避免对任何共享资源锁定，除非你可以使用重入锁，例如递归互斥锁（recursive mutex lock）。\n\
  * 6. 应该避免自修改代码，除非可以在其线程特定的内存中完成操作。\n\n对于大多数现代项目而言，线程安全可能是更需要关注的问题。但如果你正在开发一个可能在中断或信号处理程序中使用的\
  \ API，那么你将需要考虑函数调用在同一个线程内是否是重入的。\n\n### 异步任务\n\nC++11 引入了一些原语来帮助开发者直接创建和管理线程，但它也引入了一些高级概念，通过\
  \ `std::async` 和 `std::future` 模板异步形式执行工作。\n\n`std::async` 函数模板用于异步运行任何 C++ 趣化（functor），而\
  \ `std::future` 用于在工作完成后访问函数的结果。这使得执行后台处理任务变得容易得多，无需担心管理线程和信号。例如，下面的代码段演示了如何使用 lambda\
  \ 函数通过 `std::async` 异步执行某些工作。主线程可以执行其他工作，然后调用 `future.get()` 来阻塞等待 `std::async`\
  \ 的结果：\n\n![image](img/u09-03-9780443222191.jpg)\n\n异步任务使得在 C++ 中编写多线程代码变得简单得多。然而，在对\
  \ API 设计的影响方面，这里可能没什么可说的。这是因为你可以配合 `std::async` 使用任何函数或对象方法（即，你不需要为类定义添加任何特殊内容即可使其能够被\
  \ `std::async` 调用）。这是 C++ 实现的一个优雅特性，特别是与 Swift 等其他语言相比，在 Swift 中，函数必须用 `async` 关键字装饰，且这些异步函数的调用者必须在调用处使用\
  \ `await` 关键字，这可能会在为 Swift API 添加异步支持时引发一系列变化。\n\n### 并行\n\n正如本章开头提到的，并发和并行是相关但不同的概念。为了这里的讨论，我将并行定义为将任务拆分为多个子任务，这些子任务可以在多个\
  \ CPU 上同时执行。例如，考虑一种算法，它对 vector 中的每个值运行一个函数，并返回另一个包含所有结果的 vector。\n\nC++17 标准为许多算法（如\
  \ `sort`、`find`、`reverse` 和 `count`）引入了并行支持。这些新版本接受执行策略：\n\n* `std::execution::seq`：按顺序运行算法。如果你没有指定策略，这是默认值。\n\
  * `std::execution::par`：实现可以选择并行运行。\n* `std::execution::par_unseq`：实现可以选择并行或向量化运行。\n\
  * `std::execution::unseq`：表示算法可以向量化。\n\n例如，我们可以配合 `std::execution::par` 策略使用 `std::transform`。在这个例子中，我们如下所示对每个元素使用\
  \ `std::transform`。在例例中，我们使用 lambda 函数将每个值翻倍：\n\n![image](img/u09-04-9780443222191.jpg)\n\
  \n### 访问共享数据：无状态 API\n\n线程错误通常在多个线程尝试同时操作共享资源时引起。因此，不维护或依赖任何状态的对象可以被多个线程安全地访问。函数内部的任何参数和局部变量都分配在栈上，每个线程都有自己的栈，因此这些在你的函数内部使用是安全的。\n\
  \n某些类别的问题更适合这种方法，例如数学计算或单位转换例程。例如：\n\n![image](img/u09-05-9780443222191.jpg)\n\n\
  在这种情况下，`Factorial()` 函数只使用值参数 `num` 和局部变量 `result`，因此可以认为是无状态的，并且可以从多个线程安全调用。该函数声明为\
  \ `static`，表示它不引用任何对象实例状态。我们没有传递任何指向共享状态的指针或引用。\n\n这样的无状态函数通常是无副作用且具有确定性的，这意味着对于同一组输入，它们每次被调用都会产生相同的结果，除非它们依赖于其他非确定性函数（例如随机数生成器）。这在本质上等于纯函数（pure\
  \ functions）的概念，我在之前“样式”章节的“函数式 API”部分描述过它。函数式编程风格通常很好地适应并发，而不需要额外的同步。\n\n有时可以将一个原本有状态的\
  \ API 重构为无状态 API。这可以通过将它可能产生的任何状态作为函数的结果返回来实现。例如，考虑这个持有一个数字 vector 的类，以及一个反转该 vector\
  \ 的例程：\n\n\n\n\n\n此对象在实例变量中维护数字序列的状态。如果没有适当的同步，在多个线程上同时对同一个对象调用 `Reverse()` 方法，可能会产生不可预测的结果。相反，我们可以开发该\
  \ API 的无状态版本：\n\n![image](img/u09-07-9780443222191.jpg)\n\n在这种情况下，数字序列被传入 API，并将修改后的序列作为函数结果返回。如果该函数的实现仅使用临时局部变量，那么从多个线程中调用它将是安全的。然而，如果调用者需要将此结果存储在共享数据结构中，那么我们只是简单地将正确同步代码的负担交给了调用者。\n\
  \n在 C++ 标准库中的一个例子是反转字符串。你可以使用 `std::reverse()` 函数来地地反转字符串（即更改字符串的状态）。或者，你可以使用 `std::string`\
  \ 构造函数返回一个新字符串，该字符串是输入字符串的反转结果，例如：\n\n![image](img/u09-08-9780443222191.jpg)\n\n\
  ### 初始化共享数据\n\n如果你在项目中无法避免共享数据，那么你必须确保对任何共享数据的访问都经过了适当的同步，以确保在多线程环境下是安全的。实现这一点的第一步是确保数据被安全地初始化。如果多个线程尝试同时初始化你的数据，可能会导致数据处于不一致的状态。\n\
  \n声明全局数据有多种方式，具有不同的作用域级别。这段代码提供了其中一些的示例：\n\n![image](img/u09-09-9780443222191.jpg)\n\
  \n通常应该避免在文件、全局、命名空间或类作用域（即 1, 2, 3 和 5）上定义数据，因为它们会引入若干几个问题。首先，它们在库首次加载到进程时就会初始化，并且会在每个链接的进程中占用内存，即使这些进程并没有使用该库。其次，如果你调用任何函数来初始化数据，你可能会遇到复杂的初始化依赖问题，在最坏的情况下会导致你的库在加载时崩溃。\n\
  \n静态变量在第一次遇到时被初始化，因此使用函数作用域的静态变量（即 4）要优越得多，因为它避免了库加载时间的依赖问题，并且仅在在该函数被执行时才会创建共享数据。这在“模式”章节中的“单例”节中会有更详细的描述。\n\
  \n正如我们在本章开头提到的，在 C++11 之前，根本无法使用 `static` 关键字实现数据线程安全的初始化。然而，自 C++11 以来，静态数据的初始化现在现在必须由编译器以线程安全的方式实现。因此，只有在你使用\
  \ C++11 或更高修订版本时，才应该在没有进一步同步的情况下使用静态数据。\n\n尽管如此，有时你可能需要执行几条指令来完全初始化你的共享数据，而单一的静态声明是不够的。在这种情况下，你可以依赖\
  \ C++11 的另一个新特性：`std::call_once`。即使从多个线程并发调用，它也会恰好执行一次代码。这里有一个示例：\n\n![image](img/u09-10-9780443222191.jpg)\n\
  \n由于我们谈论的是静态数据和线程，我们应该提到同样随 C++11 引入的 `thread_local` 关键字。这是一种定义静态变量的方法，每个线程拥有数据的独立拷贝。线程本地变量在线程创建时创建，在线程结束时销毁。这的一个典型例子是随机数生成器，每个线程都有自己的随机种子，如下例所示：\n\
  \n![image](img/u09-11-9780443222191.jpg)\n\n最后，确保共享数据以线程安全的方式初始化的另一种方法是在应用程序仍处于单线程时进行初始化。这是只有库的客户端才能完全决定的，因此这种方法意味着提供一个初始化函数，客户端必须在程序中的适当早阶段调用它。\n\
  \n### 同步数据访问\n\n现在我们已经涵盖了如何安全地初始化共享数据，我们可以讨论如何在不引起数据竞态的情况下安全修改这些数据。数据竞态是指两个或多个线程尝试访问同一个内存地址，且至少有一个线程正在写入该数据。\n\
  \n避免数据竞态的方法是在所有对数据的访问周围引入锁，例如使用互斥锁（也称为 `mutex`）。这确保了在任何时刻只有一个线程可以访问共享数据。你通常必须在访问共享数据之前获取互斥锁，并在之后释放它。如果你没有平衡你的锁定和解锁调用（可能是由于函数提前退出），那么其他任何获取锁的尝试都将失败，你的程序将发生死锁。\n\
  \n为了避免这种情况，最好应用 RAII 原则，并让锁在代码超出作用域时自动释放。这也被称为作用域锁惯用法（scoped locking idiom）（Schmidt,\
  \ 1999）。C++11 为此引入了新对象，例如 `std::lock_guard` 和 `std::unique_lock`。例如，当创建一个 `std::lock_guard`\
  \ 对象时，它会锁定互斥锁，当它超出作用域时，互斥锁会被释放。这里有一个示例：\n\n![image](img/u09-12-9780443222191.jpg)\n\
  \n我们不需要在构造函数中添加锁定代码。对象是由单个线程构造的，并且在它们初始化后才能被其他线程访问。因此，在这种情况下，放弃锁是安全的。当然，如果构造函数尝试访问任何共享或全局资源，则就需要锁定。\n\
  \n在这个示例中，我将互斥锁作为类数据成员添加，因此互斥锁将在对象创建时初始化，我们将为每个对象实例创建一个单独互斥锁。这通常比为所有实例使用单个互斥锁的替代方案更好，因为上一个示例中的表达方式允许不同的线程同时访问对象的不同实例。然而，如果你确实想所有实例使用单个互斥锁，可以将互斥锁声明为静态类数据成员。如果你想要保护的共享数据也是静态数据成员，那么你就会这样做。\n\
  \n## 并发 API 设计\n\n在 API 设计方面，请记住构建处理并发的 API 与构建单线程的 API 可能是不同的。尽管如此，我们已经涵盖的许多设计原则在两种情况下都对你有所帮助。例如，设计松耦合、最小化完整的接口，并在这些接口中隐藏实现细节且不重复概念，将对你设计支持并发的\
  \ API 时非常有帮助。而且，如果你选择采用函数式编程风格，那么你对纯函数的使用可能已经是线程安全的。\n\n### 并发最佳实践\n\nRobert Martin\
  \ 在他的书籍《洁洁代码》（Clean Code）中为编写良好的代码提供了一系列极好的建议（Martin, 2008）。此外，Bjarne Stroustrup\
  \ 和 Herb Sutter 在他们的 C++ Core Guidelines 网站上提供了几条关于并发的建议。我在这里总结了其中几条最佳实践，它们与 API\
  \ 设计有关：\n\n\n\n\n\n1. **限制对共享数据的访问**：正如我们已经过的，大多数多线程问题源于对共享资源的访问，例如共享可变数据。不共享可写数据的代码就不会产生数据竞态。因此，限制你的设计中共享数据量，并确保所有访问都通过你可以强制执行同步的\
  \ API，将有助于避免数据竞态。\n\n2. **返回数据的副本**：如果你的客户端可以在数据的副本上进行工作，那么这比尝试同步对单个共享实例的所有访问要简单得多。例如，如果客户端并不总是需要更改数据的能力，你可以提供一个返回数据只读副本的\
  \ API。或者，你可以提供一个 API 返回数据的副本供客户端进行工作，然后提供一个单一的同步 API 调用让它们返回修改后的版本。\n\n3. **独立线程**：你应该尝试将数据划分为独立的对象，这样线程代码就不需要共享其他线程的数据。通过允许线程尽可能保持独立，你可以最大限度地减少执行同步的需求并避免数据竞态。同样，你应该注意需要同步的\
  \ API 调用之间的依赖关系，因为这些依赖关系可能会引入细微的错误。\n\n4. **最小化同步区域**：当你对某些共享资源添加锁时，你是在确保任何时刻只有一个线程可以执行该代码的关键区域。如果你在这个关键区域内执行了大量工作，可能会严重影响系统的整体性能。因此，尽量将锁限制在仅需要同步的代码上，不要包含其他不相关的调用。\n\
  \n5. **从高层任务的角度思考**：线程是一个低级实现概念。但通常你的客户端关注的是实现更高层次的任务。因此，从任务而非线程的角度来考虑你的 API 设计，可以让客户端更容易理解你的设计。C++11\
  \ 引入了 `std::async` 概念来异步运行函数。在可行的情况下，考虑使用这种任务级特性为你的设计引入并发支持。\n\n6. **不要依赖 `volatile`\
  \ 关键字**：`volatile` 关键字用于告诉编译器变量可能会被某些外部事件更改。这可以避免编译器优化，例如将值缓存在寄存器中。这听起来似乎对多线程也有用，因为多个线程可能会尝试更改同一个变量，但重要的是要意识到\
  \ `volatile` 与并发无关（即它不执行任何同步，也不防止指令重排序）。添加此关键字不会修复你代码中的任何数据竞态。\n\n7. **测试并发代码**：在编写并发代码时，你不应该忽略看似一次性的失败，因为它们可能表明你存在底层的线程问题。确保通过在不同平台上运行代码、以不同的时间间隔和顺序多次运行代码，以及使用比处理器数量更多的线程运行代码，来充分测试并发代码。此外，利用可以帮助你发现代码中潜在线程错误的工具。你可以参考“性能（Performance）”章节中的“多线程分析”部分来回顾几个可以检查你多线程代码的工具。\n\
  \n### 线程安全接口模式 (Thread-Safe Interface pattern)\n\n如果你在 API 中有多个相互调用的函数，可能会存在自锁的风险（即当一个函数锁住资源，然后调用另一个也尝试锁定相同资源的函数时）。解决此问题的方法是一种递归递归互斥，但这会引入额外的锁定开销。更好的解决方案是使用线程安全接口设计模式。该模式的基本原理如下（Schmidt,\
  \ 1999）：\n\n* 1. 只有公共方法应该获取和释放锁。这些函数随后可以调用私有或保护的实现方法来执行实际工作。\n* 2. 私有和保护方法仅在被公共方法调用时才执行工作。这些函数永远不调用公共方法，因为那可能会引入自锁。\n\
  \n这在代码中得到了演示：\n\n![image](img/u09-13-9780443222191.jpg)\n\n继承的使用也可能引入围绕锁定的微妙并发错误。例如，你可能有一个通过锁定来同步访问共享访问的\
  \ API，但客户端可以重写虚函数并提供一个不执行任何锁定的新实现。线程安全接口模式在这里也能提供帮助。你只需要确保任何虚函数都定义为保护或私有（即客户端可以为虚函数提供备选实现，但该功能只能通过调用执行所有必要锁定的公共函数来访问）。例如：\n\
  \n![image](img/u09-14-9780443222191.jpg)\n\n在这个示例中，你可以看到客户端创建了一个新的 `MyDerivedObject`\
  \ 类，它重写了保护虚函数 `DoFoo()`。客户端不需要担心在此重写中锁定任何共享资源，因为调用 `DoFoo()` 的唯一正确方法是调用公共函数 `Foo()`，该函数在转发到\
  \ `DoFoo()` 实现之前执行了所有必要的锁定。\n\n# 10: 版本控制 (Versioning)\n\n## 摘要\n\n本章涉及变更管理和控制这一重要主题。首先讨论了版本号的相关性，并引入了一个示例版本应用程序编程接口（API），让客户端查询\
  \ API 的当前版本和功能集。描述了典型 API 的生命周期，包括预发布、发布、维护、完成和弃用。随后定义了向后兼容和向前兼容的各种术语，包括功能兼容、源兼容和二进制兼容。然后展示如何在保持向后兼容的同时对\
  \ API 进行更改，包括添加、更改、弃用和移除功能的 API 更改。最后，涵盖了 API 评审这一重要主题，作为一种变更控制机制。\n\n### 关键词\n\n\
  应用程序二进制接口 (ABI); 向后兼容 (Backward compatibility); 二进制兼容 (Binary compatibility); 分支\
  \ (Branching); 生命周期 (Life cycle); 评审流程 (Review process); 源兼容 (Source compatibility);\
  \ 版本号 (Version number)\n\n到目前为止，我主要将应用程序编程接口（API）的设计视为一个离散的任务，一旦 API 完全规范并发布给用户，任务就结束了。当然，这只是一个持续复杂过程的开始。在\
  \ API 发布之后，真正的工作才开始，你的 API 开发也将面临考验。\n\n很少有 API 在 1.0 产品发布后停止开发。总会有 Bug 需要修复、新功能需要集成、工作流需要改进、其他平台需要支持等等。\n\
  \n\n\n\n\n在 API 首次发布后，所有发布的首要目标必须是对比现有客户端产生零影响，或者在实践中尽可能接近零影响。在不同版本之间破坏接口或接口的行为，将迫使你的客户端更新代码以利用你的新\
  \ API。你越能尽量减少他们他们对这种人工干预的需求，你的用户就越可能升级到你的新 API，甚至可能继续使用你的 API。如果你的 API 具有每每次发布新版本都会引入重大不兼容变更的声声，那么你就是在给你的客户提供寻找替代方案的动力。另一方面，一个以稳定性和健壮著称的\
  \ API 可以成为你产品成功的最大因素。\n\n为此，本章将涵盖 API 版本控制的细节，解释不同类型的向后兼容性，并描述你如何为你的 API 实现向后兼容。\n\
  \n## 版本号\n\n你的 API 的每次发布都应该伴随一个唯一的标识符，以便将 API 的最新版本与之前的版本区分来。实现此目的的标准方法是使用版本号。\n\
  \n### 版本号的意义\n\n目前有许多不同的方案用于为软件产品提供版本信息。这些方案中的大多数尝试通过一系列数字（通常用点 `.` 分隔）来传达一次发布中变化的规模程度。最常见的是使用两个或三个独立的整数，例如\
  \ `1.2` 或 `1.2.3`。随后的列表以及图 10.1 解释了这些整数中每个数字的意义：\n\n![image](img/f10-01-9780443222191.jpg)\n\
  \n图 10.1 展示了使用标准 MAJOR.MINOR.PATCH 命名方案的版本号演进过程。\n\n1. **主版本（Major version）。** 这是版本号中的第一个整数，例如\
  \ `1.`0.0\\.。它通常在初始发布时设为 1，每当发生重大变更时增加。在 API 变更方面，主版本变更可以信号以向后兼容的方式添加了大量新功能，也可能意味着向后兼容性已被破坏。通常情况下，API\
  \ 主版本的增加应该信号你的用户预期会有重大的 API 变更。\n\n2. **次要版本（Minor version）。** 这是复合版本号中的第二个整数（例如\
  \ 1.`0.`0）。它通常在每次主版本发布后设置为 0，并在添加了较小功能或重大 Bug 修复时增加。次要版本号的变更通常不应涉及不兼容的 API 变更。用户应该预期可以在不对自己的软件进行任何更改的情况下升级到新的次要版本。然而，API\
  \ 可能会添加一些新功能，如果使用了这些功能，意味着用户无法在不更改代码的情况下回到更早的次要版本。\n\n3. **补丁版本（Patch version）。**\
  \ （可选的）第三个整数是补丁号，有时也称为修订号（例如 1.0.`0**`）。它通常在每次次要发布后被设置为 0，并在发布重要的 Bug 或安全修复时增加。补丁号的变更应该意味着对实际\
  \ API 接口没有更改（即只对 API 的行为进行了更改）。换句话说，补丁版本的变更应该是向后和向前兼容的。也就是说，用户应该能够在不更改代码的情况下回到较早的补丁版本，然后切换回较新的补丁版本\
  \ (Rooney, 2005)。\n\n某些软件产品使用额外的数字或符号来进一步描述发布。例如，可能会使用自动化构建号，以便软件的每一次单一构建都能与之前的构建区分开来。这个构建号可以源自提交到版本控制系统的最后一次更改的修订号，可能源自当前日期，或者仅仅是一个单调递增的数字。\n\
  \n软件通常在最终发布之前提供给用户，以获取反馈和宝贵的现场测试。在这些情况下，在版本字符串中添加一个符号是常见的，以指示软件所处的开发阶段。例如，`1.0.0a`\
  \ 可能指 alpha 版本，`1.0.0b` 可能指 beta 版本，而 `1.0.0rc` 可能指发布候选版本（release candidate）。然而，一旦你开始偏离纯数字识别系统，版本号的比较就会变得更加复杂（参见\
  \ Python PEP 0386at [`www.python.org/dev/peps/pep-0386/`](http://www.python.org/dev/peps/pep-0386/)\
  \ 以作为这种复杂性的示例）。\n\n### 奇特的命名方案\n\n我还决定列出一些过去软件项目使用的非标准或富有想象力的版本方案。这一部分更多是为了趣味而不是实际的实用建议，尽管每种方案在某些情况下都有优势。然而，对于\
  \ API 开发，我建议坚持使用广泛理解的主、次要、补丁方案。\n\n由 Donald Knuth 最初设计的 TeX 文档处理系统通过增加接近 `π` 值的精度位数来产生新的版本号。第一个\
  \ TeX 版本号是 `3`，然后是 `3.1`，接着是 `3.14`，以此类推。截至 2021 年，版本为 `3.141592653`。同样，Knuth 相关的\
  \ METAFONT 程序的版本号渐近于 `e`，`2.71828182`。\n\n尽管这初看起来似乎只是数学家的幽默感，但这种命名方案确实传达了软件的一个重要品质。尽管\
  \ Knuth 本人承认 TeX 的某些领域可以改进，但他声称新版本应只包含 Bug 修复。因此，使用一种引入不断减小的浮点数位数的版本控制方案是具有洞察力的。事实上，Knuth\
  \ 对功能稳定性和向后兼容性的认识，以至于将这种重要性编码到他软件的版本方案中，对于任何 API 设计师来说都有思考的空间。\n\n另一种有趣的版本方案是使用日期作为版本号。这通常用于大型最终用户版本，例如微软的\
  \ Visual Studio 2022 和 EA 的 FIFA 23 游戏。然而，Linux 发行版 Ubuntu 使用了另一种更微妙的系统。它使用发布的年份和月份分别作为主、次要版本号。第一个\
  \ Ubuntu 版本 `4.10` 出于 2004 年 10 月，而 `9.04` 则于 2009 年 4 月发布。Ubuntu 版本还被分配了一个代号，由一个形容词和一个动物名称组成，首字母相同，例如\
  \ Breezy Badger 和 Lucid Lynx。除了前两个版本外，这些代号的首字母每次发布都会按字母顺序增加。这些方案的优点是能够传达 Ubuntu\
  \ 版本有多新，但它们没有传达关于发布中变更程度的任何概念。这对于不断演变的操作系统来说可能是可以的，但对于你的 API，你应该更倾向于使用传统的数字方案，给你的用户一个发布中\
  \ API 变更程度的指示。\n\nLinux 内核目前使用奇偶命名方案来区分稳定版本（偶数）和开发版本（奇数）。例如，Linux `2.4` 和 `2.6`\
  \ 是稳定版本，而 `2.3` 和 `2.5` 是开发版本。这种命名方案也被用于 Second Life 服务器版本。\n\n### 创建版本 API\n\n\n\
  \n\n\n您的 API 版本信息应该能够通过代码访问，以便客户端能够根据您的 API 版本号编写条件判断程序：例如，调用仅存在于 API 的最新版本中的新方法，或者规避您的\
  \ API 已发布版本实现中的某一个 bug。\n\n为了提供最大的灵活性，用户应该能够在编译时和运行时查询您的 API 版本。编译时的要求是必要的，因为用户可以使用\
  \ `#if` 预处理器指令来条件地编译针对较新的类和方法，而这些类和方法在链接到您的 API 的旧版本时会导致未定义引用的错误。运行时的要求则允许客户端动态地在不同的\
  \ API 调用之间进行选择，或者提供包含您的 API 版本号的日志输出。这些需求建议创建一个一个版本 API（version API）。我为此目的提供了一个简单的通用\
  \ API：\n\n![image](img/u10-01-9780443222191.jpg)\n\n这个 `Version` 类中有几个值得注意的特性。首先，我提供了访问器，用于返回组成当前版本的各个主版本（major）、次版本（minor）和补丁版本（patch）数字。这些直接返回相应的\
  \ `#define` 语句的值：`API_MAJOR`、`API_MINOR` 和 `API_PATCH`。尽管我在 C++ 使用章节中提到过应该避免使用 `#define`\
  \ 定义常量，但这是该规则的例外，因为你需要用户能够从预处理器中访问这些信息。\n\n`GetVersion()` 方法以用户友好的字符串形式返回版本信息，例如\
  \ `1.2.0`。这对于客户端在“关于”对话框中显示，或写入应用程序的调试日志中很有用。\n\n接下来，我提供了一个方法让用户执行版本比较。这允许他们在代码中进行检查，例如检查他们编译的\
  \ API 是否大于或等于指定的 `(major, minor, patch)` 三组。显然，你可以在这里添加其他版本计算例程，但 `IsAtLeast()`\
  \ 提供了最常见的用例。\n\n最后，我提供了一个 `HasFeature()` 方法。通常当用户想要比较版本号时，他们并不真正关心版本号本身，而是将此标识符作为判断他们想要使用的功能是否存在于\
  \ API 中的方法。与其让用户感知哪些功能是在 API 的哪些版本中引入的，不如让 `HasFeature()` 方法让他们直接测试功能的可用性。例如，在您的\
  \ API 的 `2.0.0` 版本中，您可能使 API 线程安全。因此您可以添加一个名为 `THREADSAFE` 的功能标签，以便用户可以进行如下检查：\n\
  \n![image](img/u10-02-9780443222191.jpg)\n\n虽然你可能不需要为 `1.0` 版本定义任何功能标签，但你应该将此方法包含在版本\
  \ API 中，以便客户端可以在您的 API 的任何发布中调用它。该方法对于 `1.0`可以简单返回 `false`，但对于未来的发布，你可以为新功能或重大 bug\
  \ 修复添加标签。这些字符串可以存储在 `std::set` 中并按需延迟初始化。\n\n## 软件分支策略\n\n在我深入讨论版本控制之前，让我们先涵盖一些关于分支策略的基础知识。虽然只有一两个工程师的小型项目可以通过单行代码运行，但较大的项目会涉及某种形式的分支。\n\
  \n每个软件项目都需要一条主干（trunk）或主代码线，即仓库。分支从主干创建，用于单独的发布。这种模型支持并行开发，可以在其中添加新功能。\n\n### 分支策略\n\
  \n这种基本结构被许多项目用于支持并行开发和发布管理。然而，有许多策略决策可以用于自定义实际工作流，例如：开发者在哪些分支上工作、同时有多少个开发分支、在流程的哪个点创建发布分支、分支之间合并更改的频率，以及是否尝试进行分支间的自动合并。\n\
  \n\n\n你选择的修订控制系统会对你的分支策略产生影响，因为不同的源码控制管理（SCM）产品使得某些分支策略比其他策略更易实现。例如，在 `Subversion`\
  \ 中支持和进行分支合并可能是一项艰巨的任务，而在 `Git` 或 `Mercurial` 等分布式 SCM 系统中，分支被设计在系统的核心中。例如，使用像 `Git`\
  \ 这样的 SCM 可以每天都考虑分支间的合并，因为这是一项简单且低影响的操作。分支间合并的频率越高，代码的分歧程度就越少，最终将分支合并到 `trunk`（如果这是最终目标的话）也就越容易。发布分支通常在发布完成后即结束生命，正如图\
  \ 10.2 中`1.1` 版本之后用 `X` 符号表示的那样。另一个与你的 SCM 系统相关的决策因素是你的所有的工程师是否都在现场；如果是的话，那么可以使用像\
  \ `Perforce` 这样基于服务器的解决方案；或者你是否有居家办公的开源工程师，如果是，那么像 `Git` 这样的分布式解决方案会更合适。\n\n###\
  \ APIs 与并行分支\n\n一旦 API 发布后，对该 API 的更改（至少从外部来看）应该遵循一个序列化过程。也就是说，你不会发布与旧版本不兼容的非线性版本：版本\
  \ `N` 中的功能应该是版本 `N-1` 功能的严格超集。尽管这看起来是显而易见的，但大型软件项目往往涉及多个开发者在代码的几个并行分支上工作，并且可能存在多个同时支持的\
  \ API 版本。因此，让在不同并行分支上工作的团队不引入不兼容的功能是非常重要的。有几种处理这种潜在问题的策略方法，例如：\n\n1. **设定目标开发分支。**\
  \ 你的项目通常会有开发分支和发布分支。通过强制规定不在发布分支中直接发生任何 API 更改，你可以最大限度地减少 API 更改在某次发布中产生，但因为从未合并到\
  \ `trunk` 而在下一次发布中丢失的概率。如果发布分支中需要 API 更改，则应将其提交到 `trunk` 然后进行合并。\n2. **频繁合并到 trunk。**\n\
  3. **评审流程。**\n\n### API 的生命周期\n\n在本节中，我将探讨 API 的生命周期以及它从构思到结束所经历的各个阶段。\n\n\n\n维护一个\
  \ API 并不等同于维护普通的软件产品。这是因为对 API 开发施加了额外的约束，以防止破坏现有的客户端。在普通的终端用户软件产品中，如果你更改了代码中某个方法或类的名称，这不会影响应用程序对用户可见的功能。然而，如果你更改了\
  \ API 中某个类或方法的名称，你可能会破坏所有现有客户端的代码。API 是一份合同，你必须确保履行你在合同中规定的义务。\n\n图 10.3 概述了一个典型\
  \ API 生命周期的概述。这一生命周期中最重要的事件是初始发布，由图中粗的垂直线标记。在这一关键点之前，对设计和接口进行重大更改是可以接受的。然而，在初始发布之后，一旦你的用户开始使用你的\
  \ API 编写代码，你就承诺了提供向后兼容性，你所能做的更改范围将受到极大限制。从整个生命周期来看，API 开发有四个通用阶段（Tulach, 2008）：\n\
  \n![image](img/f10-03-9780443222191.jpg)\n\n图 10.3 应用程序编程接口（API）的生命周期。在初始发布之前，可以对\
  \ API 进行广泛的重新设计。初始发布之后，只能容忍增量更改。\n\n1. **发布前（Prerelease）**：在初始发布之前，API 可以遵循标准的软件周期，包括需求收集、规划、设计、实现和测试。最注意的是，正如我所说的，在此期间接口可以经历重大更改和重新设计。你可以向用户发布这些\
  \ API 的早期版本，以获取他们的反馈和建议。你应该为这些发布前版本使用 `0.x` 版本号，以向用户明确该 API 仍在活跃开发中，在交付 `1.0` 之前可能会发生剧烈变化。\n\
  \n2. **维护（Maintenance）**：API 在发布后仍然可以修改，但为了保持向后兼容性，任何更改必须限制在添加新方法和类，以及修复现有方法实现中的\
  \ bug。换句话说，在维护阶段，你应该寻求 API 的演进，而不是以不兼容的方式更改它。为了确保更改不会破坏向后兼容性，在新版本发布之前进行 API 审查是一项良好的做法。\n\
  \n3. **完成（Completion）**：在某个时刻，项目负责人将决定 API 已经成熟，不再应对接口进行任何进一步更改。这可能是因为 API 解决了它设计要解决的问题，也可能是因为团队成员已经转向其他项目，无法再支持该\
  \ API。在生命周期的这一阶段，稳定性是最属性。因此，通常只考虑修复 bug。此阶段仍然可以运行 API 审查，但如果更改确实仅限于实现代码而非公共头文件，那么可能就没有必要了。最终，API\
  \ 将被认为已完成，不再进行任何进一步更改。\n\n4. **弃用（Deprecation）**：某些 API 最终会进入终结状态，被弃用并从流通移除。弃用意味着\
  \ API 不应被用于任何新开发，现有客户端应该从该 API 迁移。如果 API 不再具有实用价值，或者开发了更新的、不兼容的 API 取而代之，就会发生这种情况。\n\
  \n## 兼容性级别\n\n到目前为止我只是模糊地谈论了向后兼容性的含义。现在是时候具体化并更精确地定义我们的术语了。因此，接下来的章节将详细说明向后兼容性（backward\
  \ compatibility）、向前兼容性（forward compatibility）、功能兼容性（functional compatibility）、源码（或\
  \ API）兼容性以及应用二进制接口（ABI）兼容性这些特定术语的含义。\n\n通常会对 API 的主版本、小版本和补丁版本提供不同的兼容性承诺。例如，你可能承诺补丁版本将同时具有向后兼容向前（Subversion\
  \ 承诺如此），或者你可能只承诺在主版本中破坏二进制兼容性（KDE 对核心库承诺如此）。\n\n### 向后兼容性（Backward compatibility）\n\
  \n向后兼容性可以简单地定义为：API 提供与之前版本的 API 相同的功能。换句话说，如果一个 API 能够完全替代之前的版本 API 而不需要用户做出任何更改，那么它就是向后兼容的。\n\
  \n这意味着较新的 API 是旧 API 的超集。它可以添加新功能，但不能以不兼容的方式更改旧 API 已经定义的功能。API 维护的黄金法是永远不要从你的接口中删除任何内容。\n\
  \nAPI 向后兼容有不同类型，包括：\n\n- 1. 功能兼容性\n- 2. 源码兼容性\n- 3. 二进制兼容性。\n\n我将在后面的章节中详细定义这些每一个项。此外，还存在面向数据的向后兼容性问题，例如：\n\
  \n- 1. 客户端/服务器兼容性\n- 2. 文件格式兼容性。\n\n例如，如果你的 API 涉及网络通信，那么你还需要考虑你使用的客户端/服务器协议的兼容性。这意味着使用旧版本\
  \ API 的客户端仍然与新版本的服务器通信。而使用新版本 API 的客户端仍然与旧版本的服务器通信（Rooney, 2005）。\n\n此外，如果你的 API\
  \ 将数据存储在文件或数据库中，那么你需要考虑该文件格式或数据库模式的兼容性。例如，新版本的 API 需要能够读取旧版本 API 生成的文件。\n\n这些数据的特性也应该有版本号，这些版本号不必与你的\
  \ API 版本号相同（例如，你可能更改了 API 但没有更改底层文件格式，因此 API 版本号变了而文件格式版本号不变）。\n\n### 功能兼容性（Functional\
  \ compatibility）\n\n功能兼容性关注实现的运行时行为。如果一个 API 的行为与之前版本的 API 完全相同，则它就是功能兼容的。然而，正如\
  \ Jaroslav Tulach 所指出的，API 在这方面几乎永远无法 100% 向后兼容。即使是只修复实现代码中的 bug，也会更改 API 的行为，而某些客户端可能依赖于这种行为。\n\
  \n例如，如果你的 API 提供了函数：\n\n![image](img/u10-03-9780443222191.jpg)\n\n该函数在你 API 的 `1.0`\
  \ 版本中可能有一个 bug，如果你传递一个 `nullptr`，它会崩溃。在 `1.1` 版本中，你修复了这个 bug，使得你的代码在这种情况下不再崩溃。这更改了\
  \ API 的行为，因此它在严格意义上不是功能兼容的。然而，它以一种好的方式更改了行为：修复了一个崩溃 bug。因此，尽管这个指标作为 API 运行时行为变化的基本衡量很有用，但这种功能变化并不一定是坏事。大多数\
  \ API 更新都会刻意破坏功能兼容性。\n\n\n\n\n作为一个功能兼容性很有用的一个示例，考虑一个仅关注性能的新版本 API。在这种情况下，API 的行为完全没有改变。然而，接口背后的算法得到了改进，以便在更短的时间交付相同的结果。在这方面，新\
  \ API 可以被认为是 100% 甚至兼容的。\n\n### 源码兼容性 (Source compatibility)\n\n源码兼容性是对后兼容性的一种较宽的定义。它基本上表示用户可以使用新版本的\
  \ API 重新编译程序，而无需对代码进行任何更改。这对于生成程序的行为没有做任何说明，只说明它可以被成功地编译和链接。源码兼容性有时也被 API 兼容性。\n\
  \n例如，这两个函数是源码兼容的，尽管它们的函数签名不同：\n\n![image](img/u10-04-9780443222191.jpg)\n\n这是因为任何编写用于调用\
  \ 1.0 版本函数的用户代码也可以针对 1.1 版本进行编译（新参数是可选的）。相比之下，接下来的两个函数不是源码兼容的，因为用户将被迫遍历代码以找到 `SetImage()`\
  \ 方法的所有实例并添加所需的第二个参数：\n\n![image](img/u10-05-9780443222191.jpg)\n\n任何完全限制在实现代码中的、因此不涉及公共头文件更改的更改显然都是\
  \ 100% 源码兼容的，因为两种情况下的接口都是相同的。\n\n### 二进制/应用程序二进制接口兼容性 (Binary/application binary\
  \ interface compatibility)\n\n二进制兼容性意味着客户端只需使用新版本的静态库重新链接程序，或者简单地将新的共享库放入到终端用户应用程序的安装目录中。这与源码兼容性形成对比，在源码兼容性中，每当发布\
  \ API 的新版本时，用户必须重新编译程序。\n\n这意味着对 API 的任何更改都不能影响库文件中任何类、方法或函数的表示。所有 API 元素的二进制表示必须保持不变，包括结构的类型、大小和对齐，以及所有函数的签名。这通常也被\
  \ ABI 兼容性。\n\n使用 C++ 很难实现二进制兼容性。你对 C++ 接口进行的任何更改都会导致其二进制表示发生更改。例如，这里是两个不同修饰名（mangled\
  \ names，即用于在对象文件或库文件中标识函数的符号名）：\n\n![image](img/u10-06-9780443222191.jpg)\n\n这两个方法是源码兼容的，但它们不是二进制兼容的，它们各自产生的不同修饰名证明了这一点。这意味着针对版本\
  \ 1.0 编译的代码不能直接使用版本 1.1 的库，因为 `_Z8SetImageP5Image` 符号不再定义。\n\n如果你使用不同的编译标志，API 的二进制表示也可能发生变化。它也倾向于特定的编译器。其原因之一是\
  \ C++ 标准委员会决定不规定命名修饰的细节。结果是一个编译器使用的修饰方案可能与另一个编译器的方案不同，即使在相同的平台上也是如此。（之前展示的修饰名是由\
  \ GNU C++ 4.3 生成的。）\n\n接下来我提供了两份特定的 API 更改列表，详细列出了那些需要用户重新编译代码的更改，以及那些可以在不破坏二进制兼容性的情况下安全执行的更改。\n\
  \n#### 二进制不兼容的 API 更改\n\n1. 删除类、方法或函数。\n2. 为类添加、删除或重新排列成员变量。\n3. 从类中添加或删除基类。\n4.\
  \ 更改任何成员变量的类型。\n5. 以任何方式更改现有方法的签名。\n6. 添加、删除或重新排列模板参数。\n7. 将非内联（non-inlined）方法改为内联。\n\
  9. 将非虚方法改为虚方法，反之亦然。\n10. 更改虚方法的顺序。\n11. 为没有现有虚方法的类添加虚方法。\n12. 添加新的虚方法（如果仅在现有虚方法之后添加新的虚方法，某些编译器可能会保持二进制兼容性*）。\n\
  13. 重写现有的虚方法（这在某些情况下可能是可能的，但最好避免）。\n\n#### 二进制兼容的 API 更改\n\n1. 添加新类、非虚方法或自由函数。\n\
  2. 为类添加新的静态变量。\n3. 删除私有静态变量（如果它们从未从内联方法中引用）。\n4. 删除非虚私有方法（如果它们从未从内联方法中被调用）。\n5.\
  \ 更改内联方法的实现。\n6. 将内联方法改为非内联。\n7. 更改方法的默认参数（但这需要重新编译以使用新的默认参数）。\n8. 从类中添加或删除友声明。\n\
  9. 为类添加新的枚举（enum）。\n10. 在现有枚举后追加新的枚举项。\n11. 使用位域（bit field）中未声明剩余位。\n\n将任何 API 更改限制在第二个列表中列出的项目中应该允许你维护二进制兼容性。帮助你实现兼容性的额外提示包括：\n\
  \n1. 与其给现有方法添加参数，不如定义该方法的新重载版本。这确保了原始符号继续存在，但也提供了更新的调用约定。在你的 `.cpp` 文件中，旧方法可以简单地通过调用新的重载方法来实现：\n\
  \n![image](img/u10-07-9780443222191.jpg)\n\n（如果该方法尚未重载，这种技术可能会影响源码兼容性，因为客户端代码无法在没有显式转换的情况下引用函数指针\
  \ `&SetImage`）。\n\n2. `pimpl` 模式可以帮助保持接口的二进制兼容性，因为它将所有实现细节——那些未来最可能更改的元素——移动到 `.cpp`\
  \ 文件，那里不会影响公共 `.h` 文件。\n\n3. 采用扁平的 C 风格 API 可以使其更容易获得二进制兼容性（以及跨编译器兼容性），仅仅因为 C 没有为你提供继承、可选参数、重载、异常和模板等功能。为了兼顾两者，你可能决定使用面向对象的\
  \ C++ 风格开发你的 API，然后提供 C++ API 的扁平 C 风格封装。\n\n4. 如果你确实需要进行二进制不兼容的更改，你可以考虑为新库命名不同的名称，以免破坏现有应用程序。libz\
  \ 库就采用了这种方法。版本 1.1.4 之前的构建在 Windows 上被称为 `ZLIB.DLL`。然而，使用了二进制不兼容的编译器设置来构建库的后续版本，因此库被重命名为\
  \ `ZLIB1.DLL`，其中 `1` 表示 API 的主版本号。\n\n\n\n\n\n二进制兼容性具有传递性，因此你的库依赖项的 `ABI` 兼容性会影响你库的兼容性。例如，`clang`\
  \ 编译器允许你从不同的 C++ 运行时之间进行选择：`libc++`（LLVM 运行时）或 `libstdc++`（GNU 运行时）。然而，这些运行时并不是二进制兼容的：针对其中一个编译的库将无法与另一个进行链接。特别是，`libc++`\
  \ 对其所有符号使用了 `std::__1` 的内联命名空间（inline namespace），而 `libstdc++` 则没有。因此，即使你的库使用了纯\
  \ C API，但只要你有一个链接到 `libc++` 的 C++ 库依赖项，你的客户端将无法链接到 `libstdc++`，因为该依赖项与你的依赖项不具有二进制兼容性。\n\
  \n### 前向兼容性 (Forward compatibility)\n\n如果使用未来版本 API 编写的客户端代码可以在不修改的情况下使用旧版本的 API\
  \ 进行编译，则该 API 具有向前兼容性。因此，向前兼容意味着用户可以降级到之前的版本，并且其代码在无需修改的情况下仍然运行。\n\n向 API 中添加新功能会破坏向前兼容性，因为为了利用这些新功能而编写的客户端代码将无法在不存在这些更改的旧版本上编译。\n\
  \n例如，这两个版本的函数是向前兼容的：\n\n![image](img/u10-08-9780443222191.jpg)\n\n这是因为使用 1.1 版本函数编写的代码（其中第二个参数是强制要求的）可以在\
  \ 1.0 版本中成功编译。然而，这两个版本并不是向前兼容的：\n\n![image](img/u10-09-9780443222191.jpg)\n\n这是因为使用\
  \ 1.1 版本编写的代码可以提供一个可选的第二个参数，而如果指定了该参数，它将无法在 1.0 版本的函数上编译。\n\n向前兼容性显然是一种很难提供保证的特性，因为你无法预测未来\
  \ API 会发生什么变化。不过，在你 API 的 1.0 版本发布之前，你可以尽力而。事实上，这是在首次公开发之前进行的一项极好的活动，尝试让你的 API 尽可能具有面向未来的能力。\n\
  \n这意味着你必须思考 API 未来可能如何演进的问题。你的用户可能会请求哪些新功能？性能优化将如何影响 API？API 可能会被误用吗？是否存在你可能在未来暴露的更通用的概念？你是否意识到你计划在未来实现的将影响\
  \ API 的功能？\n\n以下是你可以让 API 具有向前兼容性的某些方法：\n\n1. 如果你知道未来需要为某个方法添加参数，那么你可以使用前面提到的第一个示例所示的技术：即，你可以在功能实现之前就添加该参数，并简单地记录（并命名）该参数为未未使用。\n\
  2. 如果你预见到未来将切换到不同的内置类型，可以使用不透明指针（opaque pointer）或 `typedef` 代替直接使用内置类型。例如，为 `float`\
  \ 类型创建一个名为 `Real` 的 `typedef`，这样你可以在 API 的未来版本中将 `typedef` 更改为 `double`，而不会导致 API\
  \ 发生。\n3. “样式”章节中描述的数据驱动型 API 设计天生是向前兼容的。一个仅接受 `ArgList` 变体容器的方法本质上允许在运行时将任何参数集合传递给它。因此，实现部分可以添加对新命名参数的支持，而无需更改函数签名。\n\
  \n### 如何维护向后兼容性 (Backward compatibility)\n\n现在我已经定义了各种兼容性类型，我将描述在发布 API 的新版本时维护向后兼容性的某些策略。\n\
  \n### 添加功能\n\n从源码兼容性的角度来看，向 API 添加新功能通常是安全的。添加新类、新方法或新的全局函数不会更改预存 API 元素的接口，因此它们不会破坏现有代码。\n\
  \n作为该规则的例外，向抽象基类中添加新的纯虚拟成员函数是不向后兼容的：也就是说，\n\n![image](img/u10-10-9780443222191.jpg)\n\
  \n这是因为所有现有的客户端现在必须为这个新方法定义实现；否则它们的派生类将不是具体的，其代码将无法编译。解决此问题的变方法只需为你添加到抽象基类中的任何新方法提供默认实现（即使它们成为虚函数而非纯虚函数）。例如：\n\
  \n![image](img/u10-11-9780443222191.jpg)\n\n在二进制兼容方面，可以在不破坏兼容的情况下向 API 添加的元素更为有限。例如，向类添加第一个虚方法会导致类的大小增加（通常增加一个指向\
  \ `vtable` 的指针）。同样，添加新的基类、添加模板参数或添加新的成员变量将破坏兼容性。某些编译器允许向已有虚方法的类添加虚方法而不破坏兼容性，只要你将新虚方法放在所有虚方法之后。\n\
  \n关于破坏二进制兼容性的 API 更改，请参考二进制章节。###更改功能\n\n在不破坏客户端的情况下更改功能是一个棘手的问题。如果你只关心源码兼容性，那么可以在方法中添加新参数，只要将它们放在所有现有参数之后并声明为可选。这意味着用户不需要强制更新所有现有调用以添加额外参数。我之前给过这个示例，现在为了方便在这里重复一遍：\n\
  \n![image](img/u10-12-9780443222191.jpg)\n\n此外，更改现有方法的返回类型（假设该方法之前返回 `void` 类型）是源码兼容的更改，因为现有代码不应该检查该返回值：\n\
  \n![image](img/u10-13-9780443222191.jpg)\n\n如果你想添加一个不在现有参数之后的参数，或者你正在编写不支持可选参数的扁平\
  \ C API，那么你可以引入一个命名不同的函数，并可能重构旧方法的实现以调用新方法。例如，Win32 API 广泛使用这种技术，通过创建带有 `Ex` 后缀的函数来表示扩展功能。例如：\n\
  \n| ![image](img/u10-14-9780443222191.jpg) |\n\nWin32 API 还提供了弃用旧函数并为新函数引入替代名称的示例，而不是简单的在名称末尾附加\
  \ `Ex`。例如，`OpenFile()` 方法被弃用了，现在所有应用程序应该使用 `CreateFile()` 函数。\n\n在模板使用方面，向你的 API\
  \ 添加新的显式模板实例化可能会破坏向后兼容性，因为你的客户端可能已经添加了针对该类型的显式实例化。如果是这种情况，当这些客户端在尝试编译代码时将收到重复显式实例化错误。\n\
  \n\n\n\n在维护二进制兼容性方面，对现有函数签名所的任何更改都会破坏二进制兼容性，例如更改参数的顺序、类型、数量或 `const` 属性，或者更改返回类型。如果你需要更改现有方法的行为并维护二进制兼容性，那么你不得不为该目的创建一个新方法，并可能对现有函数的名称进行重载。这种技术在本章前面的部分已经介绍过：\n\
  \n![image](img/u10-15-9780443222191.jpg)\n\n最后，在不改变 API 任何方法签名的情况下更改其行为，将变得很常见。这可能是为了修复实现中的错误，或者为了更改方法支持的有效值或错误条件。此类更改在源码和二进制上都是兼容的，但它们会破坏你\
  \ API 的功能兼容性。通常，这些是预期的更改，受影响的客户端也会予以接受。然而，在行为变化可能对所有客户端都不理想的情况下，你可以让新行为成为可选的（opt-in）。例如，如果你向\
  \ API 中添加了多线程锁，你可以允许客户端通过调用 `SetLocking()` 方法来开启此新行为 (Tulach, 2008)。或者，你可以将开启/关闭功能的能力与我之前为\
  \ `Version` 类的 `HasFeature()` 方法集成。例如：\n\n![image](img/u10-16-9780443222191.jpg)\n\
  \n通过这种能力，你的客户端可以显式启用新功能，同时为现有客户端保留原始行为，从而保持功能兼容性。例如，\n\n![image](img/u10-17-9780443222191.jpg)\n\
  \n### 弃用功能 (Deprecating functionality)\n\n被弃用的特性是不积极建议客户端使用的特性，通常是因为它已被新的、更优选的特性所取代。弃用的特性仍然保留在\
  \ API 中，因此用户仍然可以调用，尽管这样做可能会产生某种警告。预期情况是，弃用的功能可能会 API 的未来版本中被完全移除。\n\n弃用是开始移除功能的过程的一种，同时给你的客户端留出时间更新代码，以消除对该功能的依赖。\n\
  \n弃用功能有多种原因，包括解决安全漏洞、引入更强大的功能、简化 API 或支持 API 功能的重构。例如，标准 C 函数 `tmpnam()` 已经被弃用，取而代之的是更安全的实现方式，如\
  \ `tmpnam_s()` 或 `mkstemp()`。\n\n当你弃用一个现有方法时，你应该在方法的文档中标记这一事实，并附上关于应取而代之任何新功能的说明。除了这项文档工作外，还有方法可以在函数被使用时产生警告信息。从\
  \ C++14 开始，拥有一种标准方法通过使用 `[[deprecated]]` 属性来实现这一点。例如：\n\n![image](img/u10-18-9780443222191.jpg)\n\
  \n你可以在函数签名前使用 `[[deprecated]]`，无论它是自由函数、函数模板还是类方法。你也可以在变量定义前使用它，以弃用你的任何 API 常量。然而，你目前还无法用它来弃用整个类、结构体或枚举。\n\
  \n如果你无法使用 C++14，大多数编译器都提供了自己的方法来将类、方法或变量标记为已弃用，如果程序尝试访问以这种方式标记的符号，它将输出编译时警告。在 Visual\
  \ Studio C++ 中，你在方法声明前加上前缀 `__declspec(deprecated)`，而在 GNU C++ 编译器中，你使用 `__attribute__\
  \ ((deprecated))`。这段代码定义了一个 `DEPRECATED` 宏，它可以在任一类编译器上工作：\n\n![image](img/u10-19-9780443222191.jpg)\n\
  \n使用该定义，你可以将某些方法标记为已弃用：\n\n![image](img/u10-20-9780443222191.jpg)\n\n如果用户尝试调用方法，编译器将输出该方法已弃用的警告。例如：\n\
  \n![image](img/u10-21-9780443222191.jpg)\n\n作为提供编译时警告的替代方案，你可以编写代码在运行时发出弃用警告。\n\n\
  \n\n\n![image](img/u10-23-9780443222191.jpg)\n\n你也可以通过 Doxygen 工具实现这一点，只需用 `\\cond`\
  \ 和 `\\endcond` 命令包裹函数声明即可，例如：\n\n![image](img/u10-24-9780443222191.jpg)\n\n###\
  \ 用于版本管理的内联命名空间\n\nC++11 引入了内联命名空间（inline namespaces）的概念，内联命名空间的所有成员都会被添加到封闭命名空间中。这一特性可以用于帮助\
  \ API 的版本管理，将其所有符号封装在一个版本命名空间内，例如：\n\n![image](img/u10-25-9780443222191.jpg)\n\n\
  此示例中的函数可以作为 `MyLibrary::v1::MyFunction()` 使用，也可以简单地作为 `MyLibrary::MyFunction()`\
  \ 使用。现在，如果我们发布了 API 的新版本，我们可以保留原始实现，同时引入新版本。例如：\n\n![image](img/u10-26-9780443222191.jpg)\n\
  \n在这里，我引入了一个新的 `v2` 命名空间，并使其成为内联命名空间而不是 `v1`。结果是，`MyLibrary::v2::MyFunction()` 现在是作为\
  \ `MyLibrary::MyFunction()` 可用的版本。然而，你的客户端仍然可以通过显式引用 `MyLibrary::v1::MyFunction()`\
  \ 来访问之前的版本，或者他们可以使用 `using namespace MyLibrary::v1` 来一致地仅使用 `v1` 符号，即使 `v2` 已经是默认的内联版本。\n\
  \n当你的客户端在代码中引用 `MyLibrary::MyFunction()` 时，编译器将在对象文件中使用带有版本号的完整命名空间。这意味着，如果你在后续版本中破坏了\
  \ API 的二进制兼容性，你实际上并不会破坏客户端的项目，因为他们显式地链接到之前的版本符号。因此，这种方法让你有能力保护客户端免受二进制破坏性更改的影响，尽管代价是为你分发的每个版本维护一套完整的符号。你可以通过仅将此技术应用于\
  \ API 的主版本号更改，或仅用于具有破坏性的版本更改，来降低这种成本。\n\n然而，如果你计划使用内联命名空间进行版本管理，你应该从 API 的第一个版本就开始使用它们。否则，你可能会破坏客户端的\
  \ ABI 兼容性。例如，如果他们最初链接到 `MyLibrary::MyFunction()`，但你转而使用内联命名空间，那么该符号将不再存在，取而代之的是\
  \ `MyLibrary::v1::MyFunction()` 和 `MyLibrary::v2::MyFunction()`。\n\n## API 评审\n\n\
  向后兼容并不是凭空产生的。它需要投入专注且努力的努力，以确保 API 的任何新更改都没有静默地破坏现有代码。实现这一点的最好是将 API 评审加入到你的开发过程中。在本节中，我将介绍进行\
  \ API 评审的论点，讨论如何成功实施这些评审，并描述一些可以使 API 变更评审工作更易于管理的工具。\n\n执行 API 评审有两种模型。一种是召开单一的发布前会议来评审自上一次发布以来的所有更改。另一种模型是强制执行提交前的变更请求流程，在提交之前，必须对\
  \ API 的更改提出请求并获得批准。当然，你可以两者兼顾。\n\n### API 评审的目的\n\n在没有至少编译代码的情况下，你不会向用户发布源代码。同样，在没有检查\
  \ API 更改是否会破坏他们的应用程序之前，你不应该向客户端发布 API 更改。对于任何认真对待 API 开发的人来说，API 评审都是至关且且不可少的步骤。如果你需要进一步的鼓励，这里是在向客户端发布\
  \ API 之前对其进行显式检查的几个理由：\n\n1. **维护向后兼容性。** 在发布之前评审 API 的首要原因是确保你没有在无意中以破坏向后兼容性的方式更改\
  \ API。正如我提到的，如果你有许多工程师致力于修复漏洞和添加新功能，可能某些人不会理解保留公共接口的至关重要的性。\n\n2. **维护设计一致性。** 对于你在\
  \ 1.0 版本发布时所执着的架构和设计计划，在随后的发布中保持它们至关重要。这里有两个问题。第一个是，不符合 API 设计的更改应该被捕获并重构；否则，原始设计会被稀释和变形，直到你最终得到一个没有内聚或一致性的系统。第二个问题是变更是不可避免的，如果\
  \ API 的结构必须改变，那么就需要重新审视架构以根据新的功能需求和用例进行更新。作为一个警告，John Lakos 指出，如果你为 10 个客户端实现一个新功能，那么每个客户端都得到了\
  \ 9 个他们没有要求的功能，而你必须实现、测试和支持 10 个你最初并没有设计的 (Lakos, 1996)。\n\n3. **变更控制。** 有时，某些更改可能太危险了。例如，工程师可能会尝试在一个侧重于修复漏洞和稳定性的发布中添加重大的新功能。更改可能过于广泛或测试不足、在发布过程中出现得太晚、违反了\
  \ API 原则（如暴露实现细节），或不符合 API 的编码标准。API 的维护者应该能够拒绝他们认为不适合当前 API 版本的更改，并将其目标指向未来的发布，可能还会提供改进该更改的反馈。\n\
  \n4. **允许未来演进。** 源代码的单次更改通常可以通过几种不同的方式实现。其中某些方式可能比其他方式更好，因为它们考虑了未来的演进并建立了一种更通用的机制，允许在不破坏\
  \ API 的情况下添加未来的改进。API 维护者应该能够要求以更具前瞻性的方式重新实现更改。Tulach 将此称为演进就 (Tulach, 2008)。\n\n\
  5. **重新考虑解决方案。** 一旦你的 API 在真实场景中使用并且你收到了客户端对其可用性的反馈，你可能会提出更好的解决方案。API 评审也可以作为一个重新审之前决策的地方，查看它们是否仍然有效且合适。\n\
  \n如果你的 API 非常成功并成为一种标准，那么其他供应商可能会编写替代实现。这使得 API 变更控制的需求变得更加关键。例如，OpenGL 的创建者意识到了这种需求，因此建立了\
  \ OpenGL 架构评审委员会 (ARB) 来管理该标准。ARB 负责 OpenGL API 的更改、推进标准以及定义符合性测试。这从 1992 年运行到 2006\
  \ 年，随后 API 规范的控制交给了 Khronos Group。\n\n### 发布前 API 评审\n\n发布前 API 评审是在最终发布 API 之前召开的会议。它通常是\
  \ Alpha 发布阶段之后进行的一个良好活动。对于你的组织来说，这些评审的最佳流程显然会与其他地方不同。然而，这里有一些通用建议可以指导你。首先，你应该确定谁是此类评审会议的关键参与者。例如：\n\
  \n\n\n\n\n# API 评审参与者\n\n1. **产品负责人（Product owner）**。这是对产品规划负总体责任并代表客户需求的人。显然，这个人必须具备技术背景，因为你的用户也是技术人员。在\
  \ Scrum 术语中，产品负责人代表了利益相关者和业务。\n\n2. **技术负责人（Technical lead）**。评审将产生关于为何添加某特定更改以及是否以最佳方式实现的问题。这需要对代码库有深层的技术知识和强大的软件设计能力。如果此人没有亲自开发，他们应该对\
  \ API 的架构和设计原理了如指掌。\n\n3. **文档负责人（Documentation lead）**。API 不仅仅是代码，还是文档。评审会议中提出的并非所有问题都需要通过更改代码来修复。许多问题需要修复文档。强大的文档是任何\
  \ API 的关键组成部分，因此在评审中有一位具备技术写作技能的人非常重要。\n\n4. **测试负责人（Testing lead）**。确保你没有破坏向后兼容性的一种方法是确保所有现有测试都已运行并持续通过。同样，确保已编写了覆盖任何新功能的测试测试也很重要。开发者通常负责维护单元测试，但可能还会涉及单独的\
  \ QA 工程师来处理更高级自动化测试，如集成测试或性能测试。\n\n你可能决定为评审会议增加更多可选参与者，以尝试扩大范围，确保新的 API 版本是尽可能的完美。在\
  \ Pixar，我们对交付给电影制作用户的所有动画系统公共 API 都进行了 API 评审。除了这些参与者，我们还会包含几位每天处理源码的高级工程师。你显然还希望有项目管理人员在场，记录会议的所有笔记，以免遗漏任何内容。\n\
  \n取决于 API 的规模和更改范围，这些会议可能会很长且枯燥。我们通常会进行几次 2 小时的会议，以涵盖一个发布的所有 API 更改。你不应该赶这些会议，也不应该在大家感到疲劳时继续进行。假设它们需要几天时间才能完成，并确保开发者和技术作家有时间在\
  \ API 发布之前实施会议中提出的任何更改。\n\n对于较大的组织来说，让工程师有一个良好的流程来提交新公共 API 或对现有公共 API 的更改提案尤为重要。此外，拥有一个专注于审查和执行组织\
  \ API 设计最佳实践的团队也是至关重要的。我工作过的一家大公司有一个非常好的 API 评审流程。他们有一个内部网站，可以在那里提交新或更改 API 的提案。提交通过\
  \ `GitHub` 管理，允许评审人员和利益相关者通过评论进行协作，执行诸如需要两个评审员批准之类的规则，并为所有 API 决策拥有完整的修订历史。这些提交的格式也定义良好，由以下部分组成：\n\
  \n1. **元数据（Metadata）**：每个提交都有一个唯一 ID、作者和赞助人列表、目标软件发布版本、任何相关的错误跟踪系统 ID 等。\n2. **引言（Introduction）**：为\
  \ API 更改提供简短的电梯演讲。\n3. **动机（Motivation）**：详细说明正在解决的问题。\n4. **建议方案（Proposed Solution）**：提供解决方案的概述，理想情况下带有示例。\n\
  5. **详细设计（Detailed Design）**：新或更改的公共符号声明，直接从代码中提取。\n6. **对质量的影响（Impacts on Quality）**：对\
  \ API 的可用性或测试的任何担忧。\n7. **已考虑的替代方案（Alternatives Considered）**：总结为了得出当前提议而做出的决策。\n\
  \n在 API 评审期间应该执行的活动方面，最重要的事情是关注正在交付的接口，而不是实现的具体细节。换句话说，主要重点应该放在公共符号和文档上，例如自动生成的\
  \ API 文档（参见 第 11 章 关于如何为此目的使用 `Doxygen` 的详细信息）。更具体地说，你最感兴趣的是自上次版本发布以来 API 的更改。这可能涉及创建一个工具来报告当前\
  \ API 与上一个版本之间的差异。对于每个更改，评审委员会都应该提出各种问题，例如：\n\n1. 此更改是否破坏了向后兼容性？\n2. 此更改是否破坏了二进制兼容性（如果这是目标的话）？\n\
  3. 此更改是否有足够的文档支持？\n4. 此更改是否可以用更具前瞻性的实现？\n5. 此更改是否对性能有负面影响？\n6. 此更改是否破坏了架构模型？\n7.\
  \ 此更改是否符合 API 编码标准？\n8. 此更改是否向代码中引入了循环依赖？\n9. API 更改是否应该包含升级脚本以帮助客户端更新代码或数据文件？\n\
  10. 针对更改的代码是否有现有的自动化测试以验证功能兼容性未受影响？\n11. 此更改是否需要自动化测试，以及是否已经编写？\n12. 这是我们想要发布给的更改吗？\n\
  \n### 提交前 API 评审\n\n当然，你不需要等到发布前刻才去发现这些问题。发布前的 API 评审会议是最后一道防线，确保不理想的更改不会发布给用户。然而，如果\
  \ API 所有者在开发过程中不断保持警惕，监控源码的提交并尽早标记问题，以便在进入 API 评审会议之前解决它们，那么 API 评审的工作就可以大大减少。\n\
  \n![image](img/f10-04-9780443222191.jpg)\n\n图 10.4 Symbian 平台的公共接口更改请求 (CR)流程。Copyright\
  \ (c) 2009 Symbian Foundation limited. 由 Stichbury 根据 Creative commons license 2.0\
  \ 许可。\n\n因此，许多组织或项目将建立提交前 API 评审。也就是说，他们将建立一个更改请求流程，其中希望更改公共 API 的工程师必须正式向 API 评审委员会请求该更改的许可。不影响公共\
  \ API 的仅实现内部的更改通常不需要通过这一额外流程。这对于开源项目特别有用，因为补丁可以从许多不同背景和技能的工程师处提交。\n\n例如，开源 Symbian\
  \ 移动设备操作系统对所有 Symbian 平台公共 API 更改实施了更改控制流程。该流程的说明目标是确保公共 API 以控制的方式演进。该流程通过提交包含以下信息的更改请求开始：\n\
  \n1. 更改描述及其必要性。\n2. 对任何 API 客户端的影响分析。\n3. 迁移到新版本 API 的指南。\n4. 向后兼容性测试用例的更新。\n\n\
  随后由架构委员会进行评审，他们将批准或拒绝请求并提供决策的理由。一旦获得批准，开发者就可以提交代码、文档和测试更新。图 10.4 提供了该流程的概述。\n\n\n\
  \n\n\n另一个例子是基于 Java 的 NetBeans 项目定义了一个 API 审查流程，用于接受开发者的补丁。这样做是为了监督 NetBeans IDE\
  \ 及其相关产品的架构。对现有 API 的更改或对新 API 的请求在合并到主代码分支（trunk code line）之前必须经过审查。该过程通过 NetBeans\
  \ 缺陷跟踪系统管理，审查请求被标记为 `API_REVIEW` 或 `API_REVIEW_FAST` 关键字。审查结果将导致更改被接受或拒绝。在被拒绝的情况下，通常会给开发者提供设计、实现或文档方面的改进建议，以使该更改更容易被接受。当然，对于被接受的更改，可能仍会提供类似的反馈。有关此流程的详细信息，请参阅\
  \ [`netbeans.apache.org/wiki/main/wiki/APIReviews/`](https://netbeans.apache.org/wiki/main/wiki/APIReviews/)。\n\
  \n你还可以依靠自动化来简化提交前的检查。例如，使用如 GitHub 等 SCM，你可以设置各种提交钩子（commit hooks）来强制执行编码规范、运行自动化测试、执行静态分析检查，并要求特定审查者的批准。只有在所有自动化检查通过并获得足够批准后，拉取请求（Pull\
  \ requests）才能被合并。你还可以定义一个 `CODEOWNERS` 文件，为代码库的不同部分指定不同的审查者，例如为任何 `.h` 文件更改包含一组\
  \ API 审查员。\n\n提交前审查（Precommit reviews）是开发过程中跟进不断变化的 API 变化流的好方法。然而，安排一次预发布前的 API\
  \ 审查会议也是很有用的。这可以用来捕捉任何由于工程师不了解流程或没有意识到流程适用于其更改而遗漏的更改。\n\n# 11: 文档\n\n## 摘要\n良好的文档是任何应用程序编程接口（API）的关键元素。它描述了\
  \ API 的功能是什么以及它的行为如何，例如定义参数、错误条件或抛出异常的单位。对于仅涉及行为的 API 更改，文档是通信 API 变化的唯一方式。本章提供了一个你应该记录的内容的清单，并详细介绍了你可以产出的各种类型的文档，包括自动化\
  \ API 文档、概述文档、代码示例、教程、发布说明和许可信息。本章的大部分内容致力于如何使用 `Doxygen` 工具自动创建 API 文档，包括概述、文件、类、方法和枚举注释的示例模板。\n\
  \n### 关键词\n自动化；合约；文档；示例；包容性语言；接口；许可；发布说明；教程\n\n在本书的第一章中，我将应用程序编程接口（API）定义为一个或多个头文件加上支持性文档。事实上，我声称，除非包含附带文档，否则\
  \ API 的规范是不完整的。因为头文件没有指定 API 的行为，只规定了各种函数和方法的调用约定。David L. Parnas 很好地描述了这一点（Parnas,\
  \ 1994）：\n\n```\n复用比说起来要容易得多。实现它既需要良好的设计，也需要非常好的文档。即使我们看到了良好的设计（这仍然很少见），如果没有良好的文档，我们也无法看到组件被复用。\n\
  ```\n\n因此，良好的文档是你的 API 的关键元素。因此，我将专门用一章讨论这个主题。我将首先介绍为什么你应该关注文档的一些原因，然后描述你可以提供的各种类型的文档，以及可以用于辅助编写文档任务的几种工具。\n\
  \n记录 API 最简单的方法之一是使用工具从你的头文件中自动提取注释并为你构建 API 文档。在这些工具中最流行且功能最全的之一是由 Dimitri van\
  \ Heesch 开发的 `Doxygen`。因此，我将花时间研究你如何在项目中使用 `Doxygen`，并提供一些记录你 API 各种元素的示例模板。\n\n\
  记录你的实现代码也是一种良好的做法，但那些文档是供你内部使用的，而记录 API 头文件的需求更为重要，因为那些文档是提供给你的用户的。\n\n在此处，我有义务承认，书中的大多数源代码示例很少或完全没有注释或文档。这样做仅仅是为了保持这些示例尽可能精简和集中，既为了让你你（读者）更容易理解，也为了让书的内容不会增加到当前大小的两倍。作为一种折中，我确保了随书的源代码示例都经过了良好的文档，你编写任何\
  \ API 头文件也应该如此。\n\n## 编写文档的原因\n我希望不需要说服你，为用户提供有关如何使用你 API 的细节是一件好事。事实确实，如果你遵循了“质量”章节中的核心原则，那么你的接口应该已经是一致的、可发现的且易用的。然而，这不能取代良好的文档。专业编写的文档是交付高质量、世界级\
  \ API 同样重要的组成部分。事实上，良好的文档可以决定用户是采用你的 API 还是寻找替代方案。\n\n### 定义行为\nAPI 是一份功能规范。也就是说，它应该定义如何使用接口，以及接口应该如何表现。仅仅查看头文件中的方法会告诉你其参数的数量和类型以及返回值的类型，但它没有说明该方法将如何表现。为了说明这一点，请考虑下面这个表示\
  \ RGB 颜色的类定义：\n\n![image](img/u11-01-9780443222191.jpg)\n\n该类定义完整指定了每个方法的参数和返回类型，因此你可以编写创建类实例并调用每个方法。然而，关于该类的行为，许多事情是未知的。例如：\n\
  \n1. 红、绿、蓝浮点值是用 `0.0` 到 `1.0` 的范围表示，还是 0% 到 100% 的百分比表示，或者是从 `0.0` 到 `255.0` 的浮点范围表示（以便能够准确表示\
  \ `127.5` 这个中间值），或者是从 0 到 `65,535`？\n2. 如果向构造函数或 `Set()` 方法传递超出范围的值会发生什么？它是会原样保留它们、截断它们、对值取模，还是尝试将它们缩放到有效范围内？\n\
  3. 构造函数和 `Set()` 方法的参数顺序是什么？推测是红、绿、然后蓝，但这在函数签名中并未显式说明。\n\n该类的后续更新版本以注释的形式提供了一些文档，以澄清这些点。三斜杠注释样式将在本章稍后我讨论\
  \ `Doxygen` 时进行解释：\n\n![image](img/u11-02-9780443222191.jpg)\n\n这些注释非常简练，但它们仍然规定了\
  \ API 的行为，足以让客户端使用。文档不需要冗长也可以做到详尽。虽然你的用户会非常感谢更多细节，但极简的文档也比没有文档要好。\n\n\n\n\n在编写头文件本身时，编写此类注释是一种良好的做法。一旦\
  \ API 更加稳定并接近发布质量，你随时可以回过添加更多内容或修改细节。但如果你确实时间不足，需要快速发布 API，你至少会拥有一份基础水平的文档。更好的是，你应该在\
  \ API 发布之前明确安排一项任务，为你的 API 编写文档。\n\n你甚至可以考虑为版本控制系统创建提交钩子（也称为触发器），以拒绝不包含文档的新版公共 API\
  \ 代码。如果这种政策过于严厉，你仍然可以进行代码检查，但将其视为建议性反馈，而不是阻止提交新代码的障碍。\n\n### 文档化接口契约\n\n“契约设计”（design\
  \ by contract）术语是由 Bertrand Meyer 提出的，作为一种定义软件组件形式化规范的方法（Meyer, 1987）。Meyer 后来在美国注册了该术语的商标，因此许多现在将其称为“契约编程”（contract\
  \ programming）。其核心概念是：软件组件为其将提供的服务提供一份契约或义务，而客户端在使用该组件时即表示同意该契约的条款。这一概念建立在 Hoare\
  \ 逻辑之上，这是 Tony Hoare 开发的一种用于推理程序正确性的形式化系统（Hoare, 1969）。该模型的主要原理有三点：\n\n* 1. **前置条件\
  \ (Preconditions)**：客户端有义务在调用函数之前满足函数所需的前置条件。如果不满足前置条件，函数可能无法正常运行。\n* 2. **后置条件\
  \ (Postconditions)**：函数保证在完成工作后某些条件将会满足。如果不满足后置条件，则说明函数没有正确完成工作。\n* 3. **类不变性 (Class\
  \ invariant)**：这些是类的每个实例都必须满足的约束。它定义了类为了按照其设计运行必须保持的状态。\n\n指定契约细节的最佳方式是在 API 的类文档和函数文档中。换句话说，你的函数应该指定调用它们之前必须生效的任何预期前置条件，以及完成后将满足的任何相应后置条件。此外，你的类文档应该指定在每个类的观测生命周期内保持\
  \ true 的不变性（即构造之后、析构之前，以及每次公共方法调用之前和之后）。让我们来看几个例子来更具体地演示这一概念。\n\n平方根函数将有一个前置条件，即输入数字必须是正数或零。它将有一个后置条件，即结果的平方应等于输入数字（在适当的误差范围内）。这些条件可以使用\
  \ Doxygen 语法进行记录，如下（在下一章关于测试的内容中，我将讨论如何在代码中强制执行这些条件）：\n\n![image](img/u11-03-9780443222191.jpg)\n\
  \n为了给出一个更面向对象的例子，考虑一个字符串容器类。它有一个类不变性：由 `size()` 方法返回的字符串长度必须大于大于或零。此外，由 `c_str()`\
  \ 和 `data()` 返回的指针必须始终非空。对于类的 `append()` 方法，被更改的字符串长度必须根据输入字符串的长度增长。这些契约条款在以下文档注释中表示（术语\
  \ `@pre.size()` 表示调用方法之前的字符串长度）：\n\n![image](img/u11-04-9780443222191.jpg)\n\n在类之间的继承关系方面，Ken\
  \ Pugh 指出，派生类的前置条件可以比基类弱，但不能强（Pugh, 2006）。这意味着，派生类应该处理其基类处理的所有情况，但它可能通过要求更少的前置条件来决定处理额外的情况。相比之下，派生类应该从其基类继承所有的后置条件。这意味着，派生类中的函数必须满足其所有基类的后置条件，以及满足它自己定义的进一步后置条件。\n\
  \n### 传递行为变更\n\n在很多情况下，API 的变更并不涉及任何类定义或函数签的更改。这发生在你更改了函数的底层实现而不影响其接口时。从代码的角度来看，这种变化对你的客户端来说是不可见的，因为它不影响你头文件中的函数签名。然而，API\
  \ 确实发生了变化，因为它的行为变了。换句话说，更新在源码和二进制上是的，但在功能上是不兼容的。\n\n在这种情况下，你可以通过修改 API 用的文档来传递变更。例如，考虑这个返回节点层次结构中子节点的函数：\n\
  \n![image](img/u11-05-9780443222191.jpg)\n\n根据文档，如果层次结构中没有子节点，该函数返回 `nullptr`。这种行为强制客户端对\
  \ `nullptr` 返回值进行防护，例如：\n\n![image](img/u11-06-9780443222191.jpg)\n\n现在，假设在此 API\
  \ 的未来版本中，你意识到如果在没有子节点时返回一个指向 `nullptr` 值的有效 `Node *` 指针，可以让客户端的生活更轻松并提高他们代码的稳定性。这消除了对特殊\
  \ `nullptr` 检查的需求，因此客户端可以编写这样的代码：\n\n![image](img/u11-07-9780443222191.jpg)\n\n\
  此变更没有涉及对 `GetChildren()` 方法签名的修改。然而，可以通过更新方法的文档将变更传递给客户端。例如，\n\n![image](img/u11-08-9780443222191.jpg)\n\
  \n### 文档化什么\n\n你应该记录 API 的每一个公共元素：每个类、函数、枚举、常量和类型定义。如果客户端可以访问它，你就应该告诉它们是什么以及如何使用它（Bloch,\
  \ 2008）。特别地，你应该关注任何能帮助他们高效使用你的类和方法的重要方面。这包括描述方法的行为以及它们与其他 API 部分的关系。\n\n指定参数和返回值的单位是良好文档的另一个特别重要的元素。这样做时，你应该考虑是否还需要定义这些值的性质、准确性和精度。一个特别相关的例子是每隔\
  \ *n* 秒调用客户端代码的定时器类。你可能将超时单位记录为秒，但客户端仍然合理询问：\n\n1. 时间是指现实时间（墙钟时间）还是进程时间？\n2. 定时器的准确性如何？\n\
  3. 其他 API 操作会影响计时器的准确性或阻塞它吗？\n4. 定时器会随时间漂移，还是总是相对于开始时间触发？\n\n\n\n\n定义这些额外的特性将帮助你的用户判断该类是否适用于他们的任务。例如，一个只需要每秒大约执行某些微要工作的空闲任务，并不在乎是在\
  \ 1.0s 后还是 1.1s 后被唤醒。然而，一个每次调用都会增加秒针进的模拟钟，在相同条件下，很快就会显示错误的时间。\n\n为了帮助你确定应该为 API\
  \ 编写哪些内容，此列表提供了一份清单，在你为类和函数编写文档时可以问自己这些问题：\n\n1. ▪ 类所代表的抽象是什么？\n2. ▪ 有效的输入是什么（例如，可以传递\
  \ `nullptr` 吗）？\n4. ▪ 有效的返回类型是什么（例如，何时返回 `true`，何时返回 `false`）？\n5. ▪ 它检查了哪些错误情况（例如，它是否检查文件是否存在）？\n\
  6. 是否有任何先置条件、后置条件或副作用？\n7. ▪ 是否存在未定义行为，例如 `sqrt(-1.0)`？\n8. ▪ 它会抛出任何异常吗？\n9. ▪ 它是线程安全的吗？\n\
  10. ▪ 单位或任何参数是什么？\n11. ▪ 空间或时间复杂度是什么，例如 `O(log n)` 或 `O(n²)`？\n12. ▪ 内存所有权模型是什么（例如，调用者是否负责删除任何返回的对象）？\n\
  13. ▪ 虚方法是否调用了类中的其他其他方法（即，当客户端在派生类中重写该方法时，应该调用哪些方法）？\n14. ▪ 是否有应该进行交叉引用的相关函数？\n\
  15. ▪ 该功能是在哪个版本的 API 中添加的？\n16. 此方法是否已弃用？如果是，替代方案是什么？\n17. ▪ 该功能中是否存在已知的 Bug？\n\
  18. ▪ 你是否希望分享任何计划中的未来增强？\n19. ▪ 是否可以提供任何代码示例？\n\n除了这个 API 行为列表外，Diomidis Spinellis\
  \ 还开发了一份所有优秀的代码文档都应该努力追求的质量短列表（Spinellis, 2010）。他建议文档应当是：\n\n* 1. 完整的。\n* 2. 一致的。\n\
  * 3. 易于获取的。\n* 4. 不重复的。\n\n让其他人审查你的文档也是良好的做法。作为编写代码的开发者，你往往离问题空间太近，可能会假设一些普通用户不会具备的知识。正如\
  \ Michi Henning 所说，API 的开发者“被实现细节污染了思维”（Henning, 2009 ）。因此，请让同事开发者、质量保证（QA）工程师或技术写作人员查看你的\
  \ API 文档，并对来自这种新鲜视角的反馈保持开放态度。\n\n## 文档类型\n\n你可以为 API 提供各种类型的文档。并非所有文档都适用于每个项目，但意识到你的用户可能期待的各种选择是值得的。\n\
  \n此外，许多软件产品提供的文档可以接受来自用户的贡献。这可以通过使用 wiki 实现，其中任何用户都可以创建和编辑文档，例如巨大的[魔兽世界 wiki](https://wowpedia.fandom.com/](https://wowpedia.fandom.com/)，或者支持用户注释附录的网页，例如[PHP\
  \ 手册](http://www.php.net/manual/](http://www.php.net/manual/)。这显然是一项强大的功能，可以围绕你的\
  \ API 建立社区，并创建出你个人所无法实现的集体文档。即使你没有采用自动化的用户贡献系统，你也应该提供一种让他们向你发送反馈的方式，以便手动将其纳入文档中。\n\
  \n你（或你的用户）编写的大部分文档将适用于 API 的特定版本。基于 wiki 的解决方案很容易掉入的一个陷阱是：wiki 内容最终会引用到 API 的多个版本。值得考虑你如何创建不同的版本化文档集，也许为每个主要发行版本生成一个独立的文档副本。这将允许使用旧版本的客户端查看该特定版本的文档，同时让你保持最新的文档集中在\
  \ API 的当前版本上。\n\n图 11.1 显示了 Qt 参考文档索引的图。它被作为一个详尽且编写良好的文档示例，展示了我接下将涵盖的所有各种文档类型。此外，所有的\
  \ Qt 文档都随 API 进行了版本控制。\n\n### 自动化 API 文档\n\nAPI 最显而易见的文档类型是从源代码中的注释中自动生成的类型。这允许你将类和方法的文档紧跟在头文件中的声明旁边。结果是，当你更改\
  \ API 时，更有可能保持文档的最新状态。为新发行版本生成最新文档也很容易，而且这些文档可以包含 API 的相关功能之间的交叉引用。\n\n![image](img/f11-01-9780443222191.jpg)\n\
  \n图 11.1 Qt 参考文档分类图。有关最新版本，请参阅 [`doc.qt.io/`](https://doc.qt.io/)。Qt 产品版权所有 (c)\
  \ 2023 The Qt Company。\n\n这可能是显而易见的，但任何用户文档注释都应该出现在你的公共头文件中，而不是 `.cpp` 文件中，这样用户更容易发现它们。这对于闭源\
  \ API 特别重要，因为用户无法访问你的 `.cpp` 文件。这些这些源代码注释通常由开发者维护。然而，如果你有专业的技术作家对注释进行风格、语法和一致性检查，你的\
  \ API 文档质量将得到大大提升。此外，作为全新的视角，这些作者通常可以提供良好的反馈并建议突出或改进示例。某些技术作家可能不习惯直接更改源码，在这种情况下，他们可以轻松标记文档副本并让开发者进行实际的代码更改。\n\
  \n有很多工具可以根据 C++ 源代码注释创建 API 文档。这些工具通常生成各种格式，如 HTML、PDF 和 LaTeX。以下列表提供了这些工具的链接。你还可以在\
  \ Wikipedia 上找到文档生成器的良好比较：\n\n1. ▪ AutoDuck: [`helpmaster.info/hlp-developmentaids-autoduck.htm`](http://helpmaster.info/hlp-developmentaids-autoduck.htm)\n\
  2. ▪ CcDoc: [`ccdoc.sourceforge.net/`](http://ccdoc.sourceforge.net/)\n3. ▪ CppDoc:\
  \ [`github.com/bproto/cppdoc`](https://github.com/bproto/cppdoc)\n4. ▪ Doc-O-Matic:\
  \ [`www.doc-o-matic.com/`](http://www.doc-o-matic.com/)\n5. ▪ Doc++: [`docpp.sourceforge.net/`](http://docpp.sourceforge.net/)\n\
  \n\n\n\n除了自动生成的 API 文档外，你还应该编写人工散文，以提供关于 API 的高层次信息。这通常包括 API 功能的概述以及用户为什么要关注它。在大型组织中，这项任务通常由技术写作人员完成。它甚至可能被翻译成几种不同的语言。概述文档通常会涵盖以下主题：\n\
  \n1. API 的高层概念视图：正在解决什么问题以及 API 是如何工作的。如果合适，图表会非常好。\n2. 核心概念、特性和术语。\n3. 使用该 API\
  \ 的系统要求。\n4. 如何下载、安装和配置软件。\n5. 如何提供反馈或报告错误。\n6. 关于 API 生命周期阶段的说明（例如：预发布、维护、稳定或已弃用；请参见“版本控制”章节）。\n\
  \n你还可以有机会编写自定义脚本，这些脚本可以调用你的 API 或解析数据文件（甚至是源代码文件的部分），以便向你的概述文档中插入更丰富的信息。例如，想象有一个图像处理\
  \ API，它提供了几个图像过滤对象，每个对象都包含名称、描述和一组参数。你可以编写一个脚本从 API 中提取每个过滤器对象，并在你的概述文档中生成一个简单的\
  \ markdown 表格。这样，用户就可以轻松地获取有关你 API 特性的关键信息。\n\n在过去，我通过编写嵌入 HTML 注释的文档来支持这种功能，注释用于指示由脚本更新的章节开始和结束。（大多数\
  \ markdown 系统可以解析 HTML 注释，但不会在文档渲染时显示它们。）然后，我编写了一个脚本来加载 markdown 文件，找到特殊的开始和结束注释，并将自动生成的内容插入它们之间。例如，文件最初看起来可能像这样：\n\
  \n![image](img/u11-09-9780443222191.jpg)\n\n在运行脚本后，文件可能看起来像这样：\n\n![image](img/u11-10-9780443222191.jpg)\n\
  \n通过这种方式，你可以生成丰富的概述文档，为客户提供有关你 API 的有用信息。由于文档的这些部分是自动生成的，你所做的只是重新运行你的脚本，你的文档就会立即与你的代码保持同步。\n\
  \n### 示例和教程\n\n示例非常、非常重要。API 概述通常过于高层次，无法让用户领会如何使用你的 API，尽管你已经为 API 中的每个 `class`\
  \ 和 `method` 编写了文档，但这并没有立即告诉用户如何使用 API 来完成任务。即使只添加几个小示例也能极大地增强文档的实用性。记住，API 是面向其他开发者的软件。他们只是想知道如何使用你的接口来完成工作。这可以作为文档中“快速入门”部分的一部分，并可能包含以下任何内容：\n\
  \n1. **简单简短的示例。** 这些应该是极简且易于理解的代码片段，用于演示 API 的核心功能。它们通常不是可以编译的代码，而是关注于你的 API 调用，而不包含周围的所有样板代码。\n\
  2. **运行中的演示（demos）。** 这些是完整的真实世界示例，展示了如何使用 API 执行更复杂、更实用的任务。这些示例应该易于复用，以便你的用户为自己的项目提供一个可以运行的起点。你应该随\
  \ API 一起提供这些示例的源代码。\n3. **教程和步骤引导。** 教程说明了你解决问题所经历的步骤，而不是简单地展示结果。这是一种构建复杂示例以及在向运行示例中逐渐添加更多调用时处理\
  \ API 特定特性的有用方法。\n4. **序图。** UML 序图可以提供关于如何使用你的 API 执行某些任务的更多上下文。它们也可以使用免费的绘图和图表工具相对容易地生成。我在图\
  \ 2.3 中提供过序图示例。\n5. **用户贡献。** 你的用户也可以示例的很好的来源。鼓励你的用户向你发送示例代码并你的演示集中，也许放在特定的 `contrib`\
  \ 目录下，以便明确这些内容不是由你提供的。\n6. **常见问题解答（FAQs）。** 一组常见问题的解答可以是你文档集中非常有用的补充。它让你的用户快速轻松地发现\
  \ API 是否符合他们的需求、如何避免常见陷阱或如何解决典型问题。\n\n编写文档的行为迫使你从用户的角度进行思考。因此，它可以帮助你识别 API 的缺陷或可以简化的区域。因此，尽早编写高层次文档的骨架和一些初始示例代码是一个良好的做法，可以迫使你对库的整体设计和用例进行更深层的思考。\n\
  \n自动化在这里也有用。例如，你的示例代码可以从你的单元测试库中提取。这样，你就保证了代码示例始终能够编译并成功运行。然后你可以让脚本从存储库中复制相关的测试代码并将其嵌入到文档中。这可以使用之前相同的技术，在\
  \ markdown 文件中使用特殊的开始/结束注释来指示插入代码的位置。再次，这提供了你的文档始终与你最新的工作代码保持同步的好处。\n\n### 发布说明\n\
  \n从第一次发布之后的每次发布都应该包含发布说明。这些说明告诉用户自上次发布以来发生了什么变化。发布说明通常是简洁的文档，可以包含：\n\n1. 版本的概述，包括对新内容的描述或本次发布的重点（例如：仅修复补漏洞）。\n\
  2. 指向发布所在位置链接。\n3. 识别与上一个版本相比的任何源代码或二进制不兼容之处。\n4. 本版本中修复的错误列表。\n5. 已弃用或删除的特性列表。\n\
  6. 针对 API 任何变化的迁移建议，例如如何使用随发布提供的升级脚本。\n7. 任何已知问题，无论是本版本引入的还是从之前的版本遗留的。\n8. 绕过已知问题的故障排除提示。\n\
  9. 关于用户如何发送反馈和错误报告的信息。\n\n### 许可证信息\n\n你应该始终指定分发 API 时遵循的许可证。这让你的客户了解你授予了他们什么权利以及他们的义务是什么。通常，你将使用以下两个类别中的许可证：\n\
  \n1. **专有（Proprietary）**：发布者保留软件的所有权，并可能禁止对其进行某些使用。通常这些软件产品是闭源的，并且需要许可费用（尽管有一个反例，Qt\
  \ 商业许可包含了源代码）。专有许可可能会限制某些活动，如对软件进行逆向工程、限制机器数量、开发者人数或多用户并发使用软件。\n\n\n\n\n\n## 2.\
  \ 免费与开源软件\n\n可以无限制地使用、研究和修改的软件。它也可以以修改或未修改的形式进行复制和分发，且不受或或极少限制。“免费”（free）一词指的是软件的使用权利，而不一定指其价格。符合这一类的软件被称为自由开源软件，通常缩写为\
  \ `FOSS` 或 `FLOSS`（free, libre, open source software）。\n\n有两个主要机构负责批准 FLOSS 许可证。由\
  \ Richard Stallman 于 1985 年创立的自由软件基金会（`FSF`）批准符合《自由软件定义》的许可证；Bruce Perens 和 Eric\
  \ S. Raymond 于 1998 年创立的开源倡议组织（`OSI`）批准符合其《开源定义》的许可证。\n\n还有两种主要类型的 FLOSS 许可证：\n\n\
  ### 1. 拷贝左（Copyleft）\n提供分发某软件的修改后和未修改版本副本的权利，并要求任何此类衍生作品必须在相同的条款下发布。还有一个名为“弱拷贝左”（weak\
  \ copyleft）的子类，通常应用于软件库，允许客户端分发链接到该库的代码，而无需要求该产品按照该库的拷贝左许可证进行分发。\n\n## 2. 宽松型（Permissive）\n\
  提供分发某软件的修改后和未修改版本副本的权利，并允许以比原始许可证更严格的条款分发衍生作品。这意味着你可以提供一个开源库，但并不要求你的客户将所有分发的衍生品都作为开源提供。\n\
  \n[表 11.1] 列出了一些常见的 FLOSS 软件许可证及其对用户影响的简要概述。所有这些许可证都获得了 `FSF` 和 `OSI` 的批准。此列表显然是不完全的，仅作为粗略指南。如果你可以咨询法律总顾问，你应该就产品的最佳许可证选择与其进行咨询。欲需更多详情，请参阅\
  \ `http://www.fsf.org/` 和 `http://www.opensource.org/`。\n\n到此，我们结束对为 API 可能提供的各种类型文档的讨论。[图\
  \ 11.2] 展示了另一个受推崇的软件项目文档概述示例：Apache HTTP 服务器。该文档也被翻译成了几种不同的语言。\n\n[表 11.1]\n\n常见的开源软件许可证。\n\
  \n| 许可证名称 | 简要描述 |\n| --- | --- |\n| **无许可证** | 如果你没有指定许可证，用户没有法律权利使用你的应用程序编程接口（`API`），除非他们直接向你许可（因为你是版权所有者）。\
  \ |\n| **GNU GPL 许可证** | GNU 通用许可证（`GPL`）是一种拷贝左许可证，这意味着任何衍生作品也必须以 `GPL` 分发。因此，开源的\
  \ GPL 库不能用于专有产品。Linux 内核和 GIMP 图像处理工具根据 `GPL` 发布。Qt 库最初根据商业许可证或 GPL 许可证发布。 |\n|\
  \ **GNU LGPL 许可证** | GNU 较小 GPL（`LGPL`）是一种弱拷贝左许可证，允许开源 `API` 以二进制形式链接到专有代码中。衍生作品可以在某些特定条件下分发，例如提供修改后或未修改的\
  \ `LGPL` 库的源代码，以及其他限制。`GTK+` 根据 `LGPL` 授权。诺基亚从 4.5 版本开始在 `Qt` 中增加了 `LGPL` 许可证。 |\n\
  | **BSD 许可证** | `BSD` 许可证是一种简单的宽松许可证，包含了由指定所有者/组织提供的法律免责声明。通常使用修改后的 `BSD` 版本，不包含广告条款。链接到\
  \ `BSD` 代码的专有代码可以自由分发。Google 根据 `BSD` 许可证发布了其 Chrome 浏览器。`Zend` 框架和 `libtiff` 库也使用了\
  \ `BSD`。 |\n| **MIT/X11 许可证** | 这是与 `BSD` 许可证简单宽松许可证。链接到 `MIT` 许可证代码的专有代码可以自由分发。`MIT`\
  \ 许可证软件包括 `Expat`、`Mono`、`Ruby on Rails`、5.0 及更高版本以及 `X11` 窗口系统。 |\n| **Mozilla\
  \ 公许可证** | 这是一种弱拷贝左许可证，允许你的开源库用于构建专有软件。任何代码修改必须根据 `MPL` 许可证重新分发。Mozilla 软件产品 `Firefox`\
  \ 和 `Thunderbird` 是根据 `MPL` 。 |\n| **Apache 许可证** | 这是另一种宽松型许可证，允许分发基于 `Apache`\
  \ 许可证代码构建的专有软件。`Apache` Web 服务器显然使用了 `Apache` 许可证。Google 也将其用于许多产品，例如 `Android`\
  \ 和 `Google Web Toolkit`。 |\n\n![image](img/f11-02-9780443222191.jpg)\n\n[图 11.2]\
  \ Apache HTTP 服务器文档页面的截图，`http://httpd.apache.org/docs/`。版权所有 (C) 2023 Apache 软件基金会\
  \ (`ASF`）。经 `ASF` 许可复制。\n\n## 文档可用性\n\n有几个研究小组正在调查 `API` 文档的可用性（`Jeong et al., 2009`;`Robillard,\
  \ 2009`; Stylos and Myers, 2008`）。这项工作涉及进行可用性研究，以查看用户导航文档和执行特定任务的效果如何。其目标是为 `API`\
  \ 设计师提供更好的接口记录方法。此列表总结了其中的一些发现：\n\n1. **索引页。** 提供一个总索引页，作为进入各个文档元素的跳转点。这为用户提供了整个文档集的概念蓝图。此外，每个起点都应该指示明其将涵盖的内容以及针对哪一类用户（开发者、经理、法律人员人员等）。\n\
  \n2. **一致的视觉效果和感受。** `API` 文档通常由不同元素组成，有些是自动生成的，有些是手写的，有些是用户贡献的。你应该对所有这些页面使用一致且独特的风格，以便使用户始终意识到他们正在浏览你的文档内容，或者他们已经导航到了另一个网站。\n\
  \n3. **代码示例。** 用户通常有大量的文档需要阅读。考虑一下微软开发者网络库的庞大规模。提供示例代码段和运行演示可以帮助用户更快地找到并吸收在自己的代码中使用\
  \ `API` 所需的信息。\n\n4. **图表：** 清晰明了的阐明高层概念的图表将非常有帮助，特别是对于那些只想快速浏览文档的用户。尽可能使用熟悉的图表格式，例如\
  \ `UML` 或实体关系图。\n\n5. **搜索：** 良好的搜索功能对于让用户尽可能快地找到他们的信息至关重要。文档的所有部分都应该是可搜索的，包括自动生成的\
  \ `API` 规范以及任何手动编写的文本。\n\n6. **面包屑导航：** 使用导航辅助工具让使用户跟踪自己在文档层次结构中的位置，并轻松向上层移动。“面包屑”一词用于描述一种常用技术，即将当前位置显示为带有分隔符的页面（例如，“索引>概述>概念”）。此外，让用户能够轻松返回各种高层页面也是很有用的。\n\
  \n\n\n\n\n## 7. 术语\n\n关键术语应该被定义并保持使用一致。然而，在没有必要的情况下，你应该避免使用专业或晦涩的术语，因为这会让用户感到困惑和挫败。\n\
  \n与 API 可用性相关的一个属性是易于学习性：一个难以使用的 API 可能也很难学习。为此，Martin Robillard 调查了是什么因素让学习 API\
  \ 变得具有挑战性。他发现，学习 API 的最大障碍之一是支持文档和资源。例如，他列出了这些阻碍 API 学习的因素（Robillard, 2009）：\n\n\
  1. **缺少代码示例**：提供的示例不足或不恰。\n2. **内容不完整**：文档缺失或呈现方式不当。\n3. **缺乏任务关注**：未提供如何完成特定任务的详细信息。\n\
  4. **缺乏设计原理**：对高层架构和设计原理提供的细节不足或不恰。\n5. **数据格式不可用**：文档未以所需的格式提供。\n\n除了这些点之外，许多研究还关注到开发者往往不愿意仔细或彻底阅读\
  \ API 文档这一事实（Zhong et al., 2009）。这表明，提供更多文档有时可能会适得其反，因为你的用户可能会因为信息埋得太深而错过真正重要的要点和注意事项。使用高级别的教程和示例代码可以帮助解决这个问题。此外，相关类和方法之间的交叉引用可以引导用户发现他们之前未注意的功能。一些研究人员还建议使用词云或其他可变字体技术来突出重要或常见的类（Stylos\
  \ et al., 2009）。\n\n### 包容性语言\n\n近年来，软件工程领域范围内出现了一项意识上的转变，尝试使用更具尊重和包容性的语言。一个备受关注的例子是\
  \ GitHub 将新创建仓库的默认分支名称从 `master` 改为 `main`，以避免带有种族色彩的关联。\n\n你的软件及其文档可能会被来自不同背景和文化的广阔用户群体使用。因此，你可能需要考虑你所使用的术语和措辞，以确保它们能够以积极、欢迎的方式传达你意图表达的概念。重要的是，起作用的不是你的意图，而是你的话语对软件或文档用户可能产生的影响。\n\
  \n实现这一点的的一种简单方法是尽可能倾向于使用更中立的术语。下表列出了目前可能被认为不敏感的常见软件术语，以及一些更具包容性的替代方案建议。\n\n| 术语\
  \ | 替代方案 |\n| --- | --- |\n| 黑盒/白盒 | 闭盒/开盒 功能性/内部 行为性/API |\n| 黑帽/白帽 | 恶意/已批准 不道德/合伦理\
  \ |\n| 黑名单/白名单 | 拒绝列表/允许列表 拒绝列表/许可列表 拒绝列表/接受列表 未批准列表/已批准列表 |\n| Dummy（哑人） | 样板代码\
  \ 占位符 样本 测试 |\n| 女性/男性 | 插槽/连接器 端口/插头 |\n| 中间人 | 中间人攻击 机器中间攻击 |\n| Master（主） | Main\
  \ 默认 首要 根 |\n| Master/slave（主/从） | 主/从 主/副本 主/从 主机/客户端 激活/备用 |\n| Scrum master（敏捷大师）\
  \ | Scrum 教练 Scrum 倡导 Scrum 协调员 |\n| Webmaster（站长） | 网站管理员 |\n\n许多组织都拥有写作风格指南，对如何进行包容且尊重的写作提供建议。这些文档中的一个共同主题是想象你的内容如何从不同的视角被解释。例如，你的词汇选择是否能被所有用户理解，以及这些词是否带有任何有害或负面的关联？以下列表提供了在在你的软件中命名概念以及编写相关文档时可以考虑的几个领域：\n\
  \n1. **颜色**：避免使用颜色来传达正面或负面的特质，例如使用白色代表好，黑色代表坏。还要避免诸如 `nonwhite`（非白色）等暗示白色是默认值的词汇。\n\
  2. **种族**：避免使用强化种族或民族刻板印象的词汇。更广泛地说，除非与你的软件项目相关，否则简单地避免提及种族。你可能也倾向于使用 `built-in`（内置）而不是\
  \ `native`（原生）。\n3. **性别**：当上下文不需要特定性别时，可以使用性别中性代词，如 `they`、`their` 或 `them`，或者使用复数形式（例如，“用户可以在此处输入他们自己的密码”）。\n\
  4. **年龄**：尽量避免对某些年龄组产生偏见的语言。例如，与其说“grandfathered”（受祖父保护的），你可以尝试使用“legacy”（遗留）、“exempt”（豁免）或“preexisting”（现有的）。\n\
  5. **名称**：当使用名称描述软件的虚拟角色或理论用户时，考虑使用多样化的名称，如 Julia、Toby、Anaïs、Manuel、Hae-Won、Aki、Lakshmi、Sinéad\
  \ 或 Xiu。\n6. **能力**：尽量避免涉及身体能力或心理健康的术。例如，你可能更倾向于使用 `degraded`（降级的）或 `immobilized`（固定的）而不是\
  \ `crippled`（残废的），或者使用 `consistency check`（一致性检查）而不是 `sanity check`（健全检查）。\n\n语言为我们提供了许多丰富且富有表现力的方式来表达意义。我们应该找到既准确描述又对用户友好积极的词汇。如果你想了解更多关于包容性写作，这些网站提供了很好的资源：\n\
  \n1. 包容性命名倡议：`https://inclusivenaming.org/`\n2. GSA/18F 指南：`https://content-guide.18f.gov/our-style/inclusive-language/`\n\
  3. 意识风格指南：`https://consciousstyle.com/`\n4. 多样性风格指南：`https://www.diversitystyle.com/`\n\
  5. 残障语言指南：`https://ncdj.org/style-guide/`\n\n## 使用 Doxygen\n\nDoxygen 是一种根据代码中的注释自动生成多种格式\
  \ API 文档的工具。它许多语言，包括 C、C++、Objective-C、Java、Python、Fortran、C# 和 PHP，并可以生成 HTML、LaTeX、PDF、XML、RTF\
  \ 和 Unix 手页等多种输出。\n\nDoxygen 是开源的（根据 GNU GPL 发布），并为 Windows、Linux 和 Mac 等多个平台提供了二进制文件。它自\
  \ 1997 年以来一直在发展，现在是一个成熟且强大的系统。由于它受欢迎并被许多项目使用，我在本章的剩余部分介绍了如何在项目中使用 Doxygen 的基础。\n\
  \nDoxygen 网站为 `http://www.doxygen.org/`。\n\n### 配置文件\n\nDoxygen 高度可配置，最新版本有超过 200\
  \ 个选项。所有这些选项都可以通过 Doxygen 配置文件指定。这是一个具有简单键=值格式的 ASCII 文本文件。你可以通过运行 Doxygen 并带有 `-g`\
  \ 命令行参数来生成默认配置文件。\n\n然后你可能需要编辑此配置文件以指定关于你代码的一些细节并在某些情况下更改默认行为。我发现我经常更改的一些条目是：\n\n\
  ![image](img/u11-11-9780443222191.jpg)\n\n\n\n\n完成这些初始设置后，你只需在源码目录中运行 `Doxygen`，它就会创建一个包含你的\
  \ API 文档的 `apidocs` 子目录（如果你采用了上文的 `HTML_OUTPUT` 设置的话）。在接下来的章节中，我将描述如何为代码添加注释，以便\
  \ Doxygen 能够捕获并将其添加到这些生成的文档中。\n\n## 注释样式与命令\n\n你必须使用特殊的注释样式来告知 `Doxygen` 你希望将注释文本添加到\
  \ API 文档中。`Doxygen` 支持多种注释样式，包括：\n\n![image](img/u11-12-9780443222191.jpg)\n\n采用哪种样式取决于你的个人喜好：它们的行为完全相同。在本章的剩余内容中，我将采用三斜杠样式（`///`）。\n\
  \n在注释内部，你可以指定几种命令来向 `Doxygen` 提供特定信息。这些信息通常会在生成的文档中以特殊的格式进行排化。下列表列举了一些最实用的命令（完整列表请参阅\
  \ `Doxygen` 手册）：\n\n1. `\\file [<filename>]`\n2. `\\class <class name> [<header-file>]\
  \ [<header-name>]`\n3. `\\brief <简要摘要>`\n4. `\\author <作者列表>`\n5. `\\date <日期描述>`\n\
  6. `\\param <parameter name> <description>`\n7. `\\param[in] <输入参数名> <description>`\n\
  8. `\\param[out] <输出参数名> <description>`\n9. `\\param[in,out] <输入/输出参数名> <description>`\n\
  10. `\\return <返回结果的描述>`\n11. `\\code <代码块> \\endcode`\n12. `\\verbatim <原样文本块>\
  \ \\endverbatim`\n13. `\\exception <异常对象> <description>`\n14. `\\deprecated <说明和替代方案>`\n\
  15. `\\attention <需要注意的消息>`\n16. `\\warning <警告消息>`\n17. `\\since <添加实体时的 API 版本或日期>`\n\
  19. `\\version <版本字符串>`\n20. `\\bug <异常的描述>`\n21. `\\see <指向其他方法或类的交叉引用>`\n\n除了这些命令外，`Doxygen`\
  \ 还支持各种格式命令来改变下一个单词的样式。这些包括 `\\b`（粗体）、`\\c`（等宽字字体）和 `\\e`（斜体）。你还可以使用 `\\n` 强制换行，使用\
  \ `\\\\` 输入反斜杠字符，以及使用 `\\@` 输入 @ 符号。\n\n### API 注释\n\n`Doxygen` 允许你使用 `\\mainpage`\
  \ 注释为整个 API 指定概览文档。这让你能够提供 API 的高层级描述以及对主要类的细分说明。该描述将出现在 `Doxygen` 生成的文档的首页。通常情况下，会将这些注释存储在单独的文件中，例如\
  \ `overview.dox`（这需要更新 `Doxygen` 配置文件的 `FILE_PATTERNS` 条目以包含 `*.dox`）。\n\n此概述文档中的文本可能足够长，到有必要将其分成不同的章节。在这种情况下，你可以使用\
  \ `\\section` 和 `\\subsection` 命令来引入这种结构。你甚至可以创建单独的页面来包含对 API 某些部分的更详细描述。这可以通过 `\\\
  page` 命令实现。\n\n你可能还会发现为 API 定义行为组很有用，这样你就可以将 API 中的各种类划分为不同的类别。例如，你可以为与文件处理、容器类、日志、版本控制等的类或文件创建组。这是通过使用\
  \ `\\defgroup` 声明一个组，然后使用 `\\ingroup` 将任何特定元素添加到该组来实现的。\n\n将这些功能结合起来，下一个注释为整个 API\
  \ 提供了概览文档，该文档分为三个部分，并交叉引用了另外两个页面以提供更详细的描述。页面包含一个链接，可以显示所有标记为给定组一部分的 API 元素：\n\n\
  ![image](img/u11-13-9780443222191.jpg)\n\n该注释生成的 `Doxygen` HTML 输出（使用默认样式表）所示图 11.3。\n\
  \n### 文件注释\n\n你可以在每个头文件的顶部放置注释，以为整个模块提供文档。以下是这些单文件注释的示例模板：\n\n![image](img/u11-14-9780443222191.jpg)![image](img/f11-03-9780443222191.jpg)\n\
  \n图 11.3\n\n### 类注释\n\n头文件中的每个类也可以有一条注释来描述该类的整体目的。除了提供的模板外，如果该类属于某个组，你可以考虑添加 `\\\
  ingroup`；如果该类已弃用，则添加 `\\deprecated`；如果你想提供一些示例，可以使用 `\\code`：\n\n![image](img/u11-15-9780443222191.jpg)\n\
  \n### 方法注释\n\n你可以为每个方法提供文档，详细说明名称以及每个参数的描述（可选 `in`、`out` 或 `in/out`）以及返回值的描述。与类一样，你也可以根据情况考虑添加\
  \ `\\ingroup` 或 `\\deprecated`：\n\n![image](img/u11-16-9780443222191.jpg)\n\n如果类中的方法属于一个或多个逻辑分组，你可以向\
  \ `Doxygen` 指定这一点，以便将相关方法分组到一个命名章节下。这可以为类成员提供更合理的排序，而不是使用 `Doxygen` 的默认行为。下一个代码片段演示了此类组的指定：\n\
  \n![image](img/u11-17-9780443222191.jpg)\n\n### 枚举注释\n\n`Doxygen` 还允许为枚举提供注释，包括对枚举每个值的文档。后者可以使用\
  \ `Doxygen` 的 `<` 注释语法，将文档附加到上一个元素，而不是下一个元素：\n\n![image](img/u11-18-9780443222191.jpg)\n\
  \n#### 带文档的示例头文件\n\n将所有内容整合在一起，这里有一个带有 `Doxygen` 样式注释的完整头文件，用于描述文件、类和每个方法。该示例位于书中辅助源代码中，以及\
  \ `Doxygen` 为该文件生成的 HTML 输出：\n\n![image](img/u11-19p1-9780443222191.jpg)![image](img/u11-19p2-9780443222191.jpg)\n\
  \n\n\n自动化测试是你可以投入的最重要的活动之一，用以确保应用程序编程接口（API）的更改不会破坏客户端的程序。本章首先介绍了编写测试的必要性，然后对你可以在\
  \ API 上执行的各种类型测试进行了分类，包括黑盒测试和白盒测试，以及单元测试、集成测试和性能测试。关于如何编写良好的测试的主题，将通过详细说明优秀测试的特质、测试内容、如何关注测试精力，以及如何与质量保证（QA）团队高效合作来涵盖。下一个主题探讨了如何编写更易于测试的代码。这涵盖了如测试驱动开发、存根对象（stub\
  \ objects）和模拟对象（mock objects）、如何测试私有代码、`assertions` 的正确使用以及国际化问题等技术。在最后节，介绍了各种自动化测试工具，例如测试框架、代码覆盖率工具、缺陷跟踪系统和持续构建系统。\n\
  \n### 关键词\n\n`Assertion; Code coverage; Integration testing; Mock object; Performance\
  \ testing; Quality assurance (QA); Stub; Test-driven development (TDD); Unit testing`\n\
  \n每一位开发者，无论经验多么丰富、细心多么仔细，都会在他们编写的软件中引入 Bug。随着应用程序编程接口（API）规模和复杂性的增加，这是不可避免的。测试的目的是尽早定位这些缺陷，以便它们在影响你的客户之前得到解决。\n\
  \n现代软件开发严重依赖于第三方 API 的使用。随着你自己的 API 变得无处不在，你代码中的故障和缺陷将可能影响许多客户端及其应用程序。\n\n正如我之前提到的，如果你交付的代码充满\
  \ Bug、不可预测或经常崩溃，你的客户最终可能会寻求替代方案。因此，尽职尽的测试是你 API 开发过程中的至关重要的一部分，因为它可以被用来提高你产品的可靠性和稳定性。这最终有助于你的\
  \ API 在市场中取得成功。\n\n在本章中，我将涵盖你可以采用的各种自动化测试类型，例如单元测试、集成测试和性能测试。我还将探讨如何编写良好的测试，以及同样重要的因素：如何设计和实现更易于测试的\
  \ API。最后，我将通过对你可以为项目采用的一些测试工具进行调查来补充这一讨论，并查看如何使用各种流行的自动化测试框架编写测试。在此过程中，我将讨论一些流程问题，例如与质量保证（QA）团队协作、使用质量指标以及如何将测试集成到你的构建过程中。\n\
  \n## 编写测试性\n\n工程师不喜欢写测试这是一个常见的误区。根据我的经验，每一位优秀的开发者都理解测试的必要性，而且大多数人都遇到过测试捕获他们代码中 Bug\
  \ 的情况。归根结底，软件工程师是为自己的工作感到自豪的工艺人，如果被要求产生低质量的结果，他们可能会感到士气消灭。然而，如果项目管理层没有明确地将测试需求纳入进度表，那么工程师就无法获得开发这些测试所需的资源和支持。通常，一个软件项目可以是日期驱动的、质量驱动的或功能驱动的。你可以选择其中两点，但不能三者兼顾。例如，在瀑布式开发过程中，功能蔓变（feature\
  \ creep）和不可预见的问题很容易消除项目末尾留给测试的任何时间。因此，在日期驱动或功能驱动的流程中，一个试图花时间编写自动化测试的工程师可能看起来效率较低。相反，如果工程师被赋予关注质量的能力，我相信他们会乐于为自己的代码编写测试的机会。\n\
  \n我在 Pixar 亲身经历过这一点，那里我们决定引入一项新政策，要求工程师必须为他们的代码编写单元测试，而且所有非 GUI 代码必须实现 100% 的代码覆盖率。也就是说，每一行非\
  \ GUI 代码都必须通过测试代码执行。我们发现，这并没有引发大规模的反抗，开发者认为这是对他们时间的良好利用。关键的促进因素是我们在每次迭代的最后增加了时间，让所有开发者都能专注于为他们的代码编写测试。即使在遵循这项政策\
  \ 2 年后，大家仍达成共识，编写测试的收益大于成本，并且维持 100% 的覆盖率目标仍然是合适的。\n\n如果你还需要一些激励，这里有你应该在自己的项目中采用测试的一些原因：\n\
  \n1.  **增加信心**。拥有一套广泛的自动化测试可以给你信心去更改 API 的行为，因为你深知自己没有破坏功能。换句话说，测试可以减少你对实施更改的恐惧。在遗留系统中，这种情况很常见，工程师对更改代码的某些部分感到不安，因为那些部分太复杂且不透明，对其行为的更改可能会产生不可预见的后果（Feathers,\
  \ 2004）。此外，相关代码可能由一位已离开该机构的工程师编写，因此没有人知道代码中“埋了什么”。\n\n2.  **确保向后兼容性**。重要的是要确保你没有在\
  \ API 的新版本中引入会破坏针对旧版本 API 编写的代码或旧 API 生成的数据文件的向后兼容性的更改。使用自动化测试可以捕获早期版本的工作流和行为，以便这些这些内容在库的最新版本中始终得到执行。\n\
  \n3.  **节省成本**。众周知的事实是在开发周期后期修复缺陷比在早期修复更贵。这是因为缺陷变得更深地嵌入代码中，而且消除它可能涉及更新数据文件。例如，Steve\
  \ McConnell 提供的证据，发布后修复 Bug 的成本可以是开发期间的 10 到 25 倍（McConnell, 2004）。开发一套自动化测试可以让你更早地发现缺陷，从而更早地修复，因此从整体上更具经济效益。\n\
  \n4.  **将用例代码化**。API 的用例代表了用户应该能够完成的支持工作流。在实现 API 之前为这些用例开发测试，可以让你知道你何时实现了所需的功能。这些相同的测试随后可以被持续使用，以捕获这些重要且关键工作流中的任何回归（regression）。\n\
  \n5.  **合规性保证**。用于某些安全或安全关键型应用程序的软件可能必须通过监管测试，例如联邦航空管理局（FAA）认证。此外，某些组织在允许你的软件被冠以此品牌之前，可能会验证你的软件是否符合他们的标准。例如，开放地理空间联盟（OGC）为要标记为“经过\
  \ OGC 认证”的软件有一项合规测试计划。自动化测试可以被用来确保你继续符合这些法规和标准要求。\n\n这些点可以总结为：自动化测试可以帮助你确定你是否在构建正确的东西（称为验证\
  \ validation），以及你是否在正确地构建它（称为确认 verification）。\n\n\n\n\n编写许多测试可能会有副作用。随着测试套件规模的增大，这些测试的维护工作也会随之增加。这可能导致这种情况：一个只需要几分钟就能完成的优秀更改可能会破坏数百个测试，并需要花费数小时来更新测试套件。这是一个糟糕的局面，因为仅仅由于更新测试的开销，就会工程师工程师进行良好的修复。我将在接下来的章节中讨论避免这种这种情况的方法。然而，如果涉及的修复更改了公共\
  \ API，那么额外的障碍可能是一件好事，因为它迫使工程师考虑对现有客户端向后兼容性的潜在影响。\n\n## API 测试类型\n\n测试 API 与测试终端用户或\
  \ GUI 应用程序不同。然而，许多技术仍然适用于这两种情况。例如，软件测试方法的一种常见分类是：\n\n* 1. **开盒测试 (Open box testing)**：测试是在了解源代码实现的情况下开发的，并且通常使用编程语言进行自动化。这有时被称为白盒测试或透明盒测试，意味着测试人员可以查看系统的内部运作。\n\
  * 2. **黑盒测试 (Closed box testing)**：测试是在不了解底层实现的情况下开发的，而是基于功能需求和用例等规范。这有时被称为黑盒测试，意味着内部运作对测试人员隐藏的。\n\
  \n这些术语有时意味着对自动化的使用或不使用。例如，因为开盒测试通常涉及编写代码，因此很容易对这些测试进行自动化并作为构建过程的一部分自动运行；而黑盒测试通常与手动测试相关，即由人员通过一系列手动步骤，从用户的角度物理地执行程序。尽管如此，并不总是如此：黑盒测试也可以是自动化的。从\
  \ API 测试的角度来看，你可以想象某些自动化测试是在了解实现的情况下编写的，而另一些测试仅从你客户端的预期角度编写，而不知道这些功能是如何实现的。然而，有几种自动化软件测试技术不适用于\
  \ API 测试。\n\n例如，“系统测试”（system testing）一术语指的是在完整的集成系统上进行的测试。这通常被认为是一个用户可以运行的实际应用程序。虽然可以认为一个大型\
  \ API 是一个完整的集成系统，但我更倾向于这种观点：API 是一个用于构建整个系统的构建块或组件。因此，我不会将系统测试视为测试 API 任务的一部分。\n\
  \n此外，自动化 GUI 测试领域通常不适用于 API，即编写自动化脚本以运行终端用户应用程序并模拟用户交互（如点击按钮或输入文本）的任务。这种情况的例外是你正在编写一个创建这些按钮和文本输入框的\
  \ GUI 工具包。然而，在这种情况下，你（以及你的客户端）创建一个自定义测试工具将受益，该工具可以为了自动化测试而导航并与你的组件层次进行交互。例如，Froglogic\
  \ 提供了一个用于 Qt 应用程序的自动化 GUI 测试工具，称为 Squish。\n\n因此，我在这里关注的主要功能测试策略是单元测试和集成测试。单元测试验证软件是否符合程序员的预期，而集成测试让客户端相信软件解决了他们需求。你还可以编写测试来验证\
  \ API 的非功能性需求。下列表提供了一些最常见的非功能测试策略的选择（我将在本章稍后介绍性能测试主题，作为非功能测试的示例）：\n\n1. **性能测试 (Performance\
  \ testing)**：验证你的 API 功能符合最小速度或内存使用需求。\n2. **负载测试 (Load testing)**：对系统施加需求或压力，并衡量其处理这种负载的能力。这通常指的是使用许多并发用户或每秒执行多次\
  \ API 请求的测试。这有时也被压力测试。\n3. **扩展性测试 (Scalability testing)**：确保系统能够处理大型且复杂的生产数据输入，而不仅仅是简单的测试数据集。这有时也被称为容量测试或卷测试。\n\
  4. **浸泡测试 (Soak testing)**：尝试在长时间内持续运行软件，以满足客户端它是健壮的能够处理持续使用的（例如，没有严重的内存泄漏）。\n5.\
  \ **安全性测试 (Security testing)**：确保满足代码的任何安全需求，例如敏感信息的机密性、身份验证、授权、完整性和可用性。\n6. **并发测试\
  \ (Concurrency testing)**：验证代码的多线程行为，以确保其行为正常且且不会发生死锁。\n\n### 单元测试\n\n单元测试用于验证源代码的单个最小单元，例如单个方法或类。单元测试的目的是获取\
  \ API 中最小的可测试部分，并验证它们在孤立状态下运行正常。\n\n这类测试通常运行非常快，并且通常表现为一系列返回真或假的断言（assertions），其中任何假结果都会导致测试失败。通常，这些测试与它们所测试的代码放在一起（例如在\
  \ tests 子目录中），并且它们可以在代码本身编译的同时进行编译和运行。单元测试通常由开发者利用对实现的了解来编写；因此，它们是一种开盒测试技术。\n\n\
  为了给单元测试提供一个具体的例子，让我们考虑你想要测试的将字符串转换为双精度数的函数：\n\n![image](img/u12-01-9780443222191.jpg)\n\
  \n该函数接受一个字符串参数并返回一个布尔值表示转换是否成功。如果成功，则将双精度值写入结果引用参数。给定此函数，下一个单元测试执行了一系列检查以确保它的工作符合预期：\n\
  \n![image](img/u12-02-9780443222191.jpg)\n\n注意使用了各种辅助函数来测试每个操作的结果：`Assert()`、`AssertFalse()`\
  \ 和 `AssertEqual()`。这些是单元测试框架中常用的函数，遵循 JUnit 风格，尽管有时会使用其他类似的函数名称或大小写。如果这些 JUnit\
  \ 风格的断言中的任何一个失败，整个测试将将失败，通常会有一个指向失败位置的描述性错误消息。\n\n那个例子是有意简化的。然而，在实际软件中，被测试的方法或对象通常依赖于系统的其他对象或外部资源，例如磁盘上的文件、数据库中的记录或远程服务器上的软件。这导致了两种不同的单元测试观点：\n\
  \n\n\n\n\n### 1. 固件设置 (Fixture setup)\n单元测试的经典方法是在运行每个单元测试之前，初始化一个一致的环境，称为“固件”（fixture）：例如，为了确保依赖对象和单例已初始化，将一组特定文件复制到已知位置，或者加载包含预留的一组初始数据的数据库。这通常在每个测试关联的\
  \ `setUp()` 函数中完成，以便将测试设置步骤与实际测试操作隔离开。通常还会使用一个相关的 `tearDown()` 函数在测试完成后清理环境。这种方法的好处之一是，同一个固件通常可以在多个测试中重用。\n\
  \n### 2. 存根/模拟对象 (Stub/mock objects)\n在这种方法中，通过创建存根（stub）或模拟（mock）对象来代表单元之外的任何依赖项，从而将被测代码与系统的其余部分隔离（[Mackinnon\
  \ et al., 2001]）。例如，如果一个单元测试需要与数据库通信，可以创建一个存根数据库对象，它接受单元将生成的子集查询并返回预设的数据作为响应，而无需与数据库建立实际连接。结果是一个完全隔离的测试，不会受到数据库问题、网络问题或文件系统权限的影响。然而，缺点是创建这些存根对象可能非常繁琐，并且通常无法被其他单元测试使用。另一方面，模拟对象往往更具活性，可以针对单个测试进行自定义。我将在本章后后的部分详细讨论这些这些选项。\n\
  \n### 集成测试 (Integration testing)\n与单元测试不同，集成测试关注多个组件协作工作时的交互。理想情况下，各个组件已经通过了单元测试。这种形式的测试也可以称为组件测试。\n\
  \n即使你具有很高的单元测试覆盖率，集成测试仍然是必要的，因为隔离地测试单个代码单元不能保证它们可以方便且高效地一起使用，也不能保证它们满足了你的功能需求和用例。例如，一个组件的接口可能与另一个组件不兼容，或者另一个组件所需的信息可能没有恰当地暴露给另一个组件使用。因此，集成测试的目标是确保你\
  \ API 的所有组件都能良好协作并保持一致，并且让用户能够执行他们所需的任务。\n\n集成测试通常是根据 API 规范（例如自动生成的 API 文档）开发的，因此不需要了解内部实现细节。也就是说，它们是从客户端的角度编写的。因此，集成测试是一种黑盒测试技术。\n\
  \n你通常可以使用编写单元测试的相同工具来实现集成测试。然而，集成测试通常涉及更复杂的方法来验证一系列操作是否成功。例如，一个测试可能会生成一个输出文件，该文件必须与存储在版本控制系统中、随测试提供的黄金版本或基准版本进行比较。这需要一个高效的工作流，在预期的失败的情况下更新基准版本，例如意识地在数据文件中添加了新元素，或者为了修复\
  \ Bug 更改了函数的行为。\n\n因此，一个良好的集成测试框架将为 API 可能产生的每种文件类型包含专用比较函数（或 diff 命令）。例如，API 可能有一个\
  \ ASCII 配置文件，在该文件中，只有当设置的值或数量发生变化时，才会触发集成测试失败，而如果文件中设置的顺序发生变化或使用了不同的空白字符来分隔设置，则不会触发。另一个例子是，API\
  \ 可能产生图像作为结果。因此你需要你需要方法将输出图像与该图像的基准版本进行比较。例如，PDI/Dreamworks 的研发团队开发了一种感知图像差异工具，以验证在更改动画系统后，其电影资产的渲染图像在视觉上是相同的。这种基于感知的比较允许实际像素值存在微小的不可察觉的差异，从而避免不必要的失败（[Yee\
  \ and Newman, 2004]）。\n\n最后一个例子引出了集成测试也可以是数据驱动的观点。也就是说，一个测试程序可以使用不同的输入数据被多次调用。例如，可以使用一个集成测试来验证\
  \ C++ 解析器，该测试读取 `.cpp` 源文件并输出其推导或抽象语法树。然后可以使用不同的 C++ 源程序多次调用该测试，并在每次将其输出与正确的基准版本进行比较。同样，`libpng`\
  \ 库有一个 `pngtest.c` 程序，它可以读取图像然后再次写入。该测试使用 Willem van Schaik 开发的代表性 PNG 图像套件 `PngSuite`\
  \ 以数据驱动的方式运行。图 12.1 显示了 `PngSuite` 中的一些图像。该集成测试确保了 `libpng` 的新更改不会破坏其读写各种 PNG 文件格式组合的能力，包括基础块处理、压缩、交织、alpha\
  \ 透明度、过滤、伽马和图像注释等其他属性。\n\n![image](img/f12-01-9780443222191.jpg)\n\n[图 12.1] Willem\
  \ van Schaik 的 PNG 图像测试套件的一部分，称为 `PngSuite`。详情请参见 [http://www.schaik.com/]。\n\n\
  有时，你的 API 可能由一个或多个命令行实用支持，以便从终端或 shell 脚本访问 API 的功能。例如，`libjpeg` 库带有各种实用程序，如 `cjpeg`、`djpeg`\
  \ 和 `jpegtran`。你也应该为这些工具编写自动化测试，因为它们也是你 SDK 的一部分，而且往往很容易在不知情的情况下破坏这些工具。因此，你应该编写一些测试，在这些测试中使用不同的命令行参数执行这些工具，并验证它们的输出。\n\
  \n\n\n\n由于集成测试的关注点与单元测试不同，可能由不同的团队维护，并且通常必须在构建成功完成后才能运行，因此这类测试通常位于与单元测试不同的目录中。例如，它们可能位于顶层源代码目录的兄弟目录中，而不是存储在源代码内部的实际代码旁边。这种策略也反映了集成测试与“开盒”单元测试相比所具有的“黑盒”特性。\n\
  \n### 性能测试\n\n通常，你的用户会要求 API 具有合理的性能水平。例如，如果你编写了一个库，为游戏引擎提供 3D 对象之间的实时碰撞检测，那么你的实现在每一帧中执行的运行速度必须足够快，不至于减慢客户端游戏的速度。因此，你可以为碰撞检测代码编写一个性能测试，如果执行时间超过了预定义的性能阈值，该测试将失败。\n\
  \n再举一个例子，当 Apple 开发 Safari Web 浏览器时，页面渲染速度是至关重要的。因此，他们添加了性能测试，并为每个测试定义了可以接受的速度阈值。然后他们建立了一套流程：如果代码提交导致性能测试超过其阈值，该提交将被拒绝。工程师在提交之前必须优化代码（如果他们的代码已经是最优的，则优化别人的代码）。\n\
  \n一个相关的问题是压力测试，通过这种测试你可以验证你的实现能够扩展到用户的真实世界需求：例如，一个可以处理许多并发用户的网站，或者一个可以处理数千或数百万粒子的粒子系统。这些被归类为非功能测试，因为它们不是测试\
  \ API 特定功能的正确性，而是关注其在用户环境中的运行行为。也就是说，它们测试的是 API 的非功能性需求。\n\n编写自动化性能测试的好处是你可以确保任何新更改都不会对性能产生不利影响。例如，我曾合作过的一位高级工程师重构了数据加载\
  \ API，使用 `std::string` 对象代替 `char` 缓冲区来存储从数据文件中读取的连续字符。当更改发布时，用户发现系统加载数据文件的时间比以前长了\
  \ 10 倍。事实证明，`std::string::append()` 方法每次都会重新分配字符串，每次调用只增加一个字节，从而导致了大量的内存分配。这最终通过使用\
  \ `std::vector<char>` 解决了问题，因为该容器的 `append()` 方法行为更优越。一个监控加载大数据文件时间的性能测试可以在代码发布给客户端之前发现这种回归。\n\
  \n然而，性能测试的编写和维护通常比单元测试或集成测试困难得多。原因之一是性能测试结果是真实的（浮点）数字，每次运行的结果都可能不同。它们不是离散的真或假值。因此，建议为每个测试指定一个容差，以处理每次测试运行的变异。例如，你可能为碰撞检测算法指定\
  \ 10ms 为阈值，但在标记测试失败之前允许 15% 的波动。另一种技术是仅在连续几个数据点超过阈值后才让测试失败，以排除性能中的异常尖峰值影响。\n\n此外，最好为运行性能测试准备专用的硬件，这样运行在机器上的其他进程就不会干扰测试结果。即使有专用的机器，你可能仍需要调查关闭某些系统后台进程，以防它们影响你的计时。这揭示了性能测试之所以难以维护的另一个原因：它们是针对特定机器的。这意味着你需要为运行测试的每类机器存储不同的阈值值。\n\
  \n性能测试的进一步复杂性源于信息过载问题。你最终可能会在不同的硬件上对每个性能测试产生数百种甚至数千种组合，每种组合在一天内都会产生大量数据点。因此，你希望将所有性能结果存储在数据库中。此外，如果你没有自动机制来突出那些超过阈值的测试，你可能会被误报信息淹没。另一方面，由于如此多的测试，你可能会花费大量时间更新基准。Mozilla\
  \ 提供了扩展性能测试的极佳示例。他们实现了一个在不同硬件上运行性能测试的系统。结果可以通过交互式网站浏览一个或多个性能测试。（在阅读性能图表时，要注意 y 轴是否从零开始。如果结果被缩放以适应屏幕，那么看起来巨大的波动实际上可能只是很小的比例变化。）\n\
  \n![image](img/f12-02-978043222191.jpg)\n\n图 12.2 来自来自 [https://arewefast.com/)\
  \ 的 Firefox 性能仪表板\n\n## 编写良好的测试\n\n现在我已经涵盖了 API 测试的基本类型，我将集中讨论如何编写这些自动化测试。我将涵盖良好测试的特性，并介绍编写高效且彻底测试的标准技术。我还将讨论如何与\
  \ QA 团队有效共享测试。\n\n### 良好测试的特性\n\n在讨论编写自动化测试的细节之前，我将介绍良好测试的一些高级属性。这些是在构建测试套件时始终应该记住的通用特性。然而，核心信息是，你应该像对待主代码一样严格对待测试代码。如果你开发的测试具有这些特性，那么你应该获得一个易于维护且健壮的测试套件，为你的\
  \ API 开发提供宝贵的安全保障：\n\n1. **快速**。你的测试套件运行应该很快，以便对测试失败获得快速反馈。单元测试应该总是快速，每个测试在毫秒级。执行实际用户工作流的集成测试或在许多输入文件上运行的数据驱动集成测试可能运行时间较长。但是，有几种方法可以处理，例如倾向于创建许多单元测试而非针对性的集成测试。此外，你可以分不同的不同的测试：快速（或提交或持续）测试在每个构建周期中运行，而慢（或完整或验收）测试仅在偶尔运行，例如在发布之前。\n\
  \n\n\n\n## 3. 稳定性 (Stable)\n测试应该是可重复、独立且一致的：每当你运行某个特定版本的测试时，都应该得到相同的结果。如果一个测试开始错误地或随机地失败，那么你对该测试结果有效性的信任就会降低。你甚至可能产生临时关闭测试的冲动，这无疑违背了编写测试的初衷。使用模拟对象（mock\
  \ objects）——即模拟单元测试的所有依赖项——是产生对环境条件独立且稳定的测试方法之一。这对于测试依赖于日期或时间的代码来说，也是唯一实用的可行方法。\n\
  \n### 4. 可移植性 (Portable)\n如果你的 API 在多个平台上实现，那么你的测试应该能够在相同范围的平台上运行。在不同平台上运行测试代码最常见的差异区域之一是浮点比较。舍入误差、架构差异和编译器差异可能会导致数学运算在不同平台上产生略有不同的结果。因此，浮点数比较应该允许微小的误差（即\
  \ `epsilon`），而不是进行精确比较。这个 `epsilon` 应该相对于相关数值的大小以及所用浮点类型的精密度。例如，单精度浮点数只能表示六到七位精度。因此，在比较如\
  \ `1.234567` 等数字时，`0.000001` 的 `epsilon` 可能是，但在比较如 `123456.7` 等数字时，`0.1` 的 `epsilon`\
  \ 会更合适。\n\n## 5. 高编码标准\n测试代码应该遵循与你的 API 其他部分相同的的编码标准：你不应该仅仅因为代码不会被用户直接运行就降低标准。测试应该有良好的文档说明，以便清楚正在测试什么，以及失败意味着什么。如果你对\
  \ API 代码执行代码审查，那么也应该对测试代码执行同样的操作。在我工作过的某些地方，工程师倾向于先通过查看单元测试的变化来开始代码审查。同样，你不应该仅仅因为在编写测试就放弃你良好的工程直觉。如果有理由将公共测试代码重构为可重用的测试库，那么你就这样做。随着测试套件规模的扩大，你可能会拥有成百甚至上千个测试。因此，对健壮且可维护的测试代码的需求与对主\
  \ API 代码的需求同样紧迫。\n\n### 6. 可复现的失败 (Reproducible failure)\n如果测试失败，应该易于复现该失败。这意味着要尽可能记录有关失败的信息，尽可能准确地定位实际失败点，并让开发者轻松在调试器中运行失败的测试。某些系统采用随机测试（称为即时测试\
  \ ad hoc testing），其测试空间非常大，以至于选择随机样本。在这些情况下，你应该确保易于复现导致失败的特定条件，因为仅仅重新运行测试会选取另一个随机样本并可能通过。\n\
  \n## 测试什么 (What to test)\n最后，我们到了关于实际编写测试的部分。编写单元测试的方法与编写集成测试的方法不同。这是因为单元测试可以了解代码的内部结构，例如循环和条件。然而，在这两种情况下，目标都是有条理地执行\
  \ API 方法。为此，有一系列标准的 QA（质量保证）技术可以用来测试你的 API。其中最相关的几项是：\n\n1. **条件测试 (Condition testing)**。在编写单元测试时，你应该利用你对被测代码的了解，执行单元内任何\
  \ `if/else`、`for`、`while` 和 `switch` 表达式的所有组合。这确保了代码中所有可能的路径都经过了测试。（我将在本章后面查看代码覆盖率工具时，讨论语句覆盖与决策覆盖的细节。）\n\
  \n2. **等价类 (Equivalence classes)**。等价类是一组具有相同预期行为的测试输入。因此，等价类划分技术试图寻找能够执行不同行为类别的测试输入。例如，考虑一个平方根函数，文档说明它接受范围在\
  \ `0–65,535` 之间的值。在这种情况下有三个等价类：负数、有效范围内的数字以及大于 `65,535` 的数字。因此，你应该使用来自这三个等价类的值来测试该函数（例如\
  \ `-10`、`100`、`100,000`）。\n\n3. **边界条件 (Boundary conditions)**。大多数错误发生在预期值的边界附近。你有多少次无意中编写带有差一错误（off-by-one\
  \ error）的代码？边界条件分析围绕这些边界值测试用例。例如，如果你正在测试一个向长度为 `n` 的链表插入元素的例程，你应该测试在位置 `0`、`1`、`n−1`\
  \ 和 `n` 处进行插入。\n\n4. **参数测试 (Parameter testing)**。对给定 API 调用的测试应该改变函数的所有参数，以验证完整的功能范围。例如，`stdio.h`\
  \ 函数 `fopen()` 接受第二个参数来指定文件模式。除了每个情况下可选的 `\"+\"` 和 `\"b\"` 字符外，它可以取值 `\"r\"`、`\"\
  w\"` 和 `\"a\"`。因此，对该函数的彻底测试应该测试模式参数的所有 12 种组合，以验证行为的完整范围。\n\n5. **返回值断言 (Return\
  \ value assertion)**。这种形式的测试确保函数对输入参数组合返回正确的结果。这些结果可以是函数的返回值，但还可能包括作为指针或引用传递的输出参数。例如，一个简单的整数乘法函数，\n\
  \n![image](img/u12-03-9780443222191.jpg)\n\n可以通过提供一系列 `(x, y)` 输入并对照已知正确值检查结果来对其测试。\n\
  \n1. **Getter/setter 对 (Getter/setter pairs)**。getter/setter 方法的使用在 C++ API 中非常常见，而且我一直主张你应该优先使用这些函数，而不是直接暴露类的成员变量。因此，你应该测试在调用\
  \ setter 之前调用 getter 返回适当的默认结果，并在调用 setter 后调用 getter 将返回适当的值，例如：\n\n![image](img/u12-04-9780443222191.jpg)\n\
  \n2. **操作顺序 (Operation order)**。改变执行相同测试的操作序列（在可行的情况下）可以帮助揭示执行顺序假设和非正交行为：即如果 API\
  \ 调用具有未记录的副作用，而这些副作用被依赖以实现某些工作流。\n\n3. **回归测试 (Regression testing)**。尽可能保持与 API\
  \ 早期版本的向后兼容性。因此，拥有验证这一目标的测试非常有价值的。例如，测试可以尝试读取由旧版本 API 生成的数据文件，以确保最新版本仍然正确摄取它们。在修改\
  \ API 时，确保这些数据文件绝不会更新为新格式。也就是说，你将拥有活动数据文件（针对当前版本更新）和遗留数据文件（验证 API 的向后兼容性）。\n\n\n\
  \n\n\n## 测试技术\n\n5. **负向测试（Negative testing）**。这种测试技术通过构建或强制触发错误条件来观察代码对意外情况的反应。例如，如果一个\
  \ API 调用尝试读取磁盘上的文件，负向测试可能会尝试删除该文件或使其变得不可读，以观察 API 在无法读取文件内容时的反应。负向测试的另一个例子是为 API\
  \ 调用提供无效数据。例如，一个接受信用卡号的支付系统既应该测试无效的信用卡号（负向测试），也应该测试有效的号码（正向测试）。\n\n6. **缓冲区溢出（Buffer\
  \ overruns）**。缓冲区溢出是指向内存写入的数据超过了已分配缓冲区的边界。这会导致未分配的内存被修改，通常会导致数据损坏并最终导致程序崩溃。数据损坏错误可能难以追踪，因为崩溃可能在实际缓冲区溢出事件后的某个时间才发生。因此，检查\
  \ API 是否向缓冲区大小之外的内存写入是一种良好的做法。这个缓冲区可以是类的一个内部私有成员，也可以是你传递给 API 用的参数。例如，`string.h`\
  \ 中的函数 `strncpy()` 最多从一个字符串复制到另一个字符串 `n` 个字符。可以通过提供长度等于或大于 `n` 个字符的源字符串来进行测试，然后验证写入目标缓冲区的字符不超过\
  \ `n` 个（包括空终止符‘‘\\0’）。\n\n7. **内存所有权（Memory ownership）**。内存错误是 C++ 程序崩溃的常见原因。任何返回分配内存的\
  \ API 调用都应该说明该 API 是否拥有该内存的所有权，还是由客户端负责释放它。这些规范应该经过测试以确保其正确性。例如，如果由客户端负责内存，测试可以请求两次对象并断言指针是不同的。进一步的测试可以释放内存，然后多次向\
  \ API 请求对象，以确保不会发生内存损坏或崩溃。\n\n8. **空输入（Null input）**。C++ 中程序崩溃的另一个常见源是将 `nullptr`\
  \ 传递给一个在没有检查的情况下立即尝试进行解引的函数。因此，你应该测试所有接受指针参数的函数，以确保它们在接收到 `nullptr` 时表现良好。\n\n###\
  \ 集中测试精力\n\n在大多数情况下，测试 API 中所有可能的路径都是不可行的。因此，你将面临决定测试整体功能中哪些子集的决策。为了帮助你集中测试精力，此列表列出了七种确定最高回报率的方法：\n\
  \n1. 关注于执行 API 主要用例或工作流的测试。\n2. 关注于涵盖了多个功能或提供了最广覆盖范围的测试。\n3. 关注逻辑最复杂、因此风险最高的代码。\n\
  4. 关注定义不完善的设计部分。\n5. 关注具有最高性能或安全性关虑的功能。\n6. 关注测试那些会对客户端产生最坏影响的问题。\n7. 将测试精力集中在可以在开发周期早期完成的功能上。\n\
  \n### 与质量保证（QA）协作\n\n如果你足够幸运有一个良好的 QA 团队来支持你的测试工作，他们可以分担编写自动化测试的责任。例如，开发者编写并负责单元测试是标准做法，而\
  \ QA 编写并负责集成测试也是标准做法。\n\n不同的软件开发模型会产生与 QA 产生不同的交互方式。例如，传统的瀑布模型（在发布前作为最后一步进行测试）意味着\
  \ QA 通常被视为一个独立的团队，其质量目标往往由于开发过程中的延迟而受到负面影响。相比之下，更敏捷的开发流程（如 Scrum）倾向于将 QA 嵌入到开发过程中，并在每个冲刺（sprint）或迭代中包含测试职责。无论何种情况，与\
  \ QA 工程师协作的好处在于他们成为了你的第一批用户。这样，他们就可以帮助确保你的 API 的功能和业务需求得到满足。\n\n我之前提到，API 测试通常需要编写代码，因为\
  \ API 是用于构建端端应用程序的软件。这意味着你的 QA 工程师必须能够编写代码以便有效地进行集成测试。与此相关，微软传统上使用两个广义术语来分类 QA 工程师：\n\
  \n1. **软件测试工程师（STE）**：编程经验有限，可能不需要深厚的计算机科学背景。`STE` 本质上执行手动黑盒测试。\n2. **软件设计测试工程师（SDET）**：可以编写代码，因此能够执行开盒测试、编写工具并生成自动化测试。\n\
  \n在 API 测试方面，你可能更倾向于选择 `SDET` 而不是 `STE` 作为 QA 工程师。然而，即使是大多数 `SDET` 也无法用 C++ 编程，尽管大多数人能够用脚本语言编写代码。因此，为你的\
  \ API 提供脚本绑定，可以为你的 QA 团队贡献自动化集成测试提供更多机会（有关添加脚本支持的细节，请参阅第 14 章）。\n\nTDD 的一个重要方面是按小步进行更改。你写一个短测试，然后编写足够的代码使测试通过，然后重复。在每次小更改后，你重新编译代码并运行测试。以这些小步骤工作意味着，如果测试开始失败，很有可能是由于自上次运行测试以来编写的代码引起的。让我们看一个例子来演示。我将从一个简单的测试开始，验证\
  \ `MovieRating`类的行为（Astels, 2003）：\n\n![image](img/u12-05-9780443222191.jpg)\n\n\
  \n\n\n\n![image](img/u12-06-9780443222191.jpg)\n\n这个 API 显然并没有做什么很多，但它确实让上一个测试通过了。现在你可以继续，并添加更多的测试代码：\n\
  \n![image](img/u12-07-9780443222191.jpg)\n\n现在是时候编写最少的代码让这个测试通过了：\n\n![image](img/u12-08-9780443222191.jpg)\n\
  \n编写另一个测试将迫使我们使实现更具通用性：\n\n![image](img/u12-09-9780443222191.jpg)\n\n现在你应该扩展实现，以返回添加的评分数量以及这些评分的平均值。实现此点的简单方法是记录所有评分的当前和以及添加评分的数量。例如：\n\
  \n![image](img/u12-10-9780443222191.jpg)\n\n显然，你可以通过添加更多测试来继续这种策略，以验证在零评分调用 `GetAverageRating()`\
  \ 是否崩溃，并检查添加范围外的评分值是否被恰当处理，我认为你已经理解了通用原理。\n\nTDD（测试驱动开发）的主要优点之一是，它迫使你在编写任何代码之前思考你的\
  \ API。你还必须考虑 API 将如何被使用（即：置于客户的立场）。TDD 的另一个效果是，你只实现测试所需要的内容。换句话说，你的测试决定了你需要编写的代码（Astels,\
  \ 2003）。这可以帮助你避免过早优化，并让你专注于整体行为。\n\nTDD 不局限于 API 的初始开发。它在维护模式期间也很有帮助。例如，当在 API 中发现一个\
  \ bug 时，你应该先为正确的行为编写一个测试。这个测试最初当然会失败。然后你可以开始实现对该 bug 的修复。你会知道 bug 何时被修复，因为你的测试将变为通过状态。一旦\
  \ bug 被修复，你又获得了一个持续回归测试的额外好处。\n\n### 桩对象（Stub）和模拟对象（Mock objects）\n\n一种让你的单元测试更稳定且对失败更具韧性的流行技术是，创建可以代表系统中真实对象的测试对象。这允许你将一个不可预测的资源替换为轻量级的可控替代品，以达到测试目的。不可预测资源的示例包括文件系统、外部数据库和网络。替代对象还可以用于测试在真实系统中难以模拟的错误条件，以及在特定时间触发或基于随机数生成触发的事件。\n\
  \n这些替代对象显然呈现出与它们模拟的真实对象相同的接口。然而，实现这些对象有几种不同的方法。此列表提供了一些选项，并介绍了每种情况下通俗接受的术语：\n\n\
  1. **假对象（Fake Object）**：具有功能行为但使用更简单实现以辅助测试的对象：例如，一个模拟与本地磁盘交互的内存文件系统。\n2. **桩对象（Stub\
  \ Object）**：返回预制或硬编码响应的对象：例如，一个 `ReadFileAsString()` 桩可能简单地返回一个硬编码的字符串作为文件内容，而不是读取磁盘上命名文件的内容。\n\
  3. **模拟对象（Mock Object）**：一种具有预编程行为的插桩对象，并对其方法的调用序列进行验证：例如，一个模拟对象（或简单的 mock）可以指定\
  \ `GetValue()` 函数在头两次调用时返回 10，之后返回 20。它还可以验证函数是否被调用过（例如只调用了三次，或至少调用了五次），或者类中的函数是否按给定顺序被调用。\n\
  \n桩对象（stub）和模拟对象（mock）之间的区别通常没有被理解，所以让我们用儿童纸牌游戏“战争”（War）的例子来演示。这是一种简单的游戏，一副扑牌平均分配给两个玩家。每个玩家翻出顶牌，点数最大的玩家拿走两张牌。如果牌值相等，每个玩家面朝下放三张牌，第四张面朝上。点值最大的牌赢得桌上所有的牌。玩家通过收集所有的牌来赢得游戏。\n\
  \n我将用三个类对这个游戏进行建模：\n\n* 1. `Card`：代表单张牌，具有与另一张牌比较其值的能力。\n* 2. `Deck`：持有一幅牌，具有洗牌和发牌的函数。\n\
  * 3. `WarGame`：管理游戏逻辑，具有执行整个游戏并返回游戏胜者的函数。\n\n在实际游戏过程中，`Deck` 对象将返回一张随机牌。但是，为了测试目的，你可以创建一个按定义顺序返回牌的桩牌。如果\
  \ `WarGame` 对象接受牌作为构造参数，你就可以轻松测试 `WarGame` 的逻辑。\n\n这个 `StubDeck` 将继承自真实的 `Deck`\
  \ 类，这意味着你必须将 `Deck` 设计为基类（并将任何需要重写的方法设为虚函数）。这里是 `Deck` 类的声明：\n\n![image](img/u12-11-9780443222191.jpg)\n\
  \n因此，我们的 `StubDeck` 类可以继承 `Deck` 并重写 `Shuffle()` 方法使其什么为空，因为你不想随机牌序。然后 `StubDeck`\
  \ 的构造函数可以创建一个特定的顺序。然而，这意味着桩类被硬编码为单一牌序。更通用的解决方案是扩展类以带有 `AddCard()` 方法。然后你就可以 `StubDeck`\
  \ 编写多个测试，并在传递给 `WarGame` 之前多次调用 `AddCard()`。实现此点的方法是在基类 `Deck` 中添加一个保护的 `AddCard()`\
  \ 方法（因为它修改了状态），然后在 `StubDeck` 类中将其公开。然后你可以写道：\n\n![image](img/u12-12-9780443222191.jpg)\n\
  \n所以，这就是桩对象的样子（事实上，这甚至可以被视为一个假对象，因为它提供了完整的功能但不包含随机元素）。让我们现在看看使用模拟对象测试是什么样的。\n\n\
  模拟对象和桩对象的主要区别之一是模拟对象坚持行为验证。也就是说，模拟对象被插桩以记录对象的所有函数调用，并验证诸如函数调用的次数、传递给函数的参数或多个函数调用的顺序。手动编写代码执行这种插桩可能是枯燥且容易出错的。因此，最好依赖模拟测试框架来自动完成这些工作。我在这里使用了\
  \ Google Mock 框架 ([`github.com/google/googletest`](https://github.com/google/googletest))\
  \ 来说明如何使用 mock 来测试我们的 `WarGame` 类。你要做的第一件事是使用 Google Mock 提供的方便宏来定义 mock：\n\n\n\n\
  \n`MOCK_METHOD0` 宏用于对零参数函数进行插桩，而 `Deck` 基类中的所有方法都是此类情况。如果你有一个单参数方法，则将使用 `MOCK_METHOD1`，依此类推。现在，让我们来写一个使用这个\
  \ mock 的单元测试。由于我正在使用 Google Mock 来创建 mock，我也将使用 Google Test 作为测试框架。它看起来如下：\n\n![image](img/u12-14-9780443222191.jpg)\n\
  \n巧妙之处在于那两行 `EXPECT_CALL()`。第一行声明我们的 mock 对象的 `Shuffle()` 方法至少被调用一次，第二行声明 `DealCard()`\
  \ 方法应该正好被调用 `52` 次，并且第一次调用将返回 `Card(\"JS\")`，第二次调用将返回 `Card(\"2H\")`，以此此类推。这种方法意味着你不需要为你的\
  \ mock 对象暴露 `AddCard()` 方法。mock 对象将在其析构函数隐式地验证所有预期，如果其中任何一个未被满足，测试将失败。\n\n就其如何影响你的\
  \ API 设计而言，其影响之一是你可能希望考虑一种模型，将对不可预测资源的访问封装在一个基类中，并将其传递到工作类中，就像在之前的例子中将 `Deck` 对象传递给\
  \ `WarGame` 对象一样。这允许你通过继承在测试代码中使用 stub 或 mock 版本。这本质上是依赖注入模式，即将依赖对象传递给一个类，而不是由该类直接负责创建和存储这些对象。\n\
  \n然而，有时为一个类封装并传递所有的外部依赖项并不实际。在这些情况下，你仍然可以使用 stub 或 mock 对象，但不是使用继承来替换功能，而是在链接时物理性地注入它们。在这种情况下，你将\
  \ stub/mock 类的命名为与你想要替换的类相同。然后，你的测试程序将链接到测试代码，而不是链接到带有真实实现的代码。使用我们早前的 `ReadFileAsString()`\
  \ 示例，你可以创建一个返回预定义数据的函数替代版本，然后将 `object.o` 文件与这个 stub 一起链接到测试程序中，替换持有真实实现的对象文件。这种方法非常强大，尽管它要求你为访问文件系统、网络等创建自己的抽象。如果你的代码直接调用标准库中的\
  \ `fopen()`，那么除非你为代码调用的所有其他标准库函数提供 stub，否则你无法在链接时用 stub 替换它。\n\n### 测试私有代码\n\n本书的重点一直是设计良好的\
  \ API，在提供逻辑抽象的同时隐藏实现细节。然而，这也会使得编写详尽的单元测试变得困难。有时你需要编写一个访问类私有成员的单元测试，以实现全代码覆盖。对于一个名为\
  \ `MyClass` 的类，可以通过几种方式实现，包括：\n\n1. **公共成员函数**：声明一个公共的 `MyClass::SelfTest()` 方法供测试代码调用。\n\
  2. **友元函数**：创建一个 `MyClassSelfTest()` 自由函数，并在 `MyClass` 中将其声明为友元函数。\n3. **友元类**：声明一个私有的\
  \ `MyClass::SelfTest()` 方法并创建一个可以运行测试函数的友元 `TestRunner` 对象。\n\n我在 C++ Usage 中详细说明了避免使用友元的几个原因，尽管在这种情况下使用友元函数或类可以帮助你避免暴露不打算供客户端使用的内部函数。例如，如果\
  \ `MyClassSelfTest()` 函数定义与 `MyClass` 实现相同的库中，那么该友元函数就可以是相对安全的，从而防止客户端在自己的代码中重新定义该函数。Google\
  \ Test 框架提供了 `FRIEND_TEST()` 宏来支持这种友元函数测试。\n\n我将首先介绍公共的 `SelfTest()` 方法，然后提供一个使用友元类的解决方案。在这两种情况下，我将都会处理一个包含自测试方法的简单边界框类。\n\
  \n![image](img/u12-15-9780443222191.jpg)\n\n`SelfTest()` 公共方法可以直接从单元测试中调用，以对各种私有方法进行额外的验证。这对于测试来说很方便，尽管这种方法也有一些不理想的缺点：即，你必须污染你的公共\
  \ API，引入一个客户端不应该调用的方法，并且可能通过将测试代码嵌入 `BBox` 实现内部为你的库增加额外的臃肿。\n\n在第一种情况下，有方法阻止客户端使用此函数。一种简单的方法是只需添加一条注释，说明该方法不供公开使用。更进一步，你可以从你编写的任何\
  \ API 文档中删除该方法，这样用户永远看不到关于它的引用（当然，除非他们直接查看你的头文件）。正如我在“版本控制”章节中讨论的，你可以使用 Doxygen\
  \ 工具通过在函数声明周围使用 `\\cond` 和 `\\endcond` 命令来实现这一点：\n\n![image](img/u12-16-9780443222191.jpg)\n\
  \n对于自测试函数可能会给你的代码增加臃肿的担心，如果你觉得必要，有几种方法可以处理。一种方法是在测试代码中实现 `SelfTest()` 方法，而不是在主 API\
  \ 中（例如在 `test_bbox.cpp` 中而不是 `bbox.cpp` 中）。仅仅因为你在 `.h` 文件中声明了一个方法并不意味着你必须定义它。然而，这开启了与使用友元类似的安全漏洞。也就是说，你的客户端可以在自己的代码中定义\
  \ `SelfTest()` 方法，以此修改对象的内部状态。虽然此函数的接口限制了他们能做的事情（因为他们无法传递任何参数或接收任何结果），但他们仍然可以使用全局变量来绕过这一点。\n\
  \n另一种方法是条件编译测试代码。例如，\n\n![image](img/u12-17-9780443222191.jpg)\n\n这种方法的缺点是你必须构建\
  \ API 的两个版本：一个是编译了测试代码的版本（使用 `-DTEST` 或 `/DTEST` 编译），另一个是不包含测试代码的版本。如果额外的构建是一个问题，你可以将测试代码编译到库的调试版本，但从发布版本中移除。\n\
  \n然而，如果你真的不想暴露 `SelfTest()` 函数，那么可以使用友元来帮助。例如，我们可以引入一个负责运行 `SelfTest()` 函数的 `TestRunner`\
  \ 类，被测对象可以在其中将其测试函数设为私有并将 `TestRunner` 声明为友。我们可以通过引入一个 `Testable` 抽象接口使其更具重用性，如果对象想为\
  \ `TestRunner` 提供 `SelfTest()` 函数，就可以继承自该接口。例如：\n\n![image](img/u12-18-9780443222191.jpg)\n\
  \n现在，你可以通过继承 `Testable` 接口并定义私有的 `SelfTest()` 函数轻松地为任何对象添加自测试函数，而完全无需向客户端暴露测试代码。例如：\n\
  \n![image](img/u12-19-9780443222191.jpg)\n\n\n\n\n如果你想为 C API 提供一个自测试函数，那么这个提议要变得简单得多。例如，你可以在\
  \ `.c` 文件中定义一个外部链接的 `SelfTest()` 函数，即一个在 Windows 上装饰了 `__declspec(dllexport)` 的非静态函数，但在\
  \ `.h` 文件中不为该函数提供原型。然后，你可以在测试代码中声明该函数原型，这样你就可以作为单元测试的一部分来调用该函数。通过这种方式，该函数不会出现在你的头文件或任何\
  \ API 文档中。事实上，客户端发现此调用的唯一方法是他们对你的共享库中的所有公共符号进行转储（dump）。\n\n### 使用断言（assertions）\n\
  \n断言是验证你的代码所做假设的一种方法。你通过在对 `assert` 函数或宏的调用中编码该假设来实现这一点。如果表达式的值为 `true`，则一切正常，不会发生任何事情。然而，如果表达式的值为\
  \ `false`，则你在代码中做的假设是无效的，你的程序将中止并返回相应的错误（McConnell, 2004）。\n\n断言本质上是你直接在代码中为程序状态包含额外健性测试的一种方式。因此，这些是帮助测试和调试的无价的补充辅助手段。\n\
  \n尽管你可以自由编写自己的断言例程，但 C 标准库在 `assert.h` 头文件中包含一个 `assert()` 宏（在 C++ 中也通过 `cassert`\
  \ 头文件可用）。接下来的示例使用此宏来展示你如何记录并强制执行这一假设：你即将解引的指针是非空的：\n\n![image](img/u12-20-9780443222191.jpg)\n\
  \n在生产环境代码中，关闭所有的 `assert()` 调用是一种常见做法，这样当用户运行应用程序时，用户程序就不会无故地中止。这通常通过让 `assert`\
  \ 调用在发布模式（release mode）而非调试模式（debug mode）下不操作来实现。（因此，你永远不要将必须始终执行的代码放入断言中。）这里是一个仅在调试构建中激活的简单断言示例：\n\
  \n![image](img/u12-21-9780443222191.jpg)\n\n你也可以使用 `NDEBUG` 定义进行编译以禁用 `assert.h`\
  \ 中的断言。\n\n断言应该用于记录你作为开发者认为绝不应该发生的情况。它们不适用于可能合法发生的运行时错误情况。如果你能从错误中优雅地恢复，那么你应该始终优先采取这种行动，而不是导致客户端程序崩溃。例如，如果你有一个接受客户端指针的\
  \ API 调用，你永远不应该假设它是非空的。相反，你应该检查是否为 `nullptr`，如果真是这种情况，则优雅地返回，并可能输出适当的错误消息。你不应该在这种情况下为此使用断言。然而，如果你的\
  \ API 强制要求你的其中一个私有成员变量始终是非空的，那么它如果为 `null` 将是一个编程错误。这是一个使用断言的合适情况。使用断言来检查编程错误；使用普通的错误检查来测试用户错误，并在那种情况下尝试优雅地恢复。\n\
  \n断言常用于商业产品以诊断错误。例如，几年前有报道说 Microsoft Office 套件包含了超过 250,000 个断言（Hoare, 2003）。这些断言通常与其他自动化测试技术结合使用，例如在开启断言的调试代码上运行大型的单元测试和集成测试用例集。如果任何测试代码触发了失败的断言，该测试运行将失败，允许开发者在错误导致客户端代码发生崩溃之前进行跟进并调查失败的原因。\n\
  \nC++11 通过 `static_assert()` 引入了对编译时断言的支持。如果此断言的常量表达式在编译时解析为 `false`，则编译器将显示提供的错误消息并失败；否则，该语句将没有影响。例如，\n\
  \n![image](img/u12-22-9780443222191.jpg)\n\n### 契约编程（Contract programming）\n\nBertrand\
  \ Meyer 创造并注册了“基于契约的设计”（design by contract）术语，用以规定接口与其客户端之间的义务（Meyer, 1987）。对于函数调用，这意味着指定客户端在调用函数之前必须满足的“前置条件”（preconditions），以及函数在退出时保证的“后置条件”（postconditions）。对于类来说，这意味着定义它在公共方法调用之前和之后所维护的“不变性”（invariants）（Hoare,\
  \ 1969； Pugh, 2006）。\n\n\n\n\n在使用这种编程风格时，需要记住的一个特别重要的建议是：针对接口进行测试，而不是针对实现。也就是说，你的前置条件检查和后置条件检查在你的\
  \ `API` 抽象层面上应该是合理的。它们不应该依赖于实现的具体细节；否则，你会发现每当更改实现时，就必须更改契约。\n\n还有一些设计模式可以利用，来为你的\
  \ `API` 强制执行前置和后置条件。其中一种方法是使用`线程安全接口`（Thread-Safe Interface）设计模式，我在`并发`（Concurrency）章节中介绍过。使用这种模式，可以实现一个公共函数，它执行必要的前置和后置条件，然后调用一个独立的保护虚方法来执行实际工作。客户端可以重写该虚方法以执行不同的工作，但公有的\
  \ `API` 调用仍然会对客户端的派生类执行相同的前置和后置条件。例如：\n\n![image](img/u12-27-9780443222191.jpg)\n\
  \n在思考如何在代码块执行前后可靠地执行某些逻辑时，你可能会想尝试应用 `RAII` 原则（即创建一个对象，在构造函数中定义前置条件，在析构函数中定义后置条件）。然而，析构函数无法返回结果，且不应该触发异常，因此\
  \ `RAII` 在情况下可能不是一个好工具。\n\n最后，由于本章侧重于测试，值得注意的是，大多数单元测试框架都允许你指定 `setup()` 和 `teardown()`\
  \ 函数，这些函数会在类中的每个单元测试之前之后被调用。这为你在测试代码中强制执行前置和后置条件提供了一种极佳的方法。我稍后在`自动化测试工具`部分提供一个相关的示例。\n\
  \n### 录制与回放功能\n\n对于测试（以及许多其他任务）来说，一个非常有价值的功能是能够录制对 `API` 的调用序列，然后可以随意地再次回放。录制和回放工具在应用程序或\
  \ GUI 测试领域很常见，在这些领域中，按钮点击和击键等用户交互会被捕获并回放以重复用户的操作。然而，同样的原理也适用于 `API` 测试。这涉及对你 `API`\
  \ 中的每个函数调用进行插桩，以便能够记录其名称、参数和返回值。然后可以编写一个回放模块，接受该日志或日志文件，并顺序调用每个函数。该模块随后可以检查最新的返回值是否与之前记录的响应匹配。\n\
  \n通常情况下，此功能默认是关闭的，这样创建日志文件的开销就不会影响 `API` 的性能。然而，可以在生产环境中开启它，以捕获实际终端用户的活动。这些日志文件随后可以作为数据驱动的集成测试添加到你的测试套件中，也可以在调试器中进行回放以帮助隔离问题。你甚至可以利用它们根据真实世界的使用信息来完善你的\
  \ `API` 行为，例如检测常见的无效输入并针对这些情况添加更好的错误处理。你的客户甚至可以在他们的应用程序中暴露此功能，允许他们的终端用户录制自己的操作并进行进行回放（即自动化应用程序中的重复性任务）。这在终端用户应用程序中通常被称为宏功能（macro\
  \ capability）。\n\n你有几种不同的方法可以以这种方式对 `API` 进行插桩。一种更干净的方法之一是引入一个代理 `API`，它本质上直接转发到你的主\
  \ `API`，但同时也管理所有的函数调用日志。通过这种方式，你不需要用这些细节污染实际的 `API` 调用，并且你始终可以选择交付一个没有任何任何日志功能的纯净\
  \ `API`。这在下面的简单示例中得到了演示：\n\n![image](img/u12-28-9780443222191.jpg)\n\n当然，如果 `API`\
  \ 已经有了特定语言的支持，那么这种 `API` 就可以来实现录制和回放。Meszaros 指出，如果使用 `API` 这种方法，可以结合测试驱动开发方法使用录制和回放（如-XML）。\n\
  \n通常，这种功能默认是关闭的，以确保创建日志文件的开销不会影响 `API` 的性能。\n\n例如：\n\n![image](img/u12-29-9780443222191.jpg)\n\
  \n你甚至可以利用它们根据真实世界的使用信息来完善你的 `API` 行为，例如检测常见的无效输入并针对这些情况添加更好的错误处理。你的客户甚至可以在他们的应用程序中暴露此功能，允许他们的终端用户录制自己的操作并进行回放（即自动化应用程序中的重复性任务）。\n\
  \n有几种不同的方法可以以这种方式对 `API` 进行插桩。你可以使用这些库之一来返回本地化字符串，并让他们指定 `API` 返回字符串的语言。这些库通常很容易使用。例如，GNU\
  \ gettext 库提供了 `gettext()` 函数来查找字符串的翻译并返回当前语言的翻译（假设已提供翻译）。通常，这个 `gettext()` 函数被别名为\
  \ `_`，这样你就可以写出简单的代码，例如：\n\n![image](img/u12-30-9780443222191.jpg)\n\n同样，Qt 库提供了卓越的国际化和本地化功能。所有使用\
  \ `Q_OBJECT` 宏的 `QObject` 子类都有一个 `tr()` 成员函数，其行为类似于 GNU 的 `gettext()` 函数，例如：\n\n\
  ![image](img/u12-31-9780443222191.jpg)\n\n### 支持国际化\n\n国际化（i18n）是使软件支持不同语言和区域差异的过程。相关的术语本地化（l10n）指的是利用国际化来为特定语言提供翻译，例如针对日期格式或货币符号的区域设置。\n\
  \n国际化测试可以确保产品完全支持给定的区域。这通常局限于应用程序测试：即测试应用程序的菜单和消息是否以用户的语言显示。然而，你在开发 `API` 期间所做的设计决策会影响客户提供本地化支持的难易程度。\n\
  \n例如，你可能更返回错误代码而不是单一语言的错误消息。如果你确实返回错误消息，那么将所有可能的错误消息定义在适当适当的头文件中将非常有帮助。此外，你不应该避免以字符串形式返回日期或格式化数字，因为这些在不同区域的解释不同。例如，`100,000.00`\
  \ 在美国和英国是一个有效数字，但在法国，相同的数字会被格式化为 `100 000,00` 或 `100.000,00`。\n\n## 自动化测试工具\n\n\
  在本节中，我将查看一些你可以用于支持自动化测试工作的工具。我将它们分为四类：\n\n\n\n\n1. **测试用具（Test harnesses）**。便于自动化测试的维护、运行和结果报告的软件库和程序。\n\
  2. **代码覆盖率（Code coverage）**。通过对代码进行插桩，以跟踪测试执行的实际语句或分支的工具。\n3. **缺陷跟踪（Bug tracking）**。一种基于数据库的应用程序，允许对软件提交缺陷报告、功能请求、优先级和解决。\n\
  4. **持续构建系统（Continuous build systems）**。每当添加新更改时都会重新构建软件并重新运行自动化测试的系统。\n\n## 测试用具\n\
  \nC 和 C++ 有许多可用的单元测试框架。其中大多数的设计与经典的 `JUnit` 框架类似，并支持基于断言的测试、固件设置（fixture setup）、针对多个测试的固件分组以及\
  \ mock 对象等功能。除了能够定义单个测试外，一个良好的测试框架还应该提供一次性运行整个测试套并报告总失败次数的方法。\n\n我不在这里尝试描述所有可用的测试用具；如果你有需要，在网上搜索\
  \ C++ 测试框架会找到很多供你研究的工具。不过，我将为几个较为流行或有趣的框架提供详细说明。\n\n- **CppUnit** ([`cppunit.sourceforge.net/`](http://cppunit.sourceforge.net/)):\
  \ 一个由 Michael Feathers 最初创建的 `JUnit` 的 C++ 移植。该框架支持各种辅助宏以简化测试声明、捕获异常以及多种输出格式（包括\
  \ XML 格式和类编译器的输出，以便与 IDE 集成）。`CppUnit` 还提供了几个不同的测试运行器，包括基于 Qt 和 MFC 的 GUI 运行器。`CppUnit`\
  \ 版本 1 已达到稳定状态，未来的开发正转向 `CppUnit 2`。Michael Feathers 还创建了一个极其轻量级的 `CppUnit` 替代版本，称为\
  \ `CppUnitLite`。这里是一个基于 `CppUnit` 教程示例、使用 `CppUnit` 编写的测试用例：\n\n![image](img/u12-31-9780443222191.jpg)\n\
  \n- **Boost Test** ([`www.boost.org/`](http://www.boost.org/)): Boost 包含一个测试库，用于编写测试程序、将测试组织为简单的测试用例和测试套件并控制它们的运行时执行。该库的核心价值在于可移植性。因此，它使用了\
  \ C++ 特性的保守子集并尽量了与其他 API 的依赖。这使得该库能够用于其他 Boost 库的移植和测试。`Boost Test` 提供了一个执行监控器，可以捕获测试代码中的异常，以及一个可以检查终端用户应用程序异常和非零返回值的程序执行监控器。下一个示例源自\
  \ `Boost Test` 手册，演示了如何使用该库编写简单的单元测试：\n\n![image](img/u12-32-9780443222191.jpg)\n\
  \n- **Google Test** ([`github.com/google/googletest`](https://github.com/google/googletest)):\
  \ Google C++ 测试框架为 C++ 提供了一个 `JUnit` 风格的单元测试框架。它是一个跨平台系统，支持自动测试发现（即你不需要手动列出测试套件中的所有测试）以及丰富的断言集，包括致命断言（`ASSERT_*`\
  \ 宏）、非致命断言（`EXPECT_*` 宏）以及所谓的“死亡测试”（检查程序是否按预期终止）。`Google Test` 还提供了运行测试的各种选项，并提供文本和\
  \ XML 报告的生成。正如我之前提到的，Google 还提供了一个 mock 对象测试框架 `Google Mock`，它与 `Google Test` 集成良好。下面的代码演示了如何使用\
  \ `Google Test` 创建一个单元测试套件：\n\n![image](img/u12-33-9780443222191.jpg)\n\n- **Template\
  \ Unit Test** ([`tut-framework.sourceforge.net/`](http://tut-framework.sourceforge.net/)):\
  \ Template Unit Test (`TUT`) 框架是一个小型、可移植的 C++ 单元测试框架。它仅由头文件组成，因此不需要链接库或进行部署。测试被组织成命名的测试组，框架支持自动发现你定义的所有测试。它提供了几种测试报告器，包括基本的控制台输出和\
  \ `CppUnit` 风格的报告器。还可以使用 `TUT` 可扩展的报告器接口编写自己的报告器。这里是一个使用 `TUT` 框架编写的简单规范单元测试：\n\n\
  ![image](img/u12-34-9780443222191.jpg)\n\n## 代码覆盖率\n\n代码覆盖率工具让你精确发现代码中哪些语句被你的测试执行了（即这些工具可以用于将测试活动集中在代码库中尚未被测试覆盖的部分）。可以衡量不同程度的代码覆盖率。我将参考这个简单的代码示例来定义这些每一项：\n\
  \n![image](img/u12-35-9780443222191.jpg)\n\n1. **函数覆盖率（Function coverage）**。在最粗糙的代码覆盖级别上，只跟踪函数调用。在我们之前的示例中，函数覆盖率将记录\
  \ `TestFunction()` 是否至少被调用一次。函数内部的控制流对函数代码覆盖率结果没有影响。\n2. **行覆盖率（Line coverage）**。这种形式的代码覆盖测试包含可执行语句的每行代码是否被到达。该指标的一个局限性可以在我们之前代码的第\
  \ 1 行看到。即使没有执行 `a++` 语句，行覆盖也会认为第 1 行已执行了 100%；它只取决于控制流是否命中了这一行。显然，你可以通过将 `if` 条件和\
  \ `a++` 语句放在单独行来规避这一局限。\n3. **语句覆盖率（Statement coverage）**。该指标衡量控制流是否至少到达了每个可执行语句。这种覆盖形式的主要局限性是它没有考虑由\
  \ `if`、`for`、`while` 或 `switch` 语句中的表达式产生的不同代码路径。例如，在我们之前的代码中，语句覆盖会告诉我们第 3 行的条件是否为真，导致第\
  \ 4 行执行。然而，它不会告诉我们该条件是否为假，因为与该结果没有关联的可执行代码。\n4. **基本块覆盖率（Basic block coverage）**。基本块是一段无法分支进入或出的语句序列。也就是说，如果第一条语句被执行，则块中的剩余所有语句都将被执行。本质上，基本块结束于分支、函数调用、抛出（throw）或返回。这可以被视为语句覆盖的一种特殊情况，具有相同的优点和局限性。\n\
  5. **决策覆盖率（Decision coverage）**。这种代码覆盖率指标衡量每个控制结构中表达式的整体结果是否都评估为真和假。这解决了语句覆盖的主要缺陷，因为你将知道第\
  \ 3 行的条件是否为假。这也被称为分支覆盖率。\n6. **条件覆盖率（Condition coverage）**。条件覆盖率确定控制结构中的每个布尔子表达式是否都评估为真和假。在我们之前的示例中，这意味着第\
  \ 3 行必须分别被 `a >10`、`a ≤ 10`、`b !=0` 和 `b ==0` 命中。这并不一定意味着决策覆盖，因为这些事件的任何发生顺序可能导致\
  \ `if` 语句的整体结果始终评估为假。\n\n\n\n\n有多种程序可以让你衡量 C++ 代码的覆盖率。这些工具中的每一个都支持上述指标的不同组合，通常通过对你的编译器生成的代码进行插桩来实现。这些工具中大多数是商业产品，尽管也有一些免费和开源的选项。\n\
  \n一个特别有用的功能是能够从分析中排除某些代码行，这通常通过在这些代码行上添加特殊注释来实现。这可以用于关闭那些逻辑上永远无法被执行的行的覆盖率，例如基类中总是被重写的方法，尽管在这种情况下，如果这些排除的代码在未来确实被暴露，覆盖率工具抛出错误是至关重要的。\n\
  \n![image](img/f12-03-9780443222191.jpg)\n\n图 12.3 由 `lcov` 生成的示例 HTML gcov 代码覆盖率报告。\n\
  \n另一个需要注意的问题是，你通常应该对未经过优化的编译版本进行代码覆盖率分析，因为编译器在优化过程中可能会重新排序或消除单行代码。\n\n此列表提供了一些主要的代码覆盖率分析工具的简要介绍：\n\
  \n1. **Gcov** ([`gcc.gnu.org/onlinedocs/gcc/Gcov.xhtml`](http://gcc.gnu.org/onlinedocs/gcc/Gcov.xhtml))。这个测试覆盖程序是开源\
  \ GNU GCC 编译器集合的一部分。它在通过 `g++` 使用 `-fprofile-arcs` 和 `-ftest-coverage` 选项生成的代码上运行。`Gcov`\
  \ 提供函数、行和分支的代码覆盖率。它以文本格式输出报告；但是，配套的 `lcov` 脚本可将结果输出为 HTML 报告（图 12.3）。\n\n2. **Intel\
  \ Code Coverage Tool** ([`www.intel.com/`](http://www.intel.com/))。该工具包含在 Intel\
  \ 编译器中，并运行这些编译器产生的插桩文件上。它提供函数和基本块覆盖率，并将分析限制为仅感兴趣的模块。它还支持差异覆盖（即将一次运行的输出与另一次运行进行比较）。`Code-Coverage\
  \ Tool` 在 Windows 或 Linux 下的 Intel 处理器上运行。\n\n3. **Bullseye Coverage** ([`www.bullseye.com/`](http://www.bullseye.com/))。这种来自\
  \ Bullseye Testing Technology 的覆盖率工具提供函数以及条件/决策覆盖率，为你提供不同范围的覆盖精度。它提供了许多功能，如覆盖系统级和内核模式代码、合并分布式测试的结果，以及与\
  \ Microsoft Visual Studio 集成。它还允许你从分析中排除代码某些部分。Bullseye 是一款成熟的产品，支持广泛的平台和编译器。\n\n\
  4. **Rational PureCoverage** ([`www.rational.com/`](http://www.rational.com/))。该代码覆盖率分析工具作为\
  \ UNICOM Systems 的 `PurifyPlus` 软件包的一部分出售。它可以报告可执行文件、库、文件、函数、块和行层面的覆盖率。`PureCoverage`\
  \ 可以积累多次运行的覆盖率，并合并来自相同源代码的不同程序的数据。它提供图形和文本输出，让你探索其结果。\n\n一旦你建立了代码覆盖率构建体系，并能够参考 API\
  \ 的常规覆盖率报告，你就可以为你的代码制定代码覆盖率目标了。例如，你可以指定所有代码必须达到特定的阈值，例如 75%、90% 或 100% 的覆盖率。你选择的目标在很大程度上取决于你所采用的覆盖率指标：达到\
  \ 100% 的函数覆盖应该相对容易，而 100% 的条件/决策覆盖将要困难得多。根据经验，高且受人尊敬的代码覆盖率应为 100% 函数、90% 行或 75%\
  \ 条件覆盖。\n\n特别值得讨论代码覆盖率与遗留代码的问题。有时，你的 API 必须依赖大量完全没有测试覆盖的旧代码。Michael Feathers 将遗留代码定义为没有测试的代码（Feathers,\
  \ 2004）。在这些情况下，对遗留代码实施与新代码相同的代码覆盖率目标是不现实的。但是，你至少可以建立一些基础测试，然后强制任何提交（checkin）都不应降低当前的覆盖率水平。这意味着这意味着对遗留代码的任何新更改都应该伴随测试。对每次提交强制执行这一要求有时是困难的（因为你必须带有更改构建软件并运行所有测试以判断是否应该接受），因此另一种实现此点的合理方法是记录库的上一个版本的遗留代码覆盖率，并确保发布时新版本的覆盖率等于或超过此阈值。这种方法为处理遗留代码提供了一种务实的方法，并让你随着时间的推移将代码覆盖率提高到可以接受的水平。\n\
  \n本质上，API 中不同的模块或库可能有不同的代码覆盖率目标。过去，我通过更新覆盖率报告来显示每个模块的目标并使用颜色方案指示是否达到了目标，从而明确了这一点。\n\
  \n### 缺陷跟踪\n\n缺陷跟踪系统是一种在数据库中跟踪软件项目缺陷（通常还有建议）的应用程序。一个与你的开发和质量流程良好匹配的有效缺陷跟踪系统是无价之宝。相反，一个难以使用且无法充分反映软件状态的糟糕缺陷跟踪系统会成为项目的负担。\n\
  \n大多数缺陷跟踪系统支持对传入缺陷进行分类（triage）：即设置缺陷的优先级（可能的严重程度）并将其分配给特定的开发者。标准做法还允许对系统中的缺陷定义过滤器，以便创建针对性的缺陷列表，例如打开的崩溃列表或分配给特定开发者的列表。与此相关，某些缺陷跟踪系统还会提供报告功能，通常具有显示图表和饼图的能力。这对于生成软件质量指标至关重要，结合代码覆盖率结果，可以更有效地引导工作。另一个重要功能是将你的版本控制系统与缺陷跟踪系统集成（例如，当你提交修复这些缺陷的代码时，缺陷可以自动标记为已修复或关闭）。\n\
  \n同样值得注意的是缺陷跟踪系统不是什么。首先，它不是故障工单或问题跟踪系统。这些是用于接收用户反馈的客户支持系统，其中许多与软件问题无关。由客户支持发现的有效软件问题将进入缺陷跟踪系统并分配给工程师进行处理。缺陷跟踪系统通常也不是任务或项目管理工具：即用于跟踪任务和计划工作的系统。然而，某些缺陷跟踪系统供应商确实提供互补产品，利用底层基础设施提供项目管理工具。\n\
  \n市场上上有几十种缺陷跟踪系统，最适合你项目的系统取决于几个因素：\n\n\n\n\n\n-   你可能倾向于使用开源解决方案，以便在必要时能够对其进行自定义。例如，许多大型开源项目都使用\
  \ Bugzilla，包括 Mozilla、Gnome、Apache 和 Linux 内核（参阅 [`www.bugzilla.org/`](https://www.bugzilla.org/)）。\n\
  \n-   此外还有许多商业软件包提供了优秀且灵活的 bug 跟踪功能，并附带技术支持以及可选的安全托管服务。Atlassian 的 `JIRA` 就是其中一种流行的解决方案，它提供了一个极具定制且健壮的\
  \ bug 跟踪系统。Atlassian 还提供了相关的 GreenHopper 项目管理系统，用于敏捷开发项目，它可以让你管理用户故事待办列表、任务拆分以及冲刺/迭代规划（参阅\
  \ [`www.atlassian.com/`](https://www.atlassian.com/)）。\n\n-   或者，你可能决定采用通用的项目托管解决方案，这类方案提供版本控制功能、磁盘存储配额、讨论论坛和集成\
  \ bug 跟踪系统。GitHub 是此类类别中的热门选项之一（参阅 [`github.com/`](https://github.com/)）。\n\n##\
  \ 持续构建系统\n\n持续构建系统是一个自动化过程，每当新更改提交到你的版本控制系统时，它就会重新构建你的软件。这通常被称为持续集成（CI）和持续交付（CD）。对于一个拥有多个工程师的大型项目，持续构建系统应该是你优先部署的工具之一，且独立于任何测试需求。它能让你了解构建的当前状态，并在构建失败发生时立即识别出来。它对于跨平台开发也极具价值，因为即使是对一个平台经过最充分测试的更改，也可能导致另一个平台的构建失败。市场上有多多种持续构建选项，包括：\n\
  \n1.  `Jenkins` ([`www.jenkins.io/`](https://www.jenkins.io/)):一个用于构建、测试和部署软件项目的开源自动化服务器。\n\
  \n2.  `TeamCity` ([`www.jetbrains.com/teamcity/`](https://www.jetbrains.com/teamcity/)):一个来自\
  \ JetBrains 的分布式构建管理和 CI 服务器。\n\n3.  `CircleCI` ([`circleci.com/`](https://circleci.com/)):一个可以用于实施\
  \ DevOps 实践的 CI/CD 平台。\n\n4.  `Travis CI` ([`travis-ci.com/`](https://travis-ci.com/)):一个托管型\
  \ CI 服务，可以在 GitHub 等流行的源代码托管服务上构建和测试软件。\n\n然而，我们这里的重点是自动化测试。持续构建系统对测试的益处在于，它还提供了一种定期运行自动化测试的机制，从而快速发现测试中断。也就是说，自动化构建的结果可能处于四种状态之一：进行中、通过、构建失败或测试失败。\n\
  \n随着你测试套件的不断扩大，运行所有测试所需也会随之增加。获取快速构建反馈至关重要，因此如果你的测试运行开始需要几个小时才能完成，那么你就应该考虑一些测试优化工作。实现此点的一种方法是将测试分为不同的类别，并仅作为持续构建的一部分运行快速类别的测试。另一种解决方案是设置多个自动化构建：一个只构建软件，另一个在构建软件后运行所有测试。这让工程师能够快速接收关于构建失败的反馈，同时确保尽可能频繁地运行完整的测试套件。\n\
  \n# 13: Objective-C 与 Swift\n\n## 摘要\n\nObjective-C 被设计为向 C 编程语言添加面向对象概念的替代方法。该语言还有一种变体称为\
  \ Objective-C++，它结合了 C++ 和 Objective-C 的语法。本章首先回顾 C++ 和 Objective-C 之间接口设计的差异。然后展示\
  \ C++ 和 Objective-C++ 代码如何进行有效的互操作，包括如何在 C++ 应用程序接口 (API) 后端使用 Objective-C，以及如何在\
  \ Objective-C API 后端使用 C++。最后，Objective-C 语言已被 Swift 编程语言取代，因此本章也涵盖了如何从 Swift API\
  \ 后调用 C++ 代码。\n\n### 关键字\n\n分类（Category）；数据隐藏（Data hiding）；Foundation；实现（Implementation）；接口（Interface）；Objective-C；可选（Optional）；Swift\n\
  \n到本章为止，我一直关注的是应用程序接口（API）设计的通用方面，这些方面可以适用于任何 C++ 项目。在涵盖了标准的 API 设计流程后，书中的剩余章节将处理更具专门的话题，例如与其他编程语言集成以及通过插件实现扩展性。虽然并不是所有的\
  \ API 都需要关注这些主题，但我认为一本关于 C++ API 设计的著作应该包含这些高级主题。在本章中，我将重点关注与 Objective-C 和 Swift\
  \ 编程语言的互操作性。\n\nObjective-C 语言最初由 Brad Cox 和 Tom Love 在 20 世纪 80 年代开发。该语言被 NeXT\
  \ 公司采用，该公司是 Steve Jobs 在 1985 年离开 Apple 后创立的。在 1996 年被 Apple 收购 之前，NeXT 最终获得了 Objective-C\
  \ 的商标。从那时起，Objective-C 成为开发 iOS 和 macOS 应用的标准编程语言，至少直到 2014 年 Swift 的发布。\n\nObjective-C\
  \ 本质上是向 C 编程语言添加面向对象特征的替代方法，受到 Smalltalk 语言消息传递特征的影响。然而，该语言还有一种名为 Objective-C++\
  \ 的变体，结合了 C++ 和 Objective-C 的语法。因此，这两种语言紧密相关，鉴于该语言作为生产 App Store 应用的突出地位，我认为研究 C++\
  \ API 如何与 Objective-C 互操作是有价值的。\n\n我将首先对比对比 C++ 和 Objective-C 的语言特性。这并不是为了详尽的回顾，但足够我们讨论\
  \ API 的影响。在设定背景后，我将介绍如何将 Objective-C 代码隐藏在纯 C++ API 之后。然后我将介绍如何将 C++ API 暴露给 Objective-C。最后，我将介绍如何通过\
  \ Objective-C 将 C++ API 暴露给 Swift，这是苹果平台应用开发的最新编程语言。\n\n## C++ 与 Objective-C 的接口设计\n\
  \n由于 C++ 和 Objective-C 都基于 C，因此它们共享许多共同概念，例如头文件、预处理器指令、类型定义和自由函数调用。Objective-C 的头文件遵循使用\
  \ `.h` 后缀的 C 习惯，而实现文件对于 Objective-C 使用 `.m`，对于 Objective-C++ 则使用 `.mm`。\n\n到此时，你已经熟悉\
  \ C++ 的面向对象概念，但为了对比，让我们考虑一个简单的类，它持有姓名的组件，并带有一个返回格式化名称的函数，作为大型地址簿库的一部分：\n\n![image](img/u13-01-9780443222191.jpg)\n\
  \n等效的 Objective-C API 可能如下：\n\n![image](img/u13-02-9780443222191.jpg)\n\n你会注意到 Objective-C\
  \ 与 C++ 在定义接口方面的一些不同之处，例如：\n\n1.  类在头文件中位于 `@interface` 和 `@end` 关键字之间声明（也可以也可以在\
  \ `.m` 文件中声明用于接口的私有扩展，我们稍后会讨论）。还要注意，Objective-C 类通常继承自 `NSObject` 类或其子类。\n\n\n\n\
  \n\n* 2. Objective-C 提供了属性（property）的概念来提供数据的访问。编译器会自动为这些属性生成 getter 和 setter 函数，这与\
  \ C++ 不同，在 C++ 中你必须手动编写这些函数。我们也可以定义特定的 `getGivenName` 和 `setGivenName` 函数，但在 Objective-C\
  \ 中对数据成员使用属性更符合习惯（idiomatic）。\n\n* 3. Objective-C 没有命名空间（namespaces）的概念。因此，你必须确保所有的公共符号都具有唯一的前缀；否则它们可能会与另一个系统或第三方库冲突。Objective-C\
  \ 的惯例是使用两个三个大写字母，例如 Core Animation 使用 `CA`，UIKit 使用 `UI`，核心 Foundation 类使用 `NS`。（`NS`\
  \ 前缀源于 NeXTSTEP 操作系统的名称。）\n\n* 4. Objective-C 中的所有对象都是作为指针（或常量指针）创建和传递的，例如 `NSString\
  \ *`。Objective-C 对象始终分配在堆（heap）上，永远不会静态分配在栈（stack）上。Objective-C 语言中也没有引用（references）的概念。\n\
  \n* 5. 虽然 Objective-C 支持标准的 C `#include` 预处理器指令，但它添加了 `#import` 选项。它的行为类似于 `#include`，不同之处在于它不会重复包含同一个文件。这意味着你不需要在\
  \ Objective-C 头文件的顶部添加包含守卫符（include guards）。\n\n## Objective-C 中的数据隐藏\n\n你可能在之前的示例中注意到，C++\
  \ 代码使用了 `pimpl` 范式来隐藏其数据成员，但对于 Objective-C 版本来说并不是必要的。值得花一点时间看看如何在 Objective-C 中实现数据隐藏，因为该语言在这方面提供了与\
  \ C++ 不同的特性。\n\n首先，Objective-C 中属性的使用可以简化对数据成员的访问，因为你可以在头文件中声明属性，但实际的数据成员定义在 `.m`\
  \ 文件中。这有效地实现了我们试图通过 C++ 代码的 `pimpl` 范式所做的事情：将数据成员定义从头文件中移动到实现文件中。例如，继续我们之前的 `ADRPerson`\
  \ 示例，这里是相关的 `.m` 文件可能的内容：\n\n![image](img/u13-03-9780443222191.jpg) 也可以将这些数据成员定义放在头文件的\
  \ `@interface` 声明内部，你还可以使用 Objective-C 的访问级别关键字（如 `@private`）将它们从公共 API 中隐藏（即，你可以让类在形式上类似于\
  \ C++ 版本）。然而，在实现文件中隐藏这些定义是一种优越得多的方法，并且应该被优先考虑。\n\nObjective-C 的另一个允许你从公共 API 隐藏信息的方面是基于称为“类别”（categories）的特性。可以使用类别为任何类添加新方法，即使你无法访问其源代码，也可以使用以下语法：\n\
  \n![image](img/u13-04-9780443222191.jpg)\n\n你可以定义多个类别来扩展任何给定的对象，每个类别在括号内都有一个唯一的名称，例如上一个示例中的\
  \ `CategoryName`。类的一个限制之一是你可以不能向类添加新属性，只能添加函数（即你不能在初始声明后更改对象的大小）。\n\n虽然类别可以让你为系统和第三方对象添加自己的特化实现的强大功能，但该特性的一个变体被称为“类扩展”（class\
  \ extensions），它与我们这里关注的数据隐藏更为相关。类扩展只能添加到你拥有源代码的类中，结果是它允许你在添加新函数之外向类添加新属性。其语法与声明类别类似，不同之处是你不需要提供名称。由于由于原因，类扩展有时也被匿名类别。\n\
  \n例如，让我们再次查看我们的 `adrperson.m` 实现文件，并包含一个类扩展，为 `ADRPerson` 类添加一个新的数据成员和函数，且完全从头文件中隐藏：\n\
  \n![image](img/u13-05-9780443222191.jpg)\n\n在这个示例中，我们使用类扩展为类添加了新的 `cachedFullName`\
  \ 数据成员以及新的 `generateFullName` 函数。它们在头文件的公共 API 声明中都是完全隐藏的。\n\n上一个示例的局限性是，隐藏的数据和函数仅在声明它们的那个\
  \ `.m` 文件中可见。然而，如果你需要在另一个 `.m` 文件中引用这些隐藏成员，可以通过将声明移动到私有头文件中来实现，例如 `adrperson_private.h`，该文件可以被其他源文件包含，但不会与你\
  \ API 的公共头文件一起分发。例如，私有头文件可能如下：\n\n![image](img/u13-06-9780443222191.jpg)\n\n然后 `.m`\
  \ 文件将看起来像这样：\n\n![image](img/u13-07-9780443222191.jpg)\n\n## C++ 后的 Objective-C\n\
  \n在我介绍了一些 Objective-C 的基础概念之后，让我们讨论 C++ 后后的 Objective-C 的各种方式。\n\n一种简单的方法是维护纯 C++\
  \ API 并在实现中使用 Objective-C。这是因为两种语言都使用头文件和 Objective-C 编译器。\n\n有几个你可能想这样做的原因。一个可能是你想让你的库利用原生功能。另一个可能是为了与原生平台集成，例如\
  \ `NSLog`、`os_log` 和 `os_signpost`。\n\n让我们看一个例子。以下头文件是纯 C++ 提供一个全局唯一标识符（GUID），如\
  \ `3a446875-61a5-42af-509c-ca0067405be`。通过在头文件中使用私有数据成员来保持此示例简单，尽管可以使用 `pimpl` 范式：\n\
  \n![image](img/u13-08-9780443222191.jpg) 我们可能决定使用 Objective-C 的 `NSUUID` 来生成 GUID\
  \ 字符串。在这种情况下，我们可以创建一个 `.mm` 文件（而不是 `.cpp`）并使用 Objective-C 编译器编译。`.mm` 文件可能如下：\n\n\
  ![image](img/u13-09-9780443222191.jpg)\n\n该文件中的大部分代码都是标准 C++，除了 `#import` 语句和 `Reset()`\
  \ 函数的内容。后者使用了来自 Objective-C Foundation 库的 `NSUUID` 对象并将 `NSString *` 表示转换为 `std::string`。这样，使用\
  \ Objective-C 的事实就不会泄露到头文件中。然而，你的客户现在需要在其项目中链接 Objective-C 运行时和 Foundation 框架。\n\
  \n下面的命令行显示了如何编译和链接一个简单的 `main.mm` Objective-C++ 程序。引入 Objective-C 运行时的 `-lobjc`\
  \ 标志在某些编译器可能是可选的：\n\n![image](img/u13-10-9780443222191.jpg)\n\n假设你想保持灵活性，让没有访问 Objective-C++\
  \ 构建环境的客户可以使用普通的 C++ 编译器编译你的项目。我们可以通过检查大多数 Objective-C 编译器设置的 `__OBJC__` 编译器定义来实现这一点（gcc\
  \ 和 clang 都设置了这个定义）：\n\n![image](img/u13-11-9780443222191.jpg)\n\n\n\n\n\nObjective-C\
  \ 和 C++ 的这种混合之所以可行，是因为 Objective-C++ 本质上只是在同一个文件中将这两种语法结合在一起。然而，它们本质上仍然是两种不同的语言，因此你混合每种语言特性的程度是有的。以下列表对你在\
  \ Objective-C++ 中可以做和不能做的事情提供了一些指导：\n\n- 内存管理分别由每种语言原生处理。例如，C++ 使用其 `new` 和 `delete`\
  \ 语法，而 Objective-C 使用 `retain` 和 `release`，或者在现今，Objective-C 更有可能使用自动引用计数（ARC）来消除手动管理引用计数的需求。\n\
  - C++ 类不能继承自 Objective-C 类，反之亦然。此外，C++ 支持多继承，而 Objective-C 使用单继承；而且尽管它们有相似的成员访问级别概念，但使用的语法不同（例如，C++\
  \ 中的 `private` 对应 Objective-C 中的 `@private`）。\n- 你可以将 C++ 对象作为 Objective-C 函数的参数传递，反之亦然。例如，你可以将\
  \ `std::string` 传递给 Objective-C 函数，也可以将 `NSString *` 传递给 C++ 函数。Objective-C 对象始终创建在堆上，并以指针的形式传递。\n\
  - C++ 对象可以持有 Objective-C 对象，因为它们本质上只是指针。但只有当 C++ 对象具有默认构造函数且没有虚函数时，Objective-C 才能将其作为数据成员持有\
  \ C++ 对象。\n- C++ 使用值为 `true` 和 `false` 的类型 `bool`，而 Objective-C 使用值为 `YES` 和 `NO`\
  \ 的 `BOOL` 类型。同样，C++ 使用 `nullptr`，而 Objective-C 使用 `nil`。由于这些后者的定义都略有不同，因此将正确的类型与正确的语言配对是一个良好的习惯。\n\
  - C++ 命名空间不能与 Objective-C 混合（即 Objective-C 声明不能出现在 C++ 命名空间内部，也不能包含对命名空间的声明）。\n\n\
  ## Objective-C API 后层的 C++\n\n上一节考虑了如何在隐藏在 C++ API 之后的同时使用 Objective-C。在这一节中，我将介绍你如何利用\
  \ Objective-C API 后隐藏的 C++ API。你可能想这样做，例如如果你想为在 Apple 平台上构建应用程序提供更标准的 API 体验。\n\n\
  通常情况下，使用这种方法时，你会在头文件中只使用 Objective-C，而不混合 C++ 语法。这样你就不需要强迫你的 Objective-C 客户端也理解\
  \ C++ 代码。本质上，使用 Objective-C++ 允许你在提供纯 Objective-C API 的同时，在你的实现文件（`.mm`）中混合 Objective-C\
  \ 和 C++。\n\n让我们回到之前的地址通讯录示例。纯 Objective-C 版本的 API 看起来如下：\n\n![image](img/u13-12-9780443222191.jpg)\n\
  \n现在，假设我们想使用我们的 C++ 库来实现这个 Objective-C API。在这种情况下，Objective-C 接口将是底层 C++ API 之上的一个薄层。因此，实现部分将存储\
  \ C++ 对象的实例，并且所有的 Objective-C getter 和 setter 都将调用 C++ 接口中对应的方法：\n\n![image](img/u13-13-9780443222191.jpg)\n\
  \n我们在 setter 函数中显式检查了 `nil NSString` 指针；否则，我们的代码在尝试将 `NSString *` 转换为 `std::string`\
  \ 时会崩溃。`[nil UTF8String]` 没有问题，因为 Objective-C 特别允许向 nil 对象发送消息并返回 nil 结果。\n\n本质上，Objective-C\
  \ 层是一个外观模式（facade pattern），我们将一个 API 隐藏在另一个 之后。在这种情况下，我们还利用语言障碍进一步隐藏实现 API 的细节：如果\
  \ Objective-C 开发者想要深入研究我们的实现细节，他们将不得不理解 C++ 代码。此外，我们通过使用类扩展（class extension）向 Objective-C\
  \ API 隐藏了 `address::Person` C++ 对象的存在。\n\n你可能在上一个示例中注意到，我没有创建一个 `init` 函数（等同于 C++\
  \ 构造函数）来初始化我们的 `address::Person` C++ 对象。相反，我依靠 Objective-C 编译器的行为将所有成员变量自动初始化为 nil\
  \ 或 0，或者对于 C++ 对象，调用其默认构造函数。\n\n然而，我们可以扩展这个示例来演示使用显式的 `init` 和 `dealloc` 函数来分配和释放任何必要的资源。在这个示例中，我将切换到堆上分配\
  \ `address::Person` 对象，以展示当 Objective-C 对象销毁时如何删除 C++ 对象：\n\n![image](img/u13-14-9780443222191.jpg)\n\
  \n## Swift API 后层的 C++\n\nApple 在 2014 年引入了 Swift 编程语言作为 Objective-C 的替代。从那时起，Swift\
  \ 作为 iOS 和 macOS 等平台的开发语言日益流行。与 Objective-C 的互操作性是 Swift 的核心设计原则之一。因此，这也为 Swift\
  \ 和 C++ 之间的互操作性提供了路径。\n\n事实上，如果你已经为你的 C++ API 有了一个 Objective-C 层，那么你已经完成了大部分工作。例如，参考上一节的\
  \ Objective-C 示例，你可以直接从 Swift 访问它，如下：\n\n![image](img/u13-15-9780443222191.jpg)\n\
  \n然而，你可以采取几种措施来增强你的 Objective-C API，使其在从 Swift 访问时更加地道（idiomatic）。我将在本章剩余部分讨论其中许多。\n\
  \nSwift 引入了可选（optionals）的概念，类似于 `std::optional`。可以通过在类型名后添加 `?` 后缀将其定义为可选。这是因为 Objective-C\
  \ 中的所有对象都是指针，但编译器没有足够的信息来判断 Swift 是否可以持有。\n\nSwift 中的可选概念对应于 Objective-C 中的可空性（nullability，即使用\
  \ `_Nullable` 和 `_Nonnull` 注解），所示：\n\n![image](img/u13-16-9780443222191.jpg)\n\n\
  在这个示例中，`name` 参数被定义为 `_Nonnull`，它将映射到 Swift 中的非可选 `String`；而返回类型被定义为 `_Nullable`，它映射到\
  \ Swift 中的可选 `ADRPerson?`。在语义级别，这表示我们需要一个字符串来操作，但可能找不到与该名称匹配的 `ADRPerson` 对象，因此结果可能是\
  \ nil。\n\n与其注解 Objective-C API 中的每种数据类型，不如为整个头文件声明一个默认值，然后只对不同于默认值的情况提供注解。例如，你可以使用\
  \ `NS_ASSUME_NONNULL_BEGIN` 和 `NS_ASSUME_NONNULL_END` 宏来声明这对之间所有的 Objective-C 对象都应该被假设为非空：\n\
  \n![image](img/u13-17-9780443222191.jpg)\n\n在这种情况下，所有的 `NSString *` Objective-C\
  \ 对象将映射到 Swift 中的非可选 `String` 类型。我们随后可以使用 `_Nullable` 关键字来注解我们确实想要支持可选的声明。\n\nSwift\
  \ 的另一个特性是支持命名参数。也就是说，可以为 Swift 函数的每个参数提供一个名称，并调用者在调用函数时指定该名称。例如，给定这个 Swift 函数签名：\n\
  \n![image](img/u13-18-9780443222191.jpg)\n\n\n\n\n你可以编写代码来调用此函数：\n\n![image](img/u13-19-9780443222191.jpg)\n\
  \nObjective-C 使用一种称为交错参数（interleaved parameters）的方案，其中函数名与参数交错在一起。因此，之前的 Swift 函数在\
  \ Objective-C 语法中可能表示为：\n\n![image](img/u13-20-9780443222191.jpg)\n\n由于这些不同的参数方案，通常需要提供额外的上下文，以说明如何将\
  \ Objective-C 中的交错名称映射到 Swift 中的命名参数。这可以通过在 Objective-C 函数声明的末尾使用 `NS_SWIFT_NAME`\
  \ 宏来实现。以下是一些示例：\n\n![image](img/u13-21-9780443222191.jpg)\n\n在第一个示例中，我将 Objective-C\
  \ 代码中 `findGiven` 的交错函数名和参数名转换为 Swift 形式：仅使用 `find` 作为函数名，并使用 `given` 作为初始命名参数。在第二个示例中，我将\
  \ Objective-C 函数 `getFullName` 重命名为 Swift 中的 `fullName`，使其更符合语言习惯。\n\n在本节中我涵盖的最后一个主题是控制\
  \ Objective-C 类型如何桥接到 Swift 类型。默认情况下，Objective-C 中的 `NSString *` 将被桥接到 Swift 中的\
  \ `String`，而 `id` 将桥接到 `Any`。然而，Objective-C 提供的各种容器类可以包含任何派自 `NSObject` 的对象。因此，与\
  \ C++ 不同（在 C++ 中你需要声明向量元素的类型，例如 `std::vector<std::string>`），在 Objective-C 中你只需要声明你正在使用\
  \ `NSArray *`。\n\n这意味着对于桥接到 Swift 类型来说，容器元素的类型默认无法被推断，因此它们将被假设为 `Any` 或 `AnyHashable`。表\
  \ 13.1 显示了 Objective-C 类型到 Swift 的默认映射（这些映射在 Swift 3 之前是不同的，但我在这里不考虑它了，因为 Swift\
  \ 3 是在 2016 年发布的）。\n\n你可以为你的 Objective-C 数据类型提供注解，以指示它们所持有的对象类型。这些信息随后将用于桥接到 Swift\
  \ 中更具体的类型。通过在角括号中提供类型信息来实现，如表 13.2 所示。\n\n总结本节内容，你已经了解了如何通过 Objective-C API 来让 C++\
  \ API 在 Swift 中可用，以及如何将 Objective-C 类型桥接到 Swift。\n\n\n\n\n### 1. **跨平台**。脚本语言是解释型的，因此它们执行纯\
  \ ASCII 源代码或与平台无关的字节码。它们通常还会提供自己的模块来与特定平台的特性（如文件系统）建立接口。因此，为脚本语言编写的代码可以在多个平台上无需修改即可运行。这对于专有项目来说也可以被视为一个缺点，因为脚本代码通常必须以源码的形式分发。\n\
  \n### 2. **更快的开发**。如果你对 C++`program` 进行了更改，必须重新编译并链接代码。对于大型系统，这可能是一项耗时的操作，并可能在工程师等待测试更改时阻碍其生产力。在脚本语言中，你只需要编辑源代码然后运行它；没有编译和链接阶段。这允许你快速地进行原型设计并测试新更改，通常会带来更高的工程师效率和项目速度。\n\
  \n### 3. **更少的代码**。与 `C++` 相比，特定的问题通常可以用更高级的脚本语言用更少的代码解决。脚本语言不需要显式的内存管理，它们拥有的标准库通常比\
  \ `C++` 标准库大得多，而且它们通常会在后台处理引用计数等复杂概念。例如，接以下单行 Ruby 代码将取一个字符串并返回该字符串中所有唯一字母的字母排序列表。在\
  \ `C++` 中实现这一功能需要多得的代码：\n\n![image](img/u14-01-9780443222191.jpg)\n\n### 4. **基于脚本的应用程序**。脚本语言的传统观点是，你将其用于小型命令行任务，但必须使用\
  \ `C++` 等语言编写任何大型应用程序以获得最高效率。然而，另一种观点是，你可以用 `C++` 编写核心性能敏感的例程，为它们创建脚本绑定，然后用脚本语言编写应用程序。在模型-视图-控制器（MVC）术语中，模型（Model）以及可能的视图（View）是用\
  \ `C++` 编写的，而控制器（Controller）使用脚本语言实现。关键洞察是，你不需要一种超快的编译型语言来管理低频率的用户输入。\n\n### 5.\
  \ 在 Pixar，我们将内部的动画工具集重写为一个基于 Python 的主应用程序，该程序调用一组广泛且高效的模型和视图 `C++` API。这带给了我们我在这里列出的所有优势，例如为许多应用程序逻辑的更改消除了编译-链接阶段，同时为我们的艺术家提供了一个交互式的\
  \ 3D 动画系统。\n\n### 6. **支持专家级用户**。在末端用户应用程序中添加脚本语言可以允许高级用户通过编写宏来执行重复性任务或未通过 GUI 暴露的任务，从而自定义应用程序的功能。这可以在不牺牲新手用户软件易用性的情况下实现，新手用户将仅通过\
  \ GUI 与应用程序进行交互。\n\n### 7. **可扩展性**。除了让专家用户访问底层功能外，脚本接口还可以用于让他们通过插件接口向应用程序添加完全新的功能。因此，应用程序的开发者不再需要负责解决每个用户的问题。相反，用户拥有了解决自己问题的能力。例如，Firefox\
  \ 浏览器允许使用 `JavaScript` 作为其嵌入脚本语言来创建新的扩展。\n\n### 8. **为了可测试性的脚本**。能够在脚本语言中编写代码的一个极具价值的副作用是，你可以使用该语言编写自动化测试。这是一个优势，因为你可以让你的质量保证（QA）团队也能编写自动化测试。通常（尽管不是绝对），QA\
  \ 工程师不会编写 `C++` 代码。然而，有很多熟练的 QA 工程师可以编写脚本语言代码。让 QA 团队参与编写自动化测试可以让他们在较低层面做出贡献，并对测试工作应该涵盖的潜在问题有更深入的了解。\n\
  \n### 9. **表达能力**。语言学领域将语言相对性原理（也称为萨皮尔-沃尔夫假说）定义为人们的思想和行为受到其语言的影响。当应用于计算机科学领域时，这意味着编程语言的表达能力、灵性和易用性可能会影响你可以构想的解决方案类型。这是因为你不需要被内存管理或静态类型数据表示等低级问题所分心。这显然比之前的技术论点更具定性和主观性，但值得思考。\n\
  \n### 语言兼容性问题\n\n在脚本语言中暴露（expose） `C++` API 时，需要注意的一个重要问题是，`C++` 的模式和惯用法不会直接映射到脚本语言的模式。因此，将\
  \ `C++` API 直接翻译成脚本语言可能会产生一个在该语言中感觉不自然或不符合习惯的脚本模块。例如：\n\n#### 1. **命名规范**。`C++`\
  \ 函数通常使用大驼峰或小驼峰命名法编写，例如 `GetName()` 或 `getName()`。然而，Python 的约定（定义在 `PEP 8` 中）是使用蛇形命名，例如\
  \ `get_name()`。\n\n#### 2. **Getter 和 Setter**。在本书中，我主张类中类直接暴露数据成员，而应该提供 getter/setter\
  \ 方法来访问这些成员。然而，许多脚本语言允许你使用访问成员的语法，同时通过 getter 和 setter 方法进行。事实上，在 Ruby 中，这是从类外部访问成员的唯一方式。结果是，与其使用如下\
  \ `C++` 风格的代码：\n\n![image](img/u14-02-9780443222191.jpg)\n\n你只需要编写这样的代码，它仍然使用了 getter\
  \ 和 setter 方法：\n\n![image](img/u14-03-9780443222191.jpg)\n\n#### 3. **迭代器**。大多数脚本语言支持迭代器的通用概念来遍历序列中的元素。然而，该概念的实现通常不会与\
  \ `C++` 标准库的实现良好协调。例如，`C++` 有五类迭代器（前向、双向、随机访问、输入和输出），而 Python 只有一种迭代器类别（前向）。因此，在脚本语言中使\
  \ `C++` 对象可迭代需要特定的处理以适应该语言的语义，例如在 Python 中添加 `__iter__()` 方法。\n\n#### 4. **运算符**。你已经知道\
  \ `C++` 支持多种运算符，例如 `operator+`、`operator+=` 和 `operator[]`。这些通常可以直接翻译成脚本语言的等效语法，例如将\
  \ `C++` 的流运算符<<暴露为 Ruby 中的 `to_s()` 方法（返回对象的字符串表示）。然而，目标语言可能支持 `C++` 不支持的其他运算符，例如\
  \ Ruby 的幂运算符 (`**`) 以及其返回除法商和余数的运算符 (`divmod`)。\n\n\n\n\n\n## 4. **容器**。C++ 标准库提供了容器类，如\
  \ `std::vector`、`std::set` 和 `std::map`。这些是静态类型类模板，只能包含相同类型的对象。相比之下，许多脚本语言是动态类型的，并支持包含不同类型元素的容器。在脚本语言中，使用这些灵活的类型来传递数据要常见得多。例如，一个接受多个非\
  \ constconst 引用参数的 C++ 方法，在脚本语言中可能通过返回元组（tuple）的方法表示得更好。例如：\n\n5. ![image](img/u14-04-9780443222191.jpg)\n\
  \n这一切意味着，创建一个良好的脚本绑定（binding）通常是一个需要一定程度手动调优的过程。尝试全自动绑定的技术通常生成的 API 在脚本语言中感觉并不自然。例如，`PyObjC`\
  \ 工具为 Python 中的 Objective-C 对象提供了桥接，但它在 Python 中会导致臃肿的结构，例如名为 `setValue_()` 的方法。相比之下，一种允许你手动构建函数在脚本中暴露方式的技术将让你产出质量更高的结果。\n\
  \n### 跨越语言障碍\n\n语言障碍是指 C++ 与脚本语言相汇的边界。对象的脚本绑定将处理脚本语言中的方法调用转发到相关的 C++ 代码中。然而，C++\
  \ 代码调用脚本语言的情况通常不会默认发生。这是因为一个没有专门设计为与脚本语言互操作而设计的 C++ API 并不知道自己正运行在脚本环境中。\n\n例如，考虑一个具有在\
  \ Python 中被重写（overridden）的虚拟方法的 C++ 类。C++ 代码并不知道 Python 重写了它的其中一个虚拟方法。这是合理的，因为 C++\
  \ 的 `vtable` 是在编译时静态创建的，无法适应 Python 在运行时添加方法的动态能力。某些绑定技术提供了额外的功能来使这种跨语言的多态性生效。我将在本章节后面的部分讨论如何为\
  \ `Boost Python` 和 `SWIG` 实现这一点。\n\n另一个需要注意的问题是 C++ 代码是否使用了内部事件或通知系统。如果是这种情况，则需要建立额外的机制，将任何\
  \ C++ 触发的事件跨越语言边界转发到脚本代码。例如，`Qt` 和 `Boost` 提供了信号/槽系统，其中 C++ 代码可以在另一个 C++ 对象状态改变时注册接收通知。然而，允许脚本接收这些事件将需要你编写显式代码来拦截\
  \ C++ 事件并将它们跨边界发送到脚本对象。\n\n最后，异常（exceptions）是 C++ 代码可能需要与脚本代码通信的另一种情况。例如，未捕获的 C++\
  \ 异常必须在语言边界处捕获，然后翻译成脚本语言的本地异常类型。\n\n## 脚本绑定技术\n\n有多种技术可以用于生成封装器（wrapper），允许脚本语言调用你的\
  \ C++ 代码。每种技术都有其特定的优缺点。有些是与语言无关的技术，支持许多脚本语言（如 `COM` 或 `CORBA`），有些是专门针对 C/C++ 的，但提供了创建到许多语言绑定的支持（如\
  \ `SWIG`），有些为单一语言提供 C++ 绑定（如 `Boost Python`），而另一些则专注于针对特定 API 的 C++ 绑定（例如用于 `Open\
  \ Inventor` C++ 工具包的 `Pivy Python` 绑定）。\n\n我将在这里列出这些技术中的几种，然后在章节的剩余部分，我将详细详细介绍其中两种。我选择关注可移植但\
  \ C++ 特有的解决方案，而不是考虑更通用、更重量级的进程间通信模型（如 `COM` 或 `CORBA`）。为了提供更大的实用性，我将查看一种允许你通过程序定义脚本绑定的技术（`Boost\
  \ Python`），以及另一种使用接口定义文件生成绑定代码（`SWIG`）。\n\n任何脚本绑定技术本质上都是建立在 `Adapter`（适配器）设计模式之上的。这意味着从一个\
  \ API 到另一个 API 的一对一映射，同时将数据类型翻译成它们最合适的原生形式，并可能使用更符合习惯的命名约定。意识到这一事实意味着你也应该意识到诸如 `Proxy`（代理）和\
  \ `Adapter` 等 API 封装设计模式所面临的标准问题。主要关注的问题是随时间推移保持两个 API 同步。正如你看到的，`Boost Python`\
  \ 和 `SWIG` 都要求你在演进 C++ API 时保持冗余文件的同步，例如在 `Boost` 的情况下是额外的 C++ 文件，在 `SWIG` 的情况下是独立的接口文件。这通常证明是支持脚本\
  \ API 时最大的维护成本。\n\n### Boost Python\n\n`Boost Python`（也写为 `boost::python` 或 `Boost.Python`）是一个\
  \ C++ 库，允许 C++ API 与 Python 互操作。它是优秀的 Boost 库的一部分，可在 [`www.boost.org/`](https://www.boost.org/)\
  \ 获取。通过 `Boost Python`，你可以在 C++ 代码中编程创建绑定，并将绑定与 Python 和 `Boost Python` 库链接。这产生了一个可以直接导入到\
  \ Python 的动态库。\n\nBoost Python 在封装 C++ API 方面包含了这些功能和特性：\n\n1. C++ 引用和指针。\n2. C++\
  \ 异常到 Python。\n3. C++ 默认参数和 Python 关键字参数。\n4. 在 C++ 中操作 Python 对象。\n5. 将 C++ 迭代器导出为\
  \ Python 迭代器。\n6. Python 文档字符串（strings）。\n7. 全局注册的类型转换。\n\n### 简化封装器和接口生成器\n\n`SWIG`\
  \ 是一个开源工具，可用于各种高级语言创建 C 或 C++ 接口的绑定。支持的语言包括脚本语言 Perl、PHP、Python、Tcl 和 Ruby，以及非脚本语言如\
  \ C#、Common Lisp、Java、Lua、Modula-3、OCAML、Octave 和 R。\n\n`SWIG` 的核心设计概念是接口文件，通常赋予\
  \ `.i` 扩展名。该文件用于使用 C/C++ 作为定义绑定的语法指定指定模块的通用绑定。SWIG 接口文件的通用格式如下。\n\n![image](img/u14-05-9780443222191.jpg)\n\
  \n`SWIG` 程序随后可以读取此接口文件并为特定语言生成绑定。这些绑定随后被编译为共享库，可以由脚本语言加载。有关 `SWIG` 的更多信息，请参见 [`www.swig.org/`](https://www.swig.org/)。\n\
  \n### Python-SIP\n\n`SIP` 是一个让你为 Python 创建 C 和 C++ 绑定的工具。它最初是为 `PyQt` 包创建，该包为 `Qt`\
  \ 工具包提供了 Python 绑定。因此，`Python-SIP` 对 `Qt` 信号/槽机制有特定的支持。然而，该工具也可用于创建任何 C++ API 的绑定。\n\
  \n`SIP` 的工作方式与 `SWIG` 类似，尽管它支持的语言范围不如 `SWIG` 多。`SIP` 在其接口规范文件中支持大部分 C/C++ 语法，并使用与\
  \ `SWIG` 类似的命令语法（即以 `%` 符号开头的标记），尽管它支持一组不同且风格不同的命令来定制绑定。这里是一个简单的 Python–SIP 接口规范文件的示例：\n\
  \n\n\n\n\n组件对象模型 (COM) 是一种二进制接口标准，允许对象通过进程间通信进行相互作用。COM 对象定义了良好的接口，使得软件组件可以被重用并链接在一起以构建端用户应用程序。该技术由微软于\
  \ 1993 年开发，并仍在在使用，主要集中在 Windows 平台上，尽管微软现在鼓励使用 `.NET` 和 SOAP。\n\nCOM 包含了一系列庞大的技术，但我在这里重点关注的部分是\
  \ COM 自动化（COM Automation），也称为 OLE 自动化，或简单称为自动化。这涉及从脚本语言访问自动化对象（也称为 `ActiveX 对象`），以执行重复性任务或通过脚本控制应用程序。它支持许多目标语言，例如\
  \ Visual Basic、JScript、Perl、Python、Ruby 以及一系列微软的 `.NET` 语言。\n\n一个 COM 对象通过通用唯一标识符\
  \ (`UUID`) 来标识，并通过同样由 `UUID` 标识的接口暴露其功能。所有 COM 对象都支持 `IUnknown` 接口的方法 `AddRef()`、`Release()`\
  \ 和 `QueryInterface()`。COM 自动化对象还实现了 `IDispatch` 接口，该接口包含用于触发对象中命名函数的 `Invoke()`\
  \ 方法。\n\n被暴露的接口的对象模型使用接口描述语言 (`IDL`) 进行描述。`IDL` 是一种对软件组件接口的语言无关描述，通常存储在扩展名为 `.idl`\
  \ 的文件中。该 `IDL` 描述随后可以使用 Windows 上的 `MIDL.EXE` 编译器翻译成各种形式。生成的文件包括 COM 对象的代理 DLL 代码以及一个描述对象模型的类型库。下一个示例展示了微软\
  \ IDL 语法的实例：\n\n![image](img/u14-07-9780443222191.jpg)\n\n还有一个名为跨平台 COM（或 `XPCOM`）的框架。这是一个由\
  \ Mozilla 开发的开源项目，用于他们的许多应用程序中，包括 Firefox 浏览器。XPCOM 遵循与 COM 相似的设计，尽管它们的组件之间是不兼容*或*不*可互换的。\n\
  \n## 通用对象请求代理架构\n\n通用对象请求代理架构 (`CORBA`) 是一种行业标准，允许软件组件在独立于其位置和供应商的情况下进行相互通信。在这方面，它与\
  \ COM 相似：两种技术都解决了来自不同来源的对象之间的通信问题，并且都使用语言无关的 `IDL` 格式来描述每个对象的接口。\n\n`CORBA` 是跨平台的，具有多种开源实现，并对\
  \ Unix 平台提供了强力支持。它由对象管理小组于 1991 年定义（该小组也负责管理 UML 建模语言）。`CORBA` 提供了广泛语言绑定，包括 Python、Perl、Ruby、Smalltalk、JavaScript、Tcl\
  \ 和 CORBA 脚本语言 (`IDLscript`)。它还支持多重继承的接口，而 COM 仅支持单继承。\n\n在脚本方面，`CORBA` 不需要像 COM\
  \ 那样提供特定的自动化接口。所有的 `CORBA` 对象默认都可以通过动态调用接口（Dynamic Invocation Interface）进行脚本化操纵，这允许脚本语言动态地确定对象的接口。作为从脚本语言访问\
  \ `CORBA` 对象的示例，这里有一个简单的 `IDL` 描述以及它如何映射到 Ruby 语言：\n\n![image](img/u14-08-9780443222191.jpg)\n\
  \n## 使用 Boost Python 添加 Python 绑定\n\n本章的其余部分将致力于让你具体地理解如何为你的 C++ API 创建脚本绑定。我将开始向你展示如何使用\
  \ Boost Python 库创建 Python 绑定。\n\nPython 是一种开源动态类型语言，由 Guido van Rossum 设计，并于 1991\
  \ 年首次出现。Python 是强类型的，具有自动内存管理和引用计数特性。它带有一个大型且丰富的标准库，包括 `os`、`sys`、`re`、`difflib`、`codecs`、`datetime`、`math`、`gzip`、`csv`、`socket`、`json`\
  \ 和 `xml` 等模块。Python 不常的一个方面是使用缩进来定义作用域，而不是 C 和 C++ 中的大括号。Python 的原始 `CPython` 实现是最常见的，但还有其他主要的实现，例如\
  \ `Jython`（用 Java 编写）和 `Iron Python`（针对 `.NET` 框架）。关于 Python 语言的更多细节，请参阅 [`www.python.org/`](https://www.python.org/)。\n\
  \n正如我提到的，Boost Python 用于通过编程方式定义 Python 绑定，这些绑定可以被编译成 Python 可以直接加载的动态库。图 14.1 解释了这一基本工作流。\n\
  \n### 构建 Boost Python\n\n许多 Boost 程序包仅作为头文件实现，使用模板和内联函数，因此你只需要确保将 Boost 目录添加到编译器的包含搜索路径中。然而，使用\
  \ Boost Python 需要你构建并链接 `boost_python` 库，因此你需要知道如何构建 Boost。\n\n构建 Boost 库推荐的方法是使用\
  \ `bjam` 工具，它是 Perform Jam 构建系统的后代。首先你需要下载 `bjam`。大多数平台可以在 [`www.boost.org/`](https://www.boost.org/)\
  \ 获取预编译的可执行文件。\n\n![image](img/f14-01-9780443222191.jpg)\n\n图 14.1 使用 Boost Python\
  \ 创建 Python 绑定的工作流。白色框表示文件，阴影框表示命令。\n\n在 Unix 变体（如 Linux 或 Mac）上构建 Boost 库涉及以下步骤：\n\
  \n![image](img/u14-09-9780443222191.jpg)\n\n`toolset` 字符串用于定义你希望构建的编译器，例如 `gcc`、`darwin`、`msvc`\
  \ 或 `intel`。\n\n如果你在机器上安装了多个版本的 Python，可以通过 `bjam` 的配置文件指定要使用的版本，该文件名为 `user-config.bjam`\
  \ 的文件，你应该在主目录中创建它。你可以在 Boost.Build 手册中找到更多关于配置 `bjam` 的细节，但基本上你需要在你的 `user-config.bjam`\
  \ 文件中添加类似的条目：\n\n![image](img/u14-10-9780443222191.jpg)\n\n在 Windows 上，你可以从命令行执行类似的步骤。只需运行\
  \ `bootstrap.bat` 而不是 `boostrap.sh`。\n\n### 使用 Boost Python 封装 C++ API\n\n让我们先介绍一个简单的\
  \ C++ API，我将将其暴露给 Python。我将使用一个可以存储多个联系人电话的电话录示例。这为我们在整个章节中提供了一个易于管理但非简单的示例。这是我们电话录\
  \ API 的公共定义：\n\n![image](img/u14-11-9780443222191.jpg)\n\n这将让我们能够演示多种功能，例如封装多个类、C++\
  \ 标准库容器的使用以及多个构造函数的使用。我还将借机会演示在将 C++ 成员函数直接映射到 Python 方法之外创建 Python 属性。\n\n\n\n\n\
  \n`Person` 类本质上只是一个数据容器：它只包含访问底层数据成员的 getter 和 setter 方法。这些是转换为 Python 属性（properties）的理想人选。Python\
  \ 中的属性行为类似于普通对象，但它使用 getter 和 setter 方法来管理对该对象的访问（以及一个用于销毁对象的 deleter 方法）。这使得对于你希望表现像简单数据成员的类成员，其访问变得更加直观，同时允许你提供控制值获取和设置的逻辑。\n\
  \n现在我已经展示了我们的 C++ API，让我们来看看如何使用 `boost::python` 为其指定 Python 绑定。通常情况下，你会创建一个单独的\
  \ `.cpp` 文件为给模块指定绑定，在这些文件中，惯例是使用与模块相同的基文件名并附加 `_wrap` 后缀；在我们的示例中我将使用 `phonebook_wrap.cpp`。这个封装文件是你指定想要暴露的类以及想要在这些类上使用的的地方。该文件包含了封装我们的\
  \ `phonebook.h` API 所需的 `boost::python` 代码：\n\n![image](img/u14-12-9780443222191.jpg)\n\
  \n注意，对于 `Person` 类，我定义了两个属性，称为 `name` 和 `home_number`，并提供了 C++ getter 和 setter 函数来控制对这些属性的访问（如果我只提供\
  \ getter 方法，那么属性将是只读的）。对于 `PhoneBook` 类，我定义了标准方法，分别称为 `size()`、`add_person()`、`remove_person()`\
  \ 和 `find_person()`。我还必须显式地指定我希望 `find_person()` 的指针返回值如何表现。\n\n然后你可以将 `phonebook.cpp`\
  \ 和 `phonebook_wrap.cpp` 的代码编译为动态库。这涉及针对 Python 和 `boost::python` 的头文件进行编译，并链接这两个者的库。结果在\
  \ Mac 和 Linux 上应该是 `phonebook.so` 库，在 Windows 上应该是 `phonebook.dll`。（Python 不识别 Mac\
  \ 上的 `.dylib` 扩展名）。例如，在 Linux 上：\n\n![image](img/u14-13-9780443222191.jpg)\n\n此时，你可以使用\
  \ `import` 关键字直接将动态库加载到 Python 中。这里有一些示例 Python 代码，加载了我们的 C++ 库并演示了 `Person` 和 `Phonebook`\
