  \n## API 包装模式\n\n在另一组类之上编写包装接口是一项相对常见的 API 设计任务。例如，也许你正在处理一个大型的遗留代码库，与其重构所有代码，你决定设计一个新的更整洁的\
  \ API 来隐藏底层的遗留代码（Feathers, 2004）。或者，你写了一个 C++ API，并需要为某些客户端暴露一个纯 C 接口。或者，你有一个第三方库依赖，你希望客户端能够访问，但你不想直接向他们暴露该库。\n\
  \n创建包装 API 的缺点是由于额外的间接层而可能经历的性能损失，以及在包装层需要存储的任何额外状态的开销。然而，为了暴露更高质量或更集中的 API，这通常是值得的，正如前面提到的情况所示。\n\
  \n有几种结构设计模式处理在另一个接口之上包装另一个接口的任务。我将在接下来的章节中描述其中的三种模式。这些模式按包装层与原始接口之间的偏差程度递增分别为：代理（Proxy）、适配器（Adapter）和\
  \ Fac 面（Façade）。\n\n### 代理模式\n\n代理设计模式为另一个类提供一个一对一的转发接口。在代理类中调用 `FunctionA()` 将导致它在原始类中调用\
  \ `FunctionA()`（图 3.3）。也就是说，代理类和原始类具有相同的接口。这被认为是单组件包装，使用 Lakos (1996) 的术语：代理类和原始类具有相同的接口。\n\
  \n创建包装 API 的缺点是由于额外的间接层可能导致的性能影响，以及包装层需要存储的任何额外状态的开销。然而，为了暴露更高质量或更集中的 API，这通常是值得的，正如前面提到的情况。\n\
  \n有几种结构设计模式处理在另一个接口之上包装另一个接口的任务。我将在接下来的章节中描述其中的三种模式。这些模式按包装层与原始接口之间的偏差程度递增：代理、适配器和\
  \ Fac 面。\n\n代理设计模式为另一个类提供一个一对一的转发接口。在代理类中调用 `FunctionA()` 将导致它在原始类中调用 `FunctionA()`（图\
  \ 3.3）。也就是说，代理类和原始类具有相同的接口。这可以被认为是单组件包装，使用 Lakos (1996) 的术语：代理类和原始类具有相同的接口。\n\n\
  *(注：输入文本包含重复部分，我将按照规则进行格式化处理。）)*\n\n\n\n\n* 5. **支持资源共享。** 你可以拥有多个 `Proxy` 对象共享同一个底层的\
  \ `Original` 类。例如，这可以用于引用计数或写时复制语义。这种情况实际上是另一种设计模式，被称为重量类模式（Flyweight pattern），其中多个对象共享相同的底层数据以最大限度地减少内存占用。\n\
  * 6. **防止 Original 类未来变化的影响。** 在这种情况下，你预见到某个依赖库在未来会发生变化，因此你为该 API 创建了一个 `Proxy`\
  \ 器，直接模拟当前的行为。当库在未来发生变化时，你可以通过你的 `Proxy` 对象保留旧接口，并只需更改其底层实现以使用新的库方法。此时，你拥有的不再是一个\
  \ `Proxy` 对象，而是一个 `Adapter`（适配器），这通向我们的下一个模式提供了一个很好的过渡。\n\n### 适配器模式\n\n适配器设计模式将一个类的接口转换为兼容但不同的接口（图\
  \ 3.4）。因此，它与代理模式相似，因为它们都是单组件包装器。然而，`Adapter` 类和 `Original` 类的接口可能是不同的。\n\n这种模式的用处在于可以为现有的\
  \ API 暴露不同的接口，使其与其他代码更好地协同工作。就像代理模式的情况一样，所涉及的两个接口可能来自不同的库。例如，考虑一个几何程序包，它允许你定义一系列原始形状。某些方法的参数顺序可能与你在\
  \ API 中使用的顺序不同，或者它们可能在不同的坐标系中指定，或者使用不同的约定（例如，使用 `(中心, 尺寸)` 而不是 `(左下角, 右上)`），或者方法名可能不符合你\
  \ API 的命名规范。因此，你可以使用 `Adapter` 类将此接口转换为与你的 API 兼容的形式。例如，\n\n![image](img/f03-04-9780443222191.jpg)\n\
  \n图 3.4 适配器设计模式的 UML 图。\n\n![image](img/u03-32-9780443222191.jpg)\n\n在这个示例中，`RectangleAdapter`\
  \ 使用不同的方法名和调用约定来设置矩形的尺寸，这与底层的 `Rectangle` 类不同。两种情况下的功能相同。你只是暴露了一个不同的接口，以便让你更容易地与该类交互。\n\
  \n需要注意的是，适配器可以使用组合（如上一个示例所示）或继承来实现。这两种变体通常被称为对象适配器或类适配器。在继承的情况下，`RectangleAdapter`\
  \ 将派生自 `Rectangle` 基类。如果你想在你的适配器 API 中也暴露 `Rectangle` 的接口，可以使用公有继承，但更有可能你会使用私有继承，以便只有你的新接口是公开的。\n\
  \n适配器模式在 API 设计中的一些优点包括：\n\n* 1. **强制保持 API 的一致性。** 正如我在上一章中讨论过的，一致性是良好 API 的重要品质。使用适配器模式，你可以整合多个具有不同接口风格的异类，并为所有这些类提供一个一致的接口。结果是你的\
  \ API 更加统一，因此更容易使用。\n* 2. **封装 API 的依赖库。** 例如，你的 API 可能提供加载 PNG 图像的能力。你想使用 `libpng`\
  \ 库来实现这一功能，但你不想直接向你的 API 的用户暴露 `libpng` 的调用。这可能是因为你想呈现一个一致且统一的 API，或者因为你想防止 `libpng`\
  \ 未来潜在的 API 变化。\n* 3. **转换数据类型。** 例如，假设你有一个 API `MapPlot`，它允许在 2D 地图上绘制地理坐标。`MapPlot`\
  \ 仅接受经纬度对（使用 WGS84 基准），并指定为两个 double 参数。然而，你的 API 有一个 `GeoCoordinate` 类型，可以表示多种坐标系中的坐标，例如通用高斯横卡托投影或兰伯特正圆锥投影。你可以编写一个适配器，接受你的\
  \ `GeoCoordinate` 对象作为参数，在必要时将其转换为地理坐标（纬度, 经度），并将两个双 传递给 `MapPlot` API。\n* 4. **提供不同语言之间的互操作性。**\
  \ 例如，也许你写了一个 Objective-C API，并想将 Objective-C 类和方法映射到 C++ 版本。或者，你可能写了一个纯 C API，并想创建\
  \ `Adapter` 类将 C 调用封装到 C++ 类中。关于后一种情况是否可以严格被视为适配器模式尚存在争议，因为设计模式主要关注面向对象的系统，但如果你在对术语的解释上允许一定的灵活性，你就会发现这个概念是相同的。以下代码提供了一个纯\
  \ C API 的 C++ 适配器示例。（我将在下一章详细讨论 C 和 C++ API 之间的差异）\n\n![image](img/u03-33-9780443222191)\n\
  \n### 外观模式 (Facade)\n\n外观设计模式为一组类提供了一个简化的接口。实际上，它定义了一个更高层次的接口，使得子系统更容易使用（图 3.5）。根据\
  \ Lakos 的分类，外观是多组件包装器的示例（Lakos, 1996）。因此，外观与适配器不同，因为外观简化了类结构，而适配器保持类结构不变。\n\n随着你的\
  \ API 增长，使用该接口的复杂性也会随之增加。外观是将你的 API 组织成子系统的方法，以减少这种复杂性，并使其更容易使用。外观可能会提供一个改进的接口，同时将底层系统与接口完全解耦，使其不再可访问。这通常被称为封装式外观。\n\
  \n![image](img/f03-05-9780443222191.jpg)\n\n图 3.5 外观模式的 UML 图。\n\n让我们来看一个例子来说明这种模式。假设你正在度假并入住一家酒店。你决定去吃晚饭然后看演出。为了实现这一点，你需要联系餐厅预订晚餐，联系剧院预订座位，可能还要安排一辆出租车接你。你可以用\
  \ C++ 将此表示为三个相互交互的独立对象：\n\n![image](img/u03-34-9780443222191.jpg)\n\n然而，假设你入住的是一家高端酒店，那里有一位乐于帮助的家客可以协助你处理这一切。事实上，家客能够查到演出时间，然后根据他对当地的了解，安排合适的晚餐时间和最佳叫车时间。将其翻译成我们的\
  \ C++ 设计术语，你现在只需要与一个界面简单得多的对象进行交互：\n\n\n\n\n\n外观模式在 API 设计方面有许多实应用：\n\n1. **隐藏遗留代码。**\
  \ 通常情况下，你必须处理旧的、腐败的遗留系统，这些系统非常脆弱，且不再提供连贯的对象模型。在这种情况下，在旧代码之上创建一组新的设计良好的 API 可能会更容易。这样，所有新代码都可以使用这些新\
  \ API。一旦所有现有的客户端都更新到新的 API，遗留代码就可以完全隐藏在新的外观之后（使其成为一个封装外观）。\n\n2. **创建便利性 API。**\
  \ 正如我在上一章中讨论过的样，在提供更强大、通用且灵活的例程，与提供让常见用例变得简单易于使用的非通用化例程之间，往往存在着一种紧张关系。外观模式是解决这种紧张关系的方法，它允许两者共存。从本质上说，便利\
  \ API 就是一种外观。我之前使用了 `OpenGL` 库的例子，它提供了低级基础例程，而 `GLU` 库提供了构建在 `GL` 库之上的更高级且易于使用的例程。\n\
  \n3. **支持功能削减或替代的 API。** 通过抽象对底层子系统的访问，可以在不影响客户端代码的情况下替换某些子系统。这可以用于切换存根（stub）子系统以支持\
  \ API 的演示或测试版本。它还可以切换不同的功能，例如为游戏使用不同的 3D 渲染引擎或使用不同的图像读取库。作为一个真实世界中的例子，Second Life\
  \ 查看器可以基于专有的 `KDU JPEG-2000` 解码器库构建。然而，该查看器的开源版本是基于较慢的 `OpenJPEG` 库构建的。\n\n# 观察者模式\n\
  \n对象调用其他对象的方法是非常常见的。毕竟，完成任何非凡的任务通常需要多个对象的协同工作。然而，要做到这一点，对象 `A` 必须知道对象 `B` 的存在和接口才能调用它的方法。实现这一点的最简单方法让\
  \ `A.cpp` 包含 `B.h`，然后直接调用该类的方法。然而，这引入了 `A` 和 `B` 之间的编译时依赖，迫使类变得紧密耦合。结果是类 `A` 的通用性降低了，因为在不引入类\
  \ `B` 的情况下，它无法被另一个系统重用。此外，如果类 `A` 还调用了类 `C` 和 `D`，那么类 `A` 的更改可能会影响这三个紧密耦合的类。此外，这种编译耦合意味着用户无法在运行时动态向系统添加新的依赖。\n\
  \n我将参考流行的模型-视图-控制器（MVC）架构来说说明这些问题以及观察者模式如何提供帮助。\n\n## 模型-视图-控制器\n\nMVC 架构模式要求将业务逻辑（`Model`）与用户界面（`View`）隔离，由\
  \ `Controller` 接收用户输入并协调其他两者。MVC 分离支持应用程序功能的模块化，并提供了若干优点：\n\n1. Model 和 View 组件的分离使得实现多个复用通用业务逻辑核心的用户界面成为可能。\n\
  2. 消除了多个 UI 实现中低级 Model 代码的重复。\n3. Model 和 View 代码的解耦提高了了为核心业务逻辑代码编写单元测试的能力。\n4.\
  \ 组件的模块化允许核心逻辑开发人员和 GUI 开发人员同时工作，而互不影响。\n\nMVC 模型最早由 Steve Burbeck 和 Trygve Reenskaug\
  \ 在 1987 年在 Xerox PARC 描述，它现在仍然是应用程序和工具包中流行的架构模式。例如，现代 UI 工具包如 The Qt Company 的\
  \ `Qt`、Apple 的 `Cocoa`、`Java Swing` 以及微软的 `Foundation` 类库都受到了 MVC 的启示。以单个复选按钮为例，按钮当前的开启/关闭状态存储在\
  \ `Model` 中，`View` 在屏幕上绘制按钮的当前状态，当用户点击按钮时，`Controller` 更新 `Model` 状态和 `View` 显示。\n\
  \nMVC 分离对代码依赖的影响意味着 `View` 代码可以调用 `Model` 代码（以发现最新状态并更新 UI），但反之不然：`Model` 代码不应该对\
  \ `View` 代码有编译时的感知（因为这会将 `Model` 与单个 `View` 绑定）。图 3.6 展示了这一依赖关系。\n\n在在一个简单的应用程序中，`Controller`\
  \ 可以根据用户输入对 `Model` 进行更改并将这些更改通信给 `View` 以更新 UI。然而，在真实世界的应用中，`View` 通常也需要更新以反映底层\
  \ `Model` 的额外更改。这是必要的，因为更改 `Model` 的某方面可能会导致它更新其他相关的 `Model` 状态。这要求 `Model` 代码在状态发生变化时通知\
  \ `View` 层。然而，正如我已经过的，`Model` 代码不能静态绑定并调用 `View` 代码。这就是观察者发挥作用的地方。\n\n观察者模式是发布/订阅（或\
  \ pub/sub）范式的特定实例。这些技术定义了对象之间的一对多的依赖关系，使得发布者对象可以通知所有订阅对象任何状态变化，而无需直接依赖它们。因此，观察者模式在\
  \ API 设计方面是一项重要的技术，因为它可以帮助减少耦合并增加代码重用。\n\n## 实现观察者模式\n\n实现观察者模式的典型方法是引入两个概念：`subject`（主题）和\
  \ `observer`（观察者，也称为发布者和订阅者）。一个或多个观察者对 `subject` 感，然后 `subject` 通知所有已注册的观察者任何状态变化。这在图\
  \ 3.7 中所示。\n\n\n\n\n此示例演示了如何创建三个独立的观察者类，并让它们订阅由之前的 `MySubject` 类定义的两种消息的不同组合。最后，对\
  \ `subject.Notify()` 的调用会导致主题遍历其订阅了特定消息的观察者列表，并为每个观察者调用 `Update()` 方法。需要注意的重要点是，`MySubject`\
  \ 类对 `MyObserver` 类没有编译依赖。这两个类之间的关系是在运行时动态创建的。\n\n当然，这种灵活性可能会带来微小的性能开销：在调用（虚拟）函数之前遍历观察者列表的开销。然而，与减少耦合和增加代码重用的好处相比，这种开销通常可以忽略不计。\n\
  \n### 推式与拉式观察者\n\n实现观察者模式有很多方法，之前的示例只是其中一种。然而，我将把观察者分为两大大类：推式（push-based）和拉式（pull-based）。这种分类决定了所有信息是通过通过\
  \ `Update()` 方法的参数推给观察者，还是仅使用 `Update()` 方法来发送关于事件发生的通知，如果观察者想要发现更多细节，则必须直接查询主题对象。例如，用户在文本输入框中按下回车键的通知可以将用户输入的实际文本作为\
  \ `Update()` 方法的参数传递（推式），也可能依赖观察者在需要时调用主题上的 `GetText()` 方法来获取这些信息（拉式）。\n\n图 3.7\
  \ 阐释的是一种拉式观察者模式，因为 `Update()` 方法没有参数，观察者可以查询主题的当前状态。这种方法允许你为系统中的所有观察者使用同一个简单的 `IObserver`。相比之下，推式解决方案要求你为每个需要唯一签名的\
  \ `Update()` 方法定义不同的抽象接口。推式解决方案适用于连同通知一起发送一小段常用数据，例如复选框状态改变时的复选框开启/关闭状态。然而，对于较大的数据，它可能是低效的，例如每当用户在文本框中按下一个键就发送整个文本。\n\
  \n我将通过提供一个现实示例来完成对观察者的介绍，再次引用开源项目 VTK。该库使用观察者模式，以便在系统发生各种事件时调用客户端代码。管理 VTK 观察者的\
  \ API 如下：\n\n![image](img/u03-39-9780443222191.jpg)\n\n从这组函数可以看出，VTK 观察者是基于 `unsigned\
  \ long` 键值的。然而，API 包含了这些函数的重载版本，接受 `const char ∗` 以方便操作。有一个 `GetEventIdFromString()`\
  \ 函数，它在内部用于执行从字符串到 `unsigned long` 的映射以支持这一功能。\n\n事件本身定义在一个大型枚举中，值如 `vtkCommand::DeleteEvent`、`vtkCommand::RenderEvent`\
  \ 和 `vtkCommand::EnterEvent`。观察者对象由 `vtkCommand` 对象建模，其结构如下：\n\n![image](img/u03-40-9780443222191.jpg)\n\
  \n因此，预计观察者将重写 `Execute()` 函数来执行其自定义工作，该函数接收调用事件的对象、事件标识符以及由调用对象提供的任何可选调用数据。\n\n\
  # 4：设计\n\n## 摘要\n\n本章从一个警示故事开始，介绍了如果没有良好的初始设计并在软件演进过程中进行维护，软件系统将如何积累技术债并最终走向衰败。然后，讨论了功能性需求的收集，并就如何最好收集和维护这些需求提供了建议。还详细描述了用例建模和用户故事创建等互补方法。随后，书中将描述了如何进行应用程序编程接口（API）的设计，将其分为高层架构设计和详细的对象或类设计。文中还讨论了各种设计原则，包括\
  \ SOLID 原则、里氏替换原则、开闭原则和迪米特法则。最后，涵盖了函数设计主题，包括函数命名和参数，以及通过返回码和异常处理错误的主题。\n\n### 关键词\n\
  \n抽象；敏捷开发；架构；组合；异常；功能需求；继承；命名；对象建模；用例\n\n在前面的几个章节中，我奠定了基础并开发了背景，以便你能够开始设计自己的应用程序编程接口（API）。我介绍了有助于良好的\
  \ API 设计的各种特性，并讨论了适用于可维护 API 设计的标准模式。\n\n在本章中，我将所有这些信息整合在一起，涵盖了高质量 API 设计的细节，从整体架构规划到类设计和单个函数调用。然而，如果\
  \ API 不能为你的用户提供所需的功能，那么良好的设计也毫无意义。因此，我还将谈论如何定义功能性需求，以指定 API 应该做什么。我还将涵盖用例和用户故事的创建，作为从用户角度描述\
  \ API 行为的一种。这些不同的分析技术可以单独使用，也可以结合使用，但它们应该始终在任何设计 API 的尝试之前：你无法设计你不理解的东西。\n\n图 4.1\
  \ 显示了设计 API 的基本工作流。它从问题分析开始，由此开发初始设计，然后实现解决方案。这是一个持续且迭代的过程：新需求应该触发对设计的重新评估，其他来源的变化（如重大\
  \ 修复）也是如此。本章将关注此过程的前两个阶段：分析和设计。接下来的章节将处理剩余的实现问题，如 C++ 使用、文档和测试。\n\n然而，在进入这些设计主题之前，我将花时间研究为什么良好的设计如此重要。这一开头部分源于对多年来由数十甚至数百名工程师维护的大型代码库的经验。通过观察代码库演变或衰败获得的教训，为从一开始就进行良好设计提供了强大的动力，同样重要的是从那时起保持高标准。不这样做代价可能是巨大的。用比喻来说：良好的\
  \ API 设计是一场旅程，而不是第一步。\n\n## 良好设计的理由\n\n本章关注产生优雅 API 设计的技术。然而，你可能处理过代码完全不符合这些理想的项目。你可能处理过具有低内聚、暴露内部细节、无测试、文档糟糕以及存在非正交行为的遗留系统。尽管如此，这些系统在最初构思时可能是设计良好的。但随着时间的推移，软件腐化了，变得难以扩展并需要不断维护。\n\
  \n![image](img/f04-01-9780443222191.jpg)\n\n\n\n\n\n所有大型成功公司都源于微小的起点。一个经典的例子是惠尔士-惠普（Hewlett\
  \ Packard），它于 1939 年在帕罗奥图的一个车库里由两个电气工程师创立，并最终成为全球第一家营收超过 1000 亿美元的科技公司。让初创公司成功的特质，与维持一家数十亿（或万亿）美元上市公司所需的素质非常不同。公司在成长过程中通常会经历多次重大的组织变革，其软件实践也是如此。\n\
  \n小型软件初创公司需要尽快推出产品，以避免被竞争对手抢占市场或耗尽资金。在这种环境下，软件工程师面临的压力是快速、大量地产出软件。在这些情况下，设计和实现长期\
  \ `APIs` 所需的额外精力可以被视为一种负担不起的奢侈。当必须在“快速上市”或“公司灭亡”之间做出抉择时，这是一个合理的决定。我曾与一位小型软件初创公司的软件架构师交流过，他禁止编写任何注释、文档或测试，因为他认为这会严重拖慢开发速度。\n\
  \n然而，如果某款软件变得成功，压力就会转向提供稳定、易用且文档完备的产品。新需求开始出现，要求软件以其从未设计过的支持的方式进行扩展。而这一切都必须在一个并非为长期运行而设计的产品核心之上构建。正如沃德·康宁（Ward\
  \ Cunningham）所说，结果就是技术债的累积（Cunningham, 1992）：\n\n第一次交付代码就像欠债。只要能通过重写及时偿还，少量的债务可以加速开发。[……]\
  \ 危险发生发生在债务未被偿还时。在“不完全正确”的代码上花费的每一分钟都算作对这笔债务的利息。在未整合的实现所带来的债务负担下，整个工程组织都可能陷入停滞。\n\
  \n史夫·麦康奈尔（Steve McConnell）对这一定义进行了扩展，指出债务分为两种：无意的和有意的。前者是指初衷良好的软件设计结果被证明易出错、初级工程师编写了低质量代码，或者你的公司收购了另一家公司，而其软件结果证明是一团乱麻。后者是指由于时间、成本或资源限制，做出了意识的战略决策来走捷径，并意图在截止日期后落实正确的解决方案。\n\
  \n当然，问题在于，总会有另一个重要的截止日期，因此人们认为永远没有足够的时间回去进行正确的修复。结果是技术债逐渐累积：系统之间的短期胶水代码一直存在并嵌入得越来越深，临时的补丁（hacks）留在代码中并变成客户所依赖的功能，原本仅用于最后时刻演示的代码被作为生产代码发布，编码规范和文档被忽视，最终导致最初的整洁设计变得退化并变得晦涩。罗伯特·C·马丁（Robert\
  \ C. Martin）定义了代码库达到这一地点的四个警告信号（Martin, 2000）。以下是这些指标的略微修改后的版本：\n\n1.  **脆弱性（Fragility）**。当软件产生意外的副作用，或者实现细节暴露到使得系统中显然不相关的部分依赖于系统其他部分的内部实现时，软件就会变得脆弱。结果是对系统某部分的更改会导致代码中看似不相关的部分发生意外故障。因此，工程师害怕触碰代码，维护它变成了一种负担。\n\
  \n2.  **僵性性（Rigidity）**。一个僵性的软件部分是抵抗变化的。实际上，这种设计变得非常脆弱，以至于即使是简单的更改也无法不费巨大努力实现，通常需要大量的、耗时且高风险的重构。结果是代码库变得粘稠，使得进行新更改的努力被显著减慢。\n\
  \n3.  **不可移动性（Immobility）**。一个优秀的工程师会发现那些可以重用代码来提高软件的可维护性和稳定性的情况。不可移动的代码是指是对这些努力免疫的软件，使其难以在其他地方被重用。例如，实现可能与其周围代码过度纠缠，或者可能硬编码了特定领域的知识。\n\
  \n4.  **不可传输性（Nontransferability）**。如果你的组织中只有一名工程师可以处理代码的某些部分，那么它就可以被描述为不可传输的。所有者通常是最初编写代码的开发者，或者是最后一位尝试清理它的倒霉蛋。对于许多大型代码库，每位工程师都不可能深入理解代码的每一个部分，因此拥有工程师无法轻松深入并有效工作的区域对你的项目来说是一个糟糕的状况。\n\
  \n这些问题的后果是组件之间的依赖关系增加，导致代码中概念上不相关的部分相互依赖内部实现细节。随着时间的推移，这最终导致大多数程序状态和逻辑变成全局性的或重复的（Fig.\
  \ 4.2）。这通常被称为意大利代码（spaghetti code）或大泥球（the big ball of mud）（Foote and Yoder, 1997）。\n\
  \n### 偿还债务\n\n最终，公司将达到这样：积累了这么多技术债，以至于维护和控制代码库的时间超过了为其添加新功能的时间。这通常会导致一个新项目，以修复旧系统的问题。例如，当我几段之前遇到那位软件架构师时，公司已经成长并成功，他的团队正忙于重写他最初设计的所有代码。\n\
  \n![image](img/f04-02-978044322291.jpg)\n\n图 4.2 一个退化为大泥球的紧耦合系统。\n\n从策略角度来看，此类新项目有两种极端可以考虑：\n\
  \n1.  **进化（Evolution）**：设计一个包含所有新需求的系统，然后迭代重构现有系统直到达到该点。\n\n2.  **革命（Revolution）**：放弃旧代码，从头开始设计并实现全新的系统。这两种方案都有优缺点，而且都是困难的。我听过这种问题被描述为在行驶时更换发动机，但汽车以每小时\
  \ 100 英里的速度行驶且你无法停下。\n\n在进化的情况下，你始终有一个可以发布的运行系统。然而，你仍然必须在遗留设计的框架内工作，而这可能不再是表达问题的最佳方式。采用进化方法的良好方法是将旧的丑代码隐藏在新的良好的\
  \ `APIs` 之后（例如使用我在第三章; Feathers, 2004）。\n\n\n\n\n\n在“革命式”案例中，你从旧技术的束缚中解脱出来，可以根据从旧系统中学到的所有知识来设计新工具（尽管从务实的角度考虑，你可能仍然会从旧系统中收获几个关键的\
  \ `classes` 以保留关键行为）。你还可以建立新的流程，例如要求所有新代码都要有大量的单元测试覆盖，并利用此机会切换工具，例如采用新的错误跟踪系统或版本控制管理系统。然而，这种选择需要花费更多的时间和精力（即资金）才能达到可用系统的标准，在此期间，你要么停止对旧工具的所有开发，要么继续在旧系统中交付新功能，而这会不断提高新系统成功的门槛。你还必须警惕“第二系统综合征”，即新系统由于过度设计和目标过分野心而导致失败（Brooks,\
  \ 1995）。\n\n无论在这两种情况下，对下一代项目的需求都引入了团队动态问题和规划复杂性。例如，你是否保持一个单一团队同时关注新旧两个系统？从人员配置角度来看这是理想的。然而，短期战术需求往往会压过长期战略开发，因此在面对旧系统的关键\
  \ bug 修复和维护时，可能很难维持下一代项目。或者，如果你将开发团队分为两部分，这可能会引发士气问题，导致在旧系统上工作的开发者感到自己被归类为二流开发者，被遗留在那里支持一个没有未来的代码库。\n\
  \n此外，技术重启的需求往往还会引发业务和公司层重组。这会导致团队结构和关系被重新评估和重塑。它还可能实质性地影响人们的生计，特别是当公司决定通过裁员来重新调整业务重心时。而这一切仅仅是因为糟糕的\
  \ `API` 设计吗？嗯，也许这种说法有点戏剧化了。重组是公司增长过程中的自然现象，可能由于许多原因发生：一个适用于 10 人的初创公司的结构并不适用于拥有\
  \ 10,000 人的成功企业。但软件无法响应业务需求确实是触发重组的一种方式。例如，2010 年 6 月，当我在 Linden Lab 工作时，该公司裁减了\
  \ 30% 的员工并进行了全公司重组，主要是因为软件演进速度不够快，无法满足公司的收入目标。\n\n### 为长期设计\n\n投入一项重大的下一代工程来替换陈旧的代码库可能为公司花费数百万美元。例如，仅仅为了支付一个由\
  \ 20 名开发人员、测试人员、作家和经理组成的团队一年的薪水（平均薪资每人 10 万美元），就需要 2,000,000 美元。然而，采用良好的设计原则有助于避免这种激进的行动。让我们先列举导致这种场景发生的一些原因：\n\
  \n* 1. 公司仅仅因为认为早期会浪费宝贵的时间和金钱，所以从初就没有创建出良好的软件设计。\n* 2. 项目中的工程师不知道良好的设计技术，或者认为这些技术不适用于他们的项目。\n\
  * 3. 代码原本就没打算运行多久。例如，它是为了演示而仓促编写的，或者它本打算是可以丢弃的原型代码。\n* 4. 软件项目的开发过程没有让技术债务透明化，因此所有需要修复的系统部分的知识随着时间的推移而丢失或遗忘。（敏捷流程如\
  \ `Scrum` 尝试通过使用产品待办列表保持债务透明）。\n* 5. 系统最初设计良好，但由于不受监管的增长，其设计随时间逐渐恶化：例如，允许向代码添加糟糕的更改即使这损害了系统的设计。用\
  \ Fred Brooks 的话，系统失去了它的概念完整性（Brooks, 1995）。\n* 6. 需求的变化通常迫使设计也随之演进，但公司不断有意或无意地推迟这项重构工作，而倾向于短期修复、补丁代码和胶水代码。\n\
  * 7. 允许 bug 存在很。这通常是由于不断添加新功能的驱动，而没有关注产品的整体质量。\n* 8. 代码没有测试，因此当工程师修改功能时，回归错误会侵入系统，代码库的部分最终变成了工程师们畏于更改的恐慌之地。\n\
  \n让我们来解决其中的一些问题。首先是那种认为良好的设计会太拖慢你速度的观点。老实说，编写结构杂乱的软件以更快进入市场，然后在你占据市场后完全重写代码，这可能是整体上最便宜的决策。此外，编写良好的软件的某些方面确实可能看起来更耗时，例如编写额外的代码来对你的\
  \ `classes` 进行 `pimpl`，或编写自动化测试来验证你的 `APIs` 的行为。然而，良好的设计花费的时间并没有你想的那么长，而且从长远来看总是有利的。在接口和实现之间保持强有分离在代码的可维护性方面会产生回报，而且编写自动化测试带给了你更改功能的信心。值得注意的是，Michael\
  \ Feathers 将遗留代码定义为没有测试的代码，这意味着“遗留”并不意味着旧；你今天就可以编写遗留代码（Feathers, 2004）。\n\n`API`\
  \ 的美之处在于，底层实现可以根据需要快速粗陋，也可以完整优雅。良好的 `API` 设计是为了建立一个稳定的接口来解决问题。然而，该 `API` 后面的代码最初可以是简单且低效的。之后你可以增加复杂性。与之相关，`APIs`\
  \ 将问题隔离在特定的组件中。通过管理组件之间的依赖关系，你可以限制问题的范围。相反，在垃圾代码中，每个组件都依赖于其他组件的内部，行为变得不再正交，一个组件中的\
  \ bug 会以异常的方式其他组件。因此，重要的信息是花时间先建立良好的高级设计，关注组件之间的依赖和关系。这是本章的重点。\n\n问题的另一个方面是，如果你不断保持代码质量的高标准，随着代码的演进，原始设计就会失效。为了满足截止日期而妥协是可以的，只要你之后回来做好。记住继续还你的技术债。代码的寿命通常比你想的要长得多。当你削弱\
  \ `API` 时记住这一点很好，因为你可能需要长期支持后果。因此，意识到新需求对 `API` 设计的影响并重构你的代码以保持设计的一致性和更新很重要。对 `API`\
  \ 实施变更控制同样重要，以防止它以无监督或混乱的方式演进。我将在第 10 章讨论 `API` 版本控制时，讨论实现这些目标的方法。\n\n## 获取功能性需求\n\
  \n\n\n\n\n为软件设计出优秀方案的第一步是理解它需要做什么。工程师们在构建错误的东西上浪费了如此多的开发时间，这令人惊叹。同样，看到两个工程师听到对同一项工作的非正式描述后，却对其包含的内容产生完全不同的想法，这也很让人大开眼界。这并不一定是一坏事：拥有思维方式不同的成员可以提供替代的视角和解决方案，这是好事。问题在于，工作的描述得不够详细，以至于所有参与者无法形成共识并朝着同一个目标努力。这就是需求大显用场的地方。软件行业有几种不同类型的需求，包括：\n\
  \n1. `Business requirements`（业务需求）：用业务术语描述软件的价值（即它如何促进组织需求）。\n2. `Functional requirements`（功能需求）：描述软件的行为（即软件应该完成什么）。\n\
  3. `Nonfunctional requirements`（非功能需求）：描述软件必须实现的质量标准（即软件对用户而言运行良好如何）。\n\n在接下来的章节中，我将主要关注功能需求和非功能需求。然而，确保你的软件功能与你业务的战略目标一致仍然极其重要。否则，你可能会面临损害你的\
  \ `API` 长期成功的风险。\n\n### 什么是功能需求？\n\n功能需求简单来说理解要构建什么的方法，这样你就不会浪费金钱去构建错误的东西。在我们的软件开发阶段图（`Fig.\
  \ 4.1`）中，功能需求正处于分析阶段。\n\n在 `API` 开发方面，功能需求定义了 `API` 的预期功能。这些需求应该与 `API` 的客户协作开发，以便它们能代表用户的声音和需求（`Wiegers,\
  \ 2003`）。显式地捕获需求还能让你与预期用户就功能范围达成一致。当然，`API` 的用户也是开发者，但这并不意味着你自己也是开发者就应该假设知道他们想要什么。有时，你可能需要自己对需求进行质疑或研究。尽管如此，你仍然应该识别你\
  \ `API` 的目标用户——即 `API` 领域的专家——并根据他们的输入来驱动功能需求。例如，你可以通过访谈、会议或使用调查问卷来询问用户：\n\n1. 他们期望通过\
  \ `API` 实现哪些任务？\n2. 从他们的角度来看，理想的工作流应该是怎样的？\n3. 所有的可能输入是什么，包括它们的类型和有效范围？\n4. 所有的预期输出是什么，包括类型、格式和范围？\n\
  5. 必须支持哪些文件格式或协议？\n6. 他们对问题领域有什么（如果有）心理模型？\n7. 他们使用哪些领域术语？\n\n如果你正在修订或重构现有的 `API`，也可以要求开发者对他们目前使用\
  \ `API` 而必须编写的代码进行注释。这可以帮助识别繁琐的工作流和 `API` 中未使用的部分。你还可以询问他们他们在理想世界中倾向于如何使用 `API`（`Stylos\
  \ et al., 2008`）。\n\n功能需求也可以由非功能需求提供支持。这些需求定义了 `API` 的运行限制，而不是它的行为。这些质量对于用户来说可能与\
  \ `API` 提供的功能同样关键。非功能需求的示例包括以下方面：\n\n1. `Performance`（性能）：某些操作的速度是否有限制？\n2. `Platform\
  \ compatibility`（平台兼容性）：代码必须在哪些平台上运行？\n3. `Security`（安全性）：是否存在数据安全、访问或隐私问题？\n4.\
  \ `Scalability`（可扩展性）：系统能否处理真实的数据输入？\n5. `Flexibility`（灵活性）：系统在发布后是否需要扩展？\n6. `Usability`（易用性）：用户可以轻松理解、学习和使用\
  \ `API` 吗？\n7. `Concurrency`（并发性）：系统是否需要多个处理器？\n8. `Cost`（成本）：软件将花费多少？\n\n### 功能需求示例\n\
  \n功能需求通常在需求文档中管理，每个需求都有一个唯一的标识符和描述。可能还会提供需求的理由，以解释其必要性。通常的做法是将需求以简洁的符号列表形式呈现，并将文档组织成不同的主题章节，以便与系统同一部分的需求可以放在一起。\n\
  \n良好的功能需求应该是简单、易读、无歧义、可验证且不含术语的。重要的一点是不要过度规定技术实现：功能需求应该记录 `API` *应该*做什么，而不是它*如何*做到的。很多时候，客户会告诉你某个功能应该如何实现。更重要的是让他们告诉他们他们想要解决的根本问题是什么。比起他们提出的解决方案，可能有更好的方法来解决该问题。\n\
  \n为了说明这些点，这里有一个用户与自动取款机（ATM）交互的功能需求示例列表：\n\n* `REQ 1.1`：如果系统缺钱或无法与金融机构通信，系统应防止进一步交互。\n\
  * `REQ 1.2`：系统应验证插入的卡片是否适用于金融交易。\n* `REQ 1.3`：系统应验证用户输入的 PIN 码是否正确。\n* `REQ 1.4`：如果可用，系统应发放请求的金额，并从用户账户中扣除相同金额。\n\
  * `REQ 1.5`：如果交易无法完成，系统应通知用户。在这种情况下，不应从用户账户中扣除任何资金。\n\n### 维护需求\n\n没有所谓的稳定需求；你应该一直预期它们会随着时间的推移而变化。这种情况有很多原因，最常见的是当你开始构建系统时，用户（以及你）对系统应该如何运行会有更清晰的想法。因此，你应该确保对需求进行版本控制并标记日期，这样你就可以引用特定版本的文档并知道它的旧。\n\
  \n平均而言，项目 25% 的功能需求会在开发期间发生变化，占到需要重做的代码的 70%–85%（`McConnell, 2004`）。虽然与客户不断变化的需求保持同步是好事，但你应该确保所有人都理解变更需求的成本。增加新需求会导致项目交付时间变长。它还可能对设计进行重大修改，导致大量代码需要重写。\n\
  \n\n\n\n\n特别是，你应该警惕掉入需求蔓延（requirements creep）的陷阱。任何对功能需求的重大变更都应该触发对项目进度和成本预算的修订。通常情况下，需求中的任何新增内容都应该根据其所交付的增量业务价值进行评估。从这一务实的角度评估新需求，有助于权衡变更带来的收益与实现成本之间的关系。当被要求在不改变交付计划的情况下添加一个大型新需求时，另一种实用的技巧是询问应该移除哪些现有需求以便添加新需求。这通常有助于将讨论集中在新需求与现有需求之间的相对优先级上。\n\
  \n## 创建用例\n\n用例（Use case）描述了基于用户或其他软件组件交互的 API 行为（Jacobson, 1992）。用例本质上是功能性需求的一种，它专门捕获了谁为了什么目的对\
  \ API 做了什么，而不仅仅是提供功能、行为或实现说明的列表。关注用例可以帮你从客户端的角度来设计 API。\n\n同时生成功能性需求文档和一组用例是常见的。例如，用例可以从用户的角度来描述\
  \ API，而功能性需求可以用于描述功能列表或算法细节。然而，仅集中于其中一种技术通常也足够了。在这种情况下，我建议创建用例，因为用例与用户希望与系统交互的方式最为紧密。当同时使用这两种方法时，你可以从用例中推导出功能性需求，或者反之亦然。不过，更典型的做法是先与用户合作生成用例，然后从这些用例中推导出功能性需求列表。\n\
  \nKen Arnold 使用开汽车的类比说明了基于用途而非实现细节来设计接口重要性。他指出，通过询问“用户如何控制汽车？”而不是“用户如何调整泵入每个活塞的燃料速率？”，你更有可能为驾驶员提供良好的体验（Arnold,\
  \ 2005）。\n\n### 开发用例\n\n每个用例都描述了一个参与者（actor）试图实现的目标。参与者是系统的外部实体，负责发起交互，例如人类用户、设备或另一个软件。每个参与者在与系统交互时可能有不同的角色。例如，数据库的单个参与者可能担任管理员、开发人员或数据库用户的角色。因此，处理创建用例过程良好方法是：\n\
  \n1. 识别系统的所有参与者以及他们各自拥有的角色\n2. 识别每个角色需要完成的所有目标\n3. 为每个目标创建用例。\n\n每个用例都应该使用问题领域的词汇用通俗易懂语言编写。它的命名应该描述参与者所获得的价值结果。用例的每一步都应该以角色开头，后跟一个主动动词。例如，继续我们的\
  \ ATM 示例，以下步骤描述了如何验证用户的 PIN 码：\n\n* `Step 1.` 用户插入 ATM 卡。\n* `Step 2.` 系统验证 ATM\
  \ 卡是否可供 ATM 机器使用。\n* `Step 3.` 系统提示用户输入 PIN 码。\n* `Step 4.` 用户输入 PIN 码。\n* `Step\
  \ 5.` 系统检查 PIN 码是否正确。\n\n### 用例模板\n\n良好的用例代表了单一行为单元的以目标为导向的叙述性描述。它包含一组清晰的步骤，描述了实现用例目标的工作流。它还可以提供清晰的前置条件和后置条件，以指定用例执行前后的系统状态（即显式说明用例之间的依赖关系，以及导致用例启动的触发事件）。\n\
  \n用例可以用不同程度的形式化和详尽程度进行记录。例如，它们可以简单如几句话，也可以像符合特定模板的结构化、交叉引用规范一样正式。它们甚至可以用视觉方式描述，例如使用统一建模语言（UML）用例图（Cockburn,\
  \ 2000）。\n\n在更正式的情况下，有许多不同的模板格式和样式用于用文本表示用例。这些模板往往具有很强的项目针对性，可以根据项目的需要而变得短短或详尽。不要纠结于模板的细节。与其遵循僵化的表示法，不如清晰地传递需求更为重要（Alexander,\
  \ 2003）。尽管如此，用例模板的几个共同元素包括：\n\n### 编写良好的用例\n\n编写用例应该是一个直观的过程。它们用通俗易读的语言编写，以捕获用户对如何使用\
  \ API 的观点。然而，即使是这些看似直观的任务，也能从通用指南和建议中受益。\n\n1. **使用领域术语。** 用例的描述应该使用对于 API 客户端来说自然的术语。所使用的术语应该是用户所熟悉的，并源于所目标领域。实际上，用户应该能够阅读用例并轻松理解场景，而不会显得太刻意。\n\
  \n2. **不要过度规范用例。** 用例应该描述系统的黑盒功能（即，应避免实现细节）。你还应该避免在用例中包含过多的细节。Alistair Cockburn\
  \ 使用了自动售货机投入硬币的例子。与其尝试指定正确数量的不同组合，例如“人员插入三枚季度币，或 15 枚镍币，或一枚季度币后接 10 枚镍币”，你只需要写成“人员投入钱”。\n\
  \n3. **用例并不定义所有需求。** 用例并没有涵盖所有可能的需求收集形式。例如，它们不代表系统设计、功能列表、算法细节或系统的任何其他非面向用户的部分。用例关注于用户如何与\
  \ API 交互的行为需求。除了用例之外，你可能仍然希望汇总功能需求和非功能需求。\n\n4. **用例并不定义设计。** 虽然你通常可以从用例中创建一个高层初步设计，但你不应陷入认为用例直接定义了设计的陷阱。它们没有定义所有需求是原因之一。例如，它们没有定义\
  \ API 的性能、安全或网络方面，而这些会极大影响最合适的设计。此外，用例是从用户的角度编写的。因此，你可能需要根据冲突或不精确的目标重新解释他们的反馈（Meyer,\
  \ 1997）。\n\n\n\n\n\n## 5. 不要在用例中指定具体设计。\n通常情况下认同，你应该避免在用例中描述用户界面（UI），因为 UI 是一种设计而非需求，而且\
  \ UI 设计更具变化性（Cockburn, 2000）。虽然这一公理不直接适用于无 UI 的 API 设计，但通过以下表述可以将其推及到我们的情况中：你应该将\
  \ API 设计细节排除在用例之外。用户可能会尝试为他们提出一个特定的解决方案供你实现，但针对该问题可能存在更好的解决方案。因此，API 设计应该从你的用例分析中得出的。换句话之，用例定义了用户想要如何实现目标，而不论实际设计如何。\n\
  \n## 7. 用例可以指导测试。\n用例本身并不是测试计划，因为它们没有指定具体的输入和输出值。然而，它们指定了用户期望能够实现的关键工作流。因此，它们是指导\
  \ API 自动化测试工作的极佳来源。编写一组验证这些关键工作流的测试，将给你信心，确保你已经满足了用户的需求，并且在未来演进 API 时不会破坏功能。\n\n\
  ## 8. 预留迭代的准备。\n不要太担心一次就完美完成所有的用例。用例分析是一个发现的过程；它帮助你更多地了解想要构建的系统。因此，你应该将其视为一个迭代过程，随着你对整个系统知识的扩展，你可以完善现有的用例（Alexander,\
  \ 2003）。另一方面，众众所周知，需求中的错误会严重影响项目，导致重大的重新设计和重新实现工作。这就是为什么我给出的第一条建议是避免将用例写得过于详细。\n\
  \n## 9. 不要坚持完全覆盖。\n由于用例不涵盖所有形式的需求（原因相同），你不应该期望用例能表达 API 的所有方面。然而，你也不需要它们覆盖所有内容。系统的某些部分可能已经有了充分的理解，或者不需要用户导向的视角。还有一个逻辑上的考虑是，你没有无限的时间和资源来编写详尽的用例，因此你应该将精力集中在最重要的用户导向目标和工作流上（Alexander,\
  \ 2003）。\n\n将所有信息整合在一起，我将通过展示一个输入 密码的示例用例来完成我们的 ATM 示例，并使用之前的模板来格式化用例：\n\n#### 需求与敏捷开发\n\
  敏捷开发是符合《敏捷宣言》原则的软件开发方法的通称。示例包括极端编程（`XP`）、`Scrum` 和动态系统开发方法。敏捷宣言（[`agilemanifesto.org/`](http://agilemanifesto.org/)）由\
  \ 17 位贡献者于 2001 年 2 月编写，他们希望找到比当时传统的开发流程更轻量、更灵活的替代方案。它指出，在开发软件时应该重视以下品质：\n\n1. **个体和交互**优于流程和工具\n\
  2. **可运行的软件**优于详尽的文档\n3. **客户合作**优于合同谈判\n4. **响应变化**优于遵循计划\n\n因此，敏捷方法论弱化了以文档为中心的流程，转而倾向于对可运行的代码进行迭代。然而，这并不意味着它们没有需求。这意味着需求是轻量且易于更改的。维护一份巨大的、冗长的、正式的需求文档不会被认为是敏捷的。然而，用例的通用概念是\
  \ `Scrum` 和 `XP` 等敏捷过程的重要组成部分，这些过程强调用户故事（user stories）的创建。\n\n用户故事（user story）是一个层级需求，包含了足够的信息，让开发者对实现该需求所需的工作提供合理的估计。它在概念上与用例相似，不同之处目标是保持它们非常短，通常只有一句话。因此，简短的非正式用例比正式模板驱动或\
  \ `UML` 用例更类似于用户故事。另一个重要区别是，用户故事并不是一次性完成的。许多用户故事会随着工作代码的演进增量添加。也就是说，你尽早开始为设计编写代码，以避免丢弃在尝试实现后变得无效的规范。\n\
  \n用户故事的另一个重要方面是它们是由项目利益相关者编写的，而不是开发者：即对开发的产品感兴趣的客户、供应商、业务所有者或支持人员。保持用户故事简短允许利益相关者在几分钟内完成它们。Mike\
  \ Cohn 建议使用简单的格式来描述用户故事（Cohn, 2004）：\n\n* 作为一个[*角色*]，我想要 [*某事*]，以便于 [*收益*]。\n\n\
  例如，回到我们的 ATM 示例，这里有五个与自动取款机交互的不同用户故事示例：\n\n1. 作为一名客户，我想提取现金，以便我可以买东西。\n2. 作为一名客户，我想从储蓄账户转账到支票账户，以便我可以开具支票。\n\
  3. 作为一名客户，我想向账户存款，以便我增加账户余额。\n4. 作为银行业务所有者，我希望安全地验证客户身份，以便 ATM 防止欺诈活动。\n5. 作为一名\
  \ ATM 操作员，我想为 ATM 补充现金，以便 ATM 有现金提供给客户。\n\n给定一组编写良好的用户故事，工程师可以估计开发工作的规模（通常以故事点等抽象数量为单位），并开始实现这些故事。利益相关者通常还会提供用户故事的优先级，以帮助对所有故事堆列表的工作进行排序。然后，利益相关者会定期（例如在迭代评审期间）评估软件状态，并提供进一步的用户故事来专注于下一次迭代开发。换句话之，这意味着活跃的用户参与，并偏向迭代开发风格，而非创建大型的前期需求文档。\n\
  \nCohn 还提出了一个易于记忆的缩写来帮助创建良好的用户故事：`INVEST`，其中每个字母代表一个良好用户故事的品质（Cohn, 2004）：\n\n*\
  \ **I**ndependent（独立的）\n* **N**egotiable（可协商的）\n* **V**aluable（有价值的）\n* **E**stimable（可估算的）\n\
  * **S**mall（小的）\n* **T**estable（可测试的）\n\n我之前为编写良好用例所提供的所有建议同样适用于用户故事。例如，像 `SCRUM`\
  \ 和 `XP` 等敏捷过程并不会告诉你如何设计 API。因此，你不能忘记，当你构建了用户故事堆列表后，仍然需要通过一个独立的设计过程来研究出实现这些故事的最佳方法。\n\
  \n\n\n\n\n当我回思在皮克斯等动画工作室制作 3D 特色动画电影的过程时，我认为可以得出一些非常好的类比。动画电影是使用制作流水线开发的，通常情况下，一个部门的输出会作为下一个部门的输入。制作的第一年或第二年由故事部门驱动，该部门定义了电影的主角色和整体故事情节。它还能产生诸如故事板（storyboards）和角色研究等物理资产。只有当这些工作进展到一定程度，才会进行数字制作工作。我相信，皮克斯电影的成功很大程度上归功于在启动昂贵的制作阶段之前，对故事元素进行定义和精炼的早期强调。\n\
  \n与软件开发的类比是，一个成功的项目应该有一个强大的产品团队，在初期定义该产品的用户和功能。这可能包括开发各种资产，如用户画像建模、需求收集和用例定义。只有在此之后，工程师才开始编写生产代码。这并不是说在定义产品期间从未编写过代码。显然，可以编写原型和进行调查来解决已知的技术挑战或大风险领域。但如果你甚至不知道你的用户是谁，以及他们需要解决什么问题，那么编写代码就没什么意义了。\n\
  \n这种制作流水线的类比听起来像是我主倡传统的瀑布式软件开发方法，但并不是。一旦你确定了要构建什么，开发软件实现的方法可以是你想要的任何方式。在初期深度思考你的用户和产品设计的建议仍然可以与基于敏捷冲刺（sprint-based）的工程相结合相结合一旦解决了重大的设计问题，你也可以对设计工作开始使用更敏捷的过程，例如在一个冲刺期间设计较小的功能，然后在下一个冲刺中让工程师实现它们。\n\
  \n## API 设计的要素\n\n最后，我们可以谈谈设计了！产生良好的 API 设计的秘密在于为问题领域提出合适的抽象（abstraction），然后设计出适当的对象和类层次结构来表示这种抽象。\n\
  \n抽象只是对某物的简化描述，在不需要了解其如何在程序中实现的情况下即可理解。它倾向于强调该事的重要特征和责任，而忽略对理解其基本本质不重要的细节。此外，你经常会发现复杂问题表现出抽象的层次结构或层（Henning,\
  \ 2009）。\n\n例如，你可以用六个基本组件以非常高的水平描述汽车的工作原理：燃料系统、发动机、变速箱、传动轴、轴和轮子。燃料系统提供驱动发动机的能量，导致变速箱旋转，而传动轴将变速箱与轴连接，允许功率传递到轮子并最终导致车辆向前移动。这是级别的抽象，对于理解汽车实现前进运动的最通用原理是有用的。然而，你也可以提供另一层抽象，为其中一个或多个组件中的一个或多个组件提供更多细节。例如，一台内燃机可以用若干个相互连接的组件来描述，包括活塞、曲轴、凸轮轴、分配器、飞轮和正时带。此外，发动机可以被分类为几种不同类型之一，例如内燃机、电动机、气电混合动力或氢燃料电池。\n\
  \n同样，大多数复杂软件系统的设计在多个细节级别上表现出结构，这些层次结构也可以从不同的方式来看。Grady Booch 建议，任何复杂系统都有两个重要的层次视图（Booch\
  \ et al., 2007）：\n\n1. **对象层次结构（object hierarchy）**：描述不同对象如何在系统中协作。这代表了基于对象之间“部分与组成”（part-of）关系的结构性分组（例如，活塞是发动机的一部分，发动机是汽车的一部分）。\n\
  2. **类层次结构（class hierarchy）**：描述相关对象之间共享的结构和行为。它处理对象属性的泛化和特化。这可以被认为是对象之间的“是一种”（is-a）层次结构（例如，混合动力发动机是一种汽车发动机）。\n\
  \n在为软件系统制作设计时，这两种视图同样重要。图. 4.3 试图说明这两个概念，展示了相关对象的层次结构和继承行为与属性的类层次结构。\n\n与此相关，人们通常认为软件构建的设计阶段由两个主要活动组成（Bourque\
  \ et al., 2004）：\n\n1. **架构设计（Architecture design）**：描述软件的顶层结构和组织。\n2. **详细设计（Detailed\
  \ design）**：以足够的描述设计的单个组件，使其可以实现。\n\n因此，作为一种通用方法，我建议定义一个对象层次结构来勾定系统的顶层概念结构（或架构），然后用类层次结构对其进行完善，指定供客户端使用的具体\
  \ `C++` 类。定义 API 类类的过程还涉及思考它们提供的单个函数和参数。因此，本章的其余部分将依次关注这些主题：\n\n![image](img/f04-03-9780443222191.jpg)\n\
  \n图 4.3 汽车设计显示为 (A) 部分与组成的对象层次结构。\n\n1. 架构设计。\n2. 类设计。\n3. 函数设计。\n\n![image](img/f04-03b-9780443222191.jpg)\n\
  \n图 4.3 (B) 是“是一种”类层次结构。箭头从更具体的类指向更通用的类。\n\n## 架构设计\n\n软件架构描述了整个系统的粗粒结构：API 中顶层对象的集合以及它们相互之间的。通过开发架构，你可以从抽象上理解系统的不同组件，以及它们如何相互通信和协作。\n\
  \n花时间思考 API 的顶层架构是非常重要的，因为架构中的问题会对你的系统产生深远的影响。因此，在本节中，我将详细介绍制作 API 架构的过程，并对如何将问题领域分解为合适的抽象对象集合提供见解。\n\
  \n### 开发架构\n\n对于任何给定的问题，架构没有对错。如果你给两个不同的架构师同样的 set 需求，你无疑会得到两种解决方案。重要的方面是产生一个深思熟虑的有目的设计，它提供了一个实现系统的框架，并解决了各种冲突需求和约束之间的权衡(Bass\
  \ et al., 2003）。从高层来说，创建 API 架构的过程可以分为四个基本步骤：\n\n1. 分析影响架构的功能需求。\n2. 识别并考虑架构的约束条件。\n\
  \n\n\n\n\n- 3. 发明系统中的主要对象及其关系。\n- 4. 交流并记录架构。\n\n这些步骤中的第一步取决于早期的需求收集阶段（请参考图 4.1），无论它是基于正式的功能性需求文档、一组面向目标的用例，还是一系列非正式的用户故事。第二步涉及捕获并考虑所有对你所设计的架构产生约束的因素。第三步涉及定义系统的高层对象模型：关键对象以及它们之间的相互关系。最后，应该将架构传达给必须实现它的工程师。图\
  \ 4.4 展示了这些步骤的每一步。\n\n需要强调的是，这一系列步骤并不是一种你只需执行一次就能神奇般地获得完美架构的配方。正如我所说的，软件设计是一个迭代过程。你很少能在第一次就让每一步都是正确的。另一方面，你的\
  \ `API` 的第一个版本至关重要，因为在那之后的任何更改将产生更高的成本。因此，尽早尝试你的设计，并在发布给客户之前进行增量改进是非常重要的，因为他们将开始在自己的程序基于此进行构建。\n\
  \n![image](img/f04-04-9780443222191.jpg)\n\n图 4.4 开发应用程序接口架构的步骤：(1) 收集用户需求，(2) 识别约束，(3)\
  \ 发明关键对象，以及 (4) 交流设计。\n\n### 架构约束\n\n`APIs` 并不是在真空中设计的。总会有因素影响并限制架构。因此，在设计过程正式开始之前，你必须识别并适应这些因素。Christine\
  \ Hofmeister 和合作者将这一阶段称为全局分析（Hofmeister et al., 2009）。在这方面，“全局”一词意味着这些因素是从整体上影响系统的，并且作为一个群体时，它们往往是互相互依赖且相互矛盾的。这些因素分为三大类：\n\
  \n1. 组织因素，例如：\n    - a. 预算\n    - b. 进度\n    - c. 团队规模和专业知识\n    - d. 软件开发流程\n \
  \   - e. 子系统的“自制还是外购”决策\n    - f. 管理重点（例如：日期 vs 特性 vs 质量）\n2. 环境因素，例如：\n    - a.\
  \ 硬件（例如：机顶盒或移动设备）\n    - b. 平台（例如：Windows、Mac 和 Linux）\n    - c. 软件约束（例如使用其他 APIs）\n\
  \    - d. 客户端/服务器约束（例如：构建 Web 服务）\n    - e. 协议约束（例如：邮件客户端使用 POP 与 IMAP）\n    - f.\
  \ 文件格式约束（例如：必须支持 GIF 和 JPEG 图像）\n    - g. 数据库依赖（例如：必须连接到远程数据库）\n    - h. 子系统的“暴露还是封装”决策\n\
  \    - i. 开发工具\n3. 运营因素，例如：\n    - a. 性能\n    - b. 内存占用\n    - c. 可靠性\n    - d.\
  \ 可用性\n    - e. 并发性\n    - f. 可定制性\n    - g. 可扩展性\n    - h. 可脚本性\n    - i. 安全性\n\
  \    - j. 国际化\n    - k. 网络带宽\n\n软件架构师的任务是对这些因素结合功能性需求中包含的用户约束进行优先级排序，并找到最佳的折中方案，以产生一个灵活且高效的设计。针对目标受众仔细设计\
  \ `API` 只能提高其易用性和成功率。然而，不存在所谓的完美设计；一切都关乎于给定的组织、环境和运营约束之间的权衡。例如，如果你被迫在紧迫的进度下交付结果，那么你可能不得不专注于一个更简单的设计，尽可能地利用第三方\
  \ `APIs` 并限制支持的平台数量。\n\n某些约束是可以协商的。例如，如果客户的某项需求给系统带来了过度的复杂度，客户可能愿意接受一种成本更低或交付更快的替代方案。\n\
  \n除了识别影响你初始架构的因素外，你还应该评估这些因素中哪些在开发过程中容易发生变化。例如，软件的第一个版本可能扩展性一般，但你知道你最终会想要移动到插件模型，让用户添加自己的功能。另一个常见的例子是国际化。你起可能并不关心支持超过一种语言，但稍后这可能会变成一个新需求，而且会对代码产生深远的影响。因此，你的设计应该预见到你合理预期会变化的约束。你可能设计出一个能够支持变更的设计；如果这不可行，你可能需要考虑备选计划。这通常被称为面向变更的设计（Parnas,\
  \ 1979）。\n\n同样考虑如何让你的设计与你项目将依赖的任何 API 的更改隔离也是值得的。如果你对另一个 `API` 的使用完全是内部的，那么就没有问题。然而，如果你需要在公共接口中暴露依赖\
  \ `API` 的概念，你应该考虑是否可以限制其可见程度。在某些情况下，这可能并不实际。但在其他情况下，你可能为依赖 `API` 提供封装器，以便不强制你的客户端直接依赖该\
  \ API。例如，`KDE` `API` 构建在 `Qt` 库之上。但是，`KDE` 对 `Qt` `API` 使用了薄封装，使得用户不会直接依赖 `Qt` `API`。具体例子是\
  \ `KDE` 提供了 `KApplication`、`KObject` 和 `KPushButton` 等类，而不是直接暴露 `Qt` 的 `QApplication`、`QObject`\
  \ 和 `QPushButton` 类。这样封装依赖 API 为你提供了额外的中间层，以防止依赖 API 的更改并绕过漏洞或特定平台的限制。\n\n最后，在开发架构时需要注意一些常见的陷阱。特别是如果你在大型组织中工作，你应该了解康威定律及其后果。康威最初将他的定律定义为（Conway,\
  \ 1968）：\n\n> 任何设计系统（广义上）的组织都会产生一个结构是其组织结构拷贝的设计。\n\n——梅尔文·E·康威。\n\n\n\n\n该法则对软件设计的启示是：如果你在一个拥有许多需要协作完成整体设计的独立小组的组织中工作，那么最终产生的设计很可能由代表这些独立小组关注重点的部分组成。这种做法的好处是，你至少有一支工程师团队在解决这个问题；但其负面影响是，这可能无法产生解决问题的最佳设计。埃里克·S·雷蒙德（Eric\
  \ S. Raymond）曾为康威法则举例，指出：“如果你有四个小组开发一个编译器，你就会得到一个四遍的编译器。”因此，在为大型系统构建软件架构时，最好经常反思：所开发的设计是否是解决问题的最佳方案，还是仅仅对各个团队已经拥有的组件进行了重新包装。一个需要注意的特定问题是，如果这些组件是独立且孤立地开发的，它们可能无法作为一个连贯的整体良好工作，或者无法完全解决正在处理的新问题。\n\
  \n### 识别主要抽象\n\n一旦你分析了系统的需求和约束条件，就可以开始构建高层对象模型了。本质上，这意味着要识别问题领域中的主要抽象，并将它们分解为相互连接的对象的层次结构。图\
  \ 4.5 展示了这一过程的示例。它展示了 `OpenSceneGraph` API 的顶层架构，这是一个用于视觉仿真应用的开源 3D 图形工具包（[`www.openscenegraph.org/`](http://www.openscenegraph.org/)）。\
  \ \n\n![image](img/f04-05-9780443222191.jpg)\n\n图 4.5 `OpenSceneGraph` 应用程序接口的顶层架构示例。\n\
  \n通过基于问题领域中的实际概念来构建架构，你的设计应该保持通用性，并对未来的需求变化具有健壮性。记得我在 第 2 章 中列出的第一项 API 质量：良好的 API\
  \ 应该对问题领域进行建模。然而，将一个问题分解为一组良好的抽象并非易事。对于像编写编译器或 Web 服务器这样已经被充分理解的问题，你可以利用许多其他设计者随时间推移提炼并发表的集体知识。然而，对于那些很少或没有先验研究的新问题，发明一种良好的分类任务绝非显而易见。\n\
  \n这并不是计算机科学特有的问题。自亚里士多德时代以来，将我们星球的生物学分类为逻辑分类法一直是争论的领域。在 18 世纪，卡罗尔·林奈（Carolus Linnaeus）提出了一个生命双界模型，由植物和动物组成。该模型后来在\
  \ 19 世纪得到完善，包含了微型生命形式。电子显微镜的现代进展将界的数量增加到了五个或六个。然而，21 世纪的研究挑战了传统的“界”观点，并提出了替代的超群模型。此外，关于应该使用哪些特征创建分类的主题也引发了许多讨论。亚里士多德根据繁殖方式对动物进行分类，双名法根据形态（相似的结构或外观）对生物进行分组，而达尔文启发的分类法则倾向于根据共同起源分类（生物是否具有共同祖先）。\n\
  \n### 发明关键对象\n\n尽管分类系统中的主要抽象很困难，我仍然就如何处理这一问题提供一些建议。因此，这里有几种技术可以可以将系统分解为一组关键对象，并识别它们之间的关系（Booch\
  \ et al., 2007）：\n\n1. **自然语言。** 通过类比自然语言可以观察到（通常情况下）名词倾向于表示对象，动词表示函数，形容词和物主名词表示属性（Bourque\
  \ et al., 2004）。我可以回到 第 2 章 中的地址通讯录 API 来说明这一点。地址通讯录和“人”的现实世界概念都是名词，代表 API 中的关键对象是有意义的；而“向地址通讯录添加人员”或“为人员添加电话”等操作是动词，应该被表示为对它们修改的对象的函数调用。然而，人的名字是一个物主名词，作为\
  \ `Person` 对象的属性比作为普通属性更合理。\n\n2. **属性。** 这种技术涉及将具有相似属性或性质的对象进行分组。这可以使用离散类别完成，即每个对象明确属于某类或不是。\n\
  \n3. **行为。** 这种方法通过对象共享动态行为进行分组。这涉及确定系统中的行为集，并将这些行为分配给不同的部分。然后你可以通过识别这些行为的启动者和参与者来导出对象集。\n\
  \n4. **原型。** 在这种方法中，你尝试为最初识别的对象发现更通用的原型。例如，豆袋椅、吧凳和躺椅都是椅子的类型，尽管它们的形状不同。然而，你可以根据它们展示椅子功能的程度来对它们进行分类。\n\
  \n5. **领域（Shlaer-Mellor）。** Shlaer-Mellor 方法首先水平划分系统以创建通用领域，然后通过对每个领域进行单独分析来垂直划分（Shlaer\
  \ and Mellor, 1988）。这种分治法的好处之一是领域往往形成可以应用于其他设计问题的复用概念。例如，使用之前的 ATM 示例，领域可以是以下：\n\
  - **实体领域**，如 ATM 机或银行钞票。\n- **角色领域**，如 ATM 用户或银行所有者。\n- **事件领域**，如金融交易。\n- **安全领域**，如身份验证和加密。\n\
  - **交互领域**，如输入 密码或取款。\n- **日志领域**，用于系统记录信息。\n\n6. **领域（Neighbors）。** 詹姆斯·内蒙德（James\
  \ Neighbors）创造了“领域分析”一术，指发现问题领域中所有应用程序共享的类和对象的技术（Neighbors, 1980）。这是通过分析问题领域的相关系统来发现共同领域，例如识别所有缺陷跟踪系统的共同元素或所有家谱程序的通用功能。\n\
  \n7. **领域（Evans）。** 与内蒙德的领域分析相关的问题是“领域驱动设计”。这由埃里克·范万（Eric Evans）引入，旨在使用演进的核心业务概念模型为复杂系统生成设计（Evans,\
  \ 2003）。\n\n\n\n\n\n当你有一组组织良好且结构化的用例作为工作基础时，这些技术中的大多数效果最好。例如，用例通常以句子的形式构建，其中某个实体执行某些动作，通常是针对另一个实体或对另一个实体的操作。因此，你可以通过以下步骤将其作为自然语言分析的输入：提取每个用例的步骤，识别主语或宾语名词，并利用这些名词开发出初始的对象候选列表。\n\
  \n这些每种技术都可能涉及不同程度的形式化方法。例如，自然语言分析并不是一种非常严谨的技术，通常被形式化设计方法论的支持者所反对。这是因为自然语言本质上具有歧义性，可能会不精确地表达问题领域的重要概念，或者忽略重大的架构特征。因此，你应该警惕不要天简单地将用例中的所有名词翻译为关键对象。在理想情况下，你应该将此分析的结果视为初始候选列表，并在此基础上进行进一步的仔细分析和精炼\
  \ (Alexander, 2003)）。这种精炼可能涉及识别模型中的任何缺口、考虑是否可以从列表中提取更通用的概念，并尝试对相似概念进行分类。\n\n相比之下，有几种用于生成软件设计的的形式化技术，包括文本和图形表示。一种特别广泛的技术是\
  \ `UML` (Booch et al., 2005)。`UML` 可以使用一组图形图表视觉化地指定和维护软件设计。例如，`UML` 2.3 包含 14 种不同类型的图，用于表示设计的各种结构和行为方面\
  \ (Fig. 4.6)。作为一个具体的例子，`UML` 序列图描述了对象之间函数调用的顺序。这些可以在分析阶段用于以图形方式表示用例。然后，在设计阶段，架构师可以使用这些形式化图表来探索系统内部的对象交互，并充实顶层对象模型。\n\
  \n![image](img/f04-06-9780443222191.jpg)\n\nFigure 4.6 通用建模语言 (UML) 2.3 的 14 种图类型。\n\
  \n形式化设计表示也可以用于生成实际代码。这范围从类图简单翻译为对应的源代码等价物，到更全面的可执行架构概念。后者是对架构的足够详细的描述，可以被转换为可执行的软件并在目标平台上运行。例如，它演变变成了一种名为\
  \ `Executable UML` 的 `UML` 档 (Mellor and Balcer, 2002)，这本身成为了模型驱动架构 (MDA) 的基石。这种方法背后的基本原理是模型编译器获取多个可执行的\
  \ `UML` 模型（每个模型定义了一个不同的交叉关注点或领域），并将它们组合以生成高层可执行代码。可执行架构的支持者注意到了这涉及的双双语言问题：拥有一种建模语言（例如\
  \ `UML`），它被翻译成另一种编程语言（例如 `C++`、`C#` 或 `Java`）。因此，许多支持者认为需要一种可以桥接这两个关注点的单一语言。\n\n\
  ### 架构模式\n\n在第 3 章 中，我涵盖了用于解决软件设计中重复问题的各种模式，如 `Singleton`（单例）、`Factory Method`（工厂方法）和\
  \ `Observer`（观察者）。这些模式倾向于提供可以在组件级实现的解决方案。然而，存在一类被称为架构模式的软件模式，它们描述了整个系统更大规模的结构和组织。因此，当你构建一个良好映射到特定架构模式的\
  \ API 时，这些解决方案中的某些可能对你有用。以下列表对几种较流行的架构模式进行了分类 (Bourque et al., 2004)：\n\n1. **结构化模式**：分层\
  \ (Layers)、管道与过滤器 (Pipes and Filters) 和黑板 (Blackboard)\n2. **交互系统**：模型-视图-控制器 (`MVC`)、模型-视图-呈现者\
  \ (Model-View-Presenter) 和表示-抽象-控制 (Presentation-Abstraction-Control)\n3. **分布式系统**：客户端/服务器\
  \ (`Client/Server`)、三层 (`Three-Tier`)、对等网络 (`Peer-to-Peer`) 和代理 (`Broker`)\n4. **可适配系统**：微内核\
  \ (`Microkernel`) 和反射 (`Reflection`)\n\n许多架构模式提供了优雅的设计，以避免系统不同部分之间的依赖问题，例如我在第 3\
  \ 章 中讨论过的 `MVC` 模式。此时，值得注意的是，系统的另一个重要视图是物理视图。我在图 3 中展示过这种视图的示例，其中我展示了构成复杂应用程序的层。即使在单个\
  \ API 中，你可能也有不同的层，如图 4.7 所示所示：\n\n1. 与 API 无关的低级例程，例如字符串处理、数学函数\n2. 实现主要功能的核心业务逻辑\n\
  3. 允许用户扩展基础的插件或脚本 API\n4. 构建在核心之上的便利 API\n5. 提供视觉结果的表示层\n\n在这种情况下，在不同层之间施加严格的依赖层次是非常重要的；否则你会在层之间产生循环依赖\
  \ (图 4.7)。对于层内的单个组件也是如此。一般的观察结果是，底层组件不应依赖于高层组件。例如，核心业务逻辑不能依赖你的便利 API，回到 `MVC` 架构模式，你会注意到\
  \ `View` 依赖于 `Model`，但反之则不然。David L. Parnas 将这一概念称为无循环层次结构 (Parnas, 1979)。\n\n![image](img/f04-07-9780443222191.jpg)\n\
  \nFigure 4.7 应用程序接口 (API) 的架构层示例，显示了两个组件之间的循环依赖。\n\n循环依赖在许多方面都是糟糕的。例如，这意味着你无法独立地测试每个组件，并且在不引入另一个组件的情况下无法重用其中一个。基本上，为了理解其中任何一个组件，都需要理解两个组件\
  \ (Lakos, 1996)。如果你被迫将多个组件合并成一个巨大的大组件（如附侧边栏所述），这也会影响你的开发速度。在第 2 章 中，我介绍了各种解耦依赖的技术，例如回调、观察者和通知系统。从根本上说，API\
  \ 应该是逻辑相关组件的无环层次结构。\n\n\n\n\n\n### 架构交流\n\n一旦开发了架构，就可以以多种方式进行记录。这涵盖了从简单的图表或 wiki\
  \ 页面，到各种为架构提供建模符号的正式方法，例如 `UML` 或架构描述语言集（Medvidovic and Taylor, 2000 ）。\n\n无论你采用哪种方法，记录架构都是向工程师传达设计的重要因素。这样做可以为他们提供更多信息，以便根据你的愿景实现系统，并确保未来的更改能够继续保持架构的意图和完整性。如果开发团队规模较大或分布在不同区域，这一点尤为重要。\n\
  \n你应该在架构文档中包含的元素之一是整体设计的合理性（rationale）：即考虑了哪些替代设计和权衡，以及为什么最终的结构被认为是优越的。这种设计理由对于设计的长期维护非常重要，并且避免未来的设计师重走你曾经走过的死胡同同。事实上，Martin\
  \ Robillard 指出，如果 API 用户不理解其高层架构和设计意图，他们通常发现很难学习和使用该 API（Robillard, 2009 ）。\n\n\
  交流还允许对设计进行同行评审，并在 API 发布之前接收反馈并进行改进。事实上，在过程早期实施设计评审，以促进架构师、开发者和客户之间的沟通，将帮助你产出更完备、更耐用的设计。如果\
  \ API 架构师也编写部分代码，那么这可以作为通过实际操作贡献来交流设计原则的绝佳方式。\n\n尽管现代敏捷开发方法降低了文档密集型流程的重要性，因为设计文档经常会过时，但仍然有必要根据系统架构提供尽可能多的文档，但绝不能过量。通过直接交流来增强任何文档可能会产生更高的效率。这允许设计者和实现者之间进行对话，并避免在阅读规范时可能发生的误解。归根底，架构师的工作是成为热情的交流者，随时回答工程师的问题，并确保使用最有效的渠道来保持架构交流的持续活跃（Faber,\
  \ 2010 ）。\n\n## 类设计\n\n在有了高层架构后，你可以开始精炼设计，以描述特定的 `C++` 类及其与其他类的关系。这是详细设计，与顶层架构设计形成对比。它涉及识别客户端将使用的实际类、这些类如何相互关联，以及它们的主要函数和属性。对于足够大的系统，这还可以涉及描述类如何组织成子系统。\n\
  \n对你 API 中的每一个类进行设计对于除最微不足道的系统来说都是多此一举的。相反，你应该关注定义了最重要功能的主要类。一个很好的准则是所谓的 80/20 原则（即，你应该集中精力定义系统\
  \ 80% 行为的 20% 的类上）（McConnell, 2004 ）。\n\n### 面向对象的概念\n\n在我进一步详述面向对象设计的细节之前，让我们花一点时间回顾一些主要的面向对象原则及其在\
  \ `C++` 中的表示。你可能已经非常熟悉这些概念了，但为了完整性并确保我们处于同一认知水平上，让我们在这里简要总结一下：\n\n1. **类（Class）**：`class`\
  \ 是对象的抽象描述或规范。它定义了对象的成员数据和成员函数。\n2. **对象（Object）**：`object` 是一个具有状态、行为和标识的实体（Booch\
  \ et al., 2007 ）。它是使用 `C++` 中的 `new` 运算符在运行时创建的具体类的实例。具体类是那些经过完全指定的类（例如，它没有未定义的纯虚成员函数）。\n\
  3. **封装（Encapsulation）**：这一概念描述了将数据和方法划分成单一对象，并带有 `public`、`protected` 和 `private`\
  \ 等访问控制规范，以支持隐藏实现细节。\n4. **继承（Inheritance）**：这允许对象从父类继承属性和行为，并引入它们自己的额外数据成员和方法。以此方式定义的类被称为父类（或基类）的派生类（或子类）。子类可以覆盖（override）任何基类方法，尽管通常你只想在该基类方法被声明为\
  \ `virtual` 时才这样做。纯虚方法（通过在其声明末尾附加“=0”来指示）是子类必须提供该方法实现才能成为具体的类（即允许创建它的实例）。`C++` 支持多重继承，意味着子类可以继承自多个基类。公有继承通常被认为是两个对象之间的“是一个（is-a）”的关系，而私有继承代表了某种“曾是一个（was-a）”的关系（Lakos,\
  \ 1996 ）。\n5. **组合（Composition）**：这是继承的一种替代技术，通过组合一个或多个简单对象来创建复杂对象。这是通过在更复杂的对象内部声明简单的对象来实现的。“拥有（has-a）”关系用于描述类持有另一个类型实例的情况。“持有（holds-a）”关系描述类持有指向另一种类型的指针或引用。\n\
  6. **多态（Polymorphism）**：这是一种类型表现得并像另一种类型一样的能力。这允许不同类型的对象在符合相同接口的情况下互相使用。这是因为 C++\
  \ 编译器可以在运行时延迟检查对象的类型，这种技术被称为晚绑定或动态绑定。`C++` 模板的使用也可以用于提供静态（编译时）多态。\n\n### 类设计选项\n\
  \n对于类的创建，有许多因素需要考虑。正如 Scott Meyers 所指出的，创建一个类涉及定义一个新类型。因此，你应该将类设计视为类型设计，并以 `C++`\
  \ 设计师对待内置类型时同样的深熟和关注来对待这项任务（Meyers, 2005 ）。\n\n在这里我列出了在你开始设计新类时应该问自己的一些主要问题。这并非旨在列举详尽，但它应该提供一个良好的起点，帮助你定义设计的主要约束：\n\
  \n1. **继承的使用**：将该类添加到现有的继承层次中是否合适？应该使用公有继承还是私有继承？是否应该支持多重继承？这会影响你是否需要考虑哪些成员函数应该是虚函数。\n\
  2. **组合的使用**：将相关对象作为数据成员持有比直接继承自它更合适？\n3. **抽象接口的使用**：该类是否旨在作为一个抽象基类，其中子类必须覆盖各种纯虚成员函数？\n\
  \n\n\n\n\n4. **使用标准设计模式。** 你是否可以将已知的设计模式应用于类设计中？这样做可以让你从深思熟虑且精炼的设计方法中获益，并让你的设计更容易被其他工程师使用。\n\
  \n5. **初始化与析模型。** 客户端将使用 `new` 和 `delete` 还是将使用工厂方法？你是否会为类重写 `new` 和 `delete` 以自定义内存分配行为？你会使用智能指针吗？\n\
  \n6. **定义拷贝构造函数和赋值运算符。** 如果类分配了动态内存，你需要这这两项，以及一个析构函数。这被称为“三规则”（Rule of Three），我将在下一节\
  \ `C++ Usage` 中介绍它。这将影响你的对象如何被复制和按值传递。\n\n7. **使用模板。** 你的类定义的是一组类型而不是单一类型吗？如果是，你可能需要考虑使用模板来使你的设计泛化。\n\
  \n8. **使用 const 和 explicit。** 尽可能地将参数、返回结果和方法定义为 `const`。使用 `explicit` 关键字来避免单参数构造函数出现意外的类型转换。\n\
  \n9. **定义运算符。** 为你的类定义所需的运算符，例如 `+`、`*=`、`[]`、=` 或 `<<`。\n\n11. **定义类型转换。** 考虑你是否希望你的类能够自动转换为不同的类型，并声明相应的转换运算符。\n\
  \n12. **使用友元（friends）。** 友元破坏了类的封装性，通常是设计不良的迹象。请将它们作为最后的手段。\n\n13. **非功能性约束。** 性能和内存使用等问题可能会对类的设计产生限制。\n\
  \n### SOLID 原则\n\n在面向对象设计中，有一个常用的缩写叫做 `SOLID`。它为为任何系统构建对象模型时提供了一组良好的关键设计原则（Feathers,\
  \ 2004）。我在本书的各个部分涵盖了 `SOLID` 的许多方面，但在这里总结一下其核心原则：\n\n1. **S = 单一职责原则。** 这规定一个类的改变的原因应该只有一个（即一个对象应该只有一个职责）。我在之前的“特性”章节中讨论“不要重复自己”（DRY）原则时提到过这一原则。\n\
  \n2. **O = 开闭原则。** 这规定对象应该对扩展开放，但对修改关闭（即应该能够在不改变源代码的情况下修改类的行为）。我将在本章的稍后部分讨论这一原则。\n\
  \n3. **L= 里氏夫替换原则 (LSP)。** 这规定对象应该能够被该对象的子类替换而不改变任何行为。我将在本章的稍后部分讨论这一原则。\n\n4. **I\
  \ = 接口隔离原则。** 这规定客户端不应该依赖于它们不使用的接口。本质上，你应该将大型单体接口拆分为更小、更具体的接口。该原则的目标是减少耦合，我在之前的“特性”章节中详细介绍过这一点。\n\
  \n5. **D= 依赖倒置原则。** 这规定客户端应该依赖于抽象，而不是具体实现。该原则的目标通过让软件组件依赖于抽象接口来减少耦合。我在“特性”章节中涵盖了松耦合的方面，并在“模式”章节中涵盖了抽象接口。\n\
  \n### 使用继承\n\n到目前为止，你在设计类时面临的最大设计决策就是何时以及如何使用继承。例如，在你的 API 中，你应该使用公共继承、私有继承还是组合来关联相关类？因为继承是一个非常重要的主题，而且经常被误用或过度使用，我将在接下来的几节中关注类设计的这部分。让我们从一些通的设计建议开始：\n\
  \n1. **为继承设计或禁止继承。** 你能做出的最重要的决定是决定一个类是否应该支持子类。如果是，你必须深层次思考哪些方法应该声明为 `virtual` 并记录它们的行为。如果类不应该支持继承，传递此意的好方法是声明一个非虚析构函数。\n\
  \n2. **仅在适当的地方使用继承。** 决定一个类是否继承自另一个类是一项困难的设计任务。事实上，这也许是软件设计中最困难的部分。我将在下一节讨论 `LSP`\
  \ 时提供关于该主题的指导。\n\n3. **避免深层继承树。** 深层继承体系会增加复杂性，并不可避免地导致设计难以理解以及软件更容易出错。层级深度的绝对限制显然是主观的，但任何超过二三三级就已经太复杂了（McConnell,\
  \ 2004）。\n\n4. **使用纯虚成员函数强制子类提供实现。** 虚成员函数可以用于定义一个包含可选实现的接口，而纯虚成员函数仅用于定义一个接口，而不包含实现（尽管可以为纯虚方法提供回退实现）。当然，非虚方法用于提供子类无法更改的行为。\n\
  \n5. **不要向现有接口中添加新的纯虚函数。** 你确实应该设计带有纯虚成员函数的适当抽象接口。但是，请注意，在你将此接口发布给用户后，如果再向接口中添加新的纯虚方法，你将破坏所有客户端的代码。这是因为继承自抽象接口的客户端类在定义新纯虚函数的实现之前，将不再是具体类。\n\
  \n6. **不要过度设计。** 第 2 章 中提到一个良好的 API 应该是最小且完备的。也就是说，你应该抵制添加目前不需要的额外抽象层的诱惑。例如，如果你有一个基类在整个\
  \ API 中只被一个类继承，这表明你对系统的当前需求过度设计了解决方案。\n\n另一个重要的考虑因素是是否使用多重继承（即你是否会设计继承自多个基类的类）。Bjarne\
  \ Stroustrup 通过一个 `TemporarySecretary` 类的例子主张在 `C++` 中增加多重继承，该类同时继承自 `Secretary`\
  \ 和 `Temporary` 类（Alexandrescu, 2001）。然而，`C++` 社区对于多重继承是否是件好事意见不一。一方面，它提供了定义如前文\
  \ `TemporarySecretary` 示例之类的复合关系的灵活性。但这可能会以细微语义和歧义为代价，例如需要使用 `virtual inheritance`\
  \ 来处理菱形问题（一个类继承自两个或多个自身又继承自单一公共基类的基类）。\n\n\n\n\n\n大多数只允许继承单个基类的语言仍然支持继承多个更受限的类型。例如，`Java`\
  \ 允许你继承多个接口类，而 `Ruby` 允许你继承多个混入（mixins）。这些类允许你继承一个接口（在混入的情况下则还继承了实现）；然而，它们本身不能被实例化。同样，`Swift`\
  \ 编程语言允许类只继承自单个基类，但类可以符合多个协议，这与接口的概念类似。\n\n如果使用得当，多重继承可以是一项强大的工具（可以参考 `C++` 标准库中的\
  \ `iostreams` 类作为良好示例）。然而，为了保持接口的健壮和易用，我通常赞同 Steve McConnell 的观点，他建议你应该避免使用多重继承，除非是为了使用抽象接口或混入类（McConnell,\
  \ 2004））。\n\n有趣的是，`C++11` 规范引入了若干项与继承相关的改进。与此处相关的是能够显式地指定你重写或隐藏基类虚方法的意图。这分别通过使用\
  \ `override` 和 `hiding` 属性来实现。这一功能对于避免诸如在派生类中拼错虚方法名称等错误非常有帮助。\n\n#### 里斯科夫替换原则 (Liskov\
  \ substitution principle)\n\n该原则由 `Barbara Liskov` 在 1987 年提出，为一个类是否应该被设计为另一个类的子类提供了指导（Liskov\
  \ and Zilles, 1974）。LSP 规定，如果 `S` 是 `T` 的子类，那么类型 `T` 的对象可以替换为类型 `S` 的对象而不产生任何行为变化。\n\
  \n初一看，这似乎是对“是一个（is-a）”继承关系的简单重述，如果 `S` 是 `T` 的更具体的类型，那么 `S` 就可以被视为 `T` 的子类型。然而，LSP\
  \ 的定义比“是一个”更具限制性。\n\n让我们用经典的椭圆形状类型来演示这一点：\n\n![image](img/u04-01-9780443222191.jpg)\n\
  \n然后你决定添加对 `circle` 类的支持。从数学角度来看，圆是椭圆的一种更具体的形式，其中两个轴被限制为相等。因此，将 `Sphere` 类声明为 `Ellipse`\
  \ 的子类是极很有诱惑力的。例如：\n\n![image](img/u04-02-9780443222191.jpg)\n\n随后 `SetRadius()`\
  \ 的实现可以将底层椭圆的长半径和短半径设置为相同的值，以强制圆的属性：\n\n![image](img/u04-03-9780443222191.jpg)\n\
  \n然而，这带来了几个问题。最明显的是，`Sphere` 将继承并暴露 `Ellipse` 的 `SetMajorRadius()` 和 `SetMinorRadius()`\
  \ 方法。这些方法可能被用于通过改变一个半径而不改变另一个半径，从而破坏我们球体的自一致性。你可以通过重写 `SetMajorRadius()` 和 `SetMinorRadius()`\
  \ 方法来处理这个问题，使每个方法都设置长短半径。然而，这引发了几个问题。首先，你必须回去将 `Ellipse::SetMajorRadius()` 和 `Ellipse::SetMinorRadius()`\
  \ 为 `virtual`，这样你才能在 `Circle` 类中重写它们。这应该提醒你正在做错。其次，你现在创建了一个非正交的 API：改变一个属性具有改变另一个属性的副作用。第三，你破坏了\
  \ LSP，因为你无法在不破坏行为的情况下将对 `Ellipse` 的使用替换为 `Sphere`，如下代码所示：\n\n![image](img/u04-04-9780443222191.jpg)\n\
  \n问题的根源在于你改变了从基类继承的函数的行为。\n\n所以，如果不使用公共继承来将球体建模为一种椭圆，那么你应该如何表示它呢？有两种主要方法可以让你在 `Ellipse`\
  \ 类的功能的基础上正确构建构建 `Sphere` 类：私有继承和组合。\n\n#### 私有继承\n\n私有继承允许你继承另一个类的功能，但不继承其公共接口。从本质上说，基类的的所有公共成员都变成了派生类的私有成员。这被称为“曾是一个（was-a）”关系，与公共继承的“是一个（is-a）”关系形成对比。例如，你可以重新定义你的\
  \ `Sphere` 类，以私有的方式继承 `Ellipse`：\n\n![image](img/u04-05-9780443222191.jpg)\n\n在这种情况下，`Sphere`\
  \ 不暴露 `Ellipse` 的任何成员函数（即没有公共的 `Sphere::SetMajorRadius()`）。因此，这种解决方案不会遭受与公共继承相同的问题。注意，如果你确实想暴露\
  \ `Ellipse` 的某个方法，可以这样做：\n\n![image](img/u04-06-9780443222191.jpg)\n\n### 组合\n\n\
  私有继承是修复违反 LSP 接口的快速方法。然而，优选方案是使用组合。这简单意味着不是类 `S` 继承自 `T`，而是 `S` 声明 `T` 为私有成员（拥有\
  \ has-a），或者 `S` 声明一个指向 `T` 的指针或引用作为成员（持有 holds-a）。例如：\n\n![image](img/u04-07-9780443222191.jpg)\n\
  \n那么 `SetRadius()` 和 `GetRadius()` 方法可能如下：\n\n![image](img/u04-08-9780443222191.jpg)\n\
  \n在这种情况下，`Ellipse` 的接口没有在 `Sphere` 中暴露。然而，`Sphere` 通过创建一个私有实例仍然基于 `Ellipse` 的功能。因此，组合提供了私有继承的功能等。这种倾向的主要原因是继承会导致更耦合的设计。当一个类继承另一个类型时（无论是公共、保护还是私有继承），子类都会访问基类的所有公共和保护成员，而通过组合，该类仅与另一个类的公共成员耦合。此外，如果你只持有指向另一个对象的指针，那么你的接口可以使用该类的前置声明而不是包含其完整定义。这带来了更大的编译时隔离并缩短了编译时间。最后，在不合适时不应强加继承关系。我们之前的讨论告诉我们，出于类型继承考虑，不应将球体视为椭圆。\n\
  \n\n\n\n\nOCP（开闭原则）后的核心思想是：一旦某个类完成并发布给用户，它应该只为了修复 bug 而修改。然而，新功能或更改的功能应该通过创建新类来实现。这通常通过继承或组合来扩展原始类来实现。不过，正如我在书后部分将提到的，你也可以提供一个插件系统，允许你\
  \ API 的用户扩展其基本功能。\n\n作为一个 OCP 实际运用的例子，我在第 3 章中介绍的简单工厂方法并没有对修改关闭，也未对扩展开放。这是因为向系统添加新类型需要更改工厂方法的实现。作为回记的回忆，这里是那个简单渲染器工厂方法的代码：\n\
  \n![image](img/u04-09-9780443222191.jpg)\n\n相比之下，我在第 3 章后部分介绍的可扩展渲染器工厂允许在不修改工厂方法的情况下扩展系统。这是通过允许客户端在运行时向系统注册新类型来实现的。因此，这种第二种实现演示了\
  \ OCP：不需要更改原始代码即可扩展其功能。\n\n然而，如果严格遵守 OCP，在现实世界的软件项目中它可能很难实现，甚至会与我在此处所提倡的某些良好 API\
  \ 设计的原则相背。在类发布后绝不更改其源代码的这一限制，在大规模复杂系统中通常是不切实际的，而任何行为的改变都应触发新类的创建这一规定可能会导致原始整洁且简约的设计被稀释和破坏。在这些情况下，OCP\
  \ 可能被认为是一种指导性的启发式方法，而不是一条硬性规则。此外，尽管一个良好的 API 应该尽可能可扩展，但 OCP 与书中特定的建议之间存在张力，即你应该以谨慎且节制的方式声明成员函数为虚。\n\
  \n尽管如此，如果我重新陈 OCP，意味着类的接口对更改关闭，而不是将该接口背后的精确实现视为不可更改的，那么你就有了一个与本书重点相当契合的原则。也就是说，维护一个稳定的接口可以让你具有灵活性，在不恰当影响客户端代码的情况下更改底层实现。此外，使用大量的回归测试允许你进行内部代码更改，而不影响用户所依赖的现有行为。使用适当的插件架构（参见第\
  \ 15 章\n\n迪米特法则（LoD），称为最小知识原则，是产生松耦合设计的指南。该规则由 Ian Holland 根据 20 世纪 80 年代末在东北大学开发\
  \ Demeter 项目的经验提出的 (Lieberherr and Holland, 1989)。它规定每个组件对其他组件的了解应该是有限的，即使如此，也仅限于密切相关的组件。这可以更简洁地表述为：只与直接朋友交谈。\n\
  \n当应用于面向对象设计时，LoD 意味着函数可以：\n\n1. 调用同一类中的其他函数\n2. 调用同一类数据成员的函数\n3. 调用它接受的任何参数的函数\n\
  4. 调用它创建的任何本地对象的函数\n5. 调用全局对象的函数（但你永远不应该有全局变量）\n\n作为推论，你不应该在通过另一个函数调用获取的对象上调用函数。例如，你应该避免如下的链式函数调用：\n\
  \n![image](img/u04-10-9780443222191.jpg)\n\n避免这种做法的一种方法是重构对象 `A`，使其提供直接访问对象 `B`\
  \ 功能的方法，从而允许你执行以下操作：\n\n![image](img/u04-11-9780443222191.jpg)\n\n或者，你可以重构调用代码，使其拥有实际的对象\
  \ `B` 来直接调用所需的函数。这可以通过在 `MyClass` 中存储对象 `B` 的实例或引用，或者将对象 `B` 传递给需要它的函数来实现。例如，\n\n\
  ![image](img/u04-12-9780443222191.jpg)\n\n这种技术的缺点是在类中引入了大量的薄层方法，增加了函数的参数数量，或者增加了对象的规模。然而，其好处是显式地传递对象使得代码更容易重构或演进。事实上，LoD\
  \ 的另一种应用是在对象 `A` 中创建一个聚合对象 `B` 的多个方法，这与依赖注入模式有相似之处。\n\n### 类命名\n\n虽然我在这些章节中主要关注面向对象设计的细节，但一旦你开发了合适的类，为这些类制定表现且一致的名称是同样的任务。因此，以下是类命名的一些指南：\n\
  \n1. 简单的类名应该是强有力的、描述性的且自明的。而且，它们在问题领域中应该是合理的，并根据它们所建模的对象命名（例如 `Customer`、`Bookmark`\
  \ 或 `Document`）。\n\n2. Joshua Bloch 表示，良好的命名驱动了良好的设计。因此，一个类应该只做一件事并并做好，类名应该立即传达其目的\
  \ (Bloch, 2008)。如果一个类难以命名，这通常是设计缺陷的信号。Kent Beck 提供了一个例子，他最初在一个图形系统中对一个对象使用通用复合名称\
  \ `DrawingObject`，但后来参考排版领域将其完善为更具表现力的术语 `Figure` (Beck, 2007)。\n\n3. 有时需要使用复合名称来传达更大的特殊性和精确，例如\
  \ `TextStyle`、`SelectionManager` 或 `LevelEditor`。然而，如果你使用了两个或三个单词以上，这可能表明你的设计过于混乱或复杂。\n\
  \n4. 接口和抽象基类倾向于代表对象模型中的形容词。因此，它们可以这样命名：`Renderable`、`Clonable` 或 `Observable`。或者，在接口类前加上大写字母\
  \ `I` 是常见的做法：例如 `IRenderer` 和 `IObserver`。\n\n6. 避免晦涩的缩写。良好的类名应该是易见的且一致的。不要让你的用户去记忆哪些名称缩写了，哪些没有。我将在稍后讨论函数命名时再次回到这一点。\n\
  \n\n\n\n\n7. 你应该为顶层符号（如类和自由函数）包含某种形式的命名空间，这样你的名称就不会与客户端可能使用的其他 API 中的名称发生冲突。这可以通过\
  \ C++ 的 `namespace` 关键字或使用短前缀来实现。例如，所有的 OpenGL 函数调用都以 `gl` 开头，所有的 Qt 类都以 `Q` 开头。\n\
  \n## 函数设计\n\nAPI 设计的最小粒度是你是如何表示单个函数调用及其参数的。尽管这看起来像是一项显而易见的练习，不值得详细介绍，但有许多函数层的问题会影响良好的\
  \ API 设计。毕竟，函数调用是 API 中最频繁使用的部分：它们是客户端访问 API 行为的方式。\n\n### 函数设计选项\n\n在设计函数调用时，你有许多接口选项可以控制（Lakos,\
  \ 1996）。首先，对于自由函数，你应该考虑以下替代方案：\n\n1. 静态函数与非静态函数\n2. 按值、引用或指针传递参数\n3. 以 const 或非\
  \ const 形式传递参数\n4. 使用带有默认值的可选参数\n5. 按值、引用或指针返回结果\n6. 以 const、`constexpr`、`consteval`\
  \ 或非 const 形式返回结果\n7. 运算符函数或非运算符函数\n8. 使用异常规范\n9. 使用如 `[[noreturn]]` 或 `[[deprecated]]`\
  \ 等属性\n\n对于成员函数，你应该考虑所有这些自由函数选项，以及：\n\n1. 虚成员函数与非虚成员函数\n2. 纯虚成员函数与非纯虚成员函数\n3. const\
  \ 与非 const 成员函数\n4. 公有、保护或私有成员函数\n5. 对非默认构造函数使用 `explicit` 关键字\n\n除了这些控制函数逻辑接口的选项外，你还可以为函数指定一些组织属性，例如：\n\
  \n1. 友元函数与非友元函数\n2. 内联函数与非内联函数\n\n恰当应用这些选项会对你的 API 质量产生巨大影响。例如，你应该尽可能将成员函数声明为 `const`，以表明它们不会修改对象（更多细节请参阅\
  \ C++ 使用 的第 6 章）。通过 `const` 引用传递对象可以减少你的 API 引入的内存拷贝量（请参阅 性能 的第 8 章）。使用 `explicit`\
  \ 关键字可以避免非默认构造函数的意外副作用（请参阅 第 6 章），而内联函数有时可以提供性能优势，但代价是暴露实现细节并破坏二进制兼容性（请参阅 第 8 章\
  \ 和 第 10 章`，或者表达力较弱地直接称为 `ZoomFactor()`。如果 getter 函数可能通过执行非平凡的工作来返回结果，你可能希望在它的名称中反映这一点（例如，使用\
  \ `Find` 或 `Calculate` 前缀而不是 `Get`）。\n\n2. 回答是或否查询的函数应该使用适当的前缀来指示这种行为，如 `Is`、`Are`\
  \ 或 `Has`，并返回 `bool` 结果：例如，`IsEnabled()`、`ArePerpendicular()` 或 `HasChildren()`。另一种方案是，C++\
  \ 标准库倾向于省略开头的动词，如函数 `empty()` 而不是 `IsEmpty()`。然而，尽管这种命名风格更简洁，但它是具有歧性的，因为它也可以被解释为清空容器的操作（除非你足够敏锐并注意到\
  \ `const` 方法装饰器）。因此，标准库的方案未能满足可发现性和不易误用的特性。\n\n3. 用于执行某些操作的方法应该用强力动词命名：例如，`Enable()`、`Print()`\
  \ 或 `Save()`。如果你命名的是自由函数而不是类的方法，那么你应该包含将应用于该操作的对象名称。\n\n4. 方法名应该描述程序执行的所有内容。例如，如果图像处理库中的某个例程对图像进行锐化并将其保存到磁盘，该方法应该命名为\
  \ `SharpenAndSave()` 而不是 `SharpenImage()`（McConnell, 2004）。\n\n5. 名称应该是自解释其义且易于记忆的，但使用缩写可能会引入令人困惑或晦涩的术语。例如，用户必须记住你使用的是\
  \ `GetCurrentValue()`、`CurrValue()` 还是 `GetVal()`。\n\n6. 使用一致的大小大小写规则。你会发现我在书中倾向于使用\
  \ `CamelCase`，但你的项目可能更偏于使用 `camelCase` 或 `snake_case`。在处理如何在函数名中包含缩写时也应该保持一致：例如，如果解析\
  \ XML 文件的函数被为 `ParseXML()` 或 `ParseXml()`。前者风格保留了缩写熟悉的大写形式，但当存在多个缩写时可能会引起混乱（例如，`SendHTTPSXML()`\
  \ 应该解释为“发送 HTTPS XML”还是“发送 SXML”？）。大小写方法让这些情况更加清晰：`HttpsXml()`。\n\n7. 函数不应下划线字符（`_`）开头。C++\
  \ 标准规定，以下划线开头的全局符号留供内部使用。所有包含双下划线或以下划线后跟大写字母的符号也是如此。尽管你可以找到遵循这些规则的合法前下划线组合，但最好的做法是在你的函数名中避免这种做法（某些开发者用此约定表示私有成员）。\n\
  \n8. 形成自然对的方法应该使用正确的互补术语。例如，`OpenWindow()` 应与 `CloseWindow()` 配对，而不是 `DismissWindow()`。使用精确的反义词让使用户更清楚地知道一个方法是另一个方法的相反操作（McConnell,\
  \ 2004）。此列表提供了一些互补词：\n\n- `Add/Remove`\n- `Begin/End`\n- `Create/Destroy`\n- `Enable/Disable`\n\
  - `Insert/Delete`\n- `Lock/Unlock`\n- `Next/Previous`\n- `Open/Close`\n- `Push/Pop`\n\
  - `Send/Receive`\n- `Show/Hide`\n\n### 函数参数\n\n良好的参数名称对你的 API 可发现性也会产生巨大影响。例如，对比标准\
  \ C 函数 `strstr()` 的以下两个签名，该函数在另一个字符串中搜索子字符串的首次出现：\n\n```\nchar *strstr(const char\
  \ *haystack, const char *needle);\n```\n\n和，\n\n```\nchar *strstr(const char *s1,\
  \ const char *s2);\n```\n\n\n\n\n我相信你会同意，仅仅通过使用具有描述性的参数名称，第二种签名就能很好地指示如何使用该函数。\n\
  \n另一个因素是确保为参数使用正确的数据类型。例如，当你有执行线性代数计算的方法时，你应该优先使用双精度浮点数（double precision），以避免单精度操作中固有的精度损失错误。同样，你永远不应该使用浮点数据类型来表示货币值，因为存在舍入误差的可能性（Beck,\
  \ 2002）。\n\n在将项数组传递给函数时，你应该尝试使用动态容器（如 `std::vector`），或使用已知大小的静态容器（如 `std::array`\
  \ 或 `double[3]`）。避免使用对数组大小做出假设的参数。例如，以下函数都是一个糟糕的设计，因为用户不知道边界框（bounding box）结构体应该有多大，如果客户端提供的数组太小，可能会导致内存错误：\n\
  \n![image](img/u04-15-9780443222191.jpg)\n\n在为每个函数指定的参数数量方面，也需要寻求平衡。过多的参数会使调用变得更难以理解和维护。它也意味着更大的耦合性，并可能暗示是时候重构函数了。因此，在可能的情况下，你应该尽量减少公共函数中参数的数量。在这方面，我们引用了认知科学领域经常被引用的研究，该研究指出，我们在短期工作记忆中可以保持的项目数量为\
  \ 7 加减 2（Miller, 1956）。这可能表明你不应该超过大约五个到七个参数；否则用户将发现很难记住所有的选项。事实上，Joshua Bloch 建议五个或更多参数就太多了（Bloch,\
  \ 2008）。\n\n对于具有许多必需参数的函数，你应该考虑是否可以引入一种抽象来表示这些参数的组合。例如，考虑以下设置 3D 边界框的函数：\n\n![image](img/u04-16-9780443222191.jpg)\n\
  \n该接口更好的表示方法是引入 3D 点的概念，然后边界框只需要两个参数就可以定义，即：\n\n![image](img/u04-17-9780443222191.jpg)\n\
  \n对于接受许多可选参数的函数，你可以考虑改为使用 struct 或 map 来传递参数。例如：\n\n![image](img/u04-18-9780443222191.jpg)\n\
  \n这种技术也是处理在 API 生命周期内可能变化的参数列表的好方法。新版本的 API 可以简单地在结构末尾添加新字段，而无需更改 `OpenWindow()`\
  \ 函数的签名。你还可以添加一个版本字段（由构造函数设置），以允许对结构体进行二进制兼容更改：`OpenWindow()` 函数可以检查版本字段以确定结构体中包含哪些信息。其他选项包括使用一个记录结构体字节大小的字段，或者直接使用不同的结构体。\n\
  \n更进一步，你可以隐藏所有公共成员变量，并允许通过 getter/setter 函数访问值。Qt API 将此称为基于属性的 API（property-based\
  \ API）。它也被更广泛地称为命名参数惯用法（Named Parameter Idiom）。例如：\n\n![image](img/u04-24-9780443222191.jpg)\n\
  \n这让你能够减少函数所需的参数数量；在这种情况下，`start()` 函数完全不需要参数。使用函数来设置参数值还具有以下优势：\n\n1. 值可以按任何顺序指定，因为函数调用与顺序无关。\n\
  2. 每个值的目的更加明显，因为你必须使用命名函数来设置值：例如 `setInterval()`。\n3. 只需不调用相应的函数即可支持可选参数。\n4. 构造函数可以为所有设置定义合理的默认值。\n\
  5. 添加新参数是向后兼容的，因为没有现有函数需要更改签名。只需添加新函数。\n\n### 错误处理\n\n应用程序开发者编写的大量代码纯是为了处理错误情况。实际编写的错误处理代码量很大程度上取决于特定的应用程序。然而，估计应用程序中高达\
  \ 90% 的代码与处理异常或错误情况有关（McConnell, 2004）。这是一个经常使用的设计领域。事实上，它包含了 Pugh 的法则（Pugh, 2006）：\n\
  \n- 接口实现应如方法所示。\n- 接口实现不应造成损害。\n- 如果接口实现无法执行应通知调用者。\n\n因此，在 API 中处理错误情况的三种主要方式是：\n\
  \n1. 返回错误代码\n2. 抛出异常\n3. 终止程序\n\n最后一种是应该尽量避免的极端行为，事实上那里有许多库调用了 `abort()` 或 `exit()`。对于前两种情况，不同的工程师对这些技术有不同的偏好。我在这里不会对异常与错误代码之争采取立场，而是尝试公正地呈现每者的优缺点。无论你为\
  \ API 选择何种技术，最重要的是使用一致的错误报告方案并进行良好的记录。\n\n错误代码方法涉及返回一个数字代码来指示函数的成功或失败。通常这种错误代码作为函数的直接结果返回。例如，许多\
  \ Win32 函数使用 `HRESULT` 数据类型返回错误。这是一个 32 位值，编码了故障的严重程度、负责错误的系统以及实际错误代码。C 标准库也提供了非正交错误报告设计的示例，例如\
  \ `read()`、`waitpid()` 和 `ioctl()` 函数，它们通过副作用设置 `errno` 全局变量的值。OpenGL 通过名为 `glGetError()`\
  \ 的错误检查函数提供了类似的报告机制。\n\n使用错误代码产生的客户端代码如下：\n\n![image](img/u04-25-9780443222191.jpg)\n\
  \n作为替代方案，你可以使用 C++ 的异常机制来信号实现代码中的失败。这是通过抛出一个对象让你的客户端在代码中捕获的。例如，几个 Boost 库通过抛出异常向客户端通信错误状况，如\
  \ `boost::iostreams` 和 `boost::program_options` 库。在你的 API 使用异常产生的客户端代码如下：\n\n![image](img/u04-26-9780443222191.jpg)\n\
  \n\n\n\n错误码技术为单个函数调用提供了一种简单、明确且稳健的错误报告方法。如果你正在开发一个必须被纯 C 程序访问的 API，它也是唯一的选择。主要的困境在于当你既想返回结果又想返回错误码时。处理这种问题的一种方法是将错误码作为函数的返回值，并使用输出参数来填充结果值。例如：\n\
  \n![image](img/u04-27-9780443222191.jpg)\n\n动态脚本语言（如 `Python`）通过轻松地以元组形式返回多个值，更优雅地处理了这个问题。然而，这对于现代\
  \ C++ 代码来说仍然是一个选项。从 `C++11` 开始，你可以使用 `std::tuple` 从函数返回多个结果。例如：\n\n![image](img/u04-28-9780443222191.jpg)\n\
  \n![从 `C++17` 起，你的客户端可以使用结构化绑定（structured binding）使这变得更加简单：即：![image](img/u04-29-9780443222191.jpg)\n\
  \n更好的是，从 `C++23` 开始，你可以使用 `std::expected` 来返回有效对象或错误。你可以参考 C++ 修订章节中关于预期值（Expected\
  \ Values）的以获取关于 `std::expected` 的更多细节。同时，这里有一个语法的示例：\n\n![image](img/u04-30-9780443222191.jpg)\n\
  \n相比之下，异常（exceptions）允许你的客户端将错误处理代码与正常控制流分离，从而使代码更具读性。异常的优势是可以在一系列多个函数调用中捕获一个或多个错误，而无需检查每一个返回码，并且允许你在调用栈的更高处处理错误，而不是在故障发生的精确点。异常还可以携带比简单错误码更多的信息。例如，C++\
  \ 标准库异常包含了对失败的人类可读描述，可以通过 `what()` 方法访问。此外，大多数调试器都提供了一种在抛出异常时中断的方法，使得调试问题变得更容易。最后，异常是报告构造函数中失败的唯一方法。\n\
  \n然而，这种灵活性是有代价的。虽然在没有抛出异常时使用异常应该没有成本，但在抛出异常时由于运行时栈回溯（stack unwinding）行为，这是一个开销昂的操作。此外，未捕获的异常会导致你的客户端程序崩溃，导致数据丢失并让终端用户感到沮丧。编写异常安全的代码是困难的，如果没有正确处理，可能会导致资源泄漏。通常，使用异常是一个全有全无的命题，这意味着如果应用程序的任何部分使用了异常，那么整个应用程序必须准备好正确处理异常。这意味着在你的\
  \ API 中使用异常也要求客户端编写异常安全的代码。值得注意的是，Google 在其 C++ 编码规范中禁止使用异常，因为他们的大部分现有代码并不容忍异常。然而，作为一个反面例子，C++\
  \ 标准库大量使用异常来信号错误，因此任何使用标准库的现代 C++ 开发者必须已经准备好在代码中处理异常。\n\n如果你选择使用异常来信号代码中的意外情况，这里是一些需要遵守的最佳实践：\n\
  \n1. 从 `std::exception` 派生你自己的异常，并定义 `what()` 方法来描述失败。\n2. 考虑你将提供的异常安全级别。你可以提供四种主要的异常保证（或\
  \ Abrahams 保证）(Stroustrup, 2001)：\n3. **无异常保证 (No-throw guarantee)**：确保函数永远不会抛异常。如果函数内部发生错误，它将在内部处理而不暴露给客户端。这也被称为故障透明性（failure\
  \ transparency）。\n4. **强异常安全 (Strong exception safety)**：失败的操作不会产生副作用，且任何原始值将保持完好。这也被提交或回滚语义（commit\
  \ or rollback semantics）。\n5. **基本异常安全 (Basic exception safety)**：失败的操作可能会产生副作用，但所有不变性（invariants）都将保留（即在抛出错误后对象仍应包含有效值且不应泄漏资源）。\n\
  6. **无异常安全 (No exception safety)**：发生错误时不提供任何保证（即数据可能会损坏、可能返回错误值，或可能泄漏内存）。\n7. 考虑使用\
  \ RAII 技术来维护异常安全（即确保在抛出异常时资源能被正确清理）。\n8. 确保在函数的注释中记录该函数可能抛出的所有异常。\n9. 你可能想尝试使用异常规范（如\
  \ `throw()` 标识符）来记录函数可能抛出的异常。然而，请注意，这些约束由编译器在运行时强制执行（如果的话），而且其中某些功能已在 `C++17` 中被移除。因此，大多数\
  \ C++ 工程师避开了此类异常规范，如：\n\n![image](img/u04-31-9780443222191.jpg)\n\n10. 为可能遇到的逻辑错误集合创建异常，而不是为每个物理错误创建一个唯一的异常。\n\
  11. 如果你在自己的代码中处理异常，你应该通过引用捕获异常（如上例所示），以避免为抛出的对象调用拷贝构造。此外，尽量避免 `catch(...)` 语法，因为某些编译器在出现编程错误（如\
  \ `assert()` 或段错误）时也会抛出异常。\n12. 如果你的异常继承自多个一个基类，你应该使用虚继承，以避免客户端代码在尝试捕获异常时出现歧义和细微错误。\n\
  13. 注意，在 Windows 上，异常无法跨越具有不同运行时 DLL 边界。在这种情况下，任何异常的使用都应包含在 DLL 内部，任何公共 API 调用都应该捕获所有异常并使用不同的技术（如错误码或输出参数）返回错误。\n\
  \n在错误报告的最佳实践方面，你的 API 在发生错误后应该尽快失败，并清理任何中间状态，例如释放在错误发生前分配的资源。然而，你也应该尝试在没有必要的情况下返回异常值（如\
  \ `nullptr`）。这样做会导致你的客户端编写更多代码来检查这些情况。例如，如果你有一个返回项目列表的函数，考虑在异常情况下返回一个空列表而不是 `nullptr`。这要求你的客户端编写更少代码，并降低了客户端解引用\
  \ `nullptr` 的概率。\n\n\n\n\n\n有多种不同的应用程序编程接口（API）样式可以实现任何给定的设计。本章介绍了 C++ 开发者可以使用的五种不同编程风格，并描述了每种方法的优缺点。这些包括：使用过程化的平坦\
  \ C API（不使用类、命名空间或引用等任何 C++ 特性）；面向对象的 C++ API（可以使用继承、封装和多态性）；基于模板的 API（允许用泛型类型编写函数和数据结构）；函数式\
  \ API（侧重于使用函数作为一等公民的声明式编程技术）；以及数据驱动的 API（能够很好地映射到 Web 服务 API 并支持数据驱动测试）。\n\n###\
  \ 关键词\n\n数据驱动；函数式编程；泛型编程；幂等性；宏；面向对象；`std::any`；模板；Web 服务\n\n前几章节讨论了良好的应用程序编程接口（API）的设计特质和方法。尽管我用具体的\
  \ C++ 示例说明了这些概念，但设计 API 的抽象过程与语言无关的。然而，在接下来的几个章节中，我将开始转向生产高质量 API 的更具 C++ 特针对性的方面。\n\
  \n在本章中，我将涵盖 API 样式这一主题。在此语境下，样式意味着你决定如何表示你的 API 功能。也就是说，你的 API 可能提供访问内部状态和执行所需函数的接口，但调用这些操作的形式是什么？这个问题的答案似乎是显而易见的：你创建类来表示\
  \ API 中的每个关键对象，并在这些类上提供方法。然而，你还有其他可以采用的样式，面向对象的风格并不总是最合适的。在本章中，我将介绍五种非常不同的 API 样式：\n\
  \n*   1. **平坦 C API (Flat C APIs)**：可以使用 C 编译器编译的 API。这仅涉及一组自由函数以及任何支持的数据结构和常量。由于这种接口样式不包含对象或继承，因此它通常被称为平坦的（flat）或过程化的（procedural）。\n\
  *   2. **面向对象的 C++ API**：作为一名 C++ 程序员，这可能是你最熟悉的样式。它涉及带有关联数据和方法的对象，以及应用继承、封装和多态等概念。\n\
  *   3. **基于模板的 API**：C++ 还通过其模板功能支持泛型编程和元编程。这允许用泛型类型编写函数和数据结构，稍后可以通过用具体类型实例化来对其进行特化。\n\
  *   4. **函数式 API**：函数式编程是一种依赖于组合函数而不是执行命令式语句序列的样式。它是一种声明式编程样式，意味着它更关注你*想要做什么*，而不是*怎么做*。\n\
  *   5. **数据驱动 API**：这种类型的接口涉及向处理器发送命名的命令，参数封装在灵活的数据结构中，而不是调用特定的方法或自由函数。这种样式很好地对应支持网络协议和文件格式。\n\
  \n现在我将逐一描述这些 API 样式，并讨论在什么情况下一种样式可能优于另一种样式。在整个章节中，我将使用 FMOD API 的示例来说明其中三种样式。FMOD\
  \ 是一个用于创建和播放交互式音频的商业库，被动视员、暴雪、Ubisoft 和微软等许多游戏公司使用。它提供了一个平坦 C API、一个 C++ API 和数据驱动\
  \ API 来访问其核心音频功能。因此，它为这些 API 样式提供了一个具有启发性的比较。\n\n## 平坦 C API\n\n“平坦 API”（flat API）这一术语旨在传达\
  \ C 语言不支持封装对象和继承层次结构这一事实。因此，使用纯 C 语法的 API 必须用更受限的语言特征来表示，例如存在于全局命名空间中的 `typedef`、`struct`\
  \ 和函数调用。由于 C 语言缺少命名空间关键字，采用这种样式的 API 必须对所有公共函数和数据结构使用公共前缀，以避免与其他 C 库发生冲突。\n\n当然，你仍然可以使用内部链接（Lakos,\
  \ 1996）来隐藏实现中的符号名称，例如在 `.cpp` 文件的文件作用域级别将它们声明为 `static`。这样你就可以确保任何此类函数都不会向外部导出，因此不会与其他库中的相同符号名称冲突。（当然，这同样适用于\
  \ C++ 程序，尽管在 C++ 中使用匿名命名空间是实现相同结果的首选方法）。\n\n目前使用的流行的 C API 有许多许多示例，包括：\n\n1.  **C\
  \ 标准库**。如果你在编写 C 程序，那么你必须熟悉 C 标准库。它由一组头文件（如 `stdio.h`、`stdlib.h` 和 `string.h`）以及用于\
  \ I/O、字符串处理、内存管理、数学操作等的库例程（如 `printf()`、`malloc()`、`floor()` 和 `strcpy()`）组成。大多数\
  \ C 和许多 C++ 程序都是使用该库构建的。\n2.  **Windows API**。通常称为 `Win32 API`，这是用于微软 Windows 系列操作系统开发应用程序的核心接口集。它包含了跨越各个类别的\
  \ API 组，例如基准服务、图形设备接口、常用对话框库和网络服务。另一个名为微软基金会类（Microsoft Foundation Class）的库提供了 Windows\
  \ API 的 C++ 封装。\n3.  **Linux 内核 API**。整个 Linux 内核都是用纯 C 编写的。这包括 Linux 内核 API，它为驱动程序访问操作系统功能提供了稳定的接口。包括驱动函数、数据类型、基础\
  \ C 函数、内存管理操作、线程和进程函数以及网络函数等。\n4.  **GNOME GLib**。这是一个通用的开源实用库，包含许多编写应用程序的低级例程。这包括字符串工具、文件访问、数据结构（如树、哈希和列表）以及主循环抽象。该库为\
  \ GNOME 桌面环境提供了基础，最初是 GIMP Toolkit (GTK+) 的一部分。\n5.  **Netscape Portable Runtime**。Netscape\
  \ Portable Runtime 库为线程、文件 I/O、网络访问、定时、内存管理和共享库链接等低级功能提供了跨平台 API。它是 Firefox 浏览器和\
  \ Thunderbird 邮件客户端的核心。\n6.  **图像库**：大多数帮助你的应用程序添加各种格式支持的开源图像库完全是用 C 编写的。例如，`libtiff`、`libpng`、`libz`、`libungif`\
  \ 和 `jpeg` 库都是纯 C API。\n\n### ANSI C 特性如果你习惯编写 C++ API，那么在编写纯 C API 时，你将缺少许多语言特性。例如，C\
  \ 不支持类、引用、智能指针、模板、C++ 标准库、默认参数、访问级别（`public`、`private` 或 `protected`）或 `bool` 类型。相反，C\
  \ API 通常仅由以下组成：\n\n*   1. 内置类型，如 `int`、`float`、`double`、`char` 以及这些类型的数组和指针。\n*\
  \   2. 通过 `typedef` 和 `enum` 关键字的自定义类型。\n*   3. 使用 `struct` 或 `union` 关键字声明的自定义结构。\n\
  *   4. 全局自由函数。\n\n\n\n\n\n## 5. 类似于 `#define` 等预处理指令。\n\n事实上，C 语言关键字的完整集合非常短。这里列出了整个列表作为参考：\n\
  \n1. ▪ `auto`:定义一个局部变量具有局部生命周期。\n2. ▪ `break`:将控制跳出 `while`、`do`、`for` 或 `switch`\
  \ 语句。\n3. ▪ `case`:在 `switch` 语句中定义特定的分支点。\n4. ▪ `char`:字符数据类型。\n5. ▪ `const`: 声明变量值或指针参数为不可修改。\n\
  6. ▪ `continue`:将控制传递到 `while`、`do` 或 `for` 语句的开头。\n7. ▪ `default`:为 `switch` 语句定义备选分支点。\n\
  8. ▪ `do`:开始一个 `do-while` 循环。\n9. ▪ `double`:双精度浮点数据类型。\n10. ▪ `else`:当 `if` 语句结果为假时执行的语句。\n\
  11. ▪ `enum`:定义一组 `int` 类型的常量。\n12. ▪ `extern`:引入在别处定义的标识符名称。\n13. ▪ `float`:单精度浮点数据类型。\n\
  14. ▪ `for`:定义一个 `for` 循环。\n15. ▪ `goto`:将控制转移到带有标签的代码行。\n16. ▪ `if`:提供序列语句的条件执行能力。\n\
  17. ▪ `int`:整数数据类型。\n18. ▪ `long`:扩展某些内置数据类型的大小。\n19. ▪ `register`:指示编译器将变量存储在 CPU\
  \ 寄存器中。\n21. ▪ `return`:带有可选的返回值退出函数。\n22. ▪ `short`:减小某些内置数据类型的大小。\n23. ▪ `signed`:声明一种数据类型能够处理负值。\n\
  24. ▪ `sizeof`:返回类型或表达式的大小。\n25. ▪ `static`:即使在变量作用域结束后也保留该变量的值。\n26. ▪ `struct`:允许将多个变量组合到一个类型中。\n\
  27. ▪ `switch`:使控制跳转到可能语句列表之一。\n28. ▪ `typedef`:根据现有类型创建新类型。\n29. ▪ `union`:组合多个共享相同内存位置的变量。\n\
  30. ▪ `unsigned`:声明一种数据类型仅处理正值。\n31. ▪ `void`:空数据类型。\n32. ▪ `volatile`:指示变量可以被外部过程更改。\n\
  33. ▪ `while`:定义一个当条件求值为假时存在的循环。\n\n尽管 C 并不是 C++ 的严格子集，但编写良好的 ANSI（美国国家标准协会）C 程序通常也会是合法的\
  \ C++ 程序。通常情况下，C++ 编译器会比 C 编译器施加更严格的类型检查。当你编写一个纯 C API 时，尝试用 C++ 编译器编译你的代码，然后修复引发的任何额外警告或错误，通常是一项值得的任务。\n\
  \n### ANSI C API 的优势\n\n用 C 编写 API 的主要原因之一是，它必须与完全用 C 编写的现有项目集成。随着越来越多的项目从头开始用 C++\
  \ 编写，这种情况变得越来越少，但当你的客户对你的 API 施加这种限制时，可能会出现这种情况。示例包括我之前列出的任何现有的大型 C API。例如，如果你正在开发\
  \ Linux 内核 API，那么你将需要用语言编写此接口。\n\n另一个倾向于创建纯 C API 的原因是二进制兼容性。如果你被要求在 API 库版本之间保持二进制兼容性，那么使用纯\
  \ C API 比使用 C++ API 要容易得多。我将在“版本控制”章节中讨论这些细节，但目前只需说明，C++ API 看似微小的变化就可能影响生成的对象文件和库文件的二进制表示，从而破坏客户端简单地替换共享库而无需重新编译代码即可运行的能力。\n\
  \n当然，没有什么能阻止你生产一个既可以在 C 下运行又可以在 C++ 下运行的 API。事实上，你甚至可能决定想创建一个 C++ API，以利用 C++ 额外的面向对象特性，但同时也为该接口创建一个纯\
  \ C 封装，供仅限 C 的项目使用，或者暴露你 API 的一个更简单、表面积更小的版本，以便该版本更易于强制二进制兼容性。FMOD API 就是其中这样一个例子，因为它同时提供了\
  \ C++ API 和 C API。\n\n### 使用 ANSI C 编写 API\n\nC 语言没有对类的支持，因此你无法将数据与操作这些数据的方法封装在对象中。相反，你定义包含数据的\
  \ `structs`（或 `unions`），然后将它们作为参数传递给操作这些数据的函数。例如，考虑以下 C++ 类定义：\n\n![image](img/u05-01-9780443222191.jpg)\n\
