  \n现在你可以使用 `CRTP` 派自 `MemoryTracker` 类，以跟踪某些类消耗的所有内存。这甚至可以用于跟踪单个模板的内存使用，如下一个示例所示。所有这些派生类基本上都从我们之前的基类继承了\
  \ `BytesUsed()` 方法，但重要的是，该方法是在编译时绑定的，而不是运行时：\n\n![image](img/u15-34-9780443222191.jpg)\n\
