  \n## 使用 SWIG 添加 Ruby 绑定\n\n在接下来的章节中，我将介绍为 C++ API 创建脚本绑定的示例。在这种情况下，我将使用 SWIG，并利用该工具为\
  \ Ruby 语言创建绑定。\n\nRuby 是一种开源的动态类型脚本语言，由松本裕弘（Matz）于 1995 年发布。Ruby 受到 Perl 和 Smalltalk\
  \ 等语言的影响，并强调易用性。在 Ruby 中，一切都是对象，即使是 C++ 将其视为内置原型的类型（如 `int`、`float` 和 `bool`）也是如此。Ruby\
  \ 是一种非常流行的脚本语言，在其最初开发的日本，它经常被认为比 Python 更流行。关于 Ruby 语言的更多信息，请参阅 [`www.ruby-lang.org/`](https://www.ruby-lang.org/)。\n\
  \nSWIG 的工作原理是读取接口文件中的绑定定义，并生成指定绑定的 C++ 代码。这些生成的代码可以编译为动态库，并由 Ruby 直接加载。图 14.2 展示了这一基本工作流。SWIG\
  \ 支持许多脚本语言。我将用它来创建 Ruby 绑定，但它同样可以轻松用于创建 Python 绑定、Perl 绑定或其他几种语言的绑定。\n\n![image](img/f14-02-9780443222191.jpg)\n\
  \n图 14.2 使用简化封装器接口生成器（SWIG）创建 C++ 应用程序编程接口（API） Ruby 绑定的工作流。*白框*表示文件，*阴框*表示命令。\n\
  \n### 使用 SWIG 封装 C++ API\n\n我将从 Python 示例中相同的电话簿 API 开始，然后展示如何使用 SWIG 为该接口创建 Ruby\
  \ 绑定。电话簿的 C++ 头文件如下：\n\n![image](img/u14-34-9780443222191.jpg)\n\n让我们来看一个基本的 SWIG\
  \ 接口文件，用来说指定你如何将此 C++ API 暴露给 Ruby：\n\n![image](img/u14-35-9780443222191.jpg)\n\n\
  你可以看到接口文件看起来与 `phonebook.h` 头文件相似。事实上，SWIG 可以直接解析大部分 C++ 语法。如果你的 C++ 头文件非常简单，你甚至可以使用\
  \ SWIG 的 `%include` 指令来让它直接读取 C++ 头文件。我选择不这样做，以便让你能够直接控制哪些内容暴露或不暴露给 Ruby。\n\n现在你已经有了一个初始接口文件，可以要求\
  \ SWIG 读取此文件并为所有指定的 C++ 类和方法生成 Ruby 绑定。\n\n### 调整 Ruby API\n\n这个初步的 Ruby 尝试是粗浅的。你可能需要解决几个问题，以使\
  \ API 看起来更自然。首先，Ruby 的命名规范是使用蛇形命名法（snake case）而不是驼峰命名法（camel case）：例如，使用 `add_person()`\
  \ 而不是 `AddPerson()`。\n\n通常情况下，方法重载在 Ruby 中并不像 C++ 中那么灵活。SWIG 提供了一种处理此的方法，允许你忽略给定的重载方法（使用\
  \ `%ignore`）或重命名其中一个方法（使用 `%rename`）。\n\n### 构造函数\n\n我们的 `Person` 类有两个构造函数：一个不带参数的默认构造函数和一个接受\
  \ `std::string` 命名的非默认构造函数。使用 SWIG，你只需要在接口文件中包含这些构造函数声明，它就会在 Ruby 中自动创建相应的构造函数。\n\
  \n\n\n\n\n使用我们对 `Person` 绑定的新定义，你可以编写以下 Ruby 代码：\n\n![image](img/u14-43-9780443222191.jpg)\n\
  \n`puts p` 这一行将使用我们的 `to_s()` 方法打印出 `Person` 对象。在这种情况下，将产生如下输出：\n\n![image](img/u14-44-9780443222191.jpg)\n\
  \n### C++ 中的继承\n\n与之前的构造函数情况一样，使用 SWIG 表示继承时不需要做任何特殊操作。你只需要在接口文件中使用标准的 C++ 语法声明该类即可。例如，你可以将这个\
  \ `PersonWithCell` 类添加到我们的 API 中：\n\n![image](img/u14-45-9780443222191.jpg)\n\n\
  然后你可以这样更新 SWIG 接口文件：\n\n![image](img/u14-46-9780443222191.jpg)\n\n之后你就可以从 Ruby 访问这个派生的\
  \ C++ 类：\n\n![image](img/u14-47-9780443222191.jpg)\n\nRuby 只支持单继承，但支持额外的 mixin（混入）类。当然，C++\
  \ 支持多重继承。因此，默认情况下，SWIG 只考虑派生类中列出的第一个基类：任何其他基类中的成员函数都都不会被继承。然而，SWIG 的版本支持一个可选的 `-minherit`\
  \ 命令行选项，它会尝试使用 Ruby mixin 来模拟多重继承（尽管在这种情况下，类在 Ruby 中不再拥有真正的基类）。\n\n### 跨语言多态\n\n\
  默认情况下，如果你在 Ruby 中重写了虚函数，将无法从 C++ 调用 Ruby 方法。然而，SWIG 通过其“director（导演）”功能为你提供了一种启用这种跨语言多态的方法。当你为一个类启用\
  \ director 时，SWIG 会生成一个新的包装类，该类既派生自 C++ 类，也派生自 SWIG 的 `Director` 类。director 类存储指向底层\
  \ Ruby 对象的指针，并判断函数调用应该重定向到重写的 Ruby 方法还是默认的 C++ 实现。这类似于 Boost Python 支持跨语言多态的方式。但是，SWIG\
  \ 在后台自动为你创建了包装类：你只需要指定你想要为哪些类创建 director，并在你的 `%module` 指令中启用 director 功能。例如，对我们接口文件的此更新将为我们所有的类开启跨语言多态：\n\
  \n![image](img/u14-48-9780443222191.jpg)\n\n### 整合在一起\n\n为了添加每项增强，我对我们的简单示例进行了多次迭代。我将通过提供整个\
  \ C++ 头文件和 SWIG 接口文件供你参考来结束本节。首先，这里是 C++ API：\n\n![image](img/u14-49-9780443222191.jpg)\n\
  \n这里是最后的 SWIG 接口 `.i` 文件：\n\n![image](img/u14-50p1-9780443222191.jpg) ![image](img/u14-50p2-9780443222191.jpg)\n\
  \n# 15: 可扩展性\n\n## 摘要\n\n可扩展性是应用程序编程接口 (`API`) 设计的一个重要方面，因为它允许用户扩展基础功能，而不需要你来支持他们的需求。本章的大部分内容涉及如何创建\
  \ `Plugin` API。这是用户通过创建在运行时发现并加载的动态库来扩展你的 `API` 功能的方法。本章讨论了如何创建稳定的 C++ 接口并涵盖了整个架构，包括\
  \ `Plugin` API 本身以及 `Plugin Manager`。本章还涵盖了扩展 `API` 的其他方法，例如通过继承，并以 `Visitor` 设计模式作为具体示例。还涵盖了通过模板实现的扩展性，包括基于策略的模板和递归的模板模式。\n\
  \n### 关键词\n\n枚举；继承；插件；子类化；模板；版本控制；访问者模式\n\n在最后一章中，我将讨论应用程序编程接口 (`API`) 可扩展性的主题。我的意思是，让你的客户端可以在不需要你演进\
  \ `API` 的情况下修改接口的行为。在交付灵活系统的同时，保持接口清晰且聚焦，并让用户能够解决你从未预料到的问题。这一概念由开闭原则表达，我们在《设计设计》的第\
  \ 4 章 中讨论过：即 `API` 对扩展开放，但对修改关闭 (Meyer, 1997)。\n\n为了提供一个真实世界的例子，Pixar 的 Marionette\
  \ 动画系统支持关键帧动画，并在动画键之间有一系列可能的插值方案，例如贝塞尔、Catmull-Rom、线性阶梯插值。然而，在开发《疯狂疯狂员》和《汽车总动》期间，有必要允许制作用户设计并迭代更复杂的插值程序。我们没有在用户需要更改自定义插值算法时不断更新核心动画系统，而是设计了一个插件系统，允许制作用户创建可以在运行时发现的动态库，然后这些库会被添加到内置插值程序集中。这证明了在保持通用动画系统同时也解决特定生产需求的一种有效方法。\n\
  \n本章致力于介绍用于扩展你的 `API` 的各种技术。我将花费大量时间介绍如何创建工业级的跨平台 C++ 插件架构，但我也将通过继承和模板涵盖其他扩展技术。\n\
  \n## 通过插件扩展\n\n在最常见的情况下，插件是一个在运行时发现并加载的动态库，而不是在构建时链接的动态库。因此，插件可以使用你提供的定义的 `Plugin\
  \ API` 由用户编写。这允许他们以指定的方式扩展你的 `API` 功能。图 15.1 说明了这一概念，其中白色框代表用户产生的产物。\n\n然而，静态库插件也是可能的，例如嵌入式系统，所有插件在编译时静态链接到应用程序中。这有助于确保插件可以在运行时找到，并且与主执行文件在相同的环境中构建。然而，本章我将重点关注动态库模型，因为它带来了最大的设计挑战，并赋予用户在运行时向系统添加新插件的能力。\n\
  \n![image](img/f15-01-9780443222191.jpg)\n\n图 15.1 插件库是一种可以与核心应用程序接口 (`API`) 分开编译并由\
  \ `API` 按需显式加载的动态库。\n\n### 插件模型概述\n\n许多商业软件包的示例允许通过 C/C++ 插件扩展其核心功能。例如，Apache Web\
  \ 服务器支持基于 C 的“模块”，Adobe Photoshop 支持多种插件类型来处理图像，Firefox、Chrome 和 Opera 等网络浏览器支持\
  \ Netscape 插件 API (`NPAPI`) 以创建浏览器插件（如 PDF 阅读器插件）。Qt 工具包也可以通过 `QPluginLoader` 类进行扩展。（基于服务器的插件\
  \ API，如 Apache 的模块接口有时被称为服务器 API。）\n\n\n\n\n\n在你的 API 中采用插件模型的一些益处包括：\n\n1. **更强的通用性**。你的\
  \ API 可以用于解决更广泛的问题，而无需你为所有问题都实现解决方案。\n2. **社区催化剂**。通过赋予用户在你的 API 框架内解决自己问题的能力，你可以激发一个由用户为你的基础设计贡献扩展的社区。\n\
  3. **更小的更新**。以插件形式存在的功能可以通过简单地放入新版本的插件，来独立于应用程序进行单独更新。这通常比分发整个应用程序的新版本更新要小得多。\n\
  4. **面向未来**。你的 API 可能会达到某种稳定水平，使你认为不再需要任何更新。然而，你的 API 功能的进一步演进可以通过开发插件来继续，允许 API\
  \ 在更长的时间内保持其实用相关性。例如，`NPAPI` 在最近几年变化不大，但它仍然是许多 Web 浏览器编写插件的流行方法。\n5. **隔离风险**。插件对内部开发也有益处，它可以允许工程师在不破坏系统核心稳定的情况下更改功能。当然，这是因为插件从本质上说与核心系统是松耦合的。\n\
  \n正如我之前暗示的那样，插件系统不必仅供你的客户端使用。你也可以将 `Core API` 实现的一部分开发为插件。事实上，这是一种良好的做法，因为它确保了你充分利用了插件架构，并且与你的用户处于同一个世界中（“吃自己的狗粮”）。例如，GNU\
  \ 图像处理程序（`GIMP`）使用其 `GIMP Plugin API` 将许多内置图像处理函数作为插件发布。\n\n![image](img/f15-02-9780443222191.jpg)\n\
  \n图 15.2 插件管理器存在于核心应用程序接口 (API) 中。它发现并加载基于 `Plugin API` 构建的插件。\n\n### 插件系统设计问题\n\
  \n设计插件系统有很多方法。对于你当前项目的最佳解决方案可能不是你下一个项目的最佳选择。因此，我将首先尝试梳理出你在设计插件系统时应该注意的一些高级问题。\n\n\
  同时，一些通用概念适用于所有插件系统。例如，在支持动态库插件时，你总是需要一种加载动态库并访问该文件中符号的机制。此外，在创建任何插件系统时，有两个你必须设计的重大特性（图\
  \ 15.2）：\n\n1. **插件 API**：这是用户必须编译并对其链接的 API，以创建插件。我将其与你的 `Core API` 区分开来，后者是你正在添加插件系统的较大代码库。\n\
  2. **插件管理器**：这是 `Core API` 代码中的一个对象（通常是单例），用于管理所有插件的生命周期，例如加载、注册和卸载。该对象也可以称为 `插件注册表`\
  \ (Plugin registry)。\n\n掌握了这些通用概念，让我们来看一些影响你将为 API 构建的精确插件架构的设计决策：\n\n1. **C 语言对比\
  \ C++**。正如我在“版本控制”章节中讨论的那样，`C++` 规范没有定义特定的应用程序二进制接口 (ABI)。因此，不同的编译器，甚至同一编译器的不同版本，可能会产生二进制上不兼容的代码。这对插件系统的影响是，客户端使用不同\
  \ ABI 的编译器开发的插件可能无法加载。相比之下，纯 `C` 代码的 ABI 是有良好定义的，并且可以在跨平台和编译器之间工作。\n2. **版本控制**：你可能需要某种方法来判断插件是否是与不兼容的\
  \ API 版本构建的。确定什么构成了不兼容的 API 可能很难自动推断，因此通常留给插件编写者来指定。例如，Firefox 的扩展 API 允许你指定扩展已知可以运行的最小和最大版本范围（并有一套系统，可以在发布不兼容的\
  \ API 时方便地更新扩展的最大版本）。知道插件是针对哪个版本的 API 编译的也是很有用的。这可以自动嵌入插件中，或者同样地，留给插件编写者来指定。例如，Google\
  \ 的 Android API 允许你在指定 `android:minSdkVersion` 和 `android:maxSdkVersion` 之外额外指定\
  \ `android:targetSdkVersion`。\n3. **内部元数据对比外部元数据**：元数据（如人类可读的名称和版本信息）可以定义在插件代码内部，也可以在简单的外部文件格式中指定。使用外部元数据文件的好处是，不需要加载所有插件就能知道可用对象的集合。例如，你可能想向用户展示所有插件列表，然后只加载他们选择使用的插件。然而，缺点是，你不能简单地将新插件放入目录并让它自动加载。根据你采用的方法，你还必须包含每个插件的元数据文件，或者更新适用于所有插件的全局元数据文件。\n\
  4. **通用型对比专用插件管理器**：实现 `插件管理器` 的一种方法是将其变为低级且通用的（即它只需加载插件并访问这些插件中的符号）。然而，这样做意味着 `插件管理器`\
  \ 不知道你 API 中具体类型的存在。结果是它可能必须以 `void*` 指针的形式返回对象，你必须在使用它们之前将它们强制转换为具体类型。另一种，一个至少可以对插件中任何对象的类型进行前向声明的\
  \ `插件管理器` 可以产生一个更类型安全的解决方案，尽管结果是它无法独立于你的 API 进行实现。一种折中方案是在你的 API 中引入动态运行时类型系统，在其中\
  \ `插件管理器` 可以根据通用类型返回引用，该引用稍后由你的 API 注册。\n5. **安全性**：你必须决定在多大信任用户插件。插件是你允许在你的进程中运行的任意编译代码。因此，插件可能执行任何事情，从访问它不应该访问的数据到删除最终用户硬盘上的文件，再到导致整个应用程序崩溃。如果你需要防止此类恶意插件，那么你可能考虑创建一个基于套接字的解决方案，插件运行在独立的进程中，并通过\
  \ IPC 通道与 `Core API` 通信。或者，你可以为支持用户脚本沙箱的语言（如 JavaScript 或 TypeScript）实现绑定，并要求所有插件都用该语言编写。\n\
  6. **静态库对比动态库**：正如我提到的，可以将插件定义为静态库，这意味着它们必须编译到应用程序中。对于消费者应用程序来说，更常见的解决方案是使用动态库，这样用户可以编写自己的插件并在运行时扩展应用程序。\n\
  \n\n\n\n\n我已经发现支持 C++ 插件可能会困难，因为存在跨平台和跨编译器的 ABI（应用二进制接口）问题。然而，这是一本关于 C++ API 设计的书，所以让我们再花一点时间，介绍一些让你更稳健地使用\
  \ C++ 插件的解决方案。\n\n首先，如果你愿意要求插件开发者使用与你构建 API 时完全相同的版本的编译器，那么你就不需要担心了。如果情况并非如此，一种解决方案是为插件使用绑定技术：例如，使用如\
  \ `COM`、`XPC` 或 `gRPC` 等 IPC 解决方案，或者为你的 API 创建脚本绑定，让用户使用 `Python` 或 `Ruby` 等跨平台脚本语言编写扩展（正如我在上一章中提到的）。\n\
  \n如果你为了获得最高性能绝对需要使用 C++ 插件，或者觉得创建 `COM` 或脚本绑定对你的需求来说太笨重了，你仍然有方法可以在插件中更安全地使用 C++。此列表提供了几项最佳实践，其中许多已经在\
  \ [`www.codeproject.com/`](http://www.codeproject.com/) 上的开源 `DynObj` 库中实现：\n\n\
  1. **使用抽象基类**：实现抽象基类的虚方法可以使插件免受 ABI 问题的影响，因为虚方法调用通常表示为类 `vtable`（虚函数表）的索引。从理论上讲，编译器之间的\
  \ `vtable` 格式可能不同，但在实践中通常不会发生。（然而，不同的编译器对重载虚方法的排序可能不同，因此最好避免这些方法。）接口中的所有方法都需要是纯虚，尽管内联方法也可以安全地使用，因为代码将直接嵌入插件中。\n\
  \n2. **对自由函数使用 C 链接（C linkage）**：`Plugin API` 中的所有全局函数都应该使用 C 链接以避免 C++ ABI 问题（即它们应该用\
  \ `extern \"C\"` 声明）。同样，插件传递给 `Core API` 的函数回调也应该使用 C 链接以获得最大的可移植性。\n\n3. **避免 C++\
  \ 标准库和异常**：`std::string` 和 `std::vector` 等标准库类的不同实现可能不具有 ABI 性。因此，在 `Core API` 和\
  \ `Plugin API` 之间的任何函数调用中，最好避免使用这些容器。同样，异常的 ABI 在不同编译器之间往往是不稳定的，因此在你的 `Plugin API`\
  \ 中也应该避免使用。\n\n4. **不要混合分配器**：插件可能会链接到与你的 API 不同的内存分配器。例如，在 Windows 上，调试生成（debug\
  \ builds）通常使用与发布生成（release builds）不同的分配器。这对我们插件设计的意味着：要么插件必须分配并释放它的所有对象，要么插件应该将控制交给\
  \ `Core API` 来创建和销毁所有对象。然而，你的 `Core API` 永远不要释放由插件分配的对象，反之亦然。\n\n将所有这些信息整合在一起，我现在将开发一个灵活且稳健的跨平台\
  \ C++ 插件系统。该插件系统允许通过提供一个或多个工厂方法向 `Core API` 注册新的 C++ 类。我将继续使用第三章（模式）中的可扩展工厂示例，并对其进行增强，以允许从插件注册新的\
  \ `IRenderer` 类，其中这些插件是在运行时动态加载的，而不是编译到 `Core API` 中。此外，插件架构将支持存储插件元数据的不同方法，要么在配套的外部文件中，要么在插件内部。\n\
  \n### 插件 API\n\n`Plugin API` 是你提供给用户创建插件的接口。在我们的示例中，我将其称为 `pluginapi.h`。此头文件将包含允许插件与\
  \ `Core API` 通信的功能。\n\n当 `Core API` 加载插件时，它需要知道调用哪些函数或访问哪些符号来让插件工作。这意味着你需要在插件中定义特定命名的入口点，并要求用户提供。有几种方法可以实现。例如，在编写\
  \ GIMP 插件时，你必须定义一个名为 `PLUG_IN_INFO` 的变量，列出插件中定义的各种回调：\n\n![image](img/u15-02-9780443222191.jpg)\n\
  \nNetscape 插件使用类似的、但稍微灵活一点的技术。在这种情况下，插件作者定义一个 `NP_GetEntryPoints()` 函数，并填充浏览器在插件注册期间传递的\
  \ `NPPluginFuncs` 结构的相应字段。`NPPluginFuncs` 结构包含了大小和版本字段，以处理未来的扩展。\n\n另一种解决方案是具有特定命名的函数，如果它们被插件导出，`Core\
  \ API` 就可以调用它们。将在示例中采用这种方法，因为它简单且具有扩展性（例如，它不依赖于固定大小的数组或结构）。\n\n插件应该提供的两个基本回调是初始化函数和清理函数。正如我之前提到的，这些函数应该用\
  \ C 链接声明，以避免编译器之间的命名修饰（name mangling）差异。如果你想开发一个跨平台插件系统，还需要处理在 Windows 上正确使用 `__declspec(dllexport)`\
  \ 和 `__declspec(dllimport)` 装饰符。为了不让我们的插件开发者了解所有这些细节，我将提供一些宏来简化一切。（我之前提到过应该避免使用预处理器宏来声明事物，但使用它们来影响编译时配置（如此类情况）是完全允许的。）\n\
  \n此外，我决定我们的插件应该允许注册新的 `IRenderer` 派生类，因此我将提供一个插件 API 让插件这样做。这里是我们插件 API 的初稿：\n\n\
  ![image](img/u15-03-9780443222191.jpg)\n\n此头文件提供了定义插件初始化和清理函数的宏：分别为 `PLUGIN_INIT()`\
  \ 和 `PLUGIN_FREE()`。我还提供了 `PLUGIN_FUNC()` 宏让插件导出函数供 `Core API` 调用，以及 `CORE_FUNC()`\
  \ 宏让插件调用 Core API 函数。最后我提供了一个函数 `RegisterRenderer()`，允许插件向 `Core API` 注册新的 `IRenderer`\
  \ 类。\n\n你可能注意到我们使用了 `CORE_API` 和 `PLUGIN_API` 定义。这些允许我们在 Windows 上指定正确的 DLL/导入装饰符。`CORE_API`\
  \ 用于装饰属于 `Core API` 的函数，而 `PLUGIN_API` 用于定义在插件中的函数。这些宏的定义包含在 `defines.h` 头文件中，如下所示：\n\
  \n![image](img/u15-04-9780443222191.jpg)\n\n你必须在构建 `Core API` 时设置 `BUILDING_CORE`\
  \ 定义，以便这些宏能够正常工作（例如，在 Windows 的编译命令行添加 `/DBUILDING_CORE`）。编译插件时不需要此定义。\n\n最后，为了完整性，这里是\
  \ `renderer.h` 文件的内容，由 `pluginapi.h` 包含：\n\n![image](img/u15-05-9780443222191.jpg)\n\
  \n这与我在“模式”章节中介绍定义的相同，只是我将 `LoadScene()` 方法改为接受 `const char *` 参数而不是 `std::string`（以解决对编译器间\
  \ C++ 标准库类二进制兼容性的担忧）。\n\n### 示例插件\n\n\n\n\n\n既然我已经开发了一个基础的插件 API，让我们来看一下基于此 API\
  \ 构建的插件可能是什么样子的。你需要包含的基础部分有：\n\n1. 新的 `IRenderer` 类。\n2. 用于创建和销毁该类的回调函数。\n3. 一个插件初始化例程，用于向\
  \ `Core API` 注册创建/销毁回调函数。\n\n以下是此类插件的代码。该插件定义并注册了一个名为“opengl” 的新渲染器。它定义在一个新的 `OpenGLRenderer`\
  \ 类中，该类派自于我们的 `IRenderer` 抽象基类：\n\n![image](img/u15-06-9780443222191.jpg)\n\n在这个示例中，我定义了一个\
  \ `PLUGIN_INIT()` 函数，它会在每次插件加载时运行。该函数注册了我们的 `OpenGLRenderer` 工厂函数 `CreateRenderer()`\
  \ 以及相关的销毁函数 `DestroyRenderer()`。这两个函数都是使用 `PLUGIN_FUNC` 定义的，以确保它们以 C 链接正确导出。随后，`PLUGIN_FREE()`\
  \ 函数会在插件卸载时注销该渲染器。\n\n`RegisterRenderer()` 函数本质上只是调用我在“模式”章节中介绍的 `RendererFactory::RegisterRenderer()`\
  \ 方法（额外还可以传递销毁回调以及 `CreateCallback`）。我之所以在插件 API 中添加一个显式的注册函数，而不是让插件直接向 `RendererFactory`\
  \ 注册，有两个原因。其中一个仅仅是为了为我们提供一层抽象，以便将来能够更改 `RendererFactory` 而不会破坏现有插件。另一个原因是为了避免插件调用使用\
  \ C++ 标准库字符串的方法：`RegisterRenderer` 使用 `const char *` 来指定渲染器名称。\n\n### 插件管理器\n\n\
  现在你已经有了插件 API 并且基于此 API 构建插件，你需要能够加载并将这些插件注册到 `Core API` 中。这就是插件管理器（Plugin Manager）的角色。具体来说，插件管理器需要处理这些任务：\n\
  \n1. 加载所有插件的元数据。这些元数据可以存储在单独的文件（如 XML 或 JSON 文件），也可以嵌入插件本身中。在后者的情况下，插件管理器需要加载所有可用的插件以汇总所有插件的元数据。这些元数据允许你向用户展示可用插件列表，供他们从中进行选择。\n\
  2. 将动态库加载到内存中，提供对库中符号的访问，并在必要时卸载库。这涉及到在 UNIX 平台（包括 macOS）上使用 `dlopen()`、`dlclose()`\
  \ 和 `dlsym()`，在 Windows 上使用 `LoadLibrary()`、`FreeLibrary()` 和 `GetProcAddress()`。我在附录\
  \ A（库）中提供了这些调用的细节。\n3. 在插件加载时调用插件的初始化例程，并在插件卸载时调用清理例程。这些是在插件内通过 `PLUGIN_INIT()`\
  \ 和 `PLUGIN_FREE()` 定义的函数。\n\n插件管理器提供了系统中所有插件的单一入口；因此它通常被实现为单例。在设计方面，插件管理器可以被认为是插件实例的集合，每个插件实例代表单个插件，并提供加载和卸载该插件的功能。以下是插件管理器的示例实现：\n\
  \n![image](img/u15-07-9780443222191.jpg)\n\n这种设计将访问所有插件元数据的能力与加载这些插件的需求解耦。也就是说，如果像插件显示名称之类的元数据存储在外部文件中，那么你可以在不加载实际插件的情况下调用\
  \ `PluginManager::GetAllPlugins()`。另一方面，如果元数据存储在插件中，那么 `GetAllPlugins()` 只需先调用 `LoadAll()`。以下示例了一个基于\
  \ XML 语法的示例外部元数据文件：\n\n![image](img/u15-08-9780443222191.jpg)\n\n无论是将插件元数据存储在外部文件还是嵌入到每个插件中，这段代码都会输出所有可用插件的显示名称：\n\
  \n![image](img/u15-09-9780443222191.jpg)\n\n一个相关问题是插件发现。之前的 API 限制 `PluginManager::Load()`\
  \ 的实现搜索多个目录以发现所有插件。传递给此 `Load()` 方法的名称可以是基础插件名称，不带任何路径或文件扩展名，例如“glplugin”。`Load()`\
  \ 方法随后可以搜索各种目录并寻找特定平台扩展名的文件，例如 macOS 上的 `libglplugin.dylib` 或 Windows 上的 `glplugin.dll`。当然，你总是引入自己的插件文件名扩展名。例如，Adobe\
  \ Illustrator 使用 `.aip` 扩展作为其插件，而 Microsoft Excel 使用 `.xll` 扩展。\n\n以下 Core API 初始化代码注册了一个内置渲染器，然后加载所有插件，允许在运行时向系统添加额外的渲染器：\n\
  \n![image](img/u15-10-9780443222191.jpg)\n\n### 插件版本控制\n\n最后，我将扩展版本控制的主题。与 API 版本控制一样，你希望确保插件的发布包含一个版本控制系统。你可以选择采用\
  \ Core API 的版本号，也可以引入一个特定的插件版本号。我建议后者，因为插件 API 是与 Core API 的独立接口，两者可能会以不同的速率变化。这是一个单调递增的整数。你想要访问的最重要信息之一是构建给定插件的插件\
  \ API 版本。这可以让你判断插件是否与当前发布版本不兼容，从而不应该被注册，例如如果插件是用较新版本的 API 构建的。鉴于此信息的重要性，建议在每个插件中自动嵌入此信息。这确保了每次重新编译插件时都能将正确的版本编译到插件。通过我建议的插件\
  \ API，你可以在 `PLUGIN_INIT()` 宏中包含此信息，因为用户必须调用它，插件才能执行任何操作。例如：\n\n| 平台版本 | API 级别 |\n\
  | --- | --- |\n| Android 2.1 | 7 |\n| Android 2.0.1 | 6 |\n| Android 2.0 | 5 |\n\
  | Android 1.6 | 4 |\n| Android 1.5 | 3 |\n| Android 1.1 | 2 |\n| Android 1.0 | 1\
  \ |\n\n![image](img/u15-11-9180443222191.jpg)\n\n此外，用户可以可选地指定插件工作的 API 最小和最大版本。最小版本号会被更频繁指定。例如，如果插件使用了在特定发布中添加到\
  \ API 的新功能，则该发布应被指定为最小版本。指定最大版本号仅在 API 发布了新版本且插件作者发现其会破坏插件时才有用。通常情况下，最大版本将是不设置的，因为插件作者应该假设未来的\
  \ API 发布是向后兼容的。\n\n此最小/最大版本号可以在外部元数据格式中指定，例如：\n\n![image](img/u15-12-9780443222191.jpg)\n\
  \n\n\n\n或者，你可以通过额外的调用来扩展插件 API，让插件在代码中指定这些信息：\n\n![image](img/u15-13-9780443222191.jpg)\n\
  \n## 通过继承扩展\n\n到目前为止，本章重点一直是通过插件在运行时支持 API 的扩展性。然而，你的客户端还有其他方式可以根据自己的目的扩展你 API 的功能。扩展类主要的面向对象机制是继承。这可以允许你的用户定义新类，这些新类基于你\
  \ API 中现有类的基础上构建并修改其功能。\n\n### 添加功能\n\nJonathan Wood 在微软 Visual C++ 开发者中心发布过一个视频，他在其中演示了如何通过继承扩展\
  \ MFC 的 `CString` 类，创建一个 `CPathString` 类，该类为基础字符串类添加了一些路径操作函数。生成的类看起来类似于：\n\n![image](img/u15-14-9780443222191.jpg)\n\
  \n这是一个扩展现有类的简单示例，其中仅基类添加了新方法。\n\n需要重复强调的一个重要点是，只有当该类被设计为可继承时，才能安全地这样做。主要的指标是该类是否具有虚析构函数。在那个示例中，MFC\
  \ 的 `CString` 类没有虚析构函数。这意味着在某些情况下，`CPathString` 的析构函数将不会调用，例如：\n\n![image](img/u15-15-9780443222191.jpg)\n\
  \n在这种情况下这不是问题，因为所有新的 `CPathString` 方法都是无状态的；也就是说，它们没有分配任何必须由 `CPathString` 析构函数释放的内存。然而，这突出了一个问题：如果你希望用户继承你的任何类，你应该将这些类的析构函数声明为虚函数。\n\
  \n### 修改功能\n\n除了向类添加新的成员函数外，我们知道 C++ 允许你在派生类中定义函数，如果这些函数在基类中已被标记为虚函数，则它们可以覆盖基类中的现有函数。如果你为用户提供了这些操作的钩子，这可以为用户自定义类的行为提供更多途径。\n\
  \n例如，`Qt` 库中的所有 UI 部件提供了这些虚方法：\n\n![image](img/u15-16-9780443222191.jpg)\n\n这允许\
  \ `Qt` 库的用户创建这些部件的派生类并改变它们的外。为了说明这一点，以下类继承自标准的 `Qt` 按钮部件并覆盖了 `sizeHint()` 方法以指定按钮的首选尺寸。其结果可以在图\
  \ 15.3 中看到。\n\n这段代码之所以工作是因为 `sizeHint()` 是每个部件的已知方法，并由布局类调用以确定部件的首选尺寸。也就是说，`Qt`\
  \ 库的创建者显式地在工具包中设计了这一点，并允许用户通过故意将方法声明为虚函数在他们的派生类中修改它。\n\n![image](img/u15-17-9780443222191.jpg)\n\
  \n仅仅通过在 `MySquareButton` 构造函数中调用 `resize()` 方法来更改尺寸并不是一回事。这样做的效果是强制设置按钮的大小。然而，`sizeHint()`\
  \ 的作用是为 UI 布局引擎（即 API 中的其他类）提供首选尺寸的指示，以便在需要满足部件约束时覆盖此尺寸。这可以在没有虚 `sizeHint()` 方法的情况下实现。例如，可以在基类中添加非虚的\
  \ `setSizeHint()` 和 `getSizeHint()` 方法。然而，这将要求基类将提示作为数据成员存储在对象中，从而增加每个继承自它的对象的大小。相比之下，使用\
  \ `sizeHint()` 虚方法支持类在每次调用时简单计算首选尺寸，而无需在实例中存储尺寸。\n\n在关于性能的章节中，我曾警告你只在需要时才向类添加虚方法。在之前的示例中，`Qt`\
  \ API 的设计者仔细且有意识地向他们的 API 添加了这些虚方法，为他们的用户扩展类功能提供了一种灵活的方法。\n\n### 继承与标准库\n\n对 C++\
  \ 和 C++ 标准库的新手经常尝试对容器进行子类化，例如：\n\n![image](img/u15-18-9780443222191.jpg)\n\n然而，正如我指出的，你应该只尝试派生定义了虚析构函数的类。标准库容器类没有提供虚析构函数，事实上也没有虚方法供你覆盖。这清楚表明这些类并不是设计用来继承的。这样做可能会在你的代码和客户端代码中引入微妙且难以调试的内存泄漏。因此，通用规则是你永远不要继承\
  \ C++ 标准库类。\n\n作为替代方案，你可以使用组合以安全的方式为标准库容器添加功能。即使用 `std::string` 作为私有成员并提供包装方法。例如：\n\
  \n![image](img/u15-19-9780443222191.jpg)\n\n然而，标准库确实提供了一些设计用于继承的类。其中最明显的是 `std::exception`。它是所有标准库异常的基类，包括：`bad_alloc`、`bad_cast`、`bad_exception`、`bad_typeid`、`lock_error`、`logic_error`\
  \ 和 `runtime_error`。你可以简单地定义派自 `std::exception` 的自定义异常：\n\n![image](img/u15-20-9780443222191.jpg)\n\
  \n标准库另一个支持继承扩展的部分是 `iostream` 库。这实际上是一个强大、设计良好的可扩展 API。流可以等待处理的字节序列，例如标准的 `cin`\
  \ 输入流和 `cout` 输出流。你可以通过派生特定的流类或基类 `streambuf` 来编写自定义流类。例如，你可以创建自定义流类来向 Web 服务器发送/接收\
  \ HTTP 数据。\n\n还有 `Boostostreams` 库，它使得处理标准库流和缓冲区更容易，并提供了一个在流和缓冲区上定义过滤器的框架。该库包含许多常用的过滤器，包括正则表达式过滤和数据压缩方案，如\
  \ `zlib`、`gzip` 和 `bzip2`。\n\n### 继承与枚举\n\n有时你的用户可能想要扩展你在某个基类中定义的枚举，例如为他们在派生类中添加的新功能添加更多枚举值。这在\
  \ C++ 中可以很容易实现：\n\n![image](img/u15-21-9780443222191.jpg)\n\n这是一个演示如何使用这种扩展枚举的示例：\n\
  \n![image](img/u15-22-9780443222191.jpg)\n\n\n\n\n使此机制运行稳健的一个重要部分在于，`Base` 类定义了\
  \ `SHAPE_END`，这样 `Derived` 类就可以在 `Base::SHAPE` 定义的最后一个值之后添加新值。因此，当你在预计可能被客户端子类化的类中定义枚举时，这种做法对你来说是一个很好的实践。如果不这样做，你的客户可能会选取任意巨大的整数来开始为它们的枚举器编号（例如，`OVAL=100`），虽然这是一种不优雅的解决方案。\n\
  \n你也可以用 C++11 的 `enum class` 实现这一点，尽管 `enum class` 不会隐式转换为其底层类型，因此你必须添加显式转换，例如 `OVAL\
  \ = static_cast<int>(Base::SHAPE::SHAPE_END) + 1`。\n\n### 访问者模式 (Visitor pattern)\n\
  \n我们在第 3 章（模式）中介绍过各种通用设计模式。然而，我们推迟到现在才讨论访问者设计模式，因为它专门针对 API 的可扩展性。访问者模式的核心目标是允许客户端遍历数据结构中的所有对象，并对这些每个对象执行给定的操作。这种模式本质上是模拟向现有类添加新虚方法的方法。因此，它为你的客户端扩展你的\
  \ API 功能提供了一个实用的模式。例如，访问者模式可以用来客户端提供一组方法，用于对场景图层次结构中的每个节点进行操作，或者遍历编程语言解析器的派生树并输出程序的人类可读形式。\n\
  \n让我们开发一个访问者示例来说说明该模式的工作原理。我将使用一个描述 3D 场景的场景图层次结构示例，例如 Open Inventor、OpenSceneGraph\
  \ 或虚拟现实建模语言所使用的那种。为了保持示例简单性，我们的场景图将只包含三种不同的节点类型：`Shape`、`Transform` 和 `Light`。图\
  \ 15.4 显示了一个使用这些节点类型的示例层次结构。\n\n![image](img/f15-04-9780443222191.jpg)\n\n图 15.4\
  \ 显示了不同类型节点的示例场景图层次结构。\n\n我将从定义我们的抽象访问者接口开始。客户端可以创建此接口的具体子类，以便为场景图添加自定义操作。它本质上为场景图中的每种节点类型声明了一个\
  \ `Visit()` 方法：\n\n![image](img/u15-23-9780443222191.jpg)\n\n现在来看我们的场景图。它提供了我们每种节点类型的声明，以及一个骨架\
  \ `SceneGraph` 类。每个节点类型都派生自基础节点类型，称为 `BaseNode`：\n\n![image](img/u15-24-9780443222191.jpg)![image](img/f15-05-9780443222191.jpg)\n\
  \n图 15.5 访问者设计模式的 UML 图。\n\n每个节点类型都声明了一个 `Accept()` 方法，并将 `Visitor` 对象作为其参数。该方法用于调用\
  \ `Visitor` 类中相应的 `Visit()` 方法。这可以被认为是在每个节点中有一个单一的虚方法，然后该方法可以调用任何用户提供的虚方法。图 15.5\
  \ 展示了一个显示这种访问者模式的统一建模语言（UML）图：\n\n![image](img/u15-25-9780443222191.jpg)\n\n在此基础设施的基础上，`SceneGraph::Traverse()`\
  \ 方法可以通过遍历场景图层次结构，然后调用图中每个节点的 `Accept()` 方法来实现。你的客户端随后可以定义自定义的访问者类，以便对场景图执行任意操作。这样做不需要暴露有关场景图如何实现的细节。例如，接下来的代码演示了客户端如何编写一个访问者来计算场景图中每种类型节点的数量，并累加场景图中所有形状节点的多边形计数：\n\
  \n![image](img/u15-26-9780443222191.jpg)\n\n这个示例演示了访问者模式的许多优点。与可扩展性主题最相关的优点是，客户端可以有效地将他们自己的方法插入到你的类层次结构中。其他优点包括所有执行单一连贯操作的代码在一起。例如，在该示例中实现节点计数功能的所有代码都包含在单一\
  \ `MyVisitor` 类中，而不是分布在所有单独的节点类中。进一步的优点是，计算各种节点和多边形数量所需的状态（`mNumShapes`、`mNumPolygons`、`mNumTransforms`\
  \ 和 `mNumLights`）被隔离在 `MyVisitor` 类中，而不是直接存储在 `SceneGraph` 对象中，从而增加了其的大小。\n\n然而，访问者模式也有一些显著的缺点。能够向相关类集合中添加新方法的灵活性，是以增加添加新相关类的难度为代价的。在\
  \ `visitor.h` 中，访问者接口必须了解每个可以被访问的类（即我们所有的节点类型）。因此，向我们的场景图添加新的节点类型将需要同时更新 `Visitor`\
  \ 接口。结果，访问者模式最适用于类层次结构保持稳定的情况（Alexandrescu, 2001）。\n\n为了解决这个问题，让我们考虑向我们的场景图添加一种名为\
  \ `CameraNode` 的新节点类型。此此简单的方法是在 `INodeVisitor` 接口中添加另一个接受 `CameraNode` 的纯虚 `Visit()`\
  \ 方法。然而，我们知道从 API 向后兼容性的角度来看，向接口添加纯虚方法是一件坏事，因为它将破坏所有现有的客户端代码。相反，有几种替代方法可以解决这个问题：\n\
  \n1. 提前考虑考虑，你可以发布带有针对 `BaseNode` 的纯虚 `Visit()` 方法的第一版本 `INodeVisitor`。这在实际上将变成一个捕获方法，当遇到没有显式\
  \ `Visit()` 方法的节点类型时会被调用。这种不优雅的后果是，用户必须在该捕获方法中使用一系列 `dynamic_cast` 调用来确定传入的是哪种节点类型。采用这种解决方案将如下更改访问者接口：\n\
  \n![image](img/u15-27-9780443222191.jpg)\n\n2. 更好的解决方案是为新的节点类型添加新的 `Visit()` 虚方法，而不是纯虚方法。也就是说，你为新方法提供一个空实现，以便现有代码能够继续编译，同时允许用户在适当的地方为新的节点类型实现类型安全的\
  \ `Visit()` 方法。这将更改 `INodeVisitor` 接口：\n\n![image](img/u15-28-9780443222191.jpg)\n\
  \n\n\n\n\n同样，标准库提供了创建引用计数指针的能力，这种指针可以持有任何指针类型，而无需诉诸于 `void *`。这提供了一种强大且通用的机制，客户端可以对其进行定制，创建指向任何对象的类型安全的共享指针，例如\
  \ `std::shared_ptr<MyCustomClass>`。\n\n因此，模板提供了一种编写可扩展代码极极方法，这些代码适用于许多不同类型，包括客户端在自己的代码中定义的类型。在接下来的几个章节中，我将介绍基于策略的模板（policy-based\
  \ templates）的概念，以帮助你最大化类模板的灵活性。我还将研究一种异常常见的模板模式，它提供了一种面向对象编程动态多态的替代方案——静态多态。\n\n\
  ## 基于策略的模板\n\nAndrei Alexandrescu 在他 2001 年的著作《现代 C++设计》（*Modern C++ Design*）中推广了基于策略模板的使用。该术语指的是通过较小的类（称为策略类）来构建复杂行为的方法，每个策略类定义了整个组件的某个方面的接口。这一概念是通过使用接受若干模板参数（通常是模板模板参数）的类模板来实现的，使用符合每个策略接口的类进行实例化。通过插入不同的策略类，你可以产生指数级数量的具体类。\n\
  \n例如，Alexandrescu 展示了这种智能指针类模板的设计，该模板接受若干策略类来定制其行为（Alexandrescu, 2001）：\n\n![image](img/u15-29-9780443222191.jpg)\n\
  \n`SmartPtr` 指向的类型由模板参数 `T` 表示。其余参数指定了智能指针的各种策略或行为。这些可以使用符合每个参数定义接口的类进行实例化，并为智能指针提供替代实现。以下是每个参数用途的概述：\n\
  \n1. `OwnershipPolicy`：指定智能指针的所有权模型。预定义的策略类包括 `RefCounted`、`DeepCopy` 和 `NoCopy`。\n\
  2. `ConversionPolicy`：决定是否允许隐式转换为所指向对象的类型。两个可用的类是 `AllowConversion` 和 `DisallowConversion`。\n\
  3. `CheckingPolicy`：指定错误检查策略。该参数的预定义策略类包括 `AssertCheck`、`RejectNull` 和 `NoCheck`。\n\
  4. `StoragePolicy`：定义所指向对象的存储和访问方式，包括 `DefaultSPStorage`、`ArrayStorage` 和 `HeapStorage`。\n\
  \n基于策略的设计承认，计算机科学中的每个问题都存在多种解决方案。使用这些通用组件意味着客户端仅需在编译时提供策略类的不同组合，即可在成千上万的解决方案中进行选择。\n\
  \n创建你自己的基于策略模板的第一步是将类拆分解为正交的部分。任何可以用多种方式完成的事情都是都可以提炼为策略的候选者。相互依赖的策略也是进一步分解或重新设计的候选者。当然，这里并没有新东西。良好软件工程的本质在于能够识别针对特定问题的更通用、更灵活的抽象。\n\
  \n推向极端，宿主类（通常被称为基于策略的模板）变成一个外壳，简单地组装策略集合以产生聚合行为。然而，Alexandrescu 指出，对于任何给定的宿主类，你应该尝试保持策略类的数量较，因为处理超过四个到六个模板参数会变得很尴尬。这与我们工作内存的认知限制良好对应，该限制被认为是\
  \ 7±2（Miller, 1956）。\n\n为用于特定任务的特定策略类组合提供类型定义（typedef）也是很有用的。例如，如果你的 API 传递使用非默认策略的智能指针，那么每次都指定所有这些参数将非常麻烦，而且将来更改这些策略将要求客户端相应地更新所有代码。相反，你可以为特定的指针类型引入一个\
  \ `typedef`，例如：\n\n![image](img/u15-30-9780443222191.jpg)\n\n## 奇异递归模板模式\n\n在关于通过模板实现扩展性的最后一个章节中，我将介绍一种有趣的\
  \ C++ 惯用法，它最早由 James Coplien 在早期模板代码中观察到（Coplien, 1995），它可能对你自己的 API 设计有所帮助。奇异递归模板模式（CRTP）涉及一个模板类，它使用自身作为模板参数继承自一个基类。换句话说（也许为了让最后句话更清楚），就是基类根据其派生类的类型进行模板化。这提供了一种迷人的特性，即基类可以访问其派生类的命名空间。该模式的一般形式是：\n\
  \n![image](img/u15-31-9780443222191.jpg)\n\n`CRTP` 本质上只是提供编译时多态的一种。也就是说，它允许从基类继承接口，但避免了运行时方法调用的开销。通过这种方式，它可以被认为是一个“混合”（mixin）类（即带有实现方法的接口类）。\n\
  \n作为这种模式的实用示例，`CRTP` 可用于跟踪模板每个特化版本的统计信息。例如，你可以用它来跟踪给定类型的对象的计数，或者给定类型的所有对象占用的内存。我将演示后者。\n\
