  \ T1::operator delete[](void* x);`\n\n\n\n\n在为函数指定参数时，你可以选择将它们作为值参数、指针或引用进行传递。例如：\n\
  \n![image](img/u06-39-9780443222191.jpg)\n\n当你希望接收一个实际对象的句柄而非对象的副本时，可以将参数作为引用或指针传递。这样做是为了出于性能考虑（我将在第\
  \ 7 章中进行讨论），或者是为了以便你能够修改客户端的对象。C++ 编译器通常使用指针来实现引用，因此在底层它们通常是同一个东西。然而，它们之间存在一些实际上的差异，例如：\n\
  \n1. 引用的使用方式就像使用值一样，例如使用 `object.Function()` 而不是 `object->Function()`。\n2. 引用必须初始化为指向一个对象，并且在初始化后不支持更改引用的对象。\n\
  3. 你不能像取指针那样获取引用的地址。在引用上使用 `&` 运算符返回的是所引用对象的地址。\n4. 你不能创建引用数组。\n\n对于参数应该使用指针还是引用，这实际上是一个个人喜好的问题。然而，我建议通常情况下对于任何输入参数，都应该优先使用引用而不是指针。这是因为客户端的调用语法更简单，而且你不需要担心检查\
  \ `nullptr` 值（因为引用不能为空）。但是，如果你需要支持传递 `nullptr`，或者你正在编写纯 C API，那么你显然必须使用指针。\n\n在输出参数（你的函数可能会修改的参数）方面，一些工程师不喜欢引用没有向客户端指示某个参数可能会被修改。例如，之前的\
  \ `GetColor()` 函数的引用版本和指针版本可以被客户端这样调用：\n\n![image](img/u06-40-9780443222191.jpg)\n\
  \n在这两种情况下，`GetColor()` 函数都可以修改红色、绿色和蓝色变量的值。然而，指针版本由于必须使用 `&` 运算符，使得这一事实变得显式。由于由于原因，像\
  \ Qt 框架这样的 API 倾向于使用指针而非引用表示输出参数。如果你决定也遵循这一惯例（我建议这样做），那么隐含意味着你所有的引用参数都应该是 `const`\
  \ 引用。\n\n### 默认参数\n\n默认参数是非常用的工具，可以减少你 API 中的方法数量，并对它们的用法提供隐式文档。它们还可以以向后兼容的方式扩展\
  \ API 调用，使得旧的客户端代码仍然可以编译，但新代码可以可选地提供额外的参数（尽管需要注意的是，这将破坏二进制兼容性，因为如果添加新参数，方法的修饰后符号名称将发生变化）。例如，考虑以下\
  \ `Sphere` 类的这段代码段：\n\n![image](img/u06-41-9780443222191.jpg)\n\n在这种情况下，用户可以用几种不同的方式构造新的\
  \ `Sphere` 对象，并提供所需的详细信息。例如：\n\n![image](img/u06-42-9780443222191.jpg)\n\n然而，这个示例有两个问题需要考虑。首先，它支持了不符合逻辑的参数组合，例如提供了\
  \ `x` 参数但没有提供 `y` 参数。此外，默认值会被编译到你的客户端的程序中。这意味着如果你发布了具有不同默认半径的 API 新版本，你的客户端必须重新编译代码。从本质上说，当你显式指定半径值时，你实际上暴露了\
  \ API 的行为。\n\n为了说明为什么这可能是坏的，考虑一下你之后添加了对不同默认单位的支持，允许用户在米、厘米或毫米指定的值之间切换。在这种情况下，`10.0`\
  \ 的常数默认半径对于所有单位都是是不恰当的。\n\n另一种替代方法是提供多个重载方法，而不是使用默认参数。例如：\n\n![image](img/u06-43-9780443222197.jpg)\n\
  \n使用这种方法，前两个构造函数的实现可以为未指定的属性使用默认值。但重要的是，这些默认值是在 `.cpp` 文件中指定的，没有暴露在 `.h` 文件中。因此，API\
  \ 的后续版本可以更改这些值而不会对公共接口产生任何影响。\n\n并不是所有默认参数的实例都需要转换为重载方法。如果默认参数代表无效或空值，例如将 `nullptr`\
  \ 定义为指针的默认值，或将 `\"\"` 定义为字符串参数的默认值，那么这种用法在 API 版本之间不太可能改变。但是，如果你有某些可能变化的情况需要硬编码值，那么你应该将这些情况转换为重载方法。\n\
  \n### 避免使用 #define 定义常量\n\n`#define` 处理器指令本质上用于将一个字符串替换为另一个。然而，在 C++ 社区中这种用法通常是被反对的，出于几个很好的原因（Cline\
  \ et al., 1998; Loura, 2001; Meyers, 2005）。许多这些原因与你使用 `#define` 指定你希望插入到多个处的代码时可能发生的微妙问题有关。例如：\n\
  \n![image](img/u06-44-9780443222191.jpg)\n\n然而，你绝不应该在公共头文件中以这种方式使用 `#define`，因为这泄露了实现细节。如果你想在\
  \ `.cpp` 文件中使用这种技术，并且你理解 `#define` 的所有特性，那么尽管做吧，但千万不要在你的公共头文件中这样做。\n\n剩下的就是使用 `#define`\
  \ 为你的 API 指定常量，例如：\n\n![image](img/u06-45-9780443222191.jpg)\n\n你仍然应该避免这种使用 `#define`（除非你正在编写纯\
  \ C API，当然如此），出于以下原因：\n\n- 没有类型检查。`#define` 不涉及对你定义的常量进行任何类型检查。因此，你必须确保显式指定你所定义常量的类型，以避免任何歧义，例如对单精度浮点常量使用\
  \ `f` 后缀。如果你将浮点常量简单地定义为 `10`，那么它在某些情况下可能会被假设为整数并导致意外的数学舍入误差。\n- 没有作用域限制。`#define`\
  \ 语句是全局的，不限于特定的作用域（例如在单个类内部）。你可以使用 `#undef` 处理器指令来取消之前的 `#define`，但对于声明你希望让客户端使用的常量来说，这意义不大。\n\
  - 没有访问控制。你无法将 `#define` 标记为公共、受保护或私有。它本质上总是公开的。因此，你无法使用 `#define` 来指定一个仅供定义的基类的派生类访问的常量。\n\
  \n\n\n\n### 4. 无符号。\n\n在之前的示例中，诸如 `MORPH_IN_TIME` 这样的符号名称可能会被预处理器从你的代码中剥离，因此编译器永远看不到这个名称，也就无法将其存入符号表\
  \ (Meyers, 2005)。当你的客户端尝试使用你的 API 调试代码时，这可能会向他们隐藏有价值的信息，因为他们在调试器中看到的将是所使用的常量值，而没有任何任何描述性名称。\n\
  \n使用 `#define` 声明 API 常量的优替代方案是使用 `const` 变量。我将在后面的关于“性能”的章节中讨论声明常量的一些最佳实践，因为声明\
  \ `const` 变量可能会导致客户端程序的体积膨胀。目前，我将简单展示对上一个 `#define` 示例的良好转换：\n\n![image](img/u06-46-9780443222191.jpg)\n\
  \n其中这些常量的实际值在相关的 `.cpp` 文件指定。如果你真的想让用户知道这些常量的值是什么，你可以在 `Morph` 类的 API 文档中告诉他们这些信息。或者，从\
  \ C++17 开始，你可以使用 `inline` 变量仅在头文件中定义常量，这是一种更优雅的解决方案。请注意，这种表示方式不会受到我之前列出的任何问题的影响：常量被类型化为\
  \ `float`，作用域限于 `Morph` 类，被显式标记为公开访问，并且会在符号表中生成条目。\n\n`#define` 的进一步用法是为给变量提供可能值的列表。例如：\n\
  \n![image](img/u06-47-9780443222191.jpg)\n\n在 C++ 中，使用枚举类型（通过 `enum class`）来表达这一点会更好。使用枚举可以给你提供更好的类型安全，因为编译器现在会确保你使用符号名称来设置任何枚举值，而不是直接设为整数。这使得传递非法值变得困难，例如上一个示例中的\
  \ `-1` 或 `23`。你可以将早前的 `#define` 行转换为枚举类型：\n\n![image](img/u06-48-9780443222191.jpg)\n\
  \n### 避免使用朋友（friends）\n\n在 C++ 中，友元（friendship）是你的类向另一个类或函数授予完全访问权限的一种。`friend`\
  \ 类或 `friend` 函数可以访问你类中的所有受保护（protected）和私有（private）成员。当你需要将类拆分为两个或多个部分，但仍然需要每个部分访问另一个部分的私有成员时，这非常有用。当你需要采用内部访问者（visitor）或回调（callback）技术时，它也很有用：即你实现代码中的某些其他内部类需要调用你类中的私有方法。\n\
  \n另一种方案是暴露需要共享的成员数据和函数，将它们从 `private` 转换为 `public`，以便其他类可以访问它们。然而，这意味着你正在向客户端暴露实现细节，而这些细节在其他情况下并不属于你逻辑接口的一部分。从这个角度来看，友元是好事，因为它们允许你只对特定的客户端开放对类的访问权限。然而，友元可能会被用户滥用，允许他们获得对类内部细节的完全访问权限。\n\
  \n例如，考虑以下类，它在 `Graph` 层次结构中指定了单个 `Node`。`Graph` 可能需要对所有节点执行各种迭代，因此需要跟踪一个节点是否已经被访问过（以处理图循环）。实现此点的一种方法是让\
  \ `Node` 对象持有是否已访问过的状态，并提供访问该状态的访问器。这纯粹是实现细节，因此你不希望在公共接口中暴露此功能。相反，你将其声明为 `private`，但通过将其声明为\
  \ `friend` 来显式赋予 `Graph` 对象对 `Node` 对象的访问权限：\n\n![image](img/u06-49-9780443222191.jpg)\n\
  \n这表面上看起来没问题：你将各种 `Visited()` 方法保持为 `private`，并且只允许 `Graph` 类访问我们的内部细节。然而，这个问题的问题在于，友元提议仅基于另一个类的名称。因此，客户端可能会创建一个名为\
  \ `Graph` 的自己的类，然后该类将能够访问 `Node` 的所有受保护和私有成员 (Lakos, 1996)。随后的客户端程序演示了执行这种访问控制违反是多简单：\n\
  \n![image](img/u06-50-9780443222191)\n\n### 符号符号\n\n除了语言级别的访问控制功能（`public`、`private`、`protected`），还有两个相关概念允许你在物理层面在\
  \ API 中暴露符号：外部链接（external linkage）和导出（exported）。\n\n外部链接术语意味着一个编译单元中的符号可以从其他编译单元访问，而导出指的是从库可见的符号。只有具有外部链接的符号才能被导出。\n\
  \n让我们先看看外部链接。这是决定客户端能否访问符号的第一阶段。具体来说，除非你采取措施，否则 `.cpp` 文件中的全局（文件作用域）自由函数和变量将具有外部链接。例如，考虑可能出现在你某个\
  \ `.cpp` 文件中的以下代码：\n\n![image](img/u06-51-9780443222191.jpg)\n\n即使你将这些函数和变量包含在 `.cpp`\
  \ 文件中，机明的客户端也可以从它们自己的程序轻松访问这些符号（暂时忽略符号导出问题）。它们可以直接调用你的全局函数并修改你的全局状态，而不通过你的公共 API，从而破坏了封装。以下程序片段演示了如何实现这一点：\n\
  \n![image](img/u06-52-9780443222191.jpg)\n\n解决这种外部链接泄漏问题有几种方案：\n\n1. **静态声明。** 在你的函数和变量声明前加上\
  \ `static` 关键字。这指定了函数或变量应具有内部链接，因此在出现它的编译单元外部不可访问。\n2. **匿名命名空间。** 一个更符合 C++ 习惯的解决方案是将文件作用域函数和变量封装在匿名命名空间中。这是一个更好的解决方案，因为它避免了污染全局命名空间。可以这样做：\n\
  \n![image](img/u06-53-9780443222191.jpg)\n\n\n\n\n对于具有外部链接的符号，还有一个进一步的概念叫做“导出符号”（exporting\
  \ symbols），它决定了符号是否从共享库中可见。大多数编译器为类和函数提供了装饰器（decorations），让你显式指定符号是否会出现在库文件的导出符号表中。然而，这通常是特定于编译器的行为。例如：\n\
  \n1. **Microsoft Visual Studio。** DLL 中的符号默认是不可访问的。你必须显式地导出 DLL 中的函数、类和变量，以允许你的客户端访问它们。你可以在符号之前使用\
  \ `__declspec` 装饰符来实现此点。例如，在构建 DLL 时，你指定 `__declspec(dllexport)` 来导出符号。随后客户端必须在自己的程序中指定\
  \ `__declspec(dllimport)` 来访问同一个符号。\n\n2. **GNU/Clang C++ 编译器。** 动态库中具有外部链接的符号默认是可见的。但是，你可以使用可见性\
  \ `__attribute__` 装饰符来显式地隐藏符号。作为隐藏单个符号的备选方案，GNU C++ 4.0 编译器引入了 `-fvisibility=hidden`\
  \ 标志，将所有声明默认设置为隐藏可见性。然后可以使用 `__attribute__ ((visibility(\"default\"))))` 显式地导出单个符号。这更像\
  \ Windows 的行为，在 Windows 中，除非你显式导出，否则所有符号都被视为内部符号。使用 `-fvisibility=hidden` 标志还可以对你的动态库的加载性能产生巨大影响，并生成更小的库文件。\n\
  \n你可以定义各种预处理器宏以跨平台的方式处理这些编译器差异。这里有一个定义 `DLL_PUBLIC` 宏来显式导出符号，以及定义 `DLL_HIDDEN` 宏在用\
  \ GNU C++ 编译器时隐藏符号的示例。请注意，在 Windows 上构建库文件时，必须指定一个 `EXPORTING` 定义（即 `/D \"_EXPORTING\"\
  `）。这是一个任意的定义名称，你可以根据喜好命名它（只要你同步更新了代码即可）：\n\n![image](img/u06-54-9780443222191.jpg)\n\
  \n例如，为了导出你 API 中的类或函数，你可以这样做：\n\n![image](img/u06-55-978044322219.jpg)\n\n许多编译器还允许你提供一个简单的\
  \ ASCII 文件，定义动态库应该导出的符号列表，这样你就不需要像前面的 `DLL_PUBLIC` 那样用宏来装饰代码了。未出现在此文件中的符号将对客户端程序隐藏。例如，Windows\
  \ Visual Studio 编译器支持 `.def` 文件，而 GNU 编译器支持导出映射文件（export map files）。有关这些导出文件的更多细节，请参见附录\
  \ A。\n\n注意，随着 C++20 模块的引入，你可以在命名模块中使用 `export` 关键字来指示哪些符号可以从模块访问。这有效地为所有编译器的翻译单元标准化了符号导出行为，但前提是你正在使用模块。有关此功能的更多详细信息，请参见\
  \ C++ 修订章节中的模块部分。\n\n## 编码规范\n\nC++ 是一种非常复杂的语言，具有许多强大的特性。使用良好的编码规范可以部分帮助管理这种复杂性，确保所有代码都遵循某些风格指南并避免常见的陷阱。它有助于代码的一致性，我将其识别为优秀\
  \ API 的重要品质之一，见第 2 章。\n\n编写编码标准文档可能是一个漫长且容易产生争议的过程，不仅是因为语言的复杂性，还因为其旨在规定了大量的个人喜好和风格。不同的工程师对于括号和空格的位置、采用何种风格的注释，或者对函数名使用小驼峰命名还是大驼峰命名（camelCase）有不同的偏好。例如，在书中，我一贯地格式化代码段，将指针或引用符号放在变量名旁边而不是类型名旁边。例如：\n\
  \n![image](img/u06-56-9780443222191.jpg)\n\n而不是：\n\n![image](img/u06-57-9780443222191.jpg)\n\
  \n我更喜欢前者风格，因为从语言的角度来看，指针与变量相关，而不是类型（在这两种情况下，`a` 和 `b` 都是指针）。然而，其他软件工程师更偏好后者。\n\n\
  在书中，我不主张为项目采用任何特定的风格，但我敦促你为 API 采用一些规范，无论它们是什么。重要的点是保持一致。事实上，工程师之间普遍认为，在编辑源文件时，你应该采用该文件中已经生效的规范，而不是将自己的风格混入其中。\n\
  \n许多公司已经经历了创建和发布风格文档的过程，因此你可以直接采用这些标准来使决策更容易。特别是，Google C++风格指南是一份非常详尽的文档并被广泛使用（[google.github.io/style/](https://google.github.io/style/)）。此外，一些优秀的书籍提供了更深入的细节，关于应该使用或避免的众多构造（Sutter\
  \ and Alexandrescu, 2004)）。\n\n没有具体的建议，我列出了良好的编码标准应该涵盖的一些领域：\n\n1. **命名规范。** 使用\
  \ `.cc`、`.c++` 还是 `.cpp`；文件名的大小写；文件名中的前缀；类、函数、变量的大小写，以及区分私有成员、常量、类型定义、枚举、宏、命名空间；命名空间的使用；等。\n\
  \n2. **头文件。** 如何 `#include` 头文件；使用双引号还是角括号；`#include` 语句的顺序；使用 `#define` 保护符或 `#pragma\
  \ once`；使用前置声明；内联策略；等等。\n\n3. **注释。** 注释风格；文件、类、函数的注释模板；文档要求；使用 `todo` 标记代码或标记已知的黑科技；等等。\n\
  \n4. **格式化。** 行长度限制；空格还是制表符；大括号的位置；语句之间的间距；如何折行长语句；构造函数初始化列表的布局等。\n\n5. **类。** 构造函数的使用；工厂；继承；多重继承；接口；组合；`struct`\
  \ 与 `class` 的区别；访问控制；等等。\n\n7. **最佳实践。** 模板的使用；异常的使用；枚举的使用；常量正确性；使用指针作为输出参数；使用 pimpl\
  \ 模式；初始化所有成员变量；类型转换；运算符重载规则；虚析构函数；全局变量的使用；等等。\n\n8. **移植性。** 编写特定架构的代码；针对平台的预处理器宏；类成员对齐；等等。\n\
  \n9. **流程。** 编译将警告视为错误；单元测试要求；代码审查的使用；用例的使用；SCM 风格检查钩子；使用额外的检查项（如 `-Wextra` 和 `-Weffc++`）进行编译；等等。\n\
  \n\n\n最好的编码规范是那些可以自动应用于你的代码的规范。有几种工具可以用来一致地格式化你的源文件；我喜欢的其中是 `clang-format`。它内置了许多样式，如\
  \ `LLVM`、`GNU`、`Google`、`Chromium`、`Microsoft`、`Mozilla` 和 `WebKit`。因此，如果你只想采用其中一种标准编码规范，可以很容易地通过一条命令行让所有代码都符合规范，例如：\n\
  \n![image](img/u06-58-9780443222191.jpg)\n\n如果你不喜欢该风格的某些部分，`clang-format` 支持大量的设置可供你编辑。要做到这一点，你可以将其中一种标准式的配置导出到文件中，然后编辑该文件以符合你的偏好。例如，以下是如何创建一个名为\
  \ `.clang-format` 的文件并包含所有的 `Microsoft` 样式选项，然后你可以根据自己的喜对对文件进行修改：\n\n![image](img/u06-59-9780443222191.jpg)\n\
  \n然后你可以通过运行以下命令使用自定义样式格式化你的代码：\n\n![image](img/u06-60-9780443222191.jpg)\n\n在这种情况下，工具将专门在你的源目录下查找名为\
  \ `.clang-format` 的文件。如果没找到该文件，它将遍历每个父目录。因此，一种良好的做法是将此文件放在源仓库的根目录下，以便它影响你所有的代码。你还可以考虑更新任何构建脚本以自动格式化你的代码，或者为你的版本控制系统定义一个钩子，在推送更改之前运行它。这样，你就可以确保代码始终遵循你的编码规范，而且额外的好处是，你可以避免代码审查中关于空格或括号位置的细碎意见反馈。\n\
  \n事实上，本书中所有的代码示例都使用 `clang-format` 进行了格式化，以强制一致的风格。你可以在书籍网站的源代码包中找到我使用的配置文件，[`APIBook.com/`](https://APIBook.com/)。\n\
  \n# 7: C++ 版本\n\n## 摘要\n\nC++ 标准在 2011 年引入 `C++11` 时经历了首次重大更新。从那时起，ISO 标准委员会按照定期发布了后续多次更新，包括\
  \ `C++14`、`C++17`、`C++20` 和 `C++23`。本章将逐一讨论这些版本，并描述每个更新中引入的所有重要的应用程序编程接口（API）设计特性。例如，智能指针、`enum\
  \ classes` 和五人法则（Rule of Five）在 `C++11` 中引入。`auto` 返回类型和 `deprecated` 属性被添加到 `C++14`\
  \ 中。内联变量以及 `optional`、`any` 和 `variant` 类型被添加到 `C++17`。模块和飞船运算符（spaceship operator）出现在\
  \ `C++20` 中，而期望值（expected values）在 `C++23` 中引入。本章提供了关于如何在软件项目中选择采用哪个版本的标准的建议，并为每个版本提供了你可能想要在\
  \ API 设计中开始使用的最重要的特性的总结，以及它们对客户端向后兼容性可能产生。\n\n### 关键词\n\n`Auto`；`Enum class`；`Module`；`Move\
  \ constructor`；`Smart pointer`；`std:any`；`std:expected`；`std:optional`；`std:variant`；`Template`\n\
  \n在 1998 年 C++ 语言初步标准化以及 2003 年后续的小调后，该语言在 2011 年通过 `C++11` 经历了重大修订。从那时起，ISO 标准委员会承诺每\
  \ 3 年发布一次语言更新。到目前，我们已经看到了 `C++14`、`C++17`、`C++20` 和 `C++23`。这些版本的规模各异，但它们通常试图解决现有功能中的问题或歧义，并为核心语言和标准库添加新功能。\n\
  \n我没有将所有版本的所有特性混合在一个单一的讨论中，而是选择按时间顺序将它们分开。其原因是，你通常会在每个软件项目中有意识地选择使用哪个版本的标准，因此你只需要读到涵盖你正在使用的版本的章节即可。当然，你也可以一直读下去，以了解那些可能启发你采用更新版本的有用特性。\n\
  \n本章并不是每个版本中引入的每个特性的详尽汇编。由于本书侧重于应用程序编程接口（API）设计，我将只关注对你的接口设计有影响的特性。虽然 `auto` 关键字、基于范围的\
  \ for 循环、lambda 表达式和新的标准库算法是语言的极佳补充，但它们对你如何向用户交付健壮的接口影响很小，因此我不会在这些方面上花费时间。\n\n##\
  \ 使用哪个 C++ 版本\n\n考虑到已发布的各种 C++ 版本，你可能会问项目应该目标应该是哪一个。在做决策时需要考虑的因素包括：\n\n*   1. **依赖项**：依赖库所使用的\
  \ C++ 版本会影响你的选择。\n* 2. **客户端**：终端用户对可以支持的版本可能有限制。\n*   3. **编译器**：并非所有平台的编译器都能完全支持最新版本。\n\
  *   4. **特性**：你可能想要使用更新的版本，因为它提供了你想要使用的最新特性。\n\n一个重要的问题是，是否可以在一个项目中混合不同的 C++ 版本。例如，如果你的依赖项都使用\
  \ `C++17`，你可以使用 `C++20` 吗？这里的关键因素是你从源码还是二进制构建依赖项。如果你有库的源码，通常没有问题：`C++20` 编译器能够编译更早的版本。如果你仅依赖预编译二进制，情况就会变得复杂。C++\
  \ 标准没有定义标准的应用程序二进制接口（ABI）。因此，默认你应该假设不能混合不同版本编译的代码。\n\n尽管如此，某些编译器实现确实努力提供兼容的 ABI。例如，`gcc`\
  \ 和 `clang` 通常允许你链接不同版本编译的代码。例如，对于这些编译器，`C++17` 和 `C++11` 是二进制兼容的。相比之下，Microsoft\
  \ Visual C++ 不在版本之间维护 ABI 兼容。Microsoft C Runtime（MSVCRT）根据编译器的发布进行版本，应用程序无法混合多个运行时。\n\
  \n至于具体的建议，`C++11` 是该语言的一次巨大飞跃。它引入了健壮的内存模型、并发、智能指针等。任何现代 C++ 项目都应该至少使用 `C++11`。在此基础上，你应该尝试使用尽可能新的版本，同时考虑你的客户端、源码和二进制依赖以及你需要支持的平台。\n\
  \n## C++11 API 特性\n\n`C++11` 于 2011 年 9 月发布，为语言引入了许多变化。这些变化包括核心语言的改进、对多线程的内置支持、模板增强以及\
  \ C++ 标准库的重大变化。在接下来的章节中，我将介绍 `C++11` 的各种特性，这些特性可以进一步增强你交付健壮 API 的能力，超越 `C++03` 提供的基础功能。\n\
  \n\n\n\n在这里我不会介绍 C++11 引入的新多线程功能，因为我专门为这个重要的主题编写了整一个章节。请参阅并发（Concurrency）章节以获取有关\
  \ C++ 这一方面的更多细节。\n\n作为历史背景，C++11 在开发期间被称为 C++0x，因为当时尚不确定修订版本何时发布。`x` 原本代表 2008 年或\
  \ 2009 年，尽管该更新最终直到 2011 年才发布。\n\n### 移动构造函数与五规则（Rule of Five）\n\nC++03 代码的“三规则”规定，如果一个类定义了以下特殊函数之一，那么它就必须定义所有三个：\n\
  \n1. 析构函数，\n2. 拷贝构造函数，\n3. 赋值运算符。\n\n这条规则的原因是，如果需要其中一个函数，那么很可能是因为该类动态分配了某些资源。因此，让类显式地定义如何释放、拷贝以及将资源赋值给另一个对象是非常重要的。在\
  \ C++11 中，增加了两个特殊函数来实现类的类的移动语义：\n\n1. 移动构造函数，\n2. 移动赋值运算符。\n\n移动构造函数用于将一个对象拥有的资源移动到另一个对象。拷贝构造函数会保持原始对象不变并创建对象数据的副本，而移动构造函数会将数据的所有权转移给新对象，并更新原始对象使其不再引用这些数据。因此，移动构造函数通常更高效，因为它们避免了对象数据的不必要拷贝。然而，使用移动构造函数也意味着原始对象将不再被使用。\n\
  \n移动赋值运算符为赋值提供了类似的移动语义，例如将临时对象转移到现有对象（与创建新对象的移动构造函数不同）。\n\n编译器可以使用移动构造函数和移动赋值运算符在它创建的临时变量之间更高效地移动数据。例如，当你将函数调用的结果存储在变量中时，例如\
  \ `auto f = func()`，编译器可以使用你的移动构造函数来避免必须将函数返回值拷贝到你的变量中。你也可以通过 `std::move` 函数在自己的代码中允许编译器触发移动语义。例如，这个交换函数函数模板将为提供的对象创建临时副本：\n\
  \n![image](img/u07-001-9780443222191.jpg)\n\n然而，该函数的另一种实现使用了移动构造函数和移动赋值运算符更高效地交换两个对象：\n\
  \n![image](img/u07-002-9780443222191.jpg)\n\n(`std::move` 并不直接调用移动构造函数。它只是将对象强制转换为右值引用（如\
  \ `MyClass &&`），以表示它是一个临时值，且不会在它使用的表达式之外继续存在。这允许编译器在可以的情况下决定使用移动构造函数。）\n\n如果你不定义移动构造函数，编译器将直接使用拷贝构造函数，这在功能上应该是等同的，尽管效率较低。同样，如果你不定义移动赋值运算符，编译器将回退到使用拷贝赋值运算符。因此，虽然三规则在\
  \ C++11 中扩展到了五规则，但如果你只遵循原始的三规则，你的代码行为仍然是正确的，只是在某些情况下效率没有本能达到的那么高。\n\n下一个示例展示了传统析构函数、拷贝构造函数和拷贝赋值运算符的使用，以及如何定义移动构造函数和移动赋值运算符：\n\
  \n![image](img/u07-003-9780443222191.jpg)\n\n这些函数的实现如下：\n\n![image](img/u07-004p1-9780443222191.jpg)\
  \ ![image](img/u07-004p2-9780443222191.jpg)\n\n如果我们将该类的两个实例传递给上交换函数的第一个版本，它将产生输出：\n\
  \n![image](img/u07-005-9780443222191.jpg)\n\n而使用 `std::move` 的交换函数第二个版本产生此输出，显示了移动构造函数和移动赋值运算符的使用：\n\
  \n![image](img/u07-006-9780443222191.jpg)\n\n### 默认与被删除函数\n\nC++03 对编译器自动生成特殊函数（如构造函数、析构函数和赋值运算符）的行为提供的控制很小。例如，如果你没有声明拷贝构造函数，C++03\
  \ 编译器会生成一个。但在 C++11 中，你拥有了显式控制权。例如，你现在可以专门指定让编译器生成默认实现 `= default`：\n\n![image](img/u07-007-9780443222191.jpg)\n\
  \n使用编译器默认实现的类被称为平凡类（trivial class）。平凡类具有某些属性，例如可拷贝性。然而，如果你提供了自己的实现，那么你的类就变成了非平凡：\n\
  \n![image](img/u07-008-9780443222191.jpg)\n\n你还可以使用 `= delete` 编译器禁用某些原本生成的函数。这对于防止实现某个特殊函数非常有用。例如，这通过删除拷贝构造函数和赋值运算符使类不可拷贝。因为这是\
  \ C++11，你应该在该定义中包含移动构造函数和移动赋值运算符：\n\n![image](img/u07-009-9780443222191.jpg)\n\n\
  这是 C++33 将这些函数声明为私有的替代方案，但 delete 方案更好，因为在私有情况下，你仍然可以在类内部访问拷贝构造函数和赋值运算符。使用 delete\
  \ 方案可以确保这些函数永远不会被调用。\n\n此外，你可以将 `= default` 和 `= delete` 标识符放在 `.cpp` 文件中而不是头文件中。事实上，从良好的\
  \ API 设计角度来看，这是一个更好的策略，因为你没有在头文件中暴露并内联函数的实现：\n\n![image](img/u07-010-9780443222191.jpg)\n\
  \n### 对象构造\n\nC++11 引入了几个与构造和对象初始化相关的功能。我们将介绍的第一个功能是一个构造函数调用另一个构造。例如，考虑一个存储浮点范围并缓存范围中位值的简单类：\n\
  \n![image](img/u07-011-9780443222191.jpg)\n\n这三个构造函数的实现可能如下：\n\n![image](img/u07-012-9780443222191.jpg)\n\
  \n\n\n\n在这种情况下，计算 `mMedian` 数据成员的逻辑在每个构造函数中都重复了。这可能会在其中一个构造函数中引入数学错误，导致对象根据所使用的构造函数表现得不同。\n\
  \n相反，更健壮的方法是根据第三个更通用的构造函数来实现前两个构造函数。在 C++03 中如果不创建一个所有三个构造函数都可以调用的额外成员函数，这是是不可能的。\n\
  \n然而，从 C++11 开始，一种被称为委托构造（delegating constructor）的构造函数可以调用另一个被称为目标构造函数（target constructor）。有了有了这种功能，我们上一个示例中的前两个构造函数现在可以更简洁地重写为：\n\
  \n![image](img/u07-013-9780443222191.jpg)\n\n第一个构造函数调用第二个构造函数，然后第二个再调用第三个构造函数。如果你担心委托循环，例如你有一个构造函数调用另一个构造函数，而后者又调用了第一个，编译器应该生成错误。如果你使用委托构造函数，则不能在构造函数的初始化列表中包含任何其他定义。\n\
  \n这种技术通过在某处定义计算中间值的逻辑并在所有构造函数中重用它，有助于实现最小完备的 API 质量。因此，尽可能使用委托构造函数以减少冗余，这是一种良好的实践。\n\
  \n我们在这里介绍的与对象初始化相关的第二个特性是数据成员初始化器（data member initializers）。在 C++11 中，你现在可以在类声明中为任何数据成员提供默认值。例如：\n\
  \n![image](img/u07-014-9780443222191.jpg)\n\n在这种情况下，当对象创建时，构造函数会将 `mName` 数据成员的值初始化为“ObjectName”。因此，如果构造函数的作用只是为每个数据成员设置初始值，那么你可以省略定义构造函数。相反，你可以依赖编译器生成的构造函数来设置数据成员初始化器中指定的默认值。\n\
  \n这有助于实现所谓的“零规则”（Rule of Zero），该规则规定，如果可能，你应该避免定义任何特殊函数（如构造函数和析构函数）（即你应该尽可能依靠编译器随处生成的这些函数的隐式定义版本）。\n\
  \n在构造函数中为每个数据成员定义值仍然是可能的。在这种情况下，你在构造函数中实现的任何初始化将覆盖来自初始化器的值。例如，我们可以这样为类添加一个构造函数：\n\
  \n![image](img/u07-015-9780443222191.jpg)\n\n在这种情况下，无参数构造函数仍将用字符串“ObjectName”初始化\
  \ `mName` 数据成员，但接受字符串参数的第二个构造函数将覆盖数据成员初始化器。\n\n## 初始化列表\n\nC++11 引入了使用大括号的列表初始化，允许你：\n\
  \n![image](img/u07-016-9780443222191.jpg)\n\n或者简单地说\n\n![image](img/u07-017-9780443222191.jpg)\n\
  \n你也可以通过这种语法使用 `std::initializer_list` 来初始化自己的类。例如，\n\n![image](img/u07-018-9780443222191.jpg)\n\
  \n在初始化列表中，你可以使用 `list.size()` 获取元素的数量，可以使用 `list.begin()` 和 `list.end()` 对它们进行迭代。通过这种方式，你可以：\n\
  \n![image](img/u07-019-9780443222191.jpg)\n\n调用 `MyClass{}` 将调用初始化列表，而 `MyClass(1)`\
  \ 将调用构造函数。\n\n### 智能指针\n\n智能指针是一个封装原始指针的类，并重载了 `->` 和 `*` 运算符，使其表现像指针，但具有额外的功能。智能指针的主要优点是它们处理了内存。C++11\
  \ 在 `<memory>` 头文件中引入了几种不同类型的智能指针。在此总结一下它们是：\n\n- `shared_ptr`：引用计数指针，当引用计数归零时释放指针。\n\
  - `weak_ptr`：提供了一种引用指针而不影响其引用计数的方法。\n- `unique_ptr`：当唯一指针离开作用域时释放指针。\n\n为了更具体地说明这些概念，这里有一个必须使用\
  \ `delete` 关键字释放内存的原始指针示例：\n\n![image](img/u07-020-9780443222191.jpg)\n\n对于简单的代码确保确保正确的时间删除对象很容易。但对于更复杂的代码，指针可能会通过不同的函数传递并被不同的对象存储，确定何时安全删除是很困难的。相比之下，`std::shared_ptr`\
  \ 会在所有引用失效时自动删除指针，例如：\n\n![image](img/u07-021-9780443222191.jpg)\n\n如果你从 API 返回指针，那么将它们作为智能指针返回要安全得多。我喜欢为任何意图用指针引用的智能指针引入类型定义，以便使语法更易使用。例如，\n\
  \n![image](img/u07-022-9780443222191.jpg)\n\n除了从 API 返回指针外，你还可以使用智能指针在构造函数中分配一个私有数据成员对象，并在对象销毁时自动释放，而无需在析构函数中显式处理这些。例如：\n\
  \n![image](img/u07-023-9780443222191.jpg)\n\n对于弱指针，当你不想授予客户端对底层对象的共享所有权时，这些对于返回对象非常有用。也就是说，你不希望客户端持有指针会防止对象在所有引用释放时被清理。一个经典示例是返回缓存中对象的指针，即使客户端仍持有该弱指针，对象也可能从缓存中剔出并删除。这比返回原始指针更好，因为客户端可以使用\
  \ `expired()` 成员函数检查底层数据是否已经被删除。\n\n\n\n\nC++11 中的最后一种智能指针类型是唯一指针 `std::unique_ptr`。它是\
  \ `std::shared_ptr` 的简化版本，没有引用计数，这意味着你不能拷贝唯一指针。当你想要将对象的生命周期与某块代码绑定在一起时，这种工具非常有用。你也可以在数据成员中使用唯一指针，用以避免在析构函数中手动删除指针，就像我们之前在处理\
  \ `std::shared_ptr` 时看到的那样。`std::unique_ptr` 的不同之处在于，包含它的对象将不再是可拷贝的。例如：\n\n![image](img/u07-024-9780443222191.jpg)\n\
  \n总结来说，如果所有权可以在多个对象之间共享，就应该使用 `std::shared_ptr`。如果资源应该只由单个对象拥有，则应该使用 `std::unique_ptr`。如果你想共享资源的临时所有权，则应该使用\
  \ `std::weak_ptr`。\n\n## 枚举类 (Enum classes)\n\n枚举类型是带有命名值的用户定义类型。它们对于引用一组具有意义名称的常量非常有用。例如：\n\
  \n![image](img/u07-025-9780443222191.jpg)\n\n然而，C++03 风格的枚举存在几个问题，包括：\n\n1. **类型安全：**\
  \ 枚举本质上是整数。一个枚举的值可以与另一个枚举的值进行比较，尽管它们之间可能没有语义关系。此外，枚举可以隐式转换为整数，这有时会引起混淆。\n2. **命名冲突：**\
  \ 所有的枚举值都与枚举定义处于同一层级的作用域，这意味着在同一作用域内，任何两个枚举不能共享相同的值。为了解决这个问题，你必须为每个枚举值使用唯一的前缀（例如\
  \ `MODE_READ`），或者在类或不同的命名空间内定义枚举。\n3. **未定义的大小：** 用于表示枚举的底层整数类型取决于实现情况，并取决于其值的定义。此外，你无法直接指定枚举的大小。\n\
  4. **没有前向声明：** 因为枚举的大小未知，所以无法对枚举类型进行前向声明。结果是，如果你想引用枚举，必须包含定义它的头文件。\n\n为了解决这些问题，C++11\
  \ 引入了枚举类（enum classes）的概念，有时也称为作用域枚举（scoped enums）。枚举类的语法与传统枚举相似，增加了 `class`（或 `struct`）关键字：\n\
  \n![image](img/u07-026-9780443222191.jpg)\n\n你必须通过为枚举名称加上前缀来引用枚举类的值（例如 `Mode::Read`\
  \ 或 `Mode::Write`）。这意味着你可以在同一作用域内定义两个具有相同值名的枚举类，例如：\n\n![image](img/u07-027-9780443222191.jpg)\n\
  \n在这种情况下，由于枚举类的命名空间作用，`Mode::Read` 和 `Permission::Read` 之间不会发生冲突。由于它们是不同的类型，它们也无法相互比较或赋值。\n\
  \n枚举类也不会隐式转换为整数，这提供了更强的类型安全性。例如，想象有一个接受整数作为参数的函数，如下：\n\n![image](img/u07-028-9780443222191.jpg)\n\
  \n使用传统的枚举值调用此函数是可能的，例如 `SetSize(READ)`，这可能没有意义。然而，对于枚举类来说是不可能的，因为它不能隐式转换为整数。例如，`SetSize(Mode::Read)`\
  \ 将产生编译错误。\n\n虽然传统枚举的大小是未定义的，但类枚举的大小被定义为 `int` 的大小。如果你需要，可以通过定义枚举的基础整型类型来更改这一点（从\
  \ C++11 开始，你也可以对传统枚举这样做）。例如，我们可以重新定义我们的 `Mode` 枚举类，使其大小与 `char` 相同：\n\n![image](img/u07-029-9780443222191.jpg)\n\
  \n最后，因为枚举类的默认大小是有良好定义的，现在可以对这些类型进行前向声明了。这在 API 设计中特别有用，因为它允许你在引用枚举类型时，无需直接包含定义它的它的头文件。例如，\n\
  \n![image](img/u07-030-9780443222191.jpg)\n\n与 C++03 枚举相比，枚举类有许多优势。它们提供了类型安全、名称作用域化、定义的大小以及前向声明的能力。\n\
  \n## 重写 (Override) 和 最终 (final) 修饰符\n\n为了确保我们获得动态绑定而不是静态绑定，你应该将 `Base::Func()` 函数声明为\
  \ `virtual`。考虑以下情况：\n\n![image](img/u07-031-9780443222191.jpg)\n\n然而，如果没有 `virtual`\
  \ 关键字，编译器将无法在运行时进行动态绑定。例如：\n\n![image](img/u07-032-9780443222191.jpg)\n\n也就是说，即使我们传递了指向\
  \ `Derived` 对象的指针，调用的也是 `Base` 版本的函数。\n\n![image](img/u07-033-9780443222191.jpg)\n\
  \n产生了意外之外的输出：\n\n![image](img/u07-034-9780443222191.jpg)\n\n重写函数时可能遇到的另一种错误是你没有完全匹配函数名称，可能是因为你拼错了名称，或者你在一个类中重命名了函数但忘记在另一个类中重命名。例如：\n\
  \n![image](img/u07-035-9780443222191.jpg)\n\n在这种情况下，`Base::Func()` 被声明为 `virtual`。然而，在\
  \ `Derived` 类中，虽然意图是重写函数，但由于使用了小写的函数名 `Derived::func()`。这可以通过编译，但无法实现重写基类函数的目标。\n\
  \nC++11 引入了新的 `override` 修饰符来解决这类两种错误，它可以定义在重写的函数上。这让编译器知道你打算重写基类中的虚函数。如果该函数在基类中没有标记为\
  \ `virtual`，或者该函数在基类中不存在，编译器就会生成错误。例如，这在 C++11 中将无法编译：\n\n![image](img/u07-036-9780443222191.jpg)\n\
  \n同样地，这段代码也无法编译：\n\n![image](img/u07-037-9780443222191.jpg)\n\n\n\n\nC++11 引入了另一个功能，以提供对象继承提供更大的灵活性：`final`\
  \ 饰符。它可以用于类，以防止该类被进一步派生。它也可以用于虚函数，指示该函数不能在派生类中被重写。例如，以下代码将无法通过编译，因为 `Base` 类被标记为\
  \ `final`，因此不能作为 `Derived` 类的基类。\n\n![image](img/u07-040-9780443222191.jpg)\n\n\
  下一个示例说明了如何使用 `final` 饰符来防止特定函数在派生类中被重写：\n\n![image](img/u07-041-9780443222191.jpg)\n\
  \n因此，`final` 饰符可以用于防止客户端进一步派生子类，或在进一步的子类中重写虚函数。它还可以提高性能，通过允许虚函数转换为直接方法调用，这一过程称为去虚化（devirtualization）。\n\
  \n在 `final` 关键字加入标准之前，微软在 Visual C++ 中引入了 `sealed` 关键字。这两个关键字是等价的，但为了符合标准，你应该使用\
  \ `final`。\n\n一种值得采纳的良好实践是，确保你定义的任何虚函数只使用 `virtual`、`override` 或 `final` 之一：\n\n\
  1. 使用 `virtual` 引入一个新的虚函数。\n2. 使用 `override` 声明一个非 `final` 的重写函数。\n3. 使用 `final`\
  \ 声明一个不能被进一步重写的虚函数。\n\n### noexcept 饰符\n\nC++11 引入了 `noexcept` 异常饰符，你可以将其添加到函数签名中，以指示它可能或不会抛出异常。还有一个\
  \ `noexcept` 运算符，可以用于执行编译时检查，查看表达式是否可能或不会抛出异常。例如：\n\n![image](img/u07-042-9780443222191.jpg)\n\
  \n显然，你不应该在会抛出异常的函数上使用 `noexcept`。如果你尝试这样做，编译器可能会提示你。记住，使用 `new` 运算符分配内存在内存耗尽时可能会抛出\
  \ `std::bad_alloc` 异常，因此你不应该在执行内存分配的函数上使用 `noexcept`。\n\n那么，什么时候应该使用 `noexcept`\
  \ 呢？添加此饰符的原始理由是允许在标准库代码中使用更快的移动构造函数。例如，如果已知元素的移动构造函数不会抛出异常，那么重置一个 `std::vector`\
  \ 的大小就可以通过仅移动每个元素来实现。否则，如果存在抛出异常的可能性，则必须使用较慢的拷贝构造函数。因此，通过为移动构造函数和移动赋值运算符指定 `noexcept`，你可以让你的类型在\
  \ `std::vector` 中表现得更优越。对于任何隐式定义的移动函数，这会在默认情况下发生。因此，`noexcept` 饰符只有在你定义自己的移动函数，或者在你确定代码使用了\
  \ `std::move_if_noexcept` 或 `std::is_nothrow_constructible` 来提供更快的代码路径时才真正有用。除了这些情况，你可能不需要担心这个特性。\n\
  \nC++ 语言最初包含一个 `throw` 异常饰符，它在 C++11 中被弃用并在 C++17 中被移除。这本允许你指示函数可能会抛出哪些异常，以及它不会抛出任何异常。这些情况中的第一个通常被认为是坏习惯，部分是因为编译器无法强制执行，因此\
  \ `throw` 饰符从标准中删除。添加 `noexcept` 饰符是为了涵盖 `throw` 的唯一合理用途：陈明函数会或不会抛出异常。因此，你不应该使用\
  \ `throw` 饰符，并且仅在前面提到的合理情况下使用 `noexcept`。\n\n### 内联命名空间\n\n命名空间是 C++ API 设计中一项重要功能，因为它们有助于确保你的名称不会与其他库中的符号发生冲突。回顾一下，你可以将名称置于命名空间内，例如：\n\
  \n![image](img/u07-043-9780443222191.jpg)\n\n然后你使用命名空间作为前缀引用你的名称，例如 `MyLibrary::MyFunction()`。你也可以嵌套命名空间，例如：\n\
  \n![image](img/u07-044-9780443222191.jpg)\n\n其中你将通过 `Parent::Child::MyFunction()`\
  \ 引用你的函数。\n\nC++11 通过名为 `inline namespaces`（内联命名空间）的功能扩展了命名空间功能，其中命名空间的所有成员也会自动添加到包含它的外部命名空间中。例如，\n\
  \n![image](img/u07-045-9780443222191.jpg)\n\n这将使你的函数通过 `Parent::MyFunction()` 访问。这样做的一个理由是允许提供不同的\
  \ API 版本，例如，考虑这些内联命名空间：\n\n![image](img/u07-046-9780443222191.jpg)\n\n即 `MyLibrary::v1`\
  \ 和 `MyLibrary::v2`。你可以将其中一个标记为 `inline`，这样你就可以引用 `MyLibrary::MyFunction()` 来获取最新版本。但是，如果需要，引用特定版本，任何未使用新\
  \ API 重新编译的模块将继续链接到 `v2` 符号。\n\n![image](img/u07-047-9780443222191.jpg)\n\n这意味着如果你发布了新版本，如\
  \ `v3`，任何想要尝试新功能的客户端都可以显式调用 `MyLibrary::v3::MyFunction()`。你也可以先添加 `v3` 命名空间但最初不标记为\
  \ `inline`。这样，当你准备好后，就可以将 `v3` 标记为 `inline`。这对于引用 `MyLibrary::MyFunction()` 的情况是有效的。因此，不要移除旧版本的命名空间；否则会破坏向兼容性。\n\
  \n我将在后面的章节进一步讨论内联命名空间的使用。\n\n### 使用 using 类型别名\n\nC++ 一直允许你使用 `typedef` 关键字为类型引入别名，例如：\n\
  \n![image](img/u07-048-9780443222191.jpg)\n\n这个示例引入了类型别名 `IntVector`，它可以替换任何 `std::vector<int>`。从\
  \ C++11 开始，你也可以使用 `using` 关键字来表达相同的类型别名，例如：\n\n![image](img/u07-049-9780443222191.jpg)\n\
  \n当你考虑如何为函数指针定义类型别名时，这种新语法的可读性优势变得更加明显。`typedef` 语法看起来像：\n\n![image](img/u07-050-9780443222191.jpg)\n\
  \n而 `using` 语法要容易理解得多：\n\n![image](img/u07-051-9780443222191.jpg)\n\n`using` 语法提供了与\
  \ `typedef` 语法相同的语义，因此它们可以互换使用。特别地，这两种选项都没有定义新类型，只是该类型的别名。然而，`using` 语法为模板提供了额外的能力。传统的\
  \ `typedef` 语法不支持模板，因此以下内容不是有效的 C++：\n\n\n\n\n\n![image](img/u07-051-9780443222191.jpg)\n\
  \n然而，现在使用新的 `using` 语法就可以实现：\n\n![image](img/u07-052-9780443222191.jpg)\n\n总来说，`using`\
  \ 语法提供了与 `typedef` 相同的功能，并增加了对模板类型别名的支持，而且它更容易易读和理解。因此，在现代 C++ API 开发中，通常应优先使用 `using`\
  \ 语法而非 `typedef`。\n\n### 用户定义字面量\n\n正如我们在“特性”章节中讨论过的样，一个良好的 API 应该是难以被误用的。一种可能的误用领域是为函数参数提供错误的值，这可能是因为你有多个相同类型的参数，或者因为不清楚应该使用哪种单位。这是一个用户定义字面量新功能可以帮助的领域。\n\
