  \ 实例（12 字节）。\n\n# 附录 A: 库\n\n\n\n\n\n## 摘要\n应用程序接口以库文件的形式实现并分发，可以是静态库或动态库，例如 Windows\
  \ 动态链接库（`DLLs`）。本章描述了静态库和动态库之间的区别及其优缺点，并涵盖了使用动态库创建插件。本章的大部分重点介绍了如何在 Windows、Linux\
  \ 和 macOS 上创建静态库和共享库。这涉及诸如导出符号；DLL 入口点；如何使用 Microsoft Visual Studio、`XCode` 和 GNU\
  \ C++ 编译器；在 Mac 上使用框架；用于分析库文件的有用工具如 `libtool`、`nm`、`ldd`、`otool`、`tasklist.exe`\
  \ 和 `dlister.exe`；以及如何编写代码在运行时加载插件。\n\n**关键词：** 编译器标志、动态库、导出符号、框架、链接器、目标代码、插件、静态库。\n\
  \n库允许你将编译后的代码和数据打包以实现你的应用程序接口（`API`），以便你的客户端能够将其嵌入到自己的应用程序中。库是模块化的工具。本附录将介绍你可以使用的不同类型的库以及如何在各种平台上创建它们。它还涵盖了\
  \ API 设计的物理方面，即在其库文件的符号导出表中暴露你 API 的公有符号。\n\n库的特性、用法和支持工具本质上是特定于平台的。在 Windows 上操作动态链接库（`DLL`）的方式与在\
  \ Unix 上操作动态共享对象（`DSO`）的方式不同。因此，我决定将本附录的大部分内容按平台组织，特别是 Windows、Linux 和 macOS。这样做的益处是，不会让你对当前项目不关心的特定平台细节分心。\n\
  \n## 静态库与动态库\n\n你可以创建的库有两种主要形式。关于使用哪种的决定会对客户端应用程序产生显著影响，影响因素包括加载时间、可执行文件大小以及对你 `API`\
  \ 不同版本的健壮性。这两种基本类型是静态库和动态（或共享）库。我将在接下来的章节中详细描述每一种。\n\n### 静态库\n静态库包含目标代码，这些代码与最终用户应用程序链接，然后成为该可执行文件的一部分。图\
  \ A.1 释了这一概念。静态库有时被称为归，因为本质上它只是编译后的目标文件包。这些库在 Unix 和 macOS 上通常具有 `.a` 文件扩展名，在 Windows\
  \ 上为 `.lib`（例如，`libjpeg.a` 或 `jpeg.lib`）。![image](img/bm01-9780443222191.jpg)\n\n\
  图 A.1 将静态库链接到应用程序会导致库代码被嵌入到生成的可执行文件中。\n\n将你的 `API` 的实现作为静态库分发的一些影响是：\n\n1. 静态库仅在链接应用程序时需要。运行该应用程序不需要它，因为库代码本质上嵌入在应用程序内部。因此，你的客户端可以在没有额外的运行时依赖的情况下分发他们的应用程序。\n\
  2. 如果你的客户端希望将你的库链接到多个可执行文件，每个文件都将嵌入你代码的副本。如果你的库大小为 10 MB，而客户端希望将其链接到五个独立的程序，那么你可能会为产品的总大小增加多达\
  \ 50 MB。注意，只有静态库中实际使用的目标文件会被复制到应用程序中。因此，实际上每个应用程序的总大小可能小于这个最坏情况。\n3. 你的客户端可以分发他们的应用程序，而不必担心在终端用户机器上找到不兼容的库版本，或者来自另一个供应商的同名的完全不同的库。这避免了库版本和依赖性问题，这些问题在早期\
  \ Windows 平台上经常被描述为“DLL 地地狱”。\n4. 另一方面，如果你的客户端希望能够对他们的应用程序进行热补丁（即他们想更新其应用程序所使用的\
  \ `API` 版本），他们必须替换整个可执行文件来实现。如果这是通过互联网更新完成的，终端用户可能需要下载更大的更新包，从而花费更长时间等待更新完成。\n\n\
  ### 动态库\n动态库是在编译时链接的文件，用于解析未定义的引用，然后与最终用户应用程序一起分发，以便应用程序可以在运行时加载库代码（图 A.2）。这通常需要终端用户机器上使用动态链接器在运行时查找并加载所有动态库依赖，执行必要的符号重定位，然后将控制权交给应用程序。例如，Linux\
  \ 动态链接器称为 `ld.so`，在 Mac 上它被称为 `dyld`。通常，动态链接器支持多个环境变量来修改或调试其行为。例如，参考 Mac 上的 `man\
  \ dyld`。![image](img/bm02-9780443222191.jpg)\n\n图 A.2 动态库用于链接应用程序，然后与该应用程序一起分发，以便库可以在运行时加载。\n\
  \n动态库有时被称为共享库，因为它们可以被多个程序共享。在 Unix 机器上它们可以被称为 `DSOs`，在 Windows 上它们被称为 `DLLs`。它们在\
  \ Unix 平台上具有 `.so` 文件扩展名，在 Windows 上为 `.dll`，在 macOS 上为 `.dylib`（例如，`libjpeg.so`\
  \ 或 `jpeg.dll`）。使用动态库分发你的 `API` 的影响包括：\n\n1. 你的客户端必须随应用程序一起分发你的动态库（以及你的库依赖的任何动态库），以便在应用程序运行时可以被发现。\n\
  2. 如果找不到动态库，客户端的应用程序将无法运行：例如，如果库被删除或移动到不在动态库搜索路径中的目录。此外，如果动态库被升级到新版本或被旧版本覆盖，应用程序可能无法运行。\n\
  3. 如果有多个应用程序需要使用该库，使用动态库在磁盘空间上通常比静态库更高效。这是因为库代码存储在单个共享文件中，而不是在每个可执行文件中重复。但注意，这不是一个硬性规则。正如我之前提到的，可执行文件只需要包含静态库中实际使用的目标代码。因此，如果每个应用程序只使用静态库的一小部分，磁盘空间效率仍然可以与完整的动态库媲美。\n\
  4. 动态库在内存方面可能也更高效。大多数现代操作系统会尝试仅将动态库代码加载到内存中，并在所有依赖它的应用程序之间共享。这可能导致更好的缓存利用率。相比之下，每个链接到静态库的应用程序都会在内存中加载库代码的副本。\n\
  5. 如果你的客户端希望用新的（向后兼容的）共享库版本对应用程序进行热补丁，他们只需放入替换库文件，他们的应用程序都将使用此新库，而无需重新编译或重新链接。\n\
  \n![image](img/bm03-9780443222191.jpg)\n\n\n\n\n\n图 A.3 插件库是一个动态库，它可以独立于应用程序进行编译，并由应用程序根据需要显式加载。\n\
  \n理解依赖于其他动态库的动态库的行为同样重要。如果你的库依赖于其他动态库，那么你必须也将这些库随你的软件开发包（`SDK`）一起发布，除非你可以合理地预期终端用户的平台已经预装了这些库。这是一个传递属性：你还必须分发你依赖项的所有依赖项。简而言之，整个动态库链在运行时必须对应用程序是可用的，它才能能够运行。当然，如果你的动态库链接到一个静态库，那么你就不需要为客户端提供该静态库，因为来自静态库的代码已直接添加到了你的动态库中。\n\
  \n## 作为插件的动态库\n\n动态库通常链接到应用程序，然后与该应用程序一起分发，以便操作系统在应用程序启动时加载该库。然而，应用程序也可以根据需要加载动态库，而无需在编译时与该库进行链接。这可以用于创建插件接口，其中应用程序可以在运行时加载额外的代码以扩展程序的基本功能。例如，大多数\
  \ Web 浏览器都支持插件来处理特定类型的内容，例如查看 Apple QuickTime 电影。这种动态库的用法在图 A.3 中已说明。在 API 开发方面，这使你具备创建可扩展\
  \ API 的能力，允许你的客户端存入新功能，然后你的 API 将加载并执行这些功能。Netscape 插件 API 就是这样一个例子：它是你用来创建插件（即动态库）时针对开发的\
  \ API，而 Firefox、Safari、Opera 和 Chrome 等浏览器随后可以加载并运行该插件。我曾在第 15 章中讨论过使用插件创建可扩展 API\
  \ 的用法。\n\n## Windows 上的库\n\n在 Windows 上，静态库用 `.lib` 文件表示，而动态库具有 `.dll` 文件扩展名。此外，你必须为每个\
  \ `.dll` 文件配对一个导入库，即 `.lib` 文件。导入库用于解析对在 DLL 中导出的符号的引用。例如，Win32 用户界面 API 实现在 `user32.dll`\
  \ 中，并配有相应的 `user32.lib`。请注意，尽管它们共享相同的 `.lib` 文件扩展名，但静态库和导入库是不同的文件类型。如果你计划分发 API\
  \ 的静态和动态库版本，那么你将需要通过不同的重命名静态库或将每个库放在单独的目录中避免文件名冲突。例如：\n\n| **静态：** | **动态：** | **导入：**\
  \ |\n| :--- | :--- | :--- |\n| foo_static.lib | foo.dll | foo.lib |\n| 或 | | |\n\
  | **静态：** | **动态：** | **导入：** |\n| static/foo.lib | dynamic/foo.dll | dynamic/foo.lib\
