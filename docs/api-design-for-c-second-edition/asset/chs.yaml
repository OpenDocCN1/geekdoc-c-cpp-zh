  \ 排版\n\n![image](img/fm01-9780443222191.jpg)\n\n# 作者简介\n\nMartin Reddy 博士是电气电子工程师学会（IEEE）会士、亚太人工智能协会（AAIA）会士以及美国计算机学会（ACM）杰出工程师。他在爱丁堡大学获得计算机科学博士学位，在软件行业拥有超过\
  \ 30 年的经验。他发表了 40 多篇专业文章、10 项专利并和 2 本书籍。他曾被母校斯特拉斯克莱德大学授予“年度优秀校友”。Martin 是人工智能（AI）公司\
  \ PullString 的联合创始人兼首席技术官（CTO），在此期间他负责公司技术开发，直到公司在 2019 年被 Apple 收。在 Apple，Martin\
  \ 是人工智能和机器学习（AI/ML）部门的软件架构师，负责 Siri 虚拟助手主要组件的架构和 API，该软件运行在全球范围内超过 10 亿台设备上。在此之前，Reddy\
  \ 博士在 Pixar 动画制作室工作了 6 年，担任首席软件工程师，负责工作室内部动画系统 Presto 的 API 和工具开发。在 Pixar 期间，Martin\
  \ 参与了多部获得奥斯卡奖项或提名的电影，包括《海底总动员》、《奇袭陆陆队》、《汽车总员》、《环鼠意大利》和《机器人总动员》。他还是“超级先生”的发型模型。\n\
  \n# 前言\n\n我必须首先承认，我并不认为自己是世界级的应用程序接口（API）设计者或软件工程师。然而，我认为自己是计算机图形和几何建模领域的专家研究人员。正因为这项工作，我第一次在\
  \ Pixar 工作室认识了 Martin。作为一名图形研究人员，我习惯于编写数学复杂的论文。我还在一所著名大学接受过计算机科学的正式训练，并编写过不少代码。凭借这些背景，当我获得机会带领一组软件工程师为\
  \ Pixar 开发新一代动画软件时，我想这不会比研究更难了。毕竟，从定义上说，研究是对未知事物的创造，而工程是对已得到充分理解的主题的实现。我完全大错特错。\n\
  \n我意识到，软件工程无疑是我面对过的最困难的挑战。在经历了比我愿意承认的多年以后，我最终放弃了并回到了图形研究。\n\n我无法告诉你如果我有一本像《C++ API\
  \ 设计》这样的书，我会受益多浅。我们通过惨痛教中学到的许多教训，都被 Martin 在这本富有见地且易于使用的书中捕捉到了。Martin 并不是从学术软件研究人员的角度来看待主题（尽管他大量借鉴了该领域的成果和见解），而是从一个一线软件工程师和管理者的角度切入的。他亲身体会过良好的软件设计的重要性，并成为关于“什么是优秀”的清晰发声者。在本书中，他介绍了实现这一目标的有效策略。\n\
  \n我特别喜欢 Martin 不仅仅关注 API 设计，而是更广泛地关注软件生命周期，这使他能够涵盖版本控制、向后兼容策略和分支方法等话题。\n\n简而言之，这本书对于那些创建或管理软件活动的人具有巨大的价值。它是一系列被反复证明的最佳实践合集。\n\
  Tony DeRose\n高级科学家兼研究组负责人\nPixar 动画制作室\n\n# 前言\n\n## 第二版前言\n\n\n\n\n本书的第一版写于 2011\
  \ 年，正值 `C++11` 标准发布之前（当时它被称为 `C++0x`）。从那时起，`C++11` 已经成熟，并以固定节奏发布了后续修订，包括 `C++14`、`C++17`、`C++20`\
  \ 和 `C++23`。考虑到语言的这些变化，我希望更新这本书，使其对当今的 `C++` 工程师更具价值。因此，在第二版中，我加入了一个全新的章节，专门介绍过去十年以上标准中添加的新应用程序接口（`API`）设计特性。我还通读了全文，以根据这些标准更新对其进行现代化处理。这包括尽可能更新所有代码示例，以使用\
  \ `C++11` 语法，因为我认为这是如今的最低标准。\n\n在进行如此大规模的更新时，我决定增加一些新章节，涵盖我感到第一版中缺失的主题。这包括关于并发和多线程的新章节，由于\
  \ `C++11` 引入了对这一重要问题的直接支持，该话题现在更具相关性。此外，由于我此后几年在 `Apple` 工作，我想包含一些我在关于将 `C++` 代码与\
  \ `Objective-C` 和 `Swift` 集成中学到的知识，因为这些已成为在 `iOS` 和 `macOS` 平台上编写软件的重要语言。\n\n最后，我在书中添加了多个新章节和侧边栏来补充原文，从讨论\
  \ `SOLID` 原则和“线程安全接口”（Thread Safe Interface）设计模式，到涵盖函数式编程风格以及如何在 `API` 名称和文档中使用包容性语言。总的来说，这第二版代表了本书从封面到封底的重大更新和现代化。我希望这个新版本能为你的软件项目提供更有无价值的资源。\n\
  \n## 什么是应用程序接口设计？\n\n在 `C++` 中编写大型应用程序是一项复杂且棘手的工作。然而，设计健壮、稳定、易用且持久的可重用 `C++` 接口则更加困难。在这一领域取得成功的最佳方法是遵循良好\
  \ `API` 设计的准则。`API` 为软件组件提供了一个逻辑接口，并隐藏了实现该组件所需的内部细节。它为模块提供了高层抽象，并通过允许多个应用程序共享相同功能来促进代码重用。现代软件开发已高度依赖\
  \ `APIs`，从低层应用框架到数据格式 `APIs` 以及图形用户界面（`GUI`）框架。事实上，常见的软件工程术语如模块化开发、代码重用、组件化、动态链接库、软件框架、分布式计算和服务面向架构都暗示了对强大\
  \ `API` 设计技能的需求。\n\n你可能已经熟悉的常用 `C` 和 `C++` `APIs` 包括 `C++ Standard Library`、`Boost`、`Microsoft\
  \ Windows API (Win32)`、`Microsoft Foundation Classes`、`libtiff`、`libpng`、`zlib`、`libxml++`、`OpenGL`、`MySQL++`、`Qt`、`wxWidgets`、`GTK+`、`KDE`、`SkypeKit`、Intel\
  \ 的 Threading Building Blocks、`Netscape Plugin API` 以及 `Apache module API`。此外，Google\
  \ 的许多开源项目是 `C++`，GitHub 网站上的大量代码也是如此。这些 `APIs` 用于软件开发的各个方面，从桌面应用程序到移动计算，从嵌入式系统到\
  \ Web 开发。例如，`Mozilla Firefox` 浏览器构建在 80 多个动态库之上，每个库都提供一个或多个 `APIs` 的实现。\n\n因此，优雅且健壮的\
  \ `API` 设计是当代软件开发的关键方面。它与标准应用开发相比的一个重要区别在于对变更管理的需求大得多。众所周知，变化是软件开发中不可避免的因素；新需求、功能请求和\
  \ bug 修复会导致软件以最初设计时从未预见的方式演变。然而，对数百个端用户应用程序共享的 `API` 进行更改可能会导致巨大的动荡，最终可能导致客户端放弃该\
  \ `API`。因此，良好的 `API` 设计的首要目标是为客户提供所需的功能，同时在发布新版本时对他们的代码的影响降至最低（理想情况下为零）。\n\n## 为什么要读这本书？\n\
  \n如果你编写了其他工程师依赖的 `C++` 代码，你就是一名 `API` 设计者，这本书就是为你写的。接口是你编写的最重要的代码，因为接口出现问题的修复成本比实现中的\
  \ bug 贵得多。例如，接口的更改可能需要更新所有基于你代码的应用程序，而仅限实现的更改则可以在客户端采用新 `API` 版本时透明且轻松地集成到应用程序中。从经济角度来说，设计糟糕的接口会严重降低你代码的长期生存能力。因此，学习如何创建高质量的接口是一项基本的工程技能，也是本书的核心关注点。正如\
  \ `Michi Henning` 指出的，今天 `API` 设计比 20 年前更重要。这是因为近年来设计了更多的 `APIs`。这些接口提供了更丰富、更复杂的功能，并被更多的端用户应用程序共享。值得注意的是，这本书并不打算成为一本通用的\
  \ `C++` 编程指南。市场上已经有很多优秀的示例。我确实会涵盖大量的面向对象设计材料，并提供许多实用的 `C++` 技巧。然而，我将重点关注在 `C++`\
  \ 中表示整洁接口的技术。相应，我将不会深入探讨接口背后代码的实现问题，例如特定的算法选择或限于函数体内部代码的实践实践。另一方面，这本书将涵盖 `API` 开发的全范围，从初始设计到实现、测试、文档、发布、版本控制、维护和弃用。我甚至将涵盖特殊的\
  \ `API` 主题，例如创建脚本和插件 `APIs`。尽管这些许多主题对一般的软件开发也相关，但我们这里的重点将放在对 `API` 设计的影响上。例如，在讨论测试策略时，我将集中于自动化\
  \ `API` 测试技术，而不是试图包含端用户应用程序测试技术（如 `GUI` 测试、系统测试或手动测试）。就我个人编写这本书的资质而言，我曾领导过用于多个协作机构的研究代码的\
  \ `API` 开发、用于制作奥斯卡电影的内部动画系统 `APIs`、全球数百万使用的开源客户端/服务器 `APIs` 以及部署到超过十亿设备的 `Siri`\
  \ 虚拟助手 `APIs` 的开发。\n\n## 目标读者是谁？\n\n\n\n\n\n虽然这本书并不是 `C++` 的入门指南，但我已尽力使文本易于阅读，并清晰地解释了所有的术语和行话。因此，这本书对于已经掌握了\
  \ `C++` 基础并希望提升设计技能的新手程序员，以及寻求获取新专业知识以补充其现有专长的资深工程师和软件架构师来说，都具有很大的价值。在编写这本书时，我特别考虑了三类特定的读者群体：\n\
  \n*   1. **实践型软件工程师和架构师。** 正在从事特定 API 项目的初级和高级开发人员，他们需要关于如何产生最优雅且持久设计的务实建议。\n* \
  \  2. **技术经理。** 负责生产 API 产品的程序和产品经理，希望对 API 设计的技术问题和开发流程有更深入的了解。\n*   3. **学生和教育者。**\
  \ 正在学习编程的计算机科学和软件工程学生，他们正在寻找基于大型项目实践经验的、深入的软件设计资源。\n\n## 专注于 C++\n\n尽管有很多可以教授的通用\
  \ API 设计方法论（这些技能同样适用于任何编程语言或环境），但 API 最终必须通过特定的编程语言来表达。因此，理解有助于良好 API 设计的语言特定特性至关重要。因此，本书专注于为单一语言（`C++`）设计\
  \ API 的问题，而不是稀释内容以使其适用于所有语言。希望为其他语言（如 `Java` 或 `C#`）开发 API 的读者仍然可以从本文获得许多通用的见解，但这本书直接针对那些必须为其他工程师编写和维护\
  \ API 的 `C++` 工程师。\n\n`C++` 仍然是大型软件项目中最广泛使用的编程语言之一，并且往往是性能关键代码最受欢迎的选择。因此，有许多各种 `C`\
  \ 和 `C++` API 可供你在自己的应用程序中使用，其中一些我之前列出过。因此，我将集中于在 `C++` 中生成良好 API 的方面，并包含大量的源代码示例以更好地说明这些概念。这意味着我将处理\
  \ `C++` 特有的主题，如 `templates`（模板）、`encapsulation`（封装）、`inheritance`（继承）、`namespaces`（命名空间）、`operators`（运算符）、`const\
  \ correctness`（常量正确性）、`memory management`（内存管理）、`concurrency`（并发）、`C++ Standard\
  \ Library`（C++ 标准库）以及 `pimpl idiom`（pimpl 模式）。\n\n正如我之前提到的，本版本的书籍包含了从 `C++98` 到\
  \ `C++23` 的所有 `C++` 标准版本的详细介绍。我专门分配了一个章节来涵盖每个特定版本的相关特性，并将其分为不同的部分。这样，如果你在使用某个特定的编译器版本（例如\
  \ `C++17`），你就可以轻松回顾该标准版本的所有 API 特性，而不会被与你的开发环境无关的特性所干扰。\n\n## 约定\n\n虽然传统上使用 `user`（用户）是指是指使用软件应用程序的人（例如\
  \ `Microsoft Word` 或 `Mozilla Firefox` 的用户），但在 API 设计语境下，我将该术语指代正在创建应用程序并使用 API\
  \ 实现这一目标的软件开发者。换句话说，我通常谈论的是 API 用户而不是应用程序用户。`client`（客户端）一词在此方面可以同义使用。请注意，`client`\
  \ 一词除了指的是你 API 的人类用户外，也可以抽象地指代必须调用你 API 中方法的其他软件部分。\n\n虽然许多文件格式扩展名用于识别 `C++` 源文件，如\
  \ `.cpp`、`.cc`、`.cxx`、`.h`、`.hh` 和 `.hpp`，我将在全书中统一使用 `.cpp` 和 `.h`。我还将交替使用 `module`（模块）和\
  \ `component`（组件）术语来表示单个 `.cpp` 和 `.h` 文件对（`module` 特指 `C++20` 的新模块特性除外）。这些明显不等同于\
  \ `class`（类），因为一个组件或 `module` 可能包含多个 `class`。我将使用 `library`（库）一词来指代组件的物理集合或包（即 `library\
  \ > module/component > class`）。\n\n`method`（方法）一词虽然在面向对象的编程社区通常被理解，但它并不是严格的 `C++`\
  \ 术语。它最初演变自 `Smalltalk` 语言。对应的 `C++` 术语是 `member function`（成员函数），尽管有些工程师更倾向于更具体的定义\
  \ `virtual member function`（虚成员函数）。我在书中书中特别担心这些术语的细微差别，因此我将交替使用 `method` 和 `member\
  \ function`。同样，虽然 `data member`（数据成员）是更准确的 `C++`表达，但我会将 `member variable`（成员变量）视为同义词。\n\
  \n在排版约定方面，我将使用等宽字体对所有源代码示例以及文中可能出现的任何文件名或语言关键字进行排版。此外，我倾向于在提供的示例中所有 `class` 和 `function`\
  \ 名称使用大驼峰命名法（例如使用 `CamelCase` 而不是 `camelCase` 或 `snake_case`）。但是，显然我将保留我引用的任何外部代码的大小写，例如\
  \ `std::for_each()`。我遵循在数据成员前使用 `m` 前缀（例如 `mMemberVar`）以及在静态变量前使用 `s`（例如 `sStaticVar`）的约定。书中的源代码示例通常只是代码片段，旨在展示完全功能的示例。我还会经常删除书中示例代码中的注释。这样做是为了简洁和清晰。特别是，我经常会省略头文件周围的任何预处理器保护语句。我假设读者知道每个\
  \ `C/C++` 头文件都应该将其内容封装在 `include guard` 语句（或 `#pragma once`）中，并且良好的做法是将所有的 API 声明包含在一个的\
  \ `namespace` 中。换句话说，应该假设我提供的每个头文件都被如下代码包裹：\n\n```cpp\n#ifndef MY_MODULE_H\n#define\
  \ MY_MODULE_H\n// 需要的 #include 文件...\nnamespace apibook {\n// API 声明 ...\n}\n#endif\
  \ // MY_MODULE_H\n```\n\n## 图书网站\n\n这本书还有一个支持网站 `https://APIBook.com/` (APIBook.com/)。在该网站上，你可以找到有关书的一般信息，以及书中源代码示例的支持材料。你可以自己下载并尝试这些示例。它们设计得尽可能简单，同时保持实用性和说明性。我使用了跨平台的\
  \ `CMake` 构建系统来方便编译和链接示例，因此它们可以在 Windows、Mac OS X 和 UNIX 操作系统上运行。我将在该网站上发布关于书籍新版本以及任何错误说明的信息。如果你有任何想与我分享的修正建议，可以在网上找到我的联系方式。如果根据你的反馈对书籍进行了修改，我将在网站以及书籍后续印刷版的致谢部分归功于你的贡献。\n\
  \n\n\n\n\n这本书通过我的许多朋友和同事的技术评审和反馈得到了显著改进。我非常感谢他们抽出时间阅读手稿的早期版本，并提供了周到的见解和建议。感谢 Paul\
  \ Strauss、Eric Gregory、Rycharde Hawkes、Nick Long、James Chalfant、Brett Levin、Marcus\
  \ Marr、Jim Humelsine 以及 Geoff Levner。多年来，这本书早先印刷版的许多读者也向我发送了反馈，其中大部分内容我已整合到本版中。我想感谢每一位做出的宝贵贡献的人士：Javier\
  \ Estrada, Ivan Komarov, Dan Smith, Alexandros Gezerlis, QiFo Lin, Çağdaş Çalık,\
  \ Markus Geimer, Roger Orr, Chris Bond, Philip Koshy, Andrea Bigagli, Jiang Zhiqiang,\
  \ William Sommerwerck, Mark Jones, Yilmaz Arslanoglu, Fernando Rozenblit, Sören\
