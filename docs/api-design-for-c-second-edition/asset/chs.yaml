  \ `C` API 的真实示例。请注意其使用函数命名约定来创建多层命名空间，其中所有函数都以 `FMOD_` 开头，所有系统级调用都以 `FMOD_System_`\
  \ 开头，以此此类推。注意，为了可读性，此示例没有进行任何错误检查。显然，任何真实程序都会检查每个函数调用是否无错误地完成：\n\n![image](img/u05-09-9780443222191.jpg)\n\
  \n## 面向对象的 C++ API\n\n当你考虑用 `C++` 编写 API 时，你可能会面向对象的设计来思考。面向对象编程（OOP）是一种编程风格，将数据以及操作这些数据的功能封装成一个对象。OOP\
  \ 的起源可以追溯到 20 世纪 60 年代 `Simula` 和 `Smalltalk` 语言的发展。然而，直到 90 年代随着 `C++` 和 `Java`\
  \ 等语言的引入，它才开始成为一种主流的编程模型。\n\n由于我已经在之前的章节中涵盖了 OOP 的许多关键技术，我不会在这一 API 风格上花费太多时间。你可以参考上一节的\
  \ `Class Design` 部分，我在那里定义了各种 OOP 术语，如 `class`（类）、`object`（对象）、`inheritance`（继承）、`composition`（组合）、`encapsulation`（封装）和\
  \ `polymorphism`（多态）。\n\n注意的是，方法和运算符重载、默认参数、模板、异常和命名空间等特征并不是面向对象的概念。然而，它们是 `C++`\
  \ 语言包含的新特性，并不是原始 `C` 语言的一部分。`C++` 支持 OOP 之外的多种编程模型，例如过程化编程（如上一节所示）、泛型编程和函数式编程（这两者我接下来都会介绍）。\n\
  \n### 面向对象 API 的优点\n\n使用面向对象 API 的主要优点是可以使用 `classes`（类）和继承：即能够根据互连的数据对软件进行建模，而不是过程的集合。这可以同时提供概念和技术上的优势。\n\
  \n在概念优势方面，通常你尝试在代码中建模的物理项目和过程可以用对象来描述。例如，地址簿是一个我们都熟悉的物理实体，它包含了对几个人的描述，而这个人又是一个任何人都可以与之关联的概念性单元。因此，OOP\
  \ 的核心任务是识别给定问题空间中的关键对象，并确定它们之间的关系。许多工程师认为，与通过思考必须执行的所有动作集合来处理软件设计相比，这种方法更符合逻辑（Booch\
  \ et al., 2007）。\n\n在技术优势方面，使用对象提供了一种将单个概念单元的所有数据和方法封装在一个地方的方法。它本质上为所有相关方法和变量创建了一个唯一的命名空间。例如，我们之前的\
  \ `C++ Stack` 示例中的方法都存在于 `Stack` 命名空间内，如 `Stack::Push()` 或 `Stack::Pop()`。对象还通过\
  \ `public`、`protected` 和 `private` 访问级别提供了信息隐藏的概念，这是 API 设计的关键概念。\n\n### 面向对象 API\
  \ 的缺点\n\n然而，使用面向对象的概念可能会有缺点。许多缺点源于对面向对象技术的滥用。首先，在对象模型中添加继承可能会引入复杂性和微妙性，并非所有工程师都能完全理解，例如需要知道基类析构函数必须始终标记为\
  \ `virtual`（虚函数），或者子类中重写的方法会隐藏基类中所有相同名称的重载方法。\n\n此外，深层次的继承体系可能使得仅通过头文件就确定对象所提供的完整接口变得挑战性，因为接口可能分布在多个头文件中（当然，良好的文档工具如\
  \ `Doxygen` 可以帮助缓解这一特定问题）。此外，某些工程师可能会滥用或错误使用 OOP 概念，例如在不合适的地方使用继承（这会导致设计复杂且难以维护）。最后，使用面向对象的\
  \ C++ 创建二进制兼容的 API 是一项极其艰巨的任务。如果你的目标是二进制兼容，你可能希望选择我在本章描述的其他 API 风格，例如扁平 API 或数据驱动\
  \ API。\n\n### 案例研究：FMOD C++ API\n\n以下源代码展示了之前章节中的相同程序，只是使用了 `FMOD C++` API 而不是 `C`\
  \ API。命名空间现在通过 C++ 命名空间实现，使得所有类和函数都存在于 `FMOD` 命名空间中。该 API 的包含文件与 C API 基本相同，但使用\
  \ `.hpp` 扩展名以它是 C++ 头文件。再次，为了使代码更易读，省略了错误检查：\n\n![image](img/u05-10-9780443222191.jpg)\n\
  \n## 基于模板的 API\n\n模板是 `C++` 的一项特性，允许你根据尚未指定的类型编写函数或类。然后你可以通过实例化特定的类型或类型组合来特化模板。因此，使用模板编程通常被称为泛型编程。\n\
  \n模板是一种极其强大且灵活的工具。它们可以编写生成代码或在编译时执行的程序（这种技术被称为元编程）。这可以用于实现令人印象深刻的结果，例如展开循环、预计算级数中的某些值、在编译时生成查找表以及展开递归次数的递归函数。因此，模板可以用于编译时执行工作，从而提高运行时性能。\n\
  \n然而，本书的重点并不是对模板编程的这些方面进行介绍。已经有很多优秀的书籍涵盖了这一点（Alexandrescu, 2001; Vandevoorde and\
  \ Josuttis, 2002)）。相反，我们的重点将是模板用于 API 设计。在这方面，有几个设计良好的模板 API 示例可以供你参考和寻找灵感，例如：\n\
  \n\n\n\n\n1. **C++ 标准库。** 你所熟悉的所有标准库容器类，如 `std::set`、`std::map` 和 `std::vector`都是类模板。这就是为什么它们可以用来存储不同类型的数据。\n\
  \n2. **Boost。** Boost 库提供了一系列强大且实用的功能，其中许多功能此后被添加到 C++ 标准中。大多数 Boost 类都使用了模板，例如\
  \ `boost::shared_ptr`、`boost::function` 和 `boost::static_pointer_cast`。\n\n3. **Loki。**\
  \ 这是一个 Andrei Alexandrescu 编写的类模板库，用于支持他的书籍《现代 C++ 设计》（*Modern C++ Design*）。它提供了各种设计模式实现，例如\
  \ `Visitor`、`Singleton` 和 `Abstract Factory`。这段优雅的代码为基于模板的 API 设计提供了范例。\n\n尽管 C++\
  \ 中的模板通常与面向对象的技术结合使用，但值得注意的是，两者是完全正交的概念。模板可以同样很好地用于自由函数以及结构体（struct）和联合体（union）（当然，正如你所知的，在\
  \ C++ 中结构体在功能上等同于类，除了它们的默认访问级别外）。\n\n### 一个基于模板的 API 示例\n\n继续我们的栈示例，让我们看看如何使用模板创建一个通用的栈声明，然后为整数类型对其进行实例化。你可以根据泛型类型\
  \ `T` 来定义模板栈类：\n\n![image](img/u05-11-9780443222191.jpg)\n\n为了保持示例清晰，我省略了方法的定义。我将在稍后关于“C++\
  \ 使用”的章节中介绍一些提供模板定义的最佳实践。值得注意的是，`T` 这个名字并没有特殊之处。使用 `T` 作为你的泛型类型是常见的，但如果你愿意，也可以同样地将其命名为\
  \ `MyGenericType`。\n\n有了这个通用栈的声明，你可以通过创建一个类型为 `Stack<int>` 的对象为 `int` 类型实例化模板。这将导致编译器为该特定类型实例生成代码。你也可以定义一个简单的\
  \ `typedef` 来更方便地访问此模板实例，例如：\n\n![image](img/u05-12-9780443222191.jpg)\n\n然后这个 `IntStack`\
  \ 类型就可以像你显式编写了该类一样使用。例如：\n\n![image](img/u05-13-9780443222191.jpg)\n\n### 模板与宏\n\
  \n模板方法的另一种替代方案是使用 C 预处理器来定义一段文本，你可以多次在头文件中“盖章”它，例如：\n\n![image](img/u05-14-9780443222191.jpg)\n\
  \n除了这段代码的丑陋之处（例如，必须在每行末尾加上反斜杠并使用预处理器连接符）外，预处理器没有类型检查或作用域的概念。它仅仅是一个文本复制机制。这意味着宏的声明实际上没有被编译，因此你的宏中的任何错误将在其展开的单行中报告，而不是在声明处报告。同样，你无法使用调试器步入你的方法，因为整个代码块都展开在源文件的一单行中。相比之下，模板提供了一种在编译时生成代码的类型安全方法，你能够调试到类模板的实际行。\n\
  \n除非你正在编写纯 C API 并且无法使用模板，否则你应该避免使用预处理器来模拟模板。\n\n### 基于模板的 API 的优势\n\n模板显而易见的威力在于它允许你从单一根声明创建（实例化）许多不同的类。在我们之前的栈示例中，你只需添加这些声明，就可以添加基于字符串和浮点数的栈类支持：\n\
  \n![image](img/u05-15-9780443222191.jpg)\n\n因此，模板可以帮助消除重复，因为你不需要复制、粘贴和调整实现代码。如果没有模板，你将创建（并维护）大量看起来相似的代码来支持\
  \ `IntStack`、`StringStack` 和 `DoubleStack` 类。\n\n的另一个另一个属性是它们可以提供静态（编译时）多态，而不是使用提供动态（运行时）多态的继承。其中一个元素是，模板允许创建所有表现出相同接口的不同类。例如，我们栈类的每个实例，无论是\
  \ `IntStack`、`DoubleStack` 还是 `StringStack`，都保证提供相同的方法集。你还可以使用模板创建接受这些类型中任何一种的函数，而没有虚方法的运行时开销。这是通过在编译时生成特定类型的版本的函数实现的。下面的模板函数演示了这种能力：它可以用于从我们的任何栈类型中弹出顶部元素。在这个示例中，将在编译时生成两个版本的函数：\n\
  \n![image](img/u05-16-9780443222191.jpg)\n\n模板的进一步优势是你可以为类型实例特化类的某些方法。例如，我们的通用栈模板定义为\
  \ `Stack<T>`，但你可以为某些类型（如 `Stack<int>`）提供自定义的函数实现。这对于为某些类型优化类或为具有独特行为的类型添加自定义非常有用。这可以通过提供具有以下语法的方法定义来实现：\n\
  \n![image](img/u05-17-9780443222191.jpg)\n\n### 基于模板的 API 的劣势\n\n在模板使用的缺点方面，对于 API\
  \ 设计最关键的一个缺点是，类模板的定义通常必须出现在公共头文件中。这是因为编译器必须访问模板代码的完整定义才能对其进行特化。这显然暴露了你的内部细节，你已知这是\
  \ API 开发的一大大忌。它意味着编译器在每次包含该文件时都会重新编译代码，导致生成的代码被添加到使用该 API 的每个模块文件中（尽管 C++11 引入了外部模板模板的概念来解决这个问题）。\n\
  \n\n\n\n模板的另一个常见缺点是，大多数编译器会为模板代码中发生的错误创建冗长、宽泛或令人困惑的信息。在大量使用模板的代码中，简单的错误往往会产生几十行的错误输出，让你抓耳挠腮良长时间。事实上，市场上甚至已经了一些产品可以简化模板错误信息并使其更易解读，例如来自\
  \ BD Software 提供的 `STLFilt` 工具。这不仅对你作为 API 开发者来说是一个需要关注的问题，对于你的客户也是如此，因为如果他们错误地使用了你的\
  \ API，他们也将暴露在这些冗长的错误信息面前。C++20 引入了一项名为 `constraints`（约束）的新功能，帮助缓解这一问题并提供更多上下文相关的模板错误信息。\n\
  \n## 函数式 API\n\n函数式编程是一种依赖于组合函数而不是执行命令式语句序列的编程风格。它高度依赖将函数作为一等公民概念，而不是对象。这种方法基于由\
  \ Alonzo Church 在 1936 年开发的名为 `lambda calculus`（λ 演算）的正式计算系统。\n\n有几种编程语言仅支持函数式编程，例如\
  \ `Haskell`，还有其他语言既支持函数式编程又支持命令式编程风格，例如 `C++`。随着 C++11 的引入，得益于 `lambda functions`\
  \ 和若干新的 C++ 标准库函数等新增，该语言现在对函数式编程有了更强大的支持。\n\n### 函数式编程概念\n\n函数式编程是一种声明式编程风格，这意味着它更多地关注“你想做什么”，而不是“如何做”的命令式方法。也就是说，它关注的是表达式的求值而不是语句的执行（Čukić,\
  \ 2018）。例如，这段命令式代码展示了如何计算一个整数集合的平均值：\n\n![image](img/u05-18-9780443222191.jpg)\n\
  \n而下面的示例使用函数式风格表达了相同的内容，使用了 C++20 的 `std::accumulate()` 函数：\n\n![image](img/u05-19-9780443222191.jpg)\n\
  \n在函数式编程风格中，函数是一等公民概念，因此它们可以作为参数传递给其他函数，作为函数的返回值，并赋值给变量。例如，`std::accumulate` 函数还有一个重载版本，在其中你可以提供一个函数来定义加法以外的累加操作符，例如：\n\
  \n![image](img/u05-20-9780443222191.jpg)\n\n函数式编程的另一个核心方面是纯函数的使用。这些函数具有以下属性：\n\n\
  1. **不可不可变参数**：纯函数不会修改其参数。\n2. **无状态**：纯函数不依赖于参数以外的任何输入。\n3. **无副作用**：纯函数不会改变非局部变量或局部静态变量。\n\
  \n结果是，纯函数可以使用相同的参数多次调用，并且它们始终返回相同的结果。例如，`sqrt()` 和 `max()` 等数学函数可以实现为纯函数，而 `rand()`\
  \ 和 `time()` 则不能。（注意，在函数式编程的语境下，纯函数与面向对象的 C++ 编程中使用的纯虚函数非常不同。）\n\n（有趣的是，曾有提议为 C++\
  \ 标准增加对 `pure` 属性的支持，以便开发者可以指定某个函数为纯函数。除其他外，这将允许编译器执行更激进的优化。然而，在编写本书时，该提案尚未被 C++\
  \ 标准委员会采用）。\n\n### 函数式 API 示例\n\n继续我们定义操作栈（stack）API 的示例，这种行为可以通过引入各种在栈数据结构上的函数来以函数式风格表示，如下所示：\n\
  \n![image](img/u05-21-9780443222191.jpg)\n\n这种设计展示了位于 `stack` 命名空间内的多个纯函数，这些函数可以链在一起以创建复合表达式，例如：\n\
  \n![image](img/u05-22-9780443222191.jpg)\n\n该 API 还通过引入一个接受函数参数的 `pop_if()` 函数展示了将函数作为一等公民的使用，其中，只要函数返回\
  \ `true`，元素就会继续从栈中弹出，例如：\n\n![image](img/u05-23-9780443222191.jpg)\n\n我在每个函数上都使用了\
  \ C++17 的 `nodiscard` 属性。这是因为如果纯函数的返回值没有被使用，它们将没有任何影响，因为它们被定义为无状态且无副作用的。因此，使用 `nodiscard`\
  \ 将在用户忽略返回结果时生成编译器警告。如果用户错误地假设函数会修改数据，这会有帮助。\n\n还有其他几种方式可以实现函数式风格。我提供的示例仅适用于整数栈，但你可以将其扩展到任何类型\
  \ `T`。此外，C++ 标准库添加的许多函数式算法（如 `std::accumulate`、`std::copy_if` 和 `std::transform`）作用于迭代器而不是容器。这使得它们更通用，但也使得返回结果变得更加复杂。\n\
  \n### 函数式 API 的优势\n\n函数式编程多年来一直是流行的编程风格，很大程度上是因为它提供的许多优势。这些优势包括：\n\n1. **声明式风格**：由于函数式编程更多地关注要做什么而不是怎么做，它可以产生更具自解释性的代码。例如，与其编写\
  \ `for` 循环来操作容器的单个元素，你可以依赖高级函数如 `for_each`、`transform` 和 `copy_if`。\n2. **代码可读性**：函数式代码通常比同等的命令式代码短，因为它倾向于在高层次上指定。这有助于客户代码的可读性和维护性。\n\
  3. **并发性**：正如我在并发章节将提到的，共享可变状态是产生线程安全代码最常见的问题。然而，纯函数被定义为没有共享状态或副作用。因此，无需添加同步原语（如\
  \ `mutex` 锁）即可进行并行化。\n4. **低耦合**：纯函数的使用还可以产生更健壮的代码，结果通常更少，因为缺乏共享状态和副作用消除了与系统其他部分复杂的交互。\n\
  5. **可测试性**：纯函数的另一个优势是它们更容易测试。这是因为它们不依赖于外部状态，这意味着它们的行为完全由它们接受的输入集所表达。此外，对于相同的输入集，它们将返回相同的结果，使得任何自动化测试更具有可重复性和健壮性。\n\
  \n### 函数式 API 的缺点\n\n每种编程风格都有其缺点和优点。在函数式风格方面，需要注意的潜在问题包括：\n\n\n\n\n-   **内存占用：**\
  \ 函数式编程依赖于创建数据的副本以避免修改现有变量。因此，这种风格可能比等效的命令式解决方案消耗更多内存。这是获得前面列出的纯函数所有优势的直接权衡。然而，编译器可以实现某些优化来抵消这些内存顾虑，例如写时复制（copy\
  \ on write）和返回值优化。\n\n-   **性能：** 复制大量内存会影响性能。专用的函数式编程语言通常可以实现优化来抵消这些担忧，例如惰性求值和尾调用递归，但像\
  \ `C++` 等多范式语言的编译器可能无法有效地实现所有的优化。\n\n-   **硬件兼容性：** 性能的另一个方面是命令式编程通常很好地映射到如今的 CPU\
  \ 和 GPU 架构。然而，函数式编程与现代硬件的映射程度并不理想。传统函数式编程对递归的大量使用就是一个例子，尽管值得注意的是 `C++` 中的大多数函数式实现是迭代实现的，而不是递归实现的。\n\
  \n-   **支持较少：** 对象和模板是 `C++` 最常见的 API 风格。因此，你可以依赖的函数式编程专家可能较少，且你可用的工具和文档等资源也较少。编写良好的函数式\
  \ API 确实要求你有不同的思考，而为普通受众生成设计的需求可能要求你采用更主流的方法。\n\n## 数据驱动的 API\n\n数据驱动 API 可以与代码驱动\
  \ API 区分来：\n\n-   **代码驱动 API：** 工程师编写代码，并将其编译为二进制文件分发给客户端运行。如果需要新行为，工程师会更改代码并向客户端分发新的二进制文件。本章到目前为止的所有示例都是代码驱动\
  \ API 的示例。\n\n-   **数据驱动 API：** 工程师为通用引擎编写代码，该引擎可以读取并解释来自文件的数据，而该文件定义了系统的大部分运行时行为。如果需要新行为，非工程师（甚至可能是客户端）可以更改数据文件，而无需重新编译软件。\n\
  \n因此，数据驱动程序在每次运行时都可以通过提供不同的输入数据来执行不同的操作。例如，数据驱动程序可能简单地接受磁盘上的一个文件名，该文件包含一个要执行的命令列表。这会对\
  \ API 设计产生影响，因为它意味着你不再依赖于提供各种方法调用的对象集合，而是提供更通用的例程，接收命名命令和命名参数字典。这有时也被称为消息传递 API\
  \ 或基于事件的 API。以下函数调用格式说明了这种 API 类型与标准 `C` 和 `C++` 调用的区别：\n\n```\nfunc(obj, a, b,\
  \ c) = 扁 C 风格函数\nobj.func(a, b, c) = 面向对象的 C++ 函数\nsend(\"func\", a, b, c) = 带有位置参数的数据驱动函数\n\
  send(\"func\", dict(arg1=a, arg2=b, arg2=c)) = 带有命名参数字典的数据驱动函数（伪代码）。\n```\n\n为了提供一个直观的示例，让我们看看如何使用更具数据驱动的模型重新设计我们的\
  \ Stack 示例：\n\n![image](img/u05-24-9780443222191.jpg)\n\n这个简单的类随后可以被用于执行多个操作，例如：\n\
  \n![image](img/u05-25-9780443222191.jpg)\n\n这是一个更具数据驱动的 API，因为单独的方法被单个方法 `Command()`\
  \ 取代了，该方法支持作为字符串数据指定的多种可能的输入。人们可以很容易想象编写一个简单的程序，它可以解析包含各种命令的 ASCII 文本文件的内容并顺序执行每个命令。输入文件可能像这样：\n\
  \n![image](img/u05-26-9780443222191.jpg)\n\n使用之前的数据驱动 API 消费此数据文件的程序只需获取每行中第一个由空格分隔的字符串（忽略空行和以\
  \ `#` 开头的行，为了方便起见）。程序随后可以为初始命令之后的任何后续空白分隔的字符串创建一个 `ArgList` 结构。然后它将这些内容传递给 `Stack::Command()`\
  \ 并继续处理文件的剩余部分。该程序可以通过提供不同的文本文件来执行截然不同的栈操作，而且值得注意的是，不需要重新编译程序。\n\n### 数据驱动 API 的优势\n\
  \n我已经指出了数据驱动 API 的主要优势之一：程序的业务逻辑可以抽象到人类可编辑的数据文件中。通过这种方式，可以修改程序的行为而无需重新编译可执行文件。\n\
  \n你甚至可以决定支持一个独立的设计工具，让用户轻松编写数据文件。几个商业软件包以这种方式工作，例如 `FMOD`，它包含了 `FMOD Designer` 程序，允许对音效进行复杂的创作。生成的\
  \ `.fev` 文件由数据驱动的 `FMOD Event` API 加载。此外，`Qt` UI 工具包含了 `Qt Designer` ，允许用户以视觉化交互的方式创建用户界面。生成的\
  \ `.ui` 文件可以在运行时由 `QUiLoader` 类加载。\n\n数据驱动 API 的另一个主要优势是它往往对未来的 API 更改更有包忍性。这是因为在许多情况下，添加、删除或更改命令对你的公共方法签名没有影响。通常它只是更改可以传递给处理程序的字符串集。换句话说，向处理程序传递不支持或过时的命令不会产生编译错误。同样，可以根据参数的数量和类型支持不同版本的命令，本质上模拟了\
  \ `C++` 方法重载。\n\n回到早期的数据驱动 Stack 示例，它仅提供 `Stack::Command()` 方法，新版本的 API 可能会增加对 `Top`\
  \ 命令的支持（返回栈顶元素而不将其弹出），并可以扩展 `Push` 命令以接受多个值，每个值都按顺序推入栈。使用这些新特性的示例程序可能如下：\n\n![image](img/u05-27-9780443222191.jpg)\n\
  \n添加此新功能完全没有涉及对头文件中函数签名的任何更改。它仅仅更改了受支持的字符串以及传递给 `Command()` 方法的参数列表。\n\n数据驱动 API\
  \ 的进一步一个优势是它们更容易支持数据驱动测试技术。这是一种自动化测试技术，在其中，不再需要编写大量的单独测试程序或例程来测试 API，你只需要编写一个单一的数据驱动程序，它可以读取包含一系列要执行的命令和要检查的断言的文件。那么编写多个测试只需创建多个输入数据文件即可。因此，测试开发的迭代速度可以更快，因为创建新测试不需要编译步骤。此外，不具备深层\
  \ `C++` 开发技能的 QA 工程师仍然可以为你的 API 编写测试。\n\n\n\n\n回到我们的 Stack 示例，你可以创建一个接受输入数据文件的测试程序，例如：\n\
  \n![image](img/u05-28-9780443222191.jpg)\n\n这个测试程序和我之前描述的从数据文件中读取 Stack 命令的程序非常相似。主要的区别在于我增加了对\
  \ `=>` 符号的支持，这让你能够检查由 `Stack::Command()` 方法返回的结果。通过这个小小的改进，你现在拥有了一个灵活的测试框架，允许你为我们的\
  \ API 创建任意数量的数据驱动测试。\n\n### 数据驱动 API 的缺点\n\n正如我所描述的，数据驱动模型并不适用于所有的接口。它对于 Web 服务等数据通信接口，或对于客户端/服务器的消息传递来说可能是很有用的。然而，对于实时\
  \ 3D 图形 API 来说，它并不是一个合适的选择。\n\n原因之一是 API 的简单性和稳定性是以运行时成本为代价的。这是因为根据命令名称字符串找到对应的内部内部例程需要额外的开销。使用支持的命令名称映射到可调用函数的内部哈希表或字典可以加速这一过程，但它永远不会直接调用函数那么快。\n\
  \n同样值得注意的是，数据驱动系统可能需要构建额外的功能，而这些功能在代码驱动的解决方案中通常是不需要的。例如，在代码驱动的解决方案中，你可以依赖编译器在你的程序逻辑出现错误时发出警告和错误。然而，在数据驱动方法中，你可能需要为支持的数据格式编写自己的验证例程，以便能够检测数据文件输入中的语法错误和语义错误。你可能还需要为你的数据格式构建一个健壮的版本系统，以便你的代码能够恰当地处理旧格式或新格式。\n\
  \n此外，数据驱动 API 的另一个缺点是你的物理头文件没有反映你的逻辑接口。这意味着用户无法简单通过查看你的公共头文件来知道接口提供了哪些功能和语义。然而，请回想本书的第一部分，我将\
  \ API 定义为头文件的集合……以及相关的文档。因此，只要你提供良好的 API 文档来指定支持的命令列表及其预期的参数，你就可以合理地补偿这一缺点。\n\n\
  ### 支持变体参数列表\n\n到目前为止，我在之前的各个示例中略带过了对我们 `Result` 和 `ArgList` 类型的使用。这些类型旨在表示可能包含不同类型值的数据，而这些值在编译时可能是未知的。例如，`ArgList`\
  \ 可以用于传递无参数、单个整数参数，或者两个参数（其中一个是字符串，另一个是浮点数）。像 Python 等弱类型语言显式地支持这一概念，但传统上 C++ 并没有这样做：数组和容器必须包含所有类型都相同的元素，且该类型在编译时必须是知的。\n\
  \n然而，C++17 引入了 `std::any` 类型，它提供了一种类型安全的方式来存储不同类型的值。因此，它可以用于从文件中解析任意数据。例如，可以使用以下类型结合\
  \ C++ `any` 类型来表示一个任意类型值的字典，例如 JavaScript 对象表示法（JSON）对象：\n\n![image](img/u05-29-9780443222191.jpg)\n\
  \n这将允许我们创建一个具有可选数量命名参数的接口，这些参数的类型可以是 `bool`、`int`、`double` 或 `string`。例如：\n\n![image](img/u05-30-9780443222191.jpg)\n\
  \n你现在可以支持接受单个 `ArgList` 类型参数的方法，该参数可以用于传递任意组合的 `bool`、`int`、`double` 或 `std::string`\
  \ 参数。因此，未来对 API 行为的更改（例如，向方法支持的参数列表添加新参数）可以在不更改方法实际签名的情况下进行。\n\n### 案例研究：FMOD 数据驱动\
  \ API\n\n在这里，我展示了一个使用 FMOD 数据驱动 API 的简单程序，以给这种 API 风格提供一个真实世界的示例。这只是数据驱动接口的一个例子，它并没有说明我讨论过的所有概念。然而，它确实说明了当大部分逻辑存储在运行时加载的数据文件中中的情况。这就是\
  \ `sound.fev` 文件，它由 FMOD Designer 工具创建。程序随后展示了访问该文件中事件的命名参数并更改该参数的值：\n\n![image](img/u05-31-9780443222191.jpg)\n\
  \n### 数据驱动 Web 服务\n\n并不是所有接口都以数据驱动的方式表示的。然而，这种风格非常适用于无状态的接口，如客户端/服务器应用程序，这种风格通过发送请求来获取结果。数据驱动的\
  \ Web 服务 特别地是以这种方式表示的。它通过发送一组参数来访问 Web 服务。例如，[digg API](http://digg.com) 允许通过发送特定的\
  \ GET 请求来获取特定的信息：\n\n![image](img/u05-32-9780443222191.jpg)\n\n这种数据驱动风格可以以 HTTP\
  \ 请求的形式调用：\n\n![image](img/u05-33-9780443222191.jpg)\n\n这种方式与我之前展示的数据驱动 API 这种合得很好，这种请求可以作为\
  \ JSON 或 XML 描述来调用：\n\n![image](img/u05-34-9780443222191.jpg)\n\n### 等幂性\n\n由于我正在讨论客户端/服务器应用程序，在这里也值得涵盖等幂性这一话题。如果使用一组参数调用函数多次没有产生额外的影响，则该\
  \ API 被认为是等幂的。例如，从 `set` 或 `map` 中删除元素是等幂的，因为如果你多次尝试删除同一个元素，数据结构的内容将与只尝试删除一次相同。\n\
  \n这里有一个等幂 API 的简单示例，你可以获取或设置一个字符串向量，检查字符串是否存在于向量，并从向量中移除：\n\n![image](img/u05-35-9780443222191.jpg)\n\
  \n该 API 是等幂的，因为使用相同的输入重复调用方法都不会更改对象的底层状态；例如，\n\n![image](img/u05-36-9780443222191.jpg)\n\
  \n效果与以下相同：\n\n![image](img/u05-37-9780443222191.jpg)\n\n然而，我们可以扩展这个 API，增加一个新的 `AddLabel()`\
  \ 函数来向字符串向量中添加标签，其中字符串参数即使已经存在也会始终被添加到向量中。这个新 API 可能会像这样：\n\n![image](img/u05-38-9780443222191.jpg)\n\
  \n这个新的 API 调用不是等幂的，因为我们每次调用 `AddLabel()` 都会更改底层数据结构：\n\n\n\n\n\n![image](img/u05-38-9780443222191.jpg)\n\
  \n将产生一个包含一个字符串的向量，而：\n\n![image](img/u05-39-9780443222191.jpg)\n\n将产生一个包含两个字符串的向量。因此，重复调用该函数产生了不同的结束状态。\n\
  \n强制执行幂等（idempotent）API 在大多数情况下并不是你需要追求的：许多设计良好的 API 并不是幂等的，这没关系。然而，在某些领域中，拥有幂等的接口是理想的，因为它提供了额外的容错性保障。常见的例子是处理网络协议时。因此，你经常会听到关于\
  \ RESTful Web API 的幂等性。\n\n在通过网络发送信息时，你可能会遇到超时或网络中断。面对此类错误，一种常见的策略是客户端向服务器重新发送原始请求。通过幂等接口，客户端可以安全地重传相同的请求，而不必担心服务器上的数据因多次应用而损坏。例如，想象一个银行应用程序，客户端向服务器发送转账请求。如果请求超时并被客户端重发，那么在非幂等系统中，可能执行了两次转账而不是一次。\n\
  \nTable 5.1\n\nHTTP 方法及其是否为幂等。\n\n| HTTP 方法 | 是否为幂等？ |\n| --- | --- |\n| HEAD |\
  \ 是 |\n| GET | 是 |\n| OPTIONS | 是 |\n| TRACE | 是 |\n| PUT | 是 |\n| DELETE | 是 |\n\
  | POST | 否 |\n| PATCH | 否 |\n\n由于幂等性主要关注 API 调用对系统底层状态的影响，任何只读 API 调用都可以被认为是幂等的。同样，任何替换现有数据项表示的调用，或任何删除数据项的调用也可以被认为是幂等的，因为它们可以安全地重复（如上一个示例所示）。但向系统添加新数据的调用通常不是幂等的。\n\
  \n在 HTTP 协议方面，Table 5.1 指明了哪些 HTTP 方法被认为是幂等的，哪些不是（根据 RFC 9110）。\n\n可以使诸如 POST HTTP\
  \ 调用这样的操作变得幂等。实现此点的常用方法是为每个修改数据的请求引入一个唯一标识符。服务器可以保留最近交易 GUID 的记录，如果它遇到了一个已经见过的 GUID，它可以忽略该请求并返回适当的成功响应，而不会再次修改底层数据。\n\
  \n重复调用没有必要返回与第一次完全相同的服务器响应：幂等性关乎确保数据的一致性，因此第二个请求返回一个指示其被忽略的结果可能是有效的，客户端可以自行选择如何处理该信息。值得注意的是，服务器可能会记录所有收到的请求列表，包括任何重复请求，因此通过这种方式，在重复请求后总的底层状态将会有不同，但核心业务逻辑状态应该不受影响。\n\
  \n因此，在 API 设计指南方面，当要求数据修改操作具有容错性时，你可以考虑为每个操作引入事务 GUID，以便主机可以使用此来正确处理重复请求。或者，更通用地说，你可以引入开始和结束原子事务的概念，其中事务要么被保证完全执行，要么完全不执行，例如在你的\
  \ API 中使用 `BeginTransaction()` 和 `EndTranscation()` 一对函数。\n\n# 6: C++ 使用\n\n## 摘要\n\
  \n本章涉及了可能影响应用程序接口（API）设计的 C++ 语言核心特性。这包括通过对所有 API 符号使用一致的前缀或使用 C++ 命名空间关键字来命名命名。涵盖了如何正确声明构造函数和赋值运算符的主题，包括三规则（Rule\
  \ of Three）。然后涵盖了 const 正确性（const correctness）问题，包括方法、参数和返回值的 const 正确性。讨论了模板 API\
  \ 问题，例如隐式实例化与显式实例化，以及模板头文件布局的良好实践。运算符重载章节描述了如何以最健壮的方式定义运算符，以及如何决定运算符应该是成员函数还是自由函数。介绍了使用默认参数作为实现向后兼容\
  \ API 更改的一种方法，尽管有时重载函数提供更好的解决方案。不鼓励使用 `#define` 定义常量和枚举，并提供了替代的强类型选项。也不鼓励使用友元（friends），因为它们会破坏封装并允许客户端访问内部细节。还解释了符号导出的主题，包括在\
  \ Windows 上使用 `__declspec` 属性在动态库中暴露符号。最后，提倡使用良好的编码规范，并提供了一个此类文档的示例框架。\n\n### 关键词\n\
  \n赋值；const 正确性；构造函数；默认参数；友元；命名空间；运算符重载；参数；三规则；模板\n\n本章探索了使 C++ 成为良好的应用程序接口（API）的特质。我在第\
  \ 2 章 中涵盖的通用 API 特质适用于任何语言：隐藏细节、易用性、松耦合和完整性。然而，许多特定的 C++ 风格决策会影响 API 的质量，例如命名空间、友元和\
  \ const 正确性的使用。我将在后续节中讨论这些以及更多内容。本章将关注适用于 C++ 标准所有版本的问题：即仅与 C++98 和 C++03 的问题。我将在下一章处理与\
  \ C++11 及以后版本的 API 设计特性。\n\n注意，我将某些与性能相关的 C++ 主题（如内联和 const 引用）推迟到性能章节。我将在并发章节中涵盖多线程主题。\n\
  \n## 命名空间\n\n命名空间是唯一符号的逻辑分组。它提供了一种避免命名冲突的方法，防止两个 API 尝试定义相同的符号。例如，如果两个 API 都定义了\
  \ `String` 类，那么你无法在同一个程序中使用这两个 API。你应该始终在 API 中使用某种形式的命名空间，以确保它们能与客户端可能使用的任何其他 API\
  \ 交互。\n\n为 API 添加命名空间有两种常用方法。第一种是为所有公共 API 符号使用唯一前缀，这样做的好处是它也适用于纯 C API。这种类型的命名空间有很多例子：\n\
  \n- OpenGL API 使用 `gl` 作为所有公共符号的前缀（例如 `glBegin()`、`glVertex3f()` 和 `GL_BLEND_COLOR`）。\n\
  - Qt API 使用 `Q` 前缀用于所有公共名称（例如 `QWidget`、`QApplication`）。\n- libpng 库使用 `png` 前缀用于所有标识符（例如\
  \ `png_read_row()`、`png_create_write_struct()` 和 `png_set_invalid()`）。\n\n\n\n\n\
  \n4. `GNU GTK+API` 使用 `gtk` 前缀（例如：`gtk_init()`、`gtk_style_new()` 和 `GtkArrowType`）。\n\
  \n6. `Second Life` 源代码使用 `LL` 前缀（Linden Lab 的缩写）用于各种类、枚举和常量（例如：`LLEvent`、`LLUUID`\
  \ 和 `LL_ACK_FLAG`）。\n\n7. `Netscape Portable Runtime` 使用 `PR` 前缀命名所有导出的类型（例如：`PR_WaitCondVar()`、`PR_fprintf()`\
  \ 和 `PRFileDesc`）。\n\n第二种方法是使用 C++ 的 `namespace`（命名空间）关键字。这本质上定义了一个作用域，该范围内的任何名称都会赋予一个额外的前缀标识符。例如，\n\
  \n![image](img/u06-01-9780443222191.jpg)\n\n在这种情况下，`String` 类必须被引用为 `MyAPI::String`。这种风格的好处在于，你不需要细致地确保每个类、函数、枚举或常量都有一致的前缀：编译器会为你完成这一点。C++\
  \ 标准库使用了这种方法，所有的容器类、迭代器和算法都包含在 `std` 命名空间。你还可以创建嵌套命名空间，形成命名空间树。例如，Intel 的 `Threading\
  \ Build Blocks API` 对所有公共符号使用 `tbb` 命名空间，对内部代码使用 `tbb:strict_ppl`。`Boost` 库也在根 `boost`\
  \ 命名空间内部使用嵌套命名空间（例如，`boost::variant` 命名空间包含 `Boost Variant API` 的公共符号，而 `boost::detail::variant`\
  \ 包含该 API 的内部细节）。\n\n使用 `namespace` 功能可能会产生冗长的符号名称，特别是对于包含在多个嵌套命名空间中的符号。然而，C++ 提供了一种通过\
  \ `using` 关键字使用命名空间内符号更方便的方法：\n\n![image](img/u06-02-9780443222191.jpg)\n\n或者，更优的选择（因为限制了导入到全局命名空间的符号范围）：\n\
  \n![image](img/u06-03-9780443222191.jpg)\n\n然而，你绝对不要在公共 API 头文件的全局作用域内使用 `using`\
  \ 关键字！这样做会导致所引用命名空间中的所有符号在全局命名空间中变得可见。这将违背最初使用命名空间的初衷（Stroustrup, 2000）。如果你想在你的头文件中引用另一个命名空间中的符号，请务必使用完全限定名（例如\
  \ `std::string`）。\n\n### 构造函数与赋值\n\n如果你正在创建包含状态且可能被客户端程序拷贝或赋值的对象（有时称为值对象），你能够考虑构造函数的正确设计。\n\
  \n- **默认构造函数**：构造函数用于初始化对象。如果你没有定义它，编译器将生成默认版本。然而，如果你的类有动态分配内存，你必须显式定义一个。\n- **析构函数**：调用析构函数释放对象持有的任何资源。如果你没有指定，编译器将生成一个。\n\
  - **拷贝构造函数**：拷贝构造函数从现有对象创建一个新对象。如果你没有定义它，编译器会自动生成一个。它在以下情况下被调用：\n    1. 对象按值传递给方法。\n\
  \    2. 使用大括号括的列表初始化对象。\n    3. 对象按值返回或在异常中被捕获。\n- **赋值运算符**：赋值运算符用于将一个对象的值赋给另一个对象。它与拷贝构造函数的区别在于被赋值的对象已经存在。实现赋值运算符的一些指南包括：\n\
  \    1. 对右操作数使用 `const` 引用。\n    2. 返回 `this` 的引用以允许链式调用。\n    3. 在设置新状态之前销毁任何现有状态。\n\
  \    4. 检查自赋值（`a = rhs`）。\n\n因此，在创建值对象时，遵循“三要素”（The Big Three，也称为“三规则”（The Rule\
  \ of Three）至关重要。这个术语由 Marshall Cline 在 20 世纪 90 年代初引入，基本上表示三个成员函数总是在一起使用的：析构函数、拷贝构造函数和赋值运算符（Cline\
  \ et al., 1998）。如果你定义了其中一个，通常也需要定义另外两个（声明一个空的虚析构函数以启用子类是一个例外，因为它没有执行实际的释放）。James\
  \ Coplien 将此概念称为正统规范类形式（the orthodox canonical class form）（Coplien, 1991）。\n\n许多初学者\
  \ C++ 开发者会遇到麻烦，因为他们有一个分配内存并需要析构函数的类，但他们没有定义拷贝构造函数或赋值运算符。例如，考虑下面的简单数组类，我展示了构造函数和析构函数：\n\
  \n![image](img/u06-04-9780443222191.jpg)\n\n该类分配了内存但没有定义拷贝构造函数或赋值运算符。结果，下面的代码在两个变量离开作用范围时会崩溃，因为每个析构函数都会尝试释放同一块内存：\n\
  \n![image](img/u06-05-9780443222191.jpg)\n\n\n\n\n编写构造函数和运算符可能是一项棘手的工作，因此这里有一个演示各种组合的示例。它在之前的数组示例的基础上，提供了一个用于存储字符串数组的\
  \ `Array` 类。数组是动态分配的，因此你必须定义拷贝构造函数和赋值运算符；否则，如果拷贝数组，在析构时内存会被释放两次。以下是头文件中 `Array`\
  \ 类的声明：\n\n![image](img/u06-06-9780443222191.jpg)\n\n这里是构造函数和赋值运算符的示例定义：\n\n![image](img/u06-07-9780443222191.jpg)\n\
  \n给定之前的 `Array` 类，以下代码演示了何时会调用各种方法：\n\n![image](img/u06-08-9780443222191.jpg)\n\n\
  注意：在某些情况下，编译器可能会省略对拷贝构造函数的调用：例如，如果它执行了某种形式的返回值优化（Meyers, 1998）。\n\n## explicit 关键字\n\
  \n你可能已经注意到在之前的 `Array` 示例中，在非默认构造函数的声明之前使用了 `explicit` 关键字。对于任何接受单个参数的非默认构造函数，添加\
  \ `explicit` 是一个良好的通用做法。它用于防止在构造对象时隐式地调用非默认构造函数。例如，如果没有 `explicit` 关键字，这段代码是合法的\
  \ C++ 代码：\n\n![image](img/u06-09-9780443222191.jpg)\n\n这将使用整数参数 `10` 调用 `Array`\
  \ 非默认构造函数。然而，这种隐式行为可能会令人困惑、不直直觉，并且在大多数情况下是非预期的。作为这种不希望的隐式转换的进一步示例，考虑以下函数签名：\n\n\
  ![image](img/u06-10-9780443222191.jpg)\n\n如果不将 `Array` 的单参数构造函数声明为 `explicit`，你可以这样调用此函数：\n\
  \n![image](img/u06-11-9780443222191.jpg)\n\n这削弱了你 API 的类型安全性，因为现在编译器将不会强制第一个参数的类型为显式的\
  \ `Array` 对象。结果是，用户可能会忘记正确的参数顺序并以错误的顺序传递它们。这就是为什么除非你确定想要支持隐式转换，否则你应该始终对任何单参数构造函数使用\
  \ `explicit` 关键字。\n\n你也可以将你的拷贝构造函数声明为 `explicit`。这将防止对拷贝构造函数的隐式调用，例如通过按值将对象传递给函数或按值返回对象。然而，你仍然可以使用\
  \ `Array a = b` 或 `Array a(b)` 语法显式地调用拷贝构造函数。从 C++11 开始，你可以在转换运算符以及构造函数前面使用 `explicit`\
  \ 关键字。这样做可以防止这些转换函数用于隐式转换。\n\n## const 正确性 (Const correctness)\n\nConst 正确性是指使用\
  \ C++ `const` 关键字将变量或方法声明为不可变。这是一个编译时结构，你可以它来维护不应修改某些变量的代码正确性。在 C++ 中，你可以将变量定义为\
  \ `const`，这意味着它们不应该被修改；你也可以将方法定义为 `const`，这意味着它们不应该修改类的任何成员变量。使用 const 正确性是一种良好的编程实践。然而，它还可以提供方法意图的文档，从而使它们更容易使用。\n\
  \n### 方法的 const 正确性\n\n`const` 方法不能修改类的任何成员变量。从本质上，在 `const` 方法内部，所有成员变量都被视为 `const`\
  \ 变量。这种形式的 const 正确性通过在方法的参数列表后附加 `const` 关键字表示。将方法声明为 `const` 有两个主要优点：\n\n1. 告知该方法不会改变对象的状态。正如我刚刚提到的，这对于你的\
  \ API 用户来说非常有用的文档。\n2. 允许在对象的 const 版本上该方法。非 const 方法不能在对象的 const 版本上调用。\n\nScott\
  \ Meyers 描述了关于 `const` 方法代表什么的两种哲学流派。一种是位 const 性（bitwise constness）派，认为 `const`\
  \ 方法不应该改变类的任何成员变量；另一类是逻辑 const 性（logical constness）派，认为如果这种更改无法被用户检测到，`const` 方法可以更改成员变量（Meyers,\
  \ 2005）。（注：原文后续部分存在大量重复文本，译文已根据逻辑流进行清理处理）。\n\n\n\n\n在返回函数结果时，将该结果声明为 `const` 的主要原因是它可能引用了对象的内部状态。例如，如果你是按值返回结果，那么将其指定为\
  \ `const` 意义并不大，因为返回的对象将是副本，因此修改它不会影响你类中的任何内部状态。\n\n或者，如果你返回一个指向私有数据成员的指针或引用，那么你应该将结果声明为\
  \ `const`；否则，用户将能够不通过你的公共 API 就修改你的内部状态。在这种情况下，你还必须考虑返回的指针或引用的生命周期是否比你的类长。如果存在这种情况，你应该考虑返回引用计数的指针，例如\
  \ `std::weak_ptr` 或 `std::shared_ptr`，这在前面的第 2 章 中讨论过。\n\n因此，关于返回值常量正确性（const correctness），你将面临的最常见决策是按值返回结果还是返回\
  \ `const` 引用，即：\n\n![image](img/u06-18-9780443222191.jpg)\n\n通常情况下，我建议你按值返回结果，因为它更安全。在某些性能至关重要的少数情况下，你可能更倾向于使用\
  \ `const` 引用方法，但现代编译器的优化可能会让这些大多数情况变得没有必要。按值返回更安全，不仅是因为你不需要担心客户端在对象被销毁后仍持有该对象的引用（悬空引用），还因为返回\
  \ `const` 引用可能会破坏封装。它还让多线程情况变得更加复杂，因为执行锁的责任被转移到了客户端，而不是保留在 API 调用之后。\n\n从表面上看，我们之前的\
  \ `const` 引用方法 `GetName()` 是可以接受的：该方法被声明为 `const` 以表示它不会修改对象的状态，且返回的对象内部状态的引用也被声明为\
  \ `const`，以便客户端无法修改它。然而，坚定的客户端总是可以抛掉引用的常量属性，然后直接修改底层的私有数据成员，例如在本例所示：\n\n![image](img/u06-19-9780443222191.jpg)\n\
  \n## 模板\n\n模板提供了一种在编译时生成代码的通用且强大的能力。它们对于生成大量相似但仅类型不同的代码特别别有用。然而，如果你决定将类模板作为公共 API\
  \ 的一部分，你应该考虑几个问题，以确保你提供了一个良好隔离、高效且跨平台的接口。接下来的章节将介绍其中的几个因素。\n\n请注意，我在这里不会涵盖模板编程的所有方面，仅涵盖影响良好\
  \ API 设计的特性。关于模板更详尽、深入的探讨，市场上还有几本好书（Josuttis, 1999; Alexandrescu, 2001; Vandevoorde\
  \ and Josuttis, 2002)\n\n## 模板术语\n\n模板是 C++ 中一个经常未被理解的部分，为了让我们继续下去，我们从定义一些术语开始，我将使用模板来描述一个类：\n\
  \n![image](img/u06-20-9780443222191.jpg)\n\n模板描述类：\n\n1. **模板参数 (Template Parameters)**：这些是跟在\
  \ `template` 关键字后面的名称。例如，在我们之前的示例中 `T` 就是模板参数。\n2. **模板参数 (Template Arguments)**：这些是在实例化期间替换模板参数的实体。例如，`Stack<int>`\
  \ 中的 `int` 是模板参数。\n3. **实例化 (Instantiation)**：这是编译器通过用具体类型替换模板的参数来生成类、方法或函数的过程。这可以隐式发生（当你创建一个对象时），也可以显式发生（如果你想控制代码生成）。例如，这些代码创建了特定的栈：\n\
  \n![image](img/u06-21-9780443222191.jpg)\n\n1. **隐式实例化 (Implicit Instantiation)**：这是编译器决定何时生成实例代码。将此决定交给编译器意味着它必须找到合适的地方插入代码，并且确保只存在一个以避免重复符号错误。这是一个棘手的问题，可能会导致目标文件膨胀或编译和链接时间增加。对于\
  \ API 设计，隐式实例化意味着你必须将定义包含在头文件中以便编译器访问。\n2. **显式实例化 (Explicit Instantiation)**：这是由程序员决定编译器何时生成特定特化的代码。这可以提高编译和链接效率，因为编译器不再需要维护所有隐式实例化的信息。然而，程序员需要确保特定的实例化只发生一次。从\
  \ API 的角度来看，显式实例化允许我们将模板实现移动到 `.cpp` 文件中，从而对用户隐藏。\n3. **延迟实例化 (Lazy Instantiation)**：这描述了\
  \ C++ 编译器的隐式实例化行为，即它只为实际使用的模板部分生成代码。例如，在我们之前的实例化中，如果你从未在 `myStringStack` 对象上调用 `IsEmpty()`，那么编译器就不会为\
  \ `std::string` 版本的方法生成代码。这意味着你可以使用一个只能满足类某些方法的类型来实例化模板。例如，假设某个方法使用了 `>=` 运算符，但你想实例化的类型没有定义该运算符。如果你不调用尝试使用\
  \ `>=` 的特定方法，就没有问题。\n4. **特化 (Specialization)**：当模板被实例化时，生成的类、方法或函数被称为特化。更具体地说，这是一个实例化的（或生成的）特化。然而，当你通过指定所有模板参数来提供自定义实现时，也可以使用这个词。我在之前的\
  \ API 风格章节中给出过这个例子，当时展示了针对整数类型特化的 `Stack::Push()` 方法实现。这被称为显式特化：\n\n\n\n\n\n###\
  \ 1. 部分特化 (Partial Specialization)\n\n这是针对所有可能情况的子集提供模板特化。也就是说，你特化了模板的某个特征，但仍然允许用户指定其他特征。例如，如果你的模板接受多个参数，你可以通过定义一个仅为其中一个参数指定具体类型的情况，来对其进行部分特化。在我们具有单个模板参数的\
  \ `Stack` 示例中，你可以专门对该模板进行部分特化，以处理指向任何类型 `T` 的指针。这仍然允许用户创建任何类型的栈，但同时也允许你编写特定的逻辑来处理用户创建指针栈的情况。这个部分特化的类声明可能如下：\n\
  \n![image](img/u06-23-9780443222191.jpg)\n\n### 隐式实例化 API 设计 (Implicit instantiation\
  \ API design)\n\n如果你想允许客户端使用他们自己的类型来实例化你的类模板，那么你就需要使用隐式模板实例化。例如，如果你提供了一个智能指针类模板\
  \ `smart_pointer<T>`，你无法提前预知客户端想要用什么类型来实例化它。结果是，编译器在使用模板时需要能够访问模板的定义。这本质上意味着你必须在头文件中暴露模板定义。在健壮的\
  \ API 设计方面，这是隐式实例化方法最大的缺点。然而，即使在这种情况下你无法隐藏实现细节，你至少可以尝试将它们隔离起来。\n\n由于你需要在头文件中包含模板定义，因此很容易且往往诱人们们直接将定义内联（inline）在类定义中。这种做法我已经归类为糟糕的设计，这一断言在模板情况下仍然成立。相反，我建议所有的模板实现细节应该包含在一个单独的实现头文件中，由主公共头文件包含它。以我们的\
  \ `Stack` 类模板为例，你可以提供主公共头文件：\n\n![image](img/u06-24-9780443222191.jpg)\n\n然后实现头文件\
  \ `stack_priv.h` 看起来如下：\n\n![image](img/u06-25-9780443222191.jpg)\n\n这是许多高质量模板 API\
  \ 使用的一项技术，例如各种 `Boost` 头文件。它的优点是保持主公共头文件不被实现细节所杂染，同时将内部细节的必要暴露隔离到被明确标记为包含私有细节的单独头文件中。（相同的技术也可用于将有意的内联函数细节从声明中隔离出来。）\n\
  \n在头文件中包含模板定义的技术被称为包含模型（inclusion model [Vandevoorde and Josuttis, 2002）。值得注意的是，这种风格还有另一种替代方案称为分离模型（separation\
  \ model）。这种模型旨在在 `.h` 文件中的类模板声明之前加上 `export` 关键字。模板方法的实现随后可以出现在 `.cpp` 文件中。从 API\
  \ 设计的角度来看，这是一种优得多的模型，因为它允许我们从公共头文件中移除所有实现细节。然而，C++ 规范的这部分 get 大多数编译器的支持非常差。最终 `export`\
  \ 关键字在 `C++11` 中被弃用，然后在 C++20 中被用于不同的功能。\n\n### 显式实例化 API 设计 (Explicit instantiation\
  \ API design)\n\n如果你只想为你的 API 提供一组预定的模板特化，并禁止用户创建更多的特化，那么你确实拥有完全隐藏私有代码的选择。例如，如果你创建了一个\
  \ 3D 向量类模板 `Vector3D<T>`，你可能只想为 `int`、`short`、`float` 和 `double` 提供该模板的特化，并且可能认为没有必要让用户创建进一步特化。\n\
  \n在这种情况下，你可以将模板定义放入 `.cpp` 文件，并使用显式模板实例化来实例化那些希望作为 API 部分导出的特化版本。`template` 关键字可以用于创建显式实例化。例如，使用我们之前的\
  \ `Stack` 模板示例，你可以通过以下语句为 `int` 类型创建显式实例化：\n\n![image](img/u06-26-9780443222191.jpg)\n\
  \n这将导致编译器在代码的此处生成 `int` 特化的代码。结果是，它随后将不再尝试在代码的其他地方隐式地实例化该特化。因此，使用显式实例化还可以帮助缩短构建时间。\n\
  \n让我们看看如何组织代码以利用这一特性。我们的 `stack.h` 头文件看起来和之前几乎一样，只是没有了 `#include \"stack_priv.h\"\
  ` 行：\n\n![image](img/u06-27-9780443222191.jpg)\n\n现在你可以将所有的实现放在关联的 `.cpp` 文件：\n\n\
  ![image](img/u06-28-9780443222191.jpg)\n\n重要的行是最后三行，它们为 `int`、`double` 和 `std::string`\
  \ 类型创建了 `Stack` 模板的显式实例化。用户将无法创建进一步的特化（编译器也无法创建隐式实例化），因为实现细节隐藏在我们的 `.cpp` 文件中。为了指示用户可以使用哪些模板特化（即你已经显式实例化的版本），你可以在公共头文件的末尾添加一些\
  \ `typedef`，例如：\n\n![image](img/u06-29-9780443222191.jpg)\n\n值得注意的是，通过采用这种模板风格，你和客户端不仅由于隐式实例化移除获得了更快的构建，而且通过从头文件中移除模板定义减少了\
  \ API 的耦合以及客户端每次包含头文件时必须编译的额外代码。\n\n同样重要的是，大多数编译器提供完全关闭隐式实例化的选项，如果你计划在代码中使用仅显式实例化，这可能是非常有用的优化。该选项在\
  \ GNU C++ 和 Intel 编译器中称为 `-fno-implicit-templates`。\n\n从 C++11 开始，增加了对 `extern`\
  \ 模板的支持。这意味着你将能够使用 `extern` 关键字来防止编译器在当前单元中实例化模板。通过使用 `extern` 模板，你可以强制编译器在某处实例化模板，并告诉它不要其他地方实例化。例如：\n\
  \n![image](img/u06-30-9780443222191.jpg)\n\n### 运算符重载 (Operator overloading)\n\n\
  除了重载函数，C++ 还允许你为类重载许多运算符，例如 `+`、`*` 或 `[]`。这对于让你的类看起来和运行更像内置类型，以及为某些方法提供更简洁、直观的语法非常有用。例如，你不再需要使用如下语法：\n\
  \n![image](img/u06-31-9780443222191.jpg)\n\n而是编写支持如下语法的类：\n\n![image](img/u06-32-9780443222191.jpg)\n\
  \n\n\n\n当然，你应该只在符合逻辑的情况下使用运算符重载：即，当这样做对于你 API 的用户来说是自然的，且不违反“最小惊讶原则”时。这通常意味着你应该保留操作符的自然语义，例如使用\
  \ `+` 运算符来实现类似于加法或拼接的操作。你还应该避免重载 `&&`、`||`、`&`（一元按位与）和 `,`（逗号）运算符，因为这些运算符表现出的行为可能会让用户感到意外，例如短路求值和未定义的求值顺序（Meyers\
  \ 1998; Sutter and Alexandrescu, 2004)）。\n\n正如我在本章前面提到的，如果你不显式地定义赋值运算符，C++ 编译器将为你的类生成默认的赋值运算符\
  \ `=`。但是，如果你想对对象使用任何其他运算符，就必须显式地定义它们；否则你将导致链接错误。\n\n## 可重载的运算符\n\n某些运算符在 C++ 中不能被重载，例如\
  \ `.`、`.*`、`?:` 和 `::`，预处理器符号 `#` 和 `##` 以及 `sizeof` 运算符。在剩余可以为你自己的类重载的运算符中，主要分为两类：\n\
  \n1. **一元运算符**：这些是作用于单个操作数的运算符。一元运算符列表包括：\n\n| 名称 | 示例 | 名称 | 示例 |\n| --- | ---\
  \ | --- | --- |\n| 一元负 | `−x` | 一元正 | `+x` |\n| 前置减一 | `--x` | 后置减一 | `x−`` |\n\
  | 前置增一 | `++x` | 后置增一 | `x++` |\n| 解引用 | `∗x` | 引用 | `&x` |\n| 逻辑非 | `!x` | 位取反\
  \ | `∼x` |\n| 函数调用 | `x()` | | |\n\n2. **二元运算符**：这些作用于两个操作数的运算符。二元运算符列表包括：\n\n|\
  \ 名称 | 示例 | 名称 | 示例 |\n| --- | --- | --- | --- |\n| 加法 | `x+y` | 减法 | `x − y` |\n\
  | 加法赋值 | `x+=y` | 减法赋值 | `x − =y` |\n| 乘法 | `x∗y` | 除法 | `x/y` |\n| 乘法赋值 | `x∗=y`\
  \ | 除法赋值 | `x/=y` |\n| 等于 | `x==y` | 不等于 | `x!=y` |\n| 赋值 | `x=y` | 逗号 | `x, y`\
  \ |\n| 小于 | `x<y` | 大于 | `x>y` |\n| 小于等于 | `x<=y` | 大于等于 | `x>=y` |\n| 取模 | `x%y`\
  \ | 位异或 | `x ^ˆ y` |\n| 取模赋值 | `x%=y` | 位异或赋值 | `x ^ˆ =y` |\n| 位按与 | `x&y` | 位按或\
  \ | `x&#124;y` |\n| 位与赋值 | `x&=y` | 位按或赋值 | `x&#124;=y` |\n| 逻辑与 | `x&&y` | 逻辑或\
  \ | `x&#124;&#124;y` |\n| 位左移 | `x<<y` | 位右移 | `x>>y` |\n| 位左移赋值 | `x<<=y` | 位右移赋值\
  \ | `x>>=y` |\n| 类成员访问 | `x->y` | 成员选择 | `x->∗y` |\n| 数组下标 | `x[y]` | C 风格类型转换 |\
  \ `(y) x` |\n\n## 自由运算符与成员运算符\n\n运算符既可以定义为类的成员，也可以定义为自由函数。某些运算符必须定义为类成员，但其他运算符可以任选其一。例如，这段代码说明了定义为类成员的\
  \ `+=` 运算符：\n\n![image](img/u06-33-9780443222191.jpg)\n\n接下来的代码展示了使用自由函数版本的等效 API：\n\
  \n![image](img/u06-34-9780443222191.jpg)\n\n在这一节中，我将介绍关于是否应该将运算符制为自由函数或方法的最佳实践。\n\
  \n首先，C++ 标准要求将以下运算符声明为成员方法，以确保它们接收一个左值（引用对象的表达式）作为其第一个操作数：\n\n1. `=` 赋值\n2. `[]`\
  \ 下标\n3. `->` 类成员访问\n4. `->∗` 成员指针选择\n5. `()` 函数调用\n6. `(T)` 转换，即 C 风格类型转换\n7. `new/delete`\n\
  \n剩余的可重载运算符可以定义为自由函数或类方法。从良好的 API 设计角度来看，对于二元运算符，我建议采用自由函数版本而非类方法版本。有两个具体原因：\n\n\
  1. **运算符对称性**：如果二元运算符定义为类方法，它必须作为左侧操作数。以 `∗` 运算符为例，这意味着用户可以编写 `complexNumber ∗ 2.0`（假设你定义了\
  \ `Complex` 的构造），但无法编写 `2.0 ∗ complexNumber`（因为 `2.0` 不是）。你还需要将其制为自由函数，以确保它具有对称行为，如前所述。事实上，`+`\
  \ 运算符可以通过 `+=` 运算符来实现，从而允许代码复用并减少派生类中可能需要重载的方法的数量。\n2. **降低耦合**：自由函数无法访问私有成员。因此，它与类的耦合较低，因为它只能访问公共方法（Meyers,\
  \ 2000; Tulach, 2008)）。\n\n在说明了对自由函数运算符的通用偏好后，我现在提出这一规则的例外：如果你的运算符必须访问类的私有或保护成员，那么你应该将运算符定义为类的方法。我之所以提出这个例外，是因为否则必须将自由运算符声明为类的友元。正如我在本章后面讨论的，为类添加友元是一种更大的错误。这里提到的一个具体原因是客户端无法更改类的友元列表，因此无法通过这种方式添加新的运算符。\n\
  \n## 为类添加运算符\n\n让我们进一步完善 `Complex` 类，使观点更加具体。`+=` 运算符修改对象的内容，而所有的成员变量应该是私有的；因此你可能需要将\
  \ `+=` 运算符制为成员方法。然而，`+` 运算符并不修改左侧操作数。因此它不需要访问私有成员，可以制为自由函数。你还需要将其制为自由函数，以确保它具有对称行为，如前所述。显然，同样的技术适用于其他算术运算符，例如\
  \ `-`、`-=`、`∗`、`*=`、`/` 和 `/=`。例如，`∗=` 可以实现为成员函数，而 `∗` 可以实现为使用 `∗=` 运算符的自由函数。\n\n\
  \n\n对于关系运算符 `=`、`!=`、`<`、`<=`、`>` 和 `>=`, 也必须实现为自由函数以确保对称的行为。在我们的 `Complex` 类中，你可以使用公共的\
  \ `GetReal()` 和 `GetImaginary()` 方法来实现这些运算符。然而，如果这些运算符需要访问对象的私有状态，有一种方法可以解决这个表面上的困境。在这种情况下，你可以提供公共方法来测试相等和小于条件。那么，所有的关系运算符都可以基于这两个原始函数来实现（参见\
  \ Astrachan, 2000）：![image](img/u06-36-9780443222191.jpg)\n\n我在这里考虑的最后一个运算符是 `<<`，我将将其用于流输出（而不是位移）。流运算符必须声明为自由函数，因为第一个参数是一个流对象。同样，你可以使用公共的\
  \ `GetReal()` 和 `GetImaginary()` 方法来实现这一点。然而，如果流运算符确实需要访问类的私有成员，那么你可以为 `<<` 运算符创建一个公共的\
  \ `ToString()` 方法供调用，作为避免使用友（friend）的方法。\n\n将所有这些建议整合在一起，我们的 `Complex` 类的运算符可能如下：\n\
