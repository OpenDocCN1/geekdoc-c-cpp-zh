  \ 方法：![image](img/bm15-9780443222191.jpg)\n\n## Linux 库\n\n在接下来的章节中，我将概述如何在 Linux\
  \ 上创建和管理静态库和动态库。这里的重点是介绍重要的问题和技术。然而，为了更深入的探讨，我建议阅读 Ulrich Drepper 编写的优秀文章《如何编写共享库》，可以在线上到：[[`akkadia.org/drepper/dsohowto.pdf`](https://akkadia.org/drepper/dsohowto.pdf)]\n\
  \n### 在 Linux 上创建静态库\n\n在 Unix 上，静态库仅仅是对象 (.o) 文件的归包。你可以使用 Unix `ar` 命令将多个对象文件编译成静态库。例如，以下命令演示了如何使用\
  \ GNU C++ 编译器将三个 `.cpp` 文件编译为 `.o` 文件，然后从这些对象文件创建静态库：![image](img/bm16-9780443222191.jpg)\n\
  \n`g++` 的 `-c` 选项告诉编译器从输入的 `.cpp` 文件生成 `.o` 文件。`ar` 的选项有：`-c` 创建归包，`-r` 将提供的 `.o`\
  \ 文件插入归包中，以及 `-s` 为归包创建索引（等同于旧习惯中在生成的归包上运行 `ranlib`）。\n\n你的用户可以使用 `ld` 或 `g++` 的\
  \ `-l` 选项链接你的库。这指定了要链接的库的名称。`-L` 链接器选项也可用于指定查找库的目录。例如：![image](img/bm17-9780443222191.jpg)\n\
  \n在这个示例中，用户应用程序 `userapp` 是通过编译 `usercode.cpp` 并链接到相同目录下的 `libmyapi.a` 静态库创建的。命令行上归包的顺序非常重要。对于链接器在命令行上找到每个归包，它都会检查该归包是否定义了从命令行之前指定的任何对象文件中引用的符号。如果它确实定义了任何需要的符号，带有这些符号的对象文件将被复制到可执行文件中。因此，最佳实践是在命令的末尾指定库（Mitchell\
  \ et al., 2001）。\n\n在讨论静态库的创建时，值得注意的是 `-static` 编译器选项的正确用法。该标志用于创建可执行文件，而不是库。因此，它适用于你\
  \ API 的用户，但不适用于你 API 本身的构建。该标志指示编译器倾向于将所有依赖库的静态版本链接到可执行文件中，以便其在运行时不依赖任何动态库。\n\n\
  ### 在 Linux 上创建动态库\n\n在 Linux 上创建动态库与创建静态库非常相似。使用 GNU C++ 编译器，你可以简单地使用 `-shared`\
  \ 链接器选项生成 `.so` 文件而不是可执行文件。\n\n在不是默认行为的平台上，你还应该指定 `-fpic` 或 `-fPIC` 命令行选项，以指示编译器产生位置无关代码\
  \ (PIC)。这是必要的，因为共享库中的代码可能会被不同的可执行文件加载到不同的内存位置。因此，为共享库生成 PIC 代码是重要的，这样用户代码就不会依赖于符号的绝对内存地址。以下示例说明了如何将三个源文件编译为动态库：![image](img/bm18-9780443222191.jpg)\n\
  \n用户可以使用之前所示静态库所示的相同命令行将你的动态库链接到他们的代码中，即：![image](img/bm19-9780443222191.jpg)\n\n\
  如果你在同一目录下具有相同基础名称的静态库和动态库（例如 `libmyapi.a` 和 `libmyapi.so`），链接器将使用动态库。要倾向于使用静态库而非相同基础名称的动态库，可以使用\
  \ `-static` 链接器选项，或者可以将静态库放在不同的目录，并确保该目录出现在库搜索路径中（使用 `-L` 链接器选项）。\n\n注意，在动态库中，所有代码本质上都被展平到一个对象文件中。这与静态库形成对比，静态库表示为对象的集合，可以根据需要单独复制到可执行文件中（即静态归包中不需要的文件不会被复制到可执行映像中）。结果是，加载动态库将涉及加载该\
  \ `.so` 文件定义的所有代码（Mitchell et al., 2001）。\n\n默认情况下，DSO 中的所有符号都是公开导出的（除非你指定了编译器选项\
  \ `-fvisibility=hidden`）。然而，GNU C++ 编译器支持导出映射的概念，以显式定义动态库中对客户端程序可见的符号集。这是一种简单的 ASCII\
  \ 格式，可以单独列出符号或使用 glob 风格的表达式。例如，以下映射文件 `export.map` 指定只有 `DoSomething()` 函数应该被导出，而所有其他符号都应该是隐藏：![image](img/bm20-9780443222191.jpg)\n\
  \n随后，可以在构建动态库时使用 `--version-script` 链接器选项将此映射文件传递给编译器，如下例所示：![image](img/bm21-9780443222191.jpg)\n\
