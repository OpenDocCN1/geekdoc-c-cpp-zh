  \n![image](img/bm31-9780443222191.jpg)\n\n你可以为这个 API 构建一个动态库，例如 `libplugin.so`。然后下面的代码演示了如何加载该库并调用其\
  \ `.so` 中的 `DoSomething()` 函数：\n\n![image](img/bm32-9780443222191.jpg)\n\n### 在运行时查找动态库\n\
  \n当你运行一个依赖于动态库的可执行文件时，系统会在多个位置搜索该库，通常是 `/lib` 和 `/usr/lib`。如果在这些位置中都找不到 `.so` 文件，可执行文件将无法启动。记得\
  \ `ldd` 命令可以告诉你系统是否找不到任何库。这对于创建依赖你的 API 的可执行程序显然是一个考虑。客户端有三种主要方法可以确保他们构建的可执行文件可以在运行时找到你的库：\n\
  \n1.  API 客户端确保你的库安装在用户机器上的标准库目录之一，例如 `/usr/lib`。这将需要用户执行安装过程并具有 root 权限将文件复制到系统目录。\n\
  2. 设置 `LD_LIBRARY_PATH` 环境变量，用冒号分隔的目录列表增强默认搜索路径。因此，你的客户端可以分发一个运行其应用程序的 shell 脚本，该脚本设置\
  \ `LD_LIBRARY_PATH` 变量为可以找到你动态库的适当目录。\n3. 客户端可以使用 `rpath`（运行路径）链接选项将搜索动态库的首选路径编译到他们的可执行文件中。例如，此编译行将生成一个会在\
  \ `/usr/local/lib` 搜索任何动态库的可执行文件：\n\n## macOS 上的库\n\nmacOS 操作系统基于一个名为 Darwin 的 BSD\
  \ Unix 版本构建的。因此，我之前为 Linux 介绍的许多细节同样适用于 Mac。然而，Darwin 与其他 Unix 平台之间存在一些值得注意的差异。请注意，为了简单，我在这里指的是\
  \ macOS，但我介绍的所有内容同样适用于所有 Apple 操作系统，例如 iOS、iPadOS、watchOS、tvOS 和 visionOS。\n\n###\
  \ 在 macOS 上创建静态库\n\n\n\n在 macOS 上创建静态库的方法与 Linux 相同（即使用 `ar` 或 `libtool`）。然而，在将静态库链接到应用程序时，行为上会有所不同。Apple\
  \ 不建议使用 `-static` 编译器选项来生成所有库依赖都进行静态链接的可执行文件。这是因为 Apple 希望确保应用程序始终能调用其分发的最新系统库。事实上，`gcc`\
  \ 的手册页指出，`-static` “除非所有库（包括 `libgcc.a`）也使用 `-static` 编译，否则在 macOS 上无法工作。由于没有提供\
  \ `libSystem.dylib` 的静态版本，也没有 `crt0.o`，因此该选项对大多数人来说没有用。”本质上，Mac 上的 `-static` 选项是留给构建内核或极少数勇敢的人的。与此情况相关，默认情况下，Mac\
  \ 链接器会扫描库搜索路径中的所有路径以寻找动态库。如果失败，它将再次扫描这些路径以寻找静态库。这意味着你无法通过将静态库放在库搜索路径中较靠前的目录来利用优先链接静态库的技巧。然而，有一个名为\
  \ `-search-paths-first` 的链接器选项，它会导致链接器在每个搜索路径中查找动态库，如果未找到，则在同一目录下查找静态库。此选项使得 Mac\
  \ 链接器的行为在这一方面更像 Linux 链接器。但请注意，当静态库和动态库位于同一目录时，在 Mac 上没有方法可以优先链接到静态库而非动态库。\n\n###\
  \ 在 macOS 上创建动态库\n\n在 macOS 上创建动态库的方法与之前提到的 Linux 指南非常相似。有一个重要的区别，你应该使用 `g++` 的\
  \ `-dynamiclib` 选项来在 Mac 上创建动态库，而不是 `-shared`：\n\n![image](img/bm34-9780443222191.jpg)\n\
  \n[-]\n此外，请注意 `-headerpad_max_install_names` 选项的使用。在 Mac 上构建动态库时，强烈建议使用此标记，我将在稍后解释原因。还需要注意的是，macOS\
  \ 上不可用 `ldd` 命令。相反，你可以使用 `otool` 命令列出可执行文件所依赖的动态库集合，例如：\n\n![image](img/bm35-9780443222191.jpg)\n\
  \n### macOS 框架\n\nmacOS 操作系统还引入了框架（Frameworks）的概念，在一个包内分发编译和链接 API 所需的所有文件。框架本质上是一个以\
  \ `.framework` 结尾的目录，包含动态库、头文件和参考文档等各种资源。它本质上是一个 `NSBundle` 意义上的包（Bundle）。将所有必要的开发文件封装在一个包中，可以使安装和卸载库变得更容易。此外，框架可以在同一个包中包含库的多个版本，以便更容易为旧应用程序维护向后兼容性。下面的目录列表给出了框架包的布局示例，其中\
  \ `->` 符号符号链接：\n\n![image](img/bm36-978044322219121.jpg)\n\nApple 的大部分 API 都是作为框架分发的，包括\
  \ `Cocoa`、`Foundation` 和 `Core Services`。因此，你可能希望在 Mac 上以框架的形式分发你的 API，使其看起来更像系统级库。你可以使用\
  \ Apple 的 `XCode` 开发环境将 API 构建为框架。这可以通过选择 `File > New Project` 菜单并在左侧面板中选择 Framework\
  \ 来实现（图 A.5）。默认情况下，你可以选择让项目使用 `Carbon` 或 `Cocoa` 框架。如果你不需要其中任何一个（即你正在编写纯 C++ 库），可以在\
  \ `XCode` 为你创建项目后简单地删除这些框架。客户端可以通过向 `g++` 或 `ld` 提供 `-framework` 选项来链接到你的框架。他们还可以指定\
  \ `-F` 选项来指定查找你的框架包的目录。\n\n![image](img/bm05-9780443222191.jpg)\n\n图 A.5 使用 Apple\
  \ 的 `XCode` 集成开发环境 (IDE) 创建框架项目。\n\n### 基于文本的 API\n\n当你在 Mac 上安装 `Xcode` 时，你安装了一个版本的\
  \ `clang` 编译器，但你也安装了一个或多个 SDK，这些 SDK 让你的能够针对不同 OS 类型（例如 macOS、iOS、tvOS、watchOS）和不同\
  \ OS 版本的系统库进行编译。你可以在 `Xcode` 应用包中找到所有的 SDK。例如，\n\n![image](img/bm37-9780443222191.jpg)\n\
  \n最初，Apple 为每个 SDK 包含了所有实际的 Mach-O 库二进制文件，例如供代码链接的 `.dylib` 文件。然而，这导致 SDK 体积非常大，如果你为不同的平台和\
  \ OS 版本安装了许多 SDK，体积会进一步叠加。因此，Apple 引入了基于文本的安装 API（Text-based InstallAPI）来解决这个问题。当开启“Supports\
  \ Text-Based InstallAPI” `Xcode` 设置并编译库时，`Xcode` 会为你的库生成一个 `.tbd` 文件。这是一个纯文本 YAML\
  \ 文件，包含了链接代码到库所需的所有信息，而不包含任何实际的可执行代码。这包括库在 OS 分发版中所在的文件系统路径，以及库中所有导出符号的名称。这些 `.tbd`\
  \ 文件可以比实际库文件小得多，通常小出两个数量级，因此 Apple 能够大幅减小其 SDK 分发的大小。此功能可能不是你本人会使用的。它对于 Apple 分发\
  \ OS SDK 更有用。然而，如果你在 SDK 中遇到这些文件并好奇它们是什么，或者在思考为什么在 SDK 中找不到任何 `.dylib` 文件时，了解这些文件是有用的。值得注意的是，在较新版本的苹果操作系统，你将不再在\
  \ `/usr/lib` 中找到大多数系统库。例如，尽管 `libxml2` 的 `.tbd` 文件说库位于 `/usr/lib/libxml2.2.dylib`，但从\
  \ macOS Big Sur 开始该文件已不再存在。原因是 OS 现在带有一个包含所有系统库的内置动态库缓存。因此，在文件系统中检查库的存在将失败。但是，如果你尝试\
  \ `dlopen()` 该库，那么它是可以工作的。\n\n### 运行时查找动态库\n\n\n\n\n\n在运行时查找动态库的 Linux 原则同样适用于 macOS\
  \ 下运行的应用程序，但有几细微不同。首先，用于增强库搜索路径的环境变量被称为 `DYLD_LIBRARY_PATH`（尽管较新版本的 macOS 现在也支持\
  \ `LD_LIBRARY_PATH`）。此外，Apple 只在最近版本的 macOS 中才增加了对 `-rpath` 链接器选项的支持。传统上，你会使用“安装名称”（install\
  \ names）的概念。安装名称是刻在 Mach-O 二进制文件中的路径，用于指定搜索依赖动态库的路径。通过以特殊字符串 `@executable_path`\
  \ 开始安装名称，可以将该路径指定相对于可执行程序的路径。你可以在构建动态库时指定安装名称，但你的客户端也可以使用 `install_name_tool` 实用更改此路径。然而，他们无法指定比\
  \ `.dylib` 中原始路径更长的路径。这就是为什么在 Mac 上构建动态库时，始终建议使用 `-headerpad_max_install_names`\
  \ 选项：以便客户端能够灵活地将库的安装名称更改为他们所需的。以下命令演示了客户端如何更改你的库的安装名称以及更改其可执行文件的安装名称：\n\n![image](img/bm38-9780443222191.jpg)\n\
