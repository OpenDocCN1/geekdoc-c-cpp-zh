  \n# 1：引言\n\n## 摘要\n第一章通过各种示例定义了什么是应用程序接口（API），并描述了 API 在 C++ 中是如何表示的。本章详细探讨了 API\
  \ 开发与标准应用开发之间的区别，并列了 API 在软件开发中的优势，例如产生更健壮的代码、鼓励代码复用以及实现并行开发。文中描述了现代应用程序中 API 的各个层级，并特别引用了一个大型开源客户端/服务器程序。解释了\
  \ API 与软件开发工具包（SDK）之间的关系，以及 API、文件格式和网络协议之间的关系。\n\n### 关键词\n向后兼容；组件；契约；文档；文件格式；头文件；接口；库；网络协议；测试\n\
  \n## 什么是 API？\n应用程序接口（API）为问题提供了抽象，并规定了客户端如何与实现问题解决方案的软件组件交互。组件本身通常以软件库的形式分发，允许在多个应用程序中使用。本质上，API\
  \ 定义了可重用的构建块，允许将模块化的功能整合到终端应用程序中。\n\nAPI 可以为你自己编写，为你组织内的其他工程师编写，也可以为整个开发者社区编写。它可以小到只有一个函数，也可以涉及数百个类、方法、自由函数、数据类型和常量。它的实现可以是专有的也可以是开源的。核心概念是\
  \ API 是一个定义良好的接口，为其他软件提供特定的服务。\n\n现代应用程序通常构建在许多 API 之上，其中一些 API 还可以依赖于进一步的 API。这在\
  \ 图 1.1 中所示，图中展示了一个直接依赖三个库 API 的示例应用程序，其中两个 API 又依赖于这些库。例如，图像查看程序可以使用加载 GIF 图像的\
  \ API，而该 API 本身构建在用于压缩和压缩数据的底层 API 之上。\n\nAPI 开发在软件开发中无处不在。它的目的是为组件的功能提供逻辑接口，同时隐藏任何实现细节。例如，我们加载\
  \ GIF 图像的 API 可能只需提供一个 `LoadImage()` 方法，接受文件名并返回一个二维像素数组。所有的文件格式和数据压缩细节都隐藏在这个简单的接口之后。这一概念在\
  \ 图 1.1 中同样所示，客户端代码通过公共接口（显示为框顶部的黑色部分）访问 API。\n\n### 合同与承包商\n作为一个类比，考虑亲手建造房屋的任务。如果你完全靠自己盖一栋房子，你需要精通建筑、水水、电气线路、木工、石工等许多手艺。你还需要自己执行每项任务，并跟踪项目每个方面最细微的细节，例如你是否有足够的木板做地板，或者你是否有合适的紧固件来匹配螺丝。最后，由于你是项目中唯一的工作人员，你在任何时候都只能执行单项任务，因此完成项目的总时间可能会非常长。\n\
  \n\n\n\n\n![image](img/f01-01-9780443222191.jpg)\n\n图 1.1 一个调用分层应用程序编程接口（APIs）例程的应用程序。每个框代表一个软件库，其中`深色部分`代表该库的公共接口或\
  \ `API`，而`白色部分`代表该 `API` 背后的隐藏实现。\n\n另一种替代策略是聘请专业的承包商来完成关键任务。你可以聘请一位建筑师设计房屋蓝图，聘请一位木工处理所有的木工需求，聘请一位水工为房屋安装水管和污水系统，并聘请一位电工建立电力系统。通过这种方法，你与每位承包商签订合同——告诉他们你想完成的工作并商定价格。然后他们就会为你完成这些工作。如果你足够幸运，也许你还有一个恰好承包商的好朋友，他们会免费为你提供服务。通过这种策略，你就不再需要了解盖房屋各个方面的所有知识，而是可以承担更高层次的监督角色，为你的目标选择最佳承包商，并确保每位独立承包商的工作结合在一起，以实现你对理想家居的愿景。\n\
  \n与 API 的类比可能是显而易见的：你正在建造的房子相当于你想要编写的软件程序，而承包商提供的 API 抽象了你需要执行的每项任务，并隐藏了相关工作的实现细节。你的任务就变成了为你的应用程序选择合适的\
  \ API 并将其集成到你的软件中。拥有提供免费承包服务的技艺朋友的类比，旨在代表使用免费的开源库，而不是需要支付许可费的商业库。这种类比甚至可以扩展为某些承包商雇佣了分包商，这对应于某些\
  \ API 依赖其他 API 来执行其任务。\n\n![image](img/f01-02-9780443222191.jpg)\n\n图 1.2 使用承包商执行专门任务来建造房屋。\n\
  \n承包商的类比在面向对象编程中非常常见。该领域的早先实践者谈论过对象如何为其提供的服务或行为定义了一个绑定合同。然后，当被客户端程序请求时，对象就会实现这些服务，并可能在后台将部分工作外包给其他对象（Snyder,\
  \ 1986; Meyer, 1987) (见图 1.2)\n\n### C++ 中的 API\n\n严格来说，API 仅仅是关于如何与组件交互的描述。也就是说，它为组件提供了一种抽象和功能规范。事实上，许多软件工程师更喜欢将\
  \ API 扩展为抽象编程接口（abstract programming interface），而不是应用程序编程接口（application programming\
  \ interface）。\n\n在 C++ 中，这传统上体现为一个或多个头文件（`.h`）加上相应的文档文件。然而，从 C++20 开始，我们还拥有模块（modules）的概念作为使用头文件的替代方案。给定\
  \ API 的实现通常以库文件的形式表示，该文件可以链接到用户应用程序中。这可以是静态库，例如 Windows 上的 `.lib` 文件或 macOS 和 Linux\
  \ 上的 `.a`，也可以动态库，例如 Windows 上的 `.dll`、macOS 上的 `.dylib` 或 Linux 上的 `.so`。\n\n因此，一个\
  \ C++ API 通常包含以下元素：\n\n1.  **头文件/模块**：`.h` 头文件或模块接口单元的集合，它们定义了接口并允许客户端代码针对该接口进行编译。开源\
  \ API 还包括 API 实现的源代码（`.cpp` 文件）。\n2.  **库**：一个或多个静态或动态库文件，它们提供 API 的实现（例如 `.a`、`.lib`、`.dll`、`.dylib`\
  \ 等文件）。客户端可以将他们的代码链接到这些库文件，以为其应用程序添加功能。（我将在本章稍后详细介绍库、框架和软件开发工具包 [SDK] 相关术语。）\n3.\
  \  **文档**：描述如何使用 API 的概览信息，通常包括为 API 中所有类和函数自动生成的文档。\n\n作为一个知名 API 的示例，微软的 Windows\
  \ API（通常称为 Win32 API）是一系列 C 函数、数据类型和常量，它们使程序员能够编写运行在 Windows 平台上的应用程序。这包含了文件处理、进程和线程管理、创建图形用户界面、网络通信等函数。\n\
  \nWin32 API 是纯 C API 而非 C++ API 的示例。虽然你可以在 C++ 程序中直接使用 C API，但一个特定 C++ API 的良好例子是\
  \ C++ 标准库。它包含一组容器类、用于遍历元素的迭代器以及作用于容器的各种算法 (Josuttis, 1999)）。例如，该算法集包含了 `std::search()`、`std::reverse()`、`std::sort()`\
  \ 和 `std::set_intersection()`。\n\n### API 设计有何不同？\n\n严格来说，接口是开发者编写的最重要的代码。这是因为接口中的问题修复成本比相关的实现代码问题高得多。因此，共享\
  \ API 的开发过程比标准的应用程序或图形用户界面（GUI）开发需要更多关注。当然两者都涉及最佳实践；但在 API 开发的情况下，这些实践对其成功至关重要。具体来说，API\
  \ 开发有一些关键区别因素：\n\n1.  API 是为开发者设计的接口，就像 GUI 是为终端用户设计的接口一样。事实上，有人说 API 是面向程序员的用户界面\
  \ (Arnold, 2005)。正如此，你的 API 可能会被全球成千上万的开发者使用，并且会以你从未想到的方式被使用 (Tulach, 2008)。你必须在设计中预见到这一点。一个良好的\
  \ API 可以成为组织最大的资产。相反，一个糟糕的 API 可能会导致支持噩梦，甚至让你的用户转向竞争对手，就像带有 Bug 或难以使用的 GUI 可能会强制终端用户切换到另一个应用程序。\n\
  2.  多个应用程序可以共享同一个 API。在图 1.1 中，我展示了一个应用程序可以由多个 API 组成。然而，这些 API 中的任何一个都可以被其他应用程序重用。这意味着虽然特定应用程序代码中的问题只会影响该一个应用程序，但\
  \ API 中的错误会影响所有依赖于该功能的应用程序。\n\n\n\n\n\n# 3. 向后兼容性\n\n当你更改 `API` 时，必须努力保持向后兼容性。如果你对接口进行了不兼容的更改，客户端的代码可能会无法编译，更糟糕的是，他们的代码可以编译但行为不同，或者间歇性崩溃。想象一下，如果标准\
  \ C 库中 `printf()` 函数的签名在不同的编译器或平台上不同，将会产生多大的混乱和意外。简单的“Hello World”程序可能看起来不再那么简单了：\n\
  \n![image](img/u01-01-9780443222191.jpg)\n\n这看起来可能像是一个刻意的例子，但实际上情况并没有那么极端。看一看你编译器附带的标准头文件，你会发现其中的声明同样复杂且晦涩，甚至可能更糟。\n\
  \n### 关键最佳实践\n\n1.  由于向后兼容性的要求，建立一套变更控制流程至关重要。在正常开发过程中，许多开发者可能会为 `API` 修复漏洞或添加新功能。其中一些可能是并不完全理解良好\
  \ API 设计各个方面的初级工程师。因此，在发布新版本的 `API` 之前进行 `API review` 非常重要。这涉及一名或多名高级工程师检查对接口的所有更改是否可以接受、是否具有合理理由，以及是否以最佳方式实现以维护向后兼容性。许多开源\
  \ `APIs` 还强制执行变更请求流程，在更改添加到源代码之前必须获得批准。\n\n2.  `APIs` 往往会存在很长时间。由于需要规划、设计、版本控制和审查等额外开销，生产一个良好的\
  \ `API` 可能有高昂的前期成本。然而，如果做得恰当，长期成本可以大幅降低，因为你有能力在不打扰客户的情况下对软件进行激进的更改和改进。也就是说，由于 `API`\
  \ 为你提供了灵活性，你的开发速度可以更快。\n\n3.  在编写 `API` 时，对良好文档的需求是关重要的，特别是当你没有提供实现的源代码时。用户可以通过查看你的头文件来了解如何使用它，但这并没有定义\
  \ `API` 的行为，例如可接受的输入值或错误情况。因此，编写良好、一致且详尽的文档对于任何良好的 `API` 都是必不可少的。\n\n4.  自动化测试的需求同样非常高。当然，你应该始终测试你的代码，但当你编写\
  \ `API` 时，你可能有成百上千的其他开发者以及数千名用户依赖你代码的正确性。如果你正在对 `API` 的实现进行重大更改，只要有一套完整的回归测试套件来验证\
  \ `API` 行为没有改变，你就有信心不会破坏客户端的程序。\n\n编写良好的 `APIs` 是困难的。虽然必要的技能基于通用的软件设计原则，但它们还需要额外的知识和开发流程来解决前面列的问题。然而，`API\
  \ design` 的原则和技术很少教授工程师。通常，这些技能只能通过经验获得——通过犯错并经验性地学习哪些有效、哪些无效 (Henning, 2009)。这本书试图纠正这种局面，将多年软件工程经验中演化出的工业级、面向未来的\
  \ `API design` 策略提炼为一种综合、实用且易于理解的格式。\n\n## 为什么要使用 APIs？\n\n关于为什么你应该在自己的软件项目中关注 `APIs`\
  \ 的问题可以从两个角度解释：\n\n1.  为什么你应该设计并编写自己的 `APIs`？或者\n2.  为什么你应该在应用程序中使用来自其他提供者的 `APIs`？\n\
  \n我将在接下来的章节中通过这两个角度来解决，介绍在项目中使用 `APIs` 的各种好处。\n\n### 更健壮的代码\n\n如果你正在编写一个供其他开发者使用的模块，无论是为了组织内部的工程师还是为了你库的外部客户，那么为他们创建一个\
  \ `API` 来访问你的功能将是一项明智的投资。这样做将为你带来以下收益：\n\n- **隐藏实现。** 通过隐藏模块的实现细节，你获得了在未来日期更改实现的灵活性，而不会给你的用户带来动荡。如果不这样做，你要么会在对代码的更新方面限制自己，要么会迫使用户重写代码以采用你库的新版本。如果你让客户更新到软件新版本过于困难，那么他们极可能完全不升级，或者去其他地方寻找维护起来不会那么麻烦的\
  \ `API`。因此，良好的 `API design` 可以显著影响你业务或项目的成功。\n\n- **增加寿命。** 随着时间的推移，暴露实现细节的系统往往会退化为意大利面代码，系统的每个部分都依赖于其他部分的内部细节。结果是系统变得脆弱、僵硬、固定且粘稠\
  \ (Martin, 2000)。这通常导致组织必须花费大量精力将代码改进到更好的设计，或者简单地从头重写。通过投资良好的 `API design` 并为维护一致的设计支付投入成本，你的软件可以生存更久且维护成本更低。\n\
  \n- **促进模块化。** `API` 通常是为了特定的任务或用例而设计的。因此，`APIs` 倾向于定义具有一致焦点的功能分组。在 `APIs` 之上开发应用程序促进了松耦合和模块化的架构，一个模块的行为不依赖于另一个模块的内部细节。如果你在大公司工作，如果你在一个这样一个模块化\
  \ `API`，这将为你带来直接利益。因为可以更清楚地判断 Bug 是由于你拥有的代码还是其他团队负责。这样你可以花更少的时间处理与你代码无关的 Bug。\n\n\
  - **减少代码重复。** 代码重复是软件工程的罪大罪之一，应尽可能消除。通过将你代码的所有逻辑封装在所有客户端都必须使用的严格接口之后，你把行为集中在一个地方。这样做意味着你只需要更新一个地方就可以更改所有客户端的\
  \ `API` 行为。这有助于消除整个代码库中实现代码的重复。事实上，许多 `APIs` 是在发现重复代码并决定将其整合到单一接口后创建的。这是一个好事。\n\n\
  - **消除硬编码假设。** 许多程序可能包含在整个代码中复制的硬编码值，例如每次将数据写入日志文件时使用文件名 `myprogram.log`。相反，可以使用\
  \ `APIs` 来提供这些信息，而无需在代码库中复制这些常量。例如，可以使用 `GetLogFilename()` `API` 调用来替换硬编码的 `myprogram.log`\
  \ 字符串。\n\n\n\n\n\n- **更容易更改实现。** 如果你已经将模块的所有实现细节都隐藏在其公共接口之后，那么你就可以更改这些实现细节，而不影响任何依赖于\
  \ API 的代码。例如，你可能决定更改文件解析程序，使用 `std::string` 容器来代替分配、释放和重新分配你自己的 `char *` 缓冲区。\n\n\
  - **更容易进行优化。** 同样，当你成功隐藏了实现细节后，你可以在不需要更改客户端代码的情况下优化你的 API 性能。例如，你可以为一个执行某些计算密集型任务的方法添加缓存解决方案。这是可能的，因为所有读取和写入你底层数据的尝试都是通过你的\
  \ API 进行的，因此要确定何时必须失效缓存结果并重新计算新值将变得容易得多。\n\n### 代码复用\n\n代码复用是使用现有的软件来构建新的软件的过程。它是现代软件开发中的“圣杯”之一。API\
  \ 提供了一种能够实现代码复用的机制。\n\n在软件开发的早期，公司通常必须为他们生产的任何应用程序编写所有代码。如果程序需要读取 GIF 图像或解析文本文件，公司必须在内部编写所有这些代码。如今，随着优秀的商业和开源库的激增，简单地复用他人编写的代码要有意义得多。例如，今天有各种开源图像读取\
  \ API 和文件格式解析 API 可以供你下载并在你的应用程序中使用。这些库经过了全球许多开发人员的精炼和调试，并在许多其他程序中经过了实战。\n\n本质上，通过使用不同的组件，软件开发已变得更加模块化，这些组件构成了应用程序的构建块，并通过它们发布的\
  \ API 进行相互通信。这种方法的好处是，你不需要理解每个软件组件的每一个细节，就像在早期的建筑类比中，你可以将许多细节委托给专业承包商一样。这可以转化为更快的开发周期，因为你可以复用现有代码，也可以解耦各个组件的进度。它还允许你专注于核心业务逻辑，而不是花时间重造轮子。\n\
  \n然而，实现代码复用的困难之一在于，你通常必须得出一个比你最初预想更具通用性的接口。这是因为其他客户端可能有额外的期望或要求。因此，有效的代码复用取决于对你软件客户端的深度理解，并设计一个将他们的集体利益与你自己的利益相结合的系统。\n\
  \n顺带一提，软件开发策略这种转变的一个潜在解释是全球化力量的结果（Friedman, 2007; Wolf, 2004)）。事实上，互联网、标准网络协议和 Web\
  \ 技术的融合创造了软件竞争环境的公平。这使得世界各地的公司和个人能够创建、贡献并竞争大型复杂的软件项目。这种形式的全球化促进了一种环境，世界上任何地方的公司和开发者都可以通过开发软件子系统生存。世界其他地区的组织可以通过组合和增强这些构建块来构建终端应用程序，以解决特定问题。就这里的关注点而言，API\
  \ 提供了实现现代软件开发全球化和组件化的机制。\n\n### 并行开发\n\n即使你正在编写内部软件，你的同事也很可能需要编写调用你代码。如果你使用良好的 API\
  \ 设计技术，你可以简化他们的生活，并延伸到你自己的（因为你不需要回答 way 关于你的代码如何工作或如何使用它的问题）。如果多个开发者正在并行工作相互依赖的代码，这一点会变得更加重要。\n\
  \n例如，假设你正在编写一种字符串加密算法，另一个开发者想用它来将数据写入配置文件。一种方法是让另一个开发者等待你完成工作。然后他们可以在他们的文件写入模块中使用它。然而，一种更有效的时间利用方式是你们两个尽早见面并约定一个合适的\
  \ API。然后你就可以部署该 API，并带有占位符功能，你的同事可以立即开始调用它，例如：\n\n![image](img/u01-02-9780443222191.jpg)\n\
  \n然后你可以为这些函数提供一个简单的实现，以便至少该模块可以编译和链接。例如，相关的 `.cpp` 文件可能看起来像这样：\n\n![image](img/u01-03-9780443222191.jpg)\n\
  \n通过这种方式，你的同事可以使用此 API 并继续工作，而不会被你的进度所阻碍。目前，你的 API 实际上不会加密任何字符串，但那只是一个微小的实现细节！重点是，你们双方达成了一个稳定的接口——一份契约，并且它的行为是恰当的，例如\
  \ `Decrypt(Encypt(\"Hello\")) == \"Hello\"`。当你完成工作并用正确的实现更新 `.cpp` 文件时，你同事的代码将直接运行，无需他或她进行任何进一步更改。\n\
  \n现实情况下，可能会出现你在开始编写代码之前没有预料到的接口问题，你可能需要对 API 进行迭代几次才能使其正确。然而，在大多数情况下，你们两个可以以最少的阻碍并行工作。\n\
  \n这种方法还鼓励了测试驱动（或测试优先）的开发。通过在早期阶段模拟 API，你可以编写单元测试来验证所需的功能，并持续运行这些测试，以确保你没有违反与同事的契约。\n\
  \n将这一过程扩大到组织层面，你的项目可以拥有不同的团队，这些团队可能相互远程，甚至按照不同的时间表工作。但通过提前定义每个团队的依赖关系并创建用于模拟这些关系的\
  \ API，每个团队都可以独立工作，并且对其他团队如何在 API 之后实现其工作的了解最少。这种资源的高效利用以及相应的冗余通信的减少，可以为组织显著降低整体成本。\n\
  \n## 何时应该避免使用 API？\n\n设计和实现 API 通常比编写普通的应用程序代码需要更多工作。这是因为 API 的目的是为其他开发者提供一个健壮且稳定的接口。因此，对于\
  \ API 而言，在质量、规划、文档、测试、支持和维护方面的水平远高于仅供单个应用程序内部使用的软件。\n\n因此，如果你正在编写一个不需要其他客户端与其通信的内部模块，那么为你的模块创建和支持稳定的公共接口的额外开销可能并不值得投入。然而，这并不是编写粗糙代码的理由。从长远来看，花费额外时间遵循\
  \ API 设计原则不会是徒劳的。\n\n\n\n\n\n从反面来看，考虑你是一个软件开发者，想要在应用程序中使用第三方 API。前一节讨论了你可能可能想在软件中复用外部\
  \ API 的几个原因。然而，在某些情况下，你可能希望避免使用特定的 API 并付出自己实现代码的成本，或者寻找替代方案。例如：\n\n*   **许可证限制。**\
  \ 一个 API 可能提供了你所需的所有功能，但其许可证限制对你的需求来说可能是不可接受的。例如，如果你想使用一个根据 GNU 通用公共许可证 (GPL) 分发的开源包，那么你就被将任何衍生作品也根据\
  \ GPL 发布。这意味着在你的程序中使用该包将要求你发布应用程序的所有源代码，这一限制对于商业应用来说可能是不可接受的。其他许可证（如 GNU Lesser\
  \ GPL）则更为宽松，并且在软件库中更为常见。另一个许可方面是，商业 API 的费用对你的项目来说可能太高，或者许可条款过于严格，例如要求按每个开发人员甚至每个用户收取许可费。\n\
  *   **功能不匹配。** 一个 API 似乎可以解决你面临的问题，但其实现方式可能不符合你应用程序的约束或功能需求。例如，也许你正在开发一个图像处理工具，并想提供傅里叶变换能力。目前有很多快速傅里叶变换\
  \ (FFT) 的实现，但其中许多是 1D 算法，而由于你处理的是 2D 图像数据，你需要 2D FFT。此外，许多 2D FFT 算法仅适用于维度为 2 的幂的数据集（例如\
  \ 256×256 或 512×512 像素）。此外，也许你找到的 API 在你必须支持的平台上无法运行，或者它不符合你为应用程序指定的性能标准。\n*   **缺乏源代码。**\
  \ 尽管有很多开源 API，但有时最适合你的 API 可能是闭源提供的。也就是说，你只能获得接口的头文件，但底层的 C++ 源代码并没有随库一起分发。这有几个重要的影响。其中，如果你在库中遇到\
  \ bug，你无法检查源代码来理解可能出了什么问题。阅读是跟踪 bug 并可能发现问题解决办法的一种宝贵技术。\n\n此外，由于无法访问 API 的源代码，你失去了修改源码以修复\
  \ bug 的能力。这意味着你的软件项目进度可能会受到你正在使用的第三方 API 中意外问题的影响，并受到等待该 API 所有者处理你的 bug 报告并发布修复补丁的时间的影响。\n\
  *   **缺乏文档。** 一个 API 似乎满足你应用程序中的某些需求，但如果该 API 的文档糟糕或不存在，那么你可能决定在其他地方寻找解决方案。也许如何使用该\
  \ API 并不明显，也许你无法确定 API 在某些情况下的行为，或者你根本不信任一个没有花时间解释其代码如何使用的工程师的工作。\n\n虽然我在这里试图扮演反方观点，并提出你不需要担心\
  \ API 设计的情况，但在我软件工程师的职业生涯中，我逐渐意识到万物都是 API 设计。例如，在一个拥有大量内部代码的大型组织中，人们很容易把一切都认为仅仅是“代码”，因为很容易更改你想要的任何内容。但并不是所有的代码更改都应该被等对待。如果你没有建立强大的\
  \ API 边界和流程，那么将你的软件视为一个巨大的代码球将迅速陷入混乱。正如 Alex Martelli 所说，最糟糕的 API 就是根本没有 API（Martelli,\
  \ 2011)）。如果你从书中中学到一点，那应该是将每一个软件问题首要且根本地视为一个 API 设计问题。\n\n## API 示例\n\nAPI 无处不在。即使你只编程了很短时间，你可能已经写过代码来使用过一两个\
  \ API，也许你还自己写过一个。\n\n### API 的层级\n\nAPI 可以是任何规模，从单个函数到大型类集合。它还可以提供任何架构层的功能访问，从底层的操作系统\
  \ (OS) 调用到高层的图形用户界面 (GUI) 工具包。列表列出了各种常见的 API，其中许多你可能已经听过了，以便让你直观感受到 API 开发是多么普及：\n\
  \n*   **OS API。** 每个操作系统都必须提供一组标准 API，以允许程序访问操作系统级的服务。例如，POSIX API 定义了如 `fork()`、`getpid()`\
  \ 和 `kill()` 等函数用于管理 UNIX 风格的进程，而微软的 Win32 API 包含了如 `CreateProcess()`、`GetCurrentProcess()`\
  \ 和 `TerminateProcess()` 等函数用于管理 Windows 进程。这些是稳定的底层 API，永远不应该改变；否则许多程序将会崩溃！\n*\
  \   **语言 API。** C 语言由 C 标准库支持，实现为 `libc` 库和相关的 man 页面。它包含了熟悉的函数，如 `printf()`、`scanf()`\
  \ 和 `fopen()`。C++ 语言也提供了 C++ 标准库，它为各种容器类（例如 `std::string`、`std::vector`、`std::set`\
  \ 和 `std::map`）、迭代器（例如 `std::vector<double>::iterator`）和通用算法（例如 `std::sort`、`std::for_each`\
  \ 和 `std::set_union`）提供了 API。例如，下面的代码段使用 C++ 标准库 API 遍历 vector 中的所有元素并将其打印出来（尽管在现代代码中，在基于范围的\
  \ for 中使用 `auto` 会更简单）：\n\n![image](img/u01-04-9780443222191.jpg)\n*   **图像 API。**\
  \ 开发者需要自己编写图像读取和写入程序的的日子已经过去了。现在有广泛的开源包供你下载并在自己的程序中使用。例如，有一个流行的 `libjpeg` 库，它提供了\
  \ JPEG/JFIF 解码器和编码器的实现。有大量的 `libtiff` 库用于读取和写入各种版本的 TIFF 文件。还有用于处理 PNG 格式图像的 `libpng`\
  \ 库。所有库都定义了 API，让你编写读取和写入图像格式的代码，而无需了解底层文件格式。例如，下面的代码段使用 `libtiff` API 查找 TIFF 图像的尺寸：\n\
  \n![image](img/u01-05-9780443222191.jpg)\n\n\n\n\n\n### 3D 图形 API\n\n两个经典的实时 3D\
  \ 图形 API 是 `OpenGL` 和 `DirectX`。它们允许你通过小型原语（如三角形或多边形）来定义 3D 对象；指定这些原型的表面属性，如颜色、法线和纹理；并定义环境条件，如光照、雾化和裁剪平面。得益于这些标准\
  \ API，游戏开发者可以编写出可以在许多不同的新旧显卡上均运行的 3D 游戏。这是因为每个显卡制造商都提供了驱动程序，这些程序提供了 `OpenGL` 或 `DirectX`\
  \ API 背后的实现细节。在这些 API 广泛使用之前，开发者必须为特定的图形硬件编写 3D 应用程序，而该程序可能无法在具有不同图形硬件的机器上运行。这些\
  \ API 还允许使用许多高级别的场景图 API，例如 `OpenSceneGraph`、`OpenSG` 和 `OGRE`。以下代码段展示了使用 `OpenGL`\
  \ API 渲染一个每个顶点具有不同颜色的三角形的经典示例：\n\n![image](img/u01-06-9780443222191.jpg)\n\n###\
  \ GUI API\n\n任何想要打开自己窗口的应用程序都需要使用 GUI 工具包。这是一个提供了创建窗口、按钮、文本字段、对话框、图标、菜单等能力的 API。该\
  \ API 通常还会提供一种事件模型，以允许捕获鼠标和键盘事件。一些流行的 C/C++ GUI API 包括 `wxWidgets` 库、`Qt Company`\
  \ 的 `Qt API`、`GTK+` 和 `X/Motif`。过去，如果一家公司想在多个平台（如 Windows 和 Mac）上发布应用程序，它就必须为每个平台使用不同的\
  \ GUI API 重写用户界面代码，或者必须开发自己的内部跨平台 GUI 工具包。然而，如今大多数现代 GUI 工具包都支持包括 Windows、Mac 和\
  \ Linux 在内的多个平台，这使得编写跨平台应用程序变得简单得多。作为现代跨平台 GUI API 的示例，以下完整程序显示了一个弹出一个带有“Hello World”按钮窗口的最小化\
  \ Qt 程序：\n\n![image](img/u01-07-9780443222191.jpg)\n\n当然，这个列表只是现有所有可能 API 的简短侧面。你还会发现可以让你通过网络访问数据、解析和生成\
  \ XML 或 YAML 文件、帮助你编写多线程程序或解决复杂数学问题的 API。该列表的意义仅仅是为了展示了为了帮助你构建应用程序而开发的 API 的广度和深度，并让你对基于这些\
  \ API 的代码看起来有一个初步了解。\n\n### 现实生活示例\n\n之前的 API 示例列表特意按架构层级排列，以展示你在构建应用程序时可能会使用的 API\
  \ 范围。在构建大型软件产品时，你经常会使用来自多个架构层的 API。例如，图 1.3 展示了 Linden Lab 开发的 Second Life Viewer\
  \ 的示例架构图。这是一个大型开源程序，允许用户在在线 3D 虚拟世界中相互交互，并能够在用户之间进行语音聊天和文本消息。该图演示了 API 在大型 C++ 软件项目中的用法和分层。\n\
  \n![image](img/f01-03-9780443222191.jpg)\n\n图 1.3 Second life viewer 的架构图。*API*，应用程序编程接口；*APR*，Apache\
  \ 可移植运行时；*OS*，操作系统。\n\n值得注意的是内部 API 层，我指的是公司为特定产品或系列产品在内部开发的模块集。虽尽管 图 1.3 为了简单起见仅将这些显示为单层，但内部\
  \ API 集合将形成额外的堆叠层，从提供内部字符串、字典、文件 I/O、线程例程等的基础级程序，到提供应用程序核心业务逻辑的 API，一直到管理应用程序用户界面的自定义\
  \ GUI API。\n\n显然，图 1.3 并没有提供该应用程序使用的所有 API 的详尽列表。它只是展示了架构每一层的几个示例。然而，表 1.1 展示了应用程序的第三方依赖集。\n\
  \n### 库、框架和软件开发包\n\n我在在本章前面的部分简要地介绍了“库”（library）这一术语。在这里我将详细介绍库，并讨论框架（framework）和\
  \ SDK 等相关术语。\n\n软件库是用于一个或多个架构的数据和编译代码的集合。它是客户端链接到程序中的内容。常见的库类型包括静态库（例如 `.a` 或 `.lib`），其库代码在编译时直接链接到客户端代码中；以及动态库（例如\
  \ `.so`、`.dll` 或 `.dylib`），其库代码在运行时加载并链接到客户端代码中。大多数操作系统都有一个动态搜索路径来影响它们在运行时查找这些文件，编译器可以在编译后的代码中嵌入提示，说明在何处寻找动态库。我在附录\
  \ A 的“库”章节中涵盖了这些细节。\n\n表 1.1 second life viewer 使用的和闭源应用程序接口。\n\n| API | 描述 |\n\
  | --- | --- |\n| APR | Apache 可移植运行时 |\n| Boost | 可移植 C++ 源库集 |\n| c-ares | 异步 DNS\
  \ 解析库 |\n| cURL | 客户端请求库 |\n| Expat | 流式 XML 解析器 |\n| FMOD | 商业音频引擎和 mp3 流解码器 |\n\
  | FreeGLUT | OpenGL 工具包 (GLUT) 的开源版本 |\n| FreeType | 字体栅化引擎。 |\n| glh_linear | C++\
  \ OpenGL 辅助库 |\n| Jpeglib | JPEG 解码库 |\n| KDU | 商业 Kakadu (KDU) JPEG-2000 解码库 |\n\
  | Libpng | PNG 图像库 |\n| Llqtwebkit | Qt 的嵌入式 WebKit 浏览器 |\n| Ogg Vorbis | 压缩音频格式库\
  \ |\n| OpenGL | 3D 图形渲染引擎 |\n| Openjpeg | 开源 JPEG-2000 库，KDU 的替代品 |\n| OpenSSL |\
  \ 安全套接层 (SSL) 库 |\n| Quicktime | 播放视频片段的库 |\n| Vivox | 商业语音聊天库 |\n| Xmlrpc-epi |\
  \ XML-RPC 协议库 |\n| Zlib | 无损数据压缩库 |\n\n你可以选择仅以二进制库文件和公共头文件分发软件，也可以选择采用开源模型，让客户端直接从你的源代码构建库文件。\n\
  \n\n\n\n\n库文件通常会伴有一组头文件（`.h`），这些文件描述了你 API 的元素（即构成你接口的类、函数、模板、枚举、命名空间等）。客户端在针对你的接口编译其代码时，需要这些头文件。同样值得注意的是，C++20\
  \ 引入了模块（modules）概念，作为使用头文件的替代方案，我将在“C++ 修订”章节中详细介绍这一内容。总而言之，一个库及其相关的头文件或模块通常被称为\
  \ `SDK`。一个 `SDK` 还可能包含其他帮助你使用 API 的资源，例如文档、示例源代码和支持工具。\n\n例如，Apple 发布了各种 iOS API，用于开发在\
  \ iPhone、iPod Touch 和 iPad 设备上运行的应用程序。示例包括用于用户界面的 `UIKit` API、用于在你的应用程序中嵌入 浏览器功能的\
  \ `WebKit` API，以及用于音频服务的 `Core Audio` API。Apple 还提供了 `iOS SDK`，这是一个可下载的安装程序，包含了实现各种\
  \ iOS API 的头文件和库。这些是你在编译并链接到程序中的文件，以便你的程序能够访问 API 的底层功能。`iOS SDK` 包含了 API 文档、示例代码、适用于\
  \ Apple 集开发环境 `XCode` 的各种模板，以及让你能够在桌面式计算机上运行 iPhone 应用的 `iPhone Simulator`。\n\n\
  `framework`（框架）一词可以有几种解释。在 Apple 平台上，有一种 `.framework` 资源类型，它本质上是一个包含不同版本的库及其相关头文件的包。然而，该词也可以意味着一个更大的\
  \ API 集合。例如，`Qt Framework` 由许多独立的模块组成，为不同的任务提供不同的 API。此外，许多工程师认同一种定义：库和框架之间的关键区别在于框架使用了“控制反转”（inversion\
  \ of control）。这意味着框架具有某些内置行为，你可以向框架注册代码，但由框架来决定何时调用你的代码。这的一个很好的例子是 UI 框架，其中框架拥有主事件循环，但你可以注册函数和类来处理如按钮点击等特定事件。换句话说，库是你可以从自己的代码中调用的功能集合，而框架是一个会调用你代码的功能集合。\n\
  \n## 文件格式与网络协议\n\n计算机应用程序中常用的还有其他形式的通信“合同”。最广为人知的是文件格式。这是一种使用数据已知布局将内存中的数据保存到磁盘文件上的方法。例如，`JPEG\
  \ 文件交换格式`（`JFIF`）是一种用于交换 JPEG 编码图像的文件格式，通常带有 `.jpg` 或 `.jpeg` 扩展名。`JFIF` 文件头的格式如表\
  \ 1.2）。为了使其工作，客户端和服务器必须对跨网络传输的数据格式达成一致。这被称为客户端/服务器协议或行协议。如果客户端发送的数据流不符合此协议，则服务器将无法理解该消息。因此，客户端/服务器协议的规范必须经过良好的定义，且客户端和服务器都符合该规范是至关重要的。\n\
  \n表 1.2\n\nJPEG 文件交换格式头规范。\n\n| 字段 | 字节大小 | 描述 |\n| --- | --- | --- |\n| `APP0 marker`\
  \ | 2 | 始终为 `0xFFE0` |\n| `Length` | 2 | 排除 `APP0 marker` 外的段长度 |\n| `Identifier`\
  \ | 5 | 始终为 `0x4A46494600` (`JFIF\\0`) |\n| `Version` | 2 | `0x0102` |\n| `Density\
  \ units` | 1 | 像素密度字段的单位，`0`=无单位 |\n| `X density` | 2 | 整数水平像素密度 |\n| `Y density`\
  \ | 2 | 整数垂直像素密度 |\n| `Thumbnail width (w)` | 1 | 嵌入缩略图的水平尺寸 |\n| `Thumbnail height\
  \ (h)` | 1 | 嵌入缩略图的垂直尺寸 |\n| `Thumbnail data` | `3×w×h` | 未压缩的 24 位 RGB 栅格数据 |\n\
  \n由于这两种情况在概念上与 API 相似，因为它们为信息交换了标准的接口或规范。此外，对规范的任何更改都必须考虑对现有客户端的影响。尽管有这种相似性，文件格式和行协议实际上并不是\
  \ API，因为它们不是链接到你程序中的编程接口。然而，一个经验法则是：每当你有一个文件格式或客户端/服务器协议时，都应该对应一个 API 来管理它。\n\n\
  例如，如果你为应用程序的数据指定了一种文件格式，你也应该编写一个 API 来读写该格式的文件。一方面，这是一种良好的习惯，可以避免文件格式的知识分散在整个应用程序中。更重要的是，拥有\
  \ API 允许你在未来更改文件格式，而无需重写任何代码。最后，如果你最终拥有多个版本的文件格式，那么你的 API 可以抽象这种复杂性，使其能够读取和写入任何版本的数据，或者识别出格式是用新版本的\
  \ API 写入的并采取相应措施。本质上，磁盘数据的实际格式变成了应用程序无需关心的隐藏实现细节。我将在“数据驱动 API”章节中进一步讨论这一点。\n\n这一建议同样适用于客户端/服务器应用程序，其中通用协议以及管理该协议的通用\
  \ API 可以允许客户端和服务器团队独立工作。例如，你可能最初使用 `用户数据报协议`（UDP）作为系统部分的传输层，但后来决定切换到 `传输控制协议`（TCP）（这在\
  \ Second Life 代码库中确实发生了）。如果所有的网络访问已经抽象在适当的 API 之后，这种重大的实现变更对系统的影响微乎其微。\n\n## 本本书\n\
  \n现在我已经涵盖了关于 API 的基础知识以及 API 开发的优缺点，我将深入细节，例如如何设计良好的 API、如何在 C++ 中高效地实现它们，以及如何在不破坏后兼容的情况下进行版本控制。本书的章节安排大致遵循\
  \ API 的标准演进过程，从初始设计到实现、版本控制、文档编写和测试。\n\n第 2 章: *特性*\n\n\n\n\n\n*   我以一个回答“什么是良好的\
  \ API？”的章节作为正文的开端。这一章将介绍你在设计 API 时应该注意的广泛特性，例如信息隐藏、最小完性和松耦合。正如我在全书中所做的那样，我将通过许多\
  \ `C++` 源代码示例来阐述这些概念，展示它们如何与你的项目相关。\n\n第 3 章: *模式*\n\n*   接下来的几章将解决“如何设计一个良好的 API？”这个问题。因此，第\
  \ 3 章 查看了一些对 API 设计特别有帮助的特定设计模式和用法。这些包括 `pimpl` 句法、`Singleton`（单例）、`Factory Method`（工厂方法）、`Proxy`（代理）、`Adapter`（适配器）、`Façade`（外观）和\
  \ `Observer`（观察者）。\n\n第 4 章: *设计*\n\n*   继续讨论如何设计良好的 API 的话题，第 4 章 讨论了功能性需求收集和用例建模，以驱动清晰且易用接口的设计，以及一些面向对象分析和面向对象设计的技术。本章讨论了大型软件项目面临的许多问题。这些观察源于真实经验，并为进行大规模\
  \ API 开发时出现的问题提供了见解。\n\n第 5 章: *风格*\n\n*   接下来的几章重点关注如何使用 `C++` 创建高质量的 API。这是一个深入且复杂的话题，当然也是本书的特定重点。因此，我首先描述了你可以在项目中采用的各种\
  \ `C` 和 `C++` API 风格，例如扁平化的 `C` API、面向对象的 API、基于模板的 API 和数据驱动的 API。\n\n第 6 章: *C++\
  \ 使用*\n\n*   接下来，我讨论了影响良好 API 设计的各种核心 `C++` 语言特性。这包括许多重要问题，例如良好的构造函数和运算符风格、命名空间、指针与引用参数、`class\
  \ friends` 的使用，以及如何在动态库中导出符号。这些是你可以适用于任何版本 `C++` 标准的最佳实践。\n\n第 7 章: *C++ 修订*\n\n\
  *   自最初的 `C++98` ISO 标准发布以来，该标准经历了多次修订，包括 `C++03`、`C++11`、`C++14`、`C++17`、`C++20`\
  \ 和 `C++23`。这些修订中的大部分都引入了会影响 API 设计的新功能。本章逐一关注这些修订版本，并识别出你自己的项目中利用的 API 特性。\n\n\
  第 8 章: *性能*\n\n*   在本章中，我分析了 API 中的性能问题，并向你展示如何在 `C++` 中构建高性能的 API。这涉及到 `const`\
  \ 引用、前向声明、数据成员聚类和内联的使用。我还介绍了各种可以帮助你评估代码性能的工具。\n\n第 9 章: *并发*\n\n*   最初的 `C++98`\
  \ 和 `C++03` 标准没有考虑代码在多线程环境中应该如何表现。随着 `C++11` 的出现，语言现在对编写并发和并行代码有了广泛支持。本章涵盖了 `C++`\
  \ 代码中的数据竞态、竞态条件、线程安全和重入性等话题。\n\n第 10 章: *版本控制*\n\n*   在掌握 API 设计的基础后，我开始扩展到更复杂的方面，从\
  \ API 版本控制和如何维护兼容性开始。这是重要且困难的方面之一。在这里，我将定义向后、向前兼容和二进制兼容，并描述如何在对客户端影响最小的情况下进化 API。\n\
  \n第 11 章: *文档*\n\n*   接下来，我专门用一个章节讨论 API 文档。如果没有良好的文档，API 就是定义模糊的，因此我介绍了注释 API 的良好技巧，并提供了\
  \ `Doxygen` 的具体示例。\n\n第 12 章: *测试*\n\n*   广泛的测试让你放心地进化 API，而不会破坏客户端的程序。在这里，我介绍了各种自动化测试，包括单元测试、集成测试和性能测试，并介绍了测试驱动开发、存根（stub）和模拟（mock）对象以及契约编程。\n\
  \n第 13 章: *Objective-C 与 Swift*\n\n*   Objective-C 和 Swift 语言已成为开发 Apple 产品生态系统的机制。但你可能需要在这些应用中集成\
  \ `C++` 代码。因此，我将介绍 Objective-C 与 `C++` 代码如何共存，以及如何从 `Swift` 代码访问 `C++` API。\n\n\
  第 14 章: *脚本*\n\n*   除了将 `C++` 代码集成到其他编译语言之外，你可能还希望将其集成到不同的脚本语言中，以便应用程序的高级用户编写脚本执行自定义操作。因此，我将介绍如何为\
  \ `C++` API 创建脚本绑定，使其可以从 `Python` 和 `Ruby` 等语言调用。\n\n第 15 章: *扩展性*\n\n*   另一个高级话题是用户扩展性：创建一个能够允许程序员编写自定义\
  \ `C++` 插件的 API，以扩展你随 API 交付的基础功能。这可能是促进你的 API 被采用并帮助其长期生存的关键机制。此外，我还涵盖了如何使用继承和模板创建可扩展接口。\n\
  \n附录 A：*库*\n\n*   本书以关于如何创建静态库和动态库的附录结束。你需要能够创建库以便他人使用代码。此外，在创建动态库时需要考虑接口设计问题，例如你公开导出的符号集。因此，我讨论了静态库和共享库的区别，并演示了如何让编译器生成这些库，以便在其他应用程序中重用你的代码。\n\
  \n\n\n\n\n本章描述了定义良好的应用程序编程接口（API）的一系列语言无关的特性。这包括为所解决的问题提供良好的抽象，并将借助于一个简单的地址录程序来此说明。良好的\
  \ API 还必须通过物理隐藏和逻辑隐藏技术的结合来隐藏实现细节。**最小完备性**（minimal completeness）特性意味着 API 应该尽可能小，但不能更小。API\
  \ 应该应该是易于使用的，这包括了可发现性、不易误用、一致性、正交性和平台无关性等方面，并合理地使用智能指针（如共享指针、弱指针和唯一指针）。松耦合对于健壮的\
  \ API 设计至关重要。本文定义了“耦合”术语，并解释了减少耦合的几种策略。最后，一个良好的 API 应该提供一个稳定的、文档齐全且包含广泛自动化测试覆盖的接口。\n\
  \n### 关键词\n\n抽象；声明；定义；易用性；封装；逻辑隐藏；松耦合；最小完备；对象模型；物理隐藏；冗余\n\n本章旨在回答一个问题：良好的应用程序编程接口（API）的基本特性有哪些？大多数开发者都会同意，一个良好的\
  \ API 应该设计优雅但仍具有高度可用性。使用它应该是一种享受，但同时也应该退到背景中（Henning, 2009）。这些是很好的定性陈述，但实现这些特性的具体设计方面是什么？显然，每个\
  \ API 都是不同的。然而，某些特性可以促进高质量的 API 设计，并应该尽可能遵循它们；同时也有许多特性会导致糟糕的设计并应该被避免。\n\nAPI 设计中没有绝对的规定：你不能将一组固定的规则适用于每种情况。然而，虽然在某些特定情况下你可能决定偏离本章的某些建议，但你应该只在经过推理和深思熟虑的判断后才这样做。这里的指南应该是你\
  \ API 设计决策的基石。\n\n在本章中，我将专注于 API 的通用的、语言无关的特性，例如信息隐藏、一致性和松耦合。我会为这些概念中的每一个提供一个 `C++`\
  \ 的背景，但总的来说，无论你是在从事 `C++`、`Java`、`C#` 还是 `Python` 项目，本章的建议对你都是有用的。在后面的章节中，我将处理 `C++`\
  \ 特有的问题，如 `const` 正性、命名空间和构造函数的使用。\n\n本章中的许多主题也为以后深入的探讨提供了切入点。例如，虽然我提到了使用 `Pimpl`\
  \ 模式作为隐藏 `C++` 内部细节的解决方案，但我将在关于设计模式的后续章节中投入更多空间来讨论这个重要话题。\n\n编写 API 是为了解决特定问题或执行特定任务。因此，首先，API\
  \ 应该为该问题提供一个连贯的解决方案，并且其表述方式应该模拟问题的实际领域。例如，它应该对问题区域提供良好的抽象，并对该领域的关键对象进行建模。这样做可以让用户更容易使用和理解\
  \ API，因为它将与他们先有的知识和预期更紧密的相关。\n\n## 提供良好的抽象\n\nAPI 应该为其解决的问题提供一个逻辑抽象。也就是说，它应该用所选问题领域中有意义的高级概念来构建，而不是暴露底层的实现问题。你应该能够将你的\
  \ API 文档交给非编程人员，那个人应该能够理解接口的概念以及它的工作方式。\n\n此外，对于非技术读者来说，显而易见的是 API 提供的操作组是有意义的并且作为一个单元统一在一起的。每个\
  \ `class` 都应该有一个核心目的，这应该反映在 `class` 及其方法的名称中。事实上，尽早让其他人审查你的 API 是一种良好的做法，以确保它对新接触的人来说呈现出一个逻辑接口。\n\
  \n构想出一个良好的抽象并不是一项简单的任务。我将第 4 章 显示了一个 `AddressBook` 对象，它包含一个 `Person` 对象的的一对多组合关系，以及两个操作：`AddPerson()`\
  \ 和 `DeletePerson()`。`Person` 对象包含一组描述姓名和地址的公有属性。我稍后会精炼这个设计，但目前它作为问题域的初始抽象。\n\n\
  ![image](img/f02-01-9780443222191.jpg)\n\n图 2.1 地址录应用程序编程接口的高级统一建模语言抽象。\n\n## 为关键对象建模\n\
  \nAPI 还应该对领域的关键对象进行建模。这个过程通常被称为面向对象的设计或对象建模，因为其目的是描述特定问题领域中对象的层次结构。对象建模的目标是识别主要对象的集合、它们提供的操作以及它们如何相互关联。\n\
  \n再次，对于给定的问题领域没有单一正确的对象模型。相反，创建对象模型任务应该由 API 的特定需求驱动。对 API 的不同需求可能需要不同的对象模型来有效地表示这些需求。例如，继续我们的地址录示例，假设我们收到了针对我们\
  \ API 的以下需求：\n\n- 1. 每个人可能有多个地址。\n- 2. 每个人可能有多个电话号码。\n- 3. 电话号码可以进行验证和格式化。\n- 4.\
  \ 地址录可能包含多个同名的人。\n- 5. 现有的地址录条目可以被修改。\n\n这些需求将对 API 的对象模型产生巨大影响。我们在图 2.1 中的原始设计只支持每个人一个地址。为了支持多于一个地址，你可以在\
  \ `Person` 对象中添加额外的字段（例如 `HomeAddress1`、`WorkAddress1`），但这将是一个脆弱且不优雅的解决方案。相反，你可以引入一个表示地址的对象（例如\
  \ `Address`），并允许 `Person` 对象包含多个此类对象。\n\n\n\n\n电话号码也是如此：你可以将这些拆分到它们自己的对象（例如 `TelephoneNumber`），并允许\
  \ `Person` 对象持有多个此类对象。创建独立的 `TelephoneNumber` 对象的另一个原因是，我们需要支持诸如 `IsValid()`（验证号码是否有效）以及\
  \ `GetFormattedNumber()`（返回格式化良好的良好的版本）等操作。这些操作自然地是作用于电话号码的，而不是针对人的，这表明电话号码应该由它们自己的一等对象来表示。\n\
  \n多个 `Person` 对象可能持有相同名称这一要求，本质上意味着人的姓名不能用于标识 `Person` 对象的唯一实例。因此，你需要某种方法来识别唯一的\
  \ `Person` 实例（例如，以便在地址簿中查找并更新现有的条目）。满足这一要求的方法就是简单地为每个人生成一个全局唯一标识符（`UUID`）。将这一切整合在一起，你可能会得出结论，我们地址簿\
  \ API 的关键对象是：\n\n1. **Address Book**：包含零或多个 `Person` 对象，并具有 `AddPerson()`、`DeletePerson()`\
  \ 和 `UpdatePerson()` 等操作。\n2. **Person**：完整描述单个人的详细信息，包括零或多个地址和电话号码。每个人都通过 `UUID`\
  \ 进行区分。\n3. **Address**：描述单个地址，包括地址类型字段（如 `Home` 家庭或 `Work` 工作）。\n4. **TelephoneNumber**：描述单个电话号码，包括电话类型字段（如\
  \ `Home` 或 `Cell` 手机）。此对象支持 `IsValid()` 和 `GetFormattedNumber()` 等操作。\n\n这个更新后的对象模型可以再次表示为\
  \ UML 图，如图 2.2 所示。\n\n![image](img/f02-02-9780443222191.jpg)\n\nFigure 2.2 我们地址簿应用程序接口中关键对象的统一建模语言图。`UUID`，全局唯一标识符。\n\
  \n注意的是，API 的对象模型可能会随着时间的推移而变化。随着新需求的接收或新功能的添加，满足这些需求的类和方法的最佳划分可能会发生变化。因此，根据新需求重新评估你的对象模型总是明智的，以评估你的对象模型是否能从重新设计中受益。例如，你可能预见到国际地址的需求并决定创建一个通用的\
  \ `Address` 对象来处理这种能力。但是，不要过度，尝试创建一个比你需要的更通用的对象模型。确保也阅读后续关于“最小完备”的章节！\n\n## 解决核心问题\n\
  \n开发 API 的主要原因是解决一组相关问题。因此，你的用户必须清楚他们如何应用你的设计来实现该目标。我们刚刚看到了如何为你的问题领域对关键对象建模，但你 API\
  \ 的用户还需要知道如何创建这些对象，以及如何调用这些对象上的方法来完成他们的任务。\n\n我之前引入了 UML 类图的概念来显示不同对象之间的关系。另一种 UML\
  \ 图类型是时序图。它显示了产生某些预期输出的对象之间的顺序交互。换句话说，它可以显示你的设计如何被用于实现某些目标。例如，在之前描述的地址簿设计中，我引入了\
  \ `AddressBook`、`Person` 和 `TelephoneNumber` 对象。但客户端如何使用这些对象将人的电话号码类型从私人号码更改为工作号码呢？图\
  \ 2.3 展示了一个可能的时序图，显示你可以如何做到这一点。\n\n时序图从从顶部左到右表示一组对象。第一条消息通常从图的左上开始，例如示例中的 `AddressBook::GetInstance()`。随后的每条消息都出现在上一条消息下方。向另一个对象发送消息的对象用实线和箭头（异步消息用空心箭头）表示，返回结果则用虚线和空心箭头表示。\n\
  \n![image](img/f02-03-9780443222191.jpg)\n\nFigure 2.3 用于更改电话号码类型的统一建模语言时序图。\n\n\
  所以，图 2.3 始于调用 `AddressBook::GetInstance()` 以获取地址簿实例。然后你调用 `AddressBook::FindPerson()`\
  \ 方法来查找特定的人。我们可以看到这些工具中使用 [`mermaid.org/`](https://mermaid.org/)](#CH0002_25-80_B9780443222191000143.xhtml_f0020)\
  \ 来创建类时序图。\n\n\n\n\n这种技术隐式地要求编译器在所有调用 `MyMethod()` 成员函数的地方将其内联（inline）。从 API 设计的角度来看，这是一种糟糕的做法，因为它暴露了方法的实现代码，并将代码直接内联到了你客户端的程序中。因此，你应该努力限制\
  \ API 头文件，使其仅提供声明。在随后的章节中，我将讨论这一规则的例外情况，以支持模板和有意识的内联。\n\n请注意，在本书的代码示例中，我有时会这样内联函数的实现。然而，这样做完全是为了清晰和简单，对于你开发的任何真实世界的\
  \ API，都应该避免这样做。\n\n![image](img/f02-04-9780443222191.jpg)\n\n图 2.4 C++ 类的三种访问级别。\n\
  \n在后续关于 C++ 修订的章节中，我将介绍 C++20 引入的模块（modules）概念。这一功能为使用头文件提供了替代方案。然而，你仍然可以通过将声明放在模块接口单元中、将定义放在模块实现单元中，来执行物理隐藏。\n\
  \n### 逻辑隐藏：封装\n\n面向对象的封装概念提供了一种限制对对象成员访问的机制。在 C++ 中，这通过通过以下用于类和结构体的访问控制关键字来实现（类和结构体在功能上是等价的，区别在于它们的默认访问级别）。这些访问级别在图\
  \ 2.4 中所示。\n\n1. **Public（公共）**：成员可以在类/结构体外部被访问。这是结构体的默认访问级别。\n2. **Private（私有）**：成员仅在定义它们的特定类内部可访问。这是类的默认访问级别。\n\
  3. **Protected（保护）**：成员仅在特定类及其任何派生类内部可访问。\n\n很可能，你的用户并不不在乎尊重你的公共 API 边界。如果你给他们提供了进入内部机制的钩子，让他们实现自己的目标，他们就会利用这些钩子来完成工作。虽然这对他们来说可能是件好事，因为他们找到了解决眼前问题的解决方案，但可能会让你在将来更改这些实现细节变得更加困难，从而限制了你改进和优化产品的能力。\n\
  \n作为某些用户会所付出的努力之程度的例子，多人第一人称射击游戏《反恐精英》自 2000 年左右出现以来，一直是外挂破解的热门目标。其中最为人知的就是透视（wallhack）。这本质上是一个修改过的\
  \ OpenGL 驱动程序，可以将墙壁渲染为部分或完全透明。这让玩家获得了巨大的优势，他们实际上可以直接看到墙后。尽管你可能不是在开发游戏或将游戏作为你的客户，但道理是：用户会尽一切努力得到他们想要的东西。如果某些用户会修改\
  \ OpenGL 图形驱动程序在游戏中获得优势，那么可能其他人也会利用你 API 暴露的内部细节，以便交付他们老板要求的功能。\n\n为了用一个更直接相关的示例来说明这一点，Roland\
  \ Faber 报告了西门子内部发生的一些困难，当时一个小组决定依赖同一公司内另一个小组的 API 内部细节（Faber, 2010））：\n\n> 一个来自欧洲以外的团队必须为在德国实现的用户界面提供一个远程控制器。由于自动化接口不完整，他们决定在不通知架构师的情况下直接使用内部接口。由于接口更改缺乏协调，系统集成出现了意料之外的问题，昂贵的重构变得不可避免。\n\
  \n因此，接下来的章节将讨论如何使用你所编程语言的访问控制特性来为你的 API 提供最大程度的信息隐藏。关于 C++ 使用的后续章节也指出了某些 C++ 语言特征可能会影响封装的情况，例如友元（friends）和外部链接（external\
  \ linkage）。\n\n### 隐藏成员变量\n\n“封装”一词也经常用于描述将数据与操作这些数据的方法组合在一起。这在 C++ 中通过让类同时包含变量和方法来实现。然而，从良好的\
  \ API 设计角度来看，你永远不要让成员变量变为公共。如果数据成员构成了 API 逻辑接口的一部分，那么你应该提供 getter 和/或 setter 方法来提供对成员变量的间接访问。例如，你应该避免编写如下：\n\
  \n![image](img/u02-07-9780443222191.jpg)\n\n相反，你应该优于：\n\n![image](img/u02-08-9780443222191.jpg)\n\
  \n后者的语法显然更冗长，并且要求你作为程序员输入更多内容，但如果你将来决定更改接口，那么现在在这些事情上花费的额外几分钟可以为你节省未来几个小时甚至几天的时间。使用\
  \ getter/setter 例程而不是直接暴露成员变量的某些额外益处包括：\n\n1. **验证（Validation）**：你可以对值进行验证，以确保类的内部状态始终有效。例如，如果你有一个让客户端设置新\
  \ RGB 颜色的方法，你可以检查红、绿、蓝值是否在有效范围内（例如 0 到 255 或 0.0 到 1.0）。\n2. **懒性求（Lazy evaluation）**：计算变量可能会产生巨大的代价，你希望在必要时避免。通过使用\
  \ getter 方法访问底层数据，你可以将贵的计算推迟到实际请求。\n3. **缓存（Caching）**：一种经典的优化技术是存储频繁请求计算的结果，并在后续请求中直接返回该值。例如，在\
  \ Linux 上可以通过解析 `/proc/meminfo` 文件找到机器的总内存大小。与其每次请求总内存大都执行文件读取，不如第一次读取后缓存结果，然后在后续请求中简单返回该缓存值。\n\
  4. **额外计算（Extra computation）**：如有必要，你可以在客户端尝试访问变量时执行额外的操作。例如，每当用户更改设置值时，可能总是将 `UserPreferences`\
  \ 对象的当前状态写入磁盘上的配置文件。\n5. **通知（Notifications）**：其他模块可能希望知道你类中的值何时发生了变化。例如，如果你正在为进度条实现数据模型，用户界面代码将希望知道进度值何时更新，以便更新\
  \ GUI。因此，你可能希望在 setter 方法的一部分发布更改通知。\n6. **调试（Debugging）**：你可能想要添加调试或日志语句，以便跟踪变量何时被客户端访问或更改。或者你可能希望添加断言（assert）语句来强制执行假设。\n\
  7. **同步（Synchronization）**：你可能发布 API 的第一个版本，然后发现需要使其线程安全。实现此点的标准方法是在访问值时添加互斥锁。这只有在你将对值的访问封装在\
  \ getter 和 setter 方法中时才是可能的。\n\n\n\n\n\n## 8. 更细粒度的访问控制\n如果你将成员变量设置为公共（public），客户端就可以随所欲地读写该值。然而，通过使用\
  \ getter/setter 方法，你可以提供更细粒度的读写控制。例如，你可以通过不提供 setter 方法来使值变为只读。\n\n## 9. 维护不变性关系\n\
  某些内部数据值之间可能相互依赖。例如，在一个汽车动画系统中，你可能根据在关键帧之间旅行所需的时间来计算汽车的速度和加速度。你可以根据位置随时间的变化计算 `velocity`，并根据速度随时间的变化计算\
  \ `acceleration`。然而，如果客户端可以为了此项计算而访问你的内部状态，他们可能会更改 `acceleration` 的值，使其与汽车的速度不符，从而产生意料之外的结果。\n\
  \n另一方面，如果成员变量实际上并不是逻辑接口的一部分——也就是说它们代表了与公共接口无关的内部细节——那么它们应该简单地从接口中隐藏。例如，考虑以下整数栈栈的定义：\n\
  \n![image](img/u02-09-9780443222191.jpg)\n\n显然，这是一个糟糕的 API，因为它暴露了栈被（糟糕地）实现为固定整数数组的方式，并且通过\
  \ `mCurSize` 变量暴露了栈的内部状态。如果你在未来的某个日期决定改进此类的实现实现，例如通过使用 `std::vector` 或 `std::list`\
  \ 代替固定大小的静态分配数组，那么你可能会发现这很很难做到。这是因为你已经暴露了 `mStack` 和 `mCurSize` 变量的存在，客户端代码可能依赖于直接访问这些变量的能力。通过更改你的实现方式，你可能会破坏客户端的代码。\n\
  \n相反，这些成员变量从一开始就应该是隐藏的，以便客户端代码无法访问它们：\n\n![image](img/u02-10-9780443222191.jpg)\n\
  \n我提到过成员变量永远不应该是公共的，但它们可以被声明为保护的（protected）吗？如果你将一个变量声明为保护的，那么任何派生自你类的客户端都可以直接访问它，这时与公共情况完全相同的理由也适用。因此，你永远也不应该将你的成员变量设为保护的。正如\
  \ Alan Snyder 所说，继承严重损害了面向对象语言中封装的优势（Snyder, 1986）。\n\n暴露成员变量的唯一尚算合理的理由是出于性能考虑。执行一个\
  \ C++ 方法调用会产生将方法的参数和返回地址推入调用堆栈的开销，以及为程序中的任何局部变量留留空间的开销。当方法完成后，调用堆栈必须再次展开。对于对性能敏感的代码区域，执行这些操作的成本可能是可以察觉的，例如在对大量对象执行操作的紧凑循环内部。直接访问公共成员变量的代码可能比必须通过\
  \ getter/setter 方法的代码快两到三倍。\n\n然而，即使在这些情况下，你也永远不应该暴露成员变量。首先，方法调用的开销对于你几乎所有的 API\
  \ 调用来说可能都是微不足道的。即使你正在编写性能关键的 API，通过仔细使用内联（inlining）结合现代优化编译器，通常会完全消除方法调用的开销，让你获得直接暴露成员变量的所有性能益处。如果你仍然担心，可以尝试对使用内联\
  \ getter/setter 的 API 进行计时，然后对公共成员变量进行计时。本书附带源代码包含一个执行此操作的示例程序。访问 [`APIBook.com/`](https://APIBook.com/)\
  \ 下载这些代码并亲自尝试。我将在“性能”章节中进一步讨论这个问题。\n\n### 隐藏实现方法\n\n除了隐藏所有成员变量外，你应该隐藏所有不需要是公共的方法。这就是信息隐藏的原则：将类的稳定接口与用于实现它的内部设计决策隔离开来。对几个大型程序的早期研究发现，使用信息隐藏技术的程序比不使用的程序更容易修改（四倍）（Korson\
  \ and Vaishnavi, 1986）。虽然你的具体情况可能有所不同，但显而易见的是，隐藏 API 的内部细节将使软件更具可维护性和演进性。\n\n要记住的关键点是，类应该定义“做什么”，而不是“如何做”。例如，考虑一个允许你从远程\
  \ http 服务器下载文件的类：\n\n![image](img/u02-11-9780443222191.jpg)\n\n所有的成员变量都已正确声明为私有（private），这是一个良好的开始。然而，暴露了几个特定于实现的方法，例如从\
  \ socket 打开并读取数据的例程，以及将生成的内存缓冲区写入磁盘文件的例程。客户端不需要知道这些任何内容。客户端只想的是指定一个 URL，然后神奇地在磁盘上创建一个具有远程位置内容的文件。\n\
  \n这里还有一个特别恶劣的方法：`GetSocket()`。这是一个返回私有成员变量访问权限的公共方法。通过调用此方法，客户端可以获取底层的 socket 句柄，并在不告知\
  \ `URLDownloader` 类的情况下直接对其进行操作。特别令人生不安的是，`GetSocket()` 被声明为 `const` 方法，这意味着它不会修改类的状态。虽然这在严格来说是正确的，但客户端可以使用返回的\
  \ socket 句柄来修改类的状态。如果你返回一个私有成员变量的非 const 指针或引用，也会发生类似的内部状态泄露。这样做让你的客户端可以在不通过你的 API\
  \ 的情况下修改对象的状态。\n\n显然，`URLDownloader` 类的更好设计是除了构造函数和 `DownloadToFile()` 方法外，将每个方法都设为私有。其他所有内容都是实现细节。你就可以自由更改实现而不影响该类的任何客户端。\n\
  \n尽管如此，这种情况仍然有些令人不满意。我从编译的角度隐藏了实现细节，但人仍然可以查看头文件并看到你类的所有内部细节。事实上，这很可能是因为你必须分发头文件，以便客户端针对你的\
  \ API 编译代码。此外，你必须 `#include` 类私有成员所需的所有头文件，即使它们不是公共接口的依赖项。例如，`URLDownloader` 头文件需要\
  \ `#include` 所有特定平台的 socket 头文件。\n\n这是 C++ 语言的一个遗憾局限性：类的所有的公共、保护和私有成员必须出现在该类的声明中。理想情况下，我们类的头文件应该是这样的：\n\
  \n![image](img/u02-12-9780443222191.jpg)\n\n\n\n\n然后，所有的私有成员可以在其他地方声明，例如在 `.cpp`\
  \ 文件中。然而，在 C++ 中这是是不可能的（这样做是为了确保在编译时就能知道所有对象的大小）。尽管如此，仍然有方法可以从你的公共头文件中隐藏私有成员（Headington,\
  \ 1995）。一种流行的技术被称为 `Pimpl` 句式。这涉及到将类所有的私有数据成员隔离在 `.cpp` 文件中一个独立的实现类或结构体中。`.h` 文件此时只需要包含一个指向该实现类的不透明指针（opaque\
  \ pointer）。我将在接下来的“设计模式”章节中更详细地讨论这种极具价值的技术。\n\n我强烈建议你在 API 中采用 `Pimpl` 句式，这样所有的实现细节都可以完全从你的公共头文件中隐藏。。然而，如果你决定不采用这种方向，那么你至少应该尝试在私有方法不再需要时，将它们从头文件中移除，将其移动到\
  \ `.cpp` 文件并转换为静态函数（Lakos, 1996）。当私有方法只访问类的公共成员，或者完全不访问类的任何成员时（例如一个接受文件名字符串并返回该文件名扩展名的例程），就可以这样做。许多工程师认为，仅仅因为一个类使用了私有方法，它就必须被包含在类声明中。然而，这仅仅是暴露了超出必要的实现细节。\n\
  \n### 隐藏实现类\n\n除了隐藏类的内部方法和变量外，你还应该努力隐藏任何纯粹作为实现细节的类。大多数程序员习惯于隐藏方法和变量，尽管许多人忘记了并非所有类都是公开的。事实上，某些类仅供你的实现使用，而不应该作为你\
  \ API 公共接口的一部分暴露。\n\n例如，考虑一个简单的 `Fireworks` 类：这是一个允许你指定屏幕上烟花动画的位置，并允许你控制火粒颜色、速度和数量的接口。显然，API\
  \ 需要跟踪烟花效果的每个粒子，以便每帧更新每个粒子的位置。这意味着应该引入一个 `FireParticle` 类来包含单个火粒的状态。然而，API 的客户端永远不需要访问这个类；它纯粹是\
  \ API 的实现所需的。\n\n因此，我们可以使用物理隐藏或逻辑隐藏将该类从公共 API 中移除。在这种情况下，物理隐藏意味着将类的实现放在一个私有头文件中（即放在一个没有包含在你的公共\
  \ API 头文件集中的头文件中）。然后你在公共头文件中对类进行前向声明，以便编译器知道该名称，例如：\n\n![image](img/u02-13-9780443222191.jpg)\n\
  \n或者，你也可以使用逻辑隐藏将类声明为私有，这样客户端就无法从他们的代码访问该类。这可以通过将其嵌套在另一个类的私有区域来实现，例如：\n\n![image](img/u02-14-9780443222191.jpg)\n\
  \n注意，我没有为 `FireParticle` 类使用 getter/setter 方法。如果你愿意，完全可以这样做，但这不是严格必要的，因为无法从公共接口访问该类。\n\
  \n再次，你也可以隐藏整个 `FireParticle` 符号，使其不出现在头文件中，这样即使对头文件进行随意的检查，它也会被隐藏。我将在下一章中讨论如何这样做。\n\
  \n### 最小完备\n\n一个良好的 API 应该是最小完备（minimally complete）的。也就是说，它应该在可能尽可能小，但不能更小。\n\n\
  API 应该是完整的这可能是显而易见的：它为客户端提供了所需的所有功能。然而，这些功能是什么可能没那么显而易见。为了回答这个问题，你应该尽早进行需求收集和用例建模，以便理解\
  \ API 预期要做什么。然后你就可以断言它交付了这些预期。我将在“设计”章节中更多地讨论需求和用例。\n\n不那么明显的是，API 应该是极简的，这似乎是矛盾的。然而，这是你可以提前规划的最特性之一，而且对你\
  \ API 的长期维护和演进产生巨大影响。从非常现实意义上说，你今天做出的决定将限制你明天能做的事。它对 API 的易用性也有很大影响，因为紧凑的接口可以很容易地放入用户的脑中（Blanchette,\
  \ 2008）。因此，我将专门通过以下章节讨论保持你的 API 极简的各种技术，以及为什么这是一件好事。\n\n### 不要过度承诺\n\n你 API 中的每个公共元素都是一个承诺——承诺你将在\
  \ API 的整个生命周期内支持该功能。你可以违背那个承诺，但这样做可能会让你的客户端感到沮丧并导致他们重写代码。更糟糕，他们可能会因为你删除了支持他们用例的功能而放弃你的\
  \ API。关键点在于，一旦发布了 API 并让客户端使用，添加新功能很容易，但移除功能却非常困难。最好的建议是：如果有疑问，就不要包含（Bloch, 2008)；Tulach,\
  \ 2008)。\n\n这种建议可能与 API 设计者的初意相悖。作为一名工程师，你希望为解决的问题提供一个灵活且通用的解决方案。人们倾向于在 API 中添加额外的抽象层或通用性，因为你认为它们在未来可能有用。你应该抵抗这种诱惑，原因如下：\n\
  \n- 1. 可能永远不会需要那些额外的通用性。\n- 2. 如果那一天真的到来，你可能对 API 的使用有更多了解，并且出现与你最初预想不同的解决方案。\n\
  - 3. 如果你确实需要添加额外功能，将其添加到简单的 API 比添加到复杂的 API 要容易得多。\n\n因此，你应该尽可能保持你的 API 简单：尽量暴露的类的数量以及这些类中公共成员的数量。作为额外奖励，这将使你的\
  \ API 更容易理解，让你的用户更容易在脑中建立心理模型，并便于你进行演进。\n\n### 不要重复\n\n不要重复自己（DRY）原则是关于减少代码中信息的重复。它通常被描述为要求在系统中任何给信息都有唯一的、无歧义且权威的表示（Hunt\
  \ and Thomas, 1999）。\n\n这个通用概念也通过其他几个相似的设计原则表达，例如单一真理来源原则（single source of truth），旨在只在一个地方定义数据；以及单一职责原则（single\
  \ responsibility），该类应该只有一个变更的原因，而不负责多个不相关的任务。\n\n总之，这些原则都专注于通过在一个地方定义数据和行为来减少重复。因此，它们提供了实现最小完备的方法。\n\
  \n\n\n[content]\n然而，值得注意的是，如果盲目应用这些原则，它们可能会走向极端。尝试移除项目中的每一处代码重复可能会导致代码过于复杂，或类之间产生不必要的耦合。与大多数经验法则一样，应该深思之后后再应用，而不是死板地执行。不过，它们可以帮助你识别出可能进行更好设计的地方。\n\
  \n解决代码重复的常用方法有：\n\n*   **1. 函数重构：** 最简单的解决方案是将重复代码提取到单个函数中，该函数可以从所有需要该功能的地方被调用。如果这属于你的实现代码部分，那么它可能甚至不会影响你的公共\
  \ API。\n*   **2. 类抽象：** 这涉及创建更通用的抽象层级来表示系统中的概念，以便将共享功能推向继承层次结构的更底层。如果这涉及到你暴露给客户端的公共类和继承层次结构，这对于\
  \ API 设计尤为相关。\n*   **3. 依赖注入：** 将功能定义在单个对象中，并将该对象传递到需要该功能的方法调用。如果你需要更新各种公共 API 方法调用以传递该对象，这可能会影响你的\
  \ API。\n*   **4. 自动化：** 在不可避免重复的情况下，你可以为该功能定义单一真理源，并编写自动化工具从该真理源生成其他代码。这让你通过运行自动化脚本来保持所有重复代码段的同步。\n\
  \n我们可以通过本章之前的地址录示例来来说明这一概念。我们识别出地址录中的每个人都可能有多个电话号码。一种解决方案是直接向 `person` 对象添加工作电话和家庭电话。然而，如果我们想提供各种功能来访问或格式化这些电话号码，或者如果我们想将电话号码与地址等其他对象关联，我们可以看到将电话号码表示为系统中的独立对象可能更有意义。这样，操作电话号码的功能都可以包含在一个地方。\n\
  \n考虑这个问题的一个好方法是问自己：如果你需要更改某项工作方式，你是否需要更新代码中的多处地方来实现该更改？如果是，那么你可能想要考虑重构你的设计。再次强调，这不应该被视为一条硬性规定。你还需要考虑它对你设计的简单性和易用性的影响。例如，也许你可以在后台应用自动化解决方案来保持信息同步，而不影响你的\
  \ API 设计。（我们将在本章稍后的部分讨论刻意的冗余。）\n\n马丁·福勒（Martin Fowler）建议，只有当你第三次重复某些内容时才尝试重构代码（Fowler\
  \ et al., 1999）。这被封装在缩写 `WET` 中，即 write everything twice（写写两次），意味着重复两次是可以接受的，但不能更多了。还有另一个缩写是\
  \ `AHA`，avoid hasty abstractions（避免匆忙抽象），它代表了重构重复代码与在接口中添加更复杂抽象之间的张力。关于重复代码有太多的缩写了！\n\
  \n关于减少重复的最后一点，可以将 `DRY` 及相关原则解释为：执行某事应该只有一种方法。然而，这并不总是一个良好的目标。考虑标准库中的容器类，它们允许你使用\
  \ `find()` 方法搜索元素。这可以通过比较结果与 `end()` 迭代器来发现元素是否存在于容器中，但执行此操作的代码非常冗长，并且存在导致你写错比较逻辑的风险。截至\
  \ C++20，现在有了 `contains()` 方法，它使用起来简单得多，尽管可以争论它并没有添加你原本无法做到的功能。然而，如果这个新函数只是根据现有的\
  \ API 函数实现的，那么当需要更改行为时，仍然只有一个地方需要更新。我们将在下一节深入探讨这种便利 API 调用的想法。\n\n### 快捷 API (Convenience\
  \ APIs)\n\n保持 API 尽可能小是一项艰巨的任务。在减少 API 中的函数数量与让 API 对各种客户端易于使用之间存在着一种张力。这是大多数 API\
  \ 设计师面临的问题之一：是保持 API 的纯净和聚焦，还是允许便利包装器。（我所说的便利包装器，是指封装多次 API 调用以提供更简单的高层操作的实用程序）。\n\
  \n一方面，有一种观点认为 API 应该只为执行某项任务提供一种方法。这确保了 API 是最小的、单一聚焦的、一致且易于理解的。它还减少了实现的复杂性，并带来更高稳定性以及更易调试和维护的所有优点。格雷迪·布奇（Grady\
  \ Booch）将其称为“原始性”（primitiveness），即方法为了高效实现而访问类内部细节的性质，与之相对完全构建在原始方法之上而无需访问任何内部状态的非原始方法（Booch\
  \ et al., 2007）。\n\n然而，另一方面也有一种观点认为 API 应该让简单的事情变得容易。客户端不应该被要求编写大量代码来执行基础任务。这样做可能会产生大量的模板代码，这些代码被复制并粘贴到源代码的其他部分，而每当代码块被复制时，就存在代码分叉和\
  \ Bug 的风险。此外，你可能希望你的 API 针对各种客户端，从那些想要大量控制和灵活性的人到那些只想尽可能简单地执行单一任务的人。\n\n这两个目标都是有用且值得的。幸运的是，它们并不互斥。你有多种方法可以为你的核心\
  \ API 功能提供高层的便利包装器，而不会稀释其主要目的。关键点在于，不要将你的便利 API 与核心 API 混合在一起。相反，你可以产生辅助类来封装核心 API\
  \ 的某些公共功能。这些便利类应该与你的核心 API 完全隔离（例如在不同的源文件或完全独立的库中）。这具有额外的益处，确保你的便利 API 只依赖于核心 API\
  \ 的公共接口，而不是依赖任何内部方法或类。让我们来看一个真实世界的示例。\n\n`OpenGL` API 提供了编写 2D 和 3D 程序的平台无关例程。它在点、线和多边形等简单原语层级操作，这些原语经过变换、光照并栅格化到帧缓冲区。`OpenGL`\
  \ API 非常强大，但也针对非常底层。例如，在 `OpenGL` 中创建球面涉及显式地将其建模为由平面多边形组成的表面，如下代码段所示：\n\n![image](img/u02-15-9780443222191.jpg)\n\
  \n\n\n\n然而，大多数 OpenGL 实现还包含了 OpenGL 实用库（GLU）。这是一个构建在 OpenGL API 之上的 API，它提供了更高层次的函数，例如\
  \ 贴图生成、坐标转换、二次曲面、多边形细分以及简单的相机定位。这些函数定义在一个与 OpenGL 库完全独立的库中，且所有函数都以 `glu` 前缀开头，以区分它们与核心\
  \ OpenGL API 的区别。例如，下面的代码段展示了使用 GLU 创建球体有多简单：\n\n![image](img/u02-16-9780443222191.jpg)\n\
  \n这是一个很好的例子，展示了如何在保持核心 API 极简设计和专注的同时，提供额外的便利程序以使该 API 更易使用。事实上，还有其他构建在 OpenGL 之上的\
  \ API 提供了进一步的实用类，例如 Mark Kilgard 的 OpenGL 实用工具包（GLUT）。该 API 提供了创建各种实体和线框几何原型（包括著名的犹他茶壶）以及简单的窗口管理函数和事件处理程序。图\
  \ 2.5 显示了 GL、GLU 和 GLUT 之间的关系。\n\nKen Arnold 将这种概念称为渐进式披露，这意味着你的 API 应该通过易用的接口呈现基本功能，同时将高级功能留给单独层（Arnold,\
  \ 2005）。他指出，这种概念在 GUI 设计中通常以“高级”或“导出”按钮的形式出现，从而揭示了进一步的复杂性。通过这种方式，你仍然可以提供一个强大的 API，同时确保专家用例不会模糊基本工作流。\n\
  \n![image](img/f02-05-9780443222191.jpg)\n\n图 2.5 一个核心应用程序接口 (API)（OpenGL）与分层在其上的便利\
  \ API（OpenGL 实用库和 OpenGL 实用工具包）分离的示例。\n\n### 谨慎地添加虚函数\n\n你比意图暴露更多功能的一种微妙方法是通过继承：即通过将某些成员函数设为虚函数。这样做允许你的客户端派生你的类，并重新实现任何虚方法。尽管这非常强大，但你应该意识到潜在的陷阱：\n\
  \n1. 你可以对基类进行看似无害的更改，但这些更改会对你的客户端产生不利影响。这可能是因为你孤立地演化基类，而不知道你的客户端以哪些方式在你的虚 API 之上进行构建。这通常被称为脆弱基类问题（Blanchette,\
  \ 2008）。\n\n2. 你的客户端可能会以你从未意过或想象过的方式使用你的 API。这可能导致你 API 的调用图执行了你无法控制的代码，并且这些代码可能会产生意外的行为。作为一个极端例子，没有什么可以阻止客户端在重写的方法中调用\
  \ `delete this`。这甚至可能是一个合规的需求，但如果你没有设计你的实现来允许此操作，那么你的代码很可能会崩溃。\n\n3. 客户端可能会以不正确或易错的方式扩展你的\
  \ API。例如，你可能有一个线程安全的 API，但根据你的设计，客户端可能会重写虚函数并提供一个没有执行适当互斥锁锁定操作的实现，从而为难以调试的竞态条件留下了隐患。（有一种名为“线程安全接口”的设计模式可以解决这一特定疑虑，我在“并发”章节中详细描述了它）。\n\
  \n4. 重写后的函数可能会破坏你类的内部完整性。例如，虚方法的默认实现可能会调用同类中的其他方法来更新其内部状态。如果重写的方法没有执行这些调用，那么对象可能会处于不一致的状态，并产生意料之外的行为或崩溃。\n\
  \n除了这些 API 层面的行为考虑外，在 C++ 中使用虚函数时，还有一些你应该注意的标准事项：\n\n1. 虚函数调用必须在运行时通过执行 `vtable`\
  \ 查找来解析，而非虚函数调用可以在编译时解析。这可能导致虚函数调用比非虚函数调用慢。在实际上，这种开销可能是微不足道的，特别是如果你的函数执行了非平凡的工作或者它不被频繁调用。\n\
  \n2. 虚函数的使用增加了对象的大小，通常是增加 `vtable` 指针的大小。如果你想创建一个需要大量实例的小对象，这可能会是一个问题。同样，在实践中，与你各种成员变量消耗的内存相比，这可能并不显著。\n\
  \n3. 添加、重新排序或删除虚函数将破坏二进制兼容性。这是因为虚函数调用通常表示为类 `vtable` 中的整数偏移量。因此，更改其顺序或导致任何虚函数的顺序发生变化意味着现有代码需要重新编译。\n\
  \n4. 虚函数并不总是可以内联。你可能会合理地认为将虚函数声明为 `inline` 没有意义，因为虚函数是在运行时解析的，而内联是编译时优化。然而，在某些限制的情况下，编译器可以内联虚函数。尽管如此，这种情况也远少于非虚函数可以内联的情况。（记住\
  \ C++ 中的 `inline` 关键字仅仅是一个提示）。\n\n5. 虚函数的重载是比较棘手的。一个在派生类中声明的符号将隐藏基类中所有同名的符号。因此，基类中一组重载的虚函数将被子类中的单个重写函数所隐藏。有方法可以解决这个问题（Dewhurst,\
  \ 2002），但更好的做法是简单地避免重载虚函数。\n\n最终，只有当你明确希望这种可能性成为可能时，才允许重写。一个没有虚函数的类往往比带有虚函数的类更健壮，且需要的维护也更少。作为一个经验法则，如果你的\
  \ API 内部没有调用某个特定方法，那么该方法可能不应该是虚函数。\n\n如果你仍然决定要允许派生，请确保你设计的 API 能够安全地允许这样做。记住以下规则：\n\
  \n* 如果你的类中有任何虚函数，请务必将析构函数声明为虚函数。这样子类就可以释放它们可能分配的任何额外资源。\n\n* 始终记录你类的方法是如何相互调用的。如果客户端想要提供虚函数的替代实现，他们需要知道在实现中需要调用哪些其他方法以维护对象的内部完整性。或者使用如线程安全接口的设计模式来编码这种依赖。\n\
  \n永远不要在构造函数或析构函数中调用虚函数。这些调用永远不会指向子类（Meyers, 2005）。这不会影响你 API 的外观，但同样是一条好的规则。\n\n\
  \n\n\n\n一个设计良好的 API 应该让简单的任务变得轻而易举且直观。例如，客户端应该能够查看你 API 的方法签名，在不需要任何额外文档的情况下就能如何使用它。各种研究表明，易用性更高的\
  \ API 可以提高使用它们的开发者的效率（Clarke, 2004）。\n\n这种 API 可用性质量紧随极简主义的质量：如果你的 API 是简单的，那么它应该是易于理解的。同样，它应该遵循“最小惊讶原则”，该原则认为接口的行为应该符合大多数用户的预期。这通过采用现有的模型和模式来实现，从而使用户能够关注于当前任务，而不是被你界面的新颖性或复杂性所分心（Raymond,\
  \ 2003）。\n\n当然，这并不是你忽视对良好辅助文档需求的借口。事实上，这应该让编写文档的任务变得更容易。正如我们所知，一个好的例子可以大有裨益。提供示例代码可以极大帮助你的\
  \ API 易用性。优秀的开发者应该能够阅读你的 API 编写的示例代码，并理解如何将其应用到自己的任务中。\n\n接下来的章节将讨论使你的 API 更易理解并最终更易使用的各种方面和技术。不过，在此之前应该注意，API\
  \ 可能会为专家用户提供一些额外的复杂功能，这些功能并不容易使用。然而，不应以牺牲保持简单情况简单为代价。\n\n### 可发现性 (Discoverable)\n\
  \n可发现的 API 是指用户可以在没有任何辅助说明或文档的情况下自行弄出如何使用该 API。用用户界面设计领域的一个反例来说明：Windows XP 中的“开始”按钮并没有提供一个非常易发现的界面来定位关闭计算机的选项。同样，点击“关机”按钮访问“重启”选项是非常不直观的。\n\
  \n发现性并不意味着易用性。例如，一个 API 对于初次使用的用户可能很容易学习，但对于专家用户经常使用可能很繁琐。然而，通常来说，可发现性应该帮助你产生更具可用性的界面。\n\
  \n在设计 API 时，你有几种方法可以提升发现性。设计一个直观且逻辑清晰的对象模型是重要方法之一，为你的类和函数选择好的名称也是如此。事实上，想出清晰、描述性强且合适的名称可能是\
  \ API 设计中最困难的任务之一。在讨论 API 设计技术时，我将在第 4 章中为类和函数名提供具体建议。避免使用缩写也是发现性的因素之一（Blanchette,\
  \ 2008），这样用户就不必记忆你的 API 采用的是 `GetCurrentValue()`、`GetCurrValue()`、`GetCurValue()`\
  \ 还是 `GetCurVal()`了。\n\n### 难误用 (Difficult to misuse)\n\n一个良好的 API 除了易用之外，还应该是难误用的。Scott\
  \ Meyers 认为这是最重要的通用接口设计准则（Meyers, 2004）。误用 API 的一些常见方式包括向方法传递错误的参数以及向方法传递非法值。当你有多个相同类型的参数且用户忘记了参数的正确顺序，或者当你使用\
  \ `int` 来表示小范围的值而不是更具约束力的枚举类型（enum type）时，就会发生这种情况（Bloch, 2008）。例如，考虑以下方法签名：\n\n\
  ![image](img/u02-17-9780443222191.jpg)\n\n用户很容易忘记第一个 `bool` 参数是搜索方向还是大小写敏感标志。以错误的顺序传递标志将导致意外行为，并可能导致用户浪费几分钟调试问题，直到他们意识到自己颠倒了\
  \ `bool` 参数。然而，你可以通过设计该方法来让编译器为他们捕获这类错误，方法是为每个选项引入一个新的枚举类型，或者更优的是使用自 C++11 的枚举类（enum\
  \ class）。例如：\n\n![image](img/u02-18-9780443222191.jpg)\n\n这不仅意味着用户无法混淆两个标志的顺序（因为这会产生编译错误），而且他们编写的代码现在更具自解释性。\n\
  \n![image](img/u02-19-9780443222191.jpg)\n\n![image](img/u02-20-9780443222191.jpg)\n\
  \n许多 API 使用整数来表示一组选项，而枚举是更好的选择。例如，OpenCV 有一个 `Flip()` 函数接受 `flip_mode` 参数。值 `0`\
  \ 表示绕 X 轴翻，`1` 表示绕 Y 轴翻，`-1` 表示绕轴翻。更易用的解决方案可能是引入 `XAxis`、`YAxis` 和 `Both` 枚举。对于枚举不足的复杂情况，你甚至可以引入新的类来表示年、月、日。Scott\
  \ Meyers 用由三个整数构造的 `Date` 类说明了这一点（Meyers, 2004, 2005）：\n\n![image](img/u02-21-9780443222191.jpg)\n\
  \nMeyers 指出，在这种设计下，客户可能会以错误的顺序传递年、月、日值，并且可能指定非法值，例如月份 13。为了解决这些问题，他建议引入特定的类来表示唯一值：\n\
  \n![image](img/u02-22-9780443222191.jpg)\n\n现在，`Date` 类的构造函数可以通过这些 `Year`、`Month`\
  \ 和 `Day` 类来实现：\n\n![image](img/u02-23-9780443222191.jpg)\n\n使用这种设计，客户可以使用以下明确且易于理解的语法创建新的\
  \ `Date` 对象。此外，任何以不同顺序指定值的尝试都会导致编译时错误。\n\n![image](img/u02-24-9780443222191.jpg)\n\
  \nC++11 引入了用户自定义字面量（user-defined literals）的概念，也可以帮助客户不误用你的 API。使用此功能，你可以为不同的单位定义字面量后缀，并提供在这些不同单位之间转换的代码。例如，你可以允许客户将温度字面量指定为\
  \ `100.0_degC` 或 `100.0_degF`，并定义将这些字面量转换为你的 API 期的值。有关此功能的更多细节，请参考 C++ 修订章节中的 C++11\
  \ 用户自定义字面量部分。\n\n### 一致性 (Consistent)\n\n良好的 API 应该应用一致的设计方法，使其约定易于记忆，从而易于采用（Blanchette,\
  \ 2008）。这适用于 API 设计的所有方面，如命名规范、参数顺序、标准模式的使用、内存模型语义、异常的使用以及错误处理。\n\n\n\n\n\n在其中的第一点方面，一致的命名规范意味着在整个\
  \ API 中对相同的概念复用相同的单词。例如，如果你决定使用动词对 `Begin` 和 `End`，那么你不应该混用 `Start` 和 `Finish` 这两个术语。另一个例子是，`Qt3`\
  \ API 在它的几个方法名中混合了缩写的使用，例如 `prevValue()` 和 `previousSibling()`。这又说明了为什么应该尽可能避免使用缩写的另一个例子。\n\
  \n使用一致的方法签名是同样至关重要的设计质量。如果你有几个方法接受相似的参数列表，你应该努力保持这些参数的数量和顺序一致。为了给出一个反例，我向你提引用了以下\
  \ `C` 库函数：\n\n![image](img/u02-25-9780443222191.jpg)\n\n这两个函数都涉及从一个内存区域向另一个内存区域拷贝\
  \ `n` 字节的数据。然而，`bcopy()` 函数将数据从 `s1` 拷贝到 `s2`，而 `strncpy()` 则将数据从 `s2` 拷贝到 `s1`。如果开发者在没有仔细阅读各自的手手册（man\
  \ pages）的情况下决定在两个函数之间切换使用，可能会导致微妙的内存错误。公平地说，函数签名中有一个关于冲突规范的线索：注意在每情况下都使用了 `const`\
  \ 指针。然而，这很容易被忽略，而且如果源指针没有声明为 `const`，编译器是无法检测出它的。\n\n还要注意 `copy` 和 `cpy` 单词的使用不一致。\n\
  \n让我们来看 `C` 标准库的另一个例子。熟悉的 `malloc()` 函数被用于分配一块连续的内存，而 `calloc()` 函数执行相同的操作，额外增加了是将留留内存初始化为\
  \ `0`。然而，尽管它们的目的相似，但它们具有不同的函数签名：\n\n![image](img/u02-26-9780443222191.jpg)\n\n`malloc()`\
  \ 函数接受字节为单位的尺寸，而 `calloc()` 分配 `(count * size)` 字节。除了不一致之外，这还违反了最小惊讶原则。进一步的例子是，`read()`\
  \ 和 `write()` 标准 `C` 函数接受文件描述符作为第一个参数，而 `fgets()` 和 `fputs()` 函数则要求将文件描述符指定最后 (Henning,\
  \ 2009)。正如 David Hanson 所言辞生动的那样，`C` 库函数 `realloc()` 是混乱的奇迹 (Hanson, 1996)。\n\n\
  这些示例集中在函数或方法级别，但当然，一致性在类级别同样重要。具有相似角色的类应该提供相似的接口。`C++` 标准库就是这很好的例子。`std::vector`、`std::set`、`std::map`\
  \ 甚至 `std::string` 类都提供了一个 `size()` 方法来返回容器中的元素数量。它们也都支持迭代器的使用，因此一旦你知道如何遍历 `std::set`，就可以将相同的知识应用到\
  \ `std::map` 上。这使得记忆 API 的编程模式更容易。\n\n你可以通过多态免费获得这种一致性：通过将共享功能置于一个公共基类中。然而，通常情况下让你所有的类继承自一个公共基类是没有意义的，你不应该仅仅为了这个目的引入基类，因为这会增加接口的复杂性和类的数量。事实上，值得注意的是，`C++`\
  \ 标准库容器类并没有继承自一个公共基类。相反，你应该通过显式设计来实现这一点，即手动识别类之间的共同概念，并使用相同的约定在每个类中表示这些概念。这通常被称为静态多态。\n\
  \n你还可以利用 `C++` 模板来帮助你定义和应用这种一致性。例如，你可以为 2D 坐标类创建一个模板，并针对整数、浮点和双精度浮点进行特化。通过这种方式，你可以确保每种类型的坐标都提供相同的接口。下面的代码示例提供了此的简单示例：\n\
  \n![image](img/u02-27-9780443222191.jpg)\n\n有了这个模板定义，你可以创建类型为 `Coord2D<int>`、`Coord2D<float>`\
  \ 和 `Coord2D<double>` 的变量，所有这些都具有相同的接口。\n\n一致性的另一个方面是使用熟悉的模式和标准平台惯用法。当你买一辆新车时，你不需要重新学习如何开车。使用刹车和加速踏板、方向盘和档杆（无论是手动还是自动）的概念在全世界是通用的。如果你会开一辆车，你很有可能也会开一辆类似的。\n\
  \n同样，最易用的 API 是那些对用户需要最少新学习的 API。例如，大多数 `C++` 开发者熟悉标准库及其对迭代器的使用。因此，如果你决定编写一个具有类似要求的\
  \ API，模仿标准库的模式将是有益的。最后，一致性的一个重要方面是用一种方式做某事，而不是两种。毕竟，API 设计是关于决策的。然而，有时并没有清晰的方法，或者你可能被迫从多个来源获取反馈。但如果你最终提供了多种方法来实现，那么最终产品将更易于使用\
  \ (Martelli, 2011)。\n\n### 正交\n\n在数学中，如果两个向量彼此垂直（90 度），则称它们正交（即它们的内积为零）。这意味着它们线性独立的，意味着没有标量可以应用于第一个向量来产生第二个向量。用地理类比来说，东和北方向是独立的：向东走不会让你向北。可以说，东坐标的变化对北坐标没有影响。\n\
  \n在 API 设计方面，正交性意味着方法没有副作用。调用一个设置特定属性的方法应该改变该属性，而不是额外更改公开属性。结果是，对 API 一部分的修改不会对\
  \ API 的其他部分产生影响 (Raymond, 2003)。追求正交性会产生更具预测性且易于理解的 API 行为。此外，不产生副作用或不依赖其他代码副作用的代码更容易开发、测试、调试和更改，因为其影响是局部的且有限的\
  \ (Hunt and Thomas, 1999)。\n\n让我们来看一个具体的例子。也许你住过一家旅馆，淋浴的控制装置非常不直观。你希望能够设置水力和温度，但你只有一个控制，它似乎以一种复杂且不明显的方式影响这两个属性。可以使用以下\
  \ API 进行建模：\n\n![image](img/u02-28-9780443222191.jpg)\n\n为了进一步说明这一点，让我们考虑该类的公共方法的以下实现：\n\
  \n![image](img/u02-29-9780443222191.jpg)\n\n\n\n\n在这种情况下，你可以看到设置水流功率也会通过非线性关系影响水温。结果是无法实现某些温度和功率的组合，自然地，热水加全功率的这种优选组合是无法实现的。此外，如果你更改了\
  \ `SetPower()` 方法的实现，将会产生影响 `GetTemperature()` 方法结果的副作用。在更复杂的系统中，这种相互依赖关系可能是我们这些程序员忘记的或根本没有意识到的，因此对代码的某个区域进行简单更改可能会对系统其他部分的行为产生深远影响。\n\
  \n相反，让我们考虑一个理想的、正交淋浴接口，其中温度和功率的控制是独立的：\n\n![image](img/u02-30-9780443222191.jpg)\n\
  \n设计正交 API 时需要记住的两个重要因素是：\n\n1. **减少冗余。** 确保相同的信息不会以超过一种方式表示。每种知识都应该有一个单一的权威来源。\n\
  2. **增加独立性。** 确保暴露出的概念之间没有意义上的重叠。任何重叠的概念都应该分解为它们的基础组件。\n\n正交设计的另一种流行解释是，不同的操作可以应用于每个可用的数据类型。这是编程语言领域和\
  \ CPU 设计领域常用的一个定义。在后的情况下，正交指令集是指指令可以使用任何寻址模式的任何 CPU 寄存器的指令集，而在非正交设计中，某些指令只能使用某些寄存器。同样，从\
  \ API 设计的角度来看，标准库提供了一个极佳的示例。它提供了一组通用算法和迭代器，可以应用于任何容器。例如，标准库的 `std::count` 算法可以应用于\
  \ `std::vector`、`std::set` 或 `std::map` 的任何一个容器。因此，算法的选择不依赖于所使用的容器类。\n\n### 健壮的资源分配\n\
  \n`C++` 编程中最棘手的方面之一是内存管理。对于习惯于 `Java` 或 `C#` 等内存管理语言的开发者来说尤其如此，在这些语言中，对象由垃圾回收器自动释放。相比之下，大多数\
  \ `C++` 错误源于指针或引用的某种误用，例如：\n\n1. **空指针解引用**：尝试对 `nullptr` 使用 `->` 或 `*` 运算符。\n2.\
  \ **重复释放**：两次对同一块内存块调用 `delete` 或 `free()`。\n3. **访问无效内存**：尝试对尚未分配或已经释放的指针使用 `->`\
  \ 或 `*` 运算符。\n4. **混合分配器**：使用 `delete` 释放通过 `malloc()` 分配的内存，或使用 `free()` 返回通过 `new`\
  \ 分配的内存。\n5. **错误的数组去分配**：使用 `delete` 运算符而不是 `delete []` 来释放数组。\n6. **内存泄漏**：在完成对某块内存的使用后没有释放它。\n\
  \n这些问题的出现是因为无法判断一个普通的 `C++` 指针引用的是有效内存，还是指向了未分配或已释放的内存。因此，这依赖于程序员来跟踪这种状态并确保指针永远不会被错误解引用。但正如我们所知，程序员会出错的。然而，许多这类问题可以通过使用托管（或智能）指针来避免，例如：\n\
  \n1. **共享指针 (Shared pointers)**。这些是引用计数指针，当代码想要持有该指针时，引用计数加 1，当使用完该指针时，引用计数减 1。当引用计数归零时，指针指向的对象会被自动释放。这种指针可以帮助避免访问已释放内存的问题，因为它确保了指针在你想使用的期间一直保持有效。\n\
  2. **弱指针 (Weak pointers)**。弱指针包含一个指向对象的指针（通常是共享指针），但它对该对象的引用计数没有贡献。如果你有一个指向同一个对象的共享指针和一个弱指针，且共享指针被销毁，弱指针会立即变为空。通过这种方式，弱指针可以检测被指向的对象是否已过期：即它指向的对象的引用计数是否为零。这有助于避免悬挂指针问题（即可能引用了已释放内存的指针）。\n\
  3. **唯一指针 (Unique pointers)**。这些指针支持对单个对象的所有权，并在指针离开作用域时自动释放其指向的对象。它们有时也被称为作用域指针或自动指针。唯一指针定义为拥有单个对象，因此它们不能被复制或共享，但可以移动到新的所有者处。\n\
  \n这些智能指针并不是原始 `C++98` 规范的一部分。然而，`C++11` 通过 `std::shared_ptr`、`std::weak_ptr` 和 `std::unique_ptr`\
  \ 模板对它们提供了支持。\n\n使用这些智能指针可以让你的 API 变得更容易使用，并且不容易出现前面列出的内存错误。例如，使用 `std::shared_ptr`\
  \ 可以减轻用户显式释放动态创建对象的需要。相反，当对象不再被引用时，将被自动删除。例如，考虑一个允许通过名为 `CreateInstance()` 的工厂方法创建对象实例的\
  \ API：\n\n![image](img/u02-31-9780443222191.jpg)\n\n其中工厂方法的实现如下：\n\n![image](img/u02-32-9780443222191.jpg)\n\
  \n给定此 API，客户端可以这样创建 `MyObject` 实例：\n\n![image](img/u02-33-9780443222191.jpg)\n\n\
  在这个示例中，创建了两个 `MyObject` 实例，它们在 `ptr` 变量离开作用域时（在本例中为程序结束时）被销毁。如果 `CreateInstance()`\
  \ 方法简单的返回 `MyObject` 原始指针类型，那么在之前的示例中析构函数永远不会被调用。因此，智能指针可以简化内存管理，从而让你的 API 更更容易。\n\
  \n通常，如果你有一个返回应该由客户端删除的指针的函数，或者你预计客户端需要的时间比你的对象长，那么你应该使用智能指针返回它，例如 `std::shared_ptr`。另一方面，如果指针的所有权将被对象保留，你可以返回弱指针。例如：\n\
  \n![image](img/u02-34-9780443222191.jpg)\n\n值得注意的是，这些内存管理问题只是更通用的资源管理类的一个特例。例如，在操作互斥锁或文件句柄时也会遇到类似的问题。我们可以通过以下观察将智能指针的概念推广到资源管理任务中：资源分配是对象构造，而资源释放是对象析构。这通常被称为\
  \ RAII（资源获取即初始化）。\n\n\n\n\n\n显然，如果向方法传递空字符串，该代码将无法解锁互斥锁。结果是程序在下一次尝试调用方法时将死锁，因为互斥锁仍处于锁定状态。然而，你可以创建一个名为\
  \ `ScopedMutex` 的类，它的构造函数锁定互斥锁，析构函数再次解锁它。有了这样一个类，你可以将该方法重写为：\n\n![image](img/u02-36-9780443222191.jpg)\n\
  \n现在你可以确保无论方法何时返回，锁都会被释放，因为当 `ScopedMutex` 变量离开作用域时，互斥锁就会解锁。因此你不需要细致地检查每一个返回语句以确保它显式地释放了锁。此外，代码的可读性也大大提高。C++11\
  \ 通过 `std::lock_guard` 和 `std::scoped_lock` 类模板引入了对作用域锁的支持。\n\nAPI 设计方面的要点是：如果你的\
  \ API 提供了对某些资源分配和释放的访问，那么你应该考虑提供一个类来管理它，其中资源分配发生在构造函数中，释放发生在析构函数中（可能还会额外通过公共的 `Release()`\
  \ 方法，以便客户端对何时释放资源有更多控制权）。\n\n使用 RAII 需要注意的一点是，C++ 构造函数和析构函数没有返回值，你不应该在析构函数中触发异常。因此，在某些情况下\
  \ RAII 可能并不是最佳选择（例如，当你想检测错误并重试某些逻辑时）。\n\n## 平台无关\n\n良好的 C++ API 应该始终避免在其公共头文件中出现特定于平台的\
  \ `#if`/#ifdef` 行，因为这些行会在不同平台上产生不同的 API，或者在调试版本与发布版本之间产生不同的 API。如果你的 API 为你的问题领域提供了一个高层且逻辑的模型（这本应是如此），那么该\
  \ API 在不同平台之间产生差异的情况将非常少。\n\n例如，考虑一个封装了手机功能的 API。某些手机手机内置了 GPS 设备，可以提供手机的地理位置，但并非所有设备都具备此功能。然而，你永远不要通过你的\
  \ API 直接暴露这种情况，如下例所示：\n\n![image](img/u02-37-9780443222191.jpg)\n\n这种糟糕的设计在不同平台上创建了不同的\
  \ API。这迫使 API 的客户端将相同的平台特定性引入它们自己的应用程序中。例如，在前面的案例中，你的客户端必须对任何 `GetGPSLocation()`\
  \ 的调用使用完全相同的 `#if` 条件语句进行保护；否则它们的代码在其他平台上可能会因为未定义符号错误而无法编译。\n\n此外，如果在 API 的后续版本中你增加了对另一个设备类的支持（例如\
  \ Windows Mobile），你就必须更新公共头文件中的 `#if` 行以包含 `_WIN32_WCE`。这时，你的客户端必须找到它们代码中所有嵌入了 `TARGET_OS_IPHONE`\
  \ 定义的实例，并将其扩展以包含 `_WIN32_WCE`。这是因为你由于无意中暴露了 API 的实现细节。\n\n相反，你应该隐藏函数仅在某些平台上运行的这一事实，并提供一种方法来判断实现在当前平台上是否提供了所需的功能。例如：\n\
  \n![image](img/u02-38-9780443222191.jpg)\n\n现在你的 API 在所有平台上都是一致的，并且没有暴露哪些平台支持 GPS\
  \ 坐标的细节。客户端现在可以通过调用 `HasGPS()` 来检查当前设备是否支持 GPS 设备，如果是，它们就可以调用 `GetGPSLocation()`\
  \ 方法返回实际坐标。`HasGPS()` 方法的可能如下：\n\n![image](img/u02-39-9780443222191.jpg)\n\n这远优于原始设计，因为特定于平台的\
  \ `#if` 语句现在隐藏在 `.cpp` 文件中，而不是在头文件中暴露给客户端。\n\n维护平台无关性可能比较棘手的情况是，当你编写一个与特定平台资源接口的\
  \ API 时，例如一个在窗口中绘图并需要原生操作系统相应窗口句柄的例程。处理此问题的一种方法是将资源作为 `void *` 指针返回（即无类型指针）。虽然返回无类型指针通常是不受欢迎的，但它比让你的\
  \ API 变成平台特定的要好。例如，OpenCV API 将依赖于操作系统的句柄作为 `void *` 返回，要求客户端在应用程序代码将其强制转换为相应的类型（例如\
  \ Win32 上的 `HWND`、macOS 上的 `WindowRef` 或 X Windows 上的 `Widget *`）。以下是该 API 的示例：\n\
  \n![image](img/u02-40-9780443222191.jpg)\n\n## 松散耦合\n\n1974 年，Wayne Stevens、Glenford\
  \ Myers 和 Larry Constantine 发表了关于结构化设计的里程碑式论文。这篇论文引入了两个关联的概念：耦合和内聚，我将它们定义为：\n\n\
  1. **耦合**：衡量软件组件之间连接强度的度，即每个组件对彼此的依赖程度。\n2. **内聚**：衡量单个组件内部功能的内聚性或关联紧密程度。\n\n良好的软件设计倾向于低（松散）耦合和高内聚：即最小化组件之间的功能相关性和连接性。实现这一目标允许组件独立地使用、理解和维护。\n\
  \nSteve McConnell 为松散耦合提供了一个特别有效的类比。模型火车车厢使用简单的钩子或对接器来连接车厢。这些连接器通过单个连接点（通过推动两节车厢）轻松链接车厢。因此这就是松散耦合系统的例子。想象一下，如果你必须采用多种类型的连接（涉及螺丝和电线），或者只有特定的车厢才能与其他车厢接口，连接这些车厢将困难得多。\n\
  \n思考耦合的一种方式是：给定两个组件 A 和 B，如果 A 发生变化，B 中需要更改多少代码。可以使用多种方法评估组件间的耦合程度：\n\n1. **尺寸**：涉及组件间连接的数量，包括类、方法的数量以及每个方法的参数数量。例如，参数越少的方法对调用它的组件耦合越松。\n\
  2. **可见性**：涉及组件间连接的显著性。例如，通过更改全局变量来间接影响另一个组件的状态是非常糟糕的可见性水平。\n3. **亲密性**：涉及组件间连接的直接性。如果\
  \ A 耦合到 B，且 B 耦合到 C，那么 A 间接耦合到 C。另一个例子是继承一个类比将该类作为成员变量（组合）更紧耦合，因为继承还提供了对该类所有保护成员的访问。\n\
  4. **灵活性**：涉及更改组件间连接的难易程度。例如，如果 A 中方法的签名需要更改以便 B 调用，灵活性描述了更改该方法以及所有依赖代码的难易程度。\n\n\
  \n\n\n\n一种你应该始终避免的特别令人讨厌的紧耦合形式是两个组件直接或间接地相互依赖（即依赖周期或循环依赖）。这使得在不包含所有循环依赖组件的情况下，想要重用某个组件变得困难或不可能。我将在第\
  \ 4 章中进一步讨论这种形式的紧耦合。\n\n在接下来的章节中，我将介绍减少你的 API 内部类和方法之间耦合（API 间耦合）的各种技术。\n\n然而，还有一个有趣的问题：你的\
  \ API 设计决策如何影响客户端应用程序的内聚性和耦合（API 内部耦合）。你的 API 设计是为了解决特定问题，这种目的的统一应当很好地转化为你的 API\
  \ 成为客户端程序中一个高内聚的组件。然而，从耦合的角度来看，你的 API 越大——暴露的类、方法和参数越多——你的 API 被访问和与你的客户端应用程序耦合的方式就越多。因此，保持“最小完备”的质量也有助于实现松耦合。另一个问题是你设计的\
  \ API 中设计了多大程度与其他组件的耦合。例如，`libpng` 库依赖于 `libz` 库。这种耦合在编译时通过 `png.h` 中对 `zlib.h`\
  \ 头文件的引用暴露，在链接时也会暴露。这要求 `libpng` 的客户端感知到 `libz` 依赖，并确保他们也构建并链接了此额外的库。\n\n### 仅通过名称耦合\n\
  \n如果类 `A` 只需要知道类 `B` 的名称（即它不需要知道 `B` 的大小，或调用该类中的任何方法），那么类 `A` 就不需要依赖于 `B` 的完整声明。在这种情况下，你可以对类\
  \ `B` 使用前向声明，而不是包含整个接口，从而减少两个类之间的耦合 (Lakos, 1996)。例如：\n\n![image](img/u02-41-9780443222191.jpg)\n\
  \n在这种情况下，`MyObjectHolder` 只使用对 `MyObject` 的引用，因此它不需要 `#include \"MyObject.h\"` 来获取\
  \ `MyObject` 的完整声明。如果使用指向 `MyObject` 的指针，情况也是一样。通过使用前向声明，`MyObjectHolder` 类可以与 `MyObject`\
  \ 的物理实现解耦。\n\n### 减少类耦合\n\nScott Meyers 建议，每当你有选择时，你都应该优于将函数声明为非成员非友函数，而不是成员函数 (Meyers,\
  \ 2000)。这样做可以提高封装性，并降低这些函数与类耦合的耦合程度。例如，考虑以下类代码片段，它提供了一个 `PrintName()` 成员函数来将成员变量的值输出到\
  \ `stdout`。该函数使用公共 getter 方法 `GetName()` 来获取成员变量当前值：\n\n![image](img/u02-42-9780443222191.jpg)\n\
  \n遵循 Meyers 的建议，你应该优选这种表示：\n\n![image](img/u02-43-9780443222191.jpg)\n\n后一种形式减少了耦合，因为自由函数\
  \ `PrintName()` 只能访问 `MyObject` 的公共方法（在特定情况下，仅限 const 公共方法），而在 `PrintName()` 作为成员函数的形式中，它还可以访问\
  \ `MyObject` 的所有私有受保护成员函数及数据成员，如果它有基类，还可以访问任何基类的任何受保护成员。因此，优选非成员非友形式意味着函数与类的内部细节耦合。因此，当\
  \ `MyObject` 的内部细节发生变化时，它损坏的概率要小得多 (Tulach, 2008)。\n\n这种技术也有助于实现更最小完备的接口，其中类仅包含实现它所需的最小功能，而构建在其公共接口之上的功能则声明在类之外（正如我之前讨论的便利\
  \ API 示例所示）。值得注意的是，这在 C++ 标准库中经常发生，其中如 `std::for_each()` 和 `std::unique()` 等算法被声明在每个容器类之外。\n\
  \n为了更好地传达 `MyObject` 和 `PrintName()` 之间的概念相关性，你可以将它们都声明在一个命名空间内。或者，你可以将 `PrintName()`\
  \ 声明在自己的命名空间中，例如 `MyObjectHelper`，甚至作为名为 `MyObjectHelper` 的新类的静态函数。正如我讨论过的便利 API，这个辅助类可以包含在一个独立的模块中。例如：\n\
  \n![image](img/u02-44-9780443222191.jpg)\n\n### 刻意的冗余\n\n通常，良好的软件工程实践旨在消除冗余：以确保每个重要的知识或行为只实现一次\
  \ (Pierce, 2002)。然而，代码重用意味着耦合，有时为了增加小程度的重复来切断耦合是值得 (Parnas, 1979)。这种刻意的重复以代码或数据冗余的形式存在。\n\
  \n作为代码冗余的示例，考虑两个相互依赖的大组件。然而，当你深入调查这种依赖时，发现是一个组件依赖于一个平凡的功能，例如计算最小或最大。标准做法是为该功能寻找一个更层次的家，以便两个组件依赖于该功能而不是相互依赖。然而，有时这种重构没有意义（例如，如果该功能不够通用而无法降到较低层次）。因此，在某些情况下，复制代码可能是有意义的\
  \ (Lakos, 1996)。\n\n在添加数据冗余方面，考虑以下记录用户发送每条消息的聊天系统 API：\n\n![image](img/u02-45-9780443222191.jpg)\n\
  \n这种设计接受单个聊天事件，接收一个描述用户及其输入消息的对象。这些信息会附带当前时间戳并添加到内部列表中。然后可以使用 `GetCount()` 方法查找发生了多少次聊天事件，而\
  \ `GetMessage()` 方法将返回给定聊天事件的格式化版本，如下：\n\n![image](img/u02-46-9780443222191.jpg)\n\
  \n然而，`TextChatLog` 类显然与 `ChatUser` 类耦合，而后者可能是一个非常沉重的类，引入了许多其他依赖。因此，你可能决定调查这种情况，并发现\
  \ `TextChatLog` 始终使用用户的名称。也就是说，它保留了 `ChatUser` 对象但只调用 `ChatUser::GetName()` 方法。因此，消除这两个类之间耦合的解决方案将仅仅是将用户用户名传递给\
  \ `TextChatLog` 类，如下面的重构版本所示：\n\n\n\n\n\n![image](img/u02-47-9780443222191.jpg)这创建了用户名称的冗余版本（它现在同时存储在\
  \ `TextChatLog` 和 `ChatUser` 类中），但它打破了这两个类之间的依赖关系。如果 `sizeof(std::string) < sizeof(ChatUser)`，它还可能具有减少\
  \ `TextChatLog` 内存开销的额外处。\n\n尽管如此，即使这是刻意的重复，它仍然是重复，并且应该在极其审慎、经过周全考虑并配有极佳注释的情况下才进行。例如，如果聊天系统进行更新以允许用户更改名称，并且决定在发生这种情况时，该用户之前的所有消息都应该更新以显示新名称，那么你可能不得不回到原始的紧耦合版本（或者通过要求\
  \ `ChatUser` 在每次更改名称时通知 `TextChatLog` 来增加更多耦合风险）。\n\n### 管理类 (Manager classes)\n\
  \n管理类是拥有并协调多个低级类的类。这可以用于打破一个或多个类对一组低级类的依赖。这通常使用 `Façade`（外观）设计模式（我将在模式章节中介绍）或 `Mediator`（中者）设计模式来实现。两者之间的区别在于，`Façade`\
  \ 仅以不同的方式暴露现有的功能，而 `Mediator` 则增加了新功能。\n\n例如，考虑一个结构化的绘图程序，它允许你创建 2D 对象、选择对象并在画布上移动它们。该程序支持多种输入设备来让用户选择和移动对象，例如鼠标、平板板和摇杆。一种朴真的设计需要\
  \ `select` 和 `move` 操作都了解每种输入设备，如此 UML 图所示（Fig. 2.6）。\n\n或者，你可以引入一个管理类来协调对每个特定输入设备类的访问。这样，`SelectObject`\
  \ 和 `MoveObject` 类只需要依赖于这一个管理类，而管理类则只需要依赖于各个具体的输入设备类。这可能还需要为底层类创建某种形式的抽象。例如，注意 `MouseInput`、`TabletInput`\
  \ 和 `JoystickInput` 每一个都有略有不同的接口。因此，我们的管理类可以建立一个通用的输入设备接口，抽象掉特定设备的细节。改进后的、更松耦合的设计所示\
  \ Fig. 2.7。\n\n![image](img/f02-06-9780443222191.jpg)\n\n图 2.6 多个高级类，每个类都与多个低级类耦合。\n\
  \n![image](img/f02-07-9780443222191.jpg)\n\n图 2.7 使用管理类来减少对低级类的耦合。\n\n注意，这种设计也扩展良好。这是因为可以向系统添加更多输入设备，而不会为\
  \ `SelectObject` 或 `MoveObject` 引入进一步的依赖。此外，如果你决定添加额外的操作对象，例如 `RotateObject` 和 `ScaleObject`，它们只需要对\
  \ `InputManager` 单一依赖，而不是每个对象都引入底层设备类的进一步耦合。\n\n### 回调、观察者和通知 (Callbacks, observers,\
  \ and notifications)\n\n我将提出的减少 API 内部耦合的最后技术与当某些事件发生时通知其他类的问题有关。\n\n想象一个在线 3D 多人游戏，允许多个用户相互对抗。在内部，每个玩家可能用一个\
  \ `UUID` 表示，例如 `e5b43bba-fbf2-4f91-ac71-4f2a12d04847`。然而，用户想看到其他玩家的名字，而不是晦涩的 UUID\
  \ 字符串。因此，系统实现了玩家名称缓存 `NameCache`，用于存储 `UUID` 与可读名称之间的对应关系。\n\n现在，假设管理赛前大厅的类 `PreGameLobby`\
  \ 想要显示每个玩家的名字。操作 set 可能如下：\n\n1. `PreGameLobby` 类调用 `NameCache::RequestName()`，\n\
  2. `NameCache` 向游戏服务器请求该 `UUID` 玩家的名称，\n3. `NameCache` 从服务器接收玩家名称信息，并\n4. `NameCache`\
  \ 调用 `PreGameLobby::SetPlayerName()`。\n\n然而，在这种情况下，`PreGameLobby` 依赖于 `NameCache`\
  \ 来调用 `RequestName()`，而 `NameCache` 又依赖于 `PreGameLobby` 来调用 `SetPlayerName()`。这是一种过度脆弱的设计。考虑一下，如果系统需要在用户更改名称时更新该用户之前的消息，你可能不得不回到原始的紧耦合版本（或者通过要求\
  \ `ChatUser` 在每次更改名称时通知 `TextChatLog` 来增加更多耦合风险）。\n\n更好的解决方案是让 `PreGameLobby` 注册\
  \ `NameCache` 的更新。这样 `NameCache` 就可以在没有直接依赖的情况下通知任何感兴趣的。有几种方法可以实现这一点，例如回调、观察者和通知。在详细介绍这些之前，这里有在使用任何这些方案时需要理解的一些通用问题：\n\
  \n- **重入性 (Reentrancy)**** 在编写调用未知代码的 API 时，你必须考虑这些代码可能会调回你的 API。事实上，客户端可能并没有意识到这一点。例如，如果你正在处理一个对象队列并在处理每个对象时发出回调，回调可能会尝试通过添加或删除对象来修改队列的状态。至少，你的\
  \ API 应该通过代码错误防止这种行为。然而，更优雅的解决方案是允许这种重入行为，并实现代码以保持状态一致。\n- **生命周期管理 (Lifetime management)****\
  \ 客户端代码应该有一种清晰的方法与 API 断开（即声明它们不再接收更新）。这在客户端对象被删除时尤为重要，因为进一步对其发送消息可能会导致崩溃。同样，你的\
  \ API 可能希望防止重复注册，以避免对同一事件多次调用同一个客户端代码。\n- **事件顺序 (Event ordering)**** 回调或通知的顺序对于\
  \ API 用户来说应该是清晰的。例如，Cocoa API 很好地明确了通知是在事件之前还是之后发送的，使用了如 `willChange` 和 `didChange`\
  \ 这样的名称。另一方面，Qt 工具包在这一点不够具体：改变信号（changed signal）有时在问题对象实际更新之前发送。\n\n这些点突出了一个通用问题，即你应该始终向客户端明确他们在回调代码中可以做什么和不能做什么——他们对你的\
  \ API 可以和不能做哪些假设。这可以通过你的 API 文档来实现，也可以通过给回调一个仅暴露所有潜在操作的安全子集的限制接口来显式地执行。\n\n####\
  \ 回调函数 (Callback functions)\n\n在纯 C 中，回调仅仅是模块 A 内部函数的指针，该指针传递给模块 B，以便 B 在适当的时间调用\
  \ A 中的函数。模块 B 对模块 A 一无所知，且对 A 没有包含或链接依赖。这使得回调对于允许低级代码执行其无法建立链接依赖的高级代码特别有用。因此，回调是大型项目中打破循环依赖的一种流行技术。\n\
  \n\n\n\n\n有时，为回调函数提供一个闭包（closure）也是用的。这是 `module A` 传递给 `B` 的一些数据，`module B` 将其包含在传给\
  \ `A` 的函数回调中。这是 `module A` 传递某些对回调函数接收至关重要的状态的方法。\n\n下面的头文件展示了如何使用 `C++11` 语法定义一个简单的回调\
  \ API：\n\n![image](img/u02-48-9780443222191.jpg)\n\n（更复杂的示例将支持向 `ModuleB` 添加多个回调，可能将它们存储在\
  \ `std::vector` 中，然后按顺序调用每个已注册的回调）。\n\n这种方法存在几个问题。其之一对于面向对象的 `C++` 程序，使用非静态（实例）方法作为回调并不是易事。这是因为对象的\
  \ `this` 指针也需要被传递。`C++11` 为此提供了解决方案。你可以使用 `std::bind` 结合对象实例封装方法调用。或者你可以使用 `std::function`\
  \ 定义回调类型，然后使用一个捕获对象的 `lambda`。这里是后者的示例：\n\n![image](img/u02-49-9780443222191.jpg)\n\
  \n这种方法的另一个问题是使用未定义的 `void *` 参数将数据传递到回调函数中。如果你需要处理对象或向回调传递状态，那么使用基于对象的解决方案（如观察者模式）会更好。\n\
  \n### 观察者 (Observers)\n\n回调函数提供了一种在纯 `C` 程序中运行良好的解决方案，但更面向对象的解决方案是使用观察者概念。这是一种软件设计模式，对象维护一个其依赖对象（观察者）的列表，并通过调用它们的其中一个方法来通知它们。这是\
  \ API 设计中最小化耦合的一种非常重要的模式。事实上，我在“模式”章节中专门为它留了一个章节。我会推迟那时再对观察者进行详细讨论，但在这里简要介绍该主题，以便与之前的的回调函数方法进行比较。\n\
  \n实现观察者模式的通用方法是定义一个基类（通常是抽象基类），它声明了可以被调用的回调方法（或方法）。然后你可以根据特定的回调功能提供该接口的实现。你还可以将任何特定于你所需的存储在观察者类的数据成员中。例如：\n\
  \n![image](img/u02-50-9780443222191.jpg)\n\n然后，注册并调用你的观察者的模块可能如下。注意，我使用 `shared_pointer`\
  \ 存储观察者对象，以便代码对观察者的生命周期具有健壮性：\n\n![image](img/u02-51-9780443222191.jpg)\n\n你也可以使用函数对象（或\
  \ `functor`）来定义你的回调函数。这仅仅是一个实现了 `operator() ` 的类型。这样做的好处是，如果需要，它可以让对象的行为更像一个回调函数。例如：\n\
  \n![image](img/u02-52-9780443222191.jpg)\n\n### 通知 (Notifications)\n\n回调和观察者通常是为了特定任务而创建的，并且使用它们的机制通常定义在需要执行实际回调的对象内部。另一种解决方案是构建一个中心化的机制，在系统中不连接的各个之间发送通知或事件。发送者不需要预先知道接收者，因此可以用此来减少发送者和接收者之间的耦合。有几种类型的通知方案，但一种特别流行的方案是信号与槽（signals\
  \ and slots）。\n\n信号与槽的概念由 `Qt` 库引入，作为一种通用方法，允许将任何事件（例如按钮点击或定时器事件）发送到任何感兴趣的方法进行处理。然而，现在有若干种供在纯\
  \ `C++` 代码中使用的信号与槽的替代实现，包括 Boost 的 `boost::signals` 和 `boost::signals2` 库。\n\n信号可以简单地看作具有多个目标（槽）的回调。当该信号被调用或发射时，该信号的所有槽都会被调用。为了给出一个具体的例子，下面的代码段使用\
  \ `boost::signal` 创建了一个不带参数的信号。然后你将一个简单对象连接到信号。最后，你发射信号，这导致 `MySlot::operator()`\
  \ 被调用，从而向 `stdout` 打印消息：\n\n![image](img/u02-53-9780443222191.jpg)\n\n在实际使用中，底层类可以创建并拥有一个信号。它允许任何未连接的类将其添加为该信号的槽。然后底层类可以在任何适当的时间发射其信号，所有连接的槽都将被调用。\n\
  \n## 稳定、文档且经过测试 (Stable, documented, and tested)\n\n一个良好的 API 应该是稳定的且面向未来的。在这种背景下，稳定并不意味着它从不改变，而是意味着接口应该是版本化的，并且不应该发生不兼容的。与之相关，“面向未来”意味着\
  \ API 的设计应该是可扩展的，以便能够以优雅而非混乱的方式进行演进。\n\n一个良好的 API 还应该有良好的文档记录，以便户对功能、行为、最佳实践和错误条件有清晰的信息。最后，应该为\
  \ API 的实现编写广泛的测试，以确保新的更改不会破坏功能。\n\n\n\n\n\n设计模式是解决常见软件设计问题的通用方案。该术语由《设计模式：可复用面向对象设计元素》一书而流行，这本书也被称为“四人帮”书(Gamma\
  \ et al., 1994)）。该书引入了 23 种通用设计模式，并将其组织成三大类，这些类别在表 3.1 中列出。\n\n自 1994 年设计模式书籍首次出版以来，列表中又添加了几个设计模式，包括一类全新的并发设计模式分类。原作者还建议对核心（Core）、创建（Creational）、外围（Periphery）和其他（Other）进行改进的分类(Gamma\
  \ et al., 2009)。\n\n然而，本 API 书籍的意图并不是涵盖所有的设计模式。市场上还有许多其他专门介绍该主题的书。相反，我将集中关注对设计高质量\
  \ API 尤为重要的设计模式，并讨论它们在 C++ 中的具体实现。我还将涵盖一些 C++ 惯用，这些惯用可能不被视为真正的通用设计模式，但它们是 C++ API\
  \ 设计中重要的技术。具体来说，我将详细介绍这些技术：\n\n1. **Pimpl 惯用（Pimpl idiom）。** 这种技术允许你从公共头文件中完全隐藏内部细节。本质上，它让你私有成员数据和函数移动到\
  \ `.cpp` 文件中。因此，它是创建良好隔离 API 的不可不可少的工具。\n\n2. **单例和工厂方法（Singleton and Factory Methods）。**\
  \ 这是两种非常常见的创建设计模式，值得深入理解。当你想要强制只创建一个对象实例时，`Singleton` 非常有用。它在 C++ 中具有一些棘手的实现方面，我将对其进行探索。`Factory\
  \ Method`（工厂方法）模式提供了一种创建对象实例的通用方法，并且可以是隐藏派生类实现细节极极方法。\n\n3. **代理、适配器和外观（Proxy, Adapter,\
  \ and Façade）。** 这些结构模式描述了在现有不兼容或遗留接口之上封装 API 的各种解决方案。这通常是编写 API 的全部目标：改进某些设计糟糕的代码块的接口。`Proxy`（代理）和\
  \ `Adapter`（适配器）模式提供了新类到预存类的一对一映射，而 `Façade`（外观）则为更大的类集合提供了一个简化的接口。\n\n4. 表 3.1\n\
  \n   由 Gamma et al. (1994) 引入的 23 种设计模式。\n\n   | 创建模式 (Creational patterns) | |\n\
  \   | :--- | :--- |\n   | 抽象工厂 (Abstract Factory) | 封装一组相关的工厂。 |\n   | 构建器 (Builder)\
  \ | 将复杂对象的构造与其表示分离。 |\n   | 工厂方法 (Factory Method) | 让类将实例化推迟给子类。 |\n   | 原型 (Prototype)\
  \ | 指定一个类的原型的实例，该实例可以通过克隆来生成新对象。 |\n   | 单例 (Singleton) | 确保一个类只有一个实例。 |\n   | 结构模式\
  \ (Structural patterns) | |\n   | 适配器 (Adapter) | 将一个类的接口转换为另一种接口。 |\n   | 桥接 (Bridge)\
  \ | 将抽象与其实现解耦，以便两者都可以独立地更改。 |\n   | 组合 (Composite) | 将对象组合成树形结构以表示部分-整体层次结构。 |\n\
  \   | 装饰器 (Decorator) | 以动态方式向现有对象添加额外的行为。 |\n   | 外观 (Façade) | 为子系统中的一组接口提供统一的高层级接口。\
  \ |\n   | 权重 (Flyweight) | 使用共享来高效地支持大量细粒度对象。 |\n   | 代理 (Proxy) | 为另一个对象提供代理或占位符以控制对其的访问。\
  \ |\n   | 行为模式 (Behavioral patterns) | |\n   | 责任链 (Chain of Responsibility) | 给多个接收者对象处理来自发送者对象请求的机会。\
  \ |\n   | 命令 (Command) | 将请求或操作封装为对象，并支持可撤销的操作。 |\n   | 解释器 (Interpreter) | 指定如何表示和评估语言中的句子。\
  \ |\n   | 迭代器 (Iterator) | 提供一种顺序访问聚合对象元素的方法。 |\n   | 中介者 (Mediator) | 定义一个封装一组对象如何交互的对象。\
  \ |\n   | 备忘录 (Memento) | 捕获对象的内部状态以便以后恢复到相同的状态。 |\n   | 观察者 (Observer) | 允许对象之间的状态变化进行一对多的通知。\
  \ |\n   | 状态 (State) | 允许对象在内部状态改变时看起来改变了类型。 |\n   | 策略 (Strategy) | 定义一组算法，封装每一个算法并使它们在运行时可以切换。\
  \ |\n   | 模板方法 (Template Method) | 在操作中定义算法的骨架，将某些步骤推迟给子类。 |\n   | 访问者 (Visitor)\
  \ | 代表在对象结构的元素上执行的操作。 |\n\n5. **观察者（Observer）。** 这种行为模式可以用于减少类之间的直接依赖。它允许逻辑上不相关的类进行通信，通过允许一个类（`observer`）接收另一个类的通知。\n\
  \n在本章中涵盖这些模式和惯用之外，我还将在第 9 章讨论 `Thread-Safe Interface`模式](../978044322219100076/CH009)，并在第\
  \ 15 章讨论 `Visitor` 行为模式](../978044322219100040/CH015)。\n\n## Pimpl 惯用\n\npimpl 一术最早由\
  \ Jeff Sumner 提出，作为指向实现的指针的缩写(Sutter, 1999)。这种技术可以用于避免在头文件中暴露私有细节(图 3.1)。因此，它是帮助你维护\
  \ API 接口与实现之间强分离的重要机制。\n\n如果你在读完本书后改变了一个编程习惯，我希望你会在更多 API 代码中选择地使用 `pimpl`。\n\n\
  ### 使用 pimpl\n\npimpl 依赖于这样一个事实：在 C++ 类中定义一个指向前向声明类型的数据成员是可行的：即该类型仅通过名称引入，而尚未完全定义，从而允许我们将该类型的定义隐藏隐藏在\
  \ `.cpp` 文件中。这通常被称为不透明指针（opaque pointer），因为用户无法看到所指向对象的细节。从本质上说，pimpl 是对你的私有数据成员和函数进行逻辑和物理隐藏的一种。\n\
  \n```\n![image](img/f03-01-9780443222191.jpg)\n```\n\n图 3.1 pimpl 惯用，其中公共类有一个指向隐藏实现类的私有指针。\n\
  \n让我们看一个例子来阐明这一点。考虑以下关于 `autotimer` 的 API，这是一种在销毁时打印出它生存了多久的命名对象：\n\n```\n![image](img/u03-01-9780443222191.jpg)\n\
  ```\n\n\n\n\n\n此 API 违反了我在上一章中提出的许多重要特质。例如，它包含了特定平台的定义，并且它让定时器在不同平台上存储的底层实现细节对任何查看头文件的人都可见。公平地说，该\
  \ API 在仅将必要方法暴露为公共（public）方面做得很好（即构造函数和析构函数），并将剩余的方法和数据成员标记为私有（private）。然而，C++ 要求你在公共头文件中声明这些私有成员，这正是为什么你必须包含特定平台的\
  \ `#if` 指令。\n\n你真正想做的是是在 `.cpp` 文件中隐藏所有的私有成员。这样你就不需要包含任何那些烦人的平台特定内容了。`pimpl` 模式允许你实现这一点：将所有私有成员放入一个类（或\
  \ `struct`）中，该类在头文件中前置声明，但在 `.cpp` 文件中定义。例如，你可以使用 `pimpl` 来重构之前的头文件：\n\n![image](img/u03-02-9780443222191.jpg)\n\
  \n现在 API 变得整洁多了！没有了特定平台的预处理器指令，读者通过查看头文件无法看到类的任何私有成员。\n\n然而，这意味着的影响是，我们的 `AutoTimer`\
  \ 构造函数现在必须分配一个 `AutoTimer::Impl` 类型的对象，并在析构函数中销毁它。此外，所有私有成员都必须通过 `mImpl` 指针访问。不过，对于大多数实际情况，提供一个整洁且无实现的\
  \ API 带来的收益远大于这些成本。\n\n为了完整起见，让我们看看这个 pimpled 类配合工作时的底层实现是什么样的。由于存在特定平台的 `#ifdef`\
  \ 行，生成的 `.cpp` 文件看起来有点杂乱，但重要的是，这些杂乱内容现在完全被包含在 `.cpp` 文件中了：\n\n![image](img/u03-03-9780443222191.jpg)\n\
  \n在这里你可以看到 `AutoTimer::Impl` 类的定义，它包含了最初在头文件中暴露的所有私有方法和变量。请注意，`AutoTimer` 构造函数分配了一个新的\
  \ `AutoTimer::Impl` 对象并初始化了它的成员，而析构函数释放了该对象。\n\n在之前的设计中，我将 `Impl` 类声明为 `AutoTimer`\
  \ 类内部的私有嵌套类。声明为嵌套类可以避免这种特定实现的符号污染全局命名空间，而将其声明为私有意味着它不会污染你类的公共 API。然而，将其声明为私有引入了限制，即只有\
  \ `AutoTimer` 方法可以访问 `Impl` 的成员。`.cpp` 文件中的其他类或自由函数将无法访问 `Impl`。作为替代方案，如果这限制得太大，你可以改为将\
  \ `Impl` 类声明为公共嵌套类，如本例所示：\n\n![image](img/u03-04-9780443222191.jpg)\n\n另一个值得考虑的设计问题是在\
  \ `Impl` 类中放置多少逻辑。选项包括：\n\n1. 仅有私有成员变量，\n2. 私有成员变量和方法，或\n3. 公共类的所有方法，使得公共方法只是对 `Impl`\
  \ 类中等效方法的薄封装。\n\n这些选项每个在不同情况下可能都是合适的。然而，通常情况下，我推荐选项 2：将所有私有成员变量和私有方法都放在 `Impl` 类中。这让你能够维护数据以及操作这些数据的方法封装性，并让你避免在公共头文件中声明私有方法。请注意，我们在上一个示例中采用了这种设计方法，将\
  \ `GetElapsed()` 方法放在了 `Impl` 类内部。Herb Sutter 指出了这种方法的几个注意事项（Sutter, 1999）：\n\n\
  1. 你不能在实现类中隐藏私有虚方法。这些方法必须出现在公共类中，以便任何派生类都能重写它们。\n2. 你可能需要在实现类中添加一个指向公共类的指针，以便 `Impl`\
  \ 类可以调用公共方法。\n\n### 拷贝语义\n\n如果你不显式定义它们，C++ 编译器将为你的类创建一个拷贝构造函数和赋值运算符。然而，这些默认构造函数只会对你的对象执行浅拷贝。对于\
  \ pimpled 类来说这是糟糕的，因为这意味着如果客户端拷贝了你的对象，那么两个对象将指向同一个实现对象 `Impl`。但是，两个对象都会在它们的析构函数中尝试删除同一个\
  \ `Impl` 对象，这极可能导致崩溃。处理这个问题有两个主要选项：\n\n1. **使你的类变为不可拷贝。** 如果你不打算让用户创建对象的副本，那么你可以将对象声明为不可拷贝。从\
  \ C++11 开始，你可以通过使用 `= delete` 语法删除编译器生成的默认拷贝构造函数和赋值运算符函数来轻松地实现这一点。或者，如果你需要 C++98\
  \ 的解决方案，可以声明一个没有实现的拷贝构造函数和赋值运算符来防止编译器生成它们。\n2. **显式定义拷贝语义。** 如果你希望用户能够拷贝你的对象，那么你可以自己定义拷贝构造函数和赋值运算符。这些可以对你的对象执行深拷贝（即创建\
  \ `Impl` 的副本而不是仅仅拷贝指针）。我稍后会介绍如何编写自己的构造函数。然而，更好的解决方案是使用智能指针，因为它们已经有了拷贝语义。\n\n下一个代码示例提供了\
  \ `AutoTimer` API 的更新版本，我通过删除拷贝构造函数和赋值运算符使对象变为不可拷贝。相关的 `.cpp` 文件不需要更改：\n\n![image](img/u03-05-9780443222191.jpg)\n\
  \n\n\n\n另一种，你也可以使用 `std::unique_ptr` 代替 `std::shared_ptr` 作为使对象不可拷贝的另一种方法，因为唯一指针定义就是不可拷贝的。\n\
  \n使用 `shared_ptr` 或 `unique_ptr` 意味着当 `AutoTimer` 对象销毁时，`Impl` 对象将自动释放：你不再需要在析构函数中显式地\
  \ `delete` 它。因此，我们 `autotimer.cpp` 文件中的析构函数现在可以简化为：\n\n![image](img/u03-07-9780443222191.jpg)\n\
  \n### pimpl 的优点\n在类中使用 pimpl 模式有许多优点。这些包括：\n\n1.  •  **信息隐藏。** 私有成员现在完全从你的公共接口中隐藏了。这允许你保持实现细节的隐藏（对于闭源\
  \ API，它们是专有的）。这意味着你的公共头文件变得更加整洁，并更清晰地表达真实的公共接口。因此，用户可以更容易地阅读和理解它们。信息隐藏的另一个益处是，用户无法那么容易地使用肮脏手段来访问你的私有成员，例如执行以下操作，这在\
  \ C++ 中实际上是合法的（Lakos, 1996）：\n\n![image](img/u03-08-9780443222191.jpg)\n\n2.  •\
  \  **减少耦合。** 正如我之前的 `AutoTimer` 示例所示，如果没有 pimpl，你的公共头文件必须包含所有私有成员变量的头文件。在我们的示例中，这意味着必须包含\
  \ `windows.h` 或 `sys/time.h`。这增加了你的 API 与系统其他部分的编译时耦合。使用 pimpl，你可以将这些依赖移动到 `.cpp`\
  \ 文件中并移除这些耦合元素。\n\n3.  •  **更快的编译。** 将特定实现的包含移动到 `.cpp` 文件的另一个影响是你的 API 的包含层级减少了。这会对编译时间产生非常直接的影响（Lakos,\
  \ 1996）。我将在“性能”章节中详细介绍最小化包含依赖的益处。\n\n4.  •  **更好的二进制兼容性。** pimpled 对象的大小永远不会改变，因为你的对象始终是一个指针的大小。你对私有成员变量的任何更改（记住成员变量应该始终私有）只会影响隐藏在\
  \ `.cpp` 文件内部的实现类的大小。这使得在不改变对象二进制表示的情况下进行重大实现更改成为可能。\n\n### pimpl 的缺点\npimpl 模式的主要缺点是，你现在必须为创建的每个对象分配并释放额外的实现对象。这会增加对象的大小（增加指针的大小），并且由于访问所有成员变量所需的额外指针间接层，可能会引入性能损耗，以及额外调用\
  \ `new` 和 `delete` 的代价。如果你担心内存分配器的性能，可以考虑使用 Fast Pimpl 模式（Sutter, 1999），在该模式下，你为你的\
  \ `Impl` 类重载 `new` 和 `delete` 运算符，以使用更高效的小内存固定大小分配器。\n\n此外还有开发者上的额外不便，必须为所有私有成员访问加上类似\
  \ `mImpl->` 的前缀。由于额外的抽象层，这可能使得实现代码更难以阅读和调试。当 `Impl` 类有一个指向公共类的指针时，情况会变得更加复杂。然而，这些不便并不会暴露给\
  \ API 的用户，因此从 API 设计的角度来看，它们并不需要担心。这是你作为开发者必须为所有用户承担的负担，以让他们获得一个更整洁、更高效的 API。引用某位科学官和他的船长的话：“多数人的需求大于少数人的需求。”“或者一个人的需求。”\n\
  \n最后一个需要注意的问题是，编译器将不再捕获 `const` 方法内部成员变量的更改。这是因为成员变量现在存在于一个单独的对象中。你的编译器只会检查你没有在\
  \ `const` 方法中更改 `mImpl` 指针的值，而不会检查你是否更改了 `mImpl` 指向的任何成员。实际上，pimpled 类的每个成员函数都可以定义为\
  \ `const`（当然，构造函数或析构函数除外）。下面的 `const` 方法演示了这一点，它合法地更改 `Impl` 对象中的变量：\n\n![image](img/u03-09-9780443222191.jpg)\n\
  \n可以通过引入两个访问 `Impl` 指针的私有函数来解决：一个 `const` 一个非 `const`。这样，编译器就会强制你在 `const` 方法中使用\
  \ `const` 版本。\n\n### C 语言中的透明指针\n尽管到为止我主要关注的是 C++，但你也可以纯 C 中创建透明指针。概念是相同的：你创建一个指向仅在源文件中定义的结构体的指针。接下来的头文件展示了这可能是什么样子：\n\
  \n![image](img/u03-10-9780443222191.jpg)\n\n相关的 `.c` 文件可能看起来如下：\n\n![image](img/u03-11-9780443222191.jpg)\n\
  \n![image](img/u03-12-9780443222191.jpg)\n\n## 单例\n单例设计模式（Gamma et.al., 1994)）用于确保类只有一个实例。该模式还为该唯一实例提供了全局访问点（见图\
  \ 3.2](#CH0003_81-121_B9780443222191000192)）。你可以将单例理解为更优雅的全局变量。然而，与使用全局变量相比，它具有许多优点，因为它：\n\
  \n*   1. 强制只能创建一个类的实例。\n*   2. 提供了对对象分配和销毁的控制。\n*   3. 允许对对象的全局状态进行线程安全的。\n*   4.\
  \ 避免了污染全局命名空间。\n*   5. 避免了局部静态构造函数的非确定性初始化问题。\n\n单例模式适用于建模本质上是唯一的资源，例如访问系统时、全局剪贴板或键盘的类。它也适用于创建为多个资源提供单一访问点的管理类，例如线程管理器或事件管理器。另一方面，单例本质上仍然向你的系统添加全局变量的方法，尽管方式更容易管理。因此，它可能会在你的\
  \ API 中引入难以重构的全局状态和依赖。\n\n我决定在这里介绍单例的概念，部分是因为它们提供了一种实用且常见的 API 设计技术。然而，另一个原因是它们在\
  \ C++ 中实现稳健的实现相当复杂，因此讨论一些实现细节是值得的。此外，许多程序员倾向于过度使用单例模式，因此我想突出单例的缺点，并提供替代方案。\n\n###\
  \ 在 C++ 中实现单例\n\n\n\n\n\n单例模式涉及创建一个类，该类包含一个静态方法，该方法每次被调用时都会返回类的同一个实例。这个静态方法通常命名为\
  \ `GetInstance()` 或类似的名称。在设计单例类时，有几个 C++ 语言特征需要考虑：\n\n1. 你不希望客户端能够创建新实例。这可以通过将默认构造函数声明为私有（private）来实现，从而防止编译器将其自动创建公共（public）。\n\
  2. 你希望单例是不可拷贝的，以强制防止创建第二个实例。正如你之前看到的，这可以通过声明私有的拷贝构造函数和私有的赋值运算符来实现，或者使用从 C++11 开始引入的\
  \ `delete` 修饰符。\n3. 你希望防止客户端能够删除单例实例。这可以通过将析构函数声明为私有来实现。（但请注意，某些编译器，如 Borland 5.5\
  \ 和 Visual Studio 6，在尝试将析构函数声明为私有时，会错误地产生错误）。\n4. `GetInstance()` 方法可以返回指向单例类的指针或引用。然而，如果你返回指针，客户端可能会删除该对象。因此，你应该倾向于返回引用。\n\
  \n因此，截至 C++11，单例的一般形式如下：\n\n![image](img/u03-13-9780443222191.jpg)\n\n然后用户代码可以如下所示请求单例实例的引用：\n\
  \n![image](img/u03-14-9780443222191.jpg)\n\n注意，将构造函数和析构函数设私有也意味着客户端无法创建单例的子类。然而，如果你希望允许，你当然可以简单地将它们声明为保护的（protected）。\n\
  \n在实现方面，需要非常小心的一个区域是单例实例的分配方式。Scott Meyers 解释了一个需要识别的重要的 C++ 初始化问题：\n\n不同编译单元中非局部静态对象初始化的相对顺序是未定义的。\n\
  \n(Meyers, 2005)\n\n这意味着使用非局部静态变量来初始化我们的单例是危险的。非局部对象是在函数或方法之外声明的对象。静态对象包括全局对象、在类或函数内部声明为静态的对象，以及在文件或命名空间范围内定义的对象。因此，初始化我们的单例的一种方法是在类的方法内部创建一个静态变量，如下：\n\
  \n![image](img/u03-15-9780443222191.jpg)\n\n这种方法的一个良好特性是，实例只有在第一次调用 `GetInstance()`\
  \ 方法时才会被分配。这意味着如果从未请求单例，则对象就不会被分配。然而，缺点是，Andrei Alexandrescu 指出，这种技术依赖于静态变量的标准“后进先出”释放行为，在单例在其析构函数中调用其他单例的情况下，可能会导致单例在不应该释放时先被释放。作为该问题的例子，考虑两个单例：`Clipboard`\
  \ 和 `LogFile`。当 `Clipboard` 实例化时，它也会实例化 `LogFile` 以输出一些诊断信息。在程序退出时，`LogFile` 先被破坏，因为它是最后创建的，然后\
  \ `Clipboard` 被破坏。然而，`Clipboard` 的析构函数尝试调用 `LogFile` 来记录它正在被销毁的事，但 `LogFile` 已经释放了。这极可能导致程序退出时崩溃。\n\
  \n在他的 *Modern C++ Design* 一书中，Alexandrescu 为这个析构顺序问题提供了几种解决方案，包括在单例被销毁后如果仍需要则将其复活、增加单例的寿命使其比其他单例存得久，以及简单地不释放单例（即依赖操作系统释放所有分配的内存并关闭任何文件句柄）。如果你发现自己需要实现这些解决方案之一，我建议你参考这本书获取详情（Alexandrescu,\
  \ 2001）。\n\n在使用单例时需要注意的另一个问题是，进程有自己的地址空间，因此加载给定库的每个进程将具有任何静态变量的自己的实例。此外，在运行时通过 `dlopen`\
  \ 打开的插件中定义的静态变量可能与其他插件甚至主程序不共享相同的内存地址，因此在插件中使用单例是不安全的。\n\n### 单例与线程安全\n\nC++98 和\
  \ C++03 标准没有规定代码在多线程环境下的行为。特别是，静态变量的初始化不是线程安全的。在这些早期版本的标准下，如果两个线程恰好同时调用我们的 `GetInstance()`\
  \ 方法，那么实例可能会被构造两次，或者在被另一个线程完全初始化之前就被其中一个线程使用。\n\n这个问题在 C++11 标准中得到了解决，该标准规定只有一个线程可以进入静态变量的初始化。在本书的第一版中，我花了几页的内容描述了\
  \ C++03 中线程安全的单例，并引入了互斥锁。然而，此时 C++11 已经非常成熟，如果你想编写线程安全的代码，至少应该使用 C++11。\n\n### 单例与依赖注入\n\
  \n依赖注入是将对象传入类中（注入），而不是由类自己创建它的技术。Martin Fowler 在 2004 年创造了这一术语，作为控制反转概念的一种更具体的形式。作为一个简单的例子，考虑这个依赖\
  \ `Database` 对象的类：\n\n![image](img/u03-16-9780443222191.jpg)\n\n这种方法的问题在于，如果 `Database`\
  \ 构造函数发生了变化，或者有人更改了数据库中 `user` 账户的密码，你就必须更改 `MyClass` 来修复这个问题。此外，单元测试很难很难，因为数据库实现嵌入其中。从效率的角度来看，每个\
  \ `MyClass` 实例都会创建一个 `Database` 实例。作为替代方案，你可以使用依赖注入将预先配置的 `Database` 对象传递给 `MyClass`如下：\n\
  \n![image](img/u03-17-9780443222191.jpg)\n\n通过这种方式，`MyClass` 不再需要知道如何创建 `Database`\
  \ 实例。相反，它获得一个已经构造并配置好的 `Database` 对象供其使用。我将原始指针更改为智能指针，以便依赖可以基于抽象接口而不是具体对象，并且因为\
  \ `MyClass` 不再控制数据库对象的生命。例如，如果我们有一个抽象 `Database` 类型的具体子类 `MyDatabase`，那么 `MyClass`\
  \ 对象可以这样创建：\n\n![image](img/u03-18-9780443222191.jpg)\n\n或者，更好的是，你可以使用工厂方法（我将在本章晚些时候讨论）来创建实例，例如：\n\
  \n![image](img/u03-19-9780443222191.jpg)\n\n\n\n\n本示例演示了构造函数注入（即通过构造函数传递依赖对象），但你同样可以方便地通过\
  \ setter 成员函数传递依赖。\n\n依赖注入可以被视为一种避免单例模式泛滥的方法，它通过鼓励接口接受单例实例作为输入，而不是在内部通过 `GetInstance()`\
  \ 方法请求它。这使得单元测试变得更加容易，因为对象的依赖可以为了测试目的被替换为存根（stub）或模拟（mock）版本（例如，通过在测试代码中传递一个 `TestDatabase`\
  \ 实例）。我将在“测试”章节中进一步讨论这一点。\n\n### 单例与单例态（Monostate）\n\n与单例模式相关的大多数问题源于其设计目的是为了持有并控制对全局状态的访问。然而，如果你不需要控制状态何时初始化，或者如果你不需要在单例对象本身中存储状态，那么可以使用其他技术，例如单例态设计模式。\n\
  \n单例态模式允许创建类的多个实例，其中所有实例都使用相同的静态数据。例如，这里有一个单例态模式的简单案例：\n\n![image](img/u03-20-9780443222191.jpg)\n\
  \n在这个示例中，你可以创建 `Monostate` 类的多个实例，但对 `GetTheAnswer()` 方法的所有调用都返回相同的结果，因为所有实例共享同一个静态变量\
  \ `sAnswer`。你也可以仅仅通过在 `monostate.cpp` 中将其声明为文件作用范围的静态变量而不是私有类静态变量，来完全从头文件中隐藏该静态变量的声明。静态成员不影响类每个实例的大小，因此这样做对\
  \ API 不产生物理影响，除了从头文件中隐藏实现细节之外。\n\n单例态模式的某些优点包括它：\n\n1. 允许创建多个实例。\n2. 提供了透明的使用，因为不需要特殊的\
  \ `GetInstance()` 方法。\n3. 通过使用静态变量展现了定义良好的创建和销毁语义。\n\n正如 Robert C. Martin 所言，单例模式通过只允许创建一个实例来强制执行**唯一性结构**，而单例态通过为所有实例共享相同的数据来强制执行**唯一性行为**\
  \ (Martin, 2002)。\n\n另一个真实的例子是，Second Life 的源代码对其 `LLWeb` 类使用了单例态模式。这个示例使用了一个所有成员函数都声明为静态的单例态版本：\n\
  \n![image](img/u03-21-9780443222191.jpg)\n\n在这种情况下，`LLWeb` 仅仅是一个管理类，为打开 Web 页面的功能提供单一访问点。真正的\
  \ Web 浏览器功能在其他类中实现。`LLWeb` 类本身不持有任何状态，尽管内部任何静态方法都可以访问静态变量。注意，实现此点的另一种方法是创建一个 `LLWeb`\
  \ 命名空间并在该空间内创建自由函数。\n\n这种静态方法版本的单例态有一个缺点，你不能对任何静态方法进行子类，因为静态成员函数不能是虚函数。此外，由于你不再实例化该类，因此无法编写构造函数或析构函数来执行任何初始化或清理。这在情况下是必要的，因为\
  \ `LLWeb` 访问的是动态分配的全局状态，而不是依赖编译器初始化的静态变量。`LLWeb` 的创建者通过引入 `initClass()` 静态方法绕过了这一限制，它要求客户端程序显式地初始化类。更好的设计可能是将此调用隐藏在\
  \ `.cpp` 文件中，并在每个公共静态方法中懒地调用它。然而，在那种情况下，我之前提到的线程安全问题也将适用。\n\n### 单例与会话状态\n\n在最近的一次回顾性采访中，原《设计模式》书的作者表示，他们唯一考虑从原始列表中移除的模式就是单例。这是因为单例本质上是存储全局数据的方法，并且往往是设计糟糕的指标\
  \ (Gamma et al., 2009)。\n\n因此，作为关于单例主题的最后说明，我敦促你认真思考单例是否真的是你需求的正确模式。人们往往容易认为自己只需要给定类的单个实例。然而，需求会变化，代码会演进，在未来你可能会发现你需要支持该类的多个实例。\n\
  \n例如，考虑你正在编写一个简单的文本编辑器。你使用一个单例来持有当前的文本样式（例如加粗、斜体、下划线），因为用户同一时间只能激活一种样式。然而，这种限制之所以有效，是因为最初的假设是程序一次只能编辑一个文档。在程序的后一个版本中，你被要求添加对多个文档的支持，每个文档都有自己的当前文本样式。现在你必须重构代码以移除单例。归根结底，单例应该只用于建模在本质上确实是唯一的对象。例如，系统只有一个剪贴板，因此为文本编辑器将剪贴板建模为单例可能仍然是。\n\
  \n通常，在系统早期引入一个会话或执行上下文对象是有用的。这是一个持有所有状态的单实例，而不是用多个单例来表示这些状态。例如，在文本编辑器的示例中，你可以引入一个\
  \ `Document` 对象。它将拥有文本样式等内容的访问器，但这些对象不必被强制为单例。它们只是普通的类，可以通过 `Document` 类通过 `document->GetTextStyle()`\
  \ 进行访问。你可以从单个 `Document` 实例开始，通过类似 `Document::GetCurrent()` 的调用来访问。你甚至可以一开始将 `Document`\
  \ 实现为单例。然而，如果你以后需要添加对多个上下文（即多个文档），Rainsberger 将此称为“工具箱单例”（Toolbox Singleton），其中应用程序本身变成了单例，而不是各个类\
  \ (Rainsberger, 2001)。\n\n## 工厂方法\n\n工厂方法是一种创建设计模式，允许你在无需指定创建的具体 C++ 类型的情况下创建对象。本质上，工厂方法是构造函数的泛化。C++\
  \ 构造函数有若干局限性，例如：\n\n1. **没有返回结果**。你不能从构造函数返回结果。这意味着你无法在对象初始化期间通过返回 `nullptr` 来信号错误（尽管你可以在构造函数中抛出异常来信号错误）。\n\
  2. **命名限制**。构造函数很容易被区分，因为它被限制为具有与所在类相同的名称。然而，这也限制了它的灵活性。例如，你不能有两个都接受单个整数参数的构造函数。\n\
  \n\n\n\n* 3. **静态绑定创建。** 在构造对象时，你必须指定一个编译时已知的具体类名称（例如，你可能会写：`Foo *f = new Foo;`，其中\
  \ `Foo` 是编译器必须识别的特定类型）。在 C++ 中，构造函数没有运行时运行的动态绑定概念。\n\n* 4. **没有虚构造函数。** 你不能在 C++\
  \ 中声明虚构造函数。正如我刚刚指出的，你必须在编译时指定要构造对象的精确类型。因此，编译器会为该特定类型分配内存，然后为任何基类调用默认构造函数（除非你在初始化列表中显式指定了非默认构造函数）。接着，它会调用该特定类型自身的构造函数。这也是为什么你不能在构造函数中调用虚方法并期望它们调用派生类的重写版本（因为派生类尚未被初始化）。\n\
  \n相比之下，工厂方法（Factory Methods）规避了所有的局限性。从基础层面来说，工厂方法只是一个可以返回类实例的普通方法调用。然而，它们通常与继承结合使用，其中派生类可以重写工厂方法并返回该派生类的实例。使用抽象基类（ABCs）来实现工厂也是非常常见的（DeLoura,\
  \ 2001）。因此，在我深入探讨使用工厂方法之前，让我们先回顾一下什么是 ABC，以及相关的接口（interfaces）概念。\n\n### 抽象基类与接口\n\
  \nABC（抽象基类）是一个包含一个或多个纯虚成员函数的类。这种类不是具体的，因此不能使用 `new` 运算符实例化。相反，它被用作基类，派生类可以在其中为每个纯虚方法提供实现。\n\
  \n还有一个相关的术语叫做“接口”。像 Java 这样的语言有一个名为 `interface` 的实际关键字，但在 C++ 的语文中，该术语的定义并不那么明确。一些\
  \ C++ 开发者认为它是 ABC 的同义词。然而，我认为通常公识的是，接口是抽象类的更具体版本，它只包含纯虚函数（即它没有实现代码或状态），而 ABC 术语更泛地指的是具有一个或多个纯虚函数但也可以具有非纯虚函数、实现代码或数据成员的类。例如，考虑以下代码：\n\
  \n![image](img/u03-22-9780443222191.jpg)\n\n这定义了一个描述极其简单的 3D 图形渲染器的接口。我用 `I` 前缀命名该类，以表示这是一个接口。另一种命名约定可能是使用诸如\
  \ `-able`、`-ible` 或 `-ing` 的后缀（例如 `Renderable`）。方法上的 `= 0` 后缀将它们声明为纯虚方法，这意味着为了使该类具体，必须在派生类中重写它们。因此，`IRenderer`\
  \ 类是一个接口，除了默认的虚析构函数外，它只包含纯虚函数。\n\n注意，说纯虚方法没有实现是不严格准确的。你可以在 `.cpp` 文件中为纯虚方法提供默认实现。例如，你可以在\
  \ `renderer.cpp` 中为 `SetViewportSize()` 提供实现，然后派生类就可以调用 `IRenderer::SetViewportSize()`，尽管仍然仍然显式地重写该方法。根据我们之前的定义，我们更倾向于称之为\
  \ ABC 而非接口，因为它为一个或多个虚函数提供了实现。\n\nABC 或接口用于描述可以被多个类共享的抽象行为单元。它们规定了所有具体派生类必须遵循的约定。如果你只想为对象定义遵循的一\
  \ set 规则而不定义任何特定行为，你可以使用接口。或者，如果你还想为这些规则提供默认实现，你就会使用 ABC。\n\n与任何具有一个或多个虚方法的类一样，你应该始终将\
  \ ABC 或接口的析构函数声明为虚。这段代码说明了为什么这很重要：\n\n![image](img/u03-23-9780443222191.jpg)\n\n\
  ### 简单工厂示例\n\n现在我已经回顾了 ABC 和接口的概念，让我们使用它们来提供一个简单的工厂方法。我将继续之前的 `renderer.h` 示例，并开始为\
  \ `IRenderer` 类型对象声明工厂：\n\n![image](img/u03-24-9780443222191.jpg)\n\n声明工厂方法就这些了：它只是一个可以返回对象实例的普通方法。注意，此方法不能返回特定类型\
  \ `IRenderer` 的实例，因为它是抽象类且不能被实例化。然而，它可以返回派生类的实例。此外，你可以使用 `CreateRenderer()` 的字符串参数来指定你想要创建的派生类型。\n\
  \n假设你已经实现了 `IRenderer` 的三个具体派生类：`OpenGLRenderer`、`DirectXRenderer` 和 `MesaRenderer`。让我们进一步指定，你不希望你的\
  \ API 用户了解这些类型存在的事：它们必须被完全隐藏起来。基于这些条件，你可以这样提供工厂方法的实现：\n\n![image](img/u03-25-9780443222191.jpg)\n\
  \n因此，该工厂方法可以根据传入的字符串返回三个派生类之一。这允许用户在运行时而非编译时（如普通构造函数要求那样）决定派生类。这是一个巨大的优势，意味着你可以根据用户输入或运行时读取的文件内容创建不同的类。\n\
  \n此外，注意各种派生类的头文件仅包含工厂的 `.cpp` 文件中。它们没有出现在 `rendererfactory.h` 公共头文件中。实际上这些是私有头文件，不需要随你的\
  \ API 分发。这样，用户永远无法看到不同渲染器的私有细节，无法看到实现这些不同渲染器的特定类型。用户仅通过字符串值指定渲染器，如果你预计渲染器集在编译时静态定义，则可以使用枚举。\n\
  \n这个示例展示了一个完全可以的工厂方法。然而，一个潜在的缺点是它硬编码了可用派生类的知识。如果你向系统添加新的渲染器，必须编辑 `rendererfactory.cpp`。这并不是非常困难，最重要的是，它不会影响公共\
  \ API。然而，这意味着你无法在运行时添加新的派生类支持。具体来说，这意味着你的用户无法向系统添加新的渲染器。我将通过展示一个可扩展的对象工厂来解决这些问题。\n\
  \n### 可扩展工厂示例\n\n为了将具体派生类与工厂方法解耦并允许在运行时添加派生类，你可以更新工厂类以维护一个将类型名称与对象创建回调关联的映射（Alexandrescu,\
  \ 2001）。然后你可以通过几个新方法调用允许对新派生类的注册和注销。在运行时注册新类的能力使得这种形式的工厂方法可以用于为你的 API 创建可扩展的插件接口，我将在第\
  \ 12 章中详细介绍](../B9780443222191000210/CH0012_443-485_B9780443222191000210.xhtml)。\n\
  \n\n\n\n另一个需要注意的问题是，工厂对象现在必须持有状态。因此，最好的做法是强制只创建一个工厂对象。这就是为什么大多数工厂对象也是单例的。然而，为了简单起见，我将在我们的示例中使用静态方法和变量。将所有这些点结合起来，我们的新对象工厂可能看起来如下：\n\
  \n![image](img/u03-26-9780443222191.jpg)\n\n为了完整性，关联的 `.cpp` 文件可能如下：\n\n![image](img/u03-27-9780443222191.jpg)\n\
  \n你的 API 使用者现在可以在你的系统中注册（并注销）新的渲染器。编译器将确保用户的新渲染器符合你的 `IRenderer` 接口（即它为 `IRenderer`\
  \ 中的所有纯虚函数都提供了实现）。为了说明这一点，接后的代码展示了用户如何定义自己的渲染器，将其注册到对象工厂中，然后请求工厂创建一个实例：\n\n![image](img/u03-28-9780443222191.jpg)\n\
  \n这里一个值得注意的一点是，我向 `UserRenderer` 类添加了一个 `Create()` 函数。这是因为工厂的 `register` 方法需要接受一个返回对象的回调。这个回调不需要是\
  \ `IRenderer` 类的一部分（例如，它可以是一个自由函数）。但是，将它添加到 `IRenderer` 类中是一个好主意，可以将所有相关功能保持在同一个地方。\n\
  \n请注意，在之前的可扩展工厂示例中，渲染器回调在运行时必须对 `RegisterRenderer()` 函数可见。然而，这并不意味着你必须暴露 API 内置的渲染器。这些可以通过在你的\
  \ API 初始化例程中注册它们，或者通过使用简单工厂和可扩展工厂的混合模式来隐藏。在这种混合模式中，`Factory Method` 首先检查类型字符串与几个内置名称，如果都不匹配，它会检查由用户注册的任何名称。这种混合方法具有潜在的理想行为，用户无法覆盖你的内置类。\n\
