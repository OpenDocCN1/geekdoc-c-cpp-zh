  \n![image](img/bm24-9780443222191.jpg)\n\n如果你希望你的源代码能够在一系列 Unix 平台上轻松编译，而不必担心每个平台创建库的特殊性，那么\
  \ `libtool` 脚本将非常有用。另一个处理库的有用命令是 `nm`，它可以用于显示对象文件或库中的符号名称。这对于查找库是否定义或使用了给定的符号非常有用。例如，此命令行将输出库中所有的全局（外部）符号：\n\
