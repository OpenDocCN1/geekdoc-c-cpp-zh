  \n#### 从 C++ 调用 C 函数\n\nC++ 编译器也可以编译 C 代码，即使你编写的是 C API，你可能也希望 C++ 客户端使用你的 API。这是一个相对简单的任务，我建议在发布\
  \ C API 时作为常规工作来。\n\n第一步是确保你的代码可以在 C++ 编译器下编译。正如我已经提到的，C 标准更加宽松，因此 C 编译器允许你写出更粗糙的代码。\n\
  \n在这个过程中，你当然想确保在代码中不使用任何 C++ 保留关键字。例如，以下代码是合法的 C，但在 C++ 编译器下会报错，因为 `class` 是 C++\
  \ 中的一个保留字：\n\n![image](img/u05-07-9780443222191.jpg)\n\n\n\n\n最后，`C` 函数的链接方式与 `C++`\
  \ 函数不同。也就是说，同一个函数在 `C` 编译器和 `C++` 编译器生成的对象文件中表示方式不同。其原因之一是 `C++` 支持函数重载：即声明多个具有相同名称但参数或返回值值不同的方法。因此，`C++`\
  \ 函数名会经过“名字修饰（name mangling）”，以在符号名中编码额外的信息，例如每个参数的数量和类型。由于这种链接方式的差异，你无法编译使用了某个函数（例如\
  \ `DoAction()`）的 `C++` 代码，然后将其链接到由 `C` 编译器生成的、定义了 `DoAction()` 函数的库上。\n\n为了解决这个问题，你必须将你的\
  \ `C` API 封装在 `extern \"C\"` 结构中，这会告诉 `C++` 编译器包含的函数应该使用 C 风格的链接。`C` 编译器无法解析此语句，因此最好只针对\
  \ `C++` 编译器对其进行条件编译。这段代码段说明了这一最佳实践：\n\n![image](img/u05-08-9780443222191.jpg)\n\n\
