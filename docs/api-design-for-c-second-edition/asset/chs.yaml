  \ `Stack` 数据结构作为参数，通常作为第一个参数。还要注意，函数名称通常必须包含某些对其操作的数据的指示，因为该名称不像在 C++ 中那样在类声明中具有作用域性。在这种情况下，我选择用\
  \ `Stack` 词作为每个函数的前缀，以明确这些函数是操作 `Stack` 数据结构的。这个示例可以通过使用不透明指针来隐藏私有数据进行进一步改进，例如：\n\
