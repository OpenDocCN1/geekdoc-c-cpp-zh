    \n# Chapter 6: Working with User-Defined Functions When You Work with Python\n\
    \n![../../Images/Python%20Programming/temple-cerulean-421274-unsplash.jpg](images/00006.jpeg)\n\
    \nFunctions are going to be something that many different coding languages are\
    \ going to share in common. It is going to be a block of code that you are able\
    \ to recycle to help you to work on a specific task. However, when you take some\
    \ time to define one of these functions in `python`, you have to understand what\
    \ the two main types of functions are, or you are going to run into some troubles\
    \ along the way—and these two types are going to include the built-in functions\
    \ and the user-defined functions.\n\nThe first kind, or the built-in functions,\
    \ are going to be the ones that come with `Python`, the ones that are found in\
    \ the libraries of this coding language. But you are able to define some of your\
    \ own functions, based on your project, and these are the user-defined functions.\
    \ In `Python`, all of the functions will need to be treated like objects, which\
    \ can often make things a lot easier to work with, as you will see in a moment.\n\
    \nAs we go through this chapter, we will spend some time focusing on the user-defined\
    \ functions and how you will be able to use these for your projects. To make this\
    \ kind of concept a bit easier to work with, we are going to bring in some examples\
    \ of how to work with these user-defined functions. Before we do that though,\
    \ let’s look below and figure out a few of the important concepts that are needed\
    \ to make more sense of these user-defined functions.\n\n## Why Are User-Defined\
    \ Functions So Important?\n\nTo keep it simple, in most cases, the developer is\
    \ able to write out a code to have their own user-defined functions, or, if you\
    \ are a beginner in this, you are able to use a third-party library that helps\
    \ out with these. Sometimes these functions are going to be able to provide you\
    \ with a distinct advantage, and some neat things that you can do, depending on\
    \ the way that you would like to use them up in the code. However, there are going\
    \ to be some things that a developer will have to remember about these functions,\
    \ and the way that they work in your code, including:\n\n- These functions are\
    \ going to be made out of code blocks that are reusable. It is necessary only\
    \ to write them out once, and then you can use them as many times as you need\
    \ in the code. You can even take that user-defined function and use it in some\
    \ of your other applications as well.\n- These functions can also be very useful.\
    \ You can use them to help with anything that you want from writing out specific\
    \ logic in business to working on common utilities. You can also modify them based\
    \ on your own requirements to make the program work properly.\n- The code is often\
    \ going to be friendly for developers, easy to maintain, and well-organized all\
    \ at once. This means that you are able to support the approach for modular design.\n\
    - You are able to write out these types of functions independently. And the tasks\
