    # Chapter 2: The Basics You Need to Know About the Python Code


    ![../../Images/Python%20Programming/fatos-bytyqi-535528-unsplash.jpg](images/00002.jpeg)


    Now that we have taken the time to learn a bit more about Python learning and
    all of the neat things that you are able to do with it, it is time to look a bit
    more in depth when it comes to the different parts that are available with Python.
    There are a lot of basic parts that are going to show up in almost every code
    that you decide to write. You will notice that there are keywords that tell the
    program how to run. You will see that there are functions and identifiers and
    a lot of other parts of the code that are super important.


    As a beginner, it is a good idea to get a handle on these different parts so that
    you are able to get the best results overall. These will make it easier to work
    with some of the other parts that we talk about and will ensure you can write
    out codes that suit your needs. Some of the basics that show up in the Python
    codes you will write include:


    ## The Keywords


    The first thing that we need to look at here is the keywords. These seem pretty
    simple, but it is so important to understand that they basically tell the compiler
    how it needs to act and behave with the projects that you are doing. These keywords
    are ones that are reserved to tell the compiler what it needs to do. Since they
    are reserved, the computer programmer needs to remember to use them properly so
    that the compiler can take that command and get things done.


    You need only to use them in the specified parts of the code, or it leads to error
    messages and other problems. If you use them in the proper manner, the compiler
    will be given command of what you want it to do, and it can then execute the code
    in the right way. These words are important to the whole code, and learning what
    they are is going to make code writing easier as well. You will be able to notice
    a lot of these keywords as we progress through this guidebook and write some of
    our own codes.


    ## The Importance of the Identifiers


    The next thing that you need to learn about when you are writing your own codes
    is the identifiers. These identifiers are going to come in handy when you are
    writing out codes in Python, and there are actually a number of these that you
    can work with. You will find that they do have a few names to them, and you may
    see them through this guidebook as `variables`, `functions`, `classes`, and `functions()`—
    to name a few.


    The good news here is that even though all of them have different names attached
    to them, and work in different ways in the code, they are still going to have
    the same rules when it is time to label and name them. This can make it a lot
    easier to remember the rules, ensuring that you do it the right way and that the
    information can be called out when the code needs it the most.


    So, when naming these identifiers, the first rule that you have to keep in mind
    how to name these. There are a lot of options that you can work with when it is
    time to name one of these identifiers. For example, you can use the underscore
    symbol, any number, and both lowercase and uppercase letters to get this all done.
    You are also able to do any kind of combination of this that you would like to
    name the identifier that you are using properly.


    However, you have to remember that there is an order that needs to happen with
    these, or they are not going to react the way that you would like. First, you
    are not able to start the name of this identifier with a number. You also do not
    want to leave any spaces if you are using more than one word to name the identifier.
    So, you are not able to write out the name of an identifier as `3 kids` or `three
    kids`, but you could do `threekids` or `three_kids`, and it would save right.
    If you try to go against any of these rules, you will see that the compiler will
    bring up an error signal for you. When you are trying to pick out the name that
    you like to give your identifier, you can easily pick from the rules above and
    also remember that if it is something difficult, you will run into trouble adding
    it later on. But outside of those few rules, you are able to give your identifier
    any name that you like.


    ## Working with the Control Flow


    Another topic that we need to explore when we are working in the Python language
    is known as the control flow. This is important because it has been set up in
    a way to make sure that all codes you write in Python are going to be done in
    the right way, and that the compiler will be able to read them.


    There are a few strings that you may try to use in the code, and you need to make
    sure that all of the parts are in the right place at the right time, or the compiler
    is going to run into reading them. The good news is that the control flow in Python
    is going to be pretty easy to work with, and you will be able to catch on to some
    of the rules, and how they work in Python, just by glancing through a few of the
    codes that are present throughout this guidebook.


    ## The Statements


    Statements are a pretty easy thing to catch, but we are going to take a moment
    to bring them up and help you understand the best way to work with them. When
    we are talking about statements in this language, we are basically talking about
    the string of code that the computer programmer is going to write out, and then
    have the compiler list out on the computer screen.


    Any time that you tell the compiler a set of instructions that you would like
    to work on, you will find that these are going to be the statements that you are
    working on in the code as well. As long as these statements are written out in
    the right way, the compiler is going to read them, and then give you a message,
    the message that you sent out ahead of time, on the screen. The statements can
    be as long or as short as you would like, as long as you make them work with the
    code that you are writing.

