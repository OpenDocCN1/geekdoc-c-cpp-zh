    ### 4. It is easy to learn

    The main purpose behind this kind of language is that it was developed to be easy
    to use and easy to adapt to different purposes. This makes it easy for any kind
    of programmer to work with, even if they are a beginner. We are going to take
    some time throughout this book to learn more about this language, look at some
    of the codes that go with `Python`, and help you to get the most out of this language
    so that, even as a beginner, you are able to write some powerful programs.


    ### 5. It is easy to read through this language

    As you look through some of the codes that come in this language, you will find
    that it is actually pretty easy to read through the codes, even before learning
    what they mean. There isn’t a lot of unnecessary information that has to show
    up in the code, and it is all in English, so it is easy to understand the words
    that are found in it.


    ### 6. Python can provide you with a lot of programming power

    One thing that you may be impressed with when you start on the `Python` language
    is the amount of power that is behind it. Even though this language is classified
    as more of a beginners’ language, it is easy to adapt it and learn how to use
    it for any program and application. And if you learn how to combine it together
    with some of the other high-end coding languages out there, you will see it come
    with even more power as well.


    ### 7. A big community of support

    Since `Python` is one of the biggest and most popular of all the coding languages,
    worldwide, it has a big community of those who are learning how to use the language
    and those who are already well-versed in how to use it. You can definitely take
    advantage of all this information and learn from it. You can ask questions, watch
    tutorials, or find out something new with this language as you go.


    ### 8. It is an open-sourced program

    What this means is that you will be able to get the code for free, as well as
    any updates that come with it. There are some third-party add-ons that you will
    need to pay for if you choose to use them, but it is possible to use `Python`
    without those so you will get it all for free.


    As you can see, there are a lot of great things that you are going to be able
    to enjoy when you decide to get started with the `Python` code and using it for
    your own needs. Whether you are trying to add a new programming language to your
    arsenal to help you work really well with your own codes, or you are a beginner
    who wants to enter into the world of technology, the `Python` coding language
    is one of the best options for you to get started with.


    ## Getting Python on Your System


    Before you are able to utilize the information that is in this guidebook for your
    use and write out any codes to help you develop your own programs, you need first
    to make sure that `Python` is on your computer or the other system that you are
    using. And if it isn’t already present there, then we need to take some time to
    pick out a version of `Python` that we want to use and get it downloaded.


    Depending on the system that you are using, it is possible that you already have
    it available on your computer. Check to see if this is true. If you find that
    your system doesn’t have this kind of language on it, or you are not happy with
    the `Python` version that is already present on your computer, then it is time
    to either add it on or make the changes to a newer version.


    Since `Python` is an open-sourced programming language, you are going to be able
    to get everything that you need for free. If you want to add something special
    to the environment, or you want to have a different kind of library, you may have
    to go through and add that on and pay for it, but to use the basics of the `Python`
    language, as well as the great libraries and other resources with it, you will
    be able to get it for free.


    With that said, there are going to be a few different versions of `Python` that
    are available, and choosing the one that you would like to work with the most
    can be a bit tricky. Since `Python` is going to be an interpreted language, it
    comes with a lot of advantages over some of the other coding languages that are
    out there. You will notice that one of the advantages over the others is that
    `Python` is able to grow and make the changes that are necessary for your own
    computing needs. Like the applications that you are able to find on your computer,
    `Python` is always being developed, and these new features that come with that
    development can refine and change `Python` throughout time.


    Since `Python` has been around for a number of years now, there are actually a
    few different versions of `Python` that have been released through that time.
    All of the versions have been widely accepted, but they are going to provide you
    with some different benefits and features over the version that came out before.
    Some of the options that are available for a programmer to choose from when they
    are trying to pick a version of this coding language to work with includes:


    1. **Python 2.X**: There are several versions of `Python 2` that you are able
    to choose from. This is one of the older versions on the market, and while it
    still works just fine if it is the version found on your computer, it is becoming
    a bit dated and many people are going to work with one of the newer `Python 3`
    options.

    2. **Python 3**: If you are able to choose a version to go with, then `Python
    3` is going to be the best option. It is the latest and includes most of the third
    party add-ons that you will need, the developments and features that are needed
    for most projects, and it is going to be able to have any updates that come out.
    If you are choosing to download a version of `Python` onto your own computer,
    then this is the best one to go with.


    ## Installing the Interpreter on Python


    Now, before you can write out any of the codes that we want to explore in this
    guidebook, and before you are able to use the `Python` language at all, it is
    important for you to go through and install the interpreter. Installing this language
    is going to depend on the operating system that you would like to use to run this,
    as well as the source where you are getting the installation. There are a few
    different sources for downloading this language, and some are going to be more
    of a modified version of the code than the original release, so make sure that
    you are checking into this ahead of time as well.


    From here, we are going to take some time to break up this whole process of installation
    and see how it behaves on the different operating systems. This makes it easier
    for you to get the `Python` language downloaded on the system that you need, without
    any problems.


    ### Mac OS X


    The first operating system that we are going to work with is for those who are
    using the Mac computer. If you have this kind of operating system, then you will
    find that `Python 2` is going to be already installed on the computer. The exact
    version that comes with this will depend on the version of the operating system
    that you have running, and you are able to determine this easily. Simply open
    up the app for the terminal and then type in the prompt:


    ```

    python -V

    ```


    When you do this, the system is going to tell you what version of `Python` is
    already on here for you to use. If you are fine with using `Python 2`, then just
    close out of that and move on to writing some of your codes. But it is also possible
    for you to install the `Python 3` version onto the computer. To check for this
    installation, you just need to open that terminal app again and then use the prompt:


    ```bash

    python3 -V

    ```

    to help you get started.

