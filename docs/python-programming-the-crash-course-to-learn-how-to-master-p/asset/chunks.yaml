    好消息是，我们稍后可以详细回顾一下你可以采取的步骤，以确保无论用户给出什么答案，程序都能做出响应，但这并不是 `if` 语句的重点。我们现在需要查看这个简化的形式，然后从那里开始构建。为了帮助我们观察用户与
    `if` 语句交互时它看起来应该是什么样的，你需要使用以下代码：


    ```python

    age = int(input(“Enter your age:”))


    if (age <=18):

    print(“You are not eligible for voting, try next election!”)


    print(“Program ends”)

    ```


    一旦你将这个条件语句添加到编译器中，我们需要探索上述代码会发生什么。如果用户运行到程序的这部分并说他们未满 18 岁，屏幕上就会显示一条消息。在这种情况下，我们写下的显示消息是“You
    are not eligible for voting, try next election!”。然后，由于我们现在这里没有其他代码部分，程序将结束。但这引出了一个问题：如果用户说他们年大于
    18 岁，这段特定的代码会发生什么呢？


    当计算机程序员使用 `if` 语句时，如果用户输入的年龄大于 18 岁，那么什么都不会发生。`if` 语句是你只想让用户选择代码中判定为“真”的唯一答案时使用的选项。在这种情况下，用户必须说他们小于
    18 岁，否则程序就会结束。


    正如你所想象的，这将给我们带来一些问题。你可能希望允许用户输入任何适合他们的年龄。运行这个程序的用户中有些人会大于 18 岁，你不希望程序仅仅因为他们超过了那个年龄范围就在没有任何提示的情况下直接结束。这会在你真正想要它运行之前结束程序，而且当代码直接结束时，你正在开发的程序看起来并不专业。这就是你不会经常看到
    `if` 语句的一个大原因。


    ### If Else 语句


    但这里我们要引入 `if else` 语句并用它们来解决这个问题。这些语句利用了我们刚刚学过的想法和提出的问题，并帮助我们处理这些问题。假设你正在使用之前的代码，并且你想确保你的程序无论用户决定输入什么答案，都能给出结果。你可以写一个
    `if else` 语句，这样就可以为 18 岁以下的人提供一个答案，再为 18 岁及以上的人提供另一个答案。这段代码只是扩展了我们之前讨论过的选项，但这里有一个你可以使用的示例：


    ```python

    age = int(input(“Enter your age:”))


    if (age <=18):

    print(“You are not eligible for voting, try next election!”)

    else

    print(“Congratulations! You are eligible to vote. Check out your local polling
    station to find out more information!)


    print(“Program ends”)

    ```


    这段代码对你的尝试以及你希望代码中发生的情况将有用得多，而且它为你提供了比以前更多的选项。最棒的部分是，你的代码不会因为用户输入年龄就直接结束。它将根据用户输入的年龄在屏幕上提供一条语句。


    如果你愿意，这段代码还可以扩展以包含更多可能性。上面的示例只有两个选项：18 岁以下和以上。但如果对你的程序有帮助，你也可以有更多选项。例如，如果你愿意，可以将年龄范围划分得更细一些。也许你想要知道谁小于
    18 岁，谁 20 多岁，谁 30 多岁，以及谁大于 40 岁。你可以使用同样的想法并添加更多行，以便使用 `if else` 语句来满足你程序的需求。


    另一种你可能想使用的 `if else` 语句示例是让程序选择他们最喜欢的颜色。你可能不想写出足够的代码来处理世界上存在的每种颜色，但你会留出余地，让用户能够输入与其喜爱的颜色对应的信息。


    对于这类代码，你可以选择在代码中列出六种颜色的列表（你可以根据需要增加或减少），然后你会有与这六种颜色对应的消息。你可以选择黄、橙、绿、蓝、紫、红。然后你可以添加一个
    `else` 语句，让用户可以选择不同的颜色。如果用户在这里决定白色作为他们喜欢的颜色，那么第七个也是最后的消息将会出现。这条最后的消息对于任何不符合原始六种的颜色都是相同的。


    在代码末尾添加这个 `else` 语句（或“捕获”语句）是你需要考虑的一个重要事项。你不可能列出用户可能选择的所有不同颜色。（注：原文此处有大量重复文本，译文已根据逻辑精简并保持语意）。

