    \ postgrad\n    def DisplayPostStudent(self):\n        print(\"Student Name:\"\
    , self.name)\n        print(\"Rollno:\", self.rollno)\n        print(\"Study Group:\"\
    , self.postgrad)\n\n# instantiate from Graduate and PostGraduate classes\nobjGradStudent\
    \ = GraduateStudent(\"Mainu\", 1, \"MS-Mathematics\")\nobjPostGradStudent = PostGraduate(\"\
    Shainu\", 2, \"MS-CS\")\n\nobjPostGradStudent.DisplayPostStudent()\n```\n\nWhen\
    \ you type this into your interpreter, you are going to get the results:\n- ('Student\
