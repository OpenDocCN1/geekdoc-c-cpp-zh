    # 第 2 章：你需要了解的 Python 代码基础


    ![../../Images/Python%20Programming/fatos-bytyqi-535528-unsplash.jpg](img/00002.jpeg)


    现在我们已经花时间更多地学习了 Python 学习以及利用它可以做到的所有酷事情，是时候更深入查看 Python 提供的不同部分了。在你决定编写的几乎部代码中，都会出现很多基础部分。你会发现有一些告诉程序如何运行的关键字。你会看到有函数、标识符以及代码中许多其他超级重要的部分。


    作为一个初学者，掌握这些不同部分是一个好主意，这样你就能获得整体最佳结果。这将使处理我们谈论的其他某些部分变得更容易，并确保你能编写出符合你需求的代码。你将编写的
    Python 代码中出现的一些基础包括：


    ## 关键字 (The Keywords)


    我们在这里首先来看的是关键字。这些看起来非常简单，但理解它们非常重要，因为它们基本上告诉编译器在处理你正在进行的项目时需要如何行动和表现。这些关键字是保留的，用于告诉编译器它需要做什么。由于它们是被保留的，计算机程序员需要记住正确地使用它们，以便编译器可以获取该命令并完成任务。


    你只需要在代码的指定部分使用它们，否则会导致错误信息和其他问题。如果你以正确的方式使用它们，编译器将获得你想让它执行的指令，然后它可以以正确的方式执行代码。这些词对整个代码都非常重要，学习它们是什么也将使代码编写变得更容易。在我们随着本指南的进展并编写我们自己的代码时，你会注意到很多这类关键字。


    ## 标识符的重要性 (The Importance of the Identifiers)


    当你编写自己的代码时，需要学习的下一个点是标识符。这些标识符在你编写 Python 代码时会非常有用，实际上你有很多这样的标识符可以使用。你会发现它们有几个名称，你可能会在本指南中看到它们，如
    `variables`（变量）、`functions`（函数）、`classes`（类）和 `functions()`——只是几个例子。


    好消息是，尽管它们都有不同的名称，并且在代码中的工作方式不同，但在需要对它们进行标记和命名时，它们仍然遵循相同的规则。这可以使记忆规则变得容易得多，确保你以正确的方式操作，并确保在代码最需要的时候可以调用信息。


    所以，在命名这些标识符时，你必须记住的第一条规则是如何命名它们。在命名其中一个标识符时，有很多选项可以使用。例如，你可以使用下划线符号、任何数字以及小写字母和大写字母来完成这一切。你也可以进行你喜欢的任何种组合，来正确地命名你正在使用的标识符。


    然而，你必须记住这些操作是有顺序的，否则它们不会按照你想要的方式反应。首先，你不能以数字开头这个标识符的名字。如果你使用多个单词来命名标识符，你就不应该留任何空格。因此，你不能将标识符的名字写为
    `3 kids` 或 `three kids`，但你可以写为 `threekids` 或 `three_kids`，这样就可以了。如果你尝试违反这些任何规则，你会发现编译器会为你抛出错误信号。

