- fmt: "\nBy the default, Mac computers and operating systems are not going to have\
    \ this version of Python installed on them. If you would like to use this still,\
    \ you will simply need to visit the `python.org` website and install a few of\
    \ the options that are on there. This is often the best place to do your installation\
    \ because it will make sure everything is added to your computer so, once the\
    \ download is done, you can just open up `Python` and start writing the code.\
    \ It is much nicer to have the interpreter, development tools, the `IDLE`, and\
    \ the shell for `Python` already on your computer, rather than having to double\
    \ check all the time and download things on their own.\n\nWhether or not you are\
    \ able to run the shell and the `IDLE` on `Python` are going to depend on the\
    \ version that you will run on the computer, and your own preferences on the matter.\
    \ The commands that you are able to use that will bring up the applications for\
    \ `IDLE` and the shell will include:\n\n* Type in “Idle” if you are working with\
    \ a version of `Python` 2.\n* Type in “Idle3” if you are working with a version\
    \ of `Python` 3.\n\n## Windows Systems\n\nIt is possible that you are going to\
    \ want to work with the `Python` coding language on your Windows computer. You\
    \ will not have the language automatically added to your computer simply because\
    \ Microsoft already has its own programming language present there. `Python` may\
    \ not be standard here, but you can still go through and install it on the computer\
    \ if you would like. You will also need to go through and add in the environment\
    \ variables that you want because these are not done by default either. You will\
    \ then be able to run any of the scripts that you need for `Python` going from\
    \ the command prompt. The steps that you will need to use to ensure that this\
    \ gets done will include:\n\n1. To set this up, you need to visit the official\
    \ `Python` download page and grab the Windows installer. You can choose to do\
    \ the latest version of `Python` 3, or go with another option. By default, the\
    \ installer is going to provide you with the 32-bit version of `Python`, but you\
    \ can choose to switch this to the 64-bit version if you wish. The 32-bit is often\
    \ best to make sure there aren’t any compatibility issues with the older packages,\
    \ but you can experiment if you wish.\n\nNow, right click on the installer and\
    \ select “Run as Administrator.” There are going to be two options to choose from.\
    \ You will want to pick out “Customize Installation.”\n\nOn the following screen,\
    \ make sure all of the boxes under “Optional Features” are clicked and then click\
    \ to move on.\n\n2. While under “Advanced Options” you should pick out the location\
    \ where you want `Python` to be installed. Click on `Install`. Give it some time\
    \ to finish and then close the installer.\n\n3. Next, set the `PATH` variable\
    \ for the system so that it includes directories that will include packages and\
    \ other components that you will need later. To do this, use the following instructions:\n\
    \n    1. Open up the `Control Panel`. Do this by clicking on the taskbar and typing\
    \ in `Control Panel`. Click on the icon.\n    2. Inside the `Control Panel`, search\
    \ for `Environment`. Then click on `Edit the System Environment Variables`. From\
    \ here, you can click on the button for `Environment Variables`.\n    3. Go to\
    \ the section for `User Variables`. You can either edit the `PATH` variable that\
    \ is there or create one.\n    4. If there isn’t a variable for `PATH` on the\
    \ system, then create one by clicking on `New`. Make a name for the `PATH` variable\
    \ and add in the directories that you want. Click on close all the `control Panel`\
    \ dialogs and move on.\n\nNow, you can open up your command prompt. Do this by\
    \ clicking on `Start Menu`, then `Windows System`, and then `Command Prompt`.\
    \ Type in “python”. This is going to load up the `Python` interpreter for you.\n\
    \nWhen you get to this point, the program is going to be all set up and easy to\
    \ use on the Windows system. You will be able to open up the interpreter when\
    \ you are ready, as well as everything else that is needed and can work on writing\
    \ out codes and creating the programs that you would like.\n\n## Linux System\n\
    \nAnd the final step that we will need to follow in order to get this coding language\
    \ and all of its environment set up on your computer is to look at the steps that\
    \ you can take for this on a Linux computer. As more and more computer programmers\
    \ are moving to use the Linux system to help them get their work done and to work\
    \ with coding, it is always a good idea to learn how to make this work on this\
    \ kind of operating system as well.\n\nThe very first step that we need to take\
    \ is to check and see which version of `Python` is already on the system and to\
    \ see if `Python` 3 is already there. To check on this, you simply need to open\
    \ up the command prompt on your computer and work with the following code inside:\n\
    \n```bash\n$ python3 --version\n```\n\nIf you are on Ubuntu 16.10 or newer, then\
    \ it is a simple process to install `Python` 3.6. You just need to use the following\
    \ commands:\n\n```bash\n$ sudo apt-get update\n$ sudo apt-get install Python3.6\n\
    ```\n\nIf you are relying on an older version or Ubuntu or another version, then\
    \ you may want to work with the deadsnakes PPA, or another tool, to help you download\
    \ the `Python` 3.6 version. The code that you need to do this includes:\n\n```bash\n\
    $ sudo apt-get install software-properties-common\n$ sudo add-apt repository ppa:deadsnakes/ppa\n\
