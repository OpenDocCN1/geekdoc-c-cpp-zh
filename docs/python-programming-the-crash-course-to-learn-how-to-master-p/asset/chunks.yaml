    you would like to go with a return statement or not with this one.


    Now that we know a bit more about the steps that you are able to take to get your
    function written and ready to go with this, it is time to make one of your own
    user-defined functions. A good example of how you would be able to do this one
    includes:


    def userDefFunction (arg1, arg2, arg3, …):


    program statement1


    program statement2


    program statement3


    ...


    Return;


    And that is all there is to it! Follow these steps, and you can create any kind
    of user-defined functions that you would like to add some power, and some uniqueness,
    to the program that you are writing.


    Chapter 7: Inheritances in the Python Code


    ![../../Images/Python%20Programming/alexandru-acea-582050-unsplash.jpg](images/00007.jpeg)


    In this chapter, we are going to take a look at another cool thing that you are
    able to do in the Python coding language. This technique is called an inheritance.
    When you take a look at some of the codes and examples that we will provide in
    this chapter, it may seem a bit overwhelming at first. Some of the codes are a
    bit longer and look like they are complicated. The good news is that these inheritances
    are much easier to use than you might think, and they are able to take a lot of
    big and bulky code and make it easier to write, without having to type out a ton
    of lines in the process. This can ensure that the coding looks nicer, can clean
    up the work that you do, and still provides you with all of the results that you
    are looking for in your program.


    So, let’s get started by writing our own inheritances. To help you out here, and
    to make sure that the inheritance is going to stay as simple as possible, we first
    need to come up with the definition of what inheritance is all about. This inheritance
    is basically going to be when you take all or part of your original code, which
    is going to be called the parent code in this technique, and then you copy it
    down and make some changes in order to come up with a child code.


    There are a lot of things that you are able to do with these child codes. You
    can adjust them, add to them, and take away from them as you wish. This changes
    and adds things to this part of the code but will have no effect on the parent
    code as long as you did the inheritance in the proper manner. And you can make
    as many of these child inheritances, based on the original parent class, as you
    would like, changing and adding to each part as you would like.


    As a beginner, this may sound like it is pretty complex and is going to be hard
    for you to work with. But we will walk through a few examples of the codes that
    you can do with it, and you will find that it can be incredibly useful. You are
    able to copy down the parent code as much as you want, and then add and take away
    what is needed to ensure the code works how you want. To understand how this is
    going to work in your code, let’s take a look at the following syntax and example
    of inheritance.


    #Example of inheritance


    #base class


    class Student(object):


    def__init__(self, name, rollno):


    self.name = name


    self.rollno = rollno


    #Graduate class inherits or derived from Student class


    class GraduateStudent(Student):


    def__init__(self, name, rollno, graduate):


    Student__init__(self, name, rollno)


    self.graduate = graduate


    def DisplayGraduateStudent(self):


    print”Student Name:”, self.name)


    print(“Student Rollno:”, self.rollno)


    print(“Study Group:”, self.graduate)


    #Post Graduate class inherits from Student class


    class PostGraduate(Student):


    def__init__(self, name, rollno, postgrad):


    Student__init__(self, name, rollno)


    self.postgrad = postgrad


    def DisplayPostGraduateStudent(self):


    print(“Student Name:”, self.name)


    print(“Student Rollno:”, self.rollno)


    print(“Study Group:”, self.postgrad)


    #instantiate from Graduate and PostGraduate classes


    objGradStudent = GraduateStudent(“Mainu”, 1,  “MS-Mathematics”)


    objPostGradStudent = PostGraduate(“Shainu”, 2,  “MS-CS”)


    objPostGradStudent.DisplayPostGraduateStudent()


    When you type this into your interpreter, you are going to get the results:


    (‘Student Name:’, ‘Mainu’)


    (‘Student Rollno:’, 1)


    (‘Student Group:’, ‘MSC-Mathematics’)


    (‘Student Name:’, ‘Shainu’)


    (‘Student Rollno:’, 2)


    (‘Student Group:’, ‘MSC-CS’)


    The inheritance is a nice technique to learn how to work with because it adds
    in a lot of freedom when you are trying to write out a new code. If you have either
    a parent class or a base class that has a lot of the features that you would like
    to work with, or that you want to use to make the derived or the child class,
    then the inheritance is the way that you can work on this, without having to rewrite
    the code all of those times. If you just have one child class, this may not seem
    like that big of a deal. But if you have to do this ten, twenty, or more times
    in your code, it is going to save a lot of time and ensure that your program still
    looks nice.


    It is possible that the programmer can go through and start with one parent class,
    and create as many of the child classes as they would like. As long as they are
    done in order with one another, and you work with a syntax similar to what we
    have above, it is possible to add in as many of these child classes as are needed
    for your project.'
