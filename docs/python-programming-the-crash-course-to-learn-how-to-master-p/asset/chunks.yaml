  trans: "\n在处理 `Python` 语言时，这些循环是非常重要且实用的，即使是新手，花时间学习如何正确地使用它们也是非常值得的。考虑到这一点，你有几种类型的循环可以工作，它们可以帮助你让代码编写起来更简单，并在编写代码时节省大量的空间和时间。\n\
    \n这些循环中的每一个都将很有帮助，并且可以根据你要在代码中尝试实现的目标，在不同的情况下使用。在本指南的剩余部分中，我们将探索的三种主要循环类型包括 `while`\
    \ 循环、`for` 循环和嵌套循环（`nested loop`）。\n\n## 使用我们的 while 循环\n\n在我们可以使用的三种循环中，我们将首先从\
    \ `Python` 语言中的 `while` 循环开始。如果你已经预设了代码循环执行该行的特定次数，那么 `while` 循环是一个很好的选择。你可以提前设置好它，并确保循环运行的次数正好是，不多也不少。\n\
    \n当你使用 `while` 循环时，目标不是让代码按照它意愿的次数或无限次地进行循环。但是，你确实想确保它运行五次、六次或所需的任何次数。例如，如果你想让程序从一数到十，那么你将设置循环执行十次。它还确保循环执行一次，然后在再次执行之前检查条件。通过此选项，循环将会在屏幕上显示数字\
    \ 1，检查条件，然后执行数字 2，一直到 10。\n\n这些内容很多，可能较难理解。下面的示例代码是查看 `while` 循环本质的好好方法，并检查当你尝试在编译器中编写它时会发生什么。\n\
    \n```python\ncounter = 1\n\nwhile(counter <= 3):\n    principal = int(input(“Enter\
    \ the principal amount:”))\n    numberoferas = int(input(“Enter the number of\
    \ years:”))\n    rateofinterest = float(input(“Enter the rate of interest:”))\n\
    \    simpleinterest = principal * numberofyears * rateofinterest/100\n    print(“Simple\
    \ interest = %.2f” %simpleinterest)\n    #increase the counter by 1\n    counter\
    \ = counter + 1\n\nprint(“You have calculated simple interest for 3 time!”)\n\
    ```\n\n在我们继续之前，请将此代码添加到你的编译器并让它执行。你会发现，完成后，输出将以用户可以向程序输入任何想要信息的方式呈现。然后，程序将根据用户输入系统的任何数字进行计算，并得出利率以及最终金额。\n\
    \n通过我们刚刚完成的示例，我们能够设置一个将迭代三次的循环。这意味着用户在系统决定继续之前，能够获得他们想要的结果。作为程序员，你可以根据对你的程序最好的选择，通过此处理并添加更多迭代，并如果你需要的话，让循环重复更多次。\n\
    \n## 理解 for 循环\n\n在很多时候，你可能会遇到我们上面讨论的 `while` 循环。当你想要使用循环时，它将一直是一个非常棒的选项，而且它通常是你唯一需要的选择。但在某些情况下，这种循环并不完全合适，你需要对其进行一些微调。`for`\
    \ 循环是你在这里应该选择的选项。这被认为是传统的循环方法，因此你可以在许多不同情况下使用它。\n\n当你调出 `for` 循环时，你必须确保它的设置方式不是让用户来向程序提供关于何时停止循环的信息。相反，这个循环的设置方式将是按照事物在语句中出现的顺序进行迭代。然后，当它读取该语句时，这些信息将出现在屏幕上。这可以运行得很好，因为不需要任何外力或任何外部用户来输入信息。这种代码在你编写它时将如何循环的良好示例包括：\n\
    \n```python\n# Measure some strings:\nwords = [‘apple’, ‘mango’, ‘banana’, ‘orange’]\n\
    for w in words:\n    print(w, len(w))\n```\n\n当你处理上面的 `for` 循环示例时，你可以将其添加到编译器中并查看当它执行时会发生什么。当你这样做时，屏幕上显示的四种水果将按照你编写的完全顺序出现。如果你希望它们以不同的顺序出现，你可以这样做，但你需要回到代码并按照正确的顺序或你选择的顺序重新书写它们。一旦你按照语法写出它们并准备好在代码中执行，你就无法对它们进行任何更改了。\n\
    \n## 嵌套循环\n\n在使用 `Python` 语言编写代码时，第三种可以很好工作的循环类型被称为嵌套循环（`nested loop`）。你会发现它的工作方式与我们做的\
    \ `for` 循环和 `while` 循环有点不同，但它在许多情况下都有用。当你决定在代码中编写嵌套循环时，你基本上是取一个循环（无论是 `for` 循环还是\
    \ `while` 循环），然后将其放在另一个循环内部。然后，原始循环和第二个循环将一直运行直到它们都完成。\n\n```python\n# a multiplication\
    \ table\nfor x in range(1, 11):\n    for y in range(1, 11):\n        print(\"\
    %d*%d = %d\"%(x, y, x*y))\n```\n\n当你得到这个程序的输出时，它看起来像这样：\n\n1*1 = 1\n1*2 = 2\n\
    1*3 = 3\n1*4 = 4\n一直到 1*10 = 10\n\n然后，它将继续处理 2 的乘法，例如：\n\n2*1 = 2\n2*2 = 4\n依此类推，直到你得到\
    \ 10*10 = 100\n\n尽管将其放入编译器并查看会发生什么。你只需要四行代码，就能在程序上显示一个完整的乘法表。想想如果用传统方法得到这个表需要写多少行代码？这个表只需要几行代码就能完成，这证明了嵌套循环有多么强大和出色。\n\
    \n正如从上面的信息中所看到的，这些循环将是你能够添加到代码中的极佳选项。你有许多理由需要在你编写的代码中添加循环，但你可以很容易地看到它如何通过在几行代码中增加大量信息，使你的工作更快，并在此过程中节省大量的麻烦和潜在的错误。多练习每个循环几次，以便你对每个循环的工作方式变得更加熟悉，并帮助你学习在何时最可能使用它们。\n\
    \n# 第 5 章：在你的代码中编写异常\n\n"
