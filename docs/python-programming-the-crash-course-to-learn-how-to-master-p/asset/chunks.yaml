  trans: "\n\n你可以在不同的地方看到这类条件语句。`elif` 语句是 `Python` 语言中一种非常棒的代码，它通常用于很多游戏，或者用于你希望为用户提供菜单式选择的其他类型的程序。当计算机程序员想要为用户提供一些选项，而不仅仅是一个或两个选项时，这些语句将会最频繁地使用。\n\
    \n当你在使用这些 `elif` 语句时，你对这些代码的操作有很大的自由度。只要你遵循适当的编码规范，就可以根据意愿添加任意数量的语句和选项。此外，在添加过多的选项时，你应该小心一点。从技术上讲，你可以添加任何需要的数量的选项，但有时确实存在“过犹不及”的问题，如果你在没有任何理由的情况下添加它们，可能会让代码变得不必要的复杂。但如果它有效运行并且对你的代码来说是合理的，你就可以尽情地添加任意数量的此类语句。\n\
    \n现在我们已经花了一些时间讨论了这些 `elif` 语句以及它们的相关内容，现在是时候看看这种条件语句的语法了，以便更好地了解它的工作原理以及你最可能在何时使用它。`elif`\
    \ 条件语句语法的一个良好示例包括：\n\n```python\nif expression1:\n    statement(s)\nelif expression2:\n\
    \    statement(s)\nelif expression3:\n    statement(s)\nelse:\n    statement(s)\n\
    ```\n\n这是 `elif` 语句非常基础的语法，你可以根据意愿添加任意数量的此类语句。只需采用该语法并将正确的信息放入每个部分以及旁边列出的答案中。注意，末尾还有一个\
    \ `else` 语句。不要忘记在代码中添加它，以便它可以捕获用户输入的任何未在你的 `elif` 语句中列出的答案。\n\n为了帮助你更好地理解这些 `elif`\
    \ 语句是如何工作的以及上述语法将如何运作，让我们来看使用这些语句可以创建的小游戏：\n\n```python\nPrint(“Let’s enjoy a\
    \ Pizza! Ok, let’s go inside Pizzahut!”)\nprint(“Waiter, Please select Pizza of\
    \ your choice from the menu”)\npizzachoice = int(input(“Please enter your choice\
    \ of Pizza:”))\n\nif pizzachoice == 1:\n    print('I want to enjoy a pizza napoletana')\n\
    elif pizzachoice == 2:\n    print('I want to enjoy a pizza rustica')\nelif pizzachoice\
    \ == 3:\n    print('I want to enjoy a pizza capricciosa')\nelse:\n    print(“Sorry,\
    \ I do not want any of the listed pizza’s, please bring a Coca Cola for me.”)\n\
    ```\n\n通过这个示例，用户可以查看选项，然后从菜单中选择他们想要的东西。如果你设置了这些内容，相应的语句将根据他们使用的选项出现。例如，如果用户想点一份\
    \ rustica 披萨，他们只需点击数字 `2` 即可。如果他们更想喝饮料，也可以这样做。虽然我们在这里处理了一些披萨的例子，但你可以轻松地使用这种语法及其背后的思想，让菜单变成你喜欢的样子，并为你的用户提供一些选项。\n\
    \n在代码中使用条件语句时，你可以做很多不同的事情。它们提供了很多选项和巨大的力量，同时对于初学者来说又足够容易上手。这些条件语句将使你更容易让程序根据用户的输入做出决策，而不需要程序员去考虑所有可能的情况，或者预先守在那里。\n\
    \n在很多时候，你都可以使用条件语句以及我们在本指南中讨论过的一些语法。打开你的编译器并练习其中几个，帮助你从正确的起点开始将这些用于你自己的需求和程序中。\n\
    \n# 第 4 章：循环是如何工作的？\n\n![../../Images/Python%20Programming/nesa-by-makers-664834-unsplash.jpg](img/00004.jpeg)\n\
    \n当我们学习 `Python` 语言时，另一个需要探索的重要主题是循环的概念。这些对于你需要编写的很多代码非常重要，有时它们也可以帮助那些条件语句。这些循环最好的点之一是，它们能够在短短几行代码中引入大量信息，这有助于清理你的代码并使其变得非常强大，而无需编写大量信息。\n\
    \n通常当你编写想要让特定程序重复某些内容的代码时，你会开始引入这些循环，通常是重复很多次，即使只是重复几次也可以奏效，但你不想搞乱代码或浪费时间去重复编写那部分内容。虽然为了让那部分重复而编写二三次那部分代码看起来可能不是什么大事，但可能存在某些时候你想把代码写一百次甚至更多。与其写一百行代码，或者写一百次某几行，你将利用这些循环只需几行代码即可完成。循环就是你处理这种工作所需的工具，而且你会喜欢它简洁的程度。\n\
    \n例如，你可能在编写某些代码，然后到了一个想要列出一到十数字的点。当然，如果你尝试每次都写一遍，会占用大量代码。通过循环，你将能够设置它持续直到满足预设的条件。这听起来非常困难，作为一个初学者，你可能担心如何做到。这些循环将告诉你的编译器需要重复同一行或几行代码，直到满足条件。如果你想让代码数到十，你只需告诉编译器输出大于十即可。不要担心这很困惑，我们稍后会向你展示几个工作示例。\n\
    \n当然，当你编写循环代码时，你必须确保加入一个可以结束循环的条件。初学者经常忘记设置这个结束循环的条件，然后他们就会陷入麻烦。代码将一直运行循环，导致卡死，因为它不知道什么时候应该停止。你必须确保在代码中添加\
    \ `break` 或一个条件，以便它知道何时应该停止并继续执行其他需要做的事情。\n\n"
