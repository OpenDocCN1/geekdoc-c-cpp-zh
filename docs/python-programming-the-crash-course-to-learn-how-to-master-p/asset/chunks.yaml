    \n第一种，或者说内置函数，是随 `Python` 一带的函数，是在该编程语言的库中找到的。但你可以根据你的项目定义一些你自己的函数，这些就是用户定义函数。在\
    \ `Python` 中，所有函数都需要被像对象一样对待，这通常会让工作变得变得容易得多，正如你等将看到的那样。\n\n在这一章中，我们将花费一些时间关注用户定义函数，以及你将如何将这些函数用于你的项目。为了让这种概念更容易理解，我们将引入一些关于如何使用这些用户定义函数的示例。在在此之前，让我们看看下面，并确定为了更好地理解这些用户定义函数所需要的几个重要概念。\n\
    \n## 为什么用户定义函数如此重要？\n\n简单来说，在大多数情况下，开发者可以编写代码来拥有自己的用户定义函数，或者如果你是这方面的初学者，可以使用帮助解决这些问题的第三方库。有时，这些函数可以为你提供独特的优势，并且根据你想要在代码中使用它们的方式，你可以做一些很酷的事情。然而，开发者必须记住关于这些函数以及它们在代码中运行方式的一些事情，包括：\n\
    \n- 这些函数是由可重用的代码块组成的。只需要编写一次，然后你就可以在代码中根据需要多次使用。你甚至可以将该用户定义函数用在你的其他应用程序中。\n- 这些函数也可以非常有用。你可以用它们来帮助你任何想要的事情，从编写特定的业务逻辑到处理通用工具。你还可以根据自己的需求对它们进行修改，以使程序正常运行。\n\
    - 代码通常对开发者非常友好，易于维护且组织良好。这意味着你可以支持模块化设计方法。\n- 你可以独立编写这些类型的函数。如果需要，项目的任务可以分发进行快速应用程序开发。\n\
    - 一个深思熟虑且定义良好的用户定义函数可以帮助简化应用程序进程。\n\n现在我们对用户定义函数的基础知识稍微了解了一些，是时候去查看这些函数可以使用的一些不同参数了。\n\
    \n在我们花了几分钟查看了这些用户定义函数之后，是时候查看你可以使用的函数参数了。这确保了你能够真正让你的代码执行你想要的功能。我们还将查看用户定义函数可用的不同代码，以便你获得想要的结果。\n\
    \n## 可用的函数参数\n\n任何当计算机程序员在 `Python` 中编写特定代码时，这些用户定义函数将接受四种类型的参数。这些参数类型以及它们的含义是预先定义的，并不是开发者可以自行更改的。相反，开发者需要按照这些规则进行。当他们准备好时，开发者也可以添加或删除一些内容来创建他们想要的自定义函数。你的函数可以使用四种参数，这些包括：\n\
    \n1. **默认参数**：`Python` 编程语言有自己的方式来表示默认值以及你用于此类参数的语法。这些值将有助于指示参数将取某个值——除非你在调用传递了不同的值。你可以通过等号帮助判断默认值是什么。\n\
    2. **必选参数**：这些类型的参数是必须存在的，它们被认为是函数运行所强制的。你需要确保在每次调用该函数时，使用的值都按照正确的顺序和正确的数量传递。如果没有发生这种情况，代码将对你不起作用。\n\
    \n"
