    for you to get the Python language downloaded on the system that you need, without
    any problems.


    Mac OS X


    The first operating system that we are going to work with is for those who are
    using the Mac computer. If you have this kind of operating system, then you will
    find that Python 2 is going to be already installed on the computer. The exact
    version that comes with this will depend on the version of the operating system
    that you have running, and you are able to determine this easily. Simply open
    up the app for the terminal and then type in the prompt:  python – V


    When you do this, the system is going to tell you what version of Python is already
    on here for you to use. If you are fine with using Python 2, then just close out
    of that and move on to writing some of your codes. But it is also possible for
    you to install the Python 3 version onto the computer. To check for this installation,
    you just need to open that terminal app again and then use the prompt “python3
    -V” to help you get started.'
