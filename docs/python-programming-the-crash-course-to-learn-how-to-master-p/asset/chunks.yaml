    \ have, the location of the needed control flows, and other factors as well.\n\
    \nNow, there are some options when it comes to calling up the generator that you\
    \ want to use. If you call it with the help of `__next__`, the yield you are going\
    \ to get will show up at the next iteration value in the line. You can also choose\
