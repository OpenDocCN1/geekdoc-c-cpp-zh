    \ make some changes in order to come up with a child code.\n\nThere are a lot\
    \ of things you are able to do with these child codes. You can adjust them, add\
    \ to them, and take away from them as you wish. This changes and adds things to\
    \ this part of the code but will have no effect on the parent code as long as\
    \ you did the inheritance in the proper manner. And you can make as many of these\
    \ child inheritances, based on the original parent class, as you would like, changing\
    \ and adding to each part as you would like.\n\nAs a beginner, this may sound\
    \ like it is pretty complex and is going to be hard for you to work with. But\
