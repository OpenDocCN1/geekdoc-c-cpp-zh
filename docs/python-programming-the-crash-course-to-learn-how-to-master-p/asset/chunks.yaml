    ```python\n# geneator_example_2.py\n\ndef numberGeneator(n):\n    if n < 20:\n\
    \        number = 0\n        while number < n:\n            yield number\n   \
    \         number +=1\n    else:\n        return\n\nprint(list(numberGeneator(30)))\n\
    ```\n\nThis particular example is going to show that the genitor will be an empty\
    \ array. This is because we have set it so that it won’t yield any values that\
    \ are above 20. Since 30 is above 20, you will not get any results with this one.\
    \ In this particular case, the `return` statement is going to work in the same\
    \ way as a `break` statement. But, if you go through this code and you get a value\
    \ that is below 20, you would then see that show up in the code.\n\n## Additional\
    \ Information That You Need to Know About Generators\n\nWhen you are working with\
    \ these generators, you should remember that it is going to be a new type of iterator,\
    \ one that the Python code has already gone through and defined with the notation\
    \ of a function so that it all becomes easier for you to use. When you work with\
    \ these generators, you are basically working with a function type that is going\
    \ to give you a `yield` expression.\n\nNow, these are not going to get you a return\
    \ value if that is what you want. However, when you do use these, they are going\
    \ to give you the results that you are looking for. The process to help you call\
    \ out the generator is going to be a process that is automatic in Python. The\
