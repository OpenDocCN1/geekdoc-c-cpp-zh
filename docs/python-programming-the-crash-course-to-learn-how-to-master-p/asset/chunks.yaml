    # 算术运算符


    你可以在 Python 代码中使用的且实际上可以经常使用的第一种运算符是算术运算符。如果你需要将代码的某些部分相加，或者需要在代码内部进行一些数学运算，那么这些运算符将是你最适合使用的。无论你需要加法、乘法、除法还是减法，你都可以使用这些运算符来帮助你完成工作。你在
    Python 中可能会用算术运算符包括：


    1. `+`：这个符号是加法运算符。每当你需要将代码的两个部分相加时，就会使用这个运算符。

    2. `-`：这是减法运算符的符号。每当你需要减去代码的两个部分时，就会使用这个运算符。

    3. `*`：这个符号是乘法运算符。每你想将特定代码的两个部分相乘时，就会使用这个运算符。

    4. `/`：这个符号是除法运算符。每当你想要除代码的两个部分时，可以使用这个运算符。


    在 Python 语言中工作时，你可以在需要使用这些运算符中的任何一个。如果需要，你甚至可以同时使用多个此类运算符。如果你在代码的同一部分引入了多种类型的算术运算符，你必须记住运算顺序。这意味着你将先处理乘法运算符，然后处理除法，并确保从左到右进行。完成这些后，你可以进行所有的加法运算，并以减法运算结束，同样是从左到右。


    # 比较运算符


    除了使用算术运算符外，你还可以在代码内部使用比较运算符。当代码中出现两个或多个值或语句，并且你想要比较它们或将它们结合时，这些比较运算符是一个极佳的选择。


    在处理布尔表达式时，经常看到这些运算符，因为它们需要根据语句的概念来工作，即相同或不同，其结果为真（true）或假（false）。你正在代码中所处理的语句或数字结果将是相同的，或者是不相同的。这就是我们处理布尔表达式的方式。Python
    语言中属于这一类别的不同运算符包括：


    * `>=`：这意味着检查左侧操作数是否大于或等于右侧的值。

    * `<=`：这意味着检查左侧操作数的值是否小于或等于右侧。

    * `>`：这意味着检查左侧的值是否大于代码右侧的值。

    * `<`：这意味着检查左侧的值是否小于右侧的值。

    * `!=`：这是“不等于”运算符。

    * `==`：这是“等于”运算符。


    当你学习这些内容并编写程序或代码时，你可能会发现自己已经在我们已有的某些代码中开始使用这种运算符，而你甚至还没有意识到！你可以轻松地在代码中设置一些条件，当你这样做时，你希望确保代码在继续执行之前满足这些条件。这就是比较运算符将派上用场并提供帮助的地方。


    有了这个想法，你就设置好了比较，然后用户就可以输入他们想要的信息了。比较运算符将查看该输入，并将其与你设置的条件进行比较。这允许程序判断输入与你设置的条件是相同还是不同。这可以真正帮助你从程序中获得更多收益，并确保你的程序获得正确的结果。


    # 逻辑运算符


    你可以在 Python 中使用的第三种运算符是逻辑运算符。这些是一种很好的运算符，因为它们可以接收用户提供的输入，然后根据程序员放入代码中的条件来评估这些信息。有几种类型的运算符符合这个理念，但最常见的、也是初学者最可能在自己的程序使用的三种运算符包括：


    * **Or（或）**：这种逻辑运算符会让编译器去判断 `x` 的值，如果它为假，它将继续并评估 `y`。如果它发现 `x` 为真，编译器将把 `x` 的评估结果返回给用户。

    * **And（与）**：使用这种运算符，如果 `x` 的答案是假的，编译器将停止并评估该语句或该部分代码。但如果 `x` 最终为真，它将跳过该部分代码并继续评估
    `y`。

    * **Not（非）**：如果编译器查看 `x` 并发现它是假的，那么编译器将返回 `True`（真）的结果。相反，如果 `x` 实际上为真，那么程序将返回
    `False`（假）作为答案。


    如你所见，这些逻辑运算符与我们看到的比较运算符非常相似。但你会发现这类运算符的工作方式略有不同。只有当你需要使用我们列出的特定情况时，才需要使用这类运算符，而不是适用于所有情况。


    # 赋值运算符


    你可以在 Python 中使用的最后一种运算符类型是赋值运算符。这种运算符基本上使用 `=` 符号将一个或多个值（初学者通常是一个，但根据需要也可以是多个）赋到你正在处理的任何变量上。因此，如果你想将你选定的变量赋值为
    `100`，你只需要在两者之间放置一个 `=` 符号，表示将该值赋给该变量。


    在某些情况下，你会编写特定的代码并需要使用赋值运算符，在代码中使用它以便编译器知道赋值给该变量。如果你回顾我们在本指南中处理过的不同代码，有很多关于赋值运算符如何使用的示例。


