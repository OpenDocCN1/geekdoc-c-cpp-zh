    \ And when you do use it, the function is going to get lost out of the local state.\
    \ This means that once you go back and try to call up that function for the second\
    \ time, then the function got lost and it is going to restart from the first statement.\n\
    \nIf that is what you would like the function to do, then this is not a bit problem.\
    \ But, you can also work with the `yield` keyword to help keep the state between\
    \ the different calls of the functions. This method is helpful because it ensures\
    \ that after you are doing using it, the function is going to go back from where\
    \ it was first called up. This is a good one to choose depending on the place\
    \ you want your function to end up when all is said and done.\n\n## How Do I Use\
    \ the return in a Generator?\n\nThe generator can use the statement for `return`\
    \ but only when there isn’t a return value. The generator will then go on as in\
    \ any other function return when it reaches this statement. The `return` basically\
    \ tells the program that you are done and you want it to go back to the rest of\
    \ the code. Let’s take a look at how you can change up the code to use these generators\
