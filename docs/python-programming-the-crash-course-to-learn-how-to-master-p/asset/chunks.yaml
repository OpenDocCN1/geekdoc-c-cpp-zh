  trans: "\n这可以让代码看起来更整洁，让代码编写更轻松，限制你需要编写的内容量，并确保你能够尽可能地编写出一个新程序。这些新派生类的每一个都有能力从该父类中获取它想要的任何特征，或者如果它愿意，它甚至可以丢弃某些部分。这有助于你继续编写代码，并使其按照你想要的方式运行。\n\
    \n## 我可以重写基类吗？\n\n现在我们已经花了一些时间讨论继承在你的代码中是如何工作的以及使用继承的一些优点，现在是时候进入下一步了，即学习如何重写基类之一并使其在这一过程中正常工作。\n\
    \n在某些情况下，你会与特定的派生类一起工作，然后发现当你进行继承时，是时候重写其内部的内容了。当这种情况发生时，你需要执行几个步骤来重写在该基类中找到的操作。基本上，这意味着计算机程序员需要查看他们的基类，并更改内部找到的行为。这使得派生类能够更容易获取你想要的行为，而不包含其他任何内容。\n\
    \n不要让重写基类的想法看起来很复杂。这实际上是你观察父类中特征的好方法，并决定哪些特征将传递到新的子类，哪些特征将被保留。这还确保了你能够将父类留在原处，而这些更改不会影响它以及你代码的行为方式。\n\
    \n## 重载\n\n计算机程序员在想要处理这些继承时能够做的其他事情之一是一个被称为“重载”（overloading）的过程。当你处理这种过程时，你基本上是取一个标识符并使用它来帮助你同时定义多个方法。很多情况下，在每个类内部会有多两个方法，但你可能会遇到需要在过程中定义三个或更多方法的情况。\n\
    \n你将为这同一个标识符使用的两个方法需要位于完全相同的类中，并且参数必须不同才能使其工作。你会发现，当你想要它们执行一个需要适应不同类型参数的任务时，重载过程运行得最好。\n\
    \n重载并不是学者在初学阶段真的会有太大用处的过程之一。但是，随着你在过程中编写更多的程序和更多的代码，你可能会发现它有更多用途。了解一些关于重载以及它的含义的知识可以在你开始接触继承概念时让事情变得更容易。\n\
    \n## 关于继承的最后说明\n\n当你决定在这个编程语言中处理一些继承时，你可能会发现自己可以同时进行多重继承。当你该处理多重继承组件时，你会发现当你遍历每一层时，它们彼此之间都有相似之处，但你仍然在遍历每一层并为每一层进行所需的微小添加或更改。\n\
    \n通过这些多重继承，你会注意到它们与我们之前讨论的单继承非常相似。但你不仅停于一个，而是将继续向下，随着你处理代码的进展添加更多内容或移去更多内容。你只需要将派生类交给父类并继续这个过程即可。\n\
    \n当你编写代码时，并注意到它要求你通过多重继承来完成工作时，你需要从一个类开始，即你的基类，然后它将至少有两个父类来帮助你。学习如何做这一点很重要，因为你会发现当你需要从代码代码的多个部分借用几个特征时，这会让事情变得更容易。\n\
    \n多重继承可以像你想要的那样简单，也可以复杂。当你处理它们时，你将创建一个全新的类，我们称之为 `Class C`，你从上一个类（即 `Class B`）获取了创建这个新类的信息。然后你可以回头发现\
    \ `Class B` 是你根据来自 `Class A` 的信息创建的。这些层中的每一个都将包含你喜它的前一个类的某些特征，你可以根据自己的意愿深入研究。取决于你决定编写的代码，你可能有十个或更多此类类，每一层都有来自前一个类的特征以保持其运行。\n\
    \n在创建这些继承组件时，记住你不允许从多重继承组件转移到循环继承。你可以根据需要向代码中添加任意父类，但你不能通过这种方法让它形成圈并连接事物。\n\n\
    当你开始在 Python 语言中编写更多代码时，你会发现处理不同类型的继承可能非常流行。很多时候，你可以坚持程序中的同一代码块并进行一些更改，而无需浪费时间反复重写代码。\n\
    \n## 第 8 章：使用 Python 生成器\n\n![image](img/00008.jpeg)\n\n我们将要探索的下一个主题将是 Python\
    \ 生成器（generators）。它们是函数的一种，旨在帮助创建结果序列。这些生成器非常棒，因为它们可以维护自己的本地状态，允许函数在任何一次被调用时从上次停止的地方继续。你应该以类似于迭代器（iterator）的方式考虑这种生成器。函数状态可以通过简单的\
    \ `Yield` 关键字来维护。在 Python 中，你可以将其认为是输入 `return`，但我们将探索由此产生的一些差异。\n\n### 生成器如何工作？\n\
    \n生成器能够做很多不同的事情来帮助让你的代码尽可能强大。但初学者学习更多生成器以及它们旨在如何工作的最好方法是查看像下面的示例：\n\n```python\n\
    # generator_example_1.py\n\nDef numberGenerator(n):\n    Number = 0\n    While\
    \ number < n:\n        Yield number\n        Number += 1\n\nmyGenerator = numberGenerator(3)\n\
    print(next(myGenerator))\nprint(next(myGenerator))\nprint(next(myGenerator))\n\
    ```\n\n上面的代码将被放入编译器并为你定义生成器。具体来说，它将能够定义名为 `numberGenerator` 的生成器，并为你提供一个 `n` 作为参数。这发生在你遍历所有这一切并借助\
    \ while 循环来定义限制值之前。\n\n"
- fmt: "\nAny time that you want to use the `myGenerator` in order to bring up an\
