  trans: "\n\n![../../Images/Python%20Programming/hitesh-choudhary-562332-unsplash.jpg](img/00005.jpeg)\n\
    \n在本文指南中，我们将花时间探索的下一个内容是，你如何在代码中处理、甚至抛出（raise）你自己的异常。在你编写自己的代码时，你会发现 Python 程序实际上已经包含了一些异常，当你或用户执行了程序它不赞许的操作时，这些异常就会被抛出来——此外，计算机程序员还可以在代码中添加一些异常，以确保代码能够按照你预想的方式来运行。\n\
    \n如果一个异常被认为是自动异常，那么你将可以在你的 Python 库中找到它。这其中一个很好的例子是用户决定除以零。这是 Python 代码不予允许的运行，它不会允许这种操作发生。如果用户确实尝试这样做，Python\
    \ 库中的异常就会显示在这里。如果你正在抛出你自己的异常，那么你就需要通过代码来告诉计算机以那种方式运行。\n\n## 自动异常\n\n虽然取决于我们想要处理的代码类型，这两者都很重要，但我们将探索的第一种类型是编译器会自动识别的异常，无需你在代码中做任何操作。如果用户执行了会触发异常的操作，程序将不会让他们继续执行。这可能发生在你添加了不符合代码的语句，或者你拼错了一个类名，导致编译器无法调用它。或者，同样也可能是当你或用户在运行程序时，尝试将某个数除以零。这些仅仅是编译器将识别并尝试为你自动抛出的异常的几个例子。\n\
    \n作为 Python 程序员，了解 Python 库中可能会出现的各种异常是一个好主意。这很有帮助，因为它会告诉你在代码中需要修改哪些内容，并在其中一个异常即将在代码中出现时给你预警。编译器可能会为你抛出的一些异常及其关键字包括：\n\
    \n*   `Finally`——这是你希望使用的操作，用于执行清理工作，无论异常是否发生都会执行。\n*   `Assert`——此条件将触发代码内部的异常。\n\
    *   `Raise`——`raise` 命令将在代码内部手动触发一个异常。\n*   `Try/except`——这是在你尝试运行一段代码块，然后由于你或\
    \ Python 代码抛出的异常而使其恢复的情况。\n\n## 在代码中抛出我自己的异常？\n\n是的，根据你试图为程序编写的内容，通过代码抛出一些你自己的异常是完全可以接受的。但首先，我们将看看如何在你尝试编写的任何代码中使用这些异常。当自动异常（即编译器能够理解的异常）出现时，你想要确保自己已经做好了准备，并且你可以做什么来确保它对用户来说更容易理解。\n\
    \n如果你在检查代码时，发现出现了某种问题，或者你想弄清楚为什么这种程序在执行某些看起来是错误的操作，那么你可能会查看编译器，并发现它正尝试为你抛出一个新异常。这是因为程序有机会查看代码，并试图弄清楚你想如何修复某些不应该发生的问题。\n\
    \n好消息是，出现在其中的很多问题都是简单且容易修复的。例如，你可能尝试调用你创建的一个文件，但你拼错了名字，或者给它取了错误的名称，无论是在第一次命名时，还是在你尝试重新调用它时。由于编译器找不到该名称，它将为此抛出异常。\n\
    \n为了观察这种异常将如何工作的一种良好方法，我们在这里停，看一个编译器抛出此类异常的示例。将以下代码添加到你的解释器中，这样你就可以了解当代码中出现异常时会发生什么：\n\
    \n```\nx = 10\ny = 10\nresult = x/y #尝试除以零\nprint(result)\n```\n\n当你尝试让解释器执行这段代码时，你得到的输出是：\n\
    \n```\n>>>\nTraceback (most recent call last):\nFile “D: \\Python34\\tt.py”, line\
    \ 3, in <module>\nresult = x/y\nZeroDivisionError: division by zero\n>>>\n```\n\
    \n当你停止并观察这类示例并要求其执行时，编译器会在屏幕上显示一条友好的错误信息。这仅仅是因为用户尝试将某些数除以零。大多数编程语言（包括 Python 在内）都不会允许这种情况发生，因此会抛出错误。\n\
    \n现在，你可以让代码保持原样而不做任何更改。但当你这样留着它，并且用户尝试除以零时，他们将收到一条非常长且混乱的错误信息。这将很难理解，而且通常只伴随着串无意义的字母和数字。作为程序员，你有能力对此进行一些更改，以便代码能够实际说明情况。而不是在长错误信息出现时让他们困惑，你可以使用如下代码：\n\
    \n```\nx = 10\ny = 0\nresult = 0\ntry:\n    result = x/y\n    print(result)\n\
    except ZeroDivisionError:\n    print(\"你正在尝试除以零。”\n```\n\n在这个示例中，我们添加到编译器的代码将与我们尝试的示例相似。但通过这个示例，有一些更改，使得在用户任何时候触发异常时都能实际说明情况。\n\
    \n## 我如何在代码中定义我的异常？\n\n现在，正如我们之前所说的，之前做的示例是为了向我们展示如何管理代码中自然出现的异常。这些是 Python 代码不允许的，因为它们不符合代码能够执行的操作。我们还查看了你可以采取的一些步骤，以更改消息并对其针对当前的错误进行个性化，而不是试图拥有一串无意义的字母和数字。\n\
    \n"
