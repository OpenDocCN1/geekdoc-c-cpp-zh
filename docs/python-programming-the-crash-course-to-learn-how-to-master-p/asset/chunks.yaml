    \ ensure the code works how you want. To understand how this is going to work\
    \ in your code, let’s take a look at the following syntax and example of inheritance.\n\
    \n## Example of inheritance\n\n```python\n# base class\nclass Student(object):\n\
    \    def __init__(self, name, rollno):\n        self.name = name\n        self.rollno\
    \ = rollno\n\n# Graduate class inherits or derived from Student\nclass GraduateStudent(Student):\n\
    \    def __init__(self, name, rollno, graduate):\n        super().__init__(name,\
    \ rollno)\n        self.graduate = graduate\n    def DisplayStudent(self):\n \
