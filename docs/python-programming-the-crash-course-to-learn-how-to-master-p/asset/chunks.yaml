  raw: '![../../Images/Python%20Programming/hitesh-choudhary-562332-unsplash.jpg](images/00005.jpeg)


    The next thing that we are going to take some time to explore in this guidebook
    is how you will be able to handle, and even raise, some of your own exceptions
    in the code. As you work through writing some of your own codes, you will find
    that the Python program actually already has a few of its own exceptions that
    it can bring out if you or the user does something it doesn’t approve of—and on
    top of that, there are some that the computer programmer is able to add into the
    code, so as to ensure that the code is going to work the way that you would like.


    If the exception is considered an automatic one, then you will be able to find
    it inside of your Python library. A good example of this one is when the user
    decides to divide by zero. This is something that the Python code doesn’t like,
    and it won’t allow it to happen. If the user does try to do this, then the exception
    from the Python library is going to show up here. If you are raising one of your
    own exceptions, then you need to go through and tell the computer to act in that
    manner.


    While both of these are important depending on the type of code that we want to
    work with, the first type that we are going to explore are the ones that the compiler
    will automatically recognize, without you doing anything in the code. If the user
    does do something that will raise the exception, then the program won’t let them
    go through. This could happen if you add in a statement that isn’t right for the
    code, or you misspell a class so that the compiler is not able to pull it up.
    Or, again, it could be when you or the user are going on the program, and you
    try to divide something by zero. These are just a few examples of the exception
    that the compiler is going to recognize and will try to raise for you automatically.


    As the computer programmer in Python, it is a good idea to know about the different
    exceptions that are going to appear in the library of Python for you. This helps
    because it will tell you what you need to change up in the code, and can give
    you a heads up about when one of these exceptions are going to turn up in the
    code. Some of the exceptions that the compiler may bring up for you, along with
    their keywords, include:


    *   Finally—this is the action that you will want to use to perform cleanup actions,
    whether the exceptions occur or not.


    *   Assert—this condition is going to trigger the exception inside of the code


    *   Raise—the raise command is going to trigger an exception manually inside of
    the code.


    *   Try/except—this is when you want to try out a block of code and then it is
    recovered thanks to the exceptions that either you or the Python code raised.


    Can I Raise My Own Exceptions in the Code?


    Yes, it is perfectly acceptable to go through and raise some of your own exceptions
    based on what you are trying to write for your program. But first, we are going
    to take a look at how you are able to use these exceptions in any kind of code
    that you try to write. When the automatic ones, the ones that the compiler is
    going to understand, come up, you want to make sure that you are prepared, and
    what you are able to do in order to make sure that it is easier to understand
    for the user.


    If you are going through on your code, and you notice that some kind of issue
    shows up, or you would like to figure out why this kind of program is doing something
    that seems wrong, then you may take a look at the compiler and see that it is
    trying to raise up a new exception for you. This is because the program has had
    a chance to take a look at the code and is trying to figure out how you would
    like to fix something that shouldn’t be happening.


    The good news is that a lot of the issues that are going to show up with this
    are going to be simple and easy to fix. For example, you may try to bring out
    a file that you created, but you misspelled it or gave it the wrong name, either
    when you first named it or when you are trying to bring it back up. Since the
    compiler is not able to find the name, it is going to raise an exception for this.


    A good way to get a look at how this exception is going to work, we are going
    to stop here and look at an example of what it looks like when the compiler raises
    one of these exceptions. Add the following code into your compiler so that you
    can get an idea of what happens when an exception shows up in your code:


    x = 10


    y = 10


    result = x/y #trying to divide by zero


    print(result)


    The output that you are going to get when you try to get the interpreter to go
    through this code would be:


    >>>


    Traceback (most recent call last):


    File “D: \Python34\tt.py”, line 3, in <module>


    result = x/y


    ZeroDivisionError: division by zero


    >>>


    When you stop and look at this kind of example and ask it to execute, the compiler
    is then going to bring up a nice error message on the screen. This is just because
    the user tried to divide things by zero. Most coding languages, including Python,
    are not going to allow this to happen and so the error is going to be raised.


    Now, you could just leave this how it is in the code, without making changes.
    But when you go through and leave it this way, and the user tries to divide by
    zero, they are going to get a quite long and messy error message. This is going
    to be hard to understand and often just comes with a series of letters and numbers
    that they are not going to be able to understand. As the programmer, you have
    the ability to go through with this and make some changes so that the code actually
    explains what is wrong, so that the user can make some changes. Rather than leaving
    them confused when a long and messy error message shows up when they do something
    wrong, you can use a code like the following to help show what the user did exactly
    to upset the compiler at this point:


    x = 10


    y = 0


    result = 0


    try:


    result = x/y


    print(result)


    except ZeroDivisionError:


    print(“You are trying to divide by zero.”)


    With this example, the code that we are adding to the compiler is going to be
    similar to the first example that we tried to do. But with this one, there are
    a few changes so that the message actually explains what is going on any time
    that the user does raise the exception that is to blame here. You can add in any
