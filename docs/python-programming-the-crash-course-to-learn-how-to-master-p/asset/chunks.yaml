  trans: "\n\n每当你想要使用 `myGenerator` 来带入带有 `next()` 方法的实例化生成器时，它都会运行生成器并通过整个代码，直到遇到\
    \ `yield` 语句。例如，这将会向你返回 1。即使你在这种情况下获取了返回的值，当你调用函数 `next` 时，你的函数将会尝试将变量保持为 `number`，但它会允许该值增加\
    \ 1。这意味着它将从上次停止的地方重新开始，下一次调用该函数时，它将从那里继续执行。\n\n如果你在执行此操作时并想在我们在上面编写的代码之后多次调用你的生成器，那么你会发现它会抛出一个异常（记得我们稍些时候讨论过这些异常吗）。它会显示\
    \ `StopIteration`，因为生成器已经完成，并已从它正在执行的内部 `while` 循环中退出。\n\n这在代码中看到是一个很强烈的特性，但这种功能非常有用，因为你可以利用这类生成器来帮助在开发过程中创建任何你想要创建的可迭代组件。\n\
    \n## \"Between\" 与 \"Yield\" 的区别\n\n现在，有几次你可能想要改变正在使用的关键字。有时你需要使用 `return` 关键字。这用于你想要从给函数获取一个返回值的情况。当你使用它时，函数将离开局部状态。这意味着一旦你返回并尝试第二次调用该函数，函数就已经丢失了，它将从第一条语句重新开始。\n\
    \n如果这就是你希望函数执行的操作，那么这并不是问题。但你也可以使用 `yield` 关键字来帮助在函数的不同调用之间保持状态。这种方法很有帮助，因为它确保了在你使用它之后，函数将从最初被调的地方返回。根据你希望函数在万事大定后结束在何处，这是一个很好的选择。\n\
    \n## 如何在生成器中使用 return？\n\n生成器可以使用 `return` 语句，但仅限于在没有返回值的情况下。生成器在到达此语句时将像任何其他函数返回一样继续运行。`return`\
    \ 基本上告诉程序你已经完成了，并且你希望它返回到代码的其他部分。让我们来看看如何通过添加一个 `if else` 子句来简单地更改代码以使用这些生成器，以便过滤掉任何大于\
    \ 20 的数字。你将使用的代码包括：\n\n```python\n# geneator_example_2.py\n\ndef numberGeneator(n):\n\
    \    if n < 20:\n        number = 0\n        while number < n:\n            yield\
    \ number\n            number +=1\n    else:\n        return\n\nprint(list(numberGeneator(30)))\n\
    ```\n\n这个特定的示例将显示生成器将是一个空数组。这是因为我们设置了它不会产生任何大于 20 的值。由于 30 大于 20，你将通过它得到任何结果。在这种特定情况下，`return`\
    \ 语句的作用方式与 `break` 语句相同。但如果你运行这段代码并获得一个低于 20 的值，你将会在代码中看到它的显示。\n\n## 关于生成器你需要了解的额外信息\n\
    \n当你处理这些生成器时，你应该记住它是一种新的迭代器类型，Python 代码已经通过函数符号对其进行了处理和定义，以便对你来说变得更容易。当你与这些生成器工作时，你基本上是在处理一种会给你提供\
    \ `yield` 表达式的函数类型。\n\n现在，如果你想要的是一个返回值，这些并不会给你提供返回值。然而，当你使用它们时，它们将给你你正在寻找的结果。帮助你调用生成器的过程将是\
    \ Python 中的一个自动过程。你需要使用的上下文将是局部变量的值、所需控制流的位置以及其他因素。\n\n现在，在调用你想要使用的生成器时有一些选项。如果你在\
    \ `__next__` 的帮助下调用它，你将得到的 `yield` 将出现在行中的下一次迭代值。你也可以选择与 `__iter__` 工作，它会在你的程序中自动实现，并告诉程序应该获取该生成器并在需要迭代器的最佳位置使用它。\n\
    \n作为一名程序员，在处理这些生成器时，你有几个选项可以选择。你可以使用的一些选项包括：\n\n- **生成器表达式 (Generator expressions)**：这些类型的表达式让你作为程序员能够用简单的符号定义生成器。这是你在\
    \ Python 中创建自己的列表时会执行的操作。你会使用 `__iter__` 和 `__next__` 方法，因为它们为生成器类型中的任何对象提供了结果。\n\
    - **递归生成器**：你选择的生成器可能是递归的，就像你在某些函数中找到的那样。这里的想法是你将列表上的所有元素与顶部的元素交换，允许它们都移动到第一个位置，然后列表的其余部分就消失了。\n\
    \n## 是否在特定时刻我应该使用生成器？\n\n一些初学者在学习本章时提出的一个问题是他们何时应该考虑使用生成器。正如我们在本章中的一些示例和讨论的内容所看到的，生成器可以是编写代码时需要的更高级的工具。在使用\
    \ Python 语言进行编程时，会有一些这些生成器非常有用的时刻，它们能够提高你代码的效率。你需要使用这些生成器的一些场景包括：\n\n1. 任何你处理需要处理大量数据的时候。生成器对执行此操作非常有帮助，因为它们具有即时计算的能力。这通常是用于流式处理的过程。\n\
    2. 你还可以通过所谓的堆叠生成器（stacked generators）进行管道处理工作。这是你能够使用生成器对一系列操作进行管道化处理，以便代码变得尽可能简单。\n\
    \n"
- fmt: "\nYou will be able to take and use these regular expressions in the code to\
    \ help you filter out the different strings of text or individual parts of the\
    \ text. It is possible to check and see if a string or some other text is already\
    \ inside the code, and whether or not it is going to match up with some of the\
    \ regular expressions as well. The nice thing about these regular expressions\
    \ is that you are able to stick with a syntax that is similar, no matter the language\
