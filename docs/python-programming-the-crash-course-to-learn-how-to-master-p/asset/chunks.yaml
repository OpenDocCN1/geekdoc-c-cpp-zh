    # 第 13 章：当程序未按计划运行时 Python 故障排除


    ![../../Images/Python%20Programming/student-849825_1920.jpg](img/00013.jpeg)


    作为一个初学者，编写一整门语言的想法有时看起来是一件大事，而且让你感到非常无从下手。我们花费了大量时间研究你可以操作的代码的不同部分，并探索了一些示例，帮助你观察代码中哪些部分是有效的，哪些部分可能无效。


    随着你开始学习更多 Python 编码以及随之来的各种部分，你可能会遇到一些需要处理的问题。也许你的程序运行方式不像你认为的那样，而且你不断收到本不该出现的错误消息——或者可能当你遇到这种问题时，你并不知道如何修复它。好消息是，即使是初学者也可以对他们的程序进行一些简单的操作，让其运行起来并确保他们能够更快地回到编码中。在
    Python 中你可以采取的一些故障排除思路包括：


    ## 经常打印代码


    写好几个小时的代码然后再去测试永远不是一个好主意。如果你写得完全正确，这可能行得通。但如果你写错了，你现在需要回过头并修复你所有做错的地方。那是大量的代码需要检查和寻找错误。定期打印信息并测试代码将确保你不会遇到这个问题。


    这并不意味着你必须在每一行代码后都打印。但这意味着要频繁打印。如果你可以在每一小段代码后都打印，那么当运行结果不符合你的意愿时，这会变得更容易。例如，如果你每写五分钟代码就打印一次信息，而突然代码中的某处无法工作了，你完全清楚错误在哪里，而不需要翻遍所有的页面并重新检查一遍所有的代码。


    ## 从已经熟悉的代码开始


    作为初学者，你会有很多新知识需要关注，以确保你能够从项目中获得预期的结果。但得益于本指南中的信息，你现在知道如何处理 Python 代码的一些基础知识。当你对不同情况下需要做的某些事情感到疑问时，对现有的代码以及你已知可以运行的代码进行练习是一个好主意。


    许多初学者发现，从现有的结构和语法开始对他们来说，然后你可以针对你自己的代码进行所需的微调。这确保了代码能够运行，并在这个过程中节省一些烦恼。当你使用这些现有的代码结构并进一步学习它们是如何工作时，你就能就能自己编写它们了。但在开始阶段，这是一个很好的上手并看到你想要的结果的好方法。


    当你准备好独立完成一个项目时，有很多资源可以用来帮助你找到你想要操作的代码。快速的 Google 搜索就能帮助你找到所需的代码结构。它不需要完全是你那个项目所需要的，但拥有基础语法将使事情变得简单，并帮助你启动代码。从那里开始，你可以进行你想要的更改，然后检查代码以确保所有植入的更改都是你想要的。


    ## 在进行微调后，运行代码进行检查


    不要从一个空白文件开始，坐下来在第一次尝试运行代码之前就花一个小时写代码。你只会让自己的工作变得更加困难，当弹出一大堆小错误时，你将不知道从哪里开始。检查所有内容并修复任何错误可能花费极长的时间。


    相反，每隔几分钟，你就应该运行一下更新并测试代码，看看会出现什么问题。这样，当代码中出现 bug 时，你只需要检查几行代码来查找问题，而不是一大堆代码。你真的不可能频繁地测试代码，所以请尽可能地这样做。


    始终记住，在再次测试之前编写的代码越多，可能出现错误的地方就越多，你需要重新搜索的代码也越多。每当你回过头运行代码时，你都会获得关于你工作的更多反馈，这样你就可以边学边做。


    这似乎可能放慢了你的编码速度和你完成代码的能力，但实际上，它将对你能完成的内容以及你在每个项目上花费的时间产生影响。如果你必须回过头去更改两个小时工作的信息，那么寻找错误花费的时间将比它本身的价值要得多。如果你只需要一次检查一小块代码，你就能更快地找到错误并回到编码中。


    ## 花时间阅读任何错误消息


    如果你在编写的某些代码中犯了错误，你会看到一个错误消息出现。当这种情况发生时，你应该阅读它，因为这可以指出你的代码哪里出了问题以及如何修复它。假设你收到一条消息，显示语言尝试执行但遇到了问题。这意味着你在代码中跳过了某个步骤，或者有拼写错误，或者漏掉了某些内容。你会通过这些信息知道要修复什么，并确保完成。


    如果你刚开始学习 Python 编程，可能会弹出消息而你并不理解它在说什么。但你仍然应该阅读它并看看那里有什么信息。至少你会从消息中获得一个行号，你可以查看代码中的那几行看看发生了什么。


    对于那些尝试了其他步骤但仍然无法确定错误消息含义的人来说，你确实可以在网上搜索它。某些错误消息可能会让人困惑，即使你回过头去检查代码行，也可能无法找到错误及其修复方法。


    在线搜索可以帮助准确说明发生了什么。你只需要将错误消息的最后一行复制并粘贴到 Google 中，看看会出现什么。当你输入这些内容时，很可能会结果，因为其他程序员可能也遇到过此消息并有同样的疑问。这将为你提供关于代码中错误的信息，你可以回过头来弄清楚代码哪里出了问题并将其修复。


    尽管这是一个获取你所疑问答案的好方法，特别是当你无法确定错误消息的含义时——但不要每次出现错误消息时都只依靠这种方法。如果你只是依赖 Google 回答你的所有问题，那么你将无法从编码以及如何修复自己的错误中学到很多东西。尝试查看错误并检查代码，看看你是否能够独立修复。然后，如果你卡住了，再根据自己的需要利用这个选项。


    ## 猜测修复方法然后检查


    '
- fmt: '

    If you try a few of the other methods and still aren’t sure about how to fix something,
    you may need to try out a few different things to see what is going to happen.
    You should already be running your code as often as possible to provide you with
    some quick feedback. Keep doing this as you try out a few options and see whether
    it fixes your error or not.


    There is a possibility that the fix you are trying is going to introduce a new
    error, and sometimes it can be hard to tell if you are nearing a solution or making
    things worse. Try not to do this for so long that you have no idea how to get
    back to your starting position.


    Trying out a few different things can be important because it helps you to learn
    more about your code and then if you do go ask someone else for help, they are
    going to ask you what you have tried already. They probably will be more annoyed
    than anything if they hear that you haven’t tried anything, but if you list out
    a few things that you already tried, then they know where to start from that place.


    ## Use the Process of Commenting Out the Code


    No matter what kind of coding language you decide to work with, there is going
    to be the option to comment in your work. This is basically a way that you are
    able to leave a little note or some information in the code, but in a way that
    ensures that the compiler isn’t going to try and execute that note in the program.
    This can be an advantage for you as you write the code because you will also be
    able to use it to help troubleshoot the issues in your project.


    If you are writing some code and find that you keep getting an error message,
    but nothing that you are doing seems to work to fix it, then you may want to comment
    out the code. You can pick a part of the code that you think is causing the issue,
    and then just at the `#` sign to the front of it. This takes it out of the code
    basically, without erasing all of it.


    If the script that you are working on is pretty long, then you are able to go
    through here and comment out some of the parts of the code, specifically the parts
    that aren’t going to have a direct relation to the changes that you plan to work
    on. This is going to help because you will be able to search through just the
    code that has the mistake, and it speeds up the whole process.


    Be careful when you are doing the commenting out process; you do need to be a
    bit careful. It isn’t going to help you too much if you end up commenting out
    the parts that are needed to set the variables. If you do this, then the program
    is going to stop working, and you will just end up with a mess trying to get the
    program to run. Start by commenting out just small parts of the code first and
    add on as you need to do more testing. This ensures that you don’t eliminate some
    parts of the code that you need at that time.


    After you have finished using the “commenting out” method to help you test your
    code, and you are sure that it is ready to go without the error, then it is time
    to go back through the code and remove any comment characters that you put there.
    This takes some time, but it will help you to turn the whole program on so that
    it actually runs the application that you were writing.


    ## Ask Someone for Help If It Is Needed


    At some point, you may have tried the troubleshooting options that we have listed
