  trans: "\n\n### 4. 易于学习\n这种语言的主要目的是为了被设计成易于使用且易于适应不同的目的。这使得任何类型的程序员都能轻松上手，即使是初学者也是。在本书中，我们将花一些时间学习更多关于这种语言知识，查看一些与\
    \ `Python` 相关的代码，并帮助你充分利用这门语言，让你即使作为一个初学者，也能编写出一些强大的程序。\n\n### 5. 这种语言易于阅读\n当你查看这种语言中的一些代码时，你会发现即使在学习它们的具体含义之前，阅读这些代码实际上也非常容易。代码中没有出现很多不必要的信息，而且全部都是英文的，所以很容易理解其中包含的单词。\n\
    \n### 6. Python 可以为你提供强大的编程能力\n当你开始学习 `Python` 语言时，你可能会被它背后的强大力量所震撼。尽管这门语言被归类为更偏初者的语言，但它很容易进行调整，并学习如何将其用于任何程序和应用程序。如果你学习如何将它与现有的其他高级编程语言结合起来，你会看到它变得更加强大。\n\
    \n### 7. 庞大的支持社区\n由于 `Python` 是全球范围内最大、流行的编程语言之一，它拥有一个庞大的社区，其中包括学习如何使用这门语言的人以及已经精通如何使用它的人。你完全可以利用这些信息并从中学习。你可以提问、看教程，或者在学习过程中通过这门语言发现新东西。\n\
    \n### 8. 它是一个开源程序\n这意味着你能够免费获得代码，以及随之而来的任何更新。有一些第三方插件，如果你选择使用它们，是可能需要支付费的，但你可以在不使用这些插件的情况下使用\
    \ `Python`，因此你可以完全免费获得所有内容。\n\n正如你所看到的，当你开始学习 `Python` 代码并将其用于你自己的需求时，你将享受到许多很棒的东西。无论你是正尝试向你的武器库中添加一门新的编程语言以帮助你更好地处理自己的代码，还是一个想要进入科技世界的初学者，`Python`\
    \ 编程语言都是你入门的最佳选择之一。\n\n## 在系统上安装 Python\n\n在你能够利用本指南中的信息，并编写任何帮助你开发自己的程序的代码之前，你首先需要确保\
    \ `Python` 已安装在你的电脑或你正在使用的其他系统中。如果那里还没有，那么我们需要花一些时间选择一个我们想要使用的 `Python` 版本并进行下载。\n\
    \n取决于你正在使用的系统，你的电脑上可能已经有了它。检查一下是否确实如此。如果你发现你的系统中没有这种语言，或者你对电脑上已经存在的 `Python` 版本不满意，那么是时候要不要添加它，要么更改为更新的版本了。\n\
    \n由于 `Python` 是一门开源编程语言，你将能够免费获得所需的一切。如果你想为环境添加一些特殊内容，或者你想拥有不同类型的库，你可能需要去手动添加并付费，但若要使用\
    \ `Python` 语言的基础知识以及随附的优秀库和其他资源，你可以免费获得。\n\n话虽如此，会有几个不同的 `Python` 版本供你选择，选择一个你最想使用的版本可能会有点棘手。由于\
    \ `Python` 是一门解释型语言，它比于其他一些编程语言具有许多优势。你会注意到，与其他语言相比的优势之一是 `Python` 能够成长并根据你自己的计算需求做出必要的更改。就像你在电脑上找到的应用程序一样，`Python`\
    \ 一直在开发中，这些随开发而来的新功能可以随着时间的推移完善并改变 `Python`。\n\n由于 `Python` 已经存在多年，在这些时间里实际上发布了几个不同的\
    \ `Python` 版本。所有版本都得到了广泛接受，但它们与之前的版本相比，将为你提供一些不同的益处和功能。程序员在尝试选择一个这种编程语言版本来工作时，可供的选项包括：\n\
    \n1. **Python 2.X**：有几个 `Python 2` 版本可供选择。这是市场上的较旧版本之一，虽然如果你的电脑上是这个版本它仍然运行良好，但它它正变得有些过时，许多人将开始使用较新的\
    \ `Python 3` 选项。\n2. **Python 3**：如果你能选择一个版本在使用，那么 `Python 3` 将是最佳选择。它是最新的，并包含了你所需的大多数第三方插件、大多数项目所需的开发和功能，并且能够获得任何更新。如果你选择下载一个版本到电脑，这是最好的。\n\
