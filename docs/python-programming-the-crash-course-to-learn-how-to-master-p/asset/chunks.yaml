    \ and `__next__` because they provide the results for any objects in the generator\
    \ type.\n- **Recursive generators**: It is possible for your chosen generator\
    \ to be recursive, just like what you would find with some functions. The idea\
    \ here is that you would swap all of the elements that are on your list with the\
