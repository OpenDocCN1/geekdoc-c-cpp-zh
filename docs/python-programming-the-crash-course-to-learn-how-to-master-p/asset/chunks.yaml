  trans: "\n\n### 3. 关键字参数\n在这里你可以使用的第三种参数类型被称为关键字参数（keyword arguments）。这些参数与函数调用相关，它们就是这里将提到的关键字，以及分配给这些关键字的值。这些关键字与函数参数映射，这使得程序员更容易识别出正确的值，即使由于某种原因导致它们的顺序没有保持在原定位置。这是一个非常好用的参数，因为可以确保代码中的一切都保持条理有序。\n\
    \n### 4. 变长参数\n如果你在编写函数，但不知道具体需要向函数传递多少个参数，那么这就是你可以使用的另一种参数。或者，你可以利用这种方式进行设计，只要满足你设置的要求，就可以传递任意数量的参数。\n\
    \n## 编写你自己的自定义函数\n现在我们已经花了一些时间了解这些自定义函数以及它们的原理，现在是时候学习在 Python 内部需要执行的一些代码，以创建一个你自己的函数了。你可以遵循四个基本步骤，以确保在完成后生成一个自定义函数。\n\
    \n记住其中一点是，你有权让它变得像你所要求的简单或复杂。当然，在本指南和本章中，我们将观察确保你的自定义函数被创建所需要的基础知识。要实现这一点，你需要遵循的步骤包括：\n\
    \n- 遍历并声明函数。你可以借助 `def` 关键字来声明你的函数，然后需要在该关键字之后显示出函数的名称。\n1. 现在，你可以写出参数：这些参数需要放在函数的两个括号内。然后你可以用冒号结束整个声明，这样你就遵循了\
    \ Python 的正确规范。\n2. 添加你希望程序此时为你执行的语句（statements）。\n3. 最后，你可以结束函数。你可以根据此决定是否要使用返回（return）语句。\n\
    \n现在我们已经更了解了编写并让你的函数准备就绪所可以采取的步骤，现在是时候编写一个属于你自己的自定义函数了。关于如何实现这一点的一个很好的例子包括：\n\n\
    ```python\ndef userDefFunction (arg1, arg2, arg3, …):\n    program statement1\n\
    \    program statement2\n    program statement3\n    ...\n    Return;\n```\n\n\
    就这些了！遵循这些步骤，你就可以创建任何你想要的自定义函数，为你正在编写的程序增加一些功能和独特性。\n\n# 第 7 章：Python 代码中的继承\n\n\
    ![../../Images/Python%20Programming/alexandru-acea-582050-unsplash.jpg](img/00007.jpeg)\n\
    \n在本章中，我们将观察 Python 编程语言中你可以做的另一个酷功能。这种技术被称为继承（inheritance）。当你查看本章提供的一些代码和示例时，起初可能会觉得有些无从从。有些代码比较长，看起来很复杂。好消息是，这些继承比你想象的要容易使用得多，它们能够处理大量庞大笨肿的代码并使其变得更容易编写，而不需要在此过程中输入大量的代码行。这可以确保代码看起来更美观，清理你的工作内容，并且仍然为你提供在程序中所需的所有结果。\n\
    \n那么，让我们从编写我们自己的继承开始。为了在这里帮助你，并确保继承尽可能简单，我们首先需要对继承本质给出定义。这种继承基本上是你获取原始代码的全部或部分（在这项技术中被称为父类代码，parent\
    \ code），然后将其复制下来并进行一些更改，以生成子类代码（child code）。\n\n利用这些子类你可以做很多事情。你可以根据心意对它们进行调整、添加或删除。只要你以正确的方式进行继承，这些更改和添加会影响代码的这部分，但不会对父类代码产生任何影响。你可以根据原始父类创建任意数量的这种子类继承，并根据你自己的心意对每个部分进行更改和添加。\n\
    \n作为一个初学者，这听起来可能非常复杂，对你来说很难处理。但我们将带你通过几个可以使用它来完成的代码示例，你会发现它是非常有用的。你可以根据需要任意地复制父类代码，然后添加和删除所需内容，以确保代码按你的方式运行。为了理解这在你的代码中如何工作，让我们来看以下继承的语法和示例。\n\
    \n## 继承示例\n\n```python\n# 基类\nclass Student(object):\n    def __init__(self, name,\
    \ rollno):\n        self.name = name\n        self.rollno = rollno\n\n# 继承自 Student\
    \ 的研究生类\nclass GraduateStudent(Student):\n    def __init__(self, name, rollno,\
    \ graduate):\n        super().__init__(name, rollno)\n        self.graduate =\
    \ graduate\n    def DisplayStudent(self):\n        print(\"Student Name:\", self.name)\n\
    \        print(\"Rollno:\", self.rollno)\n        print(\"Study Group:\", self.graduate)\n\
    \n# 继承自 Student 类的 Post 类\nclass PostGraduate(Student):\n    def __init__(self,\
    \ name, rollno, postgrad):\n        super().__init__(name, rollno)\n        self.postgrad\
    \ = postgrad\n    def DisplayPostStudent(self):\n        print(\"Student Name:\"\
    , self.name)\n        print(\"Rollno:\", self.rollno)\n        print(\"Study Group:\"\
    , self.postgrad)\n\n# 实例化 Graduate 和 PostGraduate 类\nobjGradStudent = GraduateStudent(\"\
    Mainu\", 1, \"MS-Mathematics\")\nobjPostGradStudent = PostGraduate(\"Shainu\"\
    , 2, \"MS-CS\")\n\nobjPostGradStudent.DisplayPostStudent()\n```\n\n当你将此输入解释器时，你将得到结果：\n\
    - ('Student Name:', 'Mainu')\n- ('Rollno:', 1)\n- ('Study Group:', 'MS-Mathematics')\n\
    - ('Student Name:', 'Shainu')\n- ('Rollno:', 2)\n- ('Study Group:', 'MS-CS')\n\
    \n继承是一个值得学习的技术，因为它在你编写新代码时提供了很大的自由。如果你有一个父类或基类包含了许多你想使用的特性，或者你想用来构建派生类或子类，那么继承就是你处理此问题的方法，而不需要多次重写代码。如果你只有一个子类，这可能看起来没什么大。但如果你在代码中需要这样做十次、二十次或更多次，它将节省大量时间并确保你的程序看起来很精美。\n\
    \n程序员完全可以从一个父类开始，并创建任意数量的子类。只要它们之间是有顺序的，并且你使用了与上面类似的语法，就可以根据你的项目添加任意数量的此类子类。\n\
    \n"
