    # Chapter 13: Troubleshooting a Python Program When Things Aren’t Working as Planned


    ![../../Images/Python%20Programming/student-849825_1920.jpg](images/00013.jpeg)


    As a beginner, the idea of writing out a whole coding language can sometimes seem
    like a big deal and something that is really overwhelming to work with. We took
    a lot of time to look at the different parts of the code that you can work with
    and explored some examples to help you see what works and what might not work
    in your code.


    As you are starting to learn more about Python coding and all of the deffer parts
    that come with it, you may run into some troubles that you are going to need to
    deal with. Maybe your program isn’t working the way that you think it should,
    and you keep getting an error message that shouldn’t be there—or maybe you just
    don’t know how to fix the problem when you do run into this issue. The good news
    is there are some simple things that even a beginner is able to do with their
    program to get it up and running and to ensure that they are going to be able
    to get back to coding sooner. Some of the best troubleshooting ideas that you
    are able to work within Python include:


    ## Print Out the Code Often


    It is never a good idea to write out hours of code, and then go and test it. This
    may work if you get everything right. But if you get something wrong, you now
    need to go back through and fix all of the things that you did wrong. And that
    is a lot of code to go through and look for errors. Printing the information out
    and testing the code on a regular basis will ensure that you aren’t going to run
    into this problem.


    This doesn’t mean that you have to print out after each line. But it does mean
    to print often. If you can print out after each small bit of code, this will make
    it easier when things aren’t working the way that you want. If you have been printing
    out the information after every five minutes of coding for example, and all of
    a sudden something in the code isn’t working, you know exactly where the mistake
    is, and you won’t have to go through and search through all of the pages and all
    of the coding again.


    ## Start Out with Some of the Codes You Already Know


    As a beginner, there is a lot of new stuff that you are going to need to focus
    on to ensure that you get the results that you want out of your project. But thanks
    to the information in this guidebook, you now know how to work on some of the
    basics of the code in Python. When you are in doubt about some of the things that
    you need to do in different situations, then it is a good idea to do some practice
    with existing code, and codes that you know work already.


    Many beginners find that it is better for them to start out with some structures
    and syntaxes that are in existence already, and then you can go through and make
    the small changes that are needed for your own code. This ensures that the code
    is going to work, and can save some headaches along the way. As you use these
    existing code structures and learn how they work a bit more, you will then be
    able to write them on your own. But in the beginning, this is a good way to get
    started and see the results that you want.


    When you are ready to work on a project on your own, then there are a lot of resources
    that you can use in order to help you find the code that you want to work with.
    A quick Google search is going to be able to help you find the structure of the
    code that you need. It doesn’t have to be what you will need for that project
    exactly, but having the basic syntax is going to make things easier and will help
    you to get the code started. From there, you can make the changes that you want
    and then check out the code to make sure that all of the implanted changes are
    the ones that you want.


    ## After Small Changes, Run the Code to Check It Out


    Do not start out with a blank file, sit down, and spend an hour coding before
    you even try out the code for the first time. You will just make the work harder
    for yourself, and when there are a whole bunch of little errors that pop up, you
    won’t know where to start. It can take forever to go through it all and fix whatever
    is wrong.


    Instead, every few minutes, you should run the updates and test the code to see
    if something comes up. That way, when a bug does show up in the code, you only
    have a few lines or so of the code to check for the issue rather than a whole
    bunch of code. It really isn’t possible for you to test out your code too often,
    so do it as much as you can.


    Always remember that the more code that you write before you test it again, the
    more places where errors can occur and the more code that you will need to go
    search through again. And each time that you do go through and run the code, you
    will get some more feedback on your work so you can learn as you go.


    This may seem like it is slowing down your coding skills and what you are able
    to do to get the code done, but in reality, it is going to make a difference for
    what you are able to get done, and the amount of time that you spend on each project.
    If you have to go through and have to change the information on two hours of work,
    then this is going to take longer to find the mistake than it is worth. If you
    just have to go through and heck a small block of code at a time, then you will
    be able to find the error faster and get back on to your coding.


    ## Take the Time to Read Any Error Messages


    If you do make a mistake in some of the codes that you are writing, you are going
    to see an error message show up. When this does happen, you should actually read
    through the description, because this can point out what is wrong with your code
    and how you can fix it. Let’s say that you get an error message that says that
    the language runtime tried to execute the program but ran into a problem. What
    this means is that you skipped on a step in your code writing, or there was a
    typo, or something else is missing from the code. You will know what to fix from
    this information and can get int here and make sure it is done.


    If you are first getting started with Python programming, then it is possible
    that a message will come up and you won’t really understand what it is saying.
    But you should still read through it and see what information is there. At a minimum,
    you will at least get a line number on this message, and you can take a look on
    that line of your code to see what is going on.


    For those who have tried the other steps and still are not able to figure out
    what the error message is all about, then you do have the option of going online
    and searching for it. Some error messages can be confusing, and even if you go
    back through the lines and try to check, you may not be able to find the error
    and how to fix it.


    Doing an online search can help tell you exactly what is going on. You can just
    copy and paste the last line of that error message into Google and see what comes
    up. It is pretty likely that there will be at least a few results when you type
    this in as other coders were probably met with this message and had questions
    as well. This should provide you with some information on what is wrong in the
    code, and you can go back through and figure out what is wrong with your code
    and fix it all up.


    Even though this is a great way to get answers to the questions that you have,
    especially when you are not able to figure out what the error message means—but
    don’t just run to this for every time that an error message shows up. You aren’t
    going to learn much about coding and how to fix your own mistakes if you are just
    relying on Google to answer all of your questions. Try to take a look at the error
    and look through the code to see if you are able to fix it on your own. And then,
    if you get stuck, utilize this option for your own needs.


    ## Guess on the Fix and Then Check It Out

