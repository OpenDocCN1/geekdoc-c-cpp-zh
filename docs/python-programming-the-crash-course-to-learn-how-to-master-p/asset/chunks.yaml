    # Chapter 12: The Variables in the Python Language


    ![../../Images/Python%20Programming/laptop-3087585_1920.jpg](images/00012.jpeg)


    We have spent a lot of different topics inside this guidebook so far. We have
    looked at how to work with inheritances, how to make our own exceptions inside
    a code, how to create our own loops, and so much more. Now, we need to take a
    look at the next topic of variables and how they are going to work in the Python
    code.


    In order to keep this process simple, the variables are going to be anything inside
    the code that is able to hold onto a value that may or may not change. The variable
    is just like a box that is able to hold onto things, mainly information in this
    case. And they are important for a programmer to work with, in Python and in other
    coding languages, because these variables will ensure that when the code runs,
    the compiler is going to be able to pull out the right value at the right time.


    These variables are just going to be like stored into the memory of your computer
    and in the code. You will then be able to tell the compiler that you want these
    variables to be pulled out when it is time. This means that the variables that
    you go and write into the code are stored and found on a specific location in
    the memory of your computer. If they were not stored in that specific point, then
    it would be hard for the compiler to bring these back up when you were running
    the code.


    You want to make sure that the variables are given the right value as you work
    through this kind of code. It makes it easier for you to pull up the values that
    are assigned to it at a later point. Depending on the kind of data that you want
    to put into the code, the variable will be able to save the right space in the
    memory of your computer and makes it easier to find it later on.


    ## How Do I Assign a Value Over to the Variable?


    Before the variable is able to do the job that it needs, it has to have at least
    one value that is assigned to it. Otherwise, it is just an empty box found on
    the memory of the computer, with nothing in it. It isn’t going to pull up anything
    on the computer when the program decides to go through and run the program. If
    the variable as a value assigned to it the way that it should (and at times you
    will want to have more than one value that is assigned back to the same variable),
    then it is more likely to react the way that you are looking for with your code,
    as long as you did everything else right in the code.


    As you get more familiar with working on these variables, you will find that these
    come in three different options that you are able to use. Each of them is going
    to be brought up in different situations based on the code that you want to write,
    and the type of value that you decide to assign to that variable. Some of the
    main choices that you will get to work with when it comes to variable types include:


    *   `Float`: this would include numbers like `3.14` and so on.

    *   `String`: this is going to be like a statement where you could write out something
    like “Thank you for visiting my page!” or another similar phrase.

    *   Whole number: this would be any of the other numbers that you would use that
    do not have a decimal point.


    When you decide to work with some variables in your code, you must remember that
    you won’t have to take the time to make any declarations before a spot in the
    memory is saved for you. This is something that automatically happens once you
    use the equal sign and get the value assigned over to the variable as we talked
    about in the operators.


    The process of assigning a value or values over your chosen variable is going
    to be a simple process to work. You simply need to use the equal sign between
    the two to make it work. A couple of good examples of how you are able to do this
    will include:


    ```python

    x = 12

    ```

    this is an example of an integer assignment.


    ```python

    pi = 3.14

    ```

    this is an example of a floating point assignment.


    ```python

    customer name = "John Doe"

    ```

    this is an example of a string assignment.


    Another option that you can do here, and we have mentioned a little bit in this
    chapter already, is to have a variable assigned to two or more values. There are
    some instances when you are writing code, and you will need to take two values
    and place them with the same variable. To do this, you simply need to use the
    same procedure that we talked about above. Just make sure that you add in an equal
    sign to each part to help the compiler know that these are all associated with
    the same variable. So, you would want to write out something


    ```python

    a = b = c = 1

    ```

    to show the compiler that each of these variables equals one. Or you could have


    ```python

    a = b = 2

    ```

    to show that there are two values.


    The most important thing to remember here is that the variable needs to be assigned
    to a value in order to work in the code and that these variables are simply spots
    that are reserved in the memory for those values. Then, when the compiler needs
    to call up those values, it simply will call up the variable to bring everything
    out.


    As you can see, working with variables can be a simple process, but it is still
    something that you should spend some time with. There are a lot of different things
    that you are able to save in a variable, and assigning the right value or values
    over to your variable will ensure that the compiler is able to bring them up and
    provide you with the results that you need. Make sure to practice assigning a
    value over to the variable of your choice, and even assigning multiple values
    over to the variable of your choice so that you can get more familiar with how
    all of this works.

