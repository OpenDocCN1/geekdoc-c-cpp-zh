    查看我们上面的代码示例，你将看到 `match` 方法与 `search` 方法有何不同。你可以看到代码中存在某种模式，即 `orange` 这个对象将出现在所有单词之间。但如果你将
    `re_search` 切换为 `match`，那么你将无法获得任何结果，因为 `orange` 并不是字符串中的第一个术语。


    尽管在你的代码中发现了 `orange` 对象不仅出现了一次，还出现了两次，但它并不是字符串中出现的第一个对象。`match` 方法只会查看字符串中出现的第一个对象。由于那个对象不是
    `orange`，因此这里就没有可供你看到的匹配项。


    现在，这就是为什么从一开始让你的模式处于正确的顺序是如此重要。如果顺序错了，你将无法得到正确的答案。在编写代码时，你可以按照你喜欢的方式更改模式。但一旦代码编写完成并运行，模式就会保持不变，你无法对其进行任何更改。在这个示例中，由于我们拥有的模式不会让
    `orange` 首先出现，而使用 `match` 方法，你将无法获得任何结果。


    ## Findall 方法


    我们将在这里使用的第三种方法将是最后一个方法。当你需要确定字符串中某个特定对象出现了多少次时，这就是你想要使用的 `search` 方法。与我们讨论过的其他方法相比，你基本上是在寻找对象是否被找到，或者寻找它是否作为第一个搜索项存在。但当你使用
    `findall` 方法时，你将发现字符串中到底存在多少个 `orange`。使用我们之前的代码示例，你可以将其替换为 `findall` 方法，并获得“orange,
    orange”的输出，因为字符串中实际上有两个 `orange`。


    现在，当你编写代码时，你可以根据需要让字符串中包含任意数量的同一个对象。如果你愿意，你可以在字符串中设置二十个 `orange`，而 `findall` 将能够在输出中放入二十个
    `orange`。当然，你也可以选择与不同的对象一起。


    如你在这里看到的，`findall` 方法与我们在本节之前讨论的 `search` 方法稍有不同。由于它们略有不同，请将代码输入你的编译器，并对这三种方法进行一些实验，看看在进行必要更改时你通过它们可以获得什么输出。


    使用这些方法将对你的代码能够执行的搜索类型以及每种方法能够获得的结果产生巨大影响。花些时间查看这些内容并稍微修改代码以进行练习，并看看每种方法能为你做什么。


