    # 第 1 章：什么是 Python 编程语言？为什么它如此有益？


    ![../../Images/Python%20Programming/hitesh-choudhary-666995-unsplash.jpg](img/00001.jpeg)


    世界上有很多不同的编程语言供你选择。每种语言都有它们自己的优势和许多酷的特性——但当提到一种易于使用、对初学者友好、易于阅读、选项多、开源且背后仍有强大支持的语言时，Python
    编程语言是现有的最佳选择之一。


    多年来，Python 编程语言一直是人的喜爱。他们喜欢这种感觉：可以在学习这种语言的同时，仍在编写一些令人惊叹的代码，尽管他们是初学者，以前可能没有接触过这类编程——或者说任何类型的编程。


    Python 是一门面向计算机用户的编程语言。即使是初学者，也可以轻松地学习这种语言，但它背后仍有强大的力量，这让你能够真正实现你想要的代码。你可以编写复杂的商业应用程序，自动化你系统的某些管理任务，或者只是为了好玩而制作你自己的游戏和程序。


    当然，就像所有其他编程语言一样，Python 也有一套所有程序都需要遵循的规则和结构。无论你决定写什么样的代码，遵循 Python 的规则都非常重要。然而，与其他一些编程语言相比，你会发现这种编程语言是简单、紧凑且非常强大的。作为初学者，你很快就能上手，并在短时间内写出你自己的代码！


    在过去，许多人担心学习编程语言。他们担心这些语言太难学，担心自己会感到沮丧，并认为只有那些一辈子和电脑打交道的人才能尝试编写自己的代码——对于某些老旧的代码来说，这确实是事实。


    多亏于最近引入的许多新代码，只有那些在计算机编程方面极有天赋的人才能编写代码的想法已经消失。随着现在面出的许多代码（包括 Python），任何人都可以学习他们想要做的事的几项语法，甚至可以在网上找到一些预先好的代码并进行修改。由于这些代码中的许多是开源的，学习如何使用它们并开发满足你需求的代码比以往任何时候都更容易。


    现代编程语言比过去的大多数编程语言要好得多。即使是专业人士也苦于消除系统漏洞的时代已经过去了——现在是任何人都可以学习如何使用编程语言来满足自己的需求。这都要归功于像
    Python 这样许多优秀的面向对象编程语言的发展。


    根据你想要创建的程序和应用程序类型，有很多编码和编程语言供你选择。但尽管你有这么多不同的选项，许多计算机程序员（无论初学者还是以前接触过编程的人）选择 Python
    编程语言也是常有的。


    人们喜欢使用 Python 代码而不是其他其他选项有很多原因。人们选择 Python 语言的一些常见原因包括：


    1. 有许多库可以为你提供所需的支持。只需看一眼 Python 环境，你就会发现许多扩展和库可以为你提供所需的所有帮助。你可以在语言内部找到`类`、`对象`和`函数`，让你更容易创建所需的代码。此外，你还可以从外部源引入一些第三方库到混合中，帮助获得更多你需要的特性和力量。


    2. 集成特性：Python 因为很多原因是一种非常棒的语言，但原因之一是它可以与企业级集成相结合。这很重要，意味着你可以与它拥有的不同组件一起，包括 `COM`
    和 `COBRA`。它还有一些控制能力，使其能够与 `C`、`Java` 和 `C++` 工作。它可以处理许多标记语言，包括 `XML`，并可以使用任何现代操作系统，因此无论你开始时使用什么，它都能工作。


    3. 让程序员效率更高：Python 语言有许多不同的设计可以使用，它包含了面向对象以及你需要的支持库。得益于所有这些资源，以及编写该程序非常容易的事实，程序员可以轻松找到提高效率的方法。他们也可以利用这种效率来帮助他们处理其他其他编程语言。


