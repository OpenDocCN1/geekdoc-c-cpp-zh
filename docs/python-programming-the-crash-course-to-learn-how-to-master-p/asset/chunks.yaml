  trans: "\n\n默认情况下，Mac 电脑和操作系统不会安装此版本的 Python。如果你仍然想使用它，你只需要访问 `python.org` 网站并安装那里提供的几个选项即可。这通常是进行安装的最佳场所，因为它可以确保所有内容都已添加到你的计算机中，这样一旦下载完成，你就可以打开\
    \ `Python` 并开始编写代码了。在计算机上已经安装好了解释器、开发工具、`IDLE` 以及 `Python` 的 shell（外壳），要比一直都双重检查并单独下载这些东西要好用得多。\n\
    \n你是否能够运行 `Python` 上的 shell 和 `IDLE` 将取决于你在计算机上运行的版本，以及你对对此的偏好。你可以使用的、用于调出 `IDLE`\
    \ 和 shell 应用程序的命令包括：\n\n* 如果你正在使用 `Python` 2 版本，请输入“Idle”。\n* 如果你正在使用 `Python`\
    \ 3 版本，请输入“Idle3”。\n\n## Windows 系统\n\n你可能想在 Windows 电脑上使用 `Python` 编程语言。由于微软已经在系统中内置了自己的编程语言，该语言不会自动添加到你的计算机中。`Python`\
    \ 在这里可能不是标准配置，但如果你愿意，仍然可以在计算机上下载并进行安装。你还需要手动添加你需要的环境变量，因为这些默认情况下也不会自动完成。之后，你就可以从命令行提示符运行任何所需的\
    \ `Python` 脚本了。确保完成此操作需要执行的步骤包括：\n\n1.  要进行此设置，你需要访问 `Python` 官方下载页面并获取 Windows\
    \ 安装程序。你可以选择最新的 `Python` 3 版本，也可以选择其他选项。默认情况下，安装程序将为你提供 32 位的 `Python`，但如果你愿意，可以选择将其切换到\
    \ 64 位版本。32 位版本通常能确保与旧软件包不会出现任何兼容性问题，但如果你愿意，也可以进行尝试。\n\n现在，右键点击安装程序并选择“以管理员身份运行”。会有两个选项供选择。你想要选择“自定义安装”（Customize\
    \ Installation）。\n\n在接后的屏幕上，确保勾选“可选功能”（Optional Features）下的所有复选框，然后点击继续。\n\n2.\
    \  在“高级选项”（Advanced Options）下，你应该选择你想要安装 `Python` 的位置。点击`Install`（安装）。留一些时间完成，然后关闭安装程序。\n\
    \n3.  接下来，为系统设置 `PATH` 变量，以便包含你以后需要的软件包和其他组件的目录。要执行此操作，请使用以下指令：\n\n    1.  打开控制面板`Control\
    \ Panel``通过点击任务栏并输入 `Control Panel` 来执行。点击该图标。\n    2.  在控制面板内部，搜索 `Environment`。然后点击“编辑系统环境变量”（Edit\
    \ the System Environment Variables）。在这里，你可以点击“环境变量”（Environment Variables）按钮。\n\
    \    3.  进入“用户变量”（User Variables）部分。你可以编辑现有的 `PATH` 变量，也可以创建一个。\n    4.  如果系统中没有\
    \ `PATH` 变量，请点击“新建”（New）来创建一个。为 `PATH` 变量命名并添加你需要的目录。关闭所有 `control Panel` 对话框并继续。\n\
    \n现在，你可以打开命令行提示符了。通过点击`开始菜单`、`Windows 系统`，然后`命令行提示符`来实现。输入“python”。这将为你加载 `Python`\
    \ 解释器。\n\n当你到达这一步时，程序已经在 Windows 系统上设置完毕并易于使用了。当你准备好时，可以打开解释器，以及其他所需内容，并开始编写代码和创建你想要的程序。\n\
    \n## Linux 系统\n\n为了在你的计算机上设置好这种编程语言及其所有环境，我们需要遵循的最后一步是查看在 Linux 电脑上可以采取的步骤。随着越来越多的程序员转向使用\
    \ Linux 系统来帮助他们完成工作和进行代码编写，学习如何在此类操作系统上运行它总是一个个好主意。\n\n我们需要采取的第一步是检查系统中已经安装了哪个版本的\
    \ `Python`，并查看是否已经有了 `Python` 3。要检查这一点，你只需要打开计算机上的命令行提示符，并运行以下代码：\n\n```bash\n\
    $ python3 --version\n```\n\n如果你使用的是 Ubuntu 16.10 或更高版本，那么安装 `Python` 3.6 是一个简单的过程。你只需要使用以下命令：\n\
    \n```bash\n$ sudo apt-get update\n$ sudo apt-get install Python3.6\n```\n\n如果你依赖于旧版本的\
    \ Ubuntu 或或其他版本，你可能想要使用 deadsnakes PPA 或其他工具来帮助你下载 `Python` 3.6 版本。执行此操作的代码包括：\n\
    \n```bash\n$ sudo apt-get install software-properties-common\n$ sudo add-apt repository\
    \ ppa:deadsnakes/ppa\n# sudo apt-get update\n$ sudo apt-get install python3.6\n\
    ```\n\n这里你需要注意的一点是，如果你在此类操作系统提供的其他发行版上工作，很有可能 `Python` 3 的整个程序已经存在系统中。如果没有，你可以使用软件包。如果你发现版本不正确或不够新以满足你的需求，你可以使用相同的步骤来安装较新版本。\n\
    \n## 使用 Python 解释器\n\n如果你通过 `python.org` 执行了标准的安装，那么这些工作已经为你完成了。它将包含你所需的所有许可、信息和文档，以及帮助你开发和运行所有脚本所需的三个文件。这三个文件将包括\
    \ shell、解释器和 IDLE。\n\n首先，我们需要查看解释器。这是你需要配置的拼图中非常重要的一部分，因为它是执行你编写的任何脚本的部分。解释器随后能够将\
    \ `.py` 脚本文件转换为指令，然后根据你决定编写的文件类型和代码类型对其进行处理。\n\n"
