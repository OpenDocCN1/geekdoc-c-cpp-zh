  trans: "\n你将能够在代码中使用并操作这些正则表达式，帮助你过滤不同的文本字符串或文本的各个部分。你可以检查并查看某个字符串或其他文本是否已经存在代码中，以及它是否会与某些正则表达式匹配。这些正则表达式的妙之处在于，无论你选择哪种语言，你都可以坚持使用相似的语法。因此，如果你学会了如何在\
    \ `Python` 语言中完成这项工作，你就可以将这些知识应用到其他语言的正则表达式中。\n\n到为止，我们已经讨论了正则表达式的一些优势，但我们还没有真正探索这些表达式究竟是什么，或者你将如何在大代码中使用这些正则表达式。开始这个过程并帮助你理解的一个很好的切入点是：调出你的文本编辑器，然后尝试让程序定位代码中以两种不同方式拼写的任何单词。这些正则表达式可以用来消除由于这类问题可能产生的错误和困惑。\n\
    \n你会很快发现，使用这些正则表达式可以为你手头已有以及正在编写的代码开启一个各种不同的可能世界。这就是为什么学习如何正确使用这些正则表达式如此重要的原因。如果你想调用这些表达式并开始在代码中使用它们，你需要做的第一件事就是导入表达式库。在你刚开始安装\
    \ `Python` 时就这样做，因为你可能会经常使用这些正则表达式。\n\n计算机程序员在编写语句时，有许多不同的正则表达式可以选择。如果你预先知道这些语句的工作原理以及它们能做的一切事情，将对你能够让代码实现的功能产生巨大影响。让我们在这里花一点时间看看最常见的正则表达式、这些表达式是如何工作的，以及你如何在你自己的代码中以正确的方式使用它们。\n\
    \n## 出现的基础模式\n\n许多计算机程序员喜欢这些正则表达式的一点是，它们并不局限于仅存在一种固定字符。这些正则表达式将帮助你留意沿途所需的某些模式。在你处理这些正则表达式时，你可能会发现出现一些最常见的模式包括：\n\
    \n1. `a`、`X`、`9`、`<` —— 普通字符精确匹配自身。那些由于具有特殊含义而不会匹配自身的元字符包括：`.`、`^`、`$`、`*`、`?`、`{`、`[]`\
    \ 等。\n2. `.`（点）——匹配除换行符 `\\n` 之外的任何单个字符。\n   `\\w`——这是小写字母 `w`，用于匹配“单词”字符。它可以是字母、数字或下划线。记住，这是一个助记符，它匹配的是单个单词字符而不是整个单词。\n\
    3. `\\b`——这是非单词字符与单词之间的边界。\n4. `\\s`——匹配单个空白字符，包括空格、制表符、返回、换行，甚至是普通空格。如果你使用 `\\\
    S`，你指代的是任何非空白字符。\n5. `^` = 开始，`$` = 结束——这些将匹配字符串的开头或结尾。\n6. `\\t`、`\\n`、`\\r`——这些代表制表符、换行和返回。\n\
    7. `\\d`——这是 `0` 到 `9` 之间所有数字的十进制数字。某些旧正则表达式工具不支持此项，因此在使用时要小心。\n8. `\\`——这会抑制字符的特殊性。如果你不确定某个字符是否具有特殊含义，可以使用它来确保该字符像其他字符一样被对待。\n\
    \n当然，这些只是你可以在自己的代码中调用和使用的不同正则表达式的示例。确保尝试几次，因为它们很重要，并且你需要获得一些使用它们的经验，以确保它们在你的代码中正常工作。有许多不同的代码实例和类型需要这些正则表达式，有时你甚至需要多个正则表达式在代码中获得你想要的结果。\n\
    \n## 借助正则表达式在 Python 中进行查询\n\n现在，你不仅可以使用这些正则表达式来帮助寻找现有代码中的基本模式，还可以将它们作为搜索代码中任何输入字符串的方法。根据你尝试在代码中查找的内容，有三种方法供你进行这些搜索。每段代码和代码的每个部分都需要你执行不同的查询类型才能使其正常工作。让我们来看看这三种方法，并更好地每种方法是如何工作的。\n\
    \n### 搜索方法 (Search Method)\n\n我们将查看的第一个查询选项是搜索方法。这个方法非常好用，因为它允许程序员匹配查询内容，无论它最初出现在代码的什么位置。这个函数的限制没有像我们将讨论的另外两种方法那么多。如果你想在整个字符串中搜索一个单词或几个单词，而不仅仅是开头或结尾，那么搜索方法就是你想要使用的。\n\
    \n当你利用这种搜索方法时，它可以帮助查找字符串中出现的单词或语句。你在编译器中输入它时的良好示例如下：\n\n```python\nimport re\n\
    \nstring = 'apple, orange, mango, orange'\n\nmatch = re.search(r'orange', string)\n\
    \nprint(match.group(0))\n```\n\n在我们继续之前，打开你的编译器并添加这段代码，看看输出结果是什么。如果你操作得当，这段代码将为你提供‘orange’的输出。对于这种方法，无论术语出现多少次，我们只会看到第一次出现的匹配。\n\
    \n当然，很可能在某些时候你想知道该术语在代码或代码该部分出现了多少次。在接下来的几个章节中，我们将教你如何实现这一点。但在这一部分，你只能提取到该方法第一次找到的单词。\n\
    \n### 匹配方法 (Match Method)\n\n虽然在某些情况下你可以使用搜索方法，并且你会很快发现它能为你的代码做很多事情，但它并不一定适用于你想要做的任何搜索和查询。另一个你可以使用的选项是匹配方法。这种方法旨在帮助你查找查询项，但只有当该查询出现在字符串的开头时，它才会显示。当你想要让它查找位于搜索的语法中的某些特定模式时，这种方法非常好。\n"
- fmt: "\nLooking at the example of code that we have above, you will be able to see\
    \ how the `match` method is different compared to the `search` method. You can\
    \ see that there is some kind of pattern in that code, where the object of orange\
    \ is going to show up between all of the words. But if you switch out the re_search\
    \ for the match, then you are not going to get any results at all because orange\
    \ is not the first term in that string.\n\nEven though there is the object of\
    \ orange found not only once, but twice, inside your code, it is not the first\
    \ object that shows up in the string. The `match` method is just going to take\
    \ a look at that first object that appears in the string. And since that is not\
    \ going to be orange, then there is no match for you to see here.\n\nNow, this\
    \ is why it is so important to have your pattern in the right order right from\
    \ the beginning. If the order is off, then you are not going to end up with the\
    \ right answers here. You are able to change the pattern up any way that you would\
    \ like when writing out the code. But once you get the code up and running, that\
    \ pattern is going to stay put, and you aren’t able to go through this and make\
    \ any changes. With this example, with the patterns that we have is not going\
    \ to have the orange show up first and with the `match` method, you will not get\
    \ any result at all.\n\n## The Findall Method\n\nAnd the third method that we\
    \ are going to work with here is going to be the final method. This is the option\
    \ `search` method that you will want to use when it is time to figure out how\
    \ many instances of a particular object are found in a string. With the other\
    \ methods that we have talked about, you are basically finding out if the object\
    \ is found at all, or finding out if it is present as the first search item. But\
    \ when you work with the `findall` method, you are going to find out just how\
    \ many oranges are present in that string. Using the code example that we had\
    \ before, you are going to be able to replace it with the `findall` method and\
    \ get the output of “orange, orange” since there are actually two oranges in the\
