    As you go through and write some of your own codes, you may quickly notice that
    it is important to add in a little reminder or a little note. This could be a
    kind of explanation for what you are doing in this specific part of the code.
    These are little notes that you would put in place because they remind you, and
    tell other programmers who are going through the code, what is going on at a certain
    part of it. It can also add some organization to the code as a whole.


    The nice thing about working with these comments is that you are able to add them
    in, and with the right things in place (namely the `#` in front of the comment),
    the compiler will choose to skip right over the comment and continue on with other
    parts of the code. This saves you time and ensures that you are able to add in
    the explanations and the notes that you want to the code, without having to worry
    about how it will affect the code at all.


    You will be able to work through your code and write in as many of these comments
    as you would like. Just make sure that the comments are useful and belong there.
    You don’t want to waste anyone’s time with these comments just to clutter things
    up and not make the whole thing look nice at all. Having too many comments is
    not a good thing. But if you think that your project needs it to help explain
    something, then go ahead and add some more in as well.


    ## Variables


    The next thing that we are going to work on here are the variables. These are
    important to the Python code because you are going to find them pretty often in
    any code that you decide to work on. The variables are there because they can
    help store some of the different values that you are trying to add to the code.
    And when you assign a value to one of your variables, it keeps things organized
    and looking nice.


    You are able to add in any value that you want to the variable, just make sure
    that the equal sign `=` is present so that the compiler knows where that value
    is meant to go. And, if you do the process in the proper manner, you can even
    go through and make more than one value attach to the same variable. This is done
    in some of the more complex codes that you may choose to work with, but it is
    still something that you may want to do on occasion. You simply need to add in
    the equal sign between each part to show the compiler that one variable is going
    to take care of more than one value at the same time.


    ## Classes and Objects


    Other topics that we can look at are the classes and the objects. Since Python
    is considered an object-oriented language, it is going to divide things up into
    classes and objects, to make it a bit easier to work with. This just ensures that
    you are able to find the information that you need in the code, without a lot
    of hassle or worry about where it will go.


    A good way to think about the classes and objects is like having a box. Each box
    is going to be your class, and it is responsible for holding onto certain objects.
    You can put as many objects inside each class as you would like, but you need
    to make sure that they go together in some manner. When someone takes a look in
    that class, it needs to make sense why they would see certain items in that class,
    and why certain items should be left out.


    Now, the items in a class don’t need to be exactly the same, nor should you try
    to make them this way. But they do need to have some relation to one another and
    make sense for why they are in the same class as each other. Maybe you have a
    class of vehicles, you are able to put all the cars, trucks, vans, and more in
    there because they are all a type of vehicle for example,


    This is just a better way to split up the information and the data that you want
    to store on Python. It ensures that when you call up one of the objects that you
    saved, it is actually going to show up in the code where it is supposed to. Without
    this, you could run into some issues as things get lost, and it just makes things
    more confusing for someone who is a beginner.


    ## Operators


    The final part of the Python code that we are going to explore here is the operators.
    These are a great thing to learn how to work with, and even though they are simple,
    they are going to add a lot of power to the codes that you are doing. When you
    start going through your code, you will see that there are many types of operators
    that you are able to work within your code. For example, you may work with the
    arithmetic functions to help you any time you want to multiply, subtract, divide,
    and add your parts together. There are also the assignment operators that give
    value over to the variable, the comparison operators that will look at your different
    codes and determine if they go together or are similar or not, and more.


    Learning these operators can make writing any code that you have a lot easier.
    They will do comparisons, math, and assign the values that you need. And often
    they use basic symbols to help get the work done. As you look through some of
    the codes that are going to be present throughout this guidebook, and even some
    of the other topics that we will talk about, you will notice a lot of these operators
    tend to show up, and if they weren’t present, it could cause some issues with
    how well the code would work.


    These are just some of the basic parts that come with a code you would need to
    write in the Python language. You will need to learn how each of these works in
    order to write some of the basic codes that come with this language and to make
    sure that you are able to use this language to write your own codes. Even when
    you are working on the codes that are really hard and complex to do, you may find
    some of these basic parts are inside as well!


    ## Chapter 3: Working with Conditional Statements


    ![../../Images/Python%20Programming/glenn-carstens-peters-203007-unsplash.jpg](images/00003.jpeg)


    Now, it is time to move on to the topic of conditional statements, which can also
    go by the name of decision control statements. These are going to be the statements
    that allow the computer to make some decisions, based on the input that the user
    has, as well as what you would like to happen with the program. You will have
    many times in your program where you will want the computer to make some decisions
    and complete itself when you are not there. If you are working on a code where
    you would like the user to put in their own answer, rather than just giving them
    two options to work with, then these decision control statements are going to
    be good options to work with.


    There are going to be a few different kinds of options that you are able to work
    with when you are making these conditional statements. The three most common ones
    are going to include the `if` statement, the `if else` statement, and the `elif`
    statement. As a beginner, we are going to start out with the basics of the `if`
    statement to get a good idea of how these can work, and then we will build up
    in order to understand some of the more complicated things that you are able to
    do with these conditional statements.


    The first option that we are going to take a look at is the `if` statement. The
    `if` statement is going to work with the ideas that the answer that your user
    gives to the computer is going to be either true or false. If the user does an
    input of information that is seen as true based on your code, then the interpreter
    will be able to continue on with the program, and it will show up the statements
    or the information that you would like. But, if the user is on the program and
    puts in something that doesn’t match up with your code, and is seen as false,
    then the program is automatically going to end.

