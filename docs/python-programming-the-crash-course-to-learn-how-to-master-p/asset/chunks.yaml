    \ you know ahead of time how these statements work and all of the things that\
    \ they can do, it is going to make a big difference on what you can make your\
    \ code do. Let’s spend a bit of time here looking at the regular expressions that\
    \ are the most common, how these expressions work, and how you are able to use\
    \ them in the proper manner in your own code.\n\n## The Basic Patterns Present\n\
    \nOne thing that a lot of computer programmers like about these regular expressions\
    \ is that they aren’t stuck with just having them present for one kind of fixed\
    \ character. These regular expressions are going to be able to help you to watch\
    \ out for some of the patterns that are needed along the way. As you work on these\
    \ regular expressions, you may notice that some of the most common patterns that\
    \ show up include:\n\n1. `a`, `X`, `9`, `<` -- ordinary characters just match\
    \ themselves exactly. The meta-characters that aren’t going to match themselves\
    \ simply because they have a special meaning include: `.`, `^`, `$`, `*`, `?`,\
    \ `{`, `[]` and more.\n2. `.` (the period)—this is going to match any single except\
    \ the new line symbol of `\\n`\n   `\\w`—this is the lowercase `w` that is going\
    \ to match the “word” character. This can be a letter, a digit, or an underscore.\
    \ Keep in mind that this is the mnemonic and that it is going to match a single\
    \ word character rather than the whole word.\n3. `\\b`—this is the boundary between\
    \ a non-word and a word.\n4. `\\s`—this is going to match a single white space\
    \ character including the form, form, tab, return, newline, and even space. If\
    \ you do `\\S`, you are talking about any character that is not a white space.\n\
    5. `^` = start, `$` = end—these are going to match to the end or the start of\
    \ your string.\n6. `\\t`, `\\n`, `\\r`—these are going to stand for tab, newline,\
    \ and return\n7. `\\d`—this is the decimal digit for all numbers between `0` and\
    \ `9`. Some of the older regex utilities will not support this so be careful when\
    \ using it\n8. `\\` --this is going to inhibit how special the character is. If\
    \ you use this if you are uncertain about whether the character has some special\
    \ meaning or not to ensure that it is treated just like another character.\n\n\
    Of course, these are just a sampling of the different regular expressions that\
    \ you are able to bring out and use inside inside your own codes. Make sure to\
    \ try them out a few times because they are important, and you need to gain some\
    \ experience with them to ensure they work the proper way in your own code. There\
    \ are many different instances and types of codes that will need these regular\
    \ expressions, and there are even times when you will need more than one to get\
    \ the results you would like in the code.\n\n## Doing Queries in Python with the\
    \ Help of Regular Expressions\n\nNow, not only are you able to use these regular\
    \ expressions to help you find basic patterns in the code that you have, but it\
    \ is also possible to use these as a way to search for any input string that is\
    \ inside the code. There are going to be three methods that are available for\
    \ you to do these searches, based on what you are trying to find in the code.\
    \ Each code and each part of the code is going to require you to do a different\
    \ query type to get things to work. Let’s take a look at each of these three and\
    \ get a better idea of how each one does work.\n\n### The Search Method\n\nThe\
    \ first query option that we are going to take look at is the search method. This\
    \ one is helpful to use because it is going to allow the programmer to match up\
    \ the query, no matter where it shows up in the code to start with. This function\
    \ isn’t going to come with as many restrictions as the other two we will talk\
    \ about. If you would like to search for a word or a few words throughout the\
    \ whole string, and not just at the beginning of it or at the end of the string,\
    \ then the search method is the one that you will want to work.\n\nWhen you utilize\
    \ this search method, it is going to be helpful at looking for a word or a statement\
    \ that shows up inside your string. A good example of what this is going to look\
    \ like when you type it into your compiler includes\n\n```python\nimport re\n\n\
    string = 'apple, orange, mango, orange'\n\nmatch = re.search(r'orange', string)\n\
    \nprint(match.group(0))\n```\n\nBefore we move on with this one, open up your\
    \ compiler and add this code to see what the output is that you get. This code\
    \ is, if you did it properly, going to provide you with the output of ‘orange’.\
    \ For this method, we are going to see the match show up just time, regardless\
    \ of how many times the term comes in the code. As soon as the method is able\
    \ to find this term the first time, it is going to stop looking and will just\
    \ provide you with the output.\n\nOf course, there are most likely going to be\
    \ times when you would like to get an idea of how often the term does show up\
    \ in the code or that part of the code. And in a few sections, we will show you\
    \ how to make this happen. But for this part, you will only be able to pull up\
    \ the word the first time that it is found by this method.\n\n### The Match Method\n\
    \nWhile there are some times when you will be able to work with the search method,\
    \ and you will quickly see that there are a lot of things that it is able to do\
    \ for your code, it isn’t necessarily going to work with every search and query\
    \ that you would like to do. Another option that you can work with is the match\
    \ method. This method is meant to help you find matches to the query, but they\
    \ are only going to show up if that query shows up at the beginning of your string.\
    \ This method works well when you want it to find some specific patterns that\
    \ may show up in the syntax that you would like to search through.\n"
  raw: 'You will be able to take and use these regular expressions in the code to
    help you filter out the different strings of text or individual parts of the text.
    It is possible to check and see if a string or some other text is already inside
    the code, and whether or not it is going to match up with some of the regular
    expressions as well. The nice thing about these regular expressions is that you
    are able to stick with a syntax that is similar, no matter the language that you
    choose to go with. So, if you learn how to get this done inside the Python language,
    you will be able to take the knowledge and work with regular expressions in other
    languages as well.


    By this point, we have talked about some of the benefits of regular expressions,
    but we haven’t really explored what these expressions are all about, or even how
    you will be able to use these regular expressions inside your code. A good place
    to start for this process and to help you to understand is to bring out your text
    editor, and then try to get the program to locate any word that was spelled in
    two different manners in the code. These regular expressions can be used in order
    to cut out the errors and the confusion that could come up with this kind of problem.


    You will quickly see that working with these regular expressions can open up a
    world of different things that you are able to do with the code you have on hand
    and are writing. This is why learning how to use these regular expressions in
    the proper manner is going to be so important. If you would like to bring out
    these expressions and start using them in your code, the first thing that you
    need to do is import the expression library. Do this when you first start to install
    Python because you are likely to use these regular expressions quite a bit.


    There are a lot of different regular expressions that a computer programmer is
    able to choose from when they want to write out their statements. And if you know
    ahead of time how these statements work and all of the things that they can do,
    it is going to make a big difference on what you can make your code do. Let’s
    spend a bit of time here looking at the regular expressions that are the most
    common, how these expressions work, and how you are able to use them in the proper
    manner in your own code.


    The Basic Patterns Present


    One thing that a lot of computer programmers like about these regular expressions
    is that they aren’t stuck with just having them present for one kind of fixed
    character. These regular expressions are going to be able to help you to watch
    out for some of the patterns that are needed along the way. As you work on these
    regular expressions, you may notice that some of the most common patterns that
    show up include:


    1.  a, X, 9, < -- ordinary characters just match themselves exactly. The meta-characters
    that aren’t going to match themselves simply because they have a special meaning
    include: . ^ $ * ? { [] and more.


    2.  . (the period)—this is going to match any single except the new line symbol
    of ‘\n’


    \w—this is the lowercase w that is going to match the “word” character. This can
    be a letter, a digit, or an underscore. Keep in mind that this is the mnemonic
    and that it is going to match a single word character rather than the whole word.


    3.  \b—this is the boundary between a non-word and a word.


    4.  \s—this is going to match a single white space character including the form,
    form, tab, return, newline, and even space. If you do \S, you are talking about
    any character that is not a white space.


    5.  ^ = start, $ = end—these are going to match to the end or the start of your
    string.


    6.  \t, \n, \r—these are going to stand for tab, newline, and return


    7.  \d—this is the decimal digit for all numbers between 0 and 9\. Some of the
    older regex utilities will not support this so be careful when using it


    8.  \ --this is going to inhibit how special the character is. If you use this
    if you are uncertain about whether the character has some special meaning or not
    to ensure that it is treated just like another character.


    Of course, these are just a sampling of the different regular expressions that
    you are able to bring out and use inside your own codes. Make sure to try them
    out a few times because they are important, and you need to gain some experience
    with them to ensure they work the proper way in your own code. There are many
    different instances and types of codes that will need these regular expressions,
    and there are even times when you will need more than one to get the results you
    would like in the code.


    Doing Queries in Python with the Help of Regular Expressions


    Now, not only are you able to use these regular expressions to help you find basic
    patterns in the code that you have, but it is also possible to use these as a
    way to search for any input string that is inside the code. There are going to
    be three methods that are available for you to do these searches, based on what
    you are trying to find in the code. Each code and each part of the code is going
    to require you to do a different query type to get things to work. Let’s take
    a look at each of these three and get a better idea of how each one does work.


    The Search Method


    The first query option that we are going to take a look at is the search method.
    This one is helpful to use because it is going to allow the programmer to match
    up the query, no matter where it shows up in the code to start with. This function
    isn’t going to come with as many restrictions as the other two we will talk about.
    If you would like to search for a word or a few words throughout the whole string,
    and not just at the beginning of it or at the end of the string, then the search
    method is the one that you will want to work with.


    When you utilize this search method, it is going to be helpful at looking for
    a word or a statement that shows up inside your string. It doesn’t matter where
    this item shows up, even if it is the last part of the whole string. A good example
    of what this is going to look like when you type it into your compiler includes


    import re


    string = ‘apple, orange, mango, orange’


    match = re.search(r’orange’, string)


    print(match.group(0))


    Before we move on with this one, open up your compiler and add this code in to
    see what the output is that you get. This code is, if you did it properly, going
    to provide you with the output of “orange’. For this method, we are going to see
    the match show up just one time, regardless of how many times the term comes in
    the code. So, with this one, you technically see the word orange show up twice,
    but the search method is going only to bring it up once. As soon as the method
    is able to find this term the first time, it is going to stop looking and will
    just provide you with the output.


    Of course, there are most likely going to be times when you would like to get
    an idea of how often the term does show up in the code or that part of the code.
    And in a few sections, we will show you how to make this happen. But for this
    part, you will only be able to pull up the word the first time that it is found
    by this method.


    The Match Method


    While there are some times when you will be able to work with the search method,
    and you will quickly see that there are a lot of things that it is able to do
    for your code, it isn’t necessarily going to work with ever search and query that
    you would like to do. Another option that you can work with is the match method.
    This method is meant to help you find matches to the query, but they are only
    going to show up if that query item shows up at the beginning of your string.
    This method works well when you want it to find some specific patterns that may
    show up in the syntax that you would like to search through.'
