  在本章中，我尝试收集了一小部分问题，你在申请实时、嵌入式、固件开发人员职位时可能会遇到。我跳过了图表、二叉树、装水的桶，因为这类问题很少出现在嵌入式系统开发者的技术面试中。\n\
  \n## 通用编程。\n\nQ. 下面代码的局限性是什么？是否存在潜在的问题？\n\n```cpp\n#define LOG_CAT(fmt, ...) print_log(\"\
  %s %d\" fmt, __FUNCTION__, __LINE__, ##__VA_ARGS__ )\n\nstatic inline void print_log(const\
  \ char *fmt, ...)\n{\n    va_list ap;\n    va_start(ap, fmt);\n    vprintf(fmt,\
  \ ap);\n    va_end(ap);\n}\n```\n\nA. 宏 `LOG_CAT` 假设 “fmt” 是一个常量字符串。例如，以下代码将无法编译：\n\
  \n```cpp\nvoid testLogCat()\n{\n    char *f = \"Test %d\";\n    LOG_CAT(f, 1);\n\
  }\n```\n\n对函数 `vprintf()` 的调用在某些平台上不是重入的。在其他平台上，`vprintf()` 使用栈上的一个大缓冲区，如果从中断中调用，可能会产生问题。\n\
  \nQ. 以下中断处理程序有什么问题？尝试尽可能指出所有的潜在问题：\n\n```cpp\nuint32_t Tick = 0;\nint MyTickIsr()\n\
  {\n    Tick++;\n    printf(\"%s\", __FUNCTION__);\n    return 0;\n}\n```\n\nA.\n\
  1. 通常情况下中断处理程序不应该返回返回值。返回的结果取决于操作系统。\n2. 全局变量的增加是一个“读取-修改-写入”操作。当中断处理程序被调用时，另一个线程可能正处于修改\
  \ `tick` 值的过程中。\n3. 在许多系统中，`printf()` 不是可重入 API。如果 `printf()` 使用栈分配字符串，调用 `printf()`\
  \ 可能会导致栈溢出。取决于实现，调用 `printf()` 可能需要大量时间。\n\nQ. 列出在“生产者”和“消费者”之间实现 FIFO 的最常用方法。假设生产者产生\
  \ 1 到 256 字节不同大小的数据块。\n\nA.\n1. 指针环形缓冲区，其中每个指针指向一个例如 16 字节数据块的链表。生产者从空闲块链表中分配数据块。\n\
  2. 指针环形缓冲区，引用每个 256 字节的数据块。生产者从空闲块链表中分配数据块。\n3. 数据环形缓冲区，每个数据块的前面都加上数据块的大小。\n\n请准备好从内存和性能角度讨论每种方法的优缺点，以及\
  \ Linux 内核中的“skb”缓冲区、DMA 描述符、零拷贝数据处理。\n\nQ. 写一个程序来判断机器是大端序还是小端序。\n\nA. 在运行时可以使用此函数：\n\
  \n```cpp\nint isLittleEndian() {\n    short int data = 0x0001;\n    char *byte =\
  \ (char *) &data;\n    return (byte[0] ? 1 : 0);\n}\n```\n\n在编译时使用此宏：\n\n```cpp\n\
  #define IS_LITTLE_ENDIAN (*(uint16_t *)\"\\0\\xff\" >= 0x100)\n```\n\n在 Linux 中，我们有一个宏\
  \ `BYTE_ORDER`。在 GCC 中，我们有宏 `__LITTLE_ENDIAN__`、`__BIG_ENDIAN__`、`__BYTE_ORDER__`。\n\
  \nQ. 写一个类，使得其他类无法继承该类。\n\nA. 解决方案基于单例设计模式——一个具有私有构造函数的类：\n\n```cpp\nclass YouCanNotInheritMe\
  \ {\nprivate:\n    YouCanNotInheritMe() {}\n};\n```\n*(注：由于原文文本在后处存在大量重复，以上翻译已根据逻辑去除了冗余的重复内容)*\n\
  \n\n\n\n```cpp\nmemset(dataArray.c, 0, sizeof(dataArray.c));\n}\n```\n\nA. 在某些架构中，CPU\
  \ 可能会预测数据使用情况并相应加载数据缓存行（cache lines）。通常，缓存内存中的单行为 64 或 128 字节。在 `initDataArrayC`\
  \ 函数中，当调用第二个 `memset` 时，数据缓存可能已经包含了字段 “a” 以及字段 “b” 的全部或部分 —— CPU 预测到了顺序写入。函数 `initDataArrayC`\
  \ 写入了字段 “c”，这会导致数据缓存行冲刷（flush），并减慢第二个 `memset()` 的执行速度。\n\nQ. 对下代码进行何种**单项修改**，可以提高\
  \ `testFastSum` 函数的性能？\n\n```cpp\nclass FastSum {\npublic:\n    FastSum(int delta)\
  \ : delta(delta) {}\n    virtual int sum(int a) { return delta+a; }\n    virtual\
  \ ~FastSum() {}\nprotected:\n    int delta;\n};\n\nvoid testFastSum(int delta, int\
  \ *result, int count) {\n    FastSum fastSum(delta);\n    for (int i = 0; i < count;\
  \ i++) {\n        result[i] = fastSum.sum(i);\n    }\n}\n```\n\nA. **去虚化（Devirtualization）**\
  \ —— 将虚方法 `sum()` 替换为非虚方法 —— 可以帮助。将虚函数调用替换为非虚调用每次迭代可以节省 2-3 条指令。如果 C++ 编译器的去虚化做得很好（`GCC`\
  \ `4.8` 则不能），那么下一个选项是确保编译器内联构造函数 `FastSum` 和方法 `sum`。\n\nQ. 下述代码存在一个竞态条件。它是什么？\n\
  \n```cpp\nclass LazyInitialization {\n    static LazyInitialization *getInstance()\
  \ {\n        if (instance == nullptr) {\n            MutexAB m;\n            if\
  \ (instance == nullptr) {\n                instance = new LazyInitialization();\n\
  \            }\n        }\n        return instance;\n    }\nprivate:\n    LazyInitialization();\n\
  \    static LazyInitialization *instance;\n};\n\nLazyInitialization *LazyInitialization::instance\
  \ = nullptr;\n```\n\nA. 线程 A 进入同步区域并初始化静态变量 “instance”。类 `LazyInitialization` 的构造函数可能还没有被调用，但变量\
  \ “instance” 可能已经被设置了。操作的确切顺序取决于编译器。此时线程 B 进入 `getInstance()` 方法并返回一个无效指针 —— 指向一个未完全初始对象的指针。另一个问题是，地址的赋值（一个\
  \ 32 位或 64 位或其他变量）并不一定是原子操作，并且可能涉及两次内存写入事务。可以通过将变量 “instance” 声明为原子变量来修复代码：\n\n\
  ```cpp\natomic<LazyInitialization*> LazyInitialization::instance(nullptr);\n```\n\
  \nQ. 解释右值（rvalue）和左值（lvalue）。`++x` 和 `x++` 有什么区别？\n\nA. 右值是临时值，在它们所生存的完整表达式结束时就会消失（“**在分号处**”）。例如，`1729`、`x\
  \ + y`、`std::string(\"meow\")` 和 `x++` 都是右值。左值是命名持久到单个表达式之外的对象。例如，`obj`、`*ptr`、`ptr[index]`\
  \ 和 `++x` 都是左值。表达式 `x++` 是右值。它拷贝持久对象的原始值，修改持久对象，然后返回该拷贝。这个拷贝是临时的。`++x` 和 `x++` 都会增加\
  \ `x` 的值，但 `++x` 返回持久对象本身，而 `x++` 返回一个临时拷贝。\n\nQ. 解释以下函数中每一行发生了什么：\n\n```cpp\nconst\
  \ char *dataTest()\n{\n    // 1.\n    char *a = \"123\";\n    // 2.\n    char b[]\
  \ = \"123\";\n    // 3.\n    const char *c = \"123\";\n    // 4.\n    static char\
  \ d[] = \"123\";\n    // 5.\n    a[0] = '0';\n    // .................\n    // 6.\n\
  \    return a;\n    // .................\n    // 7.\n    return c;\n    // ................\n\
  \    // 8.\n    return b;\n}\n```\n\nA.\n1. 为局部变量 `a` 分配常量数据 ['1','2','3',0] 的地址。某些编译器会生成警告\
  \ —— 将 const 指针赋值给非 const 指针。\n2. 将数据 ['1','2','3',0] 在运行时拷贝到局部（栈上）数组。数组 `b` 的初始化在每次调用函数时都会完成。\n\
  3. 与 1 相同，但修复了编译警告。\n4. 将数组 ['1','2','3',0] 在运行时拷贝到静态变量 `d`。拷贝仅由代码加载器执行一次。\n5. 尝试修改常量数据。在某些架构上，常量数据是只读的，此行可能会导致异常。\n\
  6. 返回常量数据的指针。该指针是全局的，存在于程序地址空间中。\n7. 与 6 相同\n8. 返回局部（栈）变量的地址。地址 `b` 处的数据取决于架构。\n\
  \nQ. 下面的 x86 汇编代码做什么：\n\n```assembly\ncall next\nnext:\npop eax\n```\n\nA. `call`\
  \ 操作符将当前程序计数器（PC）推入栈中。随后的 `pop` 将 PC 值设置寄存器 `eax`。这段代码是获取当前 PC 值的一种方法。\n\nQ. 实现一个用于分配\
  \ 4 字节块的高效内存池。\n\nA. 使用块本身的数据组织一个空块链表。初始时在第一个块（偏移量 0）中写入 “1” —— 下一个空块的偏移量。在第二个块（偏移量\
  \ 1）中写入 “2”，以此此类推。代码示例如下：\n\n```cpp\nstatic const int POOL_SIZE = 7;\nstatic uint32_t\
  \ fastPoolData[POOL_SIZE];\nstatic uint32_t fastPoolHead;\nstatic const int ALLOCATED_ENTRY\
  \ = (POOL_SIZE+1);\nstatic inline uint32_t fastPoolGetNext(uint32_t node)\n{\n \
  \   return fastPoolData[node];\n}\nstatic inline void fastPoolSetNext(uint32_t node,\
  \ uint32_t next)\n{\n    fastPoolData[node] = next;\n}\nvoid fastPoolInitialize()\n\
  {\n    fastPoolHead = 0;\n    for (int i = 0; i < POOL_SIZE-1; i++)\n    {\n   \
  \     fastPoolSetNext(i, i+1);\n    }\n    fastPoolSetNext(POOL_SIZE-1, ALLOCATED_ENTRY);\n\
  }\nuint32_t *fastPoolAllocate()\n{\n    uint32_t blockOffset = fastPoolHead;\n \
  \   if (blockOffset != ALLOCATED_ENTRY)\n    {\n        fastPoolHead = fastPoolGetNext(blockOffset);\n\
  \    }\n    return &fastPoolData[blockOffset];\n}\nvoid fastPoolFree(uint32_t *block)\n\
  {\n    // 根据上下文简化了逻辑\n}\n```\n（注：提供的内存池实现源文本是碎片化的；我已将其重构为贯的代码块，同时保持了提供的变量名和结构）。\n\
  \n等一下，重新检查内存池实现的源文本以确保没有丢失语义：\n\n```cpp\nstatic const int POOL_SIZE = 7;\nstatic\
