- "# 嵌入式系统的 C++\n\n\n\n![](img/cover.jpeg)\n\n![](img/00001.jpeg)\n\n\n# 介绍\n\n面向对象代码的伟大之处在于，它可以让简单简单的问题看起来变得庞大且复杂。在书中，我假设读者对\
  \ C++ 已经非常熟悉。在整本书，我展示了 C++11 中一些不为人知的特性，例如类型特征、常量表达式和 OpenMP 支持。我得出的结论是 C++ 是完美的工具。\n\
  \n等等，我需要重新检查细节，以提供文本的一一对应映射。\n\n问题可以通过许多方式解决。我提供了一种替代方案并比较了性能。\n\n# 致谢\n\n我要感谢我的表弟兼朋友\
  \ Andre。没有 Andre 的帮助，这本书将会单薄得多。我认为在我们两个之间\n\n# C++ 代码风格。\n\n#define `AND` `&&`\n\
  #define `OR` `||`\n#define `EQ` `==`\n\n在所有的源代码示例中，我尽力遵循了一致的 C/C++ 风格。在书中，我没有将大括号单独放在一行。唯一的唯一目的是为了让代码更短。更短的代码更有可能在较小的阅读器屏幕上显示。出于同样的原因，代码本身没有注释。希望注释的缺失通过穿插的解释得到了补偿。我使用了驼峰命名法。类型和类名以大写开头，变量以小写开头，而常量则全大写并用下划线分隔。\n\
  \n# 软件原语。\n\n## 互斥\n\n在多任务环境中，线程和中断会并发读写数据对象。可以使用不同的工具来同步不同上下文之间的访问，并创建线程安全的 API。可用工具包括信号量、操作系统提供的互斥锁，以及禁用中断、禁用部分中断、禁用操作系统调度器以及使用自旋锁。当我为实时操作系统或硬件提供的\
  \ API 编写封装时，我希望封装尽可能轻量。通常，我使用汇编指令的数量来衡量封装的开销。指令数量是 CPU 周期或执行时间的良好估计。\n\n```cpp\n\
  class LockDummy {\npublic:\n    LockDummy() {\n        cout << \"Locked context\"\
  \ << endl;\n    }\n    ~LockDummy() {\n        cout << \"Lock is freed\" << endl;\n\
  \    }\n};\n```\n\n在接下来的用法示例中，C++ 符 `auto` 告诉编译器自动提供正确的类型——C++11 编译器知道在某些情况下推导出某些变量类型。例如，C++\
  \ 编译器可以推断赋值左侧的返回类型或函数的返回类型。\n\n\n\n\n\n在 `main()` 函数中，编译器将调用输出函数两次，不会添加任何其他代码。当变量\
  \ `myDummyLock` 的作用域结束时，锁会被释放——调用析构函数 `~LockDummy`。该作用域可以 `while` 循环。我不需要在函数每次返回之前调用“unlock”。C++\
  \ 编译器会确保析构函数总是被调用，且只被调用一次（更多关于 RAII 的信息请参见 [1]）。这种便利的服务不会产生任何性能开销。以下代码的输出将是：\n\n\
  Locked context\n\nProtected context\n\nLock is freed\n\n```cpp\nint testDummyLock()\
  \ {\n#if (__cplusplus >= 201103) // 如果 C++11 或更高版本使用 \"auto\"\n  auto myDummyLock\
  \ = LockDummySimple();\n#else\n    LockDummySimple myDummyLock = LockDummySimple();\n\
  #endif\n\n  cout << \"Protected context\" << endl;\n  return 0;\n}\n```\n\n我想通过另一个例子来强调这个观点。在下面的代码中，我在锁变量的声明周围设置了一个作用域。代码的输出将是：\n\
  \nLocked context\n\nProtected context\n\nLock is freed\n\nEnd of main\n\n```cpp\n\
  int main() {\n    {\n        LockDummy lock;\n        cout << \"Protected context\"\
  \ << endl;\n    }\n    cout << \"End of main\" << endl;\n    return 0;\n}\n```\n\
  \n我的第二个锁是一个更真实的锁，它会禁用硬件中断。我假设有一个可以禁用和启用中断的 API。我正在对原始锁代码进行一些重构。首先，我使用模板，这是 C++ 的一个特性，允许你声明一个对泛型操作的类。我将重用模板\
  \ `Lock` 中的代码来处理不同的同步对象。模板 `Lock` 中的代码可以操作任何实现了两个公共方法（静态方法 `get()` 和 `release()`）的结构体或类。在这里我仔细地避免了多态，我不要求同步对象属于同一个类层次结构。禁用/启用中断\
  \ API 的封装器（它可能会写入硬件）不会是操作系统信号量封装器的子类/朋友/父类/关系/派生类。\n\n禁用和启用中断的 API 如下：\n\n```cpp\n\
  static inline void interruptDisable(void) {\n  cout << \"Disable\" << endl;\n}\n\
  \nstatic inline void interruptEnable(void) {\n  cout << \"Enable\" << endl;\n}\n\
  ```\n\n我正在描述一个同步对象。该类实现了两个方法：“get”和“release”。这两个方法都是“inline”的，这有助于优化器决定是否应该将方法的调用替换为方法的代码。最终结果将类似于在\
  \ C 中使用宏定义。`SynchroObject` 类中的默认构造函数是私有的，我不希望应用程序中出现这种类型的对象。到目前为止，我的 C++ 编译器还没有向我的执行文件添加任何对象代码。\n\
  \n```cpp\nclass SynchroObject {\n    SynchroObject() {};\npublic:\n    static inline\
  \ void get() {\n        interruptDisable();\n    }\n    static inline void release()\
  \ {\n        interruptEnable();\n    }\n};\n```\n\n模板类 `Lock` 可以操作任何提供 `get/release`\
  \ API 的同步对象类型。模板类 `Lock` 的所有方法都是“inline”的。C++ 编译器不会向对象代码添加任何函数，而是会将对 `Lock` 方法的调用替换为同步对象的\
  \ `get/release` 代码。\n\n```cpp\ntemplate<typename Mutex> class Lock {\npublic:\n\
  \    inline Lock() {\n        Mutex::get();\n    }\n    inline ~Lock() {\n     \
  \   Mutex::release();\n    }\n};\n```\n\n声明一个新类型 `MyLock`，它使用我的 `SynchroObject`\
  \ 来禁用/启用中断。除了对中断启用和禁用中断 API 的调用外，我的执行文件中没有额外的数据或代码。\n\n```cpp\ntypedef Lock<SynchroObject>\
  \ MyLock;\n```\n\n`main()` 函数的输出将是两个单词：Disable, Enable\n\n```cpp\nint main() {\n\
  \    {\n        MyLock lock;\n    }\n    return 0;\n}\n```\n\n禁用和启用中断函数的封装开销完全为零。事实上，如果我检查反汇编，我会在主程序中看到两次对打印函数的调用，外无他物。我写了一些\
  \ C++ 代码，它们被优化成了空。我获得了什么？增值价值是什么？\n\n这段代码没有允许我在调用禁用中断后忘记启用中断。无论我的函数有多少个返回点或跳出循环的地方，C++\
  \ 编译器都会确保 `interruptEnable` 函数恰恰被调用一次。\n\n## 并行执行。\n\n有些人人在面对问题时，会想：“我知道了，我将使用线程”——然后他们就出了问题。\n\
  \n我的系统中有一个四核 CPU。我的硬件支持 GCC 4.8 编译器。如果我使用编译标记 `-fopenmp` 编译下面的代码，我将得到输出“4”：\n\n\
  ```cpp\nvoid testReduction(void) {\n  int a = 0;\n  #pragma omp parallel reduction\
  \ (+:a)\n    {\n      a = 1;\n    }\n  cout << a << endl;\n}\n```\n\n如果没有 `-fopenmp`\
  \ 标记，输出将是“1”。当 C++ 编译器遇到 pragma “omp parallel” 时，它会添加一段代码，根据系统中的核心数产生一个线程“团队”（在\
  \ Linux POSIX pthreads 中）。接下来的部分由线程组并行执行。\n\n在我的系统上执行以下函数，使用 OpenMP 需要 ~0.179s，而不使用\
  \ OpenMP 则需要 ~0.322s：\n\n```cpp\nvolatile uint_fast8_t myArray[(size_t)512*1024*1024];\n\
  uint_fast32_t testOpenMPLoop() {\n  uint_fast32_t sum = 0;\n  #pragma omp parallel\
  \ for reduction(+:sum)\n  for (uint64_t i=0; i < sizeof(myArray); i++)\n    {\n\
  \      sum += myArray[i];\n    }\n  return sum;\n}\n```\n\n如果数组大小小于 1000 万条目，OpenMP\
  \ 会启动，而单线程版本需要更的时间。\n\n\n\n\n\n我的第一个示例是一个循环缓冲区（cyclic buffer），它也被称为环形缓冲区（ring buffer）。生产者”向循环缓冲区的“尾部”（tail）添加对象，而“消费者”则从循环缓冲区的“头部”（head）提取对象。生产者的示例可以是一个中断服务程序，它从\
  \ UART 设备（RS232 端口）获取字符。“消费者”则是从应用程序主循环中调用的函数，用于处理来自 UART 的到达命令。`CyclicBuffer` 类是一个模板类，它应该帮助优化器为给定的整数类型和\
  \ CPU 架构生成尽可能高效的代码。\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
  \  Size>\n\nclass CyclicBufferSimple {\npublic:\n CyclicBufferSimple();\n ~CyclicBufferSimple()\
  \ {}\n inline  bool add(const ObjectType object);\n inline  bool remove(ObjectType\
  \ &object);\n inline  bool isEmpty();\n inline  bool isFull();\n\nprivate:\n inline\
  \ size_t increment(size_t index);\n inline  void errorOverflow() {}\n inline  void\
  \ errorUnderflow() {}\n ObjectType  data[Size + 1];\n size_t  head;\n size_t  tail;\n\
  };\n```\n\n如果应用程序尝试在缓冲区中存储整数以外的任何内容，`CyclicBufferSimple`构造函数会导致构建失败。对于给定 CPU 架构上大于整数尺寸的对象，可能应该有不同的\
  \ API。\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\
  \nCyclicBufferSimple<ObjectType, Lock, Size>::CyclicBufferSimple() {\n#if (__cplusplus\
  \ >= 201103)\n static_assert(std::numeric_limits<ObjectType>::is_integer, \"CyclicBuffer\
  \ is intended to work only with integer types\");\n#elif defined(__GNUC____)\n __attribute__((unused))\
  \ ObjectType val1 = 1;\n#else\n volatile ObjectType val1;\n    *(&val1) = 1;\n#endif\n\
  \ this->head = 0;\n this->tail = 0;\n}\n```\n\n有两个方法返回缓冲区状态：\n\n```cpp\ntemplate<typename\
  \  ObjectType, typename  Lock, std::size_t  Size>\ninline  bool  CyclicBufferSimple<ObjectType,\
  \ Lock, Size>::isEmpty() {\n bool res = (this->head == this->tail);\n return res;\n\
  }\n\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\ninline \
  \ bool  CyclicBufferSimple<ObjectType, Lock, Size>::isFull() {\n size_t tail = increment(this->tail);\n\
  \ bool res = (this->head == tail);\n return res;\n}\n```\n\n一个处理缓冲区索引回回的方法：\n\n\
  ```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\ninline\
  \  size_t  CyclicBufferSimple<ObjectType, Lock, Size>::increment(size_t index) {\n\
  \ if (index < Size) {\n return (index + 1);\n} else {\n return 0;\n    }\n}\n```\n\
  \n循环缓冲区的添加/删除 API：\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
  \  Size>\ninline  bool  CyclicBufferSimple<ObjectType, Lock, Size>::add(const ObjectType\
  \ object) {\n Lock lock;\n if (!isFull()) {\n data[this->tail] = object;\n this->tail\
  \ = increment(this->tail);\n return  true;\n} else {\n        errorOverflow();\n\
  \ return  false;\n    }\n}\n\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
  \  Size>\ninline  bool  CyclicBufferSimple<ObjectType, Lock, Size>::remove(ObjectType\
  \ &object) {\n Lock lock;\n if (!isEmpty()) {\nobject = data[this->head];\n this->head\
  \ = this->increment(this->head);\n return  true;\n} else {\n        errorUnderflow();\n\
  \ return  false;\n    }\n}\n```\n\n实例化新类型 – 一个无所操作的锁：\n\n`typedef Lock<SynchroObjectDummy>\
  \ LockDummy;`\n\n以下函数返回循环缓冲区中的元素数量。如果值无法在构建时计算，编译器将失败：\n\n```cpp\nconstexpr  size_t\
  \ calculateCyclicBufferSize() {\n return 10;\n}\n```\n\n我创建了一个 `CyclicBuffer` 类的对象来处理\
  \ 8 位无符号整数。我使用了 `uint_fast8_t`，这是另一个针对移植性的 C++11 奇迹。类型 `uint_fast8_t` 允许 C++ 编译器选择至少有\
  \ 8 位的最佳性能整数。在某些 CPU 上，32 位整数的操作比 8 位操作更快。如果性能比存储分配的内存更重要，选择 32 位整数而不是 8 位是有意义的。最小可能的\
  \ 8 位无符号整数是 `uint_least8_t`，平台上可用的无符号整数是 `uintmax_t`。\n\n`static CyclicBufferSimple<uint_fast8_t,\
  \ LockDummy, calculateCyclicBufferSize()> myCyclicBuffer;`\n\n在用法示例中有一个来自 C++11\
  \ 标准范围循环。主函数将打印数字 1, 3, 11：\n\n```cpp\nint  main() {\n for (int i : { 1, 3, 11 })\
  \ {\n        myCyclicBuffer.add(i);\n    }\n uint8_t val;\n while (myCyclicBuffer.remove(val))\
  \ {\n        cout << (int) val << endl;\n    }\n return 0;\n}\n```\n\n让我们查看 GNUC\
  \ 编译器为 Intel CPU 生成的单次 `add()` 方法调汇编代码。\n\n```assembly\nxor %esi,%esi\n inline \
  \ void add(const ObjectType object) {\nmov 0x2009c0(%rip),%rax\n return (index +\
  \ 1);\nmov %rsi,%r8\n...............................................\n inline  void\
  \ add(const ObjectType object) {\nmov %rcx,%rdx\ncmovbe %rdi,%r8\n if (!isFull())\
  \ {\ncmp %r8,%rax\n...............................................\n         data[this->tail]\
  \ = object;\nmovb $0x0,0x6011a0\n```\n\n\n\n\n\n```cpp\nsize_t tail = CyclicBufferIncrement(cyclicBuffer->tail,\
  \ CYCLIC_BUFFRE_SIZE);\n\n bool res = (cyclicBuffer->head == tail);\n\nreturn res;\n\
  \n}\n\nstatic inline void errorOverflow() {\n\n}\n\nstatic inline void errorUnderflow()\
  \ {\n\n}\n\nstatic inline bool CyclicBufferAdd(CyclicBuffer* cyclicBuffer, const\
  \ CYCLIC_BUFFER_OBJECT_TYPE object) {\n\n if (!CyclicBufferIsFull(cyclicBuffer))\
  \ {\n        cyclicBuffer->data[cyclicBuffer->tail] = object;\n        cyclicBuffer->tail\
  \ = CyclicBufferIncrement(cyclicBuffer->tail, CYCLIC_BUFFRE_SIZE);\n return true;\n\
  } else {\n        errorOverflow();\n return false;\n    }\n}\n\nstatic inline bool\
  \ CyclicBufferRemove(CyclicBuffer* cyclicBuffer, CYCLIC_BUFFER_OBJECT_TYPE* object)\
  \ {\n\n if (!CyclicBufferIsEmpty(cyclicBuffer)) {\n        *object = cyclicBuffer->data[cyclicBuffer->head];\n\
  \        cyclicBuffer->head = CyclicBufferIncrement(cyclicBuffer->head, CYCLIC_BUFFRE_SIZE);\n\
  \ return true;\n} else {\n        errorUnderflow();\n return false;\n    }\n}\n\
  ```\n\n函数 `main` 输出数字 0,1,2,3\n\n```cpp\nint main() {\n\n for (int i = 0;i < 4;i++)\
  \ {\n        CyclicBufferAdd(&myCyclicBuffer, i);\n    }\n uint8_t val;\n\n while\
  \ (CyclicBufferRemove(&myCyclicBuffer, &val)) {\n        cout << (int) val << endl;\n\
  \    };\n return 0;\n}\n```\n\n这段代码具有一些局限性。只有操作相同整数类型的循环缓冲区才能在同一个 C 源文件中使用。添加/删除函数只能在一个\
  \ C 文件中定义一次。\n\n对应的汇编代码包含调用 `add()` API 的 10 个操作码：\n\n```assembly\n return (index\
  \ + 1);\n\n xor %esi,%esi\n```\n\n```assembly\nstatic inline void CyclicBufferAdd(CyclicBuffer*\
  \ cyclicBuffer, const CYCLIC_BUFFER_OBJECT_TYPE object) {\n\n  mov 0x2009be(%rip),%rax\
  \        # 0x6011b0 <myCyclicBuffer+16>\n return (index + 1);\n  mov %rsi,%r8\n\
  ```\n\n```assembly\nint main() {\n\n  push %rbp\n return (index + 1);\n  lea 0x1(%rcx),%rdi\n\
  ...............................................\n```\n\n```assembly\nstatic inline\
  \ void CyclicBufferAdd(CyclicBuffer* cyclicBuffer, const CYCLIC_BUFFER_OBJECT_TYPE\
  \ object) {\n\n  mov %rcx,%rdx\n  push %rbx\n return (index + 1);\n  cmovbe %rdi,%r8\n\
  ...............................................\n```\n\n```assembly\n if (!CyclicBufferIsFull(cyclicBuffer))\
  \ {\n\n  cmp %r8,%rax\n...............................................\n       \
  \ cyclicBuffer->data[cyclicBuffer->tail] = object;\n  movb $0x0,0x6011a0(%rcx)\n\
  ```\n\nGNUC 针对 ARM 为 C 代码和 C++ 代码产生基本上相同的汇编代码\n\n```assembly\nxor    %esi,%esi\n\
  mov    0x2009be(%rip),%rax\nmov    %rsi,%r8\npush    %rbp\nlea    0x1(%rdx),%rdi\n\
  cmp    $0x9,%rdx\nmov    %rdx,%rcx\npush    %rbx\ncmovbe %rdi,%r8\ncmp    %r8,%rax\n\
  je 40081c <main+0x3c>\nmovb  $0x0,0x6011a0(%rdx)\nmov    %r8,%rcx\nmov    %r8,0x20099c(%rip)\n\
  xor    %r12d,%r12d\n```\n\n在 Intel 上测量的 C 版本和 C++ 性能是相同的。\n\n## C++ 模板\n\n要理解什么是递归，你必须首先理解递归。\n\
  \n此时，一个耐心的读者会询问由于 C++ 模板和对象代码重复导致的“代码膨胀”。通常情况下，C 语言实现的内存占用应该更小，不是吗？\n\n在循环缓冲区的 C++\
  \ 实现中，所有方法都是内联的（inline），并且没有特定的“模板代码”。在一般情况下，对于代码中使用的每一对 `ObjectType`/Size`，C++\
  \ 编译器都会实例化一个类并将全套方法添加到应用程序代码中。一个仔细的 C++ 程序员应该将不需要模板参数的方法移动到基类中，并从该新类派生 `CyclicBuffer`\
  \ 模板。将类型无关的代码移动到基类中通常被称为“代码提升”（code hoisting）。代码提升并不一定会导致性能损耗。在下面的示例中，我将基类命名为 `CyclicBufferBase`。基类的构造函数是保护的（protected）。应用程序只能创建子类的对象。\n\
  \n```cpp\nclass CyclicBufferBase {\npublic:\n bool isEmpty() {\n bool res = (this->head\
  \ == this->tail);\n return res;\n    }\n bool isFull() {\n size_t tail = increment(this->tail);\n\
  \ bool res = (this->head == tail);\n return res;\n    }\nprotected:\n CyclicBufferBase(size_t\
  \ size) {\n this->size = size;\n this->head = 0;\n this->tail = 0;\n    }\n void\
  \ errorOverflow() {\n\n    }\n void errorUnderflow() {\n\n    }\n size_t increment(size_t\
  \ index) {\n if (index < this->size) {\nreturn (index + 1);\n} else {\n return 0;\n\
  \    }\n    }\n size_t head;\n size_t tail;\n size_t size;\n};\n```\n\n模板类 `CyclicBuffer`\
  \ 包含了依赖模板参数 `Size` 的数据以及取决于整数类型的添加/删除方法。`CyclicBuffer` 类派自 `CyclicBufferBase` 类，继承了\
  \ `CyclicBufferBase` 的所有方法，并暴露了 `CyclicBufferBase` 的所有方法。\n\n```cpp\ntemplate<typename\
  \ ObjectType, typename Lock, std::size_t Size>\nclass CyclicBuffer:public CyclicBufferBase\
  \ {\npublic:\n CyclicBuffer() :\n        CyclicBufferBase(Size) {\n static_assert(std::numeric_limits<ObjectType>::is_integer,\
  \ \"CyclicBuffer is intended to work only with integer types\");\n    }\n ~CyclicBuffer()\
  \ {\n}\n bool add(const ObjectType object) {\n Lock lock;\n if (!isFull()) {\ndata[tail]\
  \ = object;\ntail = increment(tail);\n return true;\n} else {\n        errorOverflow();\n\
  \ return false;\n    }\n}\n bool remove(ObjectType &object) {\n Lock lock;\n if\
  \ (!isEmpty()) {\nobject = data[head];\nhead = increment(head);\n return true;\n\
  } else {\n        errorUnderflow();\n return false;\n    }\n}\nprivate:\n ObjectType\
  \ data[Size + 1];\n};\n```\n\n\n\n\n我将通过声明一个新类 `Stack` 来开始关于内存池动态内存分配的讨论。模板类 `Stack`\
  \ 与之前使用的 `CyclicBuffer` 类类似。`Stack` 类实现了两个方法：`push` 和 `pop`。\n\n```cpp\ntemplate<typename\
  \ ObjectType, typename Lock, std::size_t Size>\nclass Stack: public StackBase {\n\
  public:\n    Stack() :\n    StackBase(Size) {\n    }\n    ~Stack() {\n    }\n  \
  \  inline bool push(ObjectType* object);\n    inline bool pop(ObjectType** object);\n\
  private:\n    ObjectType* data[Size + 1];\n};\n```\n\n基类 `StackBase` 包含 `top` 和\
  \ `size` 字段，以及一些有用的 API。\n\n```cpp\nclass StackBase {\npublic:\n    bool isEmpty()\
  \ {\n        bool res = (this->top == 0);\n        return res;\n    }\n    bool\
  \ isFull() {\n        bool res = (this->top == size);\n        return res;\n   \
  \ }\nprotected:\n    StackBase(size_t size) {\n        this->size = size;\n    \
  \    this->top = 0;\n    }\n    void errorOverflow() {\n    }\n    void errorUnderflow()\
  \ {\n    }\n    size_t top;\n    size_t size;\n};\n```\n\n`push` 和 `pop` 方法实现示例：\n\
  \n```cpp\ntemplate<typename ObjectType, typename Lock, std::size_t Size>\ninline\
  \ bool Stack<ObjectType, Lock, Size>::push(ObjectType* object) {\n    Lock lock;\n\
  \    if (!isFull()) {\n        data[this->top] = object;\n        this->top++;\n\
  \        return true;\n    } else {\n        errorOverflow();\n        return false;\n\
  \    }\n}\n\ntemplate<typename ObjectType, typename Lock, std::size_t Size>\ninline\
  \ bool Stack<ObjectType, Lock, Size>::pop(ObjectType** object) {\n    Lock lock;\n\
  \    if (!isEmpty()) {\n        this->top--;\n        *object = (data[this->top]);\n\
  \        return true;\n    } else {\n        errorUnderflow();\n        return false;\n\
  \    }\n}\n```\n\n我的下一步工作是定义一个“原始”数据内存块。一个内存块是一个正确对齐的字节数组，可选情况下，它可以放置在特定的内存地址上。内存块的一个流行应用是\
  \ DMA 传输。数据缓冲区可以放在普通 RAM 中，也可以放在专用地址空间中。\n\n我定义了一个内存区域。我使用 `new` 运算符——定位 new 运算符（placement\
  \ new）——将数据 `place` 在指定的地址。我的内存区域为了调试目的有一个名称。区域地址的类型为 `uintptr_t`，这是一个能够存储指针的无符号整数。\n\
  \n```cpp\nclass MemoryRegion {\npublic:\n    MemoryRegion(const char *name, uintptr_t\
  \ address, size_t size) :\n    name(name), address(address), size(size) {\n    \
  \    data = new (reinterpret_cast<void*>(address)) uint8_t[size];\n    }\n    size_t\
  \ getSize() const {\n        return size;\n    }\n    const char* getName() const\
  \ {\n        return name;\n    }\n    uintptr_t getAddress() const {\n        return\
  \ address;\n    }\nprotected:\n    const char *name;\n    uintptr_t address;\n \
  \   size_t size;\n    uint8_t *data;\n};\n```\n\n我创建了一个 `MemoryRegion` 类型的对象，并指向动态数据中的\
  \ `dmaMemoryData`区域：\n\n```cpp\nstatic uint8_t dmaMemoryDummy[512];\nstatic MemoryRegion\
  \ dmaMemoryRegion(\"dmaMem\", (uintptr_t)dmaMemoryDummy, sizeof(dmaMemoryDummy));\n\
  ```\n\n我需要一个分配器。这是一个处理内存块分配的类。分配器处理正确的对齐。我将只使用一次（或很少）分配器代码。例如，当我用数据块填充我的内存池时，我需要一个分配器。在这里性能并不极端重要。`reset`\
  \ 方法将所有分配的块“释放”回分配器。\n\n```cpp\nclass MemoryAllocatorRaw {\npublic:\n    MemoryAllocatorRaw(MemoryRegion\
  \ memoryRegion,\n    size_t blockSize,\n    size_t count, unsigned int alignment);\n\
  \    uint8_t* getBlock();\n    bool blockBelongs(const void* block) const;\n   \
  \ const MemoryRegion& getRegion() const;\n    void reset();\n    constexpr static\
  \ size_t predictMemorySize(\n    size_t blockSize,\n    size_t count, unsigned int\
  \ alignment);\nprotected:\n    int alignment;\n    size_t blockSize;\n    const\
  \ MemoryRegion& memoryRegion;\n    size_t count;\n    size_t sizeTotalBytes;\n \
  \   size_t alignedBlockSize;\n    uintptr_t firstNotAllocatedAddress;\n    static\
  \ constexpr size_t alignConst(size_t value,\n    unsigned int alignment);\n    inline\
  \ static uintptr_t alignAddress(uintptr_t value,\n    unsigned int alignment);\n\
  };\n```\n\n分配器的实现如下。构造函数确保有足够的空间。我在构造函数之后初始化字段：\n\n```cpp\nMemoryAllocatorRaw::MemoryAllocatorRaw(MemoryRegion\
  \ memoryRegion,\nsize_t blockSize,\nsize_t count, unsigned int alignment) :\nalignment(alignment),\
  \ blockSize(blockSize), memoryRegion(memoryRegion), count(count) {\n    alignedBlockSize\
  \ = alignConst(blockSize, alignment);\n    sizeTotalBytes = alignedBlockSize * count;\n\
  \    firstNotAllocatedAddress = memoryRegion.getAddress();\n}\n```\n\n`getBlock`\
  \ 方法调用 `alignAddress`：\n\n```cpp\nuint8_t* MemoryAllocatorRaw::getBlock() {\n  \
  \  uint8_t* block = (uint8_t*)firstNotAllocatedAddress;\n    firstNotAllocatedAddress\
  \ += alignedBlockSize;\n    return block;\n}\n```\n\n`blockBelongs` 需要检查块是否属于该池：\n\
  \n```cpp\nbool MemoryAllocatorRaw::blockBelongs(const void* block) const {\n   \
  \ uintptr_t blockPtr = (uintptr_t)block;\n    size_t maxAddress = memoryRegion.getAddress()\
  \ + sizeTotalBytes;\n    return blockPtr <= maxAddress;\n}\n```\n\n剩余的方法：\n\n```cpp\n\
  constexpr size_t MemoryAllocatorRaw::alignConst(size_t value,\nunsigned int alignment)\
  \ {\n    return (value + (alignment - 1)) & ~(alignment - 1);\n}\n\nuintptr_t MemoryAllocatorRaw::alignAddress(uintptr_t\
  \ value,\nunsigned int alignment) {\n    return (value + (alignment - 1)) & ~(alignment\
  \ - 1);\n}\n\nconst MemoryRegion& MemoryAllocatorRaw::getRegion() const {\n    return\
  \ memoryRegion;\n}\n\nvoid MemoryAllocatorRaw::reset() {\n    firstNotAllocatedAddress\
  \ = memoryRegion.getAddress();\n}\n```\n\n在声明分配器对象之前，我检查内存区域是否足够。如果内存区域太小，我希望编译失败：\n\
  \n```cpp\nstatic_assert((sizeof(dmaMemoryDummy) >= MemoryAllocatorRaw::predictMemorySize(63,\
  \ 2, 2)), \"DmaMemoryDummy region not enough\");\nstatic MemoryAllocatorRaw dmaAllocator;\n\
  ```\n\n我的内存池是数据块的堆栈。该类包含 `allocate/free` API 以及一些调试统计信息。每个内存池都有一个名称。为对象提供名称对于日志记录和打印调试统计很有用。内存池中的栈由\
  \ `Lock` 保护，不是线程安全的。我将在内存池的方法中使用真正的同步器。\n\n签名中带有 `const` 关键字类方法，例如 `resetMaxInUse()`，无法更改类的任何成员。那么\
  \ `resetMaxInUse()` 如何能更改 `statistics` 字段呢？`statistics` 字段是 `mutable` 的，这允许 `const`\
  \ 方法修改它。调试计数是使用 `mutable` 关键字的经典示例。`resetMaxInUse()` 方法不会影响（以有意义的方式）对象的可见状态。\n\n\
  ```cpp\ntemplate<typename Lock, size_t Size>\nclass MemoryPoolRaw {\npublic:\n \
  \   MemoryPoolRaw(const char* name, MemoryAllocatorRaw* memoryAllocator);\n    ~MemoryPoolRaw()\
  \ {\n        memoryAllocator->reset();\n    }\n    inline void resetMaxInUse() const\
  \ {\n        statistics.maxInUse = 0;\n    }\n    typedef struct {\n        uint32_t\
  \ inUse;\n        uint32_t maxInUse;\n        uint32_t errBadBlock;\n    } Statistics;\n\
  \    inline bool allocate(uint8_t** block);\n    inline bool free(uint8_t* block);\n\
  \    inline const Statistics &getStatistics(void) const {return statistics;}\nprotected:\n\
  \    mutable Statistics statistics;\n};\n```\n\n\n\n\n```cpp\nmutable Statistics\
  \ statistics;\n\nconst char* name;\n\nStack<uint8_t, LockDummy, Size> pool;\n\n\
  MemoryAllocatorRaw* memoryAllocator;\n\n};\n```\n\n内存池构造函数会调用分配器来填充空闲块栈。构造函数可以例如将新创建的内存池注册到内存池数据库中。应用程序可以内存池的运行时检查提供含义。析构函数将把内存池从数据库中移除：\n\
  \n```cpp\ntemplate<typename Lock, size_t Size>\nMemoryPoolRaw<Lock, Size>::\nMemoryPoolRaw(const\
  \ char* name, MemoryAllocatorRaw* memoryAllocator) :\nname(name), memoryAllocator(memoryAllocator)\
  \ {\n  memset(&this->statistics, 0, sizeof(this->statistics));\n  for (size_t i\
  \ = 0; i < Size;i++) {\n    uint8_t *block = memoryAllocator->getBlock();\n    pool.push(block);\n\
  \  }\n}\n```\n\n如果 `Lock` 类不是空锁（dummy lock），则内存池的分配/释放 API 是重入且线程安全的。所有可以修改栈状态的活动都受到\
  \ `lock` 的保护。如果应用程序仅在一个上下文中使用池，则可以为内存池提供 `LockDummy` 模板参数。`LockDummy` 不会向执行文件中添加任何代码。统计计数器的开销相对，但对于调试分配失败等错误非常有帮助。\n\
  \n```cpp\ntemplate<typename Lock, size_t Size>\ninline bool MemoryPoolRaw<Lock,\
  \ Size>::\nallocate(uint8_t** block) {\n  bool res;\n  Lock lock;\n  res = pool.pop(block);\n\
  \  if (res) {\n    statistics.inUse++;\n    if (statistics.inUse > statistics.maxInUse)\n\
  \      statistics.maxInUse = statistics.inUse;\n  }\n  return res;\n}\n```\n\n内存池的“释放”确保指针属于该池。内存分配器知道识别它自己的块。\n\
  \n```cpp\ntemplate<typename Lock, size_t Size>\ninline bool MemoryPoolRaw<Lock,\
  \ Size>::\nfree(uint8_t* block) {\n  bool res;\n  Lock lock;\n  res = memoryAllocator->blockBelongs(block);\n\
  \  if (res) {\n    res = pool.push(block);\n    statistics.inUse--;\n  } else {\n\
  \    statistics.errBadBlock++;\n  }\n  return res;\n}\n```\n\n防止多次释放同一个块是相当容易的。如果数据块是连续内存的一部分，分配器可以提供一种基于块地址生成唯一索引的方法。内存池可以包含一个数组，其中块被标记为已分配或空闲，`free()`\
  \ 方法可以根据此数组检查块。如果内存区域不是连续的，分配器可以实现一个哈希函数，将数据块的地址转换为唯一的数据块索引。\n\n## 运算符 new。\n\n\
  算法（名词）\n\n程序员当他们不想解释自己做了什么时使用的词。\n\n许多小型微控制器用于动态内存分配的堆空间相对较小。完全不使用动态内存分配的设计选择非常流行。在固件中，使用\
  \ C/C++ 库中 `new` 和 `delete` 运算符的标准实现通常没有意义。如果系统耗尽空闲内存，`new` 运算符（其本身是一个动态分配的对象）可能会抛出异常。在运行时对不同对象调用\
  \ `new` 和 `delete` 最终会导致内存碎片。后章节中的软件定时器和 STL 容器可以利用采用自定义分配器的用户定义内存分配。自定义的运算符 `new`\
  \ 可以基于“放置 new（placement new）”。`CyclicBufferDynamic` 类中的构造函数可以这样重定义：\n\n```cpp\n\
  template<typename ObjectType, typename Lock>\ninline CyclicBufferDynamic\n<ObjectType,\
  \ Lock>::\nCyclicBufferDynamic(size_t size, void *address) {\n  this->head = 0;\n\
  \  this->tail = 0;\n  this->size = size;\n  if (address != nullptr) {\n    this->data\
  \ = new (address) ObjectType[size];\n  } else {\n    this->data = new ObjectType[size];\n\
  \  }\n  static_assert(sizeof(ObjectType) <= sizeof(uintptr_t), \"CyclicBuffer 仅旨在用于整数类型或指针\"\
  );\n}\n```\n\n在接下来的示例中，我让编译器静态分配所需的内存，并在调用构造函数时已分配数据的地址：\n\n```cpp\nstatic uint32_t\
  \ myDynamicCyclicBufferData[calculateCyclicBufferSize()];\nCyclicBufferDynamic<uint32_t,\
  \ LockDummy> myDynamicCyclicBuffer(calculateCyclicBufferSize(), &myDynamicCyclicBufferData);\n\
  ```\n\n## I/O 访问。\n\n需要多少个程序员才能换灯泡？不需要——这是一个硬件问题。\n\n嵌入式软件通过硬件寄存器访问硬件。我假设有三组寄存器：读写寄存器、只读寄存器和只写寄存器。所有寄存器都是内存映射的，每个寄存器都有一个地址。软件访问寄存器的方式与给定变量地址读写变量的方式相同。对于只写寄存器，习惯是保留一个缓存值。缓存是位于数据内存中的一个变量，包含写入只写寄存器的最新值。\n\
  \n以下示例基于 Atmel SAMA5d3 微控制器中的并行输入/输出控制器（PIO）的用户界面。为了节省代码行和文本，我简化了接口。\n\n| 地址 | 名称\
  \ | 寄存器 | 权限 |\n| :--- | :--- | :--- | :--- |\n| 0x0000 | PIO 启用寄存器 | PIO_PER |\
  \ 只写 |\n| 0x0004 | PIO 禁用寄存器 | PIO_PDR | 只写 |\n| 0x0008 | PIO 状态寄存器 | PIO_PSR |\
  \ 只读 |\n| 0x000C | 预留 | | |\n| 0x0010 | 输出启用寄存器 | PIO_OER | 只写 |\n| 0x0014 | 输出禁用寄存器\
  \ | PIO_ODR | 只写 |\n| 0x0018 | 输出状态寄存器 | PIO_OSR | 只读 |\n| 0x001C | 预留 | | |\n|\
  \ 0x0020 | 未使用 | | |\n| 0x0024 | 未使用 | | |\n| 0x0028 | 未使用 | | |\n| 0x002C | 预留\
  \ | | |\n| 0x0030 | 设置输出数据寄存器 | PIO_SODR | 只写 |\n| 0x0034 | 清除输出数据寄存器 | PIO_CODR\
  \ | 只写 |\n| 0x0038 | 输出状态寄存器 | PIO_ODSR | 只读 |\n\n微控制器中有五个如 A、B、C、D、E 的块。寄存器从 `0xFFFFF00`\
  \ 开始映射。想要修改只写寄存器的用户应向相关位写入 1。例如，用户应向 `PIO_SODR` 写入 `0x04`。\n\n## C 语言中的 I/O 访问。\n\
  \n“用 C 或 C++ 编写就像在移除所有安全防护的情况下电锯” —— Bob Gray。\n\n我提供了快速粗糙的 C。宏 `RESER` 展示了一个生成唯一标识符的巧妙技巧。\n\
  \n```c\n#define TOKEN_CAT(x, y) x ## y\n#define TOKEN_2(x, y) TOKEN_CAT(x, y)\n\
  #define RESERVED TOKEN_2(reserved, __COUNTER__)\n```\n\nPIO 结构体，一组 32 位。我想确保编译器不进行任何填充并将结构体标记为“紧凑（packed）”。Pragma\
  \ “pack”可能是不安全的。某些架构如 ARM 或 MIPS 不支持对齐访问。\n\n```c\n#pragma pack(push)\n#pragma pack(1)\n\
  struct PIO {\n  volatile uint32_t PIO_PER;\n  volatile uint32_t PIO_PDR;\n  volatile\
  \ uint32_t PIO_PSR;\n  volatile uint32_t RESERVED;\n  volatile uint32_t PIO_OER;\n\
  \  volatile uint32_t PIO_ODR;\n  volatile uint32_t PIO_OSR;\n  volatile uint32_t\
  \ RESERVED;\n  volatile uint32_t RESERVED;\n  volatile uint32_t RESERVED;\n  volatile\
  \ uint32_t RESERVED;\n  volatile uint32_t RESERVED;\n  volatile uint32_t PIO_SODR;\n\
  \  volatile uint32_t PIO_CODR;\n  volatile uint32_t PIO_ODSR;\n};\n#pragma pack(pop)\n\
  ```\n\n指向内存区域的指针：\n\n```cpp\n#ifdef REAL_HARDWARE\nstatic PIO *pios = (PIO*)0xFFFFF200;\n\
  #else\nstatic PIO pioDummy[5];\nstatic PIO *pios = pioDummy;\n#endif\n```\n\n五个\
  \ PIO 块：\n\n```c\ntypedef enum {\n  PIO_A,\n  PIO_B,\n  PIO_C,\n  PIO_D,\n  PIO_E,\n\
  \  PIO_F,\n} PIO_NAME;\n```\n\n\n\n\n## PIO 配置指南\n\n将引脚配置为输出的函数：\n\n```cpp\nstatic\
  \ void enableOutput(PIO_NAME name, int pin, int value) {\n  PIO *pio = &pios[name];\n\
  \  uint32_t mask = 1 << pin;\n  if (value) {\n    pio->PIO_SODR = mask;\n  }\n \
  \ else {\n    pio->PIO_CODR = mask;\n  }\n  pio->PIO_PER = mask;\n  pio->PIO_OER\
  \ = mask;\n}\n```\n\n驱动 PIO A 引脚 2 置高函数可能如下所示：\n\n```cpp\nstatic void main() {\n\
  \  enableOutput(PIO_A, 2, 1);\n}\n```\n\n### Intel 汇编\n这是 Intel 相关的汇编代码——正如预期的，有三个\
  \ 32 位的移动：\n\n```assembly\nPIO *pio = &pios[name];\nuint32_t mask = 1 << pin;\n\
  if (value) {\n  pio->PIO_SODR = mask;\n4007e0:             c7 05 e6 19 20 00 04\
  \             movl  $0x4,0x2019e6(%rip)\n4007e7:             00 00 00\n4007ea:31\
  \ c0                             xor %eax,%eax\n  pio->PIO_SODR = mask;\n}\nelse\
  \ {\n  pio->PIO_CODR = mask;\n}\npio->PIO_PER = mask;\n4007ec:             c7 05\
  \ aa 19 20 00 04             movl  $0x4,0x2019aa(%rip)\n4007f3:             00 00\
  \ 00\npio->PIO_OER = mask;\n4007f6:             c7 05 b0 19 20 00 04           \
  \  movl  $0x4,0x2019b0(%rip)\n4007fd:             00 00 00\n```\n\n### ARM 汇编\n\
  为 ARM 生成的汇编代码稍长。在 ARM 中，存储值之前应将地址加载到寄存器中。\n\n```assembly\nPIO *pio = &pios[name];\n\
  uint32_t mask = 1 << pin;\nif (value) {\n  pio->PIO_SODR = mask;\n8650:        \
  \     e59f3014               ldr             r3, [pc, #20]\n8654:             e3a02004\
  \               mov             r2, #4\n8658:             e5832090             \
  \  str             r2, [r3, #144]\n865c:             e3a00000               mov\
  \             r0, #0\n  pio->PIO_SODR = mask;\n}\nelse {\n  pio->PIO_CODR = mask;\n\
  }\npio->PIO_PER = mask;\n8660:             e5832060               str          \
  \   r2, [r3, #144]\npio->PIO_OER = mask;\n```\n\n## C++ 封装实现\n以下结构表示了用于封装 PIO 操作的\
  \ C++ 类：\n\n```cpp\nclass HardwarePIO {\npublic:\n  HardwarePIO(uintptr_t address)\
  \ : interface((struct Interface*)address) {}\n  ~HardwarePIO() {}\n\n  Interface\
  \ &getInterface(Name name) const {\n    return interface[name];\n  }\n\n  void enableOutput(Name\
  \ name, int pin, int value) {\n    Interface &interface = getInterface(name);\n\
  \    uint32_t mask = 1 << pin;\n    if (value) {\n      interface.PIO_SODR = mask;\n\
  \    }\n    else {\n      interface.PIO_CODR = mask;\n    }\n    interface.PIO_PER\
  \ = mask;\n    interface.PIO_OER = mask;\n  }\n\nprivate:\n  enum Name { A, B, C,\
  \ D, E, F, LAST };\n  struct Interface {\n    volatile uint32_t PIO_SODR;\n    volatile\
  \ uint32_t PIO_CODR;\n    volatile uint32_t PIO_PER;\n    volatile uint32_t PIO_OER;\n\
  \  };\n  Interface *interface;\n};\n```\n\n\n\n对 PIO 寄存器的访问被封装在硬件模块类方法中。`HardwarePIO`\
  \ 类中的方法是修改寄存器的唯一方式。C++ 实现允许在编译时捕获其他错误操作，例如读取或写入预留寄存器。\n\n在硬件模块中缓存所有写入值是非常容易。缓存或记录读写事务的一种方法是在硬件模块类中添加一个“影子”（shadow）接口字段。\n\
  \n## 间接 I/O 访问。\n\n在某些情况下，硬件可以通过串口接口访问。此类接口的一个例子是 `SPI`。为了简洁起见，我使用了直接访问 API。真实 SPI\
  \ 设备的真实访问接口可以包含系统调用或对串口接口驱动的调用：\n\n```cpp\ntemplate<typename IntegerType>\nclass\
  \ HardwareDirectAccessAPI {\npublic:\n  inline uint32_t get() const {\n    return\
  \ atomic_load(&value);\n  }\n  inline void set(uint32_t value) {\n    atomic_store(&this->value,\
  \ value);\n  }\nprotected:\n  volatile atomic<IntegerType> value;\n  static_assert(numeric_limits<IntegerType>::is_integer,\
  \ \"HardwareDirectAccessAPI works only with integer types\");\n};\n```\n\n我为模板类\
  \ `HardwareRegister` 添加了一个参数：\n\n```cpp\ntemplate<typename IntegerType, typename\
  \ AccessAPI>\nclass HardwareRegister {\nprotected:\n  HardwareRegister() {}\n  inline\
  \ IntegerType get() const {\n    return api.get();\n  }\n  inline void set(IntegerType\
  \ value) {\n    api.set(value);\n  }\n  AccessAPI api;\n};\n```\n\n用于 32 位寄存器的 `HardwareRegister`\
  \ 实例，直接访问看起来如下：\n\n```cpp\nclass HardwareRegister32: public HardwareRegister<uint32_t,\
  \ HardwareDirectAccessAPI<uint32_t> > {\nprotected:\n  HardwareRegister32() {}\n\
  };\n```\n\n其他类保持不变。\n\n# 代码 ROM 和数据 RAM。\n\n如果一开始没有成功，就把它称作版本 1.0。\n\n有一些非常流行的硬件平台，ROM\
  \ 和 RAM 的区别非常重要。此类设备的一个例子是相当流行的 8 位微控制器 `Atmega`。在 `Atmega` MCU 中，代码不能放置在数据内存中，CPU\
  \ 无法执行位于 RAM 中的代码。对代码内存中数据的任何访问都需要特殊指令。另一个例子是应用专用集成电路或 `ASICs`。`ASIC` 通常包含集成 ROM\
  \ 和 RAM。集成的（也称为片上或芯片内）ROM 存储廉廉，因为在硅片上需要的空间较小。RAM 相对昂贵，因为每位内存需要更多逻辑，且集成电路（芯片）的平方英寸非常贵。RAM\
  \ 消耗的功率大得多。我认为我们周围的大多数电子设备内部都有集成 ROM 和 RAM（通常是 `SRAM`）。通常，片上 RAM 远小于 ROM。\n\nROM\
  \ 有两种类型：可擦写和不可擦写。在 `Atmega` MCU 中，ROM 的不同区域可以由固件编程，前提是固件运行另一个区域。在 `ASICs` 中，ROM\
  \ 通常是不可擦写的。ROM 的编程是 ASIC 生产过程的一部分。芯片离开工厂（`FAB`）后，ROM 无法被修改。\n\n如果没有足够的 RAM 来加载固件，那么部分固件代码应该位于芯片\
  \ ROM 中。对于 `ASIC`，这意味着基于 ROM 的固件部分只能在未来的芯片版本中进行更改。现代 ASIC 固件的高复杂度使得在 ASIC 验证过程中很难达到\
  \ 100% 的代码覆盖。即使基于 ROM 的固件经过了完全验证和测试，仍有可能开发团队误解了某个协议，或者产品需求发生了变化。开发团队准备固件和硬件，是为了应对极可能出现的对\
  \ ROM 进行补丁的需求。\n\n本章涵盖了某些与 ROM 关的问题。\n\n## C++ 初始化数据。\n\n至少有一个代码段、启动程序、常量和初始化数据是\
  \ ROM 的部分。初始化的非零数据将消耗双倍内存。初始化数据的初始化值是 ROM 的一部分。通常，启动过程会将值从 ROM 复制到 RAM。如果我检查编译器生成的对象文件，可以很容易找到字符串的初始化数据。有一些工具可以帮助检查对象文件、将不同段转储到单独的文件，并为\
  \ ROM 编程准备镜像。此类工具的一个例子是 `GNU objdump`。让我们来看一些 C++ 初始化数据的实际应用。以下代码产生两行输出：“Hello,\
  \ world!”，紧接着是“Hello from main()!”。\n\n```cpp\nclass HelloWorld {\npublic:\n  HelloWorld()\
  \ {\n    cout << \"Hello, world!\" << endl;\n  }\n};\nstatic HelloWorld helloWorld;\n\
  int main() {\n  cout << \"Hello from main()!\" << endl;\n  return 0;\n}\n```\n\n\
  `main()` 函数只包含一个输出。负责初始化 C++ 对象 `helloWorld` 并打印第一行的实体运行在我操作系统中的对象加载器。在嵌入式系统中，这段代码通常是启动过程的一部分。`HelloWorld`\
  \ 类的构造函数是“文本”，在 ROM 中只出现一次。`cout` 的参数（字符串）存在于内存中的两个地方：原始或“主副本”在 ROM 中，由加载器创建的第二个副本在\
  \ RAM 中。包含静态分配对象 `helloWorld` 地址的指针 `this` 也有两个副本。ROM 中有一个 `this` 指针的初始化值，RAM 中也有\
  \ `this` 指针。在 32 位 CPU 的 ROM 中，为 `helloWorld` 对象分配的空间至少包含 4 字节的 `this` 和 14 字节的零终止字符串。链接脚本负责代码和数据不同段的正确放置。如果\
  \ CPU 无法访问存储在代码内存中的数据，链接脚本应包含相关的分配指令。具体来说，常量数据段将被分配两次：在代码 ROM 地址空间和在 RAM 中。\n\n\
  在通常情况下，链接脚本会添加全局变量，引用未初始化数据段 `bss` 的起始和结束地址、初始化数据，以及一个 `ctor` 函数表。通常，`ctor` 段是一个函数表，启动代码通过调用这些函数来初始化静态\
  \ C++ 对象。详细信息请参考你的链接器文档。\n\n## ROM 补丁。\n\n编程很像性爱。犯一个错，你就得提供一辈子的支持。\n\n我想为未来的补丁准备构造函数代码。我将检查\
  \ RAM 中的某些位置。如果有非零条，我将使用那里的字符串。如果没有，我将打印默认值——即 ROM 中的那一个。\n\n```cpp\nstatic const\
  \ char *helloWorldStr = 0;\nclass HelloWorld {\npublic:\n  HelloWorld() {\n    if\
  \ (helloWorldStr == 0)\n      cout << \"Hello, world!\" << endl;\n    else\n   \
  \   cout << helloWorldStr << endl;\n  }\n};\n```\n\n加载可以打补丁的 ASIC 有两个阶段。在第一阶段，外部\
  \ CPU（也称为主机处理器）将某些固件加载到 ASIC RAM 中。有一个专用的硬件/启动固件支持将应用固件加载到 RAM 中。另一种方案是 ASIC 中的启动固件从某些外部可编程存储芯片加载应用固件，例如\
  \ `EEPROM` 或 `SPI FLASH`。第二阶段是启动程序跳转到 RAM 中的应用代码。如果主机处理器加载的代码在 `helloWorldStr` 地址处包含非零，则基于\
  \ ROM 的应用代码将打印新字符串。我将这种类型的补丁称为 A 类补丁。在 A 类补丁中，我修复函数的一部分。\n\n\n\n\n\n对于 B 类补丁，我需要硬件支持。当\
  \ CPU 从特定地址或地址范围获取指令时——在下面的代码中，这是函数 `printHello()` 的地址——我希望“中断”执行并将控制权切换到位于 RAM\
  \ 中的中断处理程序。默认的中断处理程序什么都不做。该处理程序是空的并直接返回，允许 `printHello()` 函数完成它的有用工作。补丁后的中断处理程序可以在允许\
  \ `printHello()` 函数打印它之前修改 RAM 中的字符串“Hello, world”。中断处理程序可以执行某些任意代码并将控制权返回给 `printHello()`\
  \ 的调用者，完全跳过原始的打印代码。\n\n```cpp\nclass HelloWorld {\npublic:\n HelloWorld() {\n  \
  \      printHello();\n    }\nprotected:\n void  printHello() {\ncout << \"Hello,\
  \ world!\" << endl;\n    }\n};\n```\n\n对于 C 类补丁，我需要在链接脚本中获得支持。我想将 `HelloWorld` 的构造函数放在\
  \ ROM 中，但 `printHello()` 方法我想在 RAM 中执行。如果 `HelloWorld` 构造函数调用了 RAM 中的函数，我就可以轻松地补丁该函数代码。\n\
  \n# 组合\n\n你是否注意到过 'C' 项目计划与 C++ 项目计划之间的区别？C++ 项目的规划阶段是 C 的三倍。这正是为了确保所有应该继承的都继承了，而不应该继承的没有。尽管如此，他们仍然会出错。\n\
  \n记得平均规模的 'C' 项目的长度吗？大约 6 个月。对于一个有妻有儿的男人来说，这段时间远远不足以维持体面的生活。拿同一个项目，用 C++ 设计，你会得到什么？我告诉你。一到两年。这难道不棒吗？\n\
  \n我将尝试为“创建任务”API 编写一个包装器。类似于 `pthread_create` 或 `FreeRTOS xTaskCreate` 等 API 的典型包装器是基于类（例如\
  \ `MyThread`）中的静态方法的。事实上，这是我知道的编写适用于大多数操作系统的可移植 C++ 包装器的唯一方法。我将适当地地展示这种方法的基本示例，不是因为它们迷人，而是因为一本合理的“嵌入式\
  \ C++”书籍对此有所期望。你可以自由跳转到下一段，我在那里将展示非可移植的 C++ 创建任务包装器代码。\n\n## 静态（类）成员。\n\nC 允许你射自己的脚。C++\
  \ 允许你重用子弹。\n\n我将从一个池中分配我的作业线程对象。例如，远程过程调用（Remote Procedure Call）的实现可以使用作业线程池在本地执行过程。从内存池分配线程对象比调用操作系统\
  \ API 创建新线程更快。`MemoryPool` 是一个通用的对象池，它静态地分配对象。这是对之前章节中内存池类的重用。我在这里跳过了了一些细节，例如池的名称、调试统计等。\n\
  \n```cpp\ntemplate<typename Lock, typename ObjectType, size_t Size>\nclass MemoryPool\
  \ {\npublic:\n MemoryPool();\n ~MemoryPool() {}\n inline bool allocate(ObjectType\
  \ **obj);\n inline bool free(ObjectType *obj);\nprotected:\n Stack<ObjectType, LockDummy,\
  \ Size> pool;\n ObjectType objects[Size];\n};\n```\n\n栈保留了空闲（未分配）对象的引用。池的构造函数填充对象栈：\n\
  \n```cpp\ntemplate<typename Lock, typename ObjectType, size_t Size>\nMemoryPool<Lock,\
  \ ObjectType, Size>::MemoryPool() {\n for (int i = 0;i < Size;i++) {\n pool.push(&objects[i]);\n\
  \    }\n}\n```\n\n分配和释放方法调用栈的 `pop` 和 `push` API：\n\n```cpp\ntemplate<typename Lock,\
  \ typename ObjectType, size_t Size>\nbool MemoryPool<Lock, ObjectType, Size>::allocate(ObjectType\
  \ **obj) {\n bool res;\n Lock lock;\nres = pool.pop(obj);\n return res;\n}\n\ntemplate<typename\
  \ Lock, typename ObjectType, size_t Size>\nbool MemoryPool<Lock, ObjectType, Size>::free(ObjectType\
  \ *obj) {\n bool res;\n Lock lock;\nres = pool.push(obj);\n return res;\n}\n```\n\
  \n`JobThread` 实现了一个“开始”API 和一个无限循环的静态方法。更现实的实现会添加“等待完成”、某些用于异步调用上下文作业已完成的机制，以及对作业函数参数的支持。\n\
  \n```cpp\ntemplate <typename JobType> class JobThread {\npublic:\n JobThread();\n\
  \ void start(JobType *job);\nprotected:\n JobType *job;\n xTaskHandle pxCreatedTask;\n\
  \ xQueueHandle signal;\n static void mainLoop(JobThread *jobThread);\n};\n```\n\n\
  `JobThread` 构造函数创建一个二值信号量并产生（spawn）一个新的线程（这个特定动词的选择基于“taskSpawn”，它是 vxWorks 中的一个创建任务\
  \ API）。我在示例中假设使用 FreeRTOS API，但任何其他 API 在这里有效：\n\n```cpp\ntemplate<typename JobType>\n\
  JobThread<JobType>::JobThread() : job(nullptr) {\n static const char *name = \"\
  a job\";\n    vSemaphoreCreateBinary(this->signal);\n    portBASE_TYPE res = xTaskCreate((pdTASK_CODE)mainLoop,\
  \ (const signed char *)name, 300, this, 1, &this->pxCreatedTask);\n if (res != pdPASS)\
  \ {\ncout << \"Failed to create a task\" << endl;\n    }\n}\n```\n\n线程入口点 `mainLoop`\
  \ 方法进入 while 循环并等待二值信号量。在实际代码中，我可能会测试一个对象变量 `bool exitFlag` 而不是始终为真的条件：\n\n```cpp\n\
  template<typename JobType>\nvoid JobThread<JobType>::mainLoop(JobThread *jobThread)\
  \ {\n while (true) {\n        xSemaphoreTake(jobThread->signal, portMAX_DELAY);\n\
  \ if (jobThread->job != nullptr) {\n            jobThread->job->run();\n       \
  \ }\n        jobThread->job = nullptr;\n    }\n}\n```\n\n`start` 方法设置作业指针并唤醒 `mainLoop`：\n\
  \n```cpp\ntemplate<typename JobType>\nvoid JobThread<JobType>::start(JobType *job)\
  \ {\n this->job = job;\nxSemaphoreGive(this->signal);\n}\n```\n\n在下面的示例中，代码打印“Print\
  \ is running”：\n\n```cpp\nstruct PrintJob {\n void run(void) {\ncout << \"Print\
  \ is running\" << endl;\n    }\n};\n\nMemoryPool<LockDummy, JobThread<PrintJob>,\
  \ 3> jobThreads;\n\nPrintJob printJob;\n\nint main( void )\n{\n JobThread<PrintJob>\
  \ *jobThread;\n jobThreads.allocate(&jobThread);\n jobThread->start(&printJob);\n\
  \ vTaskStartScheduler();\n return 1;\n}\n```\n\n## 非静态成员。\n\n“C 让你很容易射中自己的脚；C++\
  \ 让它变得更难，但当你这样做时，它会炸掉你的整个腿。”\n\n我只修改了上面代码中的两行。对 `xTaskCreate` 的调用获取了一个成员函数的指针。C++\
  \ 编译器对将方法地址转换为通用指针发出警告：\n\n```cpp\nvoid *pMainLoop = (void*)&JobThread<JobType>::mainLoop;\n\
  portBASE_TYPE res = xTaskCreate((pdTASK_CODE)pMainLoop, (const signed char *)name,\
  \ 300, this, 1, &this->pxCreatedTask);\n```\n\n主循环方法不再是静态方法，且不需要任何参数：\n\n```cpp\n\
  template<typename JobType>\nvoid JobThread<JobType>::mainLoop() {\n while (true)\
  \ {\n        xSemaphoreTake(signal, portMAX_DELAY);\n if (job != nullptr) {\n job->run();\n\
  \        }\n job = nullptr;\n    }\n}\n```\n\n这个技巧之所以有效，是因为大多数（或所有？）C++ 编译器会将“this”（一个指向对象的指针）首先推入参数栈。如果\
  \ C 和 C++ 代码使用栈帧的方式不同，该技巧可能会失效。虚方法指针也可能失效。这总是可以通过暴力破解来解决——反汇编，并弄清楚如何正确调用成员函数。虚函数调用的实现不同编译器之间差异巨大。\n\
  \n\n\n\n\n本文的读者可能会问，这个成员指针（pointer-to-member）练习的意义何在。我在调试器下运行应用程序时，有时我想使用绝对地址设置断点。我可以打印成员的绝对地址，并查看我的泛型类创建了多少个相同方法的实例。获取函数指针可以确保该函数不是“内联”函数。\n\
  \n## 进程间通信。\n\n无论如何，我讨厌多线程。多进程才是正道，应该是消息传递，而不是共享内存。那样无法扩展。我使用多线程是为了利用我所有的 16 个核心，或者说现在机器的平均核心数。大不了什么。我在数据中心有几千台服务器在等我，我该如何用线程来使用它们呢？–\
  \ Alex Martelli。\n\n经典的进程间通信（IPC）设计模式是邮箱（mailbox）或消息队列。邮箱设计模式在 Windows 3.11 以及第一批真正的实时操作系统（如\
  \ `RT Kernel` 和 `vxWorks`）处于技术前沿时变得流行。某些操作系统支持消息队列 API。我将演示一个基于两个原语构建的消息队列：`semaphore`（信号量）和\
  \ `FIFO`（先进先出队列）。`Mailbox` 类是“对象组合”（[4],[5]）的一个示例。我使用了“邮箱拥有一个 FIFO”的关系。或者，我可以使用“邮箱是一个\
  \ FIFO”的公式，并从 `FIFO` 类派生——继承邮箱。不过度使用继承被认为是一种做法。\n\n邮箱 API 有两个方法：发送消息和等待消息 ([6])：\n\
  \n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\nclass  Mailbox {\n\n\
  public:\n\n Mailbox(const  char *name, size_t size);\n\n const  char *getName()\
  \ {return  name;}\n\n inline  bool  send(ObjectType msg);\n\n enum TIMEOUT {NORMAL,\
  \ NONE, FOREVER};\n\n bool  wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t timeout);\n\
  \nprotected:\n\n const  char *name;\n\n xQueueHandle  semaphore;\n\n CyclicBufferDynamic<ObjectType,\
  \ Lock> fifo;\n\n};\n```\n\n邮箱构造函数使用了 FreeRTOS 计数信号量：\n\n```cpp\ntemplate<typename\
  \  ObjectType, typename  Lock>\n\nMailbox<ObjectType, Lock>::Mailbox(const  char\
  \ *name, size_t size) :\n\n fifo(size),\n\n name(name) {\n\n semaphore = xSemaphoreCreateCounting(size+1,\
  \ 0);\n\n}\n```\n\nsend 方法向 FIFO 添加消息并递增信号量值：\n\n```cpp\ntemplate<typename  ObjectType,\
  \ typename  Lock>\n\nbool  Mailbox<ObjectType, Lock>::send(ObjectType msg) {\n\n\
  \ bool res;\n\nres = fifo.add(msg);\n\n     xSemaphoreGive(semaphore);\n\n return\
  \ res;\n\n}\n```\n\n接收消息处理不同类型的超时：\n\n```cpp\ntemplate<typename  ObjectType, typename\
  \  Lock>\n\nbool  Mailbox<ObjectType, Lock>::wait(ObjectType *msg,\n\nTIMEOUT waitType,\
  \ size_t timeout) {\n\n bool res = false;\n\n     portBASE_TYPE semaphoreRes = pdFALSE;\n\
  \n while (semaphoreRes == pdFALSE) {\n\n if (waitType == TIMEOUT::FOREVER) {\n\n\
  \              semaphoreRes = xSemaphoreTake(semaphore, portMAX_DELAY);\n\n    \
  \      }\n else  if (waitType == TIMEOUT::NORMAL) {\n\n              semaphoreRes\
  \ = xSemaphoreTake(semaphore, timeout);\n\n break;\n\n          }\n else {\n\n \
  \             semaphoreRes = xSemaphoreTake(semaphore, 0);\n\n break;\n\n      \
  \    }\n\n    }\n\n if ((semaphoreRes == pdTRUE) && !fifo.isEmpty()) {\n\nres =\
  \ fifo.remove(msg);\n\n     }\n\n return res;\n\n}\n```\n\n在示例应用程序中，中断（生产者）从 `UART`\
  \ 设备读取数据，并将收集的数据发送到处理任务（消费者）。我的消息对象包含两个内容：一个消息事件和一些数据。消费者任务预计根据消息事件进行切换：\n\n```cpp\n\
  enum EVENT {UART0, UART1};\n\ntypedef  struct {\n\n enum EVENT event;\n\n size_t\
  \  data[32];\n\n int  dataSize;\n\n} Message;\n```\n\n在下面的示例中，我重用了上一个章节中的内存池：\n\n\
  ```cpp\nMemoryPool<LockDummy, Message, 3> pool;\n\nMailbox<Message*, LockDummy>\
  \ myMailbox(\"mbx\", 3);\n\nvoid  rxTask( void ) {\n\n     myMailbox.wait(&message,\n\
  \n      myMailbox.TIMEOUT::FOREVER, 0);\n\ncout << \"data=\" <<\n\n         message->data\
  \ << \", event=\" <<\n\n         message->event << endl;\n\n    pool.free(message);\n\
  \n}\n\nint  main( void ) {\n\n     Message *message;\n\n     pool.allocate(&message);\n\
  \n     message->data[0] = 0x30;\n\n     message->dataSize = 1;\n\n     message->event\
  \ = EVENT::UART0;\n\n     myMailbox.send(message);\n\n}\n```\n\n在许多情况下，现代固件开发人员会使用“流水线”（pipeline）。“流水线是一系列串联连接的数据处理元素，其中一个元素的输出是下一个元素的输入”（Wikipedia）。一个处理元素（例如线程）唤醒并检查邮箱——任务队列。如果队列不为空，该线程执行一个阶段的处理，并将处理后的数据转发给流水线中的下一个线程。\n\
  \n流水线任务有两个方法：添加新任务和处理数据。流水线任务——一个阶段——有一个名称并保留对下一个阶段的引用：\n\n```cpp\ntemplate<typename\
  \  ObjectType, typename  Lock, std::size_t  Size>\n\nclass  PipelineTask {\n\npublic:\n\
  \n PipelineTask(const  char *name,\n\n PipelineTask *nextStage = nullptr) :\n\n\
  \ name(name),\n\n nextStage(nextStage){}\n\n void  doJob();\n\n void  addJob(ObjectType\
  \ &data);\n\nprotected:\n\n const  char *name;\n\n PipelineTask *nextStage;\n\n\
  \ CyclicBuffer<ObjectType, Lock, Size> fifo;\n\n};\n```\n\nadd job API 向 FIFO 添加数据：\n\
  \n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\n\
  void  PipelineTask<ObjectType, Lock, Size>::addJob(ObjectType &data) {\n\n fifo.add(data);\n\
  \n}\n```\n\n`doJob()` 方法从 FIFO 获取数据，对其进行递增——我假设数据类型支持 `operator++()`，并将数据推送到下一个阶段：\n\
  \n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\n\
  void  PipelineTask<ObjectType, Lock, Size>::doJob() {\n\n while (!fifo.isEmpty())\
  \ {\n\n ObjectType data;\n\n fifo.remove(data);\n\n         data++;\n\ncout << \"\
  Stage:\" << name << \", data=\" << data << endl;\n\n nextStage->addJob(data);\n\n\
  \    }\n\n}\n```\n\n新类型 `MyPipelineTask`：\n\n```cpp\ntypedef PipelineTask<int, LockDummy,\
  \ 3> MyPipelineTask;\n```\n\n流水线的三个阶段——倒数第三个阶段没有“后续”：\n\n```cpp\nMyPipelineTask\
  \ pipelineTask3(\"3\");\n\nMyPipelineTask pipelineTask2(\"2\", &pipelineTask3);\n\
  \nMyPipelineTask pipelineTask1(\"1\", &pipelineTask2);\n```\n\n我可以从中断或主循环调用流水线的阶段，例如如下所示：\n\
  \n```cpp\nvoid  testPipeline() {\n\n int data = 0;\n\n     pipelineTask1.addJob(data);\n\
  \n     pipelineTask1.doJob();\n\n     pipelineTask2.doJob();\n\n     pipelineTask3.doJob();\n\
  \n}\n```\n\n上面的代码生成输出：\n\nStage:1, data=1\nStage:2, data=2\nStage:3, data=3\n\n\
  流水线范式可以提高 CPU 的利用率，流水线使得更容易利用多核系统。\n\n## 日志（Log）。\n\n完美不是已经没有什么可增加的，而是已经没有什么可减少的——安托万·圣埃克佩里\n\
  \n在一个 C 项目中，我看到过以下生成日志条目的代码：\n\n```cpp\nenum {\n\n LOG_LEVEL_INFO,\n\n LOG_LEVEL_ERROR,\n\
  \n LOG_LEVEL_LAST,\n\n};\n\nstatic  const  char *LOG_LEVEL_NAME[] = {\"INFO\", \"\
  ERROR\", “UKNOWN”};\n\n#define LOG_INFO(fmt, ...) log_print(__LINE__, LOG_LEVEL_INFO,\
  \ fmt, ##__VA_ARGS__ )\n\n#define LOG_ERROR(fmt, ...) log_print(__LINE__, LOG_LEVEL_ERROR,\
  \ fmt, ##__VA_ARGS__ )\n\nstatic  void  log_print(int line, int level, const  char\
  \ *fmt, ...)\n\n{\n\n va_list ap;\n\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[level],\
  \ line);\n\n     va_start(ap, fmt);\n\n vprintf(fmt, ap);\n\n     va_end(ap);\n\n\
  }\n\nvoid  testLog(void) {\n\n     LOG_INFO(\"This is info %d\", 1);\n\n     LOG_ERROR(\"\
  This is error %d\", 2);\n\n}\n```\n\n在我的机器上，上面的代码生成输出：\n\nINFO: line=402, msg=This\
  \ is info 1\nERROR: line=403, msg=This is error 2\n\n\n\n\n对 log API 的调用非常频繁，图像的大小非常重要。调用\
  \ `log_print()` 会向栈中推入至少三个参数。我认为我可以节省一次推入操作——日志级别。在 C 语言实现中，我会添加 `log_print_info(...)`\
  \ 和 `log_print_error(...)` 函数，它们反过来调用 `log_print()`，并相应地修复宏。在 C++ 中，我使用了一个模板。构造函数是原始\
  \ `log_print` 函数的精确拷贝，去掉了日志级别：\n\n```cpp\ntemplate <int  Level> class  Log {\npublic:\n\
  \ Log(int line, const  char *fmt, ...) {\n va_list ap;\n printf(\"%s: line=%d, msg=\"\
  , LOG_LEVEL_NAME[Level], line);\n      va_start(ap, fmt);\n vprintf(fmt, ap);\n\
  \      va_end(ap);\n    }\n};\n```\n\n日志宏调用构造函数：\n\n```cpp\n#define LOG_INFO(fmt,\
  \ ...) Log<LOG_LEVEL_INFO>(__LINE__, fmt, ##__VA_ARGS__ )\n#define LOG_ERROR(fmt,\
  \ ...) Log<LOG_LEVEL_ERROR>(__LINE__, fmt, ##__VA_ARGS__ )\n```\n\nC++ 编译器为我生成了两个打印日志函数，并为每次调用\
  \ log API 节省了一次栈推入操作。`log` 类是一个“仿函数（functoid）”——它是一个增强版的函数。我可以使用基于普通类的仿函数，而不是像这样的模板：\n\
  \n```cpp\nclass  Log {\npublic:\n Log(const  char *level) : level(level) {}\n void\
  \  print(int line, const  char *fmt, ...) const {\n va_list ap;\n printf(\"%s: line=%d,\
  \ msg=\", level, line);\n      va_start(ap, fmt);\n vprintf(fmt, ap);\n      va_end(ap);\n\
  \    }\nprotected:\n const  char *level;\n};\nconst  Log LogInfo(\"INFO\");\nconst\
  \  Log LogError(\"ERROR\");\n#define LOG_INFO(fmt, ...) LogInfo.print(__LINE__,\
  \ fmt, ##__VA_ARGS__ )\n#define LOG_ERROR(fmt, ...) LogError.print(__LINE__, fmt,\
  \ ##__VA_ARGS__ )\n```\n\n我舍弃了数组 `LOG_LEVEL_NAME`，现在扩展日志级别枚举变得更简单了。在目标代码中只有一个打印函数实例。代价是数据\
  \ RAM 中的几个字，或者两个 `Log` 类型的对象。代码和数据可以放在 ROM 中。\n\n调用 `vprintf()` 不是固件开发人员经常的操作。事实上，代码会针对同一组格式化字符串反复调用\
  \ `vprintf()`。我只需要向控制台发送 `vprintf()` 的参数，以及源代码中的确切位置或目标文件中的偏移。\n\n下方的 `BinaryLog`\
  \ 类仅处理“int” 类型的参数。源代码中的位置由“唯一”的文件标识符和源行号定义：\n\n```cpp\nclass  BinaryLog {\npublic:\n\
  \ BinaryLog(int fileId, int line, int count, ...);\n};\n```\n\n我假设有一个“sendData”\
  \ API 可以向控制台发送任意数量的整数：\n\n```cpp\nBinaryLog::BinaryLog(int fileId, int line, int\
  \ count, ...) {\n const  int HEADER_SIZE = 3;\n int header[HEADER_SIZE];\n    header[0]\
  \ = fileId;\n    header[1] = line;\n    header[2] = count;\n    sendDataStart();\n\
  \    sendData(header, HEADER_SIZE);\n va_list ap;\n    va_start(ap, count);\n for\
  \ (int j=0; j < count; j++) {\n int arg = va_arg(ap, int);\n      sendData(arg);\n\
  \    }\n    va_end(ap);\n    sendDataEnd();\n}\n```\n\n我仿真中的“send data” API 看起来如下：\n\
  \n```cpp\ninline void  sendData(const  int data) {\ncout << dec << data << \" \"\
  ;\n}\ninline void  sendDataStart() {cout << endl;}\ninline void  sendDataEnd() {cout\
  \ << endl;}\nvoid  sendData(const  int *data, int count) {\n for (int i = 0;i <\
  \ count;i++) {\ncout << hex << data[i] << \" \";\n    }\n}\n```\n\n两个宏定义调用构造函数 `BinaryLog`。宏\
  \ `ARGUMENTS_COUNT` 具有良好的可移植性，应返回可变宏中的参数数量：\n\n```cpp\n#define ARGUMENTS_COUNT(...)\
  \ (sizeof((int[]){__VA_ARGS__})/sizeof(int))\n#define LOG_INFO(fmt, ...) BinaryLog(FILE_ID,\
  \ __LINE__, ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__ )\n#define LOG_ERROR(fmt,\
  \ ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__ )\n\
  ```\n\n文件标识符由编译器在构建期间根据文件名生成。我使用了一个简单的哈希函数。真实的、如 MD5 哈希可以在 [7] 中找到。\n\n```cpp\n\
  constexpr  int hashData(const  char* s, int accumulator) {\n return *s ? hashData(s\
  \ + 1, (accumulator << 1) : accumulator;\n}\nconstexpr  int hashMetafunction(const\
  \  char* s) {\n return hashData(s, 0);\n}\nconstexpr  int FILE_ID = hashMetafunction(__FILE__);\n\
  ```\n\n用法示例：\n\n```cpp\nvoid testBinaryLog(void) {\n LOG_INFO(\"This is info %d\
  \ %d\", 1, 2);\n LOG_ERROR(\"This is error %d %d %d\", 0, 1, 2);\n}\n```\n\n在我的系统中，`test`\
  \ 函数产生输出：\n`26140 511 1 2`\n`26140 512 0 1`\n\n我现在只需要一个短脚本 ([8]) 来为所有源文件计算文件标识符，根据文件标识符\
  \ `26140` 找到正确的文件，解析 c++ 文件中的 `511` 和 `51` 行，并生成两行可读的内容：\ninfo 1 2\nerror 0 1\n\n\
  另一个构建脚本可以确保格式字符串正确表示对宏的调用。通过移除昂贵的 `vprintf()` 调用，我节省了大量的 CPU 周期和带宽。二进制日志不使用任何静态数据，且\
  \ API 是线程安全的。我的系统生成的日志在处理之前需要额外的处理。\n\n\n\n\n当我在中断中调用系统日志时，我需要禁用中断。对于任务级的系统日志，一个互斥锁（mutex）可能足够了。具有相似性能的\
  \ C 语言方案需要一个宏。\n\n## 软件定时器。\n\nC++：难以学习，且注生如此。\n\n到目前为止，我演示了一些相当简单的软件组件，例如 `mutex`\
  \ 或 `cyclic buffer`（环形缓冲区）。在本章中，我将实现一个软件定时器。\n\n现代操作系统提供了定时器 API。通常，应用程序可以启动一个任意过期时间的定时器。当定时器过期时，操作系统会从专用定时器线程或系统中断调用应用程序钩子。如果应用程序启动了许多不同的定时器，此类\
  \ API 的性能可能会下降。通常无法控制处理定时器的进程优先级。这里介绍的 API 允许应用程序在单个上下文或具有不同优先级的多个上下文中处理所有与定时器相关的代码。\n\
  \n软件定时器 API 将具有 `O(1)` 复杂度。该 API 将是线程安全的。软件定时器的源代码可以在 `[9]` 中找到。\n\n你已经熟悉面向对象的设计流程了。让我们先声明一个定时器对象。定时器对象保留一个唯一的定时器标识。\n\
  \n唯一的定时器标识可以用于解决 `stopTimer` 和 `timerExpired` 之间可能的竞态条件。考虑以下场景：定时器“a”由上下文 A 启动。定时器“a”被上下文\
  \ A 停止，但太晚了——定时器“a”刚刚过期，处理过期的应用程序代码正在运行。根据应用程序回调的实现，事件处理可以异步进行。与此同时，同一个定时器对象被另一个线程\
  \ B 分配并修改。如果上下文 A 保留了所有启动定时器的标识，应用程序回调可以检查定时器标识是否在运行中的定时器列表中。如果定时器已停止，回调可以忽略定时器过期。使用定时器对象本身的引用进行此类账目记录不是好的，因为定时器对象池可能是一个共享资源。\n\
  \n在启动定时器时，用户可以提供一个可选的应用程序数据指针，即 cookie。定时器类可以像所示的模板：\n\n```cpp\ntemplate<typename\
  \  CookieType> class  Timer {\nprotected:\n    CookieType  cookie;\n};\n```\n\n\
  我想简化接口并避免在定时器对象中使用虚方法——稍后会详细讨论虚方法。定时器对象将保留一个指向应用程序数据的指针，而不是任意类型的对象。\n\n用户只能通过公共方法（getters\
  \ 和 setters）访问定时器数据。这种方法有助于未来的代码维护。\n\n`Timer` 类实现了一个不带参数的构造函数。我希望能够在不引入太多麻烦的情况下创建定时器的静态数组。`TimerList`\
  \ 类（尚未声明）是 `Timer` 类的友元类，可以调用 `Timer` 的受保护方法。`start()` 方法是受保护的，因为应用程序应该使用 `TimerList`\
  \ 方法启动定时器。\n\n```cpp\nclass  Timer {\npublic:\n    Timer();\n    inline  void  stop();\n\
  \    bool  isRunning() const;\n    TimerID  getId() const;\n    inline  uintptr_t\
  \  getApplicationData() const;\n    SystemTime  getStartTime() const;\nprotected:\n\
  \    friend  class  TimerList;\n    TimerID  id;\n    uintptr_t  applicationData;\n\
  \    bool  running;\n    SystemTime  startTime;\n    inline  void  start();\n  \
  \  inline  void  setApplicationData(uintptr_t applicationData);\n    inline  void\
  \  setId(TimerID id);\n    inline  void  setStartTime(SystemTime systemTime);\n\
  };\n```\n\n方法的实现非常直观：\n\n```cpp\nTimer::Timer() {\n    stop();\n}\n\nTimerID  Timer::getId()\
  \ const {\n    return  id;\n}\n\nSystemTime  Timer::getStartTime() const {\n   \
  \ return  startTime;\n}\n\nbool  Timer::isRunning() const {\n    return  running;\n\
  }\n\nvoid  Timer::stop() {\n    running = false;\n}\n\nvoid Timer::start() {\n \
  \   running = true;\n}\n\nvoid  Timer::setApplicationData(uintptr_t applicationData)\
  \ {\n    this->applicationData = applicationData;\n}\n\nuintptr_t  Timer::getApplicationData()\
  \ const {\n    return  applicationData;\n}\n\nvoid  Timer::setId(TimerID id) {\n\
  \    this->id = id;\n}\n\nvoid  Timer::setStartTime(SystemTime systemTime) {\n \
  \   this->startTime = systemTime;\n}\n```\n\n系统时间通常是由中断增加的 tick 或从硬件读取读取的。在这个示例中，我使用了\
  \ `size_t` 类型。在更高级的设计中，`System Time` 类型和 `Timeout` 类型可以是两个类。定时器 API 只需要一个签名为 `bool\
  \ isTimerExpired(SystemTime, Timeout, SystemTime)` 的函数。在下面的实现中，我处理了 `SystemTime`\
  \ 溢出，假设定时器的超时时间相对于 `SystemTime` 的最大值是非常小的。\n\n```cpp\ntypedef  size_t  SystemTime;\n\
  typedef  size_t  Timeout;\n\nstatic  inline  bool  isTimerExpired(SystemTime startTime,\
  \ Timeout timeout,\n    SystemTime currentTime) {\n    bool timerExpired = false;\n\
  \    SystemTime timerExpiartionTime = startTime + timeout;\n\n    timerExpired =\
  \ timerExpired\n                || ((timerExpiartionTime >= currentTime)\n     \
  \               && (startTime < currentTime));\n\n    timerExpired = timerExpired\n\
  \                || ((timerExpiartionTime >= currentTime)\n                    &&\
  \ (startTime > currentTime));\n\n    timerExpired = timerExpired\n             \
  \   || ((timerExpiartionTime <= currentTime)\n                    && (startTime\
  \ > currentTime)\n                    && (timerExpiartionTime < startTime));\n \
  \   return timerExpired;\n}\n```\n\n我的 API 拥有一个 C++11 类型的可能返回码枚举。C++11 `enum class`\
  \ 不是整数，不能转换为整数。一个枚举的成员不能赋值给另一个枚举的成员。\n\n```cpp\nenum  class TimerError {\n    Ok,\
  \ Stopped, Illegal, FreeTimer, NoRunningTimers\n};\n```\n\n我需要一个处理定时器过期的应用程序回调。在更高级的设计中，回调可以是模板函数：\n\
  \n```cpp\ntypedef  void (*ExpirationHandler)(const  Timer& timer);\n```\n\n我将通过构造函数的参数提供一个同步\
  \ API。在基类 `TimerLock` 中，我将 get/release 接口设置为零。锁 API 将由派生类实现。虚函数的典型性能开销是 1 或 2 个操作码。\n\
  \n```cpp\nclass  TimerLock {\npublic:\n    virtual  void  get() = 0;\n    virtual\
  \  void  release() = 0;\nprotected:\n    virtual  ~TimerLock() {}\n};\n\nclass \
  \ TimerLockDummy : public  TimerLock {\npublic:\n    virtual  void  get() {}\n \
  \   virtual  void  release() {}\nprotected:\n};\n```\n\n我需要一个通过 `operator[]` 使用堆动态分配的环形缓冲区。在之前的章节中，我讨论了\
  \ `operator[]` 以及无法从内存堆进行分配的情况。\n\n```cpp\ntemplate<typename  ObjectType, typename\
  \  Lock>\nclass  CyclicBufferDynamic {\npublic:\n    inline  CyclicBufferDynamic(size_t\
  \ size);\n    ~CyclicBufferDynamic() {\n    }\n    inline  bool  isEmpty();\n  \
  \  inline  bool  isFull();\n    inline  bool  add(ObjectType object);\n    inline\
  \  bool  remove(ObjectType *object);\n    inline  bool  getHead(ObjectType *object);\n\
  private:\n    void  errorOverflow() {\n    }\n    void  errorUnderflow() {\n   \
  \ }\n    size_t  increment(size_t index);\n    ObjectType *data;\n    size_t  head;\n\
  \    size_t  tail;\n    size_t  size;\n};\n```\n\n构造函数调用 `operator[]` 来配配指针数组。有一个\
  \ `static_assert` 确保模板类仅用于指针：\n\n```cpp\ntemplate<typename  ObjectType, typename\
  \  Lock>\ninline  CyclicBufferDynamic<ObjectType, Lock>::\nCyclicBufferDynamic(size_t\
  \ size) {\n    this->head = 0;\n    this->tail = 0;\n    this->size = size;\n  \
  \  this->data = new  ObjectType[size];\n    static_assert(sizeof(ObjectType) <=\
  \ sizeof(uintptr_t), \"CyclicBuffer is intended to work only with integer types\
  \ or pointers\");\n}\n```\n\n其余代码与之前的实现相似：\n\n\n\n\n\n```cpp\ntemplate<typename\
  \ ObjectType, typename Lock>\ninline bool CyclicBufferDynamic<ObjectType, Lock>::isEmpty()\
  \ {\n  bool res = (this->head == this->tail);\n  return res;\n}\n\ntemplate<typename\
  \ ObjectType, typename Lock>\ninline bool CyclicBufferDynamic<ObjectType, Lock>::isFull()\
  \ {\n  size_t tail = increment(this->tail);\n  bool res = (this->head == tail);\n\
  \  return res;\n}\n\ntemplate<typename ObjectType, typename Lock>\ninline bool CyclicBufferDynamic<ObjectType,\
  \ Lock>::add(ObjectType object) {\n  Lock lock;\n  if (!isFull()) {\n    data[this->tail]\
  \ = object;\n    this->tail = increment(this->tail);\n    return true;\n  } else\
  \ {\n    errorOverflow();\n    return false;\n  }\n}\n\ntemplate<typename ObjectType,\
  \ typename Lock>\ninline bool CyclicBufferDynamic<ObjectType, Lock>::remove(ObjectType\
  \ *object) {\n  Lock lock;\n  if (!isEmpty()) {\n    *object = data[this->head];\n\
  \    this->head = this->increment(this->head);\n    return true;\n  } else {\n \
  \   errorUnderflow();\n    return false;\n  }\n}\n\ntemplate<typename ObjectType,\
  \ typename Lock>\ninline bool CyclicBufferDynamic<ObjectType, Lock>::getHead(ObjectType\
  \ *object) {\n  Lock lock;\n  if (!isEmpty()) {\n    *object = data[this->head];\n\
  \    return true;\n  } else {\n    errorUnderflow();\n    return false;\n  }\n}\n\
  \ntemplate<typename ObjectType, typename Lock>\nsize_t CyclicBufferDynamic<ObjectType,\
  \ Lock>::increment(size_t index) {\n  if (index < this->size) {\n    return (index\
  \ + 1);\n  } else {\n    return 0;\n  }\n}\n```\n\n在这里使用 `LockDummy` 是刻意之为。我不需要环形缓冲区存储指向\
  \ `Timer` 类对象的指针是重入的：\n\n`typedef CyclicBufferDynamic<Timer*, LockDummy> TimerCyclicBuffer;`\n\
  \n定时器列表保留了具有相同超时时间的定时器。定时器的过期时间取决于开始时间。定时器 API 假设系统中存在有限且数量较少的不同定时器（具有不同超时时间的定时器）。通常在开始编写代码之前，我已经知道系统中需要哪些定时器。`TimerList`\
  \ 是“对象组合”的一个示例——我将简单对象（如 `FIFOs`）组合成更复杂的对象。与其使用环形缓冲区，可以使用内存池来实现空闲定时器列表 `freeTimers`。\n\
  \n```cpp\nclass TimerList {\npublic:\n  TimerList(size_t size, Timeout timeout,\n\
  \    TimerExpirationHandler expirationHandler,\n    TimerLock &timerLock,\n    bool\
  \ callExpiredForStoppedTimers=false) :\n    timeout(timeout),\n    expirationHandler(expirationHandler),\n\
  \    callExpiredForStoppedTimers(callExpiredForStoppedTimers),\n    freeTimers(size),\n\
  \    runningTimers(size),\n    timerLock(timerLock) {\n    Timer *timers = new Timer[size];\n\
  \    for (size_t i = 0; i < size; i++) {\n      freeTimers.add(&timers[i]);\n  \
  \  }\n  }\n  TimerError processExpiredTimers(SystemTime currentTime);\n  TimerError\
  \ startTimer(SystemTime currentTime, SystemTime &nearestExpirationTime, uintptr_t\
  \ applicationData = 0, const Timer **timer = nullptr);\n  inline TimerError stopTimer(Timer\
  \ &timer) {\n    timer.stop();\n    return TimerError::Ok;\n  }\n  SystemTime getNearestExpirationTime()\
  \ {\n    return nearestExpirationTime;\n  }\nprotected:\n  inline static TimerID\
  \ getNextId();\n  TimerError _startTimer(SystemTime currentTime, SystemTime &nearestExpirationTime,\
  \ uintptr_t applicationData = 0, const Timer **timer = nullptr);\n  TimerError _processExpiredTimers(SystemTime\
  \ currentTime);\n  Timeout timeout;\n  TimerExpirationHandler expirationHandler;\n\
  \  bool callExpiredForStoppedTimers;\n  SystemTime nearestExpirationTime;\n  CyclicBufferDynamic<Timer*,\
  \ LockDummy> freeTimers;\n  CyclicBufferDynamic<Timer*, LockDummy> runningTimers;\n\
  \  TimerLock &timerLock;\n};\n```\n\n`TimerList` 的保护方法不是线程安全的。例如 `getNextId()` 不是线程安全的。只有子类或公共方法可以访问保护成员并应负责同步：\n\
  \n```cpp\nTimerID TimerList::getNextId() {\n  static TimerID id = 0;\n  id++;\n\
  \  return id;\n}\n\nTimerError TimerList::startTimer(SystemTime currentTime, SystemTime\
  \ &nearestExpirationTime, uintptr_t applicationData, const Timer **timer) {\n  timerLock.get();\n\
  \  TimerError res = TimerList::_startTimer(currentTime, nearestExpirationTime, applicationData,\
  \ timer);\n  timerLock.release();\n  return res;\n}\n```\n\n保护方法 `_startTimer()`\
  \ 将定时器从空闲定时器列表移动到运行定时器列表\n\n```cpp\nTimerError TimerList::_startTimer(SystemTime\
  \ currentTime, SystemTime &nearestExpirationTime, uintptr_t applicationData, const\
  \ Timer **timer) {\n  Timer* newTimer;\n  if (freeTimers.isEmpty())\n    return\
  \ TimerError::NoFreeTimer;\n  freeTimers.remove(&newTimer);\n  newTimer->setStartTime(currentTime);\n\
  \  newTimer->setApplicationData(applicationData);\n  newTimer->setId(getNextId());\n\
  \  newTimer->start();\n  runningTimers.add(newTimer);\n  Timer* headTimer;\n  runningTimers.getHead(&headTimer);\n\
  \  nearestExpirationTime = headTimer->getStartTime() + timeout;\n  this->nearestExpirationTime\
  \ = nearestExpirationTime;\n  if (timer != nullptr)\n    *timer = newTimer;\n  return\
  \ TimerError::Ok;\n}\n```\n\n方法 `_processExpiredTimers()` 将停止和过期的定时器从运行定时器列表头部移动到空闲定时器列表。定时器列表的用户应调用\
  \ `processExpiredTimers()`，这将为过期的定时器调用应用程序回调。用户应调用 `getNearestExpirationTime()`\
  \ 来获取下一个定时器的过期时间，即再次调用 `processExpiredTimers()` 的时间。`nearestExpirationTime` 和 `currentTime`\
  \ 之间的差异可以用于例如系统调用 `sleep()`。`runningTimers` 列表上的定时器按过期时间排序。我总是将定时器添加到末尾，且列表上所有定时器的超时时间是相同的。该保护方法是非重入的：\n\
  \n```cpp\nTimerError TimerList::_processExpiredTimers(SystemTime currentTime) {\n\
  \  Timer* timer;\n  while (!runningTimers.isEmpty()) {\n    if (!runningTimers.getHead(&timer))\n\
  \      break;\n    bool timerExpired = timer->getStartTime() + timeout <= currentTime;\n\
  \    bool timerRunning = timer->isRunning();\n    bool callHandler = timerExpired\
  \ || (!timerRunning && callExpiredForStoppedTimers);\n    if (callHandler) {\n \
  \     (expirationHandler)(*timer);\n    }\n    if (timerExpired || !timerRunning)\
  \ {\n      runningTimers.remove(&timer);\n      freeTimers.add(timer);\n    }\n\
  \    if (!timerExpired && timerRunning) {\n      nearestExpirationTime = timer->getStartTime()\
  \ + timeout;\n      break;\n    }\n  }\n  if (runningTimers.isEmpty())\n    return\
  \ TimerError::Ok;\n  else\n    return TimerError::NoRunningTimers;\n}\n```\n\n公共方法是重入的：\n\
  \n```cpp\nTimerError TimerList::processExpiredTimers(SystemTime currentTime) {\n\
  \  timerLock.get();\n  TimerError res = TimerList::_processExpiredTimers(currentTime);\n\
  \  timerLock.release();\n  return res;\n}\n```\n\n我将定时器列表分组为“集合”。例如，一组超时时间为 5 秒、20\
  \ 秒、60 秒的低优先级定时器，以及一组高优先级定时器。不同的集合可以由运行在不同优先级的线程处理。我在编译时知道哪些定时器属于集合。\n\n`TimerSet`\
  \ 类是“对象熟悉”([4], [5]) 的示例。`TimerSet` 类与 `TimerList` 类之间存在“感知”关系。可以通过其他对象访问组件对象（定时器列表），而不通过聚合对象\
  \ `TimerSet`。组件对象可以比聚合对象生存。\n\n```cpp\nclass TimerSet {\npublic:\n  TimerSet(const\
  \ char* name, int size) :\n    name(name), listCount(size) {\n    this->size = size;\n\
  \    timerLists = new TimerList*[size];\n  }\n  const char *getName() {\n    return\
  \ name;\n  }\n  TimerError processExpiredTimers(SystemTime currentTime, SystemTime&\
  \ expirationTime);\n  bool addList(TimerList* list);\n};\n```\n\n\n\n\n\nprotected:\n\
  \  const char *name;\n  TimerList **timerLists;\n  size_t listCount;\n  size_t size;\n\
  };\n\n`addList` API 填充了数组 `timerLists`：\n\n```cpp\nbool TimerSet::addList(TimerList*\
  \ list) {\n  if (listCount < size) {\n    timerLists[listCount] = list;\n    listCount++;\n\
  \    return true;\n  } else {\n    return false;\n  }\n}\n```\n\n`processExpiredTimers()`\
  \ 方法调用所有定时器列表中对应的 API，并方便地返回下次调用该方法的时间。该方法的复杂度为 `O(number of timer lists)`：\n\n\
  ```cpp\nTimerError TimerSet::processExpiredTimers(\nSystemTime currentTime, SystemTime\
  \ &expirationTime) {\n  TimerList* timerList;\n  size_t i;\n  SystemTime nearestExpirationTime;\n\
  \  bool res = false;\n  for (i = 0; i < listCount; i++) {\n    timerList = timerLists[i];\n\
  \    TimerError timerRes = timerList->processExpiredTimers(currentTime);\n    if\
  \ (timerRes == TimerError::Ok) {\n      SystemTime listExpirationTime = timerList->getNearestExpirationTime();\n\
  \      if (res) {\n        if (nearestExpirationTime > listExpirationTime) {\n \
  \         nearestExpirationTime = listExpirationTime;\n        }\n      } else {\n\
  \        nearestExpirationTime = listExpirationTime;\n      }\n      res = true;\n\
  \    }\n  }\n  if (res)\n    return TimerError::Ok;\n  else\n    return TimerError::NoRunningTimers;\n\
  }\n```\n\n最后是一个用用示例：\n\n```cpp\nstatic void mainExpirationHandler(const Timer& timer)\
  \ {\n  TimerID timerId = timer.getId();\n  uintptr_t data = timer.getApplicationData();\n\
  \  cout << \"Expired id=\" << timerId << \",appdata=\" << data << endl;\n}\n\nTimerLockDummy\
  \ timerLock;\nstatic TimerList timerList(3, 3, mainExpirationHandler, timerLock);\n\
  \nint main() {\n  SystemTime currentTime = 0;\n  for (int i = 0; i < 3; i++) {\n\
  \    SystemTime nearestExpirationTime;\n    TimerError err = timerList.startTimer(currentTime,\
  \ nearestExpirationTime, i);\n    if (err == TimerError::Ok) {\n      cout << \"\
  nearestExpirationTime=\" << nearestExpirationTime << endl;\n    } else {\n     \
  \ cout << \"timer start failed for timer \" << i << endl;\n    }\n  }\n  timerList.processExpiredTimers(3);\n\
  \  return 0;\n}\n```\n\n假设我需要两种不同的 `Timer` 类型——一种带有定时器标识符，另一种没有。我从一个新基类派生出一个更大的定时器类，其中定时器标识符的设置器是一个空方法。转换将不涉及对\
  \ `TimerList` 类的任何更改。`TimerList` 类可以与任何实现了 `Timer` 类 API（即 `Timer` 类“契约”）的“接口”（[10]）工作。\n\
  \n在另一个系统中，系统时间是一个包含以下字段的结构：`hours`、`minutes`、`seconds` 和 `milliseconds`。如果定义了两个运算符：`compare`\
  \ 和 `add`，`TimerList` 类就可以处理这种系统时间。\n\n在另一个系统中，我无法与动态分配的循环缓冲区工作。我将 `TimerList` 类转换为一个模板类，其大小由列表参数决定。`TimerSet`\
  \ 类可以与任何实现了 `processExpiredTimers()` API 的定时器列表工作。我从一个具有纯虚方法 `processExpiredTimers()`\
  \ 的抽象基类派生出 `TimerList` 类——现在它是一个模板类。代码的修改将不会影响 `TimerList` 或 `TimerSet` 方法中的逻辑。\n\
  \n在某些应用中，我在同一个线程中启动定时器、停止定时器并处理过期。我不需要重入 API。我可以通过对定时器列表使用虚拟锁（dummy lock）来节省 CPU\
  \ 周期。\n\n一旦编写并调试完成，`TimerList` 和 `TimerSet` 类可以在许多不同情况下为我提供帮助。我可以在 C 语言中到处使用 `void*`\
  \ 和一些类型转换来实现同样的事情。C++ 粉丝们会认为，C++ 的替代方案更加优雅且类型安全。\n\n## Lambda\n\n模数转换器 (ADC) 是一种将连续物理量（例如电压）转换为表示该量幅的数字的设备（[11]）。在我的应用程序中，我想读取\
  \ ADC 设备，在环形缓冲区中收集样本，运行一个简单的环形缓冲区（[12]）。ADC 看起来如下：\n\n```cpp\ntemplate<typename\
  \ ObjectType, size_t Size>\nclass ADC {\npublic:\n  ADC(ObjectType);\n  typedef\
  \ ObjectType (*Filter)(ObjectType);\n  void add(ObjectType, Filter);\n  double get();\n\
  protected:\n  CyclicBuffer<Size> data;\n  ObjectType value;\n};\n```\n\nADC 构造函数设置了初始值：\n\
  ```cpp\ntemplate<typename ObjectType, size_t Size>\nADC(ObjectType initialValue)\
  \ {\n  value = initialValue;\n}\n```\n\n`get()` 方法返回计算值：\n```cpp\ntemplate<typename\
  \ ObjectType, size_t Size>\ndouble get() {\n  return value;\n}\n```\n\n`add` 方法更新循环缓冲区并调用过滤器：\n\
  ```cpp\ntemplate<typename ObjectType, size_t Size>\nvoid add(ObjectType, Filter)\
  \ {\n  data.add(filter);\n}\n```\n\n`Filter` 是一个函数指针。每个人中有三个（此处原文可能为误，意指“大多数人”）会使用以下示例，我使用了一个\
  \ Lambda 函数：\n\n```cpp\nstatic void test() {\n  ADC<double, 4> myc(3.0);\n  cout\
  \ << \"ADC=\" << myc.get() << endl;\n  for (int i = 0; i < 10; i++) {\n    myc.add([](double\
  \ current) {\n      return current + 0.5;\n    });\n  }\n}\n```\n\n在桌面上这产生了：\n```\n\
  ADC=3.999\n```\n\n`ADC` 类被替换为：\n```cpp\nclass HardwareModule {\npublic:\n  double\
  \ read();\nprotected:\n};\n\nclass ReadADC {\npublic:\n  ReadADC() : myc(3.0) {}\n\
  \  void run(void) {\n    double sample = hardwareModule.read();\n    myc.add(sample);\n\
  \  }\nprotected:\n  ADC<double, 4> myc;\n  HardwareModule hardwareModule;\n};\n\
  ```JobThread<ReadADC> jobThread;\n```\n\n## 定点算术\n\n每个人中有三个（同上）对分数有困扰。在需要模数转换器的应用中，我需要定点算术（[13]）。定点算术比标量浮点代码快得多（二三倍）。不幸的是，定点算术不是\
  \ C++ 标准的一部分。GCC 编译器提供了支持（[14]）。定点算术的极佳示例请参考 Kurt Gunoth 的实现（[15]）。以下示例是四种算术操作的简单实现。在代码段中\
  \ `lhs` 和 `rhs` 代表算术运算符两侧的参数。带有单个成员 `scale` 的匿名枚举是一种有助于创建模板常量成员的技巧。\n\n```cpp\n\
  template<typename IntType, const int FRACTION_BITS>\nclass FixedPoint\n{\npublic:\n\
  \  typedef FixedPoint<IntType, FRACTION_BITS> T;\n  FixedPoint(){}\n  FixedPoint(double\
  \ d) {v = (IntType)(d*scale);}\n  FixedPoint(const T &rhs) : v(rhs.v) { }\n  T&\
  \ operator=(const T &rhs) {v = rhs.v;return *this;}\n  double toDouble() const {return\
  \ double(v)/scale;}\n  friend T operator+(T lhs, const T &rhs) {T r;r.v = lhs.v\
  \ + rhs.v;return r;}\n  friend T operator-(T lhs, const T &rhs) {T r;r.v = lhs.v\
  \ - rhs.v;return r;}\n  friend T operator*(T lhs, const T &rhs) {\n    T r;\n  \
  \  r.v = (lhs.v * rhs.v) / scale;\n    return r;\n  }\nprivate:\n  IntType v;\n\
  \  enum { scale = 1 << FRACTION_BITS };\n};\n```\n\n\n\n\n\n```cpp\nfriend T operator/(T\
  \ lhs, const T &rhs) {\n    T r;\n    r.v = (lhs.v * scale)/rhs.v;\n    return r;\n\
  }\n\nfriend bool operator==(const T &lhs, const T &rhs) {return lhs.v == rhs.v;}\n\
  \nprotected:\n    int v;\n    enum{scale = 1<<FRACTION_BITS};\n};\n```\n\n一个用法示例：\n\
  \n```cpp\nstatic void FixedPointTest() {\n    typedef FixedPoint<int_fast16_t, 3>\
  \ FixedPoint_3;\n    FixedPoint_3 value(3.43188);\n    value = (2*(value+FixedPoint_3(1.4)-FixedPoint_3(1.4)))/2;\n\
  \    cout << value.toDouble() << endl;\n}\n```\n\n用法示例的输出：\n3.375\n\n我可以通过定点算术模板的实例来扩展上一章中的组合\
  \ `ReadADC`。Lambda 函数看起来像这样：\n\n```cpp\nclass ReadADC {\npublic:\n    ReadADC :\
  \ myAdc(3.0) {}\n    typedef FixedPoint<int_fast16_t, 3> FPADC;\n    void run(void)\
  \ {\n        FPADC sample = FPADC(hardwareModuleADC.read());\n        myAdc.add(sample,\n\
  \            [](FPADC current, FPADC sample) {\n                return current+(sample-current)/2;\n\
  \            });\n    }\nprotected:\n    ADC<FPADC, 4> myAdc;\n    HardwareModuleADC\
  \ hardwareModuleADC;\n};\n```\n\n# 面试题。\n\n智者将继承地球。- 经济学人，2011 年 1 月 20 日\n\n我知道对于你和我来说，编程并不是为了钱。但尽管如此，我的一些亲爱的读者还是必须考虑家庭。程序员是世界上薪水最高的职业之一。\n\
