  }\nuint32_t *fastPoolAllocate()\n{\n    uint32_t blockOffset = fastPoolHead;\n \
  \   if (blockOffset != ALLOCATED_ENTRY)\n    {\n        fastPoolHead = fastPoolGetNext(blockOffset);\n\
  \    }\n    return &fastPoolData[blockOffset];\n}\nvoid fastPoolFree(uint32_t *block)\n\
  {\n    // 源文本中逻辑不完整\n}\n```\n\nQ. 实现 `itoa()` —— 将整数转换为字符串。\n\nA.\n```cpp\nint itoa(int\
  \ value, char *s, int size)\n{\n    int i = 0;\n    int chars = size - 1;\n    int\
  \ digits = 0;\n    int v = value;\n    while (v)\n    {\n        if (i >= chars)\
  \ break;\n        s[digits-1] = '0' + value%10;\n        i++;\n        v = v / 10;\n\
  \    }\n    if (digits-i < 0)\n    {\n        s[digits-1] = 0;\n        return size;\n\
  \    }\n    else\n    {\n        s[chars] = 0;\n        return 0;\n    }\n}\n```\n\
  \n## 位运算技巧\n\nQ. 你有两个数字 M 和 N，以及两个位置 i 和 j。写一个方法将 M 中 i 到 j 之间的位设置为 N。假设 i < j。例如，如果输入\
  \ M=0x00, N=0x10, i=0, j=5，则输出为 0x10。\n\nA. 你需要清除 N 中从 i 到 j 的位，并对 M 和 N 进行位或操作。使用\
  \ `uint32_t` 或类似类型可能是好主意 —— 与面试官讨论。\n\n```cpp\nint mask = ((i<< 1)-1) | ((1 << j)-1);\n\
  M = M & mask;\nM = M | (N << i);\n```\n\nQ. 代码 `((n & (n-1)) == 0)` 表示什么？\n\n如果\
  \ n 为零或为 2 的幂，该条件为真。\n\nQ. 如何找到最高置位？\n\nA. GCC 有一个内置函数 `__builtin_clz()`，它返回参数中导零的数量。另一种解决方案：\n\
  \n```cpp\nunsigned int v;\nunsigned r = 0;\nwhile (v >>= 1) {\n    r++;\n}\n```\n\
  \nQ. 如何无分支地设置或清除位？为什么需要它？\n\nA. 你可以使用如下代码：\n\n```cpp\nbool f;\nunsigned int mask;\n\
  unsigned int w;\nw ^= (-f ^ w) & mask;\n```\n取决于上下文和 CPU，无分支可以提高 5%-10% 的性能。另见 [17]。\n\
  \nQ. 查找整数中的第一个置位。\n\n\n\n\n\n# 位运算\n\nA. 在 GCC 中，我们有一个内置函数 `__builtin_ffs()`。或者，你也可以使用类似下面的软件实现。请讨论涵盖\
  \ `x` 等于零情况的可能返回代码。\n\n```c\nint  findFirst(int x)\n{\n  if (x == 0)\n    return\
  \ 0;\n  int t = 1;\n  int r = 1;\n  while ((x & t) == 0) {\n    t = t << 1;\n  \
  \  r = r + 1;\n  }\n  return r;\n}\n```\n\nQ. 如何清除整数中最低有效位以外的所有位？例如对于 `0x60`（2 位被设置），结果是\
  \ `0x20`（1 位被设置）。\n\nA. 用单行 C 代码即可实现（参见 [18]）：\n\n```c\nx &= -x;\n```\n\n或者，效果相同：\n\
  \n```c\nx &= (~x+1)\n```\n\nQ. 如何检查整数是否为偶数。\n\nA. 偶数的最低有效位为零：\n\n```c\n\n((x & 1)\
  \ == 0)\n```\n\nQ. 如何清除最右侧设置位？\n\nA. 将整数减 1 并与自身进行按位与运算：\n\n```c\nx & (x-1)\n```\n\
  \nQ. 如何设置最右边的零位？\n\nA. 将整数加 1 并与自身进行按位或运算：\n\n```c\nx | (x+1)\n```\n\nQ. 统计整数中的非零位。是否存在无分支解决方案？\n\
  \nA. 清除右位并检查结果是否为零（参见 [19]）：\n\n```c\nint  countBits(int n)\n{\n  int count=0;\n\
  \  while(n) {\n    count++;\n    n = n&(n-1);\n  }\n  return count;\n}\n```\n\n\
  # 热门在线测试\n\n在以下测试中，每个问题后面跟着五个答案。最多三个答案可以是正确的。我不提供正确答案。\n\n### 下列哪些语句描述了用于 C 条件编译的条件？\n\
  \n* 条件必须求值为 0 或 1\n* 条件可以取决于任何“const”变量的值\n* 条件可以使用 `sizeof` 根据标准数据类型的大小对依赖于编译的操作做出决定\n\
  * 条件可以取决于环境变量的值\n\n### 如果将 ANSI C 运算符用于不同类型的操作数，以下哪项正确描述了操作数或结果的类型转换？\n\n* 操作数完全没有发生任何自动转换\n\
  * 此操作将由编译器标记为错误\n* “窄”操作数被转换为“宽”操作数的类型以避免信息丢失\n* 操作数的值被改变以防止“窄”类型中可能的溢出\n* 将结果赋值给“窄”类型可能会丢失信息，但不非法\n\
  \n### 下列外围设备允许嵌入式系统使用双线或三线串行接口与其他设备通信？\n\n* 双向三态缓冲器\n* 地址译码器\n* 通用同步收发器\n* 数字模模拟转换器\n\
  * 非易失性存储器\n\n### 下列哪些语句正确描述了 ANSI C 语言中的函数在嵌入式系统中的？\n\n* 链接的两个不同文件的全局函数名必须是唯一的\n\
  * 函数可以通过值或指针调用\n* 函数不能返回多个值\n* 函数可以接受的最多参数数量为 12\n* 每个函数都必须返回一个值\n\n### 下列哪些语句正确描述了下面的\
  \ ANSI C 代码？\n\n```c\ntypedef  char *pchar;\npchar  funcpchar();\ntypedef  pchar\
  \ (*pfuncpchar)();\npfuncpchar  fpfuncpchar();\n```\n\n* `pfuncpchar` 是一个返回 char\
  \ 指针的函数指针\n* `fpfuncpchar` 是一个返回函数指针的 char 指针\n* `fpfuncpchar` 是一个返回返回 char 指针的函数指针\n\
  * `fpfuncpchar` 是一个返回返回 char 指针的函数指针的函数\n* `funcpchar` 是一个返回 char 指针的函数\n\n### 下列哪些语句正确描述了\
  \ ANSI C 中的按位右移运算符 `>>`？\n\n* 右侧运算符必须大于等于 1\n* 它将其左侧操作数的每个位向右移动，移动数为右侧运算符指定的位数\n\
  * 它可以用于反转数字的符号\n* 对于无符号整数，它会在左侧空出的位填充零\n* 它可以用于将整数除以 2 的幂\n\n### 假设 ANSI C 采用补码表示法，以下哪些语句是正确的\n\
  \n* 表示为带符号整数的负值，如果表示为相同尺寸无符号整数，将表示为大于符号整数最大值的正值\n* 同一整数类型的带符号和无符号变范围在大小和数值最大最小值上是等价的\n\
  * 整数类型的无符号版本范围是带符号版本的两倍\n* 带符号整数的表示多出一个符号位\n\n### 在以下代码中，调用 print 函数可能看起来如下所示\n\n\
  ```c\nvoid process (int (*p)(int, int, char*)) {\n  int a = 5, b = 4;\n  char *c\
  \ = \"aggregate\";\n  /* 为 b,a,c 调用 print */\n  return;\n}\nint main(void) {\n \
  \ process(report);\n}\n```\n\n* `p->report(b,a)`\n* `(*p)(b,a)`\n* `p(b,a)`\n* `(*p)(report,\
  \ b, a)`\n* `report(b,a)`\n\n### 下面代码编译失败的正确修复是：\n\n```c\n/* File A */\nstruct pair\
  \ a[10];\nvoid initialize(int x, int m, int b) {\n  int i;\n  a[0].y = (a[0].x =\
  \ x) * m + b;\n  for (i = 1;i < 10;++i)\n    a[i].y = (a[i-1].x + 1)*m + b;\n}\n\
  /*File B*/\nstruct pair {int x, y;};\nstruct pair *op(int x) {\n  int i;\n  for\
  \ (i = 10; i > 0;--i)\n    if (a[i].x == x)\n      break;\n  return a+1;\n}\n```\n\
  \n* `extern struct pair a[];`\n* 数组 `a` 的声明必须在 `op()` 的定义之前\n* 除非数组 `a` 在所有调用 `op()`\
  \ 的文件中声明为 `extern`，否则返回的指针是的\n* 文件 A 中数组 `a` 的定义缺少 `extern` 关键字\n* 必须在文件 b 中指定数组的大小\n\
  * 两个文件中 `struct pair` 的定义都缺少 `extern` 关键字\n\n### 下列哪些是 ANSI C 中格式正确的 #define 指令？\n\
  \n* `#define DIF(X,Y) (X-Y)`\n* `#define sqr(x) ((x)*(x))`\n* `#define mm_per_meter\
  \ 1000;`\n* `#define SUM(X,Y) ((X)+(Y))`\n* `#define INCHES_FEET 12`\n\n### 执行下面的\
  \ ANSI 代码的输出是什么\n\n```c\nvoid f(void **p);\nint k =2;\nint *pk=&k;\nint main() {\n\
  \  int *p;\n  f(&p);\n  printf(\"%d\\n\", *p);\n  return 0;\n}\nvoid f(void **pp)\
  \ {\n  (*pk)++;\n  *pp = pk;\n}\n```\n\n* 语法错误\n* `pk` 的地址\n* 垃圾值\n* 3\n* 2\n\n\
  ### for 循环完成后，输出数组的内容是什么\n\n```c\nint encode (char, char);\nint main(void) {\n \
  \ char input [7] = {'M', 'E',':','G',':'}, output [7];\n  int i;\n  for (i = 0;i\
  \ < 7;++i) {\n    output[i] = encode(input[i], ':');\n  }\n  return 0;\n}\nint encode(char\
  \ c , char t) {\n  switch(c) {\n    case 'E': c = 'A';break;\n    case 'O': c =\
  \ 'X'; break;\n    case 'A': c = 'T'; break;\n    case 'U': c = 'M'; break;\n  }\n\
  \  if (c >= 'A' && c <= 'Z' || c >= 'a' && c <= 'z' && (c=t))\n    c = '\\0';\n\
  \  return c;\n}\n```\n\n* `\\0`,`0`,`0`,`0`,`0`,`\\0`\n* `M`,`A`,`\\0`,`G`,`O`,`\\\
  0`,`\\0`\n* `M`,`A`,`\\0`,`G`,`X`,`\\0`,`\\0`\n* `\\0`,`0`,:`,`\\0`,`\\0`,:`,`\\\
  0`\n* `:`,`:`,`:`,:::`\\0`\n\n### dump_port() 函数应该输出\n\n```c\n/* I/O 寄存器数量 */\n\
  #define PORT_SIZE 7\ntypedef unsigned int word;\nunion IO_port {\n  word reglist[PORT_SIZE];\n\
  \  struct {\n    word ENABLE ;\n    word DIRECTION;\n    word OPEN_COLLECTOR;\n\
  \    word DATA;\n  } reg;\n};\nstatic union IO_port *GPIO = 0xE0004000; /*端口地址 */\n\
  #include <stdio.h>\nvoid dump_port(union IO_port *p) {\n  int i;\n  for (i = 0;i\
  \ < PORT_SIZE;++i) {\n    printf(\"%X \", p->reglist[i]);\n  }\n}\nint main(void)\
  \ {\n  GPIO->reg.DATA = 0x000000D0;\n  GPIO->reg.OPEN_COLLECTOR = 0x000000F0;\n\
  \  GPIO->reg.DIRECTION = 0xFFFFFF0F;\n  GPIO->reg.ENABLE = 0x000030F0;\n  dump_port(GPIO);\n\
  \ return 0;\n}\n```\n\n* D0 F0 FFFFFF0F 30F0\n\n\n\n\n\n* `D000000` `F000000` `FFFFF0F`\
  \ `F0300000`\n* `FFFFFFF` `F0300000` `20000000` `D0000000`\n* `FFFFFF0F` `30F0`\
  \ `2` `D0`\n\n以下函数返回什么：\n\n```cpp\nunsigned int process(unsigned int x, int p, int\
  \ n)\n{\n return x ^ (~(~0 << n) << p + 1 -n);\n}\n```\n\n* `x` 从位置 `n` 开始的 `p`\
  \ 位\n* `x` 乘以 `2^(p-n)`\n* `x` 的从位置 `p` 开始的 `n` 位置为 1\n* `x` 在位置 `p` 的第 `n` 位\n\
  * `x` 的从位置 `p` 开始的 `n` 位被取反\n\n程序必须在数字输出上产生脉冲宽度调制信号。值 0 由数字输出高电平（HIGH）表示，值 0xFFFF\
  \ 由数字输出低电平（LOW）表示。哪种脉冲信号代表值 `0x7000`？\n\n* 30ms 周期，13.3ms 脉冲宽度\n* 2000Hz，563us 脉冲宽度\n\
  * 100KHz，5.63us 脉冲宽度\n* 100KHz，4.38us 脉冲宽度\n* 20ms，11.25ms 脉冲宽度\n\n以下哪个语句正确描述了下方的\
  \ C++ 代码段？\n\n```cpp\nvoid foo(long l);\nint i =12;\nfoo(i);\n```\n\n* `i` 被提升 `long`\
  \ 以调用函数 `foo`。\n* 函数 `foo` 使用一个值为“12”的 `long` 调用。\n* 编译器实例化了一个接受 `int` 而不是 `long`\
  \ 的新函数。\n* 函数 `foo` 使用一个值为“12”的 `int` 调用。\n* 函数 `foo` 使用一个未定义值的 `long` 调用。\n\n以下代码尝试按组（投诉、表扬、其他）对传入的邮件进行分类。在\
  \ for 循环中使用什么代码？\n\n```cpp\nenum class LetterType {complement, complaint, unknown};\n\
  LetterType getMailType(string letter)\n{\n pair<string, int> happy = make_pair(happyString,\
  \ 0);\n pair<string, int> sad = make_pair(sadString, 0);\n string word;\n string\
  \ fstream ss(letter);\n vector<string> letterWords;\n while (ss >> word) letterWords.push_back(word);\n\
  \ vector<string>::iterator words;\n for (words=letterWords.begin();words<letterWords.end();words++)\n\
  \    {\n      word = *words;\n //...\n    }\n if (happy.second > sad.second) return\
  \ complement;\n else if (happy.second < sad.second) return complaint;\n else return\
  \ unknown;\n}\n```\n\n* `if (happy.find(word)) happy.second++;if (sad.find(word))\
  \ sad.second++;`\n* `if (happy.find(word) != string::npos) happy.second++;if (sad.find(word)\
  \ != string::npos) sad.second++;`\n* `if (happy.first.find(word)) happy.second++;if\
  \ (sad.first.find(word)) sad.second++;`\n* `if (happy.first.find(word) != string::npos)\
  \ happy++;if (sad.first::find(word) != string::npos) sad++;`\n* `if (happy.first.find(word)\
  \ != string::npos) happy.second++;if (sad.first.find(word) != string::npos) sad.second++;`\n\
  \n以下哪些是 C++ 声明的不可更改指针，与声明指向某个不可更改内容的指针相区别？\n\n* `extern double *float;`\n* `extern\
  \ const int *const reference_only;`\n* `extern const std::vector<int> *global_vector;`\n\
  * `extern const void *anything;`\n* `extern float *const some_scalar;`\n\n以下哪些操作是由\
  \ C++ `catch(...)` 语句执行的？\n\n* 捕获默认异常。\n* 忽略异常。\n* 捕获异常，将其传递给程序控制的下一层。\n* 禁用进一步异常的抛出。\n\
  \n以下哪个语句正确描述了编译器生成的构造函数？\n\n* 编译器生成的构造函数创建一个引用。\n* 编译器生成的构造函数调用了赋值操作。\n* 编译器生成的构造函数什么都不做。\n\
  * 编译器生成的构造函数标记该对象。\n* 编译器生成的构造函数是默认的。\n* 编译器生成的构造函数执行对象的拷贝。\n\n在重载一元运算符时，以下哪些语句是正确的？\n\
  \n* 当运算符是成员时，没有参数。\n* 当运算符不是成员时，有一个参数。\n* 当运算符不是成员时，有任意数量的参数。\n* 当运算符是成员时，有一个参数。\n\
  * 当运算符是成员时，没有参数。\n\n在下方的 C++ 代码段中，以下哪些正确描述了 `assert()` 的行为：\n\n```cpp\nint val =\
  \ 5;\nwhile (true)\n\n{\nassert(val);\n}\n```\n\n* 它将值记录到文件中\n* 在调试模式下它确保 `val`\
  \ 为\n* 如果不是，则终止\n* 在调试模式下，它记录 `val`\n* 如果 `val` 为零，则终止。\n\n## 脑筋急转弯\n\nQ. 潜艇位于线上，可以是负数。它每秒以恒速移动。是否有办法确保你击中潜艇？\n\
  \nA. 在 `T` 秒后位置为 `v*T` 或 `(-v)`，其中 `v` 是绝对值。如果数字是正数，你可以对数字减 1 并计算你做了多少循环：`v*T` 或\
  \ `(-v)`。如果 `v=2`，循环次数为 100。如果数字是负数，循环次数为 100。如果数字为零，循环次数为 100。在位置 `T*(T+1)/2` 和\
  \ `(-T/2)` 处命中。\n\nQ. 有一栋 100 层的楼。如果蛋从第 `N` 层或以上掉落它会破碎。如果从任何以下楼掉落则不会破碎。你有 2 块蛋。找到\
  \ `N`，同时最小化掉落次数。\n\nA. 无论如何使用第一只蛋，我们对第二只蛋进行线性搜索。一个完美的系统是第一只蛋掉落次数加上第二只蛋掉落次数总是相同的。例如，如果第一只蛋掉落在\
  \ 20 和 30（破碎），第二只蛋需要 9 步。当我们再次掉落第一只蛋时，我们将第二只蛋的潜在步骤减少到 8。这意味着我们必须在 39 层掉落第一只蛋。因此，第一只蛋从\
  \ `X` 开始，然后增加 `X-1`，`X-2`，……`X+(X-1)+(X-2)+1=100`。`X(X+1)/2=100`，`X=14`。[20]。\n\n\
  Q. 如何仅使用运算符 `+` 取反一个数字？\n\nA. 如果数字是正数，你可以对数字减 1 并计算你做了多少循环：\n\n```cpp\nint negate(int\
  \ x) {\n int result = 0;\n int sign = x < 0 ? 1 : -1;\n while (x != 0) {\n    result\
  \ += sign;\n    x += sign;\n    }\n return result;\n}\n```\n\nQ. 发现以下函数中的错误（如果有的话）：\n\
  \n```cpp\nvoid mistake()\n{\n unsigned int i;\n for (i = 100; i <= 0; --i) {\n printf(\"\
  %d\\n\", i);\n    }\n}\n```\n\nA. `printf` 永远不会执行。`for` 循环是一个死循环。\n\nQ. 一个应用程序在运行时崩溃。它从不在同一个地方崩溃。应用程序是单线程的，并且只使用标准库。哪些编程错误可能导致这种情况？\n\
  \nA. 崩溃由输入引起：用户输入或特定的硬件状态、栈溢出、尝试使用未分配（已释放）的内存。可以记录系统输入。有一些工具（valgrind）可以发现内存泄漏和访问未初始化内存。\n\
  \nQ. 给定生成 0 到 4 之间整数的随机数生成器 `r5`，实现一个随机数生成器 `r7`。\n\n\n\n\n\n两个随机数之和并不是均匀分布的随机数。任何涉及随机生成数字之和的方案都是错误的。在以下代码中，第一次赋值生成了一个五位进制的两位数字——一个在\
  \ 0 到 24 之间的随机数。下一行从随机数序列中移除了 21、22、23、24。该操作的结果是一系列 0 到 20 之间均匀分布的数字。通过对 7 取模完成了完成任务。\n\
  \n```cpp\nint random_7() {\n  while (true) {\n    int ret = 5 * random_5() + random_5();\n\
  \    if (ret < 21)\n      return (ret % 7);\n  }\n}\n```\n\n# 结论\n\n你已经让我们大开眼足了。让其他的年轻姑娘们也有表现的机会吧——简·奥斯汀，《傲慢与偏见》。\n\
