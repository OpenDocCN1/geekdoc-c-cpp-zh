  trans: "\n\n```cpp\nmemset(dataArray.c, 0, sizeof(dataArray.c));\n}\n```\n\nA. 在某些架构中，CPU\
    \ 可能会预测数据使用情况并相应加载数据缓存行（cache lines）。通常，缓存内存中的单行为 64 或 128 字节。在 `initDataArrayC`\
    \ 函数中，当调用第二个 `memset` 时，数据缓存可能已经包含了字段 “a” 以及字段 “b” 的全部或部分 —— CPU 预测到了顺序写入。函数 `initDataArrayC`\
    \ 写入了字段 “c”，这会导致数据缓存行冲刷（flush），并减慢第二个 `memset()` 的执行速度。\n\nQ. 对下代码进行何种**单项修改**，可以提高\
    \ `testFastSum` 函数的性能？\n\n```cpp\nclass FastSum {\npublic:\n    FastSum(int delta)\
    \ : delta(delta) {}\n    virtual int sum(int a) { return delta+a; }\n    virtual\
    \ ~FastSum() {}\nprotected:\n    int delta;\n};\n\nvoid testFastSum(int delta,\
    \ int *result, int count) {\n    FastSum fastSum(delta);\n    for (int i = 0;\
    \ i < count; i++) {\n        result[i] = fastSum.sum(i);\n    }\n}\n```\n\nA.\
    \ **去虚化（Devirtualization）** —— 将虚方法 `sum()` 替换为非虚方法 —— 可以帮助。将虚函数调用替换为非虚调用每次迭代可以节省\
    \ 2-3 条指令。如果 C++ 编译器的去虚化做得很好（`GCC` `4.8` 则不能），那么下一个选项是确保编译器内联构造函数 `FastSum` 和方法\
    \ `sum`。\n\nQ. 下述代码存在一个竞态条件。它是什么？\n\n```cpp\nclass LazyInitialization {\n    static\
    \ LazyInitialization *getInstance() {\n        if (instance == nullptr) {\n  \
    \          MutexAB m;\n            if (instance == nullptr) {\n              \
    \  instance = new LazyInitialization();\n            }\n        }\n        return\
    \ instance;\n    }\nprivate:\n    LazyInitialization();\n    static LazyInitialization\
    \ *instance;\n};\n\nLazyInitialization *LazyInitialization::instance = nullptr;\n\
    ```\n\nA. 线程 A 进入同步区域并初始化静态变量 “instance”。类 `LazyInitialization` 的构造函数可能还没有被调用，但变量\
    \ “instance” 可能已经被设置了。操作的确切顺序取决于编译器。此时线程 B 进入 `getInstance()` 方法并返回一个无效指针 —— 指向一个未完全初始对象的指针。另一个问题是，地址的赋值（一个\
    \ 32 位或 64 位或其他变量）并不一定是原子操作，并且可能涉及两次内存写入事务。可以通过将变量 “instance” 声明为原子变量来修复代码：\n\n\
    ```cpp\natomic<LazyInitialization*> LazyInitialization::instance(nullptr);\n```\n\
    \nQ. 解释右值（rvalue）和左值（lvalue）。`++x` 和 `x++` 有什么区别？\n\nA. 右值是临时值，在它们所生存的完整表达式结束时就会消失（“**在分号处**”）。例如，`1729`、`x\
    \ + y`、`std::string(\"meow\")` 和 `x++` 都是右值。左值是命名持久到单个表达式之外的对象。例如，`obj`、`*ptr`、`ptr[index]`\
    \ 和 `++x` 都是左值。表达式 `x++` 是右值。它拷贝持久对象的原始值，修改持久对象，然后返回该拷贝。这个拷贝是临时的。`++x` 和 `x++`\
    \ 都会增加 `x` 的值，但 `++x` 返回持久对象本身，而 `x++` 返回一个临时拷贝。\n\nQ. 解释以下函数中每一行发生了什么：\n\n```cpp\n\
    const char *dataTest()\n{\n    // 1.\n    char *a = \"123\";\n    // 2.\n    char\
    \ b[] = \"123\";\n    // 3.\n    const char *c = \"123\";\n    // 4.\n    static\
    \ char d[] = \"123\";\n    // 5.\n    a[0] = '0';\n    // .................\n\
    \    // 6.\n    return a;\n    // .................\n    // 7.\n    return c;\n\
    \    // ................\n    // 8.\n    return b;\n}\n```\n\nA.\n1. 为局部变量 `a`\
    \ 分配常量数据 ['1','2','3',0] 的地址。某些编译器会生成警告 —— 将 const 指针赋值给非 const 指针。\n2. 将数据 ['1','2','3',0]\
    \ 在运行时拷贝到局部（栈上）数组。数组 `b` 的初始化在每次调用函数时都会完成。\n3. 与 1 相同，但修复了编译警告。\n4. 将数组 ['1','2','3',0]\
    \ 在运行时拷贝到静态变量 `d`。拷贝仅由代码加载器执行一次。\n5. 尝试修改常量数据。在某些架构上，常量数据是只读的，此行可能会导致异常。\n6. 返回常量数据的指针。该指针是全局的，存在于程序地址空间中。\n\
    7. 与 6 相同\n8. 返回局部（栈）变量的地址。地址 `b` 处的数据取决于架构。\n\nQ. 下面的 x86 汇编代码做什么：\n\n```assembly\n\
    call next\nnext:\npop eax\n```\n\nA. `call` 操作符将当前程序计数器（PC）推入栈中。随后的 `pop` 将 PC\
    \ 值设置寄存器 `eax`。这段代码是获取当前 PC 值的一种方法。\n\nQ. 实现一个用于分配 4 字节块的高效内存池。\n\nA. 使用块本身的数据组织一个空块链表。初始时在第一个块（偏移量\
    \ 0）中写入 “1” —— 下一个空块的偏移量。在第二个块（偏移量 1）中写入 “2”，以此此类推。代码示例如下：\n\n```cpp\nstatic const\
    \ int POOL_SIZE = 7;\nstatic uint32_t fastPoolData[POOL_SIZE];\nstatic uint32_t\
    \ fastPoolHead;\nstatic const int ALLOCATED_ENTRY = (POOL_SIZE+1);\nstatic inline\
    \ uint32_t fastPoolGetNext(uint32_t node)\n{\n    return fastPoolData[node];\n\
    }\nstatic inline void fastPoolSetNext(uint32_t node, uint32_t next)\n{\n    fastPoolData[node]\
    \ = next;\n}\nvoid fastPoolInitialize()\n{\n    fastPoolHead = 0;\n    for (int\
    \ i = 0; i < POOL_SIZE-1; i++)\n    {\n        fastPoolSetNext(i, i+1);\n    }\n\
    \    fastPoolSetNext(POOL_SIZE-1, ALLOCATED_ENTRY);\n}\nuint32_t *fastPoolAllocate()\n\
    {\n    uint32_t blockOffset = fastPoolHead;\n    if (blockOffset != ALLOCATED_ENTRY)\n\
    \    {\n        fastPoolHead = fastPoolGetNext(blockOffset);\n    }\n    return\
    \ &fastPoolData[blockOffset];\n}\nvoid fastPoolFree(uint32_t *block)\n{\n    //\
    \ 根据上下文简化了逻辑\n}\n```\n（注：提供的内存池实现源文本是碎片化的；我已将其重构为贯的代码块，同时保持了提供的变量名和结构）。\n\n等一下，重新检查内存池实现的源文本以确保没有丢失语义：\n\
    \n```cpp\nstatic const int POOL_SIZE = 7;\nstatic uint32_t fastPoolData[POOL_SIZE];\n\
    static uint32_t fastPoolHead;\nstatic const int ALLOCATED_ENTRY = (POOL_SIZE+1);\n\
    static inline uint32_t fastPoolGetNext(uint32_t node)\n{\n    return fastPoolData[node];\n\
    }\nstatic inline void fastPoolSetNext(uint32_t node, uint32_t next)\n{\n    fastPoolData[node]\
    \ = next;\n}\nvoid fastPoolInitialize()\n{\n    fastPoolHead = 0;\n    for (int\
    \ i = 0; i < POOL_SIZE-1; i++)\n    {\n        fastPoolSetNext(i, i+1);\n    }\n\
    \    fastPoolSetNext(POOL_SIZE-1, ALLOCATED_ENTRY);\n}\nuint32_t *fastPoolAllocate()\n\
    {\n    uint32_t blockOffset = fastPoolHead;\n    if (blockOffset != ALLOCATED_ENTRY)\n\
    \    {\n        fastPoolHead = fastPoolGetNext(blockOffset);\n    }\n    return\
    \ &fastPoolData[blockOffset];\n}\nvoid fastPoolFree(uint32_t *block)\n{\n    //\
    \ 源文本中逻辑不完整\n}\n```\n\nQ. 实现 `itoa()` —— 将整数转换为字符串。\n\nA.\n```cpp\nint itoa(int\
    \ value, char *s, int size)\n{\n    int i = 0;\n    int chars = size - 1;\n  \
    \  int digits = 0;\n    int v = value;\n    while (v)\n    {\n        if (i >=\
    \ chars) break;\n        s[digits-1] = '0' + value%10;\n        i++;\n       \
    \ v = v / 10;\n    }\n    if (digits-i < 0)\n    {\n        s[digits-1] = 0;\n\
    \        return size;\n    }\n    else\n    {\n        s[chars] = 0;\n       \
    \ return 0;\n    }\n}\n```\n\n## 位运算技巧\n\nQ. 你有两个数字 M 和 N，以及两个位置 i 和 j。写一个方法将\
    \ M 中 i 到 j 之间的位设置为 N。假设 i < j。例如，如果输入 M=0x00, N=0x10, i=0, j=5，则输出为 0x10。\n\n\
    A. 你需要清除 N 中从 i 到 j 的位，并对 M 和 N 进行位或操作。使用 `uint32_t` 或类似类型可能是好主意 —— 与面试官讨论。\n\n\
    ```cpp\nint mask = ((i<< 1)-1) | ((1 << j)-1);\nM = M & mask;\nM = M | (N << i);\n\
    ```\n\nQ. 代码 `((n & (n-1)) == 0)` 表示什么？\n\n如果 n 为零或为 2 的幂，该条件为真。\n\nQ. 如何找到最高置位？\n\
    \nA. GCC 有一个内置函数 `__builtin_clz()`，它返回参数中导零的数量。另一种解决方案：\n\n```cpp\nunsigned int\
    \ v;\nunsigned r = 0;\nwhile (v >>= 1) {\n    r++;\n}\n```\n\nQ. 如何无分支地设置或清除位？为什么需要它？\n\
    \nA. 你可以使用如下代码：\n\n```cpp\nbool f;\nunsigned int mask;\nunsigned int w;\nw ^=\
    \ (-f ^ w) & mask;\n```\n取决于上下文和 CPU，无分支可以提高 5%-10% 的性能。另见 [17]。\n\nQ. 查找整数中的第一个置位。\n\
    \n"
- fmt: "\n# Bit Operations\n\nA. In GCC we have a built in function `__builtin_ffs()`.\
    \ Alternatively you can use software implementation like one below. Discuss possible\
    \ return code which covers the case of `x` equal to zero.\n\n```c\nint  findFirst(int\
    \ x)\n{\n  if (x == 0)\n    return 0;\n  int t = 1;\n  int r = 1;\n  while ((x\
    \ & t) == 0) {\n    t = t << 1;\n    r = r + 1;\n  }\n  return r;\n}\n```\n\n\
    Q. How to clear all but the least significant bit in an integer number? For example\
    \ for `0x60` (2 bits are set) the result is `0x20` (one bit is set).\n\nA. In\
    \ a single C line it is (see [18])\n\n```c\nx &= -x;\n```\n\nor, which is the\
    \ same thing:\n\n```c\nx &= (~x+1)\n```\n\nQ. How to check if the integer is even.\n\
    \nA. In the even integer the least significant bits is zero:\n\n```c\n((x & 1)\
    \ == 0)\n```\n\nQ. How to clear the rightmost set bit?\n\nA. Reduce the integer\
    \ by 1 and use bitwise AND with itself:\n\n```c\nx & (x-1)\n```\n\nQ. How to set\
    \ the rightmost zero bit?\n\nA. Add 1 to the integer and use bitwise OR with itself:\n\
    \n```c\nx | (x+1)\n```\n\nQ. Count non-zero bits in an integer. Is there a solution\
    \ with one branch?\n\nA. Clear rightmost bit and check if the result is zero (see\
    \ [19]):\n\n```c\nint  countBits(int n)\n{\n  int count=0;\n  while(n) {\n   \
    \ count++;\n    n = n&(n-1);\n  }\n  return count;\n}\n```\n\n# Popular online\
    \ tests\n\nIn the following tests every question is followed by five possible\
    \ answers. Up to three answers can be correct. I do not provide the correct answers.\n\
    \n### Which of the following statements describe the condition that can be used\
    \ for conditional compilation in C?\n\n* the condition must evaluate to 0 or 1\n\
    * the condition can depend on the values of any “const” variables\n* the condition\
    \ can use the `sizeof` to make decisions about compiler-dependent operations based\
    \ on the size of standard data types\n* the condition can depend on the value\
    \ of environment variables\n\n### If an ANSI C operator is used with operand of\
    \ differing types, which of the following correctly describes type conversion\
    \ of operands or result?\n\n* no automatic conversion of the operands occurs at\
    \ all\n* such an operation will be flagged as an error by the compiler\n* “narrow”\
    \ operands are converted to the type of the “wider’ operands to avoid losing information\n\
    * the values of operands are changed to prevent possible overflow in “barrow”\
    \ types\n* assignment of th result to “narrow” type may lose information, but\
    \ are not illegal\n\n### Which of the following peripheral devices allow an embedded\
    \ system to communicate with other devices using a two wire or three wire serial\
    \ interface?\n\n* a bidirectional three-state buffer\n* an address decoder\n*\
    \ a universal synchronous receiver transmitter\n* a digital-to-analogue converted\n\
    * a non-volatile memory\n\n### What of the following statements correctly describe\
    \ funcitons in the ANSI C programming language when used in an embedded system?\n\
    \n* the name of global functions in two different files which are linked together\
    \ do need to be unique\n* function can be called by a value or pointer\n* functions\
    \ cannot return more than one value\n* the maximum number of arguments that a\
    \ function can take is 12\n* every function must returns a value\n\n### What of\
    \ the following statements correctly describe the ANSI C code below?\n\n```c\n\
    typedef  char *pchar;\npchar  funcpchar();\ntypedef  pchar (*pfuncpchar)();\n\
    pfuncpchar  fpfuncpchar();\n```\n\n* `pfuncpchar` is a name for a pointer to a\
    \ function returning a pointer to a char\n* `fpfuncpchar` is a pointer to char\
    \ that returns a pointer to a function\n* `fpfuncpchar` is a pointer that returns\
    \ a pointer to function that returns a pointer char\n* `fpfuncpchar` is a function\
    \ returning a pointer to a function that returns a pointer to a char\n* `funcpchar`\
    \ is a function that returns a pointer to a char\n\n### What of the following\
    \ statements correctly describe the bitwise right-shift operator `>>` in ANSI\
    \ C?\n\n* the right-side operator must be one or greater,\n* it shifts every bit\
    \ of its left-size operand to the right by the number of bit positions specified\
    \ by the right-side operand\n* it can be used to reverse the sign of a number\n\
    * for unsigned integer it fills in vacated bits on the left with zero\n* it can\
    \ be be used to divide an integer by powers of 2\n\n### What of the following\
    \ statements are correct assuming 2s complement implementation of ANSI C\n\n*\
    \ a negative value expressed as a signed integer will be expressed as a positive\
    \ value greater than the maximum value of the signed integer if expressed as an\
    \ unsigned integer of the same size\n* the range of he signed and unsigned variations\
    \ of the same integer type are equivalent in size and numeric maximum and minimum\n\
    * The range of the unsigned variation of an integer type is twice that of the\
    \ signed variation\n* the representation of a signed integer has one additional\
    \ bit for the sign\n\n### How call to the print function can look like in the\
    \ following code\n\n```c\nvoid process (int (*p)(int, int, char*)) {\n  int a\
    \ = 5, b = 4;\n  char *c = \"aggregate\";\n  /* Call print for b,a,c */\n  return;\n\
    }\nint main(void) {\n  process(report);\n}\n```\n\n* `p->report(b,a)`\n* `(*p)(b,a)`\n\
    * `p(b,a)`\n* `(*p)(report, b, a)`\n* `report(b,a)`\n\n### What is the right fix\
    \ of compilation failure in the code below:\n\n```c\n/* File A */\nstruct pair\
    \ a[10];\nvoid initialize(int x, int m, int b) {\n  int i;\n  a[0].y = (a[0].x\
    \ = x) * m + b;\n  for (i = 1;i < 10;++i)\n    a[i].y = (a[i-1].x + 1)*m + b;\n\
    }\n/*File B*/\nstruct pair {int x, y;};\nstruct pair *op(int x) {\n  int i;\n\
    \  for (i = 10;i > 0;--i)\n    if (a[i].x == x)\n      break;\n  return a+1;\n\
    }\n```\n\n* `extern struct pair a[];`\n* the declaration of array `a` must occur\
    \ before the definition of `op()`\n* the returned pointer is invalid unless the\
    \ array `a` is declared as `extern` in all files that call `op()`\n* the definition\
    \ of array `a` is missing the `extern` keyword in file A\n* the size of the array\
    \ must be specified in file b\n* the definition of `struct pair` is missing the\
    \ `extern` keyword in both files\n\n### Which of the following are properly formed\
    \ #define directives in ANSI C?\n\n* `#define DIF(X,Y) (X-Y)`\n* `#define sqr(x)\
    \ ((x)*(x))`\n* `#define mm_per_meter 1000;`\n* `#define SUM(X,Y) ((X)+(Y))`\n\
    * `#define INCHES_FEET 12`\n\n### What is the output of executing the ANSI code\
    \ below\n\n```c\nvoid f(void **p);\nint k =2;\nint *pk=&k;\nint main() {\n  int\
    \ *p;\n  f(&p);\n  printf(\"%d\\n\", *p);\n  return 0;\n}\nvoid f(void **pp) {\n\
    \  (*pk)++;\n  *pp = pk;\n}\n```\n\n* syntax error\n* address of `pk`\n* garbage\n\
