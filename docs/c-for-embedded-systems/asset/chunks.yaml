    \ LockDummy, Size> pool;\n\n ObjectType  objects[Size];\n\n};\n\nThe stack keeps\
    \ reference to the free (not allocated) objects. The pool constructor fills the\
    \ stack of objects:\n\ntemplate<typename  Lock, typename  ObjectType, size_t \
    \ Size>\n\nMemoryPool<Lock, ObjectType, Size>::MemoryPool() {\n\n for (int i =\
    \ 0;i < Size;i++) {\n\n pool.push(&objects[i]);\n\n    }\n\n}\n\nAllocate and\
    \ free methods call the stack pop and push API:\n\ntemplate<typename  Lock, typename\
    \  ObjectType, size_t  Size>\n\nbool  MemoryPool<Lock, ObjectType, Size>::allocate(ObjectType\
    \ **obj) {\n\n bool res;\n\n Lock lock;\n\nres = pool.pop(obj);\n\n return res;\n\
    \n}\n\ntemplate<typename  Lock, typename  ObjectType, size_t  Size>\n\nbool  MemoryPool<Lock,\
    \ ObjectType, Size>::free(ObjectType *obj) {\n\n bool res;\n\n Lock lock;\n\n\
    res = pool.push(obj);\n\n return res;\n\n}\n\nA JobThread implements a “start”\
    \ API and a static method with loop forever. More realistic implementations would\
    \ add “wait for completion”, some mechanism for asynchronous notifications of\
    \ the calling context that the job is done, support for arguments for the job\
    \ function.\n\ntemplate <typename  JobType> class  JobThread {\n\npublic:\n\n\
    \ JobThread();\n\n void  start(JobType *job);\n\nprotected:\n\n JobType *job;\n\
    \n xTaskHandle  pxCreatedTask;\n\n xQueueHandle  signal;\n\n static  void  mainLoop(JobThread\
    \ *jobThread);\n\n};\n\nJobThread constructor creates a binary semaphore and spawns\
    \ (this specific choice of verb is based on “taskSpawn” which is a create task\
    \ API in vxWorks) a new thread. I am assuming FreeRTOS API in this example, but\
    \ any other API would work here:\n\ntemplate<typename  JobType>\n\nJobThread<JobType>::JobThread()\
    \ : job(nullptr) {\n\n static  const  char *name = \"a job\";\n\n    vSemaphoreCreateBinary(this->signal);\n\
    \n    portBASE_TYPE res = xTaskCreate((pdTASK_CODE)mainLoop, (const  signed  char\
    \ *)name, 300, this, 1, &this->pxCreatedTask);\n\n if (res != pdPASS) {\n\ncout\
    \ << \"Failed to create a task\" << endl;\n\n    }\n\n}\n\nThe thread entry, the\
    \ mainLoop method, enters the while loop and waits for the binary semaphore. In\
    \ the real code I would probably test an object variable “bool exitFlag” instead\
    \ of the condition which is always true:\n\ntemplate<typename  JobType>\n\nvoid\
    \  JobThread<JobType>::mainLoop(JobThread *jobThread) {\n\n while (true) {\n\n\
            xSemaphoreTake(jobThread->signal, portMAX_DELAY);\n\n if (jobThread->job\
    \ != nullptr) {\n\n            jobThread->job->run();\n\n        }\n\n       \
    \ jobThread->job = nullptr;\n\n    }\n\n}\n\nMethod “start” sets the job pointer\
    \ and wakes up the mainLoop:\n\ntemplate<typename  JobType>\n\nvoid  JobThread<JobType>::start(JobType\
    \ *job) {\n\n this->job = job;\n\n    xSemaphoreGive(this->signal);\n\n}\n\nIn\
    \ the example below the code prints “Print job is running”:\n\nstruct  PrintJob\
    \ {\n\n void  run(void) {\n\ncout << \"Print job is running\" << endl;\n\n   \
    \ }\n\n};\n\nMemoryPool<LockDummy, JobThread<PrintJob>, 3> jobThreads;\n\nPrintJob\
    \ printJob;\n\nint  main( void )\n\n{\n\n JobThread<PrintJob> *jobThread;\n\n\
        jobThreads.allocate(&jobThread);\n\n    jobThread->start(&printJob);\n\n   \
    \ vTaskStartScheduler();\n\n return 1;\n\n}\n\n## Non static member.\n\n\"C makes\
    \ it easy to shoot yourself in the foot; C++ makes it harder, but when you do\
    \ it blows your whole leg.\n\nI am modifying only two lines in the code above.\
    \ The call to xTaskCreate gets a pointer to a member function. The C++ compiler\
    \ warns about converting of the address of the method to a generic pointer:\n\n\
    void *pMainLoop = (void*)&JobThread<JobType>::mainLoop;\n\nportBASE_TYPE res =\
    \ xTaskCreate((pdTASK_CODE)pMainLoop, (const  signed  char *)name, 300, this,\
    \ 1, &this->pxCreatedTask);\n\nMain loop method is not a static method anymore\
    \ and does not need any argument:\n\ntemplate<typename  JobType>\n\nvoid  JobThread<JobType>::mainLoop()\
    \ {\n\n while (true) {\n\n        xSemaphoreTake(signal, portMAX_DELAY);\n\n if\
    \ (job != nullptr) {\n\n job->run();\n\n        }\n\n job = nullptr;\n\n    }\n\
    \n}\n\nThe trick works because most (all?) C++ compilers push “this”, a pointer\
    \ to the object, first to the arguments stack. The trick can fail if C and C++\
    \ code use stack frames differently. Pointers to virtual methods can fail too.\
    \ This is always possible to use brute force – disassembly, and figure out how\
    \ to call the member function correctly. The implementation of the calls to virtual\
    \ functions differ widely between compilers. Most C++ compilers replace the call\
    \ to a virtual member with a small chunk of assembly code which calculates the\
    \ method address."
