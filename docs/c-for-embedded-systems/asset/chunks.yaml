    \n# Software primitives.\n\n## Mutual exclusion\n\nIn the multi-task environment,\
    \ threads and interrupts can concurrently read and write data objects. I can use\
    \ different tools to synchronize access to the data between different contexts\
    \ and create thread safe APIs. Among the available tools are semaphores and mutual\
    \ exclusion APIs provided by operating systems, as well as disabling all interrupts,\
    \ disabling some interrupts, disabling the operating system scheduler, and using\
    \ spin locks. When I write a wrapper around an API provided by my real-time operating\
    \ system or by the hardware, I want the wrapper to be as thin as possible. Usually,\
    \ I measure the overhead of the wrapper using a number of assembly instructions.\
    \ The number of instructions provides a good approximation of the CPU cycles or\
    \ execution time.\n\n```cpp\nclass LockDummy {\npublic:\n    LockDummy() {\n \
