  trans: "\n\n当我在中断中调用系统日志时，我需要禁用中断。对于任务级的系统日志，一个互斥锁（mutex）可能足够了。具有相似性能的 C 语言方案需要一个宏。\n\
    \n## 软件定时器。\n\nC++：难以学习，且注生如此。\n\n到目前为止，我演示了一些相当简单的软件组件，例如 `mutex` 或 `cyclic buffer`（环形缓冲区）。在本章中，我将实现一个软件定时器。\n\
    \n现代操作系统提供了定时器 API。通常，应用程序可以启动一个任意过期时间的定时器。当定时器过期时，操作系统会从专用定时器线程或系统中断调用应用程序钩子。如果应用程序启动了许多不同的定时器，此类\
    \ API 的性能可能会下降。通常无法控制处理定时器的进程优先级。这里介绍的 API 允许应用程序在单个上下文或具有不同优先级的多个上下文中处理所有与定时器相关的代码。\n\
    \n软件定时器 API 将具有 `O(1)` 复杂度。该 API 将是线程安全的。软件定时器的源代码可以在 `[9]` 中找到。\n\n你已经熟悉面向对象的设计流程了。让我们先声明一个定时器对象。定时器对象保留一个唯一的定时器标识。\n\
    \n唯一的定时器标识可以用于解决 `stopTimer` 和 `timerExpired` 之间可能的竞态条件。考虑以下场景：定时器“a”由上下文 A 启动。定时器“a”被上下文\
    \ A 停止，但太晚了——定时器“a”刚刚过期，处理过期的应用程序代码正在运行。根据应用程序回调的实现，事件处理可以异步进行。与此同时，同一个定时器对象被另一个线程\
    \ B 分配并修改。如果上下文 A 保留了所有启动定时器的标识，应用程序回调可以检查定时器标识是否在运行中的定时器列表中。如果定时器已停止，回调可以忽略定时器过期。使用定时器对象本身的引用进行此类账目记录不是好的，因为定时器对象池可能是一个共享资源。\n\
    \n在启动定时器时，用户可以提供一个可选的应用程序数据指针，即 cookie。定时器类可以像所示的模板：\n\n```cpp\ntemplate<typename\
    \  CookieType> class  Timer {\nprotected:\n    CookieType  cookie;\n};\n```\n\n\
    我想简化接口并避免在定时器对象中使用虚方法——稍后会详细讨论虚方法。定时器对象将保留一个指向应用程序数据的指针，而不是任意类型的对象。\n\n用户只能通过公共方法（getters\
    \ 和 setters）访问定时器数据。这种方法有助于未来的代码维护。\n\n`Timer` 类实现了一个不带参数的构造函数。我希望能够在不引入太多麻烦的情况下创建定时器的静态数组。`TimerList`\
    \ 类（尚未声明）是 `Timer` 类的友元类，可以调用 `Timer` 的受保护方法。`start()` 方法是受保护的，因为应用程序应该使用 `TimerList`\
    \ 方法启动定时器。\n\n```cpp\nclass  Timer {\npublic:\n    Timer();\n    inline  void\
    \  stop();\n    bool  isRunning() const;\n    TimerID  getId() const;\n    inline\
    \  uintptr_t  getApplicationData() const;\n    SystemTime  getStartTime() const;\n\
    protected:\n    friend  class  TimerList;\n    TimerID  id;\n    uintptr_t  applicationData;\n\
    \    bool  running;\n    SystemTime  startTime;\n    inline  void  start();\n\
    \    inline  void  setApplicationData(uintptr_t applicationData);\n    inline\
    \  void  setId(TimerID id);\n    inline  void  setStartTime(SystemTime systemTime);\n\
    };\n```\n\n方法的实现非常直观：\n\n```cpp\nTimer::Timer() {\n    stop();\n}\n\nTimerID \
    \ Timer::getId() const {\n    return  id;\n}\n\nSystemTime  Timer::getStartTime()\
    \ const {\n    return  startTime;\n}\n\nbool  Timer::isRunning() const {\n   \
    \ return  running;\n}\n\nvoid  Timer::stop() {\n    running = false;\n}\n\nvoid\
    \ Timer::start() {\n    running = true;\n}\n\nvoid  Timer::setApplicationData(uintptr_t\
    \ applicationData) {\n    this->applicationData = applicationData;\n}\n\nuintptr_t\
    \  Timer::getApplicationData() const {\n    return  applicationData;\n}\n\nvoid\
    \  Timer::setId(TimerID id) {\n    this->id = id;\n}\n\nvoid  Timer::setStartTime(SystemTime\
    \ systemTime) {\n    this->startTime = systemTime;\n}\n```\n\n系统时间通常是由中断增加的 tick\
    \ 或从硬件读取读取的。在这个示例中，我使用了 `size_t` 类型。在更高级的设计中，`System Time` 类型和 `Timeout` 类型可以是两个类。定时器\
    \ API 只需要一个签名为 `bool isTimerExpired(SystemTime, Timeout, SystemTime)` 的函数。在下面的实现中，我处理了\
    \ `SystemTime` 溢出，假设定时器的超时时间相对于 `SystemTime` 的最大值是非常小的。\n\n```cpp\ntypedef  size_t\
    \  SystemTime;\ntypedef  size_t  Timeout;\n\nstatic  inline  bool  isTimerExpired(SystemTime\
    \ startTime, Timeout timeout,\n    SystemTime currentTime) {\n    bool timerExpired\
    \ = false;\n    SystemTime timerExpiartionTime = startTime + timeout;\n\n    timerExpired\
    \ = timerExpired\n                || ((timerExpiartionTime >= currentTime)\n \
    \                   && (startTime < currentTime));\n\n    timerExpired = timerExpired\n\
    \                || ((timerExpiartionTime >= currentTime)\n                  \
    \  && (startTime > currentTime));\n\n    timerExpired = timerExpired\n       \
    \         || ((timerExpiartionTime <= currentTime)\n                    && (startTime\
    \ > currentTime)\n                    && (timerExpiartionTime < startTime));\n\
    \    return timerExpired;\n}\n```\n\n我的 API 拥有一个 C++11 类型的可能返回码枚举。C++11 `enum\
    \ class` 不是整数，不能转换为整数。一个枚举的成员不能赋值给另一个枚举的成员。\n\n```cpp\nenum  class TimerError\
    \ {\n    Ok, Stopped, Illegal, FreeTimer, NoRunningTimers\n};\n```\n\n我需要一个处理定时器过期的应用程序回调。在更高级的设计中，回调可以是模板函数：\n\
    \n```cpp\ntypedef  void (*ExpirationHandler)(const  Timer& timer);\n```\n\n我将通过构造函数的参数提供一个同步\
    \ API。在基类 `TimerLock` 中，我将 get/release 接口设置为零。锁 API 将由派生类实现。虚函数的典型性能开销是 1 或 2\
    \ 个操作码。\n\n```cpp\nclass  TimerLock {\npublic:\n    virtual  void  get() = 0;\n\
    \    virtual  void  release() = 0;\nprotected:\n    virtual  ~TimerLock() {}\n\
    };\n\nclass  TimerLockDummy : public  TimerLock {\npublic:\n    virtual  void\
    \  get() {}\n    virtual  void  release() {}\nprotected:\n};\n```\n\n我需要一个通过 `operator[]`\
    \ 使用堆动态分配的环形缓冲区。在之前的章节中，我讨论了 `operator[]` 以及无法从内存堆进行分配的情况。\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock>\nclass  CyclicBufferDynamic {\npublic:\n    inline\
    \  CyclicBufferDynamic(size_t size);\n    ~CyclicBufferDynamic() {\n    }\n  \
    \  inline  bool  isEmpty();\n    inline  bool  isFull();\n    inline  bool  add(ObjectType\
    \ object);\n    inline  bool  remove(ObjectType *object);\n    inline  bool  getHead(ObjectType\
    \ *object);\nprivate:\n    void  errorOverflow() {\n    }\n    void  errorUnderflow()\
    \ {\n    }\n    size_t  increment(size_t index);\n    ObjectType *data;\n    size_t\
    \  head;\n    size_t  tail;\n    size_t  size;\n};\n```\n\n构造函数调用 `operator[]`\
    \ 来配配指针数组。有一个 `static_assert` 确保模板类仅用于指针：\n\n```cpp\ntemplate<typename  ObjectType,\
    \ typename  Lock>\ninline  CyclicBufferDynamic<ObjectType, Lock>::\nCyclicBufferDynamic(size_t\
    \ size) {\n    this->head = 0;\n    this->tail = 0;\n    this->size = size;\n\
    \    this->data = new  ObjectType[size];\n    static_assert(sizeof(ObjectType)\
    \ <= sizeof(uintptr_t), \"CyclicBuffer is intended to work only with integer types\
    \ or pointers\");\n}\n```\n\n其余代码与之前的实现相似：\n\n"
- fmt: "\n```cpp\ntemplate<typename ObjectType, typename Lock>\ninline bool CyclicBufferDynamic<ObjectType,\
    \ Lock>::isEmpty() {\n  bool res = (this->head == this->tail);\n  return res;\n\
    }\n\ntemplate<typename ObjectType, typename Lock>\ninline bool CyclicBufferDynamic<ObjectType,\
    \ Lock>::isFull() {\n  size_t tail = increment(this->tail);\n  bool res = (this->head\
    \ == tail);\n  return res;\n}\n\ntemplate<typename ObjectType, typename Lock>\n\
    inline bool CyclicBufferDynamic<ObjectType, Lock>::add(ObjectType object) {\n\
    \  Lock lock;\n  if (!isFull()) {\n    data[this->tail] = object;\n    this->tail\
    \ = increment(this->tail);\n    return true;\n  } else {\n    errorOverflow();\n\
    \    return false;\n  }\n}\n\ntemplate<typename ObjectType, typename Lock>\ninline\
    \ bool CyclicBufferDynamic<ObjectType, Lock>::remove(ObjectType *object) {\n \
    \ Lock lock;\n  if (!isEmpty()) {\n    *object = data[this->head];\n    this->head\
    \ = this->increment(this->head);\n    return true;\n  } else {\n    errorUnderflow();\n\
    \    return false;\n  }\n}\n\ntemplate<typename ObjectType, typename Lock>\ninline\
    \ bool CyclicBufferDynamic<ObjectType, Lock>::getHead(ObjectType *object) {\n\
    \  Lock lock;\n  if (!isEmpty()) {\n    *object = data[this->head];\n    return\
    \ true;\n  } else {\n    errorUnderflow();\n    return false;\n  }\n}\n\ntemplate<typename\
    \ ObjectType, typename Lock>\nsize_t CyclicBufferDynamic<ObjectType, Lock>::increment(size_t\
    \ index) {\n  if (index < this->size) {\n    return (index + 1);\n  } else {\n\
    \    return 0;\n  }\n}\n```\n\nUse of `LockDummy` is deliberate here. I do not\
    \ need the ring buffers storing pointers to objects of the class `Timer` to be\
    \ reentrant:\n\n`typedef CyclicBufferDynamic<Timer*, LockDummy> TimerCyclicBuffer;`\n\
    \nA list of timers keeps timers with the same timeout. The timers expiration time\
    \ depends on the start time. The timer API assumes that there are finite and relatively\
    \ small number of different timers, timers with different timeout, in the system.\
    \ Often I know what timers I need in the system before I start to write the code.\
    \ The `TimerList` is an example of “object composition” – I compose simple objects,\
    \ such as `FIFOs`, into a more complex one. Instead of a ring buffer I could use\
    \ a memory pool for the list of free timers `freeTimers`.\n\n```cpp\nclass TimerList\
    \ {\npublic:\n  TimerList(size_t size, Timeout timeout,\n    TimerExpirationHandler\
    \ expirationHandler,\n    TimerLock &timerLock,\n    bool callExpiredForStoppedTimers=false)\
    \ :\n    timeout(timeout),\n    expirationHandler(expirationHandler),\n    callExpiredForStoppedTimers(callExpiredForStoppedTimers),\n\
    \    freeTimers(size),\n    runningTimers(size),\n    timerLock(timerLock) {\n\
    \    Timer *timers = new Timer[size];\n    for (size_t i = 0; i < size; i++) {\n\
    \      freeTimers.add(&timers[i]);\n    }\n  }\n  TimerError processExpiredTimers(SystemTime\
    \ currentTime);\n  TimerError startTimer(SystemTime currentTime, SystemTime &nearestExpirationTime,\
    \ uintptr_t applicationData = 0, const Timer **timer = nullptr);\n  inline TimerError\
    \ stopTimer(Timer &timer) {\n    timer.stop();\n    return TimerError::Ok;\n \
    \ }\n  SystemTime getNearestExpirationTime() {\n    return nearestExpirationTime;\n\
    \  }\nprotected:\n  inline static TimerID getNextId();\n  TimerError _startTimer(SystemTime\
    \ currentTime, SystemTime &nearestExpirationTime, uintptr_t applicationData =\
    \ 0, const Timer **timer = nullptr);\n  TimerError _processExpiredTimers(SystemTime\
    \ currentTime);\n  Timeout timeout;\n  TimerExpirationHandler expirationHandler;\n\
    \  bool callExpiredForStoppedTimers;\n  SystemTime nearestExpirationTime;\n  CyclicBufferDynamic<Timer*,\
    \ LockDummy> freeTimers;\n  CyclicBufferDynamic<Timer*, LockDummy> runningTimers;\n\
    \  TimerLock &timerLock;\n};\n```\n\nProtected methods of `TimerList` are not\
    \ thread safe. For example `getNextId()` is not thread safe. Only a child class\
