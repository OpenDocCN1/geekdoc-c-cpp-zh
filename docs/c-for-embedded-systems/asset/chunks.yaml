  trans: "\n# PIO 配置指南\n\n将引脚配置为输出的函数：\n\n```cpp\nstatic void enableOutput(PIO_NAME\
    \ name, int pin, int value) {\n  PIO *pio = &pios[name];\n  uint32_t mask = 1\
    \ << pin;\n  if (value) {\n    pio->PIO_SODR = mask;\n  }\n  else {\n    pio->PIO_CODR\
    \ = mask;\n  }\n  pio->PIO_PER = mask;\n  pio->PIO_OER = mask;\n}\n```\n\n驱动 PIO\
    \ A 引脚 2 置高函数可能如下所示：\n\n```cpp\nstatic void main() {\n  enableOutput(PIO_A, 2,\
    \ 1);\n}\n```\n\n### Intel 汇编\n这是 Intel 相关的汇编代码——正如预期的，有三个 32 位的移动：\n\n```assembly\n\
    PIO *pio = &pios[name];\nuint32_t mask = 1 << pin;\nif (value) {\n  pio->PIO_SODR\
    \ = mask;\n4007e0:             c7 05 e6 19 20 00 04             movl  $0x4,0x2019e6(%rip)\n\
    4007e7:             00 00 00\n4007ea:31 c0                             xor %eax,%eax\n\
    \  pio->PIO_SODR = mask;\n}\nelse {\n  pio->PIO_CODR = mask;\n}\npio->PIO_PER\
    \ = mask;\n4007ec:             c7 05 aa 19 20 00 04             movl  $0x4,0x2019aa(%rip)\n\
    4007f3:             00 00 00\npio->PIO_OER = mask;\n4007f6:             c7 05\
    \ b0 19 20 00 04             movl  $0x4,0x2019b0(%rip)\n4007fd:             00\
    \ 00 00\n```\n\n### ARM 汇编\n为 ARM 生成的汇编代码稍长。在 ARM 中，存储值之前应将地址加载到寄存器中。\n\n```assembly\n\
    PIO *pio = &pios[name];\nuint32_t mask = 1 << pin;\nif (value) {\n  pio->PIO_SODR\
    \ = mask;\n8650:             e59f3014               ldr             r3, [pc, #20]\n\
    8654:             e3a02004               mov             r2, #4\n8658:       \
    \      e5832090               str             r2, [r3, #144]\n865c:          \
    \   e3a00000               mov             r0, #0\n  pio->PIO_SODR = mask;\n}\n\
    else {\n  pio->PIO_CODR = mask;\n}\npio->PIO_PER = mask;\n8660:             e5832060\
    \               str             r2, [r3, #144]\npio->PIO_OER = mask;\n```\n\n\
    ## C++ 封装实现\n以下结构表示了用于封装 PIO 操作的 C++ 类：\n\n```cpp\nclass HardwarePIO {\npublic:\n\
    \  HardwarePIO(uintptr_t address) : interface((struct Interface*)address) {}\n\
    \  ~HardwarePIO() {}\n\n  Interface &getInterface(Name name) const {\n    return\
    \ interface[name];\n  }\n\n  void enableOutput(Name name, int pin, int value)\
    \ {\n    Interface &interface = getInterface(name);\n    uint32_t mask = 1 <<\
    \ pin;\n    if (value) {\n      interface.PIO_SODR = mask;\n    }\n    else {\n\
    \      interface.PIO_CODR = mask;\n    }\n    interface.PIO_PER = mask;\n    interface.PIO_OER\
    \ = mask;\n  }\n\nprivate:\n  enum Name { A, B, C, D, E, F, LAST };\n  struct\
    \ Interface {\n    volatile uint32_t PIO_SODR;\n    volatile uint32_t PIO_CODR;\n\
    \    volatile uint32_t PIO_PER;\n    volatile uint32_t PIO_OER;\n  };\n  Interface\
    \ *interface;\n};\n```"
- fmt: "\nAccess to the PIO registers is encapsulated in the class methods of the\
    \ hardware module. The methods in the `HardwarePIO` class are the only way to\
    \ modify a register. C++ implementation allows to catch other wrong doings at\
    \ compilation time, for example reading or writing reserved registers.\n\nIt is\
    \ easy to cache all written values in the hardware module. One way to cache or\
    \ log the read and write transactions is to add a “shadow” interface field to\
    \ the hardware module class.\n\n## Indirect I/O access.\n\nIn some case the hardware\
    \ is accessible via a serial interface. One example of such interface is `SPI`.\
    \ I am using a direct access API for the sake of brevity. A real access interface\
    \ for a real SPI device can contain system calls or calls to the serial interface\
    \ driver:\n\n```cpp\ntemplate<typename IntegerType>\nclass HardwareDirectAccessAPI\
    \ {\npublic:\n  inline uint32_t get() const {\n    return atomic_load(&value);\n\
    \  }\n  inline void set(uint32_t value) {\n    atomic_store(&this->value, value);\n\
    \  }\nprotected:\n  volatile atomic<IntegerType> value;\n  static_assert(numeric_limits<IntegerType>::is_integer,\
    \ \"HardwareDirectAccessAPI works only with integer types\");\n};\n```\n\nI am\
    \ adding an argument to the template class `HardwareRegister`:\n\n```cpp\ntemplate<typename\
    \ IntegerType, typename AccessAPI>\nclass HardwareRegister {\nprotected:\n  HardwareRegister()\
    \ {}\n  inline IntegerType get() const {\n    return api.get();\n  }\n  inline\
    \ void set(IntegerType value) {\n    api.set(value);\n  }\n  AccessAPI api;\n\
    };\n```\n\nInstance of the `HardwareRegister` for 32 bits registers, direct access\
    \ will look like this:\n\n```cpp\nclass HardwareRegister32: public HardwareRegister<uint32_t,\
    \ HardwareDirectAccessAPI<uint32_t> > {\nprotected:\n  HardwareRegister32() {}\n\
    };\n```\n\nThe rest of the classes remains the same.\n\n# Code ROM and data RAM.\n\
    \nIf at first you don't succeed; call it version 1.0.\n\nThere are very popular\
    \ hardware platforms, where ROM and RAM distinction is very important. One example\
    \ of such device is rather popular 8 bits microcontrollers `Atmega`. In the `Atmega`\
    \ MCUs code can not be placed in the data memory and CPU can not execute code\
    \ sitting in the RAM. Any access to the data in the code memory requires special\
    \ instructions. Another example is Application Specific Integration Circuits or\
    \ `ASICs`. An `ASIC` often contains integrated ROM and RAM. Integrated, also called\
    \ on die or on chip, ROM storage is relatively cheap, because it requires relatively\
    \ small amount of space on the silicone wafer. RAM is relatively expensive because\
    \ it requires more logic per bit of memory and square inches on the integrated\
    \ circuit (die) come at premium. RAM consumes significantly more power. I think\
    \ that the vast majority of the electronic device around us have integrated ROM\
    \ and RAM (frequently `SRAM`) inside. Typically the on chip RAM is much smaller\
    \ than the ROM.\n\nThere are two types of ROM: erasable and not erasable. In the\
    \ `Atmega` MCUs different areas of the ROM can be programmed by the firmware,\
    \ assuming that the firmware runs from another area. In case of `ASICs` the ROM\
    \ is often not erasable. Programming of the ROM is a part of the ASIC production\
    \ process. The ROM can not be modified after the chip leaves the factory (the\
    \ `FAB`).\n\nIf there is not enough RAM to load the firmware, then parts of the\
    \ firmware code should be located in the chip ROM. In case of an `ASIC` it means\
    \ that the ROM based parts of the firmware can be changed only in the future versions\
    \ of the chip. High complexity of the modern ASIC firmware makes it very hard\
    \ to reach 100% code coverage in the ASIC verification process. Even if the ROM\
    \ based firmware is verified and tested completely, still there is a chance that\
    \ this or that protocol has been misunderstood by the development team, or product\
    \ requirements has changed. The development team prepares the firmware and the\
    \ hardware for the not unlikely event that a need to patch the ROM will arise.\n\
    \nThis chapter covers some of the ROM related problems.\n\n## C++ Initialized\
    \ data.\n\nAt least one code section, a boot, constants and initialized data are\
    \ parts of the ROM. Initialized, non-zero data is going to consume memory two\
    \ times. Initialization values of the initialized data are part of the ROM. Usually\
    \ boot process copies the values from the ROM to the RAM. If I inspect an object\
    \ file generated by a compiler, I can easily find initialization data for the\
    \ strings. There are utilities which help to inspect the object files, dump different\
    \ section into separate files, and prepare the images for the ROM programming.\
    \ One example of such utility is `GNU objdump`. Let's see some C++ initialized\
    \ data in action. Following code produces two lines of output: “Hello, world!”,\
    \ followed by “Hello from main()!”\n\n```cpp\nclass HelloWorld {\npublic:\n  HelloWorld()\
    \ {\n    cout << \"Hello, world!\" << endl;\n  }\n};\nstatic HelloWorld helloWorld;\n\
    int main() {\n  cout << \"Hello from main()!\" << endl;\n  return 0;\n}\n```\n\
    \nThe function `main()` contains only one output. The entity responsible for initializing\
    \ of the C++ object `helloWorld` and printing the first line is an object loader\
    \ running in my operating system. In case of the embedded systems this code is\
    \ usually part of the boot process. The constructor of the `HelloWorld` class\
    \ is “text” and appears only once in the ROM. Arguments of the `cout`, the strings,\
    \ can exist in two places in the memory: original or “master copy” is in the ROM,\
    \ a second copy, created by the loader, is in the RAM. Pointer `this` which contains\
    \ address of the statically allocated object `helloWorld` has two copies too.\
    \ There is an initialization value for `this` pointer in the ROM and `this` pointer\
    \ in the RAM. Size allocated by `helloWorld` object in the ROM of 32 bits CPU\
    \ is at least 4 bytes of `this` and 14 bytes of the zero terminated string. The\
    \ linker script is responsible for correct placement of different sections of\
    \ the code and the data. If the CPU can not access data stored in the code memory,\
    \ the linker script should contain relevant allocation instructions. Specifically\
    \ place for the constant data section will be allocated two times: in the code\
    \ ROM address space and in the RAM.\n\nIn a typical case, a linker script will\
    \ add global variables that reference the start and the end address of the not\
    \ initialized data section(s) `bss`, initialized data, and a table of `ctor` functions.\
    \ Usually the `ctor` section is a table or tables of functions that the boot code\
    \ calls to initialize static C++ objects. See your linker documentation for details.\n\
    \n## ROM patching.\n\nProgramming is a lot like sex. One mistake and you're providing\
    \ support for a lifetime.\n\nI want to prepare the constructor code for a patch\
    \ in the future. I will check some location in the RAM. If there is a non-zero\
    \ entry, then I will use the string from there. If not, I will print the default\
    \ value – the ROMed one.\n\n```cpp\nstatic const char *helloWorldStr = 0;\nclass\
    \ HelloWorld {\npublic:\n  HelloWorld() {\n    if (helloWorldStr == 0)\n     \
    \ cout << \"Hello, world!\" << endl;\n    else\n      cout << helloWorldStr <<\
    \ endl;\n  }\n};\n```\n\nLoading of an ASIC which can be patched contains two\
    \ stages. In the first phase external CPU (also called a host processor) loads\
    \ some firmware to the ASIC RAM. There is a dedicated hardware/boot firmware supporting\
    \ load of the application firmware to the RAM. An alternative can be that the\
    \ boot code in the ASIC loads the application firmware from some external programmable\
    \ memory chip, for example, `EEPROM` or `SPI FLASH`. The second phase is when\
    \ the boot jumps to the application code in the RAM. If the code loaded by the\
    \ host processor contains non-zero at the address `helloWorldStr` the ROM based\
    \ application code will print a new string. I am calling this type of patch a\
    \ patch type A. In the patch type A I fix a part of the function.\n"
