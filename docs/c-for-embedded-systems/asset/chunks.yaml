    \n* 当运算符是成员时，没有参数。\n* 当运算符不是成员时，有一个参数。\n* 当运算符不是成员时，有任意数量的参数。\n* 当运算符是成员时，有一个参数。\n\
    * 当运算符是成员时，没有参数。\n\n在下方的 C++ 代码段中，以下哪些正确描述了 `assert()` 的行为：\n\n```cpp\nint val\
    \ = 5;\nwhile (true)\n\n{\nassert(val);\n}\n```\n\n* 它将值记录到文件中\n* 在调试模式下它确保 `val`\
    \ 为\n* 如果不是，则终止\n* 在调试模式下，它记录 `val`\n* 如果 `val` 为零，则终止。\n\n## 脑筋急转弯\n\nQ. 潜艇位于线上，可以是负数。它每秒以恒速移动。是否有办法确保你击中潜艇？\n\
    \nA. 在 `T` 秒后位置为 `v*T` 或 `(-v)`，其中 `v` 是绝对值。如果数字是正数，你可以对数字减 1 并计算你做了多少循环：`v*T`\
    \ 或 `(-v)`。如果 `v=2`，循环次数为 100。如果数字是负数，循环次数为 100。如果数字为零，循环次数为 100。在位置 `T*(T+1)/2`\
    \ 和 `(-T/2)` 处命中。\n\nQ. 有一栋 100 层的楼。如果蛋从第 `N` 层或以上掉落它会破碎。如果从任何以下楼掉落则不会破碎。你有 2\
    \ 块蛋。找到 `N`，同时最小化掉落次数。\n\nA. 无论如何使用第一只蛋，我们对第二只蛋进行线性搜索。一个完美的系统是第一只蛋掉落次数加上第二只蛋掉落次数总是相同的。例如，如果第一只蛋掉落在\
    \ 20 和 30（破碎），第二只蛋需要 9 步。当我们再次掉落第一只蛋时，我们将第二只蛋的潜在步骤减少到 8。这意味着我们必须在 39 层掉落第一只蛋。因此，第一只蛋从\
    \ `X` 开始，然后增加 `X-1`，`X-2`，……`X+(X-1)+(X-2)+1=100`。`X(X+1)/2=100`，`X=14`。[20]。\n\
    \nQ. 如何仅使用运算符 `+` 取反一个数字？\n\nA. 如果数字是正数，你可以对数字减 1 并计算你做了多少循环：\n\n```cpp\nint negate(int\
    \ x) {\n int result = 0;\n int sign = x < 0 ? 1 : -1;\n while (x != 0) {\n   \
    \ result += sign;\n    x += sign;\n    }\n return result;\n}\n```\n\nQ. 发现以下函数中的错误（如果有的话）：\n\
    \n```cpp\nvoid mistake()\n{\n unsigned int i;\n for (i = 100; i <= 0; --i) {\n\
    \ printf(\"%d\\n\", i);\n    }\n}\n```\n\nA. `printf` 永远不会执行。`for` 循环是一个死循环。\n\
    \nQ. 一个应用程序在运行时崩溃。它从不在同一个地方崩溃。应用程序是单线程的，并且只使用标准库。哪些编程错误可能导致这种情况？\n\nA. 崩溃由输入引起：用户输入或特定的硬件状态、栈溢出、尝试使用未分配（已释放）的内存。可以记录系统输入。有一些工具（valgrind）可以发现内存泄漏和访问未初始化内存。\n\
    \nQ. 给定生成 0 到 4 之间整数的随机数生成器 `r5`，实现一个随机数生成器 `r7`。\n\n"
- fmt: "\nA. A sum of two random numbers is not a uniformly distributed random number.\
    \ Any solution which involves a sum of randomly generated numbers will be wrong.\
    \ In the following code the first assignment generates a two digits number base\
    \ 5 – a random number between 0 and 24. The next line removes from the series\
    \ of random numbers 21, 22, 23, 24. The result of the operation is a series of\
    \ uniformly distributed numbers between 0 and 20. Modulus 7 completes the task.\n\
    \n```cpp\nint random_7() {\n  while (true) {\n    int ret = 5 * random_5() + random_5();\n\
    \    if (ret < 21)\n      return (ret % 7);\n  }\n}\n```\n\n# Conclusion\n\nYou\
