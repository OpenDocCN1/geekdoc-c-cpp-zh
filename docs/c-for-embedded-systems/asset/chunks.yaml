    \            [](FPADC current, FPADC sample) {\n                return current+(sample-current)/2;\n\
    \            });\n    }\nprotected:\n    ADC<FPADC, 4> myAdc;\n    HardwareModuleADC\
    \ hardwareModuleADC;\n};\n```\n\n# Interview questions.\n\nThe clever shall inherit\
    \ the earth. - Economist, Jan 20th, 2011\n\nI know that for you and me programming\
    \ is not about money. Still, some of my dear readers have to think about the families.\
    \ A programmer is one of the top paying professions in the world.\n\n“As technology\
    \ advances, the rewards to cleverness increase. Computers have hugely increased\
    \ the availability of information, raising the demand for those sharp enough to\
    \ make sense of it. In 1991 the average wage for a male American worker with a\
    \ bachelor's degree was 2.5 times that of a high-school drop-out; now the ratio\
    \ is 3”([16]).\n\nA skilled software developer can get a job paying 6 figures\
    \ or an equivalent in the US, UK, Canada, Australia and other countries. Between\
    \ you and your dream job lies a professional interview.\n\nNo worries if you often\
    \ fail to answer brain teasers. In many companies this specific class of interview\
    \ questions is forbidden. There is a very small group of people who is capable\
    \ to find a solution for a hard question in real time. Be sure, that these people\
    \ are already hired by Googles and Apples of the world and they are not competing\
    \ with you for the job. Your interviewer most likely does not expect the correct\
    \ answer, but mainly wants to see how you approach tough problems.\n\nIn this\
    \ chapter I have attempted to gather a small set of questions which you can encounter\
    \ when applying for a job of a real-time, embedded, firmware developer. I skip\
    \ graphs, binary trees, jars of water because these type of problems rarely appear\
    \ in technical interviews of embedded system developers.\n\n## General programming.\n\
    \nQ. What are limitations of the code below? Are there any potential problems?\n\
    \n```cpp\n#define LOG_CAT(fmt, ...) print_log(\"%s %d\" fmt, __FUNCTION__, __LINE__,\
    \ ##__VA_ARGS__ )\n\nstatic inline void print_log(const char *fmt, ...)\n{\n \
    \   va_list ap;\n    va_start(ap, fmt);\n    vprintf(fmt, ap);\n    va_end(ap);\n\
    }\n```\n\nA. Macro `LOG_CAT` assumes that “fmt” is a const string. For example,\
    \ the following code will not compile:\n\n```cpp\nvoid testLogCat()\n{\n    char\
    \ *f = \"Test %d\";\n    LOG_CAT(f, 1);\n}\n```\n\nCall to function `vprintf()`\
    \ is not reentrant on some platforms. On other platforms `vprintf()` uses a large\
    \ buffer on the stack which can create problems if called from interrupts.\n\n\
    Q. What is wrong with the following interrupt routine? Try to point as many potential\
    \ problems as possible:\n\n```cpp\nuint32_t Tick = 0;\nint MyTickIsr()\n{\n  \
    \  Tick++;\n    printf(\"%s\", __FUNCTION__);\n    return 0;\n}\n```\n\nA.\n1.\
    \ Usually interrupt handlers should not return a value. The result of returning\
    \ a value depends on the operating system.\n2. Incrementing of the global variable\
    \ is a read-modify-write operation. Another thread can be in the middle of modifying\
    \ the value of the `tick` when the interrupt handle is getting called.\n3. In\
    \ many systems `printf()` is not a reentrant API. Call to `printf()` can cause\
    \ interrupt stack overflow if `printf()` uses the stack to allocate the string.\
    \ Depending on the implementation call to `printf()` can require significant time.\n\
    \nQ. List most popular ways to implement a FIFO between “producer” and “consumer”.\
    \ Assume that producer generates data blocks of different size between 1 and 256\
    \ bytes.\n\nA.\n1. Ring buffer of pointers where every pointer is a linked list\
    \ of, for example, 16 bytes data blocks. Data blocks are allocated by the producer\
    \ from the linked list of free blocks.\n2. Ring buffer of pointers referencing\
    \ data blocks 256 bytes each. Data blocks are allocated by the producer from the\
    \ linked list of free blocks.\n3. Ring buffer of data where each chunk of data\
    \ is prepended by the data block size.\n\nBe prepared to discuss pros and cons\
    \ of every approach in terms of memory and performance, “skb” buffers in the Linux\
    \ kernel, DMA descriptors, zero copy data processing.\n\nQ. Write a program to\
    \ find whether a machine is big endian or little endian.\n\nA. In run-time this\
    \ function can be used:\n\n```cpp\nint isLittleEndian() {\n    short int data\
    \ = 0x0001;\n    char *byte = (char *) &data;\n    return (byte[0] ? 1 : 0);\n\
    }\n```\n\nIn compilation time this macro:\n\n```cpp\n#define IS_LITTLE_ENDIAN\
    \ (*(uint16_t *)\"\\0\\xff\" >= 0x100)\n```\n\nIn Linux we have a macro `BYTE_ORDER`.\
    \ In GCC we have macros `__LITTLE_ENDIAN__`, `__BIG_ENDIAN__`, `__BYTE_ORDER__`.\n\
    \nQ. Write a class such that no other class can be inherited from it.\n\nA. The\
    \ solution is based on Singleton design pattern – a class with a private constructor:\n\
    \n```cpp\nclass YouCanNotInheritMe;\nclass Singleton {\nprivate:\n    Singleton()\
    \ {}\n    friend YouCanNotInheritMe;\n};\nclass YouCanNotInheritMe : virtual public\
    \ Singleton {\npublic:\n    YouCanNotInheritMe(){}\n};\n```\n\nI can create an\
    \ object of type `YouCanNotInheritMe`:\n\n```cpp\nYouCanNotInheritMe youCanNotInheritMeObject;\n\
    ```\n\nAn attempt to inherit the class `YouCanNotInheritMe` will fail with error\
    \ “Singleton::Singleton() is private ”:\n\n```cpp\nclass TryToInheritAnyway :\
    \ YouCanNotInheritMe {\npublic:\n    TryToInheritAnyway() {}\n};\n```\n\nIn C++11\
    \ you can use the word `final`:\n\n```cpp\nclass FinalClass final {\npublic:\n\
    \    FinalClass() {}\n};\n```\n\nQ. Is there a bug in the following code?\n\n\
    ```cpp\nclass A {\npublic:\n    A() : isDone(false) {}\n    virtual void m1()\
    \ = 0;\n    void m2() {\n        m1();\n        MutexAB m;\n        isDone = true;\n\
    \    }\n    virtual ~A() {\n        MutexAB m;\n        while (!isDone) {}\n \
    \   }\nprotected:\n    bool isDone;\n};\nclass B : public A {\npublic:\n    void\
    \ m1() {}\n    virtual ~B() {}\n};\nvoid testAB() {\n    B *b = new B;\n    std::thread\
    \ t1{ [=] {\n        b->m1();\n        b->m2();\n    }};\n    std::thread t2{\
    \ [=] {\n        delete b;\n    }};\n}\n```\n\nA. Thread `t2` can destroy the\
    \ class object `b` and destroy virtual table as well while thread `t1` is calling\
    \ the virtual method `m1`. C++ compiler can modify the virtual table pointer the\
    \ moment code enters class `A`, the base class, destructor. When thread `t1` kicks\
    \ in it can discover that `b->m1` is not initialized.\n\nQ. Is there a bug in\
    \ the following code?\n\n```cpp\ntypedef struct {\n int f1 : 8;\n int f2 : 8;\n\
    } myDataT;\nstatic myDataT myData;\nvoid testData() {\n    std::thread t1{ [=]\
    \ {\n        myData.f1 = 0;\n    }};\n    std::thread t2{ [=] {\n        myData.f2\
    \ = 1;\n    }};\n}\n```\n\nA. On 32 bits architecture C++ compiler will place\
    \ bit fields `f1` and `f2` in the same 32 bits location. Write to the bit fields\
    \ `f1` and `f2` is implemented as read-modify-write operation. There is a race\
    \ between threads `t1` and `t2`. For example, `t1` reads `myData`, `t2` interrupts\
    \ `t1`, `t2` continues to the completion and modifies `f2`, `t1` resumes and completes\
    \ write to the field `f1` using old value for the field `f2`, field `f2` remains\
    \ unchanged.\n\nQ. In the code below one of the functions consistently outperforms\
    \ another. Why?\n\n```cpp\nstatic struct {\n int a[128];\n int b[128];\n int c[128];\n\
    } dataArray;\n\nvoid initDataArrayB() {\n    memset(dataArray.a, 0, sizeof(dataArray.a));\n\
    \    memset(dataArray.b, 0, sizeof(dataArray.b));\n}\n\nvoid initDataArrayC()\
    \ {\n    memset(dataArray.a, 0, sizeof(dataArray.a));\n}\n```\n"
