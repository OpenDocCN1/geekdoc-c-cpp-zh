  trans: "\n\n![](img/cover.jpeg)\n\n![](img/00001.jpeg)\n\n# 目录\n\n- 介绍.3\n- 致谢.4\n\
    - C++ 代码风格.5\n- 软件原语.5\n- 互斥锁.5\n- 并行执行.14\n- 容器.19\n- C++ 模板.41\n- 内存管理.50\n\
    - Operator new.74\n- I/O 访问.77\n- C 语言中的 I/O 访问.79\n- C++ 中的 I/O 访问.87\n- 间接 I/O\
    \ 访问.99\n- 代码 ROM 和 RAM.103\n- C++ 初始化数据.104\n- ROM 补丁.106\n- 组合.109\n- 静态（类）成员.110\n\
    - 非静态成员.119\n- 进程间通信.122\n- 日志.133\n- 软件定时器.154\n- Lambda.182\n- 定点算术.187\n- 面试题.191\n\
    - 通用编程.191\n- 位操作技巧.205\n- 常见测试.208\n- 结论.230\n\n# 介绍\n\n面向对象代码的伟大之处在于，它可以让简单简单的问题看起来变得庞大且复杂。在书中，我假设读者对\
    \ C++ 已经非常熟悉。在整本书，我展示了 C++11 中一些不为人知的特性，例如类型特征、常量表达式和 OpenMP 支持。我得出的结论是 C++ 是完美的工具。\n\
    \n等等，我需要重新检查细节，以提供文本的一一对应映射。\n\n问题可以通过许多方式解决。我提供了一种替代方案并比较了性能。\n\n# 致谢\n\n我要感谢我的表弟兼朋友\
    \ Andre。没有 Andre 的帮助，这本书将会单薄得多。我认为在我们两个之间\n\n# C++ 代码风格。\n\n#define `AND` `&&`\n\
    #define `OR` `||`\n#define `EQ` `==`\n\n在所有的源代码示例中，我尽力遵循了一致的 C/C++ 风格。在书中，我没有将大括号单独放在一行。唯一的唯一目的是为了让代码更短。更短的代码更有可能在较小的阅读器屏幕上显示。出于同样的原因，代码本身没有注释。希望注释的缺失通过穿插的解释得到了补偿。我使用了驼峰命名法。类型和类名以大写开头，变量以小写开头，而常量则全大写并用下划线分隔。\n\
    \n# 软件原语。\n\n## 互斥\n\n在多任务环境中，线程和中断会并发读写数据对象。可以使用不同的工具来同步不同上下文之间的访问，并创建线程安全的 API。可用工具包括信号量、操作系统提供的互斥锁，以及禁用中断、禁用部分中断、禁用操作系统调度器以及使用自旋锁。当我为实时操作系统或硬件提供的\
    \ API 编写封装时，我希望封装尽可能轻量。通常，我使用汇编指令的数量来衡量封装的开销。指令数量是 CPU 周期或执行时间的良好估计。\n\n```cpp\n\
    class LockDummy {\npublic:\n    LockDummy() {\n        cout << \"Locked context\"\
    \ << endl;\n    }\n    ~LockDummy() {\n        cout << \"Lock is freed\" << endl;\n\
    \    }\n};\n```\n\n在接下来的用法示例中，C++ 符 `auto` 告诉编译器自动提供正确的类型——C++11 编译器知道在某些情况下推导出某些变量类型。例如，C++\
    \ 编译器可以推断赋值左侧的返回类型或函数的返回类型。\n\n"
- fmt: "\nIn the function `main()` the compiler will call the output function two\
    \ times and will not add any other code. The lock is released – the destructor\
    \ `~LockDummy` gets called – when the scope of the variable `myDummyLock` ends.\
    \ The scope could be a `while` loop. I do not have to call “unlock” before each\
    \ and every return from the function. The C++ compiler makes sure that the destructor\
    \ is always called and called exactly once (see more about RAII in [1]). This\
    \ convenient service comes without any performance overhead. The output of the\
    \ following code is going to be\n\nLocked context\n\nProtected context\n\nLock\
    \ is freed\n\n```cpp\nint testDummyLock() {\n#if (__cplusplus >= 201103) // use\
    \ \"auto\" if C++11 or better own  auto myDummyLock = LockDummySimple();\n#else\n\
    \    LockDummySimple myDummyLock = LockDummySimple();\n#endif\n\n  cout << \"\
    Protected context\" << endl;\n  return 0;\n}\n```\n\nI want to stress this idea\
    \ using another example. In the following code, I set a scope around the declaration\
    \ of the lock variable. The output of the code is going to be\n\nLocked context\n\
    \nProtected context\n\nLock is freed\n\nEnd of main\n\n```cpp\nint main() {\n\
    \    {\n        LockDummy lock;\n        cout << \"Protected context\" << endl;\n\
    \    }\n    cout << \"End of main\" << endl;\n    return 0;\n}\n```\n\nMy second\
    \ lock is a more realistic one, and it disables a hardware interrupt. I assume\
    \ that there is an API that disables and enables an interrupt. I am refactoring\
    \ the original lock code a little bit. First of all, I use a template, which is\
    \ a feature of C++ that allows you to declare a class that operates with generic\
    \ types. I am going to reuse the code in the template `Lock` for different synchronization\
    \ objects. The code in the template `Lock` can manipulate any structure or class\
    \ that implements two public methods: static methods `get()` and `release()`.\
    \ I carefully avoid polymorphism here, I do not require synchronization objects\
    \ to belong to the same hierarchy of classes. The wrapper around the disable/enable\
    \ interrupts API, which likely writes to the hardware, is not going to be a child/friend/parent/relative/derivation\
    \ of a wrapper for the operating system semaphore.\n\nThis is what the API that\
    \ disables and enables interrupts looks like:\n\n```cpp\nstatic inline void interruptDisable(void)\
    \ {\n  cout << \"Disable\" << endl;\n}\n\nstatic inline void interruptEnable(void)\
    \ {\n  cout << \"Enable\" << endl;\n}\n```\n\nI am describing a synchronization\
    \ object. The class implements two methods: “get” and “release”. Both methods\
    \ are “inline”, which helps the optimizer to decide if calls to the methods should\
    \ be substituted by the methods code. The end result is going to be similar to\
    \ using a macro definition in C. The default constructor in the class `SynchroObject`\
    \ is private, I do not want any objects of this type in the application. My C++\
    \ compiler so far has not added any object code to my executable file.\n\n```cpp\n\
    class SynchroObject {\n    SynchroObject() {};\npublic:\n    static inline void\
    \ get() {\n        interruptDisable();\n    }\n    static inline void release()\
    \ {\n        interruptEnable();\n    }\n};\n```\n\nThe template class `Lock` can\
    \ manipulate any type of synchronization objects that provides a `get/release`\
    \ API. All methods of the template class `Lock` are “inline”. The C++ compiler\
    \ is not going to add any functions to the object code, but will rather replace\
    \ the calls to the `Lock` methods with the code of the `get/release` from the\
    \ synchronization object.\n\n```cpp\ntemplate<typename Mutex> class Lock {\npublic:\n\
    \    inline Lock() {\n        Mutex::get();\n    }\n    inline ~Lock() {\n   \
    \     Mutex::release();\n    }\n};\n```\n\nDeclare a new type `MyLock` that uses\
    \ my `SynchroObject` to disable/enable interrupts. There is still no additional\
    \ data or code in my executable except for the calls to the interrupt enable and\
    \ interrupt disable API.\n\n```cpp\ntypedef Lock<SynchroObject> MyLock;\n```\n\
    \nOutput of the function `main()` is going to be two words: Disable, Enable\n\n\
    ```cpp\nint main() {\n    {\n        MyLock lock;\n    }\n    return 0;\n}\n```\n\
    \nOverhead of the wrapper around the functions that disable and enable interrupts\
    \ is exactly zero. Indeed, if I check the disassembly, I will see two calls to\
    \ the print function in the main routine and nothing else. I have written some\
    \ C++ code which gets optimized to nothing. What did I gain? What is an added\
    \ value?\n\nThe code does not allow me to leave out enable interrupts after I\
    \ called disable interrupt. No matter how many return points or breaks out of\
    \ a loop my function has, the C++ compiler ensures that the function `interruptEnable`\
    \ is called exactly once.\n\n## Parallel execution.\n\nSome people, when confronted\
    \ with a problem, think, 'I know, I'll use threads' – and then they have problems.\n\
    \nI have a quad core CPU in my system. Compiler GCC 4.8 is available for my hardware.\
    \ If I compile the code below with the compilation flag `-fopenmp` I will get\
    \ the output “4”:\n\n```cpp\nvoid testReduction(void) {\n  int a = 0;\n  #pragma\
    \ omp parallel reduction (+:a)\n    {\n      a = 1;\n    }\n  cout << a << endl;\n\
    }\n```\n\nWithout the flag `-fopenmp` the output will be “1”. When the C++ compiler\
    \ encounters pragma “omp parallel”, it adds a chunk of code which spawns a “team”\
    \ of threads (in Linux POSIX pthreads) according to the number of cores in the\
    \ system. The following section is executed by the group of threads in parallel.\n\
    \nExecution of the following function on my system requires ~0.179s with OpenMP\
    \ and ~0.322s without OpenMP:\n\n```cpp\nvolatile uint_fast8_t myArray[(size_t)512*1024*1024];\n\
    uint_fast32_t testOpenMPLoop() {\n  uint_fast32_t sum = 0;\n  #pragma omp parallel\
    \ for reduction(+:sum)\n  for (uint64_t i=0; i < sizeof(myArray); i++)\n    {\n\
    \      sum += myArray[i];\n    }\n  return sum;\n}\n```\n\nIf the array size is\
    \ under 10M entries OpenMP kicks in and the single thread version requires more\
    \ time.\n"
