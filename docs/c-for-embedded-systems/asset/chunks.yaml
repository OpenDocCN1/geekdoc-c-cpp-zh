    \n模数转换器 (ADC) 是一种将连续物理量（例如电压）转换为表示该量幅的数字的设备（[11]）。在我的应用程序中，我想读取 ADC 设备，在环形缓冲区中收集样本，运行一个简单的环形缓冲区（[12]）。ADC\
    \ 看起来如下：\n\n```cpp\ntemplate<typename ObjectType, size_t Size>\nclass ADC {\n\
    public:\n  ADC(ObjectType);\n  typedef ObjectType (*Filter)(ObjectType);\n  void\
    \ add(ObjectType, Filter);\n  double get();\nprotected:\n  CyclicBuffer<Size>\
    \ data;\n  ObjectType value;\n};\n```\n\nADC 构造函数设置了初始值：\n```cpp\ntemplate<typename\
    \ ObjectType, size_t Size>\nADC(ObjectType initialValue) {\n  value = initialValue;\n\
    }\n```\n\n`get()` 方法返回计算值：\n```cpp\ntemplate<typename ObjectType, size_t Size>\n\
    double get() {\n  return value;\n}\n```\n\n`add` 方法更新循环缓冲区并调用过滤器：\n```cpp\ntemplate<typename\
    \ ObjectType, size_t Size>\nvoid add(ObjectType, Filter) {\n  data.add(filter);\n\
    }\n```\n\n`Filter` 是一个函数指针。每个人中有三个（此处原文可能为误，意指“大多数人”）会使用以下示例，我使用了一个 Lambda 函数：\n\
