    \ zero explicitly:\n\ntemplate<>struct  factorial<0>\n\n{\n\n static  constexpr\
    \  uint32_t  value = 1;\n\n};\n\nNow I can have the following statement in my\
    \ C++ code:\n\nconstexpr  uint32_t factorial_3 = factorial<3>::value;\n\nC++ compiler\
    \ will replace the call to factorial<3> with 6 and the variable factorial_3 will\
    \ be a constant known at the build time. I have never met firmware code which\
    \ was required to calculate a factorial, but there were cases when I needed to\
    \ force the compilation failure instead of getting a run-time error. Calculating\
    \ a number of bits in the “int” variable and failing the compilation if the integer\
    \ is not large enough could be a good example, if C++11 already had not std::numeric_limits<T>::max()\
    \ which returns maximum value representable by type T. Yet another example is\
    \ calculating non-trivial constants. In the following example the function testSum()\
    \ will print 15\\. The template function accepts variable number of arguments\
    \ and is called a variadic template function.\n\nint  sum()\n\n{\n\n return 0;\n\
    \n}\n\ntemplate<typename ... Types>\n\nint  sum (int first, Types ... rest)\n\n\
    {\n\n return first + sum(rest...);\n\n}\n\nconst  int SUM = sum(1, 2, 3, 4, 5);\n\
    \nThis function prints 15:\n\nvoid  testSum()\n\n{\n\ncout << \"SUM=\" << SUM\
    \ << endl;\n\n}\n\n## Memory management.\n\nProgramming is like sex, one mistake\
    \ and you have to support it for the rest of your life.\n\nI am going to discuss\
    \ two frequently used types of memory allocation in the embedded software – static\
    \ allocation at the build time and allocation from memory pools."
