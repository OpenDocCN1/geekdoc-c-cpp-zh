  trans: "\n\n对于 B 类补丁，我需要硬件支持。当 CPU 从特定地址或地址范围获取指令时——在下面的代码中，这是函数 `printHello()`\
    \ 的地址——我希望“中断”执行并将控制权切换到位于 RAM 中的中断处理程序。默认的中断处理程序什么都不做。该处理程序是空的并直接返回，允许 `printHello()`\
    \ 函数完成它的有用工作。补丁后的中断处理程序可以在允许 `printHello()` 函数打印它之前修改 RAM 中的字符串“Hello, world”。中断处理程序可以执行某些任意代码并将控制权返回给\
    \ `printHello()` 的调用者，完全跳过原始的打印代码。\n\n```cpp\nclass HelloWorld {\npublic:\n HelloWorld()\
    \ {\n        printHello();\n    }\nprotected:\n void  printHello() {\ncout <<\
    \ \"Hello, world!\" << endl;\n    }\n};\n```\n\n对于 C 类补丁，我需要在链接脚本中获得支持。我想将 `HelloWorld`\
    \ 的构造函数放在 ROM 中，但 `printHello()` 方法我想在 RAM 中执行。如果 `HelloWorld` 构造函数调用了 RAM 中的函数，我就可以轻松地补丁该函数代码。\n\
    \n# 组合\n\n你是否注意到过 'C' 项目计划与 C++ 项目计划之间的区别？C++ 项目的规划阶段是 C 的三倍。这正是为了确保所有应该继承的都继承了，而不应该继承的没有。尽管如此，他们仍然会出错。\n\
    \n记得平均规模的 'C' 项目的长度吗？大约 6 个月。对于一个有妻有儿的男人来说，这段时间远远不足以维持体面的生活。拿同一个项目，用 C++ 设计，你会得到什么？我告诉你。一到两年。这难道不棒吗？\n\
    \n我将尝试为“创建任务”API 编写一个包装器。类似于 `pthread_create` 或 `FreeRTOS xTaskCreate` 等 API 的典型包装器是基于类（例如\
    \ `MyThread`）中的静态方法的。事实上，这是我知道的编写适用于大多数操作系统的可移植 C++ 包装器的唯一方法。我将适当地地展示这种方法的基本示例，不是因为它们迷人，而是因为一本合理的“嵌入式\
    \ C++”书籍对此有所期望。你可以自由跳转到下一段，我在那里将展示非可移植的 C++ 创建任务包装器代码。\n\n## 静态（类）成员。\n\nC 允许你射自己的脚。C++\
    \ 允许你重用子弹。\n\n我将从一个池中分配我的作业线程对象。例如，远程过程调用（Remote Procedure Call）的实现可以使用作业线程池在本地执行过程。从内存池分配线程对象比调用操作系统\
    \ API 创建新线程更快。`MemoryPool` 是一个通用的对象池，它静态地分配对象。这是对之前章节中内存池类的重用。我在这里跳过了了一些细节，例如池的名称、调试统计等。\n\
    \n```cpp\ntemplate<typename Lock, typename ObjectType, size_t Size>\nclass MemoryPool\
    \ {\npublic:\n MemoryPool();\n ~MemoryPool() {}\n inline bool allocate(ObjectType\
    \ **obj);\n inline bool free(ObjectType *obj);\nprotected:\n Stack<ObjectType,\
    \ LockDummy, Size> pool;\n ObjectType objects[Size];\n};\n```\n\n栈保留了空闲（未分配）对象的引用。池的构造函数填充对象栈：\n\
    \n```cpp\ntemplate<typename Lock, typename ObjectType, size_t Size>\nMemoryPool<Lock,\
    \ ObjectType, Size>::MemoryPool() {\n for (int i = 0;i < Size;i++) {\n pool.push(&objects[i]);\n\
    \    }\n}\n```\n\n分配和释放方法调用栈的 `pop` 和 `push` API：\n\n```cpp\ntemplate<typename\
    \ Lock, typename ObjectType, size_t Size>\nbool MemoryPool<Lock, ObjectType, Size>::allocate(ObjectType\
    \ **obj) {\n bool res;\n Lock lock;\nres = pool.pop(obj);\n return res;\n}\n\n\
    template<typename Lock, typename ObjectType, size_t Size>\nbool MemoryPool<Lock,\
    \ ObjectType, Size>::free(ObjectType *obj) {\n bool res;\n Lock lock;\nres = pool.push(obj);\n\
    \ return res;\n}\n```\n\n`JobThread` 实现了一个“开始”API 和一个无限循环的静态方法。更现实的实现会添加“等待完成”、某些用于异步调用上下文作业已完成的机制，以及对作业函数参数的支持。\n\
    \n```cpp\ntemplate <typename JobType> class JobThread {\npublic:\n JobThread();\n\
    \ void start(JobType *job);\nprotected:\n JobType *job;\n xTaskHandle pxCreatedTask;\n\
    \ xQueueHandle signal;\n static void mainLoop(JobThread *jobThread);\n};\n```\n\
    \n`JobThread` 构造函数创建一个二值信号量并产生（spawn）一个新的线程（这个特定动词的选择基于“taskSpawn”，它是 vxWorks\
    \ 中的一个创建任务 API）。我在示例中假设使用 FreeRTOS API，但任何其他 API 在这里有效：\n\n```cpp\ntemplate<typename\
    \ JobType>\nJobThread<JobType>::JobThread() : job(nullptr) {\n static const char\
    \ *name = \"a job\";\n    vSemaphoreCreateBinary(this->signal);\n    portBASE_TYPE\
    \ res = xTaskCreate((pdTASK_CODE)mainLoop, (const signed char *)name, 300, this,\
    \ 1, &this->pxCreatedTask);\n if (res != pdPASS) {\ncout << \"Failed to create\
    \ a task\" << endl;\n    }\n}\n```\n\n线程入口点 `mainLoop` 方法进入 while 循环并等待二值信号量。在实际代码中，我可能会测试一个对象变量\
    \ `bool exitFlag` 而不是始终为真的条件：\n\n```cpp\ntemplate<typename JobType>\nvoid JobThread<JobType>::mainLoop(JobThread\
    \ *jobThread) {\n while (true) {\n        xSemaphoreTake(jobThread->signal, portMAX_DELAY);\n\
    \ if (jobThread->job != nullptr) {\n            jobThread->job->run();\n     \
    \   }\n        jobThread->job = nullptr;\n    }\n}\n```\n\n`start` 方法设置作业指针并唤醒\
    \ `mainLoop`：\n\n```cpp\ntemplate<typename JobType>\nvoid JobThread<JobType>::start(JobType\
    \ *job) {\n this->job = job;\nxSemaphoreGive(this->signal);\n}\n```\n\n在下面的示例中，代码打印“Print\
    \ is running”：\n\n```cpp\nstruct PrintJob {\n void run(void) {\ncout << \"Print\
    \ is running\" << endl;\n    }\n};\n\nMemoryPool<LockDummy, JobThread<PrintJob>,\
    \ 3> jobThreads;\n\nPrintJob printJob;\n\nint main( void )\n{\n JobThread<PrintJob>\
    \ *jobThread;\n jobThreads.allocate(&jobThread);\n jobThread->start(&printJob);\n\
    \ vTaskStartScheduler();\n return 1;\n}\n```\n\n## 非静态成员。\n\n“C 让你很容易射中自己的脚；C++\
    \ 让它变得更难，但当你这样做时，它会炸掉你的整个腿。”\n\n我只修改了上面代码中的两行。对 `xTaskCreate` 的调用获取了一个成员函数的指针。C++\
    \ 编译器对将方法地址转换为通用指针发出警告：\n\n```cpp\nvoid *pMainLoop = (void*)&JobThread<JobType>::mainLoop;\n\
    portBASE_TYPE res = xTaskCreate((pdTASK_CODE)pMainLoop, (const signed char *)name,\
    \ 300, this, 1, &this->pxCreatedTask);\n```\n\n主循环方法不再是静态方法，且不需要任何参数：\n\n```cpp\n\
    template<typename JobType>\nvoid JobThread<JobType>::mainLoop() {\n while (true)\
    \ {\n        xSemaphoreTake(signal, portMAX_DELAY);\n if (job != nullptr) {\n\
    \ job->run();\n        }\n job = nullptr;\n    }\n}\n```\n\n这个技巧之所以有效，是因为大多数（或所有？）C++\
    \ 编译器会将“this”（一个指向对象的指针）首先推入参数栈。如果 C 和 C++ 代码使用栈帧的方式不同，该技巧可能会失效。虚方法指针也可能失效。这总是可以通过暴力破解来解决——反汇编，并弄清楚如何正确调用成员函数。虚函数调用的实现不同编译器之间差异巨大。\n\
    \n"
- fmt: "\nA reader of this text could ask what is the point behind this pointer-to-member\
    \ exercise. When I run the application under a debugger, sometimes I want to set\
    \ a break point using an absolute address. I can print an absolute address of\
    \ a member and see in run-time how many instances of the same method my generic\
    \ class creates. Taking a pointer of a function insures that the function is not\
    \ an “inline” function.\n\n## Interprocess communication.\n\nI hate threading\
    \ anyway. Multiprocessing is the way to go, and message-passing, not shared memory.\
    \ That just doesn't scale. I use multithreading so I can use all of my 16 cores,\
    \ or whatever is the average number of cores in a machine these days. Big furry\
    \ deal. I've got a few thousand servers waiting for me in the data center and\
    \ how do I use those with threading? – Alex Martelli.\n\nThe classical Interprocess\
    \ Communication (IPC) design pattern is a mailbox or a message queue. The mailbox\
    \ design pattern has gained popularity when Windows 3.11 and the first real-time\
    \ operating systems, such as `RT Kernel` and `vxWorks`, were a bleeding edge of\
    \ the technology. Some operating systems support the message queue API. I am going\
    \ to demonstrate a message queue that based on two primitives: a `semaphore` and\
    \ a `FIFO`. The `Mailbox` class is an example of “object composition” ([4],[5]).\
    \ I use “a mailbox HAS a FIFO” relationship. Alternatively, I could use “a mailbox\
    \ is a FIFO” formula and subclass – inheritance – the mailbox from the class `FIFO`.\
    \ It is considered a good practice not to overuse inheritance.\n\nThe mailbox\
    \ API has two methods: send a message and wait for a message ([6]):\n\n```cpp\n\
    template<typename  ObjectType, typename  Lock>\n\nclass  Mailbox {\n\npublic:\n\
    \n Mailbox(const  char *name, size_t size);\n\n const  char *getName() {return\
    \  name;}\n\n inline  bool  send(ObjectType msg);\n\n enum TIMEOUT {NORMAL, NONE,\
    \ FOREVER};\n\n bool  wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t timeout);\n\
    \nprotected:\n\n const  char *name;\n\n xQueueHandle  semaphore;\n\n CyclicBufferDynamic<ObjectType,\
    \ Lock> fifo;\n\n};\n```\n\nThe mailbox constructor employs the FreeRTOS counting\
    \ semaphore:\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\nMailbox<ObjectType,\
    \ Lock>::Mailbox(const  char *name, size_t size) :\n\n fifo(size),\n\n name(name)\
    \ {\n\n semaphore = xSemaphoreCreateCounting(size+1, 0);\n\n}\n```\n\nThe send\
    \ method adds a message to the FIFO and bumps the semaphore:\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock>\n\nbool  Mailbox<ObjectType, Lock>::send(ObjectType\
    \ msg) {\n\n bool res;\n\nres = fifo.add(msg);\n\n     xSemaphoreGive(semaphore);\n\
    \n return res;\n\n}\n```\n\nReceive message handles different types of the timeout:\n\
    \n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\nbool  Mailbox<ObjectType,\
    \ Lock>::wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t timeout) {\n\n bool\
    \ res = false;\n\n     portBASE_TYPE semaphoreRes = pdFALSE;\n\n while (semaphoreRes\
    \ == pdFALSE) {\n\n if (waitType == TIMEOUT::FOREVER) {\n\n              semaphoreRes\
    \ = xSemaphoreTake(semaphore, portMAX_DELAY);\n\n          }\n else  if (waitType\
    \ == TIMEOUT::NORMAL) {\n\n              semaphoreRes = xSemaphoreTake(semaphore,\
    \ timeout);\n\n break;\n\n          }\n else {\n\n              semaphoreRes =\
    \ xSemaphoreTake(semaphore, 0);\n\n break;\n\n          }\n\n    }\n\n if ((semaphoreRes\
    \ == pdTRUE) && !fifo.isEmpty()) {\n\nres = fifo.remove(msg);\n\n     }\n\n return\
    \ res;\n\n}\n```\n\nIn the example application an interrupt (a producer) reads\
    \ data from the `UART` devices, and sends the collected data to the processing\
    \ task (a consumer). My message object contains two things: a message event and\
    \ some data. The consumer task is expected to switch by the message event:\n\n\
    ```cpp\nenum EVENT {UART0, UART1};\n\ntypedef  struct {\n\n enum EVENT event;\n\
    \n size_t  data[32];\n\n int  dataSize;\n\n} Message;\n```\n\nIn the example below\
    \ I reuse the memory pool from the previous chapter:\n\n```cpp\nMemoryPool<LockDummy,\
    \ Message, 3> pool;\n\nMailbox<Message*, LockDummy> myMailbox(\"mbx\", 3);\n\n\
    void  rxTask( void ) {\n\n     myMailbox.wait(&message,\n\n      myMailbox.TIMEOUT::FOREVER,\
    \ 0);\n\ncout << \"data=\" <<\n\n         message->data << \", event=\" <<\n\n\
    \         message->event << endl;\n\n    pool.free(message);\n\n}\n\nint  main(\
    \ void ) {\n\n     Message *message;\n\n     pool.allocate(&message);\n\n    \
    \ message->data[0] = 0x30;\n\n     message->dataSize = 1;\n\n     message->event\
    \ = EVENT::UART0;\n\n     myMailbox.send(message);\n\n}\n```\n\nIn many cases\
    \ a modern firmware developer will use a “pipeline”. A “pipeline is a set of data\
    \ processing elements connected in series, where the output of one element is\
    \ the input of the next one” (Wikipedia). A processing element, for example, a\
    \ thread, wakes up and checks the mailbox – the job queue. If the queue is not\
    \ empty, the thread executes one stage of processing and forwards the processed\
    \ data to the next thread in the pipeline.\n\nThe pipeline task has two methods:\
    \ add a new job and process the data. A pipeline task – a stage – has a name and\
    \ keeps a reference to the next stage:\n\n```cpp\ntemplate<typename  ObjectType,\
    \ typename  Lock, std::size_t  Size>\n\nclass  PipelineTask {\n\npublic:\n\n PipelineTask(const\
    \  char *name,\n\n PipelineTask *nextStage = nullptr) :\n\n name(name),\n\n nextStage(nextStage){}\n\
    \n void  doJob();\n\n void  addJob(ObjectType &data);\n\nprotected:\n\n const\
    \  char *name;\n\n PipelineTask *nextStage;\n\n CyclicBuffer<ObjectType, Lock,\
    \ Size> fifo;\n\n};\n```\n\nThe add job API adds data to the FIFO:\n\n```cpp\n\
    template<typename  ObjectType, typename  Lock, std::size_t  Size>\n\nvoid  PipelineTask<ObjectType,\
    \ Lock, Size>::addJob(ObjectType &data) {\n\n fifo.add(data);\n\n}\n```\n\nThe\
    \ method `doJob()` fetches data from the FIFO, increments it – I assume that the\
    \ data type supports `operator++()`, pushes the data to the next stage:\n\n```cpp\n\
    template<typename  ObjectType, typename  Lock, std::size_t  Size>\n\nvoid  PipelineTask<ObjectType,\
    \ Lock, Size>::doJob() {\n\n while (!fifo.isEmpty()) {\n\n ObjectType data;\n\n\
    \ fifo.remove(data);\n\n         data++;\n\ncout << \"Stage:\" << name << \",\
    \ data=\" << data << endl;\n\n nextStage->addJob(data);\n\n    }\n\n}\n```\n\n\
    A new type `MyPipelineTask`:\n\n```cpp\ntypedef PipelineTask<int, LockDummy, 3>\
    \ MyPipelineTask;\n```\n\nThree stages of the pipeline – the third last stage\
    \ does not have a “next”:\n\n```cpp\nMyPipelineTask pipelineTask3(\"3\");\n\n\
    MyPipelineTask pipelineTask2(\"2\", &pipelineTask3);\n\nMyPipelineTask pipelineTask1(\"\
    1\", &pipelineTask2);\n```\n\nI can invoke stages of the pipeline from interrupts\
    \ or from a main loop, for example, like this:\n\n```cpp\nvoid  testPipeline()\
    \ {\n\n int data = 0;\n\n     pipelineTask1.addJob(data);\n\n     pipelineTask1.doJob();\n\
    \n     pipelineTask2.doJob();\n\n     pipelineTask3.doJob();\n\n}\n```\n\nThe\
    \ code above generates the output:\n\nStage:1, data=1\nStage:2, data=2\nStage:3,\
    \ data=3\n\nThe pipeline paradigm can improve utilization of the CPU, pipelines\
    \ make it easier to leverage multi-core systems.\n\n## Log.\n\nPerfection is achieved,\
    \ not when there is nothing left to add, but when there is nothing left to take\
    \ away – Antoine de St. Exupery\n\nIn one C project I have seen following code\
    \ for generating log entries:\n\n```cpp\nenum {\n\n LOG_LEVEL_INFO,\n\n LOG_LEVEL_ERROR,\n\
    \n LOG_LEVEL_LAST,\n\n};\n\nstatic  const  char *LOG_LEVEL_NAME[] = {\"INFO\"\
    , \"ERROR\", “UKNOWN”};\n\n#define LOG_INFO(fmt, ...) log_print(__LINE__, LOG_LEVEL_INFO,\
    \ fmt, ##__VA_ARGS__ )\n\n#define LOG_ERROR(fmt, ...) log_print(__LINE__, LOG_LEVEL_ERROR,\
    \ fmt, ##__VA_ARGS__ )\n\nstatic  void  log_print(int line, int level, const \
    \ char *fmt, ...)\n\n{\n\n va_list ap;\n\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[level],\
    \ line);\n\n     va_start(ap, fmt);\n\n vprintf(fmt, ap);\n\n     va_end(ap);\n\
    \n}\n\nvoid  testLog(void) {\n\n     LOG_INFO(\"This is info %d\", 1);\n\n   \
    \  LOG_ERROR(\"This is error %d\", 2);\n\n}\n```\n\nOn my machine the code above\
    \ generates output:\n\nINFO: line=402, msg=This is info 1\nERROR: line=403, msg=This\
    \ is error 2\n"
