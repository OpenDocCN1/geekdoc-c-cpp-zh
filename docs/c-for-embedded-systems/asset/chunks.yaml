    \nThere are five blocks such as this one called A, B, C, D, E, F in the microcontroller.\
    \ The registers are mapped starting at the address 0xFFFFF200\\. A user wishing\
    \ to modify a write only register shall write 1 to the relevant bits. For example,\
    \ user shall write 0x04 to PIO_SODR, PIO_PER, PIO_OER to drive pin 2 (zero based)\
    \ of the PIO high. Write to the PIO registers is an atomic operation. The hardware\
    \ interface allows to change the configuration of a single bit in a thread safe\
    \ manner. The hardware provides convenient read only status registers which keep\
