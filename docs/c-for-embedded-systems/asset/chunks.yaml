  trans: "\n\n对 PIO 寄存器的访问被封装在硬件模块类方法中。`HardwarePIO` 类中的方法是修改寄存器的唯一方式。C++ 实现允许在编译时捕获其他错误操作，例如读取或写入预留寄存器。\n\
    \n在硬件模块中缓存所有写入值是非常容易。缓存或记录读写事务的一种方法是在硬件模块类中添加一个“影子”（shadow）接口字段。\n\n## 间接 I/O\
    \ 访问。\n\n在某些情况下，硬件可以通过串口接口访问。此类接口的一个例子是 `SPI`。为了简洁起见，我使用了直接访问 API。真实 SPI 设备的真实访问接口可以包含系统调用或对串口接口驱动的调用：\n\
    \n```cpp\ntemplate<typename IntegerType>\nclass HardwareDirectAccessAPI {\npublic:\n\
    \  inline uint32_t get() const {\n    return atomic_load(&value);\n  }\n  inline\
    \ void set(uint32_t value) {\n    atomic_store(&this->value, value);\n  }\nprotected:\n\
    \  volatile atomic<IntegerType> value;\n  static_assert(numeric_limits<IntegerType>::is_integer,\
    \ \"HardwareDirectAccessAPI works only with integer types\");\n};\n```\n\n我为模板类\
    \ `HardwareRegister` 添加了一个参数：\n\n```cpp\ntemplate<typename IntegerType, typename\
    \ AccessAPI>\nclass HardwareRegister {\nprotected:\n  HardwareRegister() {}\n\
    \  inline IntegerType get() const {\n    return api.get();\n  }\n  inline void\
    \ set(IntegerType value) {\n    api.set(value);\n  }\n  AccessAPI api;\n};\n```\n\
    \n用于 32 位寄存器的 `HardwareRegister` 实例，直接访问看起来如下：\n\n```cpp\nclass HardwareRegister32:\
    \ public HardwareRegister<uint32_t, HardwareDirectAccessAPI<uint32_t> > {\nprotected:\n\
    \  HardwareRegister32() {}\n};\n```\n\n其他类保持不变。\n\n# 代码 ROM 和数据 RAM。\n\n如果一开始没有成功，就把它称作版本\
    \ 1.0。\n\n有一些非常流行的硬件平台，ROM 和 RAM 的区别非常重要。此类设备的一个例子是相当流行的 8 位微控制器 `Atmega`。在 `Atmega`\
    \ MCU 中，代码不能放置在数据内存中，CPU 无法执行位于 RAM 中的代码。对代码内存中数据的任何访问都需要特殊指令。另一个例子是应用专用集成电路或\
    \ `ASICs`。`ASIC` 通常包含集成 ROM 和 RAM。集成的（也称为片上或芯片内）ROM 存储廉廉，因为在硅片上需要的空间较小。RAM 相对昂贵，因为每位内存需要更多逻辑，且集成电路（芯片）的平方英寸非常贵。RAM\
    \ 消耗的功率大得多。我认为我们周围的大多数电子设备内部都有集成 ROM 和 RAM（通常是 `SRAM`）。通常，片上 RAM 远小于 ROM。\n\n\
    ROM 有两种类型：可擦写和不可擦写。在 `Atmega` MCU 中，ROM 的不同区域可以由固件编程，前提是固件运行另一个区域。在 `ASICs` 中，ROM\
    \ 通常是不可擦写的。ROM 的编程是 ASIC 生产过程的一部分。芯片离开工厂（`FAB`）后，ROM 无法被修改。\n\n如果没有足够的 RAM 来加载固件，那么部分固件代码应该位于芯片\
    \ ROM 中。对于 `ASIC`，这意味着基于 ROM 的固件部分只能在未来的芯片版本中进行更改。现代 ASIC 固件的高复杂度使得在 ASIC 验证过程中很难达到\
    \ 100% 的代码覆盖。即使基于 ROM 的固件经过了完全验证和测试，仍有可能开发团队误解了某个协议，或者产品需求发生了变化。开发团队准备固件和硬件，是为了应对极可能出现的对\
    \ ROM 进行补丁的需求。\n\n本章涵盖了某些与 ROM 关的问题。\n\n## C++ 初始化数据。\n\n至少有一个代码段、启动程序、常量和初始化数据是\
    \ ROM 的部分。初始化的非零数据将消耗双倍内存。初始化数据的初始化值是 ROM 的一部分。通常，启动过程会将值从 ROM 复制到 RAM。如果我检查编译器生成的对象文件，可以很容易找到字符串的初始化数据。有一些工具可以帮助检查对象文件、将不同段转储到单独的文件，并为\
    \ ROM 编程准备镜像。此类工具的一个例子是 `GNU objdump`。让我们来看一些 C++ 初始化数据的实际应用。以下代码产生两行输出：“Hello,\
    \ world!”，紧接着是“Hello from main()!”。\n\n```cpp\nclass HelloWorld {\npublic:\n \
    \ HelloWorld() {\n    cout << \"Hello, world!\" << endl;\n  }\n};\nstatic HelloWorld\
    \ helloWorld;\nint main() {\n  cout << \"Hello from main()!\" << endl;\n  return\
    \ 0;\n}\n```\n\n`main()` 函数只包含一个输出。负责初始化 C++ 对象 `helloWorld` 并打印第一行的实体运行在我操作系统中的对象加载器。在嵌入式系统中，这段代码通常是启动过程的一部分。`HelloWorld`\
    \ 类的构造函数是“文本”，在 ROM 中只出现一次。`cout` 的参数（字符串）存在于内存中的两个地方：原始或“主副本”在 ROM 中，由加载器创建的第二个副本在\
    \ RAM 中。包含静态分配对象 `helloWorld` 地址的指针 `this` 也有两个副本。ROM 中有一个 `this` 指针的初始化值，RAM\
    \ 中也有 `this` 指针。在 32 位 CPU 的 ROM 中，为 `helloWorld` 对象分配的空间至少包含 4 字节的 `this` 和 14\
    \ 字节的零终止字符串。链接脚本负责代码和数据不同段的正确放置。如果 CPU 无法访问存储在代码内存中的数据，链接脚本应包含相关的分配指令。具体来说，常量数据段将被分配两次：在代码\
    \ ROM 地址空间和在 RAM 中。\n\n在通常情况下，链接脚本会添加全局变量，引用未初始化数据段 `bss` 的起始和结束地址、初始化数据，以及一个\
    \ `ctor` 函数表。通常，`ctor` 段是一个函数表，启动代码通过调用这些函数来初始化静态 C++ 对象。详细信息请参考你的链接器文档。\n\n##\
    \ ROM 补丁。\n\n编程很像性爱。犯一个错，你就得提供一辈子的支持。\n\n我想为未来的补丁准备构造函数代码。我将检查 RAM 中的某些位置。如果有非零条，我将使用那里的字符串。如果没有，我将打印默认值——即\
    \ ROM 中的那一个。\n\n```cpp\nstatic const char *helloWorldStr = 0;\nclass HelloWorld\
    \ {\npublic:\n  HelloWorld() {\n    if (helloWorldStr == 0)\n      cout << \"\
    Hello, world!\" << endl;\n    else\n      cout << helloWorldStr << endl;\n  }\n\
    };\n```\n\n加载可以打补丁的 ASIC 有两个阶段。在第一阶段，外部 CPU（也称为主机处理器）将某些固件加载到 ASIC RAM 中。有一个专用的硬件/启动固件支持将应用固件加载到\
    \ RAM 中。另一种方案是 ASIC 中的启动固件从某些外部可编程存储芯片加载应用固件，例如 `EEPROM` 或 `SPI FLASH`。第二阶段是启动程序跳转到\
    \ RAM 中的应用代码。如果主机处理器加载的代码在 `helloWorldStr` 地址处包含非零，则基于 ROM 的应用代码将打印新字符串。我将这种类型的补丁称为\
    \ A 类补丁。在 A 类补丁中，我修复函数的一部分。\n\n"
- fmt: "\nFor the patch type B I need the hardware support. If the CPU fetches an\
    \ instruction from a specific address or a range of addresses – in case of the\
    \ code below this is an address of the function `printHello()` – I want to “interrupt”\
    \ the execution and switch control to the interrupt handler located in the RAM.\
    \ Default interrupt handler does nothing. The handler is empty and simply returns\
    \ allowing the function `printHello()` to complete it's useful work. The patched\
    \ interrupt handler can modify the string “Hello, world” in the RAM before letting\
    \ the function `printHello()` to print it The interrupt handler can execute some\
    \ arbitrary code and return the control to the caller of the `printHello()`, skipping\
    \ the original print code completely.\n\n```cpp\nclass HelloWorld {\npublic:\n\
    \ HelloWorld() {\n        printHello();\n    }\nprotected:\n void  printHello()\
    \ {\ncout << \"Hello, world!\" << endl;\n    }\n};\n```\n\nFor the patch type\
    \ C I need support in the linker script. I want to place the constructor of the\
    \ `HelloWorld` in the ROM, but method `printHello()` I want to execute in the\
    \ RAM. If the `HelloWorld` constructor calls a function in the RAM I can easily\
    \ patch the function code.\n\n# Composition\n\nHave you ever noticed the difference\
    \ between a 'C' project plan, and a C++ project plan? The planning stage for a\
    \ C++ project is three times as long. Precisely to make sure that everything which\
    \ should be inherited is, and what shouldn't isn't. Then, they still get it wrong.\n\
    \nRemember the length of the average-sized 'C' project? About 6 months. Not nearly\
    \ long enough for a guy with a wife and kids to earn enough to have a decent standard\
    \ of living. Take the same project, design it in C++ and what do you get? I'll\
    \ tell you. One to two years. Isn't that great?\n\nI will attempt to write a wrapper\
    \ for the “create task” API. A typical wrapper for APIs similar to the `pthread_create`\
    \ or `FreeRTOS xTaskCreate` is based on a static method in a class called, for\
    \ example, `MyThread`. Indeed this is the only way I know to write a portable\
    \ C++ wrapper that will work for most operating systems. I will duly present a\
    \ basic example of this approach not because it is fascinating, but because it\
    \ is expected of a reasonable “C++ for embedded” book. Feel free to jump right\
    \ to the next paragraph where I present non-portable code of C++ create task wrapper.\n\
    \n## Static (class) member.\n\nC allows you to shoot yourself in the foot. C++\
    \ allows you to re-use the bullet.\n\nI am going to allocate my job thread objects\
    \ from a pool. For example an implementation of the Remote Procedure Call could\
    \ use a pool of job threads to execute procedures locally. Allocation of a thread\
    \ object from the memory pool is faster than calling the operating system API\
    \ to create a new thread. `MemoryPool` is a generic pool of objects which allocates\
    \ the objects statically. This is a reuse of the memory pool class from the previous\
    \ chapters. I am skipping the details here, such as name for the pool, debug statistics.\n\
    \n```cpp\ntemplate<typename Lock, typename ObjectType, size_t Size>\nclass MemoryPool\
    \ {\npublic:\n MemoryPool();\n ~MemoryPool() {}\n inline bool allocate(ObjectType\
    \ **obj);\n inline bool free(ObjectType *obj);\nprotected:\n Stack<ObjectType,\
    \ LockDummy, Size> pool;\n ObjectType objects[Size];\n};\n```\n\nThe stack keeps\
    \ reference to the free (not allocated) objects. The pool constructor fills the\
    \ stack of objects:\n\n```cpp\ntemplate<typename Lock, typename ObjectType, size_t\
    \ Size>\nMemoryPool<Lock, ObjectType, Size>::MemoryPool() {\n for (int i = 0;i\
    \ < Size;i++) {\n pool.push(&objects[i]);\n    }\n}\n```\n\nAllocate and free\
    \ methods call the stack `pop` and `push` API:\n\n```cpp\ntemplate<typename Lock,\
    \ typename ObjectType, size_t Size>\nbool MemoryPool<Lock, ObjectType, Size>::allocate(ObjectType\
    \ **obj) {\n bool res;\n Lock lock;\nres = pool.pop(obj);\n return res;\n}\n\n\
    template<typename Lock, typename ObjectType, size_t Size>\nbool MemoryPool<Lock,\
    \ ObjectType, Size>::free(ObjectType *obj) {\n bool res;\n Lock lock;\nres = pool.push(obj);\n\
    \ return res;\n}\n```\n\nA `JobThread` implements a “start” API and a static method\
    \ with loop forever. More realistic implementations would add “wait for completion”,\
    \ some mechanism for asynchronous notifications of the calling context that the\
    \ job is done, support for arguments for the job function.\n\n```cpp\ntemplate\
    \ <typename JobType> class JobThread {\npublic:\n JobThread();\n void start(JobType\
    \ *job);\nprotected:\n JobType *job;\n xTaskHandle pxCreatedTask;\n xQueueHandle\
    \ signal;\n static void mainLoop(JobThread *jobThread);\n};\n```\n\n`JobThread`\
    \ constructor creates a binary semaphore and spawns (this specific choice of verb\
    \ is based on “taskSpawn” which is a create task API in vxWorks) a new thread.\
    \ I am assuming FreeRTOS API in this example, but any other API would work here:\n\
    \n```cpp\ntemplate<typename JobType>\nJobThread<JobType>::JobThread() : job(nullptr)\
    \ {\n static const char *name = \"a job\";\n    vSemaphoreCreateBinary(this->signal);\n\
    \    portBASE_TYPE res = xTaskCreate((pdTASK_CODE)mainLoop, (const signed char\
    \ *)name, 300, this, 1, &this->pxCreatedTask);\n if (res != pdPASS) {\ncout <<\
    \ \"Failed to create a task\" << endl;\n    }\n}\n```\n\nThe thread entry, the\
    \ `mainLoop` method, enters the while loop and waits for the binary semaphore.\
    \ In the real code I would probably test an object variable `bool exitFlag` instead\
    \ of the condition which is always true:\n\n```cpp\ntemplate<typename JobType>\n\
    void JobThread<JobType>::mainLoop(JobThread *jobThread) {\n while (true) {\n \
    \       xSemaphoreTake(jobThread->signal, portMAX_DELAY);\n if (jobThread->job\
    \ != nullptr) {\n            jobThread->job->run();\n        }\n        jobThread->job\
    \ = nullptr;\n    }\n}\n```\n\nMethod `start` sets the job pointer and wakes up\
    \ the `mainLoop`:\n\n```cpp\ntemplate<typename JobType>\nvoid JobThread<JobType>::start(JobType\
    \ *job) {\n this->job = job;\nxSemaphoreGive(this->signal);\n}\n```\n\nIn the\
    \ example below the code prints “Print is running”:\n\n```cpp\nstruct PrintJob\
    \ {\n void run(void) {\ncout << \"Print is running\" << endl;\n    }\n};\n\nMemoryPool<LockDummy,\
    \ JobThread<PrintJob>, 3> jobThreads;\n\nPrintJob printJob;\n\nint main( void\
    \ )\n{\n JobThread<PrintJob> *jobThread;\n jobThreads.allocate(&jobThread);\n\
    \ jobThread->start(&printJob);\n vTaskStartScheduler();\n return 1;\n}\n```\n\n\
    ## Non static member.\n\n\"C makes it easy to shoot yourself in the foot; C++\
    \ makes it harder, but when you do it blows your whole leg.\"\n\nI am modifying\
    \ only two lines in the code above. The call to `xTaskCreate` gets a pointer to\
    \ a member function. The C++ compiler warns about converting of the address of\
    \ the method to a generic pointer:\n\n```cpp\nvoid *pMainLoop = (void*)&JobThread<JobType>::mainLoop;\n\
    portBASE_TYPE res = xTaskCreate((pdTASK_CODE)pMainLoop, (const signed char *)name,\
    \ 300, this, 1, &this->pxCreatedTask);\n```\n\nMain loop method is not a static\
    \ method anymore and does not need any argument:\n\n```cpp\ntemplate<typename\
    \ JobType>\nvoid JobThread<JobType>::mainLoop() {\n while (true) {\n        xSemaphoreTake(signal,\
    \ portMAX_DELAY);\n if (job != nullptr) {\n job->run();\n        }\n job = nullptr;\n\
    \    }\n}\n```\n\nThe trick works because most (all?) C++ compilers push “this”,\
    \ a pointer to the object, first to the arguments stack. The trick can fail if\
    \ C and C++ code use stack frames differently. Pointers to virtual methods can\
    \ fail too. This is always possible to use brute force – disassembly, and figure\
    \ out how to call the member function correctly. The implementation of the calls\
    \ to virtual functions differ widely between compilers. Most C++ compilers replace\
    \ the call to a virtual member with a small chunk of assembly code which calculates\
    \ the method address.\n"
