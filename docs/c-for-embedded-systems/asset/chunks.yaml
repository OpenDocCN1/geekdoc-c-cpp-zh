    \ log entry:\n\nBinaryLog::BinaryLog(void *address, int count, ...) {\n\n const\
    \  int HEADER_SIZE = 2;\n\n int header[HEADER_SIZE];\n\n    header[0] = ((uintptr_t)address)\
    \ & INTMAX_MAX;\n\n    header[1] = count;\n\n    sendDataStart();\n\n    sendData(header,\
    \ HEADER_SIZE);\n\n va_list ap;\n\n    va_start(ap, count);\n\n for (int j=0;\
    \ j < count; j++) {\n\n int arg = va_arg(ap, int);\n\n        sendData(arg);\n\
    \n    }\n\n    va_end(ap);\n\n    sendDataEnd();\n\n}\n\nThe magic macros generate\
    \ unique labels and forward the labels address to the BinaryLog constructor:\n\
    \n#define TOKEN_CAT(x, y) x ## y\n\n#define TOKEN_CAT2(x, y) TOKEN_CAT(x, y)\n\
    \n#define LABEL TOKEN_CAT2 (logLabel_, __LINE__)\n\n#define LOG_INFO(fmt, ...)\
    \ {  \\\n\n        LABEL:\\\n\n        BinaryLog(&&LABEL, ARGUMENTS_COUNT(__VA_ARGS__),\
    \ __VA_ARGS__ ); \\\n\n}\n\nA post build script shall read a map file generated\
    \ by the linker, collect list of labels according to the pattern logLabel_XX and\
    \ process format strings in the source code.\n\nIt is not done yet. I can save\
    \ one more argument – an address of the label. GCC allows to find out a return\
    \ address of the function. The functoid can look like this:\n\nclass  FastLog\
    \ {\n\npublic:\n\n FastLog(int count, ...);\n\n};\n\nThe FastLog constructor calls\
    \ __builtin_return_address() to get the return address:\n\nFastLog::FastLog(int\
    \ count, ...) {\n\n const  int HEADER_SIZE = 2;\n\n int header[HEADER_SIZE];\n\
    \n void *retAddress =\n\n       __builtin_extract_return_addr(\n\n       __builtin_return_address(0));\n\
    \n    header[0] = ((uintptr_t)retAddress) & INTMAX_MAX;\n\n    header[1] = count;\n\
    \n    sendDataStart();\n\n    sendData(header, 2);\n\n va_list ap;\n\n    va_start(ap,\
    \ count);\n\n for (int j=0; j < count; j++) {\n\n int arg = va_arg(ap, int);\n\
    \n        sendData(arg);\n\n    }\n\n    va_end(ap);\n\n    sendDataEnd();\n\n\
    }\n\nAnd the macros do not forward an address anymore:\n\n#define LOG_INFO(fmt,\
    \ ...)\\\n\n  FastLog(ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__ );\n\nIf I need\
    \ to support two or more configurable destinations – log sinks – I need only to\
    \ add to the functoid FastLoad a method which switches the destination. The logic\
    \ of the code remains encapsulated in the class. They say in the academic world\
    \ that the encapsulation is a good thing. I could convert the FastLog class into\
