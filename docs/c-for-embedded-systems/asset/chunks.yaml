    \ deal. I've got a few thousand servers waiting for me in the data center and\
    \ how do I use those with threading? – Alex Martelli.\n\nThe classical Interprocess\
    \ Communication (IPC) design pattern is a mailbox or a message queue. The mailbox\
    \ design pattern has gained popularity when Windows 3.11 and the first real-time\
    \ operating systems, such as RT Kernel and vxWorks, were a bleeding edge of the\
    \ technology. Some operating systems support the message queue API. I am going\
    \ to demonstrate a message queue that based on two primitives: a semaphore and\
    \ a FIFO. The Mailbox class is an example of “object composition” ([4],[5]). I\
    \ use “a mailbox HAS a FIFO” relationship. Alternatively, I could use “a mailbox\
    \ is a FIFO” formula and subclass – inheritance – the mailbox from the class FIFO.\
    \ It is considered a good practice not to overuse inheritance.\n\nThe mailbox\
    \ API has two methods: send a message and wait for a message ([6]):\n\ntemplate<typename\
    \  ObjectType, typename  Lock>\n\nclass  Mailbox {\n\npublic:\n\n Mailbox(const\
    \  char *name, size_t size);\n\n const  char *getName() {return  name;}\n\n inline\
    \  bool  send(ObjectType msg);\n\n enum TIMEOUT {NORMAL, NONE, FOREVER};\n\n bool\
    \  wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t timeout);\n\nprotected:\n\
    \n const  char *name;\n\n xQueueHandle  semaphore;\n\n CyclicBufferDynamic<ObjectType,\
    \ Lock> fifo;\n\n};\n\nThe mailbox constructor employs the FreeRTOS counting semaphore:\n\
    \ntemplate<typename  ObjectType, typename  Lock>\n\nMailbox<ObjectType, Lock>::Mailbox(const\
    \  char *name, size_t size) :\n\n fifo(size),\n\n name(name) {\n\n semaphore =\
    \ xSemaphoreCreateCounting(size+1, 0);\n\n}\n\nThe send method adds a message\
    \ to the FIFO and bumps the semaphore:\n\ntemplate<typename  ObjectType, typename\
    \  Lock>\n\nbool  Mailbox<ObjectType, Lock>::send(ObjectType msg) {\n\n bool res;\n\
    \nres = fifo.add(msg);\n\n    xSemaphoreGive(semaphore);\n\n return res;\n\n}\n\
    \nReceive message handles different types of the timeout:\n\ntemplate<typename\
    \  ObjectType, typename  Lock>\n\nbool  Mailbox<ObjectType, Lock>::wait(ObjectType\
    \ *msg,\n\nTIMEOUT waitType, size_t timeout) {\n\n bool res = false;\n\n    portBASE_TYPE\
    \ semaphoreRes = pdFALSE;\n\n while (semaphoreRes == pdFALSE) {\n\n if (waitType\
    \ == TIMEOUT::FOREVER) {\n\n            semaphoreRes = xSemaphoreTake(semaphore,\
    \ portMAX_DELAY);\n\n        }\n\n else  if (waitType == TIMEOUT::NORMAL) {\n\n\
                semaphoreRes = xSemaphoreTake(semaphore, timeout);\n\n break;\n\n\
            }\n\n else {\n\n            semaphoreRes = xSemaphoreTake(semaphore, 0);\n\
    \n break;\n\n        }\n\n    }\n\n if ((semaphoreRes == pdTRUE) && !fifo.isEmpty())\
    \ {\n\nres = fifo.remove(msg);\n\n    }\n\n return res;\n\n}\n\nIn the example\
    \ application an interrupt (a producer) reads data from the UART devices, and\
    \ sends the collected data to the processing task (a consumer). My message object\
    \ contains two things: a message event and some data. The consumer task is expected\
    \ to switch by the message event:\n\nenum EVENT {UART0, UART1};\n\ntypedef  struct\
    \ {\n\n enum EVENT event;\n\n size_t  data[32];\n\n int  dataSize;\n\n} Message;\n\
    \nIn the example below I reuse the memory pool from the previous chapter:\n\n\
    MemoryPool<LockDummy, Message, 3> pool;\n\nMailbox<Message*, LockDummy> myMailbox(\"\
    mbx\", 3);\n\nvoid  rxTask( void ) {\n\n    myMailbox.wait(&message,\n\n     \
    \ myMailbox.TIMEOUT::FOREVER, 0);\n\ncout << \"data=\" <<\n\n       message->data\
    \ << \", event=\" <<\n\n       message->event << endl;\n\n    pool.free(message);\n\
    \n}\n\nint  main( void ) {\n\n    Message *message;\n\n    pool.allocate(&message);\n\
    \n    message->data[0] = 0x30;\n\n    message->dataSize = 1;\n\n    message->event\
    \ = EVENT::UART0;\n\n    myMailbox.send(message);\n\n}\n\nIn many cases a modern\
    \ firmware developer will use a “pipeline”. A “pipeline is a set of data processing\
    \ elements connected in series, where the output of one element is the input of\
    \ the next one” (Wikipedia). A processing element, for example a thread, wakes\
    \ up and checks the mailbox – the job queue. If the queue is not empty, the thread\
    \ executes one stage of processing and forwards the processed data to the next\
    \ thread in the pipeline.\n\nThe pipeline task has two methods: add a new job\
    \ and process the data. A pipeline task – a stage – has a name and keeps a reference\
    \ to the next stage:\n\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
    \  Size>\n\nclass  PipelineTask {\n\npublic:\n\n PipelineTask(const  char *name,\n\
    \n PipelineTask *nextStage = nullptr) :\n\n name(name),\n\n nextStage(nextStage){}\n\
    \n void  doJob();\n\n void  addJob(ObjectType &data);\n\nprotected:\n\n const\
    \  char *name;\n\n PipelineTask *nextStage;\n\n CyclicBuffer<ObjectType, Lock,\
    \ Size> fifo;\n\n};\n\nThe add job API adds data to the FIFO:\n\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\n\nvoid  PipelineTask<ObjectType,\
    \ Lock, Size>::addJob(ObjectType &data) {\n\n fifo.add(data);\n\n}\n\nThe method\
    \ doJob() fetches data from the FIFO, increments it – I assume that the data type\
    \ supports operator++(), pushes the data to the next stage:\n\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\n\nvoid  PipelineTask<ObjectType,\
    \ Lock, Size>::doJob() {\n\n while (!fifo.isEmpty()) {\n\n ObjectType data;\n\n\
    \ fifo.remove(data);\n\n        data++;\n\ncout << \"Stage:\" << name << \", data=\"\
    \ << data << endl;\n\n nextStage->addJob(data);\n\n    }\n\n}\n\nA new type MyPipelineTask:\n\
    \ntypedef  PipelineTask<int, LockDummy, 3> MyPipelineTask;\n\nThree stages of\
    \ the pipeline – the third last stage does not have a “next”:\n\nMyPipelineTask\
    \ pipelineTask3(\"3\");\n\nMyPipelineTask pipelineTask2(\"2\", &pipelineTask3);\n\
    \nMyPipelineTask pipelineTask1(\"1\", &pipelineTask2);\n\nI can invoke stages\
    \ of the pipeline from interrupts or from a main loop, for example, like this:\n\
    \nvoid  testPipeline() {\n\n int data = 0;\n\n    pipelineTask1.addJob(data);\n\
    \n    pipelineTask1.doJob();\n\n    pipelineTask2.doJob();\n\n    pipelineTask3.doJob();\n\
    \n}\n\nThe code above generates the output:\n\nStage:1, data=1\n\nStage:2, data=2\n\
    \nStage:3, data=3\n\nThe pipeline paradigm can improve utilization of the CPU,\
    \ pipelines make it easier to leverage multi-core systems.\n\n## Log.\n\nPerfection\
    \ is achieved, not when there is nothing left to add, but when there is nothing\
    \ left to take away – Antoine de St. Exupery\n\nIn one C project I have seen following\
    \ code for generating log entries:\n\nenum {\n\n LOG_LEVEL_INFO,\n\n LOG_LEVEL_ERROR,\n\
    \n LOG_LEVEL_LAST,\n\n};\n\nstatic  const  char *LOG_LEVEL_NAME[] = {\"INFO\"\
    , \"ERROR\", “UKNOWN”};\n\n#define LOG_INFO(fmt, ...) log_print(__LINE__, LOG_LEVEL_INFO,\
    \ fmt, ##__VA_ARGS__ )\n\n#define LOG_ERROR(fmt, ...) log_print(__LINE__, LOG_LEVEL_ERROR,\
    \ fmt, ##__VA_ARGS__ )\n\nstatic  void  log_print(int line, int level, const \
    \ char *fmt, ...)\n\n{\n\n va_list ap;\n\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[level],\
    \ line);\n\n    va_start(ap, fmt);\n\n vprintf(fmt, ap);\n\n    va_end(ap);\n\n\
    }\n\nvoid  testLog(void) {\n\n    LOG_INFO(\"This is info %d\", 1);\n\n    LOG_ERROR(\"\
    This is error %d\", 2);\n\n}\n\nOn my machine the code above generates output:\n\
    \nINFO: line=402, msg=This is info 1\n\nERROR: line=403, msg=This is error 2"
