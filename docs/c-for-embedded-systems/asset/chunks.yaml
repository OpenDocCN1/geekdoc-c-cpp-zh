    \ static methods get() and release(). I carefully avoid polymorphism here, I do\
    \ not require synchronization objects to belong to the same hierarchy of classes.\
    \ The wrapper around the disable/enable interrupts API, which likely writes to\
    \ the hardware, is not going to be a child/friend/parent/relative/derivation of\
    \ a wrapper for the operating system semaphore.\n\nThis is what the API that disables\
    \ and enables interrupts looks like:\n\nstatic  inline  void  interruptDisable(void)\
    \ {\n\ncout << \"Disable\" << endl;\n\n}\n\nstatic  inline  void  interruptEnable(void)\
    \ {\n\ncout << \"Enable\" << endl;\n\n}\n\nI am describing a synchronization object.\
    \ The class implements two methods: “get” and “release”. Both methods are “inline”,\
    \ which helps the optimizer to decide if calls to the methods should be substituted\
    \ by the methods code. The end result is going to be similar to using a macro\
    \ definition in C. The default constructor in the class SynchroObject is private,\
    \ I do not want any objects of this type in the application. My C++ compiler so\
    \ far has not added any object code to my executable file.\n\nclass  SynchroObject\
    \ {\n\n SynchroObject() {};\n\npublic:\n\n static  inline  void  get() {\n\n       \
    \ interruptDisable();\n\n    }\n\n static  inline  void  release() {\n\n       \
    \ interruptEnable();\n\n    }\n\n};\n\nThe template class Lock can manipulate\
    \ any type of synchronization objects that provides a get/release API. All methods\
    \ of the template class Lock are “inline”. The C++ compiler is not going to add\
    \ any functions to the object code, but will rather replace the calls to the Lock\
    \ methods with the code of the get/release from the synchronization object.\n\n\
    template<typename  Mutex> class  Lock {\n\npublic:\n\n inline  Lock() {\n\n Mutex::get();\n\
    \n    }\n\n inline  ~Lock() {\n\n Mutex::release();\n\n    }\n\n};\n\nDeclare\
    \ a new type MyLock that uses my SynchroObject to disable/enable interrupts. There\
    \ is still no additional data or code in my executable except for the calls to\
    \ the interrupt enable and interrupt disable API.\n\ntypedef  Lock<SynchroObject>\
    \ MyLock;\n\nOutput of the function main() is going to be two words: Disable,\
    \ Enable\n\nint  main() {\n\n    {\n\n MyLock lock;\n\n    }\n\n return 0;\n\n\
    }\n\nOverhead of the wrapper around the functions that disable and enable interrupts\
    \ is exactly zero. Indeed,  if I check the disassembly, I will see two calls to\
    \ the print function in the main routine and nothing else. I have written some\
    \ C++ code which gets optimized to nothing. What did I gain? What is an added\
    \ value?\n\nThe code does not allow me to leave out enable interrupts after I\
    \ called disable interrupt. No matter how many return points or breaks out of\
    \ a loop my function has, the C++ compiler ensures that the function interruptEnable\
    \ is called exactly once.\n\n## Parallel execution.\n\nSome people, when confronted\
    \ with a problem, think, 'I know, I'll use threads' – and then two they hav erpoblems.\n\
    \nI have a quad core CPU in my system. Compiler GCC 4.8 is available for my hardware.\
    \ If I compile the code below with the compilation flag -fopenmp I will get the\
    \ output “4”:\n\nvoid  testReduction(void) {\n\n int a = 0;\n\n #pragma omp parallel\
    \ reduction (+:a)\n\n    {\n\n      a = 1;\n\n    }\n\ncout << a << endl;\n\n\
    }\n\nWithout the flag -fopenmp the output will be “1”. When the C++ compiler encounters\
    \ pragma “omp parallel”, it adds a chunk of code which spawns a “team” of threads\
    \ (in Linux POSIX pthreads) according to the number of cores in the system. The\
    \ following section is executed by the group of threads in parallel.\n\nExecution\
    \ of the following function on my system requires ~0.179s with OpenMP and ~0.322s\
    \ without OpenMP:\n\nvolatile  uint_fast8_t myArray[(size_t)512*1024*1024];\n\n\
    uint_fast32_t  testOpenMPLoop() {\n\n uint_fast32_t sum = 0;\n\n #pragma omp parallel\
    \ for reduction(+:sum)\n\n for (uint64_t i=0; i < sizeof(myArray); i++)\n\n   \
    \ {\n\n        sum += myArray[i];\n\n    }\n\n return sum;\n\n}\n\nIf the array\
    \ size is under 10M entries the OpenMP overhead kicks in and the multi-thread\
    \ version of the loop requires more time than the single thread version. OpenMP\
    \ implementation in the GCC compiler, GOMP library, calls malloc() from the C\
    \ standard library to allocate pthread threads.\n\nMy next synchronization object\
    \ is based on the OpenMP lock.\n\nI restrict the instantiation of the class to\
    \ one object. There is going to be only one instance of the class SynchroObjectOmpLock.\
    \ This design pattern is called “singleton” ([2]):\n\nclass  SynchroObjectOmpLock\
    \ {\n\npublic:\n\n static  inline  void  get();\n\n static  inline  void  release();\n\
    \n ~SynchroObjectOmpLock();\n\nprotected:\n\n omp_lock_t  lock;\n\n static  SynchroObjectOmpLock\
    \ *instance;\n\n inline  SynchroObjectOmpLock();\n\n};\n\nSynchroObjectOmpLock\
    \ *SynchroObjectOmpLock::instance\n\n= new  SynchroObjectOmpLock();\n\nThe rest\
    \ of the class methods:\n\nvoid  SynchroObjectOmpLock::get() {\n\n omp_set_lock(&instance->lock);\n\
    \n}\n\nvoid  SynchroObjectOmpLock::release() {\n\n omp_unset_lock(&instance->lock);\n\
    \n}\n\nSynchroObjectOmpLock::SynchroObjectOmpLock() {\n\n omp_init_lock(&lock);\n\
    \n}\n\nSynchroObjectOmpLock::~SynchroObjectOmpLock() {\n\n omp_destroy_lock(&instance->lock);\n\
    \n}\n\nI have a new type – a lock which is based on the OpenMP synchronization\
    \ object:\n\ntypedef  Lock<SynchroObjectOmpLock> LockOmp;\n\nAnd usage example:\n\
    \n    {\n\n LockOmp lock;\n\n    }\n\n## Containers.\n\nWhen your hammer is C++,\
    \ everything begins to look like a thumb.\n\nStandard template library (STL) contains\
    \ a lot of smart and very convenient code dealing with vectors, stacks, queues,\
    \ hash tables, trees, and many other types of dynamic and static data storage.\
    \ Unfortunately, a firmware developer often needs something different. There are\
    \ cases when high performance and small code/data footprint should coexist in\
    \ one application. In this chapter I will demonstrate a container which makes\
    \ sense in an embedded system with limited resources. The API should be reentrant\
    \ and allow safe concurrent access. The performance of the container is going\
    \ to be at least not worse than an alternative implementation in the C language.\
    \ All memory allocations are going to be static and done at build time – I will\
    \ deal with the dynamic allocations later in this book.\n\n### Cyclic buffer.\n\
    \nAsking from C++ programmers more content, less bloat is unfair."
