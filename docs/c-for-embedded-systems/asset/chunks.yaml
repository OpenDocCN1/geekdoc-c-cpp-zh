    \n bool res = (cyclicBuffer->head == tail);\n\nreturn res;\n\n}\n\nstatic inline\
    \ void errorOverflow() {\n\n}\n\nstatic inline void errorUnderflow() {\n\n}\n\n\
    static inline bool CyclicBufferAdd(CyclicBuffer* cyclicBuffer, const CYCLIC_BUFFER_OBJECT_TYPE\
    \ object) {\n\n if (!CyclicBufferIsFull(cyclicBuffer)) {\n        cyclicBuffer->data[cyclicBuffer->tail]\
    \ = object;\n        cyclicBuffer->tail = CyclicBufferIncrement(cyclicBuffer->tail,\
    \ CYCLIC_BUFFRE_SIZE);\n return true;\n} else {\n        errorOverflow();\n return\
    \ false;\n    }\n}\n\nstatic inline bool CyclicBufferRemove(CyclicBuffer* cyclicBuffer,\
    \ CYCLIC_BUFFER_OBJECT_TYPE* object) {\n\n if (!CyclicBufferIsEmpty(cyclicBuffer))\
    \ {\n        *object = cyclicBuffer->data[cyclicBuffer->head];\n        cyclicBuffer->head\
    \ = CyclicBufferIncrement(cyclicBuffer->head, CYCLIC_BUFFRE_SIZE);\n return true;\n\
    } else {\n        errorUnderflow();\n return false;\n    }\n}\n```\n\n函数 `main`\
    \ 输出数字 0,1,2,3\n\n```cpp\nint main() {\n\n for (int i = 0;i < 4;i++) {\n     \
    \   CyclicBufferAdd(&myCyclicBuffer, i);\n    }\n uint8_t val;\n\n while (CyclicBufferRemove(&myCyclicBuffer,\
    \ &val)) {\n        cout << (int) val << endl;\n    };\n return 0;\n}\n```\n\n\
    这段代码具有一些局限性。只有操作相同整数类型的循环缓冲区才能在同一个 C 源文件中使用。添加/删除函数只能在一个 C 文件中定义一次。\n\n对应的汇编代码包含调用\
