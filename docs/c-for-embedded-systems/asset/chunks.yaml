    \ it requires more logic per bit of memory and square inches on the integrated\
    \ circuit (die) come at premium. RAM consumes significantly more power. I think\
    \ that the vast majority of the electronic device around us have integrated ROM\
    \ and RAM (frequently SRAM) inside. Typically the on chip RAM is much smaller\
    \ than the ROM.\n\nThere are two types of ROM: erasable and not erasable. In the\
    \ Atmega MCUs different areas of the ROM can be programmed by the firmware, assuming\
    \ that the firmware runs from another area. In case of ASICs the ROM is often\
    \ not erasable. Programming of the ROM is a part of the ASIC production process.\
    \ The ROM can not be modified after the chip leaves the factory (the FAB).\n\n\
    If there is not enough RAM to load the firmware, then parts of the firmware code\
    \ should be located in the chip ROM. In case of an ASIC it means that the ROM\
    \ based parts of the firmware can be changed only in the future versions of the\
    \ chip. High complexity of the modern ASIC firmware makes it very hard to reach\
    \ 100% code coverage in the ASIC verification process. Even if the ROM based firmware\
    \ is verified and tested completely, still there is a chance that this or that\
    \ protocol has been misunderstood by the development team, or product requirements\
    \ has changed. The development team prepares the firmware and the hardware for\
    \ the not unlikely event that a need to patch the ROM will arise.\n\nThis chapter\
    \ covers some of the ROM related problems.\n\n## C++ Initialized data.\n\nAt least\
    \ one code section, a boot, constants and initialized data are parts of the ROM.\
    \ Initialized, non-zero data is going to consume memory two times. Initialization\
    \ values of the initialized data are part of the ROM. Usually boot process copies\
    \ the values from the ROM to the RAM. If I inspect an object file generated by\
    \ a compiler, I can easily find initialization data for the strings. There are\
    \ utilities which help to inspect the object files, dump different section into\
    \ separate files, and prepare the images for the ROM programming. One example\
    \ of such utility is GNU objdump. Let's see some C++ initialized data in action.\
    \ Following code produces two lines of output: “Hello, world!”, followed by “Hello\
    \ from main()!”\n\nclass  HelloWorld {\n\npublic:\n\n HelloWorld() {\n\ncout <<\
    \ \"Hello, world!\" << endl;\n\n    }\n\n};\n\nstatic  HelloWorld helloWorld;\n\
    \nint  main()\n\n{\n\ncout << \"Hello from main()!\" << endl;\n\n return 0;\n\n\
    }\n\nThe function main() contains only one output. The entity responsible for\
    \ initializing of the C++ object helloWorld and printing the first line is an\
    \ object loader running in my operating system. In case of the embedded systems\
    \ this code is usually part of the boot process. The constructor of the HelloWorld\
    \ class is “text” and appears only once in the ROM. Arguments of the cout, the\
    \ strings, can exist in two places in the memory: original or “master copy” is\
    \ in the ROM, a second copy, created by the loader, is in the RAM. Pointer “this”\
    \ which contains address of the statically allocated object helloWorld has two\
    \ copies too. There is an initialization value for “this” pointer in the ROM and\
    \ “this” pointer in the RAM.  Size allocated by helloWorld object in the ROM of\
    \ 32 bits CPU is at least 4 bytes of “this” and 14 bytes of the zero terminated\
    \ string. The linker script is responsible for correct placement of different\
    \ sections of the code and the data. If the CPU can not access data stored in\
    \ the code memory, the linker script should contain relevant allocation instructions.\
    \ Specifically place for the constant data section will be allocated two times:\
    \ in the code ROM address space and in the RAM. \n\nIn a typical case, a linker\
    \ script will add global variables that reference the start and the end address\
    \ of the not initialized data section(s) “bss”, initialized data, and a table\
    \ of “ctor” functions. Usually the ctor section is a table or tables of functions\
    \ that the boot code calls to initialize static C++ objects. See your linker documentation\
    \ for details.\n\n## ROM patching.\n\nProgramming is a lot like sex. One mistake\
    \ and you're providing support for a lifetime.\n\nI want to prepare the constructor\
    \ code for a patch in the future. I will check some location in the RAM. If there\
    \ is a non-zero entry, then I will use the string from there. If not, I will print\
    \ the default value – the ROMed one.\n\nstatic  const  char *helloWorldStr = 0;\n\
    \nclass  HelloWorld {\n\npublic:\n\n HelloWorld() {\n\n if (helloWorldStr == 0)\n\
    \ncout << \"Hello, world!\" << endl;\n\n else\n\ncout << helloWorldStr << endl;\n\
    \n    }\n\n};\n\nLoading of an ASIC which can be patched contains two stages.\
    \ In the first phase external CPU (also called a host processor) loads some firmware\
    \ to the ASIC RAM. There is a dedicated hardware/boot firmware supporting load\
    \ of the application firmware to the RAM. An alternative can be that the boot\
    \ code in the ASIC loads the application firmware from some external programmable\
    \ memory chip, for example, EEPROM or SPI FLASH. The second phase is when the\
    \ boot jumps to the application code in the RAM. If the code loaded by the host\
    \ processor contains non-zero at the address helloWorldStr the ROM based application\
    \ code will print a new string. I am calling this type of patch a patch type A.\
    \ In the patch type A I fix a part of the function."
