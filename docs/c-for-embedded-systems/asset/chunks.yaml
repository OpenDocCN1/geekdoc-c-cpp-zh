    \ It is not done yet. I can save one more argument – an address of the label.\
    \ GCC allows to find out return address of the function. The functoid can look\
    \ like this:\n\n```cpp\nclass FastLog {\npublic:\n FastLog(int count, ...);\n\
    };\n```\n\nThe `FastLog` constructor calls `__builtin_return_address()` to get\
    \ the return address:\n\n```cpp\nFastLog::FastLog(int count, ...) {\n const  int\
    \ HEADER_SIZE = 2;\n int header[HEADER_SIZE];\n void *retAddress =\n      __builtin_extract_return_addr(\n\
    \      __builtin_return_address(0));\n    header[0] = ((uintptr_t)retAddress)\
    \ & INTMAX_MAX;\n    header[1] = count;\n    sendDataStart();\n    sendData(header,\
    \ 2);\n va_list ap;\n    va_start(ap, count);\n for (int j=0; j < count; j++)\
    \ {\n int arg = va_arg(ap, int);\n      sendData(arg);\n    }\n    va_end(ap);\n\
    \    sendDataEnd();\n}\n```\n\nAnd the macros do not forward an address anymore:\n\
    \n```cpp\n#define LOG_INFO(fmt, ...)\n  FastLog(ARGUMENTS_COUNT(__VA_ARGS__),\
