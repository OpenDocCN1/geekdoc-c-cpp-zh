  raw: "When I call the system log from interrupts I need to disable the interrupts.\
    \ For the task level system log a mutex is probably adequate. The C alternative\
    \ with the similar performance would require a macro.\n\n## Software Timers.\n\
    \nC++: Hard to learn and built to stay that way.\n\nSo far I have demonstrated\
    \ fairly simple software components, such as a mutex or a cyclic buffer. In this\
    \ chapter I am going to implement a software timer.\n\nModern operating systems\
    \ provide timers API. Typically an application can start a timer with arbitrary\
    \ expiration time. When the timer expires the operating system calls the application\
    \ hook from a dedicated timer thread or a system interrupt. Performance of such\
    \ API can degrade quickly if an application starts a lot of different timers.\
    \ There is usually no control over the priority of the process which handles the\
    \ timers. The API presented here allows an application to handle all timer related\
    \ code in a single context or in multiple contexts running with different priorities.\n\
    \nThe software timers API will have O(1) complexity. The API is going to be thread\
    \ safe. The source code for the software timer can be found in [9].\n\nYou already\
    \ know the object-oriented design routine. Let's declare a timer object first.\
    \ A timer object keeps a unique timer identifier.\n\nA unique timer identifier\
    \ can be used to solve possible race conditions between stopTimer and timerExpired.\
    \ Consider following scenario: timer “a” is started by context A. Timer “a” is\
    \ stopped by context A, but too late - timer “a” has just expired and the application\
    \ code handling the expiration is running. Depending on the implementation of\
    \ the application callback, the processing of the event can be done asynchronously.\
    \ Meanwhile the same timer object can be allocated and modified by context B,\
    \ a different thread. If context A keeps identities of all started timers, the\
    \ application callback can check if the timer identifier is on the list of running\
    \ timers. If the timer was stopped, the callback can ignore the timer expiration.\
    \ Using the reference to the timer object itself for such bookkeeping is not good\
    \ because the pool of timer objects is probably a shared resource.\n\nWhen starting\
    \ a timer the user can supply optional pointer to the application data, a cookie.\
    \ The timer class could be a template like this:\n\ntemplate<typename  CookieType>\
    \ class  Timer {\n\nprotected:\n\n CookieType  cookie;\n\n};\n\nI want to simplify\
    \ the interface and avoid using of virtual methods – more on virtual methods in\
    \ a moment – in the timer objects. Instead of objects of an arbitrary type a timer\
    \ object will keep a pointer to the application data.\n\nA user can access the\
    \ timer's data only via the public methods: getters and setters. This approach\
    \ helps to maintain the code in the future.\n\nThe class Timer implements a constructor\
    \ without arguments. I want to be able to create a static array of timers without\
    \ too much of trouble. The TimerList class, which is not declared yet, is a friend\
    \ class of the class Timer and can call protected methods of the Timer. Method\
    \ start() is protected, because application shall start timers using the TimerList\
    \ methods.\n\nclass  Timer {\n\npublic:\n\n Timer();\n\n inline  void  stop();\n\
    \n bool  isRunning() const;\n\n TimerID  getId() const;\n\n inline  uintptr_t\
    \  getApplicationData() const;\n\n SystemTime  getStartTime() const;\n\nprotected:\n\
    \n friend  class  TimerList;\n\n TimerID  id;\n\n uintptr_t  applicationData;\n\
    \n bool  running;\n\n SystemTime  startTime;\n\n inline  void  start();\n\n inline\
    \  void  setApplicationData(uintptr_t applicationData);\n\n inline  void  setId(TimerID\
    \ id);\n\n inline  void  setStartTime(SystemTime systemTime);\n\n};\n\nThe implementation\
    \ of the methods is straightforward:\n\nTimer::Timer() {\n\n    stop();\n\n}\n\
    \nTimerID  Timer::getId() const {\n\n return  id;\n\n}\n\nSystemTime  Timer::getStartTime()\
    \ const {\n\n return  startTime;\n\n}\n\nbool  Timer::isRunning() const {\n\n\
    \ return  running;\n\n}\n\nvoid  Timer::stop() {\n\n running = false;\n\n}\n\n\
    void Timer::start() {\n\n running = true;\n\n}\n\nvoid  Timer::setApplicationData(uintptr_t\
    \ applicationData) {\n\n this->applicationData = applicationData;\n\n}\n\nuintptr_t\
    \  Timer::getApplicationData() const {\n\n return  applicationData;\n\n}\n\nvoid\
    \  Timer::setId(TimerID id) {\n\n this->id = id;\n\n}\n\nvoid  Timer::setStartTime(SystemTime\
    \ systemTime) {\n\n this->startTime = systemTime;\n\n}\n\nThe system time is often\
    \ a tick incremented by an interrupt or read from the hardware. In this example\
    \ I use size_t type. In a more advanced design the System Time type and the Timeout\
    \ type could be two classes. The timer API only needs a function with the signature\
    \ “bool isTimerExpired(SystemTime, Timeout, SystemTime)”. In the following implementation\
    \ I handle SystemTime wrap around, assuming that timers timeouts are small relatively\
    \ to the SystemTime maximum value.\n\ntypedef  size_t  SystemTime;\n\ntypedef\
    \  size_t  Timeout;\n\nstatic  inline  bool  isTimerExpired(SystemTime startTime,\
    \ Timeout timeout,\n\n SystemTime currentTime) {\n\n bool timerExpired = false;\n\
    \n SystemTime timerExpiartionTime = startTime + timeout;\n\n    timerExpired =\
    \ timerExpired\n\n            || ((timerExpiartionTime >= currentTime)\n\n                   \
    \ && (startTime < currentTime));\n\n    timerExpired = timerExpired\n\n           \
    \ || ((timerExpiartionTime >= currentTime)\n\n                    && (startTime\
    \ > currentTime));\n\n    timerExpired = timerExpired\n\n            || ((timerExpiartionTime\
    \ <= currentTime)\n\n                    && (startTime > currentTime)\n\n                   \
    \ && (timerExpiartionTime < startTime));\n\n return timerExpired;\n\n}\n\nMy API\
    \ has an enumeration of possible return codes of the C+11 kind. C++11 “enum class”\
    \ is not an integer and can not be converted to an integer. A member of one enumeration\
    \ can not be assigned to a member of another enumeration.\n\nenum  class TimerError\
    \ {\n\n Ok, Expired, Stopped, Illegal, NoFreeTimer, NoRunningTimers\n\n};\n\n\
    I need an application callback which handles timer expiration. The callback could\
    \ be a template function in a more advanced design:\n\ntypedef  void (*TimerExpirationHandler)(const\
    \  Timer& timer);\n\nI am going to provide a synchronization API via an argument\
    \ to the constructor. In the base class TimerLock I set the get/release interface\
    \ to zero. The lock API is going to be implemented by the derivative. Typical\
    \ performance overhead of a virtual function is 1 or 2 opcodes.\n\nclass  TimerLock\
    \ {\n\npublic:\n\n virtual  void  get() = 0;\n\n virtual  void  release() = 0;\n\
    \nprotected:\n\n virtual  ~TimerLock() {}\n\n};\n\nclass  TimerLockDummy : public\
    \  TimerLock {\n\npublic:\n\n virtual  void  get() {}\n\n virtual  void  release()\
    \ {}\n\nprotected:\n\n};\n\nI need a cyclic buffer that uses the dynamic allocation\
    \ from the heap via operator new[]. In the previous chapters I have discussed\
    \ the operator new[] and situations when an allocation from the memory heap is\
    \ not possible.\n\ntemplate<typename  ObjectType, typename  Lock>\n\nclass  CyclicBufferDynamic\
    \ {\n\npublic:\n\n inline  CyclicBufferDynamic(size_t size);\n\n ~CyclicBufferDynamic()\
    \ {\n\n    }\n\n inline  bool  isEmpty();\n\n inline  bool  isFull();\n\n inline\
    \  bool  add(ObjectType object);\n\n inline  bool  remove(ObjectType *object);\n\
    \n inline  bool  getHead(ObjectType *object);\n\nprivate:\n\n void  errorOverflow()\
    \ {\n\n    }\n\n void  errorUnderflow() {\n\n    }\n\n size_t  increment(size_t\
    \ index);\n\n ObjectType *data;\n\n size_t  head;\n\n size_t  tail;\n\n size_t\
    \  size;\n\n};\n\nConstructor calls the operator new[] to allocate array of pointers.\
    \ There is a static assert which insures that the template class is used only\
    \ for pointers:\n\ntemplate<typename  ObjectType, typename  Lock>\n\ninline  CyclicBufferDynamic<ObjectType,\
    \ Lock>::\n\nCyclicBufferDynamic(size_t size) {\n\n this->head = 0;\n\n this->tail\
    \ = 0;\n\n this->size = size;\n\n this->data = new  ObjectType[size];\n\n static_assert(sizeof(ObjectType)\
    \ <= sizeof(uintptr_t), \"CyclicBuffer is intended to work only with integer types\
    \ or pointers\");\n\n}\n\nThe rest of the code is similar to the previous implementation:"
