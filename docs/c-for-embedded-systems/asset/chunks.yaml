    \ dmaAllocator(dmaMemoryRegion, 63, 3, 2);\n\nMy memory pool is a stack of data\
    \ blocks. The class contains allocate/free API, some debug statistics. Every memory\
    \ pool has a name. Providing a name for the objects is useful for logging and\
    \ printing debug statistics. The stack in the memory pool is intentionally protected\
    \ by a LockDummy and is not thread safe. I am going to use a real synchronizer\
    \ in the memory pool methods.\n\nClass methods with “const” keyword in the signature,\
    \ for example resetMaxInUse(), can not alter any member of the class. How comes\
    \ that resetMaxInUse() changes the statistics field anyway?. Field “statistics”\
    \ is mutable and this allows the “const” methods to modify it. Debug counters\
    \ is a book example of using of the keyword “mutable”. Method resetMaxInUse()\
    \ does not affect (not in a meaningfull way) the visible state of the object.\n\
    \ntemplate<typename  Lock, size_t  Size>\n\nclass  MemoryPoolRaw {\n\npublic:\n\
    \n MemoryPoolRaw(const  char* name,\n\n MemoryAllocatorRaw* memoryAllocator);\n\
    \n ~MemoryPoolRaw() {\n\n memoryAllocator->reset();\n\n    }\n\n inline  void\
    \  resetMaxInUse() const {\n\n statistics.maxInUse = 0;\n\n    }\n\n typedef \
    \ struct {\n\n uint32_t  inUse;\n\n uint32_t  maxInUse;\n\n uint32_t  errBadBlock;\n\
    \n} Statistics;\n\n inline  bool  allocate(uint8_t** block);\n\n inline  bool\
    \  free(uint8_t* block);\n\n inline  const  Statistics &getStatistics(void) const\
    \ {return  statistics;}\n\nprotected:"
