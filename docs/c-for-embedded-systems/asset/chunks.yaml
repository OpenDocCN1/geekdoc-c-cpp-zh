  trans: "\n\n我的第一个示例是一个循环缓冲区（cyclic buffer），它也被称为环形缓冲区（ring buffer）。生产者”向循环缓冲区的“尾部”（tail）添加对象，而“消费者”则从循环缓冲区的“头部”（head）提取对象。生产者的示例可以是一个中断服务程序，它从\
    \ UART 设备（RS232 端口）获取字符。“消费者”则是从应用程序主循环中调用的函数，用于处理来自 UART 的到达命令。`CyclicBuffer`\
    \ 类是一个模板类，它应该帮助优化器为给定的整数类型和 CPU 架构生成尽可能高效的代码。\n\n```cpp\ntemplate<typename  ObjectType,\
    \ typename  Lock, std::size_t  Size>\n\nclass CyclicBufferSimple {\npublic:\n\
    \ CyclicBufferSimple();\n ~CyclicBufferSimple() {}\n inline  bool add(const ObjectType\
    \ object);\n inline  bool remove(ObjectType &object);\n inline  bool isEmpty();\n\
    \ inline  bool isFull();\n\nprivate:\n inline size_t increment(size_t index);\n\
    \ inline  void errorOverflow() {}\n inline  void errorUnderflow() {}\n ObjectType\
    \  data[Size + 1];\n size_t  head;\n size_t  tail;\n};\n```\n\n如果应用程序尝试在缓冲区中存储整数以外的任何内容，`CyclicBufferSimple`构造函数会导致构建失败。对于给定\
    \ CPU 架构上大于整数尺寸的对象，可能应该有不同的 API。\n\n```cpp\ntemplate<typename  ObjectType, typename\
    \  Lock, std::size_t  Size>\n\nCyclicBufferSimple<ObjectType, Lock, Size>::CyclicBufferSimple()\
    \ {\n#if (__cplusplus >= 201103)\n static_assert(std::numeric_limits<ObjectType>::is_integer,\
    \ \"CyclicBuffer is intended to work only with integer types\");\n#elif defined(__GNUC____)\n\
    \ __attribute__((unused)) ObjectType val1 = 1;\n#else\n volatile ObjectType val1;\n\
    \    *(&val1) = 1;\n#endif\n this->head = 0;\n this->tail = 0;\n}\n```\n\n有两个方法返回缓冲区状态：\n\
    \n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\
    inline  bool  CyclicBufferSimple<ObjectType, Lock, Size>::isEmpty() {\n bool res\
    \ = (this->head == this->tail);\n return res;\n}\n\ntemplate<typename  ObjectType,\
    \ typename  Lock, std::size_t  Size>\ninline  bool  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::isFull() {\n size_t tail = increment(this->tail);\n bool res =\
    \ (this->head == tail);\n return res;\n}\n```\n\n一个处理缓冲区索引回回的方法：\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\ninline  size_t  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::increment(size_t index) {\n if (index < Size) {\n return (index\
    \ + 1);\n} else {\n return 0;\n    }\n}\n```\n\n循环缓冲区的添加/删除 API：\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\ninline  bool  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::add(const ObjectType object) {\n Lock lock;\n if (!isFull()) {\n\
    \ data[this->tail] = object;\n this->tail = increment(this->tail);\n return  true;\n\
    } else {\n        errorOverflow();\n return  false;\n    }\n}\n\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\ninline  bool  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::remove(ObjectType &object) {\n Lock lock;\n if (!isEmpty()) {\n\
    object = data[this->head];\n this->head = this->increment(this->head);\n return\
    \  true;\n} else {\n        errorUnderflow();\n return  false;\n    }\n}\n```\n\
    \n实例化新类型 – 一个无所操作的锁：\n\n`typedef Lock<SynchroObjectDummy> LockDummy;`\n\n以下函数返回循环缓冲区中的元素数量。如果值无法在构建时计算，编译器将失败：\n\
