    \ = lhs.v - rhs.v;return r;}\n  friend T operator*(T lhs, const T &rhs) {\n  \
    \  T r;\n    r.v = (lhs.v * rhs.v) / scale;\n    return r;\n  }\nprivate:\n  IntType\
    \ v;\n  enum { scale = 1 << FRACTION_BITS };\n};\n```\n\n"
