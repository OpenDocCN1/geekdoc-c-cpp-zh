  trans: "\n\n在 `main()` 函数中，编译器将调用输出函数两次，不会添加任何其他代码。当变量 `myDummyLock` 的作用域结束时，锁会被释放——调用析构函数\
    \ `~LockDummy`。该作用域可以 `while` 循环。我不需要在函数每次返回之前调用“unlock”。C++ 编译器会确保析构函数总是被调用，且只被调用一次（更多关于\
    \ RAII 的信息请参见 [1]）。这种便利的服务不会产生任何性能开销。以下代码的输出将是：\n\nLocked context\n\nProtected\
    \ context\n\nLock is freed\n\n```cpp\nint testDummyLock() {\n#if (__cplusplus\
    \ >= 201103) // 如果 C++11 或更高版本使用 \"auto\"\n  auto myDummyLock = LockDummySimple();\n\
    #else\n    LockDummySimple myDummyLock = LockDummySimple();\n#endif\n\n  cout\
    \ << \"Protected context\" << endl;\n  return 0;\n}\n```\n\n我想通过另一个例子来强调这个观点。在下面的代码中，我在锁变量的声明周围设置了一个作用域。代码的输出将是：\n\
    \nLocked context\n\nProtected context\n\nLock is freed\n\nEnd of main\n\n```cpp\n\
    int main() {\n    {\n        LockDummy lock;\n        cout << \"Protected context\"\
    \ << endl;\n    }\n    cout << \"End of main\" << endl;\n    return 0;\n}\n```\n\
    \n我的第二个锁是一个更真实的锁，它会禁用硬件中断。我假设有一个可以禁用和启用中断的 API。我正在对原始锁代码进行一些重构。首先，我使用模板，这是 C++\
    \ 的一个特性，允许你声明一个对泛型操作的类。我将重用模板 `Lock` 中的代码来处理不同的同步对象。模板 `Lock` 中的代码可以操作任何实现了两个公共方法（静态方法\
    \ `get()` 和 `release()`）的结构体或类。在这里我仔细地避免了多态，我不要求同步对象属于同一个类层次结构。禁用/启用中断 API 的封装器（它可能会写入硬件）不会是操作系统信号量封装器的子类/朋友/父类/关系/派生类。\n\
    \n禁用和启用中断的 API 如下：\n\n```cpp\nstatic inline void interruptDisable(void) {\n  cout\
    \ << \"Disable\" << endl;\n}\n\nstatic inline void interruptEnable(void) {\n \
    \ cout << \"Enable\" << endl;\n}\n```\n\n我正在描述一个同步对象。该类实现了两个方法：“get”和“release”。这两个方法都是“inline”的，这有助于优化器决定是否应该将方法的调用替换为方法的代码。最终结果将类似于在\
    \ C 中使用宏定义。`SynchroObject` 类中的默认构造函数是私有的，我不希望应用程序中出现这种类型的对象。到目前为止，我的 C++ 编译器还没有向我的执行文件添加任何对象代码。\n\
    \n```cpp\nclass SynchroObject {\n    SynchroObject() {};\npublic:\n    static\
    \ inline void get() {\n        interruptDisable();\n    }\n    static inline void\
    \ release() {\n        interruptEnable();\n    }\n};\n```\n\n模板类 `Lock` 可以操作任何提供\
    \ `get/release` API 的同步对象类型。模板类 `Lock` 的所有方法都是“inline”的。C++ 编译器不会向对象代码添加任何函数，而是会将对\
    \ `Lock` 方法的调用替换为同步对象的 `get/release` 代码。\n\n```cpp\ntemplate<typename Mutex> class\
    \ Lock {\npublic:\n    inline Lock() {\n        Mutex::get();\n    }\n    inline\
    \ ~Lock() {\n        Mutex::release();\n    }\n};\n```\n\n声明一个新类型 `MyLock`，它使用我的\
    \ `SynchroObject` 来禁用/启用中断。除了对中断启用和禁用中断 API 的调用外，我的执行文件中没有额外的数据或代码。\n\n```cpp\n\
    typedef Lock<SynchroObject> MyLock;\n```\n\n`main()` 函数的输出将是两个单词：Disable, Enable\n\
    \n```cpp\nint main() {\n    {\n        MyLock lock;\n    }\n    return 0;\n}\n\
    ```\n\n禁用和启用中断函数的封装开销完全为零。事实上，如果我检查反汇编，我会在主程序中看到两次对打印函数的调用，外无他物。我写了一些 C++ 代码，它们被优化成了空。我获得了什么？增值价值是什么？\n\
    \n这段代码没有允许我在调用禁用中断后忘记启用中断。无论我的函数有多少个返回点或跳出循环的地方，C++ 编译器都会确保 `interruptEnable`\
    \ 函数恰恰被调用一次。\n\n## 并行执行。\n\n有些人人在面对问题时，会想：“我知道了，我将使用线程”——然后他们就出了问题。\n\n我的系统中有一个四核\
    \ CPU。我的硬件支持 GCC 4.8 编译器。如果我使用编译标记 `-fopenmp` 编译下面的代码，我将得到输出“4”：\n\n```cpp\nvoid\
    \ testReduction(void) {\n  int a = 0;\n  #pragma omp parallel reduction (+:a)\n\
    \    {\n      a = 1;\n    }\n  cout << a << endl;\n}\n```\n\n如果没有 `-fopenmp` 标记，输出将是“1”。当\
    \ C++ 编译器遇到 pragma “omp parallel” 时，它会添加一段代码，根据系统中的核心数产生一个线程“团队”（在 Linux POSIX\
    \ pthreads 中）。接下来的部分由线程组并行执行。\n\n在我的系统上执行以下函数，使用 OpenMP 需要 ~0.179s，而不使用 OpenMP\
    \ 则需要 ~0.322s：\n\n```cpp\nvolatile uint_fast8_t myArray[(size_t)512*1024*1024];\n\
    uint_fast32_t testOpenMPLoop() {\n  uint_fast32_t sum = 0;\n  #pragma omp parallel\
    \ for reduction(+:sum)\n  for (uint64_t i=0; i < sizeof(myArray); i++)\n    {\n\
    \      sum += myArray[i];\n    }\n  return sum;\n}\n```\n\n如果数组大小小于 1000 万条目，OpenMP\
    \ 会启动，而单线程版本需要更的时间。\n\n"
- fmt: "\nMy first example is going to be a cyclic buffer, which is also known as\
    \ a ring buffer. A “producer” adds objects to the “tail” of the cyclic buffer\
    \ and a “consumer” pulls the objects from the “head” of the cyclic buffer. An\
    \ example of producer can be an interrupt routine which gets characters from an\
    \ UART device (RS232 port). A “consumer” is a function called from the application\
    \ main loop which handles commands arriving from the UART. The `CyclicBuffer`\
    \ class is a template class, which should help the optimizer to generate the most\
    \ efficient code possible for the given integer type and the CPU architecture.\n\
    \n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\n\
    class CyclicBufferSimple {\npublic:\n CyclicBufferSimple();\n ~CyclicBufferSimple()\
    \ {}\n inline  bool add(const ObjectType object);\n inline  bool remove(ObjectType\
    \ &object);\n inline  bool isEmpty();\n inline  bool isFull();\n\nprivate:\n inline\
    \ size_t increment(size_t index);\n inline  void errorOverflow() {}\n inline \
    \ void errorUnderflow() {}\n ObjectType  data[Size + 1];\n size_t  head;\n size_t\
    \  tail;\n};\n```\n\nThe `CyclicBufferSimple` constructor will fail the build\
    \ if the application attempts to store in the buffer anything but integer. Storage\
    \ for the objects larger than the size of the integer on the given CPU architecture\
    \ should probably have a different API.\n\n```cpp\ntemplate<typename  ObjectType,\
    \ typename  Lock, std::size_t  Size>\n\nCyclicBufferSimple<ObjectType, Lock, Size>::CyclicBufferSimple()\
    \ {\n#if (__cplusplus >= 201103)\n static_assert(std::numeric_limits<ObjectType>::is_integer,\
    \ \"CyclicBuffer is intended to work only with integer types\");\n#elif defined(__GNUC____)\n\
    \ __attribute__((unused)) ObjectType val1 = 1;\n#else\n volatile ObjectType val1;\n\
    \    *(&val1) = 1;\n#endif\n this->head = 0;\n this->tail = 0;\n}\n```\n\nThere\
    \ are two methods returning the buffer state:\n\n```cpp\ntemplate<typename  ObjectType,\
    \ typename  Lock, std::size_t  Size>\ninline  bool  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::isEmpty() {\n bool res = (this->head == this->tail);\n return res;\n\
    }\n\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\ninline\
    \  bool  CyclicBufferSimple<ObjectType, Lock, Size>::isFull() {\n size_t tail\
    \ = increment(this->tail);\n bool res = (this->head == tail);\n return res;\n\
    }\n```\n\nA method handling wrap around of the buffer index:\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\ninline  size_t  CyclicBufferSimple<ObjectType,\
    \ Lock, Size>::increment(size_t index) {\n if (index < Size) {\n return (index\
    \ + 1);\n} else {\n return 0;\n    }\n}\n```\n\nAdd/remove API of the cyclic buffer:\n\
    \n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t  Size>\n\
    inline  bool  CyclicBufferSimple<ObjectType, Lock, Size>::add(const ObjectType\
    \ object) {\n Lock lock;\n if (!isFull()) {\n data[this->tail] = object;\n this->tail\
    \ = increment(this->tail);\n return  true;\n} else {\n        errorOverflow();\n\
    \ return  false;\n    }\n}\n\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
    \  Size>\ninline  bool  CyclicBufferSimple<ObjectType, Lock, Size>::remove(ObjectType\
    \ &object) {\n Lock lock;\n if (!isEmpty()) {\nobject = data[this->head];\n this->head\
    \ = this->increment(this->head);\n return  true;\n} else {\n        errorUnderflow();\n\
    \ return  false;\n    }\n}\n```\n\nInstantiate a new type – a lock which does\
    \ nothing:\n\n`typedef Lock<SynchroObjectDummy> LockDummy;`\n\nThe following function\
    \ returns a number of the elements in the cyclic buffer. Compiler will fail if\
    \ the value can not be calculated at the build time:\n\n```cpp\nconstexpr  size_t\
    \ calculateCyclicBufferSize() {\n return 10;\n}\n```\n\nI create an object of\
    \ class `CyclicBuffer` dealing with unsigned 8 bits integers. I use `uint_fast8_t`,\
    \ which is yet another C++11 marvel targeting portability. Type `uint_fast8_t`\
    \ allows the C++ compiler to choose best performing integer that has at least\
    \ 8 bits. Operations with 32 bits integers can be faster on some CPUs than 8 bits\
    \ operations. If the performance is more important than memory allocated by the\
    \ storage, it makes sense to choose 32 bits integer instead of 8 bits. The smallest\
    \ possible 8 bits unsigned integer is `uint_least8_t`, and the maximum unsigned\
    \ integer available on the platform is `uintmax_t`.\n\n`static CyclicBufferSimple<uint_fast8_t,\
    \ LockDummy, calculateCyclicBufferSize()> myCyclicBuffer;`\n\nIn the usage example\
    \ there is a range loop from the C++11 standard. The main function will print\
    \ numbers 1, 3, 11:\n\n```cpp\nint  main() {\n for (int i : { 1, 3, 11 }) {\n\
    \        myCyclicBuffer.add(i);\n    }\n uint8_t val;\n while (myCyclicBuffer.remove(val))\
    \ {\n        cout << (int) val << endl;\n    }\n return 0;\n}\n```\n\nLet's examine\
    \ the assembly generated by the GNUC compiler for the Intel CPU for a single call\
    \ to the method `add()`.\n\n```assembly\nxor %esi,%esi\n inline  void add(const\
    \ ObjectType object) {\nmov 0x2009c0(%rip),%rax\n return (index + 1);\nmov %rsi,%r8\n\
    ...............................................\n inline  void add(const ObjectType\
    \ object) {\nmov %rcx,%rdx\ncmovbe %rdi,%r8\n if (!isFull()) {\ncmp %r8,%rax\n\
    ...............................................\n         data[this->tail] = object;\n\
    movb $0x0,0x6011a0\n```\n"
