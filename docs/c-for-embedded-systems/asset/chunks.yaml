    \ is being called.\n\n3.  Same as 1, but compilation warning is fixed.\n\n4. \
    \ Run-time copy of the array ['1','2','3',0] to the static variable 'd'. The copy\
    \ is done only once by the code loader.\n\n5.  Attempt to modify the constant\
    \ data. On some architectures constant data is read only and this line can cause\
    \ an exception.\n\n6.  Return pointer to the constant data. The pointer is global\
    \ and exists in the program address space.\n\n7.  Same as 6\n\n8.  Return address\
    \ of the local (stack) variable. Data at the address 'b' depends on the architecture.\n\
    \nQ. What does the following x86 assembly code do:\n\n              call next\n\
    \nnext:              pop eax\n\nA. Operator 'call' pushes the current program\
    \ counter (PC) to the stack. The following 'pop' sets register eax with the PC\
    \ value. This code is a way to get the current value of the PC.\n\nQ. Implement\
    \ an efficient memory pool for allocation of 4 bytes blocks.\n\nA. Organize a\
    \ linked list of free blocks using the data in the blocks themselves. Initially\
    \ write in the first (offset zero) block “1” - offset of the next free block.\
    \ In the second block (offset 1) write “2” and so on. Example of code is below:\n\
    \nstatic  const  int POOL_SIZE = 7;\n\nstatic  uint32_t fastPoolData[POOL_SIZE];\n\
    \nstatic  uint32_t fastPoolHead;\n\nstatic  const  int ALLOCATED_ENTRY = (POOL_SIZE+1);\n\
    \nstatic  inline  uint32_t  fastPoolGetNext(uint32_t node)\n\n{\n\n return fastPoolData[node];\n\
    \n}\n\nstatic  inline  void  fastPoolSetNext(uint32_t node, uint32_t next)\n\n\
    {\n\n    fastPoolData[node] = next;\n\n}\n\nvoid  fastPoolInitialize()\n\n{\n\n\
        fastPoolHead = 0;\n\n for (int i = 0;i < (POOL_SIZE-1);i++)\n\n    {\n\n       \
    \ fastPoolSetNext(i, i+1);\n\n    }\n\n    fastPoolSetNext(POOL_SIZE-1, ALLOCATED_ENTRY);\n\
    \n}\n\nuint32_t *fastPoolAllocate()\n\n{\n\n uint32_t blockOffset = fastPoolHead;\n\
    \n if (blockOffset != ALLOCATED_ENTRY)\n\n    {\n\n        fastPoolHead = fastPoolGetNext(blockOffset);\n\
    \n        fastPoolSetNext(blockOffset, ALLOCATED_ENTRY);\n\n return &fastPoolData[blockOffset];\n\
    \n    }\n\n return  nullptr;\n\n}\n\nvoid  fastPoolFree(uint32_t *block)\n\n{\n\
    \n uint32_t blockOffset = block-&fastPoolData[0];\n\n    fastPoolSetNext(blockOffset,\
    \ fastPoolGetNext(fastPoolHead));\n\n    fastPoolSetNext(fastPoolHead, blockOffset);\n\
    \n}\n\nQ. Implement itoa() - a function which converts an integer to string. Consider\
    \ only positive integers.\n\nA.\n\nint  itoa(int value, char *s, int size)\n\n\
    {\n\n int i = 0;\n\n int chars = size - 1;\n\n int digits = 0;\n\n int v = value;\n\
    \n while (v)\n\n    {\n\n        v = v / 10;\n\n        digits++;\n\n    }\n\n\
    \ while (value)\n\n    {\n\n if (i >= chars)\n\n break;\n\ns[digits-1-i] = '0'\
    \ + (value%10);\n\n        i++;\n\n        value = value / 10;\n\n    }\n\n if\
    \ ((digits-1-i) < 0)\n\n    {\n\n        s[digits-1] = 0;\n\n return size;\n\n\
        }\n\n else\n\n    {\n\n        s[chars] = 0;\n\n return 0;\n\n    }\n\n}\n\
    \n## Bit tricks.\n\nQ. You have two numbers, M and N, and two bit positions, i\
    \ and j. Write a method to set all bits in M between i and j equal to N. Assume\
    \ that i < j. For example, if input M=0x00, N=0x10, i=0, j=5, then output is 0x10.\n\
    \nA. You need to clear bits from i to j in N, and use bitwise OR between M and\
    \ N. Using uint32_t or similar is probably a good idea – discuss it with the interviewer.\n\
    \nint mask = ((i<< 1)-1) | ((1 << j)-1);\n\nM = M & mask;\n\nM = M | (N << i);\n\
    \nQ.What does the following code ((n & (n-1)) == 0)?\n\nA. This condition is true\
    \ if n is zero or if n is a power of 2\\.\n\nQ. How to find the highest set bit?\n\
    \nA. GCC has a built-in function __builtin_clz() which returns the number of leading\
    \ zeros in the argument. Alternative solution:\n\nunsigned  int v;\n\nunsigned\
    \ r = 0;\n\nwhile (v >>= 1) {\n\n    r++;\n\n}\n\nQ. How to set or cleat bits\
    \ without branching? Why would you need it?\n\nA. You can use, for example, the\
    \ following code:\n\nbool f;\n\nunsigned  int mask;\n\nunsigned  int w;\n\nw ^=\
    \ (-f ^ w) & mask;\n\nLack of branching can improve performance by 5-10% depending\
    \ on the context and the CPU. See also  [17].\n\nQ. Find first set bit in an integer\
    \ number."
