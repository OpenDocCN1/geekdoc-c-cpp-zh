    \ name, int pin, int value) {\n\n PIO *pio = &pios[name];\n\n uint32_t mask =\
    \ 1 << pin;\n\n if (value) {\n\n        pio->PIO_SODR = mask;\n\n    }\n\n else\
    \ {\n\n        pio->PIO_CODR = mask;\n\n    }\n\n    pio->PIO_PER = mask;\n\n\
        pio->PIO_OER = mask;\n\n}\n\nFunction which drives PIO A, pin 2 high can look\
    \ like this:\n\nstatic  void  main() {\n\n    enableOutput(PIO_A, 2, 1);\n\n}\n\
    \nThis is how the relevant assembly for Intel looks like – as expected there are\
    \ three 32-bits moves\n\n  PIO *pio = &pios[name];\n\n  uint32_t mask = 1 << pin;\n\
    \n  if (value) {\n\n      pio->PIO_SODR = mask;\n\n4007e0:              c7 05\
    \ e6 19 20 00 04               movl   $0x4,0x2019e6(%rip)\n\n4007e7:             \
    \ 00 00 00\n\n4007ea:31 c0                              xor %eax,%eax\n\n     \
    \ pio->PIO_SODR = mask;\n\n  }\n\n  else {\n\n      pio->PIO_CODR = mask;\n\n\
      }\n\n  pio->PIO_PER = mask;\n\n4007ec:              c7 05 aa 19 20 00 04              \
    \ movl   $0x4,0x2019aa(%rip)\n\n4007f3:              00 00 00\n\n  pio->PIO_OER\
    \ = mask;\n\n4007f6:              c7 05 b0 19 20 00 04               movl   $0x4,0x2019b0(%rip)\n\
    \n4007fd:              00 00 00\n\nAssembly generated for ARM is slightly longer.\
    \ In ARM an address should be loaded to a register before a value can be stored.\n\
    \nPIO *pio = &pios[name];\n\nuint32_t mask = 1 << pin;\n\nif (value) {\n\n   \
    \ pio->PIO_SODR = mask;\n\n8650:              e59f3014               ldr             \
    \ r3, [pc, #20]\n\n8654:              e3a02004               mov             \
    \ r2, #4\n\n8658:              e5832090               str              r2, [r3,\
    \ #144]\n\n865c:              e3a00000               mov              r0, #0\n\
    \n    pio->PIO_SODR = mask;\n\n}\n\nelse {\n\n    pio->PIO_CODR = mask;\n\n}\n\
    \npio->PIO_PER = mask;\n\n8660:              e5832060               str             \
    \ r2, [r3, #96]\n\npio->PIO_OER = mask;\n\n8664:              e5832070              \
    \ str              r2, [r3, #112]\n\n## I/O access in C++.\n\n\"C(++) is a write-only,\
    \ high-level assembler language.\" Stefan Van Baelen.\n\nThis is not easy to compete\
    \ with the C implementation when accessing the I/O. The C compiler for i386 translated\
    \ every line of the C code into a single machine opcode. There is no need to manually\
    \ specify an address for every register. It is enough to create a pointer which\
    \ references the physical address of the first register in the block. I want a\
    \ C++ implementation with the same perfect performance score, similar convenience\
    \ of usage AND some added value, for example type safety.\n\nFirst class is an\
    \ abstraction of a hardware module. The class constructor is protected. Application\
    \ can create only objects of the derived classes.\n\nclass  HardwareModule {\n\
    \nprotected:\n\n HardwareModule(const  uintptr_t address): address(address) {}\n\
    \n ~HardwareModule() {}\n\n const  uintptr_t  address;\n\n};\n\nI declare a template\
    \ for all hardware registers. Static assert will fail compilation if the argument\
    \ IntegerType specified in the type instantiation is not an integer type. API\
    \ “std::atomic” ensures an atomic read/write operation on any architecture, such\
    \ as reading of 32 bis value on 8 bits CPU\n\ntemplate<typename  IntegerType>\
    \ class  HardwareRegister {\n\nprotected:\n\n HardwareRegister() {}\n\n inline\
    \  IntegerType  get() const {\n\n return atomic_load(&value);\n\n    }\n\n inline\
    \  void  set(IntegerType value) {\n\n        atomic_store(&this->value, value);\n\
    \n    }\n\n volatile  atomic<IntegerType> value;\n\n static_assert(numeric_limits<IntegerType>::is_integer,\n\
    \n \"HardwareRegister works only with integer types\");\n\n};\n\nNext class is\
    \ a 32 bits register. Static assertion will fail the build if the object consumes\
    \ more than 32 bits. Correct size of the data is absolutely vital for the access\
    \ to the hardware and comes instead of the “packed” attribute in the C version.\n\
    \nclass  HardwareRegister32: public  HardwareRegister<uint32_t> {\n\nprotected:\n\
    \n HardwareRegister32() {}\n\n};\n\nstatic_assert((sizeof(HardwareRegister32)\
    \ == sizeof(uint32_t)), \"HardwareRegister32 is not 32 bits\");\n\nRead only and\
    \ write only registers follow. The read only register class overloads the type\
    \ cast operator and allows to use an assignment to read the register value. The\
    \ write only register class overloads the assignment operator and allows to use\
    \ an assignment to write the register value. Read/write registers would implement\
    \ both the assignment operator and the type cast operator.\n\nRead only register:\n\
    \nclass  HardwareRegister32RO : public  HardwareRegister32{\n\npublic:\n\n operator\
    \ uint32_t() const {\n\n return get();\n\n    }\n\n};\n\nstatic_assert((sizeof(HardwareRegister32RO)\
    \ == sizeof(uint32_t)), \"HardwareRegister32RO is not 32 bits\");\n\nWrite only\
    \ register:\n\nclass  HardwareRegister32WO : public  HardwareRegister32{\n\npublic:\n\
    \n uint32_t  operator=(uint32_t value) {\n\n        set(value);\n\n return value;\n\
    \n    }\n\n};\n\nstatic_assert((sizeof(HardwareRegister32WO) == sizeof(uint32_t)),\
    \ \"HardwareRegister32WO is not 32 bits\");\n\nFor the clarity I add a register\
    \ “reserved” – I call it “not used”:\n\nclass  HardwareRegister32NotUsed : HardwareRegister32\
    \ {\n\npublic:\n\n HardwareRegister32NotUsed() {}\n\n ~HardwareRegister32NotUsed()\
    \ {}\n\n};\n\nstatic_assert((sizeof(HardwareRegister32NotUsed) == sizeof(uint32_t)),\n\
    \n \"HardwareRegister32NotUsed is not 32 bits\");\n\nThe framework is in place\
    \ and can serve any 32 bits register. Declare the PIO hardware module. There is\
    \ nothing unexpected, but just a repetition of all the same tricks including build\
    \ time check of the size of the structure. An object of the type HardwarePIO requires\
    \ about the same amount data as the competing C version. Depending on the optimization\
    \ level and complexity of the class there is going to be one additional pointer\
    \ in the RAM, a pointer “this”. In the specific implementation below all methods\
    \ of the class are “inline” and the object data gets optimized out completely.\n\
    \nclass  HardwarePIO : HardwareModule {\n\npublic:\n\n HardwarePIO(const  uintptr_t\
    \ address) {\n\n interface = (struct  Interface*)address;\n\n    }\n\n ~HardwarePIO()\
    \ {}\n\n struct  Interface {\n\n HardwareRegister32WO  PIO_PER  ;\n\n HardwareRegister32WO\
    \  PIO_PDR  ;\n\n HardwareRegister32RO  PIO_PSR  ;\n\n HardwareRegister32NotUsed\
    \ RESERVED ;\n\n HardwareRegister32WO  PIO_OER  ;\n\n HardwareRegister32WO  PIO_ODR \
    \ ;\n\n HardwareRegister32RO  PIO_OSR  ;\n\n HardwareRegister32NotUsed RESERVED\
    \ ;\n\n HardwareRegister32NotUsed RESERVED ;\n\n HardwareRegister32NotUsed RESERVED\
    \ ;\n\n HardwareRegister32NotUsed RESERVED ;\n\n HardwareRegister32NotUsed RESERVED\
    \ ;\n\n HardwareRegister32WO  PIO_SODR ;\n\n HardwareRegister32WO  PIO_CODR ;\n\
    \n    };\n\n static_assert((sizeof(struct  Interface) == (14*sizeof(uint32_t))),\
    \ \"struct interface is of wrong size, broken alignment?\");\n\n enum Name {A,\
    \ B, C, D, E, F, LAST};\n\n inline  Interface &getInterface(Name name) const {return\
    \  interface[name];};\n\n inline  void  enableOutput(Name name, int pin, int value);\n\
    \nprotected:\n\n struct  Interface *interface;\n\n};\n\nImplementation of the\
    \ method enableOutput is similar to the C version:\n\ninline  void  HardwarePIO::enableOutput(Name\
    \ name, int pin, int value)\n\n{\n\n struct  Interface &interface = getInterface(name);\n\
    \n uint32_t mask = 1 << pin;\n\n if (value) {\n\n        interface.PIO_SODR =\
    \ mask;\n\n    }\n\n else {\n\n        interface.PIO_CODR = mask;\n\n    }\n\n\
        interface.PIO_PER = mask;\n\n    interface.PIO_OER = mask;\n\n}\n\nUsage example:\n\
    \nstatic  HardwarePIO hardwarePIO(reinterpret_cast<uintptr_t>(pioDummy));\n\n\
    void  main() {\n\n    hardwarePIO.enableOutput(HardwarePIO::A, 2, 1);\n\n}\n\n\
    This C++ implementation produces the same assembly as the old trusty C one. There\
    \ is no more “code bloat” than in the C implementation. C++ framework comes with\
    \ some worthy benefits. If a user attempts to read a write only register the build\
    \ will fail. The following statement will break the compilation:\n\nuint32_t per\
    \ = hardwarePIO.getInterface(HardwarePIO::A).PIO_PER;"
