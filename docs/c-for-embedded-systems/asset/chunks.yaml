    # Introduction.


    I''ve come to the conclusion that any programmer that would prefer the project
    to be in C++ over C is likely a programmer that I really would prefer to piss
    off, so that he doesn''t come and screw up any project I''m involved with.


    Linus Torvalds


    This book is intended for firmware developers who mainly use the C language. I
    assume that the reader is comfortable with ARM or Intel assembly language and
    has working knowledge of the C++ syntax. In this book, I have tried to give examples
    of C++ code in situations where, arguably, C is not the perfect tool for the task.
    Many C++ code examples come with snippets of the resulting assembly. The examples
    of code have been constructed in a way that allows immediate reuse in real-world
    applications. Examples cover topics such as memory and speed optimization, organizing
    arrays, FIFOs, thread safety, and direct access to the hardware. The book addresses
    issues such as code bloat and the hidden performance costs of C++.


    In all examples I assume that the C++ compiler supports version 11 of the language.
    One example of such a compiler is GNUC 4.8\. The availability of a C++ compiler
    supporting version 11 for specific hardware is not required, and most code examples
    can be rewritten for older C++ compilers. Throughout the book, I have demonstrated
    some of the lesser known features of the C++11 standard, such as type traits,
    static assertion, constant expressions and OpenMP support.


    Problem can be solved in numerous ways. Where it was possible and made sense,
    I provided an alternative implementation in C and compared the performance of
    the C and C++ solutions.


    # Acknowledgements.


    I would like to thank my cousin and friend Andre Bar''yudin. Without Andre''s
    help and contributions this book would have been much poorer. I think that between
    two of us this is Andre who knows C++.


    # C++ code style.


    #define AND  &&


    #define OR   ||


    #define EQ   ==


    I have done my best to follow consistent C/C++ code style in all source code examples.
    In this book I have not placed curly brackets on a separate line. Please, do not
    send me hate mail. The only reason is to make the code snippets shorter. Shorter
    code has a better chance of fitting in the smaller e-reader displays. There are
    no comments in the code itself for the same reason. Hopefully, the lack of comments
    has been compensated for by the interspersed explanations. I am using the camelcase
    name convention. Types and class names begin with uppercase and variables begin
    with lower case, while constants are all upper case with the underscore delimiter.


    # Software primitives.


    ## Mutual exclusion.


    The great thing about Object Oriented code is that it can make small, simple problems
    look like large, complex ones.


    In the multi-task environment, threads and interrupts can concurrently read and
    write data objects. I can use different tools to synchronize access to the data
    between different contexts and create thread safe APIs. Among the available tools
    are semaphores and mutual exclusion APIs provided by operating systems, as well
    as disabling all interrupts, disabling some interrupts, disabling the operating
    system scheduler, and using spin locks. When I write a wrapper around an API provided
    by my real-time operating system or by the hardware, I want the wrapper to be
    as thin as possible. Usually, I measure the overhead of the wrapper using a number
    of assembly instructions. The number of instructions provides a good approximation
    of the CPU cycles or execution time.


    I am starting with a code snippet that creates and calls a dummy lock object.


    class LockDummy {


    public:


        LockDummy() {


    cout << "Locked context" << endl;


        }


        ~LockDummy() {


    cout << "Lock is freed" << endl;


        }


    };


    In the following usage example the C++ specifier “auto” tells to the compiler
    to automatically supply the correct type – the C++11 compiler knows to deduct
    certain types of variables in some situations. For example, the C++ compiler can
    figure out the return type of the left side of an assignment or the return type
    of a function.'
