    ```JobThread<ReadADC> jobThread;\n```\n\n## 定点算术\n\n每个人中有三个（同上）对分数有困扰。在需要模数转换器的应用中，我需要定点算术（[13]）。定点算术比标量浮点代码快得多（二三倍）。不幸的是，定点算术不是\
    \ C++ 标准的一部分。GCC 编译器提供了支持（[14]）。定点算术的极佳示例请参考 Kurt Gunoth 的实现（[15]）。以下示例是四种算术操作的简单实现。在代码段中\
