    \ {\n\n  cmp %r8,%rax\n...............................................\n     \
    \   cyclicBuffer->data[cyclicBuffer->tail] = object;\n  movb $0x0,0x6011a0(%rcx)\n\
    ```\n\nGNUC 针对 ARM 为 C 代码和 C++ 代码产生基本上相同的汇编代码\n\n```assembly\nxor    %esi,%esi\n\
    mov    0x2009be(%rip),%rax\nmov    %rsi,%r8\npush    %rbp\nlea    0x1(%rdx),%rdi\n\
    cmp    $0x9,%rdx\nmov    %rdx,%rcx\npush    %rbx\ncmovbe %rdi,%r8\ncmp    %r8,%rax\n\
    je 40081c <main+0x3c>\nmovb  $0x0,0x6011a0(%rdx)\nmov    %r8,%rcx\nmov    %r8,0x20099c(%rip)\n\
    xor    %r12d,%r12d\n```\n\n在 Intel 上测量的 C 版本和 C++ 性能是相同的。\n\n## C++ 模板\n\n要理解什么是递归，你必须首先理解递归。\n\
    \n此时，一个耐心的读者会询问由于 C++ 模板和对象代码重复导致的“代码膨胀”。通常情况下，C 语言实现的内存占用应该更小，不是吗？\n\n在循环缓冲区的\
    \ C++ 实现中，所有方法都是内联的（inline），并且没有特定的“模板代码”。在一般情况下，对于代码中使用的每一对 `ObjectType`/Size`，C++\
    \ 编译器都会实例化一个类并将全套方法添加到应用程序代码中。一个仔细的 C++ 程序员应该将不需要模板参数的方法移动到基类中，并从该新类派生 `CyclicBuffer`\
    \ 模板。将类型无关的代码移动到基类中通常被称为“代码提升”（code hoisting）。代码提升并不一定会导致性能损耗。在下面的示例中，我将基类命名为\
    \ `CyclicBufferBase`。基类的构造函数是保护的（protected）。应用程序只能创建子类的对象。\n\n```cpp\nclass CyclicBufferBase\
    \ {\npublic:\n bool isEmpty() {\n bool res = (this->head == this->tail);\n return\
    \ res;\n    }\n bool isFull() {\n size_t tail = increment(this->tail);\n bool\
    \ res = (this->head == tail);\n return res;\n    }\nprotected:\n CyclicBufferBase(size_t\
    \ size) {\n this->size = size;\n this->head = 0;\n this->tail = 0;\n    }\n void\
    \ errorOverflow() {\n\n    }\n void errorUnderflow() {\n\n    }\n size_t increment(size_t\
    \ index) {\n if (index < this->size) {\nreturn (index + 1);\n} else {\n return\
    \ 0;\n    }\n    }\n size_t head;\n size_t tail;\n size_t size;\n};\n```\n\n模板类\
    \ `CyclicBuffer` 包含了依赖模板参数 `Size` 的数据以及取决于整数类型的添加/删除方法。`CyclicBuffer` 类派自 `CyclicBufferBase`\
    \ 类，继承了 `CyclicBufferBase` 的所有方法，并暴露了 `CyclicBufferBase` 的所有方法。\n\n```cpp\ntemplate<typename\
    \ ObjectType, typename Lock, std::size_t Size>\nclass CyclicBuffer:public CyclicBufferBase\
    \ {\npublic:\n CyclicBuffer() :\n        CyclicBufferBase(Size) {\n static_assert(std::numeric_limits<ObjectType>::is_integer,\
    \ \"CyclicBuffer is intended to work only with integer types\");\n    }\n ~CyclicBuffer()\
    \ {\n}\n bool add(const ObjectType object) {\n Lock lock;\n if (!isFull()) {\n\
    data[tail] = object;\ntail = increment(tail);\n return true;\n} else {\n     \
    \   errorOverflow();\n return false;\n    }\n}\n bool remove(ObjectType &object)\
    \ {\n Lock lock;\n if (!isEmpty()) {\nobject = data[head];\nhead = increment(head);\n\
    \ return true;\n} else {\n        errorUnderflow();\n return false;\n    }\n}\n\
    private:\n ObjectType data[Size + 1];\n};\n```\n\n"
- fmt: "\nI will start the discussion of the dynamic memory allocation from memory\
    \ pools by declaration of a new class `Stack`. Template class `Stack` is similar\
    \ to the class `CyclicBuffer` used previously. Class `Stack` implements two methods:\
    \ `push` and `pop`.\n\n```cpp\ntemplate<typename ObjectType, typename Lock, std::size_t\
    \ Size>\nclass Stack: public StackBase {\npublic:\n    Stack() :\n    StackBase(Size)\
    \ {\n    }\n    ~Stack() {\n    }\n    inline bool push(ObjectType* object);\n\
    \    inline bool pop(ObjectType** object);\nprivate:\n    ObjectType* data[Size\
    \ + 1];\n};\n```\n\nBase class `StackBase` contains `top` and `size` fields and\
    \ a couple of useful APIs.\n\n```cpp\nclass StackBase {\npublic:\n    bool isEmpty()\
    \ {\n        bool res = (this->top == 0);\n        return res;\n    }\n    bool\
    \ isFull() {\n        bool res = (this->top == size);\n        return res;\n \
    \   }\nprotected:\n    StackBase(size_t size) {\n        this->size = size;\n\
    \        this->top = 0;\n    }\n    void errorOverflow() {\n    }\n    void errorUnderflow()\
    \ {\n    }\n    size_t top;\n    size_t size;\n};\n```\n\nExample of implementation\
    \ of the `push` and `pop` methods:\n\n```cpp\ntemplate<typename ObjectType, typename\
    \ Lock, std::size_t Size>\ninline bool Stack<ObjectType, Lock, Size>::push(ObjectType*\
    \ object) {\n    Lock lock;\n    if (!isFull()) {\n        data[this->top] = object;\n\
    \        this->top++;\n        return true;\n    } else {\n        errorOverflow();\n\
    \        return false;\n    }\n}\n\ntemplate<typename ObjectType, typename Lock,\
    \ std::size_t Size>\ninline bool Stack<ObjectType, Lock, Size>::pop(ObjectType**\
    \ object) {\n    Lock lock;\n    if (!isEmpty()) {\n        this->top--;\n   \
    \     *object = (data[this->top]);\n        return true;\n    } else {\n     \
    \   errorUnderflow();\n        return false;\n    }\n}\n```\n\nMy next step is\
    \ to define a block of “raw” data memory. A block of memory is a correctly aligned\
    \ array of bytes, which, optionally, can be placed at a specific memory address.\
    \ One popular application for the memory blocks is DMA transfers. Data buffer\
    \ can be placed in the regular RAM or in the dedicated address space.\n\nI define\
    \ a memory region. I use operator `new` – a placement new operator – to `place`\
    \ the data at the specified address. My memory region has a name for debug purposes.\
    \ A region address is of type `uintptr_t` which is an unsigned integer that is\
    \ capable of storing a pointer.\n\n```cpp\nclass MemoryRegion {\npublic:\n   \
    \ MemoryRegion(const char *name, uintptr_t address, size_t size) :\n    name(name),\
    \ address(address), size(size) {\n        data = new (reinterpret_cast<void*>(address))\
    \ uint8_t[size];\n    }\n    size_t getSize() const {\n        return size;\n\
    \    }\n    const char* getName() const {\n        return name;\n    }\n    uintptr_t\
    \ getAddress() const {\n        return address;\n    }\nprotected:\n    const\
    \ char *name;\n    uintptr_t address;\n    size_t size;\n    uint8_t *data;\n\
    };\n```\n\nI create an object of `MemoryRegion` type and point to the area `dmaMemoryData`\
    \ in the dynamic data:\n\n```cpp\nstatic uint8_t dmaMemoryDummy[512];\nstatic\
    \ MemoryRegion dmaMemoryRegion(\"dmaMem\", (uintptr_t)dmaMemoryDummy, sizeof(dmaMemoryDummy));\n\
    ```\n\nI need an allocator. This is a class dealing with allocation of memory\
    \ blocks. The allocator handles the correct alignment. I am going to use the allocator\
    \ code only once (or rarely). For example, I need an allocator when I fill my\
    \ memory pool with the data blocks. The performance is not extremely important\
    \ here. The method `reset` “frees” all allocated blocks back to the allocator.\n\
    \n```cpp\nclass MemoryAllocatorRaw {\npublic:\n    MemoryAllocatorRaw(MemoryRegion\
    \ memoryRegion,\n    size_t blockSize,\n    size_t count, unsigned int alignment);\n\
    \    uint8_t* getBlock();\n    bool blockBelongs(const void* block) const;\n \
    \   const MemoryRegion& getRegion() const;\n    void reset();\n    constexpr static\
    \ size_t predictMemorySize(\n    size_t blockSize,\n    size_t count, unsigned\
    \ int alignment);\nprotected:\n    int alignment;\n    size_t blockSize;\n   \
    \ const MemoryRegion& memoryRegion;\n    size_t count;\n    size_t sizeTotalBytes;\n\
    \    size_t alignedBlockSize;\n    uintptr_t firstNotAllocatedAddress;\n    static\
    \ constexpr size_t alignConst(size_t value,\n    unsigned int alignment);\n  \
    \  inline static uintptr_t alignAddress(uintptr_t value,\n    unsigned int alignment);\n\
    };\n```\n\nImplementation of the allocator follows. The constructor makes sure\
    \ there is enough space. I initialize the fields right after the constructor:\n\
    \n```cpp\nMemoryAllocatorRaw::MemoryAllocatorRaw(MemoryRegion memoryRegion,\n\
    size_t blockSize,\nsize_t count, unsigned int alignment) :\nalignment(alignment),\
    \ blockSize(blockSize), memoryRegion(memoryRegion), count(count) {\n    alignedBlockSize\
    \ = alignConst(blockSize, alignment);\n    sizeTotalBytes = alignedBlockSize *\
    \ count;\n    firstNotAllocatedAddress = memoryRegion.getAddress();\n}\n```\n\n\
    The `getBlock` method calls the `alignAddress` API:\n\n```cpp\nuint8_t* MemoryAllocatorRaw::getBlock()\
    \ {\n    uint8_t* block = (uint8_t*)alignAddress(firstNotAllocatedAddress);\n\
    \    firstNotAllocatedAddress += alignedBlockSize;\n    return block;\n}\n```\n\
    \n`blockBelongs` needs sanity check to ensure the block belongs to the pool:\n\
    \n```cpp\nbool MemoryAllocatorRaw::blockBelongs(const void* block) const {\n \
    \   uintptr_t blockPtr = (uintptr_t)block;\n    size_t maxAddress = memoryRegion.getAddress()\
    \ + sizeTotalBytes;\n    return blockPtr <= maxAddress;\n}\n```\n\nThe rest of\
    \ the methods:\n\n```cpp\nconstexpr size_t MemoryAllocatorRaw::alignConst(size_t\
    \ value, unsigned int alignment) {\n    return (value + (alignment - 1)) & ~(alignment\
    \ - 1);\n}\n\nuintptr_t MemoryAllocatorRaw::alignAddress(uintptr_t value, unsigned\
    \ int alignment) {\n    return (value + (alignment - 1)) & ~(alignment - 1);\n\
    }\n\nconst MemoryRegion& MemoryAllocatorRaw::getRegion() const {\n    return memoryRegion;\n\
    }\n\nvoid MemoryAllocatorRaw::reset() {\n    firstNotAllocatedAddress = memoryRegion.getAddress();\n\
    }\n```\n\nBefore I declare an object of the allocator, I check that the memory\
    \ region is large enough. I want the compilation to fail if the memory region\
    \ is too small:\n\n```cpp\nstatic_assert((sizeof(dmaMemoryDummy) >= MemoryAllocatorRaw::predictMemorySize(63,\
    \ 3, 2)), \"DmaMemoryDummy region not large enough\");\nstatic MemoryAllocatorRaw\
    \ dmaAllocator(dmaMemoryRegion, 63, 2);\n```\n\nMy memory pool is a stack of data\
    \ blocks. The class contains `allocate/free` API, some debug statistics. Every\
    \ memory pool has a name. Providing a name for the objects is useful for logging\
    \ and printing debug statistics. The stack in the memory pool is intentionally\
    \ protected by a `Lock` and is not thread safe. I am going to use a real synchronizer\
    \ in the memory pool methods.\n\nClass methods with `const` keyword in the signature,\
    \ for example `resetMaxInUse()`, can not alter any member of the class. How comes\
    \ that `resetMaxInUse()` changes the `statistics` field anyway?. Field `statistics`\
    \ is `mutable` and this allows the `const` methods to modify it. Debug counters\
    \ is a book example of using the keyword `mutable`. Method `resetMaxInUse()` does\
    \ not affect (not in a meaningful way) the visible state of the object.\n\n```cpp\n\
    template<typename Lock, size_t Size>\nclass MemoryPoolRaw {\npublic:\n    MemoryPoolRaw(const\
    \ char* name, MemoryAllocatorRaw* memoryAllocator);\n    ~MemoryPoolRaw() {\n\
    \        memoryAllocator->reset();\n    }\n    inline void resetMaxInUse() const\
    \ {\n        statistics.maxInUse = 0;\n    }\n    typedef struct {\n        uint32_t\
    \ inUse;\n        uint32_t maxInUse;\n        uint32_t errBadBlock;\n    } Statistics;\n\
    \    inline bool allocate(uint8_t** block);\n    inline bool free(uint8_t* block);\n\
    \    inline const Statistics &getStatistics(void) const {return statistics;}\n\
    protected:\n    mutable Statistics statistics;\n};\n```\n"
