  trans: "\n我将通过声明一个新类 `Stack` 来开始关于内存池动态内存分配的讨论。模板类 `Stack` 与之前使用的 `CyclicBuffer`\
    \ 类类似。`Stack` 类实现了两个方法：`push` 和 `pop`。\n\n```cpp\ntemplate<typename ObjectType,\
    \ typename Lock, std::size_t Size>\nclass Stack: public StackBase {\npublic:\n\
    \    Stack() :\n    StackBase(Size) {\n    }\n    ~Stack() {\n    }\n    inline\
    \ bool push(ObjectType* object);\n    inline bool pop(ObjectType** object);\n\
    private:\n    ObjectType* data[Size + 1];\n};\n```\n\n基类 `StackBase` 包含 `top`\
    \ 和 `size` 字段，以及一些有用的 API。\n\n```cpp\nclass StackBase {\npublic:\n    bool isEmpty()\
    \ {\n        bool res = (this->top == 0);\n        return res;\n    }\n    bool\
    \ isFull() {\n        bool res = (this->top == size);\n        return res;\n \
    \   }\nprotected:\n    StackBase(size_t size) {\n        this->size = size;\n\
    \        this->top = 0;\n    }\n    void errorOverflow() {\n    }\n    void errorUnderflow()\
    \ {\n    }\n    size_t top;\n    size_t size;\n};\n```\n\n`push` 和 `pop` 方法实现示例：\n\
    \n```cpp\ntemplate<typename ObjectType, typename Lock, std::size_t Size>\ninline\
    \ bool Stack<ObjectType, Lock, Size>::push(ObjectType* object) {\n    Lock lock;\n\
    \    if (!isFull()) {\n        data[this->top] = object;\n        this->top++;\n\
    \        return true;\n    } else {\n        errorOverflow();\n        return\
    \ false;\n    }\n}\n\ntemplate<typename ObjectType, typename Lock, std::size_t\
    \ Size>\ninline bool Stack<ObjectType, Lock, Size>::pop(ObjectType** object) {\n\
    \    Lock lock;\n    if (!isEmpty()) {\n        this->top--;\n        *object\
    \ = (data[this->top]);\n        return true;\n    } else {\n        errorUnderflow();\n\
    \        return false;\n    }\n}\n```\n\n我的下一步工作是定义一个“原始”数据内存块。一个内存块是一个正确对齐的字节数组，可选情况下，它可以放置在特定的内存地址上。内存块的一个流行应用是\
    \ DMA 传输。数据缓冲区可以放在普通 RAM 中，也可以放在专用地址空间中。\n\n我定义了一个内存区域。我使用 `new` 运算符——定位 new 运算符（placement\
    \ new）——将数据 `place` 在指定的地址。我的内存区域为了调试目的有一个名称。区域地址的类型为 `uintptr_t`，这是一个能够存储指针的无符号整数。\n\
    \n```cpp\nclass MemoryRegion {\npublic:\n    MemoryRegion(const char *name, uintptr_t\
    \ address, size_t size) :\n    name(name), address(address), size(size) {\n  \
    \      data = new (reinterpret_cast<void*>(address)) uint8_t[size];\n    }\n \
    \   size_t getSize() const {\n        return size;\n    }\n    const char* getName()\
    \ const {\n        return name;\n    }\n    uintptr_t getAddress() const {\n \
    \       return address;\n    }\nprotected:\n    const char *name;\n    uintptr_t\
    \ address;\n    size_t size;\n    uint8_t *data;\n};\n```\n\n我创建了一个 `MemoryRegion`\
    \ 类型的对象，并指向动态数据中的 `dmaMemoryData`区域：\n\n```cpp\nstatic uint8_t dmaMemoryDummy[512];\n\
    static MemoryRegion dmaMemoryRegion(\"dmaMem\", (uintptr_t)dmaMemoryDummy, sizeof(dmaMemoryDummy));\n\
    ```\n\n我需要一个分配器。这是一个处理内存块分配的类。分配器处理正确的对齐。我将只使用一次（或很少）分配器代码。例如，当我用数据块填充我的内存池时，我需要一个分配器。在这里性能并不极端重要。`reset`\
    \ 方法将所有分配的块“释放”回分配器。\n\n```cpp\nclass MemoryAllocatorRaw {\npublic:\n    MemoryAllocatorRaw(MemoryRegion\
    \ memoryRegion,\n    size_t blockSize,\n    size_t count, unsigned int alignment);\n\
    \    uint8_t* getBlock();\n    bool blockBelongs(const void* block) const;\n \
    \   const MemoryRegion& getRegion() const;\n    void reset();\n    constexpr static\
    \ size_t predictMemorySize(\n    size_t blockSize,\n    size_t count, unsigned\
    \ int alignment);\nprotected:\n    int alignment;\n    size_t blockSize;\n   \
    \ const MemoryRegion& memoryRegion;\n    size_t count;\n    size_t sizeTotalBytes;\n\
    \    size_t alignedBlockSize;\n    uintptr_t firstNotAllocatedAddress;\n    static\
    \ constexpr size_t alignConst(size_t value,\n    unsigned int alignment);\n  \
    \  inline static uintptr_t alignAddress(uintptr_t value,\n    unsigned int alignment);\n\
    };\n```\n\n分配器的实现如下。构造函数确保有足够的空间。我在构造函数之后初始化字段：\n\n```cpp\nMemoryAllocatorRaw::MemoryAllocatorRaw(MemoryRegion\
    \ memoryRegion,\nsize_t blockSize,\nsize_t count, unsigned int alignment) :\n\
    alignment(alignment), blockSize(blockSize), memoryRegion(memoryRegion), count(count)\
    \ {\n    alignedBlockSize = alignConst(blockSize, alignment);\n    sizeTotalBytes\
    \ = alignedBlockSize * count;\n    firstNotAllocatedAddress = memoryRegion.getAddress();\n\
    }\n```\n\n`getBlock` 方法调用 `alignAddress`：\n\n```cpp\nuint8_t* MemoryAllocatorRaw::getBlock()\
    \ {\n    uint8_t* block = (uint8_t*)firstNotAllocatedAddress;\n    firstNotAllocatedAddress\
    \ += alignedBlockSize;\n    return block;\n}\n```\n\n`blockBelongs` 需要检查块是否属于该池：\n\
    \n```cpp\nbool MemoryAllocatorRaw::blockBelongs(const void* block) const {\n \
    \   uintptr_t blockPtr = (uintptr_t)block;\n    size_t maxAddress = memoryRegion.getAddress()\
    \ + sizeTotalBytes;\n    return blockPtr <= maxAddress;\n}\n```\n\n剩余的方法：\n\n\
    ```cpp\nconstexpr size_t MemoryAllocatorRaw::alignConst(size_t value,\nunsigned\
    \ int alignment) {\n    return (value + (alignment - 1)) & ~(alignment - 1);\n\
    }\n\nuintptr_t MemoryAllocatorRaw::alignAddress(uintptr_t value,\nunsigned int\
    \ alignment) {\n    return (value + (alignment - 1)) & ~(alignment - 1);\n}\n\n\
    const MemoryRegion& MemoryAllocatorRaw::getRegion() const {\n    return memoryRegion;\n\
    }\n\nvoid MemoryAllocatorRaw::reset() {\n    firstNotAllocatedAddress = memoryRegion.getAddress();\n\
    }\n```\n\n在声明分配器对象之前，我检查内存区域是否足够。如果内存区域太小，我希望编译失败：\n\n```cpp\nstatic_assert((sizeof(dmaMemoryDummy)\
    \ >= MemoryAllocatorRaw::predictMemorySize(63, 2, 2)), \"DmaMemoryDummy region\
    \ not enough\");\nstatic MemoryAllocatorRaw dmaAllocator;\n```\n\n我的内存池是数据块的堆栈。该类包含\
    \ `allocate/free` API 以及一些调试统计信息。每个内存池都有一个名称。为对象提供名称对于日志记录和打印调试统计很有用。内存池中的栈由 `Lock`\
    \ 保护，不是线程安全的。我将在内存池的方法中使用真正的同步器。\n\n签名中带有 `const` 关键字类方法，例如 `resetMaxInUse()`，无法更改类的任何成员。那么\
    \ `resetMaxInUse()` 如何能更改 `statistics` 字段呢？`statistics` 字段是 `mutable` 的，这允许 `const`\
    \ 方法修改它。调试计数是使用 `mutable` 关键字的经典示例。`resetMaxInUse()` 方法不会影响（以有意义的方式）对象的可见状态。\n\
    \n```cpp\ntemplate<typename Lock, size_t Size>\nclass MemoryPoolRaw {\npublic:\n\
    \    MemoryPoolRaw(const char* name, MemoryAllocatorRaw* memoryAllocator);\n \
    \   ~MemoryPoolRaw() {\n        memoryAllocator->reset();\n    }\n    inline void\
    \ resetMaxInUse() const {\n        statistics.maxInUse = 0;\n    }\n    typedef\
    \ struct {\n        uint32_t inUse;\n        uint32_t maxInUse;\n        uint32_t\
    \ errBadBlock;\n    } Statistics;\n    inline bool allocate(uint8_t** block);\n\
    \    inline bool free(uint8_t* block);\n    inline const Statistics &getStatistics(void)\
    \ const {return statistics;}\nprotected:\n    mutable Statistics statistics;\n\
    };\n```\n"
- fmt: "\n```cpp\nmutable Statistics statistics;\n\nconst char* name;\n\nStack<uint8_t,\
    \ LockDummy, Size> pool;\n\nMemoryAllocatorRaw* memoryAllocator;\n\n};\n```\n\n\
    Memory pool constructor calls the allocator to fill the stack of free blocks.\
    \ Constructor can, for example, register the newly created memory pool in the\
    \ data base of the memory pools. Application can provide meanings for the run-time\
    \ inspection of the memory pools. Destructor would remove the pool from the data\
    \ base:\n\n```cpp\ntemplate<typename Lock, size_t Size>\nMemoryPoolRaw<Lock, Size>::\n\
    MemoryPoolRaw(const char* name, MemoryAllocatorRaw* memoryAllocator) :\nname(name),\
    \ memoryAllocator(memoryAllocator) {\n  memset(&this->statistics, 0, sizeof(this->statistics));\n\
    \  for (size_t i = 0; i < Size;i++) {\n    uint8_t *block = memoryAllocator->getBlock();\n\
    \    pool.push(block);\n  }\n}\n```\n\nIf the `Lock` class is not a dummy lock,\
    \ memory pool allocate/free API is reentrant and thread safe. All activity which\
    \ can modify the state of the stack is protected by the `lock`. If an application\
    \ uses the pool only in one context the application can provide `LockDummy` template\
    \ argument for the memory pool. `LockDummy` adds no code to the executable. Statistics\
    \ counters are relatively low cost, but are immensely helpful for debugging errors\
    \ such as allocation failure.\n\n```cpp\ntemplate<typename Lock, size_t Size>\n\
    inline bool MemoryPoolRaw<Lock, Size>::\nallocate(uint8_t** block) {\n  bool res;\n\
    \  Lock lock;\n  res = pool.pop(block);\n  if (res) {\n    statistics.inUse++;\n\
    \    if (statistics.inUse > statistics.maxInUse)\n      statistics.maxInUse =\
    \ statistics.inUse;\n  }\n  return res;\n}\n```\n\nMemory pool “free” makes sure\
    \ that the pointer belongs to the pool. The memory allocator knows to recognize\
    \ it's own blocks.\n\n```cpp\ntemplate<typename Lock, size_t Size>\ninline bool\
    \ MemoryPoolRaw<Lock, Size>::\nfree(uint8_t* block) {\n  bool res;\n  Lock lock;\n\
    \  res = memoryAllocator->blockBelongs(block);\n  if (res) {\n    res = pool.push(block);\n\
    \    statistics.inUse--;\n  } else {\n    statistics.errBadBlock++;\n  }\n  return\
    \ res;\n}\n```\n\nIt is going to be fairly easy to prevent release of the same\
    \ block more than once. If the data blocks are part of the continuous memory,\
    \ the allocator can provide a method generating a unique index based on the address\
    \ of the block. Memory pool can contain an array where blocks are marked as allocated\
    \ or free, and method `free()` can check the block against this array. If the\
    \ memory region is not continuous, the allocator can implement a hash function\
    \ translating the address of a data block to a unique data block index.\n\n##\
    \ Operator new.\n\nAlgorithm (noun)\n\nWord used by programmers when they do not\
    \ want to explain what they did.\n\nMany small microcontrollers have a relatively\
    \ small heap for dynamic memory allocation. The design choice not to use the dynamic\
    \ memory allocation at all is very popular. Often it does not make sense in the\
    \ firmware to use standard implementations of operators `new` and `delete` from\
    \ the C/C++ library. Operator `new` can throw an exception – a dynamically allocated\
    \ object by itself – if the system runs out of free memory. Calls to `new` and\
    \ `delete` for different objects in run-time will eventually cause memory fragmentation.\
    \ Software timers from the later chapter and STL containers can take advantage\
    \ of the user-defined memory allocation that employs custom allocators. Customized\
    \ operator `new` can be based on a “placement new”. Constructor in the `CyclicBufferDynamic`\
    \ class can be redefined like this:\n\n```cpp\ntemplate<typename ObjectType, typename\
    \ Lock>\ninline CyclicBufferDynamic\n<ObjectType, Lock>::\nCyclicBufferDynamic(size_t\
    \ size, void *address) {\n  this->head = 0;\n  this->tail = 0;\n  this->size =\
    \ size;\n  if (address != nullptr) {\n    this->data = new (address) ObjectType[size];\n\
    \  } else {\n    this->data = new ObjectType[size];\n  }\n  static_assert(sizeof(ObjectType)\
    \ <= sizeof(uintptr_t), \"CyclicBuffer is intended to work only with integer types\
    \ or pointers\");\n}\n```\n\nIn the following example I make the compiler to allocate\
    \ the required memory statically and use the address of the allocated data in\
    \ the call to the constructor:\n\n```cpp\nstatic uint32_t myDynamicCyclicBufferData[calculateCyclicBufferSize()];\n\
    CyclicBufferDynamic<uint32_t, LockDummy> myDynamicCyclicBuffer(calculateCyclicBufferSize(),\
    \ &myDynamicCyclicBufferData);\n```\n\n## I/O access.\n\nHow many programmers\
    \ does it take to change a light bulb? None – it's a hardware problem.\n\nEmbedded\
    \ software accesses the hardware via hardware registers. I will assume that there\
    \ are three groups of registers: read and write registers, read only registers\
    \ and write only registers. All registers are memory mapped and there is an address\
    \ for every register. The software can access a register in the same way as it\
    \ reads or writes a variable given the variable's address. In case of write only\
    \ registers it is a custom to keep a cached value. Cache is a variable sitting\
    \ in the data memory that contains the latest value written to the write only\
    \ register.\n\nThe following example is based on the user interface of the Parallel\
    \ Input/Output controller (PIO) in the Atmel SAMA5d3 microcontroller. I have simplified\
    \ the interface to save lines of code and text.\n\n| Address | Name | Register\
    \ | Access |\n| :--- | :--- | :--- | :--- |\n| 0x0000 | PIO Enable Register |\
    \ PIO_PER | Write-only |\n| 0x0004 | PIO Disable Register | PIO_PDR | Write-only\
    \ |\n| 0x0008 | PIO Status Register | PIO_PSR | Read-only |\n| 0x000C | Reserved\
    \ | | |\n| 0x0010 | Output Enable Register | PIO_OER | Write-only |\n| 0x0014\
    \ | Output Disable Register | PIO_ODR | Write-only |\n| 0x0018 | Output Status\
    \ Register | PIO_OSR | Read-only |\n| 0x001C | Reserved | | |\n| 0x0020 | Not\
    \ used | | |\n| 0x0024 | Not used | | |\n| 0x0028 | Not used | | |\n| 0x002C |\
    \ Reserved | | |\n| 0x0030 | Set Output Data Register | PIO_SODR | Write-only\
    \ |\n| 0x0034 | Clear Output Data Register | PIO_CODR | Write-only |\n| 0x0038\
    \ | Output Status Register | PIO_ODSR | Read-only |\n\nThere are five blocks such\
    \ as A, B, C, D, E in the microcontroller. The registers are mapped starting at\
    \ `0xFFFFF00`. A user wishing to modify a write only register shall write 1 to\
    \ the relevant bits. For example, user shall write `0x04` to `PIO_SODR`.\n\n##\
    \ I/O access in C.\n\n\"Writing in C or C++ is like running a chain saw with all\
    \ the safety guards removed\" – Bob Gray.\n\nI am providing quick and dirty C.\
    \ Macro `RESER` demonstrates a neat trick to generate a unique identifier.\n\n\
    ```c\n#define TOKEN_CAT(x, y) x ## y\n#define TOKEN_2(x, y) TOKEN_CAT(x, y)\n\
    #define RESERVED TOKEN_2(reserved, __COUNTER__)\n```\n\nDeclaration of the PIO\
    \ structure, a group of 32 bits, follows. I want to ensure that the compiler does\
    \ not any padding and I mark the structure “packed”. Pragma “pack” is potentially\
    \ not safe. Some architectures, such as ARM or MIPS, do not support non-aligned\
    \ access.\n\n```c\n#pragma pack(push)\n#pragma pack(1)\nstruct PIO {\n  volatile\
    \ uint32_t PIO_PER;\n  volatile uint32_t PIO_PDR;\n  volatile uint32_t PIO_PSR;\n\
    \  volatile uint32_t RESERVED;\n  volatile uint32_t PIO_OER;\n  volatile uint32_t\
    \ PIO_ODR;\n  volatile uint32_t PIO_OSR;\n  volatile uint32_t RESERVED;\n  volatile\
    \ uint32_t RESERVED;\n  volatile uint32_t RESERVED;\n  volatile uint32_t RESERVED;\n\
    \  volatile uint32_t RESERVED;\n  volatile uint32_t PIO_SODR;\n  volatile uint32_t\
    \ PIO_CODR;\n  volatile uint32_t PIO_ODSR;\n};\n#pragma pack(pop)\n```\n\nDeclaration\
    \ of the pointer to the memory area:\n\n```c\n#ifdef REAL_HARDWARE\nstatic PIO\
    \ *pios = (PIO*)0xFFFFF200;\n#else\nstatic PIO pioDummy[5];\nstatic PIO *pios\
    \ = pioDummy;\n#endif\n```\n\nFive PIO blocks:\n\n```c\ntypedef enum {\n  PIO_A,\n\
    \  PIO_B,\n  PIO_C,\n  PIO_D,\n  PIO_E,\n  PIO_F,\n} PIO_NAME;\n```\n"
