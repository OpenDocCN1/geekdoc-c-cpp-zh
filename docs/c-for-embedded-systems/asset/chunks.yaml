  trans: "\n\n两个随机数之和并不是均匀分布的随机数。任何涉及随机生成数字之和的方案都是错误的。在以下代码中，第一次赋值生成了一个五位进制的两位数字——一个在\
    \ 0 到 24 之间的随机数。下一行从随机数序列中移除了 21、22、23、24。该操作的结果是一系列 0 到 20 之间均匀分布的数字。通过对 7 取模完成了完成任务。\n\
    \n```cpp\nint random_7() {\n  while (true) {\n    int ret = 5 * random_5() + random_5();\n\
    \    if (ret < 21)\n      return (ret % 7);\n  }\n}\n```\n\n# 结论\n\n你已经让我们大开眼足了。让其他的年轻姑娘们也有表现的机会吧——简·奥斯汀，《傲慢与偏见》。\n\
    \n希望你觉得这本书有趣，并且值得投入时间和金钱。这本书经常更新。你可以随时通过 Amazon 网站的“管理您的内容和设备”部分开启“自动更新”来获取更新版本。\n\
    \n请通过在 Amazon 网站上评论或发送电子邮件至 `arkady.miasnikov@gmail.com` 告诉你的想法或提问。\n\n感谢，Arkady。\n\
