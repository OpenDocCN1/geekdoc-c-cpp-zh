    \ 奇迹。类型 `uint_fast8_t` 允许 C++ 编译器选择至少有 8 位的最佳性能整数。在某些 CPU 上，32 位整数的操作比 8 位操作更快。如果性能比存储分配的内存更重要，选择\
    \ 32 位整数而不是 8 位是有意义的。最小可能的 8 位无符号整数是 `uint_least8_t`，平台上可用的无符号整数是 `uintmax_t`。\n\
