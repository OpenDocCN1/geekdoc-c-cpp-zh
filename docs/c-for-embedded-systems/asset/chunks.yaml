  raw: "There are many calls to the log API and size of the image is important. Calls\
    \ to log_print() push at least three arguments into the stack. I think that I\
    \ can save one push – a log level. In the C implementation I would add functions\
    \ log_print_info(...) and log_print_error(...) which in turn call log_print(),\
    \ and fix the macros accordingly. In C++ I have a template. The constructor is\
    \ an exact copy of the original log_print function minus log level:\n\ntemplate\
    \ <int  Level> class  Log {\n\npublic:\n\n Log(int line, const  char *fmt, ...)\
    \ {\n\n va_list ap;\n\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[Level], line);\n\
    \n        va_start(ap, fmt);\n\n vprintf(fmt, ap);\n\n        va_end(ap);\n\n\
        }\n\n};\n\nThe log macros call the constructor:\n\n#define LOG_INFO(fmt, ...)\
    \ Log<LOG_LEVEL_INFO>(__LINE__, fmt, ##__VA_ARGS__ )\n\n#define LOG_ERROR(fmt,\
    \ ...) Log<LOG_LEVEL_ERROR>(__LINE__, fmt, ##__VA_ARGS__ )\n\nC++ compiler has\
    \ duplicated two print log functions for me and saved a push to the stack for\
    \ every call to the log API. Class log is a “functoid – it is a function on steroids.\
    \ I can use a functoid based on a regular class instead of a template like this:\n\
    \nclass  Log {\n\npublic:\n\n Log(const  char *level) : level(level) {}\n\n void\
    \  print(int line, const  char *fmt, ...) const {\n\n va_list ap;\n\n printf(\"\
    %s: line=%d, msg=\", level, line);\n\n        va_start(ap, fmt);\n\n vprintf(fmt,\
    \ ap);\n\n        va_end(ap);\n\n    }\n\nprotected:\n\n const  char *level;\n\
    \n};\n\nconst  Log LogInfo(\"INFO\");\n\nconst  Log LogError(\"ERROR\");\n\n#define\
    \ LOG_INFO(fmt, ...) LogInfo.print(__LINE__, fmt, ##__VA_ARGS__ )\n\n#define LOG_ERROR(fmt,\
    \ ...) LogError.print(__LINE__, fmt, ##__VA_ARGS__ )\n\nI have dropped array LOG_LEVEL_NAME\
    \ and now it is easier to expand an enumeration of log levels. There is only one\
    \ instance of the print function in the object code. The cost is a couple of words\
    \ in the data RAM or two objects of the type Log. The code and the data can be\
    \ placed in the ROM.\n\nCall to vprintf() is not something firmware developers\
    \ do often. Indeed the code calls vprintf() again and again for the same set of\
    \ format strings. I can send to the console only the arguments to the vprintf()\
    \ and the exact location in the source code or the offset in the object file.\n\
    \nClass BinaryLog below handles only arguments of type “int”. A location in the\
    \ source code is defined by a “unique” file identifier and a source line number:\n\
    \nclass  BinaryLog {\n\npublic:\n\n BinaryLog(int fileId, int line, int count,\
    \ ...);\n\n};\n\nI assume that there is “sendData” API which can send arbitrary\
    \ number of integers to the console:\n\nBinaryLog::BinaryLog(int fileId, int line,\
    \ int count, ...) {\n\n const  int HEADER_SIZE = 3;\n\n int header[HEADER_SIZE];\n\
    \n    header[0] = fileId;\n\n    header[1] = line;\n\n    header[2] = count;\n\
    \n    sendDataStart();\n\n    sendData(header, HEADER_SIZE);\n\n va_list ap;\n\
    \n    va_start(ap, count);\n\n for (int j=0; j < count; j++) {\n\n int arg = va_arg(ap,\
    \ int);\n\n        sendData(arg);\n\n    }\n\n    va_end(ap);\n\n    sendDataEnd();\n\
    \n}\n\nAPI “send data” in my simulation looks like this:\n\ninline void  sendData(const\
    \  int data) {\n\ncout << dec << data << \" \";\n\n}\n\ninline void  sendDataStart()\
    \ {cout << endl;}\n\ninline void  sendDataEnd() {cout << endl;}\n\nvoid  sendData(const\
    \  int *data, int count) {\n\n for (int i = 0;i < count;i++) {\n\ncout << hex\
    \ << data[i] << \" \";\n\n    }\n\n}\n\nTwo macro definitions call constructor\
    \ BinaryLog. Macro ARGUMENTS_COUNT is fairly portable and shall return number\
    \ of arguments in a variadic macro:\n\n#define ARGUMENTS_COUNT(...) (sizeof((int[]){__VA_ARGS__})/sizeof(int))\n\
    \n#define LOG_INFO(fmt, ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__),\
    \ __VA_ARGS__ )\n\n#define LOG_ERROR(fmt, ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__),\
    \ __VA_ARGS__ )\n\nThe file identifier is generated by the compiler from the file\
    \ name during the build. I use a simple hash function. A real thing, an MD5 hash,\
    \ can be found in [7].\n\nconstexpr  int  hashData(const  char* s, int accumulator)\
    \ {\n\n return *s ? hashData(s + 1, (accumulator << 1) | *s) : accumulator;\n\n\
    }\n\nconstexpr  int  hashMetafunction(const  char* s) {\n\n return hashData(s,\
    \ 0);\n\n}\n\nconstexpr  int FILE_ID = hashMetafunction(__FILE__);\n\nUsage example:\n\
    \nvoid  testBinaryLog(void) {\n\n    LOG_INFO(\"This is info %d %d\", 1, 2);\n\
    \n    LOG_ERROR(\"This is error %d %d %d\", 0, 1, 2);\n\n}\n\nIn my system the\
    \ test function produces output:\n\n262140 511 2 1 2 262140 512 3 0 1 2\n\nAll\
    \ I need now is a short script ([8]) that calculates file identifiers for all\
    \ my source files, finds the right file according to the file identifier 262140,\
    \ parses lines 511 and 512 in the C++ file and produces two readable output lines:\n\
    \nThis is info 1 2\n\nThis is error 0 1 2\n\nYet another post build script can\
    \ ensure that format strings correctly represent arguments in calls to the macros.\n\
    \nBy removing an expensive call to vprintf() I saved lot of CPU cycles, lot of\
    \ ROM and some bandwidth. The binary log API does not use any static data and\
    \ the API is thread safe. My system generates logs which require additional processing\
    \ before they can be read by a human, but there are situations when this is a\
    \ small price to pay.\n\nIn the next example I assume that the application is\
