  trans: "\n对 log API 的调用非常频繁，图像的大小非常重要。调用 `log_print()` 会向栈中推入至少三个参数。我认为我可以节省一次推入操作——日志级别。在\
    \ C 语言实现中，我会添加 `log_print_info(...)` 和 `log_print_error(...)` 函数，它们反过来调用 `log_print()`，并相应地修复宏。在\
    \ C++ 中，我使用了一个模板。构造函数是原始 `log_print` 函数的精确拷贝，去掉了日志级别：\n\n```cpp\ntemplate <int\
    \  Level> class  Log {\npublic:\n Log(int line, const  char *fmt, ...) {\n va_list\
    \ ap;\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[Level], line);\n      va_start(ap,\
    \ fmt);\n vprintf(fmt, ap);\n      va_end(ap);\n    }\n};\n```\n\n日志宏调用构造函数：\n\
    \n```cpp\n#define LOG_INFO(fmt, ...) Log<LOG_LEVEL_INFO>(__LINE__, fmt, ##__VA_ARGS__\
    \ )\n#define LOG_ERROR(fmt, ...) Log<LOG_LEVEL_ERROR>(__LINE__, fmt, ##__VA_ARGS__\
    \ )\n```\n\nC++ 编译器为我生成了两个打印日志函数，并为每次调用 log API 节省了一次栈推入操作。`log` 类是一个“仿函数（functoid）”——它是一个增强版的函数。我可以使用基于普通类的仿函数，而不是像这样的模板：\n\
    \n```cpp\nclass  Log {\npublic:\n Log(const  char *level) : level(level) {}\n\
    \ void  print(int line, const  char *fmt, ...) const {\n va_list ap;\n printf(\"\
    %s: line=%d, msg=\", level, line);\n      va_start(ap, fmt);\n vprintf(fmt, ap);\n\
    \      va_end(ap);\n    }\nprotected:\n const  char *level;\n};\nconst  Log LogInfo(\"\
    INFO\");\nconst  Log LogError(\"ERROR\");\n#define LOG_INFO(fmt, ...) LogInfo.print(__LINE__,\
    \ fmt, ##__VA_ARGS__ )\n#define LOG_ERROR(fmt, ...) LogError.print(__LINE__, fmt,\
    \ ##__VA_ARGS__ )\n```\n\n我舍弃了数组 `LOG_LEVEL_NAME`，现在扩展日志级别枚举变得更简单了。在目标代码中只有一个打印函数实例。代价是数据\
    \ RAM 中的几个字，或者两个 `Log` 类型的对象。代码和数据可以放在 ROM 中。\n\n调用 `vprintf()` 不是固件开发人员经常的操作。事实上，代码会针对同一组格式化字符串反复调用\
    \ `vprintf()`。我只需要向控制台发送 `vprintf()` 的参数，以及源代码中的确切位置或目标文件中的偏移。\n\n下方的 `BinaryLog`\
    \ 类仅处理“int” 类型的参数。源代码中的位置由“唯一”的文件标识符和源行号定义：\n\n```cpp\nclass  BinaryLog {\npublic:\n\
    \ BinaryLog(int fileId, int line, int count, ...);\n};\n```\n\n我假设有一个“sendData”\
    \ API 可以向控制台发送任意数量的整数：\n\n```cpp\nBinaryLog::BinaryLog(int fileId, int line, int\
    \ count, ...) {\n const  int HEADER_SIZE = 3;\n int header[HEADER_SIZE];\n   \
    \ header[0] = fileId;\n    header[1] = line;\n    header[2] = count;\n    sendDataStart();\n\
    \    sendData(header, HEADER_SIZE);\n va_list ap;\n    va_start(ap, count);\n\
    \ for (int j=0; j < count; j++) {\n int arg = va_arg(ap, int);\n      sendData(arg);\n\
    \    }\n    va_end(ap);\n    sendDataEnd();\n}\n```\n\n我仿真中的“send data” API 看起来如下：\n\
    \n```cpp\ninline void  sendData(const  int data) {\ncout << dec << data << \"\
    \ \";\n}\ninline void  sendDataStart() {cout << endl;}\ninline void  sendDataEnd()\
    \ {cout << endl;}\nvoid  sendData(const  int *data, int count) {\n for (int i\
    \ = 0;i < count;i++) {\ncout << hex << data[i] << \" \";\n    }\n}\n```\n\n两个宏定义调用构造函数\
    \ `BinaryLog`。宏 `ARGUMENTS_COUNT` 具有良好的可移植性，应返回可变宏中的参数数量：\n\n```cpp\n#define ARGUMENTS_COUNT(...)\
    \ (sizeof((int[]){__VA_ARGS__})/sizeof(int))\n#define LOG_INFO(fmt, ...) BinaryLog(FILE_ID,\
    \ __LINE__, ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__ )\n#define LOG_ERROR(fmt,\
    \ ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__\
    \ )\n```\n\n文件标识符由编译器在构建期间根据文件名生成。我使用了一个简单的哈希函数。真实的、如 MD5 哈希可以在 [7] 中找到。\n\n```cpp\n\
    constexpr  int hashData(const  char* s, int accumulator) {\n return *s ? hashData(s\
    \ + 1, (accumulator << 1) : accumulator;\n}\nconstexpr  int hashMetafunction(const\
    \  char* s) {\n return hashData(s, 0);\n}\nconstexpr  int FILE_ID = hashMetafunction(__FILE__);\n\
    ```\n\n用法示例：\n\n```cpp\nvoid testBinaryLog(void) {\n LOG_INFO(\"This is info %d\
    \ %d\", 1, 2);\n LOG_ERROR(\"This is error %d %d %d\", 0, 1, 2);\n}\n```\n\n在我的系统中，`test`\
    \ 函数产生输出：\n`26140 511 1 2`\n`26140 512 0 1`\n\n我现在只需要一个短脚本 ([8]) 来为所有源文件计算文件标识符，根据文件标识符\
    \ `26140` 找到正确的文件，解析 c++ 文件中的 `511` 和 `51` 行，并生成两行可读的内容：\ninfo 1 2\nerror 0 1\n\
    \n另一个构建脚本可以确保格式字符串正确表示对宏的调用。通过移除昂贵的 `vprintf()` 调用，我节省了大量的 CPU 周期和带宽。二进制日志不使用任何静态数据，且\
    \ API 是线程安全的。我的系统生成的日志在处理之前需要额外的处理。\n"
- fmt: "\nWhen I call the system log from interrupts I need to disable the interrupts.\
    \ For the task level system log a mutex is probably adequate. The C alternative\
    \ with the similar performance would require a macro.\n\n## Software Timers.\n\
    \nC++: Hard to learn and built to stay that way.\n\nSo far I have demonstrated\
    \ fairly simple software components, such as a `mutex` or a `cyclic buffer`. In\
    \ this chapter I am going to implement a software timer.\n\nModern operating systems\
    \ provide timers API. Typically an application can start a timer with arbitrary\
    \ expiration time. When the timer expires the operating system calls the application\
    \ hook from a dedicated timer thread or a system interrupt. Performance of such\
    \ API can degrade quickly if an application starts a lot of different timers.\
    \ There is usually no control over the priority of the process which handles the\
    \ timers. The API presented here allows an application to handle all timer related\
    \ code in a single context or in multiple contexts running with different priorities.\n\
    \nThe software timers API will have `O(1)` complexity. The API is going to be\
    \ thread safe. The source code for the software timer can be found in `[9]`.\n\
    \nYou already know the object-oriented design routine. Let's declare a timer object\
    \ first. A timer object keeps a unique timer identifier.\n\nA unique timer identifier\
    \ can be used to solve possible race conditions between `stopTimer` and `timerExpired`.\
    \ Consider following scenario: timer “a” is started by context A. Timer “a” is\
    \ stopped by context A, but too late - timer “a” has just expired and the application\
    \ code handling the expiration is running. Depending on the implementation of\
    \ the application callback, the processing of the event can be done asynchronously.\
    \ Meanwhile the same timer object can be allocated and modified by context B,\
    \ a different thread. If context A keeps identities of all started timers, the\
    \ application callback can check if the timer identifier is on the list of running\
    \ timers. If the timer was stopped, the callback can ignore the timer expiration.\
    \ Using the reference to the timer object itself for such bookkeeping is not good\
    \ because the pool of timer objects is probably a shared resource.\n\nWhen starting\
    \ a timer the user can supply optional pointer to the application data, a cookie.\
    \ The timer class could be a template like this:\n\n```cpp\ntemplate<typename\
    \  CookieType> class  Timer {\nprotected:\n    CookieType  cookie;\n};\n```\n\n\
    I want to simplify the interface and avoid using of virtual methods – more on\
    \ virtual methods in a moment – in the timer objects. Instead of objects of an\
    \ arbitrary type a timer object will keep a pointer to the application data.\n\
    \nA user can access the timer's data only via the public methods: getters and\
    \ setters. This approach helps to maintain the code in the future.\n\nThe class\
    \ `Timer` implements a constructor without arguments. I want to be able to create\
    \ a static array of timers without too much of trouble. The `TimerList` class,\
    \ which is not declared yet, is a friend class of the class `Timer` and can call\
    \ protected methods of the `Timer`. Method `start()` is protected, because application\
    \ shall start timers using the `TimerList` methods.\n\n```cpp\nclass  Timer {\n\
    public:\n    Timer();\n    inline  void  stop();\n    bool  isRunning() const;\n\
    \    TimerID  getId() const;\n    inline  uintptr_t  getApplicationData() const;\n\
    \    SystemTime  getStartTime() const;\nprotected:\n    friend  class  TimerList;\n\
    \    TimerID  id;\n    uintptr_t  applicationData;\n    bool  running;\n    SystemTime\
    \  startTime;\n    inline  void  start();\n    inline  void  setApplicationData(uintptr_t\
    \ applicationData);\n    inline  void  setId(TimerID id);\n    inline  void  setStartTime(SystemTime\
    \ systemTime);\n};\n```\n\nThe implementation of the methods is straightforward:\n\
    \n```cpp\nTimer::Timer() {\n    stop();\n}\n\nTimerID  Timer::getId() const {\n\
    \    return  id;\n}\n\nSystemTime  Timer::getStartTime() const {\n    return \
    \ startTime;\n}\n\nbool  Timer::isRunning() const {\n    return  running;\n}\n\
    \nvoid  Timer::stop() {\n    running = false;\n}\n\nvoid Timer::start() {\n  \
    \  running = true;\n}\n\nvoid  Timer::setApplicationData(uintptr_t applicationData)\
    \ {\n    this->applicationData = applicationData;\n}\n\nuintptr_t  Timer::getApplicationData()\
    \ const {\n    return  applicationData;\n}\n\nvoid  Timer::setId(TimerID id) {\n\
    \    this->id = id;\n}\n\nvoid  Timer::setStartTime(SystemTime systemTime) {\n\
    \    this->startTime = systemTime;\n}\n```\n\nThe system time is often a tick\
    \ incremented by an interrupt or read from the hardware. In this example I use\
    \ `size_t` type. In a more advanced design the `System Time` type and the `Timeout`\
    \ type could be two classes. The timer API only needs a function with the signature\
    \ `bool isTimerExpired(SystemTime, Timeout, SystemTime)`. In the following implementation\
    \ I handle `SystemTime` wrap around, assuming that timers timeouts are small relatively\
    \ to the `SystemTime` maximum value.\n\n```cpp\ntypedef  size_t  SystemTime;\n\
    typedef  size_t  Timeout;\n\nstatic  inline  bool  isTimerExpired(SystemTime startTime,\
    \ Timeout timeout,\n    SystemTime currentTime) {\n    bool timerExpired = false;\n\
    \    SystemTime timerExpiartionTime = startTime + timeout;\n\n    timerExpired\
    \ = timerExpired\n                || ((timerExpiartionTime >= currentTime)\n \
    \                   && (startTime < currentTime));\n\n    timerExpired = timerExpired\n\
    \                || ((timerExpiartionTime >= currentTime)\n                  \
    \  && (startTime > currentTime));\n\n    timerExpired = timerExpired\n       \
    \         || ((timerExpiartionTime <= currentTime)\n                    && (startTime\
