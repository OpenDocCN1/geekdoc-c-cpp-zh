  trans: "\n\n# 位运算\n\nA. 在 GCC 中，我们有一个内置函数 `__builtin_ffs()`。或者，你也可以使用类似下面的软件实现。请讨论涵盖\
    \ `x` 等于零情况的可能返回代码。\n\n```c\nint  findFirst(int x)\n{\n  if (x == 0)\n    return\
    \ 0;\n  int t = 1;\n  int r = 1;\n  while ((x & t) == 0) {\n    t = t << 1;\n\
    \    r = r + 1;\n  }\n  return r;\n}\n```\n\nQ. 如何清除整数中最低有效位以外的所有位？例如对于 `0x60`（2\
    \ 位被设置），结果是 `0x20`（1 位被设置）。\n\nA. 用单行 C 代码即可实现（参见 [18]）：\n\n```c\nx &= -x;\n```\n\
    \n或者，效果相同：\n\n```c\nx &= (~x+1)\n```\n\nQ. 如何检查整数是否为偶数。\n\nA. 偶数的最低有效位为零：\n\n\
    ```c\n\n((x & 1) == 0)\n```\n\nQ. 如何清除最右侧设置位？\n\nA. 将整数减 1 并与自身进行按位与运算：\n\n```c\n\
    x & (x-1)\n```\n\nQ. 如何设置最右边的零位？\n\nA. 将整数加 1 并与自身进行按位或运算：\n\n```c\nx | (x+1)\n\
    ```\n\nQ. 统计整数中的非零位。是否存在无分支解决方案？\n\nA. 清除右位并检查结果是否为零（参见 [19]）：\n\n```c\nint  countBits(int\
    \ n)\n{\n  int count=0;\n  while(n) {\n    count++;\n    n = n&(n-1);\n  }\n \
    \ return count;\n}\n```\n\n# 热门在线测试\n\n在以下测试中，每个问题后面跟着五个答案。最多三个答案可以是正确的。我不提供正确答案。\n\
    \n### 下列哪些语句描述了用于 C 条件编译的条件？\n\n* 条件必须求值为 0 或 1\n* 条件可以取决于任何“const”变量的值\n* 条件可以使用\
    \ `sizeof` 根据标准数据类型的大小对依赖于编译的操作做出决定\n* 条件可以取决于环境变量的值\n\n### 如果将 ANSI C 运算符用于不同类型的操作数，以下哪项正确描述了操作数或结果的类型转换？\n\
    \n* 操作数完全没有发生任何自动转换\n* 此操作将由编译器标记为错误\n* “窄”操作数被转换为“宽”操作数的类型以避免信息丢失\n* 操作数的值被改变以防止“窄”类型中可能的溢出\n\
    * 将结果赋值给“窄”类型可能会丢失信息，但不非法\n\n### 下列外围设备允许嵌入式系统使用双线或三线串行接口与其他设备通信？\n\n* 双向三态缓冲器\n\
    * 地址译码器\n* 通用同步收发器\n* 数字模模拟转换器\n* 非易失性存储器\n\n### 下列哪些语句正确描述了 ANSI C 语言中的函数在嵌入式系统中的？\n\
    \n* 链接的两个不同文件的全局函数名必须是唯一的\n* 函数可以通过值或指针调用\n* 函数不能返回多个值\n* 函数可以接受的最多参数数量为 12\n\
    * 每个函数都必须返回一个值\n\n### 下列哪些语句正确描述了下面的 ANSI C 代码？\n\n```c\ntypedef  char *pchar;\n\
    pchar  funcpchar();\ntypedef  pchar (*pfuncpchar)();\npfuncpchar  fpfuncpchar();\n\
    ```\n\n* `pfuncpchar` 是一个返回 char 指针的函数指针\n* `fpfuncpchar` 是一个返回函数指针的 char 指针\n\
    * `fpfuncpchar` 是一个返回返回 char 指针的函数指针\n* `fpfuncpchar` 是一个返回返回 char 指针的函数指针的函数\n\
    * `funcpchar` 是一个返回 char 指针的函数\n\n### 下列哪些语句正确描述了 ANSI C 中的按位右移运算符 `>>`？\n\n*\
    \ 右侧运算符必须大于等于 1\n* 它将其左侧操作数的每个位向右移动，移动数为右侧运算符指定的位数\n* 它可以用于反转数字的符号\n* 对于无符号整数，它会在左侧空出的位填充零\n\
    * 它可以用于将整数除以 2 的幂\n\n### 假设 ANSI C 采用补码表示法，以下哪些语句是正确的\n\n* 表示为带符号整数的负值，如果表示为相同尺寸无符号整数，将表示为大于符号整数最大值的正值\n\
    * 同一整数类型的带符号和无符号变范围在大小和数值最大最小值上是等价的\n* 整数类型的无符号版本范围是带符号版本的两倍\n* 带符号整数的表示多出一个符号位\n\
    \n### 在以下代码中，调用 print 函数可能看起来如下所示\n\n```c\nvoid process (int (*p)(int, int, char*))\
    \ {\n  int a = 5, b = 4;\n  char *c = \"aggregate\";\n  /* 为 b,a,c 调用 print */\n\
    \  return;\n}\nint main(void) {\n  process(report);\n}\n```\n\n* `p->report(b,a)`\n\
    * `(*p)(b,a)`\n* `p(b,a)`\n* `(*p)(report, b, a)`\n* `report(b,a)`\n\n### 下面代码编译失败的正确修复是：\n\
    \n```c\n/* File A */\nstruct pair a[10];\nvoid initialize(int x, int m, int b)\
    \ {\n  int i;\n  a[0].y = (a[0].x = x) * m + b;\n  for (i = 1;i < 10;++i)\n  \
    \  a[i].y = (a[i-1].x + 1)*m + b;\n}\n/*File B*/\nstruct pair {int x, y;};\nstruct\
    \ pair *op(int x) {\n  int i;\n  for (i = 10; i > 0;--i)\n    if (a[i].x == x)\n\
    \      break;\n  return a+1;\n}\n```\n\n* `extern struct pair a[];`\n* 数组 `a`\
    \ 的声明必须在 `op()` 的定义之前\n* 除非数组 `a` 在所有调用 `op()` 的文件中声明为 `extern`，否则返回的指针是的\n* 文件\
    \ A 中数组 `a` 的定义缺少 `extern` 关键字\n* 必须在文件 b 中指定数组的大小\n* 两个文件中 `struct pair` 的定义都缺少\
    \ `extern` 关键字\n\n### 下列哪些是 ANSI C 中格式正确的 #define 指令？\n\n* `#define DIF(X,Y) (X-Y)`\n\
    * `#define sqr(x) ((x)*(x))`\n* `#define mm_per_meter 1000;`\n* `#define SUM(X,Y)\
    \ ((X)+(Y))`\n* `#define INCHES_FEET 12`\n\n### 执行下面的 ANSI 代码的输出是什么\n\n```c\n\
    void f(void **p);\nint k =2;\nint *pk=&k;\nint main() {\n  int *p;\n  f(&p);\n\
    \  printf(\"%d\\n\", *p);\n  return 0;\n}\nvoid f(void **pp) {\n  (*pk)++;\n \
    \ *pp = pk;\n}\n```\n\n* 语法错误\n* `pk` 的地址\n* 垃圾值\n* 3\n* 2\n\n### for 循环完成后，输出数组的内容是什么\n\
    \n```c\nint encode (char, char);\nint main(void) {\n  char input [7] = {'M', 'E',':','G',':'},\
    \ output [7];\n  int i;\n  for (i = 0;i < 7;++i) {\n    output[i] = encode(input[i],\
    \ ':');\n  }\n  return 0;\n}\nint encode(char c , char t) {\n  switch(c) {\n \
    \   case 'E': c = 'A';break;\n    case 'O': c = 'X'; break;\n    case 'A': c =\
    \ 'T'; break;\n    case 'U': c = 'M'; break;\n  }\n  if (c >= 'A' && c <= 'Z'\
    \ || c >= 'a' && c <= 'z' && (c=t))\n    c = '\\0';\n  return c;\n}\n```\n\n*\
    \ `\\0`,`0`,`0`,`0`,`0`,`\\0`\n* `M`,`A`,`\\0`,`G`,`O`,`\\0`,`\\0`\n* `M`,`A`,`\\\
    0`,`G`,`X`,`\\0`,`\\0`\n* `\\0`,`0`,:`,`\\0`,`\\0`,:`,`\\0`\n* `:`,`:`,`:`,:::`\\\
    0`\n\n### dump_port() 函数应该输出\n\n```c\n/* I/O 寄存器数量 */\n#define PORT_SIZE 7\ntypedef\
    \ unsigned int word;\nunion IO_port {\n  word reglist[PORT_SIZE];\n  struct {\n\
    \    word ENABLE ;\n    word DIRECTION;\n    word OPEN_COLLECTOR;\n    word DATA;\n\
    \  } reg;\n};\nstatic union IO_port *GPIO = 0xE0004000; /*端口地址 */\n#include <stdio.h>\n\
    void dump_port(union IO_port *p) {\n  int i;\n  for (i = 0;i < PORT_SIZE;++i)\
    \ {\n    printf(\"%X \", p->reglist[i]);\n  }\n}\nint main(void) {\n  GPIO->reg.DATA\
    \ = 0x000000D0;\n  GPIO->reg.OPEN_COLLECTOR = 0x000000F0;\n  GPIO->reg.DIRECTION\
    \ = 0xFFFFFF0F;\n  GPIO->reg.ENABLE = 0x000030F0;\n  dump_port(GPIO);\n return\
    \ 0;\n}\n```\n\n* D0 F0 FFFFFF0F 30F0\n\n"
- fmt: "\n* `D000000` `F000000` `FFFFF0F` `F0300000`\n* `FFFFFFF` `F0300000` `20000000`\
    \ `D0000000`\n* `FFFFFF0F` `30F0` `2` `D0`\n\nWhat is returned by the following\
    \ function\n\n```cpp\nunsigned int process(unsigned int x, int p, int n)\n{\n\
    \ return x ^ (~(~0 << n) << p + 1 -n);\n}\n```\n\n* `p` bits of `x` beginning\
    \ at position `n`\n* `x` multiplied by `2^(p-n)`\n* `x` with the `n` bits beginning\
    \ at position `p` set to 1\n* the `n`th bit of `x` at position `p`\n* `x` with\
