  trans: "\n\n本文的读者可能会问，这个成员指针（pointer-to-member）练习的意义何在。我在调试器下运行应用程序时，有时我想使用绝对地址设置断点。我可以打印成员的绝对地址，并查看我的泛型类创建了多少个相同方法的实例。获取函数指针可以确保该函数不是“内联”函数。\n\
    \n## 进程间通信。\n\n无论如何，我讨厌多线程。多进程才是正道，应该是消息传递，而不是共享内存。那样无法扩展。我使用多线程是为了利用我所有的 16 个核心，或者说现在机器的平均核心数。大不了什么。我在数据中心有几千台服务器在等我，我该如何用线程来使用它们呢？–\
    \ Alex Martelli。\n\n经典的进程间通信（IPC）设计模式是邮箱（mailbox）或消息队列。邮箱设计模式在 Windows 3.11 以及第一批真正的实时操作系统（如\
    \ `RT Kernel` 和 `vxWorks`）处于技术前沿时变得流行。某些操作系统支持消息队列 API。我将演示一个基于两个原语构建的消息队列：`semaphore`（信号量）和\
    \ `FIFO`（先进先出队列）。`Mailbox` 类是“对象组合”（[4],[5]）的一个示例。我使用了“邮箱拥有一个 FIFO”的关系。或者，我可以使用“邮箱是一个\
    \ FIFO”的公式，并从 `FIFO` 类派生——继承邮箱。不过度使用继承被认为是一种做法。\n\n邮箱 API 有两个方法：发送消息和等待消息 ([6])：\n\
    \n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\nclass  Mailbox {\n\
    \npublic:\n\n Mailbox(const  char *name, size_t size);\n\n const  char *getName()\
    \ {return  name;}\n\n inline  bool  send(ObjectType msg);\n\n enum TIMEOUT {NORMAL,\
    \ NONE, FOREVER};\n\n bool  wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t\
    \ timeout);\n\nprotected:\n\n const  char *name;\n\n xQueueHandle  semaphore;\n\
    \n CyclicBufferDynamic<ObjectType, Lock> fifo;\n\n};\n```\n\n邮箱构造函数使用了 FreeRTOS\
    \ 计数信号量：\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\nMailbox<ObjectType,\
    \ Lock>::Mailbox(const  char *name, size_t size) :\n\n fifo(size),\n\n name(name)\
    \ {\n\n semaphore = xSemaphoreCreateCounting(size+1, 0);\n\n}\n```\n\nsend 方法向\
    \ FIFO 添加消息并递增信号量值：\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\
    \nbool  Mailbox<ObjectType, Lock>::send(ObjectType msg) {\n\n bool res;\n\nres\
    \ = fifo.add(msg);\n\n     xSemaphoreGive(semaphore);\n\n return res;\n\n}\n```\n\
    \n接收消息处理不同类型的超时：\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock>\n\n\
    bool  Mailbox<ObjectType, Lock>::wait(ObjectType *msg,\n\nTIMEOUT waitType, size_t\
    \ timeout) {\n\n bool res = false;\n\n     portBASE_TYPE semaphoreRes = pdFALSE;\n\
    \n while (semaphoreRes == pdFALSE) {\n\n if (waitType == TIMEOUT::FOREVER) {\n\
    \n              semaphoreRes = xSemaphoreTake(semaphore, portMAX_DELAY);\n\n \
    \         }\n else  if (waitType == TIMEOUT::NORMAL) {\n\n              semaphoreRes\
    \ = xSemaphoreTake(semaphore, timeout);\n\n break;\n\n          }\n else {\n\n\
    \              semaphoreRes = xSemaphoreTake(semaphore, 0);\n\n break;\n\n   \
    \       }\n\n    }\n\n if ((semaphoreRes == pdTRUE) && !fifo.isEmpty()) {\n\n\
    res = fifo.remove(msg);\n\n     }\n\n return res;\n\n}\n```\n\n在示例应用程序中，中断（生产者）从\
    \ `UART` 设备读取数据，并将收集的数据发送到处理任务（消费者）。我的消息对象包含两个内容：一个消息事件和一些数据。消费者任务预计根据消息事件进行切换：\n\
    \n```cpp\nenum EVENT {UART0, UART1};\n\ntypedef  struct {\n\n enum EVENT event;\n\
    \n size_t  data[32];\n\n int  dataSize;\n\n} Message;\n```\n\n在下面的示例中，我重用了上一个章节中的内存池：\n\
    \n```cpp\nMemoryPool<LockDummy, Message, 3> pool;\n\nMailbox<Message*, LockDummy>\
    \ myMailbox(\"mbx\", 3);\n\nvoid  rxTask( void ) {\n\n     myMailbox.wait(&message,\n\
    \n      myMailbox.TIMEOUT::FOREVER, 0);\n\ncout << \"data=\" <<\n\n         message->data\
    \ << \", event=\" <<\n\n         message->event << endl;\n\n    pool.free(message);\n\
    \n}\n\nint  main( void ) {\n\n     Message *message;\n\n     pool.allocate(&message);\n\
    \n     message->data[0] = 0x30;\n\n     message->dataSize = 1;\n\n     message->event\
    \ = EVENT::UART0;\n\n     myMailbox.send(message);\n\n}\n```\n\n在许多情况下，现代固件开发人员会使用“流水线”（pipeline）。“流水线是一系列串联连接的数据处理元素，其中一个元素的输出是下一个元素的输入”（Wikipedia）。一个处理元素（例如线程）唤醒并检查邮箱——任务队列。如果队列不为空，该线程执行一个阶段的处理，并将处理后的数据转发给流水线中的下一个线程。\n\
    \n流水线任务有两个方法：添加新任务和处理数据。流水线任务——一个阶段——有一个名称并保留对下一个阶段的引用：\n\n```cpp\ntemplate<typename\
    \  ObjectType, typename  Lock, std::size_t  Size>\n\nclass  PipelineTask {\n\n\
    public:\n\n PipelineTask(const  char *name,\n\n PipelineTask *nextStage = nullptr)\
    \ :\n\n name(name),\n\n nextStage(nextStage){}\n\n void  doJob();\n\n void  addJob(ObjectType\
    \ &data);\n\nprotected:\n\n const  char *name;\n\n PipelineTask *nextStage;\n\n\
    \ CyclicBuffer<ObjectType, Lock, Size> fifo;\n\n};\n```\n\nadd job API 向 FIFO\
    \ 添加数据：\n\n```cpp\ntemplate<typename  ObjectType, typename  Lock, std::size_t\
    \  Size>\n\nvoid  PipelineTask<ObjectType, Lock, Size>::addJob(ObjectType &data)\
    \ {\n\n fifo.add(data);\n\n}\n```\n\n`doJob()` 方法从 FIFO 获取数据，对其进行递增——我假设数据类型支持\
    \ `operator++()`，并将数据推送到下一个阶段：\n\n```cpp\ntemplate<typename  ObjectType, typename\
    \  Lock, std::size_t  Size>\n\nvoid  PipelineTask<ObjectType, Lock, Size>::doJob()\
    \ {\n\n while (!fifo.isEmpty()) {\n\n ObjectType data;\n\n fifo.remove(data);\n\
    \n         data++;\n\ncout << \"Stage:\" << name << \", data=\" << data << endl;\n\
    \n nextStage->addJob(data);\n\n    }\n\n}\n```\n\n新类型 `MyPipelineTask`：\n\n```cpp\n\
    typedef PipelineTask<int, LockDummy, 3> MyPipelineTask;\n```\n\n流水线的三个阶段——倒数第三个阶段没有“后续”：\n\
    \n```cpp\nMyPipelineTask pipelineTask3(\"3\");\n\nMyPipelineTask pipelineTask2(\"\
    2\", &pipelineTask3);\n\nMyPipelineTask pipelineTask1(\"1\", &pipelineTask2);\n\
    ```\n\n我可以从中断或主循环调用流水线的阶段，例如如下所示：\n\n```cpp\nvoid  testPipeline() {\n\n int data\
    \ = 0;\n\n     pipelineTask1.addJob(data);\n\n     pipelineTask1.doJob();\n\n\
    \     pipelineTask2.doJob();\n\n     pipelineTask3.doJob();\n\n}\n```\n\n上面的代码生成输出：\n\
    \nStage:1, data=1\nStage:2, data=2\nStage:3, data=3\n\n流水线范式可以提高 CPU 的利用率，流水线使得更容易利用多核系统。\n\
    \n## 日志（Log）。\n\n完美不是已经没有什么可增加的，而是已经没有什么可减少的——安托万·圣埃克佩里\n\n在一个 C 项目中，我看到过以下生成日志条目的代码：\n\
    \n```cpp\nenum {\n\n LOG_LEVEL_INFO,\n\n LOG_LEVEL_ERROR,\n\n LOG_LEVEL_LAST,\n\
    \n};\n\nstatic  const  char *LOG_LEVEL_NAME[] = {\"INFO\", \"ERROR\", “UKNOWN”};\n\
    \n#define LOG_INFO(fmt, ...) log_print(__LINE__, LOG_LEVEL_INFO, fmt, ##__VA_ARGS__\
    \ )\n\n#define LOG_ERROR(fmt, ...) log_print(__LINE__, LOG_LEVEL_ERROR, fmt, ##__VA_ARGS__\
    \ )\n\nstatic  void  log_print(int line, int level, const  char *fmt, ...)\n\n\
    {\n\n va_list ap;\n\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[level], line);\n\
    \n     va_start(ap, fmt);\n\n vprintf(fmt, ap);\n\n     va_end(ap);\n\n}\n\nvoid\
    \  testLog(void) {\n\n     LOG_INFO(\"This is info %d\", 1);\n\n     LOG_ERROR(\"\
    This is error %d\", 2);\n\n}\n```\n\n在我的机器上，上面的代码生成输出：\n\nINFO: line=402, msg=This\
    \ is info 1\nERROR: line=403, msg=This is error 2\n\n"
- fmt: "\nThere are many calls to the log API and size of the image is important.\
    \ Calls to `log_print()` push at least three arguments into the stack. I think\
    \ that I can save one push – a log level. In the C implementation I would add\
    \ functions `log_print_info(...)` and `log_print_error(...)` which in turn call\
    \ `log_print()`, and fix the macros accordingly. In C++ I have a template. The\
    \ constructor is an exact copy of the original `log_print` function minus log\
    \ level:\n\n```cpp\ntemplate <int  Level> class  Log {\npublic:\n Log(int line,\
    \ const  char *fmt, ...) {\n va_list ap;\n printf(\"%s: line=%d, msg=\", LOG_LEVEL_NAME[Level],\
    \ line);\n      va_start(ap, fmt);\n vprintf(fmt, ap);\n      va_end(ap);\n  \
    \  }\n};\n```\n\nThe log macros call the constructor:\n\n```cpp\n#define LOG_INFO(fmt,\
    \ ...) Log<LOG_LEVEL_INFO>(__LINE__, fmt, ##__VA_ARGS__ )\n#define LOG_ERROR(fmt,\
    \ ...) Log<LOG_LEVEL_ERROR>(__LINE__, fmt, ##__VA_ARGS__ )\n```\n\nC++ compiler\
    \ has duplicated two print log functions for me and saved a push to the stack\
    \ for every call to the log API. Class `log` is a “functoid – it is a function\
    \ on steroids. I can use a functoid based on a regular class instead of a template\
    \ like this:\n\n```cpp\nclass  Log {\npublic:\n Log(const  char *level) : level(level)\
    \ {}\n void  print(int line, const  char *fmt, ...) const {\n va_list ap;\n printf(\"\
    %s: line=%d, msg=\", level, line);\n      va_start(ap, fmt);\n vprintf(fmt, ap);\n\
    \      va_end(ap);\n    }\nprotected:\n const  char *level;\n};\nconst  Log LogInfo(\"\
    INFO\");\nconst  Log LogError(\"ERROR\");\n#define LOG_INFO(fmt, ...) LogInfo.print(__LINE__,\
    \ fmt, ##__VA_ARGS__ )\n#define LOG_ERROR(fmt, ...) LogError.print(__LINE__, fmt,\
    \ ##__VA_ARGS__ )\n```\n\nI have dropped array `LOG_LEVEL_NAME` and now it is\
    \ easier to expand an enumeration of log levels. There is only one instance of\
    \ the print function in the object code. The cost is a couple of words in the\
    \ data RAM or two objects of the type `Log`. The code and the data can be placed\
    \ in the ROM.\n\nCall to `vprintf()` is not something firmware developers do often.\
    \ Indeed the code calls `vprintf()` again and again for the same set of format\
    \ strings. I can send to the console only the arguments to the `vprintf()` and\
    \ the exact location in the source code or the offset in the object file.\n\n\
    Class `BinaryLog` below handles only arguments of type “int”. A location in the\
    \ source code is defined by a “unique” file identifier and a source line number:\n\
    \n```cpp\nclass  BinaryLog {\npublic:\n BinaryLog(int fileId, int line, int count,\
    \ ...);\n};\n```\n\nI assume that there is “sendData” API which can send arbitrary\
    \ number of integers to the console:\n\n```cpp\nBinaryLog::BinaryLog(int fileId,\
    \ int line, int count, ...) {\n const  int HEADER_SIZE = 3;\n int header[HEADER_SIZE];\n\
    \    header[0] = fileId;\n    header[1] = line;\n    header[2] = count;\n    sendDataStart();\n\
    \    sendData(header, HEADER_SIZE);\n va_list ap;\n    va_start(ap, count);\n\
    \ for (int j=0; j < count; j++) {\n int arg = va_arg(ap, int);\n      sendData(arg);\n\
    \    }\n    va_end(ap);\n    sendDataEnd();\n}\n```\n\nAPI “send data” in my simulation\
    \ looks like this:\n\n```cpp\ninline void  sendData(const  int data) {\ncout <<\
    \ dec << data << \" \";\n}\ninline void  sendDataStart() {cout << endl;}\ninline\
    \ void  sendDataEnd() {cout << endl;}\nvoid  sendData(const  int *data, int count)\
    \ {\n for (int i = 0;i < count;i++) {\ncout << hex << data[i] << \" \";\n    }\n\
    }\n```\n\nTwo macro definitions call constructor `BinaryLog`. Macro `ARGUMENTS_COUNT`\
    \ is fairly portable and shall return number of arguments in a variadic macro:\n\
    \n```cpp\n#define ARGUMENTS_COUNT(...) (sizeof((int[]){__VA_ARGS__})/sizeof(int))\n\
    #define LOG_INFO(fmt, ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__),\
    \ __VA_ARGS__ )\n#define LOG_ERROR(fmt, ...) BinaryLog(FILE_ID, __LINE__, ARGUMENTS_COUNT(__VA_ARGS__),\
    \ __VA_ARGS__ )\n```\n\nThe file identifier is generated by the compiler from\
    \ the file name during the build. I use a simple hash function. A real thing,\
    \ an MD5 hash, can be found in [7].\n\n```cpp\nconstexpr  int hashData(const \
    \ char* s, int accumulator) {\n return *s ? hashData(s + 1, (accumulator << 1)\
    \ : accumulator;\n}\nconstexpr  int hashMetafunction(const  char* s) {\n return\
    \ hashData(s, 0);\n}\nconstexpr  int FILE_ID = hashMetafunction(__FILE__);\n```\n\
    \nUsage example:\n\n```cpp\nvoid testBinaryLog(void) {\n LOG_INFO(\"This is info\
    \ %d %d\", 1, 2);\n LOG_ERROR(\"This is error %d %d %d\", 0, 1, 2);\n}\n```\n\n\
    In my system the `test` function produces output:\n`26140 511 1 2`\n`26140 512\
    \ 0 1`\n\nAll I need now is a short script ([8]) that calculates file identifiers\
    \ for all source files, finds the right file according to file identifier `26140`,\
    \ parses lines `511` and `51` in the the++ file and produces two readable lines:\n\
    info 1 2\nerror 0 1\n\nYet another build script can ensure that format strings\
    \ correctly represent calls to the macros. By removing an expensive call to `vprintf()`\
    \ I saved lot CPU cycles,, of of and some bandwidth. The binary log does not use\
    \ any static data and the API is thread safe. My system generates logs which require\
    \ additional processing before they can be read by a human, but there are situations\
    \ when this is small price to pay.\n\nIn the next example I assume that the application\
    \ is statically linked and all addresses are getting at build time. I can get\
    \ rid of the line number and file identifier and, instead, use value of the program\
    \ counter. Code below will work only for GCC. GCC compiler allows to get the address\
    \ of label. The `BinaryLog` constructor accepts an address of log entry:\n\n```cpp\n\
    BinaryLog::BinaryLog(void *address, int count, ...) {\n const  int HEADER_SIZE\
    \ = 2;\n int header[HEADER_SIZE];\n header[0] = ((uintptr_t)address) & INTMAX_MAX;\n\
    \ header[1] = count;\n    sendDataStart();\n    sendData(header, HEADER_SIZE);\n\
    \ va_list ap;\n    va_start(ap, count);\n for (int j=0; j < count; j++) {\n int\
    \ arg = va_arg(ap, int);\n      sendData(arg);\n    }\n    va_end(ap);\n    sendDataEnd();\n\
    }\n```\n\nThe magic macros generate unique labels and forward the labels address\
    \ to the `BinaryLog` constructor:\n\n```cpp\n#define TOKEN_CAT(x, y) x ## y\n\
    #define TOKEN_CAT2(x, y) TOKEN_CAT(x, y)\n#define LABEL TOKEN_CAT2 (logLabel_,\
    \ __LINE__)\n#define LOG_INFO(fmt, ...) { \\\n      LABEL:\\\n      BinaryLog(&LABEL,\
    \ ARGUMENTS_COUNT(__VA_ARGS__), __VA_ARGS__ ); \\\n}\n```\n\nA post build script\
    \ shall read a map file generated by the linker, collect list of labels according\
