  \n![](img/00104.jpeg)\n\n## 17 在具有非负边权的图中寻找最短路径\n\n### 解决方案\n给定一个具有非负边权重的图，我们可以应用\
  \ Dijkstra 算法来寻找单源最短路径树[[6]](#part0000_split_036.html__ftn6)。埃德加·戴杰·迪克斯斯特拉（Edsger\
  \ W. Dijkstra）出生于荷兰，他在 1959 年发明了该算法。对于给定的源节点 ![](img/00105.jpeg)，该算法寻找 ![](img/00106.jpeg)\
  \ 与其他所有节点之间代价最低的路径。这类问题有多个应用，包括优化、路由和流量分配。Dijkstra 的伪代码如下。向量 ![](img/00107.jpeg)\
  \ 包含了到达节点 ![](img/00108.jpeg) 的路径权重之和（初始时为无穷大）。向量 ![](img/00109.jpeg) 包含了 ![](img/00110.jpeg)\
  \ 在最短路径中的前驱节点（初始为 ![](img/00111.jpeg)）。此外，一个优先级队列 ![](img/00112.jpeg) 用于选择具有最小 ![](img/00114.jpeg)\
  \ 的节点 ![](img/00113.jpeg)（在伪代码中，该操作是 `u ← EXTRACT-MIN(Q)`）。此外，![](img/00115.jpeg)]包含了所有与\
  \ ![](img/00117.jpeg) 相邻的节点 ![](img/00116.jpeg)。因此，对于每个 ![](img/00118.jpeg)，如果 ![](img/00119.jpeg)\
  \ - 通往 ![](img/00120.jpeg) 的路径权重之和 - 加上边 ![](img/00121.jpeg) 的权重小于 ![](img/00122.jpeg)\
  \ - 然后我们就找到了一条更短的路径。在这种情况下，![](img/00123.jpeg) 和 ![](img/00124.jpeg) 被更新。如果节点 `v`\
  \ 之前未访问过，则将其添加到 `Q`。相反，如果已经访问过，应根据新权重降低其在 `Q` 中的优先级（这是伪代码中的操作 `DECREASE-KEY(Q, v)`）。最后返回\
  \ ![](img/00126.jpeg) 和 ![](img/00127.jpeg)。\n\n### 代码\n```\nDIJKSTRA(G, s, w) for\
  \ each vertex u in V d[u] ← infinity p[u] ← u color[u] ← WHITE d[s] ← 0 INSERT(Q,\
  \ s) while (Q != Ø) u ← EXTRACT-MIN(Q) for each vertex v in Adj[u] if (w(u,v) +\
  \ d[u] < d[v]) d[v] ← w(u,v) + d[u] p[v] ← u if (color[v] == WHITE) color[v] ← GRAY\
  \ INSERT(Q, v) else if (color[v] == GRAY) DECREASE-KEY(Q, v) color[u] ← BLACK return\
  \ (d, p)\n```\n\n对于这个练习[7]，我们开始使用 `boost::BGL`，这是一个用于图创建和处理的强大框架[8]。图可以与边关联权重和名称，这些存储在\
  \ `boost::property` 中。此外，图可以用 `boost::adjacency_list` 或 `boost::adjacency_matrix`\
  \ 表示。`boost::adjacency_list` 使用了许多参数，包括 `EdgeList`（表示每个顶点边列表的选择器）、`VertexList`（表示图顶点列表的选择器）、`Directed`（指定是否为有向图）等。\n\
  \n\n\n\n\n```cpp\nboost::distance_map(distanceMap).predecessor_map(predecessorMap));\n\
  \nstd::cout << \"distances and parents:\" << std::endl;\n\nNameMap nameMap = boost::get(boost::vertex_name,\
  \ g);\n\nBGL_FORALL_VERTICES(v, g, Graph)\n{\n    std::cout << \"distance(\" <<\
  \ nameMap[v0] << \", \" << nameMap[v] << \") = \" << distanceMap[v] << \", \";\n\
  \    std::cout << \"predecessor(\" << nameMap[v] << \") = \" << nameMap[predecessorMap[v]]\
  \ << std::endl;\n}\nstd::cout << std::endl;\n\ntypedef std::vector<Graph::edge_descriptor>\
  \ PathType;\nPathType path;\nNode v = v3;\n\nfor (Node u = predecessorMap[v]; u\
  \ != v; v = u, u = predecessorMap[v])\n{\n    std::pair<Graph::edge_descriptor,\
  \ bool> edgePair = boost::edge(u, v, g);\n    Graph::edge_descriptor edge = edgePair.first;\n\
  \    path.push_back(edge);\n}\n\nfloat totalDistance = 0;\nfor (PathType::reverse_iterator\
  \ pathIterator = path.rbegin(); pathIterator != path.rend(); ++pathIterator)\n{\n\
  \    std::cout << nameMap[boost::source(*pathIterator, g)] << \" -> \" << nameMap[boost::target(*pathIterator,\
  \ g)] << \" = \" << boost::get(boost::edge_weight, g, *pathIterator) << std::endl;\n\
  }\nstd::cout << \"Distance: \" << distanceMap[v2] << std::endl;\n```\n\n一个非常有用的练习是使用\
  \ `Dijkstra` 计算图片 ![](img/0128.jpeg) 中所示图中的最短路径。\n\n### 复杂度\n如果使用斐波那契堆（Fibonacci\
  \ heaps）实现优先级队列，时间复杂度为 ![](img/0129.jpeg)。`Fibonacci heap` 是一种高效实现最小值的优先级队列。注意 `Dijkstra`\
  \ 算法没有使用最小优先队列，运行时间为 ![](img/0130.jpeg)。\n\n## 18 使用 Kruskal 寻找 MST（最小生成树）\n\n`Kruskal`\
  \ 算法可以在带权无向图中找到最小生成树（`MST`）。该算法按权重递增顺序对边进行排序，如果某条边不会与已选的边形成环，则将其包含。\n\n### 解决方案\n\
  伪代码使用了 `UNION-FIND` 操作：\n* `Find`：确定特定元素属于哪个子集。它用于判断两个元素是否在同一个子集中。\n* `Union`：将两个子集合并为一个子集。\n\
  \n```\nKRUSKAL-MST(G, w)\nT ← Ø\nfor each vertex u in V\n    MAKE-SET(DS, u)\nfor\
  \ each edge (u,v) in E in order nondecreasing weight\n    if FIND-SET(DS, u) !=\
  \ FIND-SET(DS, v)\n        UNION-SET(DS, u, v)\n        T ← T {(u,v)}\nreturn T\n\
  ```\n在 `boost` 中，这被定义在 `graph/kruskal_min_spanning_tree.hpp` 中。作为一个练习，尝试对以下图 ![](img/0136.jpeg)\
  \ 计算 `Kruskal`。\n\n### 复杂度\n时间复杂度为 ![](img/0145.jpeg)，因为我们使用了并查数据结构来存储集合信息，其中对元素的\
  \ `Find` 操作需要反阿曼时间。\n\n## 19 在 DAG 中寻找最长路径\n\n对于通用图，寻找最长路径是一个 NP-hard 问题。但如果我们有一个\
  \ `DAG`，我们可以轻松地计算拓扑排序。然后对于每个节点，通过使用当前顶的距离更新其相邻节点的距离。\n\n### 解决方案\n此代码使用了之前定义的拓扑排序，并从源节点开始添加权重\n\
  \n### 代码\n```cpp\nvoid longestPathDAG(const Graph & g, const Graph::NodeID id, std::vector<Graph::NodeID>&\
  \ distance)\n{\n    std::stack<Graph::NodeID> stk;\n    distance = std::vector<Graph::NodeID>(g.numNodes(),\
  \ std::numeric_limits<Graph::NodeID>::max());\n    std::vector<bool> visited(g.numNodes(),\
  \ false);\n    distance[id] = 0;\n    for (Graph::NodeID id = 0; id < g.numNodes();\
  \ ++id)\n        if (!visited[id])\n            topologicalSortUtil(g, id, visited,\
  \ stk);\n    while (!stk.empty())\n    {\n        const Graph::NodeID id = stk.top();\n\
  \        stk.pop();\n        if (distance[id] != std::numeric_limits<Graph::NodeID>::max())\n\
  \        {\n            // 更新距离的逻辑\n        }\n    }\n}\n```\n*(注：原文提供的代码片段在排版中存在部分重复和错乱，此处已根据语义逻辑进行了结构化对齐)*\n\
  \n\n\n\nFloyd & Warshall 算法寻找图中每对顶点之间的最短距离。该算法可以检测是否存在负权环路，否则环路会产生退化的负无穷最短路径。\n\n\
  ### 解决方案\n\n伪代码如下：\n\n```\nlet dist be a |V| × |V| array of min distances initialized\
  \ to ∞\n\nfor each vertex v\n    dist[v][v] ← 0\n\n for each edge (u,v)\n    dist[u][v]\
  \ ← w(u,v)  // 边 (u, v) 的权重\n\n for k from 1 to |V|\n  for i from 1 to |V|\n   \
  \ for j from 1 to |V|\n      if dist[i][j] > dist[i][k] + dist[k][j]\n        dist[i][j]\
  \ ← dist[i][k] + dist[k][j]\n```\n\n该伪代码计算了图中所有节点 ![](img/00172.jpeg) 之间最短路径的权重。然而，它并没有记录最短路径。可以通过代码的某些修改来存储这些路径，这里留作练习。\n\
  \n现在让我们考虑负环，即边权之和为负值的环。任何构成负环的节点对 ![](img/00173.jpeg) 之间不存在最短路径，因为从 ![](img/00174.jpeg)\
  \ 到 ![](img/00175.jpeg) 的路径长度可以任意小。作为一项练习，我们要求修改伪代码以检测负环。\n\n在 boost 中，这定义在 `[boost/graph/floyd_warshall_shortest.hpp](http://www.boost.org/doc/libs/1_41_0/boost/graph/floyd_warshall_shortest.hpp)`\
  \ 中。\n\n### 复杂度\n\n时间复杂度为 ![](img/00176.jpeg)，空间复杂度为 ![](img/00177.jpeg)\n\n## 22\
  \ 使用 Bellman Ford 算法寻找所有单源最短路径\n\nBellman-Ford 算法解决的是具有正权和负权边的图的单源最短路径问题。对于只有正权边的图，Dijkstra\
  \ 算法更高效。Bellman Ford 是旧版 RIP[[12]](#part0000_split_036.html__ftn12)（路由路由协议）的代码。Bellman-Ford\
  \ 与 Dijkstra 非常相似，但它处理所有的边，而不是在待处理的节点中选择权重最小的节点（贪心选择）。这种计算对所有节点重复进行。\n\n### 解决方案\n\
  \n伪代码如下：\n\n```\nBELLMAN-FORD(G)\n\n for each vertex u in V\n d[u] ← infinity; p[u]\
  \ ← u\n\n for  i ← 1  to  |V|-1\n  for each edge (u,v) in E\n  if (w(u,v) + d[u]\
  \ < d[v])\n  d[v] ← w(u,v) + d[u];\n  p[v] ← u\n\n for each edge (u,v) in E\n  if\
  \ (w(u,v) + d[u] < d[v])\n  return (false, , )\n\n return (true, p, d)\n```\n\n\
  在 boost 中，这定义在 `[boost/graph/bellman_ford_shortest_paths.hpp](http://www.boost.org/doc/libs/1_55_0/boost/graph/bellman_ford_shortest_paths.hpp)`\
  \ 中。\n\n### 复杂度\n\n时间复杂度为 ![](img/00178.jpeg)\n\n## 23 区间的独立集\n\n给定实数线上的 n 个区间，最大独立集是具有最大规模的区间子集\
