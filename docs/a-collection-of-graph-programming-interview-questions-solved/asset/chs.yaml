  \n## 4 埃尔什数\n保罗·埃尔什（Paul Erdős）是一位著名的数学家，他写了超过 1500 篇科学论文。他的直接合作作者与他的距离为 1，而他们各自的合作作者距离为\
  \ 2。递归地，任何与距离埃尔什为![](img/00031.jpeg)的作者有合作的人，其距离将是![](img/00032.jpeg)（也记为 Erdős\
  \ (author)=K）。本书作者的埃尔什数为“Antonio Gulli”=3，因为他曾与“Fabrizio Sebastiani”共同写过论文，而后者又与“Micheal\
  \ Anthony Steel”写过论文，后者是埃尔什的直接合作作者。埃尔什数可以通过 BFS 访问的略微变体来计算，此实现留作练习。\n\n## 5 实现 DFS\
  \ 访问\n深度优先搜索（DFS）是图的一种访问策略，从根节点开始访问，并在每个分支上尽可能深地探索，直到回溯到第一个未访问的子节点。\n\n### 解决方案\n\
  这是另一个面试题，可以通过递归或迭代解决。`dfs`方法实现了一个递归解决方案，从根节点开始并维护一个访问节点及其颜色的向量。对于每个节点，初始颜色为‘w’（白色），当节点被访问时为‘g’（灰色），当所有相邻节点都被访问时为‘b’（黑色）。此外，节点被访问时的时间也存储在向量中。`dfsStack`方法实现了一个迭代解决方案，将根节点插入栈中。然后移除栈顶元素并将所有未访问的相邻节点放入栈中。重复此过程直到栈为空。\n\
  \n### 代码\n```cpp\nvoid dfsUtil(const Graph & g, Graph::NodeID sid, std::vector<bool>\
  \ & visited, std::vector<Graph::NodeID> & colour, std::vector<Graph::NodeID> & timing,\
  \ unsigned int & time)\n{\n    std::cout << \"dfsUtil on \" << sid << std::endl;\n\
  \    visited[sid] = true;\n    colour[sid] = 'g'; // 灰色\n    ++time;\n    timing[sid]\
  \ = time;\n    for (const auto & e : g.edges(sid))\n        if (!visited[e.v])\n\
  \            dfsUtil(g, e.v, visited, colour, timing, time);\n    colour[sid] =\
  \ 'b'; // 黑色\n    ++time;\n}\n\nvoid dfs(const Graph & g, Graph::NodeID sid)\n{\n\
  \    if (sid >= g.numNodes()) // 对未知节点进行 DFS\n        return;\n    unsigned int\
  \ time = 0;\n    std::vector<bool> visited(g.numNodes(), false); // 白色\n    std::vector<Graph::NodeID>\
  \ colour(g.numNodes(), 'w');\n    std::vector<Graph::NodeID> timing(g.numNodes(),\
  \ 0);\n    visited[sid] = true;\n    std::cout << \"Starting dfs on \" << sid <<\
  \ std::endl;\n    for (const auto & e : g.edges(sid))\n    {\n        if (!visited[e.v])\n\
  \        {\n            visited[e.v] = true;\n            dfsUtil(g, e.v, visited,\
  \ colour, timing, time);\n        }\n    }\n    std::cout << \"End dfs\" << std::endl\
  \ << std::endl;\n}\n\nvoid dfsStack(const Graph & g, Graph::NodeID sid)\n{\n   \
  \ if (sid >= g.numNodes()) // 对未知节点进行 DFS\n        return;\n    std::stack<Graph::NodeID>\
  \ nodesVisited;\n    std::vector<bool> visited(g.numNodes(), false);\n    visited[sid]\
  \ = true;\n    nodesVisited.push(sid);\n    std::cout << \"Starting dfs on \" <<\
  \ sid << std::endl;\n    while (!nodesVisited.empty())\n    {\n        Graph::NodeID\
  \ nid = nodesVisited.top();\n        bool myFullExploredNode = true;\n        for\
  \ (const auto & e : g.edges(nid))\n        {\n            if (!visited[e.v])\n \
  \           {\n                visited[e.v] = true;\n                nodesVisited.push(e.v);\n\
  \                std::cout << \"Visited: \" << e.v << std::endl;\n             \
  \   myFullExploredNode = false;\n                break;\n            }\n       \
  \ }\n        if (myFullExploredNode)\n            nodesVisited.pop();\n    }\n \
  \   std::cout << \"End dfs\" << std::endl << std::endl;\n}\n```\n\n### 复杂度\n空间复杂度对于栈是![](img/00033.jpeg)和![](img/00034.jpeg)，如果使用邻接表表示图；如果采用邻接矩阵，则是\
  \ ![](img/00035.jpeg)。时间复杂度为![](img/00036.jpeg)，其中![](img/00037.jpeg)可能在![](img/00038.jpeg)到![](img/00039.jpeg)之间变化，取决于图的稀疏程度。\n\
  \n## 6 如何检测图环\n### 解决方案\n如果在访问图的过程中存在回边，DFS 可以检测出环。使用上述解决方案定义的符号，这种情况表示为从灰色节点到灰色节点。\n\
  \n### 代码\n此实现留作练习。\n\n### 复杂度\n此处的复杂度与 DFS 相同。\n\n## 7 给定无向图中的两个节点，找到连接它们的路径\n###\
  \ 解决方案\n简单的解决方案是从其中一个节点开始按 DFS 顺序访问图，一旦找到另一个节点就停止。在此过程中，访问的节点被存储在栈中。最后栈将包含所需的路径。\n\
  \n### 代码\n此实现留作练习。\n\n### 复杂度\n复杂度与 DFS 相同。\n\n## 8 解决迷宫\n假设我们有一个如所示的迷宫。找到出口的最佳方法是什么？\n\
  \n![`upload.wikimedia.org/wikipedia/commons/thumb/9/9d/MAZE_40x20_DFS_no_deadends.png/220px-MAZE_40x20_DFS_no_deadends.png`](img/00040.gif)\n\
  \n### 解决方案\n感兴趣的读者可以思考如何用图![](img/00041.jpeg)表示迷宫，以及在![](img/00042.jpeg)上最合适的访问策略是什么。\n\
  \n\n\n\n\n[有向图](http://en.wikipedia.org/wiki/Directed_graph) 的拓扑排序是其[顶点](http://en.wikipedia.org/wiki/Vertex_(graph_theory))\
  \ 的一种线性排序，使得对于每一条从顶点 ![](img/00044.jpeg) 指向顶点 ![](img/00045.jpeg) 的有向边 ![](img/00043.jpeg)，该边在排序中都排在\
  \ ![](img/00046.jpeg) 之前。当且仅当图中没有有向环时，拓扑排序才是可能的。这种图被称为“有向无环图”（DAG）。\n\n### 解决方案\n\
  \n给定一个 DAG，通过使用广度优先搜索（BFS）访问节点并将节点存储在栈 `stk` 中，可以获得拓扑排序。在过程结束时，栈将包含按拓扑排序的节点。如果图不是\
  \ DAG，感兴趣的读者应该修改代码以验证环是否存在（此处留作练习题）。\n\n### 代码\n\n```cpp\nvoid topologicalSortUtil(const\
  \ Graph & g, Graph::NodeID sid, std::vector<bool> & visited, std::stack<Graph::NodeID>\
  \ &stk)\n{\n    visited[sid] = true;\n    std::cout << \"\\t topologicalSortUtil\"\
  \ << sid << std::endl;\n    for (const auto & e : g.edges(sid))\n        if (!visited[e.v])\n\
  \            topologicalSortUtil(g, e.v, visited, stk);\n    stk.push(sid);\n}\n\
  \nvoid topologicalSort(const Graph & g)\n{\n    std::vector<bool> visited(g.numNodes(),\
  \ false);\n    std::stack<Graph::NodeID> stk;\n    for (Graph::NodeID nid = 0; nid\
  \ < g.numNodes(); ++nid)\n        if (!visited[nid])\n            topologicalSortUtil(g,\
  \ nid, visited, stk);\n    std::cout << \"topologicalSort\" << std::endl;\n    while\
  \ (!stk.empty())\n    {\n        std::cout << stk.top() << std::endl;\n        stk.pop();\n\
  \    }\n}\n```\n\n### 复杂度\n\n时间复杂度为 ![](img/00047.jpeg)，空间复杂度为 ![](img/00048.jpeg)。\n\
  \n## 10 检测二部图\n\n二部图是一种图，其顶点可以划分为两个不相交集合 `U` 和 ![](img/00049.jpeg)。\n\n![](img/00050.jpeg)\
  \ ![](img/00051.jpeg) ![](img/00052.jpeg) ![](img/00053.jpeg) ![](img/00053.jpeg)\
  \ ![](img/00053.jpeg) ![](img/00054.jpeg)\n![](img/00055.jpeg) ![](img/00056.jpeg)\
  \ ![](img/00053.jpeg) ![](img/00053.jpeg)\n![](img/00057.jpeg) ![](img/00058.jpeg)\
  \ ![](img/00053.jpeg)\n\n### ![](img/00059.jpeg)\n\n### 解决方案\n\n可以通过给图节点染色，使得子节点的颜色与其父节点相反，从而执行深度优先搜索（DFS）或广度优先搜索（BFS）。如果两个直接连接的节点具有相同的颜色，则该图不是二部图。\n\
  \n### 代码\n\n```cpp\nbool isBipartite(const Graph & g, Graph::NodeID sid)\n{\n  \
  \  if (sid >= g.numNodes()) return false;\n    std::vector<Graph::NodeID> colour(g.numNodes(),\
  \ -1);\n    colour[sid] = 1;\n    std::list<Graph::NodeID> queue;\n    queue.push_back(sid);\n\
  \    while (!queue.empty())\n    {\n        Graph::NodeID n = queue.front();\n \
  \       queue.pop_front();\n        std::cout << \"Visited=\" << n << std::endl;\n\
  \        for (const auto & e : g.edges(n))\n        {\n            if (colour[e.v]\
  \ == -1)\n            {\n                colour[e.v] = 1 - colour[n];\n        \
  \        queue.push_back(e.v);\n            }\n            else if (colour[e.v]\
  \ == colour[n])\n                return false;\n        }\n    }\n    return true;\n\
  }\n```\n\n### 复杂度\n\n时间复杂度为 ![](img/00060.jpeg)，空间复杂度为 ![](img/00061.jpeg)。\n\n\
  ## 11 给出一个连通图，计算最小生成树 (MST)\n\n让我们从一些定义开始。如果图中的每对顶点都是连接的，则称该无向图是连通的。特别是，两个顶点 ![](img/00062.jpeg)\
  \ 和 ![](img/00063.jpeg) 连接，如果图中存在一条[路径](http://en.wikipedia.org/wiki/Path_(graph_theory))\
  \ 从 ![](img/00064.jpeg) 指向 ![](img/00065.jpeg)。给定一个连通图，生成树是一棵将所有顶点连接在一起的树。如果图的边带有权重，那么最小生成树就是边权重之和最小的生成树。\n\
  \n### 解决方案\n\n计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它通过 BFS 访问节点并将节点存储在栈 `stk` 中。在过程结束时，栈将包含拓扑排序的节点。感兴趣的读者应该修改代码以验证环是否存在，如果图不是\
  \ DAG（此处留作练习题）。*注：此处原文描述似乎与上一题拓扑混淆，已按逻辑意译翻译*：计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它通过访问节点并将节点存储在栈\
  \ `stk` 中（此处原文在 Prim 处描述的是拓扑排序的逻辑）。*重新修正翻译逻辑*：计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它从一个任意的顶点开始，通过选择连接树内顶点和不在树顶点之间权重最小的边，重复此步骤，直到所有顶点都加入树中。\n\
  \n### 代码\n\n```cpp\nstruct nodeComparison\n{\n    Graph::NodeID node;\n    Graph::weight\
  \ priority;\n    nodeComparison(Graph::NodeID name, Graph::weight p) : node(name),\
  \ priority(p) {}\n    bool operator<(const nodeComparison & rhs) const {\n     \
  \   return priority > rhs.priority;\n    }\n};\n\nvoid Prim(const Graph & g, Graph::NodeID\
  \ startNode)\n{\n    typedef boost::fibonacci_heap<Graph::weight, Graph::NodeID,\
  \ nodeComparison> Heap;\n    Heap heap;\n    std::map<Graph::NodeID, typename Heap::handle_type>\
  \ mapHandles;\n    Graph::NodeID numNodes = g.numNodes();\n    std::vector<bool>\
  \ isInHeap(numNodes, false);\n    std::vector<Graph::NodeID> parent(numNodes + 1,\
  \ 0);\n    for (Graph::NodeID i = 0; i < numNodes; ++i) {\n        mapHandles[i]\
  \ = heap.push(0, i);\n        isInHeap[i] = true;\n    }\n    heap.increase(mapHandles[startNode],\
  \ 0);\n    while (!heap.empty())\n    {\n        nodeComparison nc = heap.top().first;\
  \ // 注意：此处原文 top 逻辑可能对应特定库实现\n        heap.pop();\n        isInHeap[nc.node] = false;\n\
  \        for (Graph::NodeID v = 0; v < numNodes; ++v) {\n            Graph::weight\
  \ edgeWeight;\n            if ((edgeWeight = g(nc.node, v)) && isInHeap[v]) {\n\
  \                if (edgeWeight < (*mapHandles[v]).priority) {\n               \
  \     heap.increase(mapHandles[v], edgeWeight);\n                    std::cout <<\
  \ \"node=\" << nc.node << \"->\" << v << \" with w=\" << edgeWeight << std::endl;\n\
  \                }\n            }\n        }\n    }\n    std::cout << \"MST\" <<\
  \ std::endl;\n    for (Graph::NodeID i = 1; i < numNodes; ++i) {\n        std::cout\
  \ << parent[i] << '-' << i << \" weight=\" << g(parent[i], i) << std::endl;\n  \
  \  }\n}\n```\n\n### 复杂度\n\n这种特定的实现使用了邻接矩阵，因此其复杂度是 ![](img/00066.jpeg)。然而，通过邻接列表和斐波那契堆，可以获得\
