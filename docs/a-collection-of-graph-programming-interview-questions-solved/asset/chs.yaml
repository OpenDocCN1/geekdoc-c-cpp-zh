  \            }\n        }\n    }\n    std::cout << \"End bfs\" << std::endl << std::endl;\n\
  }\n```\n\n### 复杂度\n空间复杂度对于队列是 ![](img/00024.jpeg)和 ![](img/00025.jpeg)，如果使用邻接表表示图；如果采用邻接矩阵，则是\
