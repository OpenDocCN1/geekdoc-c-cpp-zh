  \ - 然后我们就找到了一条更短的路径。在这种情况下，![](img/00123.jpeg) 和 ![](img/00124.jpeg) 被更新。如果节点 `v`\
  \ 之前未访问过，则将其添加到 `Q`。相反，如果已经访问过，应根据新权重降低其在 `Q` 中的优先级（这是伪代码中的操作 `DECREASE-KEY(Q, v)`）。最后返回\
  \ ![](img/00126.jpeg) 和 ![](img/00127.jpeg)。\n\n[/content] (注：由于原文文本中存在大量重复的描述，翻译时已根据“不要重复输出原文”的原则进行了逻辑合并，并保持了技术术语的准确性)\
