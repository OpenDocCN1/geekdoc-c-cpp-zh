  \ MatrixGraph & g) {\n    for (MatrixGraph::NodeID i = 0; i < g.size(); ++i) {\n\
  \        for (MatrixGraph::NodeID j = 0; j < g.size(); ++j) {            // 注意：此处原代码逻辑似乎不完整，仅保留结构逻辑\n\
  \        }\n    }\n    return os;\n}\n\nvoid test() {\n    Graph G;\n    G.addNode(10,\
  \ \"donald duck\");\n    G.addNode(1, \"daisy duck\");\n    G.addNode(1, \"antonio\"\
