  \n## 12 空间复杂度的评估在此留作练习题。最小生成树的示例所示。\n\n![](img/00074.jpeg)\n\n## 13 寻找有向图中的强连通分量\n\
  \n\n\n\n\n一个有向图 ![](img/00075.jpeg) 被称为强连通的，如果每个节点都能从其他任何节点可达。![](img/00076.jpeg)\
  \ 的强连通分量将图划分成若干子图，这些子图本身如图所示是强连通的。\n\n![`upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Scc.png/220px-Scc.png`](img/00077.jpeg)\n\
  \n### 解决方案\n\n这里实现的解决方案是 Kosaraju 算法[[3]](#part0000_split_036.html__ftn3)，它使用了两次\
  \ `DFS`。第一次遍历在原图上进行，用于确定第二次 DFS 测试中外层循环连接顶点的顺序。第二次 DFS 在原图的转置图上进行。每次递归探索都会找到一个新的的强连通分量。\n\
  \n### 代码\n\n```cpp\n// Transpose\nvoid transpose(const Graph & g, Graph & gt)\n\
  {\n    gt.reserveNodes(g.numNodes());\n    gt.reserveEdges(g.numEdges());\n    //\
  \ add all nodes\n    for (const auto & n : g.nodes())\n        gt.addNode(n.w, n.label);\n\
  \    // add all edges\n    for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n\
  \        for (const auto & e : g.edges(id))\n            gt.addEdge(e.v, id, e.w,\
  \ e.label);\n}\n\n// SCC\nvoid fillOrder(const Graph & g, Graph::NodeID v,\n   \
  \            std::vector<bool> & visited,\n               std::stack<Graph::NodeID>\
  \ &stk)\n{\n    visited[v] = true;\n    for (const auto & e : g.edges(v))\n    \
  \    if (!visited[e.v])\n            fillOrder(g, e.v, visited, stk);\n    stk.push(v);\n\
  }\n\nvoid StrongConnectedComponents(const Graph & g)\n{\n    std::stack<Graph::NodeID>\
  \ stk;\n    std::vector<bool> visited(g.numNodes(), false);\n    unsigned componentID\
  \ = 0;\n    for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n        if (visited[id]\
  \ == false)\n            fillOrder(g, id, visited, stk);\n    Graph gt;\n    transpose(g,\
  \ gt);\n    std::fill(visited.begin(), visited.end(), false);\n    while (!stk.empty())\n\
  \    {\n        Graph::NodeID id = stk.top();\n        stk.pop();\n        if (!visited[id])\n\
  \        {\n            dfsUtil(g, id, visited);\n            std::cout << \"end\
  \ component id=\" << componentID++ << std::endl;\n        }\n    }\n}\n```\n\n###\
  \ 复杂度\n\n时间复杂度此处 ![](img/00078.jpeg)\n\n## 14 覆盖 DFS 树\n\n给定一个图 ![](img/00079.jpeg)，可以定义由\
  \ DFS 访问生成的路径树 ![](img/00080.jpeg)。如果 G 不是（强）连通的，那么我们需要从每个节点重新启动 DFS，访问将生成一个树森林。如果图是有向的，访问将遵循边的方向；而如果图是非向的，由于访问方向的影响，访问将产生每条边的随机随机取向。在访问过程中，尚未包含在\
  \ ![](img/00081.jpeg) 中的边可以分为三类：\n\n*   如果边通过从 T 中的节点 ![](img/00082.jpeg) 到 T 中的另一个节点\
  \ ![](img/00084.jpeg) 来被检查，而该目标节点是 G 中 ![](img/00085.jpeg) 的祖先，则该边 `u, v` 被称为回边。\n\
  *   如果边通过从 T 中的节点 ![](img/00086.jpeg) 到 T 中的另一个节点 ![](img/00088.jpeg) 来被检查，而该目标节点是\
  \ G 中 ![](img/00089.jpeg) 的后代，则该边 `u, v` 被称为前边。\n*   否则，它被称为跨越边。\n\n## 15 寻找哈密顿圈\n\
  \n哈密顿路径[[4]](#part0000_split_036.html__ftn4) 是一条遍历[图](http://world.wolfram.com/Graph)\
  \ 中每个节点一次的路径。如果该路径也是一个环，我们就得到了所示的哈密顿圈。该问题是 NP 完全的，因此最坏情况需要关于节点数量指数级的时间。![`upload.wikimedia.org/wikipedia/commons/thumb/6/60/Hamiltonian_path.svg/220px-Hamiltonian_path.png`](img/00090.jpeg)\n\
  \n### 解决方案\n\n这里我们展示 C++ 版本的回溯算法\n\n### 代码\n\n```cpp\n// hamiltonianCycle\nbool\
  \ isSafe(const MatrixGraph& g,\n           MatrixGraph::NodeID v,\n           std::vector<MatrixGraph::NodeID>\
  \ & path,\n           unsigned int pos)\n{\n    if (!g(pos - 1, v))\n        return\
  \ false;\n    for (Graph::NodeID i = 0; i < pos; ++i)\n        if (path[i] == v)\n\
  \            return false;\n    return true;\n}\n\nbool hamiltonianCycleUtil(const\
  \ MatrixGraph & g,\n                          std::vector<MatrixGraph::NodeID> &\
  \ path,\n                          unsigned int pos)\n{\n    if (pos == g.getNumNodes())\n\
  \    {\n        if (g(pos - 1, path[0]))\n            return true;\n        else\n\
  \            return false;\n    }\n    for (MatrixGraph::NodeID v = 1; v < g.getNumNodes();\
  \ ++v)\n    {\n        if (isSafe(g, v, path, pos))\n        {\n            path[pos]\
  \ = v;\n            if (hamiltonianCycleUtil(g, path, pos + 1))\n              \
  \  return true;\n            path[pos] = -1;\n        }\n    }\n    return false;\n\
  }\n\nbool hamiltonianCycle(const MatrixGraph & g)\n{\n    MatrixGraph::NodeID V\
  \ = g.getNumNodes();\n    std::vector<MatrixGraph::NodeID> path(V, -1);\n    bool\
  \ returnValue;\n    path[0] = 0;\n    if (returnValue = hamiltonianCycleUtil(g,\
  \ path, 1))\n    {\n        std::cout << \"Hamiltonian cycle: \" << std::endl;\n\
  \        for (MatrixGraph::NodeID i = 0; i < V; ++i)\n            std::cout << path[i]\
  \ << ' ';\n        std::cout << std::endl;\n    }\n    else {\n        std::cout\
  \ << \"No Hamiltonian cycle\";\n    }\n    return returnValue;\n}\n```\n\n## 16\
  \ 寻找图中的割点\n\n割点是指任何增加连通分量数量的顶点。\n\n### 解决方案\n\n所提算法由 Hopcroft 和 Tarjan [[5]](#part0000_split_036.html__ftn5)。其思想是运行\
  \ DFS 同时维护：\n\n1.  DFS 树中每个节点的深度\n2.  对于节点 ![](img/00091.jpeg)，DFS 树中所有后代 ![](img/00092.jpeg)\
  \ 的最小深度，称为低点（lowpoint）。images/00093.jpeg) 的低点可以在访问所有后代 ![](img/00094.jpeg) 后计算，即为\
  \ ![](img/00095.jpeg) 的深度、DFS 树中所有邻居 ![](img/00096.jpeg) 的深度（排除 DFS 树中 ![](img/00097.jpeg)\
  \ 的父节点）以及所有子节点的低点的最小值。非根顶点是割点，当且仅当存在一个孩子使得深度搜索返回时。根顶点必须单独处理：它是割点，当且仅当它至少有两个孩子。\n\
  \n### 代码\n\n```cpp\n// Articulation Points\nvoid articulationUtil(const Graph &\
  \ g,\n                      Graph::NodeID u,\n                      unsigned int\
  \ & time,\n                      std::vector<bool> & visited,\n                \
  \      std::vector<Graph::NodeID> & discovery,\n                      std::vector<Graph::NodeID>\
  \ & lower,\n                      std::vector<Graph::NodeID> & parent,\n       \
  \               std::vector<bool> & articulationPoints)\n{\n    Graph::NodeID children\
  \ = 0;\n    visited[u] = true;\n    discovery[u] = lower[u] = ++time;\n    for (const\
  \ auto & e : g.edges(u))\n    {\n        if (!visited[e.v])\n        {\n       \
  \     parent[e.v] = u;\n            children++;\n            articulationUtil(g,\
  \ e.v, time, visited, discovery, lower, parent, articulationPoints);\n         \
  \   lower[u] = std::min(lower[u], lower[e.v]);\n            if (parent[u] == std::numeric_limits<Graph::NodeID>::max()\
  \ && children > 1)\n                articulationPoints[u] = true;\n        }\n \
  \   }\n}\n```\n\n\n\n\n\n```cpp\n              std::numeric_limits<Graph::NodeID>::max()\n\
