- fmt: "\nFloyd & Warshall’s algorithm finds the shortest distance between every pair\
    \ of vertices in the graph. The algorithm detects, if there are loops with negative\
    \ weights, which will produce a degenerate negative infinite shortest path otherwise.\n\
    \n### Solution\n\nThe pseudo-code is\n\n```\nlet dist be a |V| × |V| array of\
    \ min distances initialized to ∞\n\nfor each vertex v\n    dist[v][v] ← 0\n\n\
    \ for each edge (u,v)\n    dist[u][v] ← w(u,v)  // the weight for edge (u, v)\n\
    \n for k from 1 to |V|\n  for i from 1 to |V|\n    for j from 1 to |V|\n     \
    \ if dist[i][j] > dist[i][k] + dist[k][j]\n        dist[i][j] ← dist[i][k] + dist[k][j]\n\
    ```\n\nThis pseudo-code computes the weight of each shortest path between all\
    \ pair of nodes ![](images/00172.jpeg) in the graph. However, it does not memorize\
    \ the minimum paths. These can be stored with some changes in the code which are\
    \ here left for exercise.\n\nNow let’s consider a negative cycle which is a cycle\
    \ whose edges sum to a negative value. There is no shortest path between any pair\
    \ of nodes ![](images/00173.jpeg) which form a part of a negative cycle, because\
    \ path-lengths from ![](images/00174.jpeg) to![](images/00175.jpeg) can be arbitrarily\
    \ small. As an exercise we ask to modify the pseudo-code for detecting negative\
    \ cycles.\n\nIn boost this is defined in `[boost/graph/floyd_warshall_shortest.hpp](http://www.boost.org/doc/libs/1_41_0/boost/graph/floyd_warshall_shortest.hpp)`\n\
    \n### Complexity\n\nTime complexity is ![](images/00176.jpeg), while space complexity\
    \ is ![](images/00177.jpeg)\n\n## 22 Find all the single source shortest paths\
    \ using Bellman Ford Algorithm\n\nThe Bellman-Ford algorithm finds the single-source\
    \ shortest paths problem for a graph with both positive and negative edge weights.\
    \ Dijkstra’s algorithm is more efficient for a graph with only positive edge weights.\
    \ Bellman Ford is the code of the old RIP[[12]](#part0000_split_036.html__ftn12)\
    \ (Routing Internet Protocol). Bellman-Ford is very similar to Dijkstra but it\
    \ processes all the edges instead of selecting the node with minimum weight among\
    \ those that still have to be processed (greedy choice). This computation is repeated\
    \ for all the nodes.\n\n### Solution\n\nThe pseudo-code is the following:\n\n\
    ```\nBELLMAN-FORD(G)\n\n for each vertex u in V\n d[u] ← infinity; p[u] ← u\n\n\
    \ for  i ← 1  to  |V|-1\n  for each edge (u,v) in E\n  if (w(u,v) + d[u] < d[v])\n\
    \  d[v] ← w(u,v) + d[u];\n  p[v] ← u\n\n for each edge (u,v) in E\n  if (w(u,v)\
    \ + d[u] < d[v])\n  return (false, , )\n\n return (true, p, d)\n```\n\nIn boost\
    \ this is defined in `[boost/graph/bellman_ford_shortest_paths.hpp](http://www.boost.org/doc/libs/1_55_0/boost/graph/bellman_ford_shortest_paths.hpp)`\n\
    \n### Complexity\n\nTime complexity is ![](images/00178.jpeg)\n\n## 23 Independent\
