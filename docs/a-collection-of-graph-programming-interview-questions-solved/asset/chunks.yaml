    \n## 1 Implementing a direct graph\n\nA graph data structure involves a finite\
    \ set of nodes or vertices and a set of ordered pairs called edges connecting\
    \ two nodes. A graph might have labels associated to the nodes and/or to the edges,\
    \ thus denoting different attributes (such as names, capacity, length, colours).\
    \ A direct graph is a graph where the edges are associated to a direction, which\
    \ is typically represented with an arrow.\n\n### Solution\n\nThe first direct\
    \ graph implementation represents a node and an edge as a C++ struct. In addition\
    \ a collection of nodes is memorized and all the edges originating from each node\
    \ are memorized. This representation is known adjacency list. In this particular\
    \ implementation each node has a unique identifier `NodeID`, a label `NodeWeight`\
    \ and another label representing the name of the node. Indeed each edge stores\
    \ the destination `NodeID`, a label `EdgeWeight` representing the weight of the\
    \ edge and another label representing the name of the edge.\n\n### Code\n\n```cpp\n\
    const std::string emptyString;\n\n//\n\n// Direct Graph\n\n// with Adjacent lists\n\
    \nclass Graph\n{\n\npublic:\n\n    typedef unsigned int NodeID;\n    typedef unsigned\
    \ int EdgeID;\n    typedef int NodeWeight;\n    typedef int EdgeWeight;\n\n  \
    \  struct Edge\n    {\n        Edge(NodeID nid, EdgeWeight wt, const std::string&\
    \ lb)\n            : v(nid), w(wt), label(lb) {}\n\n        const NodeID v;\n\
    \    };\n};\n```\n"
