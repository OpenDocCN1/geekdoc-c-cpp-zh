    \n![](img/00249.jpeg)\n\n给定这种表示，该问题可以作为最小费用流的一个特例来解决，解将留作课后练习。\n\n# 29 寻找欧拉回路\n\
    \n欧拉路径[[15]](#part0000_split_036.html__ftn15) 是图中的一种访问，恰好访问每个[边](http://en.wikipedia.org/wiki/Edge_(graph_theory))\
    \ 一次。如果存在这样的游，则该图被称为半欧拉图或可通图。欧拉回路是一个起始并结束于同一个[顶点](http://en.wikipedia.org/wiki/Vertex_(graph_theory))的欧拉访问。这些问题最早由莱恩哈德·欧拉提出，用于解决著名的柯尼斯堡七座大桥问题[[16]](#part0000_split_036.html__ftn16)。\n\
    \n![截至 2006 年 7 月 27 日 17:12 的缩略图](img/00250.jpeg)\n\n[柯尼斯堡](http://en.wikipedia.org/wiki/K%C3%B6nigsberg)\
    \ 坐落在[普鲁士](http://en.wikipedia.org/wiki/Kingdom_of_Prussia) [普雷格尔河](http://en.wikipedia.org/wiki/Pregolya)\
    \ 两岸，有两个大岛，这些岛通过七座桥相互连接并与大陆相。问题是找到一条穿过城市的游，使得每座桥恰好且仅跨越一次。欧拉证明该问题无解，并且这个问题被认为是引入名为“图论”的新学科的第一个问题，而这正是本书的主题。\n\
    \n### 解\n\n乍一看，这个问题似乎与哈密顿路径相似。但它并不是。事实上，可以在线性时间内计算出解。\n\n我们注意到，图满足以下条件时具有欧拉回路：(a)\
    \ 所有非零度顶点都是连通的 b) 所有顶点的度均为偶数。此外，如果满足两个条件，图符合欧拉路径：(a) 所有非零度顶点都是连通的，(b) 如果零或有两个顶点为奇度，且所有其他顶点为偶度。这些属性的证明留作课后练习。\n\
    \n### 代码\n\n```cpp\nbool isConnected(const Graph & g)\n{\n    std::vector<bool>\
    \ visited(g.numNodes(), false);\n    std::vector<Graph::NodeID> color(g.numNodes(),\
    \ false);\n    std::vector<Graph::NodeID> timing(g.numNodes(), 0);\n\n    Graph::NodeID\
    \ id;\n    for (id = 0; id < g.numNodes(); ++id)\n        if (g.outdegree(id))\n\
    \            break;\n\n    if (id == g.numNodes())\n        return true;\n\n \
    \   dfsUtil(g, id, visited);\n\n    for (id = 0; id < g.numNodes(); ++id)\n  \
    \      if (visited[id] == false && g.outdegree(id))\n            return false;\n\
    \n    return true;\n}\n\nenum euler { notEulerian, SemiEulerian, Eulerian };\n\
    \n// Eulerian\neuler isEulerian(const Graph & g)\n{\n    if (isConnected(g) ==\
    \ false)\n        return notEulerian;\n\n    unsigned int odd = 0;\n    for (Graph::NodeID\
    \ id = 0; id < g.numNodes(); ++id)\n        if (g.outdegree(id) & 1)\n       \
    \     odd++;\n\n    if (odd > 2)\n        return notEulerian;\n\n    return (odd)\
    \ ? SemiEulerian : Eulerian;\n}\n```\n\n### 复杂度\n\n时间复杂度为 images/00251.jpeg\n\n\
