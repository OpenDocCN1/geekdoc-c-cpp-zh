    \ ![](images/00053.jpeg)\n![](images/00057.jpeg) ![](images/00058.jpeg) ![](images/00053.jpeg)\n\
    \n### ![](images/00059.jpeg)\n\n### Solution\n\nA DFS or a BFS visit can be performed\
    \ by assigning colors to the graph in such a way that the children have opposite\
    \ colors from their parents. If two directly connected nodes have same color,\
    \ the graph is not bipartite.\n\n### Code\n\n```cpp\nbool isBipartite(const Graph\
    \ & g, Graph::NodeID sid)\n{\n    if (sid >= g.numNodes()) return false;\n   \
    \ std::vector<Graph::NodeID> colour(g.numNodes(), -1);\n    colour[sid] = 1;\n\
    \    std::list<Graph::NodeID> queue;\n    queue.push_back(sid);\n    while (!queue.empty())\n\
    \    {\n        Graph::NodeID n = queue.front();\n        queue.pop_front();\n\
