    \        for (const auto & e : g.edges(n))\n        {\n            if (colour[e.v]\
    \ == -1)\n            {\n                colour[e.v] = 1 - colour[n];\n      \
    \          queue.push_back(e.v);\n            }\n            else if (colour[e.v]\
    \ == colour[n])\n                return false;\n        }\n    }\n    return true;\n\
    }\n```\n\n### 复杂度\n\n时间复杂度为 ![](img/00060.jpeg)，空间复杂度为 ![](img/00061.jpeg)。\n\n\
    ## 11 给出一个连通图，计算最小生成树 (MST)\n\n让我们从一些定义开始。如果图中的每对顶点都是连接的，则称该无向图是连通的。特别是，两个顶点 ![](img/00062.jpeg)\
    \ 和 ![](img/00063.jpeg) 连接，如果图中存在一条[路径](http://en.wikipedia.org/wiki/Path_(graph_theory))\
    \ 从 ![](img/00064.jpeg) 指向 ![](img/00065.jpeg)。给定一个连通图，生成树是一棵将所有顶点连接在一起的树。如果图的边带有权重，那么最小生成树就是边权重之和最小的生成树。\n\
    \n### 解决方案\n\n计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它通过 BFS 访问节点并将节点存储在栈 `stk` 中。在过程结束时，栈将包含拓扑排序的节点。感兴趣的读者应该修改代码以验证环是否存在，如果图不是\
    \ DAG（此处留作练习题）。*注：此处原文描述似乎与上一题拓扑混淆，已按逻辑意译翻译*：计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它通过访问节点并将节点存储在栈\
    \ `stk` 中（此处原文在 Prim 处描述的是拓扑排序的逻辑）。*重新修正翻译逻辑*：计算 MST 的一种方法是采用经典的贪心算法 Prim[1]。它从一个任意的顶点开始，通过选择连接树内顶点和不在树顶点之间权重最小的边，重复此步骤，直到所有顶点都加入树中。\n\
    \n### 代码\n\n```cpp\nstruct nodeComparison\n{\n    Graph::NodeID node;\n    Graph::weight\
    \ priority;\n    nodeComparison(Graph::NodeID name, Graph::weight p) : node(name),\
    \ priority(p) {}\n    bool operator<(const nodeComparison & rhs) const {\n   \
    \     return priority > rhs.priority;\n    }\n};\n\nvoid Prim(const Graph & g,\
    \ Graph::NodeID startNode)\n{\n    typedef boost::fibonacci_heap<Graph::weight,\
    \ Graph::NodeID, nodeComparison> Heap;\n    Heap heap;\n    std::map<Graph::NodeID,\
    \ typename Heap::handle_type> mapHandles;\n    Graph::NodeID numNodes = g.numNodes();\n\
    \    std::vector<bool> isInHeap(numNodes, false);\n    std::vector<Graph::NodeID>\
    \ parent(numNodes + 1, 0);\n    for (Graph::NodeID i = 0; i < numNodes; ++i) {\n\
    \        mapHandles[i] = heap.push(0, i);\n        isInHeap[i] = true;\n    }\n\
    \    heap.increase(mapHandles[startNode], 0);\n    while (!heap.empty())\n   \
    \ {\n        nodeComparison nc = heap.top().first; // 注意：此处原文 top 逻辑可能对应特定库实现\n\
    \        heap.pop();\n        isInHeap[nc.node] = false;\n        for (Graph::NodeID\
    \ v = 0; v < numNodes; ++v) {\n            Graph::weight edgeWeight;\n       \
    \     if ((edgeWeight = g(nc.node, v)) && isInHeap[v]) {\n                if (edgeWeight\
    \ < (*mapHandles[v]).priority) {\n                    heap.increase(mapHandles[v],\
    \ edgeWeight);\n                    std::cout << \"node=\" << nc.node << \"->\"\
    \ << v << \" with w=\" << edgeWeight << std::endl;\n                }\n      \
    \      }\n        }\n    }\n    std::cout << \"MST\" << std::endl;\n    for (Graph::NodeID\
    \ i = 1; i < numNodes; ++i) {\n        std::cout << parent[i] << '-' << i << \"\
    \ weight=\" << g(parent[i], i) << std::endl;\n    }\n}\n```\n\n### 复杂度\n\n这种特定的实现使用了邻接矩阵，因此其复杂度是\
    \ ![](img/00066.jpeg)。然而，通过邻接列表和斐波那契堆，可以获得 ![](img/00067.jpeg)，其中查找最小值的复杂度为 ![](img/00068.jpeg)\
    \ 摊还时间[2]。\n\n| 稠密或稀疏图的邻接矩阵 | ![](img/00069.jpeg) |\n| 稀疏图的二堆和邻接列表 | ![](img/00070.jpeg)[](images/00071.jpeg)\
    \ |\n| 稠密图的二堆和邻接列表 | ![](img/00072.jpeg) |\n| 斐波那契堆和邻接列表 | ![](img/00073.jpeg)\
    \ |\n\n## 12 空间复杂度的评估在此留作练习题。最小生成树的示例所示。\n\n![](img/00074.jpeg)\n\n## 13 寻找有向图中的强连通分量\n\
