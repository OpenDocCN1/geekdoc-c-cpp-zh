    \   {\n                colour[e.v] = 1 - colour[n];\n                queue.push_back(e.v);\n\
    \            }\n            else if (colour[e.v] == colour[n])\n             \
    \   return false;\n        }\n    }\n    return true;\n}\n```\n\n### Complexity\n\
    \nTime complexity is ![](images/00060.jpeg), space complexity is ![](images/00061.jpeg).\n\
    \n## 11 Given a connected graph, compute the minimum spanning tree (MST)\n\nLet’s\
    \ start with some definitions. An undirected graph is said to be connected, if\
    \ every pair of vertices in the graph is connected. In particular, two vertices\
    \ ![](images/00062.jpeg) and ![](images/00063.jpeg) are defined as connected,\
    \ if the graph contains a [path](http://en.wikipedia.org/wiki/Path_(graph_theory))\
    \ from ![](images/00064.jpeg) to ![](images/00065.jpeg). Given a connected graph,\
    \ a spanning tree is a tree which connects all vertices together. If the graph\
    \ has weights associated to the edges, then the minimum spanning tree is a spanning\
    \ tree with minimal sum of the edges’ weight.\n\n### Solution\n\nOne way to compute\
    \ the MST is to adopt a classical greedy algorithm due to Prim[[1](#part0000_split_036.html__ftn1).\
