    \n假设开销与节点关联而非边关联。\n\n### 解决方案\n\n...\n\n## 27 使用 Ford–Fulkerson 寻找流网络\n\n流网络（也称为传输网络）是一个有向图，每条边都有一个不能超过的容量。流入节点的流量必须等于流出的流量。\n\
    \n### 解决方案\n\n伪代码如下：\n\n```\nG 带有源和汇点的网络\nf ← 0\nWhile 在剩余图中存在从源到汇点的路径:\n    c\
