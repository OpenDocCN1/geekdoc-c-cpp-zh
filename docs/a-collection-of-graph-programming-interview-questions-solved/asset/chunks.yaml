  trans: "\n\n一个有向图 ![](img/00075.jpeg) 被称为强连通的，如果每个节点都能从其他任何节点可达。![](img/00076.jpeg)\
    \ 的强连通分量将图划分成若干子图，这些子图本身如图所示是强连通的。\n\n![`upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Scc.png/220px-Scc.png`](img/00077.jpeg)\n\
    \n### 解决方案\n\n这里实现的解决方案是 Kosaraju 算法[[3]](#part0000_split_036.html__ftn3)，它使用了两次\
    \ `DFS`。第一次遍历在原图上进行，用于确定第二次 DFS 测试中外层循环连接顶点的顺序。第二次 DFS 在原图的转置图上进行。每次递归探索都会找到一个新的的强连通分量。\n\
    \n### 代码\n\n```cpp\n// Transpose\nvoid transpose(const Graph & g, Graph & gt)\n\
    {\n    gt.reserveNodes(g.numNodes());\n    gt.reserveEdges(g.numEdges());\n  \
    \  // add all nodes\n    for (const auto & n : g.nodes())\n        gt.addNode(n.w,\
    \ n.label);\n    // add all edges\n    for (Graph::NodeID id = 0; id < g.numNodes();\
    \ ++id)\n        for (const auto & e : g.edges(id))\n            gt.addEdge(e.v,\
    \ id, e.w, e.label);\n}\n\n// SCC\nvoid fillOrder(const Graph & g, Graph::NodeID\
    \ v,\n               std::vector<bool> & visited,\n               std::stack<Graph::NodeID>\
    \ &stk)\n{\n    visited[v] = true;\n    for (const auto & e : g.edges(v))\n  \
    \      if (!visited[e.v])\n            fillOrder(g, e.v, visited, stk);\n    stk.push(v);\n\
    }\n\nvoid StrongConnectedComponents(const Graph & g)\n{\n    std::stack<Graph::NodeID>\
    \ stk;\n    std::vector<bool> visited(g.numNodes(), false);\n    unsigned componentID\
    \ = 0;\n    for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n        if (visited[id]\
    \ == false)\n            fillOrder(g, id, visited, stk);\n    Graph gt;\n    transpose(g,\
    \ gt);\n    std::fill(visited.begin(), visited.end(), false);\n    while (!stk.empty())\n\
    \    {\n        Graph::NodeID id = stk.top();\n        stk.pop();\n        if\
    \ (!visited[id])\n        {\n            dfsUtil(g, id, visited);\n          \
    \  std::cout << \"end component id=\" << componentID++ << std::endl;\n       \
    \ }\n    }\n}\n```\n\n### 复杂度\n\n时间复杂度此处 ![](img/00078.jpeg)\n\n## 14 覆盖 DFS 树\n\
    \n给定一个图 ![](img/00079.jpeg)，可以定义由 DFS 访问生成的路径树 ![](img/00080.jpeg)。如果 G 不是（强）连通的，那么我们需要从每个节点重新启动\
    \ DFS，访问将生成一个树森林。如果图是有向的，访问将遵循边的方向；而如果图是非向的，由于访问方向的影响，访问将产生每条边的随机随机取向。在访问过程中，尚未包含在\
    \ ![](img/00081.jpeg) 中的边可以分为三类：\n\n*   如果边通过从 T 中的节点 ![](img/00082.jpeg) 到 T\
    \ 中的另一个节点 ![](img/00084.jpeg) 来被检查，而该目标节点是 G 中 ![](img/00085.jpeg) 的祖先，则该边 `u,\
    \ v` 被称为回边。\n*   如果边通过从 T 中的节点 ![](img/00086.jpeg) 到 T 中的另一个节点 ![](img/00088.jpeg)\
    \ 来被检查，而该目标节点是 G 中 ![](img/00089.jpeg) 的后代，则该边 `u, v` 被称为前边。\n*   否则，它被称为跨越边。\n\
    \n## 15 寻找哈密顿圈\n\n哈密顿路径[[4]](#part0000_split_036.html__ftn4) 是一条遍历[图](http://world.wolfram.com/Graph)\
    \ 中每个节点一次的路径。如果该路径也是一个环，我们就得到了所示的哈密顿圈。该问题是 NP 完全的，因此最坏情况需要关于节点数量指数级的时间。![`upload.wikimedia.org/wikipedia/commons/thumb/6/60/Hamiltonian_path.svg/220px-Hamiltonian_path.png`](img/00090.jpeg)\n\
    \n### 解决方案\n\n这里我们展示 C++ 版本的回溯算法\n\n### 代码\n\n```cpp\n// hamiltonianCycle\nbool\
    \ isSafe(const MatrixGraph& g,\n           MatrixGraph::NodeID v,\n          \
    \ std::vector<MatrixGraph::NodeID> & path,\n           unsigned int pos)\n{\n\
