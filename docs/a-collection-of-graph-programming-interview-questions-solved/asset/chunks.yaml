    \ nodes. A graph might have labels associated to the nodes and/or to the edges,\
    \ thus denoting different attributes (such as names, costs, capacity, length,\
    \ colours). A direct graph is a graph where the edges are associated to a direction,\
    \ which is typically represented with an arrow.\n\n ![](images/00004.jpeg)![](images/00005.jpeg)\n\
    \n![](images/00006.jpeg) ![](images/00007.jpeg)\n\n### Solution\n\nThe first direct\
    \ graph implementation represents a node and an edge as a C++ struct. In addition\
    \ a collection of nodes is memorized in a ![](images/00008.jpeg) and all the edges\
    \ originating from each node are memorized in a![](images/00009.jpeg). This representation\
    \ is known as Adjacency list. In this particular implementation each node has\
    \ a unique identifier NodeID, a label NodeWeight and another label representing\
    \ the name of the node.  Indeed each edge stores the destination NodeID, a label\
    \ EdgeWeightI representing the weight of the edge and another label representing\
    \ the name of the edge.\n\nThe second direct graph implementation represents a\
    \ Graph using a matrix of size ![](images/00010.jpeg) where n is the number of\
    \ nodes. This representation is known ad Adjacency Matrix.\n\n### Code\n\nconst\
    \ std::string emptyString;\n\n//\n\n// Direct Graph\n\n// with Adjacent lists\n\
    \nclass  Graph\n\n{\n\npublic:\n\n typedef  unsigned  int  NodeID;\n\n typedef\
    \  unsigned  int  EdgeID;\n\n typedef  int  NodeWeight;\n\n typedef  int  EdgeWeight;\n\
    \n struct  Edge\n\n              {\n\n                            Edge(NodeID\
    \  nid, EdgeWeight  wt,\n\n const std::string & lb)\n\n                           \
    \ : v(nid), w(wt), label(lb)  {};\n\n const  NodeID v;"
