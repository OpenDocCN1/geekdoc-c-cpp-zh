- fmt: "\nThis is a classical interview question which can be implemented by using\
    \ a simple queue. At the beginning the root node is enqueued and marked as visited.\
    \ Then a node is dequeued and all the adjacent nodes not yet visited are enqueued\
    \ for future visit in turn. The process is repeated until the queue is empty.\n\
    \n### Code\n\n```cpp\nvoid bfs(const Graph & g, Graph::NodeID nid)\n{\n    //\
    \ queue of visited nodes\n    std::deque<Graph::NodeID> queue;\n    // bfs on\
    \ unknown node\n    if (nid >= g.numNodes())\n        return;\n\n    std::vector<bool>\
    \ visited(g.numNodes(), false);\n    visited[nid] = true;\n    queue.push_back(nid);\n\
    \    std::cout << \"Start bfs\" << std::endl;\n    while (!queue.empty())\n  \
    \  {\n        const Graph::NodeID id = queue.front();\n        queue.pop_front();\n\
    \        std::cout << \"Visited: \" << id << std::endl;\n        for (const auto\
    \ & e : g.edges(id))\n        {\n            if (!visited[e.v])\n            {\n\
    \                visited[e.v] = true;\n                queue.push_back(e.v);\n\
    \            }\n        }\n    }\n    std::cout << \"End bfs\" << std::endl <<\
    \ std::endl;\n}\n```\n\n### Complexity\nSpace complexity is ![](images/00024.jpeg)\
    \ for the queue and ![](images/00025.jpeg), if the graph is represented using\
    \ an adjacency list, or ![](images/00026.jpeg) if an adjacency matrix is adopted.\
    \ Time complexity is ![](images/00027.jpeg), where ![](images/00028.jpeg) may\
    \ vary between ![](images/00029.jpeg) and ![](images/00030.jpeg)), depending on\
    \ how sparse the graph is.\n\n## 4 Erdős number\nPaul Erdős is a famous mathematician\
    \ who wrote more than 1500 scientific articles. His direct co-authors have distance\
    \ 1 from him, while their respective co-authors have distance 2. Recursively,\
    \ whoever has a collaboration with authors at distance ![](images/00031.jpeg)from\
    \ Erdős will therefore be at distance ![](images/00032.jpeg) (also denoted Erdős\
    \ (author)=K). The author of this book has Erdős (“Antonio Gulli”)=3 because he\
    \ wrote a paper with “Fabrizio Sebastiani” who, in turn, wrote a paper with “Micheal\
    \ Anthony Steel”, who is a direct co-author of Erdős. Erdős numbers can be computed\
    \ with a slight variation of the BFS visit and this implementation is left as\
    \ an exercise.\n\n## 5 Implementing DFS visit\nDepth-first-Search (DFS) is a visiting\
    \ strategy for a graph where the visit starts from a root node and the exploration\
    \ is run as far as possible along each branch before backtracking to the first\
    \ not visited children.\n\n### Solution\nThis is another interview question which\
    \ can be solved by either recursion or iteration. The `dfs` method implements\
    \ a recursive solution which starts from the root node and keeps a vector of visited\
    \ nodes and their colours. For each node the colour is ‘w’ (white) at the very\
    \ beginning, ‘g’ (gray) when the node is visited and ‘b’ (black) when all the\
    \ adjacent nodes are visited. In addition the time, when the node is visited,\
    \ is stored in the vector. The `dfsStack` method implements an iterative solution\
    \ where the root node is inserted in the stack. Then the top of the stack is removed\
    \ and all the adjacent not visited nodes are put on the stack. The process is\
    \ repeated until the stack is empty.\n\n### Code\n```cpp\nvoid dfsUtil(const Graph\
    \ & g, Graph::NodeID sid, std::vector<bool> & visited, std::vector<Graph::NodeID>\
    \ & colour, std::vector<Graph::NodeID> & timing, unsigned int & time)\n{\n   \
    \ std::cout << \"dfsUtil on \" << sid << std::endl;\n    visited[sid] = true;\n\
    \    colour[sid] = 'g'; // gray\n    ++time;\n    timing[sid] = time;\n    for\
    \ (const auto & e : g.edges(sid))\n        if (!visited[e.v])\n            dfsUtil(g,\
    \ e.v, visited, colour, timing, time);\n    colour[sid] = 'b'; // black\n    ++time;\n\
    }\n\nvoid dfs(const Graph & g, Graph::NodeID sid)\n{\n    if (sid >= g.numNodes())\
    \ // dfs on unknown node\n        return;\n    unsigned int time = 0;\n    std::vector<bool>\
    \ visited(g.numNodes(), false); // white\n    std::vector<Graph::NodeID> colour(g.numNodes(),\
    \ 'w');\n    std::vector<Graph::NodeID> timing(g.numNodes(), 0);\n    visited[sid]\
    \ = true;\n    std::cout << \"Starting dfs on \" << sid << std::endl;\n    for\
    \ (const auto & e : g.edges(sid))\n    {\n        if (!visited[e.v])\n       \
    \ {\n            visited[e.v] = true;\n            dfsUtil(g, e.v, visited, colour,\
    \ timing, time);\n        }\n    }\n    std::cout << \"End dfs\" << std::endl\
    \ << std::endl;\n}\n\nvoid dfsStack(const Graph & g, Graph::NodeID sid)\n{\n \
    \   if (sid >= g.numNodes()) // dfs on unknown node\n        return;\n    std::stack<Graph::NodeID>\
    \ nodesVisited;\n    std::vector<bool> visited(g.numNodes(), false);\n    visited[sid]\
    \ = true;\n    nodesVisited.push(sid);\n    std::cout << \"Starting dfs on \"\
    \ << sid << std::endl;\n    while (!nodesVisited.empty())\n    {\n        Graph::NodeID\
    \ nid = nodesVisited.top();\n        bool myFullExploredNode = true;\n       \
    \ for (const auto & e : g.edges(nid))\n        {\n            if (!visited[e.v])\n\
    \            {\n                visited[e.v] = true;\n                nodesVisited.push(e.v);\n\
    \                std::cout << \"Visited: \" << e.v << std::endl;\n           \
    \     myFullExploredNode = false;\n                break;\n            }\n   \
    \     }\n        if (myFullExploredNode)\n            nodesVisited.pop();\n  \
    \  }\n    std::cout << \"End dfs\" << std::endl << std::endl;\n}\n```\n\n### Complexity\n\
    Space complexity is ![](images/00033.jpeg) for the stack and ![](images/00034.jpeg),\
    \ if the graph is represented using an adjacency list or ![](images/00035.jpeg)\
    \ if an adjacency matrix is adopted. Time complexity is ![](images/00036.jpeg),\
    \ where ![](images/00037.jpeg) may vary between ![](images/00038.jpeg) and ![](images/00039.jpeg),\
    \ depending on how sparse the graph is.\n\n## 6 How to detect a cycle in a graph\n\
    ### Solution\nA DFS visit can detect a cycle, if there is a back edge during the\
    \ visit of the graph. By using the notation defined in the above solution, this\
    \ condition is represented by a transition from a grey node to a grey node.\n\n\
    ### Code\nThis implementation is left as an exercise.\n\n### Complexity\nThe complexity\
    \ here is the same as DFS.\n\n## 7 Given two nodes in an undirected graph, find\
    \ the path connecting them\n### Solution\nA simple solution is to visit the graph\
    \ with DFS order starting from one of the two nodes and stopping the visit as\
    \ soon as the other node is found. During this process the visited nodes are stored\
    \ into a stack. At the end the stack will contain the desired path.\n\n### Code\n\
    This implementation is left as an exercise.\n\n### Complexity\nThe complexity\
    \ is the same as DFS.\n\n## 8 Solving mazes\nLet’s suppose to have a maze as the\
    \ one represented in this figure. What is the best way to find the exit?\n\n![http://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/MAZE_40x20_DFS_no_deadends.png/220px-MAZE_40x20_DFS_no_deadends.png](images/00040.gif)\n\
    \n### Solution\nThe interested reader can think about how to represent the maze\
    \ with a graph ![](images/00041.jpeg) and what the most appropriate visiting strategies\
    \ on ![](images/00042.jpeg) are.\n\n## 9 Given a direct acyclic graph, implement\
    \ a topological sort\n"
