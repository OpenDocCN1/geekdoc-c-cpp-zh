    \ 使用 Ford–Fulkerson 算法寻找流网络]\n- [解决方案]\n- [28 分配问题]\n- [29 寻找欧拉回路]\n- [解决方案]\n\
    - [代码]\n- [复杂度]\n- [30 调度]\n\n## 1 实现有向图\n\n图数据结构涉及一组有限的节点（或顶点）和一组连接两个节点的有序对，称为边。图可以包含与节点和/或边关联的标签，从而表示不同的属性（如名称、容量、长度、颜色）。有向图是边具有方向的图，通常用箭头表示。\n\
    \n### 解决方案\n\n第一个有向图实现使用 C++ 结构体来表示节点和边。此外，它存储了一组节点，并记录了从每个节点出发的所有边。这种表示方法被称为邻接列表。在这个特定的实现中，每个节点都有唯一的标识符\
    \ `NodeID`、一个标签 `NodeWeight` 以及另一个表示节点名称的标签。事实上，每条边都存储了目标 `NodeID`、表示边权的标签 `EdgeWeight`\
    \ 以及另一个表示边的名称标签。\n\n### 代码\n\n```cpp\nconst std::string emptyString;\n\n//\n\n\
    // 有向图\n\n// 使用邻接列表\n\nclass Graph\n{\n\npublic:\n\n    typedef unsigned int NodeID;\n\
    \    typedef unsigned int EdgeID;\n    typedef int NodeWeight;\n    typedef int\
    \ EdgeWeight;\n\n    struct Edge\n    {\n        Edge(NodeID nid, EdgeWeight wt,\
    \ const std::string& lb)\n            : v(nid), w(wt), label(lb) {}\n\n      \
    \  const NodeID v;\n    };\n};\n```\n"
- fmt: "\n```cpp\nconst EdgeWeight w;\nconst std::string label;\n\nstruct Node {\n\
    \    Node(NodeWeight wt, const std::string & l) : w(wt), label(l){};\n    NodeWeight\
    \ w;\n    std::string label;\n};\n\n// all nodes\ntypedef std::vector<Node> Nodes;\n\
    \n// edges from a node\ntypedef std::forward_list<Edge> EdgesList;\n\n// all edges\
    \ (id -> edgeList)\ntypedef std::vector<EdgesList> Edges;\n\n// allocate |V| lists\
    \ of edges\nGraph(NodeID V = 0, EdgeID E = 0) {\n    if (V) {\n        _nodes.reserve(V);\n\
    \        _outdegree.reserve(V);\n    }\n    if (E) {\n        _edges.reserve(E);\n\
    \    }\n};\n\nvoid reserveNodes(NodeID n) {\n    _nodes.reserve(n);\n    _outdegree.reserve(n);\n\
    }\n\nvoid reserveEdges(EdgeID n) {\n    _edges.reserve(n);\n}\n\n// we can have\
    \ multiple edge (v1, v2)\nvoid addEdge(NodeID v1, NodeID v2, EdgeWeight w = 0,\
    \ const std::string & label = emptyString) {\n    if (v1 > _nodes.size() || v2\
    \ > _nodes.size())\n        return;\n    Edge e(v2, w, label);\n    _edges[v1].push_front(e);\n\
    \    _outdegree[v1]++;\n}\n\n// nodes are unique\nvoid addNode(NodeWeight w =\
    \ 0, const std::string & label = emptyString) {\n    EdgesList el;\n    Node n(w,\
    \ label);\n    _nodes.push_back(n); // another node\n    _edges.push_back(el);\
    \ // with its EdgeList\n    _outdegree.push_back(0);\n}\n\nconst EdgesList & edges(NodeID\
    \ v) const {\n    return _edges[v];\n};\n\nGraph::NodeID outdegree(NodeID v) const\
    \ {\n    return _outdegree[v];\n}\n\nconst Nodes & nodes() const {\n    return\
    \ _nodes;\n};\n\nNodeID numNodes() const {\n    return _nodes.size();\n}\n\nEdgeID\
    \ numEdges() const {\n    return _edges.size();\n}\n\nprivate:\n    Edges _edges;\n\
    \    Nodes _nodes;\n    std::vector<Graph::NodeID> _outdegree;\n    Graph(const\
    \ Graph& g) = delete;\n    Graph& operator=(const Graph& g) = delete;\n};\n\n\
    std::ostream & operator << (std::ostream & os, const Graph & g) {\n    Graph::NodeID\
    \ id = 0;\n    for (const auto & n : g.nodes()) {\n        os << \"node=\" <<\
    \ id << \" weight=\" << n.w << \" label=\" << n.label << std::endl;\n        for\
    \ (const auto & e : g.edges(id))\n            os << \" ->\" << e.v << \" w=\"\
    \ << e.w << \" label=\" << e.label << \"able=\" << e.label << std::endl;\n   \
    \     ++id;\n    }\n    return os;\n}\n\n// Undirect Graph with Adjacency Matrix\n\
    template<typename T>\nclass Matrix {\npublic:\n    Matrix(const Matrix&) = delete;\n\
    \    Matrix& operator=(const Matrix&) = delete;\n    Matrix(unsigned int dim1,\
    \ unsigned int dim2) : _M(new T*[dim1]), _dim1(dim1), _dim2(dim2) {\n        for\
    \ (unsigned int i = 0; i < dim1; ++i)\n            _M[i] = new T[dim2];\n    }\n\
    \    Matrix(unsigned int dim1, unsigned int dim2, T defaultValue) : Matrix(dim1,\
    \ dim2) {\n        for (unsigned int i = 0; i < dim1; ++i)\n            for (unsigned\
    \ int j = 0; j < dim2; ++j)\n                _M[i][j] = defaultValue;\n    }\n\
    \    Matrix(Matrix&& aMatrix) {\n        _dim1 = aMatrix._dim1;\n        _dim2\
    \ = aMatrix._dim2;\n        _M = aMatrix._M;\n        aMatrix._dim1 = 0;\n   \
    \     aMatrix._dim2 = 0;\n        aMatrix._M = nullptr;\n    }\n    ~Matrix()\
    \ {\n        for (unsigned int i = 0; i < _dim1; ++i)\n            delete[] _M[i];\n\
    \        delete[] _M;\n    }\n    T & operator()(const unsigned int i, const unsigned\
    \ int j) {\n        return _M[i][j];\n    }\n    T & operator()(const unsigned\
    \ int i, const unsigned int j) const {\n        return _M[i][j];\n    }\n    unsigned\
    \ int dim1() const { return _dim1; };\n    unsigned int dim2() const { return\
    \ _dim2; };\n    friend std::ostream & operator <<(std::ostream & out, const Matrix<T>&\
