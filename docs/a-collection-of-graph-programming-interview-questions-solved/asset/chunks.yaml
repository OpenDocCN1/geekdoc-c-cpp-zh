    \ runs in [time](http://en.wikipedia.org/wiki/Time_complexity)![](images/00130.jpeg).\n\
    \n## 18  Find MST(Minimum Spanning Tree) using Kruskal Algorithm\n\nKruskal’s\
    \ algorithm finds a minimum spanning tree (MST) in an undirected graph with weighted\
    \ edges. The algorithm orders the edges for increasing weight and then every single\
    \ edge is included in the solution, if it does not form a cycle with the edges\
    \ already selected.\n\n### Solution\n\nThe pseudo code uses UNION-FIND operations[[9]](#part0000_split_036.html__ftn9) \
    \ :\n\n*   Find: Determine which subset a particular element is in. It is used\
    \ for determining, if two elements are in the same subset.\n\n*   Union: Join\
    \ two subsets into a single subset.\n\nKRUSKAL-MST(G, w)\n\n T ← Ø\n\n for each\
    \ vertex u in V\n\n    MAKE-SET(DS, u)\n\n for each edge (u,v) in E in order of\
    \ nondecreasing weight\n\n if FIND-SET(DS, u) != FIND-SET(DS, v)\n\n      UNION-SET(DS,\
    \ u, v)\n\n T ← T U {(u,v)}\n\nreturn  T\n\nIn boost[[10]](#part0000_split_036.html__ftn10),\
    \ this is defined inboost/graph/kruskal_min_spanning_tree.hpp\n\nAs an exercise\
    \ try to compute Kruskal on the following graph\n\n![](images/00131.jpeg)\n\n\
    ![](images/00132.jpeg) ![](images/00133.jpeg) ![](images/00134.jpeg) ![](images/00134.jpeg)\n\
    \n![](images/00135.jpeg) ![](images/00136.jpeg) ![](images/00137.jpeg) ![](images/00138.jpeg)\
    \ ![](images/00139.jpeg)\n\n![](images/00140.jpeg) ![](images/00141.jpeg)\n\n\
    ![](images/00142.jpeg) ![](images/00143.jpeg) ![](images/00144.jpeg) ![](images/00144.jpeg)\n\
    \n### Complexity\n\nTime complexity is ![](images/00145.jpeg) because we use union-find\
    \ data structure to keep the set information,whereFind operations on![](images/00146.jpeg) elements\
    \ require  ![](images/00147.jpeg)  time.\n\n## 19  Find the longest path in a\
    \ DAG\n\nThe problem of finding the longest path is NP-hard for a general graph.\
    \ However if we have a DAG, we can easily compute the topological sort. Then for\
    \ every node we update the distance of its adjacent nodes by using the distance\
    \ of current vertex.\n\n### Solution\n\nThis code uses the topological sort defined\
    \ before and then adds weights starting from the source\n\n### Code\n\nvoid longestPathDAG(const\
    \  Graph & g,\n\n const  Graph::NodeID  id,\n\n              std::vector<Graph::NodeID>&\
    \ distance)\n\n{\n\n              std::stack<Graph::NodeID> stk;\n\n distance\
    \ = std::vector<Graph::NodeID>(g.numNodes(),\n\n                            std::numeric_limits<Graph::NodeID>::max());\n\
    \n              std::vector<bool> visited(g.numNodes(), false);\n\n distance[id]\
    \ = 0;\n\n for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n\n if (!visited[id])\n\
    \n                            topologicalSortUtil(g, id, visited, stk);\n\n while\
    \ (!stk.empty())\n\n              {\n\n const  Graph::NodeID id = stk.top();\n\
    \n                            stk.pop();\n\n if (distance[id] !=\n\n             \
    \                             std::numeric_limits<Graph::NodeID>::max())\n\n             \
    \               {\n\n for (const  auto & e : g.edges(id))\n\n if (distance[e.v]\
    \ > distance[id] + e.w)\n\n distance[e.v] = distance[id] + e.w;\n\n             \
    \               }\n\n              }\n\n for (Graph::NodeID id = 0; id < g.numNodes();\
    \ ++id)\n\n if (distance[id] ==\n\nstd::numeric_limits<Graph::NodeID>::max())\n\
    \nstd::cout << \"id=\" << id <<\n\n \" has infinity distance\" << std::endl;\n\
    \n else\n\nstd::cout << \"id=\" << id <<\n\n \" has distance=\" << distance[id]\
    \ << std::endl;\n\n}\n\n### Complexity\n\nTime complexity is ![](images/00148.jpeg).\
    \ What is the space complexity?\n\n## 20  Find MST (Minimum Spanning Tree) using\
    \ Prim Algorithm\n\nPrim’s[[11]](#part0000_split_036.html__ftn11) algorithm finds\
    \ a minimum spanning tree (MST) in an undirected graph with weighted edges. Prim’s\
    \ is a typical greedy algorithm which maintains two data structures ![](images/00149.jpeg)\
    \ containing the predecessor of the node ![](images/00150.jpeg) and ![](images/00151.jpeg),\
    \ containing the minimum distance from node![](images/00152.jpeg). At the beginning\
    \ every node is marked as not visited and the distance is infinite. Then the source\
    \ node ![](images/00153.jpeg) is inserted in a priority queue ![](images/00154.jpeg)\
    \ ordered by distance![](images/00155.jpeg). Until the queue is not empty a node\
    \ ![](images/00156.jpeg)is de-queued from ![](images/00157.jpeg) . For each node\
    \ ![](images/00158.jpeg) adjacent to ![](images/00159.jpeg)the condition ![](images/00160.jpeg)\
    \ is checked where ![](images/00161.jpeg) is the weight associated to the edge\
    \ ![](images/00162.jpeg). The node v is inserted in Q, if the condition is met\
    \ and the node was never visited before. Instead if priority is decreased, the\
    \ condition is met but the node is already in ![](images/00163.jpeg).             \n\
    \n### Solution\n\nThe pseudo code is the following:\n\nPRIM-MST(G, s, w)\n\n for\
    \ each vertex u  in  V[G] \n\n color[u] ←  WHITE; d[u] ←  infinity \n\n color[s]\
    \ ←  GRAY; d[s] ← 0\n\n  ENQUEUE(Q, s); p[s] ← s\n\n while (Q != Ø)\n\n u := DEQUEUE(Q)\n\
    \n for each v in Adj[u] \n\n if (w(u,v) < d[v])\n\n d[v] ← w(u,v); p[v] ← u\n\n\
    \ if (color[v] = WHITE)\n\n          ENQUEUE(Q, v) ;color[v] ←  GRAY\n\n else\
    \ if (color[v] = GRAY)\n\n          DECREASE-KEY (Q, v)\n\n color[u] ←  BLACK\n\
    \nreturn (p, d)\n\nIn boost, this is defined in [boost/graph/prim_minimum_spanning_tree.hpp](http://www.boost.org/doc/libs/1_55_0/boost/graph/prim_minimum_spanning_tree.hpp)\n\
    \n### Complexity\n\nTime complexity is ![](images/00164.jpeg) where ![](images/00165.jpeg)\
    \ is the time needed for extracting ![](images/00166.jpeg) nodes from ![](images/00167.jpeg)\
    \ and ![](images/00168.jpeg) is the time needed for processing the adjacency list\
    \ and update the queue. Note that if we use Fibonacci heap, then operations of\
    \ insert and decreaseKey have cost ![](images/00169.jpeg) amortized by deleteKey\
    \ with cost ![](images/00170.jpeg). So complexity is ![](images/00171.jpeg) by\
    \ using Fibonacci\n\n## 21  Find all pairs shortest paths using the Floyd-Warshall\
    \ Algorithm"
