  raw: "A topological sort of a [directed graph](http://en.wikipedia.org/wiki/Directed_graph) is\
    \ a linear ordering of its [vertices](http://en.wikipedia.org/wiki/Vertex_(graph_theory)) such\
    \ that for every directed edge ![](images/00043.jpeg) from vertex ![](images/00044.jpeg) to\
    \ vertex ![](images/00045.jpeg) comes before ![](images/00046.jpeg) in the ordering. A\
    \ topological ordering is possible, if and only if the graph has no directed cycles.\
    \ Such graphs are called “directed acyclic graphs” (DAG). \n\n### Solution\n\n\
    Given a DAG, the topological sort is obtained by visiting the nodes with a BFS\
    \ and storing the nodes into a stack stk. At the end of the process the stack\
    \ will contain the topologically sorted nodes. The interested reader should modify\
    \ the code in order to verify the presence of cycles, if the graph is not a DAG\
    \ (left as exercise).\n\n### Code\n\nvoid topologicalSortUtil(const  Graph & g,\n\
    \n Graph::NodeID  sid,\n\n              std::vector<bool> & visited,\n\n             \
    \ std::stack<Graph::NodeID> &stk)\n\n{\n\n visited[sid] = true;\n\nstd::cout <<\
    \ \"\\t topologicalSortUtil\"\n\n<< sid << std::endl;\n\n for (const  auto & e\
    \ : g.edges(sid))\n\n if (!visited[e.v])\n\n                            topologicalSortUtil(g,\
    \ e.v, visited, stk);\n\n stk.push(sid);\n\n}\n\nvoid topologicalSort(const  Graph\
    \ & g)\n\n{\n\n              std::vector<bool> visited(g.numNodes(), false);\n\
    \n              std::stack<Graph::NodeID> stk;\n\n for (Graph::NodeID nid = 0;\
    \ nid < g.numNodes(); ++nid)\n\n if (!visited[nid])\n\n                           \
    \ topologicalSortUtil(g, nid, visited, stk);\n\nstd::cout << \"topologicalSort\"\
    \ << std::endl;\n\n while (!stk.empty())\n\n              {\n\n                           \
    \ std::cout << stk.top() << std::endl;\n\n                            stk.pop();\n\
    \n              }\n\n}\n\n### Complexity\n\nTime complexity is ![](images/00047.jpeg),\
    \ space complexity is ![](images/00048.jpeg).\n\n## 10  Detecting a bipartite\
