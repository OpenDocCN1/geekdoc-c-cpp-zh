    \n### 解决方案\n给定一个具有非负边权重的图，我们可以应用 Dijkstra 算法来寻找单源最短路径树[[6]](#part0000_split_036.html__ftn6)。埃德加·戴杰·迪克斯斯特拉（Edsger\
    \ W. Dijkstra）出生于荷兰，他在 1959 年发明了该算法。对于给定的源节点 ![](img/00105.jpeg)，该算法寻找 ![](img/00106.jpeg)\
    \ 与其他所有节点之间代价最低的路径。这类问题有多个应用，包括优化、路由和流量分配。Dijkstra 的伪代码如下。向量 ![](img/00107.jpeg)\
    \ 包含了到达节点 ![](img/00108.jpeg) 的路径权重之和（初始时为无穷大）。向量 ![](img/00109.jpeg) 包含了 ![](img/00110.jpeg)\
    \ 在最短路径中的前驱节点（初始为 ![](img/00111.jpeg)）。此外，一个优先级队列 ![](img/00112.jpeg) 用于选择具有最小\
    \ ![](img/00114.jpeg) 的节点 ![](img/00113.jpeg)（在伪代码中，该操作是 `u ← EXTRACT-MIN(Q)`）。此外，![](img/00115.jpeg)]包含了所有与\
    \ ![](img/00117.jpeg) 相邻的节点 ![](img/00116.jpeg)。因此，对于每个 ![](img/00118.jpeg)，如果\
    \ ![](img/00119.jpeg) - 通往 ![](img/00120.jpeg) 的路径权重之和 - 加上边 ![](img/00121.jpeg)\
    \ 的权重小于 ![](img/00122.jpeg) - 然后我们就找到了一条更短的路径。在这种情况下，![](img/00123.jpeg) 和 ![](img/00124.jpeg)\
    \ 被更新。如果节点 `v` 之前未访问过，则将其添加到 `Q`。相反，如果已经访问过，应根据新权重降低其在 `Q` 中的优先级（这是伪代码中的操作 `DECREASE-KEY(Q,\
    \ v)`）。最后返回 ![](img/00126.jpeg) 和 ![](img/00127.jpeg)。\n\n### 代码\n```\nDIJKSTRA(G,\
    \ s, w) for each vertex u in V d[u] ← infinity p[u] ← u color[u] ← WHITE d[s]\
    \ ← 0 INSERT(Q, s) while (Q != Ø) u ← EXTRACT-MIN(Q) for each vertex v in Adj[u]\
    \ if (w(u,v) + d[u] < d[v]) d[v] ← w(u,v) + d[u] p[v] ← u if (color[v] == WHITE)\
    \ color[v] ← GRAY INSERT(Q, v) else if (color[v] == GRAY) DECREASE-KEY(Q, v) color[u]\
    \ ← BLACK return (d, p)\n```\n\n对于这个练习[7]，我们开始使用 `boost::BGL`，这是一个用于图创建和处理的强大框架[8]。图可以与边关联权重和名称，这些存储在\
    \ `boost::property` 中。此外，图可以用 `boost::adjacency_list` 或 `boost::adjacency_matrix`\
    \ 表示。`boost::adjacency_list` 使用了许多参数，包括 `EdgeList`（表示每个顶点边列表的选择器）、`VertexList`（表示图顶点列表的选择器）、`Directed`（指定是否为有向图）等。\n\
