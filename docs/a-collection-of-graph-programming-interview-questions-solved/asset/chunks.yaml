  trans: "\nFloyd & Warshall 算法寻找图中每对顶点之间的最短距离。该算法可以检测是否存在负权环路，否则环路会产生退化的负无穷最短路径。\n\
    \n### 解决方案\n\n伪代码如下：\n\n```\nlet dist be a |V| × |V| array of min distances initialized\
    \ to ∞\n\nfor each vertex v\n    dist[v][v] ← 0\n\n for each edge (u,v)\n    dist[u][v]\
    \ ← w(u,v)  // 边 (u, v) 的权重\n\n for k from 1 to |V|\n  for i from 1 to |V|\n \
    \   for j from 1 to |V|\n      if dist[i][j] > dist[i][k] + dist[k][j]\n     \
    \   dist[i][j] ← dist[i][k] + dist[k][j]\n```\n\n该伪代码计算了图中所有节点 ![](img/00172.jpeg)\
    \ 之间最短路径的权重。然而，它并没有记录最短路径。可以通过代码的某些修改来存储这些路径，这里留作练习。\n\n现在让我们考虑负环，即边权之和为负值的环。任何构成负环的节点对\
    \ ![](img/00173.jpeg) 之间不存在最短路径，因为从 ![](img/00174.jpeg) 到 ![](img/00175.jpeg)\
    \ 的路径长度可以任意小。作为一项练习，我们要求修改伪代码以检测负环。\n\n在 boost 中，这定义在 `[boost/graph/floyd_warshall_shortest.hpp](http://www.boost.org/doc/libs/1_41_0/boost/graph/floyd_warshall_shortest.hpp)`\
    \ 中。\n\n### 复杂度\n\n时间复杂度为 ![](img/00176.jpeg)，空间复杂度为 ![](img/00177.jpeg)\n\n##\
    \ 22 使用 Bellman Ford 算法寻找所有单源最短路径\n\nBellman-Ford 算法解决的是具有正权和负权边的图的单源最短路径问题。对于只有正权边的图，Dijkstra\
    \ 算法更高效。Bellman Ford 是旧版 RIP[[12]](#part0000_split_036.html__ftn12)（路由路由协议）的代码。Bellman-Ford\
    \ 与 Dijkstra 非常相似，但它处理所有的边，而不是在待处理的节点中选择权重最小的节点（贪心选择）。这种计算对所有节点重复进行。\n\n### 解决方案\n\
    \n伪代码如下：\n\n```\nBELLMAN-FORD(G)\n\n for each vertex u in V\n d[u] ← infinity;\
    \ p[u] ← u\n\n for  i ← 1  to  |V|-1\n  for each edge (u,v) in E\n  if (w(u,v)\
    \ + d[u] < d[v])\n  d[v] ← w(u,v) + d[u];\n  p[v] ← u\n\n for each edge (u,v)\
    \ in E\n  if (w(u,v) + d[u] < d[v])\n  return (false, , )\n\n return (true, p,\
    \ d)\n```\n\n在 boost 中，这定义在 `[boost/graph/bellman_ford_shortest_paths.hpp](http://www.boost.org/doc/libs/1_55_0/boost/graph/bellman_ford_shortest_paths.hpp)`\
    \ 中。\n\n### 复杂度\n\n时间复杂度为 ![](img/00178.jpeg)\n\n## 23 区间的独立集\n\n给定实数线上的 n 个区间，最大独立集是具有最大规模的区间子集\
