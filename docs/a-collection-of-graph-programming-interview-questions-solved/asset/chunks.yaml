    \ defined as connected, if the graph contains a [path](http://en.wikipedia.org/wiki/Path_(graph_theory))\
    \ from![](images/00064.jpeg) to ![](images/00065.jpeg). Given a connected graph,\
    \ a spanning tree is a tree which connects all vertices together. If the graph\
    \ has weights associated to the edges, then the minimum spanning tree is a spanning\
    \ tree with minimal sum of the edges’ weight.\n\n### Solution\n\nOne way to compute\
    \ the MST is to adopt a classical greedy algorithm due to Prim[[1]](#part0000_split_036.html__ftn1).\
    \ At the beginning the tree contains a single vertex, chosen arbitrarily from\
