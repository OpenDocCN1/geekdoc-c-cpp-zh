    \ space complexity is ![](images/00061.jpeg).\n\n## 11  Given a connected graph,\
    \ compute the minimum spanning tree (MST)\n\nLet’s start with some definitions.\
    \ An undirected graph is said to be connected, if every pair of vertices in the\
