- fmt: "\nA direct graph ![](images/00075.jpeg) is said to be strongly connected,\
    \ if every node is reachable from every other node. The strongly connected components\
    \ of ![](images/00076.jpeg) create a partition into subgraph that are themselves\
    \ strongly connected as in this figure.\n\n![http://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Scc.png/220px-Scc.png](images/00077.jpeg)\n\
    \n### Solution\n\nThe here implemented solution is the Kosaraju’s algorithm[[3]](#part0000_split_036.html__ftn3)\
    \ which uses two passes of `DFS`. The first pass is carried out on the original\
    \ graph and it is used to choose the order in which the outer loop of the second\
    \ DFS tests are connected to the vertices. The second DFS is on the transpose\
    \ graph of the original graph. Each recursive exploration finds a single new strongly\
    \ connected component.\n\n### Code\n\n```cpp\n// Transpose\nvoid transpose(const\
    \ Graph & g, Graph & gt)\n{\n    gt.reserveNodes(g.numNodes());\n    gt.reserveEdges(g.numEdges());\n\
    \    // add all nodes\n    for (const auto & n : g.nodes())\n        gt.addNode(n.w,\
    \ n.label);\n    // add all edges\n    for (Graph::NodeID id = 0; id < g.numNodes();\
    \ ++id)\n        for (const auto & e : g.edges(id))\n            gt.addEdge(e.v,\
    \ id, e.w, e.label);\n}\n\n// SCC\nvoid fillOrder(const Graph & g, Graph::NodeID\
    \ v,\n               std::vector<bool> & visited,\n               std::stack<Graph::NodeID>\
    \ &stk)\n{\n    visited[v] = true;\n    for (const auto & e : g.edges(v))\n  \
    \      if (!visited[e.v])\n            fillOrder(g, e.v, visited, stk);\n    stk.push(v);\n\
    }\n\nvoid StrongConnectedComponents(const Graph & g)\n{\n    std::stack<Graph::NodeID>\
    \ stk;\n    std::vector<bool> visited(g.numNodes(), false);\n    unsigned componentID\
    \ = 0;\n    for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n        if (visited[id]\
    \ == false)\n            fillOrder(g, id, visited, stk);\n    Graph gt;\n    transpose(g,\
    \ gt);\n    std::fill(visited.begin(), visited.end(), false);\n    while (!stk.empty())\n\
    \    {\n        Graph::NodeID id = stk.top();\n        stk.pop();\n        if\
    \ (!visited[id])\n        {\n            dfsUtil(g, id, visited);\n          \
    \  std::cout << \"end component id=\" << componentID++ << std::endl;\n       \
    \ }\n    }\n}\n```\n\n### Complexity\n\nTime complexity is here ![](images/00078.jpeg)\n\
    \n## 14 Covering DFS Trees\n\nGiven a graph ![](images/00079.jpeg) it is possible\
    \ to define a path tree ![](images/00080.jpeg) generated by a DFS visit. If G\
    \ is not (strongly) connected then we need to restart the DFS from each node and\
    \ the visit will generate a forest of trees, If the graph is direct, the visit\
    \ will respect the direction of the edges, while if the graph is not direct, the\
    \ visit will produce a random orientation of each edge as a consequence of the\
    \ direction of the visit. During the visit the edges not yet included in ![](images/00081.jpeg)\
    \ can be divided into three categories:\n\n*   If the edge is examined by passing\
    \ from a node ![](images/00082.jpeg) in ![](images/00083.jpeg) to another node\
    \ ![](images/00084.jpeg) in T, which is an ancestor of ![](images/00085.jpeg)\
    \ in G, then the edge `u, v` is called back edge.\n*   If the edge is examined\
    \ by passing from a node ![](images/00086.jpeg) in ![](images/00087.jpeg) to another\
    \ node ![](images/00088.jpeg) in T, which is a descendant of ![](images/00089.jpeg)\
    \ in G, then the edge `u, v` is called forward edge.\n*   Otherwise it is called\
    \ cross edge\n\n## 15 Find an Hamiltonian cycle\n\nA Hamiltonian path[[4]](#part0000_split_036.html__ftn4)\
    \ is a path through [graph](http://world.wolfram.com/Graph) visits each node once.\
    \ If the path is also a cycle then we have a Hamiltonian cycle as in the figure.\
    \ The problem is NP-Complete so the worst case needs exponential time in the number\
    \ of nodes. ![http://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Hamiltonian_path.svg/220px-Hamiltonian_path.png](images/00090.jpeg)\n\
    \n### Solution\n\nHere we present backtracking algorithm in C++\n\n### Code\n\n\
    ```cpp\n// hamiltonianCycle\nbool isSafe(const MatrixGraph& g,\n           MatrixGraph::NodeID\
    \ v,\n           std::vector<MatrixGraph::NodeID> & path,\n           unsigned\
    \ int pos)\n{\n    if (!g(pos - 1, v))\n        return false;\n    for (Graph::NodeID\
    \ i = 0; i < pos; ++i)\n        if (path[i] == v)\n            return false;\n\
    \    return true;\n}\n\nbool hamiltonianCycleUtil(const MatrixGraph & g,\n   \
    \                       std::vector<MatrixGraph::NodeID> & path,\n           \
    \               unsigned int pos)\n{\n    if (pos == g.getNumNodes())\n    {\n\
    \        if (g(pos - 1, 0))\n            return true;\n        else\n        \
    \    return false;\n    }\n    for (Graph::NodeID v = 1; v < g.getNumNodes();\
    \ ++v)\n    {\n        if (isSafe(g, v, pos))\n        {\n            path[pos]\
    \ = v; // insert v\n            if (hamiltonianCycleUtil(g, pos + 1) == true)\n\
    \                return true;\n            path[pos] = -1; // remove v\n     \
    \   }\n    }\n    return false;\n}\n\nbool hamiltonianCycle(const MatrixGraph\
    \ & g)\n{\n    MatrixGraph::NodeID V = g.getNumNodes();\n    std::vector<MatrixGraph::NodeID>\
    \ path(V, -1);\n    bool returnValue;\n    path[0] = 0;\n    if ((returnValue\
    \ = hamiltonianCycleUtil(g, path, 1)))\n    {\n        std::cout << \"Hamiltian\
    \ cycle \" << std::endl;\n        for (Graph::NodeID i = 0; i < V; ++i)\n    \
    \        std::cout << path[i] << ' ';\n        std::cout << std::endl;\n    }\n\
    \    else {\n        std::cout << \"No Hamiltian cycle\";\n    }\n    return returnValue;\n\
    }\n```\n\n## 16 Find the articulation points in a graph\n\nAn articulation point\
    \ is any vertex, where its removal increases the number of connected components.\n\
    \n### Solution\n\nThe algorithm proposed is due to Hopcroft and Tarjan[[5]](#part0000_split_036.html__ftn5).\
    \ The idea is to run a DFS while maintaining:\n\n1.  the depth of each vertex\
    \ in the DFS tree\n2.  For each node ![](images/00091.jpeg), the lowest depth\
    \ of neighbours of all descendants of ![](images/00092.jpeg) in the DFS tree,\
    \ called the lowpoint. The lowpoint of ![](images/00093.jpeg) can be computed\
    \ after visiting all descendants of ![](images/00094.jpeg) as the minimum of the\
    \ depth of ![](images/00095.jpeg), the depth of all neighbors of ![](images/00096.jpeg)\
    \ (excluding the parent of ![](images/00097.jpeg) in the DFS tree) and the lowpoint\
    \ of all children of ![](images/00098.jpeg) in the DFS tree. A non-root vertex\
    \ is an articulation point, if and only if there is a child such that depth-first\
    \ search is returned from. The root vertex must be handled separately: it is an\
    \ articulation point, if and only it has at least two children.\n\n### Code\n\n\
    ```cpp\n// Articulation Points\nvoid articulationUtil(const Graph & g,\n     \
    \                 Graph::NodeID u,\n                      unsigned int & time,\n\
    \                      std::vector<bool> & visited,\n                      std::vector<Graph::NodeID>\
    \ & discovery,\n                      std::vector<Graph::NodeID> & lower,\n  \
    \                    std::vector<Graph::NodeID> & parent,\n                  \
    \    std::vector<bool> & articulationPoints)\n{\n    Graph::NodeID children =\
    \ 0;\n    visited[u] = true;\n    discovery[u] = lower[u] = ++time;\n    for (const\
    \ auto & e : g.edges(u))\n    {\n        if (!visited[e.v])\n        {\n     \
    \       parent[e.v] = u;\n            children++;\n            articulationUtil(g,\
    \ e.v, time, visited, discovery, lower, parent, articulationPoints);\n       \
    \     lower[u] = std::min(lower[u], lower[e.v]);\n            if (parent[u] ==\
    \ std::numeric_limits<Graph::NodeID>::max() && children > 1)\n               \
    \ articulationPoints[u] = true;\n        }\n    }\n}\n```\n"
