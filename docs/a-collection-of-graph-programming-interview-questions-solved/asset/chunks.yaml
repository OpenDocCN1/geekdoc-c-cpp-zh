  trans: "\n\n这是一个经典的面试题，可以使用简单的队列来实现。在开始时，将根节点入队并标记为已访问。然后弹出一个节点，并将所有尚未访问的相邻节点依次入队以备日后访问。重复此过程，直到队列为空。\n\
    \n### 代码\n\n```cpp\nvoid bfs(const Graph & g, Graph::NodeID nid)\n{\n    // 访问访问节点的队列\n\
    \    std::deque<Graph::NodeID> queue;\n    // 对未知节点进行 BFS\n    if (nid >= g.numNodes())\n\
    \        return;\n\n    std::vector<bool> visited(g.numNodes(), false);\n    visited[nid]\
    \ = true;\n    queue.push_back(nid);\n    std::cout << \"Start bfs\" << std::endl;\n\
    \    while (!queue.empty())\n    {\n        const Graph::NodeID id = queue.front();\n\
    \        queue.pop_front();\n        std::cout << \"Visited: \" << id << std::endl;\n\
    \        for (const auto & e : g.edges(id))\n        {\n            if (!visited[e.v])\n\
    \            {\n                visited[e.v] = true;\n                queue.push_back(e.v);\n\
    \            }\n        }\n    }\n    std::cout << \"End bfs\" << std::endl <<\
    \ std::endl;\n}\n```\n\n### 复杂度\n空间复杂度对于队列是 ![](img/00024.jpeg)和 ![](img/00025.jpeg)，如果使用邻接表表示图；如果采用邻接矩阵，则是\
    \ ![](img/00026.jpeg)。时间复杂度为 ![](img/00027.jpeg)，其中 ![](img/00028.jpeg)可能在![](img/00029.jpeg)到![](img/00030.jpeg)之间变化，取决于图的稀疏程度。\n\
    \n## 4 埃尔什数\n保罗·埃尔什（Paul Erdős）是一位著名的数学家，他写了超过 1500 篇科学论文。他的直接合作作者与他的距离为 1，而他们各自的合作作者距离为\
    \ 2。递归地，任何与距离埃尔什为![](img/00031.jpeg)的作者有合作的人，其距离将是![](img/00032.jpeg)（也记为 Erdős\
    \ (author)=K）。本书作者的埃尔什数为“Antonio Gulli”=3，因为他曾与“Fabrizio Sebastiani”共同写过论文，而后者又与“Micheal\
    \ Anthony Steel”写过论文，后者是埃尔什的直接合作作者。埃尔什数可以通过 BFS 访问的略微变体来计算，此实现留作练习。\n\n## 5 实现\
    \ DFS 访问\n深度优先搜索（DFS）是图的一种访问策略，从根节点开始访问，并在每个分支上尽可能深地探索，直到回溯到第一个未访问的子节点。\n\n###\
    \ 解决方案\n这是另一个面试题，可以通过递归或迭代解决。`dfs`方法实现了一个递归解决方案，从根节点开始并维护一个访问节点及其颜色的向量。对于每个节点，初始颜色为‘w’（白色），当节点被访问时为‘g’（灰色），当所有相邻节点都被访问时为‘b’（黑色）。此外，节点被访问时的时间也存储在向量中。`dfsStack`方法实现了一个迭代解决方案，将根节点插入栈中。然后移除栈顶元素并将所有未访问的相邻节点放入栈中。重复此过程直到栈为空。\n\
    \n### 代码\n```cpp\nvoid dfsUtil(const Graph & g, Graph::NodeID sid, std::vector<bool>\
    \ & visited, std::vector<Graph::NodeID> & colour, std::vector<Graph::NodeID> &\
    \ timing, unsigned int & time)\n{\n    std::cout << \"dfsUtil on \" << sid <<\
    \ std::endl;\n    visited[sid] = true;\n    colour[sid] = 'g'; // 灰色\n    ++time;\n\
    \    timing[sid] = time;\n    for (const auto & e : g.edges(sid))\n        if\
    \ (!visited[e.v])\n            dfsUtil(g, e.v, visited, colour, timing, time);\n\
    \    colour[sid] = 'b'; // 黑色\n    ++time;\n}\n\nvoid dfs(const Graph & g, Graph::NodeID\
    \ sid)\n{\n    if (sid >= g.numNodes()) // 对未知节点进行 DFS\n        return;\n    unsigned\
    \ int time = 0;\n    std::vector<bool> visited(g.numNodes(), false); // 白色\n \
    \   std::vector<Graph::NodeID> colour(g.numNodes(), 'w');\n    std::vector<Graph::NodeID>\
    \ timing(g.numNodes(), 0);\n    visited[sid] = true;\n    std::cout << \"Starting\
    \ dfs on \" << sid << std::endl;\n    for (const auto & e : g.edges(sid))\n  \
    \  {\n        if (!visited[e.v])\n        {\n            visited[e.v] = true;\n\
    \            dfsUtil(g, e.v, visited, colour, timing, time);\n        }\n    }\n\
    \    std::cout << \"End dfs\" << std::endl << std::endl;\n}\n\nvoid dfsStack(const\
    \ Graph & g, Graph::NodeID sid)\n{\n    if (sid >= g.numNodes()) // 对未知节点进行 DFS\n\
    \        return;\n    std::stack<Graph::NodeID> nodesVisited;\n    std::vector<bool>\
    \ visited(g.numNodes(), false);\n    visited[sid] = true;\n    nodesVisited.push(sid);\n\
    \    std::cout << \"Starting dfs on \" << sid << std::endl;\n    while (!nodesVisited.empty())\n\
    \    {\n        Graph::NodeID nid = nodesVisited.top();\n        bool myFullExploredNode\
    \ = true;\n        for (const auto & e : g.edges(nid))\n        {\n          \
    \  if (!visited[e.v])\n            {\n                visited[e.v] = true;\n \
    \               nodesVisited.push(e.v);\n                std::cout << \"Visited:\
    \ \" << e.v << std::endl;\n                myFullExploredNode = false;\n     \
    \           break;\n            }\n        }\n        if (myFullExploredNode)\n\
    \            nodesVisited.pop();\n    }\n    std::cout << \"End dfs\" << std::endl\
    \ << std::endl;\n}\n```\n\n### 复杂度\n空间复杂度对于栈是![](img/00033.jpeg)和![](img/00034.jpeg)，如果使用邻接表表示图；如果采用邻接矩阵，则是\
    \ ![](img/00035.jpeg)。时间复杂度为![](img/00036.jpeg)，其中![](img/00037.jpeg)可能在![](img/00038.jpeg)到![](img/00039.jpeg)之间变化，取决于图的稀疏程度。\n\
    \n## 6 如何检测图环\n### 解决方案\n如果在访问图的过程中存在回边，DFS 可以检测出环。使用上述解决方案定义的符号，这种情况表示为从灰色节点到灰色节点。\n\
    \n### 代码\n此实现留作练习。\n\n### 复杂度\n此处的复杂度与 DFS 相同。\n\n## 7 给定无向图中的两个节点，找到连接它们的路径\n\
    ### 解决方案\n简单的解决方案是从其中一个节点开始按 DFS 顺序访问图，一旦找到另一个节点就停止。在此过程中，访问的节点被存储在栈中。最后栈将包含所需的路径。\n\
    \n### 代码\n此实现留作练习。\n\n### 复杂度\n复杂度与 DFS 相同。\n\n## 8 解决迷宫\n假设我们有一个如所示的迷宫。找到出口的最佳方法是什么？\n\
    \n![`upload.wikimedia.org/wikipedia/commons/thumb/9/9d/MAZE_40x20_DFS_no_deadends.png/220px-MAZE_40x20_DFS_no_deadends.png`](img/00040.gif)\n\
    \n### 解决方案\n感兴趣的读者可以思考如何用图![](img/00041.jpeg)表示迷宫，以及在![](img/00042.jpeg)上最合适的访问策略是什么。\n\
    \n"
- fmt: "\nA topological sort of a [directed graph](http://en.wikipedia.org/wiki/Directed_graph)\
    \ is a linear ordering of its [vertices](http://en.wikipedia.org/wiki/Vertex_(graph_theory))\
    \ such that for every directed edge ![](images/00043.jpeg) from vertex ![](images/00044.jpeg)\
    \ to vertex ![](images/00045.jpeg) comes before ![](images/00046.jpeg) in the\
    \ ordering. A topological ordering is possible, if and only if the graph has no\
    \ directed cycles. Such graphs are called “directed acyclic graphs” (DAG).\n\n\
    ### Solution\n\nGiven a DAG, the topological sort is obtained by visiting the\
    \ nodes with a BFS and storing the nodes into a stack `stk`. At the end of the\
    \ process the stack will contain the topologically sorted nodes. The interested\
    \ reader should modify the code in order to verify the presence of cycles, if\
    \ the graph is not a DAG (left as exercise).\n\n### Code\n\n```cpp\nvoid topologicalSortUtil(const\
    \ Graph & g, Graph::NodeID sid, std::vector<bool> & visited, std::stack<Graph::NodeID>\
    \ &stk)\n{\n    visited[sid] = true;\n    std::cout << \"\\t topologicalSortUtil\"\
    \ << sid << std::endl;\n    for (const auto & e : g.edges(sid))\n        if (!visited[e.v])\n\
    \            topologicalSortUtil(g, e.v, visited, stk);\n    stk.push(sid);\n\
    }\n\nvoid topologicalSort(const Graph & g)\n{\n    std::vector<bool> visited(g.numNodes(),\
    \ false);\n    std::stack<Graph::NodeID> stk;\n    for (Graph::NodeID nid = 0;\
    \ nid < g.numNodes(); ++nid)\n        if (!visited[nid])\n            topologicalSortUtil(g,\
    \ nid, visited, stk);\n    std::cout << \"topologicalSort\" << std::endl;\n  \
    \  while (!stk.empty())\n    {\n        std::cout << stk.top() << std::endl;\n\
    \        stk.pop();\n    }\n}\n```\n\n### Complexity\n\nTime complexity is ![](images/00047.jpeg),\
    \ space complexity is ![](images/00048.jpeg).\n\n## 10 Detecting a bipartite graph\n\
    \nA bipartite graph is a graph, in which its vertices can be divided into two\
