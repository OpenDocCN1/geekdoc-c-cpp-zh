- fmt: "\nLet ![](images/00240.jpeg) the cost matrix for the worker ![](images/00241.jpeg)\
    \ to conclude the task ![](images/00242.jpeg) and let ![](images/00243.jpeg) the\
    \ assignment matrix when the worker ![](images/00244.jpeg) has assigned the task![](images/00245.jpeg).\
    \ Clearly, ![](images/00246.jpeg) and ![](images/00247.jpeg) and we want to minimize\
    \ the total cost function![](images/00248.jpeg). Note that the costs-matrix can\
    \ be represented as a complete bipartite graph as in the following example:\n\n\
    ![](images/00249.jpeg)\n\nGiven this representation, the problem can be solved\
    \ as a special instance of min cost flow and the solution is left as an exercise.\n\
    \n# 29 Find an Eulerian circuit\n\nAn Eulerian path[[15]](#part0000_split_036.html__ftn15)\
    \ is a visit in a graph which touches every [edge](http://en.wikipedia.org/wiki/Edge_(graph_theory))\
    \ exactly once. If such a walk exists, the graph is said semi-eulerian or traversable.\
    \ An Eulerian circuit is an Eulerian visit which starts and ends on the same [vertex](http://en.wikipedia.org/wiki/Vertex_(graph_theory)).\
    \ These problems were first discussed by Leonhard Euler for solving the famous\
    \ problem of Seven Bridges of Konigsberg[[16]](#part0000_split_036.html__ftn16).\n\
    \n![Thumbnail for version as of 17:12, 27 July 2006](images/00250.jpeg)\n\nThe\
    \ city of [Königsberg](http://en.wikipedia.org/wiki/K%C3%B6nigsberg) in [Prussia](http://en.wikipedia.org/wiki/Kingdom_of_Prussia)\
    \ was built on both sides of the [Pregel river](http://en.wikipedia.org/wiki/Pregolya),\
    \ and had two large islands which were connected to each other and the mainland\
    \ by seven bridges The problem was to find a walk through the city that would\
    \ cross each bridge once and only once. Euler proved that the problem has no solution\
    \ and this problem is considering the first one introducing a new discipline called\
    \ graph theory, the subject of this book.\n\n### Solution\n\nAt first glance the\
    \ problem seems similar to the Hamiltonian path. However it is not. Indeed a solution\
    \ can be computed in linear time.\n\nWe notice that a graph has Eulerian cycle\
    \ if: (a) All vertices with non-zero degree are connected b) All vertices have\
    \ even degree. In addition, a graph follows the Eulerian Path, if following two\
    \ conditions hold: (a) All vertices with non-zero degree are connected, (b) If\
    \ zero or two vertices have odd degree and all other vertices have even degree.\
    \ The proof of these properties is left as an exercise.\n\n### Code\n\n```cpp\n\
    bool isConnected(const Graph & g)\n{\n    std::vector<bool> visited(g.numNodes(),\
    \ false);\n    std::vector<Graph::NodeID> color(g.numNodes(), false);\n    std::vector<Graph::NodeID>\
    \ timing(g.numNodes(), 0);\n\n    Graph::NodeID id;\n    for (id = 0; id < g.numNodes();\
    \ ++id)\n        if (g.outdegree(id))\n            break;\n\n    if (id == g.numNodes())\n\
    \        return true;\n\n    dfsUtil(g, id, visited);\n\n    for (id = 0; id <\
    \ g.numNodes(); ++id)\n        if (visited[id] == false && g.outdegree(id))\n\
    \            return false;\n\n    return true;\n}\n\nenum euler { notEulerian,\
    \ SemiEulerian, Eulerian };\n\n// Eulerian\neuler isEulerian(const Graph & g)\n\
    {\n    if (isConnected(g) == false)\n        return notEulerian;\n\n    unsigned\
    \ int odd = 0;\n    for (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n    \
