    \ std::list<Graph::NodeID> queue;\n\n              queue.push_back(sid);\n\n while\
    \ (!queue.empty())\n\n              {\n\n const  Graph::NodeID n = queue.front();\n\
    \n                            queue.pop_front();\n\nstd::cout << \"Visited=\"\
