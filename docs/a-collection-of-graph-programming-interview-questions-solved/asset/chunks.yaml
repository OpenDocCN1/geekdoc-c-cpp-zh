    \n## 18 Find MST(Minimum Spanning Tree) using Kruskal\n\n`Kruskal`’s algorithm\
    \ finds a minimum spanning tree (`MST`) in an undirected graph with weighted edges.\
    \ The algorithm orders the edges for increasing weight and every single edge is\
    \ included, if it does not form a cycle with the edges selected.\n\n### Solution\n\
    The pseudo code uses `UNION-FIND` operations:\n* `Find`: Determine which subset\
    \ a particular element is. It is used for determining if two elements are in the\
    \ same subset.\n* `Union`: Join two subsets into a single subset.\n\n```\nKRUSKAL-MST(G,\
    \ w)\nT ← Ø\nfor each vertex u in V\n    MAKE-SET(DS, u)\nfor each edge (u,v)\
    \ in E in order nondecreasing weight\n    if FIND-SET(DS, u) != FIND-SET(DS, v)\n\
    \        UNION-SET(DS, u, v)\n        T ← T {(u,v)}\nreturn T\n```\nIn `boost`,\
    \ this is defined in `graph/kruskal_min_spanning_tree.hpp`. As an exercise try\
