  md: "# Constructors and Destructors\n\nWe are already aware of the need to include\
    \ a member function in our class that initializes the data members of its class\
    \ to desired default values and gets called automatically for each object that\
    \ has just got created. Constructors fulfill this need and the first portion of\
    \ this chapter deals with destructors. Various types of constructors are described\
    \ in the middle portion of this chapter.\n\nThere is also the need to include\
    \ a member function in our class that gets called automatically for each object\
    \ that is going out of scope. Destructors fulfill this need and the penultimate\
    \ portion of this chapter deals with destructors.\n\nAlong with the class and\
    \ the access specifiers, constructors and destructors fulfill the requirements\
    \ needed to created new data type—safe and efficient data types. This is discussed\
    \ in the last portion of this chapter.\n\n# 4.1 Constructors\n\nThe constructor\
    \ gets called automatically for each object that has just got created. It appears\
    \ as member function of each class, whether it is defined or not. It has the same\
    \ name as that of the class. It may or not take parameters. It does not return\
    \ anything (even void). The prototype of a constructor is\n\n```\n<class name>(parameter\
    \ list);\n```\n\nThe need for a function that guarantees initialization of member\
    \ data of a class was felt in Chapter 2. Constructors fulfill this need. Domain\
    \ constraints on the values of data members can also be implemented via constructors.\
    \ For example, the value of data member finches of each object of the class Distance\
    \ to be between 0.0 and 12.0 at all times during the lifetime of the object. This\
    \ condition may get violated in case an object has got created. However, introducing\
    \ a constructor to the class Distance can enforce this condition.\n\nThe compiler\
    \ embeds a call to the constructor for each object when it is created. Suppose\
    \ a class A has been declared as follows:\n\n```\n/*Beginning of A.h*/\nclass\
    \ A\n{\n    int x;\n    public:\n        void setx(const int=0);\n        int\
    \ getx(\\);\n};\n/*End of A.h*/\n```"
