- pgno: 102
  md: "We can specify our own handler function also! We can specify that the new operator,\
    \ upon encountering an out-of-memory condition, calls a function of your choice.\
    \ We can do this by calling the set_new_handler() function and passing the name\
    \ of the desired function as a parameter to it. The prototype of the set_new_handler()\
    \ function clarifies this. The prototype is in the new.h header file.\n\n```\n\
    new_handler set_new_handler(new_handler);\n```\n\nObviously, new_handler is a\
    \ data type. It is a function pointer. The first argument of the set_new_handler()\
    \ is a function pointer. If we pass the name of our desired function as a parameter\
    \ to the set_new_handler() function, all subsequent out-of-memory conditions cause\
    \ the new operator to call it. Our desired function becomes the new handler. Moreover,\
    \ when the set_new_handler() function is called, it returns a pointer to the previous\
    \ new function.\n\nAn illustrative example follows in Listing 3.10.\n\n# Listing\
    \ 3.10 Specifying a new handler function\n\n```\n/*Beginning of newHandler.cpp*/\n\
    #define BIG_NUMBER 9999999\n#include<new.h> //for set_new_handler() function\n\
    void myHandler()\n{\n/*\n    code to handle out-of-memory condition\n*/\n}\nvoid\
    \ main()\n{\n    new_handler oldHandler;\n//set the function myFunctionHandler\
    \ as the new handler\noldHandler = set_new_handler(myNewHandler);\nint * p = new\
    \ int[BIG_NUMBER]; //probably cause out-of-\n//memory condition\n}\n/*End of handler.cpp*/\n\
    ```\n\nIf the OS is unable to allocate the requested amount of memory, which is\
    \ quite likely in Listing 3.10, the new operator fails. The new handler function\
    \ gets called. The call to the set_new_handler() function, just prior to the call\
    \ to the operator, has already set the myHandler as the new handler. Therefore,\
    \ the function myHandler gets called.\n\nAn important characteristic of the new\
    \ operator is that when its request for memory fails, it calls the new handler\
    \ repeatedly until its request is satisfied. This helps in meaningfully defining\
    \ the new handler function (Listing 3.11).\n\nWe can make the new handler function\
    \ log an error message and then call the abort() function.\n\n# Listing 3.11 Defining\
    \ the new handler function\n\n```\nvoid myNewHandler()\n{\n    //statement to\
    \ log a suitable error message\nabort();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "The abort() function simply terminates the program. We can also throw an exception\n\
    from the new handler function. The chapter on exception handling explains the\
    \ syntax\nof throwing exceptions and its superiority over calling the abort()\
    \ function.\n\nAnother course of action is to replace the new handler function\
    \ by another one.\nFor this, we can call the set_new_handler() function from the\
    \ existing new handler\nfunction and the name of the new handler as a parameter\
    \ to it. Of course, a call\nshould be preceded by the code that attempts to resolve\
    \ the out-of-memory condition first.\nThe new handler should be replaced only\
    \ if this attempt fails. See Listing 3.12.\n\n# Listing 3.12 Replacing the new\
    \ handler function\n\n```\n#include<new.h>\nvoid myNewHandler() {\n    //make\
    \ attempt to resolve the out-of-memory\n    //condition\n    if(above_attempt_fails)\n\
    \        set_new_handler(myAnotherHandler);\n}\n```\n\nAn interesting way of defining\
    \ the new handler is to allocate buffer memory\nand free it by part part as the\
    \ need arises.\n\n# Summary\n\nMemory is allocated for program variables during\
    \ run only. In static memory allocation, the amount of memory to be decided during\
    \ compile time itself. The instance at which statically allocated variable would\
    \ get created during the program's execution is also decided during the program's\
    \ compilation.\n\nOn the other hand, the amount of memory to be decided during\
    \ run time in dynamic memory allocation. Moreover, memory can be allocated in\
    \ response to conditions that arise run time.\n\nC++ provides the new operator\
    \ for allocating memory dynamically. The syntax of the new operator for allocating\
    \ memory for a single block\n\n```\n<pointer> = new <data_type>;\n```\n\nThe new\
    \ operator allocates enough memory in the heap area to accommodate one variable\
    \ of the data type that is passed as its right-hand-side operand. Further, it\
    \ returns the address of the first byte of this allocated block of memory that\
    \ can be stored in the pointer on the left-hand-side of the assignment operator\
    \ as shown in the above statement.\n\nMemory for an array can be allocated by\
    \ using the new operator. The syntax in is as follows:\n\n```\n<pointer> = new\
    \ <data_type>[number_of_elements];\n```\n\nAgain, dynamically allocated memory\
    \ can be dynamically allocated in response to conditions that arise run time.\
    \ Dynamically allocated memory must be deleted, and returned to the Operating\
    \ System. Otherwise, memory leak would occur.\n\nC++ provides the delete operator\
    \ for deallocating memory dynamically. The syntax of the delete operator for deallocating\
    \ memory earlier allocated for a single block\n\n```\ndelete <pointer>;\n```\n\
    \nThe delete operator deallocates the memory in the heap area that the pointer\
    \ is passed as its right-hand-side operand points at.\n\nMemory for an array can\
    \ also be deallocated using the delete operator. The syntax is as:\n\n```\ndelete\
    \ []<pointer>;\n```"
