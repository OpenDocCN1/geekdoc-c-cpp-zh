  md: 'The size of the array to be created is passed as a parameter to the new operator.
    But while deallocating the memory allocated for the array, the size is not passed
    (the square brackets are empty). How does the compiler know how much memory is
    to be deallocated? The answer is that when the new operator executes to allocate
    a block of array, the OS stores the size passed. Figure 3.4 shows the size of
    the memory block, which is captured during run time, prefixed to the memory block
    itself. When the delete operator is used followed by the empty pair of square
    brackets, the compiler uses the size stored and deallocates the entire block correctly.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_101_0.png)


    Figure 3.4 Size of the allocated memory is prefixed to the memory block


    Blocks of memory containing arrays of other types can also be deallocated similarly.
    For example, see Listing 3.9.


    +   Listing 3.9 Deallocating memory that was allocated for an array of objects

    Distance * dptr; //creates an array of 5 objects at

    dptr = new Distance[5]; //the class Distance

    ...

    delete[] dptr; //de-allocates the memory //allocated for the entire array


    # 3.4 set_new_handler() Function


    We already know that the new operator attempts to capture more chunks of memory
    from the heap during run time. But what happens if no more memory is available
    to satisfy this attempt? We get an out-of-memory condition.

    The new operator, when faced with an out-of-memory condition, calls a global function
    and then throws an exception of type bad_alloc(the chapter on exception dealing
    with the mechanism of throwing and catching exceptions). This global function
    is known as the new handler function.'
