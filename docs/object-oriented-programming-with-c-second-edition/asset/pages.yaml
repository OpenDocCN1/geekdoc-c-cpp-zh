    \n```\nlong int logSum(unsigned int a, unsigned int b)\n{\n    int i;\n    long\
    \ int sum;\n    for(sum=0,i=a;i<b;i++)\n        sum+=log(i);\n    return sum;\n\
    }\n```\n\nThe log() function returns the logarithm of the number passed as a parameter\
