  md: "# Operator Overloading, Type Conversion, New Style Casts, and RTTI 219\n\n\
    The last circumstance that mandates operator overloading is self-explanatory.\n\
    \n# 8.1.5 Rules for Operator Overloading\n\nThe following rules must be observed\
    \ while overloading operators.\n\n+   1. New operators cannot be created: New\
    \ operators (such as **) cannot be created. For example, the piece of code shown\
    \ in Listing 8.6 will produce a compile-error.\n\nListing 8.6 An illegal attempt\
    \ to create a new operator\n\n```\nclass A\n{\n    public:\n    void operator\
    \ ** ();\n};\n```\n\n+   2. Meaning of existing operators cannot be changed: Any\
    \ operator-overloading function (member or friend) should take at least one operand\
    \ of the class of which it is a member or friend. Thus, it is not possible to\
    \ change the manner in which an existing operator works on operands of fundamental\
    \ types (char, int, float, double).\nIn case of member functions, this condition\
    \ is automatically enforced because the address of the object is implicitly passed\
    \ as a parameter to it. However, in case of friend functions, the library programmer\
    \ needs to take extra care. For example, the following piece of code (Listing\
    \ 8.7) will not compile.\n\nListing 8.7 An illegal attempt to modify the behaviour\
    \ of operators on intrinsic types\n\n```\nclass A\n{\n    public:\n    friend\
    \ int operator + (int, int); //ERROR: will not\n    //compile\n};\n```\n\nAs we\
    \ can see, ensuring that at least one operand of an operator-overloading function\
    \ must be of the class type, the compiler ensures that the meanings of the existing\
    \ operators cannot be changed. If the code in Listing 8.7 had compiled, the statement\n\
    z = x + y; //x, y, z are integer type\ncould have invoked the operator + () function\
    \ of the class A. Of course, this is undesirable.\n\n+   3. Some of the existing\
    \ operators cannot be overloaded: The following operators cannot be overloaded:\n\
    :: (scope resolution)\n. (member selection)\n.* (member selection through pointer\
    \ to member)\n?: (conditional operator)\nsizeof (finding the size of values and\
    \ types)\ntypeid (finding the type of object pointed at)"
