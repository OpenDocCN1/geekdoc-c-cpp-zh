  md: "# Object-Oriented Programming with C++\n\n# Listing 1.15 Declaring variables\
    \ in C++\n\n```\n#include<iostream>\nvoid main()\n{\n    int x;\n    x=10;\n \
    \   cout<<\"Value of x=\"<<x<<endl;\n    int * IPtr; //declaring a variable in\
    \ the middle of a\n    //function\n    IPtr=x;\n    cout<<\"Address of x=\"<<IPtr<<endl;\n\
    }\n```\n\nOutput\nValue of x=10\nAddress of x=0x21873163\n\n# 1.7 Reference Variables\
    \ in C++\n\nFirst, let us understand the basics. How does the operating system\
    \ (OS) display the value of variables? How are assignment operations such as 'x=y'\
    \ executed during run? A detailed answer to these questions is beyond the scope\
    \ of this book. A brief study is, nevertheless, possible and necessary for a good\
    \ understanding of reference variables. What follows is a simplified and tailored\
    \ explanation.\n\nThe OS maintains the addresses of each variable as it allocates\
    \ memory for them during runtime. In order to access the value of a variable,\
    \ the OS first finds the address of the variable and then transfers to the byte\
    \ whose address matches that of the variable.\n\nSuppose the following statement\
    \ is executed ('x' and 'y' are integer type variables).\n\n```\nx=y;\n```\n\n\
    The following steps are:\n\n+   1. The OS finds the address of 'y'.\n2. The OS\
    \ transfers control to the byte whose address matches this address.\n3. The OS\
    \ reads the value from the block of four bytes that starts with this byte (most\
    \ C++ compilers use integer-type variables to occupy four bytes during runtime\
    \ and will accept this value for our purpose).\n4. The OS pushes the read value\
    \ into a temporary stack.\n5. The OS finds the address of 'x'.\n6. The OS transfers\
    \ control to the byte whose address matches this address.\n7. The OS copies the\
    \ value from the stack, where it had put earlier, into the block of four bytes\
    \ that starts with the byte whose address it has found (above 'x').\nNotice that\
    \ addresses of the variables on the left as well as on the right of assignment\
    \ are determined. However, the value of the right-hand operand is also determined.\
    \ The expression on the right must be capable of being evaluated to a value. This\
    \ is an important point and must be borne in mind. It will enable us to understand\
    \ a number of concepts later."
  merge: -1
  img_proc: true
- pgno: 28
  md: "# Introduction to C++\n\nEspecially, you must remember that the expression\
    \ on the left of the assignment operator must be capable of being evaluated at\
    \ a valid address at which data can be written.\nNow, let us study reference variables.\
    \ A reference variable is nothing but a reference for an existing variable. It\
    \ shares the memory location with an existing variable. The syntax for declaring\
