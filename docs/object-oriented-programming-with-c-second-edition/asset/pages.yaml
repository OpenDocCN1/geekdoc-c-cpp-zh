  md: "# Object-Oriented Programming with C++\n\n```\nvoid main()\n{\n    Distance\
    \ d1,d2,d3;\n    d1.setFoot(1);\n    d1.setInches(1.1);\n    d2.setFoot(2);\n\
    \    d2.setInches(2.2);\n    d3=d1.add(d2);\n    cout<<d3.getFoot()<<\" '\"<<d3.getInches()<<\"\
    \ '\"\\n\";\n}\n```\n\n/*End of Distain.cpp*/\n\n# Output\n\n3-3.3'\n\nThe definition\
    \ of Distance :: add() function, after the previously described version by the\
    \ compiler is carried out, as follows:\n\n```\nDistance add(Distance * const this,\
    \ Distance dd)\n{\n    Distance temp;\n    temp.Foot=this->Foot+dd.Foot;\n   \
    \ temp.Inches=this->Inches+dd.Inches;\n    return temp;\n}\n```\n\nWhen this function\
    \ is called from the main() function with respect to 'd1', this pointer points\
    \ at 'd1'. Thus, it is the private data member of 'd1' that is being accessed\
    \ in the third and third lines of the add() function.\n\nSo, now we can\n\n+ \
    \  - Declare a class\n- Define member private and member functions\n- Make members\
    \ private and public\n- Declare objects and call member functions with respect\
    \ to objects\n\nWhat advantages does all this lead to? The advantage that library\
    \ programmers can now derive from this arrangement is epitomized in the following\
    \ observation:\n\n> An executable file will not be created from a source code\
    \ in which private data members of an object have been accessed by non-member\
    \ functions.\n\nOnce again, the importance of compile-time errors over run-time\
    \ errors is emphasized. Suppose, if an block exists in a function that is not\
    \ intended by the library programmer to access the data members of a structure.\
    \ This block contains a bug (say 'd1.month' has been assigned the value of 13,\
    \ where 'd1' is a variable of the structure 'date'). A pure compiler will not\
    \ recognize this statement as an invalid access.\n\nDuring testing, the condition\
    \ of this if might never become true. The bug would remain undetected; the executable\
    \ will get created with bugs. Thus, creating bug-free executables is difficult\
    \ and unreliable in C. This is due to the absence of language constructs that\
    \ enforce data security.\n\nOn the other hand, a C++ compiler that also detects\
    \ invalid access of private data members would immediately throw an error during\
    \ compile time itself and prevent the creation of the executable. Thus, creating\
    \ bug-free executables is easier and more reliable in C++ than in C. This is due\
    \ to the presence of language constructs that enforce data security."
