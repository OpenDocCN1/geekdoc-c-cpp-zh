  md: "# Exception Handling 399\n\nThe throw keyword is used to throw an exception.\
    \ It is followed by a value, such as character string or object, indicating the\
    \ nature of the exception. The library function notifies the user program by the\
    \ error by throwing an exception.\n\nThe catch keyword is used to catch an exception.\
    \ A catch-handler block begins with the keyword catch, followed, by a type declaration\
    \ indicating the type of exception that it catches. That, in turn, is followed\
    \ by a brace enclosed block of code indicating the actions to take. The catch\
    \ keyword, along with the exception types, is the point to which control should\
    \ jump when an exception is thrown.\n\nA try block encompasses the code that is\
    \ likely to throw an exception. Such a code generally consists of calls to library\
    \ functions that are designed to throw errors in the manner described herein.\
    \ One or more catch blocks follow the try block. The 'try' block is indicated\
    \ by the keyword try followed by a brace—enclosed block of code within which exception\
    \ will be caught.\n\nThe try block looks like this:\n\n```\ntry // start of try\
    \ block\n{\n  z=hmean(x,y);\n} // end of try block\n```\n\nIf any statement in\
    \ the try block causes an exception, the catch blocks after this block handle\
    \ the exception.\n\nExceptions are thrown as follows:\n\n```\nif(a==b)\nthrow\
    \ \"bad hmean( ) arguments : a = -b not allowed\";\n```\n\nIn this case, the exception\
    \ is the string hmean( ) arguments : a = -b not allowed. The throw statement resembles\
    \ the return statement because it terminates function execution. Instead, of merely\
    \ returning to the calling function, a throw causes the control back up through\
    \ the sequence of current functions until it finds the try block. In this case,\
    \ the passes program control back to main(). There, the program looks for an exception\
    \ handler (following the try block) that matches the type of exception.\n\n```\n\
    catch (char *) // start of exception handler\ncout<<\"\"\\n\";\ncout<<\"Enter\
    \ a new pair of numbers : \";\ncontinue;\n} // end of handler\n```\n\nThe catch\
    \ keyword identifies the handler and the char * means that this handler catches\
