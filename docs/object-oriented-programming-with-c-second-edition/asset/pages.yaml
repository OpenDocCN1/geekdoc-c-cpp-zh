    # 7.7 Opening and Closing Files


    So far, we have output data and input data from the same disk file by using different
    programs. Data is usually output and input within the same program. For this,
    it is necessary to close the disk file after one operation before it is opened
    for another. The open() and close() functions that are provided as members of
    the library stream handling classes enable us to do this.


    # 7.7.1 open() Function


    So far, we have opened files through the constructors of classes istream and ostream.
    We can do this by invoking the open() function also. This function has been in
    both of these classes.

    The open() function can be called by passing the name of the disk file to be opened
    as the only parameter.


    ```

    ofstream ofile;

    ofile.open("first.dat");


    istream ifile;

    ofile.open("first.dat");

    ```


    A second parameter can also be passed to this function. This parameter is known
    as the open mode. It is an integer-value. There are a number of integer-type constants
    defined in the stream handling library. Each of these, when passed as the second
    parameter to the open() function, produces a different effect while opening the
    file. A list of these along with their use is given in Table 7.1.


    Table 7.1 Table of Mode Bits


    | Constant | Meaning |

    | ios::app | For appending to end of file |

    | ios::ate | For going to end of file on opening |

    | ios::binary | For opening a binary file |

    | ios::in | For opening file for reading only |

    | ios::nocreate | For causing to fail if the file does not exist |

    | ios::noreplace | For causing to fail if the file already exists |

    | ios::out | For opening file for writing only |

    | ios::trunc | For deleting contents of the file if it exists |


    The constructor of the class istream and its overridden version of the open()
    function takes ios::out as the default value for the second parameter. Therefore,
    the file is opened for writing purpose only.'
