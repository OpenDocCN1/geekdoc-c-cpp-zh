  md: '# Templates 383


    A complete study of all of these templates is beyond the scope of this book. However,
    we will study the most important class templates in the next section. The commonly
    used member functions and the associated global functions are explained with the
    help of examples.


    # 10.4.1 list Class


    The list class is used to create sequential containers. Elements of the list are
    single objects. Objects of the list are declared as follows:


    ```

    list<char> clist; //creating a list of characters

    list<float> flist; //creating a list of floats

    list<int> intlist; //creating a list of integers

    ```


    For using the list template, the header file list needs to be included in the
    source code:


    ```

    #include<list>

    ```


    The elements of a list occupy a non-contiguous memory. They are doubly linked
    through a pair of pointers. One of the pointers at the next element and the other
    points at the previous element of the list. This allows both forward and backward
    traversal.


    The number of elements list can be specified at the time of declaration:


    ```

    list<int> ilist(3); //list of integers with three initial

    //elements.

    ```


    A default value can be specified for these elements.


    ```

    list<int> ilist(3, -1); //list of integers with three

    //initial elements each having -1.

    ```


    A list can be created from an existing array. We can do this by passing a pointer
    that points at the first element of the array and a second pointer that points
    1 the last element of the array to copy.


    ```

    int iarr[6] = {0,1,2,3,4,5}; //array with six elements

    list<int> ilist(iarr, iarr+6); //list also has six

    //elements with the same

    //values

    ```


    We have a look at the important member functions of this class.


    # The list<>::push_front() Function


    This function is used to insert elements at the beginning of the list.


    ```

    list<int> intlist;

    ilist.push_front(1); //inserts 1 at the beginning of

    //the list

    ilist.push_front(2); //inserts 2 at the beginning of

    //the list list becomes 2,1.

    ```


    # The list<>::push_back() Function


    This function is used to insert elements at the end of the list.'
