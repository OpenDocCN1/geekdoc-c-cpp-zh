  md: "# Object-Oriented Programming with C++\n\nA static data member can be declared\
    \ to be a constant. In that case, the member functions will be only to read but\
    \ not modify its value.\n\n# Static member functions\n\nHow do we create a member\
    \ function that need not be called with respect to an existing object? This function's\
    \ sole purpose is to access and/modify static data members of the class. Static\
    \ member functions fulfill the oblige criteria. Prefixing the function prototype\
    \ with the keyword static identifies it as a static member function. However,\
    \ the keyword static should not appear in the definition of the function.\n\n\
    Suppose there is a function set_interest_rate() that sets the value of the interest_rate\
    \ static data member of class. The programmer should be able to call this function\
    \ even if no objects have been declared. As discussed previously, this function's\
    \ definition can be shown as in Listing 2.38.\n\nListing 2.38 Static member function\n\
    \n```\n/*Beginning of Account.h*/\nclass Account\n{\n    static float interest_rate;\n\
    public:\n    static void set_interest_rate(float);\n    /*\n    rest of the class\
    \ Account\n    */\n};\n/End of Account.h*/\n```\n\n```\n/*Beginning of Account.cpp*/\n\
    #include\"Account.h\"\nfloat Account::interest_rate = 4.5;\nvoid Account::set_interest_rate(float\
    \ p)\n{\n    interest_rate=p;\n}\n/*\n    definitions of the rest of the functions\
    \ of class Account\n*/\n/End of Account.cpp*/\n```\n\nNow, the Account::set_interest_rate()\
    \ function can be called directly without any object.\n\nAccount::set_interest_rate(5);\n\
    \nStatic member functions do not take this pointer as a formal argument. Therefore,\
    \ accessing non-static data members through a static member function results in\
    \ compile-time errors. Static member functions can access only static data members\
    \ of the class.\nStatic member functions can still be called with respect to objects.\n\
    \n```\na1.set_interest_rate(5); //a1 is an object of the class\n//Account\n```"
