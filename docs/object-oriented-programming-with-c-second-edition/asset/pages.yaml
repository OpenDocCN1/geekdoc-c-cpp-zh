    \nThe scope resolution operator is used to separate the class definition from\
    \ the definitions of the member functions. The class definition can be placed\
    \ in a header file. Member functions, with the use of scope resolution operator,\
    \ can be placed in a source implementation file.\n\nThe `this` pointer is inserted\
    \ by the compiler, as a formal argument, in the prototype and in the definition\
    \ of each member function of each class. When a member function is called with\
    \ respect to an object, the compiler inserts the address of the object as a parameter\
    \ to the function call. Consequently, this `this` pointer, which exists as the\
    \ implicit leading formal in all member functions, always points to the object\
    \ with respect to which member function has been called.\n\nAccess to member data\
    \ and member functions from within member functions is resolved by the `this`\
    \ pointer. The `this` pointer is a constant pointer in non-constant member functions\
    \ and a constant pointer to a constant in case of constant member functions.\n\
    \nIf the operator on its right is a data member, the object-to-member access operator\
