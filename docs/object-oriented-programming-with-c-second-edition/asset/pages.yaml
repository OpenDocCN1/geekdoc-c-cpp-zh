    \ validity before every use. Smart pointers are class objects. Let us create a\
    \ class objects will behave like pointers to the class String. See Listing 8.59.\n\
    \n# Listing 8.59 A class of smart pointers\n\n```\n/*Beginning of StrPtr.h*/\n\
    #include \"String.h\"\nclass StrPtr\n{\n    String * p;\npublic:\n    StrPtr(String&);\
    \ //the one and only constructor\n};\n/*End of StrPtr.h*/\n/*Beginning of StrPtr.cpp*/\n\
    #include \"String.h\"\nStrPtr::StrPtr(String& ss)\n{\n    p=ss;\n}\n/*End of StrPtr.cpp*/\n\
