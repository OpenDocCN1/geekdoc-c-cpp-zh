  md: "# Object-Oriented Programming with C++\n\na variable of the new structure.\
    \ For this, the address/name of a variable structure is passed to the associated\
    \ functions of the existing structure. This is expected as data and interface\
    \ complement each other.\n\nIn inheritance, data and interface may both be inherited.\
    \ The parent structure can be given the general characteristics while its child\
    \ structures be given the more specific characteristics. This allows reuse by\
    \ keeping the common code in a common place—the base structure. Otherwise, the\
    \ code would have to be replicated in all of the child structures, which will\
    \ lead to maintenance nightmares. Inheritance also enables code extensibility\
    \ by allowing the creation of new structures that are better suited to our requirements\
    \ compared to the existing structures.\n\nPolymorphism, as the name suggests,\
    \ is the phenomena by virtue of the same entity can exist in two or more forms.\
    \ In Oops, functions can be exhibit polymorphic behaviour. With different set\
    \ of formal arguments can have the same name. Polymorphism is of two types: static\
    \ and dynamic. We will understand how this enables C++ programmers to reuse and\
    \ extend code in the subsequent chapters.\n\n# 1.4 Comparison of C++ with C\n\n\
    C++ is an extension of C language. It is a proper superset of C language. This\
    \ means that a C++ compiler can compile programs written in C language. However,\
    \ the reverse is not true. A C++ compiler can understand all the keywords that\
    \ a C compiler can understand. Again, the reverse is not true. Decision-making\
    \ constructs, looping constructs, structures, functions, etc. are written in the\
    \ exactly same way in C++ as they are in C language. Apart from the keywords that\
    \ implement these common programming constructs, C++ provides a number of additional\
    \ keywords and constructs that enable it to implement the object-oriented paradigm.\n\
    \nThe header file given in Listing 1.6 shows how the Date structure, which has\
    \ been our running so far, can be rewritten in C++.\n\n+   Listing 1.6 Redefining\
    \ the Date structure in C++\n\n```\n/*Beginning Date.h*/\nclass Date //class instead\
    \ of structure\n{\n    private:\n        int d,m,y;\n    public:\n        Date();\n\
    \        void get_sys_date(); //associated functions appear\n        //within\
    \ the class definition\n        void next_day();\n};\n/*End Date.h*/\n```\n\n\
    The following differences can be noticed between Date structure in C (Listing\
    \ 1.3) and C++ (Listing 1.6):\n\n+   * The keyword class has been used instead\
    \ of struct.\n* Two new keywords—private and public—appear in the code.\n* Apart\
    \ from data members, the class constructor also has member functions.\n* A function\
    \ that has the same name as the class itself is also present in the class. Accidentally,\
    \ it has no return type specified. This is the class constructor and is discussed\
    \ in Chapter 4 of this book."
