    # Dynamic Model


    The dynamic model models the sequence of changes that occur in a system.


    Two important concepts in dynamic modelling are events and states. State of an
    object is represented by the set of values of the object at a given point in time.
    Events are external stimuli that cause a change of state.


    A state depicts the states, events, and transitions from one state to another
    for a given class. One state diagram is created for each class that exhibits important
    dynamic behaviour. The set of all state diagrams constitutes the dynamic model.
    The state diagrams shared events with each other.


    # Events


    An event is an instantaneous occurrence that causes a change of state. An event
    is a one-way transmission of information from one object to another.


    # Scenarios and event traces


    A scenario is a textual line-by-line description of the sequence of events that
    occur during one particular execution of a system. Event traces are created for
    each scenario. For this, the sender and the receiver objects of each event are
    identified. This event trace shows each of these objects as a vertical line. Each
    event is depicted as a horizontal arrow from the sender object to the receiver
    object. See Figure D.13.'
