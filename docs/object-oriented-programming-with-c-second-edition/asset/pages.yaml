    New styles define a better choice than the old C-style casts. Visibility of the
    new style is considerably greater than the old style cast, which makes tracking
    a rough old style much easier.


    ```

    operator <type>(whose value is to be)

    ```


    The dynamic_cast operator is used to determine whether a base class pointer points
    to an object of the base class or one of the derived classes at run time. It is
    also used to determine whether a base class reference refers to an object of the
    base class or an object of the derived classes at run.


    The static_cast operator serves the same purpose as the typeid operator for implementing
    typeid (typeid is a keyword in C++). The typeid operator returns the type_ information.


    In general, if a derived class type and the value to be converted is the dynamic_cast
    operator returns a pointer to the object. Else, it returns NULL. For the dynamic_cast
    operator to operate, the base class must be polymorphic in nature, it should have
    at least one virtual function.


    Apart from dynamic_cast operator, C++ provides the typeid operator for implementing
    typeid (typeid is a keyword in C++). The typeid operator returns the type of the
    passed value as a reference to an object of class type_info. The class type_info
    is defined in the header file typeinfo.h.


    Two objects of the class can be compared using the equality operator. The name
    of the value passed to the typeid operator can also be determined by the type_info::name()


    The dynamic_cast operator enables us to access those features of the derived class
    that are not present in the base class.


    Class objects, pointers to objects, or references to class objects can be passed
    to the typeid operator. However, for the typeid operator to work correctly, the
    class whose object, pointer, or reference is passed should be polymorphic in nature.


