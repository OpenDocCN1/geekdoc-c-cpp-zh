    \ elements are stored in contiguous blocks (like an array).\nFor using the vector\
    \ template class, the header file needs to be included in the source code.\n\n\
    ```\n#include<vector>\n```\n\nA vector does not actually grow itself with each\
    \ individual insertion. The amount of memory a vector captures is larger than\
    \ the number of elements it actually stores. When this storage becomes full, it\
    \ again grows itself by a certain amount to accommodate the latest insertion.\
    \ The amount by which a vector grows differs from compiler to compiler.\nThis\
    \ brings us two important concepts about vectors, namely capacity and size.\n\
    Capacity is the total size of the block currently captured by a vector. Obviously,\
    \ it is directly proportional to the total number of elements that can be inserted\
    \ into the vector before it needs to regrow.\n\nSize, on the other hand, is the\
    \ number of elements actually stored in the memory block that has been captured\
    \ by the vector. Obviously, size of a vector is always less than or equal to its\
