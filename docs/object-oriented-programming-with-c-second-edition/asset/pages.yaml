  md: "# Object-Oriented Programming with C++\n\n4. Some operators can be overloaded\
    \ using non-static member functions only: The following operators can be overloaded\
    \ using non-static member functions alone.\n= (Assignment operator)\n() (Function\
    \ operator)\n[] (Subscribing operator)\n-> (Pointer-to-member access operator)\n\
    \nThese operators cannot be overloaded using friend functions or static functions.\n\
    5. Number of arguments that an existing operator cannot be changed: Operator-overloading\
    \ functions should take the same number of parameters that the operator being\
    \ overloaded ordinarily. For example, the division operator takes two arguments.\
    \ Hence, the class definition shown in Listing 8.8 causes a compile-time error\
    \ 'operator / takes too few arguments' for the operator-overloading function.\n\
    \nListing 8.8 An illegal attempt to modify the number of arguments that an operator\
    \ takes by default\n\n```\nclass A {\n  public:\n    void operator / ();\n};\n\
    ```\n\n6. Overloaded operators cannot take default arguments: The class definition\
    \ shown in Listing 8.9 causes a compile-time error 'operator/cannot take default\
    \ arguments' for the operator-overloading function.\n\nListing 8.9 An illegal\
    \ attempt to assign a default value to an argument of an operator-overloading\
    \ function\n\nFinally, we must note that it is highly imprudent to modify the\
    \ values of the operands that are passed to the operator-overloading functions.\
