  md: '# Object-Oriented Programming with C++


    Overall development time is not always less in OOAD compared to the conventional
    methodology. The benefit is that the resulting model is better suited for future
    use. Downstream errors and maintenance efforts also get reduced.


    # D.2 Object-Oriented Model


    An object-oriented model consists of the following three kinds of models:


    +   * Object model

    * Dynamic model

    * Functional model


    The object model describes the objects in the system and the relationships amongst
    these objects. It consists of object diagrams.


    The dynamic model describes how objects in the system interact with each other.
    It consists of state diagrams. A state diagram depicts states and transitions
    between states that are caused by events.


    The functional model describes how data gets transformed in the system. It consists
    of data flow diagrams. A data flow diagram depicts processes and data flow among
    the processes.


    The three models complement each other. They are linked to each other. The model
    is described first. It is necessary to describe what is changing or transforming
    before when and how it changes.


    The object model describes classes upon whom the dynamic and functional models
    operate. The operations in the object model relate to events in the dynamic model
    and functions in the functional model.


    # Object Model


    Object diagrams are of two types: class diagrams and instance diagrams.


    As its name suggests, a class diagram describes classes and relationships amongst
    classes.


    An instance diagram depicts the relationship amongst a particular set of objects
    that exist together at a given instance of time. A large number of instance diagrams
    can be generated from a single class diagram.


    Boxes are used to depict objects and classes. Different object-oriented design
    tools use different variations of these boxes. A sample is shown in Figure D.1.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_451_0.png)


    Figure D.1 A class is depicted in an object model as a box with sharp corners;
    name is in bold


    # Attributes


    Attributes are nothing but data members of classes. They are listed in the second
    part of the class box. Each attribute name may be followed by a colon and its
    type. In, turn, may be followed by an equality symbol and the default value of
