    \ is not present in the base String. But in this case, the drawback is in the\
    \ base class itself. It is the base class itself that should be corrected. Inheritance\
    \ is not used to remove such lacuna. It is used to provide additional data and\
    \ additional code to work upon the additional data in the derived class. Inheritance\
    \ is used to add facilities to an existing class without reprogramming or recompiling\
    \ it. It enables us to implement code usability.\n\nFriendship is not inherited.\
    \ A class does not become a friend to a class to its parent is Listing 5.2 illustrates\
