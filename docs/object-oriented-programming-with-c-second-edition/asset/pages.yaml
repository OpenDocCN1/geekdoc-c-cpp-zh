  md: "# Templates 375\n\nObjects of classes can be passed to the function swap. The\
    \ compiler will generate an actual definition by replacing each occurrence of\
    \ T by the name of the corresponding class.\nListing 10.7.\n\n# Listing 10.7 Calling\
    \ the template for the function swap by passing objects of the class Distance\n\
    \n```\n/Beginning of swap03.cpp*/\n#include <iostream>\n#include \"swap.h\"\n\
    #include \"Distance.h\"\nvoid main()\n{\n    Distance d1(1,1.1),d2(2,2.2);\n \
    \   cout << \"Before swapping\\n\";\n    cout << \"d1=\" << d1.getFeet() << \"\
    -\" << d1.getInches() << \"\\n\";\n    cout << \"d2=\" << d2.getFeet() << \"-\"\
    \ << d2.getInches() << \"\\n\";\n    swap(d1,d2); // generates swap(Distance,\
    \ &d2); and resolves the call\n    cout << \"After swapping\\n\";\n    cout <<\
    \ \"d1=\" << d1.getFeet() << \"-\" << d1.getInches() << \"\\n\";\n    cout <<\
    \ \"d2=\" << d2.getFeet() << \"-\" << d2.getInches() << \"\\n\";\n}\n/*End of\
    \ swap03.cpp*/\n```\n\nOutput\nBefore swapping\nd1='1'-1.1'\nd2='2'-2.2'\nAfter\
    \ swapping\nd1='2'-2.2'\nd2='1'-1.1'\n\nWe must note the amount of effort saved\
    \ in code development. Only one definition suffices for all possible types! Templates\
    \ are a very handy tool provided by C++ for implementing code reuseability.\n\n\
    Further, the compiler generates an actual function from a template only once for\
    \ a given data type. If, the function swap is called by passing integers for the\
    \ first time, the compiler will generate a function definition from its template.\
    \ Subsequent calls with the same data type will not generate the definition. This\
    \ is for the simple reason that the compiler first looks for an exact match to\
    \ resolve a function before looking for a template (the next paragraph explains\
    \ this with the help of an example). If it finds an exact match, it does not look\
    \ for a template. Since the first call itself generates the function definition,\
    \ subsequent calls do not do so.\n\nEvidently, the ever definition of the function\
    \ must appear in the header file. Otherwise, the compiler would not be able to\
    \ generate the correct definition while compiling a user program in which the\
    \ template has been called.\n\nThe library programmer may like to put the prototype\
    \ of the template function in a library while keeping only the header file. There\
    \ is a keyword called export that is supposed to fulfill this need. However, not\
    \ all compilers support this keyword."
