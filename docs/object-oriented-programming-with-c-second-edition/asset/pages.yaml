    \ simplifies the `address of the object` as an implicit parameter to the function\
    \ call.\n\nSimilarly, if the operator on its right is a data member, the pointer-to-member\
    \ access operator (`->`) behaves just as it does in C language. However, if it\
    \ is a member of a class whose pointer to an object of the same class is its left-hand\
    \ side operand, then the compiler passes the value of the `pointer` as an implicit\
    \ parameter to the function call. Member functions can call each other. Calls\
    \ are resolved through this `this` pointer. Member functions can be overloaded.\
