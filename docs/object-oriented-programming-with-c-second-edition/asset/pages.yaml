  md: '# Appendix D: Object-Oriented Analysis and Design 445


    # Data flow diagrams


    A data flow diagram depicts the flow of data values from source objects through
    processes to their destinations objects.

    A data flow diagram contains processes and data flows. Processes transform data.
    Data flows depict the flow of data amongst processes, actor objects, and data
    store objects. Actor objects are passive objects that enter data and use the data
    produced by the system. Data store objects merely store data and do not transform
    the data in any way.


    # Processes


    A process is depicted as an ellipse in the data flow diagram. A descriptive name
    of the process appears as its label. The input and output data for each process
    are also depicted. See Figure D.17.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_458_0.png)


    # Data flows


    A data flow connects the output of one object or process to the input of another
    object or process. The value is not changed by the data flow.


    # Actors


    An actor initiates the data flow by inputting values. Values output by a data
    flow diagram may also terminate with an actor. Actors may be data-entry operators
    or timed devices. An actor is depicted as a rectangle since an actor is inherently
    an object.


    # Data stores


    A data store merely stores data for later use. It does not have any operations
    defined. It is depicted as a pair of parallel lines with its name in the lines
    (Figure D.18). Data stores are inherently objects. Figure D.19 shows a data flow
    diagram.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_458_1.png)


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_458_2.png)'
