    Here again the copy constructor is called for ''A2'' while ''A1'' is passed as
    a parameter to the copy constructor.


    +   - When an object is created and simultaneously equated to a call to a function
    that returns an object. The copy constructor is called for the object that is
    equated to the function call. The object returned from the function is passed
    as a parameter to the constructor.


    ```

    A abc()

