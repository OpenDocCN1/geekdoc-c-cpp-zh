    In Figure 4.2, ''p'' is the formal argument of the constructor. The address of
    the memory block that contains the passed string is 50. The value of ''p'' is
    50. But the constructor should execute in such a manner that a different block
    is sufficiently long to hold the string at which ''p'' is pointing also allocated
    dynamically in the heap area (see Figure 4.2). This memory block extends from
    byte numbers 101 to 104. The base address of this block is stored in the pointer
    embedded in ''s1''. The string is copied from the memory block at which ''p''
    points to the memory block at which ''s1.cStr'' points. Finally, ''s1.len'' is
    appropriately set to 3.

