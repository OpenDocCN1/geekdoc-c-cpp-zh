    # 5.1 Introduction


    Inheritance is a very useful feature of OOPS that is supported by C++. A class
    may be defined in such a way that it automatically includes member data and member
    functions of an existing class. Additionally, member data and member functions
    may be defined in the new class also. This is called inheritance.

    The existing class whose features are being inherited is known as the base class
    or parent class or super class. The new class that is being derived by inheriting
    from the existing class is known as its derived class or child class or sub-class.
    The syntax for derivation is as follows.


    ```

    class <name of derived class> : <access specifier> <name of base class>

    {

    /*

    definition of derived class */

    ```'
