    \ Further, default values can be specified for a formal argument of any type.\n\
    \n# 2.2.3 Inline Member Functions\n\nMember functions are made inline by either\
    \ of the following two methods.\n\n+   * By defining the function within the class\
    \ itself (as in Listing 2.5)\n* By only prototyping and not defining the function\
    \ within the class. The function is defined outside the class by using the scope\
    \ resolution operator. The definition is prefixed by the inline keyword. In non-member\
    \ functions, the definition of the inline function must appear before it is called.\
    \ Hence, the function should be defined in the same header file in which its class\
    \ is defined. Listing 2.19 illustrates this.\n\n# Listing 2.19 Inline member functions\n\
    \n```\n/*Beginning of memInline.cpp*/\nclass A {\n  public:\n    void show();\n\
    }\ninline void A::show() //definition in header file\n{\\ //definition of A::show()\
    \ function\n}\n/*End of memInline.cpp*/\n```\n\n# 2.2.4 Constant Member Functions\n\
    \nLet us consider this situation. The library programmer desires that one of the\
    \ member functions of his/her class should not be able to change the value of\
    \ member data. This function should be able to read the values contained in the\
    \ data members, but not change them. However, he/she fears while defining the\
    \ function he/she might accidentally write the code to do so. In order to prevent\
    \ this, he/she seeks the compiler's help. If he/she declares the function as a\
    \ constant, and therefore prevents change to the value of a data member through\
    \ function, the compiler throws an error.\n\nLet us consider the class Distance.\
    \ The Distance::get(), Distance::inches(), and the Distance::add() functions should\
    \ obviously be constant functions. They should not change the values of members\
    \ of the invoking object by accident.\n\nMember functions are specified as constants\
