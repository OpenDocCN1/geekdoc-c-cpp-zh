    \ out from the the class definition in Listing 8.59. This forces clients to invariably\
    \ pass an object of the class String as a parameter when they create objects of\
    \ the class StrPtr. Therefore, the embedded pointer of the class StrPtr always\
    \ points at an object of the class String. The client can create an object of\
    \ the class in Listing 8.59 as follows:\n\nStrPtr si(\"abc\");\nStrPtr p(si);\n\
    \nTo mimic a pointer completely, the objects of the class StrPtr should be capable\
