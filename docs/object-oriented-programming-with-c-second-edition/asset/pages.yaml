- pgno: 14
  md: '# Introduction to C++


    This chapter introduces the reader to the fundamentals of object-oriented programming
    systems (OOPS).

    The chapter begins with an overview of structures, the reasons for their inclusion
    as a language construct in C language, and their role in procedure-oriented programming
    systems. Use of structures for creating new data types is described. Also, the
    drawbacks of structures and the development of OOPS are elucidated.

    The middle section of the chapter explains OOPS, supplemented with suitable examples
    and analogies to help in this tricky subject.

    The concluding section of the chapter includes a study of a number of new features
    that are implemented by C++ compilers but do not fall under the category of object-oriented
    features. (Language constructs of C++ that implement object-oriented features
    are dealt with in the next chapter).


    # 1.1 A Review of Structures


    In order to understand procedure-oriented programming systems, let us first recapitulate
    our understanding of structures in C. Let us review their necessity and use in
    creating new data types.


    # 1.1.1 The Need for Structures


    There are cases where the value of one variable depends upon that of another variable.

    Take the example of date. A date can be programmatically represented in C by three
    different variables taken together. Say.


    ```

    int d,m,y; //three integers for representing dates

    ```


    Here ''d'', ''m'', and ''y'' represent the day of the month, the month, and the
    year, respectively. Observe carefully. Although these three variables are not
    grouped in the code, they actually belong to the same group. The value of one
    variable may influence the value of the other. In order to understand this clearly,
    a function next_day() that accepts the addresses of the three integers represent
    a date and changes their values to represent the next day. The prototype of this
    function will be


    ```

    void next_day(int *int,int *int,int *int); //function to calculate

    //the next day

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Object-Oriented Programming with C++


    Suppose,

    d=1;

    m=1;

    y=2002;


    Now, if we write

    next_day(&,&,&,);


    ‘d’ will become 2, ‘m’ will remain 1, and ‘y’ will remain 2002.


    But if

    d=28;

    m=2;

    y=1999; //28th February, 1999


    and we call the function as

    next_day(&,&,&,);


    ‘d’ will become 1, ‘m’ will become 3, and ‘y’ will remain 1999.

    Again, if


    ```

    d=31;

    m=12;

    y=1999; //31st December, 1999

    ```


    and we call the function as

    next_day(&,&,&,);


    ‘d’ will become 1, ‘m’ will become 1, and ‘y’ will become 2000.

    As you can see, ‘d’, ‘m’, and ‘y’ belong to the same group. But there is no language
    construct that actually places them in the same group. Thus, members of the wrong
    group may be accidentally sent to the function (Listing 1.1)!


    | Listing 1.1 Problem in passing of programmatically independent but logically
    dependent variable |

    d1=28; y1=1999; //28th February, 1999

    d2=19; m=2; y2=1999; //19th March, 1999

    next_day(&d1,&m1,&y1); //OK

    next_day(&d2,&m2,&y2); //What? Incorrect set passed! |


    As observed in Listing 1.1, there is nothing in the language itself that prevents
    the wrong set of variables from being sent to the function. Moreover, integer-type
    variables that are not meant to represent dates might also be sent to the function!


    Let us try to solve the problem. Suppose the next_day() function accepts an array
    as a parameter. Its prototype would be


    ```

    void next_day(int *);

    ```


    Let us declare this as an array of integers.


    ```

    int date[3];ndate[0]=28;

    date[1]=2;

    date[2]=1999; //28th February, 1999

    ```'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Introduction to C++


    Now, let us call the function as:


    next_day(date);


    The values of ''date[0]'', ''date[1]'', and ''date[2]'' will be correctly set
    to 1, 3, and 1999, respectively. Although this method seems to work, it certainly
    appears unconvincing. After all any integer array can be passed to the function,
    even if it does not necessarily represent a date. There is no data type of date
    itself. Moreover, order of arrays will not work if the variables are not of the
    same type. The solution to this problem is to create a data type called itself
    using structures


    ```

    struct date //structure to represent date

    {

    int d, m, y;

    }

    ```


    Now, the next_day() function will accept the address of a variable of the structure
    as a parameter. Accordingly, its prototype will be as follows:


    ```

    void next_day(struct date *);

    ```


    Let us call it as shown in Listing 1.2.


    # Listing 1.2 The need for structures


    ```

    struct date d1;

    d1.d=28;

    d1.m=2;

    d1.y=1999;

    next_day(&d1);

    ```


    ''d1.d'', ''d1.m'', and ''d1.y'' will be correctly set to 1, 3, and 1999, respectively.
    Since the function takes the address of an entire structure variable as a parameter
    at a time, there is no chance of variables of the different groups being sent
    to the function.


    Structure is a programming construct in C that allows us to put together variables
    that should be together.


    Library programmers use structures to create new data types. Application programs
    and other library programs use these new data types by declaring variables of
    this data type.


    ```

    struct date d1;

    ```


    They call the associated functions by passing these variables or their addresses
    to:


    ```

    d1.d=31;

    d1.m=12;

    d1.y=2003;

    next_day(&d1);

    ```


    Finally, they use the resultant value of the passed variable further as per requirements.


    ```

    printf("The next day is: %d/%d/%d\n", d1.d, d1.m, d1.y);

    ```


    # Output


    The next day is: 01/01/2004'
