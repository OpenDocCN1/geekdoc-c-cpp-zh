    # 9.5 Trees


    Trees, unlike linked lists, stacks, and queues, do not have a linear structure.
    In the lists we have studied so far in this chapter, each node was connected to
    a maximum of one other node. But, in a tree, each of the nodes may be connected
    to more than one node.

    We encounter tree-like structures in our everyday life. Such a real example of
    a tree can be that of a directory structure in a computer. Figure 9.57 shows a
    possible directory structure (each box represents a directory):


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_356_0.png)


    > Figure 9.57 Directory structure looks like a tree'
