    \ file.\nStep 5: Link the object file with the library provided by the library\
    \ programmer to get the executable or another library.\n\n# 1.2 Procedure-Oriented\
    \ Programming Systems\n\nIn light of the previous discussion, let us understand\
    \ the procedure-oriented programming system. The forming of programming code into\
    \ functions. Data (contained in structure variables) is passed from one function\
    \ to another to be read or written into. The focus is on procedures. This programming\
