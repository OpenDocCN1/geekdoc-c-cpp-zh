    String(const String&); //the copy constructor\nString operator = (const String);\n\
    /*\nrest of the Class String\n*/\n```\n\n```\n/*Beginning of String.h*/\n#include\"\
    String.h\"\n#include<string.h>\nString ::operator = (const String ss)\n{\n   \
    \ if(Cstr != NULL)\n    {\n        delete[] Cstr;\n        Cstr = NULL;\n    \
