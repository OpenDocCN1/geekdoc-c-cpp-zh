    \ Obj2;\n```\n\nwill be interpreted as\n\n```\nObj3 = Obj1.operator <arithith_op_symbol>\
    \ (Obj2);\n```\n\nIf instead a friend function overloads the arithmetic operator,\
    \ the syntax will be as in Listing 8.18.\n\n+   Listing 8.18 Syntax for overloading\
    \ the arithmetic operators through friend functions\n\n```\nclass <class_name>\n\
    {\n  public:\n    //prototype\n    friend <return_type>operator<arithith_op_symbol>(<param_list>);\n\
    \    //definition\n    <return_type> operator<arithith_op_symbol>(<param_list>)\n\
    \    //function body\n}\n```\n\nObjects that store the values of the left-hand\
    \ side and the right-hand side operands of the arithmetic operator will appear\
