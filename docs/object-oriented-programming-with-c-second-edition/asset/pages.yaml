  md: "# Constructors and Destructors\n\nConsider the statement that declares an object\
    \ of a class A in Listing 4.1.\n\n# Listing 4.1 Constructor gets called automatically\
    \ for each object when it is created\n\n```\n/*Beginning of AMain.cpp*/\n#include\"\
    A.h\"\nvoid main() {\n    A A1;                //object declared - constructor\
    \ called\n}/*End of AMain.cpp*/\n```\n\nThe statement in the function main() in\
    \ Listing 4.1 is transformed into the following statements.\n\n```\nA A1;    \
