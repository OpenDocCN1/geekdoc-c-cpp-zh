  md: "# Object-Oriented Programming with C++\n\n# 11.4 Limitation of Exception Handling\n\
    \nThe limitation of exception handling is that if a resource has acquired (file\
    \ has been opened, memory has been allocated dynamically in the heap area, etc.)\
    \ and the statements to release the resource are after the throw statements, then\
    \ the acquired resource may remain locked up. Listing 11.15 illustrates this.\n\
    \nListing 11.15 Dynamically resources remain locked after the throw statement\n\
    \n```\n#include<iostream>\nclass A {\n    public:\n    A()\n    {\n        cout<<\"\
    Constructor\\n\";\n    }\n    ~A()\n    {\n        cout<<\"Destructor\\n\";\n\
    \    }\n};\nvoid abc(int);\nvoid main() {\n    try {\n        abc(-1);\n    }\n\
    \    catch(char * s)\n    {\n        cout<<s<<endl;\n    }\n    return 0;\n}\n\
    \nvoid abc(int p) {\n    A * Aptr = new A[2];\n    if(p<0)\n        throw \"Invalid\
    \ argument to abc(\");\n}\n```\n\nOutput\nConstructor\nConstructor\nInvalid argument\
    \ to abc()\n\nIn Listing 11.15, the stack is unwound, memory occupied by the pointer\
    \ Aptr in abc() function gets destroyed. However, the memory block at which the\
    \ pointer points remains locked up. (This is evident from the fact that the destructor\
    \ was not called for the objects created in the heap.)"
