    \ generated and used\nX<int> intObj02;               //no definition generated\n\
    ```\n\nAs in the case of non-function member templates, member functions of class\
    \ templates\nare also defined in the header files themselves.\nThe section on\
    \ Standard Template Library, which follows this section, has many instructive\n\
    and practical examples of built-in class templates that are provided by all standard\
    \ C++\nclasses. Before moving to that section, let us have a look at some fine\
