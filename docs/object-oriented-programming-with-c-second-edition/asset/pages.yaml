- pgno: 19
  md: "# Object-Oriented Programming with C++\n\nIn the procedure-oriented programming\
    \ system, procedures are dissociated from data and are not part of it. Instead,\
    \ they receive structure variables or their addresses and work upon them. The\
    \ code design is centered around procedures. While this may sound obvious, the\
    \ programming pattern has its drawbacks.\n\nThe drawback with this programming\
    \ pattern is that the data is not secure. It can be manipulated by any procedure.\
    \ Associated functions that were designed by the library programmer do not have\
    \ the exclusive rights to work upon the data. They are not a part of the structure\
    \ definition itself. Let us see why this is a problem.\n\nSuppose the library\
    \ programmer has defined a structure and its associated functions as described\
    \ above. Further, in order to perfect his/her creation, he/she rigorously tested\
    \ the associated functions by calling them from small applications. Despite his/her\
    \ efforts, he/she can ensure that an application that uses the structure will\
    \ be bug free. The application program might modify structure variables, not by\
    \ the associated function she has created, but by some code inadvertently in the\
    \ application itself. Compilers that implement the procedure-oriented programming\
    \ system prevent unauthorized functions from accessing/manipulating structure\
    \ variables.\n\nNow, let us look at the situation from the programmer's point\
    \ of view. Consider an application of 25,000 lines (common in the real programming\
    \ world), in which variables of this structure have been used extensively. During\
    \ testing, it is found that the date being represented by one of these variables\
    \ has 29th February 1999! The faulty piece of code that is causing this bug can\
    \ be anywhere in the program. Therefore, debugging will involve a visual inspection\
    \ of the entire code (of 25000 lines!) and will be limited to the associated functions\
    \ only.\n\nThe situation becomes especially grave if the execution of the code\
    \ that is likely to corrupt the data is conditional. For example,\n\n```\nif(<some\
    \ condition>n  d.m++; // d is a variable of date structure... d.m may\n  //become\
    \ 13!)\n```\n\nThe condition under which the bug-infected code may arise during\
    \ testing. While distributing his/her application, the application programmer\
    \ cannot be sure that it will run successfully. Moreover, every new piece of code\
    \ that accesses structure variables will have to be inspected and tested to ensure\
    \ that it does not corrupt the members of the structure. After all, compilers\
    \ that implement procedure-oriented programming systems do not prevent unauthorized\
    \ functions from accessing/manipulating structure variables.\n\nLet us think of\
    \ a compiler that enables the library programmer to assign exclusive rights to\
    \ the associated functions for accessing the data members of the corresponding\
    \ structure. Here, our problem is solved. If a function is not one of the intended\
    \ functions accesses the data members of a structure variable, a compile-time\
    \ error will occur. To ensure a successful compile of his/her application, the\
    \ application programmer will be forced to remove those statements that access\
    \ data members of structure variables. Thus, the application that arises out of\
    \ a successful compile will be the piece of code that is free of any unauthorized\
    \ access to the data members of the structure variables therein. Consequently,\
    \ if a runtime-time error occurs, attention can be focused on the associated library\
    \ functions.\n\nIt is the lack of data security of procedure-oriented programming\
    \ systems that led to object-oriented programming systems (OOPS). This new system\
    \ of programming is the subject of our next discussion."
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.3 Object-Oriented Programming Systems


    In OOP, we try to model real-world objects. But, what are real-world objects?
    Most real-world objects have internal parts and interfaces that enable us to operate
    them. These interfaces perfectly manipulate the internal parts of the objects.
    They also have the exclusive rights to do so.


    Let us understand this concept with the help of an example. Take the case of a
    simple LCD projector (a real-world object). It has a fan and a lamp. There are
    two switches—one to operate the fan and the other to operate the lamp. However,
    the operation of these switches is necessarily governed by rules. If the switch
    is switched on, the fan will automatically switch itself on. Otherwise, the LCD
    projector will get damaged. For the same reason, the lamp will automatically get
    switched off if the fan is switched off. In order to cater to these conditions,
    the switches are suitably linked with each other. Further, this interface has
    the exclusive rights to operate the lamp and fan.


    This, in fact, is a common characteristic of all real-world objects. If a perfect
    interface is required to work it will also have exclusive rights to do so.


    Coming to C++ programming, we notice a resemblance to the observed behaviour of
    the LCD and the desired behaviour of data structure''s variables. In OOP, with
    the help of a new programming construct and keywords, associated functions of
    the data structure can be given exclusive rights to work upon its variables. In
    other words, all other pieces of code can be prevented from accessing the data
    members of the variables of this structure.


    Compilers that implement OOP enable data security by diligently enforcing this
    prohibition by throwing compile-time errors against pieces of code that violate
    the prohibition. This prohibition, if enforced, will make structure variables
    behave like real-world objects. Associated functions that are defined to perfectly
    manipulate variables can be given exclusive rights to do so.


    There is still another characteristic of real-world objects—a guaranteed initialization
    of data. After all, when you connect the LCD projector to the mains, it does not
    start up in an invalid state (fan off and lamp on). By default, both the fan and
    the lamp are off or both on. Users of the LCD projector need not do this explicitly.
    The same characteristic is found in all real-world objects.


    Programming languages that implement OOP enable library programmers to incorporate
    this characteristic of real-world objects into structure variables. Library programmers
    can ensure a guaranteed initialization of data members of structure to the desired
    values. For this, application programmers do not need to write code explicitly.


    Two features are incidental to OOP: they:


    +   - Inheritance

    - Polymorphism


    Inheritance allows one to inherit the characteristics of structures, a variable
    of the new structure will contain data members mentioned in the new structure''s
    definition. However, because of inheritance, it will also contain data members
    in the existing structure''s definition from which the new structure has inherited


    Further, associated functions of the new structure can work upon a variable of
    the new structure. For this, the address/name of a variable of the new structure
    is passed to the associated functions of the new structure. Again, as a result
    of inheritance, associated functions of the existing structure from which the
    new structure has inherited will also be able to work upon'
