    \ a constant operator of the correct type as a leading formal argument to the\
    \ function on its right. For example, if the class name is Distance, as in the\
    \ above case, the compiler inserts a pointer of type Distance * const as a leading\
    \ formal argument to the function on its right.\n\n+   4. It passes the address\
