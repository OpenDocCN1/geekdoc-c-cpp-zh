    \ have access rights to each other’s private data members. They can do so if they\
    \ are friends to each other.\n\n# Summary\n\nClasses have both member data and\
    \ member functions. Member functions can have exclusive rights to access data\
    \ members. Member functions and member data can be private, protected, or public.\
    \ The struct keyword has been redefined in C++. Apart from member data, structures\
