  md: '# 2


    # Classes and Objects


    The previous chapter refreshed reader''s knowledge of the structure construct
    provided by C language—its use and usage. It also dealt with a critical analysis
    of structures along with their pitfalls and limitations. The reader was made aware
    of a strong need for data security and for a guaranteed initialization of data
    structures that do not provide.


    This chapter is a logical continuation to the previous one. It begins with a thorough
    explanation of the class construct of C++ and the ways by which it fulfills the
    above-mentioned needs. Superiority of the class construct of C++ over the structure
    of C language is emphasized in this chapter.


    This chapter also deals with how classes enable the library programmer to provide
    exclusive rights to the associated functions. A prominent place in this chapter
    is. This description covers:


    +   * Overloaded member functions

    * Default values for the arguments of member functions

    * Inline member functions

    * Constant member functions

    * Mutable data members

    * Friend functions and friend classes

    * Static members


    A section in this chapter is devoted to namespaces. They enable the C++ programmer
    to prevent pollution of the global namespace that leads to clashes.


    Example code to tackle arrays of objects and arrays inside objects form the penultimate
    portion of this chapter.


    The chapter ends with an analysis on nested classes—their need and use.


    # 2.1 Introduction to Classes and Objects


    Classes are to C++ what structures are to C. Both the library programmer a means
    to create data types.


    Let briefly recapitulate the issues faced while programming in C described in
    the previous chapter. In C, the library programmer creates structures. He/she
    provides a set of tested bug-free functions that correctly manipulate the data
    members of structure variables.


    The Date structure and its accompanying functions may be perfect. However, there
    is absolutely no guarantee that the client programs will use only these functions
    to manipulate the members of variables of the structure. See Listing 2.1.'
