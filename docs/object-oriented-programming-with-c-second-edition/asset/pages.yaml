  md: '# Introduction to C++


    Therefore, erroneous results will be obtained during run time as the output of
    Listing 1.23 clearly shows.


    Since the C++ compiler necessitates prototyping, it will report an error against
    the function call because no prototype has been provided to resolve the function
    call. Again, if the correct prototype is provided, the compiler will report an
    error this time the function call does not match the prototype. The compiler will
    not be able to convert a struct to an integer. Thus, function prototyping guarantees
    protection from errors arising out of *incorrect function calls*.


    What happens if the function prototype and the function call do not match? Such
    a situation cannot arise. Both the function prototype and the function definition
    are created by the same person, that is, the library programmer. The library programmer
    puts the function''s prototype in a header file/she provides the function definition
    in his application file where the function is called. He/she creates an object
    file from this application program file and links this object to get an executable
    file.


    The function''s prototype also tells the compiler that the add() function accepts
    two parameters. If the program provides such parameters, the prototype enables
    the compiler to detect the error. A compiler that does not enforce prototyping
    will allow a function call in an incorrect number and/type of parameters have
    been passed. Runtime errors will arise if in the following case.


    Finally, function prototyping produces automatic-type conversion wherever appropriate.
    If the cases do not enforce prototyping, a function expects an integer-type value
    (assuming integers occupy four bytes) but a value of double (assuming doubles
    occupy eight bytes) is wrongly passed. During run time, only the first four bytes
    of the passed bytes will be extracted. This is obviously undesirable. However,
    the C++ compiler automatically converts the double-type value into an integer
    type. This is because it inevitably encounters the prototype before encountering
    the function call and therefore knows that the function expects an integer-type
    value. However, it must be remembered that such automatic-type conversions by
    function prototyping occur only when it makes sense. For example, the compiler
    will prevent an attempted conversion from a structure type to integer type.


    Nevertheless, can the same benefits not be realized without prototyping? Is it
    possible for the compiler to simply scan the source of the code and find out how
    the function has been defined? There are two reasons why this solution is inappropriate:


    +   - It is inefficient. The compiler will have to suspend the compilation of
    the line containing the function call and search the rest of the file.


    +   - Most of the function definition is not contained in the file where it is
    called. It is usually contained in a library.


    Such compile-time checking for prototypes is known as *static-type-checking*.


