  md: "An interesting point to be noted is that a pointer of the base class points\
    \ at a dynamically created object of the derived class and then deletes the memory\
    \ occupied by the object, the entire block of memory is deleted. In other words,\
    \ if the total size of the static data members of the base class is 'x' and the\
    \ total size of the non-static data members of the derived class is 'y', then\
    \ the block of size 'x+y' is deleted. It is irrespective of whether the base class\
    \ is virtual or not.\n\n# 6.5.2 Virtual Constructors\n\nFirst, let us understand\
    \ that constructors cannot be virtual. Declaring a constructor as virtual results\
    \ in a compile-time error. Why? Consider a class A, and a class B that is derived\
    \ from A. If the constructor of class A is virtual, then in the following statement\n\
    \n```\n* p = new B;\n```\n\nthe constructor of class B alone will be called. The\
    \ constructor of class A will not be called. This can lead to trouble. What will\
    \ happen if class A has a pointer that the class constructor correctly initializes?\
    \ Since the constructor is not called, a rogue pointer will result.\n\nHowever,\
    \ the need to construct virtually arises very frequently while programming in\
    \ C++. Let us consider the function in the following lines of code.\n\n```\nvoid\
    \ abc(A * p)           //A is a class\n{\n    //deletion of abc() function\n}\n\
    ```\n\nFor reasons that will be listed later, an exact copy of the object at which\
    \ 'p' points is required within the 'abc()' function. This means that another\
    \ object has the same values as the object at which 'p' points needs to be created\
    \ within the 'abc()' function. Calling the copy constructor to serve the purpose\
    \ (Listing 6.22).\n\nListing 6.22 Trying to clone using copy constructor\n* q\
    \ = new A(*p);\nA A1(*p);\n\nThis work will work if the designer of class A has\
    \ correctly defined the copy constructor and if 'p' points at an object of class\
    \ A and not at an object of a class that is derived directly or indirectly from\
    \ class A. If 'p' points at an object of class A that is derived directly or indirectly\
    \ from class A, the call to the copy constructor as mentioned above will merely\
    \ create an object of class A. The data members of this object will have the same\
    \ values as the corresponding data members of the object at which 'p' points.\
    \ Nevertheless, it will not be of the type (it will be smaller in size with less\
    \ data members).\n\nHow can this problem be solved? If the designer of class A\
    \ suspects and needs the need to create copies he/she will define a clone function\
    \ to do so. Such a function can be defined in Listing 6.23.\n\n# Listing 6.23\
    \ A clone function in the base class\n\n```\nclass A\n{\n* this\n```"
