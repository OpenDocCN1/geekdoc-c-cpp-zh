  md: '# Appendix E: Glossary 453


    **throw** A keyword in C++ that allows the library programmer to throw an exception
    whenever an invalid condition is encountered that the library code itself. *(see
    also exception handling, try, throw)


    **Trees**, unlike lists, stacks, and queues, do not have a linear structure. In
    a tree, each of the nodes may be connected to more than one node.


    **try** A keyword in C++ that allows a client to place calls to functions that
    are likely to throw exceptions. *(see also exception handling, try, throw)


    **typedef Operator** An operator that enables us to determine the type of object
    at which a pointer points.


    **Virtual Base** A base class that is derived by using the virtual keyword while
    declaring the derived class. If a class derives from two classes that in turn
    inherit from a virtual base class, the final derived class gets only one copy
    of the features of the virtual base class.


    **Virtual Function** A class member function can be declared as a virtual function
    by prefixing it with the virtual keyword. Virtual functions enable dynamic polymorphism.
    If a virtual function is overridden in a derived class type that points at an
    object of the same derived class and not of the base class. *(see also Dynamic
    Binding, Dynamic Polymorphism, Late Binding)


    **Zero-argument Constructor** A constructor that does not take any arguments is
    called a zero-argument constructor. The constructor that is created by default
    by the compiler is also a zero-argument constructor. Therefore, the two zero-argument
    constructor and default constructor are used interchangeably. *(see also'
