    # Output


    A

    A


    From our recent study we know that the A::show() function will be called against
    both of the classes in the main() function of Listing 6.4.

    Now let take stock of the situation. The library programmer has defined the following:


    +   * The class A

    * The show() function of class A

    * The class X

    * The abc() function of class X


    The definitions of the A::show() and X::abc() functions are final and have been
    put in libraries.

    It is expected that a class will get derived from class A. The derived class may
    override the show() function of class A. The overriding function will add the
    extra code that is relevant to the derived class. To complete the picture, it
    will also call back the overridden function A::show() which will successively
    refined by the overriding functions of the derived classes.


    However, as Listing 6.4 shows, the address of an derived class has so far ineffective.
    It is desirable that the address of an object of the derived class be passed to
    the X::abc() function, then the B::show() function should be called (see Listing
    6.4). If this happens, the same X::abc() function will prove irrespective of the
    type of object address is being passed to it. Unfortunately, an extension of the
    class hierarchy has so remained elusive.


    We must realize that derived classes such as class B may be defined after much
    functions such as X::abc() have been defined.


    Moreover, the function X::abc() should work well equally whether the address of
    an object of the base class A is passed as a parameter to or the address of an
    object of any of the derived classes is passed.


    In the present situation, it appears necessary to redefine the X::abc() function
    corresponding to each derived class of A. That, the X::abc (A *) should be copied
    and redefined with a pointer of the derived class as a formal argument. For example,
    X::abc (B *), etc. This is certainly impossible because the definition of the
    X::abc() function will be in some library that is inaccessible to the programmer
    who is defining the derived classes. It is also extremely cumbersome to redefine
    the X::abc() function for each of the derived classes. This acaba goes against
    the principles of code reusability.


    Thus, it proves impossible to extend an existing class hierarchy. Function overriding
    does not produce the desired effects. Virtual functions solve this problem.


    # 6.2 Virtual Functions


    Virtual functions provide one of the most useful and powerful features of C++
    called dynamic polymorphism.'
