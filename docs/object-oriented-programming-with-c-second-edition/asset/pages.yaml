  md: "# Operator Overloading, Type Conversion, New Style Casts, and RTTI 26\n\n```\n\
    void main()\n{\n    B* Bptr01 = new B;\n    B* Bptr02 = new B;\n    Bptr02->set(20);\n\
    \    cout<<Bptr02->get()<<endl;\n    Bptr01->set(10)<<endl;\n    cout<<Bptr02->get()<<endl;\n\
    }\n/*End of Main.cpp*/\n```\n\n# Output\n2\n10\n\nAfter the first two statements\
    \ in Listing 8.52 execute, 'Bptr01' will point at the first byte of the memory\
    \ pool and 'Bptr02' will point at the fifth. The third statement writes 20 into\
    \ the block of bytes from the fifth byte to the eighth byte. However, the fifth\
    \ statement writes '10' into the same memory block!\n\nIn order to neutralize\
    \ this effect of inheritance, the size of memory block being targeted for allocation\
    \ or deallocation should be compared with the size of the class for which the\
    \ operator is overloaded. If these two do not match, the global new or the global\
    \ delete operator should be called (see Listing 8.53).\n\n+   **Listing 8.53**\
    \ Preventing the ill effects of the new and delete operators getting inherited\n\
    \n```\nvoid* A::operator new(const size_t size)\n{\n    if(size != sizeof(class\
    \ A)) //true if derived class type\n        //passed as parameter\n    return\
    \ ::operator new(size);\n    //rest of the code\n}\n\nvoid A::operator delete(void*\
    \ p, const size_t size)\n{\n    if(size != sizeof(class A)) //true if derived\
    \ class type\n        //passed as parameter\n        ::operator delete(p);\n \
    \       return;\n    //rest of the code\n}\n```\n\n# 8.2.8 Overloading Subscript\
    \ Operator\n\nThe syntax for overloading the subscript operator is shown in Listing\
    \ 8.54.\n\n+   **Listing 8.54** Syntax for overloading the subscript operator\n\
    \n```\nclass <class_name>\n{}\n```"
