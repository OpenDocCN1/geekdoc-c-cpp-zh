    \ addition operator for the class String.\n\n```\nclass String {\n  char *cStr;\n\
    \  long len;\n  public:\n    String operator + (String &);\n};\n```\n\nThe library\
    \ programmer may mistakenly write some statements to modify the value of the implicit\
    \ or the explicit parameter of the String :: operator + () function (see Listing\
    \ 8.10)."
