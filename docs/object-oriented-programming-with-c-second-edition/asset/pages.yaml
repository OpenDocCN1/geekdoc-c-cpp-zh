    \    void setx(const int=0);\n    int getx()const;\n    friend class B;      \
    \        //declaring B as a friend of A\n};\nclass B\n{\n    A * Atr;\npublic:\n\
    \    void Map(A * const);\n    void test_friend(const int);\n};\nvoid B::Map(A\
    \ * const p)\n{\n    Aptr = p;\n}\nvoid B::test_friend(const int i)\n{\n    Aptr->x=i;\
    \              //accessing the private data member\n}\n/*End of friendClass.cpp*/\n\
    ```\n\nAs we can see, member functions of class B are able to access private data\
    \ member of objects the class A although they are not member functions of class\
