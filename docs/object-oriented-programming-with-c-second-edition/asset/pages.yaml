  md: '# # Bibliography


    +   * Stanley B. Lippman and Josee Lajoie (1998), *C++ Primer*, 3rd edn, Pearson
    Education, Asia.

    This book contains an in-depth coverage of a wide range of topics in C++. An excellent
    book for students aiming to gain an insight into the practical aspects of C++.

    * Scott Meyers (1998), *Effective C++, 2nd edn, Pearson Education, Asia.

    This book gives excellent tips and tricks for writing C++. An easy to follow language
    the book inviting to and keeps the reader''s attention riveted till the very end.
    A must read for the practical C++ programmer.

    * Bjarne Stroustrup (1991), *The C++ Programming Language*, 2nd edn, Pearson Education,
    Asia.

    This book has been written by the creator of C++ himself. It is an excellent reference
    book on the C++ language.

    * Jesse Liberty (1998), *C++ Unleashed, Sams.

    This book contains a number of excellent case studies on the practical application
    areas of C++, such as CORBA, Data Structures, COM, and Data Persistence. It is
    highly recommended for the practical C++ programmer.

    * Al Stevens (2003), *Teach Yourself C+*, 7th edn, Wiley Publishing Inc., Indiana.

    This is a good book for learning the fundamentals of C++. Well-arranged topics
    make the book easy to read. A number of advanced concepts have been included in
    this book.

    * Stephen Prata (2001), *C++ Primer Plus, 4th edn*, Sams.

    This is a good book for learning the fundamentals of C++. An easy language and
    plenty of solved examples are the salient features of the book.

    * E. Balagurusamy (1995), *Object Oriented Programming with C+, 2nd edn*, Tata
    McGraw-Hill.

    This is a popular book on C++ in the Indian market. The book gives a good coverage
    of the various aspects of programming in C++.'
