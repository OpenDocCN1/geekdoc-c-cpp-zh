  md: '# Operator Overloading, Type Conversion, New Style Casts, and RTTI


    Operator overloading is an extremely interesting feature of C++. It is not only
    interesting and exciting, but also an essential tool for the class designer. This
    chapter explains the following:


    +   - the concept of operator overloading,

    - the support provided by C++ for operator overloading,

    - the need to overload operators,

    - rules for operator overloading,

    - use and misuse of operator overloading, and

    - pitfalls in operator overloading.


    The initial sections of the chapter give an overview of operator overloading.
    They contain only the skeleton code to illustrate the concepts without burdening
    the reader with the intricacies of the exact code. The exact code to overload
    various operators for classes is dealt with in the later sections.


    Type conversions from basic type to class, from class type to basic type, and
    from one class type to another are also dealt with in this chapter. C++ provides
    the four new style cast operators to replace the use of the old error prone and
    difficult to detect C style casts:


    +   - dynamic_cast

    - static_cast

    - reinterpret_cast

    - const_cast


    RTTI (run time type information) enables the programmer to find the type of object
    at a pointer points during run time. Apart from the dynamic_cast operator, C++
    provides the typeid operator for implementing RTTI.


    The chapter ends with an explanation of new style cast operators and RTTI.


