    ```\nd2 = ++d1;\n```\n\nis interpreted by the compiler\n\n```\nd2 = d1.operator\
    \ ++ ();\n```\n\nLet us envisage that this operator-overloading function should\
    \ first increment ‘iFeet'\nportion of ‘d1’. It would leave the fenches of ‘d1’\
    \ unaltered. Then it would return the\nresult object. With these guidelines in\
    \ mind, the prototype and definition of the operator-\noverloading function will\
