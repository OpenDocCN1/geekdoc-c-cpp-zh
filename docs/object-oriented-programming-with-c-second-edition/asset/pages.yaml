    an existing file. The difference between the two is that while the file ios::ate
    allows you to rewind the put pointer and modify the existing contents of the file,
    the file ios::app does not allow. In other words, if the file is using ios::app
    flag, an attempt to use the seekp() function for rewinding the put pointer will
    fail. The put pointer would continue to point at the end of the file. As bytes
    are appended to the file, the put pointer, as already mentioned, moves forward.
