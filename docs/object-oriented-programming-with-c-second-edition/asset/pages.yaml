    # 5.5 Protected Access Specifier


    Apart from the public and private access specifiers, there is a third access modifier
    in C++ known as protected. Protected members are inaccessible to non-member functions.
    However, they are accessible to the member functions of their own class and to
    member functions of the derived classes. Listing 5.18 along with its accompanying
    comments illustrates this.


    +   Listing 5.18 Accessing protected members


    ```

    /*Beginning of A.h*/

    class A

    {

    private:

    int x;

    protected:

    int y;

    public:

    int z;

    }

