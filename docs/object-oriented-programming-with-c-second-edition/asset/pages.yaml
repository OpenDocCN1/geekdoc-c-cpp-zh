    However, operator overloading resources becomes mandatory under the following
    circumstances:


    +   * Objects of the class acquire resources dynamically during run time and no
    objects should share the same copy of the resource.

    * Objects of the class acquire some resources dynamically during run time and
    no two objects should share even different copies of the resource.

    * Objects need to be passed as parameters in function templates and the operators
    used on template class objects within the template functions should work in the
    same way as objects of class.

    * The default action of the dynamic memory management operators (new and delete)
    are unsuitable for the class being designed.


    +   * Change in the implementation of the class forces an undesirable change in
    its interface in turn necessitating the rewriting and recompiling of the application
    programs.

    * Overloading provides better readability of code. Although this is a somewhat
    weak reason, it, nevertheless, is a factor that can be considered. The statement


    ```

    o2 = ++o1;

    ```


    is more readable than say a statement such as


    ```

    o2 = o1.pre_fix_increment();

    ```


    Let us understand these circumstances one by one. For understanding the first
