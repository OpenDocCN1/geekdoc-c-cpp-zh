  md: '# Object-Oriented Programming with C++


    ```

    A A1; //zero-argument/default constructor called

    /*

    remaining definition of abc()

    */

    return A1;

    }

    A2=abc(); //copy constructor called

    ```


    Once more, the copy constructor is called for ''A2'' while ''A1'' is passed as
    a parameter to the copy constructor.


    The prototype and the definition of the default copy constructor defined by the
    compiler are as follows:


    ```

    class A {

    public:

    A(&A); //the default copy constructor

    }

    A::A(&A AObjj) //the default copy constructor

    {

    *this=AObjj; //copies the passed object into the invoking

    //object

    ```


    As obvious, the default copy constructor does exactly what it is supposed to do—it
    copies. The statement


    ```

    A2=A1;

    ```


    is converted as follows:


    ```

    A A2; //memory allocated for A2

    A2.A(A1); //copy constructor is called for A2 and A1

    //passed as a parameter to it

    ```


    This last statement is transformed to


    ```

    A(&A2,A1); //see the section on ''this'' pointer in Chapter 2

    ```


    When the statement executes, ''AObj'' (the formal argument) whereas this pointer
    points to ''A2'' (the invoking object). Similarly, the other statements where
    the object is created as a formal argument or returned from a function can also
    be explained.


    But why the compiler create the formal argument of the default copy constructor
    as a reference? And when the compiler defines a copy constructor in the expected
    way, then why should we define one on our own? Both questions are answered now.


    First, let us find out which objects are passed by reference to the copy constructor.
    Suppose formal argument (''AObj'') of the copy constructor is not a reference.
    Now, suppose the following statement executes.


    ```

    A2=A1;

    ```


    The copy constructor will be called for ''A2'' and ''A1'' will be passed as a
    parameter to it. Then the copy constructor will be called for ''AObj'' and ''A1''
