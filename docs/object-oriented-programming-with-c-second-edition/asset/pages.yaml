    to call some functions of the SingleLinkedList class with respect to objects of
    the Stack class, there are some function calls that we will like to be disallowed.
    For example, a user program of the Stack class may call the appendNode() function
    as follows stack1 is an object of the Stack class):

    stack1.appendNode(10);


    We will not allow the above call to compile. This is because the... Inheriting
    privately makes all public functions of the base class private in the derived
    class and therefore causes statements like the one above to compile-time errors.


    As we can see, inheriting privately prevents one problem for us, but it leads
    to another. While it prevents unwanted functions of the base class, it prevents
    calls to the wanted functions too! How can this problem be solved? The problem
    can be solved by defining functions in the derived class that internally calls
    the wanted functions of the base class. The implementation of the Stack class
    (Listing 9.24) shows how this can be done. So, let us have a look at it.


