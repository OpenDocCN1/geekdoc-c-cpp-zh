  md: "# Virtual Functions and Dynamic Polymorphism 163\n\n# Listing 6.13 Giving blank\
    \ definition to undefinable virtual function\n\n```\nclass Shape {\n  public:\n\
    \    virtual void rotate();\n};\n\nvoid shape::rotate() {\n  //null definition!\n\
    }\n\n```\n\n+   It has only a few lines of code, which do not really give it a\
    \ complete definition. The function is such that it cannot be called in isolation.\
    \ It can only be called indirectly through the derived class’s overriding function\
    \ that has the necessary code to complete the definition. C++ should provide some\
    \ mechanism to the library programmer to enforce the desired result. Pure virtual\
    \ functions provide this mechanism. If one more function is declared as a pure\
    \ virtual, then the corresponding class becomes an Abstract Base Class (ABC in\
    \ short). A function is declared as a pure virtual function by prefixing its prototype\
    \ with the virtual keyword as before suffixing it with an ‘equal to’ sign and\
    \ then by declaring a pure virtual function\n\n```\nvirtual<return type><function\
    \ name>(formal arguments)=0;\n```\n\nListing 6.14 illustrates this.\n\n# Listing\
    \ 6.14 Defining a pure virtual function\n\n```\n/*Beginning of A.h*/\nclass A\
    \ {\n  virtual void abc()=0;\n  /*\n  rest of the class A\n  */\n};\n/*End of\
    \ A.h*/\n```\n\nAn abstract base class cannot be instantiated, that is, objects\
    \ of an abstract base class cannot be declared. Compile-time errors defeat attempts\
    \ to do so.\n\nA A; //error\n\nThe derived class must override all pure functions\
    \ of the base class or get branded as an ABC by the compiler. For example, any\
    \ class that derives from class A in Listing 6.14 must override the A::abc() function\
    \ to become a concrete or instiable class.\nWhat is the utility of an ABC in its\
    \ use as an interface. The library programmer defines the ABC and some generic\
    \ functions that implement the general flow of a algorithm without considering\
    \ the exact data type on which they will work. An example to illustrate this point\
    \ follows.\n\nLet us consider an abstract class Shape (see Listing 6.15)."
