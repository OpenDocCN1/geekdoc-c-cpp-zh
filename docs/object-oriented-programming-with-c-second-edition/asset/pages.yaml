    Like C++, Java also supports inheritance. However, Java does not support multiple
    inheritance. This is explained in the section ‘Differences between C++ and Java’.

    - **Static polymorphism**: Like C++, Java supports static polymorphism. Two functions
    with different signatures can have the same name.

    - **Dynamic polymorphism**: Dynamic polymorphism is supported in both C++ and
    Java. If a member function of the base class has been overridden in the derived
    class and it is called for a base reference that refers to a derived class object,
    then the member function of the derived class gets called.

    - **Overriding member functions of base in derived classes**: Base class functions
    can be overridden in the derived class except when the base function has been
    specified as final. This exceptional case has been explained in the section ‘Differences
    between C++ and Java’.


