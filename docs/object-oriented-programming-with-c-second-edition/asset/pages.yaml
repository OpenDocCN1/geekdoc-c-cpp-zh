  md: "# Inheritance 121\n\nclass and adds only the special data members and the code\
    \ to handle these additional data members in the derived class.\n\n# 5.1.4 Base\
    \ Class and Derived Class Objects\n\nNow, many students of C++ may start believing\
    \ that objects of the derived class inherit from objects of the base class. This\
    \ is incorrect as an object of the derived class is not at all related to another\
    \ simultaneously existing object of the base class.\n\nAn object of class A (say\
    \ 'A1') will occupy four bytes containing only 'x'. Whereas an object of class\
    \ B (say 'B1') will occupy a different block of eight bytes containing both 'x'\
    \ and 'y', as shown in Figure 5.2. (As per the definitions of classes A and B\
    \ given in Listing 5.1.)\n\n![](img/5bfa77b13fdaa376725789bb8c00ee79_134_0.png)\n\
    \nFigure 5.2 Memory layout of base class and derived class object\n\n# 5.1.5 Accessing\
    \ Members of the Base Class in the Derived Class\n\nOnly public members of base\
    \ class can be accessed in the functions of derived class (protected members of\
    \ the base class can also be accessed; we shall discourage protected members later).\
    \ But, private members of the base class cannot be accessed.\n\nSuppose in the\
    \ B::setY() function we write\n\n```\nx=y;\n```\n\nthe compiler will report an\
    \ error stating that private members of the base class cannot be accessed. (In\
    \ case we are trying to access 'x' in a member function of the derived class.\
    \ But 'x' is a private member of the base class.)\n\nBut we can access A::setX()\
    \ and A::getX() in the member functions of the derived class because they are\
    \ public members of the base class. Private members of the base class remain private\
    \ with respect to member functions of the derived class. The following lines of\
    \ code demonstrate this:\n\n```\nvoid B::setY(const int q)\n{\n    y=q;\n    setX(y);\
    \        //x=y\n}\n```\n\nThis is it all. C++ prevents us from accessing private\
    \ members of the base class in member functions of the derived class to fully\
    \ implement data safety. After all, the base class provider made some members\
    \ of the base class private because he/she wanted only"
