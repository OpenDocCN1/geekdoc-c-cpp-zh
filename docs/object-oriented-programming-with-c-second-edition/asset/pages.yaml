  md: '# Appendix E


    # Glossary


    Abstract Base A class that has at least one pure virtual function. Abstract base
    classes cannot be instantiated. They only serve as base classes for other classes
    to derive from (see also virtual functions)


    Class Template A template for a class definition. Data type of data members is
    undefined.


    Arrow Operator (->) An operator to access data members of an object or call member
    functions through a pointer that points at the object.


    Clone Functions A function that creates an object of the same type at which a
    base pointer points and returns its address.


    Base Class A class from which another class inherits. (see also inheritance)


    Command Line Arguments Command line arguments are values that are passed to executables
    when they run from the command line.


    Binary Search Tree A binary tree is a special form of binary tree. In a binary
    search tree, any value contained in its left child is less than the value in the
    node and the value contained in the node is less than the value contained in its
    right.


    const_cast Operator This operator is used to cast the constancy of a variable.


    Binary Tree A binary tree in which each node is linked to a maximum of 2 nodes.


    Constant Member Functions A member function that can only read the value of data
    members but not modify them.


    Call by Reference The formal argument of the called function is of reference type.
    (see also reference variables)


    Constructor A member function that is called automatically with respect to each
    object at the time of its creation. It is used to guarantee the initialization
    of data members of the object. (see also Initialization of Data)


    Call by Value The formal argument of the called function is of non-reference type.
    (see also reference variables)


    Copy Constructor A constructor that is called whenever an object is created and
    simultaneously equated to another object. It is called with respect to the object
    that is getting while the existing object is passed as a parameter to it.


    catch The keyword used to catch a exception. (see also exception handling, try,
    throw)


    Data Member A member variable that would contain the values of class objects.
    Each object of the class has its own copy of the data member.


    Child Class A class that inherits from another class. (see also inheritance)


    Data Security An object-oriented feature that refers to preventing unauthorized
    functions from accessing data.


    Class A language construct provided by C++ that enables the implementation of
    object-oriented concepts like data security, guaranteed initialization of data,
    data abstraction, hiding, etc. A class has member functions and member data.


    Default Constructor The constructor that is defined by default by the compiler
    if we not take parameters. (see also Zero-argument Constructor)'
