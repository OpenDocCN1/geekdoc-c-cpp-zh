    }\n```\n\nClearly 'a' and 'b' should not be the negative of each other, else it\
    \ would result in division by zero. Every effort should be put in to prevent the\
    \ evaluation of the return expression and the consequent run-time error if 'a'\
    \ and 'b' are the negative of each other. There are three traditional C-style\
    \ solutions to this.\n\n+   - Terminate the program\n- Check the parameters before\
    \ function call\n- Return a value representing an error\n\nThese methods are discussed\
    \ below.\n\n# 11.2.1 Terminate the Program\n\nLet us look at this solution (Listing\
