  md: "# Object-Oriented Programming with C++\n\nfirst of all the value of the VPTR\
    \ of the object is read. The address of the called function\nfrom the corresponding\
    \ VTBL is obtained. Finally, the function is called through the address\nthus\
    \ obtained.\n\nNow it is obvious how the virtual functions works. If a base class\
    \ pointer points at (or a base\nclass reference refers to) an object of the derived\
    \ class and a virtual function is called with\nrespect to it, then the derived\
    \ class function will be called if it overrides the base class virtual\nfunction.\
    \ If the base class virtual function is not overridden, then it will be called.\n\
    \nNote that it is the table size that varies from class to class (for each class\
    \ there is only\none VTBL). The size of the object does not vary. The size of\
    \ the objects with classes\nvirtual functions increases by four bytes due to the\
    \ presence of the additional\npointer (VPTR).\n\nWe might wonder as to why C++\
    \ supports two types of binding—static and dynamic.\nWhy does it not support dynamic\
    \ binding? In other words, why does it not declare all\nfunctions virtual by default?\
    \ The reason is that virtual functions entail a runtime-cost in the\nform of shape\
    \ that is wasted for creating the VTBL and embedding the VPTR in each and\nvery\
    \ object of the base/derived class. Time is also lost in searching the VTBL for\
    \ the\naddress. If none of the member functions of a class will be overridden,\
    \ then making\nthem virtual will unnecessarily increase the above cost. Therefore,\
    \ C++ allows the programmer\nto decide whether the member function has be declared\
    \ as virtual or not.\n\n# 6.4 Pure Virtual Functions\n\nFrom Section 6.3, we already\
    \ know that it is optional to override virtual functions. A library\nprogrammer\
    \ declares a member function virtual if he/she expects overriding and wants to\\\
    make the override effective.\n\nBut there are cases where the library programmer\
    \ would like to enforce an override of\nthe base class virtual functions. Such\
    \ a case is now described. A call to a base class virtual\nfunction has been embedded\
    \ somewhere in the code with respect to a pointer or reference of\nbase class\
    \ type. For example, a class A has a virtual function abc() that is called from\n\
    class xyz() of class X. See Listing 6.12.\n\n> Listing 6.12 Using virtual functions\n\
    \n```\n/* Beginning of X.cpp*/\n#include \"X.h\"\nvoid X::xyz(A * p)\n{\n  //some\
    \ lines of (complicated) code\n  p->abc();\n  //some lines of (complicated) code\n\
    }\n/*End of X.cpp*/\n```\n\nNow, A::abc() function may satisfy either of the following\
    \ descriptions.\n\n+   It has no meaningful definition with respect to the base\
    \ class. For example, a function to\nrotate the shape cannot be defined in the\
    \ class Shape itself. The algorithm to rotate the\nshape is not known since the\
    \ shape itself is not known. See Listing 6.13."
