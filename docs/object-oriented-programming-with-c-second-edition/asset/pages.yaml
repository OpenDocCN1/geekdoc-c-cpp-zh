    \ as well as the data members of the derived class. Thus, the size of an object\
    \ of the derived class will be equal to the sum of the data members of the base\
    \ class plus the sum of the data members of the derived class.\n\nInheritance\
    \ implements an 'is-a' relationship. A derived class is a type of base just like\
    \ an aircraft (derived class) is a type of vehicle (base class). Contrast to this\
    \ composition implements a 'has-a' relationship. A manager class may contain an\
    \ object of another class or a pointer to data structure that contains sets of\
    \ objects of another. Such a class is known as a container class. For example,\
    \ an aircraft has one engine or an array of engines.\n\nAnother example can be\
    \ that a manager class and employee class. A manager (i.e., an object of the class\
    \ manager) is an employee (i.e., an object of the class employee). Nevertheless,\
    \ it has some features that are not possessed by all employees. For example, it\
    \ may have a pointer to an array of employees that report to him. Derived class\
    \ is also a base class (as shown in the following lines of code).\n\n```\nclass\
    \ employee\n{\n    String name;\n    double basic;\n    Date doj;\n    /*\n  \
    \    rest of the class employee\n    */\n}\nclass manager : public employee //manager\
    \ is an employee\n{\n    employee * list;\n    /*\n      rest of the class manager\n\
    \    */\n}\n```\n\nA derived class contains additional data and members and is\
    \ thus a specialization of its base class. Therefore, the process of inheritance\
    \ is also known as specialization.\n\n# 5.1.2 Benefits of Inheritance\n\nThis\
    \ process of adding only the additional data members in the derived class has\
    \ implications. The base class can have a generic common definition. The data\
    \ and functions that are common to more than one class can be put together in\
    \ the base class. While only the special ones can be put in of the derived classes.\
    \ Thus, inheritance is another feature of C++ that enables code reusability.\n\
    \n# 5.1.3 Inheritance in Actual Practice\n\nIn practice, the library programmer\
    \ defines a certain class and its member functions. Another interested programmer,\
    \ in order to create his/her application, inherits from it"
