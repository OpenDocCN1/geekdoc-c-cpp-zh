    When this program runs, first memory for the static data members of classNew gets
    allocated. The static data member NO_OF_OBJECTS stores how many blocks (objects)
    will coexist in this pool. This data member should be static because it contains
    information for the set of objects and is therefore not particular to any specific
    object. The value of this data member should be chosen with care. A memory that
    is too large will waste memory and may prove counterproductive. Large portions
    of the pool may remain unused for long periods or for the entire lifetime of the
    program. A very small memory will necessitate a frequent allocation of more pools,
    slowing down the program. If it is felt that large number of objects will exist
    simultaneously at any given point of time, the value of this variable should be
    kept large, otherwise this value should be small. In case, we have initialized
    NO_OF_OBJECTS to ''5''.


    Next, another static data head is initialized. This pointer points to the next
    available block from the pool. This data member should also be static because
    it will function for the set of objects and will, therefore, not be a part of
    any particular object. Every call to the new operator returns the current value
    of this pointer and increments its value so that it points to the next available
    block in the pool. This pointer has been initialized to NULL for reasons that
