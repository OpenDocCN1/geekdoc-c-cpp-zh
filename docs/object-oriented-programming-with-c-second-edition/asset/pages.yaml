  md: '# Object-Oriented Programming with C++


    # D.3 Analysis


    Now we know the three models that constitute an object-oriented model. This section
    will teach us how we can create a model from the requirement document. The last
    section will teach us how to implement the model.


    # Overview of Analysis


    Requests generated by users, developers, and managers are first collected and
    consolidated. A problem statement is created from this consolidated list. Models
    are built by analyzing the problem statement and by taking inputs from users,
    domain experts, and from the developer''s knowledge of the real world.


    Large models are built up iteratively. A small model to achieve only the core
    requirement is built first. Once the model has been perfected, it is expanded
    to add all ancillary functionalities.


    # Object Modelling


    The steps for object modelling are as follows:


    +   1. Identify classes

    2. Identify associations to classes and aggregations

    3. Add attributes to classes and associations

    4. Combine classes using inheritance

    5. Add operations to classes after constructing the dynamic and functional models


    Classes often appear as nouns in the problem statement.\ Associations often appear
    as verbs or verb phrases.

    Attributes often appear as nouns followed by possessive adjectives. Identify classes
    that share common features and designate them as base classes. Look for nouns
    that appear with different adjectives. The common noun can be modeled as a base
    class whereas each of the nouns with an adjective can be modeled as its derived
    class.


    # Dynamic Modelling


    Briefly, the first step in dynamic modelling is to identify events. Events appear
    as external stimuli and responses. The next step is to summarize permissible event
    sequences for each object with a separate state diagram.


    We can start creating scenarios of typical expectations. All common interactions
    get depicted by scenarios. The next step is to create event trees for each of
    these scenarios. Scan the clauses in the event tree that occur on each object.


    States that an object obtains can be identified from the interval between all
    pairs of events that occur it one after the other. These events and states are
    organized in a state diagram. The resulting set of state diagrams constitutes
    the dynamic model.


    This process can be repeated incrementally for special interactions such as omitted
    inputs, violation of domain constraints, etc. Finally scenarios for error cases
    are prepared. These scenarios are also merged into the state diagram by attaching
    the new event sequence to the existing state as an alternative path.'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# Functional Modelling


    Activities or actions in the state diagrams of classes can be modeled as processes
    on the data flow diagram. Objects and attribute values of an object diagram can
    be modeled as flows on a data flow diagram.


    Parameters of events from the dynamic model appear as input and output values
    of processes. The data flow diagram can be constructed by inserting processes
    between corresponding input and output values.


    Processes in the top-level data flow diagram may be quite complex. Create a simplified
    and detailed lower-level data flow diagram for each process. If this level still
    contains complicated processes, repeat the process until you reach a data flow
    diagram with very simple processes.


    Finally, write a textual description of each lowest-level process. The description
    emphasizes the objective of the process and not how the process would get implemented.
    Identify model actors and internal storage.


    # D.4 System Design


    System design is the high-level strategy for solving a problem and building a
    solution. The system is organized into sub-systems. Sub-systems are allocated
    to hardware and software components. Major conceptual and policy decisions that
    govern the detail for the design are also taken. The overall organization of the
    system is called the system architecture. During system design, overall high-level
    implementation decisions are made. This is followed by similar decisions for successively
    lower levels.


    # Breaking the System into Sub-systems


    A system is divided into sub-systems based on the similarity of services. A service
    is a set of functions that have a common objective.


    Each sub-system provides a well-defined well-abstracted interface. The interface
    can be exchanged with the sub-system. It does not specify how the sub-system is
    implemented internally. Thus, the internal design of each sub-system can be created
    and modified while other sub-systems that interact with it remain unchanged.


    # Layers


    A system can be divided into sub-systems and these sub-systems can be horizontally
    layered on top of another. Each layer is built to provide services to the ones
    above it. Thus each layer provides the basis of designing the one above it. Layers
    are thus strongly coupled.


    # Partitions


    Sub-systems can be vertically placed next to each other as partitions (also see
    Figure D.20). Partitions are independent or weakly-coupled sub-systems.


    A combination of layers and partitions can be used to divide a system.


    We should also identify which activities may execute concurrently and which are
    mutually exclusive. The latter set of activities can be put together in a single
    thread of control.'
