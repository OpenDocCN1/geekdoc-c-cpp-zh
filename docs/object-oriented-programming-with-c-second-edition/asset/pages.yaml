- pgno: 98
  md: "```\n*/\nvoid abc() \n{\nint * IPtr;\nIPtr = new int;\n/*\nrest of the abc()\
    \ function\n*/\n}\n/*End of memleak.cpp*/\n```\n\nThe following statement executes\
    \ from within the abc() function which is called from the main() function.\n\n\
    **Statement:** IPtr = new int;\n\nAs a result, the following scenario emerges.\n\
    \n![](img/5bfa77b13fdaa376725789bb8c00ee79_98_0.png)\n\nThe new operator allocates\
    \ memory in the heap to hold one integer type value. Suppose the block from the\
    \ byte with address 5972 to the byte gets allocated. The new operator returns\
    \ the base address of the block 5972. This value gets stored in IPtr. After abc()\
    \ finishes execution, memory for IPtr is deallocated. But, the memory in the heap\
    \ area remains locked up as an orphan (unreferenced) locked up of memory.\n\n\
    ![](img/5bfa77b13fdaa376725789bb8c00ee79_98_1.png)\n\n**Figure 3.3** Memory leak\n\
    \nAs it can be seen from Figure 3.3, after the abc() function terminates, four\
    \ bytes of memory are lost. They have not been returned to the OS, they remain\
    \ locked up. This is known as a memory leak. If more memory is required, the OS\
    \ will **not** allocate this block of memory. Moreover, this block of memory cannot\
    \ be accessed since the only pointer (IPtr) that was pointing at it has itself\
    \ been removed from the stack.\n\nThis block of memory is no longer of any use\
    \ and can be returned to the OS. A dynamically allocated block of memory can be\
    \ deallocated by passing the pointer pointing to operate as the `delete` operator.\
    \ For example, the following statement should be inserted before the end of the\
    \ abc() function in Listing 3.5.\n\n```\ndelete IPtr;\n```"
