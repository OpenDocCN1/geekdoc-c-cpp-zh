  md: "# Object-Oriented Programming with C++\n\n+   - storing the address of the\
    \ instruction to which the control should jump after the function terminates.\n\
    \nThe C++ inline function provides a solution to this problem. An inline function\
    \ is a function whose code is 'in line' with the rest of the program. That is,\
    \ the compiler replaces the function call with the corresponding function code.\
    \ With inline code, the program does not have to jump to another location to execute\
    \ the code and then jump back. Inline functions, thus, run a little faster than\
    \ regular functions.\n\nHowever, there is a trade-off between memory and speed.\
    \ If multiple copies of the function definition appear in the code repeatedly\
    \ (see Figures 1.1 and 1.2). Thus, the executable program itself becomes so large\
    \ that it occupies a lot of space in the computer's memory during run time. Consequently,\
    \ the program runs slow instead of fast. Thus, inline functions must be chosen\
    \ with care.\n\nFor specifying an inline function, you must:\n\n+   - prefix the\
    \ definition of the function with the inline keyword\n- define the function before\
    \ all functions that call it, that is, define it in the header file itself.\n\n\
    The following listing illustrates the inline technique with the inline cube()\
    \ function that cubes its argument. Note that the entire definition is in one\
    \ line. That is not a necessary condition. But if the definition of a function\
    \ does not fit in one line, the function is probably a poor candidate for an inline\
    \ function.\n\n```\nvoid main()\n{\n    ...\n    double x;\n    x=cube(2);\n \
    \   ...\n    x=cube(4);\n    ...\n    x=cube(10);\n    ...\n}\n```\n\n```\ndouble\
