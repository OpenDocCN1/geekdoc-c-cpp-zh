  md: "```\npublic:\n    virtual A * clone()\n    {\n        return new A*(this);\n\
    \    }\n    /*\n    definition of class A\n*/\n;\n```\n\nClasses that derive from\
    \ class A will similarly define and override this clone function (Listing 6.24).\n\
    \n# Listing 6.24 A clone function in the derived class\n\n```\nclass B : public\
    \ A\npublic:\n    virtual B * clone()\n    {\n        return new B*(this);\n \
    \   }\n    /*\n    definition of class B\n*/\n;\n```\n\nWhenever a clone of the\
    \ object is required (from within the 'abc()' function as described in Listing\
    \ 6.24), the clone function is called (Listing 6.25). The clone object created\
    \ is subsequently destroyed.\n\n# Listing 6.25 Using the clone function\n\n```\n\
    void abc(A * p)\n{\n    ...\n    ...\n    A * q = p->clone();\n    ...\n    ...\n\
    \    delete q;\n}\n```\n\nSince the clone() function is virtual, its correct version\
    \ is called. Thus, if 'p' points at an object of class A, then another object\
    \ of class A itself is created which is an exact copy of the object which 'p'\
    \ is pointing. And, if 'p' points at an object of a class derived from A, another\
    \ object of that same class is created which is an exact copy of the object which\
    \ 'p' is pointing. Then, the abc() function succeeds in obtaining an exact copy\
    \ of the object which 'p' is pointing while being unaware of its type.\n\nSince\
    \ the clone function constructs an object and is also virtual, we sometimes call\
    \ it a virtual constructor! But we must remember that there is actually nothing\
    \ like a virtual constructor.\n\nNow let us discuss the need for the clone function.\
    \ Although there are several examples that highlight this need, the following\
    \ example should suffice."
