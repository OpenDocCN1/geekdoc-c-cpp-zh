    \ returns true. In the second case, the types of the objects being pointed at\
    \ and not the types of the pointers, are compared. Since '*APtr' is of type B,\
    \ the second statement returns false.\n\n# Summary\n\nIn C++, the library programmer\
    \ can provide operators with additional capabilities to operate on objects of\
    \ his/her class. This is known as operator overloading.\nOperators can be overloaded\
    \ by functions whose names composed of the keyword and the symbol of the operator\
    \ being overloaded. These functions may be member functions or friends. Friend\
    \ functions are used when the objects of the class for which the operator is overloaded\
    \ invariably appear on the right-hand side of the operator.\nOperators are overloaded\
    \ to\n\n+   * Neutralize the effects of the functions that are generated by default\
    \ (the 'assignment' operator).\n* To make the operation of the operators more\
    \ efficient (the new and delete operators).\n* To provide capabilities to the\
    \ class so that its objects can be used in predefined templates.\n\nThe rules\
    \ for operator overloading are as follows:\n* New operators cannot be created.\n\
    * Meaning of existing operators cannot be changed.\n* The following operators\
    \ cannot be overloaded:\n:: (scope resolution)\n\n+   . (member selection)\n*\
    \ (member selection through pointer to member)\n?: (conditional operator)\nsizeof\
    \ (finding the size of values and types)\ntypeid (finding the type of object pointed\
    \ at)\n* The following operators can be overloaded member functions alone:\n \
    \ = (Assignment operator)\n  () (Function operator)\n  [] (Subscripting operator)\n\
    \  -> (Pointer-to-member access operator)\n* Number of arguments that an existing\
    \ operator takes cannot be changed.\n* basic type to class type (using a constructor),\n\
    * class type to basic type (using a type conversion operator), and\n* class type\
    \ to class type (using either a constructor or a type conversion)\n* The C++ language\
    \ provides a new set of operators for typecasting. These operators be be instead\
    \ of the highly error-prone method of typecasting provided by the C language."
