    \n# 2.2.6 Friends\n\nA class can have global non-member functions and member functions\
    \ of other classes as friends. Such functions can directly access the private\
    \ data members of objects of the class.\n\n# Friend non-member functions\n\nA\
    \ friend function is a non-member function that has special rights to access private\
    \ data members of any object of the class of whom it is a friend. In this section,\
    \ we will only study those functions that are not member functions of some other\
    \ class.\n\nA friend function is prototyped within the definition of the class\
    \ which it is intended to be a friend. The prototype is prefixed with the keyword\
