  md: "We can notice that the two swap functions are exactly alike except for the\
    \ data type of the variables upon they work. It would be reasonable to expect\
    \ that the C++ language provides us with a facility to write a common function\
    \ that is independent of a data type but which embodies the common algorithm and\
    \ that the C++ language on its creates the actual function and when the need arises.\
    \ Having code at a common place has obvious advantages, namely ease in code development\
    \ and ease in code maintenance.\n\nThis facility is provided in the form of templates.\
    \ The programmer can create a template with some or all variables having unspecified\
    \ data types. Whenever the template is invoked by passing arguments of a certain\
    \ type, the C++ language on its replaces the unspecified type with the type of\
    \ the arguments passed. Such templates can be created for individual functions\
    \ as well as entire classes.\n\n# 10.2 Function Templates\n\nThe syntax for creating\
    \ a template for a generic function is given in Listing 10.3.\n\n+   Listing 10.3\
    \ Syntax for a function template\n\n```\ntemplate <class T, ...>\nreturn_type\
    \ function_name(T arg1, ...)\n{\n    //statements\n}\n```\n\nThe template definition\
    \ begins with the template keyword. This is followed by a list of generic data\
    \ types in angular brackets. Each generic type is prefixed with the class keyword\
    \ and, if the template function works on more than one generic, commas separate\
    \ them. Thereafter, the template function is defined just like an ordinary function.\
    \ The return type comes first. It is followed by the name of the function, which\
    \ in turn is followed by a pair of parentheses enclosing the list of formal arguments\
    \ the function takes. However, there should be at least one formal argument of\
    \ each of the generic types mentioned within the angular brackets.\n\nFor example,\
    \ the template for the function swap can be given in Listing 10.4.\n\n+   Listing\
    \ 10.4 Template for the function swap\n\n```\n/*Beginning of swap.h*/ntemplate\
    \ <class T>\nvoid swap(T & a, T & b)\n{\n    T temp;\n    temp=a;\n    a=b;\n\
    \    b=temp;\n}/*End of swap.h*/\n```\n\nNow, suppose the function swap is called\
    \ by passing two integers. The compiler generates an actual definition for the\
    \ function by replacing each occurrence of T by the keyword int. See Listing 10.5."
