    in the keyboard buffer, which represents the input file in case. The characters
    ‘6’ and ‘5’ that are stored in two bytes represent the number ‘65’ in base 10.
    The input function transforms this representation into base 2 and stores the resultant
    integer value in the four bytes occupied by the target variable.


    A very important and interesting observation can be made. Text mode is suitable
    for console I/O because they are in base 10 format with what we are accustomed
    to. For reasons that will be explained shortly, binary mode is suitable for disk
    I/O.


    # 7.3.4 Note on Opening Disk Files for I/O


    In this section, Section 7, ‘Text and binary input/output’, we would open files
    for writing through the constructor of class ofstream. If the file does not exist,
    it would get created. If it does exist, its contents would be overwritten. For
    producing a different effect—appending or obtaining errors if the file does not—we
    have to apply the techniques that are explained in Sections 7.4 and 7.8. We would
    also open files for reading through the constructor of class ifstream. If the
    file being opened does not exist, a run-time error is produced. The technique
    of handling errors is explained in Section 7.8.


    # 7.4 Text Versus Binary Files


    Now let us talk about text files and binary files.

    In text files, binary data (numeric data that is stored in base 2 format in memory)
    is stored in base 10 format. In binary files, the same binary data is stored in
    the same format (base 2).


    Before proceeding further, let us clear that the files by themselves are neither
    text files nor binary files. It is the mode in which the data is written into
    that defines the nature of the files.


    As we have already learned, when the value of a numeric variable (like integer)
    is output in binary mode, it occupies the same number of bytes in the output file
    as it does in the'
