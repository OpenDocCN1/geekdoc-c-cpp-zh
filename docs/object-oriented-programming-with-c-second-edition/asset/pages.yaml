    \nThe problem this inheritance causes is due to the fact that when the new operator\
    \ is called, the head pointer points to the wrong place. Let us suppose the overloaded\
    \ new operator is overloaded for class A in Listing 8.51 in the way it is overloaded\
    \ for class ClassNew in Listing 8.48. After the new operator executes for the\
    \ first time, the head pointer points four bytes away from the first byte of the\
    \ pool even the derived class type is passed as a parameter to the new operator.\
    \ Thus, when the new operator is called for the second time, the address of the\
    \ fifth byte is returned and not the ninth. The address of the ninth object is\
    \ desired because an object of the class B will occupy eight bytes—four for 'x'\
    \ and four for 'y'. The problem that arises because this can be clearly understood\
    \ from Listing 8.52.\n\n**Listing 8.52** Undesirable effect of operator new and\
    \ delete functions getting inherited\n\n```\n/*Beginning of Main.cpp*/\n#include\"\
    B.h\"\n```"
