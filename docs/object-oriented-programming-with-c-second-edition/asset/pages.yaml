  md: "# Object-Oriented Programming with C++\n\n# 2.2.5 Mutable Data Members\n\n\
    A mutable data member is *never* constant. It can be modified inside constant\
    \ functions also. Prefixing the declaration of a data member with the keyword\
    \ mutable makes it mutable. Listing 2.21 illustrates this.\n\nListing 2.21 Mutable\
    \ data members\n\n```\n/*Beginning of mutable.h*/\nclass A {\n    int x;     \
    \         //non-mutable data member\n    mutable y;         //mutable data member\n\
    public:\n    void abc() const     //a constant member function\n    {\n      \
    \  x++;               //ERROR: cannot modify a non-constant data\n           \
    \                  //member in a constant member function\n        y++;      \
    \         //OK: can modify a mutable data member in a\n                      \
    \       //constant member function\n    }\n    void def()          //a non-constant\
    \ member function\n    {\n        x++;               //OK: can modify a non-constant\
    \ data member\n                             //in a non-constant member function\n\
    \        y++;               //OK: can modify a mutable data member in a\n    \
    \                         //non-constant member function\n    }\nn/*End of mutable.h*/\n\
    ```\n\nWe frequently need a data member that can be modified even for constant\
