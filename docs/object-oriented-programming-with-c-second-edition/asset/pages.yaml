    despite being derived from a friend\n}\n/*End of friendInherit.cpp*/\n```\n\n\
    # 5.2 Base Class and Derived Class Pointers\n\nA base class pointer can point\
    \ at an object of the derived class. However, a derived class cannot point at\
    \ an object of the base class. To be precise, a base class pointer can safely\
    \ point at an object of the derived class without the need for typecasting. But\
    \ a derived class pointer can be made to point at an object of the base class\
    \ only forcibly by typecasting. However, this can cause run-time errors."
