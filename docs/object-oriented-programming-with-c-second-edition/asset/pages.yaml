  md: "member functions of the base class (which he/she has perfected) to access them.\
    \ If member functions of the derived class are allowed to access private members\
    \ of the base class, then one cannot identify all statements in the program that\
    \ access private members of the base class by merely looking at its member and\
    \ friend functions.\n\nWe argue that the existing set of functions of the base\
    \ class is sometimes not enough. We would like to create a derived class that\
    \ supplements the base class by containing those member functions that we are\
