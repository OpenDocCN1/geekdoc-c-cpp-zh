- pgno: 99
  md: "# 86 Object-Oriented Programming with C++\n\nThe foregoing statement is executed\
    \ just before the abc() function terminates. The memory block at which IPtr points\
    \ gets deallocated (it becomes available for the OS). Next, the memory allocated\
    \ for IPtr itself is deallocated. Finally, the function terminates. Thus, memory\
    \ leak is prevented.\n\nWhen the new operator is used, the OS blocks a block of\
    \ memory of the requested size. The OS never allocates this block of memory in\
    \ response to subsequent requests for memory blocks as long as this block of memory\
    \ is not deallocated. When the delete operator is used on the pointer that points\
    \ to this block of memory, the memory gets deallocated, that is, free and made\
    \ available for the OS. In other words, the OS, in subsequent requests for memory\
    \ blocks, may allocate this free block of memory.\n\nA dynamically allocated block\
    \ of memory remaining locked is quite a blessing. The fact that the block of memory\
    \ locked by the code in a function persists even after the function terminates\
    \ is fairly desirable. A called function may allocate a memory block and a pointer\
    \ to the calling function can be made to point at it. Even after the function\
    \ terminates, the dynamically allocated block of memory will remain persistent,\
    \ not unreferenced. Listing 3.6 illustrates this.\n\n+   Listing 3.6 Making a\
    \ dynamically allocated block of memory available to the function\n\n```\nvoid\
    \ abc(int ** p)\n/*\n some complex algorithm\n*/\n*p = new int;\n/*\n rest of\
    \ the abc() function\n*/\nvoid main()\n{\n int *IPtr;\nabc(IPtr);\n/*\n rest of\
    \ the main() function\n*/\n```\n\nIn Listing 3.6, the address of IPtr that is\
    \ local to the calling function (main() function) is passed as a parameter to\
    \ the called function (abc() function). Its value needs to be changed by the abc()\
    \ function. Its address is stored in a double pointer (a pointer to a pointer\
    \ has be a double pointer). A block of memory is allocated and its address is\
    \ stored in IPtr by dereferencing the pointer that points at it. It is our obvious\
    \ desire that the dynamically allocated block of memory persists even after the\
    \ abc() function terminates. After the abc() function terminates, IPtr is a local\
    \ variable in the calling function will point to the dynamically allocated memory.\n\
    \nThe general syntax of the delete operator to deallocate a single block of memory\
    \ is:\n\n```\ndelete <pointer>;\n```"
