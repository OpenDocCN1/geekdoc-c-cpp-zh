    The classes for handling streams to and from disk files are defined in the header
    file fstream.h. The classes for handling general streams are defined in the header
    file istream.h. The header file istream.h is included in the file fstream.h.


    # 7.3 Text and Binary Input/Output


    In this section, the two modes of input/output—text mode and binary mode—will
    be explained. The difference between them and the suitability of each mode for
    console I/O and disk I/O will also be explained.


    # 7.3.1 Data Storage in Memory


    During time, the value of a character variable is stored in the memory as the
    binary equivalent of the ASCII equivalent. But the value of an integer, float,
    or double-type variable is simply stored as its binary equivalent.

    For example, if the value of a character-type variable is ‘A’, it is stored in
    one byte where the bits represent the number ‘65’, which is the ASCII equivalent
    of ‘A’, in base 2.


    ```

    01000001

    ```


    But if the value of an integer-type variable is ‘65’, it is stored in four bytes
    where the bits represent the number ‘65’ in base 2.


    ```

    01000001

    00000000

    00000000

    00000000

    ```


    The value of a float and a double-type variable is stored in a similar fashion.
    Thus, the value of a numeric variable (integer, float, or double) is stored in
    base 2 format in the memory.'
