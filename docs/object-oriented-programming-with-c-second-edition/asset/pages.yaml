    \ of factorials\n\n```\nlong int factorialSum(unsigned int a, unsigned int b)\n\
    {\n    int i;\n    long int sum;\n    for(sum=0,i=a;i<b;i++)\n        sum+=factorial(i);\n\
    \    return sum;\n}\n```\n\nIn, factorial() is a function that returns the factorial\
    \ of the parameter passed to it. Similarly, the function in Listing 6.6 returns\
    \ the sum of cubes of the numbers that belong to the range whose limits are passed\
    \ to it.\n\n# Listing 6.6 Function to compute sum of cubes\n\n```\nlong int cubeSum(unsigned\
    \ int a, unsigned int b)\n{\n    int i;\n    long int sum;\n    for(sum=0,i=a;i<b;i++)\n\
    \        sum+=cube(i);\n    return sum;\n}\n```\n\nThe cube() function returns\
    \ the cube of the number passed as a parameter to it. Again, the function of Listing\
    \ 6.7 returns the sum of logarithms of the numbers that belong to the range whose\
