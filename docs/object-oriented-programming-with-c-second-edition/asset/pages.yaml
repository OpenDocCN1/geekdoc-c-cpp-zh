    \     Cstr = new char[len + 1];\n        strcpy(Cstr,ss.Cstr);\n    }\n    return\
    \ *this;\n```\n\n```\n/*\ndefinitions of the rest of the functions class String\n\
    */\n/*/End of String.cpp*/\n```\n\nHowever, this function proves to be highly\
    \ inefficient in case of a self-assignment. Suppose the statement is:\n\ns1 =\
    \ s1;\n\nThis statement turns into\n\ns1.operator=(s1);\n\n's1' is passed by value\
    \ to the operator-overloading function. Therefore, the copy constructor is called\
    \ with respect to the formal arguments 'ss' and 's1' is passed as a parameter\
    \ to it. A properly defined copy constructor ensures that 'ss' contains a separate\
    \ copy of the string which 's1' contains. Nevertheless, when the actual function\
    \ body executes, the string contained by 's1' is first deleted by the first 'if'\
    \ block and then reallocated with the same value for the string by the second\
    \ 'if' block. Although the net effect is that nothing happens to the actual value\
    \ of the string contained by the object, the function is nevertheless inefficient.\
    \ The unnecessary deallocation and reallocation can be avoided. This has been\
    \ done by the check for self-assignment in Listing 8.30.\n\nNext, let us understand\
    \ why the function has been designed to return by reference. The reasons are similar\
    \ to those that prompted us to pass by reference (to check for self-assignment)."
