  md: '# 11


    # Exception Handling


    This chapter deals with exception handling. The benefits of exception handling
    and the muchneeded protocol it establishes between the library and its applications
    are discussed. The chapter begins with a critical study of the C-style solution
    to the problem of exception handling. It then elucidates the use and mechanism
    of exception handling (the try-throw-catch mechanism). The need to throw objects,
    the method of accessing members of thrown objects, and the use of nested exception
    classes are also discussed. The chapter concludes with a study of the limitations
    of exception handling.


    # 11.1 Introduction


    Let us begin by assuming the role of a library programmer. While defining non-member
    or member functions, we face situations where the function may or not be able
    to execute further. For example, we write a statement to divide double-type variable
    with another. Before this statement executes, we want to ensure that the denominator
    is not zero. We want to prevent the function from executing if denominator is
    zero. This is only one of the conditions under which we want to prevent the further
    execution of the function. More conditions exist (the function tries to open an
    unavailable file or requests more memory than is available). We know well the
    conditions under which the function should be aborted. However, we cannot decide
    the appropriate handling strategy. While the library function can easily detect
    error conditions, it cannot decide upon an appropriate handling strategy.


    Now, let us assume the role of the application programmer. While calling a function,
    we should not be burdened with the task of detecting each error in the parameters
    that we pass to the functions we call. On the other hand, we can only decide what
    action be taken whenever a particular error is met by the function being called.
    While the user of the library function cannot detect error conditions, it can
    decide upon an appropriate handling strategy.


    Exception handling allows the library to sense and dispatch error conditions,
    and the client to handle them. It is usual for the library to know how to detect
    errors without knowing the appropriate handling strategy. It is just as usual
    for the client programs to understand how to deal with errors without being able
    to detect them.


    We may wonder why a library function does not terminate the program when it detects
    invalid data input. Why does the library function not return an error value? All
    these questions will be answered in this chapter. Superiority of exception handling
    mechanism of C++ over the C-style error handling will also be discussed.'
