- pgno: 252
  md: "The function has been designed to return by reference to prevent chaining operation\
    \ from becoming inefficient, that is, to ensure an efficient execution of statements\
    \ such as the following ones.\n\n```\nString s1, s2, s3;\ns3 = s2 = s1;\n```\n\
    \nThis statement is interpreted as\n\n```\ns3.operator = (s2.operator = (s1));\n\
    ```\n\nSuppose the same statement is written as\n\n```\ns2 = s2 = s1;\n```\n\n\
    Notice the self-assignment embedded in the preceding statement. First, 's2' is\
    \ equated with 's1'. Then is returned by value and not by reference. In this case,\
    \ the value of 's2' is created in the stack. Although the copy has a separate\
    \ copy of the same value as 's2', its address is nevertheless different from that\
    \ 's2'. Therefore, when the assignment operator executes for the second time,\
    \ the reference variable 'rs' refers to this copy and not to 's2' itself. Consequently,\
    \ the test for self-assignment fails and again the unnecessary deallocation and\
    \ reallocation occurs.\n\nThere is another circumstance when the library programmer\
    \ might to overload the assignment operator. The library may not want objects\
    \ to share different copies of the same data. In the previous example, where the\
    \ assignment operator has been overloaded for the class String, objects are able\
    \ to physically separate and different copies of the same string value. To satisfy\
    \ the new requirement described earlier, the assignment operator should be defined\
    \ as a private member function (Listing 8.32).\n\n# Listing 8.32 Overloading the\
    \ assignment operator through a private member function\n\n```\nclass A {\n  \
    \  A& operator = (const A&);\npublic:\n    /*\n    rest of the class A\n    */\n\
    }\n```\n\nNow, if the client programs call the assignment operator indirectly\
    \ (object1 = object2) or directly (object1.operator=(object2)), the compiler raises\
    \ an error and the assignment of one to another is prevented. What happens if\
    \ one of the member functions or friend functions of class A calls the assignment\
    \ operator? This compiler will not complain and our safeguard will fail. For this,\
    \ the library programmer can simply defining the assignment operator. Now, if\
    \ one of the member functions or friend functions of class A calls the assignment\
    \ operator, the compiler does not complain, but the linker certainly does!\n\n\
    Let us understand another thing about the assignment operator. For this, we should\
    \ remember that a derived object can be assigned to a base class object. However,\
    \ the reverse is not true. See Listing 8.33. The reason is obvious. Suppose A\
    \ is the base class and B is its derived class."
  merge: -1
  img_proc: true
