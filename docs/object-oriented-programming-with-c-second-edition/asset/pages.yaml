  md: "demands the creation of a template class. Such a template class can be created\
    \ as illustrated by Listing 10.14.\n\n# Listing 10.14 A class template\n\n```\n\
    template<class T>\nclass X\n{\n  T val;\n  public:\n    void f1(const T &);\n\
    \    void f2(const T &);\n    /*\n    rest of the class X\n    */\n};\n```\n\n\
    The definition of the template class begins with the keyword template. This is\
    \ followed by the list of type and non-type template arguments enclosed in angular\
    \ brackets. Type template arguments are those that represent a data type. An actual\
    \ built-in or user-defined type replaces them when an object is declared. Each\
    \ type template argument is preceded by the keyword class. Non-type template arguments\
    \ are variables of built-in or user-defined type. Actual constant values are passed\
    \ for these non-type template arguments. The data type precedes each non-type\
    \ template argument. Thereafter, the class is defined using the usual syntax.\
    \ Member functions of template classes are defined in Listing 10.15.\n\n# Listing\
    \ 10.15 Defining the member function of a class template\n\n```\ntemplate<class\
    \ T>\nvoid X<T>::f1(const T & p)\n/*\ndefinition of the function\n*/\n```\n\n\
    Member functions of a template class are defined in the same way as the template\
    \ class itself. The definition begins with the template keyword. This is followed\
    \ by the list of type and non-type template arguments enclosed in angular brackets.\
    \ Each type template argument is preceded by the keyword class; each non-type\
    \ template argument is preceded by its type. Thereafter, the function is defined\
    \ using the usual syntax except for one important difference. The class name before\
    \ the scope resolution operator is followed by the names of all template arguments\
    \ enclosed in angular brackets.\nObjects of this template class can be declared\
    \ as:\n\n```\nX<int> intObj;\n```\n\nWhile declaring the object, the class name\
    \ is followed by the type and non-type template parameter(s) enclosed in angular\
    \ brackets. This is followed as usual by the name of the object itself. When the\
    \ compiler sees the declaration of the object, it replaces each occurrence of\
    \ the template argument by the template parameter in the definition of the class\
    \ template and"
