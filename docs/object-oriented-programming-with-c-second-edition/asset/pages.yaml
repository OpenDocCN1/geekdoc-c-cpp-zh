  md: '# 9.5.2 Binary Search Trees


    A binary search tree is a special form of binary tree. For any given node, the
    value contained in its left child is less than the value contained in the node
    and the value contained in the node is less than the value contained in its right
    child. For example, the tree shown in Figure 9.61 is a binary search tree.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_360_0.png)


    Figure 9.61 A binary search tree


    But the binary tree shown in Figure 9.62 is not a binary search tree. This is
    because 81 is larger than 49 and cannot be the value of the left child of the
    node that has 49.


    ![](img/5bfa77b13fdaa376725789bb8c00ee79_360_1.png)


    Figure 9.62 A structure that is not a binary search tree


