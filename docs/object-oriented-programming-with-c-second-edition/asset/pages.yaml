    Explicit constructors can prove to be useful for the programmer if he is creating
    a class for which an implicit conversion by the constructor is undesirable.


    # 4.1.4 Copy Constructor


    The copy constructor is a special type of parameterized constructor. As its name
    implies, it copies one object to another. It is called when an object is created
    and equated to an existing object at the same time. The copy constructor is called
    for the object being created. The pre-existing object is passed as a parameter
    to it. The copy constructor-wise copies the object passed as a parameter to it
    the object for which it is called.


    If we do not define the copy constructor for a class, the compiler defines it
    for us. But in either case, a copy is embedded in it under the following three
    circumstances.


    +   - When an object is created and simultaneously equated to another object,
    the copy constructor is called for the object being created. The object to this
    object was equated passed as a parameter to the copy constructor.


    ```

    A A1;

    A A2=A1;

    //zero-argument/default constructor called

    //copy constructor called

    ```


    ```

    or

    A A2(A1);

    //copy constructor called

    ```


    ```

    or

    A * APtr = new A(A1);

    //copy constructor called

    ```


    Here, the copy constructor is called for ''A2'' and for ''Aptr'' while ''A1''
    is passed as a parameter to the copy constructor in both cases.


    +   - When an object is created and simultaneously equated to a call to a function
    that returns an object. The copy constructor is called for the argument object.
    The object passed as a parameter to the function is passed as a parameter to the
    copy constructor.


    ```

    void abc(A1);

    //zero-argument/default constructor called

    //copy constructor called

    void abc(A A2)

    {

    /*

    defefinition of abc()

    */

