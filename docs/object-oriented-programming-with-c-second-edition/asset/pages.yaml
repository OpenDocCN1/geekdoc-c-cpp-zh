    +   A template class can take a non-type template argument. Listing 10.17 illustrates\
    \ this.\n\nListing 10.17 A non-type template argument in a class template\n\n\
    ```\ntemplate<class T, int v>\nclass X\n{\n    T val1;\n    /*\n    rest of the\
    \ class X\n    */\n}\n```\n\nWhile declaring an object of such a class, a data\
    \ type will be passed as a parameter for the\ntemplate-type argument. However,\
    \ an actual value will be passed for the non-type template\nargument.\n\n```\n\
    X<int,5> intObj;\n```\n\n+   The name of the template argument cannot be used\
