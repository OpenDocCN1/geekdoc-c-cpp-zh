    # 8.2.7 Overloading new and delete operators


    The new and the delete operators can be overloaded for specific classes. The behaviour
    of these operators can be altered by operands of specific class types.


    If these operators are overloaded for a specific class, then the functions that
    overload them are called when the class type is passed as a parameter to these
    operators. Otherwise, the global new and delete operators are overloaded. For
    example, if the new operator has been overloaded for a class X but not for a class
    Y, then the statement


    ```

    * Xptr = new X;

    ```


    will call the function that overloads the new operator of class X. But the statement


    ```

    * Yptr = new Y;

    ```


    will call the global operator. It is interesting to note that user programs may
    not change if the functions to overload the new and the delete operators are inserted
    into a class or removed from it.


