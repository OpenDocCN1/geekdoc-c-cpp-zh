    it has not yet been designed to operate. For instance, the addition operator can
    work on operands of type char, int, float, and double. However, if ''s1'', ''s2'',
    and ''s3'' are objects of the class String, which we have defined earlier, the
    following statement


    ```

    s3 = s1 + s2

