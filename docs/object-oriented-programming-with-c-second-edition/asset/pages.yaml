  md: "The source codes by searching for the string static_cast. Bugs suspected due\
    \ to an invalid-type conversion can thus be easily found.\n\n# 8.4.3 reinterpret_cast\
    \ Operator\n\nJust like the old style cast, the `reinterpret_cast` operator allows\
    \ us to cast type to another.\n\nSuppose `cPtr` is a character pointer and `vPtr`\
    \ is a void pointer. If the value of `vPtr` is to be assigned to `cPtr`, it needs\
    \ to be typecast first.\n\n```\ncPtr=(char *)vPtr;\n```\n\nHowever, the preceding\
    \ statement can be rewritten as\n\n```\ncPtr=reinterpret_cast *(vPtr);\n```\n\n\
    The compiler generates errors or warnings if casts are absent from conversion\
    \ statements where a value of one is being converted to an incompatible type.\
    \ These errors and warnings can be switched off by inserting cast operators. Inserting\
    \ a cast operator is a way of expressing our awareness and acceptance of the potential\
    \ consequences to the compiler and the reader.\n\nAs in the case of static_cast,\
    \ the reinterpret_cast operator seems to be an unnecessary substitute of the old\
    \ style cast. Again, in the case of static_cast, the visibility of the new style\
    \ cast is considerably greater than the old style cast, which makes tracking down\
    \ rogue old style cast much easier.\n\n# 8.4.4 const_cast Operator\n\nThe const_cast\
    \ operator serves the same purpose as the mutable keyword that has been explained\
    \ in Chapter 2. The const_cast operator is used to cast away the constness of\
    \ a pointer.\n\nWe may recall the following listing on mutable data members from\
    \ Chapter 2 (Listing 2.21).\n\n```\n/*Beginning of mutable.h*/\nclass A {\n  \
    \  int x; //non-mutable data member\n    mutable int y; //mutable data member\n\
    public:\n    void abc() const {\\{ //a constant member function\n        x++;\
    \ //ERROR: cannot modify a non-mutable data member\n             //member in a\
    \ constant member function\n        y++; //OK: can modify a mutable data member\
    \ in a\n             //constant member function\n    }\n    void def() { //a non-constant\
    \ member function\n        x++; //OK: can modify a non-mutable data member\n \
    \            //in a non-constant member function\n        y++; //OK: can modify\
    \ a mutable data member in a\n             //non-constant member function\n  \
    \  }\n}\n```"
