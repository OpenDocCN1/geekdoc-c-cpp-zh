  md: "# Introduction to C++\n\nThe next chapter contains an in-depth study of the\
    \ above class construct. It explains the meaning and implications of this new\
    \ feature. It also explains how and why many new features implement features of\
    \ OOPS, such as data hiding, data encapsulation, data abstraction, and a guaranteed\
    \ initialization of data. Before proceeding to Chapter 2, let us disregard slightly\
    \ and study the following:\n\n+   - Console/output in C++\n- Some non-object-oriented\
    \ features provided exclusively in C++ (reference variables, function overloading,\
    \ default arguments, inline functions)\nRemember that C++ program files have the\
    \ extension '.cpp' or '.C'. The former extension is normally used for Windows\
    \ or DOS-based compilers while the latter is normally used for UNIX-based compilers.\
    \ The compiler's manual can be consulted to find out the exact extension.\n\n\
    # 1.5 Console Input/Output in C++\n\nThis section discusses console input and\
    \ output in C++.\n\n# 1.5.1 Console Output\n\nThe output functions in C language,\
    \ such as printf(), can be included in C++ programs because they are anyway defined\
    \ in the standard library. However, there are some more ways of outputting to\
    \ the console in C++. Let us consider an example (see Listing 1.7).\n\nListing\
    \ 1.7 Outputting in C++\n\n```\n/*Beginning of cout.cpp*/\n#include <iostream>\n\
    void main()\n{\n    int x;\n    x=10;\n    cout<<x; //outputting to the console\n\
    }\n/End of cout.cpp*/\n```\n\nOutput\n\n10\n\nThe third statement in the main()\
    \ function (Listing 1.7) needs to be understood. cout (pronounce see-out) is actually\
    \ an object of the class ostream_withassign (you can think of it as a variable\
    \ of the structure ostream_withassign). It stands as an alias for the console\
    \ output device, that is, the monitor (hence the name).\n\nThe << symbol, the\
    \ left shift operator, has its definition extended in C++. In this context, it\
    \ operates as the insertion operator. It takes two operands. The operand on its\
    \ left must be an object of the class ostream. The operand on its right must be\
    \ a value of some fundamental data type. The value on the right side of the insertion\
    \ operator is 'inserted' (hence the name) into the stream headed towards the device\
    \ associated with the object on the left. Consequently, the value of 'x' is displayed\
    \ on the monitor.\n\nThe file iostream.h needs to be included in the source code\
    \ to ensure successful compilation because the object cout and the insertion operator\
    \ have been declared in that file."
