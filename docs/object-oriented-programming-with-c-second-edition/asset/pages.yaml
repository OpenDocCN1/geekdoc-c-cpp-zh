  md: '# Stream and File Handling


    This chapter deals with handling streams. It includes a study of classes in the
    C++ standard library that enable a programmer to handle flow of data to and from
    the console and also from disk files.


    Text and binary mode of handling streams and the distinction between the two forms
    an important part of the chapter.


    The use of classes and their member functions that enable a random access to disk
    files is discussed. Objects can and in many cases be capable of outputting and
    loading their own data to from disk files. This chapter tells you you.


    Error handling is an important feature expected in industrial strength software.
    This chapter discusses the use of error handling functions that pertain to streams.


    Manipulators are a handy tool for the C++ programmer. This chapter elucidates
    the use of many system-defined manipulators and the method of creating user-specific
    ones.


    # 7.1 Streams


    Stream means flow of data. We declare variables in our C++ programs for holding
    the data temporarily in the memory. Streams are nothing but a flow of data to
    from program variables.


    Input stream is the flow of data from program variables. The keyboard is also
    treated as source of input stream. Output stream is the flow of data to a file
    or program variables. The monitor is also treated as target for output stream.


    # 7.2 Class Hierarchy for Handling Streams


    C++ provides us with a library of classes that have the functionality to implement
    various aspects of stream handling. These classes have been arranged in a hierarchical
    fashion by using inheritance. The important portion of this hierarchy is depicted
    in Figure 7.1.


    The class ios is the base class in this hierarchy.


    The class ostream is derived from the class ios and handles the general output
    stream. The insertion operator (<<) is defined and overloaded in the class ostream
    to handle output streams from program variables to output files.


    The class ostream_withassign is derived from the class ostream and stands for
    console output. As mentioned earlier, C++ treats all peripheral devices as files.
    It treats the monitor as a file (for output stream). The object count represents
    the monitor.'
