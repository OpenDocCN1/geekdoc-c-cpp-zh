    # 8.2.5 Overloading Assignment Operator\n\nThe assignment operator is a binary\
    \ operator. If overloaded, it must be overloaded by a non-static member function\
    \ only. Thus, the syntax for overloading the assignment operator is shown in Listing\
    \ 8.28.\n\n**Listing 8.28** Syntax for overloading the assignment operator\n\n\
    ```\nclass <class_name>\n  public:\n    //prototype\n    class_name & operator\
    \ = (const class_name &);\n};\nclass_name & class_name :: operator = (const class_name\
    \ & rhs) //definition\n{\n    //statements\n}\n```\n\nWe must keep in mind that\
    \ by default, the compiler generates the function to overload the assignment operator\
    \ if the class designer does not provide one. This default function carries out\
    \ simple member-wise copy. See Listing 8.29.\n\n**Listing 8.29** Default assignment\
    \ operator generated by the compiler\n\n```\nclass A\n  public:\n    A& operator\
    \ = (const A&);\n};\nA A :: operator = (const A& rhs)\n{\n    *this = rhs;\n \
    \   return *this;\n}\n```"
