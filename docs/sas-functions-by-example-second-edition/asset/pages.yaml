    # Introduction


    The title of this chapter may cause you to think that these functions are somewhat
    esoteric or unimportant. In fact, these functions are some of the most commonly
    used functions in the SAS arsenal—they don''t fit easily into any of the other
    categories of SAS functions.


    # Functions That Obtain Values from Previous Observations


    These two functions are grouped together because of their similar applications.
    LAG function returns the value of its argument the last time the function executed.
    If you execute the LAG function in every iteration of the DATA step, you can interpret
    the result of the LAG function as the value of its argument in the previous observation.
    There is actually a'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'whole class of LAG and DIF functions—LAG1, LAG2, etc.—which return the value
    from

    the previous iteration of the DATA step, the iteration before that, etc. Each
    of the family of

    DIF functions operates in a similar manner to the family of LAG functions except
    that the

    difference between the current value and a previous value is returned. For example,
    DIF(X)

    returns the value of X the last time the DIF function executed.

    Thus, DIF is very useful in determining the difference between a value in the
    current

    observation and in a previous observation.


    # Functions: LAG and LAGn


    **Purpose:** To obtain the value of a variable from a previous observation or
    n

    bservations previous to the current observation.


    **Caution:** This application of the LAG and LAGn functions requires that you

    execute the function in **every** iteration of the DATA step. If you

    conditionally execute a LAGn function, the results you get may be

    unexpected and unwanted.


    **Syntax:** **LAG (value)**

    **LAGn (value)**


    *value* is any numeric variable.

    n* is the number of lagged values. LAG and LAG1 are equivalent.


    # **Examples**


    For these examples, the value of X in the current observation is 9, the value
    of X in the

    previous observation is 7, and the value of X in the observation previous to that
    is 5.


    | Function | Returns |

    |---|---|

    | LAG (X) | 7 |

    | LAG2 (X) | 5 |

    | LAG3 (X) | missing |'
  merge: -1
  pgno: 342
