    # Function: TRANWRD


    Purpose: To substitute one or more words in a string with a replacement word or
    words. It works like the find-and-and-replace feature of most word processors.


    Syntax: TRANWRD(character-value, find, replace)


    character-value is any SAS character value.


    find is one or more characters that you search for in the character-value and
    want to replace with the character or characters in the replace value.


    replace is one or more characters that replace the entire find value.


    Making the analogy to the find and replace feature of most word processors here,
    find represents the string you are searching for and replace represents the string
    that will replace the found value. Notice that the order of find and replace in
    this function is opposite from the order in the TRANSLATE function (and more logical
    to this author).


    If the replace value is longer than the find value, the result may be truncated.
    Be sure that the length of the result is long enough.'
