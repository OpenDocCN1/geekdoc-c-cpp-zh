    ages, where you want a person''s age as his or her last birthday.


    Syntax: FLOOR (numeric-value)


    numeric-value is any SAS numeric variable, expression, or numerical constant.
    For positive arguments, this function is equivalent to the INT function. Values
    within 10⁻¹² will return the value of the integer. For negative arguments, this
    function returns the next lowest negative number (see the following examples):


