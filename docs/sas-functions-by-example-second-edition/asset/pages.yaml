- img_proc: true
  md: 'Shift value for SAS date and datetime values:


    | Interval | Shift Value |

    | --- | --- |

    | YEAR | Month |

    | SEMIYEAR | Month |

    | QTR | Month |

    | MONTH | Month |

    | SEMIMONTH | Semimonth* |

    | TENDAY | Tenday |

    | WEEKDAY | Day |

    | WEEK | Day |

    | DAY | Day |


    Shift value for SAS time intervals:


    | Interval | Shift Value |

    | --- | --- |

    | HOUR | Hour* |

    | MINUTE | Minute* |

    | SECOND | Second* |


    *Only multi-intervals these intervals can be shifted.


    For all multi-unit intervals except WEEK, SAS creates an interval starting from
    January 1, 1960. Multiple intervals are all shifted by the same unit as the non-multiple
    intervals (see lists above). So, YEAR4.24 specifies four-year intervals with the
    interval boundary at the beginning of the second year (January 1, 1962, January
    1, 1966, etc.) MONTH4.2 indicates four-month intervals, with the boundary being
    the first day of the second month. See the following discussion on interval multipliers
    and shifted intervals.'
