    # Functions That Substitute Letters or Words in Strings


    TRANSLATE can substitute one character for another in a string. TRANWRD can substitute
    a word or several words for one or more words. TRANWRD is especially useful in
    such tasks as address standardization.


    **Function:** TRANSLATE


    **Purpose** To exchange one character value for another. For example, you might
    change values 1-5 to the values A-E.


    **Syntax:** TRANSLATE(character-value, to-1, from-1 <, ... to-n, from-n>)


    ```

    character-value is any SAS character value.

    ```


    ```

    to-n is a single character or a list of character values.

    ```


    ```

    from-n is a single character or a list of characters.

    ```


    Each character listed in from-n is changed to the corresponding value in to-n.
    If a character value is not listed in from-n, it will be unaffected. (Most SAS
    programmers consider the order of the second two arguments (from and to) to be
    in reverse order.)'
