  md: '# Function: ARSIN


    Purpose: To compute the inverse sine or arcsine. The resulting angle is in radians.
    To convert from radians to degrees, multiply by the fraction (180/π). For example,
    the arcsine of .5 is 0.5236, which is equal to 30 degrees.


    Syntax: ARSIN (value)


    ```

    value is a numeric value between -1 and +1.

    ```


    # Examples


    | Function | Returns |

    | --- | --- |

    | ARSIN(.5) | .5326 (30 degrees) |

    | ARSIN(1) | 1.5708 (90 degrees) |


    # Program 12.2: Computing arccosines and arcsines


    ```

    ***Primary functions: ARCOS and ARSIN

    ***Other function: CONSTANT;


    data arc_d_triumph;

    if_n = 1 then Pi = constant(''pi'');

    retain Pi;

    drop Pi;


    do Value = 0 to 1 by .1;

    Cos_radian = acos(Value);

    Cos_angle = Cos_radian * 180/Pi;

    Sin_radian = arcsin(Value);

    Sin_angle = Sin_radian * 180/Pi;

    output;

    end;


    run;

    ```


    ```

    title "Listing of data set Arc D Triumph";

    proc print data=arc_d_triumph noobs;

    run;

    ```'
  merge: -1
