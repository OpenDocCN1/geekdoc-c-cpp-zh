    # A Discussion of Interval Multipliers and Shifted Intervals


    Some applications of interval multipliers are quite straightforward. For example,
    if you use YEAR2 as your interval, the intervals will be every two years. The
    value of


    ```

    INTCK (''YEAR2'', ''15JAN2000d'', ''21JAN2003d'')

    ```


    is equal to 1 (one boundary, January 1, 2002, was crossed in going from January
    15, 2000, to January 21, 2002). The reason that January 1, 2002, is a boundary
    is that the counting of boundaries goes back to January 1, 1960, which was an
    even number. Therefore, the boundaries will be even-numbered years.


    You can shift single intervals. For example, YEAR.7 indicates yearly intervals
    with the boundary being July 1 of every year. For the intervals of YEAR, SEMIYEAR,
    and QTR, the shift amount is months. For the value of


    ```

    INTCK (''YEAR.7'', ''01JUN2000d'', ''03JUL2002d'')

    ```


    is equal to 3 (crossing boundaries at July 1, 2000, July 1, 2001, and July 1,
    2002).'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 4: Date and Time Functions 203


    Shifting intervals are shifted by multipliers. For example, YEAR2.12 indicates
    two-year intervals, with boundaries at the second year of each interval: January
    1, 1961, January 1, 1963, etc. That is, every odd year. For example, the value
    of


    ```

    INTCK (''YEAR2.12'', ''15JAN2000'', ''21JAN2003'')

    ```


    is equal to 2 (crossing the boundaries at January 1, 2001, and January 1, 2003).


    The value of


    ```

    INTCK (''MONTH4.2'', ''28JAN2003'', ''03JUL2003'')

    ```


    is equal to 2 (crossing the boundaries at February 1, 2003, and June 1, 2003).


    WEEK and multi-week intervals present a special problem. For example, you might
    expect the value of


    ```

    INTCK (WEEK, ''01JAN1960'', ''04JAN1960'')

    ```


    to equal 0. However, it is equal to 1. The problem is that weekly intervals are
    counted every time a Sunday is crossed and January 1, 1960, is a Friday. The that
    SAS decided to solve this problem was to start counting from Sunday in the same
    week of January 1, 1960, which is December 27, 1959. Going from January 1, 1960,
    to January 4, 1960, crosses a boundary (Sunday, January 3). This gets even more
    complicated when you are dealing with multi-week intervals.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '204 SAS Functions by Example, Second Edition


    As the default, the interval of WEEKDAY treats Saturday and Sunday as part of
    the

    preceding day. For example, the value of


    ```

    INTCK(''WEEKDAY'', ''01JUN2003''d, ''30JUN2003''d'')

    ```


    is equal to 21. June 1, 2003, falls on a Monday. The number of

    times you had crossed a boundary (a working day) is 21. (Please see a further
    discussion of

    the WEEKDAY interval below the June 2009 calendar later in this chapter.)


    You can specify days other than Saturday and Sunday to be treated as weekend days.
    For

    example, if you had a six-day work week, with Sunday as the day off, you could
    indicate the

    interval as WEEKDAY1W. So, the value of


    ```

    INTCK(''WEEKDAY1W'', ''01JUN2003''d, ''30JUN2003''d'')

    ```


