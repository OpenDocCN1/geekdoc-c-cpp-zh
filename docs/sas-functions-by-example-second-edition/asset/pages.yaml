  md: '# Chapter 7: Descriptive Statistics Functions 265


    # Program 7.14: Performing a t-test where values for each group are in a single
    observation


    ***Primary function: STD

    ***Other functions: N, MEAN, SQRT, PROBT, ABS;


    ```

    title "T-Test Calculation";

    data _null;

    file print;

    infile datelinesover;

    input Group $ x1-x50;

    retain n Mean SD Group1;

    if n = 1 then do

    Group1 = Group;

    n1 = n(of x1-x50);

    Mean = mean(of x1-x50);

    SD1 = std(of x1-x50);

    end;

    if n = 2 then do

    Group2 = Group;

    n2 = n(of x1-x50);

    Mean2 = mean(of x1-x50);

    SD2 = std(of x1-x50);

    diff = Mean - Mean2;

    SD_pooled_2 = ((n1-1)*SD1**2+(n2-1)*SD2**2)/(n1+n2-2);

    T = abs(Diff)/sqrt(SD_pooled_2/n1 + SD_pooled_2/n2);

    Prob = 2*(1-probbt(T,n2-2));

    ***Prepare the report;

    put @1 "Group" Group1+(-1) ":"\n@10 "N" = n1 3.

    @20 "Mean" = Mean 7.3

    @35 "SD" = SD1 7.4 /

    @01 "Group" = Group2+(-1) ":"\n@10 "N" = n2 3.

    @20 "Mean" = Mean2 7.3

    @35 "SD" = SD2 7.4 /

    @01 "Difference" = Diff 7.3

    @25 "T" = 7.4

    @40 "P(2-tail)" = Prob 7.4;

    end;

    datelines;

    A 4 5 8 7 6 5 7

    B 9 7 8 6 7 9 9 11 /

    ```'
  merge: -1
