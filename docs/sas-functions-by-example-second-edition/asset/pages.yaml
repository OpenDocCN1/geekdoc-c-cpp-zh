  md: '# # Introduction: A Brief Discussion of SAS Functions and Call Routines


    If you have written any SAS program, you probably used several functions and have
    an intuitive idea of what functions do. SAS functions usually perform a computation
    or manipulation of a value and return a single value. For example, the MONTH function
    computes the month of the year from a SAS date; the ROUND function can round numeric
    values; the TODAY function returns the current date.


    SAS functions usually take the form of a name, followed by a set of parentheses.
    In these parentheses are one or more arguments. (Certain functions such as TODAY
    take no arguments, but you need to follow the function name with an opening parenthesis
    and a closing parenthesis anyway you are referring to a variable called TODAY.)
    These arguments provide information that the function needs to return a result.
    For example, DAY_OF_WEEK = WEEKDAY (DATE); computes the day of the week from a
    SAS date and assigns it to the variable DAY_OF_WEEK. This function, with all other
    SAS functions, returns a single value that is assigned to a variable or used in
    a SAS expression.


    Finally, the arguments to most SAS functions can be variables, constants (if a
    character argument is needed, the constant must be in single or double quotation
    marks), or expressions (that may also contain other functions).


    CALL routines have some similarity to SAS functions because they often perform
    similar operations. However, they are not used in assignment statements. Instead,
    they stand alone as SAS statements. Multiple arguments in a CALL routine can be
    assigned new values by the routine. For example, the CALL SCAN(string, n, length);
    returns the position and length of the $n$th word in the string. The SCAN function,
    on the other hand, returns only a single value—the $n$th word in the string. Indeed,
    the main reason for using a CALL routine instead of a function is to obtain more
    than one value in a single statement.


    Functions and CALL routines in this book are arranged by category and topic. For
    example, in Chapter 1, "Character Functions," there are topics such as "Functions
    That Search for Characters" or "Functions That Remove Leading and Trailing Blanks
    from Strings." This author hopes that this arrangement (as opposed to alphabetical
    order) will make it easier for you to find the function you need quickly.'
