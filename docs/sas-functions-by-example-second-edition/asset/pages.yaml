    # The “CAT” Functions (CAT, CATS, CATT, CATX, and CATQ)


    These concatenation functions are very similar to the concatenation CALL routines
    described previously. However, since they are functions and not CALL routines,
    you need to name the new character variable to be created on the left-hand side
    of the equal sign and the function, along with its arguments, on the right-hand
    side of the equal sign. As with the concatenation CALL routines, we will describe
    the five functions together and use a single program to demonstrate them.


    One very useful feature of all of these functions is that the items to be concatenated
    may be character or numeric. And, if you include numeric items, they are treated
    as if they actually character values and no conversion messages are printed to
    the log.


    # Function: CAT


    +   Purpose: To concatenate (join) two or more character strings or numeric values,
    leaving leading and/or trailing blanks unchanged. This function accomplishes the
    same task as the concatenation operator (|). However, it is important to realize
    that the CAT function and the concatenation operator differ in the default length
    of the result: the default length of the result when you use the sum of the lengths
    of the strings being concatenated; the default length of the result when you use
    the CAT function is 200. This is keeping with the default length for many of the
    SAS functions.


    # Syntax: CAT (item-1, item-2 <item-n>)


    item-1, item-2 <item-n> are the character strings or numeric values to be concatenated.
    These arguments can also be written as CAT (C1–C5) where C1–C5 represents a variable
    list.


    > Note: It is very important to set the length of the resulting character string,
    using a LENGTH statement or other method, before using any of the concatenation
    functions. Otherwise, the length of the resulting string will default to 200.
    When you use the concatenation operator, the length of the resulting string is
    the sum of the lengths of the values being concatenated.'
