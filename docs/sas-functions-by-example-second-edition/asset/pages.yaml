  md: '# Chapter 11: State and ZIP Code Functions 339


    # Functions That Convert State Codes


    This set of functions all take two-character state codes and return FIPS codes
    or state names.


    **Function:** STFIPS


    **Purpose:** To convert a two-character state code (e.g., ''NJ'') to a FIPS code.


    **Syntax:** `STFIPS (state-code)``


    state-code is a two-character standard state abbreviation. This can be a SAS character
    variable, an expression, or a character constant, and can be in uppercase or lowercase.


    Examples


    For these examples, STATE1 = ''NJ'' and STATE2 = ''nc''.


    | Function | Returns |

    |---|---|

    | STFIPS (STATE1) | 34 |

    | STFIPS (STATE2) | 37 |

    | STFIPS (''TX'') | 48 |

    | STFIPS (''XX'') | missing value |


    See Program 11.2 for a sample program.


    **Function:** STNAME


    **Purpose:** Takes a two-character state code (e.g., ''NJ'') and returns a state
    name in uppercase letters.


    **Syntax:** `STNAME (state-code)``


    state-code is a two-character standard state abbreviation. This can be a SAS character
    variable, an expression, or a character constant, and can be in uppercase or lowercase.


    Examples


    For these examples, STATE1 = ''NJ'' and STATE2 = ''nc''.'
