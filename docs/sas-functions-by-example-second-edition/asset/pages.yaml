  md: '# Chapter 11: State and ZIP Code Functions 349


    # Program 11.5: Measuring the distance between two coordinates or two ZIP codes


    ***Primary functions: GEODIST ZIPCITYDISTANCE;

    data distance:

    *Three Bridges New Jersey: N 40 31.680 W 74 47.968

    *Camp Verde Texas: N 29 54.597, W 99 04.242;

    *See the explanation below to understand the calculations

    in the next four lines of code;


    ```

    ThreeBridges_N = 40 + 31.680/60;

    ThreeBridges_W = -(74 + 47.968/60);

    CampVerde_N = 29 + 54.597/60;

    CampVerde_W = -(99 + 4.242/60);

    Distance_Geo = geodist(ThreeBridges_N, ThreeBridges_W, CampVerde_N, CampVerde_W,
    ''MD'');

    Distance_Zip = zipdistance(08822, 78010);

    run;

    title "Distance in Miles between Three Bridges NJ and "

    "Camp Verde TX";

    proc print data-distance noobs;

    run;

    ```


    Explanation

    The latitude and minutes in the first comment are given in degrees, minutes, and
    decimal minutes, which is standard for most GPS devices. Other possible coordinate
    systems are degrees, minutes, and seconds and UTM (used by geological survey maps
    and the military). There are several Web sites that will convert these various
    formats.


    If you supply coordinates to the GEODIST function in degrees, you will need to
    convert the degrees, and decimal minutes into degrees. Since there are 60 minutes
    to a degree, you need to add the number of degrees plus 1/60 of the minutes value.
    As a matter of interest, probably to no one besides the author, the two locations
    are where the author lives in New Jersey and Texas.


    Remember that the default result for the GEODIST function is in kilometers, so
    be sure to use the m option if you want the result in miles. The two ZIP codes
    for the ZIPCITYDISTANCE function are the corresponding ZIP codes for Three Bridges,
    New Jersey and Camp Verde, Texas. Here is the output:'
