  md: '# Introduction


    The name of this chapter, “Descriptive Statistics Functions,” is somewhat misleading.
    Although some of the functions, such as MEAN (average) and STD (standard deviation),
    can be thought of as statistical, many of these functions have extremely useful,
    everyday, non-statistical uses. So, don''t be scared off. As is true throughout
    the book, I''ve used the same function categories as the SAS documentation to
    avoid confusion. You will find some of these functions indispensable in your SAS
    programming.


    # Functions That Determine the Number of Missing and Non-missing Values in a List
    of SAS Variables


    Function: N


    Purpose: To determine the number of non-missing values in a list of numeric values.


    Syntax: N(<of> numeric-values)


    numeric-values is either a list of numeric values (numeric variables or numbers),
    separated by commas, or a list of variables in the form BASEm–BASEm (e.g., X1–X5).
    If the latter style is used, you must place the word “of” before the list. The
    reason for this is that without the word “of,” SAS interprets a list such as X1–X5
    as the value of X1 minus the value of X5.


    For these examples, X = 5, Y = ., Z = 7, X1 = 1, X2 = 2, X3 = 3, X4 = .


    | Function | Returns |

    | --- | --- |

    | N(X,Y,Z) | 2 |

    | N(OF X1-X4) | 3 |

    | N(10,20,., 30,40,50) | 5 |

    | N(OF X1-X4,Y,Z) | 4 |


    # Examples'
  merge: -1
  pgno: 264
- img_proc: true
  md: "# Chapter 7: Descriptive Statistics Functions 239\n\n# ### Program 7.1: Using\
    \ the N function to determine the number of non-missing values in a list of variables\n\
    \n***Primary functions: N, MEAN;\n\n```\ndata quiz;\n    input Quiz-Quiz10;\n\
    \    ***compute quiz average if 8 or more quizzes taken;\n    if n(of Quiz-Quiz10)\
    \ ge 8 then Quiz_ave = mean(of Quiz-Quiz10);\ndatalines;\n    90 88 79 100 97\
    \ 96 94 95 93 88\n    60 90 66 77 . . 88 84 86\n    90 . . 90 90 90 90 90 90\n\
    ;\\ntitle \"Title of Data Set QUIZ\";\nproc print data=quiz noobs heading=h;\n\
    run;\n```\n\n# Explanation\n\nThis program uses the N function to determine the\
    \ number of non-missing quiz scores. If the number is eight or more, an average\
    \ is computed. Otherwise, QUIZ_AVE will be a missing value. In the following list,\
    \ notice the missing value for QUIZ_AVE in the second observation.\n\n# Listing\
    \ of Data Set QUIZ\n\n| Quiz1 Quiz2 Quiz3 Quiz4 Quiz5 Quiz6 Quiz7 Quiz8 Quiz9\
    \ Quiz10 Quiz_ave |\n|---|---|---|---|---|---|---|---|---|---||\n| 90 | 88 | 79\
    \ | 100 | 97 | 96 | 94 | 95 | 93 | 88 | 92 |\n| 60 | 90 | 66 | 77 | . | . | 88\
    \ | 84 | 86 | . | . |\n| 90 | . | . | 90 | 90 | 90 | 90 | 90 | 90 | 90 | . |\n\
