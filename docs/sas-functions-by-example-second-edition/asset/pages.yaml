    \ |\n| --- | --- |\n| CEIL(1.2) | 2 |\n| CEIL(1.8) | 2 |\n| CEIL(-1.2) | -1 |\n\
    | CEIL(-1.8) | -1 |\n\n# Program 6.1: Using the CEIL function to round up a value\
    \ to the next penny\n\n```\n***Primary function CEIL;\nndata roundup;\n  Input\
