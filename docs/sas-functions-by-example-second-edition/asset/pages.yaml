  md: '# Function That Sets Variable Values to a SAS Missing Value


    CALL MISSING is an extremely useful CALL routine that sets the value of its arguments
    to a SAS missing value. It takes both numeric and character variables.


    This CALL routine is most useful when you are writing a program where some of
    the variables are retained and you need to initialize their values at various
    times in the DATA step.


    +   **Function:** CALL MISSING


    +   **Purpose:** To set all of its arguments (numeric or character) to a SAS missing
    value.


    +   **Syntax:** `CALL MISSING(<of> Variable-1 <,Variable-n>)`


    ```

    Variable is a numeric or character variable.

    ```


    If you use any form of a variable list as x1-x3, _NUMERIC_, _CHARACTER_, or _ALL_,
    you need to precede the variable list with the keyword "of".


    # Examples


    For these examples, x1=9, x2=8, x3=., c1=''Ron'', c2=''Cody''. An array statement:
    array x[3]; was also defined.


    | Function | Returns |

    |---|---|

    | CALL MISSING(x1,x2,x3) | x1=., x2=., x3=. |

    | CALL MISSING(of x1-x3) | x1=., x2=., x3=. |

    | CALL MISSING(of x*) | x1=., x2=., x3=. |

    | CALL MISSING(of numeric_) | x1=., x2=., x3=. |

    | CALL MISSING(of all_) | x1=., x2=., x3=., c1='' '', c2='' |'
  merge: -1
  pgno: 359
- img_proc: true
  md: "# Program 10.10: Demonstrating the CALL MISSING routine\n\n```\n***Primary\
    \ function: CALL MISSING;\ntitle;\n  data _null;\n    input x1-x3 (Char-Char3)\
    \ : $5;\n    file print;\n    put \"Values before the CALL:\" /\n      (x1-x3)\
    \ = 4.) / /\n      (Char-Char3) (= $5);\n    call missing of x1-x3,of Char-Char3;\n\
    \    put \"Values after the CALL:\" /\n      (x1-x3) = 4.) / /\n      (Char-Char3)\
    \ (= $5));//\ndatalines;\n1 2 3 a b c\n100 . 200 One Two Three\n;\n```\n\nAs you\
    \ can see from the following output, this CALL routine sets the value of all of\
    \ its arguments to a SAS missing value.\n\nValues before the CALL:\nx1=1 x2=2\
    \ x3=3\nChar1=a Char2=b Char3=c\n\nValues after the CALL:\nx1=. x2=. x3=.\nChar1=\
    \ Char2= Char3=\n\nValues before the CALL:\nx1=100 x2=. x3=200\nChar1=One Char2=Two\
    \ Char3=Three\n\nValues after the CALL:\nx1=. x2=. x3=.\nChar1= Char2= Char3="
