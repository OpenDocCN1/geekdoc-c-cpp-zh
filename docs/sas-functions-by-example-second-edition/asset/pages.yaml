  md: "# 364 SAS Functions by Example, Second Edition\n\nThere are some similarities\
    \ between the RESOLVE and SYMGET functions. SYMGET gets the current value of a\
    \ macro variable during execution. If the value of the macro variable is modified\
    \ during execution with SYMPUT, and then SYMGET is called, the new value is retrieved.\n\
    \nBoth functions are dynamic in nature that they both interact with the macro\
    \ execution of a DATA step.\n\nThis is a complicated topic that is beyond the\
    \ scope of this book. If you want to learn more about the differences between\
    \ SYMGET and RESOLVE, see the SAS 9.2 Macro Language: Reference in the Knowledge\
    \ Base, available at http://support.sas.com/documentation.\n\n+   **Purpose:**\
    \ To return a value from a text expression to a DATA step during DATA execution.\n\
    \n+   **Syntax:** RESOLVE(character-value)\ncharacter-value is a character literal\
    \ in single quotation marks, the name of a SAS character variable, or a character\
    \ expression that the DATA step resolves to a macro text expression or a SAS statement.\n\
    \n**Examples** For these examples, CHAR = '&MAC' and X=3. Note the use of single\
