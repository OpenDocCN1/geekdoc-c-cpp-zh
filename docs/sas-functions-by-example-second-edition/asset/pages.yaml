  md: '# SAS Functions by Example, Second Edition


    # **Function:** CALL PRXNEXT


    **Purpose:** To locate the nth occurrence of a pattern defined by the PRXPARSE
    function in a string. Each time you call the PRXNEXT routine, the next occurrence
    of the pattern will be identified.


    **Syntax:** `CALL PRXNEXT(pattern-id, start, stop, position, length)`


    *pattern-id* is the value returned by the PRXPARSE function.


    *start* is the starting position to begin the search.


    *stop* is the last position in the string for the search. If stop is set to -1,
    the position of the last non-blank character in the string is used.


    *position* is the name of the variable that is assigned the starting position
    of the nth occurrence of the pattern or the first occurrence after *start*.


    *length* is the name of the variable that is assigned the length of the pattern.


    # **Examples**


    For these examples, the following statements were issued:


    ```

    RE = PRXPARSE("/\d+/");

    ***Look for 1 or more digits;

    STRING = "12 345 ab 6 cd";

    START = 1;

    STOP = LENGTH(STRING);

    ```


    | Function | Returns (1st call) | Returns (2nd call) | Returns (3rd call) |

    |---|---|---|--|

    | CALL PRXNEXT (RE, START, STOP, POS, LENGTH) | START = 3 | START = 7 | START
    = 12 |

    | | STOP = 14 | STOP = 14 | STOP = 14 |

    | | POS = 1 | POS = 4 | POS = 11 |

    | | LENGTH = 2 | LENGTH = 3 | LENGTH = 1 |'
  merge: -1
