  md: '# Functions That Locate Text Patterns


    **Function:** PRMATCH


    **Purpose:** To locate the position in a string where a regular expression match
    is found. PRMATCH returns the starting position at which the pattern is found.
    If this pattern is not found, the function returns a 0. (This function is similar
    to the FIND function, but instead of matching a string of characters, it is matching
    a pattern described by a regular expression.)


    **Syntax:** *pattern-id or regular-expression, string*


    *pattern-id* is the value returned from the PRXPARSE function.


    *regular-expression* is a Perl regular expression, placed in quotation marks (SAS
    9.1 and later). Note: If you use *pattern-id*, you must use the PRXPARSE function
    first. If you place the regular expression (in quotation marks) directly in the
    PRMATCH function, you do not use the PRXPARSE function.


    *string* is a character variable or a string literal.


    # Examples


    | Regular Expression | String | Returns | Does Not Match (Returns 0) |

    |---|---|---|---|

    | /cat/ | "The cat is black" | 5 | "cots" |

    | /^cat/ | "cat on the roof" | 1 | "The cat" |

    | /cat$/ | "There is a cat" | 12 | "cat in the house" |

    | /cat/I | "The Cat" | 5 | "no dogs allowed" |

    | /r[aeiu]/ | "rat", "rut" | 1 | "rt", "rrt", "root" |

    | /\d\d/ / | "345" and "999" | 1 | "1234" and "99" |

    | /\d\d?/ | "123" and "12" | 1 | "1", "1AB", "1 9" |

    | /\d\d+/ | "123" and "12345" | 1 | "12" |

    | /\d\d* / | "123", "12", "12345" | 1 | "1" and "xyz" |

    | /r.n/ | "ron", "ronny", "r9n" | 1 | "rn" |

    | "r n" | | | |


    (continued)'
