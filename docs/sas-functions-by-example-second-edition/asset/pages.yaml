    # Functions That Perform Character-to-Numeric or Numeric-to-Character Conversion


    Function: INPUT


    The first two functions in this group (INPUT and PUT) are being grouped together
    since they have something in common: they are commonly used to perform character-to-numeric
    (INPUT) or numeric-to-character (PUT) conversion. These two functions may be confusing
    at first, but they are extremely useful once you get the hang of them.


    Purpose: To perform character-to-numeric conversion. Also useful in converting
    character values such as dates into true SAS numeric date values.


    Syntax: INPUT(value, informat)


    value is a character variable or character expression.


    informat is a SAS or user-defined informat.


    Examples

    For these examples, N_CHAR = ''123'' and CHAR_DATE = ''10/21/1980''.'
