  md: "# Program 1.4: Program to demonstrate the LOWCASE function\n\n***Primary function:\
    \ LOWCASE;\n\n```\ndata wt;\n  Input ID = $3. Unit = $1. Weight;\n  Unit = lowercase(Unit);\n\
    \  if Unit = 'k' then Wt_lbs = 2.2*Weight;\n  else if Unit = 'l' then Wt_lbs =\
    \ Weight;\ndatalines;\n001 k 100\n002 l 101\n003 l 201\n004 l 166\n;\ntitle \"\
    Listing of Data Set WT\";\nproc print data=wt noobs;\nrun;\n```\n\n# Explanation\n\
    \nThis program demonstrates a common problem—dealing with character data in mixed\
    \ case. Here you see the values of the variable Unit are sometimes in uppercase\
    \ and sometimes in lowercase. A simple way to solve this problem is to use the\
    \ LOWCASE function to ensure that all values of Unit will be in lowercase.\n\n\
    You could have used the UPCASE function to convert all the Unit values to uppercase.\n\
    \n**Note:** If you have mixed case data, you can use the $UPCASE informat to convert\
    \ the values to uppercase as they are being read. There is no corresponding $LOWCASE\
    \ format.\n\nThe remainder of the program is straightforward: after you convert\
    \ the values of Unit to lowercase, you only have to check for lowercase k's and\
    \ l's to determine whether you need to multiply the Weight by 2.2 or not. The\
    \ following listing shows that this program worked as desired (the variables Unit\
    \ and Weight would normally be dropped in a program like this):\n\n| Listing of\
    \ Data Set WT |\n| ID | Unit | Weight | Wt_lbs |\n| 001 | k | 100 | 220.0 |\n\
    | 002 | k | 101 | 222.2 |\n| 003 | l | 201 | 201.0 |\n| 004 | l | 166 | 166.0\
    \ |"
