    # Functions That Work with Date, Datetime, and Time Intervals


    Functions in this group work with date or time intervals. The INTCK function,
    when used with date and datetime values, can determine the number of interval
    boundaries crossed between two dates. When used with SAS time values, it can determine
    the number of hour, minute, or second boundaries between two time values.


    The INTNX function, when used with SAS date or datetime values, is used to determine
    the date after a given number of intervals have passed. When used with SAS time
    values, it computes the time after a given number of time interval units have
    passed.


    You will find an excellent description of these two functions in SAS Language
    Reference: Concepts or in the following technical note:


    ```

    http://support.sas.com/techsoup/technote/ts668.html

    ```


    **Note:** The wording of arguments in this book might differ from the wording
    of arguments in the Product Documentation at http://support.sas.com.


    # Function: INTCK


    **Purpose:** To return the number of intervals between two dates, two times, or
    two datetime values. To be more accurate, the INTCK function counts the number
    of times a boundary has been crossed going from the first value to the second.


    For example, if the interval is YEAR and the starting date is January 1, 2002,
    and the ending date is December 31, 2002, the function returns a 0. The reason
    for this is that the boundary for YEAR is January 1, and even'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'though the starting date is on a boundary, no boundaries are crossed in going
    from the first date to the second. Using the same logic, going from December 31,
    2002, to January 1, 2003, does cross a year boundary and returns a 1. This is
    true though, in the first case, there are 364 days between the dates and, in the
    latter case, only one day.


    These intervals are used "as is" or with multipliers as two-year intervals, that
    can be shifted so that the boundary is, for example, the seventh month of the
    year (July) instead of January 1.


    When used with multi-intervals and shifted intervals, the INTCK function can become
    very complicated. A limited discussion of the finer points of the INTCK function
    follows the syntax and examples.


    Syntax: INTCK(''interval<Multiple>.shift'', start-value, end-value)


    Intervals can be date units:


    | Interval | Description |

    | --- | --- |

    | DAY | Day |

    | WEEK | Week |

    | WEEKDAY | Each weekday (Monday to Friday, or any set of days you choose) |

    | TENDAY | Ten-day period |

    | SEMIMONTH | Two-week period |

    | MONTH | Month |

    | QTR | Quarter (Jan-Mar = 1, Apr-Jun = 2, etc.) |

    | SEMIYEAR | Half year |

    | YEAR | Year |'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Intervals can be time units:


    | Interval | Description |

    | --- | --- |

    | SECOND | Seconds |

    | MINUTE | Minutes |

    | HOUR | Hours |


    Intervals can be datetime units:


    | Interval | Description |

    | --- | --- |

    | DTDAY | Day |

    | DTWEEK | Week |

    | DTWEEKDAY | Each weekday (Monday to Friday) |

    | DTDENDAY | Ten-day period |

    | DTSEMIMONTH | Two-week period |

    | DTMONTH | Month |

    | DTQTR | Quarter (Jan-Mar = 1, Apr-Jun = 2, etc.) |

    | DTSEMIEAR | Half year |

    | DTYEAR | Year |


    *interval* is one item from the preceding list, placed in quotation marks.


    *multiple* is an optional modifier in the interval. You can specify multiples
    of an interval. For example, MONTH2 specifies two-month intervals; DAY50 specifies
    50-day intervals.


    *shift* is an optional parameter that determines the starting point in an interval.
    For example, YEAR.4 specifies yearly intervals, starting from April 1. The shift
    value for single intervals is shown in the following table:'
