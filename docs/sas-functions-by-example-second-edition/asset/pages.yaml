  md: '# Chapter 2: Perl Regular Expressions 149


    This is not a complete list of Perl metacharacters, but it''s enough to get started.
    The SAS Product Documentation at http://support.sas.com/documentation or any book
    on Perl programming will provide you with more details. Examples of each of the
    "PRX" functions in this chapter will also help you understand how to write these
    expressions.


    Note: The wording of arguments in this book might differ from the wording of arguments
    in the SAS Product Documentation.


    Regular expression syntax includes repetition operators. These operators are extremely
    powerful in that they enable you to specify that an expression to be repeated
    a given number of times. For example, \d is any digit. If you follow this expression
    with an asterisk (*), you now have a specification for zero or more digits. Likewise,
    \d+ is a specification for one or more digits. The following table describes these
    repetition operators:


    | Repetition Operators | Description | Examples |

    | * | Matches the previous subexpression zero or more times | cat matches "cat",
    "cats", "catanddog" c(at) matches "c", "cat", and "catatat" |

    | + | Matches the previous subexpression one or more times | \d+ matches one or
    more digits |

    | ? | Matches the previous subexpression zero or one times | hello? matches "hell"
    and "hello" |

    | {n} | Matches the previous subexpression n times | \d{4} matches four digits
    |

    | {n,m} | Matches the previous subexpression n or more times, but no more than
    m | \w{3,5} matches "abc" "abcd" and "abede" |'
