    # Functions That Compute Geographical Distance


    Function: GEODIST


    Purpose: To compute the straight line distance ("as the crow flies") between two
    sets of latitude and longitude coordinates. By default, the distance is computed
    in kilometers. If you want your value to be in miles, be sure to use the m option.


    Syntax: GEODIST (latitude-1, longitude-1, latitude-2, longitude-2, <options>)


    latitude is the north or south of the equator in degrees or radians (default is
    degrees). Locations north of the equator have positive values; locations south
    of the equator have negative values. Values for latitude must be between 0 and
