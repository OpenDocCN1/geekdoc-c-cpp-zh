  md: '404 SAS Functions by Example, Second Edition


    # Function: VFORMAT


    **Purpose:** To return the format name associated with a variable. The name includes
    the $ if the format is associated with a character variable, and the width, if
    included. For numeric variables, the name also also includes the value to the
    right of the decimal point. For example, possible returned values are $CHAR15
    and DOLLAR8.2.


    **Syntax:** VFORMAT (variable)


    variable is a SAS variable name.


