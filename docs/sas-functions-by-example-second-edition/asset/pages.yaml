    # **TRIM, TRIMN, AND STRIP**


    This group of functions trims trailing blanks (TRIMN) and both leading and trailing
    blanks (STRIP).


    The two functions TRIM and TRIMN are similar: they both remove trailing blanks
    from a string. The functions work identically except when the argument contains
    only blanks. In that case, TRIM returns a single blank (length of 1) and TRIMN
    returns a null string with a length of 0. The STRIP function removes both leading
    and trailing blanks.


    # **Function:**


    **Purpose:** To remove trailing blanks from a character value. This is especially
    useful when you want to concatenate several strings together and each string may
    contain trailing blanks.


    **Syntax: TRIM(character-value)**


    ```

    character-value is any SAS character value.

    ```


    **Important note:** Length of the value returned by the TRIM function will be
    the same as the argument, unless the length of this variable has been previously
    defined. If the result of the TRIM function is assigned to a variable with a length
    longer than the trimmed argument, the resulting variable will be padded with blanks.'
