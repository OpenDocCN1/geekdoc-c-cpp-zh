- img_proc: true
  md: "288 SAS Functions by Example, Second Edition\n\n**Note:** The wording of arguments\
    \ in this book might differ from the wording of arguments in the Product Documentation.\n\
    \nMost of the programs focus on statistical applications, you may find it useful\
    \ to take a random subset of a SAS data set or to randomly generate test data\
    \ sets, whether you are a statistician or a non-statisticistian.\n\n# **A Word\
    \ about Random Number Seeds**\n\nIt is important to understand how SAS generates\
    \ a series of random numbers using the random number functions and the CALL routines.\
    \ There are some important differences.\n\nAll of the random number functions\
    \ share a common series of seeds. The random numbers can either use a seed that\
    \ you supply (in which case you get the same series of random numbers every time\
    \ you run the same DATA step) or a 0 (or any negative value seed), in which case\
    \ the first seed is generated using the computer clock. Regardless of what seed\
    \ you designate for any subsequent uses of random functions in your DATA step,\
    \ it is only the *first* seed that matters in the random number functions.\n\n\
    If you choose to use one of the random number CALL routines, you can choose a\
    \ new seed value any time you want. In addition, you can have a separate seed\
    \ stream for several random number generators in your program.\n\nTo clarify how\
    \ seed values affect a series of random numbers, look at the two following programs:\n\
    \n# **Program 9.1: Demonstrating differences between random functions and CALL\
    \ routines (function example)**\n\n```\n***Primary function: RANUNI;\ndata ran_function;\n\
    do n = 1 to 3;\n  x = ranuni(1234);\n  y = ranuni(0);\n  output;\nend;\nrun;\n\
    ```\n\n```\ntitle \"Listing of data set RAN_FUNCTION - First run\";\nproc print\
    \ data=ran_function noobs;\nrun;\n```"
