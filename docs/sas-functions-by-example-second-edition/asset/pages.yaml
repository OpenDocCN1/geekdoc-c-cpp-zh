    # Introduction


    Perl regular expressions were added in SAS*. SAS regular expressions (similar
    to Perl regular expressions but using a different syntax to indicate text patterns)
    have actually been around SAS 6.12, but many SAS users are unfamiliar with either
    SAS or Perl expressions. Both SAS regular expressions (the RX functions) and Perl
    regular expressions (the PRX functions) enable you to locate patterns in text
    strings. For example, you could write a regular expression to look for three digits,
    a dash, two digits, a dash, followed by four digits (the general form of a Social
    Security number). The syntax of both SAS and Perl regular expressions enables
    you to search for classes of characters (digits, letters, non-digits, etc.) as
    well as specific character values.


    Since SAS already has such a powerful set of string functions, you may wonder
    why you need regular expressions. Many of the string processing tasks can be performed
    either with'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'the traditional character functions or regular expressions. However, regular
    expressions sometimes provide a much more compact solution to a complicated string
    manipulation task. Regular expressions are especially useful for reading highly
    unstructured data streams. For example, you may have a large text file and want
    to extract all the e-mail addresses. Another example would be extracting ZIP codes
    from another. Once a pattern is found, you can obtain the position of the pattern,
    extract a substring, or substitute a string.


    The first edition of this book described both the Perl and SAS regular expressions,
    but for several reasons the older regular expression functions (all beginning
    with RX) were not included in the second edition. First, more people may be familiar
    with Perl regular expressions. Second, the implementation of Perl regular expression
    in SAS is said to be more efficient. Finally, there is a more extensive set of
    Perl regular functions compared to the older SAS regular expressions. The syntax
    and usage of these two sets of functions is different and it is confusing to use.
    If you are new to regular expressions, I suggest that you stick to the Perl regular
    expressions exclusively.


    I have not attempted to provide a complete description of Perl regular expressions
    in this book. Hopefully, it will be a good start, to become an expert, you will
    need to obtain a book on Perl or some other documentation on regular expressions.


    # A Brief Tutorial on Perl Regular Expressions


    I have heard it said that Perl regular expressions are "write only." That means,
    with some practice, you can become fairly accomplished at writing expressions,
    but reading them, even the ones you wrote, is quite difficult. I strongly suggest
    you comment any regular expressions you write so that you will be able to change
    or correct your program in the future.


    The PRXPARSE function is used to create a regular expression. Because this expression
    is compiled, it is usually placed in the DATA step following a statement such
    as IF_N=1 then .... Since this statement is executed only once, you will need
    to retain the value returned by the PRXPARSE function. If the first argument is
    a constant, SAS will not recompile the regular expression for each iteration of
    the DATA step. However, it is still considered good programming practice to use
    the RETAIN statement with_N when you use the PRXPARSE function. So, to get started,
    let''s take a look at the simplest type of regular expression, an exact text match.'
