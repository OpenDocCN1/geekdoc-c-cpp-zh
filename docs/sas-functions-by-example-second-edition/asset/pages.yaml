  md: 'title ''Listing of Data Set UPPER;

    proc print data=upper noobs;

    run;


    # Explanation


    Remember that uppercase and lowercase values are represented by different internal
    codes, so if you are testing for a value such as Y for a variable and the actual
    value is y, you will not get a match. Therefore, it is often useful to convert
    all characters to either uppercase or lowercase before doing logical comparisons.
    In this program, _CHARACTER is used in the array statement to represent all the
    character variables in the data set MIXED. Inspection of the following listing
    verifies that all lowercase values were changed to uppercase.


    # Listing of Data Set UPPER


    | a | b | c | d | e | x | y |

    |---|---|---|---|---|---|--|

    | M | F | P | P | D | 1 | 2 |

    | M | F | M | M | | 3 | 4 |


    # Function: LOWCASE


    **Purpose:** To change all letters to lowercase.


    **Syntax:** LOWCASE(character-value)


    character-value is any SAS value.


    > Note: The corresponding function UPCASE changes lowercase to uppercase.


    If a length has not been previously assigned, the length of the resulting variable
    will be the length of the argument.


    # Examples


    For these examples, CHAR = "ABCxyz".


    | Function | Returns |

    |---|---|

    | LOWCASE (CHAR) | "abcxyz" |

    | LOWCASE("A1%m?") | "a1%m?"'
