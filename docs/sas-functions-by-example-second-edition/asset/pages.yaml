  md: "# Functions: DIF and DIFn\n\nPurpose: To compute the difference between a value\
    \ in a current observation and a value from one or more previous observations.\
    \ Note that DIF (X) is equivalent to X - LAG (X).\n\nSyntax: DIF (value)\nDIFn\
    \ (value)\n\nvalue is any numeric variable.\n\nn is the number of lagged values.\
    \ LAG and LAG1 are equivalent.\n\nExamples\nFor these examples, the value of X\
    \ in the current observation is 9, the value of X in the previous observation\
    \ is 7, and the value of X in the observation previous to that is 5.\n\n| Function\
    \ | Returns |\n| DIF (X) | 2 |\n| DIF2 (X) | 4 |\n| DIF3 (X) | (missing) |\n\n\
    # Program 10.2: Computing changes in blood pressure from one visit to another\n\
    \n```\n***Primary function: DIF;\n***Create a test data set of patient visits;\n\
    ndata visits;\n  input Visit_date = mmddy10. SBP DBP @@;\n  format Visit_date\
    \ =date9;\n  label SBP = 'systolic blood pressure'\\n         DBP = 'diastolic\
    \ blood pressure';\nDBP =\n  1 02/01/2003 180 110 1 03/01/2003 178 100 1 04/01/2003\
    \ 170 90\n  2 03/03/2003 170 100 2 04/01/2003 172 100\n  3 04/01/2003 130 80 3\
    \ 06/01/2003 128 82 3 08/01/2003 128 78\n;\nproc sort data=visits;\n  by ID Visit_date;\n\
    run;\n```"
  merge: -1
  pgno: 344
- img_proc: true
  md: '***Program to compute changes between visits;

    data change;

    set visits;

    by ID;


    ***Delete any subject with only one visit;

    if first.ID then last.ID then delete;


    Diff_SBP = dif (SBP);

    Diff_DBP = dif (DBP);

    if not first.ID then output;

    nrun;


    title "Listing of Data Set CHANGE"

    proc print data=change noobs;

    run;


    # Explanation


    Notice that the DIF function is executed during every iteration of the DATA step.
    For the first visit for subject one (the first observation in VISITS), the value
    of the DIF function will be missing (the current value minus a missing value).
    For the second visit, the DIF function will take the current value of SBP (178)
    minus the value from the previous visit (180) and return a return value of -2.
    Now, what happens when the DATA step reaches the first visit for the second subject?
    It is actually computing the difference between the current value of SBP (170)
    and the value of SBP from the previous visit. This is OK. You need to execute
    the DIF function for every iteration of the DATA step. However, because of the
    IF NOT FIRST ID statement (a subsetting IF statement), the DATA step does not
    output an observation when it is processing the first visit for every patient.
    You need to delete any subject with only one visit or you will be computing the
    difference between his or her values and the last value from the previous subject.
    Notice that the values for the first visit for each patient are missing from the
    following list. (To learn more FIRST. and LAST variables, check out Longitudinal
    Data and SAS: A Programmer''s Guide, by this author.)'
  merge: -1
  pgno: 345
- img_proc: true
  md: "# 320 SAS Functions by Example, Second Edition\n\n| Listing of Data Set CHANGE\
    \ |\n| ID | Visit date | S | DBP | Diff_SBP | Diff_DBP |\n|---|---|---|---|---||\n\
    | 1 | 02MAR2003 | 178 | 100 | -2 | -10 |\n| 1 | 01APR2003 | 170 | 90 | -8 | -10\
    \ |\n| 2 | 01APR2003 | 172 | 100 | 2 | 0 |\n| 3 | 01JUN2003 | 128 | 82 | -2 |\
    \ 2 |\n| 3 | 01AUG2003 | 128 | 78 | 0 | -4 |\n\n# Program 10.3: Computing the\
    \ difference in blood pressure between the first and last visit for each patient\n\
    \n***Primary function: DIF;\n***This example uses the data set VISITS from the\
    \ example above;\nndata first_last;\nset visits;\nby ID;\n***Note: The DIF function\
    \ is being executed conditionally.\nBe VERY careful if you do this;\n***Delete\
    \ any subject with only one visit;\nif first.ID or last.ID then delete;\n\n```\n\
    if first.ID or last.ID then do;\n  Diff_SBP = dif(SBP);\n  Diff_DBP = dif(DBP);\n\
    end;\nif last.ID then output;\nrun;\n```\n\ntitle \"Listing of Data Set FIRST_LAST\"\
    ;\nproc print data=first_last noobs;\nrun;\n\n# Explanation\n\nThis example clearly\
    \ demonstrates what happens when you conditionally execute the DIF (LAG) function.\
    \ Note that the DIF function is executed only for the first or last visit for\
    \ each subject. The value obtained during the first visit is either the current\
    \ value minus a missing value (first subject) or the current value minus the last\
    \ value for the previous subject. This is necessary to \"prime the pump\" and\
    \ ensure that the next time the DIF function is executed, it will be computing\
    \ the difference between the first and last visit."
