    # Introduction


    The functions in this chapter address SAS data sets. There are functions to determine
    the number of observations in a data set, the number of character and numeric
    variables, and the formats and labels associated with each variable. You can readily
    obtain much of the same information produced by PROC CONTENTS by using these functions.


    If you need to obtain SAS variable information, the V functions are also available
    and may be more convenient to use. See Chapter 15, "Variable Information Functions."'
