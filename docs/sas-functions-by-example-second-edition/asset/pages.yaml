    **Function:** CALL PRXFREE


    **Purpose:** To free resources that were allocated to a Perl regular expression
    (usually used with a test for end-of-file). If you do not call PRXFREE, the resources
    will be freed when the DATA step ends.


    **Syntax:** CALL PRXFREE(pattern-id)


    pattern-id is the value returned from the PRXPARSE function.


    # Examples


