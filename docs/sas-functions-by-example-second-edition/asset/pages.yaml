    # FIND, FINDC, and FINDW


    This group of functions shares similarities to the INDEX, INDEXC, and INDEXW functions.
    FIND and INDEX both search a string for a substring. FINDC and INDEXC both search
    for string for individual characters. FINDW and INDEXW search for "words" (a string
    bounded by delimiters). However, all of the FIND functions have additional capability
    over their counterparts. For example, the set of FIND functions has the ability
    to declare a starting position for the search, set the direction of the search,
    and ignore case or trailing blanks.


    # Function: FIND


    Purpose: To locate a substring within a string. With optional arguments, you can
    define the starting point for the search, set the direction of the search, and
    ignore case or trailing blanks.


    Syntax: FIND(character-value, find-string <,''modifiers''> <,start>)


    ```

    character-value is any SAS character value.

    ```


    find-string is a character variable or string literal that contains one or more
    characters that you want to search for. The function returns the first position
    in the character-value that contains the find-string. If the find-string is not
    found, the function returns a 0.'
