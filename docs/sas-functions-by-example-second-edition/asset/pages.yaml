  md: '# SAS Functions by Example, Second Edition


    As a general class, there are Vname functions and VnameX functions. For example,
    there is a function called VTYPE and another function called VTYPE. The difference
    is that the Vname functions require a variable name as the argument; the VnameX
    functions can evaluate an expression to determine the variable name.


    I will not discuss the VnameX functions individually. A simple example is shown
    for VTYPE and VTYPX. Further, not all the V functions are discussed here. For
    information on some of the least frequently used functions, see SAS 9.2 Language
    Reference: Concepts in the Knowledge Base, available at http://support.sas.com/documentation.
    Note that the wording of arguments in this book might differ from the wording
    of arguments in the documentation.


    # Functions That Determine SAS Variable Information


    **Function:**


    **Purpose:** To determine if a variable is character or numeric.


    **Syntax:** VTYPE (**variable**)


    ```

    variable is the name of a SAS variable.

    ```


    > Note: By default, the result of this function is a character variable of length
    1. Values of "C" or "N" are returned for character and numeric variables, respectively.


    # Examples


    | Function | Returns |

    | --- | --- |

    | VTYPE (NUM) where NUM is a numeric variable | "N" |

    | VTYPE (CHAR) where CHAR is a character variable | "C" |


    See Program 15.2 for an example.'
