  md: '# Program 14.3: Determining the number of observations, variables, and other
    characteristics of a SAS data set using SAS I/O functions


    ***Primary functions: OPEN, ATTRC, ATRN, CLOSE;


    ```

    title;

    data _null;

    Dsid = open (''test1'');

    Any = attrn(Dsid, ''Any'');

    Nobs = attrn(Dsid, ''Nobs'');

    Nvars = attrn(Dsid, ''Nvars'');

    Label = attrc(Dsid, ''Label'');

    Engine = attrc(Dsid, ''Engine'');

    Charset = attrc(Dsid, ''Charset'');

    Dsn = name(Dsid);

    RC = close(Dsid);

    file print;

    put "Characteristics of Data Set Test " /

    "Dsid" = @11 Dsid /

    "Any" = @11 Any /

    "Nobs" = @11 Nobs /

    "Nvars" = @11 Nvars /

    "Label" = @11 Label /

    "Engine" = @11 Engine /

    "Charset" = @11 Charset /

    "Dsn" = @11 Dsn /

    "RC" = @11 RC /;

    run;

    ```


    # Explanation


    The OPEN function returns a data set ID that is used with the ATTRC and ATTRN
    functions to identify the data set for you want information. The ATTRN functions
    return very useful information about a SAS data set: whether there are any variables
    and/observations, the number of observations, and the number of variables. The
    ATRTR function is used to determine other information about the SAS data set that
    may be important in a large system where the data sets are created on different
    platforms and may use different coding (such as ANSI, ASCII, or EBCDIC) for storing
    character variables. It is important to close the data set when you are done.
    Data sets opened in a DATA step are automatically closed, but it is a good habit
    to close any data set as soon as possible. The listing produced by this program
    follows:'
