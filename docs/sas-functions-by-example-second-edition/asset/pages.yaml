    # Function: COUNTC


    **Purpose:** To count the number of individual characters that appear or do not
    appear in a string. With the use of a modifier, case can be ignored. Another modifier
    allows you to count characters that do not appear in the string. If no specified
    characters are found, the function returns a 0.


    **Syntax:** COUNTC (character-value, characters <,''modifiers''>)


    character-value is any SAS character value.


    characters is one or more characters to be counted. It may be a string literal
    (letters in quotation marks) or a character variable.


    The following modifiers, placed in quotation marks, may be used with COUNTC:


    +   - i or I ignore case.

    - o or O process the characters and modifiers only once. If the COUNTC function
    is used in the same DATA step, the previous character and modifier values are
    used and the current values are ignored.


    +   - t or T ignore trailing blanks in the character-value or the characters.
    Note that this modifier is especially important when looking for blanks or when
    you are using the v modifier.'
