    # CALL COMPOST, COMPGED, and COMPLEV


    The two functions COMPGED and COMPLEV are used to determine the similarity between
    two strings. The COMPOST CALL routine enables you to customize the scoring system
    when you are using the COMPGED function.


    COMPGED computes a quantity called generalized edit distance, which is useful
    in matching names that are not exactly the same. The larger the value, the more
    disimilar the two strings. COMPLEV performs a similar function but uses a method
    called the Levenshtein edit distance. It is more efficient than the generalized
    edit distance, but may not be as useful as name matching. See the SPEDIS function
    for a discussion of fuzzy merging and detailed programming examples.


    # Function: CALL COMPOST


    Purpose: To determine the similarity between two strings, using a method called
    the generalized edit distance. The cost is computed based on the difference between
    the two strings. For example, replacing one letter with another is assigned one
    cost and reversing two letters can be assigned another cost. Since there is a
    default cost associated with every operation used by COMPGED, you can use that
    function without using COMPOST at all. You need to call that function only in
    a DATA step. Since this is a very advanced and complicated routine, only a few
    examples of its use will be explained. For a complete list of operations and costs,
    see Product Documentation in the Knowledge Base, available at http://support.lists.com/documentation.'
