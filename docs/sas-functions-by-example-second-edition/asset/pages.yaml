  md: "# Program 11.1: Converting FIPS codes to state names and abbreviations\n\n\
    ***Primary functions: FIPNAME, FIPAMEL, and FIPSTATE;\n\n```\ndata fips;\n  input\
    \ Fips @@;\n  Upper_state = fipname(Fips);\n  Mixed_state = fipanel(Fips);\n \
    \ Abbrev = fipstate(Fips);\n datalines:\n  1 2 3 4 5 34 . 50 95 99\n  ;\ntitle\
    \ \"Listing of Data Set FIPS\"\nproc print data=fips noobs;\nrun;\n```\n\nExplanation\n\
    This straightforward program converts each of the FIPS codes to an uppercase and\
    \ a mixed case name well as a two-character state abbreviation. When the argument\
    \ for these functions is not a valid FIPS code (which range from 1 to 95, as of\
    \ this writing), the state name is \"INVALID CODE\" (either uppercase or mixed-case)\
    \ or dashes for the state abbreviation (for example, the FIPS code 3), FIPS codes\
    \ resulting in locations outside the U.S. result in territory names as values\
    \ and values of -- for the state abbreviations (for example, FIPS code 95). A\
    \ missing value produces blanks for all three values. Values greater than the\
    \ number of valid FIPS codes cause an error message to be printed to the log,\
    \ and missing values result from all three functions. You can verify this by inspecting\
    \ the:\n\nListing of Data Set FIPS\n\n| Fips | Upper_state | Mixed_state | Abbrev\
