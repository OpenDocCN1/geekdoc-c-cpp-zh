    # # Introduction


    This chapter covers five functions that involve rounding or truncation. TRUNC
    allows to perform logical comparisons on numerical values that were stored with
    fewer than 8 bytes. There is also a novel use of the ROUND function to place values
    into groups, such as an age group.


    There is a group of functions (CEILZ, FLOORZ, INTZ, and ROUNDZ) similar to the
    ones in this chapter, except that they do not “fuzzy” the result. Fuzzing the
    result means to return an integer value if the result is within 10⁻¹² of integer.'
