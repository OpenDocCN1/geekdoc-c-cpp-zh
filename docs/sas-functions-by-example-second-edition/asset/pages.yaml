  md: "# Functions That Round and Truncate Numerical Values\n\n**Function:** CEIL\n\
    \n**Purpose:** To round up to the next largest integer.\n\n**Syntax:** `CEIL(numeric-value)`\
    \ is any SAS numeric variable, expression, or numerical constant. For negative\
    \ arguments, the returned value is an integer between the number and zero (the\
    \ following examples). For positive arguments, the function returns just the portion\
