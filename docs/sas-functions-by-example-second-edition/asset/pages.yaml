  md: '160 SAS Functions by Example, Second Edition


    # **Function:** CALL PRXPOSN


    **Purpose:** To return the position and length for a capture buffer (a subexpression
    defined in the regular expression). Used in conjunction with PRXPARSE and one
    of the PRX search functions (such as PRMATCH).


    **Syntax:** CALL PRXPOSN(pattern-id, capture-buffer-number, start \<length>)


    pattern-id is the return value from the PRXPARSE function.


    capture-buffer-number is a number indicating which capture buffer is to be evaluated.


    start is the name of the variable that is assigned the first position in the string
    where the pattern from the nth capture buffer is found.


    length is the name of the variable, if specified, is assigned the length of the
    found pattern.


    Before we get to the examples and sample programs, let''s spend a moment discussing
    capture buffers. When you write a Perl regular expression, you can make pattern
    groups using parentheses. For example, the pattern: /(\d+)*\([a-zA-Z]+)/ has two
    capture buffers. The first matches one or more digits; the second match matches
    one or more upper- or lowercase letters. These two patterns are separated by zero
    or more blanks.


    # **Example**


    For these examples, the following lines of SAS code were submitted:


    ```

    PATTERN = PRXPARSE("/(\d+)*\([a-zA-Z]+)/);

    MATCH = PRMATCH(PATTERN, STRING);

    ```


