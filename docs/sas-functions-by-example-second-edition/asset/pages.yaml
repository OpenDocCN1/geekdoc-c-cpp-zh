  md: '# 6 SAS Functions by Example, Second Edition


    # Function: UPCASE


    Purpose: To change all letters to uppercase.


    > Note: The corresponding function LOWCASE changes uppercase to lowercase.


    # Syntax: UPCASE(character-value)


    character-value is any SAS character value.


    If a length has not been previously assigned, the length of the resulting variable
    will be the length of the argument.


    # Examples

    For these examples, CHAR = "ABCxyz".


    | Function | Returns |

    | UPCASE (CHAR) | "ABCXYZ" |

    | UPCASE("al%m") | "Al%m?" |


    # Program 1.3: Changing lowercase to uppercase for all character variables in
    a data set


    ```

    ***Primary function: UPCASE

    ***Other function: DIM;


    data mixed;

    length a b c d e $1;

    input a b c e x y;

    datalines;

    m f P p D 1 2

    m m f F M 3 4

    ;

    data upper;

    set mixed;

    array all_c[*] character _;

    do i = 1 to dim(all_c);

    all_c[i] = upcase(all_c[i]);

    end;

    drop i;

    run;

    ```'
