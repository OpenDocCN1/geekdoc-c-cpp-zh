  md: '# Chapter 4: Date and Time Functions 213


    # Program 4.10: Demonstrating the HOLIDAY function


    ```

    ***Primary function: HOLIDAY;

    ***Other functions: WEEKDAY, INTCK;

    data array;

    H1 = holiday(''Newyear'',2005);

    if weekday(H1) = 7 then H1 = H1 + 2;

    else if weekday(H1) = -1 then H1 = H1 + 1;

    H2 = holiday(''MDQ'',2005);

    H3 = holiday(''USpresidents'',2005);

    H4 = holiday(''Easter'',2005)-2;

    array H(4);

    First = ''01Jan2005d'' *Saturday;

    Second = ''31Mar2005d'' *Thursday;

    Work = intck(''weekday'',First,Second);

    /* if holiday falls between the First and Second date,

    decrement = number of working days */

    do i = 1 to 4;

    if First le H(i) le Second Work = Work - 1;

    end;

    Salary = 500 * Work;

    format First Second mmddy10. Salary dollar10.

    keep First Second Work Salary;


    run;

    title "Listing of SALARY"

    proc print data=SALARY noobs;

    run;

    ```


    # Explanation


    In this program, you want to compute the number of working days between January
    1, 2005 (Saturday) and March 31, 2005.


    The INTCK function with the WEEKDAY interval computes the number of times you
    cross working day boundaries from one to another (Monday through Friday being
    defined as the default working days).


    Note: Since the starting date is a Saturday, you do not have to add one to the
    value returned, because going from a weekend day to Monday crosses a boundary.
    If the starting date were not on a weekend, you would need to add one to the variable
    WORK. (Please see the explanation following the June 2009 calendar earlier in
    this chapter.)'
  merge: -1
  pgno: 239
