  md: "# 304 SAS Functions by Example, Second Edition\n\nThe program that follows\
    \ uses the RANNOR function to demonstrate how to run a Monte Carlo simulation\
    \ using SAS. Two groups are defined with their own mean, standard deviation, and\
    \ sample size. The program generates 1,000 sets of two samples, runs 1,000 t-tests\
    \ on the 1,000 samples, and uses the Output Delivery System (ODS) to capture the\
    \ p-values from each of these 1000 samples. From this, the power of the t-tests\
    \ can be determined. This same technique can be used with other distributions\
    \ or other statistical tests.\n\n# Program 9.11: Demonstrating a Monte Carlo simulation\
    \ to determine the power of a t-test\n\n```\n***Primary function: RANNOR;\n/****************************************************************/\n\
    Group 1:mean = 100 n = 8 standard deviation = 10\nGroup 2:mean = 115 n = 6 standard\
    \ deviation = 12\nScores are normally distributed in each group.\nThis program\
    \ generates 1000 samples;\n/************************************************/\n\
    data generate;\ndo Block = 1 to 1000;\n  do Group = 'A', 'B';\n    if Group =\
    \ 'A' then do Sub = 1 to 6;\n      x = rannor(123)*10 + 100;\n      output;\n\
    \    end;\n    else if Group = 'B' then do Sub = 1 to 8;\n      x = rannor(123)*12\
    \ + 115;\n      output;\n    end;\n  end;\nend;\nrun;\n\n***Test the distributions;\n\
    title \"Mean and Standard Deviation of the 1000 Samples\";nproc data=generate\
    \ n std;\nclass Group;\nvar x;\nrun;\n\n***run 1000 t-tests and capture the p-values;\n\
