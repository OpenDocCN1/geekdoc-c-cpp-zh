  md: '# Function That Defines a Regular Expression


    **Function: PRXPARSE**


    **Purpose:** This function returns a pattern identifier that is used later by
    the other Perl regular expression functions or CALL routines. The identifier numbers
    start at 1, and each time you invoke this function, the identifier number is incremented
    by 1.


    **Syntax:** *(Perl-regular-expression)*


    Perl-regular-expression is a Perl regular expression. See examples in the brief
    tutorial and the sample programs in this chapter. If the Perl-regular-expression
    is a constant, the Perl regular expression is compiled only once. Successive calls
    to PRXPARSE will not cause a recompile, but will return the regular-expression-id
    for the regular expression that was already compiled. You may choose to execute
    the PRXPARSE function only once by using the code `if _n_ = 1 then . . .` in case
    you will need to RETAIN the returned value. (See the following examples.)


    The forward slash (/) is the default delimiter. However, you can use any non-alphanumeric
    () character instead of /. Matching brackets can also be used as delimiters. Look
    at the last few examples that follow to see how other delimiters can be used.


    If you want the search to be case insensitive, you can follow the final delimiter
    with the letter i. For example, PRXPARSE("/cat/i") will match Cat, CAT, or cat
    (the fourth example).'
