    # ## Introduction


    This chapter focuses on the random number functions—functions that produce pseudo-random
    values according to a particular distribution. (Since computers can''t create
    truly random numbers, the term pseudo-random numbers is the technically correct
    description of any computer-generated series of numbers. However, in this chapter,
    we will go ahead and call these **random numbers.**)


    Only two of the older random number functions are described here along with the
    new (SAS9) RAND function that can generate random numbers that follow many of
    the well known probability distributions (such as uniform, normal, binomial, and
    Poisson). With the introduction of the RAND function, most of the older random
    number functions are not needed. The RAND function is also considered superior
    to the older functions, since it generates random numbers with a long period (where
    the sequence repeats) and with good statistical properties. If you would like
    to read a description of these older functions, please see Product Documentation
    in the Knowledge Base, available at http://support.sas.com/documentation.'
