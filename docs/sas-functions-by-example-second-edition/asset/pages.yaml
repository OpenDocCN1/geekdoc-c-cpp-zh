  md: '# Program 10.1: Using the LAGn functions to compute a moving average


    ***Primary functions: LAG and LAG2

    ***Other function: MEAN;


    ```

    ***Program to compute a moving average, based on three observations

    data moving:

    input x = 88;

    x1 = lag(x);

    x2 = lag(x);

    Moving = mean(x, x1, x2);

    if _n_ge 3 then output;

    datalines;

    1 3 9 5 7 10

    ;

    title "Listing of Data Set MOVING"

    proc print data=moving noobs;

    run;

    ```


    Explanation

    In the first iteration of the DATA step, X has a value of 1; X1 and X2 are both
    missing.

    During the second iteration of the DATA step, X has a value of 3, X1 is equal
    to 1, and X2 is missing. Finally, in the third iteration of the DATA step, X is
    equal to 9, X1 is equal to 3, and X2 is equal to 1. Since _N_ is now equal to
    3, the OUTPUT statement is executed, and the first observation in the data set
    MOVING is written out. See the following listing:


    | x | x1 | x2 | Moving |

    |---|---|---||}{

    | 9 | 3 | 1 | 4.33333 |

    | 5 | 9 | 3 | 5.66667 |

    | 7 | 5 | 9 | 7.00000 |

    | 10 | 7 | 5 | 7.33333 |'
