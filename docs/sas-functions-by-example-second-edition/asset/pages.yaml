  md: "# Introduction\n\nA major strength of SAS is its ability to work with character\
    \ data. The SAS character functions are essential to this. The collection of functions\
    \ and CALL routines in this chapter enable you to do extensive manipulation on\
    \ all sorts of character data.\n\nWith the introduction of SAS*, the number of\
    \ functions increased greatly (especially character functions). In addition, many\
    \ of the new character functions included arguments that refer to character classes\
    \ (such as all digits or punctuation), making them even more powerful.\n\nAfter\
    \ reading this chapter, you will also want to review the next chapter on Perl\
    \ regular expressions, another way to process character data.\n\nBefore delving\
    \ into the realm of character functions, it is important to understand how SAS\
    \ stores character data and how the length of character variables gets assigned.\n\
    \n# Storage Length for Character Variables\n\nIt is in the compile stage of the\
    \ DATA step that SAS variables are determined to be character or numeric, and\
    \ that the storage lengths of SAS variables are determined, and that the descriptor\
    \ portion of the SAS set is written. The following program will help you to understand\
    \ how character lengths are determined:\n\n# Program 1.1: How SAS determines storage\
    \ lengths of character variables\n\n```\ndata example;\n  input Group $;\n   \
    \ $10 String $3;\n    Left = ' ' *x and $4 blanks;\n    Right = ' ' *4 blanks\
    \ and x;\n  Sub = substr(Group,1,2);\n  Rep = repeat(Group,1);\ndatalines;\nABCDEFG\
    \ 123\nXXX 4\nY 5\n;\n```"
  merge: -1
  pgno: 29
- img_proc: true
  md: '# 4 SAS Functions by Example, Second Edition


    Explanation

    The purpose of this program is not to demonstrate SAS character functions. That
    is why the functions in this program are not printed in bold as they are in all
    the other programs in this book. Let''s look at each of the character variables
    created in this DATA step. To see the storage length for each of the variables
    in data set EXAMPLE1, let''s run PROC CONTENTS. Here is the program:


    # ### Program 1.2: Running PROC CONTENTS to determine storage lengths


    ```

    title "PROC CONTENTS for Data Set EXAMPLE1";nproc contents data=example1 varnum;

    run;

    ```


    The VARNUM option requests the variables to be in the order that they appear in
    the SAS data set, rather than the default, alphabetical order. The output is shown
    next:


    | Variables in Creation Order |

    | # | Variable | Type | Len |

    |---|---|---|---|

    | 1 | Group | Char | 8 |

    | 2 | String | Char | 3 |

    | 3 | Left | Char | 5 |

    | 4 | Right | Char | 5 |

    | 5 | Sub | Char | 8 |

    | 6 | Rep | Char | 200 |


    First, GROUP is read using list input. No informat used, so SAS will give the
    variable default length of 8. Since STRING is read with an inform, the length
    is set to the inform width of 3. LEFT and RIGHT are created with an assignment
    statement. Therefore the length of these variables is equal to the number of characters
    between the quotes. In this program, single quotes are used to create LEFT and
    RIGHT. The program would produce the same result if double quotes were used. In
    most cases, you can use either single or double quotes to create a character constant.
    Note that if a variable appears several times in a DATA step, its length is determined
    by the first reference to that variable.


    For example, beginning SAS programmers often get in trouble with statements with
    such as:


    ```

    if Sex = 1 then Gender = ''Male'';

    else if Sex = 2 then Gender = ''Female'';

    ```'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'The length of GENDER in the two previous lines is 4, since the statement in
    which the variable first appears defines its length.


    There are several ways to make sure a character variable is assigned the proper
    length. Probably the best way is to use a LENGTH statement, if you precede the
    two previous lines with the:


    ```

    length Gender $6;

    ```


    the length of GENDER will be 6, not 4. Some lazy programmers will "cheat" by adding
    two blanks after MALE in the assignment statement (me, never!). Another trick
    is to place the line for FEMALE first.


    So, continuing later on the last two variables. You sure a length of 8 for the
    variable SUB. As SUBSTR (substring) function can extract some or all of one string
    and assign the result to a new variable. Since SAS has to determine variables
    in the compile stage and since the SUBSTR define the starting point and the length
    of the subst could possibly be determined in the execution stage (from data values,
    example), SAS does the logical thing: it gives the variable defined by the SUBSTR
    function length it could possibly need—the length of the string from which you
    are taking the substring.


    Finally, the variable REP is created by using the REPEAT function. As you will
    find out later in this chapter, the REPEAT function takes a string and repeats
    it as many times as directed by the second argument to the function. Using the
    same logic as the SUBSTR function, since the length of REP is defined in the compile
    stage and since the number of repetitions could vary, SAS gives it a default length
    of 200. A note of historical interest: Prior to SAS 7, the maximum length of character
    variables was 200. With the coming of SAS 7, the maximum length of character variables
    was increased to 32,767. SAS made a very wise decision to leave the default length
    at 200 for situations such as the RE function described here. The take-home message
    is that you should always be sure that you know the lengths of your character
    variables.


    # Functions That Change the Case of Characters


    Two old functions, UPCASE and LOWCASE, change the case of characters. As of SAS⁹9,
    a new function, PROPCASE (proper case), capitalizes the first letter of each word.'
