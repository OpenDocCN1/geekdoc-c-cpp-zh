    input Name $ $10. Score;

    Category = ifc(Score GE 90)*Score, ''Excellent'', ''Below 90'', ''No Score'');

    datalines;

    ```


    Why does this work? The expression SCORE GE 90 is false when SCORE is missing.
    In order to make the logical expression missing when SCORE is missing, you can
    multiply the expression by SCORE. This way, when SCORE is missing, the expression
    also missing (and the function selects the fourth argument). What happens when
    SCORE is not missing? If it is below 90, SCORE GE 90 is false (0) and zero times
    SCORE is still false. If SCORE is greater than equal to 90, SCORE GE 90 is true
    (1) and 1 times SCORE is true since all numeric values that are not missing or
    equal to 0 are true.'
