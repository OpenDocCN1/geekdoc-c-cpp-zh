    \ point in the DATA step. Since two ARRAY statements follow a SET statement, the\
    \ _NUMERIC_ keyword will represent all the numeric variables in the MIXED data\
    \ set. In a similar manner, _CHARACTER will represent all the character variables\
    \ in the MIXED data set. (Remember that an array must consist of all or all numeric\
    \ variables.) Note that if two ARRAY statements were placed before the SET statement,\
    \ the arrays would have no elements. Since the asterisk (*) is used to represent\
    \ the number of elements in the two arrays (because it could be inconvenient to\
    \ use the DIM function to determine this number), it is convenient to use the\
    \ DIM function to determine this number.\n\nThe first DO loop starts from the\
    \ number one and ends with the number of numeric variables in the MIXED data set.\
    \ Inside the loop, you check to see if the value is equal to 999, in which case\
    \ you set the value to a SAS missing value. In a similar manner, the next DO loop\
    \ starts from the number one and ends with the number of character variables in\
    \ the data set MIXED. Notice the use of the UPPERCASE function to convert any\
    \ lowercase to uppercase. In any of upcase or lowercase values of 'NA' being set\
    \ to missing values. Here is a listing of data set ARRAY_1.\n\n# Listing of Data\
    \ Set ARRAY_1\n\n| X1 | X2 | X3 | X4 | X5 | A | B | Y | Z |\n|---|---|---|---|---|---|---|---|-|\n\
    | 1 | 2 | 3 | 4 | 5 | A | b | 6 | 7 |\n| 2 | . | 6 | 5 | 3 | C | . | 10 | |\n\
    | 5 | 4 | 3 | 2 | 1 | B | | | |"
