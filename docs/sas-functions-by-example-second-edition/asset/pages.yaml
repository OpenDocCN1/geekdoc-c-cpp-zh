  md: '# Chapter 4: Date and Time Functions 207


    # Program 4.8: Demonstrating the INTNX function (with the SAMEDAY alignment)


    *A dentist wants to see each of his patients in six months for a followup visit.
    However, if the date in six months falls on a Saturday or Sunday, he wants to
    pick a random day in the following week.


    ```

    data dental;

    input Patno = $5. Visit date = mmddyy10;

    format Visit_date weekdate;

    datalines;

    001 1/14/2009

    002 1/17/2009

    003 1/18/2009

    004 1/19/2009

    005 1/15/2009

    006 1/20/2009

    007 1/11/2009

    008 1/17/2009;


    title "Listing of data set DENTAL";

    proc print data=noobs;

    data followup;

    set dental;

    six_months = intnx(''month'',Visit_date, 6,''sameday'');

    *Check if weekend;

    DayWeek = weekday(six_months);

    *Keep track actual day for testing purposes;

    Actual = Six_months;

    *If Sunday add random integer between 1 and 5;

    elif DayWeek = 1

    six_months = Six_months + ceil(ranuni(0)*5);

    * Saturday, add a random integer between 2 and 7;

    elif DayWeek = 7

    six_months = Six_months + ceil(ranuni(0)*5 + 1);


    title "Six Month Appointment Dates";

    proc report data=followup now;

    columns Patno Visit_date Actual Six_months;

    def Patno / display "Patient Number" width=7;

    def Visit_date / display "Initial Date" width=15 format=weekdate;

    def Actual / display "Actual Day" width=15 format=weekdate;

    def Six_months / display "Six Month Appt." width=15 format=weekdate;

    ```'
