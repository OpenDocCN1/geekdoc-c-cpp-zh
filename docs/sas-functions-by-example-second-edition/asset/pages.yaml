    # Functions That Determine if SAS Data Sets Exist, and That Open and Close Files


    **Function:** EXIST


    **Purpose:** To determine if a SAS data set exists. This is useful prior to opening
    the data set and attempting to determine data set attributes. The function returns
    a 1 if the data set exists and a 0 otherwise.


    **Syntax:** `EXIST(member-name <, type>)`


    `member-name` is a SAS data set name, a view, or a SAS catalog.


    `type` is either data (default) or view.


    **Note:** See the documentation in the Knowledge Base, available at http://support.sas.com/documentation
    for a list of other data types.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Examples


    For these examples, TEST="MYLIB.MYDATA".


    | Function | Returns |

    | --- | --- |

    | EXIST(''MYLIB.MYDATA'') | 1 (if the data set exists), 0 otherwise |

    | EXIST(TEST, VIEW) | 1 (if the data view exists), 0 otherwise |


    See Program 14.2 for an example of the EXIST function.


    # Function: OPEN


    **Purpose:** To open a SAS data set and return a data set ID. An ID is necessary
    for many of the functions in this chapter. If the data set cannot be opened, OPEN
    returns a 0.


    **Syntax:** OPEN (data-set-name <, ''mode''>)


    data-set-name is a SAS data set name of the form libref.data-set-name.

    mode is an optional argument that indicates the type of access.


    +   - I is the default value and opens the file for input using random access
    if available.

    - IN opens the file with sequential access, allowing you to revisit observations.

    - IS opens the file with sequential access without allowing you to revisit observations.


    # Examples


    For these examples, TEST="MYLIB.MYDATA".


    | Function | Result |

    | --- | --- |

    | OPEN (TEST) | Opens MYLIB.MYDATA with random access |

    | OPEN (TEST, "IN") | Opens MYLIB.MYDATA with sequential access |

    | OPEN (''MYLIB.FRED'') | Opens permanent SAS data set MYLIB.FRED with random
    access |


    See Programs 14.2 and 14.3 for examples of the OPEN function.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Function: CLOSE


    Purpose: To close a SAS data set after it has been opened with the OPEN function.
    It is good practice to close data sets as soon as possible.


    Syntax: CLOSE(dsid)


    ```

    dsid is the data set ID returned by the OPEN function.

    ```


    Examples For this example, the statement DSID = OPEN("TEST"); was previously submitted.


    | Function | Returns |

    | CLOSE(DSID) | 0 (if the operation was successful) |


    See Programs 14.2 and 14.3 for examples of the CLOSE function.


    # Functions That Return SAS Data Set Characteristics


    The ATTR and ATTRN functions return information about a SAS data set. Instead
    of using the SAS data set name as one of the arguments in the function, a SAS
    data set ID (DSID) is used instead. The value of this ID is returned by the OPEN
    function. This value can be used as the DSID argument required by these functions.


    # Function: ATTR


    Purpose: To return various pieces of information concerning a SAS data set. The
    "C" in the function name refers to "character". The reason for that is that the
    various pieces of information obtainable by this function are character values.
    The data label, the engine used to access the data set, and the LIBREFB of the
    SAS library where the data set is stored.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '376 SAS Functions by Example, Second Edition


    # **Syntax:** ATTRC(dsid, ''attribute'')


    dsid is the set ID returned by the OPEN function.


    attribute is one of the following, placed in quotation marks.


    **Note:** This is not a complete list. See the documentation in the Knowledge
    Base, available at http://support.sas.com/documentation, for a complete list.


    +   * charset | returns a value for the character set of the machine that created
    the data set. Possible values are ASCII, EBCDIC, ANSI (OS/2 ANSI ASCII), and OEM
    (OS/2 OEM code format).


    +   * encrypt | returns ''YES'' or ''NO'' depending on whether the data set was
    encrypted.


    +   * engine | returns the name of the SAS engine needed to access the data set.


    +   * label | returns the SAS data label.


    +   * lib | returns the LIBREF of the SAS library where the data set is located.


    +   * sorted by | returns the names of the BY variables. If the data set is not
    sorted, the function returns an empty string.


    # **Examples**


    For these examples, the statement DSID = OPEN (TEST) ; was issued.


    | Function | Returns |

    | --- | --- |

    | ATTRC(DSID, ''LABEL'') | This is the data set label |

    | ATTRC(DSID, ''ENGINE'') | V9 |

    | ATTRC(DSID, ''CHARSET'') | ANSI |

    | ATTRC(DSID, ''ENCRYPT'') | NO |

    | ATTRC(DSID, ''SORTEDBY'') | SUBJ (if the data set was sorted) |


    See Program 14.3 for a sample program.'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'Chapter 14: SAS File I/O Functions 377


    # Function: ATTRN


    **Purpose:**  To return various pieces of information concerning a SAS data set.
    The "N" in the function name refers to the fact that this function returns numeric
    information concerning a SAS data set. Some of the more useful attributes returned
    by this function include whether there are any observations or variables in the
    data set, the number of observations and the number of variables, and whether
    the data set is password-protected.


    # **Syntax:** `ATTRN(dsid, ''attribute'')`


    *dsid* is the data set ID returned by the OPEN function.


    *attribute* is one of the following, placed in quotation marks.


    **Note:** This is not a complete list. See the documentation in the Knowledge
    Base, available at http://support.sas.com/documentation, for a complete list.


    +   - any indicates if the data set has observations and/or variables.


    +   - -1 indicates that there are no observations and no variables.


    +   - 0 indicates that there are no observations.


    +   - 1 indicates the data set has both observations and variables.


    +   - crdte is the creation date of the SAS data set as a date-time variable.


    +   - modte is the date the data set was last modified (also a date-time value).


    +   - nlobs is the number of logical observations (not including those marked
    to be deleted) and is unaffected by any WHERE clause that may be active. This
    is the attribute you will probably use, rather than either of the two that follow.'
  merge: -1
