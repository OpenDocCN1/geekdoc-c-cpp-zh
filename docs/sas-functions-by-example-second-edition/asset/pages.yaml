  md: '# Chapter 15: Variable Information Functions 401


    # Explanation


    The trick of using IF  (which is never true) allows you to determine variable
    information without having to actually read any data values from the data set.
    When the SET statement is compiled, the data set is opened and the variables in
    the data set are added to the DATA step PDV. During execution, the SET statement
    never executes. However, the PDV contains all the variables of the data set, so
    we can now enumerate all of them with CALL VNEXT.


    Notice that VAR_NAME and VAR_TYPE are both assigned lengths prior to calling VNEXT.
    Since VNEXT returns a blank value to the variable named in the first argument
    when there are no more variables to be read, it is used as a test to determine
    when to stop execution of the DO loop. Here is the listing of VAR_INFO:


    | Listing of Data Set VAR_INFO |

    | Var_name Var_type length |

    | Char | C | 1 |

    | y | N | 8 |

