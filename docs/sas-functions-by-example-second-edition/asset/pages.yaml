    # # A Function That Generates Random Numbers from a Wide Variety of Probability
    Distributions


    **Function:** RAND


    **Purpose:** To generate random numbers from any of dozens of probability distributions,
    including Uniform, Normal, and Binomial (see the following complete list).


    This function can perform all the actions of RANUNI and RANNOR as well as the
    other probability distributions. You may want to use this function instead of
    the two alternatives, since developers at SAS Institute feel that it does a better
    job of generating random values than its predecessors. According to the SAS 9.2
    Language Reference: Dictionary, Second Edition (2009);


    The RAND function uses the Mersenne-Twister random number generator (RNG) that
    was developed by Matsumoto and Nishimura (1998). The random number generator has
    a very long period (219937 – 1) and very good statistical properties.'
