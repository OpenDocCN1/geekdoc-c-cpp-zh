    # Explanation


    Before we discuss this program, the CALL SORT routine makes this very simple problem
    (see Program 3.1). In addition, the LARGEST function would also make for a much
    simpler solution. However, I have decided to include this more complicated program
    as a demonstration of how to use the ORDINAL function.


    This example was developed to compute grades for a course that I taught at the
    University of Medicine and Dentistry School of Public Health in New Jersey. Students
    in my biostatistics course took weekly quizzes. If they took all quizzes, I dropped
    the two lowest scores. If they missed one quiz, they got to drop the lowest score.
    If two or more quizzes were missed, no scores were dropped. Using the ORDINAL
    function is a great help with this problem. The term ORDINAL(1, OF QUIZ-QUIZ)
    returns the lowest (or missing) quiz score and the statement ORDINAL(2, OF QUIZ-QUIZ)
    returns the second lowest quiz score (including missing values).


    Therefore, if all 9 quizzes were taken, the quiz average is the total of all 9
    scores, minus the two lowest scores, divided by 7. If only 8 quizzes were taken,
    you subtract the second lowest quiz score (remember, the value of ORDINAL(1, OF
    QUIZ-QUIZ) will be a missing value in this situation) from the total and divide
    by 7. Finally, if the number of non-missing quiz scores is not 8 or 9, you compute
    the mean of the non-missing quiz scores using the MEAN function. You can inspect
    the following listing to see that this program works as desired:'
