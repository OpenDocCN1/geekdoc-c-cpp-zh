    PUT(YEAR, CODE.) is the character value "CODEA." If YEAR is 2, the PUT function
    returns "SCODEB." This value is then used in the INPUTC function. Reading an "A"
    using the CODEA informat results in the value "Office Chair." Reading an "A" using
    the SCODEB informat results in the value "Office Chair," etc. Here is a listing
