    # Program 2.5: Locating 5- or 9-digit ZIP codes in a list of addresses


    Here is an interesting problem that shows the power of regular expressions. You
    have a mailing list. Some addresses have three lines, some have four, and others
    have possibly more or less. The addresses have ZIP codes, some do not. The ZIP
    codes are either five or nine digits, a dash followed by four digits (ZIP + 4).
    Go through the file and extract all the valid ZIP codes.


    ***Primary functions: PRXPARSE AND CALL PRXSUBSTR

    ***other function: SUBSTRN;


    ```

    data zipcode;

    if _n = 1 then RE = prxparse("/ \d(5)(\-d(4))?");

    ain RE;

    /*

    Match a dash followed by 5 digits followed by

    either nothing or a 5 and 4 digits

    d(5)

    matches 5 digits

    matches a dash

    \d(4)

    matches 4 digits

    ?

    matches zero or one of the preceding subexpression

    */

    input String $80;

    length Zip.code $10;

    call prxsubstr(RE,String,Start,Length);

    if Start then do;

    Zip_code = substrn(String,Start + 1,Length - 1);

    ```'
