    **Function:** **VNAME**


    **Purpose:** To return the name of a SAS variable. It is most useful when you
    want to determine which variable a array element is referencing. Note that there
    is also a CALL routine with the same name that accomplishes the task.


    **Syntax:** **VNAME (variable-reference)**


