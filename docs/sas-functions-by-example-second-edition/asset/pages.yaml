    # Function: ROUND


    Purpose: To round a numerical value. The rounding can be to the nearest integer
    or to any desired value, such as to the nearest tenth or the nearest 10.


    Syntax: ROUND (numeric-value <, round-off-unit>)


    ```

    numeric-value is any SAS variable, numeric expression, or numeric constant.

    ```


    round-off-unit is a value to determine how the rounding should be done. If round-off-unit
    is omitted, the default round-off-unit is 1. A value of .1 will round to the nearest
    tenth. A value of 10 will round to the nearest 10.'
