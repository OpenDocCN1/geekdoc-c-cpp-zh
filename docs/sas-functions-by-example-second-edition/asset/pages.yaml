    # Function That Returns SAS Numerical Values Stored in Fewer than 8 Bytes


    **Function:** TRUNC


    **Purpose:** To allow you to make comparisons between numerical constants and
    SAS numerical values stored in fewer than 8 bytes. Note that this is necessary
    only for non-integer values. Be sure to refer to the system companion book for
    a chart that tells you the largest integer that can be expressed in $n$ bytes
    of storage.


    **Syntax:** TRUNC (*numeric-value, length*)


    *numeric-value* is any SAS variable, numeric expression, or numeric constant.


    *length* is an integer between 3 and 8, representing the number of bytes.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Examples


    | Function | Returns |

    | --- | --- |

    | TRUNC(3.,3) | 3.000000000000 |

    | TRUNC(3.,4) | 3.000000000000 |

    | TRUNC(3.,8) | 3.000000000000 |

    | TRUNC(3,1,3) | 3.099609375000 |

    | TRUNC(3,1,4) | 3.099984741211 |

    | TRUNC(3,1,8) | 3.100000000000 |


    # Program 6.7: Logical comparisons with numbers stored with fewer than 8 bytes
    of precision


    ```

    ***Primary function: TRUNC;


    data test;

    length x4 x8 x8;

    input x4 x8;

    datalines;

    1.234 1.234


    data test;

    set test;

    if x8 = 1.234 then Compare_x8 = ''True'';

    else Compare_x8 = ''False'';

    if x4 = 1.234 then Compare_x4 = ''True'';

    else Compare_x4 = ''False'';

    if x4 = trunc(3,1,4) then Compare_trunc_x4 = ''True'';

    else Compare_trunc_x4 = ''False'';

    run;


    title "Listing of Data Set TRTEST"

    proc print data=truncest noobs;

    run;

    ```


    # Explanation


    To understand what is going on here, you need to remember that all numerical values,
    regardless of their storage length, are extended to 8 bytes when they are brought
    into the PDV. When this happens, you lose precision. For example, if you store
    a numerical value in 4 bytes and it is brought into the PDV, SAS adds 4 bytes
    of zeros. If you then try to compare this value to a numerical constant, the values
    may not agree. In this program, the variables X4 and X8 are read from data set
    TEST. The value of X8 agrees with the numerical constant'
  merge: -1
