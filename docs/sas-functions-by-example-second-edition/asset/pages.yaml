    # Function: COMPRESS


    +   *Purpose: To remove specified characters from a character value. When used
    with the k modifier, compress can be used to keep characters (such as digits)
    in a character value and remove everything else.


    +   *Syntax: COMPRESS(character-value <,''compress-list'', ''modifiers''>)


    character-value is any SAS character value.


    compress-list is an optional list of the characters you want to remove. If this
    argument is omitted, the default character to be removed is a blank. If you include
    a list of characters to remove, only those characters will be removed (unless
    the ''k'' modifier is used). If a blank is not included in the list, blanks will
    not be removed.


    modifiers is an optional list of modifiers that refer to character classes. For
    example, the modifier refers to all uppercase and lowercase characters. The following
    are some of the most useful modifiers:'
