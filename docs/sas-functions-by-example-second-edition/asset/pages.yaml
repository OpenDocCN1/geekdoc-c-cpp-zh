  md: '# Functions That Convert FIPS Codes


    This group of functions takes a FIPS code as an argument and produces either an
    uppercase state name, a mixed-case state name, or a two-character standard state
    abbreviation.


    Function: FIPNAME


    Purpose: To convert a FIPS code to an uppercase state name.


    Syntax: FIPNAME (FIPS-code)


    FIPS-code is a numeric variable or an expression that represents a standard FIPS
    code.


    # Examples


    For these examples, FIPS1 = 27, FIPS2 = 2.


    | Function | Returns |

    | FIPNAME (FIPS1) | MINNESOTA |

    | FIPNAME (FIPS2) | ALASKA |

    | FIPNAME (34) | NEW JERSEY |

    | FIPNAME (999) | Error written to the SAS log |


    See Program 11.1 for a sample program.


    Function: FIPNAMEL


    Purpose: To convert a FIPS code to a mixed-case state name.


    Syntax: FIPNAMEL (FIPS-code)


    FIPS-code is a numeric variable or an expression that represents a standard FIPS
    code.'
