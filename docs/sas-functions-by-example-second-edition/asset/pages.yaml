  md: "# Chapter 7: Descriptive Statistics Functions 263\n\nOnce again, please remember\
    \ that with SAS 9.2, CALL SORTN will sort values in a list of variables. This\
    \ program was left in as a demonstration of the ORDINAL function and a simple\
    \ macro.\n\nThe sort macro presented in the following program will sort the values\
    \ for a set of variables and return the sorted values to the original variable\
    \ names. For example, if your original variables were X1-X10, the same ten variables\
    \ would have the values in sorted order after the macro ran. Here is the program:\n\
    \n# Program 7.13: Macro to sort values within an observation\n\n```\n***Primary\
    \ function: ORDINAL;\n\n*Note: CALL SORTN can be used to sort values within and\
    \ observation.\nThis program is included to provide another example of the ORDINAL\
    \ function as well as temporary arrays;\n\n%macro sort_array(Dsn,            /*\
    \ Data name */\n  Base=                 /* Prefix of variable name */\n  eg. if\
    \ variables are Ques-Q10,\n  Base would be Ques\n  N_of_elements=       /* Number\
    \ of variables */\n\ndata &Dsn;\nset &Dsn;\narray &Base[&N_of_elements] _temporary_;\n\
    ***transfer values to temporary array;\ndoi i=1 to &N_of_elements;\n  Temp[i]\
    \ = ordinal(i,of &Base&N_of_elements);\nend;\n\n**put back in the original variable\
    \ names in order;\ndoi i=1 to &N_of_elements;\n  &Base[i] = Temp[i];\nend;\ndrop\
    \ i;\nrun;\nmend sort_array;\n```\n\n# Explanation\n\nThis program uses a temporary\
    \ array as a place to hold the sorted values so that they can be placed back into\
    \ the original variable names. You could easily modify this program if you want\
    \ to preserve the original variables and create a new series of variables to hold\
    \ the sorted values. The following code shows the data set before the macro is\
    \ called, the macro call, and a listing of the data set after the sorting has\
