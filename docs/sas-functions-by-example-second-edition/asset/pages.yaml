    # Functions That Compute the Length of Strings


    The following four functions compute the length of character values. The LENGTH
    function (the oldest of the lot) does not count trailing blanks in its calculation.
    The LENGTH function is identical to the LENGTH function with one exception: if
    there is a null string (technically speaking, a string consisting of all blanks),
    the LENGTH function returns a value of 1 while the LENGTH function returns a value
    of 0. I would recommend using the LENGTH function as your general purpose length
    function in place of the older LENGTH function. The LENGTHC operates like the
    LENGTH function except it counts blanks in its computation. Finally, LENGTH computes
    the length used to store this variable in memory. In most applications, the LENGTH
    and LENGTHC return the same value. You may see some differences when working with
    macro variables. The LENGTHC function is a useful way to determine the storage
    length of a character variable (instead of using PROC CONTENTS, for example).


    **Function:** LENGTH


    **Purpose:** To determine the length of a character value, not counting trailing
    blanks. A null argument returns a value of 1.


    **Syntax:** LENGTH(character-value)


    ```

    character-value is any SAS character value.

    ```


    **Examples**

    For these examples, CHAR = "ABC".


    | Function | Returns |

    |---|---|

    | LENGTH("ABC") | 3 |

    | LENGTH(CHAR) | 3 |

    | LENGTH(" ") | 1 |'
