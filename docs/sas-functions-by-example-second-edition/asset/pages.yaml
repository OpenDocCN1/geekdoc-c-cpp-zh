    As the DATA step executes, the first value of N(1) is concatenated with the value
    ''&X'' and the result is the value ''&X1'', in turn is resolved to the value of
    the macro variable X1, which is 10. The subsequent iterations of the DATA step
    assign different values for the argument of the RESOLVE function. The result is
    the various values for the variable VALUE as shown in the following four lines
    from the SAS log.


    | n=1 Value=10 ERROR=_0 N_=1 |

    | n=3 Value=1000 ERROR=_0 N_=2 |

    | n=2 Value=100 ERROR=_0 N_=3 |

    | n=1 Value=10 ERROR=_0 N_=4 |


    # Function: CALL EXECUTE


    **Purpose:** This function allows you to execute a macro within a DATA step. For
    example, based on data values of DATA step, you can conditionally execute macros.
    Since CALL EXECUTE executes during the execution phase of the DATA step and since
    macro values are needed prior to DATA step execution, see the documentation in
    the Knowledge Base at http://support.sas.com/documentation or one of the books
    devoted specifically to macro programming for tips before you start.


    The SAS code generated by CALL EXECUTE executes when the DATA step completes.
    That is, if you use CALL EXECUTE to generate a PROC invocation, the PROC does
    not execute until the DATA step completes.


    **Syntax:** CALL EXECUTE (character-value)


    character-value is a character literal in quotation marks, the name of a SAS character
    variable, or a character expression that the DATA step resolves to a macro text
    expression or a SAS statement.


    # Examples


    For these examples, NAME = "%MYMACRO".'
