  md: '# Chapter 2: Perl Regular Expressions 147


    Perl regular expressions use special characters (called metacharacters) to represent
    classes of characters (named in honor of Will Rogers: "I never met a character
    I didn''t like.") Before we present a table of Perl expression metacharacters,
    it is instructive to introduce a few of the more useful ones. The expression \d
    refers to any digit (0-9), \D to any non-digit, and \w to any word character (A-Z,
    a-z, 0-9, and _). The repetition characters, +, and ? are particularly useful
    because they add quantity to a regular expression. For example, the * matches
    the preceding subexpression zero or more times; the + matches the previous subexpression
    one or more times; and the ? matches the previous expression zero or one times.
    So, here are a few examples using these characters:


    +   - PRXPARSE("/\d\d\d/") matches any three digits in a row.


    +   - PRXPARSE("/\w+\") matches one or more digits."


    +   - PRXPARSE("/\w\w\*") matches any word with two or more characters followed
    by a space.


    +   - PRXPARSE("/\w? +/") matches one or two word characters such as x, xy, or
    _X followed by one or more spaces.


    +   - PRXPARSE(\(/(\w) +(\d)/+") matches two characters, followed by one or more
    spaces, followed by a single digit, followed by one or more spaces. Note that
    the expression for the two word characters (\w) is placed in parentheses. Using
    the parentheses creates what is called a *capture buffer* (around the \d) creates
    the second capture buffer. Several of the Perl regular expression functions can
    make use of these buffers to extract and replace specific portions of a string.
    For example, the starting location of the two characters or the single digit can
    be obtained using the PRXPOSN function.


    The backslash, forward slash, parentheses, and several other characters have special
    meaning in a regular expression, you may wonder, how to search for a string that
    contains characters as \, (, (). You do this by preceding any of these special
    characters with a character (in Perl jargon called an escape character). So, to
    match a \w in a string, you code two backslashes like this: \\. To match an open
    parenthesis, you use \ (


    The following table describes several of the wild cards and metacharacters used
    with regular expressions:'
