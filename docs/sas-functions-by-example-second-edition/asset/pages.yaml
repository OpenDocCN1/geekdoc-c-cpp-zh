    # Explanation


    This program is an interesting application of the exclusive OR function to the
    science of cryptography. First, let me explain why the exclusive OR is so useful
    here. Suppose you have a binary string 11010000 and a key 10101010. If you use
    an exclusive OR between these two strings, you get: 01111010. What is interesting
    about this is that you can reverse the process by using the exclusive OR again
    with the encoded string and the key. Thus, the exclusive OR of the result 01111010
    and the key 10101010 is the original binary string, 11010000.


    Since this is only a demonstration program, the length of the text string was
    set to five. Obviously, you can expand this to anything you like. You can also
    use a longer key if you choose. By the way, the RETAIN statement is used to both
    keep the KEY value in the PDV (program data vector) for the duration of the program
    and to set its initial (and only) value to 173.


    Before you start to turn your text into code, use the SUBSTR function to place
    each of the letters in the original string into the elements of an array, one
    character to each variable. Since you want to turn text into code and bitwise
    logical functions work only on numerical arguments, use the RANK function to associate
    a number (the ASCII or EBCDIC coding sequence) with each of the letters. For example,
    an uppercase A is equal to 65, and B to 66, and so forth. The BXOR function is
    used to perform an exclusive OR with each of the numerical values and the KEY.
    So, if you want to be a spy, you can send the ENCODE data set to someone and make
    sure the recipient has the key. The encoded text looks like this:


    Encoded Message


    | xor1 | xor2 | xor3 | xor4 | xor5 |

    |---|---|---|---|--|

    | 236 | 239 | 238 | 233 | 232 |

    | 229 | 200 | 193 | 221 | 141 |'
  merge: -1
  pgno: 443
- img_proc: true
  md: "# 418 SAS Functions by Example, Second Edition\n\nThe decoding section of the\
    \ program is similar to the encoding section. The exclusive OR is performed on\
    \ every coded value and the key. The resulting letters are the original text,\
    \ and they are placed in the proper position in the new string using the SUBSTR\
    \ function on the left-hand side of the equal sign. This use (see Chapter 1) allows\
    \ you to place individual characters in any position of a character variable.\
    \ The decoded text is turned back to the original message and is shown here:\n\
    \n| Decoding output |\n| --- |\n| String |\n| ABCDE |\n| Help |\n\n# Encrypting\
    \ and Decrypting Macros\n\nThe two macros that follow are general purpose encrypting\
    \ and decrypting macros that make use of the exclusive OR function (BXOR) and\
    \ the uniform random number function. Rather using a single key to perform encryption,\
    \ the key is actually a random number seed which, generates a series of keys,\
    \ one for each character in the document to be encrypted. It turns out that if\
    \ you have a truly random key the same length as the document you want to encrypt,\
    \ it is theoretically unbreakable; in the spy business, high-security messages\
    \ can be transmitted using \"one-time pad\" (or so I'm told). The problem with\
    \ this system is that the recipient of the coded message needs to keep a copy\
    \ of the keys somewhere, in a safe, and it could be stolen or somehow compromised.\n\
    \nThe macros presented rely on the SAS random number function (RANUNI) to generate\
    \ a random, repeatable, sequence of keys. All that you need to reproduce the series\
    \ of random numbers is the seed value. So, this makes for a fairly secure code\
    \ if you choose a key with a large number of digits (say 9 or 10). Following the\
    \ two macros, there will be a fairly detailed explanation.\n\n# Program 16.3:\
    \ Writing general-purpose encrypting and decrypting macros\n\n***Primary functions:\
    \ BXOR, RANK, BYTE***\n***Other functions: SUBSTR (used on the left-hand side\
    \ of the equal sign), DIM, RANUNI;\n\n```\n%macro encode (Dsn=,\n  /* Name of\
    \ the SAS data set to hold the\n  encrypted message */\n  File_name=, /* The Name\
    \ of the raw data file that holds\n  plain text */\n```"
  merge: -1
  pgno: 444
- img_proc: true
  md: "# Chapter 16: Bitwise Logical Functions 419\n\nKey=\n* Number of your choice\
    \ which will be the\nseed for the random number generator. A\nlarge number is\
    \ preferable */\n\n```\n);\n%let len = 80;\ndata dsn;\narray [&len] $1 _temporary_;\
    \ /* each element holds a character\nof plain text */\narray num[&len] _temporary_;\
    \ /* a numerical equivalent for each\nletter */\narray xor[len]&key;\nretain key&key;\n\
    file \"&file_name\" pad; /* the coded value of each letter */\ndoi i = 1 to dim[i];\n\
    l[i] = substr(string,i,1);\nnum[i] = rank(l[i]);\nxor[i] = bxor(num[i],ranuni(key));\n\
    end;\nkeep xor&key;\nrun;\n%mend encode;\n```\n\n%macro decode(Dsn= /* Name of\
    \ the SAS data set to hold the\ncrypted message */\n A number that must match\
    \ the key of\nthe enciphered message */\n\n```\nKey=\n);\n%let Len = 80;\ndata\
    \ decode;\narray [&len] $1 _temporary_;\narray num[&len] _temporary_;\narray xor[&len];\n\
    retain key&key;\nlength String $&len;\n Dsn;\ndoi i = 1 to dim[i];\nnum[i] = bxor(xor[i],ranuni(key));\n\
    l[i] = byte(num[i]);\nsubstr(String,i,1) = l[i];\nend;\ndrop i;\nrun;\ntitle \"\
    Decoding Output\"\nproc print data=decode noobs;\nvar String;\nrun;\n%mend decode;\n\
    ```"
