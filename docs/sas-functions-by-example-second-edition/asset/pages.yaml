  md: '# # Chapter 13

    # Macro Functions


    Introduction 359


    +   - CALL SYMPUT 360

    - CALL SYMPTX 360

    - RESOLVE 363

    - CALL EXECUTE 365

    - SYMGET 368


    # ## Introduction


    This chapter covers only those macro functions that you can use during DATA step
    execution. These functions are discussed only briefly. If you want to learn more
    about these functions and the extensive set of functions used in the macro language,
    see the many fine books and reference materials currently available. *SAS Macro
    Programming Easy, Second Edition by Michele Burlele, Carpenter''s Complete Guide
    to the SAS Macro Language, Second Edition by Art Carpenter, and SAS 9.2 Macro
    Language*: Reference are highly recommended.


    Two of the macro routines, CALL SYMPUT and CALL SYMPTX, are used to assign the
    value of a DATA variable to an existing macro variable. You can also create a
    new macro variable and assign it a value during the execution of the DATA step.
    There are several differences between CALL SYMPUT and CALLSYMPTX, as follows.


    CALL SYMPTX left-justifies both arguments and trims trailing blanks. CALL SYMPUT
    does not left-justify the arguments and trims trailing blanks from the first argument
    only.


    CALL SYMPTX takes numeric values and formats them with the BEST32. format before
    placing them into a macro variable. CALL SYMPUT uses a field width of 12 characters.'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# 360 SAS Functions by Example, Second Edition


    CALL SYMPUT does not write a note to the SAS log when the second argument is numeric.
    CALL SYMPUT writes a note to the log stating that numeric values are converted
    to character values.


    CALL SYMPUT enables you to specify the symbol table in which to store the macro
    variable; CALL SYMPUT does not.


    **Function:** CALL SYMPUT


    **Purpose:** To assign a value to a macro variable during the execution of a DATA
    step.


    **Syntax:** CALL SYMPUT (macro-var, value)


    macro-var is the name of a new or existing macro variable. It is either a character
    literal in quotation marks, a character variable, or a character expression.


    value is a character literal, numeric character variable, or a DATA step expression.
    Note that if value is numeric, SAS will perform a numeric-to-character conversion
    and write a note to the SAS log.


    # Examples


    For these examples, CHAR = "BIGMAC" and STRING = "Hello".


    | Function | Returns |

    | --- | --- |

    | CALL SYMPUT (CHAR, STRING) | Macro variable BIGMAC has a value of the character
    string HELLO |

    | CALL SYMPUT("MAC", STRING) | Macro variable MAC has a value of the character
    string HELLO |

    | CALL SYMPUT("MAC", "Goodbye") | Macro variable MAC has a value of the character
    string Goodbye |


    **Function:** CALL SYMPUTX


    **Purpose:** To assign a value to a macro variable during the execution of a DATA
    step. Leading and trailing blanks are removed from the value before it is assigned
    to the macro variable.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Chapter 13: Macro Functions 361


    # Syntax: CALL SYMPUTX (macro-var, value <,symbol-table>)


    macro-var is the name of a new or existing macro variable. It is either a character
    literal in quotation marks, a character variable, or a character expression.


    value is a character literal, numeric or character variable, or DATA step expression.


    symbol-table is a character literal, variable, or expression. The first non-blank
    character in symbol-table specifies the symbol table which to store the macro
    variable. The following values are valid as the first non-blank character in symbol-table:


    +   - G stores the macro variable in the global symbol.

    - L stores the macro variable in the most local symbol that exists.

    - F stores the macro variable in the most local symbol table in which the macro
    variable exists, or if the macro variable does not exist, it stores in the most
    local symbol table.


    > Note: If you omit symbol-table, or if symbol-table is blank, CALL SYMPUTX stores
    the macro variable in the same symbol table as does the SYMPUTX routine.


    # Examples


    For these examples, CHAR = "BIGMAC" AND STRING = "Hello".


    | Function | Returns |

    |---|---|

    | CALL SYMPUTX (CHAR, STRING) | Macro variable BIGMAC has a value of the character
    string HELLO |

    | CALL SYMPUTX("MAC", STRING) | Macro variable MAC has a value of the character
    string HELLO |

    | CALL SYMPUTX("MAC", "Goodbye") | Macro variable MAC has a value of the character
    string Goodbye |'
