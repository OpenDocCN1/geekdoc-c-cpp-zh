    # INDEX, INDEXC, and INDEXW


    This group of functions all search string for a substring of one or more characters.
    INDEX and INDEXW are similar, the difference being that INDEXW looks for a word
    (defined as a string bounded by spaces or the beginning or end of the string),
    INDEX simply searches for the designated substring. INDEX searches for one or
    more individual characters and always searches from left to right. Note that these
    three functions are all case sensitive.


    All three of these functions have now been improved and replaced by FIND, FINDC,
    and FINDW. Since they were widely used in older programs. We highly recommend
    that in any new program, you use the group of FIND functions instead of the INDEX
    functions. The FIND functions can do anything the older INDEX functions did, plus
    they have the advantage of allowing you to specify a starting position and, especially
    important, use modifiers (my favorite is the i modifier to ignore case).'
