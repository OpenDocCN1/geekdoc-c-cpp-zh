  md: '# # Chapter 5

    Array Functions


    Introduction 219

    DIM 219

    HBOUND 223

    LBOUND 223


    # Introduction


    Although there are only three array functions, chances are you will need to use
    some or all of them if you use arrays in your programs. They are all used either
    to determine the number of elements in, or of the upper and lower bounds of, a
    SAS array.


    **Function:** DIM


    When you define an array, you can enter the number of elements in the array in
    parentheses (or square or curly brackets) following the array name or you use
    an asterisk (*) to indicate that you don''t care to count the number of elements
    (perhaps you are "counting challenged"). SAS programmers often use asterisk in
    place of the number of array elements when the list of variables is long or where
    they are using keywords such as `_CHARACTER_` or `_NUMERIC_` in the list of variables.
    However, when you want to use a DO loop to process all the elements of the array,
    you need to know the number of elements. Here is where the DIM function comes
    in handy. It returns the number of elements in an array, given the array name
    as its argument.'
  merge: -1
