  md: "# Program 1.42: A novel use of the SCAN function to convert mixed numbers to\
    \ decimal values\n\n***Primary function: SCAN\n***Other function: INPUT;\n\n```\n\
    data prices;\n  input @ Stock $3.\n  @ Mixed $6.\n  Integer = scan(Mixed,1,'/');\n\
    \  Numerator = scan(Mixed,2,'/');\n  Denominator = scan(Mixed,3,'/');\n  if missing(Numerator,Denominator)\
    \ then Value = input(Integer,8);\n  else Value = input(Integer,8.) + (input(Numerator,8.)\
    \ / input(Denominator,8.));\n  keep Mixed Value;\ndatalines;\nABC 14 3/8\nXYZ\
    \ 8\nTWW 5 1/8\ntitle \"Listing of Data Set PRICES\"\nproc print data=prices noobs;\n\
    ;\n```\n\n# Explanation\n\nThe SCAN function has many uses besides extracting\
    \ selected words from text expressions. In this program, you want to convert numbers\
    \ such as 25 5/8 into a decimal value (23.675). An elegant way to accomplish this\
    \ is to use the SCAN function to separate the mixed number into three parts: the\
    \ integer, the numerator of fraction, and the denominator. Once this is done,\
    \ all you need to do is convert each piece to a numerical value (using the INPUT\
    \ function) and add the integer to the fractional part. If the number being processed\
    \ has no fractional part, the SCAN function returns a missing value for the two\
    \ variables NUMERATOR and DENOMINATOR. Here is the listing:\n\nListing of Data\
    \ Set PRICES\n\n| Stock | Mixed | Value |\n|---|---|--|\n| ABC | 14 3/8 | 14.375\
    \ |\n| XYZ | 8 | 8.000 |\n| TWW | 5 1/8 | 5.125 |"
