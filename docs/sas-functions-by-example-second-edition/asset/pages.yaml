    # A Macro to Average Test Scores Where One or More of the Lowest Scores Are Dropped


    For any teachers reading this book, I have included a macro of my own to average
    any number of test scores you drop the lowest grade or grades from the calculation.
    This program does not give students zeros when they take fewer than the minimum
    number of quizzes. You may want to modify this program to penalize students taking
    fewer than the minimum number of quizzes. I think that the practice of dropping
    lowest grades keeps students motivated if they score poorly on one or two tests.


    Please note that with SAS 9.2, the CALL SORTN routine makes this problem even
    simpler (see Program 3.1).


    # Program 7.8: Macro to compute an average of n scores where the lowest m scores
    are dropped


    ```

    ***Primary functions: N, MIN, LARGEST;

    Macro: DROP_N

    Purpose: Takes the average of "n" scores by dropping the lowest "m" scores from
    the calculation.

    Arguments: Dsn

    Base: Base of variable name holding scores

    N: Total number of scores

    M drop: Number of scores to drop

    Varname: The name of the variable to hold the average

    Note: The average variable is added to the data set.

    Example: %macro drop_n(Quiz, N=2, Ndrop=2, Varname=Average);

    ```'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# 254 SAS Functions by Example, Second Edition


    ```

    %macro drop_n(Dsn, Base=, N, N_drop, Varname=);

    data &Dsn;

    set &Dsn;

    N_of_scores = n(of &Base.1-&Base&n);

    Min = min(N_scores, %eval(&N - &N_drop));

    Sum = 0;\do i = 1 to Min;

    Sum + Largest(i,of &Base.1-&Base&n);

    end;

    &Varname = Sum / Min;

    *replace min with %eval(&N - &N drop) to penalize

    students taking fewer than the minimum number of quizzes:

    drop i N_of_scores Sum Min;

    %mend drop_n;

    ```


    # Explanation


    As other macros in this book, only a brief explanation will be provided. The N
    function is used to determine the number of non-missing quiz scores. The MIN function
    finds the number of quizzes to include in the averaging process: either the total
    number of quizzes minus the number to be dropped or the number of non-missing
    quiz scores, whichever is smaller. The first argument in the LARGEST function
    is the nth largest value. Suppose there were 9 quizzes, and you want to drop the
    two lowest scores. If the student took all 9, the minimum of 9 and 7 is 7, the
    DO loop adds up the 7 highest scores. If the student took 8 quizzes, the DO loop
    also adds up the 7 highest (thus only one score being dropped). Finally, for any
    student taking 7 or fewer quizzes, the average is simply the average of all quizzes
    taken.


    **Note:** To give students zeros when they take fewer than the minimum number
    of quizzes, you just have to replace the denominator of the VARNAME statement
    with %EVAL (&N -N DROP) instead of MIN.


    To test this macro, use the following short DATA step to create a SAS data set
    (ROSTER). The macro is then invoked, using the 9 quiz grades in the computation.
    In this example, the lowest 2 quiz grades are to be dropped.'
  merge: -1
  pgno: 280
- img_proc: true
  md: "```\ndata roster;\n  input ID Quiz1-Quiz9;\ndatalines;\n  1 6 7 8 9 8 6 7 8\n\
    \  2 6 8 8 8 8 8 8 8\n  3 7 8 9\n  4 9 9 1 9 9 9 .\n```\n\nThe calling sequence\
