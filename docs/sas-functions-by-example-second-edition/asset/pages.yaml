    # Function: COUNTW


    # Purpose:


    To count the number of words in a character value. By using modifiers, you can
    alter how that function operates. If you do not specify delimiters, there is a
    set of defaults that are slightly different depending on whether you are using
    ASCII or EBCDIC (therefore, we recommend that you specify delimiters when you
    use this function.) If no occurrences of the substring are found, the function
    returns a 0.


    # Syntax:


    ```

    COUNTW(character-value <delim>, ''modifiers''>

    ```


    character-value is any SAS character value.


    delim is a list of delimiters. Note that if you use the k modifier, this list
    represents characters that are NOT delimiters.'
