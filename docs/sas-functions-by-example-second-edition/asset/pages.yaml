    # Function:


    # ANYALUM


    # Purpose:


    To locate the first occurrence of an alphanumeric character (any uppercase or
    lowercase letter) and return its position. If none is found, the function returns
    0. With the use of an optional parameter, this function can begin searching at
    any position in the string and can also search from right to left, if desired.


    # Syntax:


    ```

    ANYALUM (character-value <,start>)

    ```


    ```

    character-value is any SAS character value.

    ```


    start is an optional parameter that specifies the position in the string to begin
    the search. If it is omitted, the search starts at the beginning of the string.
    If it is non-zero, the search begins at the position in the string of the absolute
    value of the number (starting from the left-most position in the string). If the
    start value is positive, the search goes from right to left; if the value is negative,
    the search goes from right to left. A negative value larger than the length of
    the string results in a scan from right to left, starting at the end of the string.
    If the value of start is a positive number longer than the length of the string,
    or if it is 0, the function returns a 0.'
