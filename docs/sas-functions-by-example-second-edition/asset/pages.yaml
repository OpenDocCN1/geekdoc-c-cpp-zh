- img_proc: true
  md: 'Some of these distributions allow you to supply parameters. We only present
    the parameters for some of the more popular distributions. For a complete list,
    please see the Product Documentation in the Knowledge Base, available at http://support.sas.com/documentation.


    **Distribution:** Uniform

    **Optional Parameters:** none

    **Example:** RAND(''Uniform'',100,5) generates uniform random numbers between
    0 and 1.


    **Distribution:** Normal

    **Optional Parameters:** m (mean), s (standard deviation)

    **Example:** RAND(''Normal'',100,5) generates random numbers that are normally
    distributed with a mean of 100 and a standard deviation of 5.


    **Distribution:** Bernoulli

    **Optional Parameters:** p (probability of success (0 ≤ p ≤ 1))

    **Example:** RAND(''Bernoulli'',.4) generates 0s and 1s with the probability of
    a 1 equal to .4.


    **Distribution:** Binomial

    **Optional Parameters:** p (probability of success), n (the number of Bernoulli
    trials)

    **Example:** RAND(''Binomial'',.2,5) generates random numbers that represent the
    number of successes in a sample of size ''n'' where the probability of success
    is equal to .2.


    **Distribution:** Poisson

    **Optional Parameters:** m (mean)

    **Example:** RAND(''Poisson'',m,5) generates random integers that represent the
    number of successes when the mean of the Poisson distribution is 5.


    **Distribution:** T

    **Optional Parameters:** df (degrees of freedom)

    **Example:** RAND(''T'',10) generates random numbers from a t-distribution with
    10 degrees of freedom.'
