    # ## Two Macros to Assign n Subjects into k Groups


    For those who need to provide random assignments of subjects for experimental
    purposes, the following two macros are presented. The first macro performs a simple
    random assignment with an equal number of subjects in each group (providing that
    the total number of subjects is a multiple of the number of groups). The second
    macro performs the same function but goes one step further by randomizing subjects
    within blocks to attempt to avoid long runs of subjects assigned to the same group.
    Since these macros are included only as a convenience to those needing to perform
    this function, an explanation is not included.'
