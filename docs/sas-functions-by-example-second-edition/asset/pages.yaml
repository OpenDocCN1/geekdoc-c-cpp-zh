  md: '# Chapter 10: Special Functions 323


    The dates were read as character values (this happens frequently when you are
    importing dates from various databases or spreadsheets). The INPUT function allows
    you to "rere" these values using the correct SAS date format. Finally, the value
    with dollar signs and commas is converted to a numeric value by the comma format.
    Although not readily apparent, the dates in the following listing are true SAS
    dates that have been formatted using the MMDYYY.10 format.


    | C_num | Date1 | Date2 | Money |

    |---|---|---|-|

    | 123 | 10/21/1980 | 21OCT1980 | $123,000.45 |

    | XYZ | 11/11/2003 | 01JAN1960 | $123 |

    | |

    | Num | SASDate1 | SASDate2 | Dollar |

    | 123 | 10/21/1980 | 10/21/1980 | 123000.45 |

    | | 11/11/2003 | 01/01/1960 | 123.00 |


    If you examine the SAS log (shown next), you will see a note there that the character
    value of XYZ could not be read with a numeric informat.


    > NOTE: Invalid argument to function INPUT at line 203 column 10.

    C_NUM=XYZ DATE1=11/11/2003 DATE2=01JAN1960 MONEY=$123 NUM=

    SASDATE1=11/11/2003 SASDATE2=01/01/1960 DOLLAR=123 ERROR=_1 N_=2

    NOTE: Mathematical operations could not be performed at the following places.
    The results of the operations have been set to missing values.

    Each place is given by: (Number of times) at (Line):(Column).

    1 at 203


    To avoid error messages in the SAS log, you can use a ?? with the INPUT function,
