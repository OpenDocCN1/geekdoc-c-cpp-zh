  md: '# Chapter 4: Date and Time Functions 205


    The expression INTCK(''weekday'', ''08jun2009''d, ''12jun2009''d) returns a 4,
    even though there are 5 working days in the week. Remember, you are counting how
    many boundaries are crossed going from date 1 to date 2. Here, you cross a boundary
    on June 9, 10, 11, and 12 (4 boundaries).


    Now, see what happens if you start on June 7 instead of June 8. The expression
    INTCK(''weekday'', ''07jun2009''d, ''12jun2009''d) returns a 5, since you cross
    one boundary from Sunday to Monday. By the way, if you computed the interval from
    June 6 to June 12, the result would be a 5.


    Notice that it doesn''t matter if the ending date is a weekday or not. For example,
    INTCK(''weekday'', ''08jun2009''d, ''13jun2009''d) or INTCK(''weekday'', ''08jun2009''d,
    ''14jun2009''d) still returns a value of 4.


    # Function: INTNX


    Purpose: To return the date after a specified number of intervals has passed.


    Syntax: ''interval'', start-date, increment <,''alignment''>


    interval is one of the same values that are used with the INTCK function (placed
    in quotation marks).


    start-date is a SAS date.


    increment is the number of intervals between the start date and the date returned
    by the function.


    alignment is an optional argument and has a value of BEGINNING (B), MIDDLE (M),
    END (E), or SAMEDAY(S). The default is BEGINNING. For example, if the interval
    is WEEK, an increment of 1 from January 1, 1960, returns the date January 3, 1960
    (a Sunday, the beginning of a boundary). The same date and interval with an alignment
    of MIDDLE returns the date January 6, 1960 (a Wednesday, the middle of the interval).


    # Examples


    For these examples, DT1 = ''01JAN1960:7:5:12''DT.


    Note: Values in parentheses the Returns column are the formatted values.'
