    # Using the STD Function to Perform a t-Test


    This last section uses the STD function, with several others, to perform a t-test
    (a statistical test to compare the means of two groups) where all the values for
    one group are in one observation and all the values for the other group are in
    the next observation. In order to use PROC TTEST, a new data set would have to
    be created where each value was in a separate observation, along with the GROUP
    variable.'
