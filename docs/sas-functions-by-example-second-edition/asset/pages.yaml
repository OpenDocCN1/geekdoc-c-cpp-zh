    # Functions That Divide Strings into "Words"


    These extremely useful functions like CALL candivide a string into words. Words
    can be characters separated by blanks or other delimiters that you specify.


    # SCAN


    The SCAN function is the premier function that can separate parts of a character
    value. The most popular use of this function, at least by this author, is to obtain
    first, middle, and last names when they are all stored in a single variable (don''t
    you just hate that?). With the ability to define delimiters and with the addition
    of modifiers (SAS 9.2), this function is even more powerful.


    The first edition of this book included a discussion of the SCANQ function. This
    function has been dropped from this edition since all the features of SCANQ can
    be replicated by using the new (SAS 9.2) modifiers added to the SCAN function
    (especially the q and s modifiers).


    **Function:** SCAN


    **Purpose:** Extracts a specified word from a character value, where **word**
    is defined as the characters separated by a set of specified delimiters. The length
    of the returned variable is 200, unless previously defined.


    **Syntax:** `SCAN(char-value, n <, ''delimiters'', ''modifiers'')`'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# 98 SAS Functions by Example, Second Edition


    char-value is any SAS character value.


    n is the nth "word" in the string. If n is greater than the number of words, the
    SCAN function returns a missing value. If n is negative, the character value scanned
    from right to left. A value of zero is invalid.


    delimiters is an optional argument. If it is omitted, the default delimiters for
    ASCII environments (used on PCs and UNIX machines) as follows:


    ```

    blank . < (+ & ! $ * ) ; ^ - / , %

    ```


    For EBCDIC environments (used mainly on main-frame computers), the default delimiters
    as follows:


    ```

    blank . < (+ | ! $ * ) ; ~ / , % ◊

    ```


    If you specify any delimiters, only those delimiters will be active. Delimiters
    before the first word have no effect. Two or more contiguous delimiters are treated
    as one.


    modifiers (added in SAS 9.2) is an optional list of predefined characters that
    add either character classes (such as all digits) to the list of delimiters or
    reverse the way that delimiters are interpreted (see specifically, the k modifier).
    If you want to specify modifiers, you must also supply a list of delimiters. With
    the exception of the k and i modifiers, the character classes specified by the
    modifiers are interpreted as delimiters in addition to the ones you supplied in
    the list of delimiters.


    You can use the m modifier to change the way that successive delimiters and delimiters
    at the beginning or end of the string are interpreted. Without the m modifier,
    multiple successive delimiters are treated as a single delimiter, and delimiters
    at the beginning or end of the string are ignored. Using the m modifier treats
    successive delimiters as separating strings of zero length. For more details on
    the m modifiers, see Product Documentation in the Knowledge Base, available at
    http://support.sas.com/documentation.


    Note that modifiers were added in SAS 9.2.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'A partial list of modifiers:


    +   - a include all uppercase and lowercase letters.

    - c include control characters.

    - d include digits.

    - h include horizontal tabs.

    - i ignore case.

    - k use characters NOT in the delimiter list as delimiters.

    - l include lowercase characters.

    - m treat multiple successive delimiters differently (see the preceding explanation).

    - p include all punctuation.

    - s include all space characters (blanks, tabs, vertical and horizontal tabs).

    - u include uppercase characters.


    # Examples


    For these examples,


    ```

    STRING1 = "ABC DEF"

    STRING2 = "ONE?THREE+FOUR|FIVE"

    STRING3 = "abcdef2ghi"

    STRING4 = "123,,456"

    ```


    This is an ASCII example.


    | Function | Returns |

    |---|---|

    | SCAN (STRING1,2) | "DEF" |

    | SCAN (STRING1,-1) | "DEF" |

    | SCAN (STRING1,3) | missing value |

    | SCAN (STRING2,4) | "FIVE" (? is not a default delimiter) |

    | SCAN (STRING2,2," ") | "THREE+FOUR|FIVE" |

    | SCAN (STRING1,0) | an error in the SAS log |

    | SCAN (STRING3,2,"d") | "def" |

    | SCAN (STRING3,2,"ka") | "def" |

    | SCAN (STRING4,2," ") | "456" |

    | SCAN (STRING4,2,"m") | missing value (2 commas treated as two delimiters) |'
