  md: '# Function: SUBSTRN


    Purpose:


    This function serves the same purpose as the SUBSTR function with a few added
    features. Unlike the SUBSTR function, the starting position and the length arguments
    of the SUBSTRN function can be 0 or negative without causing an error. In particular,
    if the length is 0, the function returns a string of 0 length. This is particularly
    useful when you are using regular expression functions where the length parameter
    may be 0 when a pattern is not found (with the PRXSUBSTR function, for example).
    You can use the SUBSTRN function in any application where you would use the SUBSTR
    function. The effect of 0 or negative parameters is discussed in the following
    description of the arguments.


    Syntax:


    ```

    SUBSTRN (character-value, start <, length>)

    ```


    character-value is any SAS character variable.


    start is the starting position in the string. If this value is non-positive, the
    function returns a substring from the first character in character-value (the
    length of the substring will be computed by counting, starting from the value
    of start). See the following program.


    length is the number of characters in the substring. If this value is non-positive
    (in particular, 0), the function returns a string of length 0. If this argument
    is omitted, the SUBSTRN function will return all the characters from the start
    position to the end of the string.


    If a length has not been previously assigned, the length of the resulting variable
    will be the length of the character-value.


    # Examples


    For these examples, STRING = "ABCDE".


    | Function | Returns |

    | --- | --- |

    | SUBSTRN (STRING,2,3) | "BCD" |

    | SUBSTRN (STRING,-1,4) | "AB" |

    | SUBSTRN (STRING,4,5) | "DE" |

    | SUBSTRN (STRING,3,0) | string of zero length |'
