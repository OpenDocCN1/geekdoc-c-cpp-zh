  md: '# Program 2.9: Finding digits in random positions in an input string using

    CALL PRXNEXT


    ***Primary functions: PRXPARSE, CALL PRXNEXT**

    ***Other functions: LENGTH, INPUT;


    # Explanation


    The regular expression /d+/ says to look for one or more digits in a string. The
    initial value of START is set to 1 and STOP to the length of the string (not counting
    trailing blanks). The PRXNEXT function is called, the value of START is set to
    the position of the blank after the first number, and the value of STOP is set
    to the length of the string. POSITION is the starting position of the first digit,
    and LENGTH is the number of digits in the number. SUBSTR extracts the digits and
    the INPUT function does the character-to-numeric conversion. This continues until
    no more digits are found (POSITION = 0). See the following listing to confirm
    that the program worked as expected.'
