    : (colon) truncate the longer string to the length of the shorter string. Note
    that the default is to pad the shorter string with blanks before a comparison;
    this is similar to the =comparison operator.


    Note that the order of the modifiers is important. See the following examples.


    The function returns a 0 when the two strings match (after any modifiers are applied).
