    # Function: BAND


    +   Purpose: To perform a logical AND function between two bit strings. As a review,
    recall that the AND function between two logical variables is true (1) only when
    both arguments are true. It is false (0) otherwise.


    +   Syntax: BAND (numeric-value-one, numeric-value-two)


    > numeric-value-one is a numeric value that is zero or positive and is not missing.

    numeric-value-two has the same properties as numeric-value-one.


    # Examples


    For these examples, X = 5 (0101 in binary) and Y = 12 (1100 in binary).


    ```

    X = 0 1 0 1 = 5

    Y = 1 1 0 0 = 12

    BAND (X, Y) = 0 1 0 0 0 = 4

    ```


    | Function | Returns |

    | --- | --- |

    | BAND (X, Y) | 4 (0100 in binary) |'
