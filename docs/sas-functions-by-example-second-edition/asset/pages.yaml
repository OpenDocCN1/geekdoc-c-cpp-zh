  md: '# Functions That Remove Blanks from Strings


    There are times when you want to remove blanks from the beginning or end of a
    character string. The two functions LEFT and RIGHT merely shift the characters
    to the beginning or end of the string, respectively. TRIM, TRIMN, and STRIP functions
    are useful when you want to concatenate strings (although the concatenation functions
    will do this for you).


    # LEFT and RIGHT


    These two functions left- or right-align text. Remember that the length of a character
    variable will not change when you use these two. If there are blanks, the LEFT
    function will shift the first non-blank character to the first position and move
    the extra blanks to the end; if there are trailing blanks, the RIGHT function
    will shift the non-blank text to the right and move the extra blanks to the left.


    **Function:** LEFT


    **Purpose:** To left-align text values. A subtle but important point: LEFT doesn''t
    remove the leading blanks; it moves them to the end of the string. Thus, it doesn''t
    change the storage length of the variable, even when you assign the result of
    LEFT to a new variable. The LEFT function is particularly useful if values were
    read with the SCHAR informat, which preserves leading blanks. Note that the STRIP
    function removes both leading and trailing blanks from a string.


    **Syntax:** LEFT (character-value)


    ```

    character-value is any SAS character value.

    ```


    **Example**


    In these examples, STRING = "ABC".


    | Function | Returns |

    | --- | --- |

    | LEFT (STRING) | "ABC" |

    | LEFT (" 123 ") | "123" |'
  merge: -1
