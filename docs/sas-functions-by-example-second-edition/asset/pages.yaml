    | x | N | 8 |

    | a1 | N | 8 |

    | a2 | N | 8 |

    | a3 | N | 8 |

    | Date | N | 8 |

    | Var_name | C | 32 |

    | Var_type | C | 1 |

    | Var_length | N | 8 |

    | _ERROR_ | N | 8 |

    | _N_ | N | 8 |'
