  md: "# Chapter 7: Descriptive Statistics Functions 261\n\n# Explanation\n\nAlthough\
    \ this program is shorter than the previous program, it's actually a bit more\
    \ complicated. However, it is a good way to demonstrate the N, MIN, and ORDINAL\
    \ functions.\n\nThe number of quizzes taken is computed using the N function and\
    \ is assigned to the variable N OF QUIZZES. For each iteration of the DATA step,\
    \ the SUM is initialized to 0. The DO loop starts from 1 and ends at the number\
    \ of quizzes taken or the number 7, whichever is smaller. Next, each quiz score\
    \ is added to the SUM statement, starting from the highest quiz score to the lowest,\
    \ non-missing quiz score. The average is computed by dividing this sum by the\
    \ number of quizzes taken or the number 7, whichever is smaller. The output from\
    \ this program is identical to the output from Program 7.10 and will not be shown.\n\
    \n# Using the ORDINAL Function to Sort Values within an Observation\n\nAs of SAS\
    \ 9.2, the two CALL routines (CALL SORTN and CALL SORTC) provide a way to sort\
    \ values within an observation (Chapter 3). Therefore, it is no longer necessary\
    \ to write a program to accomplish this task. The program was left here as a good\
    \ demonstration of the ORDINAL function.\n\nThe program and macro in this section\
    \ use the ORDINAL function to sort numerical values within an observation. For\
    \ example, if you have variables X1-X10 and want to rearrange the variables that\
    \ X1 holds the lowest value, X2, the next lowest value, and so forth, you can\
    \ use this program to accomplish the task.\n\n# Program 7.12: Sorting values within\
    \ an observation\n\n```\n***Primary function: ORDINAL\n***Other functions: CALL\
    \ SORTN;\n\ndata sort;\n  input X1-X10;\n  array X[10] X1-X10;\n  array Sort[10]\
    \ Sort_x1-Sort_x10;\n  do i = 1 to 10;\n    Sort_x[i] = ordinal(i,of X1-X10);\n\
    \  end;\n  drop i;\n```"
  merge: -1
