    # Function: CALL PRXSUBSTR


    **Purpose:** Used with the PRXPARSE function to locate the starting position and
    length of a pattern within a string. The PRXSUBSTR CALL routine serves the same
    purpose as the PRXMATCH function, plus it returns the length of the match as well
    as the starting position.


    **Syntax:** `CALL PRXSUBSTR(pattern-id, string, start <length>)`


    `pattern-id` is the return code from the PRXPARSE function.


    `string` is the string to be searched.


    `start` is the name of the variable that is assigned the starting position of
    the pattern.


    `length` is the name of a variable, if specified, that is assigned the length
    of the substring. If no substring is found, the value of length is zero.


    Note: It is especially useful to use the SUBSTR function (instead of the SUBSTR
    function) following the call to PRXSUBSTR, since using a zero length as an argument
    of the SUBSTR function results in a character missing value instead of an error.'
