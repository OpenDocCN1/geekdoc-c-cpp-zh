  md: '# Commonly Used Mathematical Functions


    **Function:** CONSTANT


    **Purpose:** To compute numerical constants: (pi, e, and Euler’s constants) and
    to determine various mathematical constants (the largest integer stored in *n*
    bytes, the largest double-precision number, the smallest double-precision number
    (its log and square root), the machine precision constant). Also, the log and
    square root of the last three constants.


    **Syntax:** CONSTANT (''*constant*'' <*parm*)


    *constant*, placed in quotation marks, is one of the following:


    **Mathematical Constants**


    +   - e is the base of natural logarithms.

    - EULER is Euler’s constant.

    - PI is pi.


    **Machine Constants**


    +   - EXACTANT is the largest integer stored in *n* bytes (specified by *parm*
    = 2 to 8).

    - BIG is the largest double-precision number stored in 8 bytes on your computer.

    - LOGBIG is the log of BIG. The default base is E, but you can specify a base
    with *parm*.

    - SQRTBIG is the square root of BIG.

    -SMALL is the smallest double-precision number stored in 8 bytes on your computer.

    - LOGSMALL is the log of SMALL (base specified with *parm*).

    - SQRTSMALL is the square root of SMALL.


    **Machine Precision**


    +   - MACEPS is a machine-precision constant. This number is used to determine
    if one number is larger than another.

    - LOGMACEPS is the log of MACEPS (base specified with *parm*).

    - SQRTMACEPS is the square root of MACEPS.'
  merge: -1
