    # Program 1.6: Program to capitalize the first letter of each word in a string


    ***First and last name are Two separate variables;


    ```

    data proper;

    informat First Last $30;

    input First Last;

    length Name $ 60;

    Name = catx('' '', First, Last);

    Name = propcase(Name);

    datalines;

    ronald cODY

    THomaS EDISON

    albert einstein

    ;

    title "Listing of Data Set PROPER";

    proc print data=proper noobs;

    run;

    ```


    # Explanation


    In this program, the first and last names are stored in separate variables and
    you want a

    variable (NAME) that contains both first and last name (in proper case).


    The CATX function is used to concatenate the first and last name with a blank
    as the

    separator character. The PROPCASE function is then used to capitalize each name.
    The

    listing is identical to the preceding listing.'
