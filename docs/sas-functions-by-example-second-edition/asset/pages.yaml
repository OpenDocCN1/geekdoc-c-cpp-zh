    \ |\n| 5 | ARK | Arkansas | AR |\n| 34 | NEW JERSEY | New Jersey | NJ |\n| 50\
    \ | VERMONT | Vermont | VT |\n| 95 | PALMYRA ATOLL | Palmyra Atoll | |\n| 99 |\
    \ | | |"
