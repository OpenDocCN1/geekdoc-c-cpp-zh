  md: '# Three Inverse Trigonometric Functions


    These functions compute the inverse of the three basic trigonometric functions.
    Given a value, these functions compute an angle (expressed in radians).


    Function: ARCOS


    Purpose: To compute the inverse cosine and arccosine. The resulting angle is in
    radians. To convert from radians to degrees, multiply by the fraction (180/π).
    For example, the arccosine of .5 is 1.0472, which is equal to 60 degrees.


    Syntax: ARCOS(value)


    ```

    value is a numeric value between -1 and +1.

    ```


    Examples


    | Function | Returns |

    | --- | --- |

    | ARCOS (.5) | 1.0472 (60 degrees) |

    | ARCOS (1) | 0 |


    See Program 12.2 for a sample program.'
