  md: "# SAS Functions by Example, Second Edition\n\n| Function | Returns |\n| ---\
    \ | --- |\n| INPUT (N_CHAR, 3.) | 123 (numeric) |\n| INPUT (N_CHAR, 9.) | 123\
    \ (numeric) |\n| INPUT (CHAR_DATE, MMDYY10.) | 7599 (equals 10/21/1980) |\n\n\
    # Program 10.4: Using the INPUT function to perform character-to-numeric conversion\n\
    \n***Primary function: INPUT;\n***Create test data set;\n\ndata char;\n Num $Date\
    \ : $10. Date2 : $9. Money : $12.\ndatalines;\n123 10/21/1980 21OCT1980 $123,000.45\n\
    XYZ 11/11/2003 01JAN1960 $123\n\n```\ndata convert;\n set char(rename=(Num=C_num));\n\
    \ Num = input(C_num,9);\n SASdate = input(Date1,mmddyy10);\n SASdate2 = input(Date2,date9);\n\
    \ format SASdate SASdate2 mmddyy10;\nrun;\n```\n\ntitle \"Listing of Data Set\
    \ CONVERT\"\nproc print data=convert noobs;\nrun;\n\n# Explanation\n\nAll the\
    \ variables in the CHAR data set are character variables. Although you can force\
    \ SAS to 0, a character-to-numeric conversion by multiplying the character variable\
    \ by 1 or adding 0, it causes SAS to write messages to the log, and is considered\
    \ by most SAS programmers to be sloppy programming. In this example, the user\
    \ wanted to use the same variable name (NUM) for the numeric variable that was\
    \ in the CHAR data set as a character variable. The usual trick is to use the\
    \ RENAME= data set option to rename the character variable, which allows you to\
    \ keep the same name for the numeric equivalent. A SAS variable cannot be both\
    \ a character and a numeric value at the same time."
