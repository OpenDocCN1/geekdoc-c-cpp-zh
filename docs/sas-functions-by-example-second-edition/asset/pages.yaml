    # Function: MOD


    You probably have to think back to ninth grade to remember what modular arithmetic.
    The MOD function returns the remainder of one number when it is divided by another.
    For example, 5 mod 3 is 2; 15 mod 3 is 0, 16 mod 3 is 1, and so forth. Two applications
    of the MOD function are presented here: to select every m observation from a SAS
    data set, and the other, a programming trick to use the MOD function as a toggle
    switch, allowing you to alternate two activities.'
