    # Function: SOUNDEX


    The SOUNDEX function creates a phonetic equivalent of a text string to facilitate
    fuzzy matching. You can research the details of the SOUNDEX algorithm in the Product
    Documentation in the Knowledge Base, available at http://support.sas.com/documentation.
    Briefly, this algorithm makes all vowels equal, along with letters that sound
    the same (such C and K). One feature of this algorithm is that the first letters
    in both words must be the same to obtain a phonetic match.


    For those readers interested in the topic of fuzzy matching, there is an algorithm
    called NYISIS, similar to the SOUNDEX algorithm, that maintains vowel position
    information and allows mismatches on the initial letter. A copy of a macro to
    implement the NYISIS algorithm is available on the author pages for this book,
    located at http://support.sas.com/authors. (Select Ron Cody from the list of authors,
    find the Functions book, and then click the Example Code and Data. The NYISIS
    macro is included as one of the files you can download.)


    In addition, the SPEDIS, COMPGED, and COMPLEX functions, as well as the COMPCOST
    call routine for alternative matching algorithms.


    Purpose: To create a phonetic equivalent of a text string. Often used to attempt
    to match names where there might be some minor spelling differences.


    Syntax: SOUNDEX (character-value)


    ```

    character-value is any SAS character value.

    ```'
