    # # Introduction


    This group of functions allows you to convert between FIPS (Federal Information
    Processing Standards) codes, ZIP codes, two-digit state postal codes, and state
    names and abbreviations. For example, these functions let you store a ZIP code
    and print out a state name or abbreviation, computed from the code.


    Two functions added with SAS 9.2, GEODIST and ZIPCITYDISTANCE, compute distances
    between two sets of longitude and latitude or between two ZIP codes, respectively.'
