  md: "# Using the DIM Function with Multidimensional Arrays\n\nWhen you use the DIM\
    \ function with a multidimensional array, you have two choices:\n\nFirst, you\
    \ can append the name of the dimension that you are checking to the function name.\
    \ For example, you would use DIM2(array-name) to determine the number of elements\
    \ in the second dimension of an array.\n\nSecond, you can enter the array dimension\
    \ as the second argument of the DIM function. For example, you would use DIM(Mult,\
    \ 2) to determine the number of elements in the second dimension of an array.\n\
    \n# Functions: HBOUND and LBOUND\n\n+   **Purpose:** To determine the lower and\
    \ upper bounds of the array when the array do not run from l to n.\n\n+   **Syntax:**\
    \ HBOUND(array-name) or LBOUND(array-name)\n\narray-name is the name of any previously\
    \ defined SAS array.\n\nWhen you index your array starting from the number one\
    \ (the default), the DIM function works just fine. However, if you explicitly\
    \ set your subscripts to start from a number other than one (using a colon between\
    \ the lower and upper bounds of the array in the parentheses following the array\
    \ name), the HBOUND and LBOUND functions become useful. Remember that the DIM\
    \ function returns the number of elements, not the upper bound.\n\n# **Program\
    \ 5.3:** Determining the lower and upper bounds of the array where the array bounds\
    \ do not start from one\n\n***Primary functions: LBOUND and HBOUND;\n\n```\ndata\
    \ array_2;\n  array [1990:1995] Income1990-Income1995;\n  array [1990:1995] Tax1990-Tax1995;\n\
    \  input Income1990 - Income1995;\n  do Year = lbound(Income) to hbound(Income);\n\
    \    Tax[year] = .25 * Income(year);\n  end;\n  format Income: Tax: dollar8;\n\
    \  drop Year;\n```"
  merge: -1
  pgno: 249
