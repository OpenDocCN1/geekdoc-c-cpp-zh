    # Function: DHMS


    **Purpose:** To create a SAS datetime value from a SAS date value and a value
    for the hour, minute, and second.


    **Syntax:** DHMS (date, hour, minute, second)


    date is a SAS date value, either a variable or a date constant.


    hour is a numerical value for the hour of the day. If the hour is greater than
    24, the function will return the appropriate datetime value.


    minute is a numerical value for the number of minutes.


    second is a numerical value for the number of seconds.


    Values of the date value that are invalid result in a missing value, and an error
    message is written to the SAS log.


