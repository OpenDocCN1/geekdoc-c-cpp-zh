  md: '# Explanation


    The DATA step creates a data set consisting of 12 observations. Each observation
    has a subject number and a variable called GROUP, which is a random number between
    0 and 1. The heart of this program is PROC RANK. This procedure is commonly used
    to replace data values with their ranks. The smallest value is rank 1, the next
    smallest value rank 2, etc. When you add the GROUPS= option to PROC RANK, the
    procedure places all the observations into the number of groups you specify. In
    this program, where we have coded GROUPS=2, all values of GROUP below the median
    will be given the value of 0, and all values above the median will be given the
    value of 1 (Without the GROUPS= option, PROC RANK starts counting from 1; with
    the GROUPS= option, the groups begin at 0).


    So, the output data set created by PROC RANK now has a variable called GROUP with
    values of 0 and 1. The PRINT procedure applies the user-defined format GRPFMT
    to the GROUP variable so the listing consists of A''s and B''s. As long as there
    is an even number of subjects, this program can be used to randomly assign subjects
    to two groups with the same number of subjects in each group.


