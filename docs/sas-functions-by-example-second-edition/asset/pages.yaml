- img_proc: true
  md: '# Chapter 9: Random Number Functions 311


    If you want a reproducible series of random numbers using the RAND function, you
    must seed it by a call to STREAMINIT (with a positive integer argument) prior
    to its use. For example:


    ```

    call streaminit(132435);

    ```


    Place this call only once in the DATA step before the first use of the RAND function
    in the step.


    CALL STREAMINIT(0) (or negative values) will generate random values where the
    CPU clock is used to generate the first seed value (thus generating different
    series of random numbers each time the program is run.) This is the default action
    if you do not call STREAMINIT.


    # Syntax:


    RAND(distribution-name, <parameters>)


    distribution-name is the name of a probability distribution chosen from the following
    list:


    | Distribution | 1st Argument in Function |

    |---|---|

    | Bernoulli | BERNOULLI |

    | Beta | BETA |

    | Binomial | BINOMIAL |

    | Cauchy | CAUCHY |

    | Chi-Square | CHISQUARE |

    | Erlang | ERLANG |

    | Exponential | EXPONENTIAL |

    | F | F |

    | Gamma | GEOMETRIC |

    | Hypergeometric | HYPERGEOMETRIC |

    | Lognormal | LOGNORMAL |

    | Negative binomial | NEGBINOMIAL |

    | Normal | NORMAL,GAUSSIAN |

    | Poisson | POISSON |

    | T | T |

    | Tabled | TABLE |

    | Triangular | TRIANGLE |

    | Uniform | UNIFORM |

    | Weibull | WEIBULL |'
  merge: -1
