  md: "# Function: INPUTC\n\nThe next two functions in this group (INPUTC and INPUTN)\
    \ are similar to the INPUT function with one important difference: They can assign\
    \ the informat at run time. The INPUTC function is used for character informats\
    \ and the INPUTN function is used with numeric formats. These functions are useful\
    \ when you want to select an informat from information obtained from data itself.\n\
    \nPurpose: Similar to the INPUT function except that the character informat can\
    \ be assigned at run time.\n\nSyntax: INPUTC (value, char-informat)\n\nvalue is\
    \ a character variable or character expression.\n\nchar-informat is a SAS or user-defined\
    \ informat.\n\nExamples\nFor these examples, INFOR1 = \"$GENDER.\", INFOR2 = \"\
    $YESNO.\", VALUE1 = \"1\", and VALUE2 = \"2\" ($GENDER $YESNO are user defined\
    \ informats).\n\n| Function | Returns |\n| --- | --- |\n| INPUTC(VALUE1, INFOR1)\
    \ | \"Male\" |\n| INPUTC(VALUE2, INFOR2) | \"Yes\" |\n\n# Program 10.5: Using\
    \ the INPUTC function to specify an informat at run time\n\n```\n***Primary function:\
    \ INPUTC\n***Other functions: PUT;\n\nproc format;\n  value codea 'A' = 'Chair',\n\
    \       'B' = 'Desk',\n       'C' = 'Table',\n  value codeb 'A' = 'Office Chair',\n\
    \       'B' = 'Big Desk',\n       'C' = 'Coffee Table';\n\nvalue code 1 = '$codea.'\n\
    \     2 = '$codeb.';\n\nrun;\n```"
