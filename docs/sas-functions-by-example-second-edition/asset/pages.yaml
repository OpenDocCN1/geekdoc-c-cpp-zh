    # Functions That Count the Number of Letters or Substrings in a String


    The COUNT function counts the number of times a given substring appears in a string.
    COUNTC counts the number of times specific characters occur in a string. Finally,
    COUNTW counts the number of "words" (i.e. characters separated by delimiters)
    in a character value.


    +   **Function:** COUNT


    +   **Purpose:** To count the number of times a given substring appears in a string.
    With the use of a modifier, case can be ignored. If no occurrences of the substring
    are found, the function returns 0.


    +   **Syntax:** `COUNT(character-value, find-string <,''modifiers''>)`


    *character-value* is any SAS character value.


    *find-string* is a character variable or SAS string literal to be counted. The
    following *modifiers*, placed in single or double quotation marks, can be used
    with COUNT:'
