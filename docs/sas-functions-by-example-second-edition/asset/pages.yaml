  md: '# Function: BOR


    Purpose: To perform a logical OR function between two-bit strings. As a review,
    recall that the OR function between two logical variables is true (1) if either
    one or both arguments are true. It is false (0) otherwise.


    Syntax: BOR (numeric-value-one, numeric-value-two)


    numeric-value-one is a numeric value that is 0 or positive and is not missing.

    numeric-value-two has the same properties as numeric-value-one.


    # Examples


    For these examples, X = 5 (0101 in binary) and Y = 12 (1100 in binary).


    ```

    X = 0 1 0 1 = 5

    Y = 1 1 0 0 = 12

    BOR(X, Y) = 1 1 0 1 = 13

    ```


    | Function | Returns |

    | BOR(X, Y) | 13 (1101 in binary) |


    # Function: BXOR


    Purpose: To perform a exclusive OR function between two bit strings. As a review,
    recall that the exclusive OR function between two logical variables is true (1)
    if one (but not both) of the arguments is true. It is false (0) otherwise. (Actually,
    an exclusive OR is just an OR that resides in an upscale neighborhood.)


    Note: There are some interesting applications to encoding and decoding text messages
    using the exclusive OR function. These will be discussed following the encryption
    and decryption program.'
