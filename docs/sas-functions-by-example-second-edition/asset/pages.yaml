  md: '# # Preface to the Second Edition


    It is hard to believe that it''s over six years since the first edition of this
    book was published. Although the major changes in SAS functions come with SAS^9,
    many new functions have been added to SAS since then, as well as additional capability
    added to old functions (such as new arguments added to existing functions).


    In this edition, I removed the chapter on SAS regular expressions and updated
    the chapter on Perl expressions. I also added a new chapter on the TWO CALL routines
    that sort values within an observation (CALL SORTN and CALL SORTC). As you will
    see in the examples of these CALL routines, they can be extremely useful. In addition,
    features new to SAS 9.2 are noted.


    Indeed, SAS has so many functions that it is hard for you to decide which functions
    are indispensable and which ones you can do without. When I teach my Functions
    course, I like to list what I call the "blockbuster" functions—those that change
    the way we program. Here are a few of my favorites:


    The MISSING function takes either a character or numeric argument and returns
    a value of True if the argument is a missing value, and False otherwise. I no
    longer write statements such as


    ```

    if Age = . then Age_group = . ;

    ```


    Instead, I write


    ```

    if missing(Age) then Age_group = . ;

    ```


    or even,


    ```

    if missing(Age) then call missing (Age_group) ;

    ```


    Several others come to mind: The COMPRESS function with modifiers such as ''kd''
    is also one of my favorites (take a look at some of the examples of this function
    in Chapter 1). The SAMEDAY argument to the INTNX function adds huge functionality
    to this function (along with the new'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'xx


    HOLIDAY function). I also recommend to all my students that they use the three
    FIND functions (FIND, FINDC, and FINDW) instead of the older INDEX functions.
    I used to think the concatenation functions were not all that useful; I have changed
    my mind about that. I use them all the time.


    I hope you find your personal favorites in this book.


    Ron Cody

    Winter, 2010'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Preface to the First Edition


    SAS functions provide some of the real power of SAS. This book covers almost two
    hundred of the most common and useful functions and call routines—I did not attempt
    to describe every one. Unlike SAS language manuals or other reference materials
    where SAS functions are merely described, this book shows you the functions and
    one more examples of how they can be used. These examples are complete working
    programs. Sometimes the examples demonstrate a common usage of the function; at
    other times, the use is non-traditional, but still very practical. Some of the
    examples show how several functions can be used in combination to produce a desired
    result.


    This book contains useful information for veteran SAS users as well. For example,
    SAS now supports Perl regular expressions. In addition, new arguments have been
    added to old functions (such as COMPRESS and SCAN) that enhance their usefulness.


    One of the strengths of SAS is its ability to manipulate character data. You will
    find extensive examples of character manipulation in this book. For example, there
    are complete programs to perform "fuzzy matching" using a combination of functions,
    including the SPEDIS (distance) function.


    For those who are statistically inclined, there are examples of random number
    functions performing Monte Carlo simulations, including the use of the SAS Output
    Delivery System (ODS) to capture values from a procedure to a SAS data set.


    I have decided to use the same functions described in the latest version of the
    SAS OnlineDoc. Because some of these functions have other important uses the obvious
    one described by its category, I have provided two lists to look you up a function
    by name, and by program. There is also a traditional index that includes functions
