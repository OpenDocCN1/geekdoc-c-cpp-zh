    # Explanation


    This program is similar to the previous (SOUNDEX) example. Instead of creating
    a new variable in each data set that is the SOUNDEX value of the name, this program
    uses PROC SQL to create the Cartesian product (the combination of every observation
    in one data set with every observation in the second data set). The WHERE clause
    tests whether the spelling distance between the two names is less than or equal
    to 15. In addition, exact matches are removed by specifying that the spelling
    distance must be greater than zero. Also, the PROPCASE function is used in case
