- img_proc: true
  md: '# SAS Functions by Example, Second Edition


    Here is a sample calling sequence:


    ```

    %encode (Dsn-code, File_name=c:\books\functions\plaintext.txt,

    key=17614353)

    %decode (Dsn-code, Key=17614353)

    ```


    # Explanation


    The calling arguments are the name of the output SAS data set that will hold the
    coded message; the full path and filename of the raw, plain text message; and
    a key value (which is really the seed for the random number function).


    To make the program easier to adapt, I assigned the maximum length of each line
    of text to a macro variable (LEN). If you want, you could just replace the &LEN
    values in the macro with a fixed value, such as 80.


    The L array stores each of the individual characters in the plain text. The NUM
    array assigns a numerical equivalent to each of the character values, using the
    RANK function. The BXOR function performs an exclusive OR between each of the
    numerical values and a random number generated using the RANUNI function (and
    seeded with the KEY value). Since you dont need any of the L or NUM variables
    in the data set, these arrays are defined as _TEMPORARY_ to make the program more
    efficient.


    The resulting data set is what you can transmit to your spy friends. Hopefully,
    you have arranged for him or her to know the value of the key. Perhaps the key
    value can be computed from the date in some manner.


    The deciphering macro just reverses the process. Here, you use the same seed for
    the random number function, so you generate the same series of random numbers.
    I suspect that the random series may be system dependent, so on PCs or mainframes,
    etc. Also, you need to be sure that both systems use the same coding system (ASCII
    or EBCDIC).


    Once the DECODE macro has computed the numerical values for each letter, the BYTE
    function (inverse of the RANK function) turns these back into the plain text letters.
    Finally, the SUBSTR function places each of these characters in the proper position
    in the STRING variable. I have no idea whether the NSA and their super could break
    this code easily or not. But, if they didn''t run SAS on their machines, they
    would have lots of problems!


    Anyway, I hope you enjoyed this novel use of the BXOR function. I had a lot of
    fun writing it!'
  merge: -1
