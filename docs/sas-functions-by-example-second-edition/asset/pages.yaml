    \ single blank. The COMPRESS function can remove not only blanks, but also any\
    \ characters you specify from a string.\n\n# ### Function: COMPBL\n\n**Purpose:**\
    \ To replace all occurrences of two or more blanks with a single character. This\
    \ is particularly useful for standardizing addresses and names where multiple\
    \ blanks may have been entered.\n\n# ### Syntax: COMPBL(character-value)\n\n`character-value`\
    \ is any SAS character.\n\nIf a length has not been previously assigned, the length\
    \ of the resulting variable will be the length of the argument.\n\n# ### Example\n\
    \nFor these examples, CHAR = \"A C XYZ\".\n\n| Function | Returns |\n| --- | ---\
    \ |\n| COMPBL(CHAR) | \"A C XYZ\" |\n| COMPBL(\"X Y Z LAST\") | \"X Y Z LAST\"\
    \ |\n\n# ### Program 1.7: Using the COMPBL function to convert multiple blanks\
    \ to a single blank\n\n```\n***Primary function: COMPBL;\n\ndata squeeze;\n  input\
