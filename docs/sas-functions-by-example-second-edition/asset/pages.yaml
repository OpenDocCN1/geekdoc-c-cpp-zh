- img_proc: true
  md: '# Explanation


    Since each group of values resides within a single observation, the SAS automatic
    variable _N allows you to determine if you are reading the first or second line
    of data. The three descriptive statistics functions N, MEAN, and STD compute the
    number of non-missing values, the mean, and the standard deviation, respectively.
    After these values have been computed for the second group, the steps to compute
    a t-value are performed. The SQRT function takes the square root of its argument.
    The ABS function takes the absolute value of the difference so that our t-value
    will always be positive. Finally, in order to print out the two-tailed p-value
    (the famous p-value that all researchers hope is less than .05), the PROBT function
    is used. This function computes the cumulative probability under the t distribution.
    Here is the output from this program:


    | T-Test Calculation |

    | Group A: N = 7 Mean = 6.000 SD = 1.4142 |

    | Group B: N = 9 Mean = 8.222 SD = 1.4814 |

    | Difference = -2.222 T = 3.0349 P(2-tail) = 0.0089 |'
