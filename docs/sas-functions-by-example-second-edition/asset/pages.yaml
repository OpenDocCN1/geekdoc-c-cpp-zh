    # Function: COALESCE


    Purpose: To select the first non-missing value in a list of numeric arguments.
    Function is similar to the COALESCEC function that handles character arguments.


    Syntax: COALESCE(<l> Num-1, <Num-2, ...>)


    Num-1, Num-n are numeric values or expressions. The COALESCE function returns
    the value of the first non-missing argument. If all the arguments have missing
    values, the function returns a missing value. If you use a list of variables in
    the form Var1-Varn, you need to precede the list with the word "of".


    # Examples


    For these examples, X=100, Y = (missing), Z = 300 Ques1 = . , Ques2 = 5, Ques3
    = 8


    | Function | Returns |

    |---|--|

    | COALESCE(X, Y, Z) | 100 |

    | COALESCE(Y, Z, X) | 300 |

    | COALESCE(of Ques1-Ques3)) | 5 |


    # Program 8.10: Demonstrating the COALESCE function


    ```

    ***Primary function: COALESCE

    data weigh_in;

    input Name = $Time-Time3;

    Weight = coalesce(of Time-Time3);

    datalines;

    John 180 .

    Fred. 250

    Gary . 350

    Peter 200 .

    ;

    title "Listing of data set WEIGH_IN";nproc print data=weigh_in noobs;

    run;

    ```'
