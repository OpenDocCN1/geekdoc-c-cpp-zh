  md: "# 14 SAS Functions by Example, Second Edition\n\ntitle 'Listing of Data Set\
    \ PHONE_NUMBER';\nproc print data=phone_number;\nrun;\n\nExplanation\nFor the\
    \ variable PHONE1, the second argument is omitted from the COMPRESS function;\
    \ therefore, only blanks are removed. For PHONE2, left and right parentheses,\
    \ dashes, and blanks are listed in the second argument, all of these are removed\
    \ from the character value. For PHONE3, the two modifiers k (keep) and d (digits)\
    \ are used to keep all the digits in the PHONE value and remove everything else.\
    \ Note that there are commas following the first argument. If you used only one\
    \ comma, SAS would think you wanted to remove k from the PHONE value. Even though\
    \ the results for PHONE2 and PHONE3 are identical, it is usually better to specify\
    \ what you want to keep rather than what you want to remove. Why? Suppose your\
    \ original PHONE value contained some unwanted character such as a punctuation\
    \ mark or a non-printing character. Using the k and d modifiers ensures that you\
    \ use only digits in the result.\n\nThe following list shows the output:\n\nListing\
    \ of Data Set PHONE_NUMBER\n| Obs | Phone | Phone2 | Phone3 |\n|---|---|---|---|\n\
    | 1 | (908)235-4490 | 9082354490 | 9082354490 |\n| 2 | (201)555-77 99 | 2015557799\
    \ | 2015557799 |\n\n# Converting Social Security Numbers to Numeric Form\n\nHere\
    \ is another example where the COMPRESS function makes it easy to convert a standard\
