  md: "# Program 5.2: Creating a macro to compute and print out the number of numeric\
    \ and character variables in a SAS data set\n\n```\n***Primary function DIM;\n\
    %macro count(Dsn=/Data set name*/);\ntitle \"****statistics for data set &dsn\
    \ **\\*\";ndata null;\n  if 0 then set &dsn;\n    array nums[*][_numeric_;\n \
    \   array chars[*][_character_;\n    n_nums = dim(nums);\n    n_chars = dim(chars);\n\
    \  file print;\n  put / \"There are \" n_nums \" numeric variables and \"\n  n_chars\
    \ \" character variables\";\n  stop;\n  run;\n%end count;\n```\n\nExplanation\n\
    This macro uses an interesting trick to determine the number of numeric and character\
    \ variables in a SAS data set—that is, the strange-looking conditional SET statement.\
    \ The SET statement follows an IF statement (IF 0) that is never true, so the\
    \ data values are never read. You would think that nothing useful could come from\
    \ such a statement. However, during the compile stage, SAS performs certain operations,\
    \ one being the evaluation of the list of numeric and character variables in the\
    \ data set listed in the SET statement.(Veteran SAS programmers often use the\
    \ trick of a conditional SET statement to determine the number of observations\
    \ in a SAS data set using the NOBS=option in the SET statement.) Even though the\
    \ statement is never executed in the execution stage, the two arrays defined by\
    \ the _NUMERIC_ and _CHARACTER_ keywords are properly assigned, and the DIM function\
    \ determines the number of elements in each of the two arrays. To test this macro,\
    \ we can call it like this:\n\n```\n%COUNT(Dsn=array_1)\n```\n\nwith the result\
    \ listed next:\n\n> *** statistics for data set array_1 ***\nThere are 7 numeric\
    \ variables and 2 character variables"
  merge: -1
