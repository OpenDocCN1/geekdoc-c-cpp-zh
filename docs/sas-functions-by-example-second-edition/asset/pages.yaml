    The three concatenation CALL routines each perform concatenation operations. The
    CATS routine strip leading and trailing blanks; the CATT routine removes trailing
    blanks before performing the concatenation; the CATX CALL routine is similar to
    the CATS CALL routine except that it inserts a separator character (specified
    as the first argument) between each of the concatenated strings.


    According to SAS, the CALL routines are more efficient to use than the concatenation
    operator combined with the TRIM and LEFT functions. For example:


