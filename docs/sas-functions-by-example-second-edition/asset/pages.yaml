  md: '# 96 SAS Functions by Example, Second Edition


    ```

    data file_2;

    input @1 Name $10.

    @11 Y 1.;

    datalines;

    Freedman 5

    Freedman 9

    Schields 2

    Mckarth 7

    Adams 3

    Jones 6

    Londquest 9;

    ***PROC SQL is used to create a Cartesian product, combinations of all

    names in one data set against all the names in the other.;

    proc sql;

    create table possible as

    select file_1.name as Name, X,

    file_2.name as Name2, Y

    from file_1,file_2

    where 0 it spedis (procase(Name),propcase(Name2)) le 15;

