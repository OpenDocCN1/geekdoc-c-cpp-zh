  md: '# # Introduction


    Before you start working with SAS date and time functions, remember that SAS date
    values are the number of days between January 1, 1960, and a specified date. Dates
    after January 1, 1960, are stored as positive numbers; dates before January 1,
    1960, are stored as negative numbers. SAS time values are the number of seconds
    between midnight of the current day and another time value. SAS datetime values
    are the number of seconds between midnight, January 1, 1960, and the specified
    date. Some of the most commonly used functions extract the date, the month, or
    the year from a SAS date value.


    Other functions deal with intervals, either the number of intervals between two
    dates or the date after a given number of intervals has passed. You can even compute
    the number of working days (the default is Saturday and Sunday as non-working
    days) between two dates. Making this calculation even more useful is the HOLIDAY
    function that, given a year, returns the date for many of the major holidays.


    For situations where you only have month, day, value and year values but do not
    have a SAS date, the MDY function can create a SAS date value, given a value for
    the month, day, and year. Now let''s get started.


    # ## Functions That Create SAS Date, Datetime, and Time Values


    The first three functions in this group of functions create SAS date, datetime
    values, and time values from the constituent parts (month, day, year, hour, minute,
    second). The DATE and TODAY functions are equivalent and they both return the
    current date. The DATETIME and TIME functions are used to create SAS datetime
    and time values, respectively.


    **Function:** MDY


    **Purpose:** To create a SAS date from the month, day, and year.


    **Syntax:** `MDY(month, day, year)`


    month is a numeric variable or constant representing the month of the year (a
    number from 1 to 12).'
