    # Function: CALL RANUNI


    As discussed in the introduction to this chapter, all of the random number functions
    have a corresponding CALL routine.


    Purpose: To generate one or more random numbers where each value is equally likely.
    The function generates uniform random numbers in the range from 0 to 1. By appropriate
    scaling, you can produce random numbers in any range you choose.


    Syntax: CALL RANUNI (seed, value)

    seed is an integer less than 2,147,483,647 (2³¹-1). If the seed is less than or
    equal to 0, you obtain a different series of random numbers each time you run
    your program (it uses the computer''s clock to generate the seed). If you supply
    a positive seed, every time the program runs, it will produce the same series
    of random numbers. You need to initialize the seed before you call RANUNI for
    the first time—it cannot be a constant.

    value is the name of a variable that will hold the uniform random number.


    Examples For these examples, SEED1 = 0 and SEED2 = 123567.


    | Function | Returns |

    | --- | --- |

    | CALL RANUNI (SEED1, X) | A value for X in the range 0 to 1 (clock-generated
    seed) |

    | CALL RANUNI (SEED2, Y) | A value for Y in the range 0 to 1 (user-specified)
    |


    See Program 9.2 for an example of the RANUNI CALL routine.'
  merge: -1
  pgno: 328
