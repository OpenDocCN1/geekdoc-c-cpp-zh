  md: "# Function: VVALUE\n\nPurpose: To obtain the formatted value of a variable.\
    \ There is some similarity between this function and the PUT function. For example,\
    \ if you have associated a format with a variable in the DATA step, the VVALUE\
    \ function will return a value similar to the PUT function where the second argument\
    \ in the PUT function is the format. If you have not previously defined a length\
    \ for the resulting variable, it will be given a length of 200. In contrast, the\
    \ length of a variable created with the PUT function will be the longest formatted\
    \ value.\n\nSyntax: VVALUE (variable)\n\nvariable is the name of a character or\
    \ numeric variable.\n\n# Examples\n\nFor this example, the value of Gender is\
    \ 'M' and it is formatted as \"Male\".Date is May 1, 2009 and it is formatted\
    \ with the DATE9. format.\nThe value of x is 23 and it is not formatted.\n\n|\
    \ Function | Returns |\n| --- | --- |\n| VVALUE (Gender) | \"Male\" |\n| VVALUE\
    \ (Date) | \"01May2009\" |\n| VVALUE (x) | \"23\" |\n\nNote that the length of\
    \ each of the returned values will be 200 unless a length was previously assigned.\n\
    \n# Program 15.7: Demonstrating the VVALUE function\n\n```\n***Primary functions:\
    \ VVALUE, PUT;\n\nproc gender\n  value gender 'M'='Male'\n      'F'='Famale';\n\
    \n  value age low0-20='Group 1\n      21-30 = 'Group 2';\n\nrun;\n```"
