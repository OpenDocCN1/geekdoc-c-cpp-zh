  md: "# 416 SAS Functions by Example, Second Edition\n\n# Explanation\n\nAlthough\
    \ the bitwise logical functions work on any numerical arguments, it makes more\
    \ sense when you either read or output the numbers as binary strings. In this\
    \ program, the values of X and Y are read using the BINARY4 informat, while the\
    \ variable AFRAID is read using a BINARY informat. Likewise, the values produced\
    \ by the functions are also output using BINARY formats. Here is a list of the\
    \ output:\n\n![](img/ae8f8f5a087715b9f24952530bc68429_442_0.png)\n\n# Program\
    \ 16.2: Enciphering and deciphering using a key\n\n```\n***Primary functions:\
    \ BXOR, RANK, BYTE\n***Other functions: SUB (used on both sides of the equal sign),\
    \ DIM;\n\ndata encode;\n  array l1[5] $ 1;\n  array num[5];\n  array xor[5];\n\
    \  retain Key 173;\n  input String Char5;\n  do i = 1 to dim(l1);\n    l1[i] =\
    \ substr(String,i,1);\n    num[i] = rank(l1[i]);\n    xor[i] = bxor(num[i],Key);\n\
    \  end;\n  keep Xor-Kor5;\nndatalines;\nABCDE\nHelp;\n  title \"Encoded Message\"\
    ;\n  proc print data-encode noobs;\n  var Xor-Kor5;\nrun;\n\ndata decode;\n  array\
    \ l1[5] $ 1;\n  array num[5];\n  array xor[5];\n  retain Key 173;\n  length String\
    \ $ 5;\n  set encode;\n  do i = 1 to dim(l1);\n```"
