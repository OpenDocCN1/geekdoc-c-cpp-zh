    # Function: SPEDIS


    The SPEDIS function computes a "spelling distance" between two words. If the two
    words are identical, the spelling distance is 0; for each type of spelling error,
    SPEDIS assigns penalty points. For example, if the first letters of the two words
    do not match, there is a relatively large penalty. If two letters are reversed
    (such as ''ie'' instead of ''ci''), there is a smaller penalty. The final spelling
    distance is also based on the length of the words being matched. A wrong letter
    in a long word results in a smaller score than a wrong letter in a shorter word.


    Take a look at two new functions (COMPGED and COMPLEV) that are similar to the
    SPEDIS function. The COMPGED function even has an associated CALL routine (COMPCOST)
    that enables you to adjust the costs for various classes of spelling errors.


    There are some very interesting applications of the SPEDIS, COMPGED, and COMPLEXV
    functions. One, described next, enables you to match names that are not spelled
    exactly the same. You may want to try this program with each of the alternative
    functions to compare matching ability and and computing efficiency.


    Purpose: To compute the spelling distance between two words. The more alike the
    two words are, the lower the score. A score of 0 indicates an exact match.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 1: Character Functions 93


    # Syntax: SPEDIS (word-1, word-2)


    word-1 is any SAS character value.

    word-2 is any SAS character value.


    The function returns the spelling distance between the two words. A zero indicates
    the words are identical. Higher scores indicate the words are more dissimilar.
    Note that SPEDIS is asymmetric; the order of the values being compared makes a
    difference. The value returned by the function is computed as a percentage of
    the length of the string to be compared. Thus, an error in two short words returns
    a larger value than the same error in two longer words.


    A list of the operations and their cost is shown in the following table. This
    will give you an idea of the severity of different types of spelling errors. Swapping
    (interchanging) two letters has a smaller penalty than inserting a letter, and
    errors involving the first character in a string have a larger penalty than errors
    involving letters in the middle of the string.


    | Operation | Cost | Explanation |

    |---|---|---|

    | MATCH | 0 | no change |

    | SINGLET | 25 | delete one of a double letter |

    | DOUBLET | 50 | double letter |

    | SWAP | 50 | reverse the order of two consecutive letters |

    | TRUNCATE | 50 | delete a letter from the end |

    | APPEND | 35 | add a letter to the end |

    | DELETE | 50 | delete a letter from the middle |

    | INSERT | 100 | insert a letter in the middle |

    | REPLACE | 100 | replace a letter in the middle |

    | FIRSTDEL | 100 | delete the first letter |

    | FIRSTINS | 200 | insert a letter at the beginning |

    | FIRSTREP | 200 | replace the first letter |'
