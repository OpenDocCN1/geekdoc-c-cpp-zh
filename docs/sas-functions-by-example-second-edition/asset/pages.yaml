    # ## Functions That Extract Parts of Strings


    The functions described in this section can extract parts of strings. When used
    on the lefthand side of the equal sign, the SUBSTR function can also be used to
    insert characters into specific positions of an existing string.


    **Function:** SUBSTR


    **Purpose:** To extract part of a string. When the SUBSTR function is used on
