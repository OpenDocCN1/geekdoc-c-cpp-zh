  md: "# Chapter 1: Character Functions 9\n\n# Function: PROPCASE\n\nPurpose: To capitalize\
    \ the first letter of each word in a string.\n\nSyntax: PROPCASE(character-value\
    \ <,delimiters>)\n\ncharacter-value is any SAS character value.\n\nDelimiters\
    \ An optional list of word delimiters. The default delimiters are blank, forward\
    \ slash, hyphen, open parenthesis, period, and tab.\n\nIf a length has not been\
    \ previously assigned, the length of the resulting variable will be the length\
    \ of the argument.\n\n# Examples\n\nFor these examples, CHAR = \"ABCxyz\".\n\n\
    | Function | Returns |\n| PROPCASE (CHAR) | \"ABCxyz\" |\n| PROPCASE(\"al&m?\"\
    ) | \"Al&m?\" |\n| PROPCASE(\"mr. george w. bush\") | \"Mr. George W. Bush\" |\n\
    | PROPCASE(\"l'oeuf\") | \"L'oeuf\" (\"the egg\" in French) |\n| PROPCASE(\"l'oeuf\"\
    , \"' \") | \\|L'Oeuf\" |\n\nNote: It is useful to use blanks and single quotes\
    \ as delimiters since you would like names such as D'Alessandro to have an uppercase\
    \ letter following the single quote.\n\n# Program 1.5: Capitalizing the first\
    \ letter of each word in a string\n\n```\n*** proper: PROPCASE;\ndata\n  input\
