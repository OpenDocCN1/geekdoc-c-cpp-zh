    leading blanks first. The $CHARw. informat differs from the $Sw. $CHARw. maintains
    blanks; $Sw-aligns the text. Programs involving character variables sometimes
    fail to work properly because careful attention was not paid to leading or trailing
    blanks. Of course, if you didn''t want leading blanks and you were reading raw
    data, you would use the $15. informat instead of the Schar15 informat—but we wanted
    to demonstrate how the LEFT function can left-justify character values.


