    # 8.6 PUTTING STRINGS TOGETHER


    Just as we cannot assign one string to another directly, we cannot join two strings
    together by the simple arithmetic method. That is, the statements such as


    ```

    string2 = string1 + string2;

    string3 = string1 + "hello";

    ```


    are not valid. The characters from string1 and string2 should be copied into the
    string3 one after the other. The size of the array string3 should be large enough
    to hold the total characters.


    The process of combining two strings together is concatenation. Program 8.9 illustrates
    the concatenation of three strings.


    ![](img/177eacb192165f90062789304b5da281_262_0.png)


    The names of an employee are stored in three arrays, namely first_name, second_name,
    and last_name. Write a program to concatenate the three parts into one string
    be called name.


    The program is given in Fig. 8.9. For loops are used to copy the three strings.
    In the first loop, the characters contained in first are copied into the variable
    name until the null character is reached. The null is not copied; instead it is
    replaced by a space by the assignment statement


    ```

    name[i+1] = second_name[j];

    ```


    Similarly, the second_name is copied into name, starting from the column after
    the space we created by the above statement. This is achieved by the assignment
    statement


    If first_name contains 4 characters, then the value of i at this point will be
    4 and then the first character from second_name will be placed in the fifth cell
    of name. Note that we have stored a space in the fourth cell.


    In the same way, the statement


    ```

    name[i+j+k] = last_name[k];

    ```


    is used to copy the characters from last_name into the proper locations of name.


    At the end, we place a null character to terminate the concatenated string name.
    In this example, it is important to note the use of the expressions i+j+1 and
    i+j+k+2.'
