    # PREFACE TO THE SIXTH EDITION


    C is a powerful, flexible, portable and elegantly structured programming language.
    Since C combines features of high-level language with the elements of all, it
    is suitable for both systems and applications programming. It is undoubtedly the
    most widely used general-purpose language today in operating systems, and embedded
    system development. Its influence is evident in all modern programming languages.
    Since its standardization in 1989, C has undergone a series of changes and improvements
    in order to enhance the usefulness of the language. The version that incorporates
    the new features is now referred to as C99.


    # New to this Edition


    The creation of C programming is credited to Dennis Ritchie (Sep. 1931 – Oct.
    2011), the man who helped shape the digital era. With the demise of Ritchie in
    2011, the present edition strives to pay homage to the man who helped change the
    world of computing with his contributions. To quote Ritchie from the Internet,
    "C is peculiar in a lot of ways, like many other successful things, has a certain
    unity of approach that stems from development in a small group."


    In keeping with the original essence of the book, the sixth edition Includes refreshed
    programs and review questions chapters specially picked from frequently asked
    University questions. The highlight of this book is the usage of two colors to
    enhance visual appeal and also make learning a pleasurable activity


    # Organization of the Book


    The book starts with an overview of C, which talks about the history of C, basic
    structure of C programs and their execution. Chapter 2 discusses contents, variables
    and data types. Chapter 3 describes the built-in operators and how to build expressions
    using. Chapter 4 details the input and output operations. Decision making and
    branching is discussed in Chapter 5 which talks about the if-else, switch and
    do statements. Further decision making and looping is discussed in Chapter 6 which
    covers loops. Arrays and ordered data elements are important to any programming
    language and have been covered in Chapter 7 and 8. Strings are covered in Chapter
    9 structures and functions. Pointers the most difficult part of C to be covered
    in Chapter 11 in the most user-friendly manner. Chapters 12 and 13 are on file
    management and dynamic memory allocation respectively. Chapter 14 deals with the
    preprocessor, and finally Chapter 15 is on developing a C program, which provides
    an insight on how to proceed with development of a C program


    The above organization would help the students in understanding C better if followed
    appropriately.


    The content has been revised keeping the updates which have taken place in the
    field of C programming and the present day syllabus needs. As always, the concept
    of learning by example has'
