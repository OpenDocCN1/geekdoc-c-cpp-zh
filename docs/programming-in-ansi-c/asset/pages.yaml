  md: '# The McGraw-Hill Companies


    466 Programming in ANSI C


    at hand, program design might turn into a hit-or-miss approach. We must carefully
    decide the following at this stage;


    +   - What kind of data will go in?

    - What kind of outputs are needed?; and

    - What are the constraints and conditions under which the program has to operate?


    # Outlining the Program Structure


    Once we have decided what we want and what we have, the next step is to decide
    how to do it. As a structured language leads to a top-down approach. Top-down
    means decomposing of the solution procedure into tasks that form a hierarchical
    structure, as shown in Fig.15.1. The essence of the top-down design is to cut
    the whole problem into a number of independent constituent tasks, and then to
    cut the tasks into smaller subtasks, and so on, until they are small enough to
    be grasped mentally and to be coded easily. These tasks and subtasks can form
    the basis of functions in the program.


    ![](img/177eacb192165f90062789304b5da281_477_0.png)


    Fig. 15.1 Hierarchical structure


    An important feature of this approach is that each level, the details of the design
    of lower levels are hidden. The higher-level functions are designed first, assuming
    broad tasks of the immediately lower-level functions. The actual details of the
    lower-level functions are not considered until level is reached. Thus the design
    of functions proceeds from top to bottom, introducing more and more refinements.


    This approach will produce readable and modular code that can be easily understood
    and maintained. It also helps us clarify the overall functioning of the program
    in terms of lower-level functions.


    # Algorithm Development


    After we have decided a solution procedure and an outline of the program, the
    next step is to work out a detailed definition, step-by-step procedure, known
    as algorithm for each function. The most common method of describing an algorithm
    is through the use of flowcharts. The other method is to write what is known as
    pseudocode. The flow chart presents the algorithm pictially, while the pseudocode
    describe the solution steps in a logical order. Either method involves concepts
    of logic and creativity.


    Since algorithm is the key factor for developing an efficient program, we should
    devote enough attention to this step. A problem might have many different approaches
    to its solution. For example,'
