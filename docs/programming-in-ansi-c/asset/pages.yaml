    # 4 MANAGING INPUT AND

    OUTPUT OPERATIONS


    # Key Terms


    Formatted input I Control string Formatted output.


    # 4.1 INTRODUCTION


    Reading, processing, and writing of data are the three essential functions of
    a computer program. Most programs take some data as input and display the processed
    data, often known as information or results on a suitable medium. So far we have
    seen two methods of providing data to the program variables. One method is to
    assign values to variables through assignment statements such as s=5; or so on.
    Another method is to use the input function scanf which can read data from a keyboard.
    We have used both methods in many of our earlier examples. For output we have
    used extensively the function printf which sends results to a terminal.


    Unlike other high-level languages, C does not have any input/output statements
    as part of its syntax. All input/output operations are carried out through functions
    like printf and scanf. There exist several functions that have more or less standard
    as the standard I/O library. In this chapter we shall discuss some common functions
    that can be used on many machines without any change. However, one should consult
    the system reference manual for details of these functions and to see what other
    functions are available.


    It may be recalled that we have included a statement


    ```

    #include <stdio.h>

    ```


    in the Sample Program 5 in Chapter 1, where a math library function cos(x) has
    been used. This is to instruct the compiler to fetch the function cos(x) from
    the math library, and that it is not a part of C language. Similarly, each program
    that uses a standard input/output function must contain the statement


    ```

    #include <stdio.h>

    ```


    at the beginning, however, there might be exceptions. For example, it is not necessary
    for the functions printf and scanf which have been defined as part of C language.


    The file name stdio.h is an abbreviation for standard input-output header file.
    The instruction <stdio.h> tells the compiler to search for a file named stdio.h
    and place its contents at this point in the program. The contents of the header
    file become part of the source code where it is compiled.'
