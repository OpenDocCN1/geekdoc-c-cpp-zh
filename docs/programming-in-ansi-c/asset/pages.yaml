  md: '# FILE MANAGEMENT IN C


    # Key Terms


    Filename | fell | rewind I fseek Command line argument


    # 12.1 INTRODUCTION


    Until now we have been using the functions such as scanf and printf to read and
    write data. These are console oriented I/O functions, which always uses the terminal
    (keyboard and screen) as the target place. This works fine as long as the data
    is simple. However, many real-life problems involve large volumes of data and
    in such situations, the console I/O operations pose two major problems.


    +   1. It becomes cumbersome and complex to handle large volumes of data through
    terminals.

    2. The entire data is lost when the program is terminated or the computer is turned
    off.


    It is therefore necessary to have a more flexible approach where data can be stored
    on the disks and read whenever necessary, without destroying the data. This method
    employs the concept of files to store data. A file is a place on the disk where
    a group of data is stored. Like other languages, C supports a number of functions
    that have the ability to perform basic file operations, which include:


    +   * naming a file,

    * opening a file,

    * reading data from a file,

    * writing data to a file,

    * closing a file.


    There are two ways to perform file operations in C. The first one is known as
    the low-level/I/O and used UNIX calls. The second method is referred to as the
    high-level/I/O operation and uses functions in C''s standard I/O library. We shall
    discuss in this chapter, the important file handling functions that are available
    in the C library. They are listed in Table 12.1.


    There are many other functions. Not all of them are supported by all compilers.
    You should check your C library before using a particular I/O function.


    # 12.2 DEFINING AND OPENING A FILE


    If we want to store data in a file in the secondary memory, we must specify certain
    things about the file, to the operating system. They include:'
