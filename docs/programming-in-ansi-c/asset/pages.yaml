    will contain "garbage". An array can be initialized at either of the following
    stages:


    +   * At compile time

    * At run time


    # Compile Time Initialization


    We can initialize the elements of arrays in the same way as the ordinary variables
    when they are declared. The general form of initialization is:


    ```

    type array_name[size] = { list of values };

    ```


