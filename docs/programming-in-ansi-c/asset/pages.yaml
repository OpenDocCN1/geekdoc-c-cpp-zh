  md: '# Generality of Programs


    Care should be taken to minimize the dependence of a program on a particular set
    of data, or on a particular value of a parameter. Example:


    ```

    for(sum = 0, i = 1; i < 10; i++)

    sum = sum + i;

    ```


    This loop adds 1.2, ... 10. This can be made more general as follows:


    ```

    for(i = m; i < n; i = i + step);

    sum = sum + i;

    ```


    The initial m, the final value n, and the increment size step can be specified
    interactively during program execution. When n=100, the loop adds all even numbers
    up to, including 100.


    # 15.4 COMMON PROGRAMMING ERRORS


    By now you be aware that C has certain features that are easily amenable to bugs.
    Added to this, it does not check and report all kinds of run-time errors. It is
    therefore, advisable to keep track of such errors and to see that these errors
    are not present in the program. This section examines some of the more common
    mistakes that a less experienced programmer could make.


    # Missing Semicolons


    Every statement must end with a semicolon. A missing semicolon may cause considerable
    confusion to the compiler and result in "misleading" error messages. Consider
    the following statements:


    ```

    a = x+y

    b = m/n;

