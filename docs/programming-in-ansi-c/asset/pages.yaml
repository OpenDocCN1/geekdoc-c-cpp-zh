    # Programming in ANSI C


    To ensure that the C language remains standard, in 1983, American National Standards
    Institute (ANSI) appointed a technical committee to define a standard for C. The
    committee approved a version of C in December 1989 which is now known as ANSI
    C. It was then approved by the International Standards Organization (ISO) in 1990.
    This version of C is also referred to as C89.


    During 1990''s, C++, a language entirely based on C, underwent a number of improvements
    and changes and C became an ANSI approved language in November 1997. C++ added
    several features to C make it not only powerful but also a more versatile language.
    During the same period. Sun Microsystems of USA created a new Java modelled on
    C and C++.


    All popular computer languages are dynamic. They continue to improve their power
    and size by incorporating new features and C is no exception. Although C++ and
    Java were evolved of C, the standardization committee of C felt that a few features
    of C++/Java, if added to C, would enhance the usefulness of the language. The
    result was the standard for C. This version is usually referred to as C99. The
    history and development of C is illustrated in Fig. 1.1


    | 1960 | ALGOL | International Group |

    |---|---|---|n| 1967 | BCPL | Martin Richards |

    | 1970 | B | Ken Thompson |

    | 1972 | Traditional C | Dennis Ritchie |

    | 1978 | K&R C | Kernighan and Ritchie |

    | 1989 | ANSI C | ANSI Committee |

    | 1990 | ANSI/ISO | ISO Committee |

    | 1999 | C99 | Standardization Committee |


    Fig. 1.1 History of ANSI C'
