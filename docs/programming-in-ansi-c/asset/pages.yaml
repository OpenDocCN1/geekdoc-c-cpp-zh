    Reading integers using scanf


    The first scanf requests for three integer values a, b, and c, and accordingly
    three values 1, 2, and 3 are keyed in. Because of the specification %d the value
    2 has been skipped and 3 is assigned to the variable b. Notice that no data is
    available for c, it contains garbage.

    The second scanf specifies field width %2d and %4d for the variables x and y respectively.
    Whenever we specify field width for reading integers, the input numbers should
    not contain more digits than the specified field. Otherwise, the excess digits
    will be truncated and assigned to the next variable in the list. Thus, the second
    scanf truncated the four digit number 6789 and assigned 67 to x and 89 to y. The
    value 4321 has been assigned to the first variable in the immediately following
    scanf statement.


    ```

    scanf("%d-%d-%d", &a, &b, &c);

    ```


    accepts input like


    to 123 to a and 456 to b.


    # Inputting Real Numbers


    Unlike integers, the field width of real numbers is not specified to be and therefore
    scanf reads real numbers using the simple specification %f for both the notations,
    namely, decimal point notation and exponential notation. For example, the statement


    ```

    scanf("%f %f %f", &x, &y, &z);

    ```


    with the input data


    ```

    475.89 43.211e-678

    ```'
