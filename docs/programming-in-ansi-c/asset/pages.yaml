    # Just Remember


    +   - Only the address of a variable can be stored in a pointer variable.

    - Do not store the address of a variable of one type into a pointer variable of
    another type.

    - The value of a variable cannot be assigned to a pointer variable.

    - A pointer contains garbage until it is initialized. Therefore we must not use
    a pointer before it is assigned, the address of a variable.

    - Remember that the definition for a pointer variable allocates memory only for
    the pointer variable, not for the variable to which it is pointing.

    - If we want a called function to change the value of a variable in the calling
    function, we must pass the address of that variable to the called function.

    - When we pass a parameter by address, the corresponding formal parameter must
    be a pointer variable.

    - It is an error to assign a numeric constant to a pointer variable.

    - It is an error to assign the address of a variable to a variable of any basic
    data types.

    - It is an error to assign a pointer of one type to another without a cast (with
    an exception of void pointer).

    - A proper understanding of precedence and associativity rules is very important
    in pointer applications. For example, expressions like ++++, (*p)[i], (p->member)
    should be carefully used.

    - When an array is passed as an argument to a function, a pointer is passed. In
    the header function, we must declare with proper size, except the first which
    is optional.

    - A common error is to use (or not to use) the address operator (&) and the indirection
    operator (*) in certain places. Be careful. The compiler may not warn us such
    mistakes.


