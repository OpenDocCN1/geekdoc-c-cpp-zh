  md: '# The McGraw-Hill Companies


    138 Programming in ANSI C


    # Just Remember


    +   - Be aware of dangling else statements.

    - Be aware of any side effects in the control expression such as if(x++).

    - Use braces to encapsulate the statements in if and else clauses of an... else
    statement.

    - Check the use of =operator in the case of equal operator = =

    - Do not give any spaces between the two symbols of relational operators =\, !=,
    >= and <=.

    - Writing !=> and operators like ++ is an error.

    - Remember to use two ampersands (&&) and two bars (||) for logical operators.
    Use of simple operators will result in logical errors.

    - Do not forget to place a semicolon after the expression.

    - It is an error to do equal after the expression.

    - Do not use the equal operator to compare floating-point values. They are seldom
    exactly equal.

    - Do not forget to use a break statement when the cases in a switch statement.

    - Although it is optional, it is a good programming practice to use the default
    clause in a switch statement.

    - It is an error to use a variable in the case of a switch statement. (Only integral
    constants are allowed.)

    - Do not use the same constant in two case labels in a switch statement.

    - Avoid using operands that have side effects in a binary expression such as (x--&&++).

    - The second operand may not be evaluated at all.

    - Try to use simple logical expressions.


    # Case Studies


    # 1. Range of Numbers


    Problem: A survey of the computer market shows that personal computers are sold
    at varying costs by the vendors. The following is the list of costs (in hundreds)
    quoted by some vendors:


    | 35.00 | 40.50 | 25.00 | 31.25 | 68.15 |

    | 47.00 | 26.50 | 29.00 | 53.45 | 62.50 |


    Determine the average cost and the range of values.


    Problem analysis: Range is one of the measures of dispersion in statistical analysis
    of a series of values. The range of any series is the difference between the highest
    and the lowest values in the series. That is


    > Range = highest value – lowest value


    It is therefore necessary to find the highest and the lowest values in the series.

    Program: A program to determine the range of values and the average cost of a
    personal computer in the market is given in Fig. 5.16.'
