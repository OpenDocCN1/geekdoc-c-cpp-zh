    # Default values of Constants


    Integer constants, by default, represent int type data. We can override this default
    by specifying unsigned or long after the number (by appending U or L) as shown
    below:


    | Literal | Type | Value |

    |---|---|--|

    | +111 | int | 111 |

    | -222 | int | -222 |

    | 45678U | unsigned int | 45,678 |

    | -56789 | long int | -56,789 |

    | 98754UL | unsigned long int | 9,8754 |


    Similarly, floating constants, by default represent double type data. If we want
    the resulting data type to be float or long double, we must append the letter
    f or F to the number for float and letter i or L for long double as shown below:


    | Literal | Type | Value |

    |---|---|--|

    | 0 | double | 0.0 |

