    # 4.4 FORMATTED INPUT


    Formatted input refers to an input data that has been arranged in a particular
    format. For example, consider the following:


    15.75 123 John


    This line contains three pieces of data, arranged in a particular form. Such data
    has to be read conforming to the format of its appearance. For example, the first
    part of the data should be read into a variable float; the second into int, and
    the third part into char. This is possible in C using the scanf function (scans
    format).


    We have already used this input function in a number of arguments. Here, we shall
    explore all of the options that are available for reading the formatted data with
    scanf function. The general form of scanf is


    ```

    scaf("control string", arg1, arg2,..., argn);

    ```


    The control string specifies the field format in which the data is to be entered
    and arg1, arg2... specify the address of locations where the data is stored. Control
    string and arguments are separated by commas.


    Control (also known as format string) contains field specifications, which direct
    the interpretation of input data. The field width specifier indicates the data
    type, or character-type, and an optional number, specifying the field width.


    +   - Field (or format) specifications, consisting of the conversion character
    %, a data type (or type), and an optional number, specifying the field width.

    - Blanks, tabs, or newlines.


    Blanks and newlines are ignored. The data type indicates the type of data that
    is to be assigned to the variable with the corresponding argument. The field width
    specifier is optional. The discussions that follow will clarify these concepts.


    # Inputting Integer Numbers


    The field specification for reading an integer is:


    ```

    %w d

    ```


    The percentage sign (%) indicates that conversion specification follows: w is
    an integer that specifies the field width of the number to be read and d as data
    type character, indicates the number to be read in integer mode. Consider the
    following example:


    ```

    scaf("%2d %d", &num1, &num2);

    ```


    Data line:


    50 31426


    The value 50 is assigned to num1 and 31426 to num2. Suppose the input data is
    as follows:


    31426 50


    The variable num1 will be assigned 31 (because) and num2 will be assigned 46 (unused
    part of 31426). The value 50 is unreal is assigned to the first variable in the
    next scanf call. This kind of errors can be eliminated if we use the field specifications
    without the field width specifications. That is, the statement


    ```

    scaf("%d %d", &num1, &num2);

    ```


    read the data


    31426 50


    correctly and assign 31426 to num1 and 50 to num2.'
