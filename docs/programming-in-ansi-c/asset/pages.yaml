    344 Programming in ANSI


    In effect, a union creates a storage location that can be used by any one of its
    members at a time. When a different member is assigned a new value, the new value
    supersedes the previous member''s value.


    Unions may be in all places where a structure is used. The notation for accessing
    a union member which is nested inside a structure remains the same as the nested
    structures.


    Unions may be initialized when the union is declared. But, unlike structures,
    it can be initialized only with a value of the same type as the first union member.
    For example, with the preceding, the


    ```

    union int abc = (100);

    ```


    is valid but the declaration


    ```

    union int abc = (10.75);

    ```


    is invalid. This is because the type of the first member is int. Other members
    can be initialized by assigning values or reading from the keyboard.


    # 10.13 SIZE OF STRUCTURES


    We normally use structures, unions, and arrays to create variables of large sizes.
    The actual size of these variables in terms of bytes may change from machine to
    machine. We use the unary operator sizeof to tell us the size of a structure (or
    any variable). The expression


    ```

    sizeof(struct x)

    ```


    will evaluate the number of bytes required to hold all the members of the structure
    x. If y is a simple structure variable of type struct x, then the


    ```

    sizeof(y)

    ```


    would also give the same answer. However, if y is an array variable of type struct
    x, then


    ```

    sizeof(y)

    ```


    would give the total number of bytes that the array y requires.


    This information would be useful to determine the number of records in a database.
    For the expression


    ```

    sizeof(y)/sizeof(x)

    ```


    would give the number of elements in the array y.


    # 10.14 BIT FIELDS


    So far, we have been using integer fields of 16 bits to store data. There are
    occasions where data requires more than 16 bits in space. In such cases, we waste
    memory space. Fortunately, C permits us to use small bit fields to hold data items
    and thereby to pack several data items in a word of memory. Bit fields allow direct
    manipulation of a string of preselected fields as if it represented an integral
    quantity.


    A bit field is a set of adjacent bits whose size can be from 1 to 16 bits in length.
    A word can therefore be divided into a number of bit fields. The name and size
    of bit fields are defined using a structure. The general form of bit field definition
    is:'
