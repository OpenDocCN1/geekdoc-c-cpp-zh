  md: "# The McGraw-Hill Companies\n\nOverview of C 5\n\nNotice that the argument\
    \ of the first printf contains a combination of two characters \\ and n at the\
    \ end of the string. This combination is collectively called the newline character.\
    \ A newline character instructs the computer to go to the next (new) line. It\
    \ is similar in concept to the carriage return key on a typewriter. After printing\
    \ the character comma (...) the presence of the newline character \\n causes the\
