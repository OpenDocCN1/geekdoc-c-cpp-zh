    # Some Guidelines for Writing Multiway Selection Statements


    Complex multiway selection statements require special attention. The readers should
    be able to understand the logic easily. Given below are some guidelines that would
    improve readability and facilitate maintenance.


    +   - Avoid compound negative statements. Use positive statements wherever possible.

    - Keep logical simple. We can achieve this using nested statements, if necessary
    (KISS - Keep It Simple and Short).

    - Try to code the normal/anticipated condition first.

    - Use the most probable condition first. This will eliminate unnecessary tests,
    improving the efficiency of the program.

    - The choice between nested if and switch statements is a matter of individual''s
    preference. A good rule of thumb is to use the switch when alter-native paths
    are three to ten.

    - Use proper indentations (See Rules for Indentation).

    - Have the habit of using default clause in switch statements.

    - Group the case labels that have similar actions.


    # 5.9 GOTO STATEMENT


    So far we have discussed ways of controlling the flow of execution based on certain
    specified conditions. Like many other languages, C supports the goto statement
    to branch unconditionally from one point to another in the program. It may not
    be essential to use the goto statement in a highly structured language like C,
    there may be occasions when the use of goto might be desirable.


    The goto requires a label in order to specify the branch to be made. A label is
    any valid variable name, and must be followed by a colon. The label is placed
    immediately before the statement where it is to be transferred. The general forms
    of goto and label statements are shown below:


    ![](img/177eacb192165f90062789304b5da281_146_0.png)


    ![](img/177eacb192165f90062789304b5da281_146_1.png)'
