  md: "# 10.12 UNIONS\n\nYou may notice that the template of stores is defined before\
    \ main(). This has made the data type stores as global and has enabled the functions\
    \ update and mul to make use of this definition.\n\nUnions are a concept borrowed\
    \ from structures and follow the same syntax as structures. However, there is\
    \ major distinction between them in terms of storage. In structures, each member\
    \ has its own storage location, whereas all the members of a union use the same\
    \ location. This implies that, although a union may contain many members of different\
    \ types, it can handle only one member at a time. Like structures, a union can\
    \ be declared using the keyword union as:\n\n```\nunion item {\n    int m;\n \
    \   float x;\n    char c;\n    code code;\n}\n```\n\nThis declares a variable\
    \ code of type union item. The union contains three members, each with a different\
    \ data type. However, we can use only one of them at a time. This is due to the\
    \ fact that only one location is allocated for a union variable, irrespective\
    \ of its size.\n\nStorage of 4 bytes\n\n![](img/177eacb192165f90062789304b5da281_354_0.png)\n\
    \nFig. 10.7 Sharing of a storage locating by union members\n\nThe compiler allocates\
    \ a piece of storage that is large enough to hold the largest variable in the\
    \ union. In the declaration above, the member x requires 4 bytes which is the\
    \ largest among the members. Figure 10.7 shows how all the three variables share\
    \ the same address. This assumes that a float variable requires 4 bytes of storage.\n\
    \nTo access a union member, we can use the same syntax that we use for structure\
    \ members. That is,\n\nare all valid member variables. During accessing, we make\
