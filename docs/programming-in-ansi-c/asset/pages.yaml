  md: '# OPERATORS AND EXPRESSIONS


    # Key Terms


    Operator I Expression Integer expression | Real arithmetic | Relational operators
    | Logical operators |

    Assignment operators | Bitwise operators | Arithmetic operations


    # 3.1 INTRODUCTION


    C supports a set of built-in operators. We have already used several of them,
    such as =, +, -, *

    & &. An operator is a symbol that tells the computer to perform certain mathematical
    or logical

    manipulations. Operators are used in programs to manipulate data and variables.
    They usually form a\part of the mathematical or logical expressions.


    C operators can be classified into a number of categories. They include:


    +   1. Arithmetic operators

    2. Relational operators

    3. Logical operators

    4. Assignment operators

    5. Increment and decrement operators

    6. Conditional operators

    7. Bitwise operators

    8. Special operators


    An expression is a sequence of operands and operators that reduces to a single
    value. For example,

    10 + 15

    is an expression whose value is 25. The value can be any type other void.


    # 3.2 ARITHMETIC OPERATORS


    C provides all the basic arithmetic operators. They are listed in Table 3.1. The
    operators +, -, *, / /

    work the same way as they do in other languages. These can operate on any built-in
    data type allowed

    in C. The unary minus operator, in effect, multiplies its single operand by -1.
    Therefore, a number

    ceded by a minus sign changes its sign.'
