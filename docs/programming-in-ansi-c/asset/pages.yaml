    int number[3] = { 0, 0, 0 };


    will declare the variable number as an array of size 3 and will assign zero to
    each element. If the number of values in the list is less than the number of elements,
    then only that many elements will be initialized. The remaining elements will
    be set to zero automatically. For instance,'
