    # 9.8 FUNCTION DECLARATION


    Like variables, all functions in a C program must be declared, before they are
    invoked. A function declaration (also known as function prototype) consists of
    four parts:


    +   * Function type (return type).

    * Function name.

    * Parameter list.

    * Termating semicolon.


    They are coded in the following format:


    ```

    Function-type function-name (parameter list);

    ```


    This is very similar to the function header line except the terminating semicolon.
    For example, mul function defined in the previous section will be declared as:


    ```

    int mul(int m, int n); int Function prototype /*

    ```


    # Points to note


    +   1. The parameter list must be separated by commas.

    2. The parameter names do not need to be the same in the prototype declaration
    and the function definition.

    3. The types must match the types of parameters in the function definition, in
    number and order.

    4. Use of parameter names in the declaration is optional.

    5. If the function has no parameters, the list is written as (void).

    6. The return type is optional, when the function returns int type data.

    7. The return must be void if no value is returned.

    8. When the declared types do not match the types in the function definition,
    compiler will produce an error.


    Equally acceptable forms of declaration of mul function are:


    ```

    int mul (int, int);

    mul (int a, int b);

    mul (int, int);

    ```


    When a function does not take any parameters and does not return any value, its
    prototype is written as:


    ```

    void display (void);

    ```'
