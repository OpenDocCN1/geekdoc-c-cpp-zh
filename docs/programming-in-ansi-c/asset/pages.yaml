  md: '# Bitwise Exclusive OR


    The bitwise **exclusive OR** is represented by the symbol ^. The result of exclusive
    OR is 1 if only one of the bits is 1; otherwise it is 0. Consider the same variable
    **x and y** discussed.


    ```

    x --> 0000 0000 0000 1101

    y --> 0000 0000 0001 1001

    x''y'' --> 0000 0000 0001 0100

    ```


    # 3 BIT SHIFT OPERATORS


    The shift operators are used to move bits either to the left or to the right.
    The shift operators are represented by the symbols << and >> in the following
    form:


    ```

    Left shift: op << n

    Right shift: op >> n

    ```


    op is the integer expression that contains bits to be shifted and n is the number
    of bits to be shifted.


    The left-shift operation causes bits in the operand to be shifted to the left
    by n positions. The leftmost n bits in the original pattern will be lost and the
    rightmost n bit positions are vacated with zeros.


    Similarly, the right-shift operation causes bits in the operand to be shifted
    to the right by n positions. The rightmost n bits will be lost and the leftmost
    n positions are filled with zero, if the op is an **unsigned integer**. If the
    variable is shifted **signed**, the operation is machine dependent.


    Both op and n can be constants or variables. There are two restrictions on the
    value of n. It may not be negative and it may not exceed the number of bits used
    to represent the left operand.


    Let us suppose x is an unsigned integer bit pattern is


    ```

    x << 3 = 0000 0110 1001 0100

    x >> 3 = 0000 1001 0011 1001

    ```


    vacated


    positions


    vacated


    positions


    Shift operators are often used for multiplication and division by powers of two.


    Consider the following statement:


    ```

    x = y << 1;

    ```


    This statement shifts one bit to the left in **y** and the result is assigned
    to **x**. The decimal value of **x** will be the value of **y** multiplied by
    2.


    ```

    x = y >> 1;

    ```


    shifts one bit to the right and assigns the result to **x**. In this case, the
    value of **x** will be the value of **y** divided by 2.


    The shift operators, when combined with bitwise operators, are useful for extracting
    data from an integer field that holds multiple pieces of information. This process
    is known as masking. Masking is discussed in Section 5.'
