    # 14 THE PREPROCESSOR


    # Key Terms


    Preprocessor | Macro substitution | Conditional Compilation | Stringizing Operator
    | Macro call


    # 14.1 INTRODUCTION


    C is a unique language in many respects. We have already seen features such as
    structures and pointers. Yet another unique feature of the C language is the preprocessor.
    The C preprocessor provides several tools that are unavailable in other high-level
    languages. The programmer can use these tools to make his program easy to read,
    easy to modify, portable, and more efficient.


    The preprocessor, as its name implies, is a program that processes the source
    code before it passes through the compiler. It operates under the control of what
    is known as preprocessor command lines or directives. Preprocessor directives
    are placed in the source program before the main line. Before the source code
    passes through the compiler, it invokes the preprocessor for any preprocessor
    directives. If there are any, appropriate actions (as the directives) are taken
    and then the program is handed over to the compiler.


    Preprocessor directives follow special syntax rules that are different from the
    normal C syntax. They all begin with the symbol #define and #include and do not
    require a semicolon at the end. We have already used the directives #define and
    #include to a limited extent. A of commonly used preprocessor directives and their
    functions are given in Table 14.1.


    # Table 14.1 Preprocessor Directives


    | Directive | Function |

    | --- | --- |

    | #define | Defines a macro substitution |

    | #undef | Undefines a macro |

    | #include | Specifies the files to be included |

    | #ifdef | Test for a macro definition |

    | #endif | Specifies the end of #if. |

    | #ifndef | Tests whether a macro is not defined. |

    | #if | Test a compile-time condition |

    | #else | Specifies alternatives when #if fails. |'
