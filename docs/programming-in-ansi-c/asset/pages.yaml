    # Executing the Program


    Execution is a simple task. The command would load the executable object code
    into the computer memory and execute the instructions. During execution, the program
    may request some data to be entered through the keyboard. Sometimes the program
    does not produce the desired results. Perhaps, something is wrong with the program
    logic or data. Then it would be necessary to correct the source program or the
    data. In case the source program is modified, the entire process of compiling,
    linking and executing the program should be repeated.


    # Creating Your Own Executable File


    Note that the linker assigns the same name a.out. When we compile another program,
    this file will be overwritten by the executable object code of the new program.
    If we want to prevent happening, we should rename the file immediately by using
    the command.


    ```

    mv a.out name

    ```


    We may also achieve this by specifying an option in the cc command as:


    ```

    cc -name source-file

    ```


    This will store the executable object code in the file name and prevent the old
    a.out being destroyed.


    # Multiple Source Files


    To compile and link multiple source files, we must append all the file names to
    the cc command.


    ```

    cc filename1.c -c filename2.c

    ```


    These files will be separately compiled into object files


    ```

    filename1.-o

    ```


    and then link to produce an executable file a.out as shown in Fig. 11.


    It is also possible to compile each file separately and link them. For example,
    the commands


    ```

    cc -c mod1.c

    ```


    ```

    cc -c mod2.c

    ```


    will compile the source files mod1.c and mod2.c into object files mod1.o and mod2.o.
    They can be linked together by the command


    ```

    cc mod1.o mod2.o

    ```'
