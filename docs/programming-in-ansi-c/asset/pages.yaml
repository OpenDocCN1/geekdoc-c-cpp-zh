    relational operators.


    +   8. A pointer variable cannot be multiplied by a constant.


    +   9. Two pointer variables cannot be added.


    +   10. A value cannot be assigned to an arbitrary address (i.e., &x=10; is illegal).


    # 11.10 POINTERS AND ARRAYS


    When an array is declared, the compiler allocates a base address and sufficient
    amount of storage to

    all the elements of the array in contiguous memory locations. The base address
    is the location

    of the first element (index [0]) of the array. The compiler also defines the array
    name as a constant pointer

    to the first element. Suppose we declare an array x as:


    ```

    Int x[5] = {1, 2, 3, 4, 5};

    ```


    Suppose the base address of x is 1000 and each integer requires two bytes, the
    five

    elements will be stored as follows:


    | | x[0] | x[1] | x[2] | x[3] | x[4] |

    |---|---|---|---|---|---|

    | Value | | | | | |

    | Address | 1000 | 1002 | 1004 | 1006 | 1008 |


    ![](img/177eacb192165f90062789304b5da281_380_0.png)


    The name x is defined as a constant pointer to the first element, x[0] and therefore
    the value

    x is 1000, the location where x[0] is stored. That is,


    ```

    x = &x[0] = 1000

    ```


    If we declare p as an integer, then we can make the pointer p to point the array
    x by

    the following assignment:


    ```

    p = x;

    ```


    This is equivalent to


    ```

    p = &x[0];

    ```


    Now, we can access every value of x using p to move from one element to another.
    The relationship

    between p and x is shown as:


    ```

    p = &x[0] = (1000)

    p+1 = &x[1] = (1002)

    p+2 = &x[2] = (1004)

    p+3 = &x[3] = (1006)

    p+4 = &x[4] = (1008)

    ```


    You may notice that the address of an element is calculated using its index and
    the scale factor

    of the data type. For instance,


    ```

    address of x[3] = base address + (3 x scale factor of int)

    = 1000 + (3 x 2) = 1006

    ```


    When handling arrays, instead of array indexing, we can use pointers to access
    array elements.

    Note that *(p+3) gives the value of x[3]. The pointer accessing method is much
    faster than array indexing.

    The program 11.4 illustrates the use of pointer accessing method.'
