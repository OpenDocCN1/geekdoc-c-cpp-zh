  md: "# Default to int Rule\n\nIn ANSI C, when the return type of a function is not\
    \ specified, the return type is assumed to be **int**. For example,\n\n```\n```c\n\
    prod(int a, int b)    /* return type type is int by default */\n{\n    return\
    \ (a*b);\n}\n```\n```\n\nis a valid definition. The return type is assumed to\
    \ be **int** by default. The implicit **int** rule is not valid in C99. It requires\
    \ an explicit mention of return type, even if the function returns an integer\
    \ value. The above definition must be met:\n\n```\n```c\nint prod(int a, int b)\
    \    /* explicit type specification */\n{\n    return (a*b);\n}\n```\n```\n\n\
    Another place where we use implicit **int** rule is when we declare function parameters\
    \ using qualifiers. For example, function definitions as\n\n```\n```c\nfun1(const\
    \ a)    /* a is int by default */\n{\n}\n```\n```\n\nand\n\n```\n```c\nfun2(register\
    \ x, register y)    /* x and y are int */\n{\n}\n```\n```\n\nare not acceptable\
    \ in C99. The parameters **a**, **x** and **y** must be explicitly declared as\
    \ **int**, like:\nconst int a\nconst register x\n\n# Explicit Function Decalaration\n\
    \nAlthough prior explicit declaration of function is not technically required\
    \ in ANSI C, it is required in C99 (like in C++).\n\n# Restrictions on return\
    \ Statement\n\nIn ANSI C, a non-void type function can include a **return** statement\
    \ without including a value. For example, the following code is valid in ANSI\
    \ C."
  merge: -1
