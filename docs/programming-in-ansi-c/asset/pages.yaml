    # Register Variables


    We can tell the compiler that a variable should be kept in one of the machine''s
    registers, instead of keeping in the memory (where normal variables are stored).
    Since a register access is much faster than a memory access, keeping the frequently
    accessed variables (e.g., loop control variables) in the register will lead to
    faster execution of programs. This is done as follows:


    ```

    register int count;

    ```


    Although ANSI standard does not restrict its to any particular data type, most
    compilers allow only int or other variables to be placed in the register.


    Since only a few variables can be placed in the register, it is important to carefully
    select the variables for this purpose. C will automatically convert register variables
    into non-register variables until the limit is reached.


