  md: "# Dangling Else Problem\n\nOne of the classic problems encountered when we\
    \ start using if...else statements is the dangling else. This occurs when a matching\
    \ else is not available for an if. The answer to this problem is very simple.\
    \ Always match else to the most recent unmatched if in the current block. In cases,\
    \ it is possible that the false condition is not met. In such situations, else\
    \ statement may be omitted\n\n> else is always paired with the most recent unpaired\
    \ if\n\n# 5.6 THE ELSE LADDER\n\nThere is another way of putting ifs together\
    \ when multipath decisions are involved. A multipath decision is a chain of ifs\
    \ in which the statement associated with each else is an if. It takes the following\
    \ form:\n\n```\nif ( condition 1)\n    statement-1;\nelse if ( condition 2)\n\
    \    statement-2;\nelse if ( condition 3)\n    statement-3;\nelse if ( condition\
    \ n)\n    statement-n;\nelse\n    default-statement;\n```\n\nThis construct is\
    \ known as the else ladder. The conditions are evaluated from the top (of ladder),\
    \ downwards. As soon as a true condition is found, the statement associated with\
    \ it is executed and the control is transferred to the next statement (skipping\
    \ the rest of the ladder). When all the n conditions become false, the final else\
    \ containing the default-statement will be executed. Fig 5.9 shows the logic of\
    \ execution of else ladder rules.\n\nLet us consider an example of grading the\
    \ students in an academic institution. The grading is done according to the following\
    \ rules:\n\n| Average marks | Grade |\n|---|---|\n| 80 to 100 | Honours |\n| 60\
    \ to 79 | First Division |\n| 50 to 59 | Second Division |\n| 40 to 49 | Third\
    \ Division |\n| 0 to 39 | Fail |"
  merge: -1
