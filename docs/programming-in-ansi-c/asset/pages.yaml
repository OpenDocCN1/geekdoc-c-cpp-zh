  md: "# The McGraw-Hill Companies\n\nDecision Making and Looping 153\n\n+   3. Test\
    \ for a specified value of the condition variable for execution of the loop.\n\
    4. Incrementing or updating the condition variable.\n\nThe test may be either\
    \ to determine whether the loop has been repeated the specified times or to determine\
    \ whether a particular condition has been met.\n\nThe C language provides three\
    \ structures for performing loop operations. They are:\n\n+   1. The while statement.\n\
    2. The do statement.\n3. The for statement.\n\nWe shall discuss the features and\
    \ applications of each of these statements in this chapter.\n\n# Sentinel Loops\n\
    \nBased on the nature of control variable and the kind of value assigned to it\
    \ for testing the control expression, the loops may be classified into two general\
    \ categories:\n\n+   1. Counter-loops\n2. Sentinel-loops\n\nWhen we know in advance\
    \ how many times the loop will be executed, we use a counter-controlled loop.\
    \ We use a control variable as counter. The counter must be initialized, tested\
    \ and updated properly for the desired loop. The number of times we want to execute\
    \ the loop may be a constant or a variable that is assigned a value. A counter-controlled\
    \ loop is sometimes called repetition loop.\n\nIn a sentinel-controlled loop,\
    \ a special sentinel value is used to change the loop expression from true to\
    \ false. For example, when reading data we may indicate the \"end of data\" by\
    \ a special value, like -1 and 999. The control variable is sentinel variable.\
    \ A sentinel-controlled loop is often called infinite repetition loop because\
    \ the number of repetitions is not known before the loop begins.\n\n# 6.2 THE\
    \ WHILE STATEMENT\n\nThe simplest of all looping structures in C is the while\
    \ statement. We have used while in our earlier programs. The basic format of the\
    \ while statement is\n\n```\nwhile (test condition)\n    body of the loop\n}\n\
    ```\n\nThe while is an entry-controlled loop statement. The test-condition is\
    \ evaluated and if the condition is true, the body of the loop is executed. After\
    \ execution of the body, the test-condition is once again evaluated if it is true,\
    \ the body is executed once again. This process of repeated execution of the body\
    \ continues until the test-condition finally becomes false and the control is\
    \ transferred out of the loop. On exit, the program continues with the statement\
    \ immediately after the body of the loop."
