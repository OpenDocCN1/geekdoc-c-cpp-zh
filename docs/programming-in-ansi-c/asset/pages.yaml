  md: '# USER-DEFINED FUNCTIONS


    # Key Terms


    Modular | Program definition | Calling program | Function type | Parameter list
    | Function body | Local variables | Recursion | Internal variables | External
    variables | Block statement | Function Global variable | Arguments


    # 9.1 INTRODUCTION


    We have mentioned earlier that one of the strengths of C language is C functions.
    They are easy to define and use. We have used functions in every program that
    we have discussed so far. However, they have been primarily limited to the three
    functions, namely, main, printf and scanf. In this chapter, we shall consider
    in detail the following:


    +   - How is a function designed?

    - How is a function integrated into a program?

    - How two or more functions are put together?

    - How they communicate with one another?


    C functions can be classified into two categories, namely, library functions and
    user-defined functions. main is an example of user-defined functions. printf and
    scanf belong to the category of library functions. We have also used other library
    functions as sqrt, cos, strcat, etc. The distinction between these two is that
    library functions are not required to be written by us whereas a user-defined
    function is to be developed by the user at the time of writing a program. However,
    a user-defined function can later become a part of the C library. In fact, this
    is one of the strengths of C language.


    # 9.2 NEED FOR USER-DEFINED FUNCTIONS


    As pointed out earlier, main is a specially recognized function in C. Every program
    must have a main function to indicate where the program begins its execution.
    While it is possible to code any program utilizing only main function, it leads
    to a number of problems. The program may become too large and complex as a result
    of the task of debugging, testing, and maintaining becomes difficult. If a program
    is divided into functional parts, then each part may be independently coded and
    combined into a single unit. These independently coded programs are called subprograms
    that are much easier to understand, debug, and test. In C, such subprograms are
    referred to as "functions".'
