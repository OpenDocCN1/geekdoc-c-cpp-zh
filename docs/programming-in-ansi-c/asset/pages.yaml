    # 2.1 INTRODUCTION


    A programming language is designed to help process certain kinds of data consisting
    of numbers, characters and strings and provide useful output known as information.
    The task of processing data is accomplished by executing a sequence of precise
    instructions called a program. These instructions are formed using certain symbols
    and words according to some rigid rules known as syntax rules (or grammar). Every
    program instruction must conform precisely to the syntax rules of the language.


    Like any other language, C has its own vocabulary and grammar. In this chapter,
    we will discuss the concepts of constants and variables and their types as they
    relate to C programming language.


    The characters that can be used to form words, numbers and expressions depend
    upon the computer on which the program is run. However, a subset of characters
    is available that can be used on most personal, micro, mini and mainframe computers.
    The characters in C are grouped into the following categories:


    +   1. Letters

    2. Digits

    3. Special characters

    4. White spaces


    The entire character set is given in Table 2.1.

    The compiler ignores white spaces unless they are part of a string constant. White
    spaces may be used to separate words, but are prohibited between the characters
    of keywords and identifiers.


    # Trigraph Characters


    Many non-English keyboards do not support all the characters mentioned in Table
    2.1. ANSI C introduces the concept of "trigraph" sequences to provide a way to
    enter certain characters that are not available on'
