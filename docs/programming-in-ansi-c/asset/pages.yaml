    99


    We can also display a real number in exponential notation by using the specification:


    % w.p e


    The display takes the form


    [- m.nnnne± jxx


    where the length of the string of n''s is specified by the precision p. The default
    precision is 6. The field width w should satisfy condition:


    w ≥ p7


    The value will be rounded off and printed right justified in the field of columns.
    Padding the leading blanks with zeros and printing with left-justification is
    also possible by using flags 0 or before the field width specifier w.


    The following examples illustrate the output of the number y = 98.7654 under different
    format specifications:


    | Format | 9 | 8 | 7 | 6 | 5 | 4 | |

    |---|---|---|---|---|---||}{

    | printf("%.7.1f",y) | | | | | | | |

    | printf("%7.2f",y) | | | | | 7 | 7 |

    | printf("%.7f",y) | 9 | 8 | | | | | |

    | printf("%f",y) | 9 | 8 | 7 | 6 | 5 | 4 |

    | printf(\%-10.2e",y) | | | | 9 | 8 | 8 | e + 0 | 1 |

    | printf("%-11.4e",y) | | | | 9 | 8 | 7 | 5 | e + 0 | 1 |

    | printf("%-10.2e",y) | | | | 9 | 8 | 8 | e + 0 | 1 |

    | printf("%e",y) | | | | 9 | 8 | 7 | 6 | 5 | 4 | e + 0 | 1 |


    Some systems also support a special field specification character that lets the
    user define the field size at run time. This takes the following format:


    ```

    printf("%*f", width, precision);

    ```


    In this case, the field width and the precision are given as arguments which will
    supply the values for w and p. For example,


    ```

    printf("%*f", 7,2,number);

    ```


    is equivalent to


    ```

    printf("%.7.2f",number);

    ```


    The advantage of this format is that the values for width and precision may be
    supplied at run time, making the format dynamic. For example, the above statement
    can be used as follows:


    ```

    int width = 7;

    int precision = 2;

    ```


    ```

    ......

    printf("%.*f", width, precision);

    ```


