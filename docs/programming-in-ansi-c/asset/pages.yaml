  md: '# DYNAMIC MEMORY ALLOCATION AND LINKED LISTS


    # Key Terms


    Dynamic memory allocation I Stack, Heap I Linked list I Size of operators I malloc
    fuction calloc function allocate function Null pointer


    # 13.1 INTRODUCTION


    Most often we face situations in programming where the data is dynamic in nature.
    That is, the number of data items changing during execution of the program. For
    example, consider a program for the processing of lists of a corporation. The
    list grows when names are added and shrinks when names are deleted. When list
    grows we need to allocate more space to the list to accommodate additional data.
    Such situations can be handled more easily and effectively by using what is known
    as dynamic structures such as dynamic memory management techniques.


    Dynamic data structures provide flexibility in adding, deleting or rearranging
    data items at run time. Dynamic memory management techniques permit us to allocate
    additional memory or to release unswanted space at run time, optimizing the use
    of storage space. This chapter discusses the concept of linked lists, one of the
    basic types of dynamic data structures. Before we take linked lists, we shall
    briefly introduce the dynamic storage management functions that are available
    in C. These functions would be extensively used in processing linked lists.


    # 13.2 DYNAMIC MEMORY ALLOCATION


    C requires the number of elements in an array to be specified at compile time.
    But we may not be able to do so always. Our initial judgment of size, if it is
    wrong, may cause failure of the program or wastage of memory.


    Many languages permit a programmer to specify an array''s size at run time. These
    languages have the ability to calculate and assign, during execution, the memory
    space required by the variables in a program. The process of allocating memory
    at run is known as dynamic memory allocation. Although C does not inherently have
    this facility, there are four library routines known as "memory management functions"
    that can be used for allocating and freeing memory during program execution. They
    are listed in Table 13.1. These functions help us build complex programs that
    use the available memory intelligently.'
