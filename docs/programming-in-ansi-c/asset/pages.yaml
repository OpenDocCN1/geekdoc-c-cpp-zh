    # 1.10 EXECUTING ''A-C'' PROGRAM


    Executing a program in C involves a series of steps. These are:


    +   1. Creating the program;

    2. Compiling the program;

    3. Linking the program with functions that are needed from the C library; and

    4. Executing the program.


    Figure 1-10 illustrates the process of creating, compiling and executing a C program.
    Although these steps remain the same regardless of the operating system, command
    for implementing the steps and conventions for naming files may differ on different
    systems.


    An operating system is a program that controls the entire operation of a computer
    system. All input/output operations are handled through the operating system.
    The operating system is an interface between the hardware and in manages the execution
    of user programs.


    The two most popular operating systems today are Unix (for minicomputers) and
    MS-DOS (for microcomputers). We shall discuss briefly the procedure to be followed
    in executing C programs under both systems in the following sections.


    # 1.11 UNIX SYSTEM


    # Creating the Program


    Once we load the UNIX operating system into the memory, the computer is ready
    to receive program. The file name can consist of letters, digits and special characters,
    followed by a dot and a letter c. Examples of file names are:


    ```

    hello

    program.c

    ebl.c

    ```


    The file is created with the help of a text editor, either ed or vi. The command
    for calling the editor and creating the file is


    ```

    ed filename

    ```


    If the file existed it is loaded. If it does not exist, the file has to be created
    so that it is ready to receive the new program. Any corrections in the program
    are done by the editor. (The name of your system''s editor may be different. Check
    your system manual.)


    When editing the file, the file is saved on disk. It can then be referenced any
    time by its file name. The program that is entered into the file is known as the
    source program, since it represents the original form of the program.'
