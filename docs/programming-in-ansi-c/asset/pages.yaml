    \ This approach is very useful because any change in one file does not affect\
    \ other thus eliminating the need for recompilation of the entire program.\n\n\
    Multiple source files can share a variable by it declared as an external variable\
    \ appropriately. Variables are shared by two or more files and therefore we must\
    \ declare them accordingly in one file and explicitly define them with extern\
    \ in other files. Figure 9.17 illustrates the use of extern declarations in a\
    \ multile program.\n\nThe function in file1 can reference the variable m that\
    \ is declared as global in file2. Remember, function1cannot access the variable\
