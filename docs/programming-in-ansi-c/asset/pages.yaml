  md: "# The McGraw-Hill Companies\n\nArrays 219\n\n| | 35 | 10 |\n|---|---|---|n|\
    \ Trip-3 | 10 | 35 |\n| | 65 | 65 |\n| | 80 | 80 |\n\nDuring the first trip, three\
    \ pairs of items are compared and exchanged whenever needed. It should be noted\
    \ that the number 80, the largest among the items, has been moved down to the\
    \ end of the first trip. This means that each element 80 (the last in the new\
    \ list) need not be considered any further. Furthermore, trip-2 requires only\
    \ two pairs to be compared. This time, the number 65 (the second largest value)\
    \ has been moved down the list. Notice that each trip brings the smallest value\
    \ 10 up by one level.\nThe number of steps required in a trip is reduced by one\
    \ for each trip. The entire process will be over when a trip contains only one\
    \ element. If the list contains n elements, the number of comparisons involved\
    \ was n(n-1)/2.\n\n```\n#define N 10\nmain() {\n    int i,j,n;\n    float median,a[n],t;\n\
    \    printf(\"Enter the number of items\\n\");\n    scanf(\"%d\", &n);\n    /*\
    \ Reading items into array a */\n    printf(\"Input %d values\\n\", n);\n    for\
