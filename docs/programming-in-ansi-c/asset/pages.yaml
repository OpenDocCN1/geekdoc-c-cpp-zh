    # 302 Programming in ANSI C


    +   - Pass by value (also known as call by value).

    - Pass by Pointers (global; also known as call by pointers).


    In by value, values of actual parameters are copied to the variables in the parameter
    list of the calling function. The called function works on the copy and not on
    the original values of the actual parameters. This ensures that the data in the
    calling function cannot be changed accidentally.


    In by pointers (also known as pass by address), the memory addresses of the variables
    rather than the copies of values are sent to the calling function. In this case,
    the called function directly works on the data in the calling function and the
    changed values are available in the caller for its use.


    Pass by pointers is used when manipulating arrays and strings. This method is
    also used when we require multiple values to be returned by the function.


    # 9.19 THE SCOPE, VISIBILITY AND LIFETIME OF VARIABLES


    In C not only all variables have a data type, they also have a storage class.
    The following variable storage classes are most relevant to functions:


    +   1. Automatic variables.

    2. External variables.

    3. Static variables.

    4. Register variables.


    We shall briefly discuss the scope, visibility and longevity of each above class
    of variables. The scope of variable determines over what region of the program
    a variable is actually available for use (''active''). Longevity refers to the
    period during which a variable retains a given value during execution of a program
    (''life''). Visibility refers to the accessibility of a variable from where.


    The variables may also be categorized, depending on the place of their declaration,
    as internal (local) or external (global). Internal variables are those which are
    declared within a particular function, while external variables are declared outside
    of any function.


    It is very important to understand the concept of storage classes and their utility
    in order to develop efficient multifunction programs.


    # Automatic Variables


    Automatic variables are declared inside a function in which they are utilized.
    They are created when the function is called and destroyed automatically when
    the function exits, hence the name automatic. Automatic variables are therefore
    private (or local) to the function in which they are declared. Because of this
    property, automatic variables are also referred to as local or internal variables.


    A variable declared inside a function without storage class specification is,
    by default, an automatic variable. For instance, the storage class of the variable
    number in the example below is automatic.


    ![](img/177eacb192165f90062789304b5da281_313_0.png)'
