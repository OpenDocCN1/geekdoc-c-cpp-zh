    An integer constant refers to a sequence of digits. There are three types of integers,
    namely, decimal integer, octal and hexadecimal integer.


    +   - Decimal integers consist of a set of digits, 0 through 9, preceded by an
    optional – or + sign. Valid examples of decimal integers are:


    ```

    123 - 321 0 65431 +78

    ```'
