    # Programming in ANSI C


    Let us have a close look at the program. The first line informs the system that
    the name of the program is main and the execution begins at this line. The main()
    is a special function used by the C system to tell where the program starts. Every
    program must have exactly one main function. If we use more than one main function,
    the compiler cannot understand which one marks the beginning of the program.


    The empty pair of parentheses immediately following main indicates that the function
    has no arguments (or parameters). The concept of arguments will be discussed in
    detail later when we discuss comments (Chapter 9).


    The opening brace ''{'' in the second line marks the beginning of the function
    main and the closing brace ''}'' in the last line indicates the end of function.
    In this case, the closing brace also marks the end of the program. The function
    body contains a set of statements to perform the task.


    In this case, function body contains three statements out of which only the printf
    line is executable. Comments are enclosed between /* and */ and are known as comment
    lines. These are used in programs to enhance their readability and are not executable
    by this compiler. In general, a comment can be inserted anywhere—at the beginning,
    middle or end of a line—but in the middle of a word.


    Although comments can appear anywhere, they cannot be nested in C. That means
    we cannot have comments inside comments. When the compiler finds an opening token,
    it ignores everything until it finds a closing token. The comment line


    ```

    /* this is an error */

    ```


    is not valid and will error.


    Since comments do not affect the execution speed and the size of a compiled program,
    we should use them liberally in our programs. They help the programmers and other
    users in understanding the functions and operations of program and serve as an
    aid to debugging and testing. We shall see the use of comment lines more in the
    examples that follow


    Let us now look at the printf(), the only executable statement of the program.


    ```

    printf("I see, I remember");

    ```


    printf is a standard C function for printing output. Defined printf means that
    the function has already been written and compiled, and linked together with our
    program at the time of linking. The concepts of compilation and linking explain
    everything between the starting and the ending quotation marks to be printed out.
    In this case, the output will be:


    > I see, I remember


    Note that the printf line ends with a semicolon. Every statement in C should end
    with a () mark.


    Suppose we want to print the above quote in two lines


    > I see,

    I remember!


    This can be achieved by adding another printf function as shown:


    ```

    printf("I see, \n");

    printf("I remember ! \n");

    ```


    The information contained between the parentheses is called the argument of the
    function. The argument of the first printf function is ''I see'', and the second
    is ''I remember !''. These are simple strings of characters to be printed out.'
  merge: -1
