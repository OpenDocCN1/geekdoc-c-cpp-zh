    # 11.4 DECLARING POINTER VARIABLES


    In C, every variable must be declared for its type. Since pointers contain addresses
    that belong to a separate data type, they must be declared as pointers before
    we use them. The declaration of a pointer variable takes the following format:


    ```

    data_type *pt_name;

    ```


    This tells the compiler three things about the variable pt_name:


    +   1. The asterisk (*) tells that the variable pt_name is a pointer variable.

    2. pt_name needs a memory location.

    3. pt_name points to a variable of data_type.


    For example,


    ```

    int *p; /* integer pointer */

    ```


    declares the variable p as a pointer variable that points to an integer data type.
    Remember that the type int refers to the data type of the variable pointed to
    by p and not the type of the pointer itself.

    Similarly, the statement


    ```

    float *x; /* float pointer */

    ```


    declares x as a pointer to a floating-point variable.

    The declarations cause the compiler to allocate memory locations for the pointer
    variables p and x. Since the memory locations have not been assigned any values,
    these locations may contain some unknown values in them and therefore point to
    unknown locations as shown:


    ![](img/177eacb192165f90062789304b5da281_372_1.png)


    # Pointer Declaration Style


    Pointer variables are declared similarly as normal variables except for the addition
    of the unary operator. This symbol can appear anywhere between the type name and
    the printer variable name.\Programmers use the following:


    ```

    int *p;      /* style 1 */

    int *p;      /* style 2 */

    int *p;      /* style 3 */

    ```'
