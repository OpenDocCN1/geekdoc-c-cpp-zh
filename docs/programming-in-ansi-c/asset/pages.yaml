  md: "# 5.7 THE SWITCH STATEMENT\n\nWe have seen that when one of the many alternatives\
    \ is to be selected, we can use an if statement to control the selection. However,\
    \ the complexity of such a program increases dramatically when the number of alternatives\
    \ increases. The program becomes difficult to read and follow. At times, it may\
    \ confuse even the person who designed it. Fortunately, C has a built-in decision\
    \ statement known as switch. The switch statement tests the value of a variable\
    \ (expression) against a list of case values and when a match is found, a block\
    \ of statements associated with that case is executed. The general form of the\
    \ switch statement is as shown below:\n\n```\nswitch (expression)\n{\n    case\
    \ value-1:\n        block-1\n        break;\n    case value-2:\n        block-2\n\
    \        break;\n    ...\n    default:\n        default-block\n        break;\n\
    } statement-x;\n```\n\nThe expression is an integer expression or characters.\
    \ Value-1, value-2 .... are constants or constant expressions (evaluable to an\
    \ integer constant) and are known as case labels. Each of these values should\
    \ be unique within a switch statement. block-1, block-2 .... are statement lists\
    \ and may contain zero or more statements. There is no need to put brackets around\
    \ these blocks. Note that case labels end with a colon . \n\nWith the break statement\
    \ at the end of each case.\n\nWhen the switch is executed, the value of the expression\
    \ is successfully compared against the values value-1, value-2.... If a case is\
    \ found whose value matches the value of the expression, then the block of statements\
    \ that follows the case are executed.\n\nThe break statement at the end of each\
    \ case signals the end of a particular case and causes an exit from the switch,\
    \ transferring the control to the statement-x following the switch.\nThe default\
    \ is an optional case. When present, it will be executed if the value of the expression\
    \ does not match with any of the case values. If not present, no action takes\
    \ place if all matches fail and the control goes to the statement-x (ANSI C permits\
    \ the use of many as 257 case labels).\nThe selection process of switch statement\
    \ is illustrated in the flow chart in Fig. 5.11."
