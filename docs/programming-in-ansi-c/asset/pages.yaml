  md: "# DECISION MAKING AND LOOPING\n\nKey Terms\nProgram loop I Control statement\
    \ I while statement I do continue statement I break statement.\n\n# 6.1 INTRODUCTION\n\
    \nWe have seen in the previous chapter that it is possible to execute a segment\
    \ of a program repeatedly by introducing a counter and later it using the if statement.\
    \ While this method is quite satisfactory for all practical purposes, we need\
    \ to initialize a counter and test its value at an appropriate place in the program\
    \ for the completion of the loop. For example, suppose we want to calculate the\
    \ sum of squares of all integers between 1 and 10, we can write a program using\
    \ the if statement as follows:\n\n```\nsum = 0;\nn = 1;\nloop:\n  sum = sum +\
    \ n*n;\n  if (n == 10)\n    goto print;\n  else\n    n = n+1;\n    goto loop;\n\
    \nn = 10;\nend of loop\n\nprint: -> sum\n```\n\nThis program does the following\
    \ things:\n\n+   1. Initializes the variable n.\n2. Computes the square of n and\
    \ adds it to sum.\n3. Tests the value of n to see whether it is equal to 10 or\
    \ not. If it is equal to 10, then the program prints the results.\n4. If n is\
    \ less than 10, then it is incremented by one and the control goes back to compute\
    \ the sum again."
