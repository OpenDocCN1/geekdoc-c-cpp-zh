    # 3.11 EVALUATION OF EXPRESSIONS


    Expressions are evaluated using an assignment statement of the form: variable
    = expression;


    Variable is any valid C name. When the statement is encountered, the expression
    is evaluated first and then replaces the previous value of the variable on the
    left-hand side. All variables used in the expression must be assigned values before
    evaluation is attempted. Examples of evaluation statements


