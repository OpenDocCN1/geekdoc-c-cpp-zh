  md: '# 28 Programming in ANSI C


    Floating-point constants are normally represented as double-quantities. However,
    the suffixes f or F may be used to force single-precision and i or L to extend
    double precision further. Examples of valid and invalid numeric constants are
    given in Table 2.4.


    Table 2.4 Examples of Numeric Constants


    | Constant | Valid? | Remarks |

    | --- | --- | --- |

    | 698354L | Yes | Represents long integer |

    | 25000 | No | Com is not allowed |

    | +5.0E3 | Yes | (ANSI C supports unary plus) |

    | 3.5e-5 | Yes | |

    | 7.1 e4 | No | No white space is permitted |

    | -4.5e-2 | Yes | Exponent must be an integer |

    | 1.5E+2 | No | $ symbol is not permitted |

    | $255 | No | Hexadecimal integer |

    | 0XB | Yes |


    # Single Character Constants


    A single character (or simply character constant) contains a single character
    enclosed within a pair of single quote marks. Example of character constants are:


    '' '' ''X'' '' ''


    Note that the character constant ''5'' is not the same as the number 5. The last
    constant is a blank space.


    Character constants have values known as ASCII values. For example, the statement
    printf("%d", ''a\''); would print the number 97, the ASCII value of the letter
    a. Similarly, the statement printf("%c", ''a\''); would output the letter a. ASCII
    values for all characters are given in Appendix II.


    Since each character constant represents an integer value, it is also possible
    to perform arithmetic operations on character constants. They are discussed in
    Chapter 8.


    # String Constants


    A string constant is a sequence of characters enclosed in double quotes. The characters
    may be letters, numbers, special characters and blank space. Examples are:


    "1987" "WELL DONE" "...5+3X"


    Remember that a character constant (e.g., ''X'') is not equivalent to the single
    character string constant (e.g., "X"). Further, a single character string constant
    does not have an equivalent integer value while a character constant has an integer
    value. Character strings are often used in programs to build meaningful programs.
    Manipulation of character strings are considered in detail in Chapter 8.'
