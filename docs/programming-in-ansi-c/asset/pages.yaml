    # ANSI C LIBRARY FUNCTIONS


    The C language is accompanied by a number of library functions that perform various
    tasks. The ANSI committee has standardized header files which contain these functions.
    What follows is a list of commonly used functions and the header files where they
    are defined. For a more complete list, the reader should refer to the manual of
    the version of C that is being used.


    The header files that are included in this Appendix are:


    +   - <ctype.h> Character testing and conversion functions

    -<math.h> Mathematical functions

    -<stdio.h> Standard I/O library functions

    -<stdlib.h> Utility functions such as string conversion routines, memory allocation
    routines, random number generator, etc.

    -<string.h> String manipulation functions

    -<time.h> Time manipulation functions


    Note: The following function parameters are used:


    +   - c - character type argument

    - d - double precision argument

    - f - file argument

    - i - integer argument

    - l - long integer argument

    - p - pointer argument

    - s - string argument

    - u - unsigned integer argument


    An asterisk (*) denotes a pointer'
