    # 4.2 READING A CHARACTER


    The simplest of all input/output operations is reading a character from the ''standard
    input unit (usually the keyboard) and writing it to the ''standard output unit
    (the screen). Reading a single character can be done by using the function getchar.
    (This can also be done with the help of the scanf function which is discussed
    in Section 4.4) The getchar takes the following form:


    ```

    variable_name = getchar();

    ```


    variable_name is a C variable that has been declared as char type. When this statement
    is encountered, the computer waits until the user presses a key then assigns this
    character as a value to getchar function. Since getchar is the right-hand side
    of an assignment statement, the character value of getchar is turn assigned to
    the variable name on the left. For example


    ```

    char name;

    name = getchar();

    ```


    Will assign the character ''H'' to the variable name when we press the key H on
    the keyboard. Since getchar is a function, it requires a set of parentheses as
    follows:


    # Program 4.1


    The program in Fig. 4.1 shows the use of getchar function in an interactive environment.


    The program displays a question of YES/NO type to the user and reads the user''s
    response in a single character (Y or N). If the response is Y or y, it outputs
    the message


    My name is BUSY BEE


    You are good for nothing


    otherwise, outputs


    There is one line space between the input text and output message.


    ```

    Program

    #include <stdio.h>

    main()

    {

    char answer;

    printf("Would you like to know my name?\nn");

    printf("Type Y for YES and N for NO: \n");

    answer = getchar(); /*... Reading a character...*/

    if(answer == ''Y'' || answer == ''y'')

    printf("\n\nMy name is BUSY BEE\n");

    else

    printf("\n\nYou are good for nothing\n");

    }

    Output

    Would you like to know my name?

    ```'
