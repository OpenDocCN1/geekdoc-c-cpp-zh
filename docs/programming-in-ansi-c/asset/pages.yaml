    # strmp() Function


    The strcmp function compares two strings identified by the arguments and has a
    value 0 if they are equal. If not, it has the numeric difference between the first
    nonmatching characters in the strings. It takes the form:


    ```

    strmp(string1,string2);

    ```


    string1 and string2 may be variables or string constants. Examples are:


    ```

    strcmp(name1,"name2");

    ```


    ```

    strcmp(name1,"John");

    ```


    ```

    strcmp("Roe","Sam");

    ```


    Our major concern is to determine whether the strings are equal: if not, which
    is alphabetically above. The value of mismatch is rarely important. For example,
    the statement


    ```

    strcmp("their","there");

    ```


    will return a value of -9 which is the numeric difference between ASCII "i" and
    ASCII "r". That is, "i" minus "r" in ASCII code is -9. If the value is negative,
    string1 is alphabetically above string2.'
