  md: '# PROGRAM EFFICIENCY


    Two critical resources of a computer system are execution time and memory. The
    efficiency of a program is measured in terms of these two resources. Efficiency
    can be improved with good design and coding practices.


    # Execution Time


    The execution time is directly tied to the efficiency of the algorithm selected.
    However, certain coding techniques can considerably improve the execution efficiency.
    The following are some of the techniques, which could be applied while coding
    the program.


    +   1. Select the fastest algorithm.

    2. Simplify arithmetic and logical expressions.

    3. Use fast arithmetic operations, whenever possible.

    4. Carefully evaluate loops to avoid any unnecessary calculations within the loops.

    5. If possible, avoid the use of multi-dimensional arrays.

    6. Use pointers for handling arrays and strings.


    +   However, remember the following, when attempting to improve efficiency:

    1. Analyse the algorithm and various parts of the program before attempting any
    changes.

    2. Make it work before making it.

    3. Keep it right while trying to make it faster.

    4. Do not sacrifice clarity for efficiency.


    # Memory Requirement


    Memory restrictions in the micro-computer environment is a real concern to the
    programmer. It is therefore, desirable to take all necessary steps to compress
    memory requirements. This is the key to memory efficiency.


    +   1. Keep the program simple.

    2. Use an algorithm that is simple and requires less steps.

    3. Declare arrays and strings with correct sizes.

    4. When possible, limit the use of multi-dimensional arrays.

    5. Try to evaluate and incorporate memory compression features available with
    the language.


    15.1 Discuss the various aspects of program design.

    15.2 How does program design relate to program efficiency?

    15.3 Readability is more important than program efficiency, Comment.

    15.4 Distinguish between the following:


    +   a. Syntactic errors and semantic errors.

    b. Run-time errors and logical errors.

    c. Run-time errors and latent errors.

    d. Debugging and testing.

    e. Compiler testing and run-time testing.'
