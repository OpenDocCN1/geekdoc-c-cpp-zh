    # Structured Programming


    Structured programming is an approach to the design and development of programs.
    It is a discipline of making a program''s logic easy to understand by using only
    the basic control structures:


    +   - Sequence (straight line)

    - Selection (branching structure)

    - Repetition (looping structure)


    While sequence and loop structures are sufficient to meet all the requirements
    of programming, the selection structure proves to be more convenient in some situations.


    The use of structured programming helps ensure well-designed programs that are
    easier to write, read, debug and maintain compared to those that are unstructured.


    Structured programming discourages the implementation of unconditional branching
    using jump statements as goto, break and continue. In its purest form, structured
    programming is synonymous with ‘goto less programming.


    Do not go to goto statement!'
