    \n# Simple ‘for’ Loops\n\nThe for loop is another entry-controlled loop that provides\
    \ a more concise loop control structure. The general form of the for loop is\n\
    \n```\nfor ( initialization ; test-condition ; increment ) {\n    body of the\
    \ loop\n}\n```\n\nThe execution of the for statement is as follows:\n\n+   1.\
    \ Initialization of the control variables is done first, with assignment statements\
    \ such as i = 1 and count = 0. The variables i and count are known as loop-control\
    \ variables.\n2. The value of the control is tested using the test condition.\
    \ The test-condition is a relational expression, such as i < 10 determines when\
    \ the loop will exit. If the condition is true, the body of the loop is executed;\
    \ otherwise the loop is terminated and the execution continues with the statement\
    \ that immediately follows the loop.\n3. When the body of the loop is executed,\
    \ the control is transferred back to the for statement after evaluating the last\
    \ statement in the loop. Now, the control variable is incremented using an assignment\
    \ statement such as i++ and the new value of the control variable is tested to\
    \ see whether it satisfies the loop condition. If the condition is satisfied,\
    \ the body of the loop is executed again. This process continues until the value\
    \ of the control variable fails to satisfy the loop.\n\n> C9 enhances the for\
    \ loop by allowing declaration of variables in the initialization permits option.\
    \ See the Appendix for “C9 Features”.\n\nConsider the following segment of a program:\n\
    \n```\nfor ( x = 0 ; x <= 9 ; x = x+1 ) {\n    printf(\"%d\\n\", x);\n}\n```\n\
    \nThis for loop executes 10 times and prints the digits 0 to 9 in one line. The\
