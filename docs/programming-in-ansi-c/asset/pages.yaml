    * Character Types

    * Structures

    * Unions

    * Enumerations


    Arrays and structures are referred to as structured data types because they can
    be used to represent data values that have a structure of some sort. Structured
    data provide an organizational scheme to show the relationships between the individual
    elements and facilitate efficient data manipulations. In programming parlance,
    such data types are known as data structures.

    In addition to arrays and structures, C supports creation and manipulation of
    the following types:


    +   * Linked Lists

    * Stacks

    * Queues

