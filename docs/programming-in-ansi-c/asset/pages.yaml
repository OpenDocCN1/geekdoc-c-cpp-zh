    Fig. 11.1 Memory organisation


    Whenever we declare a variable, the system allocates, somewhere in the memory,
    an appropriate location to hold the value of the variable. Since every byte has
    a unique address number, this location will have its own address number. Consider
    the following statement


    ```

    int quantity = 179;

    ```


    This statement instructs the system to find a location for the integer variable
    quantity and puts value 179 in that location. Let us assume that the system has
    chosen the address 5000 for quantity. We may represent this as shown in Fig. 11.2.
    (Note that the address of a variable is the address of the first byte occupied
    by that variable.)


    | Quantity | Value |

    |--- |---|

    | 179 | |

    | 5000 | Address |


    Fig. 11.2 Representation of a variable


    During execution of the program, the system always associates the name quantity
    with 5000.

    (This is something similar to having a house number as well as a house name.)
    We may have access to the value 179 by using either the name quantity or the address
    5000. Since memory addresses are simply numbers, they can be assigned to some
    variables, that can be stored in memory, like any other variable. Such variables
    that hold memory addresses are called pointer variables. A pointer variable'
