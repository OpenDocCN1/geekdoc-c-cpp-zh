  md: '# 14.5 ANSI ADDITIONS


    ANSI committee has added some more preprocessor directives to the existing list
    given in Table 14.1.

    They are:


    +   - #elif: Provides alternative test facility

    - #pragma: Specifies certain instructions

    - #error: Stops compilation when an error occurs


    The ANSI standard also includes two new preprocessor operations:


    +   - #: Stringizing operator

    - ##: Token-passing operator


    # # elif Directive


    The #elif enables us to establish an "if...else...if..." sequence for testing
    multiple conditions.

    form of use of #elif is:


    ```

    #if expression 1

    statement sequence 1

    #elif expression 2

    statement sequence 2

    ...

    #elif expression N

    statement sequence N

    ```


    For example:


    ```

    #if MACHINE == HCL

    #define FILE == "hcl.h"

    #elif MACHINE == WIPRO

    #define FILE "wipro.h"

    #elif MACHINE == DCM

    #define FILE "dcm.h"

    #endif

    #include FILE

    ```


    # #pragma Directive


    The #pragma is an implementation oriented directive that allows us to specify
    various instructions

    g to the compiler. It takes the following form:


    ```

    #pragma name

    ```


    where, name is the name of the pragma we want. For example, under Microsoft C,


    ```

    #pragma loop_opt(on)

    ```


    causes loop optimization to be performed. It is ignored, if the compiler does
    not recognize it.'
