  md: '# The McGraw-Hill Companies


    # 152 Programming in ANSI C


    The program evaluates the statement sum = sum + n*;


    10 times. That is, the loop is executed 10 times. This number can be increased
    or decreased easily by modifying the relation appropriately in the statement if
    (n == 10). On such occasions where the repeat number of repetitions are known,
    there are more convenient methods of looping in C. These looping capabilities
    enable us to develop concise programs for repetitive processes without the use
    of goto statements.


    In looping, a sequence of statements are executed until termination of the loop
    are satisfied. A program loop consists of two segments, one as the body of the
    loop and the other as the control statement. The control statement tests certain
    conditions and directs the repeated execution of the statements contained in the
    body of the loop.


    Depending on the position of the control statement in the loop, a control structure
    may be classified either as an entry-controlled loop or exit-controlled loop.
    The flow charts in Fig. 6.1 illustrate these structures. In the entry-controlled
    loop, the control conditions are tested before the start of the loop execution.
    If the conditions are not satisfied, the body of the loop will not be executed.
    In the case of an exit-controlled loop, the test is performed at the end of the
    body of the loop and therefore the body is executed unconditionally for the first
    time. The entry-controlled and exit-controlled loops are also known as pre-test
    and post-test loops respectively.


    ![](img/177eacb192165f90062789304b5da281_163_0.png)


    Fig. 6.1 Loop control structures


    The test conditions should be carefully stated in order to perform the desired
    number of loop executions. It is assumed that the test condition will eventually
    transfer the control out of the loop. In case, due to some reason it does not,
    the control sets up an infinite loop and the body is executed over and over again.


    A looping process, in general, would include the following four steps:


    +   1. Setting and initialization of a control variable.

    2. Execution of the statements in the loop.'
