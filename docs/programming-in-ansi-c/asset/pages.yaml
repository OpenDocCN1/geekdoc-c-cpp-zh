  md: '# 14.3 FILE INCLUSION


    An external file containing functions or macro definitions can be included as
    a part of a program so that we need not rewrite those functions. In this case,
    an included other files is allowed. This is achieved by the preprocessor directive


    ```

    #include "filename"

    ```


    where filename is the name of the file containing the required definitions or
    functions. At this point, the preprocessor inserts the entire contents of filename
    into the source code of the program. When the filename is included within the
    double quotation marks, the search for the file is made first in the current directory
    and then in the standard directories.


    Alternatively this directive can take the form


    ```

    #include <filename>

    ```


    without double quotation marks. the file is searched only in the standard directories.
    Nesting of included files is allowed. That is, an included file can include other
    files. however, a file cannot include itself.


    If an included file is not found, an error is reported and compilation is terminated.


    Let us assume that we have created the following files:


    ```

    SYNTAX.C    contains syntax definitions.

    STAT.C      contains statistical functions.

    TEST.C      contains test functions.

    ```


    We can make use of a definition or function contained in any of these files by
    including them in the program:


    ```

    #include <stdio.h>

    #include "SYNTAX.C"

    #include "STAT.C"

    #include "TEST.C"

    #define M 100

    main() {



    }

    ```


    # 14.4 COMPILER CONTROL DIRECTIVES


    While developing large programs, you may face one or more of the following situations:


    +   1. You have included a file containing some macro definitions. It is not known
    whether a particular macro (say, TEST) has been defined in that header file. However,
    you want to be certain that Test is defined (or not defined).\2. Suppose a customer
    has two different types of computers and you are required to write a program that
    will run on both the systems. You want to use the same program, although certain
    lines of code must be different for each system.'
