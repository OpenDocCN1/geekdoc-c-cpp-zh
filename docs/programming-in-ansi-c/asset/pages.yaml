    \ both functions could refer to m. This can also be achieved by using extern int\
    \ m; inside each function in file1.\n\nThe extern specifier tells the compiler\
    \ that the following variable types and names have already been declared elsewhere\
    \ and no need to create storage space for them. It is the responsibility of the\
    \ linker to reference that a global variable should be declared without extern\
    \ in one (and only one) of the files. The extern declaration is done in places\
    \ where secondary references are made. If we declare a variable as global in two\
    \ different files used by a single program, then the linker will link to that\
    \ variable to use and, therefore, issues a warning.\n\n```\nfile1.c\nmain() {\n\
    \    extern int m;\n    int i;\n    ...\n}\nfunction1() {\n    extern int J;\n\
