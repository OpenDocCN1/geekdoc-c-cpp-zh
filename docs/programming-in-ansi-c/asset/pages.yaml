    # 13.8 ADVANTAGES OF LINKED LISTS


    A linked list is dynamic structure. Therefore, the primary advantage of linked
    lists over arrays is that linked lists can grow or shrink during the execution
    of a program. A linked list can be made just as long as required.


    Another advantage is that a linked list does not waste memory space. The memory
    that is just needed for the list at any point of time. This is because it is not
    necessary to specify the number of nodes to be used in the list.


    The third, and the most important advantage is that the linked lists provide flexibility
    allowing the items to be rearranged efficiently. It is easier to insert or delete
    items by rearranging the lists. This is shown in Fig. 13.


    The major limitation of linked lists is that the access to any arbitrary item
    is cumbersome and time consuming. Whenever we deal with a fixed length list, it
    would be better to use an array rather than a linked list. We must also note that
    a linked list will use more store than an array with the same number of items.
    This is because each item has an additional linked field.


    # 13.9 TYPES OF LINKED LISTS


    There are different types of linked lists. The one we discussed so far is known
    as linear linked list. The other linked lists are:


    +   - Circular linked lists.

    - Two-way or doubly linked lists.

    - Circular doubly linked lists.


    The circular linked lists have no beginning and end. The last item points back
    to the first item. The doubly linked list uses double set of pointers, pointing
    to the next item and one pointing to the previous item. This allows us to traverse
