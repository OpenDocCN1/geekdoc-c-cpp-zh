  md: '# Programming in ANSI C


    Modules are identified and designed such that in C they can be organized into
    a top-down hierarchical structure (similar to an organization chart). In C, each
    module refers to a function that is responsible for a single task.


    Some characteristics of modular programming are:


    +   1. Each module should do only thing.

    2. Communication between modules is allowed only by a calling module.

    3. A module can be called by one and only one higher module.

    4. No communication can take place directly between modules that do not have calling-called
    relationship.

    5. All modules are designed as single-entry, single-exit systems using control
    structures.


    # ELEMENTS OF USER-DEFINED FUNCTIONS


    We have discussed and used a variety of data types and variables in our programs
    so far. However, declaration and use of these variables were primarily done inside
    the main function. As mentioned in Chapter 4, functions are classified as one
    of the derived data types in C. We can therefore define functions and use them
    like any other variables in C programs. It is therefore not a surprise to note
    that there exist some similarities between functions and variables in C.


    +   • Function names and variable names are considered identifiers and therefore
    they must adhere to the rules for identifiers.

    • Like variables, functions have types (such as int) associated with them.

    • Like variables, function names and their types must be declared and defined
    before they are used in a program.


    In order to make use of user-defined function, we need to establish three elements
    that are related to functions.


    +   1. Function definition.

    2. Function call.

    3. Function declaration.


    The function definition is an independent program that is specifically written
    to implement the requirements of the function. In order to use this function we
    must invoke it at a required place in the program. This is known as the function
    call. The program (or a function) that calls the function is referred to as the
    calling program or calling function. The calling program should declare any function
    (like declaration of a variable) that is to be used later in the program. This
    is known as the function declaration or function prototype.


    # DEFINITION OF FUNCTIONS


    A function definition, also known as function implementation shall Include the
    following elements:


    +   1. function name;

    2. function type;

    3. list of parameters;'
