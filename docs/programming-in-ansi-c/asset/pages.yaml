  md: "# The McGraw-Hill Companies\n\n# User-Defined Type Declaration\n\nC supports\
    \ a feature known as \"type definition\" that allows users to define an identifier\
    \ that would represent an existing data type. The user-defined data type identifier\
    \ can later be used to declare variables. It takes the general form:\n\n```\n\
    typedef int identifier;\n```\n\nWhere type refers to an existing data type and\
    \ \"identifier\" refers to the \"new\" name given to the data type. The existing\
    \ data type may belong to any class of type, including the user-defined ones.\
    \ Remember that the type is \"new\" in name, but not the data type. typedef cannot\
    \ create a new type. Some examples of type definition are:\n\n```\ntypedef int\
    \ units;\ntypedef float marks;\n```\n\nHere, units symbolizes batch1, batch2;\
    \ They can be used later to declare variables as follows:\n\n```\nunits name[50],\
    \ name[20];\n```\n\nbatch1 and batch2 are declared as variable and name[50] and\
    \ name[20] are declared as 50 floating point array elements. The advantage of\
    \ enumeration is that we can create meaningful data names for increasing the readability\
    \ of the program.\n\nAnother user-defined data type is enumerated data type provided\
    \ by ANSI standard. It is defined as follows:\n\n```\nenum identifier {value1,\
    \ value2, ... valueN};\n```\n\n \"identifier\" is a user-defined enumerated data\
    \ type that can be used to declare variables that can have one of the values within\
    \ the braces (known as enumeration constants). After this definition, we can declare\
    \ variables to be of this \"new\" type:\n\n```\nenum identifier v1, v2, ... vn;\n\
    ```\n\nThe enumerated variables v1, v2, ... vn can only hold one of the values\
    \ value1, value2, ... valueN. The assignments of the following types are:\n\n\
    ```\nv1 = value3;\nv5 = value;\n```\n\nAn example:\n\n```\nenum day {Monday, Tuesday,\
    \ ... Sunday};\nenum week {week_st, week_end};\nweek_st = Monday;\nweek_end =\
    \ Friday;\nif (week_st == Tuesday)\nweek_end = Saturday;\n```\n\nThe compiler\
    \ automatically assigns integer digits beginning with 0 to all the enumeration\
    \ constants. That is, the enumeration constant value1 is assigned 0, value2 is\
    \ assigned 1, and so on. However, the automatic assignments can be overridden\
    \ by assigning values explicitly to the enumeration constants. For example:\n\n\
    ```\nenum day {Monday = 1, Tuesday, ... Sunday};\n```\n\nHere, the constant Monday\
    \ is assigned the value of 1. The remaining constants are assigned increase successively\
    \ by 1."
