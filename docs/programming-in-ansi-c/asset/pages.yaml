    Arrays 203


    Sorting is the process of arranging elements in the list according to their values,
    in ascending or descending order. A sorted list is called an ordered list. Sorted
    lists are especially important in list searching because they facilitate rapid
    search operations. Many sorting techniques are available. The three simple and
    most important among are:


    +   - Bubble sort

    - Selection sort

    - Insertion sort


    Other sorting techniques include Shell sort, Merge sort and Quick sort.

    Searching is the process of finding the location of the element in a list. The
    specified element is often called the search key. If the process of searching
    finds a match with list value, the search to be successful; otherwise, it is unsuccessful.
    The two most commonly used search techniques are:


    +   - Sequential search

    - Binary search


    A detailed discussion on these techniques is beyond the scope of this text. Consult
    any good book on data structures and algorithms.


    # 7.5 TWO-DIMENSIONAL ARRAYS


    So far we have discussed the arrays that store a list of values. There could be
    situations where a table of values have to be stored. Consider the following data
    table, which shows the value of sales of three items by four girls:


    | Item1 | Item2 | Item3 |

    |---|---|---||

    | Salesgirl #1 | 310 | 275 | 365 |

    | Salesgirl #2 | 210 | 190 | 325 |

    | Salesgirl #3 | 405 | 235 | 240 |

    | Salesgirl #4 | 260 | 300 | 380 |


    The table contains a total of 12 values, three in each line. We can think of this
    as a matrix consisting of four rows and three columns. Each row represents the
    values of sales by a particular salesgirl and each column represents the values
    of sales of a particular item.


    In mathematics, we represent a particular value in a matrix using two subscripts
    such as $v_{ij}$, where $v$ denotes the entire matrix and $i$ refers to the $i^{th}$
    row and $j^{th}$ column. For example, in the above table $v_{23}$ refers to 325.


    C us to define sets of items using two-dimensional arrays. The table discussed
    above be defined in C as


    Two-dimensional arrays are declared as follows:


    ```

    type array_name [row_size][column_size];

    ```


    That unlike most other languages, which use one pair of parentheses with commas
    to separate array sizes, C places each size in its own set of brackets.'
