  md: '# The McGraw-Hill Companies


    User-Defined Functions 281


    A prototype declaration may be placed in two places in a program.


    +   1. Above all the functions (including main).

    2. Inside a function definition.


    When we place the declaration above all the functions (in the global declaration
    section), the prototype is referred to as a global prototype. Such declarations
    are available for all the functions in the program.

    When we are in a function definition (in the local declaration section), the prototype
    is called a local prototype. Such declarations are primarily used by the functions
    containing them.

    The place of declaration of a function defines a region in which the function
    may be used by other functions. Scope is discussed later in this chapter. It is
    a good programming style to declare prototypes in the global declaration section
    before main. It adds flexibility, provides an excellent quick reference to the
    functions used in the program, and enhances documentation.


    # Prototypes: Yes or No


    Prototypes are not essential. If a function has not been declared before it is
    used, C will assume that its details available at the time of linking. Since the
    prototype is not available, C will assume that the return type is an integer and
    the types of parameters match the formal definitions.

    If these assumptions are wrong, the linker will fail and we will have to change
    the program. The moral is that must always include prototype declarations, preferably
    in global declaration section.


    # Parameters Everywhere!


    Parameters (also known as arguments) are used in three places:


    +   1. in declaration (prototypes),

    2. in function call,

    3. in function definition.


    The parameters used in prototypes and function definitions are called formal parameters
    and those used in function calls are called actual parameters. Actual parameters
    used in a calling statement may be simple constants, variables or expressions.

    The formal and actual parameters must match exactly in type, order and number.
    Their names, however, do not need to match.


    # 9.9 CATEGORY OF FUNCTIONS


    A function, depending on whether arguments are present or not whether a value
    is returned or not, may belong to one of the following categories:


    +   Category 1: Functions with no arguments and no return values.

    Category 2: Functions with arguments and no return values.

    Category 3: Functions with arguments and one return value.

    Category 4: Functions with no arguments but return a value.

    Category 5: Functions that return multiple values.'
