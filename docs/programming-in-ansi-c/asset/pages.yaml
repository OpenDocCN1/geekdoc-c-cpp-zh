  md: '# The McGraw Hill Companies


    238 Programming in ANSI C


    # 8.2 DECLARING AND INITIALIZING STRING VARIABLES


    C does not support strings as a data type. However, it allows us to represent
    strings as character arrays. In C, therefore, a string variable is any valid C
    variable name and is always declared as an array of characters. The general form
    of declaration of a string variable is:


    ```

    char string_name[size];

    char city[10];

    char name[30];

    ```


    The size determines the number of characters in the string_name. Some examples
    are:


    When the compiler assigns a character string to a character array, it automatically
    supplies a null character (''\0'') at the end of the string. Therefore, the size
    should be equal to the maximum number of characters in the string plus one.


    Numeric arrays may be initialized when they are declared. C permits a character
    array to be initialized in either of the following forms:


    ```

    char city[9] = "NEW YORK";

    char city[9] = {''N'',''E'',''W'','' '',''Y'',''O'',''R'',''K'',''\0''};

    ```


    The reason that city had to be 9 elements is that the string NEW YORK contains
    8 characters and one element space had to provide the terminator. Note that when
    we initialize a character array without specifying the number, we must supply
    the null terminator. In such cases, the size of the array will be determined automatically,
    based on the number of elements initialized. For example, the statement


    ```

    char string1[5] = {''G'',''O'',''O'',''D'',''\0''};

    ```


    defines the array string as a five element array


    We can also declare the string much larger than the string size in the initializer.
    That is, the statement


    ```

    char str1[10] = "GOOD";

    ```


    is permitted. In this case, the compiler creates a character array of size 10,
    places the value "GOOD" in it, terminates with the null character, and all other
    elements to NULL. The storage will look like:


    | G | O | O | D | \0 | 0 | 0 | 0 | 0 | 0 |


    However, the following declaration is illegal:


    ```

    char str2[3] = "GOOD";

    ```


    This will result in a compile time error. Also note that we cannot separate the
    initialization from declaration. That is,


    ```

    char str3[5] = "GOOD";

    ```


    is not allowed. Similarly,


    ```

    char s1[4] = "abc";

    char s2[4];

    s2 = s1; /* Error * /n

    ```


    is not allowed. An array name cannot be used as the left operand of an assignment
    operator.'
