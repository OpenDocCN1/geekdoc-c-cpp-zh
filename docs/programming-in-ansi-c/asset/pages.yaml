  md: '# Case Studies


    # 1. Median of a List of Numbers


    **Problem:** When all the items in a list are arranged in an order, the middle
    value which divides the items into two parts with equal number of items on either
    side is called the *median*. Odd number of items have just one middle value while
    even number of items have two middle values. The median for even number of items
    is therefore designated as the average of the two middle values.


    The major steps for finding the median are as follows:


    +   1. Read the items into an array while keeping a count of the items.

    2. Sort the items in increasing order.

    3. Compute median.


    The program and sample output are shown in Fig. 7.10. The sorting algorithm is
    used as follows:


    +   1. Compare the first two elements in the list, say a[1] and a[2]. If a[2]
    is smaller than a[1], then interchange their values.

    2. Compare a[2] and a[3], interchange them if a[3] is smaller than a[2].

    3. Continue this process till the last two elements are compared and interchanged.

    4. Repeat the above steps n-1 times.


    In repeated trips through the array, the smallest elements "bubble up" to the
    top. Because of this bubbling effect, this algorithm is called *bubble sorting*.
    The bubbling effect is illustrated below for four items.


    ![](img/177eacb192165f90062789304b5da281_229_0.png)'
