    # Just Remember


    +   - Remember to place a semicolon at the end of definition of structures and
    unions.

    - We declare a structure variable at the time of definition of a structure by
    placing it after the closing brace before the semicolon.

    - Do not place the structure tag name after the closing brace in definition. That
    will be treated as a structure variable. The tag name must be placed before the
    opening brace or after the keyword struct.

    - When we use typedef definition, the type_name comes after the closing brace
    before the semicolon.

    - We cannot declare a variable at the time of creating a typedef definition. We
    must use the type_name to declare a variable in an independent statement.

    - It is error to use a structure variable as a member of its own struct type.

    - Assigning a structure of one type to structure of another type is an error.

    - Declaring a variable using the tag name (only without the keyword struct) is
    an error.

    - It is error to compare two structure variables.

    - It is illegal to refer a structure member using only the member name.

    - When structures are nested, a member must be qualified with all levels of structures
    nesting it.

    - When accessing a member with a dot and dot notation, parentheses are required
    after the pointer, like (ptr)->name.

    - The selection operator ( -> ) is a single token. Any space between the symbols
    - and is an error

    - When using scanf for reading values for members, we must use address operator
    & with non-string members.

    - Forgetting to include the array subscript when referring to individual structures
    of an array is error

    - A union can only store one of its members at a time. We must exercise in accessing
    the correct member. Accessing a wrong data is a logic error.

    - It is error to initialize a union when creating a structure that does not match
    the type of the first member.

    - Always provide a structure tag name when creating a structure. It is convenient
    to use tag name to declare structure variables later in the program.

    - Use short and meaningful tag name.

    - Avoid using same name for members of different structures (although it is not
    illegal).

    - Passing structures to functions by pointers is more efficient than passing by
    value. (Passing by pointers is discussed in Chapter 11.)'
