    # Control Structures


    A complex solution may involve a large number of control statements to direct
    the flow of execution. In some situations, indiscriminate use of control statements
    as goto may lead to undesirable and incomprehensible programs. It has been demonstrated
    that any algorithm can be structured, using the three basic control structure,
    namely sequence structure, selection structure, and looping structure.


    Sequence structure denotes the execution of statements one after another. Selection
    structure involves a decision, based on a condition and may have two or more branches,
    which join again at a later point. If ... else and switch statements in C be used
    to implement a selection structure. Looping structure is used when a set of instructions
    is evaluated repeatedly. This structure can be implemented using do, while, or
    for statements.


    A well-designed program would provide the following benefits:


    +   1. Coding is easy and error-free.

    2. Testing is simple.

    3. Maintenance is easy.

    4. Good documentation is possible.

    5. Cost estimates can be made more accurately.

    6. Progress of coding can be controlled more precisely.


    # 15.3 PROGRAM CODING


    The algorithm developed in the previous section must be translated into a set
    of instructions that a computer can understand. The major emphasis in coding should
    be simplicity and clarity. A program written by one may have to be read by others
    later. Therefore it should be readable and simple to understand. Complex and tricky
    coding style should be avoided. The elements of coding style include:


    +   - Internal documentation.

    - Construction of statements.

    - Generality of the program.

    - Input/output formats.


    # Internal Documentation


    Documentation refers to the details that describe a program. Some details may
    be built-in as an integral part of the program. These are known as internal documentation.


    Two important aspects of internal documentation are, selection of meaningful variable
    names and the use of comments. Selecting of meaningful documentation is crucial
    for understanding the program. For example,


    ```

    area = breadth * length

    ```


    is more meaningful than


    ```

    a = b * 1;

    ```'
