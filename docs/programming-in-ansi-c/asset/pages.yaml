    \nRules of use\n\n+   1. The scope of a global variable is the entire program\
    \ file.\n2. The scope of a local variable begins at point of declaration and ends\
    \ at the end of the block or which it is declared.\n3. The scope of a formal function\
    \ argument is its own function.\n4. The lifetime ( longevity) of an auto variable\
    \ declared in main is the entire program execution time, although its scope is\
