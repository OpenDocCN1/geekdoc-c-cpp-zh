    # 13.7 CONCEPTS OF LINKED LISTS


    We know that a list refers to a set of items organized sequentially. An array
    is an example of list. In an array, the sequential organization is provided implicitly
    by its index. We use the index for accessing and manipulation of array elements.
    One problem with the arrays is that the size of an array must be specified precisely
    at the beginning. As pointed out earlier, this might be a difficult task in real-life
    applications.


    A completely different way to represent a list is to make each item in the list
    part of a structure that also contains a "link" to the next item, as shown in
    Fig. 13.4. This type of list is called a *linked* list because it is list whose
    order is given by links from one item to the next.


    ![](img/177eacb192165f90062789304b5da281_436_1.png)


    Each element of the list is a *node* and consists of two fields, one containing
    the item, and the other containing the address of the next item (a pointer to
    the next item) in the list. A linked list is therefore a collection of structures
    ordered not by their physical placement in memory (like an array) but by logical
    links that are stored as part of the data in the structure itself. The link is
    in the form of a pointer to another structure of the same type. Such a structure
    is represented as follows:'
