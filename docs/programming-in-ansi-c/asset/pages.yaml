    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Character | | A | B | C | Z |

    | ---> | | | | | |


    We are reading the file twice. First, we are reading the content of every fifth
    byte and printing its value along with its position on the screen. The second
    time, we are reading the contents of the file and printing the same on the screen.


    During the first reading, the file pointer crosses the end-of-file marker when
    the parameter n of fseek(fp,n,0) becomes 30. Then, after printing the content
    of 30, the loop is terminated.


    For reading the file from the end, we use the statement


    ```

    fseek(fp,-2L, 1);

    ```


    to position the file pointer to the last character. Since every read caches the
    position to move forward one position, we have to move it back by two positions
    to read the next character. This is achieved by the function


    in the while statement. This also tests whether the file pointer has crossed the
    file boundary or not. The loop is terminated as soon as it crosses.'
