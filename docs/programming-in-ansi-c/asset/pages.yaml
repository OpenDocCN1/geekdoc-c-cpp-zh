  md: "integer expressions. The values of these variables can be specified just before\
    \ they are used. Such\narrays are called variable-length arrays.\n\nExample:\n\
    \n```\nmain()\n{\n    int m, n;\n    scanf(\"%d %d\", &m, &n);\n    float matrix[\
    \ m ][ n ]; /* variable-length array */\n}\n```\n\nWe can specify the values of\
    \ m and n at run time interactively thus creating the matrix with different\n\
    size each time the program is run.\n\n# Type Specification in Array Declaration\n\
    \nWhen we pass arrays as function arguments, we can qualify the dimension parameters\
    \ with the keyword\nstatic. For example:\n\n```\nvoid array (int x [ static 20\
    \ ])\n{\n    ...\n}\n```\n\nThe qualifier static guarantees that the array contains\
    \ at least the specified number of elements.\n\n# Flexible Arrays in Structures\n\
    \nWhen designing structures, C99 permits declaration of an array without specifying\
    \ any size as the last\nmember. This is referred to as a flexible array member.\
    \ Example:\n\n# 8 FUNCTIONS IMPLEMENTATION\n\nC99 has introduced some changes\
    \ in the implementation of functions. They include:\n\n+   - Removal of \"default\
    \ to int\" rule\n- Removal of \"implicit function declaration\""
