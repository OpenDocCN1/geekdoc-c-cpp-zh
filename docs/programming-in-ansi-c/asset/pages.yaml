    # 7.7 MULTI-DIMENSIONAL ARRAYS


    C allows arrays of three or more dimensions. The exact limit is determined by
    the compiler. The general form of a multi-dimensional array is


    ```

    type array name[s1][s2][s3]....[sm];


    int survey[3][12];

    float table[5][4][5][3];

    ```


    where s is the size of the ith dimension. For example,

    survey is a three-dimensional array containing 360 integer elements. Similarly
    table is a four-dimensional array containing 300 elements of floating-point type.


    The array survey may represent a survey data of rainfall during the last three
    years from January to December in five cities.


    if the first index denotes year, the second city and the third month, then the
    element survey[2][3][10] denotes the rainfall in the month of October during the
    second year-3.'
