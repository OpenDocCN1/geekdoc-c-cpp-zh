    # The fprintf and fscanf Functions


    So far, we have seen functions that can handle only one character or integer at
    a time. Most compilers support two other functions, except fprintf and fscanf,
    that can handle a group of mixed data simultaneously.


    The fprintf and fscanf perform I/O operations that are identical to the familiar
    printf and scanf functions, except that they work on files. The first argument
    of these functions is a file pointer which specifies the file to be used. The
    general form of printf is


    ```

    fprintf(fp, "control string", list);

    ```


    where fp is a file pointer associated with a file that has been opened for writing.
    The control string contains output specifications for the items in the list. The
    list may contain variables, constants and strings.

    Example:


    ```

    fprintf(fp, "%s %ld %f", name, age, 7.5);

    ```


    Here, name is an array of type char and age is an int variable.

    The general form of fscanf is


    ```

    fscanf(fp, "control string", list);

    ```


    This statement would cause the reading of the items in the list from the file
    specified by fp, according to the specifications contained in the control string:



    ```

    fscanf(fp, "%s %ld %f", item, &quantity);

    ```


    Like scanf, fscanf also returns the number of items that are successfully read.
    When the end of file is reached, it returns the EOF:


