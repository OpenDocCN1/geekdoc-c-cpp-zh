    \ types\n\nRemember that double represents the same data type that float represents,\
    \ but with a greater precision. To extend the precision further we may use long\
    \ double which uses 80 bits. The relationship among floating types is illustrated\
    \ Fig. 2.\n\n# Void Types\n\nThe void type has no values. This is usually used\
    \ to specify the type of functions. The type of a function is said to be void\
    \ when it does not return any value to the calling function. It can also play\
    \ the role of a generic type, meaning that it can represent any of the other standard\
    \ types.\n\n# Character Types\n\nA single character can be defined as a character(char)\
    \ type data. Characters are usually stored in 8 bits (one byte) of internal storage.\
    \ The qualified signed or unsigned may be explicitly applied to char. While unsigned\
    \ chars have values between 0 and 255, signed chars have values from -128 to 127.\n\
    \n# 2.8 DECLARATION OF VARIABLES\n\nAfter designing variable names, we must declare\
