  md: "# 4 BITWISE COMPLEMENT OPERATORS\n\nThe complement operator ~ (also called\
    \ the one's complement operator) is a unary operator and inverts all the bits\
    \ represented by its operand. That is, 0 becomes 1s and 1s become zero. Example:\n\
    \n```\nx = 1001 0110 1100 1011\n~x = 0110 1001 0011 0100\n```\n\nThis operator\
    \ is often combined with the bitwise AND operator to turn off a particular bit.\
    \ For example, the statement\n\n```\nx = 8; /* 0000 0000 0000 1000 */\nflag =\
    \ flag & ~x;\n```\n\nturn off the fourth bit in the variable flag.\n\n# 5 MASKING\n\
    \nMasking refers to the process of extracting desired bits (or transforming desired\
    \ bits in) a variable by using bitwise operation. The operand (a constant or variable)\
    \ that is used is the mask. Examples:\n\n```\ny = x & mask;\ny = x | mask;\n```\n\
    \nMasking is used in many different ways:\n\n+   To decide bit pattern of an integer\n\
    To copy a portion of a given bit pattern to a new variable, while the remainder\
    \ of the new variable is filled with 0s (using bitwise AND)\nTo copy a portion\
    \ of a given bit pattern to a new variable, while the remainder of the new variable\
    \ is filled with 1s (using bitwise OR)\nTo copy a portion of a given bit pattern\
    \ to a new variable, while the remainder of the original bit is inverted within\
    \ the new variable (using bitwise exclusive OR)\n\nThe following function uses\
    \ a mask to display the bit pattern of a variable.\n\n```\nvoid bit_pattern(int\
    \ u)\n{\n    int i, x, word;\n    unsigned mask;\n    mask = 1;\n    word = 8\
    \ * sizeof(int);\n    mask = mask << (word - 1);\n    for(i = 0; i < word; i++)\n\
    \    {\n        x = (u & mask) ? 1 : 0; /* identify the bit */\n        printf(\"\
    %d,\", x); /* print bit value */\n        mask >>= 1; /* shift mask by 1 position\
    \ to right */\n    }\n```"
