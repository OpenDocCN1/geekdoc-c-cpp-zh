    # ## 10.1 INTRODUCTION


    We have seen that arrays can be used to represent a group of data items that belong
    to the same type, such as int or float. However, we cannot use an array if we
    want to represent a collection of data items of different types using a single
    name. Frankly, C supports a constructed data type known as structures, a mechanism
    for packing data of different types. A structure is a convenient tool for handling
    a group of related data items. For example, it can be used to represent a set
    of attributes such as student, name, roll and mark. A structure is analogous to
    that of a ''record'' in many other languages. More examples of structures are:


    +   - time: seconds, minutes, hours

    - date: day, month, year

    - book: author, title, price, year

    - city: name, country, population

    - address: name, door, street, city

    - inventory: item, stock, value

    - customer: name, telephone, city, category


    Structures help organize complex data in a more meaningful way. It is a powerful
    concept that we may often need to use in our program design. This chapter is devoted
    to the study of structures and their applications in program development. Another
    related concept known as unions is also discussed.


