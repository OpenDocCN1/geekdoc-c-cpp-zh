  md: '# Mixed-mode Arithmetic


    When one of the operands is real and the other is integer, the expression is called
    a mixed-mode arithmetic expression. If either operand is of the real type, then
    only the real operation is performed and the result is always a real number. Thus


    15/10.0 = 1.5


    whereas


    15/10 = 1


    More about mixed operations are discussed later when we deal with the evaluation
    of expressions.


    # 3.3 RELATIONAL OPERATORS


    We compare two quantities and depending on their relation, take certain decisions.
    For example, we may compare the age of two persons, or the price of two items,
    and so on. These comparisons can be done with the help of relational operators.
    We have already used the symbol ''<'', meaning ''less than''. An expression such
    as


    a < b or 1 < 20


    containing a relational operator is termed as a relational expression. The value
    of a relational expression is either one or zero. It is one if the specified relation
    is true and zero if the relation is false. For example


    10 < 20 is true


    20 < 10 is false


    C supports relational operators in all. These operators and their meanings are
    shown in Table 3.2.


    # Table 3.2 Relational Operators


    | Operator | Meaning |

    | --- | --- |

    | < | less than |

    | <= | less than or equal to |

    | > | greater than |

    | >= | greater than or equal to |

    | == | equal to |

    | != | not equal to |


    A simple relational expression contains only one relational operator and takes
    the following:


    ae-1 relational operator ae-2


    ae-1 and ae-2 are arithmetic expressions, which may be simple constants, variables
    or combination of them. Given below are some examples of simple relational expressions
    and their values:


    4.5 <= 10 TRUE


    4.5 < -10 FALSE'
