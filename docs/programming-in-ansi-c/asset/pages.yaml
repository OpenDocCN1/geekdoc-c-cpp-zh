  md: "# The McGraw-Hill Companies\n\nOverview of C 3\n\nAlthough C99 is an improved\
    \ version, still many commonly available compilers do not support all of the new\
    \ features incorporated in C99. We therefore, discuss all the new features added\
    \ by C99 in an appendix separately so that the readers who are interested can\
    \ quickly refer to the new material and use them wherever.\n\n# 1.2 IMPORTANCE\
    \ OF C\n\nThe increasing popularity of C is probably due to its many desirable\
    \ qualities. It is a robust language whose rich set of built-in functions and\
    \ operators can be used to write any complex program. The C compiler combines\
    \ the capabilities of an assembly language with the features of a high-level language\
    \ and therefore it is well suited for writing software and business applications.\
    \ In fact, many of the C compilers in the market are written in C.\n\nPrograms\
    \ written in C are effective due to its variety of data types and powerful operators.\
    \ It is many times faster than BASIC. For example, a program to increment a variable\
    \ from 0 to 15000 takes about one second in C while it takes more than 50 seconds\
    \ in an interpreter BASIC.\n\nThere are only 32 keywords in ANSI C and its strength\
    \ lies in its built-in functions. Several standard functions are available which\
    \ can be used for developing programs.\n\nC is highly portable. This means programs\
    \ written for one computer can run on another with little or no modification.\
    \ Portability is important if we plan to use a new computer with a different operating\
    \ system.\n\nC language is well suited for structured programming, which thus\
    \ requiring the user of it to think of a problem in terms of function modules\
    \ or blocks. A proper collection of these modules would make a complete program.\
    \ This modular structure makes program debugging, testing and maintenance much\
    \ easier.\n\nAnother important feature of C is its ability to extend A C program\
    \ is basically a collection of functions that are supported by the C library.\
    \ We can continuously add our own functions to C library. With the availability\
    \ of a large number of functions, the programming task becomes simple.\n\nBefore\
    \ discussing specific features of C, we shall look at some C programs, and analyze\
    \ and understand how they work.\n\n# 1.3 SAMPLE PROGRAM 1: PRINTING A MESSAGE\n\
    \nConsider a very simple program given in Fig. 1.2.\n\n```\nmain() {\n\t/*printing\
    \ begins______*/\n\tprintf(\"I see, I remember\");\n\t/*printing ends______*/\n\
    }\n```\n\nFig. 1.2 A program to print one line of text\n\nThis program when executed\
    \ will produce the following output:\n\nI see, I remember"
