    #  Skipping a Part of a Loop


    During loop operations, it may be necessary to skip a part of the body of the
    loop under certain conditions. For example, in processing of applications for
    some job, we might like to exclude the processing of data of applicants belonging
    to a category. On matching the category code of an applicant, a test is made to
    see his application should be considered or not. If it is not to be considered,
    the part of the program loop that processes the application details is skipped
    and the execution continues with the next loop operation.


    Like the break statement, continue supports another statement called the continue
    statement. However, unlike break which causes the loop to be terminated, continue
    as the name implies, causes the loop to continue with the next iteration after
    skipping any statements in between. The continue statement tells, "SKIP THE FOLLOWING
    STATEMENTS AND CONTINUE WITH THE NEXT ITERATION". The format of the continue statement
    is simply


    ```

    continue;

    ```


    The use of the continue statement in loops is illustrated in Fig. 6.13. In while
    and do loops, continue causes the control to go directly to the testcondition
    and then to continue the iteration process. In the case of for loop, the increment
    section of the loop is executed before the testcondition is evaluated.


    ```

    while (test-condition) do

    {

    if (----------)

    ----continue;

    }

    } while (test-condition);

    (a) (b)

    for (initialization; test condition; increment)

    {

    if (----------)

    ----continue;

    }

    (c)

    ```


