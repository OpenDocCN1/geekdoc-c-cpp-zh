    ```


    Fig. 9.7 Functions with arguments but no return values


    The variables declared inside a function are known as local variables and therefore
    their values are local to the function and cannot be accessed by any other function.
    We shall discuss more about this later in the chapter.


    The function is called twice. The first call passes the character ''Z'', while
    the second passes the character ''C'' to the function. These are assigned to the
    argument ch for printing lines (see the output).


    # Variable Number of Arguments


    Some functions have a variable number of arguments and data types which cannot
    be known at compile time. The print and scant functions are typical examples.
    The ANSI standard proposes new symbol called the ellipsis to handle such functions.
    The ellipsis consists of three periods (...) and used as shown below:


    ```

    double area(float d, ...)

    ```


    Both the function declaration and definition should use ellipsis to indicate that
    the arguments are arbitrary in number and type.


    # 9.12 ARGUMENTS WITH RETURN VALUES


    The function value in Fig. 9.7 receives data from the calling function through
    arguments, but not send back any value. Rather it displays the results of calculations
    at the terminal. However we may not always wish to return a value of a function
    displayed. We use it in the calling function for further processing. Moreover,
    to ensure a high degree of portability between programs, a function should generally
    be coded without involving any I/O operations. For example, different programs
    may require different output formats for display results. These shortcomings can
    be overcome by handing the result of a function to its calling function where
    the returned value can be used as required by the program.


    A self-contained and independent function should behave like a ''black box'' that
    receives a predefined form of input and outputs a desired value. Such functions
    will have two-way data communication as shown in Fig. 9.8.'
