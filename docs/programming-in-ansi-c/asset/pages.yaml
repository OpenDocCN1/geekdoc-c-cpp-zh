  md: "# The McGraw-Hill Companies\n\n136 Programming in ANSI C\n\nThe label: can\
    \ be anywhere in the program either or after the goto label; statement. During\
    \ running a program when a statement like\n\n```\ngoto begin;\n```\n\nis met,\
    \ the flow of control will jump to the statement immediately following the label\
    \ begin:. This happens unconditionally.\nNote that a goto breaks the sequential\
    \ execution of the program. If the label is before the statement label, a loop\
    \ will be formed and some statements will be executed repeatedly. Such a jump\
    \ is known as a backward jump. On the other hand, if the label is placed after\
    \ the goto label, some statements will be skipped and the jump is known as a forward\
    \ jump.\n\nA goto is used at the end of a program to direct the control to the\
    \ input statement, to read further data. Consider the following example:\n\n```\n\
    main()\n{\n    double x, y;\n    read:\n    scanf(\"%f\", &x);\n    if (x < 0)\
    \ goto read;\n    y = sqrt(x);\n    printf(\"%f\\n\", x, y);\n    goto read;\n\
    }\n```\n\nThis program is written to evaluate the square root of a series of numbers\
    \ from the terminal. The program uses two goto statements, one at the end, after\
    \ printing the results to transfer the control back to the input and to skip any\
    \ further computation when the condition is met.\nDue to the unconditional goto\
    \ statement at the end, the control is transferred back to the input statement.\
    \ In fact, this program puts the computer in a permanent loop as an infinite loop.\
    \ The computer goes round and round until the loop is terminated. Such infinite\
    \ loops should be avoided: Program 5.9 illustrates how infinite loops can be eliminated.\n\
    \nProgram presented in Fig. 5.1 illustrates the use of the goto statement.\nThe\
