  md: "# The McGraw-Hill Companies\n\n# Managing Input and Output Operations\n\nInput\
    \ data items must be separated by spaces, tabs or newlines. Punctuation marks\
    \ do not count as separators. When we the scanf function searches the input line\
    \ for a value to be read, it will readily bypass any white space characters.\n\
    \nWhat happens if we enter a floating point number instead of an integer? The\
    \ fractional part may be stripped away! Also, scanf may skip further input.\n\n\
    When the scanf reads a particular value, the value will be terminated as soon\
    \ as the number of characters specified by the field is reached (if specified)\
    \ or until a character that is not valid for the value read is encountered. In\
    \ case of integers, characters are an optional signed sequence of digits.\n\n\
    An input field may be specified by \"%d\" in the place of field width. For example,\
    \ the statement scanf(\"%d %d %d\") will assign the data as follows:\n\n+   \n\
    123 to a\n456 skipped (because of *)\n789 to b\n\nThe data type d may be replaced\
    \ by ' l (letter l) to read long integers and h to read short integers.\n\n> Note\
    \ We have provided space between the field specifications. These spaces are not\
    \ necessary for the numeric input, but it is a good practice to include the.\n\
