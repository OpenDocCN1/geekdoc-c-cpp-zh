  md: '# The McGraw-Hill Companies


    454 Programming in ANSI C


    A macro definition can include more than a simple constant value. It can include
    expressions as well. Following are valid definitions:


    ```

    #define AREA            5 * 12.46

    #define SIZE            sizeof(int) * 4

    #define TWO-PI         2.0 * 3.1415926

    ```


    Whenever we use expressions for replacement, care should be taken to prevent an
    unexpected order of evaluation. Consider the evaluation of the equation


    ```

    ratio = D/A;

    ```


    where D and A are macros defined as:


    ```

    #define D            45 - 22

    #define A            78 + 32

    ```


    The result of the preprocessor''s substitution for D and A is:


    ```

    ratio = 45-22/(78+32);

    ```


    This is certainly different from the expected expression


    ```

    (45 - 22)*(78 + 32)

    ```


    Correct results can be obtained by using parentheses around strings as:


    ```

    #define D            (45 - 22)

    #define A            (78 + 32)

    ```


    It is a wise practice to use parentheses for literal substitution, whenever the
    defined name occurs. This explains why we cannot use a semicolon to terminate
    the #define statement. This also suggests that we can use a macro to define almost
    anything. For example, we can use the definitions


    ```

    #define TEST          if (x > y)

    #define AND

    #define PRINT        printf("Very Good.

    ");"

    ```


    to build a statement follows this line:


    ```

    TEST AND PRINT

    if ((x > y)) printf("Very Good.\n");

    ```


    Some tokens of C syntax can be confusing or error-prone. For example, a common
    mistake is to use the token # in place of = for logical expressions. Similar is
    the case with the token &.


    Following are few definitions that might be useful in building error free and
    more readable programs:


    ```

    #define EQUALS        ==

    #define AND            &&

    #define OR             |

    #define NOT_EQUAL      =

    #define START          main() {

    #define END            }

    #define MOD            %

    #define BLANK_LINE     printf("%s\n\n#define INCREMENT      ++

    ```


