    # 12.7 COMMAND LINE ARGUMENTS


    What is command line argument? It is a parameter supplied to a program when the
    program is invoked. This parameter may represent a filename the program should
    process. For example, if we want to execute a program to copy the contents of
    a file X_FILE to another named Y_FILE, then we may use a command line like


    ```

    C = PROGRAM X_FILE, Y_FILE

    ```


    where PROGRAM is the filename the executable code of program is stored. This eliminates
    the need for the program to request the user to enter the filenames during execution.
    How do these parameters get into the program?


    We know that every C program should have one main function and it marks the beginning
    of the program. But what we have not mentioned so far is it can also take arguments
    like other functions. main can take two arguments called argc and argv the information
    contained in the command line is passed to the program through these arguments,
    when main is called up by the system.


    The variable argc is an argument counter that counts the number of arguments on
    the command line. The argv is an array of pointers that point to the command line
    arguments. The size of this array will be equal to the value of argc. For instance,
    for the command line given above, argc is three and argv is an array of three
    pointers to strings as shown below:


    ```

    argv(0) -> PROGRAM

    argo(1) -> X_FILE

    argo(2) -> Y_FILE

    ```


    In order to access the command line arguments, we must declare the main function
    and its parameters as follows:


    ```

    main(int argc, char *argv[])

    {



    }

    ```


    The first parameter in the command line is always the program name and argv[0]
    always represents the program name.


