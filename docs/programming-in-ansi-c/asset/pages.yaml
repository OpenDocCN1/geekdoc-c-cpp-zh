    Following is the general format for declaring and opening a file:


    ```

    FILE *fp;

    p = fopen("filename", "mode");

    ```


    The first statement declares the variable fp as a pointer to the data type FILE.
    As stated earlier, FILE is a structure defined in the I/O library. The second
    statement opens the file filename and assigns an identifier to the FILE pointer
    fp. This pointer, which contains all the information about the file is subsequently
    used as a communication link between the system and the program.


    The second statement also specifies the purpose of opening this file. The mode
