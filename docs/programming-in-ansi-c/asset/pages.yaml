  md: '# The McGraw-Hill Companies


    # 276 Programming in ANSI C


    values to the calling programs. This aspect will be covered later when we discuss
    more about functions.

    The parameters are also known as arguments.


    The parameter list contains declaration of variables separated by commas and surrounded
    by parentheses.

    Examples:


    +   float quadratic (int a, int b, int c) { ... }

    double power (double x, int n) { ... }

    float mul (float x, float y) { ... }

    int sum (int a, int b) { ... }


    Remember: there is no semicolon after the closing parenthesis. Note that the declaration
    of parameter variables cannot be changed. That is, int (int a, b) is illegal.

    A function need not always receive values from the calling program. In such cases,
    functions with no formal parameters. To indicate that the parameter list is empty,
    we use the keyword void between the parentheses as:


    ```

    void pristine(void)

    {

    }

    ```


    This function neither receives any input values nor returns any value. Many compilers
    accept an empty set of parentheses, without specifying anything in

    void pristine ()


    But, it is a good programming style to use void to indicate a null parameter list.


    # Function Body


    The function body contains the declarations and statements necessary for performing
    the required task.

    The body enclosed in braces, contains three parts, in the order given below:


    +   1. Local declarations that specify the variables needed by the function.

    2. Function statements that perform the task of the function.

    3. A return statement that returns the value evaluated by the function.


    If a function does not return any value (like the pristine function), we can omit
    the return statement.

    However, its return type should be specified as void. Again, it is nice to have
    a return statement

    even for void functions.


    Some examples of typical function definitions:


    ```

    (a) float mul (float x, float y)

    {

    float result;

    /* local variable */

    result = x * y;

    /* computes the product */

    return (result);

    /* returns the result */

    }

    (b) void sum (int a, int b)

    {

    printf("sum = %s", a + b);

    /* no local variables */

    /* optional */

    return;

    }

    ```


