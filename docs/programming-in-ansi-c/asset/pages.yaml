  md: '# McGraw-Hill Companies


    Programming in ANSI C


    # Integer Types


    Integers are whole numbers with a range of values supported by a particular machine.
    Generally, integers occupy one word of storage, and since the word size of machines
    varies (typically, 16 or 32 bits) the size of an integer that can be stored depends
    on the computer. If we use a 16 bit word length, the size of the integer value
    is limited to -32768 to +32767 (-2¹⁵ to +²¹¹). A signed integer uses one bit for
    sign and 15 bits for the magnitude of the number. A 32 bit word length can store
    an integer ranging from -2,147,483,648 to 2,147,483,647.


    In order to provide control over the range of numbers and storage space, three
    classes of integer storage, namely short int, int, and long int, ANSI C defines
    these types so that they can be organized from the smallest to the largest, as
    shown in Fig. 2.5. For example, short represents fairly small integers and requires
    half the storage of a regular int. Unlike signed integers, unsigned integers use
    all the bits for magnitude and are therefore always positive. For a 16 bit machine,
    the range of unsigned integer numbers will be from 0 to 65,535.


    We declare long and unsigned integers to increase the range of values. Use of
    qualifier signed integers is optional because the default declaration assumes
    a signed number. Table 2.8 shows all the combinations of basic types and qualifiers
    and their size and range on a 16-bit machine.


    > Note C99 allows long long integer types. See the Appendix "C99 Features".


    ![](img/177eacb192165f90062789304b5da281_43_0.png)


    | Table 2.8 Size and Range of Data Types on a 16-bit machine |

    | Type | Size (bits) | Range |

    | char or signed char | 8 | -128 to 127 |

    | unsigned char | 8 | 0 to 255 |

    | int or signed int | 16 | -32768 to 32767 |

    | unsigned int | 16 | 0 to 65535 |

    | short int or | 8 | -128 to 127 |

    | unsigned short int | 8 | 0 to 255 |

    | signed long int | 32 | -2,147,483,648 to 2,147,483,647 |

    | unsigned long int | 32 | 0 to 4,294,967,295 |

    | float | 32 | 3.4E – 38 to 3.4E + 38 |

    | double | 64 | 1.7E – 308 to 1.7E + 308 |

    | long double | 80 | 3.4E – 4932 to 1.1E + 4932 |'
