    # 7.3  DECLARATION OF ONE-DIMENSIONAL ARRAYS


    Like any other variable, arrays must be declared before they are used so that
    the compiler can allocate space for them in memory. The general form of array
    declaration is


    ```

    type variable-name size;

    ```


    The type specifies the type of element that will be contained in the array, as
    int, float, or char and the size indicates the maximum number of elements that
    can be stored inside the array. For example,


    ```

    float height[50];

    ```


    declares the height to an array containing 50 real elements. Any subscripts 0
    to 49 are valid. Similarly,


    ```

    int group[10];

    ```


    declares the group as an array containing a maximum of 10 integer constants. Remember:


    +   • Any reference to the arrays outside the declared limits would not necessarily
    cause an error.

    • Rather, it might result in unpredictable results.

    • The size should be either a numeric constant or a symbolic constant.


    The C language treats strings simply as arrays of characters. The size in a character
    string represents the maximum number of characters that the string can hold. For
    instance,


    ```

    char name[10];

    ```


    declares the name as a character array (string) that can hold a maximum of 10
    characters. Suppose we read the following string constant into the string variable.


    ```

    "WELL DONE";

    ```


    Each character of the string is treated as an element of the array name and is
    stored in the memory as:


    | ''W'' |

    |---||

    | ''E'' |

    | ''L'' |

    | ''L'' |

    | '' '' |

    | ''D'' |

    | ''O'' |

    | ''N'' |

    | ''E'' |

    | ''\0'' |'
