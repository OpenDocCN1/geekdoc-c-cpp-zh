    # Compatibility and Casting


    A variable declared as a pointer is not just a pointer type. It is also a pointer
    to a specific variable: a fundamental data type, such as a character. A pointer
    always has a type associated with it. We cannot assign a pointer of one type to
    pointer of another type, although both of them have memory addresses as their
    values. This is known as incompatibility of pointers.


    All pointers store memory addresses, which are compatible, but what is not compatible
    is the underlying data type they point to. To avoid this, we use the assignment
    operator with the pointers of different types. We can however make explicit assignment
    between incompatible pointers by using cast operator, as example:


    ```

    int x;

    char *p;

    p = (char * ) &x;


    ```


    In such cases we must ensure that all operations that use the pointer p must apply
    casting properly.


    We have an exception. The exception is the void pointer (void *). The void pointer
    is a generic pointer that can represent any pointer type. All pointer types can
    be assigned to a void pointer and a void pointer can be assigned to any pointer
    without casting. A void pointer is created as follows:


    ```

    void *vp;

    ```


    Remember that since a void pointer has no object type, it cannot be de-referenced.'
