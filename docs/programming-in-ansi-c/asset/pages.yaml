    460    Programming in ANSI C


    # Situation 4


    Debugging and testing are one done to detect errors in the program. While the
    Compiler can detect syntactic and semantic errors, it cannot detect a faulty algorithm
    where the program executes, but produces wrong results.

    The process of error detection and isolation begins with the testing of the program
    with a known set of test data. The program is divided down and #printf statements
    are placed in different parts to see intermediate results. Such statements are
    called debugging statements and are not required once the errors are isolated
    and corrected. We can delete all of them or, ultimately, make inactive using control
    directives as:


    ```

    #ifdef TEST

    printf("Array elements\n");

    for (i = 0; i<m; i++)

    {

    printf("%d = %d\n", i, x[i]);

    }

    #endif

    ```


    ```

    #ifdef TEST

    printf(...);

    #endif

    ```


    The statements between the directives #ifdef and #endif are included only if the
    macro TEST is defined. Once everything is OK, delete or undefine the TEST. This
    makes the #if TEST conditions false and therefore all the debugging statements
    are left out.


    The C preprocessor also supports a more general form of test condition - #if directive.
    It takes the following form:


    ```

    #if constant expression

    {

    statement-1;

    statement-2;

    ---

    ---

    }

    #endif

    ```


    The constant-expression may be any logical expression such as:

    TEST <= 3

    (LEVEL == 1 || LEVEL == 2)

    MACHINE == ''A''


    If the result of the constant-expression is nonzero (true), then all the statements
    between the #if and #endif are included for processing; otherwise they are skipped.
    The names TEST, LEVEL, etc. may be defined as macros.'
