    # 15.5 PROGRAM TESTING AND DEBUGGING


    Testing and debugging refer to the tasks of detecting and removing errors in a
    program, so that the program produces the desired results on all occasions. Every
    programmer should be aware of the fact that rarely does a program run perfectly
    the first time. No matter how thoroughly the design is carried out, and no how
    much care is taken in coding, one can never say that the program will be 100 percent
    error-free. It is therefore necessary to make efforts to detect, isolate and correct
    any errors that are likely to be present in the program.


    # Types of Errors


    We have discussed a number of common errors. There might be many other errors,
    some obvious and not so obvious. All these errors can be classified under four
    types: namely, syntax errors, run-time errors, logical errors and latent errors.


    # Syntax errors


    Any violation of the language rules are syntax errors. The compiler can detect
    and isolate such errors. When syntax errors are present, the compilation fails
    and is terminated after listing the errors and the line numbers in the source
    program where the errors occurred. Remember, in some cases, the line number may
    not exactly indicate the place of error. In other cases, one syntax error may
    result in a long list of errors. Correction of one or two errors at the beginning
    of the program may eliminate the entire list.


    # Run-time errors


    Errors such as a mismatch of data types or referencing an out-of-range array element
    go undetected by the compiler. A program with these mistakes will run, but produce
    erroneous results and therefore, the name run-time error is given to such errors.
    Isolating a run-time error is usually a difficult task.


    # Logical errors


    As the name implies, these errors are related to the logic of the program execution.
    Actions such as taking a wrong path, failure to consider a particular condition,
    and incorrect evaluation of statements belonging to this category. Logical errors
    do not show up as compiler-generated messages. Rather, they cause incorrect results.
    These errors are primarily due to a poor understanding of the problem, incorrect
    translation of the algorithm into the program and a lack of clarity of hierarchy
    of operators. Consider the following statement:


    ```

    if(x == y)

    print("they are equal\n");"

    ```


    when x and y are float types, they rarely become equal, due to truncation errors.
    The print call may not be executed at all. A test while(x != y) might create an
    infinite loop.


    # Latent errors


    It is a ''hidden'' error that shows up only when a particular set of data is used.
    For example, consider the following statement:


    ```

    ratio = (x+y)/(p-q);

    ```


    An error occurs only when p and q are equal. An error of this kind can be detected
    only by using all combinations of test data.'
