    # 4. Production and Sales Analysis


    A company makes five categories of products and the number of items manufactured
    and sold are recorded product-wise every week in a month. The company reviews
    its production schedule every month end. The review may require one or more of
    the following information:


    +   (a) Value of weekly production and sales.

    (b) Total value of all the products manufactured.

    (c) Total value of all the products sold.

    (d) Total value of each product, manufactured and sold.


    Let us represent the products manufactured and sold by two-dimensional arrays
    M and S respectively. Then,


    | | M11 | M12 | M13 | M14 | M15 |

    |---|---|---|---|---|---|n| M = | M21 | M22 | M23 | M24 | M25 |

    | | M31 | M32 | M33 | M34 | M35 |

    | | M41 | M42 | M43 | M44 | M45 |

