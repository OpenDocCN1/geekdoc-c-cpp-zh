  md: '# The McGraw-Hill Companies


    C permits multiple assignments in one line. For example

    `initial_value = 0; final_value = 100;`


    are valid statements.

    An assignment statement implies that the value of the variable on the left of
    the ''equal sign'' is set equal to the value of the quantity (or the expression)
    on the right. The statement

    year = year + 1;


    means that the ''new value'' of year is equal to the ''old value'' of year plus
    1.

    During assignment operation, C converts the type of value on the right-hand side
    to the type on the left. This may involve truncation when result is converted
    to an integer.

    It is also possible to assign a value to a variable at the time it is declared.
    This declares the:

    data-type variable_name = constant;


    Some examples are:


    ```

    int final_value = 100;

    char yes = ''a'';

    double double = 75.84;

    ```


    The process of giving initial values to variables is called initialization. C
    permits the initialization of more than one variable in one statement using multiple
    assignment operators. For example the

    p=q=s=0; x=y=z=MAX;


    are valid. The first initializes p, q, and s to zero while the second initializes
    x, y, and z with MAX. Note that MAX is a symbolic constant defined at the beginning.

    Remember that external and static variables are initialized to zero by default.
    Automatic variables that are not initialized explicitly will contain garbage.


