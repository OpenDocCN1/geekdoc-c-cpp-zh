  md: '# The McGraw-Hill Companies


    The Preprocessor 453


    These directives can be divided into three categories:


    +   1. Macro substitution directives.

    2. File inclusion directives.

    3. Compiler control directives.


    # 14.2 MACRO SUBSTITUTION


    Macro substitution is a process where an identifier in a program is replaced by
    a predefined string composed of one or more tokens. The preprocessor accomplishes
    this task under the direction of **#define** statement. This statement, willingly
    known as a *macro definition* (or simply a *macro*) takes the following general
    form:


    ```

    #define identifier string

    ```


    If this statement is included in the program, then the preprocessor replaces every
    occurrence of the **identifier** in the source code by the string. The keyword
    **#define** is written just as starting (from the first column) followed by the
    identifier and a string, with at least one blank space between them. Note that
    the definition is not terminated by a semicolon; it may be any valid C name.


    There are different forms of macro substitution. The most common forms are:


    +   1. Simple macro substitution.

    2. Argumented macro substitution.

    3. Nested macro substitution.


    # Simple Macro Substitution


    Simple string replacement is commonly used to define constants. Examples of definition
    of constants are:


    | #define COUNT | 100 |

    | #define FALSE | 0 |

    | #define SUBJECTS | 6 |

    | #define PI | 3.141592 |

    | #define CAPITAL | "DELHI" |


    Notice that we have written all macros (identifiers) in capitals. It is a convention
    to write all macros to identify them as symbolic constants. A definition, such
    as


    ```

    #define M 5

    ```


    will replace all occurrences of M, starting from the line of definition to the
    end of the program. However, a macro inside a string does not get replaced. Consider
    the following two:


    ```

    total = M * value;

    printf("M = %d\n", M);

    ```


    These two lines would be changed during preprocessing as follows:


    ```

    total = 5 * value;

    printf("M = %d\n", 5);

    ```


    Notice that the string "M=%d" is unchanged.'
