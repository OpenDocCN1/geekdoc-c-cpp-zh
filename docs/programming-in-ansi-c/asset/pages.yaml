    # ## 7.1 INTRODUCTION


    So far we have used only the fundamental data types, namely char, int, float,
    double and variations of int and double. Although these types are very useful,
    they are constrained by the fact that all these types can only hold one value
    at any given time. Therefore, they can be used to handle limited amounts of data.
    In many applications, however, we need to handle a large volume of data in terms
    of reading, processing and printing. To process such large amounts of data that
    would facilitate efficient storage, access and manipulation of data items, a derived
    data type known as array that can be used for large applications.


    An array is a fixed-size collection of elements of the same data type. It is simply
    a grouping of like-type data. In its simplest form, an array can be used to represent
    a list of numbers, or a list of names. Some examples where the array can be used:


    +   - List of territories recorded every hour day, a month, or a year.

    - List of employees in an organization.

    - List of products and their cost sold by a store.

    - Test scores of a class of students.

    - List of customers and their telephone numbers.

    - List of daily rainfall data.


    Since an array provides a convenient structure for representing data, it is classified
    as one of the data structures in C. Other data structures include structures,
    lists, queues and trees. A complete discussion of all data structures is the scope
    of this text. However, we shall consider structures in Chapter 10 and lists in
    Chapter 13.


    As mentioned earlier, an array is a sequenced collection of related data items
    that share a common name. For instance, we can use an array salary to represent
    a set of salaries of employees in an organization. We can refer to the individual
    salaries by writing a number called index or subscript in brackets after the array
    name. For example:


    ```

    salary [10]

    ```'
