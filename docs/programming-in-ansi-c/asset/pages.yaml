    # Just Remember


    +   * Character constants are enclosed in single quotes and string constants are
    enclosed in double quotes.

    * Allocate sufficient space in a character array to hold the null character at
    the end.

    * Avoid processing single characters as strings.

    * Using the address operator & with a string variable in the scanf call is an
    error.

    * It is a complete error to assign a string to a character variable.

    * Using a string variable name on the left of the assignment operator is illegal.

    * When accessing individual characters of a string variable, it is a logical error
    to access outside the array bounds.

    * Strings cannot be manipulated with operators. Use string functions.

    * Do not use string functions on any char type that is not terminated with the
    null character.

    * Do not forget to append the null character to the target string when the number
    of characters copied is less than equal to the source string.

    * Be aware the return value when using functions strcpy and strcmp for comparing
    strings.

    * When using functions for copying and concatenating strings, make sure that the
    target string has enough space to store the resulting string. Otherwise memory
    overwrite may occur.

    * The header file <stdio.h> is required when using I/O functions.

    * The header file <ctype.h> is required when using character handling functions.

    * The header file <stdlib.h> is required when using general utility functions.

    * The header file <string.h> is required when using string manipulation functions.


