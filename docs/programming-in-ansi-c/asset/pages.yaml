  md: '# Using putchar and puts Functions


    Like getchar, C supports another character handling function putchar to output
    the values of character variables. It takes the following


    ```

    char ch = ''A'';nputchar(ch);

    ```


    The function putchar requires one parameter. This statement is equivalent to:


    ```

    printf("%c", ch);

    ```


    We have used putchar function in Chapter 4 to write characters to the screen.
    We can use this function to repeat a string of characters stored in an array using
    an array. Example:


    ```

    char name[] = "PARIS"

    for (int i=0; i<5; i++)

    putchar(name[i]);

    putchar(''\n'');

    ```


    And another more convenient way of printing strings is to use the puts declared
    in the header file <stdio.h>. This is one parameter function and invoked under:


    ```

    puts (str);

    ```


    where str is a variable containing a string value. This prints the value of the
    variable str and then moves the cursor to the beginning of the next line on the
    screen. For example, the program segment


    ```

    char line [80];

    gets (line);

    puts (line);

    ```


    reads a text from the keyboard and displays it on the screen. Note that the syntax
    is very simple compared to using the scanf and print statements.


    # 8.5 ARITHMETIC OPERATIONS ON CHARACTERS


    C allows us to manage characters the same way we do with numbers. Whenever a character
    constant or character variable is used in an expression, it is automatically converted
    into an integer value by the system. The integer value depends on the character
    set of the system.


    To write a character in its integer representation


    ```

    x = ''a'';

    printf("%d\n", x);

    ```


    will display the number 97 on the screen.


    It is also possible to perform arithmetic operations on the character constants
    and variables. For example,


    ```

    x = ''z''-1;

    ```


    is a valid statement. In ASCII, the value of ''z'' is 122 and therefore, the statement
    will assign the value 121 to the variable x.


    We may also use character constants in relational expressions. For example, the
    expression


    would test whether the character contained in the variable ch is an upper-case
    letter.'
