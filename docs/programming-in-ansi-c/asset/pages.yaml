    # Key Terms


    Decision-making statements I switch statement Conditional operator I goto statement
    Infinite loop.


    # 5.1 INTRODUCTION


    We have seen that a C program is a set of statements which are normally executed
    sequentially in the order in which they appear. When we have no options or repetitions
    of certain calculations are necessary. In practice we have a number of situations
    where we may have to change the order of execution of statements based on certain
    conditions or repeat a group of statements until certain specified conditions
    are met. This involves a kind of decision making to see whether a particular condition
    has occurred or not then direct the computer to execute certain statements accordingly.
    C language possesses such decision-making capabilities by supporting the following
    statements:


    +   1. if statement

    2. switch statement

    3. Conditional operator statement

    4. goto statement


    These statements are popularly known as decision-making statements. Since these
    statements control the flow of execution, they are also known as control statements.


    We have already used some of these statements in the earlier examples. Here, we
    shall discuss their features, capabilities and applications in more detail.


    # 5.2 DECISION MAKING WITH IF STATEMENT


    The if statement is a powerful decision-making statement and is used to control
    the flow of execution of statements. It is a two-way decision statement and is
    used in conjunction with an expression. It takes the following form


    ```

    if (test expression)

    ```


    It allows the computer to evaluate the expression first and then, depending on
    whether the value of the expression (relation or condition) is ''true'' (non-zero)
    or ''false'', it transfers the control to a'
