  md: '# OVERVIEW OF C


    # Key Terms


    print(\I Program)


    # 1.1 HISTORY OF C


    ''C'' seems a strange name for a programming language. But this strange sounding
    language is one of the most popular languages today because it is a structured,
    high-level, machine independent language. It allows software developers to develop
    programs without worrying about the hardware platforms where they will be implemented.


    The root of all modern languages is ALGOL, introduced in the early 1960s. ALGOL
    was the first language to use a block structure. Although it never became popular
    in USA, it was widely used in Europe. ALGOL gave the concept of structured programming
    to the computer science community. Computer scientists like Tony Hoare and Edsger
    Dijkstra popularized this concept during 1960s. Subsequently, several languages
    were announced.


    In 1967, Martin Richards developed a language called BCPL (Basic Programming Language)
    primarily for writing system software. In 1970, Ken Thompson created a language
    using many features of BCPL and called it B. B was used to create early versions
    of UNIX operating system at Bell Laboratories, Inc.


    C evolved from ALGOL, BCPL and by Dennis Ritchie at the Bell Laboratories in 1972.
    C uses many concepts from these languages and added the concept of data types
    and other features. Since it was developed along the UNIX operating system, it
    is strongly associated with UNIX. This operating system, which was also developed
    at Bell Laboratories, was coded entirely in C. UNIX is one of the most popular
    operating systems and the heart of the internet data superhighway.


    For many years, C was used in academic environments, but eventually with the release
    of many C compilers for commercial use and the increasing popularity of UNIX,
    it began to gain widespread support among computer professionals. Today, a variety
    of operating system and hardware platforms.


    In ''70s C had evolved into what is now known as ''traditional C''. The language
    became more popular after publication of the book ''The C Programming Language''
    by Brian Kernighan and Dennis Ritchie in 1978. The book was so popular that the
    language came to be known as ''K&R C'' among the programming community. The rapid
    growth of C led to the development of different versions of the language that
    were similar but often incompatible. This caused a serious problem for system
    developers.'
  merge: -1
