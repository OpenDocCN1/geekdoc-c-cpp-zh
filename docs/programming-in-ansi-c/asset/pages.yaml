  md: "# float value (float x, float y)\n\n```\n{\n    ...\n    ....\n    return;\n\
    \    /* no value included */\n}\n```\n\nIn C99, if a function is specified as\
    \ returning a value, its return statement must have a return value specified with\
    \ it. Therefore, the above definition is not valid in C99. The return statement\
    \ for the above function may have one of the following forms:\n\n```\nreturn(p);\
    \        /* p contains float value */\nreturn(p);\nreturn 0;      /* / when no\
    \ value is returned */\n```\n\n# Making Functions inline\n\nThe new keyword is\
    \ used to optimize the function calls when a program is executed. The inline specifier\
    \ is used in function definition as follows:\n\n```\ninline mul(int x, int y)\n\
    {\n    return (x*y);\n}\n```\n\nSuch functions are called inline functions. When\
    \ an inline function is invoked, the function's code is expanded inline, rather\
    \ than called. This eliminates a significant amount of overhead that is required\
    \ by the calling and returning mechanisms. However, the expansion \"inline\" may\
    \ increase the size of the object code of the function is invoked many times.\
    \ Due to this, only small functions are made inline.\n\n# 9 RESTRICTED POINTERS\n\
    \nThe new keyword restrict has been introduced by C99 as a type qualifier that\
    \ is applied only to pointers. A pointer qualified with restrict is referred to\
    \ as a restricted pointer. Restricted pointers are declared as follows:\n\n```\n\
    int restrict *p1;\nvoid restrict *p2;\n```\n\nA pointer declared \"restrict\"\
    \ is the only means of accessing the object it points to. (However, another pointer\
    \ derived from the restricted pointer can also be used to access the object.)\n\
    \nPointers with restrict are mainly used as function parameters. They are also\
    \ used as pointers that point to memory created by malloc ( ) function.\n\nC99\
    \ has added this feature to the prototype of many library functions, both existing\
    \ and new. For details, you must refer to the functions defined in the C standard\
    \ library."
  merge: -1
