    | fseek(fp,0L,2); | Go to the end of the file, pass the last character of the
    file. | |

    | fseek(fp,m,0); | Move to (m+1)th byte in the file. | |

    | fseek(fp,m,1); | Go backward by m bytes from the current position. | |

    | fseek(fp,m,2); | Go backward by m bytes from the end. (Positions the file to
    the m character from the end.) |


    When the operation is successful, fseek returns a zero. If you attempt to move
    the file pointer beyond the file boundaries, an error occurs and fseek returns
    -1 (minus one). It is good practice to check whether an error has occurred or
    not, before proceeding further.


    # Program 12.5 Write a program that uses the functions ftell and fseek.


    A program employing ftell and fseek functions is shown in Fig. 12.5. We have created
    a file RANDOM with the following contents:


