    # Programming in ANSI C


    +   * Functions return integer value by default.

    * A function without a return statement cannot return a value, when the parameters
    are passed by value.

    * A function that returns a value can be used in expressions like any other C
    variable.

    * When the value returned is assigned to a variable, the value will be converted
    to the type of the variable receiving it.

    * Function cannot be the target of an assignment.

    * A function with void return type cannot be used in the right-hand side of an
    assignment statement. It can be used only as a stand-alone statement.

    * A function that returns a value cannot be used as a stand-alone statement.

    * A return statement can occur anywhere within the body of a function.

    * A function can have more than one return statement.

    * A definition may be placed either after or before the main function.

    * Where functions are used, they may be placed in any order.

    * A global variable used in a function will return its value for future use.

    * A local variable defined inside a function is known only to that function. It
    is destroyed when the function is exited.

    * A global variable is only visible from the point of its declaration to the end
    of the program.

    * When a variable is redeclared within its scope either in a function or a block,
    the original variable is not visible within the scope of the redeclared variable.

    * A local variable static retains its value even after the function is exited.

    * Static variables are initialized at compile time and therefore they are initialized
    once.

    * Use parameter passing by values as far as possible to avoid inadvertent changes
    to variables of calling function in the called function.

    * Although not essential, include parameter names in the prototype declarations
    for documentation purposes.

    * Avoid the use of names that hides in outer scope.


    # Case Study


    # Calculation of Area under a Curve


    One of the applications of computers in numerical analysis is computing the area
    under a curve. One simple method of calculating the area under a curve is to divide
    the area into a number of trapezoids of same width and summing the area of individual
    trapezoids. The area of a trapezoid is given by


    ```

    Area = 0.5 * (h1 + h2) * b

    ```


    where h1 and h2 are the heights of two sides and b is the width as shown in Fig.
    9.19.

    nThe program in Fig. 9.21 calculates the area for a curve of the function


    ```

    f(x) = x^2 + 1

    ```


    between two given limits, A and B.'
