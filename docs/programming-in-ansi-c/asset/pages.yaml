    # Modular Programming


    Modular programming is a strategy applied to the design and development of software
    systems. It is defined as organizing a large program into small, independent program
    segments called modules that are separately named and individually callable program
    units. These modules are carefully integrated to become a software system that
    satisfies the system requirements. It is basically a "divide-and-conquer" approach
    to problem solving.'
