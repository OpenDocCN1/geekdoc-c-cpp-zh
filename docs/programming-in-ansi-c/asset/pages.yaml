  md: "# The McGraw-Hill Companies\n\nConstants, Variables, and Data Types\n\n33\n\
    \n# Floating Point Types\n\nFloating point (or real) numbers are stored in 32\
    \ bits. (on all 16 bit and 32 bit machines), with 6 digits of precision. Floating\
