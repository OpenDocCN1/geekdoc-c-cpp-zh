    # Nesting of Macros


    We can also use one macro in the definition of another macro. That is, macro definitions
    may be nested. For instance, consider the following macro definitions.


    | #define M | 5 |

    | #define N | M+1 |

    | #define SQUARE(x) | ((x) * (x)) |

    | #define CUBE(x) | ((SQUARE (x)) * (x)) |

    | #define SIXTH(x) | ((CUBE (x) / SQUARE (x))) |


    The preprocessor expands each defined macro, until no more macros appear in the
    text. For example, the last definition is expanded first


    ```

    (SQUARE(x) * (x)) * (SQUARE(x) * (x)))

    ```


    Since SQUARE(x) is still a macro, it is further expanded into


    ```

    (((x) * (x)) * ((x) * (x)))

    ```


    which is finally evaluated as x.

    Macros can also be used as parameters of other macros. For example, given the
    definitions of M and N, we can define the following macro to give the maximum
    of these:


    ```

    #define MAX(M,N) ((M) > (N)) ? (M) : (N))

    ```


    Macro calls can be nested in the same fashion as function calls. Example:

    | #define HALF(x) | ((x)/2.0) |

    | #define Y | HALF(HALF(x)) |


    Similarly, given the definition of MAX(a,b) we can use the following nested call
    to give the maximum of the three values x, y, and z:


    ```

    MAX(x, MAX(y,z))

    ```


    # Undefining a Macro


    A defined macro can be undefined, using the statement


    ```

    #undef identifier

    ```


    This is useful when we want to restrict the definition only to a particular part
    of the program.'
