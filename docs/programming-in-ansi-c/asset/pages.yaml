    Computer outputs are used as information for analysing certain relationships between
    variables and for making decisions. While the correctness and clarity of outputs
    are of utmost importance. While the correctness depends on the solution procedure,
    the clarity depends on the way the output is presented. Following are some of
    the steps we can take to improve the clarity and hence the readability and understandability
    of outputs.


    +   1. Provide blank space between numbers.

    2. Introduce appropriate headings and variable names in the output.

    3. Print special messages when a peculiar condition occurs in the output.

    4. Introduce blank lines between the sections of the output.


    The system usually provides two blank space for the numbers. However, this can
    be increased by selecting a suitable blank width for the numbers or by introducing
    a ''tab'' character between the specifications. For example, the:


    ```

    printf("a = %d b = %d,", a, b);

