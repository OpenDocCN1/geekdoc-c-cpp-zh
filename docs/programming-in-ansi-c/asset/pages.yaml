  md: '# The McGraw-Hill Companies


    Constants, Variables, and Data Types 31


    ANSI supports three classes of data types:


    +   1. Primary (or fundamental) data types

    2. Derived data types

    3. User-defined data types


    The primary data types and their extensions are discussed in this section. The
    user-defined data types are defined in the next section while the derived data
    types such as arrays, functions, structures and pointers are discussed as when
    they are encountered.


    All compilers support five fundamental data types, namely integer (int), character
    (char), floating point (float), double-precision floating point (double) and void.
    Many of them also offer extended data types such as long int int. Various data
    types and the terminology used to describe them are given in Fig. 2.4. The range
    of the basic four are given in Table 2.7. We discuss briefly each of them in this
    section.


    > Note C99 adds three more data types, namely _Bool, _Complex, and _Imaginary.
