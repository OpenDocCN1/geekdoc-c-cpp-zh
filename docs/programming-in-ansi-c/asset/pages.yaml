    # Just Remember


    +   * Use the sizeof to determine the size of a linked list.

    * When using memory allocation functions malloc and calloc, for a NULL pointer
    return value. Print appropriate message if the memory allocation fails.

    * Never call memory allocation functions with a zero size.

    * Release the dynamically allocated memory when it is no longer required to avoid
    any possible "memory leak.\n* Using free to release memory not dynamically allocated
    with malloc or calloc is an error.

    * Using an invalid pointer with free may cause problems and sometimes, system
    crash.

    * Using a pointer after its memory has been released is an error.

    * It is an error to assign the return value from malloc or calloc to anything
    other than a pointer.

    * It is an error to set a pointer to NULL before the node has been released. The
    node is irretrievably lost.

    * It is an error to declare a self-referential structure without a structure tag.

    * It is an error to release individually the elements of an array created with
    calloc.

    * It is a logic error to fail to set the link file in the last node to null.'
