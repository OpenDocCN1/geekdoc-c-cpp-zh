  md: "# The McGraw-Hill Companies\n\nAppendix V 549\n\n```\nif (x > y)          \
    \    // A comment line\n    printf(...);          // Testing\n    int m;     \
    \              // Printing\n                             // Declaration\n```\n\
    \nSingle-line comments are useful when brief, line-by-line comments are needed.\n\
    \n# 4 NEW DATA TYPES\n\nC defines five basic data types, namely, char, int, float,\
    \ double, and void. C99 adds three new built-in data types. They are:\n\n+   -\
    \ Bool\n- Complex\n- Imaginary\n\nC99 allows long to modify long thus creating\
    \ two more modified data types, namely, long int and unsigned long int.\n\n# _Bool\
    \ Type\n\n_Bool is an integer type which can hold the values 1 and 0. Example:\n\
    \n```\nbool x = 1;\ny = 0;\n```\n\nWe know that relation and logical expressions\
    \ return 0 for false and 1 for true. These values are stored in _Bool type variables.\
    \ For example:\n\n```\nbool b = m > n;\n```\n\nThe variable b is assigned 1 if\
    \ m is greater than n, otherwise 0.\n\n# _Complex and Imaginary Types\n\nC99 adds\
    \ two keywords, Complex and Imaginary to provide support for complex arithmetic\
    \ that is necessary for numerical programming. The following complex types are\
    \ supported:\n\n```\nfloat_Imaginary\ndouble_Complex\ndouble_Imaginary\nlong double_Complex\n\
    long double_Imaginary\n```\n\n# The long long Types\n\nThe long long int has range\
    \ of at least -(2⁶³-1) to 2⁶³-1. Similarly, the unsigned long int has a range\
    \ of 0 to 2⁶³-1.\n\n# 5 DECLARATION OF VARIABLES\n\nIn C, we know that all the\
    \ variables must be declared at the beginning of a block or function before executable\
    \ statements. However, C99 allows us to declare a variable at any point, just\
    \ before its use. For example, the following code is legal in C99."
  merge: -1
  pgno: 560
- img_proc: true
  md: "# The McGraw-Hill Companies\n\n550 Programming in ANSI C\n\n```\nmain()\n{\n\
    \    int m;\n    m = 100;\n    ...\n    ...\n    int n;\n    /* Legal in C99 */\n\
    \    n = 200;\n}\n```\n\nC99 extends this concept to the declaration of control\
    \ variables for loops. That is, C99 permits declaration of one or more variables\
    \ within the initialization part of the loop. For example, the following code\
    \ is legal.\n\n```\nmain()\n{\n    for (int i = 0; i<5; i ++)\n    {\n       \
    \ ...\n    }\n}\n```\n\nA variable declared inside a for loop is local to loop\
    \ only. The value of the variable is lost, once the loop ends. (This concept is\
    \ again borrowed from C++).\n\n# 6 CHANGES TO I/O FORMATS\n\nIn order to handle\
    \ the new data types with long long specification, C99 adds a new format modifier\
    \ ll to both scanf() and printf() format specifications. Examples: %lld, %llu,\
    \ %llx and %llx. Similarly, C99 adds hh modifier to d, i, u and x specifications\
    \ when handling char type values.\n\n![](img/177eacb192165f90062789304b5da281_561_0.png)\n\
    \n# 7 HANDLING OF ARRAYS\n\nC99 introduces some features that enhance the implementation\
    \ of arrays.\n\n# Variable-Length Arrays\n\nIn ANSI C, we must declare array dimensions\
    \ using integer constants and therefore the size of an array is fixed at compile\
    \ time. C99 permits declaration of array dimensions using integer variables or\
    \ any valid\n\n![](img/177eacb192165f90062789304b5da281_561_1.png)"
  merge: -1
