    # 2.9 DECLARATION OF STORAGE CLASS


    Variables in C can have not only data type but also storage class that provides
    information about their location and visibility. The storage class decides the
    position of the program within which the variables are recognized. Consider the
    following example:


    ```

    * Example of storage class */

    int m;

    main()

    {

    int i;

    float balance;


    function1();


    function1()

    {

    int i;

    float sum;

    }

    ```


    The variable m which has been declared before the main is called global/ variable.
    It can be used in all the functions in the program. It need not be declared in
    other functions. A global variable is also known as an external variable.


    The variables i, balance and sum are called local/ variables because they are
    declared inside a function. Local variables are visible and meaningful only inside
    the functions in which they are declared. They are not known to other functions.
    The variable i has been declared in both the functions. Any change in the value
    of i in one function does not affect its value in the other.


    C provides a variety of storage class specifiers that can be used to declare the
    scope and lifetime of variables. The concepts of scope and lifetime are important
    only in multifunction and multiple file programs and therefore their storage classes
    are considered in detail later when functions are discussed. For now, remember
    that the storage class specifiers (auto, register, static, and extern) whose meanings
    are given in Table 2.10.


    The storage class is another qualifier (like long or unsigned) that can be added
    to a variable declaration as shown below:


    ```

    auto int count;

    register char ch;

    static int x;

    extern long total;

    ```'
