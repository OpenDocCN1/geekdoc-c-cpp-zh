    The simplest I/O functions are getc and putc. These are analogous to getchar and
    putchar functions and handle one character at a time. Assume that a file is opened
    with mode w and file pointer fp1. Then, the statement


    ```

    putc(c, fp1);

    ```


    writes the character contained in character c to the file associated with FILE
    pointer fp1. Similarly, getc is used to read a character from a file that has
    been opened in read mode. For example, the statement


    ```

    c = getc(fp2);

    ```


    would read a character from the file whose file pointer is fp2.


    The file pointer moves one by character for every position of getc or putc. The
    getc will return an end-of-file marker EOF, when the end of the file has been
    reached. Therefore, the reading will be terminated when EOF is encountered.


