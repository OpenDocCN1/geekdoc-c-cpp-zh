    menus, show message boxes and print text on the screen. functions have been created
    in the application, which fetch the exact video memory addresses of a target location,
    to write text at the particular location.


    The application also implements the concept of structures to define the inventory
    items. It also effectively applies the varcus c concepts, such as file operations,
    looping and branching constructs and string manipulation functions.'
