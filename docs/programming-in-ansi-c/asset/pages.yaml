    # Selecting a Loop


    Given a problem, the programmer''s first concern is to decide the type of loop
    to be used. To choose one of the three supported by C, we may use the following
    strategy:


    +   * Analyse the problem and see whether it required a pre-test or post-test
    loop.

    * If it requires a post-test loop, then we can use only one loop: do while.

    * If it requires a pre-test loop, then we have two choices: for and while.

    * Decide whether the loop termination requires counter-controlled or sentinel-based
    control.

    * Use for if the counter-controlled control is required.

    * Use while if the sentinel-based control is required.

    * Note that both counter-controlled and sentinel-controlled loops can be implemented
    by all the three control structures.


    # 6.5 JUMPS IN LOOPS


    Loops perform a set of operations repeatedly until the control variable fails
    to satisfy the test condition. The number of times a loop is repeated is decided
    in advance and the test condition is written to achieve this. Sometimes, executing
    a loop becomes difficult to skip part of the loop or to leave it as soon as a
    certain condition occurs. For example, consider the case of searching for a particular
    name in a list containing 100 names. A program loop for writing and testing the
    names 100 times must be terminated as the desired name is found. C permits a jump
    from one statement to another within a loop as well as a jump out of a loop.


    # Jumping Out of a Loop


    An early exit from a loop can be accomplished by the break statement or the goto
    statement. We have already seen the use of the break in the switch statement and
    the goto in the if...else construct. These statements can also be used within
    while, or for loops. They are illustrated in Fig. 6.9 and Fig. 6.10.


    +   * When a break is encountered inside a loop, the loop is immediately exited
    and the program continues with the statement immediately following the loop. When
    the loops are nested, the break would only exit from the loop containing it. That
    is, the break will exit only a single loop.'
