    # The Comma Operator


    The comma operator can be used to link the related expressions together. A comma-list
    of expressions are evaluated left to right and the value of right-most expression
    is the value of the combined expression. For example, the statement


    value = (x = 10, y = 5, x++);;


    first assigns the value 10 to x, then assigns 5 to y, and finally assigns 15 (i.e.
    10 + 5) to value. Since comma operator has the lowest precedence of all operators,
    the parentheses are necessary. Some applications of comma operator are:


    In loops:


    ```

    for (n = 1, m < n; n++, m++)

    ```


    In while loops:


    ```

    while (c = getchar()), c != ''10'')

    ```


    Exchanging values:


    ```

    t = x, x = y, y = t;

    ```


    # The sizeof Operator


    The sizeof is a time operator, and when used with an operand, it returns the number
    of bytes the operand occupies. The operand may be a variable, a constant or a
    data type qualifier.

    Examples:


    ```

    m = sizeof(sum);

    n = sizeof(long int);

    k = sizeof(235L);

    ```


    The sizeof operator is normally used to determine the lengths of arrays and structures
    whose sizes are not known to the programmer. It is also used to allocate memory
    space dynamically to variables during execution of a program.


