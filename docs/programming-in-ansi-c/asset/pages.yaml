  md: '# The McGraw-Hill Companies


    File Management in C 397


    r open the file for reading only.

    w open the file for writing only.

    a open the file for appending (or adding) data to it.

    Note that both filename and mode are specified as strings. They should be enclosed
    in double quotation marks.


    When trying to open a file, one of the following things may happen:


    +   - When the mode is ''writing'', a file with the specified name is created
    if the file does not exist. The contents are deleted, if the file already exists.

    - When the purpose is ''appending'', the file is opened with the current contents
    safe. A file with the specified name is created if the file does not exist.

    - If the purpose is ''reading'', and if it exists, then the file is opened with
    the current contents safe otherwise an error occurs.


    Consider the following statements:


    ```

    FILE p1, "p2";

    p1 = fopen("data", "r");

    p2 = fopen("results", "w");

    ```


    The file is opened for reading and results is opened for writing. In case, the
    results file already exists, its contents are deleted and the file is opened as
    a new file. If data file does not exist, an error will occur.


    Many recent compilers include additional modes of operation. They include:


    +   - r The existing file is opened to the beginning for both reading and writing.

    - w Same as w except for both reading and writing.

    - a Same as except both for reading and writing.


    We can open and use multiple files at a time. This number however depends on the
    system we use.


    # 12.3 CLOSING A FILE


    A file must be closed after all operations on it have been completed. This ensures
    that all outstanding information associated with the file is flushed out from
    the buffers and links to the file are broken. It prevents any accidental misuse
    of the file. In case, there is a limit to the number of files that can be open
    simultaneously, clearance of unwanted files might help open the required files.
    Another instance where we have to close a file is when we want to reopen the same
    file in a different mode. The I/O library supports a function to do this for us.
    It takes the following form:


    ```

    fclose(file_pointer);

    ```


    This would close the file associated with the FILE file_pointer. Look at the following
    segment of a program.


    ```

    FILE p3, "p4";

    p1 = fopen("INPUT", "w");

    p2 = fopen("OUTPUT", "r");

    ```'
