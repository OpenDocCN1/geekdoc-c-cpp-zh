    # 5.8 THE : OPERATOR


    The C language has an unusual operator, useful for making two-way decisions. This
    operator is a combination of ? and , takes three operands. This operator is popularly
    known as the conditional operator. The general form of use of the conditional
    operator is as follows:


    conditional expression ? expression1 : expression2


    The conditional expression is evaluated first. If the result is non-zero, expression1
    is evaluated and is returned as the value of the conditional expression. Otherwise,
    expression2 is evaluated and its value is returned. For example, the segment


    ```

    if (x < 0)

    flag = 0;

    else

    flag = 1;

    ```


    can be written as


    ```

    flag = (x < 0) ? 0 : 1;

    ```


    Consider the evaluation of the following function:


    ```

    y = 1.5x + 3 for x <= 2;

    ```


    This can be evaluated using the conditional operator as:


    ```

    y = (x > 2) ? (2 * x + 5) : (1.5 * x + 3);

    ```


    The conditional operator may be nested for evaluating more complex assignments.
    For example, the weekly salary of a salesgirl who is selling some domestic products.
    If x is the number of products sold in a week, her weekly salary is given by


    | 4x + 100 for x < 40 |

    | Salary = 300 for x = 40 |

    | 4.5x + 150 for x < 40 |


    This complex equation can be written as


    ```

    salary = (x != 40) ? ((x < 40) ? (4*x+100) : (4.5*x+150)) : 300;

    ```'
