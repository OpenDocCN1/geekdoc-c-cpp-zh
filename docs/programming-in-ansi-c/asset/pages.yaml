    # Table 9.1 Scope and Lifetime of Variables


    | Storage Class | Where declared | Visibility (Active) | Lifetime (Alive) |

    | --- | --- | --- | --- |

    | None | Before all functions in a file (may be initialized) | Entire file plus
    other files where variable is declared with extern | Entire program (Global) |

    | extern | Before all functions in a file (cannot be initialized) extern and the
    file where originally declared as global. | Entire file plus other files where
    variable is declared | Global |

    | static | Before all functions in a file | Only in that function | Global |

    | None or auto | Inside a function (or a block) | Only in that function or block
    | Until end of function or block |

    | register | Inside a function or block | Only in that function or block | Until
    end of function or block |

    | static | Inside a function | Only in that function | Global |


