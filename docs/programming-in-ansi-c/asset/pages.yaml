    # Applying De Morgan''s Rule


    While designing decision statements, we often come across a situation where the
    logical NOT operator is applied to a compound logical expression, like f!(x&&y||z).
    However, a positive logic is always easy to read and comprehend than negative
    logic. In such cases, we may apply what is known as De Morgan''s rule to make
    the expression positive. This is as follows:


    > "Remove the parentheses by applying the NOT operator to every logical expression
    component, while complementing the relational operators"


    That is,


    ```

    x becomes lx

    !x becomes x

    && becomes ||

    || becomes &&

    ```


    Examples:

    !(x && y || z) becomes lx || && z

    !(x <= 0 || condition) becomes x > 0&& condition


