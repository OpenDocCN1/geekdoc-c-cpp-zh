    284 Programming in ANSI C


    It is important to note that the function value receives its data directly from
    the terminal. The input data include principal amount, interest rate and the period
    for which the final value is to be calculated. The while loop calculates the final
    value and the results are printed by the library function printf. When the closing
    brace of } is reached, the control is transferred back to the calling function
    main. Everything is done by the value itself if there is nothing left to be sent
    back to the calling function. Return types of both function and value are declared
    as void.


    Note that no return statement is expected. When there is nothing to be returned,
    the return statement is optional. The closing brace of } signals the end of execution
    of the function, returning the control, back to the calling function.


    # 9.11 ARGUMENTS BUT NO RETURN VALUES


    In Fig. 9.4 the function has no control over the way the functions receive input
    data. For example, the function printf will print the same line each time it is
    called. Same is the case with the function value. We could make the calling function
    to read data from the terminal and pass it on to the called function. This approach
    seems to be wiser because the calling function can also check for the validity
    of data, if necessary, before it is handed over to the called function.


    The nature of data communication between the calling function and the called function
    with no return value is shown in Fig. 9.5.


    ![](img/177eacb192165f90062789304b5da281_295_0.png)


    Fig. 9.5 One-way data communication


    We shall modify the definitions of both the called functions to include arguments
    as follows:


    ```

    void printf(char ch, int n)

    value(float p, float r, int n)

    ```


    The arguments ch, p, r, and n are called formal arguments. The calling function
    can now send these values to the functions using calls containing appropriate
    arguments. For example, the function call


    ```

    value(500, 0.12, 5)

    ```


    would send the values 500, 0.12 and 5 to the function


    ```

    value(float p, float r, int n)

    ```


    and pass 500 to 0.12 and r to 5. The values 500, 0.12 and 5 are the actual arguments,
    which become the values of the formal arguments inside the called function.


    The actual and formal arguments should match in number, type, and order. The values
    of actual arguments are assigned to the formal arguments on a one to basis, starting
    with the first argument shown in Fig. 9.6.'
