  md: '# POINTERS


    # Key Terms


    Pointer I Memory Pointer Call by reference I Call by value


    # 11.1 INTRODUCTION


    A pointer is a derived type in C. It is built from one of the fundamental data
    types available in C. Pointers contain memory addresses as their values. Since
    these memory addresses are the locations in the computer memory where program
    instructions and data are stored, pointers can be used to access and manipulate
    data stored in the memory.


    Pointers are undoubtedly one of the most distinct and exciting features of C language.
    Although they appear little confusing and difficult to understand for a beginner,
    they are a powerful tool to handle once they are mastered.


    Pointers are used frequently in C, as they offer a number of benefits to the programmers.
    They include:


    +   1. Pointers are more efficient in handling arrays and data tables.

    2. Pointers can be used to return multiple values from a function via function
    arguments.

    3. Pointers references to functions and thereby facilitating passing of arguments
    as other functions.

    4. The use of pointers to character strings results in saving of data storage
    space in memory.

    5. Pointers allow to support dynamic memory management.

    6. Pointers provide an efficient tool for manipulating dynamic data structures
    such as structures, linked lists, queues, stacks and trees.

    7. Pointers reduce length and complexity of programs.

    8. They increase the execution speed and reduce the program execution time.


    Of course, the real power of C lies in the proper use of pointers. In this chapter,
    we will examine the pointers in detail and illustrate how to use them in program
    development. Chapter 13 examines the use of pointers for creating and managing
    linked lists.


    # 11.2 UNDERSTANDING POINTERS


    The computer''s memory is a sequential collection of storage cells as shown in
    Fig. 11.1. Each cell, commonly known as a byte, has a number called address associated
    with it. Typically, the addresses are'
