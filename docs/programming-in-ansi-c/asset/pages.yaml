    # 15.1 INTRODUCTION


    We have discussed so various features of C language and are ready to write and
    execute programs of modest complexity. However, before attempting to develop complex
    programs, it is worthwhile to consider some programming techniques that would
    help efficient design and error-free programs.


    The program development process includes three important stages, namely, program
    design, program coding and program testing. All the three stages contribute to
    the production of high-quality programs. In this chapter we shall discuss some
    of the techniques used for program design, coding and testing.


    # 15.2 PROGRAM DESIGN


    Program design is basically concerned for a good program and is therefore an important
    part of the program development cycle. Before coding program, the program should
    be well conceived and all aspects of the program design should be considered in
    detail.


    Program design is basically concerned with the development of a strategy to be
    used in writing the program, in order to achieve the solution of a problem. This
    includes mapping out a solution procedure and the form the program would take.
    The program design involves the following four stages:


    +   1. Problem analysis.

    2. Outlining the program structure.

    3. Algorithm development.

    4. Selection of control structures.


    # Problem Analysis


    Before we know a solution to the problem, we must fully understand the nature
    of the problem and what we want the program to do. Without the comprehension and
    definition of the problem'
  merge: -1
