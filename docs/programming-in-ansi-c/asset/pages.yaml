    # 6.6 CONCISE TEST EXPRESSIONS


    We use test expressions in the if, for, and while statements that are evaluated
    and compared with zero. Since every integer expression has a true/false value,
    we do not need explicit comparisons with zero. For instance, the expression x
    is true whenever x is not zero, and false when x is zero. Applying ! operator,
    we can write concise expressions without using any relational operators.


    ```

    if (expression ==0)

    ```


    is equivalent to


    ```

    if(expression)

    ```


    Similarly,


    ```

    if (expression! = 0)

    ```


    is equivalent to


    ```

    if (expression)

    ```


    For example,

    if (m%5==0 && n%5==0) is same as if (l%(m%5)&&(n%5))


    # Just Remember


    +   - Do not forget to place the semicolon at the end of the do...while statement.

    - Placing a semicolon after the control expression in a while or for statement
    is not a syntax error it is likely a logic error.

    - Using commas rather than semicolon in the header of a for statement is an error.

    - Do not forget to place the increment statement in the body of a while or do...while
    loop.

    - It is a common error to use wrong operator in test expressions. Ensure that
    the loop is evaluated exactly the required number of times.

    - Avoid a common error using in place of = .operator.

    - Do not change the variable in both the for statement and the body of the loop.
    It is a logic error.

    - Do not compare floating-point values for equality.

    - Avoid using while and for statements for implementing exit-controlled (post-test)
    loops. Use do...while statement. Similarly, do not use do...while for pre-test
    loops.

    - When performing an operation on a variable repeatedly in the body of a loop,
    make sure that the variable is initialized properly before entering the loop.'
