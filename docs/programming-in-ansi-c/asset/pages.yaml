    | Actual one | Simplified one |

    |---|---|n| f(x < y) | x >= y |

    | f(x > y) | x <= y |

    | f(x != y) | x == y |

    | f(x <= y) | x > y |

    | f(x >= y) | x < y |

    | f(x == y) | x! = y |


    # 3.4 LOGICAL OPERATORS


    In addition to the relational operators, C has the three logical operators.


    | | | |

    |---|---|---|n|&& | logical | AND |

    || | logical | OR |

    || | logical | NOT |


    The logical operators && and || are used when we want to test more than one condition
    and make decisions. An example is:


    ```

    a > b && b == 10

    ```


    An expression of this kind, which combines two or more relational expressions,
    is termed as a logical expression or a compound relational expression. Like the
    simple relational expressions, a logical expression also yields a value of one
    or zero, according to the truth table shown in Table 3.3. The logical expression
    given above is true only if a > b is true and x == 10 is true. Either (or both)
    of them are false, the expression is false.'
