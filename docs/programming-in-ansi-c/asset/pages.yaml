  md: '# The McGraw-Hill Companies


    # Structures and Unions


    C language does not permit the initialization of individual structure members
    within the template. The initialization must be done only in the declaration of
    the actual variables.

    Note that the compile-time initialization of a structure variable must have the
    following elements:


    +   1. The keyword struct.

    2. The structure tag name.

    3. The name of the variable to be declared.

    4. The assignment operator =

    5. A set of values for the members of the structure variable, separated by commas
    and enclosed in braces.

    6. A terminating semicolon.


    # Rules for Initializing Structures


    There are a few rules to keep in mind while initializing structure variables at
    compile-time.

    1. We cannot initialize individual members inside the structure template.

    2. The order of values enclosed in braces must match the order of members in the
    structure definition.

    3. It is permitted to have a partial initialization. We can initialize only the
    first few members and leave the remaining blank. The uninitialized members will
    be only at the end of the list.

    4. The uninitialized members will be assigned default values as follows:


    +   * Zero for integer and floating point numbers.

    * "0" for characters and strings.


    # 10.6 COPYING AND COMPARING STRUCTURE VARIABLES


    Two variables of the same type can be copied the same way as ordinary variables.
    If person1 and person2 belong to the same structure, then the following statements
    are valid:


    ```

    person1 = person2;

    person2 = person1;

    ```


    However, the statements such as:


    ```

    person1 != person2

    person1 == person2

    ```


    C does not permit any logical operations on structure variables. In case, we need
    to compare them, we may do so by comparing members individually.


    # Program 10.3 Write a program to illustrate the copy of structure variables.


    The program shown in Fig10.2 illustrates how a structure variable can be copied
    into another of the same type. It also performs member-wise comparison to decide
    whether two structure variables are identical.'
