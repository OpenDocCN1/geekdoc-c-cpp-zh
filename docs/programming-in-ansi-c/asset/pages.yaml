  md: '# APPENDIX V C99 FEATURES


    # 1 INTRODUCTION


    C, as developed and standardized by ANSI and ISO, is a powerful, flexible, portable
    and elegant language. Due to its suitability for both systems and applications
    programming, it has become an industry-standard, general-purpose language to-day.


    The standardization committee on C language has been trying to examine each element
    of the language critically and see any change or enhancement is necessary in order
    to continue to maintain its lead over other competing languages. The committee
    also interacted with many user groups and elicited suggestions as improvements
    that are required from the point-of-view of users. The result was the new version
    of C, called C99.


    The C99 incorporates enhancements and new features that are desirable for any
    modern computer language. Although it has borrowed from C++ (a progeny of C) and
    modified a few constructs, it retains almost all the features of ANSI C and continues
    to be a true C language.


    In this appendix, we will highlight the important changes and new features added
    to C by the 1999 standard.


    # 2 NEW KEYWORDS


    ANSI C has defined 32 keywords. C99 has added five more keywords. They are:


    +   _Bool

    _Complex

    _Imaginary

    _inline


    Addition of these keywords is perhaps the most significant feature of C99. The
    use of these keywords are highlighted later in this appendix.


    # 3 NEW COMMENT


    C99 adds what is known as the single-line comment, a feature borrowed from C++.
    Single-line comments begin with // (two forward slashes) and end at the end of
    the line. Examples:'
