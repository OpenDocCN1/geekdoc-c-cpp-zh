    Developing a C Program: Some Guidelines 477


    # Program Testing


    Testing is the process of reviewing and executing a program with the intent of
    detecting errors, which may belong to any of the four kinds discussed above. We
    know that while the compiler can detect syntactic and semantic errors, it cannot
    detect run-time and logic errors that show during the execution of the program.
    Testing, should include necessary steps to detect all possible errors in the program.
    It is, however, to remember that it is impractical to find all errors. Testing
    process may involve the following stages:


    +   1. Human testing.


    +   2. Computer-based testing.


    Human testing is an effective error-detection process and does not before the
    computer-based testing. Human methods involve code inspection by the programmer,
    code inspection by a group, and a review by a peer. The test is carried out by
    statement and is analyzed with respect to a checklist of common programming errors.
    In addition to errors, the programming style and choice of algorithm are


    Computer-based testing involves two stages, namely compiling and run-time testing.
    The compiler is the simplest of the two and detects syntax errors. The program
    executes when the compiler detects no more errors. Should mean that the program
    is correct? Will it produce the expected results? The answer is never. The program
    may contain run-time and logic errors.


    Run-time errors may produce run-time error messages such as "null pointer assignment"
    and "stack overflow." When the program is executed produces output which might
    or might not be correct. Come the crucial test, the test for the expected output.
    The goal is to ensure that the program produces results under all conditions of
    input data.


    For correct output is done using test data for the purpose of comparison. The
    most important consideration here is the design or invention of effective tests.
    A criteria for test data is that all the variations of the input are processed.
    Processing may take time during execution must be met


    Program testing can be done either at module (function) level or at program level.
    Module level testing, known as unit testing, is conducted on each of the modules
    to uncover errors within the boundary of the module. Unit testing becomes simple
    when a module is designed to perform only one function.


    Once all modules are tested, they should be integrated together to perform the
    desired function(s). There are likely to be interfacing problems, such as data
    mismatch between the modules. An integration test is performed to debug errors
    associated with interfacing.


    # Program Debugging


    Debugging is the process of isolating and correcting the errors. One simple method
    of debugging is to place print statements throughout the program to display the
    values of variables. It displays the dynamics of a program and allows us to examine
    and compare the information at various points. Once the location of an error is
    found and it corrected, the debugging statements may be removed. We can use the
    conditional statements, discussed in Chapter 14, to switch on or off the debugging
    statements.


    Another approach is to use the process of deduction. The location of an error
    is arrived at by process of elimination and refinement. This is done using a list
    of possible causes of the error.


    The third error-locating method is to backtrack the incorrect results through
    the logic of the program until the mistake is located. That is, beginning at the
    place where the symptom has been uncovered, the program is traced backward until
    the error is located.'
