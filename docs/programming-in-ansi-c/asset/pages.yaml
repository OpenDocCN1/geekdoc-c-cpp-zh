  md: '# The McGraw-Hill Companies


    Managing Input and Output Operations


    form. it is therefore necessary for the programmer to give careful consideration
    to the appearance and clarity of the output produced by his program.


    The print statement provides certain features that can be effectively exploited
    to control the alignment and spacing of print-out-terminals. The general form
    of printf statement is:


    ```

    printf("string", arg1, arg2, ..., arg);

    ```


    Control string consists of three types of items:


    +   1. Characters will be printed on the screen as they appear.

    2. Format specifications that define the output format for each item.

    3. Escape sequence characters such as ''\n'', ''\t'', etc.


    The control string indicates how many arguments and what their types are. The
    arguments arg1, arg2, ..., argn are the values be formatted and printed according
    to the specifications of the control string. The arguments should match in number,
    order and type with the format specifications.


    A simple format specification has the following:


    ```

    %w type-specifier

    ```


    where w is an integer that specifies the total number of columns for the output
    value and p is another integer that specifies the number of digits to the right
    of the decimal point (of a real number) or the number of characters to be printed
    from a string. With w and p are optional. Examples of formatted printf statement:


    ```

    printf("Programming in C");

    printf("\n");

    printf("\t");

    printf("%d", x);

    printf("a = %d b = %d", a, b);

    printf("*d = %d", 1234);

    printf("\n");

    ```


    printf never supplies a newline automatically and multiple printf statements may
    be used to build one line of output. A newline can be introduced by the help of
    the newline character ''\n'' as shown in some of the examples.


    # Output of Integer Numbers


    The format specification for printing an integer number is:


    ```

    %w d

    ```


    where w specifies the minimum field width for the number. However, if a number
    is greater than the specified field width, it will be printed in full, overlapping
    the minimum specification. d specifies that the value to be printed is an integer.
    The number is right-justified in the given field width. Leading blanks will appear
    as necessary. The following examples illustrate the output of the number 9876
    under different formats:


    Format


    | Output |

    |---|---|---|---||

    | 9 | 8 | 7 | 6 |

    | | 9 | 8 | 7 | 6 |

    | | | 9 | 8 | 7 | 6 |


    ```

    printf("%d", 9876);

    printf("%6d", 9876);

    printf("%2d", 9876);

    ```'
