    # 11.9 POINTER INCREMENTS AND SCALE FACTOR


    We have seen that the pointers can be incremented like


    ```

    p1 = p2 + 2;

    p1 = p1 + 1;

    ```


    and so on. Remember, however, as an expression like

    p1++;

    will cause the pointer to point to the next value of p1. For example, if p1 is
    an integer with an initial value, say 2800, then after the operation p1 = p1 +
    1, the value of p1 will be 2802, and not 2801. That is, when we increment a pointer,
    its value is increased by the ''length'' of the data type that it points to. This
    length called the *factor*.


    For IBM PC, the length of various data types are as follows:


    | characters | 1 byte |

    | integers | 2 bytes |

    | floats | 4 bytes |

    | long integers | 4 bytes |

    | doubles | 8 bytes |


    The number of bytes used to store various data types depends on the system and
    can be found by making use of the *sizeof* operator. For example, if x is a variable,
    sizeof(x) returns the number of bytes needed for the variable. (Systems like Pentium
    4 use 4 bytes for integers and 2 bytes for short integers.)


    # Rules of Pointer Operations


    +   The following rules apply when performing operations on pointer variables.

    1. A pointer variable can be assigned the address of another variable.

    2. A pointer variable can be assigned the values of another pointer variable.

    3. A pointer variable can be initialized with NULL or zero value.

    4. A pointer variable can be pre-fixed or post-fixed with increment and decrement
    operators.

    5. An integer value may be added or subtracted from a pointer.

    6. When two pointers point to the same array, one pointer variable can be subtracted
    from another.'
