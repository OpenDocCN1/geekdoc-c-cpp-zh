    Pointers 359


    is, therefore, nothing but a variable that contains an address, which is a location
    of another variable in memory.

    Remember, since a pointer is a variable, its value is also stored in the memory
    in another location. Suppose, we assign the address of quantity to a variable
    p. The link between the variables p and quantity can be visualized as shown in
    Fig. 11.3. The address of p is 5048.


    | Variable | Value | Address |

    | --- | --- | --- |

    | quantity | 179 | |

    | P | 5000 | 5048 |


    Fig. 11.3 Pointer variable


    Since the value of the variable p is the address of the variable quantity, we
    may access the value of quantity by using the value of p and therefore, we say
    that variable p points'' to the variable quantity. Thus, p gets the name ''pointer''.
    (We are not really concerned about the actual values of pointer variables. They
    may be different every time we run the program. What we are concerned about the
    relationship between the variables p and quantity.)


    # Underlying Concepts of Pointers


    Pointers are built on the three underlying concepts as illustrated below:


    ![](img/177eacb192165f90062789304b5da281_370_0.png)


    Memory addresses within a computer are referred to as pointer constants. We cannot
    change them; we can use them to store data values. They are like house numbers.


    We cannot save the value of a memory address directly. We can only obtain the
    value through the variable stored using the address operator (&). The value thus
    obtained is known as pointer value. The pointer value (i.e. the address of a variable)
    may change from one run of the program to another.


    Once we have a pointer value, it can be stored into another variable. The variable
    that contains a pointer value is called a pointer variable.'
