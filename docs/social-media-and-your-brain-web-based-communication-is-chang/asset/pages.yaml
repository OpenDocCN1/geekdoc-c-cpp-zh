  md: 'In "Social Media and Self-Control: The Vices and Virtues of Attention," Juan
    Pablo Bermúdez presents an analysis of the nature of attention, its vices and
    virtues, and what that currently available evidence has to say about the effects
    of social media on attention and self-control. The pattern that seems to be emerging
    is while there is an association between greater use of social media and lower
    attention control, we do not know whether it is social media that makes people
    more distracted, or whether those who use social media the most do so because
    they are more easily distracted. Either way, questions arise about whether the
    virtues of attention will change in the future and whether this will bring with
    it a transformation in the way we shape our worlds.


    Chris Beeman in "Does Social Media Interfere with the Capacity to Make Reasoned
    Arguments?" asks and answers the question: Do social media interfere with the
    capacity to make rational arguments? Students are writing progressively less well-reasoned
    essays. The information required to make an argument is there, but the argument
    itself is not lost. Essays have the feel of being rushed, but that clarity argumentation
    has been lost. The predominant locus of knowledge acquisition among young adults—the
    web—leading to different conceptions of argument making. How might this contribute
    to a different sort of identity? Might linearization no longer be necessary, except
    for certain tasks?


    In "Exclusive Spaces," Alex Lech defines exclusivity as a form of privacy used
    to establish value. To be exclusive is to promise hidden secrets: a challenge.
    Challenges, correctly constructed, offer agency. To be cool, a message or service
    must be ineligible enough to incite an exploration, a sense of legitimate risk,
    while minimizing the sense of threat. The sense of discovery offered by services
    like YikYak or Snapchat allows more agency, and thus more loyalty, than more public
    services. This chapter amplifies on the point made in the Introduction, "The Role
    of Habit," and by the Pew Research Center people about how young teenagers and
    social media posters learn to doctor their communications with exaggeration, selective
    omission, and other means to enhance their images.


    Paul Fairfield in "Social Media and Communicative Unlearning" details how digital
    media and electronic technology are becoming less than a way of life, thinking,
    appearing, and preferring. The growing preference for electronic over in-person
    communication ought to worry observers for reasons that bear primarily on what
    communication omits, including the realm of nonverbal expression, nuance, and
    embodiment. As the preference for e-communication increases, what decreases is
    not only communication competence, but also'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'the place in human experience, indirect, incalculable, and non-preordained.
    intangible, unpredictable, indirect, and the forms of social and cognitive unlearning
    that accompany the digital age demand our attention.


    Lawrie McFarlane in “Prices Paid for Social Media Use” explains that since the
    TV era began, parents feared their children might be negatively-influenced by
    violent and sexually explicit material, and we are now well past that point. The
    chapter discusses how the advent of social media has proven devastating, desensualizing
    young men and robbing young people of basic understanding of human relationships.
    There is also discussion of the historical role of electronic media and how it
    enables and invites distortion.


    In “Afterword,” Bruce MacNaughton illustrates some of the legal consequences of
    the Internet and social media users’ awareness of the possible legal consequences
    of what they say in their texts and website postings. The larger point is that
    most users of social media and the Internet give little or no thought to what
    they are and may be doing in availing themselves of electronic access to what
    is, in effect, an undetermined audience.'
