  md: '# Chapter Synopses


    In “The Role of Habit,” C. G. Prado provides a context for the chapters that follow
    by discussing how the use of social media and the Internet instills habits in
    users: habits that to to one degree or another change them as persons by altering
    their thinking, attitudes, and ways of expressing their thoughts.


    Mark Kingwell in “Bored, Addicted, or Both: How We Use Social Media Now” details
    that there are many intellectual accounts of the condition of boredom, including
    a philosophical mini tradition running from Schopenhauer and Kieregaard through
    Heidegger to Adorno, and a psychological literature about the “creative” possibilities
    of boredom. There is, likewise, a recurrent concern within contemporary culture
    and technological discourse with respect to the perils of boredom. What is missing
    a critical assessment of the interface: the facet of a technological relationship
    that is neither platform nor content, but rather the manner in which the users
    engage with. The presuppitions of the subject-interface relationship are the true
    issue prompted into philosophical significance by the mundane experience of boredom
    or what I call “neoliberal boredom.”


    In “Attention, Emotion, and Desire in the Age of Social Media,” Hadija Dixon explores
    answers to the question: What are the particular modes of attention, expression,
    and attachment of the social media generation find most basically meaningful?
    This chapter discusses some digital technology and social media activities: communicating
    with emotion, updating statuses, “following,” “liking,” sharing, and personal
    branding. It also discusses whether the attachments related to these activities
    had nondigital precursors that cast doubt on the idea there is such a thing as
    a social media generation, as well as a less considered attachment peculiar to
    social media users: a tendency to orient to themselves and others as recursive
    auto/biographers.'
  merge: -1
