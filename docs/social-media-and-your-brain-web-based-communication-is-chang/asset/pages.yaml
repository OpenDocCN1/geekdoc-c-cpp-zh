  md: '# Attention, Emotion, and Desire in the Age of Social Media


    Khadija Coxon


    For better or worse, our age of social media has profoundly affected our social
    lives. Some feel that social media enhances social life, instantly connecting
    us across space and time and instigating democratizing, equalizing, and otherwise
    progressive social transformations. Others believe that social media disintegrates
    social life, disconnecting us from reality and face-to-face relationships. This
    essay is not about whether social media is good or bad; It is about the value
    of social media in the age of digital technology. How have digital technology
    and social life become entangled?


    Part of the answer is that attention, emotion, and desire have unique social functions
    in the age of social media. Social media operates accord-ing to an attention economy.
    Apps like Facebook, Twitter, Instagram, YouTube, Snapchat, and others revolve
    around built-in metrics of attention—Likes, Retweets, Followers, and so on—that
    using social media apps is like playing a game of vying for attention points.
    As our scores get higher, our desire for attention points increases. When we value
    another person’s opinion or want to express that we care about them, we pay them
    in attention points. At the same time, these apps use sophisticated built-in mechanisms
    of social and emotional regulation, primarily to serve social media companies’
    competitive interests in the attention economy. Many of'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Social Media and Your Brain


    us now have unenchable thirst for measurable quantities of attention, but at the
    same time yearn for social goods that are harder to measure, like authentic relationships.
    The attention economy has conferred such high value on the very idea of social
    life, it is now both a commodity and a symbol of pricelessess.


    # The Attention Economy of Social Media


    The term "attention economy" was first used by Herbert Simon to describe the elevated
    value of processing resources in situations of informational abundance. The term
    has resurfaced in recent media scholarship and cultural criticism, to describe
    situations in which people are saturated with demands to receive and give attention.
    Following these scholars, I use "attention economy" to clarify the scene in which
    there are gains and/ losses to social life in the context of digital media. Both
    those who praise and those who lament the age of social media translate attention
    currency.


    # Social Life as Circulation of Online Attention


    There is a positive story about social media that valorizes many ideas about the
    social, especially those attached to public social life as democracy, equality,
    community, and progress. At the same time, the positive narrative embraces entrepreneurs
    as capitalists as an ideology. I loosely trace this narrative to the key node
    of social media, the northern California tech scene, especially Alice E. Marwick''s
    ethnographic study of the tech scene, which began in 2006, when Web 2.0 was named
    "person of the year" by TIME magazine, and ended in 2010. During the time that
    Twitter was new to tech insiders, Marwick lived among, socialized with,’interviewed
    tech workers who had either achieved or were striving towards success in the tech
    world. Especially interesting for our purposes is Marwick''s observation that
    the ethos of this group reflects an ironic hybrid of politically progressive,
    countercultural utopian idealism and libertarian entrepreneurialism. If we see
    the positive story of social media in terms of this hybrid, we can make some sense
    of the fact that enthusiastic users of social media are apt to hold on the one
    hand that creating and distributing digital content for free is doing social good,
    and on the other hand that properly entrepreneurial creators and distributors
    will be financially and socially successful.'
