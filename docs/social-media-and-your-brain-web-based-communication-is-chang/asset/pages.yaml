  md: '# Social Media and Self-Control


    This all sounds neat. But it is probably wrong, for it loses sight of one key
    feature of skill acquisition: it is slow, it is hard, it is effortless, and it
    requires persistence. This persistence is what makes people become great guitar
    players while others learn more than a few chords. And at the highest levels,
    the greatest persistence is what distinguishes world-class performers from great
    performers. There has recently become a fascinating debate about the nature of
    skill and expertise, in which antiintellectuals (led Hubert Dreyfus) defended
    that as age progressed in skill she needed less and less control of attention,
    until she finally reached the level of expert she could do without it entirely;
    merely intuition and feel. This has turned out to be very controversial, and the
    most recent, most exhaustive empirical evidence seems to go against it, and lean
    in support of a more intellectualist view, according to which attentional control
    is required even at the highest levels of expert performance. As you become more
    skilled and advance to the higher levels of an art, a sport, a craft, and more,
    things also become more difficult and the possible diversions increase enormously.
    In for experts to perform at their best, they need to stay focused. And this implies
    great endogenous control of attention.¹


    If the intellectuals are right (as I argue elsewhere that they are).¹⁹ then Platonism
    2.0 still has the upper hand regarding the effects of social media on agency and
    the construction of the self. Acquiring a skill in more distracting environments
    requires even more endogenous control, because agents need control over their
    attention to trigger the multiple behavioral components into a meaningful, unified
    action. Without this great level of endogenous attentional control, what is most
    likely to be that, in the short run, agents end lost in their multitasking, forgotten
    mid-performance what it was they were trying to do in the first place; and that,
    in the long run, agents will end unable to create new, flourishing skills and
    virtuous selves, rather gathering incoherent, haphazard characters and identities.
    Even multitaskers need executive attentional control to reach the heights of skill
    and expertise. Therefore, even new generations will probably need self-control
    to generate new kinds of selves.


    # Concluding Remarks: A Dream Left Unfulfilled


    Here is a final question: if the emergence of a new dominant medium implies that
    something proper to the previous one will necessarily be lost, what is it that
    we are likely to lose? And how fundamental and crucial will that loss be?'
