  md: '# Afterword


    That said, the compulsive way in which many young people use the same technology
    leads one to think that they use it as a means of avoiding personal face-to-face
    contact while still “communicating.” Or they use it as a way to pursue criminal
    activity, to threaten, or to further their enterprises, seemingly without harm
    or consequences. After all, it is just a text or picture. Little do they know
    that their texts and image postings vary ours social media sites are an open book
    to investigators.


    It is the illusory anonymity that traps one.


    In the recent past


    Certainly, obtaining prospective communications would require a warrantuant the
    Criminal Code (Part VI). In the past, providers would keep all messages. Currently,
    some providers keep communications for approximately 30 days, others do not retain
    them. Previously, all carriers kept them for roughly 150 days. However, when a
    person is arrested and is in possession of a cell phone, a warrant may be obtained
    to view its contents.


    Pulitzer Prize winning Matt Richtel wrote A Deadly Wandering, a book that examines
    the impact of technology and driving: a book that examines the impact of technology
    on our lives. It tells the story of a Utah college student who, in 2006, as a
    result of driving killing two scientists. In an interview on CBC’s “The Current,”
    the student provides very interesting insights. He likened the needs to respond
    to a text to one of our ancestors responding to a tap on the shoulder. This is
    a friend or foe? One must know, and one must know now. As noted in some of the
    articles that follow, a text now demands the same response. I must know and respond—immediately—and
    technology provides the ability to do so, no matter the circumstances or surroundings.
    The (former) student is one of the leading advocates against distracted driving.


    The world is addicted to technology. How did I ever practice without a computer
    or a cell phone? I graduated without one in philosophy and subsequently law without
    one. Presently, I use two smartphones. Each of my staff has a cellphone. I have
    two computers on my desk; each of my staff members—four—has two computers. However,
    they are tools. I do not text and contact an acquaintance to say, “I’m at the
    pizza shop.'
