  md: '# Does Social Media Interferere with Reasoned Arguments?


    Perhaps it is clearer to posit that Wittgenstein, persistently questioning, was
    encountering and trying to convey the limitations of language could. This was
    in the sense of language qua language, certainly, but also, by extension, as a
    tool for "doing" logic. Or, perhaps it was at the same cultural moment that my
    reasoned thought itself. It is possible that at the same moment my students are
    immersed in social media, language (and what it does) is not just contracting,
    but so changing that reasoned thought is also morphing into something different?


    From a very different research perspective and perhaps two-thirds of a century
    later (but perhaps not coincidentally from the same university), Iain McIlchrist
    also has a lot to say about reason. McIlchrist comes at the subject from a pointed
    neuroscientific route, and from an examination of how the two hemispheres of the
    brain represent different ways of being in the world. Made possible by recently
    developed brain imaging techniques, McIlchrist argues for what might almost be
    a different "culture" for each hemisphere in how thought occurs.


    Recent Magnetic Resonance Imaging studies show the brain as being much less segmented
    in task and more adaptable than earlier thought. Earlier understanding of brain
    function, based on machine and computer models, saw particular parts of the brain
    responsible for particular kinds of work. Studies of brain injuries show that
    function can be rerouted or there are many different pathways to perception and
    thought. It now appears that activities that were thought to be localized in one
    area or hemisphere may occur in the opposite hemisphere or throughout the brain.
    The application of reason is a good example of this. While linear and sequential
    arguments are better executed by the left hemisphere, deduction and mathematics
    are mainly dependent on the right.


    With these more understandings, Iain McIlchrist dismantles the earlier oversimplified
    notion of language and logical, left brain as opposed to the "creative" right
    brain, which is present oriented, global in awareness, visual, and emotional,
    to show that reason—and human identity lies not in one hemisphere or the other,
    but crucially involves aspects of both. There is a hemispheric divide made necessary,
    he believes, because of the relatively recent exigencies of mammalian life, which
    demanded a capacity for two simultaneous modes: one involving more global awareness
    and one suited to mediate and linear tasks. These were needed to perform two separate
    but equally essential demands: to maintain vigilance against predation and to
    do linear, focused tasks such as food gathering, tool making, and eventually having
    conversations.'
