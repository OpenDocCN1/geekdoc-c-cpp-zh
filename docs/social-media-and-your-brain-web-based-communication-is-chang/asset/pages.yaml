    are baffled by “we’ve taught them to see him as humor—teaching you get—the same
    way we taught that a self is something you just have.


    No wonder, they cannot appreciate the essential Kafka joke, of species irony at
    once comic and tragic: “That the horrific struggle to establish a human self-results
    in a self whose humanity is inseparable from horrific struggle. That endless and
    impossible journey toward home is in our home.”¹⁹


    Precisely! We will not confront this, and thus never appreciate the complexity
    of achieving self at all, let alone effortlessly, as a mere presupposition if
    we are in the condition so vividly described by T.S. Eliot in “Burnt Norton”:
    “Neither pleasure nor vacancy. Only a flicker / Over the strained-ridden faces
    / Distracted from distraction by distraction / Filled with fancies and empty of
    meaning.” Boredom is the symptom, the diseases. Insofar we concentrate on banishing
    it, or sublimating it into creativity or further consumption, we merely postpone—perhaps
    indefinitely—a confrontation with self that is essential to self. And an endless
    and impossible journey may well often boring; it is never the journey upon which
    all of us are embarked.


