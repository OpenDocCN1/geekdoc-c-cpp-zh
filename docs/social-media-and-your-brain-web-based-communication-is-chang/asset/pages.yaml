    Art is not the only form of savoir attendre, nor even the most obvious. But for
    my purposes, it offers an ideal combination of reflection upon the nature of medium
    with an sometimes demanded, imperative to contemplate. What can this mean? Consider
    a passage toward the end of Guy Debord''s Society of the Spectacle (La Société
    du Spectacle, 1967), in which the project of dismantling ideological positions
    of consumable material experience generates the hope of a positive program. Debord
    notes that combating spectacular culture with the traditional tools of critical
    theory will only produce confusion. In some cases, the tools of critical reflection
    will be commodified by the very targets they presume to strike. “Par là le délire
    s''est constitué dans la position même qui prétend le combattre [Thus, madness
    appears in the very which pretends to fight,] Au contraire, la critique qui au-delà
