  md: '# Social Media and Self-Control


    Platonism 2.0 is the alarm of a self that sees that its means of self-forging
    are taken away from its feet.


    Those means—among others, but crucially—the technologies of the printed book and
    their widespread use. The dominance of the book as a medium meant that a single
    person could dig deeper than ever into her own consciousness and expose in meticulous
    detail what was to be found. This is what makes modernity''s novels, philosophical
    treatises, and scientific monographs possible. The reader was also conceived of
    a reflective individual, capable of following the sometimes dense, often long,
    most of the time linear plot or thought exposed in the book. And thus, writer
    and reader could form a community of reflective individuals capable of reasoned
    dialogue. The can, therefore, be made by the printing press strengthened and,
    generated this this kind of linear, reflective, thoughtful agency, along with
    its ideals of self-control and autonomy.


    Now, with the drastic change of medium, to some extent, a correspondingly drastic
    change of self will be unavoidable. Electric media like television and radio transformed
    the slower speeds of the printed word, but retained its linearity and unidirectionality.
    Digital social media represent a more thorough transformation, because they add
    to the intermediacy of electricity their hyperlinked and interactive nature. Now,
    instead of the slow-paced, monologic, and unidirectional medium of the book, and
    instead of the unidirectional and linear media like television, we have the massive,
    immediate, hyperlinked, and interactive media of the Internet. How will those
    radical changes in medium be reflected back onto the formations of agency and
    the self? We will have to wait and see.


    One thing to look out for is whether the broader profile of attention will enable
    us to create new kinds of abilities. Although we do suck at multitasking, at the
    same time multitasking is crucial for our ability to acquire skills. To see why,
    picture yourself trying to learn a musical instrument. When you first pick it
    up, the difficulty of performing the most basic tasks is enormous: synchronizing
    the movements of fingers and arms with the rhythms of the breath or the focus
    of the gaze requires our multitasking capacities at their maximum. But with practice,
    these different behavioral routines get automated and unified into action "chunks"
    that we are able to perform with less and less effort as we continue to practice.
    This is the effect of automation: we unify multiple complex behaviors into single
    units of synchronized, less effortless action that we can then control intuitively.
    Practice makes it easier to identify the few really relevant bits of information,
    and thus liberates'
