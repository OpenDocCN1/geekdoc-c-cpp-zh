  md: '# The Role of Habit


    C. G. Prado


    Like many social and political projects and endeavors, the Internet in general
    and social media in particular are having results quite different from what their
    creators hoped for and expected. Some of these unquestionably are good results.
    We have all blessed the ability to look something up on a website, to shop online,
    to be dazzled by NASA''s daily pictures of the universe, to “post” our views on
    issues or events we care about, and to respond to postings we find interesting
    or requiring comment or correction. But some results are bad, and while most readers
    will rightly think first of privacy issues in connection with bad results, I believe
    the more worrying results have to do with the use of social media and Internet
    connectivity is having negative neuropsychological effects on users. Still more
    worrying is the fact that these negative effects are especially impacting young
    users who are still in the process of defining themselves as persons.


    There is no question that the Internet and social media have put many people in
    touch who otherwise would not have contact with one another. Much of this is through
    postings on social media websites and other interactive sites that enable the
    sharing of photographs and videos. There is also more direct-on-one connectivity
    among individuals through computer, pad or tablet, and smartphone texting. Just
    as important as the greatly expanded connectivity among individuals is that social
    media sites, like Twitter and Facebook, have given people a voice they'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'never had before. Anyone can post a comment or opinion on a host of Internet
    sites. It is now possible to make your views known to literally millions of people
    beyond you deal with face to face. Admittedly, this enhanced connectivity, like
    all other forms of human interaction, has its own negative aspects. Individuals
    who benefit from Internet and social media may also suffer violation of their
    privacy, defamation, and cyberbullying. Moreover, comments and photos enthusiastically
    posted by individuals at one point in time at a later time cause social embarrassment
    or jeopardize your career or professional opportunities.


    On the whole, the Internet and social media have enabled a degree of social interaction
    unrest of the past. It is also unarguable that there are pluses and minuses to
    this interaction through social media and the Internet. Sorting out the pluses
    and minuses is complicated by the diversity of views on the issue. This diversity
    makes identifying the good and bad results of using social media and the Internet
    difficult, and a great deal of the felt approval or opprobium does not depend
    only on point of view as determined by background, interests, and occupation,
    as one would expect. Age is also a decision factor. This is, in collecting the
    chapters that follow, I worked to find contributors as different as in background,
    interests, and occupation, always mindful of their perceptiveness and the quality
    of their contributions.


    A collection like this one, reflecting the diversity of views on social media
    and Internet, is overdue. Too many available books about the Internet and social
    media are by single authors with particular points of view and objectives and
    connected to make a case for their own judgments and outlooks. What is offered
    here are a number of treatments of issues raised by the use of social media and
    the Internet, based on different perspectives and paying attention to diverse
    aspects of Internet connectivity. The aim is to make readers aware of the more
    important results of young and using old social media and the Internet. However,
    it is left to readers to draw their own conclusions.


    My view on the use of social media and the Internet is a cautious one. I believe
    that while there are genuine benefits, problems are coming up that do with users’
    practices and what those practices lead to. To my mind, the clearest instance
    of the dubious practices in question is texting, and it is texting that provides
    the radiant examples of highly problematic consequences. For instance, in a recent
    article, it was noted that a survey "of more than 400 eighth and eleventh graders
    had a lot in common with compulsive gamblers." The point that is being made is
    that many teenage texters are as obsessive about texting as compulsive gamblers
    are about wagering. This is an'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# The Role of Habit


    unnerving development. It is a development involving the overwhelming majority
    of teenagers rather than a relatively small group: “Texting has become the dominant
    mode of communication for teenagers, according to figures published in 2012 by
    the Internet and American Life Project.”1 Though the figure is at first startling,
    apparently “[t]the median number of texts sent by teens is 60 a day.”2 What this
    level of usage leads to be captured in the ironic title of another article: “Social
    Media Making Millennials Less Social.”3


    This second article illustrates another worrying outcome of texting as a favored
    practice, noting that a study “conducted by Flashgap ... found that 87 percent
    of millennials admitted to missing out on an ongoing conversation because they
    were distracted by their phone.” Fully 87 out of 100 teenagers think it is important
    to answer a text or call than continue a face-to-face conversation; nor is doing
    so thought rude, 87 out of 100 are prepared to do exactly the same thing. In my
    experience, giving a cellphone or smartphone message call priority over an ongoing
    conversation is as true of of most adults as is of millennials and teenagers.


    Obsessive texting and giving incoming texts and calls priority over ongoing conversations
    are only two examples of how electronic connectivity is altering peoples’ attitudes
    and social practices. Some will argue that the alterations are not for the worse;
    the problem posed is a matter of properly assimilating them rather than correcting
    or reversing them. This may be true to some extent, especially when we consider
    that there is little chance of stopping or undoing the connectivity that has prompted
    these controversial practices. But it is very important to be aware of what is
    happening with social media, the Internet, and smartphone connectivity, and to
    think seriously about what is happening to be redressed in some measure.


    The chapters here speak for themselves. What I offer in the rest of this chapter
    is a discussion of how use of social media and the Internet affects users in one
    pivotal way, which is by instilling habits: habits that change their attitudes
    and conduct, habits that change users as persons, and habits that are acquired
    and exercised unconsciously.


    To support my points about the views expressed by three very different philosophers:
    Aristotle, John Dewey, and Michel Foucault. Using the insights of an ancient Greek
    thinker, a systematic pragmatist, and a trendsetting postmodernist is very much
    in line'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Social Media and Your Brain


    with my gathering of contributors to this anthology with diverse backgrounds and
    interests. As I will show, these three philosophers, whose backgrounds, orientations,
    and central contributions are different, nonetheless come together on the nature
    of habit. They do come together regarding habit not only strengthens their individual
    conclusions, but it also reflects the value and importance of converging on a
    point or issue from different perspectives.


    Dewey''s account of how habits shapes persons was fundamental to his work and
    writings on education. Dewey had an optimistic view of education, and therefore
    of how persons are shaped. Though he agreed with Dewey—and with Aristotle—about
    the role of habit, Foucault had a more cynical view of how individuals are shaped
    as the persons they are. While Dewey, educative management of human conduct and
    the instilling of certain habits was a way to make things better, for Foucault,
    the discipline of individuals and so the instilling of habits in them only made
    different it, at some point, judged that the results are positive, but only because
    of contemporaneous interest-determined perceptions. It is stressed in Discipline
    and Punish, where Foucault portrays history presented as the enlightened reform
    of a ruthless penal system as actual implementation of changes that resulted in
    greater control of inmates through introduction of intrusive psychological manipulation.


    Dewey saw education as the means to a better society and enabling enlightenment
    for its members. He supervised and planned exposure of individuals to experiences
    that instilled select productive habits in them as resulting in personally and
    socially fruitful behavior—behavior made people better men and women through the
    process of imbuing desirable attitudes resulting from internalization of repeated
    actions. Dewey saw this as the whole point of education. For his part, what was
    central to Foucault''s cynicism about discipline or education''s effects was his
    concept of "power relations," which cast individuals'' actions as always done
    in a context of others'' actions, and so as influenced by others in unpredictable
    ways. The consequence Foucault thought inevitable was indeterminability regarding
    the outcomes of actions because peoples'' actions establish texts in which others''
    actions are initiated and in unforeseeable ways. This is the point of his profound
    but disturbing observation that “[p] people know what they do; they frequently
    know why they do what they do; but what they don''t know is what they do so."⁵


    Despite the attitudinal difference between them, for both Dewey and Foucault persons
    were formed by habits. Dewey put the point tersely: "habits . . constitute the
    self."⁶ Foucault''s most succinct statement of the point was that “[d]iscipline
    ‘makes’ individuals.”⁷ For both, a person'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# The Role of Habit


    is what a person does. In holding this view, Dewey and Foucault were of a mind
    with Aristotle, who held that a “state [of character] arises from [the repetition
    of] similar activities.”⁸ Habitual behavior makes people who they are, which is
    why it is crucial to understand what habits we acquire and what each new habit
    contributes to forming us as persons.


    If the claim that habits make who we are seems too strong, consider one basic
    and obvious way that habitual behavior determines personalità or personhood: by
    establishing that habitual behavior can be described as responsive conti-unity.
    This continuity, or behavioral consistency in taking action given various situations
    calling for responses, is enabled by habits through vision of a source or largely
    reflexive reactions to events, choices, queries, and other occasions calling for
    do or say something. The continuity is a similarity of responses or reactions
    that constitute what others see as an individual’s proclivities, and more deeply,
    as manifesting his or her character. The same continuity is evident when responses
    are called for in extraordinary circumstances the individuals having little option
    other than to do they ordinarily.


    This latter aspect of habitual behavior leads to significant difficulties when
    individuals treat new and different situations as what would ordinary and familiar
    ones. Encouragement to “think outside the box” is precisely aimed at individuals
    who respond to new and different situations as they would to familiar ones, on
    the basis of habitual ways of thinking and acting. In a straightforward sense,
    habitual behavior determines what is normal for individuals to do most of the
    time, and therefore what it is likely they will do in unusual or exceptional cases.
    It is in this way that habits mold persons, and it is in this way that changing
    habits changes persons.


    But does it all work? We may agree with Aristotle, Dewey, and Foucault held about
    the role of habit, but in the particular case of social media and Internet use,
    how does use instill habits that shape and reshape persons? The best answer to
    this question that I have come across is Nicholas Carr’s: “As our window into
    the world, and into ourselves, a popular medium what we see and how we see it—and
    eventually, if we change it, it changes who we are, as individuals and as a society.”⁹


    Regarding the actual mechanics of how acquisition of habits and habitual behavior
    shape and reshape persons, what needs to be understood is a point Foucault makes
    succinctly, somewhat dramatically: management of people’s behavior and the instilling
    of habits, as in education or in what most concerned him, the disciplining of
    prison inmates¹⁰ creates subjects out of the bodies it controls. Dewey described
    the'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Take an individual at a given point in his or her life. At that point, she
    or he is the product of previously acquired habits. Acquisition of a new habit
    changes the individual to a greater or lesser extent. It does so because the new
    behavior bears on her or her attitudes, thus altering her perception or construal
    of events, persons, and ideas. These alterations result in behavior that is different
    to some degree from previous behavior, and the alterations reinforced or inhibited
    by others react to the individual''s changed behavior. For example, an individual''s
    changed behavior may prompt comments from it from friends, which may be generally
    or specifically favorable or unfavorable. However, even if habit-induced alterations
    are inherited by others'' responses, they are not eradicated in the sense of being
    reversed and undone. If nothing more, an individual is changed by the very fact
    of having adopted a new habit, undergoing an attentitional shift, and then having
    consciously to abandon the new habit and by examining or her attitudes and practices.
    But taking it that acquisition of habits works, as Aristotle, Dewey, and Foucault,
    though all of this apply particularly to the use of social media and the Internet.


    Examples of how use of the Internet and social media instills habits are plentiful
    in books and articles warning about the effects of that use. One interesting example
    is about not only access to Internet sites and other users, but also the equipment
    that enables that. What is good about this example is that it not only calls attention
    to the communicative and attitudinal effects of using the Internet and social
    media, it also calls attention to the physiological and related psychological
    effects.


    The New York Times ran an article with the following title: "Your iPhone Is Ruining
    Your Posture and Your Mood." In the article, Amy Cuddy, a professor at the Harvard
    Business School, remarks: "If you are in a public place, look how many people
