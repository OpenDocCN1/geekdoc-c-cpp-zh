  md: '# Introduction


    I am concerned with what appears to be a rapidly dwindling capacity on the part
    of some university students to produce good arguments. By good here, I mean arguments
    that are valid in form and that are based on reliable sources of information.
    I think the two aspects are likely linked—a person might be susceptible to trusting
    unreliable information if they do not know how to make valid arguments—this paper
    focuses on the quality and kind of arguments themselves. The first question that
    I wish to address in this paper is: how might the source of information among
    young adults and the foundation for social media—the Web—lead to different understandings
    of what it means to construct an argument?


    The principles and technological structure of the World Wide Web (hereafter, the
    Web) make possible social media. Social media are described as “Internet-based
    applications that build on the ideological and technological foundations of Web
    2.0 and allow the creation and exchange of user-generated content.” Thus, the
    technological connection of the Internet is combined with the open-source information
    space of the Web to provide a powerful new focus for person-to-person creation
    and sharing of information in the social media. Some would say that social media
    is a natural consequence of what the Web makes possible. At root, social media
    are reliant on the Web as the basis upon upon particular functions are made possible.
    Thus, in this chapter, the influence of the Web as a whole on reasoned thought
    is considered under social media.


    # Understandings of Reason


    Imagine you are instructing a university course and that you receive an essay
    from one of your students. It is a short essay; the assignment only calls for
    a few pages. The essay is about, say, poverty as a factor affecting education
    for First Nations students. One paragraph describes how poverty in general has
    implications for learning; another describes historical covering this geographic
    region and their provision for education; another, Métis culture; another contains
    a quotation from a novel; another, a quotation from an interview with a First
    Nations representative; another, a quotation from a representative from the provincial
    government. The ideas from the different paragraphs are not connected by a clear
    argumentative thread. Then, a conclusion is presented.'
