  md: '# Social Media and Communicative Unlearning


    forms of social and cognitive unlearning that accompany the digital age we demand
    our attention.


    When an educationalist and university dean writes that a necessary condition of
    professors gaining credibility in their students'' eyes today is that they are
    technologically savvy, we have cause for concern. José Antonio writes: “When you
    try to demonstrate that your discipline is relevant, your inability to answer
    their cell phone already convinced them you cannot possibly have anything to teach
    them. If you do not have LinkedIn and Facebook profiles, if you do not use or
    blog . . . , if you do not routinely use iTunes or YouTube, if you do not know
    how to use GPS, or if you do not share photos on Flickr, Snapchat, or Picsa, then
    you have an immediate credibility problem with your students.” But then he argues,
    educational content itself is beloved in the form of podcasts, YouTube videos,
    Wikipedia, computer games, and social media such as Facebook and Twitter. This
    is the world that students now inhabit, and if educators expect to reach them,
    we need to reach them when they live. Studentshave been learning from games their
    entire lives,” he continues, “and increasingly”. Bowen notes that “Students no
    longer want to go to office hours; communication between professors and students
    must be electronic and fast.”³


    The author of words is not alone. Indeed, there is a burgeoning literature on
    the educational implications of the new technologies, and the prevailing attitude
    in it is an optimism that borders on triumphalism. While what is happening is
    surely explainable in part as a merely generational difference (parents, let us
    not forget, worried about rock and roll too), it is not only youth who share this
    optimism by many of their educators and educationalists, corporate entities and
    governments, and a growing proportion of the generations that grew up before technology
    existed. On the other side of this phenomenon are cultural and conservatives who
    look wistfully to a time when almost all communication was to face, young people
    know the canon, listened to musical music, and likely went to church. Nonmembers
    of the first group are quickly taken for members of the second, but a closer look
    reveals that there is room for a third way here, one that does not split the difference
