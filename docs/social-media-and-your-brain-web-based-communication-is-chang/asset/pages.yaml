    people experience loneliness and frustration in relation to their parents'' attention
    to digital devices like smartphones. Second, there is the idea that real relationships
    involve face-to-face interaction, while virtual relationships do not. This suggestion
    is typically accompanied by the claim that, without face-to-face interaction,
