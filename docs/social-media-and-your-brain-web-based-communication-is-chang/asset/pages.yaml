  md: 'Much like the previous questions, for the most part we will have to wait and
    see. But this much seems: the Enlightenment dream, in which each individual will
    be able to abandon his tutelage and think for himself, forming a community of
    autonomous minds able to engage in careful, reasoned debate about any issue, no
    matter how horny, is likely to become increasingly distant as we move to the new
    world of multitasking and distraction. For arguably, the rise of immediate, massive,
    interactive media has coincided with the rise of emotism and intuition in the
    public sphere that tends to bury disproportionate reflection and reasoned debate
    under a mountain of gut feelings and intense reactions, all quickly expressed,
    replicated and made viral through Facebook and Twitter.


    Again, is sufficient for a Platonist worry, particularly considering the most
    pressing problems of the contemporary world—like climate change and global economic
    inequality—tend to be very hard to understand, require deep reflection, and not
    be easily communicated in 140 characters. Some kinds of content are better suited
    for microexpression via tweets and for comprehension by short attention spans,
    and they again often coincide with reactionary, emotional messages that people
    can understand intuitively. So, what we ultimately be losing, if we lose the dream
    of the Enlightenment individual, is the very possibility of a functional, reflective
    democracy that is capable of discussing a topic without being distracted away
    from the topic by a tweetworthy, rhetorical sleight of hand.


    One might think that digital technology, being “extension of man,” may help us
    understand these problems and more effectively come with reasoned consensus about
    them. But the problem is that technology, as far as social media are concerned,
    seems to be pulling in the other direction, favoring breadth over attention, brief
    sprouts of impulse over careful and disproportionate reflection. Instead of building
    new scaffolds for our attentional control, new technology may be removing the
    previously set-up scaffolds. (This is, of course, partial. There are new Internet-based
    scaffolds; it just seems that the new diversions are more powerful, but this is
    a topic for another essay.)


    So, will the cognitive extensions of technology lead toward a renewed Enlightenment?
    Or will they push us away and into a social formation that is at the same time
    newer (in its massive synchronicity) and more archaic (in its focus on collective
    intuition rather than individual reflection)


    For now, the jury is still out. But I would not get my hopes up.'
