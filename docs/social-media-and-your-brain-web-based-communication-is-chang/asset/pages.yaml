    of the society around. “Nerd” culture, the culture that surrounds the technology
    industry, of long hours and living to work, is uniquely susceptible to labor cult
    structures last seen at the end of the 19th century. In labor cults, ritual is
    not just to enforce an in-group, but also to achieve social goals. In the 21st
    century, these goals may seem straightforward as a good party, but they are in
    fact personal agency in a time when things seem too big to control, and personal
    seems depend on a perfect performance of a public brand.


