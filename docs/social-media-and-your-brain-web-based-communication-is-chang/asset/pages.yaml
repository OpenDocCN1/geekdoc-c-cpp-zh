    # Social Life as Return to Offline Attention


    There is also a negative story about social media, one that valorizes social life
    but, instead of focusing on public social activity, focuses on in-person relationships
    with family and close friends. This narrative suggests that social media degenerates
    apparently real relationships, by over-orienting users to virtual worlds. This
    set of themes and values is ostensibly less complicated than the themes and values
    of the positive story of social media, perhaps because the negative story of social
    media is premised on what looks like a straightforward philosophical position:
    Real and virtual social worlds are different, and losing from the real for the
    sake of the virtual is a bad thing.


    The negative narrative gets more complicated when we try to explain the basis
    for distinguishing between real and virtual social worlds. Let us consider three
    possible explanations, all arguments typically made by proponents of the negative
    story of social media. First, there is the suggestion that real relationships
    are unmediated, while'
