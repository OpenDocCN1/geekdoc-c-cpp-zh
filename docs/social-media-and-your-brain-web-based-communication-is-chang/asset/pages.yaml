    children in the marshmallow experiment, who need attentional control in order
    to avoid the temptation of eating the marshmallow.


    On the other hand, attentional capture occurs when some external events grab our
    attention, to speak, without our permission. If someone loudly pronounces our
    name, we often cannot notice, even when we are deeply concentrated on some task.
    Sudden noises (e.g., a baby crying on a plane or a fire alarm), bright blinking
    lights, and fast approaching objects are capturing our attention, regardless of
    what we are doing or whether we would rather ignore them. These are exogenous
    processes of attention: they originate from outside of us, and our paying attention
    to them results from an involuntary, automatic reaction. These reactions make
    evolutionary sense, since they are our way of noticing unforeseen features of
    the environment that may require immediate responses.


    So, the objects of attention can be established endogenously or exogenously; and
    different people have different tendencies: some people''s attention is more easily
    captured than others, and some people can easily keep their goals in mind and
    avoid diversions from the original plan.


    Now, what would be the best distribution between endogenous and exogenous attention?
    I wish to push forward the idea that excesses in either direction are problematic
    that we can call such excesses "vices of attention" and, in an Aristotelian vein,
    the virtuous distribution of attention lies in a middle point between those extremes.


