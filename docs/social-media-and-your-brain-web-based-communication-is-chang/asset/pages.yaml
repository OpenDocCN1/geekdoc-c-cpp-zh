  md: '# # Introduction


    C. G. Prado


    People are being subtly and not so subtly changed by use of the Internet and social
    media. Teens and preens in particular are having their intellectual and social
    maturation significantly affected by their use of social media and the Internet.
    Ironically enough, some of the negative effects of their use of social media are
    isolating them socially. As worry is that use of social media and the Internet
    is jeopardizing their futures to the degree that it is weakening their performance
    during and after their education. Internet connectivity, use of social media,
    and testing practices foster abbreviated ways of communicating as well as indifference
    to evidential support for assertions or claims made. All of this hampers learning
    and mastering writing and communication. The point about indifference to evidential
    support is a focal point of the chapters that follow, and the chapter goes further,
    contending that reasoned argument and presentation have given way to the mere
    listing of takes on various issues and the drawing of unsubstantiated conclusions.
    This both supports and is supported by the growing attitude that mere presentation
    of one''s opinions is the whole point of communication and that all one know about
    interlocutors is their opinions.


    There are undeniably positive aspects to use of both social media and the Internet,
    some of these are acknowledged in the chapters here, but the negative aspects
    are more pressing because they also skewing users'' dispositions regarding their
    relations with others and, more subtly, altering their ways of thinking and expressing
    themselves.


    Some see the changes that are taking place as inevitable, and as in any case,
    mainly positive developments brought about by technological advancements. But
    this view is shortsighted. It is a view prompted by the common idea that the greater
    ease of contact and enabling of free expression provided by social media and the
    Internet are unqualified benefits. Unfortunately, the'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    benefits are decidedly qualified. Most central on the negative side is that we
    are not yet bionic men and women. Our interactions with one another still require
    nonverbal communicative elements that are learned and mastered, and which work
    effectively, in face-to-face interaction where the sheer presence of another or
    others affects so much of what we think, say, and do. Facial expressions and body
    language can be learned, and read successfully only through direct contact with
    others. These communicative problems are being recognized and addressed by parents
    of teenagers who are seeing their sons and daughters jeopardizing their development
    and futures by what can only be deemed addiction to online gaming, texting, and
    excessive participation in social media. Some are paying US$25000 to rehabilitation
    centers to we their teens from compulsive use of the Internet and smartphones.¹


    Though the communicative or interactive aspects raise the biggest questions about
    social media, texting, and Internet connectivity, there is nothing that should
    be of concern. Giving everyone on every topic significantly less the value of
    opinions by reducing them to the lowest common denominator. When everyone''s opinion
    is voiced, regardless of knowledge or its lack of perceptiveness or its, expressed
    opinions collectively lose. Faced with countless expressions of views, too many
    Internet and social media users revert to simply accepting and endorsing opinions
    they share. Expressed opinions cease to prompt reflection when too numerous and
    leveled their authority.


    As readers see, there are many other issues to consider, but whether we approach
    the matter of social media and Internet use positively or negatively, we need
    to understand how use is reshaping people as persons, as thinkers, and as communicators.
    This is what this collection is all about. The various issues raised, and the
    different approaches towards them taken in the chapters here, as have their main
    objective getting readers to think about what they are and what they are doing
    and what it is doing to them.


    As indicated, much of the point of this collection is to exemplify the wide variety
    of views taken on the Internet and on social media. Contributors vary in background
    and age, in professional interests and focus regarding the Internet. The primary
    benefit is that readers are exposed to diverse argued and substantiated perspectives,
    both positive and negative, on Internet connectivity and social media. They are
    not simply burdened with so many more expressed opinions. But, nearly as important,
    a beneficial result is that the diversity of perspectives attends to the multifaceted
    ways the Internet is affecting us—how it is, one might say encroaching on our
    lives.'
