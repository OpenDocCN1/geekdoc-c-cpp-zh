    and firstName

    - You can’t use C# keywords in naming your variables. This simple rule prevents
    compilation and runtime errors in your programs. If you really want to use keywords
    for your variables, you may begin the name using the “@” symbol (e.g. @bool, @int,
    @char, etc.).

    - A meaningful or descriptive name that is neither too long nor too short to identify
