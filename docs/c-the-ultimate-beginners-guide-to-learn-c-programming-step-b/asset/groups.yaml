    The Length of the figure is: {0}\", length);\n            Console.WriteLine(\"\
    The Width of the figure is: {0}\", width);\n            Console.WriteLine(\"The\
    \ Area of the figure is: {0}\", CalculateArea());\n        }\n    }//end the class\
    \ Figure\n    class RunFigure {\n        static void Main(string[] args) {\n \
    \           Figure f = new Figure();\n            f.GetDetails();\n          \
    \  f.Show();\n            Console.ReadLine();\n        }\n    }\n}\n```\n\nRun\
    \ the code and enter the measurements of the figure, both the width and the length.\
    \ You will get the area of the figure.\n\nThe member variables, that is, the *width*\
    \ and the *length* have been defined as *private*. This means that we cannot access\
    \ them from the Main() function. The *GetDetails()* and *Show()* member functions\
    \ have been declared as *public*, hence they are able to access these variables.\
    \ We can also access them from the *Main()* function after creating an instance\
    \ of the *Figure* class. This instance has been given the name *f*.\n\n### Public\
    \ Access Specifier\n\nWith a public access specifier, a class is able to expose\
