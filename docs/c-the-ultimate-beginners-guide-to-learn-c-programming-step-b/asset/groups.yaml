    \  f.Show();\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n运行代码并输入图形的尺寸，包括宽度和长度。你将得到图形的面积。\n\
    \n成员变量，即 *width* 和 *length*，已被定义为 *private*。这意味着我们不能从 Main() 函数访问它们。*GetDetails()*\
    \ 和 *Show()* 成员函数已声明为 *public*，因此它们能够访问这些变量。在创建 *Figure* 类的实例之后，我们也可以从 *Main()*\
    \ 函数访问它们。这个实例被命名为 *f*。\n\n### 公共访问修饰符\n\n使用公共访问修饰符，类能够将其成员函数和成员变量暴露给其他对象和函数。任何声明为\
