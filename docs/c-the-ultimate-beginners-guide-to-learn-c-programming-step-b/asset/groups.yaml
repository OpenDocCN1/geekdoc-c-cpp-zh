    # Description


    C# has a growing popularity and is steadily being used more and more. Many famous
    sites and enterprise level applications are powered by C#. You can find C# in
    the scientific computing being run on supercomputers. System administration tasks
    such as package management and configuration use C# as well. No matter what your
    programming interests, the possibilities for learning, exploring, and growing
    are endless.


    The first thing that you might want to look into when it comes to a coding language
    is to understand why C# is so special and why you would even want to learn how
    to use this particular programming language.


    There are many different coding languages out there to choose from, and they all
    work differently. Some people go with a certain coding language because it is
    easier to use than some of the others and some will choose their programming language
    based on the kind of programming they can do with it.


    C# is extensively utilized to create software ranging from desktop applications
    to dynamic websites. C# incorporates various advantages of different programming
    languages. Since the strong programming structure of C# and .NET Framework is
    combined with visual programming in the Visual Studio environment, you can create
    visually elegant and functional applications easily.


    Historically, a team led by Anders Hejlsberg of Microsoft Corporation designed
    and developed C# by taking the advantageous sides of C, C++ and Java 18 years
    ago. Since then, C# is continuously developed and supported. By the way, you may
    wonder what C# means literally. In this naming, # is taken from musical notation
    where it means a semitone higher in pitch. Therefore, C# is a “semitone higher
    language” compared to the standard C programming language.


    Working with the C# language is a great experience, and you’ll be writing a lot
    of great codes in no time. Use your time to look through this guidebook to help
    you get started with writing in this language today!'
  - '[PAGE 6]


    # # Introduction


    Although there is nothing easy about learning a new language of any sort, the
    aim of this book is to allow you to pick up and understand as quickly and easily
    as possible. The goal of this is to provide you with complete and comprehensive
    skills that are able to help you retain important knowledge and guide your programming
    and coding experience in C#. In order for you to learn in the most efficient manner,
    I hope that you will also do the practice that will reinforce the lessons we explore
    in this book.


    The book will cover a basic description of what C# is, and finally give you some
    helpful hints and resources to reinforce any subjects or skills where you may
    need a little more assistance.


    This language is one that will mirror some components of other computer programming
    languages—it is almost invaluable experience if you are familiar with other languages
    themselves. Although this book is not quite just a beginner’s manual that introduces
    you to the art of programming, it will reiterate and acknowledge a lot of these
    skills to help you achieve your maximum programming results in the quickest amount
    of time you can. Keep in mind that this language provides the programmer with
    many abilities, and this book may refer to things in terms of gameplay programming
    I hope you are also familiar with.


    Although I provide you with the information and some basic skills to practice,
    it is up to you to put these skills into practice. I highly recommend you find
    a strict routine to abide by that involves research, study of the material and
    practice in your own virtual environment that familiarizes you with these skills.
    As commonly known, you can guide a horse to the water but you can’t force it to
    drink!


    I can give you the knowledge and resources but it will be up to you to take on
    the challenge of synthesizing and using them to create your own programming and
    codes.


    With an object-oriented and structured language such as C#, I think you will find
    it easy to learn and user-friendly. This high-level language builds on and, in
    some ways, complements the languages of C, C++ and even Java. However, even if
    you are a master of these languages, this new task will have just a steep of a
    learning curve as any of the other programming languages do! Throughout this process,
    I encourage you to use your own knowledge and instincts to apply the concepts
    and strategies in this book. Remember, everyone is a beginner before they are
    a master!'
  - '[PAGE 7]


    # Chapter 1: What is C#


    You have come across and purchased this book in order to learn how you can become
    a C# programmer.


    Throughout this book, you will learn basic rules of how to apply C# within your
    own programming projects. C# (pronounced as “see sharp”) is an object-oriented
    computer programming language that was both designed and developed by Microsoft.


    This is a fairly new language and is considered to be very functional and object-oriented
    in nature. Although C# is most certainly not the same language as C or C++, there
    are definitely some similarities between the languages and it could even be considered
    helpful to have an insight or knowledge and experience in either or both of those
    languages.


    Just as with all programming languages, having knowledge of how they work on a
    basic and functional level is helpful. All languages have one thing in common,
    they are working towards telling the computer what and how to set up systems,
    databases or how and when to run and execute programs.


    This particular language has roots stemming from a programmer, Anders Hejlsberg,
    who was a member of the development team of .Net Framework for Microsoft[1]. Although
    some people tend to criticize C# as being somewhat of a “rip off” of Java, you
    will see throughout the course of this learning manual that (if you have a knowledge
    of Java that is) there are distinct differences in the content and structure of
    the language that make it different.


    With a design that was formulated for an environment that has the ability to use
    high-level languages and consists of executable code (also referred to as Common
    Language Infrastructure or CLI) it appeals to many who are interested in this
    easy-to-learn language.


    It boasts efficiency as one of its objects, so there are quite a few advantages
    to using it. Throughout this book, I will introduce you to how this object and
    component-oriented language can be easily acquired as a new language for you to
    use.


    Along with being a structured language, you can count on efficient results from
    your programming and coding within the C# language. I will assist you with optimizing
    your performance, in order to obtain your desired output from the work you put
    into programming and coding in this language.'
