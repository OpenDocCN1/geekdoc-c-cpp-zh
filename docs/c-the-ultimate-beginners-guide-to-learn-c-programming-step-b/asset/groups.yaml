    \ these had been defined inside the structure. The two instances share properties,\
    \ but these will take different values. We have then printed the values of these\
    \ properties as shown in the above output.\n\n## Characteristics of Structures\n\
    \nSo far, you have known how to use structures and some of their characteristics.\
    \ The structures in C# have a great difference from the structures supported in\
    \ C and C++. C# structures have the features described below:\n\n- Structures\
    \ may have fields, indexers, methods, properties, operators and events.\n- A structure\
    \ can have defined constructors, not destructors. However, in a structure, we\
    \ are not allowed to define a default constructor. The reason is that this is\
    \ defined automatically and one cannot change it.\n- A structure cannot inherit\
    \ another structure or a class.\n- With a structure, we can implement one or more\
    \ interfaces.\n- The members of a structure cannot be specified as virtual, abstract,\
    \ or protected.\n- After the creation of a Struct object via the *New* keyword,\
    \ the struct object is created and the necessary constructor is called. Unlike\
    \ classes, we can instantiate a struct without the use of the *New* keyword.\n\
    - If we don’t use the *New* operator, the fields will not be assigned and it will\
    \ not be possible to use the object until an assignment has been done to all the\
    \ fields.\n\n## Struct vs. Class\n\nHere are the differences between Structs and\
    \ Classes:\n\n- A Struct is explained as a value type. On the other side, a class\
    \ is defined as a reference type.\n- Structs don’t support inheritance. Classes\
    \ do.\n- A Struct cannot have a default constructor. A class can have.\n\nLet\
    \ us create an example in relation to the above differences:\n\n```csharp\nusing\
    \ System;\n\nstruct Cars {\n    private string model;\n    private int cc;\n \
    \   private int passengers;\n    private int year;\n\n    public void getValues(string\
    \ m, int c, int p, int yr) {\n        model = m;\n        cc = c;\n        passengers\
    \ = p;\n        year = yr;\n    }\n\n    public void show() {\n        Console.WriteLine(\"\
    Car model : {0}\", model);\n        Console.WriteLine(\"CC : {0}\", cc);\n   \
    \     Console.WriteLine(\"Passengers : {0}\", passengers);\n        Console.WriteLine(\"\
    Year :{0}\", year);\n    }\n};\npublic class myStructure {\n    public static\
    \ void Main(string[] args) {\n        Cars Premio = new Cars();  /* Declare Premio\
    \ of type Cars */\n        Cars X6 = new Cars();      /* Declare X6 of type Cars\
    \ */\n        /* Premio specification */\n        Premio.getValues(\"Saloon\"\
    ,\n        1800, 5, 2012);\n        /* X6 specification */\n        X6.getValues(\"\
    Saloon\",\n        3500, 5, 2012);\n        /* print Premio info */\n        Premio.show();\n\
    \        /* print X6 info */\n        X6.show();\n        Console.ReadKey();\n\
    \    }\n}\n```\n\nThe code will give the following output after execution:\n\n\
    ```text\nCar model : Saloon\nCC : 1800\nPassengers : 5\nYear :2012\nCar model\
    \ : Saloon\nCC : 3500\nPassengers : 5\nYear :2012\n```\n\n## Chapter 13: Encapsulation\n\
    \nEncapsulation is the process of enclosing items within a logical or physical\
    \ package. In object-oriented programming, encapsulation is used to prevent access\
    \ to the implementation details.\n\nEncapsulation and Abstraction are closely\
    \ related features in object-oriented programming. The purpose of abstraction\
    \ is to make the relevant details visible to users while the purpose of encapsulation\
    \ is to enable a programmer to implement the required level of abstraction.\n\n\
    To implement encapsulation[35], we use *access specifiers*. The role of an access\
    \ specifier is to state the visibility and scope of a class member. There are\
    \ different types of access specifiers that are supported in C#. They include\
    \ the following:\n\n- Public\n- Protected\n- Private\n- Protected internal\n-\
    \ Internal\n\n### Private Access Specifier\n\nWith a private access specifier,\
    \ a class is able to hide its member functions and member variables from other\
    \ objects and functions. Only functions of a similar class are able to access\
    \ its private members. An instance of the class is not able to access the private\
    \ members of the class. Consider the example given below:\n\n```csharp\nusing\
