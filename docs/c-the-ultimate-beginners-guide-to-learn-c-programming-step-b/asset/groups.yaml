    # # Chapter 10: The Array World^[27]


    We can define an array as a special data type that stores a fixed number of values
    in a sequential manner and by use of a special syntax^[28]. All the array elements
    must belong to the same data type such as a string, integer, double etc. You can
    think of an array as a collection of variables of the same type stored in contiguous
    memory locations. You use an index to get access to a given element within an
    array.


    In the memory, the lowest address identifies the first element in the array while
    the highest address identifies the highest element in the array.


    # ## Declaring Arrays^[29]


    The declaration of arrays in C# is done using the following syntax:


    ```

    datatype[] arrayName;

    ```


    The *datatype* helps us specify the data type of the elements that are stored
    in the array, not forgetting that all the array elements must belong to the same
    data type. The square brackets `[]` help in stating the rank of the array, where
    the rank denotes the size or the number of elements to be stored in the array.
    The *arrayName* denotes the name of the array. The following are valid examples
    of array declarations:


    ```

    int[] intArray;  // may be used for storing int values

    ```


    ```

    bool[] boolArray; // may be used for storing boolean values

    ```


    ```

    string[] stringArray; // may be used for storing string values

    ```


    ```

    double[] doubleArray; // may be used for storing double values

    ```


    ```

    byte[] byteArray; // may be used for storing byte values

    ```


    ```

    Employee[] customDepartmentArray; // may be used for storing instances of Employee
    class

    ```


