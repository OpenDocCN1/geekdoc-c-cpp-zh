    Saloon\",\n        3500, 5, 2012);\n        /* print Premio info */\n        Premio.show();\n\
    \        /* print X6 info */\n        X6.show();\n        Console.ReadKey();\n\
    \    }\n}\n```\n\n代码执行后将给出以下输出：\n\n```text\nCar model : Saloon\nCC : 1800\nPassengers\
    \ : 5\nYear :2012\nCar model : Saloon\nCC : 3500\nPassengers : 5\nYear :2012\n\
    ```\n\n## 第 13 章：封装\n\n封装是将各项内容包含在逻辑或物理包中的过程。在面向对象编程中，封装用于防止访问实现细节。\n\n封装和抽象是面向对象编程中密切相关的特性。抽象的目的是使用户能够看到相关细节，而封装的目的是使程序员能够实现所需的抽象级别。\n\
    \n为了实现封装[35]，我们使用 *访问修饰符*。访问修饰符的作用是声明类成员的可见性和作用域。C# 支持不同类型的访问修饰符。它们包括以下内容：\n\n\
    - 公共（Public）\n- 受保护（Protected）\n- 私有（Private）\n- 受保护内部（Protected internal）\n-\
    \ 内部（Internal）\n\n### 私有访问修饰符\n\n使用私有访问修饰符，类能够对其他对象和函数隐藏其成员函数和成员变量。只有同类中的函数才能访问其私有成员。类的实例不能访问该类的私有成员。请考虑下面给出的示例：\n\
    \n```csharp\nusing System;\n\nnamespace AccessApplication {\n    class Figure\
    \ {\n        // The class member variables\n        private double width;\n  \
    \      private double length;\n        public void GetDetails() {\n          \
    \  Console.WriteLine(\"Enter the Length: \");\n            length = Convert.ToDouble(Console.ReadLine());\n\
