    \        beforeDisplayEvent();\n\n        Console.WriteLine(\"Decimal: {0:G}\"\
    , dec);\n    }\n\n    public void DisplayMoney(int amount)\n    {\n        if\
    \ (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n\n        Console.WriteLine(\"\
    Money: {0:C}\", amount);\n    }\n\n    public void DisplayTemperature(int x)\n\
    \    {\n        if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n\
    \n        Console.WriteLine(\"Temperature: {0:4:N1} F\", x);\n    }\n\n    public\
    \ void DisplayHexadecimal(int dec)\n    {\n        if (beforeDisplayEvent != null)\n\
    \            beforeDisplayEvent();\n\n        Console.WriteLine(\"Hexadecimal:\
    \ {0:X}\", dec);\n    }\n}\n```\n\nThe *DisplayHelper* is a publisher class responsible\
    \ for publishing the *beforeDisplayEvent* event. Before every display method,\
    \ it first checks to determine whether the *beforeDisplayEvent* is not null and\
    \ then calls the *beforeDisplayEvent()* method.\n\nWe now need to create a subscriber.\
    \ Consider the class given below:\n\n```csharp\nusing System;\n\npublic class\
    \ MyProgram\n```\n"
