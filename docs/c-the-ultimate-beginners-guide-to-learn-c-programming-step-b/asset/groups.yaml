    for (double sample = 1; sample < 5; …)\n{\n    // This is the loop’s body.\n}\n\
    ```\n\n计算机程序会在运行循环体之前计算条件表达式。如果结果为“真”，循环体将运行；否则，相关程序将跳转到当前循环之后编写的语句。\n\n### 更新语句\n\
    \n这是“for”循环的最后一部分。基本上，更新语句用于更新循环计数器。让我们使用上面给出的代码片段：\n\n```csharp\nfor (double\
    \ sample = 10; sample > 1; sample--)\n{\n    // This is the loop’s body.\n}\n\
    ```\n\n程序在运行循环体后执行此部分。请记住，该语句会更新计数器的值。\n\n### 循环体\n\n这一部分由 C# 语句组成。它可以使用你在循环初始化片段中声明的变量。请查看下面的示例：\n\
    \n```csharp\nfor (double sample = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n### Continue 运算符\n\n在某些情况下，你需要停止当前迭代，但又不结束整个循环。你可以使用 C# 中名为“continue”的运算符来完成此任务。下面给出的示例将说明该运算符的工作原理：\n\
    \n```csharp\nint n = int.Parse(Console.ReadLine());\nint sum = 0;\nfor (int i\
    \ = 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n    {\n        continue;\n   \
    \ }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n```\n\n这段代码计算从 1\
    \ 到 n 范围内所有除以 7 有余数的奇数之和。\n\n### “Foreach” 循环[20]\n\n就在不久前，C# 引入了“foreach”循环（即扩展的“for”循环）的概念。这种循环概念在其他编程语言（如\
    \ C、VB、C++、PHP 等）中也可用。借助这一编程工具，你可以遍历列表、数组或其他值组中的所有元素。“foreach”循环可以处理非索引数据组中的所有现有元素。\n\
    \n在编写这种循环时，请使用以下语法：\n\n```csharp\nforeach (type name_of_variable in name_of_group)\n\
    {\n    the_statements;\n}\n```\n\n可以看到，这种循环比典型的“for”循环简单得多。“foreach”循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环也就不足为奇了。\n\
    \n### 嵌套 For 循环\n\nC# 允许你在另一个“for”循环内放置一个“for”循环。位于代码最内层的循环运行次数最多，而最外层的循环重复次数最少。在“嵌套”for\
    \ 循环时，应使用以下语法：\n\n```csharp\nfor (initializing_fragment; condition; update_statement)\n\
    {\n    for (initializing_fragment; condition; update_statement)\n    {\n     \
    \   statements;\n    }\n}\n```\n\n这里，程序运行最初的“for”循环，执行其循环体，并触发嵌套循环。程序将检查第二个循环的条件，并执行其中的代码，直到计算结果为假。然后，程序将对循环计数器进行必要的调整。程序将重复整个过程，直到所有条件都为假。\n\
    \n## 第 9 章：C# 方法\n\n本章将重点介绍 C# 方法。在这里，你将学习如何在自己的程序中声明和使用方法。要想成为一名高效的 C# 程序员，你需要牢记本章所包含的内容。\n\
    \n### 方法——基础\n\n对于大多数程序员来说，方法是任何程序的核心部分。方法可以解决问题、接受用户输入（称为参数）并产生结果。\n\n方法只是一组为执行共同任务而组合在一起的语句。每个\
    \ C# 类都至少有一个方法，即 Main 方法。要使用一个方法，你必须先定义它，然后调用它来执行其预期的操作。方法通过表示程序所完成的数据转换来完成任务。此外，方法也是实际处理过程完成的地方。这就是\
    \ C# 程序员将方法视为任何计算机程序基本单元的主要原因。\n\n### 方法带来的好处\n\n在本节中，你将了解 C# 方法带来的主要好处。阅读完这些内容后，你就会明白为什么在编写程序时应使用这些工具。\n\
    \n### 更好的结构与代码可读性\n\n编程专家声称，在编写计算机程序时应使用方法。即使是最简单的方法，也能改善 C# 代码的结构和可读性。\n\n这里有一个你需要了解的重要事实：程序员会花\
    \ 20% 的时间来编写和检查他们的计算机程序，其余 80% 的时间则用于维护和改进软件。显然，如果你的代码可读性好且结构清晰，那么你在程序上开展工作就会轻松得多。\n\
    \n### 避免冗余代码\n\n方法可以帮助你避免程序中出现冗余代码。冗余或重复的代码往往会在计算机应用程序中产生不良结果。\n"
