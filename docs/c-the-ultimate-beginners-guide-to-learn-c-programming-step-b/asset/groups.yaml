    # # Chapter 18: File I/O[40]


    A file is characterized by a name and a directory path. Once you open a file,
    it becomes a *stream*. Files are normally opened for reading or writing purposes.


    The stream is simply the sequence of bytes that pass through the communication
    path. Streams are of two types:


    +   - Input stream

    +   - Output stream


    The input stream helps us to read data from a file, that is, a read operation,
    while the output stream helps us to write data into a file, that is, a write operation.


    # ## Input/ Output Classes


    C# provides us with a number of classes that we can use for working with files.
    These classes can be used for accessing directories, files, creating new files,
    opening existing files and moving files from one directory to another. These classes
    are defined in the System.IO class. Let us discuss some of these classes:


    +   - **BinaryReader**- this class helps us in reading primitive data from a binary
    stream.

    +   - **BinaryWriter**- this class helps us in writing primitive data in a binary
    format.

    +   - **BufferedStream**- this acts as a temporary storage for bytes of streams.

    +   - **Directory**- this class helps us to manipulate the structure of a directory.

    +   - **DriveInfo**- this class provides us with information about the drives.

    +   - **File**- this class is used for manipulation of files.

    +   - **FileInfo**- helps in performing operations on files.

    +   - **FileStream**- used for writing and reading from any location in a file.

    +   - **MemoryStream**- helps in randomly accessing data kept in a memory.

    +   - **Path**- for performing operations on path information.

    +   - **StreamReader**- reads characters from a stream of bytes.

    +   - **StreamWriter**- writes characters to a stream.'
