  mdcn: '

    尽管C#是借助Microsoft平台开发出来的，但该语言本身并不只局限于该平台。C#的另一个重要理念是，这种多功能性使你能够将这种面向对象语言带到不同平台，从而创建多维且可用的程序和软件。


    相信你熟悉其他语言，语言的某些方面有助于实现某些期望结果。本学习C#指南将介绍许多优点，它们可帮助用户实现可移植性、类型化、元编程、属性、内存访问以及方法和函数——此外还有一系列其他优点，我们将在后续章节中讨论并举例说明。


    该语言正式版本自2002年才出现，因此可被视为较新的编程语言。然而，不要因此认为它不能、也不会与Java等出现时间稍长的其他语言竞争。


    该语言的开发者确实致力于改进并添加不同功能，这些功能最初是专为 .Net Framework 设计的，但如今已得到扩展；他们凭借许多功能取得了成功——其中许多人往往喜欢的是所使用的语法。


    这种语言有可能被用于专注于游戏玩法。对玩家而言重要的是，游戏不仅要有趣并吸引注意力，他们还希望体验本身令人愉快。


    由于你自己可能也算得上程序员（或者至少欣赏计算机的能力），在读完本书后，我期望你能深刻理解游戏程序员为了最终创造出你所拥有的体验付出了多么艰辛的努力。


    尽管我不认为只读本书就能让你制作出一款大师级游戏（你也需要大量练习！）——但我确实相信，你会更深入地理解那些在处理图形编程与设计的众多组成部分时至关重要的概念。在整本书中请记住，你正在通过自己使用该语言的编码和编程技能，创造并微调一个潜在无尽的世界。面向对象的组成部分确实有助于强化这一理念。


    在接下来的章节中，你将了解C#如何以及为何对你非常有用，以及如何轻松入门并在不到一个月内熟练掌握所有基础知识。


    凭借可与其他任何语言相媲美的标准库，到本书结束时，你将知道如何找到可能需要的源代码并执行它，以产生相当一致且精美的结果。该语言的另一个优点是其布尔条件，它受到许多人青睐；此外还有Windows集成，使你能够轻松访问最流行的操作系统之一。


    作为本章对C#是什么这一非常浅显解释的最后说明，我只想指出几个在整个过程中最好牢记的编程与编码一般概念。


    首先，请记住计算机没有直觉。这意味着它们会完全按照你告诉它们的方式执行任务。计算机不会像人那样从你的代码中推断出信息。当你遇到任何困难时，请始终牢记这一点。


    还要记住，一个简单的间距错误或一个错误字母都可能带来许多麻烦。如果你陷入看似无法逾越的僵局——也许你需要短暂休息一下，再回来重新查看你的代码。


    有时，当我们长时间盯着屏幕时，会看不到自己的错误。


    最后，请记住，你不是第一个在学习这种语言时遇到困难的人，也肯定不会是最后一个。本书最后一章将提供进一步的有用资源和提示指南，以解决我预计你在开始学习这种语言时未来可能遇到的任何困难。


    本书为你学习C#设定了合理的期望。我鼓励你尽量按照这种方式学习。重要的是，不要在短时间内用过多内容压垮自己。


    反过来，也不要让太多时间流逝后才重新投入学习。你可能会忘记一些细微差别，而这些差别可能会让你抓狂。请允许自己抱有合理的期望，本书正是为此设计的。


    最后，享受学习过程！为自己正在学习的新技能感到自豪，并准备好参加一门快速掌握C#基础知识的速成课程！


    ## 第2章：详细概述


    既然你是初学者，我们希望专注于打下坚实基础，让你全面了解C#基础知识。


    从本质上讲，到第一周结束时，你将牢固掌握C#环境、程序结构、基本语法和数据类型、类型转换、变量、常量和运算符。如果你对所用术语或方法不熟悉，我会尽量对这些术语做一个快速的基础回顾。如果这仍不足以唤起你的记忆，你可能需要从Google或其他资源中找一份快速复习资料。我还想推荐一个免费的交互式
    shell 程序，你可以在上面试用代码——https://www.tutorialspoint.com/compile_csharp_online.php，这应能帮助你完成本书中包含的任何训练练习。


    ### 环境


    如前所述，C#由开发者设计为与Microsoft和.Net Framework集成。可以想见，这对你在C#中所见的环境有很大影响。理解C#的重要部分来自你对其两者如何相互作用的理解。首先，这里简要概述
    .Net Framework，以帮助你更好地理解两者如何交互。


    正如名称中 framework（框架）的后半部分所暗示的那样，.Net Framework 是一个可以运行应用程序的平台。.Net Framework 是
    Microsoft 开发的软件开发平台。该框架旨在开发可在Windows平台上运行的应用程序。第一个版本于2002年发布，命名为 .Net Framework
    1.0。此后，该框架至今已进行了大量更新。


    我们可以使用 .Net Framework 创建基于Web和基于窗体的应用程序。我们还可以用它开发Web服务。除C#之外，.Net Framework 还支持Visual
    Basic编程语言。这意味着程序员可以选择用于开发应用程序的语言。


    该框架可帮助你编写三种不同类型的应用程序——Web服务、Web应用程序和Windows应用程序。当人们使用该框架应用程序时，它实际上可被多种编程语言使用，因为它是一个多平台应用程序。从Visual
    Basic、JScript、C++到COBOL等多种语言，也能够在框架内相互通信。该框架的另一个重要特点是可供语言使用的广泛代码库；就我们的目的而言，我们将讨论C#。


    任何语言或框架的一大优点都是你可以利用代码库的潜力。对于 .Net Framework 和C#，有一个庞大的库可供你访问并用于编码项目。我经常给人们的一条建议是：尽管这些库是极好的资源，但一定要理解编码本身的方式和原因，以确保在问题出现时你能够修复它。


    Microsoft 本身也为用户提供了一个出色的工具，以协助他们进行C#编程项目的开发。


    该公司甚至免费提供两个出色的工具，它们是编写从简单到复杂任何类型应用程序的绝佳资源。我推荐的两个工具（因为免费！）是 Visual C# 2010 Express
    和 Visual Web Developer。


    如果这些选项让你觉得不习惯或不喜欢使用，你始终可以使用文本编辑器来编写可能需要的源代码。我推荐其他选项，是因为我觉得它们比简单的代码编辑器更有帮助。不过，很多人更喜欢那种方法——这真的取决于你以及你对某个程序的适应程度。把它们都试一试，看看哪种方法更适合你。


    你可以从名为 Microsoft Visual Studio 的网站下载我提到的两个Microsoft程序。


    最后，你还可以在Linux或Mac OS上运行C#，这是一种跨不同平台编码的强大能力。不过，要在不同操作系统上做到这一点，你显然需要一个非Microsoft框架。我推荐“mono”——这是一个可在Linux和Mac上使用的开源选项。


    了解了环境基础知识后，就去下载或打开你希望熟悉的程序，开始编码过程吧。试用一下软件——或者你也可以先消化新知识，然后再继续项目的下一阶段！


    ### IDE（集成开发环境）


    IDE 是一种用于编写程序的程序。大多数 .Net 开发者更喜欢使用 Visual Studio Community 作为 IDE。它允许你创建、调试和运行应用程序。此IDE可用于开发基于Web和基于窗体的应用程序。要使用此IDE，你必须将其下载并安装到计算机上。你可以在下面给出的URL中找到它：


    https://www.visualstudio.com/downloads/


    你可以选择免费的 Visual Studio Community，或选择 Visual Studio Professional Edition；后者有30天试用期，试用期到期后必须付费。


    下载完成后，双击安装文件开始安装Visual Studio。按照屏幕上的说明操作，直到Visual Studio安装完成。


    之后，你就可以开始创建自己的C#应用程序了。


    '
