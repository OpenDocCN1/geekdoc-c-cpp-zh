    # FileStream Class


    This class is defined in the System.IO namespace and it helps us to read from
    and write to files. We can also use it to close files<sup>[41]</sup>.


    For you to be able to use this class, you have to create its object. This instance
    can then be used for creating new files and opening existing files. Here is how
    you can create an instance of the FileStream class:


    ```

    **FileStream <object> = new FileStream( <file>, <FileMode Enumerator>,**

    **<FileAccess Enumerator>, <FileShare Enumerator>);**

    ```


    For example, suppose we need to read a file names *names.txt*. We can create a
    FileStream object named *FS* and use it for this purpose. This is demonstrated
    below:


    ```

    **FileStream FS = new FileStream("names.txt", FileMode.Open, FileAccess.Read,
    FileShare.Read);**

    ```


    The FileMode is an enumerator that defines a number of methods that can be used
    for opening files. These methods include the following:


    +   - Append – this method opens an existing file then puts the cursor at the
    end of the file, or it creates a new file if the specified file doesn’t exist.

    +   - Create – for creating a new file.

    +   - CreateNew – It instructs the operating system to create a new file.

    +   - Open – for opening an existing file.

    +   - OpenOrCreate – It instructs the operating system to open a file if it is
    in existence or create a new file if it doesn’t exist.

    +   - Truncate – for opening an existing file and truncating its size to zero
    bytes.


    The FileAccess is an enumerator that comes with a number of methods including
    Read, Write and ReadWrite.


    The FileShare enumerator comes with the following members:


    +   - Inheritable – helps a file handle in passing inheritance to child processes.

    +   - None – It disables sharing of the current file.

    +   - Read – It opens a file for reading.'
