    \n## 结构体的特性\n\n到目前为止，你已经了解了如何使用结构体及其一些特性。C# 中的结构体与 C 和 C++ 支持的结构体有很大不同。C# 结构体具有以下描述的特性：\n\
    \n- 结构体可以包含字段、索引器、方法、属性、运算符和事件。\n- 结构体可以定义构造函数，但不能定义析构函数。但是，在结构体中，不允许定义默认构造函数。原因是默认构造函数是自动定义的，并且无法更改。\n\
    - 结构体不能继承另一个结构体或类。\n- 使用结构体，我们可以实现一个或多个接口。\n- 结构体的成员不能指定为 virtual、abstract 或 protected。\n\
    - 通过 *New* 关键字创建 Struct 对象后，将创建该结构体对象并调用必要的构造函数。与类不同，我们可以在不使用 *New* 关键字的情况下实例化结构体。\n\
    - 如果我们不使用 *New* 运算符，字段将不会被赋值，并且在为所有字段完成赋值之前，将无法使用该对象。\n\n## 结构体与类\n\n以下是结构体与类之间的区别：\n\
    \n- 结构体被解释为值类型。另一方面，类被定义为引用类型。\n- 结构体不支持继承。类支持。\n- 结构体不能有默认构造函数。类可以有。\n\n让我们创建一个与上述区别相关的示例：\n\
    \n```csharp\nusing System;\n\nstruct Cars {\n    private string model;\n    private\
    \ int cc;\n    private int passengers;\n    private int year;\n\n    public void\
    \ getValues(string m, int c, int p, int yr) {\n        model = m;\n        cc\
    \ = c;\n        passengers = p;\n        year = yr;\n    }\n\n    public void\
    \ show() {\n        Console.WriteLine(\"Car model : {0}\", model);\n        Console.WriteLine(\"\
    CC : {0}\", cc);\n        Console.WriteLine(\"Passengers : {0}\", passengers);\n\
    \        Console.WriteLine(\"Year :{0}\", year);\n    }\n};\npublic class myStructure\
    \ {\n    public static void Main(string[] args) {\n        Cars Premio = new Cars();\
    \  /* Declare Premio of type Cars */\n        Cars X6 = new Cars();      /* Declare\
