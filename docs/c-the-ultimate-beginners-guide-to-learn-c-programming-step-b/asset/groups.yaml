  - '[PAGE 11]


    # Environment


    As seen, C# was designed to be integrated with Microsoft and .Net Framework by
    the developers. As one would guess, this is a large influence on the environment
    you find within C#. An important part of understanding C# comes from the understanding
    you have of how the two interact with each other. First, here is a brief synopsis
    of .Net framework to help you better understand how the two interact.


    As the latter part of the name framework suggests, the .Net framework is a platform
    in which one can run applications. The .Net framework is a platform for software
    development developed by Microsoft. The framework was created for development
    of applications that can run on the Windows platform. The first version was announced
    in 2002 and given the name .Net framework 1.0. Since then, a lot of updates have
    been made on the framework up-to-date.


    We can use the .Net Framework for creation of both web-based and form-based applications.
    We can also use it to develop web services. Other than C#, the .Net framework
    also supports the visual basic programming language. This means that the programmer
    has the option of choosing the language in which to develop their application
    in.


    There are three different types of applications that the framework can assist
    you with writing—web services, web applications and windows applications. When
    one is using the framework applications, it can actually be used by a variety
    of programming languages, as it is a multi-platform application. The multitude
    of languages, from Virtual Basic, Jscript, C++ and COBOL, also have the ability
    to communicate with each other within the framework. Another great attribute of
    this framework is the extensive code library that can be used by a language, for
    our purpose we will be talking about C#.


    One of the great things about any language or framework is the potential for a
    library of codes you can utilize. For the .Net framework and C#, there is a huge
    library that you can access and utilize for your coding projects. One advisory
    statement I always give people is that although these libraries are excellent
    resources, be sure you understand the hows and whys of the coding itself to ensure
    that you are able to fix an issue, should it arise.


    Microsoft itself also offers a great tool for its users in order to assist their
    development in their C# programming projects.'
  - '[PAGE 12]


    There are two excellent ones that the company even offers for free, great resources
    for writing any kind of application, from simple to complex. The names of the
    two I would recommend (because of their free price!) are Visual C# 2010 Express
    and Visual Web Developer.


    If these options are not something you feel comfortable with or enjoy using, you
    can always use a text editor in order to write the source code you may need. I
    recommend the other options because I find them to be a step up in helpfulness
    from a simple code editor. However, lots of people prefer that method—it’s really
    up to you and the comfort level you feel with a program. Test them out and see
    which methodology works better for you.


    You can download the two Microsoft programs I spoke up from a website called Microsoft
    Visual Studio.


    Finally, you can also run C# on Linux or Mac OS, which is a great ability to code
    across different platforms. However, in order to do so, you obviously need a non-Microsoft
    framework to do so on your different operating system. I recommend “mono”—which
    is an open source option for use on both Linux and Mac.


    With the basics of the environment, go download or open the programs you would
    like to get familiar with to start your coding process. Play around with the software—or
    you can sleep on your new knowledge and you can pick up your project for the next
    phase!


    # IDE (Integrated Development Environment)


    An IDE is a program that allows you to write your program. Most .Net developers
    prefer using Visual Studio Community as the IDE. It allows you to create, debug
    and run your applications. This IDE can be used for development of both web-based
    and form-based applications. To use this IDE, you must download and install it
    on your computer. You can find it in the URL given below:


    https://www.visualstudio.com/downloads/


    You are allowed to choose between the Visual Studio Community Forum, which is
    free, and Visual Studio Professional Edition, which comes with a 30 day trial
    period, and after the expiry of that period, you must pay for it.


    Once the download is complete, double click the setup file to begin the installation
    of visual studio. Follow the on-screen instructions until the installation of
    visual studio is complete.


    After that, you will be ready to start creating your own C# applications.'
