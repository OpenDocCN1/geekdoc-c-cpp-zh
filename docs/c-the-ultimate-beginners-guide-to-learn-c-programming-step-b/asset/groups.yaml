    This class helps us to read data from a text file. This class inherits the Stream
    base class. It also inherits the TextReader class, an abstract base class for
    reading a series of characters. The following are the popular methods provided
    by this class:


    +   - `public override void Close()`- this method closes the StreamReader object
    and the stream, then any system resources that were being used by the reader are
    released.

    +   - `public override int Peek()`- this method will return the next character
    that is available without consuming it.'
