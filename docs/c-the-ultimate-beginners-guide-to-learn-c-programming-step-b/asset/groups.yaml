    # Chapter 9: C# Methods


    This chapter will focus on the C# methods. Here, you’ll learn how to declare and
    utilize methods in your own programs. You need to memorize the lessons contained
    in this chapter to be an effective C# programmer.


    # Methods – The Basics


    For most programmers, methods are core aspects of any program. Methods can solve
    problems, accept user inputs (known as parameters), and produce results.


    A method is simply a group of statements that have been put together to perform
    a common task. Every C# class has at least one method, which is the Main method.
    For you to be able to use a method, you must define it, and then call it to perform
    the action it was intended to perform. Methods complete their tasks by representing
    the data conversions done by the program. Additionally, methods are the areas
    where the actual processes are completed. This is the main reason why C# programmers
    consider methods as the basic units of any computer program.


    # The Benefits Offered by Methods


    In this section, you’ll discover the major benefits offered by C# methods. After
    reading this material, you’ll know why you should use these tools in writing your
    programs.


    # *Better Structure and Code Readability*


    Programming experts claim that you should use methods while writing computer programs.
    Methods, even the simplest ones, can improve the structure and readability of
    your C# codes.


    Here’s an important fact that you need to know: programmers spend 20% of their
    time on writing and checking their computer program. The remaining 80% is spent
    on maintaining and improving the software. Obviously, you’ll have an easy time
    working on your program if your codes are readable and well-structured.


    # *Prevention of Redundant Codes*


    Methods can help you avoid redundant codes in your programs. Redundant or duplicated
    codes often produce undesirable results in computer applications.'
