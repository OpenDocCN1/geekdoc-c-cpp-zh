    \ = {10, 20, 30, 40};\n    }\n}\n```\n\n首先，我们声明了一个用于存储4个整数的数组。注意，数组大小是在方括号内指定的。在第二个语句中，我们也做了同样的事情，但在花括号{}内为索引分配了值。在第三个语句中，我们声明了一个数组并为其赋值，但未指定其大小。\n\
    \n### 延迟初始化\n\n我们可以在声明数组之后再对其进行初始化。这意味着我们不必同时完成数组的声明和初始化。下面是一个示例：\n\n```csharp\n\
