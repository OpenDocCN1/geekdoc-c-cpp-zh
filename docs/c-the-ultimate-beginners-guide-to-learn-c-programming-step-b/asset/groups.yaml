    \ 这样的语言，我们在个人和商业生活中都不可能拥有如此惊人的技术。\n\n当你思考编程这样的技术技能在你的生活中创造的机会时，我相信它是一项无价的技能。了解计算机系统设置的最基础知识，可以在职业意义上为你打开大门，带来更复杂和高薪的工作。\n\
