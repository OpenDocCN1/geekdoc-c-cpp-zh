    \ method is used to destroy the thread. The **ThreadAbortException** is thrown\
    \ when the thread is destroyed. The exception is caught and control is sent to\
    \ the **finally** block.\n\n### Example\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace ThreadDemo\n{\n    class Program\n    {\n        public static void\
    \ ChildThread()\n        {\n            try\n            {\n                Console.WriteLine(\"\
    Child Thread started\");\n                for (int j = 0; j <= 10; j++)\n    \
    \            {\n                    Thread.Sleep(1000);\n                    Console.WriteLine(j);\n\
    \                }\n            }\n            catch (ThreadAbortException e)\n\
    \            {\n                Console.WriteLine(\"Exception caught\");\n   \
    \         }\n            finally\n            {\n                Console.WriteLine(\"\
    Exception is not handled\");\n            }\n        }\n\n        public static\
    \ void Main()\n        {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\" Creating child thread\");\n            Thread\
    \ t2 = new Thread(t1);\n            t2.Start();\n\n            // main thread\
    \ is stopped\n            Thread.Sleep(2000);\n\n            // child thread aborted\n\
    \            Console.WriteLine(\" Aborting child thread \");\n            t2.Abort();\n\
    \            Console.Read();\n        }\n    }\n}\n```\n\n**On compiling and executing\
    \ the code, the output is:**\n\n```\nCreating child thread\n\nChild Thread started\n\
    \n0\n\n1\n\nAborting child thread\n\nException caught\n\nException is not handled\n\
    ```\n\n## Chapter 21: Event\n\nAn event is something that is expected to happen.\
    \ In C#, events are user actions like click, key press, mouse movements or occurrences\
    \ such as system-generated notifications[52]. An application should respond to\
    \ events once they occur. A good example is the occurrence of an interrupt. Events\
    \ are used to facilitate inter-process communications.\n\nEvents are declared\
    \ in a class and associated with an event handler via delegates in the same class\
    \ or in another class. The class with the event is used for publishing the event.\
    \ Such is known as the *publisher* class. The class accepting the event is known\
    \ as the *subscriber* class. This means that events rely on a publisher-subscriber\
    \ model.\n\nThe *publisher* is the object with the definition of both the event\
    \ and the delegate. The association between the event and the delegate is defined\
    \ in this object. An object of the publisher class invokes the event which is\
    \ in turn notified to the other objects.\n\nThe *subscriber* is the object that\
    \ accepts the event and offers the event handler. The publisher class has a delegate\
    \ that invokes the method (event handler) of the subscriber class.\n\n### Event\
    \ Declaration\n\nFor an event to be declared inside a class, you should first\
    \ declare a delegate type for the event. It is after this that you can declare\
    \ the event using the *event* keyword[53]. Here is an example:\n\n```csharp\n\
    public delegate void myEvent();\npublic event myEvent myEvent;\n```\n\nThus, we\
    \ have used the *event* keyword to make it an event. Here is a complete example:\n\
    \n```csharp\nusing System;\n\npublic class DisplayHelper\n{\n    // declare the\
    \ delegate\n    public delegate void BeforeDisplay();\n\n    // declare an event\
    \ of type delegate\n    public event BeforeDisplay beforeDisplayEvent;\n\n   \
    \ public DisplayHelper()\n    {\n\n    }\n\n    public void DisplayNumber(int\
    \ x)\n    {\n        // call the delegate method before moving to display\n  \
    \      if (beforeDisplayEvent != null)\n            beforeDisplayEvent();\n\n\
    \        Console.WriteLine(\"Number: {0,-12:N0}\", x);\n    }\n\n    public void\
