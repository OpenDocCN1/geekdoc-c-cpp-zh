    # **Using Type Inference**


    C# 3.0 introduced the implicitly typed variable with the **var** keyword. Now
    you can declare a local variable without giving an explicit or real type. The
    variable still receives a type at compile time, but the type is provided by the
    compiler.


    Actually, the **var** keyword instructs the compiler to infer the type of variable
    from the expression on the right side of the initialization statement. The compiler
    is given the task to determine and assign the suitable type.


    ```

    var variableName = variableValue; // Syntax

    ```


    **var** is optional, and it’s just for convenience.


    Let’s use the same variables as above.


    ```

    var name = "Pirzada"; var age = 35; var weight = 70; var isMarried = true;

    ```


    Now the variables are **implicitly typed local** variables, meaning that you don’t
    have to explicitly specify the type. The compiler is tasked to determine and assign
    the suitable type. A **string** variable is indicated by double quotes, **char**
    variable is denoted by single quotes, and a **bool** type is denoted by true and
    false values.


    **Suggestion:** Using **var** is convenient, but use it only when the type is
    obvious from the right side of the assignment.


    **Double** is used to denote a literal number with a decimal point unless you
    add the **M/m** suffix to indicate a **decimal** variable or the **F/f** suffix
    to indicate **float** variable.


    ```

    var value = 24899.45m; var number = 20.8f;

    ```


    To initialize **number**, you need to add f as a suffix after 20.8 to explicitly
    tell the compiler to change 20.8 to a float. Similarly, to initialize **value**,
    you need to add m as a suffix to change 24899.45 into a **decimal** type.


    A few rules you need to follow:


    +   - **var** can only be declared and initialized in a single statement. Otherwise,
    the compiler doesn’t have anything from which to infer the type.


    +   - **var** is not supposed to be utilized on fields at class scope.'
