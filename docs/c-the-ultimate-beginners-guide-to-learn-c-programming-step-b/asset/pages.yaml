- pgno: 154
  md: "It is possible for a delegate to point to multiple functions. Any delegate\
    \ that points to many functions is referred to as a *multicast delegate*. Use\
    \ the + operator to add a function to a delegate object and the − operator to\
    \ remove an existing function from a delegate object.\n\nConsider the example\
    \ given below:\n\n```\n```csharp\nusing System;\n\npublic class MyProgram\n{\n\
    \    public delegate void Display(int value);\n\n    public static void Main()\n\
    \    {\n        Display displayDel = DisplayNumber;\n        displayDel += DisplayHexadecimal;\n\
    \        displayDel += DisplayMoney;\n\n        displayDel(1000);\n        displayDel\
    \ -= DisplayHexadecimal;\n        displayDel(2000);\n    }\n\n    public static\
    \ void DisplayNumber(int x)\n    {\n        Console.WriteLine(\"Number: {0,-12:N0}\"\
    , x);\n    }\n\n    public static void DisplayMoney(int amount)\n    {\n     \
    \   Console.WriteLine(\"Money: {0:C}\", amount);\n```\n```"
  merge: -1
