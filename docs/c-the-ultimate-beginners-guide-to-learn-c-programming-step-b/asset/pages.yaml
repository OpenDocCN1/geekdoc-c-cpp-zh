  md: "# Chapter 19: Delegates\n\nWe can have a function with more than one parameters\
    \ from different data types. However, we may sometimes need to pass a certain\
    \ function as a parameter. How can C# handle the event handler or callback functions?\
    \ This is done via delegates<sup>[46]</sup>.\n\nA delegate is taken as a pointer\
    \ to a function. It is a reference data type that holds reference of a method.\
    \ All delegates are derived from *System.Delegate* class implicitly. We use delegates\
    \ to implement events and callback methods<sup>[47]</sup>.\n\n# Declaring a Delegate\n\
    \nThe way we declare a delegate determine the methods that the delegate can reference.\
    \ A delegate may refer to a method, which has the same signature as the delegate<sup>[48]</sup>.\
    \ We use the delegate keyword to declare a delegate. The following syntax is used\
    \ for the declaration:\n\n```\n```csharp\n<access modifier> delegate <return type><delegate_name>(<parameters>)\n\
    ```\n```\n\n**Here is an example:**\n\n```\n```csharp\npublic delegate void Display(int\
    \ value);\n```\n```\n\nAbove, we have declared a *Display* delegate. We can use\
    \ this delegate to point to a method with same return type and parameters that\
    \ have been declared with the *Display* delegate.\n\nConsider the example given\
    \ below:\n\n```\n```csharp\nusing System;\n\npublic class MyProgram\n{\n    public\
    \ delegate void Display(int num);\n\n    public static void Main()\n    {\n  \
    \      // Display delegate points to the DisplayNumber\n        Display displayDel\
    \ = DisplayNumber;\n```\n```"
  merge: -1
  img_proc: true
