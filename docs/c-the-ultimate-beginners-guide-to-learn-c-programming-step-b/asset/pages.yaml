    \ as the result:\n\n```\n```\nNumber: 1,000\nHexadecimal: 3E8\nMoney: $1,000.00\n\
    Number: 2,000\nMoney: $2,000.00\n```\n```\n\nIn the above example, we have the\
    \ Display pointing to three methods namely DisplayNumber, DisplayMoney and DisplayHexadecimal.\
    \ This makes it a multicast delegate. This means that when the displayDel is invoked,\
    \ it will, in turn, invoke all the three methods sequentially."
