  md: "# Program Structure and Basic Syntax\n\nNow that we have established a little\
    \ about how the environment was created for C#, let’s look at the actual structure\
    \ and how you will interact with programs through the syntax of C#.\n\nWhen we\
    \ are looking at how C# is structured, we are looking at 7 basic components that\
    \ make up the program. These are that there are class methods and attributes,\
    \ namespace declaration, a class, a main method, comments and statements and expressions.\
    \ Now, what do these look like for you in terms of your programming and coding?\
    \ Why don’t we take this “Hello World” example and break it down into parts to\
    \ see this in action.\n\n```\nusing System[2];\n\nnamespace HelloWorldApplication\n\
    {\n    class HelloWorld\n    {\n        static void Main(string[ ] args )\n  \
    \      {\n            /* my first program working with the wonderful C# */\n \
    \           Console.WriteLine(\"Hello World\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```"
