    ```\n`Display displayDel = new Display (DisplayNumber);`\n```\n\n# ### Invoking\
    \ a Delegate\n\nA delegate is a reference to a method; hence we can invoke it\
    \ simply like a method. When a delegate is invoked, the method that is referred\
    \ to will, in turn, be invoked.\n\nThere are two ways through which we can invoke\
    \ a delegate: using the () operator or using *Invoke()* method of delegate. Let\
    \ us demonstrate this using an example:\n\n```\n    Display displayDel = DisplayNumber;\n\
    \    displayDel.Invoke(5000);\n\n    //or\n    printDel(10000);\n```\n\nThe two\
    \ ways that we can use to invoke a delegate have been shown above.\n\n# ### Passing\
    \ a Delegate as a Parameter\n\nA method may have a parameter of delegate type\
    \ and it can invoke the delegate parameter. Here is an example of a delegate parameter:\n\
    \n```\n    public static void DisplayHelper(Display delegateFunc, int numToDisplay)\n\
    \    {\n        delegateFunc(numToDisplay);\n    }\n```\n\nIn the example given\
    \ above, the DisplayHelper function has a delegate parameter of Display type and\
    \ it has been invoked as a function using the statement given below:\n\n```\n\
    \    delegateFunc(numToDisplay);\n```\n\nLet us give another example demonstrating\
    \ how to use the *DisplayHelper* method and a delegate type parameter:\n\n```\n\
    \    using System;\n\n    public class MyProgram\n```"
