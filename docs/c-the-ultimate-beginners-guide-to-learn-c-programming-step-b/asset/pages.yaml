  md: "# # Chapter 15: Polymorphism\n\nPolymorphism[37] is a term that means taking\
    \ many forms. In programming, it is expressed as **“one interface, many functions”**.\
    \ Polymorphism can take two forms, static or dynamic.\n\nFor the case of static\
    \ dynamism, response to the function is determined during compile time. In dynamic\
    \ polymorphism, response to the function is determined during runtime.\n\n# ##\
    \ Static Polymorphism\n\nAs stated above, the response to a function in this type\
    \ of polymorphism is determined during compile time. The process of linking a\
    \ function to an object during compile time is known as *early binding*. It is\
    \ also known as *static binding*. In C#, static polymorphism can be implemented\
    \ in two ways:\n\n+   - Function overloading\n+   - Operator overloading\n\n#\
    \ ## Function Overloading\n\nIt is possible for us to have multiple definitions\
    \ for the same function name within one scope. The differences between these functions\
    \ are implemented by types or the number of arguments that the functions take.\
    \ Function declarations cannot be overloaded by differing the return types only.\n\
    \n**The following example demonstrates how to overload a function in C#:**\n\n\
    ```\n```csharp\nusing System;\n\nnamespace PolymorphismApp {\n    class DisplayData\
    \ {\n        void display(int x) {\n            Console.WriteLine(\"Printing an\
    \ int value: {0}\", x );\n        }\n\n        void display(double y) {\n```\n\
    ```"
