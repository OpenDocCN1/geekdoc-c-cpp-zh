  md: "# # Chapter 8: Loops\n\nAs a programmer, you’ll use a loop statement to run\
    \ certain code blocks repeatedly. Loops play an important part in C# programming.\
    \ Hence, you should study this material carefully as well if you want to master\
    \ this language in a short while.\n\n# ## Loops – The Basics\n\nWhile creating\
    \ programs, you often need to execute code sequences multiple times. Typing the\
    \ same blocks of code several times can be extremely boring. Thus, you need to\
    \ find a quick and simple way to repeat codes. Fortunately, the C# language supports\
    \ loop statements.\n\nA loop is a tool that runs code fragments repeatedly. You\
    \ can use it to run codes for a certain number of times or as long as a given\
    \ condition is fulfilled. C# offers different types of loop statements. Let’s\
    \ analyze each type in detail:\n\n# ## The While Loop[47]\n\nThis is the simplest\
    \ loop statement in C#. Its syntax is:\n\n```\n```\nwhile (the_assigned_condition)\n\
    {\n    the_loop’s_body;\n}\n```\n```\n\nIn this syntax, “the_assigned_condition”\
    \ is an expression that produces a Boolean value. This condition dictates how\
    \ many times the “body” will run. The “body”, on the other hand, is the statement\
    \ (or group of statements) that you want to execute.\n\nThe diagram given below\
    \ will illustrate how while loops work:\n\n![](img/9196118a802f2581793dbd40a99c7360_61_0.png)\n\
    \nWhen working on a “while” loop, a C# program checks the value of the Boolean"
  merge: -1
  img_proc: true
- pgno: 62
  md: "expression. If the value is “true”, the program will run all of the statements\
    \ within the loop’s body. Then, the program will check the Boolean expression\
    \ to see its value. If the value is still true, the program will rerun the loop’s\
    \ body and go back to the first step (i.e. check the expression’s value). This\
    \ process will go on until the Boolean expression evaluates to false. Once this\
    \ happens, the program will process the code blocks right after the loop.\n\n\
    Important Note: Your C# program won’t run the while loop’s body if the Boolean\
    \ expression is false. Thus, if the Boolean value is false when you launched the\
    \ program, your in-loop statements will never be executed.\n\nThe following example\
    \ will illustrate how while loops work:\n\n```\n```csharp\nint timer = 10;\n\n\
    while (timer >= 0)\n{\n    System.Console.WriteLine(\"Time remaining: \" + timer);\n\
    \n    timer--;\n}\n```\n```\n\nIf you will compile and execute this code, your\
    \ command prompt will print this data:\n\n```\n```text\nTime remaining: 10\nTime\
    \ remaining: 9\nTime remaining: 8\nTime remaining: 7\nTime remaining: 6\nTime\
    \ remaining: 5\nTime remaining: 4\nTime remaining: 3\nTime remaining: 2\nTime\
    \ remaining: 1\nTime remaining: 0\n```\n```\n\n# The Break Operator\n\nYou can\
    \ use “break” (a C# operator) to exit a loop prematurely. Programmers use this\
    \ operator if they don’t want to wait for the loop’s natural termination. Basically,\
    \ a loop will end once it encounters a break operator. This situation forces the\
    \ program to"
