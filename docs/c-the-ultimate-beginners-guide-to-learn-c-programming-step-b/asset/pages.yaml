  md: '# # Chapter 18: File I/O[40]


    A file is characterized by a name and a directory path. Once you open a file,
    it becomes a *stream*. Files are normally opened for reading or writing purposes.


    The stream is simply the sequence of bytes that pass through the communication
    path. Streams are of two types:


    +   - Input stream

    +   - Output stream


    The input stream helps us to read data from a file, that is, a read operation,
    while the output stream helps us to write data into a file, that is, a write operation.


    # ## Input/ Output Classes


    C# provides us with a number of classes that we can use for working with files.
    These classes can be used for accessing directories, files, creating new files,
    opening existing files and moving files from one directory to another. These classes
    are defined in the System.IO class. Let us discuss some of these classes:


    +   - **BinaryReader**- this class helps us in reading primitive data from a binary
    stream.

    +   - **BinaryWriter**- this class helps us in writing primitive data in a binary
    format.

    +   - **BufferedStream**- this acts as a temporary storage for bytes of streams.

    +   - **Directory**- this class helps us to manipulate the structure of a directory.

    +   - **DriveInfo**- this class provides us with information about the drives.

    +   - **File**- this class is used for manipulation of files.

    +   - **FileInfo**- helps in performing operations on files.

    +   - **FileStream**- used for writing and reading from any location in a file.

    +   - **MemoryStream**- helps in randomly accessing data kept in a memory.

    +   - **Path**- for performing operations on path information.

    +   - **StreamReader**- reads characters from a stream of bytes.

    +   - **StreamWriter**- writes characters to a stream.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   - StringReader- reads from a string buffer.

    +   - StringWriter- writes into a string buffer.


    # FileStream Class


    This class is defined in the System.IO namespace and it helps us to read from
    and write to files. We can also use it to close files<sup>[41]</sup>.


    For you to be able to use this class, you have to create its object. This instance
    can then be used for creating new files and opening existing files. Here is how
    you can create an instance of the FileStream class:


    ```

    **FileStream <object> = new FileStream( <file>, <FileMode Enumerator>,**

    **<FileAccess Enumerator>, <FileShare Enumerator>);**

    ```


    For example, suppose we need to read a file names *names.txt*. We can create a
    FileStream object named *FS* and use it for this purpose. This is demonstrated
    below:


    ```

    **FileStream FS = new FileStream("names.txt", FileMode.Open, FileAccess.Read,
    FileShare.Read);**

    ```


    The FileMode is an enumerator that defines a number of methods that can be used
    for opening files. These methods include the following:


    +   - Append – this method opens an existing file then puts the cursor at the
    end of the file, or it creates a new file if the specified file doesn’t exist.

    +   - Create – for creating a new file.

    +   - CreateNew – It instructs the operating system to create a new file.

    +   - Open – for opening an existing file.

    +   - OpenOrCreate – It instructs the operating system to open a file if it is
    in existence or create a new file if it doesn’t exist.

    +   - Truncate – for opening an existing file and truncating its size to zero
    bytes.


    The FileAccess is an enumerator that comes with a number of methods including
    Read, Write and ReadWrite.


    The FileShare enumerator comes with the following members:


    +   - Inheritable – helps a file handle in passing inheritance to child processes.

    +   - None – It disables sharing of the current file.

    +   - Read – It opens a file for reading.'
