  md: "# # Chapter 13: Encapsulation\n\nEncapsulation is the process of enclosing\
    \ items within a logical or physical package. In object-oriented programming,\
    \ encapsulation is used to prevent access to the implementation details.\n\nEncapsulation\
    \ and Abstraction are closely related features in object-oriented programming.\
    \ The purpose of abstraction is to make the relevant details visible to users\
    \ while the purpose of encapsulation is to enable a programmer to implement the\
    \ required level of abstraction.\n\nTo implement encapsulation[35], we use *access\
    \ specifiers*. The role of an access specifier is to state the visibility and\
    \ scope of a class member. There are different types of access specifiers that\
    \ are supported in C#. They include the following:\n\n+   - Public\n+   - Protected\n\
    +   - Private\n+   - Protected internal\n+   - Internal\n\n# ## Private Access\
    \ Specifier\n\nWith a private access specifier, a class is able to hide its member\
    \ functions and member variables from other objects and functions. Only functions\
    \ of a similar class are able to access its private members. An instance of the\
    \ class is not able to access the private members of the class. Consider the example\
    \ given below:\n\n```\n```csharp\nusing System;\n\nnamespace AccessApplication\
    \ {\n    class Figure {\n        // The class member variables\n        private\
    \ double width;\n        private double length;\n        public void GetDetails()\
    \ {\n```\n```"
