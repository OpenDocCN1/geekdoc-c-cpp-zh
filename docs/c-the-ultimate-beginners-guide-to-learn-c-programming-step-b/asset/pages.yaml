  md: 'Otherwise, it will tell you the statement is false. For example, saying that
    e >= d evaluates as true.


    +   - “<=” – This operator will give you true if the value of the left-hand operand
    is less than or equal to that of the right-hand operand.

    +   - “!=” – The function of this operator is to allow you to test the inequality
    of two values/operands. If the values end up not being equal, it will tell you
    this is true. For example, e != d would result in the operator saying it’s true.


    When you are working with these relational operators, always remember that you
    will get a Boolean result each time. What this means is that the answer you get
    will be either true or false. You also have to check if you are using two equal
    signs when you are working with the equality operator. If you end up getting these
    operators mixed up with your assignment operator, you will probably get an error
    message, and that program will not work out the way that you want.


    # Conditional Operator


    C# users refer to “?” as the conditional operator. Basically, this operator uses
    the result of a Boolean expression to determine which statement should be processed.
    This is called “ternary operator” because it works on three operands. Here, the
    first value should be Boolean, while the remaining values need to belong to the
    same data type (e.g. characters, strings, numbers, etc.).


    The syntax of this operator is:


    ```

    first_operand ? second_operand : third_operand;

    ```


    Here’s how it works: If “first_operand” is true, the program will work on “second_operand”.
    If “first_operand” is false, however, the program will work on “third_operand”.'
