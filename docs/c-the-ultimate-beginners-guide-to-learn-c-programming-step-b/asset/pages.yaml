    # IDE (Integrated Development Environment)


    An IDE is a program that allows you to write your program. Most .Net developers
    prefer using Visual Studio Community as the IDE. It allows you to create, debug
    and run your applications. This IDE can be used for development of both web-based
    and form-based applications. To use this IDE, you must download and install it
    on your computer. You can find it in the URL given below:


    https://www.visualstudio.com/downloads/


    You are allowed to choose between the Visual Studio Community Forum, which is
    free, and Visual Studio Professional Edition, which comes with a 30 day trial
    period, and after the expiry of that period, you must pay for it.


    Once the download is complete, double click the setup file to begin the installation
    of visual studio. Follow the on-screen instructions until the installation of
    visual studio is complete.


    After that, you will be ready to start creating your own C# applications.'
