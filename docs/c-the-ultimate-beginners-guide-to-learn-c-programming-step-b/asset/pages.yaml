    uses “void” as its return type since it doesn’t generate any result. The word
    “Main” serves as its name. The parentheses, on the other hand, act as containers
    for the parameters that the programmer will provide.


    Important Note: You have to follow this syntax when writing a C# program. Don’t
    change the placement of the method’s parts.


    C# doesn’t require you to include parameters in your declarations. That means
    you can leave the parentheses empty (e.g. Main()).


    # _The Method’s Name_


    You need to indicate the method’s name during declarations, invocations, or implementations.
    Here are the rules that you need to remember when naming your methods:


    +   - Make sure that the initial letter is in uppercase.

    +   - Begin each word with an uppercase letter (e.g. SampleMethod, NewMethod,
    MainLine, etc.).

    +   - Use verbs and nouns as names of your methods.


    Important Note: The rules discussed above are completely optional. Follow these
    rules if you want to have excellent structure and readability in your C# codes.


