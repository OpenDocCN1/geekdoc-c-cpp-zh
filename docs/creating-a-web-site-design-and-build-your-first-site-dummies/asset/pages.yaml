- pgno: 114
  md: "# 数字图像处理与分析\n\n# 图像分割（1）\n\n# 阈值化分割\n\n阈值化分割作为最经典的图像分割方法，其基本思想是确定一个阈值，然后根据该阈值将图像中的每个像素划分为目标或背景。阈值化分割方法计算简单、效率高，在图像分割领域占有重要地位。\n\
    \n# 阈值化分割的基本原理\n\n阈值化分割的基本原理是依据一定的准则，将图像的灰度值划分为不同的集合。对于一幅灰度图像 f(x, y)，若选择一个阈值\
    \ T，则分割后的图像 g(x, y) 可表示为：\n\n```\ng(x, y) = 1,  f(x, y) > T\n           = 0, \
    \ f(x, y) ≤ T\n```\n\n其中，f(x, y) 为输入图像，g(x, y) 为输出二值图像，T 为阈值。阈值 T 的选择是阈值化分割的关键，通常可以表示为：\n\
    \n```\nT = T[x, y, p(x, y), f(x, y)]\n```"
  merge: -1
  img_proc: true
