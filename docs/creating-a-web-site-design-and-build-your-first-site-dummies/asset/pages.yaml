- pgno: 25
  md: '# # PROJECT 2 CREATE A SITE MAP


    ![](img/b129720fc9ac9e14546b8756740d362a_25_0.png)


    Great! Now you have a basic site map that contains pages in the order of parent,
    child, and grandchild (hierarchical) order.


    Continue to repeat Steps 1–6 for each page you want to create for your topic.
    When you finish, you might have a site map that looks similar to the following:


    ![](img/b129720fc9ac9e14546b8756740d362a_25_1.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: "Be patient! It may take a little while to get everything just right, but when\
    \ you're done, you'll have a clear direction on how your content should be displayed.\
    \ This process helps you stay focused when you work through the other projects\
    \ in this book.\n\n# ## DRAW A SITE MAP USING A PENCIL AND PAPER\n\nDrawing a\
    \ site map on paper rather than in Google Drawings is perfectly okay, too! In\
    \ fact, you might find it easier to draw it out on paper first and then make a\
    \ digital copy for easy reference later.\n\n+   1. Find a blank piece of paper\
    \ and a pencil.\n+   2. Turn the paper sideways.\n+   3. At the top, write the\
    \ name of your web site.\n+   \n+      *For this project's example, it's Dinosaur\
    \ Website Site Map.*\n+   4. Draw a rectangular content bubble shape near the\
    \ top and in the middle.\n+   5. Write **Home Page** in the middle of the content\
    \ bubble.\n+   6. Draw another content bubble directly below, leaving just enough\
    \ space to draw a straight line.\n+   7. Write the name of your first child page.\n\
    +   \n+      *For this project's example, one is Types of Dinos.*\n+   8. Draw\
    \ a line from the Home Page bubble to the child page bubble."
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Awesome! You''ve certainly got the idea now! Repeat Steps 4–8 until you''ve
    drawn content bubbles for each of your pages.


    ![](img/b129720fc9ac9e14546b8756740d362a_27_0.png)


    By now, you should have a completed site map.


    You will need to reference this site map later on, so make sure to keep it handy.
    You can use a hand-drawn copy, a printed one, or a copy that you keep open in
    a browser tab from Google Drawings. Now that you have a site map, you are ready
    for Project 3! Excellent!'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # PROJECT 3: CREATE A WIREFRAME


    ![](img/b129720fc9ac9e14546b8756740d362a_28_0.png)


    ***YOU KNOW YOUR FINISHED WEB SITE IS GOING TO LOOK GREAT.*** *After all, with
    all your exciting graphics and videos, why wouldn''t it? To make sure that your
    web site lives up to your dreams and has room for all your content, you need to
    have a plan. In this project, you figure out the initial layout for your web site.*


    # ## *WHAT IS A WIREFRAME?*


    *A wireframe is like a blueprint for a web site. It helps you figure out just
    where to put all your content, graphics, videos, and other elements on a page.*'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Usually, wireframes are presented in two formats:


    +   - **Low-fidelity:** These wireframes are just rough sketches or doodles.

    +   - **High-fidelity:** These wireframes can represent the final design, showing
    each section in greater detail.


    Typically, a web site has a header, body, sidebar, and footer. The layout of a
    web site, of course, can be anything the web site creator wants it to be, but
    most people who look at web sites have come to expect content to be laid out as
    shown in the figure.


    When you create your wireframe, you may want to model this layout.


    ![](img/b129720fc9ac9e14546b8756740d362a_29_0.png)


    # ## THE BASICS: WHAT YOU NEED TO KNOW TO GET STARTED


    Before you dive in and create your web site, sketch a drawing of how you want
    your web site to look.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'You can draw your wireframe on paper or make one using your favorite drawing
    app, such as Google Drawings.


    Of course, the one shown here is just an example. You can draw your wireframe
    any way you want. Be as creative as you like!


    ![](img/b129720fc9ac9e14546b8756740d362a_30_0.png)


    > > *No matter how you decide to create your low-fidelity wireframe, keep in mind
    that you''re using straight lines and basic drawings for photos and videos. The
    goal is to imagine what your web site layout might be.*


    Right now, focus on where the logo, menu, body content, and footer are going to
    go. Don''t be afraid to scratch stuff out and start over. You don''t need to worry
    about colors or fonts in this project!


    # ## CREATE A LOW-FIDELITY WIREFRAME


    In Project 2, you learn how to make a site map with Google Drawings. In this project,
    you use the same tool to create your first wireframe.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'If you don''t have access to Google Drawings, you can still follow along. Just
    grab a pencil and paper and do each step on paper instead of the computer.


    > > It''s okay if the wireframe doesn''t look much like a web site. The goal is
    to simply get your ideas sketched out and then improve on them!


    For this project, you need to have your site map from Project 2. Open the site
