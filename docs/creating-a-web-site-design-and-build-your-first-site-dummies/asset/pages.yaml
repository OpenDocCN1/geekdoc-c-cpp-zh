  md: 'In this book, the two divs are meant to be side by side. But your divs don’t
    have to be like that; they could be one on top of the other. For example, this
    book names the classes for the divs “left” and “right,” but you could name yours
    “top” and “bottom.”


    You might notice that the left div, which has gave a background color of #ffffff
    (which is white) shows up, but the right div, which has gave a background color
    of #000000 (which is black), doesn’t. That’s because there is nothing in the right
    div!


