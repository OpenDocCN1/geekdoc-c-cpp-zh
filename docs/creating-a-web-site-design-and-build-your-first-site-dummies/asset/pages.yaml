    # ## ADDING MORE STRUCTURE TO YOUR WEB SITE


    Adding text to your web site is good, but you might want to add a little more
    structure to your web site, too. For example, in the wireframe example from Project
    3, there was a sidebar.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/b129720fc9ac9e14546b8756740d362a_76_0.png)


    To add a different part of your web site, like a sidebar, you have to create new
    sections inside the body tags called “divs.” The first div will go to the left
    and take up most of the screen, and the second div will go to the right and take
    up only a little of the screen. To create new divs, you use the open and close
    div tags: `<div> </div>`. Even if you do not want these divs to be next to each
    other, you might want to have different divs with different colors or content.


    Look through your wireframe from Project 3 and **put the text** (or placeholder
    text) in the correct places. For example, in the web site in this book, the text
    about dinosaurs is on the left of the web site. The first div that was made in
    this example will be the one on the left, so that’s why the dinosaur text is in
    the first div.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '```

    ~~~html

    <html>


    <head>

    <title>

    Chicken

    </title>

    <body>

    <h1>Chicken and Hen: up here</h1>

    <h2>Chicken and Hen: up here</h2>

    <h3>Chicken and Hen: up here</h3>

    <hr>

    <p>Text about my Dinosaur right here.</p>

    <hr>

    <p>Text about my Dinosaur right here.</p>

    <ul>

    <li>Eggs</li>

    <li>Milk</li>

    <li>Bread</li>

    </ul>


    </body>

    </html>

    ~~~

    ```


    # ## ADD STYLE ATTRIBUTES TO YOUR WEB SITE


    Next, you will add attributes to your div sections to change the color of them,
    making them easier to see them. Attributes can be a lot of different things in
    web sites. They can be colors, size, or even the font style!


    Look carefully through the code and add the following bits (see the next figure).


    ![](img/b129720fc9ac9e14546b8756740d362a_77_0.png)


    > > You have to type everything in code exactly as it is in the book. If you capitalize
    something that shouldn''t be capitalized, or add a space where there shouldn''t
    be a space, your web site won''t work. This is because computers, even though
    they are powerful, aren''t that smart! So they don''t know that the name Sarah
    is the same as sarah. To a computer, those two names are different because one
    has a capital S and the other has a lowercase s.


    The head part of your web site is where you put your style code. You might want
    to refer to your style guide from Project 4 for this part. The example in this
    book uses orange, blue, and yellow for the colors and sans serif for the font,
    so that''s what is shown here.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "+   1. Between the head tags, add an open and close style tag.\n\n```\n```html\n\
    <html>\n<head>\n  <style>\n  </style>\n</head>\n<body>\n  <header>Logo and Menu\
    \ up here</header>\n  <p>Text about my Dinosaurs right here.</p>\n  <footer>Footer\
    \ Down Here</footer>\n</body>\n</html>\n```\n```\n\n+   2. Between the style tags,\
    \ add a section called body. This section, instead of having the less-than and\
    \ greater-than tags, will have open and close curly braces. Everything inside\
    \ the body section will change what is in the body part in your code below.\n\n\
    ```\n```html\n<html>\n<head>\n  <style>\n    body {\n    }\n  </style>\n</head>\n\
    <body>\n  <header>Logo and Menu up here</header>\n  <p>Text about my Dinosaurs\
    \ right here.</p>\n  <footer>Footer Down Here</footer>\n</body>\n</html>\n```\n\
    ```\n\n+   3. Add the following line exactly as it is written. When you finish\
    \ typing it, your font will change!\n\n```\n```css\nbody {\n  font-family: \"\
    Open Sans\", sans-serif;\n}\n```\n```"
  merge: -1
  img_proc: true
