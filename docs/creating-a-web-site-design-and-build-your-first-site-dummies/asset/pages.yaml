    # ## FINDING AND USING MEDIA FROM THE WEB


    Creating your own media can be fun, but sometimes drawing a lifelike image of
    a T-rex, well, it just doesn’t make sense. Instead you could search for and use
    an image that someone else drew or photographed. This is a common practice and
    is referred to as using stock photography.


    You have to follow some basic rules when you use someone else’s images on your
    web site. The first rule is about the copyright (which I mention in this book’s
    introduction). To use an image on your web site that you did not create, you need
    to make sure that the following is true: The media is licensed as public domain
    (CC0). Public domain means that the image is free for you to use, and you don’t
    have to ask permission or say where the media came from. This is also called the
    Creative Commons license.


    ![](img/b129720fc9ac9e14546b8756740d362a_55_0.png)


    > If you’re not sure about licenses and what they mean, (it can be very confusing),
    you can read more about it at the Creative Commons (https://creativecommons.org/share-your-work/licensing-types-examples/).


    My favorite web site for finding creative commons photos is VisualHunt (https://visualhunt.com).
    VisualHunt searches hundreds of stock photos for you, making it easy to get just
    the right photo.


    # ## USING VISUALHUNT TO FIND FREE STOCK PHOTOS


    To finish up your style guide, you need to find a few images and place them into
    Frontify.'
