- pgno: 72
  md: '> > *If you want to learn more HTML beyond this book, you should check out
    html: www.w3schools.com. Here you will find all kinds of HTML tutorials and even
    be able to test your coding.*


    # ### THE HTML STRUCTURE


    HTML is a coding language called a markup language. It''s called a markup language
    because it is used to outline the page that you''re making for a web site. When
    you''re coding a web site, your code will always have the same basic structure.


    ![](img/b129720fc9ac9e14546b8756740d362a_72_0.png)


    Not only do coding languages have certain structures, but each language also has
    a different syntax. You already know a bit about syntax, because in English you
    put a period at the end of a sentence and a question mark at the end of a question.
    The period and question mark is part of the syntax of English.


    In HTML, there are a lot of greater-than and less-than signs in the syntax. But
    there is a pattern! Each section of an HTML file is surrounded by the name of
    the section in `<SectionName>` `</SectionName>`. We call the first part the open
    tag and the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'second one the close tag. Notice that the close tag has a / after the less-than
    symbol.


    +   1. Go to your Internet browser again. You should still have index.html open
    in HTML Editey. If you don’t, go to [http://drive.google.com](http://drive.google.com),
    double-click your project folder (like MyDinoSite), then right-click index.html
    and choose Open With HTML Editey.


    +   2. Add the **open tag** for the HTML section, and you will notice that the
    close tag automatically gets added.


    ![](img/b129720fc9ac9e14546b8756740d362a_73_0.png)


    +   3. Looking back at the HTML structure at the beginning of this section, make
    sure that the tags you add here (shown in the figure) are **inside the HTML tags.**


    ![](img/b129720fc9ac9e14546b8756740d362a_73_1.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Awesome! You are now ready to start adding content to your HTML page! This
