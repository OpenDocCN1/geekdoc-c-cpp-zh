- pgno: 17
  md: '# # PROJECT 1 CHOOSE A TOPIC


    ![](img/b129720fc9ac9e14546b8756740d362a_17_0.png)


    # ## DECIDE WHOM YOU WANT TO TALK TO


    Almost as important as the topic is deciding whom you want to reach as an audience.
    Do you want to create a web site for your family? Maybe classmates or teammates?
    If you''re writing content about dinosaurs for your classmates, think about how
    you would explain information to them in person.


    Talking to your friends about your topic can really help you narrow down your
    ideas. It can also help you come up with some of your content!


    If your topic interests only you, it is probably not worth writing about. A good
    web site keeps the reader in mind at all times. This often means choosing topics
    that haven''t been written about too much, and maybe choosing a more current topic.


    ![](img/b129720fc9ac9e14546b8756740d362a_17_1.png)


    > Don''t be afraid to ask an adult for help with ideas. Chances are, an adult
    you''re close to has had to find a topic for a school or college essay. I''m sure
    that an adult in your life would love to help you figure out your topic.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # PROJECT 2 CREATE A SITE MAP


    ![](img/b129720fc9ac9e14546b8756740d362a_18_0.png)


    **WHAT EXACTLY IS A SITE MAP?** Just as a regular ol'' map will help you find
    your way, a site map helps search engines, like Google, find their way around
    your web site. A site map can also be a document for displaying a list of pages
    in a web site. In this project, you will learn how to create a site map, which
    will help you think about how you want to structure your content.


    # ## DECIDE HOW YOU WANT TO LAY OUT YOUR CONTENT


    Now that you have a topic, it''s time to focus on how you want to lay it out.
    Web sites all have a home page, which is a great place to start your site map.
    For example, if you are creating a web site about dinosaurs, here are some pages
    and sections you might see:


    +   - Home Page

    +     - Dinosaur Timeline

    +       - Jurassic Area

    +       - Triassic Area'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - Dinosaur Types

    +     - Carnivore

    +     - Herbivore

    +     - Omnivore

    +   - Dinosaur Names

    +     - Stegosaurus

    +     - Tyrannosaurus


    Knowing how you want this content laid out before you start on the actual pages
    will really help!


    # CREATE A SITE MAP WITH GOOGLE DRAWINGS


    In the Introduction, I mention that you need to have a Google account. If you
    don''t have an account, grab an adult to help you log in to Google to create one.
    (By law, you must be at least 13 years old to create any online account.)


    > TIP: If you can''t use Google Drawings, follow along anyway. You can apply the
    same concepts by using a pencil and paper.


    # CREATE A NEW GOOGLE DRAWINGS DOCUMENT


    +   1. Open a web browser.

    +   2. In the address bar, type https://docs.google.com/drawings/ and press Enter.


    If you''re logged in to Google, you should see a screen similar to the one in
    the following figure.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/b129720fc9ac9e14546b8756740d362a_20_0.png)


    +   3. In the top left, click the words *Untitled drawing*.


    ![](img/b129720fc9ac9e14546b8756740d362a_20_1.png)


    +   4. Type **a name for your drawing** and press Enter to save the title.


    For this example, I name the drawing Dinosaur Website Site Map.


    ![](img/b129720fc9ac9e14546b8756740d362a_20_2.png)


    Now you can start choosing how to lay out content bubbles. To do so, you need
    the topic you came up with in Project 1.'
  merge: -1
  img_proc: true
- pgno: 21
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 22
  md: '+   3. The area below the toolbar (with the gray- and white-shaded boxes) is
    called the canvas. Place your mouse cursor **near the top and middle of the canvas**.
    Click and hold down your mouse button and move to the right to **draw a shape**.


    ![](img/b129720fc9ac9e14546b8756740d362a_22_0.png)


    +   4. Double-click the shape again to activate the Text tool.


    +   5. Type **Home Page** and then click anywhere in the canvas to save.


    ![](img/b129720fc9ac9e14546b8756740d362a_22_1.png)


    ![](img/b129720fc9ac9e14546b8756740d362a_22_2.png)


    > > The home page is always the parent page. Additional pages are called child
    pages. Any additional pages below a child page are called grandchild pages. When
    you assemble your pages in this order, you''re putting them in a hierarchy (a
    rank), with the most important pages at the top.'
  merge: -1
  img_proc: true
