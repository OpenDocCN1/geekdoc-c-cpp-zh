- pgno: 102
  md: 'For now, add the CSS Editey app to Google Drive.


    +   1. Go to [http://drive.google.com](http://drive.google.com) and log in to
    your Google account if you''re not logged in already.

    +   2. Double-click your project folder to open it.

    +   3. Click New, then More, then Connect More Apps.


