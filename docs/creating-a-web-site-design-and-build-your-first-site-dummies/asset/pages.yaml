    # ## ADDING TEXT TO YOUR WEB SITE


    Now that you have your web site structure ready, you can start adding text to
    display on it. Click between the close header tag and the open footer tag and
    type **Hello World!**.


    ![](img/b129720fc9ac9e14546b8756740d362a_74_0.png)


    Notice that on the right side of your screen, the words “Hello World!” appear.
    That is because the right side of your screen is a preview of what your web site
    looks like.


    In this section, you use your Project 3 final wireframe and code all the text.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/b129720fc9ac9e14546b8756740d362a_75_0.png)


    Right now, you will just have placeholder text. That means that you won''t write
    the actual text yet; you''re just trying to make sure you know where everything
    will go.


    ```

    ~~~html

    1  <html>

    2  <body>

