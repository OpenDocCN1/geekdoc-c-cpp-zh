    +   3. Click the first color listed in the drop-down list that appears.


    ColorHexa takes you to a page containing all the different codes for your Primary
    Color. The **HEX code** for your **Primary Color** appears at the very top of
    the screen, below the word ColorHexa.


    ![](img/b129720fc9ac9e14546b8756740d362a_45_0.png)


    +   4. Write down the **HEX code** on a piece of paper so that you can use it
    later. It''s also a good idea to write down what your **Primary Color** is.


    ![](img/b129720fc9ac9e14546b8756740d362a_45_1.png)


    +   5. Scroll down and you can see all the different ways that your Primary Color
    can be represented. In **HEX code**, yellow is **ffff00**, but in **Binary code**,
    yellow is represented as **11111111, 11111111, 00000000**. HEX code is much easier
    to work with because it''s so much shorter!


    # ### ffff00 Color Conversion


    The hexadecimal color #ffff00 has RGB values of R: 255, G: 255, B: 0 and CMYK
    values of C:0, M:0, Y:1, K:0. Its decimal value is 16776960.


    | Property | Value | Property | Value |

    |---|---|---|---|

    | Hex triplet | #FFFF00 | CIE-LAB | 97.139, -21.556, 94.478 |

    | RGB Decimal | 255,255,0 | XYZ | 0.9505, 1, 0.1089 |

    | RGB Percent | 100,100,0 | Yxy | 0.9703, 1, 0.1089 |

    | CMY | 0,0,1 | CIE-LCH | 97.139, 96.798, 102.853 |

    | CMYK | 0,0,100,0 | CIE-LUV | 97.139, 7.572, 106.??? |

    | HSL | 60°,100,50 | Hunter-Lab | 96.???, -30.???, 96.??? |

    | HSV (or HSB) | 60°,100,100 | Binary | 11111111,11111111,00000000 |

    | Web Safe | ffff00 |  |  |'
