    ## PROJECT 4 CREATE A STYLE GUIDE


    For example, a style guide can include a logo, along with instructions about how
    someone can or cannot use that logo. It can also include a list of colors and
    maybe fonts that are okay to use with that logo. Style guides help you make your
    web site pages look like they belong together.


    ### CREATE A STYLE GUIDE WITH FRONTIFY


    You use a site map to plan the layout of your web site. Likewise, a style guide
    acts as a road map for your web site''s look and feel. For this project, you create
    a basic style guide using a free service called Frontify. To use Frontify, you
    need to set up an account.


    **CREATE AN ACCOUNT WITH FRONTIFY**


    - 1. Open a web browser.

    - 2. In the address bar, type [https://frontify.com/](https://frontify.com/) and
    press Enter.

    - 3. Near the top right of the page, you should see a **button** that reads **Sign
    Up.**


    ![](img/b129720fc9ac9e14546b8756740d362a_38_0.png)


    - 4. **Click the Sign Up button.**


    You should see a **Sign-Up form** in the middle of your screen.


    ![](img/b129720fc9ac9e14546b8756740d362a_39_0.png)


    - 5. **With an adult''s permission, type your name, email address, and a password.**


    - 6. **Click the Sign Up button to continue.**


    Great job! You have created an account and are ready to create your very first
    style guide.


    ![](img/b129720fc9ac9e14546b8756740d362a_39_1.png)


    > *Sometimes when you sign up for Frontify, the web site asks you to fill out
    a survey. If a survey pops up, **fill it out** like this:*


    ![](img/b129720fc9ac9e14546b8756740d362a_40_0.png)


    **CREATE A BRAND WITH FRONTIFY**


    After you create an account in Frontify, the next step is to create your style
    guide. Frontify uses the word *brand* as its name for a style guide.


    - 1. Right after you register your account, you should see a small window that
    asks you to create a brand.

    - 2. Type the name of your web site in the **Brand or Company Name** field.


    ![](img/b129720fc9ac9e14546b8756740d362a_40_1.png)


    - 3. Leave the Brand Icon as the house and the Brand Color as blue; you can change
    it later.


    For this example, I enter Dinosaur Web site.


    - 4. Click Continue.


    A screen appears that asks whether you want to create a style guide from scratch
    or from a template. You can also set a title.


    - 5. Choose Template.

    - 6. Select Basic Style Guide.


    ![](img/b129720fc9ac9e14546b8756740d362a_41_0.png)


    > **WHAT''S A TEMPLATE?**

    >

    > A template is an empty guide to give you a head start on creating your style
    guide. You will see that when you choose to start with a template, the web site
    will guide you through first adding a logo, and then adding the basic colors.
    If you start with a blank style guide, you can add anything you want in any order.
    Sometimes it is helpful to use a template because then you don''t have to remember
    everything and can instead just fill in the blanks!


    ![](img/b129720fc9ac9e14546b8756740d362a_42_0.png)


    - 1. On the same screen, click the **Create Style Guide** button.


    Frontify takes you to your brand dashboard.


    Don''t worry about creating a logo at this point. You don''t need a logo because
    you can use text in your web site header. To skip the logo, click **Basics Colors**
    at the bottom of the screen.


    ![](img/b129720fc9ac9e14546b8756740d362a_42_1.png)


    Next, you focus on learning about colors and fonts.


    ### LEARN ABOUT COLOR CODES


    As you know, people all over the world speak and write to each other in many different
    languages. You probably also know that computers use languages as well, although
    they''re not the same as human languages. To create a web site, you will have
    to learn code (words from a computer language), and specifically web color codes.


    **HEX CODES**


    Web color codes can be written a lot of different ways; the most common way is
    using HEX codes. A HEX code can be a combination of letters and numbers with either
    three or six characters. Here are some examples of HEX codes and the color they
    stand for:


    | HEX code | Color |

    |---|---|

    | `#ff0000` | Red |

    | `#fff` | White |

    | `#000` | Black |

    | `#ffff00` | Yellow |


    Using a HEX code, you can create any one of more than 16 million colors! Cool,
    huh?


    Thankfully, you don''t need to remember all 16 million HEX codes because there
    is a tool that gives you the HEX code for the colors you want. The tool is called
    ColorHexa.


    **DISCOVER COLOR COMBINATIONS WITH COLORHEXA**


    Picking color schemes is a very important step in creating a web site. Color combinations
    affect how people feel about your site. Using tools like ColorHexa (http://www.colorhexa.com/)
    can make the process of building a color scheme very easy.


    - 3. Click the first color listed in the drop-down list that appears.


    ColorHexa takes you to a page containing all the different codes for your Primary
    Color. The **HEX code** for your **Primary Color** appears at the very top of
    the screen, below the word ColorHexa.


    ![](img/b129720fc9ac9e14546b8756740d362a_45_0.png)


    - 4. Write down the **HEX code** on a piece of paper so that you can use it later.
    It''s also a good idea to write down what your **Primary Color** is.


    ![](img/b129720fc9ac9e14546b8756740d362a_45_1.png)


    - 5. Scroll down and you can see all the different ways that your Primary Color
    can be represented. In **HEX code**, yellow is **ffff00**, but in **Binary code**,
    yellow is represented as **11111111, 11111111, 00000000**. HEX code is much easier
    to work with because it''s so much shorter!


    **ffff00 Color Conversion**


    The hexadecimal color #ffff00 has RGB values of R: 255, G: 255, B: 0 and CMYK
    values of C:0, M:0, Y:1, K:0. Its decimal value is 16776960.


    | Property | Value | Property | Value |

    |---|---|---|---|

    | Hex triplet | #FFFF00 | CIE-LAB | 97.139, -21.556, 94.478 |

    | RGB Decimal | 255,255,0 | XYZ | 0.9505, 1, 0.1089 |

    | RGB Percent | 100,100,0 | Yxy | 0.9703, 1, 0.1089 |

    | CMY | 0,0,1 | CIE-LCH | 97.139, 96.798, 102.853 |

    | CMYK | 0,0,100,0 | CIE-LUV | 97.139, 7.572, 106.??? |

    | HSL | 60°,100,50 | Hunter-Lab | 96.???, -30.???, 96.??? |

    | HSV (or HSB) | 60°,100,100 | Binary | 11111111,11111111,00000000 |

    | Web Safe | ffff00 |  |  |

