    \ 3 的线框图示例中，有一个侧边栏。\n\n![](img/b129720fc9ac9e14546b8756740d362a_76_0.png)\n\n\
    要添加网站的不同部分（例如侧边栏），你必须在 body 标签内创建称为“div”的新区域。第一个 div 将位于左侧并占据屏幕的大部分，第二个 div 将位于右侧并只占据屏幕的一小部分。要创建新的\
    \ div，你使用开始和结束 div 标签：`<div> </div>`。即使你不希望这些 div 彼此相邻，你也可能希望拥有不同颜色或内容的不同 div。\n\
    \n查看你在项目 3 中制作的线框图，并**把文本**（或占位文本）放到正确的位置。例如，在本书的网站中，关于恐龙的文本位于网站左侧。本例中创建的第一个 div\
    \ 将是左侧的那个，所以恐龙文本位于第一个 div 中。\n\n```html\n<html>\n\n<head>\n<title>\nChicken\n\
    </title>\n<body>\n<h1>Chicken and Hen: up here</h1>\n<h2>Chicken and Hen: up here</h2>\n\
    <h3>Chicken and Hen: up here</h3>\n<hr>\n<p>Text about my Dinosaur right here.</p>\n\
    <hr>\n<p>Text about my Dinosaur right here.</p>\n<ul>\n<li>Eggs</li>\n<li>Milk</li>\n\
    <li>Bread</li>\n</ul>\n\n</body>\n</html>\n```\n\n## 为你的网站添加样式属性\n\n接下来，你将为 div\
    \ 区域添加属性以更改它们的颜色，使它们更容易被看到。在网站中，属性可以是许多不同的东西。它们可以是颜色、大小，甚至字体样式！\n\n仔细查看代码，并添加以下内容（见下一幅图）。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_77_0.png)\n\n> 你必须完全按照书中的样子输入代码中的所有内容。如果你把不该大写的字母大写了，或者在本不该有空格的地方添加了空格，你的网站就无法正常工作。这是因为计算机虽然很强大，但并没有那么聪明！所以它们不知道名字\
    \ Sarah 和 sarah 是相同的。对计算机来说，这两个名字是不同的，因为一个含有大写 S，另一个含有小写 s。\n\n网站的 head 部分是放置样式代码的地方。这部分你也许想参考项目\
    \ 4 的样式指南。本书示例使用橙色、蓝色和黄色作为颜色，并使用无衬线字体作为字体，所以这里展示的就是这些。\n\n- 1. 在 head 标签之间，添加一个开始和结束\
    \ style 标签。\n\n```html\n<html>\n<head>\n  <style>\n  </style>\n</head>\n<body>\n\
    \  <header>Logo and Menu up here</header>\n  <p>Text about my Dinosaurs right\
    \ here.</p>\n  <footer>Footer Down Here</footer>\n</body>\n</html>\n```\n\n- 2.\
    \ 在 style 标签之间，添加一个名为 body 的部分。这个部分不使用小于号和大于号标签，而是使用开始和结束花括号。body 部分内的所有内容都会更改下面代码中\
    \ body 部分的内容。\n\n```html\n<html>\n<head>\n  <style>\n    body {\n    }\n  </style>\n\
    </head>\n<body>\n  <header>Logo and Menu up here</header>\n  <p>Text about my\
    \ Dinosaurs right here.</p>\n  <footer>Footer Down Here</footer>\n</body>\n</html>\n\
    ```\n\n- 3. 完全按照所写内容添加以下行。输入完成后，你的字体会发生变化！\n\n```css\nbody {\n  font-family: \"\
    Open Sans\", sans-serif;\n}\n```\n\n- 4. **添加以下行**，完全按照所写内容。输入完成后，你的网站应该会变成橙色！\n\
    \n```html\n<!doctype html>\n<html>\n <head>\n  <title>\n   First Test Page\n \
    \ </title>\n  <meta charset=\"utf-8\">\n  <style>\n   body {\n    background-color:\
    \ orange;\n   }\n   h1 {\n    color: green;\n   }\n   p {\n    font-family: Arial;\n\
