    - 2. 添加 HTML 部分的**开始标签**，你会注意到结束标签会自动添加。


    ![](img/b129720fc9ac9e14546b8756740d362a_73_0.png)


    - 3. 回顾本节开头提到的 HTML 结构，确保你在此处添加的标签（如图所示）位于 **HTML 标签内部**。


    ![](img/b129720fc9ac9e14546b8756740d362a_73_1.png)


    太棒了！你现在可以开始向 HTML 页面添加内容了！本项目将带你制作恐龙示例网站，但你在本书中看到的所有内容，同样可以应用到你自己的网站中！


    ### 向网站添加文本


    现在网站结构已经就绪，你可以开始添加要显示的文本了。点击头部结束标签和底部开始标签之间，输入**Hello World!**。


