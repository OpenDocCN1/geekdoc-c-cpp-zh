    \n![](img/b129720fc9ac9e14546b8756740d362a_110_0.png)\n\nTo open each HTML file,\
    \ go to http://drive.google.com, open your project folder, right-click the file\
    \ you want to open, and choose HTML Editey.\n\n![](img/b129720fc9ac9e14546b8756740d362a_110_1.png)\n\
    \nYou should delete the style tags in all the HTML files. You need only the link\
    \ tag now.\n\n### TEST YOUR CHANGES\n\nWow! You just made a lot of changes that\
    \ could potentially hurt your web site. Before moving on, you should test to make\
    \ sure everything still works.\n\n- 1. Go to http://drive.google.com and open\
    \ your project folder.\n\n- 2. Right-click **index.html**, go to **Open With**,\
    \ and click **HTML Viewer**.\n\n![](img/b129720fc9ac9e14546b8756740d362a_110_2.png)\n\
    \n- 3. If your style isn’t showing up, click the **Refresh** button.\n\n![](img/b129720fc9ac9e14546b8756740d362a_110_3.png)\n\
    \nAfter all that work, your web site should look the same as it did at the end\
    \ of the Project 5. Now you are ready to make changes to make it look better,\
    \ and it will be much easier to make those changes!\n\n![](img/b129720fc9ac9e14546b8756740d362a_111_0.png)\n\
    \n> *When you test your web site, make sure to click all the buttons on your web\
    \ site to make sure they all still work. Just because something looks right doesn't\
    \ mean it is acting right!*\n\n### STYLING YOUR WEB SITE\n\nNow that you have\
    \ a style.css file, you can update the style of your web site quickly! Before\
    \ you add more content, you should fix the style.\n\n### DECIDE WHERE TO PUT THE\
    \ BACKGROUND COLORS\n\nYou can decide where to put the different colors yourself,\
    \ but one way to help you decide is to look up other web sites with similar colors.\n\
    \n> *You should always ask an adult's permission before looking anything up on\
    \ the Internet.*\n\nIf you're following the example in this book using orange\
    \ and blue, you might change your header and footer to be orange, your left and\
    \ right class to be blue, and your body to be white. The background color attribute\
    \ (the name of the color for your background) is background-color.\n\n```css\n\
    body {\n    font-family: 'Open Sans', sans-serif;\n    background-color: #ffffff;\n\
    }\n\nheader {\n    background-color: #ff8800;\n}\n\nfooter {\n    background-color:\
    \ #ff8800;\n}\n\ndiv {\n    background-color: #ffffff;\n}\n\n.left {\n    width:\
    \ 75%;\n    float: left;\n    background-color: #0000ff;\n}\n\n.right {\n    width:\
    \ 25%;\n    float: left;\n    background-color: #0000ff;\n    color: #ffffff;\n\
    }\n```\n\n### CHANGE THE FONT COLOR\n\nNow that you have your background colors\
    \ how you want them, change the text so that it's easy to read.\n\n- 1. You might\
    \ have to play around with the different colors. For the example of using orange\
    \ and blue, the text in the body looks best as white. The font color attribute\
    \ (the name of the color for your text) is color.\n\n```css\nbody {\n    font-family:\
    \ 'Open Sans', sans-serif;\n    background-color: #ffffff;\n    color: #ffffff;\n\
    }\n```\n\n- 2. For an orange background, or other colors like orange, the white\
    \ text doesn't look as good. If the white text doesn't look good on one of your\
    \ colors, change the text to be a different color. For example, on an orange background,\
    \ you would change the color of the text in your footer to be black (`color: #000000`).\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_113_0.png)\n\n### FORMAT YOUR PAGE\n\
    \nYou can do a few simple things to make your web site look even better! Follow\
    \ these steps to format your page.\n\n- 1. Center the text of the footer. To move\
    \ the text to the left, right, or center, you use the `text-align` attribute.\
    \ This is a good idea for any web site.\n\n```css\nfooter {\n    background-color:\
    \ #ff8000;\n    color: #000000;\n    text-align: center;\n}\n```\n\n![](img/b129720fc9ac9e14546b8756740d362a_113_1.png)\n\
    \n## 数字图像处理与分析\n\n### 图像分割（1）\n\n### 阈值化分割\n\n阈值化分割作为最经典的图像分割方法，其基本思想是确定一个阈值，然后根据该阈值将图像中的每个像素划分为目标或背景。阈值化分割方法计算简单、效率高，在图像分割领域占有重要地位。\n\
    \n### 阈值化分割的基本原理\n\n阈值化分割的基本原理是依据一定的准则，将图像的灰度值划分为不同的集合。对于一幅灰度图像 f(x, y)，若选择一个阈值\
    \ T，则分割后的图像 g(x, y) 可表示为：\n\n```text\ng(x, y) = 1,  f(x, y) > T\n           =\
    \ 0,  f(x, y) ≤ T\n```\n\n其中，f(x, y) 为输入图像，g(x, y) 为输出二值图像，T 为阈值。阈值 T 的选择是阈值化分割的关键，通常可以表示为：\n\
    \n```text\nT = T[x, y, p(x, y), f(x, y)]\n```\n"
