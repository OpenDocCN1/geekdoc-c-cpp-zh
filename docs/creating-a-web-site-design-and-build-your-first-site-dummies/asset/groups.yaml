    ## 创建导航菜单


    大多数网站也会把导航菜单放在线框图顶部附近。你可以把导航放在徽标旁边或下方。


    要创建导航菜单：


    - 1. **绘制一个较小的矩形**，并将其放在页眉中部附近。


    ![](img/b129720fc9ac9e14546b8756740d362a_33_0.png)


    - 2. **将此菜单项复制几次，并将这些矩形并排放置。** 在菜单栏中，点击“编辑”，然后点击“复制”。


    > *使用键盘快捷键和热键是使用计算机的人的一项基本技能。如果你对编程感兴趣，请尽可能尝试使用键盘快捷键！*


    （在 Windows 中按 Ctrl+D，或在 Mac 上按 ⌘-D，即可快速复制此菜单项。）


    - 3. 添加一些**占位文本**，例如“菜单项”。


    ![](img/b129720fc9ac9e14546b8756740d362a_33_1.png)


    页眉区域这样就完成了。


    ## 莫比乌斯反演


    设 $f(n)$ 与 $g(n)$ 是定义在正整数集合上的函数，$\mu(n)$ 为莫比乌斯函数。


    莫比乌斯函数 $\mu(n)$ 定义为：当 $n$ 有平方因子时 $\mu(n)=0$；当 $n$ 是 $k$ 个不同素数的乘积时 $\mu(n)=(-1)^k$；特别地，$\mu(1)=1$。


    > **定理（莫比乌斯反演公式）** 若 $g(n)=\sum_{d\mid n} f(d)$，则 $$f(n)=\sum_{d\mid n} \mu(d)\,
    g\left(\frac{n}{d}\right).$$


    **证明：** 根据 $g$ 的定义并交换求和次序，

    $$

    \sum_{d\mid n}\mu(d)g\left(\frac{n}{d}\right)

    =\sum_{d\mid n}\mu(d)\sum_{e\mid (n/d)} f(e)

    =\sum_{e\mid n} f(e)\sum_{d\mid (n/e)}\mu(d).

    $$

    由于 $\sum_{d\mid m}\mu(d)=0$ 当 $m>1$，且等于 $1$ 当 $m=1$，故右边等于 $f(n)$。


    推论：若 $f(n)=\sum_{n\mid m} g(m)$，则 $g(n)=\sum_{n\mid m}\mu\left(\frac{m}{n}\right)f(m)$。


    ![](img/b129720fc9ac9e14546b8756740d362a_36_0.png)


    ## 创建页脚


    当所有小部件都放置到位后，你可以添加最后一部分——页脚：


    - 1. 绘制一个长而宽的矩形，覆盖屏幕底部。

    - 2. 在矩形中添加“页脚”一词。


    ![](img/b129720fc9ac9e14546b8756740d362a_36_1.png)


    ## 完成的线框图


    太棒了！你已经组装好第一个线框图的所有部分。你应该得到了与本项目第一张图相符的结果。


    ## 项目 4 创建样式指南


    例如，样式指南可以包含徽标，以及关于他人可以或不能如何使用该徽标的说明。它还可以包含可与此徽标搭配使用的颜色列表，也许还有字体列表。样式指南可帮助你的网站页面看起来彼此协调统一。


    ### 使用 Frontify 创建样式指南


    你使用站点地图来规划网站的布局。同样，样式指南就像网站外观和感觉的路线图。在本项目中，你将使用一个名为 Frontify 的免费服务创建一个基本样式指南。要使用
    Frontify，你需要设置一个账户。


    **使用 FRONTIFY 创建账户**


    - 1. 打开网络浏览器。

    - 2. 在地址栏中输入 [https://frontify.com/](https://frontify.com/) 并按 Enter。

    - 3. 在页面右上方附近，你应该会看到一个**按钮**，上面写着**注册。**


    ![](img/b129720fc9ac9e14546b8756740d362a_38_0.png)


    - 4. **点击“注册”按钮。**


    你应该会在屏幕中间看到一个**注册表单**。


    ![](img/b129720fc9ac9e14546b8756740d362a_39_0.png)


    - 5. **在成年人允许下，输入你的姓名、电子邮件地址和密码。**


    - 6. **点击“注册”按钮继续。**


    做得很好！你已经创建了账户，并准备好创建你的第一个样式指南。


    ![](img/b129720fc9ac9e14546b8756740d362a_39_1.png)


    > *有时当你注册 Frontify 时，网站会要求你填写一份调查问卷。如果弹出调查问卷，请像这样**填写**：*


    ![](img/b129720fc9ac9e14546b8756740d362a_40_0.png)


    **使用 FRONTIFY 创建品牌**


    在 Frontify 中创建账户后，下一步是创建样式指南。Frontify 用 *brand*（品牌）一词来指代样式指南。


    - 1. 注册账户后，你应该会看到一个要求你创建品牌的小窗口。

    - 2. 在**品牌或公司名称**字段中输入你的网站名称。


    ![](img/b129720fc9ac9e14546b8756740d362a_40_1.png)


    - 3. 将品牌图标保留为房子，品牌颜色保留为蓝色；之后可以更改。


    在此示例中，我输入 Dinosaur Web site。


    - 4. 点击“继续”。


    会出现一个屏幕，询问你是要从头创建样式指南还是从模板创建。你也可以设置标题。


    - 5. 选择“模板”。

    - 6. 选择“基本样式指南”。


    ![](img/b129720fc9ac9e14546b8756740d362a_41_0.png)


    > **什么是模板？**

    >

    > 模板是一份空指南，可帮助你在创建样式指南时抢先一步。你会看到，当你选择从模板开始时，网站会引导你先添加徽标，然后添加基础颜色。如果你从空白样式指南开始，则可以按任意顺序添加任何内容。有时使用模板很有帮助，因为这样你就不必记住所有内容，而只需填写空白即可！


    ![](img/b129720fc9ac9e14546b8756740d362a_42_0.png)


    - 1. 在同一屏幕上，点击**创建样式指南**按钮。


    Frontify 会带你进入品牌仪表板。


    此时不用担心创建徽标。你不需要徽标，因为可以在网站页眉中使用文本。要跳过徽标，请点击屏幕底部的**基础颜色**。


    ![](img/b129720fc9ac9e14546b8756740d362a_42_1.png)


    接下来，你将重点学习颜色和字体。


    ### 了解颜色代码


    如你所知，世界各地的人们使用许多不同的语言互相交谈和书写。你可能也知道，计算机也使用语言，尽管它们与人类语言不同。要创建网站，你必须学习代码（计算机语言中的词语），特别是
    Web 颜色代码。


    **十六进制代码**


    Web 颜色代码可以用很多不同的方式书写；最常见的方式是使用十六进制代码。十六进制代码可以是由三个或六个字符组成的字母和数字组合。以下是一些十六进制代码及其所代表颜色的示例：


    | 十六进制代码 | 颜色 |

    |---|---|

    | `#ff0000` | 红色 |

    | `#fff` | 白色 |

    | `#000` | 黑色 |

    | `#ffff00` | 黄色 |


    使用十六进制代码，你可以创建超过 1600 万种颜色中的任意一种！很酷吧？


    幸运的是，你不需要记住全部 1600 万个十六进制代码，因为有一个工具可以为你提供所需颜色的十六进制代码。这个工具叫做 ColorHexa。


    **使用 COLORHEXA 发现颜色组合**


    选择配色方案是创建网站中非常重要的一步。颜色组合会影响人们对你的网站的感受。使用 ColorHexa (http://www.colorhexa.com/)
    这样的工具可以让构建配色方案的过程变得非常容易。


    - 3. 点击出现的下拉列表中列出的第一种颜色。


    ColorHexa 会带你进入一个页面，其中包含你的主色的所有不同代码。你的**主色**的**十六进制代码**会显示在屏幕最上方，位于 ColorHexa
    一词下方。


    ![](img/b129720fc9ac9e14546b8756740d362a_45_0.png)


    - 4. 将**十六进制代码**写在纸上，以便之后使用。记下你的**主色**是什么也是个好主意。


    ![](img/b129720fc9ac9e14546b8756740d362a_45_1.png)


    - 5. 向下滚动，你可以看到主色所有不同的表示方式。在**十六进制代码**中，黄色是 **ffff00**，但在**二进制代码**中，黄色表示为 **11111111,
    11111111, 00000000**。十六进制代码使用起来容易得多，因为它短得多！


    **ffff00 颜色转换**


    十六进制颜色 #ffff00 的 RGB 值为 R: 255、G: 255、B: 0，CMYK 值为 C:0、M:0、Y:1、K:0。其十进制值为 16776960。


    | 属性 | 值 | 属性 | 值 |

    |---|---|---|---|

    | 十六进制三元组 | #FFFF00 | CIE-LAB | 97.139, -21.556, 94.478 |

    | RGB 十进制 | 255,255,0 | XYZ | 0.9505, 1, 0.1089 |

    | RGB 百分比 | 100,100,0 | Yxy | 0.9703, 1, 0.1089 |

    | CMY | 0,0,1 | CIE-LCH | 97.139, 96.798, 102.853 |

    | CMYK | 0,0,100,0 | CIE-LUV | 97.139, 7.572, 106.??? |

    | HSL | 60°,100,50 | Hunter-Lab | 96.???, -30.???, 96.??? |

    | HSV（或 HSB） | 60°,100,100 | 二进制 | 11111111,11111111,00000000 |

    | Web 安全色 | ffff00 |  |  |


