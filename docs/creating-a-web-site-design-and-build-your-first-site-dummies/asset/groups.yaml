  - '[PAGE 62]


    # # PROJECT 5: MAKE YOUR DESIGN COME TO LIFE


    ![](img/b129720fc9ac9e14546b8756740d362a_62_0.png)


    **YOU NOW HAVE A FULL DESIGN OF YOUR OWN WEB SITE.** You have come up with a topic,
    made a site map to plan what pages you''re going to have, made wireframes for
    your pages, and even created a style guide to help you with the look and feel
    of your site. Now it''s time to add a bit of computer coding to actually make
    your web site!


    In this project, you learn about HTML, a computer coding language that allows
    you to make a working web site. You will make all your pages, and even add images!
    In the next project, you get a chance to add a bit more color and interactivity
    to your web site.


    # ## SETTING UP YOUR CODING ENVIRONMENT


    In Project 2, you used Google Drawings to make your site map. Now you will use
    Google Drive and some of the apps that connect to it to build and share your web
    site.


    ![](img/b129720fc9ac9e14546b8756740d362a_62_1.png)


    > > Before starting, you should have an adult''s permission. (By law, you must
    be at least 13 years old to create any online account.)


    # ## CREATE YOUR GOOGLE FOLDER


    First, you have to create a Google Folder.


    +   1. Open a web browser. The images in this book are using Chrome.'
