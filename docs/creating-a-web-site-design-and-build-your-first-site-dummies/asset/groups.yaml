    # ## ABOUT THE AUTHOR


    Greg Rickaby is a Lead Front-End Developer at WebDevStudios, a development agency
    that specializes in creating solutions using WordPress for enterprise-level clients
    such as Microsoft, Viacom, the Discovery Channel, Uber, Campbell''s Soup, and
    more. He''s been writing code for the web since the late 1990s and professionally
    since 2000. Greg also has a passion for teaching others, contributing to open
    source technologies, scouting, and being outdoors.


    Greg and his beautiful wife, Tara, are the proud parents of Chase, Chloe, and
    Wyatt. They reside in southern Alabama. Creating a Web Site is his first book
    for Wiley.


    # ## DEDICATION


    To those who contribute to open source technology: Together we can build great
    things.


