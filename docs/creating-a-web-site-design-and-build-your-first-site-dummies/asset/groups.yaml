    \n现在你可以开始选择如何布局内容气泡。为此，你需要用到你在项目 1 中想出的主题。\n\n- 3. 工具栏下方（带有灰色和白色阴影方块的区域）称为画布。将鼠标光标放在**画布顶部中间附近**。按住鼠标按钮并向右移动，以**绘制一个形状**。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_22_0.png)\n\n- 4. 再次双击该形状以激活文本工具。\n\
    \n- 5. 输入**首页**，然后在画布中任意位置单击以保存。\n\n![](img/b129720fc9ac9e14546b8756740d362a_22_1.png)\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_22_2.png)\n\n> 首页始终是父页面。其他页面称为子页面。子页面下方的任何其他页面称为孙页面。当你按此顺序组织页面时，你是在将它们放入一个层级结构（等级）中，最重要的页面位于顶部。\n\
    \n## 项目 2：创建站点地图\n\n![](img/b129720fc9ac9e14546b8756740d362a_25_0.png)\n\n太棒了！现在你有了一个基本的站点地图，其中包含按父页面、子页面和孙页面（层级）顺序排列的页面。\n\
    \n继续对你想要为主题创建的每个页面重复步骤 1–6。完成后，你的站点地图可能类似于下图：\n\n![](img/b129720fc9ac9e14546b8756740d362a_25_1.png)\n\
    \n要有耐心！可能需要一点时间才能把所有事情都调整得恰到好处，但完成后，你就能清楚地知道内容应该如何展示。这个过程有助于你在完成本书其他项目时保持专注。\n\
    \n### 用铅笔和纸绘制站点地图\n\n在纸上而不是在 Google Drawings 中绘制站点地图也完全可以！事实上，你可能会发现先在纸上画出来，然后再制作一份数字副本以便以后轻松参考会更容易。\n\
    \n- 1. 找一张白纸和一支铅笔。\n- 2. 把纸横过来。\n- 3. 在顶部写下你的网站名称。\n  - *在本项目的示例中，名称是“恐龙网站站点地图”。*\n\
    - 4. 在顶部中间附近绘制一个矩形内容气泡形状。\n- 5. 在内容气泡中间写上**首页**。\n- 6. 在正下方再绘制一个内容气泡，留出刚好能画一条直线的空间。\n\
    - 7. 写下你第一个子页面的名称。\n  - *在本项目的示例中，其中一个名称是“恐龙类型”。*\n- 8. 从“首页”气泡到子页面气泡画一条线。\n\n\
    太棒了！你现在肯定明白该怎么做了！重复步骤 4–8，直到你为每个页面都绘制好内容气泡。\n\n![](img/b129720fc9ac9e14546b8756740d362a_27_0.png)\n\
    \n到现在，你应该已经完成了一个站点地图。\n\n你稍后需要参考这个站点地图，所以一定要把它放在手边。你可以使用手绘副本、打印副本，或在浏览器标签页中保持打开的\
    \ Google Drawings 副本。现在你有了站点地图，就可以开始项目 3 了！太棒了！\n\n## 项目 3：创建线框图\n\n![](img/b129720fc9ac9e14546b8756740d362a_28_0.png)\n\
    \n***你知道你完成后的网站一定会看起来很棒。*** *毕竟，有了所有令人兴奋的图形和视频，怎么会不棒呢？为了确保你的网站能达到你的期望，并为所有内容留出空间，你需要有一个计划。在本项目中，你将确定网站的初始布局。*\n\
    \n### 什么是线框图？\n\n*线框图就像网站的蓝图。它可以帮助你确定在页面上把所有的内容、图形、视频和其他元素放在哪里。*\n\n通常，线框图以两种格式呈现：\n\
    \n- **低保真：** 这些线框图只是粗略的草图或涂鸦。\n- **高保真：** 这些线框图可以代表最终设计，更详细地展示每个部分。\n\n通常，一个网站有页眉、主体、侧边栏和页脚。当然，网站的布局可以是网站创建者想要的任何样子，但大多数浏览网站的人已经习惯内容按照图中所示的方式布局。\n\
    \n创建线框图时，你可能想模仿这种布局。\n\n![](img/b129720fc9ac9e14546b8756740d362a_29_0.png)\n\n\
    ### 基础知识：开始前你需要知道的事\n\n在开始创建网站之前，先画一张草图，描绘你希望网站看起来是什么样子。\n\n你可以在纸上绘制线框图，也可以使用你最喜欢的绘图应用（例如\
    \ Google Drawings）来制作。\n\n当然，这里展示的只是一个示例。你可以按自己喜欢的方式绘制线框图。尽情发挥你的创造力吧！\n\n![](img/b129720fc9ac9e14546b8756740d362a_30_0.png)\n\
    \n> *无论你决定如何创建低保真线框图，请记住，你是在用直线和基本图形来表示照片和视频。目标是想象你的网站布局可能是什么样子。*\n\n现在，请专注于标志、菜单、主体内容和页脚将放在哪里。不要害怕划掉重来。在本项目中，你不需要担心颜色或字体！\n\
    \n### 创建低保真线框图\n\n在项目 2 中，你学习了如何使用 Google Drawings 制作站点地图。在本项目中，你将使用同一工具创建你的第一个线框图。\n\
    \n如果你无法使用 Google Drawings，仍然可以跟着做。只需拿起铅笔和纸，在纸上完成每一步，而不是在电脑上。\n\n> 线框图看起来不太像网站也没关系。目标只是把你的想法画出来，然后再加以改进！\n\
    \n在本项目中，你需要有项目 2 中的站点地图。在网页浏览器中打开站点地图，或将其打印出来。（如果你还没有创建站点地图，请回到项目 2 创建一个。）\n\n\
    ### 放置标志\n\n把站点地图放在手边，按照以下步骤创建低保真线框图：\n\n- 1. 在网页浏览器中，访问 https://docs.google.com/drawings\
    \ 并打开 Google Drawings。\n\n- 2. 为标志绘制一个矩形。\n\n你可以通过单击**形状工具**图标，选择**形状**，然后选择**矩形**来绘制矩形。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_31_0.png)\n\n- 3. 将矩形放在**屏幕左上角**附近。\n\
    \n你可以把标志放在任何你喜欢的地方，但大多数网站会把标志放在左上角区域，这个区域称为页眉。\n\n![](img/b129720fc9ac9e14546b8756740d362a_32_0.png)\n\
    \n- 4. 双击标志矩形的中心。\n\n文本工具会出现。\n\n- 5. 输入 Logo。\n\n- 6. 单击左侧**空白区域**以完成。\n\n![](img/b129720fc9ac9e14546b8756740d362a_32_1.png)\n\
    \n"
