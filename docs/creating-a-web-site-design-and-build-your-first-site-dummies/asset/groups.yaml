  mdcn: "\n## 关于版权\n\n什么是版权？它意味着某人创作了一个“东西”，只有那个人被允许使用那个“东西”，除非此人允许另一个提出请求的人使用它。\n\
    \n幸运的是，有些人和组织乐于分享自己的作品。允许被分享（或再分发）的照片通常依据 *知识共享零许可*（Creative Commons Zero）(https://creativecommons.org/)\
    \ 授权。\n\n一些计算机和网络软件根据名为“通用公共许可证”（简称 GPL）的许可证免费提供。这类软件被称为“开源”，意味着任何人都可以以自己想要的任何方式使用或修改源代码。\n\
    \n版权和知识产权法是严肃的问题，未经许可使用他人的作品会带来法律后果。我鼓励你在 Wikipedia (https://en.wikipedia.org/wiki/Copyright)\
    \ 上阅读更多关于版权的内容。我还要求，如果你使用来自其他网站的照片、视频或文本，请在页脚或网站的专门页面上列出你的来源（请确保你被允许借用这些内容！）。如果你对版权有任何疑问，请让成年人帮助你了解更多。\n\
    \n## 关于你\n\n每位初级网站管理员都需要从某个地方起步，但本书假定你有能力：\n\n- 在电脑上打字、使用鼠标并遵循说明。\n- 拥有电子邮件地址和\
    \ Google 账户。本书中的几个项目要求你注册一个（免费）账户以访问服务和工具。请先获得成年人的许可！\n- 不怕失败。没有人是完美的，也没有任何人在成为网络专业人员之前没有先犯过许多错误。\n\
    \n最后，拼写和格式很重要。计算机非常强大，但它们实际上相当笨，而且对指令的书写方式非常挑剔。如果计算机无法理解一条命令，它就不会知道该做什么，什么也不会发生。你可能需要额外花一些时间处理拼写和格式错误。\n\
    \n## 关于图标\n\n当你阅读本书中的项目时，你会看到几个图标。这些图标指出不同的内容：\n\n![](img/b129720fc9ac9e14546b8756740d362a_9_0.png)\n\
    \n*此图标指出可以让你的项目运行得更顺利的提示。*\n\n![](img/b129720fc9ac9e14546b8756740d362a_9_1.png)\n\
    \n*此图标提醒你注意需要记住的信息。*\n\n![](img/b129720fc9ac9e14546b8756740d362a_9_2.png)\n\n\
    *此图标标记重要信息，你可以利用这些信息避免编码时的常见陷阱。*\n\n## 延伸阅读\n\n一些编写代码的概念在另一本为你这样的孩子写的书中有所介绍：Camilla\
    \ McCue 的《Getting Started with Coding》，以及 Chris Minnick 和 Eva Holland 的《Writing\
    \ Computer Code》。\n\n你将学到很多关于 Google Drive、编程语言和发挥创造力的知识。我建议你无论何时遇到困难，都可以从在线教程、YouTube\
    \ 视频以及 www.w3schools.com 或 thewecan.zone/website-building 等网站寻求帮助。并且永远不要害怕向父母或朋友求助！最好的网站管理员是那些与他人交流的人。\n\
    \n## 项目 1：选择一个主题\n\n![](img/b129720fc9ac9e14546b8756740d362a_10_0.png)\n\n**为你的网站找到一个单一主题或想法来聚焦可能很困难。**\
    \ 事实上，它可能是建立网站中最困难的一部分。灵感是个有趣的东西；它可能来自任何地方，也可能无处可来！有时想出一个主题可能需要几天或几周。\n\n如果你不能很快选定某个主题，不要灰心。你不会想创建一个关于自己其实并不感兴趣的主题的网站，然后却觉得自己必须坚持做下去。为了帮助你避免这种情况，下面有一些技巧，可以让你把精力集中在一个主题上。\n\
    \n### 制作词云\n\n拿起铅笔和记事本，开始写下你最喜欢做的事情。如果你非常喜欢宝可梦，就把它写下来。如果你喜欢研究恐龙，也把它写下来。\n\n你是否参加空手道课、芭蕾舞或足球等课外活动，或者你会演奏乐器吗？对某个特定主题有经验，会提供坚实的基础，使创建有趣且吸引人的内容变得更容易。\n\
    \n## 如何使用 Google.com 搜索\n\n按照以下步骤在 Google 上执行搜索：\n\n- **1. 打开网页浏览器。**\n\n网页浏览器是一种让你可以搜索互联网并访问网站的应用程序。常见的网页浏览器有\
    \ Microsoft Edge、Google Chrome、Mozilla Firefox 和 Safari。你在电脑上使用哪一种？\n\n![](img/b129720fc9ac9e14546b8756740d362a_13_0.png)\n\
    \n- **2. 在地址栏中输入** `https://google.com/` **，然后按 Enter 键。**\n\n![](img/b129720fc9ac9e14546b8756740d362a_13_1.png)\n\
    \nGoogle 首页中间附近会出现一个搜索框。\n\n- **3. 在搜索框中输入搜索词。**\n\n如果你想写一个关于恐龙的网站，可以在这个框中输入 **恐龙**。Google\
    \ 会自动执行搜索并立即显示结果。\n\n![](img/b129720fc9ac9e14546b8756740d362a_14_0.png)\n\n- **4.\
    \ 单击蓝色链接以查看网站。**\n\n> *当你在浏览其他网站寻找灵感时，请密切关注它们的布局、颜色、照片和内容。你可能会偶然发现一些想用在自己网站上的东西。想一想你可以如何类似地实现——但不要复制那个网站。*\n\
    \n## 如何使用 SimilarSites.com 搜索\n\n另一个寻找主题的好资源是名为 Similar Sites 的网站服务。与 Google 很像，它是一个搜索引擎，帮助你找到包含类似信息的网站。\n\
    \n- **1. 打开网页浏览器。**\n\n到目前为止，你应该知道如何打开网页浏览器并输入网址。如果你仍然需要成年人的帮助，别担心！这只需要一点练习。\n\
    \n- **2. 在地址栏中输入** `http://similarsites.com/` **，然后按 Enter 键。**\n\n在首页中间，你会看到一个**大搜索框**。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_15_0.png)\n\n- **3. 在搜索框中输入主题或想法（例如恐龙），然后按\
    \ Enter 键。**\n\n![](img/b129720fc9ac9e14546b8756740d362a_15_1.png)\n\n你会看到一个网站列表。单击结果以查看网站。\n\
    \n## 项目 1：选择一个主题\n\n![](img/b129720fc9ac9e14546b8756740d362a_17_0.png)\n\n###\
    \ 确定你想与谁交流\n\n几乎与主题同样重要的是，确定你想触达的受众是谁。你想为家人创建一个网站吗？也许是同学或队友？如果你正在为同学写关于恐龙的内容，想一想你会如何当面给他们解释信息。\n\
    \n与朋友谈论你的主题确实可以帮助你缩小想法范围。它还可以帮助你构思一些内容！\n\n如果你的主题只有你自己感兴趣，那可能不值得写。一个好的网站始终把读者放在心上。这通常意味着选择那些还没有被写得太多的主题，也许还要选择一个更时新的主题。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_17_1.png)\n\n> 不要害怕向成年人寻求想法方面的帮助。很可能，与你亲近的成年人也曾不得不为学校或大学论文找一个主题。我相信你生活中的某位成年人会很乐意帮助你确定主题。\n\
    \n## 项目 2：创建站点地图\n\n![](img/b129720fc9ac9e14546b8756740d362a_18_0.png)\n\n**究竟什么是站点地图？**\
    \ 就像一张普通的老式地图能帮你找到路一样，站点地图能帮助 Google 等搜索引擎在你的网站中顺利浏览。站点地图也可以是一个用于显示网站页面列表的文档。在这个项目中，你将学习如何创建站点地图，这将帮助你思考希望如何组织内容。\n\
    \n### 决定如何布局内容\n\n现在你有了一个主题，是时候专注于如何布局它了。网站都有主页，这是开始制作站点地图的好地方。例如，如果你正在创建一个关于恐龙的网站，以下是你可能会看到的一些页面和部分：\n\
    \n- 主页\n  - 恐龙时间线\n    - 侏罗纪区\n    - 三叠纪区\n"
