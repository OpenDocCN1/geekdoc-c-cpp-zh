    \ {\n    font-family: Arial;\n    font-size: 20px;\n   }\n  </style>\n </head>\n\
    \ <body>\n  <header>\n   Welcome to My Web Page\n  </header>\n  <p>\n   This is\
    \ my first web page.\n  </p>\n </body>\n</html>\n```\n\n- 7. 接下来，你将把 div 区域改为**第三级颜色**。在本书中，第三级颜色是黄色。\n\
    \n在本书中，这两个 div 本应并排显示。但你的 div 不必如此；它们也可以一个在另一个上面。例如，本书将 div 的类命名为“left”和“right”，但你可以将自己的命名为“top”和“bottom”。\n\
    \n你可能会注意到，左侧 div 的背景颜色为 #ffffff（即白色），它会显示出来，而右侧 div 的背景颜色为 #000000（即黑色），却不会显示。这是因为右侧\
    \ div 中没有任何内容！\n\n- 9. 在右侧 div（或你尚未填写的 div）中添加一些文本，第二个 div 就会显示出来；在本例中，就是那个黑色\
    \ div。\n\n![](img/b129720fc9ac9e14546b8756740d362a_81_0.png)\n\n- 10. 小心！有时你的文本颜色和背景颜色相同，这会让那里看起来什么都没有！在本书中，问题是你无法看到文本，因为文本和背景都是黑色的。但别担心！文本颜色也有一个样式属性。\n\
    \n继续添加 div、字体和颜色，直到你的网站看起来像你在项目 3 中制作的线框图。\n\n哇！你的网站开始成形了。尽管它现在可能看起来有点傻，但你实际上已经搭建好了结构，并且已经设置了一些颜色！\n\
    \n## 为你的网站添加图片\n\n现在你已经把所有内容都放好了，可以开始往网站里添加几张图片了。\n\n- 1. 访问 http://drive.google.com\
    \ 并双击**你的项目文件夹**。本书中的项目文件夹名为 MyDinoSite。\n- 2. 单击**新建**和**文件上传**，以便将第一张图片上传到你的\
    \ Google Drive 文件夹。\n\n![](img/b129720fc9ac9e14546b8756740d362a_83_0.png)\n\n\
    - 6. 右键单击图片，然后单击**共享**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_85_0.png)\n\
    \n- 7. 单击**高级**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_85_1.png)\n\n- 8.\
    \ 单击**更改**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_86_0.png)\n\n- 9. 选择**开启\
    \ - 在网络上公开**，然后单击**保存**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_86_1.png)\n\
    \n- **10 单击“完成”。**\n\n![](img/b129720fc9ac9e14546b8756740d362a_87_0.png)\n\n-\
    \ **11 双击你的图片，它应该会在屏幕上以较大尺寸打开。**\n\n![](img/b129720fc9ac9e14546b8756740d362a_87_1.png)\n\
