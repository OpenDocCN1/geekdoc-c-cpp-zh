    \ html>\n<html>\n<head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"http://editey.com/preview/ID_NUMBER/style.css\"\
    >\n</head>\n```\n\nEverything you type should be exactly as it is in the code\
    \ just above this paragraph. Don't add any spaces and don't get rid of any, and\
    \ make sure everything is capitalized the same. The code is supposed to be all\
    \ on one line, but as you see in the figure, depending on how wide your window\
    \ is, the line of code can be split. That's okay! Just make sure that when you\
    \ type it in, you never press Enter — you just type it in all at one time.\n\n\
    ![](img/b129720fc9ac9e14546b8756740d362a_108_0.png)\n\n- 2. You need to replace\
    \ ID_NUMBER with the actual ID number of your style.css file. Open your style.css\
    \ file and look at the URL from the address bar. The format is css.editey.com/file/ID_NUMBER/FILE_NUMBER.\n\
    \n```css\nbody {\n    font-family: 'Open Sans', sans-serif;\n}\n```\n\n- 3. Highlight\
    \ the ID_NUMBER and press Ctrl+C if you're on Windows, ⌘-C if you're on Mac, to\
    \ copy it.\n\n```css\nbody {\n    font-family: 'Open Sans', sans-serif;\n    background-color:\
    \ #F8F8F8;\n}\nh1 {\n```\n\n## PROJECT 6 MAKE YOUR WEB SITE LOOK GREAT\n\n- 4.\
    \ Open your `index.html` file and **highlight the ID_NUMBER** from Step 1.\n\n\
    ![](img/b129720fc9ac9e14546b8756740d362a_109_0.png)\n\n- 5. Press Ctrl+V if you’re\
    \ on Windows, ⌘-V if you’re on Mac, to **paste the ID number** in the URL.\n\n\
    ![](img/b129720fc9ac9e14546b8756740d362a_109_1.png)\n\n- 6. Copy the entire `<link`\
    \ line of code and **paste it** into the other three html files that you made\
