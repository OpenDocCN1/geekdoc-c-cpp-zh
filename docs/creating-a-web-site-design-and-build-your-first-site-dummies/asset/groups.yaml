    ![](img/b129720fc9ac9e14546b8756740d362a_62_0.png)


    **现在你已经有了自己网站的完整设计。** 你想出了一个主题，制作了站点地图来规划要创建的页面，为页面设计了线框图，甚至还创建了样式指南来帮助确定网站的外观和感觉。现在是时候加入一些计算机代码，真正制作你的网站了！


