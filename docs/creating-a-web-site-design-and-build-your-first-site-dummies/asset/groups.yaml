  mdcn: "\n![](img/b129720fc9ac9e14546b8756740d362a_75_0.png)\n\n现在，你只会使用占位文本。这意味着你还不会写实际文本；你只是要确保自己知道每个部分将放在哪里。\n\
    \n```html\n1  <html>\n2  <body>\n3  <p>\n4  Logo\n5  <p>\n6  Menu Item\n7  <p>\n\
