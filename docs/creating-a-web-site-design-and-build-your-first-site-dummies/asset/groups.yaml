    ## 关于作者


    格雷格·里卡比是 WebDevStudios 的首席前端开发人员。WebDevStudios 是一家开发机构，专门使用 WordPress 为微软、维亚康姆、探索频道、优步、金宝汤等企业级客户创建解决方案。他自
    20 世纪 90 年代末起就开始为 Web 编写代码，并从 2000 年起从事专业工作。格雷格还热衷于教导他人、为开源技术做贡献、参与童子军活动以及户外活动。


    格雷格和他美丽的妻子塔拉是蔡斯、克洛伊和怀亚特的骄傲父母。他们住在阿拉巴马州南部。《创建网站》是他在 Wiley 出版的第一本书。


    ## 献词


    献给那些为开源技术做出贡献的人：携手合作，我们可以成就伟大的事业。


    ## 作者致谢


    首先，我必须感谢我最好的朋友塔拉。去年秋天，她不辞辛劳的努力让我能够在周末消失，以便我写这本书。我知道，整个季节独自带着一个新生儿和一个两岁大的孩子并不是最有趣的事，所以谢谢你，亲爱的！


    致我的编辑艾米、艾莉森和苏珊，感谢你们在我学习写书的过程中给予的耐心和理解。感谢莉萨·萨宾-威尔逊，在事情变得艰难时做我哭泣时依靠的肩膀。还要特别感谢我的父亲，他在
    20 世纪 80 年代就看到了个人电脑的价值。他确保我和我的兄弟知道如何使用它们。正如他所说：“我没有足够的钱送你们上大学，所以我所能做的最好的事情就是为你们提供必要的技术，让你们能够有所作为。”为此，我永远感激。


    最后，感谢莎拉·古瑟尔斯博士在最后一刻加入，帮助完成这本书。感谢她在幕后不知疲倦的工作，没有她我无法完成这本书。她还是 Wiley 两本书的作者，包括《Minecraft
    Modding For Kids For Dummies》和《Modding Minecraft》。如果你喜欢 Minecraft，你应该看看它们！


