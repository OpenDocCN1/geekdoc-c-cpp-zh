  - '[PAGE 8]


    # A WORD ABOUT COPYRIGHT


    What is copyright? It means that someone has created a “thing” and only that person
    is allowed to use that “thing” unless the person gives permission to someone else
    who asked for it.


    Luckily there are people and organizations who enjoy sharing their work. Photographs
    that are allowed to be shared (or redistributed) are usually licensed under the
    *Creative Commons Zero* (https://creativecommons.org/).


    Some computer and web software is free under a license called “General Public
    License” (or GPL for short). This software is called “open source,” meaning that
    anyone can use or manipulate the source code any way he or she wants.


    Copyright and intellectual property law is a serious issue and there are legal
    consequences for using other people’s work without their permission. I encourage
    you to read more about copyright on Wikipedia (https://en.wikipedia.org/wiki/Copyright).
    I also ask that if you use a photo, video, or text from another web site, you
    list your sources (just be sure you are allowed borrow this content!) either in
    the footer or on a special page on your web site. If you have any questions about
    copyright, ask an adult to help you find out more.


    # ABOUT YOU


    Every junior webmaster needs to start somewhere, but this book assumes that you
    have the ability to


    +   - Type on a computer, use a mouse, and follow directions.

    +   - Have an email address and Google account. Several of the projects in this
    book require you to sign up for a (free) account to access services and tools.
    Please get an adult’s permission first!

    +   - Not be afraid to fail. Nobody is perfect, and not a single person became
    a web professional without first making lots (of) mistakes.'
  - '[PAGE 9]


    Finally, spelling and formatting is important. Computers are really powerful,
    but they are actually pretty dumb and very picky about how their instructions
    are written. If a computer can''t understand a command, it won''t know what to
    do and nothing will happen. You may need to spend some extra time working through
    spelling and formatting errors.


    # ## ABOUT THE ICONS


    As you read through the projects in this book, you''ll see a few icons. The icons
    point out different things:


    ![](img/b129720fc9ac9e14546b8756740d362a_9_0.png)


    *This icon points out tips that can make your projects run more smoothly.*


    ![](img/b129720fc9ac9e14546b8756740d362a_9_1.png)


    *This icon alerts you to information that you''ll want to remember.*


    ![](img/b129720fc9ac9e14546b8756740d362a_9_2.png)


    *This icon marks important information that you can use to avoid common pitfalls
    when coding.*


    # ## FURTHER READING


    Some of the concepts for writing code are covered in another book written for
    kids like you: Getting Started with Coding, by Camilla McCue, and Writing Computer
    Code, by Chris Minnick and Eva Holland.


    You are going to be learning a lot about Google Drive, programming languages,
    and being creative. I recommend that you seek help from online tutorials, YouTube
    videos, and web sites such as www.w3schools.com or thewecan.zone/website-building
    any time you get stuck. And don''t ever be afraid to ask for help from a parent
    or friend! The best webmasters are ones who talk with other people.'
  - '[PAGE 10]


    # # PROJECT 1 CHOOSE A TOPIC


    ![](img/b129720fc9ac9e14546b8756740d362a_10_0.png)


    **FINDING A SINGLE TOPIC OR IDEA FOR YOUR WEB SITE TO FOCUS ON CAN BE DIFFICULT.**
    In fact, it can be the single most difficult part of building a web site. Inspiration
    is a funny thing; it can come from anywhere and nowhere! Sometimes coming up with
    a topic can take days or weeks.


    Don''t be discouraged if you can''t choose something quickly. You don''t want
    to create a web site about a topic that really doesn''t interest you, only to
    then feel that you have to stick with it. To help you avoid that situation, here
    are some techniques to focus your energy on just one topic.


    # ## BUILD A WORD CLOUD


    Grab a pencil and notepad and start writing down your favorite things to do. If
    you''re really into Pokémon, go ahead and write that down. If you enjoy studying
    dinosaurs, write that down, too.


    Do you participate in extracurricular activities such as karate class, ballet,
    or soccer, or maybe you can play an instrument? Having experience with a particular
    topic provides a solid foundation that makes creating fun and engaging content
    easier.'
