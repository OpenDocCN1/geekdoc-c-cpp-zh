  - '[PAGE 13]


    # HOW TO SEARCH WITH GOOGLE.COM


    Follow these steps to perform a search on Google:


    +   1. **Open a web browser.**


    A web browser is an application that lets you search the Internet and visit web
    sites. Common web browsers are Microsoft Edge, Google Chrome, Mozilla Firefox,
    and Safari. Which one do you use on your computer?


    ![](img/b129720fc9ac9e14546b8756740d362a_13_0.png)


    +   2. **In the address bar, type** `https://google.com/` **and then press** **Enter**.


    ![](img/b129720fc9ac9e14546b8756740d362a_13_1.png)


    A search box appears near the middle of the Google home page.


    +   3. **Type search words in the search box.**


    If you wanted to write a web site about dinosaurs, you could type **dinosaurs**
    in this box. Google automatically performs a search and displays results immediately.'
  - '[PAGE 14]


    ![](img/b129720fc9ac9e14546b8756740d362a_14_0.png)


    **4** Click the blue-colored links to view the web site.


    > *While you are looking at other web sites for inspiration, pay close attention
    to their layout, the colors, photos, and content. You might just stumble upon
    something that you might want to use on your web site. Think about how could you
    do it similarly — but without copying that web site.*


    # HOW TO SEARCH USING SIMILARSITES.COM


    Another great resource for finding topics is a web site service called Similar
    Sites. Much like Google, it is a search engine that helps you find web sites that
    contain similar information.


    +   **1** Open a web browser.


    By now, you should know how to open a web browser and enter web addresses. If
    you still need help from an adult, don’t worry! It just takes a little practice.'
  - '[PAGE 15]


    +   2. In the address bar, type http://similarsites.com/ and then press Enter.


    In the middle of the home page, you see a **large search box**.


    ![](img/b129720fc9ac9e14546b8756740d362a_15_0.png)


    +   3. In the **search box**, type the topic or idea (such as dinosaurs) and press
    Enter.


    ![](img/b129720fc9ac9e14546b8756740d362a_15_1.png)


    You see a list of web sites. Click the results to view the web site.'
  - '[PAGE 16]


    <!-- no content -->'
  - '[PAGE 17]


    # # PROJECT 1 CHOOSE A TOPIC


    ![](img/b129720fc9ac9e14546b8756740d362a_17_0.png)


    # ## DECIDE WHOM YOU WANT TO TALK TO


    Almost as important as the topic is deciding whom you want to reach as an audience.
    Do you want to create a web site for your family? Maybe classmates or teammates?
    If you''re writing content about dinosaurs for your classmates, think about how
    you would explain information to them in person.


    Talking to your friends about your topic can really help you narrow down your
    ideas. It can also help you come up with some of your content!


    If your topic interests only you, it is probably not worth writing about. A good
    web site keeps the reader in mind at all times. This often means choosing topics
    that haven''t been written about too much, and maybe choosing a more current topic.


    ![](img/b129720fc9ac9e14546b8756740d362a_17_1.png)


    > Don''t be afraid to ask an adult for help with ideas. Chances are, an adult
    you''re close to has had to find a topic for a school or college essay. I''m sure
    that an adult in your life would love to help you figure out your topic.'
  - '[PAGE 18]


    # # PROJECT 2 CREATE A SITE MAP


    ![](img/b129720fc9ac9e14546b8756740d362a_18_0.png)


    **WHAT EXACTLY IS A SITE MAP?** Just as a regular ol'' map will help you find
    your way, a site map helps search engines, like Google, find their way around
    your web site. A site map can also be a document for displaying a list of pages
    in a web site. In this project, you will learn how to create a site map, which
    will help you think about how you want to structure your content.


    # ## DECIDE HOW YOU WANT TO LAY OUT YOUR CONTENT


    Now that you have a topic, it''s time to focus on how you want to lay it out.
    Web sites all have a home page, which is a great place to start your site map.
    For example, if you are creating a web site about dinosaurs, here are some pages
    and sections you might see:


    +   - Home Page

    +     - Dinosaur Timeline

    +       - Jurassic Area

    +       - Triassic Area'
