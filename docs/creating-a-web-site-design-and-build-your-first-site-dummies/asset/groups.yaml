    \ you have three colors for your web site and their HEX codes. You're ready to\
    \ build a color palette in Frontify! A color palette is simply a place where you\
    \ show a little bit of each color that will be in your web site.\n\n- 1. Back\
    \ in Frontify, you should see the Color page.\n\n![](img/b129720fc9ac9e14546b8756740d362a_47_1.png)\n\
    \n- 2. If you closed your Frontify browser tab, open your web browser, type [https://frontify.com/](https://frontify.com/),\
    \ and press the Enter key.\n\n- 3. Click the **Login** button near the top right.\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_48_0.png)\n\n- 4. You will see the\
    \ Frontify brand dashboard. Click your **brand tile**.\n\n![](img/b129720fc9ac9e14546b8756740d362a_48_1.png)\n\
    \n- 5. On the left side of the screen, click the link to **Colors**.\n\n![](img/b129720fc9ac9e14546b8756740d362a_48_2.png)\n\
    \n- 6. In the top-right corner, click **Edit**, and you will see the page in Step\
    \ 1.\n\n![](img/b129720fc9ac9e14546b8756740d362a_49_0.png)\n\nThis turns on the\
    \ Frontify editor, which lets you add the **colors** that you chose on ColorHexa\
    \ and finish making your style guide.\n\n- 7. Scroll down with your mouse and\
    \ look for the grayed-out section called **New Color Palette**, which has **four\
    \ grayed-out circles** in it.\n\n![](img/b129720fc9ac9e14546b8756740d362a_49_1.png)\n\
    \n- 8. Look for the **input field** underneath the four grayed-out circles, like\
    \ the one shown with this step. It will have some example color HEX codes in it.\
    \ This is where you enter the color HEX codes that you wrote down from ColorHexa.\
    \ (If the input field isn't showing, go back up and click the Edit button again.)\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_50_0.png)\n\n- 9. Type the **color\
    \ HEX code** for your Primary Color into the input field.\n\n![](img/b129720fc9ac9e14546b8756740d362a_50_1.png)\n\
    \n- 10. Press the Enter key to save your work, and you will see your Primary Color\
    \ fill in the grayed-out circle above the input field.\n\n![](img/b129720fc9ac9e14546b8756740d362a_50_2.png)\n\
    \nGoogle Fonts is a free resource that allows users to choose and freely use different\
    \ fonts on their web sites. Google Fonts has even taken the hard work out of font\
    \ pairing. You can easily see a popular font combination and even see contrast\
    \ between headlines and paragraph text.\n\n![](img/b129720fc9ac9e14546b8756740d362a_52_0.png)\n\
    \n> *Google Fonts isn't the only option for viewing free fonts. You can also look\
    \ at the Open Font Library at https://openfontlibrary.org/ or FontSquirrel https://fontsquirrel.com/.*\n\
    \nThe following process of finding fonts in Google Fonts can take a little time.\
    \ Don't be afraid to look through a few different fonts.\n\n- 1. Open your web\
    \ browser, type https://fonts.google.com/, and press Enter.\n- 2. Scroll down.\
    \ Look for an appealing font.\n  - This step is up to you. You can choose any\
    \ font you like! I choose Open Sans.\n- 3. After you have found a font you like,\
    \ click the font's name in the upper-left corner of its area on the screen. You\
    \ are taken to the font's information page, where you can see a specimen of that\
    \ font — that is, what it looks like.\n\n![](img/b129720fc9ac9e14546b8756740d362a_52_1.png)\n\
    \nThis figure shows two fonts: one for the heading and one for the paragraph.\
    \ You can play around with choosing fonts that go well together! For this book,\
    \ you concentrate on choosing one.\n\n![](img/b129720fc9ac9e14546b8756740d362a_54_0.png)\n\
    \n- 4. Click Typography and you should see the screen in Step 1.\n- 5. There is\
    \ a search bar with different tabs, and the one that is already clicked is the\
    \ Google tab. Type your font into the search bar and select the style you want\
    \ from the list that appears.\n\n![](img/b129720fc9ac9e14546b8756740d362a_54_1.png)\n\
    \nAwesome! You've successfully added your font to Frontify. If you scroll down,\
    \ you should see your font in a few different styles, like *italics* and **bold**.\n\
    \nJust as the colors you chose in the previous section are in your style guide,\
    \ now the font is part of your style guide as well. At the end of this project,\
    \ when you’re done with your style guide, you will use it as a guideline for actually\
    \ making your web site!\n\n### FINDING AND USING MEDIA FROM THE WEB\n\nCreating\
    \ your own media can be fun, but sometimes drawing a lifelike image of a T-rex,\
    \ well, it just doesn’t make sense. Instead you could search for and use an image\
    \ that someone else drew or photographed. This is a common practice and is referred\
    \ to as using stock photography.\n\nYou have to follow some basic rules when you\
    \ use someone else’s images on your web site. The first rule is about the copyright\
    \ (which I mention in this book’s introduction). To use an image on your web site\
    \ that you did not create, you need to make sure that the following is true: The\
    \ media is licensed as public domain (CC0). Public domain means that the image\
    \ is free for you to use, and you don’t have to ask permission or say where the\
    \ media came from. This is also called the Creative Commons license.\n\n![](img/b129720fc9ac9e14546b8756740d362a_55_0.png)\n\
    \n> If you’re not sure about licenses and what they mean, (it can be very confusing),\
    \ you can read more about it at the Creative Commons (https://creativecommons.org/share-your-work/licensing-types-examples/).\n\
    \nMy favorite web site for finding creative commons photos is VisualHunt (https://visualhunt.com).\
    \ VisualHunt searches hundreds of stock photos for you, making it easy to get\
    \ just the right photo.\n\n### USING VISUALHUNT TO FIND FREE STOCK PHOTOS\n\n\
    To finish up your style guide, you need to find a few images and place them into\
    \ Frontify.\n\n- 1. Open your web browser, type **visualhunt.com**, and press\
    \ the Enter key.\n- 2. Place your cursor in the **search box** and type what you\
    \ are looking for.\n\n![](img/b129720fc9ac9e14546b8756740d362a_56_0.png)\n\nVisualHunt\
    \ should return a few **images**.\n\n![](img/b129720fc9ac9e14546b8756740d362a_56_1.png)\n\
    \n## **PROJECT 4** CREATE A STYLE GUIDE\n\n- 3. Just above the images, a License\
    \ Type filter appears. Move your mouse cursor over **Public Domain** and click.\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_57_0.png)\n\nNotice how VisualHunt\
    \ now displays only Public Domain images. These are free to use in any way you\
    \ want.\n\n- 4. Click the image you want to add to your web site.\n- 5. Move your\
    \ mouse cursor to the right side of the web page. Click **Download for Free**.\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_57_1.png)\n\n- 6. Select the **large\
    \ size option** (usually shown as L for large).\n\n![](img/b129720fc9ac9e14546b8756740d362a_58_0.png)\n\
    \n- 7. The file automatically saves to your computer when you click the big **Download\
    \ button**.\n\n### ADD PHOTOS TO FRONTIFY\n\nThe previous section shows you how\
    \ to get photos for your web site downloaded to your computer. In this section,\
    \ you add them to Frontify. Getting them into Frontify is the last step in creating\
    \ your style guide! Follow these steps:\n\n- 1. If you don't already have Frontify\
    \ open, type [https://frontify.com/](https://frontify.com/) in your browser and\
    \ press the Enter key.\n- 2. Click the **Login** button at the top right. Then\
    \ click the brand tile and then click the **Edit** button near the top right.\n"
  mdcn: "\n- 6. 用鼠标继续向下滚动，直到看到**配色方案，带有**（后面跟着你主色的 HEX 代码）。\n\n![](img/b129720fc9ac9e14546b8756740d362a_46_0.png)\n\
    \n- 7. 将鼠标悬停在右侧的**互补色**上，直到出现一个 HEX 代码。这个互补色称为次色。\n\n![](img/b129720fc9ac9e14546b8756740d362a_46_1.png)\n\
    \n- 8. 也在纸上记下次色及其 HEX 代码。\n\n- 9. 移动鼠标光标，悬停在主色左侧的第一个类似色上。该颜色称为第三色。\n\n![](img/b129720fc9ac9e14546b8756740d362a_47_0.png)\n\
    \n- 10. 在纸上记下第三色及其 HEX 代码。\n\n太棒了！这是创建网站的重要一步。现在你可以把这些颜色放进样式指南了。\n\n### 向 FRONTIFY\
    \ 添加调色板\n\n到目前为止，你已经为网站选好了三种颜色及其 HEX 代码。你准备好在 Frontify 中构建调色板了！调色板就是一个展示网站中将使用的每种颜色小样的地方。\n\
    \n- 1. 回到 Frontify，你应该会看到“颜色”页面。\n\n![](img/b129720fc9ac9e14546b8756740d362a_47_1.png)\n\
    \n- 2. 如果你关闭了 Frontify 浏览器标签页，请打开浏览器，输入 [https://frontify.com/](https://frontify.com/)，然后按\
    \ Enter 键。\n\n- 3. 点击右上角附近的**登录**按钮。\n\n![](img/b129720fc9ac9e14546b8756740d362a_48_0.png)\n\
    \n- 4. 你会看到 Frontify 品牌仪表板。点击你的**品牌磁贴**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_48_1.png)\n\
    \n- 5. 在屏幕左侧，点击指向**颜色**的链接。\n\n![](img/b129720fc9ac9e14546b8756740d362a_48_2.png)\n\
    \n- 6. 在右上角，点击**编辑**，你将看到第 1 步中的页面。\n\n![](img/b129720fc9ac9e14546b8756740d362a_49_0.png)\n\
    \n这会开启 Frontify 编辑器，让你添加在 ColorHexa 上选择的**颜色**，并完成样式指南的制作。\n\n- 7. 用鼠标向下滚动，寻找名为**新建调色板**的灰色区域，其中有**四个灰色圆圈**。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_49_1.png)\n\n- 8. 在四个灰色圆圈下方寻找**输入框**，就像本步骤中显示的那样。其中会有一些示例颜色\
    \ HEX 代码。你可以在这里输入从 ColorHexa 记下的颜色 HEX 代码。（如果输入框没有显示，请向上滚动并再次点击“编辑”按钮。）\n\n![](img/b129720fc9ac9e14546b8756740d362a_50_0.png)\n\
    \n- 9. 在输入框中输入主色的**颜色 HEX 代码**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_50_1.png)\n\
    \n- 10. 按 Enter 键保存你的工作，你会看到主色填入输入框上方的灰色圆圈中。\n\n![](img/b129720fc9ac9e14546b8756740d362a_50_2.png)\n\
    \nGoogle Fonts 是一个免费资源，允许用户选择并自由使用不同字体到他们的网站上。Google Fonts 甚至免去了字体搭配的繁琐工作。你可以轻松看到一种流行的字体组合，甚至看到标题与段落文本之间的对比。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_52_0.png)\n\n> *Google Fonts 并不是查看免费字体的唯一选择。你还可以查看\
    \ Open Font Library（https://openfontlibrary.org/）或 FontSquirrel（https://fontsquirrel.com/）。*\n\
    \n在 Google Fonts 中查找字体的以下过程可能会花一点时间。不要害怕多浏览几种不同字体。\n\n- 1. 打开浏览器，输入 https://fonts.google.com/，然后按\
    \ Enter。\n- 2. 向下滚动。寻找一种吸引你的字体。\n  - 这一步由你决定。你可以选择任何你喜欢的字体！我选择 Open Sans。\n- 3.\
    \ 找到你喜欢的字体后，点击屏幕上该字体区域左上角的字体名称。你会进入该字体的信息页面，在那里可以看到该字体的样张——也就是它的外观。\n\n![](img/b129720fc9ac9e14546b8756740d362a_52_1.png)\n\
    \n此图展示了两种字体：一种用于标题，一种用于段落。你可以尝试选择搭配得当的字体！在本书中，你只需专注于选择一种字体。\n\n![](img/b129720fc9ac9e14546b8756740d362a_54_0.png)\n\
    \n- 4. 点击“排版”，你应该会看到第 1 步中的屏幕。\n- 5. 有一个带有不同标签页的搜索栏，其中已经选中的是 Google 标签页。在搜索栏中输入你的字体，并从出现的列表中选择你想要的样式。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_54_1.png)\n\n太棒了！你已成功将字体添加到 Frontify。如果向下滚动，你应该会看到字体以几种不同样式显示，如*斜体*和**粗体**。\n\
    \n正如你在上一节选择的颜色已经进入样式指南，现在字体也成为样式指南的一部分。在这个项目结束时，当你完成样式指南后，你将把它作为实际制作网站的指南！\n\n\
    ### 从网络上查找并使用媒体\n\n创建自己的媒体素材可能很有趣，但有时画一幅逼真的霸王龙图像，嗯，这并不合理。相反，你可以搜索并使用别人绘制或拍摄的图像。这是一种常见做法，称为使用图库摄影。\n\
    \n当你在网站上使用别人的图像时，必须遵循一些基本规则。第一条规则与版权有关（我在本书引言中提到过）。要在网站上使用并非由你创建的图像，你需要确保以下条件成立：该媒体素材以公有领域（CC0）许可授权。公有领域意味着该图像可免费供你使用，你不必请求许可，也不必说明媒体来源。这也称为知识共享许可协议。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_55_0.png)\n\n> 如果你不确定许可证及其含义（这可能会非常令人困惑），可以在\
    \ Creative Commons（https://creativecommons.org/share-your-work/licensing-types-examples/）了解更多。\n\
    \n我最喜欢的查找知识共享照片的网站是 VisualHunt（https://visualhunt.com）。VisualHunt 为你搜索数百张图库照片，让你轻松找到合适的照片。\n\
    \n### 使用 VISUALHUNT 查找免费图库照片\n\n要完成样式指南，你需要找几张图像并将它们放入 Frontify。\n\n- 1. 打开浏览器，输入\
    \ **visualhunt.com**，然后按 Enter 键。\n- 2. 将光标放在**搜索框**中，输入你要查找的内容。\n\n![](img/b129720fc9ac9e14546b8756740d362a_56_0.png)\n\
    \nVisualHunt 应返回几张**图像**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_56_1.png)\n\
    \n## **项目 4** 创建样式指南\n\n- 3. 在图像上方会出现“许可证类型”筛选器。将鼠标光标移到**公有领域**上并点击。\n\n![](img/b129720fc9ac9e14546b8756740d362a_57_0.png)\n\
    \n注意 VisualHunt 现在只显示公有领域图像。这些图像可以以任何方式免费使用。\n\n- 4. 点击你想添加到网站的图像。\n- 5. 将鼠标光标移到网页右侧。点击**免费下载**。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_57_1.png)\n\n- 6. 选择**大尺寸选项**（通常显示为\
    \ L，代表大）。\n\n![](img/b129720fc9ac9e14546b8756740d362a_58_0.png)\n\n- 7. 当你点击大的**下载按钮**时，文件会自动保存到你的电脑。\n\
    \n### 向 FRONTIFY 添加照片\n\n上一节向你展示了如何将网站所需的照片下载到电脑。本节中，你将把它们添加到 Frontify。将它们放入 Frontify\
    \ 是创建样式指南的最后一步！请按照以下步骤操作：\n\n- 1. 如果你还没有打开 Frontify，请在浏览器中输入 [https://frontify.com/](https://frontify.com/)，然后按\
    \ Enter 键。\n- 2. 点击右上角的**登录**按钮。然后点击品牌磁贴，再点击右上角附近的**编辑**按钮。\n\n"
