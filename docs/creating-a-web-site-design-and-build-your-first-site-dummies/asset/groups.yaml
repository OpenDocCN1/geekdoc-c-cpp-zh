    \ to My Web Page\n  </h1>\n  <p>\n   This is my first web page.\n  </p>\n </body>\n\
    </html>\n```\n\n- 5. 将你的样式更改为你选择的颜色和字体，然后看着你的网站开始焕发生机。\n\n- 6. 太棒了！你已经取得了这么好的进展。接下来，确保你理解其他部分所在的位置。将\
    \ header 和 footer 改为样式指南中的**次要颜色**。在本书中，次要颜色是蓝色。\n\n```html\n<!doctype html>\n\
    <html>\n <head>\n  <title>\n   First Test Page\n  </title>\n  <meta charset=\"\
    utf-8\">\n  <style>\n   body {\n    background-color: orange;\n   }\n   header\
