    \n### LINK YOUR CSS FILE TO YOUR HTML FILE\n\nNow that your style code is in its\
    \ own file, you need to tell your HTML file where it can find the style code.\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_107_1.png)\n\n> This is going to be\
    \ a little strange. You have to get the URL exactly right for it to work properly,\
