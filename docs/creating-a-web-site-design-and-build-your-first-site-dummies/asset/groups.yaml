    \n- **9.** 当你单击 **保存** 时，你应该会看到四个文件都是公开的。单击 **完成**。\n\n![](img/b129720fc9ac9e14546b8756740d362a_94_0.png)\n\
    \n- **10.** 右键单击你的某个新页面，例如 types.html，然后单击“打开方式”，再单击“HTML 查看器”。\n\n![](img/b129720fc9ac9e14546b8756740d362a_94_1.png)\n\
    \n## 项目5 让你的设计栩栩如生\n\n- **11.** 你应该会看到与主页（index.html）相同的内容，因为你还没有更改新页面的外观——你只是复制了主页。目前这样没问题。\n\
    \n![](img/b129720fc9ac9e14546b8756740d362a_95_0.png)\n\n- **12.** 在地址栏中，单击并高亮显示\
    \ URL，然后在 Windows 上按 Ctrl+C，或在 Mac 上按 ⌘-C 来复制它。\n- **13.** 回到你的 index.html 文件。如果你关闭了它，可以右键单击\
    \ index.html，然后单击“打开方式”，再单击“HTML 编辑器”来重新打开它。\n- **14.** 找到你的页眉，并输入链接的 HTML 代码：`<a\
    \ href=YOUR_URL_HERE> </a>`。（不要输入句号。）\n\n```html\n31-  <header>\n32-    <iframe\
    \ src=\"https://drive.google.com/file/d/0B87t6P68R_Xt2d5Dv-fZGZ0pWT0lk/\n    \
    \  preview\" width=\"280\" height=\"140\"></iframe>\n33-    <a href=\"YOUR_URL_HERE\"\
    >Types of Dinosaurs</a>\n34-  </header>\n```\n\n- **15.** 用你在步骤12中复制的 URL 替换 YOUR_URL_HERE。在\
    \ Windows 上按 Ctrl+V，或在 Mac 上按 ⌘-V 来完成此操作。\n\n```html\n31-  <header>\n32-    <iframe\
    \ src=\"https://drive.google.com/file/d/0B87t6P68R_Xt2d5Dv-fZGZ0pWT0lk/\n    \
