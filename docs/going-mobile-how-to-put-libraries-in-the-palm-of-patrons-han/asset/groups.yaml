    side; click on New App ID and fill in the information for your app.


    Next, click on Provisioning at the left side of the screen and select New Profile.
    Once you’ve created the profile, download it to your computer. In the next few
    steps, we will match the profile to the key that you’ll generate for the iPhone
    or iPod that you wish to test the app on.


    After you have created your provisioning profile, you’ll want to return to the
    Xcode Organizer (located in the Window menu) to pull the product identifier from
    your device (figure 6.10). Once you’ve plugged in the device and opened the organizer,
