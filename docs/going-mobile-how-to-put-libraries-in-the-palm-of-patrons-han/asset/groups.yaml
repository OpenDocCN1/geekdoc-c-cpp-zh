    # WYSIWYG APP EDITORS


    Mobile app development is a powerful library tool that every library should try
    out in some capacity, but not every library will have the time and/or resources
    to make it happen. For this reason, it''s worth noting some alternate solutions.
    The disadvantage of using the alternates is their cost and, in most cases, the
    limited ability they offer to customize apps. Their advantages are that they will
    help you set up much quicker and nearly guarantee that your app will make it into
    an app store.


    Some of the tools listed here will basically build an app for you; others provide
    an easy WYSIWYG interface. All are available for the iPhone; most are available
    for Android; some are available for BlackBerry and other mobile devices.


    The up-front costs of these interfaces can be expensive, but the cost is next
    to nothing compared with what you would pay a programmer to take on the project.


    # Appanda


    Website: www.appanda.com

    Platform: Do-it-yourself (DIY) app solution for iPhone and Android

    Summary: Appanda is best for libraries that want to feature only iPhone and/or
    Android versions of already-existing content (e.g., feeding in a blog or a video
    hosted on YouTube).

    Pricing: $29.99 per month plus a onetime activation fee of $99


    # Swebapps


    Website: www.swebapps.com

    Platform: iPhone

    Summary: The interface is a bit more visually appeasing than some do-it-yourself
    apps that feature a boxier look. Swebapps has all the same features as other DIY
    builders but also incorporates tools to create forms, lists, maps, and events
    pages.

    Pricing: Basic plan starts at $29 a month, plus a $399 onetime fee


    # AppBreeder


    Website: www.appbreeder.com

    Platform: iPhone and web app

    Summary: There are no up-front fees, but the site is limited in terms of customization
    and has a very generic look.

    Pricing: $29-$49 per month for iPhone app or free web app


    # My App Builder


    Website: www.myappbuilder.com

    Platform: iPhone and Android

    Summary: There are no up-front fees, but the website offers few screen shots and
    few details about features.

    Pricing: $29 per month'
