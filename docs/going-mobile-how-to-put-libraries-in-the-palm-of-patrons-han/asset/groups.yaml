  mdcn: "\n\n## WYSIWYG 应用编辑器\n\n移动应用开发是一项强大的图书馆工具，每家图书馆都应该在某种程度上尝试，但并非每家图书馆都有时间和/或资源来实现这一点。因此，值得注意一些替代解决方案。使用替代方案的缺点是其成本以及在大多数情况下对其进行自定义的能力有限。其优点是它们可以帮助你更快地设置，并且几乎可以保证你的应用进入应用商店。\n\
    \n这里列出的一些工具基本上会为你构建一个应用；其他工具提供易用的 WYSIWYG 界面。所有工具都适用于 iPhone；大多数适用于 Android；一些适用于\
    \ BlackBerry 和其他移动设备。\n\n这些界面的前期成本可能很昂贵，但与请程序员承担该项目相比，成本几乎可以忽略不计。\n\n### Appanda\n\
    \n- **网站：** www.appanda.com\n- **平台：** 面向 iPhone 和 Android 的 DIY 应用解决方案\n- **摘要：**\
    \ Appanda 最适合希望仅展示已存在内容的 iPhone 和/或 Android 版本的图书馆（例如，引入博客或托管在 YouTube 上的视频）。\n\
    - **定价：** 每月 $29.99，外加一次性激活费 $99\n\n### Swebapps\n\n- **网站：** www.swebapps.com\n\
    - **平台：** iPhone\n- **摘要：** 界面比一些具有更方正外观的 DIY 应用更具视觉吸引力。Swebapps 具有其他 DIY 构建器的所有相同功能，但还整合了创建表单、列表、地图和活动页面的工具。\n\
    - **定价：** 基础计划每月起价 $29，外加 $399 一次性费用\n\n### AppBreeder\n\n- **网站：** www.appbreeder.com\n\
    - **平台：** iPhone 和网页应用\n- **摘要：** 没有前期费用，但该网站在定制方面有限，且外观非常通用。\n- **定价：** iPhone\
    \ 应用每月 $29-$49 或免费网页应用\n\n### My App Builder\n\n- **网站：** www.myappbuilder.com\n\
    - **平台：** iPhone 和 Android\n- **摘要：** 没有前期费用，但网站提供的截图很少，对功能介绍也很少。\n- **定价：** 每月\
    \ $29\n\n### Build an App\n\n- **网站：** www.buildanapp.com\n- **平台：** BlackBerry、Android、Windows\
    \ Mobile、Mobile Web、iPhone\n- **摘要：** 可在大多数应用构建器中更多的设备上使用，且价格比大多数便宜，但应用外观非常通用，且在定制方面有限。\n\
    - **定价：** 所有应用每月 $14 和 $19 设置费，但 iPhone 应用需要 $199 设置费\n\n### Mobile App Loader\n\
    \n- **网站：** www.mobileapploader.com\n- **平台：** iPhone、iPad 和 Android\n- **摘要：**\
    \ 这不是最好的应用构建器外观，但费用低，且是少数兼容 iPad 的之一。不要被价格迷惑；额外的按钮和功能会产生额外费用。此外，定制空间也不多。\n- **定价：**\
    \ 每月 $4.99 和 $59.99 设置费\n\n### Game Salad\n\n此 DIY 编辑器用于游戏。它不适合图书馆，但可能值得为青少年考虑。让青少年构建游戏的程序将是一个很棒的项目。最棒的是，它是免费的！不幸的是，需要\
    \ Mac（http://gamesalad.com/landing/overview）。\n\n## GOOGLE APP INVENTOR\n\n几年前，应用开发者的情况更为复杂——PhoneGap\
    \  certainly 帮助消除了移动应用开发的复杂性。过去一年中，数十家虚拟公司涌现出来，承诺协助希望进入移动领域但缺乏编程技能的用户。在本节中，我讨论\
    \ Google 的 App Inventor（http://appinventor.googlelabs.com）。\n\n根据我的经验，为 iPhone\
    \ 开发应用比为 Android 开发要简单得多；苹果在应用开发上花费了更多资金，其呈现和 SDK 功能上显而易见。Google 仍在追赶。如果你想使用 PhoneGap\
    \ 开发应用，请参阅附录，其中列出了在网上获取教程的地点。Google App Inventor 与传统的应用开发方法完全不同，因此值得在此说明它是什么以及它如何工作。\n\
    \nApp Inventor 于 2010 年 7 月 12 日首次发布；该工具声称简单到小学儿童几乎无需努力即可使用。界面使用拖放对象来创建可在任何 Android\
    \ 手机上运行的应用。\n\n由于 App Inventor 的简单性，很难开发出视觉上令人惊艳的应用。它是测试移动开发并决定图书馆最佳实践的绝佳场所。随着\
    \ Google 不断改进拖放开发者，其使用将变得更加容易且功能更强大。\n\n## INDEX\n\n### A\n\n- absolute positioning\
