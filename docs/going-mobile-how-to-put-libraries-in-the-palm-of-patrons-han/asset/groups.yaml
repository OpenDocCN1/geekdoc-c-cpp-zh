    # SETTING UP THE DOMAIN


    Mobile websites are housed in a separate part of your server from your main site.
    In most cases, the site name will simply have “mobile” added on at the beginning
    of the domain. For example, the mobile version of the URL YourLibrary.com would
    be Mobile.YourLibrary.com. The “Mobile” directory holds all the files required
    to display your mobile site. This type of organization also makes things easier
    on your information technology staff, because the “Mobile” directory is a convenient
    way to deal with a site.


    Once your domain is set up and ready to go, the hard work begins.


    # UNDERSTANDING THE PROCESS


    Most of the process of designing a mobile website involves simplifying and reformatting
    the information and features that appear on your main website. This means that,
    to build a mobile website, you first need to prepare the text and images for the
    site so that they fit the site’s format.


    # MOBILE WEB VERSUS STANDARD WEB


    Everything on your mobile website will be slightly different from how it appears
    on your regular website. This is inevitable. Although there are some features
    that your users will expect from your website, some of what you offer on your
    main site is impractical for mobile users. It’s important to remember that you’re
    trying to replicate the functionality and content of your regular website as much
    as possible on your mobile site. You’re not simply duplicating your main website
    and putting it in your mobile directory.'
