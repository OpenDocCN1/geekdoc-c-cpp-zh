    # OTHER WAYS

    TO GO MOBILE


    The point of this book is to show librarians how simple it can be to develop mobile
    applications. For the most part, mobile apps run on smartphones. However, librarians
    can also proactively investigate other mobile application programming interfaces
    (APIs).


    Foursquare (for documentation information, see http://groups.google.com/group/foursquare-api/web/api-documentation/),
    which some bill as the next Twitter, is a location-based social media app that
    allows people to tell their friends exactly where they are and become “mayors”
    of locations they visit frequently. Gowalla (http://gowalla.com) is another social
    website like Foursquare that’s growing in popularity; unlike Foursquare, though,
    Gowalla offers a little more in terms of customization.


    When thinking about mobile apps, libraries should think of as many free technologies
    as possible for promotion—Foursquare and Yelp already have apps that you can easily
    link to. If your library has not staked its claim on Foursquare, why not? It’s
    a perfect avenue for promotion—people can check into the library with the library
    app and get something for free—free videos, reduced fines, small prizes, and so
    on.


    Some of the best social media sites that work on mobile phones are the same ones
    that are most popular on the Web: Facebook, Twitter, YouTube, and Flickr. If your
    library doesn’t have a Facebook fan page, it’s time. This is true too, though
    to a lesser extent, with the other three. What better way to showcase your library
    programming than with videos and photos? What’s great about all the social media
    sites is that they are integrated together—you can feed Twitter updates into Facebook
    and share YouTube videos and Flickr slide shows instantly on Twitter and Facebook.
    The best thing about these sites, however, is that you don’t have to do anything
    to go mobile. If you have a page on Twitter or Facebook, it’s already mobile compatible—no
    extra steps are required.


    Librarians don’t give you answers—they merely point you in the right direction.
    Your app should work the same way. Save yourself time and trouble by finding code
    that’s already finished. I hope you decide to develop a mobile app, but at the
    very least, I hope you make sure that your library is actively involved in the
    mobile technologies mentioned here.'
