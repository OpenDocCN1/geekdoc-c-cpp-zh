    ![](img/1c33fb3bae0a705f04846bc77d279fd7_41_0.png)


    iPhone 应用的结构已经创建好了，所以你现在要做的只是把你的移动 Web 应用套进一个现成的模板里。然后，你可以把你所有的移动 Web 应用文件拖放到
    WWW 目录中（图 6.3）。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_41_1.png)


    你的第一个 iPhone 应用现在已经完成了！没错，就是这么简单！虽然还有一些小调整要处理，但这里的描述应该能让你很好地了解到，开始为 iPhone 开发应用到底有多容易。


    要想看到你的应用运行起来，回到 PhoneGap 和 iPhone 目录，打开文件“PhoneGap.xcodeproj”。这将启动 Xcode，即 iPhone
    开发者软件（图 6.4）。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_42_0.png)


    # 图 6.4


    接下来，点击 Xcode 左上角的下拉菜单，确保它设置为“Debug”，然后选择你要运行的模拟器。最好选择最新的模拟器（iPhone 4.0），因为那是大多数人会拥有的设备。最好还要确保模拟器能在所有平台上运行。例如，如果你选择
    iPad 作为模拟器，它会以 iPhone 应用（而不是 iPad 应用）的形式运行应用，如此一来，应用看起来会比正常情况小很多（图 6.5）。现在你已经准备好构建应用了。点击“Build
    and Run”按钮。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_42_1.png)


    # 图 6.5


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_42_2.png)


    大约十秒钟后，模拟器会启动，你的应用就会出现了。如果它没有启动，而且你在屏幕右下角看到红色或黄色的标记，请点击这些标记查看信息。在应用第一次加载时，你会注意到两件事。第一，图标是
    PhoneGap 的；第二，加载图片上写着“PhoneGap”。让我们来看看如何移除这两张图片，并用图书馆的图片替换它们。关闭 Xcode 程序和模拟器。现在，让我们来制作一个
    iPhone 应用图标。这很简单。创建一个大小为 57 × 57 的图像；用文件名“icon.png”保存图片。把你创建的文件移到 PhoneGap 和 iPhone
    目录中。该文件会替换已经创建好的“icon.png”，并替换为你新的图标。接下来，让我们更改启动画面。重复创建图标的步骤，只不过这次把你的图片命名为“Default.png”，并确保它具有以下尺寸：320
    × 480。把这张图片移到 PhoneGap 和 iPhone 目录中。


    在再次启动 Xcode 应用之前，将“PhoneGap.xcodeproj”重命名为你的实际应用名称（例如“libraryapp.xcodeproj”）；就我们的情况而言，我们用“library.xcodeproj”作为文件名。重命名后，再次打开该文件，这会重新启动
    Xcode 软件。


    此时，你的图标和启动画面已经改变了，但图标下面还是会显示“PhoneGap”。要更改显示的名称，请点击打开窗口中的 Config 目录（图 6.6）。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_0.png)


    图 6.6


    这会在屏幕右下角弹出一个新窗口（图 6.7）。在“Bundle display name”下，点击 PhoneGap，然后输入你想要显示的名称。就我们的情况而言，我使用了“Library
    App”这个名称。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_1.png)


    图 6.7


    在再次于模拟器中加载你的应用之前，转到屏幕顶部，点击 Build，然后点击 Clean All Targets（图 6.8）。建议在运行模拟器之前这样做，以确保你已保存并更新了所有更改。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_2.png)


    图 6.8


    最后，点击“Build and Run”。现在一切应该都符合你的要求了。


    ## 将你的应用从模拟器移到 iPhone 上


    要将应用从电脑移到 iPhone 或 iPod 上进行测试（并非上架 App Store，那需要更多工作），你需要为你的应用、你的设备和你自己获取一个配置文件。


    第一步是前往 iOS Dev Center 网站（http://developer.apple.com/iphone/）注册成为一名开发者。登录后，你会在右侧看到一个写着“iPhone
    Developer Program”的菜单栏（图 6.9）。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_44_0.png)


    图 6.9


    接下来，点击 iPhone Provisioning Profile。然后点击左侧的 App IDs；点击 New App ID，并为你的应用填写相关信息。


    接下来，点击屏幕左侧的 Provisioning，然后选择 New Profile。创建好配置文件后，将其下载到你的电脑上。在接下来的几步中，我们将把这个配置文件与你为想要测试应用的
    iPhone 或 iPod 生成的密钥进行匹配。


    创建好配置文件后，你需要返回 Xcode Organizer（位于 Window 菜单中），从你的设备中获取产品标识符（图 6.10）。插好设备并打开 organizer
    后，点击 Provisioning Profile 并复制应用标识符。接下来，返回 Xcode，点击 Info.plist，转到右下方面板中的方框（图 6.11）。将
    bundle identifier 改为你刚刚复制的那个，但保留你的用户名。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_44_1.png)


    图 6.10


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_45_0.png)


    **图 6.11**


    所以你的应用 ID 看起来应该像这样：IDNUMBER.com.scottlacounte.libraryapp（App ID.com.PROFILE NAME.APP
    NAME）。


    当你安装完所有证书，终于准备好出发时，最重要的一步是确保 Xcode 设置为 Device 而不是 Simulator（图 6.12）。在切换之前，应用不会加载到
    iPod 或 iPhone 上。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_45_1.png)


    **图 6.12**


    如果你一切都做对了，大约会有十秒钟的延迟，然后 iPod 或 iPhone 才会开机。如果你漏了某一步，那么在设备管理器中，设备旁边会有一个橙色圆圈（图 6.13）。当你点击设备时，它会告诉你错误是什么。最常见的错误是配置文件与设备不匹配，这意味着缺少某个证书。请仔细检查
    iOS Dev Center 页面，确保你已下载所有证书。


    一旦你对应用感到满意并准备出售它，那么你需要按照网上的说明进行操作。你还需要支付 99 美元的开发者注册费。


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_46_0.png)


    ## 测试核心用户


    当你准备好一个应用时，最后要考虑的事情是如何最好地推广它。例如，会使用该应用的人，不一定就是经常去图书馆的人。你如何才能向一群你可能不常遇到的用户推广一项服务呢？


    接触用户群的一种方式是通过本地在线活动。如果图书馆没有 Facebook 页面，那么它应该创建一个——粉丝页面经常能吸引那些不常去图书馆的用户，或是那些想了解社区动态但不常去图书馆的人。


    许多商务人士使用智能手机——对于这个用户群，你可以与城市商业区附近的餐馆和咖啡馆合作。许多商家会乐意留下宣传你应用的传单，尤其是在应用中以赞助商类别包含他们的名字，或者达成其他某种安排的情况下。为了吸引那些你通常不会见到的用户走进图书馆，你可以在应用上提供免费租借影碟的优惠券——他们只需在手机上出示优惠券，然后图书馆就可以备注该读者已使用了租借优惠券。


    要宣传你的应用，你还可以放眼图书馆之外，看看商家们是如何让人们访问他们的 Facebook 页面或网站的。例如，许多当地的 Chick-fil-A Facebook
    粉丝页面每周都会在粉丝页面上发布暗号。如果你在某一天去餐厅说出暗号，就能获得奖励。人们会狂热地访问页面以保持最新状态，生怕错过什么。成千上万的其他商家也有类似的策略。


    手机的存储空间和屏幕空间都不大。所以你需要让应用有吸引力。如果读者必须在手机上的 IMDb 应用和图书馆的应用之间做出选择，他们会真的选择图书馆的吗？为什么不会呢？在开发应用时，要不断问自己：“是什么会让人们一次又一次地回来？”例如，读者为什么要费心下载一个告诉他们图书馆几点关门的应用？


    图书馆应用需要具有交互性。如果通过应用与图书馆员交流很容易，而且如果有很多支持手机的研究工具，那么这个应用就会成为更重要的工具。如果它不具有交互性，用户每次都会选择其他应用。


    '
