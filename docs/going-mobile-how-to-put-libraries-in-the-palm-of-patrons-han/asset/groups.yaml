    类标签允许你为页面上整个重复元素的类指定此设置。例如，你可以将指定图书馆政策的全部文本设为自己的类并将其以红色突出显示，如下所示：


    ```

    .policy

    {

    color: red;

    }

    ```


    其强大之处在于，你只需几次按键即可更改指定类或文本类型的每个实例的任何属性。这也有一些创造性的用途。例如，在七月四日，你可以将移动站点的配色方案更改为红、白、蓝；在万圣节，你可以将其改为橙色和黑色。你可以制作特殊的样式表并为各种场合保留它们，或者通过更改一个文件来改造你的网站。


    ## 智能使用 CSS


    CSS 主要有用是因为它通过减少在整个网站上进行更改的复杂性，减少了开发和维护网站所需的工作量。要有效地使用 CSS，你需要保持样式表格式正确，并将类和 ID
    限制在值得这些区分的元素上。例如，你将网站的常见元素分离到单独的 ID 和类中越多，就越难进行大规模更改。尽可能保持网站在标题和其他元素的外观上保持一致；这样做将使进行广泛更改变得更容易。


    你也可以使用 CSS 来格式化链接。这是一种减少网站对图形依赖的好方法，因为你可以去掉 JavaScript 悬停图像和其他资源消耗元素，而这些元素在功能上几乎没有增加。通过
    CSS 简化网站可以减少页面加载时间；在页面间保持一致的外观；并使在你想稍微改变网站时更容易实施新想法，无论这些更改是永久性的还是临时的。


    ## 浏览器尺寸、CSS 和定位


    你可以使用 CSS 来确定网页上所有元素相对于彼此、相对于屏幕角落以及其他方式的定位位置。正因为如此，CSS 比 HTML 更容易满足多样化访问者的需求。


    ## CSS 与表格


    在 HTML 中定位页面元素最简单的方法之一是使用表格。使用表格可以追溯到该语言最初设计时，而较旧的页面往往大量使用表格。然而，使用表格对于移动网站有几个缺点。


    表格会向 HTML 页面添加信息，因为其尺寸和其他属性必须在文档中定义。对于移动网站来说，减少文件大小至关重要，而 CSS 通过将这些信息保存在外部文件而不是文档本身中来实现这一点。


    表格在布局对象方面也比较笨拙。当指定对象的尺寸太大而无法容纳特定屏幕时，表格往往会使对象挤在一起或使其溢出页面侧面。当对象太小时，表格会浪费宝贵的页面空间。在这方面，CSS
    提供了更优越的定位选项。


    ## 绝对定位


    绝对定位意味着指定页面元素无论屏幕尺寸如何都出现在屏幕的特定区域。绝对定位可用于适应所有用户，因为页面元素即使在最小的屏幕上也能正确显示。设计良好的页面在更大的屏幕上始终看起来不错，但显示屏上会有更多未使用的空间。设置元素绝对位置的
    CSS 如下所示：


    ```

    h1

    {

    position:absolute;

    left:25px;

    top:50px;

    }

    ```


    此代码告诉浏览器将任何标记为 <h1> 的内容显示在距离屏幕左侧 25 像素、距离顶部 50 像素的位置。这样，无论用户的屏幕尺寸如何，移动设备都会将标记为“h1”的内容显示在该位置。


    ## 相对定位


    相对定位允许你指定一个容器并在该容器内定位页面元素。这种定位类型有时用于更好地控制较小的分辨率。例如，如果你有一个无边框的背景，你可以将页面框定在 800
    × 600 监视器分辨率的范围内，并在该容器内定位页面上的所有元素。


    ## 浮动


    大多数网页设计师使用浮动来定位元素，因为这只是将元素优先放置在屏幕的右侧或左侧。如果屏幕上没有足够的空间容纳元素，则它们可以按从上到下的逻辑顺序出现。这适应了移动网站的线性设计要求，使这种方法非常方便。


    ## 创建你的第一个 CSS 文档


    你制作 CSS 文档所需的一切就是一个文本编辑器。选择器、它们的属性和属性值如上所述表达，几乎没有复杂性需要处理。


    嵌入式样式表出现在文档顶部，在头部内。要更改使用此类样式表的任何给定页面，你必须单独更改每个样式表。


    链接样式表存储在单独的文件中，当你需要对网站进行大规模更改时，这提供了最大的便利。你的样式表在文档的头部被调用。该标签如下所示：


    ```

    ```html

    <link rel="stylesheet" type="text/css" href="your_style_sheet_here.css" media="all">

    ```

    ```


    如果你手动创建样式表，只需为其命名并将其保存在网站的目录中。在网页的头部粘贴上一个标签。这将把页面链接到样式表，样式表随后将决定页面的外观。如果你想更改页面的外观，只需在链接中指定不同的样式表即可。


    ## 保持简单


    请记住，移动设备与计算机相比显示区域要小得多。当你开始组装网站布局时，请保持非常简单。


    图书馆流行的页面设计使用三个元素，让用户充分利用移动存在：


    - 1. 带有电话号码的横幅

    - 2. 指向其他页面的文本链接

    - 3. 搜索字段


    对于大多数图书馆来说，这三个元素构成了极好的主页。需要排列的元素很少，只要元素经过深思熟虑设计并正确定位，它们就应该在每个移动网页浏览器中有效显示。由于页面上内容很少，它也会加载很快。你甚至可以完全去掉图书馆标志的图形并将其替换为简单的文本链接。这使得网站对拥有老一代移动设备的用户更友好。


    请记住，你的导航越依赖简单的文本链接，你就会越少因图形而损失空间。当然，你可以使用 CSS 来制作优雅的文本链接，包括提供悬停效果和其他视觉有趣元素的链接——这又是尽可能使用
    CSS 工具的另一个原因。


    如果你想为移动网站添加图形菜单和其他功能，你需要学习一些关于 JavaScript 的知识，JavaScript 是一种无处不在的网页语言。然而，它也很复杂，需要合格的程序员来编写它。了解
    JavaScript 的工作原理和它提供的功能，是确定如何组装你的页面的最后一步。


    ## JavaScript 与移动网站设计


    本章旨在让你了解 JavaScript 是什么以及它如何运作——而不是教你需要知道的一切；Danny Goodman 的《JavaScript Bible》（Wiley
    于 2010 年出版）是你能找到的最全面的书籍。就像 CSS 一样，JavaScript 并非开发移动应用所必需，对设计一个好的应用也较不重要。


    JavaScript 是一种客户端脚本语言，允许用户计算机执行特定功能。以不太技术性的说法，JavaScript 告诉设备执行各种任务。例如，一些搜索页面会自动将你的光标放在搜索字段中。光标不会自行移动到那里；网站通常使用
    JavaScript 将光标放置在那里。


    JavaScript 实际上并没有为你的页面布局贡献太多。没有网站，无论是移动还是其他，是仅靠 JavaScript 构建的。它是为你的网站添加功能的重要元素，在某种程度上，它可以增加一些视觉吸引力。


    ## 获取 JavaScript


    JavaScript 在普通网站的设计师和程序员中都非常流行。原因在于它赋予设计师对页面功能控制的强大能力。这对于图书馆尤其重要，因为使用这些工具可以大大降低成本。例如，JavaScript
    允许编码人员使用更知名、更常用的代码，而不必花时间学习一种手机原生语言来做本质上相同的事情。


    你可以下载各种 JavaScript 资源库并将其包含在你的网站中，这通常很容易做到，并且不需要真正的编程知识。通常，你只需要在网页中添加一个小的脚本即可。


    对于移动网站来说，JavaScript 带来了一些重大的兼容性问题。此外，通过直接向页面添加代码，你增加了其大小。对于缺乏 JavaScript 兼容性的浏览器用户来说，这相当于下载了没有任何好处的额外数据。


    '
