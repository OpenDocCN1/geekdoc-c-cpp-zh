    “所见即所得”编辑器目前为移动网站提供模板，这使得几乎任何人都能设计简单的网站。


    也许图书馆需要接纳这一日益增长的技术的最重要原因是，全世界的年轻人都在用它互相交流。普通青少年，如果有选择，可能更愿意给图书管理员发短信，而不是去参考咨询台。


    ## 什么是移动应用？


    在进一步讨论之前，还有一个问题需要回答：我说的“移动应用”是什么意思？移动应用通常指两种不同的东西：


    - 移动网站：移动网站是面向手机友好的，并在开发时考虑了蜂窝设备的限制。如果你在图书馆网站上投入了足够的时间，它在10到20英寸的屏幕（普通台式机或笔记本电脑屏幕的尺寸）上可能看起来相当不错。但如果你尝试从手机访问该网站，它可能看起来会很糟糕——甚至可能根本无法加载。拥有一个移动友好网站仅仅意味着图书馆有一个单独的网址（例如，m.library.com——m代表移动）来指向手机。这可以通过插入根据设备分辨率重定向的代码轻松实现。例如，如果网站检测到设备分辨率为1280
    × 1024，那么它显然是台式机、笔记本电脑或平板电脑，因此会被引导到主页面；如果分辨率为320 × 480或更小，那么它就是某种移动设备，因此会被引导到移动页面。


    - 原生应用：原生应用是指图书馆额外努力创建的应用，可在移动应用商店（如iTunes、Android Market）中购买。


    至少，每个图书馆都应该有一个移动友好网站；这是一个相对简单的过程，我将在接下来的章节中讨论。


    ## 开发移动应用


    想要采取额外主动措施并做一些更具创新性工作的图书馆，应该花时间制定向用户提供原生应用的计划。要开发原生应用，你必须了解如何开发移动网站应用——因此，理解其中一种，实际上你就在学习做两件事。读完这本书，你可能会意识到你并不想要原生应用，但你至少会知道如何开发一个，而且这样做，你将能够开发移动应用。


    开发原生应用的问题不在于技能水平（实际上与开发移动友好网站差不多）；问题在于市场上的手机数量。如果你想为所有用户开发原生应用，那么


    例如，对于图书馆网站，大多数用户主要希望浏览目录并从书库中预约图书、给图书馆打电话、以及获取不同分馆的路线。这意味着移动网站应与图书馆的数据库集成，以允许用户登录并访问他们的账户。


    开发移动网站的另一个问题是空间。智能手机虽然有用，但屏幕尺寸较小。这意味着你必须最大化可用空间，而不是创建一个只对拥有相对较大移动屏幕的用户有用的移动网站。


    实际查看手机并了解它们的外观也很重要。框2提供了大多数智能手机的尺寸范围；普通手机屏幕尺寸为320 × 480（大约相当于一张扑克牌）；理想情况下，这应该是你开发移动网站时瞄准的分辨率。


    ## 框2 ■ 像素尺寸


    - **iPhone：** 320 × 480

    - **黑莓：** 160 × 160 到 480 × 360

    - **Android SDK：** 320 × 240（因为不同手机使用Android平台，这里给出的是开发工具包中的标准分辨率）

    - **通用Windows Mobile：** 240 × 320（标准分辨率，但不同手机有所差异）

    - **诺基亚：** 95 × 95及以上（因手机而异，但240 × 320是标准）

    - **Palm Pre：** 320 × 480


    ## 调查用户


    在继续开发应用之前，最好先了解你的读者是谁，以及他们想要什么样的移动服务。例如，有多少比例的读者拥有智能手机？他们拥有哪种智能手机（很多人不知道自己用的是什么手机，所以最好要求看看他们的手机）？如果他们没有智能手机，他们会在功能手机上使用网络吗？大多数网络分析网站（如Google
    Analytics、StatCounter）会显示用户的分辨率，这让你能够判断他们是否在用手机查看网站。但这并不总是有帮助，因为这些网站只让你知道用户是否通过手机访问网站，而不知道是哪种手机（例如iPhone、黑莓、Droid）。


    本书很大篇幅聚焦于iPhone，因为当人们说想学习如何制作应用时，他们通常指的是为iPhone制作应用——应用开发的圣杯。然而，根据你的读者情况，你可能需要考虑从其他设备开始。如果你的大多数携带智能手机的读者都使用黑莓，那么开发iPhone应用就没有意义。


    如果你决定继续开发应用，那么你必须问：你的读者想要什么？访问图书馆目录？活动照片？活动日历？GPS定位找到最近的图书馆或图书？想知道下一台图书馆电脑何时可用？与图书管理员即时通讯？重要的是要考虑到，图书管理员认为重要的东西不一定是读者认为重要的。


    ## 培训员工


    图书馆在早期可能会面临员工的抵触。许多人不喜欢变化，所以为了避免抵触，最好尽早让所有员工参与进来。另一个好主意是，当你调查读者时，你也可以调查员工，以了解谁已经理解这项技术并希望加入，谁需要更多帮助。此外，展示比口头讲述更有帮助。基本上，这意味着展示一个场景比仅仅谈论正在发生的事情更好。所以，如果你只是告诉员工图书馆想要做什么，许多人可能看不到应用的必要性，但如果你向他们展示应用以及它能给图书馆带来什么，他们更有可能感到兴奋。


    如何展示？最好的方法是在iPod Touch或Android平板上进行调查。SurveyMonkey和其他流行的在线调查是收集数据的绝佳工具，但真正把设备放到不熟悉这类设备的图书管理员手中，会帮助他或她更熟悉使用界面。这些设备也很小，易于存放。为了调查读者，你可以购买iPod锁（例如，Targus
    Defcon笔记本/iPod锁组合售价39.99美元），或者将iPod锁在无人值守的桌子上，让读者填写调查问卷。


    iPod和Android平板也使用与iPhone相同类型的界面，而且你可以为它们购买大量调查应用；最棒的是它们相对便宜（不到200美元）。三星Galaxy和戴尔Streak平板获得了大量媒体关注，但还有许多其他平板可用——eBay上有许多Android平板售价不到150美元。


    你可以使用Survey on the Spot（iPhone免费）或Askdroid和ODK Collect（Android免费）创建调查，然后让图书管理员使用该应用向读者提出一系列问题。或者使用Tally
    Counter（iPhone免费）或CodeArk Tally Counter（Android免费）来计算使用智能手机的人数。还有更强大（且更详细）的计数工具需要付费：Tallymander（iPhone版3.99美元）和Advanced
    Tally Counter Pro（Android版0.99美元）允许用户同时统计多个不同的数据（例如，读者在参考咨询台提出的问题类型）。


    在大多数情况下，调查结果不会像你从SurveyMonkey等网站获得的那样强大或具体，但这并不重要；重要的是你让那些不经常使用该设备的人了解它是什么。尽管人们可能抗拒变化，但几乎每个人都喜欢玩小玩意！


    很多时候，图书馆实施的技术创新未能成功，是因为图书馆工作人员没有向读者推广它们。但在iPhone或平板上调查员工和读者时，即使你可能不会让任何人变成智能手机用户，你至少会让人们更好地理解它们的重要性。

