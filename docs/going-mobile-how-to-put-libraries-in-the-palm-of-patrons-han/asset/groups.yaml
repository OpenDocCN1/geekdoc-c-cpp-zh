    ## WCSS 有多强大？


    本章是关于层叠样式表，即 CSS 的速成课程；如果你已经知道如何使用 CSS，那么本章将是一个复习。要全面了解 CSS，我建议你查阅 David McFarland
    所著的《CSS: The Missing Manual》（由 O’Reilly Media 于 2006 年出版）。重要的是你需要知道的是，虽然 CSS 在开发移动网站时肯定有用且有益，但它并不是必不可少的。如果你不使用它，你仍然可以开发一个功能齐全的移动网站。所以这里是基础知识。


    CSS 工具是为了解决 HTML 的一个特定问题而创建的，此后它已证明是所有互联网创新中最有用的之一。在 HTML 中，每一段文本都可以单独指定其属性。例如，你可以指定某行文本为红色、下划线、12
    点。如果愿意，你可以为页面上的每个字母单独指定这些属性。然而，这种方法大大增加了页面的大小，更重要的是，为设计师带来了大量额外的工作，他们必须指定每个链接应该如何显示、段落文本应如何显示等等。CSS
    消除了这种麻烦。


    层叠样式表实际上只是一个文本文件。它通常与主 HTML 代码分开，在页面上，有一个调用该样式表的语句写入其中，决定将使用哪种样式表，从而决定页面将如何显示。使用
    CSS 与移动设备需要对代码语言进行一些调整。这导致了无线 CSS（或 WCSS）的开发，它专为移动网站而定制。如果你对 CSS 有相当好的理解，你应该不会有任何困难理解
    WCSS。


    要理解 CSS 的工作原理，请将你的网站视为由两个主要部分组成。第一部分是网站的内容，它在你基于 HTML 网站创建的 XHTML-MP 文档中指定。网站的第二部分是
    WCSS 组件，它决定了你的网站在浏览器中显示时的实际外观。使用 WCSS，你还可以添加一些功能和文本效果。


    WCSS 非常强大。基本上，一个文本文件控制着你网站的整个外观，包括页面上的每个元素。


    CSS 和 WCSS 的语法很容易理解。选择器标识页面上可以用 HTML 标记的每个元素（例如，H1、P、A）。这些选择器具有属性，例如颜色、大小、装饰等，所有这些属性都有值，例如红色、12
    点或下划线。这些属性以非常简单的格式输入。例如，如果你希望网站上的每个 H1 级标题都是绿色，WCSS 代码如下：


    ```

    h1 {color: green}

    ```


    你也可以使用数字代码（即十六进制代码）来指定颜色。例如，要使所有段落文本为黑色，你将使用以下代码：


    ```

    p {color: #000000}

    ```


