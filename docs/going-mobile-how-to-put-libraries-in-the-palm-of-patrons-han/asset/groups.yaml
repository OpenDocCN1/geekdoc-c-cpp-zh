    可以自定义编码，但即使是专业设计师也倾向于大量使用网络上可免费获得的库，因为这些资源解决了最常见的 JavaScript 问题。


    JavaScript 在某些情况下也被用来提供更好的网页内容可访问性，例如允许用户使页面的文字变大。


    ## JavaScript 与表单


    JavaScript 被大量用于表单的处理。对于图书馆而言，这些可能是允许用户快速搜索网站或卡片目录或更新其图书馆账户信息的表单。没有理由你不能在移动网站上提供这些功能；要执行它们，用户必须向你提供特定信息。这可能比听起来更耗资源。


    如果用户向服务器提交信息不全的表单，服务器必须处理表单，找出缺少的内容，并将其连同缺少的元素一起发回给用户。对于移动用户来说，这会消耗他们的空中时间，因为他们等待所有这些操作完成。JavaScript
    可以在填写过程中检查表单，如果有问题，就在用户发送之前指出。这为他们节省了时间，也节省了你服务器的资源。


    使用 JavaScript 的缺点是许多移动网络浏览器根本不支持它。因此，在页面中添加 JavaScript 只会使部分读者受益，并可能使网站对其他读者的工作更差。因此，以智能方式使用
    JavaScript 设计一切。


    ## 在哪里使用 JavaScript


    如果可访问性对你的图书馆来说是一个问题，那么你应该有一个完全不使用 JavaScript 的移动网站版本。旧手机通常无法执行 JavaScript，这会使部分用户的部分网站功能不可用。虽然情况可能是大多数用户正在使用新一代手机。


    在新一代手机上，有几种方法可以增强他们在你网站上的体验。例如，你可以向网站添加代码来检测用户屏幕的大小并相应地更改用于呈现网站的样式表。这意味着你可以为智能手机用户提供一个开发精良、华丽的网站版本，为使用旧手机的人提供一个更简单的版本。结合
