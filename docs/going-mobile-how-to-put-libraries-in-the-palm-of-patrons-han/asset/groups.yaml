    # 7


    # BEYOND THE BASICS


    The point of this book is to make building an app as simple as possible. You can
    add JavaScript to your app to make it flashier, but talking in detail about JavaScript
    would take away from the point of this book—keeping it simple.


    JavaScript is a pretty powerful language that can do a lot of things, but learning
    it isn’t essential to building a great-looking app. If you know JavaScript, then
    use it; if you don’t, then there’s another option: widgets. If you blog or read
    blogs, then you likely know all about widgets, even if you don’t know them by
    name. Widgets are the small little boxes that sit on the sidebars of blogs and
    offer links to things like Twitter, Facebook, and Google News streams. Widgets
    appear on the surface to be quite simple, but there are pages of code built into
    each one. The good news is that you don’t have to know the code to build them.


    A simple Web search for “widgets” turns up thousands of pages that offer customizable
    widgets; some are free, and others have small fees attached. You’ll need to watch
    out for widgets that use Flash (which many phones do not currently support—most
    notably, the iPhone).


    Many websites also offer widgets. Twitter is the perfect example. On the widget
    web page for Twitter (https://twitter.com/widgets/) you can build a custom widget
    in just a couple of short steps.


    First, on the widget page, select My Website (figure 7.1).


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_48_0.png)


    On the following page you will see several options; choose Profile Widget, which
    will display your library’s most recent tweets.


    Next, you can customize your widget (figure 7.2). Under the user name, you ideally
    would put the name of your library, but you can also put authors, magazines, or
    the name of anyone else with a public Twitter account. This would give your app
    content if you don’t have time to do it yourself.'
