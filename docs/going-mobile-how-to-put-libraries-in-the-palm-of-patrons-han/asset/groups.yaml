    JavaScript 常被用来制作弹出窗口——有用那种，而不是过去引起大量烦恼的那种——动画菜单，以及为页面增添视觉趣味的其他功能。在移动网站上，这些东西最好避免，原因主要是用户浏览移动网站的方式与浏览常规网站不同。


    如果你为不同设备提供不同版本的网站，那么你可以为那些可以运行它的设备提供一些 JavaScript 功能。这可以确保无法处理 JavaScript 的设备不会收到无法使用的页面版本。


    移动设备越来越多地使用接近全功能的浏览器而不是专门用于冲浪的应用程序。这意味着移动浏览器对 JavaScript 的支持正在增加，并且它可能会成为移动网页设计中更常见的元素。


    设置 JavaScript 元素来检测智能手机可能很有用，但它可能并不总是按计划工作。一些移动浏览器不能正确识别自己，或被设置为识别为不同类型的浏览器，例如
    Internet Explorer。此外，并非所有支持 JavaScript 的移动设备用户都会打开相应的功能。在某些情况下，用户完全阻止 JavaScript
    以实现更快的页面加载时间和更安全的浏览器。这些都是在设计中使用 JavaScript 时需要考虑的问题。


    ## JavaScript 的失误


    JavaScript 最受欢迎的用途之一是创建菜单。在某些情况下，菜单会让用户感到困惑。移动设备上的用户倾向于使用按钮导航，而不是鼠标，所以这也是避免过度使用菜单的另一个原因。对于移动设备，你应避免使用鼠标悬停效果，例如当你将光标悬停在按钮上时按钮会亮起或移动位置。在移动设备上，此类菜单需要太多代码和资源。


    也很重要的是要确保你的 JavaScript 应用程序与移动设备兼容。例如，并非所有移动设备都可能有鼠标的替代品，这意味着设备可能会完全忽略与鼠标关联的任何事件，这可能会导致页面出现问题。针对智能手机设计的
    JavaScript 指针操作有多种变体，但它们并不通用。例如，当今一代智能手机并不能可靠地支持你可以用 JavaScript 添加到网页上的拖放功能。


    然而，对更多移动浏览器的支持正在扩大。免费的 JavaScript 库在每次修订中都有越来越多的功能，可以为智能手机浏览器提供附加功能。其中一些最新创新包括以下内容：


    - 增加对触摸屏的支持

    - 支持将滚动条放置在浏览器内

    - 支持更复杂的动画


    由于移动设备之间存在如此大的差异，因此 JavaScript 兼容性仍然存在很大不一致。


    ## JavaScript 应用程序


    JavaScript 通常被用来创建基于浏览器的应用程序，例如测量转换器和简单游戏。然而，这些应用程序可能会变得非常复杂，尤其是在提供大量用户功能的高度开发的网站上。


    在移动网站上，应用程序由于兼容性问题可能成为问题。虽然它们很适合整合到你的主网站中，但大多数主要网站的移动版本完全取消了 JavaScript 应用程序。即使是最先进的智能手机，使用复杂的
    JavaScript 应用程序的潜在好处也无法可靠地实现，尽管兼容性肯定会随着时间的推移而增加。


    ## 是否可行？


    目前，移动设备并不普遍支持 JavaScript。这意味着就可访问性而言，图书馆必须为其目前在其网站上发布的任何页面提供一个不含 JavaScript 的版本，以便使尽可能多的用户能够访问它。完全依赖
    JavaScript 的功能将无法供其手机无法支持的读者使用。一些手机确实支持 JavaScript，但它可能无法按预期运行，特别是对于用户操作触发的事件，例如鼠标悬停和悬停。这可能使
    JavaScript 不适合某些图书馆及其大多数读者。


    然而，你可以在有限的部署中使用 JavaScript，并为访客提供增加的功能和更多便利，尤其是在处理表单和其他基本需求方面。


    你可以非常容易且廉价地测试 JavaScript 在你网站上的适用性。由于有许多免费的 JavaScript 库可用，并且任何可以编辑 HTML 的人都可以非常轻松地在页面上安装脚本，因此你可以检查基于
    JavaScript 的功能是否能为你的客户提供更好的体验。确保你自己在各种设备上测试它：智能手机使用不同的浏览器，因此请在所有智能手机上检查你页面的功能。


    再次，移动网页设计最重要的元素是简洁。无论你的主站点多么先进和开发，你都必须将其简化为基本要素，才能使其对那些喜欢随时访问的人有用。在某种程度上，你的移动网站反映了你在主站点上的内容，但最好将其视为一个完全独立的实体。它可能包含与主站点相同的大量内容，但它将致力于提供最快、最有效、最不废话的用户体验。然而，随着移动网络使用的快速增长，图书馆用户对在移动设备上获得图书馆资源的需求将显著增加。


