  md: "# Build an App\n\n**Website:** www.buildanapp.com  \n**Platform:** BlackBerry,\
    \ Android, Windows Mobile, Mobile Web, iPhone  \n**Summary:** Available on more\
    \ devices than most app builders, and for a price that is cheaper than most, but\
    \ the app has a very generic look and is limited in terms of customization.  \n\
    **Pricing:** $14 a month and $19 setup fee for all apps, but iPhone app requires\
    \ $199 setup fee\n\n# Mobile App Loader\n\n**Website:** www.mobileapploader.com\
    \  \n**Platform:** iPhone, iPad, and Android  \n**Summary:** This is not the best-looking\
    \ app builder, but it has low fees and is one of a few compatible with the iPad.\
    \ Don’t let the price fool you, however; extra buttons and features incur additional\
    \ fees. There is also not a lot of room for customization.  \n**Pricing:** $4.99\
    \ per month and $59.99 setup fee\n\n# Game Salad\n\nThis DIY editor is for games.\
    \ It isn’t ideal for libraries, but it might be something to consider for teens.\
    \ A program that lets teens build a game would be a great program. Best of all,\
    \ it’s free! Unfortunately, a Mac is required (http://gamesalad.com/landing/overview).\n\
    \n# GOOGLE APP INVENTOR\n\nThings were more complex for app developers just a\
    \ few years ago—PhoneGap certainly has helped take away the complexity of mobile\
    \ app development. In the past year, dozens of virtual companies have emerged\
    \ promising to assist users who want to go mobile but lack programming skills.\
    \ In this section I discuss Google’s App Inventor (http://appinventor.googlelabs.com).\n\
    \nIn my experience, developing apps for the iPhone is much simpler than developing\
    \ for Android; Apple has spent much more money on app development, and it’s obvious\
    \ in its presentation and SDK functionality. Google is still playing catch-up.\
    \ If you want to develop an app using PhoneGap, then refer to the appendix, which\
    \ gives a list of where to go for tutorials on the Web. Google App Inventor, however,\
    \ is entirely different from the traditional method of app development, so it’s\
    \ worth noting here what it is and how it works.\n\nApp Inventor was first made\
    \ available on July 12, 2010; the tool claims to be so easy that elementary school\
    \ children can use it with little effort. The interface uses drag-and-drop objects\
    \ to create apps that run on any Android phone.\n\nBecause of App Inventor’s simplicity,\
    \ it is difficult to develop an app that is visually stunning. It is, however,\
    \ an excellent place to test mobile development and decide what the best practices\
    \ for the library will be. As Google continues to improve the drag-and-drop developer,\
    \ it will most definitely get easier to use and more powerful."
