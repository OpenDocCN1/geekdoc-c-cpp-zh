- pgno: 6
  md: '# INTRODUCTION


    There are more than one hundred thousand mobile apps for the iPhone, and Android
    is quickly catching up to that number. Universities have apps, sports teams have
    apps, authors have apps—everyone seems to be in the app market, and for obvious
    reasons. Unlike the previous generation, which didn’t mind waiting to get their
    information when they got home, today’s generation wants their information on
    the go. In many respects they could be called Generation Mobile, because for the
    first time, there is a group of people who can have everything they could ever
    want in the palm of their hand.


    What’s alarming, however, is of the hundreds of thousands of mobile apps available
    for phones, the amount of apps that librarians have built for libraries can be
    counted on one hand! The District of Columbia Public Library has an app to help
    you find books in its catalog. By the time this book is published, a few other
    libraries will likely have joined in, but the number isn’t anywhere near where
    it should be.


    What does this mean? That there’s an entire generation that’s being overlooked.


    Businesses have successfully found a new generation of clients simply by promoting
    services to them in ways that speak to a new type of user: the mobile user. They
    have proved that successful apps work and should not be overlooked.


    For as long as computers and the Internet have been around, libraries have been
    on the cutting edge of implementing them; perhaps for the first time, libraries
    are lagging, and it’s time to catch up.


    Mobile app development has become a pretty lucrative business; it’s a fair statement
    to say that it is the twenty-first century’s equivalent of a gold rush—upstart
    companies are making millions. In 2010, a developer for the Android phone reported
    that he was making $10,000 a month on an app that helped people find where they
    had left their car. He’s not alone.


    It’s not in libraries’ best interest to go into app development with the intention
    of making money, but still, there is a huge market for mobile development.


    Mobile websites allow patrons to avail themselves of library services no matter
    where they are. The sites can be set up to allow patrons to reserve books, to
    surf the card catalog, and more. Mobile websites, however, are a much different
    interface from the sites that you’re used to seeing on the Internet.


    There are a lot of reasons libraries have, by and large, stayed away from phone
    apps. One of the biggest reasons, however, is that the skills needed to successfully
    build them'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'have historically been greater than what most libraries can afford; an app
    programmer can cost several hundred dollars an hour. Building a phone app using
    the phone’s native programming language can be hard work and can take hundreds
    of hours.


    Fortunately, new open-source software has made it easy for people with more limited
    programming skills to take advantage of apps. Using the technologies available,
    it’s possible for any library to create an app at a low cost and to offer patrons
    a way to access the wealth of knowledge and entertainment stored in every library
    facility.


    The point of this book is to show you what an app is, how to build one, and how
    to successfully market your app to library patrons. In the forthcoming chapters,
    you will learn not just how to build an app with relatively no programming skills
    but also the best practices for marketing the book to your target audience, as
    well as both free and paid services that are available to make going mobile even
    simpler and seamless.


    There are many challenges ahead for any library attempting to enter this new form
    of development—and the challenges are among the biggest roadblocks for many libraries
    interested in extending their library services into the mobile market. I address
    some of the problems and challenges in this book, but the main point is to offer
    cost-effective solutions to library staff who are interested in experimenting
    with building an app for the library.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# BEFORE YOU BEGIN


    # MOBILE APP: A DEFINITION


    It’s difficult to write about mobile devices because that phrase can mean so many
    things. When I say “mobile app,” does that refer to an app that runs on any phone?
    Or on a specific phone? Just to be clear, there are two types of cell phones:


    Feature phone: A feature phone is what the average person carries in his or her
    pocket. Although many feature phones are becoming more sophisticated, for the
    most part, feature phones are the more popular basic phones that you can buy.
    They make calls, they offer texting, and most can take pictures and have very
    limited web browsing. More than 80 percent of Americans have a feature phone.


    Smartphone: Smartphones are best described as computers in the palm of your hand.
    Several times more powerful than feature phones, smartphones not only can surf
    the Internet but also can surf at relatively fast, third-generation (3G) speeds.
    The iPhone, Android, BlackBerry, and Windows Mobile are all examples of this kind
    of phone.


    Many of the ideas in this book are universal; they can be tried on pretty much
    any phone in existence. The majority of ideas, however, are maximized for use
    with smartphones.


    What is the point of developing apps that fewer than 20 percent of the population
    can access? Smartphones are the future of cellular technology. Smartphone prices
    have dropped significantly in recent years. When the iPhone was released in 2007,
    it cost $599; less than five years later, it cost as little as $99. The same is
    true of BlackBerries and nearly all other smartphones. As costs continue to drop,
    the smartphone is becoming more and more affordable to the average consumer.


    Mobile development has become one of the biggest growth sectors of web development.
    People still use computers to surf the Internet, but the amount of time they spend
    on a computer will decrease as other devices become more prevalent.


    The advent of XHTML-MP (XHTML for the Mobile Phone) and WCSS (Wireless CSS) converted
    two of the most powerful tools in web design into forms that are suitable for
    those who need to build mobile websites. At the same time, WYSIWYG (what'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'you see is what you get) editors currently provide templates for mobile websites,
    which makes it possible for just about anyone to design simple websites.


    Perhaps the biggest reason libraries need to embrace this growing technology is
    because the youth of the world use it to speak to one another. The average teen,
    if given the option, would probably prefer to text a librarian than to visit the
    reference desk.


    # WHAT IS A MOBILE APP?


    Another question that should be answered before proceeding any further is, What
    do I mean by “mobile app”? Mobile apps generally refer to two different things:


    Mobile website: A mobile website is mobile phone friendly and developed taking
    into consideration the limitations of cellular devices. If you invested the right
    amount of time in your library’s website, it probably looks pretty good on a ten-
    to twenty-inch screen (the size of the average desktop or laptop screen). But
    if you try to access the website from a mobile phone, it probably will look pretty
    lousy — if it even loads at all. Having a mobile-friendly website would simply
    mean that the library has a separate web address (e.g., m.library.com — the m
    standing for mobile) to point mobile phones to. This can be done easily by inserting
    code that redirects the device on the basis of its resolution. For example, if
    the site detects a device resolution of 1280 × 1024, then it’s obviously a desktop,
    laptop, or tablet computer, and so would be directed to the main page; if the
    resolution is 320 × 480 or less, then it’s some sort of mobile device, and so
    would be directed to a mobile page.


    Native app: A native app is one for which the library has gone the extra step
    to create an app that is available for purchase in mobile app stores (e.g., iTunes,
    Android Market)


    At the very least, every library should have a mobile-friendly website; it’s a
    relatively easy process that I’ll talk about in forthcoming chapters.


    # DEVELOPING A MOBILE APP


    Libraries that want to take the extra initiative and do something more innovative
    should devote some time to developing a plan for the delivery of native apps to
    their users. To develop a native app, you have to understand how to develop a
    mobile website app— so by understanding one, you are actually learning to do two
    things. By the end of this book, you might realize that you don’t want to have
    a native app, but you will at least know how to develop one, and in doing so,
    you will be able to develop a mobile app.


    The problem with developing a native app isn’t the skill level (which is actually
    about the same as for developing a mobile-friendly website); the problem is the
    number of phones that are on the market. If you want to develop a native app for
    all users, then'
