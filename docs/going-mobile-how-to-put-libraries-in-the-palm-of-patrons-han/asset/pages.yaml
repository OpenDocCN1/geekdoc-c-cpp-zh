- pgno: 12
  md: 'For example, for library sites, most users will primarily look to browse the
    catalog and reserve items from the stacks, to call the library, and to get directions
    to different branches. This means that the mobile site should be integrated with
    the library’s database to allow customers to log in and access their account.


    Another concern in developing mobile websites is space. A smartphone, useful as
    it is, has a small-format screen. This means that you must maximize the space
    available and not create a mobile site that is useful only to those users who
    have relatively large mobile screens.


    It’s also important to see the actual phones and know what they look like. Box
    2 provides the range of dimensions for most smartphones; the average phone has
    a screen dimension of 320 × 480 (about the same as a playing card); ideally, that
    is the resolution that you should aim to develop your mobile website for.


    # BOX 2 ■ Dimensions in Pixels


    +   - **iPhone:** 320 × 480

    +   - **Blackberry:** 160 × 160 to 480 × 360

    +   - **Android SDK:** 320 × 240 (because different phones use the Android platform,
    here the dimension is the standard resolution in the developer kit)

    +   - **Generic Windows Mobile:** 240 × 320 (standard resolution, but varies from
    phone to phone)

    +   - **Nokia:** 95 × 95 and higher (varies from phone to phone, but 240 × 320
    is standard)

    +   - **Palm Pre:** 320 × 480


    # SURVEYING USERS


    Before you continue with developing an app, it’s a good idea to understand who
    your patrons are and what kinds of mobile services they want. For example, what
    percentage of patrons have smartphones? What kinds of smartphones do they have
    (many people don’t know which kind of phone they have, so it’s a good idea to
    ask to see their phone)? If they don’t have smartphones, do they use the Web on
    their feature phones? Most web analytics sites (e.g., Google Analytics, StatCounter)
    will indicate users’ resolution, which lets you figure out whether they are using
    a phone to view the site. But this doesn’t always help because these sites let
    you know only whether users are accessing the site via their phone, not what kind
    of phone (e.g., iPhone, BlackBerry, Droid).


    A lot of this book focuses on the iPhone, because when people talk about wanting
    to learn how to make apps, they are usually referring to making them for the iPhone
    — the holy grail of app development. Depending on your patrons, however, you might
    want to consider starting on another device. There is no point developing an iPhone
    app if most of your smartphone-carrying patrons have BlackBerrys.


    If you decide to continue with developing an app, then you have to ask, What do
    your patrons want? Access to the library’s catalog? Photos from events? A calendar
    of events? GPS tracking to find the nearest library or book? To know when the
    next library'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'computer is available? Instant messaging with a librarian? It’s important to
    consider that what librarians find important is not necessarily what patrons find
    important.


    # TRAINING STAFF


    The library might face resistance early on from staff. Many people don’t like
    change, so to avoid resistance, it’s useful to get everyone on staff involved
    as early as possible. Another good idea is that when you survey your patrons,
    you can also survey your staff to find out who already understands the technology
    and wants to jump on board and who will need a little bit more help. Also, it
    helps to show, not tell. Basically, that means that it’s better to show a scene
    than to simply talk about what is happening. So, if you simply tell staff what
    the library wants to do, many might not see the necessity of an app, but if you
    show them the app and what it can do for the library, they’re more likely to get
    excited.


    How do you show? The best way is to carry out a survey on an iPod Touch or Android
    tablet. SurveyMonkey and other popular online surveys are great tools for collecting
    data, but actually placing a device in the hand of a librarian unfamiliar with
    such devices will help him or her become more comfortable with using the interface.
    These devices also are small, so they’re easy to store. And for surveying patrons,
    you can buy an iPod lock (e.g., the Targus Defcon Notebook/iPod Lock Combo costs
    $39.99) or lock an iPod to an unattended desk for patrons to fill out the survey.


    The iPod and Android tablets also use the same kind of interface as the iPhone,
    and there are plenty of survey apps that you can purchase for them; best of all
    they are relatively cheap (less than $200). The Samsung Galaxy and Dell Streak
    tablet have received a lot of media attention, but there are many other tablets
    available—there are many Android tablets available on eBay for less than $150.


    You can use Survey on the Spot (free for iPhone) or Askdroid and ODK Collect (free
    for Android) to create a survey and then have librarians use the app to ask patrons
    a series of questions. Or use Tally Counter (free for iPhone) or CodeArk Tally
    Counter (free for Android) to count the number of people using smartphones. More
    powerful (and detailed) tally counts are also available for a cost: Tallymander
    ($3.99 for iPhone) and Advanced Tally Counter Pro ($0.99 for Android) let users
    count several different stats at once (e.g., types of questions patrons ask at
    the reference desk).


    The results of the surveys, in most cases, won’t be as powerful or specific as
    those you would get from sites like SurveyMonkey, but that doesn’t matter; what
    matters is your letting people who don’t regularly use the device know what it
    is. Even though people might resist change, almost everyone loves to play with
    gadgets!


    Many times libraries implement technological innovations that don’t take off because
    the library staff members don’t promote them to patrons. But in surveying staff
    and patrons on an iPhone or tablet, even though you might not convert anyone to
    a smartphone user, you will at least give people a better understanding of their
    importance.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# DEVELOPING A MOBILE

    WEB APPLICATION


    Once you know who your users are, it’s time to start developing. This chapter
    and the following ones provide a crash course in mobile development. We’ll review
    the essence of HTML, CSS, and JavaScript programming, and we’ll learn the very
    basics of what it takes to develop a mobile website.


    # SETTING UP THE DOMAIN


    Mobile websites are housed in a separate part of your server from your main site.
    In most cases, the site name will simply have “mobile” added on at the beginning
    of the domain. For example, the mobile version of the URL YourLibrary.com would
    be Mobile.YourLibrary.com. The “Mobile” directory holds all the files required
    to display your mobile site. This type of organization also makes things easier
    on your information technology staff, because the “Mobile” directory is a convenient
    way to deal with a site.


    Once your domain is set up and ready to go, the hard work begins.


    # UNDERSTANDING THE PROCESS


    Most of the process of designing a mobile website involves simplifying and reformatting
    the information and features that appear on your main website. This means that,
    to build a mobile website, you first need to prepare the text and images for the
    site so that they fit the site’s format.


    # MOBILE WEB VERSUS STANDARD WEB


    Everything on your mobile website will be slightly different from how it appears
    on your regular website. This is inevitable. Although there are some features
    that your users will expect from your website, some of what you offer on your
    main site is impractical for mobile users. It’s important to remember that you’re
    trying to replicate the functionality and content of your regular website as much
    as possible on your mobile site. You’re not simply duplicating your main website
    and putting it in your mobile directory.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Your mobile website, therefore, should largely be its own entity—it will have
    some features from your main site, but you’ll abandon others. You can start building
    your mobile site by streamlining your regular website.


    # NAVIGATION


    Most websites feature navigation menus with many options on the side or top of
    the page. For mobile sites, you’ll need to reduce the number of navigation elements
    down to those that are the most practical and necessary for the patrons visiting
    your site. You will also want to add a “Back” and “Forward” button on every page.
    Some mobile browsers don’t have these buttons built in, so it’s easy for surfers
    to end up at a dead end on the site, which can be extremely frustrating.


    The first thing that should appear on your mobile home page is the name of your
    library and your location. Your telephone number should also be one of the first
    pieces of information that your visitors see. Many visitors to your mobile website
    will simply opt to call and ask their questions directly to a librarian. You can
    make this easy for them by inserting a link that allows visitors to dial your
    phone number directly from the page. To insert the link, which should appear at
    the very top of the page, there is a fairly simple code that will display your
    phone number and allow visitors to dial the library just by clicking on the link:


    ```

    <p align="center">Call Us:

    <a href="wtai://wp/mc;5555551212">555-555-1212</a><br/>

    <a href="wtai://wp/ap;5555551212;City_Library">Add Us to Your Phone Book!</a>

    </p>

    ```


    By clicking on Call Us, patrons can dial the number listed. Notice that the unformatted
    phone number appears at the end of the line that starts “wtai” in both cases.
    In the second link, “Add Us to Your Phone Book!” the tag “City_Library” determines
    how your number will be added to the user’s phone book. Providing the ability
    to both dial your phone number right from the mobile home page and to add your
    number to the visitor’s phone book with just a click is a huge convenience for
    your patrons—and it definitely has a wow factor.


    Navigation buttons on a mobile website need to be very simple. In most cases,
    users prefer to move through your site using navigation menus. Entering text is
    difficult on some phones and, therefore, users tend to avoid doing so whenever
    possible. Also, your navigation choices should be intuitive, and ideally, it should
    take a minimal amount of clicks for patrons to find the page they’re looking for.


    Keep the shapes of your navigation buttons as simple as possible and use fonts
    that are bold and readable. Some mobile screens have very low-quality graphics,
    so make efforts to accommodate users of those devices when you’re designing your
    site. For example, text links are preferable to graphics links.


    The home pages of some mobile websites are little more than a small section of
    information with links provided underneath the main content. For examples of the
    effective'
