- pgno: 44
  md: 'Finally, click on “Build and Run.” Everything should now look as you want it
    to.


    # MOVING YOUR APP FROM THE SIMULATOR TO THE IPHONE


    To move the app from your computer to your iPhone or iPod for testing purposes
    (not to put on the app store, which takes a little bit more work), you will need
    to obtain a provisioning profile for your app, for your device, and for yourself.


    The first step is to go to the iOS Dev Center site (http://developer.apple.com/iphone/)
    to register to become a developer. Once you are logged in, you will see a menu
    bar on the right that reads “iPhone Developer Program” (figure 6.9).


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_44_0.png)


    Figure 6.9


    Next, click on iPhone Provisioning Profile. Then click on App IDs at the left-hand
    side; click on New App ID and fill in the information for your app.


    Next, click on Provisioning at the left side of the screen and select New Profile.
    Once you’ve created the profile, download it to your computer. In the next few
    steps, we will match the profile to the key that you’ll generate for the iPhone
    or iPod that you wish to test the app on.


    After you have created your provisioning profile, you’ll want to return to the
    Xcode Organizer (located in the Window menu) to pull the product identifier from
    your device (figure 6.10). Once you’ve plugged in the device and opened the organizer,
    click on Provisioning Profile and copy the app identifier. Next, go back into
    Xcode, click on Info.plist, and go to the box in the lower-right pane (figure
    6.11). Change the bundle identifier to the one you have just copied, but leave
    in your user name.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_44_1.png)


    Figure 6.10'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/1c33fb3bae0a705f04846bc77d279fd7_45_0.png)


    **Figure 6.11**


    So your app ID should look something like this: IDNUMBER.com.scottlacounte.libraryapp
    (App ID.com.PROFILE NAME.APP NAME).


    When you have installed all of the certificates and are finally read to go, the
    most important step is to make sure the Xcode is set to Device and not Simulator
    (figure 6.12). Until you switch this, the app will not load on the iPod or iPhone.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_45_1.png)


    **Figure 6.12**


    If you have done everything correctly, there will be a delay of approximately
    ten seconds before the iPod or iPhone turns on. If you missed a step, then in
    your device organizer there will be an orange circle next to the device (figure
    6.13). When you click'
