- pgno: 39
  md: 'So let’s talk about this app. All the buttons are placed in what I considered
    the order of most importance to patrons. The most popular buttons will likely
    be “Call the Library” and “Hours.” This is what will be the Home screen.


    **Generic Library Logo:** Whenever possible, I recommend using the logo that patrons
    already know; try to also use similar colors as on your main web page. Remember,
    however, that users won’t be normal computer users—people who access the app are
    frequently outside and their screen is harder to see. Colors are even more important
    on a cell phone than on a computer.


    **Call:** When creating apps there are two kinds of buttons; the first is a hyperlink
    that takes you to another page. The second is an action button. Action buttons
    do exactly what the word *action* says. They might tell the phone that the user
    wants to call a number; when pressed, the phone automatically launches the dialer
    and begins to make a call (see the end of this chapter for the code used for the
    action button).


    **Hours:** You can do one of two things with the “Hours” link: you can create
    a mobile page with hours of operation, which is the simplest and quickest approach,
    or you can create a script that counts down the number of minutes until the library
    either closes or reopens again.


    **Locations:** Patrons want to know not just where the library is but also how
    to get there; this is where a mobile app can help. To keep things simple, I won’t
    go into using GPS; if you want to know more, refer to the PhoneGap website tutorial
    (http://phonegap.pbworks.com/PhoneGap-Tutorial:-Get-GPS-Coordinates/).


    **Find a Book:** Most libraries will be a little limited in the “Find a Book”
    option because, unfortunately, many vendors haven’t yet gone mobile, so it’s difficult
    to make a mobile-friendly version of your catalog. In the chapter on advanced
    features, I talk a little bit about a workaround to this. If your catalog vendor
    does not currently offer a web app, start asking why. Few vendors have caught
    on, and they won’t until librarians continually ask for it.


    **Research:** Many research providers have yet to go mobile, so make sure you
    encourage them to do so. One vendor that has gone mobile is Gale, which has a
    terrific app called AccessMyLibrary. The app lets patrons use the database from
    their phone if they are within a ten-mile radius of the library—and no log-in
    is required. Even if you do not decide to develop an app, you can promote this
    service.


    **Children’s and Teen Programs:** Obviously, you will want to reference the services
    you actually have in the library on this page; it is also possible, however, to
    put'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'games on this page. There are a number of places you can go to get JavaScript-based
    games that you could implement on these pages; a Google search will give you literally
    thousands of pages—some are open source, some are paid. JavaScript, especially
    on the iPhone, can be tricky; make sure you test the page to see if the JavaScript
    code actually works. When you are getting code from the Internet to use on a mobile
    app, it can be hit or miss.


    **Computer Classes:** The next chapter goes into greater detail on this topic,
    but one thing to consider is providing videos of different classes or two- to
    three-minute demos of how to do different things on the computer—or even a hyperlink
    to a helpful YouTube video on different computer-related subjects.


    **Text a Question:** If you don’t have a texting service at the library, get one!
    It’s free! Google Voice is fine for most libraries. There’s an easy code for an
    action button for this. Just add the following code to your app: <a href="sms:1234133424243">Text
    a Question</a>.


    **About:** This is where you can explain the app’s purpose and who to contact
    to report any bugs or glitches.


    All the information on the app so far easily applies to web apps. Changing your
    app to an iPhone app requires only one or two extra steps.


    The District of Columbia Public Library was one of the first public libraries
    to build an app for its book catalog; the library put the code for the app online,
    and it’s free to copy (http://dclibrarylabs.org/projects/iphone/). You may not
    want to use it (or may not even like it), but it’s a good reference to start with
    as you begin to learn about code.


    # PUTTING THE APP ON THE IPHONE AND IPOD TOUCH


    To begin installing your app on the iPhone, you will need to download both the
    iPhone SDK and PhoneGap (on an Intel-based Mac computer) from the following websites:


    **iPhone SDK:** http://developer.apple.com/iphone/index.action/


    **PhoneGap:** www.phonegap.com


    It’s important that you save all of your mobile web files with the HTML extension
    (not HTM). If you have saved them as HTM, then make sure to rename them with the
    appropriate extension before proceeding. Also, make sure that your home page file
    is named “index.html.”


    Then move the mobile website you have created into the PhoneGap directory. After
    unzipping the PhoneGap files, open the PhoneGap directory and then open the iPhone
    directory (figure 6.2).'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/1c33fb3bae0a705f04846bc77d279fd7_41_0.png)


    The iPhone app structure has already been created, so what you are doing at this
    point is simply applying your mobile web app to a prebuilt template. You can then
    drag and drop all of your mobile web app files into the WWW directory (figure
    6.3).


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_41_1.png)


    Your first iPhone app is now complete! Yes, it really is that quick! There are
    still some tweaks left to perform, but the description here should give you a
    good idea of just how easy it is to get started developing apps for the iPhone.


    To see your app in action, go back to the PhoneGap and iPhone directory and open
    the file “PhoneGap.xcodeproj.” This will launch Xcode, the iPhone developer software
    (figure 6.4).'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/1c33fb3bae0a705f04846bc77d279fd7_42_0.png)


    # Figure 6.4


    Next, click the drop-down menu in the upper-left corner of Xcode, make sure it
    is set to “Debug,” and then select the simulator you want to run. It’s best to
    select the most current simulator (iPhone 4.0), because that is the device that
    most people will have. It is also a good idea to ensure that the simulator runs
    on all platforms. For example, if you select iPad as your simulator, it will run
    the app as an iPhone app, not an iPad app, and so the app will appear significantly
    smaller than it would normally (figure 6.5). You are now ready to build the app.
    Click the “Build and Run” button.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_42_1.png)


    # Figure 6.5


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_42_2.png)


    After about ten seconds the simulator will launch, and your app will appear. If
    it does not launch and you see red or yellow flags in the lower-right side of
    the screen, click on the flags to examine the message. You will notice two things
    the first time the app loads. First, the icon is for PhoneGap; second, the loading
    image reads “PhoneGap.” Let’s see how to get rid of those two graphics and replace
    them with library images. Close the Xcode program and simulator. Now, let’s make
    an iPhone app icon. It’s simple. Create an image with a dimension of 57 × 57;
    use the file name “icon.png” to save the image. Move the file you created into
    the PhoneGap and iPhone directory. The file will replace the already-created “icon.png”
    and replace it with your new one. Next, let’s change the start-up image. Repeat
    the steps to create an icon, except this time name your image “Default.png” and
    make sure it has the following dimensions: 320 × 480. Move this image into the
    PhoneGap and iPhone directory.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Before launching the Xcode app again, rename “PhoneGap.xcodeproj” to your actual
    app name (i.e., “libraryapp.xcodeproj”); for our purposes, let’s use “library.xcodeproj”
    as a file name. Once you rename it, open the file again, which will relaunch the
    Xcode software.


    At this point, your icons and start-up screen will have changed, but the icon
    will still read “PhoneGap.” To change the name that appears, click on the Config
    directory in the open window (figure 6.6).


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_0.png)


    Figure 6.6


    This will bring up a new window at the lower-right side of the screen (figure
    6.7). Under “Bundle display name,” click on PhoneGap and then type in the name
    that you want to appear. For our purposes, I used the name “Library App.”


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_1.png)


    Figure 6.7


    Before loading your app in the simulator again, go to the top of the screen, click
    on Build, and then click on Clean All Targets (figure 6.8). It is advisable to
    do this before you run the simulator, just to make sure that you’ve saved and
    updated all changes.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_43_2.png)


    Figure 6.8'
  merge: -1
