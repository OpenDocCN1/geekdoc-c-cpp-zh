- pgno: 20
  md: '# HOW POWERFUL IS WCSS?


    This chapter is a crash course in Cascading Style Sheets, or CSS; if you already
    know how to use CSS, then this chapter will be a refresher. For a comprehensive
    view of CSS, I recommend that you check out CSS: The Missing Manual, by David
    McFarland (published in 2006 by O’Reilly Media). What’s important for you to know
    is that, although CSS is certainly useful and beneficial in developing a mobile
    website, it is not essential. If you don’t use it, you can still develop a fully
    functional mobile website. So here are the basics.


    The CSS tool was created to solve a specific problem with HTML, and it has since
    proved among the most useful of all Internet innovations. In HTML, every piece
    of text can have its properties specified individually. For example, you can specify
    that a certain line of text is red, underlined, and 12 points. If you want to,
    you can specify these properties separately for each letter on a page. This method,
    however, vastly increases the page’s size and, more important, creates a lot of
    extra work for the designers, who have to specify each instance of how a link
    should look, how paragraph text should be displayed, and so forth. CSS eliminates
    this hassle.


    A Cascading Style Sheet is really just a text file. It is usually separate from
    the main HTML code and, on the page, there is a call for that style sheet written
    into it that determines which style sheet will be used and, thus, how the page
    will look. Using CSS with mobile devices requires the inclusion of some tweaks
    to the codes language. This led to the development of Wireless CSS (or WCSS),
    which is tailored to mobile sites. If you understand CSS fairly well, you should
    have no trouble understanding WCSS.


    To understand how CSS works, think of your website as consisting of two main parts.
    The first part is the content of the site, which is specified in the XHTML-MP
    document that you created on the basis of your HTML site. The second part of the
    site is the WCSS component, which determines how your site actually looks when
    it’s displayed in a browser. With WCSS, you can also add some functionality and
    text effects.


    WCSS is enormously powerful. Basically, one text file controls the entire look
    of your site, including every element on the page.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'The syntax of CSS and WCSS are easy to understand. A selector identifies every
    element on your page that can be tagged with HTML (e.g., H1, P, A). These selectors
    have properties, such as color, size, ornamentation, and so forth, and all of
    those properties have values, such as red, 12 point, or underline. These properties
    are entered in a very simple format. For example, if you want every H1-level heading
    on your site to be green, the WCSS code is as follows:


    ```

    h1 {color: green}

    ```


    You can also use the number code (i.e., hexadecimal code) to specify color. For
    example, for all your paragraph text to be black, you would use the following
    code:


    ```

    p {color: 000000}

    ```


    You can use any HTML tag as a selector. To specify multiple properties for any
    given selector, separate them with a semicolon. In most cases, designers also
    place each property on a separate line, with the closing curly bracket on a line
    of its own. For example, for all paragraph text to be 8-point black, and specified
    as such in the style sheet, you would properly express it in the following way:


    ```

    p

    {

    font-size: 8pt;

    color: black;

    }

    ```


    This formatting of the text file does nothing to change how the WCSS renders your
    page. It does, however, make it easier for other designers to pick up your work
    and to see how you have set up everything—where mobile web pages are concerned,
    adhering to standards is vital.


    # EXPANDING THE FLEXIBILITY


    ID selectors allow you to be more specific about the look of your page. An ID
    selector refers to a single instance of an item. So, for example, if you want
    one specific text element to render differently than all others, you could specify
    it in the CSS by using the following line (for the purposes of example, we’ll
    name this class “special”):


    ```

    #special

    {

    color: orange;

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Class tags allow you to specify this for an entire class of recurring elements
    on your page. For example, you could make all of the text that specifies library
    policy its own class and set it off in red as follows:


    ```

    .policy

    {

    color: red;

    }

    ```


    The power in this is that you could change any property of every instance of the
    specified class, or type of text, with no more than a few keystrokes. This has
    some creative uses as well. For instance, for the Fourth of July, you can change
    your mobile site’s color scheme to red, white, and blue; during Halloween, you
    can make it orange and black. You can make special style sheets and keep them
    on hand for various occasions, or you can revamp your website by changing just
    one file.


    # USING CSS INTELLIGENTLY


    CSS is primarily useful because it reduces the amount of work it takes to develop
    and maintain a site by reducing the complexity of making changes across your entire
    website. To use CSS effectively, you need to keep your style sheets properly formatted
    and your classes and IDs limited to elements that merit those distinctions. For
    example, the more you separate common elements of your site into separate IDs
    and classes, the harder it will be to make large-scale changes. As much as possible,
    keep your site consistent with respect to the look of the headers and other elements;
    doing so will make it easier to make broad changes.


    You can also use CSS to format links. This is a good way to reduce your site’s
    dependency on graphics, because you can get rid of JavaScript rollover images
    and other resource-consuming elements that add little in the way of functionality.
    Simplifying your site with CSS can reduce page-load times; keep a consistent look
    throughout the pages; and make it easier to put new ideas into place when you
    want to change the site around a bit, whether those changes are permanent or temporary.


    # BROWSER SIZES, CSS, AND POSITIONING


    You can use CSS to determine how all the elements on a web page are positioned
    in relation to one another, in relation to the corners of the screen, and in other
    ways. Because of this, CSS more easily accommodates the needs of diverse visitors
    than HTML does.


    # CSS VERSUS TABLES


    One of the easiest ways to position elements on a page in HTML is to use tables.
    The use of tables dates back to when the language was first designed, and older
    pages tended'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'to use tables heavily. However, the use of tables has several disadvantages
    for mobile websites.


    Tables add information to the HTML page, as their dimensions and other properties
    have to be defined in the document. For mobile sites, reducing the size of files
    is paramount, and CSS allows for this by keeping that information in an external
    file, not in the document itself.


    Tables are also clumsier with respect to laying out objects. When the specified
    dimensions of objects are too large to be accommodated by a specific screen, tables
    tend to crowd objects together or to bleed them off the side of the page. When
    objects are too small, tables waste valuable page space. In this regard, CSS offers
    superior positioning options.


    # ABSOLUTE POSITIONING


    Absolute positioning means specifying that elements of the page appear in specific
    areas of the screen, regardless of the screen size. Absolute positioning can be
    used to accommodate all users because the page elements display correctly on even
    the smallest of screens. A well-designed page will always look good on larger
    screens, but there will be more unused space on the display. The CSS for setting
    an element’s position in absolute terms is written as follows:


    ```

    h1

    {

    position:absolute;

    left:25px;

    top:50px;

    }

    ```


    This code tells the browser to display anything labeled <h1> at 25 pixels from
    the left of the screen and 50 pixels from the top. That way, no matter the user’s
    screen size, the mobile device will display content tagged “h1” in that position.


    # RELATIVE POSITIONING


    Relative positioning allows you to specify a container and position the page elements
    within that container. This type of positioning is sometimes used on sites to
    better control for smaller resolutions. For example, if you have a borderless
    background, you can frame your page within the confines of an 800 × 600 monitor
    resolution and position all the elements on your page within that container.


    # FLOATING


    Most web designers use floating to position elements, as this simply places elements
    preferentially to the right or the left of the screen. If there isn’t room to
    accommodate'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'the elements on the screen, then they can appear in a logical order that flows
    from top to bottom. This accommodates the linear design requirements of mobile
    websites, which makes this method very convenient.


    # MAKING YOUR FIRST CSS DOCUMENT


    All you need to make a CSS document is a text editor. The selectors, their properties,
    and their property values are expressed as detailed above, and there is little
    complexity to deal with.


    Embedded style sheets appear at the top of the document, within the header. To
    change any given page that uses such a style sheet, you must change each style
    sheet individually.


    Linked style sheets are stored in a separate file, which offers the most convenience
    when you need to make massive changes to a site. Your style sheet is called for
    in the header of your document. The tag looks like this:


    ```

    ```html

    <link rel="stylesheet" type="text/css" href="your_style_sheet_here.css" media="all">

    ```

    ```


    If you’re creating a style sheet manually, simply give it a name and save it in
    a directory on your website. In the header of your web page, paste in the previous
    tag. This will link the page to the style sheet, and the style sheet will then
    determine the look of the page. If you want to change the look of the page, simply
    specify a different style sheet in the link.


    # KEEPING IT SIMPLE


    Remember that mobile devices have considerably less display area than computers.
    When you start putting together the layout of your site, keep it very simple.


    A popular page design for libraries makes use of three elements that allow users
    to make the most of the mobile presence:


    +   1. A banner with a phone number

    +   2. Text links to other pages

    +   3. A search field


    For most libraries, these three elements make for an excellent home page. There
    are few elements to arrange and, as long as the elements are designed with forethought
    and correctly positioned, they should display effectively in every mobile web
    browser. Because there is so little on the page, it will also load quickly. You
    can even eliminate the graphic for the library logo altogether and replace it
    with a simple text link. This makes the site more accommodating for those who
    have older-generation mobile devices.


    Remember that the more your navigation relies on simple text links, the less space
    you will lose to graphics. Of course, you can use CSS to make elegant text links,
    including'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'ones that provide rollover effects and other visually interesting elements—this
    is yet another reason to employ the CSS tool whenever possible.


    If you want to add graphical menus and other functionality to your mobile site,
    you’ll need to learn a bit about JavaScript, which is an ubiquitous web language.
    However, it is also complex and takes a qualified programmer to write it. Understanding
    how JavaScript works and what it offers, however, is the last step in determining
    how to put together your page.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# JAVASCRIPT AND MOBILE WEBSITE DESIGN


    This chapter is meant to give you an overview of what JavaScript is and how it
    functions—not to teach you everything you need to know; Danny Goodman’s JavaScript
    Bible (published by Wiley in 2010) is the most comprehensive book you’ll find
    on the subject. As with CSS, JavaScript isn’t required for developing a mobile
    app, and it is less essential to designing a good app.


    JavaScript is a client-side scripting language that allows users’ computers to
    execute specific functions. In a less technical sense, JavaScript tells a device
    to perform various tasks. For example, some search pages automatically place your
    cursor in the search field for you. The cursor doesn’t go there on its own; the
    site often uses JavaScript to place the cursor there.


    JavaScript does not actually contribute a great deal to the layout of your page.
    There are no websites, mobile or otherwise, that are built on JavaScript alone.
    It is, however, an important element for adding functionality to your site, and
    to some extent, it can add some visual appeal.


    # GETTING JAVASCRIPT


    JavaScript is extremely popular with both designers and programmers of regular
    websites. The reason for this is the power that it allows designers to wield over
    the functionality of their pages. This is especially important for libraries,
    because using tools such as these can cut costs considerably. For example, JavaScript
    allows coders to use a much better known and more frequently used code and not
    take the time to learn a phones-native language to do essentially the same thing.


    You can download libraries of various JavaScript resources and include them in
    your site, which is often easy to do and doesn’t take any real programming knowledge.
    Usually, you only need to add a small script into the web page.


    For mobile sites, though, JavaScript brings up some significant compatibility
    issues. Moreover, by adding code directly to your page, you increase its size.
    For users with browsers that lack JavaScript compatibility, that amounts to downloading
    extra data that offer no benefit at all.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# THE BASICS OF INCLUDING JAVASCRIPT


    Although you can add more advanced features with JavaScript, its support among
    mobile devices is spotty at best, and you should test it thoroughly before deploying
    the site to patrons.


    JavaScript is a scripting language that works on any computer. It is included
    in the HTML of a page and allows browsers to perform a variety of functions. The
    code appears in the following format:


    ```

    <script type="text/javascript">

    document.write(''Your message here!''); </script>

    ```


    In the context of a full page, the script would be expressed in the following
    way:


    ```

    <html>

    <head>

    </head>

    <body>

    <script type="text/javascript">

    document.write(''Your message here!'');

    </script>

    <noscript>

    ```


    Your browser either does not support JavaScript, or you have JavaScript turned
    off.


    ```

    </noscript>

    </body>

    </html>

    ```


    This script would tell the browser to write “Your message here!” on the page in
    the position determined by the script’s location in the HTML. You can specify
    the font and other attributes of the text, just as you can for any other element
    on an HTML page. JavaScript can get very complex, though, and some large scripts
    constitute large parts of the content of some web pages.


    In the event that the visitor’s browser doesn’t support JavaScript, the site visitor
    would receive the message “Your browser either does not support JavaScript, or
    you have JavaScript turned off.”


    Some scripts are contained in the header of the HTML document and are called at
    the point in the body where their output is desired by a second code. These scripts
    can perform functions such as displaying dynamic information, providing messages
    based on user actions, or date and time. They can also be used to process some
    types of information and to perform simple functions. JavaScript can be custom
    coded, but even'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'professional designers tend to make heavy use of the free libraries available
    on the Web, as those resources address the most common JavaScript issues.


    JavaScript also is used in some cases to provide better accessibility to web page
    content, such as allowing users to make the page’s text bigger.


    # JAVASCRIPT AND FORMS


    JavaScript is used heavily for the handling of forms. For libraries, these might
    be forms that allow users to do a quick search of the site or of the card catalog
    or to update their library account information. There’s no reason that you can’t
    provide these functions on a mobile site; to perform them, however, the user has
    to provide you with specific information. This can be more resource intensive
    than it sounds.


    If a user submits a form with missing information to the server, the server has
    to process the form, figure out what’s missing, and send it back to the user with
    the missing elements indicated. For mobile users, this can use up their airtime
    as they wait for all this to happen. JavaScript can inspect a form as it’s filled
    out and, if there’s something wrong, point that out to the user before they send
    it. This saves them time and saves your server’s resources.


    The drawback of using JavaScript is that many mobile web browsers do not support
    it at all. Therefore, adding JavaScript to your pages benefits only some of your
    patrons and may make the site work more poorly for the rest of them. So, designing
    with JavaScript is all about using it intelligently.


    # WHERE TO USE JAVASCRIPT


    If accessibility is an issue for your library, then you should have a version
    of your mobile website that does not employ JavaScript at all. Older phones often
    cannot execute JavaScript, which will make some of your site’s features unavailable
    to some users. It’s probably the case, though, that most users are using newer-generation
    phones.


    On newer-generation phones, there are several ways you can enhance their experience
    on your site. For example, you can add code to your site that will detect the
    size of users’ screen and change the style sheet used to render the site accordingly.
    This means that you can have a developed, ornate version of your site for the
    smartphone crowd and a simpler version for those using older phones. Combined
    with CSS, JavaScript can greatly increase accessibility in this way.


    The way this works is fairly complex, but the overall concept is easy to understand.
    Whenever a mobile device visits your website, you can query as to what kind of
    device it is. When the information is sent back to the server, the server looks
    up the device on a list of mobile devices and matches it to the right phone on
    the basis of the dimensions of the screen. The phone information returned includes
    the screen dimensions, which the server then uses to send users the right web
    page for those dimensions.


    JavaScript is often used to make pop-up windows—the useful kind, not the kind
    that was the source of much irritation in the past—animated menus, and other features
    that'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'add visual interest to the page. On mobile sites, these things are best avoided,
    mostly because users navigate mobile websites differently than they do regular
    websites.


    If you have different versions of your website for different devices, then you
    can offer some JavaScript functionality for those devices that can run it. This
    can make sure that devices that cannot process JavaScript do not receive versions
    of your page that are unusable.


    Mobile devices are increasingly making use of nearly full-fledged browsers rather
    than specific apps for surfing the Web. This means that support for JavaScript
    among mobile browsers is increasing, and it will likely become a more common element
    in mobile web design.


    Setting up a JavaScript element to detect smartphones can be useful, but it might
    not always work out as you plan. Some mobile browsers don’t identify themselves
    correctly or are set up to identify themselves as a different type of browser,
    such as Internet Explorer. In addition, not everyone with mobile devices that
    support JavaScript will have the right feature turned on. In some cases, users
    block JavaScript altogether to enable faster page-load times and to keep their
    browsers more secure. These are all considerations when designing with JavaScript.


    # JAVASCRIPT MISSTEPS


    One of the most popular uses of JavaScript is to create menus. In some cases,
    menus can be confusing to users. Users on mobile devices tend to navigate with
    buttons, not a mouse, so that’s another reason to avoid going overboard with menus.
    For mobile devices, you should avoid rollover mouse effects (e.g., a button lights
    up or shifts position when you roll the cursor over it). On mobile devices, such
    menus require too much code and too many resources.


    It’s also important to make sure that your JavaScript applications are compatible
    with mobile devices. For example, not all mobile devices might have a substitute
    for the mouse, which means that the device might ignore altogether any events
    that are linked to the mouse, which may cause problems with the page. There are
    variations on JavaScript cursor actions designed to accommodate smartphones, but
    they are not universal. For example, the current generation of smartphones does
    not reliably support the drag-and-drop functionality that you can add to web pages
    with JavaScript.


    There is expanding support for more mobile browsers, however. Free JavaScript
    libraries have more and more features with every revision that can provide added
    functionality to smartphone browsers. Some of the newest innovations include the
    following:


    +   - increasing support for touch screens

    +   - support for scroll bars being placed within browsers

    +   - support for more sophisticated animation


    Because there is so much variation among mobile devices, however, there is still
    great inconsistency in JavaScript compatibility.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# JAVASCRIPT APPLICATIONS


    JavaScript is oftentimes used to create browser-based applications, such as measurement
    converters and simple games. However, these applications can become very complex,
    especially on very developed websites that offer a great deal of user functionality.


    On mobile websites, applications can be a problem because of compatibility issues.
    Although they’re great for incorporating into your main website, the mobile versions
    of most major websites eliminate JavaScript applications altogether. The potential
    benefits of using complex JavaScript applications are simply not reliably delivered
    even by the most advanced smartphones, although compatibility is sure to increase
    with time.


    # IS IT VIABLE?


    Presently, mobile devices do not universally support JavaScript. This means that,
    in terms of accessibility, a library would have to offer a JavaScript-free version
    of any page it currently publishes on its website to enable the widest variety
    of users to access it. Functions that are completely dependent on JavaScript will
    not be available to those whose phones cannot support it. Some phones do support
    JavaScript, but it may not function as intended, particularly for user-action-triggered
    events, such as mouse-overs and hovers. This may make JavaScript unsuitable for
    some libraries and for the majority of their patrons.


    However, you can use JavaScript in limited deployments and offer your visitors
    increased functionality and more convenience, especially in handling forms and
    other basic needs.


    You can quite easily and inexpensively test JavaScript’s suitability on your website.
    Because of the many free JavaScript libraries available and because anyone who
    can edit HTML can install the scripts on a page quite easily, you can check to
    see whether adding a feature based on JavaScript provides a better experience
    for your clients. Make sure you test it yourself on various devices: smartphones
    use different browsers, so check the functionality of your page on all smartphones.


    Again, the most important element of mobile web design is simplicity. However
    advanced and developed your main site is, you’ll have to strip it down to the
    essentials to make it useful for those who prefer to access it on the go. In some
    ways, your mobile site mirrors what you have on your main site, but it is better
    thought of as a separate entity altogether. It might contain a great deal of the
    same content as your main site, but it will be directed toward providing the fastest,
    most efficient, and most no-nonsense user experience possible. However, as mobile
    web use rapidly increases, there will be a significantly increased demand among
    library users to have library resources available on mobile devices.


    # WHERE CAN LIBRARIES USE JAVASCRIPT?


    If you are trying to decide whether you should learn JavaScript, you first need
    to ask how the library can use it. Two common uses for JavaScript is in developing
    forms and'
  merge: -1
  img_proc: true
- pgno: 31
  md: providing a chat-based reference service. It also is nice to have a place for
    patrons to add and send comments, or to create a library application page where
    patrons can apply for a library card from their phone, or to find out when the
    next computer is available, or to create a mobile-friendly catalog. But whether
    it's worth the time to learn the language is up to you. For chat-based services
    especially, there are relatively cheap non-JavaScript options as well, so it might
    be in your interest to use one of those services and save yourself the trouble
    of learning the language. If you don't already know Java programming, then you
    will probably be better off designing an app without it and looking into adding
    in JavaScript to the app later.
