- pgno: 33
  md: '# Table 5.1 Supported Features of PhoneGap


    |  | iPhone | Android | BlackBerry | Symbian | Palm |

    |---|---|---|---|---|---|

    | Geolocation | X | X | X | X | X |

    | Vibration | X | X | X | X | X |

    | Accelerometer | X | X | OS 4.7 | X | X |

    | Sound | X | X | X | X | X |

    | Contact support | X | X | X | X |  |

    | Camera | X | X | X | X |  |

    | Multitouch | X | X |  |  |  |

    | Copy and paste |  | X |  |  |  |


    What follows is a brief explanation of the PhoneGap features and examples of how
    they work in practice:


    **Geolocation:** Geolocation is a feature in every newer-generation smartphone
    that enables the phone to use its internal GPS to determine its real-time location.
    What does that mean for an app? It could, for instance, let library patrons find
    out where the library is located in relation to their own position and help them
    get directions.


    **Vibration:** Vibration lets you take advantage of the internal vibration setting
    available on phones. For example, developers could create an app that notifies
    users of alerts through vibration.


    **Accelerometer:** An accelerometer is a feature first made popular by the iPhone
    but now available in nearly all phones. This feature rotates the screen when the
    phone is turned on its side.


    **Camera:** All camera phones are built differently, and using the camera feature
    will likely result in some glitches.


    A complete list of PhoneGap''s features can be found online (http://wiki.phonegap.com/Roadmap/);
    the site is updated often and includes extra documents and discussions where developers
    can find support.


    # VIEWING YOUR WEBSITE ON PHONEGAP


    Now it’s time to see how your library’s website looks on a mobile device. If you
    have a mobile phone, then this is easy; but just because your website looks great
    on Android doesn’t mean that it will look equally great on an iPhone or a BlackBerry.'
  merge: -1
  img_proc: true
- pgno: 34
