- pgno: 48
  md: '# 7


    # BEYOND THE BASICS


    The point of this book is to make building an app as simple as possible. You can
    add JavaScript to your app to make it flashier, but talking in detail about JavaScript
    would take away from the point of this book—keeping it simple.


    JavaScript is a pretty powerful language that can do a lot of things, but learning
    it isn’t essential to building a great-looking app. If you know JavaScript, then
    use it; if you don’t, then there’s another option: widgets. If you blog or read
    blogs, then you likely know all about widgets, even if you don’t know them by
    name. Widgets are the small little boxes that sit on the sidebars of blogs and
    offer links to things like Twitter, Facebook, and Google News streams. Widgets
    appear on the surface to be quite simple, but there are pages of code built into
    each one. The good news is that you don’t have to know the code to build them.


    A simple Web search for “widgets” turns up thousands of pages that offer customizable
    widgets; some are free, and others have small fees attached. You’ll need to watch
    out for widgets that use Flash (which many phones do not currently support—most
    notably, the iPhone).


    Many websites also offer widgets. Twitter is the perfect example. On the widget
    web page for Twitter (https://twitter.com/widgets/) you can build a custom widget
    in just a couple of short steps.


    First, on the widget page, select My Website (figure 7.1).


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_48_0.png)


    On the following page you will see several options; choose Profile Widget, which
    will display your library’s most recent tweets.


    Next, you can customize your widget (figure 7.2). Under the user name, you ideally
    would put the name of your library, but you can also put authors, magazines, or
    the name of anyone else with a public Twitter account. This would give your app
    content if you don’t have time to do it yourself.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/1c33fb3bae0a705f04846bc77d279fd7_49_0.png)


    # Figure 7.2


    Under Preferences, you can select how many tweets you display. Although the limit
    on Twitter is thirty tweets, it is advisable to consider the screen size of the
    mobile device you are developing for. You don’t want users to have to scroll too
    much—ideally, you don’t want them to scroll at all. Because of that, you might
    keep the number of tweets displayed to four.


    Under Appearance, make sure the colors you select match the colors of your app.
    Under dimensions, you can adjust them to the dimensions of the phone or choose
    auto width if you want it to resize the widget yourself.


    Finally, go to the bottom of the page and select Finish & Grab Code (figure 7.3).
    Now just copy the code and paste it into your app’s code.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_49_1.png)


    # Figure 7.3


    If you are thinking about providing a chat-based reference service (if you are
    not, you should be—by not doing so, you’ll miss an entire generation of users),
    then consider LibraryH3lp (http://libraryh3lp.com). There is a small annual fee
    for the site’s service (which varies depending on the size of the city you’re
    in), but it is much cheaper than many similar services. Meebo and Google Talk
    offer free chat services, but their widgets use Flash, so they aren’t supported
    on the iPhone app. In contrast, LibraryH3lp uses Java, so it’s app friendly. Box
    4 displays the source code of LibraryH3lp’s widget.


    In a mobile browser, the code from box 4 would look similar to figure 7.4.


    Widgetbox (www.widgetbox.com) is one of the most popular widget builders; it’s
    free but advertisement supported. A pro version (without the ads) is also available,
    starting at $29.99 a year. The site offers both Flash- and Java-based widgets.


    Facebook also provides steps for embedding profiles into websites (http://developers.facebook.com/docs/guides/web/).
    Widgetbox, however, makes a much more user-friendly version, and if you are new
    to development, it is the better choice. Just make sure you copy the Java-based
    version of the widget and not the Flash-based one.'
  merge: -1
  img_proc: true
