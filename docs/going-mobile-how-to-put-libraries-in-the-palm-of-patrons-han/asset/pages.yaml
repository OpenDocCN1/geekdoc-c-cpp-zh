- pgno: 46
  md: 'on the device, it will tell you what the error is. The most common error has
    to do with the provisioning profile not matching the device, which means that
    there is a certificate missing. Double-check the iOS Dev Center page to make sure
    you have downloaded all the certificates.


    Once you are satisfied with your app and ready to sell it, then you will need
    to follow the instructions online to do so. You’ll also need to pay the $99 registration
    fee for developers.


    ![](img/1c33fb3bae0a705f04846bc77d279fd7_46_0.png)


    # TESTING CORE USERS


    Once you have an app ready to go, the final thing to consider is the best way
    to promote it. For example, people who will use the app are not necessarily the
    same people who visit the library regularly. How can you promote a service to
    a group of users whom you might not see on a regular basis?


    One way to reach your user base is through a local online campaign. If the library
    does not have a Facebook page, then it should create one—fan pages regularly attract
    nonregular library users or people who want to know what’s going on in their community
    but don’t frequently visit the library.


    Many businesspeople use smartphones—with this user base, you might collaborate
    with restaurants and coffeehouses near business areas of the city. Many businesses
    would be glad to leave out flyers advertising your app, especially if you include
    their name on the app in a sponsor category or work out some other arrangement.
    To get people into the library whom you might not usually see, you might put a
    coupon for a free video rental on the app—all they have to do is show the coupon
    on their phone and then the library would make a note that the patron has used
    the rental coupon.


    To publicize your app, you can also look beyond the library at what businesses
    have done to get people on their Facebook pages or websites. Many local Chick-fil-A
    Facebook fan pages, for example, post code words each week on the fan page. If
    you go to the restaurant on a certain day and say the code word, then you get
    a reward. People visit the page fanatically to keep up to date just so they don’t
    miss out on something. Thousands of other businesses have similar strategies.


    Phones don’t have a lot of storage or screen space. So you need to make your app
    appealing. If patrons have to choose between leaving the iPhone app for the Internet
    Movie Database on their phone and the library’s app, will they really choose the
    library’s? Why not? As you develop the app, continually ask yourself, “What will
    make people come back again and again?” For example, why would patrons bother
    downloading an app that tells them what time the library closes?


    Library apps need to be interactive. If it was easy to communicate with librarians
    through an app, and if there are lots of phone-enabled research tools, then the
    app becomes a more essential tool. If it’s not interactive, users will go with
    other apps every time.'
