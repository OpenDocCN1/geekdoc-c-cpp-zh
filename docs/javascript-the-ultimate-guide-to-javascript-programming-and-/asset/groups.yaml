    Furthermore, any investigation of such matters requires a search warrant in order
    for an officer to examine the entry and can make the procedure time consuming.
    Another difficulty in ensuring computer security is that in the age of globalization,
    which information can be shared throughout the world, and apprehending those responsible
    is particularly difficult. The reason for this is that a hacker might be working
    from one jurisdiction, while the system they are hacking into is in a different
    jurisdiction. Furthermore, a hacker can use various techniques (such as a temporary
    dial-up) in order to ensure their anonymity. The third problem is due to the high
    number of attacks. Organizations can be subject to many attacks and therefore
    are unable to pursue every security threat. A computer user would benefit from
