    # Internet LAN


    ![](img/7d7681224c1536e030055a556b655618_64_0.png)


    A spoofing attack (otherwise known as phishing) is an enemy program, system or
    website that poses as a trusted one. By falsifying data the hacker is able to
    masquerade as a trusted system and thus fool a program or user into revealing
    confidential information as passwords or bank details. Another hacking technique
    that is commonly


    used is a root kit, which is a program that manages to take over the control of
    an operating system by employing hard to detect methods.


    A Trojan horse is yet another technique that is a program which manages to fool
    systems and users; it works by working in one way while seeming to be doing else.
    By using this method a hacker is able to gain unauthorized access to a system
    and create an access point so that they can re-enter via established route later
    on. A computer virus is the most widely recognized form of hacking, as it is the
    computer threat that most of the public is aware of.


    The virus works by self-replicating and implanting itself into computer codes
    and while; some computer viruses are malicious some are merely irritating or harmless.
    A computer worm is similar in that it is self-replicating, but it is able to enter
    a computer program without a user inadvertently letting it in, and it does not
    need to insert itself into present programs.


    Finally, a keylogger is a tool that records every keystroke on a given machine,
    which can be later be accessed and viewed by the hacker. This is usually to enable
    the hacker to access confidential information that has been typed by the victim.
    In fact, there are some legitimate uses for such a technique, for example some
    companies use a keylogger in order to detect any dishonesty or fraud committed
    by an employee.'
  - '[PAGE 65]


    A large area of computer hacking involves the use of social engineering, whereby
    in order to circumvent information security a person is manipulated to reveal
    confidential information or to grant access to secure networks. This technique
    (includes phishing) is usually only part of a complex routine in a wider fraud
    scheme, but it is also a dangerous step because human beings are more likely to
    be won over by a convincing trickster than a machine.


    Social engineering relies on the psychological aspect of decision-making, and
    can be thought of as one of the most significant vulnerabilities in a computer
    security system. There are many different ways in which social engineering can
    be applied in order to gain unauthorized access to a computer system, and this
    includes criminals posing as technicians who pretend that they are fixing computers
    in fact stealing data.


    Another example would be a trickster informing a company that the number of the
    helpdesk has changed, so when employees phone the number they will willingly disclose
    their account details thinking they are talking to somebody who they can trust
    with the information. These sorts of scenarios come under the category of ''pretexting''
    because making up a believable scenario allows the criminal to access the required
    information and leads the victim to disclose the information.


    Other professionals that a hacker involved in social engineering could pose as
    the police or bank manager, because these are individuals who we believe have
    the right to be granted any information that they request. Baiting is a subcategory
    of social engineering because it relies on psychology in order to work. Baiting
    is when a victim''s computer security is compromised when an infected device or
    USB stick is used.


    ![](img/7d7681224c1536e030055a556b655618_65_0.png)


    An example of baiting would be for the criminal to post a USB under somebody''s
    door with a tempting sounding and simply wait for the curious victim to plug it
    into their laptop, at which point malware would automatically install and infect
    their computer. This technique makes most of the human tendency towards curiosity
    and greed, because if a label promises erotic images, money or gossip then a victim
    may find it hard to resist taking a look.


    Kevin Mitnik, a once computer criminal who later became because a security consultant,
    has'
