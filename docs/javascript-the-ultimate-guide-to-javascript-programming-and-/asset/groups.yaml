  mdcn: "\n\n## 第2章 – 发现变量\n\n现在你已经知道了如何在 JavaScript 语言中编写、格式化和处理数据，现在是时候学习变量了。在本章中，你将学习如何使用变量来存储值。如果你不先学习如何编写变量，你将无法完成这一点。话不多说，让我们开始变量世界之旅。\n\
