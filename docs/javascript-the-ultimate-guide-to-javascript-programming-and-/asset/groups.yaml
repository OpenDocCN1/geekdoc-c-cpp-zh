    learnEasy = 13\n```\n\n注意，我们在这里不再使用变量关键字。这是因为控制台记得该值已经存在于它的内存中了。一旦你调用此变量，你现在将获得分配给它的新值。\n\
    \n```javascript\nlearnEasy\n→ 13\n```\n\n你也可以在数学表达式中使用现有变量的名称来更改其值。格式应该是变量名后跟赋值运算符。你在运算符后插入数学表达式。它应该是这样的：\n\
    \n```javascript\nlearnEasy = learnEasy + 16\n```\n\n这将我们的存储值更改为 29，因为该表达式调用了当前的变量值（13）加上\
