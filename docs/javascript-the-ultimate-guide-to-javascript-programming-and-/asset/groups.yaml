    \ 6 是我们要存储在名为 `learnEasy` 的变量中的值。\n\n现在我们已经已经在变量中存储了一个值，我们现在就可以通过变量名直接调用它了。在控制台中输入变量名“learnEasy”将得到我们赋值的值作为输出。\n\
    \n```javascript\nlearnEasy\n→ 6\n```\n\n在为我们的变量命名时，在 JavaScript 语言中有一些我们需要遵循的规则。这些规则如下：\n\
    \n- 1. 变量名中不能有空格。（例如：var learn easy, var sweet java）\n- 2. 变量名开头不能是数字。（例如：var\
