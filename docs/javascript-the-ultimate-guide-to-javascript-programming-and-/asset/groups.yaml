    # 源文件存放在何处


    当你浏览网站的文件管理器时，你永远不会错过一个名为“root/”的文件夹。这就是我们找到网站内所有内容的地方。这里也是你网站 index.html 的默认位置。


    根据上面的 index.html 文件，我们引导它在同一位置的文件夹内中查找 JavaScript 源代码文件——即 `root/` 文件夹。因此，我们应该将
    `greetings.js` 放置在相同的位置。


    ```

    + root/

    - index.html

    - greetings.js

    ```


    然而，有些网站会将所有的 JavaScript 源代码文件放在子文件夹中。它们最常见的目录是 `scripts/` 文件夹。以下是它们在你的网站目录中的外观。


    ```

    + root/

    - index.html

    + scripts/

    - greetings.js

    ```


    如果你想这样组织你的源文件，那么我们需要修改示例 index.html 中的 `<script>` 标签。你的 HTML 代码看起来应该是这样的：


    ```html

    <html>

    <head>

    <script src="scripts/greetings.js"></script>

    </head>

    <body>

    <h1>WELCOME TO JAVASCRIPT!</h1>

    ...

    </body>

    </html>

    ```


    注意，在这段代码中，我们指示 index.html 从 `scripts/` 子文件夹加载 `greetings.js`。


    # 在源文件中编写代码


    直接在 `greetings.js` 中编写控制台风格表达式（console-style expressions）会导致错误。让我们尝试在源文件中写入以下行作为示例：


    ```

    var hello = "Welcome to my website! "

    var enjoy = "Please enjoy your visit!"

    hello + enjoy

    ```


    一旦我们打开 index.html 并进入浏览器控制台，我们将看到除了错误之外什么也没有。这是因为我们对你真正想要显示的内容感到困惑。错误来自我们的 JavaScript
    源文件。与控制台不同，我们需要在源文件中不同的方式断言 JavaScript 代码。我们通过在每个语句后添加分号（`;`）来实现。因此，我们应该这样写 JavaScript
    代码：


    ```

    var hello = "Welcome to my website! "

    var enjoy = "Please enjoy your visit!"

    hello + enjoy;

    ```


    使用分号编写代码后，当你尝试访问控制台时将不再看到错误。然而，你会在控制台中看到任何内容。这意味着我们的代码没有被传递到浏览器的控制台中。JavaScript
    代码的执行仅发生在源文件本身。为了修复这个问题，我们需要使用 `console.log( )` 方法。


    我们想要的是显示由变量 `hello` 和 `enjoy` 拼接而来的字符串。以下是我们的做法：


    ![](img/7d7681224c1536e030055a556b655618_45_0.png)


    ```

    var hello = "Welcome to my website! ";

    var enjoy = "Please enjoy your visit!";

    console.log(hello + enjoy);

    ```


    通过使用 `console.log()` 方法，你现在能够在控制台中看到该字符串了。换句话说，我们现在有一个由 index.html 文件运行的有效 JavaScript
    编程语言。


    # 结论


    到此，你现在已经知道如何在 JavaScript 语言中编写值了。你刚刚学习了 JavaScript 如何解释数字和扁平文本，以及如何将文本转换为字符串值。你还学习了如何使用运算符和比较符将这些值操作为表达式和语句。


    在第二章中，你接触了变量。你学习了如何将值存储在变量中，以及拼接方法，通过它学习了如何以变量的形式快速处理值。还介绍了一些方法，如 `charAt()` 方法和
    `.length` 属性——这些工具可以帮助高效分析值。


    在第三章中，你学习了如何创建自己的 JavaScript 源文件。请注意，与控制台相比，在源文件中需要不同的断言 JavaScript 代码。你还了解了 `console.log()`
    方法，它允许你在浏览器控制台中打印值。然而，这仍然不是传递 JavaScript 代码最高效的方法。想象一下如果你要向浏览器传递成百上千个值？这意味着重复性编程和太多的麻烦。


    在《简单易懂 JavaScript》（JavaScript in Simple Words）系列的下一部分，我们将带你进入 JavaScript 的循环世界，在那里你将学习如何高效地管理重复代码。该书系列的后部分还将讨论几个主题，包括但不限于条件的使用和对话框的创建。


