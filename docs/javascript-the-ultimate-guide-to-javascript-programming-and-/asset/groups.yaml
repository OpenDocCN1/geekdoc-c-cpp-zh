    - 3.你可以同时使用下划线和美元符号。（例如：var learn_ea$）\n\n一个良好的变量名应该是这样的。它被称为“驼峰命名法”（Camel Case），以小字母开头，后续单词的首字母大写。\n\
    \n```javascript\nvarsimpleAndClean\n```\n\n如果你喜欢重用变量名来存储不同的值，你可以像这样在末尾添加数字来简化一切。\n\
    \n```javascript\nvar simpleAndClean2\n```\n\n## 修改变量中的赋值值\n\n让我们回到我们的示例变量 `learnEasy`。目前，我们为它分配了数值\
