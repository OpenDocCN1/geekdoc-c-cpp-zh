    # Chapter 1 – Hacking and the Influence of Cyberpunk


    Michael Bruce Sterling, the American science fiction author, helped establish
    the popular genre of Cyberpunk. Cyberpunk is a subcategory of science fiction
    that focuses on the role of technology in a future setting. In this literary and
    cinematic genre, lower-class citizens are depicted, who have access to, and a
    great understanding of advanced technology.


    Cyberpunk often explores the role of technology during the breakdown of social
    order, in which there is an oppressive government restricting and damaging the
    lives of the general population. Furthermore, artificial intelligence (such as
    robots or intelligent computers) also plays a significant part in Cyberpunk stories,
    and the Earth is depicted in the near future in a post-industrial dystopia (the
    opposite of utopia, and therefore a bleak world characterized by oppression and
    often social unrest).


    ![](img/7d7681224c1536e030055a556b655618_53_0.png)


    The impact of Cyberpunk in the present-day understanding of hacking is considerable.
    Science fiction is particularly effective when we can recognize our own world
    within the fictional representation, and with Cyberpunk we recognize many of the
    concerns of the contemporary technological age. Lawrence Person (editor of the
    science fiction magazine Nova Express) describes the typical characters in Cyberpunk:


    “Classic cyberpunk characters were marginalized, alienated loners who lived on
    the edge of society in generally dystopic futures where daily life was impacted
    by rapid technological change, an ubiquitous data sphere of computerized information,
    and invasive modification of the human body.”


    To a contemporary reader, this description of Cyberpunk characters is reminiscent
    of how hackers are thought of in the popular imagination, and depicted in books
    and films. Therefore, the interplay between Cyberpunk characters and how we view
    real-life hackers is considerable: in many ways our understanding of what a hacker
    is like is based on how Cyberpunk characters are depicted in fiction. One example
    of this is how in Cyberpunk characters often live in filthy conditions, work at
    night and sleep all day, and do not have any social life beyond chat rooms.


    In the present-day imagination when we think of hackers we often think of a lonely
    adolescent boy behind a darkened computer screen. In fact, Michael Bruce Sterling,
    who was one of the first science-fiction writers who dealt with Cyberpunk, has
    also shown the most interest in understanding the development of hacking.


    ![](img/7d7681224c1536e030055a556b655618_54_0.png)


    Sterling has traced the emergence of hacking, and the associated underground computer
    network, to the Yippies, a counterculture group who were active in the 1960s and
    published Technological Assistance Program, a newsletter that taught its readership
    techniques for unauthorized access to telephones, known as phreaking.


    Many of the individuals who were involved in the phreaking community are also
    an active part of the underground hacking community, suggesting that the relationship
    between the two groups.


    # Chapter 2 – The Different Types of Hackers


    The computer hacking underground contains various different subcategories of hackers.
    This is mainly due to conflicting ideologies, whereby certain groups call themselves
    by a specific name, or call others a specific name, in order to emphasize that
    they do not agree with the ideologies of others.


    ![](img/7d7681224c1536e030055a556b655618_55_0.png)


    The generic word ‘hacker’ therefore, although referring to those who have technical
    knowledge and are able to gain unauthorized access to computer systems, is rather
    vague and does not distinguish those who use different methods or believe certain
    things.


    Instead, separate names have emerged in order to distinguish between groups, and
    to indicate that not all hackers follow the same rules or ideologies. One way
    in which this can be seen, as discussed previously, is the distinction between
    hackers and crackers, as advocated by Eric S. Raymond in *The New Hacker''s Dictionary*.


    In this book Raymond compiled a glossary of hackers’ computer programming jargon,
    but those from the hacking community feel that this book is too biased by Raymond''s
    own view of hacking as a malicious practice.


    Rather than following the dichotomy of hacker/cracker that Raymond suggested,
    the general hacking community feels that this is too reductive and instead advocate
    a wider list of names to reflect the spectrum of beliefs and practices of the
    large hacking community.


    One subcategory of hackers is known as ''white hat hackers'' and they break through
    computer security without a malicious motivation. Examples of this include security
    testers who find vulnerabilities so they can be fixed before malicious actors
