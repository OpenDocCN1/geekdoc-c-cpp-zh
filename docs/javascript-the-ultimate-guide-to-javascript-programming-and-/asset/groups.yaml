    # Chapter 4 – Hacking Techniques


    There are various techniques that can be used by hackers in order to gain unauthorized
    access to a computer system, in order to wreak havoc, steal money or data, or
    to prevent the system from operating as it is supposed to. The three main methods
    that are used in order to attack a system that is connected to the Internet are:
    network enumeration, vulnerability analysis and exploitation.


    A network enumerator is a program that is used in order to discover the usernames
    and other information from networked computers. The program discovers any weaknesses
    in the computer network''s security and the findings are reported to a hacker
    who may then use this information in order to access the network and cause damage
    (either by stealing data or corrupting the network.)


    ![](img/7d7681224c1536e030055a556b655618_63_0.png)


    On the other hand, ethical hackers can use the same process to discover any weaknesses
    in their system to tighten security. Another method used is vulnerability analysis,
    which identifies any points of vulnerability in a system; this information can
    be used to attack the system, or to remove the weakness. Vulnerability analysis
    can lead to exploitation, where the hacker uses the vulnerability information
    in order to breach a computer or system''s security.


    There are many specific techniques that can be used, but they all employ the main
    concepts and methods described above. The first most specific example of a hacking
    technique is a vulnerability scanner, which is a program used to check a network
    for susceptibility to attack. A port scanner can also be used, which identifies
    avenues of access to a computer and can establish how to circumnavigate a firewall.


    As well as these mechanized devices, hackers can also find these vulnerabilities'
