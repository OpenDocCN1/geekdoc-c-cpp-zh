    Concept and CTRL (Fig. 2A). However, Concept fed mice had a higher lean body mass
    (Fig. 2B), while total body fat mass tended to be lower compared to CTRL (p =
    0.06). Consequently, relative body fat mass was lower after Concept feeding compared
    to CTRL (Fig. 2C, D).


    The differences in body composition did not affect organ weights (Supplementary
    Table 1).


    In the liver, maximum uncoupled TCA cycle-linked respiration was 33% higher (p
    = 0.05) after Concept feeding compared to CTRL (Fig. 3A). No differences were
    observed for other parameters of TCA-cycle-linked respiration, including LCR and
    RCR (Supplementary Fig. 1A, B). The activities of β-oxidation-linked respiration-linked
    LCR and RCR and CSA activities did not differ between Concept and CTRL (Fig. 3B,
    C, Supplementary Fig. 1c, D). Also, hepatic mitochondrial ROS production, expressed
    as H2O2 emission, was similar between both groups (Fig. 3D). Mitochondrial function
    and content as well as oxidative stress of the soleus muscle were not different
