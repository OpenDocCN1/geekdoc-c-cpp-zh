    - 二酰甘油


    ## 摘要


    早期生命饮食可能对代谢健康产生长期影响。本研究检验了以下假设：早期生命饮食中含有大型磷脂包被脂质滴（Concept）可诱导肝脏线粒体功能和代谢的持续改善。年轻C57BL/6小鼠从产后第15天（PN15）到PN42摄入Concept或对照（CTRL）饮食，随后至PN98摄入西方饮食（WSD）或标准啮齿类饮食（AIN）。测量内容包括身体成分、胰岛素抵抗（HOMA-IR）、三羧酸（TCA）循环和β-氧化相关的肝脏氧化能力、高分辨率呼吸测定、线粒体DNA含量、线粒体生物发生和动力学标志物（PGC1α）、内质网应激标志物以及全身氧化应激。Concept喂养使PN42时TCA循环相关呼吸增加33%，线粒体融合蛋白-1增加65%（两者p
    0.05）。在PN98时，CTRL而非Concept小鼠出现高胰岛素血症（CTRL/AIN 0.22 ± 0.44 vs. CTRL/WSD 1.49 ±
    0.53 μmol/l, p < 0.05 和 Concept/AIN 0.28 ± 0.38 vs. Concept/WSD 1.00 ± 0.29 nmol/l,
    n.s.）以及胰岛素抵抗（CTRL/AIN 107 ± 23 vs. CTRL/WSD 738 ± 284, p < 0.05 和 Concept/AIN
    109 ± 24 vs. Concept/WSD 154 ± 157, n.s.）。WSD诱导的肝重在成年Concept喂养小鼠中降低了18%，且β-氧化相关呼吸提高了69%（p
    < 0.05；Concept/WSD vs. Concept/AIN），同时伴随血浆脂质过氧化物降低（CTRL/AIN 4.85 ± 0.28 vs. CTRL/WSD
    5.73 ± 0.47 μmol/l, p < 0.05 和 Concept/AIN 4.49 ± 0.31 vs. Concept/WSD 4.42 ±
    0.33 μmol/l, n.s.），并且部分免受WSD诱导的肝细胞质DAG C16:0/C18:1增加。早期生命期Concept喂养部分保护免受WSD诱导的胰岛素抵抗和全身氧化应激，可能通过特定DAG和线粒体功能的变化实现，凸显了早期生命饮食对晚年期代谢健康的作用。


