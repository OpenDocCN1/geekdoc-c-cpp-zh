    muscle or liver [52,53], potentially impairing mitochondrial function [54]. Although
    we cannot infer general effects of the WSD on skeletal muscle mitochondrial function,
    we conclude that Concept at least did not result in improved mitochondrial function
    in soleus muscle. Of note, Concept feeding prevented a WSD-induced increase in
    mRNA levels of key lipid-induced inflammatory proteins, suggesting that, particularly,
    C18:0 ceramides are involved in the activation of PKCs, which then phosphorylates
    threonine residues of the insulin receptor kinase and thereby impairs insulin
    signalling [4,55]. In contrast, sequestration of DAGs into neutral cellular lipid
    storage sites such as lipid droplets is considered protective against metabolic
    derangements [56]. Concept feeding therefore seems to favour cellular lipid


    re-distribution with a profile favouring protection from hepatic insulin resistance.
    Moreover, the lower DAG lipid profile after Concept feeding could explain higher
    mitochondrial respiration, as it has recently been shown that C18-containing DAG
    reduced state 3 mitochondrial respiration in vitro in a dose-dependent manner
    [57]. In addition, to exert effects via DAGs, early life exposure to Concept feeding
    may cause epigenetic changes in gene expression in mitochondrial metabolism and
    consequently contribute to changes in body mass composition and changes in skeletal
    muscle and liver in humans [58,59]. Indeed, a recent study has revealed a novel
    role of phospholipids as a meaty sink and important regulator of histone methylation
