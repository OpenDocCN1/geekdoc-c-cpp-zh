    n = 12（所有组）；Concept/WSD: 肝脏重量 n = 16，肝脏 TG n = 12，mDAG 和 cDAG n = 14。双向方差分析；具有相同
    WSD 影响的组：# AIN 喂养组中 WSD 影响的早期生命饮食相同。AIN: 酪蛋白基础对照饮食；CTRL: 对照；cDAG: 胞质中的 sn-1,3-二酰基甘油；CTRL:
    对照；mDAG: 膜中的二酰基甘油。TG: 甘油三酯；WSD: 西式饮食。


    ...脂质向骨骼肌或肝脏等其他组织的后续“溢出”[52,53]，可能会损害线粒体功能 [54]。虽然我们无法推断 WSD 对骨骼肌线粒体功能的一般影响，但我们得出结论，Concept
    至少未导致比目肌线粒体功能改善。值得注意的是，Concept 喂养防止了 WSD 诱导的关键脂质诱导炎症蛋白 mRNA 水平的增加，表明，特别是 C18:0
    神经酰胺参与 PKCs 的激活，随后磷酸化胰岛素受体激酶的苏氨酸残基，从而损害胰岛素信号传导 [4,55]。相比之下，将 DAGs 封入中性细胞脂质储存部位（如脂质滴）被认为可防止代谢紊乱
    [56]。因此，Concept 喂养似乎有利于细胞脂质重新分布，其特征有利于防止肝胰岛素抵抗。此外，Concept 喂养后较低的 DAG 脂质谱可能解释了较高的线粒体呼吸，因为最近已证明含
    C18 的 DAG 以剂量依赖方式降低了体外状态 3 线粒体呼吸 [57]。此外，为了通过 DAGs 发挥作用，早期生命接触 Concept 喂养可能导致线粒体代谢基因表达的表观遗传变化，从而有助于人类体质成分以及骨骼肌和肝脏的变化
    [58,59]。确实，最近的一项研究揭示了磷脂作为甲基汇和组蛋白甲基化重要调节因子的新作用 [60]。升高的神经酰胺，特别是 C16、C18、C24 和 C24
    物种，已与喂食含脂肪量 45% 至 60% 的高脂饮食后的脂肪肝疾病和线粒体功能受损相关联 [61,62]。模拟人类母乳的早期生命饮食也天然富含脂肪（70%，成分见表
    1）。由于关键代谢结局无差异（补充图 2），我们得出结论，出生时升高的 CER 与代谢障碍无关。此外，Concept 饮食中用于包覆脂质滴的牛奶磷脂浓度也含有神经酰胺，这可能直接影响血液和膜中的神经酰胺水平，如磷脂酰胆碱所示
    [63,64]。关于长期影响，重要的是要注意，喂食 WSD 对 CTRL 或 Concept 小鼠没有差异性影响，如补充图 6 所示。


    尽管肝脏脂质氧化和循环脂质过氧化物有显著改善，但 Concept 对空腹血糖、非酯化脂肪酸和胰岛素敏感性的影响相对较小。相对较短的 WSD 暴露（8 周）可能是解释，因为在我们之前的研究
    [22] 中，Concept 对更长时间（12 周）WSD 暴露后空腹血浆葡萄糖、脂质、瘦素、抵抗素和总体脂肪量的影响更为显著。其他因素，如肝胰岛素敏感性的氧化，原本需要钳夹试验，因为基于动物福利的伦理考虑，HOMA-IR
    仅在相当短的禁食时间（3 小时）下评估。接受 Concept 处理的动物确实对致肥饮食有反应，但 Concept 喂养，即使在更长时间 WSD 挑战下，也保护动物免于发展高胰岛素血症。血浆胰岛素升高源于胰岛素分泌增加或胰岛素清除降低
    [65]。在人类中，胰岛素清除不一定与肝脏脂肪含量相关 [66]，而高脂饮食可能损害小鼠的胰岛素清除 [67]。因此，在我们的研究中，高胰岛素血症可能源于代偿性增加的胰岛素分泌或胰岛素清除减少。由于肝脏对
    C-肽的清除可忽略不计，该参数用于估计胰岛素分泌 [68]。不幸的是，由于血浆可用性有限，我们无法在本研究中评估 C-肽。


    本研究存在一些局限性。我们需要解决。我们无法得出结论，Concept 对线粒体氧化活性和脂质代谢的影响是由于膳食脂质滴尺寸增加、这些滴的磷脂包覆还是其共同作用所致。然而，以前的研究表明，脂质滴尺寸增加和磷脂包覆都是表型
    Concept 效应所必需的 [70]。此外，监测线粒体 ATP 浓度和/或合成（受脂质饮食、糖尿病和人类非酒精性脂肪肝病影响 [71–73]）本应具有参考价值，但由于可用组织量有限而无法实现。此外，还需要进行代谢变化、使用同位素稀释方法的高胰岛素血症钳夹试验
    [74] 对组织特异性胰岛素敏感性进行详细分析。


    总之，早期生命喂养含有大颗粒磷脂包覆脂质滴（Nutricis®）的饮食，可在暴露后直接改善肝脏氧化能力、线粒体融合和脂质谱，并在营养编程小鼠模型中，这种改善在致肥环境下持续至晚年。因此，本研究强调了含有模拟人类母乳的特定磷脂的早期生命饮食对晚年代谢健康的作用。


