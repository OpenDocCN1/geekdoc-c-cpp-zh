    of max. 1.25 µM, state u) and 2.5 µM antimycin A. Addition of cytochrome C did
    not significantly increase oxygen consumption, indicating integrity of the mitochondrial
    outer membrane after saponin permeabilization. Respiratory control ratio (RCR),
    reflecting mitochondrial coupling, was calculated for each protocol from the respective
