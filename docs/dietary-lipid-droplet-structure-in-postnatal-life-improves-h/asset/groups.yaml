    ### 2.3. Hepatic and skeletal muscle mitochondrial function


    Mitochondrial respiration (O2 flux) and reactive oxygen species (ROS) emission
    were measured in freshly permeabilized liver and soleus muscle samples using the
    Oxygraph-2k (Oroboros Instruments, Innsbruck, Austria) as described [28]. Defined
    respiratory states were obtained by employing the following protocols: (i) TCA-linked
    respiration, by consecutive addition of 2 mM malate, 10 mM pyruvate (complex I,
    state 2 respiration also termed as LEAK), 2.5 mM ADP, 10 mM glutamate and (complex
    I, state 3 also termed as OXPHOS (oxidative phosphorylation), 10 mM succinate
    (complex I+II, state 3 OXPHOS), 10 µM cytochrome C (mitochondrial membrane integrity
    check), 5 mM oligomycin (complex I+II, state 4o also termed as LEAKomy), carbonyl
    cyanide-p-trifluoromethoxyphenylhydrazone (FCCP, stepwise titrations of 0.25 µM
    up to the final concentration of max. 1.25 µM) in order to obtain maximal electron
    transfer capacity (ETC) and 2.5 µM antimycin A (non-mitochondrial respiration),
    as well as (ii) oxidation-linked respiration (succinate addition) of 2 mM malate,
    10 mM glutamate, 10 mM succinate (complex I + II + succinate, state 3 + flavin
    mononucleotide (FMN), state 2 (LEAK), 2.5 mM ADP (complex I + II + FCCP, state
    3 (OXPHOS)), 10 µM cytochrome C, 5 mM oligomycin (complex I + C, state 4o (LEAKomy)),
    FCCP to obtain maximal ETC (stepwise titrations of 0.25 µM up to the final concentration
    of max. 1.25 µM, state u) and 2.5 µM antimycin A. Addition of cytochrome C did
    not significantly increase oxygen consumption, indicating integrity of the mitochondrial
    outer membrane after saponin permeabilization. Respiratory control ratio (RCR),
    reflecting mitochondrial coupling, was calculated for each protocol from the respective
    ratio of state 3 (OXPHOS)/state 4o (LEAKomy) [28,29]. Leak control ratio (LCR),
    reflecting mitochondrial proton leak, was calculated using state 4o (LEAKomy)/ETC
    ratios [28].


    Rates of hepatic ROS emission at state 4o were quantified by fluorescence measurement
    of H2O2 concentration by the O2k-Fluorescence module (Oroboros Instruments) as
    described [30]. Citrate synthase activity (CSA) was assessed spectrophotometrically
    (Citrate Synthase Assay kit, Sigma-Aldrich, St. Louis, MO).


