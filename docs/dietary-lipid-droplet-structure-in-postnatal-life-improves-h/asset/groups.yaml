    ## 1. 引言


    儿童肥胖的患病率持续上升 [1] 并促成2型糖尿病、心血管疾病和非酒精性脂肪肝疾病（NAFLD）发病率的全球上升 [2,3]。高热量高脂高碳水化合物饮食的摄入通过促进异位脂质沉积导致这一流行病，异位脂质沉积与胰岛素抵抗相关，是2型糖尿病发展的关键
    [4]。过度脂质沉积可导致肝脏线粒体功能适应，如胰岛素抵抗、肥胖或脂毒性小鼠模型所示 [5–7]。此外，细胞内生物活性脂质（如二酰甘油（DAG）和神经酰胺（CER））的积累通过干扰胰岛素信号通路，在介导脂质诱导的胰岛素抵抗中起主要作用
    [4]。膳食脂质的数量和质量均影响代谢功能。


    膳食脂质既可产生有益的代谢效应，如n-3多不饱和脂肪酸和单不饱和脂肪酸丰富饮食所示 [8,9]，也可能促进代谢和胰岛素抵抗效应，如饱和脂肪所示 [10]。此外，早期生命暴露，特别是孕期和（早期）产后期的膳食脂质质量，已被证明对后代代谢健康有持续影响。而且，妊娠期高饱和脂肪摄入会损害成年后代的胰岛素敏感性
    [11,12] 以及肝脏和骨骼肌线粒体功能 [13,14]。有趣的是，产后期饮食调节可以减轻不利母体饮食对后代的代谢后果 [15]。产后期喂养富含n-3长链多不饱和脂肪酸的饮食可防止暴露于致肥环境的啮齿类动物成年后肥胖
    [16]。


    观察性研究表明，母乳喂养与超重和肥胖风险降低相关 [17,18]，并假设除了脂肪酸组成外，人乳脂球的物理特性也影响这些特性。与婴儿配方奶相比，人乳脂质特性较大，并被乳脂球膜包围，该膜由磷脂、糖脂、胆固醇和膜蛋白组成
    [19,20]。为了模拟人乳脂质滴的超分子结构，开发了一种含有大脂质滴并包被磷脂的婴儿配方奶粉（Nutrisp®）[21]。先前在小鼠中的研究表明，产后期喂养含有Nutrisp®（Concept）的饮食至少部分可防止西方饮食（WSD）诱导的脂质积累、脂肪细胞肥大和胰岛素抵抗
    [22,23]。尽管潜在机制尚不清楚，但有证据表明Concept可能增强小鼠脂肪组织中调节线粒体含量和氧化功能的基因表达 [24]。值得注意的是，肝脏发病机制如脂肪组织功能障碍和肝脏NAFLD
    [4]。


    肝脏线粒体功能对于脂质代谢的调节很重要，并且已证明Concept可在产后期暴露后直接增强肝脏线粒体标志物的表达，表明脂质氧化增加 [25]。然而，早期生命期Concept暴露对肝脏线粒体功能、生物发生和动力学以及脂质组成和含量的长期影响尚未得到研究。为此，我们考察了


    产后期Concept喂养对肝脏线粒体功能、生物发生、动力学、效率和氧化应激的关键特征以及肝脏脂质含量和组成的影响（1）产后期暴露后和（ii）随后在成年小鼠中暴露于标准饲料或WSD后。我们假设，早期产后期Concept喂养可改善肝脏线粒体功能和脂质代谢，最终保护免受晚年期WSD诱导的代谢恶化。


    ## 2. 材料与方法


    ### 2.1. 动物


    所有实验均根据动物护理和使用指南（GV-SOLAS（实验动物科学学会），德国弗赖堡）进行，并经当地动物护理委员会批准，符合德国动物保护法的要求（许可证号：AZ
    35-9185.81/G-244/16）。


    雄性和雌性威斯塔汉诺威（n = 36）C57BL/6JOlaHsd繁殖小鼠（到达时9周大，Envigo，荷兰霍斯特）在常规条件下，于标准笼中保持12小时光照/黑暗循环，定期检查病原体，并自由摄食所有饮食和水。到达后，繁殖小鼠每笼饲养1只（Makrolon类型3笼，地面面积800
    cm2，高度150 mm，配备杨木垫料、大麻纤维筑巢材料、供啃咬的木块和红色避难所鼠舍），并适应一周，饲喂繁殖商提供的谷物基饮食（2018，Teklad Global
    18% Protein Rodent Diet，Envigo，荷兰），随后改为半合成美国营养研究所93 G（生长）饮食（AIN93G，Research Diets
    Services）两周。繁殖小鼠定时交配（阴道栓塞检测日，更多信息见Supplemental Material at www.nutricia.com/pregnancy，直至哺乳期第15天。在PN2，幼鼠被随机分配给母鼠以减少窝间差异和窝效应，并剔除至每窝四只雄性和两只雌性幼鼠，但一窝由三只雄性和三只雌性组成，另一窝由两只雄性和四只雌性组成，分别由于性别比例和出生后代总数。在PN15，母鼠和幼崽被分配到Concept或CTRL组，并分别喂食相应饮食（见下文），同时幼崽也可饮用母鼠乳汁（Fig.
    1）。


