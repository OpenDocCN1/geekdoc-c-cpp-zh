    Precast Protein Gels，Biorad，美国加利福尼亚州赫拉克勒斯）上。每块胶加载串间校准器（IRC）以考虑不同运行间的差异。免疫印迹前，无染色胶用紫外线激活1
    min，并使用ChemiDoc MP成像系统（Biorad）拍照。蛋白质使用Trans-Blot Turbo转印系统（Biorad）转移到聚偏二氟甲烯（PVDF）膜上，使用ChemiDoc
    MP成像，并使用Image Lab™ 6.0.1软件（Bio-Rad Laboratories）进行定量以进行归一化。PVDF膜在室温下用5%脱脂牛奶在Tris缓冲盐水含Tween
    20（TBST缓冲液：10 mM Tris，pH 8.0，150 mM NaCl，0.5% Tween 20）中封闭2 h。随后，膜在4 °C下与一抗孵育过夜，然后与过氧化物酶标记的二抗在室温下孵育1
    h。最后，膜用Immobilon Western化学发光HRP底物（Merck Millipore，德国达姆施塔特）包被，并使用ChemiDoc成像系统结合Image
    Lab 6.0.1软件（Biorad）检测蛋白质以进行光密度分析。靶蛋白表达水平归一化到电压依赖性阴离子通道（VDAC）蛋白，以归一化线粒体含量。动力蛋白相关蛋白（DRP1）（5391）和磷酸化-DRP1
    Ser616（3455）抗体从Cell Signaling Technology购买；过氧化物酶体增殖物活化受体γ共激活因子1（PGC-1）α从Millipore（ST1202）购买；线粒体转录因子A（TFAM）从Santa
    Cruz Biotechnology（sc-166965）购买；其他一抗从Abcam购买：丝裂原样蛋白1（MFN1）（ab57602）、丝裂原样蛋白2（MFN2）（ab56889）和VDAC（ab14734）。


    定量实时PCR（RT-PCR）如文献[35]所述进行。简而言之，使用RNeasy Mini试剂盒（Qiagen，德国杜塞尔多夫）从10 mg冻肝中分离总RNA。使用QuantiTect反转录试剂盒（Qiagen，货号205311）从1000
    ng总RNA合成cDNA，并使用QuantiTect SYBR® Green PCR试剂盒（Qiagen，货号204145）在StepOnePlus RT-PCR系统（Applied
    Biosystems，美国马萨诸塞州沃尔瑟姆）中使用QuantiTect引物检测（Qiagen，德国杜塞尔多夫）进行RT-PCR。以下引物从Qiagen购买：TFAM（QT00154413）、PGC-1α（QT02524422）；次牛磺酸-牛磺酸磷酸硫酸转移酶（PGA）（QT0166768）、肽基脯氨酸异构酶A（QT00247709）和β2-微球蛋白（QT01149547）用作内源性参考基因。Ct值首先归一化到3个参考基因Ct的几何平均值，然后归一化到IRC的Ct，根据ΔΔCt方法[35]获得表达倍数变化。创建熔解曲线以确保引物特异性。每个样品测定三次。


