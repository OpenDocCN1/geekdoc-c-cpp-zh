    ## 3. 结果


    ### 3.1. PN42 时出生后 Concept 喂养的直接效应


    在 PN42 时，研究了早期生命饮食干预（定义为 PN11 至 PN42 的 4 周）的直接效应。Concept 组和 CTRL 组的体重相似（Fig. 2A）。然而，Concept
    喂养的小鼠瘦体重更高（Fig. 2B），而总体脂肪量相比 CTRL 组有降低趋势（p = 0.06）。因此，Concept 喂养后的相对体脂肪量低于 CTRL
    组（Fig. 2C, D）。


    体成分的差异未影响器官重量（Supplementary Table 1）。


    在肝脏中，Concept 喂养后最大解耦 TCA 循环关联呼吸比 CTRL 组高 33%（p = 0.05）（Fig. 3A）。未观察到 TCA 循环关联呼吸的其他参数（包括
    LCR 和 RCR）有差异（Supplementary Fig. 1A, B）。β-氧化关联呼吸关联的 LCR 和 RCR 活性以及 CSA 活性在 Concept
    组和 CTRL 组之间无差异（Fig. 3B, C, Supplementary Fig. 1c, D）。此外，两组的肝脏线粒体 ROS 生成（表达为 H2O2
    排放率）相似（Fig. 3D）。比目鱼肌的线粒体功能和含量以及氧化应激在两组之间无差异（Supplementary Fig. 2A-D）。


    在 PN42 时，线粒体生物标志物 PGC-1α 和 TFAM 的蛋白含量在 Concept 组和 CTRL 组之间无差异（Fig. 4A, B）。然而，Concept
    喂养后 MFN1 蛋白增加了 65%，表明线粒体融合增加（p = 0.03）（Fig. 4C, D）。作为线粒体分裂标志物的 DRP1 蛋白及 DRP1 与磷酸化
    DRP1 (Ser616) 的比值在 Concept 组和 CTRL 组之间无差异（Fig. 4E, F）。


    禁食 3 小时后，血浆葡萄糖、胰岛素、HOMA-IR 以及血浆 TBARS 和 NEFA 无差异（Supplementary Fig. 3A–F）。在 PN42
    时，Concept 组和 CTRL 组的肝重及肝甘油三酯相当（Fig. 5A, B）。在肝组织中测得的胞质 DAGs (cDAG)、脂质滴 DAGs (ldDAG)
    及大部分膜 DAGs (mDAG) 未受 Concept 喂养影响（相比 CTRL）。然而，Concept 小鼠的 C20、C22 和 C24 mCER 高于
    CTRL 小鼠（Fig. 5C and Supplementary Fig. 4A–E）。


    ### 3.2. 出生后 Concept 喂养对成年小鼠的影响


    在 PN88 时，评估了早期生命 Concept 与 CTRL 喂养在 WSD 挑战下的效应。相比 AIN，WSD 暴露在 Concept/WSD 和 CTRL/WSD
    组中以相似程度随时间（PN42–89）增加了体重和瘦体重，即使在校正依赖基线值后也是如此（Fig. 6A, B and Supplementary Figure
    5A, B）。Concept/WSD 组随时间推移的（相对）体脂肪量增加略低于 CTRL/WSD 组，且在校正基线值后与 CTRL/WSD 组相比具有统计学差异（Fig.
    6C, D and Supplementary Fig. 5C and D）。早期或成年饮食均未影响空腹血浆葡萄糖和 NEFA 水平（Fig. 6E, I）。与
    CTRL/AIN 相比，CTRL/WSD 组的血浆胰岛素和 HOMA-IR 显著恶化，但 Concept/WSD 与 Concept/AIN 相比则未出现此情况（Fig.
    6F–G）。与 CTRL/AIN 相比，CTRL/WSD 组的血浆 TBARS 水平升高，但 Concept/WSD 小鼠未升高（Fig. 6H）。


