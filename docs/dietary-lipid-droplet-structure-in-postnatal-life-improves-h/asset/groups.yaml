    # 2.2. Diets


    The postnatal diets are semi-synthetic diets (Research Diets Services), containing
    28.2% (w/w) CTRL or Concept infant milk formula (IMF) powder, are iso-caloric
    and contain similar amounts of macro-components. To establish appropriate rodent
    macro- and micronutrient composition according to AIN-93G standards [26] only
    proteins, carbohydrates, vitamins and minerals were added, i. e. the lipid portions
    of the diets were entirely derived from the IMFs. The CTRL IMF powder was a commercially
    available IMF manufactured for good manufacturing practices (ISO 22000) and intended
    for use of 0-6 months old infants (Danone Nutricia Research, Utrecht, The Netherlands).
    To produce Concept IMF (Nutricia, Danone Nutricia Research, Utrecht, The Netherlands),
    0.5 g/1 milk phospholipid concentrate of bovine origin (Lipinor MG20, Lecico,
    Hamburg, Germany) was added to the recipe and the phospholipid levels matched
    those of human milk lipid droplets. The average phospholipid diameter [21,22].
    The average diameter based on volume of the lipid droplets was 3.13 µm for Concept
    compared to 0.47 µm for CTRL. The composition of the diets is given in Table 1.


    # 2.3. Hepatic and skeletal muscle mitochondrial function


    Mitochondrial respiration (O2 flux) and reactive oxygen species (ROS) emission
    were measured in freshly permeabilized liver and soleus muscle samples using the
    Oxygraph-2k (Oroboros Instruments, Innsbruck, Austria) as described [28]. Defined
    respiratory states were obtained by employing the following protocols: (i) TCA-linked
    respiration, by consecutive addition of 2 mM malate, 10 mM pyruvate (complex I,


