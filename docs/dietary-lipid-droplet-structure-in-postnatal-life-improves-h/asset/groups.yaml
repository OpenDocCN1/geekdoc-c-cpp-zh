    作为胰岛素抵抗的替代指标，HOMA-IR根据3 h禁食胰岛素（mIU/l）*禁食血糖（mmol/l）/22.5计算[36,37]。统计分析使用GraphPad
    Prism（8.0.0）进行，体重和体成分随时间的变化除外，后者使用SPSS（19.0.0）分析。数据表示为均值±SEM。PN42时早期生命饮食（Concept
    vs. CTRL）的影响使用未配对t检验比较。在PN98时，早期生命（Concept vs. CTRL）和成年饮食（AIN vs. WSD）及其相互作用的影响使用双向方差分析和Sidak多重比较检验进行分析（在存在总体早期生命或成年饮食影响的情况下）。数据使用GraphPad
    Prism 9.0.0（GraphPad Software，美国加利福尼亚州圣地亚哥）分析，当数据不符合高斯分布时，使用Mann-Whitney或Kruskal-Wallis检验进行分析。体重和体成分随时间的变化使用重复测量方差分析进行分析。当p
    < 0.05、p < 0.01和p < 0.001时，差异被认为具有统计学意义。


