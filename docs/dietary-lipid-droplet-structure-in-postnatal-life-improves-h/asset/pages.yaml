    # ## ABSTRACT


    Early-life diets may have a long-lasting impact on metabolic health. This study
    tested the hypothesis that an early-life diet with large, phospholipid-coated
    lipid droplets (Concept) induces sustained improvements of hepatic mitochondrial
    function and metabolism. Young C57BL/6 mice were fed Concept or control (CTRL)
    diet from postnatal day 15 (PN15) to PN42, followed by western style (WSD) or
    standard rodent diet (AIN) until PN98. Measurements comprised body composition,
    insulin resistance (HOMA-IR), tricarboxylic acid (TCA) cycle- and β-oxidation-related
    hepatic oxidative capacity, high-resolution respirometry, mitochondrial DNA content,
    markers of mitochondrial biogenesis and dynamics (PGC1α), markers of endoplasmic
    reticulum stress as well as systemic oxidative stress. Concept feeding increased
    TCA cycle-related respiration by 33% and mitochondrial fusion protein-1 by 65%
    at PN42 (both p 0.05). At PN98, CTRL, but not Concept, mice developed


