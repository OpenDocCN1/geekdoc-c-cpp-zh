  md: '# 2.4. Circulating hormones and metabolites


    Plasma glucose was measured using the Glucose Assay Kit (Cabiochem®, Merck, KGaA,
    Darmstadt) and plasma insulin using the Mercodia Mouse Insulin ELISA (Mercodia
    AB, Uppsala, Sweden). Plasma levels of thiobarbituric acid reactive substances
    (TBARS), as markers of lipid peroxidation, were measured fluorimetrically (BioTek,
    Bad Friedrichshall, Germany) as reported previously [31]. Plasma non-esterified
    fatty acid (NEFA) levels were measured using the Free Fatty Acids Kit (Cell Biolabs,
    Inc., San Diego, USA).


    # 2.5. Hepatic lipid analysis


    Hepatic triglyceride concentration was measured colorimetrically (Triglyceride
    Quantification Colorimetric/Fluorometric Kit, BioVision, California, USA). For
    the rapid and simultaneous quantification of DAG and ceramide species in liver
    tissue, we used a liquid chromatography triple quadrupole mass spectrometry (LC-MS/MS)
    method as described briefly [32]. After immediate freezing of the samples in liquid
    nitrogen, lipids were extracted and purified from ~50 mg of liver and muscle tissue
    each. For extraction, fractionation and purification of bioactive lipids, liver
    tissue was homogenized in 500 µl of buffer A (20 mM Tris/HCl, 1 mM EDTA 0.25 mM
    EGTA, 250 mM Sucrose, PIC) using an IKA T10 basic Ultra Turrax (IKA, NC, USA)
    and a tight-fitting glass homogenizer (Wheaton, USA) [32]. Lipids of three subcellular
    compartments, i.e. lipid droplet, cytosolic membrane fraction and endoplasmic
    reticulum-enriched fraction, were separated according to a previously described
    protocol, overlaid with 150 µl Buffer A and centrifuged for 1 h, 100,000 * g,
    4 °C. The floating lipid droplet layer was separated from the underlying cytosol
    fraction using a slicer (Beckman Coulter, Brea, CA, USA). Subsequently, the cytosol
    fraction was transferred to a fresh tube, while the membrane fraction remained
    as a pellet in the centrifuge tube. Internal standards were added and lipids of
    lipid droplet, cytosol and membrane fraction were extracted according to Folch
    et al. [33], followed by solid phase extraction (Sep Pak Diol Cartridges; Waters,
    MA, USA). The resulting lipid phase was dried under a gentle flow of nitrogen,
    resuspended in 400 µl methanol and then analyzed by LC-MS/MS [32]. In brief, the
    chromatographic separation of analytes was conducted using an Infinity 1290 Ultra
    High Performance Liquid Chromatography system (Agilent Technologies Inc., Santa
    Clara, CA, USA) and a reversed-phase Luna Omega C18 column, 50 × 2.1 mm, 1.6 µm
    (Phenomenex, Torrance, CA, USA) operated at 50 °C. A binary gradient was used
    consisting of 5 mM ammonium formate in water (Solvent A) and 5 mM ammonium formate
    in 90% methanol/10% i-propanol (solvent B) at the flow rate of 0.4 ml/min. The
    analytes were measured as ammonia adducts (DAGs) or protonated adducts (CERs)
    using electrospray ionization (ESI) and detected by multiple reaction monitoring
    (MRM) on a triplequadrupole mass spectrometer (MS, Agilent 6495; Agilent Technologies,
    CA, USA) operated in positive ion mode.


    # 2.6. Immunoblotting


    Immunoblotting of proteins was performed according to a previously described protocol
    [34]. Proteins were extracted from approximately 30 mg of liver tissue, homogenized
    in 300 µl of lysis buffer (25 mM Trisaminomethane-hydrochloride (Tris-HCl), pH
    7.4, 150 mM NaCl, 0.20% Nonidet P-40, 1 mM ethylenediaminetetraacetic acid (EDTA)
    and 0.1% sodium dodecyl sulfate (SDS), supplemented with a Protease Inhibitor
    Cocktail II (Roche, Mannheim, Germany) and loaded onto SDS polyacrylamide gradient
    gels (4–20% Mini-PROTEAN® TGX™ Precast Protein Gels, Biorad,


    Hercules, CA, USA). An inter-run calibrator (IRC) was loaded to each gel to account
    for between-run differences. Prior to immunoblotting, the stain-free gels were
    UV-activated for 1 min and pictures were taken using the ChemiDoc MP imaging system
    (Biorad). Proteins were transferred to a polyvinylidene difluoride (PVDF) membrane
    using the Trans-Blot Turbo Transfer System (Biorad), imaged using the ChemiDoc
    MP and quantified using Image LabTM 6.0.1 software (Bio-Rad 199 Laboratories)
    for normalization. The PVDF membrane was blocked with 5% non-fat milk in Tris-buffered
    saline with Tween 20 (TBST buffer: 10 mM Tris, pH 8.0, 150 mM NaCl, and 0.5% Tween
    20) for 2 h at room temperature. Afterwards, the membranes were incubated overnight
    with primary antibodies at 4 °C and then with horseradish peroxidase (HRP)-conjugated
    secondary antibodies for 1 h at room temperature. Finally, membranes were coated
    with Immobilon Western Chemiluminescent HRP Substrate (Merck Millipore, Darmstadt,
    Germany) and proteins were detected using a ChemiDoc imaging system in combination
    with the software Image Lab 6.0.1 (Biorad) for densitometric analysis. The expression
    levels of target proteins were normalized to actin-dependent anion channel (VDAC)
    protein to normalize for mitochondrial content. The dynamin related protein (DRP1)
    (5391) and phospho-DRP1 Ser616 (3455) antibodies were purchased from Cell Signaling
    Technology; peroxisome proliferator-activated receptor gamma coactivator 1 (PGC-1)
    α from Millipore (ST1202); mitochondrial transcription factor A (TFAM) from Santa
    Cruz Biotechnology (sc-166965); other primary antibodies were purchased from Abcam:
    Mitofusin1 (MFN1) (ab57602), Mitofusin2 (MFN2) (ab56889) and VDAC (ab14734).


    Quantitative real-time PCR (RT-PCR) was performed as described previously [35].
    Briefly, total RNA was isolated from 10 mg of frozen liver using the RNeasy Mini
    Kit (Qiagen, Düsseldorf, Germany). cDNA was synthesized from 1000 ng total RNA
    with the QuantiTect Reverse Transcription Kit (Qiagen, Cat. No.205311) and used
    for RT-PCR with QuantiTect SYBR® Green PCR Kit (Qiagen, Cat. No.204145) in a StepOnePlus
    RT-PCR System (Applied Biosystems, Waltham, MA, USA) using QuantiTect Primer Assays
    (Qiagen, Düsseldorf, Germany). The following primers were purchased from Qiagen:
    TFAM (QT00154413), PGC1α (QT02524422); hypotaurine-taurine phosphosulfurtransferase
    (PGA (QT0166768), Peptidylprolyl isomerase A (QT00247709) and β2-microglobulin
    (QT01149547) were used as endogenous reference genes. Ct values were first normalized
    to geometric mean of Ct of the 3 reference genes, then to Ct of IRC to obtain
    the expression fold-change following the ΔΔCt method [35]. A melting curve was
    created to ensure primer specificity. Each sample was measured in triplicate.


    # 2.7. Calculations and statistics


    As a surrogate of insulin resistance, HOMA-IR was calculated from 3-h fasting
    insulin (mIU/l) * fasting glucose (mmol/l)/22.5 [36,37]. Statistical analyses
    were performed using GraphPad Prism (8.0.0) except for changes in body weight
    and body composition over time, which were analyzed using SPSS (19.0.0). Data
    are expressed as mean ± SEM. The effects of early-life diet (Concept vs. CTRL)
    at PN42 were compared using the unpaired t-test. At PN98, effects of the early-life
    (Concept vs. CTRL) and adult diet (AIN vs. WSD) and the interaction between those,
    were analysed using two-way ANOVA and Sidak’s multiple comparisons test in case
    of an overall early-life or adult diet effect. Data were analyzed using GraphPad
    Prism 9.0.0 (GraphPad Software, San Diego, CA, USA) and when data did not show
    a Gaussian distribution, analysed with a Mann-Whitney or Kruskal-Wallis test.
    Changes in body weight and body composition over time were analysed using repeated
    measure ANOVA. Differences were considered significant when p < 0.05, p < 0.01
    and p < 0.001.'
