    # ### 3.2. Effects of postnatal Concept feeding in adult mice


    At PN88, the effect of the early-life feeding with Concept vs CTRL was assessed
    upon a WSD challenge. Compared to AIN, WSD exposure increased body weight and
    lean mass over time (PN42–89) by a similar extent in Concept/WSD and CTRL/WSD
    groups, also when corrected for the dependent baseline values (Fig. 6A, B and
    Supplementary Figure 5A, B). Concept/WSD showed a somewhat lower increase (relative)
    body fat mass over time than CTRL/WSD, which was statistically different compared
    to CTRL/WSD, when corrected for baseline values (Fig. 6C, D and Supplementary
    Fig. 5C and D). Neither early nor adult diets affected fasting plasma glucose
    and NEFA levels (Fig. 6E, I). Plasma insulin and HOMA-IR significantly worsened
    in CTRL/WSD compared to CTRL/AIN, but not in Concept/WSD compared to Concept/AIN
    (Fig. 6F–G). Plasma TBARs levels were increased in CTRL/WSD compared to CTRL/AIN,
    but not in Concept/WSD mice (Fig. 6H).


