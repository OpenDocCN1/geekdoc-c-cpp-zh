    # 3.3. Correlation analyses


    Energy expenditure can best be correlated to lean mass [38], due to significant
    weight contribution but low metabolic activity of white adipose tissue [39]. Indeed,
    at PN98, the lean body mass of CTRL groups (CTRL/AIN and CTRL/WSD together) correlated
    to hepatic mitochondrial respiration (r = 0.436; Supplementary Table 3). However,
    r = 0.490; r = 0.436; p < 0.05 for all; Supplementary Table 3). However, in concept
    fed groups, no such correlations were found. As for AIN and WSD animals at PN98,
    we observed a correlation between lean body mass and respiration rate after ADP
    (r = −0.548), cytochrome c (r = −0.523) and FCCP titration (r = −0.403), p < 0.05
    for all (Supplementary Table 4).


    # 4. Discussion


    This diet intervention showed that early-life exposure to a diet comprising large,
    phospholipid-coated lipid droplets (Concept) affects various features of mitochondrial
    function and lipid metabolism in rodent liver, but not skeletal muscle. Concept
    feeding not only directly enhanced mitochondrial TCA-cycle-linked oxidative capacity
    and mitochondrial function at PN42, but also potentiated β-oxidation-linked oxidative
    capacity later in life, at PN98. Furthermore,'
