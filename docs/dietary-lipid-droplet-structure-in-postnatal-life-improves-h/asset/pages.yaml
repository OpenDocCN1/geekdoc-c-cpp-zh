    # 1. Introduction


    The prevalence of childhood obesity keeps increasing [1] and contributes to the
    global rise in the incidence of type 2 diabetes, cardiovascular diseases and non-alcoholic
    fatty liver disease (NAFLD) [2,3]. Consumption of hypercaloric fat- and carbohydrate-rich
    diets contributes to this pandemic, by promoting ectopic lipid deposition, which
    is related to insulin resistance, and key to the development of type 2 diabetes
    [4]. Excessive lipid deposition can lead to adaptation of hepatic mitochondrial
    function as demonstrated in mouse models of insulin resistance, obesity or lipotoxicity
    [5–7]. In addition, subcellular accumulation of bioactive lipids, such as diacylglycerols
    (DAG) and ceramides (CER), have a major role in mediating lipid-induced insulin
    resistance by interfering with the insulin signalling pathway [4]. Both the quantity
    and quality of dietary lipids affect metabolic function.


    Dietary lipids can either exert beneficial metabolic effects, as reported for
    n-3 polyunsaturated fatty acids- and monounsaturated fatty acids-enriched diets
    [8,9], or may promote metabolic and insulin resistance effects, as observed for
    saturated fat [10]. In addition, early-life exposure, dietary lipid quality, particularly
    during pre- and (early) postnatal life, was shown to have sustained effects on
    offspring metabolic health. Moreover, a high saturated fat intake during pregnancy
    impaired insulin sensitivity [11,12], as well as hepatic and skeletal muscle mitochondrial
    function [13,14] in adult offspring. Interestingly, post-natal dietary modulations
    can attenuate the metabolic consequences of an adverse maternal diet for the offspring
    [15]. Postnatal feeding of a diet rich in n-3 long-chain polyunsaturated fatty
    acids prevented adult adiposity in rodents exposed to an obesogenic environment
    [16].


    Observational studies demonstrated that breastfeeding associates with a reduced
    risk of overweight and obesity [17,18], and it is postulated that besides fatty
    acid composition also the physical characteristics of human milk fat globules
    influence these properties. Lipid characteristics of human milk are larger compared
    to those of infant milk formula and are surrounded by a milk fat globule membrane,
    consisting of phospholipids, glycolipids, cholesterol and membrane proteins [19,20].
    To mimic the supramolecular structure of human milk lipid droplets, an infant
    milk formula with large lipid droplets, coated with phospholipids (Nutrisp®) was
    developed [21]. Previous studies in mice demonstrated that postnatal feeding with
    a diet containing Nutrisp® (Concept) protects, at least in part, from western
    style diet (WSD)-induced lipid accumulation, adipocyte hypertrophy and insulin
    resistance [22,23]. Although the underlying mechanisms remain elusive, there is
    evidence that Concept may enhance expression of genes regulating mitochondrial
    content and oxidative function in murine adipose tissue [24]. Of note, hepatic
    pathogenesis such as adipose tissue dysfunction and liver NAFLD [4].


    Hepatic mitochondrial functionality is important for the regulation of lipid metabolism
    and indeed Concept has been shown to enhance expression of hepatic mitochondrial
    markers, directly after postnatal exposure, suggesting increased lipid oxidation
    [25]. However, the long-term effects of the early life Concept exposure on hepatic
    mitochondrial function, biogenesis and dynamics as well as lipid composition and
    content has not been investigated. To this end, we examined


    effects of postnatal Concept feeding on key features of hepatic mitochondrial
    function, biogenesis, dynamics, efficiency and oxidative stress, as well as hepatic
    lipid content and composition (1) after postnatal exposure and (ii) after subsequent
    exposure to standard chow diet or WSD in adult mice. We hypothesized that early
    postnatal Concept feeding improves hepatic mitochondrial function and lipid metabolism,
    ultimately protecting from WSD-induced metabolic deterioration later in life.


    # 2. Materials and methods


    # 2.1. Animals


    All experiments were performed according to the guidelines for the care and use
    of animals (GV-SOLAS (Society for Laboratory Animal Science), Freiburg, Germany)
    and approved by the local council of animal care in line with the requirements
    of the German Animal Protection Act (permission no. AZ 35-9185.81/G-244/16).


    Male and female Wistar Hannover (n = 36) C57BL/6JOlaHsd breeder mice (9 weeks
    old at arrival, Envigo, Horst, The Netherlands) were maintained on a 12-h light/dark
    cycle in standard cages under conventional conditions, regularly checked for pathogens
    and received all diets and water ad libitum. Upon arrival, breeder mice were housed
    with 1 per cage (Makrolon type 3 cages, floor area 800 cm2, height 150 mm, equipped
    with poplar bedding, nest material made of hemp fibres, wooden blocks for gnawing
    and red shelter mouse houses), and were allowed to acclimatize for one week, receiving
    a grain-based diet (2018, Teklad Global 18% Protein Rodent Diet, Envigo, The Netherlands)
    as provided by the breeder and subsequently adapted to a semi-synthetic American
    Institute of Nutrition 93 G (growth) diet (AIN93G, Research Diets Services) for
    two weeks. Breeders were time-mated (the day of vaginal plug detection for more
    information see Supplemental Material at www.nutricia.com/pregnancy and until
    day 15 of lactation. At PN2, pups were randomly assigned to a dam to reduce between-litter
    variability and per litter effects, and culled to four male and two female pups
    per dam, except one litter who consisted of three males and three females, and
    another litter which consisted of two males and four females, respectively, due
    to the sex-ratio and total offspring born. On PN15, dam and litters were assigned
    to either Concept or CTRL groups and fed with respective diets (see below), while
    pups were also allowed to drink milk from the dams (Fig. 1).


    Concept and CTRL diets were provided daily as a dough on the floor of the cage.
    After weaning on PN21, male offspring were housed in pairs of the same litter
    in macrolon type 3 cages identical to the breeder mice and continued their respective
    diets until PN42. At PN42, males were either dissected and sacrificed to an AIN-93M
    (AIN) diet or to a WSD (20 w/w % fat) challenge until PN98 (Fig. 1). The study
    comprised the following six groups: PN42: CTRL (n = 13) and Concept (n = 10) and
    PN98: CTRL/AIN (n = 10), CTRL/WSD (n = 12), Concept/AIN (n = 12) and Concept/WSD
    (n = 16) (for power calculation see supplementary material). Group sizes were
    different as one litter (n = 4 males) was incorrectly assigned to the Concept
    group, but these 4 animals were kept in the study after consultation with the
    Animal Welfare Officer, as the animals could not be used for other experiments
    given their exposure to'
