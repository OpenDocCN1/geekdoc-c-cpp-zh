  md: '# ## 3. Results


    # ### 3.1. Direct effects of postnatal Concept feeding at PN42


    The direct effects of the early-life dietary intervention, as defined by the 4
    weeks from PN11 to PN42, were studied at PN42. Body weight was similar between
    Concept and CTRL (Fig. 2A). However, Concept fed mice had a higher lean body mass
    (Fig. 2B), while total body fat mass tended to be lower compared to CTRL (p =
    0.06). Consequently, relative body fat mass was lower after Concept feeding compared
    to CTRL (Fig. 2C, D).


    The differences in body composition did not affect organ weights (Supplementary
    Table 1).


    In the liver, maximum uncoupled TCA cycle-linked respiration was 33% higher (p
    = 0.05) after Concept feeding compared to CTRL (Fig. 3A). No differences were
    observed for other parameters of TCA-cycle-linked respiration, including LCR and
    RCR (Supplementary Fig. 1A, B). The activities of β-oxidation-linked respiration-linked
    LCR and RCR and CSA activities did not differ between Concept and CTRL (Fig. 3B,
    C, Supplementary Fig. 1c, D). Also, hepatic mitochondrial ROS production, expressed
    as H2O2 emission, was similar between both groups (Fig. 3D). Mitochondrial function
    and content as well as oxidative stress of the soleus muscle were not different
    between groups (Supplementary Fig. 2A-D).


    Protein content of the biomarkers of mitochondrial biogenesis, PGC-1α and TFAM,
    was not different between Concept and CTRL at PN42 (Fig. 4A, B). However, there
    was a 65% increase in MFN1 protein indicating higher mitochondrial fusion after
    Concept feeding (p = 0.03) (Fig. 4C, D). DRP1 protein and the ratio of DRP1 to
    phospho-DRP1 (Ser616), as biomarkers of mitochondrial fission, were not different
    between Concept and CTRL (Fig. 4E, F).


    After 3 h of fasting, there were no differences in plasma glucose, insulin, HOMA-IR,
    as well as plasma TBARS and NEFA (Supplementary Fig. 3A–F). Liver weight and liver
    triglycerides were comparable between Concept and CTRL at PN42 (Fig. 5A, B). Cytosolic
    DAGs (cdAG), lipid droplet DAGs (ldDAG) and most membrane DAGs (mDAG


