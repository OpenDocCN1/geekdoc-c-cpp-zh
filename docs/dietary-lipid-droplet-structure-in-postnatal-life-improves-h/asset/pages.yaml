  md: 'ranging from 45% to 60% fat content [61,62]. Early life diets, mimicking human
    breast milk, are also naturally rich in fat (70%, see Table 1 for composition).
    As there are no differences regarding key metabolic outcomes (Suppl. Fig. 2),
    we conclude that elevated CER at birth do not associate with metabolic impairments.
    Further, the milk phospholipid concentrations used to coat the lipid droplets
    in the Concept diet also contained ceramides, which may have a direct effect on
    ceramide levels in blood and membranes, as shown for phosphatidylcholines [63,64].
    With regard to longer-term effects, it is important to note that feeding a WSD
    did not differentially affect CTRL or Concept mice, as shown in Suppl. Fig. 6.


    Despite the significant improvements in hepatic lipid oxidation and circulating
    lipid peroxides, the effects of Concept on fasting glycemia, NEFA and insulin
    sensitivity were relatively modest. The relatively short exposure to the WSD (8
    weeks) may be explanatory as the effect of Concept on fasting plasma glucose,
    lipids, leptin, resistin and total body fat mass were more prominent after longer
    (12 weeks) exposure to WSD in our previous study [22]. Other factors such as the
    oxidation of hepatic insulin sensitivity would have required clamp tests, as HOMA-IR
    was assessed only upon a rather short duration of fasting (3 h), based on ethical
    considerations for animal well-being. Concept treated animals did respond to the
    obesogenic diet, but Concept feeding, even when challenged for a longer period
    with WSD, protected animals from development of hyperinsulinemia. Elevated plasma
    insulin results from higher insulin secretion or lower insulin clearance [65].
    In humans, insulin clearance is not necessarily related to liver fat content [66],
    whereas a high-fat diet may impair insulin clearance in mice [67]. In our study,
    hyperinsulinemia could therefore originate from both compensatory increased insulin
    secretion or decreased insulin clearance. As C-peptide clearance by the liver
    is negligible, this parameter is used to estimate insulin secretion [68]. Unfortunately,
    we could not assess C-peptide in this study due to limited plasma availability.


    This study has some limitations We need to address. We cannot conclude whether
    the effects of Concept on mitochondrial oxidative activity and lipid metabolism
    are due to the increased size of dietary lipid droplets, the phospholipid coating
    of these droplets or its combined effects. Previous studies showed, however, that
    both an increase in lipid droplet size and phospholipid coating are required for
    the phenotypic Concept effects [70]. Also monitoring of mitochondrial ATP concentration
    and/or synthesis, which is affected by lipid diets, diabetes and NAFLD in humans
    [71–73] would have been of interest, but was not possible due to the limited amount
    of tissue available. In addition, metabolic changes, detailed analysis of tissue-specific
    insulin sensitivity using hyperinsulinemic clamp tests with isotopic dilution
    methods [74] would be required.


    In conclusion, early-life feeding with a diet containing large, phospholipid coated
    lipid droplets (Nutricis®) was shown to improve hepatic oxidative capacity, mitochondrial
    fusion and lipid profiles, directly after exposure, which persisted into later
    life under an obesogenic environment in a mouse model for nutritional programming.
    Thus, this study highlights the role of an early life diet containing specific
    phospholipids mimicking human breast milk on metabolic health later in life.


