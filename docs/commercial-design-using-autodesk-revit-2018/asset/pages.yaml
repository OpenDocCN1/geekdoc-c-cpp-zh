  md: '# Lesson 13


    # SITE AND RENDERING:


    In this chapter you will take a look at Revit''s photo-realistic rendering abilities
    as well as the basic site development tools. Rather than reinventing the wheel,
    Autodesk makes several high-end rendering programs like Autodesk 3DS Max, Autodesk
    Maya and Autodesk Renderer, which work with Revit models in various ways; the
    integration options improve with each new release.


    # Exercise 13-1: Site tools


    This lesson will give the reader a quick overview of the site tools available
    in Revit. The site tools are not intended to be an advanced site development package.
    Autodesk has other programs much more capable of developing complex sites like
    AutoCAD Civil 3D 2018. These programs are used by professional Civil Engineers
    and Surveyors. The contours generated from these advanced civil CAD programs can
    be used to generate a topography object in Revit.


    In this lesson you will create a topography object from scratch – you will also
    add a sidewalk.


    Once the topography object (the topography object, or element, is a 3D mass that
    represents part or all of the site) is created the grade line will automatically
    show up in building and wall sections, exterior elevations and site plans. The
    sections even have the earth pattern filled in below the grade line.


    With other Revit elements you can select the object after it is created and set
    various properties for it, such as surface material, Phase, Etc. One can also
    return to Sketch mode to refine or correct the surface – this is done in the same
    way as other Sket objects are edited – by selecting the item and clicking Edit
    on the Options Bar.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_454_0.png)'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Commercial Using Autodesk Revit 2018


    # Overview of Site tools located on the Ribbon


    Below is a brief description of what the site tools are used for. After this short
    review you will try a few of these tools on your office project.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_455_0.png)


    Toposurface: creates a 3D surface by picking points (specifying the elevation
    of each point picked) or by using linework, within a linked AutoCAD drawing, that
    were created at the proper levels.


    Subregion: Allows one to be defined within a previously drawn Toposurface that
    has a different material than the Toposurface itself. The Subregion is part of
    the Toposurface and will move when relocated. If a Subregion is selected and deleted
    the original surface/properties for that area are revealed.


    Split Surface: This tool is similar to the Split tool in every way except that
    the result is separate surfaces that can be intentionally, or accidentally, be
    moved apart from each other. If a split surface is selected and deleted it in
    a subtraction or a void relative to the original Toposurface.


    Merge Surfaces: After a surface has been split into one or more separate surfaces
    you can merge them back together. Only two surfaces can be merged together at
    a time. The two surfaces to be merged must share a common edge or overlap.


    Graded Region: This tool is used to edit the grade of a Toposurface that represents
    the existing site conditions and the designer wants to use Revit to design the
    new site conditions. The tool is generally meant to be used once; when it will
    copy the existing site conditions to a new phase and set the existing site to
    be demolished in the new construction phase. The newly copied site object can
    then be modified for the new site conditions.


    Property Line: Creates property lines (in plan views only).


    Building Pad: Used to define a portion of site to be subtracted when created below
    grade (and added when created above grade). An example of how this might be used
    is to create a Pad that coincides with a basement floor slab, which would remove
    the ground in section above the basement floor slab (otherwise the basement would
    be filled with earth fill pattern). Several pads can be imposed on the same Toposurface
    element.


    13-2'
