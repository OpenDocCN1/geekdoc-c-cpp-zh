  md: '# Exercise 13-5:

    Adding People to Rendering


    Revit provides a few RPC (Rich Photorealistic Content) people to add to your renderings.
    These files are from a popular company that provide 3D photo content for use in
    renderings (http://www.archvision.com). You can buy this content in groupings
    (like college students) or per item. In addition to people, they offer items like
    cars, plants, trees, office equipment, etc.


    # Loading Content into Current Project


    +   1. Open ex13-4.rvt and Save As 13-5.rvt.

    2. Switch to Level 2 view.

    3. Select Component -> Place a Component.

    4. Click the Load Family button on the Ribbon.\n5. Browse to the Entourage folder
    and select both the RPC Male and RPC Female files (using the Ctrl/ to select both
    at once) and click Open.

    6. Place one Male and one Female as shown in Figure 13-5.1.


