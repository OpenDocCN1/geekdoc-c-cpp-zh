  md: '# Exercise 4-3:

    Setting the Floor-to-Floor Height


    You will modify the building''s floor-to-floor height in this lesson. The reasons
    for doing this vary. Some examples might be to make the building shorter or taller
    to accommodate ductwork in the ceilings or the depth of the floor structure (the
    longer the span the deeper structure). The default floor-to-floor height in the
    template file you started from is 10''-0'', which is not practically feasible
    for commercial construction.


    Don''t forget to keep a backup of your files on a separate disk (i.e., Flash Drive,
    CD or DVD). Your project file should be around 3 MB when starting this exercise.
    Remember, your Revit project is one large file (not many small files). You do
    not want anything to happen to it!


    # Modify the Building''s Floor-to-Floor Height


    +   1. Open ex4-2.rvt, Save As ex4-3.rvt.


    +   2. Open the South exterior elevation from the Project Browser.


    Next you will change the floor-to-floor height to be 12''-0" for each level.


    +   3. Select the Level 2 level datum, and then select the text displaying the
    elevation. You should now be able to type in a new number. Type 12 and then press
    Enter to the changes. Notice the windows move because the sill height has not
    been changed (Figure 4-3.1).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_143_0.png)


    > 4. Change Level 3 to 24''-0".


    +   5. Save your project.'
