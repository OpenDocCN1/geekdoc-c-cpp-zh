  md: '# FLOOR PLAN (First Floor)


    # Exercise 3-5:

    Doors and Windows


    This lesson will take a closer look at inserting doors and windows.


    # Insert Doors


    Revit has done an excellent job providing several different door families. This
    makes sense seeing as doors are an important part of an architectural project.
    Some of the provided families include bi-fold, double, pocket, sectional (garage),
    and vertical rolling, to name a few. In addition to the families found on your
    local hard drive, many more are available over other internet sites (some free,
    some not).


    The default template you started with only the S (Single Flush) group in the Doors
    category. If you want to insert other styles you will need to load them from the
    library. The reason for this step is that, when you load a family, Revit actually
    copies the data into your project file. If every possible family was loaded into
    your project at the beginning, not only would it be hard to find what you want
    in a large list of doors, but also the files would be several megabytes in size
    before you drew the first wall.


    You will begin this section by loading a few additional families into your project.


    +   1. Open project ex3-4.rvt and Save-As ex3-5.rvrt.

    2. From the Insert tab, select the Load Family button on the Ribbon (Figure 3-5.1).

    3. Browse through the US Imperial library folder for a moment.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_124_0.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Commercial Design Using Autodesk 2018


