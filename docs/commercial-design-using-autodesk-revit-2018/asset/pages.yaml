    Options and Worksets (see image on previous page). The latter is not covered in
    this book but Design Options are.  Worksets relate to the ability for more than
    one designer to be in the model at a time.


    # View Control Bar


    ```

    1/8" = 1''-0"

    ```


    This is a feature which gives you convenient access to tools which control each
    view''s display settings (i.e., scale, details, graphics style, etc.). The options
    vary slightly between views: 2D View, 3D view, Sheet and Schedule. The important
    thing to know is that these settings only affect the current view, the one listed
    on the Application Title Bar. All of these settings are available in the Properties
    Palette, but this toolbar cannot be turned off like the Properties Palette can.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_31_1.png)


