  md: '# Commercial Using Autodesk Revit 2018


    # Lesson 3

    FLOOR PLAN (First Floor):


    In this lesson you will draw the first floor plan of an office building. The office
    building will be further developed in subsequent chapters. It is recommended that
    you spend adequate time on this as later lessons build on this one.


    # Exercise 3-1:

    Project Overview


    A program statement is created in the pre-design phase of a project. Working with
    the architect (or user group), the architect gathers as much information as possible
    about the project before starting to design.


    The information gathered includes:


    +   * Rooms: What rooms are required?

    * Size: How big do the rooms need to be? (E.g., toilets for a convention center
    are much bigger than for a dentist''s office.)

    * Adjacencies: This room needs to be next to that room. (E.g., the public toilets
    need to be accessible from the public lobby.)


    With the project statement in hand, the architect can begin the design process.
    Although modifications may (and will) need to be made to the program statement,
    it is used as a goal to meet the client''s needs.


    You will not have a program statement, per se, with this project. However, the
    same information will be provided via step-by-step instructions in this book.


    # Project Overview


    You will model a three-story office building located in a rural setting. Just
    to the North of the building site is a medium-sized lake. For the sake of simplicity,
    the property is virtually flat.


    The main entry and parking is from the south side of the building. You enter the
    building into a three-story atrium, Levels 2 and 3 have guard railings that look
    down into Level 1 in the atrium. The atrium is enclosed on three sides by full
    height curtain walls (glass walls). See the image on the front cover.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_102_0.png)


    3-1'
  merge: -1
