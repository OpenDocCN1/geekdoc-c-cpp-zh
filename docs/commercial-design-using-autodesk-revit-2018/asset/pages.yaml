  md: '# Rendering a Night Scene


    One more variation we will look at is rendering the interior atrium view at nighttime.
    This involves adjusting the sun settings so the Sun is not considered and making
    sure you have the correct number of light fixtures to light the space being rendered.


    +   15. Adjust Ceilings and light fixtures to Levels 2 and 3 steps covered in
    previous chapters.


    +   16. Open the Rendering dialog box.


    +   17. Make the adjustments shown in the image to the left. Make sure Scheme
    is set to Interior: Artificial Only.


    +   18. While in the camera view for the Atrium, click on the Render button.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_486_0.png)


    When the rendering is completed you will have a night view of your interior atrium.
    This clearly shows the effect the 2x4 light fixtures have on the rendering, as
    they are the primary light source for this rendering. Your image should look similar
    to **Figure 13-4.8.**


    You can also try this (especially if you have placed light fixtures for the entire
    building) on your exterior camera view. Nighttime renderings can be very dramatic.


    The image to the right is a pool created and rendered in Revit. The rendering
    is only using artificial lights and the “water” material is distorting the pool
    light and the striping on the bottom of the pool.


