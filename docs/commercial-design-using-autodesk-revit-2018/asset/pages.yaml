    be brought to the correct folder automatically.)


    +   d. Click **Open.**


    +   e. With the template file just selected and **Create new “Project”** (Figure-2-1-1).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_60_0.png)


    See Lesson 1 for more information on creating a new project.


    +   2. Select **Architecture → Build Wall** on the Ribbon. (See Figure 2-1-2.)


