  md: '# Commercial Design Autodesk Revit 2018


    Drive the location of geometry: Like temporary dimensions, permanent dimensions
    can also be used to reposition geometry, such as walls, ducts and more. The key
    is to select the element to be repositioned first and then click on the dimension
    text. A common mistake is to select the dimension directly and then click the
    text. This only opens the Dimension Text dialog. Also, consider that Revit would
    not know which referenced element to move if just selecting the dimension and
    not the element; move the left one, move the right element or both equally?


    TIP: A temporary dimension can be turned into a permanent dimension by clicking
    the "dimension icon" below the temporary dimension text.


    Change Dimension Type: When a dimension is selected, click the Type Selector and
    click from the available options. Changing the type can affect the graphic appearance,
    the rounding and alternate units appear (e.g. metric).


