    # # Adding Door Tags


    Next you will add Door Tags to any doors that are missing them. Additionally,
    you will adjust the door numbers to correspond to the room numbers.


    Revit numbers the doors in the order they are placed into the drawing. This would
    make it difficult to locate a door by its door number if door number 1 was on
    Level 1 and door number 2 was on Level 3, etc. Typically, a door number is the
    same as the room that the door swings into. For example, if a door swung into
    into an office numbered 304, the door number would also be 304. If the office
    had two doors into it, the doors were 304A and 304B.


