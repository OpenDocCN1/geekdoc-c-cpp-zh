  md: '# 3D View of Office Layout


    Next you will look at a 3D view of your office area. This involves adjusting the
    visibility of the roof and skylights.


    +   - Switch to the Default 3D view.


    +   - Make sure nothing is selected and the Properties Palette is open.


    +   - Click Edit next to the Visibility/Graphic Override parameter.


    +   - Uncheck the Roof category and click OK.


    The roof should not be visible now. However, you should still see the skylights
    floating in space. You will make those disappear next.


    +   - Select one of the skylights floating above the office area.


    +   - Click the Temporary Hide/Isolate from the View Control Bar.


    You should see the menu shown in Figure 11-3.2 show up next to the Temporary Hide/Isolate
    icon. This allows you to isolate an object (so it''s the only thing on the screen)
    or hide it (so the object is temporarily visible).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_428_0.png)


    +   11. Click Hide Category in the menu (Figure 11-3.2).


    > FYT: This makes all the skylights hide; you could leave it at "Hide Element"
    and select each skylight.


    +   12. Adjust your 3D view to look similar to Figure 11-3.3 by clicking and dragging
    your mouse on the ViewCube.


    You will now restore the original visibility settings for the 3D view.'
