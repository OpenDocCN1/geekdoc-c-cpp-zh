- img_proc: true
  md: '# 5. In the View Depth section, set the Level to Unlimited.


    This change will ensure everything shows up on a steeper site.


    # 6. Click OK.


    You are now ready to create the site object. The element in Revit which represents
    the site is called Toposurface.


    > TIP: Structural engineers can use the toposurface tool to model ledge rock,
    which would aid in determining how foundations need to be.


    # 7. Select Massive & Site -> Model Site -> Toposurface from the Ribbon.


    By default the Place Point tool is selected on the Ribbon; you are now in sketch
    mode. This allows you to place points within view various elevations – Revit will
    generate a 3D surface based on those points, the more points you provide the more
    accurate your surface. Notice on the Options Bar (Figure 13-1.3) that you can
    enter an elevation for each point as you place them on the screen.


    | Modify | Edit Surface | Elevation | 0'' 0" |


    FIGURE 13-1.3 Options bar for Toposurface tool


    # What elevation should I enter in the Options Bar?


    The elevation you enter for each point relate to the level datums set up in your
    project – for example, look at your South exterior elevation (Figure 13-1.4).
    Recall that the first floor is set to 0''-0".


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_458_0.png)


    As you can see in the South elevation, the only place you would want to add points
    at an elevation of 0''-0" would be at the doors. Wherever else should be at 4''-"
    so the grade does not rise higher than the top of the foundation wall and come
    into contact with the brick, possibly block the weeps and brick vents.


    # 8. With the Elevation set to 0''-0" pick the six points shown in Figure 13-1.5;
    these points are the exterior door locations.


    > TIP: You can switch to the Level 1 Floor Plan view while in the Toposurface
    tool; just click the Place Point tool again on the Ribbon.'
  merge: -1
  pgno: 458
- img_proc: true
  md: '+   9. Change the Elevation to -0''-4" (don''t forget the minus sign) on the
    Option Bar and then pick all the inside and outside corners along the perimeter
    of the building which have not yet been selected.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_459_0.png)


    +   10. Set the Elevation to -2''-6" and point to the ten points shown in Figure
    13-1.6 which define the extents of the Toposurface.


    > FYT: The elevations selected will generally provide a positive slope away from
    the building – this will be visible in elevations and sections.


    Sketchy Lines

    Within a view''s Graphic Display Options you can turn on Sketchy Lines and adjust
    the sliders for two related settings: Jitter and Extensions. The first determines
    how the lines are and the latter controls how far lines cross at corners.


    This option is set per view. You will also want to turn on "smooth lines" for
    this view.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_459_1.png)'
