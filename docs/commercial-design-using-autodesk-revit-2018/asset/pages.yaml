  md: '# Exercise 11-3:

    Furniture


    This lesson will cover the steps required to lay out office furniture. The processes
    are identical to those previously covered for toilets and cabinets. Various manufacturers
    are beginning to provide Revit content, for example, take a look at www.hayworth.com.


    # Loading the Necessary Families


    +   1. Open ex11-2.rvt and Save As ex11-3.rvt.

    2. Select the Component tool and load the following items into the current project:


    +   * Local Files (i.e., on your hard drive)

    na. Work Station Cubicle.rfa (Furniture System)

    b. Work Station Desktops (Furniture\Seating)

    c. Sofa-Pensi (Furniture\Seating)

    d. Chair-Breuer (Furniture\Seating)

    e. Chair-Executive (Furniture\Seating)

    f. Chair-Task Arms (Furniture\Seating)

    g. Table-Round (Furniture\Table)

    * Online Files (i.e., SDC Publications)

    nh. Copier-Floor


    These files represent various families that will be used to design the offices.


    > TIP:

    You can set the View mode for the Open dialog box (which is displayed when you
    click Load Family). One option is Thumbnail mode; this displays a small thumbnail
    image for each file in the current folder. This makes it easier to see the many
    symbols and drawings that are available for insertion. You can make the preview
    images larger by holding down the Ctrl key and spinning the wheel on your mouse.


