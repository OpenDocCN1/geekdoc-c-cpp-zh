  md: '# Exercise 12-2:

    Generate a Door Schedule


    This exercise will look at creating a door schedule based on the information currently
    available in the building model (i.e., the tags).


    # Create a Door Schedule View


    A door schedule is simply another view of the building model. However, this view
    displays numerical data rather than graphical data. Just like a graphical view,
    if you change the view it changes all the other related views. For example, if
    you delete a door number from the schedule, the door is deleted from plans and
    elevations.


