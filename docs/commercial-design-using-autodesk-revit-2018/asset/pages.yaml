  md: '# Commercial Design Using Autodesk Revit 2018


    # Lesson 9

    Annotation:


    This chapter covers annotation in Revit: text, dimensions, tags, shared parameters
    and keynotes. In printed form, the drawings are often not enough to convey the
    design intent. These tools provide for effective communication to those using
    the final printed drawings to both bid and build the building. Several of the
    chapters following this one will utilize many of these concepts.


    All of the tools covered in this chapter are found on the Annotate tab. Three
    of the tools on this tab are also on the Quick Access Toolbar because they are
    often used; they are Dimension, Tag by Category and Text.


    **TIP:** It is interesting to note that every tool on the Annotate tab is 2D and
    view specific.


    | File | Architecture | Structure | Systems | Insert | Annotate | Analyze | Massing
    & Site | Comment |

    |---|---|---|---|---|---|---|---|---|

    | Modify | Aligned | Linear | Angular | Radial Diameter | Arc Length | Spot Elevation
    | Spot Coordinate | Spot Slope | Detail Line | |

    | Select | | | | | | | | |


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_318_0.png)


    9-1'
