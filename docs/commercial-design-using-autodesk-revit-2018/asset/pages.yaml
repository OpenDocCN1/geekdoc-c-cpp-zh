  md: '# Exercise 13-3:

    Rendering an Isometric in Section


    This exercise will introduce you to a view tool called Section Box. This tool
    is not necessarily related to renderings, but the two tools together can produce
    some interesting results. The Section Box works in any 3D, even camera views.
    This can be used throughout the design process to better visualize your model.


    # Setting up the 3D View


    +   1. Open file ex13-2.rvt and Save As ex13-3.rvt.

    2. Switch to the Default 3D view via the 3D icon on the QAT (not the 3D View 1
    Exercise 13-2).

    3. Make sure nothing is selected so the Properties Palette is showing the View
    Properties.

    4. Activate the Section Box parameter and then click OK.


    You should see a box appear around your building, similar to Figure 13-3.1. When
    selected, you can adjust the size of the box with its grips. Anything outside
    the box is not visible. This is a great way to study a particular area of your
    building while in an isometric view. You will experiment with this feature next.


