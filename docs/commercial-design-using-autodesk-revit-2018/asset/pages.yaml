  md: '# Exercise 6-2:

    Skylights


    This short exercise covers inserting skylights in your roof. The process is much
    like inserting windows. In fact, Revit lists the skylight types with the window
    types, so you use the Window tool to insert skylights into your project. Technically,
    a skylight is a roof hosted window.


    # Inserting Skylights


    You will place the skylights in an elevation view.


    +   1. Load project file ex6-1.rvt.

    2. Switch to the South elevation view.

    3. Select the Window tool and load the skylight family (skylight.rfa) into the
    project (via the Load family button on the Ribbon).

    4. Select Skylight: 24" x 27" from the Type Selector.

    5. Roughly place four skylights as shown in Figure 6-2.1 on the roof.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_230_0.png)


    You are now ready to place skylights on the roof. Revit will only look for roof
    elements when placing skylights, so you don''t have to worry about a skylight
    ending up in a wall.


