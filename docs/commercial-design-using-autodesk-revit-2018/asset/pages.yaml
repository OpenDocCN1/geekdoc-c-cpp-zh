  md: '# SITE and RENDERING


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_460_0.png)


    FIGURE 13-1.6 Site plan view – 10 points to be selected (elev – 2''-6")


    +   11. Select the green check mark on the Ribbon to finish the Toposurface.


    Revit has now created the Toposurface based on the points you specified. Again,
    the more points you add the more refined and accurate the surface will be.


    Ideally you would use the Toposurface tool to create a surface from a surveyor''s
    points file or contour lines drawn in an AutoCAD file – Revit can automatically
    generate surfaces from these sources, rather than you picking points. This process
    is beyond the scope of this tutorial.


    +   12. Switch to the 3D view to see your new ground surface (Figure 13-1.7).


