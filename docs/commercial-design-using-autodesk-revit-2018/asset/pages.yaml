  md: '# Self-Exam:


    The following questions can be used as a way to check your knowledge of this lesson.
    The answers can be found at the bottom of this page.


    +   1. You don''t have to click Finish Roof when you are done defining a roof.
    (T/F)


    +   2. The wall below the roof automatically conforms to the underside of the
    roof when you join the walls to the roof. (T/F)


    +   3. The roof overhang setting is available from the Options Bar. (T/F)


    +   4. To create a gable roof on a building with 4 walls, two of the walls should
    not have the option checked.


    +   5. Is it possible to change the reference point for a temporary dimension
    that is displayed while an object is selected? (Y/N)


    # Review Questions:


    The following questions may be assigned by your instructor as a way to assess
    your knowledge of this section. Your instructor has the answers to the review
    questions.


    +   1. When creating a roof using the “roof by footprint” option, you need to
    create a closed perimeter. (T/F)


    +   2. Can the “Defines Slope” setting be changed after the roof is “finished”?
    (Y/N)


    +   3. Skylights need to be rotated to align with the plane (pitch) of the roof.
    (T/F)


    +   4. Skylights automatically make the glass transparent in shaded views. (T/F)


    +   5. While using the Roof tool, you can use the tool from the Ribbon to fill
    in the missing segments to close the perimeter.


    +   6. You use the parameter to adjust the vertical position of the roof relative
    to the current working plane (view).


    +   7. A skylight cannot be repositioned in an elevation view. (T/F)


    +   8. You need to use the to flip the roofline when you pick the wrong side of
    the wall and the overhang is shown on the inside.


    SELF-EXAM ANSWERS:

    1 - F, 2 - T, 3 - T, 4 – defines slope, 5 - Y


