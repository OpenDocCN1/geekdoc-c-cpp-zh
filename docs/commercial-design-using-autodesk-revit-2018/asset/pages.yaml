  md: '# Commercial Design Using Autodesk Revit 2018


    # Lesson 10

    SECTIONS AND DETAILS:


    Sections are one of the main communication tools in a set of architectural drawings.
    They help the builder understand vertical relationships. With traditional CAD
    software, architectural sections can occasionally contradict other drawings, as
    mechanical or structural drawings. One example is a beam shown on the section
    is smaller than what the structural drawings call for; this creates a problem
    in the field where the duct does not fit in the ceiling space. The ceiling gets
    lowered or the duct gets smaller, ultimately compromising the design to a certain
    degree.


    Revit takes great steps towards eliminating these types of conflicts. Sections,
    like plans and elevations, are generated from the 3D model. So it is virtually
    impossible to have a conflict between the architectural drawings. As structural
    and mechanical engineers begin to use Revit, the coordination gets better as the
    various disciplines'' models are linked together.


    # Exercise 10-1:

    Specify Cutting Plane in Plan View


    Similar to elevation tags, placing the reference tags in a plan view actually
    generates the section view. You will learn how to do this next.


    # Placing Section Tags


    +   1. Open ex8-6.rvt and Save As ex10-1.rvt.

    2. Switch to Level 1 view.

    3. Select View -> Create -> Section button from the Ribbon.

    4. Draw a Section tag as shown in Figure 10-1.1. Start on the left side in this
    case. Use the Move tool if needed to accurately adjust the section tag after insertion.
    The section should go through the doors in the stair shaft (Figure 10-1.1).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_374_0.png)'
