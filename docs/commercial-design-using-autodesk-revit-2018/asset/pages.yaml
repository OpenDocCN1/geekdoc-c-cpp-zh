  md: '# Exercise 13-4:

    Creating an Interior Rendering


    Creating an interior rendering is very similar to an exterior rendering. This
    exercise will walk through the steps involved in creating a high quality interior
    rendering.


    # Setting up the Camera View:


    +   1. Open ex13-3.rvt and Save As ex13-4.rvt.

    2. Open Level 2 view.

    3. From the QAT, select 3D View -> Camera.

    4. Place the Camera as shown in Figure 13-4.1.


    Revit uses default heights for the camera and the target. These heights are based
    on the current level''s floor elevation. These reference points can be edited
    via the camera properties.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_481_0.png)


    Revit will automatically open the newly generated camera view. Your view should
    be similar to Figure 13-4.2.


    FYI: Make sure you created the camera on Level 2 and picked the points in the
    correct order.'
