  md: '# Commercial Design Using Autodesk Revit 2018


    +   2. Click your cursor within the atrium area to place a Room, which will also
    automatically place a room tag (Figure 12-1.1).


    By default, Revit will simply label the space “Room” and number it “1.” You will
    change these to something different.


    +   3. Press ESc or select Modify to cancel the Room command.


    +   4. Click on the Room Tag you just placed to select it.


    +   5. Now click on the room name text to change it; enter Atrium.


    +   6. Now click on the room number to change it; enter 100.


    +   7. Add Room Tags (using the Room tool) for each room on Level 1, incrementing
    each room number by 1 (Figure 12-1.1).


    The stair shafts typically are numbered Stair #1, Stair #2, etc. The same number
    is then placed on each level. This is because stair shafts are really one tall
    room and the finishes would apply to the entire shaft, not each floor. When you
    try to place a tag with the same name and number, Revit will warn you; see the
    tip on the previous page to avoid this problem.


    +   8. Add Room/Tags to Levels 2 and 3. The numbering for Level 2 should start
