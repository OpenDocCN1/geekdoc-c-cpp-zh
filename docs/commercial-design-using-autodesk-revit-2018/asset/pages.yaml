  md: '# Managing Text Types


    When using the text tool, the options listed in the Type Selector are the result
    of Text Types defined in the current project. Most design firms will have all
    the Text Types they need defined within their template.


    There are two ways to access the type properties. One is to start with the Type
    command and then click Edit Type in the Properties Palette. The other is to click
    the arrow within the Type panel on the Annotate tab pointed out in the image below.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_328_0.png)


    The Type Properties, as shown in the example to the right (Figure 9-1.17) are
    fairly self-explanatory. Below is a brief description of each.


    | Command | What it does... |

    |---|---|

    | Color | This can affect printing, so it is often set to black. |

    | Line Weight | This is only for the leader. |

    | Background | Toggle: Opaque or Transparent |

    | Show Border | Check box: Show or Hide |

    | Leader/Arrowhead Offset | Space between text and board – leader – helpful when
    Background is set to Opaque. |

    | Leader Arrowhead | Select from a list of predefined arrow types |

    | Text Font | Select from a list of installed fonts on your computer |

    | Text Size | Size of text on the printed page |

    | Tab Size | Size of space when Tab is pressed (size on printed paper) |

    | Bold | Default setting – can be changed while in edit mode |

    | Italic | Default setting – can be changed while in edit mode |

    | Underline | Default setting – can be changed while in edit mode |

    | Width Factor | Adjusts the overall width of a line of text |'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Commercial Design Autodesk Revit 2018


    # Colors


    The color applies to the text and the leader. The color is often set to black.
    If the any other color is used, this can affect printing. For example, any color
    becomes a shade of gray when printed to a black and white printer—similar to printing
    a document from Microsoft Word where green text is a darker shade of gray than
    yellow text. In the Print dialog there is an option to print all as Black Lines
    which can make colored text black. However, this also overrides gray lines and
    fill patterns.


    # Custom Fonts


    Be careful using custom fonts installed on your computer as others who do not
    have those fonts will likely not see the formatting same as intended. Custom fonts
    can come from installing other software such as Adobe InDesign. In fact, Autodesk
    also installs several custom fonts which are supposed to match some of the special
    SHX fonts which come with AutoCAD.


    # Custom Fonts


    It is not possible to create custom arrowheads. However, the list of arrowheads
    is based on styles defined here: Manage -> Additional Settings -> Arrowheads.
    This provides many options for how these items look.


    # Width Factor


    Some firms will use a Width Factor like 0.75, 0.85 or something similar to squish
    the text to fit more information on a sheet. Getting any narrower than this makes
    the text hard to read. This option actually changes the proportions of each letter,
    not just the space between them.


    # Misc.


    Note that Text does not have a phase setting. Thus the phase filters and overrides
    do not apply to text. It is sometimes desired to have text noting existing elements,
    such as ductwork, to be a shade of gray rather than solid—black being reserved
    for things that are new.'
  merge: -1
  pgno: 329
