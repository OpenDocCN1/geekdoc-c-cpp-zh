  md: '# Drawing the Stairs in Plan


    You will be drawing a standard switch-back stair. At first, when using Revit to
    draw stairs, it may be helpful to figure out the number of risers and landings.
    That information will be helpful when drawing the stair. As you become more familiar
    with the Stair tool you will not need to do those calculations to draw a stair.
    Dividing the floor-to-floor height of 12''-0" by 7" we get 20.57. Obviously you
    cannot have a fraction of a riser so you to round up to 21 (rounding down would
    make the riser higher than 7"). Therefore, 12''-0" divided by 21 equals 6.86".
    Thus you have 21 risers that are 6.86" high. Additionally, most codes would require
    a landing in a rising stair 12''-0".


    +   4. Make sure you are in the Level 1 floor plan view.


