  md: '# FOREWORD


    To the Student:


    This book has been written with the assumption that the reader has no prior experience
    using Autodesk Revit. The intent of this book is to provide the student with a
    well-rounded knowledge of architectural tools and techniques for use in both school
    and industry.


    The book consists of a series of tutorials which primarily focus on the development
    of a single project. When you finish the book you will have learned how to document
    and model all of the major architectural aspects of a commercial project. This
    includes floor plans, interior and exterior deiors, wall and building sections,
    and room finish schedules and organizing drawings for printing.


    There are several videos that supplement the book. Studying these videos along
    with the book will help the reader to understand Revit''s architectural features.
    The book and videos will also help prepare for the Autodesk Architecture Certification
    Exam; see Appendix A for more information.


    Be sure to check the bonus material available online.


    > Errata:

    Please check the publisher''s website from time to time for any errors or typos
    found in this book after it went to the printer. Simply browse to www.SDCpublications.com,
    and navigate to the page for this book. Click the View/Submit errata link in the
    upper right corner of the page. If you find an error, please submit it so we can
    correct it in the next edition.


    > You may contact the publisher with comments or questions at service@SDCublications.com.
    Do not email with Revit questions unless they relate to a problem with this book.


    To the Instructor:


    This book was designed for the architectural student using Revit 2018. Note: Students
    can successfully work through this book using Revit Architecture 2018. Throughout
    the book, the student develops two story commercial building. The drawings start
    with the floor plans and develop all the way to photo-realistic renderings similar
    to the one on the cover of this book.


    Throughout the book many Revit tools and techniques are covered while creating
    the model. Also, in a way that is applicable to the current industry, industry
    standards and conventions are covered. Access to the internet is required for
    some exercises.


    Each chapter concludes with a self-exam and review questions. The answers to the
    self-exam questions are provided, review question answers are not (they can only
    be found in the Instructor''s Guide available from the publisher).


    This text is updated every year for the latest version of Revit. The printed text
    has always been available for the fall term.


    An Instructor''s Resource Guide is available for this book. It contains:


    +   - Answers to the questions at the end of each chapter


    +   - Example images of each exercise to be turned in (can be used to grade students
    work)


    +   - Outline of tools and topics to be covered in each lesson''s lecture


    +   - Suggestions for additional student work (for each lesson)


    +   - Author''s direct contact information'
