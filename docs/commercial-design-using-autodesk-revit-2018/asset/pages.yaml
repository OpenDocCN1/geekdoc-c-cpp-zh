  md: '# Self-Exam:


    The following questions can be used as a way to check your knowledge of this lesson.
    The answers can be found at the bottom of this page.


    +   1. The Options Bar allows you to set the height of a wall when first drawing
    it. (T/F)

    2. It is not possible to draw a wall with the interior or exterior face of the
    core as the reference point. (T/F)

    3. Elements cannot be moved accurately with the Move tool. (T/F)

    4. The tool, in the Ribbon, has to be selected in order to select an element as
    your project.

    5. A wall has to be to see its flip icons.


    # Review Questions:


    The following questions may be assigned by your instructor as a way to assess
    your knowledge of this section. Your instructor has the answers to the review
    questions.


    +   1. Revit comes with predefined doors and windows. (T/F)

    2. The length 3''-8" is a masonry dimension. (T/F)

    3. You can delete unused families and types in the Project Browser. (T/F)

    4. It is not possible to load families and types from the internet. (T/F)

    5. It is not possible to select which side of the wall a window should be on while
    are inserting it. (T/F)

    6. What tool will break a wall into two smaller pieces?

    7. The tool allows you to match the surface of two adjacent walls.

    8. Occasionally you use the Split Element command to turn one wall into two walls.
    (T/F)

    9. You can use the tool to copy an element multiple times in it.

    10. The template file has a few doors, windows and walls preloaded in it. (T/F)


    SELF-EXAM ANSWERS:

    1-T, 2-F, 3-F, 4-Modify, 5-Selected'
