- img_proc: true
  md: '# Exercise 9-1:

    Text


    This section covers the application of notes using the Text command in Revit.
    We will also look at Revit''s Spell Check and Find/Replace tools, including their
    limitations.


    The first thing to know about the text tool is that it should be used as little
    as possible! Rather, live tags, keynotes and dimensions are preferred over static
    text to ensure the information is correct. Text will not update or move when something
    in the model changes—especially if the text is not visible or in the view where
    the model is being changed.


    With that said, the text command is still necessary and often used within Revit.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_319_0.png)


    # Text


    The Text tool can be started from the Quick Access Toolbar, Annotate tab or by
    typing TX on the keyboard.


    Properties

    Text

    3/2" Arial


    n

    The first thing to do is consider the current text type in the Type Selector (Figure
    9-1.1). The name of a text type should be, at a minimum, contain the size and
    font. The size is the actual size on the printed page regardless of the drawing
    scale.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_319_1.png)


    There are additional steps that are optional, but at this point you could click,
    or click and drag, within the drawing window and start typing.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'Here is the difference between click and click and drag options when starting
    text:


    +   - **Click;** Defines the starting point for new text. No automatic return
    to next line while typing. An Enter must be pressed to start a new line; this
    is called a “hard return” in the word processing world.

    - **Click and Drag;** This defines a windowed area where text will be entered.
    The height is not really important. The width determines when a line automatically
    returns to the next line while typing. Using this method allows paragraphs to
    be easily adjusted by dragging one of the corners of the textbox.


    As long as “hard returns” are not used, the textbox width and number of rows can
    be adjusted at any time in the future. To do this, the text must be selected and
    then the grip on the right (See Figure 9-1.1) can be repositioned via click and
    drag with left mouse button.


