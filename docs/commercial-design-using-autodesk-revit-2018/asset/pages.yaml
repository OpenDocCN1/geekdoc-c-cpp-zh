  md: '# Commercial Design Using Autodesk 2018


    10. Switch to the Level 1 RCP view. Fix the ceiling.


    > NOTE: The ceiling grids are likely not aligned with the revised walls. If this
    is the case, see the explanation below (Figure 8-2.6).


    Most of the time, when you move a room, Revit will automatically update the ceiling
    grid to fit the new room. However, occasionally the definition of the room boundary
    is lost while making modifications. In this case, you will have to delete the
    grid and reinsert it - select it and "edit sketch".


    # Deleting a Ceiling Grid:


    When selecting a ceiling grid, Revit only allows you to select one line. This
    does not delete the ceiling grid. To delete, hover over a ceiling grid line and
    tap TAB key until you see the ceiling perimeter highlight, then click the mouse.
    The entire ceiling will be selected. Press Delete.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_285_0.png)


