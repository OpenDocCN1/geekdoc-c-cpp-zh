  md: '# Exercise 5-6:

    Elevators


    Commercial buildings with more one story often have an elevator for convenience
    and to comply with accessibility codes: This section will be modeled within Revit.


    # Shaft Walls:


    First, an elevator is contained within a vertical shaft defined by four walls
    as seen in the image to the right (Figure 5-6.1). These walls are modeled using
    Revit''s wall tool. These walls should be modeled as they are built. In this example
    the masonry walls are bearing (i.e. they are structural) and will support the
    floors and roof) so a single wall extends from the footing to the roof. If they
    walls are built on each floor, then separate walls will be created at each level.
    Also, if different finishes are required at each floor, then separate walls are
    added adjacent to the shaft walls.


    The dimensions of the shaft are defined by the elevator manufacturer. The width
    and depth are derived from the "car" size and required tracks/rails. The height
    can vary depending on the type of elevator—this often includes a pit (an area
    below the lowest stop) and an overrun (space above the highest stop).


    # Shaft Openings:


    It is important that the hole in the floor align vertically. The best way to ensure
    this is to use the Shaft Opening tool. This tool is a FIGURE extrusion that cuts
    each floor it comes in contact with. This is preferred over editing the sketch
    of each floor to define the opening—which would potentially be wrong at one or
    more floors. Depending on building construction, this shaft is either on the inside
    or outside of the shaft walls. If inside, the floors will extend into the shaft
    walls.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_212_0.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Commercial Design Using Autodesk Revit 2018


    # Elevator Family:


    The installed version of Revit does not come with any sample elevator content
    (except the Metric Library folder).


    The value in manufacture content is that it is the correct size and often has
    helpful features—for example, the family used on the previous page includes a
    box which defines the required shaft size, including pit depth and overrun. However,
    in the floor plan-views it does not follow the standard architectural graphics
    conventions for an elevator (whereas the generic one above does).


    Another option is to create custom content. It is generic and parametric so it
    looks correct in plans and sections and is manually adjustable by the elevator
    selected. There is a good example of a custom elevator family, including call
    buttons and indicator lights, in a thread at this location: http://www.revforum.org/architecture-general-revit-questions/12415-elevators-what-do-you-do.html.


    Yet another option is DigiParaElevatorarchitect, which is a free Revit add-in.
    This tool includes several elevator manufacturers such as ThyssenKrupp, OTIS,
    KONE, Schindler and more. URL: http://www.digipara.com/


    # Elevator Doors:


    Elevators have several sets of doors. One set is associated with the elevator
    car while the rest are located on each floor the elevator stops. The elevator
    cab door is represented in the elevator family. The doors at each floor are separate
    families individually placed at each floor.


    Having separate elevator door families at each level will accommodate the various
    finishes at each level. TIP: when using multiple walls to represent the shaft
    wall and floor-specific finishes, use the join tool on those walls. This will
    cause the door family to cut through all walls.


    # Elevator Misc:


    Elevators usually require an Elevator Equipment Room. This would be sized and
    positioned per the manufacturer’s literature. If the elevator has a pit, it most
    likely requires a “pit ladder” for maintenance personnel to access the pit (this
    may have to be a custom family if one cannot be found).'
