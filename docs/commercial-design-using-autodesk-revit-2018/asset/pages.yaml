  md: '# Exercise 9-2:

    Dimensions


    This exercise will cover the ins and outs of dimensioning in Revit.


    The first thing to understand about dimensions is that they are 2D and view specific—like
    all commands on the Annotate tab.


    Dimension elements have an association with the thing(s) being dimensioned. If
    that thing(s) is deleted the dimension will also be deleted, even if the dimension
    is not visible in the current view. For example, if a wall is deleted from a 3D
    view, then any dimensions associated with that wall, in a floor plan view, which
    may not even be, will be deleted.


    Because dimensions have an association with specific elements in the model it
    is important to make sure the correct elements are selected while placing the
    dimension. In a floor plan, for example, the place to click a dimension may have
    several elements stacked on top of each other: grid line, wall edge edge, window
    edge, wall sweep. It may be necessary to tap the Tab key to cycle through the
    options to select the correct item (while tabbing, the highlighted element will
    be listed on the status bar at the bottom of the screen).


    Each dimension command will be covered in the order they appear on the Annotate
    as seen in the image below.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_333_0.png)


    | Command | What it does... |

    |---|---|n| 1. Aligned | Most used dimension tool; dimension between parallel
    references (e.g. walls or ducts) or multiple points |

    | 2. Linear | Dimensions between points and always horizontal or vertical |

    | 3. Angular | Measures angle between two references |

    | 4. Radial | Indicates the radius of a curved line or element |

    | 5. Diameter | Indicates the diameter of an arc or circle |

    | 6. Arc Length | Measures the length of a line/element along a curve |

    | 7. Spot Elevation | Lists the elevation at a selected point, on an element (e.g.
    floor, ceiling, tourface) |

    | 8. Spot Coordinate | Indicates the N/S and E/W position of a selected point
    |

    | 9. Spot Slop | Used to indicate the slope of a ramp in plan or the pitch of
    a roof in elevation |'
  merge: -1
