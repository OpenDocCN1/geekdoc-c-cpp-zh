  md: "# Placing Room Tags\n\nRoom Tags must be preceded by placing a Room. A Room\
    \ element is used to define a space and hold information about a space (e.g.,\
    \ floor finish, area, department, etc.). See this author's article in the AUGI\
    \ AEC-Edge magazine for a detailed discussion on this topic (www.AUGI.com). Like\
    \ a Door Tag, a Room Tag simply lists information contained within the element\
    \ being tagged.\n\nThe Room feature searches for areas enclosed by walls; a valid\
    \ area is pre-highlighted when you click to create it.\n\nBy default, Revit will\
    \ automatically place a Room Tag at the cursor location when you click to add\
    \ the Room element.\n\n+   1. Select Architecture $\rightarrow$ Room & Area $\r\
    ightarrow$ Room.\n2. Set the Type Selector to Room Tag: Room Tag—With Area and\
    \ make sure Tag on placement is—se\nelected on the Ribbon.\n3. Click within each\
