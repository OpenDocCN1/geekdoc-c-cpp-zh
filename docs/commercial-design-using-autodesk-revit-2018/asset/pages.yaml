  md: '# Commercial Design Using Autodesk Revit 2018


    The toposurface is automatically added in sections and elevations (Figure 13-1.8).
    It may need to be turned off in other views.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_461_0.png)


    FIGURE 13-1.8 Section with ground pattern added


    If your building has a basement or space partially below grade you will need to
    add a Building Pad to "stamp" out an area of the Toposurface. To add one you select
    the tool, draw an outline in a plan view and then specify the depth, or height,
    of the pad. The Toposurface removes, or adds, ground below the Building Pad. If
    you have a stepped basement you will need multiple Building Pads. Their edges
    can align but they cannot overlap.


    Next you will quickly create a sidewalk to wrap up this lesson.


    You can use the Subregion tool or the Split Surface tool to create the driveway
    and sidewalks. The Subregion tool defines an area that is still part of the main
    site object – the Split Surface tool literally breaks the Toposurface into separate
    elements. Splitting a surface can create problems when trying to move or edit
    the site so you will use the Subregion tool.


    +   13. Switch back to the Site plan view.


    +   14. Select Massive & Site -> Modify Site -> Subregion tool and sketch the
    lines for the sidewalk (Figure 13-1.9).


    +   15. Click the green check mark on the Ribbon to finish the Subregion.'
