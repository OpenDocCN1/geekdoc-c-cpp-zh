  md: 'The Stair and Railing tools will be covered in more detail in the following
    “exercises” in this chapter. But, first, here is a high level introduction to
    the tools available in Revit...


    # Stair Tools


    Revit has a single stair tool; **Stair by Component**. Note that *Stair by Sketch*
    has been removed in Revit 2018.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_150_0.png)


    # Railing Tools


    Revit has two main tools one can use to model railings:


    +   - Sketch Path

    - Place on Host


    **The Sketch Path** tool allows a continuous section of railing to be added to
    the current level. The **Pick Host** command provides a quick way to add railings
    to a stair or railing, which is handy if they are deleted or not added during
    the stair/ramp creation.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_150_1.png)


    In addition to these two Railing tools, railings can also be created while creating
    Stairs and Ramps. While in the Stair or Ramp command, selecting the **Railing**
    button on the Ribbon lets you specify railing to use and how to position it (Figure
    5-1.3). Revit will add a railing to both sides. Once created, one or both of the
    railings can be deleted. One tricky thing about the Pick Host tool is it only
    works if the stair or ramp does not have any railings hosted.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_150_2.png)


    **FIGURE 5-1.3** Specify how railing will be created


    **Sloped Railings Tip:** A railing will not slope with a floor if the floor has
    been made to slope by modifying its sub elements. Instead, use a Slope Arrow in
    Sketch Mode for the floor.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Commercial Design Using Autodesk Revit 2018


    # Basic Stair Types


    Revit has three fundamentally different stair types which are needed to properly
    model the various types of stairs typically found in construction.


    Stair Types:


    +   - Assembled Stair

    - Monolithic Stair (aka Cast-In-Place)

    - Precast Stair


    Assembled Stair


    Revit''s Assembled Stair represents the most common type of stair in construction:
    concrete pan and steel riser (Figure 5-1.4). A residential stair constructed of
    wood can also be accomplished with this option. With this type Revit provides
    separate settings for the treads, risers and supports.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_151_0.png)


    FIGURE 5-1.4 Assembled stair type example


    Monolithic Stair (aka Cast-In-Place)


    When a stair is constructed with cast-in-place concrete (CIP), the monolithic
    stair type should be used (Figure 5-1.5). This stair is often used outside the
    building (site design) or within the building whose primary structure is also
    CIP concrete. The properties for this type of stair vary a bit from the assembled
    stair type—for example, the minimum thickness and whether the bottom should slope
    or step can can be specified. Structural designers can add Rebar to this type
    of element.


    5-6'
