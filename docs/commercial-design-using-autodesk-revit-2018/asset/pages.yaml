  md: '# Creating the rendering


    Next you will render the view.


    +   10. Select Show Render Dialog from the View Control Bar.

    11. Set the Scheme to Interior: Sun only.

    12. Set the Sun Setting to Lighting: Sunlight Top Right.

    13. Click Render to begin the rendering process.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_484_0.png)


    This will take several minutes depending on the speed of your computer. When finished,
    the view should look similar to Figure 13-4.7.


    +   14. Click Export from the Rendering dialog box to save the file on your hard
    drive. Name the file Atrium.jpg (jpeg file format).


    You can now open the Atrium.jpg file in Adobe Photoshop or insert into MS Word
    to manipulate or print.


    To toggle back to the normal hidden view, click Show the Model from the Rendering
    dialog box.


    There are many things you can do to make the rendering look even better. You can
    add interior light fixtures and props (e.g., pictures on the wall, items on the
    countertop, and lawn furniture). Once you add interior lights, you can adjust
    the Sun setting to nighttime and render a scene.


    > TIP: Setting the output to Printer rather than Screen allows you to generate
    a higher resolution image. Thus, the Quality setting and the output setting you
    can create an extremely high quality rendering, but it might take hours, if not
    days, to process!


    Revit gives you the ability to set a material to be self-illuminating. This will
    allow you to make a button on the dishwasher look like it is lit up, or if applied
    to the glass on the range door, like the light in the oven is on! You can also
    set a lamp shade to glow when a light source has been defined under it so it looks
    more realistic.'
