  md: '# Commercial Design Using Autodesk Revit 2018


    Now you will put this knowledge to use!


    # Setting Up a Design Option Set


    In this exercise you will create two Design Option Sets: one for the curtain wall
    and another for the roof area above the curtain wall. You will create an alternate
    roof and curtain wall design for the office building project.


    You could create one Design Option Set and have two design options total. However,
    by placing the curtain wall options in one Option Set and the roof in another,
    you actually get a total of four design options. You can mix and match the curtain
    wall and roof options.


