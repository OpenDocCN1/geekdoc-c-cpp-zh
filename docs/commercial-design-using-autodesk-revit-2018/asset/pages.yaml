  md: 'While in Sketch mode, use the **Boundary** option (Figure 5-2.8) to draw a
    small line past the last Riser as shown in Figure 5-2.10. Select this line and
    set its *Slope* to be **Flat** on the Options Bar. You can also adjust the *Height
    Correction* option to make the top of the stringer align with an adjacent wall
    base if needed. The final result is shown in the 3D image (Figure 5-2.10).


    Another option is to just drag the current *Boundary* edge past the last *Riser*.
    This extension can only be sloped as it is a continuation of the main sloped stringer.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_164_0.png)


    FIGURE 5-2.10 Stringer control options


    # Stair Width


    Keep in mind that the width of the stair is between the two stringers. When laying
    out a stair, you need to consider the size of the stringer that will appear on
    each side when the stair is finished (Figure 5-2.11). This is only true when the
    *Type Properties* has the stair left and right options set to *Closed*. Otherwise,
    when set to *Open*, the stringers are below the stair and do not increase the
    overall width. Figure 5-2.12 shows an example of an *Open* stringer.'
