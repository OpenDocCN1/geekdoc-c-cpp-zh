  md: '# Reposition text:


    When a dimension is selected, clicking and dragging on the text grid allows the
    text to be repositioned.


    When the text is moved past one of the witness lines, Revit will add a leader
    by default as shown to the right (Figure 9-2.11). Right-clicking on a dimension
    reveals related commands on the pop-up menu (Figure 9-2.12); selecting Reset Dimension
    Position will move the text back to the original location.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_344_0.png)


    FIGURE 9-2.11 Dimension Text leader


    # Lock on Dimension:


    When a dimension is selected, clicking the lock icon (Figure 9-2.13, will prevent
    dimension value from changing. This will not prevent model elements from moving,
    but to maintain the dimension value, both reference elements will move. For example,
    if a dimension is locked between two walls which define a corridor, moving one
    wall will move the other wall to ensure the dimension width does not change.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_344_1.png)


    FIGURE 9-2.12 Right-click options


    When elements are selected which are in some way constrained, Revit will show
    the lock symbol. This is true even if the locked dimension is not visible in the
    current view (Figure 9-2.14). Clicking this icon will unlock the constraint.


    When a locked dimension is deleted, Revit asks if the constraint should also be
    removed. Thus, it is possible to delete the dimension but leave the constraint
    in place.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_344_2.png)


    FIGURE 9-2.13 Dimension selected


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_344_3.png)


    FIGURE 9-2.14 Locked element'
