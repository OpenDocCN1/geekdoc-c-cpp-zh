  md: 'Here, the Edit Assembly dialog box allows you to change the composition of
    an existing wall or to create a new wall.


    Things to notice in the Edit Assembly dialog box (Figure 3-2.5):


    +   - The exterior side is labeled at the top and interior side at the bottom.

    - You will see horizontal rows (i.e., Core Boundary) identifying the core material.
    The core material can be used to place walls and dimension walls. For example,
    the Wall tool will let you draw a wall with the interior or exterior core face
    as the reference line. On an interior wall you would typically dimension to the
    face of CMU rather than to the finished face of gypsum board. This is to work
    out cursing and give the contractor the information needed for the part of the
    wall you will build.

    - Each row is a layer. By clicking on a layer and picking the Up or Down buttons,
    you can reposition materials, or layer, within the wall assembly.


    +   8. Click Cancel in each open dialog box to close them.


