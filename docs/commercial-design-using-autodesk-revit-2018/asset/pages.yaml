  md: '# Leader Options


    A leader is a line which extends from the text, with an arrow on the end, used
    to point at something in the drawing.


    The default option, when using the text command, is no leader. This can be seen
    as the highlighted option in the upper left.


    The remaining three options determine the graphical appearance of the leader;
    one segment, two segment or curved as seen in Figure 9-1.7. Often, a design firm
    will standardize on one of these three options for a consistent look.


    # ONE SEGMENT LEADER


    # TWO SEGMENT LEADER


    # CURVED LEADER


    FIGURE 9-1.7 Leader formatting options


    +   Here are the steps to include a leader with text:

    * Start the Text command

    * Select text type via Type Selector

    * Select Leader option

    * Specify leader location

    * Type text

    * Click Close, or click away from text, to finish


    Once the leader is created, it can be selected and modified later if needed. In
    the image below, Figure 9-1.8, notice the two circle grips associated with the
    leader; at the arrow and the change in direction of the line (the other two circle
    grips are for the text box as previously described in this section). These two
    grips can be repositioned by clicking and dragging the left mouse button.'
