  md: '# Commercial Design Using Autodesk Revit 2018


    # Multistory Stairs


    If a stair extends multiple stories (i.e. levels) in a building, Revit has a feature
    which will support this in some cases (but not all). When a stair is selected,
    click the Select Levels command on the Ribbon while in an elevation view—from
    here you select levels to extend the stair to. This really only works with straight
    run or U-shaped stairs (aka switchback stair).


    In the image below (Figure 5-1.9), there are triple-run (left) and double-run
    (right) stairs. As a side note, thetriple-run stair might be used to minimize
    required floor space, but requires enough vertical distance between floors as
    two of the runs overlap and can create headroom issues. When using the Multi-Story
    Stair feature in this case, the double-run will work, but the triple-run will
    not.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_157_0.png)


    FIGURE 5-1.9 Two stair designs between level 1 and level 2


    If the Multi-Story Stair feature is used on these two cases, we see the result
    in Figure 5-1.10. Because the stair is essentially arrayed vertically, and the
    triple-run starts and ends on the same side, we see a major issue. However, the
    double-run stair works correctly.'
  merge: -1
