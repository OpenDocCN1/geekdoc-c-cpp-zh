  md: '# Commercial Design Using Autodesk Revit 2018


    Because the parameters vary between stair types, it is often not a simple task
    to select a stair of one type (e.g. Assembled) and switch it to another (e.g.
    Monolithic) via the Type Selector. The biggest issue is an assembled stair has
    the option to end with a riser or a tread, but monolithic and precast stairs can
    only end with a tread. The stair needs to be modified or recreated from scratch
    to switch between types.


    To see the difference between the End with Riser versus End with Tread options,
    compare Figure 5-1.2c, which is set to end with riser, with Figure 5-1.4 set to
    end with tread. In this example, the “end” is the top and each option is common
    in construction. The ‘end with riser’ option is used if the stair stops right
    at the floor edge. The ‘end with tread’ option is used when the stair ends a distance
    away from the main floor and something similar to a landing is added to fill in
    the gap.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_153_0.png)


    This image is another view of the stair and railing design shown at the beginning
    of this section. The railings at the level 2 floor edge are separate elements
    from the railings hosted to the stair.'
