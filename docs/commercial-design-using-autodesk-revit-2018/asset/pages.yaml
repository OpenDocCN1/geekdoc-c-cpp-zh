  md: '# Commercial Design Using Autodesk 2018


    Given the two examples, Ramp, Floor, it is generally preferred to use a Floor
    rather than a Ramp. Now we will look at how to create a sloped floor.


    There are four ways to make a floor slope:


    +   - Sketch line defines slope

    - Sketch line defines constant height (preferred for existing conditions)

    - Slope Arrow in sketch mode

    - Shape Editing (generally avoid for simple ramps)


    A sketch line, when selected, can be set to Defines Slope on the Options Bar (Figure
    5-12). For a ramp, only one edge needs to be set to Defines Slope. Once Defines
    Slope is selected, the Slope parameter may be modified; e.g. 1"/12".


