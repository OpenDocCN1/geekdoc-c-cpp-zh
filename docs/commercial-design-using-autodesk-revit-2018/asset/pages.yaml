  md: '# Commercial Using Autodesk Revit 2018


    Next you will add stairs to your East and West shafts. Revit provides a powerful
    Stair tool that allows you to design stairs quickly with various constraints predefined
    (i.e., "7" maximum riser).


    # Type Parameters


    Before you draw the stair it will be helpful to review the options in the stair
    family.


    +   1. Open ex4-3.rvt and Save As ex5-7.rvt.

    2. From the Project Browser, expand the Families -> Stairs -> Stair (i.e., click
    the plus sign next to these labels).

    3. Right-click on the stair 7" max riser 11" tread, and select the Type Properties
    option from the pop-up menu.


    You should now see the options shown in Figure 5-7.1.


    Take a couple minutes to see what options are. You will quickly review a few below.


    +   - Tread: depth of tread in the plan view

    - Nosing Length (Depth): Treads are typically 12" deep (usually code.) and 1"
    of that depth overlaps the next stair. This overlap is called the nosing.

    - Riser: This provides Revit with the maximum dimension allowed (code, or if you
    want it, less). The actual dimension will depend on the floor-to-floor height.

    - Stringer: These dimensions vary per stair depending on the stair width, and
    materials, to name a few. A structural engineer would provide this information
    after designing the stair.

    - Cost: Estimating placeholder.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_215_0.png)


    FIGURE 5-7.1 Stair type properties


