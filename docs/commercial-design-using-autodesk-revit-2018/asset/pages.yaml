  md: '# Insert Windows


    Adding Windows to your project is very similar to adding doors. Like the doors,
    the template

    file you started from has one family preloaded into your project, the FIXED family.
    Looking

    at the Type Selector drop-down you will see the various sizes available for insertion.
    At this

    point you should also see the SIDELIGHT family that you loaded in the previous
    exercise.

    First, you will add a few interior borrowed lights using the sidelight family.


    # Interior Windows (Borrowed Lights)


    +   1. With the Window tool selected,

    pick Sidelights 1: 18" x 84" from

    the Type Selector.


