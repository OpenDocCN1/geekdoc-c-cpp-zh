    > TIP: Mirror the windows in plan view, each floor.


    12. Save your Project as ex8-2.rvt.


    | TIP: ENTERING DIMENSIONS IN REVEIT

    As your experience with Revit grows, you will want to learn some of the shortcuts
    to using the program. One of those shortcuts is how you enter dimensions when
    drawing. You probably already know, maybe by accident, if you enter only one number
    (e.g., 48) and press enter, Revit interprets that number to be feet (e.g., 48''-0'').
    So, if you want to enter 48", you may be typing 0''-48" or 48''. Both work, but
    having to press the Shift key to get the symbol takes a little longer.


    Here are some options for entering dimensions:

    | 0 48 | Revit reads as 48" (zero space forty-eight) |

    | 48 | Revit reads as 48''-0" |

    | 5.5 | Revit reads as 5''-6" |

    | 0 5.5 | Revit reads as 5 1/2" |

    | 2 1/4 | Revit reads as 2''-0 1/4" (two space zero space fraction) |'
