  md: '# Lesson 8.

    INTERIOR AND EXTERIOR ELEVATIONS:


    This lesson will cover interior and exterior elevations. The default template
    you started with already has the four main exterior elevations set up for you.
    You will investigate how Revit generates elevations and the role the elevation
    tag plays in that process. You will also be introduced to a feature called Design
    Options.


    # Exercise 8-1:

    Creating and Viewing Exterior Elevations


    Here you will look at setting up an exterior elevation and how to control some
    of the various options.


    # Setting Up an Exterior Elevation


