    your project.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_125_0.png)


    FIGURE 3-5-2. Open doors on hard drive


    +   4. Open the **Doors** folder and then select **Curtain Wall Dbl Glass.rfa**,
    and then click **Open (Figure 3-5-2)**


    +   5. Repeat steps 2 – 4 to load the following (online) door families:


    +   a. Double-Glass 1

    nb. Sidelights

    c. Single-Glass 1


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_125_1.png)


    +   6. In the **Project Browser**, expand *Families* and *Doors* to see the loaded
    door families (Figure 3-5-3).


    If you expand a door itself in the **Project Browser** you will see the predefined
    door sizes associated with that family. Right-clicking on a door size allows you
    to rename, delete or duplicate it. To add a door size you duplicate them and modify
    properties for the new item.


    Next you will insert the doors into the stair shafts.


    FIGURE 3-5-3. Loaded door families'
