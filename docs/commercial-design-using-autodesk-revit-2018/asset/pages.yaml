  md: '# FLOOR PLAN (Second and Third Floors)


    Notice the walls, doors and interior windows are now copied to Level 2 (Figure
    4-1.5). We still need to copy the exterior windows and the elevator door.


    Also, notice that the new doors have different numbers (note: you will only have
    tags on level 2 if they were selected in the copy / paste) while the interior
    windows have the same number. Why is this? It relates to industry standards for
    architectural documentation. Each interior window that is the same size and configuration
    is the same type number throughout the project (this is a Type Parameter). Each
    door has a unique number because doors have so many variables as locks, hinges,
    closer, panic bar, material, and fire rating (this is an Instance Parameter).
    To make doors easier to find, many architectural firms will make the door number
    by selecting the room number door opens into. You can change the door number by
    selecting the door tag and clicking on the text. The door schedule will be updated
    automatically.


    +   14. Using the same techniques described in the previous steps, copy the exterior
    windows and elevator door to Level 2.


    TIP: You will need to ungroup your windows (grouped with array) before copying
    them. Select one of the windows and pick the unroup button on the Ribbon.


    Why not draw these interior walls 36''-0" high like the exterior walls and elevator
    shaft?


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_138_0.png)


    Simulating real-world construction is ideal for several reasons. Mostly, you can
    be sure shafts align from floor to floor when the shaft is one continuous wall.
    Although the toilet and atrium interior walls align, they do not necessarily have
    to be because they are separated by floor construction; this allows one floor
    to be modified later easily.


