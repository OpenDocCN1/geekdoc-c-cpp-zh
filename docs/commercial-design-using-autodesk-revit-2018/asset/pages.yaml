    16. Switch to 3D view to see your sidewalk (Figure 13-1.10). Notice the 2D lines
    sketched in the site plan view have been projected down onto the surface of the
    3D object!


    Note that the shade and render material is still the same as the main ground surface.
    You will learn how to change this in a moment.


    When you select the Toposurface and click Edit Surface on the Ribbon you can select
    existing points and edit their elevation to refine the surface.


    +   17. In the 3D view, select the sidewalk Subregion.


    +   18. In the Properties Palette, set the Material to Concrete – Cast-in-place
    concrete.


    +   19. Set the main site element''s Material to Site – Grass.


    +   20. Make sure the Visual Style for your 3D view is set to Shaded so you can
    see the “shaded” version of the materials.


    > TIP: Set via View Control bar.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_462_1.png)


    Figure 13-1.10 3D view with sidewalk


    That concludes this overview of the site tools provided within Revit. You now
    have everything modeled in your project so you can start to develop rendered images
    of your project for presentations.'
