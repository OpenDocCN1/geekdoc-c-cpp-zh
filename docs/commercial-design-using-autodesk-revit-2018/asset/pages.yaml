  md: '# Commercial Using Autodesk Revit 2018


    When you select the Model Line tool, Revit will ask you what plane you want to
    draw on (Figure 11-2.7). This will allow Revit to restrict all your line work
    to a particular plane. You would not know exactly at what depth the lines would
    be drawn on.


    +   15. Pick a Plane (Figure 11-2.7) and then pick the wall in the elevation view
    (use the TAB key and make sure the tool lists the wall before picking the plane).


    TIP: If you are prompted to switch to a different view, you selected the wrong
    plane. Click cancel and try again.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_425_0.png)


    16. Draw the line, and snap to the endpoint of the base cabinet toe kick.


    FYI: The main difference between the Model Line tool on the Architecture tab and
    the Detail Line tool on the Annotate tab is this any line work drawn with the
    Model Line tool will show up on other views which see that surface. On the other
    hand, any line work drawn with the Detail Line tool will only show up in the view
    in which they were created. So in this example, you may want to draw the lines
    using the Detail Line tool so the base does not show up in building and wall sections.
    Do not change this at this time however.


