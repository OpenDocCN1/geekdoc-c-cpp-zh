  md: '# FLOOR SYSTEMS and REFLECTED CEILING PLANS


    Creating the second and third floors will be a little more involved than was the
    first floor. This is because the upper floors require several openings. For example,
    you need to define the openings for the elevator, the stair shafts and the atrium
    space. Revit makes the process very simple however.


    You should still be in the Floor tool.


