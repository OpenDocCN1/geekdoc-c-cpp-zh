  md: '# Hip Roof


    The various roof forms are largely defined by the “Defines slope” setting. This
    is displayed in the Options Bar while the Roof tool is active. When a wall is
    selected and the “Defines slope” option is selected, the roof above that portion
    of wall slopes. You will see this more clearly in the examples below.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_236_0.png)


    +   8. Switch to the T.O. Masonry Floor Plan view.

    9. Select the Architecture -> Build -> Roof (down-arrow) -> Roof by Footprint
    tool.

    10. Set the overhang to 2’-0” and make sure Defines slope is selected (checked
    on the Options Bar.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_236_1.png)


    +   11. Select the four walls of the West building, clicking each wall one at
    a time.


    > TIP: Make sure you select towards the exterior side of the wall; notice the
    review line before clicking.


    +   12. Click Finish Edit Mode (i.e., the green check mark) on the Ribbon to finish
    the Roof tool.


    +   13. Click Yes to attach the roof to the walls.


    +   14. Switch to the South elevation (Figure 6-3.3).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_236_2.png)


    Figure 6-3.3 South elevation – Hip roof


    You will notice that the default wall height is much higher than what we ultimately
    want. However, when the roof is drawn at the correct elevation and you attach
    the walls to the roof, the walls automatically adjust stop under the roof object.
    Additionally, if the roof is raised or lowered later, the walls will follow; you
    can try this in the South elevation view by simply using the Move tool. REMEMBER:
    You can make revisions in any view.'
