  md: '# Commercial Design Using Autodesk 2018


    ☑ Defines slope Overhang: 2'' 0" ☑ Extend to wall core


    As you can see from the previous examples, you would most often have to Extend
    to wall (core) selected while sketching a roof because it would not typically
    make sense to position the roof based on the outside face of brick or the inside
    face of gypsum board for commercial construction.


    Even though you may prefer to Extend to wall (core) selected, you might like to
    have a 2''-0" overhang relative to the face of the brick or move rather than the
    exterior face of concrete block. This can be accomplished in one of these:


    +   (A) You can modify the overhang, while sketching the roof, to include the
    wall thickness that occurs between the wall and face of core: 2''-0" + 9/4" =
    2''9/4"". See the image to the right.


    +   (B) The second option is to manually edit the sketch lines. You can add dimensions
    while in Sketch mode, select the sketch line to move, and then edit the dimension.
    The dimension can also be Locked to maintain the roof edge position relative to
    the wall. When you finish the sketch dimensions are hidden.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_247_0.png)


    # Energy Truss


    In addition to controlling the roof overhang, you might also want to control the
    roof properties to accommodate an energy truss with what is called an energy heal,
    which allows for more insulation directly directly over the wall.


    To do this would use the Extend into wall (core) + Truss option described above
    and then set the Base Offset from Level 1''-0" (for a 1''-0" energy heal). See
    the image and the Properties Palette shown on the next page.


    6-28'
  merge: -1
