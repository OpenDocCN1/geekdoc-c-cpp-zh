    A Revit project can only reference one keynote file. The location to this file
    is defined in the Keynotes Settings dialog (Figure 5-9.7) via Annotate → Keynotes.


    Secondly, every model-based element in Revit has a Keynote type parameter (Figure
    5-9.8). Editing this field opens the Keynotes dialog (Figure 5-9.9), which is
    a list based on the aforementioned external text file.


    Third, use the Element Keynote tool to “tag” an element based on the predefined
    keynote value.


    Fifth, create a Keynote Legend and place it on any sheets with keynot views.


