  md: '# Reference material: Roof position relative to wall


    The remaining pages in this chapter are for reference only and do not need to
    be done to your model. You are encouraged to study this information so you become
    more familiar with the Roof tools much.


    The following examples use a brick and concrete wall example. The image below
    shows the Structure properties for said wall type. Notice the only item within
    the Core Boundary section is the Masonry — Concrete Block (i.e., CMU) which is
    7/8" thick (nominally 8"). Keep this in mind as you read through the remaining
    material.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_244_0.png)


    The following examples will show you how to control the position of the roof system
    relative to the wall below, both vertically and horizontally. The roof properties
    that dictate its position basically involve relationships between three things:
    the Level Datum, the exterior Wall System and the bottom edge of the Roof System.
    There are several other properties (e.g., pitch, construction, fascia, etc.) related
    to the roof that will not be mentioned at the moment so the reader may focus on
    a few basic principles.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'The examples on this page have a sloped roof sketched with Extend into wall
    (to core) enabled and the Overhang set to 2''-0". Because Extend into wall (to
    core) was selected, the bottom edge of the roof is positioned relative to the
    Core Boundary of the exterior wall rather than the finished face of the wall.
    See the discussion about the wall''s Core Boundary on the previous page.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_245_0.png)


    # Revit Roof Properties under Consideration


    **Extend Into Wall: (To Core)** This option was checked on the Options Bar while
    sketching the roof.


    **Rafter Or Truss:** This option is an Instance Parameter of the roof object;
    the example on the above left is set to Rafter and the other is set to Truss.


    > NOTE: The Extend into wall (to core) option affects the relative relationship
    between the wall and the roof, as you will see by comparing this example with
    the one on the next page.


    **Base Level:** Set to Level 2: By associating various objects to a level, it
    is possible to adjust the floor elevation (i.e., Level Datum) and have doors,
    windows, floors, furniture, roofs, etc., all move vertically with that level.


    **Base Offset: From Level** Set to 0''-0"; This can be a positive or negative
    number which will be maintained even if the level moves.'
