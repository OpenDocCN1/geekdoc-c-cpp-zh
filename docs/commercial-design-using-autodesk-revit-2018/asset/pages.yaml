  md: '# Replacing a Text Type


    In addition to replacing content within a text element, there is a way to replace
    the text type as well. For example, some imported details use a different font
    and you want everything to match and be. This is not really associated with the
    Find/Replace tool, but it is important to know how to accomplish this task.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_332_0.png)


    This procedure will replace all the text in the current view or the entire project.
    Even text which has been hidden with the "Hide in View" right-click option will
    be changed.


    When a specific text type is selected, the selection count, in the lower right
    corner of the Revit window, will indicate the total number of elements selected
    (Figure 9-1.22). This can be used as a quick check before replacing the text type.
    For example, if the intent was to just replace a few text instances but the count
    was several hundred, this would be a clue that some other view uses this type
    and perhaps should not be changed as it was created by someone else on the project.
    This can be especially true if multiple disciplines are working in the same project.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_332_1.png)


    Figure 9-1.21 Select all instances via right-click


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_332_2.png)


    Figure 9-1.22 Total element selected count'
