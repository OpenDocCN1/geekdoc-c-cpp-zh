  md: '# Commercial Design Using Autodesk 2018


    # Reflected Ceiling Plan Symbols:

    Revit provides many of the industry standard symbols necessary in drawing reflected
    ceiling plans (RCP). As shown in Figure 7-3.5, supply air is represented with
    an X and return air a diagonal line. It is typical to have a RCP symbol legend
    showing each symbol and material pattern and list what each represents.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_271_0.png)


    # Component Properties

    If you want to adjust the properties of a component, such as a light fixture,
    you can browse to it in the Project Browser and click on it (notice the right
    click menu also has the option to select all instances of the item in the drawing)
    and select Properties. You will see the dialog for the 2x4 (2 Lamps).


    You can also click duplicate and add more sizes (e.g., 4x4'' light fixture).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_271_1.png)


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_271_2.png)


    FIGURE 7-3.5 RCP; rotated lights


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_271_3.png)


    You can also select an inserted component and review the Properties Palette for
    additional properties for that particular instance.


    FIGURE 7-3.6 RCP; mechanical


    It should be pointed out that, in professional practice, the mechanical and electrical
    design is often created in a separate model and then linked into the architectural
    model.


    7-22'
