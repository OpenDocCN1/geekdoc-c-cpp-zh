  md: '# Duplicating a Material


    It is important to know how to properly duplicate a Material in your model so
    you do not unintentionally affect another Material. The information on this page
    is mainly for reference and does not need to be done in your model.


    If you Duplicate a Material in your model, the Appearance Asset will be associated
    with the new Material AND the Material you copied it from! For example, in the
    first image (right), we will right-click on Carpet (1) and duplicate it. Before
    we duplicate it, the Appearance Asset named "RED" is not shared (arrow #3).


    Once you have duplicated a Material, notice the two carpets in this example (second
    image), now they share the same Appearance Asset. Changing one will affect the
    other. Click the Duplicate asset icon in the upper right (arrow #3).


    Once the Appearance Asset has duplicated (third image), you can expand the information
    section and rename the asset. You can now make changes to this material without
    affecting other materials.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_480_0.png)


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_480_1.png)


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_480_2.png)'
