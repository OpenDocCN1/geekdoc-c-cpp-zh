  md: '# Sloped Floor:


    An alternative to using the Ramp tool is to use the Floor tool and adjust it to
    slope.


    First we will look at the results of creating the same "ramp" as in the previous
    example. This Floor element can have multiple "Layers" of construction, including
    a separate surface finish. Additionally, we can apply a Spot Elevation and/or
    Spot Slope annotation as desired. The plan-view below has a Spot Slope element
    applied to indicate the slope and direction (Figure 5-5.10).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_208_0.png)


    FIGURE 5-5.10 Sloped floor element added between two floors


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_208_1.png)


    FIGURE 5-5.11 Sloped floor shown in section - joined to adjacent flat floor


    As seen in the section above, the sloped floor joins nicely with the adjacent
    flat floor elements to create a continuous monolithic look that is common in this
    situation (Figure 5-5.11). Note that the Join command is used to achieve this
    look.


    The only limitation to using a Floor rather than a Ramp is that a Railing cannot
    be added automatically. However, a Railing can be manually added and hosted to
    the floor.'
