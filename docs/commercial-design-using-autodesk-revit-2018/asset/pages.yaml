    # # Properties Palette – Element Selector


    The Properties Palette provides instant access to settings related to the element
    selected or about to be created. When nothing is selected, it shows information
    about the current view. When multiple elements are selected, the common parameters
    are displayed.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_29_0.png)


    The Element Selector is an important part of the Properties selected. Whenever
    you are adding elements or have them selected, you can select from this list to
    determine how a wall will be drawn, or how a wall previously drawn should look
    (see image to). If a wall needs to change, you never delete it and redraw it;
    you select it and pick a new type from the Type Selector.


    The Selection Filter drop-down list within the Type Selector lets you know the
    type and quantity of the elements currently selected. When multiple elements are
    selected you can narrow down the properties for just one element type, such as
    wall. Notice the image to show four walls are in the current selection set.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_29_1.png)


    Walls (4) will cause the Palette to show only Wall Properties even though many
    other elements are selected (and remain).


    The width of the Properties Palette and the center column position can be adjusted
    by dragging over the area. You may need to do this at times to see all the information.
    However, making the Palette too wide will reduce the usable area.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_29_2.png)


    The Properties Palette should be left open; if you accidentally close it you can
    reopen it by View -> Window -> User Interface -> Properties or by typing PP on
    the keyboard.


