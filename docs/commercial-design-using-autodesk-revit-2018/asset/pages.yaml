    # Create and Modify Dimension Types


    Sometimes it is necessary to modify a dimension to match a graphically firm standard
    or a client requirement. Revit allows all dimensions of that type to be created
    and modified. Use caution changing dimension type as that will be updated in the
    current project. These changes will not have effect on any other projects or templates.


    To modifying types, either start the dimension command and click Edit Type or
    select one of the "Types" options in the extended panel area of the dimension
    panel on the Annotate tab (Figure 9-2.16).


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_345_0.png)


