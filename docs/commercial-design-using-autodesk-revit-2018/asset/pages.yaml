  md: '# Commercial Design Using Autodesk Revit 2018


    # Creating topography in Revit


    +   1. Open file 12-3.rvt and Save-As 13-1.rvt.


    +   2. Switch to the Site plan view.


    +   a. Adjust the category visibility so your view matches Figure 13-1.1. Also,
    set the Detail Level to Fine. Hide elevation and section tags.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_457_0.png)


    Here you will basically see what appears to be a roof plan view of your project
    (Figure 13-1.1). This view has the visibility set such that you see the project
    from above and the various “site” categories turned on so they are automatically
    visible unless they are created. Next you will take a quick look at the View Range
    for this view so you understand how things are set.


    +   3. Make sure nothing is selected and a command is not active by clicking the
    Modify tool. This will ensure you have access to the View Properties via the Properties
    Palette.


    +   4. In the Properties Palette, scroll down and select Edit next to View Range.


    Here you can see the site is being viewed from 200'' above the first floor level,
    so your building/roof will have to be taller than that if it were “cut” like a
    floor plan. The View Depth could be a problem here: on a steep site, the entire
    site will be seen if it passes through the View Range. However, items completely
    below the View Range will not be visible.


    | Primary Range | | Offset |

    | :--- | :--- | :--- |

    | Top: | Associated Level (Level 1) | 200'' 0" |

    | Cut plane: | Associated Level (Level 4) | 200'' 0" |

    | Bottom: | Level Below | 0'' 0" |

    | View Depth | | |

    | Level: | Level Below | 0'' 0" |


    FIGURE 13-1.2 Site view range settings


    13-4'
