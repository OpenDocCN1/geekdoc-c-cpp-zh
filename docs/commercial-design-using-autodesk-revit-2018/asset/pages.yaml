  md: '# Lesson 6

    ROOF:


    This lesson will look at some of the powerful options and tools for designing
    a roof for your building. You will also add skylights.


    # Exercise 6-1:

    Hip Roof


    The first step is to create a floor plan view at the roof level, at the top of
    your exterior masonry wall. This will create a working plane, called a level datum,
    for the *Roof* tool.


    # Add Level Datum


    +   1. Open ex5-7.rvt and Save As ex6-1.rvt.

    2. Open the **South** elevation view.

    3. Select **Architecture -> Datum -> Level** tool from the *Ribbon*.

    4. Draw a *Level* datum at the top of the exterior wall, at elevation 36''-00";
    see the wall properties. Draw the datum "line" so both ends *align* with the other
    datum "lines" below it.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_220_0.png)


    Next, you will rename the level datum. By default Revit will name the level based
    on the previous level created, plus 1. Thus, the new level should be named "Level
    4". You will change this name so you (and others working on the same project)
    know it is the top of the masonry view and not another floor in the building.


    +   5. Press **Esc** or select **Modify** from the *Ribbon*.

    6. Now select the level datum you just drew (click on the line).

    7. With the level datum selected, click on the *[level name]* text to rename the
    level.

    8. Change the level to **T.O. Masonry** (Figure 6-1.1).


    *FYI: T.O. means "Top Of."*'
