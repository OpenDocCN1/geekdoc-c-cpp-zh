  md: '# Exercise 5-5:

    Ramps and Sloped Floors


    When two floors do not align vertically, or accessibility is required, a ramp
    must be provided. There are two main ways to model this in Revit. One is with
    the Ramp tool and the other is with the Floor tool. For the most part the Ramp
    tool should never be used. Rather, the Floor tool should be preferred as it generally
    works better as we see here.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_204_0.png)


    # The Ramp Tool:

    First we will review how the ramp works and then talk about its limitations.


    The ramp tool is closely related to the original Stair by Sketch tool in how it
    works. Starting at the lower level in a plan-view, when the Ramp is started, Sketch
    mode is entered and the Run option is selected on the Ribbon. First, verify the
    Base Level and Top Level properties are set correctly—determines the required
    horizontal distance. Picking points on the screen define the center of the ramp
    (Figure 5-5.1). Based on the Ramp Max Slope setting the required length, in plan,
    is listed. Landings are automatically added between gaps as shown in the two images
    below (Figure 5-5.1 and 5.2). The sketch lines can be modified if needed. For
    example, maybe one side of the ramp runs along an angled or curved wall.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_204_1.png)


    6'' inclined ramp created, 6'' remaining


    FIGURE 5-5.1 Ramp sketch mode; indicates length required based on vertical distance


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_204_2.png)


    12'' of inclined ramp created, 0'' remaining


    FIGURE 5-5.2 Ramp sketch mode; sketch complete with landing'
