  md: '# Calculate Tread/Riser Size


    Although Revit automatically calculates the rise and tread dimensions for you,
    it is still a

    good idea to understand what is happening.


    The riser is typically calculated to be as large as allowable by building codes
    will. Occasionally, a

    grand stair will have a smaller riser to create a more elegant stair.


    Similarly, the tread is usually designed to be as small as allowable by building
    codes. This

    author worked on the design of a ski chalet where the treads were deeper than
    required by

    code for the comfort of those wearing ski boots in the building.


    The largest and shortest tread create the steepest stair allowed. This takes up
    less floor

    space; see the next image. A stairway that is too steep is uncomfortable and unsafe.


    Building codes vary by location; for this exercise, you will use 7" (max.) for
    the risers and 12"

    (min.) for the treads (11" tread plus a 1" nosing).


    Codes usually require that each tread be the same size in a single run; likewise
    with


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_156_0.png)


    To calculate the number and size of the risers:


    +   Given:

    Risers: 7" max.

    Floor to floor height: 13''-4".


    Calculate the number of risers:

    13''-4 divided by 7" (or 160") divided by 7") = 22.857


    So you need 23 risers that are 6 15/16" each.'
  merge: -1
