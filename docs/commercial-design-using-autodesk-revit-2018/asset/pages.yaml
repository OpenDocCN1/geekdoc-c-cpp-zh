  md: '# Exercise 5-3:

    Stair by Component


    The Stair by Component tool was created in Revit to deal with some limitations
    inherent with the Stair by Sketch tool. At first glance, this tool works in a
    similar way to the Stair by Sketch tool; for example, start the command and pick
    two points to create a single-run stair. The resulting stair, for Steel Pan Stair,
    even looks exactly the same. However, as we dig deeper we find differences.


    # Stair Types


    When the Stair by Component command is selected, the Type Selector lists three
    options (Figure 5-3.1); this example is based on the Commercial-default template.
    At this point it is helpful to compare these three options with their corresponding
    in the Project Browser under Families - marked with #2, “stair,” contains everything
    related to the older Stair by Sketch command. The remaining items are the “components”
    for this newer stair tool. These components are selected within the properties
    of the three main options highlighted here.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_167_0.png)


    FIGURE 5-3.1 Type Selector:

    Stair by Component tool active


    FIGURE 5-3.2 Family\Sairs

    in Project Browser


    # Stair Component Types


    To see how a Stair by Component type, listed above, makes use of the component
    types take a look at the Type Properties for the “Steel Pan Stair” in Figure 5-3.3.
    The selected component types, which have been highlighted, each can be seen in
    the Project Browser as shown in Figure 5-3.4, also highlighted.'
