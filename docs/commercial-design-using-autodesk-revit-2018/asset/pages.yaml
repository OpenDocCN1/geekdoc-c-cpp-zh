  md: '# Commercial Design Using Autodesk Revit 2018


    +   * Starts at an introductory level

    * Project based tutorials design an office building from start to finish

    * Includes access to nearly 100 video tutorials

    * Bonus material covers Insight 360, finding missing elements and much more

    * Helps you prepare for the Autodesk Revit Architecture Certification Exam


    Commercial Design Using Autodesk Revit 2018 is designed for the architectural
    student using Revit 2018. The intent is to provide you with a well-rounded knowledge
    of tools and techniques for use in both school and industry. This text takes a
    project based approach to learning Revit''s architectural tools in which you develop
    a three story office building. Each book also includes access to nearly 100 video
    tutorials designed to further help you master Autodesk. General building codes
    and industry conventions are covered in a way that is applicable to the current
    exercise.


    The first two chapters are intended to get you familiar with the user interface
    and many of the common menus and tools of Revit 2018. A small office is created
    in chapter two to show you how easy it is to get started using Autodesk Revit.
    By the end of chapter two you will be excited and prepared to take on a much larger
    project.


    Throughout the rest of the book you develop a three story office building. The
    drawings start with the floor plans and develop all the photo-realistic renderings
    like the one on the top of this book. In these chapters many of the architectural
    tools and features of Revit 2018 are covered in greater detail.


    # Description


    # Table of Contents


    +   1. Getting Started with Autodesk Revit 2018

    2. Quick Start: Small Office

    3. Floor Plan (First Floor)

    4. Floor Plans (Second & Third Floors)

    5. Vertical Circulation

    6. Roof

    7. Floor Systems & Reflected Ceiling Plans

    8. Interior & Exterior Elevations

    9. Annotation

    10. Sections & Details

    11. Interior Design

    12. Schedules

    13. Site and Rendering

    14. Construction Documents Set

    15. Introduction to Revit Content Creation

    16. Introduction to Phasing and Worksharing Index


    # About the Videos


    # Also Available


    Access to nearly 100 videos, almost five hours of content, is also included with
    your purchase of this book. These videos break down each topic into short videos
    so that you can easily navigate to a specific aspect of tool or feature in Autodesk
    Revit. This makes the videos both a powerful learning tool and convenient video
    reference. This makes it easy to see the menu selections and make learning Revit
    straightforward and simple. It''s like having the author by your side showing
    you exactly how to use all the tools in Autodesk Revit.


