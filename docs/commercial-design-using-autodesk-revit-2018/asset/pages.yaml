- img_proc: true
  md: '# Spot Elevation - Dimension


    Use this tool to indicate the elevation of a surface.


    +   Steps to add a Spot Elevation dimension:

    * Review Type Selector and Options Bar

    * Select the reference

    * Click to place the location of the text and leader


    The elevation listed is based on one of three options as listed below. This is
    a Type Property called Elevation Origin. Thus, it is possible to use all three
    options, even right next to each other.


    Elevation Origin options for a Spot Elevation type:


    +   * Project Base Point

    * Survey Point

    * Relative


    Project Base Point:

    This option is related to the level datum numbers in the project. For example,
    the default templates which come with Revit Level 1 at elevation 0''-0". In this
    example, all Spot Elevations set to Project Base Point will be relative to 0''-0"
    within a project.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_340_0.png)


    Survey Point:

    The Survey Base point is an alternate coordinate system used to align with the
    actual position on earth and elevation above sea level. Thus, any Spot Elevation
    set to the Survey Point will display a value relative to the Survey Point settings.
    For example, where the Level 1 floor''s Project Base Point is set to 0''-0" (or
    100''-0") the Survey value for Level 1 might be 650''-0" to match the elevation
    numbers shown for the contours on the Civil Engineer''s grading plan. Revit has
    the ability to track both coordinate systems within the context of the Spot Elevation
    tool.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_340_1.png)


    Relative:

    When a Spot Elevation has the Elevation Origin set to Relative, the values listed
    are related to the plan view in which they are placed.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_340_2.png)'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Commercial Design Using Autodesk Revit 2018


    Spot Coordinate

    Use this tool to indicate the North/South, East/West position of a point with
    the model.


    +   Steps to add a Spot Coordinate dimension:

    * Review Type Selector and Options Bar selections

    * Select the reference point

    * Click to place the location of the text and leader


    This feature can be used to indicate the position of one, or, more, corners of
    the building on the site. This is usually relative to a predefined Survey Point
    which is relative to a bench mark or municipal coordinate system. On a typical
    commercial project this information is only provided on the civil drawings and
    therefore not required in the Revit model or documents.


    N 65'' - 4 1/4"

    E -279'' - 9 3/4"


    Similar to the Spot Elevation tool, the Spot Coordinate can also be set to Relative
    or Project Base Point. This could be used to position items within the project,
    but is not practice in many cases as the contractor or installer would need to
    have a direct line of sight between the two points.'
