  md: "# Graphic Controls\n\nThere are a number of ways to manage the visibility of\
    \ Stairs and Railings in Revit. For the most part, these options apply to all\
    \ stairs and railings regardless of which tool was used to create them. \n\nObject\
    \ Styles (project wide settings)\n\nThe highest level of graphic control in a\
    \ Revit project is **Manage → Object Styles** (Figure 5-1.7). Here, one can specify\
    \ the line thickness and color for the various parts of a Stair (same for Railings).\
    \ For Stairs and Railings, these settings only apply if there are no view specific\
    \ overrides or filters. Tip: Compare the terms listed to the previous images.\n\
    \nVisibility/Graphic Overrides (view specific settings)\n\nThe graphics of Stairs/Railings\
    \ can also be controlled on a view by view basis via the **Visibility/Graphics\
    \ Overrides** dialog (Figure 5-1.8); while in a view, type **VV**. For example,\
    \ maybe a Demolition plan or Code plan should show less detail...this can be achieved\
    \ just in those views."
