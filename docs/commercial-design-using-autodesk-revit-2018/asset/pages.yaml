  md: '# Radius - Dimension


    Use this tool to indicate the radius of an arc or circular reference. This can
    be the edge of a floor, wall, duct or detail lines.


    +   Steps to add a Radius dimension:

    - Review Type Selector and Options Bar selections

    - Select the reference

    - Click to place the location of the dimension line and text


    By default, the Radius dimension extends to the center point of the arc or circle.
    If a plan view is cropped, and Annotation Crop is active for the view, the center
    point must be visible within the cropped area.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_339_0.png)


    Once the Radius is placed, the radius dimension can be selected and the grip at
    the center point can be repositioned closer to the arc. Additionally, it is possible
    to turn off the Center Mark symbol via the Type properties. In in some cases the
    location of the center mark itself should be dimensioned so the contractor can
    accurately position the element within the building.


    # Diameter - Dimension


    Use this tool to indicate the diameter of an arc or circular reference. This can
    be the edge of a floor, wall, duct or detail lines.


    +   Steps to add a Diameter dimension:

    - Review Type Selector and Options Bar selections

    - Select the reference

    - Click to place the location of the dimension line and text


    # Arc Length - Dimension


    Use this tool to measure the length of a line along a curved reference. This can
    be the edge of a floor, wall, duct or detail lines.


    +   Steps to add an Arc Length dimension:

    - Review Type Selector and Options Bar selections

    - Select the reference

    - Click to place the location of the dimension line and text'
  merge: -1
