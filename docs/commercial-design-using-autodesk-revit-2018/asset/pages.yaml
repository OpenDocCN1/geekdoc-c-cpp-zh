  md: 'Parking Component: These are parking stall layouts that can be copied to quickly
    layout lots. Several types can be loaded which specify both size and angle.


    Site Component: Items like benches, dumpsters, etc. that are placed directly on
    the Toposurface at the correct elevation at the point picked.


    Label Cont: Adds an elevation level to the selected contours.

    FYI: Contours are automatically created based on the Toposurface.


    # Site Settings:


    The Settings dialog controls a key project wide settings to the site – is a brief
    description of these settings.


    The Site Settings is accessed from the arrow link in the lower-right corner of
    the Model Site panel. You should note that various tools under the Settings affect
    the entire project, not just the current one.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_456_0.png)


    Contour Line Display: This controls if the contours are displayed when the Toposurface
    is visible (via the check box) and at what interval. If the Interval is set to
    1’-0” you will see contours that follow the ground’s surface and each line represents
    a vertical change of 1’-0” from the adjacent contour line (the contours alone
    do not tell you which direction the surface slopes in plan view – this is where
    contour labels are important). This is useful because architects usually base
    the first floor of the building on elevation 0''-0” (or 100’-0”) and the surveyors
    and Civil Engineers will use the distance above sea level (e.g. 100.2’). So this
    feature allows the contours to be reconciled between the two systems. The Additional
    Contour section allows for more “contour detail to be added within a particular
    area (vertically) – on a very large site you might want 1’-0” contours only on
    the building and 10’-0” contours everywhere else. However, this works if the building
    is in a distinctive set of vertical elevations. If the site is relatively level
    or an adjacent area shares the same set of contours you will have undesirable
    results.


    Section Graphics: This area controls how the earth appears when it is shown in
    section (e.g. exterior elevations, building walls, all sections, etc.). Here is
    the pattern selected appears in section (the pattern is selected from the project
    “materials”) similar to the process for selecting the pattern to be displayed
    with a pattern when viewed in section).


    Elevation of poche base: Controls the depth of the pattern in section views relative
    to the grade line.


    Property Data: This section controls how angles and lengths are displayed for
    information property lines.'
  merge: -1
