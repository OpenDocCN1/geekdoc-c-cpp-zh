    # Keynote Manager + Add-in for Revit


    One challenge with maintaining the keynote system in Revit is the text file can
    only be edited by one person at a time. Also, after changes are made, the changes
    must be manually reloaded (note the Reload button on the Keynotes Settings dialog)
    to see the changes in the current session of Revit (9-5.12).


    Using Keynote Manager +, a third-party add-in for Revit, can help. This tool has
    the following features:


    +   * Multiple users

    * Auto reload

    * Spellcheck

    * Indicates keynotes used in project (with house icon)

    * Auto sequencing

    * Add comments and links

    * URL links


