  md: '# Sketching Stair Layouts


    When the Stair by Sketch tool is selected, Revit enters Create Stairs Sketch mode.
    First you set the Base Level and Top Level, this determines how many treads and
    risers are. Next, beginning your stair, the first pick is the bottom. The default
    sketch mode is "Run.". This mode allows you to pick two points and let Revit automatically
    create the Riser and Boundary lines. The distance between the points you pick
    determines how many treads and risers are created. Picking two points far enough
    apart will create a single run stair that extends from floor to floor.


    The following three images show how a simple single-run stair is drawn.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_160_0.png)


    After picking your first pick, move your cursor until the on-screen text (near
    your first pick) says "0 REMAINING," and then click your second point. You will
    see the Horizontal or Vertical alignment line before clicking your second point,
    if it is to be so aligned.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_160_1.png)


    The Riser and Boundary lines may be manipulated at this point; e.g., move the
    boundary line to make the stair wider, or rotate it to make it follow an angled
    wall, or you can even rotate a single riser, maybe for a stage?


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_160_2.png)


    Click Finish Edit Mode (i.e., green checkmark) creates the stair. Note that a
    railing is added by default to both sides and the cut symbol is added relative
    to the view''s Cut Plane (via View Range).'
