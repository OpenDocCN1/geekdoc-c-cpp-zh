  md: '# Check Spelling


    Revit has a tool which allows the spelling to be checked. Keep in mind this only
    works on text created with the Text command and only for the current view. Revit
    cannot check the spelling of text in keys, tags or families. Neither can it check
    the entire project.


    The Spell Check tool can be found on the Annotate tab or on the Ribbon when text
    is selected. When Spell Check is selected, the dialog to the right appears if
    there are any misspellings found (Figure 9-1.18).


    When Revit finds a word not in the dictionary it will provide a list of possible
    correct words. Often the first suggestion is the right one. If not, select from
    the list.


    Clicking the Change button will correct the highlighted word. Clicking Change
    All will change all of the words with this same misspelling in the current view.


    Revit will flag a word that is not misspelled. This might be a company name, your
    name, a product name or an industry abbreviation. In this case one might select
    the Add option to add the word to the custom dictionary so you don''t have to
    deal with this every time you run spell check.


    The image to the right shows the settings related to the Spell Check engine. The
    options are self-explanatory. In an office, consider placing the custom dictionary
    on the server and point all users to it.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_330_0.png)


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_330_1.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Find/Replace


    Revit has a tool which allows words to be found or replaced within a view. Keep
    in mind only this works on text created with the Text command. Revit cannot find
    or replace text in keynotes, tags or families. Unlike the spelling tool, this
    tool can search the entire project.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_331_0.png)


    When this tool is selected to the right the dialog appears (Figure 9-12).


    In this example. The current view is being searched for a brand name, Sheetrock,
    so it can be replaced with the generic industry term, Gypsum Board.


    Selecting Entire project and then clicking Find All lists all matches in the middle
    section of the dialog. For each row, you can click to select and see the context
    word(s) is used in.


    When items are found, the Replace or Replace All buttons can be used to swap out
    the text in one location or all. When clicking Replace, only the selected row
    is replaced.


    This tool can be used to just find something and not replace it. For example,
    on a large project with hundreds of views in the Project Browser, using the Find/Replace
    to search for the details with the word “roof drain” can significantly speed up
    the process of locating the desired drawing.'
  merge: -1
  pgno: 331
