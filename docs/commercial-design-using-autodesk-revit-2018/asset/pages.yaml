  md: "# Basic Stair and Railing Terminology\n\nFirst, let's define some terms related\
    \ to stairs and railings in Revit. These terms generally correspond to real-world\
    \ architecture/construction terminology. However, the main goal is to define the\
    \ terms in the context of Revit.\n\n![](img/4073edcc0429f9f91fbab44bbfc885a7_147_0.png)\n\
    \nFIGURE 5-1.1a Basic Railing    FIGURE 5-1.1b Basic Stair\n\n+   - Revit Stair\
    \ Element\n    - Run: a continuous section of stairs, consisting of Risers and\
    \ Treads, between main floor levels and/or landings.\n    - Tread: the flat horizontal\
    \ part you step on.\n    - Riser: the vertical portion that fills the gap between\
    \ the treads. Not all stairs have risers.\n    - Nosing: the outer edge, where\
    \ the riser and tread come together.\n    - Landing: intermediate horizontal surface\
    \ (i.e. floor) between the main floor of a building. Building codes require a\
    \ landing if a stair “run” rises more than a certain distance—which allows someone\
    \ to have a safe place to rest.\n    - Supports (aka Stringer): the structural\
    \ elements supporting the treads and risers. For a commercial project this is\
    \ typically a steel tube or C-channel. A stair typically has a stringer on each\
    \ side of the stair. For wider stairs, one or more stringers may be required.\
    \ They either span between floors (e.g. Level 1 up to Level 2) or may be anchored\
    \ to an adjacent wall."
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Vertical Circulation\n\n+   - Cut Marks: In a 2D plan view, the stair is\
    \ where it intersects the view's cut plane—an angled line is added to graphically\
    \ cut off the stair. This allows space below the stair to be seen.\n- Stair Path\
    \ (Annotation)\n  - Down/Up arrows: in a 2D plan view, the arrow graphically indicates\
    \ the stairs ascend or descend. The arrow is typically used in conjunction with\
    \ text (see next definition).\n  - Down/Up Text: Text used in conjunction with\
    \ arrows to make clear which the stairs are going, which would be difficult to\
    \ determine without looking at other views (e.g. sections) which a printed set\
    \ of drawings may not contain (e.g. a small remodel project)\n  - FYI: The Arrow\
    \ and Text are added automatically to a new stair but can be deleted. The Stair\
    \ Path tool exists, on the Annotation tab, if they need to be added to the model.\n\
    - Tread Number (Annotation): This tool, on the Annotation tab, places a sequence\
    \ of numbers along a stair “run” indicating the total number of risers or treads.\n\
    \n+   - Revit Element\n  - Balusters: vertical elements extending from floor or\
    \ up to “top rail.” For commercial projects, building codes state that a 4” sphere\
    \ cannot pass through a railing system. FYI: Balusters are not needed if glass\
    \ panels are used.\n  - Handrails: continuous rounded element, attached to a wall\
    \ or balusters with a “support,” along a floor edge, a ramp or stair “run” which\
    \ allows someone to place their hand on prevent falling.\n  - Guardrail: a taller\
    \ railing system, which may include a handrail, to prevent falling from a stair\
    \ or floor edge. FYI: In the USA, when a guardrail is required it must be at least\
    \ 42 inches tall.\n  - Supports: bracket used to attach handrail to wall or balusters.\n\
    \  - Top Rails: continuous rail at the top of the railing system—supported by\
    \ balusters.\n\n# Plan View Representation of Stairs\n\nIn Revit plan views, Stairs\
    \ and their hosted Railings are not shown as true 3D elements cut by the stair's\
    \ cut plane. Rather, they are a hybrid 2.5D representation which follows traditional\
    \ architectural graphic standards for floor plans. An example of this can be seen\
    \ in Figure 5-1.2a. Notice all parts of the stair and railing extend to the Cut\
    \ Mark. Contrast this with Figure 5-1.2b which is a true 3D view of the same stair;\
    \ the railing is hardly visible and there is no cut mark. The cut plane for both\
    \ examples is 3’-0” as seen in Figure 5-1.2c."
  merge: -1
