    # Precast Stair


    When the various parts of a stair are manufactured off-site with concrete and
    then shipped to the job site, the Precast Stair type can be used to properly represent
    this special condition (Figure 5-1.6). Notice the special notches which are used
    to interconnect and support the individual parts. This stair type can also have
    Rebar added to it. FYI: This stair type can only be created using the Stair by
    Component command.


