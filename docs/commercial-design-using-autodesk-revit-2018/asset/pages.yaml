    # Stringer Conditions


    Revit offers limited control over the stringer shape. For example, it can only
    be rectangular shaped— but you can adjust the size. There are other ways of modeling
    a stringer; you can hide the built-in stringer and add a channel shaped stringer
    to the railing system''s bottom edge, or model it separately.


    You can modify the start and end positions of the stringer. This is often required
    to match the design developed by the structural engineer or stair fabricator.
    Often, the stringer extends to a beam or floor edge. Here is how that does...


