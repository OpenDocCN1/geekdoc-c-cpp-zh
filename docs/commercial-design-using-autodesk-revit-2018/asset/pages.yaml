- img_proc: true
  md: '![](img/4073edcc0429f9f91fbab44bbfc885a7_248_0.png)


    Many other properties and techniques exist which one can use to develop the roof
    for a project, things like the Rafter Cut and Fascia Depth which control the fascia
    design. Also, you can apply a sweep to a roof edge to add 1x fascia board around
    the building. These are intermediate to advanced concepts and will not be covered
    here.


    This concludes the study of the Roof tool!


