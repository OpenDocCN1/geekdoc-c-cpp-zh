  md: '# Commercial Design Using Autodesk Revit 2018


    # Lesson 5


    # Vertical Circulation:


    In this chapter Revit''s Stair, Railing and Ramp tools will be covered. This can
    be one of the most challenging features in Revit given the vast variety in the
    world when it comes to stairs and railings. These tools have some limitations
    and cannot accommodate all situations. In these cases, one might have to use In-Place
    families and model a highly customized stair and/or railing.


    The first few “exercises” will provide a basic introduction to the stair and railing
    tools in Revit. There are no required steps for the law office project in these
    sections. However, it is highly recommended that this information be reviewed
    prior to completing the steps required later in this chapter.


    # Exercise 5-1:

    Introduction to Stairs and Railings


    Prior to getting into the details, this first section will provide a broad overview
    of Stairs and Railings in Revit.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_146_0.png)


    This image is a photorealistic rendering of a stair and railing modeled in Revit.
    This example is from the author’s Interior Design Using Autodesk Revit textbook.
    Notice the railing occurs on both sides of all three “runs” of stairs and along
    the [second] floor edge.'
