  md: '# Lesson 7

    FLOOR SYSTEMS and REFLECTED CEILING PLANS:


    In this lesson you will learn to create floor structures and reflected ceiling
    plans.


    Even though you currently have floor levels defined, you do not have an object
    that represents the mass of the floor systems. You will add floor systems with
    holes for stairs, elevators, and the atrium.


    Ceiling systems allow you to specify the ceiling material by room and the height
    above the floor. Once the ceiling has been added it will show up in section views
    (sections are created later in this book).


    Exercise 7-1:

    Floor Systems


    Similar to other Revit elements, you can select from a few pre-defined system
    families. You can also create new types.


    # Level 1, Slab on Grade


    Sketching floors is a lot like sketching roofs (Lesson 5); you can select walls
    to define the perimeter and draw lines to fill in the blanks and add holes (cut-outs)
    in the floor element.


    +   - Open ex6-2.rvt and Save As ex7-1.rvt.

    - Switch to the Level 1 floor plan view.

    - Select Architecture -> Build -> Floor (down-arrow) -> Floor: Architectural.

    - Click Edit Type on the Properties Palette.

    - Select type Generic – 12" from the Type drop-down list at the top.

    - Click Duplicate to start a new floor type.

    - Type 6" Slab on Grade, then OK.

    - Click the Edit button next to the Structure Parameter.


    ![](img/4073edcc0429f9f91fbab44bbfc885a7_250_0.png)'
