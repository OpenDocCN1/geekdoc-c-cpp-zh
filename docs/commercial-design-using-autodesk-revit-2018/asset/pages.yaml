  md: "# Exercise 3-2:\nExterior Walls\n\nYou will begin the first floor plan by drawing\
    \ the exterior walls. Like many projects, early on you might not be certain what\
    \ the exterior walls are going to be. So, we will start out using the generic\
    \ styles. Then we will change them to a custom style (that you will create) once\
    \ we have decided what the wall construction is.\n\n# Adjust Wall Settings\n\n\
    +   - Start a new project using the **Architectural Template**. *Warning:* Be\
    \ sure to select the correct template as this is the basis for the remainder of\
    \ the book.\n\nThe previous chapter started with a more complete template. This\
    \ chapter starts from the default template so you have the opportunity to learn\
    \ how to create things as the room finish schedule so better understand how Revit\
    \ works.\n\n+   - Select the **Wall** tool from the Ribbon and make the following\
    \ changes to the wall options (Figure 3-2.1):\n  - Wall style: *Basic Walls Generic\
    \ - 12”*\n  - Height: *Unconnected*\n  - Height: *3’ 0”*\n  - Location Line: *Finish\
    \ Face: Exterior*\n  - Chain: *Checked*\n\n![](img/4073edcc0429f9f91fbab44bbfc885a7_104_0.png)\n\
    \n# Draw the Exterior Walls\n\n+   - Draw the walls shown in Figure 3-2.2. Make\
    \ sure your dimensions are correct. Use the **Measure** tool to verify your dimensions.\
    \ Do not add the dimensions.\n\n> NOTE: If you draw in a clockwise fashion, your\
    \ walls will have the exterior side of the wall correctly positioned. You can\
    \ also use the spacebar to toggle which exterior face is on."
