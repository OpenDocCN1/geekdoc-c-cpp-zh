    # Exterior Windows


    14. Using the methods previously covered in this book, create a new window size
    in the FIXED family. Create Fixed: 32" x 48". You are creating this new size to
    fit coursing in the plan view. The largest window (preloaded) that fits coursing
    in the plan view is 24".


    15. Adjust the sill height for your new window size to fit within coursing as.
    Set the sill height for Fixed: 32" x 48" to be 3''-4" (Figure 3-5.8).


