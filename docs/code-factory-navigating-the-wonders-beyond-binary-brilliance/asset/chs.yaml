  \n## 程序 5.1：求数字的各位数字之和](#contents.xhtml_sc2_626a)\n\n求一个数字的各位数字之和。例如，如果数字是 `2134`，则\
  \ `sum = 10`。\n\n### 示例输入输出](#contents.xhtml_sc3_627a)\n\n测试用例 #1：\n\n输入：输入一个数字：78\n\
  输出：数字的各位数字之和为 15\n\n测试用例 #2：\n\n输入：输入一个数字：204874\n输出：数字的各位数字之和为 25\n\n### 算法](#contents.xhtml_sc3_628a)\n\
  \n要运行上述程序，需要遵循以下步骤：\n\n1. 开始\n2. 变量声明：`m`, `s`, `r`\n3. 读取 `m`\n4. `s=0`\n5. 迭代直到\
  \ `m>0`\n6. `r=m%10`\n7. `s=s+r`\n8. `m=m/10`\n9. 打印(\"Sum of digits of the number\
  \ is:\",s)\n10. 停止\n\n### 流程图](#contents.xhtml_sc3_629a)\n\n图 5.1 以流程图的形式展示了程序：\n\
  \n![](img/5.1)\n\n图 5.1：说明程序的流程图\n\n### Python 代码](#contents.xhtml_sc3_630a)\n\n\
  Python 代码如下：\n\n```python\nm = int(input(\"Enter a number: \"))\ns = 0\nwhile m\
  \ > 0:\n    r = m % 10\n    s = s + r\n    m = m // 10\nprint(\"Sum of digits of\
  \ the number is:\", s)\n```\n\n### Python 解释](#contents.xhtml_sc3_631a)\n\n此 Python\
  \ 程序计算各位数字之和。它提示用户输入一个数字。它初始化变量 `s` 为 0 来存储和。它进入一个循环，使用 `%` 运算符反复提取 `m` 的最右侧数字，将其加到和\
  \ `s` 中，然后使用地板除 `//` 从 `m` 中移除该数字。循环持续到没有更多数字为止。最后打印数字的各位数字之和。\n\n### C 代码](#contents.xhtml_sc3_632a)\n\
  \nC 代码如下：\n\n```c\n#include <stdio.h>\nvoid main() {\n    int m, s, r;\n    printf(\"\
  Enter a number: \");\n    scanf(\"%d\", &m);\n    s = 0;\n    while (m > 0) {\n\
  \        r = m % 10;\n        s = s + r;\n        m = m / 10;\n    }\n    printf(\"\
  Sum of digits of the number is: %d\", s);\n}\n```\n\n### C 解释](#contents.xhtml_sc3_633a)\n\
  \n该 C 程序如下。它从用户处获取一个数字。它初始化变量 `s` 为 0 来存储和。它进入一个循环，使用 `%` 运算符提取 `m` 的最右侧数字，将其加到和\
  \ `s` 中，然后使用除法运算符 `/ 移除该数字。与 Python 不同，`/` 运算符用于整数除。\n\n## 程序 5.2：反转数字](#contents.xhtml_sc2_634a)\n\
  \n反转一个 `n` 位数字。例如，如果数字是 `2134`，则反转数字为 `4312`。\n\n### 示例输入输出](#contents.xhtml_sc3_635a)\n\
  \n测试用例 #1：\n\n输入：输入一个数字：1234\n输出：反转数字为 4321\n\n测试用例 #2：\n\n输入：输入一个数字：8720\n输出：反转数字为\
  \ 278\n\n### 算法](#contents.xhtml_sc3_636a)\n\n要运行上述程序，需要遵循以下步骤：\n\n1. 开始\n2. 变量声明：`n`,\
  \ `s`, `r`\n3. 读取 `n`\n4. `s=0`\n5. 迭代直到 `n>0`\n`rem=n%10`\n`s=s*10+rem`\n`n=n/10`\n\
  1. 打印(\"The reversed number is:\",s)\n2. 停止\n\n### 流程图](#contents.xhtml_sc3_637a)\n\
