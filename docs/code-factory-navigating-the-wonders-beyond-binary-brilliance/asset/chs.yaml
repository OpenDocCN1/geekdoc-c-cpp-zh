  \ `n` 项后停止。\n\n## 结论\n本章以流程图、算法和代码的形式讨论了简单的控制语句 `while` 循环和 `for` 循环。\n\n## 注意事项\n\
  - 在 `while` 循环中，循环计数器应该在循环开始前初始化。\n- 在 `for` 循环中，提到了初始化、条件和递增。\n- 在 `while` 循环中，循环计数器需要在循环内部进行递增。\n\
  - 在 Python 代码中，循环块应该向右缩进。\n- 在 C 代码中，循环块应该包含在 `{}` 中。\n- 在 `while` 循环中，条件可以是 `i\
  \ < 0`。\n- 在 `for` 循环中，条件可以是 `i <= n`。\n\n### \n1. 显示前几个数字。\n2. 求...的和。\n3. 从用户处接受数字。\n\
