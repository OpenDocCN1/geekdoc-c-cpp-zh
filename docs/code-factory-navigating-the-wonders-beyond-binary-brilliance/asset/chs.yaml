  \n图 1.17: 演示程序 1.16 的流程图\n\n### Python 代码\n程序 1.16 的 Python 源代码如下：\n\n```python\n\
  # 从用户处读取浮点类型输入\ni=float(input(\"Enter height in inches \"))\n# 将英寸转换为英尺和英寸\nf=i//12\n\
  inch = i%12\n# 在屏幕上输出结果\nprint(\"Your height is \", f, \" feet\", inch, \"in\")\n\
  ```\n\n### Python 代码解释\n此 Python 程序在变量 `i` 中接收以英寸为单位的高度并将其转换为英尺和英寸。它通过使用整数除运算符 `//`\
  \ 将 `i` 除以 12 来计算高度中的整英尺数，并将结果存储在变量 `f` 中。\n\n然后，它通过使用模运算符 `%` 计算 `i` 除以 12 的余数（剩余英寸），并将结果（余数）存储在变量\
  \ `inch` 中。还需要注意，转换为英尺和英寸的过程没有四舍五入，因此输出可能包含英寸的小数部分。\n\n### C 代码\n程序 1.16 的 C 源代码描述如下：\n\
  \n```c\n#include<stdio.h>\n\nvoid  main()\n{\n    int i, in, f;\n    printf(\"Enter\
