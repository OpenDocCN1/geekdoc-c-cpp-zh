  \ Python 和 C 编程语言编写代码时使用复杂控制语句的能力。通过示例代码，用户可以获得实践经验。\n\n## 程序 4.1：求和并检查奇偶性\n\n如果前\
  \ n 个自然数的和为偶数，则显示 EVEN（偶数）；否则显示 ODD（奇数）。\n\n### 样例输出](#contents.xhtml_sc3_461a)\n\
  \n测试用例 #1：\n\n输入：输入数字：7\n\n输出：EVEN\n\n测试用例 #2：\n\n输入：输入数字：5\n\n输出：ODD\n\n### 算法](#contents.xhtml_sc3_462a)\n\
  \n要运行上述程序，需要遵循以下步骤：\n\n1. 开始\n2. 读取 n\n3. `i=1`\n4. `s=0`\n5. 如果 `i<=n` 则重复\n6.\
  \ `s=s+i`\n7. `i=i+1`\n8. 如果 `s%2==0`\n9. 打印 \"EVEN\"\n10. 否则\n11. 打印 \"ODD\"\n\
  12. 停止\n\n### 流程图](#contents.xhtml_sc3_463a)\n\n图 4.1 以流程图的形式展示了程序：\n\n![](img/Figure_4.1.jpg)\n\
  \n图 4.1：程序 4.1 的流程图\n\n### Python 代码](#contents.xhtml_sc3_464a)\n\n该程序的 Python 代码如下：\n\
  \n```python\nn=int(input(\"Enter a number \"))\ni=1\ns=0\nwhile(i<=n):\n    s=s+i\n\
  \    i=i+1\n    #end of while loop\nprint(\"The sum is \",s)\nif(s%2==0):\n    print(\"\
  EVEN\");\nelse:\n    print(\"ODD\");\n```\n\n### Python 代码解释](#contents.xhtml_sc4_465a)\n\
  \nPython 代码接收输入数字 `n`，计算从 1 到 `n` 的数字和，然后判断和是偶数还是奇数。\n\n在输入数字后，变量 `i` 初始化为 0 以控制循环迭代。然后，变量\
  \ `s` 初始化为 0。该变量将用于跟踪数字的和。\n\n`while`循环将一直运行到 `i` 达到 `n` 的值。在每次迭代中，`i` 的值加 1。`i`\
  \ 的当前值加到变量 `s` 中，累加数字的和。完成循环后，打印计算出的和并使用模运算符（`%`）检查和 `s` 是偶数还是奇。如果 `s` 除以 2 的余数为\
  \ 0，则和为偶数，否则为奇数。\n\n### C 代码](#contents.xhtml_sc3_466a)\n\n该程序的 C 代码如下：\n\n```c\n\
  #include<stdio.h>\nvoid main()\n{\n    int i, n;\n    int s=0;\n    printf(\"Enter\
  \ a numbers: \");\n    scanf(\"%d\", &n);\n    i=1;\n    while(i<=n)\n    {\n  \
  \      s=s+i;\n        i=i+1;\n    }\n    if (s%2==0)\n    {printf(\"EVEN\");}\n\
  \    else\n    {printf(\"ODD\");}\n}\n```\n\n### C 代码解释](#contents.xhtml_sc4_467a)\n\
  \nC 代码接收输入数字 `n`，计算从 1 到 `n` 的数字和，然后判断和是偶数还是奇数。\n\n在 `main` 函数内部，声明并初始化了局部变量。变量\
  \ `i` 初始化为 0 以控制循环迭代。然后，变量 `s` 初始化为 0。该变量将用于跟踪数字的和。然后，从用户处读取一个整数输入并存储在变量 `n` 中。\n\
  \n`while`循环将一直运行到 `i` 达到 `n` 的值。在每次迭代中，`i` 的值加 1。`i` 的当前值加到变量 `s` 中，累加数字的和。这计算了从\
  \ 1 到 `n` 的数字和。循环完成后，打印出计算出的和。并使用模运算符（`%`）检查和 `s` 是偶数还是奇数。如果 `s` 除以 2 的余数为 0，则和为偶数，否则为奇数。\n\
  \n## 程序 4.2：显示奇数\n\n显示范围 `n` 到 `m` 之间的奇数（包含 `n` 和 `m`）。\n\n### 样例输出](#contents.xhtml_sc3_469a)\n\
  \n测试用例 #1：\n\n输入：输入数字：2\n\n输出：3 5\n\n测试用例 #2：\n\n输入：输入数字：2\n\n输出：3 5 7 9\n\n###\
  \ 算法](#contents.xhtml_sc3_470a)\n\n要运行上述程序，需要遵循以下步骤：\n\n1. 开始\n2. 读取 n, m\n3. `i=n`\n\
  4. 如果 `i<=m` 则重复\n5. 如果 `i%2!=0`\n6. 打印 `i`\n7. `i=i+1`\n8. 停止\n\n### 流程图](#contents.xhtml_sc3_471a)\n\
  \n图 4.2 以流程图的形式展示了程序：\n\n![](img/Figure_4.2.jpg)\n\n图 4.2：程序 4.2 的流程图\n\n### Python\
  \ 代码](#contents.xhtml_sc3_472a)\n\n该程序的 Python 代码如下：\n\n```python\nn=int(input(\"\
  Enter a number \"))\nm=int(input(\"Enter a number \"))\nfor i in range(n,m+1):\n\
