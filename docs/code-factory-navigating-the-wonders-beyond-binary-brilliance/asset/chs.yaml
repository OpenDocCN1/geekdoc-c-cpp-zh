  \ 来计算三个等值分数，并使用 `print()` 函数将它们打印出来。\n\n### C 代码\n\n下方提供了程序 1.7 的 C 源代码：\n\n```c\n\
  #include <stdio.h>\n\nint main() {\n    int n, m;\n    printf(\"Enter numerator:\
