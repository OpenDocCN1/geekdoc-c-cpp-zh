  \n### Python 代码\n\n该程序的 Python 代码如下：\n\n```python\nn=int(input(\"Enter a number:\
  \ \"))\ni=1\nwhile(i<=n):\n  print(i*i)\n  i=i+1\n```\n\n### Python 代码解释\n\n此代码从用户处获取一个整数输入，将其存储在变量\
  \ `n` 中，然后使用 `while` 循环计算并打印从 1 到 `n` 每个数字的平方。每个平方都打印在新的一行。循环从 1 迭代到 `n`（包含 n），每次迭代后\
  \ `i` 增 1。\n\n### C 代码\n\n该程序的 C 代码如下：\n\n```c\n#include<stdio.h>\nvoid main()\n\
  {\n  int i, n;\n  printf(\"Enter a number: \" );\n  scanf(\"%d\", &n);\n  i=1;\n\
  \  while(i<=n)\n  {\n  printf (\" %d\", i*i);\n  i=i+1;\n  }\n}\n```\n\n### C 代码解释\n\
  \n此 C 代码从用户处获取一个整数输入，将其存储在变量 `n` 中，然后使用 `while` 循环计算并打印从 1 到 `n` 每个数字的平方。每个平方都打印在新的一行。循环从\
  \ 1 迭代到 `n`（包含 n），每次迭代后 `i` 增 1。注意大括号的位置。while 循环大括号内的所有内容将重复，直到条件 `i<=n` 为假。\n\n\
