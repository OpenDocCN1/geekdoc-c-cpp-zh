  \n图 2.17：说明程序 2.17 的流程图\n\n# 第 3 章：简单循环\n\n## 引言\n（引言内容）\n\n## 结论\n本章通过流程图、算法和编码讨论了决策语句。通过几个示例，展示了不同的条件语句。\n\
  \n在下一章中，将通过大量的求解程序来讨论控制流语句（循环）。\n\n## 注意事项\n- 比较值时，使用双等号 (`==`)。\n- 在 Python 中，缩进决定了代码块。\n\
  - 在 C 中，单行代码块不需要特殊处理。\n- C 中的多行代码块应包含在花括号 `{}` 内。\n- `if` 块中的 `if` 语句被称为嵌套 if else\
  \ 语句。\n- 使用 `if-else if-else` 语句可以检查多个选项。\n- 逻辑运算符 `&&` / `||` 允许我们在单个 if 语句中组合多个条件。\n\
  - 在编写代码时，应仔细决定检查条件的顺序。\n\n## 练习\n1. 使用 `if` 语句编写程序，检查用户输入的数字是否能被 4 整除。\n...（后续练习）\n\
  \n\n\n\n在本章中，我们将讨论基本的循环语句：`while-loop`（while 循环）和 `for-loop`（for 循环）。在编程中，循环是一种基本的控制结构，允许你在满足特定条件时重复执行一段代码。循环对于自动化重复任务、遍历某些语句以及高效地执行各种计算任务至关重要。它还可以优化代码。大多数编程语言都有不同类型的循环，但主要的两种类型是\
  \ `while-loops` 和 `for-loops`：\n\n- `While-loop`：只要指定的条件求值为为真，`while` 循环就会重复执行一段代码。循环将一直运行，直到条件变为假。循环计数器在\
  \ `while-loop` 开始之前进行初始化，并在循环内部进行递增。\n- `For-loop`：当你知道迭代次数时使用 `for` 循环。它允许你遍历序列（列表、元组、字符串）或取值范围。初始化、递增和条件检查这三个操作都通过单个语句完成。\n\
  \n流程图通过将边缘指向回溯，直到循环条件变为假来展示循环。\n\n## 结构\n\n在本章中总共有 16 个程序，五个子章节对每个程序进行了补充说明：\n\n\
  - 通过包含输入和输出的测试用例理解程序目标。这将让用户理解期望的输入输入类型以及特定程序将产生什么结果。\n- 通过算法理解程序。这将帮助用户理解编写解决程序所需的步骤序列背后的逻辑和方法论。\n\
  - 使用流程图使程序可视化。通过流程图表示可以轻松地理解程序目标。用户将理解在不同程序的流程图表示的各种语文中应使用哪些符号。\n- 每个程序的 Python\
  \ 源代码。为用户提供了每个程序的 Python 源代码，以便用户理解语言的基本操作。同时也对每段代码提供了解释。\n- 每个程序的 C 语言实现。用户可以通过提供的\
  \ C 语言代码及其对每个程序的解释学习 C 语言的基本概念。\n\n## 目标\n\n本章让读者全面理解控制语句及其在程序开发中的重要性。它涵盖了控制语句背后的基本概念，以及它们如何使用循环重复执行指令。此外，本章传授了使用流程图对程序流中的控制语句进行可视化的技能，有助于更清晰直观地掌握其功能。\n\
  \n此外，本章侧重于实际应用，演示了如何在 Python 和 C 编程语言中实现控制语句（`for-loop` 和 `while-loop`）。提供了示例代码以提供实践经验，让读者能够练习并增强在现实编码场景中有效利用循环的信心。到本章结束，读者将获得在编程中使用控制语句的知识和技能。\n\
  \n## 程序 3.1: 显示 '*'\n\n显示 n 次 `*`。\n\n### 示例输入输出\n\n测试用例 #1：\n输入：输入一个数字: 3\n输出：`*\
  \ * *`\n\n测试用例 #2：\n输入：输入一个数字: 6\n输出：`* * * * * *`\n\n### 算法\n\n运行上述程序需要以下步骤：\n\n\
  步骤 1. 开始\n步骤 2. 输入 `n`\n步骤 3. `i=1`\n步骤 4. 如果 `i <= n` 则重复：\n`print \"*\"`\n`i=i+1`\n\
  步骤 5. 停止\n\n### 流程图\n\n[图 3.1] 以流程图的形式展示了程序：\n\n![](img/Figure_3.1.jpg)\n\n图 3.1：说明程序\
  \ 3.1 的流程图\n\n### Python 代码\n\n该程序的 Python 代码如下：\n\n```python\nn=int(input(\"Enter\
  \ a number: \"))\ni=1\nwhile(i<=n):\n    print(\"*\", end=\" \")\n    i=i+1\n```\n\
  \n### Python 代码解释\n\n这段 Python 代码提示用户输入一个数字，并使用 `input()` 函数读取用户的输入。输入最初被处理为字符串，因此我们使用\
  \ `int()`将其转换为整数并存储在变量 `n` 中。变量 `i` 初始化为 1。变量 `i` 用于跟踪当前的迭代。为了重复语句 4 和 5，使用了 `while`\
  \ 循环。如果 `i` 的值小于或等于 `n`，循环将继续执行。\n\n在 `while` 循环内部，此行代码使用 `print()` 函数向控制台打印一个星号（`*`）。参数\
  \ `end=\" \"` 被用于指定在打印星号后添加一个空格，而不是默认的换行符。这意味着每个星号将并排打印在同一行上，而不是每个都在新的一行。\n\n在每次执行\
  \ `while` 块之后，计数器 `i` 增加 1。这是至关重要的，因为确保了循环最终会达到条件 `i<= n` 变为假的点，从而终止循环。\n\n因此，应该注意，并不是反复编写语句\
  \ 4，而是写了一次，`while` 循环帮助重复该语句 `n` 次。\n\n此外，注意代码中的缩进。由于步骤 4 和 5 向右缩进，因此它们都属于 `while`\
  \ 循环的块。\n\n### C 代码\n\n该程序的 C 代码如下：\n\n```c\n#include<stdio.h>\nvoid main() {\n\
  \    int i, n;\n    printf(\"Enter a number: \");\n    scanf(\"%d\", &n);\n    i=1;\n\
  \    while(i<=n) {\n        printf(\"*\");\n        i=i+1;\n    }\n}\n```\n\n###\
  \ C 代码解释\n\n这段 C 代码提示用户输入一个数字 `n` 并使用 `scanf()` 函数读取用户的输入。变量 `i` 是整数类型变量，初始化为 1，用于跟踪循环的迭代次数。然后，它使用\
  \ `while` 循环从 1 到 `n` 打印 `*`。如果 `i` 的值小于或等于 `n`，循环内部的语句将继续重复。注意大括号表示 `while` 循环的块。\n\
  \n## 程序 3.2: 显示自然数\n\n显示前 n 个自然数。\n\n### 示例输入输出\n\n测试用例 #1：\n输入：输入一个数字: 4\n输出：`1\
