  \ `mm` 个学生之间的差异，并找到范围最小的组。\n\n### 程序 6.9：十进制转不同进制\n\n进制系统是数字的可读数学表示。例如，二进制数用于计算机进行运算。八进制数用于操作系统设置。你的任务是从用户处获取一个十进制数和一个所需的进制（2\
  \ 到 9），并将十进制数转换为所需的表示。\n\n例如：\n输入：`5,2`\n输出：`101`\n\n## 样例输出\n\n测试用例 #1：\n输入：`56`\n\
  进制：`2`\n输出：二进制表示为 `111000`\n\n测试用例 #2：\n输入：`97`\n进制：`8`\n输出：八进制表示为 `141`\n\n测试用例\
  \ #3：\n输入：`284`\n进制：`5`\n输出：五进制表示为 `2114`\n\n### 算法\n\n要运行上述程序，遵循以下步骤：\n\n1. 开始\n\
  2. `bina = 0`\n3. `i = 1`\n4. 读取十进制数 `nn`\n5. 读取所需的进制 `bb`\n6. 如果 `bb<2` 或 `bb >\
  \ 9:`\n    1. 显示(\"进制应在 2 到 9 之间\")\n    2. 退出程序\n7. 重复 `nn != 0` :\n    1. `re\
  \ = nn % bb`\n    2. `nn = nn//bb`\n    3. `bina += re * i`\n    4. `i *= 10`\n\
  8. 显示 `nn` 的 `bb` 进制表示为 `bina`\n9. 停止\n\n### 流程图\n\n图 6.9 以流程图的形式展示了程序：\n\n![](img/Figure_6.9.jpg)\n\
  \n图 6.9：展示程序 6.9 的流程图\n\n### Python 代码\n\n程序的 Python 代码如下：\n\n```python\nbina =\
  \ 0\ni = 1\nnn=int(input(\"Enter the decimal number: \"))\nbb=int(input(\"Enter\
  \ the required base: \"))\nif bb<2 or bb > 9:\n    print(\"Base should be between\
