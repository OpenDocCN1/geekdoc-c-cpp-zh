  \ 和 `printf()` 函数从标准输入流接受用户输入并将输出显示到标准输出流。\n8.  在 Python 中，利用 `input()` 函数从标准输入流接受用户输入，利用\
  \ `print()` 函数将输出显示到标准输出流。\n\n# 第 2 章 条件语句](#contents.xhtml_ch2a)\n\n## 引言\n\n某些条件语句的变体例如第一类型仅在条件为真时执行操作。第二类型在条件为真时处理操作\
  \ 1；否则进入操作 2。第三类型在条件 1 为真时执行操作。如果条件 1 为假，则检查条件 2。如果条件 2 为真，则执行操作 2；否则执行操作 3。第四类型要求条件\
  \ 1 和条件 2 同时为真以执行操作 1。如果任何一个条件为假，会导致操作 2。第五类型在条件 1 或条件 2 或两者都真时调用操作 1。然而，如果两个条件都假，则执行操作\
  \ 2。最后类型\n\n在编程中，if-else 语句的组合用于根据特定条件决策。它允许根据给定条件的真假执行代码块。这里的关键字有 `if`、`else-if`、`else`、\
  \ `elif`。\n\n工作原理如下：\n\n*   条件是一个结果为真或假的逻辑表达式。\n*   如果条件为真，则执行 `if` 块中的代码。\n*  \
  \ 如果条件为假，则执行 `else` 块中的代码（如果存在）。\n*   `else` 块是可选的。如果不包含，当条件为假时程序将跳过 `else` 块中的代码。\n\
  *   `if` 和 `else` 块中的代码可以由单个语句或包含在花括号 {}（C 程序）或向右侧缩进（Python 程序）中的多个语句组成。\n*   可以嵌套多个\
  \ if-else 语句来处理更复杂的条件。`else-if`（Python 中的 `elif`）结构也可以在初始条件为假时指定额外的检查条件。\n\n## 结构\n\
