  \ 令 `a` 为矩阵\n3. `bl = 0`\n4. 遍历 `i = 0` 到 `2`\n   遍历 `j = 0` 到 `i - 1`\n   如果 `a[i][j]`\
  \ 不等于 `0`\n   将 `bl` 设置为 `1`\n   跳出内层循环\n5. 如果 `bl` 等于 `0`\n   打印 \"Matrix is upper\"\
  \n   否则\n   打印 \"Matrix is not upper\"\n6. 停止\n\n### 流程图\n\n图 5.10 以流程图的形式说明了程序：\n\
  \n![](img/Figure_5.10.jpg)\n\n图 5.10：程序 5.10 的流程图\n\n### Python 代码\n\n该程序的 Python\
  \ 代码如下：\n\n```python\na = [[1,1,1],[0,1,2],[0,0,1]]\nbl = 0\nfor i in range(3):\n\
  \    for j in range(i):\n        if a[i][j] != 0:\n            bl = 1\n        \
  \    break\n    if bl == 1:\n        break\nif bl == 0:\n    print(\"Matrix is upper\"\
  )\nelse:\n    print(\"Matrix is not upper\")\n```\n\n### Python 代码解释\n\n该 Python\
  \ 代码检查一个矩阵 `a` 是否为上三角。`bl` 初始化为 0。遍历 `i` 从 0 到 2，在内层中遍历 `j` 从 0 到 `i`。如果 `a[i][j]`\
  \ 不等于 0，则将 `bl` 设置为 1 并跳出内层循环。如果 `bl` 为 1，则也跳出外层循环。如果 `bl` 等于 0，则打印“矩阵是上三角”，否则打印“矩阵不是上三角”。\n\
  \n\n\n\n\n### Python 代码\n\n该程序的 Python 代码如下：\n\n```python\na = [[1, 2, 3], [2, 3,\
  \ 4], [3, 4, 6]]\nc = []\nfor i in range(0, len(a[0])):\n    t = []\n    for j in\
  \ range(0, len(a)):\n        t.append(a[j][i])\n    c.append(t)\n    del t\nprint(\"\
  Original Matrix\", a)\nprint(\"Transposed Matrix\", c)\nif a == c:\n    print(\"\
  Symmetric\")\nelse:\n    print(\"not Symmetric\")\n```\n\n### Python 代码解释\n\n该代码检查给定矩阵\
  \ `a` 是否为对称矩阵。对称矩阵是一个关于主对角线元素对称的方阵。换句话说，如果你沿着主对角线折叠矩阵，对角线一侧的元素将与另一侧的元素匹配。初始，矩阵被赋予了一些值。使用嵌套\
  \ `for` 循环创建另一个矩阵，使得 `a` 的行元素变成矩阵 `c` 的列元素。因此，矩阵 `c` 是 `a` 的转置矩阵。现在，如果 `a` 和 `c`\
  \ 相同，则矩阵 `a` 是对称的；否则。\n\n### C 代码\n\n该程序的 C 代码如下：\n\n```c\n#include <stdio.h>\n\
  int main() {\n    int a_s[3][3] = {{5,5,5},{0,5,5},{0,0,5}};\n    int bl = 0; int\
  \ i, j;\n    for (ii = 0; ii < 3; ii++) {\n        for (jj = 0; jj < ii; jj++) {\n\
  \            if (a_s[ii][jj] != a_s[jj][ii]) {\n                bl = 1;\n      \
  \          break;\n            }\n        }\n        if (bl == 1) {\n          \
  \  break;\n        }\n    }\n    if (bl == 0) {\n        printf(\"Matrix is symmetric\
  \ \\n\");\n    } else {\n        printf(\"Matrix is not symmetric \\n\");\n    }\n\
