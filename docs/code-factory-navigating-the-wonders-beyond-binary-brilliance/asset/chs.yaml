  \ 得到\n    printf(\"Equivalent fractions are: %d/%d, %d/%d, %d/%d\\n\", n*2, m*2,\
  \ n*3, m*3, n*4, m*4);\n    return 0;\n}\n```\n\n### C 代码解释\n\n这段 C 代码引导用户输入两个数字\
  \ `n` 和 `m`，代表分数的分子和分母。\n\n它随后通过将分子和分母乘以 2、3 和 4 来计算三个等值分数，并将其打印出来。\n\n## 程序 1.8：使用中间变量交换\n\
  \n使用中间变量交换两个数字。\n\n### 示例输入输出\n\n测试用例 #1：\n\n输入：\n输入分子：65\n输入分母：99\n\n输出：\n等值分数为：99\
  \ 65\n\n测试用例 #2：\n\n输入：\n输入分子：34\n输入分母：123\n\n输出：\n等值分数为：123 34\n\n### 算法\n\n运行程序\
  \ 1.8 提供了以下步骤：\n\n步骤 1\\. 开始\n\n步骤 2\\. 输入分子和分母为 `n` 和 `m`\n\n步骤 3\\. `temp = n`\n\
  \n步骤 4\\. `n = m`\n\n步骤 5\\. `m = temp`\n\n步骤 6\\. 打印 \"Equivalent fractions are:\
  \ \", `n`, `m`\n\n步骤 7\\. 停止\n\n### 流程图\n\n图 1.9 展示了算法流程图：\n\n![](img/Figure_1.8.jpg)\n\
  \n图 1.9：交换两个数字的流程图\n\n### Python 代码\n\n下方提供了程序 1.8 的 Python 源代码：\n\n```python\n\
  #从用户处读取两个整数输入\nn=int(input(\" Enter numerator: \"))\nm=int(input(\" Enter denominator:\
  \ \"))\n#在屏幕上打印输出\ntemp = n\nn = m\nm = temp\nprint(\"Equivalent fractions are:\
  \ \", n, m)\n```\n\n### Python 代码解释\n\n此代码引导用户输入两个数字 `n` 和 `m`。它通过中间变量 `temp` 交换它们的值并最后打印结果。\n\
  \n### C 代码\n\n下方提供了程序 1.8 的 C 源代码：\n\n```c\n#include <stdio.h>\n\nint main() {\n\
  \    int n, m, temp;\n    printf(\"Enter numerator: \");\n    scanf(\"%d\", &n);\
  \ // 从用户处读取整数\n    printf(\"Enter denominator: \");\n    scanf(\"%d\", &m); // 从用户处读取整数\n\
  \    temp = n;\n    n = m;\n    m = temp;\n    printf(\"Equivalent fractions are:\
  \ %d %d\\n\", n, m);\n    return 0;\n}\n```\n\n### C 代码解释\n\n这段 C 代码引导用户输入两个数字 `n`\
  \ 和 `m`。它通过中间变量 `temp` 交换它们的值并最后使用 `printf()` 输出结果。\n\n## 程序 1.9：不使用中间变量交换\n\n不使用中间变量交换用户提供的数字。\n\
  \n### 示例输入输出\n\n测试用例 #1：\n\n输入：\n输入第一个数字：66\n输入第二个数字：99\n\n输出：\n交换后的数字为：99 66\n\n\
  测试用例 #2：\n\n输入：\n输入第一个数字：34\n输入第二个数字：123\n\n输出：\n交换后的数字为：123 34\n\n### 算法\n\n运行程序\
  \ 1.9 提供了以下步骤：\n\n步骤 1\\. 开始\n\n步骤 2\\. 输入两个数字 `n` 和 `m`\n\n步骤 3\\. `n= n+m`\n\n\
  步骤 4\\. `m= n-m`\n\n步骤 5\\. `n= n-m`\n\n步骤 6\\. 打印 \"Numbers after swapping are\
  \ \", `n`, `m`\n\n步骤 7\\. 停止\n\n\n\n\n\n图 1.10 展示了程序 1.9 的流程图：\n\n![](img/Figure_1.10.jpg)\n\
  \n图 1.10：说明程序 1.9 的流程图\n\n### Python 代码](#contents.xhtml_sc3_72a)\n\n以下描述了程序 1.9\
  \ 的 Python 代码：\n\n```python\n#从用户处读取两个整数\nn=int(input(\"Enter first number: \"))\n\
  m=int(input(\"Enter second number: \"))\n\n#在不使用临时变量的情况下交换两个数字\n# 应用了简单的算术运算\nn\
  \ = n+m\nm = n-m\nn = n-m\n\n#在屏幕上打印输出\nprint(\"Numbers after swapping are \", n,\
  \ m)\n```\n\n这段代码从用户获取两个整数，并将分别存储在变量 `n` 和 `m` 中。然后，它在不使用临时变量的情况下交换这些变量的值。\n\n它要求用户输入数字。首先，它将\
  \ `n` 和 `m` 的值相加并将结果赋值给 `n`。然后，它将 `n` 和 `m` 的差赋值给 `m`。由于此时 `n` 包含了原始 `n` 和 `m` 的和，因此\
  \ `m` 现在包含了原始 `n` 的值。\n\n最后，它将 `n` 和 `m` 的差赋值给 `n`。由于 `m` 现在包含了原始 `n` 的值，因此 `n`\
  \ 现在包含了原始 `m` 的值，两个值完成了完成了交换。然后，它打印交换后的值。\n\n### C 代码](#contents.xhtml_sc3_73a)\n\
  \n以下描述了程序 1.9 的 C 代码：\n\n```c\n#include <stdio.h>\nint main() {\n    int n, m, temp;\n\
  \    printf(\"Enter first number: \");\n    scanf(\"%d\", &n); // 从用户处读取一个整数输入\n\
  \    printf(\"Enter second number: \");\n    scanf(\"%d\", &m); // 从用户处读取一个整数输入\n\
  \n    //在不使用临时变量的情况下交换两个数字\n    // 应用了一些简单的算术运算\n    n = n + m;\n    m = n - m;\n\
  \    n = n - m;\n\n### // 在屏幕上打印输出\n    printf(\"Numbers after swapping are %d %d\\\
  n\", n, m);\n    return 0;\n}\n```\n\n### C 代码解释](#contents.xhtml_sc4_74a)\n\n这段\
