  \n拼接两个字符串（不使用函数）。\n\n### 输入输出\n\n测试用例 #1：\n输入：Enter a string: code\nEnter second\
  \ string: factory\n输出：Concatenated string is codefactory\n\n测试用例 #2：\n输入：Enter a\
  \ string: programming\nEnter second string: book\n输出：Concatenated string is programmingbook\n\
  \n## 算法 \n\n运行上述程序，需要执行以下步骤：\n\n1. 开始\n2. 声明变量为 `s1`, `s2`\n3. 读取 `s1`, `s2`\n4.\
  \ `i=0`\n5. `while(s1[i]='\\0')`\n    1. `s3[i]=s1[i]`\n    2. `i=i+1`\n6. `i=0`\n\
  7. `while(s2[i]='\\0')`\n    1. `s3[i]=s2[i]`\n    2. `i=i+1`\n8. `print(s3)`\n\
  9. 停止\n\n### 流程图\n\n[图 4.20] 以流程图的形式展示了程序：\n\n![](img/Figure_4.20.jpg)\n\n图 4.20：说明程序\
  \ 4.20 的流程图\n\n### Python 代码\n\n该程序的 Python 代码如下：\n\n```python\ns1=input(\"Enter\
  \ a String: \")\ns2=input(\"Enter second string: \")\ns3=s1+s2\nprint(s3)\n```\n\
  \n### Python 代码解释\n\n该 Python 代码从用户处获取两个字符串，将其拼接在一起，然后打印结果。在 Python 中，`+` 运算符可以用于字符串。\n\
  \n### C 代码\n\n该程序的 C 代码如下：\n\n```c\n#include<stdio.h>\nvoid main()\n{\n    char\
  \ s1[30], s2[30], s3[60];\n    int i=0, j=0;\n    printf(\"Enter a string: \");\n\
  \    scanf(\"%s\",s1);\n    printf(\"Enter second string: \");\n    scanf(\"%s\"\
  ,s2);\n    while(s1[i]='\\0')\n    {\n        s3[i]=s1[i];\n        i=i+1;\n   \
  \ }\n    j=0;\n    while(s2[j]='\\0')\n    {\n        s3[i]=s2[j];\n        i=i+1;\n\
  \    }\n    printf(\"Concatenated string is %s\",s3);\n}\n```\n\n### C 代码解释\n\n\
  该 C 代码声明了三个字符数组 `s1`、`s2` 和 `s3`，每个可以存储 20 个字符。它从用户处读取两个字符串并存储在 `s1` 和 `s2` 中。`while`\
  \ 循环遍历 `s1` 的每个字符直到遇到空字符 `\\0`，这表示字符串的结束，并将 `s1` 中索引为 `i` 的字符复制到 `s3` 对应的索引 `i`\
  \ 处。同样，另一个 `while` 循环遍历 `s2` 的每个字符直到遇到空字符 `\\0`，并将 `s2` 中索引为 `j` 的字符复制到 `s3` 当前索引\
  \ `i` 处。最后，它使用 `printf` 函数打印存储在 `s3` 中的拼接字符串。\n\n## 总结\n\n本章以流程图、算法和代码的形式讨论了复杂的控制语句（`while`\
  \ 循环和 for 循环）以及条件语句。通过多个示例，展示了循环语句的不同形式。\n\n在下一章中，将通过大量的示例讨论更复杂的程序。\n\n## 注意点\n\n\
  * Python 中的 `range()` 函数生成从低值到上限值减 1 的序列。例如，`range(1,4)` 生成 `1,2,3`。\n\n* Python\
