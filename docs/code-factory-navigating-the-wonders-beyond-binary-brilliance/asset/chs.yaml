  ## 程序 5.5：获取包含质数的列表\n\n从列表 `L2` 创建列表 `L1`，使得 `L1` 包含 `L2` 中所有的质数。\n\n### 示例输入输出\n\
  \n测试用例 #1：\n\n输入：`L2 = [15, 17, 20, 25, 11]`\n\n输出：`L1: [17, 11]`\n\n测试用例 #2：\n\n\
  输入：`L2 = [45,31,17,33,97,118]`\n\n输出：`L1: [31, 17, 97]`\n\n### 算法\n\n要运行上述程序，需要遵循以下步骤：\n\
  \n1. 开始\n2. 声明 `L2 = [45,31,17,33,97,118]`\n3. `L1 = []`\n4. 当 `n` 在 `L2` 中时迭代：\n\
  \    `bl = True`\n    遍历 `i = 2` 到 `n`\n    `if n % i == 0:`\n    `bl = False`\n\
  \    `break`\n    `if bl == True:`\n    `L1.append(n)`\n5. 打印 `L1`\n6. 停止\n\n###\
  \ 流程图\n\n图 5.5 以流程图的形式展示了程序：\n\n![](img/Figure_5.5.jpg)\n\n图 5.5：展示程序 5.5 的流程图\n\
  \n### Python 代码\n\n程序的 Python 代码如下：\n\n```python\nL2 = [45,31,17,33,97,118]\nL1\
  \ = []\nfor n in L2:\n    bl = True\n    for i in range(2, n):\n        if n % i\
  \ == 0:\n            bl = False\n            break\n    if bl == True:\n       \
  \ L1.append(n)\nprint(\"L1:\", L1)\n```\n\n### Python 代码解释\n\n该 Python 代码旨在从列表 `L2`\
  \ 中查找并存储质数到另一个列表 `L1` 中。首先，它初始化列表 `L2` 为 `[45, 31, 17, 33, 97, 118]` 和一个空列表 `L1`。`for`\
  \ 循环遍历列表 `L2` 中的每个元素 `n`。`bl` 是一个布尔变量，在每次迭代之前设置为 `True`。它用于跟踪当前数字 `n` 是否为质数。循环内部启动另一个\
  \ `for` 循环，遍历从 2 到（但不包含）`n` 的数字 `i`。此循环测试 `n` 能否被 2 到 `n-1` 之间的任何数字整除。假设 `n` 被其中任何一个数字整除。在这种情况下，变量\
  \ `bl` 变为假，表示 `n` 不是质数并使用 `break` 语句终止内部循环。在内部 for 循环之后，检查 `bl` 是否仍为 `True`。如果是，说明\
  \ `n` 不能被指定范围内的任何数字整除，因此是一个质数并将其添加到 `L1` 列表中。现在，外层循环继续处理下一个数字。最后，显示 `L2` 中找到的质数。\n\
  \n### C 代码\n\n程序的 C 代码如下：\n\n```c\n#include <stdio.h>\n#include <stdbool.h>\nint\
  \ bl(int nn) {\n    if (nn < 2) {\n        return 0;\n    }\n    for (int ii = 2;\
  \ ii * ii <= nn; ii++) {\n        if (nn % ii == 0) {\n            return 0;\n \
  \       }\n    }\n    return 1;\n}\nint main() {\n    int L2[] = {45,31,17,33,97,118};\n\
  \    int n = sizeof(L2) / sizeof(L2[0]);\n    int L1[n];\n    int c = 0;\n    for\
  \ (int i = 0; i < n; i++) {\n        if (bl(L2[i])) {\n            L1[c++] = L2[i];\n\
  \        }\n    }\n    printf(\"L1 = {\");\n    for (int i = 0; i < c; i++) {\n\
  \        printf(\"%d\", L1[i]);\n    }\n    printf(\"}\\n\");\n    return 0;\n}\n\
  ```\n\n### C 代码解释\n\n此代码声明了一个整数数组 `L2` 并使用 `bl()` 函数检查数组中的每个数字是否为质数。如果是质数，则将其添加到新数组\
  \ `L1` 中。最后，程序打印 `L1`。注意，代码假设 `L2` 的大小为 8（提供的列表大小）。要处理更大的列表，需要修改代码。此程序使用了函数定义（第\
  \ 3-13 行）和函数调用（第 20 行）。`L2` 的每个元素都被传递给函数 `bl()`。该函数检查该元素是否为质数，如果是则返回真。\n\n## 程序\
  \ 5.6：删除重复项\n\n从给定列表中删除重复项。\n\n### 示例输入输出\n\n测试用例 #1：\n\n输入：`[78, 89, 78, 65, 89]`\n\
  \n输出：`[78, 89, 65]`\n\n测试用例 #2：\n\n输入：`[19, 24, 19, 19, 24]`\n\n输出：`[19, 24]`\n\n\
  ### 算法\n\n要运行上述程序，需要遵循以下步骤：\n\n1. 开始\n2. 声明 `my_list = [19, 24, 19, 19, 24]`\n3.\
  \ `new_list = []`\n4. 遍历 `my_list` 中的每个项：\n    `if item not in new_list:`\n    将\
  \ `item` 加入 `new_list`\n5. 打印 `new_list`\n6. 停止\n\n### 流程图\n\n图 5.6 以流程图的形式展示了程序：\n\
  \n![](img/Figure_5.6.jpg)\n\n图 5.6：展示程序 5.6 的流程图\n\n### Python 代码\n\n程序的 Python\
  \ 代码如下：\n\n```python\nmy_list = [19, 24, 19, 19, 24]\nnew_list = []\nfor item in\
  \ my_list:\n    if item not in new_list:\n        new_list.append(item)\nprint(new_list)\n\
  ```\n\n### Python 代码解释\n\n此 Python 代码首先创建一个包含某些重复项的列表，然后创建一个只包含原始列表中唯一项的新列表。`for`\
  \ 循环遍历原始列表中的每个项并检查它是否已在新列表中。如果不在，则使用 `append()` 方法添加到新列表中。最后，将新列表打印到控制台。\n\n###\
  \ C 代码\n\n程序的 C 代码如下：\n\n```c\n#include <stdio.h>\nint main() {\n    int my_array[]\
  \ = {19, 24, 19, 19, 19, 24};\n    int new_array[11];\n    int i, j, n, exists;\n\
  \    n = 0;\n    for (i = 0; i < 8; i++) {\n        exists = 0;\n        for (j\
  \ = 0; j < n; j++) {\n            if (my_array[i] == new_array[j]) {\n         \
  \       exists = 1;\n                break;\n            }\n        }\n        if\
  \ (!exists) {\n            new_array[n] = my_array[i];\n            n++;\n     \
  \   }\n    }\n    for (i = 0; i < n; i++) {\n        printf(\"%d \", new_array[i]);\n\
  \    }\n    printf(\"\\n\");\n    return 0;\n}\n```\n\n### C 代码解释\n\n此代码声明了一个带有重复项的数组\
  \ `my_array`，并创建了一个存储唯一项的新数组 `new_list`。外层循环遍历 `my_array` 中的每个元素，内部循环遍历 `new_list`\
  \ 以检查该项是否已存在。如果没有，则添加到新列表中。\n\n## 程序 5.7：数字排序\n\n将数组中的所有元素按升序排列。\n\n### 示例输入输出\n\
  \n测试用例 #1：\n\n输入：`[6, 3, 25, 1, 22, 11, 90]`\n\n输出：排序后的列表为：`[1, 3, 6, 11, 22, 25,\
  \ 90]`\n\n测试用例 #2：\n\n输入：`[21, 27, 23, 97, 20, 6, 93]`\n\n输出：`[6, 20, 21, 23, 27,\
  \ 93, 97]`\n\n\n\n\n\n![](img/Figure_5.7.jpg)\n\n图 5.7: 程序 5.7 的流程图\n\n### Python\
  \ 代码\n\n该程序的 Python 代码如下：\n\n```python\na_r = [6, 3, 25, 1, 22, 11, 90]\nn = len(a_r)\n\
  for ii in range(n):\n    for jj in range(0, n-ii-1):\n        if a_r[jj] > a_r[jj+1]:\n\
  \            a_r[jj], a_r[jj+1] = a_r[jj+1], a_r[jj]\n    print(\"Sorted List :\"\
  ,a_r)\n```\n\n### Python 代码解释\n\n提供的 Python 代码实现了冒泡排序算法，用于对名为 `a_r` 的列表进行升序排序。在冒泡排序中，它重复比较列表中的每个元素与其下一个元素，如果元素不是递增顺序，则交换这些元素。这里，初始化了一个列表\
  \ `a_r = [6, 3, 25, 1, 22, 11, 90]`。`len()` 函数返回列表的长度并将其赋值给变量 `n`。它启动外层循环，遍历 `a_r`\
  \ 元素的列表。在外层循环内部，启动内层循环，遍历从索引 `0` 到 `n-ii-1` 的列表子集。使用 `-ii` 的原因是每次外层循环结束后，最大的元素（排序后）都会被移动到末尾，因此不需要再次比较它。如果索引\
  \ `jj` 处的元素大于下一个索引 `jj+1` 处的元素，则交换交换。最后打印排序后的列表。\n\n### C 代码\n\n该程序的 C 代码如下：\n\n\
  ```c\n#include <stdio.h>\nint main() {\n    int a_r[100], n, i, j, tt, bl;\n   \
  \ printf(\"Enter the number of elements in the array: \");\n    scanf(\"%d\", &n);\n\
  \    printf(\"Enter the elements of the array: \");\n    for(i = 0; i < n; i++)\
  \ {\n        scanf(\"%d\", &a_r[i]);\n    }\n    for(i = 0; i < n - 1; i++) {\n\
  \        bl = 0;\n        for(j = 0; j < n - i - 1; j++) {\n            if(a_r[j]\
  \ > a_r[j + 1]) {\n                tt = a_r[j];\n                a_r[j] = a_r[j\
  \ + 1];\n                a_r[j + 1] = tt;\n                bl = 1;\n           \
  \ }\n        }\n        if(bl == 0) {\n            break;\n        }\n    }\n  \
  \  printf(\"Sorted array in ascending order: \");\n    for(i = 0; i < n; i++) {\n\
  \        printf(\"%d \", a_r[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n\
  }\n```\n\n### C 代码解释\n\n该代码重复比较列表中的每个元素与其下一个元素，如果元素不是递增顺序，则对其进行交换。这个过程一直持续，直到不再需要交换为止，这意味着列表已排序。结果是打印在控制台上的排序列表。\n\
