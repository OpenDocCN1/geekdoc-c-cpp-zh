  \n## 结构](#contents.xhtml_sc2_624a)\n\n在本章中，共有 20 个程序，五个子节对每个程序进行了补充说明：\n\n*   通过包含输入和输出的示例测试用例理解程序目标。这将使用户理解期望的什么样的用户输入，以及特定程序将产生什么结果。\n\
