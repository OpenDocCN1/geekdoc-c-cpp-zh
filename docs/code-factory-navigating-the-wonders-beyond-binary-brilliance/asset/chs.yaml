  \ `strlen()` 返回字符串的长度。`strrev()` 用于反转字符串。`strcat()` 用于拼接两个字符串。所有这些字符串函数定义在 `string.h`\
  \ 库中。函数定义为 `ord()`，它返回字符的 ASCII 值。大写字母的 ASCII 值范围为 65-90，小写（97-122），数字（48-57），其他视为特殊字符。`bin()`\
  \ 是 Python 中的一个定义函数，用于获取任何十进制数的二进制。与 Python 不同，`ord()` 和 `bin()` 不是内置函数，因此它们在程序中被定义。\n\
