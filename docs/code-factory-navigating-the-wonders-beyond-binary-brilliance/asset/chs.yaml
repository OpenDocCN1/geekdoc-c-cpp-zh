  \ 2 所示），程序将终止而不产生任何输出。\n\n## 程序 2.3：检查数字是偶数还是奇数\n\n要求用户输入数字（三位整数）。根据数字是偶数还是奇数，向用户打印适当的消息。\n\
  \n### 示例输入输出\n\n测试用例 #1：\n\n输入：Enter a number: 45\n\n输出：Number is ODD\n\n测试用例 #2：\n\
  \n输入：Enter a number: 68\n\n输出：Number is EVEN\n\n### 算法\n\n编写程序需要遵循的步骤为：\n\n步骤 1\\\
  . 开始\n\n步骤 2\\. 输入数字作为 `n`\n\n步骤 3\\. 如果 `n%2 ==0`:\n```\nprint(\"number is EVEN\"\
  )\n```\n\n步骤 4\\. else:\n\n```\nprint(\"number is ODD\")\n```\n\n步骤 5\\. \n\n###\
  \ 流程图\n\n[图 2.3] 展示了程序的流程图：\n\n![](img/Figure_2.3.jpg)\n\n图 2.3：说明程序 2.3 的流程图\n\n\
  ### Python 代码\n\n程序的 Python 代码如下：\n\n1. `n=int(input(\"Enter a number : \"))`\n\
  2. `if n%2 ==0:`\n3. `print(\"number is EVEN\")`\n4. `else:`\n5. `print(\"number\
  \ is ODD\")`\n\n### Python 代码解释\n\nPython 代码提示用户输入数字并将输入作为整数读取，存储在变量 `n` 中。它检查 `n`\
  \ 的值是否能被 2 整除。为此，使用了取模运算符（`%`），它计算 `n` 除以 2 的余数。如果余数为 0，则意味着该数字是偶数并打印消息 `number\
  \ is EVEN`。否则，它执行 `else` 块并打印消息 `number is ODD`。\n\n### C 代码\n\n程序的 C 代码如下：\n\n\
  ```c\n#include<stdio.h>\nvoid  main()\n{\n  int n;\n  printf(\"Enter a number :\
  \ \");\n  scanf(\"%d\",&n);\n  if (n%2 ==0)\n  printf(\"Number is EVEN\");\n  else\n\
  \  printf(\"Number is ODD\");\n}\n```\n\n### C 代码解释\n\n这段 C 代码包含了头文件 `stdio.h`，其余代码写在\
  \ `main()` 函数的大括号 `{}` 内部。它声明了一个整数变量 `n` 来存储用户的数字，使用 `scanf()` 函数将用户的输入作为整数读取，并存储在变量\
  \ `n` 中。\n\n它检查 `n` 的值是否能被 2 整除。取模运算符（`%`）计算 `n` 除以 2 的余数。如果余数为 0，则意味着该数字是偶数并打印消息\
  \ `Number is EVEN`。否则，它执行 `else` 块并打印消息 `Number is ODD`。由于这里的 `if` 和 `else` 块只包含一条语句，因此不需要将块封装在\
  \ `{}` 括号内。然而，如果 `if-else` 块中的语句多于一条，则必须放在 `{}` 括号内。\n\n## 程序 2.4：检查整数类型\n\n检查输入数字是正数、负数还是零。\n\
