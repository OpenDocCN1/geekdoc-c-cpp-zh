  \n## 程序 5.10: 检查矩阵是否为上三角\n\n输入一个矩阵并检查它是否为上三角。\n\n### 示例输入输出\n\n测试用例 #1：\n输入：`[[1,1,1],[0,1,1],[0,0,1]]`\n\
