  \n# 程序 3.9：求 2 的 n 次方\n\n输入 n，并计算 `2^n`（2 的 n 次方）。\n\n\n\n\n\n## 样例输出\n\n测试用例 #1：\n\
  输入：`Enter n:3`\n输出：`2³ =8`\n\n测试用例 #2：\n输入：`Enter n:6`\n输出：`2⁶ = 64`\n\n### 算法\n\
  \n运行上述程序需要执行以下步骤：\n\n步骤 1. 开始\n步骤 2. 读取 `n`\n步骤 3. `p=1`, `i=1`\n步骤 4. 如果 `i<=n`\
  \ 则重复\n`p=p*2`\n`i=i+1`\n步骤 5. `Print(\"2^\",n,\" = \",p)`\n步骤 6. 停止\n\n### 流程图\n\
  \n[图 3.9] 以流程图的形式展示了程序：\n\n![](img/Figure_3.9.jpg)\n\n图 3.9：展示程序 3.9 的流程图\n\n###\
  \ Python 代码\n\n程序的 Python 代码如下：\n\n```python\nn=int(input(\"Enter n: \"))\np=1\n\
  for i in range(1,n+1):\n    p=p*2\nprint(\"2^\",n,\" = \",p)\n```\n\n### Python\
  \ 代码解释\n\n计算 2 的 `n` 次方，我们需要将 2 乘以自身 n 次。相同的逻辑通过 Python 代码实现。在这个程序中，使用了 `for-loop`\
  \ 而不是 `while-loop`，尽管也可以使用 `while-loop`。在获取用户输入后，变量 `p` 被初始化为 1。该变量计算并存储 2 的 `n`\
  \ 次方的的结果。在 `for-loop` 中，它从一个关键字开始，遍历从 1 到 n（包含）范围内的值。变量 `i` 在由 `range(1,n+1)` 表示的每次迭代中取值为\
  \ 1, 2, 3, ..., `n`。`range` 函数包含第一个参数 1，并排除最后一个参数。因此，它将生成从 1 到 `n` 的序列值。然后，将 `p`\
  \ 的当前值乘以 2（2 是幂的底数）。此步骤在循环的每个 `i` 值上执行，有效地计算了 2¹, 2², 2³, ..., 2^n。最后，显示代表 2 的 `n`\
  \ 次方的计算出的 `p` 的值。\n\n### C 代码\n\n程序的 C 代码如下：\n\n```c\n#include<stdio.h>\nvoid main()\n\
  {\n    int i, n;\n    int p=1;\n    printf(\"Enter a numbers: \");\n    scanf(\"\
  %d\", &n);\n    i=1;\n    while(i<=n)\n    {\n        p=p*2;\n        i=i+1;\n \
  \   }\n    printf(\"The 2^%d is %d\", n, p);\n}\n```\n\n### C 代码解释\n\n计算 2 的 `n`\
  \ 次方，我们需要将 2 乘以自身 n 次。相同的逻辑通过这段 C 代码实现。在这里，获取用户输入后，变量 `p` 被初始化为 1。该变量计算并存储 2 的 `n`\
  \ 次方的结果。`while-loop` 从 1 迭代到 `n`。然后，将 `p` 的当前值乘以 2（2 是幂的底数）。此步骤在循环的每个 `i` 值上执行，有效地计算了\
