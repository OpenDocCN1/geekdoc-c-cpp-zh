  \n## 程序 2.1：求数字的绝对值](#contents.xhtml_sc2_176a)\n\n打印用户输入的数字的绝对值。\n\n## 样例输出](#contents.xhtml_sc3_177a)\n\
  \n测试用例 #1:\n\n输入：输入 `n` 的值: -23\n\n输出: 23\n\n测试用例 #2:\n\n输入：输入 `n` 的值: 56\n\n输出:\
  \ 56\n\n测试用例 #3:\n\n输入：输入 `n` 的值: 0\n\n输出: 0\n\n## 算法](#contents.xhtml_sc3_178a)\n\
  \n运行上述程序需要遵循以下步骤：\n\n步骤 1\\. 开始\n步骤 2\\. 声明变量 `n`\n步骤 3\\. 读取 `n`\n步骤 4\\. `if n\
  \ >= 0`\ni. `print n`\n步骤 5\\. `else`\ni. `print n*(-1)`\n步骤 6\\. 停止\n\n## 流程图](#contents.xhtml_sc3_179a)\n\
  \n图 2.1 以流程图的形式展示了程序：\n\n![](img/Figure_2.1.jpg)\n\n图 2.1: 展示程序 2.1 的流程图\n\n## Python\
  \ 代码](#contents.xhtml_sc3_180a)\n\n程序 2.1 的 Python 代码如下：\n\n```\n1. n=int(input(\"\
  Enter n: \"))\n2. if n >= 0:\n3. print( n)\n4. else:\n5. print(-1*n)\n```\n\n##\
  \ Python 代码解释](#contents.xhtml_sc4_181a)\n\n给定代码要求用户输入一个数字，使用 `input()` 函数获取输入，然后使用\
  \ `int()` 函数将值转换为整数。在 Python 中，`if` 和 `else` 语句块向右缩进。`if` 和 `else` 是关键字。这里使用 `if-else`\
  \ 语句检查 `n` 是否大于 0。如果数字大于 0，则称为正数。否则，则称为负数。`if` 关键字后跟着条件 `(n >= 0)`。如果条件为真，程序中的下一语句\
  \ `print(n)` 将执行并打印 `n` 的值。否则，该语句将被跳过，并执行 `else` 块。它将在 `n` 的值乘以 -1 后输出结果。\n\n##\
  \ C 代码](#contents.xhtml_sc3_182a)\n\n程序 2.1 的 C 代码如下：\n\n```c\n1. #include<stdio.h>\n\
  2. #include<math.h>\n3. int  main()\n4. {\n5. int n;\n6. printf(\"Enter the value\
  \ of n: \");\n7. scanf(\"%d\", &n);\n8. if(n >= 0) //检查 n 是否为正数\n9. printf(\"%d\"\
  , n);\n10. else //仅当 n 为负数时才会执行 else 块\n11. printf(\"%d\",-1*n);\n12. return 0;\n\
  13. }\n```\n\n## C 代码解释](#contents.xhtml_sc4_183a)\n\n给定代码提示用户输入 `n` 的值，读取输入，然后检查\
  \ `n` 的值是否为正。如果数字大于 0，则称为正数。否则，则称为负数。使用 `if-else` 语句检查 `n` 是否大于 0。如果大于或等于零，则原样显示\
  \ `n` 的值。如果 `n` 的值小于零，则将其乘以 -1 以变为正数，然后显示结果。\n\n`if` 和 `else` 是用于 `if-else` 语句的关键字。条件包含在括号\
  \ `()` 中。这是一个求值为真或假的逻辑表达式。如果条件为真，则执行跟随 `if` 语句的代码块。\n\n## 程序 2.2：检查你是否成年](#contents.xhtml_sc2_184a)\n\
