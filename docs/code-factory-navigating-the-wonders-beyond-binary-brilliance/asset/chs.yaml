  \n![](img/fm1.png)\n\n# 第 1 章 简单的输入输出程序 (#contents.xhtml_ch01a)\n\n## 引言 (#contents.xhtml_sc2_1a)\n\
  \n处理输入和生成输出的能力是编程的基本方面。在本章中，我们将深入探索简单输入输出程序的世界。它全面地解释了基础算法、流程图、Python 和 C 代码实现。这些程序允许用户掌握基本概念，如用户输入、数据处理和结果显示。本章将成为书中后续章节开发更复杂应用程序的基石。\n\
  \n无论你是寻求加强基础能力的初级程序员，还是寻找实际示例的资深开发者，本章都提供了多种简单程序供你探索。通过学习算法和视觉化流程图，可以建立对程序的基本理解。此外，Python\
  \ 和 C 代码将让你对这些语言中输入输出操作的核心原理有宝贵的见解。总的来说，将获得解决现实世界编程挑战所需的技能。流程图的基本构建块如图 1.1 所示：\n\
  \n![](img/Figure_1.1.png)\n\n图 1.1：流程图的基本构建块\n\n## 结构 (#contents.xhtml_sc2_2a)\n\
  \n在本章共有 21 个程序，四个子主题补充每个程序。每个程序将涵盖以下主题：\n\n*   通过示例输入和输出理解程序目标。这将让用户理解预期的用户输入类型以及针对特定程序将产生什么结果。\n\
  *   通过算法理解程序。这将帮助用户理解编写解决程序所需的步骤序列的方法论。\n*   通过流程图视觉化程序流程。通过流程图表示可以轻松地理解程序目标。用户将理解在不同程序的流程图表示在什么语境下使用哪些符号。\n\
  *   每个程序的 Python 源代码。为用户提供了每个程序的 Python 编程语言源代码，以便用户理解该语言的基本操作。还对每段代码提供了解释。\n* \
  \  每个程序的 C 语言实现。用户可以通过提供的 C 语言代码及其解释来学习 C 语言的基本概念。\n\n## 目标 (#contents.xhtml_sc2_3a)\n\
  \n\n\n\n\n在本章中，读者将学习输入输出操作的基础知识及其在程序开发中的意义。我们将讨论用于执行基本输入输出操作的算法设计。我们将掌握使用流程图创建程序流的可视化表示，以及使用\
  \ `Python` 和 `C` 编程语言实现简单输入输出程序的能力。通过示例代码，用户可以获得实践经验。我们还将获得与简单基础问题相关的解决能力，例如接受用户输入、执行计算和显示结果。\n\
  \n## 程序 1.1: 打印你的名字](#contents.xhtml_sc2_4a)\n\n输入你的名字作为输入并打印 `Hello name`。\n\n\
  ### 示例输入输出](#contents.xhtml_sc3_5a)\n\n测试用例 #1:\n\n输入: Neo\n输出: Hello Neo\n\n测试用例\
  \ #2:\n\n输入: Sam\n输出: Hello Sam\n\n测试用例 #3:\n\n输入: John Will\n输出: Hello John Will\n\
  \n### 算法](#contents.xhtml_sc3_6a)\n\n运行上述程序需要遵循以下步骤：\n\n步骤 1\\. 开始\n步骤 2. 在 `name`\
  \ 中输入你的名字\n步骤 3\\. 打印 \"Hello\" `name`\n步骤 4\\. \n\n### 流程图](#contents.xhtml_sc3_7a)\n\
  \n图 1.2 以流程图的形式展示了程序：\n\n![](img/Figure_1.2.jpg)\n\n图 1.2: 演示程序 1.1 的流程图\n\n###\
  \ Python 代码](#contents.xhtml_sc3_8a)\n\n程序 1.1 的 Python 代码如下：\n\n```python\n# read\
  \ a input from the user\nname= input(\"Enter your name: \")\n# print the name on\
  \ the screen\nprint(\"Hello \", name)\n```\n\n### Python 代码解释](#contents.xhtml_sc4_9a)\n\
  \n程序提示用户输入名字，然后打印包含名字的问候消息。\n\n`name = input(\"Enter your name: \"):`: 这一行通过打印字符串\
  \ `Enter your name:` 提示用户输入名字。`input()` 函数用于读取用户的输入作为字符串并将其赋值给变量 `name`。\n\n`print(\"\
  Hello\", name)`: 这一行使用 `print()` 函数打印字符串 `Hello` 后面是变量 `name` 的值。\n\nPython 是一种对缩进敏感的语言。缩进用于标记代码块。\n\
  \n任何以 `#` 开头的语句都是注释，不会执行。这些注释会被编译器忽略，仅供用户理解代码。\n\n### C 代码](#contents.xhtml_sc3_10a)\n\
  \n程序 1.1 的 C 代码规范如下所示：\n\n```c\n#include <stdio.h>\nint main() //The execution of\
  \ C program starts with main function\n{\n    char name[100]; //declared a variable\
  \ of character type of size 10\n    printf(\"Enter your name: \");\n    gets(name);\
  \  // read a input from the user\n    printf(\"Hello %s\", name); // print the name\
  \ on the screen\n    return 0; // The main() function returns an integer value 0\n\
  }\n```\n\n### C 代码解释](#contents.xhtml_sc4_11a)\n\n`stdio.h` 是一个头文件，应该包含在程序中以便使用各种输入输出函数。`main()`\
  \ 函数作为程序执行的起点。在每个 C 程序中，必须编写一个 `main` 函数。在这里，`main()` 之前写了 `int`。这意味着函数 `main()`\
  \ 在完成程序执行后将返回一个整数值。最后一个语句 `return 0` 在程序成功执行后返回值 0。\n\n变量名被声明为 100 个字符的数组。`gets()`\
  \ 是一个用于读取字符串的输入函数。参考测试用例 #3，`gets()` 函数也允许单词之间的空格。此外，C 使用 `%s` 作为字符串的格式指定符。最后，我们使用\
  \ `printf()` 函数输出带有用户名字的问候消息。\n\n与 Python 不同，缩进在 C 语言中并不重要。每个代码块都包含括号之间。\n\n## 程序\
  \ 1.2: 打印你的幸运数字](#contents.xhtml_sc2_12a)\n\n输入一个数字并将数字打印为 `Number entered by you\
  \ is: number`。\n\n### 示例输入输出](#contents.xhtml_sc3_13a)\n\n测试用例 #1:\n\n输入: 10\n输出:\
  \ Number entered by you is: 10\n\n测试用例 #2:\n\n输入: 55\n输出: Number entered by you\
  \ is: 55\n\n### 算法](#contents.xhtml_sc3_14a)\n\n下面的步骤说明了程序 1.2 的工作：\n\n步骤 1\\. 开始\n\
  步骤 2\\. 在 `n` 中输入一个数字\n步骤 3\\. 打印 \"Number entered by you is : \" `n`\n步骤 4\\. \n\
  \n### 流程图](#contents.xhtml_sc3_15a)\n\n图 1.3 以流程图的形式描绘了程序：\n\n![](img/Figure_1.3.jpg)\n\
  \n图 1.3: 程序 1.2 的流程图\n\n### Python 代码](#contents.xhtml_sc3_16a)\n\n程序 1.2 的 Python\
  \ 代码如下：\n\n```python\n# read an integer input from the user\nn=int(input(\"Enter\
  \ a number: \"))\n#print the output on the screen\nprint(\"Number entered by you\
  \ is \", n)\n```\n\n### Python 代码解释](#contents.xhtml_sc4_17a)\n\n此代码的第一行使用 `input()`\
