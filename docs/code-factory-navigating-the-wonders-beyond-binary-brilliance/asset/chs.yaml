  \ 个自然数（从 1 开始）。它从用户处获取一个整数输入 `n`。变量 `i` 初始化为 1，用于跟踪循环的次数。然后，它使用 `while` 循环按升序打印从\
  \ 1 到 `n` 的数字，并用空格分隔。当 `i` 的值大于 `n` 时，循环停止。注意 `while` 语句块的大括号 `{}`。\n\n## 程序 3.3:\
