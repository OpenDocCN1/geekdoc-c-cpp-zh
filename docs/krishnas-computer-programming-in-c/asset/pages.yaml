  md: '# Computer Programming in "C"


    Printers are most popular output devices used today for producing hard copy output.
    Different types of printers are described below:


    # 1.21.2.1 Dot-Matrix Printers


    Dot matrix printers are character printers that print one character at a time.
    They form characters and all kinds of images as patterns of dots. A dot-matrix
    printer has a print head that moves horizontally across the paper. Print head
    contains an array of pins that can be activated independent of each other extend
    and strike against an inked ribbon to form patterns of dots. To print a character,
    the printer activates the appropriate set of pins as the print head moves horizontally.
    For faster printing many dot matrix printers print both ways—while the print head
    moves from left to right and it moves from right to left on return. Such method
    is called bidirectional.


    Since dot-matrix printers produce printed output as patterns of dots, they can
    print any shape of character that a program can describe. They, therefore, can
    print many special characters in different sizes and also have the ability to
    print graphics such as charts and graphs.


    Dot-matrix printers are impact printers because they print by hammering the pins
    on the inked ribbon to leave impressions on a paper. Hence, they can be used to
    produce multiple copies using carbon paper or its equivalent. Due to impacting
    dot-matrix printers they are noisy compared to non-impact printers.


    Dot-matrix printers are generally slow with printing speeds ranging from 30 to
    600 characters per second. However, they are cheap in terms of initial cost and
    cost of operation. Hence, they are preferred by individuals and organizations
    for generating printed outputs if the speed and quality of printing are not important
    factors. They are also used for applications requiring multi-copy output such
    as shipping forms and invoices that rely on impact printing for generating multiple
    copies.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_63_0.png)


    # 1.21.2.2 Inkjet Printers


    Inkjet printers are character printers that form characters and all kinds of images
    by spraying small drops of ink on a paper. The print head of an inkjet printer
    contains up to 64 tiny nozzles that can be heated selectively in a few microseconds
    by an integrated circuit. When the resistor heats the ink near it vaporizes and
    is ejected through the nozzle making a dot on the paper placed in front of the
    print head. To print a character the printer selectively heats the appropriate
    set of nozzles as the print head moves horizontally.'
