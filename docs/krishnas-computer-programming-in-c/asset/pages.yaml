  md: '# 10.8.2 Pointers and Multidimensional Array


    So far we have use the pointers with one-dimensional array. But it is also possible
    to use pointers with two or more dimensions. The two-dimensional array is also
    called a matrix. A simple two-dimensional array element is defined in the following


    ```

    a[i][j]

    ```


    where → is the array name


    +   i → represents rows number

    i → represents column number.


    For Example: int a[3][2]={


    ```

    {{100,200};

    {300,400};

    {500,600};

    };

    ```


    The above initialized arrays will be stored in memory in following arrangement
    :


    | Element | 100 | 200 | 300 | 400 | 500 | 600 |

    | Matrix Location | [0][0] | [0][1] | [1][0] | [1][1] | [2][0] | [2][1] |

    | Address | 1010 | 1012 | 1014 | 1016 | 1018 | 1028 |


    The above arrangement shows that a two-dimensional array is nothing but it is
    a collection of a number of one-dimensional arrays placed after one another. In
    other words, we can consider, each row or column as a one-dimensional array.


    ```

    data type *a(dimensional);

    ```


    where

    data type → basic or derived data type


    +   a → pointer variable

    dimensional → number of elements


    More precisely, we can write it as follows :


    | Num | 0 | 1 | 2 | 3 | 4 |

