    # 9.3.4 Quick Sort


    It is one of the most popular sorting techniques quick sort possesses a very good
    average case behaviour among all the sorting techniques. This was developed by
    C.A.R. Hoare.


    The quick sort algorithm works by partitioning the array to be stored and each
    partition is in turn sorted recursively. In partition, one of the array elements
    is chosen as a key value. This key value can be the first element of an array.
    If ''a'' is an array key = a[0]. And rest of the array elements are grouped into
    two partitions such that :


    +   1. One partition contains elements smaller than the key value.


    +   2. Another partition contains elements larger than the key value in an array.


    Fig. 9.4 shows a key and partitions of element in an array.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_493_0.png)


    # 9.3.5 Merge Sort


    Merge sort is a sorting technique that divides the array into subarrays of size
    2 and merge adjacent pairs. We then have approximately n/2 arrays of size 2. This
    process is repeated until there is only one array remaining in size.


