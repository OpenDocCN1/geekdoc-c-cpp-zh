    # ### 4.1.4.3 Logical NOT (!) Operator


    This operator negate the value of the expressions.

    The AND operator is used to perform AND ing operation on two logical operands.
    It is equivalent to a multiplication operation. The result of a logical ANDing
    is true, when both the operands are true, otherwise the answer is false. It is
    shown in the following table :


    | S1 | S2 | S1&&S2 |

    | false | false | false |

    | false | true | false |

    | true | false | false |

    | true | true | true |


    The OR operator is used to perform ORing on two logical operands. It is equivalent
    to an addition operation. The result of a logical ORing is false only when both
    the operands are false; otherwise the answer is true. This is shown in the truth
    table.


    | S1 | S2 | S1||S2 |

    | false | false | false |

    | false | true | true |

    | true | false | true |

    | true | true | true |


    The logical NOT is used to obtain the logical complement of the operand. The result
    of a logical NOT is TRUE when the operand is FALSE and vice versa as shown in
    the truth table.


    | Operand | ! Operand |

    | false | true |

    | true | false |


