    # 1.12 Problem Solving


    # 1.12.1 Introduction to Problem Solving


    Everyone must have felt at least once in his or her life how wonderful it would
    be if we could solve a problem at hand preferably without difficulty or with some
    difficulties. Unfortunately the problem solving is an art at this point and there
    are no universal approaches one can take to solve problems. Basically one must
    explore possible avenues to a solution by one one comes across a right path to
    a solution. Thus generally speaking, there is guessing and an element of luck
    involved in problem solving. However, in general, as one gains experience in solving
    problems, one develops one''s own techniques and strategies, though they are often
    intangible. The guessing is not an arbitrary guessing but an educated one.


    # 1.12.2 A Framework for Problem Solving


    The following four phases can be identified in the process of solving problems:


    +   1. Understanding the problem

    2. Making a plan of solution

    3. Carrying out the plan

    4. Looking back i.e. verifying


    Each of the first two phases is to be explained below a little more in detail.
    Phases (3) and (4) should be self-explanatory.


    +   1. Understanding the Problem: Needless to say that if you do not understand
    the problem you cannot solve it. It is also true that if you really understand
    the problem, you can see a solution. Below are some of the things that can help
    us understand a problem.


    +   (i) Extract the principal parts of the problem.

    The principal parts are:

    For "find" type problems, such as "find the principal and return for a given investment",
    UNKNOWNs, DATA AND CONDITIONS, and for "proof" type problems HYPOTHESIS AND CONCLUSION.'
