  md: '# 2.5.3 Application of BCD Codes


    BCD codes are used in the applications where the decimal frequency is directly
    transferred in or out of a digital system. Electronic calculators, digital voltmeters,
    frequency counters, electronic counters, digital clocks are one of the applications
    that works with BCD codes. It has also been used in early computers.


    Drawback: In BCD codes, the weights of the four binary bits which represent an
    individual digits is 8, 4, 2 and 1. The 1''s complement of 0011 (3 decimal) is
    1100 (12 decimal) which is not an acceptable BCD code in this system. To overcome
    the difficulty, other BCD codes such as Excess-3 codes, 2421 code etc. were used
    in earlier computers.


    # 2.6 EBCDIC


    EBCDIC stands for Extended Binary Code for Data Interchange Code. It is the standard
    character code for large computers. It is an 8-bit code without parity. The ninth
    bit can be used for parity with 8 bits, upto 256 characters can be coded. This
    code was originated by IBM.


    The EBCDIC uses eight bits which represent each character. Its concept is similar
    to the ASCII however, the specific bit pattern are different. To translate ASCII
    to EBCDIC, the integrated circuits are available so that two incompatible computers
    or terminals can be connected to each other.


