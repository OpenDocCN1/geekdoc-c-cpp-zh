    **Problem:** A survey of TV viewers shows the following results:


    To the question "Do you watch comedies?", 352 answered "Yes",


    To the question "Do you watch sports?", 277 answered "Yes", and


    To the question "Do you watch both comedies and sports?", 129 answered "Yes".


    Given this data, among people who watch at least one of comedies and sports, percentages
    of people who watch at least one of comedies and watch only comedies, only sports,
    and both comedies and sports.


    Let us try to solve this problem following the framework presented above.


    # **Solution:**


    **Understanding the Problem:** This is a "find" type problem. So we try to identify
    unknowns, data and conditions.


    The **unknowns** are the percentage of people who watch only comedies, the percentage
    of people who watch only sports, and the percentage of people who watch both comedies
    and sports.


    The **data** are the three numbers: 352, 277 and 129, representing the number
    of people who watch comedies, sports, and both comedies and sports, respectively.
    Note that 352 includes people who watch both comedies and sports as well as people
    who watch only comedies. Similarly for 277.


    The **conditions** are not explicitly given in the problem statement. But one
    can see that the percentages must add up to 100, and they must be nonnegative.


    **Devising a Solution Plan:** Here we first examine the principal parts in detail.


    First let us consider the unknowns in more detail. To calculate the percentage
    of the people who watch only comedies, for example, we need the number of people
    who watch at least one of comedies and sports, and the number of people who watch
    only comedies. Actually two unknowns are involved in each of the required percentages,
    and the real unknowns are the number of people in each of the categories, and
    the number of people who watch at least one of comedies and sports.


    Next us look at the data. The first number 352 is the number of people who watch
    comedies. But that is, not necessarily that of the people who watch only comedies.
    It includes that and the number of people who watch both comedies and sports.
    Similarly for the second number 277.


    Let us use symbols to represent each of the unknowns: Let C represent the number
    of people who watch only comedies, S that the people who watch only sports, and
    T that the people who watch at least one of those programs.


    Then we have the following relationships among the unknowns:


    ```

    C+129=352

    ```


    ```

    S+129=277

    ```


    ```

    C+S+129=T

    ```'
