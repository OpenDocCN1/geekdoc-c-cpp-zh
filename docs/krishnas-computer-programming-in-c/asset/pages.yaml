    # 3.10 Data Types


    It is almost impossible for a programmer to talk for two minutes about computing
    without saying "data" in one context or the other. There are data types, data
    objects, data structures, data flow, data bases, data corruption, data validation
    and so on, all of which are parts of data processing.


    There are two fundamentally different types of data in C program i.e., integer
    point and floating point.


