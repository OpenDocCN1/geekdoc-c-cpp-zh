    # 8.2 Definition of Array


    An array can be defined as an ordered list of homogeneous (same type) data elements.
    These elements may be of int, float, char or double. All these elements are stored
    in consecutive memory locations. Array notation and representation.


    An array is described by a single name or identifier and each individual data
    item in the array is referenced by a subscript enclosed in a square brackets.


    For Example: person[1] person[2] person[3] person[4] person[5]


    where :

    person[1] -> indicates the first element in an array person

    person[2] -> indicates the second element in an array person

    person[3] -> indicates the third element in an array person

    person[4] -> indicates the fourth element in an array

    person[5] -> indicates the fifth element in an array'
