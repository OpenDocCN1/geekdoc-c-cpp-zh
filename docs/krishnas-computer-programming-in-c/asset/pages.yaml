    # 11.3.4 Selecting the Best Solutions


    "Decision making can be seen as bringing one into an ambivalent relationship with
    both power and responsibility."


    # Define and Identify the Problem


    The starting point in any conscious attempt at rational decision making must be
    the recognition that a problem exists. While effective meetings are essential
    to get work done, most meetings leave us still looking for a decision. A good
    meeting should bring the group members together. It should facilitate decision
    making, assist others in responsibility, and contribute to building team effort
    among the group.


    The group begins with defining the problem. The group members only discuss the
    definition of terms and how the problem relates to other issues. Identifying the
    problem is very crucial. It is important not to define a problem so broadly that
    it generates never-ending questions.


    # 11.3.5 Evaluating Solutions


    There are several ways to evaluate the solutions, and writing them all down will
    help the group to choose the best solution to the problem.


    Making a T-Chart to Weigh the Pros and Cons of each idea. It is often helpful
    to make a T-chart and ask members of the group to name the pros and cons of each
    solution. This method will visually illustrate the strengths and weaknesses of
    each solution.


    # 11.3.6 Develop an Action Plan


    An action plan is a list of the tasks that need to be identified and who will
    be responsible for each, and when what action is necessary, to start, and how.


    # Divide the Solution Into Sequential Tasks


    Looking at your solution as one task may seem too great an undertaking. It is
    much more productive to divide it into sequential tasks which act as measurable
    steps toward the solution. When dividing the solution into tasks, be sure to include
    a timeline, what is to be done, and who will do it.


    # Develop Contingency Plans


    The best laid plans of mice and men...


    Even the best of plans get stalled, derailed or must be changed midstream because
    of something unforeseen. Most times these circumstances cannot be prevented, but
    you can and should prepare for kinks by having a contingency plan. Having such
    a plan will keep the momentum going instead of having to stop and figure out what
    to do when an unplanned event occurs.'
