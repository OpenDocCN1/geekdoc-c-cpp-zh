    # 1.21.2.5 Laser Printer


    Laser printers are page printers that print one page at a time. Main components
    of a laser printer are a laser source multi-sided mirror photoconductor drum and
    toner. To print a page of output the laser beam is focused on the electro statically
    charged drum by the spinning multi-sided mirror. The mirror focuses the laser
    beam on the surface of the drum in a manner to create the patterns of characters/images
    to be printed on the page. Since the drum is photoconductor, a difference in electric
    charge is created on those parts of the drum surface that are exposed to the laser.
    As a result, the toner of oppositely charged ink particles, sticks to the drum
    in the places where the laser beam has charged the drum''s surface. The toner
    is fused permanently on the paper with heat and pressure to generate the printed
    output. The drum is rotated and cleaned with a rubber blade to remove the toner
    sticking to its surface to prepare for next next printing.


    Laser printers produce very high quality output because they form characters by
    very tiny ink particles. The most common laser printers have resolution of 600
    dpi (dots per inch), whereas some high end laser printers have resolution of 1200
    dpi. Due to their high resolution, these printers give excellent graphics art
    quality.


    Since laser printers produce output as patterns generated by the laser beam they
    can print any of characters that a program can describe. Therefore, they can print
    many special characters, different sizes of print and also the ability to print
    graphics such as charts and graphs.


    Laser printers are non-impact printers. Hence, they are very quiet in operation.
    Being of non-impact type, they cannot be used to produce multiple copies of a
    document in a single printing.


    Mostly laser printers can print in black color only because they have a single
    toner-drum arrangement but color laser printers are available at affordable price.
    A color laser printer like color inkjet printer contains four color toners each
    with a drum of its own. The usage of drums and toners are same as earlier but
    each drum is charged in such a way that they produce the desired color output.'
