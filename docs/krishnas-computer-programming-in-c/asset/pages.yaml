  md: '# 13.3.1.1 #define


    The preprocessor allows constants to be named using the #define notation. The
    general form of the direction is :


    ```

    #define name char-sequence

    ```


    If you wish to define a standard error message, you might write something like
    this :


    ```

    #define E_AE "standard error on input"

    /* _/

    ```


    ```

    printf("E_AE");

    ```


    The compiler will actually substitute the string


    ```

    "standard error on input"

    ```


    When the identifier E_AE is encountered. To the compiler, the printf statement
    actually appear to be


    ```

    printf("standard error on input");

    ```


    No substitutions occur if the identifier is with a quoted string.


    For Example:


    ```

    #define rest "this is rest"

    printf("Rest");

    ```


    does not print this is rest, but rather Rest.


    # 13.3.1.2 Macro Expansion


    When the equivalent text consists of more than a single value, operator on variable,
    the symbolic name is referred to as macro and substitution of the text in place
    of the symbolic name is called a macro expansion.


    The following directive will substitute a printf instruction for the constant
    named ENTER.


    ```

    #define ENTER

    printf("enter a number");

    ```


    When we want to display the message named in the printf command, we just use the
    instruction ENTER, like this :


    ```

    #define ENTER

    printf("enter a number");

    void main ()

    {

    int x, y;

    ENTER

    scanf("%d",&x);

    ENTER

    scanf("%d",&y);

    }

    ```


    Now, when this program is executed, enter a number which will be displayed, just
    as if the printf instruction appeared in the main( ) program.'
