  md: '# 1.31 Interactive Systems


    An interactive operating system allows users to interact directly with a computer
    from a terminal. In effect, the user can insert a low-priority batch job and cause
    the computer to perform his high priority work. Interactive operating systems
    must be multiprogramming. Also, real time systems must be interactive since real
    time files must be updated immediately after real event occur. An interrupt is
    required, which is the suspension of the execution of a computer program, caused
    by an external to the program and performed in such a way that the execution can
    be resumed. Examples of each external events would be a request for data or input
    of data, from an interactive terminal.


    # 1.32 Real Time Operating System


    A real time operating system is used, when there are rigid time requirements on
    the operation of a processor or the flow of data


    often used as a control device in a dedicated applications"


    Systems that control scientific experiments, medical imaging systems, industrial
    control systems are real time systems. Also, includes some home appliance systems,
    weapon systems, automobile engine injection systems. Real time operating system
    has well defined, fixed time constraints. Processing must be done within defined
    constraint or the system will fail.


    Real time system is considered to function only if it returns results within any
    time constraints. While in sharing time it is desirable to respond quickly but
    not mandatory.


    There are two kinds of real time systems:


    +   1. Hard Real System

    2. Soft Real System


    # 1.32.1 Hard Real System


    This system guarantees that critical tasks complete on time. Such time constraints
    dictate the facilities that are available in hard real time system.


    Most other operating system features are also absent, since they separate user
    from hardware and this separation results in uncertainty about the amount of an
    operation will take.


    # 1.32.2 Soft Real System


    In this system, a critical time task gets priority, other tasks and retain priority
    until it completes. Soft real system or time is an achievable goal that is amenable
    to mixing with other types of systems. However, soft real time have limited utility
    than hard real time. Given that of deadline support, they are risky to use for
    industrial control and robotics. Areas where soft real time can be used are multimedia,
    virtual reality and advanced scientific projects. Soft real system need an advanced
    operating system. Features cannot be supported by hard real time system. Because
    the soft real system used an expanded form of advanced operating system.'
