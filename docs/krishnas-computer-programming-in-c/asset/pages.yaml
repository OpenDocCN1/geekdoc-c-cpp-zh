    # Array


    #  8.1 Introduction


    So far, we have been declaring simple variables. The declaration :


    ```

    int i;

    ```


    declares a single variable, named i, of type int.


    It is also possible to declare an array of several elements. The declaration :


    ```

    int a[10];

    ```


    declares an array, named a, consisting of ten elements, each of type int.


    An array is a collection of identical data elements or homogeneous type of data
    elements which are stored in consecutive memory locations under a common heading
    or a variable name. The individual values in an array are called its elements.
    Arrays are sets of same type, which have a single name followed by an index. C,
    square brackets appear around the index right after the name, with the first element
    referred to be the number.


    The individual elements of the group are accessed by their position number in
    the group. C supports arrays for this purpose. An array is a data structure with
    the help of which a programmer can refer to and perform operations on a collection
    of similar data items such as simple lists or tables of information. For example,
    a list of names of 50 students in a class can be grouped as shown in figure 8.1.'
