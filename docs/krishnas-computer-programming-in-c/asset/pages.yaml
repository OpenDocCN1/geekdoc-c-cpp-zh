  md: '(iii) If the purpose is "reading", and if it exists, then the file is opened
    with the current contents safe otherwise an error occurs.


    Consider the following statements


    ```

    FILE*p1;

    p1=fopen("data","r");

    np2=fopen("results","w");

    ```


    The file is opened for reading and results are opened for writing. In case, the
    results file already exists, its contents are deleted and the file is opened as
    a newfile. If file does not exist, an error will occur.


    Many recent compilers include additional modes of operation. They include :


    +   - r+ -> The existing file is opened in the beginning for both reading and
    writing.


    +   - w+ -> Same as except both for reading and writing.


    +   - a+ -> Same as except both for reading and writing.


    We can open and use a number of files at a time. This however depends on the system
    we use.


    2. fclose() : A file must be closed as all operations on it have been completed.
    This ensures that all outstanding information associating with the file is flushed
    out from the buffers and all links to the file are broken. It also prevents any
    accidental misuse of the file. In this case, there is a limit to the number of
    files that can be kept open simultaneously, closing of unwanted files might help
    open the required files. Another instance where we have to close file when we
    want to reopen the same file in a different mode. The I/O library supports a function
    to do this for us. It takes the following form.


    ```

    fclose(file_pointer);

    ```


    This would close the file associated with the FILE pointer file_pointer. Look
    at the following segment of a program.


    ```

    FILE*p1;

    p=fopen("INPUT","w");

    p1=fopen("OUTPUT","r");

    ```


    ```

    fclose(p);

    fclose(p1);

    ```


    This program opens two files and closes them after all operations on them are
    completed. Once a file is closed, its file pointer can be reused for another file.'
