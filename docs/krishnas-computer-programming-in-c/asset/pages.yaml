    The syntax of the function scanf() is :


    ```

    scanf("control string",address-list);

    ```


    where,


    control string -> It is a sequence of one or more characters. Each character group
    is a combination of % symbol and one of the conversion character. The control
    string specifies the type of the value which are to supplied to the variables.


    address list -> address of memory location where the value of the input variables
    should be stored.


    For Example:


    ```

    int x;

    float y;

    char ch;


    scanf("%d%f%c",&x,&y,&c);

    ```


