    BSIZE → The size in byte suitable for an Input/Output buffer supplied by the user.


    +   1. fopen() : If we want to store data in a file in the secondary memory, we
    must specify certain things

    about the file, to the operating system. They include


    +   (a) File name


    +   (b) Data structure


    +   (c) Purpose


    +   a) Filename is a string of characters that make up a valid filename for the
    operating system. It may

    tow two parts, a primary name and an optional period with the extension.


    For Examples:


    ```

    input data

    store

    PROG.C

    student.C

    ```


    +   b) Data structure of a file is defined as FILE in the library of standard
    I/O function definitions.

    Therefore, all files should be declared as type FILE before they are used FILE
    as a defined data type.


    When we open a file, we must specify what we want to do with the file.


    For example, we may write data to the file or read the already existing data.


    Following the general format for declaring and opening a file.


    ```

    FILE*F;

    =fopen("filename", "mode");

    ```


    The first statement declares the variable F as a "pointer to the data type FILE".
    As stated earlier, FILE is

    struct that is defined in the I/O Library.


    The second statement opens the file filename and assigns identifiers to the FILE
    type pointer.

    This pointer, which contains all the information about the file is subsequently
    used as a communication link

    tween the system and the program.


    +   (c) Purpose : The second statement also specifies the purpose of opening this
    file. The mode does this

    job. Mode can be one of the following :


    +   r → open the file for reading only


    +   w → open the file for writing only


    +   a → open the file for appending data to it.


    When trying to open a file, one of the following things may happen :


    +   (i) When the mode is "writing" a file with the specified name is created if
    the file does not exist.

    contents are deleted; if the file already exists.


    +   (ii) When the purpose is "appending", the file is opened with the current
    contents safe. A file with the

    sified name is created if the file does not exist.'
