    Linking is the process of combining various pieces of code and data to form into
    a single executable that can be loaded in memory. Linking can be done at compile
    time, at load time.


    # # 1.41 Types of Linker


    +   1. Linking loader: The linking loader performs all the linking and relocation
    operations and loads the linked program directly into the main memory for execution.

    2. Linkages editor: A linkage editor produce a linked version of the program called
    as a load module or an executable image. This load module is written into a file
    or library for later execution.

    3. Dynamic linker: This scheme postpones the linking function until execution
    time. Any subroutine is loaded and linked on the rest of the program when it is
    first called. This type of linking is called dynamic linking.


