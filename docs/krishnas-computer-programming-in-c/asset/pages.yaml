    improve the performance of the computer system, the concept of multi-programming
    was introduced,

    that states ''more'' than one processes are accessed at a single instant of time.
    But only one process is executed

    by CPU in a uniprocessor system (PC) and at particular other process may be accessed

    by I/O processor, which process is executed and which order is decided by CPU
    scheduler. To access more

    one processes at a time, they must reside in memory. For this, we should know
    how more than

    one processes can be allocated in one memory. Various memory management policies
    are developed to

    provide the solution of this problem in a multi-programming environment. Partitioned
    Memory

    Management for contiguous memory allocation is one of method in which physical
    memory is divided

    into sectors "partitions", each of which may be allocated to a different process.
    Depending on

    when and how partitions are created and modified, many partitions may be fixed
    (static) or variable

    (dynamic). In fixed partition method, these partitions could be of different sizes,
    but once decided at the

    time of system generation, they could be changed, i.e., fixed. This method could
    be used with swapping or

    relocation or without them.


    The number and sizes of individual partitions are determined at the time of system
    generation by gathering

    the statistical data about the capacity of the physical memory, desired degree
    of

    multi-programming and the sizes of processes must frequently run on installations.
    Individual

    partition sizes are adjusted to the needs of frequently run processes. Since,
    at most one process may

    execute out of a partition at any time, the distinct partitions represents an
    upper limit on

    the number of active processes in a system. This is also called the degree of
    multi-programming.


    # 1.3.2 Degree of Multi-programming


    CPU utilization can be improved by multi-programming. Since CPU is busy all time
    when many processes

    resides in memory for execution simultaneously. If ''n'' process spends ''t''
    time waiting for I/O operation to

    complete and there are ''n'' number of processes residing in memory for their
    execution then the probability

    of waiting ''n'' processes for Input/Output operation is given by (t).


    So,


    ```

    CPU utilization = 1 — (t)^n

    ```'
