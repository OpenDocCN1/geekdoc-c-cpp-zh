  md: '# Computer Programming in "C"


    The data items entered from keyboard must correspond to the arguments in the scanf()
    function in number, and in order. The scanf() reads and converts characters from
    the standard input according to the specified format string and stores the input
    in the memory locations referenced by the list of variables. If the string data
    variable is to be read, the variable name is not preceded by the character.


    | Character Group | Meaning |

    |---|---|

    | %c | data item is a single character. |

    | %d | data item is a decimal character. |

    | %e | data item is a floating point value. |

    | %f | data item is a floating point value. |

    | %g | data item is a floating point value. |

    | %h | data item is a short integer. |

    | %i | data item is decimal, hexadecimal or octal integer. |

    | %o | data item is an octal integer. |

    | %s | data item is a string followed by a white space character. |

    | %u | data item is an unsigned decimal integer. |

    | %x | data item is a hexadecimal integer. |


    Input value : %d character used to input decimal integer data through the standard
    input device.

    scanf("%d",&a);


    Let the input for the statement 35, then 35 is stored at the memory location represented
    by number. This is a very simple input statement and it does not specify how many
    digits there are in an input number.

    scanf("%3d",&a);


    Here, the digit 3 indicates the field width of the input number. If you are reading
    a 6 digit number, then the digit 6, representing the field width must be inserted
    between the % symbol and the conversion character as in the following statement.

    scanf("%6d",&a);


    In case the number to input is of long or short data types, the character group
    should be changed. The character group %d is replaced by %hd and %ld respectively
    to long and short integers.

    scanf("%ld%hd",&x,&y);


    Here, x is the long variable and y is the short variable. And the character stands
    for long and the character h stands for half.


    If the number to be accepted for the variable is of unsigned, then the %u character
    group should be used, as in the following statement.

    scanf("%u",&roll);


    Floating point input : Floating numbers can be input using %f specification. The
    field width is generally not specified for a real number, whether it is of a decimal
    or scientific notation. The following statement accepts real value for the variable
    y.'
