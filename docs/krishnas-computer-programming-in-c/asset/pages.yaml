  md: '# 1.33 Time Sharing or Multitasking


    Back in the days of the "bare" computers without any operating system to speak
    of the programmer had complete access to the machine.


    An hardware and software was developed to create monitors, simple spooling batch
    systems and finally multiprogrammed systems. The separation between the user and
    the computer became more and more pronounced.


    Users and programmers in particular longed to be able to get to the machine "without
    having to go through the batch process. In the 1970s and especially in the 1980s,
    this became possible in two different ways.


    The first involved time sharing or time slicing. The idea of multiprogramming
    was extended to allow for multiple terminals to be connected to the computer with
    each interaction being associated with one or more jobs on the computer. The operating
    system is responsible for switching between the jobs now called processes in such
    a way that favored user interaction. If the context-switches occurred quickly
    enough, the user had the impression that he or she direct access to the computer.


    Interactive processes are given a higher priority when Input/Output is requested
    the associated process is quickly given control of the CPU so that it can process
    it. This is usually through the use of an interrupt that causes the computer to
    realize that an Input/Output event has occurred.


    It should be mentioned that there are different types of time sharing systems.
    One type is represented by computers like the VAXVMS computers and UNIX workstations.
