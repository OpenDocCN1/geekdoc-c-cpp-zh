    from right hand side is for 1, 2nd for 2, 3rd for 4, 4th for 8, 5th for 16, 6th
    for 32 and so on. This fact is utilized for the conversion of a decimal number
    to its binary equivalent. A method is used to determine which multiples of 2 are
