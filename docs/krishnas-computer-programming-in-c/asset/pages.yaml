  md: '# 3.16 Introduction to Input/Output


    In any program, it requires data to operate upon, so that it could process and
    produce the result as per requirements. One method of providing data to the program
    is to assign values to the variables, within the program and access the variables
    whenever required. You are already familiar with this method. This method suits
    well for the situations where data is of fixed type and happens to be very small
    in volume. You cannot afford to deal with this method data, such as roll number,
    name, address, subjects, etc of city students, to be processed. It is quite obvious
    that for such situations, program should accept the data from other sources, like
    keyboard etc. C provides wide variety of input/output functions for accepting
    the data from the keyboard and displays the results on VDU. These functions remain
    available in function library and can be accessed from there using appropriate
    statements.


    The input/output operations are not part of C language, as such, rather they exist
    as functions of the language. They are available as functions in the standard
    C library along with other functions and can be used by the users. The input-output
    operations take place as a stream of characters. The standard input-output functions
    may be considered as character input-output functions and string based input-


    Each input-output device has a buffer associated with it through which the input
    or output operations take place. So the standard input-output functions are buffered.
    If the standard buffer is not cleared the contents of the buffer may interface
    with the following input operations, so care must be taken to clear the standard
    input buffer clearing the output buffer either use a new line character, on use
    an input functions or clear the buffer explicitly.


    The statement


    ```

    #include<stdio.h>

    ```


    includes the contents of standard input-output file, stdio.h at compile time,
    which contains definitions of stdin, stdout and stderr.


    C language provides the functions get() , getchar() , getche() , put() , putchar()
    , scanf() , printf() , for character input-output and gets() , puts() , scanf()
    , printf() ) for string based input-output.


    Values can be assigned to variables by using the assignment statement C provides
    standard functions, scanf() and printf() ) for performing formatted input and
    output respectively.


    The format specification string is a character which specifies the data type of
    each variable to be input or output the size or width of the input or output.


    From the above discussion we conclude that C the input/output functions are classified
    into two types :


    +   1. Formatted functions


    +   2. Unformatted functions'
