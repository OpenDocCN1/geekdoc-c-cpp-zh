    # 3.1 Introduction of C


    ‘C’ programming language was originally developed for and implemented on the UNIX
    operating system, on a DECPOP-11 by Dennis Ritchie. One of the best features of
    C is that it is not tied to any particular hardware or system. This makes easy
    for a user to write programs that will run without any changes on all machines
    practically. C is often called a middle level language as it combines the elements
    of high level languages with the functionality of assembly language.


    # 3.2 What is C?


    C is a programming language developed at AT & T''s Bell Laboratories of USA in
    1972. It was designed and written by a man named Dennis Ritchie. In the last seventies,
    C began to replace the more familiar languages of that time PL/I, ALGOL etc. No
    one pushed C. It was not made the "official" Bell language. Thus, without any
    advertisement, C''s reputation spread and its pool of users grew. Ritchie seems
    to have been rather surprised that many programmers preferred C over languages
    like FORTRAN or PL/I, or the newer like Pascal and APL. But that''s what happened.


    Computer programs are written in computer languages. Over the years many computer
    languages have come into existence. Each computer language is different from other
    but it has its advantages and disadvantages and suits well for automating a particular
    type of task C, C++, Java, Visual Basic etc. are few examples of popular computer
    languages.'
