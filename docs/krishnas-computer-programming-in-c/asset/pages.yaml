    right and left in your document mainly by two ways, using the horizontal and vertical
    scroll bars with the help of the mouse, or using the keyboard to press Pg Up,
    Pg Dn, Home, End and arrow keys.


    # ## 12.14.7 Status Bar


    Also called the status bar, this is the normally last line on your screen. This
    gives the following information about your work:


    +   - Current page


    +   - Section number'
