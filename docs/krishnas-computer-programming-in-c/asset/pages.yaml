- img_proc: true
  md: '# 1. Primary Storage


    Primary storage of a computer also known as its main memory, is used to hold pieces
    of program instructions and data, intermediate results of processing and recently
    produced results of these job(s) on which the computer is currently working. These
    pieces of information are represented electronically in the main memory chip''s
    circuitry and it remains in the main memory, central processing unit can access
    it at a very fast speed. However, primary storage memory can hold information
    only while computer system is on. As soon as the computer switches off or resets
    the information held in primary storage is erased. Moreover, primary storage normally
    has limited storage capacity because it is very expensive. Primary storage of
    modern computer systems is of semiconductor devices.


    # 2. Secondary Storage


    Secondary storage of a computer also known as its auxiliary storage is used to
    take care of the limitations of primary storage. That is, it supplements the limited
    storage capacity and the volatile characteristic of primary storage. This is because
    secondary storage is much cheaper than it can retain information even when a computer
    system switches off or resets. Secondary storage holds the program instructions,
    data of these jobs on which the computer is currently not working but needs to
    hold them for processing later. Magnetic disk is the most commonly used secondary
    storage medium.


    # 1.23 Arithmetic Logic Unit


    Arithmetic logic unit (ALU) of a computer system is the place where actual execution
    of instructions takes during processing operation. To be more precise, calculations
    are performed and all comparisons are made in the ALU. Data and instructions stored
    in primary storage before processing are transferred as and when needed to the
    ALU where processing takes place. Intermediate results generated in the ALU are
    temporarily transferred back to primary storage until needed later. Here, data
    move from primary storage to ALU and back again many times before processing is
    over.


    The type and number of arithmetic and logic operations that a computer can perform
    is determined by the engineering design of its ALU. However, almost all ALUs are
    designed to perform the four basic arithmetic operations and logical operations
    or comparisons such as less than, equal to and greater than.


    # 1.24 Control Unit


    How an input device know that it is for time to feed data to storage unit? How
    does the ALU know what should be done with the data they are received? Moreover,
    how is it that only results for output are sent to an output device and not the
    intermediate results? All this is possible due to the control unit of the computer
    system.


    Although, it does not perform any actual processing on the control unit acts as
    a central nervous system for other components of a computer system. It manages
    and co-ordinates the entire system. It obtains instructions from the program stored
    in main memory, interprets the instructions and issues signals causing other units
    of the system to execute them.'
