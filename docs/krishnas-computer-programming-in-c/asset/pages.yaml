    # 8.3.2.1 Two Dimensional Array


    The elements of the array, which we have been dealing up until now, are spread
    in one direction only, so those arrays are referred to as single dimensional arrays.
    Now the question is, what happens, if you multiple arrays placed one below the
    other, as shown in figure 8.6 and figure 8.7.


    Such an arrangement is called two dimensional array. Horizontal arrangement of
    element is called row and vertical arrangement of element is called column. In
    figure 8.8, this array consists of 5 rows and 4 columns.


    | | 0 | 1 | 2 | 3 |

    |---|---|---|---|---|n| Row | 0 | 6 | 16 | 15 | 1 |

    | | 1 | 17 | 7 | 2 | 14 |

    | | 2 | 18 | 3 | 8 | 13 |

    | | 3 | 4 | 19 | 12 | 9 |

    | | 4 | 20 | 5 | 10 | 11 |


    Fig. 8.8


    It may be noted that a two dimensional array is stored in row-major-order or column-major-order.
    In fact, most of the two dimensional array processing is also done in row major
    order in the sense that the processing proceeds from 0th row to the last row in
    the array and within a row the processing starts from 0th column to the last column
    in the row.


    # Initialization of Two-dimensional Array


    Like, initialization of one-dimensional array elements, two-dimensional array
    elements can also be initialized at the time of declaration. The syntax for two-dimensional
    array initialization is as follows :


    ```

    data_type array_name[size1][size2]={S1, S2, S3,...Sn};

    ```


    where,


    data type → basic data type


    array_name → name of a two-dimensional array


    S1, S2, S3,...Sn → initial values to assigned to n elements of array.'
