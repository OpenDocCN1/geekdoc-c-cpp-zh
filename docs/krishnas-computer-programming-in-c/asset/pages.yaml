  md: '# 1.3.2 Second Generation


    During the late 1950''s and 1960''s, commercial interest in computer technology
    intensified. The second generation of computer technology was introduced, based
    on transistors instead of vacuum tubes in first generation computers.


    Transistor is a device composed of semiconductor material that amplifies a signal
    or open or close a circuit. Second generation computers replaced machine language
    with assembly language abbreviated programming codes to replace long binary codes.


    # Advantages


    +   - Size of machine is smaller than the size of machine in first generation.

    - More speed.

    - Possibility of hardware failure is less.


    # Disadvantages


    +   - Components of computer are manually assembled.

    - Required very much maintenance.

    - It is also costly.


    For Example: UNIVAC LARC, IBM 7090


    # 1.3.3 Third Generation


    The third generation of computers are based on the technology named Integrated
    Circuit (IC). Jack Kilby (1923) and Robert Noyce (1927) were the first to develop
    the idea of the integrated circuit in 1959. The IC is a single device that contains
    many transistors. The first computer developed on this technology was IBM-360.
    It was not simply a new computer but a new approach to design the computer machine.
    During the third generation of computers, the Central Processing Unit was constructed
    by using many integrated circuit


    # Advantages


    +   - Size of machine is smaller.

    - More reliable than 1st and 2nd generation computers.

    - Required less power.


    # Disadvantages


    +   - Required air conditioning.

    - Sophisticated technology is required to manufacture integrated circuit chips.'
