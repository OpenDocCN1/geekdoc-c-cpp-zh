    \ 221 |\n\nGrand total=574\n\n# 11.8 Structure and Functions\n\nA structure can\
    \ be passed as a single variable to the function. The structure should be defined\
    \ outside the main( ) function when they are used along with any function. In\
    \ other words, the scope of the structure declaration should be an external storage\
    \ class when even a function in main( ) program in using a structure data types.\
    \ The field or member data should be same throughout the program either in main(\
    \ ) or in any function.\n\nThere are three methods by which the values of structure\
    \ can be transferred from one function to another:\n\n+   1 The first method is\
    \ to pass each member of the structure as an actual argument of the function call.\
    \ The actual arguments are treated independently like ordinary variables. This\
    \ is the most elementary method and becomes unmanageable and inefficient when\
    \ the structure size is large."
