  md: '# The Standard C Preprocessor


    Note that the return type is an integer and not a character as you might expect.
    The return type is an integer because EOF is defined as an integer in the standard
    definition stddef.h and other header files. There is another reason for this guarantees
    that the EOF flag is not a character. This is true regardless of what character
    it is using ASCII, EBCDIC or whatever. If you examine the control characters in
    ASCII, you will find no end of file. Traditionally, EOF is defined as -1, but
    this is not predicted by ANSI/ISO. An individual implementation could therefore
    choose a different value.


