  md: '# EPROM


    # 1.26.1.2


    In ROM chip or a PROM chip the information stored cannot be changed. However,
    we can achieve this difficulty by using EPROM which is Erasable Programmable Read
    Only Memory. In EPROM chip, we can erase the information stored and chip can be
    reprogrammed to store new information using a special PROM programmer facility.
    EPROM information is erased by exposing the chip for time to ultraviolet light.
    When an EPROM is in use, it can only be read and the information remains on the
    chip until it is erased. EPROM chips are of two types—one in which the stored
    information is erased by exposing the chip for some time to ultraviolet light
    and the other in which the stored information is erased by using high voltage
    electric pulses. The former is known as Ultra Violet EPROM and the latter''s known
    as Electrically-EPROM. It is easier to alter information stored in an EEPROM chip
    as compared to an UV EPROM chip.


    EEPROM is also known as flash memory of the ease with which programs stored in
    it can be altered. Flash memory is used in many new input/output and storage devices
    like USB pen drive and MP3 player.


    # 1.26.2 Random Access Memory (RAM)


    RAM stands for Random Access Memory. When people talk about computer memory, they
    usually mean the volatile RAM memory. Physically, this memory consists of some
    integrated circuits (IC) chips either on the motherboard or on a small board attached
    to the motherboard. A computer''s motherboard is designed in a manner that its
    memory capacity can be enhanced easily by adding more memory chips. Hence, if
    you decide to have more memory than your computer has, you can buy more memory
    chips and plug them into the empty memory slots on the motherboard. Service engineers
    normally do to this job. The additional RAM chips, which plug into special sockets
    on the motherboard, are known as single-in-line-memory modules (SLMMs).


