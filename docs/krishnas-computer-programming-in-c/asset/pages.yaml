    The most common unary operation is unary minus, where a minus sign precedes a
    numerical constant, a variable on an expression. In C, however, all numeric constants
    are positive. Thus, a negative number is actually an expression, having the unary
    minus operation, followed by a positive numeric constant. The unary minus operation
