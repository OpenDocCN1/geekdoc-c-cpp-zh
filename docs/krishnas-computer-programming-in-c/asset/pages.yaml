    # 12.14.12.2 Shift


    Like Alt and Ctrl, the shift key is also used in commands in combination with
    other keys. In typing, it is used the same way as on a typewriter–to produce capital
    letters.


    # 12.14.12.3 Enter


    When typing text, press enter when you want to produce a forced line feed. Enter
    is also used in combination with other keys to execute a few commands. On some
    keyboards, this key is named Return instead of Enter.


    # 12.14.12.4 Esc


    The Esc key is located to the left of the function keys in the upper left corner
    of the keyboard. It can be used to make a cancel selection in a menu.


    # 12.14.12.5 Backspace


    Pressing this key deletes the character to the left of the cursor.'
