  md: '# 58 Computer Programming in "C"


    The operating system software must keep track of each hardware resource, determine
    who gets what, determine when the user will have access to the resource, allocate
    how much of the resource the user will be given and terminate at the end of the
    user period.


    Operating systems vary in complexity from those that support single user microcomputers
    to those that handle multi-user mainframes. Their complexity depends on the computer
    system''s size and scope together with the type of performance provided to its
    users. A single stand-alone microcomputer will have a relatively simple operating
    system, whereas a mainframe that supports hundreds of users accessing the system
    simultaneously, will have one that is far more complex.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_75_0.png)


    The primary purpose of an operating system is to maximize the productivity of
    a computer system by operating it in the most efficient manner and minimizing
    the amount of human intervention required. An operating system also simplifies
    the job of computer programmers, since it includes programs that perform common
    input/output and storage operations and other standard processing functions. If
    you have any hands – experience on a computer you know that the operating system
    must be loaded and activated before you can accomplish other tasks. The emphasizes
    that operating systems are the most indispensable component of the software interface
    between users and the hardware of their computer systems.


    An operating system is a collection of programs used to control a computer system.
    The operating system is stored permanently in Read Only Memory (ROM). When the
    computer is first started it automatically begins execute a program contained
    in the operating system portion of ROM. This program reads part of the operating
    system into Random Access Memory (RAM) and the computer begins to execute this
    part of the system. The operating system program now controls the computer.'
