  md: '# 1.3.4 Fourth Generation


    The fourth generation computer was based on the technology named “Microprocessor”.
    Microprocessor employ large scale integration [LSI] and very large scale integration
    [VLSI] techniques to pack thousands or millions of transistors on a single chip.


    The Intel-4004 was the first processor to be built on a single silicon chip and
    it contained 2,300 transistors built in 1971. Microprocessor technology is now
    found in all modern computers. The chips can be built inexp and in large quantities.
    Processor chips are used as central processors and memory chips are used for dynamic
    random access memory. Both types of chips use millions of transistor etched on
    their silicon surface.


