    # 13.3.4.2 #else


    The #else directive works much like the else that is part of the C language. It
    establishes an alternative if #if fails.


    # Example 5: A simple example of #else directives.


    ```

    Solution:

    #include<stdio.h>

    #define M 100

    int main(void)

    {

    #if M>99

    printf("n compiled for array greater than 100");

    #else

    printf("n compiled for small array");

    #endif

    getch();

    }

    ```


    # 13.3.4.3 #elif


    The #elif directive means "else if" and establishes if-else chain for multiple
    compilation option. #elif is followed by a constant expression. If the expression
    is true, that block of code is compiled and no other #elif expressions are tested.
    Otherwise, the next block in the series is checked. The general form of #elif
    is


    ```

    #if expression

    statement sequence

    #elif expression1

    statement sequence

    #elif expression2

    statement sequence

    ```'
