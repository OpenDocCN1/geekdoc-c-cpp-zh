    # 1.27 Operating System


    Operating system is an integrated set of programs that controls the resources
    of a computer system and provides its users with an interface or virtual machine
    that is easier to use than the bare machine. According to this definition, the
    two primary objectives of an operating system are:


    +   1. Make a computer system easier to use: An operating system hides details
    of hardware resources from programmer and other users and provides them with a
    convenient interface for using a computer system. It acts as an intermediary between
    the hardware and its users, providing a high-level interface to low-level hardware
    resources and making it easier for programmers and other users to use resources.'
