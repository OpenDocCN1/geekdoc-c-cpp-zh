  md: "```\n{\n    char ch;\n    {\n        int i;\n    }\n\n}\n```\n\n# 5.3.3 Function\
    \ Scope\n\nThe function scope pertains to the variables declared in a function\
    \ in the sense that a variables can be used anywhere in the function in which\
    \ it is declared. Thus, we can use different variables with same names in different\
    \ functions.\n\nThe scope rules can be summarized as :\n\n+   1. A local variable\
    \ can be accessed only within the block in which it is declared. The local variable\
    \ declared in a function exists only during the execution of the function. Therefore,\
    \ these variables are also called automatic variables because they are automatically\
    \ created and destroyed.\n2. Since global variables are not declared in a particular\
    \ function, they are available to all the functions. Thus, the scope of a global\
    \ variable encompasses the entire program.\n3. The scope of a formal parameters\
    \ is local to the function in which it is defined.\n\nSince a main program could\
    \ contain many functions, in fact a function can contain other functions, one\
    \ may ask the following questions :\n\n+   (i) Could a function use a variable\
    \ declared in the main program ?\n(ii) Could a main program use a variable declared\
    \ in one of its functions ?\n\nThe scope rules answer these questions. Scope tells\
    \ if an entity is \"visible\" or accessible of certain places. Places where an\
    \ entity can be accessed or visible is referred to the scope of that entity.\n\
    \nThe simple rules are as follows :\n\n+   (a) The scope of an entity is the program\
    \ or function in which it is declared.\n(b) A global entity is visible to all\
    \ contained functions, including the function in which that entity is declared.\n\
    (c) An entity declared in the scope of another entity is always a different entity\
    \ if their names are identical."
