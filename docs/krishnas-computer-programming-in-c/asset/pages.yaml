    # 7.1.3 The for-Loop


    The while and do-while loops are used when the number of iterations is not known.
    The for-loop is used when the number of iterations is known in advance.


    The for-loop is the simplest and most commonly used loop in C. This loop consists
    of three expressions. The first expression is used to initialize the index value,
    the second is used to check whether or not the loop to be continued and the third
    is used to change the index for further iteration.


    The for loop in C is more powerful when compared to other loops. In addition to
    testing the truth of a condition, it can initialize a set of variables and give
    increment to them at the end of the loop. The structure of the for-loop in its
    simplest form can be as :


    ```

    for (exp. 1; condition; exp. 2)

    ```


    syntax of for loop

    The loop starts with the reserved word followed by :

    exp. 1 → an assignment expression which initializes index loop

    Condition → the condition which decides whether to re-enter or exit from the loop

    exp. 2 → an assignment expression which can change the loop index or some other
    variable

    semicolons : exp. 1, condition and exp. 2 must be separated by semicolons.


    This is called the body of the loop. The number of iterations required to execute
    the loop is computed by using the formula:


    ```

    Fv = iv + si

    si

    ```


    where Fv = Final value

    iv = initial value

    si = step increment'
