    # 1.13 Seven Steps to Problem Solving


    “The message from the moon... is that no problem need be considered unsolvable.”


    There are seven main steps to follow when trying to solve a problem. These steps
    are as follows:


    +   1. Define and Identify the Problem

    2. Analyze the Problem

    3. Identifying Possible Solutions

    4. Selecting the Best Solutions

    5. Evaluating Solutions

    6. Develop an Action Plan

    7. Implement the Solution


    # 1.13.1 Define and Identify the Problem


    This first step is critical. It is essential for each group member to clearly
    understand the problem so that all energy will be focused in the same direction.
    A good way to define the problem is to write down a concise statement that summarizes
    the problem, and then write down where you want to be after the problem has been
    resolved. The objective is to get as much information about the problem as possible.
    It may be helpful to divide the symptoms of the problem into hard and soft data.


    Soft Data Includes: Feelings, opinions, human factors, attitudes, frustrations,
    personality conflicts, behaviors, hearsay, intuition.


    These steps may not be pleasant, but after “venting” group participants may feel
    that the air has clearly cleared and members can be more rational and cooperative.


    Information needs to be gathered via various devices to define the problem. These
    devices may include: Interviews, statistics, questionnaires, technical experiments,
    check sheets, brainstorming and focus groups.


    # Develop a Problem Statement


    It is essential to develop an objective statement that clearly describes the current
    condition of your group wishes to change. Make sure the problem is limited in
    scope so that it is small enough to realistically tackle and solve. Writing the
    statement will ensure that everyone can understand exactly what the problem is.
    It is important to avoid including any “implied cause” or “implied solution” in
    the problem statement. Remember, a well stated is a problem half solved.'
