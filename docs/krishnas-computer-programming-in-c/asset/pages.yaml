  md: '# 2.7 ASCII


    ASCII stands for American Standard Code for Information Interchange. This code
    is popular in representing data in micro computer.


    ASCII codes are of two types :


    +   1. ASCII-7


    +   2. ASCII-8


    +   ASCII-7 : It is a seven bit code. First three bits are used as zone and last
    bits indicate the digit. Micro computer using 8-bits, use the 7-bit ASCII by leaving
    the leftmost bit of each type as a zero.


    +   ASCII-8 : It is an extended version of ASCII-7. It is the additional bit is
    added to zone bit.


