  md: '# ### 3.3.2 Planning the Solution


    Planning the Solution means finalizing all steps that are to be carried out for
    solving the problem. This step is often referred to as algorithm development or
    logic development phase.


    +   (i) What are the minimum number of inputs that are required for the solution
    and how data will be accepted within the program ?


    +   (ii) How will other information gets or you can say, how processing will be
    done ?


    +   (iii) How and where printing will be done and what methods will be required
    for generating the desired output ?


    +   (iv) If the data has to be processed for many identities you will have to
    decide the strategy for repeating the steps. For repeating the steps, you will
    have to form a loop by incorporating suitable conditions, using which loop executes
    as many times as required and after that it breaks for finishing the task.


    # ### 3.3.3 Coding


    Refer all mentioned steps and note that these steps are simply a plan for attaining
    a solution, not the exact solution. The exact solution has to exist in the form
    of commands in computer language. While planning the solution above mentioned
    steps are written in general English. In the coding phase of programming cycle,
    you have to translate the steps of solution plan into computer language. These
    translated steps in the form of computer language are called “Program” and this
    procedure of translation is called “Coding”.


    # ### 3.3.4 Editing, Compiling and Executing


    In this phase, program is written on computer using a text editor. After entering
    the program it is compiled so that the sentences of the program gets converted
    into machine language. When the program has been compiled you have to execute
    the program. When you execute the program, all the steps of the program come into
    action and produce the result accordingly.


    # ### 3.3.5 Debugging


    Newly developed program may few error in it. These errors can occur due to various
    reasons. Either you may have forgotten some of the steps or you may have performed
    wrong operations or you may have used wrong logic in the program. All such types
    of errors have to be found in the program and corrected that the program gives
    correct results. The process of finding mistakes in the program and correcting
    them is called Debugging.'
