  md: "A structure is a meaningful collection of data items of different type under\
    \ a unique name. Thus, structure allows the programmer to create and manipulate\
    \ a set of different types of data items. In C, all these data items can be grouped\
    \ together in one structure using the reserved word ‘struct’.\n\nIn defining a\
    \ structure you may note the following syntax:\n\n+   1. The template is terminated\
    \ with a semicolon.\n2. While the entire definition is considered as a statement,\
    \ each member is declared independently of its name and in a separate statement\
    \ inside the template.\n3. The tag name such as structure name can be used to\
    \ declare structure variables of its type, later in the program.\n\n# 11.3 Array\
    \ vs Structures\n\nBoth the arrays and structures are classified as structured\
    \ data types as they provide a mechanism that enable us to access and manipulate\
    \ data in a relatively easier manner. But they differ in a number of ways :\n\n\
    +   1. An array is a collection of related data elements of same type, structure\
    \ can have elements of different types.\n2. An array is derived data type whereas\
    \ a structure is a programmer defined.\n3. Any array behaves like a built in a\
    \ data type. All we have to do is to declare an array variable and use it. But\
    \ in the case of a structure, first we have to design and declare a data structure\
    \ before the variables of that type are declared and used.\n\n# 11.4 Declaration\n\
    \nA structure contains a keyword ‘struct’ along with structure name which is followed\
    \ by the curly braces, which contains different components/elements/member of\
    \ the structure of various data types.\n\nEach and every structure must be defined\
    \ and declared before it appears in a C program. The general form of structure\
    \ definition and declaration are as :\n\n```\nstruct<name>\n{\n    variable type1;\n\
    \    variable type2;\n    variable type3;\n    ...\n    variable typen;\n}structure\
    \ variable;\n```"
