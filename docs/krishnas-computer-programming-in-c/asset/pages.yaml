  md: '# Introduction to Computer System


    ROMs are mainly used to store programs and data that are frequently used. Most
    basic computer operations are carried out by wired electronic circuits. However,
    several higher-level and frequently used operations require very complicated electronic
    circuits for their implementation. Hence, instead of building electronic circuits
    for these operations, special programs are written to perform them. These programs
    are called micro-programs because they deal with low-level machine functions and
    are essentially subsystems for additional hardware. ROMs are used by computer
    manufacturers to store such micro-programs so that they cannot be modified by
    users.


    A good example of a micro-program is the set of instructions needed to make a
    computer system ready for use when it is powered on. The micro-program "system
    boot program", contains a set of start-up instructions to check if the system
    hardware like memory, Input/output devices are functioning properly. It looks
    for an operating system and loads its core part in the volatile ROM of the system
    to produce the initial display-screen prompt. Note that this micro-program is
    used every time the computer is switched on and needs to be retained when the
    computer is switched off. Hence, ROM is an ideal storage for storing it.


    # 1.26.11 PROM


    PROM is a variation of ROM. ROM chips are supplied by the computer system manufacturer
    and it is not possible for a customer to modify the programs stored inside the
    ROM chip. However, it is possible for the user to customize a system by converting
    his own micro programs and storing them in a PROM chip, which can usually be executed
    in a fraction of the time previously required. PROMs are programmed to record
    information using a special facility as a prom-program. However, the chip has
    been programmed and the recorded information cannot be changed, *i.e.*, the PROM
    becomes ROM and it is only possible to recover the stored information. PROM is
    also non-volatile.


    PROM stands for Programmable Read Only Memory. There are two types of read only
    memory (ROM)-manufacturer-programmed and user. A manufacturer-programmed ROM is
    one in whose data is burnt in it. For example, a personal computer manufacturer
    may store the system boot program in a micro-programmed ROM chip on the motherboard
    of each PC manufactured by it. Similarly, a printer manufacturer may store the
    controller software in a PROM chip. Manufacturer-programmed ROMs are used mainly
    in those cases where the demand for such programs is large. That manufacturer-programmed
    ROM chips are supplied by the manufactures of electronic equipment and it is not
    possible for a user to modify the programs or data stored in a ROM chip. On the
    other hand, a user programmed ROM is one in which a user can load and store "read
    only" programs to micro-programs and storing them in a user-programmed ROM chip.
    It is possible to "customize" a system by converting his micro-programs and storing
    in a user-programmed ROM chip. Such a ROM is commonly known as Programmable Read-Only
    Memory (PROM) because a user can program it. The user programs are stored in a
    PROM chip which can then be executed usually in a fraction of the time previously
    required. PROMs are programmed to record information using a special device known
    as PROM-programmer. However, the chip has been programmed, the PROM becomes a
    ROM. That is, the information recorded in it can only read. PROM is also non-volatile,
    *i.e.*, the stored information remains intact-even if power is switched off or
    interrupted.'
