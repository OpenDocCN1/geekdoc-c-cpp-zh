  md: '# 12.6 Linux Programs


    Linux applications are represented by two special types of files:


    +   1. Exentable

    2. Scripts


    Exametable files are programs that can be run directly by the computer, they correspond
    to windows -exe files.


    Scripts are collections of instructions for another program, an interpreter, to
    follow. These correspond to Windows but without cnd files, or interpreted BASIC
    programs.


    Linux doesn''t require exametable or scripts to have a specific filename or extension
    whatsoever. In Linux, you can replace scripts with compiled programs without affecting
    other programs or the people who call them. In fact, at the user level, there
    is essentially no difference between the two.


    When you log in to a Linux system with a shell program that runs program in the
    same way that the windows command prompt does. It funds the programs for your
    name by searching for a file with the same name in a set of directories.


    The directories search are stored in a shell variable, PATH, in the same way as
    with windows. The search path is configured by your system administrator and will
    usually contain some standard places system programs are stored. These include:


    +   1. /bin Binaries, programs used in booting the system.

    2. /usr/bin User binaries, standard programs available to users.

    3. /usr/local/bin Local binaries, programs specific to an installation.


    An administrator''s login, such as root may use a PATH variable that includes
    directories where system administration programs are kept as such


    ```

    /sbin and /usr/sbin.

    ```


