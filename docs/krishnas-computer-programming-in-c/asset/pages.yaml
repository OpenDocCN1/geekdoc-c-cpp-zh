    # 1.6.1 Super Computers


    Super computers are the fastest calculating devices ever invented. A desktop micro
    computer processes data and instructions in milliseconds of a second, or microseconds.
    A super computer, by contrast, can operate at speed measured in nanoseconds and
    even in picoseconds-one to one million times fast as micro computer.


    Super computers are used to create and analyze models of nuclear fusion and fission,
    predicting the actions and reactions of millions of all atoms as they interact.


    Super computers help in analysing weather patterns, like pollution, shedding light,
    global warming and the depletion of the earth''s ozone layer.


