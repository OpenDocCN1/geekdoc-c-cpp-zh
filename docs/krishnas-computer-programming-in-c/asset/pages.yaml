    +   1. They are built, using high performance and high capability processors.


    +   2. Memory size in type of computers is generally very large.


    +   3. They support multiple terminals, which may range from 2 to 16.


    +   4. They provide facility to connect multiple printers.


    # 1.6.4 Work Stations


    Somewhere between multiuser mid range computers and personal computers are workstations.
    Workstations are specialized, single user computers with many of the features
    as personal computer but with the processing power of a mini computer. The powerful
    machines are popular among scientist engineers, artists, animators and programmers
    who need a great deal of crunching power. Workstations typically use advanced
    processors and feature more RAM and storage capacity than personal computers.
    Workstations have high resolution monitors and accelerated graphics-handling making
    them perfect for advanced design, modelling, animation and video-editing.


    # 1.6.5 Micro Computers


    A Micro computer is the smallest, least expensive of all the computers. The prefix
    micro refers mainly to the physical size of the computer and its circuitry, rather
    than its capabilities. The main differences between micro computer and mainframe
    or mini computer are that micro computers have smallest memory and less power,
    are physically smaller and permit fewer peripherals to be attached. Micro computers
    are also called personal computers.'
