    # 1.21.2.4 Chain/Band Printers


    Chain/Band printers are line printers that print one line at a time. It consists
    of a metallic chain/band on which all of the character set supported by the printer
    are embossed. A standard character may have 48, 64 or 96 characters. In order
    to enhance printing speed, the characters in the character set are embossed several
    times on the chain/band. For example, the chain/band of a 64 character set printer
    may have four sets of 64 characters each embossed on it. In this case, the chain/band
    will have altogether 256 (64 × 4) character embossed on it.


    The printer has a set of hammers mounted in front of the chain/band in a manner
    that an inked ribbon and paper can be placed between the hammers and chain/band.
