  md: "# 11.6 Structures within Structures (Nested Structure)\n\nNested structures\
    \ are structures as member of another structure.\n\nStructures within structures\
    \ mean nesting of structures. Nesting of structures is permitted in C. Let us\
    \ consider the following structure defined to store information about the employee's\
    \ salary.\n\n```\nstruct salaryemp\n{\n    char name;\n    char company;\n   \
    \ float basic_salary;\n    float dearness_allowance;\n    float house_rent_allowance;\n\
    \    int age;\n}employee;\n```\n\nThis structure define name, company, basic salary\
    \ and two kinds of allowances. We can group all the items related to allowance\
    \ together and declare them under a substructure as shown below :\n\n```\nstruct\
    \ salaryemp\n{\n    char name;\n    char company;\n    struct pay\n{\n       \
    \ float dearness;\n        float house_rent;\n    }allowance;\n}employee;\n```\n\
    \nwe can also use tag name to define inner structures.\n\nFor Example:\n\n```\n\
    struct pay\n{\n    float dearness;\n    float house_rent;\n}\nstruct salary\n\
    {\n    char name;\n    char company;\n    struct pay allowance;\n    struct pay\
    \ dearness;\n}\nstruct salaryemp[100];\n```"
