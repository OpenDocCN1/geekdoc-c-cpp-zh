    # 1.43 Error Handling


    Error handling refers to the anticipation, detection, and resolution of programming
    application; and communications errors. Specialized programs, called error handlers
    are available for some applications. The best programs of this type forest editors
    if possible recover from them when they occur without terminating the application
    or terminate an affected applications and save the error information to a log
    file.


    In programming: a development error is one that can be prevented, such an error
    can occur in syntax or logic.


    Syntax errors, which are typographical mistakes or improper use of special characters
    are handled by rigorous proof reading.


    Logic errors, also called bugs, occur when executed code does not produce the
    expected or desired result. Logic errors are best handled by meticulous program
    debugging. This can be an going process in addition to the traditional debugging
    routine, beta testing prior to official release and customer feedback after official
    release.


    A run time error takes place during the execution of a program and usually happens
    because of adverse system parameters or invalid input data.


    An example is the lack of sufficient memory to run an application or a memory
    conflict with another program. On the internet, run time errors can result from
    electrical noise, various forms of malware or an exceptionally heavy demand on
    a server. Run time errors can be resolved; or their impact minimized, by the use
    of error handler programs, vigilance on the part of network and server administrators
    and by security counter measures on the part of internet users.


