    # 3.7 Comments


    Although it is reasonable to expect that a good programmer should be able to read
    code, sometimes the meaning of a section of code is not entirely clear. This is
    especially true in C. Thus, it is helpful if the person who writes the code places
    some comments in the code to help the reader. Such comments are merely internal
    program documentation. The compiler ignores these comments when it translates
    the program into executable code. To identify a comment, C uses two different
    block comments and line comments.'
