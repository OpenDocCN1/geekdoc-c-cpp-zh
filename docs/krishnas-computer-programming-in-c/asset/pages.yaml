    The reason for this behaviour is that at the time of function call, the values
    of actual parameters a and b get copied into the memory location of formal parameters
    x and y of the function exchange( ), as in figure 5.5.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_278_0.png)


    From figure 5.5 it is clear that the variables x and y have entirely different
    memory locations from variable a and b.


    Therefore, any changes to the contents of x and y are not reflected back to the
    variable a and b. Thus, the original data remains unaltered. In fact, this type
    of behaviour is desirable from a pure function.


    Since this type of parameter passing, only the values are passed from the calling
    function to the called function, the technique is called as call by value.


    # 5.5.1.2 Call by Reference


    If the programmer desires that the changes made to the formal parameters be reflected
    back to their corresponding actual parameters he should use call by reference
    method of parameter passing. This technique passes the addresses or references
    of actual parameters to the called function.


