  md: '# 5.2.1 Function Prototypes


    Similar to variables, all functions must be declared before they are used in a
    program. C allows the declaration of a function in the calling program with the
    help of function prototype. The general form of a function prototype in the calling
    program is given :


    ```

    <type><name>(arguments);

    ```


    where type → The type of value to be returned by the function.

    name → A user defined name of the function

    argument → A list of parameters

    ; Semicolon is necessary


    For example, the prototype declarations for the function tri_area(), clear() and
    add() can be written as shown below :


    ```

    void tri_area();

    void clear();

    void add(int x, int y);

    ```


    It may not noted that a function prototype ends with a semicolon. Infact, a function
    prototype is required for those functions which are intended to be called before
    they are defined. In absence of a prototype, the compiler will stop at the function
    call because it cannot do the type checking of the arguments sent to the function.Therefore,
    the main purpose of function prototype is to help the compiler in static type
    checking of the data requirement of the function.


    When we place the function prototype above all the functions (including main());
    it is known as global variable or global prototype. A prototype declared in global
    environment is available for all the functions in the program.


    When we place the function prototype inside the definition of another function,
    the prototype is known as local prototype. Such declarations are primarily used
    by the functions containing them.


    It is a good programming style to have global prototype for adding flexibility
    and enhance documentation. Function prototypes are not mandatory in C. There are
    desirable, however, because these help in error checking between the calls to
    a function and the corresponding function definition.


    # 5.2.2 Calling a Function


    A function can be called or invoked from another function using its name. The
    function name must be followed by a set of actual parameters, in parenthesis separated
    by comma. A function call to function tri_area from the main program can be written
    as :


    ```

    tri_area();

    ```


    This statement will transfer the control to function tri_area. Since this function
    does not require any parameter, the argument list is empty. Similarly, in order
    to call the function clear, the following statement will be sufficient.


    ```

    clear();

    ```'
