  md: '# 1.28.5 Operating in Batch Mode


    Most operating systems allow for operating in batch mode. Batch processing handles
    input data items in batches rather than one at a time. Batch mode is similar,
    as it refers to programs rather than data. In batch, the user can instruct the
    operating system to execute a list of programs one after the other. The list of
    programs is given in a file. The user instructs the operating system to either
    perform the commands without further user intervention or to request certain data
    as each task is started. Batch mode can greatly simplify execution of long or
    complex lists of programs, especially if the same list is run repeatedly.


    # 1.28.6 Providing Services


    An operating system provides services that the programmer can use to control the
    computer system.


    # 1.28.7 Job Management


    Job software manages the jobs waiting to be processed. It recognizes the jobs,
    identifies their priorities, determines whether the appropriate main memory and
    secondary storage capability they require is available and schedules and runs
    each job at the appropriate moment.


    # 1.28.8 Batch Processing


    System software is available to support the different methods of processing a
    job. With batch processing, the most basic method, data are accumulated and processed
    in groups. Payroll applications for example, are often processed this way. In
    every week, hourly records are grouped and the payroll software is run.


    # 1.28.9 On-line Processing


    In-line processing, data are processed instantaneously.


    # 1.28.10 Data Management


    In the process of managing the resources of the computer system, operating system
    software handles many of the details associated with this process. Such details
    are not a primary concern for users or programmers writing application programs.


    # 1.28.11 Virtual Storage


    Operating systems also manage the allocation of main memory to specific jobs.
    Some operating systems have a feature called virtual storage, with this software
    is possible to increase the capacity of memory without actually increasing its
    size. This is achieved by breaking a job into sequences of instructions, called
    pages or segments and keeping only few of these in main memory at a time. The
    reminder are kept on secondary storage devices. As a result, relatively large
    jobs can be processed by a CPU that in fact contains a relatively small memory.


    # 1.28.12 Input/Output Management


    Operating systems also manage the input to and output from a computer system.
    This applies to the flow of data among computers, terminals and other devices
    such as printers. Application programs use the operating system extensively to
    handle input and output devices as needed.'
