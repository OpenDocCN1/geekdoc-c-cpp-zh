  md: '# 12.4 Linux Distributions


    As we have already mentioned, Linux is actually just a kernel. You can obtain
    the sources for the kernel to compile and install it on a machine and then obtain
    many other freely distributed software programs to make a complete Linux installation.
    These installations are usually referred to as Linux systems, because they consist
    of much more than the kernel. Most of the utilities come from the GNU project
    of the Free Software Foundation.


    As you can proudly appreciate, creating a Linux system from source code is a major
    undertaking Fortunately, many people have put together ready-to-install distributions,
    usually down-loadable or on CD-ROMs or DVDs that do not just the kernel but also
    many other programming tools and utilities. There often include an implementation
    of the X-window system, a graphical environment common on many UNIX systems. The
    distributions usually come with a setup and additional documentation to help you
    install your own Linux system. Some well known distributions particular on the
    X86 family of processors, are Red Hot Enterprises and its community developed
    cousin Fedora, Novell SUSE Linux and the free open SUSE variant, Ubuntu Linux,
    Stockware, Gentoo and Debian GNU/Linux.


    # 12.5 Programming Linux


    Many people think that programming Linux means C. It''s true that UNIX was originally
    written in C and that the majority of UNIX applications are written in C, but
    C is not the only option available to Linux programmers, or UNIX programmers for
    that matter.


    A vast range of programming languages are available for Linux systems, and many
    of them are free and available on CD-ROM collections or from FTP archive sites
    on the internet. Here''s a partial list of programming languages available to
    the Linux programmer:


    | Ada | C | C++ |

    |---|---|---|

    | Eiffel | Forth | Fortran |

    | Icon | Java | Java Script |

    | Lisp | Modula 2 | Modula 3 |

    | Oberon | Objective C | Pascal |

    | Perl | Post Script | Prolog |

    | Python | Ruby | Smalltalk |

    | PHP | Tcl/Tk | Bourne shell |'
