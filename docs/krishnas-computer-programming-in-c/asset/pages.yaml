  md: '# 10.8 Pointers and Arrays


    An array is a collection of homogeneous/similar type of elements stored in adjacent
    memory locations. Therefore, it is used in the situation to store more than one
    value at a time in a single variable. Arrays and pointers have a close link, array
    itself acts like a pointer, as one element in the array is stored adjacent to
    the previous. Therefore, while displaying the elements of array, the next address
    is automatically called, when its previous element is displayed. But in case of
    pointers with arrays, the element can be stored at different locations and can
    be called from that location when needed.


    +   1. Array elements are always stored in memory location continuously.

    2. The incrementation or decrementation of pointer leads to incrementation or
    decrementation of addresses based on the type of pointer defined.


    In the following examples, ''a'' is an array


    | Array Access | Pointer Equivalent |

    |---|---|

    | a[0] | *a |

    | a[1] | *(a+2) |

    | a[2] | *(a+n) |


    There are some differences between arrays and pointers. The array is treated as
    a constant in the function when it is declared.

    pass to a function and modify elements of that array without having to worry about
    referencing and de-referencing. Since the array is implemented as a hidden pointer,
    the difficult stuff gets done automatically.

    Pointers and arrays are very closely related to each other. In C, the name of
    the array is a pointer that contains the base address of the array. Infact, it
    is a pointer to the first element of the array. Consider the array declaration
    given below :

    int[]={30,35,40,41,46};

    This array will be stored in the contiguous locations of the main memory as shown
    in figure.


    | list | 30 | 35 | 40 | 41 | 46 |

    |---|---|---|---|---||}{

    | 1000 | 1002 | 1004 | 1006 | 1008 |


    Fig. 6.6


    Since the array is list of integer type, each element of this array occupies two
    bytes. The name of the array contains the starting address of the array. Thus,
    the list contains the address 1000.

    When an array is declared the compiler allocates a base address and sufficient
    amount of storage to contain all the elements of the array in contiguous memory
    locations. The base address is the location of the first element of the array.
    The compiler also defines the array name as a constant pointer to the first element.

    int x[8]={9,6,7,1,5,10,100,90}'
