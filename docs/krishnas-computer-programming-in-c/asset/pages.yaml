  md: '# Computer Programming in "C"


    Emphasis on good response times, rather than on efficient use or through put,
    requires use of new design principles and techniques. The notion of a job is no
    longer relevant an interactive user interface has to be designed and new scheduling
    and memory management techniques are needed to provide good response times to
    a large number of users.


    # 1.33.2 Scheduling


    User service in a time sharing system is characterized by response times to user
    requests, so the time sharing kernel must provide response times to all users.
    To realize this goal users must get an opportunity to present their computational
    requests and have been serviced. Each user must also receive reasonable service.
    Two provisions are made to ensure this:


    +   Programs are not assigned priorities because assignment of priorities may
    deny operating system attention to low priority programs. Instead, programs are
    executed by turn.


    +   A program is prevented from consuming unreasonable amounts of CPU time when
    scheduled to execute. This provision ensures that every request will receive operating
    system attention without unreasonable delays.


    # 1.34 Single User Operating System


    Allow only one user to run programs at a time. The most popular example is MS-DOS
    used on personal computer.


    # 1.35 Multi-User Operating System


    Allow two or more users to run programs at the same time. Some operating systems
    permit hundreds or even thousands of concurrent users. UNIX/LINX Win NT/ME/2000-2003
    etc. are widely used multi-user operating systems.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_87_0.png)


