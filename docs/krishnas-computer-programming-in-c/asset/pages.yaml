    # 3.3 Program Development Life Cycle


    Program development is not a single activity but a multi-process step. Each step
    comprises specific type of activities. All the steps of program development put
    through are often referred to as Program Development Life Cycle. Steps of program
    development life cycle are listed :


    +   1. Understanding the problem

    2. Planning a solution

    3. Coding

    4. Editing, compiling and executing

    5. Debugging

    6. Documentation


    # 3.3.1 Understanding the Problem


    Before we describe the activities of this phase, let us first understand, what
    is a Problem (). Any task that is to be performed using computer is called Problem
    in computer technology.


    For writing a program, you have to understand the problem first, unless you understand
    the problem clearly you will not be able to write the program.


    Once you have studied the problem in detail and gathered all the information,
    which is sufficient for writing the program, you can move to the next step of
    program development life cycle i.e., planning the solution.'
