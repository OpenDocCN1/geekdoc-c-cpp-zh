    printf("%n i=%d",i);

    j=value(i);/*Function reference*/

    printf("%n j=%d",j);

    getch();

    }/*end of main*/

    int value(i)

    int i;

    {

    int k;/*k is local variable*/

    k=i+10;

    return(k);

    }/*end of function*/


    ```


    Output: i=10

    j=20'
