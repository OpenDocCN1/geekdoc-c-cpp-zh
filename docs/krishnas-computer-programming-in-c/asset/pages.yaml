  md: "# 6.1.1 Simple and Compound Statement\n\nA simple statement is an expression\
    \ statement. That is, it consists of an expression followed by a semicolon. The\
    \ execution of such a statement involves the evaluation of an expression. For\
    \ example :\n\n```\nint a=20;\nfloat b;\nb=a+4.0;\n```\n\nHere,\n\nb=a+4.0 is\
    \ a simple statement\n\nA null statement is also a simple statement. It is useful\
    \ when the language stresses the need for a statement and does not require any\
    \ logic.\n\n**For Example:** If you want to start printing the characters from\
    \ the fifth element onwards in a character array, simply pass the first character\
    \ in that array. This is done as follows :\n\n```\nfor (i=1;i<4;i++)\n{\n    //\
    \ null statement\n}\nread pos=i;\n```\n\n```\nc=a+b;\n```\n\nThere are two statements:\n\
    \n+   1. One is the straight forward assignment statement (c=a+b) which assigns\
    \ the sum of the contents of a and b to c.\n2. One is the null-statement. This\
    \ statement will not cause any compilation error.\n\nA compound statement consists\
    \ of several individual statements enclosed within a pair of braces. A compound\
    \ statement helps in embedding statements. Remember these points :\n\n+   (i)\
    \ Unlike a single statement, a compound statement does not terminate with a semicolon.\n\
    (ii) In a compound statement, the individual statement may be single on compound\
    \ statement.\n(iii) Like a null statement, a null compound statement may appear\
    \ in a program.\n(iv) A compound statement can appear anywhere within a C program.\n\
    (v) A compound statement is a block statement and emphasizes the local scope of\
    \ variables."
