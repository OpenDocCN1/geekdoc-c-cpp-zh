  md: '# # Chapter 11 UNIT-4 Structures


    # ## 11.1 Introduction


    Structure is a collection of heterogeneous type of data i.e.,different types of
    data. The various individual data components in a structure can be accessed and
    processed separately. A structure is a collection of variables referred under
    one name, providing a convenient means of keeping related information together.
    A structure declaration forms a template that may be used to create structure
    objects.


    There are various points of similarity and dissimilarity between structures and
    arrays. The structures and arrays are different from each other on the bass of
    two main points :


    +   - Array is a collection of homogeneous i.e., same type of elements, whereas,
    structure is a collection of heterogeneous i.e., different type of elements.

    - An array element is referenced by its position, whereas, each element/component
    of structure has a unique name. The point on which the array and structures can
    be similar is that both array and structure must be defined with a definite number
    of components.


    | Student | Structure |

    |--- |--- |

    | Roll number | int data type |

    | Age | int data type |

    | Religion | char data type Members of Structures |

    | Fees | float data type |


    Fig. 11.1'
