  md: 'Most new monitors are SVGA (Super Video Graphics Adapters), with a pixel configuration
    of 800 by 600 at low resolution mode and 1024 by 768 at high resolution mode.
    The first number designates the horizontal pixel, count and the second is the
    vertical pixel. The higher resolution, with more pixels, provides a cleaner more
    detailed image. Each pixel displays a single color at a time. Each color is represented
    by a numeric code. For example, bright and by 12. If the monitor displays only
    16 colors, the numeric code can be represented with only 4 bits. To display 256
    colors requires eight bits.


    One monitor may look "sharper" than another, even though they may have the same
    pixel configuration. This is due to the dot pitch, which is the distance between
    pixels. A 28 dot pitch gives a crisper image than a 30 dot pitch. The 28 dot pitch
