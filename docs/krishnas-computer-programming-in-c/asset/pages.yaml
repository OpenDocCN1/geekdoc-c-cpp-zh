  md: '# # Chapter UNIT-2 Computer Programming In C


    # # Function


    #  5.1 Function


    Function is a software design technique that increases the extent to which software
    is composed of separate parts, called the Modules or Functions.


    Function can often be performed even where the language lacks explicit syntax
    or semantics to support modules. The use of libraries hooked together by a linker
    is a common mechanism for separating parts of the software into distinct modules.


    Segmenting a program into manageable chunks is a very important aspect to programming,
    following are the reasons for segmenting :


    +   1. Dividing the program into a number of separate functions allow each function
    to be written and tested separately.

    2. Several functions are easier to handle and understand than one huge function.


    +   3. Libraries are sets of functions that people tend to use all the time. Because
    they have been pre-written and presented, we know they work, so we can use them
    without worrying about this code details. This will accelerate our program development,
    by allowing us to concentrate on our own code, and it is a fundamental part of
    the philosophy of C. The richness of libraries greatly amplifies the power of
    language.


    # ## 5.1.1 Advantages of Function


    If a program is lengthy, it becomes very difficult for the programmer to handle
    it. Normally, larger programs are more prone to errors and it will be a tedious
    job to locate and correct these errors. Therefore, such programmes should be broken
    down into a number of smaller units is called modularisation. Programming with
    such an approach is called modular programming.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'There are many advantages of modularisation. Some of them are listed below:


    +   (i) It is a particular set of instructions which are to be accessed repeatedly
    from several different places within a program, then we can make this group of
    instruction as one module and call whenever necessary. This avoids rewriting of
    functions on every access. It is also called as rewriting of functions on every
    access. It is also called as usability.


    +   (ii) Since each module is smaller and clearer, the user can easily locate
    the errors and correct them. It also makes debugging easier.


    +   (iii) It allows the programmer to build a library of most commonly used sub-programs.
    This reduces time and space complexity. It also promotes portability. It is also
    known as Bulid Library.


    # 5.2 Function in C


    A function in C can perform a particular task, and supports the concept of modular
    programming design techniques. When your program is complicated, the function
    declaration divide it into smaller steps and on logics to simplify the complexity
    of program. For this reason, the function are implemented. Also by declaring functions
    the program size get reduced into smaller parts and all the function code are
    stored in only one place in the memory.


