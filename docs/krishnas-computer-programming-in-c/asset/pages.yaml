  md: '# The Standard C Preprocessor


    This is a process of inserting external files containing functions or macro definitions
    into the C program. This avoids rewriting functions or macro definitions. An external
    file function can be included in a C program using the #include. The syntax of
    #include is as follows :


    #include file name


    where,

    #include -> Preprocessor directive for file inclusion

    file name -> Name of the title required function definition to the included in
    a C program.


    For Example:


    ```

    #include<stdio.h>

    #include<conio.h>

    #include<math.h>

    #include"Grade.c"

    #include"Fact.c"

    ```


    When these statements appear in a program, the preprocessor inserts the entire
    code of function or macro at that point. When the file is written within a pair
    of angle brackets, the specified file is searched only in the standard directories.


    The first and most common job of a preprocessor is file inclusion, the copying
    of one or more files into programs. The files are usually header files that contain
    function and data declarations for the program, but they can contain C statement.


    The preprocessor command is # include; it has two different formats. The first
    format is to direct the preprocessor to include header files from the systems
    library. In this format, the name of the header file is enclosed in pointed brackets.
    The second format makes the preprocessor look for the header-files in the user-defined
    directory. In this format, the name of the file pathname is enclosed in double
    quotes. The two formats are shown below:


    ```

    #include < filename.h>

    #include"filepath.h"

    ```


    # 13.3.4 Conditional Inclusion


    Conditional inclusion is used for conditional selection of parts of the source
    file. Conditional selection is rarely performed using #defined values.


    # 13.3.4.1 #if and # endif


    #if evaluates a constant integer expression. You always need a #endif to delimit
    end of statement.


    The general form of #if is :


    ```

    #if constant-expansion

    statement sequence

    ```


    ```

    #endif

    ```


    If the constant expression #if is true, the code that is between it and #endif
    is completed. Otherwise, the intervening code is skipped. The #endif directive
    marks the end of an #if block.'
