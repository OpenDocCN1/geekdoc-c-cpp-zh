  md: '# 1.25 Central Processing Unit


    Control unit (CU) and Arithmetic logic unit (ALU) of a computer system are together
    known as the Central Processing Unit (CPU). The CPU is the brain of a computer
    system. In a human body the brain takes all major decisions and other parts of
    the body function as directed by the brain. Similarly in a computer system, all
    major calculations and comparisons take place inside the CPU and the CPU is responsible
    for activating and controlling the operations of other units of the computer system.


    # 1.26 Memory and Its Types


    Memory is also known as primary memory or Main memory is a part of micro computer
    that holds data processing, instructions for processing the data and information.
    Part of the contents of the memory is held only temporarily, that is stored only
    as long as the micro computer is turned on. When the machine is turned off all
    the contents are lost. The capacity of the memory to hold data and program instructions
    in different computers. The original IBM PC could hold an approximate 644,000
    characters of data or instructions only. But modern computers can hold millions
    and billions of characters in their memory. The type of memory discussed above
    is commonly known as RAM, ROM, PROM and EPROM.


    # 1.26.1 Read Only Memory (ROM)


    In Read Only Memory is permanently stored. The information from the memory can
    only be read and it is not possible to write fresh information into it. That''s
    why it is called ROM. When the power is switched off, the information inside the
    ROM is not lost as it is in the case of ROM chip. Such memories are also known
    as file stores, permanent stores or dead stores.


    A special type of Hard disk is called the ROM (Read Only Memory), it is a non-volatile
    memory chip in which data is stored permanently and cannot be altered by usual
    programs. In fact, storing data permanently into this kind of memory is called
    "burning the data" because data in such memory is stored by fuse-links. Once a
    fuse-link is burnt, it is permanent. Data stored in a ROM chip can only be read
    and used-cannot be changed. Since ROM chips are non-volatile, data stored in a
    ROM are not lost when power is switched off or interrupted unlike the case of
    a volatile RAM chip. ROMs are also known as field stores, permanent stores or
    dead stores.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_71_0.png)


    Fig. 1.30: Read Only Memory'
