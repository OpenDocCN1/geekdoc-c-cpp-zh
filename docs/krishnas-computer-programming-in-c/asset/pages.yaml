- img_proc: true
  md: '# # Syllabus

    ## Computer Programming in "C"

    ### 1st Semester, B.Tech.

    ### Mahamaya Technical University, Noida


    # ## Unit-1


    Introduction to Computer System: Hardware, Software-system software, & application
    software; Introduction to Computing Environment; Introduction to Problem solving
    and notion of algorithm: Flow chart, Pseudo code, corresponding sample C-programming,
    Testing the code; Number Systems and their conversion: Decimal, Binary and Hexadecimal
    representations, bit, byte; Character representation: ASCII, sorting order; System
    software re-visited: machine language, symbolic language, what is a linker, what
    is an editor, error handling; Introduction to programme development.


    # ## Unit-2


    Structure of a C-program, comments, identifiers; Identifiable Data Types: Character
    types, Integer, short, long, unsigned and double-precision floating point; complex,
    boolean, constants; Basic Input/Output: printf, formatting, scancf;; Operators
    and Expressions: Using numeric and relational operators, mixed operands and type
    conversion, Logical operators, Bit operations, Operator precedence and associativity;
    C in standard function, defining a function, inter-function communication-passing
    arguments by value, scope rules and global variables; Top-down program development.


    # ## Unit-3


    Conditional Program Execution: Applying if and switch statements, nesting if and
    else, restrictions on switch values, use of break and default with switch; Program
    Loops and Iteration: Uses of while-do and for loops, multiple loop variables,
    assignment operators, using break and continue; Arrays: Array notation and representation,
    manipulating array elements, using multidimensional arrays, arrays of unknown
    or varying size.


    # ## Unit-4


    Sequential search, Sorting arrays; Strings; Recursion; Text files, file Input/Output
    – fopen, fread etc Structures: Purpose and usage of structures, declaring structures,
    assigning of structures, Pointer to Objects: Pointer and address arithmetic, pointers
    and declarations, using pointers as function arguments.


    # ## Unit-5


    Familiarization with Linux OS environment: basic OS commands, directory creation,
    editing, storing and accessing to files; Open-office; Text files in Indian languages:
    keyboard, editing, searching; The Standard C-Preprocessor: Defining and calling
    macros, using conditional compilation, passing values to the compiler, string
    handling functions.


    (ix)'
