  md: '# 3.3.6 Documentation


    A correct program is of very little use, unless it is supported by full description
    in writing. Detailed description of the program is called documentation. Program
    documentation is done with two objectives :


    +   (i) is to enable the user to operate the program correctly


    +   (ii) is to enable the other person to understand the program.


    So that if necessary, he could modify or correct the program.


    # 3.4 Compiling and Executing a C Program


    Once you have written the program you need to it and instruct the machine to execute
    it. To type your C program you need another called Editor. Once the program has
    been typed it needs to be converted to machine language (0s and 1s) before the
    machine can execute it. To carry out this conversion we need another program called
    Compiler. Compiler vendors provide an Integrated Development Environment (IDE)
    which consists of an Editor as well as the compiler.


    There are several IDEs available in the market targeted towards operating systems.


    Assuming that you are using a Turbo Compiler here are the steps you need to follow
    and execute your first C program.


    +   1. Start the Compiler at C> prompt. The compiler TC.EXE is usually present
    in C:\tc\bin directory.

    2. Select New from the File menu.

    3. Type the program.

    4. Save the program using F2 under a proper name.

    5. Using ctrl+F9 to compile and execute the program.

    6. Use Alt+F5 to view the output.


    # 3.5 C Instructions


    There are basically three types of instructions in C :


    +   1. Type Declaration Instruction : To declare the type of variables used in
    a C program.

    2. Arithmetic Instruction : To perform arithmetic operations between constants
    and variables.

    3. Control Instruction : To control the sequence of execution of various statements
    in a C program.


    # 3.6 Structure of a C Program


    Every program is made of one or more preprocessor commands a global declaration
    section and one or more functions. The global declaration section comes at the
    beginning of the program. We will talk more about it later, but the basic idea
    of global declarations is that they are visible to all parts of the program.'
