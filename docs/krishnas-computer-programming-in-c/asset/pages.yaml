    # 1.45 Introduction to Program Development


    A computer program is a formal instruction which computer execute in order to
    carry out some designated task. Whether that task is as simple as adding two numbers
    together or as complex as maintaining a large inventory for a multinational corporation,
    there is a common element involved; They are both achieved by the computer executing
    a series of instructions - the computer program.


    Programming can be defined as the development of a solution to an identified problem.
    There are seven basic steps in the development of a program:


    +   1. Define the program: This step involves the careful reading and re-reading
    of the problem until the programmer understands completely what is required ?


    +   2. Outlines the solution: Once the problem has been defined, the programmer
    may decide to break the program up into smaller tasks or steps, and several solutions
    may be considered. The solution outline often takes the shape of a hierarchy or
    structure.


    +   3. Develop the outline into an algorithm: Using the outline developed in step2,
    the programmer extends this into a set of precise steps that describe exactly
    tasks to be performed and the order in which they to be carried out. This step
    can use both structured programming techniques and pseudo code.


    +   4. Test the algorithms for correctness: This step is one of the most important
    in the development of a program as is often forgotten. Test data needs to be walked
    through each step in the algorithm to check that the instructions described in
    the algorithm will actually do what they are supposed to. If logic errors are
    discovered then they can be easily corrected.'
