    (ii) It must not start with a digit, however it can start with underscore.

    (iii) C is case sensitive so RL and Rol will differ from each other.


    Identifiers are the name given to the program elements such as variables, arrays
    and functions. Basically, identifiers are the sequence of alphabets and digits.


    # Rules for forming Identifier Name


    +   > The first character must be an alphabet or an underscore.

    > All succeeding characters must be either letters or digits.

