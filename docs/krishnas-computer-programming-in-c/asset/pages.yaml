  md: '# 3.7.1 Block Comments


    A block comment is used. When the comment will span several lines. We call this
    format block comment. It uses opening and closing comment token. A token is one
    or more symbols understood by the compiler that help it interpret code. Each comment
    token is made of two characters that, taken together form the token, there can
    be no space between them.


    The opening token is /* and the closing token */. Everything, between the opening
    token and closing token is ignored by the compiler. The token can start in any
    column and they do not have to be on the same line. The only requirement is that
    the opening token must precede the closing token.


    Examples of block comments:


    ```

    /* This is a block comment

    covers two lines */

    ```


    # 3.7.2 Line Comment


    The second format, the line comment uses two slashes (/) to identify a comment.
    This format does not require on end-off comment token, the end of the line automatically
    ends the comment. Programmers generally use this format for short comments. The
    line comment can start anywhere on the line.


    Example of line comment:


    ```

    // This is a whole line comment

    ```


    # 3.8 Introduction of Data Types


    Communicating with a computer involves speaking the language computer understands,
    which immediately rules out English as the language of communication with computer.
    However, there is a close analogy between learning English language and learning
    C language. The Classical method of learning English is to first learn the alphabets
    or characters used in the language, then to combine these alphabets to form words,
    which in turn are combined to form sentences and sentences to form paragraphs.
    Learning C is similar and much more easy.


    | Steps in English language : | | |

    | Alphabets | Words | Sentences | Paragraph |

    | Steps in C : | | |

    | Alphabets Digits Special System | Data types constants variable keywords | Instructions
    | Program |


