  md: 'Associativity determines how the sub expressions are grouped together. Their
    associativity is from left to right. So they are grouped as follows:


    ((2*8)/2)%2*4


    A graphical representation of this expression is shown in figure:


    | 2*8 | /2 | %2 | *4 |


    Fig. 4.3: Left to Right Associativity


    # 4.6.2 Right to Left Associativity


    Right to left associativity the right must be unambiguous.


    Several operators have Right to Left associativity as shown in the precedence
    table-1.


    For example, when more than one assignment operator occurs in an assignment expression
    the assignment operators must be interpreted from left to right. This means that
    the right most expression will be evaluated first, then its value will be assigned
    to the operand on the left of the assignment operator and the next expression
    will be evaluated. Under these rules, the expression


    ```

    a+=b*=c-=5

    ```


    is evaluated as


    ```

    (a+=b*=(c-=5))

    ```


    which is expanded to


    ```

    a=a+(b*(c-=5))

    ```


    If a has an initial value of 3, b has an initial value of 5, and c has an initial
    value of 8, these expressions become


    ```

    a=3+(b=(5-=8))

    ```


    which results in c being assigned as value of 3, b being assigned as value of
    15 and being assigned a value of 18. The value of the complex expression is also
    18. A diagram of this expression is shown in figure.


    | a += | b*= | c-=5 | *4 |


    Fig. 4.3: Right to Left Associativity


