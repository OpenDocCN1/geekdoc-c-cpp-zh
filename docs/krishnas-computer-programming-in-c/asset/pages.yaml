    This is the traditional windows style drop-down menu. When you point to any menu
    title and click once with the mouse, the menu will open, displaying all the commands
    available under this menu title. Clicking on the desired command would tell you
    which command to execute. Some commands have ellipse (...) in front of them. These
    commands have further subcommands. Commands dimmed cannot be executed unless the
    prerequisite functions required by that command have been performed, e.g. you
    cannot use the copy or cut from the edit menu unless you have selected a piece
    of text first. Many commands also have a keyboard shortcut assigned against their
    names.


    # ## 12.14.3 Standard Toolbar


    Toolbar contains buttons, drop-down menus and controls that help you quickly alter
    that appearance and arrangement of documents by executing a variety of word commands.
    Toolbars are very helpful and convenient in quickly executing commands without
    going through Menu option. The standard toolbar contains icons for basic functions
    like opening files, saving files, printing files, cut, copy, paste etc.


    # ## 12.14.4 Formatting Toolbar


    This contains icons for changing the look of your text, for example, there are
    icons for changing fonts, styles, font sizes, text alignment etc.


    # ## 12.14.5 Ruler


    The Ruler lets you make changes to margins and indents and helps you to create
    document as dimensions required.


