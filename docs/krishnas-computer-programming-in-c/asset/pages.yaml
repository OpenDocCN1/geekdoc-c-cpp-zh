    # 11.9 Pointer to Structures\n\nStructures, like other types, can also be accessed\
    \ through pointers. In fact, this is one of the most common methods used to reference\
    \ structures.\n\nThe first thing we need to do define a pointer for the structure\
    \ as shown below:\n\n```\n*ptr;\n```\n\nWe now assign the address of sam1 on the\
    \ pointer using the address operator (&) as we would with any other pointer.\n\
    \n```\nptr=\\&sam1;\n```\n\nNow we can access the structure itself and all the\
    \ members using the pointer, ptr. The structure itself can be accessed like any\
    \ object using the bidirectional operator(*).\n\n```\n*ptr\n```\n\nSince the pointer\
    \ contains the address of the beginning of the structure, we no longer need to\
    \ use the structure name with the direct selector. The pointer takes its place.\
    \ To reference to each of the sample members is shown below:\n\n```\n(*ptr.x)\
    \ (*ptr.y) (*ptr.z) (*ptr.u)\n```\n\nNote the parenthesis in the above expressions.\
    \ They are absolutely necessary, and to omit them is a very common mistake. The\
    \ reason they are needed is that the precedence priority of the direct selector\
    \ operator (.) is higher than the indirection operation (*). If we forget to get\
    \ put the parenthesis, C applies the dot operator first and the asterisk operator\
    \ next. In other words."
