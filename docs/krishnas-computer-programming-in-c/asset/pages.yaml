    code each of them. In other types of systems, such as airline reservation systems
    a single application may actually do much of the time sharing between terminals.
    This way does not need to be a different running program associated with each
    terminal.


    In a non-interactive computing environment a user has no contact with his program
    during its execution. In this environment it is natural to use the batch processing
    or multiprogramming paradigm. Both these systems provide power user service. However,
