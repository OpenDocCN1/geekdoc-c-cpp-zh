  md: '# # Chapter UNIT-1 Computer Programming In C

    Number System


    # ## 2.1 Introduction


    The computers are made up of digital electronic circuits. The major elements being
    transistors which are essentially stable or binary in nature. The term binary
    means that the transistor can operate only two states (0s and 1s). Fully conducting
    and Non-conducting states. Thus, a transistor acts like a switch i.e., it is either
    on or off.


    Since the computer is made up of binary logic circuits, data is also represented
    in a computer by either the presence or absence of electronic "signals". This
    is called binary or two state representation of data. The number system used to
    represent data in a computer is therefore known as binary number system.


    # ## 2.2 Number System


    We are familiar with decimal number system having digit value 0 through 9 with
    0, 1, 2, 3, ... 9 as 10 symbols. It is base-10 counting system because the total
    number of symbols in the system is 10. Any number written in decimal system derives.
    There are four types of number system :


    +   * Decimal Number System

    * Binary Number System

    * Octal Number System

    * Hexadecimal Number System'
  merge: -1
  pgno: 136
