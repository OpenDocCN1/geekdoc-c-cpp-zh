  md: '# 2.2.1 Decimal Number System


    Decimal number system has base-10. The absolute value of each digit is fixed but
    its positional value is determined by its position in the whole number.


    For Example: 3958


    | Number | Symbol value | Position from right hand | Position value | Decimal
    equivalent |

    |---|---|---|---|--|

    |3 9 5 8 | 8 | 0 | $10^0$ | $8 \times 10^0 = 8$ |

    | | 5 | 1 | $10^1$ | $5 \times 10^1 = 50$ |

    | | 9 | 2 | $10^2$ | $9 \times 10^2 = 900$ |

    | | 3 | 3 | $10^3$ | $3 \times 10^3 = 3000$ |

    (3958)$_{10}


    # 2.2.2 Binary Number System


    Binary number system has base-2. It consists of 2 digits as 0 and 1.


    For Example: (110111010)$_2$


    | Number | Symbol value | Position from the right hand | Position value | Decimal
    equivalent |

    |---|---|---|---|--|

    |1 1 0 1 0 1 0 1 0 | 0 | 0 | $2^0$ | $0 \times 2^0 = 0$ |

    | | 1 | 1 | $2^1$ | $1 \times 2^1 = 2$ |

    | | 1 | 2 | $2^2$ | $1 \times 2^2 = 4$ |

    | | 0 | 3 | $2^3$ | $0 \times 2^3 = 0$ |

    | | 1 | 4 | $2^4$ | $1 \times 2^4 = 16$ |

    | | 1 | 5 | $2^5$ | $1 \times 2^5 = 32$ |

    | | 0 | 6 | $2^6$ | $0 \times 2^6 = 0$ |

    | | 1 | 7 | $2^7$ | $1 \times 2^7 = 128$ |

    | | 1 | 8 | $2^8$ | $1 \times 2^8 = 256$ |

    (438)$_{10}'
