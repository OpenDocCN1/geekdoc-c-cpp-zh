    # SOLVED QUESTIONS


    Q. 1: Differentiate between an array and a structure.


    Ans: The arrays are suitable for list and table processing and all the elements
    of an array must be of the type. A structure, on the other hand combines a group
    of related data items of arbitrary types. The structure is suitable for processing
    records of an entity.


    Q. 2: Can structure elements be initialized during the declaration of the structure
    ?


    Ans: No.


    Q. 3: What is the limitation of enumerated data types ?


    Ans: They cannot be used in input and output statement.


    Q. 4: For what purpose the keyword ''typedef'' is used ?


    Ans: It is used to define user data type.


    Q. 5: For what purpose the keyword enum is used ?


    Ans: It is used to define enumerated data type.


    Q. 6: It is necessary that all members of a structure should be of same type ?


    Ans: Not at all.'
