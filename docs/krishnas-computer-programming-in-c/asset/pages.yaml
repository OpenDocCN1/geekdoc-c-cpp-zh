  md: '# Chapter UNIT-5 12


    # Linux


    # # 12.1 Introduction


    Linux is the software built by a community. It began in 1991 when programmer Linux
    Torvalds, a graduate student in Finland, posted his free Linux operating system
    on the internet. Linux is the rising star of network software. Linux is a free
    version of UNIX and its continual improvements result from the efforts of tens
    of thousands of volunteer programmers. Whereas windows is Microsoft’s proprietary
    product, Linux is open-source software-meaning any programmer can download it
    from the internet for free and modify it with suggested improvements. The only
    qualification is that changes cannot be copyrighted, they must be made available
    to all and remain in the public domain.


    Because it was originally built for use on the internet, Linux is more reliable
    than windows for online applications. Hence, it is better suited to run websites
    and e-commerce softwares. Its real growth, may come as it reaches outward to other
    applications and possibly, replaces window in many situations.


    Linux is basically multi-user, multitasking operating system. It provides character
    user interface and graphical user interface both for interacting with computer.
    Linux also has powerful networking features incorporated into it and has built
    in internal facilities.


    Linux has gained popularity these days and is emerging as a parallel competitor
    of windows and UNIX operating system. Linux operating system provides both types
    of user interface. It supports GUI and CUI both.'
