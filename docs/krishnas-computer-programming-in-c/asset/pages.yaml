  md: '# 162


    # Computer Programming in "C"


    The process of writing computer programs is called programming. Programming requires
    knowledge of computer language and aptitude for programming. In practice, many
    popular tools and techniques are followed for writing correct, efficient and maintainable
    programs.


    The set of instructions that is required to perform a given task is called a program
    or computer program.


    Computers are basically dumb devices. They cannot do anything on their own, be
    their internal tasks user''s applications. They require step-by-step instructions,
    for performing the task.


    +   - the portability of the compiler.

    - the standard library concept.

    - a powerful and varied repertoire of operators.

    - an elegant syntax.

    - ready access to the hardware when needed.

    - and the ease with which application can be optimised by hand-coding isolated
    procedure.


    # 3.2.1 Characteristics of C


    +   - C is a general purpose programming language.

    - C is a structured programming language.

    - It has a rich set of operators.

    - It provides compact representation for expression.

    - It allows manipulation of internal processor registers.

    - No rigid format. Any number of statements can be typed in a single line.

    - Portability : Any C program can run on different machines with little or no
    modifications.

    - Supports a rich set of data types.

    - Very less number of reserved words.

    - Pointer arithmetic and pointer manipulation.

    - Ability to extend itself by adding functions to its library.


    # 3.2.2 Application of C


    Because of its portability and efficiency, C is used to develop system as well
    as an application software.'
