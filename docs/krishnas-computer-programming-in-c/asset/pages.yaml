  md: '# 2.8 Gray Code


    The gray code is a binary code. The binary bits are arranged in such a way that
    only one binary bit changes at a time. When we make a change from any number to
    the next, it reduces the error in reading shift position. The largest possible
    error will be the least significant digit. Gray code is also known as reflected
    code.


    In reflected code, the number is changed by only one bit, as it proceeds from
    one number to the next. When the analog data are represented by a continuous change
    of a shift position, then gray code is used. The shift is partitioned into segments
    and each segment is assigned a number.


    To convert Gray Code to Binary Number:


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_155_0.png)


    To convert Binary Number to Gray Number:


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_155_1.png)


    # 2.9 Error Handling


    Error handling refers to the anticipation, detection and resolution of programming,
    application and communications errors. Specialized programs, called error handlers,
    are available for some applications. The best programs of this type forestall
    errors, if possible recover from them when they occur without termination, the
    application or gracefully terminate in affected application and save the error
    information to a log file.


    In programming a development error is one that can be prevented. An error can
    occur in syntax or logic. Syntax errors, which are typographical mistakes or improper
    use of special characters, are handled by rigorous proof. Logic errors, also called
    bugs, when occur code does not produce the expected or desired result. Logic errors,
    are best handled by meticulous debugging. This can be an ongoing process that
    involves, in addition to the traditional debugging, beta testing prior to official
    release and customer feedback after official.


    A runtime error takes place during the execution of a program and usually happens
    because of adverse system parameters or invalid input data. An example is the
    lack of sufficient memory to run an application or a memory conflict with another
    program. On the internal, run time errors can result from electrical noise, various
    forms of malware or heavy demand on a server. Run time errors can be resolved,
    or their input minimized, by the use of error handler programs, vigilance on the
    part of network and server administrators, and by reasonable security counter
    measures on the part of internet users.'
