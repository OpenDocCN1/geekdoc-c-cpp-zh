  md: "# 9.1.1.1 Efficiency of Sequential Search\n\nThe time taken or the number of\
    \ comparisons made in searching a record in a search table determine the efficiency\
    \ of the technique.\n\nIf the desired record is present in the first position\
    \ of the search table, then only one comparison is made. If the desired record\
    \ is the last one, then n comparison have to be made. If the record is present\
    \ somewhere in the search table, on an average, the number of comparison will\
    \ be (n+1)/2. The worst case efficiency of this technique is O (n) stands for\
