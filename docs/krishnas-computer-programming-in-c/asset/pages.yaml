    \ false.\n\n+   (iii) There must be some loop terminating condition inside the\
    \ body of the loop to avoid infinite looping.\n\nThe compiler executes all the\
    \ statements in a while loop when the while condition is true. When the condition\
    \ is not true, the compiler exits the loop. When the compiler encounters the while\
