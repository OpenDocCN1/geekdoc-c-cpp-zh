    # 12.14.13 How to Type in Word


    Once word has started, you can immediately start typing. When you press keys on
    the keyboard you can see the corresponding characters appear in the word window.
    When you press the spacebar when you want to separate characters and words from
    each other. Use the Tab key when you want to move the cursor or text from one
    Tab to another and also when you want to create a blank longer than one space
    between words.


    # 12.14.14 Insert and Overtype Modes


    Word normally uses the insert mode. In this mode, word does not overtype the existing
    text but pushes it forward. By pressing the Ins key, you can switch to overtype
    mode. In this mode, the new text replaces the old after the cursor. To switch
    between overtype/insert modes press the Ins key. In the insert mode when you place
    the cursor in the middle of two words and start typing, the new text is inserted
    between the two words and all the text below this line is automatically adjusted.
    In the overtype mode when you place the cursor in the middle of two words and
    start typing, the new text overwrites the previous text.


    # 12.14.15 Visualising and Planning for a New Document


    Just like you envisage an entire document before it is constructed it is a good
    habit to think about the overall look and contents of the document before you
    start creating it. Word gives onscreen how how your printed document would look
    before it is actually printed. If you provide some basic information as paper
    size and orientation. Word would display, while you are creating the document,
    simple information like margins, page endings, line endings, the relative size
    and placement of text graphics and so on. Therefore, it is a good idea to start
    by specifying the page size, printer, margins before entering text. How to do
    this has been explained in the first exercise.


    # 12.14.16 Typing Text


    Typing text in is similar to typing it on a normal typewriter for three major
    differences:


    +   1. Unless you start a new paragraph press the "Enter" key. When you reach
    the end of the margin of your page. Word automatically places the cursor at the
    beginning of the next line. This features is called word wrap and it does away
    with the irritating necessity of either having to yank a lever at the end of each
    line or pressing Enter after every line. While typing, when you reach an end of
    a line, word automatically figures out whether the word that you are typing fit
    within the current line, if not, the next word is automatically placed in the
    next line. This means that you don''t have to bother about left or right margins
    while typing. Simply go ahead and keep on typing. Word would take care of these
    things automatically.'
