    # 9.3.2 Selection Sort


    Selection sort technique is based upon the extension of the minimum/maximum techniques.
    It means out of the for loops a pass through array is made to locate the maximum
    value. Once this is found, it is placed in the first position of the array. Then
    the remaining elements are made to find the next smallest element, which is placed
    in the second position and so on. Once the last element is compared with the last
    element, all the elements have been sorted into ascending order.


    # 9.3.3 Insertion Sort


    Insertion sort is one that sets a sort of values by inserting values into an existing
    sorted file.


    Suppose an array ''a'' with n elements


    a[0], a[1], a[2] ... a[n-1] is in memory. The insertion sort algorithm ''a'' from
    a[1] to a[n]; inserting each a[k] into its proper position in the previously sorted
    subarray a[1], a[2], a[3] ... a[k-1]. That is


    +   Pass 1 : a[1] by itself trivially sorted.

    Pass 2 : a[2] is inserted either before or after a[1], a[2] is sorted.

    Pass 3 : a[3] is inserted into its proper place in a[1], a[2], that is, before
    a[1] and a[2], or after a[2], so that a[1], a[2], a[3] is sorted.

    Pass 4 : a[4] is inserted into its proper place in a[1], a[2], a[3] so that


    ```

    a[1],a[2],a[3],a[4] is stored

    ```'
