    At two sides of the ball, at 90 degrees angle from each other, are two small rollers
    that touch the mouse and spin when the ball rolls. A sensor detects how much roller
    spins and sends this information to the computer. The computer translates the
    information and changes the position of the on-screen pointer to correspond to
