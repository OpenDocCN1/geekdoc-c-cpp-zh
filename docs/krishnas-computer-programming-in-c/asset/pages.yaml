    # 9.9 Recursion


    In general, programmers use two approaches to writing repetitive algorithms. One
    approach uses loops, the other recursion. Recursion is a repetitive process in
    which a function calls itself. Some older languages do not support recursion.
    One major language that does not COBOL.


    # 9.9.1 Iterative Definition


    To study a simply example, consider the calculation of a factorial. The factorial
    of a number is the product of the integral values from 1 to n : This definition
    is shown in formula-1.


    ```

    factorial(n) = \begin{cases} 1 & \text{if } n=0 \ n*(n-1)*(n-2)...*3*2*\text{if
    } n>0 \end{cases}

    ```


    Formula-1


    This definition is iterative. A repetitive function is defined iteratively whenever
    the definition involves only the parameter(s) and not the function itself. We
    can calculate the value of factorial (4) using formula-1 as


    ```

    factorial(4) = 4*3*2*1\nn=24

    ```


    # 9.9.2 Recursive Definition


    A repetitive function is defined recursively whenever the function appears within
    the definition itself. For example, the factorial function can be defined recursively,
    as shown in below formula-2.


    ```

    factorial(n) = \begin{cases} 1 & \text{if } n=0 \ n*factorial(n-1) & \text{if
    } n>0 \end{cases}

    ```


    Formula-2'
