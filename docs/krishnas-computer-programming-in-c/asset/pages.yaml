  md: '# 1.28.3 Running Utility Programs


    An operating system includes utility programs that give the user control over
    various features of the computer system. These utility programs are either resident
    or transient. Resident programs are always present in RAM. Transient program must
    be read into RAM as they are requested. Utility programs recognize device names
    that order the system devices. There are some typical names:


    +   - A; B; C; D: (names for floppy disk or hard disk drives)


    +   - CON: (name of key board or console)


    +   - PRN: (name of the printer)


    +   - SCRN: (name of the screen)


    Here are some commands using some typical utility programs:


    +   - DISK COPY A: B: (copies the contents of the disk in drive A: onto the disk
    drive B)


    +   - FORMAT B:/1


    # 1.28.4 Managing Files


    Information on the disk is organized into files. A file is any collection of bytes.
    Some files programs; contains other data. A disk usually contains both program
    and data files. Each file is given a name. Here are some typical file names:


    +   - BASIC.com (Files ending in .com are program files)


    +   - FORMAT.com (This file contains the program for formatting disks)


    +   - SALES.nov (This data file contains sales figure for November)


    +   - CLAB (This data file contains laboratory data).


    Information about each file is contained in a directory on the disk. This information
    includes the file name, the number of bytes in the file and the date when it was
    last altered. Some operating systems allow descriptive attributes in the directory
    for example, a file may be read only, it can be read cannot be altered. A file
    may be read/write, it can be read and altered. Some operating systems allow hidden
    files to be created. These do not show up in the directory and can never be erased.
    Hidden files are often used for very important files associated with the operating
    system. Since the computer needs files to operate, they should never be erased
    from the disk. Hiding them prevents this from happening.


    The operating system provides the utility programs that manage the files. Some
    utility programs create the files and the directory and allow the user to copy,
    erase and rename files. Other utility programs display the contents of the directory
    or of a particular file on the video display. Still others transfer the content
    of a file to an output device, such as a printer.'
