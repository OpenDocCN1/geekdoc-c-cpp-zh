    # # 9.1 Searching


    Searching is a process to find an element within the list of elements stored in
    any order or randomly.

    Searching is divided into two categories :


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_483_1.png)


    +   - Linear search is the basic and simple method of searching.

    - Binary search takes less time to search an element from the sorted list of element.
    So, we can say that binary search method is more efficient than the linear search.
    There is only one drawback that binary search work on the sorted list where there
    is no prerequisite for the linear search.


    # ## 9.1.1 Linear Search or Sequential Search


    In search, we access each element of an array one by one sequentially and see
    whether it is the desired element or not. A search will be unsuccessful if all
    the elements are accessed and the desired element is not found. In the worst case,
    the number of average cases which are accessed and we may have to scan to half
    of the size of the array (n/2). Therefore, linear search can be defined as the
    technique which traverse the array sequentially to locate the given item.'
  merge: -1
  pgno: 483
