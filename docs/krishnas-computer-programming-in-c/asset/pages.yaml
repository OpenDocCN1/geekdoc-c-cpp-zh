    Examples of valid array declarations are :


    +   (i) int series[50];

    (ii) char name[100];

    (iii) float sal[60];


    Generally arrays are manipulated in a fashion of component-by-component processing.
    In simple words we can say that similar operations are performed on some or all
    the components of the array. In order to help beginners or novices to learn the
    idea behind array processing. C++ statements involving array elements are given
    in this line below :


    | S.No. | Statement | Meaning |

    |---|---||

    | 1. | scanf("%d", &a[5]); | Read from keyboard, the fifth element of array list
    called list |

    | 2. | printf("%d", a[5]); | Print the 5th element of array list on screen, where
    5 is an integer variable |

    | 3. | list[1]=a[j]; | Assign the contents of/th element of array list to ith
    element |

    | 4. | list[k]++; | Increment kth element of array list |

    | 5. | for(i=0; i<10; i++) scanf("%d", &a[i]); | Read from keyboard, the elements
    of array list in the range a[0] to a[9] |


    The syntax of declaring a one-dimensional array is as :


    ```

    data_type. arrayname[size];

    ```


    where arrayname → name of array


    size → number of elements of data type. Size must be an integer constant specified
    within a pair of square brackets.


    Some of the rules that govern the subscripts are given below :


    +   (i) Each subscript must be a positive integer constant, or an expression.

    (ii) Subscript of subscript is not allowed.

    (iii) C does not perform bounds checking.

    (iv) Therefore, the maximum subscript appearing in a program for a subscribed
    variable should not exceed the declared one.'
