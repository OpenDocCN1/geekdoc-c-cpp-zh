  md: '# # Chapter UNIT-4 Computer Programming In C

    Pointers


    # ## 10.1 Introduction


    A pointer is a derived type in C. It is built from one of the fundamental data
    types available in C. Pointers contain memory addresses as their values. Since
    these memory addresses are the locations in the computer memory where program
    instructions and data are stored, pointers can be used to access and manipulate
    data stored in the memory.


    Pointers are undoubtedly one of the most distinct and exciting features of C language.
    It has added power and flexibility to the language. Although they appear little
    confusing and difficult to understand for a beginner, they are a powerful tool
    and handy to use once they are mastered.


    Pointers are used frequently in C, as they offer a number of benefits to the programmers.
    They include :


    +   1. Pointers are more efficient in handling array and data tables.

    2. Pointers can be used to return multiple values from a function via function
    arguments.

    3. The use of pointer arrays to character strings results in saving of data storage
    space in memory.

    4. Pointers allow C in support dynamic memory management.

    5. Pointers reduce length and complexity of programs.

    6. It increases the execution speed and thus reduce the program execution time.'
