  md: '# 1.19 Input Units


    Data must be entered into a computer before processing may take place. You can
    enter data into a computer is called an input device. Most commonly used input
    devices are:


    +   1. Keyboard

    2. Mouse

    3. Joystick

    4. Scanner


    Many other special-purpose input devices are also available. Computers often have
    more than one input device attached. For example, most personal computers have
    both a keyboard and mouse.


    # 1.19.1 Keyboard


    Most input data is entered into the computer using a keyboard. This input method
    is similar to typing on a typewriter.


    Most typewriters and keyboards are QWERTY keyboards. The alph keys are arranged
    in a manner so that the upper-left row of letters begins with the six letters
    QWERTY. Designers of other keyboards claim that their boards are easier to learn
    than the QWERTY keyboard. The Dvorak keyboard is one example. It is not widely
    accepted, however, because most people have already learned the QWERTY keyboard.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_55_0.png)


    Fig. 1.20: AT (Standard) keyboard


    In different parts of the world, we find different keyboards. The coding used
    by the QWERTY and Dvorak keyboards works with an 8-bit code which accommodates
    256 different characters. Asian languages have many more characters.


    Computer keyboards also include keys that are designed to perform specific tasks
    instead of entering characters only. These special keys include keys, directional
    keys and special purpose keys such as Alt, Ctrl, Enter, Ins and Esc. These keys
    enable the user to perform complex tasks easily when using the application.


    Some keyboards have even 110 keys, with three new keys designed to simplify working
    with operating systems. Two of these, next to the Alt key, bring up the start
    menu. The third key, next to the right Ctrl key, brings up a menu of functions
    that are frequently accessed in whichever application is currently being used.'
