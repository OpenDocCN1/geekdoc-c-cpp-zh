    # Brainstorming


    Brainstorming is a problem solving approach designed to help a group generate
    several creative solutions to a problem. It was first developed by Alex Osborn,
    an advertising executive who felt the need for a problem solving technique that,
    instead of evaluating and criticizing ideas, would focus on developing imaginative
    and innovative solutions.


    # Steps


    +   1. A group''s members are presented with a problem and all its details.

    2. Members are encouraged to come up with as many solutions as possible, putting
    aside all judgments and evaluations. "Piggy-backing" off another person''s idea
    is useful.

    3. All ideas are recorded so the whole group can see them.

    4. Ideas are evaluated at another session.


    # Characteristics


    +   1. Procedure designed to release a group''s creativity in order to generate
    multiple imaginative solutions to a problem.

    2. Separates the idea-creation from the idea-evaluation process by not allowing
    any criticism to take place while the group is generating ideas.'
