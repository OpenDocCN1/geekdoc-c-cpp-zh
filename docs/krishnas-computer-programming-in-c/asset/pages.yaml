  md: "# Conditional Programming Executions\n\nFor Example:\n\n```\nif (a[i]>a[z])\n\
    {\n    temp=a[i];\n    a[i]=a[z];\n    a[z]=temp;\n}\n```\n\n# 6.1.2 Declaration\
    \ Statement\n\nEvery object must be defined before it is used in a C program.\
    \ This is done by declaration statement. The declaration statement can be placed\
    \ anywhere in the C program. This helps the compiler to note down the object and\
    \ reserve memory for that object.\n\nA declaration statement consists of a data\
    \ type, followed by one or more objects, ending with a semicolon.\n\nFor Example:\n\
    \n```\nint a,b,c;\nfloat x,y;\nchar ch;\nlong int;\nint *p1,*t;\n```\n\nMultiple\
    \ identifiers within a single declaration statement may cause an error due to\
    \ mixture of variables, pointers, structures and references.\n\nFor Example:\n\
    \n```\nint *p1,p2,p3;\nint p4;\n```\n\nIn this declaration it is not clear whether\
    \ the programmer intended p1, p2 and p3 as pointer or as p1 and p2 as pointers\
    \ and p3 as an object. In such case, we can rewrite the statement as two separate\
    \ statements.\n\n# 6.1.3 Control Statement\n\nA program consists of a number of\
    \ statements which are usually executed in sequence. This type of execution is\
    \ called sequential execution. But, in reality, this is not always true. Programs\
    \ can be much more powerful if we can control the order in which statements are\
    \ run. There may be a need for transfer of control during the execution of a program.\
    \ This transfer of control may be conditional or unconditional.\n\nAn unconditional\
    \ transfer of control causes the execution of program from one point in a program\
    \ to other statement inside a program.. However, the conditional transfer of control\
    \ makes the execution selective and/or repetitive."
