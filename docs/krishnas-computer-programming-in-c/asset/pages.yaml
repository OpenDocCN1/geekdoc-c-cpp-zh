  md: '# Introduction to Computer System


    Prolonged keyboard use can cause wrist problems, sometimes so serious as to require
    surgery. To help prevent these problems, ergonomic keyboards have been introduced
    in the market.


    One special type of keyboard construction is the MEMBRANE-SWITCH KEYBOARD, in
    which a protective film covers the keyboard. Membrane-switch keyboards are reliable,
    durable and resistant to such hazards as liquids or grease. However, membrane
    keys require more pressure than keys on a standard computer keyboard. You have
    probably seen membrane-switch keyboards in fast-food restaurants. Membrane-switch
    keyboards are ideal in situations where little actual keying.


    A computer is a rather sophisticated electromechanical component designed to create
    standardized electronic codes when a key is pressed. The code are transmitted
    along the cable that connects the keyboard to the computer system unit or terminal
    where the incoming code is analyzed and converted into the appropriate usable
    code.


    Keyboards come in a variety of sizes and shapes, but most keyboards used with
    computer systems have the certain number of features are, for e.g.,


    +   1. Standard typewriter keys

    2. Function keys

    3. Special purpose keys

    4. Cursor-movement keys

    5. Numeric keys


    In general, the typewriter-like keys are used to type in text and other data.
    The function keys, labeled F1, F2, F3 and so on are used to issue commands. Function
    keys are also programmable keys. The user''s manual that comes with the software
    tells you how to use the function keys. Computer keyboards also have some special-purpose
    keys.


    If you have a typewriter keyboard, you should find it easy to learn to work with
    a computer keyboard. However, some of the keys are different, you may want to
    experiment with some of the keyboard familiarization software programs on the
    market today. These packages provide computer users with the opportunity to become
    familiar with the layout of the keyboard, which may differ according to the kind
    of computer you are using and to developing typing proficiency.


    # 1.19.2 Voice Input Devices


    In an effort to increase worker productivity, a substantial amount of research
    is being done in voice recognition : programming the computer to recognize spoken
    commands. Voice input devices or voice recognition systems convert speech into
    electrical signals by comparing the electrical patterns produced by the speaker''s
    voice with a set of preset patterns. If a matching pattern is found, the computer
    accepts this pattern as part of its standard ''Vocabulary''. This technology is
    also used by people who are not able to use traditional input devices. NASA is
    currently developing experimental space suits that allow astronauts to view computerized
    displays across their helmets.


    These displays would be activated and manipulated by spoken command—convenient
    when you have both hands busy on an outer space repair job.'
