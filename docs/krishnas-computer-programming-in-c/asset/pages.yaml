  md: '# Chapter UNIT-3 Computer Programming In C 6


    # Conditional Programming Executions


    # 6.1 Introduction


    As mentioned earlier in C language, program execution starts from the first line
    of the main( ) function and continues line after line, till the end of the function
    is reached. While often writing programs for real life problems, this normal flow
    of execution need to be altered. To do this, C language provides many control
    commands.


    Control commands provide means for the normal flow of execution and turn it into
    some other direction.


    A statement is an executable component of a program which causes the computer
    to carry out some action. A statement in a programming language can be compared
    to a sentence in a natural language that we practise in our daily life. As sentences
    are ended with a full stop (period), statements in a program are ended with a
    semicolon.


    A programming language can support different types of statements such as comment
    statement, simple and compound statements, declaration statement, control statement,
    preprocessor statement, input-output statements etc.


    # Statement


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_318_0.png)


    Fig. 6.1: Types of statements'
