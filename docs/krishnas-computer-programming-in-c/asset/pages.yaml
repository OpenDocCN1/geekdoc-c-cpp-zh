- img_proc: true
  md: "2. The second method involves passing a copy of the entire structure to the\
    \ called function. Since the function are working on a copy of the structure,\
    \ changes to structures members within the function are not reflected in the original\
    \ structure. It is, therefore, necessary for the function to return the entire\
    \ structure back to the calling function. All compilers may not support this method\
    \ of passing the structure as a parameter\n\n3. The third approach employs a called\
    \ pointers to pass the structure as an argument. In this case, the address location\
    \ of the structure is passed to the called function. The function can access indirectly\
    \ the entire structure and work on it. This is similar to the way arrays are passed\
    \ to function. This method is more efficient as compared to the second one.\n\n\
    Like any other variables, structure can be passed on arguments to functions. Passing\
    \ structures to functions, the structure members can be passed individually, just\
    \ like ordinary variables. This method is inefficient when the size of the structure\
    \ is very large. Thats why we take an entire structure as an argument. When the\
    \ entire structure is passed to the function, its copy is obtained in the called\
    \ function. Any changes to the members of the structure using the called function\
    \ will not affect the original structure. Because of this, we have to use the\
    \ return statement. By the reference parameter passing method can also be applied\
    \ to structures.\n\nExample 9: Write a program to find out the sum of two integer\
