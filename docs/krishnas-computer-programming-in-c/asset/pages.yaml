    # 121.2..3 Drum Printers


    Drum printers are line printers that print an entire line at a time. Recall that
    dot matrix and inkjet printers print one character at a time. It consists of sola
    cylindrical drum with characters embossed on its surface in the form of circular
    bands. Each band consists of all the printing characters supported by the printer
    in its character set. Total number of bands is equal to the maximum number of
    characters that can be printed on a line. Hence, a drum printer with 132 characters
    pen line and supporting a character set of 96 characters will have alternate 12,
    672 (132 × 96) characters embossed on its surface.


    In addition to the drum, the printers have a set of hammers mounted in front of
    the drum in a manner that an inkjet ribbon and paper can be placed between the
    hammers and the drum. The total number of hammers is equal to the total number
    of bands on the drum, which is also equal to the total print positions per line.'
