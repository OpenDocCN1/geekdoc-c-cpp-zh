  md: '# 1.5.2.2 Application Software


    Application software is a set of one or more programs designed to carry out operations
    for specific applications. We can also say that user interaction with the type
    of software.


    +   1. User application program

    2. Application package

    3. Other software.


    > *For Example:* Word processing, Spreadsheets and Database Management System
    fall under the category of application software.


    Application software is broken into two classes:


    +   1. General purpose software

    2. Application specific software


    **General purpose software:** is purchased from a software developer and can be
    used for more than one application.


    *For Example:* Software include word processors, database management systems and
    computer added design system.


    **Application specific software:** can be used only for its intended purpose.
    A general ledger system used by accountants and a material requirements planning
    system organization are examples of application specific software. They can be
    used only for the task for which they were designed; they cannot be used for other
    generalized tasks.


    The relationship between system and application software is seen in figure 1.1.
    In this figure each circle represents an interface point. The inner core is hardware.
    The user is represented by the outer layer. To work with the system, the typical
    user uses some form of application software. The application software is turn
    interacts with the operating system, which is a part of the system software layer.
    The system software provides the direct interaction with the hardware.


