    # 5.5 Arguments and Parameters


    Arguments and variables are used in a function. Variables used in a function reference
    are called arguments. These are written within the parenthesis followed by the
    name of the function. They are also called actual parameters, as they are accepted
    in the main program.


    Variables used in the function definition are called parameters. They are also
    referred to as formal parameters, because they are not the accepted values. They
    receive values from the calling function. Parameters must be written within the
    parameters followed by the name of the function, in the function definition.


    Example : Write a program which does not accept anything from the keyboard. It
    initialises the variables 1 to 10 outside the main() and function(). (Using global
    and local variables).


