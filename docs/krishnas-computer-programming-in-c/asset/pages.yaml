    # 1.22 Storage Unit


    Data and entries entered into a computer system through input units have to be
    stored inside the computer before actual processing tasks. Similarly, results
    produced by a computer after processing having to be somewhere inside the computer
    system before passed on to an output unit. Moreover, a computer must also preserve
    intermediate results for ongoing processing. Storage unit of a computer system
    caters to all these needs. It provides space for storing data and instructions,
    intermediate results and results for output.


    Storage unit of all computers is comprised of following two types of storage.'
  merge: -1
