    In an interactive computing environment, a user can provide inputs to a program
    from the key board and examine his output on the monitor screen. A different operating
    system paradigm is used in such environments to provide quick service to user
    requests, it creates an illusion that each user has a computer at his home display.
    This paradigm is called time sharing.


    # 1.33.1 User Service


    User service is characterized in the time taken to service sub request, i.e. response
    time (rt). Benefits of good response times are seen during program development.
    A user engaged in program development compiles and tests a program repeatedly.
    A typical request issued by the user concerns compilation of a statement or an
    execution of a program on given data. The response consists of a message from
    the compiler or results computed by a program. A user issues the next request
    after receiving the response to the previous request. Good response times would
    lead to an improvement in the productivity of the user. Any application in which
    a user has to interact with a computation would draw similar benefits from good
    response times.'
