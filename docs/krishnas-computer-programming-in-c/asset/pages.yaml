    # 9.2 Sorting


    Sorting is a basic operation in computer science. Sorting refers to the operation
    of arranging data in some given sequence iie., increasing order or decreasing
    order.


    Sorting is categorised as internal sorting and external sorting.


    +   1. Internal sorting means we are arranging the numbers within the array only
    in the computer primary memory.

    2. External sorting is the sorting of numbers from the external file by reading
    it from secondary memory.


    # 9.3 Types of Sorting


    Sorting is divided into following types :


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_489_0.png)


    # 9.3.1 Bubble Sort


    In bubble sort, each element is compared with its adjacent element. If the first
    element is larger than the second one the positions of the elements are interchanged,
    otherwise it is not changed. Next element is compared with its adjacent element
    and the process is repeated for all elements in the array. During the pass, the
    largest element occupies the second last position. During the next pass, the same
    process is repeated leaving the largest element. During the pass, the largest
    element occupies the n-1 position. The same process is repeated until no more
    elements are left for comparison. Finally the array is sorted.'
  merge: -1
