  md: '# Introduction to Computer System


    4. Termination: It specifies the end of the algorithm. It is generally a STOP
    statement and the last instruction in the algorithm.


    The notation used for algorithm specification must confirm to a basic set of criteria


    +   (i) It must be Concise: We must be able to describe the solution to a problem
    without writing multiple pages of text.


    +   (ii) It must be Unambiguous: The description of the procedure must not be
    open to alternative interpretations. We remember that the algorithm will be executed
    by a machine, which has no “common sense” or in-built knowledge of the nature
    of the problem.


    +   (iii) It must be Capable of Machine Execution: The action described must be
    capable of translation into machine-executable operations. The precludes precludes
    statements such as “choose the best candidate”. If this were the object of the
    operation, the steps involved in evaluating the exact criteria for what constituted
    “best” must be clearly set out.


    +   (iv) It must Promote Elegance in the Solution: The tool must prevent the programmer
    from using practices at design stage, which will poor programming style during
    implementation.


    The selection of an appropriate design tool has a great influence on the quality
    of the ultimate program. A good design tool will lead to programs, which are elegant
    in their design, accurate in their operation and easy to understand and handle
    over a long period of time. Conversely a poor design tool will promote none of
    these.


    Whatever technique is used to design the structure and logic of an algorithm,
    it must be useful as a design tool and not merely as a documentation tool. Many
    programming students will confess that they have drawn diagrams or charts as their
    lecturer''s insistence, but only after writing the program. This is senseless.
    If the tool does not help in the design process before code is written, there
    is no point in producing it afterwards. Let us take one example to illustrate
    all the features of an algorithm.


