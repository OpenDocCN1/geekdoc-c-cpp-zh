    # 1.47.2 Time Sharing Environment


    Employees in large companies often work in what is known as a time sharing environment.
    In the time sharing environment, users are connected to one or more computers.
    These computers may be microcomputers or central mainframes. The terminals they
    use are often nonprogrammable, although today we see more and more microcomputers
    being used to simulate terminals. Also in the time sharing environment, the output
    devices and auxiliary storage devices (such as disks) are shared by all of the
    users. A typical college lab in a minicomputer is shared by many students.


    In the time sharing environment, all computation must be done by the central computer.
    In other words, the central computer has many duties.


    It must control the shared resources, it must manage the shared data and printing
    it must do the computing. All of this work needs to keep the computer busy. In
    fact, it is sometimes so busy that the user becomes frustrated by the slow responses.


    # 1.47.3 Client/Server Environment


    A Client/Server environment splits the computation function between a central
    computer and users. The users are generic personal computers or workstations so
    that some of the computation responsibility can be moved from the central and
    assigned to the workstations. In client/server environment, the users microcomputers
    or workstations are called the client. The central computer, which may be a powerful
    microcomputer, minicomputer, or central mainframe system is known as the server.
    Because the work is now between the users computers and the central computer,
    response time and monitor display are faster and the users are more productive.'
