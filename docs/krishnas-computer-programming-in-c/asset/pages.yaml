  md: '# 1.21 Output Units


    Output devices are varied and innovative as input devices. From traditional printed
    output to audio output and robots, there is a multitude of forms of computer output.


    Most output can be divided into two categories:


    +   1. Soft copy

    2. Hard copy


    Soft copy is ideal when you are writing a document, playing a game, watching a
    video clip or reading the latest news. Soft copy is what you see on the monitor,
    it is temporary, after you have finished with it, there is nothing solid to hold.
    You can however, transfer soft copy to a disk to transport it.


    Hard copy on the other hand, can be touched and carried. It is usually some form
    of paper output. It is especially helpful if you need to have a colleague look
    at your work or you need to give your work to a supervisor or a teacher.


    An output device is an electromechanical device that accepts data from a computer
    and translates them into a form suitable for use by outside world. Several output
    devices are available today. They can be broadly classified into following categories:


    +   1. Monitors

    2. Printers

    3. Plotters

    4. Screen image projector

    5. Voice response system.


    # 1.21.1 Monitors


    When you think about viewing computer output, you probably visualize a monitor.
    Monitor output is ''a'' soft copy, when you have finished viewing it, you cannot
    move it. Monitor display is the most common form of soft copy.


    Sometimes when watching television, you notice that the picture looks a little
    snowy. This condition occurs because the images are not solid but rather created
    by configurations of dots. These dots or picture elements, combine to form the
    image you see. The more elements, also known as pixels, the better is the resolution
    of the image. The better the resolution the clearer the picture. Computer monitors
    are similar to television screens.


    The large monitors that you connected to desktop computers are Cathode-Ray-Tube
    (CRT). Monitors that are used on laptops and notebook computers are known as flat-panel
    displays. Flat-panel displays weigh less and consume less electricity than CRTs.
    Common type of flat-panel displays include Liquid Crystal Displays (LCDs). Electro
    Luminescent (EL) displays and Gas Plasma (GP) displays. Flat panel display monitors
    are still more expensive than CRTs, but eventually their prices are expected to
    decrease. Can you imagine monitor hanging on the wall like a painting? It may
    be common in a few years.'
