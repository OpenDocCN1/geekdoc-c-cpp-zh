  md: '# 1.10.2 Why use Flowcharts ?


    Normally, an algorithm is first represented as a flowchart, and the flowchart
    is then expressed in a programming language to prepare a computer program. The
    main advantage of this two step approach in programming writing is that, while
    drawing a flowchart, a programmer need not pay attention to the details of the
    elements of the programming language. Hence, he/she can fully concentrate on the
    logic of the solution to the problem it handles. Moreover, since a flowchart shows
    the flow of operations in pictorial form, a programmer can easily detect any error
    in the logic then in the case of a program. Once the flowchart is ready, a programmer
    can concentrate only coding the operations in each box of the flowchart in terms
    of the statements of the programming language. This will normally ensure an error
    free program.


    Experience programmers, sometimes write programs without drawing a flowchart to
    reduce the number of errors and omissions in the program. Moreover, it is a good
    practice to have a flowchart along with a computer program become a flowchart
    often serves as a document for the computer program. It is very useful during
    the testing of the program, and while incorporating further modification in the
    program.


    # 1.11 Flowchart Symbols


    # 1.11.1 Need for Flowchart Symbols


    A flowchart uses boxes of different shapes to denote different types of instructions.
    The use of symbols having standardized meanings makes it easier to communicate
    program logic through flowcharts. This is because as long as everyone uses the
    same shapes, other can readily interpret the logic. For example, a diamond always
    means a decision. Hence, when a programmer book at a flowchart he/she can easily
    identify the decision points because they are indicated by diamond shaped boxes.


    # 1.11.2 Basic Flowchart Symbols


    Only a few symbols are needed to indicate the necessary operations in a flowchart.
    The American Standard Institute (ANSI) have standardized these basic flowchart
    symbols.


    +   Terminal: The terminal symbol indicates the beginning (Start), end (Stop)
    and pauses (Holt) is a program''s logic flow. It is the first and last symbol
    is a flowchart. In addition, the program logic has a pause, that is also indicated
    with a terminal symbol. A pause is normally used in a program under some error
    conditions, or if forms had to be changed in the computer''s printer during the
    processing of the program.


