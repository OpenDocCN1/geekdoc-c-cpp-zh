    # 7.1.3.1 ''Nested for loop


    In ''nested for loop, one loop is placed inside the other ''for'' loop. This operation
    is frequently used in C in various programs which helps in solving the complicated
    problems.


    If there are many data items to be processed with a set of elements repeatedly,
    then a single ''for'' statement is not adequate. So, we must use a nested ''for''
    loop. If one ''for'' loop is completely placed within the other, it is known as
    a nested ''for'' loop. The syntax of nested ''for'' statement is as follows :


    ```

    for(exp1; condition1; exp2)

    {

    for (exp3: condition2; exp4)

    {

    statement1;

    statement2;

    }

    }

    ```


    syntax of Nested ''for'' loop'
