- img_proc: true
  md: '# Preface to the Revised Edition


    The primary aim of presenting the book Computer Programming in “C” is to meet
    the requirement of B.Tech. 1st Year Students of Mahamaya Technical University,
    Noida. The subject matter has been presented in an easy comprehensive manner,
    using simple language and to provide a detailed exposition of the fundamentals.


    The book consists of 13 chapters providing a comprehensive course of course prescribed
    by M.T.U. A large number of theoretical exercises all of degree standard, have
    been included in the text for the benefit of students.


    Every care has been taken to eliminate misprints, omissions and errors but it
    is too much to expect that no misprint, error has crept in and the author would
    be grateful to the readers for bringing to his notice any such error/misprint/omissions
    they may come across while going through the book.


    The author shall feel satisfied if the book meets the need of the students for
    whom it is meant. Suggestions and criticism for the improvement of the book shall
    be welcomed.


    The author would like to thank all the Scientists and Authors whose work have
    been the source of enlightenment, inspiration and guidance in the presentation.


    September, 2012


    Paritosh Kumar Bansal

    paritoshbansal2010@gmail.com'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Preface to the First Edition


    It is with pride and pleasure that it places book Computer Programming in "C"
    before the readers. The book has been written keeping in view the need of students
    appearing for B.Tech. All branches (Subject code: ECS-101/ECS–201) and M.C.A.
    (Subject code: M.C.A.-113) examination conducted by U.P.T.U., Lucknow.


    We are aware that there is no dearth of publications in this subject because the
    syllabus has suddenly changed by U.P.T.U., Lucknow, but it has been our endeavour
    to present the subject with 100% covered syllabus in simplified and systematic
    manner.


    August, 2009


    Paritosh Kumar Bansal'
