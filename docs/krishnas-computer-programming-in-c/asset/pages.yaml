    | 6 | 0110 | 20 | 0010 0000 |

    | 7 | 0111 | 21 | 0010 0001 |

    | 8 | 1000 | | |

    | 9 | 1001 | 0 | 0000 |

    | 10 | 0001 0000 | | |

    | 11 | 0001 0001 | 30 | 0011 0000 |

    | 12 | 0001 0010 | 31 | 0011 0001 |

    | 13 | 0001 0011 | | |

    | 14 | 0001 0100 | 40 | 0100 0000 |


    # 2.5.2 Difference between Binary Equivalent Number and BCD Coded Number


    There is a difference between a binary equivalent of a decimal number and the
    BCD code of a decimal number.


    For Example:


    | Number | Binary Equivalent | BCD |

    |---|---||}{

    | 21 | (10101)₂ | 0010 0001 |

    | 39 | (100111)₂ | 0010 1011 |

    | 14 | (1110)₂ | 0001 0100 |'
