    # 1.3.6 Multi-programming with Fixed Position


    The two approaches of memory management are based on single-user. That is, as
    a single instant

    time only one process is executed. CPU executes only those process which resides
    in our memory or

    main memory. So, only one process resides in main memory at a time and other process
