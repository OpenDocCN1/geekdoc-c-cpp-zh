  md: "# 5.3.1 Local Scope\n\nWe know that a block in C is surrounded by a pair of\
    \ curly braces i.e., { }. We can declare variables inside the block. Such variables\
    \ are called local, and can be referenced only within the body of the block. When\
    \ the control of program execution reaches the opening brace, these variables\
    \ comes into existence and get destroyed as soon as the control leaves the block\
    \ through the closing brace. It may be noted that the variables are available\
    \ to all the blocks enclosed by the block in which they have been declared. Consider\
    \ the following declaration :\n\n```\nwhile(flag)\n{\n  int x;\n  if(y>x)\n{\n\
    \    int y;\n    ....\n  }\n}\n```\n\nThe scope of variable x in the while block\
    \ and that variable y in if-block. Now the variable x can also be referenced in\
    \ the if-block because this block is completely enclosed in the while block. On\
    \ the other hand, the scope of variable y is only the if-block. Since a function\
    \ is a block in itself, all the variables declared in it have the local scope.\n\
    \nThe formal parameters declared in a function have the local scope.\n\n# 5.3.2\
    \ File Scope\n\nSince global variables are declared outside all blocks and functions,\
    \ they are available to all the blocks and functions. Thus, the scope of a global\
    \ variable encompasses the entire program file. This type of scope is known as\
    \ file-scope. For example, the global variables some and 'rate' shown in below\
    \ have a file scope.\n\n```\nint rate;\nint some;\nmain()\n{\n  int total, net;\n\
    \  ....\n  ...\n}\nint any()\n```"
