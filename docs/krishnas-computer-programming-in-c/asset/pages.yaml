  md: '# # Chapter UNIT-3


    # Programming Loop and Iteration


    #  7.1 Introduction


    Many times we require that a group of instructions are be executed until some
    logical conditions are satisfied. It is known as looping. In some situations the
    number of repetitions is known in advance. Situations also arise, however, in
    which the required number of repetitions are not known, the execution of statements
    is repeated until the logical conditions become true.


    A loop in a program essentially consists of two parts : one is the body of the
    loop and the second is known as the control statement. The control statement performs
    a logical test whose result is either a true or false. If the result of this logical
    test is true, then the statements contained in the body of the loop are executed.
    Otherwise, loop is terminated.


    The control statement can be placed before or after the body of the loop. If the
    control statement is placed before the body of the loop, it is called the Entry-Controlled
    Loop. If the control statement is written after the body of the loop, it is called
    the Exit-Controlled Loop. C supports both types of loop statement.


    Generally, a loop has three parts that have different purposes :


    +   - The first one is initialization expression which is declared before entering
    into the loop. The initialization is executed only once in the beginning of the
    loop.


    +   - Secondly, test expression is an expression whose true value decides whether
    the loop will be executed or not. If it is true then only loop will be executed
    otherwise the loop is terminated.


    +   - Third is the updates expression which changes the value of the control variable
    and the last part is the body-of-loop which contains the statements that are executed
    repeatedly.'
