  md: '# # Chapter UNIT-5

    #13


    # # The Standard C Preprocessor


    # ## 13.1 Introduction


    C compiler is basically a combination of two functional programs : the preprocessor
    and translator. The preprocessor, often referred to as cpp reads the source code
    and prepares it for the translator. For translating the code, it scans for special
    instructions, known as preprocessor commands or preprocessor directives. Preprocessor
    commands allows the preprocessor to look for special code libraries, make substitution
    in the code and prepare it for translation into machine language. Preprocessor
    is also called macroprocessor it also allows you to define macros, which are brief
    abbreviations for longer constructs. The output of preprocessor is called translation
    unit.


    Translation unit serves as input for translator. Translator does the actual translation
    of source code into machine language and writes it into a file called object module.
    Object module is thus a program in machine language.


    | Source Program | Preprocessor | Translation Unit | Translator | Object Module
    |


    Fig. 13.1'
  merge: -1
  pgno: 588
- img_proc: true
  md: '# 13.2 C Preprocessor


    C preprocessor is a macroprocessor program that processes the source program before
    it is compiled. It is a

    collection of special statements called preprocessor statements or preprocessor
    directives. These directives

    execute before the C program passes through the compiler. Figure 13.2 shows the
    stages involved in

    compiling a C program.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_589_0.png)


    # 13.3 Preprocessor Directives


    These are statements which begin with the # symbol placed in the first column.
    They are placed before the

    function main(). There will be no semicolon at the end of such statements. There
    are four categories of

    preprocessor directives and their uses :


    +   - Simple string replacement

    - Macro-substitution directives

    - File inclusion directives

    - Conditional compilation directives


    To decide what action to perform, it looks for lines beginning with preprocessor
    directives. Some of them

    should be familiar, we already used # include and # define in many of our programs.
    Given are the

    preprocessor directives and their uses :


    | Directive | Use |

    |---|---|n| #define | define a macro |

    | #include | include text from a file |

    | #undef | undef a macro |

    | #if | test if a compile-time condition holds |

    | #else | indicate alternatives if a text fails |

    | #endif | end a conditional preprocessor |

    | #elif | establishes-else-if chain for multiple compilation options |

    | #line | provide a line number |


    # 13.3.1 Simple String Replacement


    The string replacement through preprocessor is easier. It is a program that processes
    the source code before

    it passes through the compiler. It is the replacement of another string which
    is accomplished through

    #define statement.'
