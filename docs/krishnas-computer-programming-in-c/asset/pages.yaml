  md: '# 1.3 Generations of Computer


    Based on the period of development and the features incorporated, the computers
    are classified into different generations:


    +   - First Generation (1945-1956)

    - Second Generation (1956-1965)

    - Third Generation (1965-1975)

    - Fourth Generation (1975-1995)

    - Fifth Generation (1995-till date)


    # 1.3.1 First Generation


    There are many devices, which can be considered somewhat close to what we now
    call a computer. But the first real computer was the Electronic Numerical Integration
    and Calculator (ENIAC) built in 1946. The device which is used in ENIAC is called
    "vacuum tube". The speed of operations by ENIAC were very slow compared to today''s
    standard, because near about 10,000 to 20,000 tubes were used to run a computer.
    Vacuum tubes were used on the process of ON/OFF. ENIAC had several limitations
    including a very small amount of storage. These machines were huge in size and
    their continued use generated a great deal of heat. In this generation, the programming
    was done only in machine language that means only in the form of 0''s and 1''s
    because vacuum tubes used only the concept of ON/OFF. Each computer had a different
    coded program called a machine language to operate. This made the computer difficult
    to program and limited in versatility and speed. Other distinctive features of
    first generation computers were :


    +   - Use of vacuum tubes for electronic circuitry.

    - Magnetic drums for data storage.

    - Human operators to set switches.

    - Typical computers like : ENIAC, EDVAC, EDSAC, IBM 650 etc.


    # Advantages


    +   - Vacuum tubes were used.

    - The fastest calculating devices at that time.


    # Disadvantages


    +   - Very large in size.

    - Not much reliable.

    - Very costly.


    For Example: ENIAC, IBM 701 etc.'
