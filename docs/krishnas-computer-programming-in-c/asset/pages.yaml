    # 1.20.1 Single Clicking


    It is the most common method of distinguishing mouse-based input. On a single-button
    mouse involves using the mouse''s one button. On the multiple-button mouse, it
    involves any one of the buttons, and is usually characterized by which button
    is pushed.


    # 1.20.2 Double Clicking


    A double-click occurs when the user presses the button twice in quick succession.
    This triggers action separate from that of a single-click. For example in the
    Macintosh Finder, the single-clicks to select a file and double-clicks to open
    that file. Usability studies have that the double-click can be confusing and hard
    to use--for example, with poor motor skills not perform the second double click
    enough, with the result that the action is interpreted as two-clicks rather than
    a double-click. Ironically, the double click was introduced because the previous
    solution- separate mouse buttons for separate actions-was also found to be confusing
    in user studies. Most multiple-button mice allow setting one to emit a double
    click on a single press.


    # 1.20.3 Triple-Clicking


    A triple-click occurs when the user presses the button three times in quick succession.
    This also triggers an action separate from that of a single-click. It is most
    commonly seen in word processors to select a whole paragraph and in web browsers
    to select a line to text.'
