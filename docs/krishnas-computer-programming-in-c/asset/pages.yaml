  md: '# 1.2 Characteristics of Computer


    All computers have certain common characteristics irrespective of their type and
    size. Computers are not just adding machines, they are capable of doing complex
    activities and operations. They can be programmed to do complex, tedious and monotonous
    tasks. Computers are what they are because of the following characteristics:


    # 1.2.1 Speed


    A computer is a very fast machine. It can perform tasks in a few seconds, which
    may take human beings to do consequently. This performance improvement residue
    to the technology used inside computers, which enables very rapid processing compared
    to human processing. The computer based processing goes far beyond that of seconds
    means milliseconds (10⁻³ seconds), microseconds (10⁻⁶ seconds) nanoseconds (10⁻⁹
    seconds) and picoseconds (10⁻¹² seconds).


    # 1.2.2 Accuracy


    Computers are highly accurate machine they never make mistakes. We sometimes hear
    about problems like wrong ticket issued or incorrect telephone bill calculation
    and people say, that it is a computer problem but this is strictly incorrect.
    Computers never make mistake, it is the human, who instruct the computer and provide
    data, who makes mistakes.


    # 1.2.3 Reliability


    The reliability comes from the fact that we can replace many tasks performed by
    human with computers. For instance, it was very common to see paper based files
    and similar mechanisms used in most offices, banks, colleges etc. However, in
    most places, we see computers as their replacement. They can be constructed and
    programmed in such a manner that they always yield guaranteed results.


    # 1.2.4 Memory Capability


    The capability of storage makes computer very useful. It saves the effort of inputs
    evertime, which is useful for many computation in computer. The facilities of
    storage data is on the temporary basis as well as long term basis.


    # 1.2.5 Versatility


    Computers are everywhere in different respects such as in business, for personal
    use at home, in schools for educational purpose, in scientific /engineering applications,
    for satellites controlling and so on. Computers can be used for generic as well
    as specialized purpose. As such, computer is a versatile machine, which is extremely
    useful in many lines of work.'
