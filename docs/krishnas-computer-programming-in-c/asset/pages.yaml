    # 10.7.3 Rules of Pointer Operations


    The following rules are applied while performing operations on pointer variables
    :


    +   1. A pointer variable can be assigned the address of another variable.

    2. A pointer variable can be assigned, the values of another pointer variable.

    3. A pointer variable can be initialized with NULL or zero value.

    4. A pointer variable can be pre-fixed or post-fixed with increment or decrement
    operations.

    5. An integer value may be added or subtracted from a pointer variable.

    6. When two pointers point to the same array, one pointer variable can be subtracted
    from another.

    7. When two pointers point to the objects of the same data types, they can be
    compared using relational operators.

    8. A pointer variable cannot be multiplied by a constant.

    9. Two pointer variables cannot be added.

    10. A value cannot be assigned to an arbitrary address.'
