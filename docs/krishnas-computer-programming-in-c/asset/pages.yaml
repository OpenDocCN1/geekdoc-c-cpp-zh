    # 9.6 Files


    Storage of data in variables and arrays is temporary. Files are used for permanent
    retention of large amount of data. Computer stores files on secondary storage
    device such as magnetic disks, optical disks and tapes.


    All data items processed by digital computers are reduced to combination of zeros
    and ones. This occurs because it is simple and economical to build electronic
    device that can assume two stable states. One state represents 0 and the other
    state represents 1.


    A record is composed of several fields.


    For example, a particular employee records may consists of the following files
    :


    +   1. Employee name

    2. Salary

    3. Department

    4. Employee code

    5. Education

    6. Designation


    Files are divided into two parts :


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_501_0.png)


    # (a) Text File


    A text file is a stream of characters that a computer can process sequentially.
    It is not only processed but also in forward direction. A text stream is a sequence
    of characters. Standard C allows a text stream to be organized into lines terminated
    by a newline character. However, the newline character is optional on the last
    line. In a text stream, certain character translations may occur as required by
    the host environment.


    # (b) Binary Stream


    A binary stream is a sequence of bytes that have a one-to-one correspondence to
    those in the external device that is, no character translations occur. Also, the
    number of bytes written is same as the number of the external device. However,
    an implementation deined number of null bytes may be appended to a binary stream.
    These null bytes may be used to pad the information so that it fills a sector
    on a disk. Not all files have the same capabilities.'
