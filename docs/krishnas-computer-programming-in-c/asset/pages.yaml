    # 4.6 Associativity


    Associativity is used to determine the order in which operator with the same precedence
    are evaluated in a complex expression.


    Associativity can be left to right or right to left.


    Left to Right, associativity evaluates the expression by starting on the left
    and molding to the right.


    Conversely, Right to Left associativity evaluates the expression by proceeding
    from the right to left. Remember, however, that associativity is used only when
    the operators all have the same precedence.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_251_0.png)


    Fig. 4.2


    When the expression contain two operators of equal priority the tie between them
    is settled by the associativity of the operators. Associativity can be of two
    types :


    +   1. Left to Right

    2. Right to Left


    # 4.6.1 Left to Right Associativity


    Left to Right associativity means that the left operand must be unambiguous. Unambiguous
    in which sense? It must be involved in evaluation of any other sub-expression.


    The following shows an example of left to right associativity. Here we have four
    operators of the same precedence (*/*%*)


    ```

    2*8/2%2*4

    ```'
