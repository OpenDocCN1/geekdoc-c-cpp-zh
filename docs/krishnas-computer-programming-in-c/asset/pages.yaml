    #  5.14 Interfunction Communication


    All through the calling and called function are two separate entities, they need
    to communicate to data. The data flow between the calling and called functions
    can be divided into three strategies: a downward flow from the calling to the
    called function, an upward ward flow from the called to the calling function and
    a bi-directional flow in both direction. In the figure 5.7 the flow of data in
    these cases.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_292_0.png)


    +   1. **Downward Flow**: In downward communication, the calling function sends
    data to the called function. No data flows in the opposite direction. In this
    strategy, copies of the data items are passed from the calling function to the
    called function. The calling function may change the values passed, but the original
    values in the calling function remain untouched.


    +   2. **Upward Flow**: Upward communication occurs when the calling function
    sends data back to the called function without receiving any data from it. A good
    example of this communication is when the calling function reads data from the
    key board that needs to be passed back to the called function.


    +   3. **Bi-directional Flow**: Bi-directional communication occurs when the calling
    function sends data to the called function. During or at the end of its processing,
    the called function then sends data upto the calling function.'
