  md: '# 3.12.1.2 Identifiers


    +   1. An identifier must begin with a letter and be followed by letters or digits.

    2. Understanding (_) is permitted and considered as a letter. It is used for better
    understanding of the identifier name.

    3. Name of an identifier cannot be anything out of the reversed words.

    4. The C language is case sensitive. Thus, the name SUM and sum are different
    identifiers. Generally lower case letters are used for variable names, functions
    names and uppercase letters are the symbolic constants.

    5. The ANSI (American National Standard Institute) for C compiler allows at least
    31 characters in an identifier name. It is a good practice to have identifiers
    with few letters, up to 8 letters is generally preferred.


    Identifiers are basically the names that are used for identifying an entity. These
    entities can be anything like variables, functions


