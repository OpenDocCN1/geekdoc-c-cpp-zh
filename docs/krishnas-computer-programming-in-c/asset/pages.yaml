    (xii) Proof by Contradiction: If you make an assumption, and that assumption produces
    a statement that does not make sense, then you must conclude that your assumption
    is wrong. For example, suppose that your car does not start. Then for simplicity''s
    sake assume that either the battery is dead or the starter is defective: So first
    assume that the battery is dead and try to start it. If it doesn''t start, you
    have a situation that does not make sense under your assumption of dead battery.
    That is, a good battery should start the car but it doesn''t. So you conclude
    that your assumption is wrong. That the battery is not the cause. Proof by contradiction
    follows that logic.


    In this method we assume that the assertion to be proven is not true and try to
    draw a contradiction i.e., something is always false. If we produce a contradiction,
    then our assumption is wrong and therefore the assertion we are trying to prove
    is true. Example 3 below uses this method.


    When you are stuck trying to justify some assertion, proof by contradiction is
