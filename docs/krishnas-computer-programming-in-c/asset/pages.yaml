- img_proc: true
  md: '# 12.2 What is LINUX ?


    As you may already know, Linux is a freely distributed implementation of a UNIX
    like kernel, the low level core of an operating system. Because Linux takes the
    UNIX system as its inspiration, Linux and UNIX programs are very similar. In fact,
    almost all programs written for UNIX can be compiled and run on Linux. Also, some
    commercial applications sold for commercial versions of UNIX can run unchanged
    in Linux system.


