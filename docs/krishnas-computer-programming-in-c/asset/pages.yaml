    # 4.1.2 Arithmetic Operators


    Arithmetic operators are used for performing most common operations of mathematics
    like addition, subtraction ext. Normally, these operators are considered as basic
    operators and known as binary operators as they require two variables to be evaluated.
    The parenthesis () are used to clarify complex operations. The operators + (+)
    and minus (-) are used as unary plus and unary minus operators also. The unary
    minus (-) negates the sign of its operand. Arithmetic operators are used to perform
    the basic arithmetic operations. Here, the lowest number indicates the highest
    priority and highest number indicates the lowest priority. The priority indicates
    which term is to be evaluated and associativity indicates the order in which the
    terms are evaluated. This is either from left to right.'
