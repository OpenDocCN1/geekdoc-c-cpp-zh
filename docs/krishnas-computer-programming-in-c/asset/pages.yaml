  md: "# 5.5.1 Parameter Passing in Function\n\nWe have seen that two way communication\
    \ between functions can be achieved through global variables. This technique has\
    \ its own limitations and drawbacks. Let us, now see how this communication between\
    \ the calling function can be improved and made fruitful.\n\nThe two way communication\
    \ between the various functions can be achieved through parameters and return\
    \ statement. The set of parameters defined in a function are called formal or\
    \ dummy parameters whereas the set of corresponding parameters by the calling\
    \ function are called actual parameters. For instance the variable a and b in\
    \ the argument of list of function add are formal parameters. The parameters included\
    \ in the function call i.e., val1 and val2 are actual parameters.\n\nIn the above\
    \ example, we find that arguments are sent to the functions and their values are\
    \ copied in the corresponding function. This is a sort of information interchange\
    \ between the calling function and the called function. This is known as parameter\
    \ passing. It is a mechanism through which arguments are passed to the called\
    \ function for the required processing. There are two methods of parameters passing\
    \ :\n\n+   1. Call by Value\n2. Call by Reference\n\n# 5.5.1.1 Call by Value\n\
    \n```\nint big(int x, int y)\n{\nif(x>y)\n    return x;\nelse\n    return y;\n\
    }\n```"
