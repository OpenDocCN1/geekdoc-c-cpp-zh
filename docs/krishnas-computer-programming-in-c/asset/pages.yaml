    In addition to space and width specifications, two other events stop the scanc
    f. If the user signals that by keying end of file (EOF or eof), then scancf terminates
    the input process. While there is no EOF on the keyboard, it can be simulated
    in most systems.


    For example, Windows use the <ctrl+z> key combination to signal EOF. Unix and
    Apple Macintosh use <ctrl+d>fro EOF. The C manual for your system should specify
    the key sequence for EOF.


    Second, if scanc encounters an invalid character when it is trying to convert
    the input to the stored data type, it stops. The most common error is finding
    a nonnumeric character when it is trying to read a number. The valid characters
    are leading plus or minus, digit, and one decimal point. Any other combination
    including any alphabetic characters will cause an error.


