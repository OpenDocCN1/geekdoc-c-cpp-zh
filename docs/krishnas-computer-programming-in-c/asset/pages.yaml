    # # 1.7 Algorithm


    A algorithm is a procedure or formula for solving a problem. It can be defined
    as a step-by-step procedure to solve a particular problem or program. The word
    derive from the name of mathematician, Mohammed Ibn-Musa-al-Khwarizmi, who was
    a part of the royal court in Baghdad, Al-Khwarizmi''s work is the likely source
    for the word algebra well. There are five important characteristics of algorithm:


    +   1. Input: It may accept zero or more input.

    2. Output: It should produce at least one output.

    3. Definiteness: Instruction must be clear, well defined and precise. There should
    not be any ambiguity.

    4. Finiteness: It should be a sequence of finite instructions that is, it should
    end after a fixed time.

    5. Effectiveness: This means that operations must be simple and carried out in
    a finite time of one or more levels of complexity.


    The development of an algorithm is basic to computer programming. Developing a
    computer program is a detailed process, which requires serious thought, careful
    planning and accuracy. It is a challenging and exacting task drawing on the creativity
    of the program. In order to write computer programs without any logical error,
    it is recommended programmers to prepare a rough writing showing the steps involved
    in the program, which is called an algorithm.


    An algorithm is a step-by-step instructions to solve any problem. An algorithm
    consists of a set of explicit and unambiguous finite steps, when carried out for
    a given set of initial conditions, produce the corresponding output and terminate
    in a fixed amount of time. By unbiased it means that each steps should be defined
    precisely *i.e.*, it should have only one meaning.


    # # 1.8 Notations for Algorithm


    +   1. Name of the Algorithm: It specifies the problems to be solved.

    2. Step Numbers: Identification tag of an instruction and it is an unsigned positive
    integer.

    3. Explanatory Comment: It follows the step number and describes the operation.
    It should be written a part of square bracket.'
  merge: -1
  pgno: 29
