    location where the data can be stored. They are used to denote constants functions,
    arrays, fields of structures, name of files etc.


    # 3.131 Rules for forming variable names


    +   - The first character of a variable name must be an alphabet or an underscore.

    - All succeeding characters consists of letters and digits.

    - Both uppercase and lowercase variables are significant in C.

    - Writing the variable name in lowercase is a good programming practice.

    - Keywords should not be used as variables.'
