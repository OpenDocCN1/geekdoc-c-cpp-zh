  md: '# 2.5 Binary Coded Decimal (BCD)


    The number system is most natural for computer because of the two stable states
    of its components. But unfortunately, this is not a very natural system for us,
    as we work with decimal number system. For arithmetic operations or performing
    computation in decimal form, it is required that the decimal numbers should be
    coded suitably. Normally, the decimal digits are coded in 6-bit characters for
    the purpose of arithmetic calculations the decimal digits are treated as four
    binary code, BCD code is one of the early memory code. It is the simplest binary
    code to represent a decimal number. If a decimal number consists of two or more
    than two digits, each decimal digit is individually represented by its 4-bits
    binary equivalent.


    For Example: 49 is represented by 0100 1001


    # 2.5.1 Representation of various numbers in BCD Code


    | Decimal | BCD Code | Decimal | BCD Code |

    |---|---|---||}{

    | 1 | 0001 | 15 | 0001 0101 |

    | 2 | 0010 | 16 | 0001 0110 |

    | 3 | 0011 | 17 | 0001 0111 |

    | 4 | 0100 | 18 | 0001 1000 |

