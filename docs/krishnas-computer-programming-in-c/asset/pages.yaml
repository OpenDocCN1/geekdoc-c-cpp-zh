    # 6.4 Switch() Statement


    Switch statement provides means for checking a given expression and selecting
    one course of action among various action available.


    Switch statement, comprises of two sections :


    +   1. This section is identified by switch keyword and contain the expression
    that is to be evaluated.

    2. This section comprises of multiple case statements, which clearly associate
    all possible outcomes of the expression and the actions to be formed in each case.


    A switch statement is used when there is a choice as what code to execute, depending
    on the value of a constant expression. Different cases are presented, and are
    checked by one to see if one case matches the value of the constant expression.
    If a case matches, that block of code is executed. If none of the cases match,
    the default code is executed.


    The switch case statement is a multiple branch selection statement, which successively
    tests the value of an expression against a list of integer constants. A switch
    statement allow you to choose a block of statements among several alternatives.
    This general syntax of the switch statement :


    ```

    switch(expression)

    case 1:

    statement 1;

    break;

    case 2:

    statement 2;

    break;

    case 3:

    statement 3;

    break;

    ....................

    default:

    statement n;

    }

    ```'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 314 Computer Programming in "C"


    The break statement encountered at the end of each case statements causes the
    control of execution to terminate and transfers the control to next statement
    following the closing curly brace of the switch statement, if there is no break
    at the end of a particular sequence of statement for a particular case label then
    the statement belonging to the next case execution.


    ![](img/4482e33db9774a6b62bcd3fe65a7366e_329_0.png)


    The switch statement is often used to process keyword commands such as menu selection.
    The flowchart of switch case statement is illustrate in figure.


    It tests a control expression. The control is transferred to one of the several
    alternatives. The value of the expression may be type int or char but not of type
    float or double. It is generally used for menu driven options.


    The following rules should be used for switch statement :


    +   (i) The expression value must be an integer, hence the type can be int or
    char.

    (ii) Case should always be followed by an integer constant, character constant
    or constant expression.

    (iii) All the cases should be distinct.

    (iv) The block of statements under default is executed when none of the cases
    match the value of the expression.

    (v) Default can optionally be present.

    (vi) Cases and default can occur in any order.

    (vii) The break statement causes an explicit exit from the switch statement. If
    it is not present, after executing the case which match the value of the expression,
    the following other cases are executed, as C treats the cases just as labels.'
