    # 3.12.1 Keywords and Identifiers


    A word in C is named either keyword or an identifier.


    # 3.12.1.1 Keywords


    Keywords are words whose meaning have been fixed and is known to its compiler,
    we cannot change the meaning of the keywords, if we try to do so an error message
    will occur. Keyword or reserved words form the basic building in the formation
    of C statements.


    In C language some words are reserved for specific task. They carry special meaning
    for C compiler. Thus, these words should not be used as identifiers. These reversed
    words are called keywords.


    Every word in a C program is either a keyword or an identifier. All are basically
    the sequence of characters that have one or more fixed meanings. These meanings
    in any circumstances, cannot be changed. All C keywords must be written in lowercase
    letters. Because C both uppercase and lowercase letters are significant. The table
    shows all the keywords supported by the ANSI in C :


    | auto | short | if |

