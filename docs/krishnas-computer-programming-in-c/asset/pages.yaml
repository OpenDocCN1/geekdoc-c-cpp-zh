    # 1.5 Hardware and Software


    # 1.5.1 Hardware


    The physical component of a computer is called hardware. The input device is usually
    a keyboard when programs and data are entered into the computer.


    The Central Processing Unit (C.P.U) is responsible executing instructions such
    as arithmetic calculations; comparisons among data, and movement of data inside
    the system. Today''s computers may have two, or more C.P.U''s. Primary storage,
    also known as main memory is a place where the programs and data are stored temporarily
    during processing. The data in primary storage are erased when we turns off a
    personal computer or when we log off from a time sharing computer.


    > For Example: Monitor, Keyboard, Mouse, CPU, Hard disc etc.


    # 1.5.2 Software


    A sequence of instruction given to a computer to perform a particular task is
    called a program. A set of programs written for a computer is called software.


    > For Example: C, C++, Java, Pascal etc.


    Software is divided into two types:


    +   1. System Software

    2. Application Software


    # 1.5.2.1 System Software


    A system required to execute the user program is known as System Software. System
    Software is a set of or more programs designed to control the operation of a computer
    system. There are general programs to write human assets with the help of computer
    programming task.


    System software consists of programs that manage the resources of a computer and
    perform information processing tasks. These programs are divided into three classes:
    the operating system, system support and system development.


    The operating system provides services such as a user interface and database access,
    and interfaces to communication system as internet protocols. The primary purpose
    of this software is to keep the system operating in an efficient manner while
    allowing the users access to the system.


    System support software provides system utilities and other operating services.
    The last system category system development software includes the language translators
    that convert programs into machine language for execution; debugging tools to
    ensure that the programs are error free.'
