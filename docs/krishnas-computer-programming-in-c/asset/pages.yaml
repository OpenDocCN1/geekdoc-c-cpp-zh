    # 1.30 Batch System


    To improve utilization, the concept of batch operating system was developed "Jobs
    with similar needs were batched together and were run through the computer as
    a group". Thus, the programmer leave their program with operator, who in turn
    would sort program into batches with similar requirements. Central idea behind
    the batch processing scheme was the use of a piece of software known as monitor.
    With the use of this type of operating system, the user no longer has direct access
    to machine. Rather the user submits the job to computer operator, who batches
    the job sequentially and finishes the entire batch on an Input device for monitor.


    A batch operating system accepts jobs and places them in a queue to await execution.
    This process is often called pooling. Essentially what happens is the jobs are
    placed in a queue on a disk unit. An execution time becomes available, the operating
    system selects jobs based on priorities from the queue. Batch jobs may be executed
    on a serial basis, where one job is executed at a time or on multiprogramming
    basis, where multiple jobs are executed concurrently. Most operating systems in
    personal computers work on a batch serial basis without using pooling.


    # Advantages of Batch System


    +   - Move much of the work of the work of the operator to the computer.


    +   - Increased performance since it was possible for job to start as soon as
    the previous job finished.


    # Disadvantages of Batch System


    +   - More difficult to debug program.


    +   - A job could enter an infinite loop.


    +   - A job could corrupt the monitor, thus affecting pending jobs.


    +   - Turn around time can be large from user stand point.'
