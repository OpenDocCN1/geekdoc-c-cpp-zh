    # 1.21.4 Screen Projector


    Screen projector is an output device used to project information from a computer
    to a large screen so that a group of people can view it simultaneously. It is
    very useful for making presentations to a group of people with direct use of a
    computer.


    Before such output device was available the contents of a presentation were prepared
    using a computer. The presentation material was printed on a printer and the pronto
    was reuse on overhead projector transparency sheets using a copier machine. Finally,
    the presentation was made by using an overhead projector. Special marker pens
    had to be used for marking certain portions of the contents on the transparency
    sheets during the presentation.


    A screen projector simplifies this job. It can be plugged to a computer system
    directly and a presenter can make a presentation to a group of people by projecting
    the presentation material one after another on a large screen with the help of
    computer''s keyboard or mouse. With this facility, the presenter can also directly
    point to or edit certain portions of the contents of the displayed material during
    the presentation to make the presentation more understandable. Additionally, a
    full-fledged multimedia presentation with audio, video, image and animation can
    be prepared and made using this facility to make the presentation lively and interesting.


    Screen projectors have become common presentation equipment today. They are used
    commonly with portable notebook computers to setup a modern presentation facility
    quickly at any place with great ease. Like monitors, screen projectors provide
    a temporary, soft-copy output.


    # 1.21.5 Voice Response Systems


    Just as a speech recognition system allows a user to talk to a computer a voice
