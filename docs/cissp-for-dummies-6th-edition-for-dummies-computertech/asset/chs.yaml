  \ MULTICS` 操作系统和 `Novell Netware` 均在其体系架构中实现了保护环的概念。\n\n### 安全模式（Security modes）\n\
  \n系统的 `security mode of operation`（安全运行模式）描述了系统如何处理不同分类级别的存储信息。根据系统上处理的信息分类级别和授权用户的许可级别，已经定义了多种安全运行模式。这些术语通常用于美国军方和政府系统，包括：\n\
  \n- **专用（Dedicated）：** 所有授权用户必须具有等于或高于系统上处理的最高信息机密级别，并且具有有效的“知情需要”。\n- **系统高级（System\
  \ High）：** 所有授权用户必须具有等于或高于系统上处理的最高信息机密级别，但不一定需要有效的“知情需要”。\n- **多级安全（Multilevel）：**\
  \ 不同分类级别的信息存储或处理在`信任计算机系统`（一种采用了所有必要的硬件和软件保证措施，并满足特定可靠性和安全性要求的系统）上。授权用户必须具有适当的许可级别，并受到访问限制。\n\
  \n![remember](img/remember.png) 信任计算机系统是信任基（TCB）。\n\n安全运行模式通常出现在包含高度敏感信息的环境中。\n\n\
  ### 恢复程序（Recovery procedures）\n\n硬件或软件故障可能会损害系统。在硬件或软件故障期间保护系统的设计包括：\n\n- **容错系统（Fault-tolerant\
  \ systems）：** 这些系统在发生故障后仍能继续运行。\n- **安全失效（Fail-safe systems）：** 当检测到硬件或软件故障时，系统停止执行。\n\
  - **软失效（Fail-soft/resilient systems）：** 当检测到硬件或软件故障时，系统以降级模式运行。\n- **故障转移系统（Failover\
  \ systems）：** 当检测到硬件或软件故障时，系统会自动切换到集群服务器。\n\n### 安全架构中的漏洞（Vulnerabilities in security\
  \ architectures）\n\n除非被经验丰富的安全分析师检测并修正，系统中可能存在许多漏洞，允许利用、攻击或故障。我们讨论以下最重要的问题：\n\n\
  - **隐蔽通道（Covert channels）：** 发生在合法信道内的未知、隐藏的通信。\n- **根特工具（Rootkits）：** 从本质上说，根特工具通过让自己插入架构来使其难以或无法检测。例如，某些根特工具作为虚拟机运行，并将操作系统更改为虚拟机。虽然我们通常不在体系架构章节中讨论恶意软件，但根特工具值得关注的：它们利用各种技术隐藏身形。\n\
  - **竞态条件（Race conditions）：** 多处理和多用户系统中的代码如果没有仔细的设计和测试，可能会导致难以发现的错误。`竞态条件`是系统中的一种缺陷，其输出或结果意外与其他事件的时间相关。`竞态条件`一词源于两个正在竞争影响活动的事件。最常见的竞态条件是由于在检查条件和使用结果之间发生变化引起的\
  \ Bug。例如，两个尝试独占打开文件的程序可能都打开了文件。\n- **状态攻击（State attacks）：** 网络应用程序使用会话管理来区分用户。用于建立会话的机制必须能够抵抗攻击。主要是创建会话标识符的算法不允许攻击者窃取。成功的攻击会导致接管其他用户的会话，从而导致机密数据泄露、欺诈和盗窃。\n\
  - **泄漏（Emanations）：** 无无产生的电磁或声学能量可以被他人拦截，并可能用于非法获取系统信息。常见的非预期泄漏是 CRT（阴极射线管，是的……它们仍然存在，而不只是老电影里！）计算机显示器的辐射能量。第三方可以截获显示适配器或显示器发出的辐射来发现\
  \ CRT 上显示的数据。如果电缆系统中有一个或多个未终止的同轴电缆，第三方也可以监听网络。\n\n\n\n\n\n终端上常见的设计漏洞类型通常涉及浏览器和应用程序中客户端代码的缺陷。最常见的缺陷包括：\n\
  \n- `文件系统中留下的敏感数据。` 通常情况下，这些由临时文件和缓存文件组成，系统上的其他用户和进程可能会访问它们。\n- `未受保护的本地数据。` 本地存储可能权限松散且缺乏加密。\n\
  - `脆弱的 applet。` 许多浏览器和其他客户端应用程序经常使用 applet 查看文档和视频文件。通常，applet 本身可能存在可利用的弱点。\n-\
  \ `未受保护或受弱保护的通信。` 客户端与其他系统之间传输的数据可能使用弱加密，或者完全不使用加密。\n- `身份验证弱或不存在。` 客户端或客户端与服务器系统之间的身份验证方法可能不必要地弱。这允许攻击者在不经过身份验证的情况下访问应用程序、本地数据或服务器数据。\n\
  \n客户端系统中可能存在其他弱点。要更全面地了解应用程序漏洞，请参阅[`www.owasp.org`](http://www.owasp.org)。\n\n识别上述示例中的弱点需要以下一项或多项技术：\n\
  \n- 操作系统检查\n- 网络嗅探\n- 代码审查\n- 手动测试与观察\n\n### 服务器系统\n\n在服务器上发现的设计漏洞分为以下几类：\n\n- `文件系统中留下的敏感数据。`\
  \ 通常情况下，这些由临时文件和缓存文件组成，系统上的其他用户和进程可能会访问它们。\n- `未受保护的本地数据。` 本地存储可能权限松散且缺乏加密。\n- `未受保护或受弱保护的通信。`\
  \ 服务器与其他系统（包括客户端）之间传输的数据可能使用弱加密，或者完全不使用加密。\n- `身份验证弱或不存在。` 服务器上的身份验证方法可能不必要地弱。这允许攻击者在不经过身份验证的情况下访问应用程序、本地数据或服务器数据。\n\
  \n这些缺陷与上述“基于客户端”章节中的缺陷是的。这是因为 `client` 和 `server` 这两个术语仅取决于视角：在两种情况下，软件都运行在系统上。\n\
  \n### 数据库系统\n\n数据库管理系统的复杂程度几乎与其运行的操作系统相当。数据库管理系统的漏洞包括：\n\n- `松散的访问权限。` 与应用程序和操作系统一样，数据库管理系统的访问控制方案通常被设计得过于松散，这允许对关键和敏感信息的访问超过合理范围。松散访问权限的另一个方面是具有特权访问权限的人员过多。最后，在适当的情况下，未能实现加密作为一种访问控制。\n\
  - `过度保留敏感数据。` 将敏感数据保存超过需要的时间会增加安全泄露的影响。\n- `个人身份信息的聚合。` 这种对公民数据进行 `aggregation`\
  \ 的做法是一项具有潜在风险的任务，可能导致组织拥有敏感个人信息。有时，当组织将来自各种来源的历史数据存入数据仓库时就会发生这种情况，这些分散的敏感数据首次聚集在一起。结果是一个金矿或一个定时炸弹，取决于你如何看待它。\n\
  \n数据库安全缺陷可以通过手动检查或自动化工具识别。缓解措施可能简单如更改访问权限，也可能如重新设计数据库模式和相关的应用程序程序。\n\n### 大规模并行数据系统\n\
  \n大规模并行数据系统是拥有大量处理器的系统。处理器可能位于一个物理位置，也可能地理上分布。这些系统的漏洞包括：\n\n- `松散的访问权限。` 管理界面或处理系统本身可能具有默认、易猜或共享的登录凭据，这将允许入侵者轻易攻击系统。\n\
  - `未受保护或受弱保护的通信。` 系统之间传输的数据可能使用弱加密或完全不使用加密。这可能允许攻击者获取传输中的敏感数据或获得足够的知识来破坏系统。\n\n\
  并行系统的安全缺陷可以通过手动检查识别，并通过配置更改或系统设计更改来缓解。\n\n### 分布式系统\n\n分布式系统是指组件分散在物理和逻辑空间中的系统。通常，这些组件由不同的小组或组织拥有和或管理，有时位于不同的国家。某些组件可能供私人使用，而另一些组件代表向公众提供的服务（例如\
  \ `Google Maps`）。分布式系统的漏洞包括：\n\n- `松散的访问权限。` 分布式系统中的单个组件可能有独立的、分离的访问控制系统，或者针对所有分布式系统组件的总访问控制系统。无论何种情况，访问权限松散的机会都太多，从而允许某些主体访问比其需要的数据和功能。\n\
  - `未受保护或受弱保护的通信。` 服务器与其他系统（包括客户端）之间传输的数据可能使用弱加密或完全不使用加密。\n- `弱的安全继承。` 我们在这里的意思是在分布式系统中，其中一个组件的安全性弱可能会损害整个系统的安全性。例如，一个公开访问的组件可能对其他组件具有直接开放访问，绕过这些其他组件的本地控制。\n\
  - `缺乏中心化的安全和控制。` 由多个组织控制的分布式系统通常缺乏安全管理和安全操作的整体监督。对于点对点系统尤为如此，这些系统通常由终端用户在轻度管理或未管理的终端上运行。\n\
  - `关键路径。` 关键路径弱点是指系统的持续运行取决于单个组件的可用性。\n\n所有这些弱点也可能出现在更简单的环境中。可以通过使用安全扫描工具或手动技术检测到这些弱点和其他缺陷，并采取纠正措施来缓解这些缺陷。\n\
  \n![tip](img/tip.png) 云计算的高质量标准——针对云服务提供商以及使用云服务的组织——可以在云安全联盟[`www.cloudsecurityalliance.org`](http://www.cloudsecurityalliance.org)\
  \ 和欧洲网络和信息安全局 (ENISA — [`www.enisa.europa.eu`](http://www.enisa.europa.eu)) 找到。\n\
  \n## 加密系统特别容易包含漏洞，简单原因是因为人们关注加密算法，但未能正确地实现它。像任何强大的工具一样，如果操作者不知道如何使用它，它在最好情况下是没用的，最坏的情况下是危险的。\n\
  \n加密系统可能脆弱的方式包括：\n\n- `使用过时的算法。` 开发者和工程师必须小心选择稳健的加密算法。此外，对使用的算法应至少每年审查一次，以确保它们继续有效。\n\
  \n\n\n\n\n- **使用了未经测试的算法。** 工程师有时会犯这样的错误：要么自创加密系统，要么使用明显性不足的系统。最好的做法是使用许多公开的、经受过反复审查的加密系统。\n\
  - **未对加密密钥进行加密。** 适当的加密系统有时要求加密密钥本身也必须加密。\n- **加密密钥过弱。** 如果初始化向量太小，或者使用了过短或过于简单的密钥，即使选择了再出色的算法也会付诸东流。\n\
  - **对加密密钥的保护不足。** 加密系统的强度取决于其加密密钥的保护程度。如果有太多的人可以访问密钥，或者密钥没有足够的保护，入侵者可能仅通过窃取和使用密钥就能破坏系统。应该为用于加密/解密数据的数据加密密钥\
  \ (`DEK`) 和用于加密/解密 `DEK` 的密钥加密密钥 (`KEK`) 使用独立的加密密钥。\n\n加密系统中的这些和其他漏洞可以通过对加密系统进行同行评审、由合格的第三方进行评估以及实施纠措施修复缺陷来检测和缓解。\n\
  \n#### 工业控制系统\n\n工业控制系统 (`ICS`) 代表了用于监控和控制各种机械设备的广泛手段，包括发电、配电和消费；天然气和石油管道；市政水务、灌溉和废物系统；交通信号；制造以及包装分发。\n\
  \n工业控制系统的弱点包括：\n\n- **访问权限松散。** 对 `ICS` 的监控或控制访问权限通常设置得太松，导致某些用户或系统获得了比其需要更多的数据和控制权限。\n\
  - **未更改默认访问凭据。** 很多情况下，组织在实施 `ICS` 组件时未能更改这些组件上的默认管理员凭据。这使得入侵者极易接管 `ICS`。\n- **通过个人设备访问。**\
  \ 出于便利考虑，某些组织允许人员从个人拥有的手机和平板电脑控制机械。这极大地增加了 `ICS` 的攻击面，并为入侵者访问和控制关键机械提供了机会。\n- **缺乏恶意软件控制。**\
  \ 许多 `ICS` 缺乏检测和阻止恶意软件及其他恶意活动的安全组件，导致入侵者进入 `ICS` 非常容易。\n- **未对 ICS 进行物理隔离。** 许多组织未能将\
  \ `ICS` 与其企业网络的其他部分进行物理隔离，从而导致恶意软件和入侵者有大量机会通过企业网络访问 `ICS`，而用户会通过钓鱼或其他手段引入恶意软件。\n\
  - **未更新 ICS 组件。** 虽然 `ICS` 组件的制造商因不发布安全补丁而臭名昭著，但组织在这些补丁到达后未能安装也同样有责任。\n\n这些漏洞可以通过系统化的流程来缓解，包括建立良好的控制、测试控制的有效性，以及在发现控制措施无效时采取纠正措施。\n\
  \n#### 云云系统\n\n美国国家标准与技术研究院 (`NIST`) 定义了三种云计算服务模型如下：\n\n- **软件即服务 (SaaS)：** 为客户提供运行在云基础设施上的应用程序访问权限。该应用程序可以通过各种客户端设备和接口访问，但客户并不了解、也不管理或控制底层的云基础设施。客户可能拥有有限的用户特定应用程序设置。\n\
  - **平台即服务 (PaaS)：** 客户可以在提供者的基础设施上部署应用程序，但客户并不了解、也不管理或控制底层的云基础设施。客户对部署的应用程序拥有控制权。\n\
  - **基础设施即服务 (IaaS)：** 客户可以配置处理、存储、网络和其他计算资源，但客户并不了解、也不管理或控制云基础设施。客户运行操作系统。\n\n`NIST`\
  \ 进一步定义了四种云计算部署模型如下：\n\n- **公共：** 供普通公众使用的云基础设施。它由第三方（多个实体）拥有、管理和运行，并存在于云提供者的场所。\n\
  - **社区：** 仅供特定组织组使用的云基础设施。\n- **私有：** 仅供单一组织使用的云基础设施。它可以由该组织或第三方（或两者结合）拥有、管理和运行，并可能存在于内部或外部。\n\
  - **混合：** 由上述两种或两种部署模型组成的云基础设施，通过标准化或专有技术绑定，实现数据和应用程序的可移植性（例如，用于灾备恢复的备用数据中心，或跨多个云的内容交付网络）。\n\
  \n主要的公共云服务提供商如 `Amazon Web Services`、`Microsoft Azure`、`Google Cloud Platform` 和\
  \ `Oracle Cloud Platform` 不仅为客户提供了近乎无限的计算和存储，还提供了往往超过客户能力的深度和安全能力。然而，这并不意味着云系统本质是安全的。公共云服务提供商使用责任共担模型来明确定义哪些安全方面由提供商负责，哪些方面由客户负责。SaaS\
  \ 模型将大部分责任放在云服务提供商身上，通常包括以下内容：\n\n- 应用程序和数据\n- 运行时和中间件\n- 服务器、虚拟化和操作系统\n- 存储和网络\n\
  - 物理数据中心\n\n然而，客户对其数据的安全和隐私负最终责任。此外，身份和访问管理 (`IAM`) 通常是客户的责任。\n\n在 PaaS 模型中，客户通常负责其应用程序和数据的安全，以及\
  \ `IAM` 等。\n\n在 IaaS 模型中，客户通常负责其应用程序和数据、运行时和中间件以及操作系统的安全。云服务提供商通常负责网络和数据中心的安全（尽管云服务提供商通常不提供防火墙）。虚拟化、服务器和存储安全可能由云服务提供商或客户管理。\n\
  \n![tip](img/tip.png) 云安全联盟 (`CSA`) 发布了《云控制矩阵》，提供了一个专门为云行业设计的信息安全框架。\n\n#### 物联网\n\
  \n\n\n\n\n物联网（IoT）设备和系统的安全性是信息安全领域一个快速发展的领域。IoT 传感器和设备收集了大量潜在敏感数据和看似无害的数据。然而，在某些情况下，实际上所收集的任何数据都可能被用于恶意目的，因此安全性必须是\
  \ IoT 设备和系统的关键设计考量。这不仅包括保护存储在系统中的数据，还包括数据如何收集、传输、处理和使用。IoT 设备中应用有许多网络和通信协议，包括：\n\
  \n* `IPv6 over Low power Wireless Personal Area Networks (6LoWPAN)`\n* `5G`\n* `Wi-Fi`\n\
  * `Bluetooth Mesh and Bluetooth Low-Energy (BLE)`\n* `Thread`\n* `Zigbee` 以及其他许多\n\
  \n在设计安全的 IoT 设备和系统时，必须仔细考虑这些各种协议及其实现。\n\n## 评估和缓解基于 Web 的系统的漏洞\n\n基于 Web 的系统包含许多组件，包括应用程序代码、数据库管理系统、操作系统、中间件以及\
  \ Web 服务器本身。这些组件在单独或整体上可能存在安全设计或实现上的缺陷。存在的一些缺陷包括：\n\n* `未能阻止注入攻击。` 诸如 JavaScript\
  \ 注入和 SQL 注入等攻击可能允许攻击者导致 Web 应用程序发生故障并暴露内部存储的敏感数据。\n* `身份验证缺陷。` 网站实现身份验证的方式有很多，多到无法在此处列举。身份验证的正确性至关重要；许多网站未能做到这一点。\n\
  * `会话管理缺陷。` Web 服务器创建逻辑“会话（sessions）”来跟踪单个用户。许多网站的会话管理机制很容易被滥用，最著名的是允许攻击者接管另一个用户的会话。\n\
  * `未能阻止跨站脚本攻击。` 网站未能对输入数据进行检查和清理。结果是，攻击者有时可以创建向用户发送恶意内容的攻击。\n* `未能阻止跨站请求伪造攻击。` 未能采用适当会话和会话上下文管理的网站可能会受到攻击，在这些攻击中，用户被欺骗向网站发送命令，可能会对他们造成伤害。\n\
  \n我们喜欢的示例是：攻击者欺骗用户点击一个链接，该链接实际上将用户带到如下的 URL：`http://bank.com/transfer?tohackeraccount:amount=99999.99`。\n\
  \n* `未能保护直接对象引用。` 网站有时会被欺骗，访问并将数据发送给未经授权查看或修改这些数据的用户。\n\n这些漏洞可以通过三种主要方式进行缓解：\n\n\
  * 对更安全的软件开发技术进行开发者培训。\n* 将安全性纳入开发生命周期。\n* 使用动态和静态应用程序扫描工具。\n\n![tip](img/tip.png)\
  \ 如需更深入地审查基于 Web 的系统的漏洞，请阅读 `www.owasp.org` 上的“前十名”列表。\n\n## 评估和缓解移动系统的漏洞\n\n移动系统包括智能手机、平板电脑、手机、智能手表和可穿设备上的操作系统和应用程序。移动系统最流行的操作系统平台是\
  \ Apple iOS、`Android` 和 `Windows 10`。\n\n移动系统中发现的漏洞包括：\n\n* `缺乏稳健的资源访问控制。` 历史表明，某些移动操作系统缺乏稳健控制来管理哪些应用程序允许访问移动设备上的资源，包括：\n\
  \    * 本地存储的数据\n    * 联系人列表\n    * 相册\n    * 电子邮件消息\n    * 位置服务\n    * 摄像头\n   \
  \ * 麦克风\n* `对应用程序的安全筛选不足。` 某些移动平台环境非常擅长筛选包含安全缺陷或公然违反规则的应用程序，但其他平台似乎有更多“随心所欲”的政策。结果是买者自：你的移动\
  \ App 执行的操作可能比广告的多。\n* `安全设置默认过于松散。` 许多移动平台缺乏对基础安全的强制，例如，不要求设备自动锁定或设置锁定密码。\n\n在管理的企业环境中，使用移动设备管理（`MDM`）系统可以缓解许多或所有这些风险。对于个人用户来说，缓解取决于个人是否做正确的事并使用强的安全设置。\n\
  \n## 评估和缓解嵌入式设备的漏洞\n\n嵌入式设备涵盖各种连接互联网的系统和设备。主要，我们指的是在计算意义上与人类连接的设备。此类设备的示例包括：\n\n\
  * 汽车和其他车辆。\n* 家用电器，如洗衣机和烘干机、炉灶和烤箱、冰箱、恒温器、电视机、游戏机、视频监控系统和家庭自动化系统。\n* 医疗保健设备，如静脉注射泵和患者监测设备。\n\
  * 暖、通风和空调（`HVAC`）系统。\n* 商业视频监控和门禁卡系统。\n* 自动支付终端、加油泵和自动取款机（`ATMs`）。\n* 网络设备，如路由器、交换机、调制解调器、防火墙等。\n\
  \n这些设备通常运行嵌入式系统，这是一种设计在缺乏键盘或显示器等计算机类人类交互的设备上的专用操作系统。它们仍然拥有与笔记本电脑和移动设备等终端发现的非常类似的操作系统。\n\
  \n此类设备的一些设计缺陷包括：\n\n* `缺乏安全补丁机制。` 这些设备大多数完全缺乏任何修复在制造后发现的安全缺陷的手段。\n* `缺乏反恶意软件机制。`\
  \ 这些设备大多数完全没有内置防御。对于入侵者的攻击，它们完全没有防备能力。\n* `缺乏稳健的身份验证。` 许多此类设备具有简单、易猜测的默认登录凭据，这些凭据无法更改（或者其说，所有者很少更改）。\n\
  * `缺乏监控功能。` 许多此类设备缺乏发送安全和事件警报的手段。\n\n由于大多数此类设备无法更改，缓解这些缺陷通常涉及将这些设备隔离在受严格保护的网络中，并部署用于检测和拦截攻击的工具。\n\
  \n![tip](img/tip.png) 许多嵌入式设备的制造商不允许客户更改其配置或应用安全设置。这迫使组织将这些设备放置在独立的保护网络中。\n\n##\
  \ 应用加密\n\n`Cryptography`（源自希腊语 `kryptos` 意为“隐藏”，`graphia` 意为“写作”）是加密和解密通信的科学，使其除目标接收者之外的人无法理解。\n\
  \n加密可用于实现信息安全的几个目标，包括机密性、完整性和身份验证。\n\n* `机密性` 首先，加密保护信息的机密性（或秘密性）。即使传输或存储介质被破坏，如果没有正确的解密密钥，加密信息对未经授权的人来说几乎毫无用处。\n\
  * `完整性` 加密还可以通过使用哈希算法和消息摘要来确保信息的完整性（或准确性）。\n\n\n\n\n\n*   **认证：** 最后，密码学可以通过数字签名、数字证书或公钥基础架构（`PKI`）用于认证（及不可否认性）服务。\n\
  \n![remember](img/remember.png) `CISSP` 测试候选人将通用密码学概念应用于现实世界问题和问题的能力。你不需要记忆加密算法或各种加密系统的逐步操作步骤。然而，你应该牢牢掌握密码学概念和技术，以及它们特定的优点、缺点、用途和应用。\n\
  \n![warning](img/warning.png) 不要将这三点与 C-I-A 三元组混淆，我们将在第 3 章中讨论该三元组：C-I-A 三元组涉及机密性、完整性和`availability`（可用性）；而密码学无法确保可用性。\n\
  \n如今的密码学已演变成一门复杂的科学（人说是一门艺术），在信息安全领域带来了许多巨大的前景和挑战。密码学的基础包括各种术语和概念、密码系统的各个组件以及密码的类别和类型。\n\
  \n### 密码学生命周期\n\n密码学生命周期是在系统中使用加密控制过程中发生的一系列事件。这些步骤包括：\n\n*   开发密码系统的需求。\n*   选择加密控制措施。\n\
  *   实施密码系统。\n*   检查密码系统的实现是否正确、密钥管理是否有效以及加密算法的效率。\n*   轮换密钥。\n*   缓解任何识别出的缺陷。\n\n\
  这些步骤与网络和计算环境中任何其他类型的安全控制措施的选择、实施、检查和修正并没有完全不同。与网络和计算环境中的几乎任何其他组件一样，密码系统中的组件必须定期进行检查，以确保它们仍然有效且运行正常。\n\
  \n### 明文与密文\n\n`plaintext`（明文）消息是以其原始可读格式呈现的消息，或者是经过适当解密（去乱码）产生原始可读明文消息的密文消息。\n\n\
  `ciphertext`（密文）消息是被转换（加密）为无法理解的乱码消息的明文消息。这个术语并不适用于老板发给你的可能恰好难以理解的消息！\n\n### 加密与解密\n\
  \n`Encryption`（加密或 `enciphering`）是将明文通信转换为密文的过程。`Decryption`（解密或 `deciphering`）是该过程的反过程，将密文转换为明文。（参见图\
  \ 5-2）。\n\n![image](img/9781119505815-fg0502.png)\n\nFIGURE 5-2: 加密与解密。\n\n网络上的流量可以使用`end-to-end`（端到端）或`link\
  \ encryption`（链路加密）进行加密。\n\n#### 端到端加密\n\n使用`end-to-end encryption`，数据包在原始加密源加密一次，然后仅在最终解密地进行解密。端到端加密的优点是速度和整体安全性。然而，为了让数据包正确路由，只对数据进行加密，而不加密路由信息。\n\
  \n#### 链路加密\n\n`Link encryption`（链路加密）要求每个节点（例如路由器）对其上游和下游邻居拥有独立的密钥对。数据包在网络路径上的每个节点都会被加密、解密，然后重新加密。\n\
  \n下面的示例（如图 5-3 #c05.xhtml_c05-fig-0003 所示）说明了链路加密：\n\n1.  计算机 1 使用 `Secret Key A`\
  \ 加密消息，然后将消息发送到 `Router 1`。\n2.  路由器 1 使用 `Secret Key A` 解密消息，使用 `Secret Key B`\
  \ 重新加密消息，然后将消息发送到 `Router 2`。\n3.  路由器 2 使用 `Secret Key B` 解密消息，使用 `Secret Key C`\
  \ 重新加密消息，然后将消息发送到 `Computer 2`。\n4.  计算机 2 使用 `Secret Key C` 解密消息。\n\n![image](img/9781119505815-fg0503.png)\n\
  \nFIGURE 5-3: 链路加密。\n\n使用链路加密的优点是加密整个数据包（包括路由信息）。然而，链路加密有两个缺点：\n\n*   **延迟：** 数据包必须在每个节点处进行加密/解密，这会导致这些数据包在传输过程中产生延迟。\n\
  *   **固有漏洞：** 如果节点被攻破或数据包的解密内容在节点中被缓存，消息可能会泄露。\n\n#### 总结一下：密码系统\n\n`cryptosystem`（密码系统）是将明文转换为密文（加密）并变回明文（解密）的硬件或软件实现。\n\
  \n有效的密码系统必须具备以下属性：\n\n*   加密和解密过程对于系统密钥空间内所有可能的密钥都是高效的。\n    ![tip](img/tip.png)\
  \ `keyspace`（密钥空间）是密码系统中密钥所有可能值的范围。\n*   密码系统易于使用。难以使用的密码系统可能会被不当使用，导致数据丢失或泄露。\n\
  *   密码系统的强度取决于`cryptovariables`（密码变量）的保密性。\n\n![tip](img/tip.png) `restricted algorithm`（限制算法）指的是为了提供安全而必须保密的加密算法。限制或私有算法并不有效，因为其有效性取决于算法的秘密而非复杂性和变量数量，因此不常用于安全的应用程序。\n\
  \n密码系统通常由两个基本元素组成：\n\n*   **加密算法：** 也称为 `cipher`（密码），`cryptographic algorithm`详细说明了用于产生内容的数学函数：\n\
  \    *   密文（加密）\n    *   明文（解密）\n*   **密码变量：** 也称为 `key`（密钥），`cryptovariable`是应用于算法的秘密值。密码系统的强度和有效性很大程度上取决于密码变量的秘密性和强度。\n\
  \n`Key clustering`（密钥聚集或简单的聚集）发生在使用相同加密算法但不同加密密钥从明文消息生成相同密文消息时。密钥聚集表明加密算法存在缺陷，因为它在统计学上减少了暴力攻击中必须尝试的密钥组合数量。\n\
  \n![remember](img/remember.png) `cryptosystem`（密码系统）由加密算法（密码）和密码变量（密钥）以及由密码和密钥产生的所有可能的明文和密文组成。\n\
  \n![remember](img/remember.png) 密码系统的类比是插锁。插锁很容易识别，其内部工作机制并不是严密守护的国家机。使插锁有效的是控制特定门上特定锁具的单个密钥。然而，如果密钥很弱（想象一把平平钥匙上只有一两个缺口）或者没有受到良好保护（放在门垫下），锁就保护不了你的财产。同样，如果攻击者能够确定用于加密消息的某种加密算法（锁），它仍然应该受到保护，因为你使用了一个保密的强密钥，而不是一个写在废纸条上并放在鼠标垫下的六位字符密码。\n\
  \n#### 密码的类别\n\n\n\n\n\n密码是加密变换。对称密钥算法中使用的两种大类密码是`block`（块）和`stream`（流）（参见本章稍后的部分“不完全的度制：对称与非对称密钥系统”），它们描述了密码如何对输入数据操作。\n\
  \n![remember](img/remember.png) 两种大类密码是块密码和流密码。\n\n## 块密码\n\n`块密码对单个固定长度（通常为 128\
  \ 位）的明文进行操作以产生相应的密文。在块密码中使用给定的密钥，相同的明文块总是产生相同的密文块。块密码相比于流密码的优势是：\n\n* **可重用密钥：**\
  \ 密钥管理容易得多。\n* **互操作性：** 块密码得到了更广泛的支持。\n\n块密码通常在软件中实现。块密码的示例包括`AES`、`DES`、`Blowfish`、`Twofish`\
  \ 和 `RC5`。\n\n## 流密码\n\n`流密码对连续数据流进行实时，通常是逐位进行的。流密码的运行速度通常比块密码快，且实现代码较少。然而，流密码中的密钥通常只使用一次（参见侧边栏“一次性密码：一次性扇”）然后丢弃。密钥管理变成了一个严重的问题。使用流密码，相同的明文位或字节每次加密都会产生不同的密文位或字节。流密码通常在硬件中实现。\n\
  \n流密码的示例包括`Salsa20` 和 `RC4`。\n\n![remember](img/remember.png) 一次性扇是流密码的一种示例，被认为是不可破解的。\n\
  \n## 密码类型\n\n两种基本的密码类型是`substitution`（替换）和置换。两者都参与了将明文转换为密文的过程。\n\n![remember](img/remember.png)\
  \ 大多数现代加密系统同时使用替换和置换来实现加密。\n\n### 替换密码\n\n`替换密码将明文中的位、字符或字符块替换为替代位、字符或字符块以产生密文。替换密码的一个经典例子是尤利斯·凯撒使用的：他将消息中的字母替换为相同字母表中的其他字母。（在本章稍前的侧边栏“加密世界的故事：密码学简史”中阅读更多内容。）在使用标准英语字母表的简单替换密码中，明文消息会加上一个`modulo\
  \ 26`的`加密变量”（密钥）。在`modulo 26` 加法中，对于任何大于或等于 26 的和，余数就是最终结果。例如，在一个基础替换密码中，使用`modulo\
  \ 26` 数学通过增加三个字符来加密单词 `BOY`，会产生以下结果：\n\n| | B | O | Y | 明文 |\n| | 2 | 15 | 25 |\
  \ 数值 |\n| + | 3 | 3 | 3 | 替换位值 |\n| | 5 | 18 | 2 | 模 26 结果 |\n| | E | R | B | 密文\
  \ |\n\n替换密码可以是单字母的，也可以是多字母的：\n\n* **单字母密码：** 使用单个字母表加密整个明文消息。\n* **多字母密码：** 一种更复杂的替换，使用不同的字母表加密明文消息的每个位、字符或字符块。\n\
  \n替换密码更现代的例子是数据加密标准（`DES`）算法中使用的`S-boxes`替换盒）。`DES` 中的 `S-boxes`产生非线性替换（6 位输入，4\
  \ 位输出）。**注意：** 不要尝试按照“Shave and a Haircut”的旋律唱它，以免通过隐藏明文和密文字符之间的任何统计关系来提高加密强度。\n\
  \n### 置换（或换位）密码\n\n`置换密码通过重新排列明文中的位、字符或字符块来产生密文。在简单的列置换密码中，消息可能是水平读取但垂直写入以产生密文，如下例所示：`\n\
  \n`THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG`\n\n按 9 列书写为：\n\n`THEQUICKB`\n`ROWNFOXJU`\n\
  `MPSOVERTH`\n`ELAZYDOG`\n\n然后垂直置换（加密）为：\n\n`TRMEHOPLEWSAQNOZUFVYIOEDCXROKJTGBUH`\n\
  \n明文消息的原始字母相同；只是改变了顺序来实现加密。\n\n`DES` 通过使用 `P-boxes`（置换盒）执行置换，将明文字符的影响扩散到许多字符上，使其难以追溯回替换密码中使用的\
  \ `S-boxes`。\n\n其他类型的密码包括：\n\n* **代码：** 包括用于通信秘密消息的单词和短语。\n* **运行密码（或书本密码）：** 例如，密钥是《谷物中的守护者》的第\
  \ 137 页，该页上的文本加上`modulo 26`以执行加密/解密。\n* **Vernam 密码：** 也称为`一次性扇*，即只能使用一次的密钥流。我们将在之前的侧边栏“一次性密码：一次性扇”中进一步讨论这些。\n\
  * **隐藏密码：** 这些包括`隐形术*，我们在本章稍后的部分“隐形术：一画胜千言”中讨论。\n\n### 不完全的度制：对称与非对称密钥系统\n\n加密算法大致分为对称密钥系统或非对称密钥系统。\n\
  \n#### 对称密钥加密\n\n`对称密钥加密也称为对称算法、秘密密钥、单密钥和私钥加密，使用单一密钥同时加密和解密信息。双方（对于我们的示例，托马斯和理查德）可以通过以下过程交换加密消息：`\n\
  \n\n\n\n\n1. 发送者（Thomas）使用只有目标接收者（Richard）才知道的密钥对明文消息进行加密。\n2. 随后，发送者将加密后的消息传输给目标接收者。\n\
  3. 接收者使用相同的密钥对消息进行解密，以获取明文消息。\n\n为了让攻击者（Harold）能够读到消息，他必须要么猜测密钥（例如使用暴力破解攻击），要么通过“软水管攻击”技术从\
  \ Thomas 或 Richard 处获取密钥（这是另一种形式的，呃，暴力攻击——人类通常是最脆弱的链环节，而且 Thomas 和 Richard 对痛苦的忍受度都不高），或者通过社会工程学手段（Thomas\
  \ 和 Richard 都非常喜欢钱，他们可能非常乐意帮助 Harold 的尼日利亚叔叔声领那笔巨额财富），亦或在初始交换期间拦截密钥。\n\n以下列表包含了对称加密系统的主要缺点：\n\
  \n- **分发：** 绝对要求通过带外方法或使用非对称系统来确保密钥的安全分发。\n- **可扩展性：** 每一对通信双方都需要不同的密钥。\n- **功能限制：**\
  \ 对称系统无法提供身份验证或不可否认性（参见之前的侧边栏“他说，她也说：不可否认性的概念””）。\n\n当然，对称系统确实有很多优点：\n\n- **速度：**\
  \ 对称系统比非对称系统快得多。\n- **强度：** 在使用大密钥（128 位、192 位、256 位或更大）时可以获得高强度。\n- **可用性：** 有许多可用算法供组织选择和使用。\n\
  \n对称密钥算法包括数据加密标准 (DES)、三重 DES (3DES)、高级加密标准 (AES)、国际数据加密算法 (IDEA) 和 Rivest 密码 5\
  \ (RC5)。\n\n![remember](img/remember.png) 对称密钥系统使用共享密钥。\n\n## 数据加密标准 (DES)\n\n在\
  \ 20 世纪 70 年代初，美国标准与技术研究院（NIST）征求供应商提交加密算法提案，由国家安全局（NSA）进行评估，以支持国家加密标准。这种新的加密标准用于私营部门和敏感但未分类（SBU）的政府数据。1974\
  \ 年，IBM 提交了一个最初名为 `Lucifer` 的 128 位算法。经过一些修改后（算法被缩短为 56 位并更改了 S 盒），IBM 的提案获得了 NSA\
  \ 的认可并正式采纳为数据加密标准。它于 1977 年发表在《联邦信息处理标准》（FIPS）PUB 46 中（1988 年更新并修订为 FIPS PUB 46-1），以及\
  \ 1981 年发表在《美国国家标准协会》（ANSI）X3.92 中。\n\n![remember](img/remember.png) DES 是一种使用 56\
  \ 位密钥的块密码。\n\nDES 算法是一种对称（或私有）密钥密码，由一个算法和一个密钥组成。该算法是一种基于 56 位对称密钥的 64 位块密码。（它由 56\
  \ 位密钥位加上 8 位校验位组成……或者可以将其想象为 8 个字节，每个字节包含 7 位密钥位和 1 位校验位。）在加密过程中，原始消息（明文）被划分为 64\
  \ 位块。每次处理一个块，每个 64 位明文块被拆分为两个 32 位块。在 56 位对称密钥的控制下，对每个单独字符执行 16 轮置换和替换，产生生成的密文输出。\n\
  \n![technicalstuff](img/technicalstuff.png) `parity bit` 用于检测位模式中的错误。例如，如果位模式有 55\
  \ 位密钥位（0 和 1）之和为偶数，则`奇数校验位`应为 1，使得位总数（包括校验位）为奇数。对于`偶数校验位`，如果 55 位密钥位之和为偶数，则校验位应为\
  \ 0，使得位总数（包括校验位）为偶数。如果一个算法使用偶数校验，且生成的位模式（包括校验位）为奇数，则传输已损坏。\n\n![technicalstuff](img/technicalstuff.png)\
  \ `round`（轮）是加密算法对明文块执行的一种变换（置换和替换），将其转换（加密）为密文。\n\nDES 的四种不同工作模式（工作模式定义了如何处理明文/密文块）是电子密码本（ECB）、密码块链（CBC）、密码反馈（CFB）和输出反馈（OFB）。\n\
  \n![remember](img/remember.png) DES 的四种模式是 ECB、CBC、CFB 和 OFB。ECB 和 CBC 是最常用的。\n\n\
  DES 最初的目标是开发一种可以使用 10 到 15 年的加密标准。尽管 DES 远超过这一目标，但在 1999 年，电子边界基金会实现了不可避免的结果：仅用\
  \ 23 小时就破解了一个 DES 密钥。\n\n### 电子密码本 (ECB)\n\n*Electronic Code Book* (ECB) 模式是 DES\
  \ 操作的原模式，通常产生最高的吞吐量。它最适用于加密密钥或少量数据。ECB 模式独立地处理 64 位明文块并产生 64 位密文块。ECB 的一个显著缺点是，相同的明文使用相同的密钥加密时总是产生相同的密文。如果用于加密大量数据，它极易受到选择明文攻击（CTA）（在本章后面的章节“选择明文攻击\
  \ (CTA)”中讨论），因为某些模式可能会被泄露。\n\n### 密码块链 (CBC)\n\n*Cipher Block Chaining* (CBC) 模式是\
  \ DES 最常用的模式。与 ECB 模式一样，CBC 模式处理 64 位明文块以产生 64 位密文块。然而，在 CBC 模式中，每个块都与前一个块的密文进行异或（参见下面的侧边栏“什么是异或”），以创建一个依赖关系，或*链*，从而产生更随机的密文结果。第一个块使用称为*初始化向量*（IV）的随机块进行加密。CBC\
  \ 模式的一个缺点是错误会传播。然而，这个问题限于限于错误发生的块以及紧随其后的块，之后解密就会重新同步。\n\n### 反馈 (CFB)\n\n*Cipher\
  \ Feedback* (CFB) 模式是一种最用于加密单个字符的流密码。在这种模式下，之前生成的密文被用作下一个密钥流密钥生成的反馈。生成的密文链联在一起，会导致错误在整个加密过程中倍增。\n\
  \n### 输出反馈 (OFB)\n\n*Output Feedback* (OFB) 模式也是与 CFB 非常相似的流密码。它通常用于加密卫星通信。在这种模式下，之前的明文被用作下一个密钥流密钥生成的反馈。由于生成的密文没有链联在一起，错误不会在整个加密过程中扩散。\n\
  \n## 三重 DES (3DES)\n\n三重数据加密标准 (3DES) 有效延长了 DES 算法的寿命。在三重 DES 实现中，消息通过使用一个密钥加密，再使用第二个密钥加密，然后再次使用第一个密钥或第三个密钥进行加密。\n\
  \n\n\n\n使用三个独立的 56 位加密密钥可以产生 168 位的有效密钥长度。但 Triple DES 并不仅仅是将破解 DES 算法所需的工作因子增加了三倍（参见本章中的侧边栏“工作因子：力量\
  \ × 努力 = 工作！”）。因为攻击者在所有三个密钥都被破解并产生正确的明文之前，并不知道自己是否成功破解了即使是第一个 56 位密钥（请在 0 到 72 京亿之间选一个数字！），因此所需的工作因子更像是\
  \ `2⁵⁶ x 2⁵⁶ x 2⁵⁶`，或者说 72 京亿乘以 72 京亿再乘以 72 京亿。（不要尝试在计算器上进行这个乘法；相信我们的准就够了。）\n\n\
  ![warning](img/warning.png) Double DES 并不是对 DES 的显著改进。事实上，通过中间相遇攻击（Meet-in-the-Middle\
  \ Attack，参见本章稍后的章节“中间相遇攻击”），破解 Double DES 所需的工作因子仅比 DES 略大。由于这个原因，Double DES 并不常用。\n\
  \n使用 Triple DES（正式名称为三重数据加密算法，或 `TDEA`）似乎足以保护即使是最敏感的数据至少几个世纪，但 Triple DES 存在一些问题。首先，性能开销非常大。尽管\
  \ Triple DES 比许多其他对称加密算法快，但它仍然慢得无法接受，因此不适用于许多需要大量数据高高速吞吐的应用程序。\n\n其次，实现中存在一个漏洞，允许密码分析师在暴力攻击中将有效密钥长度缩小到\
  \ 108 位。虽然 108 位的密钥长度仍需要大量时间来破解（理论上需要几百万万年），但它仍然是一个漏洞。\n\n## 高级加密标准 (AES)\n\n2002\
  \ 年 5 月，NIST 宣布 Rijndael 块密码（Rijndael Block Cipher）作为实现 `高级加密标准 (AES)` 的新标准，取代了\
  \ DES 成为美国政府加密“敏感但未分类”数据的标准。AES 随后被批准用于加密加密至机密级的美国政府分类数据（使用 `192- or 256-key` 长度）。\n\
  \n由 Joan Daemen 博士和 Vincent Rijmen 博士开发的 `Rijndael 块密码` 使用可变块大小和密钥长度（128、192 或 256\
  \ 位），以及 10 到 14 轮。它的设计目标是简单、能够抵抗已知攻击且快速。它可以在硬件或软件中实现，并且内存需求相对较低。\n\n![remember](img/remember.png)\
  \ AES 基于 Rijndael 块密码。\n\n直到最近，针对 AES 的唯一已知成功攻击是`侧信道攻击`，这种攻击并不直接攻击加密算法，而是攻击实现加密算法的系统。使用缓存计时技术的侧信道攻击对\
  \ AES 实现最为常见。2009 年，发表了一种针对 AES 的理论性相关密钥攻击。该攻击方法被认为是理论性的，因为尽管它降低了破解 AES 密钥所需的数学复杂度，但它仍然超出了目前的计算能力。\n\
  \n## Blowfish 和 Twofish 算法\n\n`Blowfish 算法` 在 64 位块上操作，采用 16 轮，并使用最长 448 位的可变密钥长度。`Twofish\
  \ 算法` 是 AES 选过程的决赛者，是一种对称块密码，在 128 位块上操作，采用 16 轮以及最长 256 位的可变密钥长度。Blowfish 和 Twofish\
  \ 都由 Bruce Schneier（及其他人）设计，并在公共领域免费提供（这两种算法均无专利）。截至为止，尚未发现针对这两种算法的成功密码分析攻击。\n\n\
  ## Rivest 密码\n\nRon Rivest 博士、Adi Shamir 博士和 Len Adleman 博士发明了 `RSA` 算法并创立了 `RSA`\
  \ 数据安全公司（`RSA = *R*ivest, *S*hamir, *A*dleman`）。Rivest 密码是一系列对称算法，包括 `RC2`、`RC4`、`RC5`\
  \ 和 `RC6`（`RC1` 从未发布，`RC3` 在开发期间被破解）：\n\n- `RC2`: 块模式密码，使用可变长度密钥加密 64 位数据块。\n- `RC4`:\
  \ 流加密（实时加密数据），使用可变长度密钥（128 位为标准）。\n- `RC5`: 与 `RC2` 类似，但包含可变长度密钥（0 到 2,048 位）、可变块大小（32、64\
  \ 或 128 位）和可变处理轮数（0 到 255 轮）。\n- `RC6`: 源自 `RC5`，是 AES 选过程的决赛者。它使用 128 位块大小和 128、192\
  \ 或 256 位的可变密钥。\n\n## Idea 密码\n\n`国际数据加密算法 (IDEA)` 密码演变自 1990 年最初开发的建议加密标准和改进的建议加密标准\
  \ (`IPES` )。IDEA 是一种块密码，通过使用 128 位密钥在 64 位明文块上操作。IDEA 对 16 位子块执行八轮操作。\n\n\n\n3.\
  \ 接收者（Richard）使用发送者（Thomas）的公钥来验证消息的真实性，然后使用自己的私钥来解密消息内容。\n\n如果攻击者拦截了消息，他或她可以使用发送者的公钥，但随后得到的是一个加密消息，在没有预定接收者私钥的情况下，他或她无法对其解密。因此，机密性和真实性都得到了保障。这种非对称密钥系统的使用被称为`安全带签名的消息格式`。\n\
  \n![remember](img/remember.png) 安全带签名的消息格式使用发送者的私钥和接收者的公钥来保护机密性并确保真实性。\n\n公钥和私钥在数学上是相关的，但从理论上讲，没有人能从公钥计算或推导出出私钥。非对称系统的这种特性基于单向函数的概念。`单向函数`是一个你可以容易从一个方向进行计算，但无法反向计算的问题。在非对称密钥系统中，`陷门`（trapdoor，私钥）可以解决单向函数的反向操作。\n\
  \n由于非对称密钥系统的复杂性，它们更多地用于密钥管理或数字签名，而不是用于海量信息的加密。通常会采用`混合`系统，使用非对称系统来安全地分发对称密钥系统的密钥，而该对称系统用于加密数据。\n\
  \n非对称系统的主要缺点是速度较慢。由于用于实现单向哈希函数的算法类型，需要非常大的密钥。（一个 128 位对称密钥的强度等同于 2304 位的非对称密钥。）这些大密钥反过来需要更多的计算能力，导致速度大幅损失（比类似的对称密钥系统慢达\
  \ 10,000 倍）。\n\n然而，非对称系统的许多显著优势包括：\n\n* **功能扩展性：** 非对称密钥系统可以同时提供机密性和身份验证；而对称系统只能提供机密性。\n\
  * **可扩展性：** 由于对称密钥系统需要所有通信方之间进行秘密密钥交换，其可扩展性有限。非对称密钥系统不需要秘密密钥交换，解决了与对称密钥系统相关的密钥管理问题，因此具有更好的可扩展性。\n\
  \n非对称密钥算法包括`RSA`、`Diffie-Hellman`、`El Gamal`、`Merkle-Hellman (Trapdoor) Knapsack`\
  \ 以及 `Elliptic Curve`（椭圆曲线），我们将在后续章节中讨论它们。\n\n### RSA\n\nRon Rivest、Adi Shamir 和\
  \ Len Adleman 博士发布了`RSA` 算法，这是一种`密钥传输`算法，基于对两个大质数的乘积（通常为 512 位）进行因数分解的困难。两个用户（Thomas\
  \ 和 Richard）可以通过`RSA` 安全地传输对称密钥，如下所示：\n\n1. Thomas 创建一个对称密钥，用 Richard 的公钥对其加密，然后将其发送给\
  \ Richard。\n2. Richard 使用自己的私钥解密该对称密钥。\n\n![remember](img/remember.png) `RSA` 是一种基于质数分解的非对称密钥算法。\n\
  \n### DIFFIE-HELLMAN 密钥交换\n\nWhitfield Diffie 和 Martin Hellman 博士发表了一篇名为《密码学的新方向》的论文，详细介绍了一种基于离散对数的的安全密钥交换的新范式。`Diffie-Hellman`\
  \ 被描述为密钥协商算法。两个用户（Thomas 和 Richard）可以通过`Diffie-Hellman` 交换对称密钥，如下所示：\n\n1. Thomas\
  \ 和 Richard 获取对方的公钥。\n2. Thomas 和 Richard 然后将自己的私钥与对方的公钥结合，产生一个只有参与交换的两个用户才知道的对称密钥。\n\
  \n`Diffie-Hellman` 密钥交换受到中间人攻击（Man-in-the-Middle Attacks）的影响，攻击者（Harold）在初始交换期间拦截公钥并替换为自己的私钥，创建一个可以解密会话会话密钥。（你可以在本章稍后的章节`Man-in-the-Middle\
  \ Attack` 中阅读更多关于此类攻击的信息。）需要单独的验证机制来防止此类攻击，确保会话中通信的双方确实是合法的双方。\n\n![remember](img/remember.png)\
  \ `Diffie-Hellman` 是一种基于离散对数的非对称密钥算法。\n\n### EL GAMAL\n\n`El Gamal` 是一种无专利非对称密钥算法，基于\
  \ `Diffie-Hellman` 中使用的离散对数问题（在前节讨论）。`El Gamal` 扩展了 `Diffie-Hellman` 的功能，包含了加密和数字签名。\n\
  \n### MERKLE-HELLMAN (TRAPDOOR) KNAPSACK\n\n1978 年发表的`Merkle-Hellman (Trapdoor)\
  \ Knapsack`（背包问题）采用了一种独特的非对称加密方法。它基于这样一个问题：在一组固定权重的物品中，哪些物品可以组合以获得给定的总重量。`Knapsack`\
  \ 在 1982 年被破解。\n\n![remember](img/remember.png) `Knapsack` 是一种基于固定权重的非对称密钥算法。\n\n\
  ### ELLIPTIC CURVE (EC)\n\n椭圆曲线（`EC`）的计算比传统的离散对数问题或质数分解困难得多。（一个 160 位的`EC`密钥等同于\
  \ 1024 位的`RSA`密钥。）使用较小的密钥意味着 `EC` 速度明显快于其他非对称算法（以及许多对称算法），并可以广泛应用于无线设备和智能卡等硬件应用。\n\
  \n![remember](img/remember.png) `Elliptic Curve` 效率更高，因为它可以使用较小的密钥。\n\n### 消息验证\n\
  \n`消息验证` 通过以下方式确保消息的真实性和完整性：\n\n* 消息在传输过程中没有被（恶意或无意地）更改。\n* 消息不是以前消息的重放。\n* 消息确实来自声称的来源（不是伪造）。\n\
  * 消息发送给了预定的接收者。\n\n校验和、`CRC 值`和奇偶校验是基础消息验证和完整性控制的示例。高级的消息验证通过使用数字签名和消息摘要来实现。\n\n\
  ![remember](img/remember.png) 数字签名和消息摘要可用于消息验证。\n\n#### 数字签名\n\n由美国国家标准与技术研究所（NIST）在联邦信息处理标准（`FIPS`）186-4\
  \ 中发布的数字签名标准（`DSS`）规定了标准中接受的三种算法：RSA 数字签名算法、数字签名算法（`DSA`，基于改进的 `El Gamal` 算法）以及椭圆曲线数字签名算法（`ECDSA`）。\n\
  \n数字签名是验证消息真实性（和完整性）的一种简单方法。发送者不是使用预期接收者的公钥加密消息，而是使用自己的私钥对其进行加密。发送者的公钥可以正确解密消息，从而验证消息发送者的身份。这种过程在非对称密钥系统中被称为`开放消息格式`，我们在本章之前的章节`Asymmetric\
  \ key cryptography` 中讨论过它。\n\n#### 消息摘要\n\n\n\n\n\n通常，使用接收者的公钥加密消息以保护机密性，然后使用发送者的私钥对整个消息再次加密以保护真实性和完整性，这往往是不实际的。相反，对加密消息的表示形式使用发送者的私钥进行加密，生成数字签名。预期的接收者使用发送者的公钥解密该表示形式，然后使用相同的已知的单向哈希算法独立地计算解密结果的预期结果。如果结果相同，则原始消息的完整性就得到了保障。这种整个消息的表示形式被称为\
  \ `message digest`（消息摘要）。\n\n`digest`（摘要）意味着减少或浓缩某物，而消息摘要正是如此。（相反，`indigestion`（消化不良）意味着膨胀……像气体……`relief`\
  \ 怎么写？）消息摘要是消息的浓缩表示形式；想象一下《读者摘要》（`Reader’s Digest`）。理想情况下，消息摘要应具有以下属性：\n\n* 无法从消息摘要重新创建原始消息。\n\
  * 找到产生特定摘要的消息在计算上应该是不可行的。\n* 不应有两个不同的消息产生相同的消息摘要（这被称为 `collision`，碰撞）。\n* 消息摘要应通过原始消息的所有内容计算——它不应该是表示形式的表示。\n\
  \n消息摘要是通过使用单向哈希函数产生的。有几种类型的单向哈希算法（摘要算法），包括 `MD5`、`SHA-2` 和 `HMAC`。\n\n![warning](img/warning.png)\
  \ `SHA-1` 摘要算法现在被认为是过时的。应该改用 `SHA-3`。\n\n![warning](img/warning.png) 当两个消息产生相同的摘要，或者一个消息产生的摘要与另一个消息产生的摘要相同时就会发生\
  \ `collision`（碰撞）。\n\n![remember](img/remember.png) `one-way function`（单向函数）确保了在非对称密钥系统中，同一个密钥不能既加密又能解密消息。一个密钥加密消息（产生密文），第二个密钥（陷门函数）解密消息（产生明文），从而有效地反转了单向函数。单向函数的目的是确保机密性。\n\
  \n`one-way hashing algorithm`（单向哈希算法）产生一个不可逆转的哈希值（或消息摘要）；也就是说，它不能被解密。换句话说，单向哈希算法不存在陷门函数。单向哈希算法的目的是确保完整性和身份认证。\n\
  \n![remember](img/remember.png) `MD5`、`SHA-2`、`SHA-3` 和 `HMAC` 都是常用消息认证算法的示例。\n\n\
  ## MD 系列算法\n\n`MD`（Message Digest）是由 Ron Rivest 博士开发的一个单向哈希算法族，包括 `MD`（已过时）、`MD2`、`MD3`（未广泛使用）、`MD4`、`MD5`\
  \ 和 `MD6`：\n\n* **MD2:** 开发于 1989 年，至今仍被广泛使用，`MD2` 取可变长度的输入（消息）并产生固定长度的输出（128 位消息摘要）。`MD2`\
  \ 非常非常慢（最初是为 8 位计算机设计的），并且很容易受到碰撞攻击。\n* **MD4:** 开发于 1990 年，`MD4`产生 128 位摘要，用于为各种\
  \ Microsoft Windows 操作系统（包括 NT、XP 和 Vista）计算 NT 密码哈希。`MD4` 哈希通常表示为 32 位十六进制数字。`MD4`\
  \ 存在若干已知的弱点，而且容易受到碰撞攻击。\n* **MD5:** 开发于 1991 年，`MD5` 是目前最流行的哈希算法之一，通常用于存储密码和检查文件的完整性。与\
  \ `MD2` 和 `MD4` 一样，`MD5` 产生 128 位摘要。消息以 512 位为块进行处理，经过四轮转换。生成的哈希通常表示为 32 位十六进制数字。`MD5`\
  \ 同样容易受到碰撞攻击，现在被美国国土安全部认为“在密码学上是破解的”。\n* **MD6:** 开发于 2008 年，`MD6` 使用非常大的输入消息块（多达\
  \ 512 字节）并产生可变长度的摘要（多达 512 位）。`MD6` 最初作为新的 `SHA-3` 标准提交考虑，但在 2009 年 7 月的第一轮考虑后被排除在考虑之外。遗憾的是，`MD6`\
  \ 的首次广泛使用（尽管是非授权且非法的）发生在 2008 年底的 Conficker.B 蠕虫中，就在该算法发布后不久！\n\n## SHA 系列算法\n\n\
  与 `MD`一样，`SHA`（Secure Hash Algorithm，安全哈希算法）是另一个单向哈希函数族。`SHA`算法族由美国国家安全局（NSA）设计并由美国标准技术研究院（NIST）发布。`SHA`算法族包括\
  \ `SHA-1`、`SHA-2` 和 `SHA-3`：\n\n* **SHA-1:** 1995 年发布，`SHA-1` 取可变长度的输入（消息）并产生固定长度的输出（160\
  \ 位消息摘要，相比 `MD5` 的 128 位摘要）。`SHA-1` 以 512 位为块处理消息，必要时对消息长度进行填充，以产生 512 位倍数的总消息长度。注意，`SHA-1`\
  \ 不再被认为是可行的算法。\n* **SHA-2:** 2001 年发布，`SHA-2` 包含四种哈希函数——`SHA-224`、`SHA-256`、`SHA-384`\
  \ 和 `SHA-512`——其长度分别为 224、256、384 和 512 位。`SHA-2` 以 512 位为块处理消息。\n* **SHA-3:** 2015\
  \ 年发布，`SHA-3` 产生 `SHA3-224`、`SHA3-256`、`SHA3-384` 和 `SHA3-512`，长度分别为 224、256、384\
  \ 和 512 位。`SHAKE128` 和 `SHAKE256` 也是 `SHA3` 的变体。\n\n## HMAC\n\n哈希消息认证码（或校验和）（`HMAC`）通过密钥摘要的概念扩展了\
  \ `MD5` 和 `SHA-1` 算法的安全性。HMAC 将预共享的密钥和原始消息整合进消息摘要中。因此，即使攻击者拦截消息、修改其内容并计算新的摘要，结果也与接收者的哈希计算不匹配，因为修改后的消息哈希不包含密钥。\n\
  \n## 公钥基础设施 (PKI)\n\n`公钥基础设施 (PKI)` 是一种由指定机构存储加密密钥或 `证书`（使用组织或个人的公钥来建立身份，并使用数字签名建立真实性的电子文档），从而通过集成数字签名、数字证书和其他服务来实现机密性、完整性、身份认证、不可否认性和访问控制。\n\
  \n![remember](img/remember.png) PKI 的四个基本组件是证书机构、注册机构、存储库和存档：\n\n* **证书机构 (CA):**\
  \ 证书机构包含硬件、软件和管理 PKI 的人员。CA 发布证书、维护并发布状态信息和吊销列表（CRL），并维护存档。\n* **注册机构 (RA):** 注册机构同样包含硬件、软件和管理\
  \ PKI 的人员。它负责为 CA 验证证书内容。\n* **存储库 (Repository):** 存储库是一个接受 CA 的证书和 CRL 向授权方分发的系统。\n\
  * **存档 (Archive):** 存档为 CA 信息提供长期存储。\n\n### 密钥管理函数\n\n与物理密钥一样，加密密钥必须受到保护。大多数针对加密的成功攻击利用了\
  \ `密钥管理` 函数中的漏洞，而不是加密算法本身的弱点。以下是与管理加密密钥相关的主要功能：\n\n\n\n\n\n- **密钥生成：** 密钥必须在安全系统上随机生成，且生成序列本身不应提供有关密钥空间内容的潜在线索。生成的密钥不应以明文形式显示。\n\
  - **密钥分发：** 密钥必须安全地分发。这是对称密钥系统中的一个主要漏洞。使用非对称系统安全地分发密钥是一种解决方案。\n- **密钥安装：** 密钥安装通常是一个手动过程。该过程应确保密钥在安装过程中不会被泄露、输入错误或因过于困难而无法方便使用。\n\
  - **密钥存储：** 密钥必须存储在受保护或加密的存储介上，或者使用密钥的应用程序应包含防止密钥被提取的保护措施。\n- **密钥更换：** 密钥和密码一样，应该根据受保护信息的价值和使用频率定期更换。频繁使用的密钥更有可能通过拦截和统计分析被破解。\n\
  - **密钥控制：** 密钥控制涉及密钥的正确使用。不同的密钥具有不同的功能，并且可能被允许用于某些分类级别。\n- **密钥处置：** 密钥（以及任何分发介）必须经过妥善的处置、擦除或销毁，以确保密钥内容不泄露，防止攻击者对密钥管理系统产生洞察。\n\
  \n![remember](img/remember.png) 七个密钥管理问题分别是生成、分发、安装、存储、更换、控制和处置。\n\n### 密钥托管与密钥恢复\n\
  \n执法部门一直担心加密可能被用于犯罪。为了应对这一威胁，NIST 在联邦信息处理标准（*FIPS*）185（1994 年）中发布了托管加密标准（EES）。EES\
  \ 的前提是将秘密密钥分成两部分，并将这两部分存放在两个独立的受信组织中托管。根据法院命令，执法人员可以获取这两个部分，恢复秘密密钥并解密怀疑的通信内容。EES\
  \ 的一种实现是美国政府提出的 Clipper 芯片。Clipper 芯片使用 `Skipjack Secret Key` 算法进行加密，并使用 80 位秘密密钥。\n\
  \n### 攻击方法\n\n破解密码系统的尝试通常可以归为四类攻击方法：\n\n- **分析攻击：** `analytic attack` 使用代数运算来试图降低算法的复杂度。\n\
  - **暴力破解攻击：** 在 `brute-force`（或穷举）`attack` 中，密码分析师尝试密钥模式的所有可能组合，有时会利用彩虹表以及专门的或可扩展的计算架构。取决于密钥长度、攻击者计算机的速度……以及攻击者的寿命，这种类型的攻击可能非常耗时（长达数亿年）且耗资源。\n\
  - **实现攻击：** `Implementation attacks` 试图利用密码系统在协议或算法中的某些弱点。\n- **统计攻击：** `statistical\
  \ attack` 试图利用密码系统中的某些统计漏洞，例如密钥生成缺乏随机性。\n\n![technicalstuff](img/technicalstuff.png)\
  \ `rainbow table` 是一个预计算的表，用于反转特定算法中的密码学哈希函数。使用彩虹表的密码破解程序包括 `Ophcrack` 和 `RainbowCrack`。\n\
  \n接下来的章节讨论的具体攻击方法采用了我们在前面的列表中描述的四类方法的各种元素。\n\n#### 生日攻击\n\n`Birthday Attack` 试图通过使用相同的哈希函数，利用两条消息产生相同消息摘要的概率。它基于一种统计概率（大于\
  \ 50%），即在一个有 23 人或更多人的房间里，至少有 2 个人生日相同。然而，要让房间里的 2 个人共享特定的生日（如 8 月 3 日），房间里必须有 253\
  \ 人或更多，统计概率才会大于 50%（即使其中一个生日是 2 月 29 日）。\n\n#### 仅密文攻击 (COA)\n\n在 `Ciphertext Only\
  \ Attack` (COA) 中，密码分析师获取几条使用相同加密算法加密的消息密文，但他没有相关的明文。密码分析师通过搜索重复模式和使用统计分析来尝试解密数据。例如，英语中的某些单词，如\
  \ `the` 和 `or` 频繁出现。这种攻击通常很难，需要大量的密文样本。\n\n#### 选择明文攻击 (CTA)\n\n在 `Chosen Text Attack`\
  \ (CTA) 中，密码分析师选择明文样本并获取对应的密文。存在多种类型的选择明文攻击，包括选择明文、自适应选择明文、选择密文和自适应选择密文：\n\n- **选择明文攻击\
  \ (CPA)：** 密码分析师选择要加密的明文，并获取对应的密文。\n- **自适应选择明文攻击 (ACPA)：** 密码分析师选择要加密的明文；然后根据生成的密文选择另一个样本进行加密。\n\
  - **选择密文攻击 (CCA)：** 密码分析师选择要解密的密文，并获取对应的明文。\n- **自适应选择密文攻击 (ACCA)：** 密码分析师选择要解密的密文；然后根据生成的密文选择另一个样本进行解密。\n\
  \n#### 已知明文攻击 (KPA)\n\n在 `Known Plaintext Attack` (KPA) 中，密码分析师已获取了过去几条消息的密文和相应的明文，并利用它们来破解新消息。\n\
  \n#### 中间人攻击\n\n`Man-in-the-Middle Attack` 涉及攻击者拦截网络上双方之间的消息，并可能修改原始消息。\n\n####\
  \ 中间相攻击\n\n`Meet-in-the-Middle Attack` 涉及攻击者在一端使用所有可能的密钥对已知明文进行加密，在另一端对相应的密文进行解密，然后在中间比较结果。\n\
  \n#### 重放攻击\n\n`Replay Attack` 发生在会密钥被拦截并用于之后双方之间的加密会话时。通过在会密钥中加入时间戳可以防止重放攻击。\n\n\
  ## 将安全原则应用于站点和设施设计\n\n最后，运行在安全设计和构建的系统上的软件，必须在安全设计和构建的设施中运行。否则，对系统及其安装软件拥有不受限制访问的攻击者将不可避免地破解你的安全努力。明智的组织会在新旧设施的设计、规划和建设阶段引入安全人员。在施工早期进行适当选址和设施需求规划，有助于确保新建筑或数据中心是充分且安全的——所有这些都能帮助组织后期避免昂贵的困境。\n\
  \n\n\n\n\n自 1971 年通过环境设计预防犯罪（CPTED）首次发布以来，安全实务人员已在公共和私立建筑、办公室、社区和校园的设计中广泛采用 CPTED\
  \ 的原则。CPTED 侧重于通过无障碍区域、创意性照明和功能性景观等技术来设计设施，通过积极的心理效应帮助自然威慑犯罪。通过增加犯罪分子躲藏、进入设施、逃离现场或以其他方式实施非法和/暴力行为的难度，这些技术可能会使潜在犯罪分子放弃攻击目标或受害者，并有助于营造一个让经常使用该区域的合法人员感到（且实际上是）更安全的环境。CPTED\
  \ 由三个基本策略组成：\n\n- **自然准入控制：** 使用安全区域（或`defensible space`）限制或约束移动，并区分需要不同保护水平的公共、半私有和私有区域。例如，这种自然准入控制可以通过限制建筑的入口点，以及使用人行道和照明等结构引导访客进入主入口和接待区来实现。`目标加固`通过机械和/或操作控制（如门窗锁、报警器、身份识别要求和访客签到程序）来补充自然准入控制。\n\
  - **自然监视：** 通过使入侵者的活动更易被观察和检测来减少犯罪威胁。自然监视可以通过最大化战略区域的可见性和活动来实现，例如，通过设置窗户俯瞰街道和停车场、通过景观消除隐蔽死角并创造清晰的视线、在楼梯上安装开放围栏以提高可见性，以及使用大量的低强度照明灯具以消除阴影并减少监控摄像头的反光或盲点（特别是在夜晚）。\n\
  - **领地强化：** 营造一种自豪感和所有权，这使得入侵者更容易显眼，并鼓励人们报告可疑活动而不是忽视它们。领地强化通过维护活动（捡起垃圾、清理涂鸦、修理破损的窗户和更换灯泡）、为特定个人分配某一区域或空间的责任、在公共区域放置设施（如长椅和喷泉）以及展示显著的标志（在适用的情况下）来实现。它还可以包括计划性的活动，如企业赞助的美化项目和公司野餐。\n\
  \n## 选择安全的地点\n\n位置，位置，还是位置！尽管在某种程度上，这种传统的商业智慧在电子商务时代对盈利能力可能没那么重要，但它仍然是物理安全的关键因素。考虑地点时的重要因素包括：\n\
  \n- **气象学和自然灾害：** 虽然组织不太可能仅根据飓风或地震发生的概率来选择地理位置，但在设计安全的设施时必须考虑这些因素。其他相关因素可能包括泛洪区、疏散路线的位置以及民防和应急准备的充分性。\n\
  - **当地考虑：** 该地点是否位于高犯罪地区？附近是否有危险源，例如危险品储存处、铁路货运线或当地机场的航线？该地区是否为高度工业化（空气和噪声污染，包括振动是否会影响你的系统）？\n\
  - **可见性：** 你的员工和设施会成为犯罪、恐怖主义或破坏行为的目标吗？场地是否靠近另一个高可见度的组织，从而引起不希望的关注？你的设施是否位于政府或军事目标附近？通常低调是最好的，因为这样可以避免不必要的和不需要的关注；尽可能避免建筑的外部标记。\n\
  - **可及性：** 考虑当地交通模式、往返机场的便利性、距离应急服务（警察、消防和医疗设施）的远近以及充足住房的可用性。例如，当你的组织需要员工时，值班员工是否需要开车一小时才能到达？\n\
  - **公用事业：** 设施位于电网的什么位置？电力是否稳定且清洁？是否已有足够的光纤电支持电信需求？\n- **共同租户：** 你是否对所有必要的环境控制拥有完全访问权限？物理安全的成本和责任可以（也应该）在共同租户之间共享吗？其他租户是否是潜在的高可见目标？其他租户是否重视安全？\n\
  \n## 设计安全的设施\n\n我们在本章节后面讨论的关于场地和设施安全控制的许多物理和技术控制，在设计安全设施时就应该考虑到。这样做通常有助于降低成本并提高这些控制的有效性。其他建筑设计考虑因素包括：\n\
  \n- **外墙：** 理想情况下，外墙应能够抵抗强风（龙卷风和飓风），并减少可能被检测并用于创建高价值数据的电磁（例如政府或军事数据）。如果可能，整个建筑应避免使用外窗，特别是底层。底层可能需要在窗户上安装金属栏或使用加固窗户。\n\
  - **内墙：** 邻近安全或限制区域的内墙必须从地板延伸到天花板（穿过架空地板和吊顶），并符合相应的建筑和消防规范。邻近存储区域（如存放清洁用品、纸张、媒体或其他易燃材料的储物室）的墙必须达到防火等级，通常高于其他内墙。理想情况下，凯夫（防弹）墙应保护最敏感的区域。\n\
  - **地板：** 地板（无论是基础还是架空）必须根据当地建筑规范承受负载（通常为每平方英尺 150 磅）。此外，架空地板必须表面绝缘并良好接地以减少人员安全风险。\n\
  - **天花板：** 必须考虑承重和防火等级。吊顶可能会暂时隐藏入侵者和轻微漏水；相反，水渍的吊顶板可以发现漏水，同时阻止水损坏。\n- **门：** 门和锁必须足够坚固且设计良好，以抵抗强制进入，其防火等级需要与相邻墙相当。应急出口必须从内部保持开启状态，并应该有清晰标记，以及接受监控或报警。电子锁机制和其他访问控制设备在紧急情况下应故障为开启（解锁），以便人员离开建筑。许多门是向外开启以方便应急疏散；因此合页位于房间或建筑的外部。这些合页必须妥善固定，以防入侵者轻易拔起销销并拆下门。\n\
  - **照明：** 安全边界内所有物理空间和建筑（包括入口和停车场）的外部照明应充足，以确保人员安全，并威慑游荡者和偶然入侵者。\n\n\n\n\n\n- **布线：**\
  \ 所有布线、线管和电缆铺设必须符合建筑和消防规范，并得到适当的保护。在架空地板下方和吊顶花板上方必须使用空间板电缆（plenum cabling），因为 PVC\
  \ 涂层电缆在燃烧时会释放有毒化学物质。\n\n![technicalstuff](img/technicalstuff.png) `plenum` 是吊顶花板上方或架空地板下方的空区域。这些区域发生火灾蔓延非常迅速，并会将烟雾和有害气体带到燃烧建筑的其他区域。出于这个原因，这些区域内必须使用非\
  \ PVC 涂层的电缆，即 `空间板电缆`。\n\n- **电力与暖空调（HVAC）：** 必须仔细规划电力负载和 HVAC 要求，以确保在正确的位置提供足够的功率，并维持适当的气候（温度和湿度）。\n\
  \n- **管道：** 应识别并适当标记水管、蒸汽管或燃气管道的断路阀位置。排水口应具有`正向流`，这意味着它们将排水水带离建筑。\n\n- **雷击：** 仅在美国，每年就有约\
  \ 10,000 起火灾是由雷击引起的，尽管所有闪电中只有 20% 到达地面。闪电可以将直接接触的空气加热到 54,000 华氏度 (F)，相当于 30,000\
  \ 摄氏度 (C)，雷电可以释放 100,000 安培的电流。这可真是一个巨大的`浪涌`！\n\n- **磁场：** 显示器和存储介质可能会被磁场永久损坏或擦除。\n\
  \n- **破坏/恐怖主义/战争/盗窃/破坏行为：** 必须考虑内部和外部威胁。在某些其他破坏性情况下——包括劳资争议、公司裁员、敌对解雇、负面宣传、示威/抗议和民事动——提高安全态势也是明智的。\n\
  \n- **设备故障：** 设备故障不可避免的。维护和支持协议、备用零件和冗余系统可以减轻其影响。\n\n- **通信和公用事业中断：** 包括语音和数据；电力；供暖、通风和空调\
  \ (HVAC)。通信和公用事业中断可能是由于上述项目符号提到的任何因素，以及人为错误和失误造成的。\n\n- **震动和移动：** 原因可能地震、滑坡和爆炸。设备也可能由于突然或剧烈的震动、物体坠落或设备架倾倒而损坏。更严重的是，震动或移动可能会破坏结构完整性，导致建筑坍塌或无法使用。\n\
  \n- **极端天气：** 包括飓风、龙卷风、强风、严重的雷雨和闪电、雨、雪、雨雹和冰。这些自然力量可能导致火灾、水渍和洪水、结构损坏、通信和公用事业中断以及对人员的危害。\n\
  \n- **人员损失：** 可能由于疾病、受伤、死亡、调、劳资争议、辞职和终止。人员损失的负面影响可以通过良好的安全实践来减轻，例如记录程序、工作轮换、交叉培训和冗余功能。\n\
  \n## 实施场地和设施安全控制\n\nCISSP 候选人必须理解物理安全的各种威胁；场地和设施要求的规划与设计的要素；各种物理安全控制，包括访问控制、技术控制、环境和生命安全控制以及管理控制；以及本节所涵盖的如何支持这些控制的实施和运行。\n\
  \n![tip](img/tip.png) 虽然本节中的许多信息看起来是常识，但 CISSP 考试对物理安全提了非常具体且详细的问题，许多候选人缺乏灭火的实践经验，因此不要低估物理安全的重要性——无论是在现实生活中还是在\
  \ CISSP 考试中！\n\n### 配线间、机房、媒体存储设施和证物存储室\n\n配线间、机房以及媒体和证物存储设施包含高价值设备和/或介质，这些设备对持续业务运营或支持调查至关重要。这些位置常见的物理安全控制包括：\n\
  \n- **强访问控制。** 通常这包括使用钥匙卡，加上 PIN 码键盘或生物识别。\n- **灭火：** 通常，你会发现惰性气体灭火而非水喷淋，因为水在喷淋时可能会损坏计算设备。\n\
  - **视频监控：** 摄像头固定在配线间入口和数据中心入口处，以及这些设施的内部，以观察授权人员和入侵者的活动。\n- **访客日志：** 所有访客（通常需要持续陪同）通常被要求签收访客日志。\n\
  - **资产入库/出库日志。** 所有人员都被要求记录任何设备和介质的引入和移除。\n\n### 限制区域和工作区域安全\n\n高安全性工作区域采用的物理安全控制通常比普通工作区域更多。除了钥匙卡访问控制系统和视频监控外，额外的物理安全控制可能包括：\n\
  \n- **多因素钥匙卡准入。** 与钥匙卡一起使用，员工可能需要使用 PIN 码键盘或生物识别来进入限制区域。\n- **安保人员。** 在入口/出口处可能会有更多保安人员，并在设施内巡逻，以警惕未经授权的人员或活动。\n\
  - **警卫犬。** 它们对未经授权的进入提供了额外的威慑，并协助捕捉设施内的未经授权人员。\n- **安全墙和围栏。** 限制性设施可能采用一个或多个安全墙和围栏防止未经授权的人员靠近设施。围栏的一高度要求列在表\
  \ 5-5 中。\n- **安全照明。** 限制性设施可能有额外的照明，以暴露并威慑任何潜在的入侵者。\n- **安全门、防撞门和护桩。** 这些控制限制了设施附近车辆的移动，以减少车辆威胁。\n\
  \n| **高度** | **一般效果** |\n| --- | --- |\n| 3–4 英尺 (1 米) | 阻止偶然闯入者 |\n| 6–7 英尺 (2\
  \ 米) | 难以攀爬 |\n| 8 英尺 (2.4 米) + 三排铁丝网 | 阻止更有决心的入侵者 |\n\nTABLE 5-5 围栏通用高度要求\n\n###\
  \ 公用事业与 HVAC 考虑因素\n\n环境和生命安全控制，如公用事业和 HVAC（供暖、通风和空调），对于维持计算机和人员的安全且接受的操作环境是必要的。\n\
  \n#### 电力\n\n电力的通用考虑因素包括来自一个或多个电力变电站或电网的一个或多个专用馈线，并确保对配电盘和断路器实施了适当的物理访问控制。应在主要系统和出口附近安装紧急断电\
  \ (`EPO`) 开关，以便发生火灾或触电时关闭电源。此外，应建立备用电源，例如柴油或天然气发电机。应为关键设施和系统提供备用电源，包括应急照明、火灾检测和灭火、主机和服务器（以及某些工作站）、HVAC、物理访问控制系统和电信设备。\n\
  \n\n\n\n\n![warning](img/warning.png) 虽然作为备用电源，天然气可以是柴油更清洁的替代品，但在空气和噪声污染方面，它通常无法满足应急生命系统（如应急照明和火灾系统），因为燃料源（天然气）无法在本地存储，因此该系统依赖于必须通过管道提供的外部燃料源。\n\
  \n## 静电释放 (ESD) 的保护措施包括：\n\n* 保持适当的湿度水平（40% 到 60%）。\n* 确保良好的接地。\n* 使用防静地板、防静地毯和防静垫。\n\
  \n## 电气噪声的保护措施包括：\n\n* 安装电源净化器。\n* 确保良好的接地。\n* 使用屏蔽电缆。\n\n使用不间断电源 (UPS) 可能是防止电气异常最重要的保护措施。UPS\
  \ 为敏感系统提供清洁的电源，并在停电期间（全停电、欠电和电压跌落）提供临时电源；这种电源必须足够充足以正常关闭受保护的系统。**注意：** UPS 不应作为备用电源使用。UPS——即使是建筑级\
  \ UPS——其设计目的也是提供临时电源（通常为 5 到 30 分钟），以便为备用机的启动提供时间，或允许受保护系统进行受控且正确的关闭。\n\n### 电气危害\n\
  \n敏感设备可能会受到各种电气危害和异常的损坏或影响，包括：\n\n* **静电释放 (ESD)：** 计算机设备的理想湿度范围是 40% 到 60%。湿度越高会导致冷凝和腐蚀。湿度越低会增加静电（ESD）的风险。低至\
  \ 40V（伏特）的静电即可损坏敏感电路，而 2000V 可导致系统关机。人类感受到的最小放电量为 3000V，而且可能发生超过 25000V 的静电释放——所以如果你能感觉到它，对你的设备来说就有问题！\n\
  \  ![remember](img/remember.png) 计算机设备的理想湿度范围是 40% 到 60%。\n\n* **电气噪声：** 包括电磁干扰\
  \ (EMI) 和射频干扰 (RFI)。EMI 是三根电线（火线、零线和地线）之间不同电荷产生的，可以是`共模噪声`（由火线和地线引起）或`差模噪声`（由火线和零线之间的功率差引起）。RFI\
  \ 是由电气元件引起的，如荧光灯和电力电缆。`瞬态`是指瞬时的线路路噪声扰动。\n\n* **电气异常：** 这些异常包括表 5-6 中列出的。\n\n| 电气事件\
  \ | 定义 |\n| --- | --- |\n| 停电 (Blackout) | 完全失去电源 |\n| 故障 (Fault) | 瞬间失去电源 |\n|\
  \ 欠电 (Brownout) | 电压持续下降 |\n| 跌落 (Sag) | 电压短暂下降 |\n| 浪入 (Inrush) | 初始功率冲击 |\n| 尖峰\
  \ (Spike) | 瞬时功率冲击 |\n| 浪涌 (Surge) | 持续功率冲击 |\n\n表 5-6 电气异常\n\n![tip](img/tip.png)\
  \ 你可能想为表 5-6 中的列表想出一个毫无意义的助记法，例如 `Bob Frequently Buys Shoes In Shoe Stores.*。你在\
  \ CISSP 考试中需要这些术语。\n\n![remember](img/remember.png) 杀死你的不是电压，而是电流！\n\n![warning](img/warning.png)\
  \ 浪涌保护器和浪涌抑制器对敏感计算机系统的保护微乎其微，而且它们更常见（且更危险地）被用于过载电源插座或作为串联插线板。大多数这些装置的保护电路成本低于一美元（比较低端浪涌保护器与\
  \ 6 英尺插线板的成本），一分一钱——这些美化过的插线板仅提供极微的尖峰保护。诚然，浪涌保护器提供的保护比完全没有要好，但不要被这些设备让你掉以轻——要定期检查它们的使用和运行情况，并且不要接受它们作为\
  \ UPS 的可行替代方案。\n\n### HVAC\n\n暖气、通风和空调 (HVAC) 系统为计算机和人员维持适当的环境。HVAC 规划涉及基于许多因素的复杂计算，包括估计占据给定区域的计算机和人员产生的平均\
  \ BTUs（英国制热单位）、房间尺寸、绝缘特性和通风系统。\n\n计算机设备的理想温度范围是 50°F 到 80°F (10°C 到 27°C)。在低至 100°F\
  \ (38°C) 时，磁性存储介质可能会损坏。\n\n![remember](img/remember.png) 计算机设备的理想温度范围是 50°F 到 80°F\
  \ (10°C 到 27°C)。\n\n计算机设备的理想湿度范围是 40% 到 60%。湿度越高会导致冷凝和腐蚀。湿度越低会增加静电（ESD）的风险。\n\n\
  计算机设备机架的门和侧板应保持关闭（并锁定，作为一种物理访问控制的形式），以确保冷却和通风的空气流通。在可能的情况下，设备机架中的空隙（例如半满的机架或已安装设备之间的间隙）应该用盲板板覆盖，以减少热侧（通常是设备的电源侧）和冷侧（通常是设备正面）之间的冷热混合；这种冷热空气的混合会降低冷却系统的效率。\n\
  \n暖冷系统应进行妥善维护，并定期清洁空气过滤器以减少粉尘污染和火灾危害。\n\n大多数气体发生灭火抑制系统在释放前会自动关闭 HVAC 系统，但在出口附近应安装一个独立的紧急断电\
  \ (EPO) 开关，以便在紧急情况下进行手动关闭。\n\n理想情况下，HVAC 设备应该是专用、受控且监控的。如果系统不是专用或独立控制，则需要与建筑管理员保持良好联系，以确保在出现问题时知道联系谁。当超过运行阈时，监控系统应通知相关人员。\n\
  \n### 水问题\n\n水害（以及一般的液体损坏）可能来自许多不同的来源，包括管道破裂、灭火行动、屋顶漏水、洒出的饮料、洪水和海啸。潮湿的计算机和其他电气设备构成了潜在的致命危害。\n\
  \n\n\n\n\n火若要燃烧，需要三种元素：热量、氧气和燃料。这三种元素有时被称为`火三角形`。（参见图 5-4）。灭火和扑火系统通过移除这三种元素中的一种，或通过暂时打破这三种元素之间的化学反应（分离火三角形）来灭火。火灾根据燃料类型进行分类，如表\
  \ 5-7 所示。\n\n![image](img/9781119505815-fg0504.png)\n\n图 5-4： 火灾需要这三种元素才能燃烧。\n\n\
  | **类别** | **描述（燃料）** | **灭火方法** |\n| --- | --- | --- |\n| A | 常见燃物，如纸张、木材、家具和衣服\
  \ | 水或碳酸水水 |\n| B | 可燃燃料，如汽油或油 | CO[2] 或碳酸水水 |\n| C | 电火，如计算机或电子设备 | CO[2]（注：扑灭此类火灾最重要的步骤是：先切断电源！）\
  \ |\n| D | 特殊火灾，如可燃金属 | 可能需要完全浸没或其他特殊技术 |\n| K (或 F) | 烹饪油或脂肪 | 水雾或灭火毯 |\n\n表 5-7\
  \ 火灾分类及扑灭/灭火方法\n\n![remember](img/remember.png) 在任何生命威胁的情况下，拯救人类生命是首要任务。\n\n![tip](img/tip.png)\
  \ 你必须能够描述 A 类、B 类和 C 类火灾及其主要的灭火方法。CISSP 考试不涉及 D 类和 K（或 F）类火灾（它们与计算机火灾相比并不常见——除非你的服务器房恰好位于当地酒吧和炸鸡翅店的油炸锅正上方）。\n\
  \n## 火灾检测与灭火\n\n火灾检测和灭系统是保护设施、设备和（最重要的）人类生命最基本的生命安全控制措施。\n\n三种主要的火灾检测系统是：\n\n* \
  \  **热感：** 这些设备感应超过预设水平的温度（`固定温度探测器`）或快速上升的温度（感温探测器）。）。固定温度探测器更为常见，且误报率低于感温探测器。\n\
  *   **火焰感：** 这些设备感应火焰的闪烁（或脉冲）或火焰的红外能量。这些系统相对昂贵，但提供了极快的响应。\n*   **烟感：** 这些设备检测烟雾，火灾的副产品之一。四种烟雾探测器是：\n\
  \n    *   **光电式：** 感应光强的变化。\n    *   **光束：** 与光电式类似；感知烟雾中断光束。\n    *   **离子式：**\
  \ 检测放射性材料正常离子电流的扰动。\n    *   **吸入式：** 将空气抽入采样腔以检测微量烟雾。\n\n![remember](img/remember.png)\
  \ 三种主要的火灾检测系统是热感、火焰感和烟感。\n\n两种主要的火灾灭火系统是：\n\n*   **自动喷淋系统：** 水通过移除火三角形中的热量元素来灭火，它对\
  \ A 类火灾最有效。水是所有商业环境中主要的灭火剂。虽然水可能会损坏设备，但它是可用的最有效、廉价、易于获取且对人类伤害最小的灭火剂之一。自动喷淋系统的四种变化是：\n\
  \n    *   **湿式（或闭式喷头）：** 最常用且被认为最可靠。管道中始终充满水并随时准备激活。通常是喷头中的熔链会熔化或破裂，打开闸阀释放水流。缺点包括由于喷头或管道故障导致淹水，以及寒冷天气下管道结冰导致。\n\
  \    *   **干式：** 管道内没有静止水。激活时，蝶阀打开，空气从管道中排出，水流出。这种系统的效率低于湿式系统，但减少了意外淹水的风险；如果条件允许，延迟提供了关闭计算机系统（或切断电源）的机会。\n\
  \    *   **水幕式：** 工作原理与干式系统类似，但设计用于快速提供大量水。水幕系统通常不用于计算机设备区域。\n    *   **预作用式：**\
  \ 结合了湿式和干式系统。管道最初是干燥的。当热传感器被触发时，管道中充满水并激活报警。在熔链熔化之前（如湿式系统），水不会真正喷出。该系统建议用于计算机设备区域，因为它通过允许人工干预降低了意外喷放的风险。\n\
  \n    ![remember](img/remember.png) 四种主要的自动喷淋系统是湿式、干式、水幕式和预作用式。\n\n*   **气体灭火系统：**\
  \ 气体灭火系统可以是移动携（如 CO[2] 灭火器），也可以是固定的（架空地板下方）。这些系统通常根据采用的灭火剂分类。这些剂包括：\n\n    *   **二氧化碳\
  \ (CO[2])：** CO[2] 是一种常用的无色无味气体，通过移除火三角形中的氧气元素来灭火。（参见图 5-4）。CO[2] 对 B 类和 C 类火灾最有效。因为它移除氧气，其使用可能是致命的，因此最适用于无人区域或在有人区域配备手动覆盖的措施。\n\
  \n        CO[2] 也用于便携式灭火器，应位于所有出口并距离电气设备 50 英尺（15 米）。所有便携式灭火器（CO[2]、水和碳酸水）应清楚标记（列出火类别）并定期检查。此外，所有人员应接受灭火器使用方法的培训。\n\
  \n    *   **碳酸水：** 包括多种化合物，通过移除火三角形的燃料元素（抑制燃料的可燃成分）来灭火。（参见图 5-4）。碳酸水对 A 类和 B 类火灾最有效。由于某些化学剂的强腐蚀性，它不用于\
  \ C 类火灾。\n    *   **气体式：** 气体系统通过分离火三角形的元素（化学反应）抑制火灾；它们对 B 类和 C 类火灾最有效。（参见图 5-4）。惰性气体不会损坏计算机设备，不留液体或固体残留，与空气充分混合且扩散极快。然而，浓度高于\
  \ 10% 的这些气体吸入有害，且某些类型在处理温度超过 900°F (482°C) 的火灾时会分解产生毒化学品（氟化氢、溴化氢和溴）。\n\n       \
  \ 氟曾是气体灭火系统的首选气体。但由于氟的破坏臭氧特性，1987 年的《蒙特利尔议定书》禁止进一步生产和安装氟系统（从 1994 年开始），并鼓励更换现有系统。氟的可用替代品包括\
  \ FM-200（最有效）、CEA-410 或 CEA-308、NAF-S-III、FE-13、氩气或氮气以及 Inergen。\n\n        ![remember](img/remember.png)\
  \ 氟是破坏臭氧物质。可选替代品包括 FM-200、CEA-410 或 CEA-308、NAF-S-III、FE-13、氩气或氮气以及 Inergen。\n\n\
  \n\n\n\n![check](img/check.png) 设计安全网络\n![check](img/check.png) 使用安全网络组件工作\n![check](img/check.png)\
  \ 保护网络通信\n![check](img/check.png) 理解网络攻击与防御措施\n\n通信与网络安全领域要求对网络基础、安全网络设计、网络运营概念、网络技术和网络管理技术有深入理解。该领域占\
  \ CISSP 认证考试分数的 14%。\n\n![tip](img/tip.png) 对网络协议、服务、实践和架构的透彻理解绝对有助于你通过考试。如果你的网络经验较少，我们建议你读一本*Networking\
  \ All-In-One For Dummies*（傻瓜学网络）。此外，在参加 CISSP 考试之前，可以考虑获得网络认证，例如 CompTIA Network+\
  \ 或 Cisco 认证网络工程师 (CCNA)。如果你的网络背景知识薄弱，这些材料在准备 CISSP 考试的这部分内容非常有帮助。\n\n## 在网络架构中实现安全设计原则\n\
  \n对网络概念和基础的坚实理解对于构建安全网络架构至关重要。这需要了解网络拓扑、IP 地址、各种网络协议（包括多层和收敛协议）、无线网络、通信安全以及不断演变的网络趋势，如软件定义网络、微隔离和云计算。\n\
  \n数据网络通常被分类为局域网 (LAN) 和广域网 (WAN)。虽然这些是基本的分类，但你应该理解这两种类型网络之间的根本区别。\n\n`local area\
  \ network` (LAN) 是运行在较小地理区域内（如单栋建筑或某一层）的数据网络。LAN 连接了工作站、服务器、打印机和其他设备，以便共享网络资源（如文件和电子邮件）。局域网的主要特征包括：\n\
  \n* 可以在较小的地理区域内（如楼层、一栋楼或一组建筑）连接网络化资源。\n* 建立和维护成本相对较低，通常由易于获得的设备组成，如服务器、台式电脑、打印机、交换机、集线器、桥器、中继器、无线接入点\
  \ (WAPs 或简单的 APs) 以及防火墙和入侵防御系统 (IPS) 等各种安全设备。\n* 可以是有线的、无线的，或者是有线无线结合。\n* 运行速度较快——有线网络通常为每秒\
  \ 10 兆比特 (Mbps)、100 Mbps、1000 Mbps（也称为每秒 1Gb 比特 [1 Gbps]）、10 Gbps 和 40 Gbps；无线网络则为\
  \ 11 Mbps、54 Mbps 或 600 Mbps。我们将在本章稍后的“物理层（第 1 层)”部分介绍 LAN 速度。\n\n![warning](img/warning.png)\
  \ 在引用数据容量（及其缩写）和数据存储时要小心。100 Mbps 是“每秒 100 兆比特”，而 100 MB 是“100 兆字节”。区别非常细微（小写 b\
  \ 与大写 B，位与字节），但差异是巨大的：1 字节等于 8 位。数据速度通常以位比特为单位；数据存储通常以字节为单位。\n\n![remember](img/remember.png)\
  \ `local area network` (LAN) 是运行在较小地理区域内（如一栋建筑或一组建筑）的数据网络。\n\n`wide area network`\
  \ (WAN) 通过使用电信设备和设施连接多个 LAN 和其他 WAN，形成一个互联网。广域网的主要特征包括：\n\n* 在较大的地理区域内连接多个 LAN，例如小城市（例如城域网\
  \ [或 MAN]）、一个区域或国家、全球公司网络、整个地球（例如互联网）或更远的地方（例如通过卫星连接的国际空间站）。\n* 建立和维护成本可能相对昂贵，通常由路由器、信道业务单元/数据业务单元\
  \ (CSU/DSU) 设备、防火墙、虚拟专用网络 (VPN) 集中器以及各种其他安全设备组成。\n* 使用各种技术运行速度相对较低，例如拨号上网（每秒 56\
  \ 千比特 [Kbps]）；数字用户线路或 DSL（例如 128 Kbps 到 16 Mbps）；T-1 (1.544 Mbps）；DS-3（约 45 Mbps）；OC-12（约\
  \ 622 Mbps）以及 OC-255（约 13 Gbps）。我们将在本章稍后的“数据链路层（第 2 层)”部分介绍 WAN 速度。\n\n广域网的示例包括：\n\
  \n* **互联网 (Internet)：** 广域网之母，它是最初由美国国防部 (DoD) 高级研究计划署 (DARPA) 开发的全球公共网络。用户和系统通过互联网服务提供商\
  \ (ISP) 连接到互联网。\n* **内网 (Intranet)：** 内网可以被看作私有的互联网。内网通常使用基于 Web 的技术发布公司信息，只有内部公司网络上的授权用户可用。\n\
  * **外网 (Extranet)：** 外网将内网的基本概念扩展到合作伙伴、供应商或其他相关方。例如，汽车制造商可能会运营一个连接到零部件制造商、分销商和经销商网络的外网。外网通常通过互联网使用虚拟专用网络\
  \ (VPN)——本文章稍后讨论——或其他安全连接进行运营。\n\n![remember](img/remember.png) `wide area network`\
  \ (WAN) 是运行在较大地理区域内的数据网络，并包含了电信运营商提供的部分。\n\n### OSI 和 TCP/IP 模型\n\nOSI 和 TCP/IP\
  \ 模型通过分层方法定义了网络通信和互操作性的标准。这种方法将复杂的网络问题划分为更简单的功能组件，并提供了以下特定优势：\n\n* 阐明通信过程的通用功能，而不是关注特定问题。\n\
  * 将复杂的网络过程简化为更子层和组件。\n* 通过定义标准接口促进互操作性。\n* 通过允许厂商在单层更改单个功能而无需重建整个协议栈，来辅助开发。\n* 便于进行更符合逻辑的故障排除。\n\
  \n#### OSI 参考模型\n\n1984 年，国际标准化组织 (ISO) 通过了开放系统连接 (OSI) 参考模型（或简称 *OSI 模型*），以促进独立于制造商的网络设备互操作。\n\
  \nOSI 模型由七个层组成，描述了数据如何在计算机网络的系统和应用程序之间进行通信，如图 6-1 所示。这些层包括：\n\n* 应用层（第 7 层）\n* 表示层（第\
  \ 6 层）\n* 会话层（第 5 层）\n* 传输层（第 4 层）\n\n\n\n\n\n* 网络层（第 3 层）\n* 数据链路层（第 2 层）\n* 物理层（第\
  \ 1 层）\n\n![image](img/9781119505815-fg0601.png)\n\nFIGURE 6-1: OSI 模型的七层。\n\n![tip](img/tip.png)\
  \ 尝试创建一个助记法来记忆 OSI 模型的层，例如 `All People Seem To Need Delicious Pizza`，以及反向的 `Please\
  \ Do Not Throw Sausage Pizza Away.`。\n\n在 OSI 模型中，数据从最高层（应用层；第 7 层）向下通过每一层传递最低层（物理层；第\
  \ 1 层），然后跨网络介质传输到目的节点，在节点处从最低层向上传递到最高层。每一层只与其直接上方和下方的层（相邻层）进行通信。这种通信是通过被称为“数据封装”的过程实现的。`data\
  \ encapsulation` 将上一一层的协议信息封装在紧下一层的数据段中。图 6-2 展示了这一过程。\n\n![image](img/9781119505815-fg0602.png)\n\
  \nFIGURE 6-2: OSI 模型中的数据封装。\n\n### 应用层（第 7 层）\n\n应用层（第 7 层）是 OSI 模型的最高层。它支持处理需要网络访问的应用程序的通信方面的组件，并为用户提供接口。因此，应用层和最终用户都直接与应用程序交互。\n\
  \n应用层负责以下工作：\n\n* 识别并建立通信对象的可用性\n* 确定资源可用性\n* 同步通信\n\n![remember](img/remember.png)\
  \ 应用层负责识别并建立通信对象的可用性，确定资源可用性并同步通信。\n\n不要将应用层与 Microsoft Word 或 Excel 等软件应用程序混淆。在应用层运行的应用程序包括\n\
  \n* **文件传输协议 (FTP):** 用于通过网络从一个系统将文件复制到另一个系统的程序。`FTP` 运行在 TCP 端口 `20`（数据端口）和 `21`（控制端口）上。\n\
  * **超文本传输协议 (HTTP):** 万维网 (WWW) 的语言，网页服务器和浏览器用于非敏感内容。`HTTP` 运行在 TCP 端口 `80` 上。\n\
  * **安全超文本传输协议 (HTTPS):** 万维网 (WWW) 上商业交易的语言。`HTTPS` 实际上是结合 `SSL/TLS` 使用的 `HTTP`\
  \ 协议（在章节“传输层（第 4 层)#c06.xhtml_c06-sec-0009)”中讨论）。`HTTPS` 运行在 TCP 端口 `443` 上，有时也用于其他端口如\
  \ `8443`。\n* **互联网消息访问协议 (IMAP):** 一种存储和转发的电子邮件协议，允许邮件客户端访问远程邮件服务器```比`POP3` 提供了更多功能和安全性，例如要求用户显式地从服务器删除电子邮件。最新版本是\
  \ `IMAPv4`（或 `IMAP4`），它运行在 TCP 和 UDP 端口 `143` 上。使用 `IMAP` 的邮件客户端可以通过在 TCP/UDP 端口\
  \ `993` 上使用 `TLS` 或 `SSL` 加密来实现安全。\n* **邮局协议版本 3 (POP3):** 一种电子邮件检索协议，允许邮件客户端通过\
  \ TCP 端口 `110` 访问远程邮件服务器上的电子邮件。`POP3` 本身是不安全的，它允许用户使用明文密码在互联网上进行身份验证。使用 `POP3` 的邮件客户端可以通过在\
  \ TCP/UDP 端口 `995` 上使用 `TLS` 或 `SSL` 加密来实现安全。\n* **隐私增强邮件 (PEM):** `PEM` 是一个 `IETF`（互联网工程任务组）标准，用于提供电子邮件的机性和身份验证。`PEM`\
  \ 并不广泛使用。\n* **安全超文本传输协议 (S-HTTP):** `S-HTTP` 是一种提供与网页服务器安全通信方法的互联网协议。`S-HTTP` 是一种无连接的协议，在成功协商会话安全属性后对数据进行封装。![warning\
  \ 不要混淆 `HTTPS` 和 `S-HTTP`。它们是两个截然不同的协议，有许多区别。例如，`HTTPS` 加密整个通信会话并常用于 VPN，而 `S-HTTP`\
  \ 则加密客户端和服务器对之间的单个消息。\n* **安全多功能互联网邮件扩展规范 (S/MIME):** `S/MIME` 是一种集成到许多流行浏览器和电子邮件应用程序中的安全发送电子邮件的方法。\n\
  * **简单邮件传输协议 (SMTP):** 用于在互联网上发送和接收电子邮件。该协议有几个著名的漏洞，使其本质上是不安全的。`SMTP` 运行在 TCP/UDP\
  \ 端口 `25` 上。通过 `SSL/TLS` 的 `SMTP` (`SMTPS`) 使用 TCP/UDP 端口 `465`。\n* **简单网络管理协议 (SNMP):**\
  \ 用于通过轮询收集网络信息并向管理站发送 `traps`（或告警）。`SNMP` 有许多众知的漏洞，包括默认的明文团体字符串（密码）。`SNMP` 运行在 TCP/UDP\
  \ 端口 `161`（代理）和 `162`（管理器）上。安全的 `SNMP` 使用 TCP/UDP 端口 `10161`（代理）和 `10162`（管理器）。\n\
  * **Telnet:** 为远程访问系统资源提供终端仿真。由于 `Telnet` 以明文形式传输密码，因此不被认为是安全的；相反，建议使用 `SSH`（在本章后面的章节“会话层（第\
  \ 5 层)#c06.xhtml_c06-sec-0008)”中讨论）。\n* **简单文件传输协议 (TFTP):** 一个精简的 `FTP` 版本，没有目录浏览功能或用户身份验证。通常认为不如\
  \ `FTP` 安全，`TFTP` 运行在 UDP 端口 `69` 上。\n\n### 表示层（第 6 层）\n\n表示层（第 6 层）提供了应用于呈现给应用层（第\
  \ 7 层）数据的编码和转换功能。这些功能确保从一个系统的应用层发送的数据与接收系统的应用层兼容。\n\n![remember 表示层负责编码转换功能。\n\n\
  此层相关的任务包括\n\n* **数据表示:** 使用常用的数据表示格式（标准图像、声音和视频）允许应用程序数据在不同类型的计算机系统之间交换。\n* **字符转换:**\
  \ 通过常用的字符转换方案在不同系统之间交换信息。\n* **数据压缩:** 常用的数据压缩方案允许压缩数据在目的地被正确解压缩。\n* **数据加密:** 常用的数据加密方案允许加密数据在目的地被正确解密。\n\
  \n表示层协议的示例包括\n\n* **信息交换美国标准代码 (ASCII):** 一种基于英语字母表的字符编码方案，由 128 个字符组成。\n* **扩展二进制编码数字交换码\
  \ (EBCDIC):** 一种 8 位字符编码方案，主要用于主机和中型范围计算机。\n* **图形交换格式 (GIF):** 一种广泛使用的位图图像格式，支持最多\
  \ 256 种颜色，适用于图像或标志（但不适用于照片）。\n* **联合图像专家组 (JPEG):** 一种广泛用于存储和传输照片的摄影压缩方法。\n* **运动图像专家组\
  \ (MPEG):** 一种广泛用于存储和传输音频和视频文件的压缩方法。\n\n### 会话层（第 5 层）\n\n会话层（第 5 层）负责建立、协调和终止网络系统之间的通信会话（服务请求和服务响应）。\n\
  \n\n\n\n\n![remember](img/remember.png) 会话层负责在系统之间建立、协调和终止通信会话。\n\n通信会话分为三个不同的阶段：\n\
  \n*   **连接建立：** 建立通信系统之间的初始接触，终端设备对将使用的通信参数和协议达成一致，包括工作模式：\n    * ****单工模式（Simplex\
  \ mode）：** 在单工模式下，建立一条单向通信路径，连接的一端是发送器，另一端是接收器。类比是 AM 广播，电台广播音乐，而无线收音机只能接收广播。\n\
  \    * **半双工模式（Half-duplex mode）：** 在半双工模式下，两个通信设备都能发送和接收消息，但它们不能同时进行。类比是双向无线电，必须按下按钮发送，然后释放以接收信号。\n\
  \    * **全双工模式（Full-duplex mode）：** 在全双工模式下，两个通信设备都能同时发送和接收。类比是电话，你可以同时发送和接收信号（但不一定在同时进行交流）。\n\
  *   **数据传输：** 终端设备之间交换信息。\n*   **连接释放：** 数据传输完成后，终端设备系统地结束会话。\n\n会话层协议的一些示例包括：\n\
  \n*   **NetBIOS：** 网络基本输入/输出系统（NetBIOS）是微软的一种协议，允许应用程序在局域网上进行通信。当 NetBIOS 与 `TCP/IP`\
  \ 等协议结合时，称为 NetBIOS over TCP/IP（或 NBT），应用程序可以在大型网络上通信。\n*   **网络文件系统（NFS）：** 由 Sun\
  \ Microsystems 开发，便于用户透明地访问基于 UNIX 的 TCP/IP 网络上的远程资源。\n*   **远程过程调用（RPC）：** 一种客户端-服务器网络重定向工具。过程在客户端上创建并在服务器上执行。\n\
  *   **安全远程过程调用（S-RPC）：** `S-RPC` 是一种安全的客户端-服务器协议，定义在 OSI 模型的多个上层。RPC 用于请求网络上另一台计算机的服务。S-RPC\
  \ 通过使用 Diffie-Hellman 为客户端和服务器提供公钥和私钥。在 S-RPC 操作初始身份验证后，它们对最终用户是透明的。\n*   **安全外壳（SSH\
  \ 和 SSH-2）：** SSH 为远程访问提供了 Telnet 的安全替代（在本章后面的部分“应用层（第 7 层）”中讨论）。SSH 在客户端和服务器之间建立加密隧道，还可以向服务器验证客户端的身份。SSH\
  \ 可用于保护网络通信的机性和完整性。SSH-2 在 SSH 客户端和 SSH 服务器之间建立加密隧道，并也可以向服务器验证客户端的身份。SSH 版本 1 也被广泛使用，但具有容易被利用的固有漏洞。\n\
  ![remember](img/remember.png) SSH-2（或简称 SSH）是一种提供安全远程访问的网络安全应用。\n*   **会话发起协议（SIP）：**\
  \ 一种开放的信号协议标准，用于在大型 IP 网络上建立、管理和终止实时通信——如语音、视频和文本。\n\n## 传输层（第 4 层）\n\n传输层（第 4 层）提供透明、可靠的数据传输和端到端传输控制。传输层向上层隐藏了下层功能的详细细节。\n\
  \n具体的传输层功能包括：\n\n*   **流量控制：** 管理设备之间的数据传输，确保发送设备发送的数据不超过接收设备处理能力。\n*   **多路复用：**\
  \ 允许来自多个应用程序的数据在单一物理链上传输。\n*   **虚拟电路管理：** 建立、维护和终止虚拟电路。\n*   **错误检查和恢复：** 实现各种机制来检测传输错误，并采取措施解决任何发生的错误，例如请求重传数据。\n\
  \n![remember](img/remember.png) 传输层负责提供透明的数据传输和端到端传输控制。\n\n在传输层定义的若干种重要协议包括：\n\n\
  *   **传输控制协议（TCP）：** 一种`全双工`（能够同时发送和接收）的面向连接的协议，提供跨网络数据包的可靠交付。`面向连接`的协议在任何数据传输发生之前，需要在两个通信设备之间建立直接连接。在\
  \ TCP 中，这种连接通过`三次握手`完成。接收设备确认数据包，如果发生错误，则重传数据包。以下特征和功能与 TCP 相关：\n    *   **面向连接：**\
  \ 建立并管理到远程设备的直接虚拟连接。\n    *   **可靠性：** 通过确认收到的数据包并请求重传丢失或损坏的数据包来保证交付。\n    *   **慢：**\
  \ 由于与初始握手、确认数据包和错误纠正相关的额外开销，TCP 通常比无连接协议（如用户数据报协议 UDP）慢。\n\n![remember](img/remember.png)\
  \ TCP 是一种面向连接的协议。\n\n![technicalstuff](img/technicalstuff.png) `三次握手`是用于建立 TCP 连接的方法。尝试与服务器建立连接的\
  \ PC 通过发送 `TCP SYN`（同步）数据包来发起连接。这是握手的第一部分。在握手的第二部分，服务器用 `SYN ACK` 数据包（同步确认）回复 PC。最后，PC\
  \ 通过发送 `ACK` 或 `SYN-ACK-ACK` 数据包完成握手，确认服务器的确认，数据开始传输。\n`socket`（套接字）是系统上的逻辑端点，用于通过网络与另一个系统（甚至是在同一设备上）进行通信。socket\
  \ 通常表示为 IP 地址和端口号，例如 `192.168.100.2:25`。\n\n*   **用户数据报协议（UDP）：** 一种无连接的协议，提供跨网络数据报的快速尽力交付。无连接协议不保证所传输数据包（数据报）的交付，因此被认为是不可靠的。它不会\n\
  \    *   在传输数据之前尝试与目标网络建立连接。\n    *   确认收到的数据报。\n    *   执行重新排序。\n    *   执行错误检查或恢复。\n\
  \    *   ![technicalstuff](img/technicalstuff.png) `datagram`（数据报）是一个自包含的数据单元，能够在源和目的之间进行路由。与在网协议（IP）中使用的数据包类似，数据报常用于\
  \ UDP 和其他协议。\n    ![technicalstuff](img/technicalstuff.png) 协议数据单元（PDU）一术语用于描述协议特定层级使用的数据单元。例如，在\
  \ OSI 模型中，第 1 层 PDU 是比特，第 2 层 PDU 是帧，第 3 层是数据包，第 4 层是段或数据报，第 7 层的 PDU 是数据。\n\nUDP\
  \ 非常适用于需要快速交付的数据，只要这些数据对丢包不敏感且不需要分片。使用 UDP 的应用程序示例包括域名系统（DNS）、简单网络管理协议（SNMP）以及流媒体音频或视频。\n\
  \n\n\n\n\n- **无连接的：** 不会与目标网络预先建立通信电路。\n- **尽力而为：** 不保证送达，因此被认为是不可靠的。\n- **快速的：**\
  \ 没有与建立连接、确认、排序或错误检查与恢复相关的开销。\n\n![technicalstuff](img/technicalstuff.png) 流媒体音频和视频中的**抖动**（Jitter）是由于接收的数据包延迟变化引起的，这是\
  \ `UDP` 的一个负面特性。\n\n- **顺序数据包交换 (SPX)：** 一种在旧的 Novell NetWare IPX/SPX 网络中用于保证数据传输的协议。`SPX`\
  \ 对传输的数据包进行排序，重组接收到的数据包，确认所有数据包均已接收，并对未收到的数据包请求重传。`SPX` 之于 `IPX` 正如 `TCP` 之于 `IP`，尽管可能会令人困惑，因为顺序表述为\
  \ `IPX/SPX` 而不是 `SPX/IPX`（类似于 `TCP/IP`）：`SPX` 和 `TCP` 都是第 4 层协议，而 `IPX` 和 `IP` 都是第\
  \ 3 层协议。只需将它们想象成阴和阳，而不是阳和阴！\n\n表 6-1 中列出了若干面向连接和面向无连接的协议的示例。\n\n- **安全套接层/传输层安全协议\
  \ (SSL/TLS)：** `SSL/TLS` 协议为互联网上客户端与服务器之间的安全通信提供基于会话的加密和认证。`SSL/TLS` 提供服务器认证，并可选客户端认证。\n\
  - **流控制传输协议 (SCTP)：** 一种面向消息的协议（类似于 `UDP`），可确保传输的可靠性。\n\n| 协议 | 层 | 类型 |\n| :---\
  \ | :--- | :--- |\n| TCP (传输控制协议) | 4 | 面向连接 |\n| UDP (用户数据报协议) | 4 | 无连接 |\n| IP\
  \ (网协议) | 3 | 无连接 |\n| ICMP (互联网控制消息协议) | 3 | 无连接 |\n| IPX (网数据包协议) | 3 | 无连接 |\n\
  | SPX (顺序数据包交换协议) | 3 | 面向连接 |\n\n表 1 面向连接和面向无连接的协议\n\n### 面向连接和无连接的协议\n\n网络层（第\
  \ 3 层）\n\n网络层（第 3 层）提供面向连接或无连接的路由功能。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 路由协议包括路由信息协议 `RIP`、开放最短路径优先 `OSPF`、内部网关路由协议 `IGRP` 以及边界网关协议 `BGP`。\n\n![technicalstuff](img/technicalstuff.png)\
  \ 路由协议包括 `IP` 和 `IPX`。路由。**收敛**（Convergence），即网络中路由器更新其路由表的时间，可能是一个重大问题。\n\n![technicalstuff](img/technicalstuff.png)\
  \ **跳数**通常是指数据包到达目的地之前必须经过的路由器节点数量。\n\n**链路状态**协议要求每个路由器都计算并维护整个网络的完整地图，或**路由表**。使用链路状态协议的路由器定期向网络中的所有其他路由器发送有关相邻连接的信息（这些被称为**链路状态**）。链路状态协议计算密集型，但可以计算出通目的的最有效路径，考虑到链路速度、延迟、负载、可靠性和代价（任意分配的权重或指标）等许多因素。链路状态协议的收敛非常快（几秒钟内）；距离向量协议通常需要更长时间（在非常大的网络中可能需要几分钟甚至几小时）。\n\
  \n链路状态路由协议示例包括：\n\n路由信息协议 `RIP` 是一种距离向量路由协议，使用跳数作为路由指标。为了防止**路由环路**（数据包在路由器节点之间反复循环），`RIP`\
  \ 实现了跳数限制，这极大限制了 `RIP` 支持的网络规模。数据包跨越 15 个路由器节点后，目的地被视为不可达。除了跳数限制外，`RIP` 还采用了其他三种机制来防止路由环路：\n\
  \n- **水平分割 (Split horizon)：** 防止路由器从学习路由的同一接口发布该路由。\n- **路由毒化 (Route poisoning)：**\
  \ 将坏路由的跳数设置为 16，如果跳数超过 15，则有效地将路由标记为不可达。\n- **锁定计时器 (Holddown timers)：** 当路由器首次收到目的地不可达的信息时，启动一个计时器。在计时器过期之前，不会接受关于该目的地的后续更新。这有助于避免与**抖动**（flapping）相关的问题。抖动是指路由（或接口）在时间内频繁切换状态（开启、关闭、开启、关闭）。\n\
  \n`RIP` 使用 `UDP` 端口 520 作为其传输协议和端口，因此是一个无连接协议。`RIP` 的其他缺点包括收敛缓慢和安全性不足（`RIPv1` 无认证，而\
  \ `RIPv2` 以明文传输密码）。`RIP` 是一个遗留协议，但尽管有局限性，由于其简单性，今天在网络中仍被广泛使用。\n\n路由协议可以进一步分为链路状态（用于域内路由）和距离向量（用于域间路由）。\n\
  \n\n\n\n\n## 路由协议\n\n### 开放最短路径优先 (OSPF)\n`OSPF` 是一种链路状态路由协议，广泛应用于大型企业网络。它被认为是一种内部网关协议\
  \ (`IGP`)，因为因为它在单个自治系统 (`AS`) 内部执行路由功能。`OSPF` 直接封装在 IP 数据报文中，而不是使用如 `TCP` 或 `UDP`\
  \ 等传输层协议。`OSPF` 网络被划分为由 32 位区域标识符标识的区域。`区域标识符` (`Area identifiers`) 能够（但不必须）与网络\
  \ IP 地址相对应，并且可以在不发生冲突的情况下复制 IP 地址。特殊的 OSPF 区域包括主骨干区域（也称为 `area 0`）、stub 区域 (`stub\
  \ area`) 和非 stub 区域 (`NSSA`)。\n\n### 中间系统到中间系统 (IS-IS)\n`IS-IS` 是一种链路状态路由协议，用于通过数据包交换网络路由数据报文。它是一种内部网关协议，用于自治系统内部的路由，广泛应用于大型服务提供商骨干网络。\n\
  \n![technicalstuff](img/technicalstuff.png) `自治系统 (AS)` 是在单一互联网实体控制下的一组连续 IP 地址范围。每个自治系统被分配一个\
  \ 16 位或 32 位的 AS 数字 (`ASN`)，用于唯一标识互联网上的该网络。`ASNs` 由互联网数字分配机构 (`IANA`) 分配。\n\n`路径向量`\
  \ (`path-vector`) 协议在概念上与距离矢量协议相似，但没有了与跳数限制限制相关的扩展性问题。`边界网关协议` (`BGP`) 是路径向量协议的一个示例。\n\
  \n`BGP` 是一种路径向量路由协议，用于在独立的自治系统 (`ASs`) 之间。它被认为是一种外部网关协议 (`EGP`)，因为它在独立的自治系统之间执行路由功能。它是互联网服务提供商\
  \ (`ISPs`)、网络服务提供商 (`NSPs`) 以及非常大的私有 IP 网络使用的核心协议。当 `BGP` 运行在自治系统之间时（例如在 `ISPs`\
  \ 之间），它被称为外部 BGP (`eBGP`)。当 `BGP` 在一个 `AS` 内部运行时（例如在私有 IP 网络上），它被称为内部 BGP (`iBGP`)。\n\
  \n## 路由协议\n\n`路由` (`Routed`) 协议是网络层协议，例如 `网络数据包交换` (`IPX`) 和 `网协议` (`IP`)，它们带有路由信息对数据包进行路由，并允许这些数据包通过路由协议（在前节讨论过）跨网络传输。\n\
  \n网络数据包交换 (`IPX`) 是一种无连接协议，主要用于较旧的 Novell NetWare 网络，以在网络中路由数据包。它是 `IPX/SPX` (`网络数据包交换/顺序数据包交换`)\
  \ 协议族的一部分，该套件类似于 `TCP/IP` 协议族。\n\n网协议 (`IP`) 包含了允许数据包进行路由的地址信息。`IP` 是 `TCP/IP` (`传输控制协议/网协议`)\
  \ 协议族的一部分，它是互联网的语言。`IP` 有两个主要职责：\n\n*   无连接的、尽力而为（不保证）的数据报交付。\n*   数据报的分段与重组。\n\n\
  IP 版本 4 (`IPv4`) 是目前最常用的版本，它使用 32 位的逻辑 IP 地址，该地址被分为四个 8 位段（`字节`），并由两个主要部分组成：网络号和主机号。字节中的前四位被称为高位，字节中的后四位被称为低位。字节中的第一位称为最高有效位，字节中的最后一位称为最低有效位。如果位是“开启”的（1），每个位位置代表其值（参见\
  \ 表 6-2）；否则，其值为零（“关闭”或 0）。\n\n| 高位 | 低位 |\n| --- | --- |\n| 最高有效位 | | | | | | |\
  \ | 最低有效位 |\n| 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n\n表 6-2 IPv4 地址中的位位置值\n\n每个字节包含一个\
  \ `n8`位的数字，值为从 0 到 255。表 6-3 显示了二进制表示法下的字节值部分列表。\n\n| 十进制 | 二进制 | 十进制 | 二进制 | 十进制\
  \ | 二进制 |\n| --- | --- | --- | --- | --- | --- |\n| 255 | 1111 1111 | 200 | 1100\
  \ 1000 | 9 | 0000 1001 |\n| 254 | 1111 1110 | 180 | 1011 0100 | 8 | 0000 1000 |\n\
  | 253 | 1111 1101 | 160 | 1010 0000 | 7 | 0000 0111 |\n| 252 | 1111 1100 | 140 |\
  \ 1000 1100 | 6 | 0000 0110 |\n| 251 | 1111 1011 | 120 | 1111 1000 | 5 | 0000 0101\
  \ |\n| 250 | 1111 1010 | 100 | 0110 0100 | 4 | 0000 0100 |\n| 249 | 1111 1001 |\
  \ 80 | 0101 0000 | 3 | 0000 0011 |\n| 248 | 1111 1000 | 60 | 0011 1100 | 2 | 0000\
  \ 0010 |\n| 247 | 1111 0111 | 40 | 0010 1000 | 1 | 0000 0001 |\n| 246 | 1111 0110\
  \ | 20 | 0001 0100 | | 0000 0000 |\n\n表 6-3 字节的二进制表示\n\nIPv4 地址支持五种不同的类别，由左侧位所示（参见表\
  \ 6-4）：\n\n| 类 | 用途 | 地址范围 | 最大主机数 |\n| --- | --- | --- | --- | --- |\n| A | 大规模网络\
  \ | 0 | 1 到 126 | 16,777,214 (2²⁴) |\n| B | 中规模网络 | 10 | 128 到 191 | 65,534 (2¹⁶)\
  \ |\n| C | 小规模网络 | 110 | 192 到 223 | 254 (2⁸) |\n| D | 组播 | 1110 | 224 到 239 | N/A\
  \ |\n| E | 实验性 | 1111 | 240 到 255 | N/A |\n\n![technicalstuff](img/technicalstuff.png)\
  \ `127.0.0.1` 到 `127.255.255` 是一个*回环*网络，用于测试。发送到任何 `127` 地址的数据包都会立即路由回源。最常用的回环（或本地）地址是\
  \ `127.0.0.1`。\n\n若干 IPv4 范围也预留用于*私有网络*，以便在防火墙和网关后通过网络地址转换 (`NAT`) 使用：\n\n*   `10.0.0.0–10.255.255.255`\
  \ (A 类)\n*   `172.16.0.0–172.31.255.255` (B 类)\n*   `192.168.0.0–192.168.255.255`\
  \ (C 类)\n\n这些地址在互联网上是不可路由的，当需要跨互联网通信时，通常通过 `NAT` 将内部网络设备的私有不可路由地址转换为注册的 IP 地址。\n\
  \n\n\n\n\n1998 年，IETF 正式定义了 IP 版本 6（`IPv6`）规范作为 `IPv4` 的替代方案。`IPv6` 使用 128 位十六进制\
  \ IP 地址（`IPv4` 为 32 位），并整合了额外的功能以提供安全性、多媒体支持、即插用兼容性以及对 `IPv4` 的后兼容性。开发 `IPv6` 主要目的是提供比\
  \ `IPv4` 地址多得多的网络地址。好吧，它并不是无限的，但非常巨大——`2¹²⁸` 或大约 `3.4 × 10³⁸`（即 340 00 亿）个唯一地址！\n\
  \nIPv6 地址由 32 个十六进制数字组成，分为八个组（有时称为 hextel），每个组包含四个十六进制数字，用冒号分隔。*记住：*一个十六进制数字由 4\
  \ 位表示（参见表 6-5），因此每个 hextel 为 16 位（四个 4 位十六进制数字），八个 16-bit hextel 等于 128 位。IPv6 地址进一步划分为两个\
  \ 64 位段：前 64 位（也称为“顶”或“上层”）代表地址的网络部分，后 64 位（也称为“底”或“下层”）代表地址的节点或接口部分。网络部分进一步细分为\
  \ 48 位的全局网络地址和 16 位的子网地址。地址的节点或接口部分基于该节点或接口的 IEEE 扩展唯一标识符（`EUI-64`）物理或介质访问控制（`MAC`）地址（在本章后面的“数据链路层（第\
  \ 2 层）”部分中讨论）。\n\n| 十进制 | 十六进制 | 二进制 |\n| --- | --- | --- |\n| 0 | 0 | 0000 |\n\
  | 1 | 1 | 0001 |\n| 2 | 2 | 0010 |\n| 3 | 3 | 0011 |\n| 4 | 4 | 0100 |\n| 5 | 5\
  \ | 0101 |\n| 6 | 6 | 0110 |\n| 7 | 7 | 0111 |\n| 8 | 8 | 1000 |\n| 9 | 9 | 1001\
  \ |\n| 10 | A | 1010 |\n| 11 | B | 1011 |\n| 12 | C | 1100 |\n| 13 | D | 1101 |\n\
  | 14 | E | 1110 |\n| 15 | F | 1111 |\n\nTABLE 6-5 十进制、十六进制和二进制表示法\n\nIPv6 地址的基本格式为：\n\
  \n> `xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx`\n\n其中 `x` 代表一个十六进制数字（0–f）。\n\n以下是\
  \ IPv6 地址的示例：\n\n> `2001:0db8:0000:0000:0008:0800:200c:417a`\n\nIETF 定义了若干规则来缩短\
  \ IPv6 地址：\n\n*   **单个 hextel 中的前导零可以省略，但除了下一规则规定外，每个 hextel 必须至少包含一个十六进制数字。** 将此规则应用于上一个示例将得到以下结果：`2001:db8:0:0:8:800:200c:417a`。\n\
  *   **双冒号（::）可以表示一个或多个 16 位的零组，以及地址中的前导零或尾随零；:: 只能在每个 IPv6 地址中出现一次。** 将此规则应用于上一个示例将得到以下结果：`2001:db8::8:800:200c:417a`。\n\
  *   **在混合 IPv4 和 IPv6 环境中，可以使用 x:x:x:x:x;x:d.d.d 形式，其中 x 代表地址的六个高位 16-bit hextel，d\
  \ 代表地址的四个低位 8-bit 字节（使用标准 IPv4 表示法）。** 例如，`0db8:0:0:0:0:FFFF:129.144.52.38` 是一个有效的\
  \ IPv6 地址。将前两个规则应用于此示例将得到以下结果：`db8::ffff:129.144.52.38`。\n\n![tip](img/tip.png)\
  \ 十六进制表示法中的字母不区分大小（A 等于 a，B 等于 b，以此此类推），因此 IPv6 地址中可以使用任一种形式，尽管 IETF 建议使用小写字母。\n\
  \nIPv6 中的安全功能包括通过互联网协议安全安全（`IPsec`）实现的网络层安全，以及在请求意见（`RFC`）7112 中定义的定义，用以防止 IPv6\
  \ 报头中的分片攻击。\n\n![tip](img/tip.png) 十六进制表示法中的字母不区分大小（A 等于 a，B 等于 b，以此此类推），因此 IPv6\
  \ 地址中可以使用任一种形式，尽管 IETF 建议使用小写字母。\n\nIPv6 中的安全功能包括通过互联网协议安全（`IPsec`）实现的网络层安全，以及在请求意见（`RFC`）7112\
  \ 中定义的定义，用以防止 IPv6 报头中的分片攻击。\n\n多层协议是针对专用网络构建的协议组，具有第 2 层帧、第 4 层传输和第 7 层应用。\n\n\
  融合协议是指为了特定目的多种协议的实现。融合协议的一些示例包括\n\n*   MPLS（多协议标签交换）\n*   FCoE（以太网光纤通道）\n*   VoIP（IP\
  \ 语音）\n*   SIP（会话发起协议）\n*   iSCSI（互联网小型计算机接口）\n\n软件定义网络或 `SDN` 代表了快速创建、配置、管理、安全监控网络元素的能力。SDN\
  \ 利用开放架构，使得路由、交换和负载均衡等智能网络功能可以在通用硬件上执行。在 SDN 中，网络元素和架构是虚拟的。\n\n与其他虚拟化技术一样，SDN 需要策略、流程和纪律来管理，以避免*网络蔓延*（由于缺乏纪律的管理员绕过控制流程并单方面创建虚拟网络元素的现象）。\n\
  \n其他网络层协议\n\n在网络层定义的其他协议包括互联网控制消息协议（`ICMP`）和互联网协议简单密钥管理（`SKIP`）。\n\n`ICMP` 是一种网络层协议，用于网络控制和诊断。常用的\
  \ ICMP 命令包括 `ping` 和 `traceroute`。\n\n`SKIP` 是一种网络层密钥管理协议，用于共享加密密钥。`SKIP` 的一个优点是在发送加密密钥或数据包之前不需要先建立通信会话。然而，由于额外报头信息的大小，`SKIP`\
  \ 是消耗带宽的。\n\n网络层的网络设备\n\n在第 3 层定义的网络网络设备是`路由器`和网关。\n\n*路由器*是用于连接不同网络的智能设备，使用逻辑或物理地址将数据包转发到目标网络（或沿网络路径）。路由器采用各种路由算法（例如\
  \ `RIP`、`OSPF` 和 `BGP`），根据带宽、成本、延迟和距离等不同变量确定通往目的地的最佳路径。\n\n\n\n\n\n`Gateways`（网关）通过在计算机（工作站或服务器）或路由器上的软件创建。网关通过检查整个第\
  \ 7 层数据包来连接不同的程序和协议，从而转换不兼容性。例如，网关可用于连接 IP 网络和 IPX 网络，或连接 Microsoft Exchange 邮件服务器和\
  \ Lotus Notes 服务器（邮件网关）。\n\n## 数据链路层（第 2 层）\n\n数据链路层确保消息跨物理网络链路传递到正确的设备。该层还定义了用于在各个设备之间发送接收数据的网络协议（例如以太网、USB\
  \ 和令牌环）。数据链路层将来自上层的消息格式化为帧进行传输，处理点对点的同步和错误控制，并可以执行链路加密。\n\nIEEE 802 标准和协议将数据链路进一步分为两个子层：逻辑链路控制（LLC）子层和介质访问控制（MAC）子层（参见图\
  \ 6-3）。\n\n![image](img/9781119505815-fg0603.png)\n\n图 6-3： LLC 和 MAC 子层。\n\n![remember](img/remember.png)\
  \ 数据链路层负责确保消息跨物理网络链路传递到正确的设备。\n\nLLC 子层运行于上方的网络层和下方的 MAC 子层之间。LLC 子层执行以下三个功能：\n\n\
  *   通过使用源服务接入点（SSAPs）和目的服务接入点（DSAPs）为 MAC 子层提供接口。\n*   管理向上传递到网络层或向下到物理层的帧的控制、排序和确认。\n\
  *   负责定时和流量控制。`Flow control`（流量控制）监控设备之间的数据流，以确保接收设备（其运行速度不一定与发送设备相同）不会被过载并丢弃数据包。\n\
  \n![remember](img/remember.png) 逻辑链路控制（LLC）和介质访问控制（MAC）是数据链路层的子层。\n\nMAC 子层运行于上方的\
  \ LLC 子层和下方的物理层之间。它主要负责成帧，并具有以下三个功能：\n\n*   **执行错误控制：** 错误控制使用循环冗余校验（CRC）。`CRC`\
  \ 是一种用于创建消息特征描述的简单数学计算或校验和。接收设备会重新计算 `CRC`。如果计算出的 `CRC` 与收到的 `CRC` 不匹配，则数据包被丢弃，并向发送它的设备发送重发请求。\n\
  *   **识别硬件设备（或 MAC）地址：** `MAC address`（也称为 `hardware address` 或 `physical address`）是一个\
  \ 48 位的地址，由制造商编码在每台设备上。前 24 位识别制造商或供应商。后 24 位唯一地标识设备。\n*   **控制介质访问：** 三种基本的介质访问类型为：\n\
  \n    *   **竞争接入型（Contention）：** 在以太网等基于竞争的网络中，各个设备必须争夺物理网络介质的控制权。这种网络非常适用于具有小突发流量特征的网络。以太网网络使用基于竞争的方法，称为`载波监听多路访问冲突检测`（CSMA/CD），其中所有站都监听物理网络介质上的流量。如果线路空闲，任何站都可以传输数据。然而，如果另一个站尝试同时传输数据，就会发生冲突，流量被丢弃，两个站都必须等待随机时间后才能尝试重传。另一种方法用于\
  \ Apple LocalTalk 和 Wi-Fi 网络，称为`载波监听多路访问冲突避免`（CSMA/CA）。\n    *   **令牌传递型（Token-passing）：**\
  \ 在令牌环和光纤分布式数据接口（FDDI）等令牌传递型网络中，各个设备必须等待一个名为`token`（令牌）的特殊帧才能在物理网络介质上传输数据。这种网络被认为是`确定`（传输延迟可以可靠地计算，且不会发生冲突），非常适用于具有延迟敏感的大型高带宽消耗应用程序的网络。令牌环、FDDI\
  \ 和 ARCnet 网络都使用各种令牌传递方法进行介质访问控制。\n    *   **轮询型（Polling）：** 在轮询网络中，主主机会轮询各个设备（从主机）以查看它们是否有数据要发送。在获得主机的许可之前，从主机无法传输数据。轮询通常用于大型机环境和无线网络。\n\
  \n### 局域网协议和传输方法\n\n常见的局域网协议定义在数据链路层（以及物理层）。它们包括以下内容：\n\n*   **以太网（Ethernet）：**\
  \ 以太网协议通过 CSMA/CD（在前节讨论过）将数据传输到物理局域网介质。它是为具有偶发性、有时大量的流量需求的网络设计的。以太网是目前最常用的局域网协议——大多数情况下使用双绞电缆实现（在“电缆和连接器类型”章节中讨论）。以太网运行速度高达\
  \ 10 Mbps，快速以太网运行速度高达 100 Mbps（通过 Cat 5 双绞或光纤电缆），千兆以太网运行速度高达 40 Gbps（通过 Cat 5e、Cat\
  \ 6 或 Cat 7 双绞或光纤电缆）。\n*   **ARCnet：** ARCnet 协议是最早开发的局域网技术之一。它通过在前节讨论的令牌传递访问方法将数据传输到物理局域网介质。它使用同轴电缆实现星型拓扑。ARCnet\
  \ 提供缓慢但可预测的网络性能。\n*   **令牌环（Token Ring）：** 令牌环协议通过在前节讨论的令牌传递介质访问方法将数据传输到物理局域网介质。在令牌环网络中，所有节点连接到站点访问单元（MAU），形成逻辑环（物理星型）拓扑。令牌环网络上的一个节点被指定为`活动监视器`，并确保网络上同时只有一个令牌（变体允许网络上存在多个令牌）。如果令牌丢失，活动监视器负责确保生成替换令牌。令牌环运行速度为\
  \ 4 和 16 Mbps ——按今天的标准来说相当慢。令牌环网络并不常见。\n*   **光纤分布式数据接口（FDDI）：** FDDI 协议通过在前节讨论的令牌传递介质访问方法将数据传输到物理局域网介质。它通过光纤电缆实现为双向旋转环，速度高达\
  \ 100 Mbps。FDDI 网络上的所有站都连接到两个环。在正常运行期间，只有一个环是激活的。发生网络中断或故障时，环会通过最近的节点折回到第二个环。\n\
  *   **地址解析协议（ARP）：** ARP 将网络层 IP 地址映射到 MAC 地址。ARP 通过在网络段上广播 ARP 查询消息来发现连接设备的物理地址。然后，IP\
  \ 地址到 MAC 地址的转换关系被维护在系统缓存的动态表中。\n*   **反向地址解析协议（RARP）：** RARP 将 MAC 地址映射到 IP 地址。当系统（如无盘机）需要发现其\
  \ IP 地址时，该过程是必要的。系统广播一个 RARP 消息，提供系统的 MAC 地址并请求告知其 IP 地址。RARP 服务器回复请求的信息。\n\n\n\n\
  \n\n![remember](img/remember.png)  `ARP` 和 `RARP` 都是第二层协议。`ARP` 将 IP 地址映射到 `MAC`\
  \ 地址，用于在仅已知 IP 地址时识别设备的硬件地址。`RARP` 将 `MAC` 地址映射到 IP 地址，用于在仅已知 MAC 地址时识别设备的 IP 地址。\n\
  \n局域网（LAN）数据传输分类为：\n\n-   **单播（Unicast）：** 数据包通过特定的目的 IP 地址从源发送到单个目的设备。\n-   **多播（Multicast）：**\
  \ 数据包通过特殊的多播 IP 地址从源复制并发送到多个目的设备，这些目的站站已经过特定配置以使用该地址。\n-   **广播（Broadcast）：** 数据包通过广播\
  \ IP 地址从源复制并发送到目标网络上的每一个设备。\n\n![remember](img/remember.png) 局域网数据传输分类为单播、多播或广播。\n\
  \n### WLAN 技术与协议\n\nWLAN（无线局域网）技术通常被称为 Wi-Fi，工作在 OSI 参考模型的较低层。WLAN 协议定义了帧如何在空气中传输。有关最常见\
  \ IEEE 802.11 WLAN 标准的描述，请参见表 6-6。\n\n| **类型** | **速度** | **描述** |\n| --- | ---\
  \ | --- |\n| 802.11a | 54 Mbps | 在 5 GHz 下运行（干扰比 2.4 GHz 小） |\n| 802.11b | 11 Mbps\
  \ | 在 2.4 GHz 下运行（第一个广泛使用的协议） |\n| 802.11g | 54 Mbps | 在 2.4 GHz 下运行（与 802.11b 向后兼容）\
  \ |\n| 802.11n | 600 Mbps | 在 5 GHz 或 2.4 GHz 下运行 |\n| 802.11ac | 1 Gbps | 在 5 GHz\
  \ 下运行 |\n\n表 6-6 无线局域网标准\n\nWLAN 网络最初使用 `WEP`（等效加密）协议加密，但很快被证明是不够的。新的加密标准包括 `WPA`（Wi-Fi\
  \ 保护）和 `WPA2`。使用 `TKIP`（临时密钥完整性协议）的 `WPA` 也被认为是不够；应该使用 `AES`（高级加密标准）。我们的朋友 Barry\
  \ Lewis 和 Peter T. Davis 编写的《无线网络傻办法》（*Wireless Networks For Dummies*）是获取更多无线网络信息的绝佳书籍。\n\
  \n### WAN 技术与协议\n\nWAN 技术工作在 OSI 参考模型的底层三层（物理层、数据链路层和网络层），主要工作在数据链路层。WAN 协议定义了帧如何跨越两个设备之间的单一数据链路进行传输。这些协议包括：\n\
  \n-   **点对点链路（Point-to-point links）：** 这些链路从客户网络跨越运营商网络（如公共交换电话网 [PSTN]）到远程网络提供单一的、预先建立的\
  \ WAN 通信路径。这些点对点链路包括：\n    -   **二层转发协议（L2F）：** 由思科开发的一种隧道（数据封装）协议，用于实现 VPN，特别是点对点协议（`PPP`，在本节稍后将讨论）流量。`L2F`\
  \ 提供封装但不提供加密或机密性。\n    -   **二层隧道协议（L2TP）：** 一种实现 VPN 的隧道协议。`L2TP` 源自 `L2F`（前述项）和\
  \ `PPTP`（本列表所述），并使用 `UDP` 端口 `1701`（参见本章前面的“网络层（第 3 层）c06.xhtml_c06-sec-0010)”部分）创建隧道会话。`L2TP`\
  \ 通常与加密协议（如 `IPsec`）一起实现，因为它本身不加密流量或提供机密性。我们将在本章稍后的“[远程访问”部分中详细讨论 `L2TP` 和 `IPsec`。\n\
  \    -   **点对点协议（PPP）：** `SLIP`（见本节稍后的讨论）的继任者，`PPP` 在同步和异步路上提供路由器到路由器以及主机到网络的连接。它比\
  \ `SLIP` 更健壮，并提供了额外的内置安全机制。在现代网络环境中，`PPP` 比 `SLIP` 普通得多。\n    -   **点对点隧道协议（PPTP）：**\
  \ 一种微软开发的用于实现 VPN（特别是 `PPP` 流量）的隧道协议。`PPTP` 不提供加密或机密性，而是依赖其他协议（如 `PAP`、`CHAP` 和\
  \ `EAP`）来确保安全。我们将在本章稍后的“远程访问”部分详细讨论 `PPTP`、`PAP`、`CHAP` 和 `EAP`。\n    -   **串线路\
  \ IP（SLIP）：** 点对点协议（`PPP`）的前身，`SLIP` 最初是为了支持 Berkeley UNIX 计算机通过低速异步串行链路（如拨号调制解调器）进行\
  \ `TCP/IP` 网络。现在很少见到 `SLIP`，除了计算机博物馆中外。\n\n-   **电路交换网络（Circuit-switched networks）：**\
  \ 在电路交换网络中，对于每个通信会话（即*通话*），在发送者和接收者之间跨越运营商网络建立、维护并终止一条专用物理电路路径。这种网络类型广泛应用于电话网络，功能类似于普通的电话通话。示例包括：\n\
  \    -   **数字用户线路（xDSL）：** `xDSL` 使用现有的模拟电话线为远程客户提供高带宽连接。表 6-7 电路交换网络理想地适用于具有持续流量的*始终在线*连接。\n\
  \n-   **分组交换网络（Packet-switched networks）：** 在分组交换网络中，设备通过（使用统计复用）共享通信链路上的带宽，以便跨越运营商网络在发送者和接收者之间传输数据包。这种网络比电路交换网络对错误和拥塞更具韧性。我们在表\
  \ 6-9 中比较了分组交换网络和电路交换网络。\n\n    分组交换网络的示例包括：\n    -   **异步传输模式（ATM）：** 一种极高速、低延迟的技术，使用交换和复用技术来快速中继包含语音、视频或数据的固定长度（53\
  \ 字节）单元。单元处理在硬件中进行，从而减少了传输延迟。`ATM` 非常适合携带突发性（不均匀）流量的光纤网络。\n\n\n\n\n\n- **帧中继 (Frame\
  \ Relay)**：一种分组交换标准协议，通过在连接的设备之间使用`高层数据链路控制`（`HDLC`）封装（我们将在本节稍后部分进行讨论）来处理多个虚拟电路。帧中继利用简化的帧结构方法，该方法没有纠错机制，并利用`数据链路连接标识符`（`DLCIs`）在广域网（WAN）上实现高速传输。帧中继可用于交换虚拟电路（`SVCs`）或永久性虚拟电路（`PVCs`）。`SVC`\
  \ 是一种临时连接，它在电路建立阶段动态创建以传输数据（发生在数据传输阶段），然后被断开连接（发生在电路终止阶段）。PVC 是永久建立的连接。由于连接是永久的，因此\
  \ `PVC` 不需要与电路建立和终止相关的带宽开销。然而，`PVCs` 通常比 `SVCs` 贵。\n\n- **多协议标签交换 (MPLS)**：一种分组交换、高速、高可扩展性且多功能的技术，用于创建全网状连接的虚拟专用网络（VPN）。它可以承载\
  \ IP 数据包，还可以承载 ATM、`SONET`（同步光网络）或以太网帧。MPLS 在第 2 层和第 3 层均有定义。`MPLS` 网络中的标签边缘路由器（`LERs`）对数据包（或帧）推入或封装\
  \ `MPLS` 标签。该标签信息用于以极快的速度通过 `MPLS` 云交换有效负载。`MPLS` 云内部的标签交换路由器（`LSRs`）仅根据标签信息做出路由决策，而不实际检查有效负载。在出口点处，`LER`\
  \ 在数据包离开 `MPLS` 网络时“弹出”（pop/解封装）数据包，移除 `MPLS` 标签。`MPLS` 网络的一个缺点是客户失去了对云内部的可见性。或者，如果你是一个乐观主义者，`MPLS`\
  \ 网络的一个优势是攻击者失去了对云内部的可见性。\n\n- **同步光网络 (SONET) 和同步数字分层传输 (SDH)**：一种用于光纤网络的高可用性、高速、多路用、低延迟技术。`SONET`\
  \ 最初为公共电话网络设计，在美国和加拿大广泛使用，特别是在能源行业。`SDH` 在 `SONET` 之后开发，并在世界其他地区使用。`SONET` 和 `SDH`\
  \ 的速率在 `OC`（光载波）级定义（参见表 6-10）。\n\n- **交换多兆比特数据服务 (SMDS)**：一种在公共交换网络上提供的高速、分组交换、无连接面向、基于数据报的技术。通常，与其他远程网络交换大量突发数据的公司会使用\
  \ `SMDS`。\n\n- **X.25**：作为第一个分组交换网络，`X.25` 是国际电信联盟——电信（`ITU-T`）标准，定义了数据终端设备（`DTE`）与数据传输设备（`DCE`）之间点对连接的建立和维护方式。`X.25`\
  \ 在数据链路层指定了平衡链路访问协议（`LAPB`），并在网络层指定了数据包级协议（`PLP`；也称为 `X.25 第 3 层`）。`X.25` 在美国境外更为常见，但已很大程度上被\
  \ `MPLS` 和帧中继所取代。\n\n![remember](img/remember.png) 分组交换网络非常适合用于具有突发性流量的按需连接。\n\n\
  ### 其他 WAN 协议\n在数据链路层定义的另外两个重要 WAN 协议包括：\n\n- **高层数据链路控制 (HDLC)**：一种位面向的同步协议，由 `ISO`\
  \ 创建以支持点对点和多点配置。它派生自 `SDLC`，为同步串行链路指定了数据封装方法，并是思科路由器上串行链路的默认设置。遗憾的是，不同厂商对 `HDLC`\
  \ 协议的各种实现之间是不兼容的。\n\n- **同步数据链路控制 (SDLC)**：一种位面向的全双工串行协议，由 `IBM` 开发，用于促进主机与远程办公室之间的通信。它定义并实现了一种介质访问的轮询方法，其中“主站”（前端）轮询“从站”（远程站）以确定是否需要通信。\n\
  \n| 类型 | 特性 | 描述 |\n| :--- | :--- | :--- |\n| ADSL 和 ADSL2 | 下行速率：2 Mbps 上行速率：0.5\
  \ Mbps | 非对称数字用户线路；设计为下行多于上行 |\n| SDSL | 下行速率：1.544 Mbps 上行速率：1.544 Mbps | 对称数字用户线路；设计为等带宽\
  \ |\n| HDSL | 下行速率：1.544 Mbps 上行速率：1.544 Mbps | 高速数字用户线路；设计在单对双绞线上上提供高带宽 |\n| VDSL\
  \ | | 极高速数字用户线路；在双双绞线上提供高带宽 |\n| VDSL | 下行速率：52 Mbps | 极高速数字用户线路；在单对双绞线上提供带宽 |\n\
