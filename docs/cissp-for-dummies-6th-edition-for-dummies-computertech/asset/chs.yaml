- "# CISSP 入学者指南，第 6 版\n\n\n\n![](img/cover.jpg)\n\n![cover.eps](img/cover.jpg)\n\n\
  \n\n\n\n### 如需查看本书的快速上手表，请访问 [www.dummies.com](http://www.dummies.com)get 搜索框中搜索“CISSP\
  \ For Dummies Cheat Sheet”。\n\n\n\n\n\n\n![remember](img/remember.png) 要成功通过 CISSP\
  \ 考试，你需要了解自己最有效的学习风格。对某些人来说，“训练营”是最好的，而另一些人则在较长时间内学习得更好。此外，有些人能从小组讨论中获得更多价值，而另一些人则适合独自阅读。*了解你自己*，并使用最适合你的方法。\n\
  \n## 你准备好参加考试了吗？\n\n你准备好迎接那个大日子了吗？我们无法为你回答这个问题。你必须根据个人的学习因素、学习习惯和专业经验，决定何时准备好参加考试。遗憾的是，没有什么魔法公式可以决定你\
  \ CISSP 考试的成功或失败概率。\n\n通常情况下，我们建议至少进行两个月的专注学习。阅读这本书，并继续在 Dummies 网站上进行模拟考试，直到你在所有领域都能稳定地获得\
  \ 80% 或以上的分数。`CISSP For Dummies`涵盖了你想通过 CISSP 考试所需了解的`所有`信息。阅读这本书（并反复阅读），直到你对书中呈现的信息了如指，并能够在八个领域中的每一个领域成功回忆并应用它们。继续复习其他学习材料（特别是你薄弱的领域），积极参与在线或本地学习小组，并从尽可能不同的来源参加尽可能多的模拟考试。\n\
  \n然后，当你觉得已经准备好迎接那个大日子时，找一个浪漫的地方，单膝——等等，搞错大日子了！找一个安全的 Wi-Fi 热点（或其他网络连接），坐下，报名考试！\n\
  \n### 报名考试\n\nCISSP 考试通过全球当地 Pearson VUE 测试中心以计算机自适应测试 (CAT) 进行。如需报名考试，请访问 (ISC)²\
  \ 网站（[`www.isc2.org/Register-For-Exam`](http://www.isc2.org/Register-For-Exam)）并点击“Register”（注册）链接，或直接访问\
  \ Pearson VUE 网站（[`www.pearsonvue.com/isc2`](http://www.pearsonvue.com/isc2)）。\n\
  \n在 Pearson VUE 网站上，你首先需要创建一个；然后就可以报名 CISSP 考试、安排考试时间并支付考试费用。你还可以找到附近的测试中心，参加 Pearson\
  \ VUE 测试教程，练习参加考试（如果你从未参加过 CBT，绝对应该这样做），然后下载并阅读 (ISC)² 保密协议 (`NDA`）。\n\n![tip](img/tip.png)\
  \ 在报名考试时下载并阅读 (ISC)² `NDA`。诚然，这些是无聊的法律术语，但对于 CISSP 来说，被要求阅读合同、许可协议和其他“无聊的法律术语”作为其信息安全责任的一部分，这并不稀奇——所以习惯它吧（同时也习惯在不实际阅读的情况下不签署法律文件）！考试开始时，你有五分钟时间阅读并接受协议，但为什么不提前阅读\
  \ `NDA` 呢，这样你就可以避免考试日的压力和分心，直接接受协议即可。如果你在指定的五分钟内不接受 `NDA`，考试将结束且没收考试费！\n\n报名时，你需要量化相关工作经验，回答几个有关犯罪记录和其他可能导致取消资格背景信息的问题，并同意遵守\
  \ (ISC)² 道德守则。\n\n目前美国的考试费用为 699 美元。你可以在计划考试前至少 24 小时通过电话联系 Pearson VUE，或至少提前 48\
  \ 小时通过在线取消或重新安排考试。重新安排的费用为 50 美元。取消考试预约的费用为 100 美元。\n\n![warning](img/warning.png)\
  \ 如果你未参加考试或迟到预约时间超过 15 分钟，你将没收全部考试费！\n\n![tip](img/tip.png) 好消息！如果你是美国退伍军人并符合 Montgomery\
  \ GI Bill 或 Post-9/11 GI Bill 福利，退伍军人事务部 (`VA`) 将报销全部考试费用，无论通过与否。在某些情况下，(ISC)² 官方培训提供商也接受\
  \ GI Bill 进行线下认证培训。\n\n### 关于 CISSP 考试\n\nCISSP 考试本身是一场耗时三小时、100 到 150 道题的马拉松。为了让你有直观感受，三小时内，你可以跑一场真正的（迷你）马拉松，看《风云一切》、《教父\
  \ II》、《泰坦尼克号》或《环王》系列电影之一，或者在《吉他英雄》中玩 45 次“Slow Ride”。这些成就分别非常接近 CISSP 考试在体力、精神（而非智力）和情感上的消耗。\n\
  \nCISSP 考试现在是自适应考试，这意味着测试会根据你在考试中的表现而变化。考试开始时相对简单，随着你回答正确问题，难度会逐渐增加。没错；你在考试中表现得越好，题目就越难——但这并不是坏事！把它想象成因为你比平均水平的熊聪明而跳级上。CISSP\
  \ 考试假设，如果你能回答关于某个主题更难的问题，那么逻辑上讲，你就能回答关于该主题更简单的问题，那么为什么要浪费时间呢？\n\n你必须至少回答 100 道题。回答完最少数量的问题后，测试引擎根据\
  \ 95% 的置信度判断你统计学上可能通过或失败从而结束考试，或者继续提问最多 150 道题，直到达到 95% 的置信水平。如果你回答了所有 150 道题，测试引擎将判断你是通过还是不及。如果你用完时间（超过三小时限制）但回答了最少数量的问题（100\
  \ 道），测试引擎将根据你的答案判断是否通过。\n\n只有 75% 的题目实际上会计入你的最终结果。另外 25% 是未来 CISSP 考试版本的试题（有点就像是考试的“哑铃”——为小白准备的）。然而，考试不会指出哪些问题是真题，哪些是试题，因此你必须诚实、公正并尽尽所能地回答所有问题！\n\
  \nCISSP 考试有三种类型的题目：\n\n*   **单选题。** 从四个选项中选择`最佳`答案。例如：\n\n    以下哪项是 FTP 控制通道？\n\n\
  \    **A** `TCP` 端口 21\n\n    **B** `UDP` 端口 21\n\n    **C** `TCP` 端口 25\n\n   \
  \ **D** `IP` 端口 21\n\n    FTP 控制通道是端口 21，但它是 `TCP`、`UDP` 还是 `IP`？\n\n*   **拖放。**\
  \ 从屏幕左侧的候选列表中将正确答案（或答案）拖到右侧的正确答案框中。例如：\n\n    以下哪些是消息认证算法？将正确答案从左侧拖到右侧。\n\n![image](img/9781119505815-un0101.png)\n\
  \n    `MD5`、`SHA-2` 和 `HMAC` 都是正确的。你必须将所有三个答案拖到右侧的框中，答案才正确。\n\n*   **热点题。** 选择图中最符合问题的对象。例如：\n\
  \n    以下哪幅图描绘了关系数据库模型？\n\n    ![image](img/9781119505815-un0102.png)\n\n    点击上方四个面板之一来选择你的答案。\n\
  \n\n\n\n正如 `(ISC)²` 所描述，你需要获得 700 分（满分 1000 分）或以上的比例分才能通过考试。三种题型的权重相同，但并非所有问题的权重都相同。较难的问题比简单的题目权重更高，因此无法知道及格需要多少个正确答案。但等一下，更好的还在后面！在自适应考试中，当你完成\
  \ CISSP 考试时，将不再获得分数——你只会得到通过或不及的结果。把这比作一场没有比分牌的篮球赛——一场在裁判举起胜者手臂之前不知道结果的拳击赛。\n\n\
  ![tip](img/tip.png) CISSP 考试中的所有问题都要求你从给出的选项中选择最佳答案（或答案）。正确答案并不总是一个直观、清晰的选择。`(ISC)²\
  \ 费很大精力确保你真的、真正地掌握了这些材料。\n\n![tip](img/tip.png) 多选题的一种常见有效的答题策略是仔细阅读每道题，然后排除掉任何明显的错误选项。CISSP\
  \ 考试也不例外。\n\n![warning](img/warning.png) CISSP 考试中的错误选项并不一定显而易见。你可能会发现几个明显的错误选项，但它们对于那些为考试做了充分准备的人来说才会脱颖而出。\n\
  \nPearson VUE 计算机自适应、三小时、100 到 150 题版本的 CISSP 考试目前仅提供英文版。如果你倾向于用中文（简体，指语言而非考试）、法语、德语、日语、韩语、葡萄牙语或西班牙语参加\
  \ CISSP 考试，因为那是你的母语（或者你不会说那种语言但真的想挑战自己），那么你必须参加基于形式的、六小时、250 题版本的 CISSP 考试（我们许多人所谓的“老派”考试）。如果需要，你允许携带外语字典（非电子且非技术类）参加考试。对于视障人士也提供测试选项。你需要在注册考试时注明你的偏好。\n\
  \n### 考试后\n\n在大多数情况下，你在完成考试后会会在测试中心获得非正式测试结果，随后会收到来自 `(ISC)²` 的正式电子邮件。\n\n![warning](img/warning.png)\
  \ 在极少数情况下，你的非正式结果可能无法立即获得。`(ISC)² 在每个测试周期期间分析分数数据；如果他们在测试周期早期没有获得足够的测试结果，你的结果可能会延迟长达八周。\n\
  \n如果由于某种原因你没有通过 CISSP 考试——例如，你只读了这本《CISSP ummies》中的这一章——你必须等待 30 天才能再次尝试。如果发生这种情况，我们强烈建议你在那\
  \ 30 天内阅读这本书的其他部分！如果你失败了第二次，你必须等待 90 天才能再次尝试。如果发生这种情况，我们最强烈地建议并敦促你在那 90 天内阅读这本书的其他部分——也许读几次！最后，如果你在第三尝试中失败，你必须等待\
  \ 180 天——没有任何借口了，如果发生这种情况，你绝对需要阅读、重读、记忆、理解、背诵、吸收并反复背这本书好几次！\n\n在获得 CISSP 认证后，你必须保持良好的\
  \ `(ISC)²` 成员身份，并每三年更新一次认证。你可以通过积累 120 个持续专业教育（CPE）学分或通过重新参加 CISSP 考试来更新 CISSP 认证。在三年的重新认证周期内，你每年必须获得至少\
  \ 40 个 CPE 学分。你可以通过各种活动获得 CPE 学分，包括参加教育课程或座讨会和安全会议、加入协会分会并参加会议、观看供应商演示、完成大学课程、提供安全培训、出版安全文章或书籍、担任相关行业委员会成员、参与自学以及从事相关的志愿者工作。你必须在安全的\
  \ `(ISC)²` 网站上记录你的年度 CPE 活动以获得相应学分。你还需要支付 85 美元的年度维护费，支付给 `(ISC)²`。维护费是按年度后付的，你可以在线支付，也可以在\
  \ `(ISC)²` 网站的安全的成员区域支付。\n\n![warning](img/warning.png) 确保你在提交 CPE 报告时绝对诚实，并保留培训证据。`(ISC)²`\
  \ 会审核部分 CPE 提交情况。\n\n![tip](img/tip.png) 一旦收到认证，请立即在 `(ISC)²` 网站上注册并提供你的联系信息。(ISC)²)²\
  \ 会提醒你年度维护费、董事会选举、年度会议和活动，但前提是你维护了联系信息——特别是你的电子邮件地址。\n\n## 第 2 章\n\n### 充分利用你的认证\n\
  \n[本章内容]\n\n- ![check](img/check.png) 保持 (ISC)² 成员身份活跃\n- ![check](img/check.png)\
  \ 发现回馈的快乐\n- ![check](img/check.png) 在当地安全社区中与他人合作\n- ![check](img/check.png) 推广\
  \ CISSP 认证的理念\n- ![check](img/check.png) 为你的组织带来改变\n- ![check](img/check.png) 通过其他认证促进职业\n\
  - ![check](img/check.png) 寻找导师并成为导师\n- ![check](img/check.png) 实现安全卓越\n\n尽管这本书致力于帮助你获得\
  \ CISSP 认证，但我们认为在你获得 CISSP 认证后，包含一些你可能考虑做的事情是一个好主意。\n\n那么，在获得 CISSP 后你可以做什么呢？你有很多事情可以增强你的职业生涯和全球社区。这里只是一些想法！\n\
  \n### 与其他安全专业人士建立人脉\n\n除非你在大型机构工作，否则你的机构可能没有许多信息安全（infosec）专业人员。事实上，你可能是唯一的！是的，有时会感到孤独，所以我们建议你寻找方法与你所在及其他地区的安全专业人士联系。本章描述的许多活动都提供了人脉机会。如果你以前不是一个社交达人，而且你的专业网络相当有限，请准备好通过与其他志同道合的安全专业人士相识，并可能建立终身友谊，将你的职业生涯推向一个全新的高度。记住：你所掌握的知识也很重要！\n\
  \n如果你刚开始你的信息安全职业（无论你的年龄或其他职业经验如何），你可能会遇到其他信息安全专业人士，他们自己在职业生涯的某个时刻曾处于你现在的境地，他们会乐意帮助你找到那些可能困扰你的、难以捉摸的问题和挑战的答案和解决方案。你可能会发现自己自己出的多比出的少，但请确保至少对他们的帮助表示你的感谢和感激——并记住在职业生涯后期，当新进入信息安全领域的人向你请教一些有益的见解时，要回馈。\n\
  \n所以，当你外出寻找其他信息安全专业人士时，请带上微笑并带上大量的名片（如果雇主不提供，就自己打印）。你一定会会结识新朋友，并在安全领域体验可能让你令喜的成长。\n\
  \n### 活跃的 (ISC)² 成员\n\n成为一个活跃的 (ISC)² 成员很容易！除了志愿者服务（见下节），你还可以参加其他几项活动，包括：\n\n\n\n\
  \n\n- **参加 (ISC)² 大会。** 多年来，(ISC)² 一直依附于 ASIS（原美国工业安全协会——我们将此归咎于肯德基，因为他们变成了“KFC”，并引发了企业和组织放弃缩写词原始含义的潮流！），并占据着\
  \ ASIS 年会的一角。然而，在 2016 年，(ISC)² 决定是时候自立门户并举办自己的会议了。2017 年，我们的其中一位作者（名字首字母为 *P*）参加了首届\
  \ (ISC)² 大会并在会上发表了演讲，并发现这是一场顶级盛事，完全不亚于其他优秀的国家级和全球性会议。你可以在 [`http://congress.isc2.org`](http://congress.isc2.org)\
  \ 了解下一次 (ISC)² 大会的信息。\n\n- **参加 (ISC)² 选举。** 每年，(ISC)² 理会选举三分之一的成员，任期为三年。作为一名状态良好的\
  \ CISSP，你已经赢得了在 (ISC)² 选举中投票的权利。行使你的权利吧！这其中最棒的部分是熟悉其他竞选董事会职位的 CISSP。你可以阅读他们的传记，并了解他们如果当选后的议程。通过你的投票，你正在尽一份力，确保\
  \ (ISC)² 的未来掌握在能够提供胜任领导力和远见的董事手中。\n\n- **参加 (ISC)² 活动。** (ISC)² 每年举办多项活动，从社交招待会到会议和教育活动一应俱全。(ISC)²\
  \ 经常在 RSA 和 BlackHat 等大型行业会议上举行聚会。定期查看 (ISC)² 网站，以获取更多关于你所在地区的活动。\n\n- **加入 (ISC)²\
  \ 分会。** (ISC)² 在世界各地都设有分会。你可以在 [`www.isc2.org/chapters`](http://www.isc2.org/chapters)\
  \ 了解更多信息。你有许多机会参与当地分会，包括担任分会领导层、参加分会活动以及参与社区外展项目。分会活动也是结识其他安全专业人士的绝佳机会。\n\n![tip](img/tip.png)\
  \ (ISC)² 拥有你正确的联系信息非常重要。一旦成为 CISSP（甚至在此之前），请确保你的个人资料是准确且完整的，这样你就能收到这些及其他活动的通知。\n\
  \n### 考虑 (ISC)² 志愿者机会\n\n(ISC)² 不仅仅是一个认证机构：它是一项*事业*，你甚至可以说它是一场*运动*。它是安全专业人士的*存在的意义*，即我们存在的理由——至少在专业领域是如此。作为我们的一员，请考虑为这项事业贡献力量。\n\
  \n志愿者们成就了今天的 (ISC)²，并且他们对你的认证做出了重要贡献。你不能袖手旁观看着别人工作。利用你的才华帮助那些走在你后面的人。你可以通过许多方式提供帮助。有关志愿者信息，请参阅\
  \ (ISC)² 网站（[`www.isc2.org`](http://www.isc2.org)）。\n\n![tip](img/tip.png) 大多数经批准的\
  \ (ISC)² 志愿者活动均可获得 CPE 学分。详情请咨询 (ISC)²。\n\n### 编写认证考试题\n\nCISSP 通用知识体系（CBK）中的技术状态、法律和实践正在不断发生变化和进步。为了保持有效性和相关性，CISSP\
  \ 考试需要新鲜、新的考试题，以反映当今的安全工作方式。因此，行业内的人士——如你——需要编写新题。如果你对成为出题人感兴趣，请访问 (ISC)² 网站并申请。\n\
  \n### 在活动中演讲\n\n(ISC)² 现在在全球举办的安全性相关活动比其历史上的任何时候都多。大多数情况下，(ISC)² 的演讲者是当地志愿者——他们是各自领域的专家，希望与他人分享他们所知和所学的知识。如果你在某个领域专长或对\
  \ CISSP 相关问题有独特见解，请考虑通过演讲来教育他人。更多信息请访问 (ISC)² 网站。\n\n![tip](img/tip.png) 如果你在 (ISC)²\
  \ 大会上进行演讲，你的会议费用将免除。你只需要支付交通、住宿和餐饮费用。\n\n### 为 (ISC)² 会议提供帮助\n\n(ISC)² 主办名为 (ISC)²\
  \ 大会的精彩年度会议。这次会议是学习新课题和结识其他安全专业人士的绝佳机会。但会议并不是自动运行——它是由志愿者驱动的！前往 (ISC)² 大会网站（[`http://congress.isc2.org`](http://congress.isc2.org)）查找志愿者信息。\n\
  \n### 阅读并为 (ISC)² 出版物贡献力量\n\n(ISC)² 每季度出版一份名为 *INSIGHTS* 的在线杂志，与 *InfoSecurity Professional*\
  \ 关联。你可以在 [`www.isc2.org/News-and-Events/Infosecurity-Professional-Insights`](http://www.isc2.org/News-and-Events/Infosecurity-Professional-Insights)\
  \ 了解更多信息。\n\n*(ISC)² Blog* 是面向所有 (ISC)² 成员的免费在线出版。你可以在 [`http://blog.isc2.org`](http://blog.isc2.org)\
  \ 找到博客以及关于写文章的信息。\n\n《Information Security Journal》是一本每双月出版的付费出版物。你可以在期刊的信息页面（[`www.isc2.org/Member-Resources/Journal`](http://www.isc2.org/Member-Resources/Journal)）找到有关订阅和写文章的信息。目前年度订阅费为\
  \ 45 美元。\n\n### 支持 (ISC)² 网络安全中心\n\n(ISC)² 网络安全中心（原名 (ISC)² 基金）是 (ISC)² 在 2011 年成立的非利慈善机构。它是安全人士接触社会并让学生、教师和普通公众通过网络安全教育保护其在线生活的渠道。中心的三个核心计划包括\
  \ Safe and Online、信息安全学金计划以及行业研究。更多信息请访问 [`www.cybersafe.org`](http://www.cybersafe.org)。\n\
  \n### 参与 (ISC)² 焦点小组\n\n(ISC)² 开发了焦点小组和质量保证 (QA) 测试机会。(ISC)² 正在开发新服务，需要在项目的需求和设计阶段接收早期反馈。通过参与这些小组和测试，你可以影响未来的\
  \ (ISC)² 服务。\n\n### 加入 (ISC)² 社区\n\n(ISC)² 开发了一个全新的互动社区，里面充满了讨论组。在第一年就有 16,000 多名成员，该社区设计良好且易于使用。你可以在\
  \ [`http://community.isc2.org`](http://community.isc2.org) 注册并加入。\n\n### 加入 CISSP\
  \ 学习小组\n\n许多社区都有 CISSP 学习小组，由志愿者导师和教师组成，帮助想要获得认证的人。\n\n如果你的社区没有 CISSP 学习小组，请考虑启动一个。许多社区已经有了，那里的组织者可以就如何创建一个小组提供建议。你可以在附近的\
  \ (ISC)² 分会和其他当地安全小组获取更多信息。\n\n### 帮助他人了解更多数据安全\n\n当我们说我们（本书的作者和你们这些读者）在数据安全和安全上网方面的知识可能超过了\
  \ 99% 的人口时，绝不是在虚荣或傲慢。有两个主要原因：\n\n- 安全是我们的职业\n- 安全并不总是容易做\n\n有很多志愿者机会可以帮助他人维护他们的计算机（以及移动计算设备）安全并安全地使用互联网。这里是一些你可以提供帮助的简短列表：\n\
  \n- 服务俱乐部\n- 老年中心\n\n\n\n\n\n*   学校（请务必在本章前面的部分阅读“安全与安全的在线”的内容）\n*   校友协会和团体\n*\
  \   你的工作单位\n\n只要发挥一点想象，你完全可以发现额外的机会。世界渴望着你所拥的信息！\n\n### 成为你当地安全分会的活跃成员\n\n除了 (ISC)²\
  \ 之外，全球许多安全组织都有当地分会，也许就在你的社区内或附近。以下是一些你可能感兴趣的组织简列表：\n\n*   **国际系统安全协会 (ISSA):**\
  \ [`www.issa.org`](http://www.issa.org)\n*   **ISACA（原信息系统审计控制协会）：** [`www.isaca.org`](http://www.isaca.org)\n\
  *   **信息管理协会 (SIM):** [`www.simnet.org`](http://www.simnet.org)\n*   **InfraGard:**\
  \ [`www.infragard.net`](http://www.infragard.net)\n*   **开放 Web 应用安全项目 (OWASP):**\
  \ [`www.owasp.org`](http://www.owasp.org)\n*   **ASIS 国际:** [`www.asisonline.org`](http://www.asisonline.org)\n\
  *   **高科技犯罪调查协会 (HTCIA):** [`www.htcia.org`](http://www.htcia.org)\n*   **风险与保险管理协会\
  \ (RIMS):** [`www.rims.org`](http://www.rims.org)\n*   **信息风险分析师协会 (SIRA):** [`www.societyinforisk.org`](http://www.societyinforisk.org)\n\
  *   **内部审计师协会 (IIA):** [`www.theiia.org`](http://www.theiia.org)\n*   **国际隐私人士协会\
  \ (IAPP):** [`www.iapp.org`](http://www.iapp.org)\n*   **国际灾难恢复协会 (DRII):** [`www.drii.org`](http://www.drii.org)\n\
  *   **计算机技术调查员网络 (CTIN):** [`www.ctin.org`](http://www.ctin.org)\n\n当地安全小组提供了极佳的机会，让你与其他与其他组织的同行建立联系，并更多地了解你的职业。许多人发现，在参与当地安全组织期间建立的人脉，在寻找新职业机会时可能特别有价值。\n\
  \n除了我们在前面的列表中列出的组织，你完全可以找到许多多许多拥有当地分会的安全组织。向你的同事和其他人询问你社区的安全组织和俱乐部。\n\n### 传播 CISSP\
  \ 认证的良好口碑\n\n尽管 CISSP 认证广为人知，但仍有人人不知道它。而且许多听过它的人并不理解它的具体含义。向人们介绍你的 CISSP 认证，并向你的同行解释认证过程。以下是可以与你遇到的的每个人分享的事实：\n\
  \n*   CISSP 是*顶尖的*信息安全专业人士认证。\n*   全球有超过 112,000 名安全专业人士持有 CISSP 认证。\n*   CISSP\
  \ 认证始于 1994 年。\n*   CISSP 是首个获得 ANSI（美国国家标准协会）根据 ISO（国际标准化组织）标准 17024 认证的证书。\n*\
  \   管理 CISSP 认证的机构还为专攻信息安全各个领域的专业人士提供其他认证。该机构还通过教育计划和活动提升信息安全意识。\n\n推广你已认证的这一事实。你可以如何推广它呢？获得\
  \ CISSP 后，你可以简单地在名片、信具、电子邮件签名、简历、博客和网站的名字后面加上 CISSP 这几个字母。顺便把 CISSP 的标志也放上去吧（只需确保遵守任何既定的使用条款即可）。\n\
  \n![tip](img/tip.png) (ISC)² 还有许多其他可用认证，将在下一节中进行描述。\n\n### 自豪地穿上这些颜色\n\n(ISC)² 在线商店有很多酷东西，从夹克、衬衫到马克杯和帽子。那里有每个人需要的物品。该机构定期推出新产品，并举办清仓特卖。[`http://isc2education.org/shop`](http://isc2education.org/shop)。\n\
  \n考虑为你的衣橱增添几件印有 (ISC)² 和 CISSP 标志的精美 Polo 衫。或者大挥霍一下，考虑买一件 CISSP 皮夹克（像 Fonz 一样酷炫——除非当你说“Aaa!”时，你当然指的是身份验证、授权和计费——我们在第\
  \ 7 章]中讨论过这些）或背包！\n\n### 以身作则\n\n无论喜不喜欢，安全专业人士，特别是持有 CISSP 的人员，都是他们周围人的榜样。从安全的角度来看，我们所的一切——以及我们的做法——都被视为正确行为的标准。\n\
  \n![remember](img/remember.png) 注意到这一点，我们在做每件事时都应该表现得好像有人在看一样——即使并没有人在看。\n\n###\
  \ 利用你的 CISSP 认证成为变革推动者\n\n作为一名认证的安全专业人士，你是组织中的*变革推动者*：威胁和法规的状态不断变化中，你必须通过确保雇主的环境和政策继续保护雇主的资产免受伤害来做出应对。以下是关于成功的变革推动者的重要原则：\n\
  \n*   仅识别并推广必要的变更。\n*   仅推广那些有可能成功的变更。\n*   预判阻力的来源。\n*   区分阻力与有理的批评。\n*   以正确的方式让所有相关方参与。\n\
  *   不要承诺你无法交付的东西。\n*   利用赞助人、合作伙伴和合作者作为共同的变革推动者。\n*   调整衡量指标和奖励以支持不断变化的世界。\n*  \
  \ 提供培训。\n*   庆祝所有的成功。\n\n![remember](img/remember.png) 你作为安全专业人士的工作并不涉及说教；相反，你需要识别改进机会和降低业务风险的机会。在组织的结构内，以正确的方式带来变革。这是减少安全风险的最佳方式。\n\
  \n### 获得其他认证\n\n在商业和技术领域，没有人的职业生涯会停留在原地。你正在不断成长和变化，而不断变化的技术也影响着组织以及你在其中的角色。\n\n\
  当你获得 CISSP 时，你不应该认为自己的认证之旅已经结束了——即使它*确实*是目前最高级的信息安全认证！安全是一场旅程，你的 CISSP 认证并不是终点，而是道路上的一个（重要的）里程碑。CISSP\
  \ 应该是你安全*生活方式*的一部分。\n\n### 其他 (ISC)² 认证\n\n(ISC)² 有许多其他认证，包括你可能在获得 CISSP 之后（或代替它）追求获得的认证。这些认证是：\n\
  \n*   **(ISC)² 成员：** 如果你通过了 CISSP 或 SSCP 认证考试，但尚未获得所需的专业经验，你可以成为 (ISC)² 成员。在 (ISC)²\
  \ 网站上了解此选项。\n*   **CCSP（认证云安全专业人士）：** 这项关于云控制和安全实践的认证是由 ISC)² 和云安全联盟共同开发的。\n*  \
  \ **SSCP（系统安全认证从业人员）：** 这项认证针对实操安全技术人员和分析师。SSCP 一直带有“初级”CISSP 认证的声誉，但不要被骗了它绝非如此。SSCP\
  \ 的技术性比 CISSP 高。对于某些人来说，SSCP 可能是迈向 CISSP 的跳板，但对另一些人来说，它本身就是一个极佳的目标。\n\n\n\n\n* \
  \  **CSSLP (认证安全软件生命周期专业人士):** 为软件开发专业人员设计，`CSSLP` 认可将安全作为软件需求、设计和测试一部分的软件开发——使最终产品具有内生的设计和构建的安全性，而不是事后添加。\n\
  *   **HCISPP (医疗保健信息安全与隐私从业人员):** 针对医疗行业的信息安全设计，`HCISPP` 认可与医疗数据保护法规以及患者数据保护相关的知识和经验。\n\
  *   **JGISP (日本政府信息安全专业人士):** 一种特定国家的认证，验证专业人士与日本政府法规和标准的知识、技能和经验。\n*   **CAP (认证与认可专业人士):**\
  \ 由美国国务院信息保证办公室和 `(ISC)²` 共同开发，`CAP` 证书反映了评估复杂系统和环境风险以及建立安全需求所需的技能。\n\n### CISSP\
  \ 集中方向\n\n`(ISC)²` 开发了与你的 `CISSP` 伴随的进阶认证（可以将其想象为*配件*）。`(ISC)²` 将这些认证统称为*集中方向*，因为它们代表了你可能选择专攻的三个领域：\n\
  \n*   **ISSAP (信息系统安全架构专业人士):** 适用于技术系统安全架构师。\n*   **ISSEP (信息系统安全工程专业人士):** 证明安全工程师的能力。\n\
  *   **ISSMP (信息系统安全管理专业人士):** 关于安全管理（当然了！）。\n\n所有的集中方向都要求你首先必须是状态良好的 `CISSP`，且每个方向都有自己的考试。可以在\
  \ `(ISC)²` 网站上关于这些集中方向及其考试的介绍：[`www.isc2.org/Certifications/CISSP-Concentrations`](http://www.isc2.org/Certifications/CISSP-Concentrations)。\n\
  \n### 非 (ISC)² 认证\n\n除 `(ISC)²` 以外的机构也提供安全相关的认证，其中一个或多个可能适合你。这些认证中没有直接与 `CISSP`\
  \ 竞争，但其中一些与 `CISSP` 有部分重叠。\n\n### 非技术/非厂商认证\n\n还有许多不与特定硬件或软件厂商绑定的认证。一些较好的包括：\n\n\
  *   **CISA (注册信息系统审计师):** 如果你担任内部审计师，或者你的组织受一项或多个安全法规限制（如萨班斯奥克斯利法案、HIPAA、GLBA、PCI\
  \ 等），请考虑此认证。信息系统审计控制协会基金会 (`ISACA`) 管理此认证。可以在 [`www.isaca.org/cisa`](http://www.isaca.org/cisa)\
  \ 了解更多关于 `CISA` 的信息。\n*   **CISM (注册信息安全经理):** 与 `(ISC)²` 的信息系统安全管理专业人士 (`ISSMP`)\
  \ （在本章前面的 `CISSP concentrations` 部分讨论过）类似，如果你从事安全管理，可能需要 `CISM` 认证。与 `CISA` 一样，`ISACA`\
  \ 管理此认证。可以在 [`www.isaca.org/cism`](http://www.isaca.org/cism) 阅读更多。\n*   **CRISC\
  \ (风险信息控制认证):** 这是一个相对新的认证，专注于组织风险管理。可以在 [`www.isaca.org/crisc`](http://www.isaca.org/crisc)\
  \ 了解更多。\n*   **CGEIT (企业 IT 治理认证):** 如果你想证明自己在 IT 管理和治理领域的技能和知识，请查看此认证。IT 组织中的有效安全无疑取决于*治理*，这涉及为了实现长期目标对资源的管理和控制。可以在\
  \ [`www.isaca.org/cgeit`](http://www.isaca.org/cgeit) 了解更多关于 `CGEIT` 的信息。\n*   **CPP\
  \ (注册保护专业人士):** 主要是一项安全管理认证，`CPP` 由 `ISACA` 管理（等等，原文说是 ISACA，但通常 CPP 是 ASIS）。可以在\
  \ [`www.isaca.org/cisa`](http://www.isaca.org/cisa) 了解更多关于 `CPP`。\n*   **PSP (注册物理安全专业人士):**\
  \ `ASIS` 提供此认证。可以在 [`www.isaca.org/cism`](http://www.isaca.org/cism) 阅读更多关于 `PSP`。（原文说是\
  \ `ISACA`，但 `ASIS` 管理 `PSP`）。\n*   **CIPP (注册信息隐私专业人士):** 国际隐私专业人士协会 (`IAPP`) 拥有此认证。可以在\
  \ [`ipps.org/crisc`](http://ipps.org/crisc) 了解更多关于 `CIPP`。\n*   **CIPP/E (注册信息隐私专业人士/欧洲):**\
  \ `IAPP` 开发了专门针对欧洲事务的 `CIPP` 版本。可以在 [`ipps.org/cipe`](http://ipps.org/cipe) 了解更多。\n\
  *   **C|CISO (注册首席信息安全官):** 此认证证明了典型的 `CISO` 位置所需的技能和知识。可以在 [`eccouncil.org`](http://eccouncil.org)\
  \ 了解更多。\n*   **CBCP (注册业务连续计划师):** 由灾难恢复协会提供。你可以在 [`dri.org/cbcp`](http://dri.org/cbcp)\
  \ 了解更多。\n*   **DRCE (认证灾难恢复专家):** 此认证是对灾难恢复知识和经验的认可。更多信息请 [`bcm-institute.org/certification`](http://www.bcm-institute.org/certification)。\n\
  *   **PMP (项目管理专业人士):** 位于 [`pmi.org`](http://www.pmi.org) 的项目管理协会提供此认证。\n*   **PCI-QSA\
  \ (支付卡行业合格安全评估师):** 支付卡行业安全标准委员会为审计存储、传输或处理信用卡数据组织的专业人士开发了 `QSA`。更多信息请访问 [`pcisecuritystandards.org`](http://www.pcisecuritystandards.org)。\n\
  *   **PCI-ISA (支付卡行业内部安全评估师):** 此认证同样来自支付卡行业安全标准委员会，适用于存储、传输或处理持卡人数据组织内部的安全专业人士。更多信息请访问\
  \ [`pcisecuritystandards.org`](http://www.pcisecuritystandards.org)。\n*   **GIAC\
  \ (全球信息保证认证):** `GIAC` 系列认证包括审计、管理、运营和安全管理等类别。补充 `CISSP` 的非特定厂商 `GIAC` 认证之一是 `GIAC`\
  \ 认证取证分析师 (`GCFA`) 和 `GIAC` 认证事件处理师 (`GCIH`)。可以在 [`giac.org/certifications`](http://www.giac.org/certifications)\
  \ 找到更多信息。下一节中还提到几种与厂商相关的 `GIAC` 认证。\n\n### 技术/厂商认证\n\n我们甚至不打算在这里列出所有的技术和厂商认证。但这些是一些广为人知的厂商相关安全认证：\n\
  \n\n\n\n\n- **CCIE (思科认证网络专家) 安全认证：** 思科还提供了几种针对特定产品的相关认证，包括 `ASA` 防火墙和入侵防御系统。可以在\
  \ [`www.cisco.com/certifications`](http://www.cisco.com/certifications) 了解更多信息。\n\
  - **Check Point 安全管理认证：** 你可以获得 Check Point 防火墙和其他安全产品相关的认证。访问 [`www.checkpoint.com/certification`](http://www.checkpoint.com/certification)。\n\
  - **C|EH (认证道德黑客)：** 我们知道，我们知道。对某些人来说这个术语自相矛盾，但对另一些人来说具有真正的业务价值。在签署前请仔细阅读。由国际电子商务顾问委员会\
  \ (EC-Council) 提供。你可以在 [`http://cert.eccouncil.org`](http://cert.eccouncil.org)\
  \ 了解更多信息。\n- **E|NSA (网络安全管理员)：** 同样由 EC Council 提供，这是一项认可防御性视角的认证——与 `C|EH` 的攻击性视角相反。你可以在\
  \ [`http://cert.eccouncil.org`](http://cert.eccouncil.org) 了解更多。\n\n- **L|PT (授权渗透测试员)：**\
  \ 另一项来自 EC Council 的认证，它将渗透测试提升到了比 `C|EH` 更高的水平。在 [`http://cert.eccouncil.org`](http://cert.eccouncil.org)\
  \ 了解更多。\n- **C|HFI (认证黑客取证调查员)：** 同样来自 EC Council，该认证认可了检测计算机犯罪和收集取证证据的取证专家的技能和知识。在此了解更多信息：[`http://cert.eccouncil.org`](http://cert.eccouncil.org)。\n\
  - **CSFA (网络安全取证分析师)：** 该认证证明了进行计算机取证检查的知识和技能。认证考试的一部分是实验室中的实际取证作业。查看 [`www.cybersecurityforensicanalyst.com`](http://www.cybersecurityforensicanalyst.com)\
  \ 获取更多信息。\n- **CompTIA Security+：** 针对 PC 技术人员及类似的安全能力认证。我们认为这是一种入门级认证，可能不适合你，但你完全可以建议那些想要进入信息安全领域的职业同事，该认证是一个很好的起点。你可以在\
  \ [`http://certification.comptia.org`](http://certification.comptia.org) 了解更多信息。\n\
  - **Security|5：** 与 Security+ 类似，这是针对任何兴趣学习计算机网络和安全基础的人的入门级安全能力认证。可以在 [`http://cert.eccouncil.org`](http://cert.eccouncil.org)\
  \ 了解更多。\n\n你可以在那里找到许多其他安全认证。使用你喜欢的搜索引擎搜索“security certification”（安全认证）等词组来查找信息。\n\
  \n### 选择合适的认证\n\n通常，技术和安全专业人员会问我们下一步应该获得哪种认证。我们的答案几乎总是相同的：你的决定取决于你目前所处的位置以及你希望你的职业生涯向何何发展发展。没有一种适用于所有人的“正确”认证——确定你应该寻求哪种认证是非常个性化的事情。\n\
  \n在考虑其他认证时，请问自己以下问题：\n\n- **我现在的职业生涯处于什么阶段？** 你更关注技术、政策、运营、开发还是管理？\n- **我希望我的职业生涯未来向哪个方向发展？**\
  \ 如果（例如）你困在运营工作中，但你想专注于政策，那么就让这个目标成为你的指南。\n- **我目前拥有哪些认证资质？** 有些人根据他们已经拥有的技能来攻读认证，并利用这些新获得的认证来攀爬职业阶梯。\n\
  - **我在职业生涯中需要做什么才能获得更多资质？** 你不仅需要考虑你现在可能能够获得哪些认证，还需要考虑为了获得未来的认证，你必须积累哪些经验。\n\n如果你对自己诚实，回答这些问题将帮助你辨别出哪些认证是适合你的。我们建议你每隔几年花时间做一些长期职业规划；大多数人会发现，我们在这里列出的这些问题的答案会发生变化。\n\
  \n你可能还会发现，你拥的一个或多个认证不再反映你的职业方向。如果是这样，请允许自己让这些认证失效。没有必要守着不再体现（或无法帮助你实现）职业目标的旧认证。我们每个人都至少这样做过一次，也许将来某天我们还会这样做。\n\
  \n### 寻找导师，成为导师\n\n如果你对信息安全领域还比较陌生（即使你并不陌生！），并且发现自己对职业生涯有很多问题要问，也许你可以从导师那里获益。导师是那些经历过你的职业生活、并在安全领域领域程多年的多年的人。\n\
  \n我们建议你多寻找几个导师，并在与几个候选人交流后再决定选择一个。导师通常有不同的方法，从随意的讨论到更有结构化的学习。\n\n如果你不确定在哪里寻找导师，可以从你所在的一个或多个本地安全组织或活动开始。如果你住在大之外，你可能需要找一个远距离导师。然而，这种经历仍然是很有回报的！\n\
  \n当你的职业生涯从安全新手转变为安全专家时，考虑自己成为一名导师。你会发现，尽管你正在帮助另一个有志向的安全专业人士开启职业，但你在此过程中也能学很多关于安全以及自身的知识。\n\
  \n![remember](img/remember.png) 大多数非技术类认证要求你证明自己*已经拥有所需的工作经验，才能获得它们*。人们犯了这种常见的错误：他们想获得认证是为了找到某种特定类型的工作。但并不是认证的目的。相反，认证是证明你*已经同时拥有知识和经验*的证据。\n\
  \n### 追求安全卓越\n\n我们认为，在安全职业中取得成功的最佳方法是每天追求卓越，无论你已经处于理想的安全工作中，还是刚刚起步。\n\n对卓越的追求听起来可能是一个高深或模糊的术语，但你可以通过每天采取行动带来改变：\n\
  \n- **每天尽力工作。** 无论你从事什么职业，都要在领域内做到最出色。\n- **保持乐观的态度。** 快乐和工作满意度很大程度上取决于你的态度。良好的心态有助于每一天变得更好，并帮助你做得更好。因为乐观是有感染力的，你的乐观态度会鼓励你的同事，很快大家都会吹口哨、哼唱或做任何他们喜欢工作时会做的事情。\n\
  - **不断完善自己。** 花时间阅读行业的安全实践、进展、发展和变化。尝试思考行业创新如何帮助你和你的组织以更小的努力降低风险。\n- **理解你的价值。**\
  \ 花时间理解你的工作如何为组织创造价值，并尝试提出更多增加价值和降低风险的方法。\n- **理解组织的整体安全大局。** 无论你是否负责安全的某个方面面，都要花时间理解组织用于增加安全和降低风险的原则。使用`第三章`\
  \ 中的安全和风险管理原则，看看这些原则如何帮助进一步改进安全。思考你在推动组织资产和信息保护事业方面可以扮演的角色。\n\n\n\n如果你将追求卓越成为习惯，你就能随着时间的推移逐渐变得更好。你最终将获得更好的安全职业生涯，而你的组织也将获得更好的安全性并降低风险。\n\
  \n# 第 2 部分\n\n### 认证领域\n\n在本部分中……\n\n* 理解安全和风险管理概念及原则。\n* 将你的资产安全知识转化为你的资产之一。\n\
  * 设计并实现安全的软件、系统和设施。\n* 学习通信和网络安全基础。\n* 识别身份和访问管理技术。\n* 进行安全评估、扫描、测试和审计。\n* 应用安全运营概念和控制措施。\n\
  * 确保整个开发生命周期中的软件安全。\n\n# 第 3 章\n\n# 安全与风险管理\n\n在本章中\n\n![check](img/check.png) 将安全与业务对齐\n\
  ![check](img/check.png) 理解安全治理原则和概念\n![check](img/check.png) 识别法律、法规、合规和职业伦理问题\n\
  ![check](img/check.png) 编写安全策略、标准、程序和指南\n![check](img/check.png) 制定业务连续性需求\n![check](img/check.png)\
  \ 执行人员安全策略\n![check](img/check.png) 应用风险管理概念和威胁建模\n![check](img/check.png) 集成安全风险考量\n\
  ![check](img/check.png) 建立并监控安全教育、培训和意识计划\n\n安全与风险管理领域涉及许多基础安全概念和原则，以及合规、道德、治理、安全策略和程序、业务连续性计划、风险管理以及安全教育、培训和意识。该领域占\
  \ CISSP 考试的 15%。\n\n### 应用安全治理原则\n\n对于 CISSP 考试，你必须完全理解并能够应用安全治理原则，包括：\n\n* 安全功能与业务战略、目标、使命和目的的结合\n\
  * 组织流程\n* 安全角色和职责\n* 控制框架\n* 正当注意（Due care）\n* 尽职调查（Due diligence）\n\n### 安全功能与业务战略、目标、使命和目的的结合\n\
  \n为了使信息安全计划有效，它必须与组织的使命、战略、目标和目的保持一致；因此，你必须理解组织使命、战略、目标和目的之间的区别和关系。你还需要知道这些元素如何影响组织的信息安全策略和计划。与组织的使命、战略、目标和目的正确对齐，也有助于为安全计划倡议建立业务案例、确保预算并分配资源。通过适当的对齐，安全项目和其他活动将得到合理的优先级排序，并且它们能更好地符合组织的策略、实践和流程。\n\
  \n#### 使命（并非那么不可能）与战略\n\n这个标题很老套，对吧，但你现在可能正在哼着《任务中谍员》（Mission Impossible）的主题曲——任务完成！\n\
  \n组织的`使命宣言`（mission statement）表达了其存在的理由。良好的使命宣言是一个易于理解的、通用的陈述，说明组织是什么、做什么以及为什么存在，并如何以它所选择的方式做这些事情。\n\
  \n组织的`战略`（strategy）描述了它`如何`完成使命，并经常进行调整以应对新的挑战和业务现实。\n\n#### 目标与目的\n\n`目标`（goal）是组织希望实现的（或多个）事情。目标应该与组织的使命宣言或哲学保持一致，并有助于定义组织的愿景。它还应该让人们陷入狂热，在办公室里跑来跑去，挥舞手臂并大喊“进球啦！”（好吧，也许只有他们是世界杯球迷时。）\n\
  \n`目的`（objective）是一个预期的里程碑或特定结果，因此它有助于组织实现目标并达成使命。\n\n安全人员应该敏锐地意识到他们组织的目标和目的。只有这样，安全专业人员才能确保安全能力能够配合并保护所有当前、变化和新的产品、服务及尝试。\n\
  \n![warning](img/warning.png) 组织经常混用`goals`（目标）和`objectives`（目的）这两个词，而不加区分。更糟糕，有些组织将目标视为长期目的，而将目的视为短期目标！对于\
  \ CISSP 考试，一个`目的`（短期）支持一个`目标`（中期），目标支持一个`使命`（长期），而使命通过一个定义良好的`战略`来实现。所有这些都属于组织`使命宣言`的伞下。\n\
  \n### 组织流程（安全高管监督）\n\n在本节中，我们将讨论安全治理领域的关键流程。\n\n#### 治理委员会和高管监督\n\n安全管理从高层开始（或应该从高层开始），即执行管理和董事会监督。这通常表现为`安全治理`，简单意味着组织的治理机构设定了方向，且组织拥有策略和流程，以确保执行管理层遵循该方向、充分知并对信息安全战略、策略和运营进行控制。\n\
  \n治理委员会由一组高管和/或经理组成，他们定期开会审查安全事件、项目、运营指标以及他们关注的其他方面。治理委员会偶尔会向安全管理发布关于新业务活动以及优先级和战略方向转变的指令。\n\
  \n在实践中，这与 IT 或其他部门的治理没有太大区别。治理是执行管理层如何参与 IT、安全以及业务其他部分的进展的。\n\n#### 收购与剥离\n\n组织（特别是私营行业）不断地自我创新。比以往任何时候，保持敏捷和竞争力都至关重要。这导致组织收购其他组织、组织拆分为两个（或多个）独立公司，以及改变团队、部门、分支和业务单元对齐的内部重组。\n\
  \n当组织收购另一个组织，或两个（或多个）组织合并时，应该考虑几个与安全相关的因素：\n\n* **安全治理与管理。** 每个组织是如何管理安全的？它们之间有什么重要的区别？\n\
  * **安全策略。** 两个组织之间的策略有何不同？将策略合并为一时会遇到什么问题？\n* **安全态势。** 每个组织中存在哪些安全控制措施？它们之间有多大差异？\n\
  * **安全运营。** 目前有哪些安全运营？它们是如何运行的？这包括漏洞管理、事件监控、身份和访问管理、第三方风险管理和事件管理。\n\n如果一个组织的安全状况与另一个迥异，则组织不应急于将两个组织的网络连接起来。\n\
  \n\n\n有趣的是，当一个组织拆分为两个（或多个）独立的组织或出售某个部门时，情况可能会变得更加复杂。每家新公司可能都需要复制拆分前单一组织拥有的安全治理、管理、控制、运营和工具。这并不意味着两个独立的安全职能必须与旧的相同；重要的是充分理解每个新组织的业务使命，以及哪些安全法规和标准适用于每个新组织。只有这样，信息安全才能能够与每个新组织保持一致。\n\
  \n### 安全角色与职责\n\n“信息安全是‘每个人的责任’”这一真理在实践中往往被误解为`每个人都负责，但没有人需要负责。`。为了避免这一陷阱，应该在组织的安全策略、个人工作描述或职位说明以及第三方合同中定义信息安全的特定角色和职责。这些角色和职责应适用于员工、顾问、承包商、实习生和供应商。而且它们应该适用于从\
  \ C 级高管到一线员工的每一级人员。\n\n### 管理层\n高层管理通常负责多个层面的信息安全，包括信息所有者角色（我们将在下一节中讨论）。然而，在此背景下，管理层有责任通过以下行动证明对组织信息安全计划的坚定承诺：\n\
  \n*   **制定、强制和批准企业信息安全策略：** 该策略应包含管理层的支持声明，并应由`CEO`、`COO`、`CIO`或`董事长`签署。\n*   **以身作则：**\
  \ 佩戴强制身份证并利用系统访问控制的`CEO`树立了良好的榜样。\n*   **奖励合规：** 管理层应该期待良好的安全行为，并相应对员工进行认可、承认和/或奖励。\n\
  \n![remember](img/remember.png) 管理层对组织的整体信息安全以及所做（或未做）的任何信息安全决策负最终责任。我们信息安全专业人员的角色是报告安全问题并向管理层提供适当的信息安全建议。\n\
  \n### 用户\n`终端用户`（或`用户`）几乎包括组织内的每个人。用户没有被专门指定。他们可以广泛定义为任何对组织内部信息或信息系统具有授权访问的人。用户包括员工、承包商和其他临时帮助人员、顾问、供应商、客户以及任何具有访问权限的人。有些组织将他们称为员工、合作伙伴、关联人员或其他。典型的用户职责包括：\n\
  \n*   遵守组织策略、标准和程序中定义的所有适用安全要求；适用的法律或监管要求以及合同要求（如非保密协议和`服务水平协议`）。\n*   在保护组织信息和信息资产方面尽到合理职责。\n\
  *   根据要求参与信息安全培训和意识工作。\n*   向适当人员报告任何可疑活动、安全违规行为、安全问题或安全疑虑。\n\n### 控制框架\n组织通常采用控制框架来协助其法律和监管合规工作。相关安全框架的某些示例包括：\n\
  \n*   **COBIT 5。** 由`ISACA`（以前称为信息系统审计和控制协会）和`IT 治理协会 (ITGI)` 开发，`COBIT`由几个组成部分组成，包括：\n\
  \    *   **框架。** 组织 IT 治理目标和最佳实践。\n    *   **过程描述。** 提供参考模型和通用语言。\n    *   **成熟度模型。**\
  \ 评估组织的成熟度/能力并弥补差距。\n    `COBIT` 框架广泛适用于受《萨班斯-奥克斯利法案 (SOX; 本章稍后讨论)》或`ICOFR`约束的组织。\n\
  \n*   **NIST（美国标准与技术研究院）特别出版物 800-53：联邦信息系统和组织的安全与隐私控制。** 在信息安全专业人员中被称为`NIST 800-53`，这是一个非常流行且全面的框架，是美国政府机构的要求。它也被广泛应用于美国及全球私营行业。\n\
  \n*   **COSO（贯威委员会赞助组织委员会）。** 由`管理会计师协会 (IMA)`、`美国会计学会 (AAA)`、`美国注册会计师协会 (AICPA)`、`内部审计师协会\
  \ (IIA)`和`财务高管协会 (FEI)`开发，`COSO`框架由五个部分组成：\n    *   **控制环境。** 为所有其他内部控制组件提供基础。\n\
  \    *   **风险评估。** 通过识别和分析相关风险建立目标，并确定是否有任何因素会阻止组织实现目标。\n    *   **控制活动。** 为确保遵守管理指示而创建的策略和程序。本书的其他章节将讨论各种控制活动。\n\
  \    *   **信息与通信。** 确保在整个组织范围内建立了适当的信息系统和有效的通信流程。\n    *   **监控活动。** 评估随时间变化的性能并识别缺陷和纠正措施的活动。\n\
  \n*   **ISO/IEC 27002（国际标准/国际电工委员会）。** 正式名为“信息技术——安全技术——信息安全管理规范”，`ISO/IEC 27002`文档在\
  \ 14 个领域记录了安全最佳实践，如下：\n    *   信息安全策略\n    *   信息安全组织\n    *   人力资源安全\n    *   资产管理\n\
  \    *   访问控制\n    *   密码学\n    *   物理和环境安全\n    *   运营安全\n    *   通信安全\n    * \
  \  系统的获取、开发和维护\n    *   供应商关系\n    *   信息安全事件管理\n    *   业务连续性管理的信息安全方面\n    * \
  \  合规\n\n*   **ITIL（信息技术基础库）。** 一套 IT 服务管理的最佳实践，由五卷组成，如下：\n    *   **服务策略。** 涉及\
  \ IT 服务策略管理、服务组合管理、IT 服务财务管理、需求管理和业务关系管理。\n    *   **服务设计。** 涉及设计协调、服务目录管理、服务水平管理、可用性管理、容量管理、IT\
  \ 服务连续性管理、信息安全管理体系和供应商管理。\n    *   **服务过渡。** 涉及过渡规划与支持、变更管理、服务资产与配置管理、发布与部署、服务验证与测试、变更评估和知识管理。\n\
  \    *   **服务运营。** 涉及事件管理、事故管理、服务请求履行、问题管理和访问管理。\n\n\n\n\n- **持续服务改进。** 为改进倡议定义了七步流程，包括确定策略、定义衡量内容、收集数据、处理数据、分析信息和数据、展示并使用信息，以及实施改进。\n\
  \n### 尽职责任 (Due care)\n\n`due care` 是理性人在特定情况下所行使的行为，它为判定过失提供了标准。在信息安全实践中，`due care`涉及个人或组织为履行职责和实施安全最佳实践而采取的步骤。\n\
  \n`due care` 的另一个重要方面是`有罪过失`（culpable negligence）原则。如果一个组织在保护资产（或人员）时未能遵循`due care`标准，该组织可能被判定为有罪过失。在这种情况下，陪审团的裁决金额可能会相应调整，组织的保险公司可能被要求支付损失的一部分——该组织可能不得不自己支付剩余的账单！\n\
  \n### 尽职调查 (Due diligence)\n\n`due diligence`是对`due care`的审慎管理和执行。它通常用于法律和金融领域，用于描述组织为了研究投资或合并/收购机会的可行性和价值而采取的行动。在信息安全背景下，`due\
  \ diligence`通常指风险识别和风险管理实践，不仅适用于组织的日常运营，还适用于技术采购以及合并与收购。\n\n![warning](img/warning.png)\
  \ `due care`和`due diligence`这两个概念相关但有明显区别。例如，在实践中，`due care`是开启日志；而`due diligence`是定期审查日志。\n\
  \n### 理解并应用机密性、完整性和可用性概念\n\n`CIA`三元组（也称为`ICA`）构成了信息安全的基础（见图 3-1）。该三元组由三个基本信息安全概念组成：\n\
  \n- 机密性\n- 完整性\n- 可用性\n\n![image](img/9781119505815-fg0301.png)\n\n图 31 C-I-A 三元组。\n\
  \n与任何三角形一样，三边都相互依赖（想象一个三面金字塔或三脚凳）以形成稳定的结构。如果其中一部分崩塌，整个结构就会崩塌。\n\n### 机密性\n\n`confidentiality`将信息的访问限制在需要这些信息的实体（用户和机器）。`隐私`（Privacy）是一个与之密切相关的概念，通常与个人数据相关。存在多项美国和国际法律来保护个人数据的隐私（机密性）。\n\
  \n个人数据最常见指的是`个人身份识别信息`（PII）或`个人健康信息`（PHI）。`PII`包括姓名、地址、社会安全号码、联系信息（某些情况下）以及财务或医疗数据。`PHI`包含许多与`PII`相同的数据元素，还包括个人患者的医疗记录和医疗支付历史。在更全面的法律定义中（特别是在欧洲），个人数据可能还种族、婚姻状况、性取向或生活方式、宗教偏好、政治派别以及可能关于个人收集或存储的任何独特个人特征。\n\
  \n![tip](img/tip.png) 本章稍后讨论的美国《健康保险流动性与责任法案》（HIPAA）将`PHI`定义为`受保护的健康信息`。在更一般的语境下，`PHI`指的是`个人健康信息`。\n\
  \n隐私的目标是对个人数据的机密性和妥善处理。\n\n### 完整性\n\n`integrity`保护信息和处理方法的准确性和完整性。它确保：\n\n- 未经授权的用户或进程不会对数据进行修改。\n\
  - 授权的用户或进程不会对数据进行未经授权的修改。\n- 数据在内部和外部保持一致，这意味着给定的输入产生预期的输出。\n\n### 可用性\n\n`availability`确保授权用户在需要的时间和地点能够可靠、及时地访问信息以及相关的系统和资产。可用性是信息安全中最容易被忽视的方面之一。除了拒绝服务（DoS）攻击外，对可用性的威胁还包括单点故障、容量规划不足（如存储、带宽和处理能力）、设备故障以及业务中断或灾难。\n\
  \n### 合规性\n\n合规性是由组织为了尝试遵守适用法律、法规、标准和其他法律义务（如合同条款和条件以及服务水平协议 SLAs）而采取的一系列活动组成的。\n\
  \n由于合规性的性质，以及存在许多与安全和隐私相关的法律和标准，许多组织采用了一种致命的错误观念，认为符合安全法规就等同于安全。然而，可以说符合安全法规和标准是通往安全道路的正确一步。当今威胁的性质显而易见，即使是完全符合适用安全法律、法规和标准的组织也可能极其不安全。\n\
  \n### 立法合规性\n\nCISSP 考试要求对美国和国际法律的主要类型和分类以及关键概念有基本的理解。\n\n#### 普通法\n\n`common 法`也称为判例法）起源于中世纪的英国，源于法官的裁决（判例）。普通法基于“遵循先例”（stare\
  \ decisis）原则，并通常被编纂成制定法。在美国的普通法体系下，联邦和州级定义了三大类法律：刑事法、民事法（侵权法）和行政法（监管性法）。\n\n####\
  \ 刑事法\n\n`criminal law`定义了针对社会的犯罪，即使实际受害者是企业或个人。刑法的制定是为了保护普通公众。因此，在法院眼中，受害者是次要的。\n\
  \n#### 刑事惩罚\n\n刑法的惩罚有两个主要目的：\n\n- **惩罚**：惩罚可能包括监禁、假释、罚金和/或对害者的经济赔偿。\n- **威慑**：惩罚必须足够严重，以震慑犯罪者的任何进一步犯罪活动或任何考虑类似犯罪的人。\n\
  \n#### 刑事法的证明责任\n\n要根据刑法被定罪，法官或陪审团必须在*排除合理怀疑*（beyond a reasonable doubt）被告有罪。因此，刑事案件的证明责任完全落在控方身上。\n\
  \n#### 刑事法的分类\n\n刑法分为两种主要分类，取决于严重程度，例如犯罪/攻击类型或总损失金额：\n\n- **重罪**：较严重的犯罪，通常导致超过一年的监禁。\n\
  - **轻罪**：较轻的犯罪，通常导致罚金或少于一年的监禁。\n\n#### 民事法\n\n`civil (tort) law`解决针对个人或企业的侵权行为，这些行为无论是故意还是过失，并导致了损害、损失、伤害或死亡。\n\
  \n\n\n\n\n-   **补偿性赔偿：** 受害者的实际损失，包括律师/法律费用、利润损失、调查费用等。\n-   **惩罚性赔偿：** 由陪审团决定，旨在惩罚违法者。\n\
  -   **法定赔偿：** 法律规定的强制性赔偿，根据违反法律的行为进行评估后确定。\n\n### 民事法中的举证责任\n\n民事法下的定罪通常比刑事法下更容易获得，因为其举证责任要小得多。要在民事法下被判定有罪，陪审团必须`基于证据优势原则`（based\
  \ upon the preponderance of the evidence）相信被告有罪。这简单意味着可用证据使法官或陪审团得出有罪的结论。\n\n###\
  \ 责任与尽职义务\n\n责任和尽职义务的概念与民事案件密切相关，但它们也适用于行政法，我们将在下一节中讨论行政法。\n\n评估实施建议保护措施的法律要求的标准，是评估保护措施的成本以及相应威胁一旦发生所造成的预期损失。如果成本低于预期损失而组织没有实施保护措施，则可能存在法律责任。这是基于`近因关系`（proximate\
  \ causation）原则，即所采取或未采取的行动是导致负面后果一系列事件的一部分。\n\n根据《联邦判刑指南》，如果其组织未能遵守适用法律，高级公司官员可能承担个人责任。此类人员必须遵循谨慎人（或人员）规则，该规则要求他们在履行职责时：\n\
  \n-   诚信。\n-   符合企业的最大利益。\n-   具备在类似情况下类似职位的普通审慎人所应具备的谨慎和勤勉。\n\n### 行政法\n\n行政法（监管法）规定了主要行业（包括银行、能源和医疗保健）、组织和政府机构的绩效和行为准则。这些法律通常由各政府机构执行，违反法律可能导致罚款和/或监禁。\n\
  \n### 国际法\n\n考虑到互联网的全球性，各国往往需要合作以将计算机犯罪分子绳于法法。但由于世界上几乎每个国家都有自己独特的法律体系，这种合作总是困难的，而且往往是不可能的。作为一个起点，各国有时会对于究竟什么是正义产生不一致。其他问题还包括：\n\
  \n-   **缺乏普遍合作：** 我们无法回答“为什么我们不能大家和谐相处？”这个问题，但我们可以告诉您，世界上某个偏远角落的一个 14 岁黑客犯下某种恶行，让我们所有人齐心协力推倒他，并带来持久世界和平的概率是极不可能的。\n\
  -   **对法律的解释不同：** 在一个国家（即使是美国的一个州）违法的行为，在另一个国家并不一定违法。\n-   **证据规则不同：** 这一问题可能涵盖获取和收集证据的各种规则，以及证据可采性的不同规则。\n\
  -   **优先级低：** 不同国家对计算机犯罪的严重性有不同的看法；在国际关系领域，计算机犯罪通常受关注程度最低。\n-   **法律和技术过时：** 与低优先级问题有关。技术在世界各地的差异巨大，许多国家（不仅是第三世界国家）落后于其他国家。由于由于以及许多其他原因，计算机犯罪法往往优先级较低，并且没有跟上更新。由于可能参与国际案件的各种执法机构的技术能力不同，这一问题被进一步加剧了。\n\
  -   **引渡：** 许多国家没有引渡条约，不会将嫌疑人引渡到具有不同或争议做法（如死刑）的国家。虽然对计算机犯罪判处死刑听起来很极端，但最近的事件和网络恐怖主义的威胁使得这是一个非常真实的可能性。\n\
  \n除了普通法系（我们在本章前面的`普通法`中讨论过），世界其他国家使用的法律体系还包括：\n\n-   **民法体系：** 不要与基于普通法的美国民事法混淆。民法体系专门使用宪法和法规，不基于先例。法官在民法体系中的作用是解释法律。民法是世界上应用最广泛的法律体系。\n\
  -   **拿破仑法典：** 起于法国大革命后的法国，拿破仑法典已传欧洲其他国家和其他地区。在该系统中，法律由立法机构制定并由法院解释。然而，通常没有正式的法律先例概念。\n\
  -   **宗教（或习惯法）体系：** 源自宗教信仰和价值观。常见的宗教法体系包括伊斯兰教的`沙里法`（Sharia）、犹太教的`哈拉比`（Halakha）和基督教的`教会法`（Canon\
  \ law）。\n-   **多元（或混合）法律体系：** 各种系统的结合，例如民法与普通法、民法与宗教法、以及普通法与宗教法的结合。\n\n### 隐私要求合规\n\
  \n制定隐私和数据保护法是为了保护收集和维护的信息免受未经授权的披露或滥用。隐私法是美国落后于许多其他国家之一，特别是欧盟（EU）及其《通用数据保护条例》（GDPR），该条例定义了日益严格的隐私法规，监管个人信息传输到不能同等保护此类信息的国家（包括美国）。欧盟\
  \ GDPR 隐私规则包括以下关于个人数据和记录的体：\n\n-   必须公平、合法地收集，且仅在主体提供明确同意后方可。\n-   必须仅用于收集时的目的，且仅在合理期限内使用。\n\
  -   必须准确并保持更新。\n-   必须供请求其所持有的个人信息报告的个人访问。\n-   个人有权更正其个人数据中的任何错误。\n-   个人有权要求从组织信息系统中删除信息。\n\
  -   除非法律授权或个人同意，否则向其他组织或个人披露个人数据。\n-   禁止向无法确保同等隐私保护的地方传输个人数据。\n\n具体的隐私和数据保护法将在本章后续部分讨论。\n\
  \n### 理解全球背景下涉及信息安全的法律和监管问题\n\nCISSP 候选人应熟悉全球范围内各行业中与信息安全相关的法律法规。这可能包括国家法律、地方法律以及任何与组织活动类型相关的法律。\n\
  \n### 计算机犯罪\n\n计算机犯罪是指任何将计算机系统或网络作为工具的犯罪活动。计算机犯罪包括以计算机系统为目标，或以计算机为犯罪现场的犯罪。这是一个非常广泛的光谱。\n\
  \n然而，现实世界在应对计算机犯罪方面存在困难。计算机犯罪难以应对的原因包括\n\n\n\n\n\n- **缺乏理解：** 通常情况下，立法者、法官、律师、执法人员和陪审员并不理解计算机犯罪中涉及的许多不同技术和问题。\n\
  - **法律不健全：** 法律变化缓慢，无法跟上快速演进的新技术。\n- **加密：** 越来越多的情况下，由于移动设备中先进的加密技术，执法机构在进行刑事调查时受到阻碍。\n\
  - **计算机在犯罪中的多重角色：** 这些角色包括*针对*计算机实施的犯罪（例如黑入系统并盗取信息）以及*通过使用*计算机实施的犯罪（例如使用系统发动分布式拒绝服务攻击）。计算机还可能*支持*犯罪企业，犯罪分子利用计算机进行与犯罪相关的记录或通信。\n\
  \n计算机犯罪往往难以起诉，不仅是因为我们刚刚列出的原因，还因为以下问题：\n\n- **缺乏有形资产：** 传统的财产规则在计算机犯罪案件中往往不明确适用。然而，许多国家已将财产规则扩展到包含电子信息。计算资源、带宽和数据（磁颗粒形式的数据）往往是涉及的唯一资产。这些资产非常很难量化和赋值。我们在本章稍后讨论的资产估值过程可以为电子信息的定价提供关键信息。\n\
  - **证据规则：** 在计算机犯罪案件中，往往没有原始文件。此类案件中的大多数证据被视为传闻证据（我们将在随后的章节 `Hearsay rule` 中讨论），必须符合某些要求才能在法庭上采用。通常，证据是计算机本身或其硬盘上的数据。\n\
  - **缺乏证据：** 许多犯罪难以起诉，是因为执法机构缺乏*识别*犯罪者的技能或资源，更不用说收集足够的证据来指控并成功起诉了。熟练的计算机犯罪分子经常利用跨不同国家的受损计算机链，以便即使是勤奋的执法机构难以识别他们。此外，加密技术有时防止执法人员搜索计算机和移动设备以获取证据。\n\
  - **损失的定义：** 数据机密性或完整性的丢失远超刑事或民事案件中损失的正常定义。\n- **作案者所在地：** 通常，针对特定组织实施计算机犯罪的人是在受害者国家以外的地方实施的。计算机犯罪分子这样做是因为他们知道，即使犯了错并产生了可以发现的识别身份的证据，受害者国家的执法机构也很难逮捕犯罪分子。\n\
  - **犯罪分子画像：** 计算机犯罪分子并不一定是硬骨头分子，可能包括以下人员：\n    - **青少年：** 许多国家的青少年法没有得到重视，且不足以威慑犯罪。繁忙的检察官不太可能追究由青少年实施的低调犯罪，因为这种犯罪仅导致犯罪者获得三年的缓刑。\n\
  \    - **受信赖的人员：** 许多计算机犯罪分子是公司内担任信任职位且没有犯罪记录的人员。此类人员可能负担得起法律辩护的梦团队，法官可能倾向于对初犯者判处较轻的处罚。然而，美国最近的公司丑闻为最高层的惩罚设定了强有力的先例。\n\
  \n计算机犯罪通常被归为以下六大类别之一：\n\n- **工业间谍活动：** 企业日益成为工业间谍活动的目标。这些攻击包括竞争情报收集，以及对产品规格、计划、图纸以及营销和客户信息等业务信息的盗取。企业可能由于以下原因成为攻击者的目标：\n\
  \    - **缺乏专业知识：** 尽管安全意识有所提高，但合格的安全专业人员短缺问题正日益加剧。这导致组织缺乏充分的预防、检测和响应能力。\n    - **缺乏资源：**\
  \ 企业往往缺乏预防甚至检测针对其系统攻击的资源。\n    - **缺乏关注：** 许多组织的执行管理层和董事会会对安全资源的需求视而不见。\n    - **缺乏报告或起诉：**\
  \ 出于公关考量，以及由于缺乏证据或证据处理不当而无法起诉计算机犯罪分子，大多数企业攻击仍未被报案。此外，极少数司法管辖区要求组织披露涉及知识产权的入侵事件。\n\
  \    对企业的成本可能是巨大的，包括贸易秘密或专有信息的丢失、收入损失，以及当入侵事件被公开时声誉的损失。\n- **财务攻击：** 银行、大型公司和电子商务网站是财务攻击的目标，其中许多攻击是贪婪驱动的。财务攻击可能寻求盗取或挪用资金、获取在线财务信息的访问权限、勒索个人或企业，或获取客户个人信用卡号。勒索软件是财务攻击中极其成功的形式，它们加密信息并要求支付加密货币赎金以获取解密信息的密钥。破坏性软件（Destructware）攻击与勒索软件类似，它们通常索要赎金，但不提供恢复加密信息的密钥。\n\
  - **“趣味性”攻击：** “趣味性”攻击由受好奇或兴奋驱动的追求刺激者脚本小子（script kiddies）实施。虽然这些攻击者可能无意造成任何伤害或使用他们访问的任何信息，但他们仍然是危险的，其活动仍然是非法的。\n\
  \    这些攻击也相对容易检测和起诉。由于犯罪者通常是*脚本小子*（由于自己没有编程技能而使用其他黑客编写的脚本或程序的黑客）或其他缺乏经验的黑客，他们可能不知道如何有效地掩盖踪迹。\n\
  \    此外，由于通常没有对系统造成或意图造成实际伤害，企业可能会起诉该个人并对事件进行积极的公关包装（尽管这很有诱惑力但并不明智）。你就像在晚上 11 点看了电影后那样说道：“我们迅速检测到了攻击，防止了网络受到任何损害，并起诉了责任人；我们的安全是*无不可摧的*！”然而，这种行为可能会激励他人对企业发起更严重、更有组织的报复攻击。\n\
  \    此类类别中的许多计算机犯罪分子只寻求名声。虽然向一小圈朋友炫耀自己篡改了公共网站是一回事，但出现在 CNN 上的狡猾黑客则达到了黑客成名的下一个水平。这些扭曲的个案希望被捕获，以享受他们的\
  \ 15 分钟光环。\n- **报复攻击：** 报复攻击针对个人或企业，攻击者的动机源于对个人或组织报复的愿望。例如，不满的情绪可能会盗取贸易秘密、删除宝贵数据或在关键系统或应用程序中植入*逻辑炸弹*。\n\
  \n\n\n\n幸运的是，这些攻击（至少在不满情绪员工的情况下）比许多其他类型的攻击更容易防范或起诉，原因如下：\n\n*   攻击者通常是受害者所熟知的人。\n\
  *   攻击具有可见的影响，并能产生可行的证据链。\n*   大多数企业（对不当解雇诉讼的可能性已经敏感）已经建立了完善的离职程序。\n*   特定法律（例如\
  \ 1996 年《美国经济间谍法》，我们在本章稍后的“1996 年《美国经济间谍法””节中进行了讨论）对此类犯罪规定了非常严厉的处罚。\n\n*   **意识形态攻击与黑客主义：**\
  \ 意识形态攻击——通常被称为“黑客主义”——近年来变得越来越常见。黑客分子通常以企业或组织为目标，抗议与其意识形态不符的争议性立场。这些攻击通常以分布式拒绝服务（DDoS）的形式出现，但也包括数据窃取。例如，2011\
  \ 年和 2012 年，美国参议院和许多企业（包括索尼 PlayStation 网络）因为支持《停止在线侵版法案》（SOPA）而成为攻击目标。\n\n*   **军事和政治情报攻击：**\
  \ 军事和政治情报攻击由犯罪分子、叛徒或外国军事和情报特工实施，旨在获取政府、执法部门或军事的机密信息。此类攻击通常由政府在战争和冲突期间进行。\n\n*  \
  \ **恐怖主义攻击：** 恐怖主义在互联网上存在多个层面。在 2001 年 9 月 11 日针对美国的恐怖主义袭击后，普通公众痛苦地意识到了互联网上恐怖主义的程度。恐怖主义组织和细胞利用网络能力协调攻击、转移资金、损害国际贸易、破坏关键系统、传播宣传材料、招募新成员，并获取有关开发恐怖技术和工具的有用信息，包括核武器、生物和化学武器。\n\
  \n### 重要的国际计算机犯罪和信息安全法律与标准\n\nCISSP 候选人应当熟悉的法律包括：\n\n*   1986 年《美国计算机欺诈与滥用法》\n*\
  \   1986 年《美国电子通信隐私法》(ECPA)\n*   1987 年《美国计算机安全法》\n*   1991 年《美国联邦判刑指南》（不一定针对计算机犯罪，但无疑相关）\n\
  *   1996 年《美国经济间谍法》\n*   1996 年《美国儿童色情信息预防法》\n*   2001 年《美国爱国者法》(USA PATRIOT Act)\n\
  *   2002 年《美国萨班斯-奥克斯利法案》\n*   2002 年《美国国土安全法》\n*   2002 年《美国联邦信息安全管理法》(FISMA)\n\
  *   2003 年《美国控制非索求色情广告和营销法》(CAN-SPAM)\n*   2003 年《美国身份盗窃与假设威慑法》\n*   2004 年《美国情报改革与反恐怖主义法》\n\
  *   2001 年《欧洲理事会网络犯罪公约》\n*   1990 年《计算机滥用法》（英国）\n*   2003 年《隐私与电子通信条例》（英国）\n*  \
  \ 2000 年《信息技术法》（印度）\n*   2001 年《网络犯罪法》（澳大利亚）\n*   《通用数据保护条例》(GDPR)（欧盟）\n*   《支付卡行业数据安全标准》(PCI\
  \ DSS)\n\n重要的是，网络安全和隐私法律会随着时间而变化。书中列出的此类法律列表不应被认为是完整或最新的。相反，应将这些视为美国及其他地区法律的抽样。\n\
  \n### 1986 年《美国计算机欺诈与滥用法》，18 U.S.C. § 1030（修订版）\n\n1986 年，美国首部联邦计算机犯罪法——《美国计算机欺诈与滥用法》通过了。这项过渡性法案的定义非常狭窄且具有某种模糊性。该法涵盖了：\n\
  \n*   机密国家国防或外交关系信息\n*   金融机构或信贷报告机构的记录\n*   政府计算机\n\n1986 年《美国计算机欺诈与滥用法》增强和加强了\
  \ 1984 年的法律，明确了联邦计算机犯罪中刑事欺诈和滥用的定义，并消除了起诉的障碍。\n\n该法案为未经授权访问 `federal interest` 计算机设立了两项新重罪，并对未经授权交易计算机密码设立了一项轻罪：\n\
  \n*   **重罪 1：** 未经授权访问联邦利益计算机，或超出授权范围访问，以实施预图的欺诈，应按重罪惩处[第 (a)(4) 款]。\n*   **重罪 2：**\
  \ 修改、损坏或破坏联邦利益计算机中的信息，或阻止对计算机或信息的授权使用，导致在一年内总损失达到 1,000 美元或以上或可能损害医疗治疗，应按重罪惩处[第\
  \ (a)(5) 款]。\n\n该规定被完全删除，并代之以一个更通用的规定，我们将在本节稍后的部分进行讨论。\n\n*   **轻罪：** 交易计算机密码或类似信息，如果影响州际或外国贸易或允许未经授权访问计算机。\n\
  \n![tip](img/tip.png) 该法案将 `federal interest computer`（实际上，该术语在 1996 年更改为 `protected\
  \ computer`）定义为以下计算机之一：\n\n*   [专]门用于金融机构或美国\n\n*   [在]用于州际或外国贸易\n\n《美国计算机欺诈与滥用法》的若干细微修订于\
  \ 1988 年、1989 年和 1990 年进行，更重大的修订于 1994 年、1996 年（通过 1996 年《经济间谍法》）和 2001 年（通过《爱国者法案》）进行。该法案目前的形式规定了八项特定的计算机犯罪。除了我们之前讨论的三项外，这些犯罪还包括以下规定（我们稍后将讨论\
  \ [a][5] 条）：\n\n*   未经授权访问或超出授权范围访问计算机，导致`泄露美国国防或外交关系信息`[第 (a)(1) 款]。\n*   未经授权访问或超出授权范围访问保护计算机，以`获取该计算机上的任何信息`[第\
  \ (a)(2) 款]。\n*   未经授权访问保护计算机，或超出授权范围访问保护计算机，从而`影响美国政府对该计算机的使用`[第 (a)(3) 款]。\n*\
  \   未经授权访问保护计算机导致损害或疏忽损害，或`故意传输恶意代码`导致保护计算机受损[第 (a)(5) 款，修订版]。\n*   出于勒索目的传输州际或外国通信信息`威胁损害`保护计算机[第\
  \ (a)(7) 款]。\n\n在本章稍后的“2001 年《美国爱国者法案`”节中，我们将讨论国会在 2001 年引入的对 1986 年《美国计算机欺诈与滥用法》（修订版）的重大修订。\n\
  \n1986 年《美国计算机欺诈与滥用法》是目前有效的*主要的*计算机犯罪法律。CISSP 考试可能会测试你对该法案 1986 年原始形式的了解，但你也应为可能涵盖该法案更近期修订的考试修订做好准备。\n\
  \n### 1986 年《美国电子通信隐私法》(ECPA)\n\n\n\nECPA（电子通信隐私法）补充了 1986 年美国计算机欺诈和滥用法，并禁止对线路、口头和电子通信进行窃听、拦截或未经授权的监控。然而，ECPA\
  \ 确实提供了特定的法定例外，允许网络提供商在通知网络用户监控过程的情况下，为了合法的业务目的对其网络进行监控。\n\n2001 年的`USA PATRIOT\
  \ Act`（爱国法案）对 ECPA 进行了广泛修订。这些变化将在随后的“2001 年美国爱国法案”章节中讨论。\n\n美国《电子通信隐私法》（ECPA）为网络监控提供了法律依据。\n\
  \n### 1987 年美国计算机安全法\n\n1987 年美国计算机安全法要求联邦执法机构采取额外的安全措施，以防止对存储敏感信息的计算机进行未经的访问。除了为敏感系统识别并制定安全计划外，该法还要求这些机构为员工提供安全相关的意识培训。该法还将将计算机安全的正式政府责任分配给：负责通用信息安全标准的`国家标准与技术研究院`（`NIST`），以及负责机密政府/军事系统及应用的加密技术的`国家安全局`（`NSA`）。\n\
  \n### 1991 年美国联邦量刑指南\n\n1991 年 11 月，美国量刑委员会发布了联邦量刑指南的第 8 章“组织量刑指南”。这些指南为组织确立了书面行为标准，为表现出尽职调查的组织提供了量刑减免，并将尽职尽责的责任归于高级管理人员，并对疏忽行为处以处罚，包括高达\
  \ 2.9 亿美元的罚款。\n\n### 1996 年美国经济间谍法\n\n1996 年美国《经济间谍法》（EEA）的旨在遏制工业间谍活动，特别是当此类活动有利于外国实体时。EEA\
  \ 规定，在未经所有者授权的情况下获取、下载、接收或拥有商业秘密信息属于犯罪行为。处罚措施包括高达 1000 万美元的罚款、最高 15 年的有期徒禁，以及没收用于犯罪的任何财产。EEA\
  \ 还颁布了 1996 年《美国计算机欺诈和滥用法》的修订案，我们在本章前面的“1986 年美国计算机欺诈和滥用法，第 18 U.S.C. § 1030（修订版）”章节中将讨论过该内容。\n\
  \n### 1996 年美国儿童色情预防法\n\n1996 年美国《儿童色情预防法》（CPPA）的制定旨在打击利用计算机技术制作和分发涉及儿童的色情内容，包括扮演儿童的成年人。\n\
  \n### 2001 年美国爱国法\n\n在 2001 年 9 月 11 日针对美国的恐怖袭击后，2001 年`USA PATRIOT Act`（全称：《通过提供拦截和阻止恐怖主义所需的适当工具来统一和加强美国法案》）于\
  \ 2001 年 10 月颁布，并于 2006 年 3 月获得延期。（许多原定于过期的条款已根据延期后的法案成为永久条款。）该法案在加强和修订现有的计算机犯罪法方面迈了巨大步伐，包括《美国计算机欺诈和滥用法》和《美国电子通信隐私法》（ECPA），并赋予了美国执法机构权力（即使是暂时的）。美国联邦法院随后宣布该法案的部分条款违宪。与\
  \ CISSP 考试相关的法律章节包括：\n\n- **第 202 节 — 与计算机欺诈和滥用犯罪相关的线路、口头和电子通信拦截授权：** 根据之前的法律，调查人员无法就违反《计算机欺诈和滥用法》的行为获得窃听令。此修订案授权对该法的重罪违反行为采取此类行动。\n\
  - **第 209 节 — 根据搜查令没收语音邮件信息：** 根据之前的法律，调查人员可以根据 ECPA 访问电子邮件，但不能访问语音邮件，后者受更严格的窃听法管辖。此修订案授权通过搜查令而非窃听令来访问语音邮件。\n\
  - **第 210 节 — 电子通信记录的传票范围：** 根据之前的法律，对电子记录的传票被限制在非常有限的信息上。此修订案扩大了可以获取的记录列表，并更新了特定技术领域的术语。\n\
  - **第 211 节 — 范围澄清：** 此修订案规范了电缆、电话和互联网服务提供商记录的隐私保护以及向执法部门披露。\n- **第 212 节 — 为保护生命和肢体紧急披露电子通信：**\
  \ 在此修订案之前，没有特殊规定允许通信提供商在紧急情况下（如迫在眉睫的犯罪或恐怖袭击）向执法人员披露客户信息，而不会让提供商面临客户的民事责任诉讼风险。\n\
  - **第 214 节 — FISA（外国情报监视法）下的笔迹记录和陷阱追踪授权：** 明确了执法部门对互联网和其他计算机网络进行通信追踪的权限，并授权在全国范围内使用笔迹/陷阱设备，而不是将其限制法院的管辖范围。\n\
  \n![technicalstuff](img/technicalstuff.png) `pen/trap device`（笔迹/陷阱设备）指的是显示电话拨出号码的`pen\
  \ register`（笔迹记录）和显示拨入电话号码的`trap and trace device`（追踪设备）。笔迹记录和追踪设备统称为笔迹/陷阱设备，大多数技术允许同一设备执行这两种类型的追踪（接入和拨出号码）。\n\
  \n- **第 217 节 — 拦截计算机入侵者通信：** 根据之前的法律，组织允许监控其网络上的活动，但不一定允许执法人员协助这些组织进行监控，即使请求了此类帮助。此修订案允许组织授权“在法律色彩（伪装或外观）下行动”的人员监控其计算机系统的入侵者。\n\
  - **第 220 节 — 电子证据搜查令的全国送达：** 解决了获取电子邮件搜查令的管辖权问题。关于此问题的极佳案例，可以阅读 Clifford Stoll\
  \ 写的《比谷鸟蛋：在计算机间谍迷宫中追踪间谍》（Doubleday 出版社）。\n- **第 814 节 — 网络恐怖主义的威慑与预防：** 大极地加强了《美国计算机欺诈和滥用法》，包括将最高刑期从\
  \ 10 年增加到 20 年。\n- **第 815 节 — 响应政府请求保留记录的民事诉讼附加辩护：** 澄清了违反 ECPA 的“法定授权”（政府权限）辩护理由。\n\
  - **第 816 节 — 开发和支持网络安全取证能力：** 要求司法部长建立区域计算机取证实验室，维护现有实验室，并为联邦、州和地方执法人员及检察官提供取证和培训能力。\n\
  \n\n\n\n![warning](img/warning.png) 2001 年《美国爱国者法案》（USA PATRIOT Act）改变了计算机犯罪法中的许多条款，特别是《美国计算机欺诈与滥用法》，我们在本章早些部分讨论过“1986\
  \ 年美国计算机欺诈与滥用法，18 U.S.C. § 1030（修订版）”；以及《1986 年电子通信隐私法》，我们在本章早些部分详细介绍了“1986 年美国电子通信隐私法（ECPA）”。作为安全人员，你必须跟当前的法律法规，以便有效地履行你的工作。\n\
  \n### 2002 年《美国萨班斯-奥克斯利法案》（SOX）\n\n在发生几起重大企业和会计丑闻后，SOX 于 2002 年通过，通过为这些实体建立新标准并加强现有标准（包括审计、治理和财务披露），以恢复公众对上市公司和公共会计师事务所的信任。\n\
  \nSOX 建立了公共会计师监督委员会（PCAOB），这是一个私营非营利性公司，负责监督审计师对 SOX 的执行情况。PCAOB 的“会计标准 2”承认了信息技术在公司内部控制和财务报告方面的作用。该标准明确了首席信息官（CIO）对处理和存储财务数据的信息系统安全的责任，并且对信息技术安全和治理具有多重影响。\n\
  \n### 2002 年《美国国土安全法》\n\n该法合并了 22 个美国政府机构，组成了国土安全部（DHS）。该法还规定设立了隐私官员，以执行 1974 年《隐私法》。\n\
  \n### 2002 年《美国联邦信息系统管理法》（FISMA）\n\nFISMA 扩展了 1987 年《计算机安全法》，要求对美国政府信息系统以及向美国联邦政府提供信息服务的机构都进行定期审计。\n\
  \n### 2003 年《美国 CAN-SPAM 法案》\n\n美国 CAN-SPAM 法案（控制未征求色情内容和营销法案）规定了发送商业电子邮件的标准，授权美国联邦贸易委员会（FTC）执行该条款，并规定了违反本法的处罚措施，包括罚金和监。\n\
  \n### 2003 年《美国身份盗窃与假设威慑法案》\n\n该法更新了早期关于身份盗窃的美国法律。\n\n### 关于保护个人数据的第 95/46/EC 号指令（1995\
  \ 年，欧盟）\n\n1995 年，欧洲议会批准了这项重要的立法，旨在保护所有欧洲公民的个人信息。该指令规定，除非满足某些条件，否则不应处理个人数据。\n\n\
  对于欧洲公民个人数据在离开欧洲计算机系统并进入美国计算机系统时的处置方式存在合理担忧，导致了“安全港”计划的产生（将在下节讨论）。\n\n### 安全港（1998\
  \ 年）\n\n在 1998 年欧盟与美国商务部签署的一项协议中，美国商务部开发了一项名为`Safe Harbor`安全港）的认证计划。这允许美国机构认证其妥善处理了欧洲公民的私人数据。\n\
  \n### 2004 年《美国情报改革与反恐法案》\n\n该法促进了美国各政府机构之间的情报共享，并保护了隐私和公民自由。\n\n### 欧洲理事会网络犯罪公约（2001\
  \ 年）\n\n《网络犯罪公约》是一项国际条约，目前已有 40 多个签署（美国于 2006 年批准了该条约），要求签署国针对计算机黑客活动、儿童色情和知识产权侵权建立刑事法律。该公约还试图加强在监控、调查和起方面的国际合作。\n\
  \n### 1990 年《计算机滥用法》（英国）\n\n1990 年《计算机滥用法》（英国）定义了三种与计算机犯罪相关的刑事犯罪：未经授权的访问（无论成功失败）、未经授权的修改以及妨碍授权（拒绝服务）。\n\
  \n### 2003 年《隐私与电子通信条例》（英国）\n\n与美国的“请勿来电”法律类似，该法规定使用设备打播放录制信息的自动电话是非法的。\n\n### 2000\
  \ 年《信息技术法》（印度）\n\n该法使计算机犯罪现代化，并定义了如数据盗取、恶意软件的创建与传播、身份盗窃、色情、儿童色情和网络恐怖主义等活动。该法还认可了电子合同和电子签名。\n\
  \n### 2001 年《网络犯罪法》（澳大利亚）\n\n2001 年《网络犯罪法》（澳大利亚）对意图实施严重犯罪而实施计算机犯罪（包括未经授权的访问、未经授权的修改或拒绝服务）的人规定了刑事处罚，包括罚金和监。\n\
  \n### 支付卡行业数据安全标准（PCI DSS）\n\n虽然（尚未）成为法律强制要求，但支付卡行业数据安全标准（PCI DSS）是强制要求执行安全标准的行业倡议示例。PCI\
  \ DSS 适用于全球任何传输、处理或存储支付卡（即信用卡）交易以与客户开展业务的企业——无论该企业每天处理数千笔信用卡交易，还是每年只处理一次。合规性由卡组织（美国通、万事达、Visa\
  \ 等）强制执行，每个卡组织都有自己的合规计划。\n\n![tip](img/tip.png) 虽然 PCI DSS 是行业标准而非法律强制，但许多州已开始立法，要求在该州经营业务的机构必须符合\
  \ PCI（或至少符合某些条款）。\n\nPCI DSS 要求机构提交年度评估和网络扫描，或完成现场 PCI 数据安全评估和季度网络扫描。具体的要求取决于机构处理的支付卡数量以及其他因素，如之前的数据丢失事件。\n\
  \nPCI DSS 版本 3.2 包含六个核心原则，由 12 项配套要求支持，以及 200 多个具体的合规程序。这些包括\n\n*   **原则 1：构建并维护安全网络：**\n\
  \    *   要求 1：安装并维护防火墙配置以保护持卡数据。\n    *   要求 2：不要使用供应商提供的默认密码和其他安全参数。\n*   **原则\
  \ 2：保护持卡数据：**\n    *   要求 3：保护存储的持卡数据。\n    *   要求 4：在开放公共网络上对传输的持卡数据进行加密。\n*  \
  \ **原则 3：维护漏洞管理计划：**\n    *   要求 5：使用并定期更新防病毒软件。\n    *   要求 6：开发和维护安全的系统和应用程序。\n\
  *   **原则 4：实施强力的访问控制措施：**\n    *   要求 7：根据业务需要限制对持卡数据的访问。\n    *   要求 8：为每个访问计算机的人分配唯一标识符。\n\
  \    *   要求 9：限制对持卡数据的物理访问。\n*   **原则 5：定期监控和测试网络：**\n    *   要求 10：跟踪和监控对网络资源和持卡数据的所有访问。\n\
  \    *   要求 11：定期测试安全系统和流程。\n\n\n\n\n\n# 原则 6：维护信息安全策略：\n\n* **要求 12：** 维护一个涉及信息安全的策略。\n\
  \n违规罚款由支付卡品牌方征收，包括不允许处理信用卡交易、对于轻微违规每月最高 $25,000 的罚款，以及对于导致实际财务数据丢失或被盗的违规行为最高 $500,000\
  \ 的罚款。\n\n### 许可与知识产权\n\n由于定义和起诉计算机犯罪困难，许多检察官试图通过更传统的刑事法规（如盗窃、诈骗、勒索和侵吞）来判定计算机犯罪。除了特定的计算机犯罪法，知识产权和隐私法也旨在保护公众并协助检察官。\n\
  \n![记住](img/remember.png) CISSP 候选应当理解，由于起诉计算机犯罪困难，检察官经常使用更传统的刑事法规、知识产权和隐私法来定罪罪犯。此外，你应该意识到确实存在特定的计算机犯罪法。\n\
  \n知识产权受美国法律以下四类分类的保护：\n\n* 专利\n* 商标\n* 版权\n* 商业秘密\n\n全球范围内的知识产权由各种组织和条约约定、定义并执行，包括世界知识产权组织\
  \ (WIPO)、世界海关组织 (WCO)、世界贸易组织 (WTO)、联合国国际贸易法委员会 (UNCITRAL)、欧盟 (EU) 以及《与贸易有关知识产权协定》(TRIPs)。\n\
  \n许可违规是知识产权侵权最常见的案例之一。其他示例包括抄袭、软件盗版和企业间谍活动。\n\n数字版权管理 (DRM) 尝试通过访问控制技术防止对保护的数字媒体进行未经的复制或传播，从而保护知识产权。\n\
  \n### 专利\n\n根据美国专利商标局 (PTO) 的定义，`patent` 是“授予发明者的一种财产权”。专利授予授予所有者（个人或公司）“排除他人制造、使用、要价出售、出售或进口该发明的权利”。为了获得专利，发明必须具有新颖性、实用性且非显而易见。发明还必须是实体的——思想不能获得专利。可能受专利保护的计算机相关对象包括计算机硬件和固件中的物理设备。\n\
  \n美国 PTO 为申请人已充分说明且经 PTO 证实具有独创性的发明授予专利。美国专利通常自申请之日起有效期 20 年，且仅在美国境内（包括领土和海外属地）有效。专利申请必须向世界各国适当的专利局提交，以在该国家获得专利保护。专利所有者可以向他人授予该发明或其设计的许可，通常需要付费。\n\
  \n美国专利（和商标）法律和规则分别涵盖于 `35 U.S.C.` 和 `37 C.F.R.`。专利合作条约 (PCT) 为专利提供某些国际保护。全球范围内已有\
  \ 130 多国采用了 PCT。专利侵权不由美国 PTO 起诉。相反，专利持有者必须通过适当的法律系统行使他们的专利权。\n\n![记住](img/remember.png)\
  \ 专利授予此前仅有效 17 年，但最近已更改，对于新授予的专利改为 20 年。\n\n### 商标\n\n根据美国 PTO 的定义，`trademark` 是“在商业中使用或意图使用的任何单词、名称、符号或设备，或任何组合，用于识别并将一个制造商或卖者的商品与其他制造或销售的商品区分来”。可能受商标保护的计算机相关对象包括公司品牌和操作系统标志。美国公法第\
  \ 105–330 号《商标法条约实施法》为美国注册商标提供了某些国际保护。\n\n### 版权\n\n`copyright` 是授予“具有作者身份的作品”作者（包括已出版和未出版的）的一种保护形式。版权保护的是表达的实体形式，而非思想或主题本身。根据\
  \ 1909 年最初的《版权法》，出版通常是获得联邦版权的关键。然而，1976 年的《版权法》改变了这一要求，版权保护现在适用于任何原创作品从以实体形式创建之起立即生效。代码或文档是受版权保护的计算机相关对象的示例。\n\
  \n版权可以通过会图书馆版权局进行注册，但作品不需要注册即可受到版权保护。版权保护通常持续到作者终终加 70 年。\n\n### 商业秘密\n\n`trade\
  \ secret` 是公司或个人使用并拥有独占权利的专利或业务相关信息。为了被视为商业秘密，该信息必须满足以下要求：\n\n* **必须真实且非显而易见：**\
  \ 任何完成任务的独特方法都构成商业秘密，特别是当它受到版权保护、专利保护或专有软件或方法的支持，并为该组织提供竞争优势时。\n* **必须为所有者提供竞争或经济优势，因此对所有者具有价值：**\
  \ 例如，Google 的搜索算法——使其深受用户（以及广告商）欢迎的“秘诀”并非众所周知。某些秘密受到了保护的。\n* **必须受到合理的保护以免泄露：**\
  \ 这并不意味着它必须保持绝对且排他的保密，但所有者在保护方面必须尽责。\n\n软件源代码或固件代码是组织可能作为商业秘密保护的计算机相关对象的示例。\n\n\
  ### 出口控制\n\n国家之间存在国际进出口控制，以保护知识产权和某些敏感技术（如加密）。\n\n信息安全专业人员需要了解其组织运营的任何国家或员工出行的国家的相关进出口控制。例如，在机场对笔记本电脑进行搜查并可能没收以执行各种进出口控制，这并不罕见。\n\
  \n### 跨境数据流\n\n与进出口控制相关的是跨境数据流问题。正如本章之前讨论的，数据隐私和泄露披露法在不同地区、国家和美国州之间很大。澳大利亚和欧盟国家是两个例子，其数据隐私法规通常比美国严格得多。许多国家限制或完全禁止其公民的个人数据离开国。\n\
  \n跨境数据流问题和数据驻留（数据物理存储的位置）对于在公共云中运行的组织尤为重要。对于这些组织来说，知道并控制数据存储的位置至关重要。数据驻留和跨境数据流问题应在与云服务提供商的任何协议或合同中解决。\n\
  \n### 隐私\n\n在公民电子信息的背景下，隐私并不是所有人都能理解的。简单来说，隐私有两个主要组成部分：\n\n\n\n\n\n- **数据保护。** 这里，我们指的是书中大部分内容讨论的常规数据安全措施。\n\
  - **恰当的处理和使用。** 这指的是信息所有者选择处理和分发个人数据的方式。\n\n几项重要的隐私和数据保护法律包括美国的《联邦隐私法》（Federal Privacy\
  \ Act）、《健康保险流通性与责任法案》（HIPAA）、经济与临床健康信息技术法》（HITECH）以及《格拉姆-莱奇-布莱利法案》（GLBA），以及英国的《数据保护法》（DPA）。最后，支付卡行业数据安全标准（PCI\
  \ DSS）是行业自我监管的例子——不需要政府法律或法规。\n\nCISSP 候选应该熟悉的几项隐私相关法律包括：\n\n- 1974 年美国联邦隐私法\n-\
  \ 1996 年美国《健康保险流通性与责任法案》(HIPAA)\n- 1998 年美国《儿童在线隐私保护法》(COPPA)\n- 1999 年美国《格拉姆-莱奇-布莱利金融服务现代化法》(GLBA)\n\
  - 2009 年美国《经济与临床健康信息技术法案》(HITECH)\n- 1999 年英国《数据保护法》\n- 欧盟《通用数据保护条例》(GDPR)\n\n###\
  \ 1974 年美国联邦隐私法，5 U.S.C. § 552A\n\n1974 年《联邦隐私法》保护美国政府机构维护的有关美国公民和永久居民的记录和信息。除非在某些特定条件下，否则任何机构不得披露有关个人的任何记录，“除非根据记录所属个人的书面请求，或获得该个人的事先书面同意。”《隐私法》还规定了个人访问和修改其记录的权利，但“合理预见民事诉讼或程序而收集的信息”除外。《隐私法对违规行为规定了个人处罚，包括轻罪指控和高达\
  \ 5,000 美元的罚款。\n\n![warning](img/warning.png) 虽然 1974 年《联邦隐私法》早于我们今天所知的互联网，但请不要忽视它的相关性。《隐私法》的规定比以往任何时候都重要，并且在今天仍然完全有效。\n\
  \n### 1996 年美国《健康保险流通性与责任法案》(HIPAA)，PL 104–191\n\nHIPAA 于 1996 年 8 月签署生效。HIPAA 立法授权国会在从该日期起三年内通过全面的健康隐私立法。当国会未能在截止日期通过立法时，美国健康服务部（HHS）获得了制定\
  \ HIPAA 隐私和安全法规的权限。1999 年 10 月，HHS 发布了名为“个人可识别健康信息的隐私标准”的拟议 HIPAA 隐私法规，并于 2003 年\
  \ 4 月生效。HIPAA 安全标准随后于 2003 年 2 月发布并在 2003 年 4 月生效。必须遵守 HIPAA 法规定的组织被称为*受保护实体*（covered\
  \ entities），包括：\n\n- **支付者（或健康计划）：** 提供或支付医疗护理费用的个人或团体健康计划；例如，医疗保险公司。\n- **医疗保健清理中心：**\
  \ 处理或促进将健康信息的非标准数据元素处理为标准数据元素（如数据仓库）的公立或私立实体。\n- **医疗保健提供者：** 提供医疗或其他健康服务的提供者，如医院、健康维护组织（HMOs）、医生、专家、牙医和咨询师。\n\
  \n违反 HIPAA 的民事处罚包括每次事故 100 美元的罚款，每项规定每个日历年最高 25,000 美元。刑事处罚包括高达 250,000 美元的罚款，以及公司人员可能面临的最长十年监禁。还可能适用额外的州处罚。\n\
  \n2009 年，国会作为 2009 年《美国恢复与再投资法》的一部分通过了额外的 HIPAA 条款，要求受保护实体公开涉及个人信息的安全泄露。（请参见本章稍后的“披露法”部分以讨论披露法。）\n\
  \n### 1998 年《儿童在线隐私保护法》(COPPA)\n\n该法规定了对 13 岁以下儿童在线信息的保护。法律规定了从儿童处收集信息的规则以及获得父母同意的方法。还限制组织向\
  \ 13 岁以下儿童进行营销。\n\n### 1999 年美国《格拉姆-莱奇-布莱利金融服务现代化法》(GLBA)，PL 106-102\n\n格拉姆-莱奇-布莱利（简称\
  \ GLBA）开启了银行、保险公司和证券公司之间的竞争。GLBA 还通过三项规则要求金融机构更好地保护客户的个人身份信息（PII）：\n\n- **金融隐私规则（Financial\
  \ Privacy Rule）：** 要求每家金融机构向每个客户提供有关保护客户隐私的信息。\n- **安全措施规则（Safeguards Rule）：** 要求每家金融机构制定一份正式的书面安全计划，说明该机构将如何保护客户的\
  \ PII。\n- **防止借口保护（Pretexting Protection）：** 要求每家金融机构采取措施，防止社交工程师试图获取机构客户的隐私信息。\n\
  \n违反 GLBA 的民事处罚每次违规高达 100,000 美元。此外，金融机构的官员和董事对每次违规承担个人民事责任，罚金不超过 10,000 美元。\n\n\
  ### 2009 年美国《经济与临床健康信息技术法案》(HITECH)\n\nHITECH 法案作为 2009 年《美国恢复与再投资法》的一部分通过，将 HIPAA\
  \ 合规的范围扩大到包括 HIPAA 受保护实体的业务伙伴。这些包括第三方管理员、健康计划的药品福利经理、索赔处理/结算/转录公司以及执行法律、会计和行政工作的人员。\n\
  \nHITECH 法案的另一个非常重要的规定是促进并在许多情况下资助电子健康记录（EHR）的采用，以提高个人医疗治疗的有效性，提高美国医疗系统的效率并降低医疗总成本。鉴于\
  \ EHR 的广泛采用可能会增加隐私和安全风险，HITECH 法引入了新的安全和隐私相关要求。\n\n在发生“未保护的健康信息”泄露时，HITECH 法要求受保护实体通知受影响个人和美国健康服务部（HHS）部长。法规将*未保护的健康信息（PHI）*定义为未通过技术或方法进行保护，导致未经授权的人员无法使用、读取或识别的\
  \ PHI。\n\n通知要求根据泄露数据量而异：\n\n- 影响超过 500 人的数据泄露必须立即向 HHS、主流媒体和受影响的人员报告，并在 HHS 官方网站上公布。\n\
  - 影响少于 500 人的数据泄露必须向受影响的人员报告，并向 HHS 部长报告。\n\n\n\n\n\n最后，$HITECH 法案》还要求就“使受保护的健康信息（PHI）对于未经授权个人无法使用、读取或破解”的技术和方法发布技术指南。该指南规定数据销毁和加密是使\
  \ PHI 在丢失或被盗时无法使用的操作措施。如果经过了加密且其加密密钥得到妥善保护的 PHI，将为受保护实体提供“避风港”，且不要求其发布数据泄露通知。\n\n\
  ## 英国数据保护法\n\n英国《数据保护法》（`DPA`）由议会于 1998 年通过，适用于任何处理有关生人士敏感个人数据的组织。此类数据包括：\n\n* 姓名\n\
  * 出生日和纪念日\n* 地址、电话号码和电子邮件地址\n* 种族或民族起源\n* 政治观点和宗教（或类似）信仰\n* 贸易或工会成员\n* 身体或心理状况\n\
  * 性取向或生活方式\n* 刑事或民事记录或指控\n\n`DPA` 适用于电子存储的信息，但某些用于商业目的的纸质记录也在涵盖范围内。`DPA` 由八项隐私和披露原则组成，如下：\n\
  \n* “个人数据的处理应当是公平且合法的，且[除非满足某些其他条件（法案规定的），否则不得进行处理]。”\n* “个人数据的获取应仅限于一个或多个特定的合法目的，且不应以任何与该目的或这些目的不兼容的方式进行进一步处理。”\n\
  * “与处理这些数据的目的或这些目的相比，个人数据应当是充分的、相关的，且是不过所必要的（不过度）的。”\n* “个人数据应当是准确的，并在必要时保持更新。”\n\
  * “出于任何目的或这些目的而处理的个人数据，其保留时间不应超过该目的或这些目的所需的时间。”\n* “个人数据的处理应根据本法规定的数据主体权利进行。”\n\
  * “应采取适当的技术和组织措施，防止对个人数据的未经授权或非法处理，并防止个人数据的意外丢失、销毁或损坏。”\n* “个人数据不应传输到欧洲经济区以外的国家或地区，除非该国家或地区能够确保在处理个人数据方面对数据主体的权利和自由提供充分的保护。”\n\
  \n`DPA` 的合规执行由独立官方机构信息专员办公室（`ICO`）负责。处罚措施通常包括罚款，罚款也可能针对公司管理人员实施。\n\n## 欧盟通用数据保护条例\
  \ (GDPR)\n\n欧盟通用数据保护条例被称为 `GDPR`，代表了对 1995 年隐私指令的重大修订。`GDPR` 的亮点包括：\n\n* 要求制定正式的、有记录可查的数据隐私计划，该计划必须指导所有相关业务活动在设计时遵循“默认隐私”和“设计即隐私”原则。\n\
  * 要求从任何欧洲居民处收集个人身份信息的组织必须就收集和使用此类信息获得明确同意。组织收集个人身份信息必须是“选择加入（`opt-in`）”而非“选择退出（`opt-out`）”。换句话说，用户必须选择参与数据收集和使用。\n\
  * 数据主体必须有权查看有关自己的信息、能够请求修正，并能够根据要求删除其数据。\n* 定义了“数据控制者”（`data controller`）：存储并处理个人身份信息的组织。\n\
  * 定义了“数据处理者”（`data processor`）：根据“数据控制者”指示存储并处理个人身份信息的组织。\n* 要求任命“数据保护官”（`DPO`）：一名负责监督组织数据隐私计划创建和运行的个人。\n\
  * 要求在数据泄露后 72 小时内通知所有受影响的数据主体。\n* 允许欧洲机构对违反 `GDPR` 条款的组织处以罚款，罚款最高可达 2000 万欧元或该组织年度营业额（收入）的\
  \ 4%。\n\n### 数据泄露\n\n为了打击身份盗用，美国许多州通过了披露法律，强制组织公开披露可能导致个人数据泄露的安全事件。\n\n尽管这些法律通常包括法定处罚，但这些法律的公开披露要求对组织声誉造成的损害以及潜在的业务损失可能是受影响组织最重大且破坏性最大的方面。因此，公开披露法通过迫使组织实施更有效的信息安全策略和实践，从源头上减少数据泄露发生的风险。\n\
  \n通过要求组织通知个人数据泄露情况，披露法使潜在受害者能够采取防御或纠正性行动，以帮助避免或减少身份盗用造成的损害。\n\n## 加州安全泄露信息法 (SB-1386)\n\
  \n《加州安全泄露信息法》（`SB-1386`）于 2003 年通过，是美国第一个州法律，规定如果其机密或个人数据丢失、被盗或泄露（除非这些数据经过加密），组织必须在“尽可能快且在无不延迟的情况下，符合执法部门合法需要”通知所有受影响的个人。\n\
  \n该法律适用于在加利福尼亚州开展业务的任何组织——即使在该州只有一个客户或员工。即使一个组织没有直接在加州开展业务，它也受该法律约束（例如，如果它为另一家公司存储加州居民的个人信息）。\n\
  \n美国其他州迅速跟进，目前有 46 个州、哥伦比亚特区、波多黎各和美属维尔京群岛拥有公开披露法。然而，这些法律在不同州之间并不一定一致，也并非没有缺陷和批评意见。\n\
  \n例如，直到 2008 年初，印第安纳州州的《安全泄露披露和身份欺骗法》（`HEA 1101`）尚未要求组织披露安全泄露，“除非对[丢失或被盗的]设备的访问受未公开的密码（password）[已添加强调]保护”。印第安纳州的法律随后进行了修订，现在是执行的最严厉的州披露法之一，除非“所有个人信息……经过加密”，否则必须公开披露。\n\
  \n最后，加州和印第安纳州披露法以及大多数其他州法律中的一项规定，如果提供此类通知的成本超过 25 万美元或需要通知的人数超过 50 万，则组织可以避免大部分披露成本。相反，允许使用替代通知，该通知由电子邮件通知、组织网站显眼位置发布以及向州主要媒体发布通知组成。\n\
  \n### 理解职业伦理\n\n伦理（或道德价值观）有助于根据一组原则或价值观描述在特定情况下你应该做什么。伦理行为对于维护作为信息安全专业人员的信誉至关重要，也是维护你\
  \ CISSP 认证的要求。组织通常会定义其核心价值观（连同使命宣言），以帮助员工在努力实现组织使命、目标和任务时理解什么是可以接受和预期的。\n\n\n\n\n\
  \n伦理并非容易辨别的，在伦理与不伦理行为之间往往存在着微妙的界限。不伦理的行为并不等同于违法行为。在某些组织、文化或社会中可以接受的行为，在其他组织中可能是不可接受的甚至是违法的。\n\
  \n伦理标准可以基于共同利益或国家利益、个人权利、法律、传统、文化或宗教。法律与伦理之间一个有用的区别是：法律定义了我们*必须*做什么，而伦理定义了我们*应该*做什么。\n\
  \n关于计算机、互联网和信息的正确使用，存在许多误区，这些误区导致了这一灰色地带：\n\n*   `计算机游戏谬误`：任何未受妥善保护的系统或网络都是可以攻击的目标。\n\
  *   `守法公民的谬误`：只要不涉及物理盗窃，某项活动就不是偷窃。\n*   `防不破谬误`：任何造成的损害其影响都是有限的。\n*   `婴儿手中的糖果谬误`：这太简单了，所以绝不会出错。\n\
  *   `黑客谬误`：计算机提供了宝贵的学习手段，反过来将造福社会。\n    ![remember](img/remember.png) 这里的问题在于`黑客（hackers）`与`破坏者（crackers）`之间的区别。虽然两者可能都有真正的学习欲望，但破坏者是以牺牲他人利益为代价的。\n\
  *   `自由信息谬误`：任何信息都应该是免费的，因此可以通过任何手段获得。\n\n几乎每一个公认的职业团体都定义了其成员必须遵守的行为准则或伦理行为标准。对于\
  \ `CISSP`，它是 `(ISC)²伦理守则`。`CISSP` 候选人必须熟悉 `(ISC)²伦理守则`和征求意见 `RFC 1087`“伦理与互联网”，以获得关于伦理的专业指导（以及你考试所需的知识）。\n\
  \n### 履行 (ISC)² 职业伦理守则\n\n作为 `(ISC)²认证`的要求，所有 `CISSP` 候选人都必须签署并完全支持 `(ISC)²伦理守则`的所有部分。故意或知违反\
  \ `(ISC)²伦理守则`的任何条款都可能导致你面临同行评审小组的审查，并撤销你辛苦得来的 `CISSP` 认证。\n\n`(ISC)²伦理守则`由一个序言和四条准则组成。准则按优先顺序列出，因此任何冲突都应按照下述顺序进行解决：\n\
  \n**序言：**\n\n*   对社会的安全与福利以及公共利益，对我们的委托以及相互之间的责任，要求我们遵守并表现出遵守最高标准的伦理行为规范。\n*   因此，严格遵守本守则是获得认证的必要条件。\n\
  \n**准则：**\n\n*   保护社会、公共利益、必要的公共信任和信心，以及基础设施。\n*   以荣誉、诚实、公正、负责和合法的方式行动。\n*   为委托提供尽职且胜任的服务。\n\
  *   促进并保护本行业。\n\n![tip](img/tip.png) 遵守 `(ISC)² 职业伦理守则`的最佳方法是永远不要参与任何产生即使*违规表象*的活动。做出可疑的行为会让你的认证面临风险，而且可能向他人传达此类活动是可以接受的。记住要以身作则！\n\
  \n### 支持你组织的伦理守则\n\n几乎每个组织都有自己的伦理守则或价值观声明，要求其员工或成员在日常行为中遵循这些规定。作为一名经过 `CISSP` 认证的信息安全专业人士，你被期望成为组织中的领导，这意味着你要为组织的伦理（或价值观）效范，并为他人树立良好的榜样。\n\
  \n除了你组织的伦理守则外，在 `CISSP` 考试中你应当熟悉并遵守的另外两个计算机安全伦理标准是互联网架构委员会的 `IAB`“伦理与互联网”（`RFC 1087`）和计算机伦理研究所的\
  \ `CEI`“计算机伦理十诫”。\n\n#### 互联网架构委员会 (IAB) — 伦理与互联网 (RFC 1087)\n\n由互联网架构委员会 (`IAB`)\
  \ ([[[www.iab.org`](http://www.iab.org))）于 1989 年 1 月发布，`RFC 1087` 将任何故意采取以下行为描述为不伦理且不可接受的：\n\
  \n*   “试图获取对互联网资源的未经授权访问。”\n*   “破坏互联网的预期用途。”\n*   “通过此类行为浪费资源（人员、容量、计算机）。”\n* \
  \  “破坏基于计算机的信息的完整性。”\n*   “损害用户隐私。”\n\n`RFC 1087` 的其他重要原则包括：\n\n*   “访问和使用互联网是一种特权，系统的所有用户都应将其视为特权对待。”\n\
  *   “许多互联网资源由美国政府提供。因此，滥用系统将成为超出简单职业伦理范畴的联邦事务。”\n*   “在进行全网实验时的疏忽既是不负责任的也是不可接受的。”\n\
  *   “从最终分析来看，互联网的健康和福祉是用户的责任，他们必须一致地防止破坏系统并威胁其长期生存能力的滥用行为。”\n\n### 计算机伦理研究所 (CEI)\n\
  \n计算机伦理研究所 (`CEI`; [`http://computerethicsinstitute.org`](http://computerethicsinstitute.org)`)是一个非营利研究、教育和公共政策组织，最初由布鲁金斯学会、IBM、华盛顿咨询小组和华盛顿神学联盟于\
  \ 1985 年创立。`CEI`成员包括计算机科学和信息技术专业人士、企业代表、专业行业协会、公共政策团体和学术界人士。\n\n`CEI` 的使命是“为网络空间提供道德指南针”。它通过计算机伦理教育活动来实现这一使命，包括出版物、国家会议、会员和证书计划、案例库、问伦理学家（Ask\
  \ an Ethicist）在线论坛、咨询以及（最著名的）“计算机伦理十诫”，该守已已 23 种语言出版（此处以英文呈现）：\n\n1.  你不使用计算机伤害他人。\n\
  2.  你不干扰他人的计算机工作。\n3.  你不偷窥探他人的计算机文件。\n4.  你不使用计算机进行盗窃。\n5.  你不使用计算机作虚假证言。\n6. \
  \ 你不复制或使用你未付费的专有软件。\n7.  你不经授权或未获得适当补偿而使用他人的计算机资源。\n8.  你不侵占他人的智成果。\n9.  你要思考你所编写的程序或设计的系统对社会的影响。\n\
  10. 你始终要以确保尊重你的同类的方式使用计算机。\n\n## 开发并实施记录的安全策略、标准、程序和指南\n\n策略、标准、程序和指南彼此都是不一样的，但它们又以各种方式相互作用。理解这些差异和关系，并识别不同类型的策略及其应用至关重要。为了成功开发和实施信息安全策略、标准、指南和程序，你必须确保你的努力与组织的使命、目标和任务保持一致（在本章前面讨论过）。\n\
  \n\n\n\n\n很多时候，技术安全解决方案在缺乏这些重要蓝图的情况下实施。其结果往往是成本高昂且无效的控制，无法统一应用，不支持整体安全策略。\n\n`Governance`（治理）是一个术语，集合代表了策略、标准、指南和程序——以及管理监督——有助于引导组织的日常运营和决策。\n\
  \n### 策略 (Policies)\n\n`security policy`（安全策略）是组织信息安全计划的基础。RFC 2196《站点安全手册》（The\
  \ Site Security Handbook）将安全策略定义为“获得组织技术和信息资产访问权限的人必须遵守的正式规则声明”。\n\n主要的四类策略有：\n\n\
  - **高层管理（Senior Management）：** 关于组织安全目标、组织和个人责任、伦理和信仰以及通用要求和控制的高级管理声明。\n- **合规性（Regulatory）：**\
  \ 通常由联邦、州、行业或其他法律要求强制执行的、非常详尽且简要的策略。\n- **建议性（Advisory）：** 非强制性，但高度建议，如果未能遵守通常会有特定的惩罚或后果。大多数策略都属于此类别。\n\
  - **信息性（Informative）：** 仅提供信息，没有明确的合规要求。\n\n![remember](img/remember.png) 标准、程序和指南是策略的支撑元素，提供了策略的特定实施细节。\n\
  \n![tip](img/tip.png) ISO/IEC 27002《信息技术—安全技术—信息安全管理规范》是信息安全策略的国际标准。ISO/IEC 是国际标准化组织和国际电工委员会。ISO/IEC\
  \ 27002 由 12 部分组成，在很大程度上（但并非完全）与八个 (ISC)² 安全领域重叠。\n\n### 标准及基线（Baselines）\n\n`Standards`（标准）是特定的、强制性的要求，进一步定义并支持更高层次的策略。例如，某标准可能要求使用特定技术，例如使用\
  \ `AES` 进行敏感数据加密的最低要求。标准甚至可以指定要实施的精确品牌、产品或协议。设备或系统的`系统加固标准`将为适用系统定义特定的安全配置设置。\n\n\
  `Baselines`（基线）与标准相似且相关。基线对于识别组织安全架构的一致基础非常有用，并考虑了特定系统的参数，例如不同的操作系统。在建立了一致的基线后，可以在范围内定义适当的标准。\n\
  \n![tip](img/tip.png) 一些组织将其配置文档称为 `standards`（另一些则称为 `standard operating environments`）而不是\
  \ `baselines`。这是一种常见且可以的做法。\n\n### 程序 (Procedures)\n\n`Procedures`（程序）提供了如何实施特定策略并满足标准中定义的标准的详细说明。程序可能包括标准操作程序\
  \ (SOPs)、运行手册 (run books) 和用户指南。例如，某个程序可能是使用特定软件加密产品加密敏感文件的分步指南。\n\n### 指南 (Guidelines)\n\
  \n`Guidelines`（指南）与标准相似，但它们的作用是建议而非强制性要求。例如，指南可能为确定文件的敏感性以及是否需要加密提供提示或建议。\n\n###\
  \ 理解业务连续性需求\n\n业务连续性和和灾难恢复（在第 9 章中详细讨论）并肩工作，为组织在灾难发生时提供继续运营和恢复业务运营的手段。业务连续性和灾难恢复是硬币的两面。当灾难发生时，两者都会采取行动。但它们有不同的目标：\n\
  \n- **业务连续性（Business continuity）：** 处理在灾难发生后保持业务运营的运行——可能在另一个地点或使用不同的工具和流程。这有时被称为业务连续性\
  \ (COOP)。\n- **灾难恢复（Disaster recovery）：** 负责在灾难发生后恢复正常的业务运营。\n\n当业务连续性团队忙于通过可能的多个应急计划之一保持业务运营运行时，灾难恢复团队成员正忙于恢复原始设施和设备，以便他们恢复正常运行。\n\
  \n这里有一个比喻。两个男孩踢了一个大蚁丘——这对蚁群来说是一场灾难。一些蚂蚁忙着拯救卵和食物供应；那是蚂蚁城的业务连续性。其他蚂蚁负责重建蚁丘；那是蚂蚁城的灾难恢复。两个团队都努力确保蚁丘的生存，但每个团队都有自己的角色。\n\
  \n业务连续性与灾难恢复规划具有以下共同元素：\n\n- **关键业务函数的识别：** 业务影响分析 (BIA) 和风险评估（在本章稍后的“实施业务影响分析”节中讨论）识别了这些功能。\n\
  - **可能场景的识别：** 规划团队识别所有可能的人为和自然灾难触发场景，并根据事件发生的概率和对组织的影响进行排序。\n- **专家：** 理解组织关键业务流程的人员。\n\
  \n相似之处到此列表为止。业务连续性规划侧重于*继续*业务运营，而灾难恢复规划侧重于*恢复*原始业务函数。尽管两份计划都涉及业务的长期生存，但它们涉及不同的活动。当发生重大灾难时，两项活动会同时启动，保持关键业务函数的运行（业务连续性）并尽快让一切恢复正轨（灾难恢复）。\n\
  \n业务连续性（以及灾难恢复）规划的存在是因为坏事会发生。希望在灾难事件中生存的组织需要制定正式且广泛的计划——用于保持业务运行的应急计划和用于让运营恢复正的的计划。\n\
  \n在灾难期间保持业务运行可能就像一只手背在身后在玩杂耍（我们首先想到了转盘子和单手挂纸，但我们的大多数读者可能太年轻了无法理解这些）。你最好提前计划你将如何做，并进行练习！你知道，这可能在晚上发生（黑暗中单手杂耍要困难得多）。\n\
  \n在开始业务连续性规划之前，项目团队中的每个人必须制定并理解一些基本定义和假设。这些关键事项包括：\n\n- **高层管理支持：** 业务连续性计划 (BCP)\
  \ 的开发是非常耗时的，没有直接或实体的`投资回报率` (ROI)。为了确保业务连续性规划项目的成功，你需要组织高层管理的支持，包括充足的预算、人力以及支持该项目的可见声明。高层管理需要做出明确声明，识别责任方，以及业务连续性规划项目的重要性、预算、优先级、紧迫性以及时机。\n\
  \n\n\n\n\n- **高层管理的参与：** 高层管理不能仅仅对业务连续性计划项目点头认可。由于高层经理和董事对组织从灾害中恢复的能力负隐含和显性的责任，高层管理需要对业务连续性计划工作有某种程度的直接参与。这些人可能挽救的职业可能是他们自己的。\n\
  - **项目团队成员：** 你想让谁加入业务连续性计划项目团队？团队必须代表所有相关的职能和业务部门。许多团队成员可能兼顾日常工作，因此团队需要制定一个现实的时间表，以确定业务连续性计划项目的进展速度。\n\
  - **由谁来带甜圈：** 因为业务连续性计划会议的出席率至关重要，高质量的甜圈是成功的关键要素。\n\n一个业务连续性计划项目通常包含四个部分：范围确定、业务影响分析（`BIA`）、业务连续性计划（`BCP`）和实施。我们在接下来的章节中讨论这些部分。\n\
  \n## 开发并记录项目范围和计划\n\n业务连续性计划项目的成功和有效性很大程度上取决于高层管理和项目团队是否正确定义了其范围。业务流程和技术可能会使情况复杂化并使这项任务变得困难。例如，分布式系统某些关键业务功能依赖至少某些桌面系统，这使得范围扩大到了核心功能之外。地理位置分散的公司（通常是合并的结果）也使问题变得复杂。\n\
  \n此外，大型公司更加复杂也是可以理解的。一个职能开始和结束的边界往往是模糊的，有时记录不全且未被充分理解。\n\n政治压力也会影响业务连续性计划项目的范围。一个*认为*自己至关重要但属于业务连续性计划项目范围之外的部门，可能会游说将其纳入项目。每个人都想变得重要（有些人只是想*看起来*很重要）。你需要高层管理对范围的支持（即项目团队*真正*需要包含的内容和不包含的内容），以给这些政治游戏画句号。\n\
  \n如果你有由于业务连续性计划项目团队薄弱或缺乏经验，`scope creep`（项目范围超出原始意图的情况）可能会变成 `scope leap`（范围跨越）。为了项目的成功，强有领导者必须对项目范围做出理性决策。记住，你可以在项目的后期迭代中更改业务连续性计划的范围。\n\
  \n项目团队需要在范围过窄（导致计划无效）和范围过宽（导致计划过于冗肿）之间找到平衡。\n\n一个完整的 `BCP` 由几个部分组成，不仅处理关键业务功能的持续性，还处理支持这些关键功能的所有功能和资源。`BCP`\
  \ 的各种元素将在后续章节中描述。\n\n### 应急响应\n\n必须为每种可能的灾害类型确定应急小组。这些响应小组需要 `playbooks`（详细的书面程序和清单）来保持关键业务功能的运行。\n\
  \n书面程序至关重要，原因有两个：第一，在灾害后执行关键功能的人可能并不熟悉这些程序：他们通常并不执行这些功能（在灾害期间，通常执行该功能的人可能无法可用）。其次，在灾害期间执行关键功能时，团队可能需要使用与正常情况下不同的程序和流程。此外，灾害发生时的环境可能会让人们感到无无适措；有了书面程序可以引导他们采取行动（类似于某些火警器上的“破窗应急”说明，以防你忘记该做什么）。\n\
  \n### 损害评估\n\n当灾害发生时，需要请专家来检查现场并确定损害程度。通常，你需要能够评估建筑损坏的专家，以及对任何特殊设备和机器损坏的专家。\n\n\
  根据灾害的性质，你可能需要分阶段进行损害评估。首次评估可能涉及快速巡视以寻找明显的损坏，随后是更耗时、更详细的评估，以寻找你无法立即发现的问题。\n\n损害评估决定了组织是否仍可以使用建筑和设备，它们在经过一些维修后是否可以使用这些物品，或者它们是否必须完全放弃这些物品。\n\
  \n### 人员安全\n\n在任何灾害中，人员安全都是首要任务，优先于建筑、设备、计算机、备份带等。人员安全至关重要，不仅是因为人类生命的内在价值，还是因为业务的运行依靠的是人而不是物理资产。\n\
  \n### 人员通知\n\n`BCP` 必须包含某些条款，通知所有受的人员灾害已发生。组织需要建立多种方法来通知关键业务连续性人员，以防公共通信基础设施中断。\n\
  \n并非所有灾害都是显而易见的：火灾或水管破裂是局部事件，而非区域性事件。在龙卷风或洪水等事件中，即使住在几英里外的员工可能不知道业务状况。因此，无论情况如何，组织都需要一个与员工沟通的计划。\n\
  \n在整个灾害及其恢复过程中，必须向管理层提供定期状态报告以及关键战术问题的更新，以便管理层对齐资源，以支持基于应急方案运行的关键业务运营。例如，公司设施部门的经理可以借出关键部门所需的设备，以便它们能够继续运行。\n\
  \n### 备份和媒体存储\n\n硬件和软件会出现问题，导致数据损坏或无法访问。一旦丢失，就彻底丢失了！因此，各地的 IT 部门会在磁带、可移动磁盘、外部存储系统或云端对其关键数据进行备份。\n\
  \n这些备份必须定期执行，通常每天一次。对于拥有本地系统的组织，备份媒体还必须存储在境外，以防存放原始系统的设施损坏。在数据中心*内部*存放备份带对于快速恢复数据可能很方便，但如果备份带与其相应的系统一起销毁，则毫无价值。对于使用云系统的组织，问题是相同的，但技术略有不同：必须将数据备份（或复制）到不同的地理位置，这样无论发生什么都能恢复数据。\n\
  \n对于拥有大量数据的系统，必须很好地*理解*这些数据，以确定需要执行何种备份（实时复制、全量、差异和增量备份）以及频率。考虑以下因素：\n\n- 执行备份所需的时间。\n\
  - 恢复数据所需的努力。\n- 从备份中恢复数据的程序，与其他恢复数据的方法相比。\n\n\n\n\n例如，考虑一下你从备份磁带中恢复应用程序软件的速度是否比从其发布介质（原始\
  \ `CD-ROMs` 或下载的安装文件）安装要更快。只需确保在从发布介质重新安装软件时，你可以恢复配置设置即可。此外，如果数据库的大部分是静态的，你真的需要每天都对其进行备份吗？\n\
  \n你必须仔细选择备份介质和其他其他材料（文档等）的异地存储。需要考虑的因素包括异地存储设施的生存能力、异地设施到数据中心的距离、介质运输以及备用处理站点。该设施需要足够近，以确保介质取回不会花费太长时间（`how`\
  \ 多长时间取决于组织的恢复需求），但不能太近，以至于该设施会卷入与业务相同的自然灾害中。\n\n基于云的数据复制和备份服务是异地备份介质存储的可行替代方案。当今的互联网速度使得关键数据备份到云存储提供商成为可能——这通常比将磁带从异地设施返回并从中恢复数据要快得多。\n\
  \n![tip](img/tip.png) 一些组织拥有一个或多个巨大的数据库，以至于这些组织字面上无法（或者至少没有）将它们备份到磁带上。相反，他们在其他城市的其他计算机上保留了数据库的一个或多个复制副本。业务连续性规划人员在制定连续性计划时需要考虑这种可能性。\n\
  \n异地介质存储的目的是确保在主数据中心系统受损时，能够获得最新的数据。\n\n### 软件托管协议\n\n你的组织应该考虑与支持关键业务功能的软件供应商签署\
  \ `软件托管协议`（即软件供应商将其软件代码的副本发送给第三方托管机构妥善保存）。如果软件供应商遭遇了不可弥越的灾难（可能包括破产），你的组织必须考虑持续维护这些关键应用程序的所有方案，包括内部支持。\n\
  \n### 外部沟通\n\n企业传关部、外部事务部以及（如果适用）投资者关系部都应该制定好计划，向媒体、客户和公众传达有关灾害的实情信息。如果你希望组织能够继续与外界进行沟通，就此为这些功能制定应急预案。灾害期间的开放式沟通至关重要，这样客户、供应商和投资者就不会产生恐慌（如果他们不知道灾害的真实程度，可能会产生恐慌）。\n\
  \n应急通信计划需要考虑到某些公司设施或人员可能无法使用的情况。因此，你需要确保与通信计划相关的数据和程序也是安全的，以便它们在任何情况下都可用。\n\n###\
  \ 公用事业\n\n支持时间关键业务功能的数据处理设施在停电时必须保持运行。尽管每种情况都不同，但原理是相同的：业务连续性规划团队必须确定数据处理设施在没有公用电的情况下必须持续运行多久。电力工程师可以找出你所在区域典型（我们不想称之为\
  \ `routine`）停电的时长，并进行计算得出平均停电时间。通过使用这些信息以及数据中心设备和环境设备的清单，你可以确定组织是否仅需要不间断电源（`UPS`），还是需要\
  \ `UPS` `and` 电电发电机。\n\n企业可以使用不间断电源（`UPSs`）和应急电发电机在长时间停电期间提供电力。如果组织认为在灾害期间关闭系统会更好，那么\
  \ `UPS` 也有利于受控关机。企业还可以使用独立电源系统（`SPS`），这是离网系统的另一种术语，即通过太阳能、风能、水能或员工疯狂踩动健身自行车来发电（我们对这一点是开玩笑的）。\n\
  \n在极长时间停电（超过一天或两天）的情况下，拥有一个发电机燃料补充计划也是至关重要的。\n\n### 物流与供应\n\n业务连续性规划团队需要研究在灾害中必须持续进行的关键功能的`每一个方面`。维持关键业务所需的每种资源都必须被识别，然后针对每种可能的灾难场景进行考虑，以确定必须制定哪些特殊计划。例如，如果业务运营依赖材料的即时装货，而地震关闭了该地区唯一的公路（或机场或海/湖港），则必须提前确定获取材料的替代手段。或者，可能需要储备这些材料的应急配给，以便业务功能能够不中断地继续。\n\
  \n### 防火防水\n\n许多自然灾害会破坏公用事业，包括水供应或交付。在灾害中断供水的情况下，新问题随之产生。如果发生火灾，你的设施可能在没有消防手段的情况下运行。\n\
  \n在许多地方，如果企业无法证明自己可以使用其他手段（如 `FM-200` 惰性气体）有效灭火，可能会被命令关闭。另一方面，如果水供应被中断，你还有其他问题要应对，例如饮用水和厕所用水。没有水，你就彻底完蛋了！\n\
  \n我们将在第 5 章中更详细地讨论防火保护。\n\n### 文档\n\n任何关键业务功能都必须在灾害发生后能够继续运行。为了确保你可以维持运营，你需要为每件关键设备，以及组织在特定地点执行的每个关键流程和程序提供所有相关文档。\n\
  \n不要被硬件和软件产品不再附带文档的这一趋势所误导，认为其是理所当然的。许多供应商`only` 通过互联网提供文档，或者对纸质版收取额外费用。但许多类型的灾害可能会中断互联网通信，导致操作缺乏使用和管理工具或应用程序的说明。\n\
  \n至少一套纸质版（或 `CD-ROM` 软拷贝）文档——包括你的 `BCP` 和灾难恢复计划 (`DRP`)——应该存储在存储组织备份带的同一个异地存储设施中。最好还能通过\
  \ `USB` 存储设备向所有相关人员分发 `BCP` 和 `DRP` 文档的电子副本（带有加密）。\n\n如果上述内容对你来说像是上古董，那么你的组织可能已经完全位于云端了。在这种情况下，你可能更倾向于维护所有所需文档的多个软拷贝，以便在需要时可以使用。\n\
  \n在电子手段不可用时，连续性和恢复文档必须存在纸质副本。\n\n### 数据处理连续性规划\n\n数据处理设施对现代业务至关重要，以至于对其投入大量的关注。通常，这归结为这些变量：业务将在哪里以及如何持续其数据处理功能。\n\
  \n由于建立数据中心非常昂贵且耗时，更符合商业做法是准备一个可用的备用处理站点。站点的类型有\n\n\n\n\n- **冷备地 (Cold site):** `cold\
  \ site` 基本上是一个带有环境设施（如 `UPS`；加热、通风和空调 `HVAC` 等）但没有计算设备的空机房。这是成本最低的方案，但承担负载需要更多时间，因为计算机需要从某处引入并安装，并且需要加载数据和应用程序。还需要安装与其他地点的连接。\n\
  - **温备地 (Warm site):** `warm site` 基本上是一个 `cold site`，但已经已经部署了计算机和通信链路。为了接管生产运营，你必须向计算机加载应用程序软件和业务数据。\n\
  - **热备地 (Hot site):** 这无疑是最昂贵的选项，你为 `hot site` 配置了与生产系统相同的计算机，并使应用程序更改、操作系统更改甚至补丁与实时生产系统的对应版本保持同步。你甚至可以通过某种镜像或事务复制技术，保持热备地中业务数据的实时更新。由于组织会培训员工如何操作组织的业务应用程序（且员工拥有文档），运营人员知道在任何时候如何接管数据处理业务工作。热备地可能是基于云的，也可能位于托管数据中心。\n\
  - **互惠备地 (Reciprocal site):** 你的组织与另一组织签署`互惠协议`，在灾难发生时双方均承诺提供各自数据中心的可用性。在数据中心还稀缺的年代，许多组织会进行这种安排，但近年来已已不再流行。\n\
  - **多数据中心 (Multiple data centers):** 较大的组织可以考虑在两个或多个相隔数百（或更多）英里的区域数据中心运行日常运营。这种安排的优势在于，组织无需与外部供应商就热/温/冷备地进行安排，且员工已在现场，并熟悉业务和计算机操作。\n\
  - **云备地 (Cloud site):** 主要信息处理在云端的组织可能会在多个区域使用云资产，并可能使用一个以上的云提供商。许多主要在本地进行处理的组织为了灾备恢复目的会采用混合云基础设施——这是公司向云迁移的常用方式。根据所需的就绪程度，云备地可以像热备地、温备地或冷备地一样就，这取决于投入到保持云备地处于生产运营状态的资源。\n\
  \n热备地提供了最快速恢复能力，但由于维护其就绪状态所需的投入，其成本也最高。\n\n[Table 3-1 对这些选项进行了对比分析。\n\n| 特性 | 热备地\
  \ | 温备地 | 冷备地 | 多数据中心 | 云备地 |\n| --- | --- | --- | --- | --- | --- |\n| 成本 | 最高\
  \ | 中等 | 低 | 无额外 | 可变 |\n| 备计算机 | 是 | 是 | 否 | 是 | 是 |\n| 备连接 | 是 | 是 | 否 | 是 | 是\
  \ |\n| 备数据 | 是 | 否 | 否 | 是 | 可变 |\n| 配置人员 | 是 | 否 | 否 | 是 | 否 |\n| 典型就绪提前时间 | 分钟到小时\
  \ | 小时到几天 | 天到几周 | 分钟到小时或更长 | 分钟到小时 |\n\nTABLE 3-1 数据处理连续性计划站点对比\n\n### 开展业务影响分析\n\
  \n`业务影响分析`（`BIA`）描述了预计灾难对业务运营产生的影响。业务连续性计划中这一重要的早期步骤有助于组织识别出哪些业务流程更具韧性，哪些更脆弱。\n\n\
  灾难的影响包括定量影响和定性影响。`定量影响`通常是财务方面的，例如收入损失或生产产出减少。`定性影响`则更多地与货物和/或服务的质量有关。\n\n任何称职的\
  \ BIA 都需要良好地完成以下任务：\n\n- 执行`脆弱性评估`——与其说是针对应用程序/基础设施的脆弱性评估，不如说是宏观的业务流程脆弱性评估。\n- 执行`关键性评估`——确定某个特定业务功能对组织持续生存能力有多有多重要。\n\
  - 确定`最大可忍机时间`。\n- 建立恢复目标。\n- 确定资源需求。\n\n你可以在后续章节中获取这些活动的详细信息。\n\n#### 脆弱性评估\n\n\
  通常，`BIA` 包含`脆弱性评估`，有助于掌握业务关键系统中显而易见和不那么明显的弱点。`脆弱性评估`包含定量（财务）和定性（运营）部分，类似于本章稍后介绍的`风险评估`。\n\
  \n`脆弱性评估`的目的是确定关键业务功能丧产生的影响——包括定量和定性的影响。\n\n定量损失包括：\n\n- 收入损失\n- 运营资本损失\n- 市场份额损失\n\
  - 因个人责任导致的损失\n- 费用增加\n- 因违反业务合同导致的罚金\n- 违反法律法规（这可能导致罚金和民事罚款等法律成本）\n\n定性损失包括以下内容的损失：\n\
  \n- 服务质量\n- 竞争优势\n- 客户满意度\n- 威望和声誉\n\n`脆弱性评估`识别出`关键支持领域`，这些业务功能如果丧失，将由于危及关键业务流程或人员的生命与安全，而给业务造成重大损害。`脆弱性评估`应仔细研究关键支持领域，以识别这些区域继续运行所需的资源。\n\
  \n定量损失还包括由于执行应急预案而产生的任何更高成本导致的运营费用增加。换句话说，计划者需要记住考虑灾难情况下可能产生更高的运营成本。\n\n#### 关键性评估\n\
  \n业务连续性计划团队应对对所有高层业务功能（例如：客户支持、订单处理、退货、现金管理、应收账款、工资发放等）进行盘点，并按关键性进行排序。团队还应该描述每个功能中断对整体业务运营的影响。\n\
  \n团队成员需要估计灾难事件的持续时间，以便有效准备`关键性评估`。项目团队成员需要根据灾难损害特定业务功能的时间长度考虑中断的影响。你可以看到持续一分钟的中断与持续一小时、一天、一周或更长的中断对业务影响的巨大差异。通常情况下，业务功能的关键性取决于其损害对业务产生的影响程度。\n\
  \n![记住](img/remember.png) 计划者需要考虑在业务周期中不同时间发生的灾难，无论该周期对组织而言是什么。在最忙的季节（某个月或某一年）发生灾难的响应，可能与其它期间的响应有很大不同。\n\
  \n\n\n\n\n遵循组织架构图有助于业务连续性计划项目团队考虑关键流程中的所有步骤。沿着组织架构图走，在每个经理或总监的位置停下来，并提问：“他在做什么？”、“她在做什么？”以及“由来负责提交\
  \ TPS 报告？”。这种脑力漫步可以帮助唤起记忆，帮助你更好地看到组织大蓝图的所有部分。\n\n![tip](img/tip.png) 当你审阅组织架构图以确保其涵盖了组织的所有区域时，你很容易忽略可能未显示在架构图上的外包功能。例如，如果你的组织外包了应付账款（A/P）功能，如果你没有在架构图上看到它，你可能会漏掉这个细节。好吧，你可能会注意到*所有*应付账款功能的缺失。但如果你的组织只外包了部分应付账款——例如，一个负责检测和调查应付账款欺诈的小组（寻找暗示存在虚假付款请求的付款模式）——那么你的组织架构图可能就没有包含这一关键功能。\n\
  \n## 建立最大容忍时间 (MTD)\n\n关键性评估（我们在本章前面的 `Criticality Assessment` 部分讨论过）的扩展是对每个关键业务功能最大容忍时间（`MTD`——也称为最大容忍中断时间或\
  \ `MTPD`）的声明。`最大容忍时间`是指关键业务功能在公司遭受重大且持久损害之前可以停止的最长时间。\n\n例如，想象一下你最喜欢的在线商家——一家书店、一家拍卖行或一家在线交易公司——宕机了一小时、一天或一周。在某个时刻，你必须意识到长时间的中断会导致“沉船”，意味着业务无法生存。确定\
  \ `MTD` 涉及找出组织因灾难会在何时遭受永久、可衡量的损失。在线零售商知道，即使是短时间停机也意味着某些客户可能会切换品牌并将业务流向他处。\n\n将 `MTD`\
  \ 评估作为确定业务功能关键性——以及优先级的主要因素。一个只能忍受两小时停机的功能，其优先级显然高于另一个可以忍受几天停机的功能。\n\n`MTD` 是衡量关键业务功能在不遭受不可接受的后果（可能威胁到组织的实际生存能力）的情况下可以被中断的最长时间。\n\
  \n## 确定最大容忍中断时间 (MTO)\n\n在关键性评估期间，你为每个关键业务功能建立最大容忍中断时间（`MTO`）声明。`最大容忍中断时间`是指关键业务功能在应急或替代处理模式下运行的最长时间。这很重要，因为在许多情况下，应急或替代处理模式的吞吐量或质量较低，或者成本更高。虽然可以通过替代处理模式的过渡期来确保组织的生存，但长期业务模式可能无法维持吞吐量、质量、成本或替代处理模式与正常处理相比的任何方面的差异。\n\
  \n## 建立恢复目标\n\n当你为每个业务过程建立关键性评估、`MTD` 和 `MTO` 时（我们在前面的节中讨论过这些），计划团队就可以建立恢复目标。这些目标代表了从灾难开始到关键流程恢复运行所需的时间。\n\
  \n每个业务过程通常建立两个主要的恢复目标：恢复时间目标（`RTO`）和恢复点目标（`RPO`）。我们将在接下来的节中讨论这些目标。\n\n## 恢复时间目标\
  \ (RTO)\n\n`恢复时间目标`（`RTO`）是指业务在灾难后必须恢复的最长时间。\n\n一个没有 BCP 但遭受地震或飓风等严重灾难的组织可能会经历一到两周或更长的恢复时间。组织可能需要这段时间来选择新的数据处理地点、购买新系统、加载软件和数据并恢复处理。无法忍这种长时间停机的组织需要建立较短的\
  \ `RTO`，并确定满足该目标所需的投资水平。\n\n### 恢复点目标 (RPO)\n\n`恢复点目标`（`RPO`）是指灾难发生时数据可能丢失的最长时间。\n\
  \n典型的数据备份计划是每天一次。如果灾难在备份完成之前发生，组织可能会丢失整一天的信息。这是因为系统和数据恢复通常使用最后一次良好的备份。需要更短 `RPO`\
  \ 的组织需要找到一种比每天一次更频繁地复制交易数据的方法。\n\n以下是组织建立 `RPOs` 的示例：\n\n* **手动输入发票：** 应付账款部门打开邮件并手动输入从供应商处收的发票。数据录入员整天都在输入发票。如果在业务结束运行备份之前发生灾难（如果该灾难需要组织从备份带重建系统），这些录入员必须重新输入整天的数据。\n\
  * **在线订单：** 一家小型企业开发了一个在线 Web 应用，客户可以使用它下单。每天结束，订单部门运行一个程序打印出当天所有的订单，发运部门在第二天处理这些订单。如果当天任何任何时间发生灾难，企业将丢失自上一日备份以来产生的所有在线订单。\n\
  \n如果你设定的上述列表等流程的 `MTD` 小于一个工作日，则组织需要采取措施比每天一次更保存在线数据。\n\n许多组织考虑异地备份介质存储，每天将备份带运输到异地，或者每天向异地位置进行电子库备份。火灾等事件可能会同时损坏计算机和备份介质。\n\
  \n## RTO 和 RPO 的工作原理\n\n`RTO` 和 `RPO` 目标是系统恢复的不同衡量标准，但它们共同工作。当团队建立拟议目标时，团队成员需要理解每个目标的工作原理。\n\
  \n从表面上看，你可能认为 `RPO` 应该比 `RTO` 短（或者可能相反）。事实上，不同的业务和应用程序呈现出不同的业务需求，可能导致 `RPO` 小于 `DTO`、等于\
  \ `RTO` 或大于 `RTO`。以下是一些示例：\n\n* **RPO 大于 RTO：** 业务可以在 4 小时内恢复应用程序（`RTO`），最大数据丢失为\
  \ 24 小时（`RPO`）。因此，如果发生灾难，业务可以在 4 小时内重新运行应用程序，但系统中恢复的数据是事故发生前 24 小时的数据。\n* **RPO\
  \ 等于 RTO：** 业务可以在 12 小时内恢复应用程序（`RTO`），最大数据丢失为 12 小时（`RPO`）。你可能想象这种场景：应用程序实时镜像数据到备份系统。如果发生灾难，灾难恢复团队需要\
  \ 12 小时来启动备份系统。在团队启动系统后，业务拥有直到 12 小时前的数据——即主系统故障的时间。\n\n\n\n\n\n- **RPO 小于 RTO：**\
  \ 灾难恢复团队可以在 4 小时（RTO）内恢复应用程序，数据最多丢失 1 小时（RPO）。这种情况是如何发生的呢？可能是一个后台事务过账应用程序（它接收并处理来自订单处理应用程序的数据）发生了故障。如果后台应用程序停机\
  \ 4 小时，那么来自订单处理应用程序的数据可能会在其他某处被缓存，当后台应用程序恢复处理时，它就可以接收并处理这些等待中的输入数据。\n\n## 定义资源需求\n\
  \n`BIA` 中的 `Resource Requirements`（资源需求）部分列出了组织为了继续运营每项关键业务功能而所需的资源。在资源有限的组织中（几乎每个组织都是如此），最关键的功能将获得优先选择权，而优先级较低的功能则只能获得剩余资源。\n\
  \n理解支持业务流程所需的资源，有助于项目团队确定该流程的应急预案需要包含哪些内容，以及该流程如何在应急模式下运行并进行恢复。\n\n所需资源的示例包括：\n\n\
  - **系统和应用程序：** 为了让业务流程继续运行，可能需要一个或多个 IT 系统或应用程序——不仅包括主要的辅助应用程序，还包括主应用程序持续运行所需的其他系统和应用程序。根据组织的主要和备用处理资源的性质，这些系统可能是物理的、虚拟的或云端的。\n\
  - **供应商和合作伙伴：** 许多业务流程需要外部组织提供材料或服务，如果没有这些资源，业务流程将无法继续运行。\n- **关键人员：** 大多数业务流程都需要若干经过专门培训或配备相应设备的员工——或者临时工作人员（如承包商或其他公司的人员）来运行业务流程和操作系统。\n\
  - **业务设备：** 从 `PBXs` 到复印机、邮资机、`POS`（销售点）机、红色订书器以及任何支持关键业务流程所需的其他设备。\n\n![tip](img/tip.png)\
  \ 当你识别出复杂业务流程所需的资源时，你可能希望识别有关每个资源的额外信息，包括资源所有者、关键性和依赖关系。\n\n### 制定业务连续性计划\n\n在定义了业务连续性计划项目的范围并制定了\
  \ `BIA`、`Criticality Assessment`（关键性评估）、`MTDs`（最大中断时间）和 `MTOs`（最大恢复时间）后，你将清楚：\n\n\
  - 组织中哪些部分包含在计划内。\n- 在组织的这部分中，哪些业务功能如此关键，以至于如果这些功能中断长时间（即使是短时间），业务将会失败。\n- 当其中一个关键功能故障时，对业务影响的一般程度。这一想法源于定量和定性数据。\n\
  \n业务连续性计划项目中困难的部分现在开始了了：你需要制定在灾难发生时继续执行每项关键业务功能的策略，这被称为 `Continuity Strategy`（连续性策略）。\n\
  \n当你制定 `Continuity Strategy` 时，你必须抛开政治考虑，关注关键业务功能那些令人痛苦的细节。你需要大量的咖啡、几个披萨、几桶 `Rolaids`（胃药）以及清醒的头脑。\n\
  \n### 使你的业务连续性计划项目取得成功\n\n对于项目中重要且耗时的 `Continuity Strategy` 阶段，你需要遵循以下指南：\n\n- **实事求是。**\
  \ 没有偏见。没有立场。没有政治。。没有偏袒。没有人情。你正试图在灾难袭来之前确保业务的生存。\n- **建立较小的专家团队。** 每项关键业务功能都应该有专门负责该功能的团队。该团队的工作是仅分析某一个关键业务功能，并弄明如何在发生某种灾难的情况下保持其运行。为每个团队挑选合适的人选——那些*真正*理解他们正在检查的业务流程细节的人。\n\
  - **头脑风暴。** 适当的头脑风暴考虑所有的想法，即使是愚蠢的想法（在范围内）。即使是一个听起来很蠢的想法也能引发`好`主意。\n- **让团队相互分享结果。**\
  \ 负责独立连续性策略的团队可以互相获取灵感。每个团队可以分享过去一两周的工作亮点。他们说的某些内容可能会激发其他团队的创意。通过举办这些分享会议，你可以改进整个工作。\n\
  - **不要在团队内部或团队之间鼓励竞争或政治手段。** 不要让团队相互对立。识别成功因素不是零和博弈：每个人都需要做好出色的工作。\n- **保留一名业务连续性计划导师/专家。**\
  \ 如果你的组织内部没有经验丰富的业务连续性计划员，你需要聘请一位顾问——一个曾帮助其他组织制定计划的人员。比这更重要的是，确保你雇佣的顾问在灾难发生在他所咨询的业务上时曾在现场，并见过\
  \ `BCP`（业务连续性计划）的运行。\n\n### 简化大型或复杂的关键功能\n\n某些关键业务功能可能太大太复杂，无法一次性检查。你可以将这些复杂的功能拆分为更小的组件，可能如下：\n\
  \n- **人员：** 团队是否已经识别了保持功能运行所需的关键人员——更准确地说，是关键子功能？\n- **设施：** 如果该功能的主要设施不可用，业务可以在哪里执行该功能？\n\
  - **技术：** 哪些硬件、软件和其他计算/网络组件支持该关键功能？如果部分或全部组件不可用，哪些其他设备可以支持关键业务功能？你需要以不同的方式执行功能吗？\n\
  - **杂项：** 支持关键业务功能还需要哪些物资、设备和服务？\n\n分析流程就像拆解积木房子——你必须将它们分解到单个组件的水平。你*确实*需要理解是最大的流程中的每个步骤，以便制定良好的连续性计划。\n\
  \n#### 策略文档\n\n现在是大家喜欢的部分：文档记录。每个关键功能的连续性计划细节必须以细微、逐步的方式进行详细描述。\n\n为什么？制定策略的人可能*不是*执行策略的人。制定策略的人可能会在公司中职位变更或彻底离职。或者实际灾难的范围可能足够大，以至于关键人员无法到位。任何怀疑者都应该考虑\
  \ 911 事件，以及这场灾难对许多几乎失去了所有所有人和每样东西的公司的影响。\n\n\n\n\n编写业务连续性计划（BCP）已有最佳实践。正因如此，你可能希望身边有一位专家。每小时\
  \ 300 美元，顾问可以花费几周时间开发模板。但要小心——你的顾问可能只是从业务连续性计划网站下载模板，稍作修改，然后剩下的时间都用来玩消消糖。为了确保请到一位可靠的顾问，请采取那些老办法：检查他的参考人，要求索要作品样本，看看他是否有一个不错的\
  \ LinkedIn 页面。（关于最后一点，我们是在开开玩笑的！）\n\n## 执行 BCP\n\n当 BCP 文档完成编写、评审、编辑、装入三环活页夹，并通过优盘或在线文件存储账户分发后，这确实是一项成就。然而，工作尚未结束。BCP\
  \ 需要高管理层的支持，计划必须在整个组织内公布并普及，并且必须有一名或多名专门负责维护计划更新的人。噢，还有，计划还需要测试！\n\n### 获取高管理层的批准\n\
  \n在整个计划完成记录并经过所有利益相关者的评审后，是时候让高管理层审查并批准它了。高管理层不仅必须批准计划，还必须 `publicly` 公开批准。我们说的“公开”不是指大众；而是指高管理层应该让公司内部周知他们支持业务连续性计划的过程。\n\
  \n需要高管理层的批准，以便组织中所有受影响和参与的员工都能理解应急计划的重要性。\n\n### 提高组织意识\n\n组织中的每个人都需要了解该计划以及他们在其中的角色。你可能需要为大量的人员建立培训，以便他们在灾难发生时能够\
  \ `be there`（现场）。\n\n组织中的所有员工都必须了解 BCP。\n\n### 测试计划\n\n定期测试 BCP 可以确保所有执行计划所需的关键人员都理解自己的角色和职责，并有助于在组织发生变化时保持计划更新。BCP\
  \ 测试方法与 DRP 测试方法（已在 `第 9 章` 中讨论）类似，包括：\n\n*   审读（Read-through）\n*   演练（Walkthrough）\n\
  *   模拟（Simulation）\n*   并行测试（Parallel）\n*   全面中断（Full interruption）\n\n请参 `第 9 章`\
  \ 以了解这些测试方法的完整解释。\n\n### 维护计划\n\n不，计划并没有结束。它才刚刚开始！现在，业务连续性计划负责人 `person`（此时项目团队成员已经领取了他们的纪念牛仔衫、马克杯和鼠标垫，并转向了其他项目）需要定期\
  \ `chase` 决策层，以确保他们了解环境的所有重大变化。\n\n事实上，如果业务连续性计划负责人在流程的这一阶段还有领导力，他需要开始参加变更控制委员会和\
  \ IT 指导委员会（无论公司如何称呼它们）的会议，并记录笔记，这些笔记可能意味着 BCP 文档中的某些细节需要更改。\n\n![tip](img/tip.png)\
  \ 修改 BCP 比凭空创建它容易得多。每年一次或两次，专业人士需要检查 BCP 中详细的策略和程序文档，以确保它们仍然有效——并在必要时进行更新。\n\n![tip](img/tip.png)\
  \ 你可以通过 Peter H. Gregory 写的《IT Disaster Recovery Planning For Dummies》了解更多关于业务连续性和灾难恢复计划的内容。\n\
  \n## 贡献人员安全政策\n\n组织需要清晰记录的人员安全政策和程序，以便于信息的使用和保护。保护业务及其重要信息资产有许多基本实践。这些基本实践都与人——而非技术——如何合作来支持业务有关。\n\
  \n这统称为 `administrative management and control`。\n\n注意：我们倾向于使用术 `essential practices`（基本实践）而非\
  \ `best practices`（最佳实践）。原因很简单：`Best practices` 指针对业务问题所能采用的最实践和技术，而 `essential\
  \ practices` 指被认为在组织中实施必不可少的活动和技术。最佳实践几乎无法实现，很少有组织尝试。然而，基本实践确实是必不可少的，并且在许多组织中是可以实现的。\n\
  \n### 应聘候选人筛选\n\n甚至在贴出“招聘”告示（现在还这么做吗？！）或在招聘网站上发布广告之前，雇主也应该确保要填充的职位有清晰记录，并包含对职位要求、资以及职责和权限范围的完整描述。\n\
  \n职位（或岗位）描述应由招聘经理和人力资源经理共同完成——招聘经理完全理解待填特定职位的职能需求，而人力资源经理则完全理解需要解决的适用用工法和组织要求。\n\
  \n拥有清晰记录的职位（或岗位）描述可以从多个方面为组织带来利益：\n\n*   招聘经理确切知道（并能清晰表述）某工作需要哪些技能。\n*   人力资源经理可以快速、准确地预审工作申请者。\n\
  *   潜在候选人可以确保只申请他们有胜任能力的职位，并为面试做好充分准备（例如，通过将自己的技能和经验与职位的具体要求匹配）。\n*   在组织填充该职位后，职位描述（在某些情况下为劳动合同）有助于减少对组织对新员工期望的困惑，并为评估绩效提供客观标准。\n\
  \n清晰识别个人责任和权限（特别是在信息安全问题方面）的简洁职位描述可以帮助：\n\n*   减少困惑和歧义。\n*   为个人的权限或行为提供法律依据。\n\
  *   证明在履行分配职责时的任何疏忽或失职。\n\n组织应对所有潜在员工和承包商进行背景检查并核实申请信息。这一过程有助于发现不理想或不合格的候选人。例如：\n\
  \n*   之前的刑事犯罪可能会立即使候选人失去组织内某些职位的资格。\n*   即使犯罪记录的存在本身不会自动取消候选人的资格，但如果候选人在申请或面试中未披露此类信息，这对潜在雇主来说应该是一个明显的警示信号。\n\
  *   某些需要美国政府安全审查的职位仅对美国公民开放。\n*   如果职位具有重大的财务责任或处理高价值资产，或者存在高欺诈风险，则应检查候选人的信贷历史。\n\
  *   据估计，高达 40% 的工作申请者在简历和申请表中“夸大事实”。\n\n\n\n\n\n大多数背景调查都需要申请人的书面同意，并披露某些隐私信息（例如申请人的社会安全号码或其他退休系统编号）。为了背景调查之而获取的隐私信息，以及背景调查的结果，必须根据适用法律以及组织的记录保留和销毁政策进行适当的处理和保护。\n\
  \n基础背景调查和验证可能包括以下信息：\n* 犯罪记录\n* 国籍\n* 职业履历\n* 教育背景\n* 证书和执照\n* 包括判决在内的财务历史\n* 推荐人检查（个人和职业）\n\
  * 工会和协会成员\n\n入职前和离职后的背景调查可以为雇主提供有关组织考虑聘用或任命的某个人的宝贵信息。此类检查可以直观地表明个人的诚信状况（例如，通过验证入职申请表中的信息），并帮助筛选掉不合格和不受欢迎的申请人。\n\
  \n担任敏感职位的人员应接受更广泛的入职前筛选和背景调查，可能包括：\n* 信用记录（至少包括破产、法拍赎回、判决和公共记录；根据职位要求，可能包含完整的信用报告）。\n\
  * 毒品检测（即使在某些麻毒品和其他物质（如大麻）合法的国家或美国州，如果组织的政策禁止使用这些物质，也应使用毒品检测来执行政策）。\n* 特殊背景调查（FBI\
  \ 和国际刑警记录、与前同事的实地访谈，或私人调查员的个人面试）。\n\n定期的离职筛选（如信用记录和毒品检测）也是必要的，特别是对于接触财务数据、现金或高价值资产的人员，或者对于被考虑晋升到更敏感或负责职位的人员。\n\
  \n许多过去没有进行药物筛选的组织现在都在这样做。他们不是对所有员工进行毒品检测，而是采取谨慎的方法，在晋升至更高责任级别（如总监或副总裁）时对员工进行筛选。\n\
  \n## 劳动协议与政策\n个人加入组织或在组织内晋升敏感职位时，应签署各种劳动协议和政策。劳动协议通常包括竞业协议、保密协议、行为准则和接受使用政策。典型的劳动政策可能包括互联网接受使用、社交媒体政策、远程访问、移动和个人设备使用（例如，“自自带设备”或\
  \ BYOD）以及性骚扰/不正当关系。\n\n## 雇佣终止流程\n应实施正式的雇佣终止程序，以帮助组织免受潜在诉讼、财产盗窃和破坏、未经授权的访问或职场暴力。应为各种场景制定程序，包括辞职、终止、裁员、事故或死亡、立即离开与提前通知以及冲突状况。终止程序可能包括\n\
  * 让前员工上交钥匙、安全证和停车证。\n* 进行离职面试。\n* 要求安保护送前员工领取其个人物品并/或离开现场。\n* 收回公司资产和材料，包括笔记本电脑、手机、平板电脑等。\n\
  * 根据需要更换门锁和系统密码。\n* 正式移交职责和责任。\n* 移除网络和系统访问并禁用用户账户。\n* 执行有关电子邮件、个人文件和就业记录保留的政策。\n\
  * 根据情况通知客户、合作伙伴、供应商、服务提供商和承包商。\n\n## 供应商、顾问和承包商控制\n通常外包许多 IT 功能，特别是数据中心托管、呼叫中心或联系中心支持以及应用程序开发。信息安全政策和程序必须在适当的情况下外包安全以及服务提供商、供应商和顾问的使用。访问控制、文档交换与审查、维护钩子、现场评估、流程和政策审查以及服务水平协议\
  \ (`SLAs`) 都是外包安全考虑的良好示例。\n\n## 合规\n组织内的所有人员都应该理解遵守适用政策和法规的个人合规责任。对于某些法规和政策，签署证明个人理解、承认和/或同意遵守的声明可能是恰当的。\n\
  \n### 隐私\n适用的政策法规和政策要求应由组织内的所有人员记录并理解。签署证明个人理解、承认和/或同意遵守的声明也可能是恰当的。\n\n## 理解并应用风险管理概念\n\
  除了基础安全知识之外，风险管理概念可能是安全和风险管理领域中最重要且最复杂的部分。事实上，风险管理是一个做出决策的过程，以确定需要哪些安全控制、实施安全控制、获取和使用安全工具，以及招聘安全人员。\n\
  \n风险永远无法完全消除。在充足的时间、资源、动机和资金下，任何系统或环境无论多么安全，最终都可能破解。某些威胁或事件（如自然灾害）完全超出我们的控制范围且往往不可预测。因此，风险管理的主要目标是`风险处理:`：对组织识别出的特定风险做出有意的决策。风险管理由三个主要元素组成（每个元素将在后续章节介绍）：\n\
  * 威胁识别\n* 风险分析\n* 风险处理\n\n### 识别威胁和漏洞\n信息安全业务的核心完全是风险管理。一个`风险`由资产的威胁和漏洞组成：\n* **威胁**：任何自然或人为的状况或事件，都可能对组织的资产或流程产生不利或不受理想的影响，无论大小如何。\n\
  * **漏洞**：资产或流程中保护措施或控制的缺失或薄弱（或内在脆弱性），使得威胁可能更具危害性或成本更高、更有可能发生，或发生频率更高。\n* **资产**：对组织具有某种价值并必须保护的资源、过程、产品或系统。资产可以是有形的（计算机、数据、软件、记录等），也可以是无形的（隐私、访问、公共形象、伦理等），这些资产同样可能有有形价值（购买价格）或无形价值（竞争优势）。\n\
  \n***记住：*** 风险 = 资产价值 × 威胁影响 × 威胁概率。\n\n`风险管理三要素`由资产、威胁和漏洞组成。\n\n### 风险评估/分析（处理）\n\
  风险管理的两个关键元素是`风险评估`和`风险处理`（在后续章节中讨论）。\n\n### 风险评估\n风险评估始于`风险识别 —`检测并定义风险三个组成部分的特定元素：资产、威胁和漏洞。\n\
  \n风险识别过程发生在`风险评估`期间。\n\n#### 资产估值\n\n\n\n\n\n识别组织的资产并确定其价值是确定适当安全水平的关键步骤。资产对组织的价值可以是`quantitative`（定量的，与成本相关），也可以是`qualitative`（定性的，相对重要性）。不准确或草率的资产估值过程可能会导致以下后果：\n\
  \n* 选择不当或实施不当的控制措施\n* 不符合成本效益的控制措施\n* 保护错误资产的控制措施\n\n良好的资产估值过程对组织有若干益处：\n\n*   支持定量和定性风险评估、业务影响分析\
  \ (`BIAs`) 以及安全审计。\n* 促进成本效益分析，并支持管理层做出选择适当保护措施的决策。\n* 可用于确定保险需求、预算和更换成本。\n* 帮助证明尽责（due\
  \ care），从而（可能）限制董事和管理人员的个人责任。\n\n用于确定资产价值的三个基本要素是：\n\n*   `初始成本和维护成本`：通常是具体的金钱价值，可能包括购买、许可、开发（或获取）、维护和支持成本。\n\
  *   `组织（或内部）价值`：通常是难以估量且无形的价值。它可能包括创建、获取和重新创建信息的成本，以及信息丢失或遭到破坏时的业务影响或损失。它还包括与隐私问题、人身伤害和死亡相关的责任成本。\n\
  *   `公共（或外部）价值`：另一种难以衡量且通常是无形的成本，公共价值可以包括专有信息或流程的丢失，以及业务声誉的损失。\n*   `对收入的贡献`：例如，一个价值\
  \ `$10,000` 的资产对于实现 500 万美元的年收入可能关键。因此，此类资产的风险决策不仅应考虑其成本，还应考虑其在产生或保护收入方面的作用。\n\n\
  ### 威胁分析\n\n执行威胁分析需遵循以下四个基本步骤：\n\n1. 定义实际威胁。\n2. 识别如果威胁事件发生对组织可能造成的后果。\n3. 确定威胁事件可能的频率和影响。\n\
  4. 评估威胁实际发生的概率。\n\n例如，一家在美国墨西哥湾沿岸设有主要分销中心的公司可能担心飓风。可能的后果包括电力和通信中断、风力损坏和洪水。通过气候学，该公司可以确定，在\
  \ 6 月至 9 月期间，平均每年有三场飓风通过其所在地 50 英里范围内，并且在此期间飓风实际影响公司运营存在特定概率。在年的剩余时间里，飓风威胁的概率较低。\n\
  \n组织必须考虑的威胁数量和类型可能非常多，但你通常可以将其归类为：\n\n*   `自然`：地震、洪水、飓风、闪电、火灾等。\n*   `人为`：未经授权的访问、数据输入错误、罢工/劳动纠纷、盗窃、恐怖主义、破坏、纵火、社会工程学、恶意代码和病毒等。\n\
  \n![warning](img/warning.png) 并非所有威胁都能轻易或机械地分类。例如，火灾和公用设施故障既可能是自然的也可能是人为的。有关灾难恢复的更多信息请参见第\
  \ 9 章。\n\n### 漏洞评估\n\n漏洞评估为识别资产中的漏洞提供了宝贵的基准，并识别一种或多种缓解这些漏洞的潜在方法。例如，组织可能会考虑拒绝服务 (`DoS`)\
  \ 威胁，并结合在微软的`域名系统` (`DNS`) 实现中发现的漏洞。然而，如果组织的 `DNS` 服务器已正确修补，或者组织使用了基于 `UNIX` 的 `DNSSEC`\
  \ 服务器，则特定的漏洞可能已经得到充分解决，对于该威胁可能不需要额外的保护措施。\n\n### 风险分析\n\n风险管理的下一个要素是`风险分析`——这是一种结合了风险管理所有要素（识别、分析和控制）的系统化检查，对于组织制定有效的风险管理策略至关重要。\n\
  \n风险分析涉及以下四个步骤：\n\n1. 识别需要保护的资产，包括它们相对于组织的相对价值、敏感性或重要性。风险识别的这一部分是资产估值。\n2. 定义特定威胁，包括威胁频率和影响数据。风险识别的这一部分是威胁分析。\n\
  3. 计算年化损失预期 (`ALE`)。`ALE` 计算是风险分析的基础概念；我们将在本节稍后讨论这一计算。\n4. 选择适当的保护措施。此过程既是风险识别（漏洞评估）也是风险控制（我们将在本章稍后的“风险控制”部分讨论）的组成部分。\n\
  \n年化损失预期 (ALE*) 提供了一个标准的、可量化的衡量，用于衡量实际威胁对组织资产的影响。由于它是威胁或事件的预计年度损失（以美元表示），`ALE` 对于确定保护措施或控制措施的成本效益比特别有用。你通过此公式确定\
  \ `ALE`：\n\n```\nSLE × ARO = ALE\n```\n\n以下是公式中要素的解释：\n\n*   `单次损失预期 (SLE)`：单次实际发生的威胁或事件所导致损失的衡量，以美元表示。你通过公式\
  \ `资产价值 × 暴露因子 (EF)` 来计算 `SLE`。`暴露因子 (EF)` 是衡量实际发生的威胁或事件对特定资产产生负面影响或作用的标准，以百分比表示。\n\
  *   `年化发生率 (ARO)`：威胁或事件预计年的发生频率。\n\n风险分析的两种主要类型是定性和定量，我们将在后续章节中讨论。\n\n### 定性风险分析\n\
  \n定性风险分析比定量风险分析更具主观性；与定量风险分析不同，这种分析风险的方法可以完全是定性的，且避免了具体的数字。这种方法的挑战在于开发描述实际威胁和潜在损失的真实场景。\n\
  \n与定量风险分析相比，定性风险分析具有一些优势，包括：\n\n*   不需要复杂的计算。\n*   所需的时间和工作投入相对较低。\n*   所需的输入数据量相对较低。\n\
  \n与定量风险分析相比，定性风险分析的缺点包括：\n\n*   没有定义财务成本；因此无法进行成本效益分析。\n*   定性方法更多地依赖假设和猜测。\n* \
  \  通常情况下，定性风险分析无法自动化。（高管层似乎更容易理解“这将在 12 个月内让我们损失 300 万美元”，而不是“这将在未来的某个不确定日期导致未指定的损失”。）\n\
  \n定性风险分析的一个独特优势是，可以根据资产价值、风险或其他手段对识别出的大量风险进行图表化和排序。这可以帮助组织识别并区分高风险和低风险，即使精确的金额可能尚不可。\n\
  \n定性风险分析并不尝试为风险分析的组成部分（资产和威胁）分配数值。\n\n\n\n\n\n### 定量风险分析\n\n完全的定量风险分析要求对过程的所有要素（包括资产价值、影响、威胁频率、保护措施有效性、保护措施成本、不确定性和概率）进行测量并分配数值值。\n\
  \n`quantitative risk analysis` 试图为风险分析的组件（资产和威胁）分配更客观的数值值（成本）。\n\n与定性风险分析相比，定量风险分析的优点包括：\n\
  \n*   定义了财务成本；因此，可以确定成本效益分析。\n*   有更简洁、更具体的数据支持分析；因此所需的假设和猜测较少。\n*   分析和计算通常可以实现自动化。\n\
  *   特定的可量化结果更容易向执行官和高层管理人员汇报。\n\n与定性风险分析相比，定量风险分析的缺点包括：\n\n*   人为偏见会扭曲结果。\n*   通常需要许多复杂的计算。\n\
  *   投入的时间和精力相对较高。\n*   所需的输入数据量相对较高。\n*   威胁事件发生的概率难以确定。\n*   需要一些假设。\n\n纯粹的定量风险分析通常是不可能或不实际的。这主要是因为很难为任何给威胁场景确定精确的发生概率。由于由于原因，许多风险分析是定性和定量风险分析的混合体，被称为混合风险分析。\n\
  \n# 混合风险分析\n\n混合风险分析结合了定量和定性风险分析的要素。确定准确的发生概率以及事件真实影响的挑战，迫使许多风险管理者采取折中方案。在这种情况下，易于确定的定量值（如资产价值）将与关于发生概率和风险水平的定性衡量结合使用。事实上，许多所谓的定量风险分析更准确的描述应该是混合的。\n\
  \n### 风险处理\n\n适当的风险分析为风险管理过程的下一步提供了基础：决定对已识别的风险采取什么措施。决策过程被称为 `risk treatment`。风险处理的四种通用方法是：\n\
  \n*   风险缓解（Risk mitigation）：这涉及实施一项或多项策略、控制或其他措施来保护资产。缓解通常将威胁实现的概率或威胁实现的影响降低到可接受水平。这是最常见的风险控制补救措施。\n\
  *   风险分配（Risk assignment，或转移）：将与风险相关的潜在损失转移给第三方，例如保险公司或明确同意接受风险的服务提供商。\n*   风险规避（Risk\
  \ avoidance）：通过停止引入风险的原始活动或状态来完全消除风险。\n*   风险接受（Risk acceptance）：接受潜在威胁相关的风险。这有时是为了方便（不明智），但更恰当的情况是其他对措施的成本高到无法接受、概率或影响较低，或者收益大于成本时。\n\
  \n## 应对措施的选择\n\n如前一节所述，缓解是最常见的风险处理方法。缓解涉及实施一项或多项应对措施。选择应对措施的几项标准包括成本效益、法律责任、对业务的影响和技术因素。\n\
  \n### 成本效益\n\n选择应对措施的最常用标准是成本效益，它是通过成本效益分析确定的。针对特定应对措施（或一组应对措施）的成本效益分析可以如下公式计算：\n\
  \n> 应对措施实施前的 ALE – 应对措施实施后的 ALE – 应对措施成本 = 应对措施对组织的价值\n\n例如，如果与特定威胁（数据丢失）相关的 `ALE`\
  \ 为 1,000,000 美元；实施应对措施（企业磁带备份）后的 `ALE` 为 10,000 美元（恢复时间成本）；而应对措施的成本（购买、安装、培训和维护）为\
  \ 140,000 美元；那么该应对措施对组织的价值为 850,000 美元。\n\n在计算应对措施成本时，你应该考虑`总拥有成本` (`TCO`)，它包括：\n\
  \n*   购买、开发和许可\n*   架构和设计\n*   测试和安装\n*   正常运营成本\n*   资源分配\n*   维护和修理\n*   生产或服务中断\n\
  \n应对措施的总成本通常以年化金额标出。\n\n### 法律责任\n\n如果一个组织未能针对威胁实施应对措施，且实施该应对措施的成本低于威胁发生所造成的损失，则该组织将面临法律责任（参见本章较早讨论的\
  \ `due care` 和 `due diligence`）。我们在这里讨论的法律责任可能包括法定责任（由于未遵守法律导致）或民事责任（由于未遵守法律导致）。成本效益分析是确定法律责任的有用工具。\n\
  \n### 业务影响\n\n还必须考虑应对措施对业务的影响。如果一项应对措施太难以实施和操作，或者对正常运行或生产产生过度干扰，它可能会被绕过或忽略，从而无法生效。最终结果可能是风险高于所谓缓解之前的原始风险。\n\
  \n### 技术因素\n\n原则上，应对措施本身不应引入新的漏洞（但在实践中往往会）。例如，应对措施的不当放置、配置或操作可能会导致新的漏洞；缺乏故障安全能力、审计和计数功能不足或重置功能不当可能会导致资产损坏或破坏；最后，隐道通道访问或其他不安全状态是可能产生新漏洞的技术问题。环境中的每个新组件（包括安全解决方案）都会增加潜在攻击面。\n\
  \n### 实施\n\n在选择适当的应对措施后，需要在组织内部实施它们，并在适当与其他系统和其他应对措施集成。实施应对措施的组织以特定方式对其环境进行计划变更。应对措施实施的示例包括：\n\
  \n*   策略、标准或程序的变更：对官方策略、技术标准或程序的更新将需要计划，以确保该更改不会对组织产生意外影响。在接受、发布和传播更改之前，会有某种程度的审查、分析和讨论。策略、标准或程序的变更可能也需要技术的变更，反之亦然。\n\
  *   技术的变更：对网络架构等重大项目或对单个系统配置设置等局部更新被用于降低风险。技术的变更通常涉及变更管理和配置管理等业务流程，并可能影响程序或标准。重大变更可能还涉及\
  \ IT 指委员会或安全委员会层面的讨论或流程。灾难恢复计划和 `CMDB` 也可能受到影响。\n\n\n\n\n\n- **人员变更。** 人员变动可能包括培训、职责重新分配、增加临时人员（合同承包商或顾问）或招聘额外员工。\n\
  \n## 控制类型\n\n`control`（控制）被定义为用于确保获得预期结果的保护性措施。`control` 可以在技术中实施（例如，一个通过要求用户使用复杂密码来执行密码复杂度策略的程序），在流程中实施（例如，要求事件响应人员通知高层管理的安全事件响应流程），或在策略中实施（例如，要求用户向管理层报告安全事件的策略）。组织通常会有几十、几百甚至数千个\
  \ `controls`。由于 `controls` 数量众多，有时通过各种方式对控制进行分类是有意义的。这可以帮助安全专业人员更好地理解其组织所使用的控制类型和类别。这里讨论了其中的几种分类方法。\n\
  \n主要的 `controls` 类型有：\n\n- **预防性控制：** 用于防止错误、意外事件和未经授权的访问。\n- **检测性控制：** 用于检测错误、意外事件和未经授权的活动。检测性\
  \ `control` 的示例是视频监控系统。\n- **威慑性控制：** 用于阻止人们执行某项活动。例如，视频监控系统通过显眼放置的显示器告知并提醒人们存在视频监控系统。\n\
  \n其他类型的 `controls` 包括：\n\n- **纠正性控制：** 用于扭转或减少错误和未经授权事件的影响。这些也被称为 `recovery controls`（恢复控制）。恢复\
  \ `control` 的示例是在硬件故障后对数据成功恢复进行验证。\n- **管理控制：** 这些是策略、标准或程序（通常是某种形式的书面声明）。\n- **补偿性控制：**\
  \ 当主要控制由于任何原因（如成本过高）无法实施时所采取的 `controls`。\n\n另一种思考控制的方式是根据它们是如何被执行的。这些类型分为：\n\n\
  - **自动控制：** 某些形式的自动化机制确保其执行和有效性。例如，此类系统可能会显示登录页面，要求用户在访问系统之前成功通过身份验证。\n- **手动控制：**\
  \ 控制必须手动执行。例如，在变更控制过程中，可能对建议的变更进行强制性审查。\n\n大多数组织并不尝试从零开始创建控制框架；而是采用这些广知的行业标准控制框架之一：\n\
  \n- ISO/IEC 27002（信息安全管理实践准则）。\n- NIST 800-53（联邦信息系统和组织的安全与隐私控制）。\n- NIST 800-171（非联邦系统和组织的受控非机密信息）。\n\
  - 用于信息安全的 COBIT 5。\n- PCI DSS（支付卡行业数据安全标准）。\n- HIPAA 安全规则控制。\n- CIS（互联网安全中心）安全控制。\n\
  \n组织通常从其中一个开始，然后对控制进行个人的添加、更改或删除，直到达到他们认为充分的精确控制集。\n\n## 控制评估\n\n一个实施了控制但未能定期对这些控制进行评估的组织将被视为疏职。对控制进行定期评估是健全的风险管理系统中必要的组成部分。\n\
  \n### 控制评估方法\n\n安全控制评估（SCA）有多种方法，包括：\n\n- **控制自评估。** 在此情况下，组织检查自己的控制，以确定它们是否被遵守以及是否有效。\n\
  - **外部评估：** 组织聘请外部机构（可以是组织的不同部门，或者是审计公司或咨询公司等外部实体）来评估其控制。\n- **评估频率的变化。** 各种情况将迫使组织为控制评估制定计划。例如，高度关键的控制可能每月或每季度评估一次，其他控制每年评估一次，低风险控制每两年评估一次。\n\
  \n组织对控制评估采用混合方法：某些控制可能在内部评估，另一些在外部评估。两者可能是混合在一起的；某些控制既进行内部评估也进行外部评估。\n\n![tip](img/tip.png)\
  \ 法律、法规和标准通常有规定控制评估频率的要求，以及控制必须在内部还是外部进行评估。\n\n### 控制评估方法论\n\n详细介绍用于评估控制的方法需要一整本书（至少是一个很长的章节）。该主题的大部分内容处于大多数\
  \ CISSP 领域之外，因此我们在这里进行简单总结。如果你足够“幸运”工作在一个高度监管的环境中，你可能会接触这些概念以及更多内容。\n\n### 控制评估技术\n\
  \n用于评估控制有效性的有五种基本技术：\n\n- **观察。** 在此，审计人员在控制执行时对其进行观察。\n- **询问。** 审计人员向控制所有者询问有关控制的问题、如何执行以及如何产生记录（如果有的话）。\n\
  - **佐证性询问。** 在此，审计人员向其他人询问控制情况，以查看他们的描述与控制所有者提供的描述是否一致或冲突。\n- **检查。** 审计人员检查记录和其他人工制品，以查看控制是否运行正常。\n\
  - **重实施。** 审计人员将执行与控制相关的操作，以查看结果是否表明控制功能正常。\n\n审计人员在测试控制有效性时通常会使用上述一种以上的技术。使用的方法有时由审计人员决定，但有时法律、法规或标准会规定所需的控制测试类型。\n\
  \n### 抽样技术\n\n某些控制出现在许多物理位置，或者存在于许多独立的信息系统中。有时，审计人员选择检查系统或位置的子集而不是全部。在大型组织或在所有位置实施相同相同的组织中，检查实例的子集是有意义的（审计人员将整个实例集合称为\
  \ `population`，总体）。\n\n可用技术包括：\n\n ** **统计法。** 代表整个总体的随机选择。\n- **判断法。** 审计人员根据特定标准选择样本。\n\
  - **发现法。** 在高风险控制中，即使是一个异常也可能代表高风险，审计人员可能会继续检查大量实例以寻找单个异常。\n\n某些法律、法规和标准对抽样和允许许可的技术有自己的规定。\n\
  \n### 报告\n\n审计人员通常会创建包含几个组成部分的正式报告，包括：\n\n- 审计目标\n- 被访谈的人员\n- 检查的文档和记录\n- 面谈和检查日期\n\
  - 检查的控制\n- 每项控制的发现（有效或无效）\n\n某些法律、法规和标准规定了审计报告所需的要素，有时甚至规定了报告的格式。\n\n## 监控与测量\n\n\
  \n\n\n\n任何实施的保护措施或控制措施都需要进行管理，正如你所知，你无法管理你无法衡量的东西！监控和测量不仅有助于你管理保护措施和控制措施，还能帮助你验证并证明其有效性（用于审计或其他目的）。\n\
  \n监控和测量是指控制和流程中主动、有意识的步骤，以便管理层了解控制和流程的运行情况。根据控制或流程的不同，将记录以下一个或多个项目用于管理报告：\n\n* 发生的事件数量\n\
  * 每个事件的结果（例如，成功或失败）\n* 涉及的资产\n* 涉及的人员、部门、业务单元或客户\n* 涉及的成本\n* 持续时间\n* 位置\n\n对于某些控制，管理层可能会指示人员（对于自动控制则为系统）在特定情况下创建警报或异常。这将告知管理层他们可能希望采取某种行动的特定事件。例如，如果客户要求兑换万圆钞票，银行客户代表可能被要求通知分支经理。\n\
  \n## 资产估值\n\n资产估值是风险管理的一个重要部分，因为经理和高管需要意识到特定风险管理事件中所涉及的所有资产的有形和无形价值。\n\n偶尔，资产的估值可以来自会计部门的资产负债表（对于对资产清单、价值和折旧管理良好的良好机构），但通常这只是情况的一部分。例如，如果一台旧服务器卷入事件并必须更换，其更换成本将远高于资产的折旧价值。此外，部署和准备备用服务器所需的时间以及停机成本也需要考虑在内。\n\
  \n有时还有其他方法来为资产赋值。例如，资产对收入的贡献可能会改变人们对资产价值的看法。如果一个更换成本为 10,000 美元的资产是帮助组织实现 500 万美元收入的关键，它还只值\
  \ 10,000 美元吗？\n\n## 报告\n\n定期报告对于确保风险管理始终处于管理层的“首脑位置”至关重要。报告应该准确简洁。永远不要试图隐藏或淡化问题、事件或其他坏消息。组织风险态势的任何变化——无论是由于新的收购、技术变更、新威胁还是保护措施的失败等——都应该及时报告并解释。\n\
  \n潜在地，风险管理过程中存在大量的报告工作，包括：\n\n* 风险记录簿的增加和变更\n* 风险处理决策\n* 内部审计\n* 外部审计\n* 控制的变更\n\
  * 控制监控和关键指标\n* 与风险管理计划相关的人员变动\n\n正如你猜的：某些法律、法规和标准可能要求此类或其他类型的报告（在某些情况下，是特定的格式）。\n\
  \n### 持续改进\n\n持续（或连续）改进不仅是一种心态或哲学。它是一种思考安全和风险管理的方式。更优秀的组织将持续改进融入到其业务流程中，作为一种主动寻求做得更好的机会的方式。\n\
  \n`ISO/IEC 27001`（信息安全管理体系 [ISMS] 要求）具体通过以下几种方式要求持续改进：\n\n* 它要求管理层促进持续改进。\n* 它要求在安全策略中包含对持续改进的承诺。\n\
  * 它要求安全规划以实现持续改进。\n* 它要求组织提供资源以实现持续改进。\n* 它要求管理评审寻求持续改进的机会。\n* 它要求建立正式的纠正措施以促进持续改进。\n\
  \n### 风险框架\n\n如果你向经验丰富的安全和风险专业人士询问风险框架，他们很可能认为你在谈论风险评估框架或风险管理框架。这些框架是不同的，但处理的是相同的通用主题：识别可以通过某种方式处理的风险。\n\
  \n### 风险评估框架\n\n`Risk assessment frameworks` 是用于识别和评估组织内部风险的态论。这些方法在很大程度上是成熟且建立完善的。\n\
  \n一些常见的风险评估方法包括\n\n* `Factor Analysis of Information Risk (FAIR)`。一个用于理解、分析和衡量信息风险的专有框架。\n\
  * `OpenFAIR`。FAIR 的开源版本。\n* `Operationally Critical Threat, Asset and Vulnerability\
  \ Evaluation (OCTAVE)`。由 CERT 协调中心开发。\n* `Threat Agent Risk Assessment (TARA)`。由\
  \ Intel 开发，是一个较新的成员。\n\n### 风险管理框架\n\n`risk framework`（风险框架）是一系列关联的流程和记录，共同工作以识别和管理组织中的风险。典型风险管理框架中的活动包括：\n\
  \n* 创建策略和政策。\n* 建立风险承受度。\n* 对系统和信息进行分类。\n* 选择一组基准安全控制。\n* 实施安全控制。\n* 评估安全控制的有效性。\n\
  * 授权系统运行。\n* 监控安全控制。\n\n没有从从零开始构建风险管理框架的必要。相反，有许多优秀的框架可用，可以适用于任何规模和类型的组织。这些框架包括\n\
  \n* `NIST SP800-37,`，将风险管理框架应用于联邦信息系统的指南。\n* `ISO/IEC 27005`（信息安全风险管理）。\n* 来自美国国家标准技术研究院\
  \ (NIST) 的 `Risk Management Framework (RMF)`。\n* 来自 ISACA 的 `COBIT 5`。\n* 来自 COSO（财务报告协会监督组织委员会）的\
  \ `Enterprise Risk Management — Integrated Framework`。\n\n## 理解并应用威胁建模\n\n`Threat\
  \ modeling`（威胁建模）是一种风险分析，用于识别信息系统或业务流程设计阶段的安全缺陷。威胁建模通常应用于应用程序，但它同样适用于操作系统、设备和业务流程。\n\
  \n威胁建模通常以攻击为中心；威胁建模通常用于识别攻击者可能在应用程序中利用的漏洞。\n\n威胁建模在信息系统、应用程序或流程的设计阶段进行时最为有效。当在设计阶段识别威胁及其缓解措施时，通过避免对现有系统进行设计更改和修复可以节省大量工作。\n\
  \n虽然威胁建模有不同的方法，但典型步骤是：\n\n* 识别威胁\n* 确定并绘制潜在攻击图\n* 进行减少分析\n* 修复威胁\n\n### 识别威胁\n\n\
  威胁识别是威胁建模中执行的第一步。威胁是指如果应用程序或系统中存在相应的漏洞，攻击者可能成功执行的行动。\n\n对于软件应用程序，威胁建模期间有两种助记法作为记忆辅助。它们是\n\
  \n* `STRIDE`，一个基本威胁列表（由微软开发）：\n    * 身份伪造 (Spoofing)\n    * 篡改 (Tampering)\n   \
  \ * 否认 (Repudiation)\n    * 信息泄露 (Information disclosure)\n    * 拒绝服务 (Denial of\
  \ service)\n    * 权限提升 (Elevation of privilege)\n\n\n\n\n\n*   `DREAD`，一种用于评估威胁的旧技术：\n\
  \    *   损害（Damage）\n    *   可重复性（Reproducibility）\n    *   可利用性（Exploitability）\n\
  \    *   受影响用户（Affected users）\n    *   发现性（Discoverability）\n\n虽然这些助记符本身不包含威胁，但它们可以帮助执行威胁建模的人员，通过提醒他们基本的威胁类别（`STRIDE`）及其分析（`DREAD`）。\n\
  \n![tip](img/tip.png) NIST SP800-30《风险评估指南》中的附录 D 和 E 是威胁的极佳通用来源。\n\n### 确定并绘制潜在攻击\n\
  \n在识别威胁后，威胁建模将通过创建说明对应用程序或系统的攻击图表继续进行。可以开发一个`攻击树`。它概述了攻击系统所需的步骤。图 3-2 展示了一个移动银行应用程序的攻击树。\n\
  \n![image](img/9781119505815-fg0302.png)\n\n图 3-2: 移动银行应用程序的攻击树。\n\n![remember](img/remember.png)\
  \ 攻击树说明了攻击目标系统的步骤。\n\n### 执行归约分析\n\n在对复杂应用程序或系统进行威胁分析时，可能会有许多代表技术重复的相似元素。`归约分析`是威胁建模中的可选步骤，以避免重复工作。如果环境中的所有组件都使用相同的技术和配置，那么花费大量时间分析不同的组件是没有意义的。\n\
  \n以下是典型的示例：\n\n*   一个应用程序包含几个表单字段（源自同一份源代码），它们请求银行账户号码。由于所有字段输入模块都使用相同的代码，因此详细分析只需要进行一次。\n\
  *   应用程序通过同一个 `TLS` 连接发送数种不同类型的消息。由于使用了相同的证书和连接，因此对 `TLS` 连接的详细分析只需要进行一次。\n\n###\
  \ 修复威胁的技术和流程\n\n与例行风险分析一样，威胁分析的下一步是列举缓解已识别威胁的潜在措施。由于威胁的性质差异很大，对于每种风险，修复措施可能包括以下一项或多项：\n\
  \n*   更改源代码（例如，添加函数来仔细检查输入字段并过滤注入攻击）。\n*   更改配置（例如，切换到更安全的加密算法，或更频繁地过期密码）。\n*  \
  \ 更改业务流程（例如，在流程或程序中添加或更改步骤以记录或检查关键数据）。\n*   更改人员（例如，提供培训，将任务的责任转移给他人）。\n\n![remember](img/remember.png)\
  \ 请记住，风险处理的四个选项是缓解、转移、规避和接受。在威胁建模的情况下，某些威胁可以按现状接受。\n\n## 将安全风险考虑整合到供应链管理、合并与收购中\n\
  \n将安全风险考虑整合到供应链管理以及合并收购策略中，有助于最大限度减少向组织引入新风险或未知风险。\n\n人们常说，组织的安全性取决于其最薄弱的环节。在服务提供商、合并和收购的背景下，任何一个组织的糟糕做法都会拖累整个生态系统中所有组织的安全性。在进行充分分析之前将组织连接起来可能会导致整体安全能力的严重损害。\n\
  \n![remember](img/remember.png) 在合并或收购期间协调政策、需求、业务流程和程序的任务很少是一帆风顺的。此外，不假设某个组织的政策、需求、流程和程序是合并收购中所有方的“正确”或“最佳”方式——即使该组织是收购方。\n\
  \n相反，应该对每个组织的个人政策、需求、流程和程序进行评估，以为新成立组织的未来发展确定最佳解决方案。\n\n### 硬件、软件和服务\n\n组织考虑的任何新硬件、`软件`或服务都应经过适当评估，以确定它们将如何影响组织的整体安全和风险状况，以及它们将如何影响组织内已有的其他硬件、软件、服务流程。例如，集成问题可能会对系统的完整性和可用性产生负面影响。\n\
  \n### 第三方评估与监控\n\n考虑组织使用的第三方是非常重要的。组织不仅需要仔细检查其第三方风险计划，还需要对第三方本身进行新的审视，以确保与每个第三方相关的风险水平没有发生不利于组织的变化。\n\
  \n任何新的第三方评估或监控都应经过仔细考虑。应该审查合同（包括隐私、保密性要求和安全要求）以及服务水平协议（`SLAs`，在本节稍后将讨论），以确保所有重要的安全问题和监管要求仍得到充分解决。\n\
  \n### 最低安全要求\n\n应当记录最低安全要求、标准和基准，以确保它们在收购策略和实践中得到充分理解和考虑。将两个以前独立的组织的安全要求混合，几乎从未简单地将它们合并到一个文档中那么容易。相反，可能会出现许多重叠、缺失、缺口和矛盾，所有这些都必须进行协调。可能需要一个过渡期，以便在合并收购后有充足的时间调整安全配置、架构、流程和实践，以满足新的要求。\n\
  \n### 服务水平要求\n\n`服务水平协议`(`SLAs`) 为系统、应用程序、网络、服务或流程建立了最低性能标准。组织建立内部 `SLAs` 和运行水平协议（`OLAs`），为终端用户提供对其信息系统、服务和流程性能的现实预期。例如，帮助热台的\
  \ `SLA` 可能将事件分为 1、2、3 和 4 级，并分别建立十十分钟、1 小时、4 小时和 24 小时的 `SLA` 响应时间。在第三方关系中，`SLAs`提供了外包合作伙伴或供应商必须满足的合同性能要求。例如，与互联网服务提供商签订的\
  \ `SLA`可能会规定一个最大可接受机时间，如果在给定时间内超过了该时间，则会导致发票抵扣或（如果需要的话）取消服务合同。\n\n## 建立和管理信息安全教育、培训和意识\n\
  \nCISSP 候选人应熟悉安全意识、培训和教育计划工具和目标。对手非常清楚，随着组织技术防御的提高，攻击组织最有效的方法是通过其员工进行。因此，组织中的所有人员都需要了解攻击技术，以便他们能够警惕这些攻击并不被其欺骗。\n\
  \n\n\n\n\n![remember](img/remember.png) 安全意识是信息安全计划中经常被忽视的因素。尽管安全是安全从业人员日常工作的重点，但人们往往理所当然地认为普通用户也具有相同水平的安全意识。结果，用户可能在无意中成为信息安全计划防御中最薄弱的环节。以下几个关键因素对于安全意识计划的成功至关重要：\n\
  \n*   **高级管理的支持：** 在理想情况下，高层管理层参加并积极参与培训工作。\n*   **清晰展示安全如何支持组织的业务目标：** 员工需要理解安全对组织为什么重要，以及它如何让整个组织受益。\n\
  *   **清晰展示安全如何影响所有个人及其工作职能：** 安全意识计划需要对每个人都具有相关性，以便每个人都理解“安全是每个人的责任”。\n*   **考虑到受众目前的培训水平和对安全原则的理解：**\
  \ 太基础的培训会被忽略；太技术性的培训将无法被理解。\n*   **确保培训具有相关性和参与性：** 培训需要对所有受众都具有相关性和吸引力，反映适用的法规、正在使用的技术以及组织文化。\n\
  *   **行动与跟进：** 一个观众离开房间后就会被遗忘的华丽演示是没用的。找到方法将你展示的安全信息与日常活动及跟进计划结合起来。\n\n有效的安全意识计划的三个主要组成部分是通用意识计划、正式培训和教育。\n\
  \n### 意识\n\n`general security awareness program` 提供基础安全信息，并确保每个人都理解安全的重要性。意识计划可能包含以下元素：\n\
  \n*   **入职教育和引导：** 新员工和承包商应接受基础的入职教育和引导。在入职教育期间，他们可能会收到公司信息安全策略副本，被要求确认并签署可接受使用声明和保密协议，并与直接主管以及安全和\
  \ IT 部门的相关人员见面。\n*   **演示：** 讲座、视频演示和交互式计算机培训（CBT）是传播安全培训和有用信息的极佳工具。员工奖金和绩效评估有时与参与此类安全意识计划的情况挂钩。\n\
  *   **纸质材料：** 安全海报、公司通讯报和定期简报对于传播基础信息（如安全提示）和提高安全意识很有用。\n\n### 培训\n\n`Formal training\
  \ programs` 提供比意识计划更深入的信息，并可能侧重于特定的安全相关技能或任务。此类培训计划可能包括\n\n*   **课堂培训：** 由讲师引导或其他正式促进的培训，可能在公司总部或公司培训设施进行。\n\
  *   **自学进度培训：** 通常是基于网络的培训，学生可以按照自己的进度进行。\n*   **职场培训：** 可能包括与同事或直接主管的一对一指导。\n*\
  \   **技术或供应商培训：** 由第三方提供的针对特定产品或技术的培训。\n*   **学徒制或资质计划：** 必须在规定时间内满完成的正式试用状态或资质标准。\n\
  \n### 教育\n\n`education program` 提供最深层次的安全培训，侧重于底层原理、方法论和概念。在所有最大的组织外，这种培训由外部机构以及学院、大学和职业学校提供。\n\
  \n教育计划可能包括：\n\n*   **继续教育要求：** 持续教育学分（CEUs）对于维持高级技术或专业认证（如 `CISSP` 或注册信息系统审计师 `CISA`）正变得越来越流行。\n\
  *   **证书计划：** 许多学院和大学提供成人教育计划，为职场人士提供当前和相关主题的课程。\n*   **正式教育或学位要求：** 许多公司为参加课程的员工提供学费补助或奖学金。\n\
  \n### 衡量安全培训的有效性\n\n正如我们在书中常说的，你无法管理你没有的东西。安全意识培训无疑包含在内。安全意识包含多种不同的衡量至关重要，以便安全经理知道这些投入是值得的。示例包括\n\
  \n*   **测验：** 无论是在课堂中还是在按需网络培训中，测验都传达了一个明确的信息，即希望员工学习并记住安全知识。当实施最低及格分数时，这种方法变得更加有效。\n\
  *   **培训指标：** 跟踪完成率以确保尽可能多的人完成是有帮助的。\n*   **其他安全计划指标：** 将安全培训指标与其他指标（如安全事件、伦理热线报告和员工对安全问题的报告）进行跟踪可能很有趣。需要注意的是，这些指标中的某些可能会呈现趋势，这代表员工对安全问题的意识更强，报告的可能性也更大。\n\
  \n### 内容相关性的定期审查\n\n恭喜你！你选择了一个在不断且快速变化的职业！因此，安全教育、培训和意识计划必须不断进行审查和更新，以确保它们保持相关性，并确保你对当前安全概念、趋势和技术的知识保持更新。我们建议每年检查一次安全教育和培训计划的内容，以确保没有提到过时或淘汰的技术或系统。\n\
  \n第 4 章\n\n### 资产安全\n\n本章内容\n\n![check](img/check.png) **理解商业和政府数据分类**\n![check](img/check.png)\
  \ **建立数据所有权**\n![check](img/check.png) **处理隐私问题**\n![check](img/check.png) **管理记录留存**\n\
  ![check](img/check.png) **识别适当的数据安全控制**\n![check](img/check.png) **确保敏感信息资产得到妥善处理**\n\
  \n资产安全领域涉及整个信息生命周期内信息资产的收集、分类、处理和保护。领域的重要概念包括数据所有权、隐私、数据安全控制和加密。该领域占 CISSP 认证考试的\
  \ 10%。\n\n### 分类信息和支持资产\n\n信息和数据以其各种形式存在，是价值的业务资产。与其他更具有形的资产一样，信息的价值决定了组织所需的保护水平。\n\
  \n\n\n\n\n数据分类方案有助于组织根据其信息资产对丢失或泄露的`敏感性`以及对组织任务或目的的`关键性`来分配价值，并帮助组织确定适当的保护级别。此外，出于监管或其他法律合规性，可能需要制定数据分类方案。\n\
  \n在组织的所有资产中统一应用单一的保护标准既不实际也不符合愿望。在这种情况下，要么是非关键资产接受了过度保护，要么是关键资产受到保护不足。\n\n组织的员工还需要理解正在使用的分类方案、如何对信息资产进行分类、处理和保护要求，以及适当的销毁或处置程序。\n\
  \n### 商业数据分类\n\n商业数据分类方案通常用于保护具有货币价值的信息、遵守适用法律并保护隐私，以及限制责任。商业数据进行分类的标准包括：\n\n* \
  \  **价值：** 商业组织中最常见的分类标准。它基于货币价值或其他价值。\n*   **年龄/使用寿命：** 那些随时间推移失去价值、变得过时或无关、或成为通用/公共知识的信息属于此类。\n\
  *   **监管要求：** 私有信息，例如受 `HIPAA`（1996 年健康保险流通与责任法案）和 `HITECH`（经济与健康信息技术法）监管的医疗记录，以及受《隐私法》（参见第\
  \ 3 章）监管的教育记录可能有法律保护要求。此类信息的分类不仅基于合规性，还基于责任限制。\n\n公司信息通常会应用描述性标签，例如`机密和专有`和`仅供内部使用`。然而，对这类标记信息的组织保护要求往往没有正式定义。组织应该正式识别标准的分类级别，以及标记、处理、存储和销毁/处置的具体要求。\n\
  \n### 政府数据分类\n\n政府数据分类方案通常实施用于：\n\n*   保护国家利益或安全。\n*   遵守适用法律。\n*   保护隐私。\n\n![remember](img/remember.png)\
  \ 较为常见的系统之一（用于美国国防部（DoD）内部，包含信息分类的五个大类：非机密（Unclassified）、敏感非机密（SBU）、机密（Confidential）、秘密（Secret）和绝密（Top\
  \ Secret）。我们将在后续章节中讨论所有这些类别。\n\n在每个分类级别内，在使用、处理、复制、运输和销毁国防部信息时，都需要某些保护措施。除了具有与正在处理的信息级别相同或更高的适当许可级别外，个人在访问信息之前必须具有“知情需要”（need\
  \ to know）。知情的人是指为了执行分配的工作职而需要这些信息的人。\n\n### 非机密 (Unclassified)\n\n政府数据的最低分类级别是`非机密`。非机密信息不敏感，未经授权的泄露不会对国家安全造成任何伤害。非机密信息可能包括曾被较高级别分类但随后已由适当权限解密的信息。非机密信息不会自动向公众发布，可能包含额外的修饰语，如`仅供官方使用`或`仅供内部使用`。\n\
  \n### 敏感非机密 (Sensitive but Unclassified)\n\n`敏感非机密`信息是非机密信息的常见修饰语。它通常包括具有私密或个人性质的信息。例如测试题、纪律处程序和医疗记录。\n\
  \n### 机密 (Confidential)\n\n`机密`信息是指如果泄露可能会对国家安全造成损害的信息。机密信息是政府机密信息的最低级别。\n\n###\
  \ 秘密 (Secret)\n\n`秘密`信息是指如果泄露可能会对国家安全造成`严重`损害的信息。秘密信息通常在其整个生命周期内都必须记录，直到销毁。\n\n\
  ### 绝密 (Top Secret)\n\n`绝密`信息是指如果泄露可能会对国家安全造成严重破坏的信息。绝密信息可能需要额外的保护措施，例如特殊标记和处理限制。\n\
  \n![remember](img/remember.png) 个人必须具有适当的`许可`级别和`知情需要`才能访问机密信息。\n\n### 确定并维护所有权\n\
  \n在组织内部，系统、数据以及业务或任务的`所有者`和`保管`（具体来说是业务线或任务方面）被隐含或显式地分配。\n\n![tip](img/tip.png)\
  \ 组织应明确定义敏感资产的所有者和保管，以避免对角色、责任和问责产生任何混淆或歧义。\n\n`所有者`通常分配在组织内的执行或高级管理层，例如总监或副总裁。所有者在法律上并不`拥有`分配给他们的资产；所有者最终负责保护分配的资产，并根据“尽职调查”（due\
  \ care）的概念，可能对保护这些资产的疏忽承担信托责任或个人责任。有关尽职调查的更多信息，请阅读第 3 章。\n\n所有者的典型责任可能包括：\n\n* \
  \  确定所分配资产的分类级别。\n*   确定访问资产的策略。\n*   维护分配资产的清单并负责。\n*   定期审查分配资产的分类级别，以便进行可能的降级、销毁或处置。\n\
  *   将日常责任（但不包括问责）和功能委托给保管。\n\n`保管`是负责保护和管理分配资产的日常责任的个人。IT 系统管理员或网络管理员通常担任此角色。典型责任可能包括：\n\
  \n*   定期备份并在必要时恢复系统和/或数据。\n*   确保在系统、目录和文件上正确实施适当的权限，并为资产提供足够的保护。\n*   通过系统加固和其他保护措施确保\
  \ IT 系统得到充分保护。\n*   需要时将新用户分配到适当的权限组并撤销用户权限。\n*   在保险库或安全档案室维护机密文件或其他材料。\n\n![remember](img/remember.png)\
  \ 所有者与保管之间的区别，特别是关于他们不同的责任，是信息安全管理中的一个重要概念。数据所有者对数据安全负最终责任，而数据保管负责日常的安全管理。\n\n###\
  \ 保护隐私\n\n如第 3 章所示，`隐私`的概念与`机密性`密切相关，但更具体地侧重于防止个人数据的未经授权使用或泄露。\n\n个人数据，通常称为`个人身份信息\
  \ (PII)`，可能包括：\n\n*   姓名\n*   地址\n*   联系信息\n*   社会安全号码\n*   财务账号\n*   出生日期和出生地\n\
  *   种族\n*   婚姻状况\n*   性取向或生活方式\n*   信用历史和其他财务信息\n*   犯罪记录\n*   教育\n*   就业记录和历史\n\
  \n\n\n\n\n*   健康记录和医疗数据（被称为 `protected health information`，简称 `PHI`；以电子形式存在时被称为\
  \ `electronic protected health information`，简称 `ePHI`）\n*   宗教偏好\n*   政治派别\n*  \
  \ 其他独特的个人特征或特质\n\n任何收集任何人个人数据（包括员工、客户和患者等）的组织，都必须拥有一份定义良好、发布并分发的隐私政策，解释收集数据的原因、如何使用这些数据、如何保护这些数据，以及个人对所收集的个人数据享有的权利。\n\
  \n与任何其他敏感数据一样，组织必须指定数据所有者和数据管理员（或处理者），由他们对保护个人数据以及数据的安全收集、处理和使用负最终责任。组织内以任何身份访问个人数据的任何人都必须充分熟悉在数据的整个生命周期内收集、处理和保护此类信息的既定程序。这包括私有数据的保留和销毁，以及如\
  \ `data remanence.`（数据残留）等技术问题。\n\n![remember](img/remember.png) `Data remanence`\
  \ 指文件或数据被删除或擦除后保留在存储介质或内存中的残留数据。数据残留的发生是因为标准的删除程序仅将“已删除”的数据标记为可供覆盖的存储或内存空间。要完全消除数据残留，必须对存储介质和内存进行适当的擦除、去磁、加密或物理（且完全）破坏。`Object\
  \ reuse`（对象重用）指的是对象（如程序中的内存空间或介质上的存储块），如果没有妥善清理，可能会产生数据残留的风险。\n\n全球各地的大洲（如欧盟）、国家（或联邦）、州和地方层面以及各个行业，都存在许多隐私保护法律法规。隐私保护法是颁布的最严厉的法律之一，且法律要求差异巨大。这些法律通常还限制个人数据的收集、使用和保留，以及个人数据的跨境信息流动（或出口）。隐私法在第\
  \ 3 章中讨论。\n\n最后，在组织内部，经常会就员工在监控、搜索、药物检测和其他政策方面的权利产生员工隐私问题。\n\n监控通常以多种形式在组织内发生，包括互联网、电子邮件和通用计算机使用，以及通过监控摄像头、访问卡或钥匙和打卡机等。强制性和随机性的药物检测，以及对办公桌、储物柜、工作区域甚至个人车辆的搜索，是可能引发员工隐私担忧的其他常见政策。\n\
  \n为了减少或消除员工隐私担忧，组织政策应明确定义（并要求书面确认）计算机、互联网和电子邮件使用的可接受使用政策（`AUPs`）。额外的政策应说明监控目的、可接受的使用或行为，以及违规可能导致的潜在纪分措施。最后，组织政策应明确说明，员工对组织的监控和搜索政策没有\
  \ `expectation of privacy`（隐私预期）。\n\n### 确保妥当的保留\n\n大多数组织受到各种法律、法规和标准的约束，必须收集和存储某些信息，并将其保留指定的期限。组织必须意识到法律要求，并确保符合所有相关的法规和标准。\n\
  \n记录保留政策应涵盖任何可能位于文件服务器、文档管理系统、数据库、电子邮件系统、存档和记录管理系统的电子记录，以及存储在场外设施的纸质副本和备份介质。\n\n\
  希望保留信息比法律要求更长的组织，应坚定地建立此类信息为何应该保留更久的原因。如今，仅仅拥有信息就可能成为一种负担，因此保留敏感信息应该是例外而非常态。\n\n\
  数据保留同样适用于组织保留数据的 `minimum`（最短）和 `maximum`（最长）期限。保留超过需要的数据会增加组织的责任，特别是涉及敏感信息时。支付卡行业数据安全标准（`PCI\
  \ DSS`）要求信用卡数据的保留时间尽可能短（并且某些项目如磁条数据和 `PINs` 可能完全不被保留！），而日志数据必须至少保留一年（以协助调查）。\n\n\
  在记录保留光谱的另一端，许多组织现在一经法律允许就销毁记录（包括备份介质），以限制任何 `future`（未来）披露请求或诉讼的范围（和成本）。在实施此类严重限制你组织保留期限的严苛保留政策之前，你应该充分理解此类政策对你灾难恢复能力的负面影响。此外，请咨询你组织的法律顾问，以确保完全符合所有相关的法律法规。\n\
  \n![warning](img/warning.png) 尽管极短的保留政策和做法对于限制未来的披露请求或诉讼可能是明智的，但它们对于限制待决的披露请求或诉讼是\
  \ `illegal`（违法的）（甚至对于那些你有合理预期可能成为未来诉讼标的记录）。在这种情况下，不要销毁相关记录——否则，你会进监狱。你会直接进监狱！你无法通过起点，你拿不到\
  \ 200 美元，而且（噢，没错），你也通过不了 `CISSP` 考试——甚至不再获得 `CISSP` 认证的资格！\n\n## 确定数据安全控制\n\n敏感资产（包括数据）必须在其整个生命周期内得到适当保护。信息生命周期管理（`ILM`）通过以下五个阶段涵盖数据：\n\
  \n*   **创建。** 数据由终端用户或应用程序创建。此时需要根据数据的关键性和敏感性对数据进行分类，并分配一个数据所有者（通常是但不总是创建者）。数据可能以多种形式存在，如文档、电子表格、电子邮件和短信、数据库记录、表单、图像、演示文稿（包括视频会议）打印打印。\n\
  \n*   **分发（传输中的数据）。** 数据可以在组织内部分发（或检索），传输给外部接收者。分发可以是手动（如通过快递）或电子化的（通常通过网络）。传输中的数据易受损害，因此必须根据数据的分类实施适当的保护措施。例如，在公共网络上发送某些敏感数据可能需要加密。在这种情况下，必须建立适当的加密标准。数据泄露防护（`DLP`）技术也可用于防止敏感数据的意外或故意未经授权分发。\n\
  \n*   **使用（使用中的数据）。** 此阶段指的是被终端用户或应用程序访问并正被该用户或应用程序积极使用（例如读取、分析、修改、更新或复制）。使用中的数据必须在授权访问数据分类级别的系统上进行访问，且仅限具有相应权限（许可）和目的（知情需要）的用户和应用程序访问。\n\
  \n\n\n\n\n### 维护\n\n### 维护（“静态数据”）\n在数据创建与处置之间的任何时间，只要数据不处于“传输中”或“使用中”状态，就会以“静态”方式进行维护。维护包括对数据的存储（在硬盘、可卸式\
  \ USB 闪存、备份磁带或纸张等介质上）和归档（例如在目录和文件结构中）。数据还可能被备份，并将备份介质运输到安全的离线地点（称为“传输中数据”）。还应定期审查数据分类级别（通常由数据所有者执行），以确定是否需要升级分类级别（不常见）或可以降级。必须实施适当的保护措施并定期进行审计，以确保：\n\
  \n*   **机密性（及隐私性）。** 例如，使用系统、目录和文件权限以及加密技术。\n*   **完整性。** 例如，使用基准、加密哈希值、循环冗余校验 (CRC)\
  \ 和文件锁定（以防止或控制多个同时用户对数据进行修改）。\n*   **可用性。** 例如，使用数据库和文件集群（消除单点故障）、备份和实时复制（防止数据丢失）。\n\
  \n### 处置\n最后，当数据不再具有任何价值或对组织不再有用时，需要根据公司的保留和销毁政策以及任何适用的法律法规进行妥善销。某些敏感数据可能需要数据所有者的最终处置判定，并可能需要特定的销毁程序（如见证、记录以及磁消随后的物理销毁）。\n\
  \n![warning](img/warning.png) 仅被删除的数据**没有**被妥善销毁。它只是等待覆盖的“静态数据”——或者可能会被未经授权且潜在恶意的第三方不方便地发现！\n\
  \n![remember](img/remember.png) 数据残留是指在数据被“删除”后仍然存在于存储介质或内存中的数据。\n\n### 基准\n建立基准是一种标准的业务方法，用于将组织与起始点或最低标准进行比较，或者比较组织随时间推移的进展。通过安全控制，这些方法提供了宝贵的见解：\n\
  \n*   **与其他组织比较。** 组织可以将其控制集与其他组织进行比较，查看控制方面存在哪些差异。\n*   **随时间推移比较内部控制。** 组织可以对其控制集建立基准，以查看多年来控制集发生了哪些变化。\n\
  *   **随时间推移比较控制有效性。** 组织可以比较其控制有效性记录，查看哪些地方取得了进展，以及哪些地方需要更多努力来取得进展。\n\n### 范围确定与定制\n\
  由于组织的不同部分及其底层 IT 系统存储和处理不同的数据集，因此组织建立一套控制措施并将其施加于所有系统是没有意义的。就像过度简化的数据分类计划会导致对数据的过度保护和保护不足一样，组织通常会将自己划分为逻辑区域，然后指定在这些区域应用哪些控制措施和控制集。\n\
  \n另一种方法是针对不同的 IT 系统和组织部分对控制措施和控制集进行定制。例如，针对密码强度的控制可以有适用于具有不同安全级别的系统的类别。\n\n将复杂的控制环境应用于复杂的\
  \ IT 环境的两种方法都是有效的——它们实际上是实现同一目标的不同方式：根据它们所存储和处理的信息或其他标准，对各种系统和环境施加适当水平的控制。\n\n###\
  \ 标准选择\n目前有多种优秀的控制框架供安全专业人员使用。在任何情况下，都没有必要从零开始。相反，最佳方法是从几个行业领先的控制框架之一开始，然后根据组织的需求添加或删除单个控制措施。\n\
  \n控制框架标准包括：\n\n*   **ISO/IEC 27002,** 信息安全管理实践规范。\n*   **COBIT 5,** 信息和相关技术控制目标。\n\
  *   **NIST SP800-53,** 联邦信息系统和组织建议的安全措施。\n*   **NIST SP800-171 Revision 1,** 非联邦系统和组织中受控非分类信息的保护。\n\
  *   **NIST 网络安全框架 (CSF),** 基础设施网络安全框架。\n\n### 加密\n加密在数据保护中起着至关重要的作用，无论是通过网络传输的数据，还是位于服务器或工作站上的静态数据。加密的核心在于在可见处隐藏数据，因为在某些情况下人员可能会访问敏感数据；除非他们拥有加密密钥和解密方法，否则加密会拒绝这种访问。\n\
  \n### 建立处理要求\n财务记录、员工数据和客户信息等敏感信息必须根据既建立的组织政策、标准和程序进行清晰标记、妥善处理和存储以及适当销毁：\n\n*  \
  \ **标记：** 组织识别敏感信息（无论是电子版还是纸质版）的方式。例如，标记可能读为 `CONFIDENTIAL`（本章前面讨论过）。标记方法将取决于我们所讨论的数据类型。例如，电子文档可以在每页的页脚边边处有标记。当应用程序显示敏感数据时，可能是应用程序本身告知用户所显示数据的分类。\n\
  *   **处理：** 组织应建立处理敏感信息的既定程序。这些程序详细说明了员工如何运输、传输和使用此类信息，以及任何适用的限制。\n*   **存储与备份：**\
  \ 与处理类似，组织必须有程序和要求，规定敏感信息必须如何存储和备份，以及如何保护备份介质。\n*   **销毁：** 迟早，组织必须销毁包含敏感信息的文档。组织必须有详细程序，说明如何销毁之前保留的敏感信息，无论数据是纸质还是保存为电子文件。\n\
  \n# 第 5 章\n\n# 安全架构与工程\n\n### 本章内容\n![check](img/check.png) **使用安全设计原则**\n![check](img/check.png)\
  \ **理解安全模型**\n![check](img/check.png) **选择正确的控制措施和对策措施**\n![check](img/check.png)\
  \ **识别信息系统中的安全能力**\n![check](img/check.png) **评估并缓解漏洞**\n![check](img/check.png)\
  \ **解密加密概念和基础**\n![check](img/check.png) **深入理解物理安全设计概念**\n\n安全必须是信息系统设计的一部分，也是容纳信息系统和员工的设施的一部分，这属于“安全架构与工程”领域。该领域占\
  \ CISSP 认证考试的 13%。\n\n## 使用安全设计原则实施和管理工程过程\n\n\n\n\n\n在构建事物时而不先考虑其设计或安全影响，是人类的一种自然倾向。一个正在构建新网络的网络工程师可能直接开始将电缆插入路由器和交换机，而没有先思考过整体设计——更不用说任何安全考虑了。同样，被指派编写新程序的软件工程师往往也直接开始编码，而不规划程序的设计。\n\
  \n如果我们观察外部世界和现有的消费产品，有时会看到极其严重的可用性和安全缺陷，这让我们怀疑，个人或组织是如何被允许参与其设计和开发的。\n\n![tip](img/tip.png)\
  \ 安全专业人员需要帮助组织理解，“设计安全”（security-by-design）原则是任何系统开发的关键组成。\n\n需要包含安全设计原则的工程流程包括：\n\
  \n*   **概念开发。** 从构思阶段开始，安全考虑对于任何新 IT 工程任务的成功都至关重要。每个项目和产品都始于某些东西——白板会议、餐巾纸或披萨盒上的草图，或者电话会议。无论项目如何开始，都应该有人询问：在这个新事物中，关键数据、功能和组件将如何受到保护。我们寻找的不是详细的答案，而是足够的信心，让我们知道自己不是那些冲向最近悬崖的最新旅鼠。\n\
  *   **需求。** 在实际设计开始之前，一个或多个人将定义新系统或功能的需求。通常有几类需求。需要包括安全、隐私和合规性需求。\n*   **设计。** 在建立所有需求并达成一致后，可以开始系统或组件的正式设计。设计必须包含上一步中建立的所有需求。\n\
  *   **开发。** 根据所构建的内容，开发可能有多种形式，包括创建：\n    *   系统和设备配置\n    *   数据中心设备机架图\n    *\
  \   用于管理和监控系统的数据流\n*   **测试。** 对单个组件和整个系统进行测试，以确认早先开发的各项需求都已实现。通常，应该由构建者/开发人员以外的人执行测试。\n\
  *   **实施。** 当系统或组件投入使用时，安全考虑有助于确保这不会使新系统/组件相关事物面临风险。实施活动包括：\n    *   配置和布线网络设备。\n\
  \    *   安装和配置操作系统或子系统，例如数据库管理系统、Web 服务器或应用程序。\n    *   物理设施、工作区域或数据中心的建设。\n*  \
  \ **维护与支持。** 系统或设施投入使用后，所有后续更改都需要经过相似的工程步骤，以确保快速缓解新的或变化的安全风险。\n*   **退役。** 当系统或设施达到使用寿命时，必须对其进行退役，且不能让数据、其他系统或人员面临风险。\n\
  \n![tip](img/tip.png) 构建安全成熟度模型 (BSIMM) 是一种软件安全基准工具，为软件安全提供了一个框架。它由 256 个测量指标和 113\
  \ 项活动组成。BSIMM 活动由 12 项实践组成，组织分为四个领域，包括治理、情报、SSDL 触点和部署。访问 [`www.bsimm.com`](http://www.bsimm.com)\
  \ 了解更多关于 BSIMM 的信息。\n\n应用程序开发生命周期也包含了安全考虑，与这里的安全工程原则几乎相同。应用程序开发在第 10 章中介绍。\n\n##\
  \ 理解安全模型的基础概念\n\n安全模型帮助我们理解信息系统中复杂的安全机制。安全模型说明了在分析现有系统或设计新系统时可以使用的概念。\n\n在本节中，我们描述了机密性、完整性和可用性（统称为\
  \ `CIA` 或 `CIA 三元组`）以及访问控制模型。在第 3 章中了解更多关于 `CIA 三元组` 的信息。\n\n### 机密性\n\n`Confidentiality`\
  \ 指信息和功能（对象）应该仅由授权的主体访问的概念。这通常通过多种手段实现，包括：\n\n*   **访问与授权：** 从包含计算机的设施的物理访问，到用户账户访问、基于角色的访问控制和基于属性的访问控制，其目标是确保只有具有适当业务授权的人员允许访问信息。该主题在第\
  \ 7 章介绍。\n*   **漏洞管理：** 包括从系统加固到补丁管理以及消除应用程序中的漏洞的所有内容。我们在这里试图避免任何人攻击系统并获取数据。\n*\
  \   **完善的系统设计：** 系统的整体设计防止未经授权的主体访问受保护的数据。\n*   **良好的数据管理实践：** 组织建立了流程，以定义其所管理或控制的信息的使用方式。\n\
  \n这些特征共同作用，确保秘密保持为秘密。\n\n### 完整性\n\n`Integrity` 指系统中的信息将正确到达或创建，并在整个寿命范围内保持这种正确性的概念。存储信息的系统将拒绝未经授权的部分或未经授权手段尝试更改。系统确保的数据完整性特征是：\n\
  \n*   完整性\n*   及时性\n*   准确性\n*   有效性\n\n确保数据完整性采取的一些措施是：\n\n*   **授权：** 指数据是否有适当授权进入系统。数据记录的完整性包括它是否本该在系统中。\n\
  *   **输入控制：** 包括验证进入系统的新数据是否符合正确的格式且在正确的范围内。\n*   **访问控制：** 用于控制谁（以及什么）允许更改数据，以及数据何时可以更改。\n\
  *   **输出控制：** 包括验证离开系统的数据格式是否正确且完整。\n\n所有这些步骤都有助于确保系统中的数据具有可能的质量。\n\n### 可用性\n\n\
  `Availability` 指系统（及其内部数据）在用户需要的时间和地点是可以被访问的概念。决定系统可用性的特征包括：\n\n*   **弹性硬件设计：**\
  \ 特性可能包括冗余电源、网络适配器、处理器和其他组件。这些有助于确保即使某些内部组件发生故障，系统也能继续运行。\n*   **弹性软件：** 操作系统和其他软件组件需要设计和配置得尽可能可靠，整合了多线程、多进程和多程序编程等技术。\n\
  *   **弹性架构：** 我们在这里讨论的是大局。除了弹性硬件设计外，我们建议其他组件也具有冗余，包括路由器、防火墙、交换机、电信电路以及其他可能成为单点故障的物品。\n\
  \n\n\n\n\n*   **配置管理、变更管理和预防性维护流程：** 可用性不仅包括系统本身的组件，还依赖于良好的系统管理实践。本质上，可用性意味着避免非计划的停机，而停机通常是粗糙的配置管理和变更管理实践，或者忽视了预防性维护的后果。\n\
  *   **建立的业务连续性和灾难恢复计划：** 组织需要确保自然灾害和人为灾害不对关键系统和数据的可用性产生不利影响。本主题将在本章稍后详细介绍。\n\n![remember](img/remember.png)\
  \ CIA 三要素（CIA Triad）包含了信息安全的三个原则：机密性、完整性和可用性。\n\n### 访问控制模型\n\n模型用于在理论或数学框架中表达访问控制需求，该框架能够精确描述或量化真实的访问控制系统。常见的访问控制模型包括\
  \ `Bell-LaPadula`、`Access Matrix`、`Take-Grant`、`Biba`、`Clark-Wilson`、`Information\
  \ Flow` 和 `Non-interference`。\n\n![remember](img/remember.png) `Bell-LaPadula`、`Access\
  \ Matrix` 和 `Take-Grant` 模型解决存储信息的机密性。`Biba` 和 `Clark-Wilson` 解决存储信息的完整性。\n\n####\
  \ Bell-LaPadula\n\n`Bell-LaPadula` 模型是强制访问控制系统中第一个正式的机密性模型。（我们在第 7 章 中讨论了强制访问控制和自主访问控制）。它是为美国国防部（DoD）开发的，旨在将\
  \ DoD 的多级安全策略正式化。正如我们在第 3 章 中讨论的，DoD 根据敏感性将信息分为三个级别：机密（Confidential）、秘密（Secret）和绝密（Top\
  \ Secret）。为了访问分类信息（及系统），个人必须拥有权限（许可级别等于或高于信息或系统的分类）并且知情（即为了执行所需的工作职而需要访问）。`Bell-LaPadula`\
  \ 模型实现了该安全策略的访问部分。\n\n`Bell-LaPadula` 是一个状态机模型，仅解决信息的机密性。`Bell-LaPadula` 的基本前提是信息不能向下流动。这意味着较高级的信息不允许被复制或移动到较低级。`Bell-LaPadula`\
  \ 定义了以下两个属性：\n\n*   **简单安全属性（ss 属性）：** 主体不能从敏感性标签高于主体的对象读取信息（也称为“不准向上读”，即 `NRU`）。\n\
  *   **-property 属性（星型属性）：** 主体不能向敏感性标签低于主体的对象写入信息（也称为“不准向下写”，即 `NWD`）。\n\n`Bell-LaPadula`\
  \ 还定义了两个额外的属性，赋予了它自主访问控制模型的灵活性：\n\n*   **自主安全属性：** 该属性根据 `Access Matrix`（访问矩阵）决定访问——在接下来的章节中将详细介绍该模型。\n\
  *   **可信主体：** 可信主体是一个可以违反 `*-property` 但不违反其意图的实体。\n\n![tip](img/tip.png) `state\
  \ machine`是一种用于设计计算机程序的抽象模型；`state machine`说明了程序在任何时候将处于何种“状态”。\n\n#### 访问矩阵\n\n\
  通常情况下，`Access Matrix model` 模型为自主访问控制（DAC）系统中的主体提供对象访问权限（读/写/执行，或 `R/W/X`）。`Access\
  \ Matrix` 由访问控制列表（列）和能力列表（行）组成。示例请参见表 5-1。\n\n| **主体/对象** | **目录: H/R** | **文件:\
  \ 人员** | **进程: LPD** |\n| --- | --- | --- | --- |\n| Thomas | Read | Read/Write\
  \ | Execute |\n| Lisa | Read | Read | Execute |\n| Harold | None | None | None |\n\
  \n表 5-1 访问矩阵示例\n\n#### Take-Grant\n\n`Take-Grant systems` 规定了主体可以向另一个主体或对象转移的权利。这些权利通过四个基本操作定义：`create`、`revoke`、`take`\
  \ 和 `grant`。\n\n#### Biba\n\n`Biba` 完整性模型（有时被称为倒置的 `Bell-LaPadula`）是第一个正式的完整性模型。`Biba`\
  \ 是一个基于格的模型，解决了完整性的第一个目标：确保数据的修改不是由未经授权的用户或进程进行的。（请参见第 3 章 关于完整性三个目标的完整讨论。）`Biba`\
  \ 定义了以下两个属性：\n\n*   **简单完整性属性：** 主体不能从完整性级别低于主体的对象读取信息（也称为“不准向下读”）。\n*   **-integrity\
  \ 属性（星型完整性属性）：** 主体不能向完整性级别高于主体的对象写入信息（也称为“不准向上写”）。\n\n#### Clark-Wilson\n\n`Clark-Wilson\
  \ 完整性模型`为商业活动（如银行业）建立了安全框架。`Clark-Wilson` 解决了完整性的所有三个目标，并根据以下项目和程序识别了输入数据的特殊要求：\n\
  \n*   **无约束数据项 (UDI)：** 控制区域之外的数据，例如输入数据。\n*   **受约束数据项 (CDI)：** 控制区域内的数据。（必须保持完整性。）\n\
  *   **完整性验证程序 (IVP)：** 检查 `CDI` 的有效性。\n*   **转换程序 (TP)：** 维护 `CDI` 的完整性。\n\n`Clark-Wilson`\
  \ 完整性模型基于“良好格式事务,*的概念，即事务经过充分排序和控制，以保持内部和外部的一致。\n\n#### 信息流\n\n`Information Flow\
  \ model`是一种基于信息流而非实施访问控制的模型类型。对象被分配安全类和值，其流的方向（从一个应用程序到另一个，或从一个系统到另一个系统）由安全策略控制。这种模型用于分析隐蔽通道，通过对系统的信息源和流路径进行详细分析。\n\
  \n#### 非干扰\n\n`non-interference model`确保不同对象和主体的操作不会被同一系统的其他对象和主体看到。\n\n## 根据系统安全需求选择控制\n\
  \n设计和构建安全软件对于信息安全至关重要，但运行软件的系统本身必须经过安全设计和构建。选择适当的控制对于设计安全的计算架构至关重要。存在许多系统安全评估模型可以帮助你根据环境选择正确的措施。\n\
  \n### 评估标准\n\n评估标准为量化计算机系统或网络的安全性提供了标准。这些标准包括信任计算机系统评估标准 (`TCSEC`)、信任网络解释 (`TNI`)、欧洲信息技术安全评估标准\
  \ (`ITSEC`) 和通用标准 (`Common Criteria`)。\n\n#### 信任计算机系统评估标准 (TCSEC)\n\n`信任计算机系统评估标准\
  \ (TCSEC)`，俗称为 `橙皮书,*` 是美国国防部 (DoD) 为国家计算机安全中心 (NCSC) 开发的彩虹系列书籍的一部分。它是 `Bell-LaPadula`\
  \ 模型的正式实现。开发评估标准的目的是实现以下目标：\n\n*   **测量：** 为评估不同计算机系统之间的比较信任水平提供了度量。\n\n\n\n\n-\
  \   **指导 (Guidance)：** 识别供应商必须在系统中构建的标准安全需求，以达到特定的信任级别。\n-   **获取 (Acquisition)：**\
  \ 为客户提供指定获取需求的标准，并识别满足这些要求的系统。\n\n《橙色书》（Orange Book）中确定的四个基本控制需求是：\n\n-   **安全策略\
  \ (Security policy):** 信任系统运行遵循的规则和程序。特定的 TCSEC 要求包括：\n    -   **自主访问控制 (DAC)：**\
  \ 对象的拥有者能够向其他主体分配权限。\n    -   **强制访问控制 (MAC)：** 对象的权限由管理员集中管理。\n    -   **对象重用 (Object\
  \ reuse)：** 保护在使用后重新分配的对象的机密性。例如，被删除的文件仍然存在于存储媒介上；仅文件分配表（`FAT`）和文件的第一个字符被修改。因此，残留数据可能会被恢复，这描述了`data\
  \ remanence`（数据残留）问题。对象重用定义定义实际擦除数据的程序。\n    - **标签 (Labels)：** 基于 MAC 系统需要敏感性标签。（有关信息分类的更多信息，请参阅第\
  \ 3 章。）特定的 TCSEC 标签要求包括完整性、出口和主体/对象标签。\n\n-   **保证 (Assurance)：** 保证安全策略被正确实施。特定的\
  \ TCSEC 要求（此处列出）分类为`operational assurance requirements`（操作保证需求）：\n    - **系统架构 (System\
  \ architecture)：** TCSEC 要求实现特定安全功能的系统设计特性和原则。\n    - **系统完整性 (System integrity)：**\
  \ 硬件和固件正常运行，并经过测试以验证操作正常。\n    - **隐蔽道分析 (Covert channel analysis)：** TCSEC 要求进行隐蔽道分析，检测不受系统正常安全机制保护的意外通信路径。`covert\
  \ storage channel`（隐蔽存储道）通过更改存储的系统数据来传递信息。`covert timing channel`（隐蔽定时道）通过更改系统资源的性能或定时来传递信息。\n\
  ![remember](img/remember.png) 系统或安全架构师必须理解隐蔽道及其工作原理，以防止在系统环境中使用它们。\n    - **信任设施管理\
  \ (Trusted facility management)：** 指定特定人员管理系统的安全相关功能。与`least privilege`（最小权限）、`separation\
  \ of duties`（职责分离）和`need-to-know`（按需知原则）概念密切相关。\n    - **信任恢复 (Trusted recovery)：**\
  \ 确保在系统崩溃或故障时安全性不受损害。此过程涉及两个主要活动：故障准备和系统恢复。\n    - **安全测试 (Security testing)：**\
  \ 规定了开发者和国家计算机安全中心（NCSC）所需的测试。\n    - **设计规范与验证 (Design specification and verification)：**\
  \ 要求通过数学和自动化的证明，说明设计描述与安全策略一致。\n    - **配置管理 (Configuration management)：** 在系统生命周期的设计、开发和维护阶段，对信任计算基础（`TCB`）的所有更改进行识别、控制、计数和审计。\n\
  \    - **信任分发 (Trusted distribution)：** 保护系统从供应商到客户的传输过程。\n\n-   **问责制 (Accountability)：**\
  \ 将用户和进程与其行为关联的能力。特定的 TCSEC 要求包括：\n    - **身份识别与身份验证 (I&A)：** 系统需要跟踪谁执行了什么活动。我们在第\
  \ 7 章中讨论这一主题。\n    - **信任路径 (Trusted Path)：** 用户与信任计算基础（`TCB`）之间的直接通信路径，不需要与不可信的应用程序或操作系统层交互。\n\
  \    - **审计 (Audit)：** 在信任系统中记录、检查、分析和审查与安全相关的活动。\n\n-   **文档 (Documentation)：**\
  \ 特定的 TCSEC 要求包括：\n    - **安全特性用户指南 (SFUG)：** 系统的用户手册。\n    - **信任设施手册 (TFM)：**\
  \ 系统管理员和/或安全管理员的手册。\n    - **测试文档 (Test documentation)：** 根据 TCSEC 手册，这些文档必须能够“展示安全机制是如何进行测试的，以及安全机制功能测试的结果”。\n\
  \    - **设计文档 (Design documentation)：** 定义系统边界和内部组件，例如信任计算基础（`TCB`）。\n\n![remember](img/remember.png)\
  \ 《橙色书》定义了四个主要的层级安全保护分级，以及带编号的子类（数字越大表示安全性越高）：\n\n-   **D：** 最小保护 (Minimal protection)\n\
  -   **C：** 自主保护 (Discretionary protection, C1 和 C2)\n-   **B：** 强制保护 (Mandatory\
  \ protection, B1, B2 和 B3)\n-   **A：** 验证保护 (Verified protection, A1)\n\n这些类别在表\
  \ 5-2 | 系统不需要区分单个用户和访问类型。 |\n| C2 | 受控访问保护 (DAC) | 系统必须区分单个用户和访问类型；需要对象重用安全功能。 |\n\
  | B1 | 标记安全保护 (MAC) | 所有主体和存储对象都需要敏感性标签。 |\n| B2 | 结构化保护 (MAC) | 所有主体和对象都需要敏感性标签；有信任路径要求。\
  \ |\n| B3 | 安全域 (MAC) | 特别需要访问控制列表（`ACL`）；系统必须防止隐蔽道。 |\n| A1 | 验证设计 (MAC) | 需要形式顶层规范\
  \ (FTLS）；在整个系统生命周期中必须执行配置管理程序。 |\n| A1 之外 | 在信任计算基础（`TCB`）中实现了自保护和参考监视。`TCB` 验证到源码级。\
  \ |\n\n表 5-2 TCSEC 类别\n\n![tip](img/tip.png) 对于 CISSP 考试，你不需要知道每个 TCSEC 级别的具体要求，但你应该知道\
  \ DAC 和 MAC 在什么级别实现的，以及各类的相对信任级别，包括编号的子类。\n\n《橙色书》的主要局限性包括：\n\n-   它只处理机密性问题。不包含完整性和可用性。\n\
  -   它不适用于大多数商业系统。\n-   它强调防止未经授权的访问，尽管统计数据表明，许多安全违规行为涉及内部人员。\n-   它没有解决网络问题。\n\n\
  #### 信任网络解释 (TNI)\n\n作为“彩虹系列”（Rainbow Series）的一部分，类似于 TCSEC（在前节中讨论过），信任网络解释（TNI）解决了信任计算机/通信网络系统中的机密性和完整性问题。在彩虹系列中，它被称为`红书`（Red\
  \ Book）。\n\nTNI 的第一部分是将 TCSEC（《橙色书》）中定义的系统保护标准扩展到网络的指南。TNI 的第二部分描述了额外的安全功能，如通信完整性、防止拒绝服务攻击和传输安全。\n\
  \n#### 欧洲信息技术安全评估标准 (ITSEC)\n\n与 TCSEC 不同，欧洲信息技术安全评估标准（ITSEC）涵盖了机密性、完整性和可用性，以及评估整个系统（定义为“评估目标”\
  \ `TOE`），而不是单个计算平台。\n\n\n\n\n\nITSEC 分别评估 `functionality`（安全目标，即“为什么”；强制安全函数，即“做什么”；以及安全机制，即“如何做”）和\
  \ `assurance`（有效性和正确性）。十个功能 (F) 类和七个评估 (E) 保证级别列在表 5-3 中。\n\n| (F) 类 | (E) 级别 |\
  \ 描述 |\n| --- | --- | --- |\n| NA | E0 | 等于 TCSEC D 级 |\n| F-C1 | E1 | 等于 TCSEC\
  \ C1 级 |\n| F-C2 | E2 | 等于 TCSEC C2 级 |\n| F-B1 | E3 | 等于 TCSEC B1 级 |\n| F-B2 |\
  \ E4 | 等于 TCSEC B2 级 |\n| F-B3 | E5 | 等于 TCSEC B3 级 |\n| F-B3 | E6 | 等于 TCSEC A1\
  \ 级 |\n| F-IN | NA | 有高完整性要求的 TOE |\n| F-AV | NA | 有高可用性要求的 TOE |\n| F-DI | NA |\
  \ 数据通信期间高完整性要求的 TOE |\n| F-DC | NA | 数据通信期间高机密性要求的 TOE |\n| F-DX | NA | 高机密性和完整性要求的网络\
  \ |\n\n表 5-3 ITSEC 功能 (F) 类与评估 (E) 级别到 TCSEC 级的映射\n\n![tip](img/tip.png) 对于 CISSP\
  \ 考试，你不需要了解每个 ITSEC 级别的具体要求，但你应该了解基本功能级别（F-C1 到 F-B3）和评估级别（E0 到 E6）如何与 TCSEC 级别相关。\n\
  \n## 通用标准\n\n信息技术安全评估通用标准（通常简称为 `Common Criteria`）是一项旨在标准化和改进现有的欧洲和北美评估标准的国际努力。通用标准已被\
  \ ISO 15408 纳为国际标准。通用标准定义了八个 `evaluation assurance levels` (EAL)，它们列在表 5-4 中。\n\n\
  | 级别 | TCSEC 等于 | ITSEC 等于 | 描述 |\n| --- | --- | --- | --- |\n| EAL0 | N/A | N/A\
  \ | 保证不足 |\n| EAL1 | N/A | N/A | 功能测试 |\n| EAL2 | C1 | E1 | 结构测试 |\n| EAL3 | C2\
  \ | E2 | 方法化测试和检查 |\n| EAL4 | B1 | E3 | 方法化设计、测试和审查 |\n| EAL5 | B2 | E4 | 半形式化设计和测试\
  \ |\n| EAL6 | B3 | E5 | 半形式化验证的设计和测试 |\n| EAL7 | A1 | E6 | 形式验证的设计和测试 |\n\n表 5-4\
  \ 通用标准\n\n![tip](img/tip.png) 对于 CISSP 考试，你不需要了解每个通用标准级别的具体要求，但你应该理解基本的评估分级体系（EAL0\
  \ 到 EAL7，按信任级别递增排序）。\n\n## 系统认证与授权\n\n系统 `certification`（认证）是一种通过使用既定的评估标准（TCSEC），对给定环境下的信息系统安全防护措施（包括技术性和非技术性的）进行全面的测试和文档记录的正式方法。\n\
  \n`Accreditation`（授权）是对特定系统在特定环境中运行的正式书面批准，记录在认证报告中。通常由高级执行人员或指定授权机构 (`DAA`) 授予。`DAA`\
  \ 一词用于美国军方和政府。`DAA` 通常是高级官员，例如指挥官。\n\n当系统或环境发生任何变化时，必须更新系统认证和授权，并且必须定期重新验证，这通常每三年一次。\n\
  \n认证和授权流程已在美国军和政府组织中正式实施，分别称为国防信息技术安全认证与授权流程 (DITSCAP) 和国家信息安全认证与授权流程 (NIACAP)。使用云系统和服务的美国政府机构需要接受\
  \ FedRAMP 认证和授权流程（在本章中描述）。这些重要流程用于确保新（或更改过的）系统具有适当的设计和运行特性，并适用于特定任务。\n\n### DITSCAP\n\
  \n国防信息技术安全认证与授权流程 (DITSCAP) 通过四个不同的阶段将美国国防部（DoD）信息系统的认证和授权流程正式化：\n\n- **定义 (Definition):**\
  \ 通过定义组织和系统的任务、环境和架构来确定安全需求。\n- **验证 (Verification):** 确保正在开发或修改的系统符合系统安全授权协议 (`SSAA`)，该协议是一份基线安全配置文档。\n\
  - **确认 (Validation):** 确认符合 `SSAA` 规定。\n- **授权后 (Post-Accreditation):** 代表在系统的整个生命周期内维持合规性并应对新演变威胁所需的持续活动。\n\
  \n### NIACAP\n\n国家信息安全认证与授权流程 (NIACAP) 将美国政府国家安全信息系统的认证和授权流程正式化。NIACAP 由四个阶段（定义、验证、确认和后期）组成，通常对应\
  \ DITSCAP 的阶段。此外，NIACAP 定义了三种授权：\n\n- **站点授权 (Site accreditation):** 评估特定地点的所有应用程序和系统。\n\
  - **类型授权 (Type accreditation):** 评估多个地点的特定应用程序或系统。\n- **系统授权 (System accreditation):**\
  \ 评估特定地点的特定应用程序或系统。\n\n### FedRAMP\n\n联邦风险与授权管理 (FedRAMP) 是针对云服务提供者的评估、授权和持续监控的标准方法。这代表了从基于控制的安全向基于风险的安全转变。\n\
  \n### DCID 6/3\n\n中央情报局指令 6/3 (DCID 6/3) 是保护美国中央情报局 (`CIA`) 使用的计算机上敏感信息的流程。\n\n\
  ## 安全控制与对策\n\n适用于安全架构的各种安全控制和对策包括深度防御、系统加固、异构环境实施以及设计弹性。\n\n### 深度防御\n\n`Defense\
  \ in depth` 是抵抗攻击的策略。采用深度防御的系统具有两个或多个层的保护措施，旨在保护系统或存储在那的数据。\n\n一个深度防御架构将由多个组件保护数据库，例如：\n\
  \n- 筛选路由器\n- 防火墙\n- 入侵防御系统\n- 加固操作系统\n- 基于系统的网络过滤\n\n这里列出的所有层都有助于保护数据库。事实上，每一层单独就能提供近乎完全的保护。但结合在一起时，所有这些控制提供了多样的（实际上是更深的）防御，因此被称为`深度防御`。\n\
  \n![remember](img/remember.png) 深度防御是指使用多层保护。\n\n### 系统加固\n\n大多数信息系统（包括计算机操作系统）都有几项易于设置系统的通用功能。但暴露在互联网上的系统应该“加固”，或根据以下概念进行配置：\n\
  \n- 移除所有不必要的组件。\n- 移除所有不必要的账户。\n- 关闭所有不必要的监听端口。\n- 将所有默认密码更改为复杂的、难以猜测的密码。\n- 所有必要的程序应以最低权限运行。\n\
  \n\n\n\n\n*   安全补丁一旦发布就应尽快安装。\n\n可以从多个来源获取系统加固指南，例如：\n\n* 互联网安全中心 ([www.cisecurity.org](http://www.cisecurity.org))。\n\
  * 来自美国国防信息安全局（DISA）的信息保障支持环境（[`iase.disa.mil/stigs`](https://iase.disa.mil/stigs)）。\n\
  \n![tip](img/tip.png) 软件和操作系统供应商通常提供自己的加固指南，这些也可能有用。\n\n## 异构环境\n\n异构环境并非包含单一类型的系统或组件，而是包含多种不同类型的系统。对比仅由\
  \ Windows 2016 服务器以及最新的 SQL Server 和 IIS Server 组成的环境，与包含 Windows、Linux 和 Solaris\
  \ 服务器以及 Microsoft SQL Server、MySQL 和 Oracle 数据库的更复杂的环境。\n\n异构环境的优势在于系统的多样性；一方面，不同类型的系统可能不具有共同漏洞，这使得它们难以被攻击。然而，异构环境的复杂性也会对安全产生负面影响，因为有更多可能失效或被破坏的组件。\n\
  \n同构环境（所有系统都相同的环境）的弱点在于一致性。如果发现其中一个系统的漏洞，所有系统都可能存在该漏洞。如果其中一个系统受到攻击并破坏，所有系统都可能受到攻击并破坏。\n\
  \n你可以将同构性比作一群动物；如果它们的基因完全相同，那么它们可能都容易受到某种可能消灭整个群体的疾病的影响。如果它们的基因具有多样性，那么可能某些个体能够从疾病生存。\n\
  \n## 系统弹性\n\n系统的弹性是衡量其在非理想条件下保持运行的能力。弹性在所有层面都至关重要，包括网络、操作系统、子系统（如数据库管理系统或 Web 服务器）和应用程序。\n\
  \n弹性具有许多不同的含义。以下是一些示例：\n\n* 过滤恶意输入：系统可以识别并拒绝可能是攻击的输入。可疑输入的示例包括在注入攻击、缓冲区溢出攻击或拒绝服务攻击中通常看到的输入。\n\
  * 数据复制：在组件发生故障时，系统将关键数据复制到单独存储系统中。\n* 冗余组件：系统包含冗余组件，允许系统在发生硬件故障或故障时继续运行。冗余组件示例包括多个电源、多个网络接口、冗余存储技术（如\
  \ RAID）以及冗余服务器架构技术（如集群）。\n* 维护钩子：软件程序中隐藏的、未记录的功能，旨在不当地暴露数据或功能以供非法使用。\n* 安全防御措施：由于系统经常受到频繁或持续的攻击，系统架构师需要包含若干安全防御措施以减少系统漏洞。此类防御措施包括：\n\
  \    * 尽可能少地披露系统信息。例如，不要允许系统显示正在运行的操作系统、数据库或应用程序版本。\n    * 将访问限制在那些为了履行必要的组织功能必须使用系统的人员。\n\
  \    *禁用不必要的服务以减少攻击目标数量。\n    * 使用强身份验证，使外部人员访问系统尽可能困难。\n\n### 理解信息系统的安全能力\n\n与安全架构相关的概念包括可信计算基础\
  \ (TCB)、可信平台模块 (TPM)、安全操作模式、开放和封闭系统、保护环、安全模式和恢复程序。\n\n### 计算机架构\n\n基础计算机（系统）架构指的是计算机系统的结构，由其硬件、固件和软件组成。\n\
  \n![tip](img/tip.png) CompTIA A+ 认证考试深入涵盖计算机架构，是准备 CISSP 考试这部分的极佳方式。\n\n### 硬件\n\
  \n硬件由计算机架构中的物理组件组成。计算机架构的主要组件包括 CPU、内存和总线。\n\n### CPU\n\nCPU（中央处理单元）或微处理器是执行计算机算术、逻辑和计算功能的电子电路。如图\
  \ 5-1 所示，CPU 的主要组件包括\n\n* 算术逻辑单元 (ALU)：执行数值计算和比较逻辑功能，例如 `ADD`、`SUBTRACT`、`DIVIDE`\
  \ 和 `MULTIPLY`。\n* 总线接口单元 (BIU)：监督 CPU 与 I/O 设备之间通过总线系统的数据传输。\n* 控制单元 (Control Unit)：程序执行期间协调其他\
  \ CPU 组件的活动。\n* 解码单元 (Decode Unit)：将传入的指令转换为单个 CPU 指令。\n* 浮点单元 (FPU)：为 ALU 和控制单元处理高级数学运算。\n\
  * 内存管理单元 (MMU)：处理存储在内存中的数据寻址和编目，并将逻辑地址转换为物理地址。\n* 预取单元 (Pre-Fetch Unit)：将指令预加载到\
  \ CPU 寄存器中。\n* 保护测试单元 (PTU)：监控所有 CPU 功能以确保它们被正确执行。\n* 寄存器 (Registers)：在特殊缓冲区中临时持有的\
  \ CPU 数据、地址和指令。\n\n![image](img/9781119505815-fg0501.png)\n\n图 5-1： CPU 的主要组件。\n\
  \n微处理器的基本操作由两个不同的阶段组成：取指和执行。（和你的狗的行为没什么区别：你扔出棍子，它去去捡回来。）在取指阶段，CPU 从内存中定位并检索所需的指令。在执行阶段，CPU\
  \ 解码并执行该指令。这两个阶段构成了由 CPU 时钟信号控制的基本机器周期。许多复杂指令需要多个一个机器周期才能执行。\n\n计算机（CPU）的四种工作状态包括\n\
  \n* 操作（或运行）状态：CPU 执行指令或指令集。\n* 问题（或应用）状态：CPU 计算应用程序问题的解决方案。在此状态下，仅可用有限的指令集（非特权指令）。\n\
  * 监控状态：CPU 执行特权指令，这意味着指令仅对系统管理员或其他授权用户/进程可用。\n* 等待状态：CPU 尚未完成指令执行，必须延长周期。\n\n现代计算机系统中使用的两种基本\
  \ CPU 设计类型是\n\n* 复杂指令集计算 (CISC)：每个指令即可执行多次操作。优化了取指阶段是指令执行周期中最长部分的系统。使用 CISC 的 CPU\
  \ 包括 Intel x86、PDP-11 和 Motorola 68000。\n* 精简指令集计算 (RISC)：比 CISC 架构使用更少、更简单的指令，执行所需的时钟周期更少。优化了取指和执行阶段大致相同的系统。具有\
  \ RISC 架构的 CPU 包括 Alpha、PowerPC 和 SPARC。\n\n\n\n\n\n微处理器通常被描述为标量（scalar）或超标量（superscalar）。`scalar`处理器一次执行一条指令。而`superscalar`处理器可以并发执行多条指令。\n\
  \n最后，许多系统（微处理器）根据额外的功能（必须由已安装的操作系统支持）进行分类：\n\n*   **多任务（Multitasking）：** 在单个处理器上交替执行多个子程序或任务。\n\
  *   **多程序控制（Multiprogramming）：** 在单个处理器上交替执行多个程序。\n*   **多处理器处理（Multiprocessing）：**\
  \ 在多个个处理器上同时执行多个程序。\n\n两个相关的概念是多态（multistate）和多用户（multiuser）系统，更准确地指的是操作系统的能力：\n\
  \n*   **多态（Multistate）：** 操作系统支持多种运行状态，例如 `UNIX`/`Linux` 世界中的单用户和多用户模式，以及 `Windows`\
  \ 世界中的正常模式和安全模式。\n*   **多用户（Multiuser）：** 操作系统可以区分用户。例如，它为每个用户提供不同的 shell 环境、配置文件或权限级别，并提供用户之间的进程隔离。\n\
  \n多用户系统中的一个重要安全问题涉及特权账户以及运行在特权状态下的程序或进程。如 `su` (`UNIX`/`Linux`) 和 `RunAs` (`Windows`)\
  \ 程序允许用户切换到不同的账户（如 `root` 或 `administrator`），并在该环境中执行特权命令。许多程序依赖特权服务账户才能正常运行。例如，IBM\
  \ 的 `Superzap` 等工具用于向操作系统或其他应用程序安装修复。\n\n### 总线 (BUS)\n\n`bus` 组电子导体，用于连接计算机的各个组件，在这些组件之间传输信号、地址和数据。总线结构组织如下：\n\
  \n*   **数据总线（Data bus）：** 在 `CPU`、内存和外设备之间传输数据。\n*   **地址总线（Address bus）：** 在 `CPU`\
  \ 和内存之间传输数据和指令的地址。\n*   **控制总线（Control bus）：** 在 `CPU` 和设备之间传输控制信息（设备状态）。\n\n###\
  \ 主内存 (Main memory)\n\n`main memory`（也称为 `main storage`）是计算机存储程序、指令和数据的部分。两种基本的\
  \ `physical`（或物理——相对于虚拟——稍后详述）内存类型是：\n\n*   **随机存存储器（RAM）：** `Volatile`内存（易失性，断电数据丢失）是可以直接寻址且存储数据可以修改的内存。`RAM`\
  \ 通常在计算机架构中实现为缓存内存和主内存。`RAM` 的两种主要类型是：\n    *   **动态随机内存（DRAM）：** 由于电容衰减，每两毫秒必须刷新\
  \ `refreshed`（重写内容）。刷新通过使用多个称为多相时钟信号来实现。\n    *   **静态随机内存（SRAM）：** 比 `DRAM` 快，使用电路锁存表示数据，因此不需要刷新。因为\
  \ `SRAM` 不需要刷新，所以使用单相时钟信号。\n*   **只读存储器（ROM）：** `Nonvolatile`内存（非易失性，即使断电数据也会保留）是可以直接寻址但存储数据不易被轻易修改的内存。`ROM`\
  \ 通常在计算机架构中实现为固件（我们将在下一节中讨论）。`ROM` 的变体包括：\n    *   **可编程只读存储器（PROM）：** 这种 `ROM`\
  \ 无法重写。\n    *   **可擦除可编程只读存储器（EPROM）：** 这种 `ROM` 通过向芯片顶部的小窗口投射紫外线来擦除。（不，我们不是在开玩笑。）\n\
  \    *   **电可擦除可编程只读存储器（EEPROM）：** 这种 `ROM` 是最早不需要紫外线即可更改的类型之一。也称为电改只读存储器 (`EAROM`)。\n\
  \    *   **闪存（Flash Memory）：** 这种内存用于 USB 闪盘。\n\n![remember](img/remember.png) 确保不要将“主存储”术语与硬盘提供的存储混淆。\n\
  \n### 内存 (SECONDARY MEMORY)\n\n`secondary memory`（也称为 `secondary storage`）是这两种基本物理内存类型的变体。它在非易失性磁介质上提供动态存储，例如硬盘、固态硬盘或磁带驱动（这些被视为\
  \ `sequential memory`，因为无法直接访问数据——你必须从磁带开始搜索）。`virtual memory`（如分页文件、交换空间或交换分区）是辅助内存的一种，它同时利用已安装的物理内存和可用硬盘空间，为\
  \ `CPU` 提供一个比主存储中实际存在的更大的虚拟内存空间。\n\n与内存相关的两个重要安全概念是保护域（protection domain，也称为保护内存）和内存地址。\n\
  \n`protection domain` 防止其他程序或进程访问并修改分配给另一个活动程序或进程的地址空间内容。这种保护可以由操作系统执行，也可以通过硬件实现。保护域的目的是保护分配给进程的内存空间，使其他进程无法读取该空间或更改它。每个进程占用的内存空间可以被认为是私有的。\n\
  \n`memory space` 描述计算机系统中可用的物理内存（例如 2 GB），而 `address space` 指定内所在计算机系统中的位置（一个内存地址）。`memory\
  \ addressing` 描述了 `CPU` 访问内存内容的方法。`physical` 内存地址是分配给物理安装内存的硬编码地址。它只能通过将物理地址映射到虚拟地址的操作系统访问。`virtual`（或符号）内存地址是应用程序和程序员用于指定内存中期望位置的地址。常见的虚拟内存寻址模式包括：\n\
  \n*   **基址寻址（base addressing）：** 用作计算其他地址起点的地址。\n*   **绝对寻址（absolute addressing）：**\
  \ 无需基地址即可标识位置的地址——或者它本身就是一个基地址。\n*   **索引寻址（indexed addressing）：** 指定相对于索引寄存器的地址。（如果索引寄存器改变，结果内存位置随之改变。）\n\
  *   **接接寻址（indirect addressing）：** 指定的地址包含内存中最终期望位置的地址。\n*   **直接寻址（direct addressing）：**\
  \ 指定最终期望内存位置的地址。\n\n![remember](img/remember.png) 不要混淆虚拟内存和虚拟寻址的概念。`virtual memory`\
  \ 结合了物理内存和硬盘空间，以创建更大的表观内存（或 `memory space`）。`virtual addressing` 是应用程序和程序员用于指定内存中期望位置的方法。\n\
  \n### 固件 (Firmware)\n\n`firmware` 是存储在 `ROM` 内存物理电路中的程序或一组计算机指令。这些类型的程序很少更改或根本不更改。在服务器和用户工作站中，固件通常存储当服务器或工作站上电时执行的初始计算机指令；固件启动\
  \ `CPU` 和其他板载芯片，并通过使用键盘、显示器、网络适配器和硬盘建立通信。固件从硬盘中检索数据块，然后这些数据块用于加载和启动操作系统。\n\n计算机的\
  \ `BIOS` 是固件的一个常见示例。`BIOS`，即基本输入输出系统，包含了计算机首次上电时启动计算机所需的指令、初始化设备以及从辅助存储（如硬盘）加载操作系统的指令。\n\
  \n\n\n\n\n固件也存在于智能手机、平板电脑、DSL/电缆调制解调器以及几乎所有类型的联网设备中，例如汽车、恒温器，甚至是你的冰箱。\n\n固件通常存储在计算机`motherboard`（包含`CPU(s)`、内存和其他电路的主电路板）上的一个或多个\
  \ ROM 芯片上。\n\n### 软件\n\n`Software`包括安装在计算机系统上的操作系统和程序或应用程序。我们在第 10 章中介绍了软件安全。\n\n\
  ### 操作系统\n\n计算机`operating system`（`OS`）是控制计算机运行的软件，使计算机可以使用。操作系统可以被视为逻辑平台，通过该平台运行其他程序来执行工作。\n\
  \n操作系统的主要组件有：\n\n*   `Kernel`：操作系统的核心组件，允许进程、控制硬件设备以及与外部设备和系统进行通信。\n*   `Device\
  \ drivers`：`kernel` 用于与连接到计算机的内部和外部设备通信的软件模块。\n*   `Tools`：执行特定维护功能的独立程序，例如文件系统修复或网络测试。工具可以自动运行或手动运行。\n\
  \n操作系统控制计算机资源。操作系统的主要功能有：\n\n*   `Process management`：建立一个多个独立进程（程序）可以运行的环境。\n*\
  \   `Resource management`：控制对所有可用资源的访问，使用可能基于优先级或效率的方案。\n*   `I/O device management`：控制与所有连接计算机设备的通信，包括硬盘、打印机、显示器、键盘、鼠标等。\n\
  *   `Memory management`：控制主内存（`RAM`）的分配和访问，将其分配给进程，以及用于磁盘缓存等通用用途。\n*   `File management`：控制硬盘和其他类型设备上存在的文件系统。\n\
  *   `Communications management`：控制与可用介质的通信。\n\n### 虚拟化\n\n`virtual machine`是物理计算机的软件仿真。它作为宿主操作系统内部的隔离环境运行。\n\
  \n`hypervisor`是创建和运行这些虚拟机的软件。\n\n虚拟化的优势之一是，它允许让多个操作系统在单个物理宿主机上运行。\n\n### 容器\n\n\
  `container`是一个轻量级的独立包，包含了运行应用程序所需的所有内容：代码、运行时、系统工具、库和设置。\n\n### 可信计算基础 (TCB)\n\n\
  `Trusted Computing Base`（`TCB`）指的是对计算机系统安全至关重要的硬件、软件和固件组件。如果`TCB`被破坏，整个系统的安全性将面临风险。\n\
  \n`security perimeter`是将`TCB`与其他系统部分隔离开的边界。\n\n### 可信平台模块 (TPM)\n\nTrusted Platform\
  \ Module（`TPM`）是一个专用的微处理器，提供基于硬件的安全功能。TPM 规范由可信计算组织（`TCG`）编写，是一个国际标准（ISO/IEC 11889）。\n\
  \n`TPM`生成并存储加密密钥，执行以下功能：\n\n*   `Attestation`：使用已知良好硬件的加密哈希对系统状态进行第三方验证。\n*   `Binding`：将唯一的加密密钥绑定到特定硬件。\n\
  *   `Sealing`：使用唯一的加密密钥加密数据，并确保只有硬件处于已知状态时才能解密密文。\n\n常见的`TPM`用途包括确保平台完整性、全盘加密、密码和加密密钥保护以及数字版权管理。\n\
  \n### 安全运行模式\n\n安全模式用于强制访问控制（`MAC`）系统以执行不同级别的安全。与安全模式相关的技术和概念包括：\n\n*   `Abstraction`：从应用程序的高级函数查看程序的过程，这使得所有低级函数变为抽象。低级函数被视为黑箱。\n\
  *   `Data hiding`：面向对象的术语，指的是将对象封装在另一个对象内部，以隐藏第一个对象的功能细节。\n*   `System high mode`：以信息分类最高级别运行的系统。任何访问此类系统的用户必须具有等同或高于信息分类级别的许可。\n\
  *   `Security kernel`：由硬件、软件和固件组件组成，调解主体和对象之间的访问和功能。`security kernel`是保护环模型的一部分，操作系统内核占据最内环，距离最内环越远的环代表访问权限越少。\n\
  *   `Reference monitor`：由`security kernel`实现的组件，对系统上的数据和设备强制执行访问控制。换句话说，当用户尝试访问文件时，`reference\
  \ monitor`最终执行“此人是否允许访问此文件？”的功能。\n\n\n\n\n\n`open system`（开放系统）是一种符合已发布并被接受的标准的厂商无关系统。这种对开放标准的遵循促进了由不同厂商制造的系统和组件之间的互操作性。此外，开放系统可以进行独立的审查和评估，这有助于识别漏洞和威胁，并快速开发解决方案和更新。开放系统的示例包括\
  \ `Linux` 操作系统、`Open Office` 桌面生产力系统以及 `Apache` Web 服务器。\n\n`closed system`（闭式系统）使用专有硬件和/或软件，这些设备可能与其他系统或组件不兼容。闭式系统的软件源代码通常不对客户或研究人员开放。闭式系统的示例包括\
  \ `Microsoft Windows` 操作系统、`Oracle` 数据库管理系统以及 `Apple iTunes`。\n\n![technicalstuff](img/technicalstuff.png)\
  \ `开放系统`和`闭式系统`术语也指的是系统的访问模型。闭式系统默认不允许访问，而开放系统则允许。\n\n### 保护环（Protection rings）\n\
  \n保护环的概念实现了多个同心区域，越靠近中心，其信任级别越高。权限最高的环标识为 `Ring 0`（0 环），通常包含操作系统的安全内核。根据最小权限原则并提供隔离性，额外的系统组件被放置在相应的同心环中，这样某个保护环中的组件被破坏就不会自动导致对更高权限环中组件的访问权限。`MIT\
  \ MULTICS` 操作系统和 `Novell Netware` 均在其体系架构中实现了保护环的概念。\n\n### 安全模式（Security modes）\n\
  \n系统的 `security mode of operation`（安全运行模式）描述了系统如何处理不同分类级别的存储信息。根据系统上处理的信息分类级别和授权用户的许可级别，已经定义了多种安全运行模式。这些术语通常用于美国军方和政府系统，包括：\n\
  \n- **专用（Dedicated）：** 所有授权用户必须具有等于或高于系统上处理的最高信息机密级别，并且具有有效的“知情需要”（need-to-know）。\n\
  - **系统高级（System High）：** 所有授权用户必须具有等于或高于系统上处理的最高信息机密级别，但不一定需要有效的“知情需要”。\n- **多级安全（Multilevel）：**\
  \ 不同分类级别的信息存储或处理在`信任计算机系统`（一种采用了所有必要的硬件和软件保证措施，并满足特定可靠性和安全性要求的系统）上。授权用户必须具有适当的许可级别，并受到访问限制。\n\
  \n`开放系统`和`闭式系统`术语也指的是系统的访问模型。闭式系统默认不允许访问，而开放系统则允许。\n\n### 保护环（Protection rings）\n\
