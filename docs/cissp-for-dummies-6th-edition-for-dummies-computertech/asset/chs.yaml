  \ |\n| OC-192 | 9.9 Gbps | `SONET` |\n| OC-768 | 39 Gbps | `SONET` |\n\nTABLE 6-10\
  \ 常见电信电路 |\n\n\n\n\n\nWAN 协议和技术在电信电路上实现。请参考表 6-10 获取常用电信电路和速度的说明。\n\n### 数据链路层的网络设备\n\
  \n在数据链路层运行的网络设备包括桥器、交换机、DTE/DCE 以及无线设备：\n\n*   `bridge`（桥）是一种半智能继电器器，用于连接两个或多个（相同或不同的）网段。桥维持着一个地址解析协议（`ARP`）缓存，其中包含所连接网段上各个设备的\
  \ MAC 地址。当桥接收到一个数据信号时，它会检查 ARP 缓存以确定目标 MAC 地址是否在本地网段上。如果数据信号是本地的，则不会转发到不同的网络；然而，如果\
  \ MAC 地址不是本地的，桥会将数据信号转发（并放大）到所有其他连接的网络段。与桥接相关的一个严重网络问题是`广播风暴`，即广播流量被桥接自动转发，有效地淹没整个网络。网络桥器已被交换机（下文将讨论）取代。\n\
  \n*   `Data Terminal Equipment`（`DTE`，数据终端设备）是一个通用术语，用于分类用户网络接口端（如计算机工作站）的设备。DTE\
  \ 连接到 `Data Carrier Equipment`（`DCE`；数据传输设备，也称为数据电路终端设备），它由用户网络接口端的设备组成。DCE 提供到网络的物理连接，转发网络流量，并提供时钟信号以同步\
  \ DCE 与 DTE 之间的传输。DCE 的示例包括 `NICs`（网卡）、调制解调器和 `CSUs/DSUs`（通道业务单元/数据单元）。\n\n*   `Wireless\
  \ Access Points`（`APs`，无线接入点）是将无线客户端连接到有线网络的收发器。接入点是无线网络的基站。它们本质上是以半双工模式运行的集线器（或路由器）——它们在给定时间内只能接收或传输；不能同时进行两者（除非它们有多个天线）。无线接入点使用天线传输和接收数据。四种基本的无线天线类型包括：\n\
  \n    *   `Omni-directional`（全向）：最常见的无线天线类型，`omni-directional antennas` 本质上是短极，在水平轴周围的所有方向以相同的强度传输和接收无线信号。全向天线通常是偶极设计。\n\
  \n    *   `Parabolic`（抛物面）：也称为饼形天线，`parabolic antennas` 是由网状金属栅或固体金属制成的定向饼形天线。抛物面天线用于远距离扩展无线范围。\n\
  \n    *   `Sectorized`（扇区）：形状与全向天线相似，`sectorized antennas` 具有反射器，可以将传输信号引导至特定方向（通常为\
  \ 60 到 120 度的模式），以提供额外的范围并减少特定方向的干扰。\n\n    *   `Yagi`（八木鱼）：外观类似于小型电视天线，`yagi antennas`\
  \ 用于点对点或点对多点无线应用中的远距离。\n\nWi-Fi 网络中的客户端设备包括台式电脑和笔记本电脑，以及移动设备和其他终端（如智能手机、医疗设备、条形码扫描器以及许多所谓的“智能”设备，如温控器和其他家庭自动化设备）。无线网络接口卡（`WNICs`）或无线卡有多种外形，如\
  \ `PCI adapters`、`PC cards` 和 `USB adapters`，或者它们内置在支持无线功能的设备中，如笔记本电脑、平板和平智能手机。\n\
  \n接入点和连接到它们的无线卡必须使用相同的 WLAN `802.11` 标准或向后兼容。请参见本章前面的“WLAN 技术和协议”部分获取 802.11 规范列表。\n\
  \n接入点（`APs`）可以在四种模式之一运行：\n\n    *   `Root mode`（根模式）：大多数 AP 的默认配置。AP 直接连接到有线网络，无线客户端通过无线接入点访问有线网络。也称为\
  \ `infrastructure`（基础设施模式）。\n\n    *   `Repeater mode`（中继模式）：AP 不直接连接到有线网络，而是为另一个\
  \ AP 提供上行链路，有效地扩展 WLAN 的范围。也称为 `stand-alone`（独立模式）。\n\n    *   `Bridge mode`（桥模式）：大多数\
  \ AP 不支持的特殊配置。桥模式用于通过无线接入点连接两个独立的有线网段。\n\n    *   `Mesh mode`（网状模式）：多个 AP 协同工作，为较大的家庭和工作空间创建一个单一\
  \ Wi-Fi 网络的外观。\n\n![tip](img/tip.png) `Ad hoc`（自形成）是一种没有任何 AP 的 WLAN 架构。无线设备在点对点网络中相互通信，例如两台笔记本电脑之间。\n\
  \n### 物理层（第 1 层）\n\n物理层跨越网络介质（布线或无线链路）从一个设备向另一个设备发送和接收比特。\n\n它规定了网络的电气、机械和功能要求，包括网络拓扑、布线和连接器以及接口类型，以及将比特转换为可在物理介质上传输的电（或光）信号的过程。由铜线或光纤电缆、集线器和其他物理材料组成的各种网络拓扑共同物理层。\n\
  \n### 网络拓扑\n\n物理层定义了四种基本的网络拓扑。尽管基本类型有许多变体——例如光纤分布式数据接口（`FDDI`）、星型总线（或树型）和星型环网——但我们在这里坚持基础：\n\
  \n*   `Star`（星型）：网络上的每个单独节点都直接连接到交换机、集线器或集中器。所有数据通信必须通过交换机（或集线器），这可能成为瓶颈或单点故障。星型拓扑适用于几乎任何规模的环境，是目前最常用的基础拓扑。星型拓扑也容易安装和维护，网络故障很容易隔离而不会影响网络的其他部分。\n\
  \n*   `Mesh`（网型）：所有系统相互互连，为所有其他资源提供多路径。在大多数网络中，仅对最关键的网络组件（如路由器、交换机和服务器）实施部分网状（通过使用多个网络接口卡\
  \ [`NICs]` 或服务器集群），以消除单点故障。\n\n*   `Ring`（环型）：一个将终端设备连接成连续环的封闭环。功能上，这是通过将各个设备连接到多站访问单元（`MSAU`\
  \ 或 `MAU`）实现的。在物理上，这种设置使环型拓扑看起来像星型拓扑。环型拓扑常见于令牌环网络和 FDDI 网络。在环型拓扑中，所有通信沿环绕单方向方向传输。\n\
  \n*   `Bus`（总线型）：在 `bus`（或线性总线）拓扑中，所有设备都连接到两端都有终端的单根电缆（主干）。总线网络通常用于非常小的网络，因为它们便宜且易于安装。然而，在大环境中，它们是不实用的，因为介质具有物理限制（即布线长度），主干是单点故障（网络任何位置的断裂都会影响整个网络），而且在大网络中追踪故障可能极其困难。总线型网络现在非常罕见，不再是最便宜或最易于安装的网络选项。\n\
  \n#### 电缆和连接器类型\n\n\n\n\n\n电缆传输在网络设备之间代表数据的电信号或光信号。数据信号通过几种特征来描述，包括类型（参见本章中的侧边栏“模拟与数字信号”）、控制机制（参见本章中的侧边栏“异步与同步通信”）以及分类（基带或宽带）。`Baseband`信号使用单个通道传输数字信号，常见于使用双绞电缆的局域网（LAN）。`Broadband`信号则在多个频率范围内的多个通道传输模拟信号，包括语音、视频和数据。网络中使用的四种基本电缆包括：\n\
  \n*   **同轴电缆。** 同轴（缩写为 `coax`，读音为 `KOH-axe`）由单个实心铜线芯组成，周围包裹着塑料或`Teflon`（聚特氟）绝缘层、编织金属屏蔽层和（有时有的）金属箔层，最后覆盖层塑料护套。这种结构使得电缆非常耐用，并能抵抗电磁干扰（`EMI`）和射频干扰（`RFI`）信号。同轴电缆常用于连接缆电视或卫星电视机（从黑盒到墙壁的电缆）。注意，用于电视信号的同轴电缆与计算机网络同轴电缆不兼容，因为它们的电容不同。同轴电缆有两种规格，粗和细：\n\
  \n    *   **粗：** 也称为 `RG8`、`RG11` 或 `thicknet`（粗同轴）。Thicknet 电缆使用螺纹连接器，称为 `Attachment\
  \ Unit Interface (AUI)`。\n    *   **细：** 也称为 `RG58` 或 `thinnet`（细同轴）。Thinnet 电缆通常使用卡口型连接器连接网络设备，该连接器称为\
  \ `BNC (Bayonet Neill-Concelman) connector`。\n\n*   **双轴电缆。** 双轴（也称为 `twinax`）电缆与同轴电缆非常相似，但它由*两个*实心铜线芯组成，而不是单个线芯。Twinax\
  \ 用于极短距离（例如 10 米）内以较低的成本实现高数据传输速度（例如 10 Gb 以太网 [缩写为 `GE`、`GbE` 或 `GigE`]）。twinax\
  \ 布线的典型应用包括 `SANs`（存储区域网络）和连接关键服务器到高速核心的顶部网络交换机。twinax 布线的其他优势包括较低的收发器延迟（发送/接收设备的延迟）和功耗（与\
  \ 10 GbE 双绞电缆相比），以及低比特错误率（`BERs`）。\n\n    ![technicalstuff](img/technicalstuff.png)\
  \ `Bit error ratio`（`BER`）是在规定时间内接收错误比特数与总接收比特数的比值。\n\n*   **双绞电缆。** 双绞电缆是目前最流行的局域网电缆。它轻便、灵活、廉价且易于安装。双绞电缆的一个易于识别的例子是电话线。\n\
  \n    双绞电缆由四对绞在一起的铜线组成，通过减少串扰和衰减来提高电缆的传输质量。双绞越紧密，传输速度和质量就越好。\n\n    ![technicalstuff](img/technicalstuff.png)\
  \ `Crosstalk`（串扰）是指通过一个通道或电路传输的信号对另一个通道或电路上传输的信号产生负面影响。串扰的一个（古老）例子发生在模拟电话线上，当时你可以通过电话听到其他对话的部分。`Attenuation`（衰减）是波（例如电或光）在介质中传输（或穿过）时强度逐渐损失的现象。\n\
  \n    目前存在十类双绞布线，但今天只有 `Cat 5/5e`、`Cat 6/6a` 和 `Cat 7/7a` 电缆通常用于网络（参见表 6-11）。\n\n\
  \    双绞电缆可以是非屏蔽（`UTP`）或屏蔽（`STP`）的。`UTP` 更为常见，因为它比 `STP` 更容易处理且价格便宜。当噪声成为问题或安全性是主要考虑因素时使用\
  \ `STP`，它在 `IBM` 网中流行。噪声由外部源产生，可能会干扰或损害信号质量。噪声的示例包括来自电机、无线电信号、荧光灯、微波炉和电子设备的 `RFI`\
  \ 和 `EMI`。屏蔽布线还可以减少可能被攻击者截获的电磁发射。\n\n    ![remember](img/remember.png) `TEMPEST`\
  \ 是一个（曾保密的）美国军事术语，指的是对计算机及相关设备电磁发射的研究。\n\n    双绞电缆使用 `RJ-type` 终端终止。三种常见的 RJ 类型连接器是\
  \ `RJ-11`、`RJ-45` 和 `RJ-49`。虽然这些连接器的外观相似（特别是 `RJ-45` 和 `RJ-49`），但只有 `RJ-45` 连接器用于局域网（LANs）。`RJ-11`\
  \ 连接器用于模拟线路，`RJ-49` 常用于综合业务数字网络（`ISDN`）线路和 `WAN` 接口。\n\n*   **光纤。** 光纤通常用于骨干网络和高可用性网络（如\
  \ `FDDI`）。光纤以光信号而非电信号传输数据。光纤由玻璃或塑料芯或线束、一个玻璃绝缘层（通常称为 `cladding` 包纤层）、Kevlar 纤维（用于加强）以及聚氯乙烯（`PVC`）或\
  \ `Teflon` 外护组成。光纤的优点包括高速度、远距离和抗截获性。光纤使用 `SC-type`（方形）、`ST-type`（直插型）或 `LC-type`（本地型）连接器终止（各种类型的比较参见表\
  \ 6-12）。\n\n| **类别** | **用途与速度** | **示例** |\n| --- | --- | --- |\n| 5 类（非 TIA/EIA\
  \ 标准） | 数据（最高 100 Mbps） | 快速以太网 |\n| 5e | 数据（在 100 MHz 下最高 1000 Mbps） | 千兆以太网 |\n\
  | 6 | 数据（在 250 MHz 下最高 1000 Mbps） | 千兆以太网 |\n| 6a | 数据（在 500 MHz 下最高 10 Gbps） |\
  \ 万兆以太网 |\n| 7 | 数据（在 600 MHz 下，距离 100 米内最高 10 Gbps） | 万兆以太网 |\n| 7a | 数据（在 1000\
  \ MHz 下，距离 15 米内最高 10 Gbps） | 40 千兆以太网 |\n\n表 6-11 常用双绞电缆\n\n| **电缆类型** | **以太网命名**\
  \ | **最大长度** | **EMI/RFI 抗性** |\n| --- | --- | --- | --- |\n| RG58 (细同轴) | 10Base-2\
  \ | 185 m | 良好 |\n| RG8/11 (粗同轴) | 10Base-5 | 500 m | 优 |\n| UTP | 10Base-T 100Base-TX\
  \ 1000Base-T 10GbE | 100 m | 差 |\n| STP | 10Base-T 100Base-TX 1000Base-T 10GbE |\
  \ 100 m | 中等到良好 |\n| 光纤 | 100Base-F | 2,000 m | 最高（EFI 和 RFI 对光纤没有影响） |\n\n表 6-12\
  \ 电缆类型与特性\n\n![technicalstuff](img/technicalstuff.png) 以太网命名（如 `10Base-T` 或 `100Base-TX`）指的是电缆容量和信号类型（基带）。命名的最后部分定义不那么严格。它可能指的是近似的最大长度（如\
  \ `10Base-2` 和 `10Base-5`）、连接器类型（如 `10Base-T`、`100Base-TX` 和 `100Base-F`），或连接器的类型和速度（如\
  \ `1000Base-T/GbE`）。\n\n###### 接口类型\n\n数据终端设备（`DTE`）与数据通信设备（`DCE`）之间的接口（我们在下一节中讨论）在物理层规定。\n\
  \n常见的接口标准包括\n\n*   **EIA/TIA-232-F:** 该标准支持信号速率高达 115,200 比/秒的电路（以前称为 `RS-232`）。\n\
  \n\n\n\n\n*   **V.24. ITU-T:** 该标准本质上与 `EIA/TIA-232` 标准相同。\n*   **V.35. ITU-T:**\
  \ 该标准描述了网络接入设备与分组网络之间的同步通信协议，支持高达 48 Kbps 的速率。\n*   **X.21bis. ITU-T:** 前称为 CCITT。该标准定义了\
  \ `X.25` 网络中 `DCE` 与 `DTE` 之间的通信协议。它本质上与 `EIA/TIA-232` 标准相同。\n*   **高速串口接口 (HSSI):**\
  \ 开发这一网络标准是为了满足广域网（WAN）链路上对高速（高达 52 Mbps）串行连接的需求。\n\n## 网络设备\n\n在物理层运行的网络设备包括网络接口卡（`NICs`）、网络介质（包括线缆、连接器和接口，这些我们在本章前面的“[电缆和连接器类型””节中讨论过）、中继器和集线器。\n\
  \n`网络接口卡`（`NICs`）用于将计算机连接到网络。`NICs` 可以集成在计算机主板上，也可以作为适配卡安装，例如 `ISA`、`PCI` 或 `PC\
  \ 卡`。与 `NIC` 类似，`WIC`（WAN 接口卡）包含内置的 `CSU/DSU`，用于将路由器连接到数字电路。`WICs` 的变体包括 `HWICs`（高速\
  \ WAN 接口卡）和 `VWICs`（语音 WAN 接口卡）。\n\n`中继器` 是一种非智能设备，仅通过放大信号来补偿`衰减`（信号丢失），以便扩展电缆段的长度。\n\
  \n`集线器`（或集中器）用于连接多个局域网（LAN）设备，例如服务器和工作站。集线器的两种基本类型是：\n\n*   **被动式:** 数据进入一个端口并从所有其他端口输出，没有任何没有任何信号放大或再生。\n\
  *   **主动式:** 结合了被动式集线器和中继器的特征。称为`多端口中继器`。\n\n`交换机`用于连接多个局域网设备。与集线器不同，`交换机`不会将发出的包发送到网络上的所有设备，而是仅将包发送到实际目标设备。\n\
  \n### TCP/IP 模型\n\n传输控制协议/网协议（`TCP/IP`）模型与 OSI 参考模型相似。它最初由美国国防部开发，实际上早于 OSI 模型。然而，在今天，`TCP/IP`\
  \ 模型不像 OSI 模型那样在学习和故障排除工具方面被如此广泛使用。`TCP/IP` 模型与 OSI 模型之间最显著的区别是 `TCP/IP` 模型仅包含四层，而不是七层（见图\
  \ 6-4）。\n\n*   **应用层:** 由网络应用程序和进程组成，松散对应于 OSI 模型的上层（应用层、表示层和会话层）。\n*   **传输层:**\
  \ 提供端到端交付，对应于 OSI 传输层。\n*   **网络层:** 定义 `IP` 数据报文和路由，对应于 OSI 网络层。\n*   **网络访问层（或链路层）:**\
  \ 包含访问物理网络的例程，对应于 OSI 数据链路层和物理层。\n\n![image](img/9781119505815-fg0604.png)\n\n图\
  \ 6-4： OSI 模型与 `TCP/IP` 模型的对比。\n\n### 用于维护通信安全的加密技术\n\n设备之间的通信通常通过具有不同窃听和对手干扰风险的网络进行。虽然通信会话涉及的端点可能受到保护，但通信本身可能并不会。因此，通常采用加密技术来使通信对于任何可能截获它们的（或任何事物）变得不可读。就像古代在战场中运送加密消息的信使一样，在现代计算机和互联网的背景下，加密消息无法被他人读取。\n\
  \n由于数据通信中有许多不同的背景和类型的加密，本章将贯穿全文讨论加密。第 5 章包含一个关于加密的扩展章节。\n\n## 安全网络组件\n\n网络设备（如路由器、交换机、无线接入点和其他网络组件）必须安全地操作和维护。CISSP\
  \ 候选人必须理解通用安全原则以及与不同类型网络设备相关的独特安全考虑。\n\n![tip](img/tip.png) CISSP 考试并不测试你对特定安全产品的知识，例如如何配置\
  \ Cisco 路由器或 Checkpoint 防火墙。相反，你需要理解泛泛不同类型网络设备的安全基础和概念。\n\n### 硬件操作\n\n网络设备（如路由器和交换机，在本章前面讨论）以及防火墙、入侵检测系统、无线接入点和其他组件（在后续章节讨论）必须安全地部署、操作和维护。硬件适当操作的方面包括：\n\
  \n*   **培训:** 部署和管理硬件设备的人员应接受有关这些设备管理的适当培训。\n*   **程序:** 在硬件设备上采取的常规操作应正式记录，以便人员一致地执行。\n\
  *   **标准:** 组织应为硬件设备的安全和一致配置建立标准。这将确保多个设备以相似（即使不是相同）的方式进行配置，并且这种配置不会损害组织环境的安全。\n\
  *   **监控:** 组织应监控其硬件设备，以便相关人员获知安全事件、故障和其他事件。\n*   **受控变更:** 硬件设备上的配置更改、软件更新和安全补丁应通过组织的变更管理流程进行。\n\
  \n### 传输介质\n\n网络传输介质包括有线（例如铜和光纤）和无线。有线传输介质定义在 OSI 模型的物理层（在本章之前讨论）。无线传输介质定义在 OSI\
  \ 模型的链路层（在本章之前讨论）。此外，CISSP 候选人必须理解 Wi-Fi 安全技术和协议。\n\n#### 保护有线网络\n\n除了使用加密使任何截获的通信对未经授权的人不可读，保护通信介质免窃听和破坏也很重要。保护有线网络介质的可用包括：\n\
  \n*   **管道:** 通过管道运行通信电缆是使布线更难以访问的好方法。\n*   **物理访问控制:** 在通信电缆穿过房间和走道的地方，尽可能使用物理访问控制，只允许授权人员靠近任何电缆。控制措施包括门卡访问系统、锁定机柜和视频监控。\n\
  \n#### 保护 Wi-Fi 网络\n\n无线网络安全与所有安全一样，通过使用深度防御的方法实现。安全技术和协议包括 SSID 广播、认证以及使用 WEP、WPA\
  \ 和 WPA2 进行加密。\n\n#### 服务集标识符 (SSID)\n\n`SSID` 是一个唯一标识无线网络的名称（最多 32 个字符）。无线客户端必须知道\
  \ `SSID` 才能连接到 `WLAN`。然而，大多数 `APs` 广播其 `SSID`（或 `SSID` 可以被轻松嗅），因此 `SSID` 提供的安全性无关紧要。\n\
  \n#### 有线等效隐私 (WEP)\n\n\n\n\n\n如其名称所示，`WEP` 最初被设计为一种安全协议，旨在提供与有线网络同级别的机密性。然而，`WEP`\
  \ 很快被发现存在重大缺陷。\n\n`WEP` 使用 `RC4` 流加密算法来实现机密性，并使用 `CRC-32` 校验和来保证完整性。`WEP` 使用 40\
  \ 位或 104 位密钥配合 24 位初始化向量（`IV`）来形成 64 位或 128 位密钥。由于使用的初始化向量较短（以及其他缺陷），`WEP` 密钥可以被随处可见的软件在几分钟内轻松破解。\n\
  \n`WEP` 支持两种身份身份验证方法：\n\n- 开放系统认证（Open System authentication）：不需要无线客户端在认证期间提供凭据。客户端与接入点关联后，`WEP`\
  \ 会对无线网络上传输的数据进行加密。\n- 共享密钥认证（Shared Key authentication）：使用四次握手验证并关联无线客户端与接入点，然后对数据进行加密。\n\
  \n尽管存在许多安全缺陷，`WEP` 仍作为默认安全协议用于家庭和商业网络。通过使用 `IPsec` 和 `SSH` 等隧道协议可以增强 `WEP` 的安全性，但还有其他安全协议可以增强\
  \ WLAN 安全性，见下节讨论。\n\n## WI-FI 保护访问 (WPA 和 WPA2)\n\n`WPA` 和 `WPA2` 相比 `WEP` 提供了显著的安全增强，它们是在\
  \ `802.11i` 无线安全标准开发期间，作为解决 `WEP` 缺陷的快速解决方案而引入的。\n\n`WPA` 使用临时密钥完整性协议（`TKIP`）解决\
  \ `WEP` 中的某些加密问题。`TKIP` 通过密钥混合函数将根密钥与初始化向量相结合。`WPA` 还实现了一个序列计数器以防止重放攻击，并使用了 64 位消息完整性检查。尽管有了这些改进，由于某些已知攻击，使用\
  \ `TKIP` 的 `WPA` 现在被认为是不够的。\n\n`WPA` 和 `WPA2` 还支持各种 `EAP` 扩展（参见本章后部分的 `远程访问`），以进一步增强\
  \ WLAN 安全性。这些扩展包括 `EAP-TLS`（传输层安全）、`EAP-TTLS`（隧道传输层安全）以及保护 `EAP`（`PEAPv0` 和 `v1`）。\n\
  \n`WPA2` 引入了进一步的安全增强。`WPA2` 使用基于 `AES` 算法的分组链消息认证码协议计数模式（`CCMP`），它取代了 `TKIP` 和 `WEP`，产生了一种远安全的\
  \ WLAN 协议。\n\n![tip](img/tip.png) 有关无线网络安全主题更多信息，请阅读我们的朋友 Kevin Beaver 和 Peter T.\
  \ Davis 编写的《傻瓜学破解无线网络》。\n\n## 网络访问控制设备\n\n网络访问控制（`NAC`）设备包括防火墙（以及代理服务器）、入侵检测系统（`IDSs`）和入侵预防系统（`IPSs`）。\n\
  \n### 防火墙\n\n`firewall` 控制受信网络（如家庭网络或企业 `LAN`）与不可信或公共网络（如互联网）之间的流量流。`firewall` 可以由硬件、软件或硬件与软件的结合组成。\n\
  \n### 防火墙类型\n\n防火墙有三种基本分类：包过滤、电路级网关和应用层网关。\n\n![remember](img/remember.png) 三种基本的防火墙类型是：包过滤、电路级网关和应用层网关。\n\
  \n#### 包过滤\n\n包过滤防火墙（或 `screening router`）是最基础（且廉价）的防火墙类型之一，非常适合低风险环境。`packet-filtering\
  \ firewall` 仅根据单个数据包的 `TCP`、`UDP`、`ICMP` 和 `IP` 头部允许或拒绝流量。它检查流量方向（入站或出站）、源 IP 地址以及源目的\
  \ `TCP` 或 `UDP` 端口号。这些信息与访问控制列表（`ACL`）中配置的预定义规则进行比较，以决定是否允许或拒绝每个数据包。`packet-filtering\
  \ firewall` 通常运行在 OSI 模型的网络层或传输层。`packet-filtering firewall` 的一些优点是：\n\n- 廉价。（它可以作为路由器\
  \ `ACL` 实现，这是免费的——是 `ACL`，而不是路由器！）\n- 速度快且灵活。\n- 对用户透明。\n\n包过滤防火墙的缺点是：\n\n- 访问决策仅基于地址和端口信息，而不是基于数据包内容、语境或应用程序等更复杂的信息。\n\
  - 无法防止 `IP` 或 `DNS` 地址欺骗（伪造地址）。\n- 不支持强用户身份验证。\n- 配置和维护 `ACLs` 可能很困难。\n- 日志信息可能有限。\n\
  \n包过滤防火墙更高级的变体是 `dynamic packet-filtering firewall`。这种类型的防火墙通过使用基于上下文的访问控制（`CBAC`）或反射性\
  \ `ACLs` 支持动态修改防火墙规则库——两者都在会话建立时为单个会话创建动态访问列表规则。例如，可能会自动创建一个 `ACL`，允许在公司网络（防火墙内部）工作的用户连接到防火墙外部的\
  \ `FTP` 服务器，以便在其 `PC` 和 `FTP` 服务器之间上传和下载文件。当文件传输完成后，该 `ACL` 会从防火墙中自动删除。\n\n####\
  \ 电路级网关\n\n电路级网关通过维护已建立连接的状态信息来控制访问。当两个主机之间建立允许的连接时，会为该会话创建一个 `tunnel`（或虚拟电路），允许数据包在主机之间自由流动，而无需进一步检查。这种防火墙运行在\
  \ OSI 模型的会话层（第 5 层）。\n\n这种防火墙的优点包括：\n\n- 速度（连接建立后，不再分析单个数据包。）\n- 支持许多协议\n- 易维护\n\
  \n这种防火墙的缺点包括：\n\n- 依赖于通信用户或主机的可靠性。（连接建立后，不再分析单个数据包。）\n-初始连接建立后，关于单个数据包的日志信息有限。\n\
  \n`stateful inspection firewall` 是电路级网关的一种，它在网络层捕获数据包，然后在 OSI 模型的上层对这些数据包进行队列和 `分析`（检查状态和语境）。\n\
  \n#### 应用层网关\n\n应用层网关（或应用层网关）运行在 OSI 模型的应用层，处理特定 IP 应用程序的数据包。这种类型的防火墙通常被认为是最安全的，并且通常实现为\
  \ `proxy server`。在 `proxy server` 中，不允许两个主机之间直接通信。相反，数据包会被代理服务器拦截，由其分析数据包内容，如果符合防火墙规则，则会将原始数据包的副本发送到目标主机。\n\
  \n这种类型防火墙的优点包括：\n\n- 数据包不会直接传输到通信主机，这种策略隐藏了内部网络的设计并防止了对内部主机服务的直接访问。\n- 它可以用于在应用程序中实现强用户身份验证。\n\
  \n这种类型防火墙的缺点是：\n\n- 它降低网络性能，因为数据包必须传递到 OSI 模型的应用层进行分析。\n- 它必须针对特定的应用程序进行定制。（对于新或更改的协议，这种定制可能难以维护或更新。）\n\
  \n\n\n\n\n# Web 应用防火墙\n\n`web application firewall` (WAF) 用于保护 Web 服务器（或一组 Web 服务器）免受各种\
  \ Web 应用攻击，例如脚本注入和缓冲区溢出攻击。`WAF` 检查发送到 Web 服务器的每个数据包的内容，并利用规则判断每个数据包是被认为是常规且友好的，还是敌意的。\n\
  \n## 防火墙架构\n\n我们在前面的节中讨论的基础防火墙类型可以使用后续节中描述的防火墙架构之一来实现。四种基本的防火墙架构类型是过滤路由器、双宿主网关、过滤主机网关和过滤子网。\n\
  \n### 过滤路由器\n\n`screening router`（过滤路由器）是最基本的防火墙架构类型。在不可信网络和信任网络之间放置一个外部路由器，并使用\
  \ `ACLs` 实施安全策略。虽然路由器充当了信任网络和不可信网络之间的瓶颈，但攻击者在访问信任网络上的某主机后，可能可能会破坏整个网络。\n\n过滤路由器架构的优点包括：\n\
  \n* 它是完全透明的。\n* 使用相对简单且价格低廉。\n\n过滤路由器架构的缺点包括：\n\n* 它可能难以处理某些流量。\n* 可用日志有限或没有日志。\n\
  * 它没有采用用户身份验证。\n* 它很难隐藏内部网络结构。\n* 它存在单点故障。\n* 它没有真正实现防火墙瓶颈策略，因为它并不是真正的防火墙或瓶颈——它是在两个网络（“私有”和“公共”网络）之间传递流量的路由器。\n\
  \n尽管如此，使用过滤路由器也比没有好。\n\n### 双宿主网关\n\n另一种常见的防火墙架构是双宿主网关。`dual-homed gateway`（或堡垒主机）是一个具有两个网络接口（`NICs`）并位于不可信网络和信任网络之间的系统。`bastion\
  \ host` 通常泛指代理、网关、防火墙或直接向不可信网络提供应用程序或服务的服务器。因为它经常是攻击者的目标，所以堡垒主机有时被称为`牺牲羊`。\n\n然而，这个术语具有误导性，因为堡垒主机通常是采用强大安全机制的加固系统。双宿主网关通常通过外部过滤路由器连接到不可信网络。双宿主网关充当信任网络的代理服务器，并可能配置为需要用户身份验证。双宿主网关比过滤路由器提供更安全的操作，因为默认情况下，数据通常不会跨越两个接口进行转发。双宿主网关架构的优点包括\n\
  \n* 它以`fail-safe mode`（故障模式）运行——如果它故障，它不允许访问，而不是允许所有人访问。\n* 内部网络结构被隐藏。\n\n双宿主网关架构的缺点包括\n\
  \n* 其使用可能因为要求用户对代理服务器进行身份验证或引入网络延迟而给用户带来不便。\n* 某些服务可能无法代理。\n* 其使用可能导致网络性能变慢。\n*\
  \ 它增加了成本（在架构中增加了一个设备）。\n\n### 过滤主机网关\n\n`screened-host gateway` 架构采用外部过滤路由器和内部堡垒主机。过滤路由器的配置使得堡垒主机成为可从不可信网络（如互联网）访问的唯一主机。堡垒主机根据安全策略向不可信网络提供任何所需的\
  \ Web 服务，如 `HTTP` 和 `FTP`。从信任网络到互联网的连接通过堡垒主机上的应用程序代理或直接通过过滤路由器进行路由。\n\n以下是过滤主机网关的一些优点：\n\
  \n* 它在两个设备之间提供了分布式安全，而不是依赖单个设备执行所有安全功能。\n* 它具有透明的出站访问权限。\n* 它具有限制的入站访问。\n\n以下是过滤主机网关的缺点：\n\
  \n* 它被认为安全性较低，因为对于某些信任服务，路由器可以跳过堡垒主机。\n* 隐藏内部网络结构很困难。\n* 它可能有多个单点故障（路由器或堡垒主机）。\n\
  * 它增加了成本（在架构中增加了一个设备）。\n\n### 过滤子网\n\n过滤子网可能是目前设计的防火墙架构中最安全的。`screen-subnet` 采用一个外部过滤路由器、一个双宿主（或多宿主）主机和一个第二个内部过滤路由器。这实现了网络\
  \ DMZ（或`demilitarized zone`）的概念。公共可用服务放置在 DMZ 中的堡垒主机上。\n\n过滤子网架构的优点包括：\n\n* 它对终端用户是透明的。\n\
  * 它是灵活的。\n* 可以隐藏内部网络结构。\n* 它提供了`defense in depth`（深度防御），而不是依赖单个设备为整个网络提供安全。\n\n\
  与其他防火墙架构相比，过滤子网架构的缺点包括：\n\n* 它更昂贵。\n* 它更难配置和维护。\n* 故障排除可能更困难。\n\n## 下一代防火墙和统一威胁管理设备\n\
  \n下一代防火墙（通常称为`next-gen firewalls`或`NGFWs`）和统一威胁管理设备（通常称为`UTMs`）是类似的术语，描述具有多种功能的防火墙，包括以下安全设备的组合：\n\
  \n* `Firewall`（当然有！）\n* `IDS/IPS`（在下一节中讨论）\n* `VPN`（在本章早期讨论）\n* `Web content filtering`（在本章稍后讨论）\n\
  * `Cloud access security broker (CASB)`（在本章稍后讨论）\n* `Web application firewall (WAF)`（在本章早期讨论）\n\
  * `DLP`（在本章稍后讨论）\n\n下一代防火墙和 UTM 的主要优势是简单性更高。不需要管理许多独立的安全系统，所有这些安全功能都在单个设备内完成。\n\n\
  ### 入侵检测和防御系统（IDS、IPS 和 IDPS）\n\n`入侵 detection`定义为对网络活动和数据进行实时监控和分析，以发现潜在漏洞和正在进行的攻击。当前入侵检测系统（`IDS`）技术的一个主要限制是需要过滤虚假报警，防止操作员（系统或安全管理员）被数据淹没。IDS\
  \ 有多种分类方式，包括主动和被动、基于网络和基于主机，以及基于知识和基于行为。\n\n![tip](img/tip.png) 入侵检测系统（IDS）和入侵防御系统（IPS）有时被称为入侵检测和防御系统（IDPS）。\n\
  \n#### 主动和被动 IDS\n\n\n\n\n\n通常被称为`入侵防御系统` (`IPS`) 或`入侵检测与防御系统` (`IDPS`) 的`主动式 IDS`\
  \ 是一种被配置为能够自动阻止正在进行的疑似攻击，而无需操作员进行任何干预的系统。`IPS` 的优势是能够对攻击提供实时纠正措施，但它也有许多缺点。`IPS`\
  \ 必须以旁联方式部署在网络边界；因此，`IPS` 本身很容易受到攻击。此外，如果没有对误报和合法流量进行正确的识别和过滤，授权的用户和应用程序可能会被错误拒绝访问。最后，`IPS`\
  \ 本身可能被用于实施`拒绝服务` (`DoS`) 攻击，这涉及故意向系统发送大量告警，导致其阻塞连接直到没有可用的连接或带宽。\n\n`被动式 IDS` 是一种被配置为监控和分析网络流量活动，并向操作员报警潜在漏洞和攻击的系统。它本身无法执行任何保护或纠正功能。`被动式\
  \ IDS` 的主要优势是这些系统可以快速快速地部署，并且通常本身不受攻击。`被动式 IDS` 通常通过 `tap`（物理或虚拟分路器）或交换端口分析器 (`SPAN`)\
  \ 端口连接到网络段。\n\n![remember](img/remember.png) `IDS` 是一个负责监控、分析和报警的被动系统。`IPS` 是一个负责监控、分析并采取行动（如报警、阻止或丢弃）的主动系统。\n\
  \n## 基于网络和基于主机的 IDS\n\n`基于网络的 IDS` (`NIDS`) 通常由一个网络设备（或传感器）组成，其中包含一个在`杂杂`模式下运行的`网络接口卡`\
  \ (`NIC`)（这意味着它监听或“嗅探”网络上的所有流量，而不仅仅是发往特定主机的流量）以及一个独立的管理接口。`IDS` 放置在网络段或边界处，监控该网段上的所有流量。\n\
  \n`基于主机的 IDS` (`HIDS`) 需要在要监控的单个系统上安装小型程序（或`代理程序`）。`代理程序` 监控操作系统并将数据写入日志文件和/或触发告警。`基于主机的\
  \ IDS` 只能监控安装了`代理程序`的单个主机系统；它不监控整个网络。\n\n## 基于知识和基于行为的 IDS\n\n`基于知识`（或`基于签名`）的 `IDS`\
  \ 引用之前的攻击特征数据库和已知系统漏洞来识别活跃的入侵尝试。目前，`基于知识的 IDS` 比`基于行为的 IDS` 更常见。基于知识系统的优势包括：\n\n\
  *   它们的误报率比`基于行为的 IDS` 低。\n*   告警比`基于行为的 IDS` 告警更标准化、更易理解。\n\n基于知识系统的缺点包括：\n\n*\
  \   `签名数据库`必须不断更新和维护。\n*   新的、独特的或原始的攻击可能无法被检测到或可能被错误分类。\n\n`基于行为`（或`基于统计异常`）的 `IDS`\
  \ 引用正常系统活动的基准或学习模式来识别活跃的入侵尝试。偏离此基准或模式会导致触发告警。基于行为的系统的优势包括它们：\n\n*   能够动态适应新的、独特的或原始的攻击。\n\
  *   相比基于知识的 `IDS`，它们对识别特定操作系统漏洞的依赖性较低。\n\n基于行为系统的缺点包括：\n\n*   误报率高于`基于知识的 IDS`。\n\
  *   无法适应可能经常变化的合法使用模式，因此这些模式不够静态，无法实施有效的`基于行为的 IDS`。\n\n## Web 内容过滤器\n\n`Web 内容过滤器`通常是一个旁联设备，用于监控和控制内部用户对互联网\
  \ Web 网站的访问。`Web 内容过滤器`可以被配置为阻止对特定网站和网站类别的访问（例如，阻止对讨论波尔卡音乐网站的访问）。\n\n使用`Web 内容过滤器`阻止访问某些网站类别的组织通常试图防止员工访问与工作无关的网站。使用`Web\
  \ 内容过滤器`还有助于执行政策并保护组织免受潜在法律责任（例如，阻止对色情和仇恨相关网站的访问有助于执行性骚扰和种族歧视/安全工作环境政策，并可以帮助证明尽职调查）。\n\
  \n`Web 内容过滤器`通常采用大型网站数据库，由内容过滤软件的安全供应商不断进行评估和更新。这些数据库通常包含分类错误，因此需要制定策略和程序让员工请求访问合法网站或为了合法工作目的访问被阻止的网站。这些过程通常会让员工感到沮丧，特别是当安全团队花费几分钟才能响应请求时。许多组织使用的另一种替代策略是“信任但验证”。网站不会被阻止，但用户在导航到潜在的怀疑、危险、冒犯或其他不适当的网站之前会收到警告；个人用户必须明确确认他们理解相关风险，并且他们是为了合法目的访问该网站。网站访问会被记录并报告；通常情况下，如果有必要，适当的安全或人力资源人员会对员工进行跟进。\n\
  \n精通技术的用户经常使用各种代理软件程序尝试绕过 Web 内容过滤器。`代理软件`对企业安全构成重大风险，应通过策略明确禁止。下一代防火墙和某些高级 Web\
  \ 内容过滤器能够检测企业中的代理软件。\n\n## 数据泄露防护\n\n数据泄露防护 (`DLP`) 指一类安全产品，旨在检测并（可选）防止敏感数据通过组织的网络连接泄露。`DLP\
  \ 系统`通过对网络传输的数据进行模式匹配（例如，`XXX-XX-XXXX` 代表社会安全号码，或 `XXXX XXXX XXXX` 代表信用卡号）来工作。根据`DLP\
  \ 系统`的类型及其配置，`DLP 系统`可以生成描述疑似泄露的告警，或者完全阻止传输。\n\n\n\n\n\n*   **数量与多样性。** 网络上终端数量之多、种类之繁为攻击者提供了利用不同操作系统和应用程序漏洞的众多机会。及时为所有终端打好正确的补丁也是一项挑战。\n\
  \n*   **终端用户。** 终端由终端用户操作，他们的计算机技能水平以及对安全和隐私问题的意识各不相同。终端用户容易受到社会工程学的影响，许多终端用户为了方便会自愿绕过终端上的安全措施（例如，手机手机根以安装免费或未经授权的应用）。\n\
  \n*   **权限。** 在某些组织中，终端用户账户拥有“本地管理员”角色。这意味着终端用户执行的任何操作都以系统的最高权限级别运行。这可能使得针对的的恶意攻击变得更有杀伤力。\n\
  \n*   **优先级。** 终端通常被视为网络上“价值较低”的资产。因此，安全工作通常集中在数据中心和高价值资产上，例如服务器和数据库。\n\n在最基础的层，终端安全包括反恶意软件（或防毒软件）。`Signature-based`\
  \ 软件是终端上最常用的防毒软件类型。基于特征的防毒软件会实时和定时扫描终端的硬盘和内存。如果检测到已知的恶意软件特征，软件将执行某些操作，例如：\n\n* \
  \  **隔离：** 隔离终端上被感染的文件，使其无法感染其他文件。\n\n*   **删除：** 移除感染的文件。\n\n*   **告警：** 通知用户（和/或安全管理员）已检测到恶意软件。\n\
  \n基于特征的防毒软件必须保持更新才能生效，而且它只能检测到已知威胁。在软件供应商创建特征并将其上传到终端之前，终端容易受到任何新的“零日”恶意软件威胁。\n\n\
  `Application whitelisting`（应用白名单）是另一种用于终端保护的常用反恶意软件方法。这种方法要求在终端上建立正控制模型——只有经过明确授权的应用程序才能在终端上运行。诸如“自带设备”（BYOD）等趋势允许终端用户使用个人设备处理工作事务，这使得在企业中实施应用白名单方法变得困难。应用白名单的另一个局限性是，已经在白名单中的应用程序（如\
  \ Microsoft Word 或 Adobe Acrobat）可以在终端上运行，即使该应用程序被利用（例如通过恶意的 Word 文档或 Adobe PDF）。\n\
  \n`Behavior-based`（也称为 `heuristics-based` 或 `anomaly-based`）终端保护尝试为终端上的“正常”活动创建一个基准。任何异常活动（根据基准确定）都会被检测到并停止。遗憾的是，基于行为的软件容易产生高误报率，且通常需要大量的计算资源。\n\
  \n`Container-based` 终端保护通过在单个进程周围创建虚拟屏障，隔离终端上运行的任何漏洞进程。如果检测到恶意进程，软件将在恶意进程感染终端上的任何合法进程之前杀掉该进程。基于容器的方法通常需要大量的计算资源，并且对终端上运行的任何应用程序有深入了解。\n\
  \n除了防恶意软件防护外，终端保护还应包括：\n\n*   **访问控制。** 应在所有终端上（包括智能手机和平板电脑）启用并强制执行访问控制（如 PIN 码、密码、短语、滑动轨迹以及指纹和面部识别等生物识别）。\n\
  \n*   **自动锁定。** 终端应配置为在几分钟无活动状态后自动锁定，以便他人无法使用。\n\n*   **加密。** 应该启用驱动器加密，以保护终端设备上的数据。\n\
  \n*   **防火墙。** 每个终端上应安装并配置基于操作系统的或第三方防火墙。\n\n*   **补丁管理。** 应用程序和终端操作系统必须保持补丁更新并处于最新。\n\
  \n*   **主机入侵防御系统 (HIPS)。** 某些组织在终端上部署 HIPS 以提供额外的保护。\n\n*   **网络控制。** 网络控制包括下一代防火墙（可以识别和验证终端及用户）、虚拟专用网络（VPN）、入侵防御系统（IPS）和网络分段。\n\
  \n*   **管理控制。** 应配置终端，使任何固件设置和启动控制都受到密码保护。终端操作系统应配置为用户不是本地管理员。\n\n*   **物理安全。**\
  \ 终端应免受未经授权的访问和盗窃。终端不应无人看；它们应该锁定以防未经授权的人员访问，并物理固定或锁定以防被访问。\n\n### 内容分发网络\n内容分发（或交付）网络（`CDNs`）是大型分布式服务器网络，用于缓存\
  \ Web 内容（如静态网页、可下载对象、按需和流媒体音乐视频以及 Web 应用程序），并通过最佳网络路径向互联网用户提供这些内容。\n\nCDNs 为订阅组织的面向互联网的系统减轻了大量的性能需求，许多\
  \ CDN 提供可选的安全服务，例如分布式拒绝服务（DDoS）攻击缓解。\n\nCDNs 在大型地理区域或全球范围内运营数据中心，必须为客户确保其数据中心系统和网络的安全性。在评估\
  \ CDN 提供商时，必须考虑服务水平协议（SLAs）和适用的法规合规性。\n\n某些 CDN 提供商包括可选的 Web 应用防火墙（WAF）功能，保护 Web\
  \ 服务器免受应用层攻击。\n\n### 物理设备\n信息安全领域经常说：如果对手获取了对目标系统的物理访问权限，游戏就结束了。换句话说，拥有设备物理访问权的对手通常能够完全控制设备，从而损害其所有者的利益。此外，获得设备物理访问权的对手还可以使用该设备作为访问组织网络中其他设备、系统数据的手段。\n\
  \n物理访问安全主题在本书的多个领域都有讨论：\n\n*   **终端。** 见本章“终端安全”部分。\n\n*   **服务器和数据中心。** 见第 5 章。\n\
  \n## 设计并建立安全通信通道\nCISSP 考试要求了解安全设计原则以及各种通信技术的实现，包括语音、电子邮件、Web、传真、多媒体协作、远程访问、数据和虚拟化网络。\n\
  \n### 语音\n\n\n\n\n\n`PBX`（私有分支交换机）、`POTS`（普通电话系统）和 `VoIP`（基于 IP 协议的语音）交换机是企业电信基础设施中最容易被忽视且成本高昂的部分。许多员工在利用公司电话系统进行长时间个人使用（包括长途电话）时并不会深思。对公司提供的手机进行个人使用是另一个泛泛滥用的领域。针对内部滥用，或许简单且最有效的对措施是发布并执行公司电话使用政策。定期审计电话记录对于威慑和检测电话滥用也有效。同样，由于语音通信和全球劳动力都变得日益移动化，组织需要定义并实施适当的自备设备（`BYOD`）、自选设备（`CYOD`）或公司所有且个人授权（`COPE`）的移动设备政策。\n\
  \n近年来，云通信（也称为统一通信服务，即 `UCaaS`）已成为许多组织（从中小企业到大型企业）`PBX` 和本地 `VoIP` 系统的可行替代。许多云通信提供商提供与本地\
  \ `PBX` 和 `VoIP` 系统相同的高级特性和功能，并具备云端的所有业务和技术优势。\n\n同样，跨越网络（`OTT`）服务如 `Skype`、`Jabber`、`Vonage`、`Vimeo`\
  \ 和 `Zoom` 在业务通信中变得日益常见。\n\n最后，移动运营商正在引入创新技术，如长链路演进语音（`VoLTE`）、越 语音（`VoWiFi`）和 Wi-Fi\
  \ 通话。`5G` 网络将从 2019 年开始在美国商业化，为移动通信、物联网（`IoT`）和机器通信（`M2M`）等应用带来新机会——以及安全挑战。\n\n\
  ### 语音通信系统的攻击类型包括\n\n- **欺诈，** 例如主叫 ID 欺骗、窃听和语音诈骗（vishing）。\n- **电话欺诈，** 例如号码采集、通话劫持、互联网电话垃圾邮件（`SPIT`）、即时消息垃圾信息（`SPIM`）以及误配置互联网电话语音（`VOMIT`）。\n\
  - **窃听，** 攻击者利用技术拦截并监控通信消息。\n- **拒绝服务（DoS），** 如分布式拒绝服务（`DDoS`）攻击和电话拒绝服务（`TDoS`）攻击。\n\
  \n### 电子邮件\n\n电子邮件已成为全球经济中最重要的通信媒介之一，全球每天发送的邮件超过 500 亿封。遗憾的是，垃圾邮件和钓鱼占了这些邮件量的 85%。垃圾邮件不仅仅是一个微小的干扰——它是对全球所有组织的严重安全威胁。\n\
  \n简单邮件传输协议（`SMTP`）用于在互联网上发送和接收电子邮件。它运行在 `TCP`/`UDP` 端口 `25`，包含许多已知漏洞。大多数 `SMTP`\
  \ 邮件服务器默认配置转发（或中继）所有邮件，无论发送者或接收者的地址是否有效。\n\n未能保护组织的邮件服务器可能允许垃圾邮件者滥用你的服务器和带宽作为“开放中继”传播垃圾邮件。坏消息是，你最终（通常不超过几天）会被大量维护开放中继黑洞列表（`RBLs`）的组织列黑，这有效地阻止了你组织的大部分（如果不是全部）邮件到达目标接收者。被列黑后，从这些\
  \ `RBLs` 中被移除通常需要几个月，这会对你组织的通信基础设施和信誉造成巨大损害。\n\n![remember](img/remember.png) 使用\
  \ `RBLs` 只是对抗垃圾邮件的一种方法，而且通常甚至不是最有效或最可靠的方法。维护这些巨大列表的组织并非完美，也会犯错。如果你的域名或 `IP` 地址出现错误，你会诅咒他们的存在——这是一种有时药比病还严重的情况。\n\
  \n未能组织内预防垃圾邮件方面做出合理努力是尽职调查的失败。未能实施适当对措施的组织可能会发现自己成为某位员工性骚扰诉讼的被告，而该员工可能被垃圾邮件者发送到其公司邮箱的大量色情邮件所“淹没”。此外，未能阻止垃圾邮件和钓鱼会使组织暴露在攻击之下。超过\
  \ 90% 的安全泄露始于钓鱼邮件，因此通过任何可用手段阻止垃圾邮件和钓鱼是有意义的。\n\n### 与垃圾邮件相关的其他风险包括\n\n- **丢失或删除重要邮件：**\
  \ 你的老板可能会无意中删除那封授权你晋升加薪的邮件，因为她的收件箱被垃圾邮件淹没，她在按 `Delete` 键时手太快——至少这是一个便利的借口！\n- **病毒和其他“恶意”代码：**\
  \ 尽管你几年似乎听到的病毒变少了，但它们仍然无处不在，电子邮件仍然是传播这些病毒的首选媒介。\n- **钓鱼和网络钓骗诈骗：** `Phishing` 和 `pharming`\
  \ 攻击将受害者引导至看似真实的网站（通常是在线银行或拍卖网站），表面上是为了验证其个人账户信息，通常通过群发邮件实施。这是一种日益由组织犯罪进行的复杂诈骗。最终，钓鱼和网络钓骗会导致受害者损失金钱——可能还有身份。鱼叉式钓鱼（`Spear\
  \ phishing`）是针对特定组织的针对性钓鱼攻击，而鲸钩攻击（`whaling`）是针对特定个人的攻击——通常是富有、有权或著名的人。\n\n应对这些威胁需要技术解决方案和用户意识努力，并且——至少目前——是一场无休止的战斗。从保护你的服务器、终端\
  \ PC、移动设备和 `IoT` 设备开始。邮件服务器应该始终放置在 `DMZ` 中，并禁用不需要或未使用的服务——并更改默认的中继设置！大多数其他服务器以及几乎所有客户端\
  \ PC 都应禁用端口 `25`。实施垃圾邮件过滤器或其他安全邮件网关。此外，考虑以下用户意识提示：\n\n- ![tip](img/tip.png) **永远不要订阅或回复垃圾邮件。**\
  \ 垃圾邮件中的取消订阅链接通常用于确认你的邮箱地址的真实性，然后可能会被添加到出售给其他垃圾邮件者的群发列表中。而且，尽管告诉垃圾邮件者你对他那些增强社交生活或改善财务投资组合的不可抗拒报价的真实想法很有诱惑力，但大多数垃圾邮件者实际上并不读你的回复，（不幸的是）不太可能采纳你让他们跳悬崖的建议。\n\
  \n![remember](img/remember.png) 虽然知名零售商的合法报价或专业组织的简报可能被许多人认为是垃圾邮件，但此类群发邮件的接收者在某处实际上订阅过那些内容——所以从技术上讲它不是垃圾邮件。每当你填写任何申请时，似乎每个人都想要你的邮箱地址，提供邮箱地址通常意味着邀请他们向你介绍从现在直到永恒的每一次促销活动。在这种情况下，美国法律要求发送者在群发邮件中提供取消订阅链接，点击它确实会将接收者从未来的邮件中移除。\n\
  \n\n\n\n\n- **不要向互联网电子邮件地址发送自动回复邮件（如果可能的话）。** 邮件服务器可以配置为不向互联网电子邮件地址发送自动回复邮件（如离外回复）。然而，这种设置在你的组织中可能并不实际（而且很可能并不可行）。请注意其影响——自动回复规则不会区分垃圾邮件发送者，所以垃圾邮件者也知道你什么时候在休假！\n\
  \n- **在将家庭计算机连接到互联网之前，为它准备防火墙。** 如果你拥有像电缆、DSL 或光纤这样始终开启的高速连接，这一告诫尤为真实。通常情况下，具有高速访问能力的家庭计算机在连接到互联网几分钟内就会被扫描和攻击。如果没有防火墙的保护，这台计算机几乎会被攻破，并成为某些垃圾邮件发送者僵尸网络军队中不知情的僵尸（每天都有超过\
  \ 250,000 个新僵尸加入互联网！）。然后，你将成为问题的一部分，因为你的家庭计算机和互联网带宽被用于向全球成千上万的其他受害者发送垃圾邮件和钓鱼邮件，你会感到纳闷，为什么你新买的尖端家庭电脑突然变得那么慢，而你那极速的新互联网在你在使用两周后就不那么快了。\n\
  \n![remember](img/remember.png) 你的终端用户不需要通过 CISSP 认证就可以保护他们的家庭计算机。一个具有基本配置的简单防火墙软件包通常就足以阻止现在的大多数黑客——大多数人使用自动化工具扫描互联网，不会为了一个即使表现出微小挑战的计算机而放慢速度。在这些僵尸网络中，规模至重要，而且有太多未受保护的计算机正处于外面浪费时间（即使是几分钟）来攻破你的防火墙。\n\
  \n垃圾邮件只是冰山一角。加密货币（如比特币）挖掘已成为巨大的祸，需要大量的计算能力来验证加密货币交易并发行新的加密货币。被攻破的计算机和网络为攻击者提供了免费的分布式计算能力来源（以及免费电力），用于解决计算复杂的加密货币区块链并赚取交易费和新的加密货币。\n\
  \n![tip](img/tip.png) 安全邮件存在若干种协议，包括基于 TLS 的 `SMTP`（也称为机会性 TLS）、`S/MIME`、`PEM` 和\
  \ `PGP`。我们在本章节前面的“应用层（第 7 层）”部分讨论了这些协议中的几种。\n\n其他邮件安全考虑因素包括附件中的恶意代码、缺乏隐私和缺乏验证。这些考虑可以通过分别实施防病毒扫描软件、加密和数字签名来应对。\n\
  \n已经开发了多种采用各种加密技术的应用程序，为电子邮件通信提供机密性、完整性、验证、不可否赖性和访问控制。例如，Microsoft Office 365 消息加密\
  \ (OME) 是许多组织常用的解决方案。\n\n- **SMTP over TLS：** 这是一种使用 `TLS` 封装 `SMTP` 流量的方法，使得窃听者无法更改或读取从一个邮件服务器传输到另一个邮件服务器的邮件内容。`SMTP`\
  \ over TLS 可以以两种方式配置：\n\n    - **机会性：** 如果两个邮件服务器都具有 `TLS` 能力，将建立 `TLS` 连接。\n  \
  \  - **强制性：** 只有当其他邮件服务器也具有 `TLS` 能力时，邮件服务器才会与其进行通信。\n\n- **安全多用途互联网邮件扩展 (S/MIME)：**\
  \ `S/MIME` 是一种集成到多种流行浏览器和电子邮件应用程序中的安全邮件发送方法。`S/MIME` 通过使用 `RSA` 非对称密钥系统、数字签名和 `X.509`\
  \ 数字证书提供机密性和验证。`S/MIME` 符合公钥密码学标准 (`PKCS`) #7 格式和 `IETF` 规范。\n\n- **MIME 对象安全服务\
  \ (MOSS)：** `MOSS` 通过使用 `MD5` 和 `RSA` 非对称密钥提供机密性、完整性、识别与验证以及不可否赖性。`MOSS` 从未被广泛实施或使用，主要是因为\
  \ `PGP` 的流行。\n\n- **增强隐私邮件 (PEM)：** `PEM` 由 `IETF` 提出的一种符合 `PKCS` 标准，但从未被广泛实施或使用。它通过使用\
  \ `3DES` 加密、`MD5` 消息摘要、`X.509` 数字证书以及用于数字签名和安全密钥分发的 `RSA` 非对称系统提供机密性和验证。\n\n- **良好的隐私\
  \ (PGP)：** `PGP` 是一种流行的电子邮件加密应用程序。它通过使用 `IDEA` 密码进行加密，并使用 `RSA` 非对称系统进行数字签名和安全密钥分发提供机密性和验证。`PGP`\
  \ 没有使用中心证书权威机构 (CA)，而是使用去中心化的信任模型（通信双方隐含地相互信任），这非常适合小小组来验证用户身份（而不是使用成本高昂且难以维护的 `PKI`\
  \ 基础设施）。\n\n今天有两个基础版本的 `PGP` 软件可用：来自 Symantec 公司的商业版本（[`www.symantec.com`](http://www.symantec.com)）和一个开源版本\
  \ `GPG`（[`www.gnupg.org`](http://www.gnupg.org)）。\n\n![remember](img/remember.png)\
  \ `PGP` 是一种免费的邮件安全应用程序（对个人免费，对组织收费），使用 `IDEA` 算法（对称）进行加密，使用 `RSA` 算法（非对称）进行密钥分配和数字签名。\n\
  \n### Web\n\n构成万维网的两大技术是超文本传输协议 (`HTTP`) 和超文本标记语言 (`HTML`)。`HTTP` 是浏览器用于与网络服务器通信的命令与响应语言，而\
  \ `HTML` 是定义网页外观的显示语言。\n\n超文本传输协议安全 (`HTTPS`) 是 `HTTP` 的安全版本，它包含了验证用户（不常用）和网络服务器（经常使用）以及加密网络服务器与终端用户浏览器之间网络流量的协议。\n\
  \n`HTTP`、`HTTPS` 和 `HTML5` 是用于促进各种高价值活动（如在线银行和业务应用程序）的手段。因此，知道这些协议正受到黑客的持续攻击并不意外。某些攻击类型包括：\n\
  \n- **脚本注入：** 黑客试图向网页上的表单字段中注入脚本语言命令，试图欺骗网络服务器将后端数据库的内容发送给黑客。\n\n- **缓冲区溢出：** 黑客尝试将机器语言指令作为查询的一部分发送到网络服务器，试图运行这些指令。如果成功，黑客可以在服务器上执行其选择的命令，可能导致灾难性的结果。\n\
  \n- **拒绝服务 (DoS)：** 黑客可以向网络服务器发送特殊构造的查询，使其发生故障并停止工作。另一种拒绝服务形式是仅仅向网络服务器发送大量查询，试图阻塞其输入并使其无法供合法用户使用。\n\
  \n- **中间人攻击 (MITM)：** 黑客攻击 `HTTPS` 安全通道的建立，试图获得轻易解密网络服务器与浏览器之间原本安全流量的能力。\n\n- **跨站脚本\
  \ (XSS)：** 这种攻击是指攻击者试图在目标受害者查看的网页中注入客户端脚本。\n\n\n\n\n\n- **跨站请求伪造 (CSRF):** 攻击者试图诱骗受害者点击链接，该链接将执行受害者在其他情况下不会批准的操作。\n\
  - **水坑攻击 (Watering hole attacks):** 在这里，攻击者破坏目标组织内个人访问的网站，植入恶意软件，使其下载到毫无防备的受害者计算机。\n\
  - **浏览器入侵 (MITB):** 黑客试图诱骗用户安装浏览器辅助对象 (BHOs)，这些对象在用户浏览器与其通信的网站之间充当代理。MITB 攻击会监听网络通信，甚至可以更改流量。\n\
  \n这些和其他类型的攻击使得 Web 安全测试成为一种必须。许多拥有 Web 应用程序的组织，特别是那些涉及高价值活动（如银行、旅游和信息管理）的组织，采用工具和其他方法来确保不存在可能允许恶意攻击暴露敏感信息或导致应用程序故障的漏洞。\n\
  \n## 传真件\n\n传真传输通常被视为理所当然，但它们确实存在重大的安全问题。许多组织仍在使用传真机定期进行业务（包括律师、房地产中介和披萨送卖店等！），而且多功能打印机通常内置了传真机。即使你没有配置多功能打印机上的传真功能，它仍然是一个安全风险。\n\
  \n在许多组织中，基于电子邮件的传真服务已经取代了传统的传真机。在这种情况下，应该应用电子邮件安全概念（在前节讨论）。\n\n传真传输像任何其他电子传输一样，可以很容易被拦截或复制。传真安全的通用管理和技术控制包括：\n\
  - 使用封封页（包含适当的路由和分类标记）\n- 将传真机放在安全区域\n- 使用预设的号码\n- 使用安全电话线路\n- 加密传真数据\n- 使用集中化的传真服务器\n\
  \n![tip](img/tip.png) 许多传真件丢失在接收者不知道会有传真来的情况下，办公室里的其他人从传真机上拿了太多纸张，包括发给那个不知情的接收者的传真！如果你正在发送包含敏感信息的传真，请提前通知接收者，以便他或她确保从传真机上拿到它！\n\
  \n## 多媒体协作\n\n多媒体协作包括远程会议软件、某些 IP 语音 (VoIP) 应用（见前面的章节，“语音”）以及即时消息等。\n\n远程会议软件（Skype、WebEx、Zoom\
  \ 和 GoToMeeting）已变得极其流行，并在互联网实现了丰富的协作。与远程会议软件相关的潜在安全问题包括下载和安装可能存在漏洞的附加组件或其他所需的软件。其他安全问题源于远程会议软件自带的功能，例如远程桌面控制、文件共享、音频和视频。通过远程会议软件连接到端点的未经授权用户可能会访问所有这些功能。\n\
  \n即时消息 (IM) 应用实现了组织内部简单方便的通信，并可以显著提高生产力。然而，即时消息长期一直是网络犯罪分子喜爱的攻击向量。用户需要意识到，即时消息的安全性并不高于任何其他通信方法。通信会被拦截（即时消息很少加密），恶意软件可以通过即时消息传播。\n\
  \n## 远程访问\n\n在过去的十年里，对公司网络的远程访问变得无处不在。远程办公和移动计算等趋势模糊了许多人工作生活与个人生活的界。要安全地从任何设备访问公司网络资源，需要对各种远程访问安全方法、协议和技术有深入了解。\n\
  \n### 远程访问安全方法\n\n远程访问安全方法包括限制允许的地址、地理位置、主叫 ID、回拨和多身份验证。\n\n- **限制地址:** 限制地址方法根据允许的\
  \ IP 地址阻止访问网络，本质上执行了基础的 `node` 认证，而不是 `user` 认证。\n- **地理位置:** 该方法根据用户的地理位置阻止访问。在远程访问凭据被盗的情况下，这种方法是一种有效的应对措施。\n\
  - **主叫 ID:** 主叫 ID 方法根据允许的电话号码限制网络访问，从而执行了形式稍为安全的节点认证，因为电话号码比 IP 地址更难伪造。然而，对于经常往于不同城市的“奔波族”来说，这种方法可能难以管理。\n\
  - **回拨:** 回拨方法通过要求远程用户首先对远程访问服务 (RAS) 服务器进行验证来限制网络访问。然后 RAS 服务器断开连接并拨预设电话号码拨回用户。与主叫\
  \ ID 一样，这种方法对于奔波族来说可能难以管理。\n- **多身份验证:** 要求用户使用用户名和密码进行身份验证，外加上额外的因素（例如通过短信发送到移动设备的一次性密码）、令牌或生物识别，可以降低登录凭据被破解的风险。\n\
  \n![remember](img/remember.png) 回拨的一个局限性是可以通过电话转移轻松绕过。\n\n### 远程访问安全\n\n远程访问技术包括包括利用\
  \ PPP、RADIUS 和 TACACS 相关的各种认证的 RAS 服务器。\n\n- **RAS:** 远程访问服务 (RAS) 服务器利用点对点协议 (PPP)\
  \ 封装 IP 数据包，并在串行和 ISDN 链路上建立拨号连接。PPP 包含以下三种认证协议：\n    - **PAP:** 密码认证协议 (PAP) 在链路初始建立时使用双向握手对服务器对对方进行验证。PAP\
  \ 以明文传输密码，不提供防止重放或暴力破解攻击的保护。\n    - **CHAP:** 挑战握手协议 (CHAP) 在链路初始建立时使用三向握手对对方和服务器进行验证，并可选地在会话期间定期进行。CHAP\
  \ 要求对方和服务器都预配置一个共享密钥，该密钥必须以明文存储。对方使用该密钥通过 MD5 单向哈希函数计算对服务器挑战的响应。MS-CHAP 是微软对 CHAP\
  \ 的增强，允许以加密形式存储共享密钥。\n    - **EAP:** 可扩展认证协议 (EAP) 通过实现各种认证机制为 PPP 认证增加了灵活性，包括 MD5\
  \ 挑战、S/Key、通用令牌卡、数字证书等。EAP 已应用于许多无线网络中。\n- **RADIUS:** 远程认证拨号用户服务 (RADIUS) 协议是一种开源的、基于\
  \ UDP（通常端口 1812 和 1813，有时为端口 1645 和 1646）的客户端服务器协议，提供认证和可性性。用户通过 PAP 或 CHAP 向 RADIUS\
  \ 客户端提供用户名/密码信息。\n\nRADIUS 客户端加密密码，并将用户名和加密后的密码发送到 RADIUS 服务器进行认证。\n\n\n\n\n\n>\
  \ **注意：** RADIUS 客户端与 RADIUS 服务器之间交换的密码是加密的，但 PC 客户端与 RADIUS 客户端之间交换的密码并不一定加密——例如在使用\
  \ PAP 认证时。然而，如果 PC 客户端恰好也是 RADIUS 客户端，无论使用何种认证协议，所有的密码交换都是加密的。\n\n![technicalstuff](img/technicalstuff.png)\
  \ RADIUS 是一种 AAA（认证、授权和计费）协议，用于管理 AAA 事务中的访问。\n\n## 网络协议\n\n*   **Diameter:** Diameter\
  \ 协议是下一代 RADIUS 协议。Diameter 克服了 RADIUS 的若干缺点。例如，它使用 TCP 而不是 UDP，支持 IPsec 或 TLS，并且比\
  \ RADIUS 有更大的地址空间。\n*   **TACACS:** 终端访问控制控制系统 (TACACS) 是一种基于 UDP 的访问控制协议（最初为 MILNET\
  \ 开发），提供认证、授权和计费（AAA）。原始 TACACS 协议经过显著增强（主要由思科完成），变为 `XTACACS`（已不再使用）和 `TACACS+`（TACACS\
  \ 最常见的实现）。`TACACS+` 基于 TCP（端口 49），并支持几乎任何认证机制（PAP、CHAP、MS-CHAP、EAP、令牌卡、Kerberos\
  \ 等）。`TACACS+` 的基本操作与 RADIUS ，包括关于客户端和服务器之间加密密码的说明。`TACACS+` 的主要优势在于对各种认证机制的广泛支持以及对授权参数的细粒度控制。\n\
  \n## 虚拟专用网络 (VPN)\n\n虚拟专用网络 (VPN) 在公共网络（如互联网）上创建一个安全隧道。在数据跨 VPN 传输时对其加密创建一个安全隧道。VPN\
  \ 的两端通常通过以下方法之一实现：\n\n*   客户端到 VPN 集中器（或设备）\n*   客户端到防火墙\n*   防火墙到防火墙\n*   路由器到路由器\n\
  \n![remember](img/remember.png) 常见的 VPN 协议标准包括点对点隧道协议 (PPTP)、二层转发协议 (L2F)、二层隧道协议\
  \ (L2TP)、IP 安全协议 (IPsec) 和安全套接层 (SSL)。\n\n### 点对点隧道协议 (PPTP)\n\n点对点隧道协议 (PPTP) 由微软开发，旨在允许点对点协议\
  \ (PPP) 通过公共网络建立隧道。PPTP 使用原生 PPP 认证和加密服务（如 PAP、CHAP 和 EAP）。PPTP 通常用于拨号连接。PPTP 运行在\
  \ OSI 模型的数据链路层（第 2 层），为单个客户端-服务器连接设计。\n\n### 二层转发协议 (L2F)\n\n二层转发协议 (L2F) 由思科开发，提供与\
  \ PPTP 类似的功能。顾其名，L2F 运行在 OSI 模型的数据链路，并允许 HDLC 和 SLIP 等二层 WAN 协议的化。\n\n### 二层隧道协议\
  \ (L2TP)\n\n二层隧道协议 (L2TP) 是一种 IETF 标准，结合了微软（及其他）的 PPTP 和思科的 L2F 协议。像 PPTP 和 L2F\
  \ 一，L2TP 运行在 OSI 模型的数据链路，为单个客户端-服务器连接创建安全的 VPN 连接。L2TP 解决了以下用户需求：\n\n*   **透明性：**\
  \ 不需要额外的软件。\n*   **健壮的认证：** 支持 PPP 认证协议、远程认证拨号用户服务 (RADIUS)、终端访问控制控制系统 (TACACS)、智能卡和一次性密码。\n\
  *   **本地地址：** 由 VPN 实体而非 ISP 分配 IP 地址。\n*   **授权：** 授权由 VPN 服务器端管理，类似于直接拨号连接。\n\
  *   **计费：** ISP 和用户均执行 AAA 计费。\n\n### IPsec\n\nIP 安全协议 (IPsec) 是一种用于 VPN 的 IETF\
  \ 开放标准，运行在 OSI 模型的网络层（第 3 层）。它是目前最流行、最健壮的 VPN 协议。IPsec 通过使用第 3 层加密和认证提供端到端解决方案，确保机密性、完整性和真实性。IPsec\
  \ 以两种模式运行：\n\n*   **传输模式：** 仅对数据进行加密。\n*   **隧道模式：** 对整个包进行加密。\n\n![remember](img/remember.png)\
  \ IPsec 的两种模式是传输模式和隧道模式。IPsec 中使用的两种主要协议是：\n\n*   **认证头 (AH)：** 提供完整性、认证和不可否认性。\n\
  *   **封装安全载荷 (ESP)：** 提供机密性（加密）。\n\n安全关联 (SA) 是一种单向连接。双向通信至少需要两个 SA。每个 SA 有三个参数：\n\
  \n*   安全参数索引 (SPI)： 一个 32 位的字符串，接收站用于区分不同的 SA。SPI 位于 AH 或 ESP 内部。\n*   目的 IP 地址：\
  \ 目的地址可以是中间网关，但必须是单播的。\n*   安全协议 ID： 安全协议 ID 必须是 AH 或 ESP 之一。\n\nIPsec 通过使用互联网密钥交换协议\
  \ (IKE) 提供密钥管理。`IKE` 实际上是三个互补协议的组合：互联网安全关联和密钥管理协议 (ISAKMP)、安全密钥交换机制 (SKEME) 和 Oakley\
  \ 密钥交换协议。`IKE` 以三种模式运行：主模式、激进模式和快速模式。\n\n### SSL\n\n安全套接层 (SSL) 协议由网景通信于 1994 年开发，为互联网上客户端与服务器之间的安全通信提供基于会话的加密和认证。SSL\
  \ 运行在 OSI 模型的传输层（第 4 层）。SSL VPN（使用 TLS 1.0 到 1.2）由于其易于使用和低低，近年来迅速获得了广泛的和接受。SSL VPN\
  \ 不需要特殊的客户端硬件或软件（浏览器除外），且客户端配置很少或没有。SSL VPN 提供对 Web 应用程序的安全访问，因此在控制上更为精确——用户被授予特定应用程序的访问权限，而不是整个私有网络。这种颗粒性也可以被认为是\
  \ SSL VPN 的局限性；并非所有应用程序都能 SSL VPN 上运行，许多方便的网络功能（文件和打印共享）在 SSL VPN 上可能不可用。\n\n![remember](img/remember.png)所有的\
  \ SSL 版本现在都被认为不足以保护通信。现在建议使用 TLS 1.2 或更高版本代替 SSL。SSL 使用 RSA 非对称密钥系统；IDEA、DES 和 3DES\
  \ 对称密钥系统以及 MD5 哈希函数。当前版本（发布于 1996 年）是 SSL 3.0。2014 年发现了一个影响 SSL 中所有块密码的漏洞。SSL 3.0\
  \ 中使用的 RC4 流加密算法也容易受到攻击。2011 年发布的 RFC 6176 废弃并禁止使用 SSL 2.0。同样，2015 年发布的 RFC 7568\
  \ 废弃并禁止使用 SSL 3.0。\n\n\n\n\n\nSSL 3.0 由 IETF 在传输层安全协议（TLS）1.0 中标准化，并于 1999 年发布，仅对原始\
  \ SSL 3.0 规范进行了微小修改。TLS 1.2 是 TLS 的最新版本，而在本文期间，TLS 1.3 仍处于草案标准阶段，尽管预计将在 2018 发布最终规范。\n\
  \n## 数据通信\n\n网络数据通信使用多种技术和协议进行保护。\n\n虚拟局域网（VLAN）用于在逻辑上划分网络，例如按部门或资源划分。VLAN（参见本章前面的侧边栏“空白区域网络\
  \ (__AN)”）在网络交换机上配置，并将 VLAN 访问限制在连接到交换机上配置为 VLAN 成员端口的设备。\n\n传输层安全/安全套接层（TLS/SSL）协议（在前节中讨论）通常用于加密网络通信。\n\
  \n## 虚拟化网络\n\n虚拟化网络是席卷全球的云计算革命的重要组成部分。虚拟化网络的早期形式是虚拟局域网（VLAN），在本章前面已讨论过。但巨大的进展在于软件定义网络（SDN）、软件定义安全（SD-S）和网络功能虚拟化（NFV），在这些领域，路由器、交换机、防火墙、入侵检测系统（IDS）等网络组件不再是硬件设备，而是运行在虚拟环境中的虚拟机（见下一节）。\n\
  \n### 虚拟化\n\n虚拟化是过去十年最热门且最具破坏性的计算趋势之一，也是云计算的关键实现技术。虚拟化技术仿真物理计算资源，如台式计算机和服务器、处理器、内存、存储、网络和单个应用程序。虚拟化技术的核心组件是虚拟机管理器（hypervisor），它运行在硬件内核和操作系统之间，允许多个“客人”虚拟机（VM）运行在单个物理“主机”机器上。\n\
  \n两种常见的虚拟机管理器类型是：直接运行在主机硬件上的第 1 型（`原生`或`裸金属`）虚拟机管理器，以及运行在操作系统环境（OSE）内的第二型（`托管`）虚拟机管理器。\n\
  \n除了虚拟化服务器外，虚拟化技术越来越多地用于：\n\n*   **桌面和应用程序虚拟化。** 桌面虚拟化对于结合 VPN 软件使用的远程桌面应用程序日益流行。应用程序虚拟化允许各种用例，例如无法在较新操作系统上运行的旧应用程序、桌面上运行的同一应用程序的多个版本，以及桌面上运行的多个软件组件（如\
  \ `Java`）。应用程序虚拟化还用于安装在终端上的软电话。\n*   **存储虚拟化。** 块（SAN）和文件（NAS）虚拟化使存储管理员能够管理使用商品或标准现计算和存储硬件组件的企业级存储空间，存储管理功能在虚拟软件中执行。\n\
  *   **网络虚拟化。** 网络虚拟化从底层硬件中抽象出网络功能（如路由、交换和流量管理）。流行的网络虚拟化技术和能力包括软件定义网络（SDN）、微隔离和网络功能虚拟化（NFV）。\n\
  \n虚拟化环境的安全始于虚拟机管理器。被攻破的虚拟机管理器可能会让攻击者访问并控制整个虚拟化环境。\n\n与虚拟化环境相关的操作安全问题包括：\n\n*   **虚拟机泛（VM\
  \ sprawl）。** 虚拟化技术允许组织在几分钟内部署虚拟机，而不是几天或几周。这导致虚拟机在许多数据中心泛滥。\n*   **客户操作系统。** 虚拟化环境中存在的各种操作系统和操作系统版本需要定期打补丁并保持更新。\n\
  *   **休眠虚拟机。** 不再需要的虚拟机通常被关闭而不是注销。如果以后开启了休眠虚拟机，它将缺少关键的安全补丁，因此可能容易受到攻击。\n*   **网络可见性。**\
  \ 大多数组织的虚拟化之旅始于虚拟化服务器。这通常意味着单个物理服务器上安装了多个网卡（NIC），流向该服务器虚拟机的所有网络流量都通过网卡运行。如果没有网络虚拟化，网络管理员在故障排除和安全监控方面对此类流量的可见性有限。\n\
  \n虚拟化的一项近期创新被称为 `containerization`（容器化）。正如虚拟机管理器可以促进多个操作系统实例的使用，容器化促进了在单个操作系统中使用多个应用程序实例。每个应用程序都在`container`（容器）中执行，与其他容器隔离。对于应用程序设计为由运行中的操作系统运行的环境，容器化非常有用。流行的软件包括\
  \ `Docker` 和 `Kubernetes`。\n\n## 防止或缓解网络攻击\n\n大多数针对网络的攻击是拒绝服务（DoS）或分布式拒绝服务（DDoS）攻击，其目标是消耗网络带宽以导致服务不可用。但存在其他几种类型的攻击，其中一些将在后续章节中讨论。\n\
  \n### 蓝牙劫持与蓝牙盗取\n\n随着蓝牙技术的极度流行，演化出了几种攻击方法，包括 `bluejacking`（向支持蓝牙的设备发送匿名、未经请求的消息）和\
  \ `bluesnarfing`（从支持蓝牙的手机中窃取个人数据，如联系人、照片和日历信息）。更糟糕的是，在蓝牙盗取攻击中，手机信息（如序列号）可以被下载，然后用于克隆你的手机。\n\
  \n### ICMP 洪水攻击\n\n在 `ICMP flood`攻击中，向目标网络发送大量的 ICMP 数据包（通常是 Echo 请求）以消耗可用带宽和/或系统资源。由于网络操作不需要\
  \ ICMP，最简单的防御是在路由器上丢弃 ICMP 数据包或在防火墙上对其过滤。\n\n### Smurf 攻击\n\n`Smurf` 攻击是 ICMP 洪水攻击的变体。在\
  \ Smurf 攻击中，利用目标网络上的伪造 IP 地址向目标网络的广播地址发送 ICMP Echo 请求包。目标或 `bounce site`（反射点）随后将\
  \ ICMP Echo 请求发送到网络上的所有主机。每个主机随后用 Echo Reply 包响应，从而淹没可用带宽和/或系统资源。针对 Smurf 攻击的措施包括在路由器上丢弃\
  \ ICMP 数据包。\n\n### Fraggle 攻击\n\n`Fraggle`攻击是 Smurf 攻击的变体，使用 UDP Echo 包（UDP 端口 7）而不是\
  \ ICMP 数据包。思科路由器可以配置为禁用 Fraggle 攻击中最常用的 TCP 和 UDP 服务（称为 `TCP and UDP small servers`）。\n\
  \n### DNS 服务器攻击\n\n有多种针对 DNS 服务器实施的攻击，其设计目的是使目标 DNS 服务器向终端用户提供错误响应，导致终端用户被引导到假系统（通常是网站）。针对\
  \ DNS 服务器攻击的防御包括 DNS 服务器加固（包括域名系统安全扩展，或 `DNSSEC`）和应用程序防火墙。\n\n### 中间人\n\n\n\n\n\n\
  `man-in-the-middle`（MITM，中间人）攻击是指攻击者通过伪装来更改双方之间的通信。一种常见的 MITM 技术是攻击 `TLS` 会话的建立，使得攻击者能够轻松解密两个端点之间的加密通信（例如，在咖啡店的\
  \ Wi-Fi 网络上）。\n\n防御 MITM 攻击的措施包括更强的身份验证、实施 `DNSSEC`、延迟检查以及带外验证。\n\n### 会话劫持（欺骗）\n\
  \nIP `spoofing`（IP 欺骗）涉及修改 `TCP` 数据包，使其看起来来自已知的受信源，从而让攻击者能够访问网络。\n\n### 会话劫持（会话令牌拦截）\n\
  \n会话劫持通常涉及未加密的 Wi-Fi 网络，攻击者可以在其中拦截另一个用户的 `HTTP` 会话 cookie。攻击者随后使用相同的 cookie 来接管受害用户的\
  \ `HTTP` 会话。这种攻击已经通过 Firesheep Firefox 扩展得到了证实。\n\n### SYN 洪水\n\n在 `SYN-flood` 攻击中，带有伪造源地址的\
  \ `TCP` 数据包请求与目标网络连接（设置 `SYN` 位）。目标响应一个 `SYN-ACK` 数据包，但伪造的源从未回复。`Half-open connections`（半打开连接）是等待\
  \ `TCP` 三次握手完成的不完整通信会话。当系统等待这些半打开连接超时时，这些连接可能会迅速耗尽系统资源，导致系统崩溃或无法使用。\n\nCisco 路由器通过两种功能来应对\
  \ SYN 洪水：`TCP Intercept`，它能有效地对半打开连接进行代理；以及 `Committed Access Rate` (`CAR`，承诺访问速率)，它限制了某些类型流量的可用带宽。Checkpoint\
  \ 的 `FW-1` 防火墙有一个名为 `SYN Defender` 的功能，其功能与 Cisco 的 `TCP Intercept` 功能相似。其他防御措施包括更改\
  \ `TCP` 半打开连接的默认最大数量以及缩短网络系统的超时时间。\n\n### Teardrop（滴落攻击）\n\n在 `Teardrop` 攻击中，修改连续\
  \ `IP` 数据包的 `Length`（长度）和 `Fragmentation`（分）偏移字段，导致某些目标系统产生混乱并崩溃。\n\n### UDP 洪水\n\
  \n在 `UDP-flood` 攻击中，向目标网络发送大量 `UDP` 数据包以消耗可用带宽和/或系统资源。`UDP` 洪水通常可以通过在路由器丢弃不必要的 `UDP`\
  \ 数据包来应对。然而，如果攻击使用了必要的 `UDP` 端口（例如 `DNS` 端口 `53`），则需要采用其他应对措施。\n\n### 窃听\n\n窃听是监听网络流量的行为，通常是因为攻击者想要了解通信会话或其内容。攻击者可能在寻找以明文传输的登录凭据，或其他感兴趣的敏感信息，例如使用\
  \ `SIPVicious` 来收听 `VoIP` 流量。无论原因何，我们都需要减少攻击者从网络流量中学习的能力：窃听可以通过加密（保护敏感内容）以及封装（隐藏有关通信的额外信息）来防御。\n\
  \n第 7 章\n\n# 身份与访问管理\n\n本章内容\n\n![check](img/check.png) **控制对信息、系统、设备和设施的访问**\n\n\
  ![check](img/check.png) **管理识别和身份验证技术**\n\n![check](img/check.png) **在云端和本地集成身份与访问管理**\n\
  \n![check](img/check.png) **理解数据访问管理**\n\n![check](img/check.png) **防御访问攻击**\n\n\
  ![check](img/check.png) **管理身份和访问生命周期**\n\n身份与访问管理 (IAM) 是一系列用于控制信息访问的过程和技术。在计算无处不在、随处可访问的现代，许多从业人员现在将身份称为“新的新的边界”。该领域占\
  \ CISSP 考试的 13%。安全专业人员必须完全理解身份与访问管理概念（包括身份验证、授权和审计）、系统访问控制（包括技术和方法）以及集中、分布式和云环境中的数据访问控制。\n\
  \n## 控制资产的物理和逻辑访问\n\n身份与访问管理系统和目的是管理对信息、系统、设备和设施的访问。在本节讨论的几种范围内，使用了多种控制措施。第 3 章包含了对控制类型和分类的讨论。\n\
  \n### 信息\n\n对信息资产的控制主要通过逻辑控制来实现，确定哪些人员或系统（称为`主体`）允许访问哪些文件、目录、数据库、记录或字段（称为`对象`）。用于控制信息访问的机制包括\n\
  \n- 文件和目录级权限。这通常在操作系统级别或文件共享系统（如 SharePoint 或 Box）中管理。\n- 数据库表、视图、字段和行权限。通常在数据库管理系统或第三方工具中管理。\n\
  \n### 系统和设备\n\n对系统和设备的控制主要通过这些系统内置的机制实现，包括：\n\n- 端口级访问控制。在网络层面，可以配置系统根据来源（如 IP 地址、IP\
  \ 网络或地理区域）以及端口号来接受的连接请求。\n- 控制台登录。物理或逻辑控制台控制对系统的访问，通常基于连接主体的已验证身份。\n- 远程控制台登录。可以通过远程控制台连接访问系统，其外观通常类似于本地物理控制台，但通过网络访问。同样，访问权限基于想要连接的主体的已验证身份。\n\
  - 应用程序编程接口 (`APIs`)。系统或应用程序可以通过 `API` 进行程序化访问，该 API 通常供需要访问数据或应用程序使用。\n\n\n\n\n\n\
  - **工业控制系统：** 这包括对基础设施的远程监控和控制，包括电力及配电、供水和污水处理。不要忘记自动化制造、3D 打印、建筑环境系统和投票机。\n- **医疗设备：**\
  \ 医院中的设备，如患者监护和静脉泵，以及人体外或内的物体，包括胰岛素泵和起搏器。\n- **可穿戴设备：** 包括手表、健身设备、视频眼镜等。\n- **交通：**\
  \ 汽车、自动驾驶汽车、无人机和卫星。还有 GPS 导航、自动驾驶仪、空中交通控制等。\n\n### ### 设施\n\n控制设施访问的目的是确保在该设施内工作的人员的安全，并保护那里的信息系统和其他资产。控制设施访问通过多种手段实现，包括：\n\
  \n- **门卡访问系统。** 这些系统配备可选的生物识别阅读器和/或 `PIN` 键盘，用于控制哪些人员被允许访问哪些建筑和房间。这些系统用于预防性（通过限制对敏感区域的访问）和检测性（通过记录主体移动）的场景。\n\
  - **护送。** 安全权限较低的访客和主体可能由其他人员护送。\n- **守卫和保安犬。** 带有可选警犬助手的安全人员确保只有授权人员和经过适当护送的人员才能进入建筑。\n\
  - **访客日志。** 虽然它们作为一种管理控制，但访客日志提供了进入离开设施的和访客的业务记录。通过检查政府颁发的照片身份证来验证访客身份，这种控制得到了一定改进。\n\
  - **围栏、墙体和大门。** 这些有助于在建筑或设施周围建立安全的物理周边界和受控的进出口点。\n- **人行室和安全门。** 通道和入口的组合，用于限制对某一区域的访问，例如使用一组互锁的门，要求在一组门关闭后另一组门才能打开。\n\
  - **护柱和防撞门。** 这些用于控制接近和靠近设施的车辆流量。\n\n物理安全的许多其他方面在第 5 章中有讨论。\n\n### ### 生命安全\n\n\
  我们都见证了如今嵌入 `TCP/IP` 的各种奇异设备，并为设备本身添加了“智能”属性。我们现在有了“智能”汽车、“智能”电视和“智能”家电。这场革命已发展到穿戴和生命安全产品，例如体征（心率、呼吸等）监测，以及胰岛素泵、静脉泵、患者监护、起搏器，以及汽车和飞机的导航与控制。\n\
  \n安全专家观察到，这些许多新型“智能”产品的安全能力从设计良好到设计糟糕再到完全缺失不等。但身份和访问管理从未如此现在重要：对于所有这些新类型的设备，都需要卓越的身份验证和授权，以防止未经授权的访问。如果做错了，后果可能会直接夺走某人的生命。\n\
  \n## # 管理人员、设备和服务的身份识别与验证\n\n身份和访问管理 (IAM) 内部的核心活动是对身份的管理，包括人员、设备和服务。在本节中，我们描述了目前使用的流程和技术。\n\
  \n### ### 身份管理实施\n\n实施身份管理始于计划。组织中的身份和访问管理 (IAM) 系统是一个复杂的分布式系统，它涉及系统、网络和应用程序，并控制对资产的访问。IAM\
  \ 系统还包括与 IAM 技术和人员协作完成工作的业务流程。\n\nIAM 系统可能是组织实施过的最重要的功能之一。除了网络本身之外，IAM 系统通常是环境中最关键的，因为\
  \ IAM 系统控制对所有系统和应用程序的访问。\n\n#### #### 单点登录 (SSO)\n\n单点登录 (SSO) 的概念解决了用户和安全管理员面临的共同问题。系统、网络或应用程序中存在的每一个账户都是潜在的未经授权访问点。属于单个用户的多个账户代表了更大的风险：\n\
  \n- 需要访问多个系统或应用程序的用户通常必须维护多套凭据。这在不可避免地导致了创建和回想密码时的走捷径。如果任由其发展，用户会创建只有细微变异的弱密码，更糟的是，他们会在任何可以的地方使用相同的密码。当他们需要管理多套凭据时，用户更有可能将它们写下来。这不仅限于组织的边界：用户在工作时使用的密码通常与他们个人账户使用的相同。\n\
  - 多个账户还会影响用户的生产力（以及理智！），因为用户必须停下来登录不同的系统。还必须有人创建和维护账户，这涉及解锁账户，以及支持、删除、重置和禁用多组 `userids`\
  \ 和密码。\n\n乍一看（遗憾的是），SSO 看起来是用户和安全管理员寻求的“完美”解决方案。SSO 允许用户提交单组登录凭据（通常提交给身份验证服务器），然后服务器透明地将用户登录到其授权的所有其他企业系统和应用程序。当然，SSO\
  \ 确实有一些缺点，包括\n\n- **太棒了！** 在你通过验证后，你就拥有了王国的钥匙。将其读作`对所有授权资源的访问!`。这是安全专业人员的噩梦。如果用户账户的登录凭据被破解，入侵者可以访问端用户被授权的所有的一切。\n\
  - **复杂性：** 实施 SSO 可能会困难且耗时。你必须解决不同系统和应用程序之间的互操作性问题。但是，嘿——这就是你拿高薪（或应该拿高薪）的原因！\n\n\
  SSO 通常通过各种协议和解决方案实现，包括以下：\n\n#### #### 安全断言标记语言 (SAML)\n\nSAML 是事实上的身份验证协议，用于通过组织之间交换身份验证和授权信息，促进跨系统和跨组织的用户身份验证。SAML\
  \ 是使大多数单点登录 (SSO) 系统工作的胶水。\n\n正如其全称所示，SAML 是一种 XML 标记语言。XML 正在成为不同系统之间交换信息的标准方法。\n\
  \n#### #### KERBEROS\n\nKerberos 经常用于 Sun 网络文件系统 (NFS) 和微软 Windows，它可能是目前使用的最流行的基于票据的对称密钥验证协议。\n\
  \n![technicalstuff](img/technicalstuff.png) Kerberos 以希腊神话中守卫冥界大门的凶猛三头狗命名。（请勿将其与\
  \ `Ker-beer-os` 混淆，那是坐在酒吧里、看起来越来越好的六头毛茸茸的狗！）马萨诸塞理工学院 (MIT，也称为 *受训练的百万富*) 的研究人员在\
  \ 20 世纪 80 年代中期开发了这一开放系统协议。\n\n\n\n\nCISSP 考试要求对 Kerberos 的运行机制有通用理解。遗憾的是，Kerberos\
  \ 是一个复杂的协议，有许多不同的实现方式且没有简单的解释。以下的逐步讨论是对 Kerberos 运行机制的基本描述：\n\n1. 客户端向主体（如用户）索要标识符和凭据（例如用户名和密码）。使用身份验证信息（密码），客户端通过单向哈希函数为主体临时生成并存储一个密钥，然后仅将主体的身份标识（用户名）发送到密钥分发中心（`KDC`）的认证服务器（`AS`）。密码/密钥\
  \ `isn’t` 不会被发送给 `KDC`。请参见图 7-1。\n\n2. `KDC` 上的 `AS` 验证主体（称为 `principal`，主实体）是否存在于\
  \ `KDC` 数据库中。随后，`KDC` 票据授予服务（`TGS`）生成一个使用主体密钥加密的客户端/TGS 会话密钥，该密钥只有 `TGS` 和客户端已知。`TGS`\
  \ 还会生成一个票据授予票据（`TGT`），由主体的身份标识、客户端网络地址、票据有效期以及客户端/TGS 会话密钥组成。`TGS` 使用只有 `TGS` 知知的自己的密钥加密\
  \ `TGT`，然后将客户端/TGS 会话密钥和 `TGT` 发回客户端。请参见图 7-2。\n\n3. 客户端使用其通过主体密码生成的存储密钥来解密客户端/TGS\
  \ 会话密钥 —— 验证主体（用户），然后擦除存储的密钥以避免可能的泄露。客户端无法解密由 `TGS` 使用 `TGS` 密钥加密的 `TGT`。请参见图 7-3。\n\
  \n4. 当主体请求访问特定对象（如服务器，也称为 `principal`）时，它会将 `TGT`、对象标识符（如服务器名称）和一个身份验证器发送到 `KDC`\
  \ 上的 `TGS`。（`authenticator` 是一个独立的消息，包含客户端 ID 和时间戳，并使用客户端/TGS 会话密钥对其进行加密。）请参见图 7-4。\n\
  \n5. `KDC` 上的 `TGS` 同时生成客户端/服务器会话密钥（使用客户端/TGS 会话密钥对其加密）和一个服务票据（由主体的身份标识、客户端网络地址、票据有效期以及客户端/服务器会话密钥组成）。`TGS`\
  \ 使用请求对象（服务器）的密钥加密服务票据，该密钥只有 `TGS` 和该对象已知。随后，`TGS` 将客户端/服务器会话密钥和服务票票据发回客户端。请参见图\
  \ 7-5。\n\n6. 客户端使用客户端/TGS 会话密钥解密客户端/服务器会话密钥。客户端无法解密由 `TGS` 使用请求对象密钥加密的服务票据。请参见图\
  \ 7-6。\n\n7. 客户端随后可以与请求的对象（服务器）直接通信。客户端将服务票据和身份验证器发送给请求的对象（服务器）。客户端使用 `TGS` 生成的客户端/服务器会话密钥加密身份验证器（包含主体的身份标识和时间戳）。对象（服务器）使用其密钥解密服务票据。服务票据包含客户端/服务器会话密钥，这允许对象（服务器）随后解密身份验证器。如果主体身份标识和时间戳有效（根据服务票据中指定的身份标识、客户端网络地址和有效期），则客户端与服务器之间的通信即建立。随后，客户端/服务器会话密钥用于主体与对象之间的安全通信。请参见图\
  \ 7-7。\n\n![image](img/9781119505815-fg0701.png)\n\n![image](img/9781119505815-fg0701.png)\n\
  图 7-1 Kerberos：登录启动。\n\n![image](img/9781119505815-fg0702.png)\n图 7-2 Kerberos：客户端/T\
  \ 和密钥的生成。生成。\n\n](image](9/97811195058150000.3)\n图 7-3 Kerberos：登录完成。\n\n![image](img/9781119505815-fg0704.png)\n\
  图 7-4 Kerberos：请求服务。\n\n![image](img/9781119505815-fg0705.png)\n图 7-5 Kerberos：客户端/服务器会话密钥和票据。\n\
  \n![image](img/9781119505815-fg0706.png)\n图 7-6 Kerberos：解密票据。\n\n![image](img/9781119505815-fg0707.png)\n\
  图 7-7 Kerberos：客户端/服务器通信。\n\n#### Remember\n在 Kerberos 中，`session key`（会话密钥）是在需要时生成的动态密钥，两个主体之间共享，并在不再需要时销毁。`secret`\
  \ 密钥是用于加密的静态密钥。\n\n#### LDAP\n*轻量级目录访问协议*（LDAP）既是一种 IP 协议，也是一种数据模型。`LDAP`（读音为 EL-dap）用于为人和资源支持身份验证功能。许多供应商实现了\
  \ `LDAP`，包括：\n* Apache Directory Server\n* CA eTrust Directory\n* IBM SecureWay\
  \ 和 Tivoli Directory Server\n* Microsoft Active Directory\n* Novell eDirectory\n\
  * Sun Directory Server\n\n你也可以找到多个开源的 `LDAP` 版本，包括 OpenLDAP 和 tinyldap。\n\n####\
  \ RADIUS\n*远程拨号用户服务*（RADIUS）协议是一种开源客户端/服务器网络协议——定义在 25 多个 IETF（互联网工程任务组）RFC（请求注释）中——提供了身份验证、授权和计费（AAA）服务。`RADIUS`\
  \ 是一种应用层协议，利用用户数据报协议（UDP）包进行传输。`UDP` 是一种无连接协议，这意味着它比其他传输协议快速。\n\n`RADIUS` 常用于网络提供商（NSP）网络，以及企业远程访问服务（RAS）和虚拟专用网络（VPN）。`RADIUS`\
  \ 在企业无线网络中日益流行。用户通过 `PAP` 或 `CHAP` 向 `RADIUS` 客户端提供用户名/密码信息。`RADIUS` 客户端加密密码并将用户名和加密后的密码发送到\
  \ `RADIUS` 服务器进行认证。\n\n**注意：** `RADIUS` 客户端与 `RADIUS` 服务器之间交换的密码是加密的，但工作站客户端与 `RADIUS`\
  \ 客户端之间的交换并不加密——例如在使用 `PAP` 认证时。如果工作站客户端恰好也是 `RADIUS` 客户端，则无论使用何种认证协议，所有的密码交换都是加密的。\n\
  \n#### RAS\n远程访问服务（`RAS`）服务器利用点点协议（`PPP`）来封装 IP 包并在串行和 ISDN 链路建立建立拨号连接。`PPP` 包含了以下身份验证协议：\n\
  * **PAP：** *密码认证协议*（`PAP`）在链路最初建立时使用双向握手将节点对服务器进行身份验证。`PAP` 以明文传输密码，无法防止重放攻击（即会话的一部分被捕获或记录，然后重放给系统）或暴力破解攻击。\n\
  \n\n\n\n![technicalstuff](img/technicalstuff.png) `two-way handshake`（双向握手）指的是通信设备会话，例如远程工作站和远程访问服务器。连接的建立是通过一个设备向另一个设备发送初始\
  \ `TCP SYN`（同步）数据包，另一个设备通过发送 `ACK`（确认）数据包进行响应，表示连接已被接受。\n\n*   **CHAP**: `挑战握手认证协议`（Challenge\
  \ Handshake Authentication Protocol，CHAP）在链路建立初期以及（可选的）会话期间定期，使用三路握手对客户端和服务器进行验证。CHAP\
  \ 要求客户端和服务器都预先配置一个以明文形式存储的共享密钥。客户端使用 `MD5` 单向哈希函数计算出对服务器挑战的响应。`MS-CHAP` 是微软对 CHAP\
  \ 的增强，它允许以加密形式存储共享密钥。\n*   **EAP**: `可扩展认证协议`（Extensible Authentication Protocol，EAP）通过实现各种认证机制为\
  \ PPP 认证增加了灵活性，包括 `MD5-challenge`、`S/Key`、通用令牌卡、数字证书等。许多无线网络都实现了 EAP。\n\n### TACACS\n\
  `终端访问控制器访问系统`（Terminal Access Controller Access Control System，TACACS）是一种远程认证控制协议，最初为\
  \ `MILNET`（美国军事网络）开发，提供 AAA 服务。原始 TACACS 协议经过了显著增强，出现了 `XTACACS`（不再使用）和 `TACACS+`（TACACS\
  \ 最常见的实现）。然而，`TACACS+` 是一个全新的协议，因此与 TACACS 或 `XTACACS` 都不后兼容。`TACACS+` 基于 TCP（端口\
  \ 49），支持几乎任何认证机制（`PAP`、`CHAP`、`MS-CHAP`、`EAP`、令牌卡、`Kerberos` 等）。`TACACS+` 的主要优势是对各种认证机制的广泛支持以及对授权参数的粒度控制。`TACACS+`\
  \ 还可以使用动态密码；`TACACS` 仅使用静态密码。\n\n原始 TACACS 协议经常被组织用于简化对防火墙和路由器等网络设备的管理访问。TACACS\
  \ 方便使用集集中管理的认证凭据，因此组织无需在每台设备上管理用户账户。\n\n### DIAMETER\n这种下一代 RADIUS 协议是为了克服 RADIUS\
  \ 的某些缺陷而开发的，但它尚未克服 RADIUS 的流行程度，因此尚未被广泛实施。\n\n与 RADIUS 类似，Diameter 提供 AAA 服务，并是在\
  \ 11 个现行 RFC 中定义的开放协议标准。\n\n与 RADIUS 不同，Diameter 利用传输控制协议（`TCP`）和流控制传输协议（`SCTP`）数据包来提供更可靠、面向连接的传输机制。此外，Diameter\
  \ 使用 IP 安全协议（`IPsec`）或传输层安全（`TLS`）分别提供网络安全或传输层安全——而不是使用 RADIUS 中使用的 `PAP` 或 `CHAP`——来提供更安全的连接。请参见第\
  \ 6 章 关于 `TCP` 和 `SCTP`、`IPsec` 和 `TLS` 以及 `OSI` 模型的完整讨论。\n\nDiameter 并不完全兼容 RADIUS，但它确实为基于\
  \ RADIUS 的环境提供了升级路径。Diameter 并不是缩写词，而是对 RADIUS 一术的双关（在几何学中，圆的直径是半径的两倍）。\n\n### SESAME\n\
  由欧洲计算机制造商协会（ECMA）开发的`多厂商环境下的欧洲安全系统与应用程序`（Secure European System and Applications\
  \ in a Multi-vendor Environment，SESAME）项目是一个类似于 Kerberos 的基于票据的系统，使用了对称和非对称加密来分发密钥并安全传输数据。通过使用公钥加密，SESAME\
  \ 可以在不同组织或安全域之间进行安全通信。它在每个主机上集成了一个受信任的认证服务器（称为特权属性服务器，或 `PAS`），采用 `MD5` 和 `CRC-32`\
  \ 单向哈希函数，并使用两个独立的证书（称为特权属性证书，或 `PACs`）来认证并定义访问权限。然而，SESAME 的基本实现也存在一些严重的安全漏洞，包括：\n\
  \n*   它使用 `XOR` 函数进行加密。\n*   它基于消息的一小部分而非整个消息进行认证。\n*   它的密钥生成并不真的很随机。\n*   它容易受到密码猜测攻击。（想打赌有人认为“open”是一个很聪明的密码吗？）\n\
  \n请参见第 5 章 更多关于单向哈希函数、`XOR` 函数和密钥生成的信息。\n\n### KryptoKnight\n由 IBM 开发的 `KryptoKnight`\
  \ 是另一个基于票据的 SSO 认证和密钥分发系统，它在密钥分布中心（`KDC`）与其主体之间建立点对点的关系。除了 SSO 用户认证外，KryptoKnight\
  \ 还提供双方认证、密钥分发和数据完整性服务。KryptoKnight 是一种极其紧凑且灵活的协议，可以很容易导出到其他系统和应用程序，并可以在 `OSI` 模型的任何层运行。与\
  \ Kerberos 不同，KryptoKnight 不需要时钟同步（它使用 `nonces` 代）。\n\n`nonce` 字面意思是“只使用一次的数字”。其概念与初始化向量（参见第\
  \ 5 章）相似，`nonce` 是一个随机生成的值（通常基于时间戳），只能用于认证会话一次。\n\n![remember](img/remember.png)\
  \ Kerberos、SESAME 和 KryptoKnight 是三种提供票据的认证技术的示例。\n\n![remember](img/remember.png)\
  \ LDAP、RAS（`PAP` 和 `CHAP`）、RADIUS、Diameter 和 TACACS 是远程访问集中控制的示例。\n\n### 云端访问控制\n\
  随着组织将基础设施和应用程序迁移到云服务提供商，组织也开始采用云端认证。\n\n用于云端访问管理的协议如 `SAML`、`RADIUS` 和 `TACACS`\
  \ 仍然在使用。云端访问的主要区别在于目录服务器位于云端——要么在组织的云端基础设施中，要么通过云端认证服务。\n\n### 分散式访问控制\n`分散式访问控制系统`将用户账户信息存储在不同的位置，由组织或企业内部相同或不同的管理员维护。这种系统在大型组织或需要对复杂的用户访问权限和关系进行细粒度控制的情况下是有意义的。\n\
  \n### 单因素/多因素认证\n\n\n\n\n`Authentication`（认证）是一个由识别和认证（I&A）组成的两步过程。`Identification`（识别）用户或系统（主体）向系统（对象）展示特定身份（如用户名）的手段。`Authentication`（认证）验证该身份的过程。例如，用户名/密码组合是一种常用的技术（尽管它很弱），它展示了身份识别（`username`）和认证（`password`）的概念。\n\
  \n认证基于以下任何一种因素：\n\n*   `你所知的`（Something you know），例如密码或个人识别码（`PIN`）：这一概念基于这样一个假设：只有账户所有者知道访问账户所需的秘密密码或\
  \ `PIN`。`Username` 和密码的组合是目前实施的最简单、成本最低、因此最常见的认证机制。当然，密码经常被共享、盗窃、猜测或以其他方式泄露——因此，它们也是最弱的认证机制之一。\n\
  *   `你所拥有的`（Something you have），例如智能卡、安全令牌或智能手机：这一概念基于这样一个假设：只有账户所有者拥有解锁账户所需的密钥。智能卡、`USB`令牌、智能手机和钥匙圈正变得越来越常见，特别是在安全性较高的组织中，例如政府或金融机构。许多像\
  \ `LinkedIn` 和 `Twitter` 这样的在线应用也实现了多因素认证。虽然智能卡和令牌比其他工具贵一些，但它们的实施和使用（通常）并不贵得令人负担，也不过于复杂。可以接收短信或运行\
  \ `Google Authenticator` 或 `Microsoft Authenticator` 等应用的智能手机因其成本较低而越来越受欢迎。无论选择何种方法，所有形式的多因素认证都能提升安全性。当然，令牌、智能卡和智能手机有时会丢失、被盗窃或损坏。由于与短信相关的风险（如手机诈骗），美国国家标准与技术研究院（`NIST`）已废弃了使用短信进行多因素认证。\n\
  *   `你所特征的`（Something you are），例如指纹、声音、视网膜或虹膜：这一概念基于这样一个假设：附在你身体上的脸、手指或眼睛确实属于你，并能唯一识别你的身份（当然，手指和眼睛可能会丢失，甚至糟）。实际上，这种认证机制的主要缺点是接受度——人们有时对使用这些系统感到不安。某些生物识别系统（如指纹和人脸识别）并不能免疫伪造攻击。基于软件的生物识别系统（如人脸识别）通常廉便宜，但基于硬件的生物识别系统部署成本更高。\n\
  \n认证基于你 `know` 的东西、`have` 的东西或 `are` 的东西。\n\n我们在下文中讨论的各种识别和认证（I&A）技术包括密码/短语和 `PINs`（基于知识的）；生物识别和行为（基于特征的）；以及一次性密码、令牌和单登录（`SSO`）。\n\
  \n识别组件通常是一个基于用户名的简单机制，在系统或进程的情况下，基于计算机名称、媒体访问控制（`MAC`）地址、网协议（`IP`）地址或进程 ID（`PID`）。识别要求仅包括能够唯一识别用户（或系统/进程），而不应识别用户在组织中的角色或重要性（如会计人员或\
  \ `CEO`）。不应允许常见的、共享的组账户，例如 `root`、`admin` 或 `system`。此类账户无法提供安全性，是恶意实体的首要目标。\n\n\
  识别是声称特定身份的行为。认证是验证该身份的行为。\n\n### 单因素认证\n\n单因素认证对于上述讨论的三个因素（`know` 的东西、`have` 的东西或\
  \ `are` 的东西）只需要其中一种。常见的单因素认证机制包括密码和短语、一次性密码和个人识别码（`PINs`）。\n\n### 密码和短语\n\n“密码应该像刷子。每天使用它；定期更换它；千万不要和朋友分享。”——USENET\n\
  \n密码无疑是目前使用的最常见——也最弱的凭据。尽管已经有了更先进、更安全的认证技术（包括令牌和生物识别），但组织通常将这些技术作为传统用户名和密码的补充或结合使用，而不是替代。\n\
  \n`passphrase`（短语）是密码的变体；它使用一组字符或单词而不是单个密码。通常，攻击者破解短语比普通密码更困难，因为长短语通常比短而复杂的密码更难破解。短语还有以下优势：\n\
  \n*   用户经常使用相同的密码访问多个账户；例如他们的公司网络、家庭 PC、他们的 `Gmail` 或 `Yahoo!` 邮箱账户、`eBay` 账户和 `Amazon.com`\
  \ 账户。因此，针对特定用户的攻击者可能通过攻击安全性较低的系统（如其家庭 PC）或通过破坏某个互联网账户（因为用户方便地将密码存储在那个安全堡垒中——`Internet\
  \ Explorer`！）来获取其工作账户。互联网网站和家庭 PC 通常不使用短语，因此你增加了用户必须使用不同密码/短语访问其工作账户的机会。\n*   实际上，用户记忆和输入短语比他们记忆和输入一个短得多、晦涩且且在键盘上需要手指灵活杂技才能输入的密码要容易得多。\n\
  \n然而，短语也有缺点：\n\n*   用户可能觉得短语不方便，所以你可能会发现短语很难实施（你的意思是我现在需要一个 20 位的密码吗？！\n*   并非所有系统都支持短语。此类系统会忽略超过系统限制（例如八个字符）的内容。\n\
  *   许多命令行界面和工具不支持分隔短语中单词的空格字符。\n*   最终，短语仍然只是密码（尽管是一个长得多更好的密码），因此存在一些与密码相关的相同问题。\n\
  \n作为 CISSP 候选人，你应该理解与密码相关的通用问题，以及常见的密码控制和管理功能。密码/短语的问题包括它们是：\n\n*   **不安全：** 密码由于几个原因通常是不安全的，原因包括：\n\
  \    *   **人性：** 在用户生成密码的情况下，用户通常会选择他们容易记住的密码，因此攻击者也容易猜到这些密码（如配偶或宠物的名字、生日、纪念日或爱好）。用户还可能倾向于写下密码（特别是复杂的、系统生成的密码）或与他人分享密码。\n\
  \n\n\n\n\n## 密码漏洞与风险\n\n*   **传输与存储：** 许多应用程序和协议（如文件传输协议 [FTP] 和密码验证协议 [PAP]）以明文传输密码。这些应用程序和协议还可能将密码存储在明文文件中，或使用弱哈希算法的安全数据库中。\n\
  *   **易被破解：** 密码容易受到如 John the Ripper 和 L0phtCrack（读作 *loft-crack*）等随手可获得的程序的暴力破解和字典攻击（我们将在本章稍后的“攻击方法”节中讨论）。\n\
  *   **易被盗取：** 从钓鱼诈骗到水坑攻击和键盘记录器，用户可能被骗出密码，而恶意软件可以在用户输入时窃取它们。某些组织以不加密的形式存储用户密码、未加盐进行哈希处理，或使用易发现的密钥进行加密；这些任何方法都会让入侵者相对容易地从保护不当的系统中获取密码。\n\
  *   **不便：** 容易烦躁的用户会觉得输入密码很乏味。为了绕过这些控制，用户可能会选择易于输入的弱密码；他们可能会自动化登录（例如使用键盘宏，或在浏览器中勾选“记住我的密码”复框）；并且在离开座位时忘记锁定工作站或注销。\n\
  *   **可否认：** 仅凭密码认证的事务并不一定提供用户身份的绝对证明。身份验证机制必须保证不可否认性，这是问责制的关键组成部分。（关于不可否认性的更多信息，请参见本章早前的“问责制”节。）\n\
  \n## 登录控制与管理功能\n\n密码具有以下登录控制和管理功能，您根据组织的安全策略和安全最佳实践进行配置：\n\n*   **长度：** 通常情况下，越长越好。密码本质上是一个加密密钥。就像较大的加密密钥（如\
  \ 1024 位或 2048 位）更难破解一样，长密码也是。您应该配置系统要求密码最小长度为十到十五字符。当然，用户可能会很容易忘记长密码，或简单地认为它们太不方便，导致了本节之前讨论的一些人性问题。\n\
  *   **复杂性：** 强密码包含大写字母和小写字母、数字以及特殊字符（如 `#` 和 `$`）。注意，某些系统可能不接受某些特殊字符，或者这些字符可能会执行特殊功能（例如在终端仿真软件中）。\n\
  *   **过期（或最大密码有效期）：** 您应该设置最大密码有效期，以要求定期更改密码：30 天、60 天或 90 天是常见的周期。\n*   **最小密码有效期：**\
  \ 这防止用户过于频繁地更改密码。建议设置为一到十天，以防止用户轻易绕过密码历史控制（例如，在几分钟内更改五次密码，然后改回原始密码）。\n*   **重用：**\
  \ 密码重用设置（五到十次很常见）允许系统记住特定账户之前使用过的密码（或更准确地说，是它们的哈希值）。此安全设置防止用户在要求更改密码时通过在两个或三个熟悉的密码之间交替来绕过最大密码有效期。\n\
  *   **限制尝试次数：** 该控制限制了失败登录尝试的次数，由两个部分组成：计数器阈值（例如三次或五次）和计数器重置（例如 5 或 30 分钟）。`counter\
  \ threshold` 是发生某些操作（如自动禁用账户）之前允许的连续失败尝试的最大次数。`counter reset` 是两次失败尝试之间的时间。例如，在\
  \ 30 分钟内进行三次失败的登录尝试可能会导致账户被锁定一段时间（例如 24 小时）；但在 25 分钟内进行两次失败尝试，然后在 10 分钟后又进行第三次失败尝试，则不会导致账户锁定。成功的登录尝试也会重置计数器。\n\
  *   **锁定时长（或入侵者锁定）：** 当用户超过我们在前述项目中描述的计数器阈值时，账户将被锁定。组织通常将锁定时长设置为 30 分钟，但您可以将其设置为任何时长。如果您将时长设置为永久，则必须由管理员解锁账户。某些系统在锁定账户时不会通知用户，而是静静地提醒系统管理员可能存在入侵尝试。当然，攻击者可以使用锁定时长作为执行\
  \ `拒绝服务攻击` 的简单手段（通过故意反复多次失败登录尝试来保持用户账户处于锁定状态）。\n*   **限制时段：** 该控制限制了用户可以登录的时间段。例如，您可以通过限制用户仅在工作时间内访问来有效缩短攻击者入侵系统的时间。然而，在工作狂和全球经济的现代社会，这种控制正变得越来越常见，因为这两者都要求用户在全天任何时候合法地工作。\n\
  *   **系统消息：** 系统消息包括以下内容：\n    *   **登录横幅：** 欢迎消息字面上是在邀请犯罪分子访问您的系统。请禁用任何“欢迎”消息，并将其替换为法律警告，要求用户点击\
  \ OK 以确认警告并接受法律使用条款。\n    *   **最后用户名：** 许多流行的操作系统会显示上次成功登录账户的用户名。用户（只需要输入密码）发现此功能很方便——攻击者也是如此（他们只需要破解密码，而无需担心与有效用户账户匹配）。请禁用此功能。\n\
  \    *   **上次成功登录时间：** 在成功登录系统后，此消息会告诉用户上次登录的时间。如果系统显示某用户上次成功登录是周六凌晨 2:00，而用户知道自己不可能在那个时间登录（因为他还要生活），那么他就知道账户已被攻破，并可以据此报告事件。\n\
  \    *   **上次成功登录位置：** 在成功登录系统后，此消息告诉用户上次登录时使用的最后一个地理位置。如果系统报告用户上次是从某个模糊、遥远的国家登录的，这可能是用户账户已被攻破的线索。\n\
  \n## 安全密码指南\n\n我们相信您已经知道许多广为人且广知的创建更安全密码的指南，但以防万一，这里有一份回顾：\n\n*   混合使用大写字母、小写字母、数字和特殊字符（例如\
  \ `!@#$%`）。\n*   不要包含您的姓名或其他个人信息（如配偶、街道地址、学校、生日和纪念日）。\n*   将某些字母替换为数字（例如将 `e` 替换为\
  \ `3`）。这种修改拼写的技术被称为 leet 或 leetspeak。\n*   使用无意义的短语、拼写错误、替换或前后的单词和短语（结合两个不相关的单词或短语，例如“幸运轮饼干”）。\n\
  *   使用特殊字符组合多个单词（例如 `sALT&pEPPER` 或 `W3’re-n0t-in-K4ns4s-4nym0r3`）。\n*   创建一个实际上是密码短语的更长密码。例如，“我喜欢绿色香蕉”。\n\
  \n\n\n\n\n*   结合此列表中的所有其他技巧（例如，将“白雪与高效人士的七个习惯”变为 `SW&t7HoH3P!`）。\n*   不要在更改之间使用重复模式（例如，`password1`、`password2`、`password3`）。\n\
  *   不要对工作账户和个人账户使用相同的密码。\n*   不要使用过于难以记忆的密码。\n*   不要使用你在任何出版物（包括此本书）中看到的任何密码。（但你很清楚这一点。）\n\
  \n这些准则的问题在于，它们是`广为人知且众所周知的`！事实上，攻击者也使用这些准则来创建他们的别名或句柄：例如 `super-geek` 变为 `5up3rg33k`。此外，像\
  \ `Qwerty12!` 这样的密码在技术上符合这些准则，但它并不是一个好密码，因为它是一个相对简单且显而易见的模式（键盘的第一行）。许多字典攻击不仅包含词汇列表，还包含此类模式。\n\
  \n![tip](img/tip.png) 你可以使用软件工具来帮助用户在创建密码时评估其质量。这些工具通常被称为`密码/口令生成器`或`密码评估器`。\n\n\
  ### 临时密码 (ONE-TIME PASSWORDS)\n\n`一次性密码`是仅对单个登录会话有效的密码。在单次登录后，该密码不再有效。因此，如果攻击者获得了某人已使用的一次性密码，该密码将没有任何价值。一次性密码是一种`动态密码`，意味着它会在某些定期间隔或事件后发生变化。相反，`静态密码`是每次登录时保持不变的密码。类似于密码学中的一次性口令的概念（我们在`第\
  \ 5 章`）中讨论过这一点），一次性密码为访问控制提供了最大的安全性。\n\n安全专业人员应该确保区分一次性密码与短期内有效的密码。通常，被认为是一次性密码的实际上是有效期为几分钟的密码。限时密码在安全性方面是一个很大的改进，但如果攻击者行动迅速，它们可能会受到重放攻击。\n\
  \n### 个人识别码 (PINs)\n\n`PIN` 本身是一种较弱的身份验证机制，因为四位数字 `PIN` 只有 10,000 种可能的组合。因此，组织通常会将\
  \ `PIN` 与其他保护措施结合。例如，与一次性令牌密码和账户锁定策略配合使用的 `PIN` 非常有效，它允许用户每分钟仅尝试一次 `PIN/password`\
  \ 组合，并在根据安全策略在失败三次或五次后锁定账户。\n\n![remember](img/remember.png) 一次性密码实现的两个示例是令牌（我们将在接下来的章节中讨论）和\
  \ `S/Key 协议`。`S/Key 协议`由贝尔电话技术研究公司开发，并在互联网工程任务组 (IETF) 的意见请求（`RFC 1760`）中定义，它是基于客户端/服务器的，并使用\
  \ `MD4` 和 `MD5` 来生成一次性密码。`MD4` 和 `MD5` 是通过从数据输入创建 128 位的消息摘要来验证数据完整性的算法。\n\n###\
  \ 多因素身份验证\n\n多因素身份验证涉及`你所知道的`、`你所拥有的`以及`你所特征的`这两种或多个因素。对于攻击者来说，多因素身份验证更具挑战性，因为成功攻击多因素身份验证需要攻击者拥有用户的令牌或具有欺骗生物识别读取器的能力。本节讨论了多因素身份验证的类型，包括令牌、证书和生物识别。\n\
  \n### 令牌 (TOKENS)\n\n`令牌`是访问控制设备，例如钥匙扣、加密狗、智能卡、磁卡、软件（称为`软令牌`并安装在平板电脑、移动设备、智能手机、笔记本电脑或\
  \ PC 上）以及存储静态密码（或数字证书）或生成动态密码的键盘或计算器类型卡。令牌的三种类型类型：\n\n*   **静态密码令牌：** 存储静态密码或数字证书。\n\
  *   **同步动态密码令牌：** 在固定时间间隔（例如 60 秒）或响应事件（例如每次按下按钮）连续生成新密码或口令。通常，口令仅在固定时间窗口内（例如一分钟）有效，且仅用于单次登录（因此，如果你想登录多个系统，必须等待下一个口令）。\n\
  *   **异步（或挑战-响应）动态密码令牌：** 通过计算对所有者手动输入的系统生成的随机挑战字符串（称为 `nonce`）的正确响应，异步地生成新密码或口令。\n\
  \n令牌通过要求所有者先对令牌进行身份验证，或要求所有者在生成密码的同时输入秘密 `PIN` 来提供双因素身份验证（你拥有的和你知道）。`RADIUS` 和终端访问控制器访问系统\
  \ (`TACACS+`；我们在本章前面的“集中式访问控制”部分讨论过）都支持各种令牌产品。\n\n![warning](img/warning.png) 安装在笔记本电脑或\
  \ PC 软令牌并不提供强力的（双因素）身份验证，因为“你拥有的东西”是你尝试登录的那台电脑！然而，智能手机上的 `Google Authenticator`\
  \ 和 `Microsoft Authenticator` 等软令牌可以提供足够的双因素身份验证，前提是用户不是尝试从手机上登录应用程序。\n\n你可以使用令牌生成一次性密码并提供双因素身份验证。\n\
  \n### 智能手机 / 短信密码\n\n当用户尝试登录系统时，可以通过短信或其他消息机制向智能手机或移动设备发送一次性或短持续密码。用户接收到此密码后，将其输入到系统的密码字段中并完成登录程序。\n\
  \n### 数字证书\n\n数字证书可以安装在用户的设备上。当用户尝试对系统进行验证时，系统将查询用户的设备数字证书以确认用户身份。如果可以获取数字证书并确认其为真实，则允许用户登录。\n\
  \n数字证书身份验证还有助于强制用户仅使用公司提供的设备登录。这假设了一个事实：用户无法将数字证书复制到另一个（可能是个人拥有的）设备，或者入侵者无法将证书复制到自己的设备上。\n\
  \n![warning](img/warning.png) 在笔记本电脑等设备上实施数字证书时，管理员需要确保在每台笔记本电脑上实施每个设备或每个用户唯一的证书，而不是通用的公司证书。\n\
  \n### 生物识别 (BIOMETRICS)\n\n识别个人的唯一绝对方法是基于该个人独特的物理或行为特征进行身份验证。生物识别利用物理特征，包括指纹、手部形状以及虹膜和虹膜模式等面部特征。行为生物识别基于从动作衍出的测量和数据，它们间接测量人体特征。行为特征包括声音、签名和击键模式。\n\
  \n生物识别基于身份验证的第三种因素——你的特征。生物识别访问控制系统根据用途以略不同的方式应用识别和验证 (I&A)的概念：\n\n\n\n\n\n- **物理访问控制：**\
  \ 个人提供所需的生物识别特征，系统尝试通过将输入特征与其授权人员数据库进行匹配，来`识别`该个人。这种控制类型也称为`一对多`（one-to-many）搜索。\n\
  - **逻辑访问控制：** 用户输入用户名或`PIN`（或插入智能卡），然后提供所需的生物识别特征进行验证。系统通过匹配声称的身份与该账户存储的生物识别图像文件，尝试对用户进行`认证`这种控制类型也称为`一对一`（one-to-one）搜索。\n\
  \n![warning](img/warning.png) 生物识别认证本身并不提供`强`身份认证，因为它只基于三种认证要求中的之一——你所`是`的（are）。要被认为是一种真正的强身份认证机制，生物识别必须包含你所`知道`的（know）或你所`拥有`的（have）（尽管你可能认为手或眼睛既是你所拥有的，也是你所是的，但就\
  \ CISSP 考试而言，你是错误的！）\n\n### 有效生物识别访问控制系统的必要因素包括：\n\n- **准确性：** 任何生物识别系统最重要的特征。系统测量以保证正向识别的身体器官或特征的`唯一性`是准确性的一个重要要素。在今天常用的生物识别系统中，只有满足此要求的器官是手指/手和眼睛。\n\
  \n  准确性的另一个重要要素是系统检测并拒绝伪造或仿真输入数据的能力。生物识别系统的准确性通常以百分比形式表述如下：\n\n  - **误拒率 (FRR) 或\
  \ I 类错误：** 系统错误拒绝授权用户访问，以百分比表示。降低系统的灵敏度会降低`FRR`，但会增加误接受率 (FAR)。\n\n    ![remember](img/remember.png)\
  \ 误拒率（或`I 类错误`）是系统错误拒绝授权用户访问的比例。\n\n  - **误接受率 (FAR) 或 II 类错误：** 系统错误授予未授权用户访问，以百分比表示。增加系统的灵敏度会降低`FAR`，但会增加\
  \ `FRR`。\n\n    ![remember](img/remember.png) 误接受率（或`II 类错误`）是系统错误授予未授权用户访问的比例。\n\
  \n  - **交叉错误率 (CER)：** `FRR` 等 `FAR` 的点，以百分比表示。（参见图 7-8。）由于你可以通过更改系统的灵敏度来调整 `FAR`\
  \ 和 `FRR`，因此 `CER` 被认为是生物识别系统准确性最重要的指标。\n\n    ![remember](img/remember.png) 交叉错误率是\
  \ `FRR` 等 `FAR` 的点，以百分比表示。\n\n- **速度和吞吐量：** 完成整个认证程序所需的时间。这一时间测量包括走向系统、输入卡片或`PIN`（如果需要）、输入生物识别数据（例如将手指或手放入读取器中、按下传感器、将眼睛与摄像头或扫描仪对齐、说一段短语或签名）、处理输入数据以及打开和关闭访问门（对于物理访问控制系统而言）。另一个重要指标是为用户账户创建生物识别文件所需的初始注册时间。通常接受的标准是速度小于五秒，吞吐量为每分钟六到十人，注册时间小于两分钟。\n\
  \n- **数据存储需求：** 生物识别系统输入文件的大小可以小至 9 字节，大至 10,000 字节，正常范围为 256 到 1,000 字节。\n\n- **可靠性：**\
  \ 可靠性是任何系统中的重要因素。系统必须连续、准确地运行，没有频繁的维护中断。\n\n- **可接受性：** 让用户接受生物识别系统是广泛实施的最大障碍。在组织使用这些系统收集员工的医疗或其他物理数据的前景下，会出现某些隐私和伦理问题。其他可能引起用户警觉的因素还包括数据收集程序的侵入性，以及与常见系统组件的物理接触，例如将眼睛贴在塑料杯上或为了语音识别将嘴唇靠近麦克风。\n\
  \n![image](img/9781119505815-fg0708.png)\n\n图 7-8： 使用 CER 比较 FAR 和 FRR。\n\n![remember](img/remember.png)\
  \ 获取用户的接受是生物识别系统最常见的困难。\n\n表 7-1 总结了上述列表描述因素的通常接受的标准。\n\n| **特征** | **标准** |\n|\
  \ --- | --- |\n| 准确性 | CER < 10% |\n| 速度 | 5 秒 |\n| 吞吐量 | 每分钟 6–10 人 |\n| 注册时间 |\
  \ < 2 分钟 |\n\n表 7-1 生物识别系统通用标准\n\n### 物理生物识别访问控制系统包括：\n\n- **指纹识别和指纹扫描系统：** 今天最常用的生物识别系统。它们分析指纹的脊线、纹和细节（分叉和脊线末端、点、岛屿、池塘和湖泊、突起、桥和交叉点），创建一个唯一标识指纹所有者的数字化图像。`指纹识别`系统将整个指纹存储为数字化图像。这种系统的缺点是它可能需要大量的存储空间和资源。更常见的是组织使用`指纹扫描系统`，它只存储指纹的样本点或特征特征，因此需要的存储和处理资源较少。此外，用户可能更容易接受这项技术，因为没有人能根据指纹扫描系统中的数据重建整个指纹。请参见表\
  \ 7-2 了解指纹扫描系统的通用特征。\n\n  ![remember](img/remember.png) 指纹扫描系统与指纹识别系统不同，它们不存储整个指纹图像——仅描述独特特征的数字化文件。这一事实应该消除大多数用户的隐私担忧。\n\
  \n- **面部识别系统：** 面部识别迅速成为苹果、微软等公司常用的认证方法，通过识别用户面部的独特几何结构来工作。面部识别软件在用户看向设备摄像头时检查面部，并判断摄像头的人是否是授权使用该设备的同一个人。\n\
  \n- **手形几何系统：** 与指纹扫描系统一样，`手形几何系统`是非入侵式的，因此通常比其他生物识别系统更容易接受。这些系统通常比指纹扫描系统更准确地唯一识别个人，与其他生物识别系统类型相比，它们的文件尺寸最小。数字相机同时捕捉手部的垂直和水平图像，获取三维手形几何数据。数字化图像记录了手的长度、宽度、高度以及手指的其他独特特征。请参见表\
  \ 7-2 了解手形几何系统的通用特征。\n\n\n\n\n\n- **视网膜模式：** 这些系统记录视网膜血管图案中的独特元素。这类系统主要的担忧是担心激光指向眼睛会导致眼部损伤（实际上这只是一台带有聚焦低强度强光的摄像头），以及更现实的隐私考量。某些健康状况（如糖尿病和心脏病）可能会导致视网膜模式发生变化，这些系统可能会检测到这些变化。有关视网膜模式系统的通用特征，请参见表\
  \ 7-3。\n\n- **虹膜模式：** 迄为止是所有生物识别系统中准确率最高的。`iris` 是眼睛中围绕瞳孔的彩色部分。虹膜复杂的图案包括独特的特征，如冠状、、丝状、斑点、凹坑、径向沟、裂缝和条纹。虹膜特征在出生前不久形成，并在整个生命期间保持稳定。虹膜是非常独特的，以至于即使同一个人的双只眼睛其图案也不同。指向光孔镜的相机会扫描虹膜模式。受试者必须在距离约\
  \ 3 到 10 英寸远的地方看向镜子。在技术上，从几英尺外进行虹膜扫描是可行的——但可能极其昂贵。有关虹膜模式系统的通用特征，请参见表 7-3。\n\n| **特征**\
  \ | **指纹扫描** | **手几何结构** |\n| --- | --- | --- |\n| 准确率 | < 1%–5% (CER) | < 1%–2%\
  \ (CER) |\n| 速度 | 1–7 秒 | 3–5 秒 |\n| 文件大小 | ~250–1500 字节 | ~10 字节 |\n| 优点 | 非侵入性、廉价\
  \ | 文件小 |\n| 缺点 | 传感器磨损；准确率可能受肿胀、受伤或佩戴戒指的影响 | 传感器磨损；准确率可能受肿胀、受伤或佩戴戒指的影响 |\n\n表 7-2\
  \ 指纹扫描与手几何结构系统的通用特征\n\n| **特征** | **视网膜模式** | **虹膜模式** |\n| --- | --- | --- |\n\
  | 准确率 | 1.5% (CER) | < 0.5% (CER) |\n| 速度 | 4–7 秒 | 2.5–4 秒 |\n| 文件大小 | ~96 字节 |\
  \ ~256–512 字节 |\n| 优点 | 整体准确率高 | 最佳整体准确率 |\n| 缺点 | 侵入感强；卫生和隐私问题 | 受试者必须保持绝对不动；受试者不能佩戴彩色隐形眼镜（透明的通常可以）\
  \ |\n\n表 7-3 视网膜与虹膜模式系统的通用特征\n\n常见的行为生物识别系统包括：\n\n- **语音识别：** 这些系统捕捉受试者声音的独特特征，并可能分析语音或语言模式。大多数语音识别系统依赖文本，要求受试者重复特定的短语。语音识别系统的这种功能性要求通过提供双因素身份验证来帮助提高安全性：你所知的（一个短语）和你你的特征（你的声音）。更先进的语音识别系统可能会给出随机短语或一组单词，以防止攻击者录制语音验证会话并在以后重放录音以获得未经的访问。有关语音识别系统的通用特征，请参见表\
  \ 7-4。\n\n- **签名动力学：** 这些系统通常要求受试者在签名板上签自己的名字。签名动力学系统的注册过程会捕捉许多特征，包括签名本身、施加在签名板上的压力以及签名的速度。当然，签名通常会因为不同因素表现出细微的变化，并且可以被伪造（尽管签名动力学很难伪造）。有关签名动力学系统的通用特征，请参见表\
  \ 7-4。\n\n- **击键或打字动力学：** 这些系统通常要求受试者输入密码或短语。击键动态识别基于独特的特征，例如用户按住键盘上某个按键的时间（按留时间）以及用户到达并按下按键所需（寻迹或飞行时间）。系统通过测量这些特征来形成一组代表用户独特打字模式或签名的数学数据，然后用于验证用户。\n\
  \n| **特征** | **语音识别** | **签名动力学** |\n| --- | --- | --- |\n| 准确率 | < 10% (CER) |\
  \ 1% (CER) |\n| 速度 | 10–14 秒 | 5–10 秒 |\n| 文件大小 | ~1,000–10,000 字节 | ~1,000–1,500\
  \ 字节 |\n| 优点 | 廉价；非侵入性 | 非侵入性 |\n| 缺点 | 准确率、速度、文件大小；受背景噪音、声音变化的影响；可能被模仿欺骗 | 签名板磨损；速度；可能被伪造签名欺骗\
  \ |\n\n表 7-4 语音识别与签名动力学系统的通用特征\n\n![warning](img/warning.png) 数字签名与`electronic signatures`（即人们签名的电子副本）是不相同的。\n\
  \n![tip](img/tip.png) 一般而言，CISSP 候选人不需要了解生物识别系统的特定规格，但应该了解它们如何相互比较。例如，知道虹膜系统比视网膜系统准确，并熟悉误拒率、误识率和交叉错误率。\n\
  \n### 问责制\n\n`accountability`的概念是指系统将用户和过程与其行为（他们所做的）关联起来的能力。审计日志是问责制的组成部分。\n\n\
  系统使用审计日志主要用于排查故障和验证事件。用户不应将审计日志视为威胁或“老大哥”监视。事实上，精明的用户认为这些机制具有保护性，因为它们不仅能证明他们做了什么，还能证明他们没有做什么。尽管如此，用户明智注意他们使用的系统正在记录他们的行为。\n\
  \n与问责制密切相关的重要安全概念是非可否认性。`Non-repudiation`意味着用户无法否认某项行为，因为你可以将其与其正关联。不可否认性是一个重要的法律概念。如果系统允许用户使用通用账户、密码为人知的用户账户或完全不使用用户账户登录，那么你就无法绝对将任何用户与特定的（恶意）行为或（未经授权的）访问关联起来，这使得对该用户进行起诉或其他惩处变得极其困难。\n\
  \n![remember](img/remember.png) AAA（认证、授权和审计）服务中的审计记录了主体做了什么。\n\n![remember](img/remember.png)\
  \ 不可否认性意味着用户无法否认某项行为，因为你可以不可置疑地将其与其行为关联起来。\n\n### 会话管理\n\n`session` 是一个正式术语，指的是单个用户与信息系统的对话或一系列交互。信息系统需要跟踪单个用户的会话，以便正确区分不同用户的操作。\n\
  \n为了保护通过会话访问数据的机密性和完整性，信息系统通常使用会话或活动超时，防止未经授权的用户继续使用空闲或非活跃状态的会话。\n\n\n\n\n\n主要有两种会话超时机制：\n\
  \n*   **屏幕保护程序。** 屏幕保护程序由操作系统实现，它会锁定工作站或移动设备本身，并在一段空闲后要求用户重新登录系统。工作站或移动设备的屏幕保护程序保护所有应用程序会话。请确保这确实锁定了屏幕或设备，因为某些系统可以配置为解锁时不需要\
  \ PIN 码或密码。\n*   **空闲超时。** 如果用户在特定时间内没有活动，单个软件应用程序可以使用自动锁定或自动注销功能。\n\n例如，如果已授权的用户离开了未锁定的计算机终端或工作站上的浏览器窗口且无人看管，未经授权的用户可以直接坐在工作站前并继续该会话。\n\
  \n![tip](img/tip.png) 工作站空闲超时最初被称为“屏幕保护”，是为了防止静态图像在阴极射线管 (CRT) 显示器上烧屏。虽然现在的显示器不再需要这种保护，但“屏幕保护程序”一词仍然在使用。\n\
  \n### 身份注册与身份核实\n\n正式的用户注册流程对于安全的账户配置至关重要，特别是在大型组织中，认识所有员工是不现实或不可行的。这在 SSO、联邦身份和\
  \ PKI 环境中尤为关键（参见第 5 章），在这些环境中用户将访问多个系统和应用程序。\n\n身份证明通常始于入职时，此时新员工通常需要提供政府颁发的身份证和合法工作权利证明。这些程序应作为信息系统初始用户注册的基础。\n\
  \n组织在注册和配置用户时需要采取若干预防措施：\n\n*   **用户身份。** 组织必须确保为正确的用户配置并分发新用户账户。\n*   **隐私保护。**\
  \ 组织不应使用社会安全号码、出生日期或其他敏感隐私信息来验证用户。相反，应该使用其他值，例如员工编号（或其他无法通过其他员工获取的值）。\n*   **临时凭据。**\
  \ 组织必须确保将临时登录凭据分配给正确的人。其他人不应能轻易猜测临时凭据。最后，临时凭据应设置为在短时间内过期。\n*   **原生访问权限。** 组织应该根据“按需知晓”和“最小权限”原则，定期审查授予新员工的原生访问权限。\n\
  \n当用户尝试登录系统时，会产生关于用户身份的额外考虑因素。这些包括：\n\n*   **地理位置。** 这可以从用户的 IP 地址得出。这并非绝对可靠，但有助于确定用户的位置。许多设备（特别是手机和平板电脑）利用\
  \ GPS 技术获取位置信息，这通常比 IP 地址更可靠。\n*   **正在使用的工作站。** 组织可能有关于是否允许用户使用个人所有设备或公共自助机工作站登录的策略。\n\
  *   **自上次登录以来经过的时间。** 用户上次登录系统或应用程序已经多久了。\n*   **失败尝试后的登录尝试。** 最近是否有过未成功的登录尝试。\n\
  \n根据上述条件，系统可以配置为向用户提出额外的挑战。这些挑战确保尝试登录的人确实是授权用户，而不是其他人或机器。这被称为基于风险的身份验证。\n\n### 联邦身份管理\n\
  \n*联邦身份管理* (FIM) 允许多个组织使用彼此的用户识别和认证系统来访问它们的网络和系统。身份联邦 (FIdM) 包含了用于在跨独立管理的组织之间促进身份移植性的的标准、技术和工具。\n\
  \nFIdM 允许那些希望方便用户更易访问其系统而无需创建自定义解决方案的组织。相反，他们只需要配置现有工具，并偶尔添加“连接器”以促进跨组织的身份管理。\n\n\
  联邦环境中环境中使用的技术包括：\n\n*   单点登录 (SSO)\n*   安全断言标记语言 (SAML)\n*   OAuth\n*   OpenID\n\
  \n### 凭据管理系统\n\n*凭据管理系统*允许组织集中组织和控制用户的用户 ID 和密码。这不应与用于存储和管理用户专业凭据（如 CISSP 认证）的系统混淆。\n\
  \n凭据管理系统作为商业软件产品提供，可以部署在本地或云端。\n\n凭据管理系统为主体创建用户账户，并根据需要将这些凭据配置到单个系统和集中身份管理系统（如 `LDAP`\
  \ 或 `Microsoft Active Directory`）。凭据管理系统可以是独立的应用程序（如前所述），也可以是身份访问管理系统的不可组成部分。\n\n\
  ## 集成身份即服务 (Identity-as-a-Service)\n\n大多数组织都有各种应用程序，其中一些运行在本地，另一些在云端。为了避免用户必须管理多套用户凭据的问题，许多组织已经实现了某种形式的云端身份管理服务。这对组织的益处有两方面：\n\
  \n*   **提高便利性。** 用户访问业务系统时只有更少的（最少一套）登录凭据。\n*   **降低风险。** 用户倾向于使用更强的密码，并且不太以不安全的方式处理凭据（例如在显示器上使用便利贴）。许多组织采用多因素身份验证，进一步降低了风险。\n\
  \n组织实施集中身份访问管理系统的方式取决于几个因素，包括：\n\n*   **集成工作。** 新应用程序具有一个或多个接口，方便自动账户配置和单点登录。旧应用程序通常缺少这些接口。\n\
  *   **可用资源。** 即使对于易于集成的应用程序，仍需要投入精力执行并维护集成。\n*   **效率容忍度。** 如果组织对低效率缺乏忍度（例如用户每天必须多次登录业务应用程序），他们可能更容易追求\
  \ IAM 解决方案。\n*   **风险容忍度。** 如果组织厌恶用户拥有关键业务系统拥有多套登录凭据的风险，它将更可能实施 IAM 解决方案。\n\n由于大多数组织的新业务系统都是云端的，许多组织正在选择实施云端身份管理和/或单点登录系统。虽然每个\
  \ IAM 都有其独特的功能和架构，但通常 IAM 系统将类似于图 7-9 所示的架构。\n\n![image](img/9781119505815-fg0709.png)\n\
  \n图 7-9： 典型的身份访问管理系统架构。\n\n## 集成第三方身份服务\n\n\n\n\n拥有本地系统的组织通常会购买并将身份管理工具集成到其环境中，以减轻身份管理的负担并提高终端用户体验。在运行微软服务器的环境中，组织可以将其系统和应用程序与\
  \ `Active Directory` 集成，该工具包含在微软服务器操作系统中。在没有微软服务器的组织中，使用 `LDAP`（轻量级目录访问协议）的开源工具是首选。此外还有几种商业化的本地身份服务产品，可以安装并与系统、设备和软件应用程序进行集成。\n\
  \n本地身份管理工具通常具有与其云端对应产品相同的功能。这些工具中的某些既可以部署在本地，也可以部署在云端，少数工具还提供了让云端和本地协同工作作为单一身份访问解决方案的方案。\n\
  \n## 实现和管理授权机制\n\n授权机制是操作系统和应用程序中的部分，它们根据用户的身份决定允许用户访问哪些数据和功能。`Authorization`（也称为\
  \ `establishment`）定义了授予用户账户或进程的权利和权限（即用户可以做什么以及或用户可以访问什么数据）。在系统或应用程序验证用户身份后，授权将决定该用户（主体）对系统或资源（对象）可以做什么。\n\
  \n`Data access controls` 通过根据用户身份限制对系统文件和用户数据的访问来保护系统和信息。数据访问控制还依靠系统访问控制提供的身份识别和认证，提供了授权和问责机制。\n\
  \n### 访问控制技术\n\n数据访问控制技术通常分为裁量性（discretionary）或强制性（mandatory）。作为 CISSP 候选人，你必须完全理解裁量性和强制访问控制的概念，并能够描述属于每个类别的特定访问控制方法。\n\
  \n#### 基于角色的访问控制\n\n`Role-based access control` (`RBAC`) 是一种管理用户访问控制的方法。基于角色的访问控制根据组织或功能角色分配组员身份。个人可能属于一个或多个组（获得累积权限，或受限于所有分配组中限制限制的权限集）；一个组可能仅包含一个个人（对应分配给某人的特定组织角色）。对象的访问权和权限被分配给组，而不是（或之外）的个人。RBAC\
  \ 大大地简化了访问权和权限的管理，特别是对于拥有大型功能组或部门、以及经常在不同职位上轮换人员或人员流失率高的组织。\n\n基于角色的访问控制的优势包括：\n\
  \n* 用户的访问往往更加均一。\n* 更改许多用户的访问权限通常只需更改一个或多个角色的访问权限。\n\n许多采用 RBAC 的系统仍然允许向单个终端用户授予访问权限。尽管如此，许多组织倾向于坚持使用角色，即使在某些情况下某个角色只有一名成员。\n\
  \n基于角色的访问控制的概念如图图 7-10\n\n图 7-10： 基于角色的访问控制。\n\n#### 基于规则的访问控制\n\n`Rule-based access\
  \ control`（不要与上一节中的基于角色的访问控制混淆）是应用强制访问控制的方法之一。实际上，所有基于 MAC 的系统（下文讨论）都通过匹配对象的敏感标签和主体的体的性标签来实现简单的基于规则的访问控制，以决定系统应授予还是拒绝访问。你可以通过基于规则的访问控制应用额外的规则，以进一步定义访问请求对象的特定条件。管理访问的其他类型规则还包括：\n\
  \n* 时间段\n* 使用的工作站或终端\n* 用户地理位置\n* 正在访问的数据内容\n\n#### 强制访问控制\n\n`mandatory access\
  \ control` (`MAC`) 是一种由系统决定而非由所有者决定的访问策略。组织在处理高度敏感数据（如机密政府和军事信息）的多级系统中使用 MAC。`multilevel\
  \ system`（多级系统）是一个在主体和对象之间处理多个分类层级的单一计算机系统。MAC 中的两个重要概念是：\n\n* **敏感性标签（Sensitivity\
  \ labels）：** 在基于 MAC 的系统中，所有主体和对象都必须分配标签。主体的敏感性标签指定了其信任级别。对象的敏感性标签指定了访问所需的信任级别。为了访问给定对象，主体的敏感性级别必须等于或高于请求的对象。例如，拥有“绝密”（敏感标签）许可的用户（主体）被允许访问具有“秘密”分类级（敏感标签）的文件（对象），因为其权限级别超过了访问的最低要求。我们将在第\
  \ 4 章中讨论分类系统。\n* **数据导入和导出：** 控制从其他系统导入信息以及导出到其他系统（包括打印机）是基于 MAC 的系统的关键功能，系统必须确保妥善维护和实施敏感性标签，以确保敏感信息在任何时候都能得到保护。\n\
  \n基于格（Lattice-based）的访问控制是实现强制访问控制另一种方法。`lattice model`（格模型）是一种数学结构，对元素对（如主体和对象）定义下界和最小上界值。组织可以使用该模型处理涉及多个对象和/或主体的复杂访问控制决策。例如，给定一组具有多个分类级的文件，格模型决定了用户访问所有文件所需的最低许可级。\n\
  \n强制访问控制技术的主要缺点包括：\n\n* 缺乏灵活性\n* 实施和编程困难\n* 用户感到沮丧\n\n![remember](img/remember.png)\
  \ 在 MAC 中，系统决定访问策略。\n\n#### 裁量性访问控制\n\n`discretionary access control` (`DAC`) 是一种由文件（或其他资源）所有者决定的访问策略。所有者决定谁被允许访问文件以及他们拥有何种权限。\n\
  \n![remember](img/remember.png) 在 DAC 中，所有者决定访问策略。\n\nDAC 中的两个重要概念是：\n\n* **文件和数据所有权：**\
  \ 由于资源（可能由文件、目录、数据、系统资源和设备组成）的所有者决定访问策略，系统中的每个对象必须有一个所有者。理论上，没有所有者的对象将处于不受保护状态，或者没有可以决定谁或什么可以访问它的用户。通常，资源的所有者是创建资源的人（如文件或目录），但在某些情况下，你可能需要显式识别所有者。\n\
  * **访问权和权限：** 所有者为特定资源分配给单个用户或组的控制。各种系统（基于 Windows 或基于 UNIX）定义了不同的权限集，这些权限本质上是三种基本访问类型的变体或扩展：\n\
  \n    * 读取 (R)：** 主体可以读取文件内容或列出目录内容。\n\n\n\n\n\n- **写入 (W):** 主体可以更改文件或目录的内容（包括添加、重命名、创建和删除）。\n\
  - **执行 (X):** 如果该文件是一个程序，主体可以运行该程序。\n\n访问控制列表（ACLs）为实施裁量访问控制提供了一种灵活的方法。ACL 列出了分配给特定主体、针对特定对象的具体权利和权限。\n\
  \n裁量访问控制技术（如 ACLs 或基于角色的访问控制）的主要缺点包括：\n\n- 缺乏集中化管理。\n- 依赖于具有安全意识的资源所有者。\n- 许多流行的操作系统在所有者未显式设置权限时，默认会设为对所有人开放完全访问权限。\n\
  - 由于大量的个人权限以及可能生成的日志条目，审计变得困难，甚至无法进行。\n\n![remember](img/remember.png) 不同的操作系统对\
  \ ACL 的实现方式不同。虽然 CISSP 考试不会直接测试你对特定操作系统或产品的知识，但你应该意识到这一事实。此外，要理解此语境下的 ACL 与路由器上使用的\
  \ ACL 不同（参见第 5 章），后者与 DAC 无关。\n\n### 基于属性的访问控制\n\n基于属性的访问控制（ABAC）是一种根据主体、对象的属性以及环境因素确定的访问策略。在基于\
  \ ABAC 的系统中，主体访问对象的能力基于关于主体的一个或多个属性（如主体的职位名称、部门或项目分配），以及关于对象本身的属性（如其名称、项目名称、所有者或位置）。此外，环境因素被用于确定是否授予访问权限；示例环境因素包括主体的所在地、时间和其他条件。\n\
  \n在基于 ABAC 的系统中，访问决策由策略决策点（PDP）做出，并由策略执行点（PEP）执行。\n\n![tip](img/tip.png) ABAC 定义在\
  \ NIST SP-162《基于属性的访问控制 (ABAC) 定义与考量指南》中，该文档可以通过 [`www.nist.gov`](http://www.nist.gov)\
  \ 获取。\n\n## 预防或缓解访问控制攻击\n\n获取系统或网络的访问权限通常是攻击者目标列表的一部分。攻击者通常对访问控制系统使用几种攻击方法，包括：\n\
  \n- **暴力破解攻击：** 攻击者尝试所有可能的字母、数字和字符组合来破解密码、短语或 PIN 码。\n- **字典攻击：** 字典攻击本质上是一种更具针对性的暴力破解攻击，攻击者使用预定义的词列表。你可以在互联网上找到此类词列表或字典（包括外语字典和特殊兴趣字典），广泛用于\
  \ `L0phtCrack` 和 `John the Ripper` 等密码破解工具。攻击者通常会在目标系统（或网络）的安全账户数据库或密码文件的副本上运行这些密码破解工具。该工具会对其字典或词列表中包含的密码创建哈希值（hashes），然后将生成的哈希值与密码文件进行比较。这些类型的程序运行速度非常快且非常有效（参见本章侧边栏“破解你的密码需要多少次暴力？”），即使组织使用了复杂的密码也是如此，因此防御暴力破解或字典攻击的关键在于保护你的安全账户数据库和密码文件。\n\
  - **彩虹表：** 在这里，攻击者从目标系统偷取包含哈希值密码的文件或数据库，然后在一个名为“彩虹表”的大型数据库中查找这些哈希值。这本质上是所有可能的哈希值及其每个哈希对应的原始明文的列表。如果组织没有对其哈希值进行“加盐”（salting），这种攻击相对容易实施。\n\
  - **缓冲区或栈溢出：** 缓冲区或栈溢出是当今最常见且成功的计算机攻击类型。虽然通常用于拒绝服务攻击，但某些系统或应用程序中的缓冲区溢出可能允许攻击者绕过身份验证控制，获得对系统或目录的未经授权访问。当应用程序或协议尝试存储超过分配资源允许的信息时，就会发生溢出。这会导致之前输入的数据损坏、协议或应用程序崩溃，或发生其他意外或异常行为。水滴型攻击（teardrop\
  \ attack）是一种利用 IP 协议漏洞的栈溢出攻击。防御缓冲区或栈溢出攻击的最佳方法是在识别每个漏洞后，尽快识别并修复系统、网络和应用程序中的漏洞（理想情况下在受影响的代码或应用程序应用于生产环境之前）。\n\
  - **中间人攻击：** 在这里，攻击者拦截双方之间的消息，并将原始消息的修改版本转发给目标接收者。例如，攻击者可以在双方进行公钥交换期间替换为自己的公钥。双方都认为他们仍在与对方单独通信，并在不知情的情况下使用攻击者的公钥（而非目标接收者的公钥）加密消息。攻击者随后可以解密双方之间的秘密消息，按意愿修改内容，并发送给毫无防备的接收者。\n\
  - **数据包（或密码）嗅探：** 攻击者使用称为嗅探器的应用程序或设备来捕获网络数据包，并分析其内容，例如用户名、密码和共享密钥。\n- **会话劫持：**\
  \ 与中间人攻击类似，不同在于攻击者冒充目标接收者，而不是修改传输中的消息。\n- **社会工程学：** 这种低技术方法是最有效且最易实施的攻击形式之一。常见技术包括网络钓鱼、翻垃圾桶、窥视、搜查隔间（在显示器上、键盘下和鼠标垫下寻找密码）以及简单的询问。后者这种厚颜无耻的技术可能涉及攻击者拨打电话装成系统管理员向用户索密码，或者拨打帮助热台装成用户要求重置密码。\n\
  \n组织应该采用各种策略和流程来应对访问控制攻击，包括：\n\n- **威胁建模：** 确保在开发生命周期早期将安全作为关键设计因素。在设计阶段创建并测试安全规范，以识别特定应用程序及其用途的可能威胁、漏洞和应对措施。\n\
  - **资产估值：** 为组织的信息资产分配财务价值的过程，从而对需要不同级别保护的系统和数据进行客观衡量。\n- **漏洞分析：** 这是一个识别、定义和优先处理系统漏洞的过程。\n\
  - **源代码审查：** 开发者检查应用程序的源代码，以查看系统中是否存在可能允许成功攻击的软件缺陷。\n- **访问聚合：** 通过合并用户在单个或多个系统中的所有访问权、权限和许可来简化访问控制（例如使用简化登录或单点登录）。\n\
  \n## 管理身份和访问配置生命周期\n\n组织必须采取正式策略和程序来处理账户的配置、审核和撤销。IAM 配置生命周期的阶段为\n\n\n\n\n\n*  \
  \ **角色设计、创建和审查。** 在系统的开发、定制或配置期间，会对每个用户角色进行设计。这些设计需要经过审查过程，以确保其恰当性。\n\n*   **访问权限开通。**\
  \ 当新员工、临时员工、承包商、合作伙伴、审计员和第三方需要访问组织的系统和网络时，该组织必须有一套正式的方法来请求访问权限。访问开通的步骤如下：\n\n  \
  \  *   **访问请求。** 请求者（通常是终端用户，但不总是如此）对访问系统中的特定数据或特定角色提出正式请求。\n    *   **请求审查。** 由指定的人员或小组对请求的合理性进行审查。有时，审查人员可能会向请求者提问，以更好地理解请求的原因。\n\
  \    *   **访问批准。** 请求由指定的人员或小组批准。\n    *   **访问开通。** 在系统中配置已请求并获批准的访问权限。\n\n![remember](img/remember.png)\
  \ 新账户必须正确且及时地开通，以确保在用户需要时访问权限已就绪并可用，但不能过早（以确保尚未投入使用的新账户不会被攻击者破解）。\n\n*   **账户访问审查。**\
  \ 应定期对用户和系统账户及其分配的权限进行审查，以确保它们仍然恰当。例如，由于职责轮换（参见第 9 章）或转岗或晋升，员工可能不再需要相同的权限级别。\n\n\
  *   **角色审查。** 指定人员定期检查系统中的角色，以确定每个角色定义的访问权限是否恰当。\n\n*   **空闲审查。** 指定人员定期检查系统，以查看用户是否正在访问该系统。对于在一段时间内（例如\
  \ 90 天）未访问系统（或系统中的角色）的用户，可能会取消其访问权限。\n\n*   **访问终止。** 最后，当不再需要访问权限时，必须及时禁用并删除账户。撤销应尽可能自动化，并包括将禁用的账户移动到受保护的组织单元（在\
  \ `Active Directory` 中）或其他受限组，以及从所有组成员中移除禁用的账户。\n\n![tip](img/tip.png) 用户账户通常在终止后\
  \ 24 小时内锁定。在解雇的情况下，用户账户通常在通知员工之前立即锁定。\n\n第 8 章\n\n# 安全评估与测试\n\n### 本章内容\n\n![check](img/check.png)\
  \ **制定评估和测试策略**\n\n![check](img/check.png) **执行漏洞评估、渗透测试及更多操作**\n\n![check](img/check.png)\
  \ **收集安全过程数据**\n\n![check](img/check.png) **理解测试输出**\n\n![check](img/check.png)\
  \ **进行内部、外部和第三方审计**\n\n在本章中，你将学习安全专业人员用于持续评估和验证组织安全环境的各种工具和技术。该领域占 CISSP 认证考试的 12%。\n\
  \n## 设计和验证评估与测试策略\n\n现代安全威胁正在快速且不断地演变。同样，组织的系统、应用程序、网络、服务和用户也在频繁变化。因此，组织必须制定有效的策略，来定期测试、评估和调整其业务和技术环境，以减少成功攻击的概率和影响，并符合相关法律、法规和合同义务。\n\
  \n组织需要对现有和新的信息系统及资产实施主动的评估和测试策略。该策略应是风险管理过程中不可或缺的一部分，帮助组织识别足够重要以值得分析、决策和采取的新型及变化风险。\n\
  \n安全人员必须识别所有适用的法律、法规和其他法律义务（如合同），以理解需要哪些评估、测试和审计。此外，安全人员应检查组织的风险管理框架和控制框架，查看建议或要求哪些评估、控制测试和审计。这些结合将成为组织整体策略的一部分，以确保所有与安全相关的工具、系统和流程正常运行。\n\
  \n在规划组织的评估、测试和审计时，有三个主要视角参与：\n\n*   **内部：** 这代表由组织内部的人员进行的评估、测试和审计。使用内部资源进行评估、测试和审计的优点包括成本更低且对组织的实践和系统更熟悉。然而，内部人员可能没有外部人员那样客观。\n\
  *   **外部：** 这代表由来自外部组织或机构的人员进行的评估、测试和审计。某些法律法规以及合同义务可能要求对某些系统和过程进行外部评估、测试和审计。使用外部人员最大的优点是他们是客观的。然而，成本通常更高，特别是对于需要较高技能水平或专业工具的活动。\n\
  *   **第三方：** 这涉及对外包给外部服务提供商或第三方的关键业务活动的审计。在这里，被检查的系统和人员属于外部服务提供商。根据适用法律、法规和合同的要求，这些对第三方评估可以通过内部人员执行，在某些情况下可能需要外部人员。\n\
  \n![tip](img/tip.png) 许多第三方服务提供商会委托外部审计，其审计报告可以分发给客户。这可以帮助服务提供商避免客户的多次审计。此类审计的示例包括\
  \ `SSAE 18`、`SOC-1` 和 `SOC-2`。服务提供商还会委托安全咨询公司对系统和应用程序进行渗透测试，这有助于他们减少想要自行此类操作的客户数量。\n\
  \n## 执行安全控制测试\n\n安全控制测试采用各种工具和技术，包括漏洞评估、渗透性测试、合成交易、接口测试等。你将在后续章节中学习这些和其他工具和技术。\n\
  \n### 漏洞评估\n\n执行漏洞评估是为了识别、评估、量化并优先考虑应用程序或系统的安全缺陷。此外，漏洞评估为缓解环境中发现的特定漏洞提供了修复步骤。\n\n\
  通常有三种类型的漏洞评估：\n\n*   端口扫描（低密集）\n*   漏洞扫描（高密集）\n*   渗透测试（最密集）\n\n通常，使用自动化的网络扫描工具来识别网络中应用程序、系统和网络设备的漏洞。有时，使用基于系统的扫描工具来检查配置设置以识别可利用的漏洞。通常，结合网络和系统工具可以构建出环境中漏洞的更完整的图景。\n\
  \n#### 端口扫描\n\n\n\n\n\n`端口扫描`（port scan）使用一种工具，通过各种传输控制协议/网协议（TCP/IP）端口与一个或多个目标系统进行通信。端口扫描可以发现那些本应该被禁用的端口的存在（因为这些端口在特定系统上没有提供任何有用或必要的用途）。\n\
  \n## 漏洞扫描\n\n基于网络的漏洞扫描工具向网络中的系统发送网络消息，以识别任何可能配置为通过网络通信的实用程序、程序或工具。这些工具尝试识别任何实用程序、程序工具的版本；通常情况下，了解运行中的程序版本就足够了，因为扫描工具通常包含一个与程序版本相关的已知漏洞数据库。扫描工具还可能向运行中的程序发送特意构造的消息，以查看这些程序是否包含任何可利用的漏洞。\n\
  \n工具还被用于识别软件应用程序中的漏洞。通常，这些工具被分为两类：动态应用程序安全测试（DAST）和静态应用程序安全测试（SAST）。DAST 会执行应用程序，然后使用模糊测试（fuzzing）等技术尝试识别可能允许攻击者成功破坏软件应用程序的可利用漏洞；这将允许攻击者更改或窃取数据，或接管系统的控制权。SAST\
  \ 则检查应用程序的源代码并寻找可利用的漏洞。DAST 和 SAST 都无法发现所有的漏洞，但当由专业人员结合使用时，就可以发现许多可利用的漏洞。\n\n基于网络的漏洞扫描工具示例包括\
  \ Nessus、Rapid7 和 Qualys。基于系统的漏洞扫描工具示例包括 Microsoft 基安全分析器（MBSA）和 Flexera（原 Secunia）PSI。应用程序扫描工具示例包括\
  \ IBM AppScan、HP WebInspect、HP Fortify、Accunetix 和 Burp Suite。\n\n## 未认证扫描和已认证扫描\n\
  \n漏洞扫描工具（包括用于检查系统和网络设备的工具，以及检查应用程序的工具）通常执行两种类型的扫描：未认证扫描和已认证扫描。在`认证扫描`（authenticated\
  \ scan）中，扫描工具将配置登录凭据并尝试登录设备、系统或应用程序，以识别无法无法发现的漏洞。在`未认证扫描`（unauthenticated scan）中，扫描工具不会尝试登录；因此，它只能发现没有有效登录凭据的人可以利用的漏洞。\n\
  \n## 漏洞扫描报告\n\n通常，本节讨论的所有扫描工具都会创建一个某种报告，包含有关执行扫描和识别出的漏洞的摘要和详细信息。这些工具中的许多会产生大量的详细信息，包括识别每个漏洞所使用的步骤、每个漏洞的严重程度以及修复每个漏洞可以采取的步骤。\n\
  \n某些漏洞扫描工具采用专有的漏洞识别方法论，但大多数扫描工具都会为每个识别出的漏洞包含一个通用漏洞评分系统（CVSS）分数。应用程序安全将在第 10 章中进行详细讨论。\n\
  \n漏洞评估是风险管理的关键部分（在第 3 章中讨论）。\n\n## 渗透测试\n\n`渗透测试`（penetration testing，简称 `pen testing`）是漏洞评估最严格的形式。执行渗透测试所需的精力远高于端口扫描或漏洞扫描。通常，当组织想要模拟对手的实际攻击时，会对目标系统或环境进行渗透测试。\n\
  \n## 网络渗透测试\n\n对系统和网络设备的`网络渗透测试`（network penetration test）通常从端口扫描和/或漏洞扫描开始。这为渗透人员提供了网络以及连接到网络的系统和设备的攻击面清单。渗透测试将继续大量使用手动技术来识别和/利用漏洞。换句话说，渗透人员同时使用自动化和手动技术来识别和确认漏洞。\n\
  \n偶尔，渗透人员会在渗透测试期间利用漏洞。渗透人员在此处通常非常小心，因为他们必须敏锐地意识到目标环境。例如，如果渗透人员正在测试实时生产环境，利用漏洞可能会导致故障或停机。\n\
  \n在渗透测试期间，渗透人员通常会利用漏洞。利用。在在某些例如，如果渗透人员正在测试实时生产环境，利用漏洞可能会导致数据损坏或数据丢失。\n\n在进行渗透测试时，渗透人员通常会获取显示被利用系统的截图。通常，渗透人员通过这种方式证明其环境存在可利用的漏洞。\n\
  \n渗透人员通常会在报告中包含利用漏洞的细节。这对于希望重现漏洞以修复漏洞的系统或网络工程师非常有帮助，他们可以使用相同的技术“亲眼看到”漏洞确实存在。\n\n\
  除了扫描网络，网络渗透测试的主题还包含其他技术，包括：\n\n*   **拨号（War dialing）：** 黑客通过顺序拨号范围内的电话号码来发现任何活跃的调制调器。然后黑客尝试通过调制调器连接任何系统或网络。这很老技术，但仍在使用。\n\
  *   **开车（War driving）：** 开车是 21 世纪版的拨号。有人使用笔记本电脑并在人口密集地区行驶，寻找未保护（或保护不当）的无线访问点。\n\
  *   **辐射监控（Radiation monitoring）：** 射频（RF）发射是计算机和网络设备发射的电磁辐射。辐射监控与嗅探和开车类似，有人使用精密设备试图确定显示器上显示、在局域网（LAN）上传输或在计算机中处理的数据。\n\
  *   **窃听（Eavesdropping）：** 窃听和翻垃圾桶一样低技术，但物理上没那么脏。基本上，窃听者利用一个或多个正在说话或使用计算机的人——他们很少注意是否有人听他们的对话或观察他们工作。（后者的技术术语是`窥视`（shoulder\
  \ surfing）。）\n*   **数据包嗅探（Packet sniffing）：** 数据包嗅探是一种捕捉网络上所有 TCP/IP 数据包的工具，而不仅仅是发送给嗅探设备的数据包。以太网是一种共享介质网络（参见第\
  \ 6 章），这意味着局域网上的任何或所有设备（理论上）都可以查看所有数据包。然而，交换介质局域网现在更普遍，交换介质局域网上的嗅探器通常只捕获目标为嗅探设备的数据包。\n\
  \n![tip](img/tip.png) 以`混杂模式`（promiscuous mode）运行的网络适配器接收所有数据包，而不仅仅是发给系统的包，并将其发送到操作系统。\n\
  \n渗透人员通常会在报告中包含利用漏洞的细节。这对于希望重现漏洞以修复漏洞的系统或网络工程师非常有帮助，他们可以使用相同的技术查看他们的修复是否关闭了漏洞。\n\
  \n## 应用程序渗透测试\n\n\n\n\n\n`应用渗透测试`（application penetration test）用于识别软件应用程序中的漏洞。虽然应用渗透测试的原理与网络渗透测试相同，但工具和技能有所不同。执行应用渗透测试的人通常具有深厚的软件开发背景。事实上，最好的应用渗透测试员往往是前开发人员或软件工程师。\n\
  \n## 物理渗透测试\n\n渗透测试也会对保护物理场所的控制措施进行，以查看入侵者是否可能绕过如锁上的门和门禁控制入口等安全控制措施。有时，测试人员会利用各种社会工程技术来获取未经授权的访问工作中心以及工作中心内的敏感区域（如机房和文件存储室）。通常，他们会留下证据，例如名片或其他物品，以证明他们已成功进入。\n\
  \n![tip](img/tip.png) 《图解黑客入门》第 6 版更详细地介绍了渗透测试和其他技术。\n\n除了潜入设施外，物理渗透测试人员使用的另一种流行技术是“翻垃圾桶”（dumpster\
  \ diving）。翻垃圾桶是低技术渗透测试的极致（或最糟糕的体现），其名其实如其义。翻垃圾桶有时是获取组织信息的一种极有效的方式。在高度竞争环境中的组织也需要关注其垃圾和回收纸的去向。\n\
  \n## 社会工程学\n\n`社会工程`（Social engineering）是指任何利用某种手段欺骗个人执行某些操作或提供某些信息的测试技术，使测试人员获得进入应用程序、系统或网络的能力。社会工程涉及此类低技术战术，例如攻击者假装成支持人员，然后打电话给员工并询问他们的密码。你认为大多数人足够聪明，不会中招，但人毕竟是人（《绿色胶囊》里的人也是人）！社会工程测试中用到的一些诡计包括：\n\
  \n*   **钓鱼信息：** 冒充特定身份的电子邮件信息，试图诱导他人打开文件或点击链接。测试性钓鱼信息无疑是无害的，但用于查看有多少员工会中招。\n*  \
  \ **电话电话：** 可以给组织内部的各种工作人员打电话以欺骗他们执行任务。例如，给服务台打电话可能试图尝试重置用户账户（这可能允许测试人员使用该用户账户登录），给任何员工打电话自称来自\
  \ IT 服务台，看用户是否会交出登录凭据或执行任务，或给任何自称需要帮助的员工打电话。\n*   **尾随（Tailgating）：** 尝试通过跟随合法人员通过受控门来进入限制工作区域。有时测试人员会提着盒子，希望员工能为他们开门，或者他们可能会伪装成快递员或设备维修人员。\n\
  \n## 日志审查\n\n定期审查各种安全日志（理想情况下是每天）是安全控制测试中的关键步骤。遗憾的是，这项重要任务在许多管理员的“待办事项”列表中排名通常略高于“更新文档”。日志审查通常在事件发生后才进行。但那绝不是发现你的日志记录不完整或不足的时机。\n\
  \n日志记录要求（包括任何法规或法律强制）需要在组织的安全策略中明确定义，包括：\n\n*   记录哪些内容，例如：\n    *   网络设备事件，如防火墙、入侵防御系统（`IPS`）、网络过滤器和数据泄露防护（`DLP`）系统\n\
  \    *   服务器和工作站操作系统的事件\n    *   子系统事件，如 Web 服务器、数据库管理系统应用程序网关\n    *   应用程序事件\n\
  *   日志中包含什么，例如：\n    *   事件日期/时间\n    *   源（和目标，如果适用）、协议和 IP 地址\n    *   设备、系统和/或用户\
  \ ID\n    *   事件 ID 和类别\n    *   事件详情\n*   何时以及多久审查一次日志。\n*   日志级别（日志的详尽程度）。\n*\
  \   日志如何以及在何处传输、存储和保护；例如：\n    *   日志是存储在集中日志服务器上还是本地系统硬盘上？\n    *   使用哪种安全传输协议来确保传输中日志数据的完整性？\n\
  \    *   如何同步日期和时间戳（例如 `NTP` 服务器）？\n    *   是否需要对日志进行加密？\n    *   谁有权访问日志？\n   \
  \ *   采取哪些保护措施保护日志的完整性？\n    *   如何记录对日志的访问情况？\n*   日志保留多久。\n*   日志中的哪些事件会触发警报，以及警报发送给哪些人员。\n\
  \n![tip](img/tip.png) 各种日志管理工具，如安全信息和事件管理（`SIEM`）系统（在第 9 章中讨论过），通常用于帮助实时监控、解析、异常检测以及向关键人员生成警报。\n\
  \n## 合成交易\n\n合成交易（Synthetic transactions）是在受监控对象上自动执行的实时操作或事件。例如，可以使用工具定期在电子商务网站上执行一系列脚本化步骤，以衡量性能、识别即将到来的性能问题并模拟用户体验。因此，合成交易可以帮助组织对关键系统进行主动测试、监控并确保可用性（请参见[第\
  \ 3 章](#c03.xhtml）中的 C-I-A 三元组），并监控服务水平协议（`SLA`）保证。\n\n应用程序性能监控工具传统上产生系统运行时间、正确处理和事务延迟等指标。虽然运行时间确实是可用性的一个重要方面，但它只是其中一个组件。越来越多，可访问性（一种更以用户或应用程序为中心的指标）正成为关注客户体验的组织的首选指标。毕竟，如果你的\
  \ Web 服务器在 99.999% 的时间都在运行，但他们所在地区的互联网连接很慢、`DNS` 解析缓慢，或者网页需要 5 或 6 秒才能加载，那么在一个以毫秒衡量响应的在线世界里，这对你的客户来说并没有太大好处！因此，应用程序的其他关键指标是正确处理（可能以百分比表示，应接近\
  \ 100%！）和`事务延迟`（特定类型事务完成的时间）。这些指标有助于运维人员发现应用程序问题。\n\n## 代码审查与测试\n\n代码审查和测试（有时称为同行评审）涉及系统地检查应用程序源代码，以识别软件程序中的错误、缺陷、低效和安全漏洞。在线软件库（如\
  \ `Mercurial` 和 `Git`）允许软件开发能够在协作开发环境中管理源代码。代码审查可以通过手动视觉仔细检查代码更改完成，也可以通过自动化代码审查软件（如\
  \ `IBM AppScan Source`、`HP Fortify` 和 `CA Veracode`）完成。不同类型的代码审查和测试技术包括\n\n\n\n\n\
  \n- **结对编程。** `Pair`（或 `peer`）`programming`是一种广泛用于敏捷软件开发和极端编程（均在第 10 章中讨论过）的技术，其中两个开发人员共同工作，并逐替编写和审查代码。\n\
  - **轻量级代码审查。** 通常作为开发过程的一部分进行，由非正式的走查、电子邮件传递、工具辅助和/或过肩审查（不建议极少数内向或多疑的开发者使用此类方式）组成。\n\
  - **正式检查。** 结构化的流程，例如`Fagan inspection`，用于在整个开发过程中识别设计文档、需求规格书、测试计划和源代码中的缺陷。\n\n\
  ![tip](img/tip.png) 代码审查和测试在帮助识别软件漏洞（如缓冲区溢出、脚本注入漏洞、内存泄漏和竞态条件）方面极具价值（请参见第 10 章了解更多信息）。\n\
  \n### 滥用用例测试\n\n`用例测试`（定义并测试系统或应用程序中的正常或预期行为）的相反面是`滥用/误用用例测试`，它是在系统或应用程序中执行非预期和恶意操作的过程，以产生异常或意外的行为，从而识别潜在的漏洞。\n\
  \n在误用用例测试识别出潜在漏洞后，可以开发用例来定义新需求，以消除或缓解其他程序和应用程序中的类似漏洞。\n\n误用用例测试中使用的常用技术称为`fuzzing`。模糊测试涉及使用自动化工具，这些工具可以产生几十（或数百甚至更多）种输入字符串组合，输入程序的数据输入字段，以触发意外行为。例如，模糊测试用于尝试使用`脚本注入`成功攻击程序。脚本注入是一种欺骗程序执行各种语言（主要是\
  \ JavaScript 和 SQL）命令的技术。`HP WebInspect`、`IBM AppScan`、`Acunetix`和`Burp Suite`等工具内置的模糊测试和脚本注入工具非常擅识别软件应用程序中的脚本注入漏洞。\n\
  \n### 测试覆盖率分析\n\n`测试`（或 `代码`）`覆盖率分析`衡量给定测试（或验证）套件对源代码的测试百分比。基本的覆盖标准通常包括\n\n- **分支覆盖**（例如，决策点的每个分支都以\
  \ TRUE 或 FALSE 执行）\n- **条件（或谓词）覆盖**（例如，每个布尔表达式都被求值为 TRUE 和 FALSE）\n- **函数覆盖**（例如，每个函数或子程序都被调用）\n\
  - **语句覆盖**（例如，每条语句至少执行一次）\n\n例如，安全工程师可能会使用动态应用程序安全测试工具（DAST），如`AppScan`或`WebInspect`来测试旅游预订程序，以确定程序是否存在任何可利用的安全缺陷。此类工具是强大的，它们使用多种方法来“模糊”输入字段以尝试发现缺陷。但这些工具需要做的另一件事是填写所有可能的组合表单，以便执行程序的所有代码。在旅游预订工具的示例中，这些组合将涉及航班、酒店或汽车搜索、查询、检查和最终预订的所有方式。在复杂的程序中，这可能非常令人令畏。需要高度系统的分析来确保每种可能的条件组合都经过测试，从而使程序的所有代码都被测试。\n\
  \n### 接口测试\n\n`接口测试`关注不同系统和组件之间的接口。它确保功能（如系统或组件之间的数据传输和控制）正确且符合预期地执行。接口测试还验证任何执行错误都得到善处理，且不会暴露任何潜在的安全漏洞。测试的接口示例包括\n\
  \n- 应用程序接口 (APIs)\n- Web 服务\n- 事务处理网关\n- 物理接口，如键盘、键盘/鼠标/显示器以及设备开关和指示器\n\n![tip](img/tip.png)\
  \ API、Web 服务和事务网关可以使用`HP WebInspect`、`IBM AppScan`和`Acunetix`等自动化工具进行测试，这些工具也用于测试\
  \ Web 应用程序的人输入部分。\n\n## 收集安全过程数据\n\n对安全管理流程和系统的评估有助于组织确定其关键流程和控制的有效性。定期测试关键活动是管理和监管的重要部分，以确认关键流程的正常运行并识别改进领域。\n\
  \n在决定由谁执行测试时，必须考虑几个因素：\n\n- **法规。** 各种规定指定了哪些由必须是合格的内部人员还是外部顾问。\n- **人员资源和资质。**\
  \ 在法规和其他条件的允许下，组织可能有足够的技能和资质的人员来执行其部分或全部测试。\n- **组织完整性。** 虽然组织可能拥有测试其管理流程的资源和知识，但组织通常会选择让外部合格的组织进行测试。独立的外部测试有助于避免偏见。\n\
  \n这些因素还将决定所需的测试方法，包括所使用的工具、测试标准、采样和报告。例如，在美国的上市公司中，根据 2002 年《萨班斯-奥克斯利法案》（SOX 法案，又称“公众公司会计改革和投资者保护法案”）的指导，组织被要求以特定的方式和按照特定的审计标准对其信息安全控制进行自评估。\n\
  \n### 账户管理\n\n管理必须定期审查用户和系统账户以及相关的业务流程和记录，以确保权限在获得适当批准后正确配置和撤销。审查的类型包括\n\n- 所有用户账户配置都经过了适当请求、审查、批准和执行。\n\
  - 所有内部人员转岗都及时终止了不再需要的访问权限。\n- 所有人员离职都及时终止了所有访问权限。\n- 所有持有特权账户访问的用户仍需要，且其管理操作已记录。\n\
  - 所有用户账户都可以追溯到适当的请求、审查和批准。\n- 对所有闲用户账户进行评估，以确定是否可以禁用。\n- 根据需要定期对所有用户的访问权限进行认证。\n\
  \n账户管理流程在第 9 章中进行了详细讨论。\n\n\n\n\n管理层为组织的所有方面（包括其信息安全计划）提供资源和战略方向。作为整体治理的一部分，管理层需要审查安全计划的关键方面。这种审查没有单一的方法；相反，管理层将按照审查组织内其他关键活动的风格和严谨性来对安全计划进行审查。在较大的组织中，这种审查可能会非常正式，定期为高级管理层创建执行级报告，内容包括关键活动、事件和指标（此处可以称为\
  \ `eye candy`，即直观的数据）。在较小的组织中，这种审查可能没那么正式。在规模最小的组织以及安全成熟度水平较低的组织中，可能根本没有任何管理审查。管理审查通常包括以下活动：\n\
  \n* 对近期安全事件的审查\n* 对安全相关支出的审查\n* 对近期策略变更的审查（及批准）\n* 对风险处理决策的审查（及批准）\n* 对与安全相关流程以及其他业务流程中安全相关组件重大变更的审查（及批准）\n\
  * 对运营级和管理级指标及风险指标的审查\n\n国际公认的标准 `ISO/IEC 27001`《信息技术— 安全技术— 信息安全管理体系—要求》要求组织管理层确定其信息安全计划中哪些活动和元素需要被监控、使用的方法，以及负责审查这些内容的个人或团队。\n\
  \n## 关键绩效和风险指标\n\n关键绩效和风险指标是对信息安全计划中关键活动的意义化衡量，可以帮助各级管理层更好地理解安全计划及其组件的运行情况。\n\n\
  这说起来容易做起来难；以下是几个原因：\n\n* 没有一套适用于每个组织的单一通用指标集。\n* 衡量性能和风险的方法有多种方法。\n* 高管会希望以特定的方式衡量关键活动。\n\
  * 成熟度水平在组织之间存在差异。\n\n组织通常会围绕其关键安全相关活动开发指标和关键风险指标 (`KRIs`)，以确保安全流程按预期运行。指标通过对意外趋势向管理层发出预警，帮助识别改进领域。\n\
  \n安全指标的一些关注领域包括以下：\n\n* **漏洞管理：** 运营指标将包括执行的扫描次数、识别出的漏洞数量（按严重程度划分）以及已应用的补丁数量。关键风险指标将关注漏洞公开发布到完成补丁之间持续的时间。\n\
  * **事件响应：** 运营指标将侧重于事件的数量和类别，以及趋势是否表明防御中存在新的弱点。关键风险指标将关注发现事件正在进行所需的时间（称为 `dwell\
  \ time`，驻留时间）以及包含和解决事件所需的时间。\n* **安全意识培训：** 运营指标和关键风险指标通常关注随时间变化的完成率。\n* **日志与监控：**\
  \ 运营指标通常侧重于发生的事件数量和类型。关键风险指标关注受监控日志的资产比例，以及从事件开始到人员采取行动之间持续的时间。\n\n关键风险指标之所以被称为“关键”，是因为它们是组织内部信息风险的预兆。虽然运营指标的开发并不算困难，但安全经理经常苦恼于如何开发出让高管管理层能够理解（且有意义）的关键风险指标。例如，漏洞管理过程涉及使用一个或多个漏洞扫描工具以及随后的修复工作。在这里，一些良好的运营指标包括执行的扫描次数、识别出的漏洞数量以及修复已识别漏洞所需的时间。然而，这些指标对管理层没有意义，因为它们缺乏业务背景。尽管如此，从漏洞管理过程中的数据中可以推出一个或多个良好的关键风险指标。例如，“支持制造的服务器中，关键安全缺陷在十天内未修复的百分比”就是一个极好的关键风险指标。该指标直接帮助管理层理解在特定业务背景下漏洞管理流程的运行情况。这也是潜在泄露风险（利用未打补丁的漏洞服务器）的良好领先指标。\n\
  \n## 备份数据\n\n组织需要定期审查和测试系统数据备份以及恢复程序，以确保其准确、完整且可读。组织需要定期测试从备份介质恢复数据的能力，以确保在硬件故障或灾难发生可以这样做。\n\
  \n从表面上看，这似乎很容易。但俗所说，细节决定成败。有一些注意事项，包括：\n\n* **数据恢复与灾难恢复：** 备份主要有两个原因：\n    * **数据恢复：**\
  \ 当各种情况需要恢复过去状态的数据时。\n    * **灾难恢复：** 当事件导致主系统损坏时，需要在备用系统中恢复数据。\n    对于数据恢复，你希望备份介质（无论何种）在逻辑和物理上靠近生产系统，以便于数据恢复的物流。然而，灾难恢复要求备份介质远离主处理站点，以免受到同一场自然灾害的影响。这两者是相互矛盾的；组织有时通过创建两套备份介质来解决：一套留在主处理中心，另一套存储在安全的异地设施。\n\
  * **数据完整性：** 对于将数据回滚到早期日期和时间的需求，确切知道需要恢复哪些数据至关重要。数据库管理系统执行名为 `引用完整性` 的规则。这意味着数据库不能恢复到破坏索引、表和外键之间关系的状态。这个问题在具有多个不同数据库（有时属于不同组织）的大型分布式系统中经常出现。\n\
  * **版本控制：** 对于将数据回滚到早期状态的需求，人员还需要考虑到相互依赖的所有程序和数据库设计变更。例如，将数据回滚到上周的某个点可能还需要回滚相关的计算机程序，如果应用程序涉及代码和数据的更改。此外，回滚到更早的时间点可能涉及其他组件，如运行时库、`Java`\
  \ 等子系统，甚至是操作系统版本和补丁。\n\n\n\n\n-   分阶段环境（Staging environments）：根据从过去的某个时间点恢复数据的原因，将数据恢复到独立的环境中可能是合适的。例如，如果电子商务环境中的某些交易丢失了，那么将包括丢失交易在内的数据恢复到测试服务器上是有意义的，这样就可以找到这些交易。如果将较旧的数据恢复到主生产环境，将有效地清除从该时间点到目前的所有交易。\n\
  \n### 培训与意识\n\n组织需要衡量安全培训和意识计划的参与程度和有效性。这将确保组织各个层级的个人都理解如何应对新出现和不断演变的威胁及漏洞。安全意识培训将在第\
  \ 3 章中进行讨论。\n\n### 灾难恢复与业务连续性\n\n组织需要定期审查和测试其灾难恢复（DR）和业务连续性（BC）计划，以确定恢复计划是最新的，并能够在发生灾难时成功维持关键业务流程。灾难恢复和业务连续性计划的开发与测试将在第\
  \ 3 章和第 9 章中进行讨论。\n\n![tip](img/tip.png) 信息安全持续监控（ISCM）在 NIST SP 800-137 中定义为“维持对信息安全、漏洞和威胁的持续感知，以支持组织风险管理决策”。ISCM\
  \ 策略有助于组织在动态环境中系统地维护一个有效的安全管理计划。\n\n## 分析测试输出并生成报告\n\n各种系统和工具能够产生大量的日志和测试数据。如果没有适当的分析和解读，这些报告是毫无用的或者可能会在脱离上下文的情况下被使用。安全专业人员必须能够分析日志和测试数据，并以意义的方式报告这些信息，以便高级管理层了解组织风险并做出明智的安全决策。\n\
  \n通常要求为不同的受众开发测试输出和报告，并以对他们有用的形式提供信息。例如，漏洞扫描报告的输出包含 IP 地址列表、DNS 名称以及带有相应的常见漏洞披露代码（`CVEs`）和\
  \ `CVSS` 的漏洞列表，这对于系统工程师和网络工程师来说是有用的，他们会将此类报告作为待修复的各个缺陷列表。但如果将该报告交给高级高管，他几乎不知道报告是关于什么的，或者在业务术语中意味着什么。对于高级高管，漏洞扫描数据应该汇总为有意义的业务指标和关键风险指标，以告知高级管理层风险水平的任何重大变化。\n\
  \n对于信息安全专业人员来说，这里的关键在于了解数据的含义并根据各种目的和不同的受众对其进行转换。做得良好的安全专业人员更容易获得获得额外工具和人员的资金。这是因为他们能够用业务术语表述对资源的需求。\n\
  \n## 执行或促进安全审计\n\n*审计*（Auditing）是检查系统和/或业务流程的过程，以确保它们已经过妥善设计、正在被正确使用，并被认为是有效的。审计通常由独立的第三方或组织内部的独立小组执行。这有助于确保审计结果准确的，且不会因为组织政治或其他情况而产生偏差。\n\
  \n经常进行审计是为了确保组织符合业务或安全政策以及该业务可能面临的其他要求。这些政策和要求可以包括政府法律法规、法律合同，以及行业或贸易集团的标准和最佳实践。\n\
  \n内部审计和外部审计涉及的主要因素包括：\n\n-   **目的和范围**（Purpose and scope）。被审计组织的管理层和执行审计的人都需要充分理解内部或外部审计的原因以及审计范围。范围可能包括以下因素的一个或多个：\n\
  \    - 组织业务部门和部门\n    - 地理位置\n    - 业务流程、系统和网络\n    - 时间段\n-   **适用标准或法规**（Applicable\
  \ standards or regulations）。审计通常是在法律、法规或标准的指导下进行的。这通常将决定诸如谁可以执行审计、审计员资质、审计类型、审计范围以及被审计组织在审计结束时的义务。\n\
  -   **审计员资质**（Qualifications of auditors）。执行审计的人员通常要求具有特定的工作经验，拥有特定的培训和/或认证，或者在某些类型的公司工作。\n\
  -   **审计类型**（Types of auditing）。构成审计的审计活动有多种，包括：\n    - **观察**（Observation）。审计员被动地观察人员和/或信息系统执行的活动。\n\
  \    - **询问**（Inquiry）。审计员向控制或流程所有者提问，以了解关键活动是如何执行的。\n    - **检查**（Inspection）。审计员检查文档、记录和系统，以验证关键控制或流程是否正常运行。\n\
  \    - **重新执行**（Reperformance）。审计员亲自执行任务或交易，以查看结果是否正确。\n-   **抽样**（Sampling）。在大量群体中选择项目的过程被称为*抽样*（sampling）。法规和标准通常规定了审计所需的抽样类型和比例。\n\
  -   **管理响应**（Management response）。在某些类型的审计中，被审计组织的管理层被允许编写声明来回应审计员的发现。\n\n信息系统及相关流程审计有三个主要背景：\n\
  \n-   **内部审计**（Internal audit）：组织人员将对选定的信息系统和/或业务流程进行审计。\n-   **外部审计**（External\
  \ audit）：来自外部公司的审计员将对一个或多个信息系统和/或业务流程进行审计。\n-   **第三方审计**（Third-party audit）：内部或外部审计员将对代表组织服务的第三方提供商进行审计。例如，组织可能会部分软件开发外包给另一公司。定期，组织会对该软件开发公司进行审计，以确保其业务流程和信息系统符合相关的法规和业务要求。\n\
  \n\n\n\n\n# 安全运营\n\n### 本章内容\n\n![check](img/check.png) 理解调查\n![check](img/check.png)\
  \ 应用安全运营概念和控制\n![check](img/check.png) 响应事件\n![check](img/check.png) 为灾难做好准备\n![check](img/check.png)\
  \ 确保设施和人员安全\n\n安全运营领域涵盖了许多基础安全概念，建立在许多其他安全领域的基础上，包括安全与风险管理(第 3 章)、资产安全(第 4 章)、安全架构与工程(第\
  \ 5 章)以及通信与网络安全(第 6 章)）。安全运营代表了在许多 CISSP 领域中发生的例行操作。该领域占 CISSP 认证考试分数的 13%。\n\n\
  ## 理解并支持调查\n\n出于各种目的进行调查是安全人员的一项重要功能。你必须理解证据收集和处理程序、报告和文档要求、各种调查流程以及数字取证工具和技术。调查的成功结论在很大程度上取决于这些技能的熟练程度。\n\
  \n### 证据收集与处理\n\n证据是在法庭上提出的，用于确认或反驳有争议的事实，例如犯罪行为、违反政策或伦理问题。如果没有足够的证据支持案件，案件就无法进入审判或其他法律程序。因此，妥善收集和保护证据是调查人员必须掌握的最重要且困难的任务之一。\n\
  \nCISSP 考试涵盖的重要证据收集和处理主题包括证据类型、证据规则、证据的可接受性、监管链和证据生命周期。\n\n#### 证据类型\n\n你可以在法庭上提交的法律证据来源通常属于以下四大类：\n\
  \n* **直接证据：** 基于通过证人五感收集的信息的口头证词或书面陈述（即目击证词），用于证明或反驳特定的事实或问题。\n* **物证（或物理证据）：**\
  \ 来自实际犯罪现场的实体物体，例如使用的工具或武器以及任何被盗或损坏的财产。也可能包括在事件期间或之后生成的视觉或音频录像带。计算机犯罪的物理证据并不总是可以获得。\n\
  * **书证：** 包括业务记录的原件和副本、计算机生成和计算机存储的记录、手册、政策、标准、程序和日志文件。计算机犯罪案件中提交的大多数证据都是书证。`传言规则`（我们在本章稍后的“传言规则”节中讨论）是对书证的一项极其重要的测试，必须理解并应用于此类证据。\n\
  * **演示证据：** 用于辅助法庭理解案件。意见被视为演示证据，并可以是`专家`意见（基于个人专业知识和事实）或`非专家`意见（仅基于事实）。演示证据的其他示例还包括模型、模拟、图表和插图。\n\
  \n其他可能属于上述一个或多个主要大类别的证据类型包括：\n\n* **最佳证据：** 原始的、未经修改的证据，法庭优于次要证据的。参阅本章稍后的“最佳证据规则”节了解更多关于此类证据的信息。\n\
  * **替代证据：** 证据的复制品或副本，例如磁带备份、截图或照片。\n* **佐证：** 支持或证实案件中提出的其他证据。\n* **结论性证据：** 不可争辩且不可反驳的——你懂的，就是“冒烟枪”。\n\
  * **情况证据：** 你无法直接或确定地将其与其他事件联系起来的相关事实，但理性人可以据此做出合理的推断。\n\n#### 证据规则\n\n计算机犯罪案件中重要的证据规则包括`最佳证据规则`和`传言证据规则`。CISSP\
  \ 候选人必须理解这两条规则及其在计算机犯罪案件证据中的适用性。\n\n#### 最佳证据规则\n\n《联邦证据规则》中定义的最佳证据规则规定，“为了证明一份书面文件、录音或照片的内容，[通常]需要原始的书面文件、录音或照片。”\n\
  \n然而，《联邦证据规则》对该规则规定了一个例外，“如果数据存储在计算机或类似设备中，则任何打印输出或其他通过视觉读取的输出，只要显示能准确反映该数据，即为‘原始件’。”\n\
  \n因此，从计算机中提取出的数据——如果这些数据是原始数据的公平准确表示——就符合最佳证据规则，并通常可以作为此类证据引入诉讼程序。\n\n#### 传言规则\n\
  \n`传言证据`不是基于证人的个人第一手知识的证据，而是来自其他来源。根据《联邦证据规则》，传言证据在法庭上通常是不允许的。该规则的存在是为了防止不可靠的证词不当影响影响审判结果。\n\
  \n业务记录（包括计算机记录）传统上被大多数法庭（可能是错误的）认为是传言证据，因为这些记录无法证明其准确性和可靠性。检察官在计算机犯罪案件中克服的最重大障碍之一是寻求允许计算机记录作为证据。\n\
  \n![tip](img/tip.png) 检察官可以将计算机记录作为最佳证据而非传言证据，我们在前节中讨论过这一点。\n\n多个法院已经承认，传言规则适用于包含人类陈述的`计算机存储`记录，但不适用于未经人类手操作的`计算机生成`记录。\n\
  \n对于计算机记录，最成功且应用最广泛的接受性测试可能是美国联邦证据规则中确立的`业务记录例外`，适用于定期活动的记录，并符合以下标准：\n\n* 在行为发生时或附近（同时）制作的。\n\
  * 由了解业务流程的人制作，或由了解业务流程的人传输的信息制作的。\n* 在日常业务期间或促进业务期间产生并依赖，并由熟悉记录用途的保管人或其他证人核实。\n\
  * 出于于确保其准确性的动机而保存的。\n* 由证人定期保管（根据监管链的要求）。\n\n![tip](img/tip.png) 监管链确立了整个证据生命周期内处理证据的问责制。请参阅本章稍后的“监管链与证据生命周期”节。\n\
  \n#### 证据的可接受性\n\n由于计算机生成的证据有时可以被轻易操纵、更改或篡改，而且由于它并不容易或普遍被理解，这种类型的证据在法庭上通常被认为是可疑的。为了具有可接受性，证据必须具有\n\
  \n* **相关性：** 它必须有助于证明或反驳与案件相关且具有实质意义的事实。\n\n\n\n\n\n- **可靠性：** 必须合理地证明作为证据提交的内容确实是原始收集的内容，且证据本身是可靠的。这在部分通过适当的证据处理和监管证链（chain\
  \ of custody）来实现。（我们将在接下来的章节 `监管证链与证据生命周期]` 中讨论这一点。）\n- **法律许可性：** 必须通过合法手段获得。非法律许可的证据可能包括通过以下手段获得的证据：\n\
  \    - **非法搜查和扣押：** 执法人员必须事先获得法院命令；然而，在某些情况下，非执法人员（如主管或系统管理员）可能可以进行授权的搜查。\n    -\
  \ **非法窃听或电话监听：** 任何进行窃听或电话监听的人员都必须事先获得法院命令。\n    - **诱捕或引诱：** `Entrapment`（诱捕）鼓励某人实施其可能并无意实施的犯罪。相反，`enticement`（引诱）在个人已经实施犯罪后引导其走向某些证据（可以是“蜜罐”）。引诱并不一定违法，但它确实会引发某些伦理争议，并可能在法庭上不被采纳。\n\
  \    - **强制：** 强制证词或供词是非法律许可的。强制涉及通过威胁、暴力（酷刑）、贿赂、欺骗或恐吓迫使人员违愿地提供证据。\n    - **未经授权或不当监控：**\
  \ 监控必须经过适当授权并按标准方式进行；必须通知用户可能受到监控。\n\n## 监管证链与证据生命周期\n\n`chain of custody`（或 `chain\
  \ of evidence`）为证据的整个生命周期提供了问责和保护，并包含以下信息，这些信息通常记录在证据日志中：\n\n- **涉及人员 *(谁)*：** 识别所有发现、收集、扣押、分析、存储、保存、运输或其他方式控制证据的个人。还要识别在上述任何行动期间在场的任何证人或其他个人。\n\
  - **证据描述*(什么)*：** 确保对所有证据都进行完整且唯一的描述。\n- **证据位置*(哪里)*：** 提供证据在发现、分析、存储或运输时的具体位置信息。\n\
  - **日期/时间*(何时)*： 记录发现、收集、扣押、分析、存储或运输证据的日期时间。还要记录与该证据相关的任何证据日志条目的日期和时间信息。\n- **使用方法*(如何)*：**\
  \ 提供有关如何发现、收集、存储、保存或运输证据的具体信息。\n\n每当证据发生转移或转移到不同的媒介类型时，必须在证据日志中进行记录，以维护监管证链。\n\n\
  执法人员必须严格遵守监管证链的要求，对于任何其他参与收集或扣押证据的人员也强烈建议遵守这些要求。安全专业人员和事件响应小组必须充分理解并遵循监管证链的原则和程序，无论安全事件最初看起来是多么微小或微不足道。在这两种情况下，监管证链的作用都是证明数字证据在取证检查和分析过程中的任何时候都没有被修改。\n\
  \n即使是经过良好培训的执法人员，有时也会在处理和保存证据上犯致命错误。大多数律师不会理解你可能在案件中提供的证据的各个方面，但他们一定知道证据处理规则，并且会严格审查你在这领域的行为。处理不当的证据，无论结论有多确定或破坏性有多大，在法庭上都可能无法采纳。\n\
  \n`evidence lifecycle` 描述了证据从最初发现到最终处置的各个阶段。\n\n证据生命周期分为以下五个阶段：\n\n- 收集与识别\n- 分析\n\
  - 存储、保存与运输\n- 法庭出示\n- 最终处置——例如，归还所有者或销毁（如果是副本）\n\n以下章节将对每个阶段进行详细说明。\n\n## 收集与识别\n\
  \n收集证据涉及将该证据收归。遗憾的是，证据并不总是可以被收集，而是必须被扣押。扣押计算机和其他电子证据涉及许多法律问题。由美国司法部（DOJ）计算机犯罪与知识产权部门（CCIPS）出版的《刑事调查中的计算机搜查、扣押与证据获取（第\
  \ 3 版，2009 年）》一书，为该主题提供了全面的指导。可以通过以下网址下载该出版物：[`www.justice.gov/sites/default/files/criminal-ccips/legacy/2015/01/14/ssmanual2009.pdf`](http://www.justice.gov/sites/default/files/criminal-ccips/legacy/2015/01/14/ssmanual2009.pdf)`。\n\
  \n通常，执法人员可以在以下四种情况下的搜查和/扣押计算机和其他电子证据：\n\n- **自愿或同意：** 计算机或电子证据的所有者可以自由交出证据。\n- **传票：**\
  \ 法院向个人发出传票，要求该个人将证据提交给法院。\n- **搜查令或 Anton Piller 命令：** 法院向执法人员签发 `search warrant`，允许该人员搜查并扣押特定证据。`Anton\
  \ Piller order` 是一种法院命令，允许在不预先警告的情况下进入场所并扣押证据，通常是为了防止证据可能被毁。\n- **紧急情况：** 如果存在合理理由且证据毁在眉睫，则可以在没有许可证的情况下搜查或扣押该证据。\n\
  \n收集证据后，必须对其进行适当标记和识别。这确保了以后可以作为从现场或事件中收集的实际证据在法庭上适当提交。收集的证据必须在证据日志中记录以下信息：\n\n\
  - 对特定证据的**描述**，包括任何特定信息，如品牌、型号、序列号、外观、材料状况和预先损坏。\n- 发现和收集证据的人员**姓名**。\n- 发现/收集的准确**日期和时间、具体位置和情况**。\n\
  \n此外，必须按照以下指南对证据进行标记：\n\n- **标记证据：** 在不损坏证据的情况下，在实际证据上标记收集者的姓名缩字母、日期和案件号（如果已知）。将证据密封在适当的容器中，并再次在容器上标记相同的信息（见上一个项目符号）。\n\
  - **使用证据标签：** 如果无法对实际证据进行标记，请贴上一个与上述信息相同的证据标签，将证据和标签密封在适当的容器中，并再次在容器上标记相同的信息。\n\
  - **密封证据：** 使用证据胶带密封容器，并在胶带上进行标记，以清楚地指示任何篡改。\n- **保护证据：** 在收集和标记证据时要极度小心，以确保其不受损坏。如果你使用塑料袋作为证据容器，请确保它们是防电的以保护磁性介质。\n\
  \n\n\n\n始终以一致的方式收集并标记证据，以便在必要时能够轻松识别证据，并向法庭上的对方律师描述你的收集和识别技术。\n\n## 分析\n\n分析涉及检查证据以寻找与案件相关的信息。分析应仅由经过良好培训且经验丰富的人员以极其谨慎的态度进行，以确保证据不被篡改、损坏或销毁。\n\
  \n## 存储、保存与运输\n\n所有证据必须妥善存放在安全设施中并进行保存，以防止各种危害造成的损坏或污染，包括高热或低温、极端湿度、水、磁场和振动。未经过妥善保护的证据在法庭上可能不可采用，负责收集和存储的方可能承担法律责任。在运输过程中也必须小心，确保证据不会丢失、临时错放、损坏或销毁。\n\
  \n## 法庭出示\n\n提交到法庭的证据必须继续遵循监管链，并按照与证据生命周期中其他所有时刻相同的程度进行处理。这一过程将贯穿整个审判，直到所有与证据相关的证词完成且审判结束，或者案件结案或驳回。\n\
  \n## 最终处置\n\n审判结束或其他处置后，证据通常会归还原所有者。然而，在某些情况下，可能会强制销毁某些证据，例如违禁品、药物或吸毒器具。通过搜查令获得的任何证据在法律上受法院控制，可能需要原所有者向法院申请归还。\n\
  \n## 报告与记录\n\n如前一节所述，完整且准确的记录对于每项调查都至关重要。调查报告旨在调查的完整记录，通常包含以下内容：\n\n*   事件调查员，包括其资质和联系方式。\n\
  *   受访人员的姓名，包括其角色、参与情况和联系方式。\n*   所有收集的证据列表，包括监管链。\n*   用于检查或处理证据的工具，包括版本。\n*  \
  \ 使用的样本和取样方法（如适用）。\n*   用于检查、处理或存储证据的计算机，包括配置说明。\n*   事件的根本原因分析（如适用）。\n*   调查员的结论和意见。\n\
  *   听证会或程序。\n*   报告的接收方。\n\n## 调查技术\n\n在接到涉嫌计算机犯罪、违反政策或发生事件的报告后，应立即开始调查。任何事件在初步阶段至少应作为计算机犯罪调查或违反违反来处理，直到初步调查确定另有结论。根据调查目标或适用的法律法规，可能需要不同的调查技术。例如，事件处理需要及时性，以便尽早控制任何潜在损害。根本原因分析需要深入检查，以确定发生了什么、是如何发生的以及如何防止相同的事情再次发生。然而，在所有情况下，妥善收集和处理证据都是至关重要的。即使初步调查确定安全事件并非犯罪活动的结果，你也应该始终妥善处理任何潜在证据，以防预判会有进一步的法律诉讼，或在全面调查过程中后期发现了犯罪。CISSP\
  \ 候选人应熟悉调查过程的通俗步骤：\n\n1. **检测并控制事件。**\n   早期检测对于成功的调查至关重要。遗憾的是，与计算机相关的事件通常涉及被动或响应性的检测技术（如审计日志的审查和意外发现），这通常会留下冷证据链。控制可以最大限度地减少进一步的损失或损坏。我们在本章稍后讨论的计算机事件响应小组（`CIRT`）是通常负责进行调查的团队。在检测或怀疑计算机犯罪后，应尽快通知（或激活）`CIRT`。\n\
  \n2. **通知管理层。**\n   必须尽快通知管理层任何调查。有关调查的信息应仅限于尽可能少的人员，并遵循按需告知的原则。应使用带外通信方法（面对面报告），以确保入侵者不会拦截有关调查的敏感信息。\n\
  \n3. **进行初步调查。**\n   这项初步调查确定是否实际发生了事件或犯罪。大多数事件证明是诚实的失误而非恶意行为。这一步骤包括审查投诉或报告、检查损坏、访谈证人、检查日志并确定进一步的调查需求。\n\
  \n4. **确定组织是否应披露犯罪的发生。**\n   首先，最重要的是，确定法律或法规是否要求组织披露犯罪或事件。接下来，通过与组织的公共关系或公共事务官员协调，确定组织是否想要披露此信息。\n\
  \n5. **执行调查。**\n   执行调查涉及三项活动：\n\n   1. **识别潜在嫌疑人。**\n      潜在嫌疑人包括组织的内部人员和外部人员。帮助确定或排除潜在嫌疑人的一个标准判是\
  \ `MOM` 测试：嫌疑人是否具有动机（`Motive`）、机会（`Opportunity`）和手段（`Means`）？动机（`Motive`）可能与利益、报复或知名度有关。如果嫌疑人拥有权限（无论是作为未经授权目的的授权用户，还是由于安全缺陷或漏洞而作为未经授权目的的非法用户），则具有机会（`Opportunity`）。手段（`Means`）涉及嫌疑人是否具有实施犯罪所需的工具和技能。\n\
  \n   2. **识别潜在证人。**\n      确定你想访谈谁以及由谁进行访谈。小心不要让任何潜在嫌疑人发现调查；在证人陈述中专注于获取事实而非意见。\n\
  \n   3. **准备搜查和扣押。**\n      识别你计划搜查或扣押的系统和证据类型，指定并培训搜查扣押小组成员（通常为计算机事件响应小组 `CIRT`\
  \ 的成员），获取并送达适当搜查令（如需要），并确定搜查扣押过程中对系统的潜在风险。\n\n6. **报告你的发现。**\n   调查结果（包括证据）应报告给管理层，并根据情况交给适当的执法人员或检察官。\n\
  \n![remember](img/remember.png) `MOM` 代表 `Motive`（动机）、`Opportunity`（机会）和 `Means`（手段）。\n\
  \n## 数字取证工具、策略和程序\n\n数字取证（`Digital forensics`）是一门进行计算机事件调查的科学，旨在确定发生了什么以及谁负责，并收集法律上可接受的证据用于后续的法律程序，例如刑事调查、内部调查或诉讼。\n\
  \n\n\n\n适当的取证分析和调查需要对硬件（如终端设备和网络设备）、操作系统（包括桌面、服务器、移动设备以及其他设备操作系统，如路由器、交换机和负载均衡器）、应用程序、数据库和软件编程语言有深入了解，以及使用复杂的取证工具和工具包的知识与经验。\n\
  \n取证数据收集技术的类型包括：\n\n* **硬盘取证。** 在这里，使用专用工具创建计算机硬盘的一个或多个在取证上完全相同的副本。通常使用一种名为 `write\
  \ blocker` 的设备来防止对原始硬盘进行任何可能的修改。可以使用密码哈校验和来验证取证副本是否是原始磁盘的精确复制。\n\n然后，使用工具来检查硬盘的内容，以确定：\n\
  \n  * 计算机的最后已知状态\n  *   访问文件的历史\n  *   创建文件的历史\n  *   删除文件的历史\n  *   执行程序的历史\n \
  \ *   浏览器访问过的网站的历史\n  *   用户尝试删除证据的记录\n\n* **现场取证。** 在这里，使用专用工具来检查运行中的系统，包括：\n\n\
  \  *   运行中的进程\n  *   当前打开的文件\n  *   主存储（RAM）的内容\n  *   按键记录\n  *   计算机进出的通信流量\n\n\
  现场取证执行起来很难，因为用于收集信息的工具也可能影响被检查的系统。\n\n## 理解调查类型的要求\n\n`investigation`（调查）的目的是确定发生了什么以及是谁负责，并收集支持这一假设的证据。与调查密切相关但有明显区别的是事件管理（在本章的后后部分将详细讨论）。事件管理确定发生了什么、遏制并评估损害，以及恢复正常运行。\n\
  \n调查和事件管理通常必须以良好协调且受控的方式同时进行，以确保任何一项活动的初始行动都不会破坏证据或对组织的资产造成进一步的损害。因此，计算机事件（或应急）响应小组（分别缩写为\
  \ `CIRT` 或 `CERT`，或计算机安全事件响应小组 - `CSIRT`）必须经过适当培训并具备资质，以便在保护证据的同时确保计算机相关犯罪现场或事件的现场。理想情况下，`CIRT`\
  \ 包含将实际进行调查的人员。\n\n这的一个类比是发现谋杀受害者的巡警。巡警迅速评估形势的安全性并保护犯罪现场是重要的，但同时，他必须小心不要干扰或破坏任何证据。谋杀侦探的工作是收集和分析证据。理想情况下（但很少见），谋杀侦探将是发现谋杀受害者的个人，使她能够评估形势的安全性、保护犯罪现场并开始收集证据。把自己想象成一个\
  \ `CSI`-SSP 吧！\n\n各种调查类型的不同需求包括：\n\n* **运营性。** 在安全事件造成的任何损害被遏制后，运营调查通常侧重于根源分析、教训总结和管理报告。\n\
  * **刑事性。** 刑事调查要求严格遵守适当的证据收集和处理程序。调查重点是发现并保护证据，以便对任何有责任方进行可能的起诉。\n* **民事性。** 民事调查可能源于数据泄露或违反法规，通常侧重于量化任何损害并确定尽职调查或过失。\n\
  * **监管性。** 监管调查通常以外部强制审计的形式出现，侧重于评估安全控制和合规性。\n\n各种行业标准和指南为开展调查提供了指导。这些包括美国律师协会（ABA）的《内部调查最佳实践》、发布的各种最佳实践指南和工具包、美国司法部（DOJ）以及国际\
  \ ASTM 协会《计算机取证标准》（ASTM E2763）。\n\n## 执行日志和监控\n\n事件日志是 IT 运营不可或缺的一部分。越来越多，组织正在实施安全信息和事件管理（`SIEM`）平台。\n\
  \n### 入侵检测与防御\n\n`Intusion detection`（入侵检测）是一种用于检测网络上未经授权活动的被动技术。今天使用的入侵检测系统包括：\n\
  \n* **基于网络的入侵检测 (NIDS)：** 连接到网络上的独立设备，通过各种方法（我们在下文中描述）检测异常活动。\n* **基于主机的入侵检测 (HIDS)：**\
  \ 这是网络检测的一个子集，监控目标主机的流量。\n* **无线入侵检测 (WIDS)：** 这是另一种网络入侵检测类型，通过扫描非法接入点关注无线入侵。\n\n\
  基于网络和基于主机的 IDS 都使用两种方法：\n\n* **基于签名。** `signature-based` IDS 将观察到的流量与签名文件中的模式进行比较。基于签名的\
  \ IDS 检测任何已知攻击集，但如果入侵者能够更改他使用的模式，那么他的攻击可能会绕过 IDS 而不被发现。基于签名的 IDS 的另一个缺点是签名文件必须频繁更新。\n\
  * **基于信誉。** 与基于签名类似，基于信誉的警报旨在检测通信和其他活动是否涉及恶意域名和 IP 网络。某些 IDS 每天更新多次，包括添加到恶意域名和 IP\
  \ 地址列表中。然后，当任何活动与已知恶意域名或 IP 地址关联时，IDS 可以创建让人员获知活动的警报。\n* **基于异常。** `anomaly-based`\
  \ IDS 监控网络流量并建立配置文件。随着时间的推移，IDS 将报告与其建立的配置文件之间的偏差。基于异常的 IDS 的优点是不定期更新签名文件。缺点是可能会产生大量的误报。基于行为和启发式的\
  \ IDS 与基于异常的 IDS 相似，共享许多优点。与其检测正常流量模式的异常，基于行为和启发式的系统试图识别并学习潜在的攻击模式。\n\n\n\n安全信息和事件管理（SIEM）解决方案为各种网络源（如防火墙、IDS/IPS、路由器、交换机、服务器和工作站）生成的安全日志和告警提供实时收集、分析、关联和展示。\n\
  \nSIEM 解决方案可以是基于软件的也可以基于硬件设备的，并且可以在内部托管和管理，也可以由托管的安全服务提供商进行管理。\n\nSIEM 需要大量的前期配置和调优，以便只有最重要、具有操作性的事件才会引起组织内员工的注意。然而，这种努力是值得的：SIEM\
  \ 每天处理数百万甚至数十亿次事件，并仅呈现最重要的少数几个可操作的事件，以便安全团队能够采取适当行动。\n\n许多 SIEM 平台还具有接受包括 SIEM 制造商在内的各种供应商提供的威胁情报馈。这使得\
  \ SIEM 能够针对最新的威胁自动调整其检测和拦截能力。\n\n### 持续监控\n\n持续监控技术近实时地收集并报告安全数据。持续监控组件可能包括：\n\n\
  *   **发现：** 对网络和信息资产进行持续盘点，包括硬件、软件和敏感数据。\n*   **评估：** 对信息资产进行自动扫描和基线建立，以识别并优先处理漏洞。\n\
  *   **威胁情报：** 来自一个或多个外部组织的馈送，产生高质量、可操作的数据。\n*   **审计：** 对设备配置以及对既定策略和监管要求的合规性进行近实时评估。\n\
  *   **补丁：** 自动安装安全补丁和更新软件。\n*   **报告：** 聚合、分析和关联日志信息及告警。\n\n### 出站监控\n\n出站监控（或外泄检测）是监控出站流量以发现潜在数据泄露（或丢失）的过程。现代网络攻击为了窃取数据，采用了各种隐身技术以尽可能地避免被检测。这些技术可能包括使用加密（如\
  \ `SSL/TLS`）和隐图术（在第 4 章中讨论）。\n\n数据泄露防护（DLP）系统通常用于检测电子邮件、数据上传、PNG 或 JPEG 图像以及其他通信形式中的敏感数据外泄，例如个人身份信息（PII）或受保护健康信息（PHI）。这些技术通常执行深度包检测（`DPI`），以解密并检查经\
  \ `TLS` 加密的出站流量。\n\nDLP 系统还可以用于禁用服务器和工作站上的可移动介质驱动接口，并加密写入可移动介质的数据。\n\n`Static DLP`\
  \ 工具用于发现数据库、文件服务器和其他数据存储系统中的敏感数据和专有数据。\n\n## 安全地配置资源\n\n组织的信息架构是动态的且在不断变化。因此，其安全态势也是动态的且不断变化的。各种信息资源的配置（和退役）可能会对组织的安全态势产生重大影响（包括直接影响和间接影响）。例如，应用程序可能会直接向环境中引入新漏洞，可能会以损害数据库完整性的方式与数据库集成。由于这些原因，安全规划和分析必须是每个组织资源配置过程以及生命周期中不可或缺的一部分，并贯穿于所有资源的生命周期中。重要的安全考量包括：\n\
  \n*   **资产盘点。** 维护完整准确的盘点对于确保环境中所有潜在漏洞和风险都能被识别、评估和处理至关重要。事实上，许多其他关键安全流程都依赖于良好的资产盘点，因此资产盘点是\
  \ IT 组织中最重要的（尽管很枯燥）活动之一。\n    ![tip](img/tip.png) 资产盘点是著名的 CIS 20 控制措施中的第一项控制。资产盘点之所以排第一，是因为它是大多数其他安全控制的基础。\n\
  *   **变更管理。** 变更管理过程用于严格控制生产环境中系统的变更，以确保只进行经过适当请求和批准的变更。\n*   **配置管理。** 需要实施并严格执行配置管理过程，以确保信息资源以安全的方式运行。组织通常会实现一个自动化的配置管理数据库（`CMDB`），它是用于管理资产盘数据的数据的配置管理系统的一部分。它通常也用于管理系统的配置历史。\n\
  *   **物理资产。** 物理资产必须防止丢失、损坏或被盗窃。存储在物理资产上的价值或敏感数据价值可能远超过资产本身的价值。\n*   **虚拟资产。** 随着虚拟化技术和软件定义网络（`SDN`）的普及，虚拟机泛胀日益成为组织面临的问题。虚拟机（`VMs`）可以在几分钟内完成配置（且通常确实如此），但在不再需要时并不总是能得到妥善退役。休眠的\
  \ `VMs` 通常不进行备份，并且可能几个月不打补丁，这使组织面临因未打补丁的安全漏洞带来的增加风险。\n    安全人员特别担心的是在没有适当审查和批准的情况下实施\
  \ `VMs`。在虚拟化之前这不是一个问题，因为组织有其他的检查和平衡机制来防止实施未经授权的系统（即采购流程）。但 `VMs` 可以单方面实施，通常在组织内其他人员不知情的情况下进行。\n\
  *   **云资产。** 随着越来越多的组织采用包括软件即服务（`SaaS`）、平台即服务（`PaaS`）和基础设施即服务（`IaaS`）解决方案的云策略，跟踪这些资产非常重要。最终，组织对其应用程序和数据的安全隐私负责——而不是云服务提供商。数据存储和跨境数据流的问题需要考虑。\n\
  \    一种被称为云访问安全代理（`CASB`）的新型安全工具可以检测对云服务的访问和使用。这些工具让组织对其授权和未授权云服务的使用具有更高的可见性。许多\
  \ `CASB` 系统与云服务协作，用于控制云服务的使用。\n*   **应用程序。** 包括商业应用程序和自定义应用程序、私有云、Web 服务、软件即服务（`SaaS`）以及应用程序组件之间的接口和集成。确保这些资产配置的安全需要严格的访问控制；只有指定的管理员才能对其进行部署和配置。\n\
  \n## 理解并应用基础安全操作概念\n\n需要良好理解和管理的基础安全操作概念包括`知情需要`和`最小权限`原则、职责与责任分离、`特权权限监控`、岗位轮换、信息生命周期管理以及服务水平协议。\n\
  \n### 知情需要和最小权限\n\n\n\n\n“知情权”（need-to-know）概念是指，只有具有正当业务理由的人才有权访问特定的信息或功能。除了具有知情需求外，个人还必须具备适当的安全密级别才能被授予访问权限。相反，具有适当安全密级别但没有知情需求的个人，不应被授予访问权限。\n\
  \n管理知情权面临的最困难的挑战之一是使用强制执行知情权的控制措施。此外，信息所有者需要能够区分“我需要知道”与“我想知道”、“我想让自己显得很重要”以及“我只是好奇”。\n\
  \n知情权与**最小权限**的概念密切相关，并可以帮助组织以务实的方式实施最小权限。\n\n`最小权限`（least privilege）原则规定，人员应仅具备执行主要工作所需的能力（或仅访问其所需的数据），而不能更多。\n\
  \n给个人提供比需求更多的权限和访问会招来麻烦。提供超出工作所需的能力可能会变成一种诱惑，迟早会导致权限的滥用。\n\n例如，赋予用户对网络共享的完全权限，而不是仅仅对特定目录的读取和修改权限，这不仅为滥用这些权限打开了大门（例如，读取或复制网络共享上的其他敏感信息），还可能导致代价性的错误（不小心删除了文件——甚至是整个目录！）。作为一个起点，组织应该以“拒绝所有”的心态来处理权限，然后根据需要添加所需的权限。\n\
  \n![tip](img/tip.png) 最小权限与后续章节描述的**职责分离**（separation of duties and responsibilities）也密切相关。将特定工作职的职责分配给几个人，意味着这些个人对系统或资源所需的权限更少。\n\
  \n![remember](img/remember.png) **最小权限**原则规定，人们应该拥有完成其任务所必需的最少权限。\n\n## 与知情权和最小权限相关的若干重要概念包括：\n\
  \n*   **权限（Entitlement）。** 当组织中配置一个新用户帐户时，授予该账户的权限必须与用户所需的访问级别相匹配。在许多组织中，人力资源部门简单地指示\
  \ IT 部门给新用户“某某（同部门的另一个用户）所拥的所有权限”。相反，权限划分应基于最小权限原则。\n*   **聚合（Aggregation）。** 当人员在组织内部不同的工作和/或部门之间转换时（参见本章后文关于职位轮换的章节），他们通常需要不同的访问权限和能力来完成新工作。很多时候，组织安全流程未能充分确保个人不再需要的访问权限已实际撤销。相反，个人会积累权限，在多年以后，员工拥有的访问权限和权限可能远超过其实际需求。这被称为`聚合`，它是最小权限原则的对立面！\n\
  \    *   `权限膨胀`（Privilege creep）是这里常用的另一个术语。\n*   **传递信任（Transitive trust）。** 信任关系（安全域背景下）通常建立在组织内部及组织之间，以便于访问和协作。信任关系允许一个安全域中的主体（如用户或进程）访问另一个安全域中的对象（如服务器或应用程序）（参见第\
  \ 5 章和第 7 章了解更多关于对象和主体）。传递信任将访问权限扩展到安全域的子域（类似于继承父目录结构内子目录的权限）。相反，应该实施非传递信任，要求根据最小权限原则显式授予每个子域的访问权限，而不是继承。\n\
  \n## 职责分离\n\n`职责分离`（separation of duties and responsibilities）概念确保没有个人对关键系统或过程拥有完全权限和控制权。这种做法通过以下方式促进安全性：\n\
  \n*   **减少欺诈或滥用的机会：** 为了发生欺诈或滥用，必须有两个或多个个人在执行职责时串通或协助。\n*   **减少错误：** 因为由两个或多个个人执行该过程，错误发生的概率较低，或者错误能更快被发现和纠正。\n\
  *   **减少对个人的依赖：** 关键过程由个人小组或团队完成。应对对过程不同部分的多个个人进行培训（例如，通过后续章节讨论的职位轮换），以确保某人的缺席不会延迟或阻碍过程中步骤的成功完成。\n\
  \n以下是组织内部职责分离的一些常见示例：\n\n*   银行将六位保险箱密码的前三个数字分配给一名员工，将后三个数字分配给另一名员工。单个员工不允许拥有全部六个数字，因此单个员工无法打开保险箱并盗取内容。\n\
  *   会计部门可能会将录入和内部审计功能分开，或将应付账款和支票支付功能分开。\n*   系统管理员负责设置新帐户并分配权限，然后由安全管理员进行验证。\n\
  *   程序员开发软件代码，但由另一个人负责测试和验证，而另另一个人负责将代码加载到生产系统。\n*   机密材料的销毁可能需要两个个人来完成或见证销毁。\n\
  *   资产处置可能需要办公室经理签字批准以及大楼安全人员的验证。\n\n在较小的组织中，由于人员和资源有限，职责分离可能难以实施。\n\n## 特权账户管理\n\
  \n`特权实体控制`（privileged entity controls）是通常内置在计算机操作系统和网络设备中的机制，提供了对硬件、软件和数据的特殊访问。在\
  \ UNIX 和 Windows 中，允许特权函数的控制位于操作系统中。服务器、桌面电脑以及许多其他设备的操作系统使用执行`模式`的概念来定义系统中各种各种用户帐户、应用程序和进程的权限级别。例如，UNIX\
  \ 的 `root` 帐户和 Windows Server 企业、域和本地管理员帐户角色具有特权权限，允许这些帐户安装软件、查看整个文件系统，并在某些情况下直接访问操作系统内核和内存。\n\
  \n专用工具用于监控和记录特权用户及管理员的操作。这有助于确保每位管理员的责任制，并通过查看管理员的操作来辅助故障排除。\n\n\n\n\n\n系统或网络管理员通常使用特权账户执行操作系统和实用程序管理功能。主管（Supervisor）或管理员（Administrator）模式应仅用于系统管理目的。遗憾的是，许多组织允许系统和网络管理员将这些特权账户或角色作为其普通用户账户，即使他们没有进行需要此类级别访问权限的工作。另一种糟糕的安全实践是允许管理员共享单一的“administrator”或“root”账户。\n\
  \n![warning](img/warning.png) 系统或网络管理员为了方便起见，偶尔会向普通应用程序授予 `root` 或 `administrator`\
  \ 权限，而不是花时间准确确定该应用程序实际需要哪些权限，然后为该应用程序创建一个仅具有这些权限的账户角色。允许普通应用程序拥有这些特权是一个严重的错误，因为在特权模式下运行的应用程序会绕过部分或全部安全控制，这可能导致意外的应用程序行为。例如，工资应用程序的任何用户都可以查看或更改任何人的数据，因为运行在特权模式下的应用程序从未被操作系统告诉过“不”。此外，如果运行在特权模式下的应用程序被攻击者破解，攻击者可能会继承整个系统的特权访问权限。\n\
  \n![tip](img/tip.png) 黑客专门针对主管模式和其他特权模式，因为这些模式对系统拥有巨大的权力。应尽可能限制主管模式的使用，特别是在终端用户工作站上。\n\
  \n## 工作轮换\n\n`Job rotation`（或 `rotation of duties`，职责轮）是另一种有效的安全控制措施，能为组织带来许多益处。与职责和责任分离的概念类似，工作轮换涉及定期（或随机）将关键人员转移到组织内不同的职位或部门，无论是否通知。工作轮换可以实现几个重要的组织目标：\n\
  \n- **减少欺诈或滥用的机会。** 定期的工作轮换可以通过以下两种方式实现这一目标：\n    - 人们会迟于建立定期或惯性偷取公司信息的手段，因为他们知道自己可能在任何时候被调到另一个班次或任务。\n\
  \    - 人们之间的工作时间不够长，不足以形成可能损害公司的合谋关系。\n- **消除单点故障。** 通过确保组织或部门内的许多人知道如何执行几种不同的工作功能，组织可以减少对个人的依赖，从而在个人因缺席、丧失能力、离职或其他由于原因无法执行关键工作功能时消除单点故障。\n\
  - **促进专业成长。** 通过交叉培训机会，工作轮换可以帮助个人的专业成长和职业发展，并减少单调和/或疲劳。\n\n工作轮换还可以包括更换员工的工作站和工作位置，这也可以让潜在的破坏者措乱无措，降低犯罪可能性。\n\
  \n与职责分离的做法一样，小型组织在实施工作轮换可能会遇到困难。\n\n## 信息生命周期\n\n信息生命周期是指与组织信息的引入、使用和处置相关的活动。信息生命周期的阶段通常为\n\
  \n- **计划（Plan）。** 开发如何创建和使用信息的正式计划。\n- **创建（Creation）。** 以某种方式创建、收集、接收或捕信息。\n- **存储（Store）。**\
  \ 将信息存储在信息系统中。\n- **使用（Use）。** 对信息的使用、维护并可能进行传播。\n- **保护（Protection）。** 根据关键性和敏感性对信息进行保护。\n\
  - **处置（Disposal）。** 服务寿命结束的信息被丢弃。敏感信息将使用技术擦除以防止其恢复。\n\n![tip](img/tip.png) 欧盟的《通用数据保护条例》（`GDPR`）和其他隐私法规通过赋予数据主体关于其信息使用的法律权利，揭示了信息生命周期中的步骤。\n\
  \n## 服务水平协议\n\n业务或任务关键型信息系统的用户需要知道在他们需要时，系统或服务是否能够正常运行，用户需要知道的不仅仅是“它在线吗？”或“它*又*离线了吗？”。他们的客户和其他人员要求用户负责及时、准确地完成工作，因此，这些用户需要知道他们是否可以依赖自己的系统和服务来帮助他们按承诺交付成果。\n\
  \n服务水平协议（`SLA`）是一份准法律文件（当它包含在合同中或被合同引用时，它是真正的法律文件），承诺系统或服务达到一组最低标准，例如\n\n- **可用性小时数（Hours\
  \ of availability）：** 系统或服务可供用户使用的时钟小时。这可能是 24 x 7（每天 24 小时，每周 7 天）或更有限的时间，例如每天从凌晨\
  \ 4:00 到中午 12:00。可用性规范可能还会引用`维护窗口`（例如，周日凌晨 2:00 到 4:00），此时用户可以预期系统或服务将处于离机状态，进行测试、升级和维护。\n\
  - **平均和高峰并发用户（Average and peak number of concurrent users）：** 同时使用系统或服务的最大用户数。\n\
  - **事务吞吐量（Transaction throughput）：** 系统或服务在给定时间内可以执行或支持的事务数。通常，`throughput` 以每秒、每分钟或每小时的事务表示。\n\
  - **事务准确性（Transaction accuracy）：** 系统或服务执行的事务的准确性。通常，这与复杂的计算（如计算销售税）和位置数据的准确性有关。\n\
  - **数据存储容量（Data storage capacity）：** 用户在系统或服务中可以存储的数据量（如云存储）。容量可以用原始术（兆字节或千字节）或事务数量表示。\n\
  - **响应时间（Response times）：** 关键事务所需的最长时间（以秒为单位）。长时间过程（例如夜间运行、批处理作业等）的响应时间也应该包含在 `SLA`\
  \ 中。\n- **服务台台响应和解决时间（Service desk response and resolution times）：** 服务台台（或帮助台）响应支持请求和解决问题所需的时间（通常以小时为单位）。\n\
  - **平均故障间隔（Mean Time Between Failures, `MTBF`）：** 组件（如服务器硬盘）或系统预计发生故障前连续运行的时间（通常以数千小时为单位）。\n\
  - **平均恢复服务时间（Mean Time to Restore Service, `MTRS`）：** 发生故障后，预计恢复系统正常运行所需的时间（通常以分钟或小时为单位）。\n\
  - **安全事件响应时间（Security incident response times）：** 从发现安全事件到向数据所有者和其他影响方通知的时间（通常以小时或天为单位）。\n\
  - **故障期间的升级流程（Escalate process during times of failure）：** 当出现故障时，服务提供商多快联系客户，以及提供商将采取哪些步骤恢复服务。\n\
  \n![remember](img/remember.png) 可用性是信息安全三要素之一（机密性、完整性和可用性，在第 3 章](#c03.xhtml) 中讨论）。因此，SLA\
  \ 是一份重要的安全文件。\n\n\n\n\n\n由于 SLA（服务水平协议）是一个量化的声明，服务提供商和用户都可以进行测量，以查看服务提供商满足 SLA 标准的情况。这种测量通常伴随着分析，经常被称为\
  \ `scorecard`（评分卡）。\n\n![tip](img/tip.png) 运营级协议（OLAs）和支撑合同（UC）是重要的 SLA 支持文档。OLA\
  \ 本质上是负责 SLA 条款的不同相互依赖的小组之间的 SLA，例如服务台台和桌面支持团队之间的协议。UC 用于管理与协助支持 SLA 的实体之间的关系，例如外部服务提供商或供应商。\n\
  \n最后，为了让一份 SLA 具有意义，它必须具有“威慑力”！SLA 如何执行？当发生违规时会发生什么？升级程序是什么？如果发生违规，是否会支付罚款或服务额度积分？如果是，如何计算罚款或额度积分？\n\
  \n![tip](img/tip.png) 内部 SLA（以及 OLA），例如 IT 部门与其用户之间的协议，通常不为服务违规提供罚款或服务额度积分。内部 SLA\
  \ 的结构更多是 IT 与用户社区之间的承诺，有助于管理服务预期。明确定义的升级程序（谁被通知问题；何时、如何以及何时向指挥链上层汇报）在内部 SLA 中至关重要。\n\
  \n![tip](img/tip.png) SLA 很少（如果有的话）为服务违规提供有意义的财务罚款。例如，互联网停机一小时可能会导致电子商务公司损失 10,000\
  \ 美元的业务。但大多数服务提供商通常只会提供等于丢失一小时互联网服务费的额度积分（几百美元）。这看起来可能极其不比例，但请从服务提供商的角度考虑：同样的额度必须提供给\
  \ `all` 经历停机的客户。因此，一次停机可能会让服务提供商损失数十万。如果服务提供商有法律义务赔偿每位客户的实际损失，可以推断没有人会从事互联网服务业务（或者一条\
  \ T-1 电路每月将要花费几千美元）。相反，请寻找此类惩罚措施，例如提前终止条款，如果您的服务提供商反复未能履行服务水平义务，该条款允许您退出长期合同。\n\n\
  ## 应用资源保护技术\n\n`Resource protection` 是保护信息资产和信息基础设施的控制措施大类。需要保护的资源包括：\n\n*   **通信硬件和软件：**\
  \ 路由器、交换机、防火墙、负载均衡器、入侵防御系统、传真机、虚拟专用网络（VPN）服务器等以及这些设备使用的软件。\n*   **计算机及其存储系统：** 所有公司服务器和客户端工作站、存储区域网络\
  \ (SAN)、网络附属存储 (NAS)、直接附加存储 (DAS)、近线和离线存储系统、云存储和备份设备。\n*   **业务数据：** 所有存储的信息，如财务数据、销售和营销信息、人员和薪资数据、客户和供应商数据、专利产品或工艺数据以及知识产权。\n\
  *   **系统数据：** 操作系统、实用程序、用户 ID 和密码文件、审计跟踪和配置文件。\n*   **备份介质：** 磁带、磁盒、移动磁盘和异地复制磁盘系统。\n\
  *   **软件：** 应用程序源代码、程序、工具、库、供应商软件和其他专有软件。\n\n### 介质管理\n\n`Media management` 指用于管理信息分类和物理介质的控制措施大类。`Data\
  \ classification` 指根据敏感性对信息进行标记的任务，以及伴随每个分类级别的后续处理、存储、传输和处置程序。物理介质同样会被标记；同样，控制措施规定了处理、存储和处置程序。参见\
  \ 第 4 章 了解更多关于数据分类的信息。\n\n财务记录、员工数据和客户信息等敏感信息必须根据建立的组织政策、标准和程序进行清晰标记、妥善存储以及适当销毁：\n\
  \n*   **标记：** 组织识别敏感信息的方式（无论是电子还是纸质版）。例如，标记可能是 `PRIVILEGED AND CONFIDENTIAL`（机密）。参见\
  \ 第 4 章 了解关于数据分类的更详细讨论。\n*   **处理：** 组织应建立处理敏感信息的程序。这些程序详细说明了员工如何运输、传输和使用此类信息，以及任何相关的限制。\n\
  *   **保护：** 这涉及两个部分：\n    *   对实际介质的物理保护，例如锁锁柜和安全的车辆。\n    *   对介质上信息的逻辑保护，例如加密。\n\
  *   **存储和备份：** 与处理类似，组织必须制定程序和要求，规定必须如何存储和备份敏感信息。\n*   **保留：** 大多数组织受各种法律法规限制，必须收集和存储某些信息，并按照规定的最短和/最长时间保留。组织必须意识到法律要求并确保符合所有规定。记录保留政策应涵盖可能位于文件服务器、文档管理系统、数据库、电子邮件系统、存档和记录管理系统中的电子记录，以及存储在异地的纸质副本和备份介质。希望比法律要求保留更信息的组织应明确说明为什么要保留此类信息。如今，拥有信息本身可能成为一种负担，因此应该是例外而非常态。\n\
  *   **销毁：** 迟早，组织必须销毁敏感信息。组织必须制定详细说明如何销毁已保留的敏感信息的程序，无论数据是纸质版还是保存为电子文件。\n\n\n\n\n\
  \n维护一个完整且准确的包含组织所有硬件和软件信息资产配置信息的库存清单，是一项重要的安全运营功能。\n\n如果没有这些信息，漏洞管理将成为一项真正艰巨的挑战。随着“自备设备”（BYOD）等流行趋势在许多组织中变得越来越普遍，组织与其信息安全负责人和终端用户合作，以确保所有使用的设备和应用程序都是组织所知晓并得到适当管理的，这是至关重要的。这使得任何固有风险都能被发现并得到解决。\n\
  \n## 执行事件管理\n\n检测、响应和修复安全问题的正式过程被称为`incident management`（也称为`security incident management`，即安全事件管理）。\n\
  \n![warning](img/warning.png) 不要将此处描述的事件管理概念与信息技术基础设施库（ITIL）服务管理最佳实践中定义的更广义的事件管理概念混淆。\n\
  \n事件管理包括以下步骤：\n\n1. **准备工作。** 事件管理在事件实际发生之前就开始。准备工作是实现快速、成功事件管理的关键。一份记录良好且定期练习的`incident\
  \ management`（或`incident response`）`plan`可以确保有效的准备。该计划应包括：\n    * **响应程序：** 包括处理不同突发情况和状况的详细程序。\n\
  \    * **响应权限：** 为计算机事件响应团队（`CIRT`）的所有成员明确界定角色、职责和权限级别。\n    * **可用资源：** 识别`CIRT`可以利用的人员、工具和外部资源（顾问和执法人员）。在可能的情况下，培训应包含对这些资源的使用。\n\
  \    * **法律审查：** 事件响应计划计划应由适当的法律顾问进行评估，以确定是否符合适用法律，并确定其是否具有执行力和可辩护性。\n\n2. **检测。**\
  \ 检测安全事件或事件的发生是事件管理的第一步，通常也是最困难的一步。检测可能通过自动化监控和告警系统发生，或者作为报告的安全事件（如丢失或被盗的移动设备）的结果。在理想情况下，检测可以在安全事件发生后实时进行，例如计算机上的防病毒软件发现的恶意软件。更多情况下，安全事件可能在很长一段时间都不会被发现（几个月或几年），例如复杂的“低速缓慢”网络攻击。确定是否发生了安全事件类似于调查过程（本章较早讨论的内容）中的检测和控制步骤，并包括定义什么构成贵组织的安全事件。\n\
  \n3. **响应。** 一旦确定发生了事件，必须立即开始对整个事件管理过程中采取的每个行动进行详细记录。你还应该确定适当的告警级别。（提诸此类问题：“这是一个孤立事件还是系统性事件？”、“个人或敏感数据是否已泄露？”以及可能违反了哪些法律？”）这些答案将帮助你决定通知谁，以及是否激活整个事件响应团队或仅激活某些成员。接下来，通知相关人员该事件的情况——包括事件响应团队成员和管理层。所有联系信息都应在事件发生前记录在，事件期间的所有通知和联系都应记录在事件日志中。\n\
  \n4. **缓解。** 这一步骤的目的是控制事件并最大限地减少进一步的损失或损害。例如，你可能需要清除病毒、拒绝访问或禁用服务以停止正在进行的事件。\n\n\
  5. **报告。** 这一步骤要求评估事件并将结果报告给适当的管理人员和部门（如适用）。评估包括确定损害的范围和原因，以及责任方（或有法律责任的方方）。\n\n\
  6. **恢复。** 恢复正常运行涉及消除事件的任何组件（例如，从系统中删除恶意软件，或禁用被盗移动设备上的电子邮件服务）。将恢复视为是将系统恢复到事件发生之前的状态。\n\
  \n7. **修复。** 修复可能包括重建系统、修复漏洞、改进保护措施以及恢复数据和服务。按照妥善识别恢复优先级的业务连续性计划（`BCP`）执行此步骤。\n\n\
  8. **教训总结。** 事件管理的最后阶段要求评估你的事件管理计划的有效性，并识别任何中学教训——这不仅应包括哪里出了问题，还应包括哪些做得很好。\n\n![remember](img/remember.png)\
  \ 调查和事件管理遵循类似的步骤，但目的不同：调查的显著特征是为可能的诉讼收集证据，而事件管理侧重于控制损害并恢复正常运行。\n\n## 运行和维护检测与预防措施\n\
  \n检测性和预防性安全措施包括各种安全技术和手段，包括：\n\n* **防火墙。** 防火墙通常部署在网络或数据中心边界以及其他网络边界（例如信任区域之间）。主机防火墙正越来越多地部署，以保护整个数据中心中的终端和虚拟服务器。防火墙将在第\
  \ 6 章中进行详细讨论。\n* **入侵检测和防御系统 (IDS/IPS)。** 入侵检测系统被动监控网络分段进出主机的流量，并对可疑活动发出告警。入侵防御系统（`IPS`）可以检测并阻止攻击，或丢弃来自攻击源的网络包。`IDS`和`IPS`已在本章较早部分以及第\
  \ 6 章中讨论。\n* **白名单和黑名单。** 白名单显式允许某些操作，例如来自已知发送者的电子邮件传递、来自特定 IP 地址范围的流量或执行受信任应用程序。黑名单则显式阻止特定操作。\n\
  * **第三方安全服务。** 第三方安全服务涵盖了广泛可能的安全服务，例如：\n    * **托管安全服务 (MSS)，** 通常涉及一个监控组织 IT 环境故障和事件的服务提供商。服务提供商还可以执行基础设施设备（如网络设备和服务器）的管理。\n\
  \    * **漏洞管理服务，** 服务提供商定期扫描内部和外部网络，然后将漏洞反馈给客户组织进行修复。\n    * **安全信息和事件管理**（`SIEM`，在本章较早部分讨论）。\n\
  \    * **IP 声誉服务，** 通常以威胁情报馈送的形式提供给组织的 `ID`、`IPS` 和防火墙。\n    * **Web 过滤，** 通过本地设备或云服务限制或阻止终端用户访问被禁类别的网站（如赌彩或色情网站），以及已知含有恶意软件的网站。\n\
  \n\n\n\n\n- **云端恶意软件检测**，作为一种服务提供，可对云端文件进行实时扫描，并利用云端的速度和规模，比传统的本地反恶意软件解决方案更快地检测和防止零日威胁。\n\
  - **云端垃圾邮件过滤**，作为一种服务提供，在垃圾邮件和钓鱼邮件到达企业网络之前对其拦截或隔离，从而显著减少邮件流量以及传输和处理不需要的潜在恶意邮件相关的性能开销。\n\
  - **DDoS 缓解**，通常部署在上游网络中，在 DDoS 流量影响客户网络、系统和应用程序之前将其丢弃或重路由。\n- **沙箱化**。沙箱允许不受信的或未知的程序在独立的、隔离的运行环境中执行，以便安全地分析任何安全威胁或漏洞。沙箱化已用于许多系统，包括反恶意软件、网络过滤和入侵防御系统\
  \ (IPS)。\n- **蜜罐和蜜罐网络**。蜜罐是一种用于吸引攻击者的诱饵系统，以便观察他们的方法和技术（有点像为好人准备的特洛木马！）。蜜罐网络是由多个蜜罐组成的网络。\n\
  - **反恶意软件**。反恶意软件（也称为 `antivirus`）软件拦截存储和打开文件的操作系统例程。反恶意软件会将正在打开或存储的文件内容与恶意软件签名数据库进行比较。如果匹配到恶意软件签名，反恶意软件将阻止文件被打开或保存，并（通常）提醒用户。企业级反恶意软件通常会向中央管理控制台发送警，以便组织的安全团队收到提醒并采取适当行动。高级反恶意软件工具使用各种高级技术（如机器学习）来检测并阻止恶意软件在系统上执行。\n\
  \n## 实现并支持补丁和漏洞管理\n\n操作系统、数据库管理系统和各种应用程序中不可避免地存在软件漏洞和缺陷，研究人员不断发现这些问题。许多漏洞是安全漏洞，允许攻击者控制目标系统并随后访问敏感数据或关键功能。补丁和漏洞管理是在发现软件漏洞和缺陷时，对其定期评估、测试、安装和验证修复程序及补丁的过程。\n\
  \n要执行补丁和漏洞管理，请遵循以下基本步骤：\n\n1. 订阅供应商和第三方组织的安全公告。\n2. 对内部和外部基础设施进行定期安全扫描，以识别配置不安全和缺少补丁的系统和应用程序。\n\
  3 对每份公告和缺失补丁进行风险分析，以确定其对贵组织的适用性和风险。\n4. 制定计划安装安全补丁或执行其他变通方案（如果有）。您的决策应基于哪种解决方案最好消除漏洞或将风险降低到可接受的水平。\n\
  5. 在测试环境中测试安全补丁或变通方案。此过程涉及确保所述功能仍正常工作，并且不会因为安装补丁或变通方案而产生意外的副作用。\n6. 在生产环境中安装安全补丁。\n\
  7. 验证补丁已正确安装且系统运行正常。\n8. 更新所有相关文档，以包含任何已做的更改或已安装的补丁。\n\n## 理解并参与变更管理流程\n\n`change\
  \ management` 是用于控制生产环境中架构和配置更改的业务流程。变更管理不仅仅是修改系统及其相互关系，它是一个请求、设计、评审、批准、实施和记录的正式流程。\n\
  \n`Configuration Management` 是一个密切相关的过程，积极管理每个系统、设备和应用程序的配置，并对这些配置进行详细记录。\n\n- ![remember](img/remember.png)\
  \ **变更管理**是一种基于批准的流程，确保只有经过批准的更改才会被实施。\n- **配置管理**是记录所有在变更管理流程批准后执行的软配置（操作系统、数据库和应用程序中的设置和参数）以及软件更改的控制。\n\
  \n## 实现恢复策略\n\n开发和实施有效的备份和恢复策略对于确保系统和数据的可用至关重要。通常实施其他技术和策略以确保关键系统的可用性，即使在故障或灾难的情况下。\n\
  \n### 备份存储策略\n\n执行备份有很多原因，核心是一个基本原则：有时会出问题，我们需要恢复数据。为了涵盖所有合理的场景，备份存储策略通常涉及以下：\n\n\
  - **安全异地存储**。将备份介存储在远程位置，距离足够远，以至于远程位置不受相同事件（天气、自然灾害、人为灾害）直接影响，但足够近，以便在合理时间内取回备份介。\n\
  - **通过安全快递运输**。这可以抑制或防止备份介在运输到远程位置期间被盗。\n- **备份介加密**。这有助于防止未经授权的第三方从备份介中恢复数据。\n\
  - **数据复制**。以近实时的方式将数据发送到异地或远程数据中心，或云存储提供商。\n\n### 恢复站点策略\n\n这些包括热备（功能完备的数据中心或其他设施，始终处于运行并对生产系统和数据进行近实时复制）、冷备（可能备有一些恢复设备但未配置，且现场没有备份数据的数据中心或设施）和温备（预置并配置了某些硬件和连接，加上备份数据的异地副本）。\n\
  \n选择恢复站点策略与成本和服务水平密切相关。你越希望在远程位置恢复数据处理操作，就越需要花费资金来构建一个按所需速度“准备就绪”的站点。\n\n简而言之：*速度成本*。\n\
  \n### 多处理站点\n\n许多大型组织为关键系统运行多个数据中心，并在各个站点之间进行实时复制和负载均衡。对于对停机几乎完全不容忍的大型商业站点来说，这是最终解决方案。事实上，设计良好的多站点应用程序即使发生整个数据中心的宕机，客户也可能毫无感知。\n\
  \n### 系统韧性、高可用性、服务质量和容错能力\n\n系统韧性、高可用性、服务质量 (QoS) 和容错能力是工程到系统中的类似特征，使其尽可能可靠：\n\n\
  - **系统韧性**。这包括消除系统设计中的*单点故障*，并在关键系统中构建故障保护机制。\n\n\n\n\n\n- **高可用性.** 这通常由集群系统和数据库组成，并被配置为主主模式（两个系统都在运行并可立即使用）或主备模式（一个系统处于活动状态，另一个处于备用状态但可以变为活动，通常在几秒钟内）。主备模式下的集群具有\
  \ `failover`（故障转移）机制，用于自动将“活动”角色从集群中的一台服务器切换到另一台。\n\n- **服务质量.** 指一种机制，提供各种服务的系统会对某些服务进行优先处理，以确保它们始终可用或达到特定的性能水平。例如，互联网协议语音（VoIP）系统通常会被优先考虑，以确保始终有足够的网络带宽，避免任何流量延迟或语音质量下降。在这种情况下，其他对延迟不那么敏感的服务（如网页浏览或文件下载）其优先级将处于较低的水平。\n\
  \n- **容错能力.** 这包括在关键组件中的工程冗余设计，例如多个电源、多个网络接口以及配置了 RAID（独立磁盘冗余阵列）的存储系统。\n\n## 实现灾难恢复\
  \ (DR) 流程\n\n各种灾难可能影响组织的业务运营。它们主要分为两大类：自然灾害和人为灾难。\n\n在许多情况下，人们使用正式的方法来预测特定灾难发生的概率。例如，`50\
  \ 年一遇平原`是一个你可能听过的术语，用于描述在 50 年内可能发生一次的河流最大物理极限。以下每种灾难发生的概率很大程度上取决于当地和区域地理：\n\n-\
  \ 火灾和爆炸\n- 地震\n- 暴风雨（雪、冰、雹、持续雨、风、尘、太阳风暴）\n- 洪水\n- 飓风、台风和气旋\n- 火山和岩浆\n- 龙卷风\n- 山滑坡\n\
  - 雪崩\n- 海啸\n- 流行病\n\n这些事件中的许多可能会产生次生影响；通常这些次生影响对业务运营的影响更大，有时影响范围比初始灾难更广（例如，农村地区的山滑坡会导致输电线路倒塌，从而导致全市停电）。其中一些影响包括：\n\
  \n- **公用事业中断:** 电力、天然气、水等\n- **通信中断:** 电话、电缆、无线、电视和广播\n- **交通中断:** 道路、机场、火车和港口关闭\n\
  - **人员疏散/不可用:** 来自家里和工作场所\n\n就好像自然灾害还不够似的，人为灾难也会中断业务运营，这些都是故意或无意行为的结果：\n\n- **事故:**\
  \ 危险物质泄露、停电、通信故障以及由于供水事故导致的洪水\n- **犯罪和恶意破坏:** 放火、恶意破坏和盗窃\n- **战争和恐怖主义:** 轰炸、破坏和其他破坏性行为\n\
  - **网络攻击/网络战争:** 拒绝服务（DoS）攻击、恶意软件、数据破坏和类似行为\n- **民变:** 骚乱、游威、罢工、病假和其他此类事件\n\n![tip](img/tip.png)\
  \ 有关灾难恢复计划更全面的参考，我们推荐阅读 `IT Disaster Recovery Planning For Dummies`。\n\n灾难以许多方式影响业务——有些显而易见，有些则并不明显。\n\
  \n- **业务建筑损坏.** 灾难可能会损坏或破坏建筑物，或使之变得无法居住。\n- **业务记录损坏.** 除了损坏建筑外，灾难还可能损坏建筑内的物品，包括业务记录，无论是纸质、微缩胶片还是电子形式。\n\
  - **业务设备损坏.** 灾难可能会损坏业务设备，包括计算机、复印机和各种其他机器。从计算器到核反应堆的任何电气或机械设备都可能在灾难中损坏。\n- **通信损坏.**\
  \ 灾难可能会损坏公共传输设施，包括电话网络（固定电话和移动网络）、数据网络，甚至是无线和卫星系统。即使企业的建筑和设备未受灾难影响，通信中断也可能是致命的。此外，其他城市受损的通信基础设施会导致许多企业的语音和数据网络瘫痪（2001\
  \ 年 9 月 11 日的袭击对美国东北部大部分地区的通信产生了立即影响；许多电信提供商在那里设有战略性的区域设施）。\n- **公用事业损坏.** 电力、水、天然气和蒸汽服务可能受到灾难的破坏。即使企业的建筑和设备未受灾难影响，公用事业中断也会导致巨大的干扰。\n\
  - **交通损坏.** 高速公路、桥梁、隧道、铁路和机场都可能在灾难中损坏。其他城市受损的通信基础设施可能会导致许多企业的语音和数据网络瘫痪。\n- **间接损害：供应商和客户.**\
  \ 如果灾难发生在关键供应商或客户所在的地区，其对业务的影响几乎与业务本身遭受损害一样严重。\n- **伤亡和生命损失.** 人口密集地区的剧烈灾难通常会导致伤亡。当员工、承包商或客户死亡或受伤时，业务会受到负面影响：客户可能减少，或者提供货物和服务的员工减少。\n\
  \n### 响应\n\n应急响应小组必须为每可能的情况做好准备。这些小组的成员需要各种专业培训来处理水渍和烟雾损坏、结构损坏、洪水和危险物质等问题。\n\n组织必须记录所有类型的响应，以便响应小组知道该做什么。应急响应文档由两大部分组成：如何响应每种事件，以及组织所使用的设施和设备的最新事实。换句话说，你希望你的团队知道如何处理水渍、烟雾损坏、结构损坏、危险物质以及许多其他问题。你的团队还需要了解公司每个设施的所有信息：在哪里找到公用事业入口、电气设备、HVAC\
  \ 设备、火控、电梯、通信、数据柜等；由哪些供应商维护和维修它们；等等。你还需要需要通建筑本身材料和构造的专家。\n\n![remember](img/remember.png)\
  \ 灾难恢复小组负责识别应急响应所有阶段所需的专家。\n\n响应应急情况分为两个活动：抢救和恢复。与此相关的是为抢救和恢复相关的成本做好财务准备。\n\n####\
  \ 抢救\n\n抢救小组关注恢复受损设施的完整功能。这种恢复包括几个活动：\n\n\n\n\n\n- **损害评估：** 对设施进行彻底检查，以确定损坏的完整范围和性质。通常由外部专家（如结构工程师）执行此类项检查。\n\
  - **资产抢救：** 从设施中移除资产，例如计算机设备、记录、家具、库存等。\n- **清理：** 对设施进行彻底清洁，以消除烟雾损坏、水渍损坏、碎片等等。通常由专门从事此类服务的外部公司执行此工作。\n\
  - **恢复设施至运行就绪状态：** 完成维修，并对设施补充物资和重新装备，使其恢复到灾难前的就绪状态。此时，设施已准备好恢复业务功能。\n\n![remember](img/remember.png)\
  \ 抢救团队主要关注设施的恢复及其恢复到运行就绪状态。\n\n## 恢复\n\n恢复包括为 BCP（业务连续性计划）团队（是的，BCP 团队——恢复涉及 BCP\
  \ 和 DRP（灾难恢复计划））提供任何物流、供应或协调，以便使备用功能站点运行。这项活动应该有详细的脚本支持，配备大量的程序和清单，以确保每个细节都得到妥善处理。\n\
  \n## 财务就绪\n\n抢救和恢复操作可能花费大量资金。组织必须为可能的高额支出（至少是正常每月运营成本的倍）做好准备，以将运营恢复到原始设施。\n\n财务就绪有多种形式，包括：\n\
  \n- **保险：** 组织可以购买保险单，支付损坏资产的更换费用，可能还会支付开展应急运营相关的其他费用。\n- **现金储备：** 组织可以留出现金购买应急资产，以及用于应急运营成本。\n\
  - **信贷额度：** 组织可以在灾难发生前建立信贷额度，以便在灾难发生时购买资产或支付应急运营费用。\n- **预购资产：** 组织可以选择提前购买用于灾难恢复目的的资产，并将这些资产存储在或靠近将要使用的地点，以便在灾难发生时投入使用。\n\
  - **协议书：** 组织可能希望建立在灾难中生效的法律协议。这些协议范围涵盖使用应急工作地点（如附近的酒店）、使用车队、征用低优先级系统使用的计算机等。\n\
  - **备用资产：** 组织可以使用现有资产作为在灾难发生时重新用途的物品。例如，如果发生灾难，用于软件测试的计算机系统可以快速重新用于生产运营。\n\n##\
  \ 人员\n\n人员是任何组织中最重要的资源。因此，在制定灾难响应计划以及应急响应人员在灾难发生后采取行动时，灾难响应必须将人类生命置于所有其他考虑之上。在生命安全方面，组织可以采取若干措施来确保人员安全：\n\
  \n- **疏散计划：** 人员需要知道如何安全地疏散建筑或工作中心。应清晰地张贴告示，并定期举行演练，以便人员练习冷静且安全地离开建筑或工作中心。对于拥有大量客户或访客的组织，需要采取额外措施，确保不熟悉疏散路线和程序的人员能够安全离开设施。\n\
  - **急救：** 组织需要手头有大量的急救物资，包括在自然灾害导致救援人员无法响应时的长期物资。在灾难发生时，人员需要接受急救和心肺复苏（CPR）培训，特别是在通信和/或运输设施中断时。\n\
  - **应急物资：** 对于需要人员就地避险的灾难，组织需要储备应急用水、食物、毯子和其他必需品，以防人员被困在工作地点超过数小时。\n\n![remember](img/remember.png)\
  \ 人员是任何组织中最重要的资源。\n\n## 通信\n\nDRP 的一个关键组成部分是通信计划。需要通知员工设施关闭以及任何特殊工作指示（例如报告上班的备用地点）。规划团队需要意识到，一种或多种常用的通信手段可能也遭受了损害业务设施的同一事件的不利影响。例如，如果某栋建筑受损，人们尝试拨打以检查信息并获取工作状态的语音邮件系统可能无法运行。\n\
  \n组织在考虑应急通信时，需要预见事件的影响。例如，您需要提前建立两种或多种方法来定位每位重要员工。这些方法可能包括固定电话、手机、配偶的手机以及备用联系电话（如邻居或亲属）。\n\
  \n![tip](img/tip.png) 即使在移动通信系统拥堵时，短信通常也是一种有效的通信手段。\n\n许多组织的应急运营计划都包括使用音频会议桥接，以便人员在整个事件期间每小时讨论一次运营问题。组织不应依赖单一提供商（由于通信问题或由于受同一事件影响，你可能无法联系到他们），而应该建立第二个（甚至可能是第三个）音频会议提供商。应急通信文档需要包括两个（或所有三个）会议系统的拨入信息。\n\
  \n除了内部通信外，DRP 必须处理外部通信，以确保客户、投资者、政府和媒体获得准确及时的信息。\n\n## 评估\n\n当灾难发生时，组织的 DRP 需要包含评估建筑和设备损坏情况的程序。\n\
  \n首先，响应团队需要检查建筑和设备，以确定哪些资产是全损的，哪些是可以修复的，哪些仍然可以使用（尽管不一定在当前位置）。\n\n对于洪水、火灾和地震等事件，通常需要专业的建筑检查员检查建筑，以确定其是否适合入住。如果不适合，下一步是确定是否允许少数人员进入建筑以检索所需的资产。\n\
  \n评估完成后，资产可以分为三类：\n\n- **抢救：** 这些是全损且无法修复的资产。在某些情况下，可以移除组件来修复其他资产。\n- **修复：** 一些资产可以修复并恢复服务。\n\
  - **重用：** 未损坏的资产可以重新投入服务，尽管如果建筑无法入住，这可能需要它们移动到其他地点。\n\n## 恢复\n\n灾难恢复团队的最终目标是恢复工作设施及其所需的资产，以便业务恢复正轨。根据事件的性质，恢复可能表现为建筑修复、建筑更换或永久迁移至另一栋建筑。\n\
  \n同样，每栋建筑中使用的资产可能需要进行自身的恢复，无论这种形式是更换、修复，还是在所选的任何地点重新投入服务。\n\n\n\n\n\n在完全恢复之前，业务运营可能会在临时设施中进行，可能由替代人员负责，这些人员可能是聘来补充和帮助的其他员工或承包商。这些临时设施可能位于原设施附近，也可能在较远处。事件的情况将决定这些某些事项，以及组织临时业务运营的计划。\n\
  \n## 培训与意识\n\n组织有效应对灾难的能力很大程度上取决于其准备工作。除了开发保持更新的高质量、可行的灾难恢复和业务连续性计划外，最重要的部分是确保员工和其他必要人员定期接受实际响应和连续性程序的培训。培训和练习有助于加强对适当响应程序的理解，为组织赢得灾难中生存的最佳机会。\n\
  \n培训的一个重要部分是参与各种类型的测试，将在下一节中讨论。\n\n## 测试灾难恢复计划\n\n当一个组织创建一个 `DRP` 时，可能已经花费了数百小时，并投入了数万（或数十）美元的咨询费。你可能会认为，在投入如此巨大的资金后，他们应该测试\
  \ `DRP`，以确保在实际灾害发生时它真的有效！\n\n以下章节概述了 `DRP` 测试方法。\n\n### 审读（Read-through）\n\n`审读`（或`检查清单测试`）是由个人独立对\
  \ `DRP` 文档进行的详细审查。审读测试的目的是识别 `DRP` 文档中的不准确、错误和遗漏。\n\n这种测试很容易协调，因为每个执行测试的人都会根据自己的时间表允许的时间进行（前提是在他们任何截止日期之前完成）。\n\
  \n单凭文档审查并不是测试 `DRP` 的充分方法；然而，它是逻辑上的起点。你应该在完成审读测试后不久，执行后续章节中描述的一个或多个其他 DR 测试。\n\n\
  ### 演练或桌面推（Walkthrough or tabletop）\n\n`演练`（或`桌面推`或`结构化演练测试`）是审读测试的团队方法。在这里，组织中的几位业务和技术专家聚集在一起，“走”\
  \ `DRP`。主持人或协调员引导参与者讨论 `DRP` 中的每一步，以便他们识别问题以及使 `DRP` 更准确、更完整的机会。小组讨论通常有助于识别人们在独立工作时无法发现的问题。通常，参与者想在华丽的山山或海边度假地进行审查，在那里他们可以思考得更清晰！（呵呵，得。）\n\
  \n在演练测试期间，当小组识别这些问题时，协调员在白板或翻页上写下“停车场”问题（以后要考虑的事项，现在写下来以防遗忘）。这些是将用于改进 `DRP` 的行动项。每个行动项都需要分配一个负责人员，以及一个完成日期，以确保行动项在合理时间内完成。根据更改的程度，可能需要在稍后时间进行一次跟进演练。\n\
  \n![tip](img/tip.png) 演练测试通常需要两个或多个小时才能完成。\n\n### 模拟（Simulation）\n\n在`模拟测试`中，所有指定的灾难恢复人员都练习与实际恢复相关的动作。在模拟中，团队实际上并不执行任何恢复或替代处理。\n\
  \n计划进行模拟测试的组织会任命一名协调员，由该协调员使用该地区可能发生的灾难类型来开发灾难场景。例如，旧金山的一个组织可能会选择地震场景，而迈阿密的一个组织可能会选择飓风场景。\n\
  \n在简单的模拟中，协调员像读新闻简报一样读公告。此类公告描述了正在展开的场景，还可以包括有关组织当时状态的信息。一个公告示例可能如下：\n\n> 现在是当地时间上午\
  \ 8:15，发生了 7.1 级地震，距离公司总部十五英里。一号楼损坏严重，部分人员重伤。二号楼（包含组织计算机系统的建筑）受损，人员无法进入建筑。电力中断，由于可能与地震相关的未知问题，发电机没有启动。高管杰夫·约翰逊和莎拉·史密斯（CIO\
  \ 和 CFO）正在阿巴拉契亚山上徒步，无法联系。\n\n灾难模拟团队在会议室集合，讨论应急响应程序以及响应可能如何展开。他们考虑描述给他们的条件，并识别任何可能影响实际灾难响应的问题。\n\
  \n模拟协调员在整个模拟过程中发布额外的公告。就像在实际灾难中一样，团队并不是立刻知道一切——相反，消息是滴出来的。在模拟中，协调员朗读写好的声明，嗯，这模拟了信息在实际灾难中流动的方式。\n\
  \n更具真实的模拟可以在组织的应急响应中心举行，那里可能提供支持应急响应的资源。另一个主意是在不提前通知的一天举行模拟，这样响应者将真的感到惊讶，并且准备工作可能不足。\n\
  \n![tip](img/tip.png) 记得测试你的备份媒体，以确保你能够从备份中恢复数据！\n\n### 并行（Parallel）\n\n`并行测试`涉及执行实际恢复的所有步骤，但你保持真实的实时生产系统运行。实际生产系统与灾难恢复系统并行运行。并行测试非常耗时，但它确实测试了应用程序的准确性，因为分析师会将测试恢复系统上的数据与生产数据进行比较。\n\
  \n目标应用程序的技术架构决定了如何进行并行测试。并行测试的般原则是，`灾难恢复系统`（即在实际灾难发生前处于备用状态的系统，发生时，组织将其投入生产服务）在主系统继续正常工作的同时运行处理工作。具体`如何`实现取决于技术细节。对于按批次处理数据的系统，可以将这些批次复制到\
  \ DR 系统进行处理，并对结果的准确性和及时进行比较。\n\n高度交互的应用程序在严格的并行测试中较难测试。相反，可能需要记录现场系统上的用户交互，然后使用应用程序测试工具“回放”这些交互。然后可以在测试后对响应、准确性和计时进行验证，以验证\
  \ DR 系统是否正常工作。\n\n虽然并行测试可能难以设置，但其结果可以很好地指示灾难恢复系统在灾难期间的表现。此外，与并行测试相关的风险较低，因为 DR 系统的故障不会影响真实的业务交易。\n\
  \n![remember](img/remember.png) 并行测试包括将数据加载到恢复系统，而不关闭生产系统。\n\n### 全面中断（或切换）\n\n\n\
  \n\n`完全中断`（或`切换`）`测试`与并行测试相似，其不同之处在于，在完全中断测试中，功能的主要系统实际上会被关闭或断开。完全中断测试是灾难恢复计划的`终极`测试，因为业务的一个或多个关键功能实际上取决于恢复系统的可用性、完整性和准确性。\n\
  \n完全中断测试应仅在成功完成演练（walkthroughs）并至少通过一次并行测试后进行。在完全中断测试中，备份系统处理整个生产负载，以及所有的主功能和辅助功能，包括：\n\
  \n* 用户访问\n* 管理员访问\n*与其他应用程序的集成\n* 支持\n* 报告\n* …… 以及主生产环境需要支持的任何其他\n\n![remember](img/remember.png)\
  \ 完全中断测试是灾难恢复系统在真实灾难中正常运行能力的终极测试，但它也是风险和成本最高的测试。\n\n## 参与业务连续性（BC）规划与演练\n\n业务连续性和灾难恢复规划密切相关，但是截然不同的活动。正如第\
  \ 3 章所述，业务连续性侧重于在灾难或其他事件发生后保持业务运行，而灾难恢复则处理将组织及其受影响的过程和能力恢复到正常运行。\n\n![tip](img/tip.png)\
  \ 如果你不记得业务连续性规划与灾难恢复规划之间的相似与差异，我们强烈建议你参考第 3 章！\n\n安全专业人员需要在其业务连续性规划活动及相关演练中发挥积极作用。作为一名\
  \ CISSP，你将成为业务连续性和灾难恢复领域的公认专家，你需要贡献你的专业知识和经验，帮助你的组织制定并实施有效且全面的业务连续性和灾难恢复计划。\n\n\
  ## 实现并管理物理安全\n\n物理安全是安全专业人员职责的另一个重要方面。重要的物理安全概念和技术在第 5 章和第 7 章中得到了广泛介绍。\n\n与其他信息安全概念一样，确保物理安全需要在物理边界（这包括建筑外围、停车场和公共区域）实施适当的控制，并在内部实施控制以（最重要的是）保护人员，并保护其他物理和信息资产免受各种威胁，如火灾、洪水、极端天气、民事动、恐怖主义、犯罪活动和职场暴力。\n\
  \n## 处理人员安全与安全问题\n\n安全专业人员通过帮助组织制定和实施有效的人员安全策略（在第 3 章中讨论），以及物理安全措施（在前节中讨论，以及第 5\
  \ 章和第 7 章中讨论），为人员的安全和保障做出贡献。\n\n![remember](img/remember.png) 在任何威胁生命的情况下，拯救生命是首要任务。\n\
  \n# 第 10 章\n\n# 软件开发安全\n\n### 本章内容\n\n![check](img/check.png) 在整个软件开发生命周期应用安全\n\
  ![check](img/check.png) 强制安全控制\n![check](img/check.png) 保护开发环境\n![check](img/check.png)\
  \ 评估软件安全性\n![check](img/check.png) 通过应用安全实践降低风险\n![check](img/check.png) 评估现成软件的安全影响\n\
  \n你必须理解软件安全控制、软件开发和软件漏洞的原理。软件和数据是信息处理的基础；软件不能脱离软件开发而存在。理解软件开发过程对于创建维护适当、可靠且安全的软件至关重要。该领域占\
  \ CISSP 认证考试的 10%。\n\n## 在软件开发生命周期中理解并整合安全\n\n`软件开发生命周期`（SDLC，也称为`系统开发生命周期`和`软件开发方法`[SDM]）指的是从构思到实现、支持直至（最终）退役开发软件和系统所需的所有步骤。换句话说，它是软件从出生到死的整个过程，旨在实现两个目标：正确且安全地运行的软件和系统，以及按时按预算完成的开发项目。\n\
  \n![tip](img/tip.png) 正如我们在书中多次提到的，`软件开发生命周期`正在让`系统开发生命周期`，因为该过程不仅适用于软件开发，更广泛地适用于系统开发。这包括网络、服务器、数据库管理系统等。\n\
  \n### 开发方法\n\n流行的开发方法包括后续节将讨论的`瀑布`和`敏捷`。\n\n#### 瀑布\n\n在软件（或系统）开发的瀑布模型`中，生命周期中的每个阶段都像瀑布一样顺序进行（参见图\
  \ 10-1）。通常，这些阶段包括：\n\n* **概念定义**：软件或系统交付物的高级描述。通常不包含细节——这是你想给业务和财务人员（那些资助你的项目并提供工作的人）的描述。你不想用细节吓到他们。而且他们可能也不懂！\n\
  * **功能需求**：软件或系统交付物要求的特性。（基本上是一个列表。）功能需求不是设计，而是软件必须执行的功能集合。虽然功能需求没有提供设计级的内容，但这种描述比概念定义更详细。功能需求通常包含一个`测试计划`，即必须测试的软件功能的详细列表。测试计划描述了如何执行每项测试以及预期结果。通常，功能需求中的每个需求在测试计划中至少对应一个测试。功能需求还必须包含预期的安全需求。\n\
  * **功能规范**：这些可以被视为软件开发部门功能需求的版本。功能规范不是“必须有”和“可以有”项的列表，更多是关于“它是什么（我们希望）”或“我们认为可以构建的”的陈述（到这一点为止，可以使用\
  \ MoSCoW 方法对需求进行排序）。功能规范并不是设计，而是开发者和工程师认为可以在现实世界中创建的特性列表。从安全的角度来看，操作系统或应用程序的功能规范应包含有关身份验证、授权、访问控制、机密性、事务审计、完整性和可用性的所有细节。\n\
  \n\n\n\n\n### 设计 (Design)\n这是开发最详细设计的过程。在应用软件领域，设计包括实体关系图、数据流图、数据库模式（schema）、网络传输协议等。对于网络而言，这包括局域网（LAN）、广域网（WAN）、子网以及将它们所有连接在一起并提供所需安全性的设备的设计。\n\
  \n### 设计评审 (Design review)\n这是设计过程的最后一步，由一组专家（其中一些成员在设计团队中，另一些则不在）对详细设计进行审查。不在设计团队的成员可以为设计提供一些新鲜的视角，并有机会发现一或两处设计缺陷。\n\
  \n### 编码 (Coding)\n这是软件开发人员和工程师渴望的阶段。大多数软件开发人员倾向于跳过所有之前的步骤（在前述章节中描述）并直接开始编码（构建内容的系统或网络工程师也是如此）——甚至在正式需求确定之前！一想到世界上有这么多软件是以编码作为首要活动创建的，这确实很可怕。（你会乘坐一架由机械师在设计师产出工程图之前就造好的飞机吗？我想不会的。）编码和系统开发通常包括`单元测试`（unit\
  \ testing），即验证在此阶段构建的所有模块和其他单个组成部分的过程。\n\n### 代码评审 (Code review)\n与设计阶段一样，软件开发的编码阶段也以代码评审结束。在评审中，开发人员检查彼此的程序代码，并就缩进级别和花括号的正确使用进行哲学争论。不过说真的，在代码评审期间，工程师可以发现某些错误，如果你在后的实现过程或维护模式中修复这些错误，将花费大量资金。有几种良好的静态和动态代码分析工具可以用来自动识别软件代码中的安全漏洞和其他错误。许多组织使用这些工具来找出编程错误，否则这些错误可能会导致攻击者可能利用的漏洞。你可以在第\
  \ 8 章中查看代码评审！\n\n### 配置评审 (Configuration review)\n对于系统开发（如操作系统和网络），配置评审阶段涉及系统或设备配置检查及类似的活动。这是一个重要的步骤，有助于验证单个组件是否已正确构建。从长期来看，这项活动有助于节省时间，因为在此阶段发现的错误可以确保后续步骤运行得更加顺畅，而且后续步骤中的错误将变得更容易排查，因为各个组件的配置已经完成。\n\
  \n### 单元测试 (Unit test)\n当应用程序或其他系统的部分开发完成后，通常可以对这些部分进行单独测试。这被称为`单元测试`（unit testing）。单元测试允许开发人员、工程师或测试人员验证应用程序或系统中单个模块的正确功能。单元测试通常在编码和其他组件开发期间进行。它并不总是作为一个独立的步骤出现在流程图中。\n\
  \n### 系统测试 (System test)\n当整个系统的所有构件组件都组装完成后，会对整个系统进行`端到端`（end to end）测试，这就发生了系统测试。在功能需求步骤中开发的测试计划在此执行。当然，系统测试包括测试系统所有的安全功能，因为程序设计人员在测试计划中包含了这些功能（对吧？）。你可以找到一些很棒的工具来对软件应用程序、操作系统、数据库管理系统、网络设备和其他事物进行严格的漏洞测试。许多组织认为使用此类工具是系统测试的必要步骤，以确保系统没有可利用的漏洞。\n\
  \n### 认证与认可 (Certification & accreditation)\n`认证`（Certification）是对应用或系统的正式评估：每个预期的功能都按照计划执行，并且系统被声明为功能完备。`认可`（Accreditation）意味着权威部门已表示可以将该系统投入生产。这可能意味着将其对外出售、构建并发货，或者根据你组织对“投入生产”的任何定义。\n\
  \n![tip](img/tip.png) (ISC)² 现在提供认证与认可专业人员（CAP）认证。如果你想让你的认可水平更上一层，可以考虑它。\n\n###\
  \ 实现 (Implementation)\n当所有的测试以及任何认证和认可完成后，软件即可发布。这通常涉及一种正式机制，由软件开发人员为运维人员创建一个“发布包”。该发布包包含了新软件，以及如何实施它的说明。实施计划通常包括回滚指令，用于将软件（以及任何更改）恢复到更改前的状态。\n\
  \n### 维护 (Maintenance)\n此时，软件或系统功能完备、已投入生产，并按照设计要求运行。维护阶段是系统的“黄金岁月”。随后，客户开始提交变更请求，因为——这就是人们所！用于控制并记录软件或系统所有变更的变更管理和配置管理将在本文后续部分进行讨论！\n\
  \n![warning](img/warning.png) 你需要良好的文档（以原始规范和设计文档的形式），因为编写该软件或构建系统的开发人员可能已经去了其他更酷的项目……甚至是另一个组织……留下了新人来维护它。\n\
  \n![image](img/978119505815-fg1001.png)\n\n图 10-1 典型的系统开发模型从项目开始到结束。\n\n#### 敏捷\
  \ (Agile)\n敏捷开发相比于传统方法（如前节介绍的瀑布模型），涉及更具迭代性、不正式的软件和系统开发方法。正如其名，敏捷开发关注支持快速且不断变化的业务需求。\n\
  \n《敏捷软件开发宣言》（[www.agilemanifesto.org](http://www.agilemanifesto.org)）描述了敏捷开发的底层哲学：\n\
  \n*   *个体和交互*优于过程和工具\n*   *可行的软件*优于详尽文档\n*   *客户协作*优于合同谈判\n*   *响应变化*优于遵循计划\n\n\
  宣言并没有忽略右侧项目（如过程和工具）的重要性，但它更关注左侧的斜体项目。\n\n敏捷开发的具体实现有许多形式。一种常见的方法是 `Scrum` 方法论。Scrum\
  \ 方法论中的典型活动和产物包括：\n\n*   **产品待办列表**（Product backlog）。这是一个经过排序的客户需求列表，通常被称为`用户故事`（user\
  \ stories），由`产品所有者`（product owner）维护。产品所有者代表项目利益相关者与 scrum 团队进行沟通。\n\n\n\n\n\n###\
  \ 用户故事\n\n-   **用户故事（User stories）。** 这些是以简短的、以客户为中心的描述形式编写的关于所需功能或特正式需求。用户故事通常采用“作为一名[角色]，我希望[某功能/特性]，以便我能够[目的]”的形式。例如，“作为一名客户服务代表，我希望能够查看完整的信用卡信息，以便我处理客户的退款。”\n\
  \n![warning](img/warning.png) 上述示例中的用户故事应该在你的脑海中响起各种警报并发出警示！这个例子说明了为什么安全专业人员需要参与到开发过程中（特别是当使用敏捷开发方法时，在这种方法中，需求是“现场”开发的，可能没有经过充分考虑，或者不是某个文档完善且全面的安全策略的一部分）。此示例中的用户可能只是在尝试执行合法的工作职，并且可能对该请求引入的潜在安全风险了解有限。如果开发人员不关注安全并且不对该需求提出挑战，那么该功能可能会按照要求交付。在开发人员看来，一个功能已按要求快速开发并无错误地交付给客户，但重大的安全风险可能在无意中且不知情地成为了软件的固有部分！这可能意味着安全部门的某人（可能是你！）需要参加开发会议，以确保风险功能不会被开发。\n\
  \n-   **冲刺计划（Sprint planning）。** 在冲刺计划期间，整个团队在头两个小时内会，并选择他们认为可以在下次`sprint`（也称为`iteration`）期间交付的产品待办列表项，冲刺通常是一个为期两周的时间箱周期。在冲刺计划会议（或活动）的接下来的两个小时内，开发团队将产品待办列表（在前两个小时选中的）分解为独立的任务，并计划冲刺期间所需的工作（包括谁来做什么）。\n\
  \n-   **每日站会（Daily standup）。** 团队成员在整个两周的冲刺期间每天举行 15 分钟的站会（或 `scrum` 会议），期间每个团队成员都要回答以下三个问题：\n\
  \n    - 我昨天完成了什么？\n    - 我今天将完成什么？\n    - 存在哪些障碍或问题可能阻碍我实现冲刺目标？\n\n每日站会由`scrum master`（敏捷大师）主持，负责跟踪（并报告）冲刺的进度，并解决每日站会期间发现任何障碍或问题。\n\
  \n-   **冲刺评审和回顾（Sprint review and retrospective）。** 在每个两周冲刺结束时，团队与产品所有者和利益相关者举行`sprint\
  \ review`会议（通常为两小时），以：\n\n    - 展示（或演示）冲刺期间完成的工作。\n    - 审查冲刺期间已计划但未完成的工作。\n\n`sprint\
  \ retrospective`（冲刺回顾）通常是一个期 90 分钟的会议。团队识别冲刺期间哪些做得很好，以及在下次冲刺中哪些可以改进。\n\n![warning](img/warning.png)\
  \ 前述的 scrum 流程是对一种可能的 Scrum 方法论的高级概述。敏捷软件开发方法的迭代次数与软件开发的迭代次数一样多！关于敏捷和 Scrum 方法论的更全面的讨论，我们推荐阅读《Agile\
  \ Project Management For Dummies》和《Scrum For Dummies》，这两本书的作者都是 Mark Layton！你可以做的另一件事是在网上对“猪和鸡”进行搜索，以了解\
  \ Scrum 方法论背后的传说。你可能会觉得很有趣。确保你找到了关于猪和鸡讨论一起开店的配套笑话。\n\n在任何敏捷开发过程中需要解决的安全关注点可能包括缺乏正式文档或全面的规划。在传统的开发方法（如瀑布模型）中，在任何实际开发工作开始之前都会大量的前期规划。这种规划可以包括创建正式测试验收标准、安全标准、设计和接口规范、详细的框架和建模，以及认证和认可要求。敏捷方法论中缺乏此类正式文档和规划本身并不是安全问题，但它意味着在敏捷开发过程整个生命周期内，安全需要让参与每个人“记在心中”。\n\
  \n### 成熟度模型\n\n需要了解其软件和系统开发过程及实践的组织可以通过衡量其成熟度来对其 SDLC（软件开发生命周期）进行基准测试。有很多衡量软件和系统开发成熟度的模型，包括：\n\
  \n-   **能力成熟度模型集成（CMMI）。** 到目前衡量软件开发成熟度最流行的模型，CMMI 是许多美国政府机构和承包商的要求。该模型定义了五个成熟级别：\n\
  \n    - **初始级（Initial）。** 过程是混乱且不可预测的，控制良好，并且是响应性的。\n    - **已管理级（Managed）。** 过程以项目为特征，但仍是响应性的。\n\
  \    - **已定义级（Defined）。** 过程被定义（写下来）并且更具主动性。\n    - **量化管理级（Quantitatively managed）。**\
  \ 过程被定义和测量。\n    - **优化级（Optimizing）。** 过程被测量和改进。\n\n关于 CMMI 的信息可以在 [`http://isaca.org`](http://isaca.org)\
  \ 获取。\n\n-   **软件保障成熟度模型（SAMM）。** 该模型是一个开放框架，旨在希望开发项目包含安全功能的组织。\n\n关于 SAMM 的更多信息可以在\
  \ [`www.opensamm.org`](http://www.opensamm.org) 获取。\n\n-   **构建安全成熟度模型（BSIMM）。**\
  \ 该模型用于衡量安全包含在软件开发过程中的程度。该模型有四个领域：\n\n    - 治理（Governance）\n    - 情报（Intelligence）\n\
  \    - 安全软件开发生命周期（SSDL）触点\n    - 部署（Deployment）\n\n信息可以从 [`www.bsimm.com`](https://www.bsimm.com)\
  \ 获取。\n\n-   **敏捷成熟度模型（AMM）。** 这是一个用于使用敏捷软件开发过程组织的软件过程改进框架。关于 AMM 的更多信息可以在这里：`www.researchgate.net/publication/45227382/Agile_Maturity_Model_(AMM)_A_Software_Process_Improvement_framework_for_Agile_Software_Development_Practices`。\n\
  \n组织可以进行自评估，也可以聘请外部专家来衡量他们的开发成熟度。有些组织选择外部专家作为增强客户信任的一种方式。\n\n\n\n\n\n- **漏洞管理。**\
  \ 人员会定期对应用程序或系统进行测试，检查其是否包含可能导致安全漏洞的安全缺陷。可能采用的测试类型包括安全扫描、漏洞评估和渗透测试。对于软件应用程序，测试还可以包括静态和动态代码审查。\n\
  - **性能管理。** 应用程序或系统可能会向日志系统写入与性能相关的条目，或者使用外部工具来测量关键系统功能的响应时间。这有助于确保系统处于健康、可用状态，并且不会消耗过度或不当的资源。\n\
  - **审计。** 只要应用程序或系统属于安全或隐私审计的范围内，内部或外部审计人员就会对应用程序或系统的运行方面进行检查，以确保应用程序或系统正在被妥善管理且运行正常。此主题将在本章稍后部分详细介绍。\n\
  \n从软件应用程序或系统投入生产环境开始，开发工作将继续，但通常速度会较慢。在此阶段，可能需要额外的开发任务，例如：\n\n- 微小功能更新\n-  修复\n\
  - 安全补丁和更新\n- 定制化修改\n\n最后，在系统服务周期结束时，它将被退役。这通常涉及三种结果之一：\n\n- **迁移到替代系统。** 在这里，旧系统中的数据可能会迁移到替代系统以保留业务记录，以便可以在替代系统中查看旧系统期间的交易历史。\n\
  - **与替代系统共存。** 在这里，可以修改旧系统，使其以“只读”模式运行，允许用户查看旧系统中的数据和记录。选择此路径的组织会将旧系统保留几个月到一年更久。当迁移数据到新系统的成本超过运行旧系统的成本时，通常采取此选项。\n\
  - **关闭。** 在某些情况下，组织将停止使用该系统。如果根据或法规规定，业务记录可能会被存档用于长期存储。\n\n![tip](img/tip.png) 这里的运行维护活动可能是组织\
  \ DevOps 流程的一部分。我们将在本章稍后讨论这一点。\n\n### 变更管理\n\n`change management` 是一种正式的业务流程，确保对系统进行的所有更改在实施之前都获得所有利益相关者的正式评审和批准。变更管理让每个人都有机会对任何建议的变更发表意见和顾虑，从而确保变更尽可能顺利地进行，不会出现意外情况或服务中断。\n\
  \n变更将在第 9 章中更详细地讨论。\n\n![remember](img/remember.png) 批准生产环境修改的过程被称为 `change management`。\n\
  \n![warning](img/warning.png) 不要将 `change management` 的概念与 `configuration management`（本章稍后讨论）混淆。两者完全不同。\n\
  \n### 集成产品团队\n\n`DevOps` 是一种流行的趋势，代表了开发（Development）与运维（Operations）的融合。它将敏捷开发实践扩展到整个\
  \ IT 组织。也许这不像提供亚意融合菜肴的美味寿司披萨餐厅那么令人兴奋，但嘿，这是软件和系统开发，不是高级餐饮！（抱歉。）。\n\n`DevOps` 的目标是改进软件/系统开发人员与\
  \ IT 运维团队之间的通信与协作，以便快速高效地部署软件和基础设施。\n\n然而，与敏捷开发方法一样，`DevOps` 环境存在必须解决的固有安全挑战。传统的\
  \ IT 组织和安全最佳实践在开发环境和生产环境之间严格分离。虽然这些区别在 `DevOps` 环境中仍然存在，但它们不再那么绝对。因此，这种情况可能会给生产环境引入额外的风险，必须在整个\
  \ IT 组织中通过适当的控制和问责来充分解决。\n\n要了解更多关于 `DevOps` 的信息，可以阅读《凤凰项目》或《可视化运维手册》，这两本书由 Kevin\
  \ Behr、Gene Kim 和 George Spafford 编写。它们被认为是许多 IT 组织的必读之。\n\n## 在开发环境中识别并应用安全控制\n\
  \n开发环境是在发布到生产环境之前用于开发和测试软件及系统的系统和工具集合。开发环境的安全需要特别注意，以确保不会将安全漏洞和后门引入此类软件中。这些保护措施还可以保护源代码不被对手窃取。\n\
  \n### 软件环境的安全\n\n为了确保开发人员和开发团队产生的软件安全，必须保护软件开发环境本身。需要考虑的控制措施包括：\n\n- **开发、测试、质量保证（QA）和用户验收测试（UAT）系统分离。**\
  \ 这些活动应在独立的环境中进行，以免各种活动相互干扰。在某些情况下，对于哪些开发人员（以及测试人员和用户）访问哪些环境可能会限制。此外，用于编写和测试代码的工作站不应与日常办公功能（如电子邮件和访问内部及互联网应用程序）的工作站为同一。\n\
  - **不要在开发、测试或 QA 环境中使用生产实时数据。** 在许多应用程序中，生产实例包含敏感数据，如个人身份信息（PII）和其他敏感或个人信息。相反，可以使用匿名化此类数据的工具在测试环境中提供真实的模拟数据，而不会产生泄露此类数据的风险。\n\
  - **与互联网隔离。** 由于开发系统不用于 Web 访问或电子邮件，对此应该不会太大异议。安全补丁可以从内部系统推送，而不是从互联网获取（这本身就是首选做法）。\n\
  - **事件日志。** 操作系统层级以及开发层面的事件记录用于排排除故障，并为审计人员提供开发人员操作的运行历史。\n- **源代码版本控制。** 源代码的所有更改都需要通过现代源代码管理系统进行管理，该系统应具有检出、提交、回滚、锁定、访问控制和日志功能。这有助于确保对源代码的所有访问和修改都被记录。这些系统还用于限制对高度敏感代码（例如用于身份验证会话管理的代码）的访问，使其只有尽可能少的开发人员可以使用。\n\
  - **移除管理员权限。** 用于编码和测试的用户账户不应具有本地或域管理员权限。\n\n某些开发人员可能会对此产生反感；他们认为他们无法进行软件安装和操作系统层级调试等测试。没问题。给他们另一台具有管理员权限的机器（或虚拟机）来进行这些操作。但是，不要让他们使用该系统处理日常办公任务，如电子邮件和访问访问。\n\
  \n\n\n\n\n-   **使用标准的开发工具。** 同一团队或项目的所有开发者都应该使用相同的 IDE（集成开发环境）或他们所使用的任何编码、测试和编译工具。不应允许开发者“随心所欲”，因为这可能会引入受损的工具或库，从而向他们正在开发的软件中泄露或注入后门。\n\
  -   **仅使用公司拥有系统。** 开发者不应在 BYOD（自带设备）系统上进行开发。相反，他们应该使用公司采购并支持的系统，以确保这些系统完全不受恶意软件和篡改的影响。\n\
  \n这些保护措施应适用于开发者工作站以及集中式的构建和测试系统。\n\n### 作为安全编码一个方面的配置管理\n\n`Configuration management`\
  \ 经常与变更管理混淆，但实际上它与审批几乎无关，而与记录变更的所有事实有`一切`关系。配置管理捕捉了软件代码、终端用户文档、操作文档、开发者工具和设置、程序构建工具和设置、灾难恢复计划文档以及其他细节实际变化。配置管理为系统的每次更改和发布存档技术细节，如果存在多个软件实例，也会为每个实例存档。\n\
  \n配置管理也完全适用于系统环境，包括但不限于操作系统、数据库管理系统、中间件和所有类型的网络设备。当通过变更管理过程进行更改时，所有配置更改的细节记录在配置管理数据库（`CMDB`）中。这可以帮助工程师轻松了解所有此类系统和设备中的当前（预期）和之前的配置设置，从而帮助以后排除故障。\n\
  \n![remember](img/remember.png) 变更管理和配置管理解决了系统维护模式下变更的两个不同方面：\n\n-   变更管理是`为什么`。\n\
  -   配置管理是`什么`。\n\n![remember](img/remember.png) 管理对系统所做更改的过程被称为变更管理。记录对生产环境修改的过程被称为配置管理。\n\
  \n### 代码仓库的安全性\n\n在开发期间和之后，程序源代码存储在中央源代码仓库中。源代码必须受到未经授权访问和未经授权更改的保护。实施此类保护的控制包括：\n\
  \n-   **系统加固。** 必须将入侵者挡在操作系统之外。这包括用于服务器的所有常规系统加固技术和原则，如 第 5 章 中所述的。\n-   **系统隔离。**\
  \ 系统应仅允许授权人员访问，而不允许其他任何人访问。它不应由于任何原因从互联网访问，也不应能够访问互联网。系统应仅作为源代码仓库运行，而不用于其他目的。\n\
  -   **限制开发者访问。** 只有授权的开发者和任何其他人员才应访问源代码。\n-   **限制管理员访问。** 只有授权人员（不是！）应访问源代码。\n\
  -   **禁止直接访问。** 任何人都不应该直接访问。\n-   **有限且受控的检出。** 开发者应只能检出。\n-   **对关键代码的限制访问。** 少数开发者应该有访问。\n\
  -   **保留所有版本。** 仓库应维护副本，以便根据需要对模块进行“回滚”。\n-   **提交审批。** 所有提交都需要审批。\n-   **活动审查。**\
  \ 应定期审查活动日志。\n\n### 评估软件安全的有效性\n\n美国前总统罗纳德·里根以其短语`信任但验证`而闻名。我们更进一步一点，说`在验证之前不要信任`。这一信条适用于信息安全的许多方面，包括软件安全。\n\
  \n对软件进行初始和周期性测试是软件在其整个生命周期内开发（或获取）和管理过程中不可或缺的一部分。周期性测试的原因是研究人员（白帽和黑帽）总是发现利用软件的新方法。\n\
  \n安全测试的其他方面在 第 8 章 中进行了详细探讨。\n\n### 更改的审计和日志记录\n\n记录更改是系统和软件行为的一个重要方面。日志的存在有助于故障排除、验证和事件的重建。在这里，变化的两个方面非常重要：\n\
  \n-   **软件执行的更改。** 主要意味着对数据进行的更改。因此，日志记录将包含“之前”和“之后”的值，以及其他要素，包括用户、日期、时间和事务 ID。这还包括更改软件行为的配置更改。\n\
  -   **对软件进行的更改。** 这通常意味着对实际软件代码的更改。在大多数组织中，这涉及变更管理和配置管理过程。然而，在调查系统问题时，你不排除未经授权更改的可能性。变更记录的缺失并不是没有更改的证据。\n\
  \n这些类别的日志数据可能存储在本地或中央仓库中，例如 `SIEM`（安全信息和事件管理）系统。当发生可操作的事件时，应及时通知相关人员。这在 第 9 章 中有更充分的讨论。\n\
  \n### 风险分析与缓解\n\n对程序和系统进行风险分析是识别和分析风险的重要手段。可能包括的风险类型：\n\n-   **已知漏洞。** 可以识别哪些漏洞，如何被利用，以及软件是否有任何手段可以意识到尝试利用并进行防御。\n\
  -   **未知漏洞。** 这里，我们说的是尚未被发现的漏洞。如果你不我们的意思，只需想象几个广泛使用的程序，它们似乎每个月都受到新漏洞的困扰。具有这种记录的软件无疑有更多未公开的漏洞。我们不会在这里列出它们来羞辱它们。\n\
  \n\n\n\n\n-   **事务完整性。** 换句话说，软件在所有情况下是否都能正常工作并产生正确的结果，包括无意和故意的误用和滥用？可以通过对软件程序进行手动或自动审计来识别事务计算和处理中的问题，但人类通常也能发现这些问题。\n\
  \n用于评估软件漏洞的工具包括：\n\n- **安全扫描器。** 这些是工具，例如 `WebInspect`、`AppScan` 和 `Acunetix Web\
  \ Vulnerability Scanner`，它们可以扫描整个网站或网络应用程序。它们通过检查表单变量、隐藏变量、`cookies` 以及其他网页特征来识别漏洞。\n\
  - **网站安全工具。** 这些是如 `Burp`、`Nikto`、`Tamper Data` 和 `Paros Proxy` 等工具，用于手动检查网页，以寻找扫描器通常无法发现的漏洞。\n\
  - **源代码扫描工具。** 这些是如 `Veracode`、`AppScan Static` 和 `HP Fortify` 等工具。这些工具检查程序源代码并识别安全扫描器通常无法看到的漏洞。\n\
  \n发现漏洞和设计缺陷的另一种方法是被称为`威胁建模` 的技术。这涉及对程序的所有接口进行系统且详细的分析，包括用户界面、`APIs` 以及与底层数据库管理和操作系统的交互。分析涉及对这些元素的研究，以理解内部人员和攻击者使用、误用和滥用它们的所有方式。对此的一个常用工具是\
  \ `Microsoft Threat Modeling Tool`。\n\n`STRIDE` 威胁分类模型对于威胁建模也非常方便。`STRIDE` 代表以下：\n\
  \n- 身份伪造 (Spoofing)\n- 篡改 (Tampering)\n- 否认 (Repudiation)\n- 信息泄露 (Information disclosure)\n\
  - 拒绝服务 (Denial of service)\n- 权限提升 (Elevation of privilege)\n\n缓解软件漏洞通常意味着更新源代码（如果有的话！）或应用安全补丁。然而，补丁往往无法立即获得并应用，这意味着必须实施临时解决方案，或者依赖其他层的安全（例如\
  \ Web 应用防火墙）。\n\n缓解事务完整性问题可能需要对受影响的数据进行手动调整，或者在相关程序中采取解决方案。\n\n### 验收测试\n\n验收测试是验证软件程序在所有场景下的运行情况符合预期正式过程。验收测试通常在程序或系统首次获取、投入生产使用之前，以及在整个服务周期内对程序或系统进行配置更改或代码更改时进行。\n\
  \n验收测试通常与业务终端测试相关，在这种情况下被称为用户验收测试 (`UAT`)。然而，验收测试也（或应该！）在其他对终端用户不一定可见或显易的方面进行，包括：\n\
  \n- **恶意和错误的输入。** 用户可能满足于使用合理、可接受的输入来测试程序，但安全专业人员知道这只是开始。测试中必须包含所有类型的输入，包括恶意和错误的输入，以确保系统行为正常且不会被破坏。\n\
  - **安全数据存储。** 所有数据存储的实例必须是安全的，且与数据的敏感性相适应。测试需要包含对数据残留的检查，以确保程序不会留下可能被他人发现的敏感数据。\n\
  - **安全数据传输。** 所有传输到另一个程序或系统的数据实例必须使用与数据敏感性相适应的手段进行。在公共互联网上，这几乎意味着使用加密。\n- **身份验证与授权。**\
  \ 这些机制必须证明能够正常工作，且不受攻击或滥用的影响。\n- **会话管理。** 此机制用于跟踪系统或应用程序的每个独立用户。会话管理中的缺陷可能允许攻击者接管现有用户的会话。年前，Firefox\
  \ 浏览器扩展 `Firesheep` 是一个极好的概念证明工具，可用于窃取其他用户的 Web 应用程序会话。\n\n## 评估获取软件的安全影响\n\n每个组织都会从其他实体获取部分（或全部）软件。任何与敏感数据存储或处理相关的获取软件都需要从安全角度进行理解，以便组织能够意识到与其使用该软件相关的风险。\n\
  \n有一些用例值得进一步讨论：\n\n- **开源。** 许多安全专业人员怀怀怀念地回着那段美好的时光，那时我们都信任开源软件，相信许多热心且有才华的人对源代码的检查一定能根除安全缺陷。然而，`OpenSSL`、`jQuery`\
  \ 和 `MongoDB` 等的安全漏洞打破了这层泡沫。现在显而易见，我们需要像检查任何其他软件一样严谨地检查开源软件。\n- **商业软件。** 确认商业工具的安全性通常比开源更困难，因为源代码通常不可用于检查。取决于软件的类型，自动扫描工具可能会帮助，但测试通常是手动工作。某些供应商自愿允许安全咨询公司检查其软件的漏洞，并允许客户查看测试结果（有时只是摘要形式）。\n\
  - **软件库。** 这里，我们讨论的是软件模块的集合，它们本身不是程序，但被用于构建程序或在程序运行时被使用。将它们想象成他人创建的预装组件。仔细检查所有此类库是至关重要的，因为有很多库是不安全的，还有更多库并不总是能正常运行——特别是在压力和滥用情况下。此外，应该检查软件库的漏洞——信任并验证！\n\
  - **操作系统。** 无论是否开源，我们通常满足于使用良好的加固指南、有效的补丁管理以及使用 `Nessus`、`Rapid7` 和 `Qualys` 等工具进行扫描来发现漏洞。\n\
  \n## 定义并应用安全编码规范和标准\n\n开发软件的组织（无论是仅自使用还是作为提供给其他组织的产品）都需要制定关于源代码开发的政策和标准，以减少可能导致错误、事件和安全漏洞的漏洞数量。即使是使用工具发现源代码（以及运行时）漏洞的组织也能从此类实践中获益，原因有二：\n\
  \n- 修复代码漏洞的时间缩短了。\n- 某些代码漏洞可能无法通过工具或代码审查发现，但仍可能被攻击者利用，导致错误、事件或破解。\n\n### 源代码层面的安全缺陷和漏洞\n\
  \n软件开发组织必须建立标准、流程和工具，以确保所有开发的软件都没有缺陷，包括可能导致系统破坏以及数据篡改或盗取的安全漏洞。需要识别的缺陷类型包括\n\n- **缓冲区溢出。**\
  \ 这是一种攻击，通过故意让程序的输入字段溢出，试图破坏正在运行的软件程序，从而允许攻击者强制程序运行任意指令。缓冲区溢出攻击允许攻击者获得目标系统的部分或完全控制，从而使其能够访问、篡改、破坏或窃取敏感数据。\n\
  \n\n\n\n-   **注入攻击。** 攻击者可能通过 SQL 注入或脚本注入攻击操纵应用程序，导致各种结果，包括访问敏感数据。\n-   **权限提升。**\
  \ 攻击者可能诱骗目标应用程序或系统提高攻击者的权限级别，使其能够访问敏感数据或控制目标系统。\n-   **身份验证不当。** 不严丝合缝的身份验证可能会被攻击者利用，攻击者可能破坏或完全绕过身份验证。正确地进行身份验证意味着编写具韧性的代码，并避免可能给攻击者带来优势的功能（例如告诉用户\
  \ `userid` 正确但密码错误）。\n-   **会话管理不当。** 编程和配置不正确的会话管理可能会被入侵者利用，从而导致通过会话重放攻击进行会话劫持。\n\
  -   **加密使用不当。** 如果没有妥善实现，强大的加密算法也可能无效。这可能让攻击者轻易攻击加密系统并访问敏感数据。这不仅包括正确地使用加密算法，还包括适当的加密密钥管理。\n\
  -   **逻辑漏洞（Gaming）。** 这是一个通用术语，指应用程序或系统设计缺陷，可能允许用户或入侵者以所有者或设计者无意的方式使用应用程序或系统。例如，图像共享服务可能被犯罪分子利用隐术来传递信息。\n\
  -   **内存泄漏。** 这种缺陷发生在程序未能释放不再需要的内存时，导致运行程序的内存需求随时间稳步增长，直到可用资源耗尽。\n-   **竞态条件。**\
  \ 这种缺陷涉及两个（或多个）程序、进程或线程，它们各自以假定独占访问资源的方式来访问和操纵资源。这可能导致一个或多个程序、进程或线程产生意外结果。\n\n这些漏洞以及其他问题，开放\
  \ Web 应用安全项目（OWASP）在 [`www.owasp.org`](http://www.owasp.org) 中进行了详细介绍。\n\n### 应用程序编程接口的安全性\n\
  \n应用程序接口，或 `APIs`，是用于数据输入和数据输出的软件程序组件。一个 `API` 会附带规范（无论是否有文档记录），该规范定义了功能、输入和/或输出字段、数据类型和其他细节。通常，`API`\
  \ 用于程序之间的非人类交互。虽然你认为 Web 是一个人类可读的接口，但 `API` 被认为是机器可读的接口。\n\n`APIs` 存在于许多地方：操作系统、子系统（如\
  \ Web 服务器和数据库管理系统）、实用程序和应用程序。`APIs` 也实现在计算机硬件中，如内存外外设备（如磁盘驱动器、网络接口、键盘和显示设备）。\n\n\
  在软件开发中，开发者可以从头开始创建自己的 `API`（不推荐），也可以通过获取内置 `API` 的源码模块或库（如 `RESTful`）来获取 `API`。`API`\
  \ 可以是应用程序的一部分，用于与其他应用程序之间传输数据，无论是批量传输还是按事务传输。\n\n`APIs` 需要是安全的，这样它们才不会成为入侵者隐蔽获取敏感数据或导致目标系统发生故障或崩溃的手段。确保\
  \ `API` 安全的三个首要手段包括：\n\n-   **安全设计。** 每个 `API` 的实现都必须仔细检查并清理所有输入数据，以击败任何注入尝试或缓冲区溢出攻击以及程序故障。输出数据也必须经过检查，以确保\
  \ `API` 不输出任何违规或恶意数据。\n-   **安全性测试。** 每个 `API` 都需要经过彻底测试，以确保其功能正常并能抵抗攻击。\n-   **外部保护。**\
  \ 在 Web 服务 `API` 的情况下，Web 应用防火墙可能保护 `API` 免受攻击。然而，如果 `API` 使用其他协议，则可能没有此类选项。包过滤防火墙无法保护\
  \ `API` 免受逻辑攻击——防火墙不检查包的内容，只检查其源目的 IP 地址和端口。\n\n### 安全编码实践\n\n安全编码实践的目的是减少工具、实用程序和应用程序中可利用的漏洞。安全编码实践不仅涉及安全编码，还涉及许多其他考虑和活动。以下是与安全编码的一些因素：\n\
  \n-   **工具。** 从集成开发环境的选择和配置，到静态和动态代码测试工具（分别为 `SAST` 和 `DAST`）的使用，可以使用工具来检测源代码缺陷的存在，包括安全漏洞。越早发现这些缺陷，纠正它们所需的精力就越少。\n\
  -   **流程。** 正如本章前面所述，软件开发流程需要从安全的角度进行设计和管理。流程定义了事件发生的顺序；在软件和系统开发的背景下，安全相关的步骤（如同行评审和使用漏洞扫描工具）将确保采取所有正确的步骤，以确保源代码合理地没有缺陷。\n\
  -   **培训。** 软件开发者和工程师在知道如何操作时，更有可能写出良好、安全的代码。安全开发培训至关重要。极少数大学在他们的本科计算机科学课程中包含安全开发。安全编码不是大学培训的一部分，因此组织必须填补这一空白。\n\
  -   **激励。** 金钱能说明一切。提供某种形式的事件奖励有助于软件开发者更多关注他们生产的代码是否具有安全漏洞。我们更喜欢“胡萝卜”而不是“大棒”，所以也许对每个日历季度或年度缺陷最少的给予奖励是一个很好的开始。\n\
  -   **源代码语言的选择。** 源代码语言的选择以及对开源代码使用的政策也发挥了作用。某些设计语言比其他语言更安全（或者我们说更“安全”）。例如，`C` 语言虽然强大，但它没有保护功能，这要求开发者在编写安全代码方面具有更高的技巧和知识。\n\
  \n\n\n\n\n当你心理上开始预期 CISSP 考试的学习和准备时，了解自己的学习风格至关重要。例如，你可能更倾向于长期学习计划，而不是为期一周的训练营式培训课程。你可能在学习小组中表现得更好，或者在安静的房间里独自学习和阅读。如果你采用短时间、频繁的学习（例如，每次\
  \ 30 分钟，每天几次），或者低频率但长时间的马拉松式学习（例如，每周几次，每次四小时），你的学习时间可能会更有收获。\n\n为了充分利用本章中的建议，你需要提前了解哪些方法对你最有效，这样你就可以定制学习计划并优异地通过\
  \ CISSP 考试！\n\n## 先获取网络认证\n\n“通信与网络安全”领域是 CISSP 考试中测试最全面的领域。尽管其目的是测试你的安全知识，但你必须对通信和网络有深入的理解。因此，我们强烈建议你在尝试\
  \ CISSP 考试之前，先获得一项网络认证，例如 `CompTIA Network+` 或 `Cisco 认证网络工程师 (CCNA)`，特别是如果你没有多年路由器、交换机、防火墙等网络设备的经验的话。（有关这些认证的更多信息，请分别参见\
  \ [`www.comptia.org`](http://www.comptia.org) 和 [`www.cisco.com`](http://www.cisco.com)。）另一个额外好处是，你将拥有另一项在计算机行业中需求量大的宝贵技术认证。\n\
  \n如果你已经拥有这些认证之一，你会发现“通信与网络安全”领域的大部分信息都非常基础。在这种情况下，针对安全概念（特别是攻击方法）进行快速复习就对应对该领域足够了。我们在本本书的第\
  \ 6 章 中专门介绍了通信与网络安全领域。\n\n![tip](img/tip.png) 如果你以前没有参加过机考，先获得网络认证将帮助你熟悉考中心的位置和环境，以及机考的通用格式。你可以在\
  \ [`www.pearsonvue.com`](http://www.pearsonvue.com) 参加通用的模拟机考，以熟悉它们的运作方式。\n\n##\
  \ 现在注册！\n\n立即登录 [`www.pearsonvue.com/isc2`](http://www.pearsonvue.com/isc2) 在线注册\
  \ CISSP 考试 — *现在就去！*\n\n投入考试日期是治疗拖延症的良药，特别是因为考试费用高达 699 美（（）！设定日期可以帮助你计划并集中学习精力。\n\
  \n## 制定一个 60 天学习计划\n\n在注册 CISSP 考试后，为自己制定一个 60 天的学习计划。当然，你的工作经验和专业阅读应该跨越更长的时间，但对于\
  \ CISSP 考试之前的最后准备，请计划为期 60 天的强化学习和复习。\n\n学习的强度具体取决于你的个人经验和学习能力，但请计划每天至少学习 2 小时，持续\
  \ 60 天。如果你学习或阅读速度较慢，或者可能发现自己在许多方面较薄弱，请计划每天学习 4 到 6 小时，周末增加时长。无论如何，请尝试坚持 60 天计划。如果你觉得需要\
  \ 360 小时的学习，你可能会倾向于将其分散到 6 个月内，每天学习 2 小时。但投入 6 个月的高强度学习（对你以及你的家人和朋友来说）比投入 2 个月要困难得多。最后，你可能会发现自己学习的总量和在\
  \ 60 天内学的多一样。\n\n## 整理并阅读！\n\nCISSP 候选人可以使用大量的安全信息。然而，学习*所有内容*是不现实的。相反，要做好组织，确定你的优缺点，然后*阅读！*\n\
  \n首先从 (ISC)² 网站下载免费官方 *CISSP 考试大纲*（[`www.isc2.org`](http://www.isc2.org)），以了解你将接受测试的主题。\n\
  \n接下来，阅读这本书，使用 [`www.dummies.com`](http://www.dummies.com) 在线练习（更多信息请见前言）。《CISSP\
  \ 傻》第 6 版旨在为 CISSP 候选人提供 CISSP 考试涵盖的所有广泛主题的优秀概述。\n\n接下来，关注你认为自己最薄弱的领域。阅读或复习本书中的相应章节。如有需要，根据特定主题获取额外的参考。\n\
  \n最后，在考试前的最后一周，至少过一遍你选择的所有学习材料。再次复习或阅读《CISSP 傻》第 6 版，以及你的个人学习笔记，并尽可能完成多的练习题。\n\n\
  ![tip](img/tip.png) 你可以在 (ISC)² 网站 [`www.isc2.org/Training/Self-Study-Resources`](https://www.isc2.org/Training/Self-Study-Resources)\
  \ 下载免费的 (ISC)² *官方 CISSP 闪卡*。你也可以在 App Store 或 Google Play 购买 (ISC)² *官方 CISSP 学习应用*。\n\
  \n## 加入学习小组\n\n人多力量大。加入学习小组或建立自己的小组可以保持专注，并从其他 IT 和安全专业人士的视角和经验提供丰富的信息。你可以在 [`www.cccure.org`](http://www.cccure.org)\
  \ 找到学习小组、讨论论坛和其他许多资源。\n\n此外，你当地的 (ISC)² 分会或信息系统安全协会 (ISSA) 分会可能会赞 CISSP 学习小组。你可以在\
  \ [`www.issa.org`](http://www.issa.org) 找到他们的联系方式。\n\n## 参加模拟考试\n\n没有完全复制 CISSP\
  \ 考试的模拟考试。忘记那些“题库”（他人肆无忌惮发布在互联网上的实际测试题目和答案）吧——除了可能是错误的之外，题库还违反了 CISSP 考试的保密协议。然而，有很多练习题资源可用。你可能会发现有些练习题太难，有些太简单，有些则完全无关。尽管如此，练习题的重复可以帮助强化你成功回答\
  \ CISSP 考试题目所需的重要信息。出于此原因，我们建议尽可能参加模拟考试，并利用结果帮助你关注自己的薄弱环节。尝试 CISSP Open Study Group\
  \ 网站上的 CISSP 测验（[`www.cccure.org`](http://www.cccure.org)）。\n\n## 参加 CISSP 研讨会\n\
  \n你可以参加官方的 (ISC)² CISSP 培训研讨会。面对面的研讨会（课堂或私人现场）是一场高强度的五天课程，绝对让你吃都在都是 CISSP。在线培训研讨会让你在计算机上获得面对相同的益处，但日程更灵活，包括工作日、周末、晚上和自学课程。日程和附加信息可以在\
  \ [`www.isc2.org`](http://www.isc2.org) “教育与培训”部分下的“培训方法”中找到。\n\n## 采用应试策略\n\n由于考试现在是自适应的，在处理考试题时，很难评估你是进展太快还是太慢。你将会有至少\
  \ 100 道题，最多 150 道题。\n\n如果你在考试中进展得太慢——可能两个半小时过去了，你只回答了 50 道题——匆忙完成剩下的题目可能会使情况恶化。如果你开始犯粗心错误并得到更多错误答案，你可能得到更多而不是更少的题目，因此考试和时间都会对你不利！\n\
  \n\n\n\n\n另一方面，如果你匆忙应付考试——可能你才刚考试 30 分钟就已经回答了 80 道题——那么你无法回过头检查或更改答案。\n\n在自适应考试中，你需要制定出一种比简单的“管理时间”更深入的策略。思考一下，当你不知道某道题的答案时会怎么办。你将如何排除备选项以做出更好的推测？当你开始感到恐慌或焦虑导致崩溃时，你会怎么办？如果你发现自己失去注意力或自我怀疑，该怎么办？准备好策略来应对考试期间这些及其他可能的情况。\n\
  \n## 休息一下\n\n考试前一天，放松心情，并计划好一个舒适的睡眠。如果你一直在为考试临阵突击，请在考试前一天把学习材料放放一边。到那时，你要么已经掌握了材料，要么还没掌握！\n\
  \n## 第 12 章\n\n# 十个考试之日技巧\n\n好了，你的大日子终于到了。在经历了几个月的学习和令人崩溃的压力后，你在考试前晚上通宵复习，因为迟到而跳过早餐，然后在考试期间，因为接下来的三个小时里头痛欲裂（如果你参加的是非英语、基于表单的，则是六小时）而忘记你所知道的一切！这并不完全是成功的秘诀——但以下十个考试日技巧绝对能让你走上正确的轨道。\n\
  \n## 保证充足睡眠\n\n考试前的一个晚上不是进行任何最后冲刺的时候。研究证明，良好的睡眠对于考试取得良好成绩至关重要。吃一顿丰晚餐（我们建议吃一些碳水化合物并避免任何辛辣食物），然后早点睡觉。把通宵活动留到考试后的那天。\n\
  \n## 穿得舒适\n\n你应该穿舒适的衣服——记住，这是一场持续三小时的考试。穿层衣服也是个好主意——考场的温度可能比你习惯的要暖或冷。\n\n考虑穿平底鞋或其他容易脱下的鞋子（但请顾及他人，穿干净的袜子！）\n\
  \n## 吃一顿好饭\n\n在参加 `CISSP` 考试之前尽量吃点东西。空肚子坐三个小时会感觉像过了一个世纪那么久。\n\n## 早点到达\n\n在任何情况下，你都不应该迟到参加考试。确保你了解考试中心的位置、那个时间的交通状况以及在哪里停车。你甚至可能想在考试当天进行预演，以确保你可能会遇到什么延误（如果你对考试区域不熟悉）。\n\
  \n## 携带照片证\n\n考试中心会在你到达考试时验证你的身份。你需要携带驾照、政府颁发的 ID 或护照——这些是被接受的 ID 格式——且 ID 上的名称必须与你注册时完全一致。\n\
  \n## 携带零食和饮料\n\n向考试中心咨询关于零食和饮料的规定（http://pearsonvue.com/isc2/）。如果允许，带上足够应付考试的食物和饮料。一大瓶水是必不可少的。此外，考虑带上汽水和一些零食、能量能量棒——这些能让你补充水分并恢复精力。\n\
  \n## 处方药和非处方药\n\n再次，如果你需要在考试期间服用任何处方药，请咨询考试中心。没有什么比医疗状况更能破坏你通过 `CISSP` 考试的机会！此外，如果你服用任何非处方药，如对乙酰氨基酚、鼻喷剂或抗酸药，请确保在开始考试前服用，以消除任何不适之处，如头痛、烧心或肠胃不适。一盒纸巾可能也是合适的——如果你看到考试时想哭的话！\n\
  \n## 留下移动设备\n\n这是你和家人必须面对的一天。关闭你的手机和其他任何发出哔哔声或震动的设备。更好的办法是把它锁在车里或家里。大多数考试中心都有储物柜可以存放个人物品。你不希望在考试时担心手机手机丢了。\n\
  \n## 频繁休息\n\n三个小时是很长时间。如果允许，确保在考试期间站起来走走。如果不允许，至少伸一下腿、蜷脚趾、活动手指关节、休息眼睛（但不要睡着！）、转转脖子——或者在范围内做任何保持血液循环的事。我们建议在整个考试过程中进行频繁休息……然后回到任务。你甚至可以将休息纳入考试策略中。例如，回答\
  \ 30 或 40 道题后休息一下。至少闭上眼睛深吸一口气——只要不睡着就行！此外，如果你发现自己心神不定或难以集中注意力，请休息一下。精疲力竭和疲劳会导致粗心错误。如果你感到这些症状，请休息一下。\n\
  \n但不要过度休息。坚持频繁但短时间的休息，你就会没事的。\n\n## 猜题——最后的手段\n\n猜题是一种绝望的考试方法，但在万万无奈时是有效的。未回答的问题绝对是错误的，所以不要留任何空题。如果你必须猜，请尝试排除所有明显的错误答案。如果你能排除两个可能的错误选项，你有\
  \ 50% 的机会猜对。\n\n当一切无果时，听从你的直觉！研究反复证明，你的第一次猜测往往是正确的。所以除非你发现自己读错了题目——例如漏掉了题目中的 `NOT`\
  \ 或 `ALL` 等关键词——否则避免在没有充分理由的情况下更改答案。\n\n# 术语表\n\n3DES (三重 DES): 对原始 DES 算法的增强，使用多个密钥对明文进行加密。正式称为三重数据加密算法\
  \ (TDEA 或 Triple DEA)。*参见*数据加密标准 (DES)。\n\nAAA: 认证（authentication）、授权（authorization）和问责（accountability）控制的缩写。\n\
  \n抽象 (abstraction): 一个涉及从最高级功能查看应用程序的过程，这使得低级功能抽象化。\n\n验收测试 (acceptance testing):\
  \ 对软件程序或系统正确功能的人工验证。\n\n访问控制 (access control): 允许或拒绝 `subject`（主体，如人或进程）使用 `object`（对象，被动实体，如系统或文件）的能力。\n\
  \n访问控制列表 (ACL): 列出分配给特定主体的特定权利和权限。\n\n访问矩阵模型 (Access Matrix Model): 为 DAC 系统中的主体提供对象访问权限（读/写/执行或\
  \ R/W/X）。访问矩阵由 ACL 和能力列表组成。*参见*访问控制列表 (ACL) *以及*自主性访问控制 (DAC)。\n\n问责 (accountability):\
  \ 系统将用户和进程与其行为关联起来的能力。\n\n认证 (accreditation):\n\n\n\n\n\n在认证报告中记录的关于在特定环境中运行特定系统的正式书面批准。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0019\">`acquisition:`</dfn>\n\n(1) 购买另一个组织的过程。(2) 购买信息系统硬件或软件的过程。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0021\">`active-active:`</dfn>\n\n一种集群配置，其中系统或网络中的所有节点都处于负载均衡、同步且激活的状态。如果其中一个节点故障，其他节点将继续无缝地提供服务。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0023\">`active-passive:`</dfn>\n\n一种集群配置，其中系统或网络中只有一个节点处于激活状态。如果主节点故障，备用节点将变为激活状态并继续提供服务，通常在短暂的延迟之后。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0025\">`ActiveX:`</dfn>\n\n由微软创建的软件框架，它使其早期的 COM 和\
  \ OLE 技术适用于从网络（如互联网）下载的内容。另参见组件对象模型 (COM) 和对象链接与嵌入 (OLE)。\n\n<dfn id=\"b02.xhtml_a01-li-0027\"\
  >`Address Resolution Protocol (ARP):`</dfn>\n\n用于查询和发现局域网（LAN）上设备 MAC 地址的网络协议。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0029\">`address space:`</dfn>\n\n分配给网络主机、设备、磁盘扇区或内存单元的离散地址范围。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0031\">`administrative controls:`</dfn>\n\n组织作为整体信息安全策略的一部分实施的策略和程序。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0033\">`administrative laws:`</dfn>\n\n由政府机构通过的法律要求，定义了主要行业（如银行、能源和医疗保健）、组织和官员的绩效和行为标准。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0035\">`Advanced Encryption Standard (AES):`</dfn>\n\
  \n基于 Rijndael 密码的块密码算法，它取代了 DES。另参见数据加密标准 (DES)。\n\n<dfn id=\"b02.xhtml_a01-li-0037\"\
  >`adware:`</dfn>\n\n通常随免费软件或共享软件程序一起安装的软件。它为软件开发者提供了收入来源，并仅在你在使用相关程序或在你购买该程序之前（对于共享软件而言）时运行。另参见恶意软件。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0039\">`agent:`</dfn>\n\n执行特定服务的软件组件。\n\n<dfn id=\"\
  b02.xhtml_a01-li-0041\">`aggregation:`</dfn>\n\n(1) 一种数据库安全问题，描述了通过结合其他低敏感信息项来获取分类为高敏感级别信息的行为。(2)\
  \ 人员随着时间推移在组织内不同角色之间转换时，访问权限的无意累积。\n\n<dfn id=\"b02.xhtml_a01-li-0043\">`Agile:`</dfn>\n\
  \n一种以系统开发迭代式方法而闻名的软件开发方法论。\n\n<dfn id=\"b02.xhtml_a01-li-0045\">`Agile Maturity\
  \ Model (AMM):`</dfn>\n\n用于衡量敏捷软件开发过程和实践成熟程度的框架。另参见敏捷（Agile）。\n\n<dfn id=\"b02.xhtml_a01-li-0047\"\
  >`Annualized Loss Expectancy (ALE):`</dfn>\n\n一种标准的、可量化的衡量，用于衡量现实威胁对组织资产的影响。ALE\
  \ 由公式 `Single Loss Expectancy (SLE) × Annualized Rate of Occurrence (ARO) = ALE`决定。另参见单损失预期\
  \ (SLE) 和年度发生率 (ARO)。\n\n<dfn id=\"b02.xhtml_a01-li-0049\">`Annualized Rate of Occurrence\
  \ (ARO):`</dfn>\n\n特定威胁或事件发生的估计年频率。\n\n<dfn id=\"b02.xhtml_a01-li-0051\">`antivirus\
  \ software:`</dfn>\n\n旨在检测并防止计算机病毒和其他恶意软件进入并损害系统的软件。\n\n<dfn id=\"b02.xhtml_a01-li-0053\"\
  >`applet:`</dfn>\n\n分布式环境（各种组件位于不同的系统上）中的一种组件，它被下载并由另一个程序（如 浏览器）执行。\n\n<dfn id=\"\
  b02.xhtml_a01-li-0055\">`application firewall:`</dfn>\n\n一种检查 OSI 第 7 层内容的防火墙，旨在阻止恶意内容到达或离开应用程序服务器。另参见\
  \ Web 应用防火墙 (WAF)。\n\n<dfn id=\"b02.xhtml_a01-li-0057\">`Application Layer (OSI):`</dfn>\n\
  \nOSI 模型的第 7 层。\n\n<dfn id=\"b02.xhtml_a01-li-0059\">`Application Layer (TCP/IP):`</dfn>\n\
  \nTCP/IP 模型的第 4 层。\n\n<dfn id=\"b02.xhtml_a01-li-0061\">`application penetration\
  \ test:`</dfn>\n\n对应用程序的渗透测试。另参见渗透测试。\n\n<dfn id=\"b02.xhtml_a01-li-0063\">`application\
  \ scan:`</dfn>\n\n用于识别应用程序漏洞的自动化扫描。\n\n<dfn id=\"b02.xhtml_a01-li-0065\">`application\
  \ software:`</dfn>\n\n执行特定任务的计算机软件。\n\n<dfn id=\"b02.xhtml_a01-li-0067\">`application-level\
  \ firewall:`</dfn>\n\n另参见防火墙。\n\n<dfn id=\"b02.xhtml_a01-li-0069\">`application\
  \ programming interface (API):`</dfn>\n\n系统的输入和输出规范。\n\n<dfn id=\"b02.xhtml_a01-li-0071\"\
  >`application whitelisting:`</dfn>\n\n用于控制哪些应用程序在系统上运行的机制。另参见白名单。\n\n<dfn id=\"\
  b02.xhtml_a01-li-0073\">`archive:`</dfn>\n\n在公钥基础设施 (PKI) 中，负责来自 CA 的信息的长期存储。另参见证书机构\
  \ (CA) 和公钥基础设施 (PKI)。\n\n<dfn id=\"b02.xhtml_a01-li-0075\">`artificial intelligence\
  \ (AI):`</dfn>\n\n计算机与其环境交互并学习并在无需编程的情况下执行操作的能力。\n\n<dfn id=\"b02.xhtml_a01-li-0077\"\
  >`asset:`</dfn>\n\n对组织具有价值且必须受保护的资源、过程、产品、系统或程序。资产可以是硬件（如计算机和设备），也可以信息、程序和知识产权。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0079\">`asset inventory:`</dfn>\n\n对组织内资产进行追踪的过程。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0081\">`asset valuation:`</dfn>\n\n为组织的资产分配财务或相对价值的过程。\n\
  \n<dfn id=\"b02.xhtml_a01-li-0083\">`asymmetric key system (or asymmetric algorithm;\
  \ public key):`</dfn>\n\n一种使用两个密钥的加密系统——一个用于加密信息，另一个用于解密。这些密钥对被称为`公钥`和`私钥`。\n\n\
  <dfn id=\"b02.xhtml_a01-li-0085\">`Asynchronous Transfer Mode (ATM):`</dfn>\n\n\
  一种极高速、低延迟的交换通信。\n\n<dfn id=\"b02.xhtml_a01-li-0087\">`attribute-based access control\
  \ (ABAC):`</dfn>\n\n一种根据主体属性、对象属性和环境因素授予主体访问对象的控制模型。\n\n<dfn id=\"b02.xhtml_a01-li-0089\"\
  >`audit:`</dfn>\n\n对任何活动或过程的独立验证。\n\n<dfn id=\"b02.xhtml_a01-li-0091\">`audit trail:`</dfn>\n\
  \n记录交易和其他事件的辅助记录。\n\n<dfn id=\"b02.xhtml_a01-li-0093\">`augmented reality (AR):`</dfn>\n\
  \n通过将高分辨率（即使是 3D）图像叠加在真实世界视图上产生复合视图的技术。\n\n<dfn id=\"b02.xhtml_a01-li-0095\">`authenticated\
  \ scan:`</dfn>\n\n一种在搜索可利用漏洞漏洞期间，尝试登录设备、系统或应用程序的漏洞扫描。\n\n<dfn id=\"b02.xhtml_a01-li-0097\"\
  >`authentication:`</dfn>\n\n在访问控制系统中验证主体声称身份的过程。\n\n\n\n\n\n### 身份验证头 (AH)\nIPsec\
  \ 中的一种协议，提供完整性、身份验证和不可否认性。*另参见* 网上协议安全 (IPsec)。\n\n### 授权（或建立）\n定义并授予主体权利和权限（即你可以所做的事情）的过程。\n\
  \n### 自动控制\n不是通过手动执行的控制措施。\n\n### 可用性\n确保授权用户在需要时能够访问系统和数据的过程。\n\n### 后门\n一种允许个人绕过正常身份验证以访问受侵害的系统的恶意软件。*另参见*恶意软件。\n\
  \n### 背景审查\n验证个人的职业、财务和法律历史的过程，通常与就业有关。\n\n### 基线\n一种识别组织安全架构一致性基础的过程，考虑了特定于系统的参数，例如不同的操作系统。\n\
  \n### Bell-LaPadula 模型\n一种正式的机密性模型，定义了两个基本属性：简单安全属性（`ss property`）和星属性（`* property`）。*另参见*简单安全属性（`ss\
  \ property`）和星属性（`* property`）。\n\n### 最佳证据\n原始的、未更改的证据，相比于要证据，法院更倾向此类证据。*另参见*最佳证据规则和证据。\n\
  \n### 最佳证据规则\n定义在《联邦证据规则》中；规定“为了证明一份文件、录像或照片的内容，（通常）需要原始文件、录像或照片。”*另参见*证据。\n\n###\
  \ Biba 模型\n一种正式的完整性模型，定义了两个基本属性：简单完整性属性和星完整性属性（`*-integrity property`）。*另参见*简单完整性和星完整性属性（`*-integrity\
  \ property`）。\n\n### 生物识别\n作为身份验证机制的一部分，用于验证个人身份的各种手段。使用的生物识别类型包括指纹、掌纹、签名、视网膜扫描、语音扫描和击键模式。\n\
  \n### 生日攻击\n一种试图利用两个消息使用相同哈希函数并产生相同消息摘要的概率的攻击类型。*另参见*哈希函数。\n\n### 黑盒测试\n一种测试人员对被测试系统无预先知识的安全测试。\n\
  \n### 黑名单\n一种根据列表中是否存在某项来显式阻止访问的机制。*另参见*白名单。\n\n### 停电\n电力完全丢失。\n\n### 块密码\n一种加密算法，将明文分为固定大小的字符块或位块，然后对每个固定大小的块使用相同的密钥产生相应的密文。\n\
  \n### 蓝牙\n一种用于固定和移动设备之间短距离数据交换的无线技术标准。\n\n### 护柱\n用于引导交通远离建筑、区域或道路的柱子。\n\n### 引导包病毒\n\
  rootkit 的内核模式恶意软件变体，通常用于攻击受全盘加密保护的计算机。*另参见*恶意软件和 rootkit。\n\n### 机器人\n被恶意软件感染并作为僵尸网络一部分的目标计算机。*另参见*僵尸网络和恶意软件。\n\
  \n### 僵尸网络\n一个由恶意软件感染的机器人组成的广泛网络，由攻击者通过命令与控制（C2）服务器协同工作。*另参见*机器人和恶意软件。\n\n### 泄露\n\
  导致机密信息未经授权披露或系统损坏的行为。\n\n### 网桥\n一种将数据包转发到其他网络的网络设备。\n\n### 自带设备 (BYOD)\n一种移动设备策略，允许员工在工作场所使用个人移动设备处理工作相关和个人事务。\n\
  \n### 广播\n一种网络协议，数据包从源发送到网络上的每个节点。\n\n### 欠电压\n电力源（如公用事业部门）电压长时间下降。\n\n### 暴力攻击\n\
  一种攻击类型，攻击者尝试所有可能的字母、数字和字符组合来破解密码、密码语或 PIN。\n\n### 缓冲区（或栈）溢出\n一种攻击类型，攻击者输入超出范围的参数或故意超过系统或应用程序的缓冲区容量，以实施拒绝服务\
  \ (DoS) 或利用漏洞。\n\n### 建筑成熟度模型 (BSIMM)\n一种用于软件开发的成熟度模型。\n\n### 总线（计算机架构）\n计算机系统中基本组件之间的逻辑连接，包括中央处理器（`CPU`）、内存和外围设备。\n\
  \n### 总线（网络拓扑）\n一种所有设备都连接到单一电缆的网络拓扑。\n\n### 业务影响分析 (BIA)\n一种风险分析，作为业务连续性计划的一部分，描述了各种\
  \ IT 系统丢失对业务运营造成的影响。\n\n### 呼叫 ID\n在建立电话连接期间，用于将呼叫方的电话号码传输给被叫方电话设备的协议。\n\n### 呼叫\
  \ ID 伪造\n使用设备或服务更改拨出电话的呼叫 ID，呼叫者借此冒充他人以实施欺骗。*另参见*呼叫 ID。\n\n### 能力成熟模型集成 (CMMI)\n\
  一种用于软件开发和其他 IT 实践（包括信息安全）的成熟度模型。\n\n### 中央处理器 (CPU)\n执行计算机算术、逻辑和计算功能的电子电路。\n\n###\
  \ 认证\n一种正式方法，使用既定的评估标准对环境中信息系统安全防护措施（技术和非技术）进行全面的测试和记录。\n\n### 证书机构 (CA)\n在 PKI\
  \ 中，CA 发行证书、维护并发布状态信息和证书吊销列表（`CRLs`），并维护存档。*另参见*公钥基础设施 (`PKI`)。\n\n### 监管链（或证据链）\n\
  为证据的整个生命周期提供问责制和保护。\n\n### 挑战握手身份验证协议 (CHAP)\n\n\n\n\n\n一种使用 三次握手对等端和服务器进行身份验证的远程访问控制协议。*参见*三次握手。\n\
  \n**变更管理 (change management):**\n确保对系统进行的所有更改都经过妥善请求、审核、批准、测试和实施的正式业务流程。\n\n**自选设备\
  \ (CYOD):**\n一种移动设备策略，允许员工从组织批准的设备列表中选择其偏好的移动设备。\n\n**选择明文攻击 (chosen plaintext attack):**\n\
  一种攻击技术，密码分析师选择要加密的明文，然后分析生成的密文。\n\n**C-I-A：**\n机密性、完整性和可用性。\n\n**密码算法 (cipher):**\n\
  一种加密变换。\n\n**分组链模式 (CBC):**\nDES 的四种工作模式之一。对 64 位明文块进行操作产生 64 位密文块。每个块都与前一个块的密文进行异或（XOR），创建一个依赖关系（链），从而产生更随机的密文结果。CBC\
  \ 是 DES 最常用的工作模式。*参见*密码反馈模式 (CFB)、数据加密标准 (DES)、电子密码本 (ECB)、异或 (XOR) 和输出反馈模式 (OFB)。\n\
  \n**密码反馈模式 (CFB):**\nDES 的四种工作模式之一。CFB 是一种流密码，最常用于加密单个字符。在这种模式下，之前生成的密文被用作下一个密钥流中密钥生成的反馈，并将生成的密文链接在一起。*参见*分组链模式\
  \ (CBC)、数据加密标准 (DES)、电子密码本 (ECB) 和输出反馈模式 (OFB)。\n\n**密文 (ciphertext):**\n已被转换（加密）为无法理解的乱码消息的明文消息。\n\
  \n**电路交换网络 (circuit-switched network):**\n一种在端点之间提供专用物理电路路径的电信网络设计。\n\n**间接证据 (circumstantial\
  \ evidence):**\n无法直接或确定性地与其他事件建立联系，但可以对其进行合理推断的相关事实。*参见*证据。\n\n**民法（或侵权法）[civil\
  \ (or tort) law]:**\n处理针对个人或企业的故意或过失的错误行为（导致损害、损失或死亡）的法律规范。与刑法不同，美国的民事案件根据证据优势原则判定，且惩罚限于罚款。\n\
  \n**克拉克克-威尔逊模型 (Clark-Wilson model):**\n一种正式的完整性模型，解决了完整性的三个目标（防止未经授权的用户进行任何更改、防止授权用户进行更改以及维护内部和外部一致性），并确定了输入数据的特殊要求。\n\
  \n**分类 (classification):**\n为文档分配安全标签的过程，该标签定义了如何处理该文档。\n\n**闭源系统 (closed system):**\n\
  使用专有硬件/软件的系统，可能与其他系统组件不兼容。*参见*开放系统。\n\n**云 (cloud):**\n按需获取的基于互联网的网络、计算和应用基础设施。\n\
  \n**云访问安全网关 (CASB):**\n用于执行有关云资源使用策略的系统。\n\n**集群 (cluster):**\n包含多个冗余节点以实现韧性的系统或网络配置。*参见*主主备（active-active）和主备（active\
  \ passive）。\n\n**聚类（或密钥聚类）[clustering (or key clustering)]:**\n当使用相同的加密算法但不同的密钥从明文消息生成相同消息的情况。\n\
  \n**同轴电缆 (coaxial cable):**\n一种由单根实心线芯组成的网络介质，周围包有绝缘层和金属箔。\n\n**冲突域 (collision domain):**\n\
  网络中接收来自其中一个节点广播数据包的区域。\n\n**通用漏洞评分系统 (CVSS):**\n一种行业标准方法，用于确定通过漏洞扫描、渗透测试或其他手段识别出的漏洞的严重程度。\n\
  \n**容器 (container):**\n软件的轻量级、独立、可执行的包，包含了运行所需的所有内容。\n\n**容器化 (containerization):**\n\
  一种虚拟化技术，在单个操作系统实例中可以存在多个隔离的应用程序实例（称为容器）。\n\n**COBIT：**\n原名为“信息和相关技术控制目标”（Control\
  \ Objective for Information and Related Technologies）。一种由 ISACA（原“信息系统审计和控制协会”）开发的\
  \ IT 控制和流程框架。\n\n**职业伦道德规范 (code of ethics):**\n定义给定组织或职业内伦理行为的正式声明。\n\n**代码审查 (code\
  \ review):**\n对源代码进行检查以识别缺陷。\n\n**冷机房 (cold site):**\n一种备选的计算机设施，拥有电力和空调（HVAC），但现场未安置计算机设备。*参见*热机房（hot\
  \ site）、空调（HVAC）和暖机房（warm site）。\n\n**通用标准 (Common Criteria):**\n一项旨在标准化和改进现有的欧洲和北美信息系统评估标准的国际努力。\n\
  \n**普通法 (common law):**\n一种起源于中世纪英国、基于习惯和司法判例的法律体系。\n\n**社区云 (community cloud):**\n\
  根据 NIST 定义，一种“为具有共同关注点的组织的特定消费者群体独占提供的”云基础设施。*参见*云。\n\n**补偿性控制 (compensating controls):**\n\
  作为其他预防、检测、纠正、威慑或恢复控制的替代方案实施的控制。\n\n**补偿性 (compensatory damages):**\n受害者的实际损失，包括律师/法律费用、利润损失、调查成本等。\n\
  \n**复杂指令集计算 (Complex-Instruction-Set--CISC):**\n一种微处理器指令集架构，每条指令都可以执行多个低级操作。*参见*精简指令集计算\
  \ (RISC)。\n\n**合规 (compliance):**\n符合规则，包括法律、法规、标准和法律协议。\n\n**组件对象模型 (COM):**\n\
  一种与平台无关、分布式、面向对象的系统，用于创建可以交互的二进制软件组件。COM 是微软 OLE 和 ActiveX 的基础技术。*参见*对象链接与嵌入和 ActiveX。\n\
  \n**计算机事件响应小组 (CIRT) 或计算机应急响应小组 (CERT):**\n一个由在事件响应和调查方面经过良好培训的人员组成的团队。\n\n**隐蔽密码\
  \ (concealment cipher):**\n一种在显眼位置处隐藏消息的技术。关键在于知道消息所在。\n\n\n\n\n\n**集中器 (concentrator):**\n\
  见 hub (hub)。\n\n**确定性证据 (conclusive evidence):**\n不可争议且不可反驳的……你知道，即*实锤*。见证据 (evidence)。\n\
  \n**机密性 (confidentiality):**\n将信息的访问限制在需要它的主体（用户和机器）的概念。\n\n**保密协议 (confidentiality\
  \ agreement):**\n见非泄密协议 (NDA)。\n\n**配置管理 (configuration management):**\n记录信息系统所有更改的过程。\n\
  \n**内容分发网络 (CDN):**\n一种分布式服务器系统，通过距离用户最近的地理位置交付缓存的网页和其他静态内容。也称为*内容交付网络 (content\
  \ delivery network)*。\n\n**持续专业教育 (CPE):**\n进一步提高个人职业领域技能和知识的培训课程和其他活动。\n\n**业务连续性运营计划\
  \ (COOP):**\n将灾难恢复计划 (DRP) 和业务连续性计划 (BCP) 整合为单一的协调活动。\n\n**持续改进 (continual improvement):**\n\
  导致人员、流程和技术逐步改进的实践。\n\n**持续监控 (continuous monitoring):**\n对过程或系统进行实时或近实时的检查。见监控 (monitoring)。\n\
  \n**控制 (control):**\n有助于避免或缓解安全风险的保护措施或对。\n\n**控制评估 (control assessment):**\n对控制进行检查以确定其有效性。\n\
  \n**控制框架 (control framework):**\n组织的控制措施集合。\n\n**版权 (copyright):**\n授予“原创作品”作者（无论已出版还是未出版）的一种法律保护形式。\n\
  \n**纠正控制 (corrective controls):**\n弥补违规和事件，或改进现有预防和检测控制的控制。\n\n**佐证证据 (corroborative\
  \ evidence):**\n支持或证实法律案件中提出的其他证据的证据。见证据 (evidence)。\n\n**对措施 (countermeasure):**\n\
  为减少安全事件的影响或概率所需的设备、控制或行动。\n\n**隐蔽通道 (covert channel):**\n非预期的通信路径；它可能是隐蔽存储通道或隐蔽等待通道。\n\
  \n**刑法 (criminal law):**\n定义针对社会的犯罪，即使实际受害者是企业或个人。制定刑法的目的是为了保护普通公众。与民法不同，美国刑事案件的裁决基于当一方在合理怀疑的情况下有罪时，处罚可能包括罚款、监禁甚至死刑。\n\
  \n**关键性评估 (criticality assessment):**\n业务影响分析 (BIA) 中对业务流程和 IT 系统重要性排名的部分。见业务影响分析\
  \ (BIA)。\n\n**跨框架脚本 (XFS):**\n见框架注入 (frame injection)。\n\n**交叉错误率 (CER):**\n在生物识别访问控制系统中，误拒绝率\
  \ (FRR) 等于误接受率 (FAR) 的点，以百分比表示。见误接受率 (FAR；或 II 类错误) 和误拒绝率 (FRR；或 I 类错误)。\n\n**跨站请求伪造\
  \ (CSRF):**\n攻击者试图欺骗受害者点击链接，从而执行受害者在其他情况下不会批准的操作的攻击。\n\n**跨站脚本 (XSS):**\n攻击者试图向网页中注入客户端脚本的攻击。\n\
  \n**密码分析学 (cryptanalysis):**\n在没有密钥的情况下破解密文的科学。\n\n**加密货币 (cryptocurrency):**\n\
  数字货币的一种，如比特币，使用加密来独立于权威机构控制资金转移。\n\n**密码学 (cryptography):**\n加密和解密信息的科学。\n\n**密码学科学\
  \ (cryptology):**\n涵盖密码学和密码分析学的科学。\n\n**密码系统 (cryptosystem):**\n将明文转换为密文并转换回明文的硬件或软件实现。\n\
  \n**加密密钥 (cryptographic key，或 key):**\n应用于密码系统以增强强度的秘密值。\n\n**过度过失 (culpable negligence):**\n\
  描述组织未能遵守尽职调查标准的法律术语。\n\n**保管员 (custodian):**\n对保护资产负日常责任的个人。\n\n**数据分类 (data classification):**\n\
  定义敏感性级别和处理方法的策略。\n\n**数据控制者 (data controller):**\n根据欧盟数据保护条例 (GDPR) 定义数据存储和处理的组织。\n\
  \n**数据销毁 (data destruction):**\n任何从存储介质中移除数据的手段。\n\n**数据字典 (data dictionary):**\n\
  关于数据的中央信息存储库，例如含义、与其他数据的关系、用途和格式。\n\n**数据封装 (data encapsulation):**\n在网络中，将 OSI\
  \ 模型紧邻上层的协议信息封装在紧邻下层中。也见开放互连模型 (Open Interconnection model)。\n\n**数据加密密钥 (DEK):**\n\
  用于加密和解密数据的加密密钥。见密钥加密密钥 (KEK)。\n\n**数据加密标准 (DES):**\n一种常用的对称密钥算法，使用 56 位密钥并对 64 位块进行操作。见高级加密标准\
  \ (AES)。\n\n**数据链路层 (Data Link Layer):**\nOSI 网络模型的第 2 层。见开放互连模型 (Open Interconnection\
  \ model)。\n\n**数据泄露防护 (DLP):**\n用于检测敏感数据未经授权存储或传输的应用程序或设备。\n\n**电缆服务接口规范 (DOCSIS):**\n\
  一种用于在现有电视电缆系统上传输高速数据的通信协议。\n\n**数据残留 (data remanence):**\n在数据删除后残留在存储介质或内存中的残留数据。\n\
  \n**数据留存 (data retention):**\n支持组织努力保留数据最短和/或最长时间的活动。\n\n**数据仓库 (data warehouse):**\n\
  用于决策支持或研究目的的特殊数据库。\n\n\n\n\n\n`database management system (DBMS):`\n\n限制不同主体对数据库中各种对象的访问。\n\
  \n`data carrier equipment (DCE):`\n\n一种用于在网络中的数据源与其目的地之间建立、维护和终止通信的设备。*另需参见*数据终端设备\
  \ (DTE)。\n\n`data processor:`\n\n根据欧盟《通用数据保护条例》(GDPR)及其他隐私法律的定义，代表数据控制者处理信息的组织。*另需参见*通用数据保护条例\
  \ (GDPR)。\n\n`data protection officer (DPO):`\n\n一个根据根据欧盟《通用数据保护条例》(GDPR)及其他隐私法律的指导，负责开发和管理数据隐私计划的个人。*另需参见*通用数据保护条例\
  \ (GDPR)。\n\n`data terminal equipment (DTE):`\n\n一种与网络中的 `DCE` 通信的设备。*另需参见*数据传输设备\
  \ (`DCE`)。\n\n`decryption:`\n\n将密文转换为明文的过程。\n\n`deep packet inspection (DPI):`\n\
  \n一种用于检查和管理网络流量的高级方法。\n\n`defense in depth:`\n\n通过使用不同机制的层次来保护资产的原则。\n\n`Defense\
  \ Information Technology Security Certification and Accreditation Process (DITSCAP):`\n\
  \n一个为美国国防部信息系统制定正式的认证和认可程序的计划。\n\n`demonstrative evidence:`\n\n用于帮助法院理解法律案件的证据。*另需参见*\
  \ `evidence`。*\n\n`denial of service (DoS):`\n\n对系统或网络进行的攻击，意图是使系统或网络无法使用。\n\n`destructware:`\n\
  \n一种功能与勒索软件相似的恶意软件，区别在于攻击者无意提取赎金，因此没有可用的解密密钥来恢复加密数据。\n\n`detective controls:`\n\n\
  识别违规行为和事件的控制措施。\n\n`deterrent controls:`\n\n威慑违规行为的控制措施。\n\n`DevOps:`\n\n软件开发人员与\
  \ IT 运维之间改进协作的文化和实践。\n\n`DevSecOps:`\n\n在 `DevOps` 中集成安全实践的做法。*另需参见*`DevOps`。\n\n\
  `Diameter:`\n\n下一代 RADIUS 协议。*另需参见*远程认证拨号用户服务 (RADIUS)。\n\n`dictionary attack:`\n\
  \n一种使用预定义词列表的针对性暴力攻击类型。*另需参见*暴力攻击。\n\n`Diffie-Hellman:`\n\n一种基于离散对数的密钥协商算法。\n\n\
  `digital certificate:`\n\n一种将身份与公共加密密钥绑定的证书。\n\n`Digital Signature Standard (DSS):`\n\
  \n由 NIST 发布在联邦信息处理标准 (FIPS) 186-1 中，`DSS` 在其标准中指定了两种接受的算法：RSA 数字签名算法和数字签名算法 (DSA)。*另需参见*NIST\
  \ *以及* Rivest, Shamir, Adleman (RSA)。\n\n`digital subscriber line (xDSL):`\n\n一种通过模拟电信语音线路传输的高带宽通信协议。\n\
  \n`direct evidence:`\n\n基于收集的信息的口头证词或书面陈述，用于证明或反驳特定事实。\n\n`directory harvest attack\
  \ (DHA):`\n\n垃圾邮件发送者用于查找域域内电子邮件地址的暴力技术。\n\n`discretionary access control (DAC):`\n\
  \n由文件所有者决定的访问策略。*另需参见*强制访问控制 (`MAC`)。\n\n`disk mirroring (RAID 1):`\n\n将所有数据的复制副本写入另一块磁盘时。\n\
  \n`disk striping (RAID 0):`\n\n当数据写入多块磁盘上但不提供冗余时。\n\n`disk striping with parity\
  \ (RAID 5):`\n\n当数据写入多块磁盘上，并在某块磁盘故障时提供容错能力时。\n\n`distributed application:`\n\n其组件位于多个位置的软件应用程序。\n\
  \n`distributed denial of service (DDoS):`\n\n攻击者启动许多系统的攻击。\n\n`Distributed Network\
  \ Protocol (DNP3):`\n\n一组用于例如公共公用事业部门之间的通信协议。\n\n`DNS cache poisoning:`\n\n一种攻击类型，也称为\
  \ DNS 欺骗，利用 DNS 中的漏洞将互联网流量从合法服务器引开。*另需参见*域名解析系统 (`DNS`)。\n\n`DNS hijacking:`\n\n\
  一种旨在将 DNS 查询重定向到合法服务器之外的攻击。*另需参见*域名解析系统 (`DNS`)。\n\n`documentary evidence:`\n\n\
  用于法律诉讼的证据，包括业务记录的原件和副本、计算机生成和计算机存储的记录、手册、政策、程序和日志文件。*另需参见*证据。\n\n`domain:`\n\n具有共同安全策略和单一管理的用户、计算机和资源的集合。\n\
  \n`domain homograph attack:`\n\n一种欺骗攻击，攻击者使用外观相似的字符欺骗计算机用户关于正在通信的实际远程系统，例如通过将网站地址中的拉丁字母\
  \ O 替换为西里尔字母 O。\n\n`domain name system (DNS):`\n\n一种分层、去中心化的目录服务数据库，为连接到网络或互联网的计算机、和其他和其他资源将域名转换为\
  \ IP 地址。\n\n`domain name system security extensions (DNSSEC):`\n\n用于保护 IP 网络上 DNS\
  \ 提供的某些信息安全的规范。\n\n`drive-download:`\n\n在用户不知或未许可的情况下从互联网下载到计算机上的软件（通常是恶意软件）。*另需参见*恶意软件。\n\
  \n`drug screen:`\n\n检测药物和受控物质测试，通常作为入职筛选的一部分。*另需参见*背景检查。\n\n`due care:`\n\n组织为实施安全最佳实践所采取步骤。\n\
  \n`due diligence:`\n\n对审慎义务的谨慎管理和执行。\n\n`dumpster diving:`\n\n\n\n\n\n通过检查垃圾数据寻找有价值的货物或信息的过程。\n\
  \n**滞留时间 (dwell time):**\n从安全事件发生到组织意识到事件已发生（或正在发生）之间经过的时间。\n\n**动态应用程序扫描工具 (DAST):**\n\
  一种用于识别软件应用程序漏洞的工具，它通过运行应用程序并尝试各种手段来攻破应用程序来工作。\n\n**动态链接库 (DLL):**\n微软操作系统中使用的一种文件类型，它允许多个程序同时共享单个文件中包含的编程指令，以执行特定功能。\n\
  \n**动态密码 (dynamic password):**\n一种按照某些固定间隔或事件更改的密码。\n\n**窃听 (eavesdropping):**\n\
  监听网络流量以获取内容或了解更多通信信息。\n\n**ECMAScript:**\n由 Ecma 国际组织在 `ECMA-262` 和 `ISO/IEC 16262`\
  \ 中标准化的脚本语言规范。\n\n**边缘计算 (edge computing):**\n一种通过在网络边缘（靠近数据源的地方）处理数据来优化云计算的方法。\n\
  \n**电子取证 (eDiscovery):**\n参见电子发现 (electronic discovery)。\n\n**电磁干扰 (EMI):**\n三根电线（火线、零线和地线）之间不同电产生的电噪声，可以是`共模噪声`（由火线和地线引起）或`差模噪声`（由火线和零线引起）。\n\
  \n**电子密码本模式 (ECB):**\n`DES` 四种工作模式之一。`ECB` 独立地对 64 位明文块进行操作并产生 64 位密文块，它是 `DES`\
  \ 操作的原生模式。另参见密码块链 (`CBC`)、密码反馈 (`CFB`)、数据加密标准 (`DES`) 和输出反馈 (`OFB`)。\n\n**电子发现 (electronic\
  \ discovery):**\n一种法律或调查程序，其中一方提供其存储在系统中的相关电子数据。\n\n**电子受保护健康信息 (ePHI):**\n`HIPAA`\
  \ 定义的任何与患者相关的健康信息。另参见健康保险流通与责任法案 (`HIPAA`)。\n\n**静电放电 (ESD):**\n两个物体之间突然电流。\n\n\
  **雇用协议 (employment agreement):**\n雇主与员工之间的法律协议，规定了雇佣的条款和条件。\n\n**应聘者筛选 (employment\
  \ candidate screening):**\n参见背景检查 (background check)。\n\n**终止雇用 (employment termination):**\n\
  组织中一个或多名员工雇用关系的终止。\n\n**封装 (encapsulation):**\n在协议栈的不同层级对协议信息进行分层的过程。\n\n**封装安全载荷\
  \ (ESP):**\n`IPsec` 中的一种协议，提供机密性（加密）和有限的认证。另参见互联网协议安全 (`IPsec`)。\n\n**加密 (encryption):**\n\
  将明文转换为密文的过程。\n\n**端到端加密 (end-to-end encryption):**\n一种数据包在原始加密源加密一次，然后仅在最终解密地进行解密的过程。\n\
  \n**终端 (endpoint):**\n指台式电脑、笔记本电脑或移动设备的通用术语。\n\n**诱导 (enticement):**\n在某个人已实施犯罪后，引导其向某些特定证据靠拢。\n\
  \n**权限 (entitlement):**\n根据职位名称、部门或其他标准分配给员工的访问权限。\n\n**陷害 (entrapment):**\n促使某人实施其本无意图实施的犯罪。\n\
  \n**提权提升 (escalation of privilege):**\n攻击者使用某些手段获取目标上更高权限的攻击。\n\n**托管加密标准 (EES):**\n\
  将密钥分成两部分，并将这些部分放入托管。由 `NIST` 在 `FIPS 185` (1994) 发布。\n\n**间谍活动 (espionage):**\n\
  利用间谍获取所有权或机密信息的做法。\n\n**以太网 (Ethernet):**\n一种常见的总线拓扑网络协议。\n\n**伦理 (ethics):**\n\
  指导决策的专业原则和职责。另参见道德准则 (code of ethics)。\n\n**欧洲信息技术安全 (ITSEC):**\n针对整个系统的机密性、完整性和可用性的正式评估标准。\n\
  \n**证据 (evidence):**\n为了支持调查而获取的信息。\n\n**证据周期 (evidence lifecycle):**\n证据从最初发现到最终处置的各个阶段。证据生命周期包括以下阶段：收集与识别；分析；存储、保存和运输；法庭提交；以及归还所有者。\n\
  \n**异或 (XOR):**\n应用于两个输入位的二进运算。如果两个位相等，结果为零；如果两个位不相等，结果为一。\n\n**紧急情况 (exigent circumstances):**\n\
  如果存在合理理由且证据毁毁在眉睫，执法人员可以在没有搜查令的情况下搜索财产和/或没收证据。\n\n**专家系统 (expert system):**\n一种基于推理引擎（试图推导出答案的程序）和知识库的人工智能系统。\n\
  \n**漏洞利用 (exploit):**\n(1) 利用操作系统 (OS) 或应用程序中的漏洞并导致操作系统或应用程序产生非预期行为（如提权、远程控制或拒绝服务）的软件或代码；(2)\
  \ 主体、系统或程序利用漏洞获取对对象的非法访问的行动。\n\n**暴露因子 (EF):**\n一种以百分比表示的、实现的威胁或事件对特定资产产生的负面影响或影响程度。\n\
  \n**扩展认证协议 (EAP):**\n一种远程访问控制协议，实现了多种认证机制，包括 `MD5`、`S/Key`、通用令牌卡和数字证书。常用于无线网络。\n\
  \n**企业外网 (extranet):**\n扩展到包含外部实体（如客户、合作伙伴和供应商）的内网。另参见内网 (intranet)。\n\n**法根审查 (Fagan\
  \ inspection):**\n一种用于发现设计文档、规格书和源代码中缺陷的结构化过程。\n\n**故障闭锁 (fail closed):**\n一种导致所有访问被阻塞的控制失效。\n\
  \n\n\n\n\n`fail open:`\n一种控制故障导致所有访问均被允许的情况。\n\n`failover:`\n一种故障模式，当检测到硬件或软件故障时，系统会自动将处理过程转移到热备组件（例如集群服务器）。\n\
  \n`fail-safe:`\n一种故障模式，当检测到硬件或软件故障时，会终止程序执行并保护系统免受损害。\n\n`fail-soft (or resilient):`\n\
  一种故障模式，当检测到硬件或软件故障时，会终止某些非关键处理，且计算机或网络以降级模式继续运行。\n\n`False Accept Rate (FAR; or\
  \ Type II Error):`\n在生物识别访问控制系统中，未经授权的用户被错误授予访问权限的百分比。另见交叉错误率 (CER) 和错误拒绝率 (FRR;\
  \ 或 I 类错误)。\n\n`False Reject Rate (FRR; or Type I Error):`\n在生物识别访问控制系统中，已授权的用户被错误拒绝访问的百分比。另见交叉错误率\
  \ (CER) 和错误接受率 (FAR; 或 II 类错误)。\n\n`fault:`\n电力的暂时性丢失。\n\n`fault-tolerant:`\n在计算机或网络组件故障后仍能运行的系统。\n\
  \n`Federal Information Processing Standard (FIPS):`\n由美国国家标准与技术研究院 (NIST) 针对联邦计算机发布的标准和指南。另见\
  \ NIST。\n\n`federated identity management:`\n一种允许多个组织共享公共身份管理系统的系统。\n\n`FedRAMP:`\n\
  美国联邦政府机构在采购云服务时必须的流程。\n\n`Fiber Distributed Data Interface (FDDI):`\n一种星型拓扑、令牌传递的网络传输协议。\n\
  \n`fiber optic cable:`\n一种由传输光信号的玻璃或塑料纤维组成的网络介质。\n\n`Fibre Channel over Ethernet\
  \ (FCoE):`\n一种在 10Gb 以以太网（或更快）网络上封装纤通道帧的通信协议。\n\n`firewall:`\n一种控制网络间流量流的设备或程序。\n\
  \n`firmware:`\n存储在 ROM 内存中的程序或代码。\n\n`first aid:`\n在接受医疗治疗之前用于治疗人员受伤的技术。\n\n`forensics\
  \ (or computer forensics):`\n一种进行计算机犯罪调查的科学，旨在确定发生了什么以及谁对此负责。计算机取证的一个主要组成部分是收集用于计算机犯罪案件的法律认可证据。\n\
  \n`frame injection:`\n一种攻击手段，攻击者试图向浏览器加载任意代码，以便从浏览器会话中的其他帧窃取数据。\n\n`frame relay\
  \ (FR):`\n一种用于传输广域网 (WAN) 通的包交换网络协议。\n\n`fraud:`\n任何导致非法个人收益的欺骗性或虚假活动。\n\n**fuzzing:`\n\
  一种软件测试技术，向程序输入许多不同的输入字符串组合，试图触发意外行为。\n\n`fuzzy logic:`\n一种用于判断给定条件真伪的人工智能方法。\n\n\
  `gateway:`\n连接到网络并执行实时翻译或接口的系统；例如某种系统。\n\n`General Data Protection Regulation (GDPR):`\n\
  加强对欧盟 (EU) 公民的数据保护并解决个人数据出口到欧盟以外的问题。\n\n`global positioning system (GPS):`\n美国政府拥有的卫星系统，在地球任何地方或附近提供地理位置和时间信息。\n\
  \n`goals:`\n组织希望实现的特定里程碑。\n\n`governance:`\n确保管理层充分获知并控制组织某些方面的政策和流程。\n\n`gray-box\
  \ testing:`\n一种安全测试，测试人员对被测试系统具有一定的了解。\n\n`guest:`\n1. 环境中操作系统的实例。\n2. 商业设施中的访客。\n\
  \n`guidelines:`\n与标准类似，但被认为是建议而非强制性要求。\n\n`hacktivist:`\n一个基于意识形态动机攻击组织的个人。\n\n\
  `hardening standard:`\n一份描述适用系统安全设置的书面文档。\n\n`hardware:`\n计算机系统的物理组件。\n\n`hardware\
  \ segmentation:`\n通过将功能放置在单独的硬件上来实现功能隔离的实践。\n\n`hash function:`\n一种为较大数据集创建唯一表示形式（如摘要）的数学函数。哈希函数经常用于加密算法以及产生校验和和消息摘要。另见消息摘要。\n\
  \n`Health Insurance Portability and Accountability Act (HIPAA):`\n一项针对医疗系统和信息安全及隐私要求的联邦法案。\n\
  \n`hearsay evidence:`\n不是基于证人的个人第一手知识，而是通过其他来源获取的证据。\n\n`hearsay rule:`\n根据《联邦证据规则》，传言证据通常在法庭上不可采信。计算机证据是传言规则的例外。\n\
  \n`heterogeneous environment:`\n由多种类型的系统组成的系统环境。另见同质环境。\n\n`hidden code:`\n一种在另一个程序中嵌入秘密（通常是恶意的）计算机代码的攻击。\n\
  \n`High-Speed Serial Interface (HSSI):`\n一种点对广域网连接协议。\n\n`homogeneous environment:`\n\
  主要由一种类型的系统组成的系统环境。另见异质环境。\n\n`honeynet:`\n蜜罐罐的大规模部署。也称为蜜罐农场 (honeyfarm)。另见蜜罐。\n\n\
  `honeypot:`\n\n\n\n\n\n安全管理员部署的诱饵系统，用于发现潜在黑客的攻击方法。\n\n**基于主机的入侵检测系统 (HIDS):**\n\n\
  一种旨在通过检查主机系统上的活动来检测入侵的入侵检测系统。*另参见*入侵检测系统。\n\n**热备件 (hot site):**\n\n一个完全配置的备用计算机设施，具备电力、HVAC\
  \ 以及正常运行的文件/打印服务器和工作站。*另参见*冷备件、`HVAC` 以及温备件。\n\n**集线器 (hub):**\n\n一种用于连接多个局域网设备的网络设备。也称为\
  \ `concentrator`。\n\n**混合云 (hybrid cloud):**\n\n根据 NIST 的定义，由“两个或多个不同的云基础设施（私有、社区或公共）”组成的云基础设施。\n\
  \n**超文本传输协议 (HTTP):**\n\n一种用于在 Web 服务器和浏览器之间传输数据的应用协议。\n\n**安全超文本传输协议 (HTTPS):**\n\
  \n使用 SSL 或 TLS 加密的 `HTTP` 协议。*另参见*超文本传输协议。\n\n**虚拟机监控器 (hypervisor):**\n\n在虚拟化环境中，控制资源分配以及对通信和外围设备访问的监督程序。*另参见*虚拟化。\n\
  \n**基础设施即服务 (IaaS):**\n\n根据 NIST 的定义，“为消费者提供的配置处理、存储、网络和其他基础计算资源的能力，消费者能够在其中部署和运行任意软件，其中可能操作系统和应用程序。”\n\
  \n**身份识别 (identification):**\n\n用户向系统声称其特定且未经经验实的身份的手段。*另参见*身份验证。\n\n**身份和访问管理 (IAM):**\n\
  \n支持组织内人员身份和访问权限生命周期管理的流程和程序。\n\n**身份服务 (identity as a service):**\n\n一种中心化的、通常是外部的服务供应商，提供用户识别工具。\n\
  \n**身份管理 (identity management):**\n\n支持组织内人员身份生命周期管理的流程和程序。\n\n**空闲超时 (inactivity\
  \ timeout):**\n\n一种在用户预设的一段时间未活动后，锁定、挂起或注销用户的机制。\n\n**入侵指标 (IOCs):**\n\n在网络或操作系统中观察到的、可能与违规尝试相关的产物。\n\
  \n**工业控制系统 (ICS):**\n\n用于监控和/或控制工业机械的系统和设备。\n\n**推理 (inference):**\n\n用户获取其未授权的敏感级别数据信息的能力。\n\
  \n**推理通道 (inference channel):**\n\n一种允许推理发生的链路。\n\n**推理引擎 (inference engine):**\n\
  \n一种从知识库中推导答案的人工智能系统。\n\n**信息保管员 (information custodian (or custodian)):**\n\n负责日常保护信息资产的个人。\n\
  \n**信息流模型 (information flow model):**\n\n一种基于格的模型，其中每个对象被分配一个安全级别和值，其流向方向由安全策略控制。\n\
  \n**信息所有者 (information owner (or owner)):**\n\n决定谁允许访问文件以及授予什么权限的个人。\n\n**信息安全管理体系\
  \ (ISMS):**\n\n一组用于管理组织内信息安全计划的流程和活动。ISMS 定义在 `ISO/IEC 27001` 中。\n\n**注入攻击 (injection\
  \ attack):**\n\n一种针对系统的、涉及使用恶意输入的攻击。\n\n**浪涌电流 (inrush):**\n\n电气设备开启时经历的初始电功率激增。\n\
  \n**电气电子工程师学会 (IEEE):**\n\n一个促进技术进步的学术性专业组织。\n\n**综合业务数字网络 (ISDN):**\n\n一种在模拟电信语音线路上运行的低带宽通信协议。\n\
  \n**完整性 (integrity):**\n\n保护信息和处理方法的准确性和完整性，并确保：\n* 数据的修改不是由未经授权的用户或过程进行的。\n* 授权的用户不对数据进行未经授权的修改。\n\
  * 数据在内部和外部保持一致，意味着给定输入产生预期的输出。\n\n**知识产权 (intellectual property):**\n\n包括专利、著作权和商业秘密。\n\
  \n**国际电工委员会 (IEC):**\n\n一个定义电气、电子及相关技术国际标准的组织。\n\n**国际标准组织 (ISO):**\n\nISO 源自希腊语“等同”。\n\
  \n**国际电信联盟 (ITU):**\n\n一个负责协调电信业务和服务的联合国机构。\n\n**互联网 (Internet):**\n\n连接各个组织网络的全球范围内可访问的网络。\n\
  \n**互联网控制消息协议 (ICMP):**\n\n一种用于传输诊断消息的 Internet 协议。\n\n**互联网工程任务组 (IETF):**\n\n\
  一个开发和促进自愿性互联网标准的国际成员制非营利组织。\n\n**网络层 (Internet Layer):**\n\n`TCP/IP` 模型的第二层。*另参见*`TCP/IP`\
  \ 模型。\n\n**物联网 (IoT):**\n\n嵌入电子设备、软件、传感器和网络连接的物理智能对象的网络。\n\n**互联网协议 (IP):**\n\n\
  现代互联网基础的开放系统互连 (OSI) 第三层协议。\n\n**IP 安全协议 (IPsec):**\n\n一种 `IETF` 开放标准的虚拟专用网络 (VPN)\
  \ 协议，用于局域网 (LAN)、广域网 (WAN) 和公共 IP 网络上的安全通信。\n\n**即时聊天 (IRC):**\n\n一种通过客户端/服务器网络以文本形式促进通信的应用层协议。\n\
  \n**小型计算机接口 (iSCSI):**\n\n一种允许在局域网 (LAN)、广域网 (WAN) 或互联网上发送 `SCSI` 命令的通信协议。\n\n**网际包交换\
  \ (IPX):**\n\n一种作为 Novell Netware 网络基础的网络包型协议。`IPX` 类似于 `IP`。\n\n**内网 (intranet):**\n\
  \n组织内部用于在组织员工间安全共享信息的私有网络。\n\n\n\n\n\n### 安全系统与标准\n\n#### `入侵检测系统 (IDS)`\n一种用于检测和报告可疑网络或主机入侵的硬件或软件应用程序。\n\
  \n#### `入侵预防系统 (IPS)`\n一种既能检测又能阻止可疑网络或主机入侵的硬件或软件应用程序。\n\n#### `IT 基础库 (ITIL)`\n\
  一种关于 IT 服务管理流程的行业标准。\n\n### 编程与协议\n\n#### `JavaScript`\n一种高级、动态、轻量级的解释型编程语言，用于使网页具有交互性并为在线程序提供高级、动态、轻量级的解释型编程语言。\n\
  \n#### `JScript`\n微软对 `ECMAScript` 标准的变体，用于微软的 `Internet Explorer`。*另参见* `ECMAScript`。\n\
  \n### 就业与风险管理\n\n#### `职位描述`\n对职位角色和职责的正式描述。\n\n#### `岗位轮换`\n出于交叉培训和安全考虑，将员工从一个职位移动到另一个职位的做法。\n\
  \n#### `Kerberos`\n一种基于票据的验证协议，使用“票据”来识别用户，由马萨诸理工学院（MIT）开发。\n\n#### `密钥密钥 (KEK)`\n\
  一种用于加密和解密数据加密密钥 (`DEK`) 的加密密钥。*另参见* 数据加密密钥 (`DEK`)。\n\n#### `键盘记录`\n一种记录击键轨迹的做法，通常用于非法目的，例如获取用户\
  \ ID、密码和其他机密信息。\n\n#### `关键绩效指标 (KPI)`\n一种用于评估组织在实现特定目标或活动方面成功程度的可衡量值。\n\n#### `关键风险指标\
  \ (KRI)`\n一种用于指示与特定活动或行动相关风险水平的指标。\n\n### 密码学与攻击\n\n#### `已知明文攻击`\n一种攻击技术，其中密码分析学家拥有给定的明文消息及其生成的密文。\n\
  \n#### `KryptoKnight`\n一种基于票据的单点登录（SSO）验证系统，使用“票据”来识别用户，由 IBM 开发。\n\n#### `基于格的访问控制`\n\
  一种实现强制性访问控制的方法，其中数学结构定义了元素对（例如主体和对象）的最大下界值和最小上界值。\n\n### 网络协议\n\n#### `二层转发协议 (L2F)`\n\
  一种类似于点对点隧道协议 (PPTP) 的虚拟专用网络（VPN）协议。\n\n#### `二层隧道协议 (L2TP)`\n一种类似于点对点隧道协议 (PPTP)\
  \ 和二层转发协议 (`L2F`) 的虚拟专用网络（VPN）协议。\n\n#### `最小权限`\n一种原则，要求仅授予主体执行所分配任务所需的最小权限。\n\n\
  #### `轻量级目录访问协议 (LDAP)`\n一种支持认证和目录功能的 Internet 协议 (`IP`) 和数据存储模型。\n\n#### `链路加密`\n\
  在网络路径上的每个节点对数据包进行加密和解密；要求每个节点对其上游和下游邻居拥有独立的密钥对。\n\n#### `链路层`\n`TCP/IP` 模型的第 1 层。*另参见*\
  \ `TCP/IP` 模型。\n\n### 取证与分析\n\n#### `现场取证`\n用于从运行中的系统中收集取证信息的技术。\n\n#### `日志审查`\n\
  对系统日志或事件日志的检查。\n\n#### `逻辑炸弹`\n一种设计在预定情况发生时执行某些功能的程序或程序部分。*另参见* 恶意软件。\n\n#### `机器学习\
  \ (ML)`\n一种使计算机能够自动进行的数据分析方法。\n\n#### `维护钩子`\n一种如果不加安全保护就会存在的后门。\n\n#### `恶意软件`\n\
  通常会造成损害的软件。此类分类包括病毒、蠕虫、勒索软件、间谍软件和广告软件。\n\n#### `托管安全服务 (MSS)`\n由服务提供的安全相关服务。\n\n\
  #### `管理审查`\n管理层审查的活动。\n\n#### `强制访问控制 (MAC) 系统`\n一种由系统而非所有者决定策略的访问控制系统。*另参见* 任意访问控制\
  \ (`DAC`)。\n\n#### `浏览器攻击`\n一种欺骗用户安装浏览器对象以监听流量的攻击。\n\n#### `中间人攻击`\n一种攻击者拦截双方之间的消息并转发原始消息的修改版本的攻击。\n\
  \n#### `人肉门`\n一种由双重锁门或旋转门组成的物理访问控制方法，用于防止尾随。*另参见* 护柱和闸口。\n\n#### `手动控制`\n不是自动执行的控制，因此需要人工操作。\n\
  \n#### `成熟度模型`\n一种用于评估组织成熟度及其流程能力的技术。\n\n#### `最大可忍受机时间 (MTD)`\n关键性分析的扩展，规定了特定业务流程在产生不可接受后果之前可以停止的最长时间。*另参见*\
  \ 关键性分析。\n\n#### `最大中断时间 (MTO)`\n特定业务流程以应急或替代处理模式运行的最长时间。\n\n#### `最大容忍中断期 (MTPD)`\n\
  *参见* 最大可忍机时间 (`MTD`)。\n\n#### `介质控制`\n用于管理信息分类和物理介质的控制。\n\n#### `中间相遇攻击`\n一种攻击类型，攻击者用每个可能的密钥对已知明文进行加密，用每个可能的密钥对密文进行解密，然后在中间比较结果。\n\
  \n#### `内存寻址`\n处理器 (`CPU`) 访问内存内容的方法。\n\n#### `内存泄漏`\n导致程序继续分配内存的软件缺陷。\n\n#### `内存空间`\n\
  计算机系统中可用的内存。\n\n\n\n\n\n### `message digest:`\n通过使用单向哈希函数产生的消息的压缩表示。另参见 `hash function`。\n\
  \n### `metadata:`\n“关于数据的数据”，可能通过披露文档或其历史的隐私信息而带来安全风险。\n\n### `metamorphism:`\n\
  病毒中的一种技术，用于改变其在宿主程序中的外观，而不一定依赖于加密。外观上的差异源于病毒对其自身身体的修改。另参见 polymorphism（多态性）。\n\n\
  ### `metropolitan area network (MAN):`\n跨越大区域（如城市）的网络。\n\n### `MIME Object Security\
  \ Services (MOSS):`\n通过使用 `MD2` 或 `MD5`、`RSA` 非对称密钥以及 `DES` 提供机密性、完整性、识别与认证以及不可否认性。另参见数据加密标准\
  \ (`DES`)、多用途互联网邮件扩展 (`MIME`) 以及 Rivest, Shamir, Adleman (`RSA`)。\n\n### `mission\
  \ statement:`\n定义组织（或组织单元）存在意义的陈述。\n\n### `mobile app:`\n运行在移动设备上的应用程序，具备与用户交互、通过互联网通信以及在本地存储数据的能力。\n\
  \n### `mobile device:`\n涵盖所有小型设备的通用术语，如智能手机、平板手机和平板电脑，这些设备运行如 `iOS`、`Android` 和\
  \ `Windows 10` 等操作系统。\n\n### `mobile device management (MDM):`\n用于管理智能手机、平板手机和平板电脑等移动设备行政工作的软件。\n\
  \n### `monitoring:`\n验证流程、程序和系统的活动。\n\n### `monoalphabetic substitution:`\n一种使用单字母表对整个消息进行加密和解密的密码系统。\n\
  \n### `multicast:`\n一种网络协议，数据包从源发送到多个目的地。\n\n### `multi-factor authentication:`\n\
  任何需要以下两个或多个因素的身份验证机制：*你知道的、你拥有的、你所是的。*\n\n### `multi-level system:`\n一个处理主体和对象之间多个分类层级的单一计算机系统。\n\
  \n### `multiprocessing:`\n一个在多个处理器上同时执行多个程序的系统。\n\n### `multiprogramming:`\n一个在单个处理器上交替执行多个程序的系统。\n\
  \n### `multi-protocol label switching (MPLS):`\n一种极快的网络数据包转发方法，通过在数据包的第 2 层和第 3\
  \ 层头之间插入标签来实现。\n\n### `Multipurpose Internet Mail Extensions (MIME):`\n一种 `IETF`\
  \ 标准，定义了互联网上电子邮件系统之间交换的消息的格式。另参见 `IETF`。\n\n### `multitasking:`\n一个在单个处理器上交替执行多个子程序或任务的系统。\n\
  \n### `National Computer Security Center (NCSC):`\n美国政府机构，隶属于国家安全局 (`NSA`)，负责评估用于处理机密数据的计算设备和应用程序。\n\
  \n### `National Information Assurance Certification and Accreditation Process (NIACAP):`\n\
  将美国政府国家安全信息系统的认证和认可过程正式化。\n\n### `National Institute of Standards and Technology\
  \ (NIST):`\n美国商务部属的一个联邦机构，负责通过标准、科学和技术促进创新和竞争力。\n\n### `near-field communications\
  \ (NFC):`\n一种在距离长达 10 厘米范围内工作的无线通信协议。\n\n### `need-to-know:`\n授予个人的的一种状态，定义了其执行工作所需的必要信息。\n\
  \n### `Network Access Layer:`\n`TCP/IP` 模型的第 1 层。\n\n### `network address translation\
  \ (NAT):`\n将网络内部使用的私有地址转换为外部公共地址的过程。\n\n### `network-based intrusion detection system\
  \ (NIDS):`\n一种通过检查网络流量来检测入侵的入侵系统。另参见入侵检测系统（intrusion detection system）。\n\n### `network\
  \ interface card (NIC):`\n一种允许计算机或其他系统连接到网络的适配器。\n\n### `Network Layer:`\n`OSI`\
  \ 模型的第 3 层。另参见开放系统互连 (`OSI`) 模型。\n\n### `network penetration test:`\n一种针对网络上的系统和网络设备的渗透测试。另参见渗透测试（penetration\
  \ test）。\n\n### `network sprawl:`\n一种现象，指在云等环境中通常在没有批准或在有限规划的情况下创建网络元素。\n\n### `neural\
  \ network:`\n一种模拟人类神经系统功能的人工智能。\n\n### `next-generation firewall (NGFW):`\n一种网络安全平台，将防火墙和入侵防御能力与其他高级安全功能完全集成，提供深度数据包检测\
  \ (`DPI`) 以实现完整的应用程序、内容和用户识别，以及细粒度基于策略的控制。另参见深度数据包检测 (`DPI`) 和入侵防御系统 (`IPS`)。\n\n\
  ### `non-compete agreement:`\n一种法律协议，员工同意不在竞争组织任职。\n\n### `non-disclosure agreement\
  \ (NDA):`\n一种法律协议，一个或多个双方同意不向其他方传播机密信息。\n\n### `non-interference model:`\n确保不同对象和主体的行为不会被同一系统上的其他对象和主体看到，也不会干扰它们。\n\
  \n### `non-repudiation:`\n用户无法否认其操作；其身份与该操作正相关。\n\n### `object:`\n一种被动实体，例如系统或文件。\n\
  \n### `Object Linking and Embedding (OLE):`\n微软的一种专有技术，允许对文档和其他对象进行嵌入和链接。\n\n###\
  \ `object reuse:`\n在对象初始使用后重新分配时保护其机密性的过程。另参见可信计算机系统评估标准 (`TCSEC`)。\n\n### `objectives:`\n\
  组织为了实现目标想要执行的特定里程碑。另参见目标（goals）。\n\n\n\n\n\n### `on-premises`\n物理位于组织自身信息处理中心的信息系统、应用程序和数据。\n\
  \n### `one-time pad`\n一种只能使用一次的加密密钥流。\n\n### `one-time password`\n仅对单次登录会话有效的密码。\n\
  \n### `one-way function`\n一种在一个方向上容易计算，但在反方向上难以计算的问题。\n\n### `open message format`\n\
  使用发送者私钥通过非对称密钥系统加密的消息。任何人都可以获取的发送者公钥用于解密该消息。这种格式保证了消息的真实性。参见安全签名消息格式（secure and\
  \ signed message format）和安全消息格式（secure message format）。\n\n### `open relay`\n配置错误的电子邮件服务器，允许网络犯罪利用其中继垃圾邮件和钓鱼邮件。\n\
  \n### `open source`\n一种源代码免费获取的软件许可方法。\n\n### `open system`\n符合公认标准的独立厂商系统，促进了不同厂商制造的系统和组件之间的互操作性。参见闭源系统（closed\
  \ system）。\n\n### `Open Systems Interconnection (OSI) model`\n网络的七层参考模型。这些层分别是：物理层（Physical）、数据链路层（Data\
  \ Link）、网络层（Network）、传输层（Transport）、会话层（Session）、表示层（Presentation）和应用层（Application）。\n\
  \n### `operating system (OS)`\n控制计算机硬件和资源并辅助应用程序运行的软件。参见应用程序（application software）。\n\
  \n### `Orange Book`\n参见信任计算机系统评估标准（TCSEC）。\n\n### `Output Feedback (OFB)`\nDES 的种工作模式之一。OFB\
  \ 是一种流密码，通常用于加密卫星通信。在此模式下，之前的明文被用作下一个密钥流密钥生成的反馈；然而，生成的密文不会链在一起（与 CFB 不同）。参见密码文块链接（CBC）、密码文反馈（CFB）和数据加密标准（DES）。\n\
  \n### `outsourcing`\n使用外部组织（第三方）执行业务运营的某些方面。\n\n### `Open Web Application Security\
  \ Project (OWASP)`\n一个致力于 Web 应用程序安全的在线社区。\n\n### `owner`\n组织中负责管理资产的个人，包括分类、处理和访问策略。\n\
  \n### `Platform-as-a-Service (PaaS)`\n根据 NIST 定义，“为消费者提供的能力，使其能够在云基础设施上部署使用提供者支持的编程语言、库、服务工具创建或获取的应用程序。”\n\
  \n### `packet sniffing`\n攻击者使用嗅探器捕获网络包并分析其内容的攻击。\n\n### `packet-filtering firewall`\n\
  一种防火墙，检查传入数据包的源地址和目的地址，然后根据访问控制列表（ACL）允许或拒绝该包。参见访问控制列表（ACL）。\n\n### `packet-switched\
  \ network`\n若干种电信网络技术之一，通过数据包在发送者和接收者之间传输数据。\n\n### `passphrase`\n由多个单词组成的字符字符串，主体向身份验证机制提供以此进行系统身份验证。参见密码（password）。\n\
  \n### `password`\n主体向身份验证机制提供的字符字符串（一个单词或短语），以对系统进行身份验证。\n\n### `Password Authentication\
  \ Protocol (PAP)`\n一种远程访问控制协议，在链路最初建立时使用双向握手对服务器端进行身份验证。\n\n### `patch`\n用于程序或系统以修正缺陷的修复性修复。\n\
  \n### `patch management`\n使用程序和工具对目标系统应用补丁。\n\n### `patent`\n根据美国专利商标局（PTO）的定义，专利是“授予发明者的财产权”。\n\
  \n### `Payment Card Industry Data Security Standard (PCI DSS)`\n保护与信用卡、借记和现金交易相关的个人数据。\n\
  \n### `penetration test`\n一种涉及自动和手动技术的测试，用于识别潜在的软件漏洞。也称为渗透测试（pen testing）。\n\n###\
  \ `personal identification number (PIN)`\n仅限数字的密码，通常用于数字键盘（而非字母数字键盘）可用。参见密码（password）。\n\
  \n### `Personal Information Protection and Electronic Documents Act (PIPEDA)`\n\
  适用于与加拿大公民开展业务的组织。保护个人信息的隐私。\n\n### `personally identifiable information (PII)`\n\
  可以单独或与其他信息结合用于识别、联系或定位某人的信息（如姓名、地址、社会安全号码、出生日期、工作单位等）。\n\n### `pharming`\n一种针对特定组织的钓鱼攻击（钓骗）。\n\
  \n### `phishing`\n一种广泛用于身份盗窃犯罪的社会工程网络攻击。一封声称来自已知合法业务（通常是金融机构、在线拍卖场、零售店等）的电子邮件要求收件者在伪造或被劫持的网站上在线验证个人信息。参见钓骗（pharming）和鱼叉式钓鱼（spear\
  \ phishing）。\n\n### `physical controls`\n确保物理环境安全的控制措施。\n\n### `physical evidence`\n\
  参见真实证据（real evidence）。\n\n### `Physical Layer`\nOSI 模型的物理层。参见开放系统互连模型（OSI model）。\n\
  \n### `plaintext`\n原始可读格式的消息，或经过正确解密（还原）产生原始可读明文的密文。\n\n### `Point-to-Point Protocol\
  \ (PPP)`\n远程访问服务（RAS）服务器使用的协议，用于封装互联网协议（IP）包并在串行和集成数字网络（ISDN）链路上建立拨号连接。\n\n### `Point-to-Point\
  \ Tunneling Protocol (PPTP)`\n一种为个人客户端-服务器连接设计的虚拟专用网络（VPN）协议。\n\n### `policy`\n\
  组织目标、责任、伦理和信念以及通用要求和控制的形式级声明。\n\n### `polyinstantiation`\n允许在不同敏感级别存在相同数据的多个版本。\n\
  \n\n\n\n\n### `polymorphism` (多态性)\n病毒中用于改变其在主机程序中外观的技术。例如，它每次都使用不同的密钥对主体进行加密，并在前面添加一个解密程序。该解密程序（称为\
  \ `decryptor`）在不同的病毒实例中随机变异，以便难以被识别。*另参见*变异（metamorphism）。\n\n### `port hopping`\
  \ (端口跳跃)\n应用程序用于提高可访问性的技术，但也用于网络攻击中动态切换 TCP 端口以规避检测。*另参见*传输控制协议 (TCP)。\n\n### `port\
  \ scan` (端口扫描)\n一种用于确定系统上哪些传输控制协议/互联网协议 (TCP/IP) 和用户数据报协议 (UDP) 服务端口处于激活状态的测试.*另参见*传输控制协议\
  \ (TCP)、互联网协议 (IP) *以及*用户数据报协议 (UDP)。\n\n### `PowerShell`\n一种基于 Microsoft .NET 框架的基于任务的命令行\
  \ shell 和脚本语言。\n\n### `prepared statement` (预编译语句)\n一种由应用程序调用的预定义数据库命令。\n\n### `Presentation\
  \ Layer` (表示层)\nOSI 模型中的第 6 层。*另参见*开放系统连接 (OSI) 模型。\n\n### `Pretty Good Privacy\
  \ (PGP)` (良好的隐私)\n一种免费的开源电子邮件应用程序，通过使用国际数据加密算法 (IDEA) 密码进行加密，并使用 RSA 非对称系统进行数字签名和安全密钥传输来提供机密性和身份验证。*另参见*Rivest,\
  \ Shamir, Adleman (RSA)。\n\n### `preventive controls` (预防性控制)\n防止意外事件发生的控制。\n\n\
  ### `privacy` (隐私)\n在信息安全中，指对个人信息的保护和妥善处理。\n\n### `Privacy Enhanced Mail (PEM)`\
  \ (隐私增强邮件)\n一种协议，通过使用 `3DES` 加密、`MD5` 散列值、`X509` 数字证书以及 `RSA` 非对称系统来提供机密性和身份验证。\n\
  \n### `protected health information (PHI)` (受保护健康信息)\n医疗实体收集的有关健康状况或支付的信息。\n\n###\
  \ `private cloud` (私有云)\n根据 NIST 定义，由单一组织使用的云基础设施。\n\n### `private network` (私有网络)\n\
  位于 `TCP/IP` 网络上的地址。\n\n### `privilege creep` (权限蔓延)\n见权限提升。\n\n### `privilege escalation`\
  \ (权限提升)\n见提升。\n\n### `procedures` (程序/步骤)\n关于如何实施策略的详细说明。\n\n### `process isolation`\
  \ (进程隔离)\n一种操作系统功能，使得不同的进程无法访问或修改资源。\n\n### `process table` (进程表)\n活动进程的集合。\n\n\
  ### `promiscuous mode` (混杂模式)\n网络适配器的一种设置，会将所有流量传输到设备。*另参见*嗅探（sniffing）。\n\n###\
  \ `protection domain` (保护域)\n出于安全原因隔离资源的过程。\n\n### `protection rings` (保护环)\n实现多级信任的安全架构。\n\
  \n### `protocol data unit (PDU)` (协议数据单元)\n在特定层使用的数据单元。\n\n### `proximate causation`\
  \ (近因)\n导致后果的事件中采取或未采取的行为。\n\n### `proxy server` (代理服务器)\n从一个网络传输数据到另一个网络的系统。\n\n\
  ### `prudent rule` (谨慎规则）\n根据联邦量刑指南，高级人员被要求诚信、为了企业利益并以通常情况下应有的谨慎和努力履行职责。\n\n###\
  \ `pseudo flaw` (伪缺陷)\n社交工程的一种，攻击者试图骗人执行某些操作。\n\n### `public cloud` (公有云)\n根据 NIST\
  \ 定义，开放。\n\n### `public key cryptography` (公钥加密)\n允许双方在不提前交换密钥的情况下进行通信的加密方法。\n\n\
  ### `public key infrastructure (PKI)` (公钥基础设施)\n通过集成数字签名、数字证书、过程、步骤和其他必要的机密性、身份验证、不可否认性和访问控制的服务。\n\
  \n### `punitive damages` (惩罚性损害)\n由陪审团裁定并旨在惩罚违者。\n\n### `qualitative risk analysis`\
  \ (定性风险分析)\n用定性术语（如高、中、低）来表达风险和成本的风险分析。*另参见*风险分析。\n\n### `Quality of Service (QoS)`\
  \ (服务质量)\n根据响应时间、丢包和抖动等业务需求对各种类型的语音和数据流量进行优先级排序的能力。\n\n### `quantitative risk analysis`\
  \ (定量风险分析)\n包含估计成本的风险分析。*另参见*风险分析。\n\n### `quarantine` (隔离)\n指出于安全原因隔离资源的通用术语。\n\
  \n### `race condition` (竞态条件)\n两个程序、进程或线程正以独占方式访问或操作资源的情况，从而导致意外的结果。\n\n### `radio\
  \ frequency interference (RFI)` (射频干扰)\n由电子元件（如荧光灯和电缆）引起的电噪声。\n\n### `rainbow table`\
  \ (彩虹表)\n哈希值及其对应密码的数据库。\n\n### `ransomware` (勒索软件)\n一种加密受感染服务器或终端文件并索要赎金（通常是加密货币）以获取解密密钥的恶意软件。*另参见*恶意软件\
  \ *以及*加密货币。\n\n### `real (or physical) evidence` (实物/物理证据)\n\n\n\n\n\n实际犯罪中的实体，例如所使用的工具或武器以及任何被盗或损坏的财产。*另参见*证据。\n\
  \n### `recovery controls`\n用于恢复系统和信息的控制。\n\n### `恢复点目标 (RPO)`\n如果发生灾难，数据可能丢失的最大时间范围。\n\
  \n### `恢复时间目标 (RTO)`\n为了确保组织的生存，业务过程在（灾难期间）必须恢复的时间。\n\n### `精简指令集计算 (RISC)`\n一种微处理器指令集架构，它比\
  \ CISC 使用更小、更简单的指令集，使得 RISC 比 CISC 更高效。*另参见*复杂指令集计算 (CISC)。\n\n### `减少分析`\n威胁建模中的一个步骤，旨在减少重复工作。\n\
  \n### `冗余`\n多个系统、节点或网络路径，在发生故障时提供相同的功能，以实现韧性和可用性。\n\n### `独立磁盘冗余阵列 (RAID)`\n系统中一组一个或多个硬盘的集合，用于提高性能或可靠性。\n\
  \n### `参考监控器`\n一种抽象机器（计算机系统或软件程序的理论模型），用于调介主体对对象的所有访问。\n\n### `引用完整性`\n数据库管理系统的一种属性，其中索引、主键和外键等所有数据关系都是健全的。\n\
  \n### `注册机构 (RA)`\n在 PKI 中，`RA` 负责为 `CA` 验证证书内容。*另参见*认证机构 (CA) 以及公钥钥基础设施 (PKI)。\n\
  \n### `远程访问服务 (RAS)`\n一种通常通过拨号接入设施使用的远程访问协议。\n\n### `远程访问木马 (RAT)`\n一种恶意软件，通过远程网络连接控制系统，用于犯罪、恶意或未经授权的目的是。*另参见*恶意软件。\n\
  \n### `远程认证拨入用户服务 (RADIUS)`\n一种基于用户数据报协议 (`UDP`) 的开源客户端-服务器协议，用于验证远程用户。\n\n### `远程备份`\n\
  一种目标备份介质位于远程位置的备份操作。\n\n### `远程桌面协议 (RDP)`\n微软的一种专用协议，用于通过网络连接连接到另一台计算机。\n\n###\
  \ `中继器`\n一种放大或重新传输信号的设备，用于物理上扩展有线或无线网络的范围。\n\n### `复制`\n将数据事务从一个系统复制到另一个系统的过程。\n\
  \n### `仓库`\n在 PKI 基础设施中，仓库是一个接受来自 `CA` 的证书和证书撤销列表 (`CRLs`) 并将其分发给授权方的系统。*另参见*认证机构\
  \ (CA) 以及公钥基础设施 (PKI)。\n\n### `反向地址解析协议 (RARP)`\n一种无盘工作站使用的协议，通过机器地址（称为介质访问控制或 `MAC`\
  \ 地址）查询并发现自己的 IP 地址。\n\n### `Rijndael`\n`AES` 使用的加密算法。*另参见*高级加密标准 (AES)。\n\n###\
  \ `环形`\n所有设备都连接到闭环回路中的网络拓扑。\n\n### `风险接受`\n按原样接受风险或剩余风险，而不对其进行缓解或转移。\n\n### `风险分析`\n\
  作为风险评估的一部分，用于识别和评估业务、流程、系统或活动中的威胁和漏洞的方法。*另参见*风险评估。\n\n### `风险评估`\n对业务流程、信息系统、工作设施或其他研究对象相关的风险的研究。\n\
  \n### `风险分配（或转移）`\n将与风险相关的潜在损失转移给第三方（如保险公司）。\n\n### `风险规避`\n通过停止与风险相关的活动来消除风险。\n\
  \n### `基于风险的认证`\n一种信息系统呈现与用户安全配置文件相适应的认证挑战（例如，地理位置、设备类型等）的过程。\n\n### `风险管理`\n包含风险评估和风险处理的生命周期过程。\n\
  \n### `风险缓解`\n将风险降低到组织可以接受的水平。\n\n### `风险减少`\n通过实施必要的安全控制、策略和程序来保护资产，从而减轻风险。\n\n\
  ### `风险容度`\n组织愿意接受的显性或隐性风险水平。\n\n### `风险转移`\n*见*风险分配。\n\n### `风险处理`\n管理已识别风险的正式决策过程。\n\
  \n### `Rivest, Shamir, Adleman (RSA)`\n一种基于对两个素数的乘积进行分解困难性的密钥传输算法。\n\n### `基于角色的访问控制\
  \ (RBAC)`\n一种实现强制性访问控制的方法，其访问决策根据组织角色的成员身份做出。\n\n### `根内核程序`\n为计算机提供特权（根级）访问的恶意软件。*另参见*恶意软件。\n\
  \n### `职责轮换（或岗位轮换）`\n定期将关键人员调到组织内的不同职位或部门。\n\n### `路由器`\n一种在不同独立网络之间转发数据包的网络设备。\n\
  \n### `路由协议`\n路由器用于通信有关互联连接信息的网络协议。\n\n### `RSA`\n*见*Rivest, Shamir, Adleman\n\n\
  ### `基于规则的访问控制`\n一种通过匹配对象的敏感性标签和主体的敏感性标签来决定应授予还是拒绝访问，从而应用强制访问控制的方法。\n\n### `保护措施`\n\
  实施以减少与特定威胁相关的风险或损害的控制或对措施。\n\n### `电压跌落`\n电压的短暂下降。\n\n### `安全门`\n设施中一个受控的安全入口处。\n\
  \n### `沙箱`\n一种隔离程序或系统的机制。\n\n### `萨班斯-奥克斯利法 (SOX)`\n试图防止美国上市公司的欺诈会计行为和错误，并规定了数据保留要求。\n\
  \n### `扫描`\n\n\n\n\n\n一种用于识别系统或网络中漏洞的技术，通常通过向其传输数据并观察其响应来实现。\n\n### **恐吓软件 (scareware)**\n\
  一种社会工程学攻击类型，其中木马程序或浏览器弹出窗口旨在欺骗用户，认为其计算机存在安全问题。受害者被要求或诱骗点击按钮或链接来修复安全问题；实际上，同意操作的用户正在允许恶意软件在计算机上运行。\n\
  \n### **屏幕保护程序 (screen saver)**\n显示在显示器上的图像或图案，通常作为空闲超时的一部分。*另参见*活动超时。\n\n### **筛选路由器\
  \ (screening router)**\n一种防火墙架构，由一个通过 `ACLs` 控制数据包流的路由器组成。*另参见*访问控制列表 (`ACL`) *以及*防火墙。\n\
  \n### **脚本注入 (script injection)**\n攻击者注入脚本代码的攻击，希望这些代码能在目标系统上执行。\n\n### **脚本小子 (script\
  \ kiddie)**\n指不具备任何编程或黑客技能，而是使用他人开发的脚本、恶意软件、利用程序和其他黑客工具来攻击终端或网络的个人。\n\n### **Scrum**\n\
  敏捷系统开发方法论的一种常见实现。\n\n### **次要证据 (secondary evidence)**\n证据的副本或拷贝，例如磁带备份、屏幕截图或照片。*另参见*证据。\n\
  \n### **安全且签名消息格式 (secure and signed message format)**\n在非对称密钥系统中通过使用接收者的公钥和发送者的私钥加密的消息。这种加密方法保护了消息的机密性并保证了消息的真实性。*另参见*开放消息格式\
  \ *以及*安全消息格式。format。\n\n### **安全电子交易 (SET)**\n一种现已过时的协议，由 MasterCard 和 Visa 开发，旨在通过实施身份验证机制并保护持卡人数据的机密性和完整性，提供安全的电子商务交易。\n\
  \n### **多供应商环境下的安全欧洲系统和应用 (SESAME)**\n一种类似于 `Kerberos` 的基于票的认证协议，具有额外的安全增强。*另参见*\
  \ `Kerberos`。\n\n### **安全超文本传输协议 (S-HTTP)**\n一种提供与网络服务器进行安全通信方法的互联网协议。`S-HTTP` 现在被认为是过时的。*另参见*超文本传输协议\
  \ (`HTTP`) *以及*安全超文本传输协议 (`HTTPS`)。\n\n### **安全消息格式 (secure message format)**\n\
  在非对称密钥系统中通过使用接收者的公钥加密的消息。只有接收者的私钥可以解密。这种加密方法保护了消息的机密性。*另参见*开放消息格式 *以及*安全且签名消息格式。\n\
  \n### **安全多用途邮件扩展 (S/MIME)**\n通过使用 `RSA` 非对称密钥系统、数字签名和 `X.509` 数字证书，为电子邮件提供机密性和身份验证。*另参见*Rivest,\
  \ Shamir, Adleman (`RSA`)。\n\n### **安全外壳 (SSH)**\n一种安全的面向字符的协议，是 *telnet* 和 *rsh*\
  \ 的安全替代方案。另参见* `telnet`。\n\n### **安全套接层 (SSL)**\n一种已弃用的传输层协议，为互联网上客户端和服务器之间的安全通信提供基于会话的加密和身份验证。*另参见*传输层安全\
  \ (`TLS`)。\n\n### **安全断言标记语言 (SAML)**\n一种基于 `XML` 的开放标准数据格式，用于在组织之间交换身份验证和授权凭据。\n\
  \n### **安全意识 (security awareness)**\n向组织内的用户提供基本安全信息的过程，帮助他们就保护组织资产做出审慎的决策。\n\n\
  ### **安全控制评估 (SCA)**\n对组织内某一个或多个安全控制措施的检查。\n\n### **安全工程 (security engineering)**\n\
  工程学的一个分支，侧重于设计和运行。\n\n### **安全信息和事件管理 (SIEM)**\n一种提供安全日志的实时收集、分析、关联和展示的系统。\n\n###\
  \ **安全内核 (security kernel)**\n`TCB` 中硬件、固件和软件元素的组合，用于实现参考监器。\n\n### **安全运行模式 (security\
  \ modes of operation)**\n根据保护内部机密所需的系统分类：专用 (Dedicated)、高 (High) 和限制 (Limited)。\n\
  \n### **安全运营中心 (SOC)**\n为本地和云环境提供安全监控、评估和修复的设施。\n\n### **安全边界 (security perimeter)**\n\
  将 `TCB` 与系统其他部分隔离开边界。另参见*信任基础 (`TCB`)。\n\n### **安全态势 (security posture)**\n根据组织的安全实践所形成的风险水平。\n\
  \n### **职责分离 (segregation of duties)**\n见“职责与责任分离”。\n\n### **敏感但未分类 (SBU)**\n美国政府的一种数据分类，指未机密但需要保护的信息，例如隐私或个人信息。\n\
  \n### **敏感性标签 (sensitivity label)**\n在基于 `MAC` 的系统中，主体的敏感性标签指定信任级别，而对象的敏感性标签指定访问该对象所需的信任级别。另参见*强制访问控制\
  \ (`MAC`) 系统。\n\n### **职责与责任分离 (separation of duties and responsibilities)**\n一种确保没有个人对关键系统拥有完全控制权的概念。\n\
  \n### **串口链路协议 (SLIP)**\n一种早期的点点协议 (`PPP`)，用于通过拨号调制调器传输网协议 (`IP`)。现在更常用的是 `PPP`。\n\
  \n### **服务水平协议 (SLA)**\n对系统、应用程序、网络或服务的正式性能标准。\n\n### **服务集标识符 (SSID)**\n用于唯一标识\
  \ WiFi 网络的名称。\n\n### **会话劫持 (session hijacking)**\n类似于中间人攻击，但攻击者是冒充预期的接收者，而不是修改传输的消息。另参见*中间人攻击。\n\
  \n### **会话层 (Session Layer)**\nOSI 模型的第  层。另参见*开放系统互连 (`OSI`) 模型。\n\n### **窥视 (shoulder\
  \ surfing)**\n一种社会工程学技术，通过偷看他人肩膀来获取密码或账户号码等信息。\n\n### **简单完整性属性 (simple integrity\
  \ property)**\n\n\n\n\n\n主体不能从完整性水平低于主体的对象中读取信息（不向下读性，或 `NRD`）。*另见* Biba 模型。\n\n\
  ### 互联网协议简单密钥管理 (SKIP)\n一种用于共享加密密钥的协议。\n\n### 简单邮件传输协议 (SMTP)\n一种用于在电子邮件服务器之间传输电子邮件消息的协议。\n\
  \n### 基于 TLS 的简单邮件传输协议\n一种用于在电子邮件服务器之间通过加密传输电子邮件消息的协议。*另见* 安全套接层/传输层安全 (`SSL/TLS`)。\n\
  \n### 简单安全属性 (ss property)\n主体不能从敏感性标签高于主体的对象中读取信息（不向上读性，或 `NRU`）。*另见* Bell-LaPadula\
  \ 模型。\n\n### 单因子身份认证\n仅使用以下因素之一进行系统访问身份认证：*你所知的、你所拥有的*或*你所特征的*。\n\n### 单次损失预期 (SLE)\n\
  资产价值 × 暴露因子 (`EF`)。衡量单次发生的威胁或事件所导致损失的度量，以美元表示。*另见* 暴露因子 (`EF`)。\n\n### 单点登录 (SSO)\n\
  一种允许用户提供一组登录凭据（通常提供身份验证服务器）的系统，然后由该服务器透明地将用户登录到其授权的所有其他企业系统和应用程序。\n\n### SKIP\n\
  *见* 互联网协议简单密钥管理 (`SKIP`)。\n\n### 智能手机\n*见* 移动设备。\n\n### Sm 鱼攻击\n一种拒绝服务攻击，攻击者发送伪造的互联网控制消息协议\
  \ (`ICMP`) 回显请求包到网络中，导致网络上的大量节点向目标系统发送 `ICMP` 回复。*另见* 拒绝服务 (`DoS`)。\n\n### 嗅探\n\
  通常为了秘密目的而拦截通信的实践。\n\n### 社会工程学\n一种低技术攻击方法，采用如翻垃圾桶和窥视等技术。\n\n### 套接字\n系统或设备上的逻辑端点，用于通过网络与另一个系统或设备（甚至是同一台设备）进行通信。\n\
  \n### 软件\n使计算机完成任务的计算机指令。*另见* 软件*以及*操作系统 (`OS`)。\n\n### 软件服务 (SaaS)\n根据 NIST 定义，“提供给消费者使用运行在云基础设施上的提供者应用程序的能力”。\n\
  \n### 软件保证成熟度模型 (SAMM)\n一种用于软件开发的成熟度模型。\n\n### 软件定义网络 (SDN)\n一种计算机网络方法，将高层网络功能从底层物理基础设施中抽象出来。\n\
  \n### 软件开发生命周期 (SDLC)\n用于开发和维护软件的业务级过程。*另见* 系统开发生命周期 (`SDLC`)。\n\n### 软件托管协议\n软件制造商与其客户之间的法律协议，其中软件制造商将在第三方软件托管公司维护其原始软件源代码的副本。如果软件制造商停止运营（或发生软件托管协议中定义的其他事件），软件托管公司将原始源代码释放给该软件托管协议的方客户。\n\
  \n### 源代码\n作为系统和应用程序软件的基础的人类可读机器指令。\n\n### 源代码仓库\n一种用于存储、管理和保护源代码的系统。\n\n### 源码审查\n\
  *见* 代码。\n\n### 垃圾邮件 (或 UCE)\n垃圾邮件，目前约占所有邮件的 85%。\n\n### 鱼鱼叉式钓鱼\n一种高度针对性的钓鱼攻击；例如针对特定组织。\n\
  \n### 尖峰\n瞬时的电流激增。\n\n### SPIM\n通过即时消息发送的垃圾邮件。\n\n### SPIT\n通过电话发送的垃圾邮件。\n\n###\
  \ 伪造\n一种用于伪造信息的技术。在网络攻击中，IP 伪造被用于冒充受信任的主机。在电子邮件伪造中，造造发送者地址以欺骗用户打开或响应。\n\n### 冲刺\n\
  一个短暂的时间间隔（通常为两周），开发团队在此期间开发功能。\n\n### 间谍软件安装在用户计算机上的恶意软件形式，通常在其不知情的情况下安装，目的是收集信息或控制其计算机。\n\
  \n### SQL 注入\n一种攻击类型，攻击者向计算机输入字段中注入 `SQL` 命令，希望 `SQL` 命令传递给数据库管理系统。\n\n### SSL 隐藏\n\
  一种使用 `SSL` 加密隐藏网络流量内容的技术，例如为了在窃取敏感数据（称为数据外泄）时规避检测。\n\n### 独立电源系统 (SPS)\n一种用于发电、存储和调节的离网电力系统，用于未配备配电系统的设施。\n\
  \n### 标准\n具体的、强制性的要求，进一步定义并支持高层策略。\n\n### 星型\n一种网络拓扑，所有设备都直接连接到中央集纽或集中器。\n\n###\
  \ 星型完整性属性 (*-integrity property)\n主体不能向完整性水平高于主体的对象写入信息（不向上写，或 `NWU`）。*另见* Biba\
  \ 模型。\n\n### 星型属性 (* property)\n主体不能向敏感性标签低于主体的对象写入信息（不向下写，或 `NWD`）。*另见* Bell-LaPadula\
  \ 模型。\n\n### 状态攻击\n攻击者试图窃取其他用户的会话标识符的攻击，以便使用被盗会话标识符访问系统。\n\n### 状态机模型\n\n\n\n\n\n\
  抽象模型，在安全状态之间的转换过程中定义并维护一个安全状态。\n\n**状态检测防火墙：**\n一种防火墙，它通过在开放系统互连（OSI）模型的所有层级上捕获并分析数据包，以确定数据包的状态和上下文，并判断是否允许其访问网络。\n\
  \n**静态应用程序扫描工具 (SAST)：**\n一种用于识别软件应用程序漏洞的工具，通过检查应用程序源代码来寻找可利用的漏洞来工作。\n\n**静态密码：**\n\
  每次登录时都相同的密码。\n\n**法定损害赔偿：**\n法律规定的强制性赔偿金，并根据违反法律的行为进行评定。\n\n**隐写术：**\n隐藏信息本身存在性的艺术；例如隐藏在图片中。\n\
  \n**存储过程：**\n一种软件程序可以访问的子程序，存储在关系型数据库管理系统中。\n\n**流密码：**\n一种对连续数据流（通常是逐位）进行操作的加密算法。\n\
  \n**强身份验证：**\n一种需要两种或两种独立身份识别方式的验证方法。*另参见*双因子身份验证。\n\n**结构化查询语言 (SQL)：**\n一种用于操作数据库管理系统中数据的计算机语言。\n\
  \n**主体：**\n一个活动实体，例如个人或进程。\n\n**替换密码：**\n将明文中的位、字符或字符块替换为替代位、字符或字符块以产生密文的密码。\n\n\
  **内核模式：**\n一种特权级别，通常仅供系统管理使用。*另参见*用户模式。\n\n**数据采集与监控系统 (SCADA)：**\n一种工业自动化系统，通过通信通道上的编码信号运行，提供对设备的远程控制。*另参见*工业控制系统\
  \ (ICS)。\n\n**浪涌：**\n长时间的电力波动。\n\n**交换机：**\n一种智能集纽，仅将数据传输到网络上的单个设备，而不是所有设备（如集线器那样）。*另参见*集线器。\n\
  \n**交换多兆数据服务 (SMDS)：**\n一种在公共交换网络上提供的高速、包交换、无连接导向、基于数据报的技术。\n\n**对称密钥系统（或对称算法、秘密密钥、单密钥、私钥）：**\n\
  一种使用单一密钥同时加密和解密信息的密码系统。\n\n**SYN 洪泛：**\n一种攻击者向目标系统发送大量传输控制协议 (`TCP`) SYN（同步）数据包的攻击。SYN\
  \ 洪泛是拒绝服务攻击的一种。*另参见*拒绝服务 (DoS)。\n\n**同步光纤网络 (SONET)：**\n一种用于在光纤上通信数字信息的电信运营商级协议。\n\
  \n**合成事务：**\n在系统上执行的机械化事务，用于确定该系统执行事务的能力。\n\n**系统访问控制：**\n一种防止主体在未提供有效凭据的情况下访问系统的控制措施。\n\
  \n**系统高位模式：**\n系统以最高分类级别运行的状态。\n\n**系统测试（开发）：**\n对应用程序的所有模块进行测试。\n\n**系统开发生命周期 (SDLC)：**\n\
  用于开发系统的过程。\n\n**战术、技术和程序 (TTPs)：**\n一种网络威胁情报方法，用于分析威胁行为者的模式和方法。\n\n**Take-Grant\
  \ 模型：**\n一种指定主体可以转移的权利的安全模型。\n\n**TCP/IP：**\n一种最初由美国国防部开发的四层网络模型。\n\n**滴水攻击：**\n\
  一种利用互联网协议 (`IP`) 漏洞的攻击。\n\n**技术（或逻辑）控制：**\n用于实现访问的硬件和软件技术。\n\n**telnet：**\n一种用于在网络上建立命令行界面的网络协议。*另参见*安全外\
  \ (`SSH`)。\n\n**终端接入控制系统系统 (TACACS)：**\n一种基于用户数据报协议 (`UDP`) 的访问协议，提供身份验证、授权和审计。\n\
  \n**终止：**\n见雇佣（employment）。\n\n**第三方：**\n将部分业务运营外包的组织。*另参见*外包。\n\n**威胁：**\n任何可能对组织资产产生不利或不受预期影响的自然或人为情况或事件。\n\
  \n**威胁建模：**\n一种系统化的过程，用于在应用程序设计阶段识别可能的威胁、漏洞和对策措施。\n\n**三次握手：**\n传输控制协议 (`TCP`) 中用于建立网络连接的方法。\n\
  \n**令牌：**\n一种用于双因子身份验证的硬件设备。\n\n**令牌环网：**\n一种星型拓扑网络传输协议。\n\n**商业秘密：**\n公司或个人使用并拥有独占权利的专利或业务相关信息。\n\
  \n**商标：**\n根据美国专利和商标局 (`PTO`) 的定义，商标是“在商业中使用或拟在商业中使用任何单词、名称、符号或设备，或任何组合，用于识别和区分一个制造商或销售者的商品与其他制造或销售的商品”。\n\
  \n**流量分析：**\n一种攻击方法，攻击者通过观察网络流量模式对网络利用率、架构、行为或其他可识别的特征进行推断。\n\n**跨境数据流：**\n跨越国界的电子数据传输。\n\
  \n**瞬态：**\n一种瞬时的电线噪声干扰。\n\n**传递信任：**\n\n\n\n\n\n用户在域环境中继承已建立访问权限的现象。\n\n### 传输控制协议\
  \ (TCP)\n一种面向连接的网络协议，在网络上提供数据包的可靠交付。\n\n### 传输层 (OSI 模型)\nOSI 模型的第 4 层。*另见*开放系统互连\
  \ (OSI) 模型。\n\n### 传输层 (TCP/IP 模型)\nTCP/IP 模型的第 3 层。*另见*TCP/IP 模型。\n\n### 传输层安全\
  \ (TLS)\n一种 OSI 第 4 层（传输层）协议，为互联网上客户端与服务器之间的安全通信提供基于会话的加密和身份验证。\n\n### 置换密码\n通过重新排列明文中的位、字符或字符块来产生密文的密码。\n\
  \n### 后门\n程序中的一种特性，用于执行未记录的功能（通常是安全绕过，例如权限提升）。\n\n### 特洛伊木马\n一种声称执行给定功能，但实际上执行了某些其他（通常是恶意的）功能的程序。*另见*恶意软件。\n\
  \n### 可信计算机系统\n采用所有必要的硬件和软件保证措施，并满足可靠性和安全性特定要求的系统。\n\n### 可信计算机系统评估标准 (TCSEC)\n\
  通常被称为*橙色书*。由国家计算机安全中心 (NCSC) 作为彩虹系列的一部分，为美国国防部开发的形式化系统评估标准。\n\n### 可信计算基 (TCB)\n\
  计算机系统内所有保护机制的总体组合——包括硬件、固件和软件——负责执行安全策略。\n\n### 可信网络解释 (TNI)\n通常被称为彩虹系列中的*红书*。解决可信计算机/通信网络系统中的机密性和完整性问题。*另见*可信计算机系统评估标准\
  \ (TCSEC)。\n\n### 可信路径\n用户与可信计算基 (TCB) 之间的直接通信路径，不需要与不可信的应用程序或操作系统层交互。\n\n### 可信平台模块\
  \ (TPM)\n计算机中用于执行加密功能的硬件模块。\n\n### 可信恢复\n为了防止系统故障后恢复期间信息泄露的保护措施。\n\n### 同轴电缆\n一种由两个实心线芯组成的网络介质，周围有绝缘层和金属箔包裹。\n\
  \n### 双绞线电缆\n一种由四到八对绝缘导体绞合而网络介质。\n\n### 双因子身份验证\n一种需要两种方式建立身份的身份验证方法。\n\n### 未认证扫描\n\
  一种在寻找可利用漏洞的过程中，不登录设备、系统或应用程序的漏洞扫描。\n\n### 单播\n一种网络协议，数据包从源节点发送到单个目标节点。\n\n### 统一威胁管理\
  \ (UTM)\n一种将防火墙、反恶意软件和入侵防御等多种安全功能集成到单一平台中的安全设备。\n\n### 不断电源 (UPS)\n一种通常通过在一个或多个电池中存储额外容量来提供持续电力的设备。\n\
  \n### 单元测试\n对单个源代码执行的测试。\n\n### 2001 年《美国法案》（通过提供适当工具拦截恐怖主义来统一美国）\n一项扩大执法部门权限的美国法律。\n\
  \n### 用户\n具有信息访问权限的人。\n\n### 用户验收测试 (UAT)\n由终端用户对系统和应用程序进行的测试，以便验证其功能。\n\n### 用户和实体行为分析\
  \ (UEBA)\n一种过程，通过创建正常用户活动基基线并分析异常来检测恶意活动。\n\n### 用户数据报协议 (UDP)\n一种不保证数据包交付或顺序的网络协议。\n\
  \n### 用户权限\n授予个人的数据访问权限。\n\n### 用户模式\n一种通常用于普通用户的权限级别。*另见*内核模式。\n\n### 维纳姆密码\n*另见*单次扇。\n\
  \n### 视图\n一种可以限制对特定信息的访问、隐藏属性和查询的逻辑操作。\n\n### 违规分析\n检查审核日志和其他源以发现不当活动的过程。\n\n###\
  \ 虚拟桌面基础架构 (VDI)\n运行在物理服务器虚拟机 (VM) 内部的桌面操作系统。\n\n### 虚拟局域网 (VLAN)\n存在于物理网络内部的逻辑网络。\n\
  \n### 虚拟机\n运行在虚拟机程序内部的操作系统实例。\n\n### 虚拟内存\n一种二级内存寻址类型，它同时使用安装的物理内存和可用硬盘空间，为中央处理器\
  \ (CPU) 提供一个比实际存在的更大的内存空间。\n\n### 虚拟专用网络 (VPN)\n用于在公共网络上进行私密通信的专用网络。VPN 通常利用加密和封装来保护并简化连接。\n\
  \n### 虚拟现实 (VR)\n计算机生成的物体或多个物体三维 (3D) 图像表示，用户可以以真实世界物体类似的方式与之交互。\n\n### 虚拟带库 (VTL)\n\
  一种基于磁盘的存储系统，像磁带存储一样用于备份操作。\n\n### 虚拟化\n在计算机系统内部内部运行一个或多个独立的、隔离的操作系统“客户”的做法。\n\n\
  ### 虚拟化（或虚拟机）泛滥\n在没有妥善的安全和操作控制的情况下快速创建虚拟机。\n\n### 病毒\n\n\n\n\n\n一组计算机指令，其目的是嵌入另一个计算机程序中以自我复制。*另见参见*恶意软件（malware）。\n\
  \n### Visual Basic 脚本 (VBScript)\n由微软开发并以 Visual Basic 为模型的活动脚本语言。\n\n### 越过协议 电话\
  \ (VoIP)\n旨在在 `TCP/IP` 网络上传输语音通信的电话协议。\n\n### VOMIT\n配置错误的互联网电话上的语音（Voice over Misconfigured\
  \ Internet Telephone）。\n\n### 漏洞 (vulnerability)\n资产中保护措施的缺失或削弱，这使得威胁可能更有危害性或成本更高、更容易发生，或者发生频率更高。\n\
  \n### 漏洞评估 (vulnerability assessment)\n使用工具和技术识别应用程序、信息系统、设施、业务流程或其他研究对象中的漏洞。\n\n\
  ### 漏洞管理 (vulnerability management)\n用于识别和修复信息系统漏洞的生命周期过程。\n\n### 漏洞扫描 (vulnerability\
  \ scan)\n使用自动化工具或技术识别目标系统或网络中的漏洞。\n\n### 漏洞扫描工具 (vulnerability scanning tool)\n\
  用于扫描设备、系统或应用程序以识别可利用漏洞的软件程序。\n\n### 战争拨号 (war dialing)\n一种暴力破解攻击，使用程序自动拨打大范围电话号码（如区号），寻找有漏洞的调制解调器或传真机。\n\
  \n### 热驱动 (war driving)\n一种暴力破解攻击，通过开车行驶来寻找有漏洞的无线网络。\n\n### 温备机房 (warm site)\n另一种随时可用的计算机设施，配备电源、`HVAC`\
  \ 和计算机，但尚未完全配置。*另见参见*冷备机房（cold site）、热备机房（hot site）和 `HVAC`。\n\n### 瀑布模型 (waterfall)\n\
  一种每个阶段独立按顺序执行的软件开发过程。\n\n### 水蛭穴攻击 (watering hole attack)\n针对终端用户浏览器的攻击，在 Web 服务器上安装恶意软件并下载到用户的浏览器。\n\
  \n### Web 应用防火墙 (WAF)\n用于保护 Web 服务器免受脚本注入和缓冲区溢出等 Web 应用攻击的设备。\n\n### Web 内容过滤器 (web\
  \ content filter)\n一种根据定义策略允许或阻止对网站访问互联网的系统或应用程序。\n\n### 白盒测试 (white-box testing)\n\
  测试人员对被测试系统拥有完全知识的安全测试。\n\n### 白名单 (whitelisting)\n一种根据列表中是否存在项来显式允许访问的机制。\n\n###\
  \ Wi-Fi\n一种基于 `IEEE 802.11` 标准的设备的无线局域网技术。*另见参见*电气电子工程师学会 (IEEE)。\n\n### 无线安全接入\
  \ (WPA)\n一种在 `802.11` 网络上加密通信的方法。\n\n### 无线等效隐私 (WEP)\n一种加密通信的手段；专门用于 `802.11/WiFi`\
  \ 网络。`WEP` 已过时。\n\n### 无线传输层安全协议 (WTLS)\n一种为移动设备常用的用于互联网连接的无线应用协议 (`WAP`）提供安全服务的协议。\n\
  \n### 工作因子 (work factor)\n破解加密系统的难度（从时间、努力和资源方面考虑）。\n\n### 蠕虫 (worm)\n通常具有在没有人工干预的情况下从计算机到计算机自我复制能力的恶意软件。*另见参见*恶意软件（malware）。\n\
  \n### X.25\n包交换网络。\n\n### XML (可扩展标记语言)\n人类可读和机器可读的语言。\n\n### Zigbee\n一组用于小型个人局域网的协议。\n\
  \n## 关于作者\n\n### Lawrence C. Miller, CISSP\n他是美国海军的老兵，曾在沙漠护盾/沙漠风暴行动中担任首席士士，并自 20\
  \ 世纪 70 年代以来一直在赌场管理系统、银行、政府、非营利组织和学术界等行业工作。他在印第安纳大学获得 MBA 学位，并在职业生涯中获得了众多认证。\n\n\
  ### Peter H. Gregory, CISSP, CISM, CRISC, CCSK, CCISO, PCI-QSA\n他是一位职业技术专家，也是 Optiv\
  \ Security ([www.optiv.com](http://www.optiv.com)) 的执行安全顾问，该公司是北美最大的综合纯安全解决方案供应商。在此之前，他曾在\
  \ Concur Technologies ([www.concur.com](http://www.concur.com)) 和大型无线电信组织担任战略职位。他是华盛顿大学信息系统安全证书课程的主讲师兼顾问委员会成员，也是\
  \ FBI 市民学院毕业生。\n\n可以在 [`www.peterregory.com](http://www.peterregory.com) 找到 Peter。\n\
