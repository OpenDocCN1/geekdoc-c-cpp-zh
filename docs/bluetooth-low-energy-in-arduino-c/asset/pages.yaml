- pgno: 52
  md: '# Connecting and Disconnecting


    Each Bluetooth Device has a unique Media Access Control (MAC) address, a 48-bit
    identifier value written like this


    ```

    00:A0:C9:14:C8:3A

    ```


    Devices advertise data on the network with the intended recipient''s MAC address
    attached so that recipient devices can filter data packets that are intended for
    them.


    Part of what a Peripheral does while Advertising is to make its MAC address known.


    Once a Central knows the MAC address of a Peripheral, the central can attempt
    to connect. This must be done before data can be passed between the Central and
    Peripheral. A Central may hold several simultaneous connections with a number
    of peripherals, but a peripheral may only hold one connection at a time. Hence
    the names Central and Peripheral (Figure 5-1).'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/d7b9d81704fe6839dbdc99a45736bfb5_53_0.png)


    Figure 5-1. Bluetooth network topology


    There are 37 data channels ranging from 2404 MHz to 2478 MHz.


    Once the connection is established, the Central and Peripheral negotiate which
    of these channels to begin communicating over.


    Because the Peripheral can only hold one connection at a time, it must disconnect
    from the Central before a new connection can be made.


    The connection and disconnection process works like this (Figure 5-2).'
