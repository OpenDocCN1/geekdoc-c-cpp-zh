- pgno: 84
  md: '# Reading Data from a Peripheral


    The real value of Bluetooth Low Energy is the ability to transmit data wirelessly.


    Bluetooth Peripherals are passive, so they don’t push data to a connected Central.
    Instead, Centrals make a request to read data from a Characteristic. This can
    only happen if the Characteristic enables the Read Attribute.


    This is called, “Reading a value from a Characteristic.”


    Therefore, if a Peripheral changes the value of a Characteristic, then later a
    Central downloads data from the Peripheral, the process looks like this (Figure
    7-1):'
  merge: -1
  img_proc: true
