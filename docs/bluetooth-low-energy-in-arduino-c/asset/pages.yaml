- pgno: 40
  md: '# # Scanning and Advertising


    The first step to any Bluetooth Low Energy interaction is for the Peripheral to
    make the Central aware of its existence, through a process called Advertising.


    During the Advertising process, a peripheral Advertises while a Central Scans.


    Bluetooth devices discover each other when they are tuned to the same radio frequency,
    also known as a Channel. There are three channels dedicated to device discovery
    in Bluetooth Low Energy:


    # Table 4-1. Bluetooth Low Energy Discovery Radio Channels


    | Channel | Radio Frequency |

    |---|---|

    | 37 | 2402 Mhz |

    | 39 | 2426 Mhz |

    | 39 | 2480 Mhz |


    The peripheral will advertise its name and other data over one channel and then
    another. This is called frequency hopping (Figure 4-1).'
  merge: -1
  img_proc: true
- pgno: 41
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/d7b9d81704fe6839dbdc99a45736bfb5_42_0.png)


    # Figure 4-2. Scan finds Advertise


    Scanning settings vary wildly, for example scanning every 10ms for 100ms, or scanning
    for 1 second for 10 seconds.


    Typically when a Central discovers advertising Peripheral, the Central requests
    a Scan Response from the Peripheral. In some cases, the Scan Response contains
    useful data. For example, iBeacons use Scan Response data to inform Centrals of
