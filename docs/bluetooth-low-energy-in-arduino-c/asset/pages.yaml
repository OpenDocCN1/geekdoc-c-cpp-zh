- pgno: 69
  md: 'or


    ```

    BLEService service("0000180C-000-1000-8000-00805f9-b34fb");

    ```


    The first method lets the Peripheral automatically generate most of the UUID,
    and the second method forces the Peripheral to use a particular UUID. The first
    method is simpler but less precise. The second method is precise and useful for
    projects where there is a need to share the UUID with outside people or APIs.


    Certain UUIDs are unavailable for use. If a bad UUID is chosen, the Peripheral
    may crash without warning.


    There are several types of Characteristic available in nRF51822, depending on
    the type of data you need to transmit. Arrays, Integers, Floats, Booleans, and
    other data types have their own Characteristic constructors.


