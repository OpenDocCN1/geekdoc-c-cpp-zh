- pgno: 165
  md: '# Project: Remote Control LED


    So far, this book has worked a lot with text data rather than binary data, because
    it’s easy to text without using specialized tools such as oscilloscopes or logic
    analyzers.


    Most real-world projects transmit binary instead of text. Binary is much more
    efficient in transmitting information.


    Because binary data it is the language of computers, it is easier to work with
    than text. There is no need to worry about character sets, null characters, or
    cut-off words.


    This project will show how to remotely control an LED on a Peripheral using software
    on a Central.


    The LED Remote works like this (Figure 13-1).'
