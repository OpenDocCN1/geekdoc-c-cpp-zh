- pgno: 86
  md: 'Figure 7-1. The process of a Central reading data from a Peripheral


    A Central can read a Characteristic repeatedly, regardless if Characteristic’s
    value has changed.


    # Programming the Peripheral


    Transmitting data is fairly easy over BLE. It requires that a Peripheral has a
    Characteristic that is readable from the Central.


    Create a Service and a Characteristic with read properties up to 20-bytes long.
    For example, a 16-byte read-only Characteristic:


    ```

    // create a 16-byte long Characteristic value, initialize with zeroes

    static uint8_t characteristicValue[16] = {0};


    // create a Read only Characteristic

    ReadOnlyArrayGattCharacteristic<uint8_t, sizeof(characteristicValue)> \

    characteristic(

    "2A56", // UUID 2a56

    characteristicValue // use the Characteristic value

    );

    ```


    Each Service and Characteristic must be uniquely identifiable with a UUID.'
  merge: -1
  img_proc: true
