  md: '# Section 1


    # Conventions Used in this Book


    Every developer has their own coding conventions. I personally believe that well-written
    code is self-explanatory. Moreover, consistent and organized coding conventions
    let developers step into each other’s code much more easily, enabling them to
    reliably predict how the author has likely organized and implemented a feature,
    thereby making it easier to learn, collaborate, fix bugs and perform upgrades.


    The coding conventions I used in this book is as follows:


    Inline comments are as follows:


    ```

    ```cpp

    // inline comments

    ```

    ```


    Multiline comments follow the Doxygen standard:


    ```

    ```cpp

    /**


    * This is a multiline comment


    * It features more than one line of comment


    * @parameter usage discription


    * @return type


    */

    ```

    ```


    Constants and variables are written in camel case:'
