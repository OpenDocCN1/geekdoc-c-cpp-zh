  md: '# # About the Author


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_219_0.png)


    Tony’s infinite curiosity compels him to want to open up and learn about everything
    he touches, and his excitement compels him to share what he learns with others.


    He has two true passions: branding and inventing.


    His passion for branding led him to start a company that did branding and marketing
    in 4 countries for firms such as Apple, Intel, and Sony BMG. He loves weaving
    the elements of design, writing, product, and strategy into an essential truth
    that defines a company.'
