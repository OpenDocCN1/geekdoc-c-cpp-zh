- pgno: 63
  md: '# Services and Characteristics


    Before data can be transmitted back and forth between a Central and Peripheral,
    the Peripheral must host a GATT Profile. That is, the Peripheral must have Services
    and Characteristics.


    # Identifying Services and Characteristics


    Each Service and Characteristic is identified by a Universally Unique Identifier
    (UUID). The UUID follows the pattern 0000XXXX-0000-1000-8000-00805f9b34fb, so
    that a 32-bit UUID 00002a56-0000-1000-8000-00805f9b34fb can be represented as
    0x2a56.


    Some UUIDs are reserved for specific use. For instance any Characteristic with
    the 16-bit UUID 0x2a35 (or the 32-bit UUID 00002a35-0000-1000-8000-00805f9b34fb)
    is implied to be a blood pressure reading.


    For a list of reserved Service UUIDs, see *Appendix IV: Reserved GATT Services*.


    For a list of reserved Characteristic UUIDs, see *Appendix V: Reserved GATT Characteristics*.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Generic Attribute Profile


    Services and Characteristics describe a tree of data access points on the peripheral.
    The tree of Services and Characteristics is known as the Generic Attribute (GATT)
    Profile. It may be useful to think of the GATT as being similar to a folder and
    file tree (Figure 6-1).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_64_0.png)


    **Figure 6-1. GATT Profile filesystem metaphor**'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/d7b9d81704fe6839dbdc99a45736bfb5_65_0.png)


    **Figure 6-2. GATT Profile**


    Characteristics act as channels that can be communicated on, and Services act
    as containers for Characteristics. A top level Service is called a Primary service,
    and a Service that is within another Service is called a Secondary Service.


    Characteristics have a maximum value length of 20 bytes and have internal settings
    called Descriptors that can be modified. Descriptors are identified with UUIDs
    One important Descriptor that will be talked'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'about later is the Client Characteristic Configuration (0x2902), which allows
    a connected Central to subscribe to change notifications from that Characteristic.


    For a list of reserved Descriptors, see *Appendix V: GATT Descriptors*.


    # Table 6-1. Characteristic Permissions


    | Descriptor | Description |

    |---|---|

    | Read | Central can read this Characteristic, Peripheral can set the value. |

    | Write | Central can write to this Characteristic, Peripheral will be notified
    when the Characteristic value changes and Central will be notified when the write
    operation has occurred. |

    | Write without Response | Central can write to this Characteristic. Peripheral
    will be notified when the Characteristic value changes but the Central will not
    be notified that the write operation occurred. |

    | Notify | Central will be notified when Peripheral changes the value. |


    Because the GATT Profile is hosted on the Peripheral, the terms used to describe
    a Characteristic’s permissions are relative to how the Peripheral accesses that
    Characteristic. Therefore, when a Central uploads data to'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'the Peripheral, the Peripheral can “read” from the Characteristic. The Peripheral
    “writes” new data to the Characteristic, and can “notify” the Central that the
    data is altered.


    # Data Length and Speed


    It is worth noting that Bluetooth Low Energy has a maximum data packet size of
    20 bytes, with a 1 Mbit/s speed.


    # Programming the Peripheral


    The Generic Attribute Profile is defined by setting the UUID and permissions of
    the Peripheral’s Services and Characteristics.


    Characteristics can be configured with the following permissions ([Table 6-2](#table-6-2)):


    # Table 6-2. BLECharacteristic Permissions


    | Value |

    |---|

    | BLE_GATT_CHAR_PROPERTIES_READ |'
