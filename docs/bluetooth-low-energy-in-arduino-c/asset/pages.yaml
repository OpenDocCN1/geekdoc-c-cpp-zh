    | **Range** | 100 m (330 ft) |

    | **Data Rate** | 1M bit/s |

    | **Application Throughput** | 0.27 Mbit/s |

    | **Security** | 128-bit AES with Counter Mode CBC-MAC and application layer user
    data encryption (BEWARE: this encryption has vulnerabilities) |

    | **Robustness** | Adaptive Frequency Hopping, Layer Acknowledgement, 24-bit CRC,
    32-bit Message Integrity Check |

    | **Range** | 100 m (330 ft) |

    | **Data Rate** | 1M bit/s |

    | **Application Throughput** | 0.27 Mbit/s |'
