    Characteristics have a maximum length of 20 bytes. Since 16 bit and 8-bit data
    types are easy to pass around in C++, we will be using uint16_t (unsigned 16-bit
    integer) and uint8_t (unsigned 8-bit integer) values in the examples. Any data
    type including custom byte buffers can be transmitted and assembled over BLE.


    Define a Service with UUID 180c (an unregistered generic UUID):


    ```

    ```cpp

    BLEService service("180C");

    ```

    ```'
