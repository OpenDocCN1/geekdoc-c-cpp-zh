- pgno: 98
  md: "Characteristic that gives permission to be written.\n\nFor example, this 8-byte\
    \ characteristic supports “write” operations:\n\n```\n// Create a read/write/notify\
    \ Characteristic\nstatic const uint8_t characteristicLength = 8;\nstatic uint8_t\
    \ characteristicValue[characteristicLength] = {0};\nWriteOnlyArrayGattCharacteristic<uint8_t,\
    \ sizeof(characteristicValue)> \\\ncharacteristic(\n    \"2A56\",\n    characteristicValue\n\
    );\n```\n\nThe Characteristic must have a callback to describe how to process\
    \ incoming data. The callback parameters identifies characteristic that was written\
    \ to and the details of the transmission, including the length and the value that\
    \ was written.\n\nThe callback is handled in an interrupt, outside normal operation.\
    \ It is a good practice not to implement a lot of functionality inside the callback.\
    \ A best practice is to set a boolean flag, then look for that flag inside the\
    \ main loop.\n\n```\n// flag when Central has written to a Characteristic\nbool\
    \ bleDataWritten = false; // true if data ha\n// Storage for written Characteristic\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 99
  md: "```\n// values been written to the characteristic\nchar bleCharacteristicValue[characteristicLength];\n\
    \n/**\n* This callback processes incoming writes to a Characteristic.\n*\n* @param[in]\
    \ params\n*   Information about the characterisitc being updated.\n*/\nvoid onBleCharacteristicWritten(const\
    \ GattWriteCallbackParams *params) {\n    // if the local Characteristic has been\
    \ written to\n    if(params->handle == characteristic.getValueHandle()) {\n  \
    \      bleDataWritten = true;\n        bleCharacteristicValueLength = params->len;\n\
    \        // copy the new value into a placeholder for later use.\n        // it's\
    \ best not to do much in this function as it is an interrupt\n        strncpy(bleCharacteristicValue,\
    \ (char*) params->data, params->len);\n    }\n}\n```\n\nThe callback must be bound\
    \ to the GATT Server like this:"
  merge: -1
  img_proc: true
- pgno: 100
  md: "```\n```cpp\nvoid onBluetoothInitialized(\n\n    BLE::InitializationCompleteCallbackContext\
    \ *params)\n\n{\n\n    ...\n\n    ble.gattServer().onDataWritten(onBleCharacteristicWritten);\n\
    \n    ...\n\n}\n```\n```\n\nWhen outside the interrupt it is possible to extract\
    \ the incoming 8-bit data value and print it to Serial from the main loop:\n\n\
    ```\n```cpp\nint main(void) {\n\n    ...\n\n    while (1) {\n\n        // when\
    \ a Central has written to a local Characteristic,\n\n        // handle the change\
    \ here\n\n        if (bleDataWritten) {\n\n            bleDataWritten = false;\
    \ // ensure only happens once\n\n            serial.printf(\n\n              \
    \  \"Data written to characteristic: %s\\r\\n\",\n\n                bleCharacteristicValue\n\
    \n            );\n```\n```"
