  md: '# CHAPTER 3


    # # Bootstrapping


    The first thing to do in any software project is to become familiar with the environment.


    Because we are working with Bluetooth, it’s important to learn how to initialize
    the Bluetooth radio and report what the program is doing.


    Both the Central and Peripheral talk to the computer over USB when being programmed.
    That allows you to report errors and status messages to the computer when the
    programs are running (Figure 3-1).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_34_0.png)


    **Figure 3-1. Programming configuration**


    # ## Programming the Peripheral


    It is useful to print out what nRF is thinking to make debugging easier, so this
    chapter will teach how to print data from the the nRF to the'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'computer being programmed on.


    # ## Turning on Bluetooth


    In order to use the Bluetooth features of the nRF chip, certain C header files
    must be included.


    On the mbed platform, those are mbed.h and ble/BLE.h:


    ```

    ```c

    #include "mbed.h"


    #include "ble/BLE.h"

    ```

    ```


    # ## Debugging


    It is useful to print out what nRF is thinking to help debugging later. This can
    be done by instantiating a Serial object and printing text to that Serial object.


    ```

    ```cpp

    Serial serial(USBTX, USBRX); // initialize the Serial object


    serial.baud(9600); // set the baud rate


    serial.printf("Hello World\r\n"); // print text

    ```

    ```


    There are many ways read what the nRF is printing, depending on the software and
    platform available. On Mac OS and Linux, a program called screen can be used:'
  merge: -1
  img_proc: true
- pgno: 36
  md: '```

    $ screen /dev/tty.usbmodemXXXX 9600

    ```


    When using screen, make sure the baud rate (in this case 9600) matches the baud
    rate on the nRF Serial object, and that the device name is the one created for
    the available nRF device.


    The serial connection to the nRF must be closed when trying to upload programs
    onto the nRF. A screen session can be closed by issuing the following key sequence:


    Ctrl+a, k, y


    # Putting it all together


    In your nRF IDE create a new project titled ble_serial, and type the following
    code:


    # Example 3-1. ble_serial/main.c


    ```

    #include "mbed.h"


    #include "ble/BLE.h"


    /** User interface I/O **/


    // instantiate USB Serial


    Serial serial(USBTX, USBRX);

    ```'
  merge: -1
  img_proc: true
