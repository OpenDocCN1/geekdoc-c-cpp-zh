  md: '# Using Notifications


    Being able to read from the Central has limited value if the Central does not
    know when new data is available.


    Notifications solve this problem. A Characteristic can issue a notification when
    it’s value has changed. A Central that subscribes to these notifications will
    know when the Characteristic’s value has changed, but not what that new value
    is. The Central can then read the latest data from the Characteristic.


    The whole process looks something like this (Figure 9-1).'
