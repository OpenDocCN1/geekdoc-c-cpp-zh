  md: '# CHAPTER 11


    # # Project: iBeacon


    Beacons can be used for range finding or spacial awareness. iBeacons are a special
    type of Beacon that is widely supported by the industry. It supports certain data
    that identifies the iBeacons to makes range finding and spacial awareness easier
    across platforms.


    Due to the nature of how radio signals diminish in intensity with distance, Bluetooth
    Peripherals can be used both for range finding and spacial awareness.


    # ## Range Finding


    Bluetooth signals can be used to approximate the distance between a Peripheral
    and a Central because the radio signal quality drops off in a predictable way
    with distance. The diagram below shows how the signal might drop as distance increases
    (Figure 11-1).'
