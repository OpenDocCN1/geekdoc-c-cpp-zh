  md: "\nThis program has two commands: one to turn the LED on and one to turn the\
    \ LED off.\n\n```cpp\nstatic const unsigned int ledOn = 1;\n\nstatic const unsigned\
    \ int ledOff = 2;\n```\n\nResponses to the Central must represent the state of\
    \ the LED.\n\n```cpp\nvoid sendBleCommandResponse(int ledState) {\n  byte confirmation[characteristicTransmissionLength]\
    \ = {0x0};\n  confirmation[bleResponseDataPosition] = (byte)ledState;\n  confirmation[bleResponseFooterPosition]\
    \ = \\\n    (byte)bleResponseConfirmationFooter;\n  responseCharacteristic.setValue(\n\
    \    (const unsigned char*) confirmation,\n    characteristicTransmissionLength\n\
    \  );\n}\n```\n\nOnce a command has been received, the Peripheral needs to change\
    \ the LED state, then notify the Central that the command has been processed.\n\
    \n```cpp\nvoid loop() {\n  if (bleCommandReceived) {\n    bleCommandReceived =\
    \ false; // ensures only executed once\n\n    // incoming command is one byte\n\
    \n    unsigned int command = bleMessage[bleMessageDataPosition];\n\n    if(command\
    \ == bleCommandLedOn) {\n\n      Serial.println(\"Turning LED on\");\n\n     \
    \ ledState = HIGH;\n\n      sendBleCommandResponse(ledState);\n\n    } else {\n\
    \n      Serial.println(\"Turning LED off\");\n\n      ledState = LOW;\n\n    \
    \  sendBleCommandResponse(ledState);\n\n    }\n\n    digitalWrite(ledPin, ledState);\n\
    \  }\n}\n```\n\n## Putting It All Together\n\nThe following sketch will create\
    \ a Peripheral that can receive pre-programmed commands to turn the onboard LED\
    \ on and off.\n\nCreate a new project called led_remote, and copy the following\
    \ code:\n\n**Example 12-1. sketches/led_remote/led_remote.ino**\n\n```cpp\n#include\
    \ \"CurieBle.h\"\n\nstatic const char* bluetoothDeviceName = \"LedRemote\";\n\n\
    static const int characteristicTransmissionLength = 2;\n\n// Commands\n\nstatic\
    \ const uint8_t bleCommandFooterPosition = 1;\n\nstatic const uint8_t bleCommandDataPosition\
    \ = 0;\n\nstatic const uint8_t bleCommandFooter = 1;\n\nstatic const uint8_t bleCommandLedOn\
    \ = 1;\n\nstatic const uint8_t bleCommandLedOff = 2;\n\n// Responses\n\nstatic\
    \ const uint8_t bleResponseFooterPosition = 1;\n\nstatic const uint8_t bleResponseDataPosition\
    \ = 0;\n\nstatic const uint8_t bleResponseErrorFooter = 0;\n\nstatic const uint8_t\
    \ bleResponseConfirmationFooter = 1;\n\nstatic const uint8_t bleResponseLedError\
    \ = 0;\n\nstatic const uint8_t bleResponseLedOn = 1;\n\nstatic const uint8_t bleResponseLedOff\
    \ = 2;\n\n// Peripheral Properties\n\nstatic const byte ledPin = 13;\n\nstatic\
    \ const unsigned int ledError = 0;\n\nstatic const unsigned int ledOn = 1;\n\n\
    static const unsigned int ledOff = 2;\n\nint ledState = ledOff;\n\n// internal\
    \ state\n\nchar bleMessage[characteristicTransmissionLength];\n\nconst char* uuid;\n\
    \nbool bleCommandReceived = false;\n\nBLEService service(\"180C\");\n\nBLECharacteristic\
    \ commandCharacteristic(\n\n  \"2A56\",\n  BLEWrite,\n  characteristicTransmissionLength\n\
    );\n\nBLECharacteristic responseCharacteristic(\n\n  \"2A57\",\n  BLERead | BLENotify,\n\
    \  characteristicTransmissionLength\n);\n\n// Central connected. Print MAC address\n\
    void onCentralConnected(BLECentral& central) {\n    Serial.print(\"Central connected:\
    \ \");\n    Serial.println(central.address());\n}\n\n// Central disconnected\n\
    void onCentralDisconnected(BLECentral& central) {\n    Serial.println(\"Central\
    \ disconnected\");\n}\n\nvoid setup() {\n    Serial.begin(9600);\n    while (!Serial)\
    \ {} // wait for Serial to connect\n    digitalWrite(ledPin, LOW); // start with\
    \ LED off\n    blePeripheral.setLocalName(bluetoothDeviceName);\n    \n    //\
    \ attach callback when central connects\n    blePeripheral.setEventHandler(\n\
    \        BLEConnected,\n        onCentralConnected\n    );\n\n    // attach callback\
    \ when central disconnects\n\n    blePeripheral.setEventHandler(\n        BLEDisconnected,\n\
    \        onCentralDisconnected\n    );\n\n    blePeripheral.setAdvertisedServiceUuid(service.uuid());\n\
    \n    blePeripheral.addAttribute(service);\n\n    blePeripheral.addAttribute(commandCharacteristic);\n\
    \n    blePeripheral.addAttribute(responseCharacteristic);\n\n    commandCharacteristic.setEventHandler(\n\
    \        BLEWritten,\n        onCharacteristicWritten\n    );\n\n    Serial.print(\"\
    Starting \");\n\n    Serial.println(bluetoothDeviceName);\n\n    blePeripheral.begin();\n\
    }\n\nvoid loop() {\n    if(bleCommandReceived) {\n\n        bleCommandReceived\
    \ = false; // ensures only executed once\n\n        // incoming command is one\
    \ byte\n\n        unsigned int command = bleMessage[bleCommandDataPosition];\n\
    \n        if(command == bleCommandLedOn) {\n\n            Serial.println(\"Turning\
    \ LED on\");\n\n            ledState = HIGH;\n\n            sendBleCommandResponse(ledState);\n\
    \n        } else {\n\n            Serial.println(\"Turning LED off\");\n\n   \
    \         ledState = LOW;\n\n            sendBleCommandResponse(ledState);\n\n\
    \        }\n\n        digitalWrite(ledPin, ledState);\n    }\n}\n```\n\nThe resulting\
    \ Peripheral turns an LED on and off when instructed, and reports that it’s processed\
