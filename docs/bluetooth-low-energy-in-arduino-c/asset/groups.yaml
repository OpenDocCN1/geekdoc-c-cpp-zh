    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_14_0.png)


    Figure 1-2. Example GATT Structure


    To transmit or request data from a Characteristic, a Central must first connect
    to the Characteristic’s Service.


    For example, a heart rate monitor might have the following GATT profile, allowing
    a Central to read the beats per minute, name, and battery life of the server (Figure
    1-3).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_15_0.png)


    Figure 1-3. Example GATT structure for a heart monitor


    In order to retrieve the battery life of the Characteristic, the Central must
    be connected also to the Peripheral’s “Device Info” Service.


    Because a Characteristic is provided by a Peripheral, the terminology refers to
    what can be done to the Characteristic. A “write” occurs when data is sent to
    the Characteristic and a “read” occurs when data is downloaded from the Characteristic.


    To reiterate, a Characteristic is a field that can be written to or read from.
    A Service is a container that may hold one or more Characteristics. GATT is the
    layout of these Services and Characteristics. A Characteristic can be written
    to or read from.


    ## Byte Order


    Bluetooth orders data in both Big-Endian and Little-Endian depending on the context.


    During advertisement, data is transmitted in Big Endian, with the most significant
    bytes of a number at the end (Figure 1-4).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_16_0.png)


    Figure 1-4. Big Endian byte order


    Data transfers inside the GATT, however, are transmitted in Little Endian, with
    the least significant byte at the end (Figure 1-5).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_16_1.png)


    Figure 1-5. Little Endian byte order


    ## Permissions


    A Characteristic grants certain permissions to the Central. These permissions
    include the ability to read and write data on the Characteristic, and to subscribe
    to Notifications.


    ## Descriptors


    Descriptors describe the configuration of a Characteristic. The only one that
    has been specified so far is the “Notification” flag, which lets a Central subscribe
    to Notifications.


    ## UUIDs


    A UUID, or Universally Unique Identifier, is a very long identifier that is likely
    to be unique, no matter when the UUID was created or who created it.


    BLE uses UUIDs to label Services and Characteristics so that Services and Characteristics
    can be identified accurately even when switching devices or when several Characteristics
    share the same name.


    For example, if a Peripheral has two “Temperature” Characteristics - one for Celsius
    and the other in Fahrenheit, UUIDs allow for the right data to be communicated.


    UUIDs are usually 128-bit strings and look like this:


    ca06ea56-9f42-4fc3-8b75-e31212c97123


    But since BLE has very limited data transmission, 16-bit UUIDs are also supported
    and can look like this:


    0x1815


    Each Characteristic and each Service is identified by its own UUID. Certain UUIDs
    are reserved for specific purposes.


    For example, UUID 0x180F is reserved for Services that contain battery reporting
    Characteristics.


    Similarly, Characteristics have reserved UUIDs in the Bluetooth Specification.


    For example, UUID 0x2A19 is reserved for Characteristics that report battery levels.


    A list of UUIDs reserved for specific Services can be found in *Appendix IV: Reserved
    GATT Services.*


    A list of UUIDs reserved for specific Characteristics can be found in *Appendix
    V: Reserved GATT Characteristics.*


    If you are unsure what UUIDs to use for a project, you are safe to choose an unassigned
    service (e.g. 0x180C) for a Service and generic Characteristic (0x2A56).


    Although the possibility of two generated UUIDs being the same is extremely low,
    programmers are free to arbitrarily define UUIDs which may already exist. So long
    as the UUIDs defining the Services and Characteristics do not overlap in a single
    GATT Profile, there is no issue in using UUIDs that exist in other contexts.


    ## Bluetooth Hardware


    All Bluetooth devices feature at least a processor and an antenna (Figure 1-6).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_19_0.png)


    Figure 1-6. Parts of a Bluetooth device


    The antenna transmits and receives radio signals. The processor responds to changes
    from the antenna and controls the antenna’s tuning, the advertisement message,
    scanning, and data transmission of the BLE device.


    ## Power and Range


    BLE has 40 x 2 MHz channels, with a maximum 10 mW transmission power, 20 byte
    packet size, and 1 Mbit/s speed.


    As with any radio signal, the quality of the signal drops dramatically with distance,
    as shown below (Figure 1-7).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_20_0.png)


    Figure 1-7. Distance versus Bluetooth Signal Strength


    This signal quality is correlated with the Received Signal Strength Indicator
    (RSSI).


    If the RSSI is known when the Peripheral and Central are 1 meter apart (A), as
    well as the RSSI at the current distance (R) and the radio propagation constant
    (n), the distance between the Central and the Peripheral in meters (d) can be
    approximated with this equation:


    d ≈ 10^((A-R)/(10n))


    The radio propagation constant depends on the environment, but it is typically
    somewhere between 2.7 in a poor environment and 4.3 in an ideal environment.


    Take for example a device with an RSSI of 75 at one meter, a current RSSI reading
    35, with a propagation constant of 3.5:


    d ≈ 10^((75-35)/(10×3.5))


    d ≈ 10^(40/35)


    d ≈ 14


    Therefore the distance between the Peripheral and Central is approximately 14
    meters.


    ## Introducing nRFx


    The nRF51822, nRF52833 and related chips are fast, versatile chips that have excellent
    support for Bluetooth Low Energy and an amazing battery life.


    As an embedded device, they can be designed to work as a connected device that
    does everything from home automation, to distributed weather monitoring, to wearable
    electronics.


    This book will teach how to build a Bluetooth Low Energy Peripheral using the
    nRF chip. These chips are incredibly versatile. The Bluetooth and other features
    available for the nRF exceed the scope of this book.


    Although the examples in this book are trivial, the potential applications of
    this technology are profound. This is the technology that almost all wearable
    and Internet of Things (IoT) technologies employ at some level from configuration
    to data reporting.


    ## nRF Setup


    There are many ways to program the nRF chip, depending on the model and APIs purchased.


    This book teaches how to use the ARM mbed platform, an online C++ compiler that
    supports nRF and other embedded chipsets. It is a free platform with open source
    APIs and excellent documentation.


    ### nRFx Microcontrollers


    The nRF Bluetooth Low Energy microcontrollers are fast, powerful processors with
    excellent battery life.


    It is programmable with the C and C++ programming languages. It features input
    and output pins that can be connected to a variety of sensors, motors, and other
    devices.


    There are many development boards that employ the nRF chips, made by a variety
    of manufacturers. Custom boards can be developed with it as well.


    ### mbed IDE


    The mbed IDE looks like a typical coding environment with a file list, text editor,
    and compiler output (Figure 2-1).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_24_0.png)


    Figure 2-1. mbed IDE


    To use the mbed platform, sign up for a developer account at [http://developer.mbed.org](http://developer.mbed.org).
    The mbed programming environment is available under the “Compiler” menu (Figure
    2-2).


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_26_0.png)


    Figure 2-3. mbed Empty Workspace


    ## Installing a Development Platform


    So that mbed knows how to compile for the development board you have, install
    the board support by clicking the button at the top right corner. When there are
    no supported boards installed, this button reads “No device selected.” Clicking
    this button will open a dialog that lists supported devices (Figure 2-4).


    Figure 2-4. Adding supported devices


    Click the “Add Platform” button at the bottom left to open a new tab of potential
    devices to support (Figure 2-5).


    ### You haven''t selected any platform yet


    Pick one from the list below and click the "Select Platform" button to select
    it.


    | Description | Pinout |

    | --- | --- |

    | N/A | More Info |


    Your registered platforms


    Add Platform


    Select Platform

