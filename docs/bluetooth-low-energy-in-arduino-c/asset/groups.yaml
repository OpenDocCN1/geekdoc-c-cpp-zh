    ## About the Author


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_219_0.png)


    Tony’s infinite curiosity compels him to want to open up and learn about everything
    he touches, and his excitement compels him to share what he learns with others.


    He has two true passions: branding and inventing.


    His passion for branding led him to start a company that did branding and marketing
    in 4 countries for firms such as Apple, Intel, and Sony BMG. He loves weaving
    the elements of design, writing, product, and strategy into an essential truth
    that defines a company.


    His passion for inventing led him to start a company that uses brain imaging to
    quantify meditation and to predict seizures, a company acquired $1.5m in funding
    and was incubated in San Francisco where he currently resides.


    Those same passions have led him on some adventures as well, including living
    in a Greek monastery with orthodox monks and to tagging along with a gypsy in
    Spain to learn to play flamenco guitar.


    ## About this Book


    This book is a practical guide to programming Bluetooth Low Energy for Android
    phones and Tablets.


    In this book, you will learn the basics of how to program an Android device to
    communicate with any Central or Peripheral device over Bluetooth Low Energy. Each
    chapter of the book builds on the previous one, culminating in three projects:


    - A Beacon and Scanner

    - An Echo Server and Client

    - A Remote Controlled Device


    Through the course of the book you will learn important concepts that relate to:


    - How Bluetooth Low Energy works

    - How data is sent and received

    - Common paradigms for handling data


    ## Skill Level


    This book is excellent for anyone who has basic or advanced knowledge of Java
    programming on Android.


