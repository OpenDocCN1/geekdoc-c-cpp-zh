    \ mbed.h 和 ble/BLE.h：\n\n```c\n#include \"mbed.h\"\n\n#include \"ble/BLE.h\"\n\
    ```\n\n### 调试\n\n打印出 nRF 的“想法”有助于后续调试。这可以通过实例化一个 Serial 对象并向该 Serial 对象打印文本来实现。\n\
    \n```cpp\nSerial serial(USBTX, USBRX); // initialize the Serial object\n\nserial.baud(9600);\
    \ // set the baud rate\n\nserial.printf(\"Hello World\\r\\n\"); // print text\n\
    ```\n\n有许多方法可以读取 nRF 打印的内容，具体取决于可用的软件和平台。在 Mac OS 和 Linux 上，可以使用名为 screen 的程序：\n\
    \n```shell\n$ screen /dev/tty.usbmodemXXXX 9600\n```\n\n使用 screen 时，请确保波特率（此处为\
    \ 9600）与 nRF Serial 对象上的波特率匹配，并且设备名称是为可用 nRF 设备创建的那个。\n\n尝试将程序上传到 nRF 时，必须关闭与\
    \ nRF 的串行连接。可以通过发出以下按键序列来关闭 screen 会话：\n\nCtrl+a, k, y\n\n### 整合所有内容\n\n在 nRF\
    \ IDE 中创建一个名为 ble_serial 的新项目，并输入以下代码：\n\n**示例 3-1. ble_serial/main.c**\n\n```c\n\
    #include \"mbed.h\"\n\n#include \"ble/BLE.h\"\n\n/** User interface I/O **/\n\n\
    // instantiate USB Serial\n\nSerial serial(USBTX, USBRX);\n\n// Status LED\n\n\
    DigitalOut statusLed(LED1, 0);\n\n// Timer for blinking the statusLed\n\nTicker\
    \ ticker;\n\n/** Functions **/\n\n/**\n* visually signal that program has not\
    \ crashed\n*/\n\nvoid blinkHeartbeat(void);\n\n/**\n* Main program and loop\n\
    */\n\nint main(void) {\n    serial.baud(9600);\n    serial.printf(\"Hello World\\\
    r\\n\");\n    ticker.attach(blinkHeartbeat, 1);\n    while (1) {\n        serial.printf(\"\
    .\");\n        wait(1);\n    }\n}\n\nvoid blinkHeartbeat(void) {\n\n    /* Do\
    \ blinky on LED1 to indicate system aliveness. */\n\n    statusLed = !statusLed;\n\
    }\n```\n\n通过将编译后的十六进制代码上传到 nRF 芯片来运行该程序。此过程可能因 nRF 的串行接口而异，但在许多支持 USB 的 nRF 平台上，只需将代码拖放到\
    \ MBED 磁盘即可。（图 3-2）。\n\n**图 3-2. 将程序上传到 nRF 芯片**\n\n上传完成后，创建一个与 nRF 的串行连接来读取其打印输出。这可以使用\
    \ Terminal 或 CMD 应用程序完成。实际命令因平台而异。以下是 Mac OS X 上的示例（图 3-3）：\n\n```shell\n$ screen\
    \ /dev/tty.usbmodem1412 9600\n```\n\n**图 3-3. 在 Mac OS X 上创建与 nRF 的串行连接**\n\n\
    生成的程序将在串行监视器中打印“Hello World”，如下所示（图 3-4）：\n\n```text\nHello World\n......\n```\n\
    \n**图 3-4. 串行输出**\n\n要停止串行连接，请依次键入 Ctrl+a、k、y\n\n### 示例代码\n\n本章的代码可在以下网址在线获取：[https://github.com/BluetoothLowEnergyInCppWithnRFx/Chapter03](https://github.com/BluetoothLowEnergyInCppWithnRFx/Chapter03)\n\
    \n## 扫描与广播\n\n任何蓝牙低功耗交互的第一步都是让外设通过一个称为广播的过程让中心设备知道它的存在。\n\n在广播过程中，外设进行广播，而中心设备进行扫描。\n\
    \n蓝牙设备调到同一射频信道（也称为信道）时就会相互发现。蓝牙低功耗中有三个信道专门用于设备发现：\n\n**表 4-1. 蓝牙低功耗发现射频信道**\n\n\
    | 信道 | 射频 |\n|---|---|\n| 37 | 2402 MHz |\n| 38 | 2426 MHz |\n| 39 | 2480 MHz\
    \ |\n\n外设会依次在信道上广播其名称和其他数据。这被称为跳频（图 4-1）。\n\n![](img/d7b9d81704fe6839dbdc99a45736bfb5_42_0.png)\n\
    \n**图 4-2. 扫描发现广播**\n\n扫描设置差异很大，例如每 10ms 扫描 100ms，或每 10s 扫描 1s。\n\n通常，当中心设备发现正在广播的外设时，中心设备会向外设请求扫描响应。在某些情况下，扫描响应包含有用的数据。例如，iBeacon\
    \ 使用扫描响应数据告知中心设备每个 iBeacon 的位置，而无需中心设备连接并下载更多数据。\n\n任何蓝牙低功耗交互的第一步都是让外设通过一个称为广播的过程让中心设备知道它的存在。\n\
    \n广播会在一个信道上报告服务器名称和其他信息，直到所有信道都用尽，然后服务器在第一个信道再次重复该过程。\n\n外设可以随时开始或停止广播。\n\n###\
    \ 对外设进行编程\n\n要通过蓝牙低功耗进行广播，你需要准备一些内容。首先，必须包含 BLE 支持：\n\n```cpp\n#include \"mbed.h\"\
    \n\n#include \"ble/BLE.h\"\n```\n\n必须创建一个 BLE 对象\n\n```cpp\n// Broadcast name\n\
    \nconst static char BROADCAST_NAME[] = \"MyDevice\";\n```\n\n```cpp\nint main(void)\
    \ {\n\n    // initialized Bluetooth Radio\n\n    BLE &ble = BLE::Instance(BLE::DEFAULT_INSTANCE);\n\
    \n}\n```\n\n"
