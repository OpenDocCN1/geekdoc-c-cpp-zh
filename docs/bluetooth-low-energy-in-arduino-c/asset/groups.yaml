    As a best practice, it is good to host a standard set of Services and Characteristics
    in a Peripheral''s GATT Profile. These Characteristics allow connected Centrals
    to get the make and model number of the device, and the battery level if the Peripheral
    is battery-powered:


    # Table III-1. Minimal GATT Profile


    | GATT Type | Name | Data Type | UUID |

    |---|---|---|---|

    | Service | Device Information Service |  | 0x180A |

    | Characteristic | Device Name | char array | 0x2A00 |

    | Characteristic | Model Number | char array | 0x2A24 |

    | Characteristic | Serial Number | char array | 0x2A25 |

    | Service | Battery Level |  | 0x180F |

    | Characteristic | Battery Level | integer | 0x2A19 |'
