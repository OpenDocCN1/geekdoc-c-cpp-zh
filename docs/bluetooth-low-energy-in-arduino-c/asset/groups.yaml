    \n我于2011年开始接触低功耗蓝牙，当时我正在开发便携式脑成像技术。后来，在参与一位朋友的穿戴电子初创公司工作时，我于2016年春天在电视节目《美国最伟大的创造者》的幕后工作。\n\
    \n我有着网页编程的背景，发现 BLE 的机制和术语令人困惑且难以理解。在一段时间的沉浸之后，我适应了这些差异，并开始欣赏这种低功耗技术背后的力量。\n\n\
