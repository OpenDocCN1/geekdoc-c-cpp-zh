    \n## Appendix I: Bluetooth Properties\n\nFor reference, the following are properties\
    \ of the Bluetooth Low Energy network and hardware.\n\n| Property | Value |\n\
    |---|---|\n| Range | 100 m (330 ft) |\n| Data Rate | 1M bit/s |\n| Application\
    \ Throughput | 0.27 Mbit/s |\n| Security | 128-bit AES with Counter Mode CBC-MAC\
