    # Appendix II: UUID Format


    Bluetooth Low Energy has tight space requirements. Therefore it is preferred to
    transmit 16-bit UUIDs instead of 32-bit UUIDs. UUIDs can be converted between
    16-bit and 32-bit with the standard Bluetooth Low Energy UUID format:


    Table II-1. 16-bit to 32-bit UUID Conversion Standard


    | UUID Format | uuid16 | Resulting uuid32 |

    |---|---|---|

    | 00000000-0000-1000-8000-00805f9b34fb | 0x2A56 | 00002A56-0000-1000-8000-00805f9b34
    |'
