    Tony Gaitatzis, 2017


    ISBN: 978-1-7751280-1-4


    ![](img/d7b9d81704fe6839dbdc99a45736bfb5_224_0.png)


    ### iOS Swift中的低功耗蓝牙编程


    Tony Gaitatzis, 2017


