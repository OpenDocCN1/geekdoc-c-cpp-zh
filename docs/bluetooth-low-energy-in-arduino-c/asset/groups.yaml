    and user community that designs and manufactures single-board microcontrollers
    and microcontroller kits for building digital devices and interactive objects
    that can sense and control objects in the physical world.

    - **Attribute** - An unit of a GATT Profile which can be accessed by a Central,
    such as a Service or a Characteristic.

    - **Beacon** - A Bluetooth Low Energy Peripheral which continually Broadcasts
    so that Centrals can discern their location from information gleaned from the
    properties of the broadcast.

    - **Bluetooth Low Energy (BLE)** - A low power, short range wireless protocol
    used on micro electronics.

    - **Broadcast** - A feature of Bluetooth Low Energy where a Peripheral outputs
    a name and other specific data about itself.

