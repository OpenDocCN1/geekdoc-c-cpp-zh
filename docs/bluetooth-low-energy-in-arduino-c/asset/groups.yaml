    # Preface


    Thank you for buying this book. I’m excited to have written it and more excited
    that you are reading it.


    I started with Bluetooth Low Energy in 2011 while making portable brain imaging
    technology. Later, while working on a friend’s wearable electronics startup, I
    ended up working behind teh scenes on the TV show America’s Greatest Makers in
    the Spring of 2016.


    Coming from a web programming background, I found the mechanics and nomenclature
    of BLE confusing and cryptic. A er immersing myself in it for a period of time
    I acclimated to the di erences and began to appreciate the power behind this low-power
    technology.


    Unlike other wireless technologies, BLE can be powered from a coin cell battery
    for months at a time - perfect for a wearable or Internet of Things (IoT) project!
    Because of its low power and short data transmissions, it is great for transmitting
    bite size information, but not great for streaming data such as sound or video.


    Good luck and enjoy!'
