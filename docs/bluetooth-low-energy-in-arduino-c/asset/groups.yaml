    \ |\n| Robustness | Adaptive Frequency Hopping, Layer Acknowledgement, 24-bit\
    \ CRC, 32-bit Message Integrity Check |\n| Peak Current Consumption | < 15 mA\
    \ |\n| Byte-Order in Broadcast | Big Endian (most significant bit at ... ) |\n\
