    In order to use the Bluetooth features of the nRF chip, certain C header files
    must be included.


    On the mbed platform, those are mbed.h and ble/BLE.h:


    ```

    ```c

    #include "mbed.h"


    #include "ble/BLE.h"

    ```

    ```


    # ## Debugging


    It is useful to print out what nRF is thinking to help debugging later. This can
    be done by instantiating a Serial object and printing text to that Serial object.


    ```

    ```cpp

    Serial serial(USBTX, USBRX); // initialize the Serial object


    serial.baud(9600); // set the baud rate


    serial.printf("Hello World\r\n"); // print text

    ```

    ```


