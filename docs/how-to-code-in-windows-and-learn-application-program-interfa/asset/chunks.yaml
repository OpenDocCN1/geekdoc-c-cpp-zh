  trans: "\n\n![](img/cover00050.jpeg)\n\n# 引言\n\n## 你的第一个窗口\n\n欢迎阅读《创建你自己的窗口》，这是一本结合\
    \ C++ 语言与 `Windows API` 的书籍。通过这本书，你将学习构建你第一个窗口所需的语法。通过部就班，你将完成创建一个可以在你 PC 屏幕上看到的、具有完全功能的窗口的各个阶段。\n\
    \n## 窗口示例\n\n在本书结束时，你将能够编写构建窗口的代码并理解其含义。你创建的窗口看起来与此相同或相似：\n\n![](img/image00048.jpeg)\n\
    \n本书向你介绍的第一个阶段是确保你具备所需的编程经验，以理解理解窗口所需的语法。要理解书中书中显示和解释的所有内容，你需要了解 C++ 的基础知识以及一些面向对象编程的知识。这包括理解等概念：\n\
    \n*   变量。\n*   类。\n*   继承。\n*   函数。\n*   通过引用和指针传递值。\n*   循环。\n*   语句。\n\n现在，让我们从一个名为“消息框”（The\
    \ Message Box）的简单窗口代码开始看。\n\n## 规范与实践\n\n毫无疑问，`Windows API` 很难学习，但非常有回报。我的意思是，你可以构建自己的\
    \ Windows。你可以成为比尔·盖斯（Bill Gates）——显然，不用拥有那几百万美元了。\n\n在本书的各个页中，你将发现三个包含特殊信息的框，重点关注编程技术。以下展示了散布在众多页面中的这些框。\n\
    \n### 编程知识\n\n这些框充满了必要信息，可以帮助增强你对 C++ 语言的理解。\n\n### 编程技术探讨\n\n这些框是为了我们内心的“极客”准备的，他们渴望学习和吸收深度\
    \ C++ 概念的信息。\n\n### 编程警告\n\n这些框指出了程序员在尝试通过特定的编程概念编写代码之前应该注意的危险区域。\n\n**警告：Windows\
    \ 头文件**\n\n取决于你用于构建窗口的编译器，包含 Windows 头文件的方式也可能取决于该编译器的要求。\n\n大多数编译器将接受 `#include\
    \ <Windows>`。\n\n然而，在某些情况下（例如 `Code::Blocks`），你需要在 Windows 之后加上 `.h`。如下所示：\n\n\
    ```cpp\n#include <Windows.h>\n```\n\n### 第 2 步：使用 `WinMain` 函数打开\n\n如前所述，在创建 Windows\
    \ 应用时，用于 Windows 控制台程序的主函数被 `WinMain` 函数取代了。与 `main` 函数一样，`WinMain` 是任何创建的 Windows\
    \ 应用的起点。因此，在使用 `Windows API` 编写程序时，`WinMain` 函数内部的第一行就是程序的开始。\n\n`WinMain` 函数还有几个在\
    \ Windows 程序中使用的参数。下面的语法展示了 `WinMain` 函数的原型。\n\n```cpp\nWINAPI int WinMain(HINSTANCE\
    \ hInstance,\n                   HINSTANCE hPrevInstance,\n                  \
    \ LPSTR cmdLine, int cmdShow);\n```\n\n**警告：WinMain 不是 main**\n\n使用 `main` 开发控制台窗口与通过\
    \ `WinMain` 打开来构建窗口是完全不同的。它们唯一的相似之处在于像 `main` 一样，`WinMain` 是程序开始的地方。\n\n现在，你可能已经在盯着这些参数看，疑惑\
    \ `HINSTANCE` 和 `LPSTR` 是什么意思了。用复杂的话，`HINSTANCE` 是一个实例的句柄（handle）。这意味着对于第一次尝试\
    \ Windows 编程的人来说，`HINSTANCE` 是一个使用 `typedef` 定义的类型，它寻找正在被利用的内存地址。因此，它就像任何数据类型一样，可以定义变量。稍后我们将查看\
    \ `Windows API` 在其编程中拥有并使用的不同类型。对于上面的示例，`HINSTANCE` 创建了一个名为 `hInstance` 的变量，另一个名为\
    \ `hPrevInstance` 的变量。第二个变量基本上被忽略了。所以，让我们从构建 MessageBox 程序的第一步开始。\n\n### 第 1 步：`<Windows.h>`\
    \ 文件\n\n在创建我们的 Windows 消息框之前，所需的初始行代码是一个包含 `Windows.h` 头文件的预处理器指令。对于任何中级或高级 C++\
    \ 程序员来说，这可能简单而易。然而，我写了下面这一行：\n\n```cpp\n#include <Windows.h>\n```\n\n通过包含 Windows\
    \ 头文件，允许程序利用构建在 Windows 中运行的程序所需的所有内容。\n\n**警告：Windows 头文件**\n\n取决于你用于构建窗口的编译器，包含\
    \ Windows 头文件的方式也可能不同。\n\n大多数编译器将接受 `#include <Windows>`。\n\n然而，在某些情况下（例如 `Code::Blocks`），你需要在\
    \ Windows 之后加上 `.h`。如下所示：\n\n```cpp\n#include <Windows.h>\n```\n\n### 第 2 步：使用\
    \ `WinMain` 函数打开\n\n如前所述，在创建 Windows 应用时，用于 Windows 控制台程序的主函数被 `WinMain` 函数取代了。与\
    \ `main` 函数一样，`WinMain` 是任何创建的 Windows 应用的起点。因此，在使用 `Windows API` 编写程序时，`WinMain`\
    \ 函数内部的第一行就是程序的开始。\n\n`WinMain` 函数还有几个在 Windows 程序中使用的参数。下面的语法展示了 `WinMain` 函数的原型。\n\
    \n```cpp\nWINAPI int WinMain(HINSTANCE hInstance,\n                   HINSTANCE\
    \ hPrevInstance,\n                   LPSTR cmdLine, int cmdShow);\n```\n\n**警告：WinMain\
    \ 不是 main**\n\n使用 `main` 开发控制台窗口与通过 `WinMain` 打开来构建窗口是完全不同的。它们唯一的相似之处在于像 `main`\
    \ 一样，`WinMain` 是程序开始的地方。\n\n现在，你可能已经在盯着这些参数看，疑惑 `HINSTANCE` 和 `LPSTR` 是什么意思了。用复杂的话，`HINSTANCE`\
    \ 是一个实例的句柄。这意味着对于第一次尝试 Windows 编程的人来说，`HINSTANCE` 是一个使用 `typedef` 定义的类型，它寻找正在被利用的内存地址。因此，它就像任何数据类型一样，可以定义变量。稍后我们将查看\
