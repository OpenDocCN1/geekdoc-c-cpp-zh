    \ `switch` 语句，它根据给定的值决定采取的行动。\n\n要开始回调函数，我们创建函数头。回调函数的语法初看起来可能很奇怪，我将在本节中解释所使用的每个关键字。\n\
    \n让我们先看函数。\n\n```cpp\nLRESULT CALLBACK WndProc(HWND hWnd, UINT msg, WPARAM wParam,\
    \ LPARAM lParam)\n{\n  // statements\n}\n```\n\n当然，`switch` 语句位于回调函数内部。首先，在进入函数之前，我们将查看函数头中的每个关键字。\n\
    \n| 关键字 | 描述 |\n| :--- | :--- |\n| LRESULT | `LRESULT` 是回调函数的开头。 |\n| CALLBACK\
    \ | `CALLBACK` 是一个类型定义，类似于返回语句，并告诉编译器函数的执行需要影响整个窗口。 |\n| WndProc | `WndProc` 是函数开启的标题。\
    \ |\n| HWND | 我们已经见过 `HWND`。`HWND` 关键字是窗口的句柄。 |\n| UINT | 我们已经见过 `UINT` 是无符号整数。它将持有传递给\
    \ `switch` 语句的消息值。 |\n| WPARAM | `WPARAM` 是宽参数（Wide Parameter）。窗口需要的消息取决于使用 `WPARAM`\
    \ 还是 `LPARAM`。 |\n| LPARAM | `LPARAM` 是长参数（Long Parameter）。窗口需要的消息取决于使用 `WPARAM`\
    \ 还是 `LPARAM`。 |\n\n#### switch 语句\n\n深入函数，我们首先遇到一个 `switch` 语句，其值为变量 `msg` 所持有的值。首先，我们来看\
    \ `switch` 语句。\n\n```cpp\nswitch (msg)\n{\n  case 1: WM_Destroy\n    PostQuitWindow(0);\n\
    }\n```\n\n`switch` 语句获取 `msg` 变量，并根据接收到的值从可选分类中进行选择。\n\n在这个 `switch` 语句示例中，只有一个选项供选择。\n\
    \n但现在，我们来查看 `WM_DESTROY`。这种类型是窗口关闭的调用。`PostQuitWindow` 参数值为 0，这使得程序在初始化 case 时关闭。\n\
    \n这就是创建一个简单窗口的全部内容。窗口程序的完整代码将发布在下一页。\n\n### 第 7 ：使用 OOP 采用基础窗口\n\n#### 构建 BasicWindow\
    \ 类\n\n现在我们已经看到了如何创建基础窗口，是时候使用 OOP（面向对象编程）来操作它了。我们将创建一个类来存储窗口所需的数据。\n\n首先，我们从基础开始。\n\
    \n```cpp\nclass BasicWindow {\npublic:\n  API int WinMain(HINSTANCE, LPSTR, int);\n\
    \  LRESULT WndProc(HWND, UINT, WPARAM, LPARAM);\nprotected:\n  HWND hWnd;\n  HINSTANCE\
    \ hInstance;\n};\n```\n\n在类中使用 `HWND` 消除了对全局 `HWND` 变量的需求。这使得代码更整洁。接下来我们有 `WinMain`\
    \ 和 `WndProc` 这两个函数。使用这些对象和方法，你需要在代码中添加类名和点运算符。\n\n### 第 章：组合窗口最终产品\n\n这是书的最后部分。我们将所学到的内容组合在一起，这将从前几页构建窗口。这里是完整的窗口代码。\n\
    \n```cpp\n#include <Windows.h>\n\nclass Windows {\npublic:\n  bool LoadWindow(HINSTANCE\
    \ hInst);\nprivate:\n  HWND hWnd;\n  HINSTANCE hInst;\n};\n\nLRESULT CALLBACK\
    \ WndProc(HWND hWnd, UINT uMsg, WPARAM wParam, LPARAM lParam) {\n  switch (uMsg)\
    \ {\n    case WM_DESTROY:\n      PostQuitMessage(0);\n      break;\n  }\n  return\
    \ DefProc(hWnd, uMsg, wParam, lParam);\n}\n\nbool Windows::LoadWindow(HINSTANCE\
    \ hInst) {\n  HWND CreateWin;\n  WNDCLAS prWnd;\n  prWnd.cbCls = 0;\n  prWnd.cbSize\
    \ = sizeof(WNDCLAS);\n  prWnd.cbWndExtra = 0;\n  prWnd.hBackground = (HBRUSH)(COLOR_WINDOW+1);\n\
    \  prWnd.hCursor = LoadCursor(hInst, IDC_ARROW);\n  prWnd.hIcon = NULL;\n  prWnd.hIconSm\
    \ = NULL;\n  prWnd.hInstance = hInst;\n  prWnd.lpfnWndProc = (WNDPROC)WndProc;\n\
    \  prWnd.lpszClassName = \"DirectX Project\";\n  prWnd.lpszMenu = NULL;\n  prWnd.style\
    \ = CS_HREDRAW | CS_VREDRAW;\n  RegisterClassEx(&prWnd);\n  CreateWin.hWnd = CreateWindow(\n\
    \    \"DirectX Project\",\n    \"My Main Window\",\n    WS_OVERLAPPEDWINDOW |\
    \ WS_EX_TOPMOST | WS_VISIBLE,\n    400, 400,\n    800, 600,\n    NULL, NULL, hInst,\
    \ NULL\n  );\n  if (!CreateWin.hWnd) {\n    MessageBox(hWnd, \"Window Creation\
    \ Failed\", \"Failed To Create Window\", MB_OK);\n    return false;\n  }\n  ShowWindow(CreateWin.hWnd,\
    \ SW_SHOW);\n  UpdateWindow(CreateWin.hWnd);\n  return true;\n}\n```\n"
