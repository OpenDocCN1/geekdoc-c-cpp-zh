    # Chapter 2: Creating A Window


    ## Programming The Main Window


    In the previous example you created your very own window application. Even though
    it was only a message dialog box, it used the basic fundamentals every windows
    application is required to have.


    Now, we are going to create a full screen window. It is a simple blank window
    with a white background. A basic window averages around 70-80 lines of code.


    Well, what is the To begin with, you need to initialize the window and then create
    the window behind setting a loop.


    ### Step 1: Window Class


    After coding the `Windows.h` header file and opening the `WinMain` function, the
    initial step to creating a window is to allocate it a class called a Windows class.


    #### WNDCLASSEX


    The following syntax is required to create a windows class.


    ```cpp

    WNDCLASSEX <class name>;

    WNDCLASSEX parentWindow;

    ```


    Once the window class is declared, then you can start to define it by filling
    in the specifications of its parameters.


    Below is a list of the parameters that need attending to before moving onto the
    next stage.


    | Parameter | Description |

    | :--- | :--- |

    | `cbClsExtra` | Determines the amount of reserved bytes required for the Windows
    Class. Normally, this is set to `NULL`. |

    | `cbSize` | Sets the byte size of the Windows Class. |

    | `cbWndExtra` | Determines the amount of reserved bytes required for the Window.
    Normally, this is set to `NULL`. |

    | `hbrBackground` | Set the type of brush for drawing and colouring the window.
    It can alter the colour of the window. |

    | `hCursor` | Set the cursor type used in the window. If set to `NULL`, then the
    default cursor will be used. |

    | `hIcon` | Sets the original icon used for the window. This is the icon seen
    in the taskbar. If set to `NULL`, then the default icon will be used. |

    | `hIconSm` | Set the small sized icon (seen in the Windows tray). If set to `NULL`,
    then the default icon will be used. |

    | `hInstance` | Set the handle name of the instance that the Window uses. |

    | `lpszClassName` | Set the name of the Windows class name between double quotes.
    |

    | `lpfnWndProc` | Set the name found in the `WinProc` function. |

    | `lpszMenuName` | Set the name of the menu that the window has. If the window
    has no menu then set `NULL`. |

    | `style` | Set the style (shape) of the window. |


    Once all of these are filled out as shown below, the next step is to make sure
    the window is registered in memory.


    ```cpp

    prWnd.cbClsExtra = 0;

    prWnd.cbSize = sizeof(WNDCLASSEX);

    prWnd.cbWndExtra = 0;

    prWnd.hbrBackground = (HBRUSH)(COLOR_WINDOW+1);

    prWnd.hCursor = LoadCursor(hInst , IDC_ARROW);

    prWnd.hIcon = NULL;

    prWnd.hIconSm = NULL;

    prWnd.hInstance = hInst;

    prWnd.lpfnWndProc = (WNDPROC)WndProc;

    prWnd.lpszClassName = "DirectX Project";

    prWnd.lpszMenuName = NULL;

    prWnd.style = CS_HREDRAW | CS_VREDRAW;

    ```


    ### Step 2: Register the Windows Class


    This part is simple, and requires only one line of code. First you write `RegisterClassEx`
    then in brackets `()` you reference the windows class you have just made. In this
    case it would look like the following.


    #### RegisterClassEx


    ```cpp

    RegisterClassEx(&parentWindow);

    ```


    There. Simple.


    ### Step 3: Create The Window


    Now that you have the window registered in memory for the computer to use, you
    have to create its foundations. Don’t get this confused with creating the windows
    class, as now you are forming the visual aspect of the window instead of telling
    the compiler what the window boarder and how the window should act.


    To begin to create a window you first have to use the handle variable (normally
    `hWnd`) and incorporate the `CreateWindow` function.


    | Parameter | Description |

    | :--- | :--- |

    | `LPSTR` | The name of the class. |

    | `LPSTR` | The caption of the window. |

    | `DWORD` | How the window will be displayed. |

    | `int` | The X position of the window. |

    | `int` | The Y position of the window. |

    | `int` | The width of the window. |

    | `int` | The height of the window. |

    | `HWND` | The parent window. |

    | `HMENU` | The menu of the window. |

    | `HINSTANCE` | The instance of the window. |

    | `LPVOID` | Pointer to a value. |


    ```cpp

    hWnd = CreateWindow("First Window", "Main Window", WS_OVERAPPEDWINDOW | WS_TOPMOST
    | WS_VISIBLE, 400, 400, 800, 600, NULL, NULL, hInstance, NULL);

    ```


    ### Step 4: Show & Update The Window


    Next, it is now time to tell the compiler how it will display the window. This
    is not how it will look but to tell it what handle to use to show and then update
    the window whenever a new event is created.


    **Technical Talk:** What is a Windows event?


    A Window event is anything that happens in the window. Whether that is a mouse
    click, a menu opening or the window resizing, they are all events and the compiler
    requires to be told when one happens so it update the window through the `UpdateWindow`
    function.


    #### ShowWindow(…)


    First we need to show the window before we can tell the compiler it needs updating.
    To do this the `ShowWindow` function is initiated along with a set of parameters
    to tell the compiler what handle to use and the concept of how the handle is to
    be used.


    ```cpp

    ShowWindow(hWnd, SW_SHOW);

    ```


    We know that `hWnd` is a handle to the window. But the `SW_SHOW` is an object
    type that tells the show window that after grabbing the handle it then has to
    utilise it to show the window.


    ### Step 5: Translate & Update


