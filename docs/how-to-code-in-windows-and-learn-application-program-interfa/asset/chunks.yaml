    ![](Images/cover00050.jpeg)


    Introduction


    # Your First Window


    Welcome to Create Your Own Window, a book that uses the C++ programming language
    alongside the Windows API. With this book, you will learn the syntax required
    to build your very first window. Step by step, you can move through the stages
    of creating a fully functional windows that you can see on your PC screen.


    # The Window Example


    By the end of this book you will be capable of writing code that builds a window
    and understanding it. The window you create will look the same or similar to this:


    ![](Images/image00048.jpeg)


    The first stage that this book introduces you to is to make sure you have the
    programming experience required to understand the syntax needed for a window.
    To understand everything that is shown and explained in this book, you will need
    to understand the basics of C++ and some of Object-Oriented Programming. This
    includes understanding concepts such as:


    *   Variables.


    *   Classes.


    *   Inheritance.


    *   Functions.


    *   Passing values by reference and pointers.


    *   Loops.


    *   Statements.


    Now, let’s begin by looking at the code of a simple window called The Message
    Box.


    ## Conventions & Practices


    There is no doubt about it, the Windows API is a difficult to learn, but very
    rewarding. I mean, you get to build your own Windows. You get to become Bill Gates
    – without the millions of dollars obviously.


    Throughout the pages of this book you will discover three boxes that have special
    information that focuses on programming techniques. The following illustrates
    the boxes that are spread out amongst the numerous pages.


    Programming Knowledge


    These boxes are filled with necessary information, which can help to enhance your
    knowledge of the C++ language.


    Programming Technical Talk


    These boxes are for the “geek” inside us, which desires to learn and absorb the
    information of in-depth C++ concepts.


    Programming Warnings


    These boxes point out dangerous areas that a programmer should be aware of before
    attempting to code something, via a certain programming concept.


    # Chapter 1: The MessageBox Window


    ## Your First Window: The Message Box


    Do you remember the first program you created? If you read book 1 of C++ Programming
    Simplified, written by my good self, then your first program would probably have
    been The Hello Programmer application. Well, I hope you did and to begin your
    journey with Windows programming, we are going to the Hello Programmer application
    and converting it to work with the Windows API.


    Of course, creating a Windows version of the Hello Programmer application is much
    more than just the simple program you see here.


    #include <iostream>


    using namespace std;


    int main()


    {


        cout << "Hello Programmer!" << endl;


        return 0;


    }


    Looks pretty easy doesn’t it? Well, remember those days when programming in C++
    was easy, although not as rewarding as what you’re about to jump into – not literally.
    Don’t worry, I am not going to leave you without a flair gun stood in a sinking
    boat. Each stage we go through I’ll be there to hold your hand – again not literally 
    - and talk you through every part slowly. So, let’s us begin with the first step
    of building the MessageBox program.


    ### Step 1: the <Windows.h> File


    Before we create our Windows MessageBox, the initial line of code required is
    a pre-processor directive that includes the Windows.h header file. This is probably
    easy for any intermediate or advanced C++ programmer. However, I have written
    the line below.


    #include <Windows.h>


    By including the Windows header file, it allows the program to utilize everything
    required to construct a program, which operates in Windows.


    Warning: Windows Header File


    Depending on the compiler you are using to build your window shall depend on how
    its like the Windows header file to be included.


    Most compiler will accept #include <Windows>.


    However, in some case, like Code::Blocks, you will need to include a .h after
    the Windows. As such:


    #include <Windows.h>


    ### Step 2: Open With The WinMain function


    Stated earlier, when creating a Windows application the main function, used for
    Windows console programs, is replaced with the WinMain function. Like the main
    function, WinMain is the beginning of any Windows application created. Therefore,
    when coding a programs using the Windows API, the initial line inside the WinMain
    function is the beginning of the program.


    The WinMain function also has several parameters that are used in a Windows program.
    The syntax below reveals the prototype for the WinMain function.


    WINAPI int WinMain(HINSTANCE hInstance,


                       HINSTANCE hPrevInstance,


                       LPSTR cmdLine, int cmdShow);


    Warning: The WinMain Is Not main


    Developing a console window using main and building a window by opening with WinMain
    is totally different. One of the only similarity’s it has is like main, WinMain
    is where the program begins.


    Now, you might already be gapping at those parameters wondering what HINSTANCE
    and LPSTR mean. Put in a complex way, HINSTANCE is a handle to an instance. This
    means, to someone attempting Windows programming for the first time, that HINSTANCE
    is a type defined using typdef, which looks for the address in memory it is being
    utilized for. Therefore, it iss like any data type, which can define a variable.
    Later on we will look at the different types the Windows API has and uses in its
    programming. As for the example above, HINSTANCE creates a variable called hInstance
    and another called hPrevInstance. The second variable is basically ignored and
    not used in todays Windows programming, unless you wish to create a program for
    an older version of Windows, like Windows 95.


    Next we have LPSTR, which is another type created for the Windows API. It stands
    for Long Pointer to String. In short terms, it is a pointer type that looks for
    a string variable. This means that when this type is used it requires to point
    to a string variable. Once we move onto creating the message box object, this
    will come into full practise.


    The last parameter is a classic int variable, which means it looks for a whole
    number. Again, we will see how this works with the message box object we shall
    create next.


    Once the WinMain function is complete, it opens up with brackets and we can start
    to create our message box. To create a message box we shall use the message box
    function known as MessageBox(). Like the WinMain function, the MessageBox object
    uses parameters to determine what information the message box will have in the
    program.


    To create the Hello Programmer message box follow the syntax:


    MessageBox(0,“Hello Programmer, nice to see you again!”,“Welcome Back!”, MB_OK);


    On the MSDN website, it displays the syntax for the MessageBox object as the following.


    int WINAPI MessageBox(


      _In_opt_  HWND hWnd,


      _In_opt_  LPCTSTR lpText,


      _In_opt_  LPCTSTR lpCaption,


      _In_      UINT uType


    );


    Let’s go through this before we end the program.


    #### HWND hWnd


    The MessageBox function opens with a HWND (handle to window/window handle) object.
    A HWND object is another typedef that equals to an int variable. This type looks
    for a whole number. This is why in our small example the value of the HWND is
    set to 0, therefore telling the compiler there is no HWND for the MessageBox to
    use.


    #### LPCTSTR lpText


    Next, a LPSTR type is required. The first LPSTR allocates the message inside the
    Message Box. This is important, as if you get these mixed up you’ll have the wrong
    piece of string in the wrong place. As you can see, the first variable in the
    example is called lpText, signifying it is used for the message in the dialog
    box.


    #### LPCTSTR lpCaption


    The second LPSTR is to fill the caption of the dialog box. The caption is the
    header file of the dialog box.


    As you can see from the image above, the caption in the message dialog box reads“Message
    Box”and the message itself reads“Hello Programmer!.


    #### UINT uType'
