    # 9.2 Linear Collection


    # 9.2.1 Definition of Linear Collection


    The order and the position of an element are directly related in a linear collection.
    There are three access methods in linear collection: direct access, sequential
    access, and indexed access. In this section, we only introduce direct access and
    sequential access.


    Programmers can directly access any element in a linear collection that supports
    the direct access method. For instance, programmers can access any element in
    an array through the subscripts. But programmers can only traverse the collection
    to access an element in a linear collection that only supports sequential accesses.


    There are two special linear collections – stacks and queues. To introduce stacks,
    let''s consider a pile of dishes in a restaurant: we can only grab the dish on
    the top, and put a dish on the top of the pile. This is exactly what a stack does
    as shown in Figure 9.6. A stack is a linear collection that can only be accessed
    from one side. The accessible side is called the top of the stack, while the other
    side is called the bottom of the stack. Adding / removing elements to the top
    of the stack is called pushing and popping, respectively. As we can see, elements
    in stacks are “Last In, First Out” (LIFO).'
