  md: '# 4.3 Constructor and Destructor


    The relationation between class and object is like the relation between basic
    types and their variables, I.e., general and special. An object differs from other
    objects mainly in two ways: the first is its name, which is the external difference;
    the second is the values of its data attributes, which is the internal difference.
    Just like we initialize a basic-type variable when defining it, we can also initialize
    the data members of an object when defining the object. Setting values to data
    members of an object while defining the object is the initialization of that.
    After the use of a special object is finished, we usually need to do some cleaning.
    In C++, there are two special function members used to do this work, **constructors**
    and **destructors**.


    # 4.3.1 Class Constructors


    To understand the constructor of a class, we first have to understand the procedure
    of creating an object. When a program is running, every variable of a basic type
    takes up some memory space. Initializing a variable during its definition means
    to set an initial value to the memory space when it is allocated. This kind of
    initialization seems simple in C++ source code, in fact, to achieve this initialization
    the compiler needs to generalize some codes automatically to the variable type.


    The procedure of creating an object is similar: during the execution of the program,
    when it comes to the declaration statement of an object, the program will apply
    for some memory space from the operating system to store the new object. We hope
    that the program would fill the initial values for it does members of the object
    when allocating with memory space, just like what it does to common variables.
    Unfortunately, compared with common variables, a class object is too complex,
    and the compiler has no idea how to generalize codes to achieve the initialization.
    So programmers have to write codes to do this initialization. If a programmer
    hasn''t written his initialization code gives some initial value to an object
    during its definition, he won''t have the object initialized and probably will
    get a compiler syntax error. That''s why none of the objects in the former examples
    of this book have been initialized.


    Despite this, the compiler system of C++ still does work for us on the problem
    of object initialization. C++ strictly defines the interface form of an initializing
    program, and has a set of automatic calling mechanisms. Here the initializing
    program is called a constructor.


    A constructor constructs an object with specific values when creating this object,
    and initializes it to a specific state. The constructor is also a member function
    of a class, and besides the common characters of member functions, the constructor
    has special attributes: the constructor shares the same name with the class and
    has no return value and the constructor is usually declared as a public function.
    Once a class'
