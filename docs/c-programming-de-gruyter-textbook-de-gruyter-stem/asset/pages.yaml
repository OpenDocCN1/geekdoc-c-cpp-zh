- pgno: 497
  md: '# 12.6 Summary


    Some avoidable errors during program execution are to be expected. When such errors
    occur, we should allow the user to correct the environmental errors and allow
    the program to continue run. This is the task of exception handlers. C++ language
    provides internal support for handling exceptions. The *try*, *throw*, and *catch*
    statements are the mechanism for implementing exception handling in C++.


    To make the program more readable, we can let the user know all possible exceptions
    that could be thrown by the function, this is the exception interface declaration.


    The reality of exception handling in C++ lies not only in its ability to handle
    exceptions of various types, but also in its ability to call destructors for all
    local objects constructed before the throwing of the exception.


    In the last section of the chapter, we introduced the standard exception classes
    and their functions in the C++ standard library, and outlined a key property that
    is guaranteed by the exception handling in the C++ standard library. That, is,
    exceptions will not cause resource leak and the integrity of containers is maintained.


    # Exercises


    +   12.1 What is an exception? What is exception handling?


    +   12.2 What are the advantages of the exception handling in C++?


    +   12.3 Explain the use of *throw*, *try*, and *catch* statements by examples.


    +   12.4 Design an exception abstract class *Exception*, and derive an *AutoOfMemory*
    class to respond to the out of memory situation, and a *RangeError* class to respond
    to the exception that input numbers are not in the specified range. Implement
    and test these classes.


    +   12.5 Practice using *try* and *catch* statements. Use *new* to allocate memory
    in the program. If the operation fails, use a *try* statement to trigger an exception
    of the *char* type, and catch the exception using a *catch* statement.


    +   12.6 Define an exception class *CException*, which has a member function *Reason()*
    to display the type of the exception. Define function *fn1()* to trigger an exception,
    call *fn1()* in the *try* module of the main function, and catch the exception
    in *catch* module. Observe the execution flow of the program.'
