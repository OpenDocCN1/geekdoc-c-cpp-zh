  md: "# 1.4 Representation and Storage of Information\n\nComputers can process data\
    \ information, although it is conducted by control information. So the information\
    \ in computers can be classified into two categories:\n\n+   - information - control\
    \ information - control word - numerical information - fixed point\n floating\
    \ point\n data information - character data\n nonnumeric information - logical\
    \ data\n\nThis chapter focuses on data information. Please refer to related books\
    \ on hardware for details on control information.\n\n# 1.4.1 Digital System of\
    \ Computers\n\nPeople are familiar with the decimal numerical system. However,\
    \ almost all computers use the binary system. Computers cannot transfer, store,\
    \ or process data until it is coded into binary digits. In programming, we usually\
    \ transfer binary system into the octal system or hexadecimal system. A common\
    \ feature to all these numerical systems is that they are positional numerical\
    \ systems.\n\nGenerally speaking, if there are R basic symbols in a numerical\
    \ system, we call it an R-based numerical system. R is the \"base\" of the numerical\
    \ system and each position in the numerical system has a value called \"weight\"\
    .\n\nThe coding of positional numerical system complies with the \"standing-on-R\"\
    \ rule, which means weight is the power based on R. Any number can be expanded\
    \ to a polynomial according to the weight. For example, a decimal number 256.47\
    \ can be expanded into the polynomial as follows:\n\n```\n256.47 = 2 \\times 10^2\
    \ + 5 \\times 10^1 + 6 \\times 10^0 - 4 \\times 10^{-1} + 7 \\times 10^{-2}\n\
    ```\n\nFor any R-based number x, its value V(x) can be presented as:\n\n```\n\
    V(x) = \\sum_{i=0}^{n-1} x_i R^i + \\sum_{i=-1}^{m} x_i R^i\n```\n\nHere m and\
    \ n are integers, and R^l is the weight in Position i. X_0 and X_{-1} are separated\
    \ by a decimal point. Usually, X_i should satisfy the following condition:\n\n\
    ```\n0 \\leq X_i < R\n```"
