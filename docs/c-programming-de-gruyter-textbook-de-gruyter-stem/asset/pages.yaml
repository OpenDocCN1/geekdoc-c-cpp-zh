    # 7.7 Program Example:

    Personnel Information Management Program


    In this section, we will take the personnel information management of a small
    corpora- as an example to further illustrate the procedure of derivation and the
    applications of virtual functions and base classes.


    # 7.7.1 Problem Description


    In Section 7.1.1, we analyzed the problem of the personnel information management
    system that had been discussed in Chapters 4.6. In Section 7.1.3 we proposed an
    improvement of the program. Here, we implement the salary calculating function
    mentioned in Section 7.1.1 using class inheritance and derivation. For example,
    we assume the salary calculating method to be: a manager''s salary is 8,000 RMB;
    a part-time technician gets his salary by the hour and the hourly pay is 100 RMB;
    a part-time salesman''s salary includes commissions, which are 4% of his sales;
    a sales manager takes his fixed salary of 5,000 RMB and sales commissions, which
    are 5% of his department''s sales in a current month.


    # 7.7.2 Class Design


    According to the above needs, we design a base class employee, from which we derive
    the classes technician (part-time technician), manager (manager), and salesman
    (salesman). Because a sales manager is both a manager and a salesman, we design
    the class salesman derived from both class manager and salesman for this group
    of people.


    In the base class employee, aside from the constructor and destructor, the operations
    on information on all kinds of people could be defined uniformly, to regulate
    the basic behaviors in all the derived classes of the class. Since the salary
    calculation methods for different kinds of people, they cannot be defined uniformly
    in the base class employee. Therefore, we can set the function body of salary
    calculating in the base class as empty, and implement specific functionalities
    in the homonymous functions in different derived classes according to the hiding
    rule. The class design is shown in Figure 7.10.


    Since the two base classes of the class salesman have a common base class employee,
    we design the class employee as virtual to avoid ambiguity.'
