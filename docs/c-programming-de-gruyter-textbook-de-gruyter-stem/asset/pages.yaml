    # 4.5.1 Brief Introduction of UML


    UML language is a typical OO modeling language, rather than being a programming
    language. In UML, concepts are represented by symbols, and relations between concepts
    are represented by lines.


    OO modeling language can be traced back to the 1970s. In the 1980s, lots of OO
    programming languages came out, marking the maturity of the OO Method. In the
    mid-1990s, many OO analysis and design methods came out, which introduced various
    identifiers independent of languages. Among them, the Coad/Yourdon method was
    one of the earliest analysts who started OO technique. Booch was one of the earliest
    advocates of OO Method. He put forward the concept of OO software engineering,
    which is a good way to design and build systems. Rumbaugh, etc. presented an object-modeling
    technique (OMT) that uses the OO concept. The OOSE method introduced by Jacobson
    is suitable for supporting business engineering and demand analysis.


    Among various modeling languages, users can hardly distinguish the characteristics
    of different languages, so they cannot find a language that fits their application
    characteristics. Besides, although different languages are similar in many aspects,
    their representation forms vary a lot, which greatly hinders the communications
