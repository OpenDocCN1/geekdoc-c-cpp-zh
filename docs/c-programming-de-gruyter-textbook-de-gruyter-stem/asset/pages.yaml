- pgno: 39
  md: '# 1.5.1 Elementary Terms


    **Source program:** program written in source language and needing to be translated.
    It can be an assembler language or high-level programming language (such as C++).


    **Object program:** program translated from source program. It can be represented
    by machine instructions (thus it is also called ''object code''), assembly instructions,
    or other intermediate languages.


    **Translator:** program that translates a source program into its equivalent object
    program. To a translator, source program is the input and object program is the
    output. There are three kinds of translators: assembler, compiler, and interpreter.


    **Assembler:** assembler translates a source program written in assembly language
    into the object program formed by machine instructions. Thus, the source program
    written in assembly language should be processed by the assembler to turn into
    the equivalent object program.


    **Compiler:** translate a source program written in high-level programming language
    into the object program. If the object program consists of assembly instructions,
    it still needs to run the assembler to translate them into machine instructions.


    **Interpreter:** another translator that translates source program written in
    high-level programming language into machine instructions. Its difference from
    a compiler is that the interpreter executes programs during translation. That
    is, it reads a statement, translates it, and executes it. This action sequence
    is repeated until all statements have been translated and executed. An interpreter
    does not generate a whole object program. For some statements inside the loop
    body, the interpreter needs to translate and execute them many times. Therefore,
    compared with a compiler, it is slower in execution.


    # 1.5.2 The Development Process


    The process of developing a C++ program includes editing, compiling, linking,
    running, and debugging. In editing we put the source program into the computer
    and save the code as a .cpp file. Compiling converts the source program into machine
    instructions. However, the compiled program cannot be executed directly, and we
    need to link multiple target files together with some files in the library to
    create an executable file suffixed with .exe. In the end we also need to run and
    debug the program.


    When a compiler and a linker is linking, they will check the program and show
    all the errors in the screen. Errors found in the compiling stage are grammar
    errors and found in the linking stage are link errors. That is the development
    process of a C++ program.


    Figure 1.1 is the development process of a C++ program.'
