    # ### 10.1.6 Adapters


    Adapters provide new interfaces for existing classes and enable two classes to
    work cooperatively. There are three types of adapters in STL: adapters of containers,
    adapters of iterators, and adapters of function objects. Adapters are very powerful
    tools for code reuse. For example, STL uses adapters of containers to implement
    stacks, queues, and priority queues based on corresponding containers.


    # ### 10.1.7 Iterators


    Iterators can be seen as pointers in an object-oriented view. Iterators provide
    methods like current(), previous(), and next() to allow programmers to access
    the container via the iterators.


    # ### 10.1.8 Algorithms


    There are more than 70 algorithm implementations in STL, including sorting, eliminating,
    counting, comparing, transforming, and container managing, which covers a wide
    range of applications. The implementations are generic so that they can be applied
    to different objects and primitive types.


    # ### 10.1.9 Interfaces of Containers


    There are several common interfaces in the STL containers. These containers overload
    the comparison operator to perform comparison between containers (Table 10.1).
    There are also methods to access iterators (Table 10.2) and methods to access
    the status of the container (Table 10.3).'
