  md: "# 4.3.2 The Copy Constructor\n\nMany of us have used a copy machine: when we\
    \ need a copy of a file, we fetch white paper and use a copy machine to get a\
    \ copy exactly the same as the original. There are lots of examples of making\
    \ a copy in our real world. Since the object-oriented programming design aims\
    \ to faithfully reflect problems in the real world, C++ needs the ability of copying\
    \ an object.\n\nThere are two ways to generate a copy of an object. The first\
    \ one is to build a new object and set each data member of the new object to the\
    \ values from the old object. This method works but is a little fussy. Why don't\
    \ we make a class that has the ability of automatically copying an object of its?\
    \ That's what a copy constructor does.\n\nA copy constructor is a special constructor.\
    \ It has all the features of common constructors, while its formal parameter is\
    \ a reference to an object of the class. It is used to initialize a new object\
    \ of the same class by the existing object specified by the formal parameter.\n\
    \nProgrammers can define a specific copy constructor as needed, to achieve the\
    \ copying of data members of objects in the same class. If the programmer hasn't\
    \ defined a copy constructor for a class, the system will automatically generate\
    \ a default copy constructor when needed. This default copy copies the value of\
    \ every data member to the new object, or we can say it clones the old object\
    \ to get a new one. The new object and the old one have the same data members.\n\
    \nHere is the common way to define and implement a copy constructor:\n\n```\n\
    class class_name\n{\npublic:\n    class_name(parameters_list); //constructor\n\
    \    class_name(class_name &object_name); //copy constructor\n    ..\n}\nClass_name::class_name(class_name\
    \ &object_name);\n//implementation of copy constructor\n{ function body\n}\n```\n\
    \nLet's see an example of a copy constructor: locate a point on the screen according\
    \ to the coordinates x and y. Class Point is defined as follows:\n\n```\nclass\
    \ Point\n{\npublic:\n    Point(int xx=0, int yy=0) (X=xx;Y=yy;) //constructor\n\
    ```"
