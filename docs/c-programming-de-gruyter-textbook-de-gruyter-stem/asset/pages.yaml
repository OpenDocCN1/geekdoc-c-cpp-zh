    \ dimension. When the count of digit exceeds the upper bound, a carry is made\
    \ to the previous digit, and the current and lower digits recount from their respective\
    \ lower bounds. We can discover that the subscript of the first dimension varies\
    \ slowest, and the subscript of the last dimension varies quickest. It is noticeable\
    \ that for each dimension, the lower bound is 0 and the upper bound is the value\
