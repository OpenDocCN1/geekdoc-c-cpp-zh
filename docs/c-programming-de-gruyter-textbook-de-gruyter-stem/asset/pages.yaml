  md: '# 6.5.2 The string Class


    It is not convenient to use arrays to store strings and call system functions
    to process strings. Besides, the separation of data and functions processing the
    data doesn''t conform to the requirements of object-oriented methods. Therefore,
    the C++ standard library adds the concept of object-oriented string to C++, defining
    the string class, which provides necessary operations to process strings. The
    header file should be included when using the string class. The string class encapsulates
    attributes of strings and provides a series of functions to access these attributes.
    Data components of attributes or classes contain:


    +   - Sequence of characters

    - Size or length of the sequence of characters

    - Types of characters

    - Character traits

    - Size of a character

    - Allocator

    - Iterators (we will introduce them in detail in Chapter 10)


    The string class also has many functions related to string operations, including:


    +   - Search

    - Assign

    - Concatenate

    - Append


    Here we introduce the constructors, and several common member functions and operations
    of the string class briefly. For simplicity, function prototypes are simplified
    and different from the forms in the header file. For more detailed information,
    reader can refer to the online help of the compiling system.


