  md: '# 1.3 Object-oriented Software Development


    In the whole process of software development, programming is a relatively small
    part. The pacing factor of software development comes from raising problems in
    early stages but not resolving the problems in later stages. Once we recognize,
    understand, and express the essence of the problem correctly, we can design and
    program to solve it.


    The problems we want to solve in early days are so small, it is not very difficult
    to recognize the problem and solve it by programming. With the extension of the
    application fields of computers, the problems we want to solve more complex, and
    the scale and complexity of software systems increases to an unprecedented level.
    This leads to the situation that the complexity of the software and the bugs in
    it reach an extent that programmers cannot control, known as the "software crisis"
    in the 1960s, which speeds up the emergence and development of software engineering.


    To learn object-oriented programming we should first know the overall process
    of software development and maintenance. So, what is object-oriented software
    engineering? It is the application of the object-oriented method in the field
    of software engineering, including object-oriented analysis (OOA), object-oriented
    design (OOD), object-oriented programming (OOP), object-oriented test (OOT), and
    object-oriented software maintenance (OOSM), etc.


    # 1.3.1 Analysis


    By describing a problem, we can build a model of a real situation to illustrate
    the important features of the system. To understand the problem, system analysts
    should work with their clients. In the analysis stage, we should abstract what
    the system should do precisely, rather than about implementation.


    Object-oriented system analysis builds objects in a model directly with the objective
    existence in the problem domain. Thus, separate objects as well as their relationships
    can be preserved without any transformation or any combination that violates the
    original boundary, so as to reflect the objective existence effectively.


    # 1.3.2 Design


    The design stage aims at a concrete implementation of the system and uses the
    OO method. It includes two different jobs: one is to move the OOA model directly
    into OOD as its component; the other is to add some related work according to
    the factors of the concrete implementation, such as data storage, task management,
    and human-computer interface.'
