    # e) Shift


    In C++ there are two shift operators: the left shift operator (<<) and right shift
    operator (>>). Both of them are binary operators. The left operand of a shift
    operator is the number you want to perform the shift on, and the right operand
    gives the number of bits you to shift.


    Left shift shifts the binary value of an operand leftwards according to the designated
    number of bits. After the left shift, the vacated low bits will be filled with
    zero while the high bits that have been shifted will be discarded.


    Right shift shifts the binary value of a number backwards according to the designated
    number of bits. After the right shift, the operator will discard the low bits
    that have shifted out. If the number is an unsigned number, the operator will
    fill the vacated high bits with zero or the sign bit depending on different systems.
    In C++6.0, it fills the vacated bits with the sign bit.


    Look at two examples:


    +   1. If the value of a char-variable a is -8, then its complement code is 11111000.
    The value of expression a>>2 is -2. Figure 2.2 shows the process of this shift
    operation.

    2. The value of expression 2<<1 is 4. Figure 2.3 shows the process.


    Note that the result of a shift operation is the value of the expression (a>>2
    and 2<<1 in the above examples), while the value of the left operand of the shift
    operator (variable a and constant 2 in the above examples) will not change.


