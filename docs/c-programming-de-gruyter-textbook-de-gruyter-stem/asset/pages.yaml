  md: '# 5 Data Sharing and Protecting


    An important characteristic of C++ is that it is a language in which it is suitable
    to write large complex programs and enables data sharing and protection mechanisms.
    In this chapter we will introduce the concept of scope, visibility, and the lifetime
    of identifiers, as well as the sharing and protection mechanism of class members.
    At last we will introduce the multifile structure and compilation preprocessing
    directives, as is how we use several source files to organize large programs.


    # 5.1 Scope and Visibility of Identifiers


    Scope concerns the effective range of an identifier, while visibility concerns
    whether an identifier can be referenced. We know that a variable declared in a
    function can only be effective in this function, which is due to the restriction
    of the scope and visibility of variables. Scope and visibility are interrelated
    but different.


    # 5.1.1 Scope


    Scope is the region where an identifier is effective in the program body. The
    scopes of identifiers in C++ include function prototype scope, block scope (also
    termed local scope), class scope, and file scope.


    # Function Prototype Scope


    Function prototype scope is the smallest scope in a C++ program. In Chapter 3
    we introduced how there must be a type specification of formal parameters in the
    function prototype. Function prototype scope is the effective area of formal parameters
    during the declaration of function prototype. The following is an example of a
    declaration of a function.


    ```

    double Area(double radius);

    ```


    The effective area of identifier radius is between the two brackets of Area''s
    parameter list, and you cannot reference this identifier in other places of the
    program. Therefore, the scope of identifier radius is called the function prototype
    scope. Since formal parameter type is the only factor that works in the formal
    parameter list of a function prototype, omitting the identifier will not affect
    the compiling and running results. Considering the readability of the program,
    we usually give each formal parameter identifier while declaring a function prototype.'
