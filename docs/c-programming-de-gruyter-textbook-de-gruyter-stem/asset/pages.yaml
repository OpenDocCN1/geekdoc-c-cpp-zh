    # a) Implicit conversion


    Arithmetic operators, relational operators, logical operators, bitwise operators,
    and assignment operators are all binary operators, and the types of their two
    operands need to be the same. If the types of the operands involved in arithmetic
    operations or relational operations are not the same, the compiling system will
    convert them to a common type automatically (i.e., implicit conversion). The basic
    rule of conversion is to convert the lower data types into the higher data types.
    Here, a higher data type means greater data scope and higher precision. The order
    of basic data types (except for bool) is:


    ```

    char short int unsigned unsigned long float double low high

    ```


    Table 2.5 shows the rules of implicit conversion. This kind of conversion is safe
    because there is no loss of accuracy during the conversion.


    The type of operands involved in the logical operations must be bool. If operands
    are of other types, the compiling system will convert them into the bool type
    automatically. The method is: convert nonzero data to true and false.


    The operands of bitwise operations must be integers. If the operands of a bitwise
    operation are different types of integers, the compiling system will do implicit
    conversions according to the rules in Table 2.5.'
