- pgno: 25
  md: '# 1.3.3 Programming


    Programming is a very important stage in the OOA final implementation of object-oriented
    software development. Before the emergence of OOA and OOD theories, programmers
    should learn to understand the problem domain with the object-oriented method
    in order to write a good object-oriented program. Therefore, OOP is considered
    an advanced technique. Nowadays OOP is much easier, since the work of understanding
    the problem domain and designing system components have already been accomplished
    in the stage of OOA and OOD. The work left for OOP is to write down every component
    in the OOD model using an programming language.


    Nevertheless, we emphasize the basic thinking process of object-oriented programming
    design, rather than mastering the programming skills. So, even though this book
    is for beginners of programming, and mainly concerns the C++ programming language
    and object-oriented programming approach, we still take some space to introduce
    design methods through examples.


    # 1.3.4 Test


    The task for the test is to detect bugs in the software. Any software product
    should be strictly tested before being released. Continually using the concepts
    and principles of object-oriented in the test of OO software, and deem the class
    as the basic unit, can detect bugs more accurately and furthermore improve the
    test efficiency.


    # 1.3.5 Maintenance


    No matter how strict the tests are, the software may undergo, it may still have
    bugs. Therefore, maintenance is necessary in software development.


    In the software developed by the OO method, the problem domain is consistent with
    the program, and the presentations in every stage of the software engineering
    are consistent, so that it is easier for the maintainer to understand the software.
    Whether we discover a bug in the program or demands may change; tracing back to
    the program will not be very hard. Besides, impacts due to changes in other objects
    have been reduced because of the encapsulation of the object. Thus, software maintenance
    efficiency can be highly increased through the object-oriented method.


    As readers see, examples in this book are very simple, and they always come with
    clear descriptions of the problems encountered. Thus, it is not easy for the readers
    to understand the effect of software engineering. However, we still recommend
    designing the object before programming. This book is mainly for programming methods,
    yet we suggest that readers learn OO software engineering after you have mastered
    C++ programming language.'
