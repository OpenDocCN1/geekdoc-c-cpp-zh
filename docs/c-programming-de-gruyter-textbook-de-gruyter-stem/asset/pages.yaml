  md: "# 12.2 The Implementation of Exception Handling in C++\n\nception types specifies\
    \ the type of the exception handled by the clause. It is similar to formal parameters\
    \ of a function and it can be values of some types or references. The type can\
    \ be any valid data type, including classes of C++. When the exception is thrown,\
    \ the *catch* clause will be checked by one by. If the exception declaration of\
    \ a *catch* clause matches the exception type being thrown, this exception handler\
    \ will be executed. If the exception type declaration is an ellipsis (...), the\
    \ *catch* clause will handle exceptions of any type, and this handler must be\
    \ the last segment of a *try* block.\n\nThe execution process of exception handling\
    \ is as follows:\n\n+   1. Controls reaches the *try* statement following the\
    \ normal order, and executes protective segment in the *try* block.\n2. If there\
    \ is no exception in the execution of a protective segment, the *catch* clause\
    \ after the *try* block will not be executed. The program will continue from the\
    \ statements after the last *catch* clause of the *try* block.\n3. If there is\
    \ an exception thrown during the period of executing a protective segment or any\
    \ function (direct or indirect call), the system will create an exception object\
    \ using *throw* operation (which implies that a copy constructor may be contained).\
    \ At this point, the compiler will find a *catch* handler from a higher-level\
    \ execution context that can handle the exception (or a *catch* handler that can\
    \ handle exceptions of any type). The *catch* handler will be checked in the order\
    \ of appearance after the *try* block. If there isn't any proper handler, it will\
    \ continue to check the *try* block of the outer layer. This goes on until the\
    \ outermost *try* layer is checked.\n4. If no matched handler is found, the running\
    \ function *terminate* will be called automatically. The default function of *terminate*\
    \ is to call the *abort* terminator.\n5. If a matched *catch* handler is found,\
    \ it will be executed. Then the program jumps to statements after the last handler.\n\
    \n# Example 12.1: Handle Exception of Dividing by Zero.\n\n```\n//12_1.cpp\n#include<iostream>\n\
