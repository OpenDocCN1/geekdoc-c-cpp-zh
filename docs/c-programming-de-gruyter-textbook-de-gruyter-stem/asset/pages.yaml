  md: '# 1.4 Representation and Storage of information — 11


    Although computers internally use binary numeral system to encode information,
    the communication between computers and the outside world is still through forms
    that are human familiar and easy to read, as texts, pictures, and decimal data.
    The transformation between the two is completed by computer hardware and software.


    It is self-evident that there are some disadvantages in the binary numeral system
    such as its capacity. The binary numeral system requires more digits to encode
    a number than other numeral systems.


    # 1.4.2 Conversions among Numeral Systems


    +   1. R-based to Decimal


    We get the decimal value of an R-based number only by multiplying each digit of
    the number by its weight, calculating the sum of all products. For example:


    ```

    $111111111.11_2=1 \times 2^7 + 1 \times 2^6 + 1 \times 2^5 + 1 \times 2^4 + 1
    \times 2^3 + 1 \times 2^2 + 1\n+1 \times 2^1 + 1 \times 2^0 + 1 \times 2^{-1}
    + 1 \times 2^{-2}\n=(255.7)_{10}$

    ```


    ```

    $(3506.2)_8 = 3 \times 8^3 + 5 \times 8^2 + 0 \times 8^1 + 6 \times 8^0 + 2 \times
    8^{-1} = (1862.25)_{10}\n$(0.2A)_{16} = 2 \times 16^{-1} + 10 \times 16^{-2} =
    (0.1640625)_{10}$

    ```


    From the examples we know: when an R-based number is converted into a decimal
    number, we can convert its integral part and decimal part separately by starting
    the conversion from its decimal point both leftward and rightward. For the binary
    numeral system, we need to add the weights of 1-valued positions together, and
    the sum will be its equivalent decimal value. Therefore, binary-decimal conversion
    is the simplest and most widely used numeral system conversion.


    # 2. Decimal to R-based


    When we try to convert a decimal number into its equivalent R-based number, we
    can convert the integral part and decimal part separately and merge the two parts
    together.


    +   a) Decimal integer to R-based integer


    When a decimal integer is to be converted into an R-based integer, we can divide
    it by R continuously and the remainders are the corresponding coefficients of
    the digits of the R-based number. This method is called the “R divide method".


    We know that any decimal integer N can be represented by an R-based number:


    ```

    $N = X_0 + X_1R^1 + X_2R^2 + \dots + X_{n-1}R^{n-1}\n= X_0 + (X_1 + X_2R^1 + \dots
    + X_{n-1}R^{n-2})R\n= X_0 + Q_1R$

    ```'
