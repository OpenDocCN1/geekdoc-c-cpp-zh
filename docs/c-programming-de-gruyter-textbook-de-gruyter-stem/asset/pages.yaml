  md: '# 2 Elementary C++ Programming


    Expression 2 is the loop condition, so omitting it will cause a dead cycle.

    Expression 1 is often used to initialize the loop condition. It can also be an
    expression that is independent of the loop variable. If you omit expression 1
    or if it is independent of the loop condition, you must initialize the loop condition
    before the statement. See the following three program segments:


    Program segment 1


    ```

    for (i=1;i<=100;i++) sum=sum+i; //initialize the loop condition

    //in expression 1

    ```


    Program segment 2


    ```

    i=1; //initialize the loop condition before for statement

    for ( ; i<=100 ; i++) sum=sum+i; //omit expression 1

    ```


    Program segment 3


    ```

    i=1;//initialize the loop condition before for statement

    for (sum=0 ; i<=100; i++) sum=sum+i; //expression 1 is independent

    //of the loop condition

    ```


    Expression 1 and 3 can be simple expressions or comma expressions.

    For example:


    ```

    for (i=0, j=100; i<=j; i++, j--) k=i0;

    ```


    Expression 3 is often used to change the loop condition. If Expression 3 is omitted
    or independent of the loop condition, there should be other statements in the
    loop body that can change the loop condition to make sure that the cycle ends
    normally, as:


    ```

    for (sum=0,i=1; i<=100; ) //omit expression 3

    sum=sum+i;

    ni++; //change the loop condition in the loop body

    }

    ```


    If there only exists expression 2, and expression 1 and 3 are omitted, the for
    statement becomes the same as the while statement. For example, the program segments
    are the same:


    ```

    for ( i<=100;); while (i<=100)

    { sum=sum+i;

    i++;

    }

    ```


    A for statement is a highly functional loop statement, including all the functions
    of while statements. Besides giving the loop condition, it can also do initialization,
    increase the loop variable automatically, and so on. for statements can solve
    all loop problems in programming.'
