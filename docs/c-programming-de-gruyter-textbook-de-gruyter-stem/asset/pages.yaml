    \ inside function $fun()$, and is initialized by the value of $a$. Then variable\
    \ $c$ is declared inside the $if$ statement. Both $b$ and $c$ have block scopes,\
    \ though they belong to different block scopes. A block is a section of program\
    \ that is enclosed in a pair of brackets. In this example, the block itself is\
    \ a block; the branch body after the $if$ statement is a smaller block - an inclusive\
    \ relationship. Identifiers declared in a block have a scope starting from the\
    \ declaration and ending at the end of the block it is. Therefore, the scope of\
    \ variable $b$ is from its declaration to the end of the block it is (i.e., the\
    \ function body), and the scope of variable $c$ is from its declaration to the\
    \ end of the block it is (i.e., the branch body). **A variable that has a local\
    \ scope is also called a local variable.**\n\n# Class Scope\n\nA class can be\
