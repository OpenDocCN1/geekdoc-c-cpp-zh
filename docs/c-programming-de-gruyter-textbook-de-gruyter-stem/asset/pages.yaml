    # 1.4.3 Storage Units of Information


    All information in the computer is stored in the binary-encoded form. Here we
    introduce the data storage units:

    The data units we usually use are "bit", "byte", and "word".nBit: the smallest
    unit of measurement, representing a binary data.

    Byte: a byte consists of 8 bits, which is the conventional elementary unit of
    information storage.


    Usually, memory capacity is represented by the number of bytes. Common units include:

    kilobytes 1 K = 1024 byte

    M bytes 1 M = 1024 K

    G bytes 1 G = 1024 M


    Word: a word is the combination of bits and is used as an independent data unit.
    A word is also called a "computer word", and its exact meaning depends on machine
    types, word length, and user requirements. Common word lengths can be 8 bits,
    16 bits, or 32 bits.

    A data unit is used to describe the computer''s internal data form, i.e., the
    data arrangement inside the computer. For example, single-byte data and variable-length
    data (data forms of different length in bytes), etc. are kinds of data units.

    Machine word length is another hardware-related data unit. Machine word length
    usually refers to the number of binary bits those registers are involved in arithmetic.
    It represents the precision of a machine and can be 32 bits, 64 bits, etc.


    # 1.4.4 Binary-coded Representation


    The representation of a number in a machine is called the "machine number" and
    its value is called the "true value" of the machine number.'
