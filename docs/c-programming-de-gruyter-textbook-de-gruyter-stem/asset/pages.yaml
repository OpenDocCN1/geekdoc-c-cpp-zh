  md: '# 9.2.3 Sequential Access Collection – Linked List


    A linked list is another linear collection and it is used as an example of a sequential
    access collection. A linked list consists of a number of nodes, which are generated
    at runtime. There are two fields in each node: a payload and a pointer to the
    next node. If a node has one field pointing to the next node, the list is called
    a single linked list. If a node has two fields connecting to other nodes, one
    pointing to its previous node and the other pointing to its next node, then the
    list is called a double linked list. Figure 9.13 is an example of a single linked
    list.


    # 1. Node Class


    The node, the basic component of a linked list, consists of a data member and
    a pointer pointing to the next node. It should also contain methods to initialize
    the node, to remove the node, or to add a new node into the list. Figure 9.14
    and Figure 9.15 show the procedure of adding and removing nodes. Example 9.5 is
    the node template class.


