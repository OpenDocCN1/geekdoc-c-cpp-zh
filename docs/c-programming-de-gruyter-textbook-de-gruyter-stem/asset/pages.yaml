    # 10.5 Function Objects


    Many algorithms use a function object to abstract the operation of the algorithm,
    in order to provide additional flexibility. In this section, we introduce the
    design and usage of function objects in STL.


    # 1. Function Objects


    A function object is a design pattern used in STL for maximal flexibility. Function
    objects are an abstraction layer to hide the implementation detail. They behave
    like functions; they can return a value or perform some operations with side effects
    (like opening a file). In C++, all functions and any classes overloading the operator
    () can be used as function objects.


    We use the numerical algorithm accumulate() as an example to discuss the design
    and usage of function objects. There are two prototypes of accumulate(): one uses
    the add operator "+" to calculate the sum of the sequence, the other uses a customized
    function object to calculate the result.


    Here is an example of using a function as a function object to implement a multiplication
    operation:


