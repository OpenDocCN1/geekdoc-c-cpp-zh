    \ of the second row of the matrix. A two-dimensional array is stored by rows in\
    \ memory. That is, the first row is stored first, and then the second, and so\
    \ on. The elements of each row are stored according to their column subscripts.\
    \ This storage method is also called row-major storage. The storage order of the\
    \ two-dimensional array M in memory is demonstrated in Figure 6.2.\n\nFor an n-dimensional\
    \ array, we use a similar method to order the array elements. We view the subscripts\
