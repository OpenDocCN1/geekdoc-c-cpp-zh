- pgno: 21
  md: '# 4 1 Introduction


    Along with the rapid development of hardware systems, computers have become more
    powerful and widely used, not only limited to mathematic computations. Because
    of the increasing complexity of the programs we want to solve, the structured
    design method that emerged in the 1960s provided an effective way for procedure-oriented
    programming to solve complex problems. As a result, from the 1970s to the 1980s,
    programming was adopted by programmers in every field of software design. The
    main idea of structured programming is top-down and stepwise refinement. Its program
    structure is divided into several basic modules by different functionalities,
    and these modules form a tree structure. The relationships among the modules are
    kept as simple as possible. Each module consists of three basic structures – sequential
    structure, branch structure, and loop structure. The concrete way to realize modularization
    is to subroutines. Due to the use of modular decomposition, function abstraction,
    and top-down and stepwise refinement, structured programming can effectively decompose
    a complex program into several subtasks that are easier to control and handle,
    so as to facilitate development and maintenance.


    Whatever advantages structured programming may have, it is still a kind of procedure-oriented
    design method, which separates data and its operations. When a data structure
    changes, all relevant processing procedures need modifications. Any new method
    for an old problem may incur extra costs, making the program hard to reuse. Besides,
    due to the use of GUI (Graphical User Interface), software has become easier to
    use while being liberated. Good software should be responsive to any user operation,
    rather than ask its users to follow some specific steps. For example, we are all
    familiar with the word processor. A good word processor should be able to be used
    easily and at liberty, and fixed operation orders should never appear in a software
    specification. Therefore, it is very difficult to use procedures to describe and
    implement the functions of software. If we continue to take the procedure-oriented
    method, both development and maintenance will be


    Then, what is object-oriented? First, it puts the data and its operation as an
    interdependent and inseparable whole, which is called an Object. It abstracts
    common characters from objects of the same class and groups objects into a class.
    Most of the data in a class can only be processed by the methods of this class.
    A class communicates with the outside world through a simple external interface,
    while objects communicate with messages. Through this way, the relationships among
    program modules become much simpler, and the independence of modules and data
    safety can be better guaranteed. Besides, inheritance and polymorphism, which
    will be introduced in the following chapters, may further improve code reusability
    and facilitate the development and maintenance of software.


    There are many advantages in the object-oriented method, and yet one may wonder
    whether it is easy for beginners to understand and master. The answer is yes.'
