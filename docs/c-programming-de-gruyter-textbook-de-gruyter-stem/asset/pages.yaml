  md: '# 4 Class and Object


    Everything in the real world we are familiar with is an object. Objects can not
    only be visible, as houses, cars, airplanes, animals and plants, but also be invisible,
    as a plan. Objects can be a simple unit, like a person; and they can also be a
    combination of several objects; for example, there are multiple departments in
    a company, and each department has staff members. A class can be formed based
    on common attributes abstracted from similar objects. These are the concepts and
    methods we are familiar with the real world. The aim of programming is to describe
    and solve problems in the real world, the first step is to describe objects and
    classes faithfully in programs. C++, an object-oriented programming language,
    supports this kind of abstraction. A class in C++ is formed by the encapsulation
    of abstracted data and functions.


    In this chapter, we will first introduce the main features of object-oriented
    design: abstraction, encapsulation, and polymorphism. We then focus on the core
    concept of object-oriented design – class, which includes how to define and implement
    a class, and how to use classes to solve problems.


