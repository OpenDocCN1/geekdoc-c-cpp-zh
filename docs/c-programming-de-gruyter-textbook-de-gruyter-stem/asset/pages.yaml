    # 4.5.2 UML Class Diagrams


    A class diagram is a diagram that is composed of class and related static relationships.
    A class diagram shows the static structure of a software model, the inner structure
    of the class, and the relationships between this class and other classes. UML
    also defines an object diagram, and a static object diagram is an instance of
    a specific object diagram, which shows an instance of a specific state of a real
    software system. Class diagrams can contain objects, and a class diagram containing
    only objects without any class is an object diagram. We can consider object diagrams
    as a specific instance of class diagrams. The use of object diagrams is very limited,
    so in versions above UML5 it is explicitly pointed out that tools software is
    not required to implement this kind of diagram.


    Using class diagrams, we describe all the OO concepts introduced in this book,
    such as class, template class, and the relationships among them. Class diagram
    is composed of diagram symbols that describe a class or object, and diagram symbols
    describe their relationships. We now detail diagram symbols.


