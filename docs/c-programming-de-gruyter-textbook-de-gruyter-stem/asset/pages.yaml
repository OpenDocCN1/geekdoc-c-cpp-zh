- pgno: 436
  md: "the iterator is a common design pattern for bridging algorithms and containers.\
    \ Real algorithms need to traverse a linear collection, traversing a linked list\
    \ through a pointer or traversing an array subscripts. It is good to use an algorithm\
    \ that works for linear collections, so that you do not have to implement an algorithm\
    \ many times for every type of linear collections. Therefore, the algorithm needs\
    \ an abstraction layer to handle things “get me the next element”, or “is it the\
    \ end?”. In theory, pointers can handle this issue, but make the implementation\
    \ of algorithms and containers more complicated. For an object-oriented pointer,\
    \ an iterator is included in STL to enable writing abstract algorithms that works\
    \ on all containers.\n\n# 10.3.1 Types of Iterators\n\nThere are five basic types\
    \ of iterators: the input iterator, output iterator, forward iterator, bidirectional\
    \ iterator, and random access iterator. There are two iterator adapters: the reverse\
    \ iterator adapter and insert iterator adapter.\n\n# 1. Categories\n\nAn input\
    \ iterator can read data from a collection and an output iterator can write data\
    \ to a collection.\n\nA forward iterator is both an input iterator and output\
    \ iterator, and it can traverse through the collection in a certain direction.\
    \ A bidirectional iterator can traverse the collection in both directions. A random\
    \ access iterator can access any position in a collection.\n\n# 2. Iterator Adapters\n\
    \nAn iterator adapter is an adapter that extends or adjusts the functions of an\
    \ iterator. There are two types of iterator adapters: \n\n+   - The reverse iterator\
    \ adapter reverses the functionalities of the increment order and decrement operator,\
    \ so that the algorithm processes the elements in a reversed order. All standard\
    \ containers can be used with reverse iterators.\n- The insert iterator overloads\
    \ the assignment operator and turns it into inserters, so algorithms running on\
    \ its elements into the collections rather than overwriting the value of the elements.\
    \ There are three types of insert adapters: back inserters, front inserters, and\
    \ general inserters. Back inserters append an element to the end of a collection,\
    \ and front inserters add an element at the head of a collection. General inserters\
    \ decide the insertion position based on its parameters. Vectors, deques, links,\
    \ and strings support back inserters, while deques supports front inserters, and\
    \ all standard collections support general inserters.\n\nHere is an example of\
    \ an iterator adapter."
