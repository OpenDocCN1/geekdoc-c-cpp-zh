  md: '# 10.1 Generic Programming — 403


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_420_0.png)


    Fig. 10.2: UML graph of packages.


    There is a special anonymous namespace that can be used directly. Most examples
    in this book do not declare anonymous namespace explicitly, so the identifiers
    in these examples are in the scope of the default anonymous namespace.


    Programmer can write the "using" statement to avoid writing the lengthy prefixes
    of the identifiers. For example, if programmer writes the following statement
    in the code:


    ```

    using NS::File;

    ```


    then all references of File in the current scope NS::File.

    However, if the programmer writes the following statement:


    ```

    using namespace NS;

    ```


    then the program can use all identifiers in the name scope of NS without any prefixes.

    The standard library in C++ is in the namespace "std". Programmers can refer to
    identifiers in the standard library directly with the "std::" prefix, e.g., "std::cout",
    or use the "using" statement to enable the program to use these identifiers directly.


    Namespaces are represented in a package graph in UML. A package contains classes
    and other elements, whose identifiers must be unique. All elements in the package
    are destroyed if the package is destroyed.


    Packages are represented by folders in the UML graph. The inner classes of the
    package can be hidden by writing the package name in the middle of the folder.
    To show the details of the package, the package name should be written at the
    label part of the folder. Figure 10.2 shows how to represent a package in these
    two ways.


    The dependencies between packages represent the references among objects in different
    namespaces. A package dependency describes a package with the privilege of accessing
    all public interfaces in another package. For example, objects in package P2 are
    able to access class C in P1 if C is in the public interface. The relationship
    between P2 and C is an access dependency, as shown in Figure 10.3.


    Import dependency represents merging the public interfaces between two packages.
    For example, if there is an import dependency between P1 and P2, then P2 can use
    class C directly, i.e., adding "namespace P1" in P2''s codes.'
