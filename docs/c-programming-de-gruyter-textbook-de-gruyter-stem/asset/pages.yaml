  md: "# 9.1 Function Templates and Class Templates 353\n\nThe definition of function\
    \ templates begins with the keyword parameter list embraced by angular brackets.\
    \ Each parameter (e.g., T in the above example) specifies a data type with a leading\
    \ keyword, class or typename. The parameter can be referred to the type of function\
    \ formal parameter, the type of return value, or the type of local variable. The\
    \ body of a function template is similar to an ordinary function. The following\
    \ is an example that calculates absolute value:\n\nThe compiler infers the types\
    \ of parameters in the template when it finds an invocation of abs(). For example,\
    \ the compiler infers the type T as int when it tries to compile the expression\
    \ abs(n), in which n is an int variable.\n\nThe compiler instantiates the template\
    \ after determining the types of parameters in the template and generates a new\
    \ function:\n\n```\nint abs(int x)\n{\n  return x<0?-x:x;\n}\n```\n\nSimilarly,\
    \ the compiler infers T as double when it tries to compile abs(d), in which d\
    \ is a double variable. Then it generates the following function based on the\
    \ template:\n\n```\ndouble abs(double x)\n{\n  return x<0?-x:x;\n}\n```\n\nTherefore,\
    \ the main function actually calls the following function when the function abs(n)\
    \ is executed\n\n```\nint abs(int x)\n```\n\nand the main function calls the function\n\
    \n```\ndouble abs(double x)\n```\n\nwhen the function abs(d) is executed."
