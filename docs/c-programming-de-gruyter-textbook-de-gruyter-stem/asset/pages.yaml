    in the ordered interval (first, last) using binary search, return the first insertable
    |

    | binary_search | Find the elements that have a value equal to the specified value
    in the ordered interval using binary search |

    | equal_range | Find the elements that have a value equal to the specified value
    in the ordered interval using binary search, return the result interval |

    | merge | Merge two ordered intervals and put the result into an interval that
    is not overlapped with the two inputted intervals |

    | inplace_merge | Merge two ordered intervals, replace the original interval with
    the result |

    | min | Return the minimum element |

    | max | Return the maximum element |

    | min_element | Return the position of minimum element |

    | max_element | Return the position of maximum element |

    | lexicographical_compare | Compare two intervals in lexicographical way |

    | next_permutation | Get the next permutation of the interval in lexicographical
    way |

    | prev_permutation | Get the previous permutation of the interval in lexicographical
    way |

    | includes | Check whether the elements of an interval are included in another
    |

    | set_union | Return the union set of two sets using intervals. The set contains
    either the first set or the second set |

    | set_difference | Return the difference of two sets using intervals. The elements
    in the result belong to the first set but do not belong to the second set |

    | set_intersection | Return the intersection of two sets using intervals. The
    elements in the result belong to the first set and the second set |

    | set_symmetric_difference | Return the symmetric difference of two sets using
    intervals. The elements in the result belong to one of two inputted sets but not
    both in the interval |

    | make_heap | Reorder elements in the interval, made it a heap |

    | pop_heap | Assume the interval is a heap, return the top of it |

    | push_heap | Assume the interval is a heap, insert an element into it |

    | sort_heap | Assume the interval is a heap, sort the elements in it |'
