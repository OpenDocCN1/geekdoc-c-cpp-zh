    # 7.4.2 Copy Constructor


    How does write copy constructor when there is an inheritance? For any class, if
    the programmer does not write a copy constructor, the compiler will generate a
    default copy constructor when necessary. If the default copy constructor is called
    when creating an object of a derived class, then the compiler will automatically
    call the copy constructor of the base class.


    If we want to write a copy constructor for the derived class ourselves, we need
    to pass arguments to the copy constructor of the base class. For example, suppose
    class C is a derived class from class B. The copy constructor of class C is as
    follows:


    ```

    C::C(C &c1):B(c1)

    {...}

    ```


    Readers might get confused by the fact that the argument type of class B''s copy
    constructor should be the reference of class B''s objects, but here the reference
    cl of class C''s objects is used as the argument of class B''s copy constructor.
    This is because of the type compatible rule: we can use the reference of the derived
    class to initialize the reference of the base class. So when the formal argument
    is a reference of the base class, the actual argument is a reference of the derived
    class.


    # 7.4.3 Destructor


    The destructor of a derived class is used to do necessary cleanup work before
    an object of the derived class disappears. Destructor has neither type nor arguments.
    So it is simpler than the constructor.'
