    to solve linear equations and a personnel management system, are presented as
    a review and conclusion of the chapter.


    Inheritance is to obtain features from one''s ancestor. Inheritance refers to
    when a new class inherits characteristics from an existing class. Class derivation
    is the process of creating a new class from an existing class. A derived class
    can also serve as a base class to derive new classes, which form a class hierarchy.
    Class derivation is a process of evolution and development, i.e., through extension,
    modification, and specification to create a new class from an existing class.
    Class derivation creates a class family with common characteristics, to realize
    code reuse. The inheritance and derivation mechanism greatly facilitates the development
    and improvement of existing programs.


    In class hierarchy, the top layer represents the most abstract and common concept.
    A lower layer gets the characteristics of its upper layer, having its own characteristics.
    In the class hierarchy, it is a specialization process from top to bottom and
    an abstraction process from bottom to top.


    A new class can be derived in three steps: accepting base-class members, modifying
    base-class members, and adding new members. In C++ inheritance, a derived class
    inherits all the members of its base classes except for the constructor and destructor.
    Modifications to base-class members concern two issues. The first one is the access
    control of base-class members, which depends on the inheritance mode specified
    in the definition of the derived class. The other is the overriding of the data
    and function members of the base class. Adding new members to a derived class
    is the key to the inheritance and derivation mechanism, and it is crucial for
    the development of functionalities in derived classes. We can add appropriate
    data and function members to the derived class cannot be inherited, so we should
    add a new constructor and destructor to the derived class to do proper initialization
    and cleanup.


    After discussing the derivation process, we focus on the issues of identification
    and access of members (including members inherited from the base class and new
    members) of a derived class and its object. There are two problems to be solved
    in an accessing process. The first one is regarding unique identification and
    the other is regarding the access attributes, i.e., the visibility, of a class
    member. We introduce several methods, including the hiding rule, scope qualifier,
    and virtual base class, to solve these unique identification problems.'
