  md: '# 12 Exception Handling


    The exception handling facility of C++ does not put the triggering (or throwing)
    and handling of exceptions in the same function, so that lower-level functions
    can focus on solving specific problems rather than dealing with exception handling
    unnecessarily. Higher-level callers can handle different exceptions at the right
    level.


    # 12.2 The Implementation of Exception Handling in C++


    C++ provides internal support for handling exceptions. The try, throw, and catch
    functions are the mechanism used for implementing exception handling. With C++
    exception handling, the program can pass unexpected events to a higher-level context
    that can better recover from these unexpected events. The following shows the
    proper syntax of exception handling functions.


    # 12.2.1 The Syntax of Exception Handling


    The syntax of the throw function is shown as follows:


    ```

    throw expression

    ```


    try block syntax:


    ```

    try

    compound statement

    catch (exception type declaration)

    compound statement

    catch (exception type declaration)

    compound statement

    ...

    ```


    If a program finds an exception that it cannot handle, it can use the throw expression
    to ''throw'' to its caller. The operands of throw are used to express exception
    type in a similar way to the operands of the return statement. If a program needs
    to throw an exception more than once, it should use different types of operands
    to differentiate different errors, and values of operands cannot be used to differentiate
    distinct exceptions.


    The compound statement after the try clause is a protective segment of the code.
    If a program or a function is expected to encounter exceptions, we should put
    it after a try clause. If an exception occurs during the running of a program
    or a function, the throw expression will throw this exception to a handler.


    The compound statement after the catch clause is the exception handler, which
    can "catch" exceptions thrown by the throw expression. The declaration part of'
