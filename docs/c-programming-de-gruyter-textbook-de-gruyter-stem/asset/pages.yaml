  md: '# 6.1.1 Declaration and Use of Arrays


    # 1. Declaration of Arrays


    An array is a user-defined data type, and needs to be declared before being used.
    The declaration of an array should consist of the following parts:


    +   a) Define the array''s name;

    b) Define the types of its elements;

    c) Define the structure of the array (such as the dimension of the array, the
    size of each dimension, and so on)


    The common form for declaring an array is as follows,


    ```

    Data type Identifier[Constant expression 1]

    [ Constant expression 1]...;

    ```


    The type of elements in an array is specified by "Data type". This data type can
    be either basic types such as int, float, or user-defined types such as structure
    and class.

    The array name is specified as the "Identifier". **The array name is a constant,
    which represents the starting address of array elements in memory.**


    Expressions like "Constant Expression 1", "Constant Expression 2", etc. are called
    subscript expressions. They must be of the unsigned int type. The subscripts of
    an array are used to limit the number of elements in an array, and also to specify
    the order and position of each element in the array. In C, a n-dimensional array,
    whose elements is actually an (n-1)-dimensional array. Thus, in C n-dimensional
    array is declared as the array name plus subscript expressions, where the value
    of each subscript expression denotes the size of each dimension (note that this
    is not the upper bound of the subscript in that dimension). The number of array
    elements can be calculated by multiplying the values of all subscript expressions
    from the array declaration. For example,


    ```

    int b[10];

    ```


    indicates that b is an array of the int type, and it has 10 elements: b[0]...b[9].
    It can be used to store an integer array of 10 elements.


    ```

    int a[5][3];

    ```


    indicates that a is a two-dimensional array of the int type. The size of its first
    dimension is 5 (subscripts from 0 to 4), and the size of its second dimension
    is 3 (subscripts from 0 to 2). Thus the total number of a''s elements is 15. It
    can be used to store a table of int type, which has five rows and three columns.
    It is worth noting that the value of array subscripts is 0. For the array a declared
    above, the first element is a[0][0], and the last element is a[4][2]. In other
    words, the subscript of every dimension starts from 0.'
