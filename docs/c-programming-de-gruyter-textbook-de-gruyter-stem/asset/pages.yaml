    # 5.5.3 Class Members Modified by const


    # 1. Constant Member Function


    Functions modified by keyword const are called constant member functions, and
    their declaration format is as follows:


    ```

    Type identifier function name (parameter list) const;

    ```


    Notes:


    +   a) const is a part of the function type, so the definition of the function
    should also have the keyword const.

    b) A constant member function cannot update the data members of object, and it
    cannot call member functions without the const modification in this class. (This
    ensures that the values of data members will not change in the constant member
    function.)nc) If you declare an object constant, then it can only call its constant
    member function, and cannot call other member functions. (This is the mechanism
    of constant objects from a grammatical point of view in C++, and constant member
    functions are the only external interfaces of constant.))

    d) The keyword const can be used to differentiate overloading functions. For example,
    if you declare like in this class:


