    ```


    As all containers in STL, vectors accommodate the object-oriented mechanism for\memory
    management. All memory used by the vector itself, and the memory used by\lements
    in the vector, are reclaimed by calling their destructors appropriately when

    the instance is out of scope.


    One thing to notice is that removing an element from a vector just removes the\lement
    from the vector. It only calls its destructor but does not reclaim the memory\used
    by the element.


