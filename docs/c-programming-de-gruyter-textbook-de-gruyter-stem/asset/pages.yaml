    \ of class encapsulation is to limit the scope of data.\n\n$Access$ through the\
    \ expression $x.M$ or $x::M$, which is the most basic method to access object\
    \ members in a program.\n\n**Access $M$ through the expression $prt->M$, where\
    \ $prt$ is a pointer that points to an object of class $X$.** More details about\
    \ pointers are in Chapter 6.\n\nOther access methods and the scope rules of classes\
    \ and their objects in C++ will be discussed in the following chapters.\n\n# File\
