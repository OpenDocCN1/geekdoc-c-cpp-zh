  md: '# 2.5 User-Defined Data Type


    C++ not only has abundant basic data types, but also allows users to define data
    types themselves. User-defined data types include: the enumeration type, stru-
    cure type, union type, array type, class type, and so on. We will introduce theadena-
    tion type, structure type, and union type in this section, and the rest will be
    introduced in the following chapters.


    # 2.5.1 typedef Declaration


    When writing a program, besides built-in data type names and user-defined data
    type names, we can create new names for a known data type. In this way, we can
    give a known type name based on different applications, to improve the readability
    of the program. Also, creating a shorter name for an existing long name can make
    the program more concise. typedef is used to declare an identifier as another
    name of a data type, and the identifier can be used as the data type name.


    The syntax form of typedef declaration is:


    ```

    typedef known type name list of new type names;

    ```


    There can be several identifiers in the name list of new type names, which are
    separated by commas. In this way, we can give several names to a known data type
    in one typedef statement.


    For example:


    ```

    typedef double area,volume;

    typed int natural;

    atural i1,i2;

    area a;

    volume v;

    ```


    # 2.5.2 Enumeration Type – enum


    Readers must have experienced this kind of situation when solving problems: win,
    lose, tie, and cancel are the only results of a game; there are only red, yellow,
    blue, white, and black balls in a bag; there are only seven days in one week,
    etc. The data variables above all have limited possible values. However, validity
    checks on data values would become troublesome. For example, if we use integers
    from 0 to 6 to represent the days in one week, then if the variable value is 8,
    it is invalid. Enumeration type in C++ is designed to solve this problem.'
