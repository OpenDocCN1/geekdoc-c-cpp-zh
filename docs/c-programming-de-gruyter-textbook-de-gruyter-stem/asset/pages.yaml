    # 8.5 Program Instance: Variable Stepwise Trapezoid Method to Calculate Functional
    Definite Integral


    In many applications, definite integrals are evaluated by using numerical approximation
    methods. The reason is that many functions only have values at discrete points
    or the integrand cannot be represented by fundamental functions. In this example,
    we will introduce a basic stepwise size trapezoid method to calculate a functional
    definite integral.


    # 8.5.1 Basic Principle


    We only consider the simplest situation. Suppose the integrand is a function of
    one variable. And the expression of definite integral is:


    > $I = \int_{a}^{b} f(x)dx \quad (8.1)$


    The meaning of the integral is the area under the graph of the function $f(x)$
    over the interval between $a$ and $b$ as shown in Figure 8.5.

    If the integral is integrable for any integer $n$, let $h = (b - a)/n$ and


    ```

    $X_k = a + k \times h$

    I_k = \int_{X_{k-1}}^{X_k} f(x)dx$

    ```'
