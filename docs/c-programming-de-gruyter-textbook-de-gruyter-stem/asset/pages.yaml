- pgno: 23
  md: '# 6 1 Introduction


    # 3. Encapsulation


    Encapsulation is an important principle in the OO method. It means assembling
    the attributes and services of an object into an independent unit and concealing
    the internal details of the object as much as possible. Here encapsulation has
    two meanings. The first meaning is assembling all the attributes and services
    of an object into an inseparable entity; the second meaning, also called "information
    hide", is creating a boundary (or barrier) to hide internal details and making
    the object interact with the world only through limited external interfaces.


    # 4. Inheritance


    Inheritance is one of the most important factors that make the OO method improve
    software development efficiency. If objects of a particular class possess all
    attributes and services of its common class, we call this an inheritance of a
    particular class from the common class.


    The practical significance of inheritance is that it simplifies people''s understandings
    and descriptions of objective things. For example, we know all the features of
    "ship", we consider "passenger ship" and know that it is a kind of "ship". We
    may conclude that "passenger ship" has all the features of "ship", so we only
    need to focus on those features specialized in "passenger ship".


    Inheritance has significant importance for software reuse. A particular class
    inheriting a common class is in itself a kind of software reuse. If, we add a
    developed class in the component library as a component, we can directly use it
    or inherit it when it trying to develop a new system.


    # 5. Polymorphism


    Polymorphism refers to how the attributes or behaviors defined in a common class
    can have different data types or behaviors after they are inherited by a particular
    class. This makes the same attribute or behavior possess different semantics in
    the common class and in various particular classes.


    For example, we can define a common class of the "geometric figure". The class
    has a behavior of "draw" with no specific meaning, that is, we do not know how
    to draw in execution (because we don''t know what the figure is). Next, we can
    define some particular classes of "geometric figure", such as "ellipse" or "polygon".
    Both of them inherit the common class "geometric figure", they are within the
    behavior of "draw". Thereafter, we can redefine "draw" according to the particular
    class and make it possible to draw ellipse and polygon accordingly. Furthermore,
    we can define a particular class "rectangle" that inherits from "polygon" and
    implements the function of drawing a rectangle in "draw". That is what polymorphism
    is in the OO method.'
