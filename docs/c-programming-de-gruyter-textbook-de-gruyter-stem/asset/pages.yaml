  md: "# 10.4 Algorithms in STL\n\nof the algorithm. Details of the implementation,\
    \ like how to load/store data from/to containers are hidden in the implementation\
    \ of iterators. The design splits functionalities into different components that\
    \ are joined via a function template. Programmers are free to change any part\
    \ of the whole to implement new functionalities, as working on a different type\
    \ of container. That is the goal of generic programming.\n\nThere are four types\
    \ of STL algorithms: Nonmutating Sequence Algorithms, Mutating Sequence Algorithms,\
    \ sorting algorithms, and numerical algorithms. They cover a wide range of applications.\
    \ This chapter focuses on the usage of these algorithms. The design and implementation\
    \ of these algorithms are out of the scope of this chapter; please refer to advanced\
    \ materials for more information.\n\n# 10.4.1 Using the Algorithms\n\nWe have\
    \ used the copy algorithm in Section 10.3; here is the prototype of it:\n\n```\n\
    template <typename InputIterator, typename OutputIterator>\nOutputIterator copy(InputIterator\
    \ first, InputIterator last,\n    OutputIterator result);\n```\n\nThe algorithm\
    \ copies all elements in range [first, last) to [result, result + (last - first)],\
    \ and returns result + (last - first).\n\nHere is the code from Example 10.7:\n\
    \n```\nostream_iterator <int> output(cout, \" \");\nn    //create an output stream\
    \ iterator\n\ncout << \"List contains: \";\ncopy(col.begin(), col.end(), output);\
    \ //print elements in col\n```\n\nLine 1 initializes an output stream iterator\
    \ and transfers all elements in col to the output iterator, which outputs the\
    \ data to the console. Col.begin() and Col.end() points to the first and the last\
    \ element of col respectively.\n\nMany algorithms take function objects as input\
    \ parameter for customizing the behaviors of the algorithms. There are two prototypes\
    \ of the sort algorithm:\n\n```\ntemplate <typename RandomAccessIterator>\nvoid\
    \ sort(RandomAccessIterator first, RandomAccessIterator last);\ntemplate <typename\
    \ RandomAccessIterator, typename Compare>\nvoid sort(RandomAccessIterator first,\
    \ RandomAccessIterator last,\n    Compare comp);\n```\n\nThe first prototype uses\
    \ the < operator for comparison, so the result is in ascending order. The second\
    \ prototype compares the elements with the function object comp, so that programmers\
    \ can write their own rules for sorting, making the implementation flexible."
