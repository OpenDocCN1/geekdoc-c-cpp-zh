    # 6.7 Summary


    This chapter introduces the method of organizing data by arrays and by pointers
    in C++. Arrays are the most common form of data organization. They are a set of
    several variables with certain ordinal relations. The variables that compose the
    array are called elements. All elements of the same array have the same data type.
    The data type can be basic types, objects, or user-defined data types such as
    structure, class, and so on. If the data type of an array is a class, each element
    of the array is an object of this class, and we can call it an object array. The
    initialization of an object array is to call the constructor of the class repeatedly
    for every element. We can assign initial values to array elements, the system
    will call the corresponding constructors with formal parameters. If we don''t
    assign initial values, the system will call default constructors in the initialization
    of the array. Similarly, when array elements must be deleted, the system will
    call the destructor of the class.


    A pointer is also a data type, and pointer-type variables are called pointer variables.
    Pointer variables are used to store addresses. Therefore, pointers provide a method
    of operating addresses directly.


    Pointers can point to common variables, objects, and functions (including normal
    functions and member functions of objects). The process of using pointers consists
    of three steps – declaration, assignment, and reference. The initial value of
    the pointer is very important, so we must assign it and make it to an existing
    data or function address before the pointer is used; otherwise, serious problems
    may occur in the runtime. The pointer is a difficult point in C++. We can organize
    and represent complex data structures flexibly and effectively by pointers.


    This chapter also introduces dynamic memory allocation, which can manage memory
    dynamically.


    Finally, using strings as examples, we explain the usage of a special kind of
    array — character array, and introduce some character processing functions and
    the string class provided by C++.'
