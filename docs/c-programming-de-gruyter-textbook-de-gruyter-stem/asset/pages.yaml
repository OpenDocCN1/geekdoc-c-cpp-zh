    to reuse codes, improve the development efficiency and the reliability of the
    program, and facilitate the collaboration and modification of the program. But
    function calls can also reduce the execution efficiency of programs. When a call
    is made, the computer needs to save the execution scene and return address before
    jumping to the entry address of the called function and starting execution; when
