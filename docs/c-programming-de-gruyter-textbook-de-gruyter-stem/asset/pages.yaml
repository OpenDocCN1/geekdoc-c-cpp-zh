    # 2.4.3 Loop Structure


    There are three kinds of loop control structures in C++:


    # 1. while statement


    Syntax form:


    ```

    while (expression) statement

    ```


    Execution order: first evaluate the expression (loop condition); if it is true,
    execute the loop body (statement) and re-evaluate the expression; continue the
    cycle until expression becomes false. When using statement, generally there should
    be statements in the loop body that can change the value of expression, i.e.,
    the loop condition, otherwise it will be an infinite loop (dead loop).


    Figure 2.7 is the flow chart of a while statement.


    When using while statement, generally there should be statements in the loop body
