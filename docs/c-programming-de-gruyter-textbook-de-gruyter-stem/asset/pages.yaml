    # 9.1.2 Class Template


    Class allows programmers to parameterize the class and set the type of the members
    of the class, the parameters in class methods, and the return value of the methods
    to any types (including primitive and user-defined).


    A class is a higher level of abstraction. A class is an abstraction of common
    properties of objects, thus a class template is also called a parameterized class
    because it needs one or more type parameters.


    The form of a class template is:


    ```

    template <TypeParameter>

    class ClassName

    {ClassDefinition}

    ```


    The declaration of class template is nearly identical to that of ordinary classes
    except the type parameter T is often used in members of template classes.


    When defining class methods outside the class template, the following form should
    be used:


    ```

    template < TypeParameter>

    TypeName ClassName<T>::FunctionName (ParameterList)

    ```


    "TypeParameterList" is a list of type identifiers or constant expressions separated
    by commas, including:


    +   1. Class (or typename) Identifier, indicating the template is able to accept
    a type parameter


    +   2. TypeName Identifier, indicating the template is able to accept a constant
    with the type TypeName'
