- pgno: 291
  md: '# 7.3 Type Compatible Rule


    The type compatible rule refers to an object of a publicly derived class can substitute
    an object of the base class wherever the latter one is needed. The derived class
    obtains all the members inherited from the base class except the constructor and
    the destructor through public inheritance. So, the publicly derived class can
    do whatever the base class can. The substitution referred in the type compatible
    rule includes the following situations:


    +   - An object of a derived class can be assigned to an object of the base class.

    - An object of a derived class can be used to initialize a reference of the base
    class.

    - The address of an object of a derived class can be used to assign to a pointer
    of the base class.


    After submission, the object of the derived class can be used as an object of
    the base class.

    If *B* is a base class and class *D* is a publicly derived class from class *B*,
    class *D* owns all the members of class *B* except the constructor and the destructor.
    According to the type compatible rule, an object of the derived class *D* can
    substitute an object of the base class *B* wherever the latter one appears in
    the program. In the following program, *b1* is an object of class *B* and *d1*
    is an object of class *D*.


    ```

    class B

    {...}

    class D:public B

    {...}

    B b1, *pb1;

    D d1;

    ```


    Here:


    +   1. An object of the derived class can be assigned to an object of the base
    class, i.e., to assign the value of each member in the object of the derived class,
    which is inherited from the base class, to the corresponding member of an object
    of the base class.

    b1=d1;

    2. An object of the derived class can also be used to initialize the reference
    of a base class object.

    B &bb=d1;

    3. The address of an object of a derived class can be assigned to a pointer of
    the base class.

    pb1=&d1;'
  merge: -1
