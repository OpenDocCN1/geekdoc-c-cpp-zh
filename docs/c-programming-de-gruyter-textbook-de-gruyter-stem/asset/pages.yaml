- pgno: 71
  md: "# 54 2 Elementary C++ Programming\n\nThe execution order of a switch statement\
    \ is: first calculate the value of the expression in a switch statement; then\
    \ find the first case labeled by a constant expression that matches the value\
    \ of the expression, use the case as an entry label, and start execution. If no\
    \ case matches the value of the expression, then execute from \"default\":\n\n\
    You should pay attention to the following issues when using switch statements:\n\
    \n+   - The expression in switch statements are int-type, character-type, or enumeration-type.\n\
    \n+   - The value of each constant expression must be different, although their\
    \ sequence order does not affect the execution result.\n\n+   - There can be several\
    \ statements in each case, and you do not need to use {}.\n- Each case is only\
    \ an entry label, and it cannot decide the endpoint of the execution. So you will\
    \ need to add a break statement at the end of a case branch to exit early from\
    \ the whole switch structure; otherwise execution will fall through to the next\
    \ statement when the code of that case branch is done.\n- When several branches\
    \ need to do the same action, they can use the same group of statements.\n\n**Example\
    \ 2.4:** Enter an integer between 0–6, convert it into the corresponding day of\
    \ week, and then output it.\n\nAnalysis: In this example, the number entered decides\
    \ the output information, because numbers 0–6 represent seven conditions: \"Sunday\"\
    , \"Monday\".... Thus we need to use a multiple selection structure. Since it\
    \ is judging the day of the week, a switch statement is most appropriate.\n\n\
    Source code:\n\n```\n//2_4.cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main()\n{\n    int day;\n\n    cin >> day;\n    switch (day)\n    {\n      \
    \  case 0: cout << \"Sunday\" << endl;\n            break;\n        case 1: cout\
    \ << \"Monday\" << endl;\n            break;\n        case 2: cout << \"Tuesday\"\
    \ << endl;\n            break;\n        case 3: cout << \"Wednesday\" << endl;\n\
    \            break;\n    }\n```"
