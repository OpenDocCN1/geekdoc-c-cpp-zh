    # 11.2 Output Stream


    An output stream object is the target of information flow. The three most important
    output streams are ostream, ofstream, and ostringstream respectively.


    The predefined o class object is used to accomplish the output to standard devices:


    cout standard output


    cerr standard error output. It has no buffer area, and outputs the content sent
    to it immediately.


    clog is similar to cerr, but it has a buffer area. It outputs the content when
    the buffer area is full.'
