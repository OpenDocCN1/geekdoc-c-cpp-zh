  md: "# 3.1.3 Passing Parameters Between Functions\n\nBefore a function is called,\
    \ the formal parameters of this function neither take up any real memory space\
    \ nor have real values. When a function call is made, the computer allocates memory\
    \ for the formal parameters and assigns the actual parameters to the formal parameters.\
    \ An actual parameter could be a constant, variable, or expression, and should\
    \ match the type of the corresponding formal parameter (the parameter in the same\
    \ position in its parameter list). Passing parameters between functions is the\
    \ process of assigning formal parameters according to actual parameters. C++ has\
    \ two ways to pass parameters: Call-by-Value and Call-by-Reference.\n\n+   1.\
    \ Call-by-Value\n\nThe procedure of Call-by-Value consists of two steps: allocating\
    \ memory space for a formal parameter, and using the actual parameter to initialize\
    \ the formal parameter (assigning the actual parameter to the formal parameter).\
    \ This procedure passes the value of the actual parameter to the formal parameter.\
    \ The formal parameter does not have any relation to the actual parameter once\
    \ it has been initialized, and any change of the formal parameters afterwards\
    \ affect the actual parameter.\n\nExample 3.11: Swap and output two integers.\n\
    \n```\n//3_11.cpp\n#include<iostream>\nusing namespace std;\nvoid Swap(int a,\
    \ int b);\n\nint main()\n{\n    int x(5), y(10);\n    cout<<\"x=\"<<x<<\"y=\"\
    <<y<<endl;\n    Swap(x,y);\n}\n\nvoid Swap(int a, int b)\n{\n    int t;\n    t=a;\n\
    \    a=b;\n    b=t;\n}\n```"
