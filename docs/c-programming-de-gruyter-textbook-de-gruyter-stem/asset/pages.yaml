    \ List\n\nA sequence of nodes linking sequentially makes a linked list. All operations\
    \ of a linked list start from its head node. It is essential to have a pointer\
    \ to the head node in the linked list class, and a pointer for the last node is\
    \ also valuable information to the program.\nThe linked list class needs to manage\
    \ the nodes at runtime since it is a dynamic data structure.\nThe traversal operation\
    \ requires two pointers, one pointing to the current visiting node, and the other\
    \ to the predecessor. Both inserting and deleting nodes use the pointer of predecessor.\n\
    Therefore, the linked list class needs to manage these data:\n\n+   - Pointer\
    \ to the head node\n- Pointer to the last node\n- The number of nodes\n- Current\
