  md: '# 5.1 Scope and Visibility of Identifiers 159


    file. The global variables declared in Example 5.1 have file scope, and they are
    effective in the whole file.


    **Example 5.1:** Examples of scope and visibility.


    ```

    //5_1.cpp

    #include <iostream>

    using namespace std;

    int i; //global variable, file scope

    int main()

    {

    ni=5; //initialize i of the file scope

    { //subblock 1

    int i; //local variable, local scope

    ni=7;

    cout<<i<<endl; //output 7

    }

    cout<<i<<endl; //output 5

    }

    ```


    In this example, variable i declared before the main function has file scope,
    and its effective area is the whole source file. We initialize i to 5 at the beginning
    of the main function, we declare a variable of the same name in block 1 and initialize
    it to 7. The first output result is 7, because the variable with local scope covers
    the variable with file scope that is, the variable with file scope becomes invisible
    (this is the visibility issue, which we will discuss later). When the program
    finishes executing block 1 and starts the second output, the output is the value
    of the variable with file scope, which is 5.

    **A variable with file scope is also called a global variable.**


    # 5.1.2 Visibility


    Now, let us look at the effective area of a variable from the perspective of an
    identifier reference — that is, the visibility of the identifier. When a program
    executes to one point, the identifier that can be referenced is the identifier
    that is visible at this point. To understand visibility, we first look at the
    relationship between different scopes. File scope is the largest scope, followed
    by class scope and local scope. Figure 5.1 describes the general relationship
    between scopes. Visibility represents what you can see when you “look” from inner
    scope to outer scope. Therefore, visibility and scope are closely interrelated.


    The general rules of scope visibility are:


    +   - You must first declare an identifier before referencing it.

    - You cannot declare identifiers of the same name in the same scope.'
