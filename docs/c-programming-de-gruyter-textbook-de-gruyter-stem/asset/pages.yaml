- pgno: 334
  md: "# 8.2 Operator Overload — 317\n\nWe can define an object of the complex number\
    \ class with the following statement:\n\n```\ncomplex a(10,20), b(5,8);\n```\n\
    \nThe question is how to perform the add operation between $a$ and $b$. Naturally,\
    \ we would like to use the operator “+” and write the expression “a+b”, but such\
    \ expression will render an error during compiling because the compiler not know\
    \ how to perform the add operation between two complex numbers. In this, we must\
    \ write a program to clearly specify the operator '+' when it operates on complex\
    \ number objects. This is called operator overload. Operator overload makes existing\
    \ operators more versatile and, with overload, an operator can can act on different\
    \ types of data and have different behaviors.\n\nOperator overload is essentially\
    \ function overload. We should first convert the expression to the call of an\
    \ operator function. The operands are converted to actual arguments of the operator\
    \ function. And then the function to be called is determined according to the\
    \ type of actual arguments, which is completed in the compilation process.\n\n\
    # 8.2.1 Rules of operator overload\n\nThe rules of operator overload are as follows:\n\
    \n+   All operators in C++ can be overloaded except a few exceptions and only\
    \ those existing operators in C++ can be overloaded.\nAfter overloading, the priority\
    \ and associativity are still the same.\nOperator overload meets the actual needs\
    \ of new types of data and makes appropriate modifications to the original operator.\
    \ Generally speaking, an overloaded function should be similar with the original\
    \ operator. The number of operands cannot be changed and at least one operand\
    \ should be a user-defined type.\n\nOnly five operators cannot be overloaded.\
    \ They are the generic relation operator “”, member pointer operator “*”, scope\
    \ resolution operator “::”, sizeof operator, and ternary operator “?:”. The first\
    \ two operators ensure the meaning of accessing members in C++ will not be changed.\
    \ The operands of the scope resolution operator and sizeof operator are types,\
    \ not regular expressions, so they do not have the overloading feature.\n\nThere\
    \ are two types of operator overload: overloading as member functions and overloading\
    \ as friend functions. The syntax of overloading as member functions is:\n\n```\n\
    function type operatorname(argument list)\n{\n    function body;\n}\n```"
