  md: "# 100 3 Functions\n\nFor some simple, small, but frequently used functions,\
    \ we can use inline functions. An inline function does not cause control transfer\
    \ when it is called, but makes itself embedded in every place it is called during\
    \ the compilation. In this way, the cost of passing parameters and control transfers\
    \ can be saved.\n\nInline functions use the keyword \"inline\" in the function\
    \ definition. The form is\n\n```\ninline Type identifier Function name (Parameters)\
    \ { Function body; }\n```\n\nThere are several points that require our attention\
    \ when using inline functions:\n\n+   - Generally, loop statements and switch\
    \ statements should not appear in an inline function.\n- Inline functions must\
    \ be defined before their first call.\n- Inline functions do not support abnormal\
    \ interface statements. (Abnormal interface statements will be discussed in Chapter\
    \ 12)\n\nGenerally, inline functions should be simple functions, with simple structures\
    \ and few statements. Defining a complex function as an inline function may lead\
    \ to code bloat and also increase the cost. In this case, most compilers will\
    \ automatically convert the inline function into a common function before processing.\
    \ What kind of functions should be counted as complex? The answer depends on compilers.\
    \ Generally, functions that have loop statements cannot be processed as inline\
    \ functions.\n\nTherefore, the keyword inline is just a request. The compiler\
    \ does not promise that every function with the keyword inline will be processed\
    \ as an inline function. Moreover, functions without the inline keyword can possibly\
    \ be compiled as inline functions.\n\nExample 3.14: An example of an inline function.\n\
    \n```\n//3_14.cpp\n#include<iostream>\nusing namespace std;\ninline double CalArea(double\
    \ radius) //Inline function, to calculate\n// the area of a circle\n{\n    return\
    \ 3.14*radius*radius;\n}\n\nint main()\n{\n    double r(3.0); //r is the radius\
    \ of the circle\n    double area;\n    area=CalArea(r);\n}\n```"
