  md: "# 3.1 Definition and Use of Function — 81\n\nAfter declaring the function prototype,\
    \ we can make a function call with the following form:\n\n```\nFunction name(Actual\
    \ parameter list)\n```\n\nThe actual parameter list should provide parameters\
    \ that accurately match the formal parameters in number and types. A function\
    \ call can be used as a statement, where the return value of the function is not\
    \ needed; a function call can also appear in an expression, where an explicit\
    \ return value of the function is needed.\n\nSimilar to the declaration and definition\
    \ of variable, declaring a function only tells the compiler its relevant information\
    \ (function name, parameters, return type, etc.) without generating any codes,\
    \ while defining a function gives the function code in addition to its relevant\
    \ information.\n\nExample 3.1: Writing a function to calculate the nth power of\
    \ x.\n\n```\n//3_1.cpp\n#include <iostream>\nusing namespace std;\ndouble power\
    \ (double x, int n);\nint main() {\n    cout << \"5 to the power 2 is \" << power(5,2)\
    \ << endl;\n    //Function call is counted as an expression in the output statement.\n\
    }\ndouble power (double x, int n)\n{\n    double val = 1.0;\n    while (n--)\n\
