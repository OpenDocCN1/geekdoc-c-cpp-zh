    Suppose we have two strings s1 and s2; the rules of comparing them are as follows.


    +   a) If the lengths of s1 and s2 are the same, and all characters in s1 and
    s2 are exactly the same, then s1 equals to s2.

    b) If the characters of s1 and s2 are not exactly the same, compare the ASCII
    code of the first pair of characters that differ; the string with the smaller
    character is smaller.

    c) If the length of s1 (n1) is less than the length of s2 (n2), and the first
    n1 characters of the two strings are exactly the same, s1 is smaller than s2.


