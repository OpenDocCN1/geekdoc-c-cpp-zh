    chess as you would play basketball." Is it possible for a computer to have the
    same ability? This is up to the programs we write. C++ provides the support for
    function overloading, which enables us to give different functions the same name.
    The compiler will choose an appropriate function to execute according to the context
    (number and types of parameters).


    Function overloading means that two or more functions share the same name, albeit
    differences in the number or the types of their formal parameters. The compiler
    will automatically choose a function that fits the calling context according to
    the number and the types of formal parameters.


