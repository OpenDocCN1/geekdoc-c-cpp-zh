  md: '# 1.2 Object-oriented Method 5


    The emergence of object-oriented method is in fact a process of the development
    of programming design method returning to nature. The goal of software development,
    in essence, is to get a proper understanding of the problem domain it needs to
    solve, and to correctly describe the understanding. The fundamental principle
    object-oriented method emphasizes is to develop software directly onto existing
    objects, and to bring human ways of thinking and expressing into software development.
    Through this, we can turn software development from those over-specialized methods,
    rules, and techniques back to human ways of thinking.


    # 1.2.2 Basic Concepts of Object-oriented


    Now we will introduce some basic concepts in the object-oriented method. We can
    not expect to understand all these concepts through only a few such statements.
    The following chapters of this book will help us to get a better understanding
    of these concepts to fully achieve proficiency.


    # 1. Object


    Generally speaking, objects are things that really exist. They can be either material
    (like a car) or immaterial (like a plan). An object is an independent unit that
    may up the world. It has static features (can be described by certain data) and
    dynamic features (the behaviors an object presents or its functionalities).


    The Object in OO (object-oriented) method is an entity system used to describe
    objectives. It is an elementary unit for constructing a system. An object consists
    of a group of attributes and a group of behaviors. Attributes describe the static
    features of an object while behaviors are the operation sequences that describe
    an object''s dynamic features.


    # 2. Class


    People tend to sum up their understanding of the world and put them into categories.
    **The principle for such classification is abstraction**, which means ignoring
    minor issues and only focusing on essential characteristics that relate to our
    current goals. We can find out the shared characteristics and sort out those things
    with common characteristics and put them into a class. We can then have an abstract
    concept, such as a stone, tree, car or house, which are all concepts that people
    abstracted from humanity''s long-term life experiences in production and practice.


    A “class” in the OO method is a set of objects with the same attributes and behaviors.
    It provides abstract descriptions for all objects of the class and is mainly composed
    of two parts: attribute and behavior. The relationship between class and object
    is similar to that between a mold and cast. An object of a class is called an
    instance of that class.'
