  md: '# #include Directive


    The #include directive is also called a file inclusion directive. Its role is
    to embed an-other source file into the current source file. We usually use a #include
    directive to embed header files. There are two forms of inclusion directives:


    +   a) #include<file name>

    Search the file that needs to be included using the standard method, and the file
    is under the include subdirectory of the C++ system directory.

    b) #include"file name"

    First search the file that needs to be included under the current directory; if
    the search fails, search the file using the standard method.


    #include directives can be nested for use. Suppose there is a header file myhead.h.
    This header file can turn the following two #include directives:


    ```

    #include "file1.h"

    #include "file2.h"

    ```


    # #define and undef Directives


    We use #define to define symbolic constants in C. For example, the following prepro-cessing
    directives define a symbolic constant PI to 3.14:


    ```

    #define PI 3.14

    ```


    Although symbolic constants can be defined as above in C++, a better method is
    to use the const qualification in type declaration statements.

    We can also use #define to define macros with parameters in C to achieve simple
    function calculations, which can improve the execution efficiency. However, this
    func-tion is now replaced by inline functions in C++.

    undef is used to undef macros defined by #define.


    # Conditional Compilation Directive


    A conditional compilation directive instructs that some parts of a program can
    be com-piled only when some conditions are satisfied. Therefore, we can use conditional-ilation
    directives to make the same source file generate different object codes under
    different compiling conditions. For example, we can add some debugging statements
    during the program debugging to achieve tracing, and use conditional compilation
    directives to restrict the debug statements not to participate in the recompiling
    after the debugging. There are five forms of frequently used conditional compilation
    state-ments:'
