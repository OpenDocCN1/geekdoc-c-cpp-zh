    # 9.2.5 Queues


    Unlike stacks, queues are also linear collections with a restricted access pattern.
    We can only add elements on one side (head), and only remove elements on the other
    side (tail). It is also possible to implement queues in both arrays and linked
    lists. The definition of the status of a queue is similar to the one for stacks.


    A queue should provide a queue, head pointer, and tail pointer as data members,
    and it also needs to provide the interfaces of these operations:


    +   - Initialization

    - Enqueue / dequeue

    - Clear the stack

    - Access the head of the queue

    - State detection


    Figure 9.17 shows a trivial implementation in static arrays. We can see all elements
    moving towards the head of the queue when dequeuing an element, which is very
    inefficient.


    A way to design a queue is to make it a circular one. The idea is shown in Figure
    9.18. The queue maintains two pointers pointing to the head and the tail of the
    queue respectively. The queue changes these pointers when enqueueing and dequeuing
    elements. The important part is to use a modular operation to wrap the queue,
    ensuring the pointers are reset to zero when they cross the boundary. The queue
    also needs to count the elements. Example 9.10 is an implementation using this
    method.


