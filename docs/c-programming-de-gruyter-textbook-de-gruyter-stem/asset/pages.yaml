    \ source files:\n\n```\n//main.cpp\n#include \"file1.h\"\n#include \"file2.h\"\
    \nint main() \n{\n  ...\n}\n\n//file1.h\n#include \"head.h\"\n...\n\n//file2.cpp\n\
    #include \"head.h\"\n...\n\n//head.h\n...\nclass Point\n{\n}\n```\n\nBecause of\
    \ the nested use of the #include directive, header file head.h has been included\
    \ twice, and then the system will indicate errors during the compiling and definition\
    \ of class Point. How does one avoid this error? We need to use conditional compilation\
    \ directives in the header files that may have been included multiple times. We\
    \ can use an exclusive identifier to mark whether a file has been compiled or\
    \ not: if it has already compiled, then this program segment should have been\
    \ included repeatedly, and the compiler will not recompile the repeated part any\
    \ more. Thus, \"head.h\" can be rewritten as:\n\n```\n//head.h\n#ifndef HEAD_H\n\
    #define HEAD_H\n...\nclass Point\n{\n  }\n```"
