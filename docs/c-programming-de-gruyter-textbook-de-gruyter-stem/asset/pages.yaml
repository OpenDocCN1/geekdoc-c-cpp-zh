    # 10.2 Containers in STL


    STL containers have been introduced briefly in the previous section. This section
    will discuss containers in detail.


    Sequential containers organize elements linearly, meaning that the program can
    define the positions of elements as well as the top/bottom of the container. You
    can see sequential containers as an implementation of linear collection. It is
    a totally different story for associative containers, which organize elements
    based on indexes.'
