  md: '# 9 Collections and Their Organization


    We have introduced basic data types and user-defined types (array, structures,
    etc.) in Chapters 2 and 6. Basic data types are predefined by the C++ compiler
    system, and user-defined data types consist of base types and user-defined types.
    We call the data collections. In many cases, system-defined operations are not
    enough and user-defined operations are required to deal with specific problems.
    A collection class can be defined by encapsulating data and operations with the
    object-oriented method.


    There are two types of collections: linear collections and nonlinear collections.
    A node in a linear collection can be specified by its position. It is possible
    to determine the order of the elements in a linear collection. An array is a good
    example of a linear collection (as shown in Figure 9.1). In a nonlinear collection,
    a node cannot be specified by its position. For example, a tree is a nonlinear
    collection (as shown in Figure 9.2). This chapter will introduce several commonly
    used collections and their related operations.


    Organizing a collection is of interest in the study of data structure, which is
    described briefly in this chapter. Two types of commonly used algorithms are introduced:
    searching and sorting.


    Sorting is the process of ordering all elements in a collection. There are basic
    operations in sorting algorithm: comparing two elements and adjusting the position
    of an element. In this chapter, we introduce three sorting methods: direct insertion
    sorting, direct selection sorting, and bubble sorting.


    Searching is the process of locating a specific element in an array by following
    a certain procedure. Looking up a word in a dictionary is a good example of searching.


