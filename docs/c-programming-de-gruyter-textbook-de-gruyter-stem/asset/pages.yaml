    objects of the derived class can directly access the private members inherited
    from the base class.


    Comparing private inheritance with protected inheritance, we can see that all
    the access attributes of members in the directly derived class after inheritance
    are the same in the two cases. However, the difference appears when we use the
    derived class as a new base class to further derive classes. Suppose class Rectangle
    inherits Point privately and class Square in turn inherits Rectangle: neither
    the members nor the objects of class Square can access members inherited indirectly
    from class Point. If Rectangle inherits Point in a protected way, then all the
    public and protected members in class Point will become protected or private (depending
    on the inheritance mode between class Rectangle and class Square) in class Square.
    Therefore, members of class Square may access the members inherited from class
    Point.


    From the rules of inheritance, we can see the characteristics of protected members
    in a class. If class Point has protected members, then like private members, these
    protected members are not accessible through objects of class Point. If we derive
    a class Rectangle from class Point, then for Rectangle, protected members and
    public members have the same access attributes. In other words, protected members
    inherited from class Point can be accessed directly by the members of the derived
    Rectangle, but can never be accessed by any external users (e.g., common functions
    in the program or other classes parallel to class Point). By using protected members
    properly, we can find a balance between data sharing and data hiding in complex
    layer relationships among classes, realizing the efficient reuse and extension
    of codes.'
