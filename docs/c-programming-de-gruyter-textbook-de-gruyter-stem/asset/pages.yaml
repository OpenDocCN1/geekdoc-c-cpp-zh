    \ different interfaces based on the containers provided by STL.\n\n# 1. Stacks\n\
    \nA stack is a linear collection with restricted access. Elements can only be\
    \ added or removed from one end of a stack. Such operations are called push and\
    \ pop respectively. In theory, there is no limit on the number of elements in\
    \ a stack. In practice, a stack will overflow if it exceeds the memory limit of\
    \ the computer, and it will underflow if one tries to pop an empty stack. STL\
    \ catches these exceptions to keep the program from crashing.\n\nStacks are based\
    \ on the implementation of a certain container, which is specified at the declaration.\
    \ Here is an example of declaration of a stack using deque as its underlying implementation\
    \ of storage:\n\n```\nstack<int, deque<int>> myStack;\n```\n\nStacks only implement\
    \ the primitives of the stack data structure. Methods push()/pop() add or remove\
    \ an element at the top of stack; the method pop() returns the reference of the\
    \ element at the top of the stack. The method empty() checks whether a stack is\
    \ empty. The method size() returns the number of elements in the stack. The underlying\
    \ storage can be a vector, list, or deque, and the deque is the default implementation.\
    \ Please refer to related documents like MSDN for detailed information. Here is\
