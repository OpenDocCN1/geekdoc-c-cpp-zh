  md: '# 6 Arrays, Pointers, and Strings


    After studying the concepts and applications of basic control structures, functions,
    and classes of C++, many problems can be described and solved. For large scales
    of data, especially when they are mutually correlated or are similar and correlated
    data, how to present and organize them efficiently remains a problem. The array
    type in C++ provides an effective way to organize objects of the same type.


    An important characteristic, which C++ inherits from C, is that we can directly
    use an address to memory, and the pointer variable is an important data type for
    realizing this feature. Using pointers, we can conveniently process large amounts
    of data continuously stored in memory, achieve massive data sharing between functions
    at a comparatively low cost, and easily realize dynamic memory allocations.


    Using character arrays to make up the deficiency of string variables is an effective
    method inherited from C. However, from the object-oriented and security perspectives,
    strings represented by character arrays have deficiencies. Therefore, the standard
    class library of C++ provides the string class, which is a good example of expanding
    data types based on the class library.


    In this chapter, we will introduce the array type, pointer type, dynamic memory
    allocation, and how to store and process string data.


    # 6.1 Arrays


    After considering the function of an array, please consider this problem: how
    does one store and process a series of n integers in a program? If n is small,
    for example, n is 3, we can easily declare three variables of the int type. If
    n is 10,000, then we need to declare 10,000 variables of int type to represent
    these 10,000 numbers by int variables. How can we process these 10,000 variables?
    It is not hard to imagine the complexity and difficulty. The array is designed
    to solve this kind of problems, which is used to store and process massive data
    sets of the same type.


    > An array is a data structure consisting of a group of ordered objects. The objects
    that make up an array are called array elements. Array elements are denoted by
    array name and one or more subscripts (each enclosed with a pair of square brackets).
    Elements of an array have the same type. An array can be made of any type except
    the void type. The relationship between array elements and an array is very similar
    to that between numbers and vectors or matrices in mathematics.


    If an array, we need to denote each of its elements by the name and n subscripts,
    this array is called an n-dimensional array. And if it has N+1 elements, these
    elements can be denoted as ARRAY[0], ARRAY[1], ..., ARRAY[N]. This array can store
    N+1 data elements sequentially, so N + 1 is the size of ARRAY. Besides, the lower
    bound and the upper bound of the element''s subscript in this example are 0 and
    N respectively.'
