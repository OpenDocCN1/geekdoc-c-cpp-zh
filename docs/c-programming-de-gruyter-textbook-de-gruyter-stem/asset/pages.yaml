    \ queues, which are able to extract the highest priority element from a queue.\n\
    \n# 10.3 Iterators\n\nIterators are an object-oriented version of a pointer. They\
    \ provide a uniform mechanism with which to traverse through a container. Pointers\
    \ point to a memory location, so that program is able to access the object at\
    \ the memory location through the pointer. You can see iterator as a type-safe\
    \ pointer – it points to an object of a specific type."
