    # 2. Modifying Base Class Members


    There are two aspects to modifying base class members: one is the change of access
    attributes of base class members, which mainly depends on the inheritance mode
    specified in the definition of the derived class, which will be discussed in Section
    T2; the other is the overriding of data or function members inherited from the
    base class. That is, declaring a data or function member in the derived class
    with the same name as a member inherited from the base class. If the derived class
    declares a new member A with the same name as another member B from its base class
    (if A and B are functions, then their argument lists should be the same; otherwise
    they form a function overloading instead of the overriding here), then the new
    A will cover the member B, and we can access only A instead of B using the members
    or objects of the derived class. This is called homonym cover. Take the function
    pay() for example. The function pay() in the derived class technician covers the
    homonymous function inherited from the base class employee.


    # 3. Adding New Members


    The core of the inheritance and derivation mechanism is adding new members in
    the derived class, which ensures the development of the derived class. We can
    add appropriate data and function members in the derived class based on actual
    needs. In the previous example, new data members hourlyRate and workHours are
    added to the derived class technician.


    Because constructors and destructors cannot be inherited from the base class in
    the class inheritance, to realize some special initialization and cleaning up
    work, new constructors and destructors should be added in the derived class. For
    example, we design the constructor technician() in the derived class technician.


    This chapter is organized according the three steps of derivation procedure. The
    first step is finished once a derived class is defined and needs no intervention
    of programmers, we will not discuss it. As the second step, we mainly study the
    issues of access controls of the base class members under different inheritance
    modes. The third step we focus on the addition of the constructor and destructor,
    because the methods and rules of adding other ordinary members in a derived class
    are the same as when defining an ordinary class, to which readers can refer in
    Chapter 4. We will then discuss the issues of unique identification and access
    of class members under more complicated inheritance relationships. Finally, we
    will give instances of class inheritance as the review and summary of this chapter.'
