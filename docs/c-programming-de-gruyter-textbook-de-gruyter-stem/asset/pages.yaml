  md: '# 2. Initialization of Array


    The initialization of an array is to assign values to the array elements when
    declaring an array. To array of basic types, initialization assigns values to
    array elements; to object array, every element is a class object, so the initialization
    needs to call the constructor of the object. We will introduce object arrays later
    in detail.


    When declaring an array, we can initialize the array elements. For example,


    ```

    int a[3]={1,1,1};

    ```


    indicates that we declare an array of int type has three elements, and values
    of a[0], a[1], a[3] are all 1. If we list all the initial values of array elements
    during the array declaration, then we need not explicitly give the number of elements.
    The statement below is completely equivalent to the statement above.


    ```

    int a[]={1,1,1};

    ```


    We can only initialize part of the array elements during an array declaration.
    For example, when declaring a float type array, we can assign the first three
    elements 1.0, 2.0, and 3.0 respectively, and it can be written as


    ```

    float fa[5]={1.0, 2.0, 3.0};

    ```


    Here, the number of array elements must be specified, and it is unnecessary to
    give any explanation for the last two elements. Note that we can only initialize
    all the elements or the first elements of an array, and we cannot initialize array
    elements selectively.


    The initialization of a multidimensional array follows the same rule as a one-dimensional
    array. Moreover, if we give initial values to all the elements, the subscript
    of the first dimension doesn''t need to be declared explicitly. For example,


    ```

    int a[2][]={1, 0, 0, 0, 1, 0};

    ```


    equals to


    ```

    int a[][3]={1, 0, 0, 0, 1, 0};

    ```


    Elements of a multidimensional array can be grouped according to the subscript
    of the first dimension, and we can use braces to enclose each group. For a two-dimensional
    array, we can use braces to enclose the members of the same row into a group.
    The statement below is completely equivalent to the statement above


    ```

    int a[2][3]={{1, 0, 0}, {0, 0, 1, 0}};

    ```


    The writing form of grouping by braces is easy to recognize and understand.'
