  md: '# The I/O Stream Library and Input/Output


    As in the C language, there is no input/output statement in C++. However, there
    is an object-oriented input/output software package in C++, i.e., the **I/O stream
    library**. Stream is the key concept of an I/O stream. In this chapter, the concept
    of stream and there the structure and the use of stream library will be introduced.
    A more detailed explanation and description of classes and the members of the
    stream library can be found in the reference book of the running libraries of
    compiler system.


    # 11.1 I/O Stream''s Concept and the Structure of a Stream Library


    An I/O stream library is a replacement product of the C language I/O function
    in object-oriented design.

    As introduced in Chapter 2, we conceptualize the flow from one object to another
    as "stream" in C++. The operation of getting data from a stream is called extraction,
    and adding data into a stream is called insertion. Data input and output is realized
    through an I/O stream. We will give a detailed introduction of it in the following
    paragraphs.


    When a program exchanges information with the external environment, there are
    two objects: one is the object in the program, and the other is the file object.
    Stream is a kind of abstract, which is responsible for establishing the connection
    between the producer of data and the consumer of data, and managing the flow of
    data. A program generates a stream object and designates this stream object to
    be associated with a file object, the program operates the stream, and the stream
    affects the connected object through the file system. Since a stream is the exchanging
    interface between objects in the program and file objects, and a stream has all
    the properties of a file object, **programs regard a stream object as a form of
    file object.**


    Operating systems handle the keyboard, screen, printer, and communication port
    as extended files using a device driver. Therefore, for a C++ programmer, these
    devices are the same as disk files. Data exchange with these devices is achieved
    by using an I/O stream.


    Stream is not limited to I/O operations. Operation of transmitting data from one
    place to another is a stream operation. For example


    The basis of an I/O stream library is class templates. Class templates provide
    most of the functions in the library, and they can operate on different types
    of elements. All these templates have "base_" as the prefix in their names.


    There are two kinds of template in an I/O stream: wide-character-oriented and
    narrow-character-oriented. The wide-character-oriented class supports multibyte
    char'
