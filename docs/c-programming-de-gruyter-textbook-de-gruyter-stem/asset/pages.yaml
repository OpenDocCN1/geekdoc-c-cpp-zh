  md: '# 278 7 Inheritance and Derivation


    derived class. The constructor of the derived class needs appropriate initial
    values as arguments. Some of the arguments are used to initialize the new members
    in the derived class, while others are used to pass on to the constructors of
    the base class and the inline object members are used so to initialize the corresponding
    members. When creating an object of the derived class, the constructors of the
    base class and the inline object members are first called implicitly to initialize
    the corresponding data members; then the function body of the derived class constructor
    is executed.


    The syntax for the definition of a derived class constructor is as follows:


    ```

    name of the derived class:: name of the derived class

    (argument list):name of base class 1(argument list 1), ...,

    name of base class(argument n)

    name of inline object(argument list of inline object), ...

    name of inline object m(argument list of inline object m)

    {

    statements to initialize new members of the derived class;

    }

    ```


    Here, the name of the constructor is the same as the name of the derived class.
    The argument list of the constructor should provide all the arguments needed to
    initialize the base class, data, new inline object data, and newly-added member
    data. Following the argument list, the names of the base class and the inline
    members that need arguments for initializations, along with their argument lists,
    should be listed. Each item is separated by commas. The order of the names of
    base classes and objects does not matter: they can appear in any order. When generating
    an object of the derived class, the system will first use the arguments listed
    here to call the constructors of the base classes and of the inline object members.


    If a derived class has more than one base class, then for all the base classes
    and all the inline object members that need arguments for initializations, their
    names and argument lists should be explicitly given. For those classes that use
    default constructors, their names and argument list need not be given. For single
    inheritance, we need to give the name and argument list of only one base class.


    Now, let us discuss when we declare the construction of the derived class. If
    the base class declares a constructor with formal arguments, then the derived
    class should declare its constructor. This provides a way to pass arguments to
    the constructor of the base class, ensuring that the base class can get necessary
    data during its initialization. If the base class does not declare a constructor,
    the derived class can choose not to declare its. In such case, the default constructor
    will be used and the task of initializing new members can be done by other public
    functions.


    The common execution order of calling constructor of a derived class is as follows:


    +   1. Call the constructors of the base classes. The calling order is the same
    as the order of these base classes appearing in the definition of the derived
    class (from left to right).'
