    # 7.4 Constructor and Destructor of Derived Class


    The purpose of inheritance is to develop. The derived class inherits the members
    of the base class, realizing code reuse. But code expansion is more important.
    Only by adding new members and functionalities can we make the derivation meaningful.
    In previous examples, we have studied the addition of ordinary members in derived
    class. In this section, we will focus on the constructor and the destructor of
    derived class. Since the constructor and the destructor of the base class cannot
    be inherited in the derivation, if we want to initialize the newly added members
    in the derived class, we have to add new constructor in the derived class. However,
    the constructor of the derived class can only initiate members added in the derived
    class, while the members inherited from the base class will still be initiated
    by the constructor of the base class. New destructors should also be added to
    the derived class to do the cleanup work of objects in the derived class.


    # 7.4.1 Constructor


    After defining a derived class, we need to create an object in the derived class
    in order to use the derived class. Objects must be initialized before being used.
    The data members of the derived class consist of the data members inherited from
    the base class and newly added data members in the derived class. If the new members
    of the derived class include inline objects of other classes, the data members
    of these objects are indirectly included in the data members of the derived class.
    Therefore, **data members of the base class, new data members, and data members
    of object members should all be initialized when creating an object of the derived
    class..** Since the constructor of the base class is not inherited, in order to
    implement the initialization of objects of the derived class, we must add a new
    constructor to the'
