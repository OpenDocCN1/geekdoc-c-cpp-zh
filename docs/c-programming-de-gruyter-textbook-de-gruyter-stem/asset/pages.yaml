    \ section addresses these problems.\n\n# Shallow Copy vs Deep Copy\n\nThis problem\
    \ was discussed in Section 6.4. Shallow copy only copies the references of elements,\
    \ and not the contents of elements in Array. Here is an example of shallow copy:\n\
