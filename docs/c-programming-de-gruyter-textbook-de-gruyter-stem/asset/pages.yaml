    # 2.1.2 Characteristics of C++


    The C++ language has two main characteristics: it is fully compatible with C and
    it supports object-oriented methods.


    First of all, C++ is indeed a better C. It keeps some features of C, such as C''s
    simplicity, high efficiency, and closeness with assembly language. Furthermore,
    it reforms and expands the type system of C, making it safer and its compiling
    system more capable of detecting type errors than C.


    As C++ is compatible with C, many C codes can be used in C++ without modification.
    Many library functions and utility software in C can be used in C++. In addition,
    the widespread use of the C language promotes the spread of both C++ and object-oriented
    techniques.


    However, from another perspective, C++''s compatibility makes it not a pure object-oriented
    language. It supports both procedure-oriented programming and object-oriented
    programming.


    The most meaningful feature of C++ is that it supports object-oriented programming.
    Although its compatibility with C gives it dual characteristics, conceptually
    speaking it is totally different from C. Thus we had better write C++ with an
    object-oriented way of thinking.


    If you have some procedure-oriented programming experience, we suggest that you
    pay more attention to the object-oriented feature of C++ and less attention to
    its similar parts with C, for C and other procedure-oriented high-level programming
    languages are similar in design methods.


    However, beginner programmers not overlook the compatible parts of C++ with C,
    although they are not the main content of C++. This is because many elements such
    as data types, controlling structures of algorithms, functions, etc. are not only
    basic components of procedure-oriented programming. In object-oriented programming,
    objects are the basic units for a program, where their static attributes always
    need to be represented by certain data type, and their dynamic attributes need
    to be realized by their member functions whose implementations are, after all,
    the design of algorithms.


    # 2.1.3 C++ Programming Examples


