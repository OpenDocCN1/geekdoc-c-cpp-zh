  md: '# 10.2 Containers in STL 407


    There are two access patterns in sequential containers: sequential access and
    random access. You have to access the element sequentially in a container that
    only supports sequential access, i.e., have to access the first and the second
    element before accessing the third. However, you can access the elements directly
    if the container supports random access. Vectors and double queues are random-access
    containers while lists are sequential-access containers.


    There are four associative containers: set, multiset, map, and multimap. An element
    can be accessed based on its key. Interested readers can refer to books about
    data structure and STL for more details.


    There are seven containers in STL, and they provide the functions of storing,
    searching, and accessing elements. Besides, stacks, queues, and priority queues
    are standard data structures, and are necessary in many applications. STL provides
    three kinds of module called adaptors. Combining adaptors and sequential containers
    provide the functions of stacks, queues, and priority queues.


    # 10.2.1 Sequential Containers


    The most widely used sequential container in C++ is the array. However, sometimes
    more powerful tools are needed. To meet this need, STL implements three sequential
    containers: vectors, lists, and double queues.


    The vector is a powerful extension of the static array. It is very similar to
    the static array, but it can enlace its storage on demand at runtime.


    The list is an implementation of the double-linked list. It is quick to add or
    remove an element or from a list.


    The double queue is an extension of the data structure queue. Compared to a standard
    queue, it can add or remove elements from both ends of the queue.


    # 1. Common Interfaces of Sequential Containers


    # a) Adding Elements


    There are a number of ways to insert elements into a container. The first one
    is to use the push() or push_back() methods, which add an element at the front
    or the end of the container respectively.


    The second way is to use the insert() method. It has some variants in different
    containers. Insert (L, O) adds element O before location L. Insert (L, N, O) inserts
    element O before location N. Insert (L, i, j) adds all element between location
    i and j before location L. It is worth mentioning that the insert() method will
    possibly invalidate all iterators in vectors and double queues, and insert() methods
    should be used with care.


    The third way is to use the assignment operator to add all elements in a container
    into an empty container.'
