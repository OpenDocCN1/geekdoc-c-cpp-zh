  md: "# #12 Exception Handling\n\nWhen we write application software, we should ensure\
    \ its correctness and robustness. In other words, the software should run correctly\
    \ when conditions and users operations are correct. When an unexpected problem\
    \ arises or users operate improperly, the program should behave properly and reasonably\
    \ without causing system failure or catastrophic consequences. Because we should\
    \ consider all possible circumstances and take effective measures accordingly.\
    \ This precautionary measure for dealing with runtime errors is called exception\
    \ handling.\n\n# ## 12.1 Basic Concepts of Exception Handling\n\nSome unavoidable\
    \ runtime errors can be anticipated, including insufficient memory, missing files\
    \ on hard disks, and discounted printers. These errors are caused by the program\
    \ running environment. When these errors arise, we should allow users to correct\
    \ the environmental errors and allow the program to continue and we should show\
    \ some error messages. This is the task of exception handlers.\n large-scale software,\
    \ because each function has a specific purpose and the relationships between functions\
    \ are complex, an individual function does not have the capacity of handling errors.\
    \ When an error is detected by a function, it may trigger (or 'throw') an exception\
    \ and expect its caller to handle this error. If the caller cannot handle the\
    \ error, it should pass it to a higher-level caller. This propagation will continue\
    \ until the exception is handled. If an exception cannot be handled by the program,\
    \ it will be passed to the C++ running system, which will terminate the program.\
    \ Figure 12.1 shows the direction of exception propagation.\n\n![](img/5618306d085ac1bac8275d6c4c5bbf2a_486_0.png)\n\
    \n**Fig. 12.1:** Exception propagation direction.\n\nhttps://doi.org/10.1515/9783110471972-02"
