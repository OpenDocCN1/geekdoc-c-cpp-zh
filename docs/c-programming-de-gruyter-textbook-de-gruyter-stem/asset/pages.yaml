  md: "# 5.3 Static Members of Class\n\nThe basic unit of program modules in structured\
    \ program design is function. Therefore, memory sharing between modules is achieved\
    \ through the data sharing between functions, including parameter passing and\
    \ global variables.\n\nObject-oriented program design concerns both data sharing\
    \ and data protection. It encapsulates data and functions operating the data together,\
    \ to construct more integrated modules. The data members of a class can be accessed\
    \ by any function of the same class. However, on the one hand this kind of data\
    \ sharing is restricted — we can set appropriate access control attributes to\
    \ limit the data sharing within the class scope, and class members are still hidden\
    \ from the outside of the class, to achieve both sharing and hiding.\n\nYes, this\
    \ is not all of data sharing. Data sharing is also needed between objects.\n\n\
    Static members are designed to solve the problem of data sharing between different\
    \ objects of the same class. For example, we can abstract the common attributes\
    \ of all the employees of a company, and design the following `employee` class:\n\
    \n```\nclass employee {\n    private:\n    int EmpNo;\n    int ID;\n    char *name;\
    \ //use character pointer to point to the first address of the character string,\
    \ the details are //in Chapter 6\n    . . . .\n    //omit other data members and\
    \ functions\n}\n```\n\nIf we need to count the total number of employees, where\
    \ do we store this data? If you use a variable outside the class to store the\
    \ total number, then you cannot hide this data. If you add a data member in the\
    \ class to store the total number, then every object should store a copy of this\
    \ data, which not only is redundant but also may cause data inconsistency. Since\
    \ this data should be shared among all the objects in the class `employee`, the\
    \ best way is to let all the objects of the class have the same data member that\
    \ stores the total number, which is the static data member we will introduce next.\n\
    \n# 5.3.1 Static Data Member\n\nWhen we say “all the objects in a class have the\
    \ same attribute\", we mean the number, the name, and the data type of the attribute\
    \ of each object are the same,"
