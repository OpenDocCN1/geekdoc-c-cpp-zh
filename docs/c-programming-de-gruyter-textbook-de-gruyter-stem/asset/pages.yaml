    \    top++; //Increase the pointer of stack top by 1\n    stacklist[top] = item;\
    \ //Push the new element to stack top\n}\n```\n\n```\ntemplate <class T>\nTStack<T>::Pop(void)\
    \                            //Pop the element on stack\n{\n    T temp;\n    if\
    \ (top == -1) //Terminate the program if the stack is empty\n    {\n        std::cerr\
    \ << \"Attempt to pop an empty stack! << endl;\n        exit(1);\n    }\n    temp\
    \ = stacklist[top]; //Get the element on stack top\n    top--; //Decrease the\
    \ pointer of stack top\n    return temp; //Return the element on stack top\n}\n\
    ```\n\n```\ntemplate <class T>\nTStack<T>::Peek(void) const                  \
