  md: "# 8.1.2 Implementation of Polymorphism\n\nPolymorphism can be divided into\
    \ two groups in terms of implementation: **compiling polymorphism and executing\
    \ polymorphism**. For the former group, the operands in the same operation are\
    \ determined during compiling while for the latter group, they are determined\
    \ dynamically during execution. The process of determining the operands is binding.\
    \ Binding is a procedure in which computer programs relate to each other by themselves.\
    \ It also means the identifier and memory address. In object-oriented programming,\
    \ **binding is the process of connecting a message with a function of act**. According\
    \ to the different stages of binding, there are two ways of binding: static binding\
    \ and dynamic binding, corresponding to two methods of polymorphism implementation.\n\
    \n**A static binding is a binding during the compiling and linking processes.**\
    \ Because binding is done before the execution, it is also called early binding.\
    \ During compiling and linking, the system can determine the relation between\
    \ the operation and the code for the operation according to the features such\
    \ as type matching. In other words, it determines the proper code for a certain\
    \ identifier. The operands with the same operation name can be decided during\
    \ compiling and linking for polymorphism types. It is done by static binding,\
    \ such as overloading, coercion, and argument polymorphism.\n\n**If binding is\
    \ performed during the execution, such a binding is called dynamic binding.**\
    \ In some cases, binding cannot be performed during compiling or linking and standing,\
    \ it is performed during the execution. It is through dynamic binding that objects\
    \ are determined if they have polymorphism operations.\n\n# 8.2 Operator Overload\n\
    \nOperands of the predefined operators in C++ are only basic data types. In fact,\
    \ for many user-defined types (such as classes), similar operations are also needed.\
    \ For example, the following program defines a class of a complex number.\n\n\
    ```\nclass complex //define a complex number\npublic:\n    complex(double r=0.0,\
    \ double i=0.0){real=r;mag=i;} //constructor\n    void display(); //show the value\
    \ of complex number\nprivate:\n    double real;\n    double imag;\n};\n```"
