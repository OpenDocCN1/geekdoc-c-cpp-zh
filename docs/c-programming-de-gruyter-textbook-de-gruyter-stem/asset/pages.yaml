  md: '# Elementary C++ Programming


    The chapter begins with a brief look at the history of C++ the language and its
    characteristics. Then we look at the basic elements that construct a C++ statement
    – character sets, keywords, identifiers, operators, etc. Program design mainly
    includes data structure and algorithm design. Data types, data type conversion,
    and simple data input/output are the basic elements of data. The chapter introduces
    C++ data types and user-defined data types. Algorithms consist of a series of
    control structures. The sequential, case, and loop structures described in this
    chapter are the most fundamental control structures in program design, and they
    are also the basis of complex algorithms.


    # An Overview of C++ Language


    # 2.1.1 Origins of C++


    C++ originates from the C language. Thus, to understand C++ better, the history
    of the C language should be reviewed first. The C language was first realized
    on a DEC PDP-11 computer in 1972. Dennis Ritchie, working in Bell Laboratory,
    created it based on the B language. After that, continuous improvements have been
    made and nowadays the popular C languages are based on ANSI C.


    The C language has many advantages, such as its simplicity and agility, its abundant
    operators and data structures, its structured controlling statements, and its
    high efficiency when executing programs. It combines the advantages of both high-level
    languages and assembly language: compared with other high-level languages, the
    C language can access physical address; while compared with assembly language,
    it has better readability and portability. Because of all these features, the
    C language has been widely used by numerous programmers, and there are many library
    codes and developing environments.


    However, since C language is a procedure-oriented programming language, like other
    procedure-oriented languages, it cannot meet the needs of software development
    that uses object-oriented methods. C++ was then created from C to support object-oriented
    programming. It is a general-purpose language. It was created by Bjarne Stroustrup,
    a doctor at AT&T Bell Labs, in 1980.


    Since the primary objective in creating the C++ language was to make it a better,
