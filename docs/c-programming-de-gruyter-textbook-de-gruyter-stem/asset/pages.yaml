    In the above program, each derived class defines its own new members, while retaining
    the members inherited from the base class without change. The derived-class constructor
    needs to initialize new members. When creating a derived-object, the system will
    first call the base-class constructor to initialize the members inherited from
    the base class and then the derived-class constructor to initialize new data members.


    Each derived class has the function pay(). In main(), when calling the pay() through
    a derived-class object, according to the hiding rule, the system will call the
    function declared in the derived class. The empty function in the base class only
    regulates the base behaviors of the derived-classes in the class family.


    The employee number starts from 1,000 and increases by 1 each time. The static
    data member employeeNo is initialized outside the class and is shared by all objects
    of the entire class.


    The program has two shortcuts:

    Firstly, the function fun() declared in the base class is to empty, but we still
    need to write the function body as its implementation, which seems redundant.
    However, we should keep it to uniformly regulate the base behaviors of the class
    family. This problem can be solved by using virtual functions, which will be introduced
    in the next chapter.


    Secondly, in main(), four objects of different classes are created. To perform
    similar operations on these objects (e.g., input name, output basic person-information)
    we have to write similar functions four times. We can use the base-class pointer
    array to point to multiple derived-class objects and deal with them according
    to the type compatible rule? From what we have learned so far, this is possible
    since base-class pointer can only point to base-class members, while here we need
    to access the pay() functions declared in different classes. Again, this problem
    can be solved by using the virtual functions introduced in the next chapter.


