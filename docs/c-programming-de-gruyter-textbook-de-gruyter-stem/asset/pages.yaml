- pgno: 19
  md: '# 2 — 1 Introduction


    a computer to recognize, it is too obscure for human beings to understand, let
    alone to remember. However, in the early years of computers software engineers
    could only use the machine language to write programs. At that time, there was
    huge gap between natural human language and the computer programming language.
    It took great difficulty and long cycles for software developing, while the developed
    software had simple functions and unfriendly interfaces.


    Before long, assembly language was developed to map the machine instructions onto
    some mnemonic symbols, such ADD and SUB. The gap between the programming language
    and human language is somewhat reduced, while the machine language is still far
    from the human mind. Since machine language is pretty weak in abstraction, programmers
    still need to consider a great many machinery details.


    Nevertheless, it is still a big progress from the machine language to assembly
    language. It means that it is not necessary for human beings and the computer
    hardware system to share a same language. Programmers can use languages that suit
    man''s ways of thinking, while the computer hardware system only needs to recognize
    machine instructions. Then, how to realize the communication between the two languages?
    A translation tool (software) is needed. The translator for an assembly language
    is called an assembler, which transforms the mnemonic symbols written by programmers
    into machine instructions, and then the computer can recognize and execute these
    instructions.


    # 1.1.2 High-level Language


    The emergence of high-level language is a great progress in programming language.
    It masks the details of a machine, and raises the level of abstraction. In programs
    we can name variables with specific meanings and use statements that are easier
    to understand. Through this we can correlate the specific objects a program describes
    when we write the program.


    Structured programming that emerged in the early 1960s further enhanced the programming
    level. Concepts such as structured data, structured statements, data abstraction,
    and procedure abstraction made programs more easily reflect the structures and
    logic of objects. This further reduced the gap between the programming language
    and natural language, while their differences remained negligible. The main problem
    was the separation between data and operation in a program, making it difficult
    to create components that could closely respond to objects in the real world.


    Today there are several widely-used high-level programming languages, including
    Fortran, BASIC, Pascal, C, etc. The C++ programming language this book introduces
    is also a high-level programming language, although it has some fundamental differences
    from other procedure-oriented languages.'
