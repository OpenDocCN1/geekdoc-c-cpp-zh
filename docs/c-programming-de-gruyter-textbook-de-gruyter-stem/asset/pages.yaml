    As a fundamental way to understand problems, abstraction is not new to us. Abstraction
    in the object-oriented method is a procedure in which specific issues (objects)
    are summarized and abstracted into the common attributes of a class of objects;
    it also includes the procedure of describing these attributes. The procedure of
    abstraction is also a procedure of analyzing and understanding problems. In the
    development of object-oriented software, we should find the specific procedure
    to solve it. Generally, the abstraction of a problem includes two types: abstraction
    of data and abstraction of behavior (or code). The former describes the attributes
    or states of a class of objects, i.e., the characteristics used to distinguish
    this class of objects from other classes; the latter describes the common behavior
