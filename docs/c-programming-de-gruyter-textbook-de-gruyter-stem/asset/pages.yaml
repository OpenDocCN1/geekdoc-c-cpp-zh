    As we can see, class Circle includes data of type float. We are used to using
    basic types of C++ as the components of a class. In fact, the data member of a
    class can be either basic type or user-defined type, or a class object. So we
    can use the method of combination, using existing class objects to build new class.
    These combined classes, compared with integrated classes, are easier to design
    and implement.


    The combination of classes describes the situations where a class object is embedded
    in another class as a data member. The relationship between the two classes is
    of including and embedded. For example we use a class to describe the computer
    system. We can divide it into hardware and software. Hardware includes CPU, memory,
    and I/O devices; software includes system software and application software. Each
    of these components can be further divided. From the view of class, a complex
    problem using the method of combination, which conforms to the logic of stepwise
    refinement.


    When defining an object, if there are embedded object members in this class, then
    each embedded object is to be created automatically, because the component object
    is a part of the complex object. Thus, when creating an object, both the basic
    type members and the embedded object members should be initialized. It is important
    to understand the order of calling these objects'' constructors.


    The general form of the constructor of a combined class is:


    ```

    Class_name::class_name(parameter_list):embedded_object1

    (parameter_list), embedded_object2(parameter_list), ...

    { initialization of class }

    ```


