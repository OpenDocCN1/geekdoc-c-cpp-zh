    # 6.2.1 Access Method of Memory Space


    The memory of a computer is divided into many storage locations that are numbered
    by certain rules. The number of a storage location is its address. The basic unit
    of address coding is the byte, and each byte is composed of 8 bits. In other words,
    each byte is a basic memory location and has an address. Computers use this to
    accurately locate storage locations to manage the reading and writing of memory
    data. Figure 6.5 is a simplified block diagram of memory structure.


    How can C++ access data using memory locations? One way is using the name of the
    variable; the other way is using the address of the memory location. Variables
    declared by a program will occupy some memory space. For example, a Short-type
    variable occupies 2 bytes, and a long-type variable occupies 4 bytes. The memory
    space of variables with static life periods has been allocated before a program
    starts, while the memory space of variables with dynamic life periods will not
    be allocated until the running program meets the declaration statement. When the
    memory space of a variable has been allocated, its name becomes the name of the
    corresponding memory space. During the whole life period of the variable, we can
    use this name to access the memory space, which is represented in the program
    as using the variable name to access the content of variable. However, when it
    is inconvenient to use the variable name or there isn''t any variable name to,
