  md: '# 2.4 The Fundamental Control Structures of Algorithms


    After studying data types, expressions, assignment statements, and data input/output,
    we can write programs that can achieve simple functions. However, the programs
    we write now are only statement sequences of an ordered execution. In fact, the
    objective is not simple, and the ways to solve problems usually cannot be described
    clearly using this kind of ordered steps.


    For example: the following piecewise function calculates the value of y when entering
    a value of x.


    ```

    y = { -1 (x < 0) \n     0 (x = 0) \n     1 (x > 0) }

    ```


    It is not hard to calculate this problem, while the question is how to use programming
    languages to describe this calculation clearly and instruct the computer to do
    the calculation. Apparently, we cannot describe it using an ordered statement
    sequence. We must pass judgment be selective: we need to use selective control
    structures.


    See another simple example: count the average height of an arbitrary crowd. This
    is a simple calculation that every primary school students can do. But when the
    statistical data is very large, we have to use computers. The only advantage of
    a computer is its high calculation speed, since we have to describe the calculation
    method accurately for it. The major part of this algorithm is the accumulation,
    although to repeat the same action many times using ordered statements is clearly
    inappropriate (and impossible when there are large amounts of data). In this case
    we need a loop control structure.


    There are three types of basic control structures: the sequential structure, case
    structure, and loop structure. The simplest one is the sequential structure, which
    we have already studied. Here we will introduce the case structure and loop structure.
    First of all, we will introduce flow charts. A flow chart is used to describe
    an algorithm. Compared with natural language, a flow chart is simple, intuitive,
    and accurate. The symbols used in flow charts are listed in Figure 2.4.


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_66_0.png)


    Fig. 2.4: Standard symbols in flow charts.'
