  md: '# # 1 Introduction


    This chapter briefly introduces the history and characteristics of object-oriented
    programming languages, the origin of the object-oriented method and its basic
    concepts, and the definition of object-oriented software engineering. Additionally,
    we will introduce how information is represented and stored in a computer and
    the development process of a program.


    # ## 1.1 The Development of Computer Programming Languages


    A language is a system with a set of grammatical and morphological rules. Language
    is a tool for thinking, and thoughts are expressed by languages. A computer programming
    language is a language that can be recognized by computers. It describes solutions
    to problems, which can be read and executed by computers.


    # ### 1.1.1 Machine Language and Assembly Language


    Since the birth of the first digital computer in the world – ENIAC, in February
    1946, computer science has developed rapidly in the past 50 years. Computers and
    their applications have penetrated into various areas of society, effectively
    promoting the development of the whole information society, wherein the computer
    has become an essential tool.


    A computer system consists of software and hardware. It is not only the strong
    hardware but also the software system that makes a computer system powerful. The
    software system consists of all programs a computer needs for running, as well
    as the relevant documents. The work of a computer is controlled by programs, and
    a computer can do nothing without a program. A program is a set of instructions.
    Software engineers translate their instructions to problems and their procedures
    into a series of instructions, which make up programs, and input these programs
    into the computer system system. The computer executes the instruction sequence
    to complete the scheduled task.


    **The so-called instructions are commands that can be recognized by computers.**
    We know that every ethnic group has languages for expression, communication, and
    reordering, while these languages are difficult for a computer to recognize. The
    only instruction types that a computer can recognize are simple combinations of
    0s and 1s. The set of instructions that can be recognized by the hardware system
    of a computer is called the instruction system.


    **All binary instructions that can be recognized by the hardware system constitute
    machine language.** Undoubtedly, though machine language is easy for'
