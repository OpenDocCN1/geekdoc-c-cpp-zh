    # 2.3 Data Input and Output


    # 2.3.1 I/O Stream


    C++, the movement of data from one object to another using it, is abstracted as
    a “stream”. One should establish a stream before using it, and delete it after
    use. To get data out from a stream is called an extract operation, and to put
    data into a stream is called an insert operation. I/O stream is used to achieve
    data input and output, and **cin** deals with standard inputs, i.e., input from
    terminal. **cout** deals with standard outputs, i.e., output directed to terminal.


    # 2.3.2 Predefined Input and Output Operator


    “<<” is the predefined input operator. Using it on the stream-type object **cout**
    can achieve most general screen outputs. The format is:


    ```

    cout<< expression<< expression...

    ```


    You can use successive output operators in one statement to output several data
    items. You can write any compound expression after the output operator, and the
    compiling system will calculate its value and deliver it to the output operator
    automatically. For example:


    ```

    cout<<''Hello!\n";

    ```


    It outputs the character string “Hello!” to the screen and then jumps to a new
    line.


    ```

    cout<<''a+b=''<<a+b;

