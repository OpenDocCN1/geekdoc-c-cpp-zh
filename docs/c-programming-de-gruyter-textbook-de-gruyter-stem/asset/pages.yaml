    # 7.6.1 Fundamental Principles


    Suppose there are n linear equations, (to conveniently represent an array in C++,
    the suffix in equations starts from 0)


    ```

    $$\begin{cases} a_{00}X_0 + a_{01}X_1 + \dots + a_{0,n-1}X_{n-1} = b_0 \ a_{10}X_0
    + a_{11}X_1 + \dots + a_{1,n-1}X_{n-1} = b_1 \ \vdots \ a_{n-1,0}X_0 + a_{n-1,1}X_1
    + \dots + a_{n-1,n-1}X_{n-1} = b_{n-1} \end{cases}$ (7.1)

    ```


    The matrix form of the above equations is Ax = b, where **A** is the coefficient
    matrix, **x** is the column vector, which is the solution of the equations, and
    **b** is also a column vector. Generally, we can assume that **A is a nonsingular
    matrix**. For more knowledge about matrices, please refer to books on linear algebra.


    Put the coefficient matrix **A** and **b** together to make an augmented matrix
    **B**.


    ```

    $a = \begin{pmatrix} a_{00} & a_{01} & \dots & a_{0,n} \ a_{10} & a_{11} & \dots
    & a_{1,n} \ \vdots & \vdots & \ddots & \vdots \ a_{n-1,0} & a_{n-1,1} & \dots
    & a_{n-1,n-1} \end{pmatrix}, x = \begin{pmatrix} x_0 \ x_1 \ \vdots \ x_{n-1}
    \end{pmatrix}, b = \begin{pmatrix} b_0 \ b_1 \ \vdots \ b_{n-1} \end{pmatrix}$
    (7.2)

    ```


    ```

    $B = (A, b) = \begin{pmatrix} a_{00} & a_{01} & \dots & a_{0,n} & b_0 \ a_{10}
    & a_{11} & \dots & a_{1,n} & b_1 \ \vdots & \vdots & \ddots & \vdots & \vdots
    \ & & a_{1,j1} & \dots & & \ a_{n-1,0} & a_{n-1,1} & \dots & a_{n-1,n-1} & b_{n-1}
    \end{pmatrix}$ (7.3)

    ```


    The complete elimination is carried out on matrix **B**. The whole process is
    divided into two steps:


    # 1. Elimination


    For k starting from 0 to $n - 2$, do the following three steps:


    +   a) Select the element with the largest absolute value in the submatrix, which
    starts at row k and column k of $A$, for example:


    ```

    $|a_{i1,j1}| = \max |a_{ij}| \neq 0 \_{{k \le i < n \ k \le j < n}$ (7.4)

    ```


    Then swap the $k$-th row and the $i_1$-th row, as well as the $k$-th column and
    the $j_1$-th column. So the element with the largest absolute value in this submatrix
    is moved to the $k$-th row and $k$-th column:


    +   b) Normalization. The method is:


    ```

    $a_{kj} = a_{kj}/a_{kk}, \quad j = k + 1, \dots, n - 1 \ b_k = b_k/a_{kk}$ (7.5)

    ```'
