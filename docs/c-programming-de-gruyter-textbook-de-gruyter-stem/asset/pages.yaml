  md: '# 260 — Inheritance and Derivation


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_277_0.png)


    Fig. 7.1: UML hierarchy of vehicles.


    The top layer of the tree has the highest degree of abstraction, representing
    the most universal and common concept. Each lower layer has all the features of
    its upper layer, while adding its own features. The lowest layer represents the
    most concrete concepts. In this hierarchy, from top to bottom it is a specification
    process, and from bottom to top it is a generalization process. The relationship
    between upper and lower layers can be seen as the relationship between base classes
    and derived classes.


    Recall the examples of the personnel information management system in Chapters
    4 to 6. The problem concerns a small corporation that has four groups of people:
    managers, part-time technicians, sales managers, and part-time salesmen. Our task
    is to store the name, ID number, rank, and the monthly salary of each staff, to
    calculate the total salary and display all the information. Among these items,
    a staff ID should be generated at the staff information is created, which is the
    current maximum staff ID plus 1. The current maximum staff ID will be automatically
    increased by 1 each time we create a set of information for staff member. These
    functionalities were realized in Chapter 6. In this chapter, we will implement
    specific promotion functions according to different groups of people. The calculation
    methods for the salaries are: a manager gets a fixed salary; a part-time technician
    gets a salary at an hourly rate; a part-time salesman gets a commission based
    on his sales; and a sales manager gets both a fixed salary and a commission.


    We cannot describe the information of the four groups of people with one class
    since they have different processing methods (etc.). In this case, we can describe
    the four groups of people by four classes respectively. On the other hand, the
    four classes have many attributes that each class, e.g., name, ID no., rank, and
    salary. There are also some member functions that each class has but are implemented
    in different ways, promotion function, salary calculating function, etc.'
