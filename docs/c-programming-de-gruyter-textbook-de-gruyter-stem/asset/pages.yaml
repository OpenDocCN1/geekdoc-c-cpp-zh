    # 8.7 Summary


    We introduced an important feature of class: polymorphism. Polymorphism means
    that different objects behave differently when they are given the same message.
    It is another abstraction of member functions. The call by member functions is
    the ''message'' and different behaviors are due to different implementations,
    i.e., calling different functions.


    The polymorphism in C++ can be divided into four groups: overload polymorphism,
    coercion polymorphism, inclusion polymorphism, and argument polymorphism. The
    former two fall into the category of special polymorphism while the latter two
    belong to general polymorphism. Overloads of ordinary functions and member functions
    act on objects of different types. Coercion polymorphism converts the type of
    a variable by semantic operation to meet the requirement of a function or an operation.
    Inclusion polymorphism investigates polymorphic behaviors of member functions
    with the same name in different classes of the same class family. It is implemented
    by virtual functions. Argument polymorphism is related to class attributes, which
    are class templates that can be parameterized. The types related to the included
    operations must be instantiated by type arguments. Different classes instantiated
    by class attributes have the same operation but the types of objects are different.
    This chapter introduced overload and inclusion polymorphism. Operator overload
    and virtual function are key learning objectives of this chapter.


    Polymorphism is divided into two groups in terms of implementation: compiling
    polymorphism and executing polymorphism. For the former group, the specific operation
    objects are determined during compiling while for the latter group they are decided
    dynamically during execution. The process of determining operation objects is
    called ''binding.''


    Operator overload makes existing operators more versatile and to operate on user-defined
    types (as class). Operator overload is essentially function'
