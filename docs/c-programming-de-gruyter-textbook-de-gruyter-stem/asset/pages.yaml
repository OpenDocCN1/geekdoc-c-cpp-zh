  md: "# 4.2 Class and Object 121\n\n# 3. Inline Member Function\n\nWe know that calling\
    \ a function costs some memory resources and CPU time to pass parameters, to return\
    \ value, and to record the calling state in order to correctly return and after\
    \ the call finished. If a member function needs to be called frequently, and the\
    \ code is simple, such a function can also be defined as an inline function. Unlike\
    \ the ordinary inline function inserted in Section 3, the body of an inline member\
    \ function will be inserted wherever it is called at compiling time. By doing\
    \ this, the cost of function call is reduced and the execution efficiency is improved,\
    \ while the code length after compiling is increased. So we should carefully weigh\
    \ the pros and cons, and only define simple member functions as inline functions.\n\
    \nTwo ways can be define an inline function: implicit definition and explicit\
    \ definition.\n\nImplicit definition puts the function body directly into the\
    \ class body. For example, to define the member function ShowTime() of class Clock\
    \ as an inline function, we can write:\n\n```\nclass Clock\n{\npublic:\n    void\
    \ SetTime(int NewH, int NewM, int NewS);\n    void ShowTime()\n    cout<<Hour<<\"\
    :\"<<Minute<<\":\"<<Second<<endl;\nprivate:\n    int Hour, Minute, Second;\n};\n\
    ```\n\nTo keep the definition simple, we commonly use the keyword inline to define\
    \ a function explicitly. That is to say, we put the keyword inline before the\
    \ function's return type in the function definition, and don't include the body\
    \ of ShowTime() in the definition of class:\n\n```\ninline void Clock::ShowTime()\n\
    {\n    cout<<Hour<<\":\"<<Minute<<\":\"<<Second<<endl;\n}\n```\n\nIt is the same\
    \ as the inline declaration mentioned above.\n\n# 4.2.4 Object\n\nClass is an\
    \ abstraction mechanism; it describes the common attributes and behaviors of a\
    \ type of problem. In C++, an object of a class is a specific entity (or instance)\
    \ of the class. For instance, take all the employees in a company as a class,\
    \ and then each employee is a specific instance, i.e., an object."
