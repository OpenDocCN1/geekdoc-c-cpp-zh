  md: '# 7.5 Identification and Access of Derived-Class Member


    We have learned the syntax rules of class inheritance and derivation around three
    procedures: accepting base class members, modifying base class members, and adding
    new members. A class family is formed through class derivation. In this section,
    we will focus on some issues in the uses of derived classes, including the identification
    and access of the derived class and its object members (including members inherited
    from the base class and newly added members).


    In the derived class, members can be classified into four groups according to
    their access attributes:


    # Inaccessible Members


    These members are inherited from the private members of the base class. Neither
    the derived class nor the modules creating objects of the derived class can access
    them. If the derived class continues to derive new class, these members remain
    inaccessible.


    # Private Members


    These members can be inherited from the base class or newly added members. They
    are accessible inside the derived class, but are inaccessible in the modules establishing
    objects of the derived class. Further derivation will make these private members
    become inaccessible members in newly derived classes.


    # Protected Members


    These members can be inherited from the base class or newly added members. They
    are accessible inside the derived class, but are inaccessible in the modules establishing-objects
    of the derived class. Further derivation will make these protected members become
    private or protected members in newly derived classes.


    # Public Members


    These members can be accessed by the derived class or the modules establishing-objects
    of the derived class. Further derivation will make these public members become
    private, protected, or public members in newly derived classes.


    Two problems remain to be solving in a derived class. The first one is about unique
    identifiers and the other is about the access attributes of class members, or
    more specifically, their visibility. We can only access members with their unique
    identifiers. If more than one member can be referred to by one expression, then
    this case is called ambiguity. The ambiguity problem is the unique identifier
    problem that will be discussed in this section.


