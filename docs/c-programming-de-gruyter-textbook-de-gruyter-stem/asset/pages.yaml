  md: 'i.e., the new class inherits the characteristics of the original class, the
    original class derives the new class. The procedure of deriving a new class includes
    three steps: accepting members inherited from the original class, modifying existing
    members, and adding new members. We focus on the access controls of base-class
    members and the addition of constructors and destructors, under different kinds
    of derivations. We discuss the unique identification and access of derived-class
    members in more complicated inheritance relationships. Finally, we discuss the
