  md: '# 8 Polymorphism


    The power of object-oriented programming lies not only in inheritance, but also
    in its ability to treat a derived-class object like a base-class object. It is
    polymorphism and dynamic binding that support this mechanism.


    # 8.1 An Overview of Polymorphism


    Polymorphism means that different objects behave differently when they are given
    the same message. The call by member functions is the ''message'' and different
    behaviors are due to different implementations, i.c., calling different functions.
    Polymorphism is quite often used in programming. The most common example is the
    math operator. We use the same sign ''+'' to implement adding operation over integers,
    floats, and double precision floats. The same message, adding, is accepted by
    different objects or variables, and different variables carry out the adding operation
    in different ways. If the adding operation is performed on variables of different
    types, e.g., a floating and an integer, the first will be converted to a floating
    point before adding. This is a typical polymorphism.


    # 8.1.1 Types of Polymorphism


    Object-oriented programming can be divided into four types: overload polymorphism,
    coercion polymorphism, inclusion polymorphism, and argument polymorphism. The
    former two fall into the category of special polymorphism, while the latter two,
    general polymorphism. Overloads of ordinary functions and of of class member functions
    are both overload polymorphism. We will learn operator overloading in this. The
    example of the add operation between floating numbers and integers is an example
    of overload. Coercion polymorphism is converting the type of a variable to meet
    the requirement of the function or operation. When adding a floating number and
    an integer, first we should do coercion to convert an integer to a floating number.
    This is an example of coercion polymorphism.


    Inclusion polymorphism is investigating behaviors of the member functions with
    the same name in different classes within a class family. It is implemented using
    virtual functions. Argument polymorphism and class templates (to be introduced
    in Chapter 9) are related to each other. This polymorphism must be assigned an
    actual type before realization. So, all classes instantiated from the class template
    have the same operations, but the types of operands are different.


    This chapter mainly introduces overloading and inclusion polymorphisms. Function
    overloading has been elaborated in Chapters 3 and 4. Here we mainly introduce
    operator overload. Virtual function is the main issue of polymorphism.


    https://doi.org/10.1515/9783110471977-008'
