    Only virtual functions are bound dynamically. If the derived class needs to modify
    base-class behaviors (i.e., override the function with the same name), then the
    function should be declared virtual in the base class. Those functions that are
    not virtual functions cannot be modified by the derived class. They cannot become
    polymorphic. So, one usually should not override the nonvirtual functions inherited
    from the base class as syntax does not prevent the programmer from doing so.


    When the virtual function inherited from the base class is overloaded, and the
    function has a default formal argument value, one should never redefine different
    values. The reason is that the default formal argument value is bound statically,
    although the virtual function is bound dynamically. To that say, the virtual function
    in a derived class can be accessed by a base-class pointer pointing to a derived-class
    object. The default formal argument value, however, can only be defined in the
    definition of the base class.


    # 8.3.2 Virtual Destructor


    In C++, one is not allowed to declare a virtual constructor, but it is legal to
    declare a virtual destructor. Destructors do not have types or arguments. Compared
    to ordinary member functions, destructors are simpler.


    The syntax of a virtual destructor''s declaration is as follows:


    ```

    virtual~class name();

    ```


    If the destructor of a class is a virtual one, then all child classes'' destructors
    are all virtual destructors. After setting a destructor to be virtual one, the
    pointer and reference are bound dynamically to implement execution polymorphism.
    And the base classes'' pointer can be used to call an appropriate destructor to
    clean up according to different objects.


    To sum up, if it is possible to call an object''s destructor by a base-class pointer
    (by delete), and an object to be destructed is an object of the class that has
    an important overloaded destructor, then the base-class destructor should be a
    virtual function.


