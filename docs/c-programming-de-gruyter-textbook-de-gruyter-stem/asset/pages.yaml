  md: "# 3 Functions\n\nC++ inherits all the syntax, including the definition and\
    \ usage of functions. Process-oriented programming (also known as structured programming),\
    \ function is the basic unit of module division, and an abstract of the problem-solving\
    \ process. Function is also important in object-oriented programming, which it\
    \ is an abstract of functionalities.\n\nTo develop or debug a complex system,\
    \ engineers will divide it into several subsystems. Subprograms in high-level\
    \ program languages are used to realize this kind of module division. In C and\
    \ C++, subprograms are embodied as functions. We usually abstract functions from\
    \ independent and frequently used functionality modules. Once a function is written,\
    \ we can reuse it only knowing its functions and usage, without needing to know\
    \ its specific implementation. In what code is reused, development efficiency\
    \ and program reliability are improved, and collaboration, modification, and maintenance\
    \ can be realized more easily.\n\n# 3.1 Definition and Use of Function\n\nA C++\
    \ program consists of one main function and several subfunctions. A program is\
    \ executed starting from its main function. The main function can call subfunctions,\
    \ and subfunctions may turn call other subfunctions.\n\nThe function that calls\
    \ others function is named a \"calling function\", and the function called by\
    \ others is named a \"called function\". A function may call another function\
    \ and also be called by another. Thus it can be a calling function in one occasion\
    \ and a called function in another.\n\n# 3.1.1 Definition of Function\n\n+   1.\
    \ Syntax form of function definition\n\n```\nType identifier Function name (Formal\
    \ Parameter list)\n{\n  Statements\n}\n```\n\n+   2. Type of function and return\
    \ value\n\nThe identifier defines the type of the function, and also the type\
    \ of the return value of the function. The return value of the function is the\
    \ result that the function returns to its calling function, which is given by\
    \ a return statement, such as \"return O\"."
