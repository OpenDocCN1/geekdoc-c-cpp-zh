  md: '# 10 Generic Programming and the Standard Template Library


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_419_0.png)


    Fig. 10.1: Relationship between STL components.


    STL is the core component of the C++ standard library. STL implements general
    containers and iterators, which are the basis of algorithm templates. There are
    four key components in STL: containers, iterators, algorithms, and function objects
    as shown in Figure 10.1. As indicated, the algorithm is in the center of the structure.
    The algorithm uses iterators to obtain data from the container, operates on it
    with the function objects, and then sends the result to another container through
    another iterator.


    # 10.1.2 Namespace


    There are many modules in complex software, including different libraries and
    classes provided by different programmers. These might contain naming conflicts
    among these modules, i.e., different things represented by the same identifier.
    A namespace is the way of resolving this problem in C++.


    A namespace restricts a set of identifiers in a named scope. So it is possible
    to have the same identifier in a different named scope. Programmers use "the name
    of namespace" + "::" to refer an object in the named scope. For example, the following
    code declares a namespace NS and some identifiers in it:


    ```

    namespace NS {

    class File;

    void Fun();

    }

    ```


    The way to refer to these identifiers is the following:

    NS::File obj;

    NS::Fun();'
