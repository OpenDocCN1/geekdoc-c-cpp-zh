  md: '# 1.2 Object-oriented Method — 3


    # 1.1.3 Object-oriented Language


    The fundamental difference between an object-oriented language and formerly programming
    languages is that it is designed to describe real objects in the world and their
    relationships more directly.


    We develop software to solve problems. The business scope a problem involves is
    the **problem domain**. Object-oriented programming language treats things in
    the real world as objects with attributes and behaviors (or services), and classifies
    objects with common attributes (static features) and behaviors (dynamic features)
    through abstraction, calling them **class**. By **using** class inheritance and
    polymorphism, we can easily realize reuse code, significantly shorten the development
    cycle, and make the software style unified. Therefore, an object-oriented programming
    language can make a program reflect the real problem domain, and software developers
    can use such normal ways of human thinking to develop software.


    Object-oriented programming has experienced a long stage of development. For instance,
    LISP-family''s object-oriented language, Simula6, Smalltalk, CLU, Ada, and Modula-2
    are all programming languages that more or less use the concept of “object oriented",
    among which Smalltalk is the first “true” object-oriented programming language.


    However, the most widely used object-oriented (OO) programming language is C++,
    which is extended from C. Since C++ is compatible with C and C is already familiar
    to most programmers, C++ has naturally become the most widely used OO programming
    language.


    # 1.2 Object-oriented Method


    A programming language is a tool for writing programs, so the progress of a programming
    language reflects the progress of programming design methods. We will here first
    introduce the basic concepts of the object-oriented method. We believe that after
    reading this book, you may have a sound and complete comprehension of object-oriented
    method.


    # 1.2.1 The Origin of Object-oriented Method


    Before the emergence of object-oriented method, we had been using a procedure-oriented
    design method. In the early days computers were used for mathematical computations,
    such as computing a ballistic trajectory, people had to design a method, or procedure.
    Therefore, the main work for software design was to figure out a procedure to
    solve the problem.'
