    Operators have precedence and associativity. When an expression contains more
    than one operator, the operation with of higher precedence should be done first,
    and then the operations with the operators of lower precedence. If there are several
    operators of same precedence in an expression, the operation order depends on
    the operator''s associativity. Associativity means the computation sequence when
    the operators on both sides of the operand have the same precedence. It can be
    from left to right or from right to left.


