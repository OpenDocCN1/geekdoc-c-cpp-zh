    When creating an object of a combined class, not only its constructor will be
    called, but also the constructors of its embedded objects will be called. The
    calling order is:


    +   1. Call the constructors of the embedded objects according to their definition
    order in the class.

    2. Call the constructor of the combined class.


    When defining an object of a combined class, if there is no initial value given
    for the object, the default constructor (with no parameter) will be called, and
    the default constructors of the embedded objects will be called together. The
    calling order of destructors is exactly the opposite as that of constructors.


    How does one write a copy constructor for a combined class? If the programmer
    has not written a copy constructor, the compiler system will generate a default
    copy constructor when needed. If this default copy constructor is called when
    creating an object, the compiler will automatically call the copy constructors
    of the embedded objects.


    If we want to write a copy constructor for a combined class, we also need to pass
    parameters for the copy constructors of the embedded objects. For example, suppose
    object of b is embedded in class C. Then the copy constructor using class C will
    be like this:


    ```

