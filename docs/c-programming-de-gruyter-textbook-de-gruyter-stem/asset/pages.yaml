    \ the class body. Different from ordinary functions, a member function should\
    \ specify its class name when it is implemented. The implementation is:\n\n```\n\
    Return Type _ ClassName::Member Function Name (parameters)\n{\n    Function body\n\
    }\n```\n\n# 2. Member Function with Default Formal Parameters\n\nIn Chapter 3\
    \ we introduced functions with default parameters. Member functions can also have\
