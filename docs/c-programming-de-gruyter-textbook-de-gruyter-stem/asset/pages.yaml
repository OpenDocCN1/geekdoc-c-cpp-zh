  md: '# 80 — 3 Functions


    The function without a return value has a type identifier of void, and there need
    be a return statement in the function.


    # 3. Formal parameters


    Here is the form of a formal parameter list:


    ```

    type 1 name1, type 2 name2, ..., type n name

    type1, type2,..., type n are identifiers that represent the types of formal parameters,
    and name1, name2,..., name n are the names of formal parameters. Formal parameters
    are used to realize the connection between the called function and the calling
    function. We often let the data that need to process, factors that affect the
    function''s behavior, or the processing results of the function be the function''s
    parameters. Functions without formal parameters should have void on the position
    of the parameter list.

    ```


    The main function can also have formal parameters and a return value. The formal
    parameters of the main function also called command line parameters, which are
    initialized by the operating system when starting the program. The return value
    of the main function is returned to the operating system. The types and number
    of parameters of the main function have a special format. Refer to the experiment
    instructions in <Student''s Book> to write programs with command line


    A function is only a piece of text before it has called, and its formal parameters
    at the time are just symbols, indicating what type of data should appear at the
    position of the formal parameter. A function starts execution when it is called,
    and at that time, the function assigns the actual parameters to the formal parameters.
    This is similar to the definition of a function in mathematics:


    ```

    f(x) = x² + x + 1

    ```


    The function f will not be calculated until its argument has been assigned a value.


    # 3.1.2 Function Calls


    # 1. Form of function calls


    Before calling a function we first need to declare the function prototype. The
    declaration can be in the calling function or before all the functions, with the
    following form:


    ```

    Type identifier Function name(Formal parameter list with declarations);

    ```


    If a function prototype is declared before all the functions, it is effective
    in the whole program file. That is, we can call the corresponding function anywhere
    in the file according to the prototype. If a function prototype is declared inside
    a calling function, it is only effective in this calling function.'
