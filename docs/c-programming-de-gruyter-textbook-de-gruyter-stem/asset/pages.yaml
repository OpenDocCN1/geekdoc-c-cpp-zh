    # 6.2.2 Declaration of Pointer Variables


    A pointer is also a kind of data type, and variables of the pointer type are called
    pointer variables. A pointer variable is used to store a memory address.


    Accessing a variable by its name is direct, while accessing a variable by a pointer
    is indirect. Suppose that you want to find a student and don''t know where he
    lives, though you know his address can be found at Room 201. When you walk into
    Room 201, you see a note "Please come to 302 to find me". Then you go to Room
    302 specified in the note and find the student. Here, Room 201 equals a pointer
    variable, and the word in note is the content that the pointer variable stores.
    The student who lives in Room 302 equals the content of the pointer variables.


    Pointer should be declared before being used. The grammatical form of declaring
    a pointer is


    ```

    Data type *identifier;

    ```


