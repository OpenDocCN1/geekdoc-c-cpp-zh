  md: "Example 3.4: Find the number $m$ between 11 and 999 where $m, m^2$, and $m^3$\
    \ are all palindromes, and then output $m$.\n\nPalindromes are numbers that have\
    \ symmetrical digits. For example: 121, 676, and 94249 are all palindromes. One\
    \ instance that satisfies this subject's requirement is: $m=11, m^2=121, m^3=1331$.\n\
    \nAnalysis: To check whether a number is a palindrome or not, we can get every\
    \ digit of the number by continuously dividing it by 10 and obtaining the remainders.\
    \ After getting all the digits, we reverse the digit order to get a new number,\
    \ and compare the new number with the original. The original number is a palindrome\
    \ if and only it is the same as the new number.\n\nSource code:\n\n```\n//3_4.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    bool symm(long n)\
    \ {\n        long m;\n        for(m=11;m<1000&&;m++)\n            if (symm(m)&&symm(m*m)&&symm(m*m*m))\n\
    \                cout<<\"m=\"<<m<<\" m*m=\"<<m*m<<\" m*m*m=\"<<m*m*m<<endl;\n\
    \    }\nbool symm(long n) {\n    long i, m;\n    i=n ; m=0;\n    while(i) {\n\
    \        m=m*10+i%10;\n        i=i/10;\n    }\n    return ( m==n);\n}\n```\n\n\
    Running result:\n\n| m=11 | m*m=121 | m*m*m=1331 |\n| m=101 | m*m=10201 | m*m*m=1030301\
    \ |\n| m=111 | m*m=12321 | m*m*m=1367631 |"
