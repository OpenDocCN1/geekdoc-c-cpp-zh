    # 4.4 Combination of Classes


    Lots of problems in the real world are too complicated to imagine, but complex
    problems can be divided into simpler subproblems. By gradual division, we can
    finally describe and solve the problem. This method of division and combination
    has been widely used in industry for a long time. For example, an important part
    of television is the kinoscope, and many TV factories choose to buy kinoscopes
    from special kinoscope producers instead of producing kinoscopes themselves. At
    the same time, a kinoscope producer may sell kinoscopes to many TV factories.
    Through specialization and coordination, productivity is largely improved. Now
    an important way to improve the productivity of software is to achieve the industrial
    production of software. In object-oriented programming design, we can divide and
    abstract complex object into a combination of simpler objects, and it using component
    objects that are easy to understand and implement.


