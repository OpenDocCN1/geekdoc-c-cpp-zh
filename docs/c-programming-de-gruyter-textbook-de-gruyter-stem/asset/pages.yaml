    Integer constants are integers in the form of literals. They include positive
    integers, negative integers, and zero. Integer constants can be represented in
    the decimal, octal, or hexadecimal form.


    The general form of a decimal integer constant is the same as that in mathematics:


    > [±] several numbers from 0 to 9


