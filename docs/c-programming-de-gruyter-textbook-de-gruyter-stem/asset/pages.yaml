  md: '# 7 Inheritance and Derivation


    Programming mainly aims at describing and solving problems in the real world.
    Class in C++ effectively adopts human thinking methods of abstraction and classification.
    The relationship between an object and a class appropriately reflects the relationship
    between an individual and a group that has common features. A closer observation
    of the real world reveals that different things are not independent from each
    other, but instead they have complicated relationships. Inheritance is one such
    relationship. For example, children resemble their parents, while clear distinctions
    exist between them. Both cars and bicycles belong to an abstract category: vehicles,
    they differ from each other only in appearance but also in performance.


    Object-oriented programming provides the inheritance mechanism of class. It allows
    programmers to define more specific and detailed classes based on the characteristics
    of an existing class. We say that A inherits from class B if A is a new class
    created on the basis of B. The advantages of inheritance are that codes can be
    reused and extended. The inheritance mechanism allows for the full utilization
    of researches and achievements. Also, after a software product has been developed,
    if new problems arise or we have better understandings of the original problem,
    the inheritance mechanism allows for efficient modifications or extensions of
    the existing software.


    The process of deriving a new class from an existing class includes three steps:
    selecting the existing class members, adjusting the existing class members, and
    adding new class members. This chapter is focused on this process of derivation.
    We will discuss the access controls of base class members, and the additions of
    constructor and destructor under different inheritance modes. We will then discuss
    the unique identification and visibility issues of class members under more complicated
    inheritances. In the last section of the chapter, two practical examples of inheritance
    will be given, respectively demonstrating how to solve a set of linear equations
    by the Gaussian pivoting elimination method and how to construct a personnel information
    management system for a small corporation.


    # 7.1 Inheritance and Derivation of Class


    # 7.1.1 Instances of Inheritance and Derivation


    The inheritance and derivation hierarchy of classes is a reflection in program
    designs of the procedure that people use to classify, analyze, and understand
    problems. Things in the real world are mutually related and interacting. In the
