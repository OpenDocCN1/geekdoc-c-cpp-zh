    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_377_0.png)


    Fig. 9.6: A typical stack.


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_377_1.png)


    Fig. 9.7: How a stack works in a function call.


    The stack is a basic and widely used linear collection in computer programs. For
    example, the compilation system uses stacks to implement function calls. Programmers
    only need to write a simple statement to call a function in C++ and the compiler
    does the rest. Figure 9.7 shows how function calls are implemented. Before a function
    call, the compiler generates codes to push the return address, calling contexts
    and actual parameters into the stack. The pops necessary information out from
    the stack to initialize formal parameters. Return addresses and contexts are restored
    from the stack when the function returns.


    The compiler also parses expressions in the programs using stacks. We can see
    expressions such as the following in almost all programs: a/b+c*d.


    Let''s examine how the compiler parses expressions. The compiler establishes two
    stacks: an operand stack (ODS) and an operator stack (OPS) to parse them. An operand
    or an operator is represented by a token. Figure 9.8 shows the algorithm for parsing
    expressions. Figure 9.9 shows the process of parsing the expression a/b+c*d.


    The queue is also a basic and widely used linear collection in computer programs.
    Elements are only added to one side (which is called the tail), and are only removed
    from the other side (which is called the head). Elements in the queue are served
    in a “First In, First Out (FIFO) queue. Figure 9.10 shows the logical structure
    of a queue.'
