    Tab.10.5: Mutating Sequence Algorithms.


    | Name | Function |

    | --- | --- |

    | copy | Copy the elements in the interval |

    | copy_n | Copy first *n* elements in the interval |

    | copy_backward | Copy the elements in the interval in reverse order |

    | fill | Replace the elements in the interval with a specified value |

    | fill_n | Replace first *n* elements in the interval with a specified value |

    | generate | Call the function object repeatedly, replace the elements in the
    interval with the return value |

    | generate_n | Call the function object repeatedly, replace first *n* elements
    in the interval with the return value |

    | partition | Put the elements that satisfy the condition by a function object
    before the other elements |

    | stable_partition | Put the elements that satisfy the condition by a function
    object before the other elements, and keep the relative order |

    | unique | Remove the adjacent elements that have the same value, make the value
    unique |

    | unique_copy | Remove the adjacent elements that have the same value, make the
    value unique, and copy the result into another container |

    | random_shuffle | Shuffle the elements in the interval randomly |

    | remove | Remove all elements with the specified value in the interval |

    | remove_if | Remove all elements that satisfy the condition in the interval and
    copy the result into another container |

    | remove_copy_ij | Remove all elements that satisfy the condition in the interval
    and copy the result into another container |

    | replace | Replace a certain kind of elements |

    | replace_copy_if | Replace a certain kind of elements conditionally and copy
    the result into another container |

    | reverse | Reverse the order of elements in the interval |

    | reverse_copy | Reverse the order of elements in the interval and copy the result
    into another container |

    | rotate | Rotate two parts of elements in the interval |

    | rotate_copy | Rotate two parts of elements in the interval and copy the result
    into another container |

    | swap | Swap two elements using references |

    | iter_swap | Swap two elements using iterator |

    | swap_ranges | Swap elements in two intervals |

    | transform | Make a new sequence using an existing sequence and a function object,
    or using two existing sequences and a function object |


