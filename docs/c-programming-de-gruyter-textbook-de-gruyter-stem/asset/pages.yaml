- pgno: 283
  md: '# 7.2 Access Control


    The derived class inherits all the data members and function members from the
    base class except for the constructor and the destructor. However, the access
    attributes of these inherited members can be changed in the process of inheritance.
    The attributes of inherited members are indicated by the inheritance mode specified
    in the definition of the derived class.


    Base class members have three kinds of access attributes: public, protected, and
    private. Private members of a base class can access any other members of the same
    class, while through objects of a base class we can only access the public members
    of that class.


    There are three inheritance modes: public inheritance, protected inheritance,
    and private inheritance. Different inheritance modes result in different attributes
    of the base class members in the derived class. There are two kinds of access
    situations: the first is new members in the derived class accessing members inherited
    from the base class; the second is accessing members inherited from the base class
    through objects of the derived class outside the derived class. We will discuss
    these different cases respectively.


    # 7.2.1 Public Inheritance


    If the inheritance mode is public, then in the derived class, the access attributes
    of the public and protected members inherited from the base class will not change
    but the private members inherited from the base class cannot be directly accessed.
    That is to say, in public inheritance, the access attributes of public and protected
    members inherited from the base class will not change– they remain public and
    protected members in the derived class and other members in the derived class
    can access them directly. Outside the class family, we can access public members
    inherited from the base class only through objects of the derived class. Neither
    the derived class members nor objects of the derived class can access private
    members of the base class directly.


    Example 7.1 Public inheritance of the class Point.


    The class Point has been mentioned many times in previous chapters. In this example,
    we will derive a new class Rectangle from the class Point. A rectangle is specified
    by a point, a width, and a length. The point of a rectangle has all the characteristics
    of the class Point, but a rectangle has its own features. This means that we should
    add new members while inheriting the class Point. The inheritance relations can
    be described in UML, as shown in Figure 7.3.


    Let us start with the header file.'
