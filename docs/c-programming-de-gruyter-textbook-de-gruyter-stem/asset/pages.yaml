    In the program, the derived class does not declare the virtual function explicitly.
    The system will follow the following rules to judge whether a derived-class member
    function is virtual.


    +   - If the function has the same name as some base-class virtual function

    - If the function has the same name and number of arguments and a corresponding
    argument type with the base-class virtual function

    - If the function has the same return value or the same return value of the pointer
    and reference as the base-class virtual function, satisfying the assignment rule


    After examining the name, arguments, and return value, the derived class is recognized
    as a virtual function if it satisfies all the above conditions. Here, the virtual
    function of the derived class overrules the virtual function of base class. And
    the virtual function of the derived class also hides all other forms of overloading
    by the function with the same name.


    When the base-class constructor calls a virtual function, the derived-class virtual
    function will not be called. Suppose there is a base class Base and a derived
    class Derived. Both have the virtual function virt(). If Base::Base() calls virtual
    function virt(), it is Base::virt() that is called, not Derived::virt(). This
    is because when the base class is constructed, the object is not a derived-class
    object yet.'
