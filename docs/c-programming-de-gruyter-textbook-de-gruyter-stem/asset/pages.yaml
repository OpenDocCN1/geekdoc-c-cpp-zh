  md: '# 5 Data Sharing and Protecting


    File scope


    ![](img/5618306d085ac1bac8275d6c4c5bbf2a_177_0.png)


    +   - If identifiers of the same name are declared in different scopes that do
    not affect each other, these identifiers will not affect each other.

    - If identifiers of the same name are declared in two or more scopes with inclusion
    relations, the outer identifiers are invisible from inner scopes.


    Look at Example 5.1 again. This is an example of file scope including a local
    scope. You can reference the variable with file scope outside block 1, which means
    that it is visible. When the program execution enters block 1, it can only reference
    variables of the same name with local scope, while variables of the same name
    with file scope are hidden.


    +   - Rules of scope and visibility do not only apply to simple variables, but
    also apply to user-defined data types and objects of classes.


    # 5.2 Lifetime of Object


    Each object (including simple variable) has a birth and disappearing time. The
    period from birth to end is the object''s lifetime. During the lifetime, the object
    will remain in its state (the value of data member) and the variable will retain
    its value, until they have been updated. In this section, we will use objects
    to represent both class objects and general variables. The lifetime of an object
    can be divided into static lifetime and dynamic lifetime.


    # 5.2.1 Static Lifetime


    If the lifetime of an object is the same as the running period of the program,
    it has a static lifetime. All the objects with file scope have a static lifetime.
    If we want to declare an object with local scope inside the function to have a
    static lifetime, we have to use the keyword static. For example, the variable
    i declared in the following statement is a variable that has a static lifetime,
    which is also called a static variable:


    ```

    static int i;

    ```


    We will discuss static members in Section 5.3.'
