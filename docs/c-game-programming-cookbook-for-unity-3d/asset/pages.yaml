  md: "```\nmyTransform= transform;\nif(forceParent==null)\n{\n    forceParent= myTransform;\n\
    }\n```\n\nThe position and rotation of the parent transform will be used repeatedly\
    \ in the weapons setup code. To avoid having to look them over and over again,\
