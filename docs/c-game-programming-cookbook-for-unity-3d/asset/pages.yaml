    \n    // calculate how much we are sliding\n    slideSpeed=Vector3.Dot(myRight,flatVelo);\n\
    \n    // build a new Vector to compensate for the sliding\n    TEMPvec3 c=myRight\
    \ * (-slideSpeed) * myMass * theGrip;\n\n    // apply the correctional force to\
    \ the rigidbody\n    myBody.AddForce(TEMPvec3 * Time.deltaTime);\n}\n```\n\n#\
    \ 4.6 Cameras\n\nThere are just two camera scripts for the example games in this\
