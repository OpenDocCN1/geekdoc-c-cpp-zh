    \ as a matter of consistency across the examples:\n\n```\n// set default data\n\
    myDataManager.SetName(\"Player\");\nmyDataManager.SetHealth(startHealthAmount);\n\
    ```\n\nWhen the aiControlled Boolean is set to true, the player's name is set\
