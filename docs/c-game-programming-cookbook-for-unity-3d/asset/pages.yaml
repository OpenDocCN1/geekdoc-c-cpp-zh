    \n```\npublic void RemoveEnemyFromRadar(Transform aTransform)\n{\n    radarControlScript.RemoveEnemyBlip(aTransform);\n\
    }\n```\n\nThere may be occasions when the main player script, its gameObject,\
    \ or its transform needs to be accessed through other scripts, so game controller\
    \ provides the GetMainPlayerScript(), GetMainPlayerTransform(), and GetMainPlayerGO()\
    \ functions:\n\n```\npublic Player_LBS GetMainPlayerScript()\n{\n    return focusPlayerScript();\n\
