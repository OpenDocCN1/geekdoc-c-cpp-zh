  md: "# # 11.6 Player Controller\n\nLazer Blast uses an animated human model from\
    \ the Unity3d Angry Bots tutorial, included with Unity. It uses a class that derives\
    \ from the top-down controller script shown in Chapter 5, adding custom game-specific\
    \ scripting to it and a separate class to take care of animating the character\
    \ model.\n\nThe player class _LBS derives from the controller script BaseTopDown.cs,\
    \ a modified version of the third-person controller script included with Unity\
    \ that uses Unity's built-in character controller for physics. BaseTopDown.cs\
    \ is detailed in full in Chapter 5 (Building Player Movement Controllers).\n\n\
    Player_LBS.cs looks like this:\n\n```\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class Player_LBS : BaseTopDown\n{\n    private bool isInvulnerable;\n\
    \    private bool isRespawning;\n\n    public BasePlayerManager myPlayerManager;\n\
    \    public BaseUserManager myDataManager;\n\n    public bool godMode =false;\n\
    \    public GameObject meshGO;\n\n    public Standard.SlotWeaponController weaponControl;\n\
    \    public bool canFire;\n\n    public bool isFinished;\n\n    public override\
    \ void Init (n    {\n        base.Init();\n\n        // do god mode, if needed\n\
    \        if(godMode)\n        {\n            MakeVulnerable();\n        } else\
    \ {\n            MakeInvulnerable();\n        }\n\n        // start out with no\
    \ control from the player\n        canControl=false;\n\n        // get a ref to\
    \ the weapon controller\n        weaponControl=\n        myGO.GetComponent<Standard.SlotWeaponController>();\n\
    \n        // if a player manager is not set in the editor, let's try\n       \
    \ if(myPlayerManager==null)\n            myPlayerManager=\n            myGO.GetComponent<BasePlayerManager>();\n\
    \    }\n}\n```"
