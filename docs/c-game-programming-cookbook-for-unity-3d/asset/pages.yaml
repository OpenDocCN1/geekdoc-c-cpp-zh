- pgno: 133
  md: "To keep everything tidy, all of the physics functionality is called from FixedUpdate(),\n\
    but it actually resides in the Update() function:\n\n```\npublic void FixedUpdate()\n\
    {\n    UpdatePhysics();\n}\n```\n\nChanging the pitch of the engine AudioSource\
    \ object makes a convincing motor\nsound. As it may be possible for mySpeed to\
    \ be negative, Mathf.Abs is used,\nas well as an arbitrary multiplier to bring\
    \ the number down to something that changes the\npitch in a satisfactory manner.\
    \ There's no science here! The number was decided by trial\nand error, just adjusting\
    \ its value until the motor sounded right:\n\n```\npublic virtual void UpdateEngineAudio()\n\
    {\n    // this is just a 'made up' multiplier value applied to\n    // mySpeed.\n\
    \    engineAudioSource.pitch=0.5f + (Mathf.Abs(mySpeed)*0.005f);\n}\n```\n\nThe\
    \ real guts of the script may be found in the UpdatePhysics() function. CheckLock()\n\
    is called first, which takes care of holding the vehicle in place when the lock\
    \ is on (the vari-\nable is Locked set to true):\n\n```\npublic virtual void UpdatePhysics()\n\
    {\n    CheckLock();\n}\n```\n\nvelo is a variable holding the car's rigidbody:\n\
    \n```\n// grab the velocity of the rigidbody and convert it into\n// flat velocity\
    \ (remove the Y)\nvelo=body.angularVelocity;\n```\n\nThe next task is to find\
    \ the velocity in the local coordinate space, remove its y-axis,\nand use its\
    \ value along the z-axis to put it in the variable: mySpeed:\n\n```\n// convert\
    \ the velocity to local space we can see how fast we're\n// moving forward (along\
    \ the z axis)\nvelo=transform.InverseTransformDirection(body.velocity);\nflatVelocity.x=velo.x;\n\
    flatVelocity.y=0;\nflatVelocity.z=velo.z;\n```\n\nmySpeed is then checked to see\
    \ whether its value is less than 2. When the speed is\nslow and the brake key\
    \ is held down, brakeTorque is no longer applied to the wheels;\ninstead, a reverse\
    \ amount of the maximum amount of torque (brakeMax) is\napplied to make the vehicle\
    \ move backwards. Note that brakeMax is both the maxi-\nm amount of torque applied\
    \ into the brakeTorque property of the WheelCollectors"
