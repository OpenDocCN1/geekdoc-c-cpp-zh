- pgno: 406
  md: '# 14 Dish: Making the Game Interstellar Paranoids


    In 1978, a game came along from a company named Taito that would change the face
    of video gaming forever. Designer Tomohiro Nishikado said that his inspiration
    from Atari''s arcade game, Breakout, and his concept was so advanced that Nishikado,
    a solo developer, had to develop the neccessary hardware himself. He named it
    Space Monsters, a superior of which changed the name before it was released, to
    Space Invaders.


    By the end of 1978, Taito had installed over 100,000 machines and grossed over
    $600 million in Japan alone. The game was soon a hit right across the world, and,
    35 years on, players still get to enjoy numerous remakes, clones, and arcade-style
    games that pay homage to it.


    A year on, in 1979, a new video game named Galaxian was launched by Namco. It
    was designed by Kazunori Sawano, unlike Nishikado, Sawano had a small team to
    work with, and they were able to accomplish much more technically that would help
    them build on the original Space Invaders concepts. This time, the enemy sprites
    had bright colored graphics, animations, and a scrolling battlefield. Audio was
    much improved too, with the addition of background music and a theme. Galaxian
    saw the alien invaders swooping down at the player, attacking much more aggressively
    than Space Invaders, making for a faster-paced, more visceral experience.


    > * "Asteroids Conquer Space Invaders?" Electronic Games, Winter 1981, 30–33 (http://www.digitpress.com/library/magazines/electronic_games/electronic_games_winter81.pdf).'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'The overall style of Galaxian should not be underestimated. Its look and feel
    became iconic throughout the 1980s and something that may have influenced the
    design style of other popular games around the time and for a while.


    Besides the advancement in technology, another feature of Galaxian was the addition
    of a two-player mode. Players could alternate, playing until a life was lost,
    to see who could get the highest score. Although not a feature to this game, introducing
    competitive play to Galaxian无疑 went a long way in helping its success in arcades
    around the world.


    In 1980, Taito distributed another shooter in a similar style to Galaxian, called
    Phoenix and developed by a company named Amstar Electronics. Featuring color graphics
    and distinctive shooting sounds, the game''s main enemies were birds that would
    swoop down at the player''s spaceship. Most notably, Phoenix featured a limited
    implementation of power-up, as the projectile firing rate was varied based on
    the difficulty of the level. At the end of a level, the player had to battle a
    huge motherhood—one of the earliest implementations of the end-of-level boss in
    video gaming.


    In video gaming, the rules were just starting to evolve; some of the prominent
    features from today''s games began to evolve. Somewhere between Galaxian in 1981
    and Xenius in 1983, someone got the idea to take the scrolling starfield backdrops
    (sometimes plain black backdrops) and turn them into actual maps and game environments.
    A missing link may be the 1982 game Zaxxon, which was an isometric view shooter
    game featuring a rich, scrolling environment filled with both ground targets and
    flying targets such as missiles and alien ships.


    Perhaps the next revolution in arcade gaming came in the form of Xenius, Atari''s
    first vertical scrolling launched in 1983 and published by Namco. Instead of simple
    starfield backdrops were set in an abstract universe, Xenius brought with it a
    detailed view of the Earth''s surface. Alien forces both in the air and, for the
    first time, on the ground as enemies as the game world makes its way down the
    screen toward the player. Although not the first game to feature them, Xenius
    was certainly one of the most popular games to


    ![](img/041dca164b58875f4f1a64abb3328f5c_407_0.png)


    Figure 14.1 The example game Interstellar Paranoids.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'feature boss battles. At the end of levels, tougher stronger enemies were required
    to be destroyed before advancing to the next stage.


    The game Interstellar Paranoids (shown in Figure 14.1) pays homage to these classic
    games. It features a spaceship that moves left, right, up, and around the screen,
    and it can fire to destroy enemies. The enemies swoop from the top and left and
    right sides of the screen, flying along paths as they shoot at the player. At
    the end of each stage will be a boss enemy that requires a lot more to take down.


    The sound effects are old fashioned, arcade style, and there is a scrolling starfield
    in the background with explosions lighting up the screen as collisions happen.
    Its overall structure differs a little from other games in this book, as seen
    in Figure 14.2.


    This game may be found in the example game project, its scenes in the Scenes/Interstellar
    Paranoids folder named level_1, level_2, and menu_IP.


    Its prefs are located in the Prefabs/Games/Interstellar Paranoids folder.


