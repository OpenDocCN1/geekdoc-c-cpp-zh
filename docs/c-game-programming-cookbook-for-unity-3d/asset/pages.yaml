- pgno: 28
  md: "If we were building a game with lots of cars in it, having to rewrite the car\
    \ class for each type of car would be silly. A far more efficient method might\
    \ be to write a base class and populate it with virtual functions. When we need\
    \ to create a class, rather than use this base class, we build a new class, which\
    \ inherits the base class. Because our new class is inherited, it is optional\
    \ whether or not choose to override the Wheels or Engine function to make them\
    \ behave in ways specific to our new class. That is, we can build \"default\"\
    \ functions into the base class, and if we only need use a default behavior for\
    \ an engine, our new class doesn't need to override the engine function.\n\nThe\
    \ base class BaseCar: {\n\n```\npublic virtual void Engine() {\n    Debug.Log(\"\
    Vroom\");\n}\n\npublic virtual void Wheels() {\n    Debug.Log(\"Four wheels\"\
    );\n}\n```\n\nThere are two key things to notice in the above script. One is the\
    \ class declaration itself and that this class derives from MonoBehavior. MonoBehavior\
    \ is itself a class—the Unity documentation describes it as \"the class every\
    \ script derives from\"—this MonoBehavior class contains many engine-specific\
    \ functions and methods such as Start(), Update(), FixedUpdate(), and more. If\
    \ our script didn't derive from MonoBehavior, it would not inherit its functions,\
    \ and the engine would automatically call functions like Update() for us to be\
    \ able to work with. Another point is that MonoBehavior is a class that is built\
    \ into the engine and not something that we can access to edit or change.\n\n\
    The second point is that our functions are both declared as virtual functions.\
    \ Making virtual functions means that the behavior in our base class may be overridden\
    \ by any scripts that derive from it. The behavior we define in this base class\
    \ could be thought of as its default behavior. We will cover defining in a full\
    \ little further on in this section.\n\nLet's take a look at what this script\
    \ actually does: If we call the Engine() function of our BaseCar class, it would\
    \ write to the console \"Vroom\". If we called Wheels, the console would read\
    \ \"Four wheels\".\n\nNow that we have BaseCar class, we can use this as a template\
    \ and make new versions of it like this:\n\n```\npublic class OctoCar : BaseCar\
    \ {\n    public override void Wheels() {\n        Debug.Log(\"Eight wheels\");\n\
    \    }\n}\n```\n\nThe first thing you may notice is that the OctoCar derives from\
    \ BaseCar rather than MonoBehavior. This means that OctoCar inherits the functions\
    \ and methods belonging to the BaseCar script. As the functions described by BaseCar\
    \ are virtual, they may be overridden. For OctoCar, we override Wheels with the:\n\
    \n```\npublic override void Wheels() {\n```"
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Let''s take a look at what this script actually does: In this, if we were to
    call the Engine() on OctoCar, it would do the same as the BaseCar class; that,
    it would write "Vroom" to the console. We would do this because we have inherited
    the function but have not overridden it, which means we keep that default behavior.
    In OctoCar, we have overridden the Wheels(s) The BaseCar behavior of Wheels would
    write "Four wheels" to the console, if we call Wheels(s) on OctoCar, the overridden
    behavior would write "Eight wheels" instead.


    Inheritance plays a huge part in how our game framework is structured. It is because
    we have basic object types and specified elaborations of these objects inheriting
    the methods, properties, and functions. By building our games in this manner,
    the communication between the different game components (such as control scripts,
    weapon scripts, projectile controllers, etc.) becomes universal without having
    to write out the same function declarations over and again for different variations
    of the script. For the core framework, our main goal is to make it as flexible
    and extensible as possible, and this would be much more difficult if we were unable
    to use inheritance.


    The subject doesn''t stop here, but that is as far as we will be going here. Each
    method will be useful in different areas of game development. For example, in
    cases where a component refers to another object such as a material or texture,
    it makes sense to set this via the Unity Editor. In cases where we are developing
    classes that are not applied to gameObjects, we may use a static variable to make
    it accessible to all other scripts. For the sake of sanity, it is probably likely
    that we will never use a static object reference using it as a singleton.


    # 1.1.5 Where to Now?


    Think about how your objects work together in the game world and how their scripts
    need to communicate with each other. I find that it helps to make flow diagrams
    or use mapping software to work things out beforehand. A little planning early
    on reduce a lot of code revisions later on, so to plan ahead. That said, it is
    perfectly okay for your structure to grow and evolve as you develop it further.
    The framework in this book ended up going through many revisions along the way
    before reaching its final form.


    Try to break up your scripts into smaller components to help with reusability;
    for flexibility. Also, try to design for, hard-coding references to other scripts
    reduces the portability of the script and increases the amount of work you will
    need to do in the future when you want to carry it over into another project.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# # 2 Building the Core Game Framework


    In this chapter, we look at the structure of the base project, to which we will
    be adding all of the game script components, and the thinking behind it. This
    chapter will give context to the design decisions made in the core framework as
    well as provide a good base for understanding how the individual code recipes
    work together and why they may sometimes have dependencies on other components.


    The framework for this book (as seen in Figure 2.1) features six main areas:


    +   1. Game Controller

    The game controller acts a like a central communication script for all of the
    different parts of the game. In a way, it is the main glue that holds together
    the various components that make up the game.


    +   2. Scene Manager

    This script deals with the loading and saving of scenes. Scenes are what Unity
    calls its level files.


    +   3. UI Manager

    The UI manager draws all of the main in-game user interface elements, such as
    score display and lives.


    +   4. Sound Manager

    The sound manager handles sound playback. The manager holds an array containing
    AudioClips of possible sounds to play. When the game begins,'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/041dca164b58875f4f1a64abb3328f5c_31_0.png)


    Figure 2.1 Diagram of the game framework.


    sound manager creates one individual AudioSource per sound in the array. When
    we need to play a sound, the index number referring to a sound''s place in the
    array is passed to the manager. It uses its individual AudioSource to play the
    source, which helps to alleviate problems that may be caused by playing too many
    sound files from a single source.


    +   5. Players

    Players may already be present in the game scene or may be instantiated by the
    game controller. The players have a relatively complex structure that will be
    explored later in Chapter 3.


    +   6. AI and Enemies

    As with players, AI-controlled characters or enemies may already be present in
    the scene at load time or may be created at runtime by the game controller or
    other script.


    Although you may choose to work with your own framework, understanding how the
    components work alongside each other and how they work together. To maximize flexibility,
    the base classes need to be able to accommodate a host of different configurations.
    For example, a player control script should allow for input to be passed in from
    another script so that control systems may easily be switched out. The main player
    script does not need to know where the input is coming from, but it needs to provide
    a common interface for an input script to communicate with. The input script may
    take its input from the keyboard, mouse, artificial intelligence, networked input,
    etc., and just as long as a common interface is used to communicate with the player
    controller; it doesn''t matter to the player controller as to where the input
    actually comes from.'
