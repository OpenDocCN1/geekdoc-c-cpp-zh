- pgno: 18
  md: '# Introduction


    As I was starting out as a game developer, a self-taught programmer my skills
    took a while to reach a level where I could achieve what I wanted. Sometimes I
    wanted to do things that I just didn''t have yet the technical skills to achieve.
    Now and again, software packages came that could either help me in my quest to
    make games or even make full games for me; complete game systems as the Shoot
    ''Em-Up Construction Kit (aka SEUCK) from Sensible Software, Gary Kitchen''s GameMaker,
    or The Quill Adventure System could bring to life the kinds of games that went
    beyond anything that my limited programming skills could dream of building.


    The downside to using game creation software was that it was tailored to create
    games within their chosen specific genre. If I wanted to do something outside
    of the limitations of the software, the source code was inaccessible and there
    was no way to extend or modify it. When that happened, I longed for a modular
    code-based system that I could plug together to create different types of games
    and modify parts of it without having to spend a lot of time learning how the
    entire system works—building block game development that I could actually script
    and modify if needed to.


    After completing my first book, Game Development for iOS with Unity3D, I wanted
    to follow up by using a modular style of Unity3D that would provide readers with
    a highly flexible framework to create just about any kind of game by "plugging
    in" the different script components. My intention was to make a more technical
    second book, based on C# programming, that would offer extensibility in any direction
    a developer might require. In essence, what you are holding in your hands right
    now is a cookbook'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'for game development that has a highly flexible core framework for just any
    type of game.


    A lot of the work I put in at the start of writing this book was in designing
    a framework that not only made sense in the context of Unity but also could easily
    cope with the demands of different genres.


    # # Prerequisites


    You can get up and running with the required software for the grand total of zero
    dollars. Everything you need can be downloaded free of charge with no catches.
    You may want to consider an upgrade to Unity Pro at some point in the future,
    to take advantage of its advanced features, but to get started all you need to
    grab the free version from the Unity website.


    Unity Free or Unity Pro (available from the Unity store at http://www.unity3d.com)


    Unity Free is completely free for anyone or any company making less than $100,000
    per year—it may be downloaded for no charge at all, and you don''t even need a
    credit card. It''s a really sweet deal! We are talking about fully functional
    game engine, ready to make 3D or 2D games that may be sold commercially or otherwise.
    There are no royalties to pay, either.


    Unity Pro adds a whole host of professional functionality to the engine, such
    as rendering calling and profiling. If you are a company with more than $100,000
    per year of turnover, you will need a Pro license, but if you find Unity Free
    doesn''t pack enough power, you may also want to consider going Pro. You can arrange
    a free trial of the Pro version right from the Unity website to buy you. If the
    trial licence runs out before you know enough to make a purchase, contact Unity
    about extending it and they are usually very friendly and helpful about it (just
    don''t try using a trial license for 6 months at a time, as they may just figure
    it out!).


    C# programming knowledge


    Again, to reiterate this very important point, this is not a book about learning
    C#, how to program. You will need to know some C#, and there are a number of other
    books out there for purpose, even if I have tried to make the examples as simple
    as possible! This book is about making games, not about learning to program.


    # # What This Book Doesn''t Cover


    This is not a book about programming and it is not a book about the right or wrong
    way to do things. We assume that the reader has experience with the C# programming
    language. I am a self-taught programmer, and I understand that there may well
    be better ways to do things.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'This is a book about concepts, and it is inevitable that there will be better
    methods for achieving some of the same goals. The techniques and concepts offered
    in this book are meant to provide solid foundation, not to be the final word on
    any subject. It is the author''s intention that, as you gain your own experiences
    in game development, you make your own rules and draw your own conclusions.


    Additional material is available from the CRC Press Web site: http://www.crcpress.com/product/isbn/9781466581401.'
  merge: -1
  img_proc: true
