- pgno: 118
  md: "The Animation component should attached to the gameObject that is beated. As\
    \ this may not be the same as this script is attached to, the _animation variable\
    \ used to coordinate animations later in the script is declared as public. Use\
    \ the Unity Editor Inspector window to reference the Animation component:\n\n\
    ```\npublic Animation _animation;\n```\n\nThe enum keyword is used to declare\
    \ an enumeration. An enumeration is a set of constants called an enumeration list,\
    \ which is a method of describing something with words (keeping the code easily\
    \ readable), yet at the same time, having the inner workings of the engine use\
    \ numbers to make processing more efficient. At the beginning of the script, we\
    \ start with the declaration of an enumeration CharacterState. This will be used\
    \ to hold the state of your player's animation:\n\n```\nenum CharacterState {\n\
    \  Idle = 0,\n  Walking = 1,\n  Running = 2,\n}\n```\n\nMost of the variable declarations\
    \ are uneventful and do not require full descriptions, although there are more\
    \ variables of note:\n\n| CharacterState_characterState | This holds the player's\
    \ animation state (based on the enumeration list CharacterState shown earlier\
    \ in this section). |\n| BasePlayermanagerPlayerController | Although the controller\
    \ is not used by this script, it holds a reference to it so that other scripts\
    \ can find it. |\n| Keyboard_Input default_input CharacterController | The default\
    \ input system is the standard keyboard input script. Unity's built-in character\
    \ controller is used for the physics simulation of the character controlled by\
    \ this script. |\n\nOn to the Awake() function:\n\n```\nvoid Awake ()\n{\n```\n\
    \nThe moveDirection variable is a Vector3 to tell the character controller which\
    \ direction to move in. Here, it is the given forward vector as a default value:\n\
    \n```\nmoveDirection = transform.TransformDirection(Vector3.forward);\n```\n\n\
    The Animation component (a component built into Unity) is used to animate the\
    \ character. GetComponent() is used to find the instance of the animation component\
