  md: "```\npublic void Start()\n{\n    // we want to keep the game controller alive\
    \ right through\n    // the game, so we use DontDestroyOnLoad to keep it alive\n\
    \    DontDestroyOnLoad(this.gameObject);\n}\n```\n\nWhen a new scene is loaded,\
    \ the LevelLoadingComplete() function gets called by an instance of the LevelSetup.cs.\
    \ The script here can then reinitialize itself and the user interface so that\
    \ the game can continue in the new scene:\n\n```\npublic void LevelLoadingComplete()\n\
    {\n    Init();\n    UIControl.Init();\n}\n```\n\nThe Init() function is composed\
    \ in such a way as be reusable and will be called at the start of each level:\n\
    \n```\npublic void Init()\n{\n```\n\nThe player starts out held in place. An Invoke\
    \ call to StartPlayer schedules the player to be released 4 s after this function\
    \ is called:\n\n```\n// tell the player that it can move, in 4 seconds\nInvoke(\"\
    StartPlayer\",4);\n```\n\nThe Time.timeScale value can affect the whole feel of\
    \ the game. Some shooters demand more enemies and slower movement, and some have\
    \ faster movement and fewer enemies; the movement and updates of the game are\
    \ determined by the type of game you are building (including artistic style, world\
    \ type, and any other game elements that may affect the overall pace). The GameSpeed\
    \ variable can be set to change time scale, and the code changes the physics engine\
    \ time setting to:\n\n```\n// in case we need to change the time scale, it gets\
    \ set here\nTime.timeScale=gameSpeed;\n```\n\nThis game allows for one or two\
    \ players. The main menu scene displays an extra button for cooperative play.\
    \ By starting the game through this additional button, a preferences key is written\
    \ totalPlayers. The first main game scene is then loaded in the same way.\n\n\
    At this stage in the Init() thePrefs value is retrieved, the integer variable\
    \ totalPlayers, and used to set the game differently:\n\n```\n// we store the\
    \ current game's number of players in a pref so it\n// may be set elsewhere (the\
    \ main menu for example) and\n// carried into every level of the game.\nif(PlayerPrefs.HasKey(\"\
    totalPlayers\")) // does this pref exist?\n{\n    totalPlayers=PlayerPrefs.GetInt(\"\
    totalPlayers\");\n    // then use the value holds\n} else {\n    totalPlayers=1;\
    \ // default to single player\n```"
