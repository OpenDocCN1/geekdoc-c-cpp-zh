  md: 'There are two scripts in this book related to the playback and management of
    audio. One is the sound controller, intended for sound effects, BaseSoundController.cs.
    The second is intended for music control, the script MusicSoundController.cs.


    # 8.1 The Sound Controller


    In the example framework for this book, it is assumed that each scene has a sound
    controller, an empty game GameObject with the BaseSoundController.cs script attached
    to it. The component has an array populated in the Unity editor Inspector by the
    sounds required for the game (their AudioClips). When a sound is required by another
    script, it calls upon the sound manager to play it, passing in the index of the
    AudioClip as it stands in the array:


    ```

    BaseSoundController.Instance.PlaySoundByIndex( the index number from the array
    of sounds );

    ```


    Centralizing the audio playback avoids dealing with properties in multiple places,
    such as having to set the volume level on every AudioSource when a user changes
    it in the options menu. When audio is centralized here, one volume setting and
    one volume can easily handle all of the game audio.

    Below is the full sound controller script:


    *'
