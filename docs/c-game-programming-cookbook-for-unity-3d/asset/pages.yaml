  md: "```\n// add a race controller script to our object\nraceControl=myGO.AddRaceController();\n\
    ```\n\nIt is also a good idea to grab the ID from the race controller to use elsewhere,\
    \ keeping any ID numbers the same. raceID is an integer that gets set to the ID\
    \ returned from\nraceControl.GetID():\n\n+   - grab our race ID from the race\
    \ control script, so we\n- don't have to look it up whenever we communicate with\
    \ the\n- global race controller\nraceID=raceControl.GetID();\n\nEvery half second,\
    \ this player script will call upon UpdateRacePosition() to update its\nposition\
    \ from the global race manager. An InvokeRepeating is used to set this up on a\n\
    recurring basis throughout the game:\n\n+   - set up a repeating invoke to update\
    \ our race position,\n- rather than calling it every single tick or update\nInvokeRepeating(\"\
    UpdateRacePosition\",0, 0.56);\n\nUpdateRacePosition() asks the global race manager\
    \ which this player is in,\nand then stores it in the variable myRacePosition:\n\
    \n```\npublic void UpdateRacePosition()\n{\n    // grab our race position from\
    \ the global race manager\n    myRacePosition=GlobalRaceManager.Instance.GetPosition(raceID);\n\
    }\n```\n\nThe UpdatePhysics() function is called each FixedUpdate() by the BaseVehicle\
    \ script.\n\n```\npublic override void UpdatePhysics()\n{\n    if (canControl)\n\
    \        base.UpdatePhysics();\n}\n```\n\nAt low speeds, it is difficult to turn\
    \ the vehicle quickly. When the user crashes\nto a wall, slow turning speed can\
    \ make the game a very frustrating experience.\nThe aim of this overridden version\
    \ of UpdatePhysics() is to add some turn helper\nforce, to make the vehicle turn\
    \ at lower speeds so that getting out of a crash may be\nier. It also means that\
    \ the vehicle can do some run donuts on the track, but that\nanother story...\n\
    \nHere we check the value of mySpeed (which, of course, holds the player's\nmovement\
    \ speed) and see whether it is below the value of TorqueHelperMaxSpeed.\nThe intention\
    \ is that its value will be set in the Unity Inspector window. If mySpeed\ngre\
    \ than TorqueHelperMaxSpeed, no helper force will be applied to the vehicle.\n\
    If it is traveling below that threshold, rigidbody.AddTorque() is used to turn\
    \ the vehicle:"
