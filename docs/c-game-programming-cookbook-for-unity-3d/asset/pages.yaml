  md: "Like its real-life counterpart, our car uses a steering system to move them\
    \ left or right. Rather than force the car towards a particular direction, the\
    \ AIController will supply inputs that our CarController_MVD script can use as\
    \ though they were user inputs. As you may recall from Chapter 9, the AI system\
    \ has a specific state for steering inputs based on viewpoints. Here the AIController\
    \ object is called to set its state to AIStates.AIState.steer_to_waypoint:\n\n\
    ```\n// tell the AI controller to go into waypoint steering\n// mode\nAIController.SetAIState(AIStates.AIState.steer_to_waypoint);\n\
    ```\n\nAs this is an AI vehicle, the default input method needs to be disabled\
    \ (otherwise, the AI may have to fight against the player input):\n\n```\n// disable\
    \ our default method\ndefault_input.enabled=false;\n```\n\nThe BaseArmedEnemy\
    \ script from Chapter 9, Section 9.3 is used as a weapon controller. If one is\
    \ not attached to the player, the one will be added:\n\n```\n// add an AI weapon\
    \ controller\ngmyGO.GetComponent<BaseArmedEnemy>();\n\n// if we don't already\
    \ have a gun controller, let's add one\n// to stop things breaking bad and warn\
    \ about it so that it may\n// be fixed\nif (gunController==null)\n{\n    gunControl=myGO.AddComponent<BaseArmedEnemy>();\n\
    \    Debug.LogWarning(\"WARNING! Trying to initialize car\nwithout a BaseArmedEnemy\
    \ attached. Player\ncannot fire!\");\n}\n```\n\nThe gun controller needs to show\
    \ when it sees an enemy in front of it. For this, the script here sets its currentStateTo\
    \ AIAttackStates.AIAttackState.look_and_destroy:\n\n```\n// tell gun controller\
    \ to do 'look' and destroy'\ngunController.currentState=\nAIAttackStates.AIAttackState.look_and_destroy;\n\
    ```\n\nAny game could use the race controller script. It does not need to be vehicles\
    \ car either; it could be humanoids, robots, or just anything else that move.\
    \ The race controller is attached to all players that need to be tracked in a\
    \ race, and the global manager talks to them and tracks the race. No extra work\
    \ required!\n\nThat said, we need to make sure that our players have race controllers\
    \ attached to them. AddRaceController() starts by using GameObject.AddComponent()\
    \ to add an instance of RaceController to this player:\n\n```\npublic void AddRaceController()\n\
    {\n    if (myGO==null)\n        myGO=gameObject;\n```"
