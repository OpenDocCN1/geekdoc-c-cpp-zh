    TEMPvector3=forceParent.position;\nTEMPRotation=forceParent.rotation;\n```\n\n\
    When the game starts, the prefab references held by the ArrayList are instantiated\
    \ and positioned at the parent transform's position.\nThe for loop uses weapons.Length\
    \ to get the length of the weapons array and iterate through:\n\n```\n// instantiate\
    \ all of the weapons and hide them so that\n// we can activate and use them when\
    \ needed.\nfor( int i=0; i<weapons.Length; i++)\n```\n\nThe weapon at position\
    \ i in the array is instantiated at the position of TEMPvector3 with the rotation\
    \ from TEMPRotation:\n\n```\n// Instantiate the item from the weapons list\nTEMPGameObject=(GameObject)\
    \ Instantiate(weapons[i],\nTEMPVector3 + offsetWeaponSpawnPosition,\nTEMPRotation\
    \ );\n```\n\nThe instantiated weapon is then parented to the transform held in\
    \ the variableParent so that it inherits its position and rotation. In this, the\
    \ layer of the parent will also be used to identify where projectiles come from.\
    \ We'll look this layer-based identification a little more as function unfolds,\
    \ but for now, just make a little note that the layer of the weapon's parent will\
    \ be copied down to the weapon. Individual scripts will also copy the layer setting\
    \ onto projectiles:\n\n```\nTEMPGameObject.transform.parent=forceParent;\nTEMPGameObject.layer=forceParent.game.layer;\n\
    TEMPGameObject.transform.position=TEMPvector3;\nTEMPGameObject.transform.rotation=TEMPRotation;\n\
    ```\n\nThese new objects are going to be the ones that the script manage, enabling\
