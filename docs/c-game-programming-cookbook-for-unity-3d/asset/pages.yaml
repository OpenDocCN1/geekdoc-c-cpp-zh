- pgno: 354
  md: "If the vehicle has been going the wrong way for too long, the function Respawn()\
    \ is called to put it back on the track facing in the right direction:\n\n```\n\
    // it's been x resetTime seconds in the wrong way\n// way, let's respawn this\
    \ thing:\nRespawn();\n```\n\n```\n} else if (isAIControlled) {\n```\n\nWhen this\
    \ condition is met, the car is not going the wrong way and it is not an AI-controlled\
    \ vehicle so a call is made to the game controller to UpdateWrongWay(), telling\
    \ that we are not going the wrong way so that the UI may be updated accordingly:\n\
    \n```\nGameController_MVD.Instance.UpdateWrongWay(false);\n}\n```\n\nIn racing\
    \ games, one common method for keeping the game interesting is to employ something\
    \ rubber banding. It gets its name from the type of effect that happens when the\
    \ top speed of racers is increased when they fall too far behind and decreased\
    \ when they get too far ahead—the players rubber band in front and behind the\
    \ main player.\n\nDone with some subtlety, rubber banding can help to provide\
    \ an exciting race each time. When it is not handled well, the effect can be frustrating\
    \ as the AI players gain the lead time the player starts ahead, so use it with\
    \ caution! This really is one of those unseen parts of the game that needs to\
