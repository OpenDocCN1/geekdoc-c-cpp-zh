- pgno: 68
  md: "We reset lastTime to the time taken from Time.realtimeSinceStart, which effectively\
    \ removes the time counted between now and the last update and counts from now\
    \ instead. Finally, we make a quick call to UpdateTimer() to start the timer process\
    \ again.\n\nWhenever we need to display the time on the screen, it is most likely\
    \ we will need it formatted in an established format such as minutes:seconds:milliseconds.\
    \ To do this, a little work is required to calculate the required units from our\
    \ currentTime variable, as currentTime is simply a float value containing a number\
    \ that bears no resemblance to what we need. Time.realtimeSinceStart returns the\
    \ time as reported by a system timer in seconds. The GetFormatted function takes\
    \ this value and breaks it up into the units we need, then puts together a nicely\
    \ formatted string and returns it.\n\n```\npublic string GetFormattedTime() {\n\
    \    // carry out an update to the timer so it is 'up to date'\n    UpdateTimer();\n\
    }}\n```\n\nNote that when GetFormattedTime() is called, we first make an UpdateTimer\
    \ call to update the currentTime. As mentioned earlier, the timer does not update\
    \ itself—it is a lazy updater that only updates when we ask it to do so. In this\
    \ case, we ask it for a formatted time string.\n\nFrom there on, we are simply\
    \ doing the math to get the minutes, seconds and milliseconds values from currentTime:\n\
    \n```\n// grab minutes\naMinute=(int)currentTime%60;\naMinute=aMinute%60;\n```\n\
    \n```\n// grab seconds\naSecond=(int)currentTime%60;\n```\n\n```\n// grab milliseconds\n\
    aMillis=(int)(currentTime*100)%100;\n```\n\nAfter minutes, seconds, and milliseconds\
    \ values have been calculated and stored in the integer variables aMinute, aSecond,\
    \ and aMillis, three new strings called seconds, minutes, and mills are built\
    \ from them:\n\n```\n// format strings for individual mm/ss/ms\ntmp=(int)aSecond;\n\
    seconds=tmp.ToString();\nif(seconds.Length<2)\n    seconds=\"0\"+seconds;\"\n\
    ```\n\n```\ntmp=(int)aMinute;\nminutes=tmp.ToString();\nif(minutes.Length<2)\n\
    \    minutes=\"0\"+minutes;\"\n```\n\n```\ntmp=(int)aHour;\nhour=tmp.ToString();\n\
    if(hour.Length<2)\n    hour=\"0\"+hour;\"\n```"
