  md: 'currentRotation is a float representing the angle, in degrees, that we need
    to turn the camera to try and reach the target rotation wantedRotation. It''s
    an interpolation carried out by Math.SmoothDampAngle.


    Math.SmoothDampAngle is an interpolation function designed specifically for between
    two angles. It will automatically catch the return value between 0 and 360 as
    well as choose the correct way around (if your value is 181°, it interpolate rather
    than down so that the rotation has a natural flow and doesn''t go back on itself).


    The Unity documentation tells us that SmoothDampAngle takes the following parameters
    (in order of how they should be passed in):


    | current | The current position. |

    | target | The position we are trying to reach. |

    | currentVelocity | The current velocity; this is modified by the function every
    time you call it. |

    | smoothTime | Approximately the time it will take to reach the target. a smaller
    value will reach the target faster. |

    | maxSpeed | Optionally allows you to clamp the maximum speed. |


    In this part of the code, theVelocity variable holds the current velocity of the
    interpolated move, but it is not actually used anywhere else in the script. It''s
    a required field for SmoothDampAngle, so we provide it for the function to work
    right and forget about it. Note that one possible could use the velocity may speed
    limiting the move, with SmoothDampAngle actually take care of this with no extra
    code by providing a maxSpeed parameter. This is useful for...


    The currentRotationAngle is, in fact, the rotation around the y-axis (hence using
    the name ylabel to describe its speed). The variable rotationSnapTime decides
    how time it should take for the rotation to happen, which is public and designed
    to be set in the Unity Editor Inspector on whichever gameObject the script is
    attached:


    ```

    currentRotationAngle = Math.SmoothDampAngle(currentRotationAngle, wantedRotation,
    yVelocity, rotationTime);

    ```


    The height movement is interpolated using Math.Lerp, which takes three parameters:
    the start amount, the target amount, and a time value clamped between 0 and 1.
    We use the float heightDamping, by Time.deltaTime, to make the transition time
    based. Are you wondering why do we need to make the time parameter best? How the
    time parameter of Math.Lerp works has been very popular question on various forums
    and help pages. The time value represents how much of a portion, of the difference
    between two values, that should be applied each time'
