  md: "# 3.1 Game-Specific Player Controller\n\nThe player controller derives from\
    \ a movement controller (which specializes in nothing more than movement of a\
    \ particular player type) and builds on its movement functionality to provide\
    \ full player logic.\n\nThe movement controllers are explained later in this book.\
    \ Chapter 5 outlines three movement controllers for three player types: a spaceship,\
    \ a humanoid player, and a wheeled vehicle.\n\nWhat logic goes into the player\
    \ controllers depends on the game; the example games in this book use the movement\
    \ controllers from Chapter 5 and add extra functionality to them, by combining\
    \ the movement controller with the weapon controllers to make armed players or\
    \ controlling the AI controller to have computer players.\n\nFor real examples\
    \ of player controllers, take a look at the example games in Chapters 10 to 13.\n\
    \nIn this section, we build a simple player controller to move a spaceship. It\
    \ derives from BaseTopDownSpaceShip.cs, which can be found in full Chapter 5.\
    \ This script also includes a player manager.\n\n```\nusing UnityEngine;\nusing\
    \ System.Collections;\n```\n\n```\npublic class SimplePlayerController : BaseTopDownSpaceShip\n\
    {\n    public BasePlayerManager myPlayerManager;\n    public UserManager myDataManager;\n\
    \n    public override void Start()\n    {\n        // tell our base class to initialize\n\
    \        base.Init();\n\n        // now do our own init\n        this.Init();\n\
    \    }\n\n    public override void Init()\n    {\n        // if a player manager\
    \ is not set in the editor, let's try\n        // to find one\n        if(myPlayerManager==null)\n\
    \            myPlayerManager=gameObject.GetComponent<BasePlayerManager>();\n\n\
    \        myDataManager= myManager.DataManager;\n        myDataManager.SetName(\"\
    Player\");\n        myDataManager.SetHealth(3);\n\n        didInit=true;\n   \
    \ }\n\n    public override void Update()\n    {\n        // do the update in our\
    \ base\n        UpdateShip();\n\n        // don't do anything until Init() has\
    \ been run\n}\n```"
