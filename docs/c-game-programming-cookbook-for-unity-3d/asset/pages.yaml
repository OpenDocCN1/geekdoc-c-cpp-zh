- pgno: 347
  md: "```\npublic class CarController_MVD : BaseVehicle\n{\n```\n\nAfter the variable\
    \ declarations, the Start() function overrides the Start() from the BaseVehicle\
    \ class. Even though this overridden version features no actual functionality,\
    \ it is important to do so since the original function (the function we are overriding)\
    \ called Init immediately, and we do not want to do that there. The Init() function\
    \ will be by the game controller for this game state:\n\n```\npublic override\
    \ void Start ()\n    // we are overriding the Start function of BaseVehicle\n\
    \    // because we do not want to initialize from here! Game\n    // controller\
    \ will call Init when it is ready\n```\n\nFor the CarController_MVD class, there\
    \ are two Init() functions, one for the general initialization and another called\
    \ InitAI() for dealing with the initialization of the AI system.\n\nInit() begins\
    \ by caching variables:\n\n```\npublic override void Init ()\n    Debug.Log(\"\
    CarController_MVD Init called.\");\n\n    // cache the usual suspects\n    myBody\
    \ = rigidbody;\n    myGO = gameObject;\n    myTransform = transform;\n```\n\n\
    The variable CanRespawn is used to restrict respawning when a respawn is already\
    \ in progress. At the start of the game, we allow respawning:\n\n```\n// allow\
    \ respawning from the start\ncanRespawn=true;\n```\n\nThe maximum acceleration\
    \ value used for AI players will be altered to make for a more interesting race,\
    \ such as speeding up an AI car so it can catch up when it falls too far behind.\
    \ For this reason, the original acceleration value needs to be stored for when\
    \ we want to put the maximum acceleration value back to its original value:\n\n\
    ```\n// save our accelMax value for later use, in case we need to\n// change it\
    \ to do AI catch up\noriginalMax=accelMax;\n```\n\nA default input controller\
    \ is added to all players, the Keyboard_Input class:\n\n```\n// add default keyboard\
    \ input if we don't already have one\nif (default_input==null)\ndefault_input=myGO.AddComponent<Keyboard_Input>();\n\
    ```\n\nThe BasePlayerManager should be attached to the player's gameObject. It\
    \ will be needed later, so we store a reference to it in myPlayerController, call\
    \ its Init() function for the player manager to initialize:"
