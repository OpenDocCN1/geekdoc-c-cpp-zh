    \n```\nvoid MakeInvulnerable()\n{\n    isInvulnerable=true;\n    shieldMesh.SetActive(true);\n\
    }\n\nvoid MakeVulnerable()\n{\n    isInvulnerable=false;\n    shieldMesh.SetActive(false);\n\
