- pgno: 216
  md: "The next step is to find out the relative position of the waypoint from the\
    \ (myTransform) transform.InverseTransform converts a position from world space\
    \ into local space. In this case, we take the position of the waypoint and convert\
    \ it into the local space of myTransform.\n\nThe result of the transform.InverseTransformPoint\
    \ space conversion is stored in a Vector3 type called RelativeWaypointPosition.\
    \ This vector now represents the direction that the AI would need to reach the\
    \ next waypoint.\n\nBy dividing the x value of RelativeWaypointPosition by its\
    \ magnitude, we end up with a number that, in layman's terms, says how much we\
    \ need to turn left or right to be facing the waypoint, a number that is perfect\
    \ for use as horizontal input to a steering system. The code below places the\
    \ calculated steer value into the variable (variable name used for horizontal\
    \ input throughout this book):\n\n```\nRelativeWaypointPosition=myTransform;\n\
    InverseTransform( currentWaypointPosition;\n// by dividing the horz position by\
    \ the magnitude,\n// we get a decimal percentage of the turn angle\n// that we\
    \ can use to drive the wheels\nhorz=RelativeWaypointPosition.x /\\ RelativeWaypointPosition.magnitude);\n\
    ```\n\nNow that contains the amount required to turn towards the next waypoint,\
    \ this value may be used to slow down the bot if it is moving too fast.\nThe absolute\
    \ (never negative) value of horz is checked against 0.5 to decide whether or not\
    \ acceleration should be used. If the turn is more than 0.5, acceleration is set\
    \ to 0. The acceleration into the vert is calculated by taking the RelativeWaypointPosition\
    \ z divided by its magnitude, the horizontal turn subtracted from it. The idea\
    \ is, even though the distance to the waypoint along the AI bot's z-axis is taken\
    \ into account, the more the turn is, the less the acceleration value will be.\
    \ In many cases, this should help the AI to get around corners without crashing:\n\
    \n```\n// now we do the same for torque, but make sure that\n// it doesn't apply\
    \ any engine torque when going\n// around a sharp turn...\nif ( Math.Abs ( horz\
    \ ) < 0.5f ) {\n vert=RelativeWaypointPosition.z /\n RelativeWaypointPosition.magnitude-\n\
    Math.Abs ( horz );\n}\nelse{\n NoMove();\n}\n```\n\nAIState.steer_to_target works\
    \ in the same way as the waypoint-steering code above, except that uses FollowTarget\
    \ to aim instead of the waypoint in the current-WaypointTransform variable:\n\n\
    ```\ncase AIState.steer_to_target:\n// make sure we have been initialized before\
    \ trying\n// to access waypoints\n```"
