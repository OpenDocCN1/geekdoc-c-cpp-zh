- pgno: 306
  md: "The GlobalRaceManager manager script instance gets a call to StartRace(), too,\
    \ so that its race states can get started:\n\n```\nvoid StartRace ()\n{\n    //\
    \ the SetPlayerLocks function tells all players to unlock\n    SetPlayerLocks\
    \ (false);\n\n    // tell the global race manager that we are now racing\n   \
    \ GlobalRaceManager.Instance.StartRace();\n}\n```\n\nA few times by the script\
    \ already in this section, the SetPlayerLocks tells players whether or not they\
    \ should be locked in place. As discussed in Chapter 5, when the vehicle controller\
    \ is outlined, locking the vehicles will constrain their x and z axes but not\
    \ the y-axis. This is so that the vehicle will still be affected by gravity; it\
    \ can can look natural at the beginning of the game. If the vehicle's y-axis were\
    \ locked, the car would sit exactly at its position in the game world resting\
    \ (which may be slightly above ground or perhaps too low) and not in its resting\
    \ spot against the ground.\n\nIn SetPlayerLocks(), all of the play scripts held\
    \ in the playerArray are called with the SetLock() function to pass the required\
    \ state:\n\n```\nvoid SetPlayerLocks ( bool aState )\n{\n    // tell all of the\
    \ players to set their locks\n    for ( int i = 0; i < numberOfRacers; i++)\n\
    {\n        thePlayerScript = ( CarController_MVD) playerList\n        thePlayerScript.SetLock(aState);\n\
    \    }\n}\n```\n\nUpdatePositions() asks the global race manager for the position\
    \ of the first player (since we know the main player was added to the game before\
    \ any of the others as it was the top of the list). The focusPlayerRacePosition\
    \ variable takes the return value of the call:\n\n```\nvoid UpdatePositions()\n\
    {\n    // we need to talk to the race controller to get what\n    // we need to\
    \ display on screen\n    focusPlayerRacePosition=\n    GlobalRaceManager.Instance.GetPosition(1);\n\
    }\n```\n\ntheLap is an integer. Here it is set to the return value from a call\
    \ to the race manager asking for how many laps player 1 has completed. We also\
    \ add an extra lap to this return value, since we are looking to find which lap\
    \ the player is currently at, not how many laps the player has completed:\n\n\
    ```\ntheLap= GlobalRaceManager.Instance.GetLapsDone(1) +1;\n```"
