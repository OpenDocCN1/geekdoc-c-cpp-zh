- pgno: 164
  md: '# # 7 Recipe: Waypoints Manager


    # ## 7.1 Waypoint System


    Both the racing game Motor Vehicle Doom and the shoot ''em up Interstellar Paranoids
    will need waypoints for the AI players. In Motor Vehicle Doom, we use waypoints
    for the AI and also for the main player for the following reasons:


    +   1. To check that the main player is heading in the right direction. The car
    controller code will track the player''s position on the track (based on which
    waypoint has been passed) and check its forward vector to make sure that it is
    facing the next waypoint along the track. If the player''s forward vector is not
    within a certain tolerance angle, the game will display a wrong way message and
    eventually respawn the car the right way.


    +   2. To enable the respawning system to find a "safe" place along the track
    to respawn the player as to use its rotation to point the respawned car in the
    right direction along the track.


    +   3. To find out how far the vehicle has traveled around the track, which is
    used to compare the other players progress amounts to to calculate race positions.


    Interstellar Paranoids uses waypoints for moving all of the enemies. Enemies are
    simple path followers that move along a path firing until they reach the end,
    where they are destroyed.'
