    # 12.3.5  User Interface


    The user interface for this game is a collection of gameObjects with GUIText and
    GUIText components attached. They are in the game scene (as gameObjects), referenced
    and managed by the game controller.

    Here are:


    +   1. Final_Position—A gameObject with a GUIText component on it, displaying
    a message that will be shown at the end of the game to inform the user of his/her
    final position.


    +   2. in_1—1—A GUIText containing a graphic showing the number 1, for the 3-2-1
    countdown at the start of the race.


    +   3. in_2—A GUIText containing a graphic showing the number 2, for the 3-2-1
    countdown.


    +   4. in_3—A GUIText containing a graphic showing the number 3, for the 3-2-1
    countdown.


    +   5. Text_Lap—A GUIText object positioned in the top left of the screen to show
    how many laps the user''s player has completed.


    +   6. Text_Position—A GUIText object positioned in the top right of the screen
    to show the current race position of the user''s player.


    +   7. WrongWay—A GUIText object positioned just up from the center of the screen.
    Its gameObject will be made active whenever the user''s vehicle is going the wrong
    way around the track.'
