  md: "```\n// Define the variables used in the script, the Corresponding\n// collider\
    \ the wheel collider at the position of\n// the visible wheel slide, the slip\
    \ prefab is the prefab instantiated\n// when the wheels slide, the rotation value\
    \ is the\n// value used to rotate the wheel around its axle.\npublic WheelCollider\
