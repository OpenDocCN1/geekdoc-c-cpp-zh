    ```\n\n```\npublic class SceneManager : MonoBehaviour\n{\n```\n\nThe (Start) function\
    \ calls DontDestroyOnLoad and passes in reference to this instance's gameObject.\
    \ What does this tell the game engine not to remove the gameObject from the game\
