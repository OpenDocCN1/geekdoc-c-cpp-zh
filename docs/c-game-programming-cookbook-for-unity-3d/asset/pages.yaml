  md: "# 5.3 Wheled Vehicle\n\nThe BaseVehicle.cs relies on Unity's built-in WheelCollider\
    \ system. WheelCollider components are added to gameObjects positioned in place\
    \ of the wheels supporting the car body. The WheelCollider components themselves\
    \ do not have any visual form, and meshes wheels are not aligned automatically.\
    \ WheelColliders are physics simulations; they take care of all of the physics\
    \ actions such as suspension and wheel friction.\n\nThe Unity documentation describes\
    \ the WheelCollider\n\n...a special collider for grounded vehicles. It has built-in\
    \ collision detection, wheel physics, and a slip-based tire friction model.\n\n\
    The physics and math behind the friction system are beyond the scope of this book,\
    \ though thankfully, the Unity documentation has an extensive investigation of\
    \ the subject on the WheelCollider page in the online help (http://docs.unity3d.com/Documentation/Components/classWheelCollider.html).\n\
    \nThe BaseVehicle.cs uses four WheelColliders for its drive (in the example games,\
    \ these are attached to empty gameObjects), and the actual orientation of wheel\
    \ meshes is dealt by a separate script called BaseWheelAlignment.cs and will be\
    \ explained in full later on the chapter.\n\nBaseVehicle.cs looks like this:\n\
    \n```\nusing UnityEngine;\nusing System.Collections;\n\npublic class BaseVehicle\
    \ : ExtendedMonoBehaviour\n{\n    public WheelCollider frontWheelLeft;\n    public\
    \ WheelCollider frontWheelRight;\n    public WheelCollider rearWheelLeft;\n  \
    \  public WheelCollider rearWheelRight;\n\n    public float steerMax = 30f;\n\
    \    public float accelMax = 5000f;\n    public float brakeMax = 5000f;\n\n  \
    \  public float steer = 0f;\n\n    public float motor = 0f;\n\n    public float\
    \ brake = 0f;\n\n    public float mySpeed;\n\n    public bool isLocked;\n\n  \
    \  [System.NonSerialized]\n    public Vector3 velo;\n\n    [System.NonSerialized]\n\
    \    public Vector3 flatVelo;\n\n    public BasePlayerManager myPlayerController;\n\
    ```"
