    \ Vector3 origin, Vector3 direction, RayCastHit hitInfo, out distance)\n\nThe\
    \ variable wallAvoidDistance is used as the distance parameter for raycasting,\
    \ which may be set in the Unity Inspector window. When the AI moves faster, it\
