  md: "There will be times when we may need to force the state of the bot from another\
    \ script, such as telling it when to start in the game begins. The function SetAIState\
    \ for that, passing in an AIState.\n\n```\npublic virtual void SetAIState(AIState\
    \ newState)\n{\n    // update AI state\n    currentAIState = newState;\n}\n```\n\
    \nIf chasing is required, the SetChaseTarget function should be used to pass in\
    \ a reference to the transform that needs chasing. It gets stored into a variable\
    \ named followTarget.\n\n```\npublic virtual void SetChaseTarget (Transform theTransform)\n\
    {\n    // set a target for this AI to chase, if required\n    followTarget=theTransform;\n\
    }\n```\n\nThe Update() function is called by Unity at each frame update, but we\
    \ need to be sure that the script has properly initialized before doing anything\
    \ significant with it because it may be possible for Update to be called before\
    \ Init() has finished its run.\n\n```\npublic virtual void Update()\n{\n    //\
    \ make sure we have initialized before doing anything\n    if(!init)\n       \
    \ Init();\n}\n```\n\nIf AIControlled is not set true, the function drops out before\
