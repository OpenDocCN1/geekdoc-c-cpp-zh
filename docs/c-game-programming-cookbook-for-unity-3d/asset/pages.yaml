    ```\n\nWe may as well keep a count of how many players there are here, since all\
    \ new players will have to be fed through this function. It will save having to\
    \ count every array later to find out how many players there are, the integer\
    \ numberOfRacers will hold the count:\n\n```\n// increment our racer counter so\
    \ that we don't have to do\n// any counting or lookup whenever we need it\nnumberOfRacers++;\n\
    ```\n\nThe currentID is returned to the RaceController calling this function,\
    \ and the race controller will use it for its unique number throughout the game:\n\
    \n```\n// pass this id back out for the race controller to use\nreturn currentID;\n\
    ```\n\nGetRacePosition() takes an ID as a parameter and returns the race position\
    \ of player, as stored in the racePositions Hashtable. Accessing data from the\
    \ Hashtable is a straightforward exercise of providing the key within square brackets:\n\
    \n```\npublic int GetRacePosition(int anID)\n{\n    // just returns the entry\
    \ for this ID in the racePositions\n    // hashtable\n    return (int)racePositions[anID];\n\
    }\n```\n\nLike GetRacePosition(), the GetLapsDone() function takes an ID as a\
    \ parameter and returns the current lap count of that, as stored in the raceLaps\
    \ Hashtable:\n\n```\npublic int GetLapsDone(int anID)\n{\n    // just returns\
    \ the entry for this ID in the raceLaps\n    // hashtable\n    return (int)raceLaps[anID];\n\
    }\n```\n\nCompletedLap() is called by a RaceController when the player passes\
    \ all of the checkpoints and crosses the start/finish line. The parameter it takes\
    \ is an integer, the player's unique ID:\n\n```\npublic void CompletedLap(int\
    \ anID)\n{\n```\n\nThe entry for anID in the raceLaps Hashtable is incremented\
    \ by adding 1 to its current value:\n\n```\n// if should already have an entry\
