- pgno: 364
  md: '# 13 Dish: Making the Game Tank Battle


    1974, Kee Games, a subsidiary of Atari, Inc., released an arcade game called Tank!
    It was a two-player game where players had to drive around a maze and destroy
    the other player''s tank. Although its graphics were simplistic black and white
    from a fixed top-down viewpoint, the game was extremely advanced for the time.
    Its control system was outstanding; it used two single-axis (up and down) joysticks
    to steer each vehicle as if each stick were controlling an individual track on
    each side of the tank.


    Tank! required two players to play; there was no artificial intelligence. Perhaps
    this was because of the complexity of AI programming and the technological limitations
    of the time, or perhaps it was a design decision; it had no apparent impact on
    its success, and the game was a huge hit. It would be quite a while before a single-player
    tank game would make it into the arcades.


    I personally recall the privilege of playing a tank game in an arcade in the late
    1970s; I played a multiplayer top-down tank game, but it was so long ago that
    I can''t be sure it was the original Tank! When I screenshots, it looks very familiar,
    at least. Despite brushing with it all that, the strongest memories of playing
    Tank! from its later incarnation as a game for the Atari 2600 game console. Variations
    on Tank! came on a game cartridge called Combat, released in 1977, which included
    a collection of 27 variations over five game types, all tied together by the main
    theme in the title. Most of my time on the Atari 2600 was spent battling against
    my brother or my cousin, each of us trying to blast each other out of the games
    or beat each other''s high scores. Tank! was a huge hit with us, and I''m sure
    that Combat would have ended up being the worst cartridge we owned.'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'Sometime in the early 1980s, something arrived at my local arcade that would
    change my perspective on video games forever. It was the game that finally fired
    my interest in virtual reality: Battlezone.


    Battlezone features vector 3D graphics and one of the most amazing arcade cabinets
    that any 80s kid could encounter. Instead of having to stand and look at the screen,
    Battlezone had a viewing goggles that looked rather like binoculars. Since it
    was aoggle, the player had to face his/her head to it and vision taken up entirely
    by the game.


    Battlezone was a single-player game, with enemies controlled by artificial intelligence.
    Just as with the original game Tank!, its control scheme used two single-axis
    joysticks to simulate control of individual tracks; push both sticks forward and
    the tank moved forward, pull one back and one forward when the tank turned. The
    viewpoint was first person, inside the tank. When a projectile hit the player''s
    vehicle, a vector-based glass cracking effect was displayed in front of the view
    as though the window of the tank had been hit. Battlezone was the closest thing
    possible to being inside a computer game. In the early 190s, it was a truly mind-blowing
    experience; 3D vector graphics were new, and the submersion level offered by the
    game, its control system, and its goggle-based arcade cabinet second to none.


    The design for the example game Tank Battle plinks itself down somewhere between
    Tank! and Battlezone. The action takes place in a maze, with a number of AI-controlled
    tanks driving around the game world trying to blast each other into oblivion (see
    Figure 13.1). The camera view is third person, behind the tank, with a fixed turret
    projecting forward.


    Its overall structure differs a little from other games in this book, as seen
    in Figure 13.2. This game may be found in the example games project, with its
    scenes in the Scenes/Tank Battle folder menu_TB and game_TB.


    Its prefabs are located in the Prefabs/Games/Tank folder.


    The most important thing to note about it is that there are several elements extremely
    close to those from the other example game in this book, Metal Vehicle Doom. The
    tanks are, in fact, the exact car prefab except for the fact that the tanks have
    inclusive


    ![](img/041dca164b58875f4f1a64abb3328f5c_365_0.png)


    Figure 13.1 The example game, Tank Battle.'
