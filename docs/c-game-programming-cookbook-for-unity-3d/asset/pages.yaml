    \ respawning:\n\n```\n// check to see if we've crashed and are upside\n// down/wrong(!)\n\
    Check_If_Car_Is_Flipped();\n```\n\nWhenever the race is running on an AI, gunControl\
    \ should be able to fire, so gun-Control.canControl is set to true:\n\n```\n//\
