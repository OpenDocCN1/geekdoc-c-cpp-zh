- pgno: 305
  md: 'All three of the 3-2-1 countdown should be hidden at the start of the game
    (otherwise, we''ll just have a big blob of all three numbers on the screen at
    the same time!). A call to the game controller''s HideCount() function takes care
    of that:


    ```

    // hide count in numbers

    HideCount();

    ```


    The code to make the 3-2-1 countdown happen made simple by Unity''s Invoke function.
    The functions that the game controller uses to display each number will hide each
    previously displayed number, all that needs to be done is staggered calling to
    each one followed by a final call to HideCount() to hide the final number at the
    end of the countdown sequence:


    ```

    // schedule count in messages

    Invoke("ShowCount3", 1);

    Invoke("ShowCount2", 2);

    Invoke("ShowCount1", 3);

    Invoke("HideCount", 4);

    ```


    When the race is over, the finalPosition GameObject will be shown. It contains
    a GIText component to display text the user that his/her final race position was.
    Of, at the start of the race, this should be hidden. GameObject.SetActive() hides
    it here:


    ```

    // hide final position text

    finalPositionText.gameObject.SetActive(false);

    ```


    After the final position message has been shown, a Boolean variable called FinalMessage
    will be set to avoid multiple calls for it to be shown. Here in the Init() function,
    doneFinalMessage gets reset to false:


    ```

    doneFinalMessage = false;

    ```


    The final in-game message that needs to be hidden is the wrong-way message. The
    gameObject is referenced in the wrongWaySign variable and GameObject.SetActive()
    is used to hide it:


    ```

    // start by hiding our wrong way message

    wrongWaySign.SetActive(false);

    ```


    The Init() function is done, so didInit get set to true so that other scripts
    (and parts of this script) know that the game should be ready to go:


    ```

    didInit=true;

    }

    ```


    When the race actually starts (after the 3-2-1 countdown), all of the cars need
    to be unlocked. SetPlayerLocks() is called here in the StartRace() function, setting
    all players'' lock states to false.'
