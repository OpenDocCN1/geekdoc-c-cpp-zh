  md: "As mentioned in this section, the TellGCnemyDestroyed() function (and also\
    \ the TellGCBossDestroyed() function) is designed to be overridden if a new type\
    \ of game controller is used. These functions call EnemyDestroyed() or BossDestroyed()\
    \ on it.\n\nGameController_IP.EnemyDestroyed() takes three parameters: the enemy\
    \ destroyed, how much score the player should be awarded for blasting it, and\
    \ finally, the owner ID of the projectile that the player may have identified.\
    \ Without the ID, the game controller would not know which player to award the\
    \ score to:\n\n```\npublic virtual void TellGCnemyDestroyed()\n```\n\n```\nGameController_IP.Instance.EnemyDestroyed(myTransform.position,\n\
    pointsValue, tempINT);\n```\n\n```\npublic virtual void TellGCBossDestroyed()\n\
    ```\n\n```\nGameController_IP.Instance.BossDestroyed();\n```\n\n# 14.3.5 Waypoint\
    \ Follower\n\nEnemy spaceships move along waypoint paths as they fire at the player\
    \ at the bottom of the screen. The BaseEnemy script controls firing, and the AI\
    \ controller deals with path following through its translate_along_waypoint_path\
    \ state. For the AI controller to do this, it needs to know which waypoint controller\
    \ to use and has its AIState (its default state is to patrol, not follow, waypoints)\
    \ and the BasepointFollower.cs script serves this purpose.\n\nThe BaseWaypointFollower.cs\
    \ script:\n\n```\n// uses the translate_along_waypoint_path function of the AIController\n\
    // follow along a path\n```\n\n```\npublic class BaseWaypointFollower : ExtendedCustomMonoBehavior\n\
    {\n    public BaseAIController AIController;\n\n    public virtual void Start\
    \ () {\n        if(didInit)\n            Init (\n    }\n\n    public virtual void\
    \ Init () {\n        // cache our transform\n        myTransform= transform;\n\
    \n        // cache our gameObject\n        myGO= gameObject;\n\n        // cache\
    \ a reference to the AI controller\n        AIController= myGO. GetComponent<BaseAIController>();\n\
    \    }\n}\n```"
