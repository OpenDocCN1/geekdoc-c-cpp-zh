  md: "Private static variable exists within the class it was declared and in any\
    \ other instances of the same class. Other classes/types of script will not be\
    \ able to access it.\n\nAs a working example, try to imagine a script named player.cs\
    \ directly controls player objects in your game. They all need to tell a player\
    \ script when something happens, so we declare the player manager as a static\
    \ variable in this player.cs script like this:\n\n```\nprivate static Player playerManager;\n\
    ```\n\nThe playerManager object only needs to be set up, by a single instance\
    \ of the player class, to be ready to use for all the other instances of the same\
    \ class. player.cs scripts will be able to access the same instance of the PlayerManager.\n\
    \n# 4. The singleton design pattern.\n\nIn the previous part of this section,\
    \ we were looking at a static variable to share a manager across the entire game\
    \ code. The biggest disadvantage with this method is that it is possible to create\
    \ multiple instances of the same script. If this happens, you may find that your\
    \ player code is talking to the wrong instance of the game controller.\n\nA singleton\
    \ is a commonly used design pattern that allows for only one instance of a particular\
    \ class to be instantiated at a time. This is ideal for our game scripts that\
    \ may need to communicate (or be communicated with) across the entire game code.\
    \ Note that we will be providing a static reference to the script, exactly as\
    \ we did in the \"Static Variables\" method earlier in this section, but by implementing\
    \ a singleton class, we will be adding some extra code to make sure that only\
    \ one instance of our script is ever created.\n\n# 1.1.3 Using the Singleton Pattern\
    \ in Unity\n\nIt is not too difficult to see how useful static variables can be\
    \ in communication between different script objects. In the public static example\
    \ cited earlier, the idea that we had a game controller object that needed to\
    \ be accessed from one or more scripts in your game.\n\nThe method shown here\
    \ was demonstrated on the Unity public wiki by a user named Emil Johansson (AngryAnt).\
    \ It uses a private static variable in conjunction with a public static function.\
    \ Other scripts access the public function to gain access to the private static\
    \ instance of this script, which is returned via the public function so that only\
    \ one instance of the object will ever exist in a scene regardless of how many\
    \ components it is attached to and regardless of how many times it is instantiated.\n\
    \nA simple singleton structure:\n\n```\npublic class MySingleton\n{\n    private\
    \ static MySingleton instance;\n\n    public MySingleton ()\n}\n```\n\n> * http://wiki.unity3d.com/index.php/Singleton."
