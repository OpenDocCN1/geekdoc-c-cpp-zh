    } else\n{\n    // we are player 2, so that we instead\n    GameController_IP.Instance.UpdateLivesP2(myData.GetHealth());\n\
    }\n```\n\nSetting the isControlled variable to true will add a new script component\
    \ from the script Mouse_Input.cs to be used as input for this player:\n\n```\n\
    if (isControlled)\n{\n    // we are going to use mouse controls, add a mouse input\n\
    \    // controller\n    mouse_input=gameObject.AddComponent<Mouse_Input>();\n\
    }\n```\n\nWith Init() all, the didInit Boolean variable is set to true. Other\
    \ functions will refer to this to check that the player has been set up before\
    \ trying to manipulate it in ways that might otherwise cause errors or problems:\n\
    \n```\ndidInit=true;\n```\n\nThe Update() function is used for all of the main\
    \ player updates. It overrides the Update() function from the base class (BaseTopDownShip.cs):\n\
    \n```\npublic override void Update()\n{\n```\n\nBefore doing anything to the player,\
