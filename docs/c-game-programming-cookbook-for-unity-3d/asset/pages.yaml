    {\n    // tell the player controller that we have finished\n    GameController_IP.Instance.PlayerDied(ownerID);\n\
    }\n```\n\n# 14.3.4 Enemies\n\nThe Enemy_IP.cs script:\n\n```\nusing UnityEngine;\n\
