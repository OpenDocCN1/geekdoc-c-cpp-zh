    # 3.2 Dealing with Input


    Separate scripts provide input for the movement controllers to react. This is
    so they may be switched out for whatever input is required, without having to
    change anything within the movement controller remains intact, regardless of what
    you "feed" into it, which means you could use the exact movement controller script
    for the main player, for AI players, and perhaps even for remote players connected
    over a network—just using different inputs.


    BaseInputController provides a collection of common variables and functions. Other
    input scripts will derive from it:


    ```

    public class BaseInputController : MonoBehaviour

    {

    // directional buttons

    public bool Up;

    public bool Down;

    }

    ```'
