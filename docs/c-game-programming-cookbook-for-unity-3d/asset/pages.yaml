  md: '# 9 AI Manager


    When computer scientist John McCarthy coined the term artificial intelligence
    (AI) in the mid-1950s, I doubt anything like the path-finding killer robot cars
    we will be building in this book would have been on his mind.


    The AI Controller in this book is a basic state machine, focused on function rather
    than any kind of emotional simulation. For it to work the example games later
    on in the book, our AI controller will be able to perform several different actions.
    It will need to be able to control a vehicle (as in a body, a spaceship, or other
    moving entity) by turning and moving forward and backward and using vision to
    avoid obstacles. When we need the controller to follow a specific path, it should
    be capable of turning toward and moving in the direction of checkpoints.


    Achieving this will require the controller to act differently in several different
    states. The BaseAIController.cs states as follows:


    +   1. moving_looking_for_target


    Moves forward, continuously checking the distance between this object and the
    target. If the distance is below a set chase distance (maxChaseDistance), then
    the AI uses raycasting to check the line of sight between object and target. If
    the target is visible, the AIState changes to chasing_target.


    Two "feeler" raycasts will be made out from the front of this object, looking
    for obstacles. If an obstacle is found on the right, the AIState changes to turn
    left. If an'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'obstacle is found on the left, the AIState changes to turn right. If obstacles
    are found to be on sides, the AIState switches to backing_looking_for_target.
    The AI will back up until it no longer detects any obstacles.


    +   2. chasing_target


    The AI will turn to face the target and move forward it. If the target falls out
    of range, the AIState returns to moving_for_target.


    +   3. backing_up_looking_for_target


    In this state, the AI moves backward until no obstacles are found for forward
    raycasting. When no obstacles are found, the AIState switches randomly to either
    stopped_turning_left or stopped_turning_right. This is randomized to help reduce
    situations where backing up and turning in a particular direction are unsuccessful
    in getting the AI away from an obstacle. Repeated backing up and turning should
    eventually free the AI. As it does, the code still checks to see whether its target
    is within range (and if it is, the AIState will change to chasing_target).


    +   4. stopped_turning_left


    The AI will turn to its left until no obstacles are found by the forward raycasts.
    Although this state means the AI is not moving, the code checks to see whether
    its target is within range (and if it is, the AIState will change to chasing_target
    instead).


    +   5. stopped_turning_right


    The AI will turn to its right until no obstacles are found. If its target is within
    range, the AIState will change to chasing_target.


    +   6. paused_looking_for_target


    The AI does not move in this state but continues to check to see whether the target
    is within range to chase.


    +   7. translate_along_waypoint_path


    Waypoints (managed by an instance of the Waypoints_Controller.cs script component,
    discussed in Chapter 7) are used as targets to aim for. Transform.Translate is
    used to move the AI around, and the BaseAIController.TurnTowardTarget() is used
    to control rotation. The AI will move forward toward a target and move to the
    next waypoint when it gets close to it.


    +   8. steer_to_waypoint


    This state is similar to the translate_along_waypoint path except it does not
    use TurnTowardTarget() for steering. Instead, input values are calculated (in
    the'
  merge: -1
  img_proc: true
