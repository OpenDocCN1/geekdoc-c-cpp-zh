    \ Start() so as not to call Init, as we want\n    // the game controller to do\
    \ this in this game.\n    didInit=false;\n}\n```\n\nRather than having all of\
    \ the initialization in the Start() function, it has its own function called Init()\
    \ to keep things tidy. Init() begins by caching references to the transform, gameObject,\
    \ and rigidbody.\n\n```\npublic virtual void Init()\n{\n    // cache refs to our\
    \ transform and gameObject\n    myTransform=transform;\n    myGO=gameObject;\n\
    \    myBody=rigidbody;\n}\n```\n\nInput comes from an Keyboard_Controller.cs held\
    \ in a variable called default_input, which we will look into detail later in\
