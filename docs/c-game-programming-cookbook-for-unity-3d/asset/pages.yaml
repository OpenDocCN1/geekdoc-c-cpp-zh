    to 1 MB. If this limit is exceeded, SetInt, SetFloat, and SetString will not store
    the value and throw a PlayerPrefsException.


    The filename for the preferences file this script uses is made up of a combination
    of the contents of the string named gamePrefsName and a suffix of _SFXVol. The
    gamePrefs string should be set in the Unity editor so that each game has a unique
    preferences file.


