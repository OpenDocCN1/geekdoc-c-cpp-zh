  md: "```\nif (currentObjectNum > totalObjectsNum-1)\n  currentObjectNum=0;\n```\n\
    \n# ## 4.4 Set Gravity\n\nChanging gravity is often frowned upon by developers\
    \ because doing so changes the ways objects behave in the physics simulation.\
    \ It is highly recommended that your game physics values, game scale, and speeds\
    \ are as close to real-life numbers as possible. Making a game with an environment\
    \ scaled too high or too low can cause problems with the collision system as well\
    \ as make your coordinate system to manage. Altering gravity to extremely high\
    \ values may cause objects to behave strangely or even push down through collision\
    \ meshes. Dealing with strange physics values needs to be handled with a little\
    \ care and awareness of \"entering the twilight zone\" in physics behaviors.\n\
    \nThe reality is that having realistic gravity with realistically scaled 3D models\
    \ and realistic physics behavior may not be either possible or, in fact, necessary.\
    \ Perhaps the effect you are going for is something outside of realistic, in which\
    \ case it may become necessary to modify physics values such as gravity. Games\
    \ based on another planet would likely be the most obvious use for changing these\
    \ values. In the example games in this book, when gravity is altered it is purely\
    \ on a personal preference of how I like game feels.\n\nThe SetGravity.cs script\
    \ sets gravity once in the Start() function and disables itself to save any unnecessary\
    \ overhead. Its logic is extremely simple, being a single call to set Physics\
    \ to a 3D vector and disabling it by setting this.enabled to false. The variable\
    \ is simply a reference to itself, a way of telling the script to refer to itself:\n\
    \n```\npublic class SetGravity : Monobehavior {\n\n  public Vector3 gravityValue\
    \ = new Vector3(0,-12.81f,0);\n\n  void Start () {\n    Physics.gravity=gravityValue;\n\
    \    this.enabled=false;\n  }\n}\n```\n\n# ## 4.5 Pretend Friction—Friction Simulation\
    \ to Prevent Slipping Around\n\nThe easiest way to move objects around in Unity\
    \ is to simply apply forces to your rigid-bodies. Using Rigidbody.AddForce and\
    \ perhaps a multiplier based on Input.GetAxis or something similar, it is quite\
    \ easy to get objects moving around, but the only way to have them come to a stop\
    \ is either to make friction against something else in the game world or to change\
    \ drag values on the rigidbody. This may not be an ideal"
  merge: -1
  img_proc: true
