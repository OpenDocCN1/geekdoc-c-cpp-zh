  md: "As with players,gameObjects used to define player start positions are stored\
    \ in\narray called startPoints (again, its references are set in the Inspector\
    \ window of the Unity\neditor. Note that there needs to be at least the same amount\
    \ of start positions as players\nfor this function to work (as each player will\
    \ need one).\n\nThe function iterates through the start position objects to get\
    \ at positions and rotations\nfrom them and store each one into the playerStarts\
    \ and playerRotations:\n\n```\n// initialize temporary arrays we can use to set\
    \ up the\n// players\nVector3 [i] = new Vector3 [numberOfOfPlayers];\nQuaternion\
    \ [i] playerRotations = new Quaternion [numberOfOfPlayers];\n\n// we are going\
    \ to use the array for of start positions that must\n// be in the editor, which\
    \ means we always need to make sure\n// there are enough start positions for the\
    \ number of players\n\nfor ( int i = 0; i< numberOfOfPlayers; i++ )\n{\n    //\
    \ grab position and rotation values from start position\n    // transforms set\
    \ in the inspector\n    playerStarts[i] = (Vector3)startPoints[i].position;\n\
    \    playerRotations[i] = (Quaternion)startPoints[i].rotation;\n```\n\nNow that\
    \ the function has arrays for players, start positions and rotations, it can\n\
    call upon the SpawnController's instance SetUpPlayers() function to bring them\
    \ into the\ngame scene:\n\n```\nSpawnController.Instance.SetUpPlayers( playerPrefabList,\n\
    playerStarts,playerRotations, playerParent, numberOfOfPlayers );\n```\n\nAt some\
    \ point, it is inevitable that this script will need to communicate with the players.\n\
    The player transforms get stored in an ArrayList called playerTransforms and references\
    \ to\nthey control scripts (instances of PLAYER_LBS.cs) held in an array named\
    \ playerList.\nThe SpawnController returns an ArrayList() back from GetAllSpawned\n\
    Transforms() that we use to iterate through to get each Player_LBS instance with\n\
    GetComponent():\n\n```\nplayerTransforms=new ArrayList();\n\n// now let's grab\
    \ references to each player's controller script\nplayerTransforms =\nSpawnController.Instance.GetAllSpawnedTransforms();\n\
    \nplayerList=new ArrayList();\n\nfor ( int i = 0; i< numberOfOfPlayers; i++ )\n\
    {\n    tempT=(Transform)playerTransforms[i];\n    Player_LBS tempController=\n\
    \    tempT.GetComponent<Player_LBS>();\n    playerList.Add(tempController);\n\
    \    tempController.Init ( );\n}\n```"
