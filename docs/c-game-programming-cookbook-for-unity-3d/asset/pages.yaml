    \ )\n        return;\n}\n```\n\nApplication.Playing can be checked to find out\
    \ whether not Unity is in edit mode or playing your game. There is no point in\
    \ wasting time or CPU cycles drawing waypoints when the game is running, so we\
    \ did a quick check to drop whenever we are not in edit mode.\n\nThe next steps\
    \ are to keep the transforms up to date (just in case they are moved or new ones\
    \ added in the editor). Also, when you build a path, obviously it will start with\
    \ a single waypoint. With only one point, there is no end point for rendering\
    \ a line in the editor, so this function checks that there are enough waypoints\
    \ to actually draw a line and drops out when totalTransforms is less than 2.\n\
    \n```\nGetTransforms();\n```\n\n```\n// make sure we have more than one transform\
    \ in the\n// the list, otherwise we can't draw lines between them\nif (totalTransforms\
    \ < 2)\n    return;\n```\n\n```\n// draw our path first, we grab the position\
    \ of the very\n// first waypoint so that our line has a start point\nTEMTRans\
    \ = (Transform)transforms[0];nlastPos = TEMTRans.position;\n```\n\n```\n// we\
    \ point each waypoint at the next, so that we can use\n// the wrong way or to\
