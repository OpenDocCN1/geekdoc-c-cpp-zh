  md: "This alternative version of the LoadLevel function shown below uses an index\
    \ to get a level name earlier to load handling. It uses the original LoadLevel\
    \ function declared again. Keeping the focus on using a single function for all\
    \ load-ings rather than duplicating the code or having happen in more than one\
    \ place:\n\n```\nprivate void LoadLevel( int indexPath )\n{\n    // load the game\
    \ level\n    LoadLevel(levelNames[indexNum]);\n}\n```\n\nThe final function in\
    \ the scene manager class is used to reset gameLevelNum-ever we start a new game.\
    \ It is assumed that the script restarting the game will call this function before\
    \ calling GoNext() again.\n\n```\npublic void ResetGame()\n{\n    // reset the\
    \ level index counter\n    gameLevelNum = 0;\n}\n```\n\n# 2.2.3 ExtendedCustomMonoBehavior.cs\n\
    \nExtending MonoBehavior is a useful way to avoid repeating common functions or\
    \ variable declarations. Many classes share functions and/or variables. For example,\
    \ most of the scripts in this book use a variable myTransform to refer to a cached\
    \ version of their transforms to save having to look up the transform every time\
    \ we need to access it. As MonoBehavior provides a host of system functions and\
    \ calls, making a new class that extends, it can be useful tool to have in the\
    \ kit. Whereas a new class would use MonoBehavior, we just derive from the new\
    \ ExtendedCustomMonoBehavior script instead.\n\nFor the scripts in this book,\
    \ the ExtendedCustomMonoBehavior.cs script extends MonoBehavior to include\n\n\
    +   1. myTransform variable to hold a cached reference to a transform\n2. myGO\
    \ variable to hold a cached reference to a gameObject\n3. myBody variable for\
    \ a cached reference to a rigidBody\n4. aDidInit Boolean variable to determine\
    \ whether or not the script has been initialized\n5. an integer variable called\
    \ id to hold an id number\n6. a Vector3 type variable called tempV used for temporary\
    \ vector actions\n7. a Transform variable called tempTR used for any temporary\
    \ references to transforms\n8. a function called SetID(integer) so that other\
    \ classes can set the variable"
