- pgno: 50
  md: '# 3 Player Structure


    A player can take just about any form—humans, aliens, animals, vehicles; designing
    a structure that can deal with all of them is a challenge in itself. The way that
    players store data, the data they need to store, the various types of movement
    codes and their control systems make for hundreds of different possible combinations.
    Dealing with a player structure in a modular way requires a careful consideration
    not just for how to deal with all these different scenarios but also for how our
    components will need to communicate with each other and communicate with the rest
    of the game—for example, player objects often need to communicate with the game
    states, etc.), and players may also need to interact with the environment and
    other objects within.


    The overall player structure for this book may be broken down into several main
    components, as shown in Figure 3.1.


    +   1. **Game-specific player controller.** This is a script to deal with game-specific
    player actions. For example, some games may require a vehicle that requires weapons,
    whereas some games may not. The "game-specific control script will "add on" the
    specific extra functionality and tie together the main components to work or communicate
    with other game-specific elements.


    +   2. **Movement controller.** The movement controller takes the job of moving
    the player around and defines the type of player we are using. For example, a
    vehicle-based player would have a vehicle-based movement control script that would
    drive the'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/041dca164b58875f4f1a64abb3328f5c_51_0.png)


    wheels, turn them, or operate extra vehicle-specific functions like a horn, headlights,
    etc. A human would require a code to drive a character controller. A spaceship
    might require use physics forces to drive a spaceship.


    +   3. **Player manager.** This script is intended to be a bridge between the
    player controller and the user data manager. The user data manager takes care
    of storing player stats, such as score, lives, level, etc.


    +   4. **Data manager.** The data manager takes care of the manipulation of player
    data and how the data are stored and retrieved. Score and health values would
    be stored here, and the data manager would also provide functions for saving and
    loading its data.


    Along with these main components, we can add some extra components to mix and
    match player types into different forms. A weapon control script may be attached
    to a human to create the player in a first-person shooter, or the same weapon
    control script could be added to a vehicle-type player to turn it into a tank.
    An AI control script may be added to drive the player or to operate the weapons
    and so on.


    In this chapter, we will be going through some of the main components that will
    be used later in the book to create a user-controlled player.'
