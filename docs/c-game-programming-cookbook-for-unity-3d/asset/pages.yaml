    The CharacterState animation state is held by _characterState is set by the movement\
    \ scripts (UpdateDirectionalMovement() and UpdateRotationalMovement()) functions),\
    \ which speeds the animation at they are declared here using the controller.velocity.magnitude(the\
    \ speed at which the controller is moving) clamped to runMaxAnimationSpeed to\
