- pgno: 62
  md: '# #4 Recipes: Common Components


    # ## 4.1 Introduction


    Many of the scripts in this book are in some way linked to the base framework
    or parts of larger systems, but there are some that we will use that could fit
    into a whole number of positions in a whole number of different game types. Utility
    scripts or commonly used systems are also going to be really handy for the game
    projects. This chapter is all about those, an eclectic bunch of reusable scripts
    such as timers or utilities.


    In the example source files, the COMMON folder can be found within the Scripts
    folder. This is where we store all of the scripts that may crop up now and again
    that are not part of the base framework. Within the COMMON folder, there are a
    number of subfolders. Those are


    BOTS OR PLAYER CONTROL


    Scripts related to player or automatic control, such as a script to talk to the
    BaseAIController.cs script and act as a simple, functional bot moving around in
    a game environment.


    CAMERA


    Scripts related to the camera should go in here, such as third-person or top-down
    camera code.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# GAME CONTROL


    The scripts in this folder are about overall game state control. In the example
    files, you will find


    BattleController and GlobalBattleManager—This script is used for deathmatch-style
    scoring and game state logic.


    RaceController and GlobalRaceManager—This script contains the base logic for racing
    games, such as lap counting and position tracking.


    SceneManager—This script deals with the loading of scenes as well as with incremental
    game scene management (as used in the Interstellar Paranoids example game of this
    book).


    # INPUT


    Different player and game types require different control systems or input methods.
    Any common scripts dealing with input go in this folder.


    # SPAWNING


    Scripts related to spawning may be found here, which includes code to spawn objects
    when triggers are fired or to spawn paths for dynamic following objects.


    # UTILITY


    The Utility folder is home to small helper scripts, such as the timer class or
    a script to automatically spin a gameObject.


    # WEAPONS


    Any weapons-related scripts outside of the base framework may be found here.


    The scripts in this chapter will be used in various places later on in the example
    games parts of this book.


    This chapter will look in detail at the following:


    +   * 4.2 The timer class

    * 4.3 Scripts used for spawning

    * 4.4 A script to set gravity

    * 4.5 A script that simulates friction

    * 4.6 Cameras

    * 4.7 Input scripts'
