  md: "Once the attack wave is in the scene, we use GameObject.GetComponent to find\
    \ the WaveProperties prefab that needs to be attached to the parent gameObject\
    \ prefab. This script has a single variable that we need to get at: enemiesInWave.\
    \ As long as enemiesInWave is correctly set on the prefab, the wave spawner uses\
    \ the currentWave to store how many enemies the player needs to destroy to progress\
    \ to the next wave:\n\n```\nWaveProperties tempProps=\ntempObj.GetComponent<WaveProperties>();\n\
    currentWave=tempProps.enemiesInWave;\n```\n\nWhenever an enemy is destroyed, the\
    \ game-specific game controller makes a call to the following Fragged() function\
    \ (see earlier in this chapter GameController_LBS.cs):\n\n```\npublic void Fragged()\n\
    {}\n```\n\nWe decrease the value of currentWave, which holds how many enemies\
    \ are in the current wave:\n\n```\n// one enemy down\ncurrentWave--;\n```\n\n\
    Then the value of currentWave is checked to see whether it is less than or equal\
    \ to 0. If this is true, it must be time to spawn the next wave so a call goes\
    \ out to the LaunchWave() function:\n\n```\nif(currentWave <= 0)\n{\n    // this\
    \ wave is done, let's start the next one!\n    LaunchWave();\n}\n```\n\n# 11.9\
    \ Wave Properties\n\nThe Wave_Spawner.cs script outlined in the last section showed\
    \ that we need to know how many enemies are in each attack wave. To take care\
    \ of this, this simple WaveProperties script is attached to the attack wave prefab.\
    \ It contains a single integer named enemiesInWave that we set in the Unity editor\
    \ Inspector window. The game controller script will access this value whenever\
    \ a new wave is spawned, and it will use the value of enemies-InWave to keep track\
    \ of enemies in each wave.\nWaveProperties.cs looks like this:\n\n```\npublic\
    \ class WaveProperties : MonoBehaviour\n{\n    public int enemiesInWave;\n}\n\
    ```"
