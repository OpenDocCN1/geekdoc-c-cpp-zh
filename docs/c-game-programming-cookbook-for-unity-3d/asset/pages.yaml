  md: "using UnityEngine;\nusing System.Collections;\nusing AIStates;\n\nThere are\
    \ a lot of variables to declare, so don't worry about those right away. We will\
    \ see how they are used later in the breakdown.\n\nThe Init() function takes care\
    \ of making cached references to the GameObject, the transform, and its rigidbody\
    \ (note the script assumes that there will always be a rigidbody- attached to\
    \ the AI gameObject):\n\n```\npublic void Init()\n{\n    // cache ref to gameObject\n\
    \    myGO = gameObject;\n\n    // cache ref to transform\n    myTransform = transform;\n\
    \n    // cache a ref to our rigidbody\n    myBody = myTransform.rigidbody;\n```\n\
    \nrotateTransform is an optional parameter that may be set in the Unity editor\
    \ window to provide a transform for rotation that is different from the one to\
    \ which the script is attached. This is used in cases where we do not wish to\
    \ rotate the main transform:\n\n```\n// rotateTransform may be set if the object\
    \ we rotate is\n// different to the main transform\nif(rotateTransform==null)\n\
    \    rotateTransform=myTransform;\n```\n\nWith all of the other scripts in this\
    \ book, didnt it a Boolean variable used to determine or not the Init() function\
    \ has successfully completed.\n\n```\n// init done;\ndidInit=true;\n```\n\nA Boolean\
    \ variable named AIControl is used to decide whether or not this script should\
    \ take control. The SetAIControl() function provides an easy way for other scripts\
    \ to enable or disable AI control:\n\n```\npublic void SetAIControl( bool state)\n\
    {\n    AIControlled= state;\n}\n```\n\nThe script continues with some functions\
    \ to set several of the main parameters in the AI behavior. Those are the following:\n\
    \n+   - patrolSpeed (float) Determines quickly the bot should move when it is\
    \ patrolling.\n- patrolTurnSpeed (float) Determines quickly the bot should turn\
    \ when patrolling.\n- wallAvoidDistance (float) Determines, in 3D units, how far\
    \ the bot should look ahead in its attempts to avoid running into walls when it\
    \ is patrolling."
