  md: "A player manager (BasePlayerManager) is referenced by this script, but it is\
    \ unused by the rest of the script and does nothing other than its initialization\
    \ function Init(). It is here to fit into the framework and for future development\
    \ of the script:\n\n```\npublic BasePlayerManager myPlayerController;\n```\n\n\
    The default input system is a keyboard script in which there is no need to serialize\
    \ because it is only used internally.\n\n```\n[System.NonSerialized] public Keyboard_Input\
    \ default_input;\n```\n\nAn AudioSource is required on the vehicle to make an\
    \ engine noise. To set one up, add an AudioSource to the gameObject (Component\
    \ -> Audio -> AudioSource) and reference an engine audio clip. On the AudioSource,\
    \ check the boxes for Loop and Play Awake:\n\n```\npublic AudioSource engineSoundSource;\n\
    ```\n\nThe Start() function is called by the engine automatically. It calls the\
    \ Init() function, which begins by caching references to commonly used objects:\n\
    \n```\npublic virtual void Start() {\n    Init();\n}\npublic virtual void Init()\
    \ {\n    // cache the usual suspects\n    myBody = rigidbody;\n    myGO = gameObject;\n\
    \    myTransform = transform;\n```\n\nGameObject.AddComponent adds the default\
    \ input controller to the gameObject:\n\n```\n// add default keyboard\ndefault_input\
    \ = myGO.AddComponent<Keyboard_Input>();\n```\n\nA BasePlayerManager script should\
    \ already be attached to the gameObject, as per the standard player setup for\
    \ the framework, but just to be safe, a null check is made before calling the\
    \ Init():\n\n```\n// cache a reference to the player controller\nmyPlayerController=\
    \ myGO.GetComponent<BasePlayerManager>();\n```\n\n```\n// call base class init\n\
    if (myPlayerController!=null)\n    myPlayerController.Init();\n```\n\nThe center\
    \ of mass may be set on a rigidbody to change the way it behaves in the physics\
    \ simulation. The farther the center of mass is from the center of the rigidbody,\
    \ the more it will affect the physics behavior. Setting the center of mass down\
    \ at -4, for example, help a lot to keep the car stable. This is a method often\
    \ employed to keep vehicles"
