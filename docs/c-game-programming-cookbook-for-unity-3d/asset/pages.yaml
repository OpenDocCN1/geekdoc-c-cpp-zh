  md: "# 4.6.1 Third-Person Camera\n\nA third-person camera sits behind the player.\
    \ It is not quite the same as a follow camera; a third-person camera usually orbits\
    \ the player rather than simply following it. To visualize this, imagine that\
    \ the camera is tied to a pole attached to the target player. As the player moves,\
    \ the camera remains to the length of the pole away from but it is free to move\
    \ the player in a circle (see Figure 4.1).\n\nThe position of the camera is usually\
    \ somewhere behind the player, with a little damping on its horizontal movement\
    \ applied to it, for a good sense of movement when the player turns. In some third-person\
    \ camera setups, the camera may be allowed to move in or out of the target player.\
    \ In some setups, the camera may also be offset from the player a little (e.g.,\
    \ in the Microsoft Studios game Gears of War, the camera is positioned over the\
    \ right shoulder of the player rather than directly behind).\n\nBelow is the Camera_Third_Person\
    \ script:\n\n```\npublic class Camera_Third_Person : BaseCameraController\n{\n\
    \    public Transform myTransform;\n    public Transform target;\n    public float\
    \ distance = 20.0f;\n    public float height = 5.0f;\n    public float heightDamping\
    \ = 2.0f;\n\n    public float lookAtHeight = 0.0f;\n\n    public float rotationSnapTime\
    \ = 0.3F;\n\n    public float distancesSnapTime;\n\n    public Vector3 lookAtAdjustVector;\n\
    \n    private float usedDistance;\n\n    float wantedRotationAngle;\n    float\
    \ wantedHeight;\n```\n\n![](img/041dca164b58875f4f1a64abb3328f5c_90_0.png)\n\n\
    Figure 4.1 Behavior of a third-person camera."
