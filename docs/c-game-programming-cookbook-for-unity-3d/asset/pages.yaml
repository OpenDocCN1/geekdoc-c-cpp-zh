    FastProjectileBlaster


    # 12.3 Ingredients


    Metal Vehicle Doom uses these ingredients:


    +   1. Game Controller—The game controller script for this game derives from BaseGameController.cs.

    2. Race Manager—Each player has a race controller script attached to it, which
    holds information relevant to its race stats (position/waypoint, etc.). The race
    manager talks to all of the player’s race controllers and tracks global information
    on the state of the race, such as player race positions and whether or not the
    race is still in progress.'
