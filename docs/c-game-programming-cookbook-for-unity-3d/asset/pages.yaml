  md: "# # 4.10 Scene Manager\n\nThe scene manager deals with loading and saving different\
    \ scenes. It is intended to be used for loading different levels in a game, but\
    \ also it may easily be used for loading the menu if required.\n\nThe example\
    \ game Interstellar Paranoids uses it to load game levels. It is attached to an\
    \ empty gameObject in the game scene, and thanks to its Call DontDestroyOnLoad()\
    \ in the Start() function, it will persist across scenes so that it is always\
    \ available.\n\nAdditionally, this class provides some basic functionality for\
    \ game level management in linearly progressive games; that is, progresses through\
    \ the same levels each time.\n\nThe script is designed to use an array of scenes\
    \ set in the Unity Editor window. The script retrieves a scene reference from\
    \ the array as required. It has an integer named gameLevelNum, which is used as\
    \ an index for the array. To advance to the next level, gameLevelNum is incremented.\n\
    \nBelow are the level management functions:\n\n+   - GoNextLevel()-Increments\
    \ gameLevelNum and loads the next scene in the array. If gameLevelNum is higher\
    \ than the array length, it loops back to zero.\n\n+   - ResetGame()-Resets gameLevelNum\
    \ back to zero, as though the game were restarting.\n\nBelow is the script in\
    \ full:\n\n```\nusing UnityEngine;\nusing System.Collections;\npublic class SceneManager\
    \ : MonoBehaviour\n{\n    public string[] levelNames;\n    public int gameLevelNum;\n\
    \n    public void Start ()\n    {\n        // keep this object alive\n       \
    \ DontDestroyOnLoad(this.gameObject);\n    }\n\n    public void LoadLevel( string\
    \ sceneName)\n    {\n        Application.LoadLevel( sceneName);\n    }\n\n   \
    \ public void ResetGame()\n    {\n        // reset the level index counter\n \
    \       gameLevelNum = 0;\n    }\n}\n```"
  merge: -1
  img_proc: true
