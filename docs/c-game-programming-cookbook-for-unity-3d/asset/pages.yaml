- pgno: 22
  md: '# # Making Games the Modular Way


    When I first started making games, I would approach development on a project-to-project
    basis, recoding and rebuilding everything from scratch each time. As I became
    a professional developer, landing a job at a game development studio I was lucky
    enough to work with a guy who was innovating the scene. He was a master at turning
    out great games (both visually and gameplay-wise) very quickly. One secret to
    his success lay in the development of a reusable framework that could easily be
    refactored to use on all of his projects. His framework was set up to deal with
    server-based games communication, input handling, browser communication, and UI
    among other things, saving an incredible more time for him and his team to concentrate
    on great gameplay and graphics optimization, resulting in games that, at the time,
    blew the competition away. Of course, the structure was tailored to how he worked
    (he did build it, after all), and it took me a while to get to grips with his
    style of development; but once I did, it really opened my eyes. From then on,
    I used the framework for every project and even taught other programmers how to
    go about it. Development time was substantially reduced, which left more time
    to concentrate on making better games.


    This book is based on a similar concept of a game-centric framework for use with
    many different types of games, rather than a set of different games in different
    styles. The overall goal of this book is to provide script-based components that
    you can use within that framework to make a head start with your own projects
    in a way that reduces recoding, repurposing, or adaptation time.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'In terms of this book as a cookbook, think of the framework as a base soup
    and the scripting components as ingredients. We can mix and match components from
    different games that use the same framework to make new games, and we can share
    several of the same cores in many different games. The framework takes care of
    the essentials, and we add a little "glue" to pull everything together the way
    we want it to all work.


    This framework is, of course, optional but you should spend some time familiarizing
    yourself with it to understand the book. If you intend to use the components in
    this book for your own games, the framework may serve as a base to build your
    games or simply as a tutorial test bed for you to rip apart and see how things
    works. You can develop a better framework or maybe you already have a solid framework
    in place.


    In this chapter, we start by examining some of the major programming concepts
    used in this book and look at how they affect the design decisions of the framework.


    # I.1 Important Programming Concepts


    I had been programming in C# for a fairly long time before I sat down and figured
    out some the concepts covered in this book. It was not because of any particular
    problem or difficulty with the concepts themselves but more because I solved the
    problems in a different way that I had no real requirement to learn anything new.
    For most programmers, these concepts will be second nature and perhaps something
    in school, but I do not know how important they could be. I had heard about things
    like inheritance, and it was what I put in the to-do list, buried somewhere under
    "finish the project." I took the time to figure them out, they saved me a lot
    of time and led to much cleaner code than I would have previously pulled together.
    If there''s something you are unsure about, give this chapter a read-through and
    see whether you can work through the ideas. Hopefully, you will make some of time
    in the long run.


    # I.1.1 Manager and Controller Scripts


    I am a strong believer in manager and controller scripts. I like to try and split
    things into separate areas; for example, in the Metal Vehicle Doom game, I have
    race controller scripts and a global race controller script. The race controller
    scripts are attached to the players and their tracks on the positions, way, and
    other player-specific race information. The global race controller script talks
    to all the race controller scripts attached to the players to determine who is
    winning and when the race starts or finishes. By keeping this logic separate from
    the other game scripts and contained in their own controller scripts, it makes
    easier to migrate them from project to project. Essentially, I can take the race
    controller and global race controller scripts out of the game and apply them to
    another game, perhaps one that features a completely different type of gameplay—for
    example, alien characters running around a track of cars. As long as I apply the
    correct control scripts, the race logic is in place, and I can access it in the
    new game.


    In the framework that this book contains, there are individual manager and controller
    scripts dealing with user data, input game functions, and user interface. We look
    at those detail in Chapter 2, but as you read this chapter, you should keep in
    mind the idea of separated scripts dedicated to managing particular parts of the
    game structure. It was'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'important to design scripts as standalone so that they may be used in more
    than one situation. For example, our weapon slot manager will not care what kind
    of weapon is in any of the slots. The weapon slot manager is merely an interface
    between the player and the weapon, taking a call to “fire” and responding to it
    telling the weapon in the currently selected weapon slot to fire. What happens
    on the player end will not affect the slot manager as anything that happens with
    the weapon itself will not affect the slot manager. It doesn''t care how your
    code talks to it in the proper way and as long as your weapons receive commands
    in the proper way. It doesn''t even matter what type of slot manager is attached
    to. If you decide to attach the weapon slot manager to a car, a boat, a telegraph
    pole, etc., it doesn''t really matter as when you want to fire, you use the correct
    function in the slot manager to tell it a weapon to fire.


    Since our code logic is controlled by manager and controller scripts, we need
    to be a little smart about how we put everything together. Some manager scripts
    might benefit from being static and available globally (for all other scripts
    to access), whereas others might be better attached to other scripts. We deal
    with this on a case-by-case basis. To get started, we will be looking at some
    of the ways that these manager scripts can communicate with each other.


    As a final note for the topic in this section, you may be wondering what the difference
    between managers and controllers. There really isn''t all that, and I have only
    chosen to differentiate for my own sanity. I see controllers as larger systems,
    like game state, and smaller scripts applied to gameObject, such as weapon slot
    management or physics control. The terms are applied loosely, so don''t worry
    if there appear to be inconsistencies in the application of the term in one case
    versus another. I''ll try my best to keep things logical, but that doesn''t mean
    it''ll always make sense to everyone else!


    # 1.1.2 Script Communication


    An important part of our manager- component-based structures is how our scripts
    are going to communicate with each other. It is inevitable that we will need to
    access our scripts from a multitude of other areas of the game, which means we
    should try to provide interfaces that make the most sense. There are several ways
    of communicating between scripts and objects in Unity:


    +   1. Direct referencing manager scripts via variables set in the Editor window.


    The easiest way to have your scripts talk to each other is to have direct references
    in the form of public variables within a class. They are populated in the Unity
    editor with a direct link to another script.

    Here is an example of referencing:


    ```

    public void aScriptOther();

    ```


    In the editor, the Inspector shows the otherScript field. We drag and drop an
    object containing the script component that we want to talk to. Within the class,
    function calls are made directly on the variable, as as


    ```

    otherScript.DoSomething();

    ```


    # 1.1 Important Programming Concepts'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 2. GameObject referencing SendMessage.


    SendMessage is a great way to send a message to a gameObject and call a function
    in one of its attached scripts or components when we do not need any kind of return
    result. For example,


    ```

    GameObject.SendMessage("DoSomething");

    ```


    SendMessage may also take several parameters, such as setting whether or not the
    engine should throw an error when there is no receiver, that is, no function in
    any script attached to the gameObject with a name matching the one in the SendMessage
    call. You can also pass one parameter into the chosen function just as you were
    passing it via a regular function call such as


    ```

    GameObject.SendMessage("AddScore", 2);

    GameObject.SendMessage("AddScore",

    SendMessageOptions.RequireReceiver);

    GameObject.SendMessage("AddScore",

    SendMessageOptions.DontRequireReceiver);

    ```


    # 3. Static variables.


    The static variable is useful in that it extends across the entire system; it
    will be accessible in every other script. This is a particularly useful behavior
    for a game control script, where several different scripts communicate with it
    to do things such as to the player''s score, lose a life, or perhaps change a
    level.

    Example declaration of a static variable might be


    ```

    private static GameController aController;

    ```


    Although static variables extend the entire program, you can have private and
    public static variables. Things get a little tricky when you try to understand
    the differences between public and private static types—I was glad to have friends
    on Twitter that could explain it all to me, so let me pass on what I was told:


    # Public static


    A public static variable exists everywhere in the system and may be accessed from
    other classes and other types of script.

    Imagine a situation where a player control script needs to tell the game controller
    script whenever a player picks up a banana. We could deal with it like this:


    +   1. In our gamecontroller.cs game controller script, we set up a public static:


    ```

    public static GameController gateway;

    ```


    +   2. When the game controller (gamecontroller) runs its Start() function, it
    stores a reference to it in a public static variable like this:


    ```

    gateway = this;

    ```


    +   3. In any other class, we can now access the game controller by referring
    to its type followed by that static variable (GameController.gateway) such as


    ```

    GameController.gateway.GetBanana();

    ```'
  merge: -1
  img_proc: true
