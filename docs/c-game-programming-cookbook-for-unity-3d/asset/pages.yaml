    \ = \"FINISHED 1st\";\nif ( finalPosition == 2 )\n    finalPositionText.text =\
    \ \"FINISHED 2nd\";\nif ( finalPosition == 3 )\n    finalPositionText.text = \"\
    FINISHED 3rd\";\nif ( finalPosition >= 4 )\n    finalPositionText.text = \"FINISHED\"\
    ;\n```\n\nHere’s the doneFinalMessage Boolean variable, being set to true now\
    \ that the message has been set up:\n\n```\ndoneFinalMessage = true;\n```\n\n\
    The finalPositionObject's gameObject was inactive (hidden) at the start of this\
    \ class by the Init(1) function. Since we need to display it again now, the call\
    \ goes out to GameObject.SetActive(again), this time setting it to true so the\
