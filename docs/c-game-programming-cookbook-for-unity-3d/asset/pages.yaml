  md: "# 10.1.1 Script Breakdown\n\nAfter all the variable declarations, the first\
    \ part of this script does the initial setup within Start() function. Remember\
    \ that, in Unity, the Start function is automatically called by the engine after\
    \ a script is initialized and before the first update. Here, the script checks\
    \ to see whether or not PlayerPrefs data have already been saved to disk. If it\
    \ finds PlayerPrefs keys that exist, it loads them in and applies the saved values\
    \ to our local variables. To store slider values from the options menu, there\
    \ are three variables used: \n\n+   1. audioSFXSliderValue, a float, with a value\
    \ between 0 and 1, for the sound effects volume level.\n\n+   2. audioMusicSliderValue,\
    \ a float, with a value between 0 and 1, for the music volume level.\n\n+   3.\
    \ graphicsSliderValue, an integer to store the level of graphics detail. The number\
    \ acts as an index used to set Unity's QualitySettings quality level with the\
    \ SetQualityLevel function.\n\n```\nvoid Start ({\n    // set default options,\
    \ if they have been saved out to\n    // prefs already\n    if (PlayerPrefs.HasKey(gamePrefsName+\"\
    __SFXVol\")) {\n        audioSFXSliderValue = PlayerPrefs.GetFloat(gamePrefsName+\"\
    __SFXVol\");\n    } else {\n        audioSFXSliderValue = 1;\n    }\n    if (PlayerPrefs.HasKey(gamePrefsName+\"\
    __MusicVol\")) {\n        audioMusicSliderValue = PlayerPrefs.GetFloat(gamePrefsName+\"\
    __MusicVol\");\n    } else {\n        audioMusicSliderValue = 1;\n    }\n    if\
    \ (PlayerPrefs.HasKey(gamePrefsName+\"__GraphicsDetail\")) {\n        graphicsSliderValue\
    \ = PlayerPrefs.GetFloat(gamePrefsName+\"__GraphicsDetail\");\n    } else {\n\
    \        string[] names = QualitySettings.names;\n        detailLevels = names.Length;\n\
    \        graphicsSliderValue = detailLevels;\n    }\n    // set the quality setting\n\
    \    QualitySettings.SetQualityLevel((int)graphicsSliderValue, true);\n}\n```"
