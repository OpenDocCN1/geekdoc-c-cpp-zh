  md: "Wheel_RL\nWheel_RR\nWheelMeshes\nWheel_FL\nWheel_FR\nWheel_RL\nWheel_RR\n\n\
    The script derives from MonoBehavior so that it can tap into the engine's Update()\
    \ function:\n\n```\nusing UnityEngine;\nusing System.Collections;\n\npublic class\
    \ BaseWheelAlignment : MonoBehavior\n{\n```\n\nSkipping by the variable declarations,\
    \ we move down to the Start() function. myTransform is a cached reference to the\
    \ wheel transform, a default rotation value is stored in zeroRotation, and there's\
    \ also a cached reference to the transform, which has the WheelCollider attached\
    \ to it, to be stored in the variable colliderTransform:\n\n```\nvoid Start (\n\
    {\n    // cache commonly used things...\n    myTransform = transform;\n    zeroRotation\
    \ = Quaternion.identity;\n    colliderTransform = CorrespondingCollider.transform;\n\
    }\n```\n\nThis Update() function works by casting a ray down from the center of\
    \ the WheelCollider with the intention of placing the wheel mesh up from the point\
    \ of impact. If nothing is picked up by the raycast, the wheel mesh is simply\
    \ positioned at a point down from the center of the WheelCollider instead:\n\n\
    ```\nvoid Update (\n{\n    // define a hit point for the raycast collision\n \
    \   RaycastHit hit;\n}\n```\n\nThe WheelCollider.center property returns a value\
    \ from the WheelCollider's local coordinate space, so Transform.TransformPoint\
    \ is used to convert it into a world space coordinate that we can use to start\
    \ the ray cast from:\n\n```\nVector3 ColliderCenterPoint =\ncolliderTransform.TransformPoint(\
    \ CorrespondingCollider.center);\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: "For a realistic representation of the structure of suspension, the raycast\
    \ length should be limited to the length of the suspension and to the radius of\
    \ the wheel. Starting out from the center of the WheelCollider, ray will travel\
    \ down the collider transform's negative vector (i.e., down, as the WheelCollider's\
    \ transform describes it):\n\n```\nif ( Physics.Raycast( ColliderCenterPoint,\n\
    \    colliderTransform.up, out hit, CorrespondingCollider,\n    suspensionDistance\
    \ + CorrespondingCollider.radius) ) {\n```\n\nWhen Physics.Raycast finds a hit,\
    \ the wheel position is for the hit point, the wheel collider transform's up multiplied\
    \ by the wheel radius. When the wheel meshes pivot point is at its center, this\
    \ should position the wheel in the correct place on the ground:\n\n```\nmyTransform.position=\
    \ hit.point + (colliderTransform.up\nCorrespondingCollider.radius);\n} else {\n\
    ```\n\nWhen Physics.Raycast finds nothing, the wheel position is at its default\
    \ of the suspension length down the WheelCollider's center point:\n\n```\nmyTransform.position=\
    \ ColliderCenterPoint\n    * colliderTransform.up * CorrespondingCollider,\nsuspensionDistance\
    \ );\n```\n\nNow that the position is set for the wheel, the rotation needs to\
    \ be calculated on the WheelCollider's rotation in the 3D space along some extra\
    \ code to produce a rotation angle from the WheelCollider's revolutions per minute\
    \ (RPM):\n\nThe wheel mesh transform's rotation is multiplied by a new Euler transform\
    \ from Quaternion.Euler. The new angle takes the value in the variable RotationValue\
    \ as its x-axis, the value of the steerAngle of the WheelCollider as its y-axis\
    \ and zero as its z-axis:\n\n```\nmyTransform.rotation= colliderTransform.rotation\
    \ *\nQuaternion.Euler( RotationValue, CorrespondingCollider.steerAngle, 0 );\n\
    ```\n\nRotationValue is a constantly flowing number; it is never once the game\
    \ gets going. Instead, RotationValue is incremented by the WheelCollider's RPM\
    \ value (CorrespondingCollider.rpm) as it is converted into radians and multiplied\
    \ by Time.deltaTimeTo keep the rotation time based.\n\n```\n// increase the rotation\
    \ value by the rotation speed (in degrees)\n// per second\nRotationValue+= CorrespondingCollider.rpm\
    \ * ( 360 / 60 ) *\nTime.deltaTime;\n```\n\nTo analyze detailed information from\
    \ the WheelCollider and its contacts and relationships with the 3D world, Unity\
    \ provides a structure called WheelHit."
  merge: -1
  img_proc: true
