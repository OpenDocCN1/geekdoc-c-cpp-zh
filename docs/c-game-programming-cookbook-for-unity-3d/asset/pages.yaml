- pgno: 438
  md: "This player's data manager tracks health levels. myDataManager.ReduceHealth()\
    \ takes a single integer parameter of how much health should be reduced. In this\
    \ game, the health level is treated as lives, so it is called to take away one\
    \ life here:\n\n```\n// reduce lives by one\nmyDataManager.ReduceHealth(1);\n\
    ```\n\nThe game controller is called on to update the UI, either UpdateLivesP1()\
    \ or UpdateLivesP2(), depending on the ownerID for this player:\n\n```\n// update\
    \ UI lives\nif ( ownerID==1 )\n{\n    // as our ID is 1, we must be player 1\n\
    GameController_IP.Instance.UpdateLivesP1( myDataManager.GetHealth());\n} else\
    \ {\n    // as our ID is 2, we must be player 2\nGameController_IP.Instance.UpdateLivesP2(\
    \ myDataManager.GetHealth());\n}\n```\n\nWhen this player's health level is less\
    \ than 1, it is game over for this player:\n\n```\nif(myDataManager.GetHealth()<1)\
    \ // - game over\n{}\n```\n\nThe player spaceship is hidden by GameObject.SetActive():\n\
    \n```\n// hide body\ntheMeshGO.SetActive(false);\n```\n\nThe weapon needs to be\
    \ disabled when the player is not active, which is the job of the DisableCurrentWeapon()\
    \ function on the weapon controller script (a reference to Standard_SlotWeapon_Controller\
    \ held in the variable weaponControl):\n\n```\n// disable and hide weapon\nweaponControl.DisableCurrentWeapon();\n\
    ```\n\nThe PlayerFinished() function is called to close down this player:\n\n\
    ```\n// do anything we need to do at game finished\nPlayerFinished();\n} else\
    \ {\n```\n\nReaching the else of this condition means that the player just needs\
    \ to be respawned and that it has more than 1 life remaining. The player model\
    \ is hidden with GameObject.SetActive():\n\n```\n// hide body\ntheMeshGO.SetActive(false);\n\
    ```\n\nThe weapon is disabled (it will be re-enabled when the player is respawned):\n\
    \n```\n// disable and hide weapon\nweaponControl.DisableCurrentWeapon();\n```"
