    The car physics are very simple in this game. In a commercial racing game, there
    may be all manner of physics scripts running to keep it upright around corners
    and behaving like a real car. Advanced physics are beyond the scope of this book,
    so instead we set the physics rigidbody''s center of mass in such a way as to
    encourage the car to stay upright. If you were to comment out this line and play
    Metal Vehicle Doom, the car would roll onto its itself when coming around a corner.
    Changing the center of mass can have strange effects on the physics, although
    with a little trial and error, you may be able to reach a good level of stability
    without too much strangeness in terms of physical reaction:


    ```

    // with this simple code, we set the center of mass

    // low to keep the car from toppling over

    myBody.centerOfMass= new Vector3(0,-3.5f,0);

    ```


