    \ hits a projectile it will be respawned a single health taken away; when there\
    \ is no health left the game will end:\n\n```\n// if a player manager is not set\
    \ in the editor, let's try\n// to find one\nif (myPlayerManager==null)\nmyPlayerManager=myGO.GetComponent<BasePlayerManager>();\n\
    ```"
