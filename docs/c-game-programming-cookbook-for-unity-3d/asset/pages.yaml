- pgno: 32
  md: '# 2.1 Controllers and Managers


    By specializing tasks to particular managers, it is possible to swap out other
    components without affecting core functions, which, in turn, makes it easy to
    carry the same code from game to game without having to rewrite it; from a first-person
    shooter to a racing game, the same code may be used to store user session data,
    load levels, or control weapons. In this book, I use two terms to specify the
    type of class: controllers and managers.


    # 2.1.1 Controllers


    Controllers specialize in specific tasks such as helping scripts communicate with
    each other, holding game-specific player information, or dealing with session
    data. For example, at the center of all of the example games in this book is a
    game controller script that acts as a central location for game scripts. Each
    game has its own controller script acting like glue between the different components
    that otherwise have no built-in method for communicating.


    # 2.1.2 Managers


    Managers are used in this book to represent a script that manages objects or data
    specifically (dealing with players, audio, or other game elements in a similar
    way to how a manager might manage staff in a company). For example, the GlobalBattleManager.cs
    script is used to RaceController.cs instances to keep track of a deathmatch battle
    in the example game Tank Battle. The manager script takes care of calculating
    the position of the players on the scoreboard as well as informing players as
    to the game''s current running state.


    # 2.2 Building the Core Framework Scripts


    There are several scripts in the Scripts/BASE folder that are intended to act
    as templates for your own versions, or as classes to derive from, in your own
    games. In this section, we will be looking at the scripts that make up the main
    framework.

    Those core framework scripts in the BASE folder that will be covered in this chapter
    are as follows:


    +   - 2.2.1. BaseGameController.cs

    - 2.2.2. SceneManager.cs

    - 2.2.3. ExtendedCustomMonoBehavior.cs

    - 2.2.4. BaseUserManager.cs

    - 2.2.5. BasePlayerManager.cs

    - 2.2.6. BaseInputController.cs'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'There are several more scripts in the BASE folder of the example games than
    those above; those scripts falling outside of the basic core framework will be
    dealt with case-by-case basis throughout this book, as the AI scripts being dealt
    with in Chapter 9, where our AI system is covered in full, or in Chapter 8, where
    audio is explored.


    # 2.2.1 BaseCameraController.cs


    The game controller acts as a hub for active activity and a place where scripts
    may not be directly connected can send messages to each other. By routing scripts
    through the game controller, they remain independent, and changing their behavior
    is a straightforward process of changing how messages are dealt with rather than
    across multiple scripts.


    The core functions of the game controller are as follows:


    +   1. Tracking game state

    a. Storing the game state

    nb. Providing functions for changing the game state

    c. Changing the game state based on calls to functions such as EndGame(), StartGame(),
    or PauseGame()

    2. Creating any player object(s)

    3. Setting up the camera (any specifics such as telling the camera which player
    to follow, etc.)

    4. Communicating between session manager, user manager, and game actions (such
    as score, etc.)

    5. Handling all communications between scripts that we would like to keep as standalone
    and not have to recode to talk directly to each other


    Game controller is where the core of gameplay, where overall game functions are
    defined and dealt with where the current game state is held. Keeping track of
    the game state is important, as some elements will need to change their behavior
    based on this. If the game is paused, we may want to suspend all input, freeze
    game time, and show a pop-up. When the game ends, we will need to disable player
    input and so on. Tracking game states is the job of the game controller script.


    A typical game may have several different core states, such as


    +   1. Game running

    2. Game paused

    3. Loading

    4. Game ended'
  merge: -1
  img_proc: true
