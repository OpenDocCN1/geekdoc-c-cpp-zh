    \ When this script is attached to a GameObject, the constructor will be called\
    \ when the game first starts (as constructors are called when an instance of a\
    \ script is made).\n\nThe constructor sets the static variable Instance to the\
    \ instance of the script that this function is being called on. From here on,\
    \ when another script needs to talk to the game it can do through GameController_LBS.Instance():\n\
    \n```\npublic GameController_LBS()\n{\n  Instance=this;\n}\n```\n\nTime.scale\
    \ not always be set to 1. gameSpeed is public variable which may be used to set\
    \ the game timing to one that for a specific type of play experience. When Start()\
    \ is called by the Unity engine, the time scale is set just after Init():\n\n\
    ```\npublic void Start()\n{\n  Init();\n  Time.timeScale=gameSpeed;\n}\n```\n\n\
    The player will not be allowed to move straight away, and the Init() function\
    \ schedules a call, with the Invoke method, to start player movement 1 second\
    \ later. When the game restarts, SpawnerController may still hold references to\
    \ the old objects it has spawned. By calling Restart() on this, everything gets\
    \ cleared ready for a new round:\n\n```\npublic void Init()\n{\n  Invoke(\"StartPlayer\"\
    ,1);\n  SpawnerController.Instance.Restart();\n}\n```\n\nRather than hard-coding\
    \ a prefab or specific player objects, to keep flexible the game controller uses\
    \ an array named playerPrefabList. Player prefab references are added via the\
    \ Window in the Unity editor, and the game controller uses the array to spawn\
    \ them when the game starts. numberOfPlayers holds a count of the players in the\
    \ playerPrefabList array:\n\n```\nnumberOfPlayers= playerPrefabList.Length;\n\
    ```"
