  md: 'Having all of gizmos, lines, and editor helper graphics, the same colors would
    make life harder. For that reason, Unity provides the Gizmos.color function to
    set its colors. It takes just one call to Gizmos.color (passing a Color object)
    and everything after that point will be rendered using it.


    ```

    Gizmos.color=Color.green;

    ```


    Gizmos.DrawSphere does exactly that. It draws a sphere at a set position and radius
    like this:


    ```

    Gizmos.DrawSphere(currentPos);

    // draw the line between the last waypoint and this

    // one

    Gizmos.color=Color.red;

    Gizmos.DrawLine(lastPos, currentPos);

    ```


    Gizmos.DrawLine is another utility provided by Unity to draw a simple line between
    3D vectors. The gizmo drawing system has a few options available to make editing
    easier.


    According to the Unity documentation, the Gizmo interface provides the following
    functions:


    | DrawCube | Draw a solid box with center and size. |

    | DrawFrustum | Draw a camera frustum using the currently set Gizmos.matrix for
    its location and rotation. |

    | DrawUITexture | Draw a texture in the scene. |

    | DrawIcon | Draw an icon at a position in the scene view. |

    | DrawLine | Draw a line starting from toward to. |

    | DrawRay | Draw a ray starting at from to + direction. |

    | DrawSphere | Draw a solid sphere with center and radius. |

    | DrawWireCube | Draw a wireframe box with center and size. |

    | DrawWireSphere | Draw a wireframe sphere with center and radius. |


    As stated earlier in the chapter, the waypoints are used at one stage as respawn
    points for vehicles that may be stuck or off track. Their rotations are also used
