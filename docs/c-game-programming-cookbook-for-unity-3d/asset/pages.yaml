  md: "gameLevelNum is used to tell the scene manager which scene to load when using\n\
    t automated loading in GoNextLevel() or when LoadLevel() is called without a string\n\
    parameter. When a new game starts, gameLevelNum needs to be reset for the scene\
    \ load-\nin to start at the beginning again:\n\n```\npublic void ResetGame()\n\
    {\n    // reset the level index counter\n    gameLevelNum = 0;\n}\n```\n\nAt the\
    \ end of a game level, calling GoNextLevel() will load the next scene automatically\
    \ and increment gameLevelNum:\n\n```\npublic void GoNextLevel()\n{\n    // if\
    \ our index goes over the total number of levels in the\n    array, we reset it\n\
    \    if( gameLevelNum >= levelNames.Length )\n        gameLevelNum = 0;\n\n  \
    \  // load the level (the array index starts at 0, but we start\n    counting\
    \ game levels at 1 for clarity's sake)\n    LoadLevel(gameLevelNum);\n\n    //\
    \ increase our game level index counter\n    gameLevelNum++;\n}\n```\n\nLoadLevel()\
    \ is used by the GoNextLevel() function to load a scene from the levelNames based\
    \ on the index pass in as a parameter via indexNum:\n\n```\nprivate void LoadLevel(\
    \ int indexNum )\n{\n    // load the game level\n    LoadLevel(levelNames[indexNum]);\n\
    }\n```"
