  md: "of the scene game currently has loaded in memory. You can also get an index\
    \ referring to the scene with Application.name. This index number ties up to how\
    \ scenes are organized in the Build Settings (File -> Build Settings), meaning\
    \ that things around in build settings can affect how your game works if you choose\
    \ to use index numbers to refer to specific scenes later on. To avoid confusion,\
    \ I prefer to stick to names whenever I deal with level loading.\n\nThe final\
    \ part of the BaseCameraController deals with the mechanics of pausing and unpausing\
    \ a game:\n\n```\npublic bool Paused {\n    get {\n        // get paused\n   \
    \     return paused;\n    }\n    set {\n        // set paused\n        paused\
    \ = value;\n        if (paused) {\n            // pause time\n            Time.timeScale\
    \ = 0f;\n        } else {\n            // unpause Unity\n            Time.timeScale\
    \ = 1f;\n        }\n    }\n}\n```\n\nA Boolean variable named paused holds the\
    \ game pause state internally. Rather than provide direct access to this, a getter-setter\
    \ function is used so that we can act whenever the state of paused changes without\
    \ having to monitor it.\n\nThe Get part simply returns the Boolean variable.\n\
    The Set part sets the Boolean variable and goes on set Time.timeScale to either\
    \ 0 (paused) or 1 (unpaused). Setting Time.timeScale affects how time passes.\
    \ For example, setting timescale to 0.5 would mean that time passes 2x slower\
    \ than real time. The Unity documentation states:\n\nExcept for realtimeStartup,\
    \ timescale affects all the time and delta time measuring of the Time class.\n\
    \nIf you lower timescale it is recommended to lower Time.fixedDeltaTime by the\
    \ same amount.\nFixedUpdate functions will not be called when timescale is set\
    \ to zero.\n\nA regular videogame would display some sort of message to tell players\
    \ whenever the game is paused, but the script is purely providing the mechanics\
    \ of pausing, and we will save concerning ourselves too much with user interface\
    \ until Chapter 14."
