- pgno: 125
  md: "```\n{\n  targetSpeed *= runSpeed;\n  _characterState = CharacterState.Running;\n\
    } else {\n  targetSpeed *= walkSpeed;\n  _characterState = CharacterState.Walking;\n\
    }\n```\n\nmoveSpeed = Math.Lerp(moveSpeed, targetSpeed, curSmooth);\n// // Reset\
    \ walk time start when we slow down\nif (moveSpeed < walkSpeed * 0.3f)\nwalkTimeStart\
    \ = Time.time;\n\nUpdate() begins with a call to stop input when canControl is\
