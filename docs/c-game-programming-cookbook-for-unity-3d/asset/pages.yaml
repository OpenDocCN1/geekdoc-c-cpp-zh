    {\n    // since the race is not running, we'll tell\n    // the AI gunControl\
    \ not to fire yet\n    gunControl.canControl=false;\n}\n```\n\nThe race controller\
    \ always needs to track waypoints for position tracking and lapncounting, regardless\
    \ of whether or not the race is still running. raceControl does not keep\nown\
    \ update function so the next part of LateUpdate() calls UpdateWaypoints() to\
    \ keep\nit updating:\n\n```\n// tell the race controller to update\nraceControl.UpdateWaypoints();\n\
    ```\n\nThe code continues by calling CheckLock() to see whether or not the vehicle\
    \ would\be held in place, and then there is a call out to raceControl to CheckWrongWay():\n\
    \n```\n// see if our car is supposed to be in place\nCheckLock();\n// tell race\
    \ control to see if we're going the wrong way\nraceControl.CheckWrongWay();\n\
    ```\n\nWhen raceControl detects the vehicle is traveling around the track the\
    \ wrong way,\nas assumption is made that a non-AI-controlled player will be the\
    \ user. The code below\ntells the game controller to update its wrong-way status,\
    \ with a call to GameController_\nMVD.Instance.UpdateWrongWay():\n\n```\n// check\
    \ to see if we're going the wrong way and act on it\nif(raceControl.goingWrongWay)\n\
    {\n    if (isAIControlled)\n        GameController_MVD.Instance.UpdateWrongWay(true);\n\
    ```\n\nWhen raceControl first detects the vehicle is heading in the wrong direction,\
    \ this\ntimeWrongWayStarted variable acts like a timestamp as it is set to the\
    \ value of the system\nproperty Time.time. This code checks raceControl.timeWrongWayStarted\
    \ and\nTime.time to see whether the vehicle has been going in the wrong way for\
    \ longer than the\ntime set by the resetTime:\n\n```\n// if going the wrong way,\
    \ compare time since\n// way started to see if we need to respawn\nif(raceControl.timeWrongWayStarted!=-1)\n\
    \    timedif = Time.time;\n    raceControl.timeWrongWayStarted;\nif(timedif>resetTime);\n\
    ```"
