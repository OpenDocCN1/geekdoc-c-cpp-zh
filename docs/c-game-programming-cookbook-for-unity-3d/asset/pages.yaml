- pgno: 446
  md: '# Final Note


    It''s the end of the book, but I hope it''s only the beginning of how you make
    use of what''s in it. There is a lot of code here that, at the very least, should
    be a good starting point for just about any type of game. I encourage you to use
    the code, use the assets—make your games and tell you your stories.


    As you do, remember that this book presents just one way to do things. After over
    a decade of game making, I still see every new game as an adventure filled with
    new lessons to be learned and new problems to solve. Programmers constantly evolve;
    not just to keep up with the latest technologies, hardware or trends but to find
    better ways of doing things. Better ways for all the environmental variables such
    as the platform, input methods or tech limitations, and also better ways for the
    individual developer.


    Engineering knowledge can take you to the road, but it''s up to you to cross it
    and the path may not always be as you expect it to be. Find what works for you
    and try to enjoy the journey of making games.


    Thank you for reading this book and for choosing to do something as wonderful
    and creative as making games. Let me know what you create, via Twitter @psychicparrot
    or drop me by my website and send me a message when you''re done. I look forward
    to playing your game.


    All the best,

    Jeff'
