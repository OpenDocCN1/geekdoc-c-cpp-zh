  md: "The newly calculatedrelativeTarget vector is used with Math.Atan2 to find an\
    \ angle of rotation:\n\n```\n// Calculate the target angle\ntargetAngle = Math.Atan2\
    \ ( relativeTarget.x,\nrelativeTarget.z );\n```\n\n```\n// Atan returns the angle\
    \ in radians, convert to degrees\ntargetAngle *= Math.Rad2Deg;\n```\n\nTo enforce\
    \ limits on the amount of rotation in one step, the function uses Math.Clamp to\
    \ keep the angle less than the float variable followTargetMaxAngle:\n\n```\n//\
    \ The wheels should have a maximum rotation angle\ntargetAngle = Math.Clamp (\
    \ targetAngle,\n-followTargetMaxTurnAngle,\nfollowTargetMaxTurnAngle );\n```\n\
    \nThe next step is to use Rotate.Rotate to turn the bot. targetAngle is multiplied\
    \ by modelRotateSpeed and multiplied by Time.deltaTime to make the rotation time\
    \ based. This value is used by the Rotate function to turn the rotateTransform\
    \ transform (which takes three float parameters for x, y, and z amounts):\n\n\
    ```\n// turn the target at the rate of modelRotateSpeed\nrotateTransform.Rotate(\
    \ 0, targetAngle * modelRotateSpeed *\nTime.deltaTime, 0 );\n```\n\nCanSee() does\
    \ a simple line-of-sight check to see if anything is between the bot and its target.\
    \ This is useful for cutting off when the target goes behind a wall or somewhere\
    \ unreachable by the AI bot.\n\nIt creates a normalized vector from the two positions\
    \ and uses this to cast a ray from the bot out at the length from the maxChaseDistance\
    \ variable:\n\n```\npublic bool CanSee( Transform aTarget )\n{\n    // first,\
    \ let's get a vector for raycasting by\n    // subtracting the target position\
    \ from our AI position\ntempDirVector3.Normalize( aTarget.position -\n    transform.position\
    \ );\n```\n\n```\n// let's have debug line to check the distance between the\n\
    // two manually, in case you run into trouble!\nDebug.DrawLine(transform.position,\
    \ aTarget.position );\n```\n\n```\n// cast a ray from our AI, out toward the target\
    \ passed in\n// (use the tempDirVector magnitude as the distance to cast)\nif\
