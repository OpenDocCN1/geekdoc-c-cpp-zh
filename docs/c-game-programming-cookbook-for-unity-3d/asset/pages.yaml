  md: "# 11.10 Weapons Projectiles\n\nThe main weapon (a prefab named Blaster) has\
    \ a gun mesh with a single script attached to it—BaseWeaponScript.cs—and it contains\
    \ a reference to a projectile Blast that will be instantiated whenever it fires.\n\
    \nThe projectile is made from a cube, colored red to look more like laser fire.\
    \ Attached to the projectile are several scripts:\n\n+   - Automatic Destroy Object\n\
    \nDestroys the GameObject after a set amount of time (to stop any projectiles\
    \ that hit anything from travelling off into infinite space!).\n\n+   - Projectile\
    \ Controller\n\nAs discussed in full in Chapter 6.\n\n+   - Rigidbody\n\nThe rigidbody\
    \ has only 0.1 mass and no drag at all. The rigidbody is set to interpolate its\
    \ movement (in an attempt to help improve collisions). One point of note is that\
    \ its collision method is set to Continuous. When projectiles are moving as quickly\
    \ as they do in this game, it is very probable that they will sometimes go through\
    \ other meshes with registered collision. The Continuous collision setting will\
    \ mean increased accuracy but at a small processing cost. In a game like this,\
    \ the difference in performance is negligible but you should use continuous collisions\
    \ sparingly and as little as possible.\n\n+   - Sphere Collider\n\nThe collider\
    \ is a standard sphere collider.\n\n# 11.11 User Interface\n\nThe main script\
    \ looks like this:\n\n```\nusing UnityEngine;\nusing System.Collections;\n\n[AddComponent(\"\
    Sample Glue Code/Lazer Blast Survival/In-Game UI*\")]\n\npublic class UI LBS :\
    \ BaseUIManager\n{\n    public GameObject gameOverMessage;\n    public GameObject\
    \ getReadyMessage;\n\n    void Awake()\n    {\n        Init();\n    }\n```"
