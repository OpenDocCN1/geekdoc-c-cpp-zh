    \ are re-usable throughout your game.\n\nThey are saved into the project, available\
    \ in the same way regular assets are, and may be dragged into a scene or added\
    \ dynamically through code using the Instantiate keyword. Instantiate makes a\
    \ clone of the object you pass in as a parameter and returns a reference to the\
    \ clone.\n\nInstantiate takes three parameters:\n\n+   object An existing object\
    \ (such as a prefab or gameObject) to make a copy of\n\n+   position Vector3 for\
    \ the new object\n\n+   rotation Quaternion for the new object\n\nOne important\
    \ consideration to keep in mind is that there is a CPU hit for instantiation as\
