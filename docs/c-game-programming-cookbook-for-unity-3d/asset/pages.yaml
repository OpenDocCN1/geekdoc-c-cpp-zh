    \ originZ is:\n\n```\n// grab the starting Z position to use as a baseline for\
    \ Z\n// position limiting\noriginZ=myTransform.localPosition.z;\n```\n\nOnce the\
    \ Init() function has finished, didInit is set to true.\n\n```\n// set a flag\
