    \ 10.\nThe main game scene Hierarchy structure looks like this:\n\n+   - ARENA\n\
    \  - (Models that make up the environment)\n- Arena_Colliders\n  - (Colliders\
    \ for the level)\n- Directional light\n- GameController\n- Main Camera\n- MusicController\n\
    - Player_Startpoint\n- SoundController\n- SpawnController\n- UI\n  - Game Over\
    \ Graphic\n  - Get Ready Graphic\n\nNote that the game controller dynamically\
    \ creates players and enemies when the game starts. References to several prefabs\
    \ and gameObjects are set in the Unity Inspector window:\n\n+   - Game controller\
