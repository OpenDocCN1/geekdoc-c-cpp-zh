    \ at each point). This\nis used to decide how much to interpolate this.\n\nThe\
    \ functions to set them are as follows:\n\n```\n// set up AI parameters\n\npublic\
    \ void SetPatrolSpeed(float aNum)\n{\n    patrolSpeed= aNum;\n}\n\npublic void\
