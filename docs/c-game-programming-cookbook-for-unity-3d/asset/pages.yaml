  md: "Note that in the Start() function of the class (shown below), we use DontDestroyOnLoad\
    \ to keep this script and its gameObject even when new scenes are loaded. This\
    \ means we need to prevent duplicate scene managers when instantiated, but we\
    \ can easily use GameObject.Find to look for a scene manager gameObject before\
    \ instantiating a new one.\n\n```\npublic class SceneManager : MonoBehaviour\n\
    {\n    public string[] levelNames;\n    public int gameLevelNum;\n\n    public\
    \ void Start()\n    {\n        // keep this object alive\n        DontDestroyOnLoad(this.gameObject);\n\
    \    }\n```\n\nThe SceneManager.cs script provides a scene-loading function in\
    \ its simplest form. Here Application.LoadLevel is used to load a scene:\n\n```\n\
    public void LoadLevel(string sceneName)\n{\n    Application.LoadLevel(sceneName);\n\
    }\n```\n\nOn top of simple scene loading, the class has support for a basic progressive\
    \ leveling game format. An array named levelNames holds strings referring to the\
    \ names of the levels in the game. We use an integer named gameLevelNum to refer\
    \ to which level the player is in. When GoNextLevel() is called, we do a quick\
    \ check to make sure that gameLevelNum is within range:\n\n```\npublic void GoNextLevel()\n\
    {\n    // if our index goes over the total number of levels in the\n    // array,\
    \ we reset it\n    if(gameLevelNum >= levelNames.Length)\n        gameLevelNum\
    \ = 0;\n}\n```\n\nThen, another version of the LoadLevel function (declared after\
    \ this) is called to start loading the next scene by the index number. Finally,\
    \ gameLevelNum is incremented, for next time. Note that the increment happens\
    \ after the load and before. We could have done this either way, but this way,\
    \ we have the minor inconvenience of gameLevelNum always being one step ahead,\
    \ which we need to be aware of if we want to access its value from other classes.\
    \ On the other hand, by incrementing it after the load, we use GoNextLevel from\
    \ the start of the game to load the first level in the array, keeping the code\
    \ consistent in level loading:\n\n```\n// load the level (the array index starts\
    \ at 0, but we start\n// counting game levels at 1 for clarity's sake)\nLoadLevel(gameLevelNum);\n\
    \n// increase our game level index counter\ngameLevelNum++;\n```"
  merge: -1
  img_proc: true
