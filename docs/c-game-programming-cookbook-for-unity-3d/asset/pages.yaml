- pgno: 120
  md: "Having input separated into a GetInput() should make it easy to customize inputs\
    \ if required. Here, the horz, vert, and jump Boolean variables are set by the\
    \ default_input (a Keyboard_Input instance). These functions are used to control\
    \ the character controller in the following script:\n\n```\npublic virtual void\
    \ GetInput()\n{\n    horz=Mathf.Clamp(default_input.GetHorizontal(), -1, 1);\n\
    \    vert=Mathf.Clamp(default_input.GetVertical(), -1, 1);\n}\n```\n\nLateUpdate()\
    \ is used to call for an update to the input Boolean variables via the GetInput()\
    \ script. Unity advises it is the best place for keyboard entry, after the engine\
    \ has carried out its input updates:\n\n```\npublic virtual void LateUpdate()\n\
    {\n    // check for input in LateUpdate because Unity recommends\n    // this\n\
    \    if (canControl)\n        GetInput();\n}\n```\n\nThis script was adapted from\
    \ the third-person controller code provided by Unity. Its original behavior was\
    \ to move the player based on the direction of the camera. For example, when the\
    \ right key was pressed, the player would move toward the right of the screen\
    \ based on the camera location and rotation (right being along the camera's x-axis).\
    \ Player rotation in the script was determined by the camera rotation, and for\
    \ the movement to make sense, it was reliant on the camera behind the player during\
    \ gameplay. Of course, this control scheme would not work with a top-down camera\
    \ system or any camera system other than the one it was intended for.\n\nAs the\
    \ script was adapted, the dependence on the camera rotation was removed and replaced\
    \ with a directional approach. In this system, pressing the right key moves right\
    \ along the world x-axis and pressing up down moves up or down along the z-axis.\n\
    \nFor some top-down character-based games, the directional approach is a good\
    \ one, but the genre is not exactly locked into this scheme we also provide a\
    \ rotational movement approach. Whenever moveDirectionally is false, pressing\
    \ the left or right button will rotate the player left or right around its y-axis.\
    \ Pressing the up button will walk forward along the player's z-axis, and pressing\
    \ down will move it backward.\n\nIn the UpdateSmoothedMovementDirection() script,\
    \ the moveDirectionally variable is checked to determine which type of movement\
    \ function to call to update player movement:\n\n```\nvoid UpdateSmoothedMovementDirection()\n\
    {\n    if (moveDirectionally)\n{\n        UpdateDirectionalMovement();\n    }\
    \ else {\n        UpdateRotationMovement();\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 121
  md: "Directional movements use the world x- and z-axes to decide which way to move;\
    \ that is, the player moves along the world x or z axis based on the button pressed\
    \ by the player. UpdateDirectionalMovement() function starts by taking the horizontal\
    \ and vertical input (from the horizontal and vert) and multiplying them by the\
    \ world forward vector or the world right vector, respectively. Note that the\
    \ targetDirection variable is of Vector3 type and it starts being set to the horizontal\
    \ direction and then has the vertical added to it, encompassing both vertical\
    \ and horizontal movement into the same vector:\n\n```\nvoid UpdateDirectionalMovement()\
    \ {\n    // find target direction\n    targetDirection= horiz * Vector3.right;\n\
    \    targetDirection+= vert * Vector3.forward;\n}\n```\n\nAs the code comments\
    \ tell you, we store speed and direction separately. By so, we can have the character\
    \ face a particular direction without actually moving, a behavior sometimes for\
    \ this type of game.\nTheargetDirection variable will be zero when there is no\
    \ user input, so before calculating any movement amounts, that movement is intended\
    \ first:\n\n```\n// store speed and direction\n// so that when the character stands\
    \ still we still have a\n// valid forward direction\n// moveDirection is always\
    \ normalized, and we only update it\n// if there is user input\nif (targetDirection\
    \ != Vector3.zero) {\n```\n\nThe moveDirection vector will be used to move the\
    \ player around the arena. Its comes from an interpolation between the current\
    \ value of moveDirection and the targetDirection calculated earlier from the user\
    \ inputs. This vector is multiplied by rotateSpeed, converted into radians, and\
    \ again multiplied by Time.deltaTime to make the rotation speed based. This ensures\
    \ that the rotation ends in the specified position.\nThe Unity documentation describes\
    \ Vector3.RotateTowards as follows:\nThis function is similar to MoveTowards except\
    \ that the vector is treated as a direction rather than a position. The current\
    \ vector will be rotated round the target direction by an angle of maxRadiansDelta,\
    \ although it will land exactly on the target rather overshoot. If the magnitudes\
    \ of current and target are different then the magnitude of the result will be\
    \ interpolated during the rotation. If a negative value is used for maxRadiansDelta,\
    \ the vector will rotate away from target until it is in exactly the opposite\
    \ direction, then stop.\n\nThe moveDirection vector is then normalized to remove\
    \ any magnitude from the equation:\n\n```\nmoveDirection = Vector3.RotateTowards(moveDirection,\n\
    targetDirection, rotateSpeed * Mathf.Deg2Rad * Time,\ndeltaTime, 1000);\nmoveDirection\
    \ = moveDirection.normalized;\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The next part of the BaseTopDown.script deals with speed. The variable curSmooth
    will be used in the script to decide how long it takes for the movement speed
    of the player to go from zero to max speed:


    ```

    // Smooth the speed based on the current target direction

    curSmooth= speedSmoothing * Time.deltaTime;

    ```


    The variable targetSpeed is capped to a maximum of 1. To do this, Mathf.Min is
    fed with the magnitude of the targetDirection and 1. Whoever is least will go
    into targetSpeed:


    ```

    // Choose target speed

    // We want to use analog input but make sure you can''t

    // walk diagonally than just forwards or sideways

    targetSpeed= Mathf.Min(targetDirection.magnitude, 1.0f);

    ```


    The variable _characterState starts to set CharacterState.Idle:


    ```

    _characterState = CharacterState.Idle;

    ```


    This script allows for two states of movement: running and walking. The transition
    between running and walking is timed—the character will begin walking and continue
    walking until vertical input is applied for more than (seconds) the value of runAfterSeconds.
    The animation and movement speed will then transition into running and continue
    to run until the vertical input stops.


    Time.time is used to track how long the player has been walking, which means that
    Time.scale will affect it (if the game is paused or scaled, this timing will remain
    relative to the timescale):


    ```

    // decide on animation state and adjust move speed

    if (Time.time - runAfterSeconds > walkTimeStart)

    {

    ```


    If the state is running, then multiply the targetSpeed by runSpeed, and set the
    animation state to running:


    ```

    targetSpeed *= runSpeed;

    _characterState = CharacterState.Running;

    }

    else

    {

    ```


    The walkSpeed variable is a multiplier for the targetSpeed when the player is
    in its walking state:


    ```

    targetSpeed *= walkSpeed;

    _characterState = CharacterState.Walking;

    }

    ```


    The moveSpeed variable was used earlier in the function, but it only gets calculated
    here it relies on targetSpeed and curSmooth to have worked out. It''s OK that
    it gets calculated so late in the function, although it only gets picked up on
    the next update, the delay is so small that it is unnoticeable.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "moveSpeed an interpolation (using Mathf.Lerp) between its current value and\
    \ the variable targetSpeed over an amount of time set by curSmooth.\n\nWhen moveSpeed\
    \ drops below the threshold set by walkSpeed (essentially, when the player moves\
    \ not enough to slow movement down), walkTime starts reset so that the walk will\
    \ start again next time the player:\n\n```\nmoveSpeed = Mathf.Lerp(moveSpeed,\
    \ targetSpeed, curSmooth);\n\n// Reset walk time start when we slow down\nif (moveSpeed\
    \ < walkSpeed * 0.3f)\ntwalkTimeStart = Time.time;\n```\n\nThe final part of the\
    \ UpdateDirectionalMovement() function tells the character controller to move\
    \ and sets its rotation of transform to change the movement direction. In the\
    \ original Unity-person controller script this code was adapted from, this was\
    \ used in the Update() function. It was moved for the purpose of keeping all directional\
    \ movement within a single function.\n\nThe variable movement takes moveDirection\
    \ and multiplies it by moveSpeed; then, on the next line, the result is multiplied\
    \ by Time.deltaTime to provide a time-based movement vector with magnitude suitable\
    \ for passing into the character controller. When the controller is to Move (with\
    \ the movement vector passed in a parameter), it will return a bitmask called\
    \ CollisionFlags. When a collision occurs with the character controller, the collisionFlags\
    \ variable may be used to tell where the collision happened; the collisionFlags\
    \ represents None, Sides, Above, or Below. Although the collision data are not\
    \ used in this version of BaseTopDown.cs, it is implemented for future functionality:\n\
    \n```\n// Calculate actual motion\nVector3 movement= moveDirection * moveSpeed;\n\
    move *= Time.deltaTime;\n```\n\n```\n// Move the controller\ncollisionFlags =\
    \ controller.Move(movement);\n```\n\nIn the last line of the function, Quaternion.LookRotation\
    \ moveDirection and sets myTransform.rotation to it—making the player face in\
    \ the correct direction for the movement:\n\n```\n// Set rotation to the move\
    \ direction\nmyTransform.rotation = Quaternion.LookRotation(moveDirection);\n\
    \    \n```\n\nThe second type of movement in BaseTopDown.cs is rotational movement.\
    \ UpdateRotationalMovement() uses a combination of transform.Rotate and the character\
    \ controller's SimpleMove function to provide a control system that rotates the\
    \ player on its y-axis and moves along its z-axis (in the case of the humanoid,\
    \ this is forward and backward walking or running)."
  merge: -1
  img_proc: true
- pgno: 124
  md: "For horizontal input, the variable horz is multiplied by the variable rotateSpeed\
    \ and multiplied by Time.deltaTime to be used as the rotation for the player's\
    \ (myTransform) y rotation:\n\n```\nvoid UpdateRotationMovement()\n{\n    myTransform.Rotate(0,\
    \ horz * rotateSpeed * Time.deltaTime, 0);\n}\n```\n\nVertical input (stored in\
    \ vert) is dealt with next, as vert multiplied by moveSpeed makes up the speed\
    \ at which traverse the player's z-axis.\n\nNote that moveSpeed is calculated\
    \ further down in the function, so don't worry about that right away—just keep\
    \ in mind that moveSpeed is the desired speed of movement:\n\n```\ncurSpeed =\
    \ moveSpeed * vert;\n```\n\nCharacterController.SimpleMove moves a character controller,\
    \ taking into account the velocity set by the vector passed into it. In this line,\
    \ the vector provided to SimpleMove is the player's forward vector multiplied\
    \ by speed:\n\n```\ncontroller.SimpleMove(myTransform.forward * curSpeed);\n```\n\
    \ntargetDirection is a Vector3-type that determines how much, based on the vert\
    \ input, we would like to move, even though this vector is only used in calculation\
    \ for its magnitude later on in the function:\n\n```\n// Target direction (the\
    \ max we want to move, used for calculating\n// target speed\ntargetDirection\
    \ = vert * myTransform.forward;\n```\n\nWhen the speed changes, rather than changing\
    \ the animation instantly from slow to fast, the variable curSmooth is used to\
    \ transition speed smoothly. The variable moveSmoothing is intended to be set\
    \ in the Unity Inspector, and it is multiplied by Time.deltaTime to make the speed\
    \ transition time based:\n\n```\n// Smooth the speed based on the current target\
    \ direction\nfloat curSmooth = speedSmoothing * Time.deltaTime;\n```\n\nThe next\
    \ line of the script caps the targetSpeed in 1. Taking the targetVector from earlier,\
    \ targetSpeed takes a maximum value of 1, or if it is less than 1, the value held\
    \ by targetDirection.magnitude:\n\n```\n// Choose target speed\n// We want to\
    \ support analog input but make sure you can't walk\n// faster diagonally than\
    \ just forwards or sideways\ntargetSpeed = Math.Min(targetDirection.magnitude,\
    \ 1.0f);\n```\n\nThe rest of the function transitions between walking and running\
    \ in the same way that the UpdateRotationMovement did earlier in this section:\n\
    \n```\n_characterState = CharacterState.Idle;\n\n// decide on animation state\
    \ and adjust move speed\nif (Time.time - runAfterSeconds > walkTimeStart)\n```"
