  md: "```\nif( currentWave<=0 )\n{\n    // this wave is done, let's start the next\
    \ one!\n    LaunchWave (\n}\n}\n```\n\n# 11.8.1 Script Breakdown\n\nThe way waves\
    \ are made in Blast Survival is by having a preset layout of enemies made previously\
    \ in the Unity editor, parented to a single gameObject and saved out as a single\
    \ prefab. When it comes time to add a new wave of enemies to the scene, the prefab\
    \ is instantiated and the wave spawner script keeps track of how many enemies\
    \ are until it is time to spawn new ones.\n\nThis is an arena-based shooter and\
    \ the action is intended to go on and until the player runs out of lives. In this\
    \ example game, there are just a few enemy wave prefabs (meaning that there are\
    \ just a few different types of attack waves), but there could be as easily as\
    \ tens or hundreds of different layouts as. The array spawnObjectPrefabs contains\
    \ references to all of the attack wave prefabs.\n\nWave_Spawner derives from MonoBehaviour\
    \ to take advantage of some of Unity's built-in function calls:\n\n```\nusing\
    \ UnityEngine;\nusing System.Collections;\n```\n\n```\npublic class Wave_Spawner\
    \ : MonoBehaviour\n{\n```\n\nWhen the Start() function is called, the is the first\
    \ thing that happens is all of the attack wave prefabs are created and the result\
    \ stored in the integer variable totalSpawnObjects:\n\n```\nvoid Start ()\n{\n\
    \    // count how many objects we have lined up in the spawn\n    // object list\n\
    \    foreach( GameObject go in spawnObjectPrefabs )\n    {\n        totalSpawnObjects++;\n\
    \    }\n```\n\n```\nDebug.Log(\"Wave_Spawner.cs \"+totalSpawnObjects+\" spawn\
    \ to choose from.\");\n```\n\nOnce finished, the first attack wave is scheduled\
    \ using timeBeforeFirst-Spawn to tell the Invoke statement how long to wait:\n\
    \n```\n// schedule first attack wave\nInvoke(\"LaunchWave\",timeBeforeFirstSpawn);\n\
    }\n```"
