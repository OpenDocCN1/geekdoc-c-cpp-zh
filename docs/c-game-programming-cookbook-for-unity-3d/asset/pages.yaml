  md: "# 4.8 Automatic Self-Destruction Script\n\nThe main use for a script that automatically\
    \ destroys its gameObject will for special effects. Particle effects such as explosions\
    \ will be instantiated, their effect will play out, and then they need to be destroyed.\n\
    In the example games, a short and simple class called AutomaticDestroyObject is\
    \ attached to a gameObject. After a set amount of time, set in the Unity Inspector\
    \ window, the gameObject is destroyed along with any associated child objects\
    \ attached to it.\n\nBelow is the full script:\n\n```\npublic class AutomaticDestroyObject\
    \ : MonoBehavior\n{\n    public float timeBeforeObjectDestroys;\n\n    void Start\
    \ () {\n        // the function destroyGO() will be called in\n        // timeBeforeObjectDestroys\
    \ seconds\n        Invoke(\"DestroyGO\", timeBeforeObjectDestroys);\n    }\n\n\
    \    void DestroyGO() {\n        // destroy this gameObject\n        Destroy(gameObject);\n\
    \    }\n}\n```\n\n# 4.8.1 Script Breakdown\n\nThe class, which derives from MonoBehavior,\
    \ is very simple. It uses Invoke to schedule a call to the DestroyGO() function\
    \ at a time set by the public variable timeBeforeObjectDestroys. It probably goes\
    \ without saying that DestroyGO() takes care of destroying itself, with Destroy(gameObject).\n\
    \n# 4.9 Automatic Object Spinner\n\nOne common action you may need to spin an\
    \ object. This may be for a number of reasons, the most obvious (in this book,\
    \ at least) being to draw attention to power-ups in the Interstellar Paranoids\
    \ game. By spinning the power-ups, they are more obvious to the player as something\
    \ that may be interacted with, whereas static power-ups may be easily missed or\
    \ ignored.\nMaking an object spin in Unity may be very simple, but having a script\
    \ to take care of this is a useful tool to keep in the toolkit.\n\nBelow is the\
    \ script in:\n\n```\nusing UnityEngine;\nusing System.Collections;\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: "```\npublic class AutoSpinObject : MonoBehaviour\n{\n    public Vector3 spinVector\
    \ = new Vector3(1,0,0);\n    private Transform myTransform;\n\n    void Start\
    \ ()\n    {\n        myTransform=transform;\n    }\n\n    void Update ()\n   \
    \ {\n        myTransform.Rotate (spinVector*Time.deltaTime);\n    }\n}\n```\n\n\
    #  4.9.1 Script Breakdown\n\nAutoSpinObject.cs derives from MonoBehaviour so that\
    \ it can use Unity's automatic calls to the Start() and Update() functions:\n\n\
    ```\npublic class AutoSpinObject : MonoBehaviour\n{\n```\n\nThe function is derived\
    \ from MonoBehaviour so that we can update the object rotation in Update() function.\n\
    \n```\npublic Vector3 spinVector = new Vector3(1,0,0);\nprivate Transform myTransform;\n\
    ```\n\nThe spinVector variable is a 3d vector that we will use to spin the object\
    \ with. By using a vector, we can spin the object in any direction in the 3D space\
    \ simply by changing the values this script component uses in the Inspector window\
    \ of the Unity editor. Select the gameObject that has this script attached and\
    \ change the value in the Inspector to change its behavior.\n\n```\nvoid Start\
    \ ()\n{\n    myTransform=transform;\n}\n```\n\nAs every other script, we cache\
    \ a reference to this object's transform in the Start() function. Caching this\
    \ reference will save a lot of valuable processor time over the game.\n\nThe Update()\
    \ function simply rotates the transform, multiplying the spinVector variable by\
    \ Time.deltaTime to ensure that the rotation is frame independent and time based:\n\
    \n```\nvoid Update ()\n{\n    myTransform.Rotate (spinVector*Time.deltaTime);\n\
    }\n```"
