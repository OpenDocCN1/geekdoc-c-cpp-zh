    ```\n// tell spawn controller that we're one enemy closer to the\n// next wave\n\
    WaveSpawnController.Fragged();\n\n```\n\nThe PlayerHit() function makes an explosion\
    \ sound via the BaseSoundController instance, then spawns an explosion wherever\
    \ the player is. The player control script will call this function when it collides\
    \ with an enemy projectile:\n\n```\npublic void PlayerHit(Transform whichPlayer)\n\
    {\n    // tell our sound controller to play an explosion sound\n    BaseSoundController.Instance.PlaySoundByIndex(2,\n\
    \    whichPlayer.position);\n\n    // call the explosion function!\n    Explode(whichPlayer.position);\n\
    }\n```\n\nEach time a new enemy is added to the world, it needs to the radar to\
    \ track it. The game controller acts as a go-between in its AddEnemyToRadar()\
    \ function, which takes the transform of the new object to be added and passes\
    \ it to the radar via its AddEnemyBlipToList() function:\n\n```\npublic void AddEnemyToRadar(Transform\
    \ aTransform)\n{\n    radarControlScript.AddEnemyBlipToList(aTransform);\n}\n\
    ```\n\nWhen an enemy is destroyed, the radar has no way to tell whether or not\
