  md: "The game controller for this game is created dynamically by the LevelSetup\
    \ script component attached to the empty gameObject named LevelSetup. The actual\
    \ script will be broken down later in this chapter, but the basic function of\
    \ the script is to check whether a game controller exists in the scene and, if\
    \ not, to instantiate one. It references two prefs, called GameController and\
    \ one SceneManager.\n\nBy creating the game controller and scene manager objects\
    \ dynamically, these objects can exist across different game levels. The level\
    \ setup script first checks to see whether they exist, and if the game scene is\
    \ a level other than the first, the objects will not be duplicated accidentally.\n\
    \nWhen the game controller prefab is instantiated, its gameObject looks like this,\
    \ in the Hierarchy window of the Unity editor:\n\n+   - GameController\n  - GameCamera\n\
    \    - BulletDestroyer\n    - BulletDestroyer\n    - Player_Parent_Object\n  \
    \  - StarsLayer1\n      - StarsLayer1\n\n+   - UI\n  - GAMEO_GRAPHIC\n  - GETREADY_GRAPHIC\n\
    \nIt can be seen that the GameController prefab contains everything required for\
    \ the game controller to function, create a player, and have a camera and UI available\
    \ to use during the game. The prefabs contains the minimum amount required to\
    \ run the game, the most important elements. With the exception of the LevelSetup\
    \ gameObject in each game scene, everything else in the level scenes is specific\
    \ to the level.\n\n# 14.3 Prefabs\n\nThe prefabs used for this game are\n\n+ \
    \  - ENEMIES\n  - EnemyShip_1\n  - EnemyShip_2\n  - EnemyShip_3\n  - Gameboss"
