  md: "toppling over in games, but it comes at cost. If the car were to roll and flip\
    \ over, it will roll in an unrealistic way because of the center of mass will\
    \ affect its movement. Look to the stabilizer bar simulation for a more realistic\
    \ solution, but for now, this is as far as we go:\n\n```\n// with this simple\
    \ vehicle code, we set the center of the mass\n// low to try to keep the car from\
    \ toppling over\nmyBody.centerOfMass= new Vector3(0,-4f,0);\n```\n\nIf no engine\
    \ sound has been set up in the Vehicle Inspector of the Unity editor, the script\
    \ tries to find it a call with GameObject.GetComponent(). The sound source will\
    \ be stored in engineSoundSource and used solely for engine sound effects:\n\n\
    ```\n// see if we can find an engine sound source, if we need to\n{\n    engineSoundSource=null\n\
    \n    engineSoundSource=myGO.GetComponent<AudioSource>();\n}\n\n```\n\nAs all\
    \ of the movement controllers, UserInput sets a flag to decide whether or not\
    \ inputs should be used to drive the vehicle:\n\n```\npublic void SetUserInput(bool\
    \ setInput)\n{\n    canControl= setInput;\n}\n```\n\nUnlike movement controllers\
    \ from this book so far, this introduces a lock state. The lock state is for holding\
    \ the vehicle in place without affecting its y-axis. This differs from disabling\
    \ user input as it adds physics constraints to the physics object to hold it still\
    \ (purpose being to hold the vehicle during the counting in the start of a race\
    \ or other similar scenario):\n\n```\npublic void SetLock(bool lockState)\n{\n\
    \    isLocked = lockState;\n}\n```\n\nLateUpdate() starts by checking for input\
    \ via the GetInput() function, when canControl is set to true. Next, UpdateEngineAudio()\
    \ is called to update the pitch of the engine sound based on the engine speed:\n\
