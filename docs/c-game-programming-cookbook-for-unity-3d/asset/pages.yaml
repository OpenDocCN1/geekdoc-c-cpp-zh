    \ them every time we need to relay input\n    // data out\n\n    // calculate\
    \ a percentage amount to use per pixel\n    float scalerX = 100f / Screen.width;\n\
    \    float scalerY = 100f / Screen.height;\n```\n\nThe delta amount of mouse movement\
    \ is calculated in the code by taking the current mouse position and subtracting\
    \ it from the position that the mouse was at the end of the last update.\n\n```\n\
    // calculate and use deltas\nfloat mouseDeltaY = Input.mousePosition.y - prevMousePos.y;\n\
    float mouseDeltaX = Input.mousePosition.x - prevMousePos.x;\n```\n\nWhen the mouse\
    \ position is multiplied by the scale variables (scalerX and scalerY), we end\
    \ up with a percentage amount. We say that the mouse is at a percentage amount\
    \ across the screen and use that percentage amount as:\n\n```\n// scale based\
    \ on screen size\nvert += (mouseDeltaY * speedY) * scalerY;\nhoriz += (mouseDeltaX\
    \ * speedX) * scalerX;\n```\n\n```\n// store this mouse position for the next\
    \ time we're here\nprevMousePos = Input.mousePosition;\n```\n\nThe mouse-based\
    \ input scripts also populate Boolean variables for directional-ment, if required:\n\
    \n```\n// set up some Boolean values for up, down, left and right\nUp = (vert\
    \ > 0);\nDown = (vert < 0);\nLeft = (horz < 0);\nRight = (horz > 0);\n```\n\n\
    To make the fire button work properly, mouse button must be set up correctly in\
