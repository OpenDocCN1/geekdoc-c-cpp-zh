  md: "In an attempt to prevent projectiles from colliding with the parent object\
    \ or with other projectiles spawned closely,Physics.IgnoreLayerCollision() is\
    \ used. Physics.IgnoreLayerCollision() takes two numbers (both integers) referring\
    \ to which layers should ignore colliding with each other. The layer numbers from\
    \ the Tags and Layers manager accessible via the menu Edit -> Project Settings\
    \ -> the Unity Editor Inspector by clicking on the layer dropdown and clicking\
    \ on the Add layer button. This is applied globally, which means that once two\
    \ layers are on Unity's list, everything placed on those layers will no longer\
    \ register collisions.\n\nIn this case, the first layer is the weapon's layer\
    \ for myTransform.gameObject.layer and the second taken from the variable myLayer,\
    \ which is set in the Init() function of this script:\n\n```\nPhysics.IgnoreLayerCollision(myTransform.gameObject.layer,\
    \ myLayer);\n```\n\nA better solution to avoiding collisions between the projectile\
    \ and any parent collider reference in the Unity editor Inspector window. This\
    \ part of the code checks that parentCollider is not null; then as it contains\
    \ something, Physics. When a collider is accessible to this script via parentCollider\
    \ (as set in the Unity Inspector window), Physics.IgnoreCollision is used to tell\
    \ the engine to ignore collisions between the two specific colliders.\n\nWhereas\
    \ Physics.IgnoreLayerCollision() worked to disable collisions between objects\
    \ on two layers, Physics.IgnoreLayerCollision() function stops collision events\
    \ on specified colliders:\n\n```\nif (parentCollider==null)\n{\n    // disable\
    \ collision between 'us' and our projectile\n    // so as to hit ourselves with\
    \ it!\n    Physics.IgnoreCollision(theProjectile.collider,\n    parentCollider);\n\
    }\n```\n\nThe newly created projectile needs to be returned to the function calling\
    \ when this is called from the Fire() function shown earlier in this section),\
    \ and the last bit of code from this script does that:\n\n```\n// return this\
    \ projectile in case we want to do something\n// else to it\nreturn theProjectile;\n\
    ```\n\nFurther on in this book, the example games are examined, these base scripts\
    \ will come again and we will see how they can be applied to real game situations.\
    \ In Chapter 9, we look at adding artificial intelligence (AI) to the game and\
    \ how the weapon controller can easily be tied into it controlled by an AI player\
    \ in a game."
