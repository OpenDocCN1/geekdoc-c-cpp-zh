    that reason, we need the waypoints to face “forward.” To make sure that the rotations
    of our waypoints are correct, we may go through and point each forward toward
    the next one:


    ```

    point.LookAt(currentPos);

    ```


    You can easily rotate a transform so that it points toward another transform using
    the transform.LookAt() function. It takes one or two parameters, the first being
    the transform you want to point toward and the second an optional up vector.

