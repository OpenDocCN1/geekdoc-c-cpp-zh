  md: "playerGO2 will hold a reference to the second player when a cooperative game\
    \ is selected from the main menu and totalPlayers is greater than 1:\n\n```\n\
    // if we have a two-player game, let's grab that\n// player's gameobject too\n\
    if(totalPlayers>1)\n    playerGO2=SpawnController.Instance.GetPlayerGO(\n```\n\
    \nWhen a level begins, a game controller prefab is instantiated. Within the child\
    \ objects of the game controller prefab are several objects to the game, one of\
    \ which is a camera named GameCamera. Until the game controller prefab is added\
    \ to the scene, the in-game levels have no camera. As the Init() function runs\
    \ on the game controller script, it grabs a reference to the camera and positions\
    \ it at the correct point for starting the level. CameraTransform is used to hold\
    \ the main reference:\n\n```\n// find the game camera\nCameraTransform = GameObject.Find(\"\
    GameCamera\").transform;\n```\n\n```\n// position the camera at the specified\
    \ position\n// (set in the Unity Editor window on this\n// component)\ntempVec3\
    \ = CameraTransform.localPosition;\ntempVec3.z = CameraStartPositionZ;\nCameraTransform.localPosition\
    \ = tempVec3;\n```\n\nThe variableControl holds a reference to the game controller\
    \ script:\n\n```\n// if we don't have a camera script object set by\n// the editor,\
    \ try to find one\ncameraControl=\nCameraTransform.GetComponent<BaseCameraControl(),\n\
    ```\n\nAs a top-down scrolling shoot 'em up game, the scrolling of the level is\
    \ continuous until it is stopped. The isStopped Boolean variable will be used\
    \ to stop scrolling when the player reaches the boss battle:\n\n```\nisStopped=false;\n\
    ```\n\nTo able to change game scenes, this script needs to have a reference to\
    \ the scene manager. It looks for the scene manager in the GetSceneManager() function:\n\
    \n```\n// make sure we have a scene manager to talk to\nGetSceneManager();\ndidInit=true;\n\
    ```\n\nAfter all of the main updates are done, the camera is moved forward a little\
    \ more in LateUpdate(). During the game, there are several very important objects\
    \ parented to the camera that will be moved along with it. These are\n\n+   *\
    \ BulletDestroyer Large invisible object with a box collider. There are two of\
    \ these objects, located just off camera, blocking the path across of the play\
    \ area for projectiles. One is at the top of the play area, one at the bottom.\
    \ When a projectile hits the collider, it is destroyed. This stops projectiles\
    \ from firing off into infinity."
