- pgno: 142
  md: '# 6 Weapon Systems


    The weapon system, or more specifically at this point, the firing system, needs
    to be capable of dealing with either single or multiple weapons. To be as flexible
    as possible, we will build a weapon management system that will control individual
    weapon controllers. Those weapon controllers, in turn, will deal with spawning
    projectiles, and finally, projectiles will take care of themselves independently.
    Our weapon management system should function with a single weapon, or we should
    be able to add many different weapons and switch between them.


    Our parent system should work independently of each specific weapon and fire out
    a generic message to the currently selected one. The selected weapon will deal
    with the call itself, and the overall weapon management system can continue unaffected.


    Each weapon is a prefab with a script attached that derives from BaseWeaponScript.
    The weapon should be self-contained except when it receives a call to Fire() in
    which it should do whatever it is supposed to do. BaseWeaponScript contains the
    basics for a weapon (ammunition, reload time, and the ability to be disabled or
    enabled).'
  merge: -1
  img_proc: true
- pgno: 143
  md: "# 6.1 Building the Scripts\n\nFor the weapon system, there are just two main\
    \ scripts:\n\n+   1. BaseWeaponController.cs\n\nThis is the framework for our\
    \ weapon control system. It offers everything the system requires, and it is intended\
    \ to be overridden for customization.\n\n+   2. BaseWeaponScript.cs\n\nThis script\
    \ takes care of individual weapon types. If you were to think of the BaseWeaponController\
    \ as the arms of the player, the BaseWeaponScript would be the design of the weapon\
    \ that it is holding.\n\n# 6.1.1 BaseWeaponController.cs\n\nHere is the BaseWeaponController.cs\
    \ script in its completed form:\n\n```\nusing UnityEngine;\nusing System.Collections;\n\
    public class BaseWeaponController : MonoBehaviour\n{\n    public GameObject[]\
    \ weapons;\n    public int selectedWeaponSlot;\n    public int lastSelectedWeaponSlot;\n\
    \    public Vector3 offsetWeaponSpawnPosition;\n    public Transform forceParent;\n\
    \    private ArrayList weaponSlots;\n    private ArrayList weaponScripts;\n  \
    \  private BaseWeaponScript TEMPWeapon;\n    private Vector3 TEMPvector3;\n  \
    \  private Quaternion TEMProtraction;\n    private GameObject TEMPGameObject;\n\
    \    private Transform myTransform;\n    private int ownerNum;\n    public bool\
    \ useForceVectorDirection;\n    public Vector3 forceVector;\n    private Vector3\
    \ theDir;\n```"
