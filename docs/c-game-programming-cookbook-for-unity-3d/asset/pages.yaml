- pgno: 316
  md: "# 12.3.2.1 Script Breakdown\n\nThe RaceController script is going to be tracking\
    \ everything we need for a race game\nother than players). It derives from MonoBehavior\
    \ so that it can tap into the automated\nsystem calls to Update(), Start(), etc.:\n\
    \n```\nusing UnityEngine;\nusing System.Collections;\n\npublic class RaceController\
    \ : MonoBehaviour\n{\n    Every racer will be given a unique ID by the global\
    \ race manager (covered later in this\nchapter). When the script is on its first\
    \ run, the myID variable is set to -1 so that any other\nscripts trying to access\
    \ it will instantly know that it is not ready to be accessed. Once the\nscript's\
    \ Init() function has called, the ID should no longer be -1, and it should be\
    \ set\ncorrectly:\n\n    // default myID to -1 so that we will know if the script\
    \ hasn't\n    // initializing when another script tries to GetID\n    private\
    \ int myID = -1;\n```\n\nRaceController() is automatically called by the engine\
    \ when the script is first\nantiated. To get the player set with an ID number\
    \ as soon as possible before the race\nactually begins, myID is set up in the\
    \ constructor (whereas it might normally be set a little\nlater on the Init()\
    \ function).\nTo get a unique ID, the global race manager has a function GetUniqueID().\n\
    The logic behind this function ensures that each player will be awarded a unique\
    \ ID\nat the start of each game. Its ID may then be used to identify it elsewhere.\
    \ Note that\nGlobalRaceManager.Instance is a static variable. The race manager\
    \ uses some nifty code\nto ensure that there is only ever one instance of the\
    \ script in action at any time, which will\nbe looked at later detail in this\
    \ section, so don't worry about that just now.\nmyID is an integer, set by call\
    \ to GlobalRaceManager.Instance.GetUniqueID().\nThe parameter it takes is instance\
    \ of the script, so that the race manager will be able to link\nt ID to the script\
    \ from here:\n\n```\npublic RaceController()\n{\n    myID = GlobalRaceManager.Instance.GetUniqueID(this);\n\
    \n    Debug.Log(\"ID assigned to \"+myID\");\nn}\n```\n\nInit() grabs a cached\
    \ reference to myTransform and sets its doneInit Boolean to true:\n\n```\npublic\
    \ void Init()\n{\n    myTransform= transform;\n    doneInit= true;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "There may be occasions where other scripts need to get player's unique ID number,\
    \ which is why the GetID() function returns the value of myID:\n\n```\npublic\
    \ int GetID() {\n    return myID;\n}\n```\n\nWhen the player passes by all of\
    \ the waypoints around the track, the variable isDone is set to true. This Boolean\
    \ is used when the player hits the trigger on the start/finish line to see whether\
    \ or not the lap should be increased. Increasing laps in this way (rather than\
    \ just incrementing the current lap counter at the start/finish line) ensures\
    \ that the player has driven all the way around the track and crosses the finish\
    \ line:\n\n```\npublic bool IsLapDone() {\n    return isLapDone;\n}\n```\n\nRaceFinished()\
    \ is the function responsible for finding out the player's final race position\
    \ and telling the player when it is time to stop racing. First, our internal variables\
    \ are set up for use in other scripts, which is isFinished, race Running, and\
    \ finalPosition:\n\n```\npublic void RaceFinished() {\n    isFinished=true;\n\
    \    raceRunning=true;\n}\n```\n\nfinalPosition gets its value by hitting up the\
    \ GlobalRaceManager for its race position via GetPosition(passing in this player's\
    \ ID myID):\n\n```\n// find out which position we finished in\nint finalPosition=\n\
    GlobalRaceManager.Instance.GetPosition(myID);\n```\n\nTo tell the player that\
    \ the race has finished, this script uses Unity's function GameObject.SendMessageUpwards().\
    \ What does this is a message from this script to the gameObject and every ancestor\
    \ of it. If there is a component script attached to, containing a function naming\
    \ the message being sent, in case, PlayerFinishedRace(), then it will be called.\n\
    \nThis part of the code could have stored a reference to the player's control\
    \ script directly, but that would mean hard the player script, which reduces the\
    \ overall flexibility of this script. For example, the player control script for\
    \ this game is named PlayerController_MVD. The player control script for the example\
    \ Tank Battle is named PlayerController_TB. If we wanted to make a reference to\
    \ the player's script for this game, it would need to be in a variable of type\
