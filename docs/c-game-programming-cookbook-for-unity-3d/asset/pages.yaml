  md: "# 2.2.2 Scene Manager\n\nA manager controls the game flow between physical\
    \ scenes. Buttons from the menu interface do not load scenes directly; it falls\
    \ upon the scene manager script below to load them:\n\n```\npublic class SceneManager\
    \ : MonoBehaviour\n{\n    public string[] levelNames;\n    public int gameLevelNum;\n\
    \n    public void Start ()\n    {\n        // keep this object alive\n       \
    \ DontDestroyOnLoad(this.gameObject);\n    }\n\n    public void LoadLevel(string\
    \ sceneName)\n    {\n        Application.LoadLevel(sceneName);\n    }\n\n    public\
    \ void GoNextLevel()\n    {\n        // if our index goes over the total number\
    \ of levels in the\n        if (gameLevelNum >= levelNames.Length)\n         \
    \   gameLevelNum = 0;\n\n        // load the level (the array index starts at\
    \ 0, but we start\n        // counting game levels at 1 for clarity's sake)\n\
    \        LoadLevel(gameLevelNum);\n\n        // increase our game level index\
    \ counter\n        gameLevelNum++;\n    }\n\n    private void LoadLevel( int indexNum)\n\
    \n    {\n        // load the game level\n        LoadLevel(levelNames[indexNum]);\n\
    \    }\n\n    public void resetGame()\n    {\n        // reset the level index\
    \ counter\n        gameLevelNum = 0;\n    }\n}\n```\n\n# 2.2.2.1 Script Breakdown\n\
    \nAny script may call for a scene change, and menus, game controllers, or tutorial\
    \ controllers may easily move between sections of the game without having to have\
    \ filenames hardcoded into them.\n\nThe level manager may also be a good place\
    \ to show loading screens, implement scene transitions (such as fade ins/outs\
    \ or animations), or start downloading scenes from a remote location."
