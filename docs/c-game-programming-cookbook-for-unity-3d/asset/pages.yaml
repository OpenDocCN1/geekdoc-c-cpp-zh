  md: "Player_Parent_Object When the player is spawned the game controller, it will\
    \ be parented to this object. In turn, as this object is parented to the camera,\
    \ the player will always move along with the camera.\n\nStarsLayer1 Particle effects\
    \ to simulate stars in the background. This effect moves along with the camera,\
    \ and the particles move down to look as though it is a constant movement through\
    \ space.\n\nIf the Boolean variable isStopped is set to true, the camera will\
    \ not be moved further through the level. This is used at the end of the level\
    \ during the boss battle. The translate function only requires a movement vector,\
    \ which is multiplied by Time.deltaTime, in this case, to make sure that the movement\
    \ is based:\n\n```\npublic void LateUpdate() {\n    if(isStopped) {\n        //\
    \ do fly movement through the level\n        Transform.Translate(Vector3.up *\n\
    \        Time.deltaTime * levelForwardSpeed);\n    }\n}\n```\n\nStartPlayer()\
    \ is scheduled by the Init() function to be called several seconds after the level\
    \ first loads. Until this point, the player (or players) will be held in place.\
    \ This function starts out by grabbing references to the Player_SpaceShip_IP component\
    \ with Unity's GameObject.GetComponent(), followed by another GetComponent() call\
    \ to find the DataManager component (BasePlayerManager and DataManager scripts\
    \ were discussed back in Chapter 3):\n\n```\npublic void startPlayer() {\n   \
    \ Debug.Log(\"StartPlayer!!!\");\n    // find the player's control script and\
    \ hold it in\n    // playersScript\n    playerScript=playerGO1.GetComponent<Player_SpaceShip_IP>();\n\
    }\n```\n\n```\nmainPlayerDataManager=playerGO1.GetComponent<BasePlayerManager>().DataManager;\n\
    ```\n\nNow that references have been stored for playerScript and mainPlayerDataManager,\
    \ a message is sent to the player's control script component to call its StartGame()\
    \ function. GameObject.SendMessage() is used to send it:\n\n```\n// all ready\
