  md: "# 6.1.2.1 Script Breakdown\n\nThe BaseWeaponScript class derives from MonoBehavior:\n\
    \nusing UnityEngine;\nusing System.Collections.\n\n```\npublic class BaseWeaponScript\
    \ : MonoBehaviour\n{\n    public virtual void Start()\n    {\n        Init();\n\
    \    }\n}\n```\n\nInit() begins grabbing a reference to the transform and the\
    \ layer at which this gameObject with this script attached to is set. This will\
    \ be used to disable collisions between the layer of the weapon and the actual\
    \ projectile so that the projectile does not explode as soon as it is instantiated:\
    \ Init()\n\n```\npublic virtual void Init()\n{\n    // cache the transform\n \
    \   myTransform= transform;\n\n    // cache the layer (we'll set all projectiles\
    \ to avoid\n    // layer in collisions so that things don't\n    // themselves!)\n\
    \    myLayer= gameObject.layer;\n\n    // load the weapon\n    Reloaded();\n}\n\
    ```\n\nThe Enable() and Disable() functions set the Boolean variable canFire to\
    \ true and false, respectively. This will be checked elsewhere in the code before\
    \ allowing any projectile firing. Note that the visual representation of the weapon\
    \ is not hidden here; that task is left to the slot control script to deal with\
    \ rather than the weapon itself:\n\n```\npublic virtual void Enable()\n{\n   \
    \ canFire=true;\n}\n\npublic virtual void Disable()\n{\n    canFire=false;\n}\n\
    ```\n\nWhen the weapon is fired, the assumption is made that it will not be loaded\
    \ for a certain period of time (otherwise, you could, in theory, fire thousands\
    \ of projectiles each second). To keep track of when the weapon is in a loaded\
    \ state, this script uses the"
