    No walk animation found. Turning off\nanimations.\");\n    }\n```\n\nInit() caches\
    \ references to the characters rigidbody, GameObject, and transform\nbefore grabbing\
    \ references to some required scripts. To work within the player structure,\n\
    Keyboard_Input.cs is used to provide input from the player to move the character\
    \ around.\nBasePlayerManager.cs is also referenced in the Init() function, and\
    \ although this script\ndoes not use it directly, it does store a reference to\
    \ the player manager for other scripts to\naccess:\n\n```\npublic virtual void\
    \ Start () {\n    Init();\n}\nublic virtual void Init () {\n    // cache the usual\
    \ suspects\n    myBody= rigidbody;\n    myGO= gameObject;\n    myTransform= transform;\n\
    \n    // default keyboard input\n    default_input= myGO.AddComponent<Keyboard_Input>();\n\
    \n    // cache a reference to the player controller\n    myPlayerController= myGO.GetComponent<BasePlayerManager>();\n\
    \n    if(myPlayerController==null)\n        myPlayerController.Init();\n}\n```\n\
    \nThe SetUserInput() function is used to set canControl, which is used to check\
    \ whether\ninput is disabled or not:\n\n```\npublic void SetUserInput( bool setInput\
    \ ) {\n    canControl= setInput;\n}\n```"
