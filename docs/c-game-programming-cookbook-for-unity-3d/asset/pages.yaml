  md: '# 5 Building Player Movement Controllers


    As discussed in Chapter 3, what we called a player controller is focused on movement;
    it is the script that determines the way that a player moves and behaves in the
    physics world. It is entirely focused on movement—making a ship fly, a human move
    along the ground, or a car to drive.


    The example games call for three different vehicle types:


    +   1. Shoot ''em up spaceship—A spaceship that moves up, down, left, and right.
    Its movement need not be physics based.


    +   n2. Humanoid character—This control script is capable of general human things,
    such as running forward, backward, and turning around.


    +   3. Wheeled vehicle—The vehicle controller utilizes Unity’s wheel colliders
    to work toward a more realistic physics simulation. There will be no gearing,
    but the vehicle will be able to accelerate, brake, or steer left and right.


    # 5.1 Shoot ''Em Up Spaceship


    This script moves the player left, right, up, or down on the screen. It does not
    use any physics forces, but instead Transform.Translate manipulates the GameObject’s
    transform position directly.'
