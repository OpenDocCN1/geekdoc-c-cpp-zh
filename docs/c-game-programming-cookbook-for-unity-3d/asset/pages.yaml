    \ anywhere, which makes\nplaying sound possible from any other script in the game.\
    \ When the script's Awake()\nfunction is called, Instance is set to the instance\
    \ of the script. The assumption is that each\nscene requiring sound effects will\
    \ contain one instance of this script in a scene, attached\nto an empty GameObject\
    \ or similar. Since this script does not check for multiple instances,\ncare must\
    \ be taken to ensure there is only one instance in a scene:\n\n```\npublic void\
    \ Awake()\n{\n    Instance = this;\n}\nvoid Start()\n{}\n```\n\nPlayerPrefs saves\
    \ a file to the user's hard drive, which can be accessed at any time for\nsaving\
    \ trivial data. The Unity documentation has the following information on where\n\
    PlayerPrefs files are stored:\n\nEditor/Standalone\n\nOn Mac OS X PlayerPrefs\
    \ are stored in ~Library/Preferences folder, in a file named unity.\n[company\
    \ name][product name].plist, where company and product names are the names\nup\
    \ in Project Settings. The same .plist file is used for both Projects in the Editor\n\
    and standalone players.\n\nOn Windows, PlayerPrefs are stored in the registry\
    \ under HKCU\\Software\\{company\nname}[product name] key, where company and product\
    \ names are the names set up in\nProject Settings.\n\nOn Linux, PlayerPrefs can\
    \ be found in ~/.config3d/[CompanyName]/[ProductName],\nconfig33d again when using\
    \ the company and product names specified in the Project Settings.\n\n# WebPlayer\n\
    \nOn Web players, PlayerPrefs are stored in binary files in the following locations:\n\
