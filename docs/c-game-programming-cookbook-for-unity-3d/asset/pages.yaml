  md: '# # 10 Menus and User Interface


    In this chapter, first up is a full breakdown of the main menu used for all of
    the example games. The main menu structure should provide a perfect starting place
    for any main menu system.


    The second part of this chapter will look at in-game UI and how the example games
    derive from a class that helps to store useful data.


    # ## 10.1 The Main Menu


    First impressions last. When you walk by a store, its appearance may influence
    your decision whether to go in and browse or to keep walking. It may also affect
    how you feel about the goods inside. A quick visit to an Apple Store can demonstrate
    the extreme of this idea, where everything is arranged to exacting, some may say
    extreme, levels of detail. It was no coincidence that many of Apple''s initial
    retail team came from the clothing store Gap, a company well known for its cool
    image and stylish branding.\ Owing to the nature of electronics (hard stylish
    to go cable shopping, the appearance of electronics stores had taken a back seat
    to before Apple came and changed things. Apple brought emotion, humanity, function,
    and style to electronics. Steve Jobs said in a video tour of the first Apple store
    that "people don''t just want to buy personal computers anymore, they want to
    know what


    > * http://online.wsj.com/article/SB10001424052720304563104576364071955678908.html.'
