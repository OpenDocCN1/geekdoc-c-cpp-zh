  md: "```\n// store the current time so that we can use it on the next\nupdate\n\
    lastTime=Time.realtimeSinceStartup;\n```\n\nThe rest of the function checks to\
    \ see whether isTimerRunning is true before updating currentTime. TimerRunning\
    \ is a Boolean that we can use to start or stop the timer without affecting anything\
    \ else.\n\nNote that one commonly used method of passing Unity games is to set\
    \ Time.timeScale to 0, which would stop a timer that didn't use Time.realtimeSinceStartup.\
    \ In this case, we will be unaffected by timescale, so this alternative system\
    \ will need to be used to start and stop the timer during a game pause.\n\nThe\
    \ final part of the UpdateTimer() function grabs the current Time.realtimeSinceStartup\
    \ and stores it in the variable lastTime, so that we can use its value to calculate\
    \ the time elapsed between this and the next call to UpdateTimer.\n\nA StartTimer()\
    \ function is used to start the timer:\n\n```\npublic void StartTimer ()\n{\n\
    \    // set up initial variables to start the timer\n    isTimerRunning=true;\n\
    \    lastTime=Time.realtimeSinceStartup;\n}\n```\n\nisTimerRunning tells us or\
    \ not to update currentTime in the UpdateTimer() function earlier. When we start\
    \ the timer, we need to ensure that its value is true. lastTime needs to be reset\
    \ when we start the timer so that time will not be counted that occurred 'in between'\
    \ the timer being stopped and the timer starting up again.\n\n```\npublic void\
    \ StopTimer ()\n{\n    // stop the timer\n    isTimerRunning=false;\n}\n```\n\n\
    isTimerRunning is set to false, which stops UpdateTimer() from adding any extra\
    \ time to the currentTime variable.\nIf there is ever a need to reset the timer,\
    \ we need to refresh some of the main variables to their default states. The ResetTimer()\
    \ function, timeElapsed, lastTime, and currentTime are reset:\n\n```\npublic void\
    \ ResetTimer ()\n{\n    // resetTimer will set the time back to zero\n    timeElapsed=0.0f;\n\
    \    currentTime=0.0f;\n    lastTime=Time.realtimeSinceStartup;\n}\n```"
