  md: "This game uses a race manager script. As discussed at the beginning of this\
    \ chapter, the race manager tracks state for both the individual players and the\
    \ race overall. The game controller needs to tell the race manager, held in the\
    \ variable GlobalRaceManager, that the race is beginning, and a new race should\
    \ be initialized:\n\n```\n// tell race manager to prepare for the race\nGlobalRaceManager.Instance.NewRace(\
    \ totalLaps );\n```\n\nThe spawn system requires two arrays to be passed into\
    \ it for spawning the players, for the start positions and the start rotations.\
    \ In this code, the arrays are initialized and populated with positions and rotations\
    \ from the startPoints array:\n\n```\n// initialize some temporary arrays we can\
    \ use to set up the\nplayers\nVector3 [] playerStarts = new Vector3[numberOfRacers];\n\
    Quations [] playerRotations = new Quaternion[numberOfRacers];\n```\n\n```\n//\
    \ we are going to use the array full of start positions that must\n// be in the\
    \ editor, which means we always need to make sure\n// there are enough start positions\
    \ for the number of players\n```\n\n```\nfor ( int i = 0; i < numberOfRacers;\
    \ i++)\n{\n    // grab position and rotation values from start position\n    //\
    \ transforms into the inspector\n    playerStarts[i] = (Vector3) startPoints[i].position;\n\
    \    playerRotations[i] = ( Quaternion ) startPoints[i].rotation;\n}\n```\n\n\
    Now that the controller has positions and rotations for the players, SpawnController\
    \ may be called upon to add the players to the scene:\n\n```\nSpawnController.Instance.SetupPlayers(\
    \ playerPrefab,\nplayerStarts, playerRotations, playerParent, numberOfRacers );\n\
    ```\n\nplayerTransforms is filled with all of the transforms. We get to them by\
    \ calling SpawnController.Instance.GetAllSpawnedPlayers(), which returns all of\
    \ the player transforms created by the spawn controller:\n\n```\nplayerTransforms=new\
    \ ArrayList();\n```\n\n```\n// let's grab references to each player's controller\n\
    // script\nplayerTransforms =\nSpawnController.Instance.GetAllSpawnedPlayers();\n\
    ```\n\nWhen the game controller communicate with the players, it uses references\
    \ to them from an array playerList. The next part of the code iterates through\
    \ the playerTransform array (using the value held in numberOfRacers as a total\
    \ count) and uses GameObject.GetComponent() to find each instance of the CarController_MVD.cs\
    \ script attached to each player. As the code steps through each player, it also\
    \ uses GetComponent() to find its AI controller script to tell it which waypoint\
    \ control script to use and calls its Init() function:\n\n```\nplayerList=new\
    \ ArrayList();\n```"
