  md: '# Implementation


    Implementation (also called class implementation)

    The code and declarations of data within a class. This is the code that is accessed
    using the interface. This information is typically stored in a .cpp file and compiled
    into object or library form. In many cases, the interface (in the form of a header
    file) and the compiled code (object or library file) is provided and not the actual
    class code—which prevents it from being modified.


    Incrementing

    Increasing a value by 1 (when applied to the ++ operator).


    Indirection

    Accessing the value at an address held by a pointer.


    Infinite loop

    Doing the same thing again and again forever. This is the type of iteration that
    programmers strive to avoid.


    Inheritance

    Creating a new type that can extend the characteristics of an existing type.


    Instantiation

    Creating an object from a class, or a type from a template.


    Interface (also called class interface)

    The definition of data and methods that can be accessed by other classes and code.
    The interface tells how the code is used. This information is stored in a header
    file and included in the using module.


    # Interpreter


    An interpreter translates a program from human-readable form to machine code while
    the program is running.


    # ISO


    International Organization for Standardization. An international standards body
    similar to ANSI. ISO is not a governmental agency. Go to http://www.iso.org for
    more information.


    # Iteration


    Doing the same thing again and again.


    # L


    # L-value


    An l-value is an operand that can be on the left side of an operator.


    # Library


    A collection of linkable files that were supplied with your compiler, you purchased
    separately, or created yourself.


    # Linked list


    A data structure that consists of nodes linked to one another.


    # Linker


    A program that builds an executable (runnable) file from the object code files
    produced by the compiler.


    # Linking


    The second step in creating an executable; links together the object files produced
    by a compiler into an executable program.'
