    # Program Text


    You can follow several tips to create easy-to-read code. Code that is easy to
    read is easy to maintain:


    +   - Use whitespace to help readability.


    +   - Objects and arrays are all referring to one thing. Don''t use spaces within
    object references (, ->), [].


    +   - Unary operators are associated with their operand, don''t put a space between
    them. Do put a space on the side of the operand. Unary operators include !, ~,
    +, -, * (for pointers), & (casts), and sizeof.


    +   - Binary operators should have spaces on both sides: +, *, /, %, >>, <<, >,
    ==, !=, &, &&, ?, +=; and so on.


    +   - Don''t use lack of spaces to indicate precedence (4 3*).


    +   - Put a space after commas and semicolons, before.


    +   - Parentheses should not have spaces on either side.


    +   - Keywords, such as if, should be set off by a space: if a ==.


    +   - The body of a comment should be set off from the // with a space.


    +   - Place the pointer or reference indicator next to the type name, not the
    variable name. Do this:


    ```

    char* foo;

    int&intInt;

    ```


    rather than this:


    ```

    char * foo;

    int &intInt;

    ```


    +   - Not declare more than one variable on the same line unless they are related.


