  md: 'Get a feel for what the design process is, examine this question: What will
    be on the menu? For PostMaster, the first choice is probably New Mail Message,
    and this immediately raises another design issue: When the user selects New Mail
    Message, what happens? Does an editor created, which in turn creates a mail message,
    or does a new mail message created, which then creates the editor?


    The command you are using with New Mail Message, so creating a new mail message
    seems like the obvious thing to do. But what happens if the user clicks after
    starting to write the message? Perhaps it would be better to clear the first editor
    and have it create (and own) the new message.


    The problem with this approach is that the editor will need to act differently
    if it is creating a message than if it were editing the message; whereas if the
    message is created first, and then handed to the editor, only one set of code
    needs to exist because everything is an existing message.


    If a message is created first, who creates it? Is it created by the new menu command?
    If so, does the menu also tell the message to edit itself, or is this part of
    the constructor of the message?


    It makes sense for the constructor to do this at first glance; after all, every
    time you create a message you''ll probably want to edit it. Nonetheless, this
    is not a good design idea. It is possible that the premise is wrong; you might
    create “canned” messages (that is, errors mailed to the system operator) that
    are not put into an editor. Second, and more important, a constructor''s job is
    to create an object; and no more or less than that. After a message is created,
    the constructor''s job is done. Adding a call to the edit function will confuse
    the rules of the constructor and make the message vulnerable to failures in the
    editor.


    Worse yet, the edit function will call another class—the editor—causing its constructor
    to be called. But the editor is not a base class of the message, nor is it contained
    within the message. It would be unfortunate if the construction of the message
    depended on successful construction of the editor.


    Finally, you won''t want to call the editor all if the message can''t be successfully
    created; yet successful creation would, in this scenario, by calling the editor!
    Clearly, you want to fully return from message''s constructor before calling Message::Edit().


