    # Preprocessor Directives


    A C++ compiler''s first action is to call another tool called the preprocessor
    that examines the source code. This happens automatically each time the compiler
    runs.


    The first character in line 1 is the # symbol, which indicates that the line is
    a command to be handled by the preprocessor. These commands are preprocessor directives.
    The preprocessor''s job is to read source code looking for directives and modify
    the code according to the identifier. The modified code is fed to the compiler.


    The preprocessor serves as an editor of code right before it is compiled. Each
    directive is a command telling the preprocessor what to do.


    The #include directive tells the preprocessor to include the entire contents of
    a designated filename at that spot in a program. C++ includes a standard library
    of source code that can be used in your programs to perform useful functionality.
    The code in the iostream file supports input and output tasks such as displaying
    information onscreen and taking input from a user.


    The < > brackets around the filename tell the preprocessor to look in a standard
    set of locations for the file. Because of the brackets, the preprocessor looks
    for the iostream file in the directory that holds header files for the compiler.
    These files are also called include files because they are included in a program''s
    source code.


    The full contents of iostream are included in place of line 1.'
