    # Complex Hierarchies of Abstraction


    At times, you will derive ADTs from other ADTs. It might be that you want to make
    some of the derived virtual functions nonstop and leave others pure.


    If you create the Animal class, you can make eat(), sleep(), move(), and reproduce()
    pure virtual functions. Perhaps you derive Mammal and Fish from Animal.


    On examination, you decide that Mammal will reproduce in the same way, and so
