  md: '# Q&A


    Q. Are there any risks using the auto keyword?


    A. One of the biggest is when you''re mistaken about what data type is being assigned
    by the statement. A common blunder in C++ is to assume that the literal 3.5 is
    a float literal. It''s actually a double. If you''ve created an auto-typed variable
    using a value like that and you don''t realize it''s a double, you could make
    assumptions about how you can use the variable in a program.


    Q. When will C++0x be finished?


    A. At the time of this writing, C++0x has been published as a final committee
    draft and is supposed to be out at the end of 2011.


    > However, that estimate is coming from the same folks who once believed it would
    be done by 2008 or 2009. They''re clearly following the standards of the old Paul
    Mass wine commercial, "We will sell no wine before its time."


    The publication of the final committee draft meant that the C++ standards body
    was no longer considering new features, a big step toward the final release. But
    the group work meets three times a year for 6 days, so if a meeting does not reach
    agreement on issues, it pushes the process back another 4 months.


    Although it''s possible C++0x will be a Christmas in 2011, a more likely estimate
    is that it will be by mid-2012.


    Q. Who invented the crossword puzzle?


    A. The crossword puzzle was devised by Arthur Wynne in 1913 for the New York World
    newspaper. The first one was published on December 21, 1913, and described as
    "Cross-Word."


    Wynne created new puzzles each week for the newspaper. His puzzles had the same
    rules as current puzzles but unless an unusual shape. Words crossed each other
    on a diamond shaped grid with black squares in the middle.


    Wynne quickly settled on a rectangular shape and the name "Cross-Word.\ Eleven
    years later in 1924, fledgling book publishers Dick Simon and Lincoln Schuster
    introduced crosswords to an international audience by issuing a collection of
    New York World puzzles that became a bestseller.


    The first crossword puzzle is available online at http://www.think.com/crosswords/first2.htm.
    If you can figure out a seven-letter word for a "written acknowledgment" that
    starts with R, I''d appreciate the help.'
