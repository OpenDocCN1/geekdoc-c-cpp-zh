  md: "# New for Loop\n\nOne disadvantage of C++ relative to languages such as Java\
    \ is the amount of code required to do one of the most common tasks in programming.\
    \ When you iterate through the elements of an array or another list, the code\
    \ is verbose and inelegant.\n\nC++0x adds a new for loop that's much easier for\
    \ this task.\n\nThe for has two sections separated by a colon (:). The first is\
    \ a reference that holds the value of the list or list element. The second is\
    \ the name of the list.\n\nThe following code multiplies every element of an array\
    \ by 3 and displays the result:\n\n```\nint positions[5] = {4, 3, 10, 25, 8};\n\
    for (int &p : positions)\n{\n    p *= 3;\n    std::cout << p << \"\\n\";\n}\n\
    ```\n\nThis is called a range-based for loop and can be used on arrays, initializer\
    \ lists, and any class that has a begin() and end() function that returns iterators.\n\
    \n# Summary\n\nThe features introduced during this hour are just the first that\
