    # # Why Should I Learn C++?


    You could be learning a lot of other languages, but C++ is valuable to learn because
    it has stood the test of time and continues to be a popular choice for modern
    programming.


    In spite of being created in 1979, C++ is still being used for professional software
    today because of the power and flexibility of the language. There''s even a new
    version of the language coming up, which has the working title C++0x and makes
    the language even more useful.


    Because other languages as Java were inspired by C++, learning the language can
    provide insight into them, as well. Mastering C++ gives you portable skills that
    you can use on just about any platform on the market today, from personal computers
    to Linux and Unix servers to mainframes to mobile devices.


