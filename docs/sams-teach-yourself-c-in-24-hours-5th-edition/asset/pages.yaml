  md: '# Quiz


    +   1. What happens when a variable is a parameter received by a called function?


    **A. A copy of the variable is passed to the function.**

    **B. The actual variable is passed to the function.**

    **C. A compiler error occurs.**


    +   2. When three overloaded functions have the same name, how does C++ know which
    one to call?


    **A. The function''s return types are different.**

    **B. The functions parameters are different.**

    **C. The order of the function from top to bottom.**


    +   3. How many values can a return statement return?


    **A. One**

    **B. One or more**

    **C. None or one


    # Answers


    +   1. A. A copy is made of the variable, which is called passing by value. Any
    changes to the variable within the function do not affect the original variable.


    +   2. B. Overloaded functions must have parameters of different types or a different
    number of parameters. The compiler uses this difference to determine which function
    to call. The return type of the functions does not matter.


    +   3. C. A function can return no more than one value, although the function
    can have several return statements to return that value. When a function does
    not return any value, the void data type indicates this fact.'
