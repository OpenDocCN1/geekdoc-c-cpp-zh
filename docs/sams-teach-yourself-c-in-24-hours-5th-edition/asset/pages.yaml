    The addition operator is invoked on line 33:


    ```

    gamma = alpha + beta;

    ```


    The compiler interprets the statement as if you had written the following code:


    ```

    gamma = alpha.operator+(beta);

    ```


    Line 33 invokes the operator+ member function declared on line 11 and defined
    on lines 25–28.


    There are two operators in an addition expression. The left operand is the object
    whose operator+() function is called. The right operand is the parameter of this
    method.


    If you had written an add() method to add two objects together, it could have
    been called with a statement of this kind:


    ```

    gamma = alpha.add(beta);

    ```


    Operator overloading makes programs easier to use and understand by replacing
    explicit function calls.


    # Limitations on Operator Overloading


    Although operator overloading is one of the most powerful features in the C++
    language, it has limits.


    Operators for built-in types like int cannot be overloaded. The precedence order
    cannot be changed, and the arity of the operator—whether it is unary, binary,
    or ternary—cannot be altered, either. You also cannot make new operators, there''s
    no way to do something without declaring ** to be the exponentiation (power) of
    operator.


    Operator overloading is one of the aspects of C++ most used and abused by new
    programmers. It is tempting to create new and interesting uses for some of the
    more obscure operators, but these often lead to code that is confusing and difficult
    to read.'
