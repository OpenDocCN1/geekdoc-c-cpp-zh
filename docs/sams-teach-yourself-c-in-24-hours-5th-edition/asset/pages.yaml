    # Q&A


    +   Why use static data when you can use global data?


    +   Static data is scoped to the class. It is therefore available only through
    an object of the class—through an explicit and full call using the class name
    if the data is public, or by using a static member function. Static data is typed
    to the class type, and the restricted access and strong typing makes static data
    safer than global data.


    +   Why use static member functions when you can use global functions?


    +   Static member functions are scoped to the class and can be called only by
    using an object of the class or an explicit full specification (such as ClassName::FunctionName()).


    +   Why not make all classes friends of all the classes they use?


    +   Making one class a friend of another executes the implementation details and
    reduces encapsulation. The ideal is to keep as many of the details of each class
    as possible hidden from all other classes.


    +   Why did Woody Hayes punch a player on an opposing team back in the ''70s?


    +   Hayes, the fiery coach who led the Ohio State Buckeyes to three national championships,
    punched a Clemson Tigers player because he''d just intercepted a pass in a bowl
    game.


    > In the 1978 Gator Bowl, the Buckeyes had the ball and were trailing Clemson
    17-15 with a little over 2 minutes later. Charlie Bauman intercepted an Art Schlich
    pass and was knocked out of bounds on the Ohio State sideline.


    > Hayes punched him in the neck and hit one of his own players who was trying
    to restrain him. He was fired one day later and died in 1987.


    > The coach explained his competitiveness this way: “Nobody loses more than I
    do. That’s what I got into trouble over the years, but it also made a man with
    mediocre ability into a pretty good coach.”'
