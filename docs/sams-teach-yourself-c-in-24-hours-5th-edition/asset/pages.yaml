  md: '# The Stack and the Heap


    Local variables are on the stack, along with function parameters. Code is in code

    space, of course, and global variables are in global space. The registers are

    used for internal housekeeping functions, such as keeping track of the stack

    and the instruction pointer. Just as all remaining memory is given over to the

    heap, which is sometimes referred to as the free store.


    The problem with local variables is they do not persist. When the function returns,

    the local variables are thrown away. Global variables solve that at the cost

    of being accessible without restriction throughout the program, which leads to
    the

    creation of bug-prone code that is more difficult to understand and maintain.
    Putting

    data in the heap solves both of these problems.


    You can think of the heap as a massive section of memory in which thousands of

    secentially numbered cubbyholes waiting for your data. You can''t label these

    cubbyholes, though as you can the stack. You may ask for the address of the

    cubbyhole you reserve and then stash that address in a pointer.


    One way to think about this is with an analogy: A friend gives you the 800 number

    of Acme Mail Order. You go home and program your telephone with that number,

    and then throw away the piece of paper with the number on it.


    When you push the button, a telephone rings somewhere, and Acme Mail Order

    Answers. You don''t know the number, and you don''t know where the other tele-

    phone is located, but the button gives you access to Acme Mail Order.


    Acme Mail Order is on your data. You don''t know where it is, but you know

    how to get to it. You access it by using its address—in this comparison, the telephone

    number. You don''t have to know that; you just have to put it into a pointer—nspeed-dial
    button. The pointer gives you access to your data without bothering

    with the details.


    The stack is cleaned automatically when a function returns. The local variables

    out of scope, and they are removed from the stack. The heap is not cleaned until
    your

    program ends, and it is your responsibility to free any memory you''ve reserved

    when you are done with it. Leaving things hanging around the heap when you no

    longer need them is known as a memory leak, a topic covered in this hour.


    The advantage of the heap is that the memory remains available until

    you explicitly free it. If you reserve memory on the heap while in a function,

    tmemory is still available when the function returns.


    The advantage of accessing memory in this way, rather than using global variables,

    is that only functions with access to the pointer have access to the data. This
    provides

    tightly controlled interface to that data, and it eliminates the problem of one-

    tion changing data in unexpected and unanticipated ways.'
