  md: '# HOUR 9: Moving into Advanced Classes


    If you declare a function to be const and the implementation of that function
    changes the object by changing the value of any of its members, the compiler will
    flag it as an error.


    It is good programming practice to declare as many function to be const as possible.
    Each time you do, you enable the compiler to catch unintended changes to member
    variables, instead of letting these errors show up when your program is running.


    # Interface Versus Implementation


    The parts of a program that create and use objects are the clients of the class.
    The class declaration serves as a contract with these clients. The contract tells
    clients what data the class has available and what the class can do.


    For example, in the Tricycle class declaration, you promise in the contract that
    every Tricycle object will be able to retrieve its speed, that you can initialize
    the speed at const and retrieve it, and that every Tricycle will know how to pedal()
    and brake().


    If you make getSpeed() a const function, the contract also promises that it won''t
    change the Tricycle on it is called.


    # Organizing Class Declarations and Function Definitions


    Class definitions are often kept separate from their implementations in the source
    of C++ programs. Each function that you declare for your class must have a definition.
    Like functions, the definition of a class has a header and a body.


    The definition must be in a file that the compiler can find. Most C++ compilers
    want that file to end with .cpp.


    Although you can put the declaration in the source code file, a convention that
    most programmers adopt is putting the declaration in a header file with the same
    name ending in .hpp (or less commonly .h or .hp).


    So if you put the declaration of the Tricycle class in a file named Tricycle.hpp,
    the definition of the class functions will be in Tricycle.cpp. The header file
    can be incorporated into the .cpp file with a preprocessor directive:

    #include "Tricycle.hpp"


    The reason to separate them is because clients of a class don''t care about the
    implementation specifics. Everything they need to know is in the header file.


