    To understand why it is more efficient to initialize member variables than assign
    to them, you must understand the copy constructor.


    # The Copy Constructor


    In addition to providing a default constructor and destructor, the compiler provides
    a default constructor. The copy constructor is called every time a copy of an
    object is made.


    When you pass an object by value, either in a function or as a function''s return
    value, a temporary copy of that object is made. If the object is user-defined
    object, the class''s copy constructor is called.


    All copy constructors take one parameter: a reference to an object of the same
    class. It is a good idea to make it a constant reference, because the constructor
    will not have to alter the object passed in. For example:


    ```

    Tycle(const Triangle&other);

    ```


    In this statement the Triangle constructor takes a constant reference to an existing
    Triangle object. The goal of the constructor is to make a copy of tri.


    The default constructor simply copies each member variable from the object passed
    as a parameter to the member variables of the new object. This is a shallow (member-wise)
    copy. This is fine for most member variables, it does not work for member variables
    that are pointers to objects on the heap.


    A shallow copy copies the exact values of one object''s variables into another.
    Pointers in both objects pointing to the same memory. A deep copy, on the other
    hand, copies the values allocated on the heap to newly allocated memory.


    An example illustrates the problem: If the Triangle class includes a member variable
    called durability pointing to an integer on the heap, the default constructor
    copies the passed-in Triangle''s durability variable to the new Triangle''s durability
    variable. The two objects point to the same memory, as illustrated in Figure 14.1.'
