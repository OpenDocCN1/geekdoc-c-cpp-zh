  md: "Encapsulation of a class makes it possible for other programs to use the class\
    \ without knowing how it works. Users of your class only need to know what it\
    \ does, not how it does.\n\nThe variables of the class are called its member variables.\
    \ A Tricycle might have member variables representing the wheel size, top speed,\
    \ and whatever base-ball card has been embedded in the spokes.\n\nMember variables,\
    \ also known as data members or instance variables, are part of your class, just\
    \ like the wheel and brake are part of a trike.\n\nThe functions in the class\
    \ use and modify the member variables. They are called the member functions (or\
    \ methods) of the class. Member functions of the Tricycle class might include\
    \ pedal() and brake().\n\nMember functions are as part of your class as member\
    \ variables. They determine what the objects of your class can do.\n\n# Declaring\
    \ a Class\n\nTo declare a class, use the class keyword followed by information\
    \ about the member variables and member functions of the class. An opening brace\
    \ and closing brace enclose the class. Here is an example for a Tricycle class:\n\
    \n```\nclass Tricycle{\npublic:\n    unsigned speed;\n    unsigned wheelSize;\n\
    \    pedal();\n    brake();\n};\n```\n\nThis code creates a class Tricycle with\
    \ two member variables, speed and wheelSize, and two functions, pedal() and brake().\
    \ All four can be used by other classes because the public keyword precedes them\
    \ in the class definition. You learn more about this keyword in the hour.\n\n\
    Declaring this class does not allocate memory for a Tricycle. It just tells the\
    \ compiler what data it contains (speed and wheelSize) and what it can do (pedal()\
    \ and brake()).\n\nIt also tells the compiler how much room the compiler must\
    \ set aside for each of the Tricycle objects that you create. In this example,\
    \ if an integer is 4 bytes, Tricycle is only 8 bytes big: 4 bytes and wheelSize\
    \ is another 4. The two functions take up no room because no storage is set aside\
    \ for member functions."
