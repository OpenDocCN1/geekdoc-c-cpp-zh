- img_proc: true
  md: 'achieve this because it covers standard C++ (also called ANSI/ISO C++), the
    internationally agreed-upon version of the language, which is portable to any
    platform and development environment.


    The code presented throughout the book is standard ANSI/ISO C++ and should work
    with any development environment for C++ that''s up-to-date.


    New features that will be part of C++0, the language''s next version, are also
    covered. Some of the most useful ones have begun showing up on an experimental
    basis in popular C++ development environments ahead of its scheduled release date
    in early 2012.


    C++ programs are developed by a set of tools that work together called the compiler
    and linker.


    A compiler turns C++ programs into a form that can be run. The compiler translates
    a program from human-readable source code into a machine-runnable form called
    machine code. The compiler produces an object file. A linker builds an executable
    file from the object file that can be run.


    There are several popular environments for C++ programming that you might have
    used before or know how to obtain. Some of these are GCC (the GNU Compiler), Microsoft
    Visual C++, NetBeans and Code::Blocks.


    If you have a C++ compiler on your system and know the basics of how to use it,
    you will have no trouble completing the programming projects in this book.


    If you don''t have a C++ compiler, don''t know how to use a compiler, or don''t
    know how to find one, relax. The next section will help.


    # Finding a Compiler


    The programs in this book were created and tested with GCC, a free and open source
    set of programming tools that support C++ software development. GCC is extremely
    popular on Linux and available for Windows and Mac OS systems, GCC works in a
    command-line environment where you type in a command to make the C++ compiler
    and linker create a program.


    Some computers have GCC installed along with the operating system.


    If you know how to use the command line on your system, you can type the following
    command to see whether GCC is installed:


    ```

    g++ --version

    ```'
