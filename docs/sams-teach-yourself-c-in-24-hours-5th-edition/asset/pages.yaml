  md: '# Simulating an Alarm System


    # Conceptualization


    In the conceptualization phase, you turn to understand what the customer hopes
    to gain from the program: What is this program for? What questions might this
    simulation answer? For example, you might be able to use the simulation to answer
    the questions, “How long might a sensor be before anyone notices?” or “Is there
    a way to defeat the window alarms without the police being notified?”


    The conceptualization phase is a good time to think about what is inside the program
    and what is outside. Are the police represented in the simulation? Control of
    the actual house alarm in the system itself?


    # Analysis and Requirements


    The conceptualization phase gives way to the analysis phase. During analysis,
    your job as object-oriented analyst is to help the customer understand what he
    requires from the program. Exactly what behavior will the program exhibit? What
    kinds of interactions can the customer expect?


    These requirements are typically captured in a series of documents. These documents
    might include use cases. A use case is a description of how the system will be
    used. It describes interactions and use patterns, helping the programmer capture
    the design of the system.


    | The Unified Modeling Language (UML) is one way of representing your requirements
    and analysis. The advantage of using UML to represent your information is twofold:
    it is graphical (easy to understand), and it follows a standard form (so many
    people will be able to understand it). Although it is beyond the scope of this
    book to teach UML (there are many good books on that topic alone), you should
    know that it includes ways of representing use cases. It is particularly suited
    for object-oriented development, because it supports abstract and other types
    of classes directly.


    One good resource is Sam Teach Yourself UML in 24 Hours, Third Edition (ISBN:
    0-672-32640-X), by Joseph Schmuller.


    > By the Way'
