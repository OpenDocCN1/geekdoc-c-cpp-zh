    knows to aside 4 bytes of memory because unsigned long takes 4 bytes. The compiler
    takes care of assigning the actual address.


    When a pointer is allocated, the compiler assigns enough memory to hold an address
    in your hardware and operating system environment. The size of a pointer might
    not be the same size as an integer, so be sure you make no assumptions.


