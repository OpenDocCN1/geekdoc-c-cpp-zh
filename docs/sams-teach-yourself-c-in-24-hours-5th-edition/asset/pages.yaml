  md: '# Other Bases


    It is not a coincidence that we use base 10; after all, our species has 10 fingers.
    One can imagine a different base, however. Using the rules found in base 10, here''s
    how you can describe base 8:


    +   1. The digits used in base 8 are 0–7.

    2. The columns are powers of 8: 1s, 8s, 64s, and so on.

    3. With n columns, you can represent 0 to 8~1.


    To distinguish numbers in each base, write the base as a subscript next to the
    number. The number fifteen in base 10 would be written as $15_{10}$ and read as
    “one, five, base ten.”


    Therefore, to represent the number $15_{10}$ in base 8, you would write $17_8$.
    This is “one, seven, base eight.” Note that it can also be read “fifteen,” because
    that is the number continues to represent.


    Why 17? The 1 means one, and the 7 means seven ones. One eight plus seven equals
    fifteen. Consider fifteen asterisks:


    ***** \*\*\*

    ***** \*\*\***


    The natural tendency is to make two groups, a group of ten asterisks and another
    of five. This would be represented in decimal as 15 (1 ten and 5 ones). You can
    also group the asterisks as follows:


    **** \*\*\*\*\*


    That is, eight asterisks and seven. That would be represented in base eight as
    $17_8$. That is, 1 eight and 7 ones.


    # Around the Bases


    You can represent the number fifteen in base 10 as 15, or $15_{10}$, in base 9
    as $16_9$, in base 8 as $17_8$, in base 7 as $21_7$. In base 7, there is no numerical
    8. To represent fifteen, you need two 7s and one 1.


    How do you generalize the process? To convert a base 10 number to base 7, think
    about the columns: In base 7, they are ones, sevens, seventy-nines, three-hundred
    forty'
