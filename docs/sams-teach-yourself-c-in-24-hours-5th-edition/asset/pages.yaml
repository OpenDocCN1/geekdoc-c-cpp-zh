    all the String accessors, can be getFirstName(), return a constant reference.

    Because operator+ can''t be a constant function because it changes the object
    it is called

    on, attempting to write the following causes a compile-time error:

    String buffer = edie.getFirstName() + edie.getLastName();


    The getFirstName() function returns a constant string; you can''t operator+

    on a constant object.


    To fix this, overload getFirstName() to be non-const:

    const String& getFirstName() const { return firstName; }

    String& getFirstName() const { return firstName; }


    Note that the return value is no longer const and that the member function itself
    is

    longer const. Changing the return value is not sufficient to solve the overload

    function; you must change the const of the function itself. Because both a

    and non-const version are provided, the compiler invokes the const version when

    everpossible (for example, when a client calls getFirstName()) and the non-const

    sed for example, when invoked operator+).


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_313_0.png)


    > It is important to note that the user of an Employee class pays the price of
    each

    ofose Strings every time one is constructed or a copy of the Employee

    is made.


    # Copying by Value Versus by Reference


    When you pass Employee objects by value, all their contained strings are copied

    well, and therefore copy constructors are called. this is very expensive; it takes

    memory and it takes time.


    When you pass Employee objects by reference using pointers or references, all
    this is

    saved. this is why C++ programmers work hard never to pass anything larger than
    a

    few bytes by value.


    # Friend Classes and Functions


    Sometimes you will create classes together, as a set. These paired classes might
    need

    access to one another''s private members, but you might not want to make that-

    ation public.


    If you want to expose your private member data or functions to another class,
    you

    must declare that class to be a friend. this extends the interface of your class
    to

    include the friend class.'
