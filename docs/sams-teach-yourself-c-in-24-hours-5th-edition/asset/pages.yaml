  md: '# HOUR 3: Creating Variables and Constants


    FIGURE 3.1

    A visual representation of memory.


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_39_0.png)


    # Storing Variables in Memory


    When you create a variable in C++, you must tell the compiler the variable''s
    name and what kind of information it will hold, such as an integer, character,
    or floating-point number. This is the variable''s *type* (sometimes called *data
    type*). The type tells the compiler how much room to set aside in memory to hold
    the variable''s value.


    Each cubthole in memory can hold 1 byte. If a variable''s type is 2 bytes in size,
    it needs 2 bytes of memory. Because computers use bytes to represent values, it
    is important that you familiarize yourself with this concept.


    A short integer, represented by short in C++, is usually 2 bytes. A long integer
    (long) is 4 bytes, an integer (int) can be 2 or 4 bytes, and a long long is 8
    bytes.


    Characters of text are represented by the char type in C++, which is usually 1
    byte in size. In Figure 3.1 shown earlier, each cubthole holds 1 byte. A single
    short integer can be stored in addresses 106 and 107.


    True-false values are stored as the bool type. The values *true* and *false* are
    the only values it can hold.


    The size of a short is always smaller or the same as an int. The size of an int
    is always the same or smaller than a long. Floating-point numeric types are different
    and discussed later this hour.


    The usual types so far described do not hold on all systems. You can check the
    size of a type in C++ using *sizeof()*, an element of the language called a *function*.
    The parentheses that follow *sizeof* should be filled with the *name of* a type,
    as in this statement:


    ```

    std::cout << sizeof(int) << "\n";

    ```'
