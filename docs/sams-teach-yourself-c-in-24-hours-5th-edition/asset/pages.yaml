  md: '# Summary


    Operator overloading is one of the most powerful aspects of the C++ language.
    By defining how operators behave in the classes that you design, you make it easier
    to work with those classes.


    Almost all operators in C++ can be overloaded.


    As you have seen in working with built-in types, using operators to manipulate
    objects is considerably easier than calling member functions. It also results
    in programs that are easier to comprehend.


    This assumes, of course, that the behavior of overloaded operators is consistent
    with how they work on built-in types.


    # Q&A


    +   Q. Why would you overload an operator when you can just create a member function?


    +   A. It is easy to use overloaded operators when their behavior is well understood.
    Less code is required to accomplish the same task, and your classes can mimic
    the functionality of the built-in types.


    +   Q. What is the difference between the copy constructor and the assignment
    operator?


    +   A. The copy constructor creates a new object with the same values as an existing
    object. The assignment operator changes an existing object so that it has the
    same values as another object.


    +   Q. What happens to the `int` used in the postfix operators?


    +   A. Nothing. That `int` is never used, except as a flag to overload the postfix
    and prefix operators.


    +   Q. Who was Alanis Morissette singing about in ''You Oughta Knew''?


    +   A. The incendiary breakup song from her 1995 album Jagged Pill, which reached
    No. 1 and has sold more than 33 million copies, was about a real person she dated.
    Morissette admitted that much in interviews but has never publicly identified
    the person.'
