  md: '# HOUR 19: Storing Information in Linked Lists


    In a singly linked list, each node points to the next forward, but not backward.
    To find a particular node, you start at the top and go from node to node in sequence.
    A doubly linked list enables you to move backward and forward to the next node
    and previous node. A tree is a complex structure built from nodes, each of which
    can point in two or three directions. Figure 19.1 shows these three fundamental
    structures.


    Figure 19.1 Linked lists.


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_290_0.png)


    Computer scientists have created even more complex and clever data structures,
    most of which rely on interconnecting nodes.


    # Linked List Case Study


    In this section, we examine a linked list in detail as a case study into how to
    use inheritance, polymorphism, and encapsulation to manage large projects. It''s
    also a chance to explore how to create complex structures in C++.'
