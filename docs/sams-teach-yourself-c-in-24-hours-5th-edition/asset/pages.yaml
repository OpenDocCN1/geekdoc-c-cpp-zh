  md: '# Creating New Types


    As you work with built-in types in C++, each variable''s type tells you quite
    a bit about it. For example, if you write a program with height and width declared
    as unsigned integers, you know that each variable can hold a number between 0
    and 65,535.


    The type also tells you capabilities of the variable. Short integers can be added
    together, by declaring height and width as that type, you know they can be added
    together.


    The type of a variable tells you several things:


    +   * Its size in memory

    * The information it can hold

    * The actions that can be performed on it


    In C++, you define your own types to model a problem you are trying to solve.
    The mechanism for declaring a new type is to create a class. A *class* is a definition
    of a new type.


    # Classes and Members


    A C++ class is a template used to create objects. Once you define a class, objects
    created from that class can be put to use like any other data type.


    A class is a collection of related variables and functions bundled together. The
    variables can be of any other type, including other classes. Variables make up
    the data in the class, and functions perform tasks using that data. Bundling these
    together is called *encapsulation*.


    This will make sense in relation to a real object, such as the red tricycle my
    parents left behind during a move out of Wichita Falls, Texas, when I was 4 years
    old. (The U-Haul out of room is a tough subject for me.)


    One way to think about a trick is that it''s a collection of objects connected—wheels,
    a seat, handlebars, and pedals. Another way is in terms of what it can do: move,
    accelerate, stop, and impress 4-year-old girls.


    Combining these together—the physical aspects and performance—is encapsulating
    the object.'
