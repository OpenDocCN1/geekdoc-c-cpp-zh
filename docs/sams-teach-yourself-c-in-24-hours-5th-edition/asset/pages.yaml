  md: '# HOUR 24: Dealing with Exceptions and Error Handling


    the algorithms properly. The second is syntactic: You used the wrong idiom, function,
    or structure. These two are the most common, and they are the most program-mers
    on the lookout for. Far harder to find are subtle bugs that pop up only when the
    user does something unexpected. These little logic bombs can lur until they are
    finally encountered and the program blows up.


    Research and real-world experience have consistently shown that the later in the
    development process you find a problem, the more it costs to fix it. The last
    expense-problems or bugs to fix are the ones you manage to avoid creating. The
    next cheapest are those that the compiler spots. The C++ standards compilers to
    put a lot of energy into reporting and more errors at compile.


    Bugs that are caught at the first test—those that crash every time—are less expensive
    to find than those that crash once in a while.


    A bigger problem than logic or syntactic bugs is unnecessary fragility: Your programs
    work just if the user enters a number when you ask for, but if it crashes the
    user enters letters. Other programs crash if they run out of memory, or if the
    floppy disk is out of the drive, or if the modern drive drops the line.


    To combat this kind of fragility, programmers strive to make their programs bullet-proof.
    A bulletproof program is one that can handle anything that comes at run time,
    from bizarre user input to running out of memory. If you watch out and pre-pare
    for these things, you can avoid a crash.


    It is important to distinguish among bugs. Some arise because the programmer made
    a mistake in syntax. There are also errors that arise because the programmer misunderstood
    the problem or how to solve it. Finally, other exceptions arise because of unusual
    but predictable problems such as running out of resources (mem-ory or disk space).


    # Handling the Unexpected


    Programmers use design reviews and exhaustive testing to find logic errors.


    Exceptions are different, however. You can''t eliminate exceptional circumstances;
    you only can prepare for them. For example, user computers will run out of memory
    from time to time. That''s not something a programmer can prevent. Programs only
    can respond to when it occurs, using one of these approaches:


    +   - Crash the program.


    +   - Inform the user and exit gracefully.'
