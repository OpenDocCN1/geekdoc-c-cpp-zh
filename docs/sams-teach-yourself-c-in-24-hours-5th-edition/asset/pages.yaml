  md: '**Q. Given the problems with overloaded methods, why not always use default
    values instead?


    **A. Overloaded methods supply capabilities not available with default variables,
    such as varying the list of parameters by type rather than just by number.


    **Q. When writing a constructor, how do you decide what to put in the initialization
    and what to put in the body of the constructor?**


    **A. A simple rule of thumb is to do as much as possible in the initialization
    phase and initialize all member variables there. Some things such as computations
    and std::cout must be in the body of the constructor.**


    **Q. Can an overloaded method have a default parameter?**


    **A. Yes. There is no reason to combine these powerful features. One or more of
    the overloaded methods can have their own default values, following the normal
    rules for defaults in any method.**


