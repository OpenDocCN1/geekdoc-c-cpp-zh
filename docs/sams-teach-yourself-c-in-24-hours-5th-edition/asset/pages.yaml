    types, the reference acts as an alias to the object.


    # Null Pointers and Null References


    When pointers are not initialized, or when they are deleted, they ought to be
    assigned to NULL. This is not true for references. In fact, a reference cannot
    be null, and a program with a reference to a null object is considered an invalid
    program. When a program is invalid, just about anything can happen. It can appear
    to work, or it can erase important files on your hard drive. Both are possible
    outcomes of an invalid program.


    Most compilers support null references without much complaint, crashing only if
    you try to use the reference in some way. Taking advantage of this, however, is
    not a good idea. When you move your program to another computer or a different
    compiler, mysterious bugs might occur if you have null references.


    # Passing Function Arguments by Reference


    In Hour 5, “Calling Functions,” you learned that functions have two limitations:
    Arguments are passed by value and the return statement can only return one value.


    Passing values to a function can overcome both of these limitations. In C++, passing
    by reference is accomplished in two ways: using pointers and references. The syntax
    is different, but the net effect is the same: Rather than a copy being created
    within the scope of the function, the actual object is passed into the function.


    Passing an object by reference enables the function to change the object being
    referred to.'
