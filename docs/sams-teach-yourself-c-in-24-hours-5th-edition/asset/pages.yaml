    Ø x 8 = 0

    1 x 16 = 16

    Ø x 32 = 0

    1 x 64 = 64

    1 x 128 = 128

    1 x 256 = 256

    Ø x 512 = 0

    Ø x 1024 = 0

    Ø x 2048 = 0

    1 x 4096 = 4,096

    1 x 8192 = 8,192

    Ø x 16384 = 0

    1 x 32768 = 32,768

    Total: 45,527


    Converting this to hexadecimal requires a chart with the hexadecimal values:

    65535 4096 256 16 1


    There are no 65,536s in 45,527, with a remainder of 471. There is one 256 in 471
    with a remainder of 215. There are 13 16s (D8) in 215 with a remainder of 7. Thus,
    the hexadecimal number is B1D7.


    Checking the math:

    B (11) * 4096 = 45,056

    D * 256 = 256

    D (13) * 16 = 208

    7 * 1 = 7

    Total: 45,527


    The shortcut is to take the original binary number, 1011000111011010111, and break
    it into groups of four: 0011 0101 0111. Each of the four is then evaluated as
    a hexadecimal number:


    ```

    1011 =

    01 x 1 = 1

    1 x 2 = 2

    0 x 4 = 0

    1 x 8 = 8

    Total: 11

    Hex: B

    ```


    ```

    0001 =

    01 x 1 = 1

    0 x 2 = 0

    0 x 4 = 0

    0 x 8 = 0

    Total: 1

    Hex: 1

    ```'
