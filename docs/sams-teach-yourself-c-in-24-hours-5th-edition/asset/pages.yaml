    # Compile-Time Constant Expressions


    C++ compilers do everything they can to make programs run faster, optimizing the
    code that you''ve written wherever. One opportunity for increased efficiency is
    when two constants are added together, in this sample code:


    ```

    const int decade = 10;

    int year = 2011 + decade;

    ```


    Because both halves of the expression 2011 + decade are constants, compilers evaluate
    the expression and store it in compiled form as the result 2021. The compiler
    acts as if year were assigned the value 2021.'
