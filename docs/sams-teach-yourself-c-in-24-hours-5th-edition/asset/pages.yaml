    Although it''s considered poor programming practice, a variable can be used as
    a very small integer. Each character has a numeric value equal to its ASCII code
    in that character set. For example, the exclamation point (!) has the value 33.


    # Defining a Variable


    A variable is defined in C++ by stating its type, the variable name, and a colon
    to end the statement, as in this example:


    ```

    int highScore;

    ```'
