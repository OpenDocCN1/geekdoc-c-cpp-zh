  md: '# Reasons to Use C++


    cated, break them down into even smaller tasks. The end goal is tasks that are
    small and self-contained enough to be easily understood.


    As an example, pretend you''ve been asked by this publisher to write a program
    that tracks the average income of its team of enormously talented and underately
    good-looking customer authors. This job can be broken down into these subtasks:


    +   1. Find out what each author earns.

    2. Count how many authors the publisher has.

    3. Total all their income.

    4. Divide the total by the number of authors.


    Totaling the income can be broken down into the following:


    +   1. Get each author''s personnel record.

    2. Access the author''s book advances and royalties.

    3. Deduct the cost of morning coffee, corrective eyewear and therapy.

    4. Add the income to the running total.

    5. Get the next author''s record.


    In turn, obtaining each author''s record can be broken down into these subtasks:


    +   1. Open the file folder of authors.

    2. Go to the correct record.

    3. Read the data from disk.


    Although structured programming has been widely used, the tasks, some drawbacks
    attach to the approach. The separation of data that manipulate the data becomes
    harder to work with as the amount of data grows. The more things must be done
    with data, the more confusing a program becomes.


    Procedural programmers often find themselves reinventing new solutions to old
    problems instead of producing reusable programs. The idea behind usability is
    to build program components that can be plugged into programs as needed. This
    approach models the physical world, where devices are built out of individual
    parts that each perform a specific task and have already been manufactured. person
    designing a bicycle doesn''t have to create a break system from scratch.'
