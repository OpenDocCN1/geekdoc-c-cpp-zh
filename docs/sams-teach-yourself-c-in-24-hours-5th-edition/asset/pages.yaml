  md: '# Q. Is percolating upward always a good thing?


    A. Yes, if you are percolating shared functionality upward; no, if all you are
    moving an interface. If all the derived classes can''t use the member function,
    it is a mistake to move it up into a common base class. If you do, you must check
    the runtime type of the object before deciding whether you can invoke the function.


    # Q. Why is dynamic casting?


    A. The point of virtual functions is to let the virtual table, rather than the
    programmer, determine the runtime type of the object.


    # Q. Why bother making an abstract data type? Why not just make it nonabstract
    and avoid creating any objects of that?


    A. The purpose of the conventions in C++ is to enlist the compiler in finding
    bugs in completed code. Making a class abstract by giving it virtual functions
    causes the compiler to flag any objects created of abstract type as errors. It
    also means that you can share the abstract data types with other applications
    or programmers.


    # Q. Has anyone ever studied Silbo, the whistled language used on Gomera in the
    Canary Islands?


    A. The best reference on the topic of Silbo Gomero and similar forms of speech
    is Whistled Languages, a 1976 book by R. G. Busnel and A. Classe that''s available
    at many public libraries.

    Silbo allows shepherds to communicate over deep ravines and narrow valleys at
    distances of 3 miles or more. The language has fallen into disuse on the island
    of 21,000.


    The disappearance of rural society and the introduction of the telephone reduced
    the Gomeran whistle to being used primarily in demonstrations (although these
    days schoolchildren are being taught it).


    A speaker of Silbo Gomero is referred to in Spanish as a silbador.'
